# Runbook conformance example. Generated once at design time; frozen by the
# digests in `binds`. docs/runbook-execution.md explains every field.
schema: crypto.autoresearch.runbook.v1
experiment_id: EXAMPLE-toy-ecdlp-bsgs
session_id: RBS-EXAMPLE-b301f5
title: Solve twelve seeded toy discrete logarithms by baby-step giant-step, with two controls
purpose: >-
  Conformance example for mechanical-tier runbook execution. Twelve seeded discrete
  logarithms on a 20-bit prime-order curve are solved by baby-step giant-step and their
  group operations recorded, beside a planted-logarithm positive control and an off-curve
  negative control. It exercises the runbook machinery and tests no research hypothesis.
executor_tier: mechanical
approval:
  mode: example
binds:
  - path: examples/runbooks/toy-ecdlp-bsgs/curve.json
    sha256: a172de7c7ddeab0fe49ed50d95cbd640cce1f98bfa38ee93495d67fed8d601fb
  - path: examples/runbooks/toy-ecdlp-bsgs/solve.py
    sha256: d13b05f89ff51207b861adf5137372320cbcecfb0fa7ec91872ecabb09fe49e3
  - path: examples/runbooks/toy-ecdlp-bsgs/check.py
    sha256: 65f75ca332d4dc0387b58381c6e0d2323176e032b3b6f65fdc40309b1fc47ed1
  - path: examples/runbooks/toy-ecdlp-bsgs/trial-plan.json
    sha256: 2b4659f46ad25d189b92b9b2bdc5a6e2db38241d3d83afc9bff0ace72e99b81f
  - path: examples/runbooks/toy-ecdlp-bsgs/README.md
    sha256: efb4cc2737b3cd1421d42442d7130e6813ae2e6b2b22bc84e0741eade9b7ed53
  - path: formal/targets/runbook-example-bsgs-coverage.yaml
    sha256: 1dbdf3d94890283a35f6c494fbd7a2c7e06a8cbe18f29f7a09b274ffb41e083a
  - path: formal/CryptoResearch/Runbook/BsgsCoverage.lean
    sha256: 867ce0f37099a30b34ce7d603549eb8b28f16b1c17183119657715108f79d9d0
spec_bindings:
  - file: examples/runbooks/toy-ecdlp-bsgs/curve.json
    pointer: /n
    equals: 1047689
  - file: examples/runbooks/toy-ecdlp-bsgs/curve.json
    pointer: /p
    equals: 1048571
environment:
  programs: [python3]
  env:
    PYTHONHASHSEED: "0"
steps:
  - id: S01-probe-python
    kind: command
    purpose: probe
    title: Record the interpreter that runs every later step
    explain: Writes the python3 version and platform to environment.json in this step's output directory.
    argv:
      - python3
      - -c
      - "import json, platform, sys; json.dump({'python': platform.python_version(), 'major': sys.version_info[0], 'implementation': platform.python_implementation()}, open(sys.argv[1], 'w'))"
      - "{out}/environment.json"
    timeout_seconds: 60
    validity:
      exit_code: 0
      outputs:
        - path: "{out}/environment.json"
          json: true
          assertions:
            - {pointer: /major, equals: 3}
            - {pointer: /implementation, equals: CPython}
    tell_on_failure: python3 did not run. The session has stopped; report this step's stderr log path.
  - id: S02-solve
    kind: trials
    title: Run the fourteen trials of the frozen plan and record each unit
    explain: Runs solve.py then check.py for every trial in trial-plan.json, each in its own write-once directory.
    plan: examples/runbooks/toy-ecdlp-bsgs/trial-plan.json
    engine: local
    timeout_seconds: 600
    validity:
      files:
        - path: manifest.yaml
        - path: raw-result.json
          json: true
          assertions:
            - {pointer: /schema, equals: example.toy_ecdlp_bsgs.result.v1}
            - {pointer: /trial_id, equals: "{trial_id}"}
            - {pointer: /curve/p, equals: 1048571}
            - {pointer: /curve/a, equals: 3}
            - {pointer: /curve/b, equals: 20}
            - {pointer: /curve/n, equals: 1047689}
            - {pointer: /curve/G, equals: [2, 199837]}
            - {pointer: /group_ops, type: integer}
            - {pointer: /elapsed_ms, type: integer}
    by_trial:
      s01:
        files:
          - path: raw-result.json
            json: true
            assertions:
