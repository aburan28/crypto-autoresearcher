    unit: group operations
    label: measured
    step: S02-solve
    file: raw-result.json
    pointer: /group_ops
    aggregate: [count, mean, median, min, max]
  - name: giant_steps
    unit: group operations
    label: measured
    step: S02-solve
    file: raw-result.json
    pointer: /giant_steps
    aggregate: [mean, min, max]
  - name: solved_fraction
    unit: fraction of search trials
    label: derived
    step: S02-solve
    file: raw-result.json
    pointer: /verified
    aggregate: [fraction_true, count]
report:
  graph_metric: group_ops
