          pointers: [/Q, /status, /k_found, /verified, /m, /baby_steps, /giant_steps, /group_ops, /setup_ops]
    tell_on_failure: A trial output failed its validity checks. The session has stopped; report the unit details printed by status --brief.
  - id: S03-lean-coverage
    kind: lean
    title: Machine-check the coverage identity that makes an unsolved instance a defect
    explain: Builds the Lean target runbook-example-bsgs-coverage and audits its axioms; records unavailable where Lean is not installed.
    task_file: formal/targets/runbook-example-bsgs-coverage.yaml
    required: false
    timeout_seconds: 1800
metrics:
