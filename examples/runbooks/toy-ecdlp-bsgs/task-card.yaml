# Mechanical task card for the runbook conformance example. Written by the
# experiment-director tier; `python3 tools/task_card.py lint` accepts it and
# `python3 tools/task_card.py prompt` prints the exact text the main session
# relays to executor-mechanical. docs/model-tiers.md explains every field.
schema: crypto.autoresearch.mechanical-task-card.v1
card_id: CARD-EXAMPLE-toy-ecdlp-bsgs-01
experiment_id: EXAMPLE-toy-ecdlp-bsgs
author_role: experiment-director
executor_role: executor-mechanical
kind: runbook
runbook: examples/runbooks/toy-ecdlp-bsgs/runbook.yaml
runbook_sha256: b78fdf211fb24c3306206e822eb6fe93f56f467422616919203c55cc9ff69c0c
bus_address: executor-mechanical-example
background: false
write_scope:
  - examples/runbooks/toy-ecdlp-bsgs/runbook-sessions/
  - examples/runbooks/toy-ecdlp-bsgs/reports/
stop_when:
  - The last line of step 1 does not begin with LINT OK.
  - Step 2 exits with status 2.
  - Step 3 does not print VERIFY OK.
  - Page 1 of the report does not show EXAMPLE-toy-ecdlp-bsgs and the session directory.
