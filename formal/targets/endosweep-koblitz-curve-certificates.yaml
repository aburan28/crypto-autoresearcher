notes: |
  This is a numeric certificate, checked by `decide +kernel` on generated
  constants. n and h are the published orders and cofactors, from std-curves
  commit 77fe6e3585ca2c2225b59d7df24b7c775437276f, the commit nist.json
  records. K-163's n is also cross-checked against
  tests/test_endosweep.py. t, f, delta and lambda come from nist.json.

  It certifies the arithmetic behind four of the README's checks: "#E from
  the Lucas sequence equals h*n", "h = #E(F_2)", "N(delta) = n", and the
  eigenvalue being a root of lambda^2 - mu*lambda + 2 (mod n).

  It does NOT certify any point-level check: tau^2 - mu*tau + 2 = 0 on
  points, tau(G) = [lambda]G, n prime, or that the curve has h*n points.
  Those are the harness's.
claim: |
  For K-163, K-233, K-283, K-409 and K-571 (m, mu = 1 if a = 1 else -1, the
  published n and h, and t, f, delta, lambda from nist.json): mu = +-1;
  h = 3 - mu = #E(F_2); h*n = 2^m + 1 - V_m; t = V_m;
  delta*(tau - 1) = tau^m - 1 and N(delta) = n; t^2 - 4*2^m = -7*f^2 with
  f = |B| where tau^m = A + B*tau; and lambda^2 - mu*lambda + 2 = 0 (mod n).
  Consequently N(1 - tau^m) = h*n and N(delta)*N(tau - 1) = h*n.
