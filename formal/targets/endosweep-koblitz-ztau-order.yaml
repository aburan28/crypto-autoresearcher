notes: |
  This is finding 1: "Z[tau] has the fundamental discriminant mu^2 - 8 = -7,
  so it is the maximal order". The theorem gives an explicit ring
  isomorphism, preserving the norm, between Z[tau] modelled as pairs
  (binary.Ztau) and Z[omega] with omega^2 = omega - 2, the order quadorder
  uses for D = -7. The same file proves the companion facts: disc_tau
  (trace^2 - 4*norm of tau is -7) and isFundamental_neg_seven.

  Not formalised: "the order of a fundamental discriminant is the maximal
  order" (classical) and End(E) = Z[tau] (elliptic-curve theory).
claim: |
  For mu = 1 or -1, let Z[tau] = Z[x]/(x^2 - mu*x + 2). Its discriminant is
  mu^2 - 8 = -7, which is fundamental, and Z[tau] is the order of
  discriminant -7: the change of basis tau -> omega + (mu - 1)/2 is a
  bijection carrying the multiplication and norm of Z[tau] to those of
  Z[omega], omega^2 = omega - 2.
