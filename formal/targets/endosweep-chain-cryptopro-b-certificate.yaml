notes: |
  Certifies the ARITHMETIC of the recorded eigenvalues, GLV bases and test
  vectors of all 22 frozen orderings (11 elements), not the isogeny
  computation: that a closed walk exists, is an endomorphism and acts on points
  as the recorded scalar is checked by the harness on points and is not a Lean
  claim. Primality of n is not claimed. Also cross-checks the two chains
  exported in research/endosweep_20261005 against the chain sweep's root.
claim: |
  GOST CryptoPro-B (D = -619, omega = (1 + sqrt(-619))/2, omega^2 = omega - 155):
  the recorded omega_root lambda satisfies lambda^2 - lambda + 155 = 0 (mod n);
  for each of the 22 orderings in chains.constants.json, N(a + b*omega) equals
  the recorded norm and the product of the step degrees (N(4 + omega) = 175 =
  7*5*5, N(9 + omega) = 245); the matched element is +-(a + b*omega); the
  recorded eigenvalue equals a' + b'*lambda mod n for the matched element and is
  a root of its characteristic polynomial; both vectors of the recorded GLV
  basis lie in the relation lattice with determinant +-n; and both test vectors
  satisfy k = k1 + k2*eigenvalue (mod n). ("381 of 381 verified ... action as
  the predicted scalar on a point of prime order, and an end-to-end GLV-2
  reconstruction"; "Every ordering of one element acts as the same scalar up
  to sign".)
