notes: |
  General lemma behind "the reduced GLV basis" recorded per ordering in
  chains.constants.json: membership of both vectors in the relation lattice
  plus |det| = n is enough for them to be a basis of it (Cramer's rule). The
  per-ordering hypotheses are discharged for all 22 recorded bases in
  cryptopro_b_chain_certificate. Not claimed: reducedness, the Babai bound.
claim: |
  Let n != 0 and e be integers, and let b1, b2 in Z^2 satisfy
  b_i.1 + b_i.2 * e = 0 (mod n) and det[b1 b2] = +-n. Then for all (x, y),
  x + y*e = 0 (mod n) if and only if (x, y) is an integer combination of b1 and
  b2; i.e. {b1, b2} is a basis of the GLV relation lattice
  {(k1, k2) : k1 + k2*lambda = 0 (mod n)} recorded as `glv_basis`.
