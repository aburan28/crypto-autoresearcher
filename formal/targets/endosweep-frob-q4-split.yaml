notes: |
  frobenius.py's q4_koblitz_split checks this for the 28 primes m in 67-199.
  The theorem holds for EVERY odd m >= 5. The bound is needed, and
  endosweep-frob-q4-small-m records the exceptions m = 2 and m = 3.
  q4_not_prime is the corollary that n4 is not prime (elementary primality,
  defined in the file). The Hasse bound enters as the arithmetic consequence
  V_k^2 <= 4 q^k of t^2 < 4q (theorem hasse); it is not assumed.
claim: |
  q = 4 with t = -3 can never have prime n: n = [#E(F_{2^m})/#E(F_2)]
  [#E'(F_{2^m})/#E'(F_2)]. Precisely, for every odd m >= 5, with
  n4 = (4^m + 1 - V_m(4,-3)) // 8, n_a = (2^m + 1 - V_m(2,1)) // 2 and
  n_b = (2^m + 1 - V_m(2,-1)) // 4, the divisions are exact,
  n4 = n_a n_b, n_a > 1 and n_b > 1.
