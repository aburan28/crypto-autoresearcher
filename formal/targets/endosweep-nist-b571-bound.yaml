notes: |
  The theorem takes two explicit hypotheses, and both are visible in its
  statement:
    (i) IsPrimeNat 5608493523058319 and IsPrimeNat 3563521804312876303.
        PARI isprime proved these; Lean does not. 137 and 1502689 ARE
        proved prime in Lean, by trial division.
    (ii) The 130-digit cofactor C has no divisor d with 1 < d < 10^7. This
        is the harness's trial division. Checking it in the kernel would
        take about 10^7 reduction steps, which is out of reach, so it stays
        a hypothesis.
  The kernel checks everything else: 4q - t^2 = P*C, gcd(P, C) = 1, that C
  has 130 digits, that C is not a square (floor(sqrt C)^2 < C <
  (floor(sqrt C) + 1)^2), that P*10^7 is nist.json's abs_D_K_at_least, that
  a quarter of it is min_nonscalar_degree_at_least, and that these exceed
  2^164 and 2^162. The two comparisons 2^164 < absDKAtLeast and
  2^162 < degAtLeast are the companion theorem B571.bound_values, not part of
  abs_DK_lower_bound's statement.

  "C is composite" in the claim comes from PARI (isprime(C) = false). Lean
  does not certify it, and the bound does not use it: the theorem needs only
  that C is not a square and has no divisor below 10^7.

  The conclusion is stronger than the README needs. It holds for EVERY
  integer factorisation t^2 - 4q = D f^2, so it covers D_K and the
  discriminant of every order between Z[pi] and O_K.

  This is a bound, not D_K. The README said "B-571 is bounded, not
  settled" when this target was written.

  SUPERSEDED 2026-10-16 by the exact certificate. CADO-NFS split C into two
  primes of 38 and 93 digits (C = p38 * p93; Lean checks this as
  B571.C_split). B-571 is now B571Exact in factoredCerts, so
  exact_discriminants (endosweep-nist-exact-discriminants) gives the exact
  D_K = -(4q - t^2), f = 1 and min_nonscalar_degree(D_K) about 2^570.4. The
  bound stays: it is still true, with the same explicit hypotheses, and
  both hypotheses now also follow from the complete certificate (p38 and p93
  exceed 10^7). C and the four known primes are no longer read from a
  partial certificate. The generator derives them from the complete one.
  The partial record left factorizations.jsonl, and nist.json no longer has
  a bound entry. absDKAtLeast is checked against the literal value below.
claim: |
  B-571: 4q - t^2 = 137 * 1502689 * 5608493523058319 * 3563521804312876303 * C,
  where C is a 130-digit composite that is not a perfect square and has no
  prime factor below 10^7. Its squarefree part is therefore at least 10^7,
  so |D_K| is at least the product of the four primes times 10^7, about
  2^164.8 (41144834294568711165300914428595243383362010000000). Every
  non-scalar endomorphism has degree above 2^162: min_nonscalar_degree is at
  least 10286208573642177791325228607148810845840502500000.
