notes: |
  These are the numbers in finding 3, checked by the kernel on the generated
  constants. The degree reading ("every non-scalar endomorphism has degree
  at least ...") combines three theorems: this one,
  exact_discriminants (deg = min_nonscalar_degree(D_K)), and
  Discriminant.minNonscalarDegree_isLeast (that value is the least
  non-scalar norm of the order of discriminant D_K). The step from norms to
  endomorphism degrees is not formalised.

  "Field of 224 bits or more" is stated as q >= 2^223. The conductor values
  are the f with t^2 - 4q = D_K f^2. "End(E) is Z[pi]" when f = 1 is
  elliptic-curve theory and not part of the statement.
claim: |
  On P-192 ... P-521, B-163 ... B-409, Curve25519 and Curve448: |D_K| lies
  between 2^162 and 2^523; min_nonscalar_degree(D_K) is at least 2^160, and
  at least 2^220 on every curve whose field has 224 bits or more; the
  conductor f is 1 on P-192, P-256, P-384, P-521 and B-163 to B-409, 3 on
  P-224, and 2 on Curve25519 and Curve448.
