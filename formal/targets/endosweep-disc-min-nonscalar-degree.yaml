notes: |
  The closed form behind every "a non-scalar endomorphism has degree at least"
  entry of the README's Results table, and finding 6's fix to
  harness/endosweep/quadorder.py. The code's docstring derives it by
  completing the square. The README says a test checks it against brute force
  for every discriminant down to -3000. The Lean statement holds for EVERY
  negative discriminant.

  The definitions transcribe the code. omegaTrace D = D % 2 (Python's % on a
  negative D is Lean's Int.emod). omegaNorm D = (tau^2 - D)/4. norm D a b =
  a^2 + ab*tau + b^2*N(omega). minNonscalarDegree D = (|D| + D % 2)/4, which
  is the code's exact floor division of a non-negative number.

  Scope: this is about the norm form of the order. That the degree of an
  endomorphism equals the norm of the ring element is standard theory and is
  not formalised.
claim: |
  Let D < 0 with D = 0 or 1 (mod 4), let tau = D mod 2, and let O_D = Z[omega]
  with omega^2 = tau*omega - (tau^2 - D)/4. Then every element a + b*omega of
  O_D with b != 0 has norm N(a + b*omega) = a^2 + a*b*tau + b^2*(tau^2 - D)/4
  at least (|D| + (D mod 2))/4, and omega (a = 0, b = 1) attains this value.
  Hence min_nonscalar_degree(D) = (|D| + (D mod 2))/4 is exactly the least
  norm of an element of O_D outside Z.
