notes: |
  This additive target covers only the n=4, n'=4, seed-index-1, x_R=1
  Boolean toy system. The generated Lean file checks literal rows against
  the parity routine, invertibility of explicit elimination matrices and
  echelon pivots. Mathlib equates the resulting matrix ranks with dimensions
  of actual F2 row spaces. The companion executableRankMatchesSemantic
  theorem checks that the earlier Nat rank routine gives the same three
  ranks for degree one, degree two and degree-two projection. The exact
  degree-two rank difference is zero.

  This is not generic rankOn correctness, a degree-three matrix-rank proof,
  a generic S3 descent, a solving-degree claim, or an ECDLP cost result.
  Independent semantic review is still required.
claim: |
  For the fixed source-bound Semaev sample, the actual F2 row-space ranks
  at degree one, degree two, and degree-two projection are 1, 11, and 10;
  hence the degree-two first-fall rank difference is zero.
