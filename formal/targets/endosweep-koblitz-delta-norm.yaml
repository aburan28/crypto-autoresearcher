notes: |
  This is why the README's "N(delta) = n" check is the right one. With
  delta = (tau^m - 1)/(tau - 1) as binary.koblitz builds it, norm
  multiplicativity and N(tau - 1) = 3 - mu = #E(F_2) give
  N(delta) * h = #E. The per-curve facts N(delta) = n and h = 3 - mu are in
  Koblitz.koblitz_certificates.

  The claim's first clause, N(tau - 1) = 3 - mu, is the companion theorem
  Koblitz.norm_tau_sub_one; norm_delta states the second clause.
claim: |
  In Z[tau] (tau^2 = mu*tau - 2): N(tau - 1) = 3 - mu, and if
  delta * (tau - 1) = tau^m - 1 then N(delta) * (3 - mu) = 2^m + 1 - V_m.
