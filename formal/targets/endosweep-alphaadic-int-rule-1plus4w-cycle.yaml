notes: |
  A machine-checked instance of the README's negative result for one of the 10
  non-terminating int rules: alphaadic.json's cycle_example [-2, 2] for 1+4w on
  CP6-782 is a fixed point of T (digit 680). The quotient is checked to be
  exact at that point (alpha * T(z) = z - d), so it is the true (z - d)/alpha.
  The other 9 cycles are harness results.
claim: |
  CP6-782 G1 (D = -339): for alpha = 1 + 4*omega (N(alpha) = 1365) with the
  `int` digit set, the element z = -2 + 2*omega has digit 680 and
  T(z) = (z - 680)/alpha = z, so its expansion never terminates. ("The 10 int
  rules for elements with |b| >= 2 (... 1+4w on CP6-782) do not: a cycle is
  found in the disk.")
