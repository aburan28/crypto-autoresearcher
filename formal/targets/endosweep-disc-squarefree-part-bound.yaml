notes: |
  This is the general argument behind finding 4 ("B-571 is bounded, not
  settled") and harness/endosweep/nist.py partial_factorization: "when C is
  not a perfect square its squarefree part is a product of primes >= bound,
  so the squarefree part of N ... is at least (the primes of odd exponent in
  S) * bound".

  The squarefree part is stated without being defined. The conclusion is
  quantified over EVERY factorisation N = s*k^2, so it bounds the
  squarefree part, and it bounds |D_K| whenever 4q - t^2 = |D_K| f^2. The
  corollary disc_bound_of_partial_factorisation in the same file transports
  the bound to D and to min_nonscalar_degree. The instance for B-571 is
  NistCertificates.B571.abs_DK_lower_bound (target
  endosweep-nist-b571-bound).

  gcd(P, C) = 1 is a real hypothesis: the harness divides the known primes
  out completely before trial division.
claim: |
  Let N = P*C with gcd(P, C) = 1. Let C > 1 be not a perfect square and have
  no divisor d with 1 < d < B. Let p_1, ..., p_r be distinct primes, each
  dividing P to an odd exact power. Then every s, k with N = s*k^2 satisfy
  s >= p_1 * ... * p_r * B. In particular the squarefree part of N is at
  least (product of the odd-exponent known primes) * B.
