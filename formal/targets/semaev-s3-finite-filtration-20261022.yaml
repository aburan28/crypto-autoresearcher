notes: |
  For the same frozen n=4, n'=4, seed-index-1, x_R=1 Boolean toy system,
  this module proves a generic row-space rank-nullity lemma, then identifies
  the degree-three projection kernel inside the source-generated row space
  with its degree-at-most-two intersection. It checks that the degree-two
  row space lies inside that intersection. The intersection and prior row
  space have dimensions 12 and 11, so a new vector exists. This is an
  existential finite-model theorem, not a constructed vector certificate.

  Generic rankOn correctness, a symbolic S3 descent, independent semantic
  review, and any solving-degree or ECDLP cost inference remain open.
claim: |
  In the exact source-bound Boolean Semaev sample, there exists a vector
  in the degree-three row space with degree at most two that is outside the
  degree-two row space. The low-degree intersection has dimension 12 and
  the degree-two row space has dimension 11.
