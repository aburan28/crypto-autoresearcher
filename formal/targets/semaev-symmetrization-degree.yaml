notes: |
  The hardest of the three and the one most likely to come back blocked,
  which is informative rather than a defect. Mathlib has `MvPolynomial.esymm`
  and the symmetric subalgebra, but the DEGREE-TRACKING form of the
  fundamental theorem of symmetric polynomials -- that the rewrite is a
  graded isomorphism for the weighting deg(e_i) = i -- may not be available
  off the shelf. If it is not, part (b) alone is still worth having and part
  (a) becomes the proof obligation to report.

  Specced because the S_m-symmetry of the summation polynomials is one of the
  three syzygy classes RQ-DREG-bd6c86 requires degree falls to be attributed
  to, and it is the class most often invoked loosely.

  Read THM_SEMAEV_FALL1 Remark 2 before reviewing a build here. This lemma
  bounds the degree of the REPRESENTATION. It says nothing about the Groebner
  solving degree of the symmetrized ideal, which is the quantity FGHR
  measured and the only one that bears on cost. A green build read as
  explaining the observed symmetrization speedup is exactly the lossy
  projection docs/inventor-protocol.md warns against.
claim: |
  Let S be a polynomial over a commutative ring, in variables x_1, ..., x_m,
  that is symmetric under the action of the symmetric group S_m permuting
  those variables. Let e_1, ..., e_m denote the elementary symmetric
  polynomials in x_1, ..., x_m, and let T be the unique polynomial such that
  S = T(e_1, ..., e_m). Assign e_i the weight i.

  Then:
    (a) the weighted degree of T equals the total degree of S;
    (b) the total degree of T is at most the total degree of S.

  Proof: e_i is homogeneous of degree i, so substituting e_i into a
  weighted-homogeneous component of T of weighted degree d yields a
  homogeneous polynomial of degree d. The substitution is a graded
  isomorphism onto the symmetric subalgebra, so distinct weighted-homogeneous
  components of T land in distinct graded pieces and cannot cancel; hence the
  weighted degree of T is exactly the total degree of S, giving (a). Every
  weight is at least 1, so total degree is bounded by weighted degree,
  giving (b).
