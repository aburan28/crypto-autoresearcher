notes: |
  The file proves the exact two quadratic factors of the nontrivial
  cyclotomic polynomial over ZMod 19, their irreducibility and coprimality,
  disjointness of their Frobenius kernels, equality of their sum with the
  GaloisField 19 5 trace kernel, and dimension four. This target theorem is
  the field-level equality. The archived quotient-field code bridge is open.
claim: |
  In the canonical degree-five field over ZMod 19, the sum of the kernels
  of the two recorded nontrivial Frobenius factors X^2+5X+1 and X^2+15X+1
  equals the field-trace kernel. This does not certify the archived code.
