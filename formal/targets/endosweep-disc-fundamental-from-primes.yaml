notes: |
  This is the step from "4q - t^2 is completely factored into proven primes"
  to "which gives D_K" (README, "What is checked on every curve" item 2). It
  follows harness/endosweep/nist.py exact_discriminant line by line:
  core = product of the odd-exponent primes; D_K = -core if -core = 1 mod 4,
  else -4*core.

  Primality is the explicit predicate IsPrimeNat (2 <= p and every divisor
  is 1 or p). It is a hypothesis, not something the theorem asserts. Not
  proved: that the fundamental discriminant in a square class is unique.
  That is classical, and it is what makes "D_K" a well-defined invariant
  rather than just "a fundamental D with t^2 - 4q = D f^2".
claim: |
  Let core be a product of distinct primes. If D = -core and D = 1 (mod 4),
  or D = -4*core and -core = 2 or 3 (mod 4), then D is a fundamental
  discriminant: D < 0, and either D = 1 (mod 4) with |D| squarefree, or
  D = 4m with m = 2 or 3 (mod 4) and |m| squarefree.
