notes: |
  The CP6-782 eigenvalues are recorded in research/endosweep_curves_20261006/
  curves.json (18 rows, `eigenvalues_consistent: true`); the README forms
  `5 - lambda_omega` (4 + omega) and `lambda_omega - 10` (9 + omega) are in
  research/endosweep_20261005/cp6_782/README.md and use the conjugate root.
  The source pointer is the parent README, whose appended "Lean verification"
  section states the claim. lambda is DERIVED from the 4 + omega eigenvalue (as
  subgroup.py derives it), so the content is that one root explains all 18.
  Not claimed: the isogeny walks, action on points, primality of r.
claim: |
  CP6-782 G1 (D = -339, omega^2 = omega - 85): with lambda = e(4 + omega) - 4,
  lambda^2 - lambda + 85 = 0 (mod r), and each of the 18 recorded eigenvalues
  of curves.json equals +-(a + b*lambda) mod r with N(a + b*omega) = the
  recorded norm = the product of the step degrees (N(4 + omega) = 105 = 3*5*7,
  N(9 + omega) = 175 = 5*5*7); with the conjugate root lambda' = 1 - lambda,
  e(4 + omega) = 5 - lambda' and e(9 + omega) = lambda' - 10 (mod r).
