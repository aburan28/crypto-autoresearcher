notes: |
  The mechanism of candidate C1, abstracted from the curve. G is any
  Z-module (Lean.Grind.IntModule), beta and beta-bar are maps with
  beta P + beta-bar P = P, and x is any map that cannot see the sign. The
  x-coordinate of a Weierstrass curve is the intended instance. That x has this
  property, and that the x-only rational maps realise omega and omega-bar, are
  NOT formalised: xonly.py checks them on points.

  The same file proves the ring form sub_one_eq_neg_conj and the trace -1
  variant xonly_sum_eq_conj (x(beta P + P) = x(beta-bar P) when
  beta + beta-bar = -1). Core Lean only, so it checks without Mathlib.
claim: |
  If Tr beta = 1 then beta - 1 = -beta-bar, so x(beta P - P) = x(beta-bar P).
  Formally: for maps beta, beta-bar on an abelian group with
  beta P + beta-bar P = P, and any x with x(-Q) = x(Q) for all Q,
  x(beta P - P) = x(beta-bar P).
