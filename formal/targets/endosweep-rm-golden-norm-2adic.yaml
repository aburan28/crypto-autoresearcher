notes: |
  The algebraic reason the RM family y^2 = x^5 - 5x^3 + 5x + t hits
  #J = 16 * prime three times as often as generic genus-2 curves: 2 is inert
  in Z[phi] (phi^2 + phi - 1 = 0), so every nonzero norm a^2 + ab - b^2 has
  even 2-adic valuation. The theorem is the norm-form statement only: for
  (a, b) != (0, 0), a^2 + ab - b^2 = 4^k * m with m odd (and the companion
  norm_eq_four_pow_mul_odd' for the a^2 - ab - b^2 convention).
  norm_eq_four_pow_mul_odd carries an extra universally quantified bound n
  with |a| + |b| <= n, used for the well-founded induction. It is
  instantiated at n = |a| + |b| (as norm_eq_four_pow_mul_odd' does), so the
  statement holds for every (a, b) != (0, 0) with no further restriction.

  NOT proved here: that #J(F_p) is a norm from Z[phi]. That is the
  factorisation of the Frobenius characteristic polynomial over Q(sqrt 5),
  measured for all 56,630 members in the research run, and is an input.
  The 15.3% hit rate and the 1.33x ceiling are measurements/models, not Lean
  claims. Checked with core Lean only (no Mathlib import); axioms: propext,
  Classical.choice, Quot.sound.
claim: |
  Let phi satisfy phi^2 + phi - 1 = 0, so the norm form of Z[phi] is
  N(a + b*phi) = a^2 - ab - b^2 (equivalently a^2 + ab - b^2 under b -> -b).
  2 is inert in Z[phi]: for all integers a, b not both zero there are k >= 0
  and an odd integer m with a^2 + ab - b^2 = 4^k * m. Hence the 2-adic
  valuation of every nonzero norm from Z[phi] is even (README item 7:
  "2 is inert in Z[phi], so v2(#J) is always even").
