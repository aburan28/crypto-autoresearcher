notes: |
  Correctness of `element_index` / `kernel_order` as the ideal index
  [O : beta*O + gamma*O]: the Z-span of {beta, beta*omega, gamma, gamma*omega}
  is exactly the ideal, and its index is the minor gcd (from
  index_eq_minorGcd). With gamma = pi - 1 this is the index the README's item 1
  ("Kernel size") computes.

  NOT claimed: Lenstra's theorem E(F_q) = O/(pi - 1)O (cited as unverified in the
  README) and the finite-module step |ker beta on O/I| = [O : beta*O + I]; so
  nothing here is a statement about points of the curve.
claim: |
  For an imaginary quadratic order O = Z[omega] with omega^2 = tau*omega - n
  (tau = D mod 2, n = (tau^2 - D)/4) and beta, gamma in O, the index
  [O : beta*O + gamma*O] equals the gcd of the 2x2 minors of
  {beta, beta*omega, gamma, gamma*omega} written in the basis {1, omega}, when
  that gcd is nonzero. ("For any beta in O, |ker beta on E(F_p)| =
  [O : beta*O + I]. This index is the gcd of the 2x2 minors of
  {beta, beta*omega, pi-1, (pi-1)*omega}.")
