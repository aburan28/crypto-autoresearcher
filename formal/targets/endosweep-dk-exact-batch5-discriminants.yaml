notes: |
  This is a numeric certificate, the fifth batch of
  CryptoResearch.Endosweep.DkExact, and it reuses that file's DkCert,
  DkCert.Statement and DkCert.statement_of_holds (imported, not redefined).
  The per-curve constants (p, t, h, n, D_K, f, the squarefree part s, the
  min_nonscalar_degree value, floor(log2 |D_K|) and the factorisation) were
  generated from dk_exact.json and factorizations.jsonl in
  research/endosweep_dk_exact_batch5_20261023 by the batch-1 generator
  research/endosweep_dk_exact_20261016/lean/gen_dk_exact_lean.py with
  --dir research/endosweep_dk_exact_batch5_20261023 --module DkExactBatch5.
  The script re-derives each number and refuses to write on a mismatch. The
  closed arithmetic is checked by `decide +kernel` (exact big-integer
  arithmetic in the kernel); the certificate gost_gost512_certificate is
  collected by exact_discriminants. A negative control with one changed digit
  fails.

  What is unconditional: p + 1 - t = h*n, t^2 - 4p = D_K*f^2, the product of
  the certificate's listed factor powers, the odd-exponent listed factors and
  their product s (a candidate squarefree part of 4p - t^2), the D_K
  construction (D_K = -s with
  D_K = 1 mod 4, or D_K = -4s with -s = 2 or 3 mod 4), IsDisc (D_K < 0,
  D_K = 0 or 1 mod 4), the degree value and its 2^(L-2) bound. There is no
  odd-exponent factor below 10^8 on this curve.

  What is conditional: s is the actual squarefree part and "D_K is
  fundamental" assume the odd-exponent factors above 10^8, listed in
  `largePrimes` (19870558523, a 71-digit factor and a 74-digit factor), are
  prime. The archived PARI replay reports isprime=1; Lean does NOT prove
  their primality (the same explicit hypothesis as NistCertificates and
  DkExact). The 71- and 74-digit split was taken from FactorDB, not found by
  this project's driver; the product is checked independently of its source.
  Primality of p and n is not proved either.

  Out of scope: that t is the trace of Frobenius of the named curve, and that
  End(E) is an order of discriminant D_K f'^2 (elliptic-curve theory). The
  curves certified in NistCertificates, DkExact and DkExactBatch2 to
  DkExactBatch4 are not repeated here.

  2026-10-25 semantic correction (BATCH-54bc4d): The original target called
  s the squarefree part among unconditional results. The independent review
  found that the theorem proves an exact listed-factor product, while all
  three listed factors remain in its `largePrimes` premise. The literal
  arithmetic and abstract-order norm bound stand; fundamental D_K, f=1 as
  field conductor, and named-curve consequences require their stated extra
  premises. The original target bytes remain at source commit
  9e0431cfcea350dac1f50f96419f0ac8d4a189f6; review archive commit
  c613c3b2173a05e46fbd3cf8e967581b9878e5fa records the correction.
claim: |
  For the 1 curve of research/endosweep_dk_exact_batch5_20261023/dk_exact.json
  (gost/gost512), with p, t, h, n, D_K, f, s and the factorisation as recorded
  there:
    p + 1 - t = h*n;
    t^2 - 4p = D_K * f^2;
    4p - t^2 = prod p_i^e_i (the factorisation certificate);
    the odd-exponent p_i multiply to s, and D_K = -s or -4*s as
      nist.exact_discriminant computes it; D_K is a discriminant;
    min_nonscalar_degree(D_K) is the recorded value, 2^L <= |D_K| < 2^(L+1)
      and min_nonscalar_degree(D_K) >= 2^(L-2);
    and, if the listed factors above 10^8 are prime, D_K is a fundamental
      discriminant.
  Moreover |D_K| >= 2^511 and min_nonscalar_degree(D_K) >= 2^509.
