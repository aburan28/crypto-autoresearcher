notes: |
  V is frobenius.py's lucas_V. The proof goes through cassini
  (V_{m+1}^2 - t V_m V_{m+1} + q V_m^2 = (4q - t^2) q^m) and V_double
  (V_{2m} = V_m^2 - 2 q^m), both by induction. That q^m + 1 - V_m is the group
  order is the standard Frobenius fact and is taken as the definition.
claim: |
  #E(F_{q^{2m}}) = #E(F_{q^m}) (q^m + 1 + V_m), where
  #E(F_{q^k}) = q^k + 1 - V_k and V_0 = 2, V_1 = t,
  V_j = t V_{j-1} - q V_{j-2}; equivalently V_{2m} = V_m^2 - 2 q^m.
