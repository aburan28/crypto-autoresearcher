notes: |
  The README's termination inequality with integer norms and no square roots.
  `Outside Nalpha R A` is A + R < Nalpha*A and 4AR < (Nalpha*A - A - R)^2, which
  for A, R >= 0 is exactly sqrt(A)(sqrt(Nalpha) - 1) > sqrt(R), i.e.
  |z| > R/(|alpha| - 1) with the README's R (= sqrt of the R here). It rests on
  `triangle_sq`, (N(z-d) - N(z) - N(d))^2 <= 4N(z)N(d), proved from the ring
  identity 4N(z)N(d) - B^2 = (4m - tau^2) det(z, d)^2. Hypothesis tau^2 < 4m
  (imaginary quadratic) is the setting, not a restriction.
claim: |
  In O = Z[omega], omega^2 = tau*omega - m, tau^2 < 4m, norm N: let alpha*q = z - d
  with N(d) <= R. If |z| > R'/(|alpha| - 1), where R' = sqrt(R) is the largest
  digit absolute value -- stated without square roots as N(z) + R < N(alpha)N(z)
  and 4 N(z) R < (N(alpha)N(z) - N(z) - R)^2 -- then N(q) < N(z). ("|T(z)| <=
  (|z| + R)/|alpha| with R the largest digit, so every orbit enters ... the
  disk |z| <= R/(|alpha| - 1).")
