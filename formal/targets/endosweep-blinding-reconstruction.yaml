notes: |
  Holds for every choice of the r_j, so for C5 (e/d-bit r_j) and naive (e-bit
  r_j) blinding alike. The cost (e/d extra bits), the doubling ratios, the
  min-entropy figures and the MSB statistics are measurements and are NOT Lean
  claims.
claim: |
  Every blinded vector x = v + sum_j r_j b_j satisfies
  sum_i x_i lambda_i = k (mod n), provided sum_i v_i lambda_i = k (mod n) and
  every b_j lies in the relation lattice L = {v : sum v_i lambda_i = 0 mod n}.
