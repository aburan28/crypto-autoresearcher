notes: |
  THIS IS THE ONE THAT PROVES THE MEASURED BEHAVIOUR, and it is the reason to
  prefer it over every other target in this lane.

  FFD_SEMAEV_MEASUREMENT1 measured d_ff pinned at 2 for the Weil-descended
  Semaev S_3 system across n = 4..7 and n' = 3,4, stable under random targets
  and random factor bases, while a support-matched null rose with n'. A measured
  trend cannot be formalised. The MECHANISM behind it can, and it turns out to
  be a two-line field identity that holds uniformly in n, in dim V and in V.

  Why it is tractable despite proving something about a polynomial SYSTEM: the
  statement below mentions no polynomial system, no Macaulay matrix, no Groebner
  basis and no first-fall degree. Those all live in the bridge from this lemma
  to the fall, which is bookkeeping done in the note. What Lean is asked for is
  the field-theoretic core, which is where the content actually is.

  Mathlib carries what this needs: finite fields, `Algebra.trace` (or
  `FiniteField.trace`), the char-2 Frobenius, and the standard trace identity
  Tr(z) = Tr(z^2). Part (b) is ring algebra with no trace at all.

  UNIQUENESS IS NOT PART OF THE CLAIM AND MUST NOT BE ADDED. The verification
  script ffd_frobenius_witness.py shows the witness is NOT the unique nonzero mu
  killing the degree-2 coefficients when n' is small -- 7 solutions at n=9,
  n'=3, 63 at n=9, n'=2 -- because the products v_j v_k then span a proper
  subspace and accidental solutions exist. What IS unique, and is stated as
  part (b), is the nonzero root of mu^(1/2) + mu*x_R = 0. Conflating the two
  would formalise a false statement.

  Scope: this proves a degree-2 fall EXISTS uniformly. It says nothing about
  the solving degree, about propagation to higher degrees, or about ECDLP
  cost. See FFD_SEMAEV_MEASUREMENT1 section 4 and CORR-20260916-0c9c0a.
claim: |
  Let n >= 1, let K = F_{2^n}, and let Tr : K -> F_2 be the absolute trace,
  Tr(z) = z + z^2 + z^4 + ... + z^(2^(n-1)).

  (a) TRACE-FROBENIUS. For all mu, t in K,
          Tr(mu * t^2) = Tr(mu^(1/2) * t),
      where mu^(1/2) denotes the unique square root of mu in K (squaring is a
      bijection on a field of characteristic 2). This follows from the standard
      identity Tr(z) = Tr(z^2) applied to z = mu^(1/2) * t.

  (b) THE WITNESS. Let x_R in K be nonzero and set mu = x_R^(-2). Then
          mu^(1/2) + mu * x_R = 0.
      Proof: mu^(1/2) = x_R^(-1) and mu * x_R = x_R^(-2) * x_R = x_R^(-1), and
      the field has characteristic 2, so the sum is zero. Moreover mu = x_R^(-2)
      is the ONLY nonzero element of K satisfying this equation: squaring
      mu^(1/2) = mu * x_R gives mu = mu^2 * x_R^2, i.e. mu * (1 + mu * x_R^2) = 0.

  (c) CONSEQUENCE. With mu = x_R^(-2), for every t in K,
          Tr( mu * ( t^2 + t * x_R ) ) = Tr( (mu^(1/2) + mu * x_R) * t ) = 0.

  The cryptographic reading, which is NOT part of the formal statement: the
  degree-2 coefficients of the Weil restriction of S_3(x_1, x_2, x_R) with
  x_1, x_2 ranging over an F_2-subspace V with basis v_1..v_n' are exactly
  c_{jk} = t^2 + t * x_R with t = v_j v_k. By (c) the F_2-linear functional
  Tr(x_R^(-2) * -) annihilates all of them simultaneously, for EVERY n, every
  n' and every V. So that F_2-combination of the descended equations has no
  degree-2 part: a degree fall at degree 2 exists uniformly.
