notes: |
  For the same archived n=4, n'=4, seed-index-1, x_R=1 Boolean system,
  this theorem identifies a specific XOR of 23 of the 80 compatible
  degree-three rows. Its result has only degree-at-most-two monomials.
  The coefficient sum at masks 80 and 192 vanishes on all 28 degree-two
  rows but equals one on the witness, proving non-membership in V_2.
  The source-binding checker compares the exact archived equations with
  Lean's literal list, recomputes row order and the packed vector, and
  independently checks the separator and rank extension. This remains
  a finite sample theorem, not a generic first-fall or attack-cost result.
claim: |
  In the source-bound finite Boolean Semaev draw, the explicit vector
  selected by comboMask is in the degree-three row space, has degree at
