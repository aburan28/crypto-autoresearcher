notes: |
  The derivation of gls.py's formula from psi = phi o pi o phi^-1, with
  phi_s(x, y) = (x, y + s x). twist_iso_onCurve shows that phi_s maps
  a -> a + s^2 + s, so phi_s is the twist isomorphism once s^2 + s = a + u.
  twist_iso_invol shows that phi_s is its own inverse. tau is any additive,
  multiplicative map (the q-Frobenius of F_{q^4}).

  Not formalised, and corrected after the 2026-10-16 Lean review (R2): an s
  with s^2 + s = a + u always exists in F_{q^4}. Whether it also satisfies
  s + tau s = u depends on the base curve's a and on m. For a in F_2 and odd
  m, s + s^q = sum_{i<m} (a + u)^(2^i) = a + u + (m - 1)/2 (mod 2). The
  reviewer's twist_check.py confirms this numerically for m = 1, 3, 5 and
  a = 0, 1 (m = 127 itself was not run). For gls.py's m = 127 (m = 3 mod 4)
  the formula gives s + s^q = u only for a = 1 (gls.py's Eq1), so
  psi = phi o pi o phi^-1 holds for the base curve with a = 1. For gls.py's
  base curve Eq with a = 0 the twist conjugate is -psi. psi and -psi are both
  endomorphisms of E~ that square to -1, so no measured result changes.
claim: |
  psi = phi o pi o phi^-1 is psi(x, y) = (x^q, y^q + u x^q). For phi_s(x, y) =
  (x, y + s x) and any ring endomorphism tau, phi_s o tau o phi_s^-1 =
  (tau x, tau y + (s + tau s) tau x), which is psi when s + tau s = u.
