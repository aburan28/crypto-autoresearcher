notes: |
  This is a numeric certificate, built like NistCertificates.exact_discriminants.
  The per-curve constants (p, t, h, n, D_K, f, the squarefree part s, the
  min_nonscalar_degree value, floor(log2 |D_K|) and the factorisation) were
  generated from dk_exact.json and factorizations.jsonl by
  research/endosweep_dk_exact_20261016/lean/gen_dk_exact_lean.py. The script
  re-derives each number and refuses to write on a mismatch. The closed
  arithmetic is checked per curve by `decide +kernel` (exact big-integer
  arithmetic in the kernel); the per-curve theorems <curve>_certificate are
  collected by exact_discriminants. A negative control with one changed digit
  (a factor of x962/prime239v2, and n of bn/bn510) fails.

  What is unconditional: p + 1 - t = h*n, t^2 - 4p = D_K*f^2, the product of
  the certificate's prime powers, the odd-exponent primes and their product s
  (the squarefree part of 4p - t^2), the D_K construction (D_K = -s with
  D_K = 1 mod 4, or D_K = -4s with -s = 2 or 3 mod 4), IsDisc (D_K < 0,
  D_K = 0 or 1 mod 4), the degree value and its 2^(L-2) bound, and the
  primality of every odd-exponent factor below 10^8 (trial division in Lean).

  What is conditional: "D_K is fundamental" assumes the odd-exponent factors
  above 10^8, listed per curve in `largePrimes`, are prime. PARI isprime
  proved them; Lean does NOT (the same explicit hypothesis as
  NistCertificates). Primality of p and n is not proved either.

  Out of scope: that t is the trace of Frobenius of the named curve, and that
  End(E) is an order of discriminant D_K f'^2 (elliptic-curve theory). P-256,
  P-384, P-521 and Curve25519 are certified in NistCertificates, not here.
claim: |
  For each of the 18 curves of research/endosweep_dk_exact_20261016/dk_exact.json
  (x962/prime239v2, nums/ed-255-mers, nums/w-255-mers, nums/numsp256d1,
  other/BADA55-R-256, other/MDC201601, other/ssc-288, arkworks/ed_on_bw6_761,
  nums/ed-383-mers, nums/ed-384-mont, nums/w-384-mont, bn/bn510,
  nums/w-511-mers, gost/id-tc26-gost-3410-2012-512-paramSetC, nums/w-512-mont,
  other/ssc-512, bls/BLS12-638, arkworks/bw6_767), with p, t, h, n, D_K, f,
  s and the factorisation as recorded there:
    p + 1 - t = h*n;
    t^2 - 4p = D_K * f^2;
    4p - t^2 = prod p_i^e_i (the factorisation certificate);
    the odd-exponent p_i multiply to s, and D_K = -s or -4*s as
      nist.exact_discriminant computes it; D_K is a discriminant;
    min_nonscalar_degree(D_K) is the recorded value, 2^L <= |D_K| < 2^(L+1)
      and min_nonscalar_degree(D_K) >= 2^(L-2);
    and, if the listed factors above 10^8 are prime, D_K is a fundamental
      discriminant.
  Moreover D_K = -3 on bn/bn510, bls/BLS12-638 and arkworks/bw6_767, and on
  the other 15 curves |D_K| >= 2^235 and min_nonscalar_degree(D_K) >= 2^233.
