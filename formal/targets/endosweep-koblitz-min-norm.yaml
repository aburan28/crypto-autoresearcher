notes: |
  This is the "2" in the K-curve row of the Results table, and the reason
  "the cheapest non-scalar endomorphism is the Frobenius tau". It is a
  statement about norms in Z[tau]. Identifying norm with endomorphism
  degree, and calling tau "cheapest" by operation cost, are outside the
  statement.
claim: |
  For mu = 1 or -1, every element a + b*tau of Z[tau] (tau^2 = mu*tau - 2)
  with b != 0 has norm a^2 + mu*a*b + 2*b^2 >= 2, and N(tau) = 2, in
  agreement with min_nonscalar_degree(-7) = 2.
