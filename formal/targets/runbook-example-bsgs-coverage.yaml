notes: |
  The Lean obligation of the runbook conformance example. It licenses the
  example's validity assertion that every on-curve instance is solved: a
  complete search that misses is a defect, not an observation. Counting
  identity only; the choice m = isqrt(n - 1) + 1 is checked by check.py.
claim: |
  With m baby steps and m giant steps, every exponent k < m * m is reached:
  for 0 < m and k < m * m, k = (k / m) * m + k % m with k / m < m and
  k % m < m.
