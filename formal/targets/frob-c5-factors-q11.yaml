notes: |
  The file proves the four exact linear factors of the nontrivial cyclotomic
  polynomial over ZMod 11, irreducibility and pairwise coprimality, successive
  disjointness of their Frobenius kernels, equality of their sum with the
  GaloisField 11 5 trace kernel, and dimension four. This target theorem is
  the field-level equality. The archived quotient-field code bridge is open.
claim: |
  In the canonical degree-five field over ZMod 11, the sum of the kernels
  of the four recorded nontrivial Frobenius factors equals the field-trace
  kernel. The factors are X+2, X+6, X+7, and X+8. This is a mathematical
  field statement and does not certify the archived quotient-field code.
