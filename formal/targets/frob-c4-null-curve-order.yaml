claim: |
  For each of the five FROB C4 null-curve candidates, if an elliptic-curve
  order lies in the recorded Hasse interval and is divisible by the recorded
  point-order LCM, that order is uniquely the archived integer: respectively
  160644, 370778, 370420, 2475000, and 2476660.
