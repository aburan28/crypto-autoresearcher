notes: |
  The positive control (Finding 1) as kernel-evaluated identities on the
  recorded constants (u = -0xd201000000010000, subgroup.json). phi = zeta_3 is
  -1 + omega in the harness's coordinates (omega = (1 + sqrt(-3))/2), so
  N(u^2 + phi) = (u^2 - 1)^2 + (u^2 - 1) + 1 = u^4 - u^2 + 1.

  NOT claimed: that arkworks' BETA acts on G1 as -u^2 on points (only that the
  recorded eigenvalue is -u^2 mod r and a root of x^2 + x + 1), that the
  arkworks code implements the test, the early-out discussion, costs.
claim: |
  BLS12-381 G1 control: r = u^4 - u^2 + 1 = N(u^2 + phi) and h = (u - 1)^2/3; the
  recorded pi has norm p, trace t and N(pi - 1) = h*r; phi acts on G as -u^2
  (a root of x^2 + x + 1 mod r); u^2 + phi lies in rr; -(u^2 + phi) and the
  shortest valid element -1 + (u^2 - 1)phi both have kernel index r; 1 - u has
  index h (so it is a valid clearing map) and 1 - u is not in rr; module
  predictions ell = 3 -> 3 and ell = 11 -> 121. ("u^2 + phi lies in rr and has
  norm exactly r = u^4 - u^2 + 1, so its kernel on E(F_p) is exactly G1";
  "J contains 1 - u, and 1 - u is not in rr.")
