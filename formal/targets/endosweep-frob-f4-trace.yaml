notes: |
  The claim has three parts, proved by three theorems in
  FrobeniusSplit.lean (listed after the 2026-10-16 Lean review, R3):
    (i) the F_4 trace is t2^2 - 4: F4_trace (V t2 2 2 = t2^2 - 4);
    (ii) t2^2 - 4 = -3 iff t2 = +-1: F4_trace_eq_neg_three_iff;
    (iii) #E(F_{4^m}) = #E(F_{2^{2m}}): order_F4_eq, the named theorem.
  order_F4_eq uses V_frobenius_square: V_k(t^2 - 2q, q^2) = V_{2k}(t, q).
  That the F_4
  class with t = -3 IS the F_2-Koblitz curves (phi_4 = tau^2) is the README's
  identification and is not formalised.
claim: |
  An F_2 curve with trace t2 has F_4 trace t2^2 - 4, which is -3 iff
  t2 = +-1, and #E(F_{4^m}) = #E(F_{2^{2m}}).
