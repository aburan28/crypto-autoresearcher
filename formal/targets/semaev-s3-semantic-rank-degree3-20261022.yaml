notes: |
  This additive target covers only the n=4, n'=4, seed-index-1, x_R=1
  Boolean toy system. The generated Lean file checks literal rows against
  the parity routine, invertibility of explicit elimination matrices,
  their row transforms via XOR, and echelon pivots. Mathlib equates the
  resulting degree-three full and projected ranks with dimensions of actual
  F2 row spaces. The companion executableRankMatchesSemanticThree theorem
  checks that the earlier Nat rank routine gives the same two ranks.
  Together with the prior degree-two certificate, the exact degree-three
  rank increment is one.

  This is not generic rankOn correctness, a general filtration identity,
  a generic S3 descent, a solving-degree claim, or an ECDLP cost result.
  Independent semantic review is still required.
claim: |
  For the fixed source-bound Semaev sample, the actual F2 row-space ranks
  at degree three and degree-three projection are 53 and 41; with the
  degree-two rank 11, the first-fall rank increment at degree three is one.
