notes: |
  sigma is any additive, multiplicative, unital involution of a
  characteristic-2 field. The q-power Frobenius of F_{q^2} is one, and
  sigma u = u^q = u^2 = u + 1 holds for odd m. That gls.py's tower has these
  properties is the harness's construction and is not formalised. Curve
  membership is not needed for psi^2 = -1.
claim: |
  psi(x, y) = (x^q, y^q + u x^q) on E~ : y^2 + xy = x^3 + u x^2 + b over
  F_{q^2} = F_q[u]/(u^2 + u + 1) satisfies psi^2 = -1:
  psi(psi(x, y)) = (x, x + y) = -(x, y).
