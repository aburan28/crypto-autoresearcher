notes: |
  Supporting results in the same file. psi_dbl: psi commutes with the generic
  doubling. psi_onCurve: psi maps E~ to E~ when sigma b = b. psi_lambda_affine
  and psi_lambda_proj: the lambda forms (sigma x, sigma lambda + u) and
  (sigma X, sigma L + u sigma Z, sigma Z) represent psi. Degenerate branches
  (P = +-Q, O) are not formalised.
claim: |
  psi is additive, psi(P + Q) = psi(P) + psi(Q), for the generic affine
  addition (x_P != x_Q). It maps E~ to itself, commutes with doubling, and in
  lambda-affine form is (x^q, lambda^q + u).
