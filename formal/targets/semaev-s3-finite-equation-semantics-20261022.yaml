notes: |
  This additive theorem checks all 256 assignments for the single n=4,
  n'=4, seed-index-1, x_R=1 toy system with basis [9,3,2,12] and field
  modulus X^4+X+1. The four literal equation lists come from the separate
  parity finite certificate and are checked against the source-bound replay.
  The theorem equates their Boolean evaluations to direct finite-field
  S3=e2^2+e3+1 evaluation. It is not a generic S3 descent theorem, does not
  prove rankOn correctness, and does not establish solving degree or cost.
claim: |
  For every Boolean assignment to the eight variables in the fixed toy
  Semaev instance, the four transcribed component equations evaluate to
  the four polynomial-basis bits of the directly evaluated S3 expression.
