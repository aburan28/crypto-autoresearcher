notes: |
  The source-bound matrix replay records the exact q=11, q=13 and q=19
  archived quotient moduli and 5x5 q-power Frobenius matrices. A deterministic
  generator verifies the replay receipt bytes and checker hash, independently
  divides X^(q*j) by each modulus, and emits explicit quotient/remainder
  certificates. Lean checks every division identity and all 75 matrix entries
  through AdjoinRoot's power-basis representation. The source does not prove
  the original Sage driver refines this model, original source custody, or
  the separate C8 control and experiment success gate.
claim: |
  For each of the three archived degree-five quotient moduli over ZMod 11,
  ZMod 13 and ZMod 19, the q-power image of every basis monomial 1,z,...,z^4
  has the exact coordinates recorded in the frozen C5 Frobenius matrix.
  This is an algebraic quotient-basis certificate, not a verification of the
  historical executable or a performance claim.
