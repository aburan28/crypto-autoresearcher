notes: |
  Closed arithmetic checked by decide. The norm form is
  a^2 + abD + b^2 (D^2 - D)/4 in the basis 1, w. The factorisations
  (155 = 5*31, 85 = 5*17, 125689 = 37*43*79) and the primality of 1039 are not
  restated.
claim: |
  omega = (1 + sqrt D_K)/2 has trace 1 and norm (1 + |D_K|)/4: N(omega) = 155
  on GOST CryptoPro-B (D_K = -619), 85 on CP6-782 (D_K = -339) and 1039 on
  Tom-256 (D_K = -4155). On Tom-256 the trace-one element -5 + 11 omega has norm
  125 689.
