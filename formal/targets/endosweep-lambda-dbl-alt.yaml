notes: |
  The README's subtlety concerns the COST of computing T, and that is a
  count, not a Lean claim. What is formalised is the algebra under it.
  alt_T_eq proves L(L+Z) + aZ^2 = L^2 + LZ + aZ^2. This theorem proves that,
  with the curve equation, the alternative L_2P returns the identical triple.
  dbl_alt_correct is the correctness corollary.
claim: |
  The alternative doubling needs T = L(L + Z) + aZ^2, which equals Theorem 1's
  L^2 + LZ + aZ^2. With that T, the alternative
  L_2P = (L+X)^2 ((L+X)^2 + T + Z^2) + T^2 + (a+1) T Z^2 + (a^2+b) Z^4
  agrees with Theorem 1's doubling on the curve.
