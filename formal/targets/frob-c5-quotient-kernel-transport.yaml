notes: |
  The full q-power endomorphisms of the three frozen polynomial quotient
  algebras have the exact archived matrices in their power bases. Lean
  transports matrix trace rank and fifth-power certificates to those maps,
  applies the proved factor-polynomial identities, and proves fixed-line
  dimensions and disjointness. This ring-level theorem does not prove
  modulus irreducibility, historical Sage refinement, original execution
  source custody, C8, or the complete run verdict.
claim: |
  For each of the archived degree-five quotient moduli over ZMod 11, ZMod 13
  and ZMod 19, the actual q-power endomorphism has the frozen C5 factor-kernel
  sum equal to its five-term trace kernel of dimension four, is of fifth
  power one, and has a one-dimensional fixed kernel disjoint from trace.
