notes: |
  This is the Results-table row for K-163 to K-571, from the scan rather
  than a factorisation. It is unconditional: 7 is proved prime by trial
  division, so -7 is fundamental with no PARI input. The f here is the
  nist.json conductor. Koblitz.koblitz_certificates also shows f = |B| with
  tau^m = A + B*tau, the index of Z[pi] in Z[tau].
claim: |
  For K-163, K-233, K-283, K-409 and K-571, with q = 2^m and t, f from
  nist.json: t^2 - 4q = -7 * f^2; -7 is a fundamental discriminant; and
  min_nonscalar_degree(-7) = 2.
