notes: |
  The README checks x(omega-bar P) = x([1 - lambda]P) on points of order n.
  This theorem is the algebra behind that check: omega-bar = 1 - omega acts as
  [1 - lambda] wherever omega acts as [lambda]. Supporting results in the same
  file: conj_root_of_trace_one (omega^2 = omega + m implies
  (1 - omega)^2 = (1 - omega) + m) and eigen_conj_mod (the eigenvalue
  congruence mod n passes from lambda to 1 - lambda).

  Not formalised: that the conjugate chain built by
  explicit.build_chain_endomorphism from (1, -1) IS omega-bar on the curve, or
  that it costs the same as omega.
claim: |
  On the order-n subgroup, omega-bar = 1 - omega has eigenvalue 1 - lambda:
  if omega-bar P = P - omega P and omega P = [lambda]P then
  omega-bar P = [1 - lambda]P. Moreover lambda^2 = lambda + m (mod n) implies
  (1 - lambda)^2 = (1 - lambda) + m (mod n).
