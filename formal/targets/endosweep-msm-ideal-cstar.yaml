notes: |
  This is a ceiling-free model with saturated buckets and a common window,
  not msm.py's occupancy model. It exposes Finding 1's mechanism.
  ideal_saving: the accumulation term is unchanged and the rest is halved.
  ideal_cstar_decomposition: the break-even equals the aggregation-only saving
  plus exactly ((b/2) D + (b/(2c)) C)/N. So it is at least the
  aggregation-only saving whenever b, c, N > 0 and D, C >= 0, and strictly
  exceeds it when, in addition, D > 0 or C > 0. That positivity is not a
  hypothesis of the theorem, which states the decomposition only.
  "Aggregation-only saving" means this model's (b/(2c)) 2^c R/N. It is NOT
  the hypothesis's approximation b A/(c(c+1)), which is not derived, and
  msm.py's measured C* does not always exceed that formula (README: mixed
  2^16, 12.1 vs 14.3; 2026-10-16 Lean review, R2).
claim: |
  At a common window the split leaves the accumulation count unchanged and
  halves the bucket aggregation. What it also saves, and the hypothesis leaves
  out, is half the window-combination doublings, so (for positive b, c, N, D,
  C) the break-even strictly exceeds the model's aggregation-only saving
  (b/(2c)) 2^c R/N. In the model: GLV wins iff
  C_alpha < (b/(2c)) (2^c R + c D + C)/N.
