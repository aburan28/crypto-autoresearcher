notes: |
  The frozen Stage-1 admissible-dimension files, both SHA-256
  6f09e6c620fc3765a8ef97951d5c6f84f9b1290a908f487c998bdef51bc60e74,
  list bitmask polynomials 3, 313 and 471. The theorem checks their product
  over ZMod 2. It does not prove factor irreducibility, the normal-basis
  identification of the field Frobenius, all invariant-subspace dimensions,
  or any observed relation-yield ratio. Those are separate obligations.
claim: |
  In (ZMod 2)[X],
  (X + 1) *
  (X^8 + X^5 + X^4 + X^3 + 1) *
  (X^8 + X^7 + X^6 + X^4 + X^2 + X + 1)
  = X^17 + 1.
