notes: |
  The README checks the Koblitz order with "#E = 2^m + 1 - V_m", where V_m
  comes from the recurrence in binary.lucas_trace. This theorem proves, for
  every m and every integer mu, that the recurrence value equals the norm of
  1 - tau^m in Z[tau]. The supporting lemmas in the same file are
  trace_pow_tau (Tr(tau^m) = V_m) and norm_pow_tau (N(tau^m) = 2^m).

  Not formalised: #E(F_{2^m}) = N(1 - pi) with pi = tau^m the Frobenius.
  That is the characteristic polynomial of Frobenius, i.e. Hasse-Weil
  theory.
claim: |
  Let V_0 = 2, V_1 = mu, V_{k+1} = mu*V_k - 2*V_{k-1}. In Z[tau] with
  tau^2 = mu*tau - 2, for every m: Tr(tau^m) = V_m, N(tau^m) = 2^m, and
  N(1 - tau^m) = (1 - tau^m)(1 - conj(tau)^m) = 2^m + 1 - V_m.
