notes: |
  The README lists the curve equation among the formulas "checked against the
  affine group law" on random points. Here it holds for every field of
  characteristic 2 (core Lean.Grind.Field + IsCharP K 2), with X, Z != 0 (the
  lambda representation needs x != 0). The same file also proves neg_correct
  (negation is lambda -> lambda + 1) and frobenius_correct ((X^2, L^2, Z^2) is
  the image under the 2-power Frobenius).
claim: |
  A point (x, y) of y^2 + xy = x^3 + a x^2 + b with x != 0, written
  lambda-projectively as (X, L, Z) with x = X/Z and lambda = L/Z = x + y/x,
  satisfies (L^2 + LZ + aZ^2) X^2 = X^4 + b Z^4, and conversely.
