notes: |
  This theorem applies the previously proved q=11, q=13 and q=19
  cyclotomic factor-kernel identities to the exact quotient-basis matrices
  separately certified in QuotientMatrices.lean. Lean computes each matrix's
  fifth power and five-term trace matrix, proves rank one and trace-kernel
  dimension four, and proves the factor-kernel direct sums. It does not
  establish historical Sage execution, original source custody, C8, or
  the experiment success gate.
claim: |
  For the three frozen C5 quotient-basis Frobenius matrices, the nontrivial
  factor kernels form the recorded direct sums and equal the five-term
  trace kernel of dimension four: four linear factors over ZMod 11, one
  quartic over ZMod 13, and two quadratics over ZMod 19.
