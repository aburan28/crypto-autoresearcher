notes: |
  This formalises decompose_unreduced, which the 40 000 erasure checks run,
  with its round-half-up integer rounding. The hypothesis that (n, 0, ..., 0)
  has integer coordinates z_i = n num_i/den_i in the basis is blinding.py's
  stated reason. That num_i/den_i really is the first row of B^-1 for the
  harness's reduced basis is not formalised. decompose_mod_erases covers
  lattice.py's decompose, which reduces k mod n first.

  The 40 000 erasure checks compare decompose_unreduced(k + r n) with
  lattice.py's decompose(k), which rounds with Python round() (half to even)
  on k mod n; they do not compare against decompose_unreduced(k). Lean does
  not link the two routines. They can differ only at an exact half-integer
  tie, and none can occur here: each den_i divides det B = +-n, and n is odd
  for all four harness lattices. The 2026-10-16 Lean review (R3) found 0
  mismatches between the two routines in 8 000 sampled k.
claim: |
  Classical scalar blinding k + r n is erased by GLV decomposition: (n, 0, ...,
  0) is in L, so its coordinates in the basis are integers and rounding
  commutes with the shift. The Babai decomposition of k + r n equals that of k
  for every integer r.
