notes: |
  One of the README's 84 terminating rules, with the disk exhausted IN LEAN
  rather than by the harness: the disk {N(z) <= 50} consists of the 15 integers
  |x| <= 7 (alphaadic.json: disk_radius 7.1144, elements_checked 15), each its
  own digit. The digit is defined as the balanced integer in [-87, 87]
  congruent to z mod alpha (z = x + y*omega = x - 4y mod alpha), which is what
  int_rule tabulates; equality with the Python function is argued, not
  formalized. The voronoi rule and the other 82 rules remain harness results.
claim: |
  GOST CryptoPro-B (D = -619): for alpha = 4 + omega (N(alpha) = 175) with the
  `int` digit set (balanced integers modulo 175, largest digit 87), the
  expansion z = sum d_i alpha^i terminates for every z in O_K and reconstructs
  z. (README Item 2: "84 of the 94 rules terminate"; alphaadic.md
  "proved terminating by exhausting the absorbing disk".)
