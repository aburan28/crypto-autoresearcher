notes: |
  With msm.py's floors, conservation holds up to one window per point. The
  condition is the README's "b mod c" quantisation. window_slots_examples checks
  h = 128 at c = 13 (equality) and c = 16 (plain 17 windows, the split
  2 x 9 = 18). doublings_halved proves that the split's
  window-combination doublings are at most half of plain's.
claim: |
  With msm.py's window count W(B) = B // c + 1, plain coefficients of 2h bits
  and GLV coefficients of h bits: N W(2h) <= 2N W(h) <= N W(2h) + N, with
  2 W(h) = W(2h) iff c <= 2 (h mod c).
