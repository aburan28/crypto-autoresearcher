notes: |
  Mathematically trivial and operationally the most valuable target in this
  lane. AGENTS rule 4 requires every claimed solve or relation to carry a
  certificate the run wrapper re-verifies independently; today that verifier
  shares a language, a library stack and often an author with the code that
  produced the claim, so "independent" is doing less work than it looks.
  A Decidable instance discharged by the kernel removes the shared
  implementation, which is the whole point -- the value is the independence
  of the checker, not the depth of the statement.

  The deliverable is a DECIDABLE INSTANCE plus the soundness lemma tying it
  to the group law, not a `decide` call on one fixture. A theorem that only
  checks a single hard-coded certificate would formalize an instance rather
  than the predicate, and the next certificate would need a new theorem.

  Mathlib carries `WeierstrassCurve.Affine.Point` with the group law and its
  associativity, so the third conjunct is available. Expect the real work to
  be in the second conjunct -- F_q-subspace membership with respect to a
  declared basis of V, i.e. solvability of a finite linear system -- and in
  keeping the statement parametric over (E, V, m) rather than over a fixture.

  Deliberately says nothing about whether a certificate EXISTS for a given
  R: decomposition probability is an experimental quantity under
  RQ-DREG-bd6c86, not a theorem.
claim: |
  Let K be a finite field with decidable equality, E a Weierstrass curve over
  K, V an F_q-subspace of K given by a fixed finite basis, m a natural number,
  and R a point of E(K).

  Define, for a tuple of affine points P_1, ..., P_m of E(K), the predicate

      Valid(P_1, ..., P_m ; R)  :=
          (each P_i satisfies the Weierstrass equation of E)
        and (x(P_i) lies in V for each i)
        and (P_1 + ... + P_m = R in the group E(K))

  Then Valid is a total decidable predicate.

  Proof: the first conjunct is an equality in K; the second is membership in
  the span of a finite declared basis, that is, solvability of a finite
  F_q-linear system; the third is a finite sequence of group-law operations
  followed by an equality test in E(K). Each conjunct is decidable over a
  field with decidable equality, and a finite conjunction of decidable
  predicates is decidable.
