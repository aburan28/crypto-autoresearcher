notes: |
  This is a formal target pointer, not a dispatched handoff. The Lean theorem
  comes from KN-FIND-48f0ae as committed at
  3bed4d891777a15a44ecd577958c99279483696b. The workspace pins Lean
  4.35.0-rc1 and Mathlib 7fa22735254ddf7e11f119250a9f2d0352bc7c3a.
  The theorem proves the 1.25 ratio ceiling conditional on a positive target count,
  saturated open arm, and bounded tau hit count. The archived_counts_below_band
  theorem instantiates the four recorded pairs, but neither theorem certifies
  that the JSON measurements or runner are correct. KN-FIND-48f0ae remains
  empirical_only until those execution and semantic checks are independent.
claim: |
  In each archived BINSTD ell=8/9 Stage-1 toy cell, the open arm reached
  all 40 targets. Given that observation, no tau hit count between 0 and 40
  can reach the frozen tau/open yield band of 1.25: 4*tauHits < 5*openHits.
