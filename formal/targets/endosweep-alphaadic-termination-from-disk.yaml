notes: |
  The soundness of the harness's termination certificate: exhausting the disk
  is a complete proof for the digit rule ("every element of that disk is
  iterated to 0 ... which is a complete proof for the digit rule used",
  alphaadic.py). The disk exhaustion itself is a hypothesis here; it is
  discharged in Lean only for the 4 + omega int rules (separate targets). The
  companion `expansion_of_iterate` proves the digits reconstruct z.
  NOT claimed: "stays in the disk" (not needed for termination).
claim: |
  Let T(z) = (z - d(z))/alpha be a digit step (alpha*T(z) = z - d(z), N(d(z)) <= R)
  in an imaginary quadratic order. If every z in the disk -- every z not
  satisfying the Outside condition of norm_decrease -- reaches 0 under T, then
  every z in O reaches 0: the expansion terminates for every scalar.
