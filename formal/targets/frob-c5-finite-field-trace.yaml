notes: |
  Strengthens the prior abstract order-five trace identity by instantiating
  Mathlib's finite-field Frobenius and field trace. It proves the five-term
  polynomial equals the embedded field trace, the kernels agree, the trace
  kernel has dimension four, and (in characteristic not five) the kernel is
  the range of Frobenius minus identity. The file also instantiates the
  dimension result for q=11, q=13, and q=19 using GaloisField q 5. It does not
  identify the archived quotient-field encoding with that finite field or
  prove the direct-sum decomposition over nontrivial irreducible factors of
  X^5-1. Those C5 and run-validity duties remain open.
claim: |
  Let L/K be a finite extension of finite fields of degree five, with
  characteristic of K different from five. Let F be the K-linear q-power
  Frobenius, q=|K|, and T=1+F+F^2+F^3+F^4. Then T(x) is the image in L of
  Tr_{L/K}(x) for every x; ker(T)=ker(Tr_{L/K}), this kernel has K-dimension
  four, and ker(Tr_{L/K})=range(F-1). This is the finite-field trace core of
  frozen FROB control C5, not its full factor-kernel decomposition.
