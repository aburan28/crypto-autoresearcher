notes: |
  This additive target does not alter the frozen 2026-09-16 Semaev target.
  It checks one exact toy instance, n=4, n'=4, seed index 1, x_R=1,
  basis [9,3,2,12], with the four component equations bound to the
  2026-10-22 per-draw receipt SHA-256
  89ab8e668c510572bbf9307f105b2eaf46858ad900f0b6b4a2fce8803e0ba6eb.
  Boolean monomial multiplication uses XOR so duplicate F2 terms cancel.
  The theorem computes newFalls(1)=0, newFalls(2)=0, newFalls(3)=1 using
  a finite row-elimination routine and exact kernel reduction. The companion
  theorem archived_product_extra_masks identifies three masks retained by
  the historical set-union routine but canceled under F2 multiplication.

  The Lean file does not derive the four input equations from abstract S3,
  prove generic correctness of rankOn as vector-space dimension, or prove a
  general first-fall claim. Independent semantic review of those links is
  still required. No solving-degree, ECDLP-cost, or performance conclusion.
claim: |
  For the exact four component equations of the n=4, n'=4, s=1, x_R=1
  archived toy Semaev system, and for the finite Boolean-parity row and
  rankOn definitions in BooleanParityFiniteCertificate.lean, the executable
  newFalls value is zero at degrees one and two and one at degree three.
