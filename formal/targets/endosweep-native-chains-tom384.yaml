claim: |
  Tom-384 (std-curves other/Tom-384): for the recorded p, a, b, n, h, trace t and conductor f,
  p + 1 - t = h*n and t^2 - 4p = D_K*f^2 (D_K = -619); the recorded omega_root
  lambda satisfies lambda^2 - tau*lambda + m = 0 (mod n) for omega^2 = tau*omega - m;
  the generator G satisfies y^2 = x^3 + a x + b (mod p); and for each of the
  exported orderings of tom384.chains.constants.json: N(a + b*omega) equals the
  recorded norm and the product of the step degrees, the matched element is
  +-(a + b*omega), the eigenvalue e equals a' + b'*lambda (mod n) for the matched
  element and is a root mod n of its characteristic polynomial
  x^2 - (2a' + b'*tau)x + N, both reduced GLV basis vectors (u, v) satisfy
  u + v*e = 0 (mod n) with determinant +-n, and every test vector satisfies
  k = k1 + k2*e (mod n) with P, phi(P) and k*P on the curve mod p.
  Cheapest: 4 + omega, N(4 + omega) = 175 = 7*5*5.
