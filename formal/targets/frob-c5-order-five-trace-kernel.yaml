notes: |
  Formalizes the algebraic core of frozen control C5 in
  experiments/EXP-FROB-91ee9c/specification.yaml. The theorem is conditional
  on F^5 = 1 and 5 != 0 in the scalar field. It does not identify F with
  Frobenius on the q=11, 13, or 19 cells, show their dimension is four, or
  establish the direct sum of nontrivial factor kernels. Those are distinct
  C5 obligations and remain subject to independent semantic review.
claim: |
  Let R be a field, V an R-vector space, and F : V ->_R V a linear map.
  If F^5 = 1 and (5 : R) != 0, define T = 1 + F + F^2 + F^3 + F^4.
  Then ker T = range(F - 1).
  This is the characteristic-not-five order-five trace identity used in
  the structural interpretation of C5; it is not the full finite-field
  factor-kernel identity reported for the three archived cells.
