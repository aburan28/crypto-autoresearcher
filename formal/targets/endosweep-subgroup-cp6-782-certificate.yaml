notes: |
  Kernel-evaluated (`decide`) check of the recorded numbers in
  research/endosweep_subgroup_20261008/subgroup.json for CP6-782 G1. With
  ideal_index_eq_elementIndex this certifies that the chosen membership element
  generates, together with pi - 1, an ideal of index exactly r and lies in rr,
  and the clearing elements and e give index exactly h -- i.e. the README's
  validity criteria hold for the recorded elements AS ELEMENTS OF O.

  NOT claimed: that the recorded pi is the Frobenius of CP6-782 (only that it has
  norm p, trace t, and N(pi - 1) = h*r), End(E) = O_K, Lenstra's theorem, the
  point checks, the torsion COUNTS (only the module predictions), primality of
  r, p or the 357-bit factor, or any cost/ratio (modelled).
claim: |
  CP6-782 G1 (D = -339, alpha = 4 + omega): for the recorded Frobenius element pi,
  N(pi) = p, Tr(pi) = t and N(pi - 1) = h*r; the chosen membership element beta
  (187 bits) has norm r, acts as 0 on G (beta in rr) and
  [O : beta*O + (pi-1)O] = r; the chosen (204-bit) and shortest (203-bit)
  clearing elements have [O : beta*O + (pi-1)O] = h; the effective cofactor
  e = h/6 has index h; and the module predictions #E(F_p)[ell] = [O : ell*O + I]
  for ell = 2, 3, 7, 29 are 4, 9, 7, 29. (README, "The algebra" items 1-3,
  "Results", and the module-prediction table.)
