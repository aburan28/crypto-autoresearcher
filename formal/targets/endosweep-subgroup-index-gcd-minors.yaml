notes: |
  The general lattice fact that `element_index` in harness/endosweep/subgroup.py
  relies on ("Its index in Z^2 is the gcd of all 2x2 minors of those vectors").
  The README states it as a fact used by the exact integer computation; it is
  not proved there, hence source_status STATED.

  The index is stated with an explicit complete residue system (a map
  rep : Z^2 -> N with values exactly 0..d-1 that identifies two vectors iff
  their difference is in the span), i.e. |Z^2 / L| = d, without Mathlib
  cardinals. The proof is constructive: the minor gcd is shown to be an
  invariant of the lattice, every generating list is reduced to a triangular
  basis (a, b), (0, c) by Euclid, and the triangular lattice has the explicit
  residue system c*(x mod a) + ((y - floor(x/a) b) mod c).

  Scope: the full-rank case d != 0 only (d = 0 is the infinite-index case and
  is not claimed). Core Lean plus Mathlib.Tactic.Ring; checked locally.
claim: |
  Let v_1, ..., v_k be vectors in Z^2 and L their Z-span. Let d be the gcd of all
  2x2 minors det[v_i v_j], i < j (the quantity `element_index` computes). If
  d != 0 then [Z^2 : L] = d: there is a map rep : Z^2 -> {0, ..., d-1}, onto,
  with rep(v) = rep(w) if and only if v - w lies in L.
