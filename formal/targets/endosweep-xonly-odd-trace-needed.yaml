notes: |
  The order of discriminant D is modelled as Z^2 in the basis 1,
  w = (D + sqrt D)/2, with conjugation w -> D - w. add_conj shows that
  beta + beta-bar is the rational integer 2a + bD. Finding 7's "for D = 0 mod 4
  every trace is even and the trick does not exist" is
  no_trace_pm_one_of_D_even, which covers every even D. sub_conj_ne_one proves
  that beta - beta-bar = 1 has no solution in the order.

  The claim's first sentence, "x((beta - 1)P) = x(beta-bar P) needs
  beta + beta-bar = 1", is NOT a Lean claim. It uses curve facts that are not
  formalised: x(P') = x(P'') forces P' = +-P'', and an identity of
  endomorphisms on generic points lifts to the ring identity
  beta - 1 = +-beta-bar in End(E) (End(E) acts faithfully). Lean proves only
  the order-theoretic part that follows: which orders contain an element of
  trace +-1, and that beta - beta-bar = 1 is impossible.

  The README's further reading, "odd conductor", follows because
  D = f^2 D_K is odd iff f and D_K are both odd. That step is arithmetic and is
  not stated separately.
claim: |
  x((beta - 1)P) = x(beta-bar P) needs beta + beta-bar = 1, an element of odd
  trace. In the order of discriminant D a trace-one element exists iff D is odd,
  so for D = 0 mod 4 (indeed for every even D) every trace is even and no element
  has beta + beta-bar = +-1. The identity beta - 1 = beta-bar would need
  beta - beta-bar = 1, which has no solution.
