notes: |
  The ceiling-free identity in Q. The floored version that msm.py uses is
  the separate target endosweep-msm-window-slots. Accumulation counts in
  msm.py also subtract the first entry of each non-empty bucket and the zero
  digits, so this is the count of digit slots, not msm.py's acc_adds.
claim: |
  In a bucket MSM of N points with b-bit scalars and window c, the dominant
  term (b/c) N depends only on the total number of scalar bits, which a GLV
  split conserves (N x b -> 2N x b/2): (b/c) N = ((b/2)/c)(2N).
