notes: |
  The tractable one, and the pipeline smoke test for this lane. It is the
  char-p freshman's dream plus one substitution, and Mathlib carries both
  halves: `frobenius` / `ExpChar` for q-th powering as a ring endomorphism,
  and `MvPolynomial` with `Ideal.Quotient` for the field-equation reduction.

  Specced FIRST despite being easy, because it is the structural reason the
  Weil-descended Semaev systems are not semi-regular -- the Frobenius
  conjugates that make up the system are redundant modulo q-th powers and
  field equations, at a degree that does not grow with n. Every later
  attribution of a degree fall to "Frobenius" in RQ-DREG-bd6c86 is an appeal
  to this identity, so it is the one worth having machine-checked rather
  than cited.

  It is an IDENTITY, not a bound. A green build here says nothing about how
  the solving degree grows, and a semantic-fidelity review that reads it as
  supporting a subexponential claim has misread it. See THM_SEMAEV_FALL1
  Remark 1 and section 4.

  The degree-fall corollary (Corollary 1) is the natural second theorem in
  the same file; it needs `MvPolynomial.totalDegree` lemmas and the fact that
  coefficientwise Frobenius is degree-preserving because phi is injective.
claim: |
  Let p be prime, q = p^e, and K a field of characteristic p (in the intended
  application K = F_{q^n}). Let R = K[x_1, ..., x_M] and let I_q be the ideal
  generated by x_i^q - x_i for i = 1, ..., M.

  Let phi : K -> K be the q-power Frobenius, c |-> c^q, and for g in R write
  g^phi for g with phi applied to each coefficient.

  Then for every g in R:

      g^q  is congruent to  g^phi   modulo I_q.

  Proof: q-th powering is a ring endomorphism of R because R has
  characteristic p and q is a power of p. Writing g = sum_alpha c_alpha
  x^alpha, additivity gives g^q = sum_alpha c_alpha^q x^(q*alpha). Each
  generator x_i^q - x_i of I_q gives x_i^q congruent to x_i, hence
  x^(q*alpha) is congruent to x^alpha for every exponent vector alpha.
  Substituting yields sum_alpha phi(c_alpha) x^alpha, which is g^phi.
