notes: |
  This is a numeric certificate. The per-curve constants (q, t, D_K, f, the
  min_nonscalar_degree value and the factorisation) were generated from
  nist.json and factorizations.jsonl by a script. The script re-derives
  each number and refuses to write on a mismatch. The closed arithmetic is
  then checked by `decide +kernel`, which is exact big-integer arithmetic in
  the kernel. A negative control with one changed digit fails.

  What is unconditional: the identity, the product, the D_K construction,
  IsDisc, the degree value, and the primality of every odd-exponent factor
  below 10^8 (trial division in Lean). The D_K construction is a conjunct of
  exact_discriminants itself (added after the 2026-10-16 Lean review, R1):
  the odd-exponent primes of the certificate are oddPrimes, and
  D_K = -core with D_K = 1 mod 4, or D_K = -4*core with -core = 2 or 3 mod 4,
  where core = oddPrimes.prod. This is the closed check FactoredCert.Holds
  proved by factored_holds, now restated in the named theorem.

  What is conditional: "D_K is fundamental" assumes the odd-exponent factors
  above 10^8 are prime, as listed per curve in `largePrimes`. PARI isprime
  proved them; Lean does NOT. No Pratt or ECPP certificate is checked in
  Lean. (B-571's 38- and 93-digit factors also have PARI ECPP certificates,
  validated by primecertisvalid, in research/endosweep_nist_20261006/b571/;
  they are provenance, not Lean evidence.)

  B-571 joined this certificate on 2026-10-16, when CADO-NFS split its
  130-digit cofactor (README finding 4). Its Lean name is B571Exact, since
  the namespace B571 holds the earlier, superseded bound
  (endosweep-nist-b571-bound). D_K = -(4q - t^2), f = 1.

  Out of scope: that t is the curve's trace, and that End(E) is an order of
  discriminant D_K f'^2 (elliptic-curve theory).
claim: |
  For each curve whose 4q - t^2 is completely factored (P-192, P-224, P-256,
  P-384, P-521, B-163, B-233, B-283, B-409, B-571, Curve25519 = Ed25519,
  and Curve448 = Ed448, Ed448-Goldilocks), with q, t, D_K, f and the
  factorisation as recorded in nist.json:
    t^2 - 4q = D_K * f^2;
    4q - t^2 = prod p_i^e_i (the factorisation certificate);
    D_K = -core or -4*core, with core the product of the odd-exponent p_i,
      as nist.exact_discriminant computes it, and D_K is a discriminant;
    min_nonscalar_degree(D_K) is the value nist.json reports;
    and, if the listed factors are prime, D_K is a fundamental discriminant.
