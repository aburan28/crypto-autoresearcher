idea:
  id: IDEA-20260816-1e36fa
  question_id: RQ-SHAONE-081e3a
  added: '2026-08-16'
  title: 'Treat the near-collision block chain as a counted object: define N(k), the number of admissible
    inter-block chaining-value difference states surviving after k chained near-collision blocks,
    and derive the chosen-prefix cost as an explicit minimization over k rather than as a quoted total.'
  class: representation
  claim: '(A) The published chosen-prefix cost for a Merkle-Damgard hash is a single headline number,
    but structurally it is the value of a minimization. An attacker chooses how many near-collision
    blocks k to spend eliminating the chaining-value difference left by the birthday phase. The birthday
    phase cost falls as the admissible target difference set grows, and the admissible set grows with
    k; the per-block near-collision search cost rises with the residual constraints each block must
    satisfy. The total is therefore C(k) = B(N(k)) + sum over j of S(j), and a quoted total is C evaluated
    at one k that the quoting source chose. (B) N(k) -- the cardinality of the set of chaining-value
    differences reachable by k chained near-collision blocks drawn from a declared disturbance-vector
    family -- is a countable, purely combinatorial object. It can be computed exactly by forward closure
    over the difference lattice for small k without executing any hash search, and it is the object
    that makes the tradeoff curve explicit. (C) This proposal claims that writing C(k) down and computing
    N(k) for a stated family yields a curve whose minimizing k, curvature near the minimum, and sensitivity
    to the per-block cost model are all reportable quantities, and that the curvature is the quantity
    that determines how much a headline total can be trusted when the per-block model is off by a
    factor. (D) WHAT IS NOT CLAIMED: no new collision, no collision of any kind, no reduction in any
    attack cost, no assertion that the published k is wrong, and no assertion about what any published
    source contains. The deliverable is a function and a curve derived from declared parameters, plus
    a validation of that curve''s SHAPE against an analogue where the whole pipeline is executable.
    (E) The curve is falsifiable in a way a total is not: if C(k) is measured at MD5 scale and its
    shape does not match the predicted form, the functional form of the cost model is wrong independently
    of any SHA-1 number.'
  mechanism: 'STAGE 1, symbolic and zero-compute. Fix a declared disturbance-vector family and a declared
    per-block condition count model. Define the inter-block difference state as the chaining-value
    difference expressed in signed-bit-difference form. Compute N(k) by breadth-first closure: N(1)
    is the size of the single-block reachable difference set, N(k+1) is the size of the Minkowski-style
    sum of N(k) with the single-block set under the chaining addition, deduplicated. Report N(1) through
    N(k_max) exactly, with k_max set by memory. STAGE 2, still symbolic. Write B(N) as the birthday-phase
    cost of finding a chaining-value difference inside a set of size N under a stated parallel-collision-search
    model, and S(j) as the per-block search cost implied by the residual condition count. Compose
    C(k) and locate its minimum, its curvature, and the range of k within a stated factor of the minimum.
    STAGE 3, executable validation of SHAPE at MD5 scale. Instantiate the identical construction for
    MD5, where full chosen-prefix collisions are inside this harness''s budget, compute N(k) the same
    way, run the pipeline at several forced values of k, and compare measured total cost against C(k).
    STAGE 4, null control: recompute N(k) for a randomly drawn difference family of the same cardinality
    and the same block count, and check that its closure growth and the resulting curve differ from
    the structured family. STAGE 5, refutation or scoping: report the measured-versus-predicted ratio
    at each k with the pre-declared agreement factor, and report disagreement as disagreement.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read ledger/questions/RQ-SHAONE-081e3a.yaml in full and ledger/goals/GOAL-SHA1-001.yaml
      in full. Ran: grep -l ''RQ-SHAONE'' ledger/proposals/*.yaml; grep -ril ''chosen-prefix|near-collision|disturbance
      vector|counter-cryptanalysis'' over ledger/proposals ledger/hypotheses knowledge experiments;
      grep -ril ''cost model'' ledger/proposals (233 hits, sampled); grep -ril ''birthday'' ledger/proposals;
      grep -l ''question_id: RQ-MDFIVE|RQ-SHATWO|RQ-SHATHREE'' ledger/proposals/*.yaml. Read knowledge/techniques/KN-TECH-066.md
      and knowledge/literature/KN-LIT-91b680.md.'
    results: ZERO proposals exist against RQ-SHAONE-081e3a, and zero against any other hash research
      question (RQ-MDFIVE-6870c1, RQ-SHATWO-f196c7, RQ-SHATHREE-cd2cb2). The four proposals matching
      near-collision or chosen-prefix vocabulary (IDEA-20260807-4cebed, IDEA-20260807-4d7e8e, IDEA-20260807-5ddccf,
      IDEA-20260807-15b468) are all elliptic-curve records under RQ-EWALK-8fa147 and RQ-EQIC-8cb959
      and match only incidentally. knowledge/literature/KN-LIT-91b680.md is a filed chosen-prefix
      survey note; knowledge/techniques/KN-TECH-066.md records message modification and disturbance
      vectors as a technique but contains no counted difference-state object and no cost curve. The
      233 proposals containing the phrase cost model are dominated by ECDLP and quantum-resource records
      under RQ-INSTR-f8faa0 and RQ-QRE-6dba8c.
    verdict: 'UNVERIFIED. This program cannot read external literature, so no claim is made about
      whether the tradeoff curve C(k) appears in published work; it very plausibly does in some form.
      What is claimed new here is only internal and structural: no record in this repository expresses
      the chosen-prefix cost as a minimization over a counted difference-state cardinality, and none
      computes N(k) as a closure. Assembled from known parts: the disturbance-vector and message-modification
      framing (KN-TECH-066), the chosen-prefix framing (KN-LIT-91b680), and the memory-charged accounting
      discipline the repository already applies elsewhere (RQ-RSA-afe33c).'
  object_first_candidate:
    tracked_object: 'The inter-block chaining-value difference state: the signed-bit-difference representation
      of the difference between the two chains'' internal states at a block boundary, together with
      the set of such states reachable after k chained near-collision blocks. What is followed through
      the computation is the SET, not any message.'
    lossiness: Genuinely lossy. The projection discards every message word, every intermediate expanded-word
      value, and the absolute chaining values themselves, retaining only the difference and only up
      to the signed-bit-difference equivalence. This is compatible with the target operation because
      the compression function's difference propagation, under a fixed disturbance vector, is determined
      by the difference state and the disturbance vector alone, so the retained part still propagates.
      The discarded part is exactly what determines COST-per-block, which is why the object alone
      cannot give a cost and must be paired with a separately declared per-block search-cost model.
      That pairing is the honest statement of what the lossiness costs.
    propagation: 'One step of the target operation is: append one near-collision block. It acts on
      the tracked object as the map S -> dedup(S + D), where D is the single-block reachable difference
      set for the declared disturbance-vector family and + is the chaining addition lifted to difference
      states. Reachability is monotone and the cardinality N(k) = |S_k| is nondecreasing, so a single
      step is computable exactly and cheaply for small k.'
    survival_score: 'The set representation survives exactly as long as the difference lattice stays
      enumerable. Concretely: it survives to the k at which |S_k| exceeds available memory, and it
      dissolves earlier if the signed-bit-difference equivalence stops being a congruence for the
      chaining addition, which happens once carry interactions between adjacent set bits become non-negligible.
      Both boundaries are measurable and must be reported as the object''s stated survival depth,
      not assumed away.'
  null_object_control: 'A random difference family: draw a set D_rand of the same cardinality as D,
    uniformly from difference states of the same Hamming weight profile, and run the IDENTICAL closure
    computation and the IDENTICAL cost composition in the same invocation. The null must show a materially
    different closure growth curve and, critically, a materially different curvature at the minimum
    of C(k). If the random family produces the same curve shape, then the curve is a property of set-closure
    arithmetic rather than of the disturbance-vector structure, and the signal arm means nothing beyond
    combinatorics.'
  discriminated_from:
  - 'IDEA-20260815-e94ea3 (memory of the meet-in-the-middle step in the p^(1/3) isogeny algorithm):
    that record moves a memory exponent inside an isogeny algorithm; this one counts a difference-state
    set in a Merkle-Damgard compression function and claims no exponent at all.'
  - 'KN-TECH-066 (message modification, rebound, internal differentials): that note records how conditions
    are satisfied per block; it does not count the reachable difference set across blocks and does
    not compose a cost curve.'
  - 'KN-LIT-91b680 (chosen-prefix collision survey note): a filed summary of the attack framework,
    at confidence reported; this proposal derives a curve from declared parameters and validates its
    shape by measurement, and asserts nothing about the survey''s content.'
  - 'Ordinary re-statement of the published chosen-prefix cost: that would be a single number carried
    forward; this is a function of k whose minimizing argument, curvature and sensitivity are separately
    reportable and separately falsifiable.'
  - 'RQ-RSA-afe33c''s memory-charged NFS baseline: same charging discipline, entirely different object
    (factoring relation collection versus hash difference closure), and no shared parameter.'
  assumptions:
  - The signed-bit-difference representation is a faithful enough encoding of chaining-value differences
    for the declared disturbance-vector family that closure over it does not lose reachable states;
    violated by carry interactions and reported as a measured boundary, not assumed.
  - A per-block search-cost model S(j) can be declared as an explicit function of residual condition
    count. This is a DECLARED INPUT of the proposal, varied in sensitivity analysis, never fitted
    to make the curve come out right.
  - MD5's chained near-collision structure is a valid SHAPE analogue for the composition C(k) = B(N(k))
    + sum S(j), even though its parameters differ. This is an extrapolation assumption and is stated
    as one.
  - The birthday-phase cost B(N) is monotone decreasing in N over the range considered.
  - Available memory permits exact closure to at least k = 3.
  predictions:
  - metric: curvature of C(k) at its minimum, measured as the factor increase in total cost at k_min
      plus or minus one
    direction: different
    minimum_effect: 'pre-committed as a shape prediction only: C is flat enough that k_min plus or
      minus 1 costs under 2x more. No numeric minimum effect is pre-committed for SHA-1 parameters
      because the per-block model is a declared input, not a measurement.'
  - metric: closure cardinality growth ratio N(k+1)/N(k) for the structured family versus the random
      null family
    direction: lower
    minimum_effect: 2
  - metric: ratio of measured MD5 total cost at forced k to predicted C(k), across at least three
      values of k
    direction: different
    minimum_effect: agreement factor pre-declared at 4x; ratios outside 0.25 to 4 at any tested k
      are reported as model failure
  minimal_test:
    design: 'The cheapest discriminating measurement is entirely symbolic and needs no hash evaluation
      at all: compute N(k) for k = 1, 2, 3 by exact closure for the declared disturbance-vector family
      and, in the same invocation, for a random family of matched cardinality and Hamming profile.
      Compose C(k) with a declared B and S and locate the minimum for both arms. If the two arms produce
      the same curve shape and the same minimizing k, the tracked object carries no structure beyond
      set arithmetic and the whole line closes cheaply with a measured obstruction. If they differ,
      the far more expensive MD5 shape validation is warranted. This test costs minutes of CPU and
      no GPU, produces the null control in the same process, and its negative outcome is a usable
      measured statement about the difference-closure object rather than a fatigue report.'
    controls:
    - Random difference family of matched cardinality and matched Hamming-weight profile, run in the
      same invocation as the signal arm.
    - 'Shuffled-disturbance-vector control: permute the bit positions of the declared disturbance
      vector and recompute closure, to separate structure from mere sparsity.'
    - 'Declared-input sensitivity control: recompute C(k) under at least three different S(j) models
      and report whether k_min moves.'
    - Cardinality-matched but structureless control where D is replaced by a set of independent uniform
      differences.
    required_metrics:
    - N(k) exactly, for k from 1 to k_max, both arms
    - k_max, the k at which enumeration exceeds declared memory
    - C(k) tabulated, both arms
    - k_min and the cost ratio C(k_min +/- 1)/C(k_min)
    - wall-clock and peak resident memory of the closure computation
    - measured-to-predicted ratio at each forced k in the MD5 shape validation
  falsification_conditions:
  - The random null family produces a closure growth curve and a C(k) minimum statistically indistinguishable
    from the structured family, in which case the tracked object is set arithmetic and nothing more.
  - Signed-bit-difference closure is shown non-congruent for the chaining addition at k = 2, so N(k)
    undercounts and the object dissolves at the first chained step.
  - MD5 measured cost at forced k falls outside the pre-declared 4x agreement band at two or more
    of the three tested k values.
  - k_min shifts by more than one unit under a modest perturbation of the declared S(j), which would
    show the curve reports the input model rather than the object.
  - Enumeration is infeasible even at k = 2 within declared memory, in which case the object is not
    computable at this budget -- an infrastructure boundary, explicitly NOT mathematical evidence.
  confounders:
  - The declared per-block cost model S(j) can dominate the curve entirely, making C(k) a report on
    the input rather than on the difference closure; this is why S is varied.
  - Deduplication in the closure is representation-dependent, so a sloppy canonical form can inflate
    or deflate N(k) by large factors.
  - MD5's block structure differs from SHA-1's; agreement of shape at MD5 does not establish agreement
    of shape at SHA-1 parameters.
  - Memory pressure can silently truncate the closure and be mistaken for saturation of N(k).
  interpretation_limits:
  - A validated curve shape is a statement about a functional form, not about any dollar figure and
    not about the security of anything.
  - The object counts reachability, not cost, so N(k) alone can never yield an attack cost without
    the separately declared and separately fallible S(j).
  - Results are scoped to the single declared disturbance-vector family and the single declared representation;
    a different family is a different measurement.
  target_complexity:
    time_exponent: No attack exponent is claimed. The proposal outputs a cost FUNCTION whose inputs
      are declared, not an exponent for any algorithm.
    memory_exponent: No attack memory exponent is claimed. The proposal reports the memory of its
      own closure computation as a measured instrument cost.
    best_known: The incumbent is the published chosen-prefix collision cost for SHA-1 as a single
      quoted figure, recorded in this repository only as UNVERIFIED provenance inside RQ-SHAONE-081e3a.
      Nothing here would beat it; the deliverable is a decomposition of the same quantity.
    hidden_overhead: The closure's deduplication and canonicalisation cost grows faster than N(k)
      itself and is easy to under-report. In human cost, choosing and defending the declared S(j)
      model is the bulk of the work and is where a reviewer's disagreement will land. The MD5 shape-validation
      arm inherits GOAL-MD5-001's entire pipeline cost and is not free.
  dominated_by: 'n/a (no result claimed). Checked against the only cost frontier this repository holds
    for the object -- the single quoted chosen-prefix figure carried at UNVERIFIED provenance in RQ-SHAONE-081e3a
    -- across time, memory and data axes: this proposal produces no point on that frontier because
    it claims no attack. It is not null; it is inapplicable, and stated as such.'
  sota_delta: no attack; conceptual/measurement contribution only. Quantitatively, the deliverable
    changes one scalar into a tabulated function of k with a reported minimum, a reported curvature,
    and a measured-to-predicted ratio at three MD5-scale points. The comparison to state of the art
    is not a speed number and there is none to give.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Three separable parts. (1) That N(k) is exactly computable by closure
    for k up to 3 within memory: about 0.8, since it is finite combinatorics and the only real risk
    is representation blow-up. (2) That the structured family''s curve differs materially from the
    random null: about 0.5 -- this is the part I would most expect to fail, because set-closure growth
    is often dominated by cardinality rather than structure, and failure here is the most useful cheap
    outcome. (3) That MD5 measured cost matches C(k) within the pre-declared 4x band at all three
    k: about 0.35, because the declared S(j) model is the weakest link and a factor-4 band across
    three points is a demanding joint test. The composite that everything survives is therefore roughly
    0.15, and I would still run part (1) and (2) because they cost minutes.'
