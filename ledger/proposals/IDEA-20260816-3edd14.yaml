idea:
  id: IDEA-20260816-3edd14
  question_id: RQ-SHAONE-081e3a
  added: '2026-08-16'
  title: 'Count the detector''s coverage instead of describing it: enumerate the disturbance-vector
    class as a finite indexed set generated by the local-collision recurrence, mark each element as
    covered or uncovered by the re-implemented criterion, and report coverage as a fraction with the
    uncovered elements named individually.'
  class: theory
  claim: '(A) A detector criterion is either defined over a CLASS of disturbance vectors or over a
    LIST of specific instances, and the difference is decidable by enumeration rather than by argument.
    The disturbance-vector class for a Merkle-Damgard ARX compression function is finite and generated:
    each element is determined by a starting local-collision position and a step index, propagated
    forward and backward by the message-expansion recurrence, so the class can be indexed and counted
    exactly. (B) Given that enumeration and a re-implemented criterion, coverage becomes a counting
    question: for each indexed disturbance vector, does the criterion contain a test that would fire
    on a near-collision block built from it? The output is a fraction covered, a list of uncovered
    indices, and -- the part that makes it an audit rather than a tally -- a structural description
    of what the uncovered indices have in common. (C) The claim is that this enumeration is affordable
    at zero cryptographic compute, that the covered fraction is a well-defined number once the indexing
    is declared, and that the uncovered set, if non-empty, has a describable structure rather than
    being scattered. (D) WHAT IS NOT CLAIMED: no evading object is constructed here, no assertion
    that an uncovered index is exploitable, no assertion about what any published detector does, no
    attack, and no statement about any deployed system. An uncovered index is a gap in a criterion''s
    TEST LIST, which is not the same as a gap in its protection, and the two must never be conflated.
    (E) An audit finding full coverage over the enumerated class is a real, useful and reportable
    result, and is the outcome the proposal treats as most likely.'
  mechanism: 'STAGE 1: declare the indexing. Fix the local-collision generator, the message-expansion
    recurrence, and the window over which disturbance vectors are counted, so that every element of
    the class has a canonical index. This is a declaration, not a discovery, and it bounds every subsequent
    number. STAGE 2: generate the class by running the recurrence forward and backward from every
    admissible starting position, discarding elements that violate declared feasibility conditions,
    and count what remains. Report both the raw count and the count after feasibility filtering, since
    the filter is where an audit can silently shrink its own denominator. STAGE 3: extract the criterion''s
    test set from the re-implemented predicate as a machine-readable list of indices or index patterns,
    not as prose. STAGE 4: compute the set difference. Report covered fraction, uncovered indices,
    and the criterion tests that match no class element, which is the reverse direction and equally
    informative. STAGE 5: characterise the uncovered set -- fit it against the declared index coordinates
    (starting position, step offset, sign pattern) and report whether it is a structured band, a scattered
    remainder, or empty. STAGE 6: the null control -- generate a random index set of identical cardinality
    to the criterion''s test set and compute its coverage of the same class, establishing what coverage
    a criterion of the same SIZE but no design would achieve.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read RQ-SHAONE-081e3a in full, whose third target names exactly this distinction, and
      GOAL-SHA1-001 in full. Ran: grep -ril ''disturbance vector'' across ledger/proposals ledger/hypotheses
      knowledge experiments; grep -ril ''counter-cryptanalysis'' ledger/proposals (zero); grep -l
      ''RQ-SHAONE'' ledger/proposals/*.yaml (zero); grep -ril ''local collision'' knowledge. Read
      knowledge/techniques/KN-TECH-066.md in full, which is the only corpus entry describing disturbance
      vectors as a technique.'
    results: Disturbance-vector vocabulary appears in knowledge/techniques/KN-TECH-066.md, which records
      message modification and notes that the same accounting drives the local collisions and disturbance
      vectors used against the SHA family, citing KN-LIT-2958, KN-LIT-4387 and KN-LIT-4909. It contains
      no enumeration and no coverage notion. The only proposal-level matches for the phrase are elliptic-curve
      records (IDEA-20260807-4cebed, IDEA-20260807-15b468 under RQ-EWALK-8fa147) matching on unrelated
      wording. No proposal anywhere in ledger/proposals treats a detector criterion as a set to be
      counted against a generated class.
    verdict: 'UNVERIFIED. No claim is made about whether the disturbance-vector class has been enumerated
      in published work -- it plausibly has been, since the class is a standard construction. What
      is claimed new is only internal: this repository holds no enumeration, no indexing convention,
      and no coverage fraction for any detector, and the RQ record explicitly states that its corpus
      shows no independent re-derivation of the detector''s coverage. Assembled from known parts:
      the local-collision and disturbance-vector construction recorded in KN-TECH-066, and the set-difference
      audit pattern the program already uses for its own records.'
  object_first_candidate:
    tracked_object: The disturbance vector itself, carried as a canonical index triple (starting local-collision
      step, expansion window offset, sign pattern) together with its expanded bit-mask over the full
      step range. What is followed through the computation is the INDEX, and the expansion is the
      operation applied to it.
    lossiness: Genuinely lossy, and the proposal is explicit that it must be checked rather than assumed.
      The index triple discards the expanded mask, retaining only three coordinates; the mask is recomputable
      from the index by the recurrence, so the projection is compatible with the expansion operation
      and the retained part propagates. HOWEVER, if two distinct index triples expand to the same
      mask, the projection is not injective in the direction that matters and coverage counted over
      indices differs from coverage counted over masks. Measuring the index-to-mask collision rate
      is therefore a required metric, and if it is zero the projection loses nothing and the indexing
      is a change of coordinates -- which the proposal would then say plainly rather than dress up.
    propagation: One step of the target operation is one application of the message-expansion recurrence.
      It acts on the tracked object by shifting the index's window offset by one and updating the
      expanded mask deterministically; feasibility conditions prune indices whose expanded mask violates
      the declared weight or position constraints. Propagation is therefore a deterministic finite
      automaton over the index space, and the reachable set after the full step range is the class.
    survival_score: The index representation survives the entire expansion range by construction,
      since it is defined by it. It dissolves in usefulness at the point where feasibility filtering
      removes so large a fraction that the surviving class is dominated by the filter rather than
      by the recurrence -- concretely, if the post-filter count falls below a declared fraction of
      the raw count, the reported coverage is a statement about the filter and must be labelled as
      one. That fraction is a required metric precisely so this failure is visible.
  null_object_control: 'A random criterion of matched size: draw a set of indices uniformly from the
    enumerated class with cardinality exactly equal to the re-implemented criterion''s test-set cardinality,
    and compute its coverage of the class by the IDENTICAL set-difference code in the same invocation,
    over at least 200 draws to give a null distribution. The null must show materially lower coverage
    than the real criterion. If a randomly drawn set of the same size covers the class as well as
    the criterion does, then the criterion''s coverage is explained by its size alone and the audit
    has measured cardinality, not design.'
  discriminated_from:
  - 'KN-TECH-066 (message modification and disturbance vectors as technique): a descriptive technique
    note with no enumeration, no indexing convention and no coverage fraction; this proposal produces
    counts, and asserts nothing about the note''s cited sources.'
  - 'The empirical detector error-rate proposal in this same batch: that one measures false-positive
    and true-positive rates on corpora; this one never runs the detector on a message at all and instead
    compares two finite sets. They are complementary and deliberately separated so neither can borrow
    the other''s evidence.'
  - 'An attempt to construct an evading object: that is the adversarial control GOAL-SHA1-001 requires
    before coverage is reported, and it is a separate and harder deliverable; this proposal produces
    the target list an evasion attempt would need but does not attempt one.'
  - 'A prose reading of the detector''s source code: that yields a verdict; this yields a fraction,
    a named uncovered set, a reverse-direction count of tests matching nothing, and a size-matched
    null distribution.'
  - 'Semaev-style degree-of-regularity ladders and any algebraic-solver sweep: entirely different
    object and different operation, sharing only the word enumeration; the DREG lane owns those and
    nothing here touches them.'
  assumptions:
  - The declared indexing is canonical enough that two implementations of the enumeration would agree
    on the count; verified by re-deriving the count under a second, independently written indexing
    and comparing.
  - The criterion's test set can be extracted mechanically from the re-implementation rather than
    read out by hand, which is what keeps the audit reproducible.
  - Feasibility filtering conditions are declared before enumeration and not tuned to the coverage
    answer.
  - The expansion recurrence is implemented correctly, checked against declared local-collision test
    vectors.
  - Coverage over the enumerated class is the intended meaning of coverage; other meanings exist and
    this contract does not claim to settle which is right.
  predictions:
  - metric: covered fraction of the feasibility-filtered class by the re-implemented criterion
    direction: higher
    minimum_effect: 0.9
  - metric: covered fraction achieved by size-matched random criteria (null distribution median)
    direction: lower
    minimum_effect: 0.3
  - metric: index-to-mask collision rate in the enumeration
    direction: different
    minimum_effect: 'explicit refusal to pre-commit: this rate decides whether the index projection
      is lossy at all, and pre-committing a value would prejudge the lossy-projection test the proposal
      is obliged to run honestly.'
  - metric: post-filter class count as a fraction of raw class count
    direction: higher
    minimum_effect: 0.1
  minimal_test:
    design: 'The cheapest discriminating step is STAGE 2 alone, with no criterion involved: enumerate
      the class under the declared indexing, count it raw and post-filter, and measure the index-to-mask
      collision rate. This is pure finite combinatorics, costs minutes, and settles two things that
      gate everything else. First, whether the class is small enough to enumerate exhaustively at
      all, since a class that is not enumerable makes every coverage fraction meaningless. Second,
      whether the index projection is lossy -- if the collision rate is zero, the indexing loses nothing
      and the proposal must say so, which changes how the coverage number may be described. Only if
      the class enumerates cleanly and the projection is genuinely many-to-one does the far more expensive
      criterion extraction and set difference become worth doing. The null arm (size-matched random
      criteria) is cheap enough to include in the same invocation once the class exists.'
    controls:
    - Size-matched random criterion sets, 200 draws, same invocation, same set-difference code.
    - Second independent implementation of the indexing and enumeration, compared count-for-count.
    - Local-collision test vectors validating the expansion recurrence before enumeration.
    - Unfiltered enumeration reported alongside the filtered one, so the filter's effect is visible.
    - 'Reverse-direction count: criterion tests matching no class element, which detects an over-broad
      or mis-extracted criterion.'
    required_metrics:
    - raw class cardinality and post-filter cardinality
    - index-to-mask collision rate
    - covered fraction of the filtered class
    - list of uncovered indices with their index coordinates
    - count of criterion tests matching no class element
    - null distribution of coverage over 200 size-matched random criteria
    - agreement between the two independent enumeration implementations
  falsification_conditions:
  - The two independent enumeration implementations disagree on the class count, voiding every coverage
    fraction.
  - Size-matched random criteria achieve coverage statistically indistinguishable from the real criterion,
    showing coverage is explained by cardinality alone.
  - The class is not exhaustively enumerable within declared memory, in which case no coverage fraction
    exists at this budget -- an infrastructure boundary, explicitly not evidence about the detector.
  - The criterion cannot be extracted mechanically and would have to be read out by hand, which makes
    the audit unreproducible and halts it.
  - Post-filter count falls below the declared fraction of raw count, so the reported coverage is
    a statement about the filter and must be relabelled.
  confounders:
  - The declared indexing determines the denominator, so a different but equally defensible indexing
    gives a different coverage fraction; this is why two implementations are required and why the
    indexing is declared before enumeration.
  - Feasibility filtering can be tightened until coverage looks complete, which is why the raw count
    is reported beside it.
  - Mechanical extraction of the criterion can miss tests expressed implicitly in control flow rather
    than in tables, understating coverage.
  - An uncovered index may be infeasible for reasons outside the declared filter, so an uncovered
    set can look like a gap when it is merely an unfiltered impossibility.
  interpretation_limits:
  - An uncovered index is a gap in a test list, not a demonstrated evasion and not a security consequence;
    the two may not be conflated in any downstream citation.
  - Coverage is scoped to the declared indexing, the declared feasibility filter and this re-implementation
    of the criterion, and does not transfer to any other formulation.
  - Full coverage over the enumerated class says nothing about elements outside the class, and the
    class's own completeness is a declaration, not a theorem.
  target_complexity:
    time_exponent: No attack exponent is claimed. The deliverable is a coverage fraction over a finite
      enumerated set.
    memory_exponent: No attack memory exponent is claimed. The enumeration's own peak memory is reported
      as an instrument cost.
    best_known: The incumbent is the unquantified position, which RQ-SHAONE-081e3a records as never
      independently re-derived in this program's corpus, that the deployed detector's criterion closes
      the residual risk. No algorithm is beaten; a qualitative position is replaced by a counted fraction
      with a named uncovered set.
    hidden_overhead: Writing the indexing convention twice, independently, so the counts can be cross-checked,
      is most of the human cost and is the part most likely to be skipped under time pressure -- and
      skipping it makes the headline fraction unfalsifiable. The feasibility filter is where an audit
      can be quietly rigged, and defending it consumes more review time than the enumeration itself.
      Mechanical criterion extraction may require reading control flow, not tables, and that is open-ended
      work.
  dominated_by: 'n/a (no result claimed). Checked across time, memory and data/query axes: the proposal
    outputs a set-coverage fraction and places no point on any attack frontier, so the only frontier
    row this repository records in the domain -- the UNVERIFIED chosen-prefix cost figure in RQ-SHAONE-081e3a
    -- is on a disjoint axis set and cannot dominate or be dominated. Not null; inapplicable, and
    stated so.'
  sota_delta: no attack; conceptual/measurement contribution only. Quantitatively the deliverable
    moves the repository's knowledge of detector coverage from no number to a fraction over a declared
    class with a named uncovered set, a reverse-direction count, and a 200-draw null distribution.
    No speed, memory or data comparison exists to state.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Separable parts. (1) That the class is exhaustively enumerable under
    a declared indexing within memory: about 0.8, since it is a filtered recurrence over a bounded
    window. (2) That the index-to-mask projection is genuinely many-to-one, making the tracked object
    lossy rather than a change of coordinates: about 0.45 -- I genuinely do not know, and the honest
    outcome may be that the indexing loses nothing. (3) That the criterion can be extracted mechanically
    rather than by hand: about 0.5, gated on the same primary-text acquisition that gates the empirical
    detector proposal. (4) That the real criterion beats size-matched random criteria on coverage:
    about 0.85, since a designed test set almost certainly does. Composite roughly 0.15; parts (1)
    and (2), which cost minutes and are worth running first regardless, sit near 0.36.'
