idea:
  id: IDEA-20260813-c6e557
  question_id: RQ-QALG-74bf20
  goal_id: GOAL-QALG-001
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  title: >-
    Amplitude-amplified pairing selection inside Kuperberg's sieve rounds:
    does quantum search over combination choices reduce round count, or only
    the per-round list-size constant?
  class: control

  claim: >-
    Kuperberg's sieve selects which pairs of same-bucket states to combine
    at each round via a fixed classical local rule. This proposal asks
    whether replacing that local rule with an amplitude-amplification
    (Grover-type) search over the current round's list for higher-quality
    pairs (more aligned leading bits than the bucket rule guarantees)
    reduces the NUMBER OF ROUNDS the sieve needs (an exponent-form claim) or
    only reduces the LIST SIZE needed per round for a fixed round count (a
    constant-in-the-exponent claim), once the oracle cost of the amplitude-
    amplification search itself is fully charged.

  mechanism: >-
    At each sieve round, states are bucketed by leading label bits; within a
    bucket, any pair combines with a known alignment quality (matching bits
    beyond the bucket boundary). A Grover-type search over the O(L^2)
    candidate pairs in a list of size L, using an oracle recognizing
    "alignment quality above threshold t," can find a pair meeting threshold
    t in O(sqrt(L^2/T)) oracle calls where T is the qualifying-pair count --
    a quadratic speedup over classical exhaustive pairing search for the
    same threshold t. The candidate mechanism raises t above what
    random/local bucketing typically achieves, and asks whether the
    resulting higher per-round bit-fold, compounded over R rounds, changes R
    itself rather than merely shrinking L at fixed R.

  established_families_declared_off_limits: >-
    Per docs/inventor-protocol.md section 1: Kuperberg's own local bucket
    rule (KN-LIT-2c8264) and its round-count/list-size balance formula are
    the declared baseline. Generic Grover/amplitude-amplification speedups
    applied to a classical subroutine inside a larger algorithm are a
    well-known generic technique, not itself a novel structural ingredient;
    this proposal's delta is narrowly whether THIS SPECIFIC recursive
    structure's round count (not just its per-round list size) benefits,
    which is not addressed by any filed KN-* entry.

  novelty_status: unverified
  novelty_screen: >-
    crypto-kb MCP was unavailable and WebSearch failed on every attempt this
    session (see retrieval-screen.yaml). Corpus grep found no KN-* entry
    analyzing amplitude-amplified pairing selection inside Kuperberg's
    sieve. Novelty is unverified; the generic Grover-on-a-subroutine pattern
    is itself well known, and this proposal's specific claim is scoped
    narrowly to a genuine open question the corpus screening could not
    settle either way.

  assumptions:
    - >-
      The black-box query-complexity model (Grover query count versus
      classical exhaustive-search cost) is the correct model for bounding
      the search step's abstract cost; the proposal's own runtime proof
      obligation is to check whether this abstraction hides state-
      preparation/uncomputation cost that changes the conclusion.

  proof_search_map:
    bottleneck: >-
      Whether the TOTAL number of oracle calls (each requiring re-preparing/
      uncomputing coherent coset states, not free) across all R' rounds of a
      Grover-accelerated sieve is smaller than the total query count of
      Kuperberg's own R-round sieve at its own published operating point --
      i.e. whether R' < R by enough to overcome the per-round oracle-call
      overhead the search itself introduces.
    baseline_embedding:
      parameter_slice: >-
        Kuperberg's round-count-vs-list-size balance equation (R rounds,
        each requiring a list of a size trading off against R to give
        2^{O(sqrt(log N))} overall) is the exact old-method boundary.
      reproduction_check: >-
        Not performed this session. Required before Coordinator approval:
        symbolically re-derive the R-vs-L balance point from Kuperberg's own
        stated formula, not a secondary source, to have an exact baseline to
        compare the Grover-accelerated variant's R'-vs-L' balance against.
    observation_collision:
      observable: Total oracle-call count (state preparations plus combination operations) required to reduce an n-bit label to O(1) bits.
      distinct_preimage_search: >-
        Search for a threshold t (the Grover search's target alignment
        quality) at which the Grover-accelerated total oracle count EQUALS
        Kuperberg's own baseline total exactly -- if such a t always exists
        and is optimal (the search's own overhead exactly cancels its own
        benefit at the balance point), that is a direct signature that the
        generic quadratic speedup provides no net gain once fully charged, a
        well-known pattern for Grover-type speedups applied to already-
        optimized recursive structures.
    constructive_transforms:
      - transform: telescoping_potential
        proposed_object: >-
          Charge each round's Grover search cost against a global
          "informational budget" (total bits of label reduction still
          needed), analogous to the exemplar's telescoping-potential
          transform, to check whether the search's marginal cost-per-bit-
          gained is constant across rounds or grows.
        predicted_gain: >-
          If the marginal cost-per-bit is CONSTANT (the honest a-priori
          expectation for a generic quadratic speedup applied uniformly),
          the net effect is at best a constant-factor reduction in
          Kuperberg's own exponent constant, not a round-count/functional-
          form change -- stated here as the predicted, not assumed, outcome.
    quantifier_order: >-
      Kuperberg's claim: for all N, R=Theta(sqrt(log N)) rounds suffice with
      list size L=2^{O(sqrt(log N))}. This proposal's claim, if favorable:
      for all N, R'<R rounds suffice with the same or smaller L via Grover-
      accelerated pairing. The critical quantifier check: is R bounded by an
      information-theoretic quantity (total bits to resolve, divided by
      bits resolved per round) that no per-round SEARCH STRATEGY can
      change, since the qualifying pairs' EXISTENCE (not just their
      discovery cost) bounds bits-resolved-per-round; if T (qualifying-pair
      count) shrinks as t is raised, Grover's sqrt(L^2/T) cost grows
      correspondingly, and the net tradeoff may be provably unchanged by the
      search-strategy quantifier alone.
    method_ceiling:
      strongest_certifiable_claim: >-
        At best, this method could certify a genuine round-count reduction
        if the informational-budget argument above is wrong (an unlikely
        but not yet excluded possibility). The most likely certifiable
        ceiling, per the telescoping-potential prediction, is a constant-
        factor reduction in the existing sqrt(log N)-form exponent's
        leading coefficient, explicitly NOT exponent-moving per
        docs/target-result-profile.md A1, reportable as a building-block
        result only if a distinct exponent-moving idea in this batch needs
        it as a sub-component -- checked against IDEA-20260813-55d3a0 (the
        CRT decomposition, orthogonal, does not depend on pairing-search
        quality) and IDEA-20260813-e6d55d (Simon's specialization, also
        orthogonal); it currently stands alone.
      nearby_object_control: >-
        Apply the identical Grover-pairing-search construction to a toy
        sieve instance (N=2^12..2^16, fully classically simulable including
        the classical cost of an exhaustive pairing search as a stand-in
        for the Grover query count, per the well-known equivalence between
        Grover query count and the square root of the classical exhaustive-
        search cost) and measure whether raising the alignment threshold t,
        at the same total oracle-call budget, yields a net reduction in
        total rounds-to-completion versus Kuperberg's own local-bucket rule
        at that toy size -- a decisive, purely classical query-counting toy
        experiment.
    proof_obligations:
      - claim: The per-round qualifying-pair count T(t) as a function of threshold t and list size L is correctly characterized.
        responsibility: size
      - claim: The informational-budget argument (per-round bit yield capped by pair existence, independent of search strategy) either holds or is refuted at toy scale.
        responsibility: correctness
      - claim: The total oracle-call count across all rounds, for the optimal threshold t at each round, is smaller than Kuperberg's own baseline total, fully charged.
        responsibility: runtime
    not_applicable_reason: null

  predictions:
    - metric: >-
        total oracle-call count (Kuperberg baseline versus Grover-
        accelerated pairing), toy scale N=2^12..2^16, as a function of
        chosen threshold t
      direction: different
      minimum_effect: >-
        any threshold t at which the Grover-accelerated total is
        asymptotically (not just toy-scale-numerically) smaller than
        baseline, extrapolated via the closed-form T(t) formula rather than
        toy simulation alone. The honest a-priori expectation, per the
        telescoping-potential argument, is that the minimum over t of the
        Grover-accelerated total EQUALS the Kuperberg baseline's total up to
        lower-order terms, i.e. no asymptotic net gain -- a prediction to be
        checked, not assumed.

  minimal_test:
    design: >-
      Classical, closed-form and toy-simulated combined. Derive T(t)
      (qualifying-pair count versus threshold) symbolically from the
      label-bit-alignment combinatorics Kuperberg's own paper already uses
      for its list-size bookkeeping; compute the resulting Grover-
      accelerated total oracle count as a function of t and R' (number of
      rounds), minimize over both, and compare the closed-form minimum
      against Kuperberg's own published total. Cross-check the closed-form
      prediction against toy-scale (N=2^12..2^16) classical simulation of
      the pairing-search cost.
    controls:
      - Kuperberg's own local bucket rule, exactly as published, as the baseline reproduction control.
      - >-
        A "cheating" oracle that always finds the globally best possible
        pair at zero cost (an idealized upper bound on any search
        strategy's benefit) to establish the absolute best-case ceiling
        regardless of Grover's specific quadratic form.
      - A random-threshold null (t chosen uninformatively) to confirm the toy harness detects when threshold choice matters at all.
    required_metrics:
      - T(t) closed-form and toy-verified qualifying-pair counts
      - total oracle-call count, Kuperberg baseline versus Grover-accelerated at optimal t versus idealized zero-cost-oracle upper bound
      - round count R' versus R at the cost-minimizing threshold

  falsification_conditions:
    - >-
      The closed-form minimum of the Grover-accelerated total, over all
      thresholds t, equals Kuperberg's own baseline total up to a bounded
      constant factor (predicted outcome) -- closes the exponent-moving
      branch, leaving only a possible constant-factor result, honestly
      reported as such.
    - >-
      Even the idealized zero-cost-oracle upper bound (best possible pairing
      strategy, ignoring search cost entirely) does not reduce round count
      below Kuperberg's own R -- this would close the proposal entirely,
      since it shows round count is bounded by pair EXISTENCE, not search
      cost, regardless of implementation.
    - >-
      Toy-scale simulation contradicts the closed-form T(t) prediction,
      indicating an error in the combinatorial derivation that must be
      fixed before any further conclusion.

  confounders:
    - >-
      The Grover-query-count-versus-sqrt-of-classical-cost equivalence used
      in the nearby-object control is a specific black-box-model assumption
      that may not capture the ACTUAL cost of preparing/uncomputing the
      coherent states the oracle would act on -- a confound this proposal's
      runtime proof obligation must resolve, not assume.
    - >-
      Toy-scale round counts are small integers (R ~ 2-4 for N=2^12..2^16),
      so an apparent reduction from say 3 rounds to 2 rounds at toy scale
      may not extrapolate to an asymptotic round-count functional-form
      change -- the closed-form derivation, not the toy count alone, carries
      the asymptotic claim.

  interpretation_limits:
    - A toy-scale or closed-form combinatorial finding here says nothing about CSIDH's security level.
    - >-
      If the idealized zero-cost-oracle control also fails to reduce round
      count (the most likely single outcome per the informational-budget
      argument), that is a genuine closure per docs/inventor-protocol.md
      section 4: a named obstruction (per-round bit yield capped by pair
      existence, independent of search strategy) with forward guidance --
      any future round-count reduction must change what counts as a
      "qualifying pair" (e.g. by moving to k-ary combination as in
      IDEA-20260813-710293), not by searching harder within the existing
      pairwise definition.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The qualifying-pair count T(t) for a uniformly random current-round
        label list of size L behaves, as L grows within the toy-testable
        range, like the count predicted by treating labels as independent
        uniformly random bit strings.
      rigorous_support: >-
        Imitates Kuperberg's own published combinatorial analysis of bucket
        sizes under a uniform-label assumption; no new rigorous bound is
        introduced, so H1's justification is exactly as strong (or weak) as
        the corresponding assumption already embedded in the established
        baseline, made explicit here rather than left implicit.
      validation_plan: >-
        At toy scale (N=2^12..2^16), directly enumerate the actual label
        distribution produced by Kuperberg's sieve (not an assumed uniform
        distribution) and compare the empirical qualifying-pair count
        against H1's predicted count, flagging any systematic deviation
        (e.g. if the sieve's own dynamics produce non-uniform label
        clustering that helps or hurts the Grover-search approach
        differently than the idealized bookkeeping predicts).

  target_complexity:
    time_exponent: >-
      Predicted, per the telescoping-potential and method-ceiling analysis
      above: no functional-form change; at best a constant-factor reduction
      to Kuperberg's own exponent constant within the same
      2^{O(sqrt(log N))} form. Stated as the honest, most-likely target
      complexity given the pre-compute audits.
    memory_exponent: >-
      Comparable to or larger than Kuperberg's own baseline (Grover-type
      search over pairs typically requires simultaneous coherent access to
      the current list, an additional resource not needed by the classical
      local bucket rule).
    best_known: >-
      2^{O(sqrt(log N))} time and query (Kuperberg 2005, KN-LIT-2c8264);
      collimation c-sieve (KN-LIT-127) for the memory axis.
    hidden_overhead: >-
      The generic Grover-search oracle-call overhead (state preparation/
      uncomputation cost per candidate pair examined) is not captured by the
      abstract sqrt(L^2/T) query count and must be charged explicitly per
      this proposal's own runtime proof obligation before any numeric claim
      is made.
    tradeoff_note: >-
      If a genuine, even constant-factor, gain survives, it would need to
      be positioned as a building block only if some other exponent-moving
      mechanism in this program's portfolio needs it -- checked against
      IDEA-20260813-55d3a0 and IDEA-20260813-e6d55d, neither of which
      depends on this proposal's pairing-search mechanism, so this idea
      currently stands alone as, at best, a modest constant-factor building
      block.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: low

  dominated_by: >-
    Kuperberg's sieve (KN-LIT-2c8264) and its collimation variant
    (KN-LIT-127) dominate on every checked axis as of this session; this
    proposal's own method-ceiling analysis already predicts it will not
    surpass them even in its best case (a constant-factor gain at best), so
    no frontier row is dominated by this proposal, predicted or actual.

  sota_delta: >-
    0x / no measured improvement; no experiment run. This proposal's own
    pre-compute analysis assigns LOW confidence to any net gain surviving
    full cost-charging, stated honestly rather than as an open positive
    claim.

