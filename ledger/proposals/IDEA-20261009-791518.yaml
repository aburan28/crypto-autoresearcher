idea:
  id: IDEA-20261009-791518
  question_id: RQ-CZLIFT-b9f765
  goal_id: GOAL-CZLIFT-1516d5
  added: '2026-10-09'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  source: User request 2026-10-09 ('these all sound great') on the follow-on angles after BATCH-2e44f7; filed by
    the coordinator under the standing authorization.
  title: 'Retrieve, not recall, the rank ladder: extend the small-point census to ranks 8-11 with LMFDB equations'
  class: measurement
  claim: With retrieved (LMFDB) equations for the minimal-conductor curves of rank 8 to 11, the growth slope of
    log N_E(H) against log log H stays within 1 of r/2, the coverage ratio to the uniform model stays in [0.8, 1.2],
    and the constant c_E in N_E(H) ~ c_E (log H)^{r/2} falls with the coefficient size, so H_half(p) is not reached
    below H = 10^6 for any p >= 1000.
  mechanism: EXP-CZLIFT-a255fc covered ranks 0-7; the recalled rank-8 equation had no rational points to height
    10^5 and was dropped. The user's clause 'the record rank is a bespoke construction' is quantitatively about
    c_E collapsing as coefficients grow; the ladder extension measures it.
  novelty_status: adaptation
  citations:
  - ref: KR-IC-cd159a
    provenance: internal
    verified_by: coordinator, this session (2026-10-09), read the row/entry on disk
    claim: 'Known-negative row: xedni calculus and lifting to characteristic zero fail (Jacobson-Koblitz-Silverman-Stein-Teske);
      forecloses ''canonical lift for ECDLP'' and ''rank of lifted curve''.'
  - ref: KR-RHO-53c89f
    provenance: internal
    verified_by: coordinator, this session (2026-10-09), read the row/entry on disk
    claim: 'Textbook row: Semaev/Satoh-Araki/Smart solve trace-one curves in polynomial time; forecloses ''p-adic
      lifting for trace one'' as a generic algorithm.'
  - ref: KN-TECH-73630e
    provenance: internal
    verified_by: coordinator, this session (2026-10-09), read the row/entry on disk
    claim: The canonical prime-to-p torsion lift exists and is closed for every group-theoretic invariant; the formal
      logarithm route degenerates to O = mO.
  predictions:
  - metric: growth_slopes
    direction: different
    minimum_effect: slopes within 1 of r/2 for every retrieved curve with N_E(10^5) >= 20; no H_half resolved at
      p >= 1000 for ranks >= 8
  minimal_test:
    design: successor contract to EXP-CZLIFT-a255fc with CURVES extended by retrieved equations (provenance retrieved,
      LMFDB label and URL recorded)
    required_metrics:
    - growth_slopes
    - coverage_ratio_median
    - h_half_scaling
    - c_E estimate per curve
  falsification_conditions:
  - a retrieved curve whose slope misses r/2 by more than 1 at N >= 20
  - coverage ratio median outside [0.8, 1.2]
  interpretation_limits:
  - needs network access to LMFDB from the executing session; blocked otherwise
  - naive height to 10^6
  estimated_cost:
