idea:
  id: IDEA-20260816-0a9533
  question_id: RQ-SNOVA-001
  added: '2026-08-16'
  title: 'Signatures without repetition as the tracked object: measure whether the empirical second-moment
    matrix of many honestly generated SNOVA-shaped signatures under one key is biased toward the secret
    oil module, against a null of uniformly resampled valid preimages of the same digests under the
    same key.'
  class: measurement
  claim: '(A) The in-repo treatment of signature-side leakage in this family is entirely about repetition:
    H-MAYO-c0ddab and IDEA-20260805-19990a derive what happens when a vinegar is reused. The complementary
    question - whether signatures produced with perfect randomness carry any bias at all - has not
    been asked, and it is the one that matters for a scheme whose secret is a module rather than a
    subspace, because a module-structured signing procedure has more internal structure to leak through
    than a subspace-structured one. (B) The claim under test is that the empirical second-moment matrix
    of N honestly generated signatures under one fixed key, projected onto the quotient by the digest-determined
    part, has eigenvector overlap with the secret oil module that exceeds the overlap obtained from
    a null of uniformly resampled valid preimages of the same digests under the same key by a margin
    that decays as N^{-1/2} if there is no bias and converges to a nonzero constant if there is. The
    distinguishing move is the null: not random vectors, but OTHER valid signatures for the same digests,
    so the comparison holds fixed everything the verification equation forces and varies only how
    the signer chose among the valid preimages. (C) The deliverable is a measured overlap curve in
    N with its null twin, which quantifies exactly how much a signing procedure''s choice among valid
    preimages reveals at toy parameters. (D) NOT CLAIMED: no key recovery, no attack, no exponent,
    no side-channel or implementation claim, and nothing about deployed parameter sets. A measured
    overlap is not a recovery method; converting an overlap into a recovered module requires a procedure
    this proposal does not supply. A null result - overlap decaying as N^{-1/2} exactly like the null
    - is the expected outcome and is a usable measured bound on preimage-choice leakage.'
  mechanism: 'STAGE 1, honest signing arm. Fix one toy SNOVA-shaped key with a planted oil module
    O. Generate N signatures for N independent random digests using the scheme''s own signing procedure
    with fresh randomness each time, with no repetition of any vinegar. STAGE 2, uniform-preimage
    null arm. For each of the same N digests, enumerate or uniformly sample the full set of valid
    signatures - at toy parameters the preimage of a digest under the public map is enumerable - and
    pick one uniformly at random. This null holds the digest sequence, the key, and the verification
    constraint fixed, and varies only the choice rule. STAGE 3, statistic. For each arm compute the
    empirical second-moment matrix of the signature vectors, project out the component forced by the
    digests, and measure the overlap between its dominant eigenspace and the known oil module, as
    a normalised trace ratio in [0, 1]. STAGE 4, decay law. Repeat over N in a geometric ladder. Under
    no bias, overlap above chance decays as N^{-1/2}; under bias it converges to a positive constant.
    Fitting is not needed: the two hypotheses are separated by whether the overlap at the largest
    N exceeds the null''s at the same N by more than the null''s own dispersion. STAGE 5, the section-3
    check. The parameter that should destroy the signal is randomness quality; degrade the signer''s
    randomness deliberately in a third arm and confirm the overlap rises, which proves the statistic
    can see bias at all before any claim is made about its absence.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-SNOVA-001 and H-SNOVA-ec84c2 in full, and H-MAYO-c0ddab's statement, which is
      the nearest signature-side record. Grepped ledger/proposals/ for 'covariance' (hits IDEA-20260808-e7ba81,
      IDEA-20260805-fbe36a, IDEA-20260805-c8524f, IDEA-20260808-0eb075, IDEA-20260813-8aa6ea, IDEA-20260808-cbb848,
      IDEA-20260813-28cf9c, IDEA-20260805-4d31bc), 'second moment' (hits IDEA-20260808-e7ba81, IDEA-20260804-84328c,
      IDEA-20260805-fc6361 and others) and 'signing' (hits IDEA-20260805-59fa23, IDEA-20260813-945a67,
      IDEA-20260809-5371f0, IDEA-20260805-2a669e and others). Cross-checked which hits are in the
      multivariate slice via the family grep.
    results: H-MAYO-c0ddab and IDEA-20260805-19990a own the repeated-vinegar object for MAYO, deriving
      that N* = 1 + ceil(o/k) signatures under one repeated vinegar suffice for oil-space recovery,
      and explicitly classing it as implementation-class rather than a break of the map. None of the
      'covariance' or 'second moment' hits is in the multivariate slice; they are in ECDLP and program-audit
      areas. IDEA-20260805-70aa6e and H-SNOVA-ec84c2 establish that SNOVA's oil object is a module
      rather than a subspace, which is the reason this question is posed for SNOVA rather than for
      plain UOV. No in-repo record measures any statistic of honestly generated, non-repeating signatures
      in this family.
    verdict: 'UNVERIFIED. No claim is made about published literature; leakage from signature distributions
      is a natural question and may be treated there. Assembled from known parts: the module framing
      is H-SNOVA-ec84c2''s; second-moment estimation and eigenspace overlap are standard statistics;
      the repeated-vinegar contrast is H-MAYO-c0ddab''s and is used here only to say what this is
      NOT. Claimed new relative to the in-repo corpus only: the uniform-valid-preimage null, which
      holds the verification constraint fixed and isolates the signer''s choice rule as the only difference
      between arms.'
  object_first_candidate:
    tracked_object: 'The empirical second-moment matrix of honestly generated signature vectors under
      one fixed key, reduced to a single scalar: the normalised overlap between its dominant eigenspace
      and the known secret oil module.'
    lossiness: 'Lossy. From N signature vectors we retain one scalar per N, discarding every individual
      signature, the digests, the vinegar values, and all higher moments. This is compatible with
      the tracked operation because signing is, at fixed key, a map from randomness to a point in
      an affine subspace determined by the digest, and any systematic preference among those points
      shows up in the second moment; the discarded higher moments could carry bias the statistic misses,
      which is stated as a limitation rather than assumed away. Not a change of coordinates: one scalar
      cannot rebuild N vectors.'
    propagation: 'One step is generating one more signature. Propagation rule: each new signature
      adds a rank-one term to the second-moment matrix, so under no bias the overlap above chance
      shrinks as N^{-1/2} by ordinary concentration, while under a fixed bias the dominant eigenspace
      stabilises and the overlap tends to a constant. That is a sharp qualitative difference in the
      N-dependence rather than a threshold on a single number, which is why the ladder in N is the
      design and a single large N would be the wrong experiment.'
    survival_score: 'The object accumulates rather than dissolving: it is meaningful for all N and
      the question is only whether its excess over the null persists. Concretely the experiment runs
      N over a geometric ladder up to 10^5 signatures per key, and states the largest N at which the
      signal and null curves are still separated, or reports that they are never separated.'
  null_object_control: The null object is a uniformly sampled valid signature for each of the SAME
    digests under the SAME key - a different point of the same preimage set - chosen uniformly rather
    than by the signing procedure. It is generated in the same invocation by enumerating the preimage
    at toy parameters. For the signal arm to mean anything, the null arm's overlap must decay as N^{-1/2}
    and must not exceed chance at large N; if the null itself shows persistent overlap, then valid
    signatures are biased toward the module for reasons the verification equation alone forces, and
    no property of the signing procedure may be inferred. A degraded-randomness third arm serves as
    the positive control that the statistic can detect bias when bias exists.
  discriminated_from:
  - 'H-MAYO-c0ddab and IDEA-20260805-19990a (repeated vinegar seed recovery): those require a repetition
    and derive an exact signature count for full recovery; here no vinegar is ever repeated and no
    recovery is attempted, so the inputs and the outputs are disjoint.'
  - 'IDEA-20260805-2f2863 (weak-key density and orbit invariance for SNOVA): a key-space property;
    this is a signature-distribution property at a fixed, ordinary key.'
  - 'IDEA-20260808-040db9 (extra equations P-polar(X, S^j X) = 0 from the module structure): a key-side
    algebraic consequence of the module; this measures whether the module shows up in the signer''s
    outputs, which no algebraic identity settles.'
  - 'Generic side-channel and fault analyses referenced in RQ-MAYO-001''s motivation: those assume
    an attacker who observes or perturbs an implementation; this observes only the mathematical output
    of an idealised signer and exercises no implementation at all.'
  - 'IDEA-20260813-5988b7 (conditional fibre diagnostics): measures fibres of an attack system given
    a fixed oil space; this measures the empirical distribution of signer outputs and never builds
    an attack system.'
  assumptions:
  - The recalled SNOVA signing structure is correct in shape; this is a Stage 0 reading risk that
    voids the run if wrong.
  - At toy parameters the full preimage of a digest under the public map is enumerable, which is what
    makes the uniform-preimage null constructible at all.
  - The second moment is the right order of statistic to look at first; higher-moment bias would be
    missed and this is stated as a limitation.
  - The signer's randomness in the honest arm is genuinely fresh, seeded from the harness's recorded
    seeds with no reuse, which the run verifies by checking all vinegars are distinct.
  - Exact F_q arithmetic; overlaps are computed as exact rational trace ratios where possible.
  predictions:
  - metric: overlap between the dominant eigenspace of the null arm's second moment and the oil module,
      as N grows
    direction: lower
    minimum_effect: predicted to decay as N^{-1/2} toward the chance level; a persistent null overlap
      invalidates the framing and is reported as such
  - metric: difference between signal-arm and null-arm overlap at the largest N
    direction: different
    minimum_effect: no pre-commitment on sign or size; the honest expectation is zero within dispersion,
      and pre-committing to a positive effect would be inventing a leak I have no mechanism for
  - metric: overlap in the degraded-randomness positive control
    direction: higher
    minimum_effect: 0.2
  - metric: fraction of repeated vinegars in the honest arm
    direction: different
    minimum_effect: 'forced value: exactly 0, verified, since a single repetition would import H-MAYO-c0ddab''s
      effect and contaminate the measurement'
  minimal_test:
    design: 'One key, three arms, one ladder. Take a SNOVA-shaped key over F_4 with ell = 2, v = 4,
      o = 2, so flattened dimensions are small enough that the preimage of a digest is enumerable
      by exhaustive search over the signature space. Generate 10^4 honest signatures for 10^4 distinct
      random digests with fresh randomness, verifying that no vinegar repeats. For the same digests,
      enumerate each preimage and select one uniformly at random, giving the null arm. Generate a
      third arm with the signer''s randomness restricted to a small subset, as a positive control.
      Compute, at N in {10^2, 10^3, 10^4}, each arm''s second-moment matrix, project out the digest-forced
      component, and record the overlap with the known oil module. The three curves in N discriminate
      directly: if honest and null coincide and both decay while the degraded arm does not, the deliverable
      is a measured bound on preimage-choice leakage with a demonstrated-sensitive instrument.'
    controls:
    - Uniform-valid-preimage null on the same digests under the same key, generated in the same invocation.
    - Degraded-randomness positive control, which must show elevated overlap or the statistic is blind
      and no null result may be reported.
    - 'No-repetition verification: all vinegars in the honest arm confirmed distinct, since a repeat
      would import a different and much larger effect.'
    - 'Random-module control: measure the overlap against a random module of the same dimension instead
      of the true oil module; it must decay to chance in every arm.'
    - 'Digest-forced-component control: confirm that projecting out the digest-determined part removes
      the trivially forced overlap, by checking the overlap of the raw second moment before projection
      and reporting both.'
    required_metrics:
    - overlap with the true oil module per arm per N
    - overlap with a random module of the same dimension per arm per N
    - dispersion of the overlap across independent keys
    - verified count of repeated vinegars in the honest arm
    - preimage enumeration size per digest
    - signal-minus-null overlap difference with its dispersion at each N
  falsification_conditions:
  - The null arm shows persistent overlap that does not decay, meaning valid signatures are forced
    toward the module and no signing-procedure inference is possible.
  - The degraded-randomness positive control shows no elevated overlap, meaning the statistic is blind
    and no negative result may be claimed.
  - The random-module control shows overlap above chance, meaning the overlap statistic is miscalibrated.
  - Any repeated vinegar is found in the honest arm, contaminating the measurement.
  - Signal and null curves coincide at every N, which falsifies the bias claim at the tested scope
    and is recorded as a controlled null with a measured bound.
  confounders:
  - The digest-forced component of the signature dominating the second moment and manufacturing overlap;
    mitigated by the explicit projection and by reporting the pre-projection value too.
  - Preimage enumeration being incomplete, so the null is not uniform on the true preimage set; mitigated
    by asserting the enumerated preimage size against the closed-form expected count.
  - Toy parameters making the module a large fraction of the whole space, so chance overlap is high;
    mitigated by the random-module control which measures chance directly.
  - Reading a measured overlap as a recovery capability, which needs a procedure this proposal does
    not have.
  - A signing implementation that inadvertently reuses randomness, which the no-repetition check catches.
  interpretation_limits:
  - Any measured overlap is a statistical property of an idealised signer at toy parameters, not a
    statement about any implementation and not a side-channel result.
  - The second moment is one statistic; a null result bounds second-order bias only and says nothing
    about higher-order structure.
  - Nothing transfers to deployed SNOVA parameters, where the preimage cannot be enumerated and this
    null cannot be built at all.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement costs N signings plus N preimage
      enumerations, the latter bounded by the toy signature-space size.
    memory_exponent: No attack memory exponent is claimed; one second-moment matrix of size n by n
      is accumulated per arm.
    best_known: The incumbent in this repository for signature-side structure in this family is the
      repeated-vinegar result of H-MAYO-c0ddab, which requires a repetition; there is no incumbent
      for the non-repeating case, and no attack incumbent applies because no attack is proposed.
    hidden_overhead: 'The dominant hidden cost is the uniform-preimage null: enumerating a full preimage
      per digest is what limits the parameters, and it is also the only thing that makes the comparison
      meaningful, so the design cannot be scaled by dropping it. A second cost is the projection step,
      where an imprecise removal of the digest-forced component silently creates or destroys the effect
      being measured.'
  dominated_by: n/a (no result claimed). Checked against every frontier row named in RQ-SNOVA-001
    - wedge-product, group-action stability, weak-key universal forgery - on time, memory and query
    axes; none is comparable, since this produces an overlap statistic on signer outputs and no recovery
    procedure of any kind.
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverable is
    an overlap-versus-N curve for three arms with dispersion, and a measured bound on second-order
    preimage-choice bias at the tested toy parameters.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'Part A (the uniform-valid-preimage null is constructible at toy parameters
    and the statistic is well calibrated): 0.7, with the risk concentrated in preimage enumeration
    being larger than expected and in the projection step. Part B (honest signatures show second-moment
    bias toward the oil module exceeding the null): 0.15, deliberately low - I have no mechanism that
    predicts a leak from a correctly randomised signer, and I expect the controlled null, which is
    exactly why the degraded-randomness positive control is mandatory rather than optional. Part C
    (the resulting bound is usable by later work): 0.6, contingent on the bound being tight enough
    at reachable N to say anything a reader could not have assumed.'
