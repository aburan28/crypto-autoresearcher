        On a group of prime order every exactly propagating projection is
        injective or constant; escape E4 ('objects not tracked under the group
        law') is explicitly left open by that record.
      verified_by: this task (record read in full 2026-09-01)
    - ref: IDEA-20260815-f558e4
      provenance: internal
      claim: >-
        Under the majority relaxation the extremal partitions are arithmetic
