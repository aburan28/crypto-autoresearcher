idea:
  id: IDEA-20260901-863e36
  question_id: RQ-ECDLP-002
  added: '2026-09-01'
  title: >-
    THE SECOND AXIS OF THE OBJECT QUESTION: propagation is not a property of a
    projection but of a projection PAIRED WITH AN OPERATION GROUP, and once that
    is said the lossy objects on a prime-order subgroup are exactly the block
    systems of that group's action -- which reproduces the rigidity theorem as
    the translation slice, produces the negation/GLV quotients as the
    multiplication slice, and reduces the entire quotient-search family to ONE
    measurable number, the cost of canonicalising a Gamma-orbit
  class: mechanism

  claim: >-
    Let E/F_p be an ordinary short-Weierstrass curve, P a point of PRIME order n,
    G = <P>, and let Gamma be a subgroup of (Z/n)^* acting on G by R -> [gamma]R.
    Four statements, of decreasing certainty, each separately falsifiable.

    (C1) CLASSIFICATION (elementary, derivation tier). Let Sigma be any set of
    operations of the form R -> [gamma]R with gamma in (Z/n)^*, and Gamma =
    <Sigma>. A map v from G to a set S propagates DETERMINISTICALLY under Sigma
    -- meaning for each gamma in Sigma there exists F_gamma with v([gamma]R) =
    F_gamma(v(R)) for all R -- if and only if the fibre partition of v is a
    Gamma-INVARIANT PARTITION (a system of blocks) of the Gamma-set G minus the
    identity. Proof of the forward direction: v(R) = v(R') implies v([gamma]R) =
    F_gamma(v(R)) = F_gamma(v(R')) = v([gamma]R'), so the partition is preserved
    by the action. Converse: given a preserved partition, define F_gamma on
    images by choosing any fibre representative; preservation is exactly
    well-definedness. No hypothesis on S or F_gamma is used.

    (C2) THE RIGIDITY THEOREM IS THE TRANSLATION SLICE OF (C1), EXACTLY. Take
    Sigma to be the translations R -> R + D, D in G. The acting group is G acting
    on itself regularly, and the block systems of a regular action are precisely
    the coset partitions of subgroups. For n prime the only subgroups are trivial,
    so v is constant or injective -- which is verbatim Theorem (A) of
    IDEA-20260807-df906f. (C1) therefore CONTAINS that theorem as an exact
    parameter slice rather than competing with it, and this is the proposal's
    baseline reproduction check.

    (C3) THE SEARCH-RELEVANT SUB-FAMILY, AND THE TRAP INSIDE IT. When n is prime
    and Gamma is a subgroup of (Z/n)^*, the action of Gamma on G minus the
    identity is FREE, so its orbits all have size r = |Gamma| and there are
    (n-1)/r of them. Among the block systems of (C1), the ones whose fibres are
    exactly the Gamma-ORBITS -- equivalently, those on which every F_gamma is the
    identity -- are the only ones that shrink the search space, to (n-1)/r. THE
    TRAP, NAMED IN ADVANCE: other block systems exist, are genuinely lossy, and
    shrink nothing. Example, for Gamma = {+1,-1} and S = {upper half, lower half}
    of the discrete-log coordinate, negation swaps the two blocks, so v is lossy
    and propagates with F_{-1} = swap, while |S| = 2 gives no quotient of size
    n/2 to search in. A proposal that reports "a lossy propagating object" without
    checking that F_gamma is the identity has found nothing.

    (C4) THE COST LAW, AND WHY THE CONSTANT-FACTOR CEILING IS A THEOREM IN THE
    GENERIC MODEL. Collision search on the orbit quotient costs about
    0.886*sqrt(n/r)*(c_step + c_can) group operations, where c_can is the
    per-step cost of computing the canonical representative of a Gamma-orbit
    (Heuristic H1 below). If c_can is achieved by a GENERIC procedure -- group
    operations, inversions and equality tests on handles only -- then the whole
    algorithm is generic, and the Shoup bound (KN-TECH-005, quoted with its own
    caveat in interpretation_limits) forces
        sqrt(n/r) * c_can  >=  const * sqrt(n),  hence  c_can = Omega(sqrt(r)),
    hence NO net gain, for EVERY Gamma, at every r. A super-constant speedup
    therefore requires a NON-GENERIC canonical form, one that reads coordinates.

    (C5) THE NON-GENERIC FORMS THAT ARE KNOWN ARE EXACTLY THE VARIETY QUOTIENTS,
    AND THAT IS WHY |Gamma| <= 6. A canonical form costing O(1) FIELD operations
    is available when the orbit map is induced by a morphism of the curve: for
    Gamma the image of Aut(E) in (Z/n)^*, E/Gamma is a rational curve (E/{+1,-1}
    is the x-line; the extra automorphisms exist only at j = 0 and j = 1728) and
    the canonical form is a coordinate on the quotient. For gamma not in that
    image, multiplication by an integer representative gamma_0 is an isogeny of
    degree gamma_0^2 > 1, so it generates no finite group of curve automorphisms
    and E modulo it is not an algebraic quotient; no morphism-induced canonical
    form exists. Combining (C4) and (C5): the sqrt(|Aut|) ceiling recorded in
    KN-TECH-018 is not a habit but a consequence, up to exactly one open cell.

    (C6) THE OPEN CELL, WHICH IS THE ONLY THING THIS PROPOSAL ASKS TO MEASURE.
    Canonical forms that are neither generic nor morphism-induced: ARITHMETIC
    SELECTORS. The concrete one this record freezes is
        rho_lambda(R) = the element of the orbit {[lambda^i]R : 0 <= i < r}
        whose x-coordinate is smallest as an integer in [0, p).
    It is well defined, non-generic (it reads x), and computed by no morphism.
    Its cost is the measured quantity c_can. Prediction: c_can grows LINEARLY in
    r and is indistinguishable from the cost of finding the minimum of a random
    cyclic sequence of length r, so the net speedup sqrt(r)/r is below 1 and the
    family is closed with a mechanism. Refutation: an arithmetic selector with
    c_can = o(sqrt(r)) on elliptic orbits but not on the matched null, which by
    (C4) is not forbidden by Shoup because it is not generic, and which would be
    an exponent-relevant lead.

  mechanism: >-
    THE TRACKED OBJECT AND HOW IT IS FOLLOWED. The object is the Gamma-ORBIT of a
    point, {[lambda^i]R}, carried through a collision search whose one-step
    operation is the walk step composed with re-canonicalisation. What the
    projection discards is which element of the orbit is held; what it retains is
    the orbit label. The discard is compatible with the operation set Sigma =
    {multiplication by lambda} by construction and with the walk step only after
    canonicalisation, which is exactly why c_can, not the classification, is the
    load-bearing quantity.

    WHY THIS IS NOT THE PROGRAM'S EXISTING RESULT IN NEW NOTATION. The corpus
    already contains (i) the rigidity theorem for the translation action
    (IDEA-20260807-df906f), (ii) the probabilistic ceiling for statistics under
    the translation action (IDEA-20260815-f558e4), (iii) the auxiliary-state
    bound (H-PROP-c95932), and (iv) the recorded fact that automorphism walks buy
    sqrt(|Aut|) and no more (KN-TECH-018). None of the four varies the OPERATION
    GROUP. Once it is varied, the question "which lossy objects exist" stops
    being a single question with the answer "none" and becomes a family indexed
    by Gamma, whose answer is "the block systems of Gamma", whose useful members
    are the orbit partitions, and whose cost is one number. That reindexing is
    the contribution; the classification proof is four lines and is claimed as
    elementary, not as new mathematics.

    STAGE 1 (ZERO COMPUTE, HARD GATE). Write (C1) and check it against the
    nearby object where its conclusion must FAIL: composite n = l*m, where the
    translation action has proper block systems (the cosets of the order-m
    subgroup) and a lossy exactly-propagating projection therefore DOES exist.
    If the argument cannot separate prime from composite it is wrong and the
    line ends. Then check (C3)'s trap example by exhaustive enumeration at
    n = 23: the half-partition must be reported as propagating AND as
    non-shrinking, by two separate assertions in the code.

    STAGE 2 (INSTRUMENT). Build, at toy p, curves and prime-order subgroups
    together with a scalar lambda of prescribed multiplicative order r modulo n,
    for r running over a declared ladder. NOTE, AND THIS IS THE DESIGN CHOICE
    THAT MAKES THE MEASUREMENT POSSIBLE: lambda need NOT come from an
    endomorphism. The classification and the cost law are statements about the
    action of Gamma on G, and multiplication by lambda is computable in
    O(log n) group operations whatever its provenance, so r can be swept over
    many orders instead of being stuck at the values 2, 4, 6 that Aut(E)
    supplies. Curves with j = 0 and j = 1728 are included separately as the
    morphism-induced positive controls.

    STAGE 3 (THE MEASUREMENT). For each r, measure c_can for rho_lambda under a
    DECLARED family of strategies: (a) full orbit enumeration (the upper bound,
    r point operations); (b) early abort on a prefix of the x-coordinate bits;
    (c) a claw/meet-in-the-middle attempt over the orbit, splitting i = i_1 +
    i_2*ceil(sqrt(r)); (d) any strategy the executor adds, declared before it
    is run. Report, per r, the minimum number of x-evaluations any declared
    strategy needs to CERTIFY the minimum, not to guess it.

    STAGE 4 (NULLS AND CONTROLS), on the identical pipeline. See
    null_object_control.

    STAGE 5 (DECAY / ARTIFACT CHECK). If any strategy shows c_can below the
    r-linear law, repeat across three field sizes and at least four values of r.
    An advantage that does not GROW with r, or that does not persist as p grows,
    is an artifact under docs/inventor-protocol.md section 3 and is reported as
    a controlled null.

  novelty_status: unverified

  novelty_screen:
    method: >-
      KB RETRIEVAL WAS UNAVAILABLE FOR THIS SESSION and this is recorded as a
      limitation rather than as evidence: CRYPTO_KB_QDRANT_URL is ':memory:',
      the derived index is empty, and per AGENTS.md every query would have
      returned nothing for reasons unrelated to novelty. The crypto-kb MCP tools
      were therefore NOT called. Screening was done by direct reading. Greps run
      2026-09-01 from the repository root over ledger/ and knowledge/ for:
      'canonicalization|canonicalisation .{0,80}orbit', '(Z/n)\^\*',
      'multiplicative subgroup.{0,60}(orbit|quotient)', 'Kohel|Shparlinski',
      'O/(pi-1)', 'KN-OPEN-019'; plus full reads of IDEA-20260807-df906f,
      IDEA-20260815-f558e4 (claim section), H-PROP-c95932, KN-TECH-018,
      KN-TECH-015, KN-FIND-002, KN-FIND-b7e091, KN-TECH-73630e, and the
      2026-08-31 ECDLP-IDEA-436 erratum. Two web searches were run for external
      prior art on beyond-automorphism orbit quotients in rho; one attempted
      fetch of the Bernstein-Lange-Schwabe negation-map paper FAILED with a
      transport error and the source was NOT read.
    results: >-
      The rigidity theorem for the translation action exists (df906f) and is
      reproduced here as a slice. The sqrt(|Aut|) constant exists (KN-TECH-018)
      with its own limit note that it 'does not change the exponent'. NO record
      states the block-system classification, varies the operation group, states
      the generic lower bound c_can = Omega(sqrt(r)), or measures an arithmetic
      orbit selector. IDEA-20260815-3dc025 poses the nearest question -- 'is the
      constant-factor ceiling a theorem or a habit?' -- but in the RELATION
      SUPPLY lane (index calculus over the CM coordinate), not in the collision
      search lane, and it answers it by expectation rather than by a cost law.
      The web searches surfaced the standard negation-map and automorphism-walk
      literature and the known remark that computing the equivalence-class
      representative costs something inside the iteration function, but nothing
      on quotients beyond automorphism groups; ABSENCE OF A SEARCH RESULT IS NOT
      EVIDENCE OF ABSENCE and no external source was opened.
    verdict: >-
      UNVERIFIED. (C1) and (C2) are elementary and are claimed as a reindexing,
      not as new mathematics; (C4) is a two-line consequence of a cited bound;
      (C5) is standard elliptic-curve theory applied to this question; (C6) is
      the only part with no located precedent, and no external literature was
      opened, so the honest label for the record as a whole is UNVERIFIED.

  citations:
    - ref: IDEA-20260807-df906f
      provenance: internal
