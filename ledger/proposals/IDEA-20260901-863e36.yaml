  assumptions:
    - >-
      n is prime and #E is known and factored. Load-bearing: for composite n the
      translation action has proper block systems and (C2) is FALSE, which is
      the content of the Pohlig-Hellman cell and is used here as a control.
    - >-
      Gamma is a subgroup of (Z/n)^*, i.e. every gamma is invertible mod n. The
      action is then free on G minus the identity, which is what makes orbits
      uniformly of size r. Non-invertible multipliers are excluded and the
      exclusion is recorded.
    - >-
      Multiplication by lambda costs O(log n) group operations by double-and-add
      whatever lambda's provenance. This is exact, not heuristic, and it is why
      r can be swept beyond the values Aut(E) supplies.
    - >-
      Toy scale only for every measured number: p up to about 40 bits. No number
      here is validated at cryptographic scale and the record licenses no
      extrapolation.

  proof_search_map:
    bottleneck: >-
      Not the classification, which is four lines, but c_can: the exact cost of
      certifying the minimum of x over a Gamma-orbit. Every exponent statement
      in this record is a function of that one quantity, and a measurement that
      reports a GUESS at the minimum rather than a CERTIFIED minimum measures
      nothing.
    baseline_embedding:
      parameter_slice: >-
        Sigma = the full translation group. The classification then reads
        'block systems of a regular action = coset partitions of subgroups',
        which for prime n is 'constant or injective' -- Theorem (A) of
        IDEA-20260807-df906f verbatim.
      reproduction_check: >-
        Symbolic, plus a frozen fixture: complete enumeration at n = 23 of all
        partitions preserved by every translation must return exactly two, the
        one-block partition and the discrete one; and at composite n = 33 the
        enumeration must additionally return the coset partitions of the order-3
        and order-11 subgroups. If the second half returns nothing the argument
        does not separate prime from composite and the record stops.
    observation_collision:
      observable: >-
        The pair (image size |S|, canonicalisation cost c_can) at a given r.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, which is why (C3)'s trap is named in
        the claim: two structurally different objects with the same observable
        |S| -- the Gamma-orbit partition of image size (n-1)/r, and a
        Gamma-invariant block system of image size 2 with F_gamma a nontrivial
        permutation. They agree on 'lossy and propagating' and disagree on
        'shrinks the search space'. The separating condition is F_gamma = id,
        and the code must assert it rather than infer it.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace 'does a lossy propagating object exist' by 'for which
          operation group Gamma does one exist, and at what canonicalisation
          cost'. Encoding: exact (block systems are in bijection with
          deterministically propagating projections, by C1). Completeness:
          exact. Soundness: the orbit-partition restriction is where soundness
          is spent and it is stated as C3. Cost loss: the whole question is
          moved onto c_can, which is measurable.
        predicted_gain: >-
          Converts an open-ended object hunt into one measured number per r,
          and yields the generic lower bound c_can = Omega(sqrt(r)) at zero
          compute.
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family from Gamma inside Aut(E) (where the
          canonical form is a quotient-variety coordinate) to arbitrary Gamma
          with an arithmetic selector, and ask for a STRICT inward improvement
          in net cost rather than mere well-definedness.
        predicted_gain: >-
          Either an exponent n^{(1-c)/2} at |Gamma| = n^c, or a closure of the
          quotient family with a mechanism. Predicted: the latter.
    quantifier_order: >-
      (C1): FOR ALL prime n, FOR ALL Sigma inside (Z/n)^*, FOR ALL sets S, FOR
      ALL v from G to S, [THERE EXIST F_gamma for every gamma in Sigma such that
      v([gamma]R) = F_gamma(v(R)) FOR ALL R] IF AND ONLY IF the fibre partition
      is preserved by <Sigma>. The existential on F_gamma is inside the
      hypothesis and is unrestricted -- F_gamma need not be computable.
      (C4): FOR ALL Gamma, FOR ALL generic canonicalisation procedures, c_can =
      Omega(sqrt(|Gamma|)). THE WEAKER READING NOT CLAIMED: 'for all
      canonicalisation procedures', which is false by the Gamma = {+1,-1} case
      where the x-coordinate canonicalises at zero extra cost and is not generic.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: 'for the declared curves, the declared lambda-orders r, and the
        declared strategy family, certifying the orbit-minimum selector cost
        [these numbers] against [these nulls], and no declared strategy achieved
        o(sqrt(r))'. It can NEVER certify that no arithmetic selector is cheap,
        because that is a statement about all selectors and the search is over a
        declared family; and it certifies nothing about the ECDLP itself.
      nearby_object_control: >-
        The object where the hoped-for conclusion FAILS is Gamma = {+1,-1} on
        any curve: there the canonical form IS cheap (c_can = 0 extra
        evaluations, the x-coordinate), the quotient is real, and the speedup is
        sqrt(2). A pipeline that cannot see that case as cheap has not
        identified the load-bearing structure, which is the existence of a
        quotient morphism. The composite-order group is the second nearby
        object, for (C2).
    proof_obligations:
      - claim: >-
          A projection propagates deterministically under Sigma if and only if
          its fibre partition is preserved by <Sigma>.
        responsibility: correctness
      - claim: >-
          For prime n the translation slice of C1 is exactly the df906f rigidity
          theorem, and the composite-order case is exactly its failure.
        responsibility: baseline
      - claim: >-
          Among Gamma-invariant partitions only the orbit partitions have image
          size (n-1)/|Gamma| with every F_gamma the identity.
        responsibility: strictness
      - claim: >-
          Any generic Gamma-canonicalisation has c_can = Omega(sqrt(|Gamma|)),
          conditional on KN-TECH-005 and on H1.
        responsibility: runtime
      - claim: >-
          For gamma not in the image of Aut(E), multiplication by an integer
          representative has degree > 1 and generates no finite automorphism
          group, so no quotient morphism exists.
        responsibility: feasibility
      - claim: >-
          Reported c_can values certify the orbit minimum rather than estimating
          it, and every reported number names r, p and the strategy.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The Gamma-orbit label of a point, for Gamma a subgroup of (Z/n)^* acting
      by multiplication; concretely the value of the arithmetic selector
      rho_lambda(R) = argmin over the orbit of x(.) as an integer.
    lossiness: >-
      GENUINELY LOSSY and exactly quantified: log2(r) bits discarded from
      log2(n) bits, namely which element of the orbit is held. The discarded
      part is discarded COMPATIBLY with the operations in Sigma -- the orbit
      label is by construction invariant under multiplication by every element
      of Gamma -- so the lossy-projection test of
      docs/inventor-protocol.md section 2 is PASSED, and passed non-vacuously:
      the projection is not a change of coordinates because the orbit label
      cannot be inverted to the point without r evaluations.
    propagation: >-
      Exact under Sigma by construction (C1/C3). NOT exact under the group law:
      by (C2) it cannot be, and that is consistent rather than contradictory,
      because the object's operation set is the multiplicative one. Propagation
      under the WALK STEP requires re-canonicalisation, and the cost of that is
      c_can, the measured quantity.
    survival_score: >-
      Survives arbitrarily many multiplications by Gamma (it is exactly
      invariant) and dies at the first walk step unless re-canonicalised. The
      interesting number is therefore not survival depth but the price per step,
      which is why this is filed as a cost measurement rather than a
      distinguisher hunt.

  null_object_control: >-
    NULL-1, THE MATCHED RANDOM SEQUENCE (blocking, and the primary null).
    Replace the orbit {x([lambda^i]R)} by a uniformly random sequence of r
    distinct elements of [0, p) and run the identical strategy family. If the
    certified minimum costs the same on both, the elliptic structure contributes
    nothing to canonicalisation and the family is closed by a controlled null.
    DECAY PARAMETER: r. A genuine structural advantage must GROW with r; an
    advantage flat in r is an artifact under docs/inventor-protocol.md
    section 3.
    NULL-2, THE TRIVIAL GROUP. Gamma = {1}: c_can must be exactly 0 and the
    measured search cost must reproduce the plain rho baseline within its own
    noise. A pipeline that reports a speedup at r = 1 is measuring itself.
    POSITIVE CONTROL A (blocking, in the other direction). Gamma = {+1,-1} with
    the x-coordinate as canonical form: the instrument must report c_can = 0
    extra x-evaluations and a measured speedup consistent with sqrt(2). An
    instrument that cannot see the one quotient known to work cannot be trusted
    on the ones that do not.
    POSITIVE CONTROL B (blocking). A PLANTED cheap selector: replace x by a
    function that is monotone in the orbit index i, so the minimum is at a known
    position and is certifiable in O(log r). The strategy family must find it.
    If it does not, every negative in Stage 3 is inadmissible and the cell is
    reported UNTESTED rather than closed.
    CONTROL C. Composite-order group for (C2), where a lossy exactly propagating
    translation-object MUST exist. If the enumeration finds none, the
    classification code is wrong and every result is void.

  discriminated_from:
    - >-
      IDEA-20260807-df906f. SAME MATHEMATICS AT ONE POINT, DIFFERENT INDEXING.
      That record fixes the operation set to the group law and concludes
      non-existence; this record makes the operation set a parameter and
      reproduces that conclusion as the translation slice (C2). The
      discriminating difference is that df906f's own escape E4 ('objects not
      tracked under the group law') is left explicitly open and named as
      inhabited only by rho itself; the Gamma-orbit object is the first other
      concrete inhabitant, and it comes with a cost law rather than a defect
      measurement.
    - >-
      IDEA-20260815-f558e4. That record bounds PROBABILISTIC propagation of
      statistics under the group law, via Cauchy-Davenport, Vosper and Weil.
      This record is about EXACT propagation under a different operation group
      and about a COST, not an advantage. They meet at one consistency check
      that is stated rather than hidden: both conclude that the extremal object
      is one whose evaluation presupposes the discrete-log coordinate.
    - >-
      H-PROP-c95932. That hypothesis bounds the auxiliary-state escape E2 under
      the group law and concludes |S|*|A| >= N. It says nothing about a
      different operation group, and the Gamma-orbit object carries no auxiliary
      state at all, so its bound does not apply.
    - >-
      KN-TECH-018. That entry RECORDS the sqrt(|Aut|) constant and its limit.
      This record asks why the family stops there and answers with (C4) plus
      (C5). It should cite KN-TECH-018 for the constant rather than re-derive
      it, and it does not contradict it anywhere.
    - >-
      IDEA-20260815-3dc025. Nearest question, different lane: that record asks
      whether subring access buys relation supply for index calculus; this one
      asks whether orbit access buys search-space reduction for collision
      search. Neither implies the other, and this record's (C4) supplies the
      quantitative statement of the form 'access to Gamma buys at most X' that
      3dc025 says does not exist in this repository -- for the collision-search
      lane only.
    - >-
      KN-FIND-002 and KN-FIND-b7e091 (AUTHORITATIVE BUT CONTESTED; three defects
      recorded 2026-08-31 and routed to an unopened review-breakthrough round).
      This record does NOT depend on either, and the dependence question is
      answered explicitly rather than by convenience: (C4) uses the Shoup bound
      (KN-TECH-005) and not simulability, and (C5) derives 'an endomorphism acts
      on the rational subgroup as a computable scalar' from the Frobenius
      eigenvalue on the order-n eigenspace -- the CORRECTED derivation given in
      section D.1 of the 2026-08-31 erratum -- and NOT from b7e091's premise
      End_{F_p}(E) = Z, which is false for every elliptic curve over a finite
      field. If the pending review re-tiers either finding, nothing in this
      record moves.

  predictions:
    - metric: >-
        M1 -- c_can(r), the certified-minimum cost in x-evaluations for
        rho_lambda over a Gamma-orbit of size r, for r in a declared ladder
        spanning at least a 16x range, on at least three field sizes
      direction: higher
      minimum_effect: >-
        PRE-REGISTERED TWO-BRANCH RULE. A fitted exponent alpha in
        c_can ~ r^alpha with alpha >= 0.9 across the ladder records the CLOSURE
        branch: canonicalisation is linear in the orbit and the net speedup
        sqrt(r)/r is below 1. A fitted alpha <= 0.6, reproduced on all three
        field sizes AND absent from NULL-1, records the LEAD branch and triggers
        mandatory independent review before any interpretation. Anything
        strictly between is declared INCONCLUSIVE in advance. BASIS: these are
        pre-registered tolerances chosen from the two theoretical anchors
        alpha = 1 (enumeration) and alpha = 0.5 (the generic floor of C4); they
        are UNTESTED EXPECTATIONS and not measurements.
    - metric: >-
        M2 -- the paired difference c_can(elliptic orbit) minus c_can(NULL-1
        random sequence) at matched r, with a bootstrap interval
      direction: different
      minimum_effect: >-
        Claimed non-zero only if it exceeds the null spread at the same r AND
        GROWS with r AND persists across all three field sizes. A gap flat in r
        is recorded as an artifact and never as structure.
    - metric: >-
        M3 -- measured end-to-end group operations of the quotient walk at
        Gamma = {+1,-1} against the plain rho baseline on the same curve
      direction: lower
      minimum_effect: >-
        A ratio consistent with sqrt(2) within the run-to-run spread. This is a
        KNOWN-ANSWER CALIBRATION, not a finding; a ratio inconsistent with
        sqrt(2) means the walk or the fruitless-cycle handling is wrong and
        every other number in the run set is void.
    - metric: >-
        M4 -- number of translation-preserved partitions found by complete
        enumeration at prime n = 23 and at composite n = 33
      direction: different
      minimum_effect: >-
        EXACTLY 2 at n = 23 (the one-block and discrete partitions) and
        STRICTLY MORE THAN 2 at n = 33. This is a decision, not an estimate: the
        enumeration is complete. Failure of either half stops the record.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): write (C1), and run the n = 23 versus
      n = 33 complete enumeration of translation-preserved partitions (M4).
      Minutes in pure Python; the record stops if it fails.
      STAGE 1 (hours): build toy curves at 20, 28 and 36 field bits with prime
      subgroup order n, and for each choose lambda of multiplicative order r in
      a declared ladder r in {2, 4, 8, 16, 32, 64, 128} where n-1 permits, plus
      the j = 0 and j = 1728 curves for the morphism-induced controls. Verify
      lambda^r = 1 mod n and lambda^{r/q} != 1 for each prime q | r before use.
      STAGE 2 (HARD GATE, minutes): POSITIVE CONTROL A (Gamma = {+1,-1},
      c_can = 0) and POSITIVE CONTROL B (planted monotone selector, recovered in
      O(log r)) must both pass. NULL-2 (Gamma trivial) must return c_can = 0 and
      the plain rho cost.
      STAGE 3 (hours): measure M1 and M2 over the r-ladder with the declared
      strategy family, on the elliptic orbits and on NULL-1, at all three field
      sizes.
      STAGE 4 (only if the LEAD branch fires): the decay checks of Stage 5 in
      the mechanism, then stop and route to independent review. NO ATTACK IS
      RUN under this record and no scalar is recovered beyond the toy
      calibration in M3.
    controls:
      - NULL-1 matched random cyclic sequence at every r (blocking)
      - NULL-2 trivial Gamma, c_can = 0 and baseline rho cost (blocking)
      - POSITIVE CONTROL A, Gamma = {+1,-1} via the x-line, c_can = 0 (blocking)
      - POSITIVE CONTROL B, planted monotone selector recovered in O(log r) (blocking)
      - CONTROL C, composite-order enumeration where C2 must fail (blocking)
      - lambda order verification before every cell (blocking instrument check)
      - exclusion of anomalous #E = p and of smooth n at toy scale per KN-TECH-034
    required_metrics:
      - c_can per (curve, r, strategy), as CERTIFIED x-evaluations, with bootstrap CI
      - fitted exponent alpha in c_can ~ r^alpha per field size, with fit residuals
      - paired elliptic-minus-null difference per r
      - end-to-end quotient-walk group operations versus plain rho at Gamma = {+1,-1}
      - complete-enumeration partition counts at n = 23 and n = 33
      - pass or fail of every gate control
      - wall-clock per stage and peak memory

  falsification_conditions:
    - >-
      F1. A projection exhibited that propagates deterministically under Sigma
      and whose fibre partition is NOT preserved by <Sigma>. (C1) is false and
      the record is superseded rather than amended.
    - >-
      F2. The n = 33 enumeration returns only the two trivial partitions. The
      classification code cannot see the case where the conclusion must fail and
      every result from it is void.
    - >-
      F3. A declared arithmetic selector achieving c_can = o(sqrt(r)) on
      elliptic orbits, reproduced across field sizes and absent from NULL-1.
      (C5)'s practical reading is false; this is the LEAD branch and it is
      exponent-relevant. It is NOT a contradiction of (C4), which is scoped to
      generic canonicalisation, and any report must say so.
    - >-
      F4. POSITIVE CONTROL A returns c_can > 0, or M3 is inconsistent with
      sqrt(2). Instrument broken; nothing is reported.
    - >-
      F5. NULL-1 matches the elliptic c_can at every r. The predicted closure is
      CONFIRMED, the quotient family is closed for the declared selectors with a
      mechanism, and the honest headline is a controlled null plus a cost law.
    - >-
      F6. A measured advantage that is flat in r. Artifact, recorded as a
      controlled null under docs/inventor-protocol.md section 3.
    - >-
      F7. Budget exhaustion before the r-ladder resolves. INFRASTRUCTURE outcome
      under AGENTS.md rule 5, recorded as such, never as evidence about c_can.

  confounders:
    - >-
      Fruitless cycles. Walks on a quotient by an automorphism revisit points
      and stall; the negation-map literature treats this and the effect is a
      constant factor that can swamp a sqrt(2) gain if mishandled. M3 exists to
      catch it, and a failed M3 is an instrument failure and not a result about
      quotients.
    - >-
      Toy-scale orbit-to-group ratio. At 20 bits an orbit of size 128 is a much
      larger fraction of G than any cryptographic analogue, biasing the
      measurement TOWARD apparent structure. Disclosed; the field-bit ladder is
      the only available defence and it is a weak one.
    - >-
      lambda chosen with hidden structure. A lambda that is a small power of 2
      makes the orbit x-values related by cheap doublings and could produce a
      selector shortcut that is about the chosen lambda and not about elliptic
      curves. The ladder must include lambda drawn uniformly from the elements
      of order r, and the small-power-of-2 case must be reported SEPARATELY.
    - >-
      Certified versus guessed minimum. A strategy that returns the true minimum
      without certifying it has not solved the canonicalisation problem, because
      a walk that occasionally mis-canonicalises produces false collisions. The
      metric is defined as certification cost for exactly this reason.
    - >-
      Accidental smoothness of n and the anomalous case at toy scale, excluded
      per KN-TECH-034 before a curve enters the run set.

  interpretation_limits:
    - >-
      (C4) is conditional on KN-TECH-005, whose own applicability note is
      carried here: the bound is a barrier and NOT a proof that no non-generic
      attack exists. That is not a weakness of the argument but its content:
      (C4) is used precisely to FORCE any surviving candidate to be
      non-generic, and the open cell (C6) lives in that model's blind spot.
    - >-
      (C5) is a statement about the canonical forms this record could locate. It
      is NOT a proof that no non-morphism canonical form is cheap; that is what
      the measurement probes, over a declared and therefore incomplete strategy
      family.
    - >-
      Nothing here is an attack, an exponent claim, or a status change. The
      exponent in target_complexity is CONDITIONAL on an object nobody has
      exhibited and whose generic version (C4) forbids.
    - >-
      Every measured number is toy tier and scoped to the tested curves, orders
      r, field sizes, strategies and budget. No transfer to cryptographic n is
      claimed and none is licensed.
    - >-
      The record takes no position on the three defects recorded against
      KN-FIND-002 and KN-FIND-b7e091 and does not depend on their resolution;
      see discriminated_from.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a subgroup Gamma of (Z/n)^* of order r and a walk on the Gamma-orbit
        quotient of G whose step function is the standard r-adding walk composed
        with the orbit canonicalisation, the expected number of steps to a
        useful collision is (1 + o(1)) * sqrt(pi/2) * sqrt((n-1)/r), i.e. the
        birthday law for a random function on a set of size (n-1)/r, uniformly
        for r <= n^{1/2}.
      rigorous_support: >-
        The rigorous ingredient is the exact orbit count: for prime n and Gamma
        inside (Z/n)^*, the action on G minus the identity is free, so the
        quotient has exactly (n-1)/r elements -- no heuristic is needed for the
        SIZE. The distributional half imitates the classical Pollard-rho
        analysis and the automorphism-walk analysis already charged in
        KN-TECH-006 and KN-TECH-018, which make the same random-function
        assumption for Gamma = Aut(E); H1 asserts only that the assumption does
        not degrade as r grows beyond |Aut|.
      validation_plan: >-
        SAMPLE: complete quotient walks to collision, 200 independent seeds per
        cell, over r in {2, 4, 8, 16, 32, 64, 128} at 20 and 28 field bits,
        where the whole group is enumerable so the true collision index is
        known exactly and no extrapolation is needed. SHORTCUT MAKING SAMPLING
        FEASIBLE: none required at these sizes; the group is enumerable, which
        is precisely why the ladder stops at 28 bits for this assumption and
        the 36-bit cells report c_can only. COMPARISON DISTRIBUTION: the
        empirical step-count distribution against the Rayleigh-type birthday
        law for a random function on (n-1)/r points, compared by
        Kolmogorov-Smirnov. TAIL CHECK: the 99th percentile of observed step
        counts against the predicted tail, and the count of fruitless cycles per
        run reported separately so that a heavy tail is attributed to cycles
        rather than to the law. TRANSFER ASSUMPTION, STATED: H1 is validated
        only for r <= 128 and n <= 2^28; its use in the CONDITIONAL exponent of
        target_complexity at r = n^{1/3} is an EXTRAPOLATION and is labelled as
        one wherever that exponent appears.
    - id: H2
      statement: >-
        For lambda drawn uniformly from the elements of order r in (Z/n)^*, the
        sequence x([lambda^i]R), i = 0..r-1, behaves with respect to the
        order statistics of its integer values like a uniformly random sequence
        of r distinct elements of [0, p); in particular the position of the
        minimum is uniform and no prefix of the x-bits predicts it better than
        chance.
      rigorous_support: >-
        The rigorous ingredient is the square-root cancellation in character
        sums over the points of an elliptic curve (the Kohel-Shparlinski /
        Lange-Winterhof lineage as invoked internally by IDEA-20260815-f558e4
        sub-result (E)), which caps any single-character bias at O(n^{-1/2}) and
        therefore bounds any fixed low-degree predictor of the minimum's
        position. It does NOT bound an adaptive multi-round strategy, which is
        exactly the gap the measurement probes; H2 is refutable on its own terms
        and its refutation is the LEAD branch F3.
      validation_plan: >-
        SAMPLE: for each (curve, r) cell, 10^4 random R, recording the position
        of the orbit minimum and the number of x-evaluations each declared
        strategy needed to certify it. COMPARISON DISTRIBUTION: the uniform
        distribution on {0..r-1} for the position (chi-squared), and the
        NULL-1 empirical certification-cost distribution for the cost. TAIL
        CHECK: the smallest certification cost observed over all 10^4 draws
        versus the smallest observed over an equal number of NULL-1 replicates
        -- a real effect must appear as a shift of the whole distribution, not
        as a single lucky orbit. SAMPLED PARAMETERS RECORDED: p, n, lambda, r,
        seed, per cell.

  target_complexity:
    time_exponent: >-
      CONDITIONAL AND CURRENTLY UNINHABITED. If an arithmetic selector existed
      with |Gamma| = n^c and c_can = (log n)^{O(1)}, the quotient walk would run
      in n^{(1-c)/2 + o(1)} group operations; at c = 1/3 that is n^{1/3+o(1)}.
      UNCONDITIONALLY CLAIMED BY THIS RECORD: nothing below n^{1/2}. (C4) proves
      that no GENERIC canonicalisation reaches any c > 0, and the predicted
      measurement outcome is c_can = Theta(r), which yields a net speedup of
      sqrt(r)/r < 1, i.e. a SLOWDOWN, for every r > 1 outside Aut(E).
    memory_exponent: >-
      O(1) group elements per processor, exactly as for rho -- the quotient walk
      stores a walk state and distinguished points, not a table. This is the one
      structurally attractive feature of the conditional branch and it is worth
      stating: unlike the exemplar's claw at memory p^{1/3}, and unlike the
      generic preprocessing frontier at S*T^2 = n which must buy its n^{1/3}
      online time with n^{1/3} advice, this family would reach n^{(1-c)/2} at
      polynomial memory. The measurement's expected outcome is that it does not
      reach it at all.
    best_known: >-
      Parallel Pollard rho with distinguished points and the negation map at
      about 0.886*sqrt(n) group operations serial, about sqrt(n)/m wall clock on
      m processors, small per-processor memory (KN-TECH-006); automorphism
      discount at most sqrt(6) on CM curves (KN-TECH-018); BSGS at 2*sqrt(n)
      time and sqrt(n) memory; Pohlig-Hellman fixing n as the largest prime
      factor (KN-TECH-030).
    hidden_overhead: >-
      The conditional exponent hides (i) the o(1) absorbing the
      canonicalisation polylog, (ii) fruitless-cycle handling, which is a
      constant factor in the Gamma = {+1,-1} case and is UNQUANTIFIED for larger
      r -- nobody has run such a walk -- and (iii) the cost of exhibiting Gamma
      itself, which for lambda of prescribed large order requires n-1 to have a
      suitable divisor and is an instance-dependent precondition, not a free
      parameter. All three are disclosed rather than absorbed.
    tradeoff_note: >-
      The van Oorschot-Wiener interpolation applies unchanged to the quotient
      walk: with w memory and m processors, time sqrt(((n/r)^3)/w)/m in the
      corresponding regime. The family therefore does not compete on the memory
      axis with BSGS or with preprocessing; its only possible claim is on the
      time axis at polynomial memory, which is why c_can is the whole question.

  dominated_by: >-
    AS AN ATTACK: mounts none, and is dominated on every axis by every row of the
    prime-field frontier, checked row by row. (1) Parallel rho with
    distinguished points and negation, 0.886*sqrt(n) operations, O(1) memory per
    processor, linear parallel speedup (KN-TECH-006): dominates on time and
    ties on memory. (2) Automorphism-discounted rho on CM curves, up to sqrt(6)
    better (KN-TECH-018): dominates, and is in fact the Gamma inside Aut(E)
    special case of this record's own family, so it is not a competitor but the
    known inhabitant. (3) BSGS, 2*sqrt(n) time and sqrt(n) memory: dominates on
    time, dominated on memory. (4) Pohlig-Hellman (KN-TECH-030): not comparable,
    it fixes which n is at issue. (5) Generic preprocessing at S*T^2 = n
    (advice-based n^{1/3} online time at n^{1/3} advice): dominates on online
    time, dominated on memory and on advice; and it is generic, so (C4) applies
    to it too. Data and query axis: this record issues no oracle queries and
    produces no solve, so it does not dominate there either. AS A STRUCTURAL
    CONTRIBUTION the nearest incumbent is IDEA-20260807-df906f, which dominates
    on generality of its single theorem and is dominated here on the range of
    operation groups covered.
  sota_delta: >-
    +0 on time, +0 on memory, +0 on data/queries, +0 on the constant factor, in
    the predicted outcome. Quantified deltas actually claimed: (i) a
    classification that indexes the object question by operation group and
    reproduces the program's central structural theorem as one slice, at zero
    compute; (ii) a lower bound c_can = Omega(sqrt(|Gamma|)) for every generic
    canonicalisation, which converts the recorded sqrt(|Aut|) CONSTANT into a
    stated consequence rather than an observation; (iii) one measured cost
    exponent alpha per field size over an r-ladder spanning 16x, with a matched
    null and two blocking positive controls, at an estimated few CPU-hours. If
    the LEAD branch fired at c = 1/3 the delta would be n^{1/2} to n^{1/3} at
    unchanged O(1) memory; the honest prior on that is low and is stated below.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.95 that (C1) and (C2) are correct as stated; the residual is that
    'propagates' has been formalised so as to quietly exclude something a reader
    wants included, which is the same residual df906f records for itself.
    0.9 that (C4) survives review, the residual being the exact status of H1
    inside the reduction. 0.75 that (C5)'s morphism argument is stated at the
    right level of generality for CM curves. OUTCOME split on the measurement:
    0.88 closure branch (alpha near 1, controlled null), 0.04 lead branch
    (alpha <= 0.6 surviving NULL-1 and the field-bit ladder), 0.08 inconclusive
    on strategy-family weakness or budget. The most likely honest headline is
    'the automorphism ceiling on quotient search is a theorem in the generic
    model and a measured cost law outside it, and the arithmetic selector does
    not beat a random sequence'.

