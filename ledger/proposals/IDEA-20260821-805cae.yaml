idea:
  id: IDEA-20260821-805cae
  question_id: RQ-GGMB-6eaabc
  research_question: RQ-GGMB-6eaabc
  added: '2026-08-21'
  title: >-
    THE CURVE-MEASURABLE CLOSURE IS STATED ON ARGUMENTS AND SAYS NOTHING ABOUT
    RANGE: coordinate-selected OUTPUT oracles CSEL(pi), which take no group handle
    and RETURN one chosen by a coordinate predicate, are an undecided cell of
    completion criterion C3, and their simulability reduces exactly to a
    statistical question about log_P(rho(E)) that is measurable to exhaustion at
    toy scale
  class: control

  claim: >-
    FOUR CLAIMS. C3 IS THE ONLY ONE THAT COSTS COMPUTE.

    (D1) THE GAP IN THE CAMPAIGN'S OWN ORACLE CATALOGUE, STATED FROM THE RECORD.
    IDEA-20260807-413fcc defines a CURVE-MEASURABLE oracle by its ARGUMENTS --
    "its signature takes NO group handle as an argument" -- and closes that class
    at exponent 1/2 on the ground that its answers cannot depend on any linear
    form the adversary holds. The criterion is silent about the oracle's RANGE.
    Define, for a predicate pi on curve coordinates,
        CSEL(pi) : (p, a, b, N) |--> a handle for the point of G = <P> selected
        by pi
    -- for instance "the point of G of least x-coordinate", "the point of G of
    least x among those with even y", "the point of G whose x is least in a
    declared window". CSEL takes no group handle and is therefore CURVE-MEASURABLE
    BY THAT RECORD'S OWN DECISION RULE, yet the record's closure argument does not
    apply to it, because CSEL's answer IS a group element and the simulator must
    produce one. GOAL-ENDO-001 completion criterion C3 requires every oracle class
    invented by any lane to be adjudicated as simulable or non-simulable with an
    explicit argument; this cell is undecided, and it is exactly the cell in which
    the labelling rho of IDEA-20260821-3d5f22 lives, and the cell any future
    "canonical point" proposal will land in.

    (D2) THE ADJUDICATION REDUCES TO ONE SCALAR. The standard generic-group
    simulator keeps, per handle, a formal linear form lambda = (alpha, beta) in
    (Z/N)^2 over the symbols P and Q, and answers group operations and equality
    tests by formal manipulation. CSEL(pi)'s output is the point [c]P where
    c := log_P(rho_pi(E)) in (Z/N)^*, a value fixed by the curve's coordinates and
    by nothing the adversary has written down. The simulator's only move is to
    answer with a fresh handle carrying a fresh symbol; it is caught exactly when
    the adversary can predict, or exploit, something about c. CLAIM: CSEL(pi) is
    simulable -- hence closed at exponent 1/2 and admissible under C3 -- if and
    only if c is computationally indistinguishable from a uniform draw on
    (Z/N)^*, jointly with the public data (p, a, b, N, P, Q). This converts a
    modelling question, which the campaign has been answering by assertion, into a
    STATISTICAL question with a measurable answer and a reportable minimum
    detectable effect.

    (D3) THE MEASUREMENT, AND IT IS EXHAUSTIVE RATHER THAN SAMPLED AT TOY SCALE.
    Over many toy instances with prime or near-prime group order, compute c
    exactly by enumeration and test: (i) uniformity of c on (Z/N)^*; (ii)
    uniformity of c CONDITIONED on each cheap curve label (fundamental
    discriminant D_0, ell=2 volcano level, two_torsion_x_count, j = 0 or 1728, the
    least-x value itself); (iii) uniformity of c along one isogeny class with P
    transported by an explicit isogeny of degree coprime to N.

    (D4) BOTH OUTCOMES ARE DELIVERABLES, AND THE RECORD SAYS IN ADVANCE WHAT EACH
    MEANS. If c is uniform and label-independent to within a stated MDE, CSEL(pi)
    joins the closed cell for the tested predicates, C3 gains a decided entry with
    a measured obstruction attached, and an entire family of "publicly computable
    canonical point" proposals is closed at this scope with a number rather than a
    verdict. If c is NOT uniform, the campaign holds a publicly computable
    statistic of secret-free curve data that correlates with a group-theoretic
    quantity, the oracle class is non-simulable, and GOAL-ENDO-001's P3 pause
    applies before any record states the excess. THE RECORD PREDICTS THE FIRST
    OUTCOME ON THE MARGINAL AND EXPLICITLY DOES NOT PREDICT IT ON THE j = 0 ARM,
    WHERE NON-UNIFORMITY IS FORCED BY THE AUTOMORPHISM AND IS THE INSTRUMENT'S
    POSITIVE CONTROL.

  mechanism: >-
    The generic group model has no coordinates, which is exactly why every
    non-generic ECDLP method must leave it and why the campaign's oracle catalogue
    exists at all. An oracle that consumes coordinates only in its arguments can be
    closed by observing that its answer is a constant relative to the handles --
    that is IDEA-20260807-413fcc's argument. An oracle that PRODUCES a group
    element selected by coordinates cannot be closed that way, because producing an
    element is precisely what the simulator's formal-linear-form bookkeeping is
    built to control. The natural repair is to let the simulator answer with a
    fresh symbol, which succeeds if and only if the real oracle's hidden scalar
    behaves like a fresh random symbol. So the whole modelling question collapses
    onto the law of one scalar, and that scalar is exhaustively computable at toy
    scale. Nothing about this mechanism is an attack: the adversary that gets
    rho(E) still has to solve a discrete logarithm to use it, and the record says
    so up front.

  novelty_status: unverified

  citations:
    - ref: IDEA-20260807-413fcc
      provenance: internal
      claim: >-
        Defines the class of CURVE-MEASURABLE oracles by the decision rule "its
        signature takes NO group handle as an argument", so membership is decidable
        by inspection, and closes that class.
      verified_by: >-
        Read only as the one-line claim carried in the session prior-art digest;
        the primary proposal was NOT opened. The exact wording of its closure
        argument is load-bearing for D1 and MUST be re-read from the primary
        record before this proposal is dispatched. If that record already covers
        the range side, D1 collapses and this proposal should be withdrawn -- that
        is stated here rather than discovered by a reviewer.
    - ref: KN-FIND-b7e091
      provenance: internal
      claim: >-
        Binding generic-group closure of the incidence and endomorphism-image
        oracle classes at exponent 1/2; treated as binding and extended, not
        revisited, by RQ-GGMB-6eaabc per GOAL-ENDO-001's opening note.
      verified_by: >-
        Read only as quoted in ledger/goals/GOAL-ENDO-001/goal.yaml; the knowledge
        record itself was not opened.
    - ref: IDEA-20260807-070d03
      provenance: internal
      claim: >-
        Introduces FBMEM_S(h), returning the bit [x(h) in S], and observes its
        answer is NOT a function of the linear form lambda(h) -- an oracle that
        consumes coordinates on the INPUT side.
      verified_by: >-
        Read only as the one-line digest claim; primary not opened.
    - ref: IDEA-20260807-5ddd98
      provenance: internal
      claim: >-
        GOAL-ENDO-001 criterion C4 requires every instrument supporting a
        conclusion to pass both directions of the RQ-INSTR-f8faa0 control, and the
        L12 adjudication needs a control catalogue.
      verified_by: >-
        Read only as the one-line digest claim; primary not opened.
    - ref: "Shoup, 'Lower bounds for discrete logarithms and related problems' (EUROCRYPT 1997); Maurer's generic group model"
      provenance: recalled
      claim: >-
        RECALLED, NOT CHECKED: the sqrt(N) generic lower bound and the
        formal-linear-form simulator whose structure D2 relies on. Named so a
        reviewer with retrieval can confirm the exact simulator formulation --
        Shoup's random-encoding version and Maurer's abstract version differ in
        ways that matter for an oracle whose output is a group element, and this
        record does not assert which is the right one.
      verified_by: null
    - ref: "Dent, 'Adapting the weaknesses of the random oracle model to the generic group model' (ASIACRYPT 2002)"
      provenance: recalled
      claim: >-
        RECALLED, NOT CHECKED: known limitations of generic-group arguments,
        pointed at because a simulability verdict obtained here inherits every one
        of them and the record must not be read as stronger than the model allows.
      verified_by: null

  novelty_screen:
    method: >-
      Filesystem screening; the crypto-kb retrieval server is bound to ':memory:'
      and returns nothing. Read: the session prior-art digest covering all 11 filed
      RQ-GGMB-6eaabc proposals and all 18 RQ-INSTR-f8faa0 proposals;
      ledger/goals/GOAL-ENDO-001/goal.yaml including the binding note on
      KN-FIND-b7e091. No web source was opened for this record.
    results: >-
      NEAREST FILED WORK, NAMED. (1) IDEA-20260807-413fcc defines and closes the
      curve-measurable class ON ARGUMENTS; this record identifies the range side as
      undecided and is a direct extension of it rather than a competitor. (2)
      IDEA-20260807-070d03's FBMEM_S(h) is the input-side coordinate oracle -- the
      mirror image of CSEL and explicitly not the same object. (3)
      IDEA-20260807-d73e83's TRANSPORT(phi, h) takes a handle and returns a handle
      on ANOTHER curve; it is a range-side oracle but its output is the image of a
      supplied handle, so it IS a formal linear form and the standard simulator
      handles it -- CSEL's output is not. (4) IDEA-20260807-fd2d89's CHT(h) returns
      a height, a number, not a group element. (5) IDEA-20260807-63056d proposes
      the C3 adjudication catalogue and IDEA-20260811-b2806a invents three oracles
      and routes them through RQ-GGMB; whether either covers a coordinate-selected
      OUTPUT is unknown to this session and is the single most important thing a
      reviewer must check. (6) IDEA-20260807-7270d1 attacks the binary
      simulable/non-simulable verdict itself and argues for a graded answer; this
      record's MDE-based verdict is compatible with that criticism and adopts it in
      spirit by reporting an effect size rather than a bit.
    verdict: >-
      UNVERIFIED. The distinction between argument-side and range-side coordinate
      dependence appears in no digest entry, and neither does the reduction of
      simulability to the law of log_P(rho(E)). But the digest is one line per
      proposal and cannot rule out that IDEA-20260811-b2806a or
      IDEA-20260807-63056d already covers this cell; that risk is stated here as a
      withdrawal condition rather than hedged.

  object_first_candidate:
    tracked_object: >-
      c = log_P(rho_pi(E)) -- the hidden scalar relating the coordinate-selected
      point to the instance generator -- tracked across instances and across one
      isogeny class. Established families declared off-limits as the primary lens:
      incidence oracles, endomorphism-image oracles, transport oracles, pairing
      oracles and height oracles, all of which the corpus has already adjudicated
      or attempted. The object here is the simulator's own bookkeeping gap, not a
      curve quantity.
    lossiness: >-
      PASSES THE TEST. The projection (curve, its whole point set, its coordinate
      geometry) |-> c discards everything except one residue mod N. It is not a
      change of coordinates: the fibre over a fixed c contains curves with
      completely different coordinate geometry, different D_0 and different group
      structure, so the forgotten data is unrecoverable. The discard is compatible
      with the operation the model performs, because the simulator's operation is
      formal linear algebra over (Z/N) and c is exactly the coefficient the
      simulator would need and does not have -- so the retained part propagates
      deterministically through every group operation the adversary performs on the
      returned handle.
    propagation: >-
      One-step propagation is defined and measurable: for any adversary word
      w = alpha*P + beta*Q + gamma*rho(E), the true logarithm is
      alpha + beta*k + gamma*c, so c enters every subsequent handle linearly and
      the simulator's error is detectable exactly when a formal collision differs
      from a real one. That is the measurable event, and its rate is the
      distinguishing advantage.
    survival_score: >-
      Survives while G is cyclic of prime order and rho_pi is well defined and
      poly-time (small cofactor). It dissolves for non-cyclic groups, where "the
      point of G" needs a subgroup choice -- which is precisely the degeneracy
      IDEA-20260821-ad7c97 shows infects 66 of 138 curves in the campaign's own
      toy class, so the two records constrain each other and the instance sampler
      here must exclude non-cyclic groups or handle them explicitly.

  proof_search_map:
    bottleneck: >-
      The step in IDEA-20260807-413fcc's closure that infers "the oracle's answer
      is independent of every handle" from "the oracle takes no handle as an
      argument". That inference is valid for oracles returning field elements or
      bits and invalid for oracles returning group elements. Removing it decides
      an open cell of GOAL-ENDO-001 C3.
    baseline_embedding:
      parameter_slice: >-
        Predicates pi whose selected point IS a formal linear form in the
        adversary's symbols -- e.g. pi = "return P" (c = 1) or pi = "return Q"
        (c = k). On that slice CSEL collapses into the already-closed class and the
        simulator is the identity.
      reproduction_check: >-
        Run the identical uniformity battery on the pi = "return P" slice. It must
        REJECT uniformity with overwhelming margin (c is constant 1), which
        simultaneously reproduces the old boundary and serves as the instrument's
        positive control. A frozen fixture archives the c-vector for this slice.
    observation_collision:
      observable: >-
        The marginal distribution of c over sampled instances.
    distinct_preimage_search: >-
      A COLLISION IS FOUND AND IT CHANGES THE DESIGN. Two distinct predicates can
      share the marginal law of c while differing in their conditional structure --
      "least x" and "least x among points with even y" both plausibly give uniform
      marginals, yet the second is a strictly finer function of the coordinate
      geometry and could correlate with a label the first does not. The marginal
      test therefore CANNOT adjudicate the class, and the conditional-on-labels arm
      is not an optional refinement but a requirement; omitting it would be the
      identifiability failure. A second collision on the other side: two curves with
      the same c and different D_0, which shows c alone cannot serve as a label --
      relevant because a positive outcome would otherwise be over-read.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Recast "CSEL is simulable" as the exact statistical condition
          "statistical distance of c from uniform on (Z/N)^*, jointly with the
          public data, is below eps". Obligations: encoding (c is well defined
          given a cyclic G), completeness (every predicate maps to a c-law),
          soundness (indistinguishability of c really does yield a simulator),
          transfer (toy N to cryptographic N -- NOT discharged here and stated as
          the open gap), cost-loss (none within the model).
        predicted_gain: >-
          Replaces a modelling assertion with a measurement carrying an MDE, which
          is what C3 needs to be dischargeable rather than merely declarable.
      - transform: stronger_invariant
        proposed_object: >-
          Adjudicate the JOINT law of (c, labels) rather than c's marginal,
          preserving more state than the final verdict requires.
        predicted_gain: >-
          Defeats the marginal collision above; without it the verdict is not
          identified.
    quantifier_order: >-
      WRITTEN OUT WITH ITS WITNESS DEPENDENCE. "FORALL predicates pi computable in
      poly(log p), FORALL adversaries A making at most q queries, THERE EXISTS a
      simulator S with |Pr[A^{CSEL(pi)} = 1] - Pr[A^{S} = 1]| <= eps(q)." The
      simulator is allowed to depend on pi. A UNIFORM-IN-pi simulator would be a
      strictly stronger statement and this proposal does NOT attempt it, because a
      single simulator serving every coordinate predicate would have to anticipate
      every coordinate geometry. Also note the experiment tests finitely many pi,
      so its outcome instantiates the inner quantifiers only, never the outer
      FORALL pi -- and any record reading it as class-wide is over-reading.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At the tested toy N, for these finitely many predicates and this feature
        set, c is (or is not) distinguishable from uniform at effect sizes above
        the reported MDE." It can never certify simulability for all predicates,
        never certify anything at cryptographic N, and never move the sqrt(N)
        generic bound, which is the incumbent and is not in question.
      nearby_object_control: >-
        A PREDICATE WHERE NON-UNIFORMITY IS FORCED BY MATHEMATICS, NOT BY
        MEASUREMENT: on a curve with j = 0 and p = 1 mod 3, Aut(E) contains an
        automorphism acting on G as a scalar of order 3 (H-ENDO-001), so a
        predicate defined to be Aut-equivariant selects a point whose logarithm is
        confined to a coset of the order-3 subgroup of (Z/N)^* and c is PROVABLY
        non-uniform. The battery MUST reject there. If it does not, the method has
        no power and no negative may be recorded from it. Second nearby object:
        c = 1 constant (the pi = "return P" slice), which must be rejected with
        overwhelming margin.
    proof_obligations:
      - claim: "CSEL takes no group handle as an argument, hence is curve-measurable by IDEA-20260807-413fcc's rule"
        responsibility: interface
      - claim: "the standard simulator cannot express CSEL's output as a formal linear form in P and Q"
        responsibility: correctness
      - claim: "simulability holds iff c is indistinguishable from uniform jointly with public data"
        responsibility: strictness
      - claim: "c is exhaustively computable at toy N by enumeration"
        responsibility: feasibility
      - claim: "the battery rejects on the j=0 equivariant predicate and on c=1"
        responsibility: baseline
      - claim: "the reported MDE bounds what the negative excludes"
        responsibility: success_probability
      - claim: "no exponent moves; the sqrt(N) generic bound is untouched"
        responsibility: runtime
      - claim: "toy tier, finitely many predicates, one feature set, no transfer to cryptographic N"
        responsibility: scope
    not_applicable_reason: null

  assumptions:
    - >-
      G is cyclic of prime order N in the primary arm, so "the point of G selected
      by pi" is unambiguous. Instances with non-cyclic E(F_p) are EXCLUDED from the
      primary arm and run only in a declared secondary arm, because
      IDEA-20260821-ad7c97 shows the subgroup ambiguity is not hypothetical in this
      campaign's own toy classes.
    - >-
      The cofactor #E/N is small enough that landing in G costs poly(log p). Where
      it is not, rho_pi is not poly-time and CSEL is not the oracle being
      adjudicated.
    - >-
      P is sampled INDEPENDENTLY of pi. If P is itself chosen by a coordinate rule
      -- e.g. "the first liftable x", which is what this campaign's own samplers
      historically did (CORR-20260807-a05e1e, CORR-20260807-9f83be) -- then c is
      structured for reasons that have nothing to do with CSEL and the battery
      measures the sampler. The sampler for P must be pre-registered and its
      independence from pi argued in the contract.

  predictions:
    - metric: >-
        marginal_uniformity_pvalue: chi-square goodness of fit of c against uniform
        on (Z/N)^*, primary arm, generic-j curves with prime group order
      direction: different
      minimum_effect: >-
        NOT distinguishable, i.e. p > 0.05, is the predicted outcome. The run must
        report the MDE in total-variation distance detectable at 80% power at the
        realised sample size, and must refuse to interpret any effect below it.
    - metric: >-
        conditional_mutual_information between c and each cheap label (D_0,
        two_torsion_x_count, volcano level, j in {0, 1728}, least-x value)
      direction: higher
      minimum_effect: >-
        Predicted at or below the null's 99th percentile. A label exceeding it by
        >= 0.01 bits, replicated at a second prime, falsifies D2's simulability
        conclusion for that predicate.
    - metric: >-
        j0_equivariant_rejection: battery verdict on the Aut-equivariant predicate
        at j = 0, p = 1 mod 3, where c is provably confined to a coset of the
        order-3 subgroup
      direction: different
      minimum_effect: >-
        Rejection at p < 1e-6. A failure to reject voids the instrument and
        forbids recording any negative (GOAL-ENDO-001 P1, C4).
    - metric: >-
        constant_predicate_rejection: battery verdict on pi = "return P" (c = 1)
      direction: different
      minimum_effect: >-
        Rejection at overwhelming margin; this is the baseline-embedding
        reproduction check and the second positive control.
    - metric: >-
        random_generator_null_acceptance: battery verdict when rho is replaced by a
        uniformly random generator of G
      direction: different
      minimum_effect: >-
        Acceptance at the nominal rate (5% rejections at alpha = 0.05, inside an
        exact binomial interval). Over-rejection means the battery has a false
        positive rate and no positive may be read from it.
    - metric: >-
        decay_check: rejection rate of the battery as the instance count grows over
        {200, 500, 1000, 2000, 5000} on the random-generator null
      direction: lower
      minimum_effect: >-
        Flat at the nominal alpha. A rejection rate that does NOT stay flat -- that
        grows with sample size on a null where no effect exists -- is the canonical
        artifact tell of docs/inventor-protocol.md section 3 and voids the battery.
    - metric: >-
        transported_class_uniformity: law of c along one isogeny class with P
        transported by an explicit isogeny of degree coprime to N
      direction: different
      minimum_effect: >-
        Predicted uniform. A departure here is the same object as
        IDEA-20260821-3d5f22's edge character and the two records must be
        reconciled before either is interpreted; they are deliberately measuring
        adjacent quantities and disagreement between them is informative.

  minimal_test:
    design: >-
      FOUR ARMS, ALL TOY, ALL EXHAUSTIVE RATHER THAN SAMPLED IN c.
      ARM 0 (gate, zero compute): re-read IDEA-20260807-413fcc, IDEA-20260811-b2806a
      and IDEA-20260807-63056d from the primary records and confirm the range-side
      cell is genuinely undecided. If any of them already adjudicates it, WITHDRAW
      this proposal and record the withdrawal; that is the cheapest possible
      outcome and is the first thing to try.
      ARM 1 (primary): sample >= 2000 toy curves over primes with 10^3 <= N <= 10^4
      and prime group order; for each, enumerate E(F_p), compute rho_pi(E) for each
      of at least three predicates, and compute c = log_P(rho_pi(E)) by exhaustive
      discrete logarithm. Run the uniformity and conditional-MI battery.
      ARM 2 (controls): the same battery on (a) the random-generator null, (b) the
      pi = "return P" constant predicate, (c) the j = 0 Aut-equivariant predicate,
      (d) the decay sweep over instance counts.
      ARM 3 (class arm): one isogeny class, P transported by an explicit isogeny of
      degree coprime to N, with a transport certificate re-verified independently of
      the transport code (the same certificate discipline EV-ENDO-10109d records for
      the MTGT runs, where every transported entry was re-verified by recomputing
      [s]phi(P) on the target curve).
    controls:
      - >-
        NULL OBJECT: rho replaced by a uniformly random generator, which makes c
        uniform by construction; the battery must accept at the nominal rate.
      - >-
        TWO POSITIVE CONTROLS: c = 1 constant, and the j = 0 Aut-equivariant
        predicate whose non-uniformity is forced by H-ENDO-001's scalar action.
        Both directions of the RQ-INSTR-f8faa0 control are thereby exercised, as
        GOAL-ENDO-001 C4 requires.
      - >-
        DECAY CONTROL over instance count on the null.
      - >-
        PRE-REGISTERED, pi-INDEPENDENT SAMPLER FOR P, with its independence argued
        in the contract rather than assumed.
      - >-
        MULTIPLE-COMPARISON CONTROL: the number of (predicate x label) cells is
        declared in advance with a fixed family-wise correction; the campaign has a
        recorded multiplicity problem (IDEA-20260807-caf061 counts seven verdicts
        per class across four classes in one run) and this battery would otherwise
        repeat it.
      - >-
        TRANSPORT CERTIFICATE re-verified independently of the transport code
        (docs/claims-and-verification.md).
    required_metrics:
      - c per instance per predicate, with the enumeration certificate
      - marginal uniformity statistic, its p-value and its MDE in total-variation distance
      - conditional MI per label with the null's 99th percentile
      - both positive-control verdicts and the null acceptance rate
      - decay-sweep rejection rates against the exact binomial acceptance interval
      - the declared multiple-comparison family and correction
      - transported-class c law with its transport certificates
      - artifact manifest with hashes, seeds and a from-scratch rebuild receipt

  falsification_conditions:
    - >-
      ARM 0 finds the range-side cell already adjudicated in a primary record. The
      proposal is WITHDRAWN, at the cost of three file reads, and the withdrawal is
      recorded. This is listed first because it is the likeliest cheap outcome and
      because a proposal that cannot name its own withdrawal condition is not
      falsifiable.
    - >-
      c is uniform and label-independent within the reported MDE on every tested
      predicate, with both positive controls firing and the null accepted at the
      nominal rate. D2's simulability condition holds at this scope: CSEL joins the
      closed cell, C3 gains a decided entry, and the obstruction recorded is the
      MDE itself -- the effect size the experiment could not have missed.
    - >-
      Some predicate shows c non-uniform, or some label shows MI above the null's
      99th percentile, replicated at a second prime. CSEL(pi) is non-simulable for
      that predicate, the campaign has a non-generic resource located precisely,
      and GOAL-ENDO-001 P3 applies: an independent review-adversarial session runs
      before any record states the excess.
    - >-
      A positive control fails to fire. The battery cannot detect a signal it is
      guaranteed to face, no negative may be recorded (P1), and every arm is marked
      attempted_and_inconclusive.
    - >-
      The null's rejection rate grows with sample size. The battery is measuring an
      artifact; nothing may be read from any arm.

  confounders:
    - >-
      THE SAMPLER FOR P. If P is chosen by any coordinate rule, c is structured by
      construction. This campaign has been bitten twice by exactly this family of
      defect and the confound is therefore treated as the primary risk, not a
      footnote.
    - >-
      SMALL N. At N ~ 10^3 the chi-square has few counts per cell and the MDE in
      total-variation distance is coarse; a null here excludes only large effects
      and the record must say how large. Raising N raises the exhaustive-DL cost
      linearly, which bounds the design.
    - >-
      MULTIPLICITY. Three predicates times five labels times two primes is thirty
      tests; without a declared correction the expected number of spurious
      rejections at alpha = 0.05 is about 1.5, which is larger than the effect
      being hunted.
    - >-
      NON-CYCLIC GROUPS. "The point of G" is ill-defined when the target subgroup
      is ambiguous; primary-arm instances must have prime group order and the
      secondary arm must declare its subgroup choice explicitly.
    - >-
      MODEL DEPENDENCE. Shoup's random-encoding simulator and Maurer's abstract
      simulator differ in what an adversary can even ask about a returned element;
      a verdict obtained under one does not automatically transfer to the other,
      and the contract must name which is used.

  interpretation_limits:
    - >-
      TOY TIER, FINITELY MANY PREDICATES. Nothing transfers to cryptographic N and
      no transfer is offered; the transfer assumption that would be needed -- that
      uniformity of c is not an artifact of small N -- is named and NOT discharged.
    - >-
      A SIMULABILITY VERDICT IS A STATEMENT INSIDE A MODEL. It inherits every known
      limitation of generic-group arguments (recalled: Dent 2002) and says nothing
      about adversaries that use coordinates directly, which is every real
      non-generic method.
    - >-
      NO EXPONENT MOVES. The sqrt(N) generic bound is the incumbent and is not
      challenged; a simulable verdict CONFIRMS the incumbent for one more oracle
      cell and a non-simulable verdict locates a resource without exhibiting an
      algorithm that uses it.
    - >-
      CSEL IS NOT AN ATTACK EVEN IF NON-SIMULABLE. An adversary handed rho(E) must
      still compute log_P(rho(E)) to use it, which is another instance of the same
      problem. The record's value is adjudicative, and any reading of a
      non-simulable verdict as an attack is unsupported.
    - >-
      THE WITHDRAWAL CONDITION IS REAL. If ARM 0 finds the cell decided, this
      record contributes nothing beyond the check itself, and it should be retired
      rather than defended.

  heuristic_assumptions:
    - id: H1
      statement: >-
        COORDINATE-SELECTION GENERICITY. For a predicate pi depending only on
        coordinates and not on the group structure, the scalar
        c = log_P(rho_pi(E)) is distributed as a uniform draw on (Z/N)^*, jointly
        with the public data, as the curve ranges over the sampled family.
      rigorous_support: >-
        RIGOROUS INGREDIENT: for a FIXED curve and a uniformly random generator P,
        c is exactly uniform on (Z/N)^* -- a theorem, and the content of the
        random-generator null. CLASSICAL STATEMENT IMITATED: that an
        arithmetically defined selection behaves like a random one, the same shape
        of assumption as the genericity of the least quadratic non-residue. THE GAP,
        STATED: the real experiment fixes P by a sampler and varies the curve, which
        is not the situation the theorem covers, and closing that gap is what the
        measurement is for.
      falsification_condition: >-
        Marginal or conditional non-uniformity above the reported MDE, replicated at
        a second prime, with both positive controls firing and the null accepted.
      validation_plan: >-
        SAMPLE: >= 2000 toy curves at 10^3 <= N <= 10^4, exhaustive computation of
        c (not estimated). SHORTCUT MAKING IT FEASIBLE: at these N the discrete
        logarithm defining c is exhaustive, so no hardness assumption enters the
        measurement -- the toy scale is chosen for this reason. COMPARISON:
        empirical distribution of c against the uniform multinomial on (Z/N)^*, and
        conditional MI against a permutation null with >= 10^4 draws. TAIL CHECK:
        the most and least frequent c values against the multinomial's extreme
        quantiles. TRANSFER: the extrapolation from N ~ 10^3-10^4 to cryptographic
        N is NOT made and is recorded as the open gap.
    - id: H2
      statement: >-
        SIMULATOR ADEQUACY. An adversary's advantage against CSEL(pi) is bounded by
        the statistical distance of c from uniform plus the standard generic-group
        collision term O(q^2/N).
      rigorous_support: >-
        RIGOROUS INGREDIENT: the standard generic-group hybrid argument, in which
        the simulator fails only on a formal-versus-real collision, of probability
        at most q^2/N by a union bound over query pairs. CLASSICAL STATEMENT
        IMITATED: that adding one fresh symbol to the simulator's state costs
        nothing beyond the distance of that symbol's law from uniform -- which is
        the step this record asserts and which a reviewer must check, since it is
        the load-bearing joint of D2.
      falsification_condition: >-
        An explicit adversary that distinguishes real from simulated CSEL with
        advantage exceeding the sum of those two terms, exhibited at toy scale.
      validation_plan: >-
        SAMPLE: implement both the real oracle and the simulator at N ~ 10^3, run a
        declared family of adversaries (formal-collision hunters, and an adversary
        that computes group operations on the returned handle and tests equalities)
        for q in {10, 100, 1000}, and measure the empirical distinguishing
        advantage. COMPARISON: measured advantage against
        (statistical distance of c) + q^2/N. TAIL CHECK: the largest advantage over
        repeated trials against the predicted bound. TRANSFER: none; the bound is
        checked at exactly the parameters used, and the adversary family is
        declared in advance so a negative bounds only that family.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED OR MOVED IN EITHER OUTCOME. A simulable verdict
      CONFIRMS exponent 1/2 for one more oracle cell; a non-simulable verdict
      locates a resource and exhibits no algorithm. Experiment cost: 2000 curves x
      O(N) point enumeration and O(N) exhaustive discrete logarithm at N <= 10^4,
      i.e. under 10^8 elementary operations in total -- minutes on one core.
    memory_exponent: >-
      O(N) points held per instance, negligible. The adjudicated ORACLE has no
      memory cost of its own, which is part of why its simulability matters: an
      oracle that is free and non-simulable is the shape of resource this campaign
      is looking for, and finding it free and SIMULABLE is the informative negative.
    best_known: >-
      The generic lower bound sqrt(N) (recalled: Shoup 1997) as extended by this
      program's own binding closure KN-FIND-b7e091 for the incidence and
      endomorphism-image oracle classes. Concrete matched controls for any cost
      statement remain Pollard rho with distinguished points and BSGS, per
      RQ-GGMB-6eaabc's and the goal's constraints.
    hidden_overhead: >-
      NO ASYMPTOTIC IS CLAIMED SO NOTHING HIDES IN AN o(1). What is disclosed
      instead: the poly(log p) computability of rho_pi assumes a small cofactor;
      the q^2/N collision term in H2 is the standard generic-group slack and is not
      tightened here; and a statistical verdict at toy N does not bound the
      statistical distance at cryptographic N by any argument given here.
    tradeoff_note: >-
      Not applicable -- no algorithm is proposed. The relevant structural remark is
      that CSEL costs the adversary nothing and returns one group element per
      curve, so if it were non-simulable it would be a free non-generic resource,
      which is the most valuable shape a resource can have and the reason this cell
      should not be left undecided.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS OF THE FRONTIER BEFORE ANSWERING. As an attack: n/a
    (no result claimed) -- no time, memory or query point is offered and no
    frontier row applies. As a generic-group result: dominated by Shoup's sqrt(N)
    lower bound (recalled) and by this program's own KN-FIND-b7e091, both of which
    already close larger oracle classes; this record extends the catalogue by one
    cell and beats nothing. As an adjudication method: partially anticipated by
    IDEA-20260807-7270d1's criticism of the binary verdict, whose graded reading
    this record adopts. On the specific argument-versus-range distinction, nothing
    in the corpus dominates it -- subject to the ARM 0 check, which could show
    otherwise and is the declared withdrawal condition.
  sota_delta: >-
    ZERO on every attack axis in both outcomes. Time exponent unchanged at 1/2,
    memory unchanged, query model unchanged, claim_tier toy. Quantitatively what
    changes is one entry of GOAL-ENDO-001's C3 catalogue moving from undecided to
    decided, with a measured minimum detectable effect attached rather than a
    verdict; and, in the negative branch, the closure of a family of "publicly
    computable canonical point" proposals at a stated effect size.

  discriminated_from:
    - >-
      IDEA-20260807-413fcc closes curve-measurable oracles on ARGUMENTS. This
      record identifies the RANGE side as undecided and extends that record rather
      than competing with it; if ARM 0 shows the extension is already made, this
      record withdraws.
    - >-
      IDEA-20260807-070d03's FBMEM_S(h) consumes coordinates on the INPUT side and
      returns a bit. CSEL consumes none and returns a group element. The two are
      mirror images and neither closure transfers to the other.
    - >-
      IDEA-20260807-d73e83's TRANSPORT(phi, h) returns a handle, but for the image
      of a SUPPLIED handle, so its output is a formal linear form and the standard
      simulator already covers it. CSEL's output is not a formal linear form in
      anything the adversary holds, which is the whole difficulty.
    - >-
      IDEA-20260807-63056d proposes the C3 adjudication catalogue and
      IDEA-20260811-b2806a invents three oracles and routes them through RQ-GGMB.
      This record supplies one cell of that catalogue with an executable
      adjudication criterion; whether either already covers this cell is ARM 0's
      question and the honest answer today is that this session does not know.
    - >-
      IDEA-20260807-7270d1 argues the binary simulable/non-simulable verdict is
      defective and wants a graded answer. This record agrees and delivers the
      graded form: a statistical distance with an MDE, not a bit.
    - >-
      IDEA-20260821-3d5f22 measures whether the edge character chi is PREDICTABLE
      from cheap labels, a vectorization question. This record measures whether the
      vertex scalar c is UNIFORM, a simulability question. They share the labelling
      rho and are deliberately adjacent; ARM 3 is the point where they must agree,
      and disagreement between them would be informative about the instrument
      rather than about either hypothesis.

