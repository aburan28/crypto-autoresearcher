idea:
  id: IDEA-20260809-3a5c29
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-AEADC-8db132
  goal_id: GOAL-AEADC-001
  title: >-
    Key commitment is not context commitment: certificates that collide on
    associated data or nonce while the key is committed
  class: measurement
  claim: >-
    A construction can commit to the key and still not commit to the nonce or the
    associated data, and deployed reasoning routinely conflates the two. The claim
    is that for at least one published repair there exist two contexts differing
    in associated data or nonce, with the SAME key, that produce the same
    ciphertext-tag pair or that both decrypt successfully — a literal certificate
    of the gap between key commitment and context commitment.
  mechanism: >-
    Instantiate each repair, fix the key, and search the finite structure of the
    tag computation for context pairs the commitment step does not separate. Where
    a repair hashes only the key into its commitment value, the associated data
    enters only through the authenticator, and the authenticator's algebra is the
    same one the two-key construction exploits.
  why_not_a_renamed_known_approach: >-
    The key-versus-context distinction is made in the literature and some repairs
    explicitly target the stronger property. This record makes the distinction
    OPERATIONAL: a certificate per repair per property, so a reader can see which
    property each construction actually delivers rather than which it advertises.
  predictions:
  - observable: existence of a context-collision certificate for each implemented repair
    metric: boolean per repair per property
    predicted: >-
      At least one repair commits to the key but not to the full context. A
      repair that turns out to commit to everything is a clean positive result
      for that construction and is recorded as such.
  - observable: whether the associated-data length is the discriminating factor
    metric: certificate existence versus AD length
    predicted: Length-extension-like structure matters; if certificates exist only at specific AD lengths, that boundary is the deliverable.
  minimal_test: >-
    Implement two repairs, fix a key, attempt context collisions across a declared
    class of context pairs, and emit certificates or an explicit statement of the
    class searched and the budget spent.
  controls:
  - 'PROPERTY DEFINITIONS FILED FIRST: the exact definitions of key and context commitment come from filed primary text before any cell is filled, since the whole table is a statement about definitions.'
  - 'POSITIVE CONTROL: a deliberately non-committing construction must yield certificates immediately, proving the search machinery works.'
  falsification_conditions:
  - No context collisions are found for any implemented repair within the declared class and budget, in which case the record states the class and budget rather than claiming the repairs are complete.
  - The property definitions in the filed text do not support the distinction as drawn here.
  interpretation_limits: >-
    Absence of a certificate within a declared class is not a proof of context
    commitment. This is stated in every cell that reports absence.
  sota_delta: 'No attack. Delta: a per-repair, per-property certificate table where the literature offers per-construction claims.'
  dominated_by: Not dominated by any corpus record; depends on the repair implementations from IDEA-20260809-3da508.
  estimated_cost: Implementation medium; compute low.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for context commitment: no records. WEB NOT CHECKED.'
  source_refs:
  - Committing-AEAD references defining the property hierarchy -- RECALLED, REQUIRED READS.
