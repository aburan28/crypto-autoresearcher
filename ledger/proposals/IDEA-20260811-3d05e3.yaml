  discriminated_from: >-
    IDEA-20260807-0fafe8 (backward reduction, Hom(Z/N, Cl(O)) = 0): the record
    this one patches. 0fafe8's argument is about the ADDITIVE group Z/N of order
    N; the natural bridge is MULTIPLICATIVE, of order N-1, and 0fafe8 never
    mentions it (verified by grep, not recalled). Same lane, same direction,
    different group, different obstruction.
    IDEA-20260807-bbdcf3 (size gap h < N): also an additive/counting argument;
    it does not bound Hom(Cl(O), (Z/N)^*), which can be nonzero for h and N-1
    of any sizes.
    H-ENDO-001 and KN-FIND-b7e091: concern endomorphisms acting on G, i.e. the
    LOOP case of this cocycle. This record uses the loop case as its calibration
    and as the source of the holonomy lemma, extending those results to edges
    between distinct curves rather than re-litigating them.
    IDEA-20260807-cb672c (the bridge detector): a mutual-information instrument
    for class-group-derived statistics of an ECDLP instance, calibrated against
    resampling nulls and planted bridges. Different object (a statistic of the
    instance versus a cocycle on the graph), different null (resample k versus
    randomise the cocycle), and different failure mode. cb672c would measure
    whether gamma carries bits about k; this record measures whether the cocycle
    carries bits about the CLASS, which is the Direction-1 question.
    IDEA-20260811-319a07 (ray-class torsor): the algebraic parent. That record
    identifies the extension whose kernel contains k; this record measures the
    induced multiplier structure on the graph and supplies the cheap
    characteristic-p instrument that 319a07's diagram predicts. They must agree:
    319a07's surjectivity of O -> O/n IS this record's holonomy lemma, so a
    disagreement falsifies one of them.
    IDEA-20260811-45676a (Direction-1 barrier): this record's holonomy lemma is
    that record's load-bearing simulation lemma. This is the cheap empirical
    test of it.
