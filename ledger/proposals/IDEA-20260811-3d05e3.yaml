idea:
  id: IDEA-20260811-3d05e3
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CLGP-b99df5
  goal_id: GOAL-ENDO-001
  claim_tier: toy
  title: >-
    THE CORPUS CLOSED THE WRONG GROUP -- the natural Direction-1 bridge lands in
    (Z/N)^*, not in Z/N, where Hom(Cl(O), (Z/N)^*) is generically NONZERO and
    IDEA-20260807-0fafe8's coprimality argument has no force. The object is the
    (Z/N)^*-valued SCALAR COCYCLE on the class-group Cayley graph, c(a, E')
    defined by phi_a(P_{E'}) = [c] P_{[a]E'}; it is computable at toy scale, and
    the reduction "vectorization from class-group DL in (Z/N)^*" dies not from
    coprimality but because the holonomy over principal ideals is SURJECTIVE, so
    the observed scalar is a function of the chosen PATH and not of the class
  class: measurement

  claim: >-
    (A) THE HOLE IN THE EXISTING CLOSURE, STATED FIRST. IDEA-20260807-0fafe8
    closes the backward direction with, among others, the observation that
      Hom(Z/N, Cl(O)) = Hom(Cl(O), Z/N) = 0 whenever N > h(O),
    which is correct and elementary, because N is prime and larger than h(O).
    A ripgrep of that record shows it never mentions (Z/N)^*. The natural
    bridge, however, does not land in Z/N. An isogeny phi : E' -> E'' between
    curves in the class restricts to an isomorphism of the prime-order subgroups
    G' -> G'', and relative to chosen generators it IS multiplication by a
    scalar in (Z/N)^* -- a MULTIPLICATIVE object of order N - 1. And
      Hom(Cl(O), (Z/N)^*) is generically NONZERO,
    because gcd(h(O), N - 1) is generically greater than 1 (both are of size
    about p^{1/2} and p respectively with no coprimality forced by anything).
    So the existing coprimality argument does not reach the natural bridge, and
    the lane's backward closure has a gap at exactly the place a reduction would
    be built. THIS RECORD OPENS THE GAP AND THEN CLOSES IT FOR A DIFFERENT
    REASON, and the difference is the content.

    (B) THE OBJECT, DEFINED SO THAT ITS ONE-STEP PROPAGATION IS MEASURABLE.
    Fix the class {E_0, ..., E_{h-1}} of ordinary curves with End = O and
    trace t, each with prime-order subgroup G_i of order N. Choose a GAUGE: a
    generator P_i of G_i for every i (arbitrary choice, recorded). For an ideal
    a coprime to N with [a] E_i = E_j, the isogeny phi_a is determined up to
    Aut(E_i) = {+-1}, and we define
      c(a, i) in (Z/N)^* / {+-1}   by   phi_a(P_i) = [c(a, i)] P_j.
    COMPOSITION LAW (one-step propagation, exact):
      c(ab, i) = c(b, j) * c(a, i)  where j is the index of [a] E_i.
    GAUGE CHANGE: replacing P_i by [u_i] P_i sends
      c(a, i) -> u_i * c(a, i) * u_j^{-1},
    i.e. a coboundary. So c is a 1-cocycle on the Cl(O)-torsor with values in
    (Z/N)^*/{+-1}, and the gauge-invariant content is its cohomology class.

    (C) THE CANDIDATE REDUCTION THIS OBJECT SUPPORTS, WRITTEN OUT. If the class
    of c were a nontrivial injective homomorphism chi : Cl(O) -> (Z/N)^*, then
    Cl(O)-VECTORIZATION would reduce to a DISCRETE LOGARITHM IN (Z/N)^*, which
    is subexponential (index calculus in F_N^*) rather than p^{1/4}. The
    quantifier order of the candidate:
      FORALL p, FORALL ordinary (E, O), THERE EXISTS a polynomial-time R such
      that FORALL pairs (E_i, E_j) in the class,
        R(E_i, E_j, chi-data) = the class [a] with [a] E_i = E_j.
    This is a genuine, non-vacuous Direction-1 candidate and it is not covered
    by any closure in the corpus.

    (D) WHY IT DIES, AND THE REASON IS NEW. Restrict the cocycle to loops at a
    base curve, i.e. to PRINCIPAL ideals a = (alpha). Then j = i, the gauge
    cancels, and
      c((alpha), i) = lambda_alpha, the scalar by which the endomorphism alpha
      acts on G, i.e. the image of alpha under the ring surjection
      O -> O/n = Z/N with n = (N, pi - 1).
    That surjection is SURJECTIVE, so as alpha ranges over generators of
    principal ideals coprime to N, lambda_alpha ranges over ALL of
    (Z/N)^*/{+-1}. Consequence, stated sharply:
      HOLONOMY LEMMA. For every class [a] and every target value v in
      (Z/N)^*/{+-1} there is an ideal a' in [a] with c(a', i) = v.
    Hence the observed scalar is determined by WHICH REPRESENTATIVE IDEAL (i.e.
    which path in the isogeny graph) was used, and carries no information about
    the class. The cohomology class of c is therefore trivial as a map on
    Cl(O), and chi in (C) does not exist. THE OBSTRUCTION IS FULL HOLONOMY, NOT
    COPRIMALITY -- and it is exactly H-ENDO-001's scalar collapse re-read as a
    statement about paths rather than about points, which is why this record
    treats H-ENDO-001 as the INPUT to its obstruction rather than as a filter it
    must dodge.

    (E) THE ONE QUANTITY THAT SURVIVES GAUGE-FIXING AND IS WORTH MEASURING.
    Choosing a CANONICAL representative for each class -- the reduced binary
    quadratic form -- makes
      gamma : Cl(O) -> (Z/N)^*/{+-1},  gamma([a]) := c(a_reduced, 0),
    a well-defined function of the class. gamma is NOT polynomial-time
    computable (the reduced form has norm up to about sqrt(|D|) = p^{1/2} and
    evaluating that isogeny costs its degree), so it is not an attack. But it is
    computable AT TOY SCALE, and its statistical structure is a real, cheap,
    falsifiable question with two possible answers that mean different things:
      NULL BRANCH (predicted): gamma is equidistributed on (Z/N)^*/{+-1} and
        exhibits no subgroup structure -- confirming (D) empirically and
        confirming that the scalar carries no class information beyond gauge.
      SIGNAL BRANCH (not predicted, and the reason to run it): gamma restricted
        to some subgroup of Cl(O) is a homomorphism, or gamma has bias
        detectable above the stated floor. That would mean a canonical-gauge
        bridge exists after all, would contradict (D)'s reading, and would be
        escalated rather than stated.

    (F) WHY THIS IS A MEASUREMENT AND NOT A MECHANISM. (D) is a derivation and
    could be filed alone. It is filed as a measurement because the corpus's
    standing practice -- and docs/inventor-protocol.md section 3 -- is that an
    expected zero must be a MEASURED zero with a detection floor. The cocycle is
    the cheapest instrument in the lane that has both a natural null (a random
    scalar assignment) and a natural planted signal (a synthetic cocycle built
    to be a genuine character), and it simultaneously validates the load-bearing
    simulation lemma of IDEA-20260811-45676a.

  resource_label: >-
    R4 (the isogeny graph / class-group action, which supplies the isogenies
    whose scalars are measured) and R3 (End(E) as a ring, which supplies the
    surjection O -> Z/N used in the holonomy lemma). The scalars themselves are
    group-operation outputs and are therefore NOT the resource; they are the
    instrument's readout, and the record's conclusion is precisely that the
    readout is gauge.
  admissibility: admissible
  admissibility_argument: >-
    THE FILTER'S CENTRAL CASE, ADDRESSED DIRECTLY. Evaluating phi_a on P_i and
    reading off a scalar is exactly what H-ENDO-001 says adds no congruence --
    when phi is an ENDOMORPHISM. Here the isogenies go between DIFFERENT curves,
    so the object is not an endomorphism and the scalar collapse does not apply
    a priori; the record's own finding is that the loop case (where it does
    apply) is precisely what destroys the non-loop case. That is an EXTENSION of
    H-ENDO-001 to a new object, in the sense the standing constraint permits
    (KN-FIND-b7e091 is extended, never revisited), and not a re-test of it. A
    record whose only content were "apply phi to points of G" would be
    inadmissible; this record's content is the cocycle's cohomology class and
    its holonomy, which are properties of the GRAPH, not of G.

  object_first_candidate:
    established_families_declared_off_limits: >-
      Declared off-limits as the primary lens: the connecting ideal class; the
      kernel ideal of <Q>; the endomorphism scalar lambda on G taken by itself;
      cost functionals as class functions; the generic-group transcript.
    tracked_object: >-
      THE SCALAR COCYCLE c on the Cayley graph of Cl(O) with values in
      (Z/N)^*/{+-1}: for each edge of the graph, the multiplier the
      corresponding isogeny induces on the prime-order subgroup relative to a
      fixed gauge.
    lossiness: >-
      GENUINELY LOSSY, AND EXTREMELY SO. An isogeny of degree ell is a pair of
      rational functions over F_p; the projection keeps ONE element of
      (Z/N)^*/{+-1} and discards the kernel, the degree, the rational functions
      and the entire action on E'(F_p) outside G. What is discarded is
      discarded COMPATIBLY: the multiplier of a composite is the product of the
      multipliers, exactly, because restriction to G is a functor to
      one-dimensional F_N-modules. So the retained part propagates
      deterministically under the target's operation (composition of
      isogenies), which is precisely the lossy-projection test of
      docs/inventor-protocol.md section 2. Contrast with the failed example
      there: nothing about the isogeny is recoverable from c, so this is not a
      change of coordinates.
    propagation: >-
      One step is defined and measurable: traverse one small-prime edge,
      evaluate the isogeny on the current generator, solve one discrete
      logarithm in G to read the multiplier. At toy scale that is milliseconds.
      The cocycle condition c(ab, i) = c(b, j) c(a, i) is a checkable identity
      and is the instrument's own self-test.
    survival_score: >-
      Survives every edge and every loop of the graph -- the object is globally
      defined, which is unusual in this lane. It DISSOLVES as an information
      carrier at the first loop, because the loop value is a free parameter
      (the holonomy lemma). So its survival depth is exactly "one fundamental
      domain of the graph", i.e. it is a genuine object on the universal cover
      and gauge on the base. Naming that depth is the record's structural
      finding.

  mechanism: >-
    STEP 1 (zero compute). Fix the gauge convention and freeze it: the
    generator P_i chosen per curve, the sign convention for {+-1}, and the
    reduction convention for binary quadratic forms.

    STEP 2 (toy compute). Build a toy ordinary class with h(O) between 20 and
    200 at p of 16-24 bits, with N prime and small cofactor. Enumerate the class
    by small split primes ell_1 < ... < ell_r.

    STEP 3 (toy compute, INSTRUMENT SELF-TEST AND HARD GATE). Measure c on
    every edge. Verify the cocycle identity on 10^4 random pairs of composable
    edges. Verify the LOOP identity: for every short loop, the measured product
    of multipliers must equal the publicly computed lambda_alpha of the
    corresponding principal ideal's generator, obtained independently by
    reducing alpha modulo n = (N, pi - 1). Exact agreement is required; a single
    mismatch halts the line as an implementation error, because both sides are
    elementary.

    STEP 4 (toy compute, THE HOLONOMY MEASUREMENT). For a fixed class [a] and a
    fixed endpoint, sample many distinct paths realising it, and record the
    distribution of the observed multiplier. Predicted: uniform on
    (Z/N)^*/{+-1}, i.e. FULL holonomy, i.e. no class information. Report a
    total-variation distance and a detection floor, so that the expected zero is
    a measured zero.

    STEP 5 (toy compute, THE ONE SURVIVING QUANTITY). Compute gamma of (E) over
    the entire class by brute force, and test it for structure: is it
    equidistributed; is its restriction to any cyclic subgroup of Cl(O) a
    homomorphism; is the multiset {gamma([a]) gamma([b]) gamma([ab])^{-1}}
    concentrated at 1. Report against the null and the planted control.

    STEP 6 (zero compute). Record the result as an extension of KN-FIND-b7e091
    to the cocycle object, with the residual class named: cocycles valued in
    groups OTHER than the multiplier group -- e.g. valued in the automorphism
    group of extra structure such as ell-torsion bases for ell != N, which is
    resource R5 and is where IDEA-20260811-45676a says the real boundary lies.

  why_not_a_renamed_known_approach: >-
    The nearest known mathematics is the elementary fact that an isogeny
    restricted to a prime-order subgroup is multiplication by a scalar, which is
    H-ENDO-001's own content for endomorphisms and is textbook for isogenies.
    Nothing about that is claimed as new. What is new to this corpus is (i) the
    observation that the corpus's coprimality closure is stated for the WRONG
    group and does not reach the multiplicative bridge, (ii) the packaging of
    the multipliers as a cocycle whose cohomology class is the well-posed
    question, and (iii) the holonomy lemma as the actual obstruction, which
    replaces a coprimality accident with a structural reason. A cocycle that
    was merely "the scalar of an endomorphism, renamed" would be inadmissible
    under H-ENDO-001; the distinguishing feature is that this object lives on
    edges between DIFFERENT curves and its triviality is a theorem about loops,
    not an assumption about points.

  proof_search_map:
    bottleneck: >-
      The holonomy lemma: surjectivity of O -> O/n = Z/N restricted to
      generators of principal ideals coprime to N. If that surjectivity failed
      -- if the reachable multipliers formed a proper subgroup H < (Z/N)^* --
      then the cocycle would descend to a nontrivial map into (Z/N)^*/H and the
      candidate reduction of (C) would be alive on that quotient. This is the
      exact step whose failure changes the conclusion.
    baseline_embedding:
      parameter_slice: >-
        Set h(O) = 1. The class is one curve, every ideal is principal, the
        cocycle is pure holonomy, and the candidate reduction is vacuous. That
        is the degenerate boundary of the family and it reproduces the trivial
        baseline exactly. Second slice: replace (Z/N)^* by Z/N (additive) and
        the statement degenerates to IDEA-20260807-0fafe8's Hom = 0, which is
        the corpus baseline this record extends.
      reproduction_check: >-
        Symbolic for both slices, plus a frozen fixture: one toy class with
        h(O) = 1 on which the pipeline must report "no class information" for
        the trivial reason, and one additive-valued run that must reproduce
        0fafe8's conclusion.
    observation_collision:
      observable: >-
        The measured multiplier c(a, i) in (Z/N)^*/{+-1}.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED MAXIMALLY. Search for two ideals in
        DIFFERENT classes with the same multiplier, and for two ideals in the
        SAME class with different multipliers. Prediction: both are found
        immediately and in abundance, because holonomy is full. That double
        collision IS the obstruction. Finding that same-class ideals always
        share a multiplier would refute (D) and revive (C) -- the single
        outcome worth the run.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fibre of gamma over a fixed multiplier value, intersected with
          Cl(O). Vary the forgotten structure (the path) while holding the
          observable fixed, and search for an intrinsic invariant separating
          the fibre's points.
        predicted_gain: >-
          None as an attack. The deliverable is the record of which forgotten
          degrees of freedom (path choice, gauge, sign) were exhausted and
          which remain -- per KN-TECH-080 card F, that record is useful even
          when no counterexample exists.
      - transform: stronger_invariant
        proposed_object: >-
          Refine the multiplier to a multiplier PLUS an ell-torsion basis
          change for small ell != N, i.e. a cocycle valued in
          (Z/N)^* x GL_2(Z/ell). The stronger state is what survives, because
          the ell-torsion component does determine the isogeny locally.
        predicted_gain: >-
          Not developed here; handed to IDEA-20260811-45676a, which identifies
          exactly this as the boundary of its barrier. Naming the handoff is
          what keeps this record from over-reaching.
    quantifier_order: >-
      ASSERTED: FORALL ordinary classes with h(O) > 1 and N prime coprime to
      the edge degrees, FORALL base curves E_i, FORALL classes [a], FORALL
      values v in (Z/N)^*/{+-1}, THERE EXISTS an ideal a' in [a] with
      c(a', i) = v. (Holonomy lemma -- a forall/forall/exists statement with the
      existential innermost, which is the strong form.)
      NOT ASSERTED: that no bridge from Cl(O) to any group exists; that the
      cocycle carries no information about anything; that gamma is
      uncomputable in principle (it is computable, just not in polynomial
      time).
      GAUGE DEPENDENCE IS THE QUANTIFIER TRAP HERE: statements about c must be
      quantified over gauges or they are meaningless. Every claim above is
      either gauge-invariant (loops, cohomology class, holonomy) or explicitly
      gauge-fixed (gamma, via reduced forms).
    method_ceiling:
      strongest_certifiable_claim: >-
        "The multiplier cocycle on the ordinary F_p-isogeny class has full
        holonomy in (Z/N)^*/{+-1}, hence its cohomology class defines no
        nontrivial homomorphism Cl(O) -> (Z/N)^*, hence the multiplicative
        bridge of (C) does not exist." It can NEVER certify that no bridge into
        any other group exists, and in particular says nothing about cocycles
        valued in ell-torsion structure for ell != N.
      nearby_object_control: >-
        THE ell-TORSION COCYCLE for a small prime ell != N, where the desired
        conclusion FAILS: the action of an isogeny on E[ell] does determine the
        isogeny locally (this is how Elkies steps and CSIDH-style action
        evaluation work), so a cocycle valued there is NOT gauge. The
        instrument must distinguish the two cases; if it reports "full
        holonomy, no information" for the ell-torsion cocycle as well, it is
        measuring gauge freedom rather than structure and every conclusion is
        void.
    proof_obligations:
      - claim: >-
          An F_p-isogeny of degree coprime to N restricts to an isomorphism
          G -> G', hence is multiplication by a scalar relative to gauges.
        responsibility: correctness
      - claim: c satisfies the cocycle identity and gauge changes act as coboundaries.
        responsibility: correctness
      - claim: >-
          For a principal ideal (alpha), c((alpha), i) = lambda_alpha, the image
          of alpha in O/n = Z/N.
        responsibility: correctness
      - claim: >-
          O -> O/n is surjective and its restriction to generators of principal
          ideals coprime to N is onto (Z/N)^*.
        responsibility: strictness
      - claim: >-
          Hom(Cl(O), (Z/N)^*) is generically nonzero, so the coprimality
          argument of IDEA-20260807-0fafe8 does not cover this bridge.
        responsibility: baseline
      - claim: gamma is well defined but not polynomial-time computable.
        responsibility: runtime

  predictions:
    - metric: >-
        cocycle-identity violation rate over 10^4 random composable edge pairs
      direction: lower
      minimum_effect: >-
        exactly 0. Any violation is an implementation error, not mathematics,
        and halts the line.
    - metric: >-
        loop-agreement rate between the measured product of multipliers around
        a loop and the independently computed lambda_alpha of the corresponding
        principal ideal
      direction: higher
      minimum_effect: >-
        exactly 1.00. This is the instrument's calibration against a quantity
        the corpus already trusts (H-ENDO-001 / KN-FIND-b7e091 Oracle D), and
        a rate below 1.00 invalidates every other number in the run.
    - metric: >-
        total-variation distance between the empirical distribution of
        multipliers over many paths realising ONE fixed class, and the uniform
        distribution on (Z/N)^*/{+-1}
      direction: lower
      minimum_effect: >-
        below the stated detection floor (predicted: consistent with 0 at the
        sample size used, with the floor reported as a number and not as an
        adjective). A distance materially above the floor means holonomy is NOT
        full and the candidate reduction of (C) is alive on a quotient -- the
        outcome that would matter and the reason to run it.
    - metric: >-
        homomorphism defect of gamma, measured as the fraction of triples
        ([a], [b]) with gamma([a])gamma([b]) = gamma([ab])
      direction: lower
      minimum_effect: >-
        consistent with the chance rate 1/#((Z/N)^*/{+-1}) within Poisson error.
        A defect rate significantly BELOW chance (i.e. gamma more homomorphic
        than random) on any subgroup of Cl(O) is the signal branch and is
        escalated, not stated.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, the cheapest discriminator): check the arithmetic
      claim that gcd(h(O), N - 1) > 1 occurs for a nonneglible fraction of toy
      classes. If it never occurs, the gap in IDEA-20260807-0fafe8 is not a real
      gap for these parameters and the record's motivation weakens (though
      (D) still stands as a structural statement). This is a tabulation over
      pre-existing toy parameter sets and costs minutes.
      STAGE 1 (minutes): build one toy class, h(O) in [20, 200], p at 16-24
      bits, N prime, cofactor small. Fix the gauge.
      STAGE 2 (minutes, HARD GATE): measure c on all edges; run the cocycle
      identity self-test and the loop calibration of STEP 3. Both must be exact.
      STAGE 3 (minutes): the holonomy measurement of STEP 4 with a reported
      detection floor.
      STAGE 4 (minutes): gamma and its homomorphism defect, against the null and
      the planted control.
      Total: order one CPU-hour. No new infrastructure beyond small-prime
      isogeny walking and a toy DLP solver, both of which any L1/L2 pipeline
      already needs.
    controls:
      - >-
        NULL OBJECT (matched, mandatory): the RANDOMISED COCYCLE -- assign each
        edge an independent uniform multiplier in (Z/N)^*/{+-1} and run the
        identical pipeline. Predicted: the cocycle identity FAILS immediately
        and the loop calibration FAILS, which is exactly how the instrument
        proves it can see a real cocycle at all. If the randomised null passes
        the identity test, the test is vacuous.
      - >-
        SECOND NULL (for the gamma measurement): a synthetic torsor of the same
        order h with gamma drawn uniformly at random. The measured homomorphism
        defect on real data must be statistically indistinguishable from this
        null, and the comparison is what turns "expected zero" into "measured
        zero with a floor".
      - >-
        PLANTED SIGNAL (two-directional control, mandatory): construct a
        synthetic torsor with a genuine character chi : Cl -> (Z/N)^* baked in,
        and require the pipeline to DETECT it. A pipeline that reports "no
        structure" on the planted character is blind and the run set is INVALID
        rather than negative.
      - >-
        NEARBY-OBJECT CONTROL: the ell-torsion-valued cocycle for one small
        ell != N, where the instrument must report NON-gauge behaviour. This
        separates "the instrument sees nothing" from "there is nothing to see".
    required_metrics:
      - cocycle identity violation count
      - loop calibration agreement rate
      - holonomy total-variation distance with detection floor
      - gamma homomorphism defect, real versus null versus planted
      - ell-torsion nearby-object verdict
      - per-instance h(O), N, gcd(h(O), N-1), cofactor, gauge convention hash

  controls:
    - >-
      NULL OBJECT: the randomised cocycle and the random-gamma torsor, as above.
    - >-
      DECAY PARAMETER: h(O). As h(O) decreases to 1 every class-dependent
      quantity must decay to triviality, because there is only one class. A
      measured "class signal" that does not decay as h -> 1 is the canonical
      artifact tell and indicates the instrument is reading the gauge.
    - >-
      GAUGE RESHUFFLE CONTROL: rerun the whole pipeline with a different random
      gauge. Every gauge-invariant metric (loop values, holonomy distribution,
      gamma computed from reduced forms) must be unchanged; every
      gauge-dependent metric must change. A metric that is stable under gauge
      reshuffle but should not be is mis-implemented.

  confounders:
    - >-
      SIGN AMBIGUITY. Aut(E) = {+-1} for j != 0, 1728, so multipliers are only
      defined up to sign and every statistic must be computed in the quotient.
      Instances with j = 0 or 1728 have larger automorphism groups, change the
      quotient, and must be reported separately, never pooled.
    - >-
      DLP COST INSIDE THE INSTRUMENT. Reading a multiplier requires solving a
      discrete logarithm in G. At toy scale that is free; the instrument is
      therefore NOT a candidate attack component and must never be described as
      one. The record's cost accounting says so explicitly.
    - >-
      VOLCANO LEVEL. Curves at different levels have different O and different
      h(O); the cocycle is defined per level. Mixing levels produces spurious
      structure.
    - >-
      SMALL N. For N below a few thousand, (Z/N)^*/{+-1} is small and
      equidistribution tests have little power; the detection floor must be
      reported as a function of N and the sample size, and classes with N too
      small excluded.

  falsification_conditions:
    - >-
      The loop calibration disagrees with the independently computed
      lambda_alpha on any loop. Implementation error; halt and debug. Both
      sides are elementary, so this is never reported as mathematics.
    - >-
      The holonomy distribution is materially non-uniform over paths realising a
      fixed class. The holonomy lemma is false as measured, the cohomology class
      may be nontrivial, and the candidate reduction of (C) is ALIVE. This is
      the record's primary positive falsifier and it is checkable in minutes.
    - >-
      gamma exhibits homomorphism defect significantly below chance on some
      subgroup of Cl(O). A canonical-gauge bridge exists; escalate under the
      standing constraint rather than state a number.
    - >-
      The planted-character control is not detected. Instrument blind; run set
      INVALID rather than negative.
    - >-
      The randomised-cocycle null PASSES the cocycle identity test. The test is
      vacuous and every conclusion drawn from it is void.

  interpretation_limits:
    - >-
      NOT AN ATTACK AND NOT AN ATTACK COMPONENT. The instrument itself calls a
      DLP solver, so it is strictly more expensive than the problem it studies.
      Nothing here is a candidate speedup.
    - >-
      The closure in (D) is scoped to cocycles valued in the multiplier group
      (Z/N)^*/{+-1}. It says nothing about cocycles valued in ell-torsion
      structure for ell != N, which is named as the residual class and handed to
      IDEA-20260811-45676a.
    - >-
      Toy scale only for every measured quantity (p up to about 24 bits, h(O)
      up to a few hundred). The holonomy lemma is symbolic and scale-free; its
      empirical confirmation is not, and the two must not be conflated.
    - >-
      A confirmed null here is a SCOPED NEGATIVE that patches a specific gap in
      IDEA-20260807-0fafe8. It is not evidence about any other lane and it does
      not revisit KN-FIND-b7e091.

  assumptions:
    - >-
      E ordinary over F_p with End_{F_p}(E) = O, N prime with N || #E(F_p), and
      all edge degrees coprime to N. Checked per instance.
    - >-
      Aut(E) = {+-1} for the curves in the class, i.e. j != 0, 1728; instances
      violating this are reported separately.
    - >-
      '[recall-confident] The ideal-subgroup correspondence and the fact that
      the ell-isogeny graph of an ordinary class at the crater is a Cayley graph
      of Cl(O) (Kohel; Fouquet-Morain; Sutherland). NOT re-verified this
      session.'
    - >-
      '[fact, elementary] An isogeny of degree coprime to N restricts to an
      isomorphism between the order-N subgroups, hence is a scalar relative to
      gauges. This is the same elementary fact H-ENDO-001 uses.'

  heuristic_assumptions:
    - id: HA-1
      statement: >-
        For a fixed class [a] in Cl(O) and a fixed base curve, the multiplier
        c(a', i) obtained by sampling representative ideals a' in [a] as
        products of the small split primes with exponent vectors drawn from a
        box of side B behaves like a uniformly random element of
        (Z/N)^*/{+-1}, uniformly for (2B+1)^r >> N.
      rigorous_support: >-
        Pairs the rigorous surjectivity of O -> O/n = Z/N (the holonomy lemma,
        which is exact) with the classical equidistribution statement it
        imitates: the values of a fixed surjective ring homomorphism on a
        growing box of a lattice equidistribute in the target, the same shape
        of statement as Weyl equidistribution for linear forms. The rigorous
        half guarantees the image is everything; the heuristic half is only
        about the RATE.
      validation_plan: >-
        Toy scale, and it is the measurement in STAGE 3: sample 10^5 exponent
        vectors per class over a ladder of p at 16-24 bits with h(O) in
        [20, 200], tabulate the empirical multiplier distribution, and compare
        against uniform by total-variation distance and a chi-squared test with
        the detection floor reported. Record the box side B, the small-prime
        set, and the sample sizes. TRANSFER TO CRYPTO SCALE IS NOT CLAIMED --
        at crypto scale the walk lengths and the DLP cost both make the
        measurement infeasible, and that is stated rather than extrapolated
        around.
      tail_checks: >-
        Check the most and least frequent multiplier values against the
        binomial extremes predicted for the sample size; a single multiplier
        value appearing with frequency far above the extreme quantile indicates
        a structured (non-uniform) holonomy and triggers the positive branch.
    - id: HA-2
      statement: >-
        For the gamma measurement only: the multiplier of the REDUCED
        representative of a random class behaves like an independent uniform
        draw from (Z/N)^*/{+-1}, independently across classes.
      rigorous_support: >-
        Imitates the standard assumption that a canonical representative's
        arithmetic invariants are unstructured with respect to an unrelated
        modulus, the same shape as "this integer behaves like a random integer
        of its size". It is genuinely heuristic and is the record's SIGNAL
        BRANCH: HA-2 failing is the interesting outcome, not a nuisance.
      validation_plan: >-
        Compute gamma over the entire class for at least 20 toy classes with
        h(O) in [50, 200], and test independence and uniformity against the
        random-gamma null with matched h and N. Report the p-values and the
        detection floor. Sampled parameters recorded per class.
      tail_checks: >-
        Test the homomorphism-defect statistic in both tails: significantly
        above chance means noise, significantly below chance means structure.
        Only the below-chance tail is escalated.

  reachability_gate: >-
    T5 STATUS: the proposal passes trivially and never needs to reach a
    specified curve. Its walks are the walker's own choices and all endpoints
    are known by construction; indeed the record's finding is precisely that
    knowing the path is what makes the observed scalar worthless. Reaching a
    SPECIFIED curve is never required, so T5 is not the binding constraint;
    full holonomy binds earlier and more cheaply.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE MOVES. The instrument costs one
      isogeny evaluation plus one toy DLP per edge, i.e. it is strictly MORE
      expensive than the problem it studies and is not an attack component.
      The candidate reduction it tests and kills would, had it existed, have
      reduced Cl(O)-vectorization from about h^{1/2} = p^{1/4} to a
      subexponential DL in F_N^* -- worth recording precisely because that is a
      real prize on the vectorization side, though not on the ECDLP side.
    memory_exponent: >-
      O(h) to store the class and the cocycle, i.e. p^{1/2+o(1)} at toy scale
      by choice; O(1) per edge measurement.
    best_known: >-
      For ECDLP: parallel rho at 0.886*sqrt(N) with O(1) memory (KN-TECH-001,
      KN-TECH-006). For ordinary vectorization: about h^{1/2} = p^{1/4} time
      and memory [recall-confident, see IDEA-20260811-40c0b5 assumption A3].
      Neither is changed by this record.
    hidden_overhead: >-
      Nothing hides in an o(1) because no asymptotic algorithm is proposed. What
      DOES hide, and is disclosed: the instrument's per-edge DLP call, which is
      free at toy scale and would be the dominant cost anywhere else, and the
      class enumeration, which is p^{1/2+o(1)}.
    tradeoff_note: >-
      Not applicable -- no algorithm is produced. Recorded for completeness:
      the vectorization problem this record's candidate reduction targeted sits
      on the van Oorschot-Wiener curve at sqrt(h^3/w) with memory w, so a
      subexponential bridge would have been a genuine improvement there. It
      does not exist, per (D).

  sota_delta: >-
    Zero against every attack baseline: 0.886*sqrt(N) before and after. The
    delta is a patched hole: IDEA-20260807-0fafe8's closure is stated for Z/N
    and does not reach the multiplicative bridge into (Z/N)^*, where its
    coprimality argument has no force; this record supplies the missing
    argument (full holonomy) and turns the lane's expected zero into a measured
    zero with a stated detection floor.
  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES against every frontier row this
    campaign recognises: parallel rho with distinguished points (0.886*sqrt(N),
    O(1) memory, KN-TECH-001/006); automorphism-discounted rho (KN-TECH-018);
    BSGS (sqrt(N) time and memory, KN-TECH-031); kangaroo on an interval of
    width W (about 2*sqrt(W)); van Oorschot-Wiener (sqrt(N^3/w), memory w). As
    an attack this record is dominated by all of them -- it is not an attack and
    its instrument internally calls a DLP solver, so it is strictly dominated by
    that solver. As an INSTRUMENT it is dominated by nothing in this repository,
    because no code here measures an isogeny-induced multiplier at all.
    dominated_by is NOT null.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.97 that the cocycle identity and the loop calibration verify exactly --
    both are elementary and the only risk is a sign or gauge convention error.
    0.90 that the holonomy measurement reports full holonomy within the stated
    floor. 0.85 that gamma is indistinguishable from the random-gamma null.
    0.60 that gcd(h(O), N-1) > 1 occurs often enough at toy scale to make the
    "hole in 0fafe8" observation quantitatively as well as logically real.
    Below 0.03 that either positive branch (structured holonomy, or gamma more
    homomorphic than chance) fires -- and those are the branches worth the hour.

  p2_p3_flags: >-
    P2: NOT ADJACENT. No factor base of any kind appears; H-STR-002 and
    DEFER-BATCH009-001 are untouched.
    P3: NOT TRIGGERING, but the falsification conditions include two positive
    branches whose realisation would bear on attack cost. Per the standing
    constraint, if either fires in execution the session must stop, flag, and
