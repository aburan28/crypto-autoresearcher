idea:
  id: IDEA-20260905-e6e2e5
  title: Corrected top-rank and nonzero-survival conditions for the binary-digit first-fall law
  class: mechanism
  status: proposed
  added: '2026-09-05'
  proposed_at: '2026-09-05'
  proposed_by: idea-generator
  question_id: RQ-PFDR-ae2fba
  task_id: TASK-20260905-5a2208
  batch_id: BATCH-ae9150
  claim: >-
    For the m=2,d=2 prime-field binary-digit presentation with s>=2 and 2^s<=p,
    a verified first-fall law d_ff=4+floor(s/2) requires both the asserted
    top-map rank boundary and at least one nonzero lower-degree image there.
    Counting annihilators alone does not certify the companion fall dimension.
  mechanism: >-
    In B=F_p[a]/(a_i^2-a_i), let U_D map exact-degree D-4 squarefree
    multiplier coefficients to the full reduced product with the degree-four
    generator. Let T_D be its degree-D projection, identified with the top
    multiplication in A=F_p[a]/(a_i^2). The fall space is U_D(ker T_D),
    with dimension rank(U_D)-rank(T_D), so top annihilators that also lie in
    ker U_D contribute no nonzero fall. Track the two kernels separately.
    A proposed theorem must state the characteristic and surviving-row conditions.
  novelty_status: unverified
  citations:
    - ref: H-PFDR-4148b8
      provenance: internal
      claim: The predecessor states the m=2 degree law and a companion fall-dimension prediction.
      verified_by: codex-root/2026-09-05
    - ref: IDEA-20260903-e1e38b
      provenance: internal
      claim: The existing proposal motivates the binary-digit first-fall law.
      verified_by: codex-root/2026-09-05
    - ref: experiments/EXP-PFDR-5726af/analysis.md
      provenance: internal
      claim: >-
        The existing analysis records the finite first-fall pattern and a
        curve-free block-structure control; this is not a general rank proof.
      verified_by: codex-root/2026-09-05
    - ref: https://arxiv.org/pdf/1906.05594
      provenance: retrieved
      claim: Theorem 3.2 is a binary Weil-descent bound, not a theorem for this prime-digit law.
      verified_by: codex-root/2026-09-05
    - ref: Wilson rank theorem
      provenance: recalled
      claim: Named retrieval and applicability-check obligation only; no theorem statement is relied on.
      verified_by: null
  assumptions:
    - The reduced generator actually has degree four and all chosen digit weights satisfy the frozen convention.
    - The elliptic curve is nonsingular; target admissibility is recorded for each claimed domain.
    - Characteristic hypotheses of any external rank theorem are checked explicitly.
    - Layer first fall is not identified with iterated-closure last fall without proof.
  proof_search_map:
    bottleneck: Separate the onset of a top-form kernel from survival of a nonzero lower-degree consequence.
    baseline_embedding:
      parameter_slice: Existing m=2,d=2 binary-digit systems and s=2 candidate fixtures.
      reproduction_check: >-
        Reconstruct the generator and both maps from frozen definitions, then
        reproduce the finite baseline with exact finite-field certificates.
        No untracked local review or verifier is adopted as authority.
    observation_collision:
      observable: Equal top-map kernel dimension but different full-product kernel dimension.
      distinct_preimage_search: >-
        Hold the leading quartic fixed while varying admissible lower terms;
        test whether equal annihilator onset yields different surviving dimensions.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: Paired kernel certificates for T_D and U_D and a basis of U_D(ker T_D).
        predicted_gain: Distinguish rank onset from actual nonzero first fall and dimension.
      - transform: specialization_pack
        proposed_object: Exceptional characteristic, lower-term and target-domain conditions.
        predicted_gain: Replace a universal dimension assertion by a precisely scoped conditional statement.
    quantifier_order: >-
      For every admissible (p,s,curve,x_R) satisfying separately stated rank
      and survival hypotheses, predict the stated degree. All-affine x_R and
      x_R of an F_p-rational curve point are separate domains. Generic or
      high-probability survival does not imply universal survival.
    method_ceiling:
      strongest_certifiable_claim: Exact finite map ranks and a conditional theorem whose dependencies are proved.
      nearby_object_control: >-
        Keep the leading form while removing or altering lower terms; a top
        kernel can then fail to support the same nonzero fall dimension.
    proof_obligations:
      - claim: Prove the degree-D projection identity and the rank-difference formula.
        responsibility: correctness
      - claim: Retrieve and verify the exact top-map rank theorem, including characteristic restrictions.
        responsibility: baseline
      - claim: Prove or delimit nonzero survival and independence of surviving rows.
        responsibility: strictness
      - claim: Verify curve and target admissibility independently for every fixture.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: conditional_first_fall_degree
      direction: different
      minimum_effect: d_ff=4+floor(s/2) only for instances satisfying the proved rank and survival conditions.
    - metric: candidate_fall_dimension
      direction: lower
      minimum_effect: >-
        Replication leads predict dimension 3 rather than predecessor value 4
        at the two supplied s=2 candidates; these values are unverified here.
    - metric: top_kernel_vs_surviving_dimension
      direction: different
      minimum_effect: Record any positive difference, with exact kernel and image certificates.
  minimal_test:
    design: >-
      Independently reconstruct the two candidate fixtures (p,a,b,x_R)=(13,12,3,11)
      and (19,2,15,9), m=2,s=2; check admissibility before interpretation.
      Then inspect a bounded s=2..4 panel under the same retained implementation.
    controls:
      - Curve-free control with the same leading block structure and a fully specified lower-term rule.
      - Leading-form-only control to expose annihilators with no qualifying surviving consequence.
      - Independent exact linear-algebra certificate checker using a separately derived map.
      - Boundary exhaustion at s=2 labelled as an instrument control, not strict early-fall evidence.
      - Rational-target checks separated from the all-affine domain; candidate p=19 is not presumed admissible.
    required_metrics:
      - rank(U_D), rank(T_D), kernel dimensions and nonzero fall-space basis by degree.
      - Exact generator, characteristic, digit weights, curve discriminant and target-domain certificate.
      - First certified positive layer and certificates for every earlier layer.
  falsification_conditions:
    - An admissible instance satisfying all proved conditions has a different first-fall degree.
    - A claimed fall basis includes zero or linearly dependent surviving rows.
    - A cited rank theorem does not apply in the stated characteristic or presentation.
  confounders:
    - Degenerate degree, characteristic or digit map, and inadmissible rational targets.
    - Confusing top annihilators with independent nonzero lower-degree rows.
    - Reusing local untracked corrections as if they were archived evidence.
  interpretation_limits:
    - A finite failure of fall_dim does not itself refute the first-fall degree formula.
    - The two candidate outcomes remain replication predictions until independently certified and archived.
    - A conditional or generic survival result is not a universal theorem.
    - No claim of ECDLP hardness, key recovery or asymptotic attack improvement is made.
  heuristic_assumptions:
    - id: H1
      statement: Top-map rank has the proposed onset only under explicit verified theorem hypotheses.
      rigorous_support: External theorem retrieval and a presentation-specific derivation are outstanding.
      validation_plan: Exact ranks on boundary characteristics and a proof of all transfer conditions.
    - id: H2
      statement: At the predicted boundary U_D(ker T_D) is nonzero on the claimed admissible domain.
      rigorous_support: Unproved survival obligation; no random-model justification is presently asserted.
      validation_plan: Search fixed-leading-form specializations, certify exceptions, and restrict the claim if needed.
  target_complexity:
    time_exponent: No attack improvement claimed; exponent delta +0.
    memory_exponent: No attack improvement claimed; exponent delta +0.
    best_known: No attack comparison is asserted; query exponent delta +0.
    hidden_overhead: Exact ranks and certificate storage may grow exponentially with the number of digits.
    tradeoff_note: Matrix compression requires verified rank preservation and charged preprocessing.
  dominated_by: n/a (no result claimed; frontier audit incomplete)
  sota_delta: No attack; conceptual/measurement contribution only; time/memory/query exponent delta +0.
  estimated_cost:
    implementation: medium
    compute: low
    proposed_bound: Future pilot at most 24 systems, 2 hours total, 8 GiB; no execution in this batch.
  recommended_priority: high
  priority_order: 2
