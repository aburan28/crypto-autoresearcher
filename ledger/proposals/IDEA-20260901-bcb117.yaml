      transposition point, the joint-distribution test and the variance audit all appear
      unowned.

  assumptions:
    - >-
      [fact, committed] The two dose endpoints - probability 1.0 per trial at dose 0
      (BATCH-b41ba9, deterministic over seeds) and ~51-59 hits at 2^32 for uniform random
      bijections (BATCH-713991, null 4.0, band [0,12]); the r=2/r=5/r=6/r=10 decay endpoints.
    - >-
      [dependency] The skeleton prediction for the anisotropy test comes from
      IDEA-20260901-ec54fe's census; if the census has not landed when this record runs, C2
      falls back to the COMMITTED anchor facts (W=3, diagonals {1,2,3} vanishing at dose 0 -
      the ranks 32,0,0,0 reading) as its skeleton target and says so.
    - >-
      [implementation, to be confirmed by code read] The table-driven probe accepts per-position
      S-box tables and reports per-trial vanishing sets; a receipt format lacking per-trial
      sets makes the joint-distribution arm a new run (confounders).
    - >-
      [scope] Toy tier; r=5 (r=3,4 for the decay audit); bijective tables only - non-bijective
      doses are foreclosed by the probe's decrypt leg (invertibility), which is a construction
      boundary, not a choice; no full-round or deployed-AES claim.

  predictions:

  predictions:
    - id: PR-1
      metric: >-
        D4 zero-dose control - affine-non-identity S-box at r=5, 2^30, fresh implementation
      direction: different
      minimum_effect: >-
        W=3 on 100% of nontrivial trials, excess ratio 1.0 against the frozen excess_E,
        exactly as the anchor. BLOCKING: failure is F1 (the ramp measures table values, not
        nonlinearity; every dose reading confounded; void).
    - id: PR-2
