        happens, not an instrument fault, provided the in-block decay controls pass).

  minimal_test: >-
    CHEAPEST DISCRIMINATING SUBSET (one producer slot): D4 (blocking control, 2^30, minutes),
    D3 transposition (2^32, ~255 s), position-dilution k=1 (2^32). These three arms already
    separate STEP from GRADUAL at the k=1 point and validate the ramp's zero. FULL DESIGN (four
    producer slots): add the remaining ramp arms (one slot), the joint-distribution run at 2^33
    or reuse of archived 2^32 hit trials if the raw receipts retain per-trial vanishing sets
    (one slot, possibly zero new compute - the executor must verify what the archived receipts
    contain BEFORE promising reuse, and if they do not retain the per-trial sets, the run is
    new), the four-key variance audit plus r=3/r=4 ramp (two slots).
  preregistered_decision_rule: >-
    Committed before any ramp arm: (STEP) k=1 and D3 both within the Poisson band of the
    committed random-bijection level -> record "globally fragile skeleton; residual is a
    class property of bijective nonlinear S-boxes" at toy tier, and EV-AES-048545's claim
    boundary sharpens to "independence across ALL TESTED bijections including minimal
    nonlinearity"; (GRADUAL) monotone with k=1 significantly above the band -> record the ramp
    shape and name the highest-sensitivity positions for 69912d; (OTHER) -> record the shape,
    name the successor object, no mechanism conclusion. C2 reading recorded independently of
    C1's. C3 recorded independently of both. Any two readings that conflict (e.g. STEP but
    ISOTROPIC residual) are reported as a live contradiction with both arms cited, never
    merged. Budget halts are resource_exhaustion.

  test_boundary: >-
    Toy tier; r=5 for the ramp (r=3,4 for the decay audit only); the frozen dose family (one
    parameter plus three named points), not the space of all S-boxes; one probe cell; the
    modified ciphers actually run, never AES beyond its own seat. The STEP reading licenses
    "all tested bijections including minimal nonlinearity", NEVER "any S-box" - non-bijective
    tables are outside the probe's domain (the decrypt leg requires invertibility) and the
    record says so rather than extrapolating. NOTHING about full-round or deployed AES; no
    published-frontier comparison in either direction.

  falsification_conditions:
    - >-
      F1 (BLOCKING). D4 (affine-non-identity) fails to reproduce the anchor law exactly. The
      ramp is confounded (it measures table values, not nonlinearity); every dose reading void;
      invalid_measurement; repair before any reading. This is also a falsification of the
      affine census alignment (cross-filed to IDEA-20260901-ec54fe F1).
    - >-
      F2 (THE MAIN MECHANISM FALSIFIER OF THE SKELETON-RIDING READING). C2 returns ISOTROPIC:
      the residual's hits are uniform over vanishing sets conditional on W>=1 while the
      skeleton's predicted set carries no concentration. Then the residual does NOT ride on the
      skeleton; the exact affine law and the nonlinear excess are separate phenomena; the
      mechanism question reopens with a named split. This is a complete result and the record's
      most valuable negative.
    - >-
      F3 (TRANPOSITION FALSIFIER OF "NONLINEARITY PER SE"). D3 reads at the NULL while the k=1
      position-dilution reads SIGNAL. Then a single transposition - bijective, minimally
      nonlinear - does not produce the residual, and the relevant S-box property is neither
      "bijective" nor "nonlinear" alone; the successor object (a quantitative differential or
      linear property) is named by the pair of arms. Recorded as a finding.
    - >-
      F4 (RAMP INCOHERENCE). The ramp is flat across k=0..16 - identity and random-bijection
      arms read alike in-block. This contradicts the committed endpoints (probability 1 at k=0;
      ~59 at k=16, both validated by other batches), so it indicts THIS record's instrument,
      not the committed measurements; void; repair.
    - >-
      F5 (OVERDISPERSED). C3 returns OVERDISPERSED. Not a defect - a finding: the residual's
      magnitude is key-sensitive beyond Poisson; every mechanism account (including this
      record's) must carry a key-dependence clause, and IDEA-20260901-69912d M7 becomes the
      attributed follow-on.
    - >-
      NOT A FALSIFICATION - budget halts (rule 5); archived-receipt reuse failing (a new run is
      dispatched, not a null reading); a non-monotone decay ramp recorded as measured.

  controls:
    - >-
      NULL OBJECT - the standing ideal-permutation null seat at each block's exposure; the r=6
      AES seat re-measured in-block as the KNOWN-DEAD decay endpoint (the probe must not show
      excess there; BATCH-002 A2's reading is the commitment).
    - >-
      KNOWN-FALSE CONTROL (proves-too-much) - the structure-destroyed amask=15 seat re-measured
      in-block (committed reading 1.00x / 4 at 2^32); and D4 run as a KNOWN-SIGNAL object (the
      ramp's positive control: an instrument that cannot separate dose 0 from dose 16 measures
      nothing, so D4 and D5 are the ramp's blocking pair).
    - >-
      POSITIVE CONTROL PAIR - D4 (probability 1) and D5 (committed band) in the same block, so
      the ramp's two endpoints are verified in the same instrument before interior points are
      read.
    - >-
      DECAY PARAMETER - the round-count ramp r=2..6 with the committed endpoints re-seated; the
      dose ramp k=0..16 with both endpoints in-block. Both parameters are the canonical
      artifact-tell parameters, pre-registered with their readings.
    - >-
      SIBLING NULL FOR THE DOSE KNOB - the value-dilution family (D2) beside the
      position-dilution family (D1): two constructions at the same nominal dose; a reading that
      separates them at matched k means "dose" as labelled is not the operative variable and the
      label is reported as not isolating (V-804-1 discipline applied prospectively).
    - >-
      PRE-REGISTRATION AS COMMITTED DIGEST - all tables, bins and tests committed before the
      first ramp arm (V-804-2).

  confounders:
    - >-
      DOSE-LABEL NON-UNIVERSALITY - position dilution and value dilution at the same k are
      different interventions; the sibling-null control above exists exactly because the label
      "dose k" may not isolate. Readings are always reported per construction, never pooled
      across families.
    - >-
      THE TRANSPOSITION'S POSITION - a transposition affecting values that the r=5 trial stream
      rarely visits acts like dose 0; the pre-registered transposition is therefore specified
      as a swap of two PRE-REGISTERED values (0x00 and 0x53, stated so it cannot be moved after
      seeing access frequencies), and the arm reports the empirical visit count of the swapped
      values as a required metric.
    - >-
      ARCHIVED-RECEIPT REUSE - the joint-distribution arm may reuse committed 2^32 runs ONLY if
      the raw receipts retain per-trial vanishing sets; the executor verifies this before
      claiming reuse, and a receipt that retains only histograms is a new run, never a
      re-analysis (re-binning committed summaries post-hoc is the V-804-2 failure in a new
      costume).
    - >-
      KEY VARIANCE VS SEED VARIANCE - the four-key audit changes keys, which changes the entire
      trial stream under the campaign's seeding scheme; the overdispersion test is against the
      Poisson variance at the measured mean, which absorbs stream differences; any reading is
      reported with all four counts, never as a pooled figure (the BATCH-009 pooled-statistic
      withdrawal is the standing warning).
    - >-
      SHARED-HARNESS BUGS CONDITIONAL ON THE S-BOX TABLE CODE PATH - all ramp arms share the
      table-driven path; at least the D4/D5 blocking pair should run on a fresh implementation,
      and the cross-lineage battery (IDEA-20260901-02f7c4 B3) is the named programme-level
      mitigation.

  interpretation_limits:
    - >-
      claim_tier toy. The ramp is a statement about the frozen dose family on the pinned r=5
      probe; "all tested bijections including minimal nonlinearity" is the strongest sentence
      STEP licenses, and "any S-box" remains unestablished (non-bijective tables are outside
      the probe's domain by invertibility).
    - >-
      A STEP reading does NOT explain the residual's MAGNITUDE (~15x rather than some other
      multiple of the null) - it establishes the fragility of the skeleton and the class
      property; the magnitude question (why ~15) passes to the geometric-null derivation of
      IDEA-20260808-bfee7e if that record is ever executed, and this record says so rather
      than absorbing the question.
    - >-
      NOTHING about full-round or deployed AES; no published-frontier comparison in either
      direction; the differential-spectrum remark about random bijections is recalled, unverified,
      and used as neither authority nor comparison.
    - >-
      Timeouts, crashes and infrastructure failures are never negative mathematical evidence
      (rule 5).

  heuristic_assumptions:
    - id: H1
      statement: >-
        GLOBAL FRAGILITY (the STEP hypothesis). For the pinned r=5 probe, ANY S-box layer that
        differs from an affine map on at least one byte position suppresses the per-trial hit
        probability from 1.0 to within a constant factor of the committed random-bijection
        level (~15x the null), uniformly in which position and how many.
      rigorous_support: >-
        RIGOROUS PART - at dose 0 the probability is exactly 1.0 (committed anchor; D4 extends
        it to all affine tables by coordinate-change invariance of the affine law - a one-line
        derivation stated as such). WHAT IS HEURISTIC is the uniformity of the collapse: no
        committed datum measures a positive dose. DISTRIBUTION IMITATED - none; the ramp is the
        validation and the assumption is stated so the STEP branch is recognized as the
        assumption winning, not as a neutral outcome.
      validation_plan: >-
        The ramp itself: k=1 (both families), D3, and the endpoint pair, at 2^32 with the
        pre-registered binning.
      falsification_condition: >-
        GRADUAL or OTHER shapes (C1), or F3 (transposition at null while k=1 signals).
    - id: H2
      statement: >-
        SKELETON-RIDING OF THE RESIDUAL. Conditional on a hit at r=5 under a nonlinear bijective
        S-box, the vanishing-diagonal set is concentrated on the census-predicted set with
        probability bounded away from the isotropic 1/4-per-diagonal baseline by a factor >= 3.
      rigorous_support: >-
        RIGOROUS PART - the census prediction is exact in the affine limit (ec54fe P1) and the
        r=2 control shows one round of real nonlinearity preserves the exact set (W=3 on 100%
        of nontrivial trials, BATCH-002 PR-1). WHAT IS HEURISTIC is the survival of the
        concentration under four more rounds of nonlinearity.
      validation_plan: >-
        The joint (W, vanishing-set) measurement at 2^32/2^33 with the exact multinomial test
        (C2).
      falsification_condition: >-
        F2 (ISOTROPIC) or ANISOTROPIC-OFF-SKELETON (concentration on a different set, which is
        a redirect, not a defect).

  obstruction:
    quantity: >-
      Per-trial hit probability P(W>=1) at r=5 as a function of nonlinearity dose d (0 = affine,
      16 = fully random bijective), at fixed geometry.
    measured_value: >-
      Two points only - d=0: 1.0 exactly (BATCH-b41ba9, ratio 1.0000000000002, deterministic
      over seeds); d=16 (uniform random bijection): 58 and 51 hits at 2^32 (excess factors
      14.50x and 12.75x against null 4.0; Garwood CIs per BATCH-713991), AES reference 59.
      The open interval spans roughly nine orders of magnitude in per-trial probability
      (1.0 to ~1.4e-8) with ZERO measured interior points. Units: per-trial probability /
      hits at frozen exposure; error bars: exact at d=0, Poisson/Garwood at d=16.
    runs_read_from: >-
      BATCH-b41ba9 (TASK-20260806-47f217), BATCH-713991 RANK 3 (TASK-20260804-f5e58b),
      BATCH-002 A1.
    scope_claimed: >-
      Toy tier, one probe cell, r=5, bijective tables only (the probe's decrypt leg requires
      invertibility, which forecloses non-bijective doses by construction, not by choice).
    resource_check:
      examined: true
      reading: >-
        The same fragility that would wreck a skeleton-sufficiency account (if STEP wins, the
        exact law is destroyed by one byte of nonlinearity - an obstruction to reading the
        affine census as an account of the AES measurement) is the asset of this record: the
        collapse IS the dose-response curve, and its shape is a tunable instrument. Conversely,
        a GRADUAL reading - an obstruction to the class-property reading - is an asset for
        IDEA-20260901-69912d, because a graded knob localizes by sensitivity. Both readings of
        the same number are named in advance.

