        quantitative - a transposition's near-identity differential table does not suppress the
        skeleton fully; the successor object is then named: whatever differential/linear
        quantity separates a transposition from a random bijection).
    - id: PR-4
      metric: >-
        Joint (W, vanishing-diagonal-set) distribution at r=5 for AES and one random bijection,
