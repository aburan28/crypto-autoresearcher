idea:
  id: IDEA-20260901-bcb117
  question_id: RQ-AES-003
  goal_id: GOAL-AES-003
  added: '2026-09-01'
  proposed_by: idea-generator
  status: proposed
  class: mechanism

  title: >-
    THE QUEUED DISCRIMINATOR RAN AND LEFT A NINE-ORDER GAP UNMEASURED - the identity S-box gives
    per-trial hit probability 1.0 (BATCH-b41ba9) and a uniform random bijection gives ~15x the
    null (~1.4e-8 per trial); between them lies the entire dose-response of the excess to
    nonlinearity, and no committed arm interpolates. Run the dilution ramp (k of 16 byte
    positions nonlinear, k in {1,2,4,8,16}; plus a single-transposition S-box as the minimal
    nonlinearity point; plus an affine-non-identity S-box as the exact zero-dose control), and
    decompose the residual's hit cells (which diagonals vanish, with which W) against the
    skeleton prediction of IDEA-20260901-ec54fe. This record SUPERSEDES the identity/affine
    discriminator queued by DEC-20260804-73977c D-5 and executed by BATCH-b41ba9: that arm
    decided "no nonlinearity required"; this one decides what nonlinearity DOES, and where the
    residual lives.

  object: >-
    TRACKED OBJECT - THE NONLINEARITY DOSE-RESPONSE OF THE r=5 YOYO EXCESS. A dose d is a
    controlled departure of the S-box layer from linearity, holding the round geometry fixed:
      D1 (position dilution) - k of the 16 byte positions use a pre-registered uniform random
      bijective table, the remaining 16-k use the identity; k in {1, 2, 4, 8, 16};
      D2 (value dilution) - the single identity table with k of its 256 entries re-pointed so
      the result is still a bijection (a pre-registered random transposition product of length
      k), k in {1, 2, 16};
      D3 (minimal nonlinearity) - one transposition (two values swapped): a bijective S-box at
      minimal Hamming distance from the identity, whose differential table differs from the
      identity's in exactly the rows touching the swapped pair;
      D4 (zero-dose control, exact) - an affine-but-non-identity S-box L(i) xor c with
      pre-registered invertible affine L != id: the cipher stays affine, so the census predicts
      the anchor law exactly (probability 1 per trial) - this is the "affine" half of the
      queued discriminator finally run beyond SBOX = id;
      D5 (the committed endpoint) - a uniform random bijection (seeds 424242201/424242202's
      construction, re-drawn at a fresh pre-registered seed for this record).
    The retained quantity per dose is the frozen-comparator reading at r=5 (hit count, excess
    factor, Garwood CI, full W histogram, and the vanishing-diagonal set per hit) - a curve, not
    a point. SECOND TRACKED OBJECT - the residual's hit-cell decomposition: for each hit trial,
    WHICH of the four forward diagonals PW[j] vanish and what W results, aggregated to the joint
    distribution over (W, vanishing-set), compared against the skeleton prediction (census: at
    the anchor, W=3 with diagonals {1,2,3} vanishing) and against the isotropic alternative
    (uniform over diagonals conditional on W>=1).
    ESTABLISHED FAMILIES OFF-LIMITS AS THE PRIMARY LENS: whole-S-box substitution (done, five
    ways), whole-cipher substitution (done, five ways); the ramp interpolates where both stop.

  lossy_projection_test: >-
    The projection (S-box layer, key, seed) -> (dose d, frozen-comparator hit profile, joint
    (W, vanishing-set) histogram) discards the S-box's internal structure beyond the dose label
    and the trial stream. Fibres are enormous (all tables at a given dose share one label).
    Genuinely lossy. COMPATIBILITY: under the yoyo trial the dose label does NOT propagate
    exactly - that is the point; the affine limit propagates exactly (D4's prediction) and every
    positive dose is statistical. THE SHARP EDGE: if D3 (one transposition) already reads at the
    committed random-bijection level, then "any bijective nonlinearity, anywhere, in any
    amount" collapses the exact skeleton to the residual - a fragility statement no committed
    record contemplates, and one with a clean falsifier (a dose at which the reading does NOT
    collapse names the threshold instead).

  claim: >-
    Three statements. C1 is the ramp, C2 is the decomposition, C3 is the variance audit.

    (C1) THE DOSE-RESPONSE DECIDES "ANY S-BOX" AT ITS BOUNDARY. EV-AES-048545's claim boundary
    (O-5, D-2): independence established within {AES, uniform random bijection}; "any S-box"
    NOT established; the identity/affine arm was the queued discriminator and has been executed
    (D-6) with a maximal result. The boundary question that remains is exactly the interpolation:
    pre-registered exclusive ramp shapes, with the reading attached to each:
      (STEP) k=1 position-dilution and the single transposition D3 both read at the committed
      random-bijection level (within the Poisson band of ~51-59 at 2^32). Reading: the skeleton
      is GLOBALLY FRAGILE - one byte of nonlinearity anywhere destroys the exact per-trial law
      and lands directly on the residual; the residual magnitude is then a property of
      "bijective nonlinear" as a class, not a graded property of the S-box. This is the reading
      most consistent with random-bijection ~= AES despite their wildly different differential
      spectra (recalled: a uniform random bijection's DDT max entry is far from 4; NOT verified
      here - recorded as a recalled pointer, never as support).
      (GRADUAL) the reading moves monotonically from 1.0 (k=0) toward the residual level with
      k, with k=1 significantly ABOVE the random-bijection band. Reading: nonlinearity dose is
      a tunable knob and the ramp's shape is the next localization instrument - the positions
      whose dilution moves the count most are the positions that carry the exact law (feeds
      IDEA-20260901-69912d's component table).
      (FLAT-THEN-STEP / OTHER) any non-monotone or thresholded shape. Reading: the shape itself
      names the successor object (a threshold in dose is a structural statement about how many
      nonlinear byte maps the skeleton tolerates); recorded as measured, never smoothed.
      D4 (affine-non-identity) is the blocking control of the whole ramp: it must reproduce the
      anchor law EXACTLY (probability 1 per trial), because an affine table is a change of
      coordinates on an affine cipher; if it does not, the ramp is measuring table VALUES rather
      than nonlinearity and every dose reading is confounded (F1).

    (C2) THE RESIDUAL'S HIT CELLS. At r=5, under AES and under one random bijection, the joint
    distribution over (W, vanishing-diagonal set) is measured at 2^32 or 2^33 and compared, by
    a pre-registered exact multinomial test, against two targets: (i) the SKELETON-RIDING
    target - hits concentrated on W=3 with the census-predicted vanishing set ({1,2,3} at the
    anchor cell, whatever the census computes); (ii) the ISOTROPIC target - uniform over
    vanishing sets conditional on W>=1. Exclusive readings: ANISOTROPIC-ON-SKELETON (concentrated
    on the skeleton's set; the residual rides on the skeleton), ANISOTROPIC-OFF-SKELETON
    (concentrated on a DIFFERENT set; the residual has its own geometry, named by the data),
    ISOTROPIC (the residual does not ride on the skeleton's diagonal structure at all - the
    skeleton and the residual are separate phenomena, the most consequential reading for the
    mechanism question). The archived arms already report full W histograms; what has never been
    pre-registered or tested is the JOINT distribution against a skeleton prediction.

    (C3) THE VARIANCE AUDIT. The AES-side excess magnitude varies across seeds (14 vs 19 hits
    at matched 2^30, EV-AES-5478a0 OBS-B16-3) and no committed record attributes it. Measure
    the r=5 AES arm at FOUR keys (two committed seed regimes plus two fresh pre-registered
    keys) at matched 2^30 and apply a pre-registered overdispersion test (variance of the four
    counts against the Poisson variance at their mean): CONSISTENT-WITH-POISSON (the variance
    is sampling noise; any mechanism account may treat the residual's magnitude as
    key-uniform within the Poisson band) or OVERDISPERSED (the magnitude is genuinely
    key-sensitive; every mechanism account must then carry a key-dependence clause, and the
    key-schedule arm M7 of IDEA-20260901-69912d becomes load-bearing). Also: the r=3 and r=4
    AES arms (NEVER MEASURED - the committed ramp has points at r=2 exact, r=5, r=6, r=10 and
    nothing between) at two keys each, to draw the decay ramp 1.0 (r=2) -> ? -> ? -> ~1.4e-8
    (r=5) -> null (r=6) and overlay it on the affine census's r-profile from
    IDEA-20260901-ec54fe.

    (WHAT IS NOT CLAIMED) No statement about full-round or deployed AES; no published-frontier
    comparison in either direction (R3); no claim that the ramp exhausts the S-box space (it is
    a frozen one-parameter family plus three named points); no claim that STEP/GRADUAL exhausts
    the possible shapes (the rule is total over the frozen bins, and any other shape is recorded
    as measured under "OTHER").

  mechanism: >-
    The campaign knows the excess at two S-box extremes: linear (probability 1 per trial, exact,
    key-free) and nonlinear-bijective (~15x, statistical, key-noisy or key-sensitive). The
    suppression from 1.0 to ~1.4e-8 - nine orders of magnitude - is the single largest
    unmeasured interval in the whole mechanism question, and its shape is diagnostic: a STEP
    says the exact skeleton is a measure-zero phenomenon that any nonlinearity destroys, leaving
    a residual that depends only on the CLASS "bijective nonlinear"; a GRADUAL ramp says the
    skeleton tolerates dilution and names which byte positions carry it; the transposition point
    says whether the relevant property is nonlinearity PER SE or something quantitative a
    transposition lacks (its differential table is almost the identity's). The candidate
    mechanism this record pursues is STEP plus SKELETON-RIDING - any nonlinearity collapses the
    exact law, and what survives concentrates on the skeleton's own vanishing cells - because
    that is the reading most consistent with random-bijection ~= AES ~= 59 despite the two
    tables sharing almost no differential structure. But the ramp exists precisely so that this
    reading is a pre-registered branch, not a post-hoc story.

  why_not_a_renamed_known_approach: >-
    Nearest known method - S-box interpolation studies in cipher design (recalled, unverified;
    e.g. the general practice of measuring how structural properties degrade as an S-box is
    perturbed - no specific source named, none reachable) used here as an INTERVENTION FAMILY,
    never as authority. Nearest internal records - BATCH-b41ba9 (the k=0 point, executed),
    BATCH-713991 (the k=16 points, executed), IDEA-20260807-bbefda (the k-profile over ACTIVE
    BYTES at fixed S-box - a different k: bbefda varies how many plaintext bytes are active in
    the difference, this record varies how many S-box byte maps are nonlinear; the two
    coordinates are orthogonal and the records are complementary, stated so a later reader does
    not see a collision), IDEA-20260808-bfee7e (derives the nonlinear expectation for the
    unmutated cipher; does not touch dose). LOSSY-PROJECTION TEST - see the field above; PASSES
    with the exact/statistical transfer boundary at dose 0 stated.

  novelty_status: unverified
  novelty_screen:
