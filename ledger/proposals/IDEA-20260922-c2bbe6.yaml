  citation_note: >-
    The large-prime-variation background (recalled citation above) is a
    well-known classical technique in factoring/NFS; this session did not open
    a primary source for it and states so. The Joux-Vitse attribution for the
    free-leg construction is RECALLED and flagged unverified in
    IDEA-20260922-6cf862, which this record inherits without independently
    checking. IDEA-20260806-9d47e2 was read only at title/one-line-summary
    level from the dedup surface, not in full, this session; its exact claim
    and controls were not re-verified beyond that summary line, and this is
    disclosed rather than presented as a full read.
  assumptions:
    - >-
      |V| is small enough that direct enumeration of a designed subset of
      V^{m-1} (or a full enumeration at small B) is the chosen search strategy,
      rather than SAT/Groebner search over an implicitly-described V; this is
      the regime in which the free-leg construction is a sensible PRIMARY
      strategy at all, and it is disclosed as a real scope restriction, not
      universal to every base construction this lane studies.
    - >-
      Residual points L are approximately uniformly distributed over (a
      subset of) E(F_q) as (m-1)-tuples range over V^{m-1}, so that a birthday
      argument over T attempts governs the expected number of matched pairs;
      this is a heuristic assumption, numbered and validated below, not a
      theorem.
    - >-
      Canonicalisation c(L) correctly identifies +-L (and, where applicable,
      Frobenius conjugates) as the same residual; a canonicalisation bug would
      either miss true matches (undercounting, a conservative failure) or
      falsely match unrelated points (a correctness bug, caught by the
      certificate re-verification in the minimal test).
    - Arithmetic only at deployed parameters. Executable cells are toy binary curves at n <= 41.
    - Uses F2 (factor-base decomposition) as the declared component; explicitly discriminated from F7 (preprocessing table) in the mechanism section.
  proof_search_map:
    bottleneck: >-
      Whether the free byproduct of the (m-1)-fixed construction (the residual
      point L, computed for every attempt regardless of success) can be
      recycled into additional relations at negligible marginal cost, the way
      NFS's large-prime variation recycles near-smooth sieve reports -- and
      whether this lane's own decomposition instruments structurally prevent
      that recycling by never exposing the byproduct as a group element in the
      first place.
    baseline_embedding:
      parameter_slice: >-
        The plain (no recombination) free-leg construction at a fixed toy
        cell: B, m, n as in the minimal test below, with the standard
        heuristic full-relation probability p_full ~ B^m/(m! N) (the balance
        heuristic this lane already uses, e.g. IDEA-20260922-6cf862's
        H-6cf862-1) as the embedded baseline case (large-prime recombination
        OFF).
      reproduction_check: >-
        With recombination disabled, the measured full-relation yield from T
        (m-1)-tuple attempts must reproduce the standard balance-heuristic
        prediction B^{m-1}/((m-1)!) * (fraction of residuals landing in V)
        within the same tolerance this lane's other yield instruments report
        (e.g. IDEA-20260915-3119c9's 10-25% multiset-correction band); a
        disagreement here means the harness, not the recombination mechanism,
        is broken, and nothing downstream is read.
    observation_collision:
      observable: >-
        The number of large-prime-combined (weight-2(m-1)) relations obtained
        per T attempts, and the rank they contribute to the factor-base
        relation matrix.
      distinct_preimage_search: >-
        A measured gain in combined relations could arise from (i) genuine
        birthday-style residual recurrence, the mechanism claimed, or (ii) a
        canonicalisation bug that OVER-matches (treats distinct points as the
        same residual, e.g. by hashing on a truncated coordinate). The
        distinguishing preimage is a CERTIFICATE re-verification: every
        claimed large-prime relation is re-checked by directly summing all
        2(m-1) legs on a freshly constructed curve object and confirming the
        sum is O, exactly as docs/claims-and-verification.md requires for any
        claimed relation; a canonicalisation bug produces relations that FAIL
        this re-check, a genuine mechanism produces relations that PASS it
        100% of the time (this is a hard, zero-tolerance discriminator, not a
        statistical one).
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The (tuple, canonicalised residual) pair as the unit of relation
          collection, replacing the (tuple, success/failure) bit the plain
          free-leg construction reports.
        predicted_gain: >-
          A birthday-style QUADRATIC-in-T supply of additional weight-2(m-1)
          relations (T^2/(2*|residual support|) in the naive uniform model),
          against a LINEAR-in-T supply of full-weight-m relations, so for T
          large enough the large-prime supply dominates -- the classical
          large-prime-variation gain, ported here and priced.
      - transform: observable_fiber
        proposed_object: >-
          The large-prime GRAPH (vertices = canonicalised residuals, hyperedges
          = attempted tuples), whose spanning-tree components are exactly the
          MERGE step (structured Gaussian elimination analogue) this seam asks
          for.
        predicted_gain: >-
          |component| - 1 independent relations per component of size
          |component|, at O(alpha(T)) amortised merge cost per attempt --
          cheap, disclosed, and separate from the dense/sparse linear algebra
          this lane's other RELN records already charge.
    quantifier_order: >-
      FOR EVERY pair of (m-1)-tuples whose canonicalised residuals agree, THERE
      EXISTS a weight-2(m-1) relation among factor-base elements, exhibited by
      direct subtraction and re-verified by summing all legs to O; this is a
      constructive, certificate-bearing existence statement, not a heuristic
      one. The HEURISTIC content is entirely in HOW MANY such pairs occur
      after T attempts, which is the birthday-model prediction validated
      below.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On toy cells with n <= 41 and a chosen V (this lane's existing
        constructions), the free-leg construction's residual points, when
        canonicalised and hash-matched across T attempts, yield
        certificate-verified weight-2(m-1) relations at a rate matching the
        birthday-model prediction to within the sampling tolerance stated in
        the minimal test, at O(alpha(T)) amortised merge cost per attempt."
        It certifies NOTHING about whether the resulting relation supply beats
        matched rho, nothing about solving degree or per-attempt
        SAT/Groebner cost (this construction explicitly AVOIDS the
        SAT/Groebner solve for the regime it applies to), and nothing about
        curves or bases where |V|^{m-1} is too large to enumerate directly.
      nearby_object_control: >-
        TWO, BOTH BLOCKING. (i) NULL RECOMBINATION: recombination disabled
        (plain free-leg construction) must reproduce the standard
        balance-heuristic full-relation yield with no phantom gain from the
        (unused) hash table -- confirms the instrument adds nothing when
        switched off. (ii) ADVERSARIAL CANONICALISATION: a DELIBERATELY BROKEN
        canonicalisation (e.g. hashing only a truncated prefix of L's
        coordinates) must produce relations that FAIL the certificate
        re-verification at a measurable rate, confirming the re-verification
        step actually catches canonicalisation bugs rather than passing
        everything trivially.
    proof_obligations:
      - claim: L = -(P_1+...+P_{m-1}) is computed correctly by m-2 point additions and the negation.
        responsibility: correctness
      - claim: c(L1) = c(L2) implies (up to the recorded sign/orbit correction) L1 = L2 as group elements.
        responsibility: correctness
      - claim: Every combined relation, when re-summed on a freshly constructed curve object, equals O exactly.
        responsibility: correctness
      - claim: The plain (recombination-off) construction reproduces the standard balance-heuristic full-relation yield within this lane's existing tolerance.
        responsibility: baseline
      - claim: Merge cost is O(alpha(T)) amortised per insertion via union-find, plus O(k) or O(1) canonicalisation per residual as priced.
        responsibility: runtime
      - claim: This construction is F2 with a recombination ingredient, not F7 (preprocessing advice); the hash table is consumed within one relation-collection sweep toward the shared linear system.
        responsibility: scope
  predictions:
    - metric: fraction_of_combined_relations_passing_the_full_2m_minus_2_leg_sum_to_O_certificate
      direction: flat
      minimum_effect: 100 percent, on every arm with correct canonicalisation. Any failure is a hard instrument defect and voids the arm.
    - metric: count_of_combined_relations_per_T_attempts_against_the_naive_birthday_prediction_T_squared_over_2_times_residual_support
      direction: different
      minimum_effect: >-
        Agreement within a factor of 2 for T up to sqrt(residual support size),
        reported with the observed residual-value histogram (a non-uniform
        residual distribution -- plausible if V has algebraic structure, e.g.
        a subspace or coset -- would show as a heavier-than-uniform histogram
        and is itself a reportable structural finding, not a failure).
    - metric: rank_contributed_to_the_factor_base_relation_matrix_by_combined_relations_versus_full_relations_at_matched_attempt_count_T
      direction: higher
      minimum_effect: >-
        Strictly positive combined-relation rank contribution at T large enough
        that full-relation supply alone would leave the matrix under-determined
        (the regime where large-prime recombination is classically most
        valuable); reported as a ratio, not asserted in advance.
    - metric: adversarial_canonicalisation_certificate_failure_rate
      direction: higher
      minimum_effect: >-
        MEASURABLY NONZERO under a deliberately truncated hash key, confirming
        the certificate re-check has power to catch a canonicalisation defect
        (the nearby-object control).
    - metric: merge_step_wall_clock_relative_to_relation_collection_wall_clock
      direction: lower
      minimum_effect: >-
        Under 10 percent at the toy scales tested, or the "cheap pre-processing
        step" framing must be revised to name the scale at which it stops
        being cheap.
  minimal_test:
    design: >-
      STAGE 0 (derivation, zero compute): write out the sign/canonicalisation
      convention for L explicitly and verify by hand on a p=101-scale toy
      point (curve arithmetic only, no field larger than what fits in a hand
      check) that c(L) = c(-L) and, where V is Frobenius-stable, c is invariant
      under the <phi>-orbit. STAGE 1 (toy cells, n <= 41, m in {3,4}): for two
      candidate V constructions (IDEA-20260915-3119c9's class-aligned slice;
      IDEA-20260922-1b16d7's trace-confined window), at |V| = B chosen so
      B^{m-1} is directly enumerable (B <= ~200 for m=3, B <= ~40 for m=4):
      enumerate ALL (m-1)-subsets of V, compute L for each, canonicalise, and
      build the hash table and union-find structure over the FULL population
      (an exhaustive census, not a sampled one, at this toy scale). Record:
      full-relation count (L in V directly), combined-relation count (residual
      collisions), certificate pass rate for every combined relation, and the
      residual-value histogram. STAGE 2 (sub-sampling, the T-dependence
      prediction): repeat with T a random subset of the (m-1)-tuples (T in
      {B, 2B, 4B, ..., up to the full enumeration}), to trace out the
      birthday-style growth curve of combined-relation count against T,
      against the naive prediction. STAGE 3 (adversarial control): repeat
      Stage 1 with a deliberately truncated canonicalisation key and confirm
      the certificate-failure rate is measurably nonzero.
    controls:
      - >-
        RECOMBINATION-OFF NULL: the plain free-leg construction (hash table
        unused) at the same cells, confirming zero phantom relations and
        matching the standard balance-heuristic full-relation yield.
      - >-
        ADVERSARIAL CANONICALISATION: a deliberately truncated hash key,
        confirming the certificate re-check has power (nonzero failure rate).
      - >-
        CERTIFICATE RE-VERIFICATION on every combined relation, zero
        tolerance, per docs/claims-and-verification.md's standard for any
        claimed relation.
      - >-
        F2/F7 BOUNDARY CHECK: confirm the hash table's contents are entirely
        consumed within the single relation-collection sweep and produce no
        artefact reusable for a DIFFERENT, unrelated target -- i.e. that this
        construction genuinely stays inside F2 and does not silently become
        an F7 advice table.
      - >-
        Solver-free ground truth: at these toy sizes the census is exhaustive
        (Stage 1) or an explicit random subsample of a known exhaustive
        population (Stage 2), so no solver verdict is trusted without the
        enumeration agreeing.
    required_metrics:
      - full_relation_count_per_cell_per_V
      - combined_relation_count_per_cell_per_V_per_T
      - certificate_pass_rate_combined_relations
      - certificate_failure_rate_under_adversarial_canonicalisation
      - residual_value_histogram
      - relation_matrix_rank_contribution_full_vs_combined
      - merge_step_wall_clock_vs_relation_collection_wall_clock
      - union_find_amortised_cost_per_insertion_measured
  falsification_conditions:
    - >-
      Any certified combined relation failing the full-leg-sum-to-O
      re-verification under correct canonicalisation. Hard instrument defect;
      the record is withdrawn until resolved.
    - >-
      Combined-relation count differing from the birthday prediction by more
      than a factor of 2 at T <= sqrt(residual support), with no structural
      explanation (e.g. a non-uniform residual histogram) offered. Refutes the
      heuristic assumption as stated for that V.
    - >-
      Zero certificate failures under the adversarial (truncated-key) control.
      Means the re-verification step has no power and every "pass" elsewhere
      in the record is uninformative.
    - >-
      Merge step wall clock exceeding relation-collection wall clock by more
      than a small constant at the tested scales. The "cheap pre-processing"
      framing must then be restated with the scale at which it stops holding.
    - >-
      Any artefact from the hash table shown to transfer usefully to a target
      OUTSIDE the sweep that produced it, without re-derivation. Would mean
      this construction has silently become F7 and the F2/F7 discrimination
      claim is wrong.
  confounders:
    - >-
      RESIDUAL SUPPORT SIZE. The birthday prediction depends on the SIZE of
      the set residuals are drawn from, which is at most |E(F_q)| but may be
      much smaller if V has algebraic structure (e.g. a subspace, whose
      (m-1)-fold sumset can concentrate); this must be measured (the residual
      histogram), not assumed uniform over the whole group.
    - >-
      FROBENIUS-ORBIT CANONICALISATION CORRECTNESS on Frobenius-stable bases:
      an off-by-one in the cyclic-shift canonicalisation (IDEA-20260922-6cf862's
      Booth's-algorithm pricing) would silently mis-match or miss residuals;
      the certificate re-check catches wrong matches but NOT missed ones (a
      conservative failure, undercounting rather than corrupting).
    - >-
      SIGN CONVENTION. x-coordinate factor bases conflate P and -P; the
      canonicalisation must handle this consistently across BOTH the initial
      tuple construction and the residual matching, and Stage 0's hand check
      is the tripwire for a convention mismatch.
    - >-
      TOY-SCALE ENUMERABILITY. The B <= ~200 (m=3) / B <= ~40 (m=4) toy bound
      for exhaustive enumeration is far below any base size a deployed curve
      would need; the T-dependence curve (Stage 2) is the only part of this
      record that speaks to larger-T behaviour, and even that is bounded by
      the toy field size's total point count.
  interpretation_limits:
    - Proposal only. No experiment, no run, no approval, no result exists here.
    - >-
      KN-OPEN-020 CLASS DECLARATION. No new factor base is proposed; V's class
      and costs are inherited from whichever construction is chosen (two named
      candidates in the minimal test). This record adds a new relation-graph
      edge type and its own hash/merge costs, charged above.
    - >-
      Nothing here says the resulting relation supply makes any index-calculus
      line beat matched rho on any named curve. This is a relation-COLLECTION
      efficiency claim (more relations, or the same relations at lower marginal
      cost, from a fixed attempt budget), not an attack.
    - >-
      Scoped explicitly to the regime where |V|^{m-1} is small enough for
      direct enumeration (or a designed sub-enumeration) rather than
      SAT/Groebner search over an implicitly-described V; this is disclosed as
      a real restriction on where the construction applies at all, not a
      universal claim about every base this lane studies.
    - >-
      The toy range is n <= 41, B <= ~200; the extrapolation distance to any
      deployed curve's realistic factor-base size is unstated and not
      estimated here.
  heuristic_assumptions:
    - id: H-c2bbe6-0
      statement: >-
        BIRTHDAY HEURISTIC. As (m-1)-tuples range (uniformly at random, or by
        exhaustive enumeration) over V^{m-1}, their residuals L are
        approximately uniformly distributed over a support set of size S (S <=
        |E(F_q)|, measured not assumed), so that after T attempts the expected
        number of matched residual pairs is approximately T^2/(2S), the
        classical birthday/large-prime-variation heuristic.
      rigorous_support: >-
        NONE as an equality for a structured V (a subspace or coset); this
        imitates the classical birthday bound for genuinely random draws,
        whose elliptic-curve analogue is used elsewhere in this program's
        baseline convention (van Oorschot-Wiener's own birthday-based
        collision counting for Pollard rho). The GAP: if V has strong
        algebraic structure, the (m-1)-fold sumset of V may be FAR from
        uniform over its support (concentrated on a coset, a subspace, or a
        small orbit set), exactly the failure mode this lane's other yield
        records (e.g. IDEA-20260915-3119c9's Lambda(V), IDEA-20260922-1b16d7's
        trace-confined window) already show can happen and are DESIGNED to
        exploit deliberately; this heuristic could therefore be wrong in
        either direction (residuals MORE concentrated, giving faster
        large-prime yield than predicted, or LESS, giving slower) depending on
        which V is chosen.
      validation_plan: >-
        SAMPLE: the full Stage 1/Stage 2 census above, at >= 2 toy field sizes
        and both candidate V constructions, reporting the residual histogram
        directly (not just its first moment) and comparing the growth curve of
        combined-relation count against T to the T^2/(2S) prediction with S
        measured from the histogram's own support size. TAIL CHECK: the
        maximum residual multiplicity (most-collided residual value) against
        the value a uniform draw would predict at the same T, per this
        program's standing convention of checking over-dispersion (the same
        style of check IDEA-20260913-cedd2f and IDEA-20260915-3119c9 apply to
        their own yield distributions). TRANSFER ASSUMPTION, stated and not
        hidden: that the toy-scale (n <= 41) residual distribution shape
        persists qualitatively at deployed scale; no quantitative transfer is
        claimed.
    - id: H-c2bbe6-1
      statement: >-
        MERGE-COST HEURISTIC. Union-find over canonicalised residuals gives
        O(alpha(T)) amortised cost per insertion, i.e. the merge step's total
        cost is near-linear in the number of attempts T and therefore small
        relative to the O(B^{m-1}) cost of generating the attempts themselves.
      rigorous_support: >-
        Standard data-structure fact (union-find with path compression and
        union by rank); the GAP is entirely in whether the CANONICALISATION
        cost per residual (which this heuristic treats as O(1) or O(k) and
        additive, not part of the union-find analysis) dominates in practice,
        which is an implementation question, not a data-structure one.
      validation_plan: >-
        Stage 1/2's measured merge-step wall clock against relation-collection
        wall clock, reported as a ratio at each tested T; falsified if the
        ratio exceeds a small constant (stated as 10 percent in the
        predictions above) at any tested scale.
  heuristic_note: >-
    The record's constructive core (the free-leg residual, its
    canonicalisation, and the combined-relation existence statement) is
    certificate-bearing and carries no heuristic; the entire heuristic content
    is in HOW MANY combined relations a given attempt budget T produces
    (H-c2bbe6-0) and how cheap the merge step actually is in practice
    (H-c2bbe6-1). Both are stated so that EITHER a confirming or a
    disconfirming measurement is informative: a residual distribution far from
    uniform would not refute the construction, it would change which V is the
    better design choice, exactly as this lane's other yield records already
    treat concentration as a reportable structural fact rather than a failure.
  target_complexity:
    time_exponent: >-
      No exponent moves. This is a relation-COLLECTION efficiency mechanism:
      for a fixed attempt budget T (number of (m-1)-tuples examined), it
      converts a LINEAR-in-T supply of full relations (search probability
      p_full ~ B^m/(m! N), the standard balance heuristic) into a supply
      supplemented by a QUADRATIC-in-T term (T^2/(2S) combined relations,
      under H-c2bbe6-0) for the relations already-attempted but previously
      discarded. Whether this changes the T needed to reach a full-rank
      relation matrix (and hence the overall relation-collection phase cost)
      depends on B, S and T in a regime this record does not resolve to a
      single number; that is the object of the minimal test.
    memory_exponent: >-
      The hash table and union-find structure add O(T) memory (one entry per
      attempt, or per distinct residual if attempts are deduplicated), on top
      of whatever the underlying relation-collection phase already stores.
      Disclosed as a real, not hidden, memory cost.
    best_known: >-
      Matched Pollard rho on whatever named curve a future EXP-BINSTD-*
      contract targets; not recomputed here, as this record makes no attack
      claim.
    hidden_overhead: >-
      DISCLOSED: the residual support size S is not estimated in advance for
      any specific standardized curve or V construction; it is exactly the
      quantity the minimal test measures. A smaller-than-expected S would make
      the mechanism MORE valuable (faster large-prime yield); a larger one
      would make it LESS valuable; neither direction is assumed.
    tradeoff_note: >-
      Pure relation-supply lever bought at O(T) memory and O(alpha(T))
      amortised merge time; no time-memory tradeoff of the cryptanalytic kind
      is proposed, and the construction is embarrassingly parallel in the same
      sense the underlying relation search already is (each attempt is
      independent; only the hash-table insert needs synchronisation, standard
      for a shared-memory or sharded-hash-table design, not analysed further
      here).
  estimated_cost:
    implementation: medium
    compute: low
    qualification: >-
      Stage 0 is a hand derivation, minutes. Stages 1-2 reuse the toy
      Koblitz/subfield decomposition machinery this lane already has (the same
      curve arithmetic as IDEA-20260915-3119c9's exhaustive tables) and add a
      hash table, a union-find structure, and a certificate re-verification
      pass -- a few hundred lines, single machine, minutes to hours depending
      on the largest B tested.
  asymptotic_claim:
    problem: >-
      Relation-collection yield per fixed attempt budget T, for factor bases
      already studied in this lane, augmented with a large-prime-style
      recombination step.
    prior_best: >-
      The plain free-leg construction, discarding every non-full-relation
      residual (recalled as a background construction in this lane,
      unverified provenance -- IDEA-20260922-6cf862's citation_note); yield
      linear in T at rate p_full ~ B^m/(m! N).
    time_exponent: unchanged (no algorithm proposed against the overall ECDLP problem; a relation-collection efficiency mechanism)
    memory_exponent: O(T) additional storage for the hash table / union-find structure, disclosed
    hidden_cofactor: >-
      The residual support size S, unmeasured for any specific deployed curve
      or V; the entire predicted gain scales with S and is not asserted in
      advance.
    claim_kind: relation_collection_mechanism
  dominated_by: >-
    Not applicable as an attack claim (no algorithm against ECDLP is proposed
    or costed end-to-end); as a RELATION-COLLECTION technique it is not
    dominated by anything named in this corpus, which the origin block's grep
    confirms has no prior instance of this specific recombination on the
    elliptic/binary lane. As a general TECHNIQUE CLASS it is dominated by
    nothing new: large-prime variation is standard, recalled, and unverified
    background in factoring/NFS (RQ-GNFS-c6ce52); this record's contribution
    is the elliptic/binary port and its honest scoping (regime restriction,
    F2/F7 discrimination), not the underlying idea of recombining partial
    relations.
  sota_delta:
    time: >-
      Not computed as a single number; the predicted effect is a
      quadratic-in-T supplement to relation supply within the relation-
      collection phase, whose net effect on total phase cost depends on
      measured S and is the object of the minimal test, not asserted here.
    memory: O(T) additional, disclosed, no exponent claimed.
    data_queries: >-
      Not applicable in the F7 (advice/precomputation) sense; explicitly
      discriminated from that framing in the mechanism section.
  frontier_check:
    status: pending
    note: >-
      Whether large-prime-style recombination has been proposed for elliptic-
      curve point-decomposition index calculus anywhere in the published
      literature (Gaudry, Diem, Joux-Vitse, Galbraith-Gebregiyorgis, GGMP) was
      NOT checked against any primary source this session; no web search was
      run. Given large-prime variation is decades-old and standard for
      integer-factoring sieves and for NFS discrete log, its absence from this
      program's corpus is not strong evidence of absence from the wider
      literature, and a coordinator literature check is recommended before any
      part of this record is called novel beyond `speculative`.
  recommended_priority: medium
  priority_rationale: >-
    Directly answers the lane's named seam (large-prime variation /
    structured Gaussian elimination, present in factoring, absent here) with
    a concrete, certificate-bearing, falsifiable construction and an honest
    engineering explanation for the absence, rather than a bare "try this".
    Not "high": its net effect on total relation-collection cost is UNRESOLVED
    by this record (the birthday heuristic could cut either way depending on
    the measured residual support size S, and the record says so rather than
    asserting a gain), and it is explicitly scoped to a regime (direct
    (m-1)-tuple enumeration) narrower than this lane's SAT/Groebner-based
    instruments generally operate in. It is a genuine building block for the
    relation-collection phase of any index-calculus line this lane pursues,
    priced honestly rather than oversold.
  first_deliverable: >-
    The Stage 0 hand derivation (canonicalisation convention, correctness
    check) plus a Stage 1 exhaustive toy-cell census at one field size and one
    V construction, reporting full-relation count, combined-relation count,
    certificate pass rate, and the residual histogram.
  next_gate: >-
    Coordinator decision on whether to design Stages 1-3 into an EXP-BINSTD-*
    contract, and on the coordinator literature check named in frontier_check
    before any novelty claim beyond `speculative` is made.
