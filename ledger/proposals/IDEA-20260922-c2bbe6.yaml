idea:
  id: IDEA-20260922-c2bbe6
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    The elliptic large-prime variation: repurpose the free-last-leg
    (m-1)-fixed decomposition construction, already a recalled component of
    this lane, as a relation-collection accumulator that banks every "near
    miss" residual point instead of discarding it, matches recurring residuals
    across attempts by canonical-point hashing, and merges the resulting
    weight-2(m-1) relations before dense linear algebra -- with the honest
    engineering reason this program's binary lane has never used one: the
    Weil-descended decomposition system is posed as a yes/no SAT predicate on
    the FULL m-tuple, which exposes no "solved all but one leg" byproduct
    unless the search is deliberately restructured to the free-leg form first
  class: composition
  claim: >-
    SETTING. E(F_q), q = 2^n, a curve from RQ-BINSTD-b6f698's population, V a
    factor base of size B (any of the constructions this lane already studies:
    Semaev's low-degree window, IDEA-20260922-1b16d7's trace-confined window,
    IDEA-20260915-3119c9's class-aligned slice, or IDEA-20260918-9abf42's
    Frobenius-stable subspace -- this record is AGNOSTIC to which V is chosen
    and inherits its class and cost from whichever is used). A relation
    among factor-base elements is a size-m multiset from V summing to O (the
    identity), giving one linear equation among the B unknown discrete logs
    log_{P0} P_i; this is the RELATION-COLLECTION phase RQ-RELN-001 and this
    lane are chartered to study, distinct from the target-specific descent
    phase.

    (A) THE FREE-LEG CONSTRUCTION, ALREADY A RECALLED COMPONENT HERE. Fixing
    m-1 legs P_1,...,P_{m-1} from V and computing L = -(P_1+...+P_{m-1}) is m-2
    point additions, deterministic, no search: L is EXACTLY the point that
    would complete the tuple to a relation, and checking L in V is a single
    membership test. This is the (m-1)-fixed / "free last leg" variant recalled
    (not verified) in IDEA-20260922-6cf862's citation_note ("the Joux-Vitse
    (m = k-1) free-leg variant") and structurally present in
    IDEA-20260806-9d47e2's "roots x(+-P_1 +- ... +- P_{m-1}), computable by
    m-1 group additions". Every attempt of this form produces EXACTLY ONE
    candidate L, always -- there is no failure mode "no candidate produced",
    only "L happens to lie in V" (a full relation) or "L does not" (a near
    miss). This is the elliptic analogue of trial-dividing a sieve candidate
    by the factor base and being left with one cofactor: the byproduct is free,
    it is simply discarded today.

    (B) THE LARGE-PRIME RECOMBINATION, NOT PRESENT IN THIS CORPUS UNDER ANY
    NAME. Canonicalise each residual L to a representative c(L) (handling
    +-L via the standard sign convention this lane already uses for x-coordinate
    factor bases, and, where the base is Frobenius-stable, handling the
    <phi>-orbit exactly as IDEA-20260922-6cf862's canonicalisation prices it:
    O(k) word comparisons, zero field multiplications). Maintain a hash table
    keyed by c(L). Every attempt inserts (tuple, sign, orbit-shift) under
    c(L). When a SECOND attempt (from the same target's continued search, from
    a DIFFERENT target, or from a target-free relation-collection sweep over
    V^{m-1} with no target at all -- see (D)) produces a matching c(L'),
    subtract the two tuples: the two L's cancel (up to the recorded sign/orbit
    correction) and the difference is a genuine relation of weight 2(m-1) among
    factor-base elements ONLY, at zero additional search cost beyond the hash
    lookup. This is the direct structural analogue of the classical large-prime
    variation in sieve-based factoring and NFS discrete-log (recalled as a
    standard technique, cited in this program's own RQ-GNFS-c6ce52 as
    "large-prime variations" among GNFS's relation-collection ingredients;
    NOT independently re-verified against a primary NFS source this session).

    (C) THE HONEST REASON IT HAS NEVER APPEARED IN THIS LANE. Grepped: no
    record in ledger/ or knowledge/ combines "free-leg"/"(m-1)-fixed" with a
    residual-matching or hash-table recombination step (see origin block).
    The reason is structural, not an oversight: this program's binary
    decomposition instruments (WDSat, CryptoMiniSat, CaDiCaL, Macaulay2/Singular
    Groebner) are built to answer "does THIS m-tuple system have a solution",
    a SATISFIABILITY predicate over the FULL m legs at once, via Weil descent
    to a Boolean system. A SAT/Groebner solver that returns UNSAT for an
    m-variable system exposes NO byproduct -- it does not naturally compute
    "the sum of the other m-1 legs" as a reusable elliptic-curve point,
    because the descended system works in BOOLEAN COORDINATES, not group-law
    coordinates, and "UNSAT" carries no group element with it. The free-leg
    construction bypasses this entirely: it does NOT solve a Boolean system at
    all, it performs m-2 ordinary curve additions and one membership test,
    which is only a sensible primary strategy when |V|^{m-1} is small enough
    to enumerate directly (or to enumerate a designed subset of) rather than
    needing SAT/Groebner search over an implicit large V. The corpus's
    decomposition instruments were built for the OPPOSITE regime (V described
    implicitly, |V| large, direct enumeration infeasible), which is why the
    byproduct this record banks has never been produced as a matter of
    engineering choice, not because it is unavailable in principle.

    (D) TARGET-FREE VS TARGET-KEYED RELATION COLLECTION. The relation
    collection this record targets is target-FREE: legs range over V, the
    "target" of each attempt is simply O (the identity), and the resulting
    relations feed the factor-base linear system, exactly as classical index
    calculus collects relations before any individual-log descent. This
    distinguishes it explicitly from a MITM/preprocessing-table construction
    (F7, off-limits as a primary lens per docs/object-frame-ideation.md): an
    F7 table is built once as ADVICE reusable across MANY FUTURE, as-yet-unknown
    targets; this record's hash table is consumed WITHIN one relation-collection
    sweep over V^{m-1} (or a designed subset of it) toward the SAME linear
    system this lane already builds, grows organically as attempts are made,
    and is not proposed as amortised advice for unrelated future targets. It
    is F2 (factor-base decomposition), the declared component, with one new
    ingredient: near-misses are banked and recombined rather than discarded.
  mechanism: >-
    OBJECT FRAME. Representation: an (m-1)-tuple of factor-base points paired
    with its deterministic residual point L (R1 class per RQ-ECDLP-623a32: a
    field/point representation, here of a COMPOSITE object -- tuple plus
    residual -- rather than a single point). Operation set Sigma: pairwise
    SUBTRACTION of two tuples sharing a canonicalised residual (tuple1 - tuple2
    when c(L1) = c(L2)), together with the underlying translation-by-V action
    each leg individually inherits. Sigma is explicitly NOT the full
    translation action.

    TRICHOTOMY: PARTIAL-ACTION (Class I). The tracked object (the tuple, keyed
    by its residual) propagates only under this specific pairwise-subtraction
    operation, restricted to tuples sharing a residual; it is not acted on by
    translation by an arbitrary factor-base element the way a single relation
    row is.

    LOSSY-PROJECTION TEST AGAINST THAT SIGMA. The projection is
    pi: (tuple, L) -> c(L), discarding the specific tuple (which of the
    B^{m-1}/(m-1)! possible (m-1)-subsets produced this residual) and keeping
    only the canonicalised residual point. This is COMPATIBLE with Sigma
    because the pairwise-subtraction operation is defined PRECISELY on the
    fibre c(L1) = c(L2) -- two tuples combine iff their projections agree, so
    the retained coordinate is exactly what determines whether the operation
    applies. It IS lossy in the representation used: many distinct
    (m-1)-tuples generically produce the same L only by the coincidence this
    record exploits (a birthday match), not by any algebraic identity, so the
    fibre over a fixed c(L) is large and the tuple itself is genuinely
    discarded information, recoverable only by keeping a side-table (which
    the construction does, for exactly the tuples that matter -- this is not
    a contradiction: the LOSSY PROJECTION is what is hashed and matched; the
    discarded tuple is retained in a SEPARATE side-table entry per hash
    bucket, which is bookkeeping, not un-lossiness of the projection itself).

    THE PRICED OPEN NUMBER: the large-prime GRAPH and its merge cost. Every
    inserted (tuple, c(L)) pair is a graph edge between the m-1 legs of the
    tuple (viewed as a hyperedge) and the vertex c(L); a component of this
    graph in which residuals form a SPANNING TREE (as in classical large-prime
    variation with two or three large primes) yields |component| - 1
    independent relations from |component| partial attempts, at a MERGE cost
    this record charges explicitly: a union-find structure over canonicalised
    residuals, O(alpha(T)) amortised per insertion for T total attempts, plus
    the O(k) canonicalisation cost per residual (inherited from
    IDEA-20260922-6cf862's pricing where the base is Frobenius-stable, O(1)
    field comparisons otherwise). This is the STRUCTURED GAUSSIAN ELIMINATION
    analogue named in this lane's brief: a lightweight merge/union-find pass
    that collapses large-prime-linked partial relations into full ones BEFORE
    they are fed to the dense (or sparse block Wiedemann/Lanczos) linear
    algebra this lane's other RELN records already charge -- it is a SEPARATE,
    cheap, disclosed pre-processing step, not a replacement for the linear
    algebra itself.

    KN-OPEN-020 CLASS DECLARATION. No new factor base is proposed. V's
    membership class, description cost and per-attempt decomposition cost are
    inherited unchanged from whichever construction is chosen (this record's
    minimal test uses IDEA-20260915-3119c9's class-aligned slice and
    IDEA-20260922-1b16d7's trace-confined window as the two arms, both already
    F_2-linear). This record adds a new EDGE TYPE to the relation graph
    (weight-2(m-1) large-prime relations) and charges its own hash-table
    membership test (O(1) amortised) and merge cost (O(alpha(T)) amortised per
    insertion) separately from V's costs.

    F2/F7 DISCRIMINATION, STATED EXPLICITLY. This is F2 (factor-base
    decomposition) with the near-miss-recombination ingredient added; it is
    NOT F7 (preprocessing table), because the hash table is built and consumed
    within ONE relation-collection sweep toward the shared linear system this
    lane's decision target already needs, not as reusable advice for
    as-yet-unspecified future targets. The distinction is stated here because
    the data structure (a hash table of computed points) is superficially
    identical to an F7 advice table; the difference is entirely in what it is
    FOR.
