idea:
  id: IDEA-20260829-60be01
  question_id: RQ-INSTR-f8faa0
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator

  title: >-
    "MATCHED AT THE SAME p" NAMES A FAMILY OF DIFFERENT NULLS AND THE QUESTION'S
    SCOPE DOES NOT SAY WHICH: make the MATCHING KEY -- the invariant vector a
    null sampler conditions on -- an explicit object, prove the over-matched end
    algebraically (a statistic measurable with respect to the key has zero power
    by construction), exhibit the under-matched end concretely on the CM curves
    the scope names (a uniform random-curve null at the same p has |Aut| = 2 with
    probability 1 - O(1/p), while j = 0 and j = 1728 have |Aut| = 6 and 4), and
    measure the false-positive-versus-power curve over a four-rung matching ladder

  class: control

  claim: >-
    (A) THE OBJECT IS UNDEFINED IN THE COMMITTED STATE, AND THAT IS CHECKABLE.
    RQ-INSTR-f8faa0's declared scope lists "matched random-curve null objects at
    the same p" as one of its three curve families. A Grep over harness/ this
    session for random_curve, matched_null, null_curve and matched random finds a
    matched-null sampler in the kerfield lane (harness/exp_kerfield.py line 63,
    "matched_null_frozen"; harness/run_kerfield.py lines 733-734) and finds, in
    the isogeny-class lane this question's scope is bound to, ONLY the boolean key
    rejects_matched_null emitted by harness/run_icinv.py's synthetic Bernoulli
    control. So the phrase in the scope names an object the lane has not built,
    and the phrase itself does not determine which object it would be: "matched at
    the same p" fixes ONE invariant and leaves every other free. Two nulls that
    both satisfy the phrase -- one matching only p, one matching p and the trace
    and the automorphism group -- are different nulls with different false-positive
    rates and different power, and no committed field distinguishes them. This is
    the same non-identifiability shape recorded for the symmetric frontier in
    IDEA-20260829-9aaa40, here applied to a null rather than to a boolean.

    (B) THE OVER-MATCHED END, PROVED RATHER THAN MEASURED. Let the null sampler
    condition on a key K = (K_1, ..., K_r), i.e. draw uniformly from curves with
    the same value of every K_i as the object. If the test statistic T is
    measurable with respect to sigma(K) -- that is, T is a function of K alone --
    then T takes the SAME value on every null draw as on the object, the null
    distribution is a point mass at the observed value, and the test's power
    equals its size against every alternative. It cannot support a negative, which
    is RQ-INSTR-f8faa0's own disqualifying criterion, and it fails it by
    construction rather than by bad luck. THE CHECK IS ALGEBRAIC AND COSTS NO
    COMPUTE: for each declared functional, ask whether it is a function of the
    key. Two committed functionals are already known to be, and both were recorded
    in this lane without the consequence being drawn. The group order is
    N = p + 1 - t, a function of (p, t), so any null matching on the trace has
    exactly zero power against it. The full-field liftable count is
    (N - 1 + z)/2 by the identity harness/run_icinv.py verifies on every row, so
    any null matching on (p, t, z) has exactly zero power against it.

    (C) THE UNDER-MATCHED END, EXHIBITED ON THE CURVES THE SCOPE NAMES. The scope
    lists "CM curves with small fundamental discriminant, including j = 0 and
    j = 1728". Those are exactly the curves with extra automorphisms:
    |Aut(E)| = 6 for j = 0 when p is 1 mod 3, 4 for j = 1728 when p is 1 mod 4,
    and 2 otherwise. A null drawn uniformly from short-Weierstrass (a, b) at the
    same p contains a j = 0 or j = 1728 curve with probability O(1/p), so |Aut|
    is 2 in the null arm and 4 or 6 in the CM arm, DETERMINISTICALLY, and |Aut| is
    not in the matching key. Three consequences follow, none of them statistical:
      C1. Any functional correlated with |Aut| separates the arms with an effect
          that is arithmetic, not CM structure. The sharpest instance is committed:
          IDEA-20260807-efc8de records that s3_monomial_support "depends on which
          of a, b vanish", and a = 0 is exactly j = 0 while b = 0 is exactly
          j = 1728. So on a CM arm containing j = 0 against a generic null, that
          functional's difference is DETERMINISTIC and its p-value is the floor.
          The instrument fires on a matched null, and it cannot support a positive.
      C2. IDEA-20260807-34754f's recommended blocking on the quadratic-twist
          pairing {class(t), class(-t)} is not the twist orbit on those curves:
          j = 0 admits six twists and j = 1728 admits four, so the block is a
          proper subset of the orbit and the blocking's justification -- that
          paired classes consist of twists of one another -- does not hold there.
          That record's own scope is the generic case and it does not claim
          otherwise; the point is that the campaign's null design and its declared
          curve families disagree on exactly the family the scope singles out.
      C3. The RQ's own constraints already make |Aut| load-bearing: "on CM curves
          the automorphism-discounted rho baseline is the control (KN-TECH-018)".
          The campaign therefore already treats |Aut| as the quantity that changes
          the baseline, while proposing to compare against a null that does not
          match on it.

    (D) THE MEASURABLE CLAIM. Build the matching ladder and measure both
    directions at every rung. Rung 0 matches p only; rung 1 adds the trace t
    (equivalently N); rung 2 adds |Aut(E)|; rung 3 adds the CM order, that is the
    conductor of Z[pi] and the fundamental discriminant D_0. For each rung and
    each declared functional, measure (i) the FALSE-POSITIVE RATE, the fraction of
    matched-null draws on which the instrument fires, and (ii) the POWER against a
    planted CM-specific effect of declared magnitude. THE CLAIM IS THAT THE CURVE
    IS NON-MONOTONE IN THE USEFUL WAY: the false-positive rate falls sharply
    between rung 1 and rung 2 (because |Aut| is the uncontrolled invariant doing
    the work on the CM arm) while power is still present, and collapses to the
    size only at rung 3 for at least one functional (because the CM order
    determines it). The deliverable is that curve, per functional, with the
    algebraically predicted zero-power rungs marked in advance.

    (E) THE STRUCTURAL TELL, DECLARED BEFORE MEASUREMENT. Under
    docs/inventor-protocol.md section 3 the question is what the measured quantity
    SHOULD do as the parameter that destroys the structure increases. Here the
    parameter is matching depth and the quantity is the false-positive rate, which
    must DECAY toward the nominal level as more invariants are held fixed, because
    each rung removes one candidate explanation of the difference. A
    false-positive rate that does NOT decay across the ladder is the canonical
    artifact signature: the difference between the arms is carried by nothing in
    the ladder, and the responsible variable is unnamed. That outcome would be the
    single most informative result this record can produce, and it is
    pre-registered as such rather than discovered afterwards.

    (F) WHAT EACH OUTCOME MEANS, AND WHAT IS NOT CLAIMED. If the false-positive
    rate at rung 0 is already at the nominal level for every functional, matching
    depth does not matter at this p and this record's concern is unfounded -- a
    clean, cheap negative. If it is high at rung 0 and decays, the ladder gives the
    campaign the first stated definition of its own null. If it does not decay,
    the campaign has an unnamed nuisance and must name it before any positive is
    citable. NOTHING HERE CLAIMS that CM curves have or do not have distinctive
    ECDLP structure; every effect measured is between an arm and its null, and the
    record's entire content is which invariants the comparison controls.

  mechanism: >-
    THE STRUCTURAL DIAGNOSIS. This lane has treated "matched null" as a primitive.
    It is not: it is a sampler plus a conditioning set, and every property the
    campaign wants from it -- validity, power, interpretability -- is a property
    of the conditioning set. Two of this lane's own records already trip over the
    two ends without naming them. IDEA-20260807-34754f rejects the bit-length
    matched between-class comparison as "nearly vacuous ... it controls for
    nothing that is not already controlled", which is an under-matching complaint;
    IDEA-20260807-f6137c's Closure 2 argues that a class-minimum null at
    cryptographic p "is circular", which is an over-matching complaint. Both are
    correct and neither is stated in the coordinates that make them the same
    question.
    THE MECHANISM IS TO MAKE THE CONDITIONING SET AN EXPLICIT, ORDERED OBJECT.
    Declare the invariant list in a fixed order -- p, t (hence N), |Aut(E)|, the
    CM order (conductor f of Z[pi] and fundamental discriminant D_0), the
    j-invariant, the Weierstrass model, the factor-base rule -- and define rung d
    as conditioning on the first d entries. The sampler at rung d draws uniformly
    from curves at p agreeing with the object on those d invariants; rejection
    sampling suffices at toy p because the classes are completely enumerated
    already by harness/isogeny_class.py.
    WHY THE LADDER IS THE RIGHT SHAPE AND NOT A CHOICE OF ONE NULL. Refining the
    key partitions the curve set more finely, so the null's support shrinks
    monotonically, so power is non-increasing and validity is non-decreasing. That
    monotonicity is the propagation rule and it is what makes the ladder an object
    rather than a menu. The two ends are both failure modes named by this
    question's own decision target, and the useful null is an interior point whose
    location is a measurement, not a preference.
    WHY THE ALGEBRAIC HALF COMES FIRST. The entailment check -- is T a function of
    the first d invariants -- is decided on paper for every functional in minutes,
    and it predicts which rungs have exactly zero power BEFORE any sampling. Any
    rung where the algebra says zero and the measurement says nonzero means the
    sampler is not conditioning on what it claims to condition on, which is an
    implementation finding and must be reported before any false-positive rate is
    cited.

  tracked_object: >-
    THE MATCHING KEY of a null: the ordered invariant vector the null sampler
    conditions on, together with the sigma-algebra it generates. Propagated by the
    single admissible operation, REFINEMENT -- appending one invariant to the key,
    which partitions the curve set more finely and can only shrink the null's
    support.

  lossy_projection_test: >-
    PASSES, and the check is algebraic and free. The projection sends a curve to
    its value on the key: E maps to (p, t, |Aut|, f, D_0) or a prefix thereof. It
    is massively lossy -- an entire isogeny class of about 138 curves at p = 4001
    collapses to one point of the rung-1 key, and everything about the curve
    equation, the factor base and every measured value is discarded. What it
    discards is discarded COMPATIBLY with the operation the null performs, because
    the null sampler CONSUMES ONLY THE KEY: it draws uniformly from the fibre over
    the object's key value, so the retained part determines the null's support
    exactly and nothing discarded can change it. That is the cleanest possible
    pass -- the projection is precisely the sampler's precondition. Refinement is
    a further projection of the same kind and inherits the property, and the
    partition refinement gives the deterministic one-step propagation rule the
    protocol asks for. It is NOT a change of coordinates: the fibre over a key
    value is generically large (an entire class at rung 1) and no curve is
    recoverable from its key.
    HONEST LIMIT, STATED HERE RATHER THAN IN REVIEW: the key cannot express a
    property that is not an invariant of the chosen list, so a nuisance carried by
    something off the list is invisible to the whole construction. That is exactly
    the case prediction (E) is designed to detect, and it is the reason the
    non-decaying false-positive rate is the record's most informative outcome
    rather than its failure mode.

  scope_verdict: >-
    IN SCOPE, and deliberately targeted at the two curve families the scope names
    that the lane's committed work has not exercised: CM curves with small
    fundamental discriminant including j = 0 and j = 1728, and matched
    random-curve null objects at the same p. Prime fields, p = 4001 and a small
    ladder of nearby p, all far under the declared ~32-bit ceiling.
    ON THE THREE CROSS-LANE INSTANCES: OUTSIDE this question's declared scope on
    every axis. IDEA-20260829-c7472b's objects are elliptic curves over Q with
    coefficients of order 1.4e26 and PARI class-group computations -- not a prime
    finite field and not at most 32 bits; IDEA-20260829-9aaa40's object is a
    symmetric-cryptanalysis frontier compilation and IDEA-20260829-9e6650's are
    SHA-1 and MD5 differential paths, neither of which involves an elliptic curve
    at all. This record imports the FAILURE SHAPE from IDEA-20260829-9aaa40 -- a
    label with two ground truths and no field separating them -- and instantiates
    it on the in-scope null. It files no claim about those lanes.
    THE SCOPE GAP IS ITSELF A FINDING AND IT IS A DEFECT OF THE QUESTION RECORD,
    not of those lanes: RQ-INSTR-f8faa0's title and decision_target are written
    program-generally ("the campaign's instruments"; "an instrument that cannot
    detect a planted signal cannot support a negative"), while its scope block is
    bound to GOAL-ENDO-001's toy prime-field lane, and proposals already filed
    against the question are already outside that block -- IDEA-20260816-2f049b,
    read in full this session, has a side-channel leak detector as its object and
    touches no curve. Downstream records citing the decision_target therefore
    inherit a general rule from a record whose scope is local. The repair is a
    clause-scoped correction record on the pattern of RQ-MCE-3f7c02 and
    RQ-MCE-f8fca0 (both read in full this session): a new question record with
    record_role clause_supersession, superseding the scope clause alone, leaving
    every other clause of RQ-INSTR-f8faa0 in force and unedited, and listing the
    already-filed out-of-scope proposals as the sites. ONLY THE COORDINATOR MAY
    CREATE IT. This record proposes that it is needed and creates nothing.

