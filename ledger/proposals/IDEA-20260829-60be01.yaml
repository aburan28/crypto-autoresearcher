  assumptions:
    - >-
      At toy p the fibre over any rung's key is enumerable, because
      harness/isogeny_class.py already enumerates every isomorphism class at cost
      O(p^2). So the sampler is rejection sampling over an enumerated set and needs
      no mixing argument, no walk and no reachability claim. This is what confines
      the design to p of order 2^12 to 2^14 and it is disclosed rather than
      absorbed.
    - >-
      Rung 2 and rung 3 fibres may be very small or empty at a given p: there is at
      most one j = 0 curve up to isomorphism and its twists, so a null "matched on
      |Aut| = 6" has a fibre of size at most the sextic-twist family. Where a fibre
      is too small to sample, the rung is reported as NOT CONSTRUCTIBLE AT THIS p
      with its fibre size, which is itself a measurement and is exactly
      IDEA-20260807-f6137c's constructibility bit computed per rung.
    - >-
      The invariant list is DECLARED BEFORE MEASUREMENT and frozen. Adding an
      invariant after seeing which rung fired is the forking-path failure
      IDEA-20260807-caf061's blinding stage exists to prevent, and the commit order
      is the evidence.
    - >-
      This record changes no status and edits no record. The proposed clause-scoped
      correction to RQ-INSTR-f8faa0's scope is a Coordinator action; naming it is
      not performing it.
    - >-
      Toy tier throughout. Nothing here is evidence about any curve of
      cryptographic size, and the |Aut| effects discussed are structural facts
      about small curves, not attack costs.

  proof_search_map:
    bottleneck: >-
      The conditioning set of the null. Every comparative claim this lane can make
      passes through it: a difference between an object and its null is
      attributable to the object only in respect of the invariants the null holds
      fixed, and to nothing else. If the set is unstated, every such claim is
      unfalsifiable in the specific sense that no reader can say what it controls
      for.
    baseline_embedding:
      parameter_slice: >-
        Rung 1 with the object being a complete isogeny class and the null being
        another complete class at the same p and the same |N| bit length is
        EXACTLY the bit-length-matched between-class comparison that
        harness/exp_icinv.py's module docstring calls NULL-A, as quoted by
        IDEA-20260807-34754f. Rung 1 must reproduce NULL-A's behaviour on the
        frozen slice; that is the old-method boundary and it must be hit exactly,
        not approximately.
      reproduction_check: >-
        A frozen fixture: run the rung-1 sampler on p = 4001 with traces
        {30, -30, 18, -18} and require the emitted verdicts to equal the committed
        NULL-A verdicts row for row. A mismatch means the ladder is not embedding
        the incumbent and the run halts until it is explained. Note that the
        committed NULL-A behaviour is known here only through
        IDEA-20260807-34754f's quotation of a docstring, so the fixture's expected
        values must be re-read from source before it is frozen.
    observation_collision:
      observable: >-
        The instrument's verdict on the comparison "object versus matched null".
      distinct_preimage_search: >-
        COLLISION EXHIBITED, WITH A CONCRETE PAIR ON EACH SIDE OF THE CONCLUSION,
        and it costs no compute. Take the observable "the instrument fires". On one
        side: a genuine CM-specific effect. On the other: the s3_monomial_support
        difference between a CM arm containing j = 0 and a generic null, which is a
        deterministic consequence of a = 0 and is not CM structure in any sense the
        campaign cares about. Both produce the identical observable at rung 0 and
        rung 1. SEPARATING CONDITION: report the rung at which the verdict changes,
        which is a single integer per functional per comparison, and the fibre size
        at that rung. That converts a non-identifiable "fires" into an identifiable
        "fires at rungs 0 and 1, does not fire at rung 2", which localises the
        responsible invariant. A SECOND COLLISION IS SEARCHED FOR AND IS THE
        DANGEROUS ONE: two functionals whose verdicts change at the same rung for
        different reasons, one because the invariant explains the effect and one
        because the fibre became too small to have power. The fibre size is
        reported beside every rung precisely so a reader can tell those apart.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The refinement ladder as a resource measure: each rung is a
          specialization whose GAIN is the false-positive rate removed and whose
          CHARGE is the power lost, counted only over the comparisons that rung
          newly constrains, with fibre size reported as the budget consumed.
        predicted_gain: >-
          MODELED, NOT MEASURED. A four-point curve per functional of validity
          gained against power lost, identifying the interior rung where both are
          acceptable, together with the algebraically predicted zero-power rungs.
          Charges are disjoint along a single chain by construction; the record
          does not attempt the full subset lattice of invariants, where they are
          not.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable ("fires") fixed and vary the forgotten structure:
          exhibit two comparisons with the same verdict at rung 1 whose verdicts
          diverge at rung 2, one because |Aut| explained the effect and one because
          it did not.
        predicted_gain: >-
          MODELED, NOT MEASURED. A counterexample pair from in-scope curves
          establishing that "the instrument fires against a matched null" is not
          identifying without its rung, plus the one-integer invariant that
          restores identifiability. If no such pair exists, matching depth is not
          doing any work at this p and that is a clean negative.
    quantifier_order: >-
      THE CAMPAIGN'S IMPLICIT CLAIM, written out: THERE EXISTS a null N such that
      FOR ALL functionals C, the comparison of the object against N is valid and
      has power. THIS RECORD CLAIMS THE ORDER IS THE OTHER WAY: FOR EACH functional
      C, THERE EXISTS a rung d(C) at which the comparison is valid and has power,
      and d(C) DEPENDS ON C -- there is no single null that serves every
      functional, because a rung that controls the nuisance of one functional is
      the rung that entails another. NOT CLAIMED: that no such uniform null exists
      (that would be a for-all over nulls this record cannot support), only that
      the campaign has not exhibited one and that its own functionals have
      different entailment rungs.
    method_ceiling:
      strongest_certifiable_claim: >-
        For the declared invariant list, the tested p and the declared functionals:
        the exact rung at which each functional becomes entailed, the exact fibre
        size at each rung, and a measured false-positive-versus-power curve with
        binomial intervals. The method can NEVER certify that a null is
        cryptographically or arithmetically meaningful (that is a judgement about
        mathematics, not a count), NEVER certify anything about invariants off the
        declared list, NEVER establish that CM curves do or do not carry
        attack-relevant structure, and NEVER convert a low false-positive rate into
        a positive finding.
      nearby_object_control: >-
        THE OBJECT ON WHICH THE HOPED-FOR CONCLUSION MUST FAIL: the group order N
        as the test statistic, at rung 1 or deeper. It is a function of (p, t), so
        the algebra says the false-positive rate must be exactly 0 and the power
        exactly 0 -- the null distribution is a point mass and the instrument can
        neither fire nor detect. A pipeline that reports ANY nonzero rate there is
        not conditioning on what it claims to condition on, and every cell of the
        ladder from that run is void. Symmetrically, two_torsion_x_count at rung 1
        must retain power, because IDEA-20260807-c015f5 records Var(z) of about 1.0
        within a class, so it is not a function of (p, t). A ladder that cannot
        separate that pair has identified nothing, and the pair costs minutes.
    proof_obligations:
      - claim: >-
          A test statistic measurable with respect to the matching key has a
          point-mass null distribution, hence power equal to size.
        responsibility: correctness
      - claim: >-
          N = p + 1 - t is a function of the rung-1 key, and the full-field
          liftable count is a function of (p, t, z) by the identity the committed
          run verifies.
        responsibility: correctness
      - claim: >-
          |Aut(E)| equals 6 at j = 0 when p is 1 mod 3 and 4 at j = 1728 when p is
          1 mod 4, verified at the chosen p rather than assumed.
        responsibility: correctness
      - claim: >-
          Rung 1 reproduces the committed NULL-A behaviour on the frozen slice.
        responsibility: baseline
      - claim: >-
          Every rung reports its fibre size, and a rung whose fibre is too small to
          sample is reported NOT CONSTRUCTIBLE rather than silently skipped.
        responsibility: feasibility
      - claim: >-
          The invariant list is committed before the first sample is drawn, with
          the git order as the evidence.
        responsibility: interface
      - claim: >-
          Every conclusion names the rung, the fibre size, the tested p and the
          functional; no verdict is reported without its rung.
        responsibility: scope

  predictions:
    - metric: >-
        false-positive rate of each declared functional against the matched null,
        as a function of matching rung d in {0, 1, 2, 3}, over at least 200 null
        draws per cell with binomial intervals
      direction: lower
      minimum_effect: >-
        Monotone non-increasing in d for every functional, reaching the nominal
        0.05 by rung 2 for at least one functional whose rung-0 rate exceeds 0.5.
        A rate that is NOT monotone beyond binomial error, or that stays above 0.5
        at rung 3, is the artifact signature of claim (E) and is reported before
        any other number.
    - metric: >-
        the entailment rung d*(C) -- the smallest rung at which the functional C is
        a function of the key -- predicted algebraically and then confirmed by a
        measured power of exactly the nominal size
      direction: different
      minimum_effect: >-
        Pre-registered per functional: d* = 1 for the group order; d* = 1 for the
        full-field liftable count only if z is added to the key, otherwise d* is
        undefined on this ladder and that is reported; d* undefined (never
        entailed) for two_torsion_x_count on rungs 0 to 3. Any disagreement between
        the predicted and measured d* is an implementation finding about the
        sampler and halts the ladder.
    - metric: >-
        false-positive rate of s3_monomial_support for a CM arm containing a j = 0
        curve against the rung-0 and rung-1 nulls
      direction: higher
      minimum_effect: >-
        At or above 0.95 at rungs 0 and 1 -- effectively deterministic, since a = 0
        holds in the object and holds in no null draw with probability 1 - O(1/p)
        -- and at or below 0.10 at rung 2, where |Aut| is matched. If the rung-0
        rate is below 0.5, claim (C1) is FALSE, the functional is not the
        deterministic separator this record says it is, and the claim is withdrawn.
    - metric: >-
        fibre size at each rung, per object, reported as an exact integer
      direction: lower
      minimum_effect: >-
        Reported raw with no threshold. Predicted to fall by orders of magnitude
        from rung 0 (all curves at p, about p in number) to rung 3 (the CM order's
        class, of order sqrt(p)) to a rung-2 fibre at j = 0 that may be a single
        twist family of size 6. Any rung whose fibre is below 20 is reported NOT
        CONSTRUCTIBLE at the nominal level, because 200 draws from a fibre of 6
        is resampling, not sampling.
    - metric: >-
        power against a planted CM-specific effect of magnitude 1.0 within-class
        standard deviation, as a function of rung
      direction: lower
      minimum_effect: >-
        Non-increasing in d, and strictly above the nominal size at the rung where
        the false-positive rate first reaches nominal, for at least one functional.
        If no functional has an interior rung where both hold, then no null on this
        ladder can support both directions of RQ-INSTR-f8faa0's decision target
        for that functional, and that is a measured obstruction with a number --
        a closure at the docs/inventor-protocol.md section 4 standard rather than a
        fatigue report.
    - metric: >-
        nearby-object control: false-positive rate and power for the group order N
        at rung 1
      direction: lower
      minimum_effect: >-
        Both exactly 0.0. Anything else means the sampler is not conditioning on
        the trace and every cell of the run is void.

  minimal_test:
    design: >-
      One executor task, five stages, confined to already-enumerable toy p.
      STAGE 0, ZERO COMPUTE, AND IT IS THE CHEAPEST VALID DISCRIMINATOR IN THIS
      RECORD. Declare and commit the ordered invariant list. For each declared
      functional decide, on paper, whether it is a function of each rung's key, and
      write the predicted entailment rung d*(C) and the predicted zero-power cells.
      Read harness/exp_kerfield.py's existing matched-null construction and record
      what ITS key is, rather than writing a second sampler blind. Claims (B) and
      (C1) are settled here with no execution.
      STAGE 1, minutes. The frozen fixture: rung 1 must reproduce the committed
      NULL-A behaviour on the p = 4001 slice. HALT AND REPORT on mismatch.
      STAGE 2, minutes. Enumerate the fibre at every rung for every declared object,
      report exact fibre sizes, and mark every rung NOT CONSTRUCTIBLE whose fibre is
      below 20. This alone may close rungs 2 and 3 at some p, and closing them for a
      stated reason is a complete deliverable.
      STAGE 3, an hour. The false-positive sweep: for each functional and each
      constructible rung, draw at least 200 matched nulls and record the fire rate
      with a binomial interval. Include the two nearby-object control rows (group
      order, which must be 0.0 at rung 1; two_torsion_x_count, which must retain
      power).
      STAGE 4, an hour. The power sweep: plant a CM-specific effect of declared
      magnitude on the object arm only, and repeat Stage 3 to obtain power per
      rung. Emit the four-point validity-versus-power curve per functional with the
      predicted zero-power cells marked.
      Every stage reports its output whether or not the predictions hold; unmeasured
      cells are emitted as null and never as 0.
    controls:
      - >-
        NEARBY-OBJECT CONTROL, BLOCKING: the group order N at rung 1, whose
        false-positive rate and power must both be exactly 0.0 by the algebra. Any
        nonzero value means the sampler is not conditioning as declared and the run
        is void.
      - >-
        CONTRAST ARM in the same control: two_torsion_x_count at rung 1, which must
        RETAIN power because Var(z) is about 1.0 within a class. A ladder that
        reports zero power for both has not identified the conditioning.
      - >-
        FROZEN-FIXTURE BASELINE at rung 1 against the committed NULL-A, which can
        fail and which halts the run if it does.
      - >-
        NULL INVARIANT: append to the key an invariant that is constant on every
        curve at p (for example the characteristic itself, already rung 0). The
        fibre size and every rate must be unchanged. A ladder whose numbers move
        when a vacuous invariant is added is measuring its own sampler.
      - >-
        FIBRE-SIZE GUARD: no rate is reported from a fibre below 20, and the rung is
        marked NOT CONSTRUCTIBLE with its integer instead.
      - >-
        DECLARATION-ORDER CONTROL: the invariant list is committed to git before the
        first draw, and the commit order is the artifact, not an assertion.
      - >-
        CONGRUENCE CHECK: at each chosen p, verify directly that p is 1 mod 3
        (respectively 1 mod 4) before treating j = 0 (respectively j = 1728) as
        having extra automorphisms. If it is not, the |Aut| instance does not arise
        at that p and the record says so rather than assuming it.
    required_metrics:
      - "the committed ordered invariant list, with its commit sha and timestamp"
      - "predicted entailment rung d*(C) per functional, with the algebraic argument"
      - "the matching key of the existing harness/exp_kerfield.py matched-null construction, read from source"
      - "exact fibre size per object per rung, with NOT CONSTRUCTIBLE marks"
      - "false-positive rate per (functional, rung) with binomial interval and draw count"
      - "power per (functional, rung) at the declared planted magnitude"
      - "the four-point validity-versus-power curve per functional, with predicted zero cells marked"
      - "nearby-object control rows: group order at rung 1 (must be 0.0) and two_torsion_x_count at rung 1 (must retain power)"
      - "per-p congruence status for j = 0 and j = 1728, verified not assumed"

  falsification_conditions:
    - >-
      The rung-1 fixture does not reproduce the committed NULL-A behaviour. The
      ladder does not embed the incumbent; nothing is concluded and the mismatch is
      reported as a defect.
    - >-
      The group order at rung 1 shows a nonzero false-positive rate or nonzero
      power. The sampler is not conditioning on the trace; every cell of the run is
      void and the sampler is the finding.
    - >-
      two_torsion_x_count loses all power at rung 1. The ladder is over-matching
      where the algebra says it should not, and the conditioning implementation is
      wrong.
    - >-
      s3_monomial_support's rung-0 false-positive rate against a j = 0 object is
      below 0.5. Claim (C1) is FALSE and is withdrawn; the functional is not the
      deterministic separator this record asserts.
    - >-
      The false-positive rate is already at the nominal level at rung 0 for every
      functional. Matching depth does not matter at this p, this record's concern is
      unfounded, and that is the reportable result.
    - >-
      The false-positive rate does not decay across the ladder for some functional.
      The responsible nuisance is off the declared invariant list; the artifact
      signature of claim (E) fires, and naming the missing invariant becomes the
      deliverable in place of the curve.
    - >-
      Rungs 2 and 3 are NOT CONSTRUCTIBLE at every tested p because the fibres are
      too small. The ladder cannot be climbed at toy scale; that is a
      constructibility result in IDEA-20260807-f6137c's own terms, reported with the
      integer fibre sizes and with the p at which the rung would first become
      constructible if that can be computed.

  confounders:
    - >-
      SMALL FIBRES MASQUERADING AS HIGH VALIDITY. A rung whose fibre has six
      members will show a low false-positive rate simply because there is almost
      nothing to differ. The fibre size is a required metric on every cell for
      exactly this reason, and no rate is reported below fibre size 20.
    - >-
      j = 0 AND j = 1728 ARE SINGLE CURVES UP TO TWIST. Conclusions about "CM curves
      with small discriminant" drawn from one j-invariant are conclusions about one
      curve. The design must include several small |D_0| beyond 3 and 4 and report
      per-discriminant, and it must never pool j = 0 with generic CM.
    - >-
      THE CONGRUENCE CONDITION ON p. Extra automorphisms exist at j = 0 only when p
      is 1 mod 3 and at j = 1728 only when p is 1 mod 4. p = 4001 is not assumed to
      satisfy either; the check is a required metric and if it fails at a chosen p
      the |Aut| instance simply does not arise there.
    - >-
      INVARIANT LIST ORDER IS A CHOICE. A different order gives a different ladder
      and a different curve. The order is declared before measurement and the record
      reports the ladder it declared; it does not search over orders, which would be
      a forking path with sixteen branches.
    - >-
      ENTAILMENT ARGUMENTS ARE MIXED IN STRENGTH. "N is a function of (p, t)" is a
      theorem; "s3_monomial_support is a function of whether a and b vanish" rests
      on IDEA-20260807-efc8de's reading of source that this session did NOT open.
      Rows carry their argument's status and are never pooled.
    - >-
      REJECTION SAMPLING AT DEEP RUNGS IS EXPENSIVE OR IMPOSSIBLE. At rung 3 the
      acceptance rate can be O(1/sqrt(p)), so the sampler must enumerate the fibre
      directly from the committed class enumeration rather than reject, and the
      switch must be recorded because the two have different exactness properties.

  interpretation_limits:
    - >-
      NOTHING HERE CLAIMS THAT CM CURVES DO OR DO NOT CARRY ATTACK-RELEVANT
      STRUCTURE. Every measured effect is between an arm and its null and the whole
      content is which invariants the comparison controls. Reading a rung-0 firing
      as a CM finding is exactly the error this record exists to prevent.
    - >-
      A verdict without its rung is uninterpretable and must not be reported.
      "The instrument fires against a matched null" is not a statement until the
      matching key is named.
    - >-
      Scoped to the declared invariant list, the tested p with their congruence
      status, the declared functionals, the fibre sizes actually achieved and the
      harness commit. Toy tier under docs/claims-and-verification.md; the |Aut|
      facts are structural properties of small curves, not attack costs.
    - >-
      The proposed clause-scoped correction to RQ-INSTR-f8faa0's scope is NAMED
      here and is not performed. This record edits no question, moves no
      hypothesis, and creates no correction record.
    - >-
      This record asserts nothing about H-STR-002, phi_alpha or any verdict in
      DEC-20260727-009.

  heuristic_assumptions:
    - id: HK-1
      statement: >-
        (Sufficiency of the declared invariant list.) For the declared functionals
        and the tested p, the systematic difference between a CM arm and a
        random-curve arm at the same p is carried entirely by the invariants
        (t, |Aut|, f, D_0), in the sense that conditioning on all four reduces every
        functional's false-positive rate to its nominal level within binomial error.
      rigorous_support: >-
        RIGOROUS INGREDIENTS FIXING THE QUANTITIES, and they are real: N = p + 1 - t
        exactly; #Aut determines the twist family and the size (p-1)/|Aut| of the
        F_p-isomorphism orbit, as recorded in IDEA-20260807-efc8de; and the CM order
        determines End(E) and hence the class number h and the module structure of
        E(F_p). CLASSICAL RESULT IMITATED: the Deuring correspondence and the
        classical theory of complex multiplication, under which the F_p-isomorphism
        classes with a given endomorphism order form a principal homogeneous space
        for the class group -- so conditioning on the order is conditioning on the
        orbit, which is the strongest available conditioning short of the curve
        itself. THE HEURISTIC HALF, DECLARED: that no FIFTH invariant matters at
        these p for these functionals. That is exactly what prediction (E) tests and
        it is the assumption most likely to be false.
      validation_plan: >-
        WHAT TO SAMPLE: at each tested p, all four rungs times all declared
        functionals times at least 200 null draws, plus the held-out arm below.
        SCALE: with p of order 2^12 and complete class enumeration already paid by
        the committed run, this is on the order of 10^5 functional evaluations,
        minutes for the cheap functionals and bounded by the O(p) group_structure
        cost for the expensive one, which is sampled at reduced draw count and
        reported as such. SHORTCUT USED TO REACH SCALE: complete enumeration of the
        isomorphism classes at p, already implemented, so no sampling heuristic is
        needed at all and the fibre is exact -- this is why the validation route is
        unusually strong for a heuristic of this kind and it is stated rather than
        implied. PREDICTED DISTRIBUTION: the rung-3 false-positive rate lies within
        the binomial 95 percent interval of the nominal 0.05 for every functional.
        TAIL CHECK, AND IT IS THE INFORMATIVE ONE: the single functional with the
        highest residual rung-3 rate is examined directly, and if its rate is above
        nominal the invariant responsible is hunted by adding candidate fifth
        invariants one at a time and reporting which one collapses it. HELD-OUT
        ARM: repeat at a second p with a different congruence class mod 12, so the
        |Aut| structure differs, and require the conclusion to be stated per p and
        never pooled. TRANSFER ASSUMPTION, STATED EXPLICITLY: nothing here transfers
        to p outside the tested set, and nothing transfers to cryptographic scale,
        where the fibre cannot be enumerated and the whole construction is
        unavailable.
    - id: HK-2
      statement: >-
        (Monotone validity-power trade.) Along the refinement ladder, the
        false-positive rate is non-increasing in the rung and the power against a
        fixed alternative is non-increasing in the rung, so the two curves cross at
        most once and an interior rung, if one exists, is unique.
      rigorous_support: >-
        RIGOROUS HALF: refinement shrinks the null's support, which is a set
        inclusion, so the conditional test at rung d+1 is the rung-d test restricted
        to a subset -- validity is non-decreasing by construction. CLASSICAL RESULT
        IMITATED: the standard fact that conditioning on more of a sufficient
        statistic yields an exact conditional test with weakly smaller reference
        set. THE MODELLED HALF: monotonicity of POWER is NOT a theorem, because a
        refinement can remove a nuisance that was masking the alternative and thereby
        RAISE power. That is a real possibility, it would show as a non-monotone
        power curve, and it would be an interesting positive rather than an error --
        so the record predicts monotonicity and pre-registers the opposite reading
        rather than treating a violation as a bug.
      validation_plan: >-
        WHAT TO SAMPLE: the same four-rung grid with a planted alternative of
        declared magnitude on the object arm only, at three magnitudes spanning 0.5,
        1.0 and 2.0 within-class standard deviations, 200 draws per cell. SCALE:
        3 magnitudes times 4 rungs times the declared functionals, still minutes,
        because the planting is additive on already-measured vectors and needs no
        new enumeration. PREDICTED DISTRIBUTION: power non-increasing in the rung at
        every magnitude, within binomial error. TAIL CHECK: any cell where power at
        rung d+1 exceeds power at rung d by more than the binomial interval is
        reported as a masked-nuisance candidate and the invariant added at that rung
        is named as the mask. TRANSFER ASSUMPTION: measured at the declared
        magnitudes and functionals only; the crossing rung is not claimed to be the
        same for an alternative of a different shape.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. Ladder cost, stated in the campaign's
      own dominant term: the fibres are read off the complete isomorphism-class
      enumeration that harness/isogeny_class.py already performs at O(p^2) field
      operations, which is paid once per p and dominates everything else in this
      lane. Given that enumeration, the ladder itself is 4 rungs times the declared
      functionals times 200 draws times 3 planted magnitudes, on the order of 10^5
      to 10^6 functional evaluations, i.e. minutes, EXCEPT for group_structure,
      which costs O(p) lift_x calls per curve and is therefore O(p * fibre) per
      cell -- about 5.5e5 calls per class at p = 4001 by IDEA-20260807-efc8de's own
      accounting, which is why it is sampled at reduced draw count and reported as
      such.
    memory_exponent: >-
      O(fibre size) curve records per rung plus O(draws) statistic values --
      kilobytes to megabytes at toy p. The binding memory term is the enumeration's
      own, unchanged by this proposal. No time-memory tradeoff applies and none is
      claimed; stated beside time because the asymptotic-form-honesty rule requires
      it.
    best_known: >-
      There is no incumbent, and the reason is the record's claim (A): the isogeny
      lane has no random-curve null sampler at all, so the incumbent value on every
      metric here is UNDEFINED rather than poor. The nearest incumbent is the
      bit-length-matched between-class comparison called NULL-A in
      harness/exp_icinv.py's docstring, which is rung 1 restricted to a coarsened
      key and which IDEA-20260807-34754f already characterises as nearly vacuous at
      fixed p. A matched-null construction exists in the kerfield lane
      (harness/exp_kerfield.py) and its matching key is UNREAD, so whether it
      already implements a rung of this ladder is an open question this record
      leaves open rather than answers. The attack frontier is untouched: parallel
      rho at 0.886*sqrt(N) with O(1) memory, the automorphism-discounted variant on
      CM curves, and BSGS at sqrt(N) time and memory.
    hidden_overhead: >-
      DISCLOSED, four items. (i) The O(p^2) enumeration is the hidden cost and it
      confines the whole design to p of order 2^12 to 2^14; at those p every
      "attack-cost functional" is degenerate as an attack cost, which bounds what
      the ladder can ever say. (ii) Deep rungs have small fibres, so the effective
      sample size collapses faster than the rung index suggests and the fibre size
      must be read as the real budget. (iii) HK-1's sufficiency is exactly the thing
      that can be false, and its failure mode is silent -- a rate that stays high
      with no invariant to blame. (iv) The whole construction is unavailable at
      cryptographic scale, where the fibre cannot be enumerated; that is
      IDEA-20260807-f6137c's Closure 2 obstruction reappearing here, and this record
      does not evade it.
    tradeoff_note: >-
      THE TRADEOFF IS VALIDITY AGAINST POWER AND THE DELIVERABLE IS THE CURVE, NOT
      A RECOMMENDED NULL. Refining the matching key monotonically removes candidate
      explanations of a difference (validity gained) and monotonically shrinks the
      null's support (power lost, and at the entailment rung lost entirely). The
      report emits the four-point curve per functional with the algebraically
      predicted zero-power cells marked, and explicitly declines to recommend a
      rung: which null a lane adopts is a Coordinator decision on reviewed evidence.
      Parallelization is trivial across rungs and draws and is not claimed as a
      contribution.

  dominated_by: >-
    AS AN ATTACK: n/a, no attack is mounted, no discrete logarithm is computed, no
    cost axis is contested; every row of the prime-field frontier dominates
    trivially across time, memory and data/queries.
    AS A CONTROL, checked record by record rather than asserted.
    (1) IDEA-20260807-34754f: NOT dominating and NOT dominated. It designs a
    PERMUTATION null -- a randomization over labels with the curve set fixed --
    while this designs a RESAMPLING null over curves with the labels fixed. Its
    stratification blocks are a conditioning set and are therefore a special case
    of a matching key, so the two records meet exactly there; what 34754f lacks is
    the entailment check and the CM instance, and what this lacks is 34754f's
    quantitative N-contamination diagnosis, which it does not reproduce.
    (2) IDEA-20260807-f6137c: PARTIALLY DOMINATES on the constructibility bit,
    which it defines first and better; this record's fibre-size metric is that bit
    computed per rung, and Closure 2's circularity argument is the over-matching end
    of this ladder argued for one estimand. This record must be written as
    instantiating f6137c's bits, not as discovering them.
    (3) IDEA-20260807-c015f5: its L3 row already names |D_0| as a DECAY parameter
    for a claimed CM effect and already quotes the sqrt(2) rho discount past
    |D_0| = 4. That is the closest committed statement to claim (C) and it
    DOMINATES this record on the decay reading of |D_0|. It is a different
    instrument -- a decay test on a claimed effect, not a matching invariant for a
    null -- so neither subsumes the other, and this record composes with it.
    (4) IDEA-20260807-efc8de: complementary. Its Family 2 already flags that
    j = 0 and j = 1728 have smaller isomorphism orbits and must be reported
    per-|Aut|; this record turns that confounder into a matching rung. The
    observation that s3_monomial_support depends on whether a and b vanish is
    efc8de's and is credited, not re-derived.
    (5) IDEA-20260829-bd9f66 and IDEA-20260829-28e420, the siblings filed the same
    day: complementary and disjoint in object -- the attainable outcome set of a
    verdict, the read-set of an instrument, and the conditioning set of a null are
    three different degeneracies, and a functional could exhibit all three.
    (6) Against standard conditional-inference practice: DOMINATED CONCEPTUALLY AND
    ADMITTEDLY SO. Conditioning on a sufficient statistic and the resulting
    validity-power trade are textbook; nothing about them is claimed new. What is
    claimed unmeasured is this ladder on these curves, and that measurement exists
    nowhere.
    DISCLOSED LIMIT: eleven of the eighteen proposals filed under this question
    were not read in full this session and are known only by their one-line titles
    in the prior-art file supplied to this session; the domination argument for
    those rows rests on those titles and a validator should check them rather than
    accept this. Externally, no search of the conditional-inference literature was
    run, so external dominance is UNCHECKED rather than absent, and novelty_status
    is unverified accordingly.
  sota_delta: >-
    No attack, no exponent, zero delta on every attack cost axis at every field
    size. Quantitatively, against the committed state: the number of invariants
    this campaign's declared "matched random-curve null" is stated to hold fixed is
    exactly ONE (p) today, target four with the entailment rung computed for each
    functional; the number of random-curve null samplers in the isogeny lane is 0
    today, target one with a declared and committed key; the number of committed
    functionals for which anyone has checked whether the null's key DETERMINES the
    statistic is 0 today, target all seven, with at least two predicted entailed on
    paper before any compute (the group order at rung 1, the full-field liftable
    count once z enters the key); the false-positive rate of any instrument against
    a matched random-curve null is unmeasured today at every rung, target a 4-by-7
    table with binomial intervals and exact fibre sizes. The sharpest single number
    is prediction 3: an s3_monomial_support false-positive rate at or above 0.95 at
    rung 1 against a j = 0 object would be a deterministic instrument firing on a
    matched null -- the exact disqualifying condition RQ-INSTR-f8faa0 names for a
    positive -- established on the curve family the question's own scope singles
