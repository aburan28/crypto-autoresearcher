idea:
  id: IDEA-20260811-dcbea4
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CANL-63098f
  goal_id: GOAL-ENDO-001
  title: >-
    THE COST OF WRITING A GLOBAL CM LIFT DOWN IS |D|^{1+o(1)} AT THE FLOOR AND
    |D_0|^{1+o(1)} AT THE CRATER, SO ASCENDING THE VOLCANO BUYS A FACTOR f^2 --
    and the only classes where a lift is polylog-writable are those with
    |D_0| = polylog, whose density among ordinary classes is p^{-1/2+o(1)}; the
    escape named in this lane's existing cost record is therefore real, exactly
    quantified, and measurably almost never available
  class: measurement

  claim: >-
    (A) THE TWO-SIDED SIZE IDENTITY. For a CM point of discriminant D, the
    largest archimedean conjugate of j satisfies log|j| = pi sqrt(|D|) + O(log|D|)
    from the q-expansion with q = exp(2 pi i tau) and Im tau = sqrt(|D|)/2 for
    the principal form; and the class polynomial has degree h(D) = |D|^{1/2+o(1)}.
    So the global algebraic object -- the minimal polynomial of the lift's
    j-invariant -- has total bit size h(D) * pi sqrt(|D|) / log 2 =
    |D|^{1+o(1)}, which is IDEA-20260807-ee6ef7's committed figure.
    (B) THE VOLCANO CORRECTION, WHICH THAT RECORD DOES NOT MAKE. Inside one
    isogeny class the discriminant of End(E) is not |D| but |D_0| f_E^2, and the
    attacker chooses f_E by ASCENDING, which is canonical and polynomial. At the
    crater the global lift's bit size is |D_0|^{1+o(1)} rather than
    |D|^{1+o(1)} = (|D_0| f^2)^{1+o(1)}. The ascent therefore buys a factor
    f^2 = |D|/|D_0| in the cost of writing the lift down -- 256 on the committed
    p = 4001 class, and unbounded in general.
    (C) THE DENSITY, WHICH IS WHAT DECIDES THE LANE. A polylog-writable global
    lift requires |D_0| = (log p)^{O(1)}, i.e. f = sqrt(|D|/|D_0|) =
    p^{1/2+o(1)}: the discriminant must be an almost perfect square times a tiny
    fundamental part. Modelling D = t^2 - 4p as a typical integer of its size, the
    density of ordinary classes with conductor at least B is Theta(1/B), so the
    density with |D_0| below any fixed polylog bound is p^{-1/2+o(1)}. The escape
    named in IDEA-20260807-ee6ef7 -- "the only evasion is h(disc End) = O(1)" --
    is therefore genuine, reachable by ascent rather than unreachable, and
    available on a p^{-1/2+o(1)} fraction of classes. Those three statements
    together are the record's content and the third is measurable.
    (D) WHAT THIS DOES AND DOES NOT CHANGE. It does NOT produce an attack: on the
    rare classes where the lift is cheap to write, the height-budget identity of
    IDEA-20260807-6533fd still applies to the lifted POINTS, and
    IDEA-20260807-fd5a24's norm-form gap still says the CM order contributes no
    new lattice vectors inside the budget. What it changes is the lane's scoping
    statement: the campaign should stop describing the canonical lift as
    uniformly unwritable and start describing it as writable exactly on a
    measurable, vanishing family -- which is a sharper statement and one that a
    curve-selection guideline can use.
    (E) THE SECOND-ORDER CONSEQUENCE WORTH RECORDING. The crater's lift being
    cheap is a statement about the GLOBAL object. The p-ADIC lift to precision
    p^m is cheap at every level (it is a Hensel lift), and the two must not be
    conflated; IDEA-20260811-dc6ece handles the p-adic side and shows it carries
    no class information at all.

  mechanism: >-
    A CM j-invariant is huge because it is a modular function evaluated near the
    cusp, and how near is governed by sqrt(|D|). The conductor enters
    quadratically into the discriminant and hence linearly into sqrt(|D|), so
    each vertical step up the volcano divides the exponential size of the global
    object by ell. Because ascent is canonical and cheap, the attacker always
    takes it, and the honest cost of the lift is therefore the crater's cost, not
    the floor's.

  tracked_object: >-
    The bit size of the minimal polynomial of the lift's j-invariant, carried as
    the pair (degree h, log of the largest archimedean conjugate), tracked as the
    curve moves up and down the volcano.

  resource: >-
    R6 (lifts to characteristic zero) and R3 (the endomorphism ring's
    discriminant). No point of G is touched; H-ENDO-001 satisfied.

  lossy_projection_test: >-
    PASSES. The projection curve -> (h, log|j|_max) retains two integers and
    discards the lift entirely; every member of a level shares the pair.
    Propagation is exact: horizontal isogenies fix both coordinates, a vertical
    ell-step multiplies sqrt(|D|) by ell^{+-1} and multiplies h by
    ell * (1 - (D_0/ell)/ell)^{+-1}. That is a deterministic one-step rule with
    explicit constants, which is what makes the size a tracked object and not a
    remark. The record also states the counter-lesson explicitly: a smaller
    global object does NOT imply a cheaper attack, exactly as an exact 30.8
    percent reduction in S_3 support moved Groebner time by -0.44 percent; the
    size identity is a cost of REPRESENTATION and is claimed for nothing else.

  t5_reachability: >-
    SATISFIED IN THE UNUSUAL DIRECTION, and that is the record's most interesting
    structural point. The good vertex here is the crater, goodness is detectable
    locally (level membership by IDEA-20260811-5e4cd5, or by the group-structure
    shortcut where non-vacuous), and reaching it requires ASCENT, which is
    canonical -- from a non-crater vertex there is exactly one ascending
    ell-isogeny -- and therefore costs a polynomial number of steps with no
    search and no vectorization. So this is a case where T5 does not bind at all.
    What binds is (D): the prize behind the gate is a representation-size saving
    on a lane whose attack cost is already fatal for other reasons.

  null_object: >-
    For the density half, the null is a set of integers of the same size as
    t^2 - 4p drawn uniformly, whose conductor distribution must match the
    measured one; a systematic difference would mean t^2 - 4p is NOT behaving
    like a typical integer of its size, which is itself a finding and is the
    canonical artifact tell for HA-1. For the size half, the null is a NON-CM
    curve of similar height, whose j-invariant has no such growth law; the
    instrument must show the pi sqrt(|D|) law only for CM points.

  why_not_a_renamed_known_approach: >-
    IDEA-20260807-ee6ef7 already prices the class polynomial at |D|^{1+o(1)} time
    and p^{1/2+o(1)} space and already names small h(disc End) as the only
    evasion. This record differs in three specific ways: it observes that the
    relevant discriminant is the CRATER's and that ascent is cheap, so the
    attacker never pays the floor's price; it converts "the only evasion" into a
    measurable density; and it separates the global cost from the p-adic cost,
    which that record does not do. The classical size asymptotics are not claimed
    as novel.

  novelty_status: adaptation
  novelty_screen: >-
    Screened this session against the full RQ-CANL lane (IDEA-20260807-cfe576,
    -ee6ef7, -44ba75, -6533fd, -11b93d, -dbb250, -fd5a24, -761a8c, -13c821,
    IDEA-20260808-5158fa) and the RQ-VOLC ascent record IDEA-20260807-bb03d3,
    which establishes that simultaneous small-ell ascent is polynomial and lands
    on a Cl(O)-torsor. WEB SEARCH UNAVAILABLE this session; the q-expansion size
    law, Brauer-Siegel and the conductor density are classical.

  discriminated_from: >-
    NOT IDEA-20260807-ee6ef7, whose cost figure this record refines by a factor
    f^2 and whose named evasion it quantifies. NOT IDEA-20260807-11b93d, which
    analyses what a small |disc End| buys inside the XEDNI COEFFICIENT SET and
    concludes the surviving gain is a constant of order C_0; that is about the
    lift's usefulness, this is about its writability, and the two multiply. NOT
    IDEA-20260807-bb03d3, whose ascent algorithm this record CONSUMES as the
    reason the crater's discriminant is the operative one. NOT
    IDEA-20260811-5e4cd5, which uses class polynomials as a level instrument;
    this record is about their SIZE.

  assumptions:
  - >-
    log|j(tau)| = pi sqrt(|D|) + O(log|D|) for the principal reduced form, from
    the q-expansion j = 1/q + 744 + ... [recall-confident, classical].
  - >-
    h(D) = |D|^{1/2+o(1)} by Brauer-Siegel, with INEFFECTIVE constants, which is
    stated because it forbids any concrete lower bound on h from the asymptotics.
  - >-
    Ascending the volcano is polynomial and canonical (exactly one ascending
    ell-isogeny from a non-crater vertex) [recall-confident: Kohel;
    Fouquet-Morain; Sutherland], and the ascent's own cost is charged separately
    and is Otilde(ell^2) per step or better.
  - >-
    D = t^2 - 4p behaves like a typical integer of its size with respect to its
    conductor. This is HA-1 and it is the record's one genuine heuristic.

  proof_search_map:
    bottleneck: >-
      Writing the global lift down. Every lift-based attack must represent the
      lifted curve before it can search for points on it, and the representation
      cost is |disc End|^{1+o(1)}.
    baseline_embedding:
      parameter_slice: >-
        f = 1 reproduces IDEA-20260807-ee6ef7's figure exactly, since there
        |D_0| = |D| and the crater is the whole class. The record is a strict
        family extension through that boundary and must reproduce it there.
      reproduction_check: >-
        Symbolic and numeric: for a class with f = 1, the computed class
        polynomial's bit size must match pi sqrt(|D|) h(D)/log 2 within the
        stated O(log|D|) per coefficient, reproducing the committed figure.
    observation_collision:
      observable: >-
        The pair (h, log|j|_max), i.e. the lift's representation size.
      distinct_preimage_search: >-
        Two classes with the same |D| but different |D_0| -- for example
        |D| = 15104 with D_0 = -59, f = 16, and a squarefree |D| of the same size
        -- have the same FLOOR cost and radically different CRATER costs. This
        pair is the record's own falsification target: it must show a cost
        separation, and if it does not the ascent argument is wrong.
    constructive_transforms:
    - transform: boundary_lift
      proposed_object: >-
        Extend the cost statement from a single class (ee6ef7) to the family
        indexed by f, and prove a strict inward improvement (factor f^2) rather
        than merely noting feasibility at the crater.
      predicted_gain: >-
        A factor f^2 in representation size, and NO gain in attack cost, which is
        stated in the same breath because the two are routinely conflated.
    - transform: specialization_pack
      proposed_object: >-
        Charge the ascent cost and the representation cost over disjoint phases,
        so a cheap crater lift cannot be quoted without its ascent bill.
      predicted_gain: >-
        An honest total, which is the deliverable.
    quantifier_order: >-
      For every ordinary class there EXISTS a member (any crater vertex) whose
      global lift has representation size |D_0|^{1+o(1)}, and the witness is
      computable by ascent in polynomial time. For all epsilon, the fraction of
      ordinary classes with |D_0| below (log p)^{O(1)} is at most p^{-1/2+epsilon}
      -- a universal statement over classes, conditional on HA-1.
    method_ceiling:
      strongest_certifiable_claim: >-
        A representation-size law and a density. It cannot certify that a cheap
        lift is a useful lift; the lane's standing negatives on height budget,
        norm-form gap and target module all survive it untouched, and the record
        says so in (D) rather than leaving it to a reader.
      nearby_object_control: >-
        A class with f = 1, where the desired conclusion FAILS -- there is no
        ascent to take and the crater cost equals the floor cost. A method that
        reports a saving there is measuring its own arithmetic wrongly.
    proof_obligations:
    - claim: log of the largest conjugate of j is pi sqrt(|D|) + O(log|D|).
      responsibility: size
    - claim: Ascent to the crater is polynomial and canonical.
      responsibility: runtime
    - claim: The density of classes with polylog |D_0| is p^{-1/2+o(1)}.
      responsibility: success_probability
    - claim: A cheap lift does not imply a cheap attack.
      responsibility: scope
    not_applicable_reason: null

  predictions:
  - metric: bit_size_of_the_class_polynomial_per_level
    direction: lower
    minimum_effect: >-
      Ratios across the five levels of the committed class of approximately
      1 : 2 : 4 : 8 : 16 in log|j|_max (linear in f_E) and correspondingly in
      total bit size, matching pi sqrt(|D_0|) f_E within 10 percent per level. A
      flat profile falsifies (A) and (B) together.
  - metric: measured_conductor_tail_distribution
    direction: different
    minimum_effect: >-
      P(f >= B) = c/B + o(1/B) over B in [2, 100], with c measured, on at least
      10^5 admissible (p, t) pairs at 30 to 50 bits. A tail decaying like 1/B^2
      or slower than 1/B falsifies HA-1 and changes the density in (C) by a
      power.
  - metric: fraction_of_classes_with_D_0_below_a_polylog_bound
    direction: lower
    minimum_effect: >-
      Consistent with p^{-1/2+o(1)}, i.e. essentially zero at 30 to 50 bits and
      requiring the tail law rather than direct observation. The record predicts
      the DIRECT count will be zero or near zero at every tested size and is
      explicit that the density claim therefore rests on the tail fit, not on a
      direct count.
  - metric: ascent_cost_to_the_crater_in_field_operations
    direction: different
    minimum_effect: >-
      Polynomial in log p and in the ell used, with the measured total for the
      committed class (4 vertical 2-steps at worst) below 10^6 field operations
      -- so that the ascent bill is demonstrably negligible against the
      representation saving it unlocks.

  minimal_test:
    design: >-
      PART 1, sizes, minutes: compute the five class polynomials of the committed
      class (shared with IDEA-20260811-5e4cd5, so this is free if that record
      runs first), measure log of the largest coefficient and the total bit size
      per level, and fit against pi sqrt(|D_0|) f_E. PART 2, density, hours: for
      p at 30, 40 and 50 bits, enumerate admissible traces, factor t^2 - 4p, and
      tabulate the conductor distribution; fit the tail against c/B and report
      the fitted c with its confidence interval. PART 3, ascent cost: measure the
      field operations to ascend from a floor vertex to the crater on the
      committed class, with a certificate for each vertical step.
    controls:
    - >-
      SQUAREFREE-D CONTROL: a class with f = 1 of comparable |D|, where no ascent
      exists and no saving may be reported.
    - >-
      RANDOM-INTEGER NULL for the conductor distribution, which must match the
      measured one under HA-1; a mismatch is the artifact tell and is the
      interesting outcome of Part 2.
    - >-
      NON-CM CONTROL for the size law: a random j-invariant's minimal polynomial
      has no pi sqrt(|D|) growth, so the instrument must not report one.
    - >-
      TWO INDEPENDENT class-polynomial computations, since a wrong H_D would
      produce a perfectly self-consistent and false size profile.
    required_metrics:
    - per_level_log_max_coefficient_and_total_bit_size
    - fitted_size_law_slope_against_f_E
    - conductor_tail_distribution_with_fitted_c
    - direct_count_of_small_D_0_classes_per_p
    - ascent_field_operation_count_with_step_certificates

  falsification_conditions:
  - >-
    Class-polynomial bit size is flat across levels. The size identity (A) or the
    volcano correction (B) is wrong; since both are classical, suspect the
    computation first.
  - >-
    The conductor tail is not Theta(1/B). HA-1 fails, the density in (C) is
    wrong by a power, and the lane's scoping statement must be rewritten -- a
    real negative and a cheap one.
  - >-
    Ascent cost is not negligible against the representation saving at the tested
    sizes. The record's central "the attacker always ascends" premise fails at
    concrete parameters even if it holds asymptotically, and both must be
    reported.
  - >-
    The non-CM control shows the same growth law. The size instrument is
    measuring coefficient magnitude generically and its per-level profile is void.

  confounders:
  - >-
    THE p-ADIC LIFT IS CHEAP AT EVERY LEVEL and has nothing to do with this
    record's cost law. Conflating the two would make the whole record look wrong
    or trivially right depending on direction; the separation is stated in (E)
    and is delegated to IDEA-20260811-dc6ece.
  - >-
    Brauer-Siegel's ineffectivity means no concrete bound on h follows from the
    asymptotics, so all concrete statements must come from measured h values and
    not from the exponent.
  - >-
    Enumerating admissible traces for the density fit requires primality tests on
    p = N + t - 1 or an equivalent thinning, and that thinning could correlate
    with the conductor; report the raw and thinned distributions separately.
  - >-
    Small-|D_0| classes are exactly the classes with j = 0 and j = 1728 among
    others, which carry the automorphism confound; the density measurement must
    report them separately since |Aut| > 2 changes class-number weighting by the
    Hurwitz convention.

  interpretation_limits:
  - >-
    TOY TO MEDIUM SCALE, claim_tier toy. NO ATTACK, NO EXPONENT, NO SPEEDUP;
    sota_delta zero.
  - >-
    A REPRESENTATION-SIZE saving is not an attack saving. The lane's committed
    negatives -- height budget N^{2/r} (IDEA-20260807-6533fd), the norm-form gap
    (-fd5a24), the target-module gate (-dbb250), the point-lifting closure
    (-cfe576) -- all survive this record unchanged and apply to the crater lift
    exactly as to the floor lift.
  - >-
    H-ENDO-001 used, not retested; KN-FIND-b7e091 binding; P2 respected.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      For p prime and t ranging over admissible traces, the conductor f of
      D = t^2 - 4p is distributed as the conductor of a uniformly random integer
      of size about 4p, so P(f >= B) = Theta(1/B) with an absolute implied
      constant, uniformly for B up to p^{1/4}.
    rigorous_support: >-
      Rigorous ingredients: f^2 divides |D| <= 4p, so f <= 2 sqrt(p)
      unconditionally; and the density of integers divisible by f^2 is exactly
      1/f^2, whose tail sum over f >= B is Theta(1/B). The classical distribution
      imitated is the squarefree density 6/pi^2 and its generalisation to
      conductors of quadratic discriminants -- the same shape as the standard
      heuristic for the distribution of class numbers in a family.
    validation_plan: >-
      Direct enumeration, no sampling needed: for p at 30, 40 and 50 bits,
      enumerate ALL admissible t (about 4 sqrt(p), i.e. up to 10^8 at 50 bits, so
      the largest size is sampled rather than enumerated and this is recorded),
      factor t^2 - 4p, and compare the empirical tail against c/B by a
      Kolmogorov-Smirnov statistic on the log-scale. Tail checks: the maximum
      observed conductor against the predicted extreme value (predicted about
      sqrt(p)/constant for the largest of 4 sqrt(p) draws), and the count of
      classes with f > p^{1/4}, predicted about p^{1/4} in number. Sampled
      parameters and any thinning by the primality condition are recorded
      explicitly; transfer to crypto scale is NOT claimed and rests on the
      classical density.
  - id: HA-2
    statement: >-
      The largest archimedean conjugate of a CM j-invariant of discriminant D
      satisfies log|j| = pi sqrt(|D|) + O(log|D|), uniformly over the classes
      considered.
    rigorous_support: >-
      The q-expansion j(tau) = q^{-1} + 744 + 196884 q + ... converges for
      Im tau > 0 and gives the leading term exactly; the O(log|D|) absorbs the
      remaining terms and the choice of reduced form. This is classical analysis
      rather than a distributional assumption, and it is listed because the
      constant matters for the per-level ratio prediction.
    validation_plan: >-
      Measured directly from the computed class polynomials of the five levels,
      compared against pi sqrt(|D_0|) f_E. Tail check: the SMALLEST conjugate,
      whose logarithm is predicted to be O(1) rather than large, since the
      smallest conjugate corresponds to the largest leading coefficient among
      reduced forms -- a check that distinguishes a correct size law from a
      coincidence of magnitudes.

  target_complexity:
    time_exponent: >-
      Writing the global lift: |D_0|^{1+o(1)} bit operations at the crater versus
      |D|^{1+o(1)} = (|D_0| f^2)^{1+o(1)} at the floor, with |D| = Theta(p) in
      general. NO ATTACK EXPONENT MOVES: the lane's attack cost is governed by
      the height budget N^{2/r}, which this record does not touch.
    memory_exponent: >-
      h(D_0)^{1+o(1)} * sqrt(|D_0|) bits at the crater against
      p^{1/2+o(1)} * sqrt(p) at the floor; the crater's memory saving is the
      same factor f^2 and is the more binding of the two axes in practice.
    best_known: >-
      IDEA-20260807-ee6ef7's committed figure, |D|^{1+o(1)} time and
      p^{1/2+o(1)} space, which this record refines rather than contradicts.
    hidden_overhead: >-
      The ascent bill, charged separately in Part 3, and the factorisation of
      D = t^2 - 4p needed to know f at all, which is free at toy scale and
      subexponential at crypto scale. Neither is absorbed into the headline.
    tradeoff_note: >-
      The p-adic lift is a genuinely different point on the representation
      tradeoff -- polylog size at any level, but carrying no class information
      (IDEA-20260811-dc6ece) -- and the two are reported as separate rows rather
      than interpolated.

  dominated_by: >-
    As an attack: dominated by every frontier row, since no attack is proposed --
    parallel rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006),
    the automorphism-discounted variant (KN-TECH-018), BSGS at sqrt(N)/sqrt(N)
    (KN-TECH-031); and additionally dominated within its own lane by the height
    budget of IDEA-20260807-6533fd, which kills lift attacks at arity r <= 4
    before representation size is even reached. As a cost statement about the
    lift's representation: it dominates IDEA-20260807-ee6ef7 by the factor f^2
    for classes with f > 1 and equals it for f = 1.
  sota_delta: >-
    Zero on every attack axis. Against the lane's own committed cost record: a
    factor f^2 refinement of the representation cost, plus a measured density
    p^{-1/2+o(1)} where that record has the qualitative phrase "the only evasion".

  estimated_cost:
    implementation: low
    compute: medium

  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that the per-level size ratios come out as 1:2:4:8:16 within band. 0.75
    that the conductor tail measures as Theta(1/B) with a clean constant. 0.00
    that any of it produces an attack, and the record is written so that a reader
    cannot mistake a representation saving for one. Filed medium: it is a real
    refinement of a committed cost claim in the campaign's most under-populated
    lane, and Part 1 is free if IDEA-20260811-5e4cd5 runs first.

  source_refs:
  - ledger/proposals/IDEA-20260807-ee6ef7.yaml (the committed cost figure this
    record refines)
  - ledger/proposals/IDEA-20260807-6533fd.yaml (height budget; the lane's binding
    negative, untouched here)
  - ledger/proposals/IDEA-20260807-fd5a24.yaml (norm-form gap)
  - ledger/proposals/IDEA-20260807-bb03d3.yaml (polynomial simultaneous ascent,
    consumed as the reason the crater is the operative vertex)
  - ledger/proposals/IDEA-20260811-5e4cd5.yaml (shares the class-polynomial
    computation)
