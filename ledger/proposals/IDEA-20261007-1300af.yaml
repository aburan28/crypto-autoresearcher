idea:
  id: IDEA-20261007-1300af
  question_id: RQ-GFPN-c01af8
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Trace-zero share of affine x-coordinates on a toy double-odd curve
  class: measurement
  claim: >-
    On the smallest prime p' >= 3 such that F_{p'^5} contains both a
    nonsingular double-odd curve y^2 = x(x^2 + a x + b) with b a
    nonsquare and exactly one rational point of order 2, and a
    nonsingular prime-order ordinary curve, let S be the set of
    distinct affine x-coordinates and let Z be those whose trace to
    F_{p'} is 0. Let r = |Z| / |S| on the double-odd arm and r1 the
    same ratio on the prime-order arm. The claim is
    r >= r1 + 1/|S|. The curve y^2 = x^3 + x is not used. The
    exponent 8/5 is unchanged and the delta versus Gaudry is 0.
  mechanism: >-
    The double-odd model has the affine point (0, 0). The trace of 0
    is 0, so that x-coordinate sits in Z. A prime-order short
    Weierstrass model has a point with x = 0 only when its constant
    term is a square. The gap of one trace-zero x, scaled by |S|, is
    the predicted excess. The tracked object is a set of field
    elements, not a summation ideal and not a Macaulay matrix.
  novelty_status: unverified
  citations:
    - ref: KR-IC-46d822
      provenance: internal
      claim: Gaudry's exponent at n = 5 is 8/5. A trace ratio is not that exponent.
      verified_by: >-
        coordinator, 2026-10-07, opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
    - ref: KR-IC-e2d81b
      provenance: internal
      claim: >-
        The designer estimate for ecGFp5 is at least 2^142. This
        ratio does not price that estimate.
      verified_by: >-
        coordinator, 2026-10-07, opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-e2d81b.yaml
  assumptions:
    - Trace is the field trace F_{p'^5} to F_{p'} in the frozen basis.
    - Distinct x-coordinates are counted once. Two points with the same x are one element of S.
  predictions:
    - metric: r - r1
      direction: higher
      minimum_effect: at least 1/|S|
  minimal_test:
    design: >-
      Take the smallest admissible p'. Enumerate affine points of
      both curves. Compute r and r1. No discrete log is attempted
      and no summation polynomial is built.
    controls:
      - A zero discriminant voids the run.
      - "S empty is instrument_failure, not a ratio."
      - The trace of 0 is 0. A driver that reports otherwise is void.
      - A second enumeration must reproduce both ratios as exact rationals.
    required_metrics:
      - r
      - r1
      - "the sizes of S and of Z on each arm"
      - whether x = 0 occurs on each arm
  falsification_conditions:
    - r < r1 + 1/|S| after the instrument checks pass.
    - >-
      S is nonempty and the double-odd arm does not contain x = 0.
      That is instrument_failure, not a small ratio.
  confounders:
    - The prime-order curve can also contain x = 0 when its constant term is a square. The gap can then fail. That failure is the negative, not a reason to change the curve.
    - Points at infinity have no x-coordinate and are omitted from S.
  interpretation_limits:
    - Toy scope: one prime and degree 5.
    - The exponent 8/5 stays in place whether or not the gap holds.
    - This is not a degree-4 Macaulay rank and it is not D = 2^16.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Aside from the forced point at x = 0, the trace-zero shares
        of the two curves match closely enough that one extra
        trace-zero x is visible as a gap of 1/|S|. The match is not
        proved.
      rigorous_support: >-
        The trace of 0 is 0. No opened bound says the remaining
        x-coordinates are equidistributed in trace.
      validation_plan: >-
        Report the gap and the count of x = 0 on each arm. Also
        report the gap at the next admissible prime. If the second
        prime reverses the inequality while both arms contain x = 0,
        H1 fails. The first prime's row is still recorded.
  target_complexity:
    time_exponent: unchanged at 8/5
    memory_exponent: one toy point list, no new exponent
    best_known: >-
      KR-IC-46d822 at q^{8/5} and the 2^142 designer estimate in
      KR-IC-e2d81b. Neither is replaced.
    hidden_overhead: No o(1) term is claimed. The output is one rational gap.
    tradeoff_note: Exponent delta 0. Not a time-memory tradeoff.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    KR-IC-46d822 dominates the exponent. A trace-zero gap of size
    1/|S| on one toy curve does not change q^{8/5}. KR-IC-e2d81b's
    2^142 figure is a decomposition estimate, not a trace share.
    Both rows were opened 2026-10-07.
  sota_delta: >-
    Zero change to the exponent 8/5. The pre-registered gap is
    r - r1 at least 1/|S|. The delta versus Gaudry's leading term
    is 0.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-46d822
      - KR-IC-955fd6
      - KR-IC-e2d81b
      - KR-RHO-13bf67
    nearest:
      - ref: KR-IC-e2d81b
        provenance: internal
        relation: orthogonal
        delta: >-
          The row records a designer estimate of at least 2^142.
          This proposal measures a trace-zero gap and states
          exponent delta 0.
      - ref: KR-IC-46d822
        provenance: internal
        relation: orthogonal
        delta: >-
          Gaudry's cost is O-tilde(q^{8/5}). A trace share does not
          replace that cost.
    searched:
      corpus_grep:
        - "trace-zero share of affine x"
      web: []
      blocked:
        - "No web search in this session; novelty stays unverified."
  proof_search_map:
    bottleneck: the trace-zero gap r - r1
    baseline_embedding:
      parameter_slice: the prime-order curve over the same field
      reproduction_check: a second enumeration must agree as a rational
    observation_collision:
      observable: membership of an x-coordinate in the trace-zero set
      distinct_preimage_search: two points with the same x are one element of S
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the trace-zero fibre of affine x-coordinates
        predicted_gain: a gap of at least 1/|S|
    quantifier_order: >-
      At the smallest admissible p', r >= r1 + 1/|S|. Not a statement
      for the deployed prime.
    method_ceiling:
      strongest_certifiable_claim: one rational gap on two curves at one prime
      nearby_object_control: the prime-order curve
    proof_obligations:
      - claim: the trace of 0 is 0 before the gap is scored
        responsibility: baseline
      - claim: the gap is not an exponent
        responsibility: scope
    not_applicable_reason: >-
      No ideal is constructed. The selected transform is
      observable_fiber.
