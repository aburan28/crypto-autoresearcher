  title: >-
    Harvest every x-key collision the mitm engine already computes, and census their
    excess over a random base. Table-table, table-base and search-search coincidences are
    currently discarded. Harvesting them is a generic constant at odd m and an exponent
    move at even m (0.75 -> 0.625 at m=4). The collision-excess factor kappa of
    coset, Dickson/composed and small_x bases over a matched random base is the ONE
    number that decides whether x-structure is a non-generic relation source.
  class: composition
  claim: >-
    R1 representation. Stages: relation decomposition and linear algebra (rank).
    KN-OPEN-020 classes: implicit-membership / high-degree. The coset base is x^d = c,
    and the Dickson base is D_d(x,c) = lambda, the composed map
    D_{d1*d2} = D_{d1} o D_{d2} (catalogue A2-10). Both have membership tests costing
    O(log d).

    (A) GENERIC PART. The engine discards three classes of coincidences:
    - TT: two stored tails with the same x.
    - TB: a stored tail whose x equals a base element's x.
    - SS: two search encodings, from the same or different targets, with the same x.
    Each gives a valid row:
    - TT/TB give homogeneous base-only rows (kcoef = rhs = 0; linalg.add_row accepts them).
    - SS gives R_i -+ R_j = (sum of base points), i.e. a two-target row.
    Model counts at m=3, default |F|: TT ~ |F|^4/N = 0.375|F| (the handoff's ~0.4|F|).
    SS ~ X_s^2/N ~ 3|F| from README 32-bit medians (model, not measured).
    Predicted effect of harvesting:
    - S_3-to-solution falls by a constant: at least 1.3x, model point about 1.7x, at
      m = 3 and 5, with the exponent unchanged (IDEA-20260928-ce3ab0 floor).
    - At even m, SS harvesting removes the table imbalance: m=4 exponent 0.75 -> about
      0.625, m=6 0.667 -> about 0.583. This is a generic improvement on sigma_MITM at
      even m (sigma -> 1/2), but it is NOT structural, and this record says so.
    (B) STRUCTURAL PART, the claim under test. For base F define, per class c,
    kappa_c(F,N) = count_c(F) / count_c(F_random), where F_random is matched in |F|,
    curve, targets and target seeds.
    - Payoff if kappa ~ N^delta with informative (non-formal) rank: the generic floor
      becomes (1/2)*sqrt(r*N/kappa). Total exponent (1+beta-delta)/2.
      sigma_eff = 1/2 - m*delta/(2(m-1)) at precomputation N^{(1+beta-delta)/2},
      i.e. strictly below sigma_MITM at matched precomputation. Beating rho needs
      delta > beta.
    - Pre-committed expectation: kappa_c = 1 within the random band for every x-defined
      arm. That is the NULL, and it would close lead 2 with a number.
  mechanism: >-
    OBJECT FRAME.
    - Representation: R1 x-key with stored y-bit.
    - Operation set Sigma: translation by +-F_a (the table build is iterated
      translation; the search is translation of aP+bQ by base sums).
    - Trichotomy: PARTIAL-ACTION (Class I). The tracked object is the relation vector
      restricted to base translations, and the table is the set of reachable partial
      relation vectors.
    - Tracked quantity: the collision multiset of the x-keyed h-fold sumset plus the
      search encodings, i.e. the h-fold energy E_h(F) and its cross terms.

    LOSSY-PROJECTION TEST.
    - Projection: an h-tuple (with signs) maps to x(sum).
    - Discarded: the tuple identity and the sign of the sum.
    - Lossy: exactly at coincidences, and the coincidences are the harvested relations.
    - Compatible with Sigma: the S_3 fibre determines {x(S+F), x(S-F)} from (x(S), F).
    - Not a change of coordinates: two bases with equal |F| and equal mean yield
      (KN-FIND-007) can have different E_h. Energy is the SECOND moment of the sum
      distribution, which conservation does not fix.

    WHY STRUCTURE COULD MOVE IT, AND WHY IT PROBABLY DOES NOT.
    - Could: a base whose x-description forces non-formal additive quadruples yields
      relations the birthday count does not pay for.
    - Probably not: for multiplicatively structured x-sets, complete character sums of
      x(P), x(Q), x(P+Q) over E x E cancel. That follows from Hom(E, G_m) = 0: the
      divisors of x(P), x(Q), x(P+Q) on E x E are distinct prime divisors, so no
      nontrivial combination is an n-th power (Deligne-type bound, recalled).
    - The IC regime d ~ N^{1/m} << sqrt(p) is incomplete-sum territory, where no theorem
      applies. H-RELN-41562a places the provable regime at B > p^{1/2}*log p. Shparlinski
      2008 (retrieved) gives nontrivial bilinear additive-character bounds only for
      #U > q^{1/2+eps). So the null is heuristic there and must be measured.
    - Known-log / GAP bases (H017 small multiples) have huge E_h, but their coincidences
      are formal and their coverage collapses (KN-FIND-007 point 3; catalogue A1-6).
      They are the positive control, not a candidate.
