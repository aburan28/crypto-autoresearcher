      provenance: retrieved
      claim: >-
        Bounds W = sum over U in 𝒰, V in 𝒱 of rho(U)*theta(V)*psi(x(U ⊕ V)) for arbitrary
        point sets 𝒰, 𝒱 and a nontrivial ADDITIVE character psi. The bounds are
        nontrivial only when #𝒰 > q^{1/2+eps} and #𝒱 > q^eps. Used only to state that
        the index-calculus regime |F| ~ N^{1/m} < q^{1/2} lies outside the proven range.
        The multiplicative-character analogue (Ahmadi-Shparlinski) was not read and is
        not relied on.
      verified_by: TASK-20260928-9c44f2 (idea-generator) fetched and read the abstract on the Macquarie University research portal on 2026-09-28; full text not read
  assumptions:
    - The engine's per-class relations are valid group identities. Every harvested row is re-verified by scalar multiplication through decompose.verify, following the existing certificate discipline.
    - The Dickson base is a new builder in factor_base.py - F = {P : x(P) = u + c/u, u in g*mu_d} (c not in g^2*mu_d), sharing the subgroup prime filter. It is a base builder, not a solver.
    - The j=0 control curve y^2 = x^3 + b with p = 1 (mod 3), prime order, and 3 | d supplies formal automorphism coincidences. This uses automorphism folding (off-limits as a lens) ONLY as a positive control for discounting formal excess.
    - Toy scale, 12..32 bits.
  proof_search_map:
    bottleneck: relations per computed encoding. The generic value is fixed by IDEA-20260928-ce3ab0, so only kappa > 1 moves it.
    baseline_embedding:
      parameter_slice: harvest classes TT, TB and SS switched off.
      reproduction_check: >-
        Must reproduce the committed §3/§5 rows EXACTLY: attempts, relations, rank,
        s3_solves, table_s3_solves and la_ops under min_fill. This is a frozen
        regression fixture.
    observation_collision:
      observable: kappa_c per class, and informative rank per class
      distinct_preimage_search: >-
        The H017 small-multiples base and a hypothetical informative high-energy base
        would share a large kappa and differ entirely in usefulness. So kappa is NEVER
        reported without two companions: the informative rank (rank modulo the formal
        relation lattice, which is computable for the controls) and the
        S_3-to-solution. The j=0 arm gives formal TB coincidences, which must be
        subtracted before kappa is read.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: per-class collision counts (TT, TB, SS, TS) with independent Poisson nulls, packed into one S_3-to-solution figure
        predicted_gain: generic 1.3-2.5x at odd m; exponent 0.75 -> 0.625 at m=4; structural delta/2 exponent if kappa ~ N^delta
      - transform: observable_fiber
        proposed_object: fixed |F| and fixed mean yield, varying base geometry; the fibre invariant is E_h(F)
        predicted_gain: separates second-moment structure from conservation-fixed first moment
    quantifier_order: >-
      THERE EXISTS an x-defined, target-independent base family {F_N}, with membership
      testable in polylog(p), such that FOR ALL N in 2^20..2^32:
      kappa_TT(F_N) >= 1 + c*N^delta (delta > 0), AND informative rank
      >= 0.9*harvested rows. The family may depend on N (d must divide p-1), which the
      ordering allows. A positive at toy scale is a lever candidate, not a lever.
    method_ceiling:
      strongest_certifiable_claim: >-
        Measured kappa per class, arm and rung, with a fitted slope and interval, plus a
        measured generic harvest gain. It cannot certify asymptotic delta or cover bases
        outside the panel.
      nearby_object_control: >-
        Two controls. (i) The H017 small-multiples base: kappa huge, informative rank
        about 0, S_3-to-solution collapses via coverage. An instrument that cannot show
        that has no dynamic range. (ii) The matched random base, kappa = 1 by
        definition, with the seed band as the null.
    proof_obligations:
      - claim: every harvested row is a valid relation (certificate re-verified)
        responsibility: correctness
      - claim: harvest-off reproduces committed rows exactly
        responsibility: baseline
      - claim: random-base class counts match Poisson means from the encoding counts
        responsibility: success_probability
      - claim: formal (automorphism / known-log) coincidences are identified and subtracted
        responsibility: scope
      - claim: memory of the search-encoding store is reported (it grows to N^{(1+beta)/2})
        responsibility: memory
    not_applicable_reason: null
  predictions:
    - metric: S_3-to-solution ratio (mitm without harvest)/(with harvest), m=3 and 5, per base, 24..32 bits
      direction: higher
      minimum_effect: '>= 1.3 on every base at every rung >= 24 bits; exponent change within +-0.03 at odd m'
    - metric: fitted S_3 exponent at m=4 with SS harvest
      direction: lower
      minimum_effect: '<= 0.66 (from 0.75); model 0.625. This is the positive control that the IDEA-20260928-ce3ab0 floor is attainable.'
    - metric: kappa_TT, kappa_SS for subgroup, dickson and small_x arms vs the random band (3 seeds x 5 curves)
      direction: different
      minimum_effect: 'Null: inside the random 3-SD band at every rung. Alive: above 3 SD at the two largest rungs, with a slope interval of log(kappa-1) vs log N excluding 0.'
    - metric: informative rank / harvested rows, per arm
      direction: different
      minimum_effect: '>= 0.95 for random and x-defined arms; <= 0.05 for the H017 control'
    - metric: kappa_TB on the j=0, 3|d coset arm before and after formal subtraction
      direction: higher
      minimum_effect: 'before: >= 5; after: inside the random band (instrument check)'
  minimal_test:
    design: >-
      BUILD (no new solver).
      (1) tails.py: after the sorted build, walk equal-x groups and emit TT rows,
          oriented by the y-bit. Look up each tail x in the base x-set and emit TB rows.
      (2) decompose/solver: append every search x-value with (target, head, index, sign)
          to a per-run array; sort and merge at checkpoints (every 2^16 values) to emit
          SS rows.
      (3) Feed all rows into EliminationState with the existing stop rule.
      (4) factor_base.py: add a `dickson` builder; add a j=0 curve option for the
          control.
      (5) Counters per class: raw count, formal count, informative rank increments.
      CELLS.
      - m in {3,4,5}; 12..32 bits, step 2 (m=4 up to 28 if wall time binds); 5 curves
        with --subgroup-prime so that small_x, random (3 seeds), subgroup and dickson
        share curves, |F| and targets.
      - H017 small-multiples arm at m=3 up to 24 bits.
      - j=0 control at m=3 up to 24 bits.
      - Each cell runs twice, harvest off and harvest on. Report per-target S_3, total
        S_3, table S_3, per-class counts, kappa_c, informative rank, la_ops and peak RSS
        next to the plain mitm column.
      - Rho: 10 curves per size.
    controls:
      - matched random base (3 seeds) on identical curves and target seeds (kappa null band)
      - harvest-off run reproducing committed rows exactly (baseline embedding)
      - H017 small-multiples arm (high-kappa, zero-information positive control)
      - j=0, 3|d coset arm (formal-coincidence positive control)
      - duplicated-column base from f89eaf (rank instrument check)
      - Pollard rho walk (cost control)
    required_metrics:
      - per-class raw and formal-subtracted counts; kappa_c with bootstrap CI
      - Poisson-mean prediction per class from logged encoding counts
      - informative rank per class; rank staircase
      - S_3-to-solution harvest-on vs off; exponent fits per (m, base)
      - search-store memory and peak RSS
      - certificate re-verification pass count (must equal row count)
  falsification_conditions:
    - Harvest-off fails to reproduce any committed row, so the build is broken and nothing is read.
    - A harvested row fails certificate re-verification, which is an implementation error.
    - Random-base class counts outside the Poisson band mean the collision model (and IDEA-20260928-ce3ab0's H1) is wrong.
    - m=4 harvest exponent interval excluding values <= 0.66 means the floor is not attainable as claimed and IDEA-20260928-ce3ab0 (B) is weakened.
    - Every x-defined arm's kappa sits inside the random band at every rung. Lead 2 is then CLOSED for the tested arms, range and m, with the measured band as the obstruction record. This is the expected outcome.
    - Any x-defined arm has kappa above 3 SD with a positive slope AND informative rank >= 0.95. That is a live non-generic relation source and the headline.
  confounders:
    - Formal coincidences from automorphisms or from p-dependent coincidences in d (e.g. -1 or zeta_3 in mu_d). The j=0 arm and the formal-subtraction step exist for this.
    - Ordering/reachability rules suppress some TS matches, and the effect differs by class. kappa is always computed per class against the matched random base, never against the raw Poisson model.
    - The early stop shortens harvest-on runs, so class counts are reported both at stop and at a fixed encoding budget.
    - Memory: the SS store grows to N^{(1+beta)/2}. It is reported, and cells that exceed the host limit are infrastructure stops, not evidence.
  interpretation_limits:
    - The generic harvest gain is engineering, not an advance. It leaves every odd-m exponent unchanged and stays above rho.
    - A kappa null closes only the tested arms (subgroup, dickson, small_x), m <= 5 and 12..32 bits.
    - KN-OPEN-020 class - implicit-membership/high-degree (coset, Dickson). No target-dependent base is tested here.
    - Toy scale. No claim about deployed curves.
  heuristic_assumptions:
    - id: H1
      statement: For a uniformly random x-set base, per-class coincidence counts are Poisson with means 4S_t^2/N (TT), 8S_t*S_s/N (TS), 4S_s^2/N (SS), and about 2|F|*T_t/N (TB), times the class ordering constant.
      rigorous_support: >-
        GGM pairwise collision probability <= 2/N (see IDEA-20260928-ce3ab0). Imitated:
        the birthday/Poisson law.
      validation_plan: 'Random arm, 15 instances per rung, 12..32 bits: KS per class at 1%; max-count tail vs Poisson order statistic.'
    - id: H2
      statement: For subgroup, dickson and small_x bases in the regime |F| ~ N^{1/m} << sqrt(p), kappa_c = 1 + O(N^{-1/2+eps}).
      rigorous_support: >-
        Proven (complete sums only): Hom(E, G_m) = 0, so the mixed multiplicative
        character sums of x(P), x(Q), x(P+Q) over E x E have square-root cancellation
        (Deligne-type, recalled). Imitated: Weil square-root cancellation. Gap: the IC
        regime is an incomplete sum over a subgroup-defined set, which is below the
        recalled Kohel-Shparlinski threshold p^{1/2}*log p and below the q^{1/2+eps}
        range of Shparlinski 2008 (additive characters).
      validation_plan: 'Fit log(max(kappa-1, SD_null)) vs log N per arm; compare to -1/2 and 0; Holm across arms; tails: most deviant cell vs the max-of-k Gaussian.'
    - id: H3
      statement: Harvested rows from random and x-defined bases reach full rank within 1.05x the row count (the f89eaf H1 analogue).
      rigorous_support: counting bound; random sparse-matrix rank heuristics
      validation_plan: rank staircase per run; permutation of row order must change the saturation point by < 0.02
  target_complexity:
    time_exponent: 'Generic harvest: (m+1)/(2m) at every m (odd m unchanged; m=4 0.625, m=6 0.583). Structural branch: (1+beta-delta)/2 if kappa ~ N^delta.'
    memory_exponent: 'N^{(1+beta)/2} for the SS store (= N^{(m+1)/(2m)}); the mitm table N^{h/m} is unchanged.'
    best_known: Pollard rho 0.886*sqrt(N), O(1) memory.
    hidden_overhead: The ordering constant (about 0.46 at m=3) and formal subtraction; toy-range exponents include lower-order terms.
    tradeoff_note: The SS store can be replaced by distinguished-point collision search on encodings (vOW-style), trading memory for a constant in time. Parallelizes like rho.
