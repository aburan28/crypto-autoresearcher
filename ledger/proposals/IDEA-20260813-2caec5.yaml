idea:
  id: IDEA-20260813-2caec5
  date: '2026-08-13'
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SDITH-001
  goal_id: GOAL-SDITH-001
  title: Hypercube opening-incidence rank deficit under view reuse
  class: mechanism
  claim: >-
    Test whether the source-defined reuse of hypercube views across openings
    induces a rank or conditional-entropy deficit in the opening-to-block
    incidence operator that a split-aware decoder can convert into lower fully
    charged work than the matched plain-random-SD baseline. No deficit,
    decoder, or work reduction is claimed by this proposal.
  mechanism: >-
    Encode which source-defined hidden block or view components contribute to
    each opened transcript view as an incidence operator A over the appropriate
    source-defined field or module. Reuse can make nominally separate openings
    share latent components. If rank(A) is below the random-incidence control
    after quotienting mandatory public relations, the attacker may face fewer
    independent support constraints or a smaller conditional support family.
    A concrete decoder must turn that deficit into a reduced information-set
    search; rank deficiency alone is only an observable.
  why_not_a_renamed_known_approach: >-
    IDEA-20260805-cbd93d bounds the unconditional d-split admissibility ratio
    without compute; this proposal conditions on the actual hypercube
    opening-incidence operator and requires a decoder. IDEA-20260808-a7872e
    factors an error-locator ideal across blocks; this is a linear or modular
    view-reuse mechanism that can exist even when the locator ideal does not
    factor. IDEA-20260805-43d6df supplies the cost baseline, not the structural
    deficit. IDEA-20260808-632866 is the nearest reduction control because an
    exact random-permutation reduction should erase any exploitable incidence
    exception unless the adversary observes non-exchangeable reused views.
  predictions:
    - metric: quotient rank deficit relative to degree-matched random incidence
      direction: higher
      minimum_effect: >-
        A preregistered positive deficit after removing all source-mandated
        relations and conditioning on identical row and column degrees.
    - metric: conditional support entropy beyond d-split admissibility
      direction: lower
      minimum_effect: >-
        At least 1 net bit below the exact cbd93d admissibility bound on a frozen
        toy slice, with uncertainty and enumeration error below 0.25 bit.
    - metric: fully charged decoder work versus IDEA-20260813-27df0c baseline
      direction: lower
      minimum_effect: >-
        At least 1 net work bit at a matched concrete instance; exponent
        relevance additionally requires rank deficit divided by code length to
        stay bounded below by a positive constant.
    - metric: planted low-rank reuse positive-control recovery
      direction: higher
      minimum_effect: Detect the planted deficit and recover its designed work reduction.
  minimal_test:
    design: >-
      Without executing here, freeze a source-valid toy parameter capsule,
      construct the exact opening-incidence operator, quotient mandatory public
      relations, and compare its rank and conditional support count with a
      degree-matched random incidence ensemble, a no-reuse control, and a
      planted low-rank instance. Only if a residual deficit survives should a
      split-aware information-set schedule be specified and charged against
      IDEA-20260813-27df0c.
    controls:
      - Fully charged and independently reproduced IDEA-20260813-27df0c baseline first.
      - Degree-, dimension-, and challenge-count-matched random incidence matrices.
      - No-reuse hypercube variant with fresh latent components per opening.
      - Public block-label permutation and mandatory-relation quotient controls.
      - Planted positive control with a known duplicated-column or low-rank reuse pattern.
      - Random-permutation reduction audit from IDEA-20260808-632866.
    required_metrics:
      - Raw rank, mandatory-relation rank, quotient rank, and null distribution.
      - Exact or bounded conditional support count and entropy.
      - Decoder per-attempt work, inverse success, peak memory, and preprocessing.
      - Data, challenge, oracle, verification, and target-reuse costs.
  controls:
    - certified_charged_isd_baseline
    - degree_matched_random_incidence_null
    - no_view_reuse_control
    - planted_low_rank_positive_control
  confounders:
    - Counting protocol-mandated parity relations as an unexpected deficit.
    - Computing rank over the wrong field or after an invalid projection.
    - Exceptional toy dimensions or challenge degeneracy.
    - Translating rank deficit directly into work reduction without a decoder.
    - Omitting the entropy already captured by cbd93d's admissibility ratio.
    - Reusing preprocessing or targets on only the proposed side.
  falsification_conditions:
    - Quotient rank matches the degree-matched random-incidence null on every frozen source-valid slice while the planted control is detected.
    - Any entropy reduction is fully accounted for by the cbd93d admissibility ratio.
    - The random-permutation reduction of IDEA-20260808-632866 maps the observed structure to plain SD without an adversary-visible exception.
    - A decoder cannot convert the deficit into at least 1 fully charged work bit, or the deficit is sublinear and no concrete advantage survives.
  interpretation_limits:
    - status proposed and novelty unverified; this record has no scientific effect.
    - Rank deficit is an artifact until compared with the identical degree-matched null.
    - A toy deficit does not imply an asymptotic or parameter-set attack.
    - A linear deficit does not prove a decoder with matching gain.
    - SDitH forgery remains separately bounded by the MPCitH crossover of IDEA-20260808-d873bc.
  assumptions:
    - Primary sources define the hypercube views, openings, reuse pattern, field, and public relations exactly.
    - The incidence operator preserves every constraint available to an attacker and does not include secret-only instrumentation.
    - A matched plain-SD embedding and fully charged ISD cost model are available.
  heuristic_assumptions:
    - id: H-RANK-1
      statement: >-
        Conditional on fixed row degrees, column degrees, dimensions, and
        mandatory public relations, the degree-matched random-incidence ensemble
        is the correct null for quotient-rank fluctuations.
      rigorous_support: >-
        Finite-dimensional rank is exact for each matrix; the heuristic step is
        treating the conditioned random incidence ensemble as the distribution
        imitated by structure-free openings.
      validation_plan: >-
        Enumerate the null exactly at the smallest slices and sample it at larger
        toy slices with fixed seeds, compare the full rank-deficit tail, and
        include a no-reuse construction. No production extrapolation is allowed
        without a scaling family.
    - id: H-RANK-2
      statement: >-
        If residual quotient deficit Delta_N scales as rho N with rho greater
        than zero, a specified split-aware decoder can exploit a constant
        fraction c of those missing constraints after all success and resource costs.
      rigorous_support: >-
        Counting a support family reduced by Delta_N bits gives an information
        ceiling; it does not itself prove decoder access, so c and the decoder
        realization are explicit assumptions.
      validation_plan: >-
        Require a concrete decoder, exact small-instance enumeration, at least
        three source-valid scaling points, confidence bands for Delta_N/N, and a
        charged work comparison. Falsify exponent relevance if rho trends to zero.
  proof_search_map:
    bottleneck: >-
      Convert a quotient incidence-rank deficit, after all public relations and
      d-split admissibility are removed, into a realizable decoder advantage.
    baseline_embedding:
      parameter_slice: >-
        Exact frozen IDEA-20260813-27df0c plain-SD and d-split rows at the same
        code, weight, target, memory, preprocessing, and success regime.
      reproduction_check: >-
        Reproduce the retained baseline work within 0.25 bit and the cbd93d
        admissibility count exactly or with a certified interval.
    observation_collision:
      observable: Quotient rank and conditional support entropy of the opening-incidence operator.
      distinct_preimage_search: >-
        Search for incidence operators with equal quotient rank and entropy but
        different decoder work, and for equal work with different rank, to test
        whether the observable is sufficient.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: Fibre of support assignments consistent with one quotient-incidence observation.
        predicted_gain: Separates raw rank from the support multiplicity actually relevant to decoding.
      - transform: specialization_pack
        proposed_object: No-reuse, planted-reuse, degree-matched-random, and source-exact incidence families.
        predicted_gain: Identifies which reuse feature, if any, creates the deficit.
    quantifier_order: >-
      Fix the incidence construction, quotient, null ensemble, decoder, memory
      cap, and cost policy before observing ranks; then evaluate every frozen
      challenge and key slice. Do not select a favorable quotient or challenge afterward.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy source-gated bound on residual support entropy and fully charged
        decoder work for a specified incidence family.
      nearby_object_control: >-
        Degree-matched random incidence with a planted mandatory relation that
        disappears under the quotient; the method must not report it as exploitable.
    proof_obligations:
      - claim: Reproduce the charged plain-SD and d-split baseline.
        responsibility: baseline
      - claim: Prove the incidence operator and quotient match the source-defined openings.
        responsibility: correctness
      - claim: Separate cbd93d admissibility entropy from residual view-reuse entropy.
        responsibility: strictness
      - claim: Specify a decoder and prove its success probability on the reduced fibre.
        responsibility: success_probability
      - claim: Charge rank construction, preprocessing, tables, data, memory, and verification.
        responsibility: runtime
      - claim: Bound conclusions to tested parameters unless linear scaling is supported.
        responsibility: scope
    not_applicable_reason: null
  target_complexity:
    time_exponent: >-
      Target tau_plain minus epsilon for epsilon greater than zero only if
      Delta_N/N approaches rho greater than zero and a decoder realizes a
      charged constant fraction; current established delta is zero.
    memory_exponent: Must not exceed the matched baseline cap; current delta is zero.
    best_known: >-
      The fully memory- and preprocessing-charged, reoptimized plain-random-SD
      frontier reproduced by IDEA-20260813-27df0c from IDEA-20260805-43d6df.
    hidden_overhead: >-
      Incidence construction, quotienting, support-fibre enumeration, decoder
      tables, preprocessing, target acquisition, failed attempts, and
      verification are explicit.
    tradeoff_note: >-
      A rank-based filter may trade larger precomputed tables for fewer ISD
      attempts. It wins only on a nondominated row under the same memory cap and
      amortization regime.
  sota_delta:
    claim: No current improvement; quantitative promotion gates are preregistered.
    current_net_work_delta_bits: 0.0
    current_time_exponent_delta: 0.0
    current_memory_exponent_delta: 0.0
    minimum_concrete_net_gain_bits: 1.0
    asymptotic_gate: 'liminf Delta_N/N > 0 and charged epsilon > 0'
    pareto_rows:
      time: Rank processing plus decoder attempts and inverse success are charged.
      memory: Incidence matrices, quotient bases, and decoder tables count toward peak memory.
      data: Every opened view, challenge, and target transcript is charged.
      preprocessing: Per-parameter and per-key incidence preprocessing are separated and amortized honestly.
      oracle: No hidden support or decoding oracle; source-permitted transcript access only.
      verification: Candidate errors, support constraints, and rank certificates are independently checked.
    frontier_check: >-
      All six rows are compared against 27df0c/43d6df. A lower attempt count with
      larger tables or unavailable view data is recorded as dominated, not a gain.
