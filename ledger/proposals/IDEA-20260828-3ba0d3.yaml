idea:
  id: IDEA-20260828-3ba0d3
  question_id: RQ-AES-003
  goal_id: GOAL-AES-003
  title: >-
    Joint independence audit: does composing attack6n's partial-sums filter
    with an independently-built impossible-differential filter on the SAME
    residual reveal correlated survivors that reduce the joint hint budget
    below the naive additive sum, potentially crossing REF-B's h* frontier?
  class: measurement
  claim: >-
    IDEA-20260805-72ec9a establishes REF-B's h*(128) domination frontier for
    single-family constructions measured against plain exhaustive search.
    No existing record in this campaign asks whether COMPOSING two
    independently-built filter families against the SAME wrong-key
    candidate space produces JOINT survivors correlated below the naive
    independence assumption (h_joint = h1 + h2), which would mean the
    composed construction's TRUE hint budget is smaller than its additive
    accounting implies -- a genuine, previously unmeasured margin. TWO
    OUTCOMES: (i) attack6n's partial-sums filter and an independently
    derived impossible-differential filter on the same residual show
    JOINT survivors matching the independence prediction (product of
    marginals) -- confirming no hidden correlation and that additive hint
    accounting is safe for this pairing; (ii) joint survivors are
    SIGNIFICANTLY FEWER than independence predicts -- a measurable
    correlation between the two filter families that, if large enough,
    moves the composed construction's effective h below h*(128), letting
    it beat REF-B where NEITHER family alone can.
  mechanism: >-
    Two Bernoulli-style sieves (attack6n's own 8-bit-per-structure filter,
    and a candidate impossible-differential contradiction on the same
    residual, to be derived at Stage 0 from first principles per RQ-AES-003's
    off-limits exemption for baseline/control work) applied to the SAME
    finite candidate space either behave as independent random sieves
    (joint survival rate = product of marginals) or exhibit a structural
    correlation if both filters are sensitive to a shared underlying
    algebraic property of the wrong key. This record measures which,
    directly, rather than assuming independence the way every additive
    hint-budget calculation in this campaign implicitly does.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260805-72ec9a
      provenance: internal
      claim: REF-B's h*(128) domination frontier for single-family constructions.
      verified_by: "idea-generator subagent (read in full during idea generation)"
    - ref: IDEA-20260805-f2fc33
      provenance: internal
      claim: "attack6n's own filter and its forced-value survivor ladder, reused as one marginal in this joint measurement."
      verified_by: "idea-generator subagent (read in full during idea generation)"
    - ref: IDEA-20260828-6cf68c
      provenance: internal
      claim: "Key-bridging audit of attack6n's guess set, read to confirm the residual and guessed-byte set this record's impossible-differential filter must target."
      verified_by: "idea-generator subagent (read in full during idea generation)"
    - ref: IDEA-20260808-46d7ef
      provenance: internal
      claim: Related composition/cost-accounting record checked for overlap before this idea was finalized.
      verified_by: "idea-generator subagent (read in full during idea generation)"
  assumptions:
    - "An impossible-differential trail exists for attack6n's residual at r=6; its exact shape is unknown until Stage 0's derivation, and its non-existence is itself a valid, reportable outcome (a scoped barrier statement)."
    - "attack6n's own marginal survivor count reproduces IDEA-20260805-f2fc33's forced-value ladder before any joint measurement is trusted."
  proof_search_map:
    bottleneck: >-
      Whether an impossible-differential trail exists on attack6n's exact
      residual at r=6, and whether its guessed-byte set overlaps attack6n's
      own guessed bytes enough to make a joint measurement meaningful.
    baseline_embedding:
      parameter_slice: "The r=6 attack6n construction and its committed residual, per IDEA-20260805-f2fc33's transcription."
      reproduction_check: "attack6n's own marginal survivor count must reproduce f2fc33's forced-value ladder within its stated binomial tolerance before Stage 2."
    observation_collision:
      observable: "Joint survivor count vs the independence prediction (product of marginals / candidate space size)."
      distinct_preimage_search: >-
        The dangerous collision would be a correlation arising from a
        SHARED IMPLEMENTATION BUG in both filters rather than a genuine
        dependency; guarded against by an independent-code-review check and
        by the pseudorandom-sieve positive control below, which MUST show
        independence if the joint-measurement machinery itself is sound.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: "Compose attack6n's filter with a DELIBERATELY UNRELATED pseudorandom 8-bit sieve as the positive control for independence."
        predicted_gain: "Confirms the joint-measurement machinery is sound before trusting any real correlation finding."
    quantifier_order: >-
      FOR the exact attack6n residual and shape at r=6, DOES the joint
      survivor count under two specific, independently-derived filters
      match or diverge from the independence prediction -- a claim about
      THIS pairing only, not attack composition in general.
    method_ceiling:
      strongest_certifiable_claim: >-
        A measured joint-vs-independence ratio for this specific pairing at
        r=6. It certifies nothing about composing any other pair of families
        and nothing about full-round AES.
      nearby_object_control: >-
        Compose attack6n's filter with a DELIBERATELY UNRELATED filter
        (e.g. a pseudorandom 8-bit sieve over the same candidate space, per
        IDEA-20260805-f2fc33's own surrogate) as the positive control for
        independence: two genuinely unrelated filters MUST show joint
        survivors matching the independence prediction closely. If this
        control fails, the joint-measurement machinery itself is broken
        and no impossible-differential reading is trustworthy.
    proof_obligations:
      - claim: "Each filter's own marginal survivor count reproduces its independently-derivable forced value."
        responsibility: baseline
      - claim: "The pseudorandom-sieve positive control shows joint survivors consistent with independence."
        responsibility: correctness
      - claim: "A true-key control retains the correct residual under BOTH filters with probability 1."
        responsibility: correctness
      - claim: "Any reported h_joint or margin is against REF-B only, never the published frontier."
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: "attack6n's own marginal survivor count, reproduced independently as a baseline check"
      direction: different
      minimum_effect: "Exact reproduction of IDEA-20260805-f2fc33's forced-value ladder within its stated binomial tolerance"
    - metric: "joint survivor count vs the independence prediction (product of marginals / candidate space size)"
      direction: different
      minimum_effect: >-
        No minimum is assumed in advance; a ratio near 1.0 (independence,
        outcome i) and a ratio significantly above 1.0 (correlation,
        outcome ii) are both pre-registered as informative, with a decision
        threshold of 4 empirical standard errors set before the joint
        measurement is read
    - metric: "pseudorandom-sieve positive control's joint-vs-independence ratio"
      direction: different
      minimum_effect: "FORCED to be near 1.0 (independence); a deviation here voids the joint-measurement machinery"
    - metric: "resulting h_joint (from the measured joint survivor count) vs h*(128)"
      direction: lower
      minimum_effect: "Any measurable crossing or non-crossing, reported honestly"
  minimal_test:
    design: >-
      STAGE 0 (zero compute): re-derive attack6n's residual and the
      candidate impossible-differential trail's guessed-byte set; confirm
      overlap or record the barrier statement. STAGE 1 (cheap,
      reproduction): reproduce attack6n's own marginal survivor count via
      IDEA-20260805-f2fc33's forced-value ladder. STAGE 2 (build):
      implement the impossible-differential filter against the SAME
      residual, with a true-key control run first. STAGE 3 (the joint
      measurement): run both filters on the SAME chosen-plaintext
      structures against the SAME target key, record the joint survivor
      set, and compute its ratio to the independence prediction. STAGE 4
      (positive control): repeat Stage 3 with attack6n's filter paired
      against a pseudorandom 8-bit sieve instead of the impossible-
      differential filter, confirming the joint-vs-independence ratio is
      near 1.0.
    controls:
      - "Marginal reproduction of attack6n's own forced-value survivor count (must pass before Stage 2)"
      - "True-key control for the impossible-differential filter (must retain the correct residual with probability 1)"
      - "Pseudorandom-sieve positive control for independence (must show joint survivors near the independence prediction)"
    required_metrics:
      - "each filter's marginal survivor count"
      - "joint survivor count and its ratio to the independence prediction"
      - "resulting h_joint and its priced margin against REF-B's B(h) at h*(128)"
      - "positive-control ratio (must be near 1.0)"
  falsification_conditions:
    - "attack6n's own marginal count fails to reproduce f2fc33's forced-value ladder -- re-implementation error, stop."
    - "The true-key control fails for the impossible-differential filter -- its trail derivation is wrong, nothing downstream may be reported."
    - "The pseudorandom-sieve positive control shows a joint-vs-independence ratio far from 1.0 -- the joint-measurement machinery is broken, no impossible-differential reading is trustworthy."
    - "Step 1/2 finds no overlapping guessed-byte set between the two filters at r=6 -- a scoped barrier statement about THIS specific pairing, not a claim about attack composition in general."
  confounders:
    - "The impossible-differential trail's existence and exact shape for this residual is unknown to this proposing session and must be derived at Stage 0 before anything else; a failure here is the cheapest possible falsification."
    - "Correlation between the two filters could arise from a shared IMPLEMENTATION BUG (both filters computed from the same buggy intermediate value) rather than from a genuine cryptographic dependency; the pseudorandom-sieve control is designed to catch the machinery being broken, but a bug shared by BOTH real filters specifically would not be caught by it and must be checked by independent code review of both filter implementations."
    - "Four-core scaling and the AES-NI path's pinning status apply here exactly as in every other construction under this goal (RQ-AES-003 constraints)."
  interpretation_limits:
    - "Toy tier, reduced-round only, no statement about full-round or deployed AES."
    - "No comparison to the published impossible-differential literature in either direction (R3)."
    - "A finding here is about THIS pair of filters on THIS residual at r=6; it does not generalize to any other pair of attack families or to a different residual without re-measurement."
  heuristic_assumptions:
    - id: H1
      statement: >-
        In the absence of a specific structural relationship, two
        independently constructed filters (drawn from different attack
        families) applied to the same wrong-key candidate space behave as
        statistically independent Bernoulli sieves, so their joint
        survival rate equals the product of their marginal survival rates.
      rigorous_support: >-
        Not proved; this is the natural null hypothesis for combining two
        filters and is the EXACT quantity this proposal measures rather
        than assumes. It imitates the classical independence assumption
        for combining independent statistical tests (analogous to
        combining independent hypothesis tests via Fisher's method),
        applied here to two cryptanalytic sieves rather than two p-values.
      validation_plan: >-
        The pseudorandom-sieve positive control (Stage 4) is the
        validation: a genuinely unrelated filter paired with attack6n's
        MUST show joint survivors consistent with independence at the same
        scale as the real pairing, before any conclusion about the
        impossible-differential pairing is drawn.
  target_complexity:
    time_exponent: >-
      No exponent moved against AES generically. If outcome (i) obtains
      and h_joint crosses h*(128), the target is a measured cost below
      REF-B's B(h_joint) -- the campaign's first construction to do so, if
      real. If outcome (ii), no crossing is claimed and the measured
      correlation is the deliverable.
    memory_exponent: >-
      Sum of the two filters' individual memory footprints (attack6n's
      existing 2^20-entry bitmap plus the impossible-differential filter's
      own, to be measured); no larger table is proposed.
    best_known: "REF-A, REF-B (IDEA-20260805-72ec9a's h*(128)/B(h) curve)."
    hidden_overhead: >-
      Running two filters instead of one at minimum doubles the
      per-structure compute cost, which must be measured against the
      producer-task envelope before Stage 3 is attempted at full scale.
    tradeoff_note: >-
      The whole point of the measurement is a tradeoff between NAIVE
      additive hint accounting (h1+h2, assuming independence) and the
      MEASURED joint hint budget, which may be smaller (correlation) than
      the naive sum predicts -- exactly the honest disclosure this class
      of composition proposal owes.
  dominated_by: >-
    REF-B (IDEA-20260805-72ec9a's h*(128)/B(h) curve) is the row to beat if
    outcome (i) obtains. Checked REF-A, REF-B, and every record read in
    full this session (72ec9a, f2fc33, c8c0d4, 86e431, 0155e5, 6cf68c,
    da36ef, c65b10); none composes two independently-built filter families
    against the same residual.
  sota_delta: >-
    Against REF-A: any successful joint filter beats it astronomically and
    uninformatively (R3). Against REF-B: UNKNOWN UNTIL EXECUTED -- the
    record's value is that the joint-vs-additive delta becomes a measured
    number. Published-frontier comparison: UNADJUDICABLE in this
    environment (R3).
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: medium
