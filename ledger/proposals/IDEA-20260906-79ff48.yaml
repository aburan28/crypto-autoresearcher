idea:
  id: IDEA-20260906-79ff48
  question_id: RQ-RELN-61638a
  goal_id: null
  goal_id_note: >-
    Not bound to a GOAL record. GOAL-RELN-001 (factor-base decomposition
    probability audit) is the natural host, as RQ-RELN-61638a itself says;
    binding is a Coordinator ledger-archive act and this record does not
    perform it.
  added: '2026-09-06'
  title: >-
    AN INDUCTIVE GRAPH-NEURAL DECOMPOSABILITY PREDICTOR AS AN INSTRUMENT, WITH
    THE FOUR-ARM PANEL. Train a message-passing model on the certified
    point-relation incidence graph of a TRAINING subset of targets with
    coordinates-only node features, predict c_D(R) >= 1 and c_D(R) for
    HELD-OUT targets from their features alone, and score the top-sigma
    predicted slice by IDEA-20260830-c5c614's precision lift lambda and yield
    lift rho against the random-partition selection null, the analytic
    exchangeable null, a label-permutation null and a gradient-boosted-tree
    baseline, on E/x-interval, E/random, Z/N-interval (positive control that
    MUST be recovered) and Z/N-random (structure-free negative control), with
    a growth arm 2^14..2^20 exhaustive plus a certified sampled rung at 2^24,
    so that the decay exponent of the learned class's lift is measured on the
    same two pre-registered values (-1/2 closed, 0 alive) as the frozen
    grammar, and so that whatever the instrument finds is handed to symbolic
    regression as a formula rather than reported as an accuracy
  class: measurement

  claim: >-
    (A) OBJECT FRAME, IN ONE CLAUSE. The tracked object is a LEARNED PREDICATE
    on the target's REPRESENTATION, i.e. the pushforward of the
    decomposition-count vector c_D along the two-cell partition {top-sigma
    predicted slice, complement} that a trained function f_theta induces on
    the target set; representation class R1 (affine coordinates (x, y) of the
    target and of the base points) of RQ-ECDLP-623a32; attack stage RELATION
    COLLECTION (target selection before the decomposition solve); trichotomy
    class COORDINATE-DEPENDENT in IDEA-20260806-c5d183's sense, exactly as
    IDEA-20260830-c5c614's frozen grammar is. The operation set Sigma the
    object survives is the generate-and-filter step of relation collection
    (draw R = aP + bQ, evaluate f_theta on the coordinates of R, spend a solve
    only if R is in the slice); it is NOT translation, and the record claims
    nothing that propagates under translation.
    (B) WHAT IS FIXED AND NOT CONTESTED. KN-FIND-007 fixes sum_r c_D(r) =
    C(B+m-1, m) exactly for every base of size B (INV-1 of the seed brief), so
    the whole-group mean is not a lever; IDEA-20260830-772cff bounds the
    yield, coverage and rank channels by 1.582(1+o(1)); IDEA-20260830-c5c614
    identifies the one open door as a target set decidable from x(R) with no
    discrete logarithm, defines rho(D, pi) = E_{r in S}[c_D(r)] /
    E_{r in G}[c_D(r)] and lambda(D, pi) = Pr[c_D(r) >= 1 | r in S] /
    Pr[c_D(r) >= 1] for a predicate pi with slice S of density sigma, supplies
    the random-partition selection null and the growth arm, and pre-registers
    the competing decay exponents -1/2 (square-root cancellation, closed with
    a number) and 0 (alive). This record REUSES those two metrics, that null
    and those two exponents unchanged and adds nothing to them.
    (C) THE CLAIM. c5c614 closes the existential over a FROZEN grammar of ten
    hand-written O(1) predicates. This record replaces the grammar by a
    learned function class F_theta (an inductive message-passing model over
    the certified relation hypergraph, and a gradient-boosted tree model on
    the same features) that CONTAINS the grammar as a parameter slice (every
    bit-threshold and Legendre-class predicate of the grammar is a depth-1
    tree, and a one-layer readout can represent it), and asks the same
    scaling question of the larger class. The claim is conditional and
    two-sided. UNDER H1 (x-line additive pseudorandomness, below), for
    x-interval bases on prime-order E/F_p at m = 3 and B = ceil((6N)^{1/3}),
    the excess of rho and of lambda of the top-sigma slice over the selection
    null, for sigma in {1/8, 1/32}, decays with N with fitted slope in an
    interval containing -1/2 and excluding 0, at every rung of the growth arm,
    for BOTH model classes, and the GNN-minus-trees difference is within the
    null band. THE ALTERNATIVE the design discriminates is a slope interval
    containing 0 and excluding -1/2 for the E/x-interval arm while the
    E/random, Z/N-random, canary and label-permutation cells all sit inside
    their null bands: that outcome is a replicated, control-matched,
    representation-decidable structure in the count vector, the alive branch
    of RQ-RELN-61638a's decision target, and its only permitted use is as
    INPUT to the symbolic-regression sibling IDEA-20260906-1f6bfe and to a
    proof attempt against INV-4c. A third outcome, a lift in BOTH random arms
    at matched magnitude, means the model has learned to implement the
    sumset lookup from the base's coordinates and is a rediscovery of the
    Theta(B) meet-in-the-middle existence test at charged cost c_f, not
    structure; it is subtracted, never reported as a finding.
    (D) INSTRUMENT, NOT RESULT. A learned predictor's accuracy, AUC, or lift
    is NEVER a result of this record. The record's deliverables are (i) the
    fitted decay exponent of the learned class's lift on the E/x-interval arm
    with its interval, (ii) the measured GNN-minus-trees difference, (iii) the
    measured predictor cost c_f against the Theta(B) lookup and the Groebner
    solve, and (iv) if and only if a null-separated lift survives, the
    model's top features and top-slice membership as a TABLE handed to
    IDEA-20260906-1f6bfe for compression into a closed-form candidate
    invariant, which is then a proof obligation.
    (E) NOT CLAIMED. No attack, no speedup, no ECDLP consequence, nothing
    above toy scale, nothing about solve cost or rank, nothing outside the
    trained function class, the tested panel and the tested range.

  mechanism: >-
    REPRESENTATION, OPERATION SET, TRICHOTOMY. Representation R1, affine
    coordinates. Operation set Sigma = generate-and-filter (one point
    addition to produce R, one evaluation of f_theta on the coordinates of R
    and of a FIXED small set of translates, then accept or reject). Class
    coordinate-dependent: the object is a function of the representation
    and is not asked to propagate under any group operation; it is consumed
    once per candidate target.
    LOSSY-PROJECTION TEST, RUN HERE AND NOT IN THE EXPERIMENT. The retained
    object is the pair of cell totals (sum of c_D over the predicted slice S,
    sum over the complement) and the pair of cell supports; N nonnegative
    integers collapse to four numbers. Discarded: which target was hit, the
    multiplicity profile inside a cell, the base, the curve, the field. The
    discard is Sigma-compatible because Sigma acts on the retained object
    only by choosing a cell, and the cell totals then determine the expected
    relations per accepted target (rho * mu) and the fraction of doomed solves
    avoided (lambda) exactly, which is all the relation-collection step
    consumes. Non-triviality: sigma < 1 strictly, since at sigma = 1 the
    single cell is pinned to C(B+m-1, m) by conservation and the projection
    loses nothing (this is the k = 1 baseline slice of c5c614, reproduced
    here as a mandatory check). So the object passes the test with the same
    edge c5c614's does, and what is new is only the CLASS from which the
    partition is drawn.
    WHY THE GRAPH ENTERS AT ALL, AND WHY IT MAY NOT MATTER. The relation
    hypergraph on the training targets is the bipartite incidence graph with
    node types {base point, relation, target}: one relation node per certified
    decomposition (a_1, a_2, a_3 ; r), joined to its three base nodes and its
    target node. Node features are coordinates-only (below). A message-passing
    model with K rounds computes, for a held-out target that has NO incident
    relation nodes (its edges are its labels), a readout MLP(features(R),
    g_theta(graph)) where g_theta is a learned global context pooled over base
    and training nodes. So in the inductive protocol the graph can enter the
    held-out prediction ONLY through that context, and the GNN-specific claim
    is exactly that message passing over certified decompositions produces a
    context that improves held-out prediction beyond what trees on the same
    per-target features plus base-summary features achieve. Prediction: it
    does not, difference within the null band. The reason to run the graph
    model anyway is that this is the user's stated instrument and the cheapest
    way to close it is to run it against a matched non-graph baseline rather
    than to argue.
    WHY A LIFT COULD EXIST (the causal route, copied from c5c614 and not
    improved). Sigma_m(D) is the projection of the algebraic correspondence
    cut out by Semaev's S_{m+1}(x(R), x_1, ..., x_m) applied to a structured
    box on the x-line, so any bias of that projection with respect to a cheap
    x-line function is visible from x(R) alone. INV-5 of the seed brief
    (orchestrator sketch, unreviewed, derivable from Riemann-Roch on L(4 O) =
    span{1, x, y, x^2}) reads the m = 3 count as the number of conics
    alpha x^2 + beta x + gamma y + delta = 0 through -R whose three residual
    intersections with E lie in D, so the natural per-target features are the
    evaluation vector (1, x(R), y(R), x(R)^2) that the conic through -R must
    annihilate; in plain terms, degree-2 monomials in the coordinates, and
    the record says so rather than dressing them as geometry.
    WHY THE RANDOM ARMS ARE ANALYTIC NULLS AND NOT JUST EMPIRICAL ONES. INV-3
    (seed brief, exchangeability under the affine group of Z/N): for a
    uniformly random base the law of c_D is invariant under r -> ur + t, so
    for any partition chosen independently of D every cell has expected lift
    exactly 1. DERIVED IN-RECORD, UNREVIEWED, EXTENDING INV-2' OF THE BRIEF:
    for D of B i.i.d. uniform elements of a prime-order group and two DISTINCT
    size-m multisets A, A' (with m < N), the coefficient vectors of Sigma A
    and Sigma A' in the d_i are never proportional mod N (both have entry sum
    m, so proportionality u with u*m = m forces u = 1), hence
    (Sigma A, Sigma A') is uniform on G^2, hence for r != r'
    Cov(c_D(r), c_D(r')) = M(M-1)/N^2 - M^2/N^2 = -M/N^2, i.e. the count
    vector of a random base is pairwise uncorrelated across targets to order
    mu/N (sampling without replacement perturbs this by O(m/B)). Consequence
    used by the design: on a random-base arm the TRAINING labels carry no
    second-order information about HELD-OUT labels except through D itself,
    so any lift on a random-base arm is a model reading D's coordinates and
    implementing (some approximation of) the sumset membership lookup. That
    is why the Z/N-random arm is the calibration of the model's LOOKUP
    CAPACITY at charged cost, and why E/random must match Z/N-random within
    the band (nearby-object control).
    WHY THE POSITIVE CONTROL HAS A KNOWN NUMBER. In Z/N with D = [1, B] and
    m = 3 the multiset sumset is the interval [3, 3B], of 3B - 2 elements;
    under the negation-closed convention W = +-[1, B] it is [-3B, 3B], of
    6B + 1 elements. At B = ceil((6N)^{1/3}) these have density 0.0085 (139
    of 16384) resp. 0.017 at 2^14 and 0.00106 resp. 0.0005 at 2^20, below
    1/32 at every rung, so the entire support fits inside the top-sigma
    slice for both sigma and a model that ranks the support above the
    complement attains lambda = rho = 1/sigma EXACTLY, the conservation
    ceiling (rho <= 1/sigma, c5c614 proof obligation). The pre-registered
    pass threshold is half the ceiling: lambda >= 4 at sigma = 1/8 and >= 16
    at sigma = 1/32. Below that the cell is uninformative and NO negative may
    be reported from the run (RQ-RELN-61638a constraint 2).
    INV-6 IS A THEOREM ARM, NOT A DISCOVERY. Sigma_3(D) = Sigma_2(D) + D, so
    if R - P_i is 2-decomposable then R is 3-decomposable (under the reduced
    convention up to the O(1/B) edge case a = -P_i). Providing, for k = 8
    fixed base points, the features x(R - P_i) AND the 2-decomposability
    indicator of R - P_i lets any model recover this with lambda equal to
    1 / Pr[c_D >= 1] on the theorem slice, about 1.5 at mu ~ 1. That indicator
    costs Theta(B) lookups per translate, i.e. 8 B lookups, MORE than the
    Theta(B) existence lookup it would replace, so the theorem arm is
    cost-disqualified as a predictor by construction and is kept only as the
    E-side instrument check (a model that cannot find INV-6 when handed it
    cannot find anything on E). The coordinates-only translate features
    x(R +- P_i) WITHOUT the indicator are cheap (k point additions) and are
    part of the ordinary feature set.
    THE SYMBOLIC-REGRESSION HANDOFF. If a null-separated, replicated lift
    survives on E/x-interval, the record's output is not a model but three
    tables: the top-sigma slice membership at every rung, the per-feature
    permutation importances, and the partial-dependence curves of lambda on
    each feature; these are the inputs of IDEA-20260906-1f6bfe (symbolic
    regression, sibling filed in the same batch), whose job is to compress
    them into an expression in (x, y, N, B) with reported complexity, which
    then becomes a proof obligation against INV-4c or a counterexample search
    on the proves-too-much objects. A GNN accuracy number never leaves this
    record as a result.

