  assumptions:
    - >-
      Targets are generated by the attacker as R = aP + bQ with a, b uniform,
      the scalars are discarded, and a rejected target costs one point
      addition plus one predictor evaluation c_f. Standard relation-collection
      convention; it is what makes a representation-side filter admissible.
    - >-
      The counting convention (arity m = 3; base D versus symmetric W = D u -D;
      nominal versus negation-collapsed effective size; whether the reduced
      convention excluding {P, -P} pairs is used) is frozen in the contract
      before any cell runs and is identical across arms, feature regimes and
      model classes. INV-2'' of the seed brief says that under the unreduced
      negation-closed convention the base W itself is a provable cluster
      (c_W(Q) >= |W|/2 for Q in W); whichever convention is chosen, targets
      in W and the forced multisets {P, -P, Q} are masked from training and
      scoring exactly as translation edges are, and their lift is reported
      separately as a theorem, never as a discovery.
    - >-
      Exhaustive labels at 2^14..2^20 come from the enumeration battery of the
      sibling IDEA-20260906-d1494b (or an equivalent exact enumeration with
      the closed-form total check sum_r c_D(r) = C(B_eff+2, 3), deviation
      required to be exactly 0). Labels at the sampled 2^24 rung are computed
      per target by the Theta(B) lookup R - d in (D + D) over a sorted table
      of the B(B+1)/2 pair sums, and every claimed decomposition carries a
      certificate (the three base points) that the run wrapper re-adds
      independently (docs/claims-and-verification.md). A count without checked
      identities is not a measurement.
    - >-
      OFF-LIMITS COMPONENT NAMED. The arms use the interval-on-x factor base,
      a bounded-degree algebraic base in KN-OPEN-020's scoped-out class, and
      the x-line geometries of c5c614's panel. They are used as the OBJECT
      whose count vector is measured, not as a proposed factor base; nothing
      here proposes a base that escapes KN-OPEN-020, and the record says so
      in interpretation_limits.
    - >-
      The node ordering of every graph and of every feature table is shuffled
      with a seed independent of the target-generation seed, and no positional
      encoding, node index or generation order is ever a feature. In the
      exhaustive setting the natural enumeration order of targets IS the
      discrete logarithm, so this is a leak channel and not a nicety.
    - >-
      Model capacity and training budget are frozen in the contract (layers,
      width, epochs, learning-rate schedule, tree count and depth) and are
      identical across arms; hyperparameters are selected on a VALIDATION
      split of the training targets only, never on held-out targets, and the
      selection protocol is the same for every arm.
    - >-
      Toy scale binds. N <= 2^20 exhaustive, 2^24 sampled, m = 3, generated
      prime-order curves (at least 3 per cell as RQ-RELN-61638a requires),
      B = ceil((6N)^{1/3}). Nothing is claimed at cryptographic scale.

  proof_search_map:
    bottleneck: >-
      The EXISTENCE of a cheap representation-decidable predicate on targets
      whose lift over the exchangeable null does not decay with N. Every
      other step of the relation-collection ledger is either pinned by
      conservation (the target count m! N / B^{m-1}) or lives in a different
      channel (solve cost, linear algebra, arity). c5c614 searched a
      ten-member grammar for such a predicate; this record searches a learned
      class that contains that grammar, so its null is strictly stronger and
      its positive would be strictly more surprising.
    baseline_embedding:
      parameter_slice: >-
        c5c614's frozen grammar is a parameter slice of the learned class: a
        top-k-bit or bottom-k-bit predicate on x(R) is a depth-k tree on the
        bit features and a one-hidden-layer readout with a threshold, and the
        Legendre-class predicate is a depth-1 split on the Legendre feature.
        The learned class restricted to that slice must reproduce c5c614's
        grammar lifts exactly. The k = 1 (sigma = 1) slice reproduces
        KN-FIND-007 (rho = lambda = 1 identically).
      reproduction_check: >-
        Two frozen fixtures. (i) sigma = 1 returns rho = lambda = 1 to
        floating-point exactness on every arm and every rung, and the cell
        totals of every top-sigma slice plus its complement sum to
        C(B_eff+2, 3) with integer counters and deviation exactly 0. (ii) A
        tree of depth 1 on the Legendre feature and depth-k trees on the
        top-k bits reproduce, on the same enumerated count vectors, the same
        rho and lambda that c5c614's grammar members g1-g3 return, to
        floating-point exactness; a discrepancy halts the run as an
        implementation error and nothing is reported.
    observation_collision:
      observable: >-
        The pair (rho, lambda) of the top-sigma predicted slice on held-out
        targets, per arm, rung, model class, feature regime and sigma, each
        with its selection-null band. What the observable discards: which
        targets are in the slice, the multiplicity profile inside it, and
        the model itself.
      distinct_preimage_search: >-
        Two collisions are exhibited by construction. FIRST, distinct
        predicates with identical lift: any two predicates whose slices
        contain the same TOTAL mass and the same support have identical
        (rho, lambda) while selecting entirely different targets, so the
        observable does not determine the predicate, and in particular a
        GNN and a tree with equal lift are not evidence of having found the
        same structure; that is exactly why the surviving output is a table
        of slice membership and feature attributions handed to symbolic
        regression rather than a lift number. SECOND, a lift produced by
        reading D's coordinates and implementing the sumset lookup collides
        with a lift produced by genuine x-line structure at the level of
        (rho, lambda); they are separated ONLY by the Z/N-random arm (where
        the first exists and the second cannot, by INV-3 and the in-record
        covariance derivation) and by the charged cost c_f. A run without
        the Z/N-random arm cannot tell them apart and may not report either.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The pushforward of the decomposition-count vector along the two-cell
          partition induced by a LEARNED coordinates-only predicate, with the
          function class enlarged from a frozen O(1) grammar to an inductive
          message-passing model and a gradient-boosted tree model, each
          containing the grammar as a slice.
        predicted_gain: >-
          None expected. Under H1 the excess of rho over the selection null
          decays like N^{-1/2+o(1)} for the learned class exactly as for the
          grammar, and the deliverable is the measured exponent with its
          interval over the class. If instead the exponent is 0 on
          E/x-interval with all controls in band, the gain is a candidate
          invariant for IDEA-20260906-1f6bfe and a proof obligation against
          INV-4c, still not an algorithm; the arithmetic of what it would be
          worth is in target_complexity.
      - transform: observable_fiber
        proposed_object: >-
          The Z/N-random arm as the fibre of the observable over 'lookup
          capacity': it exhibits every lift a coordinates-reading model can
          produce WITHOUT representation structure, so that subtracting it
          from the E arms isolates structure from lookup.
        predicted_gain: >-
          Diagnostic only. Predicted Z/N-random lift within the null band for
          the frozen model budgets; if it is above band, the subtraction is
          performed and the model's c_f is reported as the price of the
          rediscovered lookup.
    quantifier_order: >-
      THERE EXISTS a trained predictor f in the frozen function class F_theta
      (fixed architecture, budget and feature regime, trained on a training
      split of one arm at one rung), with slice density sigma in {1/8, 1/32},
      such that FOR ALL rungs N in the tested range the held-out excess of
      rho over the selection null exceeds a fixed c > 0, replicated across
      >= 3 curves and >= 3 training seeds. The witness predictor is ALLOWED
      to be retrained per rung; that is the honest order and it is strictly
      weaker than a uniform predicate, which is why a positive result is an
      existence witness and not an algorithm. The negative result closes only
      the existential over the trained class, the tested panel, the tested
      feature regimes and the tested range; it is a bounded obstruction with
      a number, not a verdict on learned predictors in general.
    method_ceiling:
      strongest_certifiable_claim: >-
        A measured decay exponent for the lift of the best held-out predictor
        in ONE trained class over ONE five-arm panel (four mandatory arms plus
        the log-interval canary) at FOUR exhaustive rungs and ONE sampled
        rung at toy scale, with a selection null, an analytic null, a
        label-permutation null and a non-graph baseline, plus the measured
        GNN-minus-trees difference and the measured c_f. A learned predictor
        gives an EXISTENCE WITNESS when it finds structure and NEVER a
        non-existence proof when it does not; the closure over the function
        class is only over the trained class at the trained budget, and a
        larger class, a different feature regime or a longer budget is a new
        record. The method can never certify anything about solve cost, rank,
        or ECDLP hardness.
      nearby_object_control: >-
        Z/N WITH A RANDOM BASE, and the E/random-base arm that must match it.
        By INV-3 and the in-record covariance derivation the count vector of
        a random base carries no structure visible to any partition chosen
        independently of D, so every lift there is lookup, not structure; a
        method that reports a lift on Z/N-random equal to its lift on
        E/x-interval has found nothing about the curve. The second nearby
        object is the E/LOG-INTERVAL canary (small-multiples base D = {[j]P :
        j in [1, B]}, c5c614's log-space anchor and H017), whose count vector
        has a large lift in the LOG coordinate (RT-4's 8.01 on a 1/8 window)
        and none visible from coordinates; a coordinates-only model that
        shows a lift there has either leaked the logarithm or found a DLP
        predictor, and either halts the run for audit under IDEA-20260806-
        94676a's protocol before anything is reported.
    proof_obligations:
      - claim: >-
          sigma = 1 reproduces rho = lambda = 1 and slice totals sum to
          C(B_eff+2, 3) with deviation exactly 0 on every arm and rung.
        responsibility: baseline
      - claim: >-
          The tree and readout slices of the learned class reproduce
          c5c614's grammar lifts g1-g3 to floating-point exactness on the
          same count vectors.
        responsibility: correctness
      - claim: >-
          For an i.i.d. uniform base of size B in a prime-order group with
          m < N, Cov(c_D(r), c_D(r')) = -M/N^2 for r != r' (derived
          in-record, unreviewed), so that training labels of a random-base arm
          carry no second-order information about held-out labels except
          through D; validated empirically by the H2 route below.
        responsibility: success_probability
      - claim: >-
          On Z/N with D = [1, B] the multiset 3-sumset is [3, 3B] (or
          [-3B, 3B] under W = +-D), of density below 1/32 at every rung, so a
          perfect ranker attains lambda = rho = 1/sigma exactly.
        responsibility: feasibility
      - claim: >-
          rho <= 1/sigma exactly (conservation on the cell), so a lift ~
          N^delta requires sigma <= N^{-delta}, and with predictor cost c_f
          and solve cost s the filter is worthwhile only if c_f / sigma <=
          s / rho, i.e. c_f <= s N^{-2 delta} at the ceiling.
        responsibility: strictness
      - claim: >-
          Under the c5c614 ledger (s = Theta(1), L = Theta(B^2)) a sustained
          rho ~ N^delta moves the m = 3 relation-collection exponent from 1/2
          to (1-delta)/2; under the 772cff ledger with s(B) = Theta(B) it
          moves 2/3 to (2/3)(1-delta); a constant rho moves neither.
        responsibility: runtime
      - claim: >-
          Predictor evaluation cost c_f per target is O(1) field operations
          plus k = 8 point additions plus one readout MLP of frozen width,
          and is measured in-process against the Theta(B) lookup and the
          Groebner solve.
        responsibility: memory
      - claim: >-
          Nothing here is a statement about coverage, rank, solve cost or
          ECDLP hardness, and the closure is over the trained class only.
        responsibility: scope

  object_first_candidate:
    tracked_object: >-
      The two-cell pushforward of c_D along the top-sigma slice of a learned
      coordinates-only predictor on held-out targets, together with the
      predictor's charged evaluation cost c_f. Same object family as
      IDEA-20260830-c5c614 with the partition class enlarged from a frozen
      grammar to a trained function class.
    lossiness: >-
      N counts to four numbers (two totals, two supports); discards target
      identity, in-cell multiplicity profile, base, curve, field and the
      model. Non-trivial only at sigma < 1; sigma = 1 is the conservation
      identity and is the baseline check.
    propagation: >-
      Consumed once per generated target by the generate-and-filter step;
      the retained totals determine expected relations per accepted target
      and the fraction of doomed solves avoided exactly. Not asked to
      propagate under any group operation.
    survival_score: >-
      New versus repackaging: the OBJECT is c5c614's; what is new is the
      function class, the inductive protocol, the analytic null via INV-3
      and the in-record covariance, the lookup-capacity calibration arm, and
      the symbolic-regression handoff. Testable: yes, every quantity is
      computed exactly from enumerated count vectors at toy scale. Survival:
      the object survives exactly as far as the lift survives with N, which
      is the measurement; the prediction is that it dissolves at rate
      N^{-1/2}.

  null_object_control: >-
    FOUR NULLS, EACH WITH A DIFFERENT JOB. (1) RANDOM-PARTITION SELECTION
    NULL, c5c614's, 1000 random subsets of the held-out set at the identical
    density sigma, giving the empirical band of rho and lambda for a slice
    chosen without information; every effect is an excess over this band.
    (2) ANALYTIC EXCHANGEABLE NULL of INV-3 with the in-record covariance:
    for a random base and a partition independent of D, E[rho] = 1 exactly
    and Var(rho) over a random slice of size sigma N_test is approximately
    (1 - sigma) Delta / (mu sigma N_test), Delta the dispersion index
    (INV-2, measured exactly by the sibling battery; Poisson value 1 - 1/N
    for a random base). Pre-computed 2-sigma bands for rho at N_test = N/2,
    Delta = 1, using the frozen B: about +-0.12 at 2^14 and +-0.015 at 2^20
    for sigma = 1/32, +-0.055 at 2^14 and +-0.007 at 2^20 for sigma = 1/8
    (in-record arithmetic, to be replaced by the measured Delta). The
    empirical band (1) must agree with (2) on the random arms; disagreement
    means the sampler or the enumeration is wrong. (3) LABEL-PERMUTATION
    NULL: retrain the identical model on the identical graph with training
    labels permuted among training targets; its held-out slice must sit
    inside band (1) on EVERY arm including Z/N-interval; a lift under
    permuted labels is a leak (a feature or the node order is a function of
    the logarithm) and halts the run. (4) STRUCTURE-FREE OBJECT NULL: the
    Z/N-random arm, calibrating the model's lookup capacity, and the
    E/log-interval canary, calibrating leakage of the logarithm. PLANTED
    LEAK CHECK ON THE AUDIT ITSELF: one diagnostic run deliberately adds
    log(R) mod 2 as a feature and must be CAUGHT by the static audit (the
    feature module may not import the scalar or the enumeration index) and
    by null (3); an audit that passes the planted leak is broken and no
    result from the run stands.

  discriminated_from:
    - >-
      IDEA-20260726-003 (per-target difficulty predictor from Semaev fibre
      invariants). That record computes a geometric invariant of the fibre
      PER TARGET (point count, Galois group, factorisation pattern) and
      correlates it with Groebner cost; its features are expensive
      (factoring over F_p), its target is solve time, its control is a
      random predictor, and it has no growth arm. This record learns from
      the INCIDENCE GRAPH with coordinates-only O(1) features, scores by
      c5c614's rho and lambda against the selection null and an analytic
      null, carries the four-arm panel, a label-permutation null and a growth
      arm, and asks whether the count vector has representation-visible
      structure at all rather than whether a specific fibre invariant
      predicts solve cost. A fibre invariant could be added as a FEATURE of
      this instrument; that is the only overlap.
    - >-
      IDEA-20260830-c5c614 (frozen grammar of x-line predicates). This record
      is that record's learned SUPERCLASS: it contains the grammar as a
      parameter slice, reuses its metrics, its selection null, its growth arm
      and its two decay exponents unchanged, and returns to it the analytic
      form of its null (INV-3 with the in-record covariance). It adds the
      inductive protocol, the Z/N arms, the label-permutation null, the
      lookup-capacity calibration, the GNN-versus-trees isolation and the
      symbolic-regression handoff. A null here is a strictly stronger
      closure than a null there; a positive here would be strictly more
      surprising.
    - >-
      IDEA-20260815-f9e978 (measure the distribution of P(decomp | target)).
      That record asks whether decomposability SPREADS across targets; this
      one asks whether the spread is PREDICTABLE from the representation.
      Sequenced that-then-this: if f9e978 finds no spread beyond the random
      null, this record's E arms have nothing to predict and the run reduces
      to its controls; if it finds a spread, this record asks whether it is
      visible from coordinates.
    - >-
      IDEA-20260806-94676a (representation learning for latent
      linearisation, costed by the preprocessing bound). That record asks
      whether ANY learned model uses coordinate structure for the DLP itself
      and sizes the advice; this record asks the far narrower question
      whether decomposability over a FIXED base is predictable from
      coordinates, borrows its scrambled-group control as the Z/N arms and
      its 'must beat a table' obligation as the Theta(B) lookup comparison,
      and adds the structured-base positive control that record has no
      analogue of.
    - >-
      IDEA-20260806-071255 (typed automatic invariant discovery). That record
      makes invariant discovery non-vacuous by typing lenses; this record
      produces, in its positive branch, one specific typed table (slice
      membership, feature attributions) for the symbolic-regression sibling
      to compress, and in its negative branch a measured obstruction. It is
      an instrument feeding that pipeline, not a competitor.
    - >-
      IDEA-20260906-86cd30 (m = 2 decomposition graph is a path; exact
      random-base law). That record proves the structure of the incidence
      graph at m = 2 and brackets m = 3 by Janson; its exact m = 2 law is a
      recovery control for the symbolic-regression sibling and a sanity check
      for this record's enumeration, not a competitor. At m = 2 the learned
      predictor question is answered by that theorem (2-decomposability of R
      over a random base is a fixed-density event with an exact law and no
      coordinate structure), which is why this record runs m = 3.

  predictions:
    - metric: >-
        sigma = 1 baseline slice and closed-form total check per arm per rung
      direction: different
      minimum_effect: >-
        FORCED EXACT. rho = lambda = 1 at sigma = 1; slice total plus
        complement total equals C(B_eff+2, 3) with deviation exactly 0. Any
        deviation halts the run as an implementation error.
    - metric: >-
        Z/N-interval positive control: lambda and rho of the top-sigma slice,
        both model classes, coordinates-only features
      direction: higher
      minimum_effect: >-
        lambda >= 4 and rho >= 4 at sigma = 1/8; lambda >= 16 and rho >= 16
        at sigma = 1/32 (half the conservation ceiling 1/sigma, which a
        perfect ranker attains exactly because the sumset [3, 3B] has density
        below 1/32 at every rung). Expected value 1/sigma. A cell below the
        threshold is UNINFORMATIVE and no negative result may be reported
        from that rung and model class.
    - metric: >-
        Z/N-random structure-free control: excess of rho and lambda over the
        selection null, both model classes
      direction: different
      minimum_effect: >-
        Predicted within the null band (2 sigma of null (2), Holm-corrected
        across the panel). If ABOVE band, the excess is the model's lookup
        capacity from reading D's coordinates; it is recorded with the
        model's measured c_f, subtracted from the E arms at matched budget,
        and never reported as structure. The E/random arm must agree with
        Z/N-random within band (nearby-object control); disagreement is a
        pipeline fault.
    - metric: >-
        label-permutation null on every arm, and the E/log-interval canary
        with coordinates-only features
      direction: different
      minimum_effect: >-
        Predicted within the null band on all arms. A permuted-label lift
        above band, or a canary lift above band, is a LEAK and halts the run;
        nothing else in the run is readable until the leak is found.
    - metric: >-
        E/x-interval excess of rho and lambda over the selection null, per
        rung, per model class, per sigma, after subtracting the Z/N-random
        lookup capacity
      direction: different
      minimum_effect: >-
        Minimum reportable excess at each rung is the Holm-corrected 2-sigma
        band of null (2) at that rung (about 0.12 at 2^14 and 0.015 at 2^20
        for sigma = 1/32 with Delta = 1, to be replaced by the measured Delta
        and the empirical band). Below that it is reported as unresolved,
        not as an effect and not as a null.
    - metric: >-
        fitted slope of log(excess of max(rho) over null) against log N on
        the E/x-interval arm, four exhaustive rungs plus the sampled 2^24 rung
      direction: different
      minimum_effect: >-
        Compared against the two values copied from c5c614 and no sign is
        pre-committed. Interval containing -1/2 and excluding 0: square-root
        cancellation, the learned class is CLOSED with an exponent attached.
        Interval containing 0 and excluding -1/2, with every control cell in
        band: the channel is ALIVE over the trained class and the output goes
        to IDEA-20260906-1f6bfe and to a proof attempt against INV-4c.
        Interval containing both: underpowered, reported as such with the
        number of additional rungs computed.
    - metric: >-
        GNN-minus-trees difference in excess lift, same features, same
        splits, same budget, per arm per rung
      direction: different
      minimum_effect: >-
        Predicted approximately 0, |difference| within 2 sigma of the
        selection null. A positive difference that replicates across >= 3
        curves and >= 3 seeds and does not shrink with N is the ONLY
        GNN-specific finding this record can produce, and it is a finding
        about the instrument, to be explained by inspecting the learned
        context g_theta, not a finding about the curve.
    - metric: >-
        INV-6 theorem arm: lambda on the slice 'some translate R - P_i is
        2-decomposable', k = 8, indicator supplied
      direction: higher
      minimum_effect: >-
        lambda >= 1.4 at mu ~ 1 (theoretical value 1 / Pr[c_D >= 1], about
        1.5 to 1.6 at these rungs). Instrument check on the E side; failure
        means the model cannot see a theorem it was handed and the E cells
        are uninformative.
    - metric: >-
        predictor evaluation cost c_f per target, in field-operation and
        point-addition equivalents, versus the Theta(B) lookup and the
        Groebner solve, measured in-process
      direction: lower
      minimum_effect: >-
        Predicted c_f of about 10 to 15 point-addition equivalents (k = 8
        translates, two Legendre symbols, one readout MLP or one tree
        ensemble), against B = 117 to 466 lookups per target on the growth
        arm; a measured ratio c_f / (B lookups) >= 1 means the predictor is
        never cheaper than the existence test it would gate and the cost
        half is closed at these parameters regardless of lift.

  minimal_test:
    design: >-
      STAGE 0, ZERO COMPUTE, HARD GATE. Freeze in the contract: the counting
      convention and the masking of W and the forced multisets; the panel
      (E/x-interval object, E/random matched at negation-collapsed effective
      size, Z/N-interval [1, B] positive control, Z/N-random negative control,
      E/log-interval canary); the feature set F0 (x, y, low 4 bits of x and y,
      Legendre symbols of x and of x + 1, the L(4 O) evaluation vector
      (1, x, y, x^2), x(R +- P_i) for k = 8 base points fixed by seed) and F1
      (F0 plus a 16-bin histogram of x(D) and the Legendre profile of D as
      base-summary features); the theorem arm F0 plus the 2-decomposability
      indicators of the 8 translates; the architectures (a K = 3 inductive
      message-passing model of frozen width over the {base, relation, target}
      bipartite graph with mean and sum aggregation, and a gradient-boosted
      tree ensemble of frozen size); the train/validation/held-out split of
      targets (50/10/40 by an independent seed); sigma in {1/8, 1/32}; the
      pooling rule for small cells; the Holm family; the static leak audit
      (feature module may import neither the scalar nor the enumeration
      index) and the planted-leak check of the audit. Verify each arm's
      constructed geometry against its label from source, per
      IDEA-20260829-c6e7a4's warning as cited in c5c614.
      STAGE 1, LABELS. Exhaustive count vectors at N ~ 2^14, 2^16, 2^18, 2^20
      (B = 47, 74, 117, 185) from the sibling battery IDEA-20260906-d1494b or
      an equivalent exact enumerator with the closed-form total check; at
      2^24 (B = 466) a fixed sample of 2^16 targets labelled by the Theta(B)
      lookup over the sorted D + D table, each claimed decomposition
      certified by the wrapper re-adding the three points. Three generated
      prime-order curves per rung, three base seeds, three training seeds.
      STAGE 2, GRAPH AND TRAINING. Build the certified relation hypergraph on
      the TRAINING targets only; shuffle node order by an independent seed;
      train both model classes under the frozen budget on regimes F0 and F1
      for every arm; select hyperparameters on the validation split only.
      STAGE 3, SCORING. On held-out targets rank by predicted score, take the
      top-sigma slice, compute rho and lambda exactly from the enumerated
      counts, run the sigma = 1 and grammar-slice reproduction fixtures, draw
      1000 random slices for the selection null, compute the analytic band
      from the measured Delta, run the label-permutation retrain, score the
      canary and the theorem arm.
      STAGE 4, GATES AND FIT. Gate 1: Z/N-interval above threshold for the
      model class, else that class is uninformative at that rung. Gate 2:
      permutation and canary in band, else halt for leak. Gate 3: E/random
      agrees with Z/N-random in band, else pipeline fault. Then subtract the
      Z/N-random excess (lookup capacity) from the E arms at matched budget,
      fit log(excess) against log N per arm and class, report the slope with
      its Holm-corrected interval against -1/2 and 0, and report the
      GNN-minus-trees difference.
      STAGE 5, COST. Instrument c_f, t_gen, the Theta(B) lookup and (on a
      declared wall-clock cap, timing only) the Groebner solve in the same
      process at every rung; recompute the admissible sigma floor from the
      measured ratios.
      STAGE 6, HANDOFF. If and only if an E/x-interval excess survives all
      gates at every rung with slope interval excluding -1/2, emit the three
      tables (slice membership per rung, permutation importances,
      partial-dependence curves) as the input artefact for
      IDEA-20260906-1f6bfe. Otherwise emit the measured exponent and band as
      the obstruction with forward guidance.
      ENVELOPE. Exhaustive labels are the sibling's O(B^3/6 + N) per cell.
      The relation graph at 2^20 has about 1.07e6 relation nodes and 4.3e6
      edges; training a width-64, K = 3 model on it is minutes to an hour per
      epoch on CPU and fits in a few GB; the full design (5 arms x 5 rungs x
      3 curves x 3 base seeds x 3 training seeds x 2 regimes x 2 classes) is
      tens to a few hundred core-hours, dominated by training. Peak memory is
      declared per job and capped as machine protection; workers bounded.
      Compute is not a stop (docs/research-budget-policy.md). No Groebner
      basis is built except for Stage 5 timing under its cap, and a cap hit
      is failed_infrastructure under AGENTS.md rule 3, never evidence.
    controls:
      - >-
        Z/N-INTERVAL POSITIVE CONTROL, threshold half the ceiling 1/sigma.
        BLOCKING: a model class that fails it is uninformative at that rung
        and no negative may be reported from it.
      - >-
        Z/N-RANDOM STRUCTURE-FREE NEGATIVE CONTROL, calibrating lookup
        capacity; E/RANDOM matched at effective size, which must agree with
        it (nearby-object control).
      - >-
        RANDOM-PARTITION SELECTION NULL, 1000 random slices at density sigma
        on the held-out set, per cell. BLOCKING.
      - >-
        ANALYTIC EXCHANGEABLE NULL from INV-3 and the in-record covariance,
        with the measured dispersion index; must agree with the empirical
        band on the random arms.
      - >-
        LABEL-PERMUTATION NULL, retrained per cell; must be in band on every
        arm including the positive control. BLOCKING.
      - >-
        E/LOG-INTERVAL CANARY, small-multiples base with coordinates-only
        features; must be in band; a lift is a leak or a DLP predictor and
        halts for audit.
      - >-
        PLANTED-LEAK CHECK of the audit: log(R) mod 2 added as a feature in
        one diagnostic run must be caught by the static audit and by the
        permutation null.
      - >-
        INV-6 THEOREM ARM as the E-side instrument check, cost-disqualified
        as a predictor by construction.
      - >-
        NON-GRAPH BASELINE (gradient-boosted trees) on identical features,
        splits and budget, so that any GNN-specific gain is isolated.
      - >-
        sigma = 1 BASELINE SLICE and GRAMMAR-SLICE reproduction fixtures
        (KN-FIND-007 and c5c614 g1-g3), exact.
      - >-
        CLOSED-FORM TOTAL CHECK per slice, deviation exactly 0, and
        certificate re-verification of every decomposition used as a label
        or an edge.
      - >-
        NODE-ORDER SHUFFLE by an independent seed; no positional encoding,
        index or generation order as a feature.
    required_metrics:
      - >-
        exact count vector, slice totals and supports per arm, rung, class,
        regime, sigma; closed-form total residual (required 0)
      - >-
        rho and lambda of the top-sigma held-out slice with bootstrap
        intervals; sigma = 1 values (required 1); grammar-slice values
        against c5c614 g1-g3 (required equal)
      - >-
        selection-null distribution (1000 draws) of rho and lambda per cell;
        analytic band from measured Delta; agreement statistic on random arms
      - >-
        label-permutation lift per cell; canary lift per rung; planted-leak
        audit outcome
      - >-
        Z/N-interval lift per class per rung against the 1/sigma ceiling and
        the half-ceiling threshold; theorem-arm lambda per rung
      - >-
        Z/N-random and E/random excess per cell with their agreement
        statistic; the subtracted lookup capacity per budget
      - >-
        E/x-interval excess per cell after subtraction, with Holm-corrected
        band; fitted slope of log(excess) vs log N with interval, per class,
        per sigma
      - >-
        GNN-minus-trees difference per cell with interval
      - >-
        measured c_f, t_gen, Theta(B) lookup time and Groebner solve time
        (timing only, capped) per rung; derived admissible sigma floor;
        ratio c_f / (B lookups)
      - >-
        training-set versus held-out lift reported SEPARATELY (a training-set
        lift is memorisation and is not evidence)
      - >-
        feature permutation importances and partial-dependence tables per
        cell; slice membership per rung (the handoff artefact)
      - >-
        curves (p, N, equation), base seeds, training seeds, split seeds,
        convention, effective sizes, peak RSS and wall time per job

  falsification_conditions:
    - >-
      Any slice's totals fail to sum to C(B_eff+2, 3), or sigma = 1 returns
      anything but rho = lambda = 1, or the grammar slices disagree with
      c5c614's values. Implementation error; halt; nothing reported.
    - >-
      Z/N-interval lift below half the ceiling for a model class at a rung.
      That class is UNINFORMATIVE at that rung; no negative may be reported
      from it; the record's own instrument claim (H4) is refuted for that
      budget.
    - >-
      Label-permutation lift or canary lift above band. LEAK; halt for audit;
      nothing in the run is readable until it is found and the run repeated.
    - >-
      E/random and Z/N-random disagree beyond band. Pipeline fault (the arms
      are not what their labels say, or the sampler is broken); halt.
    - >-
      E/x-interval excess inside the band at every rung for both classes,
      with all controls passing, OR fitted slope interval containing -1/2
      and excluding 0. THE LEARNED CLASS IS CLOSED over the trained class,
      panel, regimes and range, with an exponent attached; this is the
      expected outcome and the deliverable is the measured obstruction with
      its band, not a verdict on learned predictors.
    - >-
      Fitted slope interval containing 0 and excluding -1/2 on E/x-interval,
      replicated across curves and seeds, with every control in band and
      after subtracting lookup capacity. THE CHANNEL IS ALIVE over the
      trained class; H1 is refuted at toy scale for the learned class; the
      output goes to IDEA-20260906-1f6bfe and to a proof attempt; still not
      an algorithm.
    - >-
      GNN-minus-trees difference above band, replicated, non-shrinking. The
      graph context carries information the features do not; an instrument
      finding, to be explained by inspecting g_theta, and a reason to widen
      the feature set of the tree baseline in a successor record.
    - >-
      Measured c_f / (B lookups) >= 1 at every rung. The predictor is never
      cheaper than the existence test it gates; the cost half is closed at
      these parameters whatever the lift.

  confounders:
    - >-
      OVER-FITTING TO THE TRAINING TARGETS' RELATION GRAPH. A model with
      enough capacity memorises the training incidence structure; only
      held-out lift counts, training-set lift is reported separately and
      never as evidence (IDEA-20260806-94676a's second control).
    - >-
      FEATURE LEAKAGE VIA SHARED RANDOMNESS OR ORDER. In the exhaustive
      setting the enumeration index IS the logarithm; the target-generation
      scalar, any positional encoding, and any ordering correlated with
      generation are leak channels. The independent node-order shuffle, the
      static audit, the permutation null, the canary and the planted-leak
      check exist for this and each is blocking.
    - >-
      SELECTION BY MAXIMUM OVER MANY PREDICATES. Two classes, two regimes,
      two sigmas, several seeds and hyperparameter choices make the reported
      excess a maximum over dozens of statistics; hyperparameters are chosen
      on the validation split only, every reported excess is over the
      selection null, and one Holm correction runs across the whole panel
      per rung.
    - >-
      LOOKUP CAPACITY MASQUERADING AS STRUCTURE. A model reading D's
      coordinates in regime F1 (or via pooled base-node context in the GNN)
      can implement part of the sumset membership test; the Z/N-random arm
      measures this at matched budget and it is subtracted. Without that arm
      a lift on E/x-interval is uninterpretable.
    - >-
      THE FORCED CLUSTER OF INV-2''. Under the unreduced negation-closed
      convention the base W itself has c_W(Q) >= |W|/2; a model that learns
      'R is a base point' has found a theorem. W and the forced multisets are
      masked from training and scoring under whichever convention is frozen.
    - >-
      SMALL-CELL VARIANCE AND RUNG-DEPENDENT RESOLUTION. At 2^14 with sigma
      = 1/32 the held-out slice has about 256 targets and the null band is
      +-0.12; the band shrinks with N, so a fitted slope on raw excess
      confounds resolution with decay. Excess is reported in units of the
      rung's own band as well as raw, and the slope is fitted on both.
    - >-
      GEOMETRY-FEATURE ALIGNMENT. The x-interval base and the top-bits-of-x
      features are aligned by construction (c5c614's g4 confounder); a lift
      on that alignment is the least surprising and least transferable, and
      is reported separately from lifts on geometry-agnostic features.
    - >-
      ARCHITECTURE FAILURE READ AS ABSENCE. A model that cannot fit an
      interval threshold in Z/N says nothing about E; that is exactly why
      the positive control is blocking rather than advisory.
    - >-
      SOLVER AND TIMING NOISE in Stage 5. Groebner times at toy scale are
      implementation-bound; the cost comparison is reported as a ratio
      distribution with its inter-quartile range, and the solve appears only
      for timing under a cap.

  interpretation_limits:
    - >-
      Toy scale: N <= 2^20 exhaustive, one sampled rung at 2^24, m = 3,
      generated curves. A fitted exponent over five rungs is a trend with a
      wide interval and may not be quoted as an asymptotic rate.
    - >-
      Closure is over the TRAINED CLASS ONLY (two architectures, frozen
      budgets, two feature regimes). A learned predictor's null is not a
      non-existence proof; a wider class, feature set or budget is a new
      record. This is the method ceiling and is stated as such.
    - >-
      No ECDLP claim in any outcome. A surviving lift is an existence witness
      for representation-visible structure in c_D at toy scale, an input to
      symbolic regression and a proof obligation, not a speedup; a null is a
      bounded obstruction with a number.
    - >-
      A GNN accuracy, AUC or lift is never a result. The record's outputs are
      the exponent, the GNN-minus-trees difference, the cost ratio and (in
      the positive branch) the handoff tables.
    - >-
      Measures neither coverage nor rank nor solve cost and may not be cited
      about any of them; the observable provably fails to determine them
      (c5c614's collision argument applies verbatim).
    - >-
      KN-OPEN-020 CLASS. The x-interval base is a bounded-degree algebraic
      base in the scoped-out class; it is the measured object, not a proposed
      base, and nothing here claims an escape from KN-OPEN-020.
    - >-
      NOVELTY NOT ADJUDICATED. The crypto-kb index was empty, no web search
      was run, and every external reference is recalled; the specific checks
      a reviewer should make are named in novelty_screen.
    - >-
      The in-record covariance derivation and the seed brief's INV-2 to INV-6
      are unreviewed sketches; the design treats them as candidate statements
      validated by H2's route, not as theorems, and any of them failing
      empirically is itself reportable.

  heuristic_assumptions:
    - id: H1
      statement: >-
        X-LINE ADDITIVE PSEUDORANDOMNESS FOR THE LEARNED CLASS. For a factor
        base D of size B = ceil((6N)^{1/3}) defined by an x-interval on a
        prime-order E/F_p at m = 3, and for the top-sigma slice S of ANY
        predictor in the frozen trained class F_theta with sigma in
        {1/8, 1/32}, the slice total satisfies sum_{r in S} c_D(r) =
        sigma C(B+2, 3) (1 + O(N^{-1/2+eps})) for every eps > 0, uniformly
        over the class, so that the excess of rho over the selection null
        decays like N^{-1/2+o(1)}. This is c5c614's H1 with the grammar
        replaced by the trained class.
      rigorous_support: >-
        The rigorous half is conservation itself (KN-FIND-007), which pins
        the sum of the slice totals exactly so deviations must cancel. The
        classical statement imitated is Weil-type square-root cancellation
        for character sums along a curve, in the form of the recalled
        Kohel-Shparlinski bound for points with x in an interval; per the
        seed brief's INV-4 (unreviewed) that bound proves the no-cluster
        statement only for B above p^{3/5} at m = 3, far above the
        index-calculus B ~ p^{1/3}, so at the tested B the assumption is a
        genuine heuristic and is exactly what the growth arm measures. The
        proves-too-much control is Z/N with the interval base, where
        |S_D(chi)| ~ B at low frequencies and the bound correctly fails; the
        instrument must see that over-dispersion or it sees nothing.
      validation_plan: >-
        SAMPLE the complete count vector for every arm at N ~ 2^14, 2^16,
        2^18, 2^20 by exhaustive enumeration (no sampling error; uncertainty
        only across 3 curves x 3 base seeds x 3 training seeds per rung) and
        a fixed 2^16-target sample at 2^24 with certificates. COMPARISON
        DISTRIBUTION: the normalised slice deviation (slice total - sigma
        total) / sqrt(sigma total Delta / mu) for the learned slice against
        the selection-null distribution of the same statistic, per rung, by
        Kolmogorov-Smirnov at the 1 percent level; the excess against the
        N^{-1/2} envelope. TAIL CHECKS: (a) the single largest excess across
        the panel at each rung against the max-of-k order statistic of the
        null; (b) the dispersion index Delta of every arm (INV-2, exact from
        the sibling battery) against the Poisson value 1 - 1/N, reported
        alongside every lift because it is the second-moment quantity the
        assumption is really about; (c) the fitted decay exponent with its
        interval against -1/2. TRANSFER ASSUMPTIONS: none; nothing above 2^24
        is claimed, curves are generated not standardised, the exponent is a
        toy-scale trend.
    - id: H2
      statement: >-
        RANDOM-BASE PAIRWISE DECORRELATION (INV-3 sharpened, derived
        in-record, unreviewed). For D of B i.i.d. uniform elements of a
        prime-order group of order N > m and any r != r',
        Cov(c_D(r), c_D(r')) = -M/N^2 with M = C(B+m-1, m), and for any
        partition chosen independently of D every cell has E[rho] = 1
        exactly; hence on the random-base arms any held-out lift is a
        function of D's coordinates (lookup capacity) and not of the training
        labels.
      rigorous_support: >-
        Elementary: for distinct multisets A != A' the integer coefficient
        vectors of Sigma A and Sigma A' in the d_i both have entry sum m, so
        they are proportional mod N only with factor u = 1 (u m = m, N prime
        > m), i.e. never; two non-proportional linear forms in i.i.d. uniform
        variables over a prime field are jointly uniform on G^2; the
        covariance then follows by double counting as in KN-FIND-007. The
        classical statement imitated is the pairwise independence of linear
        forms over a prime field. Sampling WITHOUT replacement and the
        negation-closed convention perturb the constant by O(m/B) and are
        not covered by the derivation; that gap is what the validation
        measures.
      validation_plan: >-
        SAMPLE: on the Z/N-random and E/random arms at every exhaustive rung,
        the empirical autocovariance of the count vector at all lags in the
        representation ordering (x-coordinate order on E, residue order on
        Z/N) and at 1000 random pairings, from the exact enumerated vectors
        under the frozen convention, over 3 base seeds. COMPARISON: against
        -M/N^2 with the finite-population correction, and the cell-lift
        variance against (1 - sigma) Delta / (mu sigma N_test). TAIL CHECK:
        the maximum absolute autocovariance over lags against the Gaussian
        max-of-N order statistic for the null; a lag with covariance far
        above the envelope on a RANDOM arm falsifies the derivation or the
        sampler and is reported either way. TRANSFER: none; the statement is
        exact for i.i.d. bases at every N and only the without-replacement
        and convention corrections are empirical.
    - id: H3
      statement: >-
        PREDICTOR AFFORDABILITY. At the frozen feature set and architecture,
        the per-target evaluation cost c_f is at most 20 point-addition
        equivalents, hence below the Theta(B) existence lookup by a factor
        of at least B/20 (about 6 at 2^14, 23 at 2^24), and below one
        Groebner solve attempt by at least 10^3; consequently a slice of
        density sigma >= 10^{-2} adds at most 10 percent to
        relation-collection cost under c5c614's ledger.
      rigorous_support: >-
        No theorem; an ENGINEERING RATIO, labelled as such. Its only prior
        support is c5c614's H2 (itself resting on EV-R6-001's second-hand
        figure that an m = 3 chained-Semaev solve is 2.0e4 to 1.5e5 times a
        Pollard rho solve). The exponent-relevance condition it feeds is
        exact arithmetic: with rho <= 1/sigma, a filter is worthwhile only if
        c_f / sigma <= s / rho, so at the ceiling rho = 1/sigma and rho ~
        N^delta the predictor needs c_f <= s N^{-2 delta}; with the
        meet-in-the-middle s = Theta(B) = Theta(N^{1/3}) this is c_f =
        O(N^{1/3 - 2 delta}), which a constant-cost predictor satisfies for
        delta <= 1/6 and no predictor satisfies beyond it.
      validation_plan: >-
        SAMPLE: instrument c_f (feature computation plus model inference),
        t_gen, the Theta(B) lookup and the Groebner solve in the SAME process
        on the SAME machine at every rung, over >= 200 targets per rung for
        c_f and the lookup and >= 100 solve attempts including failures for
        the solve, under a declared cap. COMPARISON: the ratio distributions
        with inter-quartile ranges, never point estimates. TAIL CHECK: the
        slowest observed c_f against the fastest observed lookup, because
        affordability is governed by that pair. TRANSFER: none; machine-,
        implementation- and parameter-specific; the admissible sigma floor
        is recomputed from the measurement.
    - id: H4
      statement: >-
        INSTRUMENT LEARNABILITY. Under the frozen budgets, both model classes
        recover (i) the Z/N-interval positive control to at least half its
        ceiling (lambda, rho >= 0.5/sigma) and (ii) the INV-6 theorem arm on
        E to lambda >= 1.4 at mu ~ 1, at every rung, from coordinates-only
        features plus the supplied indicators respectively.
      rigorous_support: >-
        No theorem beyond the trivial observation that an interval threshold
        on a residue is a depth-1 tree and a one-neuron readout, and that
        the theorem-arm slice is a disjunction of 8 supplied indicators
        (depth-8 tree, one-layer readout). The classical statement imitated
        is the universal-approximation capacity of the architectures, which
        says nothing about finite budgets; this assumption is what turns 'the
        model found nothing' into 'there is nothing in the trained class to
        find' and is therefore pre-registered as blocking.
      validation_plan: >-
        SAMPLE: the positive-control and theorem-arm cells themselves at
        every rung, 3 training seeds each. COMPARISON: lambda and rho against
        the ceiling 1/sigma resp. 1/Pr[c_D >= 1] and the half-ceiling
        thresholds. TAIL CHECK: the worst seed, because an instrument that
        recovers the control only sometimes is not an instrument. TRANSFER:
        none; a failure at a rung marks that rung and class uninformative
        and no negative is reported from it.

  target_complexity:
    time_exponent: >-
      MEASUREMENT; NO ALGORITHM AND NO EXPONENT CLAIMED. The exponent
      arithmetic is stated so the measurement reads as a cost. Under c5c614's
      ledger (m = 3, t_solve = Theta(1), L(B) = Theta(B^2)) the total is
      6N/(rho B^2) + B^2, minimised at B^4 = 6N/rho with total
      2 (6N/rho)^{1/2}: a sustained rho ~ N^delta moves 1/2 to (1-delta)/2
      and a CONSTANT rho moves nothing. Under 772cff's honest
      meet-in-the-middle ledger (s(B) = Theta(B)) the total 6N/(rho B) + B^2
      is minimised at B^3 = 3N/rho with total 3 (3N/rho)^{2/3}, so rho ~
      N^delta moves 2/3 to (2/3)(1-delta). The predictor's own cost enters
      as (t_gen + c_f)/sigma per accepted target with rho <= 1/sigma, so the
      most any perfect constant-cost filter could do under the s = Theta(B)
      ledger is sigma ~ B^{-1/2}, relation term Theta(N/B^{3/2}), optimum
      B = N^{2/7}, total Theta(N^{4/7}), still above Pollard rho's N^{1/2}
      (in-record arithmetic, unreviewed). THE PREDICTED OUTCOME IS delta = 0
      with rho - 1 decaying like N^{-1/2}.
    memory_exponent: >-
      For the measurement: O(N) counters per arm (8 MB at 2^20) plus the
      relation graph (about 1.07e6 relation nodes and 4.3e6 edges at 2^20,
      a few GB in a sparse tensor library) plus model parameters (under
      10^6). For the hypothetical filter: O(1) beyond the model, no table;
      the meet-in-the-middle lookup it would gate needs Theta(B^2) memory,
      which the filter does not remove.
    best_known: >-
      Pollard rho at 0.886 sqrt(N) group operations and O(1) memory is the
      prime-field ECDLP frontier and nothing here approaches it. Within index
      calculus the corpus's own measured position is EV-R6-001's m = 3
      chained-Semaev solve at 2.0e4 to 1.5e5 times rho (second-hand via
      c5c614). On the measured quantity, the lift of a LEARNED
      representation-decidable filter with controls, there is no prior
      measurement anywhere in this repository; c5c614 is the prior on the
      frozen-grammar slice and is still proposed, not run.
    hidden_overhead: >-
      Three disclosures. FIRST, t_solve = Theta(1) or Theta(B) in the ledger
      is where the method dies at real parameters; delta > 0 would be
      necessary and nowhere near sufficient. SECOND, rho <= 1/sigma exactly,
      so a sustained N^delta lift requires sigma to shrink with N and the
      affordability assumption H3 to survive that shrinkage, which it does
      not cover; and c_f must be O(N^{1/3 - 2 delta}) under the s = Theta(B)
      ledger. THIRD, the trained predictor is ADVICE about D in the sense of
      IDEA-20260806-94676a; its parameters are a table of size S and any
      lift it produces on the random arms is exactly what a table of that
      size buys, which is why the Z/N-random subtraction is mandatory.
    tradeoff_note: >-
      The filter is a time-time trade with O(1) memory beyond the model, is
      embarrassingly parallel over targets, and composes with van
      Oorschot-Wiener parallelisation without interaction; that is its one
      structural attraction and why a predicted null is still worth
      measuring once, with the controls that make the null mean something.
      The graph model's TRAINING cost is amortised over all targets and is
      charged as preprocessing.

  dominated_by: >-
    CHECKED ROW BY ROW. AS AN ATTACK: dominated on every axis by every row,
    since none is mounted; Pollard rho (0.886 sqrt(N), O(1) memory), BSGS,
    van Oorschot-Wiener parallel rho, and the corpus's own m = 3
    chained-Semaev index calculus all dominate it on time, memory and data.
    AS A YIELD OR COVERAGE STATEMENT: strictly dominated by KN-FIND-007 and
    the 1.582 envelope of IDEA-20260830-772cff, neither contested. AS A
    LEARNED-MODEL COST STATEMENT: dominated by IDEA-20260806-94676a's
    preprocessing-bound framing, which this record adopts rather than
    contests. AS A MEASUREMENT OF THE RESTRICTED-TARGET CHANNEL: c5c614
    proposes the frozen-grammar measurement and is unrun; RT-4 measured one
    log-space window at one (N, B); no row measures a learned class with the
    four-arm panel, a permutation null and a growth arm, so nothing
    dominates it on that axis and it displaces nothing. Not null on any axis.
  sota_delta: >-
    Zero on every ECDLP cost axis: no attack, no algorithm, no exponent moved.
    QUANTIFIED DELIVERABLE: (i) a measured decay exponent, with interval, for
    the lift of the best predictor in a trained class that CONTAINS c5c614's
    ten-member grammar, over five arms and five rungs, against a 1000-draw
    selection null, an analytic null with a stated variance, a permutation
    null and a canary; (ii) the first measurement in this program of whether
    message passing over certified decompositions adds anything to per-target
    features (predicted 0); (iii) the measured predictor cost c_f against the
    Theta(B) lookup and the Groebner solve, and the exact condition c_f <=
    s N^{-2 delta} under which a predictor could be exponent-relevant; (iv)
    the analytic null E[rho] = 1, Cov = -M/N^2 for random bases (in-record,
    unreviewed) returned to c5c614; (v) in the positive branch, a typed table
    for symbolic regression and a proof obligation against INV-4c; in the
    negative branch, a bounded obstruction with a number and the forward
    guidance that a larger class, a different feature regime or the m = 4
    arity is the next thing to try. Prior state on this axis: zero measured
    values.

  estimated_cost:
    implementation: medium
    compute: medium
    basis: >-
      Exhaustive labels are the sibling battery's O(B^3/6 + N) per cell and
      the 2^24 rung is a Theta(B) lookup per sampled target (about 3e7 hash
      probes). Training is the dominant term: 5 arms x 5 rungs x 3 curves x
      3 base seeds x 3 training seeds x 2 regimes x 2 classes, plus a
      permutation retrain per cell, at minutes to an hour per model at 2^20
      on CPU, giving tens to a few hundred core-hours. Compute is not a stop
      (docs/research-budget-policy.md); memory per job is declared and
      capped and worker count is bounded as machine protection.
      Implementation is medium: the graph builder, the leak audit, the two
      model classes, the selection and permutation nulls and the reproduction
      fixtures are new code sitting on the existing exact enumerator.
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that the pipeline runs, the positive control is recovered and the
    permutation null is at chance. 0.85 that the E/x-interval excess is
    inside the band at every rung for both classes (the expected null). 0.1
    that a null-separated excess survives at every rung with a slope interval
    excluding -1/2. 0.05 that the GNN-minus-trees difference is positive,
    replicated and non-shrinking. 0.9 that c_f is below the Theta(B) lookup
    by the predicted factor at toy scale. Most likely headline: 'a trained
    class containing the frozen grammar finds no representation-visible
    structure in the m = 3 count vector of x-interval bases beyond the
    exchangeable null at 2^14 to 2^24; the lift decays with a fitted exponent
    consistent with -1/2; message passing over certified decompositions adds
    nothing to per-target features; the instrument saw the Z/N-interval
    structure at the ceiling.'

  inference:
    requested_policy: research-deep
    requested_reasoning_effort: high
    resolved_model_id: claude-fable-5-1 (as reported by the runtime to this session; not probe-verified)
    model_verified: false
    fallback_used: false
    degraded_requirements: []
    bedrock_used: false

