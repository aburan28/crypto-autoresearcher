      110-line read of IDEA-20260806-94676a; and by the orchestrator seed
      brief. No web search was run this session. External literature below
      is recalled from memory and marked so.
    results: >-
      Corpus hits. KN-LIT-1632 (Eidolon, a GNN attacker against a
      k-colourability signature scheme, read status 'read' in SOURCES.md;
      not opened here) and KN-LIT-7653 (WPNet, a GNN for the word problem in
      BS(1,2), 'does not bear on the ECDLP', read in full) are the only GNN
      records and neither touches point decomposition. 'symbolic regression'
      appears in IDEA-20260806-071255 (which recorded ZERO hits for it on
      2026-08-06 and proposes typed invariant discovery), IDEA-20260830-772cff
      (a symbolic-regression FIXTURE for the cost-ledger optima), and the
      question record itself. 'gradient-boosted' appears in
      IDEA-20260821-167fd9 and H-SSIQ-055a36 as a supervised baseline in the
      isogeny lane, with a held-out split and AUC, which is the same
      methodological pattern as here on a different object. IDEA-20260806-
      94676a is the nearest methodological ancestor: it states that every
      learned model is ADVICE under the Corrigan-Gibbs-Kogan preprocessing
      bound and must be reported against a table, and it introduces the
      scrambled-group control (same cyclic group, random relabelling); this
      record's Z/N arms are that control specialised to the decomposition
      question, and its cost accounting against the Theta(B) lookup is that
      record's 'must beat a table' obligation made concrete. No record in the
      corpus trains any model on the point-relation incidence graph, and no
      record scores a learned predicate by rho and lambda against the
      selection null with a growth arm.
    verdict: >-
      UNVERIFIED. The instrument (inductive GNN plus tree baseline, four-arm
      panel, label-permutation null, growth arm) is an ADAPTATION of standard
      supervised-learning controls to c5c614's frozen protocol if the recalled
      literature is as remembered, and the ML-instrument-to-symbolic-formula
      pipeline is, as far as memory goes, the pattern of Cranmer et al. 2020
      and Davies et al. 2021 (recalled, below) applied to a new object.
      Neither can be asserted from memory; a reviewer with retrieval should
      check the two recalled pipeline papers and whether any published
      index-calculus analysis trains a target-selection model.

