    method: >-
      The crypto-kb index is EMPTY this session (:memory:; search_knowledge
      errors out), so no kb query was possible. Screening was by direct
      reads and ripgrep over ledger/ and knowledge/ for 'graph neural',
      'GNN', 'message passing', 'gradient boost', 'symbolic regression',
      'learned predictor', 'learned model', 'machine learning', 'neural';
