idea:
  id: IDEA-20260901-054dd4
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-09-01'
  proposed_by: idea-generator
  status: proposed
  class: control

  title: >-
    THE CELL IS THE UNIT OF MEASUREMENT AND THIS LANE HAS BEEN REPORTING SINGLE CELLS.
    Special j is structurally n = 1 per prime - at most one D_0 = -3 class exists at each
    p, and H-JINV-5a0b9e's own |Aut| arm derives a resolution ceiling of 1/37 = 0.027
    BEFORE execution - so the lane's flagship contrast cannot reach significance from
    within one cell however it is analysed. Make the matched pair the observation, declare
    the COMPLETE cell enumeration and its operative definition before measuring, cross in
    the transversal-versus-group-uniform sampling axis as a FACTOR rather than omitting it,
    and report the cell-residual distribution against a re-pairing null. This is the exact
    pair of defects DEC-20260831-7b44fe found in EXP-MONO-64aaa4, generalised to this RQ
    before the lane repeats them.

  object: >-
    TRACKED OBJECT - THE CELL RESIDUAL. A CELL c is a matched pair of isogeny classes at
    identical group order N (or, where that is unavailable, identical p and matched #E bit
    length), one member carrying the special property under test - j = 0, j = 1728, or
    |D_0| below a declared bound - and the other a generic-D_0 class, together with a
    declared sampling mode m in {transversal, group_uniform} and a declared factor-base
    density row d. The tracked quantity is the single signed standardised difference
        Z(c, m, d) = ( stat(special) - stat(generic) ) / se(c, m, d),
    with se computed from the cell's own within-class variance, not pooled. Both curves,
    both classes, every point, every j-invariant and every coordinate are discarded; ONE
    REAL NUMBER per (cell, mode, density) is retained.
    ESTABLISHED FAMILIES DECLARED OFF-LIMITS AS THE PRIMARY LENS, per
    docs/inventor-protocol.md section 1: the automorphism-order function and the
    sqrt(|Aut|) discount (KN-TECH-018, H-JINV-db2776); Semaev support and degeneration
    screens (H-JINV-0e8819); the Cl(O)-orbit crater cardinality (IDEA-20260826-d61c49);
    genus-theoretic ambiguous classes (IDEA-20260828-f3c50e); the |D_0| regression itself
    (H-JINV-5a0b9e); and volcano DEPTH (RQ-VOLC-f6253b, worked concurrently). This record
    is deliberately ORTHOGONAL to all of them: it proposes no new functional and takes
    whichever functional the lane is already measuring as an input.
    CANDIDATES ENUMERATED AND SCORED on (genuinely new here / one-step propagation
    definable and measurable / survival depth):
    (a) the per-curve statistic - the lane's current unit; not lossy enough, since it
        carries the curve with it, and it is confounded with p, #E and r-composition;
    (b) the per-class mean - H-JINV-5a0b9e's unit; better, but a single special-j class
        per prime is still n = 1 and the design cannot escape it;
    (c) the CELL RESIDUAL - new in this corpus as a declared unit as far as this session
        could check; its one-step propagation is a permutation law rather than an
        algebraic one, since under the null the residuals are EXCHANGEABLE across cells,
        so re-pairing generates the null distribution exactly and deterministically;
        it survives as long as the cells are genuinely matched and dissolves the moment a
        covariate is unbalanced across them, which is the boundary the record states and
        the design tests;
    (d) the p-value itself - not an object at all, it is a summary of one cell and it is
        precisely what EXP-MONO-64aaa4 was forced to report and could not interpret.
    (c) is adopted. KN-OPEN-019 applies: this is a sketch, not a taxonomy.

  lossy_projection_test: >-
    Z(c, m, d) discards both classes entirely and keeps one real number, so the fibre over
    each value is enormous and nothing about either curve is recoverable. It is not a
    change of coordinates.
    COMPATIBILITY WITH THE OPERATION THE RECORD USES IT UNDER - and here the operation is
    statistical rather than algebraic, which is unusual for this lane and is stated
    explicitly. The operation is RE-PAIRING: exchanging which member of a cell is labelled
    special. Under the null hypothesis of no special-j effect, the two members are
    exchangeable, so Z propagates deterministically under re-pairing by a sign flip, and
    the joint law of the residual vector is invariant under the group of independent sign
    flips. THAT INVARIANCE IS THE NULL DISTRIBUTION, computed exactly rather than assumed
    normal - which is the whole reason the projection is worth making.
    IT IS NOT COMPATIBLE with pooling across density rows or across sampling modes, since
    those change se(c, m, d) and the exchangeability argument is per (mode, density). The
    design therefore never pools them, and that prohibition is a consequence of the
    projection test rather than a stylistic preference.

  claim: >-
    Four statements. D1 is the structural fact that makes the lane's current design
    unable to answer its own question, D2 is the design, D3 is the three-way
    discrimination the crossed factor buys, and D4 is the disclosure discipline that
    prevents the two defects DEC-20260831-7b44fe recorded.

    (D1) THE SPECIAL-j ARM IS STRUCTURALLY n = 1 AND THIS IS DERIVABLE BEFORE ANY DATA.
    j = 0 requires D_0 = -3 and j = 1728 requires D_0 = -4, so at any fixed p there is AT
    MOST ONE isogeny class of each kind. H-JINV-5a0b9e's own STEP 4 computes the
    consequence for its |Aut| arm - a single crater vertex among 37 class members, so the
    smallest attainable one-sided permutation p-value is 1/37 = 0.027027, described there
    as "A DERIVED CEILING ON THE ARM'S RESOLVING POWER, computed here before execution". A
    design whose best possible p-value is 0.027 cannot distinguish a large effect from a
    moderate one and cannot survive any multiplicity correction at all. The lane's
    remaining power therefore lives ENTIRELY in the number of cells, and no amount of
    within-cell analysis recovers it.

    (D2) THE DESIGN. Fix a functional from the lane's existing battery. Declare, BEFORE
    measuring, (i) the operative definition of a cell, (ii) the complete enumeration of
    cells in a declared parameter range, with its COUNT, and (iii) the reason for any
    exclusion. Measure Z(c, m, d) on every cell, at both sampling modes and at every
    density row of the frozen grid. Report the empirical distribution of Z over cells
    against the exact re-pairing null, at each (m, d). The headline statistic is the
    CENTRE AND SPREAD OF THAT DISTRIBUTION, never a single cell's p-value.

    (D3) THE CROSSED SAMPLING FACTOR AND THE THREE-WAY DISCRIMINATION. The mode axis
    m in {transversal, group_uniform} is crossed into the design as a FACTOR, not appended
    as a control, because the quantity that discriminates is the INTERACTION.
      (H-artifact) The Z distribution is centred at 0 with unit spread at both modes, and
      the rate at which single cells land near conventional significance matches the null
      rate. Then any borderline single-cell result the lane has produced or will produce is
      a fluctuation, and the special-j effect on this functional is bounded by the
      measured confidence interval - the archivable expected deliverable.
      (H-cm) The Z distribution is shifted by delta at BOTH modes with no interaction.
      Then the effect is a property of the curves and survives the sampling choice, which
      is the only reading under which it is about CM at all.
      (H-sampling) The shift appears at ONE mode only, i.e. there is a mode-by-arm
      interaction. Then what is being measured is the already-known transversal-sampling
      artifact - recorded in this program as EXP-MONO-12ce1c's own Red Team OBJ-6, whose
      magnitude DEC-20260831-7b44fe describes as "a real about 2x effect" - differing in
      magnitude between the arms, and the result is about the sampler, not about the
      j-invariant. NO SINGLE-MODE DESIGN CAN SEPARATE H-cm FROM H-sampling, which is
      exactly why EXP-MONO-64aaa4's disposition was inconclusive on this axis.

    (D4) THE DISCLOSURE DISCIPLINE, WRITTEN AS DESIGN CONSTRAINTS RATHER THAN AS ADVICE.
      (a) SEARCH SCOPE IS A REPORTED NUMBER. The contract records how many cells the
      operative definition admits in the declared range, how many were measured, and why
      the difference. DEC-20260831-7b44fe adopted as materially incomplete an "exhaustive
      search" headline whose Stage 0 "covered only same-prime coincidences, leaving >=100
      already-constructed cross-prime matched-(N,tau) cells ... unexamined and undisclosed
      as a scoping choice". Reporting the count makes that failure impossible rather than
      unlikely.
      (b) POWER IS COMPUTED FOR THE CELLS ACTUALLY FOUND, not generically. The same
      decision records that a generic pre-registration - "powered to detect about 2x or
      more" - "was never revisited against the specific (N,tau) cell Stage 0 found, where
      actual power is about 92-95 percent at 20 percent and about 42-47 percent at the
      observed about 11 percent difference". The design requires a per-cell power table
      recomputed after enumeration and before measurement.
      (c) THE TEST FRAMING IS PRE-REGISTERED AND A SENSITIVITY PANEL IS MANDATORY. The
      primary test is declared in advance and is not overridden afterwards; alongside it
      the record must report every standard alternative framing of the identical data. In
      EXP-MONO-64aaa4 the pre-registered two-sided Fisher exact gave 0.066 while "every
      standard alternative framing of the identical data ... lands just inside the
      conventional 0.05 threshold (p in [0.029,0.033])" - information the headline did not
      convey. A declared panel discloses that by construction.
      (d) DOUBLE COUNTING IS FORBIDDEN BY CONSTRUCTION. Per-curve deviations and the
      between-arm comparison derive from the same raw counts and are not independent lines
      of evidence; the between-arm comparison is designated primary and the per-curve
      figures are diagnostic context only, exactly as that decision ruled.
      (e) THE INSTRUMENT GATE IS INHERITED, NOT RE-ARGUED. No functional may be used whose
      two-directional detection control has not passed on THIS design, per GOAL-ENDO-001
      criterion C4 as quoted in H-JINV-5a0b9e.

    (WHAT IS NOT CLAIMED) No exponent, no constant, no attack, no mechanism. This record
    proposes an instrument and nothing else. Its honest sota_delta is zero on every cost
    axis and it does not itself produce evidence about j-invariants.

  mechanism: >-
    A matched pair is a single observation. Its within-pair variability is the only noise
    the pair can see, and its analysis therefore estimates a difference with one degree of
    freedom no matter how many curves sit inside each class - which is why class-level
    replication does not help and why the lane's largest arm, 51 conductor-1 classes at
    one N, has power for the |D_0| trend and none at all for the |Aut| contrast. The fix
    is not a better statistic but a different unit: measure many pairs and treat the
    per-pair standardised difference as the datum. Because the two members of a pair are
    exchangeable under the null, the null distribution of that datum is generated by
    re-pairing rather than assumed, and the whole analysis becomes exact and
    assumption-free at the price of needing many cells. Special j supplies at most one
    class per prime, so the cells must come from sweeping p, which is cheap because no new
    curve construction is required once a class census exists. The crossed sampling factor
    is included for a separate reason: this program already knows one alternative
    explanation of any measured difference - a sampler artifact of about twofold - and an
    explanation that is known in advance and left unmeasured converts a null into an
    ambiguity, which is precisely the disposition EXP-MONO-64aaa4 received.

