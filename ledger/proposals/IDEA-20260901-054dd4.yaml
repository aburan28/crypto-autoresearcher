  nearest_existing_record: H-JINV-5a0b9e
  delta_from_nearest: >-
    UNIT - 5a0b9e's unit is the CLASS and it derives, correctly and in advance, that its
    |Aut| arm has a 1/37 ceiling; this record changes the unit to the CELL so that power
    comes from the number of matched pairs rather than from within-class replication.
    SUCCESSOR NAMED - 5a0b9e's own F7 names the successor as "a matched-order family at a
    second N whose D_0 = -3 class has a larger crater", i.e. it proposes to enlarge the
    cell. This record proposes to MULTIPLY cells instead. The two fixes are compatible and
    neither implies the other, but only the second scales, because crater size is bounded
    by h(D_0) which is 1 at D_0 = -3 by the Dirichlet class number formula
    (IDEA-20260826-d61c49) - so the enlarge-the-crater route is structurally capped and
    the multiply-the-cells route is not. THAT ARGUMENT IS THIS RECORD'S SHARPEST CONTENT
    AND IT COSTS NO COMPUTE.
    FACTOR STRUCTURE - 5a0b9e treats the sampler as a fixed choice (targets_B required,
    targets_uniform prohibited) in order to stay independent of a disputed adjudication;
    this record crosses the sampling mode as a FACTOR, which is the only way H-cm and
    H-sampling separate. Both positions are defensible and they answer different
    questions; the difference is declared rather than papered over.
    SECOND NEAREST, DEC-20260831-7b44fe's next_action - names the same two moves but
    scoped to RQ-MONO-001's collision-rate closed form and as two separate items. This
    record transfers them to RQ-JINV-8fc13a and combines them into one crossed design.
    THIRD NEAREST, IDEA-20260828-b39886 - audits a representative-selection height
    confound in the same family. A different defect on the same instrument; complementary.

  assumptions:
    - >-
      [design] A cell's two members are exchangeable under the null. This is an assumption
      about the MATCHING, not about the curves, and it is the one that can fail: if any
      covariate (p, #E bit length, r-composition, factor-base density, representative
      height) is systematically unbalanced across cells, exchangeability fails and the
      re-pairing null is wrong. The design tests it directly with a covariate-balance
      table before any Z is interpreted.
    - >-
      [fact] j = 0 requires D_0 = -3 and j = 1728 requires D_0 = -4, so at most one class
      of each kind exists per p. This is why the special-j arm is structurally n = 1 and it
      is not a property of any particular design.
    - >-
      [inherited, blocking] Every functional used must have passed both directions of its
      detection control on this design, per GOAL-ENDO-001 criterion C4 as quoted in
      H-JINV-5a0b9e. This record does not relax that gate and does not re-argue it.
    - >-
      [scope] Toy scale. claim_tier toy per RQ-JINV-8fc13a's constraints. Lawful defensive
      cryptanalysis on public constructions and toy benchmarks only.
    - >-
      [provenance] Every statement in this record about EXP-MONO-64aaa4 and EXP-MONO-12ce1c
      is taken from DEC-20260831-7b44fe's committed text. Those experiments' own records
      were NOT opened this session.

  proof_search_map:
    bottleneck: >-
      The number of independent observations available to the lane's special-j contrast.
      It is the only quantity that decides whether any special-j functional can be
      distinguished from its null at all, and every argument about which statistic to use
      is downstream of it.
    baseline_embedding:
      parameter_slice: >-
        One cell. The design must reduce, at cell count 1, to exactly the analysis
        EXP-MONO-64aaa4 performed - a single matched pair with a two-sided exact test -
        and must reproduce its reported figures on its archived counts. If it does not,
        the multi-cell machinery is not a generalisation of the single-cell analysis and
        the comparison between them is meaningless.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE, BLOCKING. Given the four raw counts archived by
        EXP-MONO-64aaa4, the implementation must reproduce the pre-registered two-sided
        Fisher exact p = 0.066 and the sensitivity panel values in [0.029, 0.033], and the
        independently corrected 2.427 SE figure, to the precision those records state.
        Failure halts the line before any new cell is measured. NOTE: this fixture requires
        opening EXP-MONO-64aaa4's archived stage transcripts, which this session did not
        do; the figures above are quoted from DEC-20260831-7b44fe.
    observation_collision:
      observable: >-
        The cell-residual distribution over cells at a given (mode, density).
      distinct_preimage_search: >-
        REQUIRED, AND THE COLLISION IS THE RECORD'S WHOLE POINT. A genuine CM effect of
        size delta and a sampler artifact of size delta produce the SAME residual
        distribution at a single sampling mode - two distinct ground-truth objects, one on
        each side of the conclusion, with the same observable. That collision is a direct
        falsifier of identifiability for any single-mode design, and the additional
        condition that separates them is the MODE-BY-ARM INTERACTION, which is why the
        mode is crossed rather than fixed. A SECOND collision to hunt: a covariate
        imbalance across cells and a real effect also produce the same residual shift; the
        separating datum is the covariate-balance table plus a placebo arm in which the
        special label is assigned to a covariate-matched but arithmetically ordinary class.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The complete cell enumeration in a declared prime range, with its count, rather
          than the cells that happened to be convenient. The pack is the set of all
          matched pairs the operative definition admits; its completeness is a reported
          number and its exclusions are itemised.
        predicted_gain: >-
          Encoding is exact, since cells are enumerated and not sampled. Completeness is
          reported as a count rather than asserted as "exhaustive". Soundness comes from
          the covariate-balance table. Transfer is DECLARED UNMET beyond the tested prime
          range. Cost is dominated by re-running an existing functional on already-built
          classes, which the cited decision estimates at seconds per cell for a comparable
          measurement.
      - transform: stronger_invariant
        proposed_object: >-
          Preserve the SIGN and the SCALE of each cell's difference rather than only
          whether it crossed a threshold. The extra state is what survives aggregation:
          a vector of signed residuals has an exact sign-flip null, whereas a vector of
          p-values does not aggregate without further assumptions.
        predicted_gain: >-
          Converts a sequence of borderline single-cell verdicts into one distributional
          statement with an exact null, and makes the "how often does a cell land this
          close to significance by chance" question - which DEC-20260831-7b44fe names as
          the missing baseline - answerable by construction.
    quantifier_order: >-
      CLAIMED IN THIS ORDER. FOR ALL sampling modes m in the declared set, FOR ALL density
      rows d in the frozen grid, the distribution of Z(., m, d) over the COMPLETE
      enumerated cell set either does or does not differ from its exact re-pairing null.
      THE WEAKER READING EXPLICITLY NOT CLAIMED - "there EXISTS a mode and a density at
      which the distribution differs", which is what a search over cells and rows would
      produce and which the multiplicity correction must therefore cover; any such finding
      is reported as an instrument observation and never as the headline.
      THE STRONGER READING EXPLICITLY NOT CLAIMED - anything about a cell not in the
      declared range.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Over the complete set of C matched cells in the declared range, at both sampling
        modes and every density row, the special-j arm's standardised difference on
        functional F has centre z with exact re-pairing confidence interval I, and the
        mode-by-arm interaction is or is not present." IT CAN NEVER CERTIFY - anything
        about a functional it did not measure, anything about cryptographic scale, any
        mechanism whatever, and nothing about the ECDLP. It is an instrument and its
        output is a confidence interval, not an explanation.
      nearby_object_control: >-
        THE PLACEBO ARM, which is the nearby object on which the hoped-for conclusion must
        FAIL: cells in which the "special" label is assigned to a class that is
        covariate-matched but arithmetically ordinary - same p, same #E bit length, same
        r-composition, same representative-height profile, generic D_0, |Aut| = 2. The
        design must report a centred residual distribution there. A design that finds a
        shift on the placebo arm is measuring the matching procedure, not the curves, and
        every number it produced is void in both directions. This control also catches the
        representative-selection confound IDEA-20260828-b39886 identifies.
    proof_obligations:
      - claim: 'At most one D_0 = -3 class exists per p, so the special-j arm is n = 1 per prime.'
        responsibility: baseline
      - claim: 'Under the null the two cell members are exchangeable, so the sign-flip law is exact.'
        responsibility: correctness
      - claim: 'The single-cell slice reproduces the archived EXP-MONO-64aaa4 figures.'
        responsibility: baseline
      - claim: 'The cell enumeration is complete in the declared range and its count is reported.'
        responsibility: scope
      - claim: 'Per-cell power is recomputed on the cells actually enumerated.'
        responsibility: success_probability
      - claim: >-
          The mode-by-arm interaction is the only statistic that separates H-cm from
          H-sampling.
        responsibility: strictness
      - claim: 'The placebo arm returns a centred residual distribution.'
        responsibility: feasibility
      - claim: 'No mechanism, exponent or attack is claimed.'
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        number of cells admitted by the declared operative definition in the declared
        prime range, reported before measurement
      direction: higher
      minimum_effect: >-
        At least 30 cells for the design to be worth running at all, which is the
        pre-registered go or no-go threshold; below that the record reports the count and
        STOPS rather than measuring, because a 10-cell design merely relocates the n = 1
        problem. Reporting a count below 30 is a legitimate and complete outcome.
    - metric: >-
        centre of the Z distribution over cells at each (mode, density), with its exact
        sign-flip confidence interval
      direction: different
      minimum_effect: >-
        The PRE-REGISTERED EXPECTATION IS ZERO within the interval, i.e. H-artifact. The
        design's value is the width of the interval, which converts "no significant
        difference in one cell" into "the special-j effect on this functional is at most
        this large", a statement the lane cannot currently make at all.
    - metric: >-
        mode-by-arm interaction, i.e. the difference between the Z centres at the two
        sampling modes
      direction: different
      minimum_effect: >-
        Zero within the interval under H-cm; nonzero and of the order of the known
        roughly twofold transversal effect under H-sampling. THIS IS THE STATISTIC THAT
        SEPARATES THE TWO EXPLANATIONS AND IT IS THE REASON THE MODE IS CROSSED.
    - metric: >-
        placebo-arm Z centre
      direction: different
      minimum_effect: >-
        Zero within the interval. A nonzero placebo centre voids the entire design and is
        reported as an instrument defect, never as a null result about j-invariants.
    - metric: >-
        rate at which individual cells produce a primary p-value below 0.05, against the
        nominal rate
      direction: different
      minimum_effect: >-
        Equal to the nominal rate within the binomial interval under H-artifact. This is
        the missing null baseline DEC-20260831-7b44fe names - how often a single cell
        lands this close to significance by chance - and supplying it is one of the two
        defects this design exists to fix.
    - metric: >-
        covariate-balance table, standardised difference of p, #E bit length,
        r-composition, factor-base density and representative height across cell members
      direction: lower
      minimum_effect: >-
        Every standardised covariate difference below 0.1 in absolute value. Any covariate
        above that threshold means the matching failed, the exchangeability assumption is
        void, and the affected cells are reported and excluded with their count BEFORE the
        primary analysis, never after seeing Z.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, and it is a genuine deliverable on its own): declare the
      operative cell definition; enumerate the complete cell set in the declared prime
      range and REPORT ITS COUNT; compute per-cell power on the cells actually found;
      declare the primary test and the sensitivity panel; declare the multiplicity
      correction. If the count is below the go threshold, report it and stop - that is a
      complete outcome and it costs nothing.
      STAGE 1 (baseline reproduction, BLOCKING): reproduce the archived single-cell
      figures through the multi-cell code path at cell count 1.
      STAGE 2 (measurement): compute Z(c, m, d) on every cell at both sampling modes and
      every density row; build the exact sign-flip null; report centre, interval and the
      mode-by-arm interaction per density row.
      STAGE 3 (controls): the placebo arm and the covariate-balance table, both reported
      before the primary analysis is read.
      NOTHING IN STAGES 2 AND 3 REQUIRES NEW CURVE CONSTRUCTION where a class census
      already exists, which is what makes the design cheap.
    controls:
      - >-
        PLACEBO ARM, BLOCKING - covariate-matched but arithmetically ordinary "special"
        labels. Must return a centred residual distribution. This is the null object of the
        same shape that RQ-JINV-8fc13a's constraints require.
      - >-
        SQRT(|Aut|) BASELINE AS THE NULL HYPOTHESIS - every reported effect on a
        cost-like functional is expressed against the automorphism-discounted rho baseline
        (KN-TECH-018), and a factor at or below sqrt(6) is baseline calibration recorded as
        such, never as an attack, per RQ-JINV-8fc13a's decision_target.
      - >-
        SINGLE-CELL SLICE - the multi-cell analysis restricted to one cell must reproduce
        the single-cell analysis exactly, so that the comparison between the two is a
        comparison and not an apples-to-oranges substitution.
      - >-
        DECAY PARAMETER - the cell count itself, swept upward. The pre-registered shape is
        that the confidence interval narrows like one over the square root of the cell
        count while its CENTRE stays put. A centre that MOVES systematically as cells are
        added is the canonical artifact tell (docs/inventor-protocol.md section 3) and
        indicates that later cells differ from earlier ones in some covariate.
      - >-
        SECOND DECAY PARAMETER - the factor-base density row, since the campaign's own
        red-team measurement records over-dispersion decaying from 2.037 at density 0.531
        to 0.930 at density 0.023 (quoted in H-JINV-5a0b9e STEP 3c). A conclusion drawn
        from one density row is not a conclusion about the curves, and the saturated row is
        never run alone.
      - >-
        CERTIFICATE CONTROL - inherited unchanged from RQ-JINV-8fc13a's constraints; every
        claimed solve or relation carries a certificate re-verified independently of the
        solver.
    required_metrics:
      - the declared operative cell definition, verbatim, recorded before measurement
      - the cell count admitted, the cell count measured, and every exclusion with a reason
      - per-cell power at the observed and at a declared reference effect size
      - Z(c, m, d) per cell, mode and density row
      - the exact sign-flip null distribution, its centre and its confidence interval
      - the mode-by-arm interaction with its interval, per density row
      - the placebo-arm distribution and the covariate-balance table
      - the sensitivity panel of alternative test framings, reported alongside the primary
      - the single-cell reproduction fixture result

  falsification_conditions:
    - >-
      F1 (ZERO COMPUTE). The declared operative definition admits fewer cells than the go
      threshold in the declared range. The design is not runnable as specified; the count
      is reported and the record proposes a wider range or a relaxed matching criterion
      with its cost. This is a complete outcome, not a failure.
    - >-
      F2. The single-cell slice does not reproduce the archived figures. The
      implementation is not a generalisation of the existing analysis and the line halts.
    - >-
      F3. The placebo arm shows a shifted residual distribution. The matching procedure is
      producing the signal; every number is void in both directions and the run returns to
      the executor as a defect, never as a null about j-invariants.
    - >-
      F4 (THE INTERESTING OUTCOME). A nonzero Z centre at BOTH sampling modes with no
      interaction, surviving the placebo arm, the covariate-balance table and the
      multiplicity correction. That is a special-j effect on the measured functional that
      is not the sampler and not the matching. If the functional is cost-like and the
      implied factor exceeds sqrt(6), GOAL-ENDO-001 pause condition P3 fires and work stops
      for independent review before any record states it.
    - >-
      F5 (THE OTHER INFORMATIVE OUTCOME). A nonzero Z centre at ONE mode only. The
      already-known transversal-sampling artifact differs in magnitude between the arms;
      the finding is about the sampler and must be reported in those words, and every prior
      single-mode result in this lane inherits the ambiguity.
    - >-
      F6 (THE MAIN NEGATIVE AND THE INTENDED DELIVERABLE). A centred Z distribution at
      both modes with a narrow interval. The special-j effect on this functional is bounded
      above by the interval, which is the first such bound the lane would have, and the
      record must name its successor - the next functional, or the next parameter range -
      or it has not finished (docs/inventor-protocol.md section 4).
    - >-
      NOT A FALSIFICATION - budget exhaustion before the full cell set is measured. That
      is a budget event under AGENTS.md rule 5, reported with the number of cells actually
      measured against the number enumerated, which is exactly the disclosure this design
      exists to enforce.

  confounders:
    - >-
      MULTIPLICITY ACROSS DENSITY ROWS AND MODES is introduced by the very crossing that
      buys the discrimination. The correction is declared in Stage 0 and the primary
      statistic is the pooled-over-nothing centre at each cell, never the minimum over
      rows.
    - >-
      CELLS ARE NOT FULLY INDEPENDENT if two cells share a class, which cross-prime
      matching can cause. The design forbids reusing a class across cells, reports how many
      candidate cells that prohibition removes, and treats the prohibition as part of the
      operative definition rather than as a post-hoc filter.
    - >-
      THE REPRESENTATIVE-SELECTION HEIGHT CONFOUND identified by IDEA-20260828-b39886 -
      that the harness's curve-construction step may produce systematically smaller-height
      (a,b) for smaller |D_0| - would bias every cell in the same direction and would NOT
      be caught by the re-pairing null, which is a within-cell device. It is caught only by
      the covariate-balance table, which is why representative height is a required
      covariate in that table.
    - >-
      D_0 = -3 AND |Aut| = 6 ARE PERFECTLY CONFOUNDED ACROSS CLASSES (H-JINV-5a0b9e T4), so
      a special-j cell can never separate the two. The design does not attempt to; it
      reports the joint effect and names the within-class contrast, which belongs to
      another contract, as the only separation available.
    - >-
      QUOTED FIGURES ARE SECOND-HAND. Every number this record quotes about EXP-MONO-64aaa4
      comes from DEC-20260831-7b44fe, not from the run records, which this session did not
      open. The Stage 1 fixture requires opening them and a discrepancy there is a finding
      about this record, reported as such.

  interpretation_limits:
    - >-
      claim_tier toy, per RQ-JINV-8fc13a. Nothing here is a statement about any
      cryptographic parameter.
    - >-
      THIS RECORD PROPOSES AN INSTRUMENT AND CLAIMS NO MECHANISM. Its honest ceiling is
      not even a constant - it is zero on every cost axis, since it computes no attack and
      changes no algorithm. It is nonetheless ranked as it is because every other proposal
      in this lane, including the four other records in this batch, will be scored on an
      instrument whose special-j arm currently has a derived resolution ceiling of 0.027,
      and an instrument that cannot reach significance makes every null it produces
      uninterpretable. Fixing the unit of analysis is a prerequisite, and prerequisites are
      the one class of low-ceiling work the search heuristics explicitly permit when they
      are named as such.
    - >-
      IT DOES NOT ADJUDICATE H-ICINV-6c7920. The sampling mode is crossed as a FACTOR
      precisely so the design takes no position on which sampler is correct; it measures
      whether the arm contrast depends on the choice.
    - >-
      IT DOES NOT REOPEN EXP-MONO-64aaa4 OR ITS DISPOSITION. DEC-20260831-7b44fe stands;
      this record transfers its two findings to a different research question before that
      question repeats them, and cites the decision as precedent, not as a record under
      re-examination.
    - >-
      A NARROW INTERVAL AROUND ZERO IS NOT PROOF OF NO EFFECT. It bounds the effect on ONE
      functional over ONE declared cell set at ONE claim tier, and the bound is stated with
      those scopes attached (AGENTS.md rule 6).
    - >-
      Timeouts, crashes and infrastructure failures are never negative mathematical
      evidence (AGENTS.md rule 5), and budget exhaustion is reported as a cell count, not
      as a result.

  heuristic_assumptions:
    - id: H1
      statement: >-
        CELL EXCHANGEABILITY. Under the null hypothesis that the special property has no
        effect on the functional F, the two members of a matched cell are exchangeable, so
        the vector ( Z(c) : c in the cell set ) has a law invariant under independent sign
        flips, and the exact sign-flip distribution is the correct null.
      rigorous_support: >-
        RIGOROUS PART - exchangeability implies sign-flip invariance of the standardised
        difference exactly, with no distributional assumption at all; this is elementary and
        is the reason the design uses an exact null rather than a normal approximation. What
        is ASSUMED is exchangeability itself, which is a property of the MATCHING procedure
        and not of the mathematics.
        DISTRIBUTION IMITATED - the classical matched-pair permutation test, in the same
        role that a random-model justification plays for an analytic heuristic elsewhere in
        this program.
        WHY IT COULD FAIL, STATED HONESTLY - any covariate systematically unbalanced across
        cells breaks it in the same direction in every cell, which the sign-flip null cannot
        see because it is a within-cell device. IDEA-20260828-b39886's representative-height
        confound is a concrete, already-identified candidate.
      validation_plan: >-
        WHAT TO SAMPLE - every enumerated cell, with the full covariate vector recorded per
        member: p, #E, #E bit length, r-composition, factor-base density, representative
        height max(|a|,|b|), class size, conductor. AT WHAT SCALE - the complete declared
        cell set, plus a placebo cell set of the same size.
        AGAINST WHICH PREDICTED DISTRIBUTION - the placebo arm's Z distribution against the
        exact sign-flip null, which under H1 must agree; and the covariate-balance table
        against a standardised-difference threshold of 0.1.
        TAIL CONSISTENCY CHECKS - the most extreme placebo cell against the null's tail, and
        the count of cells failing covariate balance, reported before the primary analysis.
        TRANSFER ASSUMPTION, DECLARED - exchangeability validated on the placebo arm does
        not transfer to a cell set built by a different matching rule; each operative
        definition needs its own placebo arm.
      falsification_condition: >-
        A placebo-arm Z distribution significantly shifted from the sign-flip null, or any
        covariate with standardised difference above 0.1 across cell members. H1 is refuted
        for that cell set, the primary analysis is not run, and the matching rule is
        redesigned.
    - id: H2
      statement: >-
        POWER ADEQUACY AT THE ENUMERATED CELL COUNT. With C cells, the design detects a
        standardised shift of size delta with power at least 0.8 at the declared level,
        where delta is computed from the per-cell power table on the cells actually
        enumerated rather than from a generic assumption.
      rigorous_support: >-
        RIGOROUS PART - for the sign-flip null the power at a given per-cell effect and
        variance is computable exactly by enumeration or by Monte Carlo to arbitrary
        precision, so this is a computation rather than an assumption; it is recorded as a
        numbered heuristic only because the per-cell variance must be estimated from the
        cells and that estimate can be wrong. DISTRIBUTION IMITATED - none.
        WHY IT MATTERS - DEC-20260831-7b44fe records that exactly this recomputation was
        omitted once already, and that the omission turned an informative borderline result
        into an apparently vacuous one.
      validation_plan: >-
        WHAT TO SAMPLE - per-cell variance estimates from a pilot on a declared subset of
        cells, at both modes and every density row. AGAINST WHICH PREDICTION - the analytic
        power curve, with the achieved power reported at the observed effect size as well as
        at the reference size. TAIL CHECK - the least powerful cell reported by name, and
        the fraction of total power it contributes.
      falsification_condition: >-
        Achieved power below 0.5 at the declared reference effect size on the enumerated
        cell set. The design is under-powered as specified; it reports that number and
        proposes a wider range rather than measuring and calling the result a null.

  target_complexity:
    time_exponent: >-
      NOT APPLICABLE AS AN ALGORITHMIC CLAIM, said plainly. No algorithm is proposed, no
      ECDLP exponent moves, and under docs/target-result-profile.md this record is
      NON-TARGET-CLASS by construction - it is an instrument. The only cost statement is
      its own: the analysis is O(C * M * D) functional evaluations for C cells, M modes and
      D density rows, plus O(R * C) for R sign-flip resamples, all linear.
    memory_exponent: >-
      O(C * M * D) stored residuals, i.e. a table of a few thousand floating point numbers.
      Negligible.
    best_known: >-
      For the ECDLP on these curves the baseline is unchanged and untouched: parallel
      Pollard rho at 0.886*sqrt(N) with O(1) memory, automorphism-discounted at the
      special-j vertex to 1.2533*sqrt(N/|Aut|) (KN-TECH-018). For the INSTRUMENT, the
      best known in this program is H-JINV-5a0b9e's per-class rank with an exact
      permutation probability, whose special-j arm has a derived resolution ceiling of
      1/37 = 0.027; this record's proposal is to replace that ceiling with one that falls
      like the inverse square root of the cell count.
    hidden_overhead: >-
      Disclosed in two places. (a) The cell count is bounded by the number of primes in the
      declared range for which both a special-j class and a matched generic class exist,
      and that count is NOT known before Stage 0 - which is why Stage 0's only output is a
      number and why a count below the go threshold is a legitimate stopping point.
      (b) The multiplicity introduced by crossing modes and density rows is real and is
      corrected for, at the cost of some power; the correction is declared in advance so
      that the cost is paid transparently rather than absorbed.
    tradeoff_note: >-
      The one real tradeoff is EVIDENTIAL rather than computational and is stated as such:
      crossing the sampling mode doubles the measurement cost and introduces multiplicity,
      and it buys the ONLY separation between a CM effect and a sampler artifact. A design
      that fixes the mode is cheaper and cannot answer the question, which is the situation
      the lane is currently in.

  dominated_by: >-
    CHECKED ROW BY ROW. AS AN ATTACK - none is claimed and every frontier row dominates
    trivially: parallel rho at 0.886*sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006);
    automorphism-discounted rho at 1.2533*sqrt(N/|Aut|) (KN-TECH-018); BSGS at
    sqrt(N)/sqrt(N); van Oorschot-Wiener at sqrt(N^3/w); multi-target Kuhn-Struik at
    sqrt(LN); Shoup's Omega(sqrt(N)) lower bound. No time, memory or query axis is
    contested, so `null` is not available and is not written.
    AS AN INSTRUMENT - dominated within this repository by nothing on the special-j arm,
    since the only existing design for that arm derives its own 0.027 ceiling in advance;
    dominated on the |D_0| arm by H-JINV-5a0b9e's 51-class family, which already has more
    cells than this design would add there and which this record does not propose to
    replace. AGAINST THE EXTERNAL LITERATURE - the statistics are textbook and no priority
    is claimed.
  sota_delta:
    time_exponent: '0 (no change)'
    memory_exponent: '0 (no change)'
    data_or_query_exponent: '0 (no queries)'
    note: >-
      ZERO on every cost axis and no attack. The delta is entirely in measurement capacity
      and it is quantifiable: the special-j arm's smallest attainable p-value moves from a
      derived floor of 1/37 = 0.027 at one cell to a floor falling like the inverse of the
      cell count, and the lane gains the ability to state an UPPER BOUND on the special-j
      effect rather than only a failure to reject. Two disclosure defects recorded in
      DEC-20260831-7b44fe - an undisclosed search scope and a missing discriminating
      control - become structurally impossible rather than merely discouraged, because the
      search-scope count is a required metric and the sampling mode is a crossed factor.

  estimated_cost:
    implementation: medium
    compute: low
  compute_budget_note: >-
    Stage 0 is pure enumeration and needs no functional evaluation at all; it produces the
    cell count, which is the go or no-go input. Stages 2 and 3 re-run an existing
    functional on already-constructed classes; the cited decision estimates about 4 seconds
    of comparable measurement per cell, so a 100-cell design at two modes and four density
    rows is on the order of an hour, plus resampling which is arithmetic on stored
    residuals. No new curve construction is required where a class census exists.
  recommended_priority: high

  relation_to_existing_records:
    generalises_a_finding_of: >-
      DEC-20260831-7b44fe, from RQ-MONO-001 to RQ-JINV-8fc13a, before this lane repeats
      the same two defects. Does not reopen that decision.
    changes_the_unit_of: >-
      H-JINV-5a0b9e's |Aut| arm, whose 1/37 ceiling that record derives honestly and in
      advance. It does not touch that record's |D_0| arm, which already has 51 classes.
    complements: >-
      IDEA-20260828-b39886, which audits a representative-selection height confound on the
      same instrument; its covariate is a required column in this design's balance table.
    does_not_touch: >-
      RQ-VOLC-f6253b (worked concurrently), H-STR-002, H-ICINV-6c7920's adjudication, and
      every mechanism proposal in this batch, all of which it would serve as an instrument
      rather than compete with.

  id_allocation_provenance: >-
    Pre-allocated by the orchestrating session as one of five reserved identifiers,
    declared verified-free. Not minted by this agent and not confirmed with
    tools/allocate_id.py --check, which this agent could not run.

  yaml_parse_disclosure: >-
