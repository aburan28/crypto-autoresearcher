idea:
  id: IDEA-20260816-0a8d21
  question_id: RQ-SHATHREE-cd2cb2
  added: '2026-08-16'
  title: 'The symmetry-decay curve depends on the round constants only through RC XOR tau(RC), so
    an entire 2^768 fiber of distinct constant schedules shares one curve exactly: hold the observable
    fixed, vary the forgotten structure, and test directly whether the curve identifies anything a
    search can feel'
  class: control
  claim: '(A) THE FIBER IS EXACTLY CHARACTERISED, NOT SEARCHED FOR. Every decay quantity this bucket
    computes -- injection weight, active-row curve, z-support growth -- depends on the round constants
    only through eps_i = RC_i XOR tau_32 RC_i. The map RC -> eps has kernel exactly the tau_32-symmetric
    vectors in lane (0,0), a space of dimension 32 per round, so 2^(32*24) = 2^768 distinct 24-round
    constant schedules produce BIT-IDENTICAL decay curves. This is not a hoped-for collision to be
    hunted; it is a closed-form description of the entire observation fiber, obtained with no search
    whatsoever. (B) THE AUDIT THIS MAKES POSSIBLE. KN-TECH-080 audit 2 asks for two distinct ground-truth
    objects with the same observable, preferably on opposite sides of the claimed conclusion. Here
    they are free: draw schedules from the fiber, obtain permutations that are genuinely different
    maps, and run the frozen collision harness on each at fixed round count and fixed budget. If reachable
    round count or success probability varies measurably ACROSS the fiber, the decay curve is insufficient
    as a predictor and must be supplemented by a condition that separates fiber members. If it does
    not vary, the curve has survived the sharpest cheap falsifier available to this bucket. (C) A
    SECOND, TIGHTER FIBER. Permuting the ORDER of the 24 round constants leaves the multiset of eps_i
    unchanged but changes the sequence; any decay statistic that is order-insensitive (a total, a
    maximum, a multiset) collides across all 24-factorial orderings, while the round-indexed curve
    does not. Reporting which statistics collide under which fiber is a precise map of what each summary
    can and cannot identify. (D) NOT CLAIMED. It is NOT claimed that a collision in the observable
    implies the decay model is wrong -- only that it is insufficient without an added separating condition,
    which is exactly what audit 2 says. No attack, no complexity, no security consequence, no statement
    about full 24-round SHA-3, and no assertion about whether published work relies on this observable.
    The fiber members are constructed objects, not proposals for alternative standards.'
  mechanism: 'STAGE 1: prove and then verify the kernel characterisation -- that RC and RC XOR s give
    identical eps whenever s is tau_32-symmetric -- by direct computation on 10^5 random (RC, s) pairs,
    and confirm the kernel dimension is exactly 32 per round by rank. STAGE 2: sample 1000 members
    of the fiber around the FIPS schedule and verify that every companion decay statistic is bit-identical
    across all of them; a single difference falsifies the fiber characterisation and is the cheapest
    possible check. STAGE 3: confirm the members are genuinely different permutations by measuring
    the Hamming distance between their outputs on common inputs, which must be near 800 of 1600 bits
    on average -- otherwise the fiber is trivial. STAGE 4: run the frozen collision harness from the
    companion tooling contract at r = 1..4 and a fixed budget on 100 fiber members and on the FIPS
    schedule, 10 seeds each, recording verified certificate counts. STAGE 5: test whether certificate
    counts vary across the fiber beyond seed noise, using the seed-only variance at the FIPS schedule
    as the reference. STAGE 6: repeat for the order-permutation fiber and tabulate which statistics
    collide under which fiber. REFUTATION: the audit is void if stage 2 finds the decay statistics
    are not constant on the fiber, or if stage 3 shows fiber members are nearly identical permutations,
    either of which means the constructed collision is not a real one.'
  novelty_status: unverified
  novelty_screen:
    method: 'Ran `grep -ril "keccak\|sha-3\|sha3" ledger/ knowledge/ experiments/ docs/` from the
      repository root: four proposals (IDEA-20260805-5194f9, IDEA-20260807-c4f1fc, IDEA-20260809-ce875b,
      IDEA-20260809-7f2d9c), one question (RQ-SHATHREE-cd2cb2), GOAL-SHA3-001 and five sibling goals,
      two decisions, and a block of KN-LIT files. Then per-noun counts over ledger/proposals/ and
      ledger/hypotheses/: translation-invariant (4, all ECDLP/AES), symmetry-decay (0), "internal
      differential" (0), sponge (2), "invariant subspace" (2), "chi step" (0), "rate/capacity" (0).
      Read RQ-SHATHREE-cd2cb2 in full, GOAL-SHA3-001, KN-TECH-080 in full, docs/inventor-protocol.md
      sections 1-8, and headers of KN-TECH-066, KN-TECH-073, KN-TECH-074, KN-TECH-056. Additionally
      grepped ledger/proposals and ledger/hypotheses for `observation collision`, `observation-collision`,
      `identifiability` and `fiber`, and read KN-TECH-080 audits 2 and 4 in full.'
    results: observation-collision language appears throughout the methodology corpus (KN-TECH-080,
      docs/inventor-protocol.md section 8, templates/research-records.md proof_search_map) and is
      required of proof-oriented proposals, but no ledger record in the SHA-3 area exists at all,
      so no observation-collision test has ever been run on a permutation observable here. The nearest
      executed instances of this shape in the repository are on the ECDLP side, where the group-law
      rigidity theorem IDEA-20260807-df906f and its four escapes are an established internal result
      specifically about what an observable does and does not identify.
    verdict: 'UNVERIFIED. Nothing asserted about external literature. NEW relative to this repository:
      an observation-collision test with a CLOSED-FORM fiber rather than a searched one, applied to
      a symmetric-primitive observable. ASSEMBLED FROM KNOWN PARTS: the audit is KN-TECH-080 audit
      2 executed as specified; the fiber characterisation is one line of linear algebra from the definition
      of eps; the harness is the companion tooling contract''s, reused unchanged. The contribution
      claimed is that the fiber is exactly describable, which turns a search problem into a sampling
      problem, plus the resulting identifiability map.'
  object_first_candidate:
    tracked_object: 'The fiber of the decay observable: the set of constant schedules mapping to one
      fixed eps sequence, characterised in closed form as a coset of a 768-dimensional subspace, followed
      as its members are pushed through the harness. The object is the FORGOTTEN structure -- the
      tau_32-symmetric part of each round constant -- which the observable discards by construction.'
    lossiness: 'The observable eps = RC XOR tau_32 RC discards exactly the symmetric component of
      each round constant: 32 of the at most 7 effective bits per round in the FIPS support, and 32
      of 64 bits per round in general. That is the entry''s whole subject. The lossiness is not incidental;
      it is the thing being measured, and the entry exists because the discard is large, exactly characterisable,
      and never previously examined here. What propagates is the eps sequence, deterministically,
      which is why every companion contract''s curve is constant on the fiber.'
    propagation: 'Within the fiber the target operation is ''evaluate the permutation and search for
      a collision'', and the question is whether that operation is constant on the fiber. The decay
      observable is constant by construction; the permutation is not, since adding a symmetric vector
      to a round constant changes the map. So one step of the operation acts on the fiber as: identical
      observable in, potentially different search outcome out -- and measuring that difference is
      the experiment.'
    survival_score: Reported as the largest round count at which the harness's certificate counts
      remain statistically indistinguishable across fiber members, given the seed-only reference variance.
      If they are indistinguishable at every tested round count, the observable survives the audit
      within the tested range; if they diverge at some r, the observable is measured to be insufficient
      from that round onward, and the round index is the survival score.
  null_object_control: 'The seed-only arm IS the null and it runs in the same invocation: the FIPS
    schedule alone, 100 repetitions with different seeds and identical constants, giving the variance
    attributable to solver randomness with no fiber variation at all. For a cross-fiber difference
    to mean anything, the between-member variance must exceed this within-member variance by a declared
    margin. A second null uses 100 schedules drawn OUTSIDE the fiber with matched support shape, whose
    decay curves differ; those must show at least as much between-member variance as the fiber arm,
    otherwise the harness cannot distinguish any constant schedules and the whole test has no resolution.'
  discriminated_from:
  - IDEA-20260807-df906f (group-law rigidity theorem with four escapes) -- an established internal
    result and the repository's canonical identifiability argument, but over the ECDLP group law with
    an algebraic rigidity proof; this entry constructs an explicit fiber of a numerical observable
    and tests it empirically, and claims no rigidity of any kind.
  - The companion active-row contract's random-constant nulls -- those vary constants and change the
    curve; this one varies constants and holds the curve exactly fixed, which is the opposite design
    and the only one that tests identifiability.
  - The shape-matched random permutation control -- that varies the permutation freely and looks at
    the curve distribution; this varies the permutation within a curve-preserving fiber, which is
    a strictly finer instrument.
  - Generic 'test the model on more data' proposals -- the fiber here is a closed-form 768-dimensional
    subspace, so members are sampled rather than searched for, and the test has no discovery risk
    at all.
  assumptions:
  - The decay statistics used by companion contracts genuinely depend on constants only through eps;
    verified rather than assumed in stage 2.
  - The collision harness has enough resolution at r = 1..4 to detect a real cross-fiber difference;
    the out-of-fiber null arm measures whether it does.
  - Adding a tau_32-symmetric vector to a round constant yields a permutation that is different in
    a meaningful sense; verified by output Hamming distance in stage 3.
  - Certificate counts at fixed budget are a fair proxy for 'what a search can feel'; alternative
    proxies (conflicts to first solution) are reported as secondary.
  predictions:
  - metric: bit-identity of every decay statistic across 1000 sampled fiber members
    direction: different
    minimum_effect: forced to be exact identity; a single difference falsifies the fiber characterisation
  - metric: mean output Hamming distance between fiber members on common inputs, in bits
    direction: higher
    minimum_effect: 700
  - metric: between-member variance of certificate counts across the fiber, relative to seed-only
      variance
    direction: different
    minimum_effect: no pre-commitment; whether the observable is sufficient is precisely the unknown,
      and pre-committing to a direction would prejudge KN-TECH-080 audit 2
  - metric: between-member variance for the out-of-fiber null relative to seed-only variance
    direction: higher
    minimum_effect: 1.5
  minimal_test:
    design: Stages 1-3 alone cost under fifteen minutes and already deliver the audit's structural
      half. Verify by direct computation on 10^5 pairs that RC and RC XOR s give identical eps for
      tau_32-symmetric s, and confirm by rank that the kernel is exactly 32-dimensional per round
      -- this establishes the fiber in closed form with no sampling uncertainty. Sample 1000 fiber
      members around FIPS and check that every decay statistic the companion contracts compute is
      bit-identical across all of them; this is the cheapest possible falsifier of the fiber characterisation
      and requires no solver. Then measure the mean output Hamming distance between fiber members
      on 10^4 common inputs; if it is near 800 bits, the members are genuinely different permutations
      and the collision is real rather than nominal. At that point the audit's finding -- that the
      decay observable has a 2^768 fiber of genuinely distinct permutations -- is established and
      committed, and the empirical half in stages 4-6 tests whether a search can feel the difference.
    controls:
    - 'Seed-only null: FIPS schedule, 100 seeds, identical constants, giving within-member variance.'
    - 'Out-of-fiber null: 100 schedules with matched support shape whose eps sequences differ, giving
      the harness''s resolution floor.'
    - 'Fiber-identity control: every decay statistic must be bit-identical across fiber members, checked
      before any search runs.'
    - 'Permutation-difference control: mean output Hamming distance between fiber members must be
      near 800 bits.'
    - 'Encoding-freeze control: the CNF hash must be constant across seeds within a member, so only
      the constants vary.'
    required_metrics:
    - kernel dimension of RC -> eps, per round, by rank
    - bit-identity verdict for every decay statistic across fiber members
    - mean and distribution of output Hamming distance between fiber members
    - verified certificate counts per member per round per seed
    - between-member and within-member variance of certificate counts
    - the same for the out-of-fiber null
    - which decay statistics collide under the order-permutation fiber
  falsification_conditions:
  - Decay statistics are not bit-identical across fiber members -- the fiber characterisation is wrong
    and the audit is void.
  - The kernel of RC -> eps is not 32-dimensional per round.
  - Fiber members have near-zero output Hamming distance, meaning the fiber is trivial and no real
    collision was constructed.
  - The out-of-fiber null shows no more between-member variance than the seed-only null, meaning the
    harness cannot distinguish any constants and the empirical half has no resolution.
  - Certificate counts vary across the fiber beyond the declared margin -- the observable is measured
    insufficient, which is a positive finding of the audit and not a failure of the contract.
  confounders:
  - Solver randomness is large at small round counts and can swamp a real cross-fiber effect; the
    seed-only null exists to size it, and the declared margin must be set from that null rather than
    from intuition.
  - Sampling 100 fiber members out of 2^768 gives no coverage guarantee at all; the test can only
    detect a difference that is common in the fiber, and the record must say so rather than claiming
    the fiber is uniform.
  - Certificate counts at a fixed budget conflate 'harder instance' with 'unlucky solver', which is
    why conflicts-to-first-solution is reported as a secondary metric.
  - The order-permutation fiber changes the round-indexed curve while preserving multiset statistics,
    so mixing the two fibers in one analysis would confuse which observable is being audited; they
    are reported separately.
  interpretation_limits:
  - 'A measured collision in the observable shows insufficiency, not falsity: the decay model may
    still be correct once supplemented with a separating condition, and the record states this rather
    than reading the result as a refutation.'
  - A non-detection across 100 sampled members is weak evidence of sufficiency over a 2^768 fiber
    and is reported with that limitation explicit.
  - 'All empirical results inherit the companion harness''s limits: a negative search outcome is a
    budget outcome about a solver, never mathematical evidence.'
  - Round counts 1-4 carry no security meaning and nothing extrapolates to 24 rounds or to any deployed
    use.
  target_complexity:
    time_exponent: No attack exponent is claimed. The structural half is under 2^30 bit operations;
      the empirical half is a declared solver budget, not a derived cost.
    memory_exponent: No attack memory exponent is claimed. Fiber members are stored as 24 64-bit constants
      each.
    best_known: No incumbent is challenged and no attack is produced. Within this repository the incumbent
      identifiability result is the ECDLP group-law rigidity theorem and its four escapes, which this
      entry cites as a model of the argument shape and does not extend, contradict or re-derive.
    hidden_overhead: 'The human cost is in setting the declared margin honestly before seeing the
      data, which is where an audit like this usually goes wrong. The lower-order term is fiber coverage:
      100 samples from a 768-dimensional space is a vanishing fraction and the temptation to read
      non-detection as sufficiency is strong and must be resisted in the record''s own wording.'
  dominated_by: 'n/a (no result claimed). All frontier axes checked: no attack time, memory or data/query
    row is produced. The entry''s output is an identifiability verdict about an observable, which
    occupies no position on any attack frontier.'
  sota_delta: no attack; conceptual/measurement contribution only. Output is a fiber dimension, a
    bit-identity verdict, a Hamming-distance distribution and a variance comparison.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'That the fiber characterisation is exactly right and decay statistics
    are bit-identical across it: 0.9 -- it is one line of linear algebra, and the only risk is that
    some companion statistic secretly depends on RC beyond eps, which stage 2 would expose and which
    would itself be a valuable correction. That fiber members are genuinely different permutations
    by output distance: 0.9. That the harness has enough resolution for the empirical half at r <=
    4: 0.4. That a cross-fiber difference is detected: 0.3. That the audit changes how a companion
    contract states its claim: 0.65, because even the structural half alone -- a 2^768 fiber of the
    observable -- constrains what any decay-based prediction may assert.'
