idea:
  id: IDEA-20260805-6a14e3
  question_id: RQ-ECDLP-002
  added: '2026-08-05'
  goal_id: GOAL-PATH-001
  title: >-
    Type-check the tier series before spending its remaining budget: an
    object-class, unit and scale audit of every declared feed edge in the
    GOAL-PATH-001 dependency graph, whose first forced value is that the lane
    named in this goal's own next_action (DREG) appears in ZERO of the three
    ICEX feed bindings
  class: control

  claim: >-
    GOAL-PATH-001 is a coordination goal: it "binds the series, dependencies,
    and the single program-level next action" (goal record, verbatim). Its
    next_action offers exactly three options - "expand DREG ladder under CTRL-B,
    admit ECDLP executable seal, or prioritize other Tier-1 measurement" - and
    asks for exactly one next batch. NOTHING IN THE COMMITTED RECORD SAYS WHICH
    COMPLETION CRITERION EACH OPTION SERVES, and the answer is not uniform.
    The audit is a type-check, it is zero compute, and its first forced value is
    checkable in one grep. The frozen ICEX protocol's feed_pins block names
    exactly three producers - sdeg, reln, mono - and every one of its five
    fixture cells carries
      requires_feed_bindings: [SDEG C_decomp, RELN declared_p_lower_solve, MONO outcome]
    (READ verbatim this session). PREDICTED BEFORE CHECKING, AND THEN CHECKED:
    the string DREG appears ZERO times in that protocol. It does. So option 1 of
    this goal's own next_action produces no ICEX feed and therefore cannot
    advance completion clause 1 at all; it can advance clause 2, by closing one
    of eight children, and nothing more.
    The object-class mismatch behind that is not bookkeeping, it is committed
    mathematics. GOAL-DREG-001's declared object is "the boolean chained Semaev
    (m=3, t=3) solving degree d_reg(n)" over GF(2). GOAL-SDEG-001's declared
    object is "prime-field Semaev S_3/S_4 decomposition ... as the numerator for
    GOAL-ICEX-001". H-SDEG-0dd021 states the gap in its own interpretation
    limits: "BOOLEAN IS NOT PRIME-FIELD ... A repaired boolean d_reg model DOES
    NOT TRANSFER, and every citation toward prime-field cost must carry that gap
    explicitly." Two adjacent lanes, two different objects, and the tier series
    has never written down which edges of its own graph type-check.
    THE SECOND FORCED VALUE IS A UNIT CHECK AND IT IS SHARPER. The ICEX protocol
    fixes its comparison rule as "Coordinatewise dominance under IDENTICAL
    COUNTER CONVENTIONS and coverage only; otherwise incomparable" and pins its
    primary coordinate to "total group_operations under frozen types
    add+dbl+mixed_add, or cpu_time_ns". The SDEG feed is required to deliver
    C_decomp as a "multi-coordinate rank-failure-resource-v1" vector. THE
    QUESTION NOBODY HAS ASKED IS WHETHER A COMMITTED CONVERSION EXISTS FROM
    rank-failure-resource-v1 COORDINATES TO add+dbl+mixed_add GROUP OPERATIONS.
    If it does not, the numerator and the baseline are in different units, the
    protocol's own comparison rule declares them incomparable, and clause 1 is
    blocked by a missing conversion rather than by a missing measurement -
    which is a far cheaper thing to fix and a completely different next action.
    THE THIRD FORCED VALUE IS THE SHARED BLOCKER. GOAL-SDEG-001 and
    GOAL-RELN-001 - the two producers clause 1 still needs - carry next_action
    text that names the SAME residual: SDEG says "Defer activation/executor
    until ECDLP verifier-hash and precommit residuals clear under a separate
    ledger authorization; no runs now", RELN says "Defer measurement until
    activation residuals clear and PATH prioritizes an admitted RELN executor
    batch; no runs now". Two of the three remaining feeds are gated on one
    shared object. Clearing it once unblocks both. THAT IS A ONE-BATCH ACTION
    THE next_action's THREE OPTIONS DO NOT CONTAIN.
    THIS PROPOSAL CLAIMS NO MATHEMATICS AND MOVES NO EXPONENT. It proposes that
    a coordination goal compute the incidence matrix it exists to compute,
    before it spends the remainder of an 86,400-second campaign budget. Both
    outcomes are useful: if the graph type-checks, the series learns that its
    next_action is well-posed and the audit costs an afternoon; if it does not,
    the series learns which edge is broken while there is still budget to repair
    it, instead of after two measurement packages have been produced in units
    their consumer cannot accept.

  object_first_candidate:
    tracked_object: >-
      THE FEED, as an object with a type, followed along an edge of the
      dependency graph: (producer goal) -> measurement package -> declared
      symbol -> consumer binding -> aggregation -> decision. The tracked
      coordinates are the type, not the value: OBJECT CLASS (boolean GF(2)
      chained Semaev / prime-field E(F_p) short Weierstrass / F_{q^n} /
      number-theoretic census), UNIT (group operations, F_p operations, GF(2)
      row operations, wall-clock ns, dimensionless probability), SCALE (the
      field_bits or n at which the package exists), and CERTIFICATE KIND
      (decomposition, discrete_log, none). The numeric value is deliberately
      discarded; what is followed is whether the arrow is even defined.
    established_families_off_limits: >-
      OFF-LIMITS as the primary lens: index calculus, summation polynomials,
      Groebner solving degree, Semaev relation collection, isogeny and
      endomorphism transfer, lattices and small roots, generic-group lower
      bounds, xedni/lifting, monodromy census, multi-target amortisation. None
      is the lens, because this proposal proposes no mathematics about the
      ECDLP at all. It audits a COORDINATION ARTEFACT that the tier series has
      frozen, which is the "attack the measurement, not the target" move.
    newness_score: >-
      Nothing in it is mathematically new and the record says so plainly. What
      is new in this corpus is that it is WRITTEN DOWN: the tier series has
      eight child goals, a frozen protocol with three feed pins, and no
      committed record anywhere that maps producer object classes and units onto
      consumer bindings. The nearest existing artefacts are the protocol's own
      feed_pins block (which lists producers but not their object classes) and
      the feed_supersession block on GOAL-ICEX-001 (which exists, in its own
      words, "because the refutation previously lived only in execution-report
      prose, where a driver resuming this goal would never have seen it") - i.e.
      the series has already been bitten once by exactly this class of defect
      and repaired one instance of it without generalising.
    testability_score: >-
      Total, and free. Every claim is a property of a committed file. A reviewer
      can falsify any row of the matrix by opening the file it cites. There is
      no seed, no noise, no solver, and no scale.
    survival_score: >-
      The type survives every arrow by construction if the arrows are well
      formed, and that is the whole test: an edge on which the type does NOT
      survive is a broken edge, and the audit's output is the list of them.
      Beyond the graph the object has no reach and the record claims none.

  mechanism: >-
    DERIVED FROM COMMITTED RECORDS READ THIS SESSION. No external source is
    involved and nothing here is relayed.

    (1) THE TWO CLAUSES ARE SERVED BY DISJOINT WORK. GOAL-PATH-001's
    completion_criteria is a disjunction:
      CLAUSE 1: GOAL-ICEX-001 reaches a committed Coordinator decision on a
        charged toy IC-vs-rho exponent within declared scope; OR
      CLAUSE 2: every Tier 0-2 child goal has a committed scoped
        closure/decision that removes its uncertainty without an admissible
        surviving pipeline.
    Clause 1 has a CRITICAL PATH of length 3: SDEG's C_decomp package, RELN's
    declared_p_lower_solve package, and MONO's outcome package must all exist
    and be admissible, and then a separate Coordinator authorization must fire
    (GOAL-ICEX-001 next_action: "NO ICEX MEASUREMENT AUTHORIZED"). Clause 2 has
    a WIDTH of 8: every child goal must close. The two are not substitutes at
    the level of effort - one batch spent on a clause-2 child buys 1/8 of clause
    2 and 0 of clause 1.

    (2) THE INCIDENCE MATRIX, WHICH IS THE DELIVERABLE. Rows: the three
    next_action options plus the shared-blocker option this audit identifies.
    Columns: clause 1, clause 2. Entries derived from committed records only:
      * "expand DREG ladder under CTRL-B" -> clause 1: NO (DREG is not a feed
        pin; see (3)); clause 2: PARTIAL (advances GOAL-DREG-001 toward its own
        completion criterion, which is a committed decision on H-DREG-001).
      * "admit ECDLP executable seal" -> clause 1: INDIRECT (SDEG and RELN both
        name ECDLP verifier-hash / precommit residuals as their gate); clause 2:
        INDIRECT.
      * "prioritize other Tier-1 measurement" -> clause 1: YES IF the measurement
        is SDEG or RELN; NO otherwise. The option as written does not say which,
        and that ambiguity is itself a finding.
      * "clear the shared ECDLP verifier-hash / precommit residual" -> clause 1:
        YES, and it is the ONLY row that unblocks two feeds with one action.
    Every entry is falsifiable by opening the cited file.

    (3) THE OBJECT-CLASS CHECK, WITH ITS FORCED VALUE. The frozen ICEX protocol
    (coordination/goals/GOAL-ICEX-001/batches/BATCH-001/tasks/TASK-20260731-021/
    ic_exponent_protocol.yaml, READ) has a feed_pins block naming exactly three
    producers: sdeg (GOAL-SDEG-001, charged_symbols_required C_decomp, C_rho,
    C_bsgs, measurement_status_at_protocol_design: absent), reln
    (declared_p_lower_solve), mono (envelope label, structure context only).
    All five fixture cells repeat requires_feed_bindings: [SDEG C_decomp, RELN
    declared_p_lower_solve, MONO outcome]. FORCED VALUE, PREDICTED BEFORE
    GREPPING AND THEN VERIFIED: the count of occurrences of "DREG" in that file
    is 0. This prediction could have failed and did not. The corresponding
    object classes, from the goals' own objective fields: DREG is boolean GF(2)
    chained Semaev at t=3, m=3, n up to 21; SDEG is prime-field Semaev S_3/S_4;
    ICEX cells are prime-field short Weierstrass at field_bits in {8,10,12,16},
    m=2 with S_3. DREG's object class matches no ICEX cell, and
    H-SDEG-0dd021 already states the non-transfer in its own words.

    (4) THE UNIT CHECK, WHICH IS THE PART THAT COULD ACTUALLY BLOCK CLAUSE 1.
    The protocol's comparison_rule is "Coordinatewise dominance under identical
    counter conventions and coverage only; otherwise incomparable", and its
    primary_coordinate_rule pins "total group_operations under frozen types
    add+dbl+mixed_add, or cpu_time_ns if group-op instrumentation incomplete -
    choose one and freeze". The SDEG feed must supply C_decomp as a
    "multi-coordinate rank-failure-resource-v1" vector, and its
    forbidden_from_sdeg_feed list explicitly bans scalarized_single_cost. The
    audit's question is therefore precise: DOES A COMMITTED, REVIEWED CONVERSION
    EXIST from rank-failure-resource-v1 coordinates to the frozen primary
    coordinate, and if the fallback cpu_time_ns is chosen instead, does
    IDEA-20260802-007's standing objection to wall clock as a decision variable
    apply to it? Both are answerable by reading committed files. If no
    conversion exists, clause 1 is blocked on a conversion, not on a
    measurement, and the correct next batch is to write the conversion.

    (5) THE SHARED-BLOCKER CHECK. SDEG next_action: "Defer activation/executor
    until ECDLP verifier-hash and precommit residuals clear under a separate
    ledger authorization; no runs now." RELN next_action: "Defer measurement
    until activation residuals clear and PATH prioritizes an admitted RELN
    executor batch; no runs now." Both quoted verbatim from committed goal
    records. Two of clause 1's three remaining feeds are gated on the same named
    residual, and RELN's gate additionally names PATH ITSELF as the actor that
    must prioritise it. The series is therefore partly waiting on its own
    coordinator. Identifying that is the whole value of doing the type-check at
    the PATH level rather than inside a child.

    (6) WHY THIS IS NOT A REASON TO DEPRIORITISE ANYTHING. AGENTS.md's
    research-direction integrity clause forbids using an audit to steer work
    away from a lead. This audit deliberately produces a matrix rather than a
    recommendation, records that option 1 DOES advance clause 2, records that
    the DREG lane's own completion criterion is unaffected by anything here, and
    names a revisit condition: if a committed conversion from boolean d_reg to a
    prime-field C_decomp coordinate is ever produced, the DREG-to-ICEX edge
    type-checks and this audit's first row must be recomputed.

  novelty_status: unverified

  literature_context:
    - >-
      coordination/goals/GOAL-ICEX-001/batches/BATCH-001/tasks/TASK-20260731-021/
      ic_exponent_protocol.yaml - READ. feed_pins, feed_composition_rules,
      comparison_rule, primary_coordinate_rule, fixture_ladder.cells_design and
      the requires_feed_bindings lists are quoted directly.
    - >-
      ledger/goals/GOAL-PATH-001.yaml, GOAL-ICEX-001.yaml, GOAL-SDEG-001.yaml,
      GOAL-RELN-001.yaml, GOAL-DREG-001.yaml - all READ this session; every
      objective, next_action and completion_criteria quotation above is verbatim
      from them.
    - >-
      ledger/hypotheses/H-SDEG-0dd021.yaml - READ IN FULL. Its interpretation
      limit "BOOLEAN IS NOT PRIME-FIELD ... DOES NOT TRANSFER" is quoted.
    - >-
      ledger/evidence/EV-ICEX-001.yaml - READ. Records the protocol-design PASS
      and "No ICEX measurement or solver campaign was executed."
    - >-
      IDEA-20260802-007 is cited only by title, as the standing objection to
      wall clock as a decision variable. NOT READ this session - RELAYED from
      this goal's context brief. The audit's step that touches it is to READ it
      and record whether it applies to the cpu_time_ns fallback; that is a
      checkable step, not an assertion.
    - >-
      No external literature is involved and none is cited. Nothing in this
      proposal depends on any paper.

  lossy_projection_identifiability_audit:
    projection: >-
      A measurement package (a full, valued, certificated artefact) projected to
      its TYPE: (object_class, unit, scale, certificate_kind).
    what_is_discarded: >-
      Every number. The measured cost, the probability, the rank, the
      certificate contents, the seeds, the provenance quality - all discarded.
      Only the four type coordinates are retained.
    why_genuinely_lossy: >-
      Extremely lossy: infinitely many distinct packages share a type. That is
      intended - the audit asks whether the arrow is defined, not what flows
      along it.
    why_compatible_with_the_operations: >-
      Compatible with the operation that matters here, which is COMPOSITION of
      feed edges. A type propagates deterministically along a composition of
      arrows exactly when each arrow's output type matches the next arrow's
      input type, and that is precisely the property the audit measures. It is
      NOT compatible with numerical aggregation, and the record must never be
      cited as saying anything about a value.
    is_it_only_a_change_of_coordinates: >-
      CHECKED FOR BOTH NAMED FAILURES. Not a change of coordinates: the value
      cannot be recovered from the type, so information is genuinely destroyed
      (contrast the (Delta, Pi) = (x XOR y, x*y) char-2 case, where the pair is
      recoverable as roots of t^2 + Delta t + Pi and nothing was gained). NOT
      the mirror failure either, and this is the one I checked hardest, because
      a type audit is exactly the kind of projection that can come out constant:
      if every edge in the graph had the same type the comparator spread would
      be zero and the audit would be vacuous. IT IS NOT CONSTANT - the graph
      contains at least three distinct object classes (boolean GF(2) chained
      Semaev, prime-field E(F_p), number-theoretic census primes) and at least
      three distinct units (GF(2) row operations, group operations, dimensionless
      probability), and the first forced value (DREG in zero of three bindings)
      is exactly a non-constant reading. The spread is real and it was verified
      before the record was written.

  assumptions:
    - >-
      That a goal record's objective and next_action fields are an accurate
      statement of its lane's object class. They are the committed statement,
      but an executor may have measured something broader. The audit therefore
      reads the EXPERIMENT contracts and evidence records for each producer, not
      only the goal record, and reports disagreements as findings rather than
      resolving them.
    - >-
      That the frozen ICEX protocol is the operative statement of what clause 1
      requires. It is committed, it is the artefact EV-ICEX-001 reviewed, and it
      is the only such artefact; but it is version 1.0.0-review and a later
      version could change the feed pins.
    - >-
      That "Tier 0-2 child goal" in clause 2 ranges over the eight child_goal_ids
      listed on the goal record. Two of them (ICLIFT-001, XEDN-*) are recorded
      elsewhere as completed; the audit must resolve which of the eight are
      actually in scope and report the count, rather than assuming 8.

  predictions:
    - metric: >-
        number of occurrences of the string DREG in the frozen ICEX protocol
        artefact
      direction: lower
      minimum_effect: >-
        EXACTLY 0. Predicted before checking; verified 0 this session by grep.
        A nonzero count would have falsified the audit's first row outright.
    - metric: >-
        number of ICEX feed bindings whose producer goal's declared object class
        matches the consumer cell's object class (prime-field short Weierstrass)
      direction: different
      minimum_effect: >-
        2 of 3 (SDEG and RELN match; MONO is declared structure-context only and
        the protocol states its census primes "are not required to equal ICEX
        ECDLP fixture primes"). If the audit finds 3 of 3 or 1 of 3, the reading
        of the protocol is wrong and the matrix must be rebuilt.
    - metric: >-
        number of committed, reviewed conversions from SDEG's
        rank-failure-resource-v1 coordinates to the ICEX primary coordinate
        (add+dbl+mixed_add group operations)
      direction: different
      minimum_effect: >-
        PREDICTED 0, and this is the prediction most likely to be wrong, which
        is why it is stated. If it is 0, clause 1 is blocked on a missing
        conversion. If it is >= 1 the audit has found the conversion and clause
        1's critical path is shorter than feared - a strictly good outcome that
        the audit is equally happy to report.
    - metric: >-
        number of distinct named residuals gating the two remaining clause-1
        producers (SDEG and RELN)
      direction: lower
      minimum_effect: >-
        PREDICTED 1 (a shared "ECDLP verifier-hash / precommit residual"). If it
        is 2, there is no shared blocker, the fourth row of the matrix
        disappears, and the audit's most actionable finding evaporates.
    - metric: >-
        number of the eight listed child goals that are in Tier 0-2 scope and
        NOT already terminal
      direction: different
      minimum_effect: >-
        No prediction is registered because the audit has not read all eight
        records and MUST NOT guess. This metric is declared so that the number
        is reported rather than assumed, and so that clause 2's true width is on
        the record.

  minimal_test:
    design: >-
      One stage, zero compute, one afternoon, entirely reads of committed files.
      STAGE 1: for each of the three ICEX feed bindings and each child goal,
      extract (object_class, unit, scale, certificate_kind) from the goal record,
      the producer's frozen protocol artefact, and every experiment contract and
      evidence record that lane owns. Build the type table. Then build the
      option-by-clause incidence matrix. Then answer the four prediction
      metrics. Emit the matrix, the type table, and a list of edges that do NOT
      type-check, each with the file and field that makes it fail.
    controls:
      - >-
        NULL OBJECT (same shape, forced value derived pre-run, CAN FAIL): run
        the identical type-extraction procedure on a pair of records that are
        KNOWN to be in the same object class and the same unit - the SDEG feed's
        C_decomp and its own matched C_rho / C_bsgs, which the protocol requires
        to be in the "same fixture subgroup, same resource schema/vocabulary".
        FORCED VALUE: the procedure must report TYPE MATCH on that pair. If it
        reports a mismatch, the extraction procedure invents mismatches and
        every mismatch it reports elsewhere is void. This null can fail and is
        the whole guard against an audit that finds problems because it is
        looking for them.
      - >-
        POSITIVE CONTROL (the instrument MUST fire): the DREG-to-ICEX edge,
        where a mismatch is already established by H-SDEG-0dd021's own committed
        interpretation limit. The procedure MUST report a mismatch there. If it
        does not, the procedure is insensitive and NO clean bill of health may be
        reported for any other edge.
      - >-
        SECOND POSITIVE CONTROL, ALREADY IN THE CORPUS: the feed_supersession
        block on GOAL-ICEX-001, which records a MONO feed whose prescribed
        relation_rate_input was refuted by the same run that activated it
        (DEC-20260802-a51c82). That is a known-broken edge with a known
        diagnosis. The procedure must independently flag it. A procedure that
        misses a defect the corpus has already found and documented has not
        demonstrated it can find one that is undocumented.
      - >-
        GRADED CONTROL, 4 interior points: score every edge on how many of the
        four type coordinates match (0, 1, 2, 3 or 4 of object_class, unit,
        scale, certificate_kind) and report the distribution. A graded score
        localises a broken edge to a specific coordinate instead of leaving
        "the edge does not work", and it makes a near-miss (matching object
        class, mismatching unit) visibly different from a total mismatch.
      - >-
        ORDERING CONTROL: the incidence matrix's entries are committed BEFORE
        any recommendation is written, so a recommendation cannot be
        back-fitted to a preferred option.
      - >-
        ARCHIVE CHECK (zero compute): searched this session for a prior
        type/unit audit of the tier feed graph. GOAL-ICEX-001 carries a
        feed_supersession block repairing ONE edge; no record was found that
        audits the graph. Recorded as a negative search result, not as proof
        none exists.
    required_metrics:
      - the full type table, one row per edge, with the file and field each coordinate was read from
      - the option-by-clause incidence matrix with a citation per entry
      - the list of edges that fail the type check, each with the coordinate that fails
      - the count of committed unit conversions found, with paths
      - the count of distinct residuals gating SDEG and RELN, quoted verbatim
      - the resolved count of in-scope non-terminal Tier 0-2 children

  falsification_conditions:
    - >-
      DREG appears in the ICEX feed bindings after all. The audit's first row is
      wrong and the record is withdrawn as a superseding record.
    - >-
      A committed, reviewed conversion from rank-failure-resource-v1 to the ICEX
      primary coordinate is found. The unit objection does not bind and clause
      1's path is shorter than the audit claims.
    - >-
      SDEG and RELN turn out to be gated on two distinct residuals. The
      shared-blocker row disappears.
    - >-
      The null control fails: the extraction procedure reports a mismatch
      between C_decomp and its own matched C_rho. Nothing the audit reports may
      be believed.
    - >-
      The positive control fails: the procedure does not flag the DREG-to-ICEX
      edge. The instrument is insensitive and no clean edge may be certified.

  confounders:
    - >-
      AN AUDIT THAT LOOKS FOR PROBLEMS FINDS THEM. The null control exists
      exactly for this, and the audit's output is a matrix rather than a verdict
      so that a reviewer can disagree row by row.
    - >-
      DECLARED SCOPE VERSUS MEASURED SCOPE. A goal's objective states what the
      lane intends; the experiments may have measured something wider or
      narrower. The audit reads both and reports disagreement rather than
      picking (AGENTS.md retrieval policy item 7).
    - >-
      PROTOCOL VERSIONING. The ICEX protocol is 1.0.0-review. If a later version
      changes the feed pins, the matrix is stale. The audit records the exact
      artefact path and its review status on every row.
    - >-
      THIS IS NOT MATHEMATICS AND MUST NOT BE SCORED AS MATHEMATICS. It moves no
      exponent, tests no hypothesis about the ECDLP, and produces no evidence
      about any curve. Its entire value is decision quality inside one
      coordination goal, and it should be weighed as such against the two
      mathematical proposals filed alongside it.

  interpretation_limits:
    - >-
      A finding that an edge does not type-check is NOT a finding that the
      producing lane is worthless, that its mathematics is wrong, or that it
      should be deprioritised. GOAL-DREG-001's completion criterion is a
      committed decision on H-DREG-001 and is untouched by anything here;
      closing it advances clause 2. The audit's own revisit condition is stated:
      if a committed boolean-to-prime-field conversion is ever produced, the
      first row must be recomputed.
    - >-
      NO STATUS CHANGE, NO next_action REWRITE, and NO reprioritisation is
      proposed or implied. Those are Coordinator decisions (AGENTS.md rule 1),
      and the frozen protocol is immutable - a confirmed defect is carried by a
      new protocol version, never by an edit.
    - >-
      The audit says nothing about whether clause 1's answer, once reachable,
      would be interesting. IDEA-20260805-bb4488, filed alongside this one,
      argues separately that the estimator clause 1 rests on is not identifiable
      at the sealed scales; the two findings are independent and either can hold
      without the other.
    - >-
      Toy tier is not even the right vocabulary here: NO measurement is made at
      any scale. The record's claim tier is that of a coordination audit and it
      supports no statement about any curve.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE IS LOAD-BEARING. Every claim is a property of a committed file that
        a reviewer can open. There is no random model, no distribution, no
        asymptotic, and no extrapolation. This entry exists to record that the
        proposal is unconditional and correspondingly limited: it can only ever
        establish facts about records.
      rigorous_support: Direct reading of committed artefacts.
      validation_plan: >-
        Independent re-extraction of the type table by a second agent, compared
        row by row; a disagreement on any row is reported rather than resolved.

  target_complexity:
    time_exponent: >-
      n/a. NO EXPONENT IS MOVED, CLAIMED, OR ADDRESSED. This proposal is
      explicitly not exponent-first work and does not pretend to be; it is
      filed as a coordination control alongside two proposals that do engage
      exponents, and docs/target-result-profile.md's bias should rank it below
      them on ambition and above them on cost.
    memory_exponent: n/a.
    best_known: >-
      Pollard rho / BSGS at N^{1/2}. Unchanged and untouched.
    hidden_overhead: >-
      The audit's subject is a coordination overhead, not an algorithmic one:
      the cost of discovering after two measurement packages exist that their
      consumer cannot accept their units.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no algorithm, no attack, no cost claim, no Pareto point). Rows checked
    before writing that: nothing here contributes to time, memory, or
    data/queries against any ECDLP baseline, because no algorithm is proposed.
    On the QUESTION it audits - what the tier series' feed graph actually
    requires - the incumbent artefacts are the frozen ICEX protocol's feed_pins
    block and GOAL-ICEX-001's feed_supersession block, and this proposal
    supersedes neither; it generalises the second. Checked for a prior graph-wide
    audit: the ICEX protocol, EV-ICEX-001, GOAL-PATH-001's batch checkpoint, and
    the 30 prior ideas in this goal's brief. None performs one. Absence of a
    search result is not evidence none exists.
  sota_delta: >-
    Zero on every attack axis. Quantitatively, the delta is decision-theoretic
    and is stated as counts rather than adjectives: clause 1 has a critical path
    of 3 feed packages plus 1 authorization, of which 1 (MONO) exists with a
