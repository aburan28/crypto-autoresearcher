  assumptions:
    - >-
      A genus-2 model over F_2 with 19 dividing #Jac(F_2) may fail to
      exist. IDEA-20260926-80209d predicts a single abelian-surface class
      at n=19 and leaves Jacobian-or-not open. Absence of a model is an
      outcome, and the degree claim is then untested.
    - >-
      F2 decomposition is a component. What is added is the Mumford
      eliminant degree of an auxiliary Jacobian fibre.
    - >-
      Toy cells use a prime extension degree n with 17 <= n <= 41. No
      attack is run at field degree >= 131.
  proof_search_map:
    bottleneck: >-
      The total degree of the eliminant of the fibre equations onto u_0,
      then the first-fall degree of Weil descent of S_3 with each input
      constrained by that eliminant.
    baseline_embedding:
      parameter_slice: >-
        GGMP example 5.1 at m=3: vector-space Weil-descended degree 6,
        fraction shape degree at most 9, on a set that the paper says is
        not Galois-invariant. Reproduced as a shape benchmark at n=19,
        equal cardinality, same m.
      reproduction_check: >-
        Enumerate y^2 + h(x) y = f(x) over F_2 with deg h <= 3 and
        deg f <= 6. For each model compute #Jac(F_2) from point counts
        over F_2 and F_4 and retain hits with 19 dividing that order.
        Check the group law on three random rational divisors by Cantor
        composition before any elimination.
    observation_collision:
      observable: the eliminant in u_0, as a univariate polynomial
      distinct_preimage_search: >-
        List pairs of reduced divisors on the fibre with the same u_0 and
        different v. A pair is the collision that certifies loss. Two
        fibres with the same eliminant and different t falsify uniqueness
        of the membership polynomial.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The constant term u_0 of the Mumford polynomial of the fibre
          divisor, after clearing denominators of Cantor composition.
        predicted_gain: >-
          One univariate membership polynomial whose degree is the measured
          eliminant degree, in place of a g*n Boolean system that still
          carries every Mumford coefficient.
    quantifier_order: >-
      For all genus-2 models over F_2 with 19 dividing #Jac(F_2), the
      eliminant degree differs from 6. Existence of one such model is not
      claimed; it is the hypothesis the enumeration tests. There is no
      forall-n claim.
    method_ceiling:
      strongest_certifiable_claim: >-
        An integer degree at n=19, m=3, genus 2, plus (L, b) for pi.
        No exponent at n=131, and no statement about non-hyperelliptic
        abelian surfaces.
      nearby_object_control: >-
        A vector subspace of F_{2^{19}} of equal cardinality, and a random
        subset of equal cardinality with no group law. A degree gap that
        appears on the random subset as well is an artifact of cardinality.
    proof_obligations:
      - claim: The enumerated models satisfy the curve equation and the order condition.
        responsibility: correctness
      - claim: The eliminant vanishes on the fibre and on no extra sampled field element inside a 4-times-degree test set.
        responsibility: strictness
      - claim: Degree and (L, b) are reported for the Jacobian arm, the subspace arm, the random-subset arm, and the null curve.
        responsibility: baseline
      - claim: The n=131 rho exponent is outside the certificate.
        responsibility: scope
    not_applicable_reason: >-
      None. Bottleneck, baseline, collision, transform, quantifier order,
      and ceiling all apply.
  predictions:
    - metric: total degree of the u_0 eliminant, integer
      direction: different
      minimum_effect: absolute difference at least 1 from 6
    - metric: branching b of the u_0 projection, integer
      direction: higher
      minimum_effect: 2
  minimal_test:
    design: >-
      Toy cell n=19, q=2. Curve family on the elliptic side: the first
      Koblitz equation y^2 + x y = x^3 + a x^2 + b with a, b in F_2,
      searched in lexicographic order, whose group E(F_{2^{19}}) has a
      prime factor of bit length at least 17; recipe and the chosen (a, b)
      are written into the output. Auxiliary family: every genus-2 model
      y^2 + h y = f over F_2 with deg h <= 3 and deg f <= 6 (2048
      coefficient pairs, the range named by IDEA-20260926-80209d). Factor
      base: image of u_0 on the Couveignes fibre of an F_2-rational
      divisor class of order 19. Arity m=3. Attempts: one elimination per
      hit model, at most three hits. Seeds: none; the enumeration is
      deterministic. Instrument path: to be written. Null object: one
      ordinary curve over F_{2^{19}} with the same factor-base cardinality
      and no F_2-structure, same pipeline. Metrics: eliminant degree,
      first-fall degree after Weil descent, Boolean variable count, L in
      bits, b, and the same five numbers on the null arm.
    controls:
      - Identity projection on the same rational divisors, predicted b=1 and L=0.
      - Random map from those divisors onto a codomain of size |im pi|.
      - Relabelled Z/19Z: pull pi back along a fixed bijection of the rational points with Z/19Z and recompute (L, b).
      - Equal-cardinality F_2-subspace factor base on the same elliptic curve.
      - Random subset of F_{2^{19}} of equal cardinality.
      - Null curve over F_{2^{19}} not defined over F_2.
    required_metrics:
      - eliminant total degree (integer)
      - first-fall degree of the descended S_3 system (integer)
      - Boolean variable count after Weil descent (integer)
      - L in bits
      - b (integer)
    outcomes:
      positive: >-
        At least one Jacobian model of order divisible by 19 exists, and
        its eliminant degree differs from the equal-cardinality subspace
        arm by at least 1, while the random-subset arm does not show that
        same gap.
      negative: >-
        Every hit model has eliminant degree 6 and the same Boolean
        variable count as the subspace arm, or the branching b equals 1
        (pi lost nothing). Either result says this representation does not
        change the decomposition charge.
      artifact: >-
        No genus-2 model has 19 dividing #Jac(F_2), or the random-subset
        arm reproduces the gap, or a point-count mismatch with the
        Weil polynomial of the surface class appears. No degree claim is
        then made.
  falsification_conditions:
    - Eliminant degree equals 6 and the Boolean variable count equals the subspace arm on every hit.
    - b equals 1 on the Jacobian arm.
    - The degree gap is present on the random-subset control.
    - Cantor composition fails the three-divisor check, in which case the degree is infrastructure failure and is not evidence about the Jacobian.
  confounders:
    - Monomial order and Weil-descent basis can change first-fall degree; both are frozen before the run and applied to every arm.
    - Isomorphic genus-2 models can double-count hits; degrees are reported per isomorphism class once a reducing change of variables is fixed.
    - GGMP's degree 6 is a shape benchmark on a set that paper says is not Galois-invariant, so the subspace arm at equal cardinality is the invariance-matched control.
  interpretation_limits:
    - KN-OPEN-020 class is high-degree or implicit-membership, as the eliminant degree comes out. Description, membership, relation, descent, time, and memory are all charged in the metrics list.
    - A degree at n=19 does not transfer to n=131. Genus 2 cannot supply an order-131 point over F_2: the surface ceiling is 33.
    - No deployed curve is an instance. The arithmetic at n=131 is the ceiling statement only.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The leading coefficient of the u_0 eliminant is nonzero, so the
        degree equals the Bézout upper bound of the fibre equations rather
        than a proper divisor of that bound.
      rigorous_support: >-
        None opened for the Bézout number of Cantor composition. The
        pattern imitated is the classical one: a uniform random polynomial
        of degree at most B over a finite field has degree B with
        probability 1 - 1/|k|.
      validation_plan: >-
        At n=19, genus 2, record the leading coefficient on every hit.
        Tail check: the coefficient is nonzero. Transfer to n=131 is not
        assumed; genus 2 has no order-131 point over F_2.
  target_complexity:
    time_exponent: >-
      n/2 for Pollard rho with the Frobenius-class factor n^{-1/2}. This
      representation does not change that exponent. At genus 2 the
      rational-point cap is 33.
    memory_exponent: >-
      Rho memory is the van Oorschot-Wiener distinguished-point memory,
      with time-memory product on the order of the group order divided by
      n. Groebner memory is the Macaulay basis at the measured degree.
    best_known: >-
      Pollard rho ~ 2^{n/2} / n^{1/2} on Koblitz, 2^60.9 at n=131
      (KN-OPEN-095df5, citing KN-LIT-096). Index calculus has no better
      proven exponent on prime-degree binary curves (KR-IC-1fcdbc,
      KR-IC-9e610d, KR-IC-ae532f). KR-IC-46d822 is the fixed-n large-q
      regime and does not apply to q=2 and prime n.
    hidden_overhead: >-
      The 1/n relation-count factor and the n^2 linear-algebra factor of
      KR-IC-b0fcda are polynomial in n and are named here so they are not
      hidden inside an o(1). Semaev degree 2^{m-2} at m=3 is 2, before
      Weil descent. Gaudry's n! 2^{n(n-1)} cofactor is the fixed-n regime
      and is not claimed.
    tradeoff_note: >-
      No time-memory tradeoff better than van Oorschot-Wiener is claimed.
      Parallelism is that of a single Gröbner basis at m=3, not of rho.
