---
idea:
  id: IDEA-20261002-711e84
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-02'
  status: proposed
  approved_by: null
  title: >-
    Mumford u-coefficient eliminant of a genus-2 Jacobian fibre over F_2,
    as the membership polynomial of a Galois-invariant factor base for a
    binary elliptic curve at the ladder prime n=19.
  class: representation
  claim: >-
    On a genus-2 curve C/F_2 whose Jacobian has a rational point of order
    19, the Couveignes fibre of translation by that point, written in
    Mumford coordinates and eliminated onto the constant term u_0, has
    total degree different from 6, the Weil-descended vector-space degree
    GGMP example 5.1 records at m=3. The elliptic point stays in R1
    x-coordinates. The attack stage whose charge changes is decomposition.
    A genus-2 rational-point set has size at most 33, so this degree is a
    toy invariant and leaves the rho exponent n/2 unchanged at n=131.
  mechanism: >-
    Meeting: hyperelliptic curves (Cantor composition in Mumford
    coordinates on Jac(C)) and elliptic curves (the Semaev polynomial of
    the target E(F_{2^n})). The Jacobian is the auxiliary Couveignes
    group. The discrete log stays on E.
    OBJECT FRAME. Representation of the elliptic point: its x-coordinate
    in F_{2^n}. Representation of the auxiliary divisor: the Mumford pair
    (u, v). Operation set Sigma: translation on Jac(C) by the order-19
    class t, together with translation on E by points whose x-coordinate
    lies in the image of u_0. Sigma is not the full translation action of
    E. Index calculus on E is Class I partial-action by factor-base
    elements only.
    TRICHOTOMY. Branching. Reason: the projection pi that keeps only u_0
    has fibres containing both a reduced divisor and its hyperelliptic
    conjugate, and translation by t of odd order does not preserve those
    fibres, so pi is not a block system of <t>.
    LOSSY-PROJECTION TEST against Sigma = <translation by t>. Discarded:
    the Mumford polynomial v and every coefficient of u except u_0. The
    discard is not a block system of <t>; the branching bound is the
    fibre size b of pi, priced below. Lossy: v is not a function of u_0
    on a general divisor, so pi is not a change of coordinates.
    PRICE. Branching pair (L, b). L is log2 of the average fibre size of
    pi on Jac(C)(F_2). b is the maximum fibre size. Both are measured on
    the n=19 toy against the identity map (predicted L=0, b=1), a
    random map onto a codomain of size |im pi|, and the same projection
    pulled back along a random bijection of the rational points with
    Z/19Z.
    OFF-LIMITS COMPONENT. The factor-base decomposition stage is F2, used
    only as the stage whose degree is measured. Frobenius-stable linear
    subspaces and the two written Couveignes constructions are not the
    lens. Added: an eliminant degree for a genus-2 Mumford fibre. The
    Weil-polynomial census IDEA-20260926-5c26f9 returns a characteristic
    polynomial and no equation. GHS is empty at prime degree: C is not a
    cover of E, and a prime extension has no intermediate subfield
    (KR-IC-5ea2f8). This is not the hyperelliptic index-calculus exponent
    of KR-IC-a4dd54, which attacks the Jacobian discrete log itself.
    FACTOR-BASE ESCAPE. KN-OPEN-020 class: high-degree if the eliminant
    degree grows with the fibre, otherwise implicit-membership while the
    eliminant is uncomputed. Charges: description is the curve equation
    plus t; membership is evaluation of the eliminant; relation is one
    S_3 decomposition; descent is Weil descent of that eliminant to F_2;
    time and memory are the Groebner cost of the descended system at m=3,
    charged on the object and on the null curve.
    REPRESENTATION CLASS. R1 for E. The Mumford pair is R3 relative to E
    (divisor coordinates on an auxiliary Jacobian). Kummer-line and
    degree-d functions on E stay closed and are not the model of E.
  novelty_status: unverified
