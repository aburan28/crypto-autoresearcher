idea:
  id: IDEA-20260816-0732fb
  question_id: RQ-NTRU-9015ee
  added: '2026-08-16'
  title: Measure the successive-minima ladder of a toy NTRU lattice by exhaustive certified enumeration
    and count the multiplicity of the minimum, testing whether the unique-shortest-vector gap that
    uSVP reasoning assumes exists at all in a lattice whose secret comes with a full rotation orbit
  class: measurement
  claim: '(A) The NTRU lattice contains, alongside the secret (f,g), all n of its rotations and all
    their negatives, every one of the same coefficient norm. So the shortest vector is not unique:
    its multiplicity is at least 2n by construction. Any reasoning that treats the instance as a unique
    shortest vector problem with gap lambda_2 / lambda_1 is therefore working with a gap that is structurally
    1, and whatever it actually means must be a gap to the first minimum outside the orbit, at index
    2n + 1 in the successive-minima ladder.

    (B) The claim under test is that this distinction is measurable and material at toy scale: that
    the exact ladder lambda_1 <= lambda_2 <= ... <= lambda_{2n+2}, computed by certified exhaustive
    enumeration in a lattice small enough to permit it, shows a flat plateau of length exactly 2n
    followed by a jump, that the jump ratio lambda_{2n+1} / lambda_1 is the quantity a gap-based heuristic
    should be using, and that this ratio behaves differently in q from the naive lambda_2 / lambda_1
    which is pinned at 1.

    (C) The matched control makes the claim falsifiable rather than definitional: a random q-ary lattice
    of identical dimension, determinant and modulus with a single planted vector of identical norm
    has multiplicity exactly 2, so its ladder should show a jump at index 3, and its lambda_3 / lambda_1
    is the naive gap. Running both through the same enumerator gives the two gaps side by side and
    shows how much of the apparent uSVP gap in an NTRU instance is an artifact of counting the orbit
    as competition.

    (D) What is NOT claimed: no attack, no statement about how any reduction algorithm behaves in
    the presence of a plateau, and specifically not that a plateau helps or hinders recovery, which
    is a separate question this contract does not touch. It is not claimed that the plateau length
    is exactly 2n rather than more, since coincidences can add vectors; the measured multiplicity
    is the deliverable and a value above 2n is a reportable surprise. It is not claimed that any published
    analysis makes the naive error; this program cannot read the literature and asserts nothing about
    it.'
  mechanism: 'Stage 1: build toy NTRU instances at n small enough that exhaustive enumeration of all
    lattice vectors below a radius is certifiable, which for exact integer enumeration means lattice
    dimension 2n in the low twenties. Certification means the enumerator returns, with a proof obligation
    the run wrapper re-checks, that no vector below the reported radius was missed; the check is a
    re-enumeration by an independent bound and an explicit count.

    Stage 2: enumerate all vectors up to a radius chosen as a fixed multiple of the secret''s norm,
    deduplicate by sign, sort by norm, and read off the ladder together with the multiplicity of each
    distinct norm value.

    Stage 3: identify which of the minimal vectors are rotations of the secret, by direct comparison,
    and which are not. This is the step that turns a multiplicity count into a structural statement:
    a multiplicity of exactly 2n whose members are exactly the signed rotations is the predicted picture;
    extra members are structure the proposal did not anticipate and are the most interesting possible
    outcome.

    Stage 4: run the identical enumerator on the matched single-plant control and read its ladder.

    Stage 5: sweep q and report both gap definitions as functions of q on both arms. The refutation
    that matters is a plateau that is not 2n long, or a lambda_{2n+1} / lambda_1 that tracks the naive
    gap so closely that the distinction is immaterial, which would be a clean negative and would say
    the orbit does not distort gap-based reasoning in the tested range.'
  novelty_status: unverified
  novelty_screen:
    method: Read all nine RQ-NTRU-9015ee proposals by title and class. grep -ril 'successive minima',
      'uSVP', 'multiplicity', 'enumeration', 'lambda_1', 'shortest vector' over ledger/proposals/
      and ledger/hypotheses/. Read KN-OPEN-026 for whether the multiplicity question appears there.
    results: No proposal under RQ-NTRU-9015ee computes a successive-minima ladder or a multiplicity.
      IDEA-20260809-24eec3 works with the reduced profile, which is a different object and does not
      see multiplicity at all. IDEA-20260809-26de01 works with recovery frequency. KN-OPEN-026 concerns
      cost-model discounts and does not mention the minima ladder. 'enumeration' matched proposals
      in the ECDLP and Groebner areas whose objects are unrelated. IDEA-20260809-2d4427 proposes a
      recovery certificate format, which this entry would consume for its enumeration certificate
      but does not duplicate, since a recovery certificate certifies one vector and an enumeration
      certificate certifies the absence of others.
    verdict: 'UNVERIFIED. No assertion about external literature; the fact that an NTRU secret has
      n rotations is elementary and universally known, and the consequences for uSVP framing may well
      be standard. What is claimed new relative to this repository is the measurement itself: an exactly
      certified ladder with multiplicities, on both an NTRU lattice and a single-plant matched control,
      at dimensions where exhaustive enumeration is certifiable, yielding both gap definitions side
      by side as functions of q. Assembled from known parts: the rotation orbit, exhaustive enumeration,
      and the matched-control discipline.'
  object_first_candidate:
    tracked_object: The multiset of lattice vector norms below a fixed radius, with multiplicities
      and with each minimal vector labelled as rotation-of-secret or not. Followed through the operation
      of increasing q at fixed secret.
    lossiness: 'Lossy: the norm multiset discards all directions, all inner products between the minimal
      vectors, and the lattice''s basis entirely; two very different lattices can share a norm multiset.
      The retained part propagates compatibly with the operation of increasing q because the secret
      and its orbit are q-independent as integer vectors, so the low end of the ladder is fixed while
      the rest of the lattice''s minima move with q^{1/2} scaling of the Gaussian-heuristic radius.
      That is exactly why the ladder is informative in q: one part is pinned and the other moves.
      Caveat stated honestly: the labelling step reintroduces directional information deliberately,
      so the tracked object is the norm multiset plus a Boolean label, not the norm multiset alone.'
    propagation: 'One step of the target operation is q -> q'', which rescales the lattice''s non-planted
      part: the q-ary structure changes and, heuristically, minima not related to the secret scale
      with det^{1/2n} = q^{1/2}. The planted orbit''s norms do not move at all. So the ladder''s plateau
      stays fixed in absolute norm while the first non-orbit minimum moves, and the gap lambda_{2n+1}
      / lambda_1 is predicted to grow with q until other structure intervenes. The measurement is
      exactly whether it does.'
    survival_score: 'The object survives only where exhaustive certified enumeration is affordable,
      which is the sharp limit: lattice dimension in the low twenties, so n around 8 to 12. Beyond
      that the ladder cannot be certified and the object dissolves into an estimate, which this contract
      refuses to record as a measurement. That is a severe survival limit and is stated as the entry''s
      principal weakness, not hidden in the fine print.'
  null_object_control: 'The matched single-plant random q-ary lattice: same dimension 2n, same determinant
    q^n, same modulus, one planted vector of exactly the secret''s norm and no orbit. It runs through
    the identical enumerator in the same invocation. For the plateau claim to mean anything, the null
    must show multiplicity exactly 2 at its minimum, its signed planted pair, and a jump at index
    3. If the null also shows a long plateau, then plateaus are a property of q-ary lattices at these
    parameters rather than of ring structure, and the correct record is a controlled null. A second
    forced null: a lattice with an orthogonal basis of equal-norm vectors must return multiplicity
    exactly 2 times its dimension, gating the enumerator.'
  discriminated_from:
  - IDEA-20260809-24eec3 reads a reduced basis profile; a profile cannot see multiplicity, because
    Gram-Schmidt norms are basis quantities and the orbit's extra vectors do not appear in them separately.
  - IDEA-20260809-26de01 measures a transition width from recovery frequency; this entry runs no reduction
    and measures a lattice invariant, so it can be run where recovery cannot.
  - IDEA-20260809-2d4427 specifies a certificate for a claimed recovery, a positive existence claim;
    the certificate needed here is one of non-existence below a radius, which is a strictly stronger
    and differently structured obligation and is why this entry needs its own.
  - The covolume-envelope entry in this same batch works with rank-k determinants and never with individual
    vectors; it is blind to multiplicity by construction, which is why the two are complementary probes
    of the same plant.
  - A standard shortest-vector benchmark reports lambda_1 only; the entire content here is in indices
    2 through 2n + 2 and in the labels attached to them.
  assumptions:
  - Exhaustive enumeration below a radius can be made certifiable in exact integer arithmetic at lattice
    dimension in the low twenties within a bounded budget; if it cannot, the entry has no measurement
    and says so rather than substituting an estimate.
  - The secret's rotations are all distinct as vectors, which fails for degenerate secrets such as
    constants and must be checked and excluded by a pre-registered rule.
  - The matched single-plant control can be constructed with the planted vector's norm matched exactly,
    not approximately, since the whole comparison is of norms.
  - Sign deduplication is the right notion of distinctness, which is stated rather than assumed silently.
  predictions:
  - metric: multiplicity of the minimum in the NTRU arm, sign-deduplicated pairs counted once
    direction: different
    minimum_effect: forced value exactly n for generic non-degenerate secrets, that is 2n vectors
      counted with sign; any other value is a reportable surprise
  - metric: multiplicity of the minimum in the matched single-plant control
    direction: different
    minimum_effect: forced value exactly 1 sign-deduplicated pair; a larger value invalidates the
      control's matching
  - metric: lambda_{2n+1} / lambda_1 as a function of q in the NTRU arm
    direction: higher
    minimum_effect: monotone increasing over the tested q range, with no numeric slope pre-committed
      since no prior measurement exists in this repository to anchor one
  - metric: lambda_2 / lambda_1 in the NTRU arm
    direction: different
    minimum_effect: forced value exactly 1 for non-degenerate secrets
  minimal_test:
    design: 'Fix n = 10, lattice dimension 20, ring Z[x]/(x^n - 1), ternary secrets, and sweep q over
      six values on a log grid. For each of 30 instances per q, enumerate all lattice vectors of norm
      at most 3 times the secret''s norm using exact integer arithmetic with a certified bound, deduplicate
      by sign, sort, and record the ladder to index 2n + 2 with multiplicities and rotation labels.
      Run the identical enumerator on 30 matched single-plant controls per q. Report multiplicity
      distributions, both gap definitions, and their q-dependence. The forced values do most of the
      discriminating work: the NTRU arm must show a plateau of exactly n sign-deduplicated pairs and
      a naive gap of exactly 1, while the control must show one pair and a gap above 1. Any deviation
      is either a degenerate secret, which the exclusion rule catches, or a genuine structural surprise
      worth more than the planned result.'
    controls:
    - Matched single-plant random q-ary lattice, identical dimension, determinant, modulus and planted
      norm, one plant, no orbit.
    - Orthogonal-basis forced null with known multiplicity, gating the enumerator before any measurement.
    - Degenerate-secret exclusion by a pre-registered rule, with excluded counts published.
    - 'Radius-sensitivity control: re-run at 2x and 4x the secret norm radius to confirm the ladder
      up to index 2n + 2 does not depend on the enumeration radius.'
    - Independent recount of the minimal-vector set by a second, slower enumeration method on a subsample,
      requiring exact agreement.
    required_metrics:
    - multiplicity of each distinct norm up to index 2n + 2
    - lambda_1 through lambda_{2n+2}
    - lambda_2 / lambda_1 and lambda_{2n+1} / lambda_1
    - fraction of minimal vectors labelled as rotations of the secret
    - enumeration certificate status per instance
    - excluded degenerate-secret count
  falsification_conditions:
  - The NTRU arm's minimum multiplicity is not n sign-deduplicated pairs for non-degenerate secrets,
    falsifying the plateau claim.
  - The matched control shows a plateau of comparable length, recording a controlled null and saying
    that plateaus are a q-ary phenomenon rather than a ring one.
  - lambda_{2n+1} / lambda_1 does not increase with q over the tested range, falsifying the propagation
    prediction.
  - The enumeration certificate fails on any instance, making that instance an invalid measurement
    rather than a data point.
  - The radius-sensitivity control changes the ladder, meaning the enumeration radius was too small
    and the measurement is not of the lattice's minima.
  confounders:
  - Degenerate secrets, for which rotations coincide, would deflate multiplicity for a reason unrelated
    to the claim.
  - The ring Z[x]/(x^n - 1) has the all-ones vector as a special element, and secrets with large coefficient
    sums can produce coincidental extra short vectors that inflate multiplicity.
  - At very small q the lattice may contain many short vectors unrelated to the secret, swamping the
    plateau; this is a genuine regime effect and must be reported by q rather than pooled.
  - Matching the control's planted norm exactly may be impossible for some secret norms, in which
    case the nearest achievable norm and its discrepancy must be recorded.
  interpretation_limits:
  - The result is confined to lattice dimensions where certified exhaustive enumeration is affordable,
    which is far below any parameter of interest, and no extrapolation is offered.
  - A plateau says nothing about how a reduction algorithm behaves; that link is not tested here and
    must not be inferred.
  - Nothing about any deployed parameter set follows in either direction.
  target_complexity:
    time_exponent: No attack exponent claimed. The measurement's own cost is exponential in the lattice
      dimension, which is why the contract is confined to dimension about 20 and says so.
    memory_exponent: No attack memory exponent claimed. Memory is that of the enumeration stack plus
      the stored minimal-vector set, polynomial in dimension at the radii used.
    best_known: There is no in-repository measurement of an NTRU minima ladder to beat. The incumbent
      framing this entry examines is the implicit unique-shortest-vector picture used whenever a gap
      is quoted, which appears in this repository only as an assumption, not as a measurement.
    hidden_overhead: 'The certification obligation is the hidden cost: proving nothing was missed
      is much more expensive than finding the short vectors, and a sloppy certificate turns the whole
      entry into an assertion. The human cost is in the degenerate-secret rule and in matching the
      control''s planted norm exactly.'
  dominated_by: 'n/a (no attack result claimed). Frontier check: no time, memory or data axis is contested
    because nothing is being computed faster than anything else; the enumeration is deliberately the
    most expensive possible method, chosen because it is the only certifiable one at these dimensions.'
  sota_delta: No attack; measurement contribution only. The delta is the replacement of an assumed
    gap by two measured gaps with their multiplicities, at dimension 20, with no claim of transfer.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'That the plateau has exactly n sign-deduplicated pairs for non-degenerate
    secrets: 0.85, since it follows from rotation preserving norm, with the residual risk in coincidental
    extra vectors at small q. That the matched control shows exactly one pair: 0.8, with risk in the
    exact-norm matching. That lambda_{2n+1} / lambda_1 increases monotonically in q over the tested
    range: 0.5, because at dimension 20 the Gaussian-heuristic scaling is crude and small-q cells
    may be dominated by unrelated short vectors. That certified enumeration completes within budget
    at dimension 20 for 360 instances: 0.6. Joint prior for the full planned picture: about 0.25.'
