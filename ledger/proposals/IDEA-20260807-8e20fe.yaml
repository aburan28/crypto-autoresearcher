idea:
  id: IDEA-20260807-8e20fe
  question_id: RQ-AES-003
  added: '2026-08-07'
  title: >-
    The counted-op to measured-second conversion is not a scalar: the
    amortization-inversion locus in working-set size (A3-1)
  class: control

  claim: >-
    Formalization of catalogue entry A3-1 (ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/A3.md,
    lines 168-237). For two implementations X (direct) and Y (reorganised,
    fold-then-reuse) of one identical candidate-filtering subproblem, tracks
    rho(W) = (rho_ops(W), rho_time(W)) as a function of working-set footprint
    W, i.e. TO-COST at two points, differenced. Pre-registered prediction:
    there exists W* <= 2^33 bytes at which rho_ops(W*) > 1.5 (the
    reorganisation still wins decisively on counted operations) while
    rho_time(W*) < 1.0 (it loses on the clock) — the conversion factor
    kappa(W) = rho_time(W)/rho_ops(W) falls below 1/1.5 before the 15 GB
    envelope, is monotone non-increasing in W, and spans at least a factor of
    4 across W in [2^12, 2^33] bytes. This bears directly on GOAL-AES-003's
    own cost-accounting practice (CM-3, the measured-envelope receipt, and
    every operation-count saving reported anywhere in this repository under
    the sizing_basis convention), because it tests whether counted operations
    may be converted to measured seconds by one global scalar at reduced-
    round scale.

  mechanism: >-
    See A3.md lines 179-236 for the full mechanism (memory-hierarchy effect:
    Y trades cheap sequential reads for scattered histogram reads, so its
    operation-count advantage is bought with a worse access pattern that
    inverts sign as W grows past L1/L2/L3 into DRAM) and the charged cost
    (~300 lines C, 22 geometrically-spaced W points x 5 repeats x 2 arms,
    budget ~3.5h single core, single-core BY CHARGE because 4-core scaling is
    unmeasured and shared L3 would confound the sweep, peak 8 GB inside the
    15 GB envelope, measured not modelled).

  novelty_status: unverified

  source_refs:
    - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/A3.md (A3-1, lines 168-237)
    - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/INDEX.md (section 2a)
    - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/REDTEAM.md (section 4c)
    - ledger/goals/GOAL-AES-003.yaml
    - ledger/questions/RQ-AES-003.yaml
    - ledger/hypotheses/H-AES-d6405d.yaml (nearest prior-art neighbour, sq_null.c mode_compare6, distinguished per A3.md lines 230-235)

  review_refs: []
  disposition: proposed

  interpretation_limits:
    - >-
      Ceiling medium: a claim about THIS MACHINE's cost-conversion behavior,
      not about AES. Risk band conservative: the memory-hierarchy mechanism
      is well-understood and the only real uncertainty is the location of
      W* and the size of the kappa spread.
    - >-
      No cryptanalytic claim of any kind. Zero cipher queries beyond the
      frozen fold input; the AES S-box may be replaced by the identity map
      in the sibling control specifically to demonstrate the effect is a
      property of the access pattern, not of AES.
    - >-
      A CLOSED (falsifier-fires) outcome is itself the deliverable: it would
      license converting counted operations to seconds with one constant at
      reduced-round scale across the tested envelope, and is not a negative
      result.

  recorded_by: coordinator
  recorded_at: '2026-08-07'
