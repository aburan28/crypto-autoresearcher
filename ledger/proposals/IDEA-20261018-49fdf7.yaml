idea:
  id: IDEA-20261018-49fdf7
  title: 'Formal frame for closing pair-table and k-sum work: structured-GGM and non-adaptive time-space
    bounds'
  class: control
  question_id: RQ-ICPERF-94c86e
  area: ICPERF
  goal_ids:
  - GOAL-ICPERF-e6b6a4
  status: proposed
  proposed_by: idea-generator (Sonnet subagent logging the missed items of the 2026-10-18 index-calculus
    review)
  added: '2026-10-18'
  claim: Every recorded pair-table, k-sum and 6-sum design at ECC2K-130 and every n=85,89 rung is a non-adaptive
    table-lookup algorithm with advice below sqrt(N), so by Dinur-Keller-Marmor (ePrint 2025/783) its
    time is Omega(sqrt(N)); and every EC index-calculus row has a decomposition probability that, to beat
    rho, must exploit structure on at least a 1/sqrt(q) fraction of points (structured GGM, ePrint 2026/384).
    Tabulating the existing rows against the two bounds finds none that violates them.
  mechanism: 'Closes further pair-table/k-sum engineering formally and independently of the repository''s
    CGK calculation (KR-RHO-13bf67, KR-RHO-7d93f6). The deliverable is a mapping table of each existing
    row to its model class, advice S, time T and structured fraction delta, with the bounds applied; a
    row that appears to violate a bound tests the mapping, not the theorem. Literature notes are not added
    here: the knowledge corpus has KN-LIT-7606 for ePrint 2026/384 and nothing for 2025/783, 2024/992
    or 2026/360; creating KN-LIT entries needs a Coordinator archive commit and index regeneration, so
    the references are kept in the citations of this and related records.'
  novelty_status: unverified
  regime: theory-to-measurement mapping; desk tabulation of existing rows, no new compute
  citations:
  - ref: crypto:research/ic_leads_review_20261018/README.md 2.5, 3.8
    provenance: internal
    claim: Source of the opportunity, the measured figures quoted here and the cost estimate; desk review,
      no new measurement, costs are the reviewer's estimates.
    verified_by: idea-generator
  - ref: ePrint 2026/384 (Corrigan-Gibbs, Henzinger, Wu), KN-LIT-7606
    provenance: kb
    claim: 'Structured generic-group model: DL costs Omega(min(sqrt(q), 1/delta)) for algorithms exploiting
      structure on a delta-fraction of elements.'
    verified_by: idea-generator
  - ref: ePrint 2025/783 (Dinur, Keller, Marmor; STOC 2026)
    provenance: recalled
    claim: 'Non-adaptive time-space: with S below sqrt(N) advice, T = Omega(sqrt(N)); only adaptive walks
      reach ST^2 about N. Not re-opened in this pass.'
    verified_by: idea-generator
  - ref: ePrint 2024/992 (Vidal, Ionica, Delaplace); ePrint 2026/360
    provenance: recalled
    claim: Crossbred theory and improved preprocessing; kept here for the notes owed, see the Crossbred
      idea.
    verified_by: idea-generator
  - ref: crypto:docs/ic/LEADERBOARD.md and research/ic_leads_review_20261018 section 3.8
    provenance: internal
    claim: Rows to be mapped.
    verified_by: idea-generator
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-RHO-13bf67
    - KR-RHO-7d93f6
    - KR-RHO-ea34b8
    nearest:
    - ref: KR-RHO-13bf67
      provenance: internal
      relation: generalizes
      delta: Generic group model lower bound; the structured and non-adaptive variants add the quantitative
        frame for table-lookup IC hybrids.
    searched:
      note: Positioned against the cited review and the records it names. The frontier map was not rendered
        or matched in this logging pass; the Coordinator should run tools/build_frontier_map.py --match
        before ranking. A missing row is not evidence of novelty.
  assumptions:
  - The bounds are applied only within their stated models; a row outside the model (adaptive, or non-generic)
    is flagged, not forced in.
  - N and q are the matched subgroup order and field size per row.
  predictions:
  - metric: rows_violating_bounds
    direction: lower
    minimum_effect: Zero rows below Omega(sqrt(N)) for non-adaptive S < sqrt(N); zero rows with delta
      below 1/sqrt(q) claiming sub-rho cost.
  - metric: rows_outside_model
    direction: different
    minimum_effect: Listed with the reason; the prediction is that all pair-table/k-sum rows are inside
      the non-adaptive class.
  minimal_test:
    design: 'Build the mapping table for every pair-table, k-sum, 6-sum and n=85,89 row and each IC row
      with a decomposition probability: advice S, time T, adaptivity, delta. Apply both bounds with constants
      stated. No new compute.'
    controls:
    - plain rho and Bernstein-Lange rows as the adaptive and bounded-advice references
    - two reviewers' independent mapping of five rows
    required_metrics:
    - per-row model class
    - S, T, delta
    - bound margin
    - flags
  falsification_conditions:
  - A non-adaptive row with S < sqrt(N) and T well below sqrt(N) means the mapping is wrong or the bound
    is misapplied, and is escalated.
  - A row with delta < 1/sqrt(q) and measured sub-rho cost contradicts the structured-GGM application.
  confounders:
  - constants hidden in Omega
  - model fit of hybrid algorithms
  - advice accounting
  interpretation_limits:
  - Does not show that no IC variant beats rho; the bounds apply inside generic or structured models only.
    A formal frame, not a measurement; relabelling-class unless it changes what is run.
  heuristic_assumptions:
  - id: H1
    statement: Table-lookup IC hybrids fall in the non-adaptive class of the 2025/783 model.
    rigorous_support: Review section 2.5 reading of the paper.
    validation_plan: Check each row's lookup pattern against the paper's definition of non-adaptive.
  target_complexity:
    time_exponent: 'No algorithm. States lower bounds: Omega(sqrt(N)) time for non-adaptive with S < sqrt(N);
      Omega(min(sqrt(q), 1/delta)) structured.'
    memory_exponent: No exponent claimed; memory is the measured constraint, reported as peak RSS.
    best_known: Matched generic rho, r^0.5 group operations; the index-calculus baseline is Table A/B
      of crypto:docs/ic/LEADERBOARD.md (5.23x to 21x matched rho on Koblitz, 5.47x to 13.5x on prime fields).
      Report this row's gap to matched rho (and to Bernstein-Lange where setup is excluded) as distance
      remaining.
    hidden_overhead: Every phase, cold, is charged; unpriced native work is priced at 0, 0.1 and 1 GAE
      per operation (AGENTS.md 5a) wherever two arms are ranked.
    tradeoff_note: Not applicable beyond the stated resource envelope.
  estimated_cost:
    implementation: low
    compute: none (desk)
  recommended_priority: medium
  dominated_by: No attack result; the item is an unrun measurement or an unpaid baseline debt.
  sota_delta: Not an improvement; closes a line of engineering and sets what structure an EC index calculus
    must find.
