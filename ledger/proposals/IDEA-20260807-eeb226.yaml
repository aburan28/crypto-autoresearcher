idea:
  id: IDEA-20260807-eeb226
  question_id: RQ-EQIC-8cb959
  added: '2026-08-07'
  title: >-
    THE PHASE GRADING OF S_3, AND THE ONE STATISTIC IT MAKES TESTABLE: for
    a = 0 the summation polynomial splits into exactly three phase-graded pieces
    S_3 = A_0 + A_1 + A_2, so every decomposition over a phi-stable base carries
    a RELATIVE PHASE d = c_1 - c_2 in Z/3; test whether d is uniform, because
    non-uniformity is the only route by which phi-stability could change
    relation-collection cost at fixed factor-base size
  class: mechanism

  claim: >-
    (A) THE GRADING, EXACTLY. For E : y^2 = x^3 + b over F_p with p = 1 mod 3,
      S_3(x1,x2,x3) = x3^2 (x1-x2)^2 - 2 x3 ((x1+x2) x1 x2 + 2b)
                      + (x1 x2)^2 - 4b (x1+x2).
    Grade the monomials by their total degree in (x1, x2) modulo 3, with x3
    fixed at the target value x_R. The result has EXACTLY three graded pieces
    and no more:
      A_2 = x_R^2 (x1 - x2)^2                       [ (x1,x2)-degree 2 ]
      A_0 = -2 x_R ((x1 + x2) x1 x2 + 2b)           [ degrees 3 and 0 ]
      A_1 = (x1 x2)^2 - 4 b (x1 + x2)               [ degrees 4 and 1 ]
    so S_3(x1,x2,x_R) = A_0 + A_1 + A_2 with A_c homogeneous of
    (x1,x2)-degree congruent to c mod 3. This decomposition exists IF AND ONLY
    IF a = 0: with a != 0 the terms -2a(x1+x2)x3, -2a x1 x2 and a^2 appear with
    (x1,x2)-degrees 1, 2 and 0, which redistributes across the classes and
    destroys the clean three-term form.

    (B) WHAT THE GRADING DOES AND, CRUCIALLY, DOES NOT DO. It does NOT split the
    solution variety: S_3 = 0 requires the SUM to vanish, not each piece.
    Imposing A_0 = A_1 = A_2 = 0 is strictly stronger and says that the SAME
    pair decomposes all three of R, phi(R), phi^2(R) simultaneously -- a
    degenerate condition, generically empty, and this record does not pursue it.
    What the grading DOES give is a phase bookkeeping. Substituting
    x1 = zeta^{c_1} v_i and x2 = zeta^{c_2} v_j for orbit representatives
    v_i, v_j,
      S_3(zeta^{c_1} v_i, zeta^{c_2} v_j, x_R)
        = zeta^{c_2} S_3(zeta^{d} v_i, v_j, zeta^{-c_2} x_R),  d = c_1 - c_2,
    using the weight-1 semi-invariance S_3(z x1, z x2, z x3) = z S_3(x1,x2,x3).
    So the nine phase pairs collapse to three RELATIVE phases d in Z/3 times
    three choices of WHICH member of the target orbit {R, phi R, phi^2 R} is
    being decomposed.

    (C) THE COST ACCOUNTING THAT KILLS THE NAIVE READING, STATED UP FRONT. The
    collapse in (B) does NOT reduce the search. For a phi-stable base of
    cardinality 3m the unordered-pair search space is (3m)^2/2 = 4.5 m^2, and
    the structured enumeration m^2 orbit-representative pairs times 9 phase
    combinations divided by 2 is the same 4.5 m^2. Every phase combination must
    still be tested, because the three overall-phase classes decompose three
    DIFFERENT targets. There is no free factor of 3 in the search. The factor of
    3 that does exist is in the UNKNOWN COUNT (m instead of 3m), which is the
    classical automorphism quotient and is calibrated by
    IDEA-20260807-b42544, not claimed here.

    (D) THE ONE REMAINING ROUTE, AND THIS IS THE PROPOSAL. If the relative phase
    d of the decompositions that actually EXIST is not uniform on Z/3, then the
    search can be reordered to test the favoured class first, and the expected
    number of S_3 evaluations per found relation falls by the factor
    1 / (3 * max_d Pr[d]). Under uniformity that factor is 1 (no saving); under
    a maximally skewed distribution it is 3. THE CLAIM UNDER TEST: for a
    phi-stable factor base on a j = 0 curve, the relative phase d = c_1 - c_2
    of collected arity-2 decompositions is distributed uniformly on Z/3, and any
    observed deviation is sampling noise.
    TWO OUTCOMES, BOTH DELIVERABLES:
      OUTCOME U (uniform, and the pre-registered expectation). Then the
      phi-stable base contributes NOTHING to relation collection beyond the
      unknown-count quotient, and this record supplies the first measured, null-
      controlled statement of that in this repository. It converts "phi-orbit
      bases give a factor 3" from an unattributed ratio into an exact
      decomposition: factor 3 in unknowns, factor 1 in search, phase uniform.
      OUTCOME B (biased). Then S_3 restricted to a mu_3-stable set has a
      structural preference among phase classes on CM-by--3 curves. That is a
      statement about summation polynomials, not about bookkeeping, it is the
      first phi-specific effect in this lane that is not a construction
      artifact, and it carries an immediate (constant-factor) search-ordering
      consequence plus a follow-on question about whether the bias survives
      arity growth.

    (E) WHY THE GRADING IS THE MECHANISM AND NOT DECORATION. A bias in d, if it
    exists, must come from the algebra of the three graded pieces: writing
    x1 = zeta^d v, x2 = w, the vanishing condition becomes
      zeta^{2d} x_R^2 (v - zeta^{-d} w)^2 ... more precisely,
      A_2 contributes x_R^2 (zeta^d v - w)^2, whose vanishing locus depends on d
        through a translation of the ratio v/w by a cube root of unity;
      A_0 contributes -2 x_R ((zeta^d v + w) zeta^d v w + 2b);
      A_1 contributes (zeta^d v w)^2 - 4b(zeta^d v + w) = zeta^{2d}(vw)^2
        - 4b(zeta^d v + w).
    Only A_1's leading term is phase-homogeneous; A_0 and A_2 mix phases. So the
    three phase classes correspond to three GENUINELY DIFFERENT plane curves in
    (v, w), and there is no symmetry of the construction forcing them to carry
    equal numbers of factor-base points. Uniformity is therefore a heuristic to
    be tested, not a theorem -- which is exactly why the measurement is worth
    making and why the null must be run.

  resource_label: R1, R2
  admissibility: admissible
  admissibility_argument: >-
    R1: the tracked quantity is a statistic of the vanishing locus of a
    polynomial in x-coordinates viewed as FIELD ELEMENTS. A generic-group
    simulator has no access to S_3, to the graded pieces, or to the relative
    phase of a decomposition, so the measurement is not simulable in the sense
    of KN-FIND-b7e091. R2: the three-term grading and the semi-invariance hold
    IF AND ONLY IF a = 0, so the resource genuinely is the curve EQUATION. The
    proposal never applies phi to a point of G to gain information -- claim (C)
    states positively that the phase collapse yields no search saving -- so the
    admissibility filter of DECOMPOSITION.md section 2 is not triggered.

  discriminated_from:
    - >-
      H-STR-002 (weakened, DEC-20260727-009; DEFER-BATCH009-001 OPEN). Asserted
      about it in neither direction. H-STR-002 concerns displacement rank and a
      linear-algebra saving; this record measures a Z/3-valued statistic of
      collected decompositions and touches no matrix, no shift operator and no
      solve cost. The mechanism the weaken explicitly did not touch is whether
      the phi-invariant factor base yields an equivariant SYSTEM; this record
      goes one step further inside that system, to the phase distribution of its
      solutions, which appears in no arm of EXP-STR-002, EXP-STR-003 or
      EXP-STR-004 and in no prediction of H-STR-002.
    - >-
      IDEA-20260807-1ea327 (invariant coordinate u = x^3). That record FORGETS
      the phase and works in the invariant ring; this record KEEPS the phase and
      measures its distribution. They are opposite treatments of the same
      Z/3-grading and their outcomes are independent: the invariant encoding
      could win while d is uniform, and d could be biased while the invariant
      encoding loses.
    - >-
      KN-TECH-012 (isotypic block decomposition). That projects a relation SPACE
      onto character blocks with exact idempotents and solves per block. This
      record does not project or split anything; it counts which phase class the
      naturally occurring solutions land in. KN-TECH-012's own stated likely
      obstruction -- that solution tuples come in G-orbits so the trivial
      isotype carries the mass -- is the analogue of OUTCOME U here, and if
      OUTCOME B fires it is a datum bearing on that obstruction.
    - >-
      KN-LIT-004 / FHJRV. Both exploit symmetry to REWRITE the system. Neither,
      as far as their abstracts state, measures the distribution of solutions
      across the symmetry classes. Not verified beyond abstracts.

  object_first_candidate:
    tracked_object: >-
      THE RELATIVE PHASE d = c_1 - c_2 in Z/3 of a collected arity-2
      decomposition over a phi-stable factor base -- one element of Z/3 per
      relation, together with its empirical distribution over the target stream.
    lossiness: >-
      GENUINELY LOSSY, and heavily so: it forgets which orbits were used, which
      target was decomposed, the signs, the overall phase c_2, and the
      x-coordinates entirely. A relation collapses to one trit. What is retained
      is precisely the part of the phase data that the mu_3-action does NOT
      move: the action c -> c + 1 on both summands leaves d invariant, so d is a
      well-defined function on phi-orbits of relations.
    propagation: >-
      Deterministic under the target's operations: the mu_3-action sends a
      decomposition of R with phases (c_1, c_2) to a decomposition of phi(R)
      with phases (c_1 + 1, c_2 + 1), and d is exactly the invariant of that
      action. Negation acts trivially on x and therefore on d. Under a change of
      orbit representative v_i -> zeta v_i the phase c_i shifts, so d shifts by
      a fixed amount per orbit -- WHICH MEANS THE REPRESENTATIVE CONVENTION MUST
      BE CANONICAL AND FROZEN, or the statistic is not well defined. That
      requirement is a confounder below and a design obligation, not a defect.
    survival_score: >-
      Survives: change of target, change of base size, change of solver,
      negation. Dies at: a != 0 (no mu_3-action, no phase); a non-canonical
      orbit representative rule (the statistic becomes a property of the
      labelling); and arity growth, where d generalises to a class in
      (Z/3)^m / diagonal, of size 3^{m-1}, so the sample per class shrinks by
      3^{m-2} and the test loses power fast.

  mechanism: >-
    STEP 1 -- CANONICAL REPRESENTATIVES, DONE FIRST BECAUSE EVERYTHING DEPENDS
    ON IT. For each mu_3-orbit {x, zeta x, zeta^2 x} of on-curve x-coordinates,
    define the representative as the member with the least integer value in
    [0, p). This is canonical, cheap, and independent of the harness's
    generation order (which the committed
    _build_phi_invariant_factor_base does NOT guarantee to be canonical: it
    appends in the order x, zeta x, zeta^2 x for whatever candidate x the seed
    produced). Recompute the phase of every base element against the canonical
    representative and record the relabelling.

    STEP 2 -- COLLECT WITH PHASES. Run the existing arity-2 decomposition search
    (harness/semaev.py::_find_decomposition, or the quadratic-root variant) on a
    stream of targets R_t = a_t P + b_t Q over a phi-stable base of cardinality
    3m. For every found decomposition record (i, c_1, j, c_2, eps_1, eps_2) and
    hence d = (c_1 - c_2) mod 3. Certificate-verify each one independently.

    STEP 3 -- THE TEST. Pool over targets and instances; test the empirical
    distribution of d against uniform on Z/3 with a chi-squared goodness-of-fit
    at 2 degrees of freedom, pre-registering alpha = 0.01 and a minimum sample
    of 300 relations per instance so the test has power against a 10 percentage
    point deviation. Report the raw counts, not only the p-value.

    STEP 4 -- STRATIFY, BECAUSE A POOLED BIAS CAN BE AN ARTIFACT OF ONE CELL.
    Report d-counts per instance, per target, and per (i, j) orbit pair. A bias
    that is present in every instance is structural; a bias driven by one orbit
    pair is a property of that pair's geometry and must be reported as such.

    STEP 5 -- THE DIAGONAL CONTROL. The case i = j (both summands from the same
    orbit) is special: there A_2 = x_R^2 (zeta^{c_1} v - zeta^{c_2} v)^2 =
    x_R^2 v^2 (zeta^{c_1} - zeta^{c_2})^2, which VANISHES identically when
    d = 0. So d = 0 on the diagonal makes S_3 lose its leading term in x_R and
    the decomposition condition degenerates to A_0 + A_1 = 0, a different curve.
    The diagonal is therefore expected to be biased BY CONSTRUCTION and must be
    reported separately; a pooled bias driven entirely by the diagonal is not
    the effect this record is about, and separating them is the difference
    between a finding and an artifact.

    STEP 6 -- THE NULLS. Run STEP 2 and STEP 3 unchanged on the two null objects
    below and report all columns in one table.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Repository greps run 2026-08-07 in this session:
      (1) 'invariant ring|Molien|symmetric summation|elementary symmetric' over
      the repository, content mode;
      (2) 'Veronese|norm of the summation|cube substitution|u = x\^3|
      x\^3 invariant|mu_3' over the repository, content mode;
      (3) 'phi-invariant|phi-orbit|phi-stable|equivariant",' over the
      repository, files_with_matches.
      Records read in full: RQ-EQIC-8cb959, H-STR-002, DEC-20260727-009,
      EXP-STR-004/derivation_note.md, harness/semaev.py,
      harness/endomorphism_la.py, KN-TECH-002/004/011/012/018, KN-LIT-004,
      KN-LIT-006, KN-FIND-b7e091. External web searches as recorded in
      IDEA-20260807-1ea327.
    results: >-
      No record in this repository contains a phase, relative-phase, or
      character-class STATISTIC of collected decompositions. KN-TECH-012 is the
      nearest concept and it proposes a PROJECTION (exact idempotents splitting
      a relation space), not a measurement of where naturally occurring
      solutions fall; its applicability-limits paragraph anticipates the
      analogue of OUTCOME U as the likely obstruction, which is corroborating
      context rather than a duplicate. The three-term grading
      S_3 = A_0 + A_1 + A_2 and the a = 0 biconditional appear nowhere. Grep (3)
      hit its 60-file head limit, so that number is a FLOOR; the files are the
      H-STR-002 / EXP-STR-00x cluster, none of which records a phase statistic.
    verdict: >-
      ADAPTATION. Testing whether solutions distribute uniformly across the
      classes of a group action is a standard statistical move and nothing about
      it is claimed as new. The specific object -- the relative phase of an
      arity-2 Semaev decomposition over a mu_3-stable base on a j = 0
      prime-field curve, with the diagonal case separated on the algebraic
      grounds in STEP 5 -- is absent from this repository. No external novelty
      is claimed; full reads of KN-LIT-004 and FHJRV are Stage-0 obligations.

  null_object_control: >-
    MANDATORY AND BLOCKING. TWO NULLS PLUS A DECAY PARAMETER.
    NULL-1, THE SYNTHETIC-PHASE NULL. Take a uniformly drawn factor base of the
    SAME cardinality 3m on the SAME curve, partition it arbitrarily into m
    triples, and assign fake "phases" 0, 1, 2 within each triple. Collect
    decompositions and compute the fake d exactly as in STEP 2. This
    distribution MUST be uniform -- there is no group action producing it -- so
    a non-uniform reading here is an instrument defect (most likely in the
    representative rule or in the search's enumeration order, which visits
    factor-base indices in a fixed sequence and can correlate with the triple
    labelling). This null is what makes OUTCOME B believable if it fires.
    NULL-2, THE a != 0 CURVE. On a curve with a != 0 there is no mu_3-action, so
    x -> zeta x maps the base off the curve and the statistic is undefined; the
    corresponding control is the synthetic-phase null above, run at matched p
    and N on a generic curve, to confirm the enumeration order contributes
    nothing.
    DECAY PARAMETER: epsilon, the fraction of orbits broken at fixed cardinality
    3m (per IDEA-20260807-b42544). Any measured bias in d must decay
    monotonically toward the NULL-1 uniform value as epsilon goes
    0 -> 1/3 -> 2/3 -> 1, because at epsilon = 1 there are no orbits and no
    phases. A bias flat in epsilon is the canonical artifact tell and the record
    must report it as an artifact.
    THIRD CONTROL, THE PLANTED BIAS: artificially delete from the base one
    member of each orbit at a fixed phase; the measured d-distribution must
    shift in the predicted direction. An instrument that cannot see a planted
    bias cannot be trusted to report its absence.

  assumptions:
    - >-
      p = 1 mod 3, a = 0, zeta_3 exists and is verified (zeta_3 != 1,
      zeta_3^3 = 1) per instance.
    - >-
      The canonical representative rule of STEP 1 is applied and frozen before
      any collection. Without it d is a property of the labelling, not of the
      curve, and the entire measurement is void.
    - >-
      x = 0 is excluded from every factor base (degenerate orbit of size 1, no
      well-defined phase).
    - >-
      At least 300 certified relations per instance are collectable within
      budget, which at arity 2 with success probability about (3m)^2/2N requires
      about 300 * 2N / (9 m^2) target evaluations. This is checked as a
      feasibility precondition BEFORE the experiment is dispatched, and a cell
      that cannot reach 300 is reported without a verdict rather than with an
      underpowered one.
    - >-
      Toy scale only: p up to about 24 bits, pure Python.

  proof_search_map:
    bottleneck: >-
      Not applicable in the proof sense: this record proposes a measurement, not
      a theorem. The one algebraic statement it asserts -- the three-term
      grading and its a = 0 biconditional -- is a finite symbolic identity
      checked in minutes, and it is listed as a falsification condition rather
      than as a proof obligation requiring a map.
    baseline_embedding:
      parameter_slice: >-
        epsilon = 1 (fully de-orbited base). There the phase does not exist, the
        statistic degenerates to the synthetic-phase null, and the measurement
        must return uniformity. This is the exact boundary at which the proposed
        family reduces to the incumbent (an ordinary random factor base).
      reproduction_check: >-
        Frozen fixture: at epsilon = 1 the collected relation multiset must
        agree, element for element, with the relation multiset the unmodified
        harness collects on the same random base with the same target stream.
        A mismatch means the instrumented collector changed the search, and no
        comparison across epsilon is valid.
    observation_collision:
      observable: >-
        The empirical distribution of d on Z/3.
      distinct_preimage_search: >-
        REQUIRED and expected to succeed: exhibit two collection runs with the
        same d-distribution, one from a genuine mu_3-stable base and one from
        the synthetic-phase null. Such a collision is the pre-registered
        OUTCOME U and it BOUNDS the conclusion to "phase carries no information"
        rather than falsifying the instrument. The collision that WOULD falsify
        identifiability is the opposite one -- a biased synthetic null -- and
        finding it halts the line.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the d-distribution) fixed and vary the forgotten
          structure: real orbits versus synthetic triples. The intrinsic
          invariant distinguishing them is the weight-1 semi-invariance of S_3,
          which is symbolic and free to check.
        predicted_gain: >-
          Separates "phase is a property of the curve" from "phase is a property
          of the labelling", which is the only thing that makes OUTCOME B
          reportable.
      - transform: stronger_invariant
        proposed_object: >-
          The full joint distribution of (d, orbit-pair type, diagonal flag)
          rather than the marginal on d, since the diagonal case is
          algebraically distinguished by the vanishing of A_2 at d = 0.
        predicted_gain: >-
          More resolution, and specifically the ability to attribute any pooled
          bias to the diagonal (an expected artifact) or to the off-diagonal (a
          finding).
    quantifier_order: >-
      Intended: FOR ALL j = 0 curves in the declared toy family, FOR ALL
      phi-stable bases in the declared family, FOR ALL target streams, the
      OFF-DIAGONAL relative-phase distribution equals uniform on Z/3 up to
      sampling error. The negation that would be a finding is: THERE EXISTS a
      curve family and a base family for which it does not. Note the direction:
      the pre-registered expectation is the universally quantified NULL, so a
      single well-controlled counterexample suffices to overturn it, and this
      record must not be read as claiming that a bias, if found on one instance,
      holds universally.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On these toy j = 0 curves, at arity 2, with this factor-base family and
        this search, the off-diagonal relative phase of collected decompositions
        is uniform on Z/3 to within the stated power" -- or its negation with a
        measured effect size. It can NEVER certify anything about arity above 2,
        about a != 0 curves, about crypto scale, or about the ECDLP, and a
        measured bias would yield at most a constant-factor search reordering
        bounded above by 3.
      nearby_object_control: >-
        The synthetic-phase null on a generic curve: the closest object where
        the desired conclusion (a curve-driven phase structure) must fail. A
        method that reports the same bias there has not identified the
        load-bearing structure.
    proof_obligations:
      - claim: S_3 at a = 0 splits into exactly three phase-graded pieces.
        responsibility: correctness
      - claim: d is invariant under the diagonal mu_3-action on a relation.
        responsibility: correctness
      - claim: the canonical representative rule makes d well defined.
        responsibility: interface
      - claim: A_2 vanishes identically on the diagonal at d = 0.
        responsibility: correctness
      - claim: the synthetic-phase null is uniform.
        responsibility: baseline
      - claim: 300 relations per instance give power against a 10-point deviation.
        responsibility: success_probability

  predictions:
    - metric: >-
        off-diagonal relative-phase distribution of certified arity-2
        decompositions over a phi-stable base, chi-squared against uniform on
        Z/3
      direction: different
      minimum_effect: >-
        PRE-REGISTERED EXPECTATION IS UNIFORMITY: chi-squared p above 0.01 at
        every instance with at least 300 relations. OUTCOME B is declared only
        if p is below 0.01 at a MAJORITY of instances AND the maximum class
        probability exceeds 0.40 (a 7 percentage point excess over 1/3), so that
        a statistically significant but operationally useless deviation is not
        reported as a finding.
    - metric: >-
        diagonal (i = j) relative-phase distribution
      direction: different
      minimum_effect: >-
        Predicted NON-uniform, with d = 0 over-represented, because A_2 vanishes
        identically there. This prediction exists so that a pooled bias driven
        by the diagonal is recognised as the expected algebraic artifact rather
        than reported as the finding. No minimum effect is set; the counts are
        reported.
    - metric: >-
        synthetic-phase null distribution
      direction: different
      minimum_effect: >-
        Uniform, chi-squared p above 0.01. A significant deviation here is an
        instrument defect (enumeration-order correlation being the prime
        suspect) and blocks the whole line until repaired.
    - metric: >-
        S_3 evaluations per certified relation, phase-ordered search against
        naive search, both on the phi-stable base
      direction: lower
      minimum_effect: >-
        Under OUTCOME U, exactly 1.00 (no saving) -- and measuring 1.00 is the
        point. Under OUTCOME B, the predicted saving is
        1 / (3 * max_d Pr[d]), and the measured ratio must match that prediction
        within 10 percent or the bias is not being exploited by the mechanism
        claimed.
    - metric: epsilon-decay of any measured bias
      direction: lower
      minimum_effect: >-
        Monotone decay to the uniform null by epsilon = 1. Flatness means
        artifact and the bias may not be attributed to phi.

  minimal_test:
    design: >-
      CHEAPEST VALID DISCRIMINATOR, MINUTES: symbolically confirm the three-term
      grading and its failure at a != 0, and confirm A_2 vanishes identically on
      the diagonal at d = 0. Those are free and either could kill the framing.
      THEN, hours: on field_bits in {16, 20, 24} and seeds {1, 2, 3}, build a
      canonically labelled phi-stable base of cardinality 3m, collect at least
      300 certified arity-2 relations per instance with recorded phases, and run
      the chi-squared test on the off-diagonal marginal with the diagonal
      reported separately. Run the synthetic-phase null on a matched random base
      of the same cardinality, and the epsilon ladder at the largest affordable
      instance. Report raw counts.
    controls:
      - synthetic-phase null on a cardinality-matched random base (blocking)
      - synthetic-phase null on a generic (a != 0) curve at matched p
      - epsilon ladder {0, 1/3, 2/3, 1} at fixed cardinality
      - planted phase bias (one orbit member deleted at a fixed phase)
      - diagonal stratum reported separately from off-diagonal
      - independent certificate re-verification of every relation
      - >-
        canonical representative rule frozen and its relabelling recorded before
        collection
    required_metrics:
      - raw d-counts on Z/3, off-diagonal and diagonal, per instance
      - chi-squared statistic, degrees of freedom, p-value, sample size
      - per-(i,j)-orbit-pair d-counts for the stratification check
      - synthetic-null d-counts on the identical pipeline
      - epsilon ladder d-counts
      - S_3 evaluations per certified relation, naive and phase-ordered
      - sha256 of the canonically relabelled factor base per cell

  falsification_conditions:
    - >-
      The three-term grading does not hold at a = 0, or does hold at a != 0.
      Claim (A) is wrong and the record is superseded.
    - >-
      A_2 does not vanish identically on the diagonal at d = 0. The diagonal
      stratification loses its algebraic justification and STEP 5 must be
      redesigned.
    - >-
      The synthetic-phase null is non-uniform. Instrument defect; nothing is
      reported about the real base.
    - >-
      A measured bias does not decay across the epsilon ladder. The bias is an
      artifact and may not be attributed to phi.
    - >-
      Fewer than 300 certified relations are collectable in budget at every
      instance. The test is underpowered; the cells are reported without a
      verdict, and this is a BUDGET outcome under AGENTS.md rule 5, not evidence
      of uniformity.

  confounders:
    - >-
      REPRESENTATIVE CONVENTION. d shifts by a constant per orbit under a change
      of representative. The committed _build_phi_invariant_factor_base appends
      orbits in generation order, which is NOT canonical. Freezing the
      least-integer rule is a hard precondition; failing to freeze it turns the
      statistic into a report on the seed.
    - >-
      ENUMERATION ORDER. harness/semaev.py::_find_decomposition scans
      V x V[i:] in list order and RETURNS THE FIRST HIT. If the base is laid out
      as consecutive orbit triples (which _build_phi_invariant_factor_base does),
      the first hit is systematically biased toward low indices and hence toward
      particular phases. The fix is to enumerate ALL decompositions per target,
      not the first, or to randomise the scan order with a recorded seed. THIS
      IS THE MOST LIKELY SOURCE OF A SPURIOUS BIAS and the synthetic-phase null
      is calibrated to catch it.
    - >-
      DIAGONAL CONTAMINATION. The i = j stratum is algebraically biased; pooling
      it with the off-diagonal manufactures a finding.
    - >-
      MULTIPLICITY. Testing many instances and reporting the significant ones is
      p-hacking. The decision rule is fixed in advance: a MAJORITY of instances
      must be significant AND the effect size must exceed the stated threshold.
    - >-
      TARGET CORRELATION. Targets generated as consecutive multiples of P (as
      the committed _collect_relations does, with k a fixed arithmetic
      progression) are not independent. Targets must be drawn with independent
      random (a_t, b_t) and the change recorded.

  interpretation_limits:
    - >-
      NO EVIDENCE ABOUT H-STR-002 IS PRODUCED IN EITHER DIRECTION.
      DEFER-BATCH009-001 is untouched and remains open.
    - >-
      Toy tier, claim_tier toy, arity 2 only, j = 0 only. A measure-zero curve
      family, unreachable by isogeny walking from a class without D_0 = -3 (T4).
    - >-
      OUTCOME B's operational consequence is bounded above by a factor of 3 in
      S_3 evaluations -- a constant, on a step of an attack already
      uncompetitive with rho over prime fields. It is not an attack.
    - >-
      OUTCOME U is a controlled null and is the expected result. Recording it as
      "phi-stability does nothing here" is correct only with the scope
      qualifiers attached: this base family, this arity, this search, these
      curves.
    - >-
      The statistic's power collapses with arity: at arity m the class set is
      (Z/3)^m modulo the diagonal, of size 3^{m-1}, so the same sample gives
      3^{m-2} times fewer counts per class. Nothing here extends to arity 3
      without a new power calculation.

  reachability_gate: >-
    NOT APPLICABLE TO THE DESIGN, BINDING ON THE SCOPE. No curve movement: every
    arm fixes one curve. T5 does not bind. T4 does: the mu_3-action requires
    D_0 = -3, which is a property of the isogeny class and cannot be reached by
    walking from a class that lacks it. A measured phase bias would therefore
    apply only to curves already known to be CM by -3, which no standardized
    curve in this program's target set is.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES. Under OUTCOME U the search cost is unchanged; under
      OUTCOME B it falls by at most the constant factor 3 in S_3 evaluations.
      For context, the arity-2 prime-field relation-collection total is about
      2 c N / r, LINEAR in N (see IDEA-20260807-b42544 target_complexity), so a
      factor of 3 here is a factor of 3 on an exponent-1 method.
    memory_exponent: >-
      Unchanged: the statistic costs O(1) per relation to record and O(1) total
      state (three counters). The attack-side memory is the m x m relation
      matrix, untouched.
    best_known: >-
      Parallel rho with distinguished points, 0.886 sqrt(N) time and O(1) memory
      (KN-TECH-001, KN-TECH-006); automorphism-discounted rho on j = 0,
      0.886 sqrt(N)/sqrt(6) (KN-TECH-018); BSGS at sqrt(N) time and memory. For
      the collection step, the incumbent is the unordered exhaustive-pair search
      in harness/semaev.py.
    hidden_overhead: >-
      Under OUTCOME B, the claimed reordering saving is only realisable if the
      favoured phase class is known BEFORE the search, i.e. if the bias is a
      function of the curve and not of the target. If the favoured class varies
      per target, the saving is unrealisable and the finding is descriptive
      only. This is disclosed here and is a required column in the report.
    tradeoff_note: >-
      No time-memory tradeoff. Parallelization position unchanged: relation
      collection over distinct targets is embarrassingly parallel either way.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES. As an attack:
    mounts none, hence dominated by parallel rho with distinguished points
    (0.886 sqrt(N), O(1) memory) on both axes; by the automorphism-discounted
    rho on this exact family (0.886 sqrt(N)/sqrt(6), O(1) memory, KN-TECH-018);
    by BSGS (sqrt(N) time, sqrt(N) memory) on time; and by every row on
    data/queries, since even OUTCOME B leaves collection at O(N/r) attempts. The
    method it would improve, prime-field point-decomposition index calculus, is
    itself dominated by all of the above (KN-TECH-003, KN-LIT-006). As a
    MEASUREMENT there is no incumbent in this repository -- no record measures a
    phase statistic -- so it is dominated by nothing on that axis, which is a
    statement about corpus coverage and not about value.
  sota_delta: >-
    Zero speedup against any attack baseline. Under OUTCOME U the delta is
    exactly zero and the deliverable is the first null-controlled decomposition
    of the phi-stable factor-base effect in this repository into
    "factor 3 in unknowns, factor 1 in search, phase uniform". Under OUTCOME B
    the delta is a search-ordering factor of 1/(3 max_d Pr[d]), bounded above by
    3, on a step whose total cost is linear in N.

  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.90 that the three-term grading and the diagonal vanishing check out --
    they are hand-verified degree congruences. 0.80 that the synthetic-phase
    null comes out uniform once the enumeration-order confounder is fixed;
    0.20 that it does not on the first attempt, which is why it is a hard gate.
    0.20 that OUTCOME B fires on the off-diagonal stratum at the pre-registered
    thresholds -- the algebra in claim (E) shows there is no symmetry FORCING
    uniformity, but there is also no positive reason to expect a 7-point excess,
    and the honest reading of the prior literature is that solution counts on
    such curves track their degrees. Under 0.05 that a fired OUTCOME B would
    survive the epsilon decay test and the stratification.

