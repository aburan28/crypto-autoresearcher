idea:
  id: IDEA-20260814-a67a1d
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  added: '2026-08-14'
  proposed_by: idea-generator
  status: proposed
  class: composition

  title: >-
    Online relation-hypergraph core stopping: charge verified Semaev harvesting,
    peeling, residual sparse linear algebra, retries, and target descent together

  object: >-
    TRACKED OBJECT. For one frozen ordinary Semaev relation generator, track the
    growing coefficient matrix and its support hypergraph after every verified
    relation. Record row weights, column degrees, duplicate supports, peeling
    pivots, the residual 2-core, coefficient rank on that core, projected sparse-
    elimination fill, generation work, failed trials, and serialized bytes. The
    support hypergraph is used to decide when to stop relation harvesting, but
    coefficients are retained for the actual solve. This is an online stopping
    policy over a complete relation pipeline, not a new relation oracle, a claim
    that peeling alone solves factor logs, or an uncharged matrix statistic.

  lossy_projection_test: >-
    Mapping a verified coefficient row to its support edge is lossy: rows with
    the same support can have different coefficients, rank, and right-hand sides.
    Degree-one peeling propagates deterministically when the pivot coefficient is
    retained, whereas support-only 2-core size does not determine solvability or
    fill. Therefore every policy state keeps the full coefficients of unpeeled
    rows and evaluates rank and fill separately. If the policy predicts a cheap
    core from supports but the retained coefficient matrix is singular or dense,
    that prediction is counted as a failed attempt and all added harvesting and
    linear-algebra work is charged.

  claim: >-
    CONDITIONAL COMPOSITION TARGET, NOT A RESULT. For a fixed relation generator
    and factor-base scale B=N^beta, an online stopping rule may reduce complete
    expected work by stopping when the marginal cost of another verified relation
    exceeds its forecast reduction in peeling plus residual sparse-linear-algebra
    cost. The minimal test asks only whether one frozen rule reaches total charged
    toy cost at most 0.85 times the best preregistered fixed-overcollection rule
    on held-out streams while preserving solve and descent success. No exponent
    improvement, ECDLP algorithm, relation abundance, or asymptotic transfer is
    claimed. A support-only gain that disappears after coefficient rank, retries,
    and target descent are included falsifies the composition.

  mechanism: >-
    Verified ordinary Semaev relations arrive as a stream. After each batch, an
    incremental reducer peels degree-one variables, updates the residual 2-core,
    estimates sparse-elimination fill from the retained coefficient matrix, and
    predicts remaining collection plus solve work. A target-independent rule
    stops at the first robust minimum of generation cost already paid plus
    forecast core solve, retry, back-substitution, and descent cost. It then solves
    the core, reverses the peel certificates, and performs a masked target descent.
    The proposed gain is scheduling: adapt the number of expensive verified
    relations to the observed core rather than selecting a universal row surplus.
    Relation generation itself is unchanged and its misses are fully charged.

  novelty_status: unverified
  novelty_note: >-
    COMPLETE REPOSITORY SCREEN. All 79 current RQ-ECDLP-002 proposals, all 795
    proposal files, and the 1,166-file legacy ideas tree were screened. The
    nearest records are IDEA-20260807-d20846, which measures fold-before-peel
    pivots and residual core dimension for symmetry-closed matrices;
    IDEA-20260805-061f97, which studies a left-kernel threshold for sparse
    relation matrices; IDEA-20260807-291968, which measures relation-matrix rank
    profiles and sparse solve cost; IDEA-20260731-012, which combines large-prime
    near misses in a graph; and rejected ECDLP-IDEA-200, which invokes hypergraph
    containers without an edge oracle. The delta is not another peeling law: it
    is a frozen online decision rule coupled to the actual ordinary-Semaev
    relation stream and scored by end-to-end harvest plus peel plus coefficient
    solve plus retry plus descent cost. This may still be dominated by an offline
    tuned row count, so novelty and value remain unverified.

  primary_sources_checked:
    - >-
      Igor Semaev, Summation polynomials and the discrete logarithm problem on
      elliptic curves, IACR ePrint 2004/031,
      https://eprint.iacr.org/2004/031.pdf. This supplies the relation equation,
      not the proposed stopping rule.
    - >-
      Amadori, Pintore, and Sala, On the discrete logarithm problem for prime-field
      elliptic curves, IACR ePrint 2017/609,
      https://eprint.iacr.org/2017/609.pdf. This supplies the prime-field
      factor-base, relation-collection, linear-algebra, and descent pipeline whose
      costs must be composed.
    - >-
      Mathew D. Penrose, Rank deficiency in sparse random GF(2) matrices,
      Electronic Journal of Probability 19 (2014), DOI
      https://doi.org/10.1214/EJP.v19-2458. This supplies a rigorous random sparse-
      matrix and 2-core comparison model, not a model of Semaev relation streams.

  assumptions:
    - >-
      E/F_p is public, G=<P> has prime order N asymptotic to p, and all targets are
      generated public toy or certificate-bearing instances.
    - >-
      The factor base, arity, signed-source convention, relation sampler, batch
      size, stopping features, calibration split, sparse solver, and descent rule
      are frozen before held-out streams are generated.
    - >-
      Only independently verified elliptic point-sum relations enter the matrix;
      generator failures, duplicate relations, and rejected roots remain charged.
    - >-
      The random-support law is a same-shape null, not a theorem about real Semaev
      supports; departures are measured rather than assumed away.
    - >-
      Any cryptographic extrapolation requires a separately justified scaling law
      for relation probability, core size, coefficient rank, fill, and descent.

  proof_search_map:
    bottleneck: >-
      Prove or falsify that support-core evolution carries enough target-
      independent information to select a lower-cost stopping point after all
      coefficient, retry, and descent costs are included.
    baseline_embedding:
      parameter_slice: >-
        A constant stopping threshold recovers the standard collect-a-fixed-row-
        surplus then solve pipeline. Disabling peeling recovers direct sparse
        elimination. Replacing real supports by matched random supports recovers
        the null core model.
      reproduction_check: >-
        Replay every complete toy relation stream at every prefix. The online
        reducer and a from-scratch reducer must agree exactly on peel certificate,
        core support, coefficient rank, final factor logs, and descent result.
    observation_collision:
      observable: >-
        The degree histogram, peel count, 2-core dimensions, and projected fill at
        a stream prefix.
      distinct_preimage_search: >-
        Search for prefixes with the same observable but different coefficient
        rank or future optimal stopping point. Report their regret distribution.
        A large collision fiber proves that the policy state is insufficient even
        when its average forecast is calibrated.
    constructive_transforms:
      - transform: online_cost_composition
        proposed_object: >-
          Convert each verified relation prefix into a certified complete-cost
          curve rather than a rank-only or core-only statistic.
        predicted_gain: >-
          Stop before relation overcollection when the retained core is already
          cheap enough to solve.
      - transform: core_certificate
        proposed_object: >-
          Store peel pivots, retained coefficients, and reverse-substitution edges
          as a replayable solve certificate.
        predicted_gain: >-
          Prevent support shrinkage from being misread as factor-log recovery.
    quantifier_order: >-
      THERE EXISTS one target-independent stopping rule trained on declared
      calibration curves such that FOR ALL held-out parameter cells and RANDOM
      relation streams from the frozen generator, its expected complete cost is
      below the preregistered fixed-threshold baseline. No threshold may be chosen
      after reading held-out cost curves.
    method_ceiling:
      strongest_certifiable_claim: >-
        The proposed test can certify only a held-out toy scheduling advantage for
        one frozen relation generator. It cannot certify a new relation law, an
        exponent improvement, or an ECDLP speedup.
      nearby_object_control: >-
        Random coefficient matrices whose row count, support-size distribution,
        column-degree histogram, duplicate rate, coefficient alphabet, and batch
        timing match the real stream. A policy gain shared with this null is a
        generic sparse-matrix scheduling effect.
    proof_obligations:
      - claim: Every input row is a verified elliptic relation.
        responsibility: correctness
      - claim: Incremental and from-scratch reductions agree at every prefix.
        responsibility: baseline
      - claim: Core solve and reverse peeling recover the same factor logs.
        responsibility: correctness
      - claim: The stopping state predicts held-out complete-cost minima.
        responsibility: heuristic
      - claim: Per-relation work, failures, LA, retries, and descent are all charged.
        responsibility: runtime
      - claim: Retained rows, fill, certificates, and outputs fit the memory cap.
        responsibility: memory
      - claim: Real-stream behavior is separated from the same-shape null.
        responsibility: strictness
    not_applicable_reason: null

  predictions:
    - metric: held-out complete-cost ratio versus best preregistered fixed threshold
      direction: lower
      minimum_effect: >-
        At most 0.85 in median and at most 1.00 at the 90th percentile over each
        of three increasing sizes; post-hoc threshold selection is forbidden.
    - metric: exact incremental-reducer agreement with prefix replay
      direction: higher
      minimum_effect: >-
        1.000000 for peel set, core support, coefficient rank, and recovered logs.
    - metric: factor-log solve plus masked-descent success rate
      direction: nondecreasing
      minimum_effect: >-
        No more than 0.02 absolute loss relative to the fixed-threshold baseline,
        with all failed descents converted into charged retries.
    - metric: core-law separation from the matched random-support null
      direction: different
      minimum_effect: >-
        At least 0.10 total-variation distance in the joint normalized core-size
        and fill distribution, or else report the scheduling effect as generic.
    - metric: regret under observation collisions
      direction: lower
      minimum_effect: >-
        Median regret at most 0.05 of complete fixed-baseline cost; larger regret
        rejects the declared policy state.

  minimal_test:
    scope: >-
      Public toy prime-order subgroups of 12, 14, 16, 18, 20, and 22 bits; m in
      {3,4}; at least 50 independent relation streams per completed cell. Generate
      ordinary verified Semaev relations until every preregistered stopping rule
      can solve or reaches a fixed cap. Replay every prefix offline to obtain the
      oracle complete-cost curve, then score the frozen online rule only on held-
      out curves. Run factor-log solve, reverse peel, and masked target descent,
      and verify every recovered logarithm by scalar multiplication.
    metrics:
      - verified trials and accepted relations per prefix
      - duplicate-support and duplicate-row rates
      - peel pivots, core rows, core columns, coefficient rank, and fill
      - generation, peeling, sparse-LA, back-substitution, descent, and retry work
      - peak bytes and serialized certificate bytes
      - online stopping regret and complete-cost ratio
    controls:
      - >-
        Same-shape random sparse matrices matched on row weights, column-degree
        histogram, duplicate rate, coefficient alphabet, and row arrival times.
      - >-
        Fixed row-surplus thresholds chosen on calibration sizes only, including
        the exact thresholds used by IDEA-20260807-291968 where applicable.
      - >-
        Rank-only and support-core-only stopping ablations to expose omitted costs.
      - >-
        Row-order permutations of the same verified relation multiset to measure
        sensitivity to arrival order without changing information.
      - >-
        Positive-control planted sparse matrices with a known peelable fringe and
        full-rank core.
    decay_control: >-
      Progressively replace 0%, 25%, 50%, 75%, and 100% of real supports by
      degree-matched random supports while retaining coefficient alphabets. Any
      claimed elliptic-stream advantage must decay monotonically toward the full
      null; failure to decay labels it a generic scheduling or implementation
      artifact.
    budget: >-
      At most 300,000 verified relations, 50 GB serialized artifacts, 24 CPU-
      hours, and 16 GB peak RAM. Stop a cell after 20 failed collection caps or
      after the confidence interval cannot meet the 0.85 effect threshold.
    certificate: >-
      For every solved target, retain the accepted point-sum rows, matrix hash,
      peel sequence with pivot coefficients, residual solve transcript, factor-
      log checks, masked-descent relation, and final [k]P=Q verification.

  falsification_conditions:
    - >-
      Incremental reduction disagrees with from-scratch prefix replay in any
      completed cell.
    - >-
      Held-out complete-cost ratio exceeds 1.00 at the median on two successive
      sizes or fails the 0.85 preregistered effect threshold on all three largest
      completed sizes.
    - >-
      A support-predicted cheap core is coefficient-rank deficient often enough
      that retries erase the measured collection saving.
    - >-
      The apparent advantage exists only when relation-generation failures,
      residual fill, target descent, or emitted certificate bytes are omitted.
    - >-
      Real-stream separation does not decay toward the matched null under support
      replacement.

  confounders:
    - relation-generator batching or caching can make later rows appear cheaper
    - duplicate suppression can leak the final stream length into the policy
    - solver ordering can dominate hypergraph structure
    - small-field factor-base boundaries can distort column degrees
    - a calibration threshold selected after seeing held-out streams is leakage
    - successful factor-log solves need not imply cheap target descent

  interpretation_limits:
    - >-
      This proposal supplies no new source of relations and no claim that ordinary
      Semaev relations occur at the random-model rate.
    - >-
      A lower toy constant does not change the N^{1/2} rho or BSGS benchmark and
      does not establish a cryptographic-size advantage.
    - >-
      Agreement with Penrose's random model would describe a null, not prove that
      the real coefficient matrix has the required rank.
    - >-
      The policy is target-independent; target-specific retraining or an uncharged
      target relation table is outside the claim.

  heuristic_assumptions:
    - id: H-CORE-1
      statement: >-
        After normalization by B, the joint support-degree and 2-core process of
        frozen-generator relation streams has a stable distribution across nearby
        toy sizes.
      random_model_justification: >-
        Sparse random hypergraph core laws provide the baseline shape, while
        Penrose gives a rigorous matrix/core comparison in a related GF(2) model;
        neither theorem is transferred to Semaev rows.
      validation_route: >-
        Compare empirical joint CDFs, tails, and total-variation distance across
        adjacent sizes and against degree-matched nulls; reject extrapolation if
        the largest two cells drift by more than 0.10.
      falsification_condition: >-
        Normalized core or degree distributions show persistent nonconvergence or
        strong generator-seed dependence.
    - id: H-CORE-2
      statement: >-
        The frozen state variables predict remaining sparse-LA and retry cost well
        enough to locate a near-minimum complete-cost prefix.
      random_model_justification: >-
        In matched sparse matrices, core dimensions and degree profiles constrain
        elimination work, but coefficient collisions create residual variance.
      validation_route: >-
        Fit only on calibration sizes; report held-out calibration error, collision
        regret, and tail coverage on real and null streams.
      falsification_condition: >-
        Median regret exceeds 0.05 or 90% prediction intervals cover fewer than
        80% of held-out complete costs.
    - id: H-CORE-3
      statement: >-
        Masked target descent has a retry distribution controlled by the same
        frozen relation generator and therefore can be charged from held-out data.
      random_model_justification: >-
        Independent target masks motivate a geometric-attempt baseline, but the
        empirical tail is authoritative for this test.
      validation_route: >-
        Use disjoint masks and targets, report survival curves and censored caps,
        and compare geometric and empirical retry totals.
      falsification_condition: >-
        Retry tails are seed- or target-dependent, nonstationary, or too heavy for
        the declared expectation to be finite within the cap.

  target_complexity:
    time: >-
      No new ECDLP exponent is claimed. A future conditional bound would be
      C_gen(R)+C_peel(R)+C_coreLA(R)+C_backsub(R)+C_descent multiplied by complete
      retry cost, and every term would have to be N^{1/2-epsilon+o(1)}. The present
      target is only a <=0.85 held-out toy ratio against a fixed-threshold version
      of the same pipeline.
    memory: >-
      Peak retained verified rows, core coefficients, solver fill, peel
      certificates, and descent state must all be charged. No future below-rho
      claim is admissible unless peak memory is N^{1/2-epsilon+o(1)} and emitted
      relation/certificate bytes obey the same accounting.
    rho_baseline: >-
      Pollard rho uses expected N^{1/2+o(1)} group operations and O(1) stored group
      elements for one generic target. It dominates this proposal until a complete
      target-dependent decoder beats that time without hidden tables.
    bsgs_baseline: >-
      BSGS uses N^{1/2+o(1)} time and N^{1/2+o(1)} memory. A matrix scheduling
      constant does not beat that frontier.

  complete_cost_boundary:
    preprocessing: >-
      Curve and factor-base construction, polynomial setup, sampler calibration,
      stopping-rule training, sparse-solver ordering, and all target-independent
      relation tables; report wall time, operations, and bytes separately.
    advice: >-
      Model coefficients, thresholds, feature definitions, solver orderings, and
      cached relation prefixes. Any target-specific entry invalidates reusable-
      setup accounting and moves into online cost.
    per_attempt: >-
      Every factor-base trial, polynomial solve, root enumeration, point-sum
      verification, deduplication, reducer update, core forecast, sparse solve,
      reverse peel, descent trial, and final verification.
    success_probability_and_retries: >-
      Report collection-cap, coefficient-rank, factor-log, and descent success
      separately. Expected cost is the sum of work over the empirical retry tree,
      including censored failures; it is not cost of one successful transcript.
    data_and_output: >-
      Store accepted rows, rejected-trial counts, coefficients, core matrices,
      fill, peel transcripts, factor logs, descent certificates, and all emitted
      source indices. Outputting R rows costs Omega(R).
    multi_target_amortization: >-
      Divide target-independent factor-log preprocessing by T only for a declared
      number T of targets on the identical curve and factor base. Charge each
      target's masked descent and retries online and report the break-even T.

  dominated_by:
    - method: Pollard rho
      reason: >-
        It already solves a single generic target in N^{1/2+o(1)} time with
        constant group-element memory and needs no relation matrix.
    - method: baby-step giant-step
      reason: >-
        It gives a deterministic square-root frontier without unproved relation,
        core, rank, or descent distributions.
    - method: best offline fixed stopping threshold
      reason: >-
        If held-out regret or policy overhead erases the 0.85 effect, the simpler
        fixed policy dominates this composition on time, memory, and data.

  sota_delta: >-
    Quantitative target: complete held-out cost <=0.85 times the best
    preregistered fixed-overcollection policy with solve/descent success loss
    <=0.02 and peak memory no larger. Delta versus rho and BSGS: 0 exponent bits;
    the proposal remains dominated until a separately reviewed complete relation
    algorithm establishes a time exponent strictly below 1/2 with all costs.

  estimated_cost: medium
  compute_budget_note: >-
    The proposed run is toy and certificate-bearing. It executes no live-key work,
    does not test deployed systems, and should prefer deterministic generated
    curves and public benchmark instances.
  recommended_priority: high
