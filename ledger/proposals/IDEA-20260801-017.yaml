idea:
  id: IDEA-20260801-017
  question_id: RQ-SDITH-001
  title: >-
    d-split syndrome decoding hardness probe: measured cost of d-split
    decoding versus the plain-SD baseline at toy parameters
  class: control
  claim: >-
    SDitH's d-split syndrome decoding inherits its hardness from plain
    syndrome decoding; a controlled toy experiment measuring the cost of the
    best-known decoding algorithm on d-split instances versus matched
    plain-SD instances either confirms the inheritance (equal cost within
    tolerance) or shows that the d-split structure changes the problem
    class. This decides whether the inherited hardness claim is sound.
  mechanism: >-
    The d-split construction splits the syndrome-decoding instance into d
    shares; if the split is information-theoretically neutral (a random
    instance maps to a random d-split instance), hardness inherits; if the
    split creates correlation, a cheaper attack may exist. The toy
    comparison runs the best-known SD solver on both instance types with
    matched parameters and measures the cost ratio.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/literature
      - ledger/proposals
    grep_results:
      - No existing proposal runs a matched d-split-vs-plain-SD toy control
        in this program.
    conclusion: >-
      Control experiment; novelty unverified against full literature, which
      is the point of the control.
  assumptions:
    - Toy parameters permit matched d-split and plain-SD instances.
    - The best-known SD solver at toy sizes is implementable on both.
  predictions:
    - metric: d_split_vs_plain_sd_decoding_cost_ratio
      direction: different
      minimum_effect: >-
        A ratio outside [0.5, 2] at the largest toy size is a measurable
        d-split effect.
  minimal_test:
    design: >-
      Build matched toy d-split and plain-SD instances (same code length,
      dimension, and error weight); run the best-known decoding algorithm on
      both; measure time, memory, and success; report the ratio over
      multiple instances.
    controls:
      - Same solver on both instance types.
      - Matched code parameters.
      - Random instance families.
    required_metrics:
      - decoding cost per instance type
      - success probability per instance type
      - ratio and variance
  falsification_conditions:
    - Ratio ~1 at all toy sizes (hardness inherits; d-split is neutral).
    - Ratio < 1 (d-split structure cheaper to decode; inheritance claim
      fails).
  confounders:
    - Toy sizes where all SD instances solve trivially.
    - Split-construction implementation differences.
  interpretation_limits:
    - Toy control only; no crypto-scale claim about SDitH's parameters.
    - Neutrality at toy scale does not prove crypto-scale neutrality.
  heuristic_assumptions:
    - id: HEUR-SDITH-SPLIT-1
      statement: >-
        The relative decoding cost of d-split vs plain-SD instances at toy
        sizes is directionally representative of larger sizes.
      rigorous_support: None; heuristic, tested by the toy-size trend.
      validation_plan: Run the control at 2-3 toy sizes and check the ratio
        trend.
  target_complexity:
    time_exponent: n/a (control)
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: null
  sota_delta: >-
    No attack claimed. Deliverable is a measured d-split-vs-plain-SD cost
    ratio that decides whether the inherited-hardness claim is sound.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
