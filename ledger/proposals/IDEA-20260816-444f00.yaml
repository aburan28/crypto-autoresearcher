idea:
  id: IDEA-20260816-444f00
  question_id: RQ-ARGON-141710
  added: '2026-08-16'
  title: Write the area-time cost model down as an explicit function with named parameters and find,
    symbolically and with zero compute, the surface on which its ranking of the honest evaluator against
    a memory-reducing strategy flips -- because a model whose verdict is unstable in a parameter nobody
    measured is not a cost model but a convention.
  class: theory
  claim: '(A) Memory-hardness is the case where a security claim is literally a cost claim, and the
    cost is computed by a model. That model has parameters: the price of a unit of memory relative
    to a unit of computation, the depth or latency charge, the amortization horizon over which fixed
    costs are spread, and the granularity at which memory is charged. Every proposal under this question
    either implicitly fixes those parameters or, in the case of IDEA-20260809-bf5139, proposes replacing
    them with hardware-derived ones. Neither move asks the prior question. (B) The claim is that the
    prior question -- which of the model''s parameters is load-bearing for its VERDICT rather than
    for its value -- is answerable symbolically, with no compute at all, by writing the honest evaluator''s
    cost and a parameterized memory-reducing strategy''s cost as two explicit functions of (t, m,
    p) and the model parameters, and solving for the surface where they are equal. The deliverable
    is that surface, expressed as an inequality among named parameters, together with a ranking of
    the parameters by how far each must move from its conventional value to flip the verdict. (C)
    It is claimed that at least one model parameter will turn out to require only a small excursion
    from its conventional value to flip the ranking, and that this parameter is one no experiment
    in this lane measures or plans to measure -- which would mean the lane''s planned measurements
    are precise about a quantity whose verdict is set elsewhere. (D) WHAT IS NOT CLAIMED: no claim
    that any specific strategy beats the honest evaluator at any parameters, because no strategy is
    implemented, run, or costed against real hardware -- the strategy enters only as a parameterized
    family with a declared recomputation exponent, and every statement is conditional on that family.
    No claim that the AT model is wrong; a model with an unstable verdict may still be the right model,
    and the record says so explicitly. No attack, no speedup, no security consequence, no parameter
    recommendation. This is an audit of an accounting convention''s identifiability, and its honest
    output may be that the verdict is stable, which would be a strong and reusable result in the model''s
    favour. (E) The named way the model flatters the defender: fixing the memory-to-computation price
    ratio at a conventional value chosen when memory was the scarce resource credits the defender
    with an exchange rate that a bandwidth-bound or a fabrication-cost-bound adversary does not face,
    and that ratio is the first parameter the analysis varies.'
  mechanism: 'STAGE 1: write the honest evaluator''s cost in the AT model as C_honest = c_mem * m
    * T + c_comp * t * m, with T the sequential depth and every symbol named and dimensioned. STAGE
    2: write a parameterized memory-reducing strategy''s cost as C_strat(f) = c_mem * (m/f) * T *
    g(f) + c_comp * t * m * h(f), where f is the memory-reduction factor, g captures any duration
    increase, and h(f) is the recomputation blowup with a declared exponent. Crucially, g and h are
    left as declared families rather than measured, and every downstream statement is explicitly conditional
    on the family. STAGE 3: solve C_strat(f) = C_honest for the ranking-flip surface, symbolically,
    in the named parameters. STAGE 4: for each parameter, compute the excursion factor -- how far
    it must move from its conventional value, holding the others fixed, to cross the surface -- and
    rank the parameters by that factor. STAGE 5: run the section 8 audit-three quantifier-order check
    explicitly: the claim that a model ranks the honest evaluator above every strategy has the form
    for-all-f, and the claim that some strategy wins has the form exists-f; a surface computed at
    fixed f answers neither unless f is optimized, so the analysis optimizes over f and states the
    quantifier order in the record. STAGE 6: run the section 8 audit-four nearby-object check: apply
    the identical symbolic analysis to a design with no memory hardness at all, where the ranking
    must be stable trivially, and to a design with maximal depth, confirming the analysis distinguishes
    them. STAGE 7: state the method ceiling -- what this symbolic analysis could conclude under ideal
    parameter knowledge, which is a conditional ranking and never an attack.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril for area-time, AT product, cost model, sensitivity analysis, ranking flip across
      ledger/proposals/ and ledger/hypotheses/; grep -l RQ-ARGON-141710 ledger/proposals/*.yaml and
      read all ten titles and classes, with IDEA-20260809-bf5139 and IDEA-20260809-c059a7 read closely
      as the two cost-model records; read docs/inventor-protocol.md section 8 audits three and four
      in full, since this record makes a symbolic claim and the proof-architecture gate applies; check
      the anti-duplication blacklist against audits of THIS PROGRAM's own cost model.
    results: 'IDEA-20260809-bf5139, class representation, under this question, proposes pricing memory
      the way an attacker does with an explicit hardware cost rather than an abstract area-time product.
      IDEA-20260809-c059a7, class composition, proposes measuring defender-cost-per-login against
      attacker-cost-per-guess across the parameter space. Those are the two nearest and both BUILD
      a cost model or a composite ratio; neither asks which parameter of the existing model determines
      its verdict. The term ranking flip hits IDEA-20260815-e059e9, IDEA-20260805-cdc87d, H-SSI-001
      and H-MLKEM-b1300f, all under other questions and concerning estimator or model rankings in
      lattice and isogeny contexts, sharing no object with the AT accounting. The term sensitivity
      analysis hits many records across many questions, none under RQ-ARGON-141710. The blacklist
      prohibition on auditing THIS PROGRAM''s own cost model is checked and does not apply: the model
      audited here is Argon2''s security accounting, not the harness''s.'
    verdict: 'UNVERIFIED. Nothing is asserted about what the external memory-hard-function literature
      contains regarding AT-model parameter sensitivity, and the record explicitly declines to guess.
      What is claimed new within this repository is the symbolic ranking-flip surface for the AT model
      in named parameters, with parameters ranked by excursion factor, and with the quantifier-order
      and nearby-object audits from inventor-protocol section 8 run explicitly because the claim is
      symbolic. Assembled from known parts: the cost functions are elementary, the flip-surface calculation
      is undergraduate algebra, and the parameterized-strategy family is a standard device. The contribution
      is asking which parameter carries the verdict before spending compute measuring a different
      one.'
  object_first_candidate:
    tracked_object: 'The verdict function itself: the sign of C_strat(f) - C_honest, followed as a
      function over the model''s parameter space, with its zero set as the object of study.'
    lossiness: 'The projection discards the magnitudes of both costs entirely and keeps only the sign
      of their difference. That is maximally lossy in the numeric sense and exactly right for the
      question, because the security claim is a ranking claim, not a cost claim -- nobody asserts
      that Argon2 costs a specific number of dollars, only that no strategy costs less. What survives
      is the sign, and it propagates deterministically under any monotone reparameterization of either
      cost, which is why the flip surface is a robust object and the costs themselves are not. Stating
      the genuine loss: the sign discards how close to the surface the conventional parameter values
      sit, so the record reports the excursion factor alongside the surface precisely to restore that
      information.'
    propagation: The operation whose action is followed is a perturbation of one model parameter,
      holding the others at conventional values. Each perturbation moves the point representing the
      current parameter setting through the space, and the verdict changes exactly when the point
      crosses the zero set. One step is therefore a single-coordinate line search to the surface,
      and the excursion factor is the length of that step measured multiplicatively from the conventional
      value. The propagation is exact and closed-form for the declared cost functions, which is what
      makes the whole record zero-compute.
    survival_score: 'The symbolic analysis survives as far as the cost functions remain the model.
      It dissolves precisely where g(f) and h(f) stop being declared families and would have to be
      measured, and that boundary is sharp and stated in advance: every conclusion is conditional
      on the declared recomputation exponent, and the record''s strongest possible output is a conditional
      ranking with the condition written in the same sentence. The concrete survival statement is
      the set of f values over which the optimization in stage 5 ranges, since outside that set the
      family is not claimed to describe anything.'
  null_object_control: 'The null object is a design with no memory hardness at all -- a cost function
    in which memory does not appear, such as an iterated-hash evaluator with constant memory. The
    IDENTICAL symbolic analysis is applied to it, in the same document and by the same algebra, and
    it must produce a degenerate flip surface: there is nothing to reduce, so no memory-reducing strategy
    exists and the ranking is stable under every parameter excursion. If the analysis reports a nontrivial
    flip surface for the null object, the algebra is wrong or the strategy family is under-constrained,
    and the whole record is invalid. A second control at the opposite extreme -- a maximal-depth design
    where any memory reduction forces proportional recomputation -- must produce a flip surface far
    from conventional values. For the Argon2 analysis to mean anything, both controls must behave,
    and both are executed in the same invocation, which for a zero-compute symbolic record means the
    same worksheet with the same symbols.'
  discriminated_from:
  - IDEA-20260809-bf5139 builds an AT model with explicit hardware costs. This record builds no model;
    it takes the conventional model as given and asks which of its existing parameters carries the
    verdict, which is the question that determines whether bf5139's harder work is worth doing and
    which parameter it should prioritize.
  - IDEA-20260809-c059a7 measures a defender-to-attacker cost ratio across parameter space, which
    requires implemented attacks and real measurements. This record requires neither and costs nothing
    to run.
  - IDEA-20260809-ac5947 implements the tradeoff attack and reports achieved reduction as a computation-memory
    pair. This record implements no strategy at all; the strategy enters as a declared parameterized
    family, and every conclusion is conditional on that family in a way ac5947's would not need to
    be.
  - Audits of THIS PROGRAM's own cost model, machine variance or timing under RQ-INSTR-f8faa0, which
    the batch blacklist excludes. The model audited here is Argon2's own security accounting; the
    harness is not the subject and does not appear.
  - Ranking-flip records under other questions such as IDEA-20260815-e059e9 and IDEA-20260805-cdc87d,
    which concern lattice and isogeny estimator rankings and share no cost function, no parameters
    and no object with the AT accounting.
  assumptions:
  - The AT model as summarized in KN-LIT-7f3c21's design rationale is fairly represented by C = c_mem
    * m * T + c_comp * t * m; any richer form is a different model and the record must say which it
    audited.
  - The parameterized strategy family with declared g and h captures the shape of memory-reducing
    strategies well enough that a flip surface computed over it is informative; this is the record's
    largest assumption and it is why every conclusion is conditional rather than absolute.
  - Conventional values for c_mem/c_comp, the amortization horizon and the charging granularity can
    be named and cited to a source, or else declared as conventions with no citation, which is acceptable
    provided the declaration is explicit.
  - Optimizing over f is the right quantifier order for a ranking claim, per section 8 audit three.
  - The two symbolic controls have the degenerate and extreme behaviours asserted, which is itself
    checked algebraically rather than assumed.
  predictions:
  - metric: excursion factor of the memory-to-computation price ratio c_mem/c_comp required to flip
      the ranking, at conventional values of the other parameters
    direction: lower
    minimum_effect: below a factor of 10, that is, a tenfold movement in the price ratio suffices
      to flip the verdict, which would make it the least stable parameter in the model
  - metric: excursion factor of the declared recomputation exponent in h(f) required to flip the ranking
    direction: lower
    minimum_effect: 'REFUSAL TO PRE-COMMIT: this exponent is the parameter the record is least entitled
      to guess at, since it is a property of strategies nobody here has implemented, and pre-committing
      a number would smuggle in the very assumption the audit exists to expose.'
  - metric: flip surface for the no-memory-hardness null object
    direction: different
    minimum_effect: degenerate, that is, empty; a forced value, and a nonempty surface invalidates
      the algebra
  - metric: rank position of the parameters this lane's planned experiments actually measure, in the
      excursion-factor ranking
    direction: higher
    minimum_effect: not first; the prediction is that the most verdict-sensitive parameter is one
      no planned experiment measures, and finding it first in the ranking would falsify the record's
      central claim and would be an encouraging result about the lane's priorities
  minimal_test:
    design: 'Zero compute. One worksheet, worked symbolically and checked by two independent derivations.
      Write C_honest and C_strat(f) with every symbol named and dimensioned. Solve C_strat(f) = C_honest
      for the flip surface, first at fixed f and then optimizing over f, and record both because the
      difference between them IS the quantifier-order audit. For each of the four named parameters,
      compute the multiplicative excursion from its conventional value to the surface, holding the
      others fixed, and rank them. Apply the identical algebra to the two controls: the no-memory-hardness
      design, whose surface must be empty, and the maximal-depth design, whose surface must lie far
      from conventional values. Report the surface as an explicit inequality, the ranking as a table,
      the two control outcomes, and the method ceiling -- the strongest statement this analysis could
      support under ideal parameter knowledge, which is a conditional ranking and never an attack.
      The only cost is careful algebra and a second independent derivation to catch errors; no code
      and no machine are required.'
    controls:
    - No-memory-hardness null design with a forced empty flip surface, worked in the same algebra.
    - Maximal-depth design with a flip surface required to lie far from conventional values, at the
      opposite extreme.
    - Two independent derivations of the flip surface by different routes, since a zero-compute record
      has no runtime check to catch an algebra error.
    - Dimensional analysis on every equation, which catches a large class of errors for free.
    - Both the fixed-f and the optimized-f surfaces reported, since their difference is the quantifier-order
      audit rather than a detail.
    required_metrics:
    - the flip surface as an explicit inequality in named parameters
    - excursion factor per parameter from its conventional value, as a table ranked by factor
    - the fixed-f versus optimized-f surface difference
    - control outcomes for both symbolic controls
    - the stated method ceiling and the declared strategy family with its exponent
  falsification_conditions:
  - No parameter has an excursion factor below 10, meaning the verdict is stable against every plausible
    parameter excursion, which falsifies the record's central claim and is a strong reusable result
    in the model's favour.
  - The no-memory-hardness null yields a nonempty flip surface, invalidating the algebra and halting
    the record.
  - The two independent derivations disagree, halting the record until reconciled.
  - The most verdict-sensitive parameter turns out to be one this lane already plans to measure, falsifying
    the claim that the lane is measuring the wrong thing.
  - The fixed-f and optimized-f surfaces coincide identically, which would mean the quantifier order
    does not matter here and the section 8 audit-three concern does not apply to this model -- a clean
    negative that should be recorded as such.
  confounders:
  - 'The declared strategy family is the whole analysis: a family that cannot express the strategies
    that matter produces a flip surface about nothing, and no amount of algebraic care fixes that.'
  - Conventional parameter values are conventions, and if they cannot be cited the excursion factors
    are measured from an arbitrary origin; the record must say which values were declared rather than
    sourced.
  - Additive cost models hide interaction terms; a model in which memory and computation costs multiply
    rather than add has a different surface, and auditing only the additive form is a stated scope
    restriction.
  - Optimizing over f without bounding f admits physically meaningless reductions; the optimization
    range must be declared and justified.
  - A zero-compute record has no runtime falsification, so every check is a human check, which is
    exactly the failure mode two independent derivations exist to address.
  interpretation_limits:
  - Every conclusion is conditional on the declared strategy family and its declared recomputation
    exponent, and none is asserted unconditionally.
  - No strategy is implemented, run, or costed, so no statement about achievable attacker cost is
    made or supported.
  - A model with an unstable verdict is not thereby a wrong model; instability is a statement about
    identifiability, not about correctness.
  - The audit covers the additive AT form only, and a multiplicative or hierarchical model is out
    of scope.
  - Nothing here bears on the safety, adequacy or preferability of any Argon2 parameter set.
  target_complexity:
    time_exponent: No attack exponent is claimed. No algorithm is proposed, so there is no running
      time to state; the record's own cost is a few hours of human algebra.
    memory_exponent: No attack exponent is claimed. The parameterized strategy family carries a symbolic
      memory-reduction factor f, which is a variable of the analysis and is emphatically not a claimed
      achievable memory exponent for any adversary.
    best_known: The incumbent is the conventional additive AT accounting as summarized in KN-LIT-7f3c21's
      design rationale, whose parameters are fixed by convention rather than by measurement. Inside
      this repository the nearest competing treatments are IDEA-20260809-bf5139's hardware-costed
      model and IDEA-20260809-c059a7's defender-to-attacker ratio, both unstarted. Nothing is asserted
      about external sensitivity analyses.
    hidden_overhead: 'The entire cost is human and it is easy to underestimate: a symbolic record
      with no runtime has no error detector except a second derivation, and the temptation to skip
      the second derivation is exactly why zero-compute records fail. Second, declaring conventional
      parameter values honestly -- as conventions where no source exists -- is uncomfortable and is
      the step most likely to be quietly skipped.'
  dominated_by: 'n/a (no result claimed). Pareto check performed rather than asserted: all ten proposals
    under RQ-ARGON-141710 were enumerated and read, EV-ARGON-209ece contains no measurement, and experiments/EXP-ARGON-2608c2/runs/
    is empty, so there is no row on any time, memory or data/query frontier under this question. This
    record additionally occupies no frontier by construction, since it produces no algorithm and no
    measurement -- it produces an inequality.'
  sota_delta: 'No attack; conceptual contribution only. Against the incumbent the delta is not a better
    number but a different kind of object: the incumbent produces a cost verdict at fixed conventional
    parameters, and this record produces the surface on which that verdict changes plus a ranking
    of the parameters by how close each sits to it. If the closest excursion factor exceeds 10 the
    delta is a stability certificate for the incumbent at zero compute cost, which is worth having.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'That the flip surface can be written down in closed form for the declared
    additive model and family: very high, around 0.95, since it is elementary algebra. That both symbolic
    controls behave as required: high, around 0.85, with the residual risk being an under-constrained
    strategy family rather than an algebra error. That some parameter has an excursion factor below
    10: moderate, around 0.6 -- price ratios move by orders of magnitude across hardware generations,
    but the additive model may be dominated by the memory term at the parameters of interest, in which
    case the verdict is stable and that is the answer. That the most sensitive parameter is one no
    planned experiment in this lane measures: around 0.55, and this is the part of the record most
    likely to change what the lane does next.'
