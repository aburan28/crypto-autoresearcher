idea:
  id: IDEA-20260826-2259f8
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-26'
  title: >-
    THE d_reg METER READ 2 FLAT AND HAD NO DYNAMIC RANGE (EV-REP-001/002): replace
    it with a FIRST-FALL-DEGREE and Hilbert-staircase meter on the m=3 Semaev
    ideal and ask whether special j (a=0 / b=0) or small |D_0| lowers the
    algebraic solving structure of the prime-field relation system BELOW a matched
    random curve at the SAME p and SAME N -- a representation-level test that is
    orthogonal to the sqrt(|Aut|) point-symmetry discount.
  class: representation

  claim: >-
    (A) THE INSTRUMENT GAP. The lane's model question was answered by a degree-of-
    regularity meter that reads d_reg = 2 flat in every arm at every factor-base
    degree (EV-REP-001, EV-REP-002; flagged in IDEA-20260807-1354d8), i.e. a meter
    with no dynamic range. The proposed object is the FIRST-FALL DEGREE d_ff and
    the HILBERT-SERIES STAIRCASE of the m=3 Semaev relation ideal I(E) under a
    fixed monomial order -- a projection of the full Groebner computation that
    retains exactly the degree at which non-trivial syzygies first appear and the
    shape of the leading-term staircase, discarding the actual basis. (B) THE
    DISCRIMINATION, AT MATCHED p AND MATCHED N. (H-null) setting a=0 (j=0) or b=0
    (j=1728), or shrinking |D_0|, leaves d_ff and the staircase IDENTICAL to a
    matched random curve -- the special j-invariant is a SUPPORT/coefficient
    relabelling that the solving structure does not see, so any relation-system
    advantage of special j is exactly the |Aut|/2 orbit collapse already priced by
    the automorphism discount and nothing algebraic beyond it; (H-crack) special j
    lowers d_ff or collapses a staircase step relative to the matched random null,
    which would be a genuine algebraic solving advantage NOT reducible to the
    point-symmetry discount. (C) NOT CLAIMED. Prime-field ECDLP has no known
    subexponential index calculus (Semaev summation over a prime field yields no
    small factor base), so even H-crack does not by itself move the exponent from
    1/2; it would be a structural finding, reported as a test to run under P3, not
    a speedup. H-null is the pre-registered expectation, consistent with the
    a=0/b=0 support-analysis prediction of IDEA-20260807-477e40, and is an
    archivable strengthening of it with an instrument that has dynamic range.

  mechanism: >-
    The m=3 Semaev summation polynomial S_4(x1,x2,x3,x_R) restricted to a factor
    base defines a polynomial system whose solving cost is governed not by the
    (dead) d_reg but by the first-fall degree d_ff -- the smallest degree at which
    a degree fall (a non-Macaulay syzygy) occurs -- and by the Hilbert staircase
    of the ideal, both of which have dynamic range across system shapes. Special
    j-invariants act on the DEFINING EQUATION: j=0 sets a=0 so S_4 loses its
    a-dependent terms, and j=1728 sets b=0 so it loses its b-dependent terms. This
    is a support and coefficient change, and the automorphism zeta acts on the
    variables as x -> zeta*x, a diagonal scaling that induces a GRADING of the
    ideal by zeta-weight. The automorphism discount lives entirely in that grading
    (it partitions solutions into orbits of size |Aut|/2) and is visible as a
    symmetry of the staircase, NOT as a lowering of d_ff. Therefore the object
    cleanly separates the two channels: the zeta-grading symmetry is the
    sqrt(|Aut|) discount and is factored out first; any RESIDUAL change in d_ff or
    in the staircase after quotienting by the zeta-grading is an algebraic effect
    of special j that the point-symmetry argument (H-ENDO-001, on the group action)
    does not reach, because it lives in the elimination ideal of the coordinate
    equations, not in the group law.

  novelty_status: unverified
  novelty_screen:
    method: >-
      Read IDEA-20260807-477e40 (symbolic support/degree at a=0/b=0),
      IDEA-20260807-d329e2 (Aut-quotient summation polynomial), IDEA-20260807-1354d8
      (the flat d_reg=2 meter), and the REP evidence pointers. grep ledger/proposals
      for "first-fall", "first fall", "solving degree", "Hilbert series",
      "degree of regularity", "d_reg", "staircase". External Groebner/first-fall
      sources (Bardet-Faugere-Salvy, Semaev, Petit-Quisquater) NOT opened; recalled.
    results: >-
      IDEA-20260807-477e40 asks SYMBOLICALLY whether a=0/b=0 is a degree/support/
      coefficient reduction and pre-registers "nothing after specialisation" at
      m=2; it does not build an empirical first-fall/staircase meter, does not
      sweep |D_0|, and does not run against a matched-random null. The d_reg meter
      (EV-REP-001/002) is recorded as flat with no dynamic range. No JINV-bound
      proposal measures d_ff or the Hilbert staircase after quotienting the
      zeta-grading.
    verdict: >-
      UNVERIFIED. Distinct observable (first-fall degree + staircase with dynamic
      range, replacing a dead d_reg meter), distinct construction (zeta-grading
      quotient separates the automorphism discount before measuring), distinct
      scope (empirical |D_0| sweep with a matched-random null). No novelty claimed
      against the external Groebner-complexity literature.

  citations:
    - ref: null
      provenance: recalled
      claim: >-
        Solving complexity of polynomial systems is governed by the first-fall /
        degree-of-regularity and the Hilbert series; first-fall has dynamic range
        where naive d_reg estimates saturate (Bardet-Faugere-Salvy; Semaev; Petit-
        Quisquater on ECDLP summation systems).
      verified_by: null
    - ref: IDEA-20260807-477e40
      provenance: recalled
      claim: whether a=0/b=0 in the Semaev system is a degree, support, or no reduction
      verified_by: null
    - ref: IDEA-20260807-1354d8
      provenance: recalled
      claim: the d_reg meter reads 2 flat with no dynamic range (EV-REP-001/002)
      verified_by: null

  nearest_existing_record: IDEA-20260807-477e40 (symbolic a=0/b=0 support/degree analysis)
  delta_from_nearest: >-
    OBSERVABLE: symbolic support/degree of S_4 at a=0/b=0 -> the EMPIRICAL
    first-fall degree d_ff and Hilbert staircase of the m=3 relation ideal, an
    instrument with dynamic range replacing the dead d_reg=2 meter. CONSTRUCTION:
    a raw specialisation -> a zeta-grading quotient that removes the automorphism
    discount before the measurement, so a residual effect is provably not the
    sqrt(|Aut|) constant. SCOPE: a single m=2 pre-registration -> an m=3 |D_0|
    sweep with a matched-random-curve null at matched p and N.

  assumptions:
    - Toy scale, p up to ~32 bits; m=3 Semaev system constructible and its Groebner behaviour computable.
    - N prime; the factor base and relation construction follow the committed harness, no solver beyond Groebner degree bookkeeping.
    - >-
      d_ff and the Hilbert staircase are computed under a FIXED monomial order and
      a fixed factor-base construction, frozen before any special-j curve is read.

  proof_search_map:
    bottleneck: >-
      Whether special j lowers the first-fall degree / collapses a staircase step
      after the zeta-grading (automorphism discount) is quotiented out. That
      residual is the single quantity separating an algebraic solving advantage
      from the point-symmetry constant.
    baseline_embedding:
      parameter_slice: >-
        A matched random curve (generic D_0, |Aut|=2) at the SAME p and SAME N:
        its d_ff and staircase are the null the special-j curve is measured
        against; the m=2 slice must reproduce the "nothing after specialisation"
        prediction of IDEA-20260807-477e40 as a regression check.
      reproduction_check: >-
        Frozen fixture: on a committed generic curve at a toy p, d_ff and the
        staircase match a recomputation from an independent Groebner
        implementation before any special-j curve is measured; and the m=2 case
        reproduces IDEA-20260807-477e40's symbolic prediction.
    observation_collision:
      observable: the first-fall degree d_ff and the Hilbert staircase of the m=3 relation ideal.
      distinct_preimage_search: >-
        A collision to separate: the zeta-grading symmetry produces a staircase
        with |Aut|/2-periodic structure IDENTICAL for the automorphism discount
        and for a genuine solving crack; the separating datum is d_ff AFTER
        quotienting the grading -- only a fall in the quotient is admissible as a
        special-j algebraic effect.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move to the zeta-graded quotient ring where the automorphism discount is
          an exact grading, so the hypothesis "special j lowers solving degree"
          becomes a vanishing/rank condition on the graded pieces with separate
          encoding, completeness, soundness and transfer obligations.
        predicted_gain: >-
          Turns a vague "is it easier" into an exact degree/rank comparison that
          cannot be confounded by the point-symmetry constant.
    quantifier_order: >-
      FOR EACH toy p and matched N, FOR the fixed monomial order and factor-base
      construction, EXISTS or does not exist a special-j curve whose graded-quotient
      first-fall degree is strictly below the matched-random null. NOT claimed: a
      fall at some monomial order for some construction (order-specific falls are
      instrument observations, not conclusions).
    method_ceiling:
      strongest_certifiable_claim: >-
        At toy N, in this monomial order and factor-base construction, the m=3
        Semaev graded-quotient first-fall degree of special-j curves does or does
        not fall below the matched-random null. It cannot certify a subexponential
        prime-field index calculus (none is known), an exponent move, or crypto-
        scale behaviour.
      nearby_object_control: >-
        A curve with a random j but the SAME zeta-grading imposed artificially
        (a non-CM diagonal scaling of the equation): it carries the symmetry but
        not the CM order, so a fall present here but absent on the true special-j
        curve would localise the effect in the grading, not the CM structure.
    proof_obligations:
      - claim: d_ff and staircase reproduce an independent Groebner implementation on the null.
        responsibility: baseline
      - claim: The zeta-grading quotient removes the automorphism discount exactly.
        responsibility: strictness
      - claim: The m=2 slice reproduces IDEA-20260807-477e40's symbolic prediction.
        responsibility: baseline
      - claim: No subexponential / exponent claim; prime-field ECDLP stays at 1/2.
        responsibility: scope

  predictions:
    - metric: graded-quotient first-fall degree d_ff, special-j crater minus matched-random null
      direction: lower
      minimum_effect: >-
        PRE-REGISTERED NULL EXPECTATION 0 (no fall). A fall of at least one degree
        surviving the artificial-grading control is the H-crack signature and
        triggers P3 and independent review before it is named.
    - metric: Hilbert-staircase step count after quotienting the zeta-grading, vs |D_0|
      direction: different
      minimum_effect: >-
        Flat in |D_0| under H-null. A monotone collapse of steps toward small
        |D_0| surviving the twist/artificial-grading controls is reported with an
        exact permutation distribution, never as a bare degree drop.
    - metric: m=2 slice specialisation effect
      direction: different
      minimum_effect: >-
        Reproduces "nothing after specialisation" (IDEA-20260807-477e40); a
        disagreement is an instrument-comparability failure that blocks m=3 reporting.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): construct S_4 and the zeta-grading; derive
      the m=2 specialisation and check it against IDEA-20260807-477e40. STAGE 1:
      build the m=3 relation ideal on a matched random curve at a toy p; compute
      d_ff and the staircase; reproduce them from an independent Groebner
      implementation. STAGE 2: measure d_ff and the graded-quotient staircase for a
      j=0 and a j=1728 crater at the SAME p and N as the random null, plus the
      artificial-grading control. STAGE 3: sweep |D_0| across the matched-order
      family and regress the graded-quotient first-fall degree on |D_0| with the
      twist control. THE CHEAPEST KILL is Stage 2 at one prime: if the graded-
      quotient d_ff of j=0 equals the null, H-crack is already unsupported there.
    controls:
      - matched random curve (generic D_0, |Aut|=2), same p, same N (blocking)
      - independent Groebner reimplementation agreeing on d_ff and the staircase (blocking)
      - artificial-grading nearby object (random j with imposed zeta-grading)
      - quadratic-twist control (same |D_0|, different instance)
      - m=2 slice regression against IDEA-20260807-477e40
    required_metrics:
      - first-fall degree d_ff (raw and graded-quotient), per curve
      - Hilbert-series staircase (raw and graded-quotient), per curve
      - d_ff difference crater-minus-null with permutation distribution
      - "|D_0| regression slope, twist-control agreement, artificial-grading-control result"

  falsification_conditions:
    - >-
      F1. d_ff / staircase on the null does not match the independent Groebner
      reimplementation. Instrument failure; no special-j comparison reported.
    - >-
      F2. The m=2 slice disagrees with IDEA-20260807-477e40's symbolic prediction.
      Instrument-comparability failure; m=3 reporting blocked.
    - >-
      F3 (MAIN NEGATIVE, A RESULT). The graded-quotient d_ff and staircase of
      special-j craters equal the matched-random null across the |D_0| sweep. The
      algebraic-solving channel of RQ-JINV-8fc13a is closed at toy N with the
      named obstruction that special j is a support/coefficient relabelling the
      solving structure does not see, strengthening IDEA-20260807-477e40 with a
      dynamic-range instrument.
    - >-
      F4 (P3). A graded-quotient first-fall fall surviving the controls. Work STOPS
      for independent review before any record states an algebraic advantage.

  confounders:
    - >-
      The zeta-grading symmetry, if not quotiented out, mimics a solving crack; the
      artificial-grading control is mandatory to attribute any fall to the CM
      structure rather than the diagonal scaling.
    - Monomial order and factor-base construction are first-order determinants of d_ff and are frozen before Stage 2.
    - The dead-meter trap: reporting d_reg instead of d_ff reintroduces the no-dynamic-range failure (EV-REP-001/002).
    - Toy-size Groebner behaviour need not persist at larger systems; three primes minimum, drift stated.
    - p is a residual covariate across the matched-order family; reported with |D_0|.

  interpretation_limits:
    - claim_tier toy; toy N; no cryptographic-scale statement.
    - >-
      Prime-field ECDLP has no known subexponential index calculus; even a measured
      first-fall fall is a structural finding, NOT an exponent move, and is reported
      as a test to run under P3, not a speedup.
    - >-
      No phi-stable / equivariant factor base is constructed; the object is the
      degree structure of a fixed relation ideal, so pause P2 (H-STR-002) is not
      engaged.
    - Any advantage at or below the sqrt(|Aut|) discount is baseline calibration (KN-TECH-018), recorded as such.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a matched random ordinary curve, the m=3 Semaev relation ideal under
        the fixed monomial order has a first-fall degree d_ff and a Hilbert
        staircase that behave like those of a generic (semi-regular) system of the
        same degree sequence and number of variables.
      rigorous_support: >-
        The Bardet-Faugere-Salvy first-fall / degree-of-regularity framework for
        (semi-)regular systems, imitating a uniformly random system of the same
        Macaulay shape; deviations from semi-regularity are exactly the signal
        sought.
      validation_plan: >-
        Compute d_ff and the Hilbert series for matched random curves at three toy
        primes; compare to the semi-regular prediction for the same degree sequence;
        tail-check the largest degree fall observed against the predicted first-fall.
        Record the monomial order, factor-base construction, and system dimensions;
        state the transfer assumption to larger systems explicitly.
    - id: H2
      statement: >-
        The automorphism action x -> zeta*x induces an exact grading of the
        relation ideal by zeta-weight, and quotienting by it removes precisely the
        |Aut|/2 orbit-collapse (the sqrt(|Aut|) discount), leaving a residual
        first-fall degree that is 0-effect under H-null.
      rigorous_support: >-
        Diagonal torus actions grade polynomial ideals exactly; the |Aut|/2 orbit
        structure is a finite-group symmetry of the solution set, not an
        asymptotic. Imitates the exact orbit-counting behind the automorphism
        discount.
      validation_plan: >-
        On a j=0 curve, verify the graded pieces reproduce the |Aut|/2 orbit count
        and that the artificial-grading control (random j, imposed grading) shows
        the same graded structure with no CM content.

  target_complexity:
    time_exponent: >-
      1/2 for prime-field ECDLP, unchanged; no subexponential index calculus is
      known or claimed over a prime field. The measured object is a degree, not a
      cost; a first-fall fall would be a structural crack to investigate, not an
      exponent.
    memory_exponent: not applicable; Groebner degree bookkeeping at toy scale.
    best_known: >-
      0.886*sqrt(N) parallel rho with DPs, O(1) memory (KN-TECH-001, KN-TECH-006);
      automorphism-discounted CM variant 1.2533*sqrt(N/|Aut|) (KN-TECH-018).
    hidden_overhead: >-
      No o(1) claimed. Disclosed: the monomial order and factor-base construction
      can move d_ff more than any special-j effect and are frozen; toy-size
      Groebner behaviour may not persist to larger systems.
    tradeoff_note: not applicable; no attack constructed.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY, DATA against every frontier row. Constructs no
    attack; dominated by parallel rho with DPs (0.886*sqrt(N), O(1) memory), the
    automorphism-discounted CM variant (1.2533*sqrt(N/|Aut|), KN-TECH-018), BSGS,
    and kangaroo/Gaudry-Schost. Over prime fields no index-calculus row exists on
    the frontier to dominate, which is itself the honest reason even H-crack moves
    no exponent. No data/queries consumed.
  sota_delta: >-
    ZERO speedup on time, memory, data, exponent; none sought. Measurement delta:
    replaces the flat d_reg=2 meter (EV-REP-001/002, no dynamic range) with a
    first-fall / Hilbert-staircase meter that HAS dynamic range and, after
    quotienting the automorphism discount, reads the residual algebraic effect of
    special j against a matched-random null -- a capability the lane currently
    lacks entirely.

