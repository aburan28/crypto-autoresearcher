idea:
  id: IDEA-20261024-b58e07
  question_id: RQ-PEXT-7c3e91
  goal_id: GOAL-PEXT-4a1d6b
  added: '2026-10-24'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  proposed_by_note: >-
    Transcribes the user-named first-batch target of 2026-10-24 (extend the GHS cover census and genus floor
    to n = 7; what governs the minimum). Not an ideation batch; design is /design-experiment.
  title: >-
    GHS cover genus floor at n = 7: does the factorisation of x^7 - 1 over F_2 (ord_7(2) = 3), with the
    2-torsion type, set the spectrum and the minimum?
  class: theory
  claim: >-
    For E/F_{q^7}, q odd, and the (2,...,2) compositum of the 7 conjugate double covers of the x-line
    (g = 2^(m-2)(r-4)+1), m is in {1, 3, 4, 6, 7}; split 2-torsion can reach g = 7 (the Lemma D0 bound) via
    (m, r) = (3, 7); every other 2-torsion type stays above 7; odd order with j not in F_q has floor 193.
    Coordinator's prior, not derivations (sketch in the .notes.md); each is proved or refuted at design.
  mechanism: >-
    Lemma M (sibling n = 5 study): the span is a cyclic F_2[x]/(x^n - 1)-module, so m is the degree of a
    divisor of x^n - 1. For n = 3, 5 (2 a primitive root) that gives m in {1, n-1, n}; x^7 - 1 =
    (x+1)(x^3+x+1)(x^3+x^2+1) adds m = 3, 4. A 4-point B' in one 7-orbit with indicator (x+1)f, f a cubic
    factor, spans the [7,3,4] simplex code: r = 7, m = 3, g = 7, all branch points K-rational. Odd order,
    by the Prop. O5 orbit argument: orbits 3 + 7, m = 7, r = 10, g = 193. Characteristic 2 has a published
    n = 7 genus-7 family (KR-IC-791cb7); the cross-characteristic arm asks if one invariant explains both.
  novelty_status: unverified
  citations:
    - ref: aburan28/crypto research/ghs_cover_census_n5_20261013/README.md
      provenance: retrieved
      claim: Lemma M, D0, E, Prop. O5, Prop. T; n = 5 floors 33/33/25/5; m in {1,4,5}; cover_census_n.rs; Lean
      verified_by: coordinator 2026-10-24, README read in the /home/user/crypto checkout
    - ref: aburan28/crypto research/ghs_cubic_cover_census_20261012/README.md
      provenance: retrieved
      claim: "n = 3 class minima 13 / 5 / 3 for #E(K) odd / 2 mod 4 / 0 mod 4"
      verified_by: coordinator 2026-10-24, README read in the /home/user/crypto checkout
    - ref: KN-LIT-bf1772
      provenance: internal
      claim: Iijima-Momose-Chao 2015/805, odd-char (2,...,2) GHS classification for d in {2,3,5,7}; abstract only
      verified_by: coordinator 2026-10-24, KN record opened
  assumptions:
    - Sibling construction and genus formula as stated there; the n = 7 steps are re-derived at design.
    - Branch set x(E[2]) plus infinity; other degree-2 maps are out of scope for this batch.
  predictions:
    - metric: set of m over all structures
      direction: equals
      minimum_effect: "{1, 3, 4, 6, 7}"
    - metric: minimum genus, split 2-torsion
      direction: attains
      minimum_effect: 7 on some curve at q = 3 or 5, only via (m, r) = (3, 7)
    - metric: minimum genus, non-split types
      direction: greater
      minimum_effect: above 7 on every structure; per-type floors derived at design
    - metric: "minimum genus, odd #E(K), j not in F_q"
      direction: equals
      minimum_effect: 193
  minimal_test:
    design: >-
      (0) n = 7 derivations (Lemma M7, D0, E7, O7, T7) in the protocol before any panel. (1) cover_census_n.rs
      extended to n = 7, reproducing every n = 3 and n = 5 record. (2) q = 3: about 4.4e8 structures per model,
      so a fixed-seed sample stratified by 2-torsion type, with 2-isogeny neighbours, each model over all its
      structures. (3) Constructive enumeration of the genus-7 configurations at q = 3, 5, 7, 9, each mapped to
      its curve class, #E(K), v_2 and 2-torsion type. (4) A second implementation, written blind, recounts a
      subset. (5) Lean decide lemmas: submodule dimensions of F_2[x]/(x^7 - 1), weight-4 patterns, spectrum.
    controls:
      - Regression, n = 3 (q = 5, 7) and n = 5 (q = 3) records reproduced exactly.
      - Subcover-sum identity on every fully evaluated structure.
      - Structure count per model equals (Q^3 - Q)/(q^3 - q).
      - Nearby object, characteristic 2 at n = 7, against KR-IC-791cb7.
    required_metrics: [min genus per model, "(m, r) histogram", attaining structures, 2-torsion type, "v_2(#E(K))", j in F_q, coverage]
  falsification_conditions:
    - A structure below the derived floor of its type is a counterexample certificate against that derivation.
    - A non-split curve at genus 7, or any m in {2, 5}, refutes the mechanism at n = 7.
    - No genus-7 curve while (3) finds configurations means the configuration-to-curve map is wrong (invalid, not null).
  confounders:
    - Characteristic 3 at q = 3 (the n = 3 pilot had char-3 exceptions); q = 5, 7, 9 separate it.
    - "Trace-zero class #E(K) = Q + 1 (the n = 3 exception), reported as its own row."
  interpretation_limits:
    - Bounded q and samples; a floor is a theorem only where proved.
    - Genus says nothing about descent to F_q, transfer injectivity or cost.
  heuristic_assumptions:
    - id: H1
      statement: The fraction of split curves over F_{q^7} reaching genus 7 scales like q^-3.
      rigorous_support: none; a configuration count (about q^4 against q^7), see notes
      validation_plan: compare (3) counts at q = 3, 5, 7, 9 with c q^4
  target_complexity:
    time_exponent: no attack claimed
    memory_exponent: no attack claimed
    best_known: n/a (structural)
    hidden_overhead: n/a
    tradeoff_note: genus is reported, never priced
  estimated_cost: {implementation: medium, compute: medium}
  recommended_priority: high
  prior_art:
