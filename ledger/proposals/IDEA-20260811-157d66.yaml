idea:
  id: IDEA-20260811-157d66
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  task_id: TASK-20260811-5ff234
  axis: A1
  claim_tier: toy
  title: >-
    THE TWIST-LABEL FUNCTION chi(f(x)) ON THE x-LINE IS A LOSSLESS RE-ENCODING OF THE
    CURVE AND IS FOURIER-FLAT AT THE WEIL LEVEL, WHICH CLOSES THE "STRUCTURED SUBSET
    OF THE x-LINE" FAMILY TWICE OVER: it fails the inventor-protocol section 2 test
    because a Weil-bound argument shows the label determines f exactly (obstruction
    O-LABELLOSSLESS), and it fails the exploitation test because every additive and
    multiplicative Fourier coefficient is bounded by 3 sqrt(p) while a random label
    of the same balance has maximum coefficient growing like sqrt(p log p)
    (obstruction O-WEILFLAT) -- with one measurable exception, that for CM curves of
    small |D_0| the multiplicative spectrum is EXACTLY evaluable by Jacobi sums, which
    is a stratum-specific prediction the test can confirm or kill
  class: mechanism
  resource: >-
    R1 (x-coordinates as field elements) and R2 (the curve equation), consumed
    through the quadratic character of F_p. The tracked object is a FUNCTION on
    P^1(F_p), which is neither a curve, nor a group, nor a point -- it is the only
    object in this axis whose type is not one of the campaign's usual three, and that
    is why it is worth writing down even though it closes.
  admissibility: >-
    Admissible. No endomorphism is applied to any point of G. The object is a
    function on the x-line; nothing here is a group homomorphism and no oracle
    returning group elements is proposed, so neither H-ENDO-001 nor KN-FIND-b7e091
    bites. The record's conclusion is a closure.
  p2_p3_flags:
    p2_adjacent: false
    p3_triggered: false
    note: >-
      No phi-stable factor base and no comparison against the automorphism-discounted
      rho baseline. Neither pause condition is engaged.

  claim: >-
    Let p > 3, f(x) = x^3 + a x + b separable over F_p, chi the quadratic character
    of F_p with chi(0) = 0, and define the TWIST-LABEL FUNCTION
      lambda_E : F_p -> {+1, 0, -1},  lambda_E(x) = chi(f(x)).
    lambda_E is exactly the datum that says which of E and E^d a given x-coordinate
    lifts to (IDEA-20260811-01a208 claim (A)), and it is the only datum the shared
    x-line does not already carry.

    (A) [open, argued here] O-LABELLOSSLESS -- lambda_E DETERMINES f, SO IT IS NOT A
        LOSSY PROJECTION. Suppose f and g are separable monic cubics of the form
        x^3 + ax + b with lambda_f = lambda_g pointwise. Then f(x) g(x) is a square in
        F_p for every x outside the at most six roots. If f g were not a square as a
        POLYNOMIAL, the hyperelliptic curve w^2 = f(x) g(x) would have genus at most 2
        and, by Hasse-Weil, at most p + 1 + 4 sqrt(p) affine points -- while the
        pointwise square condition forces at least 2(p - 6). For p above a small
        explicit bound these are incompatible, so f g is a square polynomial; since f
        and g are separable and monic this forces f = g. Hence
        lambda_E determines the curve. Under docs/inventor-protocol.md section 2 the
        verdict is immediate: nothing is discarded, so nothing is gained, and
        lambda_E is a change of coordinates on the curve equation rather than a new
        tracked object. THIS ARGUMENT COSTS NO COMPUTE AND IS THE RECORD'S PRIMARY
        DELIVERABLE.

    (B) [fact, relayed] O-WEILFLAT -- THE LABEL IS FLATTER THAN RANDOM. For every
        nontrivial additive character e_p(u x) and every nontrivial multiplicative
        character chi', Weil's estimate for character sums with polynomial arguments
        gives
          | sum_{x in F_p} chi(f(x)) e_p(u x) | <= 3 sqrt(p)   for u != 0,
          | sum_{x in F_p} chi(f(x)) chi'(x) | <= 3 sqrt(p),
        the constant being (deg f + deg g - 1) in the standard form of the bound.
        [THE CONSTANT IS RELAYED, NOT DERIVED HERE, AND MUST BE CONFIRMED BEFORE ANY
        RECORD QUOTES IT AS 3 RATHER THAN AS O(1).] By contrast a uniformly random
        +-1 sequence of length p has maximum Fourier coefficient of order
        sqrt(p log p). So the E-half and the E^d-half of the x-line are separated by
        no additive or multiplicative character with advantage better than
        O(p^{-1/2}), and any algorithm whose lever is additive or multiplicative
        structure of the set {x : x lifts to E} gains at most the noise floor.

    (C) THE TESTABLE SEPARATION, AND WHY IT IS A SCALING TEST RATHER THAN A SINGLE
        MEASUREMENT. At toy p the two bounds are numerically comparable: 3 sqrt(p)
        against sqrt(p log p) crosses only near log p = 9, i.e. p near 8100. THE
        RECORD THEREFORE DOES NOT PREDICT A SEPARATION AT A SINGLE p, WHICH WOULD BE
        AN OVERCLAIM. It predicts a difference in SCALING: for curves, the normalised
        maximum coefficient max_u |S(u)| / sqrt(p) is bounded by a constant and does
        not grow with p; for the matched random null it grows like sqrt(log p). Three
        or four values of p across 12 to 20 bits separate the two.

    (D) THE ONE STRATUM WHERE THE SPECTRUM IS NOT MERELY BOUNDED BUT EXACTLY KNOWN,
        WHICH IS THE RECORD'S ONE POSITIVE PREDICTION. For curves with complex
        multiplication by a small discriminant -- in particular j = 0 (D_0 = -3) and
        j = 1728 (D_0 = -4) -- the trace of Frobenius is given classically by a
        Jacobi-sum evaluation, and the associated multiplicative character sums
        sum_x chi(f(x)) chi'(x) at sextic and quartic characters chi' are exactly
        evaluable rather than merely bounded. [RELAYED FROM CLASSICAL CM POINT-COUNTING
        AND NOT DERIVED HERE.] The prediction is therefore stratified: for j = 0 and
        j = 1728 curves, specific multiplicative coefficients sit at values determined
        by the Jacobi sum and at modulus exactly sqrt(p), while for generic j they are
        spread below the Weil bound with no distinguished values. This is a
        two-population prediction with a computed value in one population, and it is
        the part of the record that can be killed cheaply and informatively.

    (E) THE RESIDUE, STATED SO IT CANNOT BE INFLATED. Even if every prediction
        confirms, nothing here is an attack and nothing moves an exponent. The
        practical content is one line: DECIDING WHICH CURVE AN x-COORDINATE BELONGS
        TO COSTS ONE LEGENDRE SYMBOL, O(log^2 p) BIT OPERATIONS. That is why the
        twist pair's shared factor base is a factor-of-2 amortisation and not more
        (IDEA-20260811-01a208 claim (F1)), and it is why the pair fails the lossy-
        projection test. The label is cheap, complete, and structureless -- three
        properties that each independently prevent it from being a resource.

  mechanism: >-
    A subset of F_p can be a resource in two ways: because it is expensive to decide
    membership, or because it has structure a sieve can exploit. The E-half of the
    x-line has neither property, and the reasons are different and independent.
    Membership is cheap because the quadratic character is computable by a Jacobi
    symbol in quasi-linear time, which is the same reason the twist pair collapses to
    one object. Structure is absent because the label is the composition of a
    multiplicative character with a cubic, and Weil's theory says exactly that such
    compositions equidistribute against every other character to within sqrt(p) --
    the same theorem that makes the point count of a curve p + O(sqrt(p)) in the first
    place. So the flatness of lambda_E and the Hasse bound are one theorem seen twice,
    which is why no independent slack exists between them for an algorithm to enter.
    The CM stratum in (D) is the one place where the sqrt(p) is achieved with a KNOWN
    phase rather than an unknown one, and knowing a phase is a distinguisher, not a
    lever: it identifies the curve, which was public anyway.

  why_not_a_renamed_known_approach: >-
    Character sums appear in the corpus 62 times across 23 proposal records, but in
    every case examined they are a TOOL -- most explicitly in IDEA-20260807-257001,
    which uses an O(p) character sum to recompute a trace as an independent transport
    certificate. No record treats the label function itself as a tracked object, and
    no record applies the lossy-projection test to it. The distinction matters: using
    a character sum to compute the trace is instrumentation; asking whether the
    character's level set is a structured subset is an ideation question about an
    object, and it is the question axis A1 asks under the heading "cosets rather than
    subgroups". This record answers it in the negative twice and records the
    mechanism of each negative, which is what docs/inventor-protocol.md section 4
    requires of a closure.

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the conclusion is (A)'s Hasse-Weil counting
      argument. If lambda_E did NOT determine f, the label would be a genuinely lossy
      projection and the section 2 verdict would flip.
    baseline_embedding:
      parameter_slice: >-
        Setting f(x) = x reduces lambda to the Legendre symbol itself, whose Fourier
        transform is a Gauss sum with EVERY coefficient of modulus exactly sqrt(p).
        That is the exact boundary of the flatness claim and is the slice the
        instrument must reproduce.
      reproduction_check: >-
        Frozen fixture: the DFT of chi(x) over F_p must return all coefficients of
        modulus sqrt(p) to floating-point tolerance, for at least three primes. If it
        does not, the DFT code is wrong and every curve measurement is void.
    observation_collision:
      observable: The normalised Fourier spectrum of lambda_E.
      distinct_preimage_search: >-
        Sought: two curves with the same spectrum but different f. Claim (A) says
        there are none with the same lambda; the collision question here is the weaker
        one of the same SPECTRUM up to phase, which permits at least the translations
        x -> x + c and the scalings that preserve the curve family. Those must be
        quotiented out before any collision is reported, or the search will report
        spurious collisions that are only relabelled coordinates.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the spectrum fixed and vary f. If the fibre is a single orbit under the
          coordinate changes above, the spectrum is as informative as f itself, which
          is the (A) conclusion in Fourier language.
        predicted_gain: >-
          Zero, and zero is predicted. The transform is applied to establish emptiness.
    quantifier_order: >-
      CLOSURE CLAIM: forall p above the explicit bound in (A), forall separable
      f, g of the stated shape, if lambda_f = lambda_g pointwise then f = g.
      FLATNESS CLAIM: forall p, forall separable f, forall nontrivial additive or
      multiplicative characters, the sum is bounded by C sqrt(p) with C = O(1)
      independent of the curve. The uniformity of C in the CURVE is the load-bearing
      part; a C that depended on (a, b) would leave room for an exceptional family and
      the record would have to be rewritten.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest claim is that no ADDITIVE or MULTIPLICATIVE character
        distinguishes the two halves of the x-line beyond p^{-1/2}. It certifies
        nothing about non-character statistics -- higher-order correlations, subset
        sums, or any statistic of tuples rather than points -- and it must not be read
        as closing all subset-structure attacks.
      nearby_object_control: >-
        The closest object where the conclusion FAILS is an artificially planted
        label: lambda' equal to +1 on an interval of length p/2 and -1 elsewhere. Its
        maximum Fourier coefficient is of order p / log p, enormously above the Weil
        bound. If the instrument cannot separate that object from a genuine curve, it
        has no power and its negatives are void.
    proof_obligations:
      - claim: pointwise equality of labels forces f g to be a square polynomial.
        responsibility: correctness
      - claim: the Hasse-Weil bound makes the alternative impossible above an explicit p.
        responsibility: size
      - claim: the Weil character-sum bound holds with a curve-independent constant.
        responsibility: correctness
      - claim: a random +-1 sequence has maximum coefficient of order sqrt(p log p).
        responsibility: baseline
      - claim: the CM stratum has exactly evaluable multiplicative coefficients.
        responsibility: feasibility

  predictions:
    - observable: normalised maximum additive Fourier coefficient
      metric: >-
        max over u != 0 of |sum_x chi(f(x)) e_p(u x)| / sqrt(p), for at least 200
        random curves at each of p near 2^12, 2^14, 2^16, 2^18, 2^20
      direction: different
      predicted: >-
        bounded by a constant of order 3 and FLAT in p -- the fitted slope against
        sqrt(log p) is 0 within resolution. A measured value exceeding the Weil bound
        is impossible as mathematics and would be an implementation error, so the
        informative outcome is a systematic GROWTH with p, which would mean the
        constant is not curve-uniform.
    - observable: the matched random null, same statistic
      metric: >-
        the same normalised maximum for uniformly random +-1 sequences with the same
        number of zeros and the same +1 / -1 imbalance as the curve
      direction: higher
      predicted: >-
        grows like sqrt(log p), so the null and the curve populations separate as p
        increases and are comparable at 12 bits. If the null does NOT grow, the null
        generator is wrong and the comparison is void.
    - observable: the planted-structure positive control
      metric: the same normalised maximum for an interval-indicator label
      direction: higher
      predicted: >-
        of order sqrt(p) / log p in normalised units, i.e. enormously larger than
        either population. Failure to detect it means the instrument has no power.
    - observable: the CM stratum's multiplicative spectrum
      metric: >-
        |sum_x chi(f(x)) chi'(x)| / sqrt(p) at sextic chi' for j = 0 curves and at
        quartic chi' for j = 1728 curves, against generic-j curves at matched p
      direction: different
      predicted: >-
        exactly 1 (modulus exactly sqrt(p)) at the distinguished characters for the CM
        curves, versus a spread strictly below the Weil bound with no distinguished
        value for generic j. A CM curve whose distinguished coefficient is not at
        modulus sqrt(p) falsifies (D), which is relayed and is the most likely part of
        this record to be wrong.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, and it can kill the record). Write out (A) as a
      four-line counting argument with the explicit p bound. If the bound is not
      below 2^12 the whole test design is unusable at toy scale and must be redesigned
      before any code runs.
      STAGE 1 (minutes). For a single curve at p = 4001, compute lambda_E as a vector
      of length p, take its discrete Fourier transform over C, and report the
      normalised maximum. Reproduce the f(x) = x Gauss-sum fixture. Reproduce the
      interval-indicator positive control.
      STAGE 2 (one core-hour). Sweep p over five sizes from 2^12 to 2^20, 200 random
      curves each, plus 200 matched random-label nulls each, plus every j = 0 and
      j = 1728 curve available at each p. Fit the normalised maximum against
      sqrt(log p) separately for the two populations and report both slopes with
      intervals. Compute the multiplicative spectrum at sextic and quartic characters
      for the CM stratum.
      STAGE 3 (zero compute, but it is the deliverable). Record the section 2 verdict
      from (A) and the closure statement, with forward guidance naming the statistics
      the flatness argument does NOT cover.
      The DFT at p = 2^20 over C is a single FFT of length about 10^6 per curve, so
      the sweep is dominated by curve generation, not by the transform.
    controls:
      - >-
        NULL OBJECT, MATCHED IN BALANCE: uniformly random +-1 sequences with the same
        number of zeros and the same +1 / -1 imbalance as the curve's label, so that
        the null differs from the curve ONLY in structure and not in first-order
        statistics. This matching is essential: an unmatched null would separate on
        the trace rather than on structure and the result would be uninterpretable.
      - >-
        PLANTED SIGNAL: the interval-indicator label, whose maximum coefficient is
        enormous and which the instrument must flag. Two-directional control as
        required by RQ-INSTR-f8faa0.
      - >-
        BASELINE FIXTURE: f(x) = x, giving a Gauss sum with every coefficient at
        modulus exactly sqrt(p).
      - >-
        DECAY CONTROL, in the sense of docs/inventor-protocol.md section 3: the
        normalised maximum for the CURVE population must be FLAT in p while the null
        GROWS. A statistic that behaves identically in both populations at every p is
        the signature of an artifact, not of a finding, and would void the comparison.
    required_metrics:
      - normalised maximum additive coefficient per curve, per p
      - the same for the matched null, the interval control, and the Gauss-sum fixture
      - fitted slope against sqrt(log p) for both populations, with intervals
      - multiplicative coefficients at sextic and quartic characters, CM stratum versus generic
      - the explicit p bound from (A), and a direct verification of (A) by exhaustive
        search over all (a, b) at one small p that no two distinct curves share a label

  controls:
    - Matched-balance random label null.
    - Interval-indicator planted signal.
    - Gauss-sum baseline fixture at f(x) = x.
    - Exhaustive label-collision search at one small p, verifying (A) directly.
    - Decay control: flat versus growing normalised maximum across p.

  confounders:
    - >-
      THE TOY-SCALE CROSSOVER. At 12 bits the Weil constant and the random baseline
      are numerically comparable, so a single-p comparison proves nothing. The claim
      is a SCALING claim and any report that quotes a single p as evidence has
      misread the record.
    - >-
      The Weil constant is RELAYED, not derived. If it is 4 or 5 rather than 3, the
      crossover moves and the required p range moves with it. The record's prediction
      is stated as "bounded and flat", which is robust to the constant; only the
      numerical crossover estimate is not.
    - >-
      The CM claim in (D) is relayed from classical CM point counting and is the most
      likely element to be wrong as stated. It is separated into its own prediction
      precisely so that its failure does not contaminate (A) or (B).
    - >-
      FLOATING-POINT DFT at p near 2^20 accumulates error; the maximum coefficient
      must be recomputed in exact arithmetic for the top few u before any value is
      reported as exceeding or meeting a bound.
    - >-
      Curves related by x -> x + c or by an admissible scaling have related spectra.
      These must be quotiented before any collision claim, or the record will report
      coordinate changes as collisions.

  falsification_conditions:
    - >-
      Two distinct separable f, g of the stated shape with lambda_f = lambda_g at some
      p above the (A) bound. (A) is false, the label IS lossy, and the object becomes
      live -- this is the outcome that would reopen the family and it must be
      independently replicated.
    - >-
      A curve whose normalised maximum additive coefficient grows with p. The
      constant in (B) is not curve-uniform and an exceptional family exists.
    - >-
      The matched null's normalised maximum does not grow like sqrt(log p). The
      baseline is wrong and no separation claim can be made.
    - >-
      The interval control is not detected. The instrument has no power; every
      negative it produced is void, not negative.
    - >-
      A j = 0 curve whose sextic multiplicative coefficient is not at modulus sqrt(p).
      (D) is false. This is the least surprising falsification available and it costs
      the rest of the record nothing.

  interpretation_limits:
    - >-
      Closes ADDITIVE and MULTIPLICATIVE character structure only. Says nothing about
      higher-order correlations, statistics of tuples rather than points, or any
      structure not visible to a one-dimensional character. Reading this as "the
      x-line has no structure" would be a serious overreach; the honest statement is
      "the x-line's twist labelling is character-flat".
    - >-
      No exponent moves and none is claimed. The only cost statement is that label
      recovery costs one Legendre symbol.
    - >-
      Toy to mid scale (12-20 bits). The Weil bound is a theorem and is scale-free;
      the measured spectra are not, and the scaling fit rests on five points.
    - >-
      Claim (A) is argued, not proved, in this record: the explicit p bound is
      asserted to exist rather than computed, and computing it is stage 0 of the
      minimal test.

  assumptions:
    - p > 3, f = x^3 + a x + b separable, chi the quadratic character with chi(0) = 0.
    - >-
      Weil's bound for character sums of the form sum chi(f(x)) psi(g(x)) with the
      standard constant deg f + deg g - 1. [RELAYED, NOT VERIFIED THIS SESSION.]
    - >-
      Hasse-Weil for hyperelliptic curves of genus at most 2, used in (A).
    - >-
      Classical Jacobi-sum evaluation of the trace for CM curves with D_0 = -3, -4,
      used only in (D). [RELAYED, NOT VERIFIED THIS SESSION.]

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Random-label baseline.) For a uniformly random sequence in {+1, -1} of length
        p with a prescribed imbalance of order sqrt(p), the maximum modulus of its
        nontrivial discrete Fourier coefficients is (1 + o(1)) sqrt(p log p), matching
        the extreme value of p - 1 approximately independent complex Gaussians of
        variance p.
      rigorous_support: >-
        The variance of each coefficient is exactly p - O(1) by orthogonality, which
        is rigorous. The classical distribution statement imitated is the extreme-value
        law for the maximum of independent complex Gaussians, the same statement used
        in every "is this sequence pseudorandom" analysis; the only heuristic step is
        treating the p - 1 coefficients as independent, which is standard and is
        false only at the level of the single linear constraint that they sum
        correctly.
      validation_plan: >-
        Sampled quantity: the normalised maximum coefficient for 10^4 random sequences
        at each of p in {2^12, 2^14, 2^16, 2^18, 2^20}. Shortcut: a length-p FFT per
        sample, so the whole sweep is minutes; no correspondence trick is needed and
        nothing is solved. Comparison distribution: the Gumbel-type extreme-value
        prediction with location sqrt(p log p), compared by empirical CDF. Tail check:
        the largest normalised maximum observed across all 5 x 10^4 samples against
        the predicted frequency in the upper tail; a systematic excess would mean the
        independence approximation fails and the baseline must be recomputed
        empirically rather than from the formula. TRANSFER ASSUMPTION: none required;
        the baseline is measured at the same p values as the curves.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE MOVES. The only cost statement is
      operational: deciding the twist label of one x-coordinate costs one Jacobi
      symbol, O(log^2 p) bit operations, versus O(log p) field operations for one
      group operation -- so labelling a factor base of size n costs O(n log^2 p),
      negligible against any relation search. The measurement itself costs one
      length-p FFT per curve.
    memory_exponent: O(p) for the label vector and its transform; O(1) per label decision.
    best_known: >-
      Parallel Pollard rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-001,
      KN-TECH-006); the automorphism-discounted variant (KN-TECH-018); BSGS at
      sqrt(N) time and memory (KN-TECH-031).
    hidden_overhead: >-
      Nothing hides in an o(1) because no improvement is claimed. Honest disclosure:
      the closure covers one-dimensional character statistics only, and the record
      says so in three separate places because that is the boundary a reader is most
      likely to overrun.
    tradeoff_note: Not applicable; no algorithm is proposed.

  sota_delta: >-
    Zero. No attack, no speedup, no exponent. A closure of one object plus an
    operational cost statement for label recovery.

  dominated_by: >-
    As an attack, dominated by everything, since it is not an attack. Checked against
    every row of the frontier the program maintains: parallel Pollard rho at
    0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006); the
    automorphism-discounted variant (KN-TECH-018); BSGS at sqrt(N) time and memory
    (KN-TECH-031); the preprocessing frontier at N^{1/3} online with N^{1/3} advice
    (Corrigan-Gibbs-Kogan, charged in DEC-20260727-008). As a CLOSURE, dominated by
    nothing in this repository for this object, since no record treats the label
    function as an object; as MATHEMATICS it is dominated by Weil's theorem, which
    is where all of its force comes from and which the record claims no credit for.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: low

  honest_prior_of_survival: >-
    0.90 that (A) verifies with an explicit p bound below 2^12. 0.97 that (B)'s
    boundedness verifies -- it is a theorem, and the residual risk is entirely in the
    relayed constant. 0.75 that the scaling separation in (C) is cleanly visible
    across five sizes. 0.50 that (D)'s CM prediction survives as stated, since it is
    relayed and the exact statement about which characters are distinguished may be
    off. 0.02 that anything here becomes a component of an attack. The record is filed
    as a closure and is priced accordingly: it is the lowest-priority record in this
    batch and is recommended only because its stage 0 costs nothing.

  novelty_status: adaptation

  novelty_screen: >-
    Performed 2026-08-11 against the committed corpus in this worktree. Greps over
    ledger/proposals/: "Legendre symbol|quadratic character|Weil bound|character sum"
    (62 occurrences, 23 files); "kummer|x-line|E/{+-1}|P^1" (197 occurrences, 45
    files); "quadratic twist|twist" (370 occurrences, 60 files). The densest
    character-sum record, IDEA-20260807-257001, was read in the relevant part: it uses
    an O(p) character sum to recompute a trace as a transport certificate, which is a
    tool use, not an object. No record found that treats lambda_E as a tracked object,
    applies the lossy-projection test to it, or computes its Fourier spectrum. WEB
    SEARCH WAS NOT PERFORMED, so EXTERNAL novelty is NOT established, and the record
    assumes the Weil flatness of chi(f(x)) is entirely classical -- it claims only the
    application of the section 2 test to this object and the stratified CM prediction
    in (D).

  discriminated_from: >-
    IDEA-20260807-257001 -- NEAREST EXISTING PROPOSAL by term overlap. It computes a
    character sum to certify a transported curve's trace; this record asks whether the
    character's level set has structure. Same tool, different question, no overlap in
    claim.
    IDEA-20260811-01a208 (this batch) -- establishes that the label is what the shared
    x-line does not carry and that recovering it is cheap. This record supplies the
    two independent reasons the label is not a resource: it is lossless, and it is
    flat. 01a208 needs only the first; this record proves both and is therefore the
    weaker-priority companion.
    IDEA-20260807-dadcd2 -- deck groups of coordinate maps. Its object is the map
    E -> P^1; this record's object is a function ON P^1. Adjacent, not overlapping.

  source_refs:
    - ledger/proposals/IDEA-20260811-01a208.yaml
    - ledger/proposals/IDEA-20260807-257001.yaml
    - docs/inventor-protocol.md
    - analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md
    - >-
      "[recall-confident, RELAYED] Weil's bound for character sums
