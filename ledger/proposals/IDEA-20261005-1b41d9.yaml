idea:
  id: IDEA-20261005-1b41d9
  question_id: RQ-ECTD-001
  added: '2026-10-05'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Invariant-factor pairs of E(F_p) differ across the first ordinary
    same-trace rational 2-isogeny whose point count is not square-free.
  class: measurement
  claim: >-
    Scan odd primes p ≤ 64 and short-Weierstrass curves
    y^2 = x^3 + a x + b in lexicographic order of (p, a, b). Take the
    first ordinary curve E that has a rational point of order 2 whose
    Vélu codomain E2 is ordinary, defined over F_p, of the same trace,
    and of different j, and whose common order N = #E(F_p) is not
    square-free. Write E(F_p) ≅ Z/n1 × Z/n2 and
    E2(F_p) ≅ Z/m1 × Z/m2 with n2 | n1, m2 | m1, and both products
    equal to N. The claim is (n1, n2) ≠ (m1, m2). This is one
    isomorphism-type comparison. It is not a discrete-log solve and
    it does not change an ECDLP exponent.
  mechanism: >-
    The computed object is the invariant-factor pair of the rational
    points on each end of one F_p-rational 2-isogeny. Disagreement
    means the isomorphism type of E(F_p) is not fixed by the trace on
    this edge, so the type is eligible as an endpoint-specific
    quantity rather than a class invariant. Agreement means this edge
    does not witness that variation. Neither outcome is a trapdoor
    and neither is a private discrete logarithm.
    OBJECT FRAME. Representation: R1 short-Weierstrass coefficients
    (a, b). The tracked object is the invariant-factor pair of the
    full group E(F_p), not a coordinate of a prime-order subgroup.
    Operation set Sigma: one rational 2-isogeny. Sigma is not
    translation. TRICHOTOMY: branching. Reason: the isogeny is a
    homomorphism with kernel of order 2, and the codomain group is
    not a block of translation.
    LOSSY-PROJECTION TEST against Sigma. Discarded: the equation and
    the choice of generator. Retained: one pair of positive integers.
    The scaling control is a second equation with the same pair, so
    the map from equations to pairs is not injective. It is lossy as
    a projection of the model. The least rational root of a
    3-division polynomial is not the metric.
  novelty_status: unverified
  citations:
    - ref: KN-LIT-ca35e0
      provenance: internal
      claim: >-
        The opened note reports floor-to-crater isogenies in
        Õ(q^{1/4}) and states that the transfer gives no ECDLP
        algorithm. It does not compare invariant factors of E(F_q).
      verified_by: idea-generator, this session, via knowledge/literature/KN-LIT-ca35e0.md
    - ref: KN-OPEN-cbbd97
      provenance: internal
      claim: >-
        The opened note asks whether secret knowledge of End(E)
        across a large-conductor barrier can gate a DLP advantage
        the public cannot reach by isogeny-path search. No group
        isomorphism type is measured there.
      verified_by: idea-generator, this session, via knowledge/open-problems/KN-OPEN-cbbd97.md
    - ref: KN-LIT-319
      provenance: internal
      claim: >-
        The opened note, a bulk seed from the first pages of a local
        PDF, describes isogeny volcanoes and ell-isogeny steps. The
        abstract was not independently re-proved in this session.
      verified_by: idea-generator, this session, via knowledge/literature/KN-LIT-319.md
  assumptions:
    - An ordinary same-trace rational 2-isogeny with non-square-free N exists for some odd prime p ≤ 64. Square-free orders are skipped because they admit only one abelian group.
    - E(F_p) has rank at most 2, so one pair (n1, n2) with n2 | n1 describes it.
    - The Vélu codomain is written as a short-Weierstrass model over F_p before the group is enumerated.
  predictions:
    - metric: number of coordinates in which (n1, n2) and (m1, m2) differ
      direction: different
      minimum_effect: 1
  minimal_test:
    design: >-
      Enumerate (p, a, b) as above. Reject singular and supersingular
      curves. On the first rational point (r, 0) of order 2, apply
      Vélu. Accept the codomain only when it is ordinary, has the
      same trace, and has a different j. Require a prime square
      divisor of N. Enumerate both groups by adding every rational
      point, and record the invariant factors. Stop. Do not compute
      a division-polynomial root as a metric and do not run rho.
    controls:
      - The two traces are equal. A trace mismatch rejects the pair.
      - Replace (a, b) by (16a, 64b), the scaling by u = 2. The crater pair (n1, n2) is unchanged. A change means the enumerator failed.
      - N is not square-free. A square-free order is skipped, not counted as agreement.
      - The kernel point maps to the identity on E2.
    required_metrics:
      - selected_prime
      - common_order_N
      - source_invariant_factors
      - codomain_invariant_factors
      - scaling_control_pair
  falsification_conditions:
    - (n1, n2) equals (m1, m2) on the accepted pair.
    - No accepted pair exists for odd p ≤ 64.
    - The scaling (16a, 64b) changes (n1, n2).
    - The two traces differ on a pair that was accepted.
  confounders:
    - A quadratic twist can share j and change the group. Same trace plus a Vélu isogeny is required, so a twist with another trace is rejected.
    - Square-free N has only one abelian group, so equality would be forced. Those orders are outside the claim.
    - Counting affine points and forgetting the identity changes N. The identity is included.
  interpretation_limits:
    - A difference on one edge shows that the trace does not fix the isomorphism type on that edge. It does not exhibit a discrete-log weakness.
    - Agreement on one edge fails to witness variation. It does not prove the type is a class invariant for every curve of that trace.
    - This measurement does not change an ECDLP exponent. Matched rho on a group of order N would be N^{1/2} and is not run.
    - RQ-ECTD-001 caps toy meters below a certified sub-rho solve. This record stays under that cap.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        Given a source group of order N with a rational subgroup of
        order 2, the codomain isomorphism type imitates a uniform
        draw among the rank-at-most-2 abelian groups of order N that
        contain a subgroup isomorphic to the source modulo that
        order-2 kernel and whose second invariant factor divides
        p - 1. The uniform draw is the imitation. The sample is one
        isogeny at one p ≤ 64. No transfer to a second volcano is
        claimed.
      rigorous_support: >-
        A rational 2-isogeny induces a surjective homomorphism of
        rational points whose kernel has order 2, so the image is
        isomorphic to E(F_p)/Z/2 and has index 2 in a codomain of
        the same order N. Elliptic curves over F_p have rank at most
        2. Hasse's bound limits N by |#E(F_p) - (p + 1)| ≤ 2√p.
      validation_plan: >-
        On the one accepted pair, check that the kernel maps to the
        identity, that both orders equal N, and that each second
        factor divides both the first factor and p - 1. Compare the
        two pairs. No further sample.
  target_complexity:
    time_exponent: >-
      Polynomial in one prime p ≤ 64. Listing E(F_p) is O(N) group
      additions with N ≤ p + 1 + 2√p. No N^{1/2} collision search.
    memory_exponent: O(N) rational points, N bounded by Hasse at p ≤ 64.
    best_known: >-
      KN-LIT-ca35e0, opened note: Õ(q^{1/4}) for a floor-to-crater
      isogeny, and that note states this is not an ECDLP algorithm.
      Matched Pollard rho would be N^{1/2}. Neither is claimed.
    hidden_overhead: >-
      None. The output is two pairs of integers and the scaling
      control pair.
    tradeoff_note: >-
      No time-memory tradeoff. One isogeny and two exhaustive group
      listings.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
