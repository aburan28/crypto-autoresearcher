idea:
  id: IDEA-20260815-e059e9
  question_id: RQ-CSIDH-64343f
  added: '2026-08-15'
  title: >-
    CSIDH KEYS ARE VECTORS OF SMALL EXPONENTS AND THEIR DISTRIBUTION IS A
    DESIGN CHOICE: measure whether the key-space shape changes the effective
    quantum query count the sieve needs
  class: measurement

  claim: >-
    CSIDH secret keys are exponent vectors drawn from a bounded range, and
    different parameter proposals use different ranges and distributions.
    Kuperberg-style sieves solve a hidden-shift problem whose difficulty
    depends on the group and the shift distribution. Whether the key-space
    shape changes the query count is a design-relevant question that the
    cost-model disputes have obscured.

  mechanism: >-
    Instantiate the sieve's query-count model with the key distribution as a
    parameter. Compare uniform-in-range, discrete-Gaussian, and fixed-weight
    key spaces at matched entropy. Report query count per shape.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Read of GOAL-CSIDH-001; grep 'key space', 'exponent vector',
      'Kuperberg' (44), 'dihedral coset' (13).
    results: >-
      Query-count analyses are well represented and dispute the cost
      model; none varies the key distribution at matched entropy.
    verdict: >-
      UNVERIFIED. Key-space shape effects are considered in the CSIDH
      parameter literature; whether the query-count dependence has been
      isolated at matched entropy is a stage-one check.

  object_first_candidate:
    tracked_object: >-
      THE SIEVE'S QUERY COUNT as a function of the key-space shape, at
      fixed entropy.
    lossiness: >-
      Reporting query count against key size projects away the
      distribution, which at matched entropy is the only thing varying.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives as a symbolic instantiation; it inherits whichever query-
      count model it is instantiated with, which is itself disputed.

  null_object_control: >-
    NULL 1 -- uniform keys, reproducing the published query count for the
    standard parameterisation. NULL 2 -- two identical distributions
    labelled differently, which must give identical counts; a model
    responding to the label is wrong.

  discriminated_from:
    - >-
        The CSIDH cost-model reconstruction in this series, which
        reconciles competing query-count models; this varies the key
        distribution within whichever model is used and should be run
        under each reconciled model rather than one.
    - >-
        The group-action premise verification in this series, which checks
        the action's structure rather than the key distribution on it.

  assumptions:
    - >-
        A query-count model can be instantiated with the key distribution
        as a parameter, which requires the model to expose it rather than
        assume uniform.
    - >-
        Matched entropy is the right control; if the sieve's difficulty
        depends on the range rather than the entropy, matching entropy is
        the wrong comparison and the record must say so.

  predictions:
    - metric: >-
        uniform-key reproduction
      direction: different
      minimum_effect: >-
        FORCED to reproduce the published count for the standard
        parameterisation.
    - metric: >-
        relabelled-identical-distribution null
      direction: different
      minimum_effect: >-
        FORCED identical counts; a model responding to labels is wrong.
    - metric: >-
        query count per key-space shape at matched entropy
      direction: different
      minimum_effect: >-
        The measurement; a material difference would be design-relevant
        and is not currently part of the parameter discussion here.
    - metric: >-
        sensitivity of the answer to which query-count model is used
      direction: different
      minimum_effect: >-
        Reported explicitly, since the underlying model is disputed and
        the answer may not survive changing it.

  minimal_test:
    design: >-
      Three key-space shapes at matched entropy, under two reconciled
      query-count models, both nulls.
    controls:
      - >-
          Uniform-key published-count reproduction.
      - >-
          Relabelled-distribution null.
      - >-
          Run under more than one query-count model, since the model
          itself is disputed.
      - >-
          Entropy matched exactly and reported per shape.
    required_metrics:
      - >-
          Query count per shape per query-count model.
      - >-
          Reproduction agreement for the uniform case.
      - >-
          Sensitivity of the ranking across models.

  falsification_conditions:
    - >-
        The uniform reproduction fails. The instantiation differs from the
        published model.
    - >-
        Query count is flat across shapes at matched entropy. Key-space
        shape is a free design choice on this axis, which is a useful
        negative for parameter designers.
    - >-
        Query count varies materially across shapes. Key-space shape is a
        security-relevant design parameter, which would be a genuine
        addition to the parameter discussion.
    - >-
        The ranking flips across query-count models. The answer is model-
        determined and cannot be quoted until the model dispute settles.

  confounders:
    - >-
        MODEL DEPENDENCE: the underlying query-count model is disputed, so
        an answer derived under one model may not survive the dispute's
        resolution, which is why more than one is used.
    - >-
        ENTROPY VERSUS RANGE: matching entropy assumes entropy is the
        relevant quantity, and if the sieve responds to range instead the
        comparison is not controlled.

  interpretation_limits:
    - >-
        Symbolic instantiation of a disputed model; makes no quantum-
        security claim.
    - >-
        Scoped to the instantiated models and the compared shapes.
    - >-
        Any shape effect inherits the disputes of whichever query-count
        model produced it.

  heuristic_assumptions:
    - id: HEUR-CSIDH-KEY-1
      statement: >-
        At matched entropy, the sieve's query count is independent of
        the key-space distribution's shape.
      rigorous_support: >-
        Rigorous ingredient: Kuperberg-style sieve analyses are stated
        for a hidden shift in a group, with the shift's entropy
        governing the search space size, which suggests entropy is the
        binding quantity. THE GAP: the sieve combines labelled states
        and its combination step depends on the shift's representation,
        not only on its entropy -- so a fixed-weight key space with the
        same entropy as a uniform one could behave quite differently in
        the combination step.
      falsification_condition: >-
        Query counts differing materially across shapes at matched
        entropy under any instantiated model.
      validation_plan: >-
        SAMPLE: 3 shapes x >= 2 query-count models. COMPARISON: query
        count per shape, per model. TAIL CHECK: the shape furthest from
        uniform, where any effect should be largest. TRANSFER: none; the
        answer binds the instantiated models.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic; no compute and no quantum simulation.
    memory_exponent: >-
      Negligible.
    best_known: >-
      Incumbents are the published CSIDH query-count analyses,
      instantiated here with a varied key distribution and not improved.
    hidden_overhead: >-
      The disputed underlying model is the dominant hidden term, which is
      why the record refuses to run under only one.
    tradeoff_note: >-
      Matching entropy isolates shape and assumes entropy is what matters;
      if it is not, the control is wrong and the record says so rather
      than proceeding.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As cost analysis: dominated by the published
    CSIDH query-count work. As a key-shape comparison at matched entropy:
    none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: sieve query counts compared
    across CSIDH key-space shapes at matched entropy under more than one
    reconciled query-count model, with the answer's sensitivity to that
    model choice reported explicitly.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.6 that a query-count model exposing the key distribution can be
    instantiated. 0.85 that the uniform reproduction succeeds. 0.3 that
    shape matters materially at matched entropy, which would add a design
    parameter the current discussion does not treat as one.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
