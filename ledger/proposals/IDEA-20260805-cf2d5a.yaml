        cover being connected, which the whole monodromy framing presupposes; at m = 3
        EV-MONO-a0a89c OBS-2 proves it (16 f(x_1) f(x_2) is squarefree, hence not a
        square). At m >= 4 no proof is given here.
      validation_plan: >-
        Measure it: the number of distinct Frobenius classes realized at m = 4, 5 is a
        lower bound on |Gal|, and observing 4 distinct classes at m = 4 certifies
        equality there. Report the measured lower bound rather than asserting equality.
    - id: HEUR-KUM-3
      formal_statement: >-
        deg_T S_m = 2^{m-2} for m >= 3.
      rigorous_support: >-
        Standard and independently corroborated inside this corpus: EV-MONO-a0a89c
        OBS-5 states "2^{m-2} values matching deg_T S_m" and its red team verified the
        m = 4 case computationally (193/193 over F_211). NOT taken from an external
        source and no external source is cited.
      validation_plan: >-
