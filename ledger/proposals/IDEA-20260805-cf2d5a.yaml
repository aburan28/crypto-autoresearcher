idea:
  id: IDEA-20260805-cf2d5a
  question_id: RQ-MONO-001
  added: '2026-08-05'
  class: theory
  title: >-
    The Semaev summation cover is a 2-Kummer cover, not a generic one: its geometric
    monodromy is the elementary abelian sign group (Z/2)^{m-2} at EVERY m, so
    KN-OPEN-009's "full symmetric/wreath for generic curves" premise is false by a
    two-line argument, the imprimitivity half is answered rather than carried
    forward, and the deferred m >= 4 census becomes unnecessary rather than merely
    unaffordable.

  claim: >-
    THE STATEMENT. Let E : y^2 = f(x) = x^3 + Ax + B be non-singular over a field k
    of characteristic > 3, and let S_m be the m-th Semaev summation polynomial, with
    deg_T S_m(x_1,...,x_{m-1},T) = 2^{m-2} for m >= 3. Then over K = k(x_1,...,x_{m-1})
    the splitting field of S_m(x_1,...,x_{m-1},T) is contained in
    K(sqrt(f(x_1)),...,sqrt(f(x_{m-1}))), and the geometric monodromy group of the
    cover is a quotient of (Z/2)^{m-1} / <(1,1,...,1)> = (Z/2)^{m-2} acting REGULARLY
    on the 2^{m-2} roots. Whenever S_m is irreducible over K -- i.e. whenever the
    cover is connected, which is the only case in which the monodromy question is
    posed at all -- the group is EXACTLY (Z/2)^{m-2}, elementary abelian, regular.

    THREE CONSEQUENCES, EACH OF WHICH IS A PRE-RUN FORCED VALUE.
    (C1) THE FULL-SYMMETRIC PREMISE IS FALSE AT EVERY m >= 4. The full symmetric group
    on 2^{m-2} letters has order (2^{m-2})!, which is 24 at m = 4 and 40320 at m = 5;
    the actual group has order 4 and 8. There is therefore no "generic full monodromy
    versus exceptional small monodromy" dichotomy to census: the monodromy is small
    for every curve, and the m = 3 result EV-MONO-a0a89c OBS-2 recorded (S_2, every
    non-singular E, no exceptional locus) is the m = 3 instance of this, not a
    degree-2 accident.
    (C2) ONLY TWO FROBENIUS CYCLE TYPES CAN OCCUR, AT EVERY m. A regular action of an
    elementary abelian 2-group is free away from the identity, so every non-identity
    element has cycle type 2^{2^{m-3}} and the identity has type 1^{2^{m-2}}. At m = 4
    (degree 4) the ONLY attainable cycle types are 1^4 and 2^2; the frequencies of
    4, 3+1 and 2+1+1 are EXACTLY ZERO. Under full S_4 monodromy Chebotarev would give
    1/24, 1/8, 1/4, 1/3, 1/4 for those five types. The two models are not close.
    (C3) THE IMPRIMITIVITY HALF IS ANSWERED, AND ITS ANSWER IS THE OPPOSITE OF THE ONE
    KN-OPEN-009 ANTICIPATES. A regular abelian group of degree 2^{m-2} >= 4 is
    IMPRIMITIVE (every index-2 subgroup gives a block system). Block systems are
    therefore GENERIC, not exceptional. But the corresponding resolvents are the
    square roots sqrt(prod_{i in S} f(x_i)) -- that is, the y-coordinates -- so
    "resolvent decomposition" of the summation cover IS the chord-and-tangent law
    written in other letters. This is the canonical lossy-projection failure named in
    docs/inventor-protocol.md section 2: a change of coordinates, nothing discarded,
    nothing gained.

    WHAT THIS OVERTURNS IN THIS PROGRAM'S OWN RECORDS. EV-MONO-a0a89c's boundaries
    block states: "OBS-1, OBS-2, OBS-3 and OBS-6 are m=3 ONLY. They rest on the
    degree-2 discriminant factorization, which has no analogue at m >= 4." That
    sentence is correct about the DEVICE and wrong about the RESULT. The discriminant
    factorization disc_T S_3 = 16 f(x_1) f(x_2) does not generalize; the
    2-Kummer structure that EXPLAINS it does, and gives the same class of conclusion
    at every m. GOAL-MONO-001's next_action instructs that the imprimitivity half be
    "carried forward" to an m >= 4 census because at m >= 4 it "IS non-degenerate".
    It is non-degenerate and it is also already determined. Carrying it forward costs
    a batch to measure a quantity that is forced.

  object_first_candidate:
    tracked_object: >-
      THE SQUARE-CLASS VECTOR. Follow, through the whole computation,
      chi(x_1,...,x_{m-1}) = (class of f(x_1), ..., class of f(x_{m-1})) in
      (k^*/(k^*)^2)^{m-1}, taken modulo the diagonal. Equivalently: the sign-flip
      torsor. Fix y_i with y_i^2 = f(x_i) and P_i = (x_i, y_i); the fibre of S_m over
      (x_1,...,x_{m-1}) is exactly { x(eps_1 P_1 + ... + eps_{m-1} P_{m-1}) } over
      sign vectors eps modulo global negation, which is 2^{m-2} values, matching
      deg_T S_m. Flipping y_i to -y_i flips eps_i. So the ONLY thing the Galois group
      can do to the fibre is flip signs, and the only thing that decides which flips
      Frobenius performs is whether each f(x_i) is a square.
    established_families_off_limits: >-
      Declared off-limits AS THE PRIMARY LENS for this proposal: (i) the
      Chebotarev/Frobenius cycle-type census, which is this goal's own instrument and
      the thing being audited rather than used; (ii) discriminant factorization, which
      is the m = 3-only device whose non-generalization is the recorded boundary being
      overturned; (iii) index-calculus relation counting and yield statistics, which
      are the subject of the sibling proposal IDEA-20260805-a9a95d and are not this
      record's lens; (iv) Groebner / resultant solving-degree instrumentation
      (GOAL-SDEG-001, GOAL-DREG-001 territory); (v) isogeny/class-group structure
      (closed in scope by DEC-20260804-fec1e8 R1, and not needed here); (vi) spectral
      gap / expander mixing (DEC-20260804-f320c2 R2). NOT off-limits: elementary
      Kummer theory and the group law, which is the whole point -- the argument is
      supposed to be elementary, and its being elementary is the finding.
    newness_score: >-
      LOW AS MATHEMATICS, and this is stated plainly rather than dressed up. That the
      roots of S_m at a specialization are x(+- P_1 +- ... +- P_{m-1}) is standard and
      appears in the index-calculus literature; the Galois consequence is an immediate
      corollary that a specialist would call folklore. NO SOURCE FOR IT WAS LOCATED
      AND NONE IS CITED (see novelty_screen). What is new HERE is (a) that this corpus
      does not contain it, (b) that a live open problem (KN-OPEN-009) and a paused
      goal's next_action are both premised on its negation, and (c) that it converts a
      three-batch census programme into a derivation. That is the same shape as
      EV-MONO-a0a89c OBS-1, which recorded its own identity as "elementary and
      essentially classical ... not recorded anywhere in this corpus, which is the only
      sense in which finding it was work". The honest comparison is to that record.
    testability_score: >-
      Very high and almost free. The m = 3 consequence is ALREADY COMMITTED and must
      be reproduced exactly (OBS-3's closed form). The m = 4 consequence is a
      categorical prediction -- three of five cycle types have frequency exactly zero
      -- testable with a few thousand pure-Python specializations at toy p. The
      graded m = 3,4,5 prediction (split frequency 1/2, 1/4, 1/8 at t = Z = 0) is a
      three-point monotone ladder against a competitor model predicting 1/2, 1/24,
      1/40320.
    survival_score: >-
      The object survives the entire cover, at every m, over every non-singular curve
      and every field of characteristic > 3. That universality is what makes it a
      barrier statement rather than an attack: nothing curve-specific is retained, so
      nothing curve-specific can be extracted. The structure dissolves only where the
      P_i satisfy a relation (see IDEA-20260805-90df50), which is a measure-O(1/N) set.

  mechanism: >-
    DERIVED HERE IN FULL. Nothing below is recalled from a source.

    STEP 1 -- THE FIBRE. S_m(x_1,...,x_m) = 0 iff there exist points P_i on E with
    x(P_i) = x_i and P_1 + ... + P_m = O. Fix x_1,...,x_{m-1} and choose y_i with
    y_i^2 = f(x_i), so P_i = (x_i, y_i) is determined up to sign by the choice of y_i.
    The remaining coordinate must satisfy x_m = x(-(eps_1 P_1 + ... + eps_{m-1}
    P_{m-1})) = x(eps_1 P_1 + ... + eps_{m-1} P_{m-1}) for some sign vector eps. The
    2^{m-1} sign vectors give at most 2^{m-2} distinct x-values, since eps and -eps
    give the same x. deg_T S_m = 2^{m-2} for m >= 3, so generically these are exactly
    the roots and they are distinct. (EV-MONO-a0a89c OBS-5 states this same root-set
    description and its red team verified it 193/193 at m = 4 over F_211; it is not
    assumed here on that authority, it is re-derived, and the re-derivation agrees.)

    STEP 2 -- THE FIELD. Every root lies in
    L' = K(y_1,...,y_{m-1}), K = k(x_1,...,x_{m-1}). Gal(L'/K) = (Z/2)^{m-1},
    generated by sigma_i : y_i -> -y_i (independent because f(x_1),...,f(x_{m-1}) are
    pairwise-inequivalent squarefree elements of the UFD k[x_1,...,x_{m-1}] -- this is
    exactly where non-singularity, i.e. squarefreeness of f, is used, and it is the
    same place OBS-2 used it at m = 3). The diagonal element sigma_1 sigma_2 ...
    sigma_{m-1} sends every P_i to -P_i, hence every eps-sum to its negative, hence
    fixes every root. So the splitting field L of S_m over K satisfies
    L subset (L')^{<diag>}, and Gal(L/K) is a quotient of (Z/2)^{m-1}/<diag> =
    (Z/2)^{m-2}, of order 2^{m-2}.

    STEP 3 -- THE GROUP IS EXACT AND REGULAR. If S_m is irreducible over K the Galois
    action is transitive on 2^{m-2} roots, and a transitive action of a group of order
    at most 2^{m-2} on 2^{m-2} points forces order exactly 2^{m-2} and a REGULAR
    action. Hence Gal(L/K) = (Z/2)^{m-2}, elementary abelian, regular. The same
    argument over F_p(x_1,...,x_{m-1}) gives the arithmetic monodromy, and the two
    coincide because the sign group is already defined over the prime field. This
    generalizes OBS-2 (m = 3: (Z/2)^1 = S_2) verbatim.

    STEP 4 -- THE FROBENIUS ELEMENT IS THE CHARACTER VECTOR, AND THE CYCLE TYPE
    FOLLOWS. Over F_p, at a specialization with all f(x_i) nonzero, Frobenius acts on
    P_i by P_i -> P_i if f(x_i) is a square and P_i -> -P_i if it is not; write
    s_i = chi(f(x_i)) in {+1,-1} for the quadratic character. Then
    Frob(sum eps_i P_i) = sum eps_i s_i P_i, and this equals +-(sum eps_i P_i) for
    EVERY eps precisely when s = (1,...,1) or s = (-1,...,-1), i.e. when all m-1
    characters agree. Therefore:
      * all m-1 characters equal  ==>  every root is in F_p, cycle type 1^{2^{m-2}};
      * otherwise                 ==>  NO root is in F_p, and since Frob^2 fixes
        everything the cycle type is 2^{2^{m-3}}.
    No other cycle type is attainable at any m. This is the categorical prediction.

    STEP 5 -- THE EXACT FREQUENCIES, WHICH REPRODUCE THE COMMITTED m = 3 LAW. Let
    #E(F_p) = p + 1 - t and Z = #{x in F_p : f(x) = 0} in {0,1,3}. Counting affine
    points, #{x : f(x) is a nonzero square} = (#E(F_p) - 1 - Z)/2 = (p - t - Z)/2, and
    #{x : f(x) is a nonsquare} = (p + t - Z)/2. Write S = (p-t-Z)/2 and
    N_ns = (p+t-Z)/2. Over uniform (x_1,...,x_{m-1}) in F_p^{m-1}, ignoring the
    ramified locus f(x_i) = 0,
      freq(split completely) = (S^{m-1} + N_ns^{m-1}) / p^{m-1},
      freq(all 2-cycles)     = 1 - that.
    BASELINE REPRODUCTION, RUN BEFORE THIS RECORD WAS WRITTEN (inventor protocol
    section 8, audit 1): at m = 3 this gives numerator S^2 + N_ns^2 = (p-Z)^2/2 + t^2/2,
    and subtracting the x_1 = x_2 diagonal correction (p - Z) recovers EXACTLY
    EV-MONO-a0a89c OBS-3's committed closed form
      N_split = S^2 + N_ns^2 - (p - Z),  freq_split - 1/2 = (t^2 - 2pZ + Z^2 - 2p + 2Z)/(2p^2).
    The agreement is an exact algebraic identity, not a numerical resemblance. A
    general framework that reproduces the committed special case term-for-term,
    including its diagonal correction, is an embedding of the baseline rather than a
    curve that looks like it.

    STEP 6 -- WHY THE IMPRIMITIVITY HALF DIES RATHER THAN OPENS. (Z/2)^{m-2} acting
    regularly on 2^{m-2} >= 4 points is imprimitive, so block systems exist at every
    m >= 4 for every curve. The block system for an index-2 subgroup H corresponds to
    the quadratic subextension K(sqrt(prod_{i in S} f(x_i))) for the subset S cut out
    by H. Its resolvent is a product of the y_i. Computing it is computing
    y-coordinates; acting on the blocks is applying the group law. So the
    "block system exploitable by resolvent decomposition" that KN-OPEN-009 hunts
    exists, is generic, and is the addition law. NAMED OBSTRUCTION: the resolvent
    tower of the summation cover is the 2-descent tower of E, and its levels carry no
    information not already in the point coordinates -- the projection to the block
    structure is invertible on the data the attacker already holds.
    FORWARD GUIDANCE, REQUIRED BY inventor protocol section 4 AND SUPPLIED HERE: what
    remains open is (a) covers whose Galois group is NOT forced by a Kummer
    presentation -- multiplication-by-l covers for odd l, where the sign group is
    replaced by an l-torsion torsor and the monodromy can be much larger; (b) the
    Weil-restriction setting over F_{q^n}, where the relevant group is the interaction
    of the sign torsor with Gal(F_{q^n}/F_q) rather than the sign torsor alone, and
    which this record does NOT address; (c) the coincidence locus where the P_i satisfy
    a relation, which is where the regular action degenerates and where the only
    curve-dependence in the whole picture lives (IDEA-20260805-90df50).

