        unusual in this corpus and is the reason the proposal is cheap.
      rigorous_support: >-
        The root description (STEP 1) is the definition of S_m plus the group law; the
        field containment (STEP 2) is Kummer theory over a UFD with f squarefree; the
        diagonal acts trivially because x(-Q) = x(Q). All three steps are elementary and
        written out above rather than cited.
      validation_plan: >-
