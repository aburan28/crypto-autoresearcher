        against 105 already-committed curves at zero compute.
    - id: HEUR-KUM-2
      formal_statement: >-
        S_m(x_1,...,x_{m-1},T) is irreducible over k(x_1,...,x_{m-1}) for m >= 3, so
        the containment of HEUR-KUM-1 is an equality.
      rigorous_support: >-
