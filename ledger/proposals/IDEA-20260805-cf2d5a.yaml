    - id: HEUR-KUM-1
      formal_statement: >-
        NONE LOAD-BEARING FOR THE CONTAINMENT. The statement "Gal(L/K) embeds in
        (Z/2)^{m-1}/<diag>" is unconditional for non-singular E over any field of
        characteristic > 3, and every consequence C1-C3 follows from the containment
