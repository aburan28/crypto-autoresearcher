  confounders:
    - >-
      IRREDUCIBILITY IS AN ASSUMPTION, NOT A THEOREM HERE. The exactness of the group
      (as opposed to the containment in (Z/2)^{m-2}) needs S_m irreducible over
      k(x_1,...,x_{m-1}). The CONTAINMENT -- which carries every one of the three
      consequences C1, C2, C3 -- does not. If irreducibility fails the group is
      smaller, the cover is disconnected, and the conclusions get STRONGER, not weaker.
      This asymmetry is why the record leads with the containment.
    - >-
      CHARACTERISTIC. The argument uses char k > 3 (short Weierstrass form, 2 and 3
      invertible, y -> -y as the hyperelliptic involution). Characteristic 2 and 3 are
      OUT OF SCOPE and no statement is made about them. RQ-MONO-001 is prime-field
      scoped so this is not a live gap for this goal, but it is a real limit.
    - >-
      THE COINCIDENCE LOCUS. Where the P_i satisfy a relation the roots collide, the
      action is no longer free, and cycle types degenerate. This is an O(1/N) event
      (quantified in IDEA-20260805-90df50) and is reported as its own stratum rather
      than folded in. A run that pools it will see apparent violations of C2 that are
      not violations.
    - >-
      TOY SCALE. Everything measurable here is at 8-16 bit primes. The DERIVATION is
      scale-free -- it is an identity in Z[x_1,...,x_{m-1},A,B] -- so the toy run is a
      CHECK OF A DERIVATION, not an extrapolation. Any citation must say which of the
      two it is relying on.
    - >-
      AUTHORSHIP ASYMMETRY. Refuting a premise is cheap to produce and reads as rigour.
      The positive control and the two-sided prediction ladder exist so that a negative
      outcome costs something to reach.

