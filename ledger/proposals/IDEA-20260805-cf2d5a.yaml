  lossy_projection_identifiability_audit:
    projection: >-
      Full specialization data (x_1,...,x_{m-1}) in F_p^{m-1}, together with the whole
      fibre of S_m over it, projected to the square-class vector
      (chi(f(x_1)),...,chi(f(x_{m-1}))) modulo global negation -- m-2 bits.
    what_is_discarded: >-
      Everything about the x_i except one bit each: the actual coordinates, the actual
      points, the actual root values, the curve's j-invariant, the trace t, the class
      group, the CM order. From p^{m-1} specializations only 2^{m-2} classes remain.
    why_genuinely_lossy: >-
      The fibre over an observed class vector is a positive-density subset of the whole
      parameter space, of size about p^{m-1}/2^{m-2}. The x_i are NOT recoverable from
      the class vector; the map is enormously many-to-one.
    why_compatible_with_the_targets_operations: >-
      Because Frobenius acts on the retained bits by the quadratic character, which is
      a group homomorphism, and acts on the fibre through exactly those bits (STEP 4).
      The retained part therefore propagates DETERMINISTICALLY: knowing the class
      vector determines the cycle type with no residual uncertainty. That is the
      strongest form of the compatibility condition inventor protocol section 2 asks
      for, and it is the reason the projection is worth tracking.
    is_it_only_a_change_of_coordinates: >-
      NO -- CHECKED, AND THIS IS THE FAILURE MODE CHECKED FOR FIRST. The canonical
      failure is (Delta, Pi) = (x xor y, x*y) in characteristic 2, where the unordered
      pair is recovered as the roots of t^2 + Delta t + Pi so nothing is discarded. Here
      the recovery is impossible on cardinality grounds alone: p^{m-1} inputs, 2^{m-2}
      outputs. The projection is strictly lossy.
    mirror_failure_check: >-
      ALSO CHECKED, AND IT IS THE ONE THAT NEARLY BITES. A projection so lossy that it
      is CONSTANT across instances has zero comparator spread and says nothing. Here
      the class vector is NOT constant: it takes all 2^{m-1} values with frequencies
      (S/p)^a (N_ns/p)^{m-1-a}, and the derived cycle type takes both of its attainable
      values with frequencies 2^{-(m-2)} and 1 - 2^{-(m-2)} at t = Z = 0. Spread is
      present and quantified before any run. BUT: the projection IS constant on the
      factor-base sublocus, where every f(x_i) is a square by definition -- which is
      precisely EV-MONO-a0a89c OBS-5, restated in this record's language. That is the
      honest limitation of this object, it is stated here rather than discovered later,
      and it is why the sibling proposals IDEA-20260805-a9a95d and IDEA-20260805-90df50
      exist: they carry statistics that are NOT constant there.

  predictions:
    - metric: >-
        frequency of Frobenius cycle types 4, 3+1 and 2+1+1 on the generic fibre of
        S_4 over uniform (x_1,x_2,x_3) in F_p^3, non-ramified specializations
      direction: lower
      minimum_effect: >-
        EXACTLY 0 -- a forced value, derived before any run, not a small number. A
        single observed 4-cycle, 3+1 or 2+1+1 falsifies the whole record. Under the
        competing full-S_4 model these three types carry combined frequency
        1/4 + 1/3 + 1/4 = 5/6, so the test is maximally discriminating.
    - metric: >-
        frequency of the split-completely type 1^{2^{m-2}} on the generic fibre, at
        m = 3, 4, 5, on a curve with t = 0 and Z = 0
      direction: different
      minimum_effect: >-
        FORCED LADDER 1/2, 1/4, 1/8 (general form (S^{m-1} + N_ns^{m-1})/p^{m-1}),
        i.e. exact halving per unit of m, each cell within 3 binomial standard errors.
        The competing full-symmetric model forces 1/2, 1/24, 1/40320. Three interior
        points, monotone, and the two models diverge in RATE not just in value, so a
        failure localizes which m first breaks the Kummer structure rather than
        leaving "it did not work".
    - metric: >-
        exact-formula agreement at m = 3: (S^2 + N_ns^2 - (p-Z))/p^2 against
        EV-MONO-a0a89c OBS-3's committed closed form
      direction: same
      minimum_effect: >-
        BITWISE IDENTICAL as rational numbers on all 105 censused curves of
        RUN-MONO-4b50b6-002. This is an already-committed number and a disagreement
        means this record is wrong, not that the committed number is.
    - metric: >-
        conditional determinism: fraction of non-ramified specializations at m = 4, 5
        in which the observed cycle type is the one predicted by the square-class
        vector of that same specialization
      direction: higher
      minimum_effect: >-
        1.000 exactly, over every tested specialization. This is stronger than any
        frequency test: it is a per-instance prediction, so a single mismatch kills it.
    - metric: >-
        order of the computed Galois group of S_4 over F_p(x_1,x_2,x_3), obtained by
        counting distinct Frobenius classes realized
      direction: lower
      minimum_effect: >-
        At most 4 distinct group elements realized (the identity plus at most three
        involutions), against 24 for full S_4. Reported as the number of distinct
        realized permutations of the labelled root set.

  minimal_test:
    design: >-
      Four stages, cheapest first, each able to end the line. STAGE 0 (zero compute,
      already performed for m = 3 while writing this record): verify the derivation
      reproduces OBS-3's committed closed form exactly. If it does not, STOP -- the
      derivation is wrong. STAGE 1 (zero compute, ~2 hours reading): search for prior
      statement of the Kummer structure in the summation-polynomial literature and
      record what was found. A hit reduces the claim to a corpus-gap note and the
      mathematics is unchanged. STAGE 2 (pure-Python integer arithmetic, minutes):
      generic-fibre cycle-type census at m = 4 and m = 5 on the pinned toy curve panel,
      classifying by BOTH an S_m-free root construction and, independently, by
      factoring the specialized summation polynomial, and cross-checking the two.
      STAGE 3 (minutes): the positive and null controls below.
    controls:
      - >-
        POSITIVE CONTROL / INSTRUMENT SENSITIVITY (MANDATORY, AND NO NEGATIVE MAY BE
        REPORTED IF IT FAILS). Run the identical cycle-type classifier on uniformly
        random monic quartics over the same F_p. Chebotarev for a generic quartic
        predicts S_4 densities 1/24, 1/4, 1/8, 1/3, 1/4 for types 1^4, 2+1+1, 2^2,
        3+1, 4. The classifier MUST reproduce these within 3 standard errors, and in
        particular MUST emit 4-cycles and 3+1 types at nonzero rate. If it does not,
        the instrument cannot see the types whose absence is this record's headline,
        and the headline is unsupported. THIS EXACT CONTROL ALREADY EXISTS IN THIS
        LANE at degree 5: EV-MONO-a0a89c OBS-7 records random quintics matching
        Chebotarev(S_5) at 0.2026 vs 0.2 and 0.2451 vs 0.25.
      - >-
        NULL OBJECT OF THE SAME SHAPE, WITH A FORCED VALUE THAT CAN FAIL. Replace
        S_4(x_1,x_2,x_3,T) by the degree-4 polynomial obtained from the SAME curve and
        the SAME x_i through a deliberately structure-breaking substitution: the
        product (T - r_1)(T - r_2)(T - r_3)(T - r_4) where r_j are the four values
        x(eps_1 P_1 + eps_2 P_2 + eps_3 P'_3) with P'_3 a point of a DIFFERENT curve
        E' of the same order. The sign-torsor argument does not apply across two
        curves, so the forced value is that cycle types 4 and 3+1 DO appear. If they
        do not, the classifier is measuring an artifact of the construction rather
        than the Galois structure, and Stage 2 is void.
      - >-
        GRADED CONTROL, >= 3 INTERIOR POINTS, MONOTONICITY REPORTED. m = 3, 4, 5 with
        the forced split frequencies 1/2, 1/4, 1/8 at t = Z = 0. Report the ratio
        measured/forced at each m and its trend. A failure at exactly one m localizes
        the breakdown to that degree rather than leaving a global negative.
      - >-
        RAMIFICATION CONTROL. Specializations with f(x_i) = 0 are counted separately
        and never pooled; the exact formulas above are stated for the non-ramified
        locus and the ramified count is reported as its own stratum, as OBS-3 does.
      - >-
        CURVE-PANEL CONTROL. Include the CM and extra-automorphism panels
        (j = 0, j = 1728) explicitly. The derivation is curve-blind, so these must give
        the SAME categorical answer; a difference would mean the derivation missed a
        curve-dependent term and is the single most informative possible failure.
    required_metrics:
      - per-(curve, m) cycle-type histogram with the ramified stratum separated
      - per-specialization agreement between predicted and observed cycle type
      - measured vs forced split frequency and their ratio, per m
      - positive-control quartic histogram against S_4 Chebotarev densities
      - number of distinct Frobenius permutations realized
      - exact m = 3 formula agreement against the 105 committed OBS-3 curves

  falsification_conditions:
    - >-
      Any observed Frobenius cycle type at m >= 4 other than 1^{2^{m-2}} and
      2^{2^{m-3}}, on a non-ramified specialization with distinct roots. This kills
      the record outright and is the primary falsifier.
    - >-
      Any non-ramified specialization whose observed cycle type disagrees with the one
      forced by its own square-class vector.
