    literature_verified: []
    literature_unverified:
      - >-
        NOT READ -- NO SOURCE LOCATED. It is likely that the Galois/Kummer structure of
        Semaev summation polynomials is stated somewhere in the index-calculus or
        summation-polynomial literature (Semaev 2004; Gaudry; Diem; Petit-Quisquater
        and successors are the plausible places). NO SUCH SOURCE WAS READ, NO THEOREM
        NUMBER IS ASSERTED, AND NO CITATION IS MADE. Checking for prior statement of
