idea:
  id: IDEA-20260816-7fb48f
  question_id: RQ-AEADC-8db132
  added: '2026-08-16'
  title: Exhaustively enumerate the length-encoding block of an AEAD mode within a declared class
    and count, rather than argue about, how many distinct associated-data and ciphertext length pairs
    a mode maps to the same final authenticated block, treating the length field as a finite audit
    surface with a countable answer
  class: representation
  claim: '(A) Every AEAD mode that authenticates associated data alongside ciphertext must tell the
    authenticator where one ends and the other begins, and it does so through a finite encoding: a
    fixed-width length block, a length prefix, a padding rule, or a framing convention. That encoding
    is a total function from a pair of lengths, plus the padding of each field, into a bit string.
    Whether it is injective on a declared class of inputs is a decidable question with an exact integer
    answer, obtainable by exhaustive enumeration and requiring no probabilistic argument. (B) The
    deliverable is a table: for each of four declared encoding conventions modelled from mode families
    -- a trailing fixed-width length block, a length-prefix convention, a zero-padding-to-block-boundary
    convention with no length field, and a delimiter-byte convention -- the exact count of colliding
    input pairs within a fully enumerated class, the minimal colliding pair emitted as bytes, and
    the exact structural condition under which the count is zero. (C) The count is a property of the
    encoding alone and is independent of the primitive: replacing the block cipher with an ideal permutation
    cannot change an injectivity count, and demonstrating that invariance in the same run is the natural
    null this bucket''s directive calls for. (D) NOT CLAIMED: no attack on any AEAD; no claim that
    any deployed mode''s encoding is non-injective, since the four conventions audited here are declared
    models and not identified with any named mode; no forgery, since a collision in the encoding is
    a statement about the encoding function and becomes a security statement only under further conditions
    this record does not establish and explicitly declines to assert; and no claim about the literature.
    A zero count in every convention is a complete and useful result: it is an exhaustively verified
    injectivity statement over a named finite class, which is stronger evidence than any amount of
    prose, and it names exactly which class was checked so the next reader knows where to look next.'
  mechanism: 'STAGE 1, zero compute: write each of the four encoding conventions as an explicit total
    function from (associated-data length, ciphertext length, padding bytes) to a bit string, with
    every rule made concrete -- field widths, endianness, padding fill, and the order of concatenation.
    Nothing is left implicit, because an implicit rule is where a collision hides. STAGE 2, zero compute:
    for each convention, derive by hand the structural condition for injectivity and record the predicted
    count of collisions inside the enumeration class before any enumeration runs. This is the pre-registration
    and it is what makes the enumeration a test rather than a survey. STAGE 3: enumerate the entire
    declared class exhaustively -- all length pairs up to the declared maxima at all supported field
    widths -- computing the encoding for each and inserting it into an exact hash table, counting
    collisions and recording every colliding pair in full. STAGE 4: compare the measured count against
    the stage-2 prediction; a mismatch is a defect in the hand derivation and is the most valuable
    outcome of the run, because it means the structural condition was wrong. STAGE 5: repeat the enumeration
    under a deliberately weakened variant of each convention -- one field width reduced by four bits
    -- as the positive control, so a zero count elsewhere is demonstrably a property of the encoding
    rather than of a broken enumerator. STAGE 6: rerun one convention with the primitive slot swapped
    to confirm invariance.'
  novelty_status: unverified
  novelty_screen:
    method: 'Grepped ledger/proposals/ and knowledge/ case-insensitively for: canonicaliz, length
      encoding, serializ, injectiv. Grepped ledger/proposals/, ledger/hypotheses/ and knowledge/ for
      aead, key commitment, GCM, SIV, associated data. Read RQ-AEADC-8db132 in full, including its
      target list, and RQ-POLYMAC-7c89e4 in full. Read the title, class and claim head of all eight
      proposals under RQ-AEADC-8db132. Read docs/inventor-protocol.md sections 1-5 and section 8,
      whose observation-collision audit is exactly the shape of this record.'
    results: 'The canonicalisation and injectivity grep matched a broad set of proposals outside this
      bucket -- IDEA-20260806-c5d183, IDEA-20260809-2ba70c, IDEA-20260805-6eac55, IDEA-20260813-945a67,
      IDEA-20260805-ca92fd, IDEA-20260812-b68bc0, IDEA-20260808-90c7ab, IDEA-20260813-87106b, IDEA-20260809-022eb5
      and IDEA-20260813-16d752, identified by filename match only. None of them is filed under RQ-AEADC-8db132.
      Within this bucket, IDEA-20260809-3a5c29 is the nearest neighbour: it separates key commitment
      from context commitment and mentions colliding on associated data or nonce, but its object is
      a certificate under two keys and its method is constructing collisions in an authenticator,
      not enumerating an encoding function. No record in the corpus performs an exhaustive injectivity
      audit of a length-encoding convention.'
    verdict: 'UNVERIFIED. Canonicalisation and length-encoding injectivity are standard concerns in
      protocol design outside this repository, and no assertion is made about what published work
      covers them; the four conventions audited here are declared internal models precisely so that
      nothing is attributed. What is claimed new is internal and modest: this repository contains
      no exhaustive enumeration of any encoding surface in an AEAD mode, and the AEADC bucket contains
      only commitment records. Assembled from known parts: the observation-collision audit of docs/inventor-protocol.md
      section 8, the finite-audit discipline this bucket''s directive requires, and ordinary exact
      enumeration.'
  object_first_candidate:
    tracked_object: The encoding string itself -- the exact byte sequence that the mode feeds to its
      authenticator to represent the boundary between associated data and ciphertext -- carried as
      the image of the map from (AD length, ciphertext length, padding, field widths) into byte strings,
      together with the fibre structure of that map.
    lossiness: 'This projection is lossy and the loss is the point: the encoding deliberately discards
      the associated data and ciphertext CONTENT and keeps only their lengths and framing. Dimension
      collapses from the full input space to a small tuple of integers. The discard is compatible
      with the mode''s operation because the authenticator consumes the content separately, so the
      length-encoding block is the only channel through which the boundary information travels. The
      retained part propagates deterministically: the encoding is a total function with no randomness.
      Being explicit about the honest risk here: within the encoding block alone nothing further is
      discarded once lengths are fixed, so at that inner level the map is a change of representation,
      not a further projection -- and saying so is required by section 2 rather than a weakness, because
      the outer projection from content to lengths is the genuinely lossy one and is where the audit
      lives.'
    propagation: One step of the target operation is extending the message or the associated data
      by one byte. It acts on the tracked object by incrementing one length coordinate, which changes
      the encoded string in a way that is either injective -- the intended behaviour -- or wraps a
      field, crosses a padding boundary, or is absorbed by a delimiter, all of which are exactly the
      mechanisms that produce a collision. The enumeration therefore walks the propagation directly
      rather than sampling it.
    survival_score: 'The object survives across the whole enumeration class by construction; what
      is measured is where injectivity dissolves. Concretely: the survival score is the smallest length
      pair at which the encoding first collides, per convention, reported as an exact pair of integers,
      or the statement that no collision exists anywhere in the declared class of all length pairs
      up to 2^20 bytes at every supported field width. This is an exact integer answer, not an estimate.'
  null_object_control: 'Two nulls executed in the same invocation. NULL ONE, the structural null:
    a deliberately weakened variant of each convention with one length field narrowed by four bits,
    which must produce a nonzero and exactly predictable collision count; if it does not, the enumerator
    is broken and a zero count elsewhere means nothing. NULL TWO, the primitive null this bucket''s
    directive names: rerun one convention with the block cipher replaced by a seeded ideal permutation,
    which must produce a byte-identical collision table, since an injectivity count cannot depend
    on the primitive. For the audit to mean anything, null one must be nonzero at its predicted count
    and null two must be exactly identical.'
  discriminated_from:
  - IDEA-20260809-3a5c29 collides on associated data or nonce while the key is committed. That record
    constructs collisions in an authenticator under two keys; this record enumerates a length-encoding
    function under no key at all, and its result is an integer count rather than a certificate.
  - RQ-POLYMAC-7c89e4 owns polynomial-MAC forgery bounds. This record never evaluates a MAC and would
    return the identical table with the authenticator deleted.
  - IDEA-20260809-4719b8's commitment harness returns a certificate or a derivation for commitment
    properties. This audit answers a different, decidable question about encoding injectivity and
    returns a count.
  - A generic argument that length fields should be unambiguous. This is not the argument; it is the
    exhaustive count, whose value may well be zero and is useful either way.
  - IDEA-20260809-439aa8 tests a padding-based commitment bound one bit below its claim. Padding appears
    in both, but there padding is a repair to be stress-tested and here padding is one of four encoding
    conventions whose injectivity is enumerated.
  assumptions:
  - The four declared conventions are faithful abstractions of encoding shapes that mode families
    actually use; they are declared as models and are not identified with any named mode, so a poor
    abstraction weakens relevance but cannot make the count wrong.
  - Enumerating all length pairs up to 2^20 bytes at every supported field width covers the region
    where a collision would first appear; if a convention collides only above that bound, the audit
    reports the class it checked and says so.
  - Exact integer arithmetic and an exact hash table make the count exact, with no sampling error
    of any kind.
  - An injectivity count is independent of the primitive, which is checked rather than assumed by
    null two.
  - Endianness, fill bytes and concatenation order are fully specified in stage 1, so no implicit
    rule can hide a collision.
  predictions:
  - metric: collision count for the trailing fixed-width length block convention within the declared
      class, at full field width
    direction: different
    minimum_effect: 0
  - metric: collision count for the zero-padding-with-no-length-field convention within the declared
      class
    direction: higher
    minimum_effect: 1
  - metric: collision count for each weakened positive-control variant
    direction: higher
    minimum_effect: 1
  - metric: byte-level difference between the collision tables under the real primitive and under
      the ideal permutation
    direction: different
    minimum_effect: 0
  - metric: agreement between the stage-2 hand-derived predicted count and the enumerated count, per
      convention
    direction: different
    minimum_effect: 0
  minimal_test:
    design: 'One process, zero cryptographic compute in the load-bearing part. Write the four encoding
      conventions as four pure functions in under two hundred lines total. Pre-register, per convention,
      the hand-derived structural injectivity condition and the predicted collision count inside the
      class. Then enumerate: for each convention, for each supported field width, for every length
      pair with associated-data length and ciphertext length each ranging over all values up to 2^20,
      compute the encoding and insert into a dictionary keyed by the encoded bytes, counting collisions
      and storing the first colliding pair in full. Repeat for the four weakened variants as positive
      controls. Rerun one convention with the primitive slot swapped, and diff the tables byte for
      byte. The discriminating comparison is the enumerated count against the pre-registered count,
      per convention. The whole audit runs in minutes on one core and needs no key material, no sampling
      and no statistics.'
    controls:
    - Weakened-variant positive control per convention, with a predicted nonzero collision count computed
      in stage 2.
    - 'Primitive-substitution null: identical enumeration with a seeded ideal permutation in the slot,
      requiring a byte-identical table.'
    - Pre-registered hand-derived count per convention, recorded with a file hash before the enumerator
      runs.
    - 'Round-trip decodability check: every encoding that the hand derivation calls injective is decoded
      back to its input pair and verified.'
    - An independent second implementation of one convention, written from the stage-1 specification
      alone, whose table must match the first.
    required_metrics:
    - exact collision count per convention per field width
    - the minimal colliding length pair per convention, emitted as bytes
    - stage-2 predicted count per convention and the signed difference from the enumerated count
    - collision count of each weakened positive control
    - byte-level table diff between primitive slots
    - count of encodings that fail the round-trip decodability check
  falsification_conditions:
  - A weakened positive control produces zero collisions, which means the enumerator does not detect
    collisions and every zero elsewhere is uninformative.
  - The enumerated count disagrees with the stage-2 hand-derived prediction, which falsifies the structural
    condition and is the most informative outcome available.
  - The primitive-substitution null produces a different table, which would mean the enumerator is
    reading something other than the encoding and the whole framing is wrong.
  - The independent second implementation of a convention produces a different table, indicating a
    specification ambiguity in stage 1 rather than a result.
  - Any encoding declared injective fails the round-trip decodability check.
  - The enumeration cannot be completed within the declared class at full field width, in which case
    the class checked is reported honestly and no statement is made about the rest.
  confounders:
  - An under-specified convention in stage 1 lets the implementer resolve an ambiguity silently, so
    the audit measures the implementer; the independent second implementation exists to catch exactly
    this.
  - Choosing a maximum length of 2^20 may sit below the first collision of a convention, producing
    a zero that reflects the class rather than the encoding.
  - Hash-table key comparison on unequal-length byte strings can accidentally normalise them; keys
    are compared as explicit length-tagged tuples.
  - A convention modelled more weakly than any real mode would produce collisions that mean nothing;
    this is why the conventions are declared models rather than attributed.
  - Field-width sweeps interact with the maximum length, and a width whose maximum exceeds the enumerated
    range cannot collide by wrapping within the class.
  interpretation_limits:
  - A collision in an encoding is a statement about a function, not a forgery and not a security consequence;
    converting one into the other requires conditions this record does not establish and does not
    assert.
  - The four conventions are declared models and are not identified with any named or deployed AEAD,
    so no result transfers to one without a separate mapping argument.
  - A zero count is a statement about the enumerated class only, and the class boundary is reported
    with the count.
  target_complexity:
    time_exponent: No attack exponent is claimed. The audit costs O(W times L^2) exact evaluations,
      with W the number of field widths and L the length bound, which is fully enumerated and not
      sampled.
    memory_exponent: No attack exponent is claimed. Memory is O(L^2) for the hash table at one field
      width, reduced to O(L) by streaming with a sorted-run merge if needed, and the choice is recorded.
    best_known: The incumbent is the design-level argument that a well-formed length encoding is injective
      by inspection. This record does not beat that argument; it replaces inspection with an exhaustive
      count over a named class, and the expected outcome for a well-formed convention is agreement.
    hidden_overhead: 'The human cost is in stage 1: fully specifying four conventions with no implicit
      rule is most of the work, and every unspecified rule is a place the audit silently measures
      the implementer instead of the encoding. Lower-order compute hides in the memory footprint at
      the largest field width, where the table may need streaming.'
  dominated_by: n/a (no result claimed). This is an exhaustive symbolic audit with no attack, so there
    is no time, memory or data frontier row it could sit on. Checked against all four targets of RQ-AEADC-8db132
    (certificates, k-way curve, repair audit, interface question) and all four targets of RQ-POLYMAC-7c89e4,
    and against the eight proposals under this question; none is an encoding-injectivity count.
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverable is
    four exact integers with their minimal colliding pairs or their exhaustively verified absence,
    plus a pre-registered prediction against each, where the corpus holds no such count.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'By part. That the audit completes and returns exact counts: about 0.95,
    since it is enumeration with no statistics and the only real risk is memory at the largest width.
    That at least one of the four conventions shows a nonzero count inside the declared class: about
    0.5, driven almost entirely by the padding-without-length-field convention, which is included
    precisely because its collision structure is expected and serves as a semi-control. That every
    stage-2 hand-derived prediction matches its enumerated count: about 0.6, and the 0.4 residual
    is the most valuable part of this record, because a mismatch means a structural argument that
    reads as obviously right is wrong. That the primitive-substitution null returns a byte-identical
    table: about 0.98, with the residual being an implementation leak of key material into the encoder.'
