idea:
  id: IDEA-20261016-e191a8
  question_id: RQ-SEMBIN-9e8f82
  status: proposed
  added: '2026-10-16'
  title: "Prop. 5's first-fall bound is a one-block, shift-covariant fact: a Frobenius-weight (carry) calculus certifies d'_F <= 4 for every coset shift at m >= 3, so a matched-pair first-fall test should pass and cannot corroborate Theorem 1"
  class: mechanism
  claim: |
    (C1) On E/F_{2^n}: y^2+xy=x^3+Ax^2+B take a chain with m >= 3 (so >= 1 block S_3 with three VARIABLE slots) and ANY shifts v_i, v=0 included. Multiplying by a free slot u gives deg_F2 [u*S_3^v] <= 3 < 1+3, with u*S_3^v not identically 0: Semaev 2015 Sec 4.5's argument. It survives the shift because x^{2^i} descends to an AFFINE form in the bits mod field equations, so Hamming-weight degree is translation-invariant (Lucas: (x+v)^a = sum_{b subset a} x^b v^{a-b}). Hence Nagao Def.6 d'_F(EQS4(m)) <= 4 whatever v, B, m: a syzygy of a subsystem is a syzygy of the system.
    (C2) Prop. 5 is the CHEAP step. Theorem 1's exposure is Assumption 1 (solving degree <= first fall) at N ~ n^2/C_0, which no d'_F pair test touches. A second carrier, the trace form (KR-IC-f5c584), is F_2-linear and survives the shift as an affine form. Invariance in a matched-pair d'_F test at m >= 3 is predicted and is not support for Theorem 1.
    (C3) Exact null: v_i in V makes EQS4 = EQS2 by a translation of Boolean variables (HKYY Prop 2.3(iv), 2.6(v)). The control "all v_i equal" of IDEA-20260913-352163 is exact only if the common value lies in V (S_3 is not translation-invariant); the exact null is v_i = 0 mod V.
  mechanism: |
    OBJECT FRAME. Representation: R1 (x on V+v, polynomial basis, Weil-descended to F_2). Sigma: translation by factor-base elements; Class I partial-action. Tracked object: the degree-fall vector of ONE S_3 block under multiplication by a slot variable. Lossy-projection test: keeps the exponent-weight profile, discards coefficients (A,B,v,R); Sigma-compatible (x -> x+v only adds lower-weight monomials), lossy (many coefficient sets share a profile), not a change of coordinates. KN-OPEN-020: scoped-out class; no escape claimed.
    Terms of u*S_3^v are u^3x^2, u^3u'^2, u x^2u'^2, u^2 x u', Bu, weights 3,3,3,3,1 for every v: the shift changes coefficients, never weights. Odd p: digit-sum version in notes (carry bounds 7 at p=3, 11 at p=5, vs Nagao's 3p+1 = 10, 16).
  novelty_status: adaptation
  citations:
    - {ref: "inputs/SEMAEV-2015-310 Sec 4.5 (KN-LIT-fa346d)", provenance: internal, claim: "deg_F2 S_3 = 3 = deg_F2 x1*S_3", verified_by: "read lines 561-600"}
    - {ref: "arXiv:1505.02532 Prop 2.3(iv), 2.6", provenance: retrieved, claim: "V_{F,i}, last fall invariant under Aff_m(k)", verified_by: "PDF pp.1-6 read"}
    - {ref: "KR-IC-f5c584 / KN-LIT-7604", provenance: kb, claim: "trace morphism gives a linear form", verified_by: abstract_read}
  assumptions: ["Equality reading of Nagao Def.5/6 condition (1). The repo draft papers/nagao-lemma4-note (internal, unverified here) reports d'_F < d_F examples, so Def5, Def6 and HPS-new-fall are reported separately.", "Weights are n-free; n enters only via non-vanishing and the HPS new-fall test (matrix, n <= 24)."]
  proof_search_map:
    bottleneck: "Nagao Prop. 5 (proof omitted, fn. 6)"
    baseline_embedding: {parameter_slice: "v=0, m=3", reproduction_check: "script gives 3 for x1*S_3 and 2 for S_3(x1,x2,z), as Semaev lines 570-597"}
    observation_collision: "ablation arms (carry vs trace vs neither) share d'_F and differ in fall-space dimension"
    quantifier_order: "FORALL v, m >= 3, EXISTS a degree-4 fall; weaker than Theorem 1 needs"
    method_ceiling: {strongest_certifiable_claim: "first fall <= 4 at m >= 3; nothing on solving degree", nearby_object_control: "m=2 block S_3(X1,X2,z) has no free slot: no fall predicted, pairs there NOT predicted invariant"}
  predictions:
    - {metric: "max weight-degree of [u*S_3^v], v symbolic", direction: lower, minimum_effect: "3 vs 4, all v, all m >= 3"}
    - {metric: "divergent d'_F pairs at m >= 3, n <= 24", direction: lower, minimum_effect: "0; a divergence is a bug or refutes C1"}
    - {metric: "rank profile for v_i in V vs v=0, D <= 5", direction: different, minimum_effect: "bit-identical; any difference is a defect"}
  minimal_test:
    design: "A (arithmetic): exponent-weight script, v symbolic, p=2,3,5. B (toy matrix, n <= 24, m=3,4 plus m=2 contrast): HPS new-fall test of the degree-3 vectors with the corrected XOR product (IDEA-20260929-688ea4). C (ablation): full / trace form quotiented / support-matched random block (no Frobenius structure); which arm keeps the fall at v=0 and v != 0. D: is the degree-4 fall space spanned by single-block witnesses?"
    controls: ["v in V null", "m=2 contrast", "support-matched null (should lose the fall)", "Nagao Example 1 fixture"]
    required_metrics: ["degree label (Def5/Def6/HPS-new/Macaulay)", "fall-space dimension per arm", "single-block-witness fraction"]
  falsification_conditions: ["Script weight >= 4 for some v, or no degree-4 fall at m >= 3 despite a certificate.", "A divergent pair at m >= 3 reproduced by a second implementation: the one-block explanation fails and Prop. 5 is global.", "v in V null differs: defect."]
  confounders: ["definition and S_fe membership change the value (EV-SEMBIN-c71cad)", "unsatisfiable instances give literal d'_F = 1: stratify", "XOR product", "basis and V"]
