  target_complexity: {time_exponent: "none claimed (audit)", memory_exponent: "none claimed", best_known: "Nagao O(n^{8w+1}) conditional; vOW 0.886*2^{n/2}", hidden_overhead: none, tradeoff_note: "relocates the open obligation from Prop 5 to Assumption 1"}
