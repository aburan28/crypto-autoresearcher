idea:
  id: IDEA-20260816-0e0e69
  question_id: RQ-ASCON-2dfd8b
  added: '2026-08-16'
  title: 'Pose the reduced-inter-block round count as a measurement over the REACHABLE INPUT SUBSPACE
    rather than over the permutation: measure the largest round depth at which a higher-order derivative
    still sums to zero when the summation cube is confined to the rate positions a duplex actually
    exposes, and compare that depth against unrestricted full-state cubes'
  class: measurement
  claim: '(A) A permutation-level statement -- an integral or zero-sum property holds to r rounds
    -- is not the quantity the mode''s round count should be compared against, because the mode does
    not let an adversary vary the whole state. Between data blocks a duplex exposes only the rate
    positions; the capacity is unknown and unset. The operative quantity is therefore the largest
    r such that a higher-order derivative over a cube CONFINED TO RATE POSITIONS still sums to zero,
    and the honest object is the reachable affine input subspace, not the permutation. (B) This proposal
    measures two curves over the same permutation implementation in the same invocation: depth(r)
    for cubes drawn only from rate positions, and depth(r) for cubes drawn freely from the full state.
    The gap between the two curves is the quantitative content of the phrase under the mode''s own
    constraints on what an adversary can inject and observe, and it is computable at small cube dimensions
    with no literature, no solver, and no attack. (C) NOT CLAIMED: any attack, any distinguisher of
    cryptographic consequence, any statement about how many rounds published analysis reaches, any
    comparison to a published bound, or any security margin. Zero sums at very small cube dimension
    over few rounds are expected for essentially any low-degree round function and are NOT evidence
    of weakness; the deliverable is a pair of curves and their gap. (D) NOT CLAIMED either: that the
    measured depth extrapolates to larger cube dimensions. It does not, and the record states the
    ceiling imposed by the affordable cube dimension explicitly, since 2^k evaluations at k above
    roughly 26 leaves the toy budget. (E) The measurement means nothing without the null: the identical
    cube summation runs against a state-size-matched null permutation built by replacing the round
    function''s nonlinear layer with a randomly drawn S-box of the same width, and the null''s depth
    curve must fall clearly below the signal''s or the measurement is detecting the shape of the experiment
    rather than the design.'
  mechanism: 'Stage one pins a permutation implementation and validates it against declared test vectors
    through the full modes, since a wrong implementation would manufacture a curve. Stage two defines
    the two cube families: RATE cubes with all summation indices inside the rate positions and all
    capacity positions held at a fixed declared constant, and FULL cubes with indices drawn anywhere
    in the state. Stage three, for each round count r from 1 upward and each cube dimension k from
    1 to the affordable ceiling, evaluates the r-round permutation over all 2^k cube points and XOR-accumulates
    the output state, recording for each of the state''s output bits whether the sum is identically
    zero across a declared number of independently drawn cube positions and fixed-part values. Stage
    four reports depth as the largest r at which any output bit still sums to zero for a stated fraction
    of drawn cubes. Stage five repeats everything for the null permutation in the same invocation.
    Stage six compares the RATE depth curve to the FULL depth curve. The finding is the GAP, and either
    sign of gap is informative: a large gap says permutation-level round numbers overstate what the
    mode exposes; no gap says the mode''s restriction buys nothing measurable at this cube dimension.'
  novelty_status: unverified
  novelty_screen:
    method: 'Shared repository screen: grep -ril ascon over ledger/proposals, ledger/hypotheses, ledger/evidence
      and experiments; grep -il over ledger/proposals/*.yaml for sponge, duplex, capacity, avalanche,
      algebraic degree, division property and diffusion (the diffusion-family list truncated at head
      -20 and is reported as partial). Read: ledger/questions/RQ-ASCON-2dfd8b.yaml in full, ledger/goals/GOAL-ASCON-001.yaml
      first 60 lines, docs/inventor-protocol.md sections 1 through 8, ledger/proposals/IDEA-20260807-c4f1fc.yaml
      first 40 lines, and the headers of knowledge/techniques/KN-TECH-073.md (cube attacks and cube
      testers) and knowledge/techniques/KN-TECH-074.md (division property and monomial prediction).'
    results: grep -ril ascon returned no ledger record whatsoever. The algebraic-degree/division-property/diffusion
      grep returned twenty proposal filenames before truncation, among them IDEA-20260805-01dfba,
      IDEA-20260805-33a11e, IDEA-20260805-4bd60c, IDEA-20260805-5b8f95, IDEA-20260805-62359f, IDEA-20260805-72ec9a,
      IDEA-20260805-78d9bd, IDEA-20260805-8053e1, IDEA-20260805-86e431, IDEA-20260805-947f67, IDEA-20260805-b9047c,
      IDEA-20260805-c8c0d4, IDEA-20260805-f2fc33, IDEA-20260807-63056d, IDEA-20260807-7270d1, IDEA-20260807-7e16ac,
      IDEA-20260807-a6fb2a, IDEA-20260807-c4f1fc, IDEA-20260808-4c309d and IDEA-20260731-006 -- filenames
      seen, contents not read except IDEA-20260807-c4f1fc. KN-TECH-073 records cube attacks and cube
      testers as an established technique whose applicability line explicitly includes keyed sponge
      modes; KN-TECH-074 records division property and monomial prediction as the standard way to
      decide integral-distinguisher survival, noting the naive bit-based tracking is exponential in
      state size. IDEA-20260807-c4f1fc states that KN-TECH-073 and KN-TECH-074 are cited once and
      twice respectively, both only on the AES side, and that no record in the repository treats an
      unkeyed permutation as a cryptanalytic target.
    verdict: 'UNVERIFIED. No agent here can read external literature and nothing in this record asserts
      what it contains -- in particular nothing is asserted about how far any published integral or
      cube analysis of any permutation reaches. Claimed NEW relative to this repository: measuring
      zero-sum depth over the MODE-REACHABLE rate subspace and against the unrestricted full state
      as two separate curves whose GAP is the deliverable, with the round-count comparison posed against
      the inter-block count rather than against twelve. ASSEMBLED FROM KNOWN PARTS: higher-order derivative
      summation and zero-sum measurement are the elementary content of KN-TECH-073 and KN-TECH-074,
      both already in this corpus; the null-permutation control is docs/inventor-protocol.md section
      3; the observation that this corpus treats permutations as ideal objects is IDEA-20260807-c4f1fc''s,
      not this record''s.'
  object_first_candidate:
    tracked_object: 'The reachable input subspace of the permutation as the mode exposes it: the affine
      subspace obtained by fixing every capacity position to a declared constant and letting a chosen
      k-subset of rate positions range over all 2^k values, carried through r rounds and collapsed
      to a single XOR-sum of the output state. The object is the SUBSPACE together with its image
      sum, not the permutation and not any individual state.'
    lossiness: 'Lossy, and the loss is the entire point. Discarded: all 2^k individual output states,
      retaining only their XOR-sum -- a projection from 2^k times 320 bits down to 320 bits. Also
      discarded: every capacity value other than the declared fixed constant, and every rate position
      outside the cube. The discard is compatible with the target operation because XOR-summation
      over an affine subspace commutes with the linear layer and annihilates every monomial of degree
      below the cube dimension, so the retained sum still propagates deterministically through the
      round function''s linear parts and degrades predictably through its nonlinear part. It is emphatically
      not a change of coordinates: the sum is not invertible to the subspace, and two different subspaces
      routinely give the same sum.'
    propagation: One round acts on the tracked object by raising the algebraic degree of each output
      coordinate as a polynomial in the cube variables. A zero sum over a k-dimensional cube persists
      exactly while every output coordinate's degree in those variables stays below k. The substitution
      layer multiplies degree by at most the S-box degree per round; the linear layer preserves degree
      but redistributes which variables appear where; and the capacity positions, being fixed constants,
      contribute only to the coefficients, not to the variable set -- which is precisely why a rate-confined
      cube can behave differently from a full-state cube of the same dimension. Propagation of the
      object over successive rounds is therefore the growth of the variable-degree profile, and the
      depth at which the sum stops vanishing is where that profile crosses k.
    survival_score: 'Survival is measured directly and reported as a number: the largest round count
      r at which the XOR-sum is still identically zero for a stated fraction of independently drawn
      cubes, separately for rate-confined and full-state cubes, at each cube dimension k from 1 to
      the affordable ceiling. The structure dissolves when degree growth exceeds the cube dimension,
      and because the affordable k is bounded by 2^k evaluations, the measured depth is a LOWER-BOUND-STYLE
      observation confined to small k, stated as such. No extrapolation to larger k is offered.'
  null_object_control: A state-size-matched NULL PERMUTATION assembled in the same code, same invocation,
    from the identical linear layer and round-constant schedule but with the nonlinear layer replaced
    by a randomly drawn bijective S-box of the same width, drawn from a recorded seed. The identical
    cube summation, identical round sweep, identical cube dimensions and identical fixed-capacity
    constants are run against it. For the signal arm's depth curve to mean anything, the null's depth
    curve must sit clearly below it at matched k; if the two curves coincide, the measured depth reflects
    the linear layer and the state size rather than the design, and the correct record is a controlled
    null. A second null replaces the whole permutation with a random bijection realised as a keyed
    pseudorandom permutation over the state, whose depth curve should collapse to the smallest r for
    every k above 1.
  discriminated_from:
  - KN-TECH-074 (division property and monomial prediction). That technique DECIDES whether an integral
    distinguisher exists using an MILP or SAT model of degree propagation; this record makes no such
    decision and runs no solver. It measures observed zero-sums directly at small cube dimension,
    which is strictly weaker and strictly cheaper, and it measures them over a mode-restricted subspace
    that a permutation-level division-property model does not represent.
  - KN-TECH-073 (cube attacks and cube testers). Cube attacks recover superpolies in secret key bits;
    there is no secret key anywhere in this record, no key recovery is attempted, and the quantity
    produced is a depth curve, not an equation system.
  - IDEA-20260807-c4f1fc, which observes that this corpus models permutations as ideal objects and
    proposes a structured-input axis specific to SLH-DSA's tweakable hash. That record's object is
    the ADRS-indexed input set of a keyed tweakable hash; this record's object is the rate-confined
    affine subspace of an unkeyed permutation inside a duplex.
  - GOAL-SHA3-001, which GOAL-ASCON-001 names as owning internal-differential analysis of Keccak-f.
    Different permutation, different object (internal differentials versus higher-order derivatives),
    and GOAL-ASCON-001 explicitly instructs this goal to measure only against the standardized round
    counts and to defer permutation-frontier questions, which this record does.
  - The AES r=5..7 measured effects with their null controls, named in this session's briefing as
    an established internal result. That work is over a keyed block cipher with chosen-plaintext access;
    the object here is unkeyed with attacker-visible state and a mode-imposed subspace restriction,
    and no AES number is reused or re-derived.
  assumptions:
  - A permutation implementation can be pinned and validated against declared test vectors through
    the full modes before any measurement; without that gate the curves describe an implementation
    this program invented.
  - The rate/capacity split and the inter-block round count can be pinned from primary text; until
    they are, the experiment runs as a parameterized sweep over candidate splits and counts and reports
    the curve per candidate rather than asserting the standard's values.
  - Zero-sum depth at small cube dimension is a meaningful comparative quantity between two arms measured
    identically, even though its absolute value is not a security quantity.
  - The randomly drawn null S-box preserves the linear layer's contribution so that the two arms differ
    in exactly the nonlinear component, verified by asserting the two implementations share the same
    linear-layer code path.
  - 2^k evaluations at the declared k ceiling fit the toy compute budget on a single machine, so no
    sampling of the cube is needed and the sums are exact.
  predictions:
  - metric: zero-sum depth for rate-confined cubes minus depth for full-state cubes, at matched cube
      dimension k
    direction: lower
    minimum_effect: 'no numeric pre-commitment, and the refusal is deliberate: the sign is expected
      to be non-positive because a rate-confined cube is a special case of a full-state cube, but
      any pre-committed magnitude would be invented, since this program has no prior measurement of
      this permutation at all'
  - metric: zero-sum depth for the signal permutation minus depth for the random-S-box null at matched
      k
    direction: higher
    minimum_effect: at least 1 round at some k in the tested range; if the two curves coincide at
      every k the measurement is recorded as a controlled null and the signal arm is not interpreted
  - metric: zero-sum depth for the full random-bijection null
    direction: lower
    minimum_effect: 'forced value: depth 1 at every cube dimension above 1, since a random bijection
      has no reason to preserve a higher-order derivative; observing otherwise indicates an instrument
      defect'
  - metric: monotonicity of measured depth in cube dimension k
    direction: higher
    minimum_effect: depth must be non-decreasing in k, a forced structural property; any decrease
      is a bug and halts the run
  minimal_test:
    design: Pin and test-vector-validate a pure-Python permutation. Fix all capacity positions to
      a declared constant. For k from 1 to 20 and r from 1 to 8, draw a declared number of random
      k-subsets of the rate positions and, for each, XOR-accumulate the r-round output over all 2^k
      cube points, recording whether the accumulated state is exactly zero and, if not, its Hamming
      weight. Repeat with k-subsets drawn from the full state. In the SAME invocation, repeat both
      sweeps against the random-S-box null and the random-bijection null built from the same code.
      The discriminating output is four depth curves. At k=20 and r=8 this is roughly a million permutation
      evaluations per cube, tens of cubes per cell -- minutes to a couple of hours in optimised Python
      with bitsliced 64-bit words, and a small fraction of that at the k values where the curves separate.
    controls:
    - 'Random-S-box null permutation: identical linear layer and constants, randomly drawn bijective
      S-box, same invocation, seed recorded.'
    - 'Random-bijection null: the whole permutation replaced by a keyed pseudorandom permutation over
      the state, whose depth must collapse.'
    - 'Fixed-capacity-constant sweep: the entire measurement repeated at three declared capacity constants,
      so a curve cannot be an artifact of one constant.'
    - Test-vector gate on the pinned permutation before any sweep, run through the full modes and
      not only the bare permutation.
    - Monotonicity assertion in k, checked automatically, since a decrease in measured depth with
      larger cubes is structurally impossible and indicates an accumulator bug.
    - Degenerate-cube control at k=0, where the sum is a single output state and must never be zero
      for a nondegenerate permutation.
    required_metrics:
    - zero-sum depth per arm, per cube dimension k, per cube family (rate-confined / full-state)
    - fraction of drawn cubes achieving an exactly zero sum, per (arm, k, r) cell
    - Hamming weight distribution of the nonzero accumulated sums, per cell
    - the rate-minus-full depth gap per k, as the headline derived quantity
    - test-vector agreement at the gate
    - permutation evaluations performed and wall-clock per cell, with seeds
  falsification_conditions:
  - The random-S-box null's depth curve matches the signal's at every tested k, making the measurement
    a controlled null.
  - The random-bijection null shows depth above 1 at any k above 1, indicating an accumulator or evaluation
    defect.
  - Measured depth decreases with increasing k anywhere, which is structurally impossible and indicates
    a bug.
  - The k=0 degenerate control returns a zero sum, indicating the accumulator is not accumulating.
  - The depth curve changes qualitatively across the three fixed-capacity constants, showing the result
    is a constant artifact rather than a property of the subspace family.
  - The permutation fails any declared test vector, which voids every downstream number.
  - The affordable cube dimension turns out to be below the k at which the two families separate,
    in which case the run reports a budget outcome and no depth gap -- never negative mathematical
    evidence.
  confounders:
  - Fixing capacity to a constant is itself a choice, and a special constant (all zeros, for instance)
    could create or destroy zero sums; the three-constant sweep is the mitigation and it is not exhaustive.
  - Small cube dimensions are exactly the regime where low-degree behaviour is generic, so an apparent
    depth is easily an artifact of k being small rather than of the design; this is why only the arm-to-arm
    gap is interpreted and never the absolute depth.
  - An implementation with the wrong bit or byte ordering changes which positions count as rate, silently
    redefining the rate-confined family -- and endianness is itself one of the reported submission-to-standard
    differences.
  - Random cube-position draws could over-sample a structurally special region of the rate; the number
    of draws per cell and their seeds must be recorded and a stratified draw considered.
  - Optimised bitsliced evaluation is a second implementation of the permutation and can disagree
    with the reference one; a cross-check on a random sample is required or the speed gain buys a
    wrong curve.
  interpretation_limits:
  - A measured zero-sum depth is NOT a security margin, NOT a distinguisher of cryptographic consequence,
    and NOT comparable to any published round reach -- this program cannot read published round reaches
    and asserts nothing about them.
  - The depth is measured only at cube dimensions the budget affords and does not extrapolate to larger
    cubes; the ceiling is stated with the result.
  - The rate-minus-full gap is a statement about two families of affine subspaces under one implementation
    at one set of capacity constants, not about what any adversary can do.
  - If the inter-block round count is not pinned from primary text, every curve is reported per candidate
    count and no candidate is asserted to be the standard's.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement's own cost is 2^k permutation evaluations
      per cube, with k bounded by the declared ceiling of about 20 to 24 on a toy budget.
    memory_exponent: No attack exponent is claimed. Memory is constant per cube -- one 320-bit accumulator
      -- plus the curve table, so the measurement is memory-trivial by construction.
    best_known: 'The incumbent quantity is the informal comparison the RQ criticises: a permutation-level
      round reach set against the number twelve. This record''s competitor is that comparison, and
      within this repository there is no measured competitor at all, since the ascon grep returned
      zero ledger records and IDEA-20260807-c4f1fc records that no repository record treats an unkeyed
      permutation as a target.'
    hidden_overhead: 'Two costs hide. First, pinning: the rate/capacity split, the bit ordering and
      the inter-block round count must all come from primary text, and the sweep-over-candidates fallback
      multiplies the run matrix by the number of candidates. Second, the bitsliced evaluator: getting
      a fast permutation right is where implementation time and correctness risk actually go, and
      the cross-check against the reference implementation is mandatory human and machine cost that
      a naive plan omits.'
  dominated_by: 'n/a (no result claimed). Pareto check made explicitly across all three axes: time
    -- no attack time is produced, so there is no row to place on a time frontier; memory -- the measurement
    is constant-memory and produces no attack memory figure; data/queries -- the permutation is evaluated
    offline with zero oracle queries, so there is no data axis either. The statement is made after
    considering each axis rather than defaulted.'
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative delta is that
    a comparison currently made in words -- reduced round count versus permutation round reach --
    is replaced by two measured curves with a stated gap, a stated cube-dimension ceiling, and two
    null arms, where this repository previously held zero measurements of the object.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Separately: that the permutation can be pinned and test-vector-validated
    here, about 0.35, limited by primary-text access. That the random-bijection null collapses to
    depth 1 as predicted, above 0.95, since that is near-certain structurally and mostly checks the
    instrument. That the random-S-box null''s curve separates from the signal''s at some affordable
    k, about 0.5 -- at very small cube dimensions almost any low-degree round function looks alike,
    and this is the single most likely way the experiment ends in a controlled null. That a measurable
    rate-versus-full depth gap appears at affordable k, about 0.4, since the restriction only bites
    once degree growth is sensitive to which positions vary. That the result, whichever way it lands,
    is a usable measured obstruction rather than a fatigue report, above 0.8, because a controlled
    null here is itself the reportable statement that small-cube depth does not discriminate.'
