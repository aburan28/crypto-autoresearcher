# IDEA-20261004-5bcc54
# Multiplication-degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261004-5bcc54
  question_id: RQ-JINV-8fc13a
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    Multiplication by 16 has degree 256 and multiplication by 15 has degree 225
  class: measurement
  claim: >-
    Multiplication by 16 has degree 256. Multiplication by 15 has
    degree 225. Two hundred fifty-six exceeds two hundred twenty-five
    by 31. The product of the two degrees is 57600. Their sum is 481.
    The gap is a map degree, not an ECDLP exponent and not the degree
    pair 225 and 196.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Sixteen squared is 256. Fifteen squared is 225. Two maps of
    degree 225 have gap 0 and product 50625. No point is mapped.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question treats End(E) as a ring and asks for any
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-IC-889857
      provenance: internal
      claim: >-
        A first-fall-degree dispute is a different object from these
        two multiplication degrees.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The multipliers 16 and 15 are frozen before the squares are taken.
    - No point is mapped.
  proof_search_map:
