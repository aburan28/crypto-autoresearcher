idea:
  id: IDEA-20260829-9e6650
  question_id: RQ-DIFFP-a5c483
  goal_id: GOAL-DIFFP-84d641
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    STOP TRYING TO FALSIFY "NEW" AND START CERTIFYING "NOT NEW": replace the
    adjudicator's bare verdict with a compact NON-NOVELTY CERTIFICATE that an
    independently written checker accepts without re-running the adjudicator,
    and use certificate acceptance as the discriminator that this campaign's
    verdict-based controls measured to have zero power against known-false
    instruments
  class: control

  claim: >-
    (A) THE EPISTEMIC CLAIM, AND IT IS THE POINT. "This differential path is
    NEW" is an existential over an unenumerated body of literature and cannot
    be falsified by any finite artifact. Its NEGATION can: "this path is not
    new" is refuted or established by a WITNESS -- a census entry identifier
    together with a group word and, where a published family is implemented as
    a parameterised generator, the generating parameter -- such that applying
    the witness to the entry reproduces the candidate exactly, byte for byte,
    under the declared canonicalisation. Novelty claims should therefore be
    re-typed: what an adjudicator can honestly assert is either A CERTIFIED
    NON-NOVELTY, carrying its witness, or NO WITNESS FOUND BY EXTRACTOR E
    WITHIN BUDGET B, which is a budget outcome about a solver and NOT a novelty
    claim at all. This converts census incompleteness from an unstated
    precondition into an explicit, quantified residual.
    (B) THE FALSIFIABLE, MEASURABLE CLAIM, AND IT IS WHAT THE EXPERIMENT
    ACTUALLY TESTS. This campaign has measured that a set of KNOWN-FALSE
    adjudicators -- including one whose canonical key cannot see the message
    difference at all, and one that returns NON-MEMBER for every object -- are
    INDISTINGUISHABLE from the honest adjudicator under its verdict-based
    controls: identical planted-positive recall and null false-positive rates,
    and a differing-cell count of zero over the adjudicated cells. THE CLAIM IS
    THAT CERTIFICATE EMISSION SEPARATES THEM WHERE VERDICT COMPARISON DOES NOT.
    Specifically: an independently written certificate checker accepts the
    honest adjudicator's witnesses on at least 95 percent of planted MEMBER
    objects and their images under every verified generator, and accepts at
    most 0 percent of the witnesses emitted by every known-false instrument in
    the declared set. IF INSTEAD the known-false instruments also produce
    accepted certificates, the certificate adds no power over the verdict, this
    proposal's central contention is false, and that is a clean negative that
    would tell this program something important about how weak its object
    representation is.
    (C) NO NOVELTY CLAIM OF ANY KIND FOLLOWS. With a readable census of size
    zero, a certified non-novelty is impossible for want of entries and a
    "no witness found" outcome carries no information about the literature.
    The measurement is entirely against the synthetic planted population, and
    that is stated as its scope rather than discovered later.

  mechanism: >-
    THE STRUCTURAL DIAGNOSIS. An adjudicator that emits only a verdict asks the
    reader to trust the adjudicator. Everything this campaign has measured
    across four batches is a consequence of that: passing controls that
    degenerate instruments also pass, an ablation battery whose output cannot
    be read without a dependency graph, and finally a differing-cell count that
    could not tell the honest instrument from one that identifies nothing. Each
    round strengthened the CONTROL AROUND the verdict; none changed the
    verdict's TYPE. A bare boolean carries no evidence of how it was reached,
    so no amount of surrounding control can recover what the boolean threw
    away.
    THE MECHANISM IS TO CHANGE THE TYPE. A MEMBER verdict becomes a pair
    (verdict, witness) where the witness is a short object -- entry identifier,
    group word, optional generator parameter -- and a SEPARATE, INDEPENDENTLY
    IMPLEMENTED CHECKER recomputes the candidate from the entry and the witness
    and compares byte for byte. The checker takes NO INSTRUMENT ARGUMENT, so it
    structurally cannot special-case which adjudicator it is serving, which is
    the strongest form of the null-control guarantee this campaign already
    identified as necessary.
    WHY THIS SEPARATES THE KNOWN-FALSE INSTRUMENTS, MECHANISTICALLY AND NOT BY
    HOPE. A witness must RECONSTRUCT the candidate. An adjudicator whose
    canonical key does not include the message difference has, by construction,
    no information from which to emit a group word that reproduces the
    candidate's message difference; it can emit a verdict, because a verdict is
    a comparison of impoverished keys, but it cannot emit a reconstruction. An
    adjudicator that returns NON-MEMBER for everything emits no witness at all
    and is caught by recall at once. An adjudicator that returns MEMBER for
    everything must emit a witness for objects that have none, and the checker
    rejects it. THE ASYMMETRY IS THE MECHANISM: verdicts are cheap to fake and
    reconstructions are not.
    THE DUAL CERTIFICATE, WHICH COMPLETES THE PICTURE. Non-membership cannot be
    witnessed in general, but DISTINCTNESS FROM A SPECIFIC ENTRY can, by
    exhibiting a group-INVARIANT whose value differs on the candidate and the
    entry. For SHA-1 the (x+1)-adic valuation profile of IDEA-20260829-f2ffc1
    is exactly such an invariant, being unchanged by multiplication by any unit
    and hence by every rotation. A NON-MEMBER verdict then decomposes into N
    per-entry distinctness certificates plus ONE explicit, quantified residual:
    the census is incomplete by a stated amount. That residual is the honest
    remainder that the current design leaves implicit and that every reader of
    a NON-MEMBER verdict has to reconstruct for themselves.
    THE LOSSY-PROJECTION TEST, ANSWERED HONESTLY AND IN THE NEGATIVE. The
    tracked object here is NOT new. The canonical form is the lossy projection
    -- it discards the group coordinate -- and the witness is precisely that
    discarded coordinate handed back, so the pair (canonical form, witness) is
    LOSSLESS and is a change of coordinates on the existing object, not a new
    object. THIS PROPOSAL IS THEREFORE A CHANGE OF VERDICT SEMANTICS AND OF
    CONTROL ARCHITECTURE, NOT A NEW TRACKED OBJECT, and saying so plainly is
    cheaper than being caught by the test later. Its value, if any, is entirely
    in the discriminating power measured in claim B.

  novelty_status: unverified
