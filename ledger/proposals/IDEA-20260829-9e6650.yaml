  assumptions:
    - >-
      The committed adjudicator's canonicalisation is deterministic and its
      serialisation is byte-stable, so a witness check can be an exact
      comparison rather than a tolerance. If it is not, the certificate format
      needs a normalisation step and that step becomes a new trusted component
      -- which would be a finding in itself.
    - >-
      The set of known-false instruments used as the discriminating population
      is the one this campaign already built. THEY WERE BUILT ONCE BY ONE
      SESSION AND RE-EXECUTED FROM THE SAME FILE, which the program's own
      technique entry records as re-execution and NOT independent construction.
      This proposal inherits that limitation and does not paper over it; at
      least one additional known-false instrument must be constructed
      independently for this round or the population is a single point.
    - >-
      Witness extraction searches the finite equivalence group. Where that
      group is large the extractor is capped and completeness becomes
      budget-limited, which is why "no witness found" is typed as a budget
      outcome rather than as a verdict.

  proof_search_map:
    bottleneck: >-
      The adjudicator's verdict is an unaccompanied boolean, so nothing about
      it is checkable except by re-running it. Every control this campaign has
      built surrounds that boolean instead of replacing it, which is why five
      known-false instruments survive the strengthened suite and why the
      differing-cell count has no measured capacity to separate the honest
      instrument from one that identifies nothing.
    baseline_embedding:
      parameter_slice: >-
        Discard the witness field and the checker, and the design collapses
        EXACTLY to the committed verdict-only adjudicator with its existing
        controls. That collapse must be verified, not assumed: on the frozen
        planted population, the verdicts emitted by the certificate-augmented
        adjudicator must equal the committed adjudicator's verdicts on 100
        percent of objects.
      reproduction_check: >-
        A frozen regression fixture comparing the two verdict vectors object by
        object. Any disagreement means the augmentation changed the decision
        rather than only its evidence, and the run is void until explained.
    observation_collision:
      observable: >-
        The accepted certificate, i.e. the pair (verdict, witness) that survives
        the independent checker.
      distinct_preimage_search: >-
        Search for two DISTINCT ground-truth situations producing the same
        accepted certificate, one on each side of the conclusion. The natural
        candidate: a candidate object that genuinely IS the group image of a
        census entry, and a candidate that merely SERIALISES identically after
        canonicalisation for an unrelated reason -- a canonicalisation
        collision. If one exists, the certificate is not identifying and the
        design fails at the same point the verdict does. Run it at 10^5 draws
        over the planted population and its images, and report the collision
        count as a first-class metric rather than as a footnote.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Re-type the adjudicator's output from a boolean to a
          checkable-witness sum type: CERTIFIED_NON_NOVEL(witness) or
          NO_WITNESS_FOUND(extractor, budget). Membership becomes an existence
          claim with an exhibited object; non-membership becomes an explicitly
          budget-scoped search outcome.
        predicted_gain: >-
          Third-party checkability of every positive verdict at O(1) cost, and
          correct typing of every negative verdict, replacing a vacuous
          NON-MEMBER with a statement that says what was searched and how much.
      - transform: stronger_invariant
        proposed_object: >-
          A per-entry DISTINCTNESS certificate: a group-invariant value that
          differs between candidate and entry, so that a NON-MEMBER verdict
          decomposes into N checkable distinctness facts plus one quantified
          census-completeness residual.
        predicted_gain: >-
          The census-completeness gap moves from an unstated precondition to a
          reported number, which is the only honest form a novelty statement can
          take while the readable census is empty.
    quantifier_order: >-
      CERTIFIED NON-NOVELTY: "THERE EXISTS a census entry e and a group element
      g such that g applied to e equals the candidate" -- a bare existential,
      discharged by exhibiting the pair, checkable in O(1), and this is the
      whole reason the direction is tractable. NOVELTY: "FOR ALL published
      objects p and FOR ALL group elements g, g applied to p is not the
      candidate" -- universally quantified over an UNENUMERATED set, which is
      why it is not falsifiable and why this proposal declines to claim it in
      either direction. THE ASYMMETRY OF THESE TWO QUANTIFIER SHAPES IS THE
      RECORD'S ENTIRE EPISTEMIC CONTENT and is stated here rather than left for
      a reader to notice.
    method_ceiling:
      strongest_certifiable_claim: >-
        That a specific candidate is the image of a specific census entry under
        a specific group element, checkable by anyone in O(1); and, separately,
        that a specific candidate is distinct from every entry of a specific
        census under a specific invariant. IT CAN NEVER CERTIFY NOVELTY, cannot
        certify anything about objects outside the census, cannot make an empty
        census informative, and does not improve any attack. Its ceiling
        against the known-false instruments is bounded by the population of
        such instruments actually built, which is currently four re-executed
        from one file.
      nearby_object_control: >-
        THE INSTRUMENT ON WHICH THE HOPED-FOR CONCLUSION MUST FAIL: an
        adjudicator that is honest in its key but whose WITNESS EXTRACTOR is
        replaced by one that emits the correct group element by consulting the
        planted population's construction log rather than by searching. It
        passes every certificate check and is nonetheless a cheat. If the
        design cannot distinguish it, then certificate acceptance measures
        access to the construction log and not adjudication, and that must be
        reported. The declared separator is that the checker is run on objects
        whose construction log is withheld from the extractor by mechanism, not
        by instruction.
    proof_obligations:
      - claim: >-
          PO-1 SOUNDNESS. If the checker accepts a witness, then the candidate
          IS the image of the named entry under the named group element. Proved
          by construction (the checker recomputes and compares bytes) and tested
          against adversarial witnesses.
        responsibility: correctness
      - claim: >-
          PO-2 COMPLETENESS, BUDGETED. If a candidate is the image of some
          entry under some group element and the extractor's budget covers the
          group, a witness is found. Stated with the budget, and violated
          knowingly whenever the budget is smaller than the group.
        responsibility: success_probability
      - claim: >-
          PO-3 INDEPENDENCE. The checker is implemented from the certificate
          SPECIFICATION by a party with no access to the extractor's source,
          and takes no instrument argument.
        responsibility: interface
      - claim: >-
          PO-4 NON-INTERFERENCE. Adding the witness changes no verdict; the
          verdict vectors of the augmented and committed adjudicators agree on
          100 percent of the frozen population.
        responsibility: baseline
      - claim: >-
          PO-5 SCOPE. Every reported acceptance rate names the census
          (readable 0, quarantined 1, gap 8, shadow 16, never summed), the
          generator set with each generator's verification status, and the
          instrument population; and no acceptance rate is reported as a
          novelty statement.
        responsibility: scope

  predictions:
    - metric: >-
        honest_certificate_acceptance_rate (fraction of planted MEMBER objects
        and their images under every verified generator for which the honest
        adjudicator's witness is accepted by the independent checker)
      direction: higher
      minimum_effect: >-
        at least 0.95. Below that, the honest instrument cannot reconstruct its
        own positives and the design is not usable.
    - metric: >-
        known_false_certificate_acceptance_rate (same, for each known-false
        instrument, reported PER INSTRUMENT and never averaged)
      direction: lower
      minimum_effect: >-
        at most 0.0 for the message-difference-blind instrument and for the
        always-MEMBER instrument; the always-NON-MEMBER instrument emits no
        witness and is scored 0 by definition, which is reported as
        BY-CONSTRUCTION and not counted as discriminating power.
    - metric: >-
        certificate_separation_margin (honest acceptance rate minus the maximum
        known-false acceptance rate)
      direction: higher
      minimum_effect: >-
        at least 0.95, against a MEASURED baseline of 0.0 for the
        differing-cell count over the same instrument pair. This is the single
        number the proposal lives or dies by.
    - metric: >-
        adversarial_witness_rejection_rate (fraction of deliberately malformed
        or wrong witnesses the checker rejects)
      direction: higher
      minimum_effect: >-
        exactly 1.0 over at least 3000 adversarial witnesses. A checker that
        never rejects is not a checker.
    - metric: >-
        canonicalisation_collision_count (distinct ground-truth objects sharing
        one accepted certificate)
      direction: lower
      minimum_effect: >-
        0 over 10^5 draws. Any collision is a direct falsifier of
        identifiability and must be reported before any acceptance rate.
    - metric: >-
        construction_log_cheat_acceptance_rate (the nearby-object control
        instrument)
      direction: higher
      minimum_effect: >-
        expected to be high, near 1.0, and REPORTED AS A LIMIT rather than as a
        success: it bounds what certificate acceptance can mean. If it is low,
        the withholding mechanism is doing more work than expected and that must
        be explained.
    - metric: >-
        verdict_noninterference_rate (agreement between augmented and committed
        adjudicator verdicts)
      direction: higher
      minimum_effect: exactly 1.0
    - metric: >-
        witness_extraction_wall_clock_per_candidate_milliseconds
      direction: lower
      minimum_effect: >-
        below 100 ms at the declared group budget; reported with the budget, so
        that a fast extractor that searched almost nothing is visible as such.

  minimal_test:
    design: >-
      ONE EXECUTOR TASK AGAINST THE FROZEN, UNMODIFIED COMMITTED ADJUDICATOR,
      in five stages, spending no acquisition and no search. STAGE 0 writes the
      CERTIFICATE SPECIFICATION as a standalone document -- witness grammar,
      acceptance predicate, distinctness-certificate format -- and freezes it
      before any code. STAGE 1 implements the witness extractor as a wrapper
      that calls the adjudicator's existing canonicalisation and searches the
      declared group up to a declared budget. STAGE 2 implements the CHECKER
      INDEPENDENTLY FROM THE SPECIFICATION ALONE, taking no instrument
      argument and having no access to the extractor's source, and discharges
      PO-3 by recording the construction path. STAGE 3 runs the two-sided
      battery: planted MEMBER objects and all their images under every verified
      generator (recall side), decoys and random negatives (soundness side),
      and at least 3000 deliberately malformed or wrong witnesses (checker
      capacity side). STAGE 4 repeats the entire battery for the honest
      instrument and for EACH known-false instrument separately, reporting a
      per-instrument acceptance vector and NEVER an aggregate, then runs the
      construction-log cheat control and the canonicalisation-collision hunt.
      All tables emit unmeasured cells as null, never as integer 0.
    controls:
      - >-
        POSITIVE CONTROL, AND IT MUST FIRE FIRST: the honest instrument's
        witnesses on the planted population must be ACCEPTED. An instrument
        that cannot certify its own known positives certifies nothing, and no
        negative from any other arm may be read from such a run.
      - >-
        CHECKER-CAPACITY CONTROL: at least 3000 adversarial witnesses that the
        checker MUST reject, so that acceptance is a decision and not a
        constant. A control that cannot fail is not a control.
      - >-
        NULL INSTRUMENTS, PER INSTRUMENT AND NEVER AVERAGED: the
        message-difference-blind adjudicator, the always-MEMBER adjudicator,
        the always-NON-MEMBER adjudicator, and at least one known-false
        instrument CONSTRUCTED INDEPENDENTLY FOR THIS ROUND, because the
        existing four were built once by one session and re-executed from the
        same file.
      - >-
        BY-CONSTRUCTION FLAGGING: any instrument whose score is entailed by its
        own definition (the always-NON-MEMBER instrument scoring 0 recall) is
        marked ENTAILED and excluded from the separation margin, exactly as this
        campaign's dependency-graph audit requires for ablation rows.
      - >-
        NEARBY-OBJECT CONTROL: the construction-log cheat instrument, which
        bounds what certificate acceptance can mean.
      - >-
        NON-INTERFERENCE CONTROL: verdict vectors of augmented and committed
        adjudicators compared object by object.
      - >-
        STRUCTURAL NULL GUARANTEE: the checker takes no instrument argument, so
        it cannot special-case which adjudicator it is serving. Verified by
        inspecting its signature and recorded as a derivation from source.
      - >-
        SCOPE CONTROL: every emitted table carries the census counts as three
        never-summed integers plus the shadow count, and the generator set with
        each generator's verification status and orbit action beside it.
    required_metrics:
      - honest_certificate_acceptance_rate, with numerator and denominator
      - known_false_certificate_acceptance_rate, one row per instrument, with
        an ENTAILED flag where applicable
      - certificate_separation_margin, with the measured differing-cell
        baseline of 0.0 printed beside it
      - adversarial_witness_rejection_rate over at least 3000 witnesses
      - canonicalisation_collision_count over 10^5 draws
      - construction_log_cheat_acceptance_rate
      - verdict_noninterference_rate
      - witness_extraction_wall_clock and the group budget actually searched
      - per-generator recall, since two verified generators are already
        measured to emit no orbit image and their rows must be null, not 0
      - the census completeness triple and the shadow count, on every table

  falsification_conditions:
    - >-
      honest_certificate_acceptance_rate below 0.95: the honest instrument
      cannot reconstruct its own positives, and the design fails on its own
      terms before any comparison is made.
    - >-
      Any known-false instrument achieving a certificate acceptance rate above
      0.0 on non-entailed rows: certificates do not separate what verdicts
      failed to separate, claim B is false, and the proposal's contribution
      reduces to third-party checkability alone.
    - >-
      certificate_separation_margin at or below 0.0: the whole idea adds
      nothing over the existing verdict-based controls and should be recorded
      as a controlled null, not a finding.
    - >-
      adversarial_witness_rejection_rate below 1.0: the checker is unsound and
      every acceptance number from the run is void.
    - >-
      Any canonicalisation collision: the certificate is not identifying, and
      this is a direct falsifier that must be reported before any acceptance
      rate is cited.
    - >-
      verdict_noninterference_rate below 1.0: the augmentation changed
      decisions, so it is not an evidence layer over the committed instrument
      and cannot be compared to it.
    - >-
      The construction-log cheat instrument is NOT accepted: the withholding
      mechanism is doing unexplained work, and the ceiling analysis is wrong in
      a direction that flatters the design.

  confounders:
    - >-
      AN EMPTY CENSUS MAKES EVERY ACCEPTANCE RATE A STATEMENT ABOUT SYNTHETIC
      PLANTED OBJECTS. With readable census 0, no certified non-novelty about
      any real published path is possible, and a reader who takes a 0.95
      acceptance rate as evidence about the literature has crossed the scope
      line the campaign has held for four batches.
    - >-
      THE KNOWN-FALSE POPULATION IS A SINGLE POINT UNTIL A NEW INSTRUMENT IS
      BUILT. Four instruments re-executed from one file are one construction,
      and a separation margin measured only against them is a measurement of
      that construction. This is why at least one independently constructed
      instrument is a required control rather than an optional extra.
    - >-
      CHECKER INDEPENDENCE IS A PROCESS PROPERTY AND DEGRADES SILENTLY. If the
      checker's author reads the extractor's source, or if both are generated
      in one session from one prompt, independence is nominal. The construction
      path must be recorded as an artifact, the same way this campaign already
      records sibling blindness.
    - >-
      WITNESS EXTRACTION BUDGET AS A HIDDEN VARIABLE. A small budget makes the
      extractor fast and its "no witness found" outcomes meaningless; a large
      one makes acceptance rates look good for reasons unrelated to the key's
      quality. The budget is a required metric on every row.
    - >-
      DEGENERATE PLANTED OBJECTS. Every planted MD5 entry in this campaign
      carries a weight-1 message difference that no real characteristic has. A
      certificate design tuned on such objects may be reconstructing something
      trivial. The MD5 rows must therefore be read with that stated, and the
      SHA-1 rows carry the same caveat with respect to the synthetic
      disturbance vectors used.

  interpretation_limits:
    - >-
      NO PATH IS CLAIMED NEW FOR EITHER PRIMITIVE AT ANY TIER, no cryptanalytic
      improvement is claimed, and a passing certificate is not an improvement.
      Claim tier ceiling `analyzed`.
    - >-
      A certificate makes a MEMBER verdict checkable. It does NOT make a
      NON-MEMBER verdict meaningful; with a readable census of zero, "no
      witness found" carries no information about the literature at all, and
      the correct reading of that outcome is a budget outcome about a search.
    - >-
      Scoped to the frozen committed adjudicator, its declared generator set
      with each generator's verification status, the synthetic planted
      population, the declared instrument set, the extraction budget actually
      spent, and the seeds actually used.
    - >-
      This proposal introduces NO new tracked object; it changes verdict
      semantics and control architecture. Any reader tempted to score it as a
      new lens should read its mechanism section, which says so first.

  heuristic_assumptions:
    - id: H1
      statement: >-
        WITNESS COMPLETENESS UNDER BUDGET. If a candidate is genuinely the
        image of a census entry under the declared equivalence group, then an
        extractor that searches a uniformly random subset of size B of a group
        of size G finds a witness with probability at least B/G per membership,
        and exhaustively when B is at least G. This imitates the standard
        birthday-free accounting for exhaustive search over a finite symmetry
        group, where completeness is a matter of coverage rather than of
        probability.
      rigorous_support: >-
        Exact and rigorous when B is at least G: the group is finite (order 32
        times ord(T) on SHA-1 per IDEA-20260829-f2ffc1) and the search is
        exhaustive, so completeness holds with probability one. The heuristic
        content is entirely in the sub-exhaustive regime, where the coverage
        bound assumes the witness is not adversarially placed with respect to
        the sampling order.
      validation_plan: >-
        Sample 10^4 (entry, group element) pairs under declared seeds,
        construct the image, and run the extractor at budgets
        B/G in {1/64, 1/16, 1/4, 1} recording the empirical recall at each.
        Compare against the predicted linear coverage curve B/G; a systematic
        deficit indicates a non-uniform search order and requires the order to
        be randomised. Tail check: the pairs whose witnesses are found LAST are
        inspected for a common group-coordinate pattern, since a clustered tail
        is the signature of a biased enumeration. Record group order, budgets,
        seeds and draw counts. TRANSFER ASSUMPTION, STATED: recall measured on
        synthetic planted entries does not transfer to real published entries,
        because the planted population's difference structure is known to be
        degenerate.
    - id: H2
      statement: >-
        RECONSTRUCTION HARDNESS FOR IMPOVERISHED KEYS. An adjudicator whose
        canonical key does not retain a component of the object cannot emit a
        witness that reconstructs that component, so its certificate acceptance
        rate is zero whenever the withheld component varies across the
        population. This imitates the standard information-theoretic argument
        that a function cannot output what its input does not determine.
      rigorous_support: >-
        Rigorous as an information-theoretic statement about the ADJUDICATOR AS
        A FUNCTION OF ITS KEY. It is NOT rigorous about an implementation,
        which may read the object outside the key -- exactly the
        construction-log cheat the nearby-object control exists to expose. The
        gap between the mathematical statement and the implementation is where
        every measured surprise in this campaign has lived.
      validation_plan: >-
        For each key component, construct a population in which that component
        varies while all others are held fixed, and measure the acceptance rate
        of the instrument blind to it; the prediction is exactly 0 and the
        measurement has a demonstrated capacity to be nonzero because the
        honest instrument scores near 1 on the identical population. Cross-check
        against the committed membership key's functional-dependency graph:
        a component that is a FUNCTION of a retained component is
        reconstructible and its row must be marked PROVABLY RECONSTRUCTIBLE and
        excluded from the separation margin, precisely as this campaign's
        dependency-graph audit requires. Tail check: any nonzero acceptance for
        a blind instrument is traced to the specific line that read the object
        outside the key, and reported as an implementation finding rather than
        as a distributional surprise.

  target_complexity:
    time_exponent: >-
      Witness extraction: at most G canonicalisations per (candidate, entry)
      pair, where G is the equivalence group order -- 32 times ord(T) on SHA-1
      -- at roughly 2^13 bit operations per canonicalisation, capped by a
      declared budget. Certificate checking: ONE reconstruction and one byte
      comparison, about 2^13 bit operations, INDEPENDENT of the census size and
      of the group order. Distinctness certificates: one invariant evaluation
      per census entry, linear in census size. Full battery over the 16 planted
      entries, their generator images, 3000 decoys and 3000 adversarial
      witnesses across roughly 5 instruments: below 2^30 bit operations, i.e.
      minutes.
    memory_exponent: >-
      Negligible; the certificate is a few dozen bytes and nothing is
      tabulated. THE ASYMMETRY IS THE INTERESTING PART: verification is O(1) in
      both time and memory while extraction is O(G) in time and O(1) in memory,
      which is the standard certificate shape and is why third-party checking
      is cheap even where adjudication is not.
    best_known: >-
      This program's committed adjudicator emits a bare verdict at ONE
      canonicalisation and no witness, so verification by a third party
      currently costs a full re-run of the adjudicator plus trust in its
      implementation, and there is NO independent check at any price. In the
      literature the position is UNKNOWN: no paper was opened, and whether
      published disturbance-vector classifications carry anything like a
      membership witness is not established here. Certificate-carrying outputs
      are entirely standard practice elsewhere in this repository
      (docs/claims-and-verification.md), so the contribution is an application
      of an in-house rule to a class of claim it did not previously cover, not
      an invention.
    hidden_overhead: >-
      No asymptotic parameter and no o(1). What is hidden and is stated: the
      extraction budget. An acceptance rate reported without the budget searched
      is uninterpretable, because a fast extractor that searched a sixty-fourth
      of the group and a slow one that searched all of it produce the same
      column heading and different meanings. The budget is therefore a required
      metric on every row rather than a run parameter.
    tradeoff_note: >-
      A direct and reportable time-memory-completeness trade: precomputing the
      canonical forms of all G images of every census entry into a lookup table
      makes extraction O(1) at a memory cost of G times census size, which for
      a 16-entry shadow census is trivial and for a large real census would not
      be. Both regimes are named so a later reader with a real census knows
      which one they are in. Extraction is embarrassingly parallel across group
      elements; checking needs no parallelism at all.

  dominated_by: >-
    PARETO CHECK ROW BY ROW ACROSS TIME, MEMORY AND EVIDENTIAL STRENGTH.
    (1) Against the committed verdict-only adjudicator and its four batches of
    controls (KN-TECH-6785f2; EV-DIFFP-b878aa, b16b01, afd96c, 1e08cc): NOT
    dominated on evidential strength -- that design has a MEASURED separation of
    0.0 against the known-false instruments on the differing-cell count and a
    measured 96-of-96 versus 96-of-96 tie on the earlier controls, and this
    design predicts 0.95; it IS dominated on extraction time, being O(G) rather
    than O(1) per candidate. The trade is disclosed and is the whole design.
    (2) Against the pending roughly 2950-second selector-swap control in the
    goal's live next_action: NOT dominated and NOT a substitute -- that control
    asks whether a differing-cell count is a property of the pair or of the
    selector; this one replaces the quantity being counted. They can be run in
    either order and this one does not presuppose the funding decision.
    (3) Against IDEA-20260829-ea385e: NOT dominated and complementary -- that
    audits whether the equivalence preserves cost, this audits whether the
    verdict carries evidence. A certificate under a cost-unsafe equivalence is
    still checkable and still means less than it looks, so ea385e's result
    would narrow this one's interpretation.
    (4) Against the retrieved-but-unopened Manuel classification: UNKNOWN. If it
    supplies a deterministic generator for published disturbance vectors, then
    the generator-parameter half of the witness format becomes implementable and
    this design gets STRONGER rather than dominated; if it also supplies a
    membership test, part of this is a re-derivation. THAT ROW IS OPEN, requires
    acquisition, and is not closed here.
    (5) Against general certificate-carrying computation and standard
    NP-witness practice: DOMINATED CONCEPTUALLY AND ADMITTEDLY SO -- nothing
    about the idea of a checkable witness is new, and the record says so in its
    mechanism. What is claimed to be unmeasured is the SEPARATION MARGIN against
    this specific known-false instrument population, and that number does not
    exist anywhere.
  sota_delta: >-
    QUANTITATIVELY, AGAINST MEASURED BASELINES FROM THIS CAMPAIGN'S OWN
    EVIDENCE RECORDS. Separation between the honest adjudicator and the
    message-difference-blind one: MEASURED at 0 by the planted-positive and
    null controls (96 of 96 versus 96 of 96; 0 of 3000 versus 0 of 3000) and
    MEASURED at 0 by the differing-cell count over the adjudicated cells;
    PREDICTED at 0.95 or better by certificate acceptance. Cost of third-party
    verification of a positive verdict: currently a full adjudicator re-run
    plus trust, with no independent check available at any price; under this
    design, one reconstruction of about 2^13 bit operations, independent of
    census size. Extraction cost rises from 1 canonicalisation to at most G,
    which is the disclosed price. NO CRYPTANALYTIC DELTA IS CLAIMED: no attack,
    no path, no cost, and with a readable census of zero, no novelty statement
    about the literature becomes available in either direction.

  estimated_cost:
    implementation: medium
    compute: low

  recommended_priority: high
