# IDEA-20261004-e3b901
# Multiplication-degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261004-e3b901
  question_id: RQ-JINV-8fc13a
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    Multiplication by 30 has degree 900 and multiplication by 29 has degree 841
  class: measurement
  claim: >-
    Multiplication by 30 has degree 900. Multiplication by 29 has
    degree 841. Nine hundred exceeds eight hundred forty-one by 59.
    The product of the two degrees is 756900. Their sum is 1741. The
    gap is a map degree, not an ECDLP exponent and not the degree pair
    841 and 784.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Thirty squared is 900. Twenty-nine squared is 841. Two
    maps of degree 841 have gap 0 and product 707281. No point is mapped.
  novelty_status: unverified
