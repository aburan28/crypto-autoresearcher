idea:
  id: IDEA-20260809-b17238
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ARGON-141710
  goal_id: GOAL-ARGON-001
  title: >-
    Measure all three indexing modes on one harness so the tradeoff-versus-leakage
    exchange is numbers rather than doctrine
  class: composition
  claim: >-
    The choice between data-independent, data-dependent and hybrid indexing is an
    exchange: data-independence resists side-channel observation of memory access
    and admits stronger tradeoff attacks; data-dependence is the reverse. The
    claim is that the exchange can be quantified on one harness — tradeoff
    reduction per variant on one axis, and an explicit measurement of how much
    the access pattern reveals about the input on the other — so the hybrid's
    position becomes a measured point rather than a design assertion.
  mechanism: >-
    Run the tradeoff attack against each variant at matched parameters; separately
    measure the mutual information between the input and the observed memory
    access sequence in each variant, using a declared estimator and synthetic
    inputs.
  why_not_a_renamed_known_approach: >-
    Both sides of the exchange are discussed in the design literature. Measuring
    both on one harness at matched parameters, so that the hybrid's compromise can
    be located between the extremes, is the contribution.
  predictions:
  - observable: tradeoff reduction per variant
    metric: AT factor per variant
    predicted: Largest for the data-independent variant, smallest for the data-dependent one, hybrid in between and closer to one of the two -- which one is the interesting part.
  - observable: input information in the access pattern per variant
    metric: mutual information estimate per variant
    predicted: Zero for data-independent by construction (a nonzero estimate indicates estimator bias and invalidates the measurement), material for data-dependent, intermediate for hybrid.
  minimal_test: >-
    Matched parameters across variants, tradeoff attack run on each, access-pattern
    information estimated with synthetic inputs and a declared estimator with its
    bias measured on the data-independent variant.
  controls:
  - 'ESTIMATOR-BIAS CONTROL: the data-independent variant provides a ground-truth zero; any nonzero estimate there is estimator bias and is subtracted or the estimator is replaced.'
  - 'SYNTHETIC-INPUT CONTROL: all inputs are generated in-run; no real password, credential or leaked corpus is used anywhere.'
  falsification_conditions:
  - The estimator shows material information on the data-independent variant, invalidating it.
  - Tradeoff reductions are indistinguishable across variants, collapsing the exchange.
  interpretation_limits: >-
    Access-pattern information is measured under an idealized observation model
    that omits real microarchitectural effects. No variant is recommended.
  sota_delta: 'No attack. Delta: both sides of a design exchange measured on one harness at matched parameters.'
  dominated_by: Downstream of IDEA-20260809-ac5947; not dominated by any corpus record.
  estimated_cost: Implementation medium; compute high.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep: no memory-hard-function records. WEB NOT CHECKED.'
  source_refs:
  - RFC 9106 and the Argon2 design documents -- REQUIRED READS.
