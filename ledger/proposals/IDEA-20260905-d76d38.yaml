      degree
    direction: different
    minimum_effect: The filtered certificate separates equal-output-degree fixtures with different last-fall degree
      and agrees with exact full-column elimination.
  minimal_test:
    design: Review-only diagnostic on tiny integer-coefficient ideals and separate Boolean/odd-prime specializations.
      Include one planted low-degree consequence that first appears late and a matched complete-intersection control.
      Later S_3 fixtures stay at 8,10,12-bit fields.
    proposal_only: true
    controls:
