  title: >-
    Multiplication by 19 has degree 361 and multiplication by 18 has degree 324
  class: measurement
  claim: >-
    Multiplication by 19 has degree 361. Multiplication by 18 has
    degree 324. Three hundred sixty-one exceeds three hundred
    twenty-four by 37. The product of the two degrees is 116964. Their
    sum is 685. The gap is a map degree, not an ECDLP exponent and not
    the degree pair 324 and 289.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Nineteen squared is 361. Eighteen squared is 324. Two maps
    of degree 324 have gap 0 and product 104976. No point is mapped.
  novelty_status: unverified
