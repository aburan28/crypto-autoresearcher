  title: "RCF-Bind: reduced-characteristic binding with a bare-curve sampling obstruction"
  class: mechanism
  claim: >-
    R_E binds a normalized noncentral endomorphism alpha by verified trace t
    and norm n. Conditional on quaternion conjugacy, fixed (E,t,n) has one
    public conjugacy class. The packet is a typed obstruction: bare-E Sample,
    every-basis polynomial Inv, complete-ring reconstruction, and private
    class-invariant message recovery are all missing.
  mechanism: >-
    Use the global reduced polynomial Z^2-tZ+n, not an endpoint, path selector,
    parity mask, or finite point tuple. Eval verifies dual identities;
    Inv becomes a trace/norm equation. Stop at missing
    SampleNoncentralEnd(E,D), rather than assume OneEnd.
  why_not_a_renamed_known_approach: >-
    UTTK/RWER center torsion or endpoints; RCF centers a characteristic fiber.
  novelty_status: unverified

