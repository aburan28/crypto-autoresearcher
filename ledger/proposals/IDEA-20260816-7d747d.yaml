idea:
  id: IDEA-20260816-7d747d
  question_id: RQ-RSA-d46f02
  added: '2026-08-16'
  title: 'Instrument-validity audit of every reach measurement in this bucket: hold the construction,
    instances and budget fixed and vary only the reduction implementation, its floating-point precision
    and its block size, to find how much of a reported achievable fraction is a property of the reducer
    rather than of the mathematics.'
  class: tooling
  claim: '(A) Every number this bucket will report is produced by a lattice reduction implementation,
    and reduction is the one stage whose output is not mathematically determined by its input: floating-point
    precision, the delta parameter, block size, and internal heuristics all change which vector comes
    out. If a reported achievable fraction moves when only these change, then the fraction is partly
    a property of the software and any comparison across entries, sizes or constructions inherits
    that. (B) The claim is that the reducer-attributable spread in r_hat is non-negligible at these
    sizes and that it is LARGER than the effect entry two''s single-notch ablation will attribute
    to some construction stages, so that without this audit at least one ablation ranking in this
    bucket would be uninterpretable. (C) The claim is that the spread is characterisable rather than
    merely present: it should be driven mainly by precision at large modulus size, where basis entries
    are long, and mainly by block size at large dimension, and the crossover between those regimes
    should be locatable on a modest grid. An exact-rational reduction arm, which is slow but has no
    precision at all, provides the ground-truth corner of that grid and pins the direction of every
    floating-point deviation. (D) WHAT IS NOT CLAIMED: no attack, no speedup, no assertion that any
    implementation is defective - a reducer that returns a different but valid reduced basis is behaving
    correctly, and a measured spread is a fact about the measurement chain, not a bug report. No claim
    is made about implementations not tested, and in particular a spread measured here is not a general
    statement about lattice software. No claim is made that the exact-rational arm is the right answer,
    only that it is precision-free and therefore a fixed reference point.'
  mechanism: 'Stage 1: fix one construction, one dimension, one modulus size, and one seeded instance
    set that entry one has established has a well-defined r_hat. Stage 2: define the reducer grid
    - floating-point precision at several declared levels, delta at two levels, block size at several
    levels including plain LLL, and an exact-rational arm implemented in pure Python integer or rational
    arithmetic. Stage 3: measure r_hat for every point of the reducer grid on the IDENTICAL paired
    instances, with everything else byte-identical. Stage 4: report the spread of r_hat over the grid,
    the marginal effect of each reducer parameter, and the deviation of each floating-point arm from
    the exact-rational arm. Stage 5: cross the reducer grid with two modulus sizes and two dimensions
    at reduced sample size, to locate the precision-versus-block-size crossover. Refutation route:
    if the spread is below entry two''s no-op resolution floor everywhere, the reducer is not a confounder
    at these sizes and every other entry in this bucket may pin one setting and stop worrying, which
    is a clean and useful negative.'
  novelty_status: unverified
  novelty_screen:
    method: 'Base bucket screen. Additionally: grep -rih for ''fpylll'', ''fplll'', ''precision'',
      ''floating point'', ''BKZ block size'' across ledger/proposals/ and reading matching lines;
      read knowledge/techniques/KN-TECH-14efa5.md on obtaining fpylll and G6K; checked the blacklist
      note that program-cost-model and machine-variance audits are saturated under RQ-INSTR-f8faa0
      and confirmed by reading the blacklist text that those concern timing and cost models rather
      than reduction output.'
    results: 'The corpus contains substantial lattice tooling material: KN-TECH-14efa5 records how
      to obtain fpylll and G6K, KN-TECH-041 covers GSA and BKZ simulation, and several ML-KEM proposals
      report BKZ block sizes, root-Hermite factors and Z-shaped profiles. Those measure reduction
      QUALITY as the object of interest. No proposal in the corpus holds an application-side threshold
      fixed and varies only the reducer to ask how much of the threshold the reducer owns. The blacklist
      forbids re-auditing this program''s cost model, machine variance or single-machine timing under
      RQ-INSTR-f8faa0; this entry audits neither timing nor cost, but the mathematical OUTPUT of a
      reduction as it propagates into a reported reach, and it is confined to RQ-RSA-d46f02.'
    verdict: 'UNVERIFIED. Nothing asserted about external literature. Claimed new relative to this
      repository: reducer-attributable spread in an application threshold as the reported object,
      with an exact-rational precision-free arm as the reference corner and an explicit comparison
      against the ablation resolution floor of entry two. Assembled from known parts: the fpylll instrument
      route (KN-TECH-14efa5), reduction-quality thinking already in KN-TECH-041, and the paired-instance
      design used throughout this bucket.'
  object_first_candidate:
    tracked_object: The reducer configuration, carried as the tuple (precision, delta, block size,
      arithmetic kind) together with the r_hat it produces on a fixed instance set, and projected
      to the spread of r_hat over the configuration grid.
    lossiness: 'Genuinely lossy. The full state is the entire reduced basis each configuration returns
      for each instance. The tracked object discards the bases entirely and keeps only the application
      threshold each configuration yields. That discard is compatible with the target operation because
      the operation is comparing configurations for the purpose of trusting a reported reach, and
      reach is exactly what is retained. What it discards that could matter is named: two configurations
      can reach the same r_hat by returning very different bases, so the achieved first-vector norm
      is retained as a secondary variable to detect that case rather than letting it hide.'
    propagation: One step of the target operation is moving to an adjacent reducer configuration -
      one precision level, one block size, or the switch to exact rational arithmetic. Under such
      a step the construction, instances, determinant and budget are all unchanged by design, so any
      movement in r_hat is entirely attributable to the reducer. The object propagates as a threshold
      that either stays put, which is the desired outcome, or moves, in which case the marginal effect
      of the single changed parameter is read off directly.
    survival_score: 'The configuration-to-threshold map should be stable at small dimension and small
      modulus, and should begin to move as basis entries grow long enough that the declared precision
      is marginal. Concretely: expected stable at n = 128 with dimension 16 across precisions, and
      expected to move at n = 1024 where entry bit-lengths are large; locating the size and dimension
      at which the reducer starts to own part of the answer is the deliverable.'
  null_object_control: 'The identical grid runs against a null in which the reduction step is replaced
    by an operation that cannot solve anything - returning the input basis unreduced - with everything
    else identical. Every configuration in the null must fail at every u, confirming that the measured
    r_hat values are produced by reduction rather than by the read-off, the verification, or the instance
    generator. A second control is the repeat arm: the SAME configuration run twice on the same instances
    with the same seed, which must produce identical r_hat exactly, since any difference there is
    nondeterminism that would masquerade as a configuration effect throughout the grid.'
  discriminated_from:
  - 'RQ-INSTR-f8faa0''s saturated audits of this program''s cost model, machine variance and single-machine
    timing: those concern TIMING and cost accounting. This entry measures the mathematical output
    of reduction as it propagates into a reported reach, and reports no timing claim at all beyond
    ordinary budget accounting.'
  - 'KN-TECH-041 (GSA and BKZ simulation): predicts basis profiles and reduction cost. This entry
    holds the reducer''s cost aside and asks what its output does to an application threshold.'
  - 'Entry three of this bucket (equal-determinant sufficiency): varies the construction with the
    reducer pinned. This entry is the exact complement, pinning the construction and varying the reducer,
    and the two together partition the sources of variation in r_hat.'
  - 'Entry six of this bucket (transition width): its fixed-instance multi-seed arm touches reducer
    variance but only to partition a width at one configuration. This entry sweeps a configuration
    grid and includes an exact-rational reference arm that entry six does not have.'
  - 'KN-TECH-14efa5: an infrastructure note on obtaining working lattice tooling. It establishes that
    the instruments exist here and explicitly disclaims being a research finding; it measures no effect
    of those instruments on any result.'
  assumptions:
  - An exact-rational reduction arm is feasible at the smallest tested dimension and modulus within
    the per-instance cap; if it is not, the grid loses its reference corner and the entry must say
    so rather than substitute a high-precision float arm as if it were exact.
  - Reducer configurations can be varied with everything else byte-identical, including the input
    basis and the read-off.
  - The reducer is deterministic given a configuration and seed, which the repeat arm verifies rather
    than assumes.
  - Entry two's no-op resolution floor exists, so that a measured reducer spread can be compared against
    the resolution of the ablation rankings it threatens.
  predictions:
  - metric: spread of r_hat across the reducer grid at n = 1024, dimension 32
    direction: higher
    minimum_effect: 0.01
  - metric: spread of r_hat across the reducer grid at n = 128, dimension 16
    direction: lower
    minimum_effect: 0.01
  - metric: deviation of every floating-point arm's r_hat from the exact-rational arm's r_hat
    direction: lower
    minimum_effect: 'Signed direction is the pre-commitment: floating-point arms are predicted never
      to EXCEED the exact-rational arm''s r_hat by more than the resolution floor. No magnitude is
      pre-committed.'
  - metric: r_hat difference between the two runs of the repeat arm
    direction: lower
    minimum_effect: 0.0
  - metric: unreduced-basis null recovery rate
    direction: lower
    minimum_effect: 0.0
  minimal_test:
    design: 'One cell, two corners. Fix n = 256 and one dimension where entry one reports a stable
      r_hat. Run five configurations on the identical 60 paired seeded instances: plain LLL at default
      precision, plain LLL at doubled precision, plain LLL at halved precision, one block-reduced
      setting, and the exact-rational arm. Add the repeat arm and the unreduced-basis null in the
      same invocation. Report r_hat per configuration with exact binomial intervals, the spread, and
      each arm''s signed deviation from the exact-rational arm, alongside the achieved first-vector
      norm distribution per arm. This discriminates because if halving and doubling precision move
      r_hat by less than the resolution floor at 256 bits, the reducer is not owning the answer at
      the sizes this bucket mostly works at, and every other entry may proceed with one pinned setting;
      if it does move, every ranking in this bucket needs this arm attached before it can be read.'
    controls:
    - Exact-rational reduction arm with no floating point at all, as the precision-free reference
      corner.
    - Unreduced-basis null, which must never recover.
    - 'Repeat arm: identical configuration and seed run twice, which must agree exactly.'
    - Paired instances shared by every configuration.
    - Achieved first-vector norm recorded per arm, so that equal r_hat produced by unequal bases is
      visible rather than hidden.
    required_metrics:
    - r_hat per reducer configuration with exact binomial interval
    - spread of r_hat across the configuration grid
    - signed deviation of each configuration from the exact-rational arm
    - achieved first-vector norm distribution per configuration
    - repeat-arm r_hat difference
    - reduction wall time and peak resident memory per configuration
  falsification_conditions:
  - 'The repeat arm disagrees with itself: the reducer is nondeterministic under the declared configuration
    and no marginal effect in the grid is attributable.'
  - 'The unreduced-basis null recovers anywhere: r_hat is not being produced by reduction, and every
    number in this bucket that used the same read-off is suspect.'
  - 'A floating-point arm exceeds the exact-rational arm''s r_hat by more than the resolution floor:
    the signed prediction is refuted and the mechanism must be reported.'
  - 'The exact-rational arm cannot complete within the per-instance cap at the smallest tested cell:
    the grid has no reference corner and the entry reports that limitation rather than substituting
    a proxy.'
  - 'Spread below the resolution floor everywhere: the reducer is not a confounder at these sizes,
    which refutes the entry''s central claim and is a clean, useful outcome for the whole bucket.'
  confounders:
  - Precision and block size interact, so a marginal effect read at one level of the other is not
    general; the grid is crossed rather than one-at-a-time at the two sizes tested.
  - Time caps bind harder on the exact-rational and high-block-size arms, which could truncate them
    and imitate a lower r_hat; capped instances are reported separately and never merged.
  - A library's default settings may change between versions, so the pinned version is recorded in
    the manifest and any comparison across runs must check it.
  - The read-off step uses several short vectors, so a configuration that returns a worse first vector
    but better second and third could still succeed; the norm distribution is recorded for the first
    three vectors, not only the first.
  - Entry two's resolution floor was measured at a different size and dimension, so comparing this
    spread against it requires the floor to be re-measured here, which the design includes.
  interpretation_limits:
  - A measured spread is a fact about this measurement chain at these sizes, not a statement about
    lattice software in general and not a defect report.
  - A null spread supports pinning one setting for this bucket at these sizes only, and does not license
    ignoring the reducer at cryptographic sizes.
  - The exact-rational arm is a precision-free reference, not a claim about which basis is correct.
  - Nothing here concerns deployed RSA, any attack, or any security consequence.
  target_complexity:
    time_exponent: No attack exponent is claimed. The exact-rational arm is expected to be far slower
      than the floating-point arms and its time is reported as instrument cost so that its role as
      a reference corner is honestly priced.
    memory_exponent: No attack memory exponent is claimed. Peak resident memory per configuration
      is reported beside time, and the exact-rational arm's memory is expected to be the largest.
    best_known: The incumbent practice in this repository is to pin one reducer configuration and
      report the resulting number, as KN-TECH-14efa5 enables and as several ML-KEM proposals do. The
      incumbent MEASUREMENT of how much a reported application threshold owes to that pinned choice
      is that none exists.
    hidden_overhead: 'The exact-rational arm''s cost is the visible overhead. The hidden one is human:
      every result in this bucket must carry its reducer configuration in its manifest for this audit
      to be usable later, and retrofitting that after the fact is not possible.'
  dominated_by: n/a (no result claimed). This entry proposes no solver and asserts no attack point,
    so no time, memory or query frontier row applies; frontier rows were not checked for that reason,
    stated plainly rather than written as null.
  sota_delta: No attack; conceptual and measurement contribution only. The deliverable is a reducer-attributable
    spread compared against an ablation resolution floor, where this repository currently attaches
    no such spread to any lattice-derived threshold.
  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'The repeat arm agreeing exactly, so that the reducer is deterministic
    under a pinned configuration: 0.75, since some implementations carry hidden state. The exact-rational
    arm completing within cap at the smallest cell: 0.7, limited mainly by dimension. A measurable
    spread at n = 1024, dimension 32: 0.7, because long entries and marginal precision are exactly
    where this bites. A spread below the floor at n = 128, dimension 16: 0.65. The signed prediction
    that floating-point never beats exact rational by more than the floor: 0.8, with the caveat that
    a weaker reduction occasionally returning a luckier vector is a real and reportable possibility.'
