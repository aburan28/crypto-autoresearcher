idea:
  id: IDEA-20261007-c82c8f
  question_id: RQ-SSI-001
  added: '2026-10-07'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    The extreme-x affine points of y^2 = x^3 + 1 over F_113 have
    unequal orders.
  class: measurement
  claim: >-
    Let p = 113 and let E be y^2 = x^3 + 1 over F_113. Require
    #E(F_113) = 114. Let A be the affine points, with x and y the
    representatives in 0..112. Let P be the point of A with smallest
    x, ties broken by smallest y, and let Q be the point of A with
    largest x, ties broken by largest y. Let o(P) and o(Q) be their
    orders in E(F_113). The claim is o(P) ≠ o(Q). This compares two
    orders. It does not report a maximum order, it does not test a
    Frobenius congruence, and the exponent delta against the opened
    Õ(p^{1/4}) baseline is 0.
  mechanism: >-
    Equal orders mean the two extreme-x points lie in subgroups of
    the same size. Unequal orders mean the integer representatives
    of x separate two different subgroup sizes. Either outcome is one
    comparison inside E(F_113). Neither outcome is a path.
    OBJECT FRAME. Representation: affine points (x, y) on
    y^2 = x^3 + 1. Operation set Sigma: the chord-and-tangent group
    law, used only to compute two orders. TRICHOTOMY: partial-action.
    Reason: Sigma is applied only to P and Q, not to a generating
    set of the group. LOSSY-PROJECTION TEST against Sigma. Discarded:
    every other point and every isogeny. Retained: the integer
    |o(P) - o(Q)|. Many groups can share one difference, so the
    projection is lossy.
  novelty_status: unverified
  citations:
    - ref: KN-TECH-024
      provenance: internal
      claim: >-
        The opened note states generic supersingular path-finding at
        about O(p^{1/2}) classically and O(p^{1/4}) on the F_p
        subgraph. It gives no point orders at p = 113.
      verified_by: coordinator, this design session, via knowledge/techniques/KN-TECH-024.md
    - ref: KN-OPEN-013
      provenance: internal
      claim: >-
        The opened note reports no sub-p^{1/4} generic attack on the
        endomorphism-ring problem. This idea does not compute a ring.
      verified_by: coordinator, this design session, via knowledge/open-problems/KN-OPEN-013.md
  assumptions:
    - p = 113 is prime. The test checks that.
    - The comparison is scored only when #E(F_113) = 114. A different count leaves o(P) and o(Q) unscored.
    - x and y are the representatives in 0..112. A different lift can change which point is extreme.
    - The order is the least positive integer m with mP = O. The identity is not an affine point and is not selected.
  predictions:
    - metric: absolute difference |o(P) - o(Q)|
      direction: different
      minimum_effect: 1
  minimal_test:
    design: >-
      Confirm p = 113 is prime and count E(F_113). If the count is
      not 114, stop without assigning orders. Otherwise list affine
      points, select P and Q by the stated tie breaks, and compute
      their orders by repeated addition. Record o(P) and o(Q). Do not
      build an isogeny or an endomorphism basis.
    controls:
      - p = 113 is prime and the curve discriminant is nonzero.
      - o(P) and o(Q) both divide #E(F_113). A failure invalidates that order.
      - Reversing the addition chain yields the same orders.
      - The point with x = 0, if it lies on E, is not silently dropped from A.
    required_metrics:
      - point_count
      - x_P
      - y_P
      - x_Q
      - y_Q
      - order_P
      - order_Q
  falsification_conditions:
    - o(P) equals o(Q), while the point count is 114 and both points exist.
    - "#E(F_113) is not 114, so the orders are not scored."
    - A computed order does not divide the point count.
  confounders:
    - The extreme-x rule depends on the integer lift 0..112. Another set of representatives can select other points.
    - Two points of equal order can still generate different subgroups. This test does not name the subgroups.
  interpretation_limits:
    - One curve at p = 113. No transfer to a larger prime.
    - Equal orders reject only this pair. They do not close path-finding.
    - Exponent delta against Õ(p^{1/4}) is 0.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On this one curve, the orders of the extreme-x points are
        treated as if the integer x-coordinate were independent of
        subgroup size. That independence is not a theorem. The sample
        is two points. No transfer is claimed.
      rigorous_support: >-
        KN-TECH-024, opened, states the path-finding baselines and
        does not state a distribution of point orders at p = 113.
        The test uses the group law on E(F_113).
      validation_plan: >-
        Compute o(P) and o(Q) once, after the point-count gate.
        Checks are divisibility by the group order and agreement of
        a reversed addition chain. Sample size two has no tail. No
        second prime is drawn.
  target_complexity:
    time_exponent: >-
      One point count on a 113-element field and two order
      computations by repeated addition. Polynomial in the fixed p.
      No path search is run.
    memory_exponent: >-
      The affine point list, at most 2*113 entries. No p^{1/2}-sized
      table is stored.
    best_known: >-
      KN-LIT-078 via the opened KN-TECH-024 note: Õ(p^{1/2})
      classically on the full graph and Õ(p^{1/4}) on the F_p
      subgraph. Neither is claimed.
    hidden_overhead: >-
      No o(1) term. The field F_113 and the two points are explicit.
      The output is two positive integers.
    tradeoff_note: >-
      No time-memory tradeoff and no collision search. Two points.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      This is a toy comparison of two point orders. It is not an
      ECDLP rho or index-calculus row. No KR-* row was claimed.
    nearest:
      - ref: KN-TECH-024
        provenance: internal
        relation: adjacent
        delta: >-
          The note records path-finding exponents. This idea adds
          |o(P) - o(Q)| at p = 113 for two extreme-x points. The
          exponent delta is 0.
      - ref: KN-OPEN-013
        provenance: internal
        relation: adjacent
        delta: >-
          The note records the open endomorphism-ring hardness
          question and no sub-p^{1/4} generic attack. This idea adds
          no ring computation. The exponent delta is 0.
      - ref: KR-IC-49c882
        provenance: internal
        relation: orthogonal
        delta: >-
          The opened row is about quasi-subfield polynomials and a
          beta >= 3/4 bound for linearised complete splitters. This
          idea's exponent delta against that row is 0.
    searched:
      corpus_grep:
        - knowledge/techniques/KN-TECH-024.md
        - knowledge/open-problems/KN-OPEN-013.md
        - knowledge/frontiers/ecdlp/index-calculus/KR-IC-49c882.yaml
      web: []
  dominated_by: >-
    Compared with the opened notes KN-TECH-024 and KN-LIT-078:
    path-finding stays Õ(p^{1/4}) on the F_p subgraph and Õ(p^{1/2})
    on the full graph. This measurement stores one point list of size
    at most 226 and returns two orders. It does not beat those
    baselines on time, memory, or data.
  sota_delta: >-
    The predicted gap is |o(P) - o(Q)| >= 1 at p = 113, scored only
    when #E(F_113) = 114. The exponent delta against Õ(p^{1/4}) is 0.
  proof_search_map:
