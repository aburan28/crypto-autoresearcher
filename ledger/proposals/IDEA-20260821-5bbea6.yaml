  honest_prior_of_survival: >-
    By part. (i) That CONTROL-1 reproduces the three FIPS Hash values exactly and returns the
    forced ct0 verdicts ACTIVE / DEAD / DEAD: ~0.95 - both are closed-form integer arithmetic.
    (ii) That CONTROL-2 returns a large set: ~0.9. (iii) That the frozen estimator is monotone
    over the grid above some defended dimension: ~0.75, with the small end being the real risk.
    (iv) THAT C IS EMPTY AT 10 PER CENT: ~0.5, LOWERED FROM ~0.65, and the reason is that the
    argument behind the old number was a non sequitur. The correct condition is |e| above
    roughly 0.05-0.07, which is a SMALL elasticity - easily exceeded, but also easily not, and
    I have no measurement and no derivation of e itself. The lattice arm's dependence on
    (k, l, q, gamma1) has more free dials than the hash arm's dependence on (n, tau), and enough
    dials can hold a ratio; I now hold this at a coin flip rather than at a lean.
    (v) That the beta discrepancy cancels in the ratio, licensing the object at all: ~0.6, and
    this is still the part that would most cleanly void the record. (vi) That CONTROL-4 comes
    out consistent - the emptiness verdict and the measured elasticity agreeing: ~0.8; a
    disagreement is a first-class finding about the grid or the estimator. (vii) That the run
    yields either a shipped family or a closure with a measured boundary: ~0.8, lowered from
    ~0.85 because CONTROL-4 can now block a closure that the first version would have filed.
    PRIORITY LOWERED FROM `medium` TO `low` ON 2026-08-24, AND THE CASE FOR `medium` IS STATED
    SO A REVIEWER CAN OVERRULE IT. The lowering rests on three corrected facts, not on
    contrition: the advertised constituency shrank from four downstream records to one that
    genuinely needs the full cross-arm criterion (IDEA-20260821-49ff54, itself `medium` and
    moving no exponent), since -4c0246 needs only the hash input ordering, -5535fe needs only
    q congruent to 1 mod 2n, and -4d4e5f needs nothing; the headline gap narrowed once the
    corrected experiment glob surfaced two committed reduced cells; and the record's own
    contract makes a building block low priority unless it is required by an exponent-moving
    idea, which nothing in this chain is. THE CASE FOR `medium`: the run is cheap (under one
    CPU-hour, no lattice reduction, no signing), the elasticity is a reusable structural number,
    and an EMPTY result with CONTROL-4 healthy is a genuine section-4 closure that binds the
    lane's toy-tier ambitions. A Coordinator who weighs cost-per-decision above constituency
    size should restore `medium`; the trade is written out here rather than concealed in the
    label.
