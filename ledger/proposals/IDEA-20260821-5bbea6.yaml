      This program's own lattice instrument was found to be off by about 355 in beta against a
      recalled published value. Used here as the justification for stage 2 reporting its
      lattice-arm discrepancy openly rather than assuming calibration. RECORDED FROM THAT
      PROPOSAL'S TITLE ONLY - the body was not read this session.
    verified_by: coordinator@2026-08-21 (orchestrating session; source read in full this session)
  - ref: RQ-MLDSA-001
    provenance: internal
    claim: >-
      claim_tier_ceiling: "Toy-tier until a certified instance at or above the standardized
      parameter scale exists"; methods include "measured calibration at reduced parameters
      where a forgery can be certified". This is the requirement no repository record
      currently serves.
    verified_by: 'idea-generator@2026-08-21 (read in full)'
  - ref: 'docs/claims-and-verification.md'
    provenance: internal
    claim: >-
      Any claimed solve or relation carries a certificate the run wrapper re-verifies
      independently. The independent verifier in stage 5 exists to satisfy this for every
      downstream record.
    verified_by: 'idea-generator@2026-08-21 (referenced)'
  - ref: KN-TECH-1a5b7e
    provenance: internal
