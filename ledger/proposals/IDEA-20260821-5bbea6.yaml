      monotonicity verdict.
    verified_by: 'idea-generator@2026-08-21 (read in full)'
  assumptions:
  - >-
    A single frozen MSIS core-SVP estimator is a legitimate common instrument across three
    orders of magnitude of dimension. This is doubtful at the small end - core-SVP conventions
    are asymptotic and are known to be poor guides at tiny block sizes - and the record
    therefore reports the smallest dimension at which the estimator is defended, and treats
    every ratio computed below that as unreliable and flags it in the output.
  - >-
    log2|B_tau| = tau + log2 C(n, tau) is the correct hash-arm size for the surrogate as it is
    for FIPS 204. This is exact combinatorics, not an estimate, and CONTROL-3 checks it.
  - >-
    The declared grid is large enough that emptiness over the grid is informative about
    emptiness over the parameter space. IT IS NOT A PROOF OF EMPTINESS and the record must
    never state it as one; the honest statement is "empty over the declared grid", with the
    grid published.
  - >-
    Structural fidelity is captured by the listed filters. Other properties of ML-DSA are
    certainly not captured, and any downstream record must state which of ITS assumptions the
    family preserves rather than assuming the family is ML-DSA in miniature.
  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
    - transform: null
      proposed_object: null
      predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
    - claim: null
      responsibility: null
    not_applicable_reason: >-
      This is a tooling and feasibility record. It certifies no theorem, states no asymptotic,
      proposes no reduction and produces no certificate family whose soundness needs auditing;
      the one thing it decides - is a declared finite constraint set non-empty - is settled by
      enumeration, and its honest scope limit ("empty over the declared grid, which is not a
      proof of emptiness over the parameter space") is stated in `assumptions` and
      `interpretation_limits` rather than as a method ceiling. The §8 audits have no object to
      bind to here. The nearest §8-shaped obligation, baseline reproduction, IS present and is
      implemented as CONTROL-1: the three FIPS 204 tuples are exact points of the search space
      and must reproduce their known Hash values and fail exhaustibility.
  predictions:
  - metric: 'is the constraint set C non-empty over the declared grid'
    direction: different
    minimum_effect: 'a boolean with the surviving tuples listed; PREDICTED EMPTY at the 10 per cent tolerance, and a non-empty result is the more useful outcome'
  - metric: 'smallest ratio tolerance at which C becomes non-empty, over the sweep 2/5/10/20/50 per cent'
    direction: higher
    minimum_effect: 'predicted above 20 per cent; a value at or below 10 per cent flips the headline to non-empty'
  - metric: 'elasticity d(log r)/d(log Hash) along the shrink path, averaged over filter-surviving tuples'
    direction: different
    minimum_effect: 'magnitude above 0.2 would explain an empty result mechanically; magnitude below 0.05 would make an empty result surprising and would point at the grid rather than at the mathematics'
  - metric: 'CONTROL-1: Hash at the three FIPS tuples, recomputed in exact arithmetic'
    direction: different
    minimum_effect: 'must equal 192.760 / 225.345 / 257.015 to three decimals, and all three must fail the <= 40 exhaustibility filter'
  - metric: 'CONTROL-2: |C| with the ratio constraint removed'
    direction: higher
    minimum_effect: 'at least 100 surviving tuples, or the search is broken and no headline is reported'
  - metric: 'largest Hash at which the ratio is still holdable within 10 per cent, and smallest Hash at which any structurally valid tuple exists'
    direction: different
    minimum_effect: 'the two numbers bounding the obstruction; reporting the gap between them IS the closure''s measured quantity'
  minimal_test:
    design: >-
      One script, one invocation, no lattice reduction and no signing. Freeze the estimator and
      convention. Insert the three FIPS tuples and run CONTROL-1 and CONTROL-3. Enumerate the
      declared grid, apply the structural filters in a fixed order recording attrition at each,
      compute (Hash, Latt, r) for survivors, and evaluate C at five tolerances. Run CONTROL-2.
      Report the boolean, the attrition table, the (Hash, r) scatter, the elasticity, the two
      boundary numbers, and the second-convention sensitivity arm. THIS DISCRIMINATES because
      CONTROL-1's values are known in advance and the FIPS tuples must fail exactly one
      constraint each; because CONTROL-2 separates "the constraint is unsatisfiable" from "the
      search is broken", which is the only way an EMPTY headline can mean anything; and because
      the elasticity gives a mechanism for whichever answer comes out rather than a bare
      verdict. COST: WELL UNDER ONE HOUR OF SINGLE-CORE COMPUTE. The grid as declared is on the
      order of 10^6 tuples and the per-tuple work is a binomial logarithm plus one estimator
      call; if the estimator is the slow part, it is evaluated only on the tuples that survive
      the structural filters, which is a small fraction.
    controls:
    - 'CONTROL-1: the three FIPS 204 tuples inside the search space, which must reproduce their Hash values and must fail exhaustibility.'
    - 'CONTROL-2: identical search with the ratio constraint removed, which must return a large non-empty set.'
    - 'CONTROL-3: exact-arithmetic recomputation of tau + log2 C(n, tau) at 20 random grid points, zero tolerance.'
    - 'Tolerance sweep at 2/5/10/20/50 per cent with a monotonicity check whose expected result is derived (non-decreasing by construction).'
    - 'Second cost convention as a sensitivity arm, reported in full.'
    - 'Filter attrition counts in a fixed order, so a filter that removes everything is visible rather than silent.'
    - 'Explicit flagging of every tuple whose dimension is below the smallest dimension at which the frozen estimator is defended.'
    required_metrics:
    - 'boolean: C non-empty at 10 per cent tolerance, with the surviving tuples listed in full'
    - 'filter attrition table'
    - 'the (Hash, r) scatter over filter-surviving tuples, machine-readable'
    - 'elasticity d(log r)/d(log Hash)'
    - 'CONTROL-1 recomputed Hash values and their pass/fail on each constraint'
    - 'CONTROL-2 set size'
    - 'smallest tolerance at which C becomes non-empty'
    - 'largest Hash with r holdable at 10 per cent; smallest Hash with any valid tuple'
    - 'the frozen estimator, convention, and grid definition, as artefacts'
    - 'per-downstream-record filter subset table (which of the filters each of IDEA-20260821-49ff54, -4c0246, -5535fe actually needs)'
  falsification_conditions:
  - 'CONTROL-1 fails - a FIPS tuple is reported exhaustible, or its Hash does not recompute to three decimals: the instrument is broken and no result is reported.'
  - 'CONTROL-2 returns fewer than 100 tuples: the grid or the structural filters are broken; an EMPTY headline would be uninterpretable and is not reported.'
  - 'CONTROL-3 finds any mismatch in the exact-arithmetic Hash recomputation: a bug, zero tolerance.'
  - 'The tolerance sweep is non-monotone: a bug, since set size is non-decreasing in tolerance by construction.'
  - 'C is EMPTY at 10 per cent with CONTROL-2 healthy: recorded as a §4-standard closure - named obstruction (exhaustibility drives tau and n down, which drives the module dimension and hence the lattice arm down with it, so the ratio cannot be held across a 150-plus-bit shrink), argument (the measured elasticity), measured boundary (the two Hash numbers), and forward guidance (single-arm calibration remains admissible; ORDERING-preserving rather than ratio-preserving families are a named next target; IDEA-20260821-4c0246 is explicitly NOT blocked because it needs only the hash input ordering).'
  - 'C is NON-EMPTY: the families are shipped with an independent verifier and a fixture, and the record makes no claim beyond their existence and their declared preserved invariants.'
  - 'The headline flips between the two cost conventions: the result is a statement about the convention and must be phrased as one.'
  confounders:
  - 'Core-SVP conventions are asymptotic and unreliable at small block sizes; every tuple below the defended dimension is flagged, and a headline resting on flagged tuples is not a headline.'
  - 'This program''s lattice instrument is already recorded as differing by about 355 in beta from a recalled published value (IDEA-20260805-591f9d). If that discrepancy is a fixed offset it cancels in a RATIO; if it is dimension-dependent it does not, and stage 2 must report which, because the entire record is about a ratio.'
  - 'Grid coarseness: emptiness over a grid is not emptiness over a space, and a finer grid could find a point. The grid is published so a later reader can refine it.'
  - 'The structural filters encode a judgement about what makes a family "ML-DSA-shaped"; a different judgement gives a different answer. The filters are declared before the run and their attrition is reported individually so the judgement is auditable.'
  - 'Choosing the tolerance after seeing the scatter would let the headline be selected; the 10 per cent tolerance is declared in this record, before any enumeration.'
  interpretation_limits:
  - 'An EMPTY result means "empty over the declared grid at the declared tolerance under the frozen estimator". It is not a proof, not a statement about all reduced families, and explicitly not a claim that toy calibration is impossible.'
  - 'A NON-EMPTY result licenses only the invariants the family is verified to preserve, listed explicitly. A downstream record may rely on exactly those and no others.'
  - 'No security claim of any tier. No attack, no forgery at any parameter set, no statement about FIPS 204.'
  - 'The lattice arm''s absolute values inherit this program''s known instrument discrepancy and are reported as such; only the ratio is offered as the object, and only if the discrepancy is shown to be offset-like.'
  heuristic_assumptions:
  - id: H1
    statement: >-
      For the declared family of parameter tuples, the frozen core-SVP estimator's output
      Latt(P) is a monotone increasing function of the module dimension k*n at fixed
      (q, gamma1, eta), so that shrinking the hash arm by reducing n or tau cannot be
      compensated by any admissible move that leaves Latt unchanged.
    rigorous_support: >-
      The rigorous ingredient is that the MSIS lattice's dimension is exactly (k+l)*n and its
      determinant is exactly q^{k*n}, both closed-form; the classical statement being imitated
      is the standard monotonicity of the required BKZ block size in the lattice dimension at
      fixed root-Hermite target, which underlies every published core-SVP estimate. H1 asks
      only that the frozen estimator inherits that monotonicity over the declared grid rather
      than exhibiting non-monotone artefacts at small dimension.
    validation_plan: >-
      Evaluate Latt on a one-dimensional sweep of k*n from the smallest grid value to 256*8 at
      fixed (q, gamma1, eta, l/k ratio) and check monotonicity at every step, reporting the
      number and location of any inversions. TAIL CHECK: examine the ten smallest dimensions
      specifically, where core-SVP conventions are least reliable, and report the smallest
      dimension above which monotonicity holds without exception - that number becomes the
      "defended dimension" used to flag tuples. Repeat under the second cost convention.
      Sampled parameters recorded. TRANSFER ASSUMPTION: none needed, since the sweep spans the
      whole grid including the FIPS points; if monotonicity fails somewhere in the middle, that
      is a direct falsifier of H1 and of the record's core objective.
  - id: H2
    statement: >-
      The elasticity e = d(log r)/d(log Hash) is approximately constant along the shrink path
      over the filter-surviving region, so that the emptiness or non-emptiness of C at a given
      tolerance is predictable from e and the required shrink in Hash rather than requiring the
      full enumeration.
    rigorous_support: >-
      Imitates the ordinary local-power-law approximation for a smooth ratio of two smooth
      functions of the same underlying scale. Its rigorous half is that Hash(P) = tau + log2
      C(n, tau) is smooth and explicitly differentiable in tau and n; the heuristic half is
      that Latt(P) tracks the dimension smoothly enough for a single exponent to describe the
      trajectory.
    validation_plan: >-
      Estimate e by local regression in overlapping windows along the Hash axis and report its
      variation across windows with an interval; a coefficient of variation above 0.5 falsifies
      "approximately constant" and the record then reports the full curve rather than a single
      elasticity. Cross-check the prediction: use e measured on the upper half of the Hash range
      to PREDICT the ratio attainable at the bottom of the range, then compare against the
      enumerated value there - a genuine held-out prediction rather than a fit. TAIL CHECK: the
      prediction error at the single smallest Hash value in the grid, reported separately.
      Sampled parameters recorded. TRANSFER ASSUMPTION: e is not extrapolated outside the grid.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE IS MOVED. This record is explicitly a BUILDING
      BLOCK under search heuristic 1 of the Idea Generator contract, and is ranked accordingly.
      Its own cost is O(|grid|) binomial-logarithm evaluations plus O(|survivors|) estimator
      calls; the declared grid is on the order of 10^6 tuples and the survivor count is expected
      to be orders of magnitude smaller.
    memory_exponent: >-
      Not applicable to any attack. The record's own storage is the survivor table, well under
      a gigabyte.
    best_known: >-
      There is no incumbent, because this repository contains no reduced ML-DSA family and no
      preservation criterion for one. On the adjacent axis of "what does the lane's toy-tier
      ceiling actually permit", the incumbent is RQ-MLDSA-001's prose requirement, which names
      the need and does not check that it is satisfiable.
    hidden_overhead: >-
      Two honest disclosures. (i) The frozen estimator's reliability at small dimension is the
      hidden cost of the whole design, and it is the reason the "defended dimension" is
      computed and every tuple below it is flagged. (ii) This program's own beta discrepancy of
      about 355 (IDEA-20260805-591f9d) sits underneath every Latt value; whether it cancels in
      a ratio is not known in advance and stage 2 must determine it. If it does not cancel, the
      record's central object is compromised and that must be reported rather than absorbed.
    tradeoff_note: >-
      The Pareto frontier between exhaustibility (small Hash) and fidelity (r close to
      r(FIPS_k)) IS the deliverable in the empty case, and it is a genuine two-objective
      tradeoff curve rather than a time-memory one. Parallelisation over the grid is trivial and
      irrelevant to the conclusion.
  dominated_by: >-
    n/a (no attack or cost-triple result claimed). Frontier rows checked before writing this:
    all seven existing RQ-MLDSA-001 proposals (none defines or needs a reduced family; none
    produces an attack cost triple); the two committed ML-DSA experiment specifications
    EXP-MLDSA-2b6f17 and EXP-MLDSA-15866e (neither ships a scaled family); ePrint 2024/1373,
    2025/214 and KN-LIT-4f3b80 (all attacks at real parameters, on axes this record does not
    occupy); the published MLWE / MSIS / SelfTargetMSIS estimates (untouched - this record
    produces no security estimate, only a ratio between two of them). Nothing on that list
    contains a decidable preservation criterion for a reduced ML-DSA family, so no row dominates
    the deliverable. On the METHOD axis the record is dominated by any published
    reduced-parameter Dilithium family that states its preserved invariants, if one exists; no
    such family was found in this session's searches, and that negative is recorded as weak
    because no search was run specifically for it.
  sota_delta: >-
    No attack; tooling and feasibility contribution only. Quantitatively the delta is zero bits
    against every published estimate, by construction. Against the repository's current state
    the delta is the difference between a prose requirement ("measured calibration at reduced
    parameters where a forgery can be certified", RQ-MLDSA-001) and a decided boolean with a
    measured Pareto boundary, an elasticity, and either a shipped executable family with an
    independent verifier or a §4-standard closure naming which existing proposals the closure
    binds. THIS RECORD IS OFFERED AS A BUILDING BLOCK AND SHOULD BE RANKED AS ONE: it moves no
    exponent and its priority rests entirely on being a prerequisite for records that might.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    By part. (i) That CONTROL-1 reproduces the three FIPS Hash values exactly: ~0.95 - it is
    closed-form combinatorics. (ii) That CONTROL-2 returns a large set: ~0.9. (iii) That the
    frozen estimator is monotone over the grid above some defended dimension: ~0.75, with the
    small end being the real risk. (iv) THAT C IS EMPTY AT 10 PER CENT, which is the predicted
    headline: ~0.65 - the shrink required is 150-plus bits in Hash and I expect r to drag with
    it, but I hold this loosely because the lattice arm's dependence on (k, l, q, gamma1) has
    more free dials than the hash arm's dependence on (n, tau), and enough dials can sometimes
    hold a ratio. (v) That the beta discrepancy cancels in the ratio, licensing the object at
    all: ~0.6, and this is the part that would most cleanly void the record. (vi) That the run
    yields either a shipped family or a closure with a measured boundary: ~0.85.
