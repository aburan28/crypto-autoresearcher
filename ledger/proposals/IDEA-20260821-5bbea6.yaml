      docs/target-result-profile.md Parts A-D. FETCHED AND READ:
      https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.204.ipd.pdf for the three FIPS tuples
      that stage 2 must reproduce. WEB: no search was run specifically for this record, because
      its claim is about the contents of THIS repository; three of the eight searches run that
