idea:
  id: IDEA-20260821-5bbea6
  question_id: RQ-MLDSA-001
  added: '2026-08-21'
  title: >-
    Decide, by a finite grid search costing minutes, whether ANY reduced ML-DSA parameter set
    simultaneously makes the SelfTargetMSIS hash arm exhaustible (log2|B_tau| <= 40) and
    preserves the FIPS 204 RATIO between the hash arm and the lattice arm within a declared
    tolerance. The decision is a RATE question, not a level question: because r = Hash/Latt is
    a ratio, two arms that fall TOGETHER preserve it, and C is empty only if the elasticity
    e = d(log r)/d(log Hash) exceeds a derived threshold of 0.061 / 0.055 / 0.051 in magnitude
    along every admissible shrink path. No committed record defines a reduced ML-DSA FAMILY
    with a declared cross-arm preservation criterion and a certifiable forgery - though two
    committed specifications DO define reduced or synthetic parameter CELLS for single-arm
    purposes (EXP-MLDSA-8c8fa2, EXP-MLDSA-462ea2), which an earlier version of this record
    failed to report.
  class: tooling
  claim: >-
    (A) THE GAP THIS FILLS, STATED AS A NARROWED FACT ABOUT THE REPOSITORY AFTER A CORRECTED
    GLOB. RQ-MLDSA-001 sets a claim_tier_ceiling of "toy-tier until a certified instance at or
    above the standardized parameter scale exists", and GOAL-MLDSA-001's completion criteria
    require "measured calibration at reduced parameters where a forgery can be certified". THE
    FIRST VERSION OF THIS RECORD SAID "No record in this repository defines such a reduced
    family" AND SUPPORTED IT WITH A GLOB THAT REPORTED TWO COMMITTED ML-DSA EXPERIMENT
    SPECIFICATIONS WHERE THERE ARE SEVEN. The corrected glob (1c66ac, 15866e, 2b6f17, 462ea2,
    3f7ab2, 8c8fa2, a8d531; run records under 2b6f17, 3f7ab2 and a8d531) contains TWO reduced
    or synthetic parameter cells, and the headline is narrowed accordingly rather than
    restated. EXP-MLDSA-8c8fa2 defines a reduced_cell (n_coefficients 16, k 1, omega 5, d 13,
    gamma2 95232) whose declared rationale is that "the posterior over t0 is 16 coefficients x
    8192 values, fully enumerable", labelled PILOT TIER; it has no l, no gamma1, no tau, no
    challenge space and no verifier - it is a cell for one Bayesian measurement, not a scheme.
    EXP-MLDSA-462ea2 defines a synthetic_reachable_cell, "ML-DSA-87 parameters with gamma2
    replaced by 200000, below the 245760 envelope", declared as an instrument control whose
    claim_ceiling explicitly labels it toy and forbids citing it for any real parameter set; it
    is a one-coordinate perturbation of a FULL-SIZE tuple, so its hash arm is still 2^257 and
    it is not exhaustible. WHAT REMAINS TRUE, AND IT IS WHAT THIS RECORD ACTUALLY CLAIMS: no
    committed record defines a reduced ML-DSA family that (i) is exhaustible on the hash arm,
    (ii) states a preservation criterion RELATING the two arms, (iii) ships signing,
    verification and an independent forgery-certificate verifier. Three of the five proposals
    filed in this batch - IDEA-20260821-49ff54, -4c0246 and -5535fe - assume some reduced
    structure, each a DIFFERENT subset, and none can check its own assumption.
    IDEA-20260821-4d4e5f does NOT: it is pure derivation and arithmetic with no signing and no
    lattice reduction, its calibration arm is SLH-DSA rather than a reduced ML-DSA, and an
    earlier version of this record wrongly counted it as a fourth dependant.
    (B) THE OBJECT, MADE EXACT. Define for a parameter tuple P = (n, k, l, q, d, tau, eta,
    gamma1, gamma2, omega, lambda) the pair (Hash(P), Latt(P)) where Hash(P) = log2|B_tau| =
    tau + log2 C(n, tau) and Latt(P) = the core-SVP bits of the MSIS arm under a declared,
    frozen estimator and a declared convention. Define the ARM RATIO r(P) = Hash(P)/Latt(P).
    At FIPS 204 the hash arm is Hash = 192.760 / 225.345 / 257.015 (taken from
    IDEA-20260805-5194f9 and to be RECOMPUTED, not inherited). The question is whether the
    constraint set C = {P : Hash(P) <= 40, |r(P) - r(FIPS_k)| <= 0.10 * r(FIPS_k), and P
    satisfies the structural relations of clause (C) indexed to reference set k} is NON-EMPTY
    over a declared finite grid.
    (C) THE STRUCTURAL RELATIONS, WITH THE ct0 FILTER CORRECTED FROM A UNIVERSAL REQUIREMENT
    TO A PARAMETER-SET-INDEXED MATCH. Held for every P, unconditionally: beta = tau * eta
    exactly; q congruent to 1 mod 2n (so the NTT exists and IDEA-20260821-5535fe's projection
    is defined); gamma1 a power of two; gamma2 in the FIPS divisor pattern; all four rejection
    gates PRESENT in the algorithm; and the commitment hash input ordering c-tilde =
    H(mu || w1) with mu = H(tr || M), without which IDEA-20260821-4c0246's shared-prefix object
    does not exist. Held CONDITIONALLY, indexed to the FIPS reference set k the family is
    shaped after: the REACHABILITY VERDICT of the ||c t0||_inf >= gamma2 disjunct, i.e. the
    integer comparison tau * 2^(d-1) versus gamma2, must MATCH set k's verdict rather than
    being forced ACTIVE. The first version of this record required tau * 2^(d-1) > gamma2 for
    every P, "as it is at ML-DSA-44 (39 * 4096 = 159744 > 95232)". That inequality holds at
    ML-DSA-44 and FAILS AT THE OTHER TWO APPROVED PARAMETER SETS: 49 * 4096 = 200704 <
    261888 = (q-1)/32 at ML-DSA-65 (slack 61184) and 60 * 4096 = 245760 < 261888 at ML-DSA-87
    (slack 16128), an exact envelope owned by IDEA-20260805-bb52fa. A universal ct0-ACTIVE
    filter therefore declares two of the three approved FIPS tuples not ML-DSA-shaped, which is
    a defect in the filter and not a fact about ML-DSA. The corrected filter is an EQUALITY of
    verdicts: ACTIVE for a -44-shaped family, DEAD for a -65- or -87-shaped family. This also
    corrects a misstated downstream dependency - IDEA-20260821-49ff54, in its repaired form,
    requires the ct0 gate to be DEAD in its surrogate and treats an active one as a fidelity
    defect, the opposite of what the first version of this record asserted it needed.
    (D) THE TWO OUTCOMES, BOTH SUBSTANTIVE, WITH THE EMPTY BRANCH RE-ARGUED AS A RATE CLAIM.
    NON-EMPTY: the search returns one or more families, each shipped with a signing/verification
    implementation, a FORGERY CERTIFICATE VERIFIER written independently of the forger, and a
    frozen record of which invariants it preserves and which it does not. That is the executable
    substrate this lane has never had. EMPTY: the search returns nothing, and THE REASON IS AN
    ELASTICITY MISMATCH, NOT A JOINT DECLINE. Because log r = log Hash - log Latt, the one-step
    law is e := d(log r)/d(log Hash) = 1 - d(log Latt)/d(log Hash), so r is PRESERVED exactly
    when the two arms shrink at equal proportional rate (e = 0) and is destroyed only when they
    do not. The first version registered the obstruction as "forcing Hash(P) <= 40 drives tau
    and n down, which drives the module dimension and hence Latt(P) down too, so r cannot be
    held" - an argument that, applied to a RATIO, supports the OPPOSITE conclusion, since two
    arms falling together leave r fixed and make C non-empty. That argument is WITHDRAWN. The
    correct emptiness condition is quantitative and derived before the run: the tolerance band
    in log r is [ln 0.90, ln 1.10] = [-0.10536, +0.09531]; the required shrink is
    ln(Hash(FIPS_k)/40) = 1.5726 / 1.7288 / 1.8603 at ML-DSA-44 / 65 / 87; so if e is
    approximately constant along a path, that path leaves the band only if |e| exceeds
    0.09531/1.5726 = 0.0606 (upward departure) or 0.10536/1.5726 = 0.0670 (downward) at
    ML-DSA-44, 0.0551 / 0.0610 at ML-DSA-65, and 0.0512 / 0.0566 at ML-DSA-87. C IS EMPTY AT
    THE 10 PER CENT TOLERANCE IF AND ONLY IF EVERY ADMISSIBLE SHRINK PATH HAS HASH-AVERAGED |e|
    ABOVE ITS CATEGORY THRESHOLD. That is the registered obstruction, its measured boundary is
    the Pareto frontier of the two objectives together with the measured e, and its consequence
    is unchanged: every toy-scale statement in this lane about WHICH ARM BINDS is void, while
    toy-scale statements about a single arm's internal structure remain admissible. Naming which
    existing proposals fall on each side of that line is part of the deliverable.
    (E) WHAT IS NOT CLAIMED. No attack, no exponent, no security statement of any kind. This
    is infrastructure, and per search heuristic 1 of the Idea Generator contract it is offered
    explicitly as a REQUIRED BUILDING BLOCK for other work rather than as a result in its own
    right; it is ranked accordingly below, and the ranking was LOWERED on 2026-08-24 because
    the set of records that genuinely need it turned out to be smaller than the first version
    asserted. It does not declare toy calibration impossible - if the constraint set is empty
    at the declared tolerance it reports the tolerance at which it becomes non-empty, which is
    the useful quantity.
  mechanism: >-
    STAGE 1, FREEZE THE ESTIMATOR AND THE CONVENTION. Choose and freeze one MSIS core-SVP
    estimator and one cost convention before any grid is enumerated, and record both. Report
    every result under a second convention as a sensitivity arm, because an arm-ratio
    conclusion that flips with the convention is reporting the convention.
    STAGE 2, VERIFY THE INSTRUMENT ON THE KNOWN POINTS. Evaluate Hash(P) and Latt(P) at the
    three FIPS 204 tuples. Hash must reproduce 192.760 / 225.345 / 257.015 by independent
    recomputation from tau and n = 256 - NOT by reading IDEA-20260805-5194f9's numbers into
    the code. Latt must reproduce whatever the frozen estimator gives, and its distance from
    the published category floors must be reported openly, since IDEA-20260805-591f9d records
    this program's own instrument being off by about 355 in beta against a recalled published
    value; that discrepancy is a KNOWN INSTRUMENT PROBLEM in this repository and must be
    surfaced here rather than absorbed. Stage 2 ALSO evaluates the three ct0 reachability
    integers - 39*4096 = 159744 vs 95232, 49*4096 = 200704 vs 261888, 60*4096 = 245760 vs
    261888 - and must return ACTIVE / DEAD / DEAD, which is a forced three-valued check of the
    corrected clause-(C) filter.
    STAGE 3, ENUMERATE. Grid: n in {16, 32, 64, 128}; k, l in 1..4; q ranging over
    NTT-friendly primes with q congruent to 1 mod 2n in a declared range; d in 3..10; tau in
    2..n/2; eta in {1, 2, 4}; gamma1 a power of two in a declared range; gamma2 from the FIPS
    pattern; omega in a declared range; lambda in {16, 24, 32, 48}. Apply the unconditional
    structural relations as hard filters; apply the ct0 reachability filter THREE TIMES, once
    per reference set k, producing three survivor sets rather than one. Compute (Hash, Latt, r)
    for every survivor. Report the grid size, the count surviving each filter in order, and the
    full (Hash, r) scatter, per reference set.
    STAGE 4, MEASURE THE ELASTICITY AND DECIDE. Report whether C is non-empty, per reference
    set. Measure e = d(log r)/d(log Hash) by local regression along the shrink path and compare
    its Hash-averaged magnitude against the derived category thresholds 0.061 / 0.055 / 0.051
    (upward) and 0.067 / 0.061 / 0.057 (downward). An empty C accompanied by |e| below its
    threshold is INTERNALLY INCONSISTENT and indicates a grid or filter defect rather than an
    obstruction; that consistency check is the point of measuring e at all. If empty, report
    the Pareto frontier of the two objectives - the smallest Hash achievable at each tolerance
    on r, and the tightest tolerance achievable at each Hash - so that the obstruction is a
    measured curve and not a verdict.
    STAGE 5, SHIP OR CLOSE. If non-empty: implement the winning family, implement an
    INDEPENDENT verifier, and freeze both with a fixture of known-good and known-bad
    signatures. If empty: write the closure at the docs/inventor-protocol.md section 4
    standard - named obstruction stated as the elasticity mismatch of clause (D), argument (the
    measured e against its derived threshold), measured boundary (the two Hash numbers and the
    Pareto curve), forward guidance naming what remains (single-arm calibration; families that
    preserve the ORDERING of the arms without their ratio; families that preserve the hash
    arm's input ordering only, which is all IDEA-20260821-4c0246 actually needs).
  novelty_status: unverified
  novelty_screen:
    method: >-
      TWO PASSES, AND THE FIRST ONE'S DEFECTS ARE DISCLOSED RATHER THAN OVERWRITTEN. FIRST PASS
