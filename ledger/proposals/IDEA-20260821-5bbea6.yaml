  sota_delta: >-
    No attack; tooling and feasibility contribution only. Quantitatively the delta is zero bits
    against every published estimate, by construction. Against the repository's current state
    the delta is now SMALLER than the first version claimed and is stated part by part.
    (i) Against RQ-MLDSA-001's prose requirement ("measured calibration at reduced parameters
    where a forgery can be certified"): the delta is a decided boolean per reference set, a
    measured Pareto boundary, a measured elasticity checked against a derived threshold, and
    either a shipped executable family with an independent verifier or a section-4-standard
    closure. (ii) Against EXP-MLDSA-8c8fa2 and EXP-MLDSA-462ea2: the delta is the CROSS-ARM
    criterion and the exhaustibility requirement, neither of which those cells carry - but the
    claim "no reduced object exists here" contributes ZERO and is withdrawn. (iii) Against
    IDEA-20260805-bb52fa: ZERO on the ct0 reachability arithmetic, which is imported. (iv) The
    elasticity formulation contributes the correction of an obstruction this lane had registered
    as a joint decline when it is a rate mismatch; that is a correction to this program's own
    reasoning, not a contribution against any external frontier. THIS RECORD IS OFFERED AS A
    BUILDING BLOCK AND SHOULD BE RANKED AS ONE: it moves no exponent, its priority rests entirely
    on being a prerequisite for other records, and the set of records that genuinely need it is
    one (IDEA-20260821-49ff54), not the four the first version asserted.
