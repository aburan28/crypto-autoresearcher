idea:
  id: IDEA-20260821-5bbea6
  question_id: RQ-MLDSA-001
  added: '2026-08-21'
  title: >-
    Decide, by a finite grid search costing minutes, whether ANY reduced ML-DSA parameter set
    simultaneously makes the SelfTargetMSIS hash arm exhaustible (log2|B_tau| <= 40) and
    preserves the FIPS 204 RATIO between the hash arm and the lattice arm within a declared
    tolerance. The lane's claim-tier ceiling is toy-tier and no toy family has ever been
    defined; if the constraint set is EMPTY, then every toy calibration this lane can afford
    speaks about one arm only, and that emptiness is a scoping obstruction that binds all
    seven existing proposals as well as the four filed alongside this one.
  class: tooling
  claim: >-
    (A) THE GAP THIS FILLS, STATED AS A FACT ABOUT THE REPOSITORY AND NOT ABOUT THE
    LITERATURE. RQ-MLDSA-001 sets a claim_tier_ceiling of "toy-tier until a certified instance
    at or above the standardized parameter scale exists", and GOAL-MLDSA-001's completion
    criteria require "measured calibration at reduced parameters where a forgery can be
    certified". No record in this repository defines such a reduced family, states what it
    must preserve, or checks that one exists. Four of the five proposals filed in this batch
    (IDEA-20260821-49ff54, -4c0246, -5535fe, and the calibration arm of -4d4e5f) each assume a
    reduced family with different preserved invariants, and none of them can check its own
    assumption.
    (B) THE OBJECT, MADE EXACT. Define for a parameter tuple P = (n, k, l, q, d, tau, eta,
    gamma1, gamma2, omega, lambda) the pair (Hash(P), Latt(P)) where Hash(P) = log2|B_tau| =
    tau + log2 C(n, tau) and Latt(P) = the core-SVP bits of the MSIS arm under a declared,
    frozen estimator and a declared convention. Define the ARM RATIO r(P) = Hash(P)/Latt(P).
    At FIPS 204 the hash arm is Hash = 192.760 / 225.345 / 257.015 (taken from
    IDEA-20260805-5194f9 and to be RECOMPUTED, not inherited). The question is whether the
    constraint set C = {P : Hash(P) <= 40, |r(P) - r(FIPS_k)| <= 0.10 * r(FIPS_k), and P
    satisfies the FIPS 204 structural relations} is NON-EMPTY over a declared finite grid.
    (C) THE STRUCTURAL RELATIONS THAT MUST HOLD, BECAUSE A FAMILY THAT DROPS THEM IS NOT
    ML-DSA-SHAPED. beta = tau * eta exactly; q congruent to 1 mod 2n (so the NTT exists and
    IDEA-20260821-5535fe's projection is defined); gamma1 a power of two; gamma2 dividing
    (q-1)/2 in the FIPS pattern; the four rejection gates all present and all able to fire;
    tau * 2^{d-1} > gamma2, so the ||c t0||_inf gate is ACTIVE as it is at ML-DSA-44 (39 *
    4096 = 159744 > 95232 = q/88) - without this the family cannot carry
    IDEA-20260821-49ff54's channel at all; and the commitment hash input ordering c-tilde =
    H(mu || w1) with mu = H(tr || M), without which IDEA-20260821-4c0246's shared-prefix object
    does not exist.
    (D) THE TWO OUTCOMES, BOTH SUBSTANTIVE. NON-EMPTY: the search returns one or more families,
    each shipped with a signing/verification implementation, a FORGERY CERTIFICATE VERIFIER
    written independently of the forger, and a frozen record of which invariants it preserves
    and which it does not. That is the executable substrate this lane has never had. EMPTY:
    the search returns nothing, and the reason is derivable and reportable - forcing Hash(P)
    <= 40 drives tau and n down, which drives the module dimension and hence Latt(P) down too,
    so r cannot be held while Hash shrinks by 150-plus bits. That is a NAMED OBSTRUCTION with
    a measured boundary (the largest Hash at which r is still holdable, and the smallest Hash
    at which the grid still contains a valid P), and its consequence is concrete: every
    toy-scale statement in this lane about WHICH ARM BINDS is void, while toy-scale statements
    about a single arm's internal structure remain admissible. Naming which existing proposals
    fall on each side of that line is part of the deliverable.
    (E) WHAT IS NOT CLAIMED. No attack, no exponent, no security statement of any kind. This
    is infrastructure, and per search heuristic 1 of the Idea Generator contract it is offered
    explicitly as a REQUIRED BUILDING BLOCK for exponent-relevant work rather than as a result
    in its own right; it is ranked accordingly below. It does not declare toy calibration
    impossible - if the constraint set is empty at the declared tolerance it reports the
    tolerance at which it becomes non-empty, which is the useful quantity.
  mechanism: >-
    STAGE 1, FREEZE THE ESTIMATOR AND THE CONVENTION. Choose and freeze one MSIS core-SVP
    estimator and one cost convention before any grid is enumerated, and record both. Report
    every result under a second convention as a sensitivity arm, because an arm-ratio
    conclusion that flips with the convention is reporting the convention.
    STAGE 2, VERIFY THE INSTRUMENT ON THE KNOWN POINTS. Evaluate Hash(P) and Latt(P) at the
    three FIPS 204 tuples. Hash must reproduce 192.760 / 225.345 / 257.015 by independent
    recomputation from tau and n = 256 - NOT by reading IDEA-20260805-5194f9's numbers into
    the code. Latt must reproduce whatever the frozen estimator gives, and its distance from
    the published category floors must be reported openly, since IDEA-20260805-591f9d records
    this program's own instrument being off by about 355 in beta against a recalled published
    value; that discrepancy is a KNOWN INSTRUMENT PROBLEM in this repository and must be
    surfaced here rather than absorbed.
    STAGE 3, ENUMERATE. Grid: n in {16, 32, 64, 128}; k, l in 1..4; q ranging over
    NTT-friendly primes with q congruent to 1 mod 2n in a declared range; d in 3..10; tau in
    2..n/2; eta in {1, 2, 4}; gamma1 a power of two in a declared range; gamma2 from the FIPS
    pattern; omega in a declared range; lambda in {16, 24, 32, 48}. Apply the structural
    relations as hard filters, then compute (Hash, Latt, r) for every survivor. Report the
    grid size, the count surviving each filter in order, and the full (Hash, r) scatter.
    STAGE 4, DECIDE AND REPORT THE BOUNDARY. Report whether C is non-empty. If empty, report
    the Pareto frontier of the two objectives - the smallest Hash achievable at each tolerance
    on r, and the tightest tolerance achievable at each Hash - so that the obstruction is a
    measured curve and not a verdict.
    STAGE 5, SHIP OR CLOSE. If non-empty: implement the winning family, implement an
    INDEPENDENT verifier, and freeze both with a fixture of known-good and known-bad
    signatures. If empty: write the closure at the docs/inventor-protocol.md §4 standard -
    named obstruction, argument, measured boundary, forward guidance naming what remains
    (single-arm calibration; families that preserve the ORDERING of the arms without their
    ratio; families that preserve the hash arm's input ordering only, which is all
    IDEA-20260821-4c0246 actually needs).
  novelty_status: unverified
  novelty_screen:
    method: >-
      The crypto-kb MCP retrieval index is UNAVAILABLE this session (in-memory Qdrant), so no
      kb-provenance citation appears here. RIPGREP over /home/user/crypto-autoresearcher with
      the Grep tool (ripgrep, -i): "ML-DSA|Dilithium" over knowledge/ returned 40 files and I
      listed them by path; a combined count-mode pass over ledger/proposals/ for
      "hedged|deterministic mode|SampleInBall|ExpandMask|multi-target|multi-user|QROM|abort
      rate|rejection sampling" returned 611 occurrences across 174 files, recorded as too
      coarse; "SampleInBall" over the repository root returned 8 files; glob
      ledger/hypotheses/H-MLDSA-*.yaml returned 7 (H-MLDSA-12f563, -acac6d, -c7b4e8, -f3a291,
      -2ae88d, -2d4123, -d1e509); glob of experiments/EXP-MLDSA-* showed EXP-MLDSA-2b6f17 and
      EXP-MLDSA-15866e with committed specifications and one run record. READ IN FULL: the
      pre-extracted inventory of all seven RQ-MLDSA-001 proposal titles, RQ-MLDSA-001
      (including claim_tier_ceiling and constraints), GOAL-MLDSA-001 (including
      completion_criteria, campaign_budget and the standing no-new-batch hold),
      KN-FIND-720727, KN-LIT-4f3b80, KN-TECH-1a5b7e, docs/inventor-protocol.md §§1-8,
      docs/target-result-profile.md Parts A-D. WEB: no search was run specifically for this
      record, because its claim is entirely about the contents of THIS repository - whether a
      reduced ML-DSA family with declared preserved invariants exists here - and no external
      source can settle that. Three of the eight searches run this session
      ("multi-user security ML-DSA...", "Hint-MLWE...", "Dilithium rejection sampling
      repetition count...") returned no reduced-parameter Dilithium family; that is a weak
      negative and is recorded as weak. FETCHED AND READ:
      https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.204.ipd.pdf for the three FIPS tuples
      that stage 2 must reproduce.
    results: >-
      No repository record defines a reduced ML-DSA parameter family, states preservation
      criteria for one, or checks that one exists. EXP-MLDSA-2b6f17 and EXP-MLDSA-15866e are
      the only committed ML-DSA experiment specifications and neither ships a scaled family.
      The seven existing RQ-MLDSA-001 proposals are all analytic or metrical at FIPS 204
      parameters and none needs a toy family - which is precisely why the gap has gone
      unnoticed and why it becomes binding the moment this batch's other four records are
      considered for dispatch. IDEA-20260805-591f9d records this program's lattice instrument
      differing by about 355 in beta from a recalled published value, which is why stage 2 is
      an instrument check with an openly reported discrepancy rather than an assumed
      calibration.
    verdict: >-
      UNVERIFIED, and honestly so, though the uncertainty is unusually small here: the claim
      being screened is about this repository's contents, which were checked directly, and not
      about the literature. Reduced-parameter families for lattice schemes are commonplace in
      cryptanalytic practice and this record claims NO novelty for the idea of scaling down a
      scheme. What is claimed as new is (a) the explicit PRESERVATION CRITERION - the arm
      ratio r within a declared tolerance while the hash arm is exhaustible - as a decidable
      predicate rather than an intuition, and (b) the recognition that the criterion may be
      UNSATISFIABLE and that its unsatisfiability is a scoping obstruction for the whole lane.
      No external search would settle (a) or (b) and none was run for them.
  object_first_candidate:
    tracked_object: >-
      The ARM RATIO r(P) = Hash(P)/Latt(P), followed along a path of parameter tuples from the
      FIPS 204 point down to exhaustible scale. What is tracked is a single dimensionless
      number and its trajectory as the scheme is shrunk.
    lossiness: >-
      SEVERELY LOSSY, and the loss is the point. An eleven-dimensional parameter tuple, plus
      the entire structure of two very different hard problems, is projected onto one
      dimensionless scalar. From r one cannot recover n, tau, q, or which problem is which -
      the fibre of the projection is enormous. The discard is compatible with the operation
      this record performs, which is COMPARISON ACROSS SCALES: the question "does the toy
      preserve the FIPS regime" is a question about a ratio, and a ratio is exactly what
      survives a change of scale. It is not a change of coordinates: r is not invertible and
      two families with identical r can differ in every parameter, which is why the record
      also reports the full tuple and the structural filters alongside r rather than r alone.
    propagation: >-
      One step is one move on the parameter grid. The one-step propagation law is computable in
      closed form for the hash arm - Hash(P) = tau + log2 C(n, tau), so d(Hash)/d(tau) and
      d(Hash)/d(n) are exact - and computable by the frozen estimator for the lattice arm. The
      measurable one-step quantity is the ELASTICITY d(log r)/d(log Hash) along the grid: if it
      is near zero, r is insensitive to shrinking and the constraint set is likely non-empty;
      if it is large and of fixed sign, r drags with Hash and emptiness is likely. That
      elasticity is reported as the record's primary structural number and it is what a later
      reader can reuse without re-running the grid.
    survival_score: >-
      The object survives the entire shrink path by construction - r is defined at every grid
      point - but its MEANING dissolves at the point where a structural filter fails, because
      an r computed for a tuple that is not ML-DSA-shaped is a number about a different scheme.
      The record therefore reports r only on filter-surviving tuples and reports the filter
      attrition counts, so the reader can see exactly where the family stops being ML-DSA.
  null_object_control: >-
    THREE controls, all with values derived before the grid is enumerated.
    CONTROL-1, THE FIPS POINTS THEMSELVES, WHICH MUST FAIL ONE CONSTRAINT AND PASS THE OTHER.
    The three FIPS 204 tuples are inserted into the grid. Each MUST fail the exhaustibility
    constraint (Hash = 192.760 / 225.345 / 257.015, all far above 40) and MUST pass the ratio
    constraint trivially (r equals r(FIPS_k) by definition). If a FIPS tuple is reported as
    exhaustible, the exhaustibility test is broken; if a FIPS tuple fails its own ratio
    constraint, the ratio computation is broken. Both failures are detectable in one line and
    both void the search.
    CONTROL-2, THE RATIO-FREE ARM, WHICH MUST RETURN A LARGE SET. Re-run the identical grid
    search with the ratio constraint REMOVED, keeping exhaustibility and the structural
    filters. This must return a substantial non-empty set - shrinking a lattice scheme until
    its challenge space is small is easy. If it returns empty, the grid or the structural
    filters are broken, NOT the question, and no conclusion about the ratio constraint may be
    drawn. This is the control that distinguishes "the ratio constraint is unsatisfiable" from
    "the search is broken", and without it an EMPTY headline would be uninterpretable.
    CONTROL-3, THE HASH-ARM-ONLY DERIVED CHECK. Hash(P) = tau + log2 C(n, tau) is a closed
    form; recompute it independently in exact arithmetic for 20 random grid points and compare
    against the estimator's value. Zero tolerance: any mismatch is a bug.
    SENSITIVITY DEMONSTRATION with three interior points and a monotonicity verdict: sweep the
    ratio tolerance over 2, 5, 10, 20, 50 per cent and report |C| at each. The set size must be
    monotone non-decreasing in the tolerance BY CONSTRUCTION - a non-monotone result is a bug,
    and this is a derived-value check, not a discovery. The reportable quantity is the smallest
    tolerance at which C becomes non-empty.
  discriminated_from:
  - >-
    IDEA-20260801-008 (metrical audit of module dimension and hash-to-ring mapping at FIPS 204)
    and IDEA-20260805-5194f9 (the two arms are incommensurable) both work AT the FIPS point.
    This record works along the path from that point downward and asks whether the path
    preserves anything. It consumes 5194f9's Hash values as targets to reproduce, and
    reproduces rather than inherits them.
  - >-
    IDEA-20260805-591f9d prices the norm budget in BKZ block size and, in doing so, surfaced
    this program''s instrument being off by about 355 in beta. This record does not price
    anything; it uses that discrepancy as the reason stage 2 is an instrument check with an
    openly reported delta rather than an assumed calibration.
  - >-
    IDEA-20260821-4c0246 needs only the hash input ORDERING preserved, not the arm ratio, and
    can therefore run even if this record returns EMPTY - a dependency this record states
    explicitly so that an empty result does not wrongly block it. IDEA-20260821-49ff54 needs
    the ||c t0||_inf gate to be ACTIVE, which is a structural filter here and not a ratio
    condition. IDEA-20260821-5535fe needs q congruent to 1 mod 2n. Each dependency is a
    different subset of this record's filters, and the deliverable includes the per-record
    subset table.
  - >-
    This is not a re-run of any existing experiment. EXP-MLDSA-2b6f17 and EXP-MLDSA-15866e
    ship no scaled family; nothing here re-executes their specifications.
  citations:
  - ref: 'NIST FIPS 204 initial public draft (ipd)'
    provenance: retrieved
    claim: >-
      The three parameter tuples stage 2 must reproduce: q = 8380417, d = 13; ML-DSA-44 (tau
      39, lambda 128, gamma1 2^17, gamma2 q/88, (k,l) (4,4), eta 2, beta 78, omega 80);
      ML-DSA-65 (49, 192, 2^19, q/32, (6,5), 4, 196, 55); ML-DSA-87 (60, 256, 2^19, q/32,
      (8,7), 2, 120, 75). The relation beta = tau * eta is checkable directly against these:
      39*2 = 78, 49*4 = 196, 60*2 = 120 - all three hold, which is itself a useful
      confirmation of the structural filter. FIDELITY CAVEAT: table obtained via the fetch
      tool's summarisation of the ipd PDF, not a byte-level read of the final FIPS 204.
    verified_by: 'idea-generator@2026-08-21 (fetched https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.204.ipd.pdf)'
  - ref: IDEA-20260805-5194f9
    provenance: internal
    claim: >-
      log2|B_tau| = 192.760 / 225.345 / 257.015 at ML-DSA-44 / 65 / 87, described there as a
      FORCED value. Used here as the stage-2 reproduction target. NOT independently recomputed
      by this record; the derived experiment must recompute it from tau and n in exact
      arithmetic and compare.
    verified_by: coordinator@2026-08-21 (orchestrating session; source read in full this session)
  - ref: IDEA-20260805-591f9d
    provenance: internal
