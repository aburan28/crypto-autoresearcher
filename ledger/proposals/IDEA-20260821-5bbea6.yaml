  repair_provenance: >-
    REPAIRED IN PLACE 2026-08-24 by the idea-generator subagent, on instruction from the
    orchestrating session, against BLOCKING 2 and BLOCKING 5 of an independent red-team screen of
    lane MLDSA-001. This record was the one of the batch's five that a previous repair pass never
    reached - the other four already carried repair_provenance blocks and this one carried none.
    BLOCKING 5(a) - NON SEQUITUR IN THE PRE-DECLARED CLOSURE. Claim (D) and the closure
    falsification condition registered the obstruction as "forcing Hash(P) <= 40 drives tau and n
    down, which drives the module dimension and hence Latt(P) down too, so r cannot be held". The
    finding is correct that this supports the OPPOSITE conclusion: r = Hash/Latt is a ratio, so
    two arms falling together preserve it. THE DERIVATION WAS REDONE RATHER THAN THE PROSE
    SOFTENED. From log r = log Hash - log Latt, the one-step law is e = d(log r)/d(log Hash) =
    1 - d(log Latt)/d(log Hash), exactly. The 10 per cent tolerance is a band
    [ln 0.90, ln 1.10] = [-0.10536, +0.09531] in log r; the required shrink is
    ln(Hash(FIPS_k)/40) = 1.5726 / 1.7288 / 1.8603 at ML-DSA-44 / 65 / 87 (from
    Hash = 192.760 / 225.345 / 257.015); so under a constant-e approximation the band is exited
    only if |e| exceeds 0.0606 / 0.0551 / 0.0512 upward or 0.0670 / 0.0610 / 0.0566 downward.
    Those thresholds are now the closure's argument, they appear in claim (D), in the
    propagation law, in prediction 3, in H2, in the closure falsification condition and in a NEW
    CONTROL-4 that voids the headline when the emptiness verdict and the measured elasticity
    disagree. A confounder entry names the joint-decline fallacy in general form, and H2 gains a
    forced-value check (on a synthetic path with Latt proportional to Hash, e must measure 0 and
    C must come out non-empty) that catches a pipeline with the old fallacy hard-coded.
    BLOCKING 5(b) - THE STRUCTURAL FILTER EXCLUDED REAL ML-DSA. The filter "tau * 2^(d-1) >
    gamma2, so the ct0 gate is ACTIVE" was applied universally. Redone from the parameter table:
    39*4096 = 159744 > 95232 at ML-DSA-44 (ACTIVE), 49*4096 = 200704 < 261888 at ML-DSA-65 (DEAD,
    slack 61184), 60*4096 = 245760 < 261888 at ML-DSA-87 (DEAD, slack 16128) - checked against
    IDEA-20260805-bb52fa's own text, which states the same three verdicts and the same two slacks.
    The filter is therefore now a PARAMETER-SET-INDEXED VERDICT MATCH: the search runs three
    times, once per reference set, and a family shaped after -65 or -87 must have a DEAD ct0
    gate. CONTROL-1 is rewritten with four derived per-tuple expectations instead of a uniform
    one, and the forced ct0 verdicts ACTIVE / DEAD / DEAD are a check that can fail. A
    downstream dependency was also misstated and is corrected: IDEA-20260821-49ff54, in its
    repaired form, needs the ct0 gate DEAD, not ACTIVE.
    BLOCKING 5(c) - A WRONG AND LOAD-BEARING GLOB. The record twice asserted that EXP-MLDSA-2b6f17
    and EXP-MLDSA-15866e are the only committed ML-DSA experiment specifications. The glob was
    re-run: there are SEVEN (1c66ac, 15866e, 2b6f17, 462ea2, 3f7ab2, 8c8fa2, a8d531), with run
    manifests under 2b6f17, 3f7ab2 and a8d531. The two the finding named were opened and read.
    EXP-MLDSA-8c8fa2 defines a reduced_cell and EXP-MLDSA-462ea2 a synthetic_reachable_cell, so
    THE HEADLINE EXISTENCE CLAIM WAS TOO STRONG AND IS NARROWED, not restated: what no committed
    record defines is an EXHAUSTIBLE reduced family with a CROSS-ARM preservation criterion and an
    independent forgery-certificate verifier. Neither cell qualifies, and the reasons are
    structural and stated (8c8fa2's cell has no l, tau, gamma1, challenge space or verifier;
    462ea2's is a one-coordinate perturbation of a full-size tuple whose hash arm is unchanged).
    Both are now cited, both appear in discriminated_from and dominated_by, and dominated_by
    records them as DOMINATING this record on the narrower reduced-cell claim. A fourth
    dependency claim was corrected in the same sweep: IDEA-20260821-4d4e5f needs no reduced
    ML-DSA family at all, so claim (A)'s constituency is three of the batch's five, not four.
    BLOCKING 2 - THE NOVELTY SCREEN. novelty_screen.method now records both passes and the second
    by path and command: the corrected experiment glob and run-record glob, the enumeration of the
    ten RQ-MLDSA-ffa0f5 and twelve RQ-MLDSA-001 proposals by question_id grep, the seven
    H-MLDSA-* hypothesis bodies opened rather than counted (with their statuses), a targeted grep
    for this record's own nouns over the hypotheses and the specifications, and the re-derivation
    of the ct0 integers against bb52fa. The verdict's claim that the corpus was "checked directly"
    with "unusually small" uncertainty is WITHDRAWN and replaced by a part-by-part classification.
    discriminated_from gained five entries and source_refs gained fourteen.
    RECOMMENDED_PRIORITY LOWERED FROM `medium` TO `low`. The advertised constituency shrank from
    four downstream records to one, the headline gap narrowed, and the record's own contract ranks
    a building block low unless an exponent-moving idea requires it. The case for restoring
