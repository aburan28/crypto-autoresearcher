    results: >-
      THE FIRST PASS'S HEADLINE IS NARROWED, NOT RESTATED. It is NOT true that "EXP-MLDSA-2b6f17
      and EXP-MLDSA-15866e are the only committed ML-DSA experiment specifications": there are
      seven, and two of the five the first pass missed define reduced or synthetic parameter
      cells. EXP-MLDSA-8c8fa2's reduced_cell and EXP-MLDSA-462ea2's synthetic_reachable_cell are
      both real reduced objects in this repository, and both were committed before this record
      was written. NEITHER IS A FAMILY IN THIS RECORD'S SENSE, and the reasons are structural
      rather than rhetorical: 8c8fa2's cell has no l, no tau, no gamma1, no challenge space and
      no verifier, and exists so that a 16-coefficient t0 posterior can be enumerated exactly;
      462ea2's cell is a FULL-SIZE ML-DSA-87 tuple with one coordinate moved, so its hash arm is
      unchanged at 2^257 and it is not exhaustible, and its own claim_ceiling forbids citing it
      for any real parameter set. The surviving gap is therefore narrower and is restated in
      claim (A): no committed record defines an exhaustible reduced family with a CROSS-ARM
      preservation criterion and an independent forgery-certificate verifier.
      NO INTERNAL DUPLICATE OF THE ARM-RATIO CRITERION WAS FOUND. The targeted grep over the
      seven hypothesis bodies matched only H-MLDSA-2d4123 and H-MLDSA-2ae88d, and in both cases
      on the phrase "reduced parameters" used to scope a measurement, not to define a family or
      a preservation criterion; no hypothesis and no experiment specification computes an arm
      ratio, an exhaustibility threshold, or an elasticity. The ten RQ-MLDSA-ffa0f5 proposals are
      transcript, predicate, t0 and hint-channel records at FIPS parameters (031ce2 the Algorithm
      7 census; 630606 the 34 / 60 / 58 hint-channel floor; bb52fa the ct0 envelope; 4f83f6 the
      public/secret gate partition; 6d1b97 the tilted ct0-rate measurement; 6109f8 the bounded-
      noise linear observation of t0; 60ba98 the TV = p_R identity for a non-conforming signer;
      65739b the bit-plane price curve; 71fc18 the tier lattice; e5f947); none defines a reduced
      family or a cross-arm criterion.
      ONE PREMISE OF THE FIRST PASS WAS FALSE BY INTEGER ARITHMETIC. The structural filter
      "tau * 2^(d-1) > gamma2, so the ||c t0||_inf gate is ACTIVE" was presented as an ML-DSA
      shape property. IDEA-20260805-bb52fa, committed under the sibling question and not opened
      by the first pass, establishes the exact envelope ||<<c t0>>||_inf <= tau * 2^(d-1) and
      evaluates it: ACTIVE at ML-DSA-44, DEAD at ML-DSA-65 (slack 61184) and DEAD at ML-DSA-87
      (slack 16128). A universal ct0-ACTIVE filter therefore excludes two of the three approved
      FIPS parameter sets from the search space, which is a defect in the filter. Clause (C) is
      corrected to a parameter-set-indexed verdict match, and CONTROL-1's expectations are
      corrected per tuple.
      IDEA-20260805-591f9d records this program's lattice instrument differing by about 355 in
      beta from a recalled published value, which is why stage 2 is an instrument check with an
      openly reported discrepancy rather than an assumed calibration. That statement is unchanged
      and was read from that proposal's title only, which its citation says.
    verdict: >-
      UNVERIFIED, and the first version's sentence that the corpus screen was "checked directly"
      and the uncertainty "unusually small" is WITHDRAWN: the screen counted hypothesis files
      without opening them and reported two committed experiment specifications where there are
      seven, so its central repository claim was made on evidence that did not support it. After
      the second pass described in `method`, the honest classification, part by part, is:
      (a) THE IDEA OF SCALING A LATTICE SCHEME DOWN: KNOWN and claimed by nobody here; reduced
      parameter sets are commonplace in cryptanalytic practice and this record claims no novelty
      for the practice, nor for the two reduced cells this program already committed.
      (b) THE PRESERVATION CRITERION - the arm ratio r held within a declared tolerance while the
      hash arm is exhaustible, as a decidable predicate over a declared grid: SPECULATIVE and
      unduplicated in this corpus; no hypothesis body, no experiment specification and no
      proposal in either ML-DSA question computes an arm ratio or an exhaustibility threshold.
      (c) THE ELASTICITY FORMULATION of the emptiness question, with the derived thresholds
      0.061 / 0.055 / 0.051: SPECULATIVE, and it replaces a first-version argument that was a
      non sequitur. It is elementary calculus on a ratio and this record claims no new
      mathematics for it, only that the lane had registered the obstruction incorrectly.
      (d) THE ct0 REACHABILITY ARITHMETIC now in clause (C): NOT THIS RECORD'S. It is
      IDEA-20260805-bb52fa's exact envelope, imported with attribution.
      External novelty is NOT established and no external search was run for (b) or (c). A
      published reduced-parameter Dilithium family stating its preserved invariants may exist
      and would dominate the method axis; that possibility is recorded in dominated_by.
  object_first_candidate:
    tracked_object: >-
      The ARM RATIO r(P) = Hash(P)/Latt(P), followed along a path of parameter tuples from the
      FIPS 204 point down to exhaustible scale. What is tracked is a single dimensionless
      number and its trajectory as the scheme is shrunk.
    lossiness: >-
      SEVERELY LOSSY, and the loss is the point. An eleven-dimensional parameter tuple, plus
      the entire structure of two very different hard problems, is projected onto one
      dimensionless scalar. From r one cannot recover n, tau, q, or which problem is which -
      the fibre of the projection is enormous. The discard is compatible with the operation
      this record performs, which is COMPARISON ACROSS SCALES: the question "does the toy
      preserve the FIPS regime" is a question about a ratio, and a ratio is exactly what
      survives a change of scale. It is not a change of coordinates: r is not invertible and
      two families with identical r can differ in every parameter, which is why the record
      also reports the full tuple and the structural filters alongside r rather than r alone.
      NOTE THE PRICE OF THAT DISCARD, WHICH IS EXACTLY WHERE THE FIRST VERSION'S CLOSURE
      ARGUMENT WENT WRONG: a ratio discards the common scale, so an argument that both arms
      move in the same direction says NOTHING about r. Only the RATE difference survives the
      projection, which is why the elasticity and not the level is the reported quantity.
    propagation: >-
      One step is one move on the parameter grid. The one-step propagation law is computable in
      closed form for the hash arm - Hash(P) = tau + log2 C(n, tau), so d(Hash)/d(tau) and
      d(Hash)/d(n) are exact - and computable by the frozen estimator for the lattice arm.
      Because log r = log Hash - log Latt, the one-step law for the tracked object is exactly
      e = d(log r)/d(log Hash) = 1 - d(log Latt)/d(log Hash): the arms cancel to first order
      when they shrink at equal proportional rate. If e is near zero, r is insensitive to
      shrinking and the constraint set is likely NON-EMPTY; if |e| exceeds the derived category
      threshold (0.061 / 0.055 / 0.051 upward, 0.067 / 0.061 / 0.057 downward) over the required
      shrink, emptiness follows. That elasticity is the record's primary structural number and
      it is what a later reader can reuse without re-running the grid.
    survival_score: >-
      The object survives the entire shrink path by construction - r is defined at every grid
      point - but its MEANING dissolves at the point where a structural filter fails, because
      an r computed for a tuple that is not ML-DSA-shaped is a number about a different scheme.
      The record therefore reports r only on filter-surviving tuples, per reference set, and
      reports the filter attrition counts, so the reader can see exactly where the family stops
      being ML-DSA.
  null_object_control: >-
    FOUR CONTROLS PLUS A SENSITIVITY DEMONSTRATION, all with values derived before the grid is
    enumerated. The first version of this record declared THREE; CONTROL-4 is new and is the one
    that can falsify the headline the closure would otherwise rest on.
    CONTROL-1, THE FIPS POINTS THEMSELVES, WITH A PER-TUPLE EXPECTATION TABLE THAT IS NO LONGER
    UNIFORM. The three FIPS 204 tuples are inserted into the grid. DERIVED EXPECTATIONS, all
    four checkable in one line each: (i) EXHAUSTIBILITY - all three MUST FAIL it
    (Hash = 192.760 / 225.345 / 257.015, all far above 40); a FIPS tuple reported exhaustible
    means the exhaustibility test is broken. (ii) RATIO - all three MUST PASS trivially, since
    r equals r(FIPS_k) by definition; a FIPS tuple failing its own ratio constraint means the
    ratio computation is broken. (iii) beta = tau * eta - all three MUST PASS: 39*2 = 78,
    49*4 = 196, 60*2 = 120. (iv) ct0 REACHABILITY - THE THREE VERDICTS ARE NOT THE SAME AND THE
