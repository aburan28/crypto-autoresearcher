  assumptions:
  - >-
    A single frozen MSIS core-SVP estimator is a legitimate common instrument across three
    orders of magnitude of dimension. This is doubtful at the small end - core-SVP conventions
    are asymptotic and are known to be poor guides at tiny block sizes - and the record
    therefore reports the smallest dimension at which the estimator is defended, and treats
    every ratio computed below that as unreliable and flags it in the output.
  - >-
    log2|B_tau| = tau + log2 C(n, tau) is the correct hash-arm size for the surrogate as it is
    for FIPS 204. This is exact combinatorics, not an estimate, and CONTROL-3 checks it.
  - >-
    The emptiness question is a question about the RATE at which the two arms shrink, not about
    their levels. Formally: log r = log Hash - log Latt, so e = d(log r)/d(log Hash) =
    1 - d(log Latt)/d(log Hash), and a joint decline of both arms at equal proportional rate
    leaves r EXACTLY fixed. Any argument for emptiness that cites only the joint decline is a
    non sequitur; the first version of this record contained one and it is withdrawn.
  - >-
    The ct0 reachability condition is a PROPERTY OF A REFERENCE PARAMETER SET, not of ML-DSA.
    tau * 2^(d-1) exceeds gamma2 at ML-DSA-44 and does not at ML-DSA-65 or ML-DSA-87, so the
    filter is applied as a verdict MATCH against a declared reference set k and the search is
    run three times. A universal ct0-ACTIVE filter would exclude two of the three approved FIPS
    tuples from the search space.
  - >-
    The declared grid is large enough that emptiness over the grid is informative about
    emptiness over the parameter space. IT IS NOT A PROOF OF EMPTINESS and the record must
    never state it as one; the honest statement is "empty over the declared grid", with the
    grid published.
  - >-
    Structural fidelity is captured by the listed filters. Other properties of ML-DSA are
    certainly not captured, and any downstream record must state which of ITS assumptions the
    family preserves rather than assuming the family is ML-DSA in miniature.
  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
