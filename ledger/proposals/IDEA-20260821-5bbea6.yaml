      responsibility: null
    not_applicable_reason: >-
      This is a tooling and feasibility record. It certifies no theorem, states no asymptotic,
      proposes no reduction and produces no certificate family whose soundness needs auditing;
      the one thing it decides - is a declared finite constraint set non-empty - is settled by
      enumeration, and its honest scope limit ("empty over the declared grid, which is not a
      proof of emptiness over the parameter space") is stated in `assumptions` and
      `interpretation_limits` rather than as a method ceiling. The section 8 audits have no
      object to bind to here. The nearest section-8-shaped obligation, baseline reproduction, IS
      present and is implemented as CONTROL-1: the three FIPS 204 tuples are exact points of the
      search space and must reproduce their known Hash values, fail exhaustibility, pass the
      ratio and beta relations, and return the forced ct0 verdicts ACTIVE / DEAD / DEAD.
  predictions:
  - metric: 'is the constraint set C non-empty over the declared grid, per reference set'
    direction: different
    minimum_effect: 'a boolean per reference set with the surviving tuples listed; PREDICTED EMPTY at the 10 per cent tolerance, and a non-empty result is the more useful outcome'
  - metric: 'smallest ratio tolerance at which C becomes non-empty, over the sweep 2/5/10/20/50 per cent'
    direction: higher
    minimum_effect: 'predicted above 20 per cent; a value at or below 10 per cent flips the headline to non-empty'
  - metric: 'Hash-averaged elasticity |e| = |d(log r)/d(log Hash)| along the shrink path, over filter-surviving tuples, per reference set'
    direction: higher
    minimum_effect: 'the DERIVED emptiness threshold, and this is the row the closure now rests on. Exiting the 10 per cent band over the required shrink ln(Hash(FIPS_k)/40) = 1.5726 / 1.7288 / 1.8603 needs |e| above ln(1.10)/that = 0.061 / 0.055 / 0.051 for an upward departure of r, or |ln(0.90)|/that = 0.067 / 0.061 / 0.057 for a downward one. |e| BELOW those values together with an EMPTY C is internally inconsistent and indicts the grid, the filters or the estimator rather than the mathematics; |e| ABOVE them with a NON-EMPTY C indicts a filter defect.'
  - metric: 'CONTROL-1: Hash at the three FIPS tuples, recomputed in exact arithmetic'
    direction: different
    minimum_effect: 'must equal 192.760 / 225.345 / 257.015 to three decimals, and all three must fail the <= 40 exhaustibility filter'
  - metric: 'CONTROL-1: ct0 reachability verdict at the three FIPS tuples'
    direction: different
    minimum_effect: 'must return ACTIVE / DEAD / DEAD, from 39*4096 = 159744 > 95232, 49*4096 = 200704 < 261888 and 60*4096 = 245760 < 261888. Uniform verdicts across the three tuples mean the filter is broken.'
  - metric: 'CONTROL-2: |C| with the ratio constraint removed'
    direction: higher
    minimum_effect: 'at least 100 surviving tuples, or the search is broken and no headline is reported'
  - metric: 'largest Hash at which the ratio is still holdable within 10 per cent, and smallest Hash at which any structurally valid tuple exists'
    direction: different
    minimum_effect: 'the two numbers bounding the obstruction; reporting the gap between them, together with the measured elasticity, IS the closure''s measured quantity'
  minimal_test:
    design: >-
      One script, one invocation, no lattice reduction and no signing. Freeze the estimator and
      convention. Insert the three FIPS tuples and run CONTROL-1 (four independent checks per
      tuple: exhaustibility fail, ratio pass, beta = tau*eta pass, ct0 verdict ACTIVE / DEAD /
      DEAD) and CONTROL-3. Enumerate the declared grid, apply the unconditional structural
      filters in a fixed order recording attrition at each, then apply the ct0 verdict filter
      three times to produce three per-reference-set survivor sets, compute (Hash, Latt, r) for
      survivors, and evaluate C at five tolerances. Measure e by local regression and run
      CONTROL-4 against the derived thresholds. Run CONTROL-2. Report the booleans, the
      attrition table, the (Hash, r) scatter, the elasticity with its interval, the two boundary
      numbers, and the second-convention sensitivity arm. THIS DISCRIMINATES because CONTROL-1's
      values are known in advance and are NOT uniform across the three tuples, so a filter that
      treats them uniformly is caught before any enumeration; because CONTROL-2 separates "the
      constraint is unsatisfiable" from "the search is broken", which is the only way an EMPTY
      headline can mean anything; and because CONTROL-4 makes the emptiness verdict and the
      measured elasticity checkable against each other, so an empty result unaccompanied by a
      sufficient elasticity is reported as an instrument failure rather than as an obstruction.
      COST: WELL UNDER ONE HOUR OF SINGLE-CORE COMPUTE. The grid as declared is on the order of
      10^6 tuples and the per-tuple work is a binomial logarithm plus one estimator call; if the
      estimator is the slow part, it is evaluated only on the tuples that survive the structural
      filters, which is a small fraction.
    controls:
    - 'CONTROL-1: the three FIPS 204 tuples inside the search space, with four derived per-tuple expectations - fail exhaustibility, pass the ratio, pass beta = tau*eta, and return ct0 verdicts ACTIVE (-44) / DEAD (-65) / DEAD (-87).'
    - 'CONTROL-2: identical search with the ratio constraint removed, which must return a large non-empty set.'
    - 'CONTROL-3: exact-arithmetic recomputation of tau + log2 C(n, tau) at 20 random grid points, zero tolerance.'
    - 'CONTROL-4: elasticity consistency - an EMPTY C with Hash-averaged |e| below the derived category threshold, or a NON-EMPTY C with |e| far above it, voids the headline.'
    - 'Tolerance sweep at 2/5/10/20/50 per cent with a monotonicity check whose expected result is derived (non-decreasing by construction).'
    - 'Second cost convention as a sensitivity arm, reported in full.'
    - 'Filter attrition counts in a fixed order, so a filter that removes everything is visible rather than silent.'
    - 'Explicit flagging of every tuple whose dimension is below the smallest dimension at which the frozen estimator is defended.'
    required_metrics:
    - 'boolean per reference set: C non-empty at 10 per cent tolerance, with the surviving tuples listed in full'
    - 'filter attrition table, with the ct0 verdict filter reported separately per reference set'
    - 'the (Hash, r) scatter over filter-surviving tuples, machine-readable'
    - 'Hash-averaged elasticity e with an interval, and its comparison against the derived thresholds 0.061 / 0.055 / 0.051 and 0.067 / 0.061 / 0.057'
    - 'CONTROL-1 recomputed Hash values, ct0 verdicts, and their pass/fail on each of the four checks'
    - 'CONTROL-2 set size'
    - 'smallest tolerance at which C becomes non-empty'
    - 'largest Hash with r holdable at 10 per cent; smallest Hash with any valid tuple'
    - 'the frozen estimator, convention, and grid definition, as artefacts'
    - 'per-downstream-record filter subset table, corrected: which filters each of IDEA-20260821-49ff54 (wt(h) live, ct0 DEAD), -4c0246 (hash input ordering, small |B_tau|) and -5535fe (q congruent to 1 mod 2n) actually needs, and the explicit record that IDEA-20260821-4d4e5f needs none'
  falsification_conditions:
  - 'CONTROL-1 fails on any of its four checks - a FIPS tuple reported exhaustible, a Hash that does not recompute to three decimals, beta not equal to tau*eta, or a ct0 verdict other than ACTIVE / DEAD / DEAD: the instrument is broken and no result is reported.'
  - 'CONTROL-2 returns fewer than 100 tuples: the grid or the structural filters are broken; an EMPTY headline would be uninterpretable and is not reported.'
  - 'CONTROL-3 finds any mismatch in the exact-arithmetic Hash recomputation: a bug, zero tolerance.'
  - 'The tolerance sweep is non-monotone: a bug, since set size is non-decreasing in tolerance by construction.'
  - 'CONTROL-4 fails: C is EMPTY while the measured Hash-averaged |e| is below the derived category threshold (0.061 / 0.055 / 0.051 upward, 0.067 / 0.061 / 0.057 downward). The two cannot both be true - at that elasticity the ratio band is not exited over a shrink of ln(Hash(FIPS_k)/40) - so the emptiness is an artefact of the grid, the filters or the estimator and NO CLOSURE IS FILED.'
  - 'C is EMPTY at 10 per cent with CONTROL-2 and CONTROL-4 both healthy: recorded as a section-4-standard closure - named obstruction (the two arms shrink at DIFFERENT proportional rates, with Hash-averaged |e| measured above its category threshold, so r departs the tolerance band before Hash reaches 40; note explicitly that a joint decline of both arms would NOT produce this and that the first version of this record argued from one), argument (the measured elasticity against the derived threshold), measured boundary (the two Hash numbers and the Pareto curve), and forward guidance (single-arm calibration remains admissible; ORDERING-preserving rather than ratio-preserving families are a named next target; IDEA-20260821-4c0246 and IDEA-20260821-4d4e5f are explicitly NOT blocked).'
  - 'C is NON-EMPTY: the families are shipped with an independent verifier and a fixture, and the record makes no claim beyond their existence and their declared preserved invariants.'
  - 'The headline flips between the two cost conventions: the result is a statement about the convention and must be phrased as one.'
  - 'The corrected headline gap claim fails on re-check - i.e. some committed record DOES define an exhaustible reduced family with a cross-arm preservation criterion and an independent forgery verifier: this record''s motivation is void and it is withdrawn in favour of that record.'
  confounders:
  - 'Core-SVP conventions are asymptotic and unreliable at small block sizes; every tuple below the defended dimension is flagged, and a headline resting on flagged tuples is not a headline.'
  - 'This program''s lattice instrument is already recorded as differing by about 355 in beta from a recalled published value (IDEA-20260805-591f9d). If that discrepancy is a fixed offset it cancels in a RATIO; if it is dimension-dependent it does not, and stage 2 must report which, because the entire record is about a ratio.'
  - 'THE JOINT-DECLINE FALLACY, WHICH THIS RECORD COMMITTED. A ratio discards the common scale, so "both arms fall as the scheme shrinks" is compatible with r being exactly preserved and is not evidence for emptiness. Any closure filed from this record must argue from the measured elasticity against its derived threshold, never from the direction of movement of the two arms.'
  - 'Grid coarseness: emptiness over a grid is not emptiness over a space, and a finer grid could find a point. The grid is published so a later reader can refine it.'
  - 'The structural filters encode a judgement about what makes a family "ML-DSA-shaped"; a different judgement gives a different answer. The filters are declared before the run and their attrition is reported individually so the judgement is auditable. The ct0 filter in particular is now a verdict MATCH rather than a requirement, precisely because the first judgement excluded two of the three approved parameter sets.'
  - 'Choosing the tolerance after seeing the scatter would let the headline be selected; the 10 per cent tolerance is declared in this record, before any enumeration, and so are the elasticity thresholds derived from it.'
  interpretation_limits:
  - 'An EMPTY result means "empty over the declared grid at the declared tolerance under the frozen estimator, for the declared reference set". It is not a proof, not a statement about all reduced families, and explicitly not a claim that toy calibration is impossible.'
  - 'A NON-EMPTY result licenses only the invariants the family is verified to preserve, listed explicitly. A downstream record may rely on exactly those and no others.'
  - 'No security claim of any tier. No attack, no forgery at any parameter set, no statement about FIPS 204.'
  - 'The lattice arm''s absolute values inherit this program''s known instrument discrepancy and are reported as such; only the ratio is offered as the object, and only if the discrepancy is shown to be offset-like.'
  - 'The headline gap claim is NARROW and is stated narrowly in claim (A): two committed specifications (EXP-MLDSA-8c8fa2, EXP-MLDSA-462ea2) already define reduced or synthetic parameter cells, and this record does not claim otherwise. What no committed record defines is an exhaustible reduced family with a cross-arm preservation criterion and an independent forgery-certificate verifier.'
  - 'The ct0 reachability verdicts used as CONTROL-1 forced values are IDEA-20260805-bb52fa''s exact envelope, imported. This record derives no reachability result and makes no claim about the ct0 predicate''s firing rate at any parameter set.'
  heuristic_assumptions:
  - id: H1
    statement: >-
      For the declared family of parameter tuples, the frozen core-SVP estimator's output
      Latt(P) is a monotone increasing function of the module dimension k*n at fixed
      (q, gamma1, eta), so that shrinking the hash arm by reducing n or tau cannot be
      compensated by any admissible move that leaves Latt unchanged.
    rigorous_support: >-
      The rigorous ingredient is that the MSIS lattice's dimension is exactly (k+l)*n and its
      determinant is exactly q^{k*n}, both closed-form; the classical statement being imitated
      is the standard monotonicity of the required BKZ block size in the lattice dimension at
      fixed root-Hermite target, which underlies every published core-SVP estimate. H1 asks
      only that the frozen estimator inherits that monotonicity over the declared grid rather
      than exhibiting non-monotone artefacts at small dimension. NOTE WHAT H1 DOES NOT SAY, and
      what the first version of this record read into it: monotonicity of Latt in the dimension
      says nothing about the RATIO r, because Hash falls with the dimension too. H1 is a
      well-behavedness assumption about the instrument, not an argument for emptiness.
    validation_plan: >-
      Evaluate Latt on a one-dimensional sweep of k*n from the smallest grid value to 256*8 at
      fixed (q, gamma1, eta, l/k ratio) and check monotonicity at every step, reporting the
      number and location of any inversions. TAIL CHECK: examine the ten smallest dimensions
      specifically, where core-SVP conventions are least reliable, and report the smallest
      dimension above which monotonicity holds without exception - that number becomes the
      "defended dimension" used to flag tuples. Repeat under the second cost convention.
      Sampled parameters recorded. TRANSFER ASSUMPTION: none needed, since the sweep spans the
      whole grid including the FIPS points; if monotonicity fails somewhere in the middle, that
      is a direct falsifier of H1 and of the record's core objective.
  - id: H2
    statement: >-
      The elasticity e = d(log r)/d(log Hash) = 1 - d(log Latt)/d(log Hash) is approximately
      constant along the shrink path over the filter-surviving region, so that the emptiness or
      non-emptiness of C at a given tolerance is predictable from e and the required shrink in
      Hash rather than requiring the full enumeration. Under H2 the decision rule is explicit:
      C is empty at tolerance t iff |e| * ln(Hash(FIPS_k)/Hash_max) exceeds ln(1+t) upward or
      |ln(1-t)| downward, which at t = 0.10 and Hash_max = 40 gives the thresholds
      |e| > 0.061 / 0.055 / 0.051 and 0.067 / 0.061 / 0.057 at ML-DSA-44 / 65 / 87.
    rigorous_support: >-
      Imitates the ordinary local-power-law approximation for a smooth ratio of two smooth
      functions of the same underlying scale. Its rigorous half is exact and is the identity
      log r = log Hash - log Latt, from which e = 1 - d(log Latt)/d(log Hash) follows with no
      approximation at all, together with the fact that Hash(P) = tau + log2 C(n, tau) is smooth
      and explicitly differentiable in tau and n; the heuristic half is only that Latt(P) tracks
      the dimension smoothly enough for a SINGLE exponent to describe the whole trajectory. If
      that half fails, the identity survives and the record reports the full e-curve and
      integrates it numerically instead of using one threshold.
    validation_plan: >-
      Estimate e by local regression in overlapping windows along the Hash axis and report its
      variation across windows with an interval; a coefficient of variation above 0.5 falsifies
      "approximately constant" and the record then reports the full curve and the integrated
      log-r displacement rather than a single elasticity. Cross-check the prediction: use e
      measured on the upper half of the Hash range to PREDICT the ratio attainable at the bottom
      of the range, then compare against the enumerated value there - a genuine held-out
      prediction rather than a fit. TAIL CHECK: the prediction error at the single smallest Hash
      value in the grid, reported separately. FORCED-VALUE CHECK, derived before the run: on any
      synthetic path constructed so that Latt is proportional to Hash, the measured e must come
      out at 0 within the regression interval and C must come out NON-EMPTY at every tolerance;
      a pipeline that reports emptiness there has hard-coded the first version's fallacy.
      Sampled parameters recorded. TRANSFER ASSUMPTION: e is not extrapolated outside the grid.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE IS MOVED. This record is explicitly a BUILDING
      BLOCK under search heuristic 1 of the Idea Generator contract, and is ranked accordingly -
      note that the contract makes a building block low priority unless it is required by an
      exponent-moving idea, and the records that need it (IDEA-20260821-49ff54 above all) move
      no exponent either. Its own cost is O(|grid|) binomial-logarithm evaluations plus
      O(|survivors|) estimator calls; the declared grid is on the order of 10^6 tuples and the
      survivor count is expected to be orders of magnitude smaller.
    memory_exponent: >-
      Not applicable to any attack. The record's own storage is the survivor table, well under
      a gigabyte.
    best_known: >-
      There is no incumbent for the cross-arm preservation criterion, because no committed
      record states one. The nearest incumbents inside the repository, and the first version of
      this record did not know they existed: EXP-MLDSA-8c8fa2's reduced_cell and
      EXP-MLDSA-462ea2's synthetic_reachable_cell, both single-purpose and neither exhaustible
      on the hash arm. On the adjacent axis of "what does the lane's toy-tier ceiling actually
      permit", the incumbent is RQ-MLDSA-001's prose requirement, which names the need and does
      not check that it is satisfiable.
    hidden_overhead: >-
      Three honest disclosures. (i) The frozen estimator's reliability at small dimension is the
      hidden cost of the whole design, and it is the reason the "defended dimension" is
      computed and every tuple below it is flagged. (ii) This program's own beta discrepancy of
      about 355 (IDEA-20260805-591f9d) sits underneath every Latt value; whether it cancels in
      a ratio is not known in advance and stage 2 must determine it. If it does not cancel, the
      record's central object is compromised and that must be reported rather than absorbed.
      (iii) The elasticity thresholds are derived under H2's constant-e approximation; if e
      varies strongly the single threshold is replaced by a numerical integration of the e-curve
      and the decision becomes path-dependent, which is a genuine cost the record pays rather
      than hides.
    tradeoff_note: >-
      The Pareto frontier between exhaustibility (small Hash) and fidelity (r close to
      r(FIPS_k)) IS the deliverable in the empty case, and it is a genuine two-objective
      tradeoff curve rather than a time-memory one. Parallelisation over the grid is trivial and
      irrelevant to the conclusion.
