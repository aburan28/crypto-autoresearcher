  assumptions:
    - >-
      The executor session has a shell, Python 3 with arbitrary-precision
      integers, 14 cores and 48 GB. THIS IS THE FIRST RECORD IN THIS SESSION FOR
      WHICH THE CORE COUNT IS ACTUALLY BINDING - the sweep is 132608 independent
      candidates and its wall clock scales inversely with cores.
    - >-
      No SEA, Sage or PARI backend, hence no primality test on any odd part and
      hence no completion of the rule. The survivor set is the deliverable and
      the incompleteness is structural, not budgetary.
    - >-
      IDEA-20260829-d052e6 and IDEA-20260829-fa8d4e have each passed their own
      exhaustive toy censuses. Applying an unvalidated instrument to 132608
      curves produces 132608 unvalidated verdicts, which is worse than producing
      none.
    - >-
      THE RULE IS TAKEN FROM THE MIRROR AT TIER 2 AND MUST BE RE-READ AT TIER 1
      BEFORE ANY EXTERNAL STATEMENT. tables/rigid.tsv is a derived artifact;
      pages/rigid.html is the authority; pages/rigid.txt is forbidden for this
      reading by MIRROR-DEF-1, which concerns this very table. No recipe is
      attributed to M-383, whose cell is empty.
    - >-
      The rule's clauses are implemented EXACTLY AS WRITTEN, including that the
      minimised quantity is (A - 2)/4 and not (A + 2)/4, and that the ordering is
      over A > 2. A silent substitution of one convention for the other changes
      the candidate set and would invalidate the reproduction.
    - >-
      Curve parameters are taken from the RQ-SCURVE-5a64f4 intake, cross-checked
      against the mirror's equation.tsv and field.tsv, and re-checked -
      A^2 - 4 nonzero and equal to the published 281364471840, p prime at a
      stated tier, p congruent to 5 modulo 8 as the rule itself asserts.

  proof_search_map:
    bottleneck: >-
      That the rigid criterion has never been tested by any computation in this
      program, and that IDEA-20260829-f5bcff concluded it cannot be. The
      bottleneck removed is not a cost but a CATEGORY ERROR - a minimality rule
      is decidable by enumeration over a space of 132608 elements, and the only
      genuinely expensive clause is primality of the odd parts, which can be
      quarantined at the end of the filtration rather than blocking it at the
      start. The mirror removes the RETRIEVAL half of the problem entirely and
      leaves the VERIFICATION half untouched, which is precisely the half the
      goal's next_action names.
    baseline_embedding:
      parameter_slice: >-
        Restricted to the single candidate A = 530438 and to filter F2 alone, the
        sweep reduces EXACTLY to IDEA-20260829-d052e6 applied to M-511; restricted
        to F3 alone it reduces exactly to IDEA-20260829-fa8d4e applied to M-511.
        Both must be reproduced bit-identically. Additionally the F1 and F2
        outputs on that candidate must reproduce the mirror's own published cells
        - chi(A^2 - 4) = -1 matching "1 point of order 2" in complete.tsv, and
        (v_2(#E), v_2(#E^t)) = (3, 2) matching cofactor 2^3 and twist cofactor
        2^2 in twist.tsv.
      reproduction_check: >-
        A frozen fixture asserting that the sweep's per-candidate verdict for
        A = 530438 equals, field by field, the output of d052e6 and fa8d4e run
        standalone on the same input AND the mirror's three published cells,
        executed before the enumeration starts. This is also the blocking
        self-check, so baseline embedding and positive control are one
        computation - a design economy worth stating.
    observation_collision:
      observable: >-
        The per-candidate verdict vector, and at the population level the vector
        of survival counts.
      distinct_preimage_search: >-
        REQUIRED, AND THE ANSWER IS KNOWN IN ADVANCE AND IS THE RECORD'S CENTRAL
        LIMITATION. Collisions are GUARANTEED AND NUMEROUS - by C4 about 3875
        candidates share the surviving verdict class, so the observable does NOT
        identify the coefficient and CANNOT distinguish the published one from
        its roughly 3874 companions. THE CONSEQUENCE, WHICH MUST BE WRITTEN INTO
        THE DELIVERABLE - the sweep can never certify that 530438 is minimal; it
        can only certify that at most about 3875 candidates remain and exhibit
        them. THE SEPARATING CONDITION is primality of the two odd parts, which
        requires point counting and is exactly the clause quarantined at the end.
        A SECOND COLLISION AT THE POPULATION LEVEL - two different rules can
        produce the same survival counts while differing on which candidate
        survives, so the counts test the DENSITY MODEL and the rule-branch table
        tests the RULE, and the two must be reported separately.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Build a per-candidate resource measure - the cost of the cheapest
          filter that eliminates it - and charge each candidate exactly once, to
          the stage that killed it, ordering the stages so the most expensive
          filter runs on the smallest surviving set. The blocks are provably
          disjoint because the filtration is monotone and a candidate is charged
          to its first eliminating stage only.
        predicted_gain: >-
          The whole sweep at the cost of about 132608 Legendre symbols plus about
          66000 halving chains plus about 33000 cheap Schoof-lite runs, instead
          of 132608 full Schoof-lite runs - roughly an order of magnitude
          reduction in the dominant term, the difference between hours and days
          on 14 cores.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable fixed - the criterion cell "rigid: fully rigid" -
          and vary the forgotten structure, namely which clause set is enforced,
          by running the sweep under the M-511 published clause set, under the
          terse M-221 and Curve383187 clause set taken literally, and under the
          terse set augmented with M-511's order clauses. Record which variants
          keep the published coefficient alive.
        predicted_gain: >-
          A measured count of clause sets consistent with each published
          coefficient, whose base-two logarithm is the recipe's
          UNDER-SPECIFICATION IN BITS - a number this program does not hold for
          any curve and which is the honest quantitative content of a rigidity
          audit that cannot complete. THE MIRROR MAKES THIS SHARPER, NOT
          REDUNDANT - it shows the M-221 and Curve383187 recipes state no order
          conditions at all, so their literal reading selects A = 3 and the
          under-specification is large and measurable.
      - transform: representation_reduction
        proposed_object: >-
          Replace the rule's fourth clause, "quadratic twist order is n' = 4r'",
          by nothing, having proved it follows from the third clause and
          p congruent to 1 modulo 4 via IDEA-20260829-d052e6's C2.
        predicted_gain: >-
          One fewer independent condition to test, and a zero-compute structural
          statement about a published design rule - that it has three independent
          clauses, not four - which is the kind of observation only a derivation
          can supply and which no table contains.
    quantifier_order: >-
      C1 and C5 are claimed PER CURVE AND EXISTENTIALLY as readings of published
      text at tier 2. C2 is claimed PER CURVE - FOR THIS published coefficient,
      the enumerated range has exactly this size. C3's redundancy is claimed
      UNIFORMLY - FOR ALL Montgomery curves over p congruent to 1 modulo 4,
      v_2(#E) at least 3 implies v_2(#E^t) = 2. C4 is claimed AS AN EXPECTATION
      UNDER TWO NAMED HEURISTICS and is therefore conditional. C7's self-check is
      claimed EXISTENTIALLY AND IS BLOCKING. THE STATEMENT NOT CLAIMED, AND ITS
      ABSENCE IS THE RECORD'S HONEST BOUNDARY - FOR ALL A' below the published
      one, A' fails the rule. That is minimality, it requires primality of two
      roughly 508-bit odd parts per survivor, and it is out of reach here. A
      record writing "M-511's coefficient is minimal" on this evidence has
      committed a claim-tier violation; so has a record writing "SafeCurves'
      minimality claim is verified".
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under the published clause set, exactly N of the 132608 candidates below
        the published coefficient survive the cheap clauses, the published
        coefficient is among the survivors, and the surviving set is the
        exhibited list." Together with a per-survivor certificate, that is the
        ceiling. It certifies NOTHING about minimality, NOTHING about the
        designers' actual procedure, NOTHING about any criterion cell, and
        NOTHING about security. Pushed to its limit under ideal tuning - every
        small prime reached up to where the polynomial arithmetic dies - the
        method would reduce the survivor set by a further factor of a few and
        would still stop at primality.
      nearby_object_control: >-
        CURVE25519 IS THE CALIBRATION ROW AND IT IS BLOCKING, AND THE MIRROR MAKES
        IT MUCH STRONGER THAN IT WAS. Its rigid cell states the rule in unusual
        detail, including "Curve and twist orders required to be {4*prime,
        8*prime}", "Primes required to be above 2^252 ... ruling out A=358990 and
        A=464586", and "A=486662 chosen as smallest positive integer meeting
        these requirements". THE TWO NAMED REJECTED COEFFICIENTS ARE AN EXACT
        POSITIVE CONTROL THAT DID NOT EXIST BEFORE THE MIRROR WAS READ - the
        pipeline must confirm that 358990 and 464586 SURVIVE the cheap clauses,
        since they were rejected for a reason the cheap clauses do not test, and
        must confirm 486662 survives. A pipeline that eliminates any of the three
        has a defect no M-511 run could reveal. A SECOND NEARBY OBJECT -
        CURVE383187, whose A is ODD and which therefore CANNOT satisfy M-511's
        "(A - 2)/4" clause; the pipeline must report a REFUSAL of that clause set
        for that row rather than silently widening the enumeration, which proves
        the clause is actually enforced.
    proof_obligations:
      - claim: >-
          530438 - 2 = 530436 = 4 * 132609, so the minimised quantity is 132609
          and there are exactly 132608 candidate values strictly below it.
        responsibility: size
      - claim: >-
          For p congruent to 1 modulo 4, v_2(#E) at least 3 implies
          v_2(#E^t) = 2, so the published rule's fourth clause is implied by its
          third.
        responsibility: strictness
      - claim: >-
          Each filter is a deterministic predicate of the candidate alone, so the
          survivor sets are nested and a budget stop leaves a valid partial
          result.
        responsibility: correctness
      - claim: >-
          The expected survivor count is the product of the candidate count,
          P_cheap and the product of (1 - 2/q), under the two named heuristics.
        responsibility: success_probability
      - claim: >-
          Ordering filters by cost per candidate eliminated gives the stated
          order-of-magnitude saving over the naive order.
        responsibility: runtime
      - claim: >-
          The published coefficient survives its own published clause set, and
          its F1 and F2 outputs reproduce the mirror's complete.tsv and
          twist.tsv cells.
        responsibility: baseline
      - claim: >-
          Curve25519's A = 486662 and the two coefficients its recipe names as
          rejected, 358990 and 464586, all survive the cheap clauses.
        responsibility: baseline
      - claim: >-
          Each survivor carries a certificate re-verifiable by a second
          implementation at the same per-candidate cost.
        responsibility: interface
      - claim: >-
          Minimality is NOT certified and the deliverable says so in every
          sentence that mentions the survivor set.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        whether the published rule's fourth clause is implied by its third, by
        the p congruent to 1 modulo 4 forcing theorem
      direction: different
      minimum_effect: >-
        PREDICTED YES - the rule has three independent clauses, not four. Zero
        compute. THE TWO OUTCOMES - if yes, this is a structural statement about a
        published design rule that only a derivation can supply and it costs
        nothing; if no, then IDEA-20260829-d052e6's C2 is wrong, which is a far
        more consequential finding and must be pursued there rather than here.
    - metric: >-
        survivor count after filter F1 among 132608 candidates, split by
        chi(A'^2 - 4)
      direction: different
      minimum_effect: >-
        PREDICTED a near-even split, about 66300 each, since chi is
        equidistributed with error O(p^{-1/2}) by Weil. A split materially away
        from even means the Legendre routine is biased and the whole sweep is
        void - the cheapest instrument check in the record, and it runs first.
    - metric: >-
        measured P_cheap, the fraction of candidates with chi(A'^2 - 4) = -1 AND
        (v_2(#E), v_2(#E^t)) = (3, 2)
      direction: different
      minimum_effect: >-
        PREDICTED about 0.25, from d052e6's heuristic H1 with the conditional
        structure stated in C4. THE DISCRIMINATOR - this is a 132608-sample test
        of H1 at 511 bits, an order of magnitude larger than d052e6 proposed at
        255 bits, and a measured fraction outside 0.25 plus or minus 0.005
        falsifies the geometric model at cryptographic size. Either outcome is a
        result, and the negative one is more valuable because H1 is assumed by
        three records. NOTE that P_cheap is a MEASURED OUTPUT here, not only an
        input to the C4 prediction, and the deliverable reports it as such.
    - metric: >-
        survivor count after filter F3 with primes up to 13
      direction: different
      minimum_effect: >-
        PREDICTED about 3875 with Poisson standard deviation about 62; a measured
        value outside 3875 plus or minus 250 falsifies fa8d4e's heuristic H1 at
        511 bits on a population of about 33000 curves. THE NUMBER IS
        HAND-COMPUTED HERE FROM THE STATED FORMULA AND MUST BE RECOMPUTED
        INDEPENDENTLY BEFORE THE RUN, since a wrong prediction would make a
        correct measurement look like a refutation.
    - metric: >-
        whether the published coefficient A = 530438 survives every cheap clause
        of its own published rule
      direction: different
      minimum_effect: >-
        PREDICTED YES, and it is BLOCKING. A NO means the rule as transcribed in
        tables/rigid.tsv is not the rule that produced the curve, or the recalled
        cofactors are wrong, or an instrument is broken. Resolve in that order -
        re-read pages/rigid.html at tier 1 first - and halt the sweep until
        resolved, because a sweep whose own target fails its own rule measures
        nothing.
    - metric: >-
        whether Curve25519's A = 486662 and the two coefficients its recipe names
        as rejected, 358990 and 464586, all survive the cheap clauses
      direction: higher
      minimum_effect: >-
        PREDICTED ALL THREE SURVIVE - 486662 because it is the answer, and the
        other two because the mirror states they were rejected for a reason the
        cheap clauses do not test, namely the prime being below 2^252. THIS IS AN
        EXACT THREE-POINT POSITIVE CONTROL SUPPLIED BY THE MIRROR ITSELF and it
        did not exist before the mirror was read. Any elimination among the three
        is a pipeline defect and voids the M-511 result.
    - metric: >-
        number of clause sets under which each published coefficient survives,
        and its base-two logarithm
      direction: different
      minimum_effect: >-
        REPORTED AS THE UNDER-SPECIFICATION IN BITS, WITH NO TARGET.
        Pre-registered expectation, stated so the outcome is controlled - the
        M-511 recipe is fully specified and should admit essentially one clause
        set; the M-221 and Curve383187 recipes state NO order conditions and taken
        literally would select A = 3, so their under-specification is large and
        the measured bits should be substantial. A finding that all recipes are
        equally under-specified would mean the filters have no discriminating
        power over clause sets and the table should not be reported.
    - metric: >-
        empirical distribution of v_2(#E) over all 132608 candidates at
        p = 2^511 - 187, against the geometric prediction with ratio one half
      direction: different
      minimum_effect: >-
        PREDICTED consistent by chi-square at the 1 percent level on bins
        2, 3, 4, 5 and 6-or-more, with expected counts stated in advance. THIS IS
        THE LARGEST FULL-SIZE HEURISTIC VALIDATION AVAILABLE IN THIS CAMPAIGN and
        it comes free with the sweep. TAIL CHECK - about 132608 * 2^{-(j+1)}
        curves with excess valuation j, so about 2 curves with v_2 at least 18
        and none with v_2 at least 22; the largest observed valuation is the tail
        statistic and it is reported.
    - metric: >-
        empirical distribution of t modulo q over the candidates reaching F3, for
        each q in {3, 5, 7, 11, 13}, against uniform on Z/qZ
      direction: different
      minimum_effect: >-
        PREDICTED consistent by chi-square at the 1 percent level for each q.
        This is fa8d4e's heuristic H1 tested at 511 bits on a real population of
        about 33000 rather than on a 10^3 subsample, and a measured non-uniformity
        would be a genuine structural observation about the trace distribution
        over Montgomery coefficients at fixed p, worth its own record.
    - metric: >-
        the completion-density estimate for M-221, Curve383187 and M-511 under
        their own published rules, and for M-383 under M-511's rule form,
        recomputed from measured survivor counts
      direction: different
      minimum_effect: >-
        PREDICTED of order 1 to 6 for all four - hand-computed here as about 4.1,
        2.6, 0.85 and 5.9 respectively - WITH NO SINGLE OUTLIER. THIS IS AN
        EXPLICIT CORRECTION OF THIS RECORD'S OWN EARLIER PRE-REGISTRATION, which
        assumed a shared clause set and predicted a sevenfold M-383 anomaly; the
        mirror shows the rules differ per curve and the anomaly dissolves into a
        spread within the model's own accuracy. THE DISCRIMINATOR THAT REMAINS -
        a measured estimate far outside 0.3 to 30 for any row would mean the
        clause set applied to that row is materially wrong, and for M-383, whose
        recipe cell is EMPTY, that is a real and open question rather than an
        audit.
    - metric: >-
        the paired 383-bit result - the smallest surviving A over 2^383 - 187
        under "minimise A" and under "minimise (A - 2)/4"
      direction: different
      minimum_effect: >-
        PREDICTED that Curve383187's 229969 is at or near the top of the
        "minimise A" survivor set, since that is its published rule; and REPORTED
        WITH NO CLAIM for the "minimise (A - 2)/4" arm, whose published answer
        would be M-383's 2065150 if that rule form applied to it, which the
        mirror does NOT say. Two independent minimality questions over one prime
        with one field implementation. Any survivor strictly below a published
        coefficient is a CANDIDATE counterexample requiring only a point count to
        settle, and the exhibited list is the handoff.

  minimal_test:
    design: >-
      STAGE 0, ZERO COMPUTE, AND IT IS THE CHEAPEST VALID DISCRIMINATOR. (a)
      Derive C3's redundancy - the fourth clause from the third - and check the
      arithmetic 530436 = 4 * 132609. (b) Run F1 and F2 on A = 530438 alone and
      confirm it survives its own published clause set AND that its outputs
      reproduce the mirror's published "1 point of order 2", cofactor 2^3 and
      twist cofactor 2^2. (c) Re-read the M-511 recipe from pages/rigid.html at
      tier 1, since the entire record rests on that one quoted sentence. If the
      published coefficient fails its own rule, the record dies for the cost of
      one candidate.
      STAGE 1, THE PILOT, AND IT RUNS ON M-221 NOT M-511. The identical sweep on
      M-221, where the candidate space under the terse published recipe augmented
      with M-511's order clauses is at most 117047 and the field is 221 bits, so
      the pilot costs roughly one twentieth of the M-511 sweep. Its purpose is to
      measure the actual cost per candidate per stage. NO EXPENSIVE SWEEP IS
      AUTHORISED UNTIL THE PILOT HAS PRODUCED A MEASURED COST TABLE.
      STAGE 2, THE CALIBRATION ROW, minutes. Curve25519 - check survival of
      486662 and of the two coefficients its recipe names as rejected, 358990 and
      464586, and check the survivor count against its own model.
      STAGE 3, the M-511 sweep proper, staged by filter with the survivor set and
      counts checkpointed after every stage. F1 under a minute on 14 cores; F2 on
      the F1 survivors; F3 with q ascending and the survivor set recomputed after
      each prime.
      STAGE 4, seconds. The clause-set table - re-derive the survivor set under
      each clause set from the SAME stored per-candidate verdict vectors, with no
      recomputation, and report the under-specification in bits per recipe.
      STAGE 5, seconds. The two full-size heuristic distributions and their
      chi-square tests.
      STAGE 6, the paired 383-bit runs of C6, with the M-383 arm explicitly
      labelled a test of a hypothesised rule.
    controls:
      - >-
        BLOCKING SELF-CHECK - the published coefficient must survive its own
        published clause set and reproduce three of the mirror's own cells.
      - >-
        BLOCKING THREE-POINT CALIBRATION, SUPPLIED BY THE MIRROR - Curve25519's
        A = 486662 must survive, and so must 358990 and 464586, which its recipe
        names as rejected for a reason the cheap clauses do not test.
      - >-
        REFUSAL CONTROL - Curve383187, whose odd A cannot satisfy M-511's
        "(A - 2)/4" clause. The pipeline must refuse that clause set for that row
        rather than widen the enumeration silently.
      - >-
        NULL, SAME SHAPE - run the entire filtration on 132608 UNIFORMLY RANDOM
        coefficients drawn from F_p rather than from the small enumerated range,
        with seeds recorded. PREDICTED the same survival ratios stage by stage,
        since the heuristics concern the trace and not the coefficient's
        magnitude. A MATERIAL DIFFERENCE WOULD BE A GENUINE STRUCTURAL DISCOVERY -
        it would mean small Montgomery coefficients are not statistically typical
        - and it is the single most interesting possible outcome of this record.
        It would also invalidate the C4 model, which assumes typicality.
      - >-
        POSITIVE, BLOCKING - planted candidates with known verdicts, constructed
        at toy scale by choosing traces with prescribed small-prime divisibility
        and finding matching coefficients by search. Each filter must eliminate
        the ones it is supposed to eliminate. A FILTER NEVER SHOWN TO ELIMINATE
        CANNOT CERTIFY A SURVIVOR.
      - >-
        CROSS-IMPLEMENTATION - the survivor set recomputed from the stored
        per-candidate verdict vectors by a second, independent script that
        applies the clause predicates only. Disagreement with the streaming
        pipeline voids the run.
      - >-
        DETERMINISM CONTROL - the sweep rerun on a 1 percent subsample with a
        different core count and thread ordering; verdicts must be bit-identical,
        since every filter is deterministic.
      - >-
        SOURCE-TIER CONTROL - the M-511, M-221, Curve383187 and Curve25519 rigid
        cells re-read from pages/rigid.html before any result is published, per
        MIRROR-DEF-1's authority order. pages/rigid.txt is forbidden for this
        reading. M-383's cell is empty and no recipe is attributed to it.
    required_metrics:
      - 'the exact candidate count and the enumeration bounds, stated as integers'
      - 'the C3 redundancy derivation and its verification'
      - 'per filter stage, the survivor count, the predicted count, and their ratio'
      - 'the measured P_cheap, reported as an output'
      - 'per filter stage, measured wall clock, core-seconds, and cost per candidate'
      - 'the full survivor list with per-candidate certificates'
      - 'the published coefficient survival verdict per clause set'
      - 'the Curve25519 three-point calibration result'
      - 'the count of surviving clause sets per recipe and its base-two logarithm'
      - 'the full-size empirical distribution of (v_2(#E), v_2(#E^t)) over all candidates'
      - 'the full-size empirical distribution of t mod q per q over the F3 population'
      - 'the chi-square statistics and p-values for both distributions'
      - 'the random-coefficient null survival ratios stage by stage, with seeds'
      - 'the paired 383-bit survivor sets under both rule forms'
      - 'per mirror value used, the file, the table number, the line, and the tier read'

  falsification_conditions:
    - >-
      The published coefficient A = 530438 fails a cheap clause of its own
      published rule. The rule as transcribed is not the rule that produced the
      curve, or an instrument is broken; halt at Stage 0, re-read
      pages/rigid.html at tier 1, and resolve before any sweep runs. This is a
      zero-cost negative and the design's main safeguard.
    - >-
      Curve25519's A = 486662, or 358990, or 464586 is eliminated by a cheap
      clause. The pipeline has failed on the one row whose recipe names its own
      rejected candidates; the M-511 result is withdrawn regardless of how
      plausible it looks.
    - >-
      The F1 chi split is materially uneven. The Legendre routine is biased and
      every downstream verdict is void.
    - >-
      The measured P_cheap is outside 0.25 plus or minus 0.005. d052e6's
      heuristic H1 is falsified at 511 bits - a first-class result, and one that
      three records depend on. The sweep continues, but every record citing H1
      must be flagged.
    - >-
      The measured F3 survivor count is outside 3875 plus or minus 250 after
      independent recomputation of the prediction. fa8d4e's heuristic H1 is
      falsified at 511 bits, with the same consequences.
    - >-
      Any planted positive control that its designated filter fails to eliminate.
      The filter cannot fire and certifies nothing; nothing is reported.
    - >-
      The second, independent survivor-set recomputation disagrees with the
      streaming pipeline, or the determinism control produces different verdicts.
      Implementation failure; nothing is reported.
    - >-
      The random-coefficient null gives materially different survival ratios from
      the enumerated small-coefficient population. The C4 typicality assumption is
      refuted, the model is withdrawn, and the deliverable becomes the discrepancy
      itself, which is a stronger finding than the sweep was designed to produce.
    - >-
      The tier-1 reading of pages/rigid.html does not match the tier-2 recipe
      quoted here. A mirror defect in the table this record is built on - report
      it as a process finding and re-run under the corrected rule.

  confounders:
    - >-
      SURVIVING IS NOT QUALIFYING. A survivor is a candidate the cheap clauses
      could not kill, not a candidate that satisfies the rule. About 3875
      survivors are expected and about 1 is expected to satisfy the full rule;
      conflating the two would overstate the result by more than three orders of
      magnitude, and it is the central dishonesty available here.
    - >-
      THE RULE IS SAFECURVES' SUMMARY, NOT THE DESIGNERS' TEXT. The originating
      paper was not retrieved. If SafeCurves paraphrased, the reproduction tests
      the paraphrase. The mirror's specs/ directory holds thirteen specification
      documents and was NOT searched for that paper; doing so is the first thing
      an executor should try, and it may make this confounder disappear.
    - >-
      TIER-2 READING OF A LOAD-BEARING SENTENCE. The whole record rests on one
      quoted recipe read from tables/rigid.tsv. MIRROR-DEF-1 concerns exactly this
      table, and although the .tsv preserves empty cells and the .txt does not,
      the authority is pages/rigid.html and it was not read. This is the single
      most important thing for the executor to fix before publishing anything.
    - >-
      THE C4 AND COMPLETION-DENSITY NUMBERS WERE HAND-COMPUTED IN THIS RECORD,
      without a shell, from a density model with several approximations - a
      two-over-log-n prime density, a Mertens-style sieve correction, a
      conditional structure for P_cheap, and an assumed independence between the
      curve and twist odd parts that is FALSE in detail, since #E and #E^t are
      linked by #E + #E^t = 2p + 2 and, by C3, their 2-parts are linked by a
      theorem. The independence approximation is the weakest link and must be
      re-derived, not inherited.
    - >-
      SELECTION BY MAGNITUDE. The enumerated candidates are the SMALLEST
      coefficients, which is not a random sample of F_p. The random-coefficient
      null exists precisely to measure whether that matters, and until it has been
      run no statement about "curves at this prime" may be made from the
      enumerated population.
    - >-
      PARTIAL SWEEPS. Because the filtration is monotone and checkpointed, a
      budget stop leaves a valid but WEAKER result - a larger survivor set at a
      smaller reached Q. The reached Q is part of every sentence quoting the
      survivor count.
    - >-
      M-383 HAS NO PUBLISHED RECIPE. Every statement about M-383's generation is
      a test of a HYPOTHESISED rule, never an audit of a published one, and
      MIRROR-DEF-1 exists precisely because this distinction is easy to lose.

  interpretation_limits:
    - >-
      MINIMALITY IS NOT CERTIFIED AND CANNOT BE BY THIS METHOD. The deliverable
      is a survivor set and a reduction factor, and the phrase "M-511's
      coefficient is the smallest satisfying the rule" may not appear, nor may
      "SafeCurves' rigidity claim is verified".
    - >-
      Nothing here adjudicates the rigid cell or any other SafeCurves criterion
      cell. This record contradicts IDEA-20260829-f5bcff only on the narrow point
      that a minimality rule is decidable by enumeration - and the mirror
      strengthens that contradiction by showing the rule IS a quantified
      minimality statement rather than a narrative.
    - >-
      The two full-size heuristic distributions are the record's most transferable
      output and they are properties of the FAMILY OF MONTGOMERY COEFFICIENTS AT
      THIS PRIME, not of M-511. Citing them as facts about M-511 would be a scope
      error.
    - >-
      TRANSFER TO THE OTHER 19 CURVES, STATED EXACTLY. (a) FULL TRANSFER of the
      METHOD to every row whose published coefficient is small enough to enumerate
      below - M-221 at 117047 candidates under its terse recipe, M-383 at 516286
      under a hypothesised (A - 2)/4 rule, Curve383187 at 229966 under "minimise
      A", and Curve25519 at 121665 under its own detailed recipe, all trivially
      enumerable. The M-221 pilot is a required precondition of the M-511 sweep
      because the method transfers and the cheapest instance should run first.
      (b) TRANSFER OF THE CLAUSE SET IS NOT AUTOMATIC - the mirror shows three
      DIFFERENT published recipes across these four rows and an EMPTY cell for
      M-383, so a single clause set applied to all of them is a hypothesis, not a
      reproduction, and the deliverable must label each arm accordingly. (c) NO
      TRANSFER to any row whose coefficient is a full-width field element,
      including every short-Weierstrass row of the mirror, where the candidate
      space is 2^{256} or larger and enumeration is meaningless; for those the
      instrument must REFUSE, and the refusal is itself a finding about which
      rows can have a computational rigidity audit at all. (d) NO TRANSFER of the
      C4 numbers across rows - candidate count, prime size and clause set all
      change, so the model must be recomputed per row and a number carried across
      rows is a fabrication. (e) NO TRANSFER to any claim about security, about
      the ECDLP, or about the designers' intent.
    - >-
      A survivor set is a HANDOFF, not a conclusion. Its intended consumer is a
      session with a point-counting backend, for which "count about 3875 curves at
      511 bits" is a bounded and well-specified task where "search 132608 curves"
      was not.
    - >-
      OPERATIONAL OBSERVATION, RETAINED BECAUSE IT IS TRUE AND NOT BECAUSE IT
      BLOCKS ANYTHING. Live fetches of safecurves.cr.yp.to and of cr.yp.to on
      2026-08-29 both failed with "Parse Error - Content-Length can't be present
      with Transfer-Encoding", now seen on two hosts. THE DATA IS NOT UNAVAILABLE
      - the rules this record reproduces are in this repository at
