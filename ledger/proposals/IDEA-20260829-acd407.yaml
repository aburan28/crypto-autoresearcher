idea:
  id: IDEA-20260829-acd407
  question_id: RQ-SCURVE-5a64f4
  goal_id: GOAL-SCURVE-3ee4b1
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    THE ELIMINATION SWEEP - the M-511 generation rule is PUBLISHED VERBATIM in
    the in-repository SafeCurves mirror, so this is a REPRODUCTION of a stated
    minimality claim rather than a reconstruction; enumerate every candidate
    below the published coefficient, kill candidates with the rule's own cheap
    clauses, exhibit the survivors, and obtain as the same run's by-product the
    LARGEST FULL-SIZE VALIDATION IN THIS CAMPAIGN of the two heuristics every
    other SafeCurves record assumes
  class: composition

  claim: >-
    The rigid criterion asks whether a curve's parameters were generated by a
    stated deterministic rule, and the question's own diagnostic list names
    "deterministic parameter-generation transcript audit". No record in this
    program has attempted one, and IDEA-20260829-f5bcff's closure argument
    concluded that rigidity is a property of a design process that no computation
    can decide. THAT CONCLUSION IS TOO STRONG AND THIS RECORD CHALLENGES IT ON A
    SPECIFIC POINT - a rule of the form "the smallest coefficient satisfying
    conditions C" is NOT undecidable; it is decidable by enumeration, and the
    only obstacle is that one condition in C is expensive. Six sub-claims.

    (C1) THE RULE IS PUBLISHED, NOT RECONSTRUCTED, AND IT IS IN THIS REPOSITORY.
    From inputs/SAFECURVES-20260825/tables/rigid.tsv, read at the TSV tier with
    empty cells preserved, the M-511 row is "fully rigid" with the comment:
    "p = 5 (mod 8) is largest prime smaller than 2^511; B=1; (A - 2)/4 is as
    small as possible for A > 2; A^2 - 4 is not a square; curve order is n = 8r
    and quadratic twist order is n' = 4r'."
    This is a complete, quantified, four-clause minimality claim about a specific
    integer. It is the most precisely stated rigidity claim in the twenty-row
    family, and it can be reproduced.

    (C2) THE SEARCH SPACE IS SMALL AND EXACTLY DELIMITED BY THE RULE'S OWN
    WORDING. The rule minimises (A - 2)/4 over A > 2, which forces A congruent to
    2 modulo 4. For the published A = 530438 we have A - 2 = 530436 = 4 * 132609,
    so the minimised quantity is exactly 132609 and there are exactly 132608
    candidate values of (A - 2)/4 strictly below it, namely k = 1, ..., 132608
    with A = 4k + 2. Every one of them must fail at least one clause if the
    published claim is true. THAT IS A FINITE, FULLY ENUMERABLE FALSIFICATION
    TARGET at 511 bits.

    (C3) THREE OF THE FOUR CLAUSES ARE CHEAP, AND ONE OF THEM IS PROVABLY
    REDUNDANT. Clause by clause:
    "p = 5 (mod 8)" - a property of p alone, checked once, and NOTE THAT IT IS
    EXACTLY THE HYPOTHESIS OF IDEA-20260829-96bd39's forcing theorem, here
    stated by the curve's own designers rather than noticed by this program.
    "A^2 - 4 is not a square" - ONE LEGENDRE SYMBOL, chi(A^2 - 4) = -1, about
    0.2 milliseconds at 511 bits.
    "curve order is n = 8r" with r odd - equivalently v_2(#E) = 3 exactly,
    obtained from IDEA-20260829-d052e6's halving chain in about a dozen modular
    exponentiations, with no point count.
    "quadratic twist order is n' = 4r'" - equivalently v_2(#E^t) = 2 exactly, AND
    THIS CLAUSE IS REDUNDANT GIVEN THE PREVIOUS ONE. By IDEA-20260829-d052e6's
    claim C2, for p congruent to 1 modulo 4 the identity #E + #E^t = 2p + 2 gives
    v_2(2p + 2) = 2 exactly, so v_2(#E) at least 3 FORCES v_2(#E^t) = 2. Since
    p = 2^511 - 187 is congruent to 5 modulo 8 and hence to 1 modulo 4, the
    fourth clause follows from the third by a theorem. THE PUBLISHED RULE HAS
    THREE INDEPENDENT CLAUSES, NOT FOUR, and that is a zero-compute observation
    about a published design rule that this program can now make and could not
    before.
    "r and r' prime" - the ONE expensive condition, requiring #E, hence a point
    count, hence SEA, which is unavailable. It is quarantined at the end of the
    filtration rather than blocking it at the start.

    (C4) THE QUANTITATIVE PREDICTION, FALSIFIABLE BEFORE ANY EXPENSIVE STEP.
    Under the two heuristics already named in the sibling records - d052e6's H1,
    that the excess 2-adic valuation is geometric with ratio one half, and
    fa8d4e's H1, that t modulo q is uniform on Z/qZ - and adding the small-prime
    sieve of IDEA-20260829-fa8d4e as a necessary condition for r and r' to be
    prime, the expected number of candidates surviving the cheap filters is
    N_survivors = N_cand * P_cheap * product over odd q at most Q of (1 - 2/q),
    where N_cand = 132608, P_cheap is the probability that
    chi(A^2 - 4) = -1 AND v_2(#E) = 3, and the product runs over the primes
    actually reached. TAKING P_cheap = 1/4 - one half for the Legendre clause
    times one half for v_2 = 3 conditioned on the cyclic 2-Sylow that
    chi(A^2 - 4) = -1 forces - AND Q = 13, GIVING A PRODUCT OF 0.11688, THE
    PREDICTION IS N_survivors = 132608 * 0.25 * 0.11688, ABOUT 3875, WITH A
    POISSON STANDARD DEVIATION OF ABOUT 62. HAND-COMPUTED IN THIS RECORD FROM THE
    STATED FORMULA AND REQUIRING INDEPENDENT RECOMPUTATION. A measured survivor
    count outside about 3875 plus or minus 250 falsifies one of the two
    heuristics AT 511 BITS on a population of 132608 real cryptographic-size
    curves - an order of magnitude more full-size evidence about those heuristics
    than d052e6's proposed 10^4 samples at 255 bits. NOTE THAT P_cheap IS ITSELF
    A MEASURED OUTPUT, not merely an input: the sweep reports it directly.

    (C5) THE FOUR CURVES DO NOT SHARE ONE RULE, AND THE MIRROR SAYS SO. Read from
    tables/rigid.tsv: M-221 carries "p is largest prime smaller than 2^221; B=1;
    A > 2 is as small as possible."; Curve383187 carries the same recipe at
    2^383; M-511 carries the four-clause recipe of C1; AND M-383's COMMENTS CELL
    IS EMPTY - which is exactly MIRROR-DEF-1's confirmed defect instance, so NO
    RECIPE IS ATTRIBUTED TO M-383 ANYWHERE IN THIS RECORD. Two consequences.
    FIRST, M-221 and Curve383187 minimise A ITSELF, which permits odd A - and
    Curve383187's A = 229969 is odd - while M-511 minimises (A - 2)/4, which
    forces A congruent to 2 modulo 4. The two published rules are genuinely
    different and they are applied to two different curves over the SAME prime
    2^383 - 187. SECOND, the M-221 and Curve383187 recipes as published state NO
    order conditions at all, so taken literally they would select A = 3; they are
    therefore UNDER-SPECIFIED RELATIVE TO M-511's, and measuring by how much is a
    deliverable. THIS CORRECTS THIS RECORD'S OWN EARLIER READING, which assumed a
    shared "A congruent to 2 modulo 4" rule across the family and derived from it
    a claimed sevenfold anomaly for M-383; with the actual per-curve rules the
    completion-density estimates are about 4.1 for M-221, about 2.6 for
    Curve383187, about 0.85 for M-511, and about 5.9 for M-383 under M-511's rule
    form - all of order 1 to 6, a spread within the model's own accuracy, AND NO
    SINGLE OUTLIER. The earlier claim is withdrawn here rather than quietly
    dropped.

    (C6) THE PAIRED TEST THE SHARED PRIME MAKES POSSIBLE, AND IT IS NEW. Over the
    single prime 2^383 - 187 there are two published answers to two different
    minimality questions: Curve383187's A = 229969 should be the smallest A > 2
    satisfying the order clauses, and M-383's A = 2065150 would be the smallest
    A congruent to 2 modulo 4 satisfying them IF M-511's rule form applies to it,
    which the mirror does not say. Running both enumerations over one prime tests
    two independent minimality claims with one field implementation, and the
    M-383 arm is explicitly labelled a TEST OF A HYPOTHESISED RULE, never an
    audit of a published one.

  mechanism: >-
    THE TRACKED OBJECT is the FILTRATION - the nested sequence of survivor sets
    S_0 containing S_1 containing S_2 containing S_3, one per filter stage - and
    the quantity actually followed is the vector of survival ratios together with
    the published coefficient's membership at each stage. A population of 132608
    curves collapses to four integers and one boolean.

    LOSSY-PROJECTION TEST (docs/inventor-protocol.md section 2), applied BEFORE
    any compute, and this record's answer is WEAKER THAN ITS THREE SIBLINGS' AND
    IS STATED AS SUCH RATHER THAN INFLATED.
    WHAT IS DISCARDED, AT THE POPULATION LEVEL. 132608 curves, each a 511-bit
    object, collapse to four survival counts. That projection is enormously lossy
    and nothing about any individual curve is recoverable from it.
    WHAT IS DISCARDED, AT THE INDIVIDUAL LEVEL, AND THIS IS THE HONEST WEAK
    POINT. Per candidate, a coefficient of about 20 bits maps to a verdict vector
    of roughly 12 to 15 bits - one Legendre symbol, two small valuations, and
    five residues modulo small primes. The fibre over a verdict vector therefore
    has size only about 2^5 to 2^8 within the enumerated range. THAT IS LOSSY BUT
    ONLY MODESTLY SO, and by the standard of docs/inventor-protocol.md section 2
    the per-candidate projection is a weak instance of the test, unlike
    IDEA-20260829-106b92's twist indicator whose fibres are Theta(p). The record
    says so plainly instead of claiming a strength it does not have. The
    POPULATION-level projection is what carries the design.
    IS IT A CHANGE OF COORDINATES? At the population level, decisively not - four
    counts cannot encode 132608 curves. At the individual level, not either,
    since the fibres are provably nonempty and of size at least 2^5 in the
    enumerated range, but the margin is small and is disclosed.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS? The operation here is FILTER
    APPLICATION, and the compatibility is exact and monotone - each filter is a
    deterministic predicate on the candidate alone, so S_{i+1} is a
    deterministic function of S_i and the filter, the survivor sets are nested by
    construction, and no filter can resurrect an eliminated candidate. That
    monotonicity is what makes a budget stop leave a VALID partial result rather
    than a corrupted one. PASSES, with the weakness above recorded.
    WHERE THE STRUCTURE DISSOLVES, AND IT IS THE RECORD'S BOUNDARY. At the
    primality clause. Deciding whether r is prime requires #E, hence a point
    count, hence SEA, which is unavailable. The filtration therefore STOPS at a
    survivor set it cannot reduce further, and the size of that set IS the
    deliverable. This is a measured boundary, not a hidden one, and it is now
    sharply located because the rule that draws it is published.

    WHY THE MIRROR MAKES THIS RECORD STRONGER RATHER THAN UNNECESSARY. The mirror
    supplies the RULE and the ANSWER; it does not supply the CHECK. Nothing in
    tables/rigid.tsv demonstrates that 530438 is minimal - the cell asserts
    "fully rigid" and states a recipe, and the goal's claim boundaries designate
    every such cell as user_supplied_unverified intake and explicitly not
    evidence. The sweep is the first computation in this program capable of
    challenging such a cell at all, and it converts an unverifiable adjective
    into a bounded, exhibited candidate set. It also does something the mirror
    cannot do for itself: C3's redundancy observation shows one of the rule's own
    four clauses is implied by another, which is a statement about the published
    text that only a derivation can make.

    WHY THIS IS NOT IDEA-20260829-f5bcff. That record inverts a published VERDICT
    TABLE for the thresholds implicit in it; its object is a cut position in a
    sorted list of twenty measured quantities, its target is ADJUDICATION, and
    its blocker was an unreachable web host - a blocker the mirror removes
    outright, so f5bcff should be re-scoped by its owner. This record enumerates
    a CANDIDATE PARAMETER SPACE and filters it; its object is a filtration over
    132608 curves, its target is GENERATION, and its blocker is point counting,
    which the mirror does not remove. f5bcff's closure argument - that rigidity
    is a process property no computation can decide - is the specific claim this
    record contradicts, and the contradiction is now sharper because the rule
    turns out to be a quantified minimality statement rather than a narrative.

    WHY THIS IS NOT A REPACKAGING OF ITS OWN INGREDIENTS. F1, F2 and F3 are
    IDEA-20260829-d052e6's and IDEA-20260829-fa8d4e's instruments applied
    unchanged. What is new is the OBJECT they are applied to - a population
    rather than a curve - and the two things only a population yields: the
    rigidity reduction and the full-size heuristic validation. A single curve
    cannot produce either. The composition is the contribution.

    EXECUTION, ORDERED BY COST PER CANDIDATE ELIMINATED. Step 0, the C7 blocking
    self-check on A = 530438 itself, plus C3's redundancy derivation, plus the
    published-value cross-checks: the mirror's tables/twist.tsv gives M-511
    cofactor 2^3 and twist cofactor 2^2, exactly the rule's third and fourth
    clauses, and tables/complete.tsv gives 1 point of order 2, exactly the second
    clause; the instruments must reproduce all three. Step 1, enumerate the
    132608 candidates and apply F1 - one Legendre symbol each, about 0.2
    milliseconds at 511 bits, under a minute on 14 cores. Step 2, apply F2 to the
    survivors. Step 3, apply F3 with q ascending, cheapest first, recomputing the
    survivor set after each prime so the most expensive prime runs on the
    smallest set. Step 4, publish the survivor list, the stage-by-stage counts
    against the C4 prediction, the published coefficient's rank, and the two
    full-size heuristic distributions. Step 5, the paired 383-bit runs of C6.
    Step 6, the under-specification measurement for the M-221 and Curve383187
    recipes.

  novelty_status: unverified
  novelty_rationale: >-
    Exhaustive parameter search under a deterministic rule is what curve
    generators do and is `known` as a technique; the density model is the
    standard prime-counting heuristic. NOTHING NEW IS CLAIMED ABOUT EITHER. What
    is new is confined to this program - no record here has enumerated any
    candidate parameter space, attempted any generation-rule reproduction, or
    validated the 2-adic or trace-residue heuristics at cryptographic size on any
    population. THE LABEL REMAINS `unverified`, AND THE REASON HAS CHANGED
    ENTIRELY. It is no longer that the generation rules could not be retrieved -
    they are published in the in-repository mirror and are quoted above verbatim
    at the TSV tier. It is that the ORIGINATING PAPER, Aranha-Barreto-Pereira-
    Ricardini, was not opened, so whether SafeCurves' summary of the rule matches
    the designers' own statement is unchecked; and that no mathematical
    literature was read in full this session.
