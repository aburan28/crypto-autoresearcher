  heuristic_assumptions:
    - id: H1
      statement: >-
        The enumerated small Montgomery coefficients A' congruent to 2 modulo 4
        below the published one behave, with respect to the 2-adic valuation pair
        (v_2(#E), v_2(#E^t)) and the trace residues t modulo q for small odd q,
        exactly like uniformly random admissible coefficients over the same
        prime; formally, the survival probability at each filter stage is the
        same for the enumerated population and for a uniform sample from F_p, up
        to o(1) as p tends to infinity.
      rigorous_support: >-
        Two rigorous halves and one honest gap. (i) The FLOOR is rigorous - 4
        divides both orders for every Montgomery curve, by IDEA-20260829-d052e6's
        C1; and for p congruent to 1 modulo 4 its C2 further constrains the pair,
        which is exactly C3's redundancy result, so part of the distribution is a
        theorem rather than a model. (ii) The depth-0 symbol chi(A'^2 - 4) is
        EQUIDISTRIBUTED over the FULL range of A' with error O(p^{-1/2}) by Weil's
        bound on character sums. THE GAP - Weil's bound applies to the full range,
        and its restriction to a SHORT INITIAL SEGMENT of about 2^{17} consecutive
        admissible values at a 511-bit prime is NOT covered by it; short-interval
        equidistribution of character sums is a genuinely harder problem and no
        proof is offered. This is what the random-coefficient null control tests,
        and it is the record's weakest mathematical item.
      validation_plan: >-
        SAMPLING - the ENTIRE enumerated population of 132608 candidates at
        p = 2^511 - 187, a complete census of the range and not a sample, against
        132608 uniformly random admissible coefficients at the same prime with
        seeds recorded. SCALE AND PARAMETERS RECORDED - the prime, the enumeration
        bounds, the population sizes and the seeds. COMPARISON DISTRIBUTION - the
        two populations' survival ratios compared stage by stage by a two-sample
        proportion test at the 1 percent level, and each separately against the
        model predictions by chi-square. TAIL CHECK - the largest v_2 observed in
        each population against the geometric tail, and the joint frequency of the
        rarest verdict classes, where a short-interval anomaly would show first.
        TRANSFER - none is needed and none is claimed, because both populations
        are measured at the SAME 511-bit prime; this is the only heuristic in
        this session's four records with NO size extrapolation at all.
    - id: H2
      statement: >-
        For an odd integer n of about 508 bits with no prime factor at most Q,
        the probability that n is prime is approximately (2 / ln n) divided by
        the product over odd primes q at most Q of (1 - 1/q); and the events "the
        odd part of #E is prime" and "the odd part of #E^t is prime" are
        approximately independent.
      rigorous_support: >-
        The FIRST half imitates the prime number theorem together with Mertens'
        theorem and is the standard sieve-corrected density, accurate to within a
        constant factor for numbers of this size. THE SECOND HALF IS FALSE IN
        DETAIL AND THE RECORD SAYS SO - #E and #E^t are linked exactly by
        #E + #E^t = 2p + 2, and C3 exhibits a concrete dependence in the 2-part
        strong enough to make one of the published rule's clauses redundant. No
        estimate of the resulting correction is offered, and that is why the
        completion-density figures are stated as orders of magnitude rather than
        as predictions with error bars.
      validation_plan: >-
        PARTIAL ONLY, AND THE RECORD DOES NOT PRETEND OTHERWISE. (i) At toy scale,
        where both orders are computable by brute force, measure the joint
        frequency of "both odd parts prime" over an exhaustive population and
        compare against the independence product; the ratio is the dependence
        correction and is the only part of H2 measurable here. (ii) Repeat at
        three toy sizes to see whether the correction drifts with p, which would
        decide whether it may be extrapolated at all. (iii) AT 511 BITS, NO
        VALIDATION IS POSSIBLE without point counting, and H2 therefore remains
        OPEN; the completion-density figures depending on it are labelled
        model-derived and are never used to draw a conclusion on their own. What
        H2 is used for is exclusively to say whether an observed figure is of
        order 1 or of order 10, which is robust to a constant-factor error, and
        it is stated at that resolution. A PARTIAL EMPIRICAL ANCHOR NOW EXISTS -
        the mirror publishes cofactor and twist cofactor for all twenty rows, so
        the joint event "cofactor 8 and twist cofactor 4" can be counted across
        the family; with five Montgomery rows all showing exactly that pair, the
        sample is designed rather than random and is NOT evidence for H2, which
        is stated so no one reads it as such.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. C3's redundancy derivation costs zero. The
      sweep costs N_cand Legendre symbols, plus N_cand * P_1 halving chains of
      about a dozen exponentiations, plus N_cand * P_cheap Schoof-lite runs at
      O(q^2 log p) F_p-multiplications each. With N_cand = 132608 at 511 bits and
      primes to 13, the dominant term is the Schoof-lite stage on about 33000
      candidates, estimated at a few core-hours in Python and therefore under an
      hour on 14 cores for q at most 7, and several hours for q up to 13. The
      whole sweep is O(N_cand * Q^3 * log p / log Q) F_p-multiplications in the
      worst ordering and roughly a tenth of that in the cost-ordered one.
    memory_exponent: >-
      O(N_cand * log p) for the stored per-candidate verdict vectors, which at
      132608 candidates and a few hundred bits each is a few tens of megabytes -
      trivial against 48 GB. Storing the verdict vectors rather than only the
      survivor set is what makes the clause-set table free, and that is a
      deliberate memory-for-time trade of exactly the kind
      docs/target-result-profile.md asks to be stated.
    best_known: >-
      For LEARNING the generation rule, the best known method is reading
      inputs/SAFECURVES-20260825/tables/rigid.tsv or pages/rigid.html, which is in
      this repository, costs one file read, and STRICTLY DOMINATES this record on
      every axis; this record consumes that source rather than competing with it.
      For CHECKING the rule, there is no incumbent inside this program -
      IDEA-20260829-f5bcff's position is that the criterion must be refused - and
      outside it the check would be a re-run of the designers' own search with a
      point-counting backend, which strictly dominates this record on
      completeness and is unavailable here. Against the ECDLP attack frontier -
      KN-TECH-001, KN-TECH-006, KN-TECH-018, KN-TECH-031, KN-TECH-032,
      KN-TECH-033, KN-TECH-035 - this record is dominated by every row because it
      is not an attack.
    hidden_overhead: >-
      No o(1) and nothing superpolynomial. Five honest hidden costs. (i) The
      filtration STOPS at primality and the survivor set is about 3875, so the
      rigidity question is reduced by a factor of about 34 and NOT answered. (ii)
      The rule is SafeCurves' summary of a paper this session did not open. (iii)
      The rule was read at tier 2, and the tier-1 page was not. (iv) The
      completion-density model rests on a false independence assumption whose
      correction is unmeasured at full size. (v) The per-candidate
      lossy-projection margin is only about 2^5, weaker than the sibling records',
      and the design leans on the population-level projection instead.
    tradeoff_note: >-
      Two genuine tradeoffs. FIRST, PRIMES AGAINST SURVIVORS - each additional
      prime q multiplies the survivor set by (1 - 2/q) and the cost by about
      q^2 / q_previous^2, so the marginal cost per candidate eliminated rises
      steeply and the sweep should stop when it exceeds the value of a smaller
      handoff; the deliverable must publish the marginal curve so the stopping
      point is a decision rather than an accident. SECOND, MEMORY AGAINST
      RECOMPUTATION - storing all 132608 verdict vectors costs tens of megabytes
      and makes the entire clause-set table free, whereas recomputing per clause
      set would multiply the sweep cost by the number of sets. THE 14 CORES ARE
      BINDING HERE AND NOWHERE ELSE IN THIS SESSION'S FOUR RECORDS - the sweep is
      embarrassingly parallel across candidates with near-linear speedup, and the
      determinism control exists to prove the parallelisation did not change any
      verdict.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW BEFORE WRITING THIS FIELD; `null` is not
    asserted. AS AN ATTACK it is dominated by every row simultaneously on time,
    memory and data because it is not an attack - rho (KN-TECH-001, KN-TECH-006),
    automorphism-discounted rho (KN-TECH-018), BSGS (KN-TECH-031, KN-TECH-035),
    MOV and Frey-Ruck (KN-TECH-032), the trace-one transfer (KN-TECH-033). AS A
    SOURCE OF THE GENERATION RULE it is STRICTLY AND COMPLETELY DOMINATED by
    reading inputs/SAFECURVES-20260825/tables/rigid.tsv, which is in this
    repository and states the rule verbatim; that domination is real, operative,
    and conceded without qualification - the record consumes the source rather
    than reproducing it. AS A RIGIDITY AUDIT it is dominated by any session with a
    point-counting backend, which could complete the filtration to a definite
    answer; this record's survivor set is precisely the handoff that would make
    that session's task bounded. AS A FULL-SIZE VALIDATION OF THE 2-ADIC AND
    TRACE-RESIDUE HEURISTICS it is NOT dominated - IDEA-20260829-d052e6 proposes
    10^4 samples at 255 bits and IDEA-20260829-fa8d4e proposes 10^3 at 221 bits,
    while this produces 132608 and about 33000 at 511 bits from the same run, so
    on sample size at cryptographic scale it strictly dominates both. AS A CHECK
    ON A PUBLISHED MINIMALITY CLAIM it is also not dominated, because no incumbent
    inside this program performs one and the mirror cannot check itself; C3's
    redundancy result in particular is a statement about the published rule that
    no table contains. Those two non-dominations are narrow and are stated
    narrowly.
  sota_delta: >-
    ZERO speedup against any attack baseline on every axis. THE DELTA AS DATA HAS
    SHRUNK AND IS RESTATED HONESTLY - the generation rules, the cofactors and the
    criterion cells are now available in-repository, so this record no longer
    creates them and instead consumes them. QUANTITATIVELY AS SCOPE - the rigid
    criterion moves from "must be REFUSED because no computation can decide it",
    which is IDEA-20260829-f5bcff's recorded position, to "reduced from 132608
    candidates to about 3875 with an exhibited list and per-candidate
    certificates", a reduction factor of about 34 and a partial contradiction of a
    standing closure; the remaining gap, primality of two roughly 508-bit odd
    parts per survivor, is named rather than elided. QUANTITATIVELY AS A
    DERIVATION ABOUT THE PUBLISHED RULE - C3 shows the four-clause recipe has
    three independent clauses, since the twist-order clause follows from the
    curve-order clause at p congruent to 1 modulo 4; that costs zero and no table
    contains it. QUANTITATIVELY AS VALIDATION - the two heuristics that three
    records in this campaign depend on move from zero full-size evidence to
    132608 samples for the 2-adic one and about 33000 for the trace-residue one,
    both AT 511 BITS, against the 10^4 at 255 bits and 10^3 at 221 bits their own
    records propose; a factor of about 13 and about 33 in sample size at a
    strictly larger parameter. QUANTITATIVELY AS CORRECTION - this record
    withdraws its own earlier pre-registered claim of a sevenfold M-383 anomaly,
    which rested on assuming a shared clause set; the mirror shows three different
    published recipes and one empty cell, and the recomputed completion densities
    are about 4.1, 2.6, 0.85 and 5.9 with no outlier.
