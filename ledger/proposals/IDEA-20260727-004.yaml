idea:
  id: IDEA-20260727-004
  question_id: RQ-ECDLP-002
  title: >-
    Simulation-overhead budget - when a GGM SIMULABLE verdict actually closes a
    candidate at exponent one half, and which EXP-GGM-001 verdicts it does not
  class: control
  claim: >-
    The inference recorded in DEC-20260726-007 - that oracles classified
    SIMULABLE provide "no sub-birthday advantage" - is valid only when the
    simulator overhead is C_sim = N^o(1). For a simulator of overhead C_sim,
    the Shoup simulation argument yields only T >= c sqrt(N) / C_sim
    augmented-oracle queries, and the attack-cost floor is
    sqrt(N) * C_real / C_sim, where C_real is the true cost of answering one
    oracle query in the concrete representation. Applying this budget to the
    four EXP-GGM-001 verdicts predicts - jet (C = 1) BINDING at exponent 1/2;
    elliptic net (C = O(log N)) BINDING at exponent 1/2; endomorphism BINDING
    at exponent 1/2 but with a model-dependent overhead that is 0 group
    operations only in the structured GGM and Theta(log n) in the strict Shoup
    GGM, so the recorded C = 0 is not model-independent; and incidence
    (C = O(B^m)) VACUOUS, because at any yield-admissible factor base size
    B^m >= N, so sqrt(N) / C_sim is below 1 and the induced bound asserts
    nothing. The maximum multiplicative advantage any augmented oracle can
    confer is exactly G = C_sim / C_real, and G > 1 is necessary for any
    augmented-oracle attack to beat matched rho. The claim is falsified if a
    generic simulator for the incidence oracle with C_sim = N^o(1) is
    exhibited, or if the derived floor formula misclassifies any of the
    synthetic or EXP-GGM-001 control oracles.
  mechanism: >-
    Let A be an algorithm that makes T queries to an augmented oracle O and
    solves the ECDLP with constant probability. If every O-query can be
    answered by a generic-group algorithm using at most C_sim group operations
    and equality tests, then A can be converted into a purely generic algorithm
    using at most C_sim * T group operations. Shoup's bound then forces
    C_sim * T >= c sqrt(N), so T >= c sqrt(N) / C_sim. The attacker's true cost
    is at least T * C_real, where C_real is the concrete cost of one O-query, so
    the induced attack-cost floor is c sqrt(N) * C_real / C_sim. Two
    consequences follow. First, a SIMULABLE verdict closes a candidate at
    exponent 1/2 only when C_sim grows sub-polynomially in N - constant and
    logarithmic overheads preserve the exponent, polynomial overheads do not.
    Second, the ratio G = C_sim / C_real is precisely the maximum advantage
    factor available from the oracle - it says how much cheaper the concrete
    representation makes a query than the generic simulation it replaces. For
    the incidence oracle (report all decompositions of a target over a factor
    base), the cheapest generic simulation is enumeration over factor-base
    m-tuples, C_sim = Theta(B^m / m!), while the concrete cost C_real is the
    fully yield-charged algebraic solve. At any yield-admissible B the
    constraint B^m >= m! N makes C_sim at least N, so the induced floor
    sqrt(N) / C_sim is below 1 and the simulability verdict imposes no bound at
    all. That is not evidence that an attack exists - it is a statement that the
    closure credited to that verdict was not established by it. The test
    discriminates - (a) the incidence floor is VACUOUS at every yield-admissible
    B, so DEC-20260726-007's no-sub-birthday clause is unsupported for that
    oracle and the KN-FIND text must be scoped; (b) a cheaper generic simulator
    for incidence exists with sub-polynomial overhead, so the oracle IS closed
    and no correction is needed; (c) measured G for the incidence oracle exceeds
    1 and grows with N, which is the first quantitative non-generic signal the
    program would have produced and requires independent review.
  novelty_status: adaptation
  novelty_screen:
    screened_on: '2026-07-27'
    corpus_paths_grepped:
      - /Volumes/Volume/git/autolab/research
      - /Volumes/Volume/crypto-autoresearcher-worktrees/ecdlp-batch006/ledger
    grep_results:
      - >-
        "simulab|simulation overhead|generic simulator" in the report corpus -
        13 occurrences across 5 files. The densest file,
        idea_generation_20260719_batch6.md (9 hits), was read - its use of
        "classically simulable" concerns span programs and the quantum general
        adversary bound, a different object. No occurrence in the corpus
        derives an induced floor sqrt(N)/C_sim from a simulator overhead.
      - >-
        The corpus does carry a closely related quantity - the membership-query
        cost exponent alpha that gates RT-1476-SUBRES-A1, with a worst-case
        alpha >= 3/2 barrier from its report-83 query lower bound and report-86
        k-SUM screens. The ratio G defined here is a monotone
        reparameterization of that alpha for the incidence oracle. This overlap
        is disclosed rather than claimed as novelty.
      - >-
        In this ledger, DEC-20260726-007 and EV-GGM-001 record the four
        verdicts with overheads C = 1, C = 0, O(log N) and O(B^m), and the
        decision text itself notes that elliptic net and incidence are "not
        closed at 1/2 by the constant-overhead bound" while simultaneously
        asserting "no sub-birthday advantage" - the second clause is the one
        this control tests. No ledger record contains an overhead budget.
    literature_verified: []
    conclusion: >-
      Shoup's simulation argument is standard; the overhead budget applied to
      this ledger's own recorded verdicts is the adaptation. The G ratio
      duplicates the external corpus's membership-query alpha lane and is not
      claimed as new.
  assumptions:
    - >-
      Shoup's lower bound applies in the generic group model actually used by
      EXP-GGM-001, and the conversion of an augmented-oracle algorithm into a
      generic one by inlining the simulator is valid with the recorded
      overheads.
    - >-
      C_sim as recorded in EV-GGM-001 is an upper bound on the cheapest generic
      simulation. A cheaper simulator would change the verdict, which is
      exactly what falsification condition one tests.
    - >-
      Yield admissibility (B^m >= m! N) is required for the incidence oracle to
      be useful at all - an oracle over a factor base too small to decompose
      anything answers "no decomposition" trivially and confers nothing.
    - >-
      The BINDING and VACUOUS thresholds are conventions and must be
      pre-registered before the test runs, not chosen after seeing the numbers.
  predictions:
    - metric: induced_floor_status_per_oracle
      direction: different
      minimum_effect: >-
        The classification is jet BINDING, elliptic_net BINDING, endomorphism
        BINDING, incidence VACUOUS, at every yield-admissible B for m in
        {2, 3, 4, 5}. A BINDING classification for incidence at any
        yield-admissible B falsifies the claim.
    - metric: endomorphism_simulator_overhead_model_dependence
      direction: different
      minimum_effect: >-
        The exhibited simulator uses 0 group operations in the structured GGM
        (where the (x, y) encoding is granted, so phi(x, y) = (zeta_3 x, y) is
        one field multiplication) and Theta(log n) group operations in the
        strict Shoup GGM (where phi = [lambda] must be evaluated by
        double-and-add). Both give a BINDING floor, so the closure survives,
        but the two counts differ by a factor Theta(log n). If the two models
        give the same count, the model-dependence claim is false.
    - metric: simulation_gap_ratio_G_incidence
      direction: lower
      minimum_effect: >-
        Measured G = C_sim / C_real <= 1 in group-operation equivalents when
        C_real charges the fully yield-charged decomposition cost from
        IDEA-20260727-002 and IDEA-20260727-003. The competing prediction is
        G > 1 with G growing with N across at least three sizes, which would be
        a quantitative non-generic signal requiring independent review before
        any promotion.
    - metric: control_gate_pass_rate_under_quantitative_test
      direction: different
      minimum_effect: >-
        6/6 controls classified correctly - pure_generic BINDING, public_curve
        BINDING, discrete_log NON_SIMULABLE, encoding NON_SIMULABLE, synthetic
        C_sim = N VACUOUS, synthetic C_sim = 2 BINDING. Anything below 6/6
        means the quantitative test is unsound and its verdicts are void.
  minimal_test:
    design: >-
      (1) Implement induced_floor(C_sim, N) = c sqrt(N) / C_sim and a
      pre-registered classifier - BINDING if the floor is at least N^0.4,
      VACUOUS if the floor is below 1, and INDETERMINATE in between with the
      band reported. (2) Evaluate it on the four EXP-GGM-001 oracles using
      their recorded C_sim, at B = ceil((m! N)^(1/m)) for m in {2, 3, 4, 5} and
      N in {2^16, 2^24, 2^32, 2^64}. (3) Exhibit the endomorphism simulator
      explicitly in both model variants and count its operations - one field
      multiplication in the structured GGM, double-and-add for [lambda]P in the
      strict Shoup GGM - reporting C as a function of log n rather than as a
      constant. (4) Measure C_real for the incidence oracle on toy curves at
      bits 12-24 using the yield-charged decomposition cost, and compute G with
      its confidence interval at each size. (5) Re-run the four EXP-GGM-001
      control oracles plus two synthetic oracles through the quantitative
      classifier.
    controls:
      - >-
        The four EXP-GGM-001 control oracles - pure_generic must classify
        BINDING with C = 1, public_curve BINDING with C = 0, discrete_log must
        remain NON_SIMULABLE, encoding must remain NON_SIMULABLE.
      - >-
        Synthetic vacuous oracle with C_sim = N - must classify VACUOUS.
      - >-
        Synthetic binding oracle with C_sim = 2 - must classify BINDING.
      - >-
        Matched Pollard rho and matched BSGS costs reported alongside every
        induced floor, so that a floor is never read without the baseline it is
        being compared against.
      - >-
        Yield-admissibility control - for each B used, report whether
        B^m >= m! N holds. A floor computed at a non-admissible B must be
        excluded from the verdict, since the oracle is vacuous there for a
        different reason.
    required_metrics:
      - induced floor value and BINDING/VACUOUS/INDETERMINATE label per oracle,
        per m, per N
      - endomorphism simulator operation count in both model variants, as a
        function of log n
      - C_sim, C_real and G for the incidence oracle at each tested size, with
        confidence intervals
      - control classification results, 6 controls, pass or fail each
      - matched rho and BSGS costs at each N
      - explicit statement of the pre-registered BINDING and VACUOUS thresholds
  falsification_conditions:
    - >-
      A generic simulator for the incidence oracle with C_sim = N^o(1) is
      exhibited - the oracle IS closed at exponent 1/2 and no scope correction
      to DEC-20260726-007 is warranted.
    - >-
      Any of the six controls is misclassified - the quantitative test is
      unsound and none of its verdicts may be used.
    - >-
      The incidence floor classifies BINDING at some yield-admissible B - the
      vacuity claim is false at that parameterization.
    - >-
      The endomorphism simulator costs the same in the structured and strict
      Shoup models - the model-dependence prediction is false and the recorded
      C = 0 is model-independent after all.
  confounders:
    - >-
      EXP-GGM-001 uses the structured GGM in which the curve equation and point
      encoding are public. In that model the encoding oracle was classified
      NON_SIMULABLE, which already implies that every x-coordinate-using
      algorithm - that is, all of index calculus - is non-generic. The model
      boundary must be stated before any floor is interpreted, or the results
      will be read as stronger than they are.
    - >-
      The BINDING/VACUOUS threshold is a convention. Different thresholds move
      the INDETERMINATE band; pre-registration and sensitivity reporting are
      required.
    - >-
      G is a monotone reparameterization of the membership-query cost exponent
      already used in the external report corpus. Measuring G does not produce
      an independent result from that lane, and must not be reported as one.
    - >-
      C_real depends on the solver implementation, so G inherits an
      implementation dependence. Only the sign of G - 1 and its trend in N are
      interpretable, not its absolute value.
  interpretation_limits:
    - >-
      A VACUOUS verdict removes a claimed closure. It is NOT evidence that an
      attack exists, and it must never be reported as a positive result or as a
      weakening of ECDLP security.
    - >-
      No hypothesis status changes and no promotion follows from this test. Its
      only output is a constraint on what the KN-FIND text promoted by
      DEC-20260726-007 may assert about the elliptic-net and incidence oracles.
    - >-
      The jet and endomorphism closures at exponent 1/2 are expected to SURVIVE
      this test. The record should not be read as challenging them.
    - >-
      All floors are derived statements about a cost model, not measurements of
      any attack, and carry no claim at cryptographic scale.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  source_refs:
    - ledger/decisions/DEC-20260726-007.yaml
    - ledger/hypotheses/H-GGM-001.yaml
    - ledger/proposals/IDEA-20260726-004.yaml
    - /Volumes/Volume/git/autolab/research/idea_generation_20260719_batch6.md
    - /Volumes/Volume/git/autolab/research/idea_generation_20260723_batch4.md
