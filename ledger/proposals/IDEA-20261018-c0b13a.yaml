idea:
  id: IDEA-20261018-c0b13a
  title: Last fall degree as a cheaper, order-independent refutation instrument for the degree cells
  class: measurement
  question_id: RQ-DREG-bd6c86
  area: DREG
  goal_ids:
  - GOAL-DREG-001
  status: proposed
  proposed_by: idea-generator (Sonnet subagent logging the missed items of the 2026-10-18 index-calculus
    review)
  added: '2026-10-18'
  claim: The last fall degree (Huang-Kosters-Yang-Yeo, arXiv 1505.02532) computed for the descended systems
    bounds from above the solving degree seen in the dense closure on every cell where the closure completes,
    within one degree on at least 90% of those cells, at a fraction of the memory.
  mechanism: Macaulay refutation degrees depend on the monomial order and need dense matrices (about 70
    GB at (4,6)). The last fall degree is order-independent and is bounded independently of the extension
    degree under stated conditions; a cheaper computation could replace or pre-screen the memory-heavy
    cells.
  novelty_status: adaptation
  regime: binary and prime degree cells; instrument; 3-5 days with Crossbred
  citations:
  - ref: crypto:research/ic_leads_review_20261018/README.md 3.6 bullet 2
    provenance: internal
    claim: Source of the opportunity, the measured figures quoted here and the cost estimate; desk review,
      no new measurement, costs are the reviewer's estimates.
    verified_by: idea-generator
  - ref: arXiv:1505.02532 (Huang, Kosters, Yang, Yeo), KN-LIT-86a887
    provenance: kb
    claim: Last fall degree of zero-dimensional Weil descent systems.
    verified_by: idea-generator
  - ref: crypto:research/dreg_closure_driver_20261016/RESULTS.md
    provenance: internal
    claim: Closure results the new instrument is calibrated against.
    verified_by: idea-generator
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-IC-fbdb61
    - KR-IC-0d2021
    - KR-IC-f5c584
    nearest:
    - ref: KR-IC-fbdb61
      provenance: internal
      relation: special_case
      delta: The row records the last-fall-degree theory; this idea builds a measurable instrument from
        it and calibrates it on the 20/20 closure cells.
    searched:
      note: Positioned against the cited review and the records it names. The frontier map was not rendered
        or matched in this logging pass; the Coordinator should run tools/build_frontier_map.py --match
        before ranking. A missing row is not evidence of novelty.
  assumptions:
  - Last fall degree and the closure refutation degree are compared on the same systems.
  - A computation path with memory well below dense Macaulay exists (to be established by the test).
  predictions:
  - metric: lastfall_vs_closure_degree
    direction: different
    minimum_effect: Last fall degree >= observed closure degree on every calibration cell; within 1 on
      >= 90%.
  - metric: memory_ratio
    direction: lower
    minimum_effect: At most one tenth of the dense closure peak RSS on the cells both complete.
  minimal_test:
    design: Implement a last-fall-degree computation on the descended systems, run on the 20 calibration
      cells where the dense closure completes, then on one cell beyond the memory wall; compare degrees
      and peak memory.
    controls:
    - 20/20 closure cells as calibration
    - random system with the same multidegree as null
    - known-degree toy as positive control
    required_metrics:
    - last fall degree per cell
    - closure degree
    - peak RSS
    - agreement within 1
  falsification_conditions:
  - Last fall degree below an observed closure degree on any cell contradicts the intended bounding use
    and flags a bug or a misapplied condition.
  - No memory saving versus dense closure refutes 'cheaper'.
  confounders:
  - the theory's conditions may not hold on all cells
  - definition mismatch between last fall and solving degree
  interpretation_limits:
  - A bound on degree, not a cost; a stage diagnostic. Does not replace the large-memory measurement.
  heuristic_assumptions:
  - id: H1
    statement: Last fall degree tracks the closure degree within one on the descended systems.
    rigorous_support: Theory bounds it independently of extension degree.
    validation_plan: Calibrate on 20 cells before use.
  target_complexity:
    time_exponent: Instrument only; no exponent claim.
    memory_exponent: No exponent claimed; memory is the measured constraint, reported as peak RSS.
    best_known: Matched generic rho, r^0.5 group operations; the index-calculus baseline is Table A/B
      of crypto:docs/ic/LEADERBOARD.md (5.23x to 21x matched rho on Koblitz, 5.47x to 13.5x on prime fields).
      Report this row's gap to matched rho (and to Bernstein-Lange where setup is excluded) as distance
      remaining.
    hidden_overhead: Every phase, cold, is charged; unpriced native work is priced at 0, 0.1 and 1 GAE
      per operation (AGENTS.md 5a) wherever two arms are ranked.
    tradeoff_note: Not applicable beyond the stated resource envelope.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  dominated_by: No attack result; the item is an unrun measurement or an unpaid baseline debt.
  sota_delta: Not an improvement; an instrument that could reduce the memory needed to decide the degree
    cells.
