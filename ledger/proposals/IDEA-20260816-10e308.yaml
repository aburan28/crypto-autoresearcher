idea:
  id: IDEA-20260816-10e308
  question_id: RQ-UOV-001
  added: '2026-08-16'
  title: 'Treat Kipnis-Shamir as an instrument rather than an attack: run its invariant-subspace test
    unchanged against random MQ systems, against structure-shaped systems with no oil space, and against
    genuine UOV keys, and publish its measured false-positive rate as a number with its parameter
    dependence.'
  class: measurement
  claim: '(A) Kipnis-Shamir, reconciliation and the intersection attack are used throughout this repository
    as cost models. They are also detectors: each returns a candidate subspace, and a candidate is
    either a genuine oil subspace or it is not. A detector without a measured false-positive rate
    is not an instrument, and no in-repo record supplies one for any of them. (B) The claim under
    test is that the Kipnis-Shamir invariant-subspace test, run at fixed parameters, returns candidate
    subspaces at a rate that is nonzero on inputs that contain no oil space at all, and that this
    rate is a computable function of (q, n, m) alone, approaching the expected count of invariant
    subspaces of a random matrix pencil. Concretely, the number of spurious candidates should track
    the q-analogue count of common invariant subspaces of a random pencil, and the measured rate should
    therefore fall sharply as q grows and rise as the pencil dimension grows. (C) The deliverable
    is a false-positive rate table indexed by (q, n, m), with the certificate rule that separates
    a true candidate from a false one stated explicitly and executed on every candidate: a returned
    subspace is true only if the public map vanishes identically on it, verified independently. That
    table is directly reusable by every other proposal in this bucket, because any future measurement
    using KS as a detector needs it. (D) NOT CLAIMED: this is not an attack, not a cost model, not
    an improvement to Kipnis-Shamir, and not a statement about its complexity. A high false-positive
    rate is not a criticism of the method; it is a property of the detector that anyone using it as
    a measurement device must know and that nobody here currently does.'
  mechanism: 'STAGE 1, fix the detector. Implement the Kipnis-Shamir step exactly as a search for
    subspaces invariant under products of pairs of the public matrices, with a frozen candidate-emission
    rule (what counts as a returned subspace) and a frozen budget. The emission rule is the instrument
    and must not be tuned after seeing results. STAGE 2, three arms in one invocation. Arm 1: genuine
    UOV keys with a planted oil space. Arm 2: uniformly random symmetric matrix tuples of the same
    shape, which contain no planted oil space. Arm 3: structure-shaped decoys - matrix tuples sharing
    the sparsity and rank profile of arm 1 but with no isotropic subspace - built to separate ''the
    detector fires on structure'' from ''the detector fires on oil spaces''. STAGE 3, certification.
    Every emitted candidate from every arm goes to an independent verifier that checks whether the
    public map vanishes on it, so true and false positives are separated mechanically rather than
    by which arm produced them. STAGE 4, rate estimation. Report per arm and per cell: candidates
    emitted per run, fraction certified true, fraction certified false, and the exact binomial interval
    on each. STAGE 5, the parameter law. Fit nothing; tabulate the measured rate against the pre-registered
    q-analogue expectation for random pencils and report the signed discrepancy per cell.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-UOV-001 in full. Grepped ledger/proposals/ for 'false.positive' (hits IDEA-20260808-e7ba81,
      IDEA-20260807-61049d, IDEA-20260808-90c7ab, IDEA-20260808-0eb075, IDEA-20260806-bcbcf5, IDEA-20260807-8027a2,
      IDEA-20260807-bd5d91, IDEA-20260807-efc8de - none in the multivariate slice) and for 'reconciliation'
      (hits include IDEA-20260805-ca92fd, IDEA-20260813-16d752, IDEA-20260808-e820d2, IDEA-20260805-977e16,
      IDEA-20260805-8d9ac0). Read the titles of every multivariate-slice proposal from the family
      grep.
    results: Kipnis-Shamir appears in RQ-UOV-001 and RQ-MAYO-001 as a named baseline attack family
      and in IDEA-20260805-258212 as an attack whose applicability is a function of (n, o). IDEA-20260808-778f82
      analyses a meet-in-the-middle decomposition of the oil-vector search and closes it with an inequality.
      IDEA-20260805-ca92fd derives the intersection system and measures its solving degree against
      a planted-solution null. All of these treat these methods as attacks with costs. The 'false
      positive' hits are all in program-self-audit and ECDLP-side areas, none in the multivariate
      bucket. No in-repo record measures the emission or false-positive rate of any multivariate detector.
    verdict: 'UNVERIFIED. No assertion is made about published literature, which may or may not contain
      such a rate. Assembled from known parts: the Kipnis-Shamir step itself, the q-analogue counting
      of invariant subspaces of a random pencil, and the annihilation certificate rule already required
      by RQ-UOV-001''s constraints. Claimed new relative to the in-repo corpus only: running the detector
      against inputs that contain nothing, certifying every emission, and publishing the resulting
      rate as a reusable instrument property rather than as an attack result.'
  object_first_candidate:
    tracked_object: 'The detector''s emission: a candidate subspace returned by the Kipnis-Shamir
      step, labelled by the independent verifier as certified-true or certified-false, and counted
      per run.'
    lossiness: 'Lossy. From a full run of the detector - its entire search tree, every intermediate
      pencil, every rejected branch - we retain only the number of emissions and a boolean per emission.
      Everything about how the candidate was found is discarded. This is compatible with the operation
      being tracked because the false-positive rate is by definition a function of emissions and their
      labels alone; the search path is irrelevant to it. It is not a change of coordinates: a count
      and a boolean cannot reconstruct a search.'
    propagation: 'One step of the target operation is one detector run on one input. Propagation across
      the parameter grid: the expected number of common invariant subspaces of a random pencil falls
      like a power of q and rises with the pencil dimension, so the emission count should follow that
      law on arm 2. The prediction that makes it falsifiable is a rate that decreases monotonically
      in q at fixed (n, m), and a certified-true rate that is identically zero on arms 2 and 3 by
      construction.'
    survival_score: The object survives exactly one detector invocation; there is no iteration. Its
      useful lifetime is instead across the parameter grid, and the concrete statement is how far
      in q the nonzero false-positive rate persists before dropping below one emission per 10^4 runs,
      which the grid is sized to locate.
  null_object_control: 'Arm 2 is the null object: a uniformly random symmetric matrix tuple of identical
    shape over the same field, containing no planted oil space, fed to the identical detector in the
    same invocation. For the signal arm to mean anything the null arm must emit candidates at a rate
    consistent with the pre-registered random-pencil expectation AND must have a certified-true rate
    of exactly zero, since it contains nothing to find. A nonzero certified-true rate on arm 2 would
    mean random systems of this shape contain oil spaces by accident, which is itself a forced-value
    check on the parameter regime and would invalidate the whole notion of a false positive at those
    parameters.'
  discriminated_from:
  - 'IDEA-20260805-ca92fd (derive the intersection system and measure its solving degree against a
    planted-solution null): measures the difficulty of a system, not the emission behaviour of a detector,
    and its null is a planted-solution system rather than a system containing nothing.'
  - 'IDEA-20260808-778f82 (meet-in-the-middle claw decomposition blocked by an inequality): a closure
    about a search decomposition''s cost; this makes no cost claim and studies emissions.'
  - 'IDEA-20260801-014 (UOV security-model calibration: measured MinRank/oil-space attack cost versus
    prediction): compares measured attack cost with a model; a false-positive rate is not a cost and
    does not enter that comparison.'
  - 'IDEA-20260813-f2a6e7 (certificate-labelled syzygy fingerprints for attack-system equivalence):
    uses certificates to separate explanations of system behaviour; here certificates separate detector
    emissions, and the object is the detector rather than the system.'
  - 'Standard Kipnis-Shamir complexity analyses: those bound the work to find the oil space; this
    measures how often the same procedure hands back something that is not one, which no complexity
    bound reports.'
  assumptions:
  - A frozen candidate-emission rule exists that is faithful to the Kipnis-Shamir step; the rate is
    a property of the rule as much as of the method, and the rule is therefore reported verbatim.
  - The annihilation certificate is a complete and sound test for a candidate being a genuine oil
    subspace at these parameters.
  - Random symmetric tuples of the tested shape almost surely contain no isotropic subspace of the
    target dimension, which the arm-2 certified-true rate checks directly rather than assumes.
  - Exact F_q arithmetic; no numerical tolerance enters the invariance test.
  - The detector budget is fixed in advance and exhausting it is recorded as a bounded search, never
    as an absence of candidates.
  predictions:
  - metric: certified-true emission rate on arm 2 (random systems)
    direction: different
    minimum_effect: 'forced value: exactly 0 over all runs; a single certified-true emission on arm
      2 changes the interpretation of every other number in the run'
  - metric: total emission rate on arm 2 as q increases at fixed (n, m)
    direction: lower
    minimum_effect: predicted to fall at least by a factor of q per unit increase in the pencil's
      excess dimension; the measured rate is reported against that expectation with its signed discrepancy
  - metric: certified-false emission rate on arm 1 (genuine keys)
    direction: higher
    minimum_effect: 0.01
  - metric: emission rate on arm 3 (structure-shaped decoys) versus arm 2
    direction: higher
    minimum_effect: no pre-commitment to a size; the sign is the question, since a decoy arm indistinguishable
      from random tells us the detector keys on isotropy and not on sparsity, which is the more useful
      outcome
  minimal_test:
    design: 'One cell, three arms, one afternoon. Take q = 4, n = 6, m = 3, oil dimension 3. Generate
      2000 genuine UOV keys with a planted oil space, 2000 uniformly random symmetric triples of the
      same shape, and 2000 structure-shaped decoys that copy arm 1''s sparsity pattern and rank profile
      but plant no isotropic subspace. Run the identical frozen Kipnis-Shamir emission routine on
      all 6000 inputs, in interleaved order with paired seeds, and pass every emitted subspace to
      an independent verifier that checks annihilation of the public map. Report six numbers: emissions
      per run and certified-true fraction for each arm, each with an exact binomial interval. This
      already delivers the instrument property: if arm 2 emits at a nonzero rate with a certified-true
      rate of exactly zero, the false-positive rate at that cell is measured and usable; if arm 2
      never emits, the detector is clean at that cell and the grid moves to smaller q or larger n
      where it will not be.'
    controls:
    - Arm 2, uniformly random systems containing no oil space, executed in the same invocation as
      the signal arm.
    - Arm 3, structure-shaped decoys matching arm 1's sparsity and rank profile without an isotropic
      subspace, separating structure-sensitivity from oil-sensitivity.
    - 'Verifier negative control: hand the verifier a deliberately wrong subspace and confirm rejection,
      so that certified-true means something.'
    - 'Verifier positive control: hand the verifier the planted oil space directly and confirm acceptance
      on 100 percent of arm-1 keys.'
    - 'Budget control: run at two detector budgets and confirm the certified-true rate on arm 1 rises
      with budget while the certified-false rate on arm 2 does not, which distinguishes search truncation
      from detector behaviour.'
    required_metrics:
    - emissions per run, per arm, per cell
    - certified-true count and exact binomial interval, per arm
    - certified-false count and exact binomial interval, per arm
    - pre-registered random-pencil expectation per cell and the signed discrepancy
    - budget exhaustion rate per arm
    - verifier control results
  falsification_conditions:
  - A certified-true emission occurs on arm 2, meaning random systems of this shape contain oil spaces
    and the false-positive framing does not apply at those parameters.
  - The verifier negative control accepts a wrong subspace, voiding every certification in the run.
  - The measured emission rate on arm 2 is zero at every tested cell, which falsifies the nonzero
    false-positive claim at the tested scope and is reported as a clean instrument with its interval.
  - Emission rate on arm 2 rises with q, contradicting the propagation rule.
  - Arm 1's certified-true rate does not rise with detector budget, indicating the detector is not
    doing what its definition says.
  confounders:
  - Emission-rule tuning after seeing results, which would manufacture any rate desired; mitigated
    only by freezing and publishing the rule before Stage 2 and recording it verbatim in the run log.
  - Budget exhaustion masquerading as a low emission rate; mitigated by the two-budget control and
    by reporting exhaustion rates separately.
  - Decoys in arm 3 accidentally containing isotropic subspaces; mitigated by certifying arm 3 too
    and reporting any certified-true emission there as a construction failure.
  - Small q inflating accidental invariant subspaces so much that the regime is unrepresentative;
    mitigated by sweeping q and reporting the trend.
  - Treating a measured rate for this emission rule as a property of Kipnis-Shamir in general, which
    the interpretation limits forbid.
  interpretation_limits:
  - The measured rate is a property of one frozen emission rule at toy parameters, not of the Kipnis-Shamir
    family in general.
  - A nonzero false-positive rate is not a criticism of the method and implies nothing about its cost
    or its correctness as an attack.
  - Nothing here transfers to deployed parameter sets, where the emission rate is expected to be far
    smaller and is not measured.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement costs 6000 bounded detector runs
      per cell, each capped by the pre-fixed budget.
    memory_exponent: No attack memory exponent is claimed; each run holds one pencil and a candidate
      list.
    best_known: The incumbent is the absence of any measured detector-validity number in this repository
      for any multivariate attack instrument, established by the greps in the novelty screen. There
      is no attack incumbent because no attack is proposed, and the Kipnis-Shamir cost models named
      in RQ-UOV-001 are inputs to future work rather than competitors here.
    hidden_overhead: 'The dominant hidden cost is the emission rule: a rule loose enough to emit often
      makes the detector look unreliable, and a rule tight enough to emit rarely makes it look clean,
      so the number is only meaningful together with the rule, and the human work is in stating that
      rule so precisely that a later reader can reproduce it. Secondary overhead is the decoy construction
      in arm 3, which is easy to get subtly wrong.'
  dominated_by: n/a (no result claimed). Checked against every frontier row named in RQ-UOV-001 -
    intersection, reconciliation, Kipnis-Shamir, and the compressed-key variants - across time, memory
    and data axes; none is comparable, because a false-positive rate is not a point on any cost frontier.
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverable is
    a false-positive rate per (q, n, m) cell with exact binomial intervals, plus the signed discrepancy
    against the pre-registered random-pencil expectation.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Part A (the detector framing is coherent and a frozen emission rule can
    be written): 0.8, with the residual risk that a faithful rule is harder to pin down than it looks,
    which would itself be worth recording. Part B (the false-positive rate is nonzero at some tested
    cell): 0.6, since at small q accidental invariant subspaces are common but the annihilation certificate
    is a strict filter and may leave the rate at zero. Part C (the rate tracks the q-analogue random-pencil
    expectation): 0.4, the weakest part, because the detector''s emission rule interacts with the
    counting in ways the pre-registered expectation does not model; I expect this part to need revision
    and say so now.'
