    - claim: The source's convention maps to the program's S^theta convention, or does not.
      responsibility: interface
    - claim: beta is reported beside every c_1.
      responsibility: memory
    - claim: No per-key batch number is compared to a single-key number without stating the
        target count.
      responsibility: scope
    not_applicable_reason: null
