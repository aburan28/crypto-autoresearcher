idea:
  id: IDEA-20260808-71c077
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-RSA-afe33c
  goal_id: GOAL-RSA-001
  title: The charging exponent is a per-stage VECTOR, and KN-LIT-2663's batch-NFS triple over-determines
    it for free — batch area L^1.181, batch time L^1.022 and per-key L^1.704 against the single-key
    L^1.976 give three constraints on two unknowns, and because the batch regime REVERSES
    which stage holds the shared object it is the sharpest available test of the asymmetry
    H-RSA-68884a assumes
  class: composition
  claim: 'SCOPE: GNFS cost accounting, single-key and batch regimes, heuristic asymptotics.
    Cost model only; no factorization, no break, no statement about deployed keys. H-RSA-68884a
    charges relation collection at 0 and linear algebra at theta, and pins theta = 1/2 by
    matching KN-LIT-2663''s relayed single-key area-time exponent 1.976 — one equation, one
    unknown, hence a calibration rather than a test. That record itself flags the tension
    that the program''s declared convention is theta = 1/3, not 1/2. KN-LIT-2663 (in-corpus,
    read this session) reports three further numbers: batch NFS factors L^(0.5+o(1)) keys
    with a circuit of area L^(1.181+o(1)) in time L^(1.022+o(1)), per-key area-time L^(1.704+o(1)).
    DERIVED CONSISTENCY CHECK PERFORMED HERE: 1.181 + 1.022 = 2.203 and 2.203 - 0.5 = 1.703
    against the reported 1.704 — internally consistent to the quoted precision, which is a
    transcription check on a bulk-seeded entry that this program has never performed. CLAIM:
    generalize to a vector (theta_s, theta_LA) and re-optimize in both regimes. Then c_1 =
    1.976 is a CURVE in the plane, not a point; the batch regime supplies two further constraints
    because its shared object is the SIEVING circuit rather than the matrix; the system is
    over-determined and the residual is the statistic. PREDICTED: no consistent solution exists
    with theta_s = 0. The batch result''s whole content is that sieving effort amortizes across
    keys, and a stage charged at exponent 0 has nothing to amortize in the cost model — so
    a model fitted to the single-key point should MISS the batch points. If that holds, HEUR-NFS-2
    is contradicted by a published result the program already owns, at zero compute, corroborating
    X1-05''s outcome (O-B) from an independent direction.'
  mechanism: 'DERIVED IN-REPO from KN-LIT-2663 and H-RSA-68884a (both read in full). WHY BATCH
    IDENTIFIES theta_s: in the single-key regime only the matrix is plausibly large enough
    to charge, so any single-key datum constrains only a combination. The batch construction
    reports a CIRCUIT AREA separately from its TIME, and the area is attributable to the sieving/ECM
    machinery — that separation is what identifies theta_s independently of theta_LA. THE
    LITERATURE HAS ALREADY RUN THE EXPERIMENT THAT SEPARATES THE TWO UNKNOWNS AND THIS PROGRAM
    HAS THE PAPER AND HAS NOT USED IT. DERIVATION SKETCH, WITH ITS INCOMPLETENESS STATED:
    following H-RSA-68884a''s Steps 1-5 with two exponents, relation collection has full cost
    L[alpha + theta_s beta] and block Wiedemann L[(2 + theta_LA) beta], so the balance is
    alpha = (2 + theta_LA - theta_s) beta; substituting into the relation condition and re-optimizing
    over the degree parameter gives a two-parameter family c_1(theta_s, theta_LA). I HAVE
    NOT COMPLETED THIS ALGEBRA AND DO NOT ASSERT A CLOSED FORM. The one check I did complete
    by inspection is the degeneracy question: the two exponents enter the BALANCE only through
    their difference but enter the SMOOTHNESS-RELATION condition separately, so they are not
    degenerate — which is the precondition for the over-determination to have content and
    had to be checked before proposing this at all. THE BATCH DERIVATION IS NOT SKETCHED,
    because the batch parameterization cannot be reconstructed from an abstract. KN-LIT-2663
    RECORDS A LOCAL COPY AT downloads/batchnfs-20141109.pdf, SO THE PRIMARY TEXT IS ALREADY
    IN THIS REPOSITORY AND STAGE 0 NEEDS NO NETWORK. That is the most important practical
    fact in this record.'
  why_not_a_renamed_known_approach: 'NEAREST KNOWN: H-RSA-68884a itself. Differences: (a)
    a per-stage vector instead of a scalar; (b) using the batch regime as an IDENTIFICATION
    device rather than excluding it; (c) treating the fit as over-determined and therefore
    falsifiable. H-RSA-68884a explicitly excludes batch as "a different regime ... comparing
    them would be a category error". THIS RECORD DISPUTES THAT EXCLUSION, on the ground that
    a different regime is not a category error once the model covers both — it is the only
    available cross-validation. If the dispute is wrong, the reason will be a specific structural
    difference found in the primary text, and recording that reason is itself the deliverable.'
  predictions:
  - observable: existence of (theta_s, theta_LA) in [0,1]^2 reproducing 1.976, 1.181 and 1.022
      within 0.01 each
    metric: exists / does not exist, plus least-squares residual
    predicted: DOES NOT EXIST with theta_s = 0. Exists, if at all, only with theta_s > 0.
      No specific value is predicted; the deliverable is the feasible set.
  - observable: internal consistency of the relayed batch triple
    metric: 1.181 + 1.022 - 0.5 versus 1.704
    predicted: 1.703 vs 1.704, agreeing to quoted precision (DERIVED). Disagreement means
      a transcription error in the bulk-seeded entry, to be resolved against the local PDF
      before anything else.
  - observable: whether the early-abort ECM factor lies inside the L[1/3] o(1)
    metric: order comparison of exponents 1/6 vs 1/3
    predicted: INSIDE, symbolically, since exp(c (log N)^(1/6)(log log N)^(5/6)) = L[1/6,
      c] = L[1/3, o(1)]. The consequence — this program's factoring o(1) provably contains
      a superpolynomial factor — is a disclosure, not a discovery.
  - observable: whether the batch circuit's area is dominated by relation collection (from
      primary text)
    metric: yes / no
    predicted: YES. If not, the identification argument fails and the record reduces to a
      transcription check.
  minimal_test: 'STAGE 0 (local, no network): read downloads/batchnfs-20141109.pdf; extract
    the batch parameterization, the definitions of the area and time exponents, and which
    stage dominates the area; upgrade KN-LIT-2663 from bulk-seeded (null year, null venue,
    all four identifiers null) to read. STAGE 1 (zero compute, exact rationals): complete
    the two-parameter single-key algebra; verify it reduces to H-RSA-68884a''s one-parameter
    family at theta_s = 0 (MANDATORY baseline reproduction); solve for the feasible set and
    report the residual. STAGE 2: report the feasible set, the residual, and the verdict on
    theta_s = 0.'
  controls:
  - BASELINE REPRODUCTION at theta_s = 0 must give exactly c(theta)^3 = 4(2+theta)^4/(9(1+theta)^2),
    c(0)^3 = 64/9, beta(0)^3 = 8/9, delta(0)^3 = 3. Exact rational identities, no tolerance.
    A family not containing the incumbent as a slice measures something else.
  - NULL OBJECT — O(1) shared state in both stages must give c = (64/9)^(1/3) for every (theta_s,
    theta_LA). Any dependence means the optimization is mis-specified.
  - POSITIVE CONTROL — BSGS must return n^(1/2) at theta = 0 and n^(2/3) at theta = 1/3. Reused
    from H-RSA-68884a's G4 so a failure is attributable to the generalization rather than
    the machinery.
  - DEGENERACY CHECK, RUN FIRST — confirm c_1 is not a function of (theta_LA - theta_s) alone.
    If it is, the parameters are unidentifiable from single-key data and this record is redundant;
    that must be discovered before effort is spent.
  confounders:
  - The two regimes optimize different parameters, so both must be re-optimized under the
    same charging vector rather than one evaluated at the other's parameters.
  - PRINCIPAL RISK — "area-time" in KN-LIT-2663 may be defined differently from the step-count-times-S^theta
    convention. If so the 1.976 anchor is not a point on the program's own curve and the whole
    calibration is mis-anchored. Stage 0 must extract the definition verbatim.
  - The relayed exponents carry +o(1) and three or four digits; a 0.01 tolerance may be finer
    than the source supports, and its adequacy is a Stage-0 question.
  - KN-LIT-2663's entry carries a "Relevance to this program" paragraph about MOV/Frey-Ruck
    that H-RSA-68884a already flags as belonging to a different paper; the entry's reliability
    is in question and the re-read is not optional.
  falsification_conditions:
  - The degeneracy check shows c_1 depends only on the difference — parameters unidentifiable,
    record withdrawn before further work.
  - The two-parameter family does not reduce to the incumbent at theta_s = 0 — the generalization
    is wrong, not the incumbent.
  - Stage 0 shows the conventions are incomparable — over-determination void; the deliverable
    becomes a correction to how 1.976 anchors H-RSA-68884a's theta = 1/2 endpoint, WHICH IS
    ITSELF VALUABLE because that anchor is currently load-bearing.
  - A consistent solution exists WITH theta_s = 0 — prediction fails, HEUR-NFS-2 corroborated
    independently, X1-05's (O-B) becomes less likely. A clean informative negative.
  - The local PDF is absent or unreadable — infrastructure outcome (AGENTS.md rule 5), never
    evidence about NFS cost.
  interpretation_limits: A cost-model structure claim. Factors nothing, breaks nothing, moves
    no exponent of the factoring problem, says nothing about deployed keys; the exponents
    are ACCOUNTING exponents. Batch NFS is a many-key amortized regime and any conclusion
    crossing regimes must say so; conversely nothing here licenses a statement about an individual
    key. All conclusions are conditional on H-RSA-68884a's gates G1-G8, which are unrun.
  assumptions:
  - H-RSA-68884a's Steps 1-5 algebra is correct; this extends rather than re-derives it and
    inherits its `proposed` status.
  - The batch exponents are correctly transcribed; Stage 0 verifies against the local PDF.
  - Both regimes optimized under the same HEUR-NFS-1 and HEUR-NFS-3.
  heuristic_assumptions:
  - id: HA-10
    statement: (Cross-regime convention identity.) The area-time exponents reported for batch
      and single-key NFS in KN-LIT-2663 are computed under one convention expressible as step-count
      times (shared-object size)^theta, so the source's exponents and the program's charging
      vector live in one space.
    rigorous_ingredient: None. An assumption about a definition in a paper — the most load-bearing
      and most checkable item here.
    distribution_imitated: none
    validation_route: 'Stage 0: extract the paper''s own definitions of area and time verbatim
      and exhibit the algebraic map to the program''s convention, or show none exists. A reading
      task on a LOCAL file, no network. If no map exists, the deliverable changes to a warning
      that H-RSA-68884a''s 1.976 anchor is mis-typed.'
    tail_checks: 'Check the source''s own boundary case: does its single-key exponent reduce
      to the classical (64/9)^(1/3) when its area charge is switched off? If so that is the
      cleanest bridge between conventions.'
  - id: HA-11
    statement: (Stage dominance.) The batch circuit's reported area is dominated by relation-collection
      machinery rather than per-key linear algebra, so the area exponent constrains theta_s.
    rigorous_ingredient: None; a structural reading to be confirmed.
    distribution_imitated: none
    validation_route: Stage 0 reading of the local PDF; identify which component the area
      bound derives from. Binary outcome, cheap.
    tail_checks: If both stages contribute comparably the constraint mixes the parameters;
      report the mixing coefficient rather than forcing a clean attribution.
  target_complexity:
    time_exponent: 'A FAMILY c_1(theta_s, theta_LA), not a value. Anchors that must be reproduced:
      c_1(0,0) = (64/9)^(1/3) = 1.922999 and c_1(0,theta) = H-RSA-68884a''s family. NO EXPONENT
      OF THE FACTORING PROBLEM MOVES.'
    memory_exponent: beta(theta_s, theta_LA), reported beside every c_1 without exception;
      anchors beta(0,0) = 0.961500 and beta(0,1/3) = 0.835550.
    best_known_baseline: Uncharged L[1/3, 1.922999]; the program's charged candidates 1.949616
      and 2.243510; the relayed anchors 1.976 (single key) and 1.704 (per key, batch).
    hidden_overhead_disclosure: 'Newly named: the early-abort ECM factor exp((c+o(1))(log
      2^B)^(1/6)(log log 2^B)^(5/6)) = L[1/6, c], superpolynomial and wholly inside the o(1)
      of every L[1/3] factoring statement in this corpus. Inherited: the uncontrolled o(1);
      post-merge density treated as L[o(1)] while relayed as 252; polynomial selection and
      filtering charged nowhere.'
    time_memory_tradeoff: 'The batch regime IS a tradeoff: per-key cost bought with circuit
      area and with L^0.5 simultaneous targets. Any per-key number quoted from it must carry
      the target count, or it commits exactly the category error H-RSA-68884a warns of — which
      this record must avoid even while crossing the regimes deliberately.'
  sota_delta: No attack cost changes. Converts a one-equation one-unknown calibration into
    a three-equation two-unknown test, and predicts failure at theta_s = 0. If so, the program's
    charged factoring exponent moves from 1.9496 toward 2.2435 (0.294) on the strength of
    a published result already in its own corpus. Plus one previously undisclosed superpolynomial
    factor.
  dominated_by: 'CHECKED against every in-corpus factoring-cost row: H-RSA-68884a (one-parameter,
    single-key, excludes batch — does not dominate a cross-regime test), IDEA-20260805-1775f2,
