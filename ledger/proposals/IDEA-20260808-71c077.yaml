  proof_search_map:
    bottleneck: Whether the single-key and batch exponents live in one convention. If yes
      the system is over-determined and the charging structure becomes falsifiable; if no,
      the program's theta = 1/2 anchor is mis-typed. Both turn on one paragraph of one local
      PDF.
    baseline_embedding:
      parameter_slice: theta_s = 0 (must return the incumbent one-parameter family) and (0,0)
        (must return the classical constants).
      reproduction_check: 'Exact rational identities: c_1(0,0)^3 = 64/9, beta(0,0)^3 = 8/9,
        delta(0,0)^3 = 3, and c_1(0,theta)^3 = 4(2+theta)^4/(9(1+theta)^2) identically in
        theta. Frozen fixture committed before any fitting.'
    observation_collision:
      observable: the exponent triple (single-key AT, batch area, batch time).
      distinct_preimage_search: 'PRE-DECLARED: c_1 alone cannot identify the pair (solving
        c_1 = 1.976 gives a curve) — which is why three numbers are used. More dangerous:
        two different charging STRUCTURES (per stage vs per object) could reproduce all three.
        SEPARATING INVARIANT: beta, the optimal smoothness exponent, which differs between
        structures and which primary text may report — the same separator H-RSA-68884a names
        for its own G3 collision, reused deliberately to keep the records commensurable.'
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Replace one accounting exponent by a per-stage vector, so "which stage
        is charged" becomes a coordinate rather than a narrative.
      predicted_gain: Makes HEUR-NFS-2 a fitted coordinate with a residual, hence falsifiable
        by data the program already owns.
    - transform: baseline_lift
      proposed_object: Enlarge the constraint family from one published exponent to four and
        require a strict fit rather than mere feasibility.
      predicted_gain: Converts a calibration into a test; the residual, not the existence
        of a solution, is the reported statistic.
    quantifier_order: THERE EXISTS one pair (theta_s, theta_LA), fixed and independent of
      regime, SUCH THAT FOR ALL four published exponents the model reproduces them within
      tolerance. The pair may not depend on the regime or on which exponent is being reproduced.
      The weaker order — for each exponent there exists a pair reproducing it — is the trap
      a one-equation calibration falls into and is precisely why the incumbent's theta = 1/2
      match is described here as a calibration rather than a test.
    method_ceiling:
      strongest_certifiable_claim: At most that a per-stage charging vector does or does not
        exist reproducing four published heuristic exponents under stated heuristics, with
        a residual. Cannot certify machine costs, cannot bound the o(1) (which it has just
        shown contains a superpolynomial factor), cannot speak to special NFS, cannot speak
        to deployed keys.
      nearby_object_control: 'MUST NOT SHOW THE EFFECT: an algorithm with O(1) shared state
        in both stages. MUST SHOW IT: BSGS returning n^(2/3) at theta = 1/3. Both zero-compute
        and both inherited from H-RSA-68884a so failures are attributable to the generalization.'
    proof_obligations:
    - claim: The two-parameter family reduces exactly to the incumbent at theta_s = 0.
      responsibility: baseline
    - claim: c_1 is not a function of (theta_LA - theta_s) alone.
      responsibility: strictness
    - claim: The batch triple is internally consistent (1.703 vs 1.704).
