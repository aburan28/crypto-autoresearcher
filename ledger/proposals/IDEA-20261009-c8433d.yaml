  title: Generalized-Jacobian extension class equals the Tate pairing
  class: control
  claim: |-
    The connecting homomorphism agrees with Miller's algorithm up to a fixed convention on 100% of instances, is trivial on l-parts with l not dividing p^k - 1, and costs a DLP in F_{p^k}^* otherwise.
  mechanism: |-
    Ext^1(E, G_m) is identified with E (dual). The generalized Jacobian J_m with modulus m = (A) + (B) is an extension 0 -> G_m -> J_m -> E -> 0 with class A - B. On F_p-points the sequence stays exact (Hilbert 90). Lifting P in E(F_p)[N] to J_m, multiplying by N and reading the F_p^* coordinate is the Tate pairing; it is non-trivial on the l-part iff l | p - 1 (embedding degree 1), and over F_{p^k} iff l | p^k - 1.
