idea:
  id: IDEA-20260816-5e9358
  question_id: RQ-ALECF-001
  added: '2026-08-16'
  title: 'One fixed circuit does not have one score: enumerate the accounting choices the benchmark
    specification leaves implicit, and compute the interval of scores the identical circuit receives
    across that lattice, reporting the multiplier range rather than a point.'
  class: measurement
  claim: '(A) A quantum cost is a model output, and the model here has more free switches than the
    specification names. The committed ALECF artifacts expose several of them directly. The final
    log row of EXP-ALECF-001 records a FRACTIONAL Toffoli count of 1316080.523, while score.json records
    1316081, so the shot-averaged count is rounded to an integer before multiplication; had it been
    truncated the score would be 1516124160 rather than 1516125312, and had the unrounded average
    been used, 1516124762.5. The Clifford count of 5530669.476 in the same row enters the score with
    weight zero. The scoring formula uses the average executed Toffoli count per shot, not a worst
    case. Peak qubit width is recorded as 1152 without the specification stating whether input registers
    are included. And a Toffoli is treated as one unit rather than as its decomposition into non-Clifford
    gates. (B) The claim is that these are lattice coordinates, not quibbles: each is a binary or
    small-arity choice, the choices are largely independent, and the product of the lattice is a set
    of admissible scores for ONE fixed circuit. The deliverable is that set''s interval, expressed
    as a multiplier on the nominal score. (C) The claim is that the interval''s width is measurable
    today for the committed vectors and, more usefully, for circuits built here where every coordinate
    can be evaluated exactly rather than inferred. (D) The claim is that the width should be reported
    alongside any score, because a difference between two circuits smaller than the interval width
    is not a circuit difference at all: the two committed ALECF scores differ by 7.15 percent, so
    any lattice coordinate worth more than 7.15 percent is capable of reversing that comparison on
    its own. (E) WHAT IS NOT CLAIMED: no claim that the benchmark''s choices are wrong, no claim that
    any alternative convention is correct, no claim that the committed scores are miscomputed (the
    score relation reproduces exactly under the round-then-multiply reading), no claim about the circuits
    behind them, and no attack, speedup or security consequence.'
  mechanism: 'STAGE 1: enumerate the lattice. From the committed README and score.json, list every
    accounting choice the specification does not pin down, each with its admissible values: rounding
    rule (round, floor, ceil, none); gate-set granularity (Toffoli atomic, Toffoli decomposed at a
    declared cost); Clifford weight (zero, or a declared nonzero weight); statistic over shots (mean,
    maximum, a high quantile); peak-width convention (including or excluding input registers); authoritative
    row selection (final row, best row, last row marked correct). STAGE 2: build a circuit whose every
    coordinate is exactly computable, that is a toy reversible point-add circuit in the interpreter,
    where shot-level counts, Cliffords, decompositions and register inventories are all directly observable
    rather than inferred. STAGE 3: evaluate the score at every lattice point, producing the full set.
    STAGE 4: report the interval as min and max multipliers on the nominal point, and report each
    coordinate''s individual multiplier range with the others held nominal, which separates the coordinates
    that matter from those that do not. STAGE 5: run the null arm, applying the identical lattice
    to a random resource profile of the same shape, so that the interval''s width is compared against
    what the lattice does generically. STAGE 6: apply the lattice arithmetic to the two committed
    ALECF vectors for the coordinates that can be evaluated from committed data alone, and mark every
    coordinate that cannot as unevaluable rather than guessing it.'
  novelty_status: unverified
  novelty_screen:
    method: Read experiments/EXP-ALECF-001/source/README.md, score.json and results.tsv in full, and
      the same for EXP-ALECF-002 and EXP-ALECF-003, recomputing the score relation under four rounding
      rules. Confirmed RQ-ALECF-001 carries zero proposals. Read the ten RQ-QRE-6dba8c proposal titles
      and claim openings. Grepped ledger/proposals/ for 'convention', 'accounting', 'gate set', 'granularity'
      and 'rounding'.
    results: 'IDEA-20260809-63fc4a, on a costing pipeline where every constant carries provenance
      and the build fails if one does not, is the closest record: it concerns unstated constants inside
      a pipeline. This proposal concerns unstated CONVENTIONS in a scoring rule, which are not constants
      and cannot be sourced by citation because they are choices rather than values; the deliverable
      is an interval rather than a provenance gate. IDEA-20260809-61bedf concerns the reporting format
      of a qubit/runtime pair. IDEA-20260815-f4c398 ranks assumptions of a reproduced headline estimate
      by sensitivity, which is adjacent in spirit but operates on a published total''s inputs, not
      on a benchmark''s scoring conventions, and this proposal reproduces no total. The scalarization
      contract elsewhere in this batch varies the functional applied to a fixed resource vector; here
      the resource vector itself is underdetermined by the specification, which is the complementary
      question and is named in discriminated_from.'
    verdict: 'UNVERIFIED. Convention-dependence of resource counts is standard knowledge outside this
      repository and nothing is asserted about how it has been treated in published work. What is
      claimed new here is the specific construction: enumerating this benchmark''s implicit accounting
      lattice from its committed artifacts, evaluating the full score set for a circuit whose every
      coordinate is exactly observable, and reporting the interval width against a lattice-matched
      null so that a score difference can be compared to it. Assembled from known parts: sensitivity
      analysis over discrete switches, gate-set decomposition conventions, and interval reporting.'
  object_first_candidate:
    tracked_object: 'The accounting-lattice point: the tuple of convention choices (rounding rule,
      granularity, Clifford weight, shot statistic, peak-width convention, authoritative-row rule)
      together with the score it induces for a fixed circuit. The object is followed as lattice coordinates
      are moved with the circuit held fixed.'
    lossiness: 'The projection from a full circuit-plus-execution record to a lattice point plus a
      score discards the circuit, the arithmetic, the schedule and the shot-level data, keeping a
      convention tuple and one number. This is compatible with the operation of interest, which is
      ''apply the scoring rule'', because that operation consumes exactly the shot statistics under
      a convention. The retained part propagates deterministically and, importantly, mostly multiplicatively:
      changing granularity multiplies the gate term by a known factor, changing the Clifford weight
      adds a known term, and changing the peak-width convention multiplies the width term, so the
      induced score is a product of per-coordinate factors up to the interactions the experiment measures.
      That near-multiplicativity is exactly why the interval can be reported as a multiplier range
      and why per-coordinate ranges are meaningful.'
    propagation: 'One step of the target operation is moving a single lattice coordinate with the
      circuit and all other coordinates held fixed. Acting on the score: the rounding coordinate moves
      it by at most one part in the Toffoli count, that is by at most 8 parts in ten million for the
      committed vectors, which is negligible and measurably so; the granularity coordinate multiplies
      the gate term by the declared decomposition cost, which is a factor of several; the Clifford-weight
      coordinate adds a term that for the committed final rows would be 5530669.476 times the weight,
      which at weight one would exceed the Toffoli term fourfold; the peak-width coordinate changes
      the width by the input register count. Composing steps multiplies the factors, with interaction
      terms arising only where a coordinate changes which row is authoritative, so the lattice decomposes
      almost completely and the residual interaction is a measurable quantity.'
    survival_score: 'The multiplicative decomposition survives every coordinate except the authoritative-row
      rule, and dissolves there, because changing which row is scored changes the underlying counts
      rather than reweighting them. Concretely the structure survives five of six coordinates as clean
      per-coordinate factors and dies at the sixth, and the experiment reports the size of the resulting
      interaction term as the number quantifying that death. On committed data the sixth coordinate
      is not hypothetical: EXP-ALECF-001''s log contains rows with 3942753 Toffolis at width 2715
      and a final row with 1316080.523 at width 1152, so row selection alone moves the score by more
      than a factor of six.'
  null_object_control: 'The null object is a random resource profile of the same shape as the measured
    circuit''s: a shot-level Toffoli distribution with the same mean and variance, a Clifford count
    of the same magnitude, a register inventory of the same size, and a log of the same number of
    rows, all generated without any circuit behind them. The identical lattice evaluation runs on
    it in the same invocation. For the signal arm to mean anything the null must show a SIMILAR interval
    width: if it does, the width is a property of the lattice and the profile''s magnitudes alone,
    which is the expected and honest outcome and is exactly what licenses quoting the width as a general
    caveat rather than as a circuit-specific finding. If instead the real circuit''s interval is much
    wider, the excess must be explained before it is reported, most likely by an interaction the decomposition
    missed.'
  discriminated_from:
  - 'IDEA-20260809-63fc4a (auditable pipeline, build fails on an unsourced constant): concerns constants
    with provenance; conventions are choices, not values, and cannot be sourced, so this contract
    reports an interval rather than enforcing a gate.'
  - 'IDEA-20260815-f4c398 (reproduce a 256-bit estimate, rank assumptions by sensitivity): reproduces
    a headline total and sweeps its physical inputs; this reproduces nothing and sweeps accounting
    conventions of a scoring rule.'
  - 'The scalarization contract elsewhere in this batch: holds the resource vector fixed and varies
    the functional; this holds the circuit fixed and shows the resource vector itself is not determined
    by the specification, which is the prior question.'
  - 'The op-stream residual contract elsewhere in this batch: measures whether the reported categories
    partition the op stream, a completeness question about the counting; this measures the score''s
    dependence on conventions given whatever categories exist.'
  assumptions:
  - The six enumerated coordinates are the material ones; an unenumerated convention would widen the
    true interval and the enumeration is stated as a floor rather than a complete list.
  - The committed README is the operative specification for the committed scores, so a convention
    it does not state is genuinely implicit rather than documented elsewhere in a file this repository
    does not hold.
  - A toy circuit built in the interpreter permits exact evaluation of every coordinate, including
    shot-level distributions and Toffoli decomposition, which is true by construction for the interpreter
    but is stated.
  - Coordinates are approximately independent, with the authoritative-row rule as the declared exception;
    the interaction term is measured rather than assumed away.
  predictions:
  - metric: ratio of maximum to minimum admissible score over the full lattice for one fixed toy circuit,
      excluding the authoritative-row coordinate
    direction: higher
    minimum_effect: 4.0
  - metric: individual multiplier range of the rounding coordinate alone
    direction: lower
    minimum_effect: 1.001
  - metric: individual multiplier range of the Clifford-weight coordinate alone
    direction: higher
    minimum_effect: 2.0
  - metric: size of the interaction term, measured as the ratio between the full-lattice interval
      and the product of per-coordinate ranges
    direction: lower
    minimum_effect: 1.2
  - metric: number of enumerated coordinates whose individual multiplier range exceeds 1.0715, the
      ratio between the two committed ALECF scores
    direction: higher
    minimum_effect: 2
  minimal_test:
    design: 'Build one toy reversible point-add circuit in the interpreter with shot-level instrumentation,
      so that every lattice coordinate is exactly evaluable: per-shot Toffoli counts, Clifford counts,
      a declared Toffoli decomposition, the register inventory split into inputs and ancillas, and
      a synthetic multi-row log. Evaluate the score at all lattice points, which is a few hundred
      evaluations and costs nothing. Report the full interval as a multiplier on the nominal point,
      each coordinate''s individual range with others nominal, and the interaction ratio between the
      full interval and the product of individual ranges. In the same invocation, generate a lattice-matched
      random resource profile and repeat. Separately, and clearly marked, apply only those coordinates
      evaluable from committed ALECF data (rounding rule, authoritative-row rule, Clifford weight
      using the committed Clifford counts) to the two committed vectors, and mark granularity and
      peak-width convention as unevaluable because the necessary data is not in this repository. The
      discriminating outputs are the interval width, the per-coordinate ranking, and the count of
      coordinates exceeding the 7.15 percent gap between the committed scores.'
    controls:
    - Lattice-matched random resource profile evaluated through the identical lattice code in the
      same invocation.
    - 'Nominal-point reproduction control: at the nominal lattice point, the evaluator must reproduce
      the committed score relation exactly for both committed vectors, that is 1316081 times 1152
      equal to 1516125312 and 1423723 times 1141 equal to 1624467943.'
    - 'Unevaluable-coordinate marking: any coordinate requiring data absent from this repository is
      reported as unevaluable rather than estimated, and the count of such coordinates is a reported
      metric.'
    - 'A single-coordinate identity check: holding all coordinates nominal must return exactly the
      nominal score, as an instrument check.'
    - 'Independence check: per-coordinate ranges are computed both with others nominal and with others
      randomized, and the difference is the measured interaction.'
    required_metrics:
    - full-lattice score interval as a multiplier range
    - per-coordinate individual multiplier range
    - interaction ratio
    - null-profile interval width
    - count of unevaluable coordinates on committed data
    - nominal-point reproduction check result
    - count of coordinates whose range exceeds the committed score gap
  falsification_conditions:
  - The nominal-point reproduction control fails to reproduce either committed score exactly, meaning
    the lattice's nominal point is not the benchmark's actual convention and the whole enumeration
    is mis-anchored.
  - The full-lattice interval ratio is below 1.2, meaning conventions barely matter and a point score
    is nearly well defined.
  - The interaction ratio exceeds 2, meaning the coordinates are strongly coupled and per-coordinate
    ranges are misleading.
  - No enumerated coordinate has a range exceeding the 7.15 percent gap between the two committed
    scores, meaning that gap is robust to every convention considered.
  - The identity check returns a value other than the nominal score.
  confounders:
  - The enumeration is authored, so the interval is a lower bound on convention-dependence and could
    be widened by a coordinate nobody listed; this is stated rather than mitigated.
  - The Toffoli decomposition cost is itself a convention with several admissible values, so the granularity
    coordinate has an arity that is a modelling choice nested inside a modelling choice.
  - Applying the lattice to the committed vectors mixes evaluable and unevaluable coordinates, and
    a reader who ignores the marking will read a partial interval as a full one.
  - Shot-level statistics for the committed vectors are not available, only their averages, so the
    shot-statistic coordinate is unevaluable there and its range is measured only on the toy circuit.
  interpretation_limits:
  - An interval width is a statement about the specification's underdetermination, not about any circuit's
    quality or any score's correctness.
  - The toy circuit's interval does not transfer numerically to the committed 256-bit vectors; only
    the coordinates evaluable on committed data are reported for those, and they are reported separately.
  - Finding that a coordinate can reverse the ordering of two scores does not mean it does; no claim
    is made about which convention the original campaign intended.
  target_complexity:
    time_exponent: No attack exponent is claimed. The contract measures the convention-dependence
      of a scoring rule.
    memory_exponent: No attack memory exponent is claimed.
    best_known: 'The incumbent is the single nominal score as committed: 1516125312 for EXP-ALECF-001
      and EXP-ALECF-002, and 1624467943 for EXP-ALECF-003, each quoted as a point. The contract does
      not dispute those values; it measures the interval a fixed circuit would occupy across admissible
      conventions and asks that the interval be quoted with the point.'
    hidden_overhead: 'The hidden cost is enumeration completeness: the interval is only a lower bound,
      and there is no procedure that certifies the list of conventions is complete, so the honest
      report carries an open-ended caveat that no amount of work removes. Human cost also hides in
      the marking discipline, because the temptation to fill an unevaluable coordinate with a plausible
      value is strong and would silently convert an audit into a fabrication.'
  dominated_by: n/a (no result claimed). I checked the committed frontier for this bucket, the two
    ALECF points (1316081, 1152) and (1423723, 1141), and this contract contributes no circuit and
    no row. No attack is proposed and there is no time/memory/data frontier to sit on.
  sota_delta: no attack; conceptual/measurement contribution only. The one quantitative anchor is
    that the two committed scores differ by 7.15 percent while, on committed data alone, changing
    the authoritative-row rule within EXP-ALECF-001's own log moves its score by more than a factor
    of six, from a row at 3942753 Toffolis and width 2715 to the final row at 1316080.523 and width
    1152.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part (A), the specific accounting facts read from committed artifacts
    (fractional shot-averaged Toffoli count, round-then-multiply, zero Clifford weight, unstated width
    convention): 0.93, since each is recomputed from committed bytes, with residual risk that the
    README states something I did not extract. Part (B), that the full-lattice interval exceeds a
    factor of 4 on a toy circuit: 0.75, driven mostly by the Clifford-weight and granularity coordinates,
    either of which alone could carry it. Part (D), that at least two coordinates individually exceed
    the 7.15 percent gap between the committed scores: 0.85. That the interaction term stays below
    1.2, validating the multiplicative decomposition: 0.6. That the contract changes how any downstream
    record quotes a score: 0.3.'
