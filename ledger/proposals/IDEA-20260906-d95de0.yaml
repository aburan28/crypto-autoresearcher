    "claim": "On a declared torsion module with certified transition bases, nonbacktracking cycle holonomy distinguishes scalar from non-scalar cycle maps whenever their actions differ modulo the torsion order; retaining this information can reject scalar cycles before expensive interpolation with zero false rejection of the declared non-scalar residue class.",
