idea:
  id: IDEA-20260809-81f74b
  question_id: RQ-FIND-001
  added: '2026-08-09'
  title: 'The corpus''s one open problem about the program''s own reasoning prescribes a retrospective
    on committed data as its cheapest discriminating test, and the committed data cannot support
    it: the usable sample is at most 7, not 343, and the technique that would generate the missing
    data has been applied zero times since it was filed'
  class: measurement
  claim: 'KN-OPEN-875d43 (added 2026-08-05) asks whether weakness beats description length as
    a hypothesis-selection proxy under this program''s non-uniform task distribution, and names
    its ''Cheapest discriminating test'' as ''Retrospective, no new experiments needed'': take
    already-closed hypotheses whose fate is known, reconstruct the sibling candidates that fit
    the same original evidence ''from the proposal and design records, not invented after the
    fact'', score both orderings blind, and ask which better predicted survival. NOBODY HAS MEASURED
    WHETHER THE CORPUS CAN SUPPORT IT. I re-measured and it cannot, with specific numbers. (1)
    343 of 459 proposals carry honest_prior_of_survival but ONLY 7 ARE A BARE NUMBER; 341 of 343
    strings are distinct, the rest being prose scoped to a narrow sub-claim (''0.97 that (A) is
    correct as stated, since it is five lines of...'') -- and a prior on ''the theorem is two
    lines and correct'' is not a prior on survival under parameter change, so the field as written
    does not carry the quantity the retrospective needs. (2) The outcome column barely exists:
    of 271 hypotheses only 12 have reached a resolved status (weakened 7, rejected_scoped 2, supported
    1, supported_scoped 1, rejected 1), while 203 sit at proposed or analyzed. (3) The join is
    thin: only 40 of 271 hypotheses carry any source-proposal back-link. So the usable (prior,
    outcome) sample is at most 7. (4) The contemporaneous-sibling requirement KN-OPEN-875d43 calls
    load-bearing is NOT BEING GENERATED: KN-TECH-276d30, whose step 4 is ''Record the runner-up
    and why it lost. A one-line note in the decision record'', is cited by ZERO ledger, experiment
    or knowledge records, and ''runner-up'' appears in exactly three decisions, all predating
    its 2026-08-05 filing and none recording a rejected sibling hypothesis.'
  mechanism: 'REPORT THE FEASIBILITY CENSUS AS THE FINDING -- the retrospective''s real sample
    is 7, and say precisely why. Then make it possible rather than running it underpowered: (a)
    split honest_prior_of_survival into a NUMERIC prior plus the existing prose rationale, and
    bind the numeric prior to the hypothesis''s own falsification_conditions rather than to a
    sub-claim; (b) make the source-proposal back-link REQUIRED when /design-experiment turns a
    proposal into a hypothesis, which is the join the retrospective needs and which 231 of 271
    hypotheses lack; (c) discharge KN-TECH-276d30 step 4 going forward, since the contemporaneous
    runner-up is exactly the sibling the retrospective cannot reconstruct after the fact -- every
    day it sits unapplied the retrospective gets STRICTLY LESS FEASIBLE. The binding constraint
    is item (2): with 12 of 271 hypotheses resolved, THE HYPOTHESIS-RESOLUTION RATE IS ITSELF
    THE QUANTITY TO REPORT, and it is a measurable property of this program worth stating on its
    own.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - 'KN-OPEN-875d43 prescribes the retrospective as feasible and never checks feasibility --
      it lists three design-time failure modes (hindsight siblings, small sample, unblinded scoring)
      but never asks whether the join keys and the numeric prior exist at all. KN-TECH-276d30
      flags itself ''Not validated in this program ... zero internal evidence'' and names KN-OPEN-875d43
      as the open problem, closing the loop with neither side measuring the corpus. Neither is
      a record that the sample is 7. Verified across all 459 proposals: searches for weakness
      as a selection proxy, description length, Occam, base rate, Bennett and prior calibration
      return NO proposal on hypothesis-selection proxies -- the title-level hits are all about
      experimental calibration of physical quantities. Cluster C14 measures the direction criterion''s
      effect on generation, a different instrument on a different document; this measures whether
      the program''s stated priors can ever be scored.'
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS: running the retrospective underpowered. The
      object is the FEASIBILITY of the retrospective KN-OPEN-875d43 prescribes.'
    tracked_object: 'The join between a stated prior and a resolved outcome: per proposal, whether
      it carries a scoreable numeric prior; per hypothesis, whether it has reached a resolved
      status and carries a source-proposal back-link.'
    one_step_propagation_rule: Each new proposal-hypothesis pair either completes the join or
      does not; the usable sample is their intersection and is exactly computable.
    newness_score: Nil as mathematics. The content is that the corpus's one open problem about
      its own reasoning reads as runnable and is not.
  lossy_projection_identifiability_audit:
    projection: the corpus -> a count of scoreable (prior, outcome) pairs.
    what_is_discarded: Everything but the join.
    is_it_only_a_change_of_coordinates: 'NO -- the count does not exist. Honest caveat: this record''s
      deliverable is a feasibility census, which is bookkeeping; the interesting quantity it exposes
      is the hypothesis-resolution rate.'
    mirror_failure_check: 'CHECKED. The census can come out large. It does not: 343 proposals
      carry a prior but only 7 are a bare number, only 12 of 271 hypotheses have reached a resolved
      status, and only 40 carry a source-proposal back-link -- so the usable sample is at most
      7.'
  null_object_control:
    primary_null: 'THE CENSUS IS ITS OWN CONTROL: report the three counts separately (scoreable
      priors, resolved outcomes, join keys) so a reader can see which of the three is binding
      rather than accepting an aggregate. The binding constraint is the resolution rate, not the
      prior format.'
    secondary_nulls:
    - Verify the 7 by hand before publishing the number; a census that miscounts its own sample
      is worse than no census.
    - KN-TECH-276d30's step 4 ('record the runner-up and why it lost') is cited by zero records,
      and 'runner-up' appears in exactly three decisions, all predating its filing -- so the contemporaneous
      sibling the retrospective needs is not being generated either.
  assumptions: []
  predictions:
  - metric: usable (numeric prior, resolved outcome) pairs
    direction: lower
    minimum_effect: At most 7 against an apparent 343 -- a factor of ~50 -- which is the finding.
  - metric: hypothesis-resolution rate
    direction: different
    minimum_effect: 12 of 271 resolved is a measurable property of this program worth stating
      on its own.
  minimal_test:
    design: Report the feasibility census as the finding with all three counts separated; then
      propose the three schema changes that would make the retrospective possible going forward
      rather than running it underpowered now.
    controls:
    - hand-verification of the 7
    - three-count separation
    - KN-TECH-276d30 sibling-generation check
    required_metrics:
    - scoreable-prior count
    - resolved-outcome count
    - join-key count
    - usable intersection
    - hypothesis-resolution rate
  falsification_conditions:
  - 'The usable sample is materially larger than 7 on hand-verification: the retrospective is
    runnable now and should be, and this record''s premise is wrong.'
  - 'The resolution rate is not the binding constraint: the prior format is, and the fix is cheaper
    than proposed.'
  - 'The retrospective is runnable at n = 7 with a usable effect size: run it rather than deferring.'
  confounders:
  - A prior scoped to a narrow sub-claim ('0.97 that (A) is correct as stated') is not a prior
    on survival under parameter change; the census must classify by what the prior is ABOUT, not
    merely by whether a number appears.
  - Resolution status conventions vary across lanes; state the mapping.
  - Every day KN-TECH-276d30 sits unapplied the retrospective gets STRICTLY LESS FEASIBLE, since
    the contemporaneous sibling cannot be reconstructed after the fact.
  interpretation_limits:
  - A feasibility census, not a calibration result. It says nothing about whether this program's
    priors are well calibrated.
  - Schema changes are Coordinator acts.
  heuristic_assumptions:
  - id: HEUR-PRCAL-1
    statement: A numeric prior bound to a hypothesis's own falsification_conditions would be scoreable.
    rigorous_support: None; it is a proposed convention, untested.
    validation_plan: Adopt it for one batch and check whether the resulting priors can in fact
      be scored.
  target_complexity:
    time_exponent: n/a
    memory_exponent: n/a
    best_known: n/a -- no attack
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: n/a (no attack claimed)
  sota_delta: ZERO on every attack axis; no attack is proposed. This is the one open problem in
    the corpus about the program's own reasoning, and it is currently un-runnable while reading
    as runnable. Either the census establishes that a calibration measurement is available at
    zero marginal compute -- the first quantitative statement about whether this harness's stated
    priors track outcomes -- or it establishes with numbers that the corpus has been recording
    priors in a form that can never be scored, which is worth knowing before another 343 are written.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 0.95 that the census reproduces on hand-verification. 0.9 that the
    resolution rate (12 of 271) is confirmed as the binding constraint. 0.3 that the three schema
    changes are adopted. 0.0 that a calibration result emerges from this record, which is explicitly
    not its deliverable.
