    "title": "Canonical Kummer quotient graph and equality-only coverage ceiling",
    "class": "control",
    "claim": "For an odd-prime cyclic group G=<P>, the canonical quotient X=G/{+/-1} has an exact width-two occurrence-labelled path graph, but no target-independent memoryless selector can orient +P; adding one predecessor makes the state injective and therefore only reproduces the B58 factor-map boundary. In the frozen target-independent pre-hit equality-only replay model, M stored quotient points and K online quotient points cover at most 2MK of n possible discrete logarithms, so the optimized single-target time exponent is 1/2 with no improvement over generic baselines.",
    "mechanism": "Fold the +/-1 walk on G onto representatives v_i=pi(iP), retain edge occurrences at the folded endpoints, prove the selector contradiction from pi(R)=pi(-R), lift orientation with the ordered predecessor/current pair, decode a quotient collision into the two candidates i-j and -i-j, and count their union before any hit. The resulting counting theorem is an equality-only control and not an ECDLP improvement.",
