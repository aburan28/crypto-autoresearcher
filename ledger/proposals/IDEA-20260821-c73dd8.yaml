idea:
  id: IDEA-20260821-c73dd8
  question_id: RQ-FRODO-a2dbe2
  added: '2026-08-21'
  title: >-
    Set every computational term to ZERO and ask what the proof could certify even against an
    infinitely hard LWE: the STATISTICAL RESIDUE of the transcribed bound (the delta terms, the
    message-space terms, the salt- and seed-collision terms) has its own guarantee horizon
    H = sup{x : residue(2^x) < 1/2}, computable in seconds per parameter set, and the question
    is whether H sits above or below the claimed category floor for FrodoKEM-640/976/1344 and
    for the salt-free eFrodoKEM variants.
  class: mechanism
  claim: >-
    (A) THE MECHANISM BEING PROPOSED, NOT MERELY A MEASUREMENT. What caps a concrete IND-CCA
    guarantee is not always the hardness assumption. An FO-style bound is a SUM of a
    computational term (an LWE advantage) and a set of terms that contain no assumption at all:
    a correctness-error term, a message- or seed-space search term of the form (queries)/|M|, a
    salt-collision term, a seed-collision term. Those terms are paid by the adversary's query
    budget alone. No amount of lattice hardness reduces them. The structural claim is that for
    FO-based KEMs the binding constraint on what the proof CERTIFIES can be one of these
    statistical terms rather than the assumption, and that which one binds is a function of the
    length parameters (len_mu, len_salt, len_sec) rather than of the lattice dimension - so it
    moves with a design choice that the category assignment does not visibly track.
    (B) THE ESTIMAND, MADE CONCRETE AND CHEAP. Define residue_P(q) as the transcribed bound's
    right-hand side at parameter set P with EVERY term containing a computational advantage
    deleted, as a function of the query/target vector scaled by a single scalar 2^x. Define the
    GUARANTEE HORIZON H(P) = sup{x : residue_P(2^x) < 1/2}. H is a single number per parameter
    set, found by bisection in milliseconds, and it is an UPPER BOUND on what the proof can
    certify no matter how hard LWE is. (C) THE FALSIFIABLE COMPARISON. Compare H(P) against the
    published figure for that set - 149.8 / 212.6 / 266.8 bits, per the retrieved CFRG
    security-considerations draft - and against the NIST category floor the set targets. Two
    outcomes, both informative. If H(P) exceeds the floor with margin at all three sets and for
    both variants, THE STATISTICAL RESIDUE IS NOT THE BINDING CONSTRAINT, the 2025 salt fix was
    sufficient in this respect, and this lane should stop looking here and redirect to the
    computational side (which belongs to other goals). If H(P) falls below the floor at any set,
    the proof is vacuous in part of the regime the category claim is supposed to cover, and the
    deliverable is the exact crossing with the term that caused it named.
    (D) WHY THIS IS NOT THE PUBLISHED RESULT. Glabush-Hövelmanns-Stebila have already done a
    version of this for ONE term: the message-space search term at 128-bit message spaces, which
    they show costs FrodoKEM-640 and HQC-128 real multi-target security at circa 2^64 challenge
    ciphertexts and which salting recovers 62 bits of. That published result is the reason to
    ask the general question, is used here as an EXTERNAL CALIBRATION TARGET, and is cited
    rather than rediscovered. The open question is whether the salt merely moved the binding
    term - to the salt-collision term, to the delta term, or to a seed-collision term - or
    lifted the horizon clear of the floor, and whether the SALT-FREE ephemeral variants have a
    horizon at all comparable to the standard ones. Nobody in this program has computed any of
    these numbers.
    (E) WHAT IS NOT CLAIMED. No attack. No break. No adversary. A horizon is a statement about
    what an inequality can certify, and a bound going vacuous is NOT a scheme becoming
    insecure - the scheme may be perfectly secure with the proof saying nothing, which is the
    ordinary situation for many primitives. No LWE hardness is estimated or consumed: setting
    the computational term to zero is precisely what keeps this record out of the lattice lane
    (GOAL-FRODO-002.non_duplication[1]). The failure rate enters as a swept symbol and this
    record asserts nothing about whether its published value is correct
    (GOAL-FRODO-002.non_duplication[0]).
  mechanism: >-
    STAGE 0 (GATE, inherited): the GOAL-FRODO-002 BATCH-001 transcription, with each term tagged
    computational or statistical AT TRANSCRIPTION TIME by whether it contains an assumption
    advantage symbol. The tagging is mechanical and must be recorded before any evaluation, so
    the partition cannot be tuned. STAGE 1: delete every computational term. Because the bound
    is a sum of non-negative terms, the residue is a valid lower bound on the right-hand side,
    so the horizon it yields is a valid UPPER bound on the certifiable region - the direction
    matters and is stated. STAGE 2: fix a scaling ray. All query/target variables are scaled by
    one scalar 2^x along a declared ray (for example q_G = q_H = 2^x, q_D = 2^{x/2}, U*C = 2^{x/2}),
    with at least three rays evaluated so that the horizon is not an artifact of one ray; report
    the horizon per ray and the spread across rays. STAGE 3: bisect for H(P) at each of
    FrodoKEM-640/976/1344 and each eFrodoKEM variant, in exact rational or certified interval
    arithmetic, at the threshold 1/2 and also at 2^-32 and 2^-64 so the answer is a curve rather
    than one convention-dependent scalar. STAGE 4: name the BINDING TERM at the horizon - the
    term that is largest at x = H - and report it as a label per parameter set per ray. STAGE 5:
    the derivative dH/d(len_salt), dH/d(len_mu), dH/d(log delta), computed by finite differences
    on the same code path, which is the sensitivity the lane's charter actually asks for and
    costs three extra bisections. STAGE 6: controls, below.
  novelty_status: unverified
  novelty_screen:
    method: >-
      THE crypto-kb MCP RETRIEVAL INDEX IS UNAVAILABLE THIS SESSION (in-memory Qdrant; it
      answers nothing), so no `kb` provenance appears in this record. Instrument: Grep tool
      (ripgrep), the pre-extracted lane inventory, and WebSearch/WebFetch. Actual searches run
      2026-08-21 from /home/user/crypto-autoresearcher, with counts:
      Grep 'message space|message-space|seed space|vacuous|vacuity' in ledger/proposals/ -> 193
      files, a count dominated by the ordinary word 'message'; RECORDED AS NON-DISCRIMINATING
      rather than as prior art, and no conclusion is drawn from it.
      Grep 'multi-target|multi-user|multi-ciphertext' in ledger/proposals/ -> 434 occurrences
      across 122 files; within the FRODO lane the concentration is IDEA-20260816-32c366 (19).
      Grep 'eFrodoKEM|ephemeral variant' repo-wide -> 2 files, both the lane's own framing
      records; no proposal in the repository mentions the ephemeral variant.
      Grep 'FrodoKEM|Frodo-640|eFrodoKEM' in knowledge/ -> 7 files, none stating a bound.
      Grep 'Glabush|Hövelmanns|Hovelmanns|Stebila|salted Fujisaki|SFO transform' repo-wide -> 42
      files; the only salted-FO mention in knowledge/ is KN-LIT-b9e1a8 (HQC specification). THE
      PUBLISHED MULTI-TARGET KEM ANALYSIS IS NOT FILED IN THIS CORPUS.
      Grep 'Micciancio-Walter|advantage/time|reduction runtime|runtime of the reduction'
      repo-wide -> only research_digest chunks and an unrelated DBKZ citation in KN-LIT-6702.
      READ IN FULL: the 8-line lane inventory, RQ-FRODO-a2dbe2, GOAL-FRODO-002, the exemplar
      IDEA-20260816-b336a3, the first 70 lines of IDEA-20260816-32c366,
      docs/inventor-protocol.md, docs/target-result-profile.md,
      knowledge/techniques/KN-TECH-1a5b7e.md, GOAL-MLKEM-005's census.md.
      WEB, fetched and read: https://cic.iacr.org/p/3/1/20 ;
      https://datatracker.ietf.org/doc/html/draft-longa-cfrg-frodokem-security-considerations/ ;
      https://eprint.iacr.org/2025/1861 (abstract page) ;
      https://datatracker.ietf.org/doc/draft-smyslov-lamps-frodokem-certificates/ . WebSearch
      queries: 'FrodoKEM 2025 specification per-ciphertext salt IND-CCA security proof
      eFrodoKEM'; '"salted Fujisaki-Okamoto" SFO transform multi-target tight security proof
      salt'; 'Fujisaki-Okamoto transform tightness reduction running time loss bit security
      Micciancio Walter'; 'draft-longa-cfrg-frodokem status 2026 FrodoKEM ISO standardization
      deployment TLS'. ACQUISITION FAILURES, recorded as such and never as evidence: the ePrint
      PDF for 2025/1861 and the Glabush-Hövelmanns-Stebila preprint PDF both returned unreadable
      compressed-stream extractions, so NO INEQUALITY HAS BEEN READ BY THIS SESSION and the term
      list in claim (A) is a description of the FO bound FAMILY from recalled knowledge, not a
      transcription of FrodoKEM's bound.
    results: >-
      Inside the repository, the nearest records are IDEA-20260816-d270bc, which labels which
      additive term DOMINATES over a five-dimensional grid, and IDEA-20260816-8596af, which
      ledgers forgiven constants. Neither deletes anything: d270bc reads the full bound and asks
      about the shape of its dominance partition as a transcription check, and 8596af works
      inside the advantage's constant structure. Deleting the computational term is an ABLATION
      of the bound, and no lane record performs one. IDEA-20260816-7b9457 propagates an interval
      on the failure rate through the full bound; a horizon with the computational term deleted
      is a different functional and would be computed even if the failure rate were known
      exactly. Outside the repository the situation is materially different and must be stated
      plainly: Glabush-Hövelmanns-Stebila (IACR CiC 3(1), 4 May 2026) HAVE published the
      message-space instance of exactly this reasoning - deterministic FO encryption reduces the
      IND-CCA experiment to a search on the message space, 128-bit message spaces are 'not large
      enough to avoid collisions between pre-computation and challenge values', attacks become
      feasible at circa 2^64 challenge ciphertexts against FrodoKEM-640 and HQC-128, and salting
      recovers 62 bits at the 128-bit level. So the IDEA that a non-computational term can bind
      is published, and is published against this exact scheme.
    verdict: >-
      UNVERIFIED, and the honest reading is that the CORE IDEA IS KNOWN FOR ONE TERM. What is
      proposed here is (i) the generalization from one term to the whole statistical residue,
      computed as a single scalar per parameter set with its binding-term label; (ii) the
      application to the SALT-FREE eFrodoKEM variants, which the published work does not appear
      to treat and which no record in this program mentions at all; (iii) the sensitivity
      derivatives dH/d(len_salt), dH/d(len_mu), dH/d(log delta), which are what the lane's
      charter asks for; and (iv) using the published 62-bit / 2^64 figures as an EXTERNAL
      CALIBRATION TARGET the pipeline must reproduce before it is trusted anywhere else - which
      is a stronger instrument certification than anything internal to this program can supply.
      None of that is claimed to be new mathematics. A reviewer who can open the CiC paper
      should check whether the general horizon is already computed there; if it is, the correct
      outcome is a filed KN-LIT entry and the withdrawal of this record's novelty claim, keeping
      only the eFrodoKEM arm.
  object_first_candidate:
    tracked_object: >-
      The STATISTICAL RESIDUE of the bound: the sum of exactly those terms containing no
      computational advantage symbol, followed as a function of the query/target scale along a
      declared ray, and summarized by its horizon H and the label of the term binding at H.
    lossiness: >-
      GENUINELY AND MASSIVELY LOSSY. The projection deletes the entire computational content of
      the bound - the term that carries all the lattice cryptography and most of the bound's
      information - and keeps only the assumption-free part. What survives cannot reconstruct
      the bound: from the residue alone one cannot recover the LWE advantage, the lattice
      dimension, the modulus, or the bit figure. The discard is COMPATIBLE with the target's
      operation, which is evaluation of a sum of non-negative terms and comparison against a
      threshold: deleting non-negative terms yields a valid lower bound on the sum, so
      'residue >= 1/2' implies 'bound >= 1/2' unconditionally and the horizon of the residue is
      a valid upper bound on the horizon of the whole. The retained part therefore propagates
      deterministically - monotonically, term by term - and the inequality direction is
      preserved by construction rather than by assumption. This is the exact opposite of the
      inventor-protocol section 2 failure case: not only is the projection non-invertible, it
      deletes the majority of the object, and what is kept still supports a one-sided
      conclusion.
    propagation: >-
      One step is one increment of the scale x. The law: each residue term is a monotone
      non-decreasing function of the query/target scale (a delta term multiplied by a query
      count; a q/|M| term; a collision term in the number of salts drawn), so the residue is
      monotone and its horizon is a well-defined supremum locatable by bisection. IF ANY TERM
      IS NOT MONOTONE the horizon is a set rather than a scalar, and reporting that is required
      rather than optional - it is also the cheapest internal falsifier in the whole record.
    survival_score: >-
      Survives the entire evaluation because the residue is defined for every scale, and
      dissolves as an ANSWER at the point where the deleted computational term would have
      dominated anyway - i.e. the horizon is informative only where the residue binds first. The
      record therefore also reports the CROSSOVER: the scale at which the residue equals a
      declared nominal value of the computational term, using the published figure as that
      nominal value without re-deriving it. Beyond the crossover the object says nothing, and
      saying where that is is part of the deliverable rather than a caveat.
  null_object_control: >-
    FOUR controls, each able to fail, and one of them anchored OUTSIDE this program.
    NULL-1, THE EXTERNAL CALIBRATION TARGET, and it is the strongest control available here:
    run the identical horizon pipeline on the UNSALTED FO bound with a 128-bit message space -
    the configuration Glabush-Hövelmanns-Stebila analyze - and require it to reproduce their
    published quantitative statement, namely that the multi-target search term becomes binding
    in the region of circa 2^64 challenge ciphertexts and that adding a salt recovers of order
    62 bits at the 128-bit level. The comparator is NAMED, EXTERNAL, and PUBLISHED, and the
    threshold is declared before the run: agreement within a stated tolerance in bits, with the
    tolerance fixed in advance and the paper's own assumptions transcribed. A pipeline that
    cannot reproduce a published number for the one term where a published number exists has no
    standing to report a horizon for any other term. THIS CONTROL CAN FAIL, and if it fails the
    record produces nothing.
    NULL-2, THE CONSTANT-RESIDUE NULL: run the pipeline on a synthetic bound whose statistical
    residue is a constant independent of every query variable. The horizon MUST come back
    +infinity / 'no horizon'. If the tool returns a finite number, it is manufacturing horizons
    out of its own bisection bracket, and every number it has ever produced is suspect.
    NULL-3, THE TERM-DELETION SENSITIVITY, with the comparator named and a numeric threshold
    declared before the run (KN-TECH-1a5b7e obligation 3): delete the message-space term from
    the residue and require H to INCREASE by the analytically derived amount; then halve
    len_salt and require H to move by the derived amount in the opposite direction. Run at
    least three interior points on each and REPORT WHETHER H IS MONOTONE across them - two
    endpoints exhibit a range, not a direction.
    NULL-4, FORCED-VALUE DERIVATION (KN-TECH-1a5b7e obligation 4), done on paper before any
    evaluation: derive what H must be when a single term of the form q/2^{len} dominates. It is
    len - 1 exactly. If the pipeline returns anything else on a single-term residue, the
    arithmetic is wrong; and if the real residue's H comes back within rounding of len_mu - 1 or
    len_salt - 1 for every parameter set, the pipeline is reporting a length parameter rather
    than a horizon, and the whole exercise has re-derived its own inputs.
    SPREAD CHECK: NULL-2's comparator has a derived value, so its spread is not zero by
    construction; NULL-1's comparator is an external published figure with its own stated
    assumptions.
  discriminated_from:
    - >-
      IDEA-20260816-d270bc records WHICH additive term is largest across a five-dimensional
      grid, as a transcription-consistency check on the dominance partition's cell structure. It
      never deletes a term, it evaluates the full bound, and its output is a label field rather
      than a scalar per parameter set. This record's ablation - deleting every computational
      term - changes what the answer MEANS: a horizon computed with the assumption deleted is an
      upper bound on the certifiable region that no hardness result can lift, which is a
      statement d270bc's label field cannot make. They share the transcription and should share
      code.
    - >-
      IDEA-20260816-8596af multiplies together the constants and inequalities forgiven along a
      chain of game hops. A horizon is not a forgiven constant: the terms in the residue are
      terms the proof STATES, not terms it drops, and 8596af's amnesty figure would be unchanged
      if the residue's horizon were 40 bits or 400.
    - >-
      IDEA-20260816-7b9457 pushes an uncertainty interval on the correctness error through the
      bound. That is uncertainty in one input; this is an ablation of a whole class of terms.
      This record does use interval arithmetic, and 7b9457's machinery is the right
      implementation route - the relationship is instrument-to-target.
    - >-
      IDEA-20260816-583998 subtracts ROM and QROM exponent vectors. A horizon is computed within
      one model; running it in both models yields two horizons whose difference is a different
      quantity from 583998's exponent-difference vector, though the two are complementary and
      should be reported together if both are run.
    - >-
      IDEA-20260816-32c366 simulates multi-target hash search at toy digest widths. This record
      runs no simulation and enumerates nothing; it evaluates a stated inequality. The two also
      differ in what they could be wrong about: 32c366 can be wrong about the combinatorics, this
      record can only be wrong about the transcription or the arithmetic.
    - >-
      IDEA-20260821-c05d5f and IDEA-20260821-c2242b (this batch) concern the bound's INPUTS -
      their provenance and their quantifiers. This record deliberately needs neither: the horizon
      is a property of the inequality alone and is computed by scaling the inputs along a ray, so
      it can be run BEFORE either of those questions is settled. That independence is why it is
      the cheapest first move in the lane.
    - >-
      IDEA-20260821-c50370 (this batch) tracks the REDUCTION'S resources. This record ignores
      the reduction entirely and reads only the inequality's statistical part. A run of one says
      nothing about the other.
  citations:
    - ref: 'https://cic.iacr.org/p/3/1/20 (Glabush, Hövelmanns, Stebila, On The Multi-target Security of Post-Quantum Key Encapsulation Mechanisms, IACR CiC 3(1), 2026-05-04)'
      provenance: retrieved
      claim: >-
        Abstract read verbatim: 'Attacks have been identified against standards-track FO-based
        KEMs with 128-bit message spaces (FrodoKEM-640 and HQC-128) which become feasible if the
        adversary is given many challenge ciphertexts (say, 2^64). These attacks exploit the
        deterministic encryption induced by the FO transform which allows the IND-CCA experiment
        to be reduced to a search problem on the message space, which in some cases may not be
        large enough to avoid collisions between pre-computation and challenge values';
        'replacing the FO transform with the salted variant can recover 62 bits of multi-target
        security'; and that in the classical ROM multi-target IND-CCA of the salted KEM tightly
        reduces to multi-target IND-CPA of the PKE. THIS IS THE PUBLISHED INSTANCE OF THIS
        RECORD'S MECHANISM FOR ONE TERM, it is the NULL-1 calibration target, and it is cited
        as prior art rather than rediscovered. ONLY THE ABSTRACT WAS READ; the preprint PDF
        fetch failed, so no inequality, no assumption list and no derivation from that paper has
        been read by this session, and NULL-1 requires transcribing them first.
      verified_by: idea-generator@2026-08-21
    - ref: 'https://datatracker.ietf.org/doc/html/draft-longa-cfrg-frodokem-security-considerations/ (draft-longa-cfrg-frodokem-security-considerations-00)'
      provenance: retrieved
      claim: >-
        Verbatim from the fetched rendering: 'security estimates of 149.8 bits for
        (e)FrodoKEM-640, 212.6 bits for (e)FrodoKEM-976 and 266.8 bits for (e)FrodoKEM-1344';
        'FrodoKEM tightly achieves multi-target security by means of the salted Fujisaki-Okamoto
        (SFO) transform'; the ROM proof is tight to decisional normal-form LWE and 'a similar
        (non-tight) proof is given in the QROM'; 'ephemeral FrodoKEM must not be used in
        applications in which a single public key may produce 2^8 ciphertexts or more'. The
        fetch also reported that the document states no explicit inequality. NOTE, as a fact and
        not as an accusation: the SAME bit figures are quoted for the standard and ephemeral
        variants, which is a natural reading of a figure computed from the underlying lattice
