idea:
  id: IDEA-20260821-c73dd8
  question_id: RQ-FRODO-a2dbe2
  added: '2026-08-21'
  title: >-
    REPOINTED 2026-08-24. The single-target guarantee horizon is NOT an open question: it is
    forced by ten lines of arithmetic on eprint 2025/1861 Eq. (7) at the paper's own constants,
    and this record now records that derivation instead of proposing to run it. What remains open
    and untabulated is the MULTI-TARGET arm - the statistical residue of Eq. (3) as a function of
    (n_u, n_c) rather than of a single query scale - and the FrodoKEM (SFO, lensalt = 256/384/512)
    versus eFrodoKEM (FO, lensalt = 0) difference, neither of which appears as a number anywhere
    in the primary text: Table 4 is single-user single-ciphertext only and Section C.1.2 gives
    order-of expressions with no evaluation.
  class: mechanism
  claim: >-
    (A) THE MECHANISM, UNCHANGED AND NOW PARTLY CONFIRMED FROM PRIMARY TEXT. An FO-style bound
    composes a computational term (an LWE advantage) with terms that contain no assumption at
    all: a correctness-error term, a message-space search term of the form (queries)/|M|, a
    salt-collision term. Those terms are paid by the adversary's query and target budget alone and
    no amount of lattice hardness reduces them. The structural claim is that for FO-based KEMs the
    binding constraint on what the proof CERTIFIES can be one of these statistical terms rather
    than the assumption, and that which one binds is a function of the length parameters
    (lenmu, lensalt) and of the target counts rather than of the lattice dimension.
    THIS IS NO LONGER A CONJECTURE AT THE SINGLE-TARGET POINT: evaluating eprint 2025/1861
    Eq. (7) at the paper's own constants (derivation in `forced_value_derivations` FV-1) shows
    the statistical residue BINDS at (e)FrodoKEM-640 and -976 under the beyond-core-SVP cost
    model (column B of Table 4) and does NOT bind under core-SVP (column C) or at 1344-B. That
    answer is arithmetic, it was obtained without any pipeline, and it is recorded here rather
    than proposed as an experiment.
    (B) WHAT IS WITHDRAWN. The previous headline - compare the guarantee horizon H(P) against the
    NIST category floor along a declared query ray - is WITHDRAWN. Under the paper's own
    convention (Section C.1.1: q_RO < t * 2^-18 and Adv_CPA(B) <= t * 2^-134.5 at Frodo-640) every
    term of Eq. (7) is linear in t, so the ratio of residue to computational term is CONSTANT
    along that ray and the comparison has an answer forced before any run. The old
    confounders[4] guessed the cause and routed it to 'the comparison target must change'
    instead of to a pre-run forced-value derivation; that was a KN-TECH-1a5b7e Mode 3 failure
    and the correct repair was to do the derivation, which is now done.
    (C) THE REPOINTED ESTIMAND, IN TWO ARMS NEITHER OF WHICH IS TABULATED ANYWHERE.
    ARM 1, MULTI-TARGET. Eq. (3) carries three target-count-dependent statistical terms -
    n_c/|M|, q_RO * delta(n_u), and n_u * n_c * (n_c - 1) / (|M| * 2^lensalt) - and Section C.1.2
    bounds the multi-key degradation only as an order-of expression with delta(n_u) <= delta(1) *
    n_u. Nobody has evaluated them. The estimand is the CROSSING SURFACE: the locus in (n_u, n_c)
    at which the multi-target statistical terms raise the per-unit-t bound one bit above its
    single-target value, per parameter set, per variant, in interval arithmetic.
    ARM 2, THE SHIPPED ABLATION. eFrodoKEM is FrodoKEM with lensalt = 0 (Table 2, and Remark 1:
    'If salt is removed from the SFO-perp-prime transform in Figure 5, the transform becomes
    equivalent to the FO-perp-prime transform ... used in our eFrodoKEM variant'). The salt
    therefore enters the residue through exactly one term, and the two arms' crossing surfaces
    must differ by a computable amount or the pipeline is not seeing the salt.
    (D) THE FALSIFIABLE COMPARISON, RESTATED SO IT CAN COME OUT NEGATIVE. Two explanations are
    discriminated. E-SALT: the 2025 salt moved the binding multi-target term out of the residue,
    so the salted arm's crossing surface lies at least 10 bits (in log2 of n_u * n_c^2) beyond
    the salt-free arm's at every parameter set, and the residual multi-target growth on the
    salted arm is carried by q_RO * delta(n_u) alone. E-DELTA: the salt is irrelevant to where
    the residue first binds because the correctness term q_RO * delta(n_u) overtakes the
    message-space term at a smaller n_u than the salt-collision term ever mattered at, in which
    case the salt bought multi-CIPHERTEXT security and bought nothing multi-USER, and the
    deliverable names the correctness term as the multi-user binding term. FV-2 gives this
    session's hand prediction for both at Frodo-640; either can be wrong.
    (E) WHY THIS IS NOT THE PUBLISHED RESULT. Glabush-Hoevelmanns-Stebila (eprint 2025/343 - NOT
    2025/1861, which is the FrodoKEM paper; the earlier revision of this record had the wrong
    identifier) prove the SFO transform's multi-target bound and give two evaluated numbers, and
    those are used here as an external calibration target rather than rediscovered. What they do
    not do is evaluate FrodoKEM's OWN composed bound Eq. (3) - which carries the Renyi factor,
    the distribution switch and the FrodoKEM-specific constants - at multi-target counts, for
    both variants, at all three parameter sets. Neither does the FrodoKEM paper: Table 4's caption
    reads 'Single-user, single-ciphertext security estimates'.
    (F) WHAT IS NOT CLAIMED. No attack. No break. No adversary. A horizon is a statement about
    what an inequality can certify; a bound going vacuous is NOT a scheme becoming insecure. No
    LWE hardness is estimated: the computational term is deleted, which is the strongest possible
    assumption in FrodoKEM's favour. The failure rate delta and the Renyi divergence D_alpha are
    SWEPT SYMBOLS whose published values this record neither asserts correct nor asserts wrong
    (GOAL-FRODO-002.non_duplication[0] assigns both to GOAL-FRODO-001).
  mechanism: >-
    STAGE 0 (GATE, CORRECTED 2026-08-24 - see `baseline_gate`): the transcription of Eq. (3) and
    Eq. (7) from eprint 2025/1861 with every term tagged T1/T2/T3 by the three-class taxonomy of
    H2 AT TRANSCRIPTION TIME, and the gate evaluated against Table 4's IND-CCA sec. (ROM) column,
    NOT against 149.8 / 212.6 / 266.8. STAGE 1: delete every T1 (computational) term. Because
    Eq. (3) is a bracketed sum multiplied by a strictly positive factor plus a further sum of
    non-negative terms, deleting non-negative terms from either group lower-bounds the
    right-hand side, so the residue's horizon is a valid UPPER bound on the certifiable region;
    the direction matters and is proved in the proof_obligations rather than assumed.
    STAGE 2 (REPLACES THE OLD RAY SWEEP): fix the paper's own normalization - divide by t, use
    q_RO < t * 2^-18 and t >= 2^32 exactly as Section C.1.1 does - and then sweep the TARGET
    COUNTS (n_u, n_c) over a declared ladder, which is the only direction in which the ratio of
    residue to computational term actually moves. Report the residue and the computational term
    separately at every point so the binding-term label is always available.
    STAGE 3: locate the crossing surface in (n_u, n_c) at each of FrodoKEM-640/976/1344 and each
    eFrodoKEM variant, in exact rational or certified interval arithmetic, at three declared
    thresholds (one bit above the single-target value; equality with the single-target residue;
    and the Adv/t = 2^-b level matching the published Table 4 figure for that set).
    STAGE 4: name the BINDING TERM at each point on the surface and report it as a label.
    STAGE 5: sensitivity - d(crossing)/d(lensalt), d(crossing)/d(lenmu), d(crossing)/d(log
    delta), and separately the effect of replacing delta(n_u) by its published upper bound
    delta(1) * n_u versus treating delta(n_u) as a swept symbol, since the paper itself flags
    that bound as loose ('practically tight ... whenever delta(n_u) << delta(1) * n_u').
    STAGE 6: controls, below, all in the same invocation.
  novelty_status: unverified
  baseline_gate: >-
    THE GATE THAT EVERY RECORD IN THIS LANE INHERITS, CORRECTED 2026-08-24 (red-team BLOCKING 1).
    THE OLD GATE WAS WRONG AND IS WITHDRAWN: '149.8 / 212.6 / 266.8' are NOT outputs of any
    FO/SFO bound and cannot be reproduced from one. Read from eprint 2025/1861 Table 7 ('Attack
    costs (log2) against FrodoKEM, beyond-core-SVP methodology'): 149.8 is Frodo-640 under
    BDD/C-LSF-Sieve/BKZ, 212.6 is Frodo-976 under BDD/C-LSF-Sieve/BKZ, 266.8 is Frodo-1344 under
    Dual-sieve-FFT/C-LSF-Sieve/PBKZ. They are raw LWE attack costs, taken BEFORE Theorem 3's
    reduction discount and BEFORE the transform is charged. Table 4's caption states the first
    step explicitly: 'IND-CPA numbers are obtained by taking the cheapest corresponding attacks
    in Section 7.2 and subtracting log(nbar + mbar) = 4 bits lost due to Theorem 3.' Demanding
    that an FO bound reproduce 149.8 would emit a spurious ~10-bit 'discrepancy' that is a
    category error.
    THE CORRECTED GATE: reproduce eprint 2025/1861 TABLE 4's 'IND-CCA sec. (ROM)' column -
    B = 140 / 204 / 258 and C = 130 / 192 / 246 - from Eq. (3)/(7) at the constants Section C.1.1
    fixes, together with that section's own stated endpoint Adv/t <= 2^-130.876 for Frodo-640
    under column C. The constants, all read verbatim: |M| = 2^lenmu with lenmu = 128/192/256
    (Table 1); delta(1) < 2^-138.7 / 2^-199.6 / 2^-252.5 (Table 4, 'target failure rate');
    s = 20544 at Frodo-640 (Section C.1.1: 's = 2 x (8 + 8) x 640 + 64'); D_alpha <= 0.0000324 at
    alpha = 200 for chi_Frodo-640, 0.140e-4 at alpha = 500 for chi_Frodo-976, 0.264e-4 at
    alpha = 1000 for chi_Frodo-1344 (Table 3); q_RO < t * 2^-18; t >= 2^32; Adv_CPA(B)/t <=
    2^-134.5 at Frodo-640 under column C.
    A LANE-LEVEL CONSEQUENCE THE COORDINATOR MUST BE TOLD (this record does not act on it):
    GOAL-FRODO-002.completion_criteria[1] says 'the published bit-security figure' without
    saying which, and the two candidates differ by about 9 bits at level 1 (149.8 raw LWE ->
    145.8 after Theorem 3's 4 bits -> ~140.9 after the transform -> Table 4's 140). The lane's
    headline question - does FrodoKEM charge the reduction? - is therefore ALREADY ANSWERED IN
    PRIMARY TEXT: it does, about 4 bits for the distribution/sample-count reduction and about 5
    more for the transform at Frodo-640 column B.
  forced_value_derivations:
    - id: FV-1
      question: >-
        Does the statistical residue of Eq. (7) bind before the computational term at the
        single-target point? (The old predictions[0] / falsification_conditions[0] headline.)
      status: FORCED - answered by arithmetic before any run; withdrawn as an estimand.
      derivation: >-
        Write F_P = exp(s * D_alpha)^(1 - 1/alpha). From Table 3 and Section C.1.1:
        F_640 = exp(20544 * 0.0000324)^0.995 = 1.9393 (log2 = 0.9555);
        F_976 = exp(31296 * 0.0000140)^0.998 = 1.5484 (log2 = 0.6307);
        F_1344 = exp(43072 * 0.0000264)^0.999 = 3.1142 (log2 = 1.6390).
        Normalizing Eq. (7) by t exactly as Section C.1.1 does, the STATISTICAL RESIDUE (every
        term containing no advantage symbol) at Frodo-640 is
        2 * (6 * 2^-18 / 2^128) * F + 2 * (2^-18 / 2^128) + 2 * 2^-18 * delta(1) * F +
        2 * 2^-32 * delta(1)
        = 2^-141.46 + 2^-145 + 2^-154.74 + 2^-169.7 = 2^-141.34 per unit t,
        and the COMPUTATIONAL term is 4 * F * (Adv_CPA/t) = 2^2.9555 * (Adv_CPA/t).
        Both are constants in t. Their RATIO therefore never moves along the paper's own ray, so
        'H(P) versus the category floor' cannot discriminate anything.
        At column C (Adv_CPA/t <= 2^-134.5) the computational term is 2^-131.54, ten bits above
        the residue: the assumption binds. At column B (Adv_CPA/t <= 2^-145.8, from Table 7's
        149.8 minus Theorem 3's 4 bits) it is 2^-142.84, one and a half bits BELOW the residue:
        the STATISTICAL RESIDUE BINDS. Same computation at 976: residue 2^-205.66 against
        computational 2^-205.97 (column B) - residue binds; at 1344: residue 2^-268.70 against
        computational 2^-259.16 (column B) - computational binds.
      consequence: >-
        (i) The old headline is withdrawn. (ii) A free structural finding is recorded instead:
        FrodoKEM's own level-1 and level-3 beyond-core-SVP IND-CCA figures are set by the
        statistical residue, not by the LWE term - which is the mechanism of claim (A), confirmed
        at two of six cells and refuted at four. (iii) The remaining estimand must be a quantity
        that MOVES, which is why the record is repointed onto (n_u, n_c) and lensalt.
      caveat: >-
        HAND-COMPUTED BY THE IDEA-GENERATOR ON 2026-08-24 FROM THE TRANSCRIBED CONSTANTS. NOT
        MACHINE-VERIFIED, NOT A RUN, AND NOT EVIDENCE. Summing the six cells, this evaluation
        reproduces the published Table 4 IND-CCA (ROM) floor exactly at 640-B (140.90 -> 140),
        976-B (204.81 -> 204), 976-C (192) and 1344-C (246), but is 0.66 bits TIGHTER than the
        paper at the two cells where the computational term binds hardest: 640-C gives 2^-131.53
        against the paper's own stated 2^-130.876, and 1344-B gives 259.16 against the published
        258. The unexplained residual is a factor of about 1.59 on the computational term only.
        RESOLVING THAT IS THE GATE'S FIRST DELIVERABLE and it has three admissible outcomes: an
        arithmetic error by this session, a rounding convention in the paper's evaluation, or a
        term mis-read by this session from a PDF text extraction. None of the three is assumed.
    - id: FV-2
      question: >-
        Where does the multi-target residue first bind, and does the salt move it? (The
        repointed estimand - this one is NOT forced and is what the run is for.)
      status: PREDICTED, NOT FORCED - both branches are reachable.
      derivation: >-
        Continuing FV-1's normalization at Frodo-640 with the single-target residue baseline
        2^-141.34 per unit t:
        the salt-collision term contributes 2 * 2^-32 * n_u * n_c * (n_c - 1) / (|M| * 2^lensalt)
        ~ n_u * n_c^2 * 2^-159 at lensalt = 0 (eFrodoKEM), reaching the baseline at
        n_u * n_c^2 = 2^17.7 - i.e. at the specification's own informative cap n_c < 2^8, at
        n_u ~ 3 public keys. At lensalt = 256 (FrodoKEM) the same term is 2^256 smaller and never
        binds anywhere in a physically statable range.
        the correctness term contributes 2 * 2^-18 * delta(n_u) * F, which under the paper's own
        delta(n_u) <= delta(1) * n_u is n_u * 2^-154.74, reaching the baseline at n_u = 2^13.4
        users - and this term is IDENTICAL in both variants.
      consequence: >-
        The two explanations of claim (D) are separated by a computable margin: E-SALT predicts
        the salt-free arm's crossing at log2(n_u n_c^2) ~ 17.7 and the salted arm's crossing
        governed only by the correctness term at n_u ~ 2^13.4, a separation this session
        hand-estimates at about 12 bits at Frodo-640; E-DELTA predicts the two arms cross within
        1 bit of each other because the correctness term dominates first in both. If the run
        returns the two arms EQUAL, the pipeline is not reading lensalt and the run is void
        (that is the NULL-5 ablation control, not a finding).
      caveat: >-
        HAND-COMPUTED, NOT MACHINE-VERIFIED, NOT A RUN. delta(n_u) <= delta(1) * n_u is the
        paper's cited upper bound [DHK+21] which the paper itself calls loose; H3 governs it and
        the run must report the crossing both under that bound and with delta(n_u) swept.
