    bottleneck: >-
      The step in which a concrete guarantee is read off the bound by comparing its right-hand
      side against a threshold. The bottleneck is that this step is always performed with the
      computational term present and at n_u = n_c = 1, so a statistical term that would bind on
      its own, or would bind at target counts the standard permits, is never visible as such.
