  falsification_conditions:
    - >-
      The salted and salt-free crossing surfaces coincide to within 1 bit at all three parameter
      sets AND the mutation control shows the pipeline does read lensalt. Then E-SALT is refuted
      and E-DELTA holds: the multi-target residue is governed by the correctness term, the salt
      bought multi-ciphertext security and bought nothing multi-user, and that is the finding.
      THIS IS A REPORTABLE RESULT, not a null run.
    - >-
      The crossing surface for both variants lies beyond any target count statable in the
      standardization surface. Then the statistical residue is not the binding constraint in the
      multi-target regime either, and the lane should redirect to the computational side. THIS IS
      A GOOD OUTCOME FOR FRODOKEM AND IS REPORTED AS A RESULT.
    - >-
      NULL-1 fails to reproduce eprint 2025/343's own evaluation of Eq. (1) and Eq. (2) within
      the declared tolerance. No other number in the run is reportable; the deliverable becomes
      the discrepancy and its cause.
    - >-
      THE MUTATION CONTROL FIRES: perturbing the binding term's leading coefficient by 2^k does
      not move the crossing by k bits. Then the pipeline is reporting a function of its own input
      parameters rather than a property of the bound, and no crossing is reportable.
      (THIS REPLACES THE OLD FALSIFICATION CONDITION 'H equals a length parameter minus one at
      every parameter set', WHICH IS DELETED AS WRONG: at the paper's own ray the single-term
      horizon is lenmu + 18 - 1 - log2 c, and landing near a length parameter is the CORRECT
      answer for a genuinely single-term-dominated residue, not an artifact. The old rule
      returned the same label for a property of the object and for a defect of the apparatus and
      had no NEITHER branch; the mutation control supplies one - 'moves by k' is the object,
      'does not move' is the apparatus, 'moves by something else' is an instrument bug reported
      with no verdict issued.)
    - >-
      Some residue term is non-monotone in n_u or n_c along a declared ray - the live candidate
      being a swept delta(n_u) that is not monotone in n_u. Then the crossing is a set, not a
      surface, and the record reports the set and withdraws the surface framing.
    - >-
      THE ABLATION IS INVALID, tested as a property of the composition rather than of its
      syntax: some term to be deleted is negative on the evaluated region, or the composition is
      not monotone non-decreasing in each deleted term, or the multiplicative factor
      exp(s D_alpha)^(1-1/alpha) is not bounded below by a positive constant there. Then the
      record stops without producing a crossing.
      (THIS REPLACES 'The transcribed bound is not a sum of non-negative terms', WHICH IS DELETED
      AS WRONG: Eq. (3) is NOT a flat sum - it is a bracketed sum MULTIPLIED by
      exp(s D_alpha(P||Q))^(1-1/alpha) plus a further sum - and the old rule would have fired on
      the true bound even though the ablation remains valid, since deleting a non-negative term
      inside a bracket multiplied by a factor >= 1 still lower-bounds the right-hand side.)
    - >-
      The gate's seven residuals cannot be adjudicated - the pipeline reproduces neither Table 4
      nor this session's hand values. Then no swept result is reportable
      (RQ-FRODO-a2dbe2.constraints[4]) and the discrepancy is the deliverable.
    - >-
      DISCHARGED 2026-08-24, RECORDED RATHER THAN DELETED: the previous falsifier 'primary text
      shows the ephemeral variants DO carry a salt, refuting the recalled premise' is now
      settled in the opposite direction and is no longer a live falsifier. eprint 2025/1861
      Table 2 gives lensalt = 0 for all three eFrodoKEM sets and Remark 1 states the salt-free
      transform is the FO-perp-prime transform 'used in our eFrodoKEM variant'. The eFrodoKEM arm
      is UN-VOIDED.
  confounders:
    - >-
      Threshold convention. 'One bit above the single-target value' is a convention; reporting
      the surface at three declared thresholds rather than one is the mitigation, and no single
      threshold is privileged in the headline.
    - >-
      Normalization choice. The per-unit-t normalization with q_RO < t 2^-18 and t >= 2^32 is the
      PAPER'S, not this record's, and every number inherits it. A reader using a different
      convention gets different numbers; the convention is quoted in every reported figure.
    - >-
      Identifiability: the salt-collision term and the correctness term can produce the same
      crossing section with opposite remedies. The label requirement is the mitigation and it is
      mandatory. FV-2 shows these two are the actual competitors, so this is live.
    - >-
      The delta(n_u) <= delta(1) n_u bound is the paper's own and the paper calls it loose. A
      crossing driven entirely by it is a statement about that bound, not about FrodoKEM, and
      must be labelled so. This is also where the lane boundary with GOAL-FRODO-001 is thinnest.
    - >-
      The T3 factor exp(s D_alpha)^(1-1/alpha) is worth 0.96 / 0.63 / 1.64 bits at the three
      parameter sets and its inputs (s, D_alpha, alpha) belong to GOAL-FRODO-001. It is carried
      as a swept symbol; substituting Table 3's values is a declared evaluation point, not an
      assertion that they are correct.
    - >-
      Transcription error is unrecoverable downstream, and this pass adds a specific instance to
      guard: the primary text was read through a PDF TEXT EXTRACTION, in which table column
      alignment is exactly what corrupts silently. The gate re-derives Table 4 from Table 7 minus
      4 bits as an internal consistency check on the extraction itself.
    - >-
      SUPERSEDED CONFOUNDER, RECORDED: the previous entry reasoned that the identical published
      figures for FrodoKEM and eFrodoKEM might mean the figure is a lattice estimate the
      transform's loss was never subtracted from, and routed that to 'the comparison target must
      change'. IT WAS RIGHT ABOUT THE CAUSE AND WRONG ABOUT THE REMEDY: 149.8/212.6/266.8 ARE raw
      lattice estimates (Table 7), the transform's loss IS charged separately (Table 4), and the
      correct remedy was a pre-run derivation, not a caveat.
  interpretation_limits:
    - >-
      A bound that certifies little is NOT an insecure scheme. The proof saying nothing beyond a
      crossing is compatible with the scheme being perfectly secure there, and this record makes
      no claim in either direction. RQ-FRODO-a2dbe2.constraints[3] binds absolutely.
    - >-
      No attacker, no attack cost, no query strategy and no adversary appear anywhere. The
      published attack of eprint 2025/343 is cited, not reproduced and not extended.
    - >-
      No LWE hardness is estimated, consumed or implied: the computational term is set to zero,
      which is the strongest possible assumption in FrodoKEM's favour.
    - >-
      NOTHING HERE IS A STATEMENT ABOUT REACHABLE DEPLOYMENTS. A crossing at n_u = 2^13 users is
      a property of an inequality, not a claim that any deployment has 2^13 users or that
      anything happens if it does. Reachability is IDEA-20260821-c05d5f's and c2242b's question.
    - >-
      Everything is scoped to the transcribed bound, the paper's own normalization, the declared
      thresholds, the parameter sets evaluated, and the document revisions retrieved.
    - >-
      Claim tier SPLIT: crypto tier for the arithmetic (a stated inequality with stated terms
      either crosses a threshold at a computed target count or does not, at the real parameter
      sets); nothing above toy tier for any reading about FrodoKEM's actual security.
    - >-
      FV-1 and FV-2 ARE HAND ARITHMETIC BY THE IDEA-GENERATOR, NOT RUNS AND NOT EVIDENCE. They
      are recorded as pre-run predictions so that the run can refute them; no downstream record
      may cite them as measurements.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Residue monotonicity in the target counts.) FOR EACH parameter set P and variant V, the
        statistical residue residue_{P,V}(q_RO, n_u, n_c) is non-decreasing in each of q_RO, n_u
        and n_c over the evaluated region, so the crossing locus is the boundary of a
        downward-closed set and is locatable by bisection along any ray.
      rigorous_support: >-
        The rigorous half is now checkable against the real inequality rather than against a
        family: every T2 term of Eq. (3) has one of the forms (query count) x (correctness
        error), (count)/(space size), or n_u n_c(n_c - 1)/(|M| 2^lensalt) - all non-decreasing in
        the query and target counts by inspection - and a finite sum of non-decreasing functions
        multiplied by a constant factor >= 1 is non-decreasing. The classical analogue is that
        elementary fact. THE HEURISTIC HALF is that delta(n_u), which is a FUNCTION of n_u and
        not a constant, is itself non-decreasing in n_u; the paper bounds it above by delta(1) n_u
        but states no monotonicity, and the QROM arm's 10(q + q_D + 1)^2 delta(n_u) term is where
        this is most likely to matter.
      validation_plan: >-
        Check monotonicity term by term symbolically after transcription, and numerically at the
        endpoints plus at least five interior points of every ray in (n_u, n_c), at every
        parameter set, in certified interval arithmetic. Report any non-monotone term by name
        with the range over which it decreases. Predicted outcome if H1 holds: zero non-monotone
        terms and a bisection converging to the same crossing from both sides at the declared
        precision. Tail check: at the largest (n_u, n_c) evaluated the residue must exceed the
        threshold; a residue that plateaus below it means no crossing exists in range and 'no
        crossing in range' is reported rather than an extrapolated value. Sampled parameters
        recorded: rays, interior points, precision, parameter sets, variants.
    - id: H2
      statement: >-
        (Tag exhaustiveness, THREE classes - CORRECTED 2026-08-24.) FOR ALL terms and factors of
        the transcribed bound, each is exactly one of: T1, containing a computational assumption
        advantage symbol; T2, bounded by a function of the query, target and length parameters
        alone; or T3, a MODEL OR DIVERGENCE FACTOR containing neither - specifically a
        multiplicative factor determined by the distribution switch, of which
        exp(s * D_alpha(P||Q))^(1 - 1/alpha) is the instance appearing in Eq. (3).
      rigorous_support: >-
        THE PREVIOUS TWO-CLASS VERSION OF THIS ASSUMPTION IS FALSIFIED BY THE ACTUAL BOUND AND IS
        WITHDRAWN. Eq. (3) is not a sum of terms: it is a bracketed sum MULTIPLIED by
        exp(s D_alpha(P||Q))^(1-1/alpha), plus a further sum. That factor is a Renyi divergence
        between chi_Frodo and the rounded Gaussian - at Frodo-640, s = 20544, D_alpha <= 0.0000324
        at alpha = 200, worth a factor of about 1.94 - and it contains no advantage symbol and no
        query, target or length parameter. The rigorous half of the corrected assumption is the
        structure of the proof as the paper describes it: three steps, [GHS25, Thm 23] (a
        reduction), a distribution substitution (a divergence factor), and [GHS25, Thm 24] (a
        reduction), so exactly three sources of contributions. THE HEURISTIC HALF is that the
        PRINTED bound preserves that trichotomy: printed bounds fold hops together and a folded
        term can be of mixed type.
      validation_plan: >-
        Cross-check the tagging against the three named proof steps rather than against the
        displayed inequality: for every displayed term and factor, name the step it comes from
        and its type, and report any whose provenance spans two. Report the count of mixed-type
        items; if any exists, the ablation must delete only its T1 part or the record must stop.
        The T3 factor is carried SYMBOLICALLY and the residue is reported as a function of the
        swept D_alpha, so that the lane boundary with GOAL-FRODO-001 (which owns whether the
        Renyi divergence reproduces) holds even though the residue's numeric value needs it.
        TRANSFER ASSUMPTION: the ROM chain's trichotomy is not assumed to hold in the QROM arm
        (Theorem 2), where a one-way-to-hiding step mixes a distance with a query factor and a
        gamma-spreadness term appears; the QROM arm is tagged separately or declared out of scope.
    - id: H3
      statement: >-
        (Multi-user correctness scaling.) FOR ALL n_u in the evaluated range, delta(n_u) <=
        delta(1) * n_u, and the crossing computed under that substitution is an upper bound on
        the crossing computed with the true delta(n_u).
      rigorous_support: >-
        The rigorous half is the cited bound itself: eprint 2025/1861 Section C.1.2 states 'The
        gap is linear in n_u as delta(n_u) <= delta(1) n_u [DHK+21]'. THE HEURISTIC HALF is that
        this bound is TIGHT ENOUGH TO BUILD A CROSSING ON, which the same sentence explicitly
        doubts: it is 'practically tight ... whenever delta(n_u) << delta(1) n_u; as mentioned in
        Section 2.2, there is evidence for the latter for KEMs built from lattice-based PKE'.
        Read carefully, the paper is saying the LINEAR BOUND IS LOOSE in exactly the regime this
        record evaluates.
      validation_plan: >-
        Report every n_u-dependent crossing TWICE: once under delta(n_u) = delta(1) n_u and once
        with delta(n_u) swept over a declared ladder spanning delta(1) to delta(1) n_u, and
        report the width of the resulting band as the headline uncertainty on the multi-user arm.
        Comparison target: [DHK+21, Table 1] as cited by the paper, which the executor must
        retrieve and file; if it cannot be retrieved, the band is reported without a comparison
        target and the arm is labelled conditional. This record does NOT recompute delta for any
        n_u - that is GOAL-FRODO-001's - and the sweep is over a symbol, not an estimate.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED and no algorithm against any scheme is proposed. The
      computation is O(terms x log(range) x grid points x parameter sets) exact-rational
      evaluations - milliseconds, with the whole battery including all controls under an hour of
      single-core compute. What the record produces is a PROOF-SIDE quantity: the target counts
      beyond which the transcribed inequality certifies no more than a declared threshold,
      independent of any hardness result.
    memory_exponent: >-
      No attack memory exponent. The computation is memory-free; artifacts are a table of
      crossings and labels, kilobytes.
    best_known: >-
      Externally, eprint 2025/343 supplies the only published evaluated instances of this
      quantity located this session, and they are now read rather than recalled: their Eq. (1)
      and Eq. (2) evaluated at n_c = q_RO = 2^64, |M| = 2^128, giving 'close to 1' and 'around
      2^-62'. That result DOMINATES this record on the generic SFO/FO comparison at that point -
      it is a proof plus an evaluation, this is only an evaluation - and it is used as the
      calibration target rather than competed with. For FrodoKEM's OWN composed Eq. (3) at
      multi-target counts the incumbent is Section C.1.2's order-of expressions, which state no
      number. Internally there is no incumbent: no record in this repository evaluates any
      ablated bound.
    hidden_overhead: >-
      Not asymptotic but EPISTEMIC, and the list is shorter than it was. First, everything is
      downstream of a transcription that has now been read but not yet frozen, and read through a
      PDF text extraction whose table column alignment is a real risk. Second, the crossing is a
      boundary in a two-dimensional target-count space and its scalar sections depend on the ray.
      Third, the multi-user arm rests on H3, a bound the paper itself calls loose. Fourth, FV-1
      and FV-2 are hand arithmetic. All four are disclosed rather than absorbed. WHAT IS NO
      LONGER HIDDEN: the eFrodoKEM salt-deletion premise, which was recalled and is now read.
    tradeoff_note: >-
      No time-memory tradeoff exists or is relevant: there is no search. The only tradeoff is
      between the density of the (n_u, n_c) ladder and the resolution of the reported crossing,
      and it is reported directly as the bisection precision.
