      verified_by: null
    - ref: 'Hofheinz, Hövelmanns, Kiltz, A Modular Analysis of the Fujisaki-Okamoto Transformation, TCC 2017 (eprint 2017/604)'
      provenance: recalled
      claim: >-
        The FO bound family in which the IND-CCA advantage is bounded by a sum containing an
