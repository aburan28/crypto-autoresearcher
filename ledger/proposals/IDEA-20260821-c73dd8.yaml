  assumptions:
    - >-
      The transcription tags every term T1 (computational), T2 (query/target/length) or T3
      (model/divergence factor) mechanically, and the tagging is frozen before evaluation.
    - >-
      Eq. (3) composes non-negative terms by addition and by multiplication by a factor bounded
      below by 1, so deleting terms is a valid one-sided relaxation. (Now checked against the
      real inequality rather than assumed of a family; the check is proof_obligations[1].)
    - >-
      The comparison targets - Table 4's IND-CCA (ROM) figures - are taken as printed and are not
      re-derived except by the gate, whose purpose is exactly to re-derive them once.
    - >-
      The failure rate delta and the Renyi divergence D_alpha are swept symbols whose published
      values are neither asserted correct nor asserted wrong; both belong to GOAL-FRODO-001 by
      GOAL-FRODO-002.non_duplication[0], and the residue is reported AS A FUNCTION of the swept
      D_alpha symbol so the lane boundary holds even though the residue's numeric value needs it.
    - >-
      All three parameter sets and both variants are evaluated, or the ones omitted are named.
