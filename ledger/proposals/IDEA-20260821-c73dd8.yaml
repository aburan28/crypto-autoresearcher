      verified_by: idea-generator@2026-08-21
    - ref: 'https://eprint.iacr.org/2025/1861 (FrodoKEM: A CCA-Secure LWE KEM; Glabush, Longa, Naehrig, Peikert, Stebila, Virdia; 2025-10-08; IACR CiC 2(3):25)'
      provenance: retrieved
      claim: >-
        Abstract read: single-target IND-CCA via an FO variant on FrodoPKE, and tight
        multi-target security via the new Salted Fujisaki-Okamoto transform 'without increasing
        the FrodoPKE message length'. That last clause matters here: the message space is NOT
        enlarged, so a message-space term of the form q/2^{len_mu} remains in the bound and the
