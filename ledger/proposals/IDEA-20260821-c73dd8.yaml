        record's binding-term label is designed to detect. PDF fetch failed; no theorem read.
      verified_by: idea-generator@2026-08-21
    - ref: 'WebSearch result summary, 2026-08-21, on FrodoKEM standard/ephemeral variants'
      provenance: recalled
      claim: >-
        A search summary stated that 'the ephemeral instantiations of FrodoKEM discard the use of
