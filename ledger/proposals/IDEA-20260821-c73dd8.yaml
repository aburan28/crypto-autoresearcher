  assumptions:
    - >-
      The transcription tags every term T1 (computational), T2 (query/target/length) or T3
      (model/divergence factor) mechanically AND RECORDS EACH TERM'S COEFFICIENT, and the tagging
      is frozen before evaluation.
    - >-
      Eq. (3) composes non-negative terms by addition and by multiplication by a factor bounded
      below by 1, so deleting terms is a valid one-sided relaxation. (Checked against the real
      inequality rather than assumed of a family; the check is proof_obligations[1].)
    - >-
      The comparison targets - Table 4's IND-CCA (ROM) figures - are taken as printed and are not
      re-derived except by the gate, whose purpose is exactly to re-derive them once. Table 4's
      IND-CPA column is used under BOTH the printed-integer and the unrounded Table-7-minus-4
      conventions, because FV-1 shows one cell's verdict depends on which is used.
    - >-
      The failure rate delta and the Renyi divergence D_alpha are swept symbols whose published
      values are neither asserted correct nor asserted wrong; both belong to GOAL-FRODO-001 by
      GOAL-FRODO-002.non_duplication[0], and the residue is reported AS A FUNCTION of the swept
      D_alpha symbol so the lane boundary holds even though the residue's numeric value needs it.
    - >-
      All three parameter sets and both variants are evaluated, or the ones omitted are named.
  proof_search_map:
    bottleneck: >-
      The step in which a concrete guarantee is read off the bound by comparing its right-hand
      side against a threshold. The bottleneck is that this step is always performed with the
      computational term present and at n_u = n_c = 1, so a statistical term that would bind on
      its own, or would bind at target counts the standard permits, is never visible as such.
    baseline_embedding:
      parameter_slice: >-
        n_u = n_c = 1. There the repointed evaluation must collapse exactly onto Section C.1.1's
        worked example and onto Table 4's IND-CCA (ROM) column - the paper's own single-target
        arithmetic, term for term, including the final Adv/t <= 2^-130.876. That is a genuine
        external baseline and it is stronger than any internal fixture.
      reproduction_check: >-
        Frozen fixture holding: Eq. (3) and Eq. (7) as transcribed WITH COEFFICIENTS, the Section
        C.1.1 constants, Table 4's six IND-CCA cells, the paper's stated endpoint 2^-130.876,
        this session's pre-run hand values from FV-1 (per-term logs, residues 2^-141.40 /
        2^-205.71 / 2^-267.23, totals 140.95 / 131.54 / 204.83 / 192.37 / 259.16 / 246.36), the
        declared tolerance, and the pipeline's output. THE PRE-RUN HAND VALUES ARE PART OF THE
        FIXTURE PRECISELY SO THAT THE TWO DISAGREEMENTS (0.67 bits at 640-C, up to 1.16 bits at
        1344-B) ARE ADJUDICATED RATHER THAN QUIETLY ABSORBED. Second external fixture: eprint
        2025/343 Eq. (1) and Eq. (2) at their own evaluated point (NULL-1).
    observation_collision:
      observable: >-
        The crossing surface in (n_u, n_c), and its scalar sections.
      distinct_preimage_search: >-
        The collision is easy to construct and is a genuine falsifier of identifiability: a
        residue binding through n_u n_c^2/(|M| 2^lensalt) and one binding through
        q_RO delta(n_u) can have IDENTICAL crossing sections in n_u, with OPPOSITE remedies
        (lengthen the salt versus lower the failure rate). FV-2 shows these two are the actual
        competitors at Frodo-640, and FV-1 shows the correctness term already dominates at
        Frodo-1344 even at n_u = 1, which makes the collision live rather than hypothetical.
        Therefore THE SURFACE MUST ALWAYS BE REPORTED WITH ITS BINDING-TERM LABEL, and a bare
        crossing is not a permitted deliverable. A second collision, with a derived detector:
        two parameter sets whose sections coincide because both are reporting
        lenmu + 18 - 1 - log2 c for the same lenmu; NULL-4's mutation control on c separates that
        from a real answer.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A problem-specific resource measure - the residue and its crossing surface - realized
          by a specialization (set all T1 terms to zero), with charges added only over the
          proved-disjoint block of T2 terms and the T3 factor carried symbolically.
        predicted_gain: >-
          Converts a five-dimensional sweep into one surface plus one label per parameter set,
          computable in milliseconds, and makes the answer independent of the lattice lane. No
          attack exponent is claimed; the gain is decidability at negligible cost.
      - transform: observable_fiber
        proposed_object: >-
          Hold the crossing fixed and vary which term binds, exhibiting the fiber and the
          intrinsic invariant (the binding-term label) that separates its members.
        predicted_gain: >-
          Turns the identifiability failure named above from a hidden defect into a reported
          coordinate.
    quantifier_order: >-
      FOR EACH parameter set P and variant V, EXISTS a set S(P,V) in the (n_u, n_c) quadrant such
      that FOR ALL (n_u, n_c) outside S(P,V), residue_{P,V}(n_u, n_c) exceeds the declared
      threshold, and hence the transcribed bound certifies no more than that threshold at those
      target counts REGARDLESS of the computational term. The existential over S is uniform in
      the adversary - there is no adversary in the statement at all - which is why the result is
      a statement about the inequality and cannot be read as one about an attacker. The
      normalization (divide by t, q_RO < t 2^-18, t >= 2^32) is the paper's own and is quoted as
      such; a statement under a different normalization is a different statement and must be
      labelled.
    method_ceiling:
      strongest_certifiable_claim: >-
        'The transcribed bound at parameter set P and variant V, under the paper's own
        normalization, certifies no more than threshold theta at target counts outside S(P,V),
        with term T binding, independently of any hardness assumption.' The method can NEVER
        certify that FrodoKEM is insecure at those counts, that an attack exists, that the bound
        is the best available (a different proof may have a different residue), or anything about
        deployments' reachable target counts.
      nearby_object_control: >-
        The SALTED FrodoKEM bound versus the SALT-FREE eFrodoKEM bound at the same parameter set
        - known from primary text to differ in exactly one transcribed parameter (lensalt =
        256/384/512 versus 0, Table 2; Remark 1 confirms the transforms are otherwise the same
        object). This is the closest possible pair, it is shipped inside one specification, and
        the hoped-for conclusion must behave differently on it. It is NULL-5.
    proof_obligations:
      - claim: >-
          Every term is tagged T1/T2/T3 before evaluation, mechanically, with its coefficient
          recorded.
        responsibility: interface
      - claim: >-
          Eq. (3) is a composition of non-negative terms under addition and under multiplication
          by exp(s D_alpha)^(1-1/alpha) >= 1, so the ablation is a valid one-sided relaxation.
        responsibility: correctness
      - claim: The residue is monotone non-decreasing in each of q_RO, n_u, n_c on the evaluated region.
        responsibility: correctness
      - claim: >-
          The pipeline reproduces Table 4's IND-CCA (ROM) column and Section C.1.1's stated
          endpoint 2^-130.876 within the declared tolerance, under both rounding conventions, and
          adjudicates the two pre-run disagreements recorded in FV-1.
        responsibility: baseline
      - claim: The pipeline reproduces eprint 2025/343's own evaluation of its Eq. (1) and Eq. (2).
        responsibility: baseline
      - claim: The crossing surface is computed in exact rational or certified interval arithmetic.
        responsibility: correctness
      - claim: No crossing is reported without its binding-term label.
        responsibility: interface
      - claim: No crossing separation is reported without the ray along which it was measured.
        responsibility: interface
      - claim: No security reading of a threshold crossing appears anywhere in the deliverable.
        responsibility: scope
  predictions:
    - metric: >-
        signed residual, in bits, between the pipeline's evaluation of Eq. (7) and each of the
        six Table 4 IND-CCA (ROM) cells under each of the two IND-CPA rounding conventions, plus
        the residual against the paper's stated Adv/t <= 2^-130.876 (the corrected gate)
      direction: different
      minimum_effect: >-
        report all thirteen signed residuals. This session's pre-run hand values under the
        unrounded convention are 140.95, 131.54, 204.83, 192.37, 259.16 and 246.36: four cells
        floor to the published figure, 640-C sits 0.67 bits above the paper's own 130.876, and
        1344-B floors to 259 where Table 4 prints 258. A run that reproduces all six within 0.05
        bits AND closes the two gaps refutes this session's hand arithmetic and is the cleanest
        possible outcome; a run that reproduces the two gaps makes them a real question about the
        published evaluation and the deliverable becomes their cause
    - metric: >-
        crossing surface in (n_u, n_c): the locus at which the multi-target statistical terms
        raise the per-unit-t bound one bit above its single-target value, per parameter set, per
        variant, with binding-term label
      direction: different
      minimum_effect: >-
        report the surface with intervals. FV-2's pre-run hand prediction at Frodo-640 is
        log2(n_u n_c^2) = 18.60 for eFrodoKEM (salt-collision term binding) and n_u = 2^13.35 for
        FrodoKEM (correctness term binding), with the n_c-only crossing at n_c = 2^16.65 in both
        variants; a surface disagreeing with any of these by more than 1 bit falsifies FV-2 and is
        reported as such
    - metric: >-
        separation, in bits of log2(n_u), between the salted and salt-free crossing surfaces at
        the same parameter set ALONG THE DECLARED RAY n_c = 2^8 (the shipped ablation, NULL-5)
      direction: higher
      minimum_effect: >-
        DECISION RULE WITH AN EXPLICIT INDETERMINATE BAND, set from FV-2 rather than from taste.
        FV-2 predicts about 10.75 bits under E-SALT and under 1 bit under E-DELTA at Frodo-640.
        A separation of 5 bits or more supports E-SALT; 1 bit or less supports E-DELTA; anything
        between 1 and 5 bits is INDETERMINATE and is reported as such with no verdict. The
        previously declared 10-bit threshold is WITHDRAWN because the corrected E-SALT prediction
        clears it by only 0.75 bits, which is narrower than the H3 band, so that threshold would
        have been decided by the looseness of delta(n_u) <= delta(1) n_u rather than by the salt.
        EXACT equality of the two arms voids the run because it means lensalt is not being read
        at all
    - metric: >-
        NULL-1 agreement with eprint 2025/343's own evaluation of Eq. (1) and Eq. (2) at
        n_c = q_RO = 2^64, |M| = 2^128
      direction: different
      minimum_effect: >-
        within a tolerance in bits declared before the run; disagreement voids every other number
        in the run
    - metric: >-
        d(crossing)/d(lensalt), d(crossing)/d(lenmu), d(crossing)/d(log10 delta), by finite
        differences on the same code path
      direction: different
      minimum_effect: >-
        report all three with intervals; a lensalt derivative of exactly zero on the salted arm
        means the salt does not enter the residue at all and is a finding
    - metric: >-
        the effect of replacing delta(n_u) by its published upper bound delta(1) * n_u versus
        sweeping delta(n_u), on the crossing surface's n_u section
      direction: different
      minimum_effect: >-
        report both curves; the paper itself calls the linear bound loose, so a crossing that
        depends on it entirely must be reported as conditional on H3 and not as a property of
        the scheme
    - metric: NULL-2 crossing on a constant residue
      direction: different
      minimum_effect: must be 'none'; a finite value voids the run
  minimal_test:
    design: >-
      STILL THE CHEAPEST VALID DISCRIMINATOR IN THIS LANE, and it fits in well under an hour of
      single-core compute once the transcription exists. Implement residue_{P,V}(q_RO, n_u, n_c)
      directly from the transcribed, coefficient-annotated and tagged Eq. (3) in exact rational
      arithmetic (Python fractions) with an interval cross-check. (1) MACHINE-VERIFY FV-1 AND
      FV-2 FIRST, TERM BY TERM: they are hand arithmetic and the first job of the code is to
      confirm or refute them, including the two gate gaps at 640-C and 1344-B and the corrected
      1344 binding-term label. (2) Run the corrected gate against Table 4's IND-CCA (ROM) column
      and the paper's 2^-130.876 under both rounding conventions, and ABORT if the residuals
      cannot be adjudicated. (3) Run NULL-1 against eprint 2025/343's two evaluated points,
      NULL-2, NULL-3 and NULL-4's coefficient mutation. (4) Then locate the crossing surface over
      a declared (n_u, n_c) ladder for FrodoKEM-640/976/1344 and each eFrodoKEM variant, emitting
      the binding-term label at every point. (5) Run NULL-5 by diffing the two arms along the
      declared n_c = 2^8 ray. (6) Finally the sensitivity derivatives and the delta(n_u)
      treatment comparison. THIS DISCRIMINATES because E-SALT and E-DELTA predict separations of
      about 10.75 bits and under 1 bit respectively on the same transcribed inequality along the
      same declared ray, with a stated indeterminate band between them, and the computation that
      separates them does not touch the assumption at all. Compute: seconds to minutes.
      Implementation: a few hundred lines.
    controls:
      - >-
        NULL-1 external calibration against eprint 2025/343's own evaluation of its Eq. (1) and
        Eq. (2); a failure aborts everything downstream.
      - NULL-2 constant-residue null; must return 'no crossing'.
      - >-
        NULL-3 graded term-deletion and lensalt sensitivity, comparator named, thresholds derived
        in FV-1 (4.60 bits at Frodo-640) and declared before the run, at least three interior
        points, monotonicity reported.
      - >-
        NULL-4 forced-value derivations FV-1 and FV-2, done on paper before any code runs, plus
        the single-term calibration H = lenmu + 18 - 1 - log2 c with c = 12F + 1 = 24.27 at
        Frodo-640 (H = 140.40) and its coefficient mutation.
      - >-
        NULL-5 shipped-ablation control: salted versus salt-free arms differing only in lensalt;
        equal surfaces void the ephemeral arm.
      - >-
        MUTATION CONTROL, WHICH REPLACES THE OLD ECHO CHECK: perturb the binding term's leading
        coefficient c by 2^k and require the crossing to move by exactly k bits. This is what
        distinguishes 'the residue is genuinely single-term-dominated' from 'the pipeline is
        echoing a length parameter', and it can fail in both directions.
      - Corrected gating baseline reproduction of Table 4's IND-CCA (ROM) column (see baseline_gate).
      - >-
        Arithmetic control: every crossing computed twice, once in exact rationals and once in
        certified intervals, and the two must bracket each other.
    required_metrics:
      - the gate residuals, signed, against Table 4 under both conventions and against 2^-130.876
      - the per-term log2 table at n_u = n_c = 1 for all three parameter sets, with coefficients
      - crossing surface with binding-term label, per parameter set, per variant, per threshold
      - salted-minus-salt-free separation per parameter set, with the ray stated
      - NULL-1..NULL-5 outcomes against their pre-declared thresholds
      - the three sensitivity derivatives with intervals
      - the delta(n_u)-bound versus swept-delta comparison
      - the term tagging table (term, coefficient, T1/T2/T3, location in primary text)
  falsification_conditions:
    - >-
      The salted and salt-free crossing separations along the declared n_c = 2^8 ray are 1 bit or
      less at all three parameter sets AND the mutation control shows the pipeline does read
      lensalt. Then E-SALT is refuted and E-DELTA holds: the multi-target residue is governed by
      the correctness term, the salt bought multi-ciphertext security and bought nothing
      multi-user, and that is the finding. THIS IS A REPORTABLE RESULT, not a null run.
      (FV-1 already shows E-DELTA's regime is entered at Frodo-1344 even at n_u = 1, so this
      branch is live and not a formality.)
    - >-
      The crossing surface for both variants lies beyond any target count statable in the
      standardization surface. Then the statistical residue is not the binding constraint in the
      multi-target regime either, and the lane should redirect to the computational side. THIS IS
      A GOOD OUTCOME FOR FRODOKEM AND IS REPORTED AS A RESULT.
    - >-
      NULL-1 fails to reproduce eprint 2025/343's own evaluation of Eq. (1) and Eq. (2) within
      the declared tolerance. No other number in the run is reportable; the deliverable becomes
      the discrepancy and its cause.
    - >-
      THE MUTATION CONTROL FIRES: perturbing the binding term's leading coefficient by 2^k does
      not move the crossing by k bits. Then the pipeline is reporting a function of its own input
      parameters rather than a property of the bound, and no crossing is reportable.
      (THIS REPLACES THE OLD FALSIFICATION CONDITION 'H equals a length parameter minus one at
      every parameter set', WHICH IS DELETED AS WRONG: at the paper's own ray the single-term
      horizon is lenmu + 18 - 1 - log2 c, and landing near a length parameter is the CORRECT
      answer for a genuinely single-term-dominated residue, not an artifact. The old rule
      returned the same label for a property of the object and for a defect of the apparatus and
      had no NEITHER branch; the mutation control supplies one - 'moves by k' is the object,
      'does not move' is the apparatus, 'moves by something else' is an instrument bug reported
      with no verdict issued.)
    - >-
      Some residue term is non-monotone in n_u or n_c along a declared ray - the live candidate
      being a swept delta(n_u) that is not monotone in n_u. Then the crossing is a set, not a
      surface, and the record reports the set and withdraws the surface framing.
    - >-
      THE ABLATION IS INVALID, tested as a property of the composition rather than of its
      syntax: some term to be deleted is negative on the evaluated region, or the composition is
      not monotone non-decreasing in each deleted term, or the multiplicative factor
      exp(s D_alpha)^(1-1/alpha) is not bounded below by a positive constant there. Then the
      record stops without producing a crossing.
      (THIS REPLACES 'The transcribed bound is not a sum of non-negative terms', WHICH IS DELETED
      AS WRONG: Eq. (3) is NOT a flat sum - it is a bracketed sum MULTIPLIED by
      exp(s D_alpha(P||Q))^(1-1/alpha) plus a further sum - and the old rule would have fired on
      the true bound even though the ablation remains valid, since deleting a non-negative term
      inside a bracket multiplied by a factor >= 1 still lower-bounds the right-hand side.)
    - >-
      The gate's residuals cannot be adjudicated - the pipeline reproduces neither Table 4 under
      either convention nor this session's hand values. Then no swept result is reportable
      (RQ-FRODO-a2dbe2.constraints[4]) and the discrepancy is the deliverable.
    - >-
      DISCHARGED 2026-08-24, RECORDED RATHER THAN DELETED: the previous falsifier 'primary text
      shows the ephemeral variants DO carry a salt, refuting the recalled premise' is now
      settled in the opposite direction and is no longer a live falsifier. eprint 2025/1861
      Table 2 gives lensalt = 0 for all three eFrodoKEM sets and Remark 1 states the salt-free
      transform is the FO-perp-prime transform 'used in our eFrodoKEM variant'. The eFrodoKEM arm
      is UN-VOIDED.
  confounders:
    - >-
      Threshold convention. 'One bit above the single-target value' is a convention; reporting
      the surface at three declared thresholds rather than one is the mitigation, and no single
      threshold is privileged in the headline.
    - >-
      Normalization choice. The per-unit-t normalization with q_RO < t 2^-18 and t >= 2^32 is the
      PAPER'S, not this record's, and every number inherits it. A reader using a different
      convention gets different numbers; the convention is quoted in every reported figure.
    - >-
      ROUNDING CONVENTION ON THE IND-CPA INPUT, ADDED 2026-08-24 AND OUTCOME-CHANGING. Table 4
      prints IND-CPA as an integer while its own caption's recipe applied to Table 7 gives a
      fractional value 0.6-0.8 bits larger. FV-1 shows the 976-B binding-term verdict flips
      between the two. Every cell must be reported under both, and no headline may quote one
      without naming it.
    - >-
      Identifiability: the salt-collision term and the correctness term can produce the same
      crossing section with opposite remedies. The label requirement is the mitigation and it is
      mandatory. FV-2 shows these two are the actual competitors at Frodo-640 and FV-1 shows the
      correctness term already dominates at Frodo-1344, so this is live.
    - >-
      RAY DEPENDENCE OF THE SEPARATION, ADDED 2026-08-24. The salted/salt-free separation is not
      a scalar property of a parameter set: it depends on the ray in (n_u, n_c) along which it is
      measured, because the salt-collision term scales as n_u n_c^2 while the correctness term
      scales as n_u alone. Every separation must be reported with its ray, and predictions[2]
      fixes n_c = 2^8 as the declared one.
    - >-
      The delta(n_u) <= delta(1) n_u bound is the paper's own and the paper calls it loose. A
      crossing driven entirely by it is a statement about that bound, not about FrodoKEM, and
      must be labelled so. This is also where the lane boundary with GOAL-FRODO-001 is thinnest.
    - >-
      The T3 factor exp(s D_alpha)^(1-1/alpha) is worth 0.96 / 0.63 / 1.64 bits at the three
      parameter sets and its inputs (s, D_alpha, alpha) belong to GOAL-FRODO-001. It is carried
      as a swept symbol; substituting Table 3's values is a declared evaluation point, not an
      assertion that they are correct.
    - >-
      Transcription error is unrecoverable downstream, and TWO specific instances are now on
      record. First, the primary text was read through a PDF TEXT EXTRACTION, in which table
      column alignment is exactly what corrupts silently; the gate re-derives Table 4 from Table 7
      minus 4 bits as an internal consistency check on the extraction itself. Second, and
      demonstrated inside this record: the first repair pass mis-transcribed the COEFFICIENTS of
      the three trailing terms of Eq. (3) (giving them a 2 they do not have) and dropped one term
      at Frodo-1344, which shifted the 640 residue by 0.06 bits and the 1344 residue by 1.5 bits
      and changed the 1344 binding-term label. Coefficient capture is therefore a required field
      of the transcription, not an implementation detail.
    - >-
      SUPERSEDED CONFOUNDER, RECORDED: an earlier entry reasoned that the identical published
      figures for FrodoKEM and eFrodoKEM might mean the figure is a lattice estimate the
      transform's loss was never subtracted from, and routed that to 'the comparison target must
      change'. IT WAS RIGHT ABOUT THE CAUSE AND WRONG ABOUT THE REMEDY: 149.8/212.6/266.8 ARE raw
      lattice estimates (Table 7), the transform's loss IS charged separately (Table 4), and the
      correct remedy was a pre-run derivation, not a caveat.
  interpretation_limits:
    - >-
      A bound that certifies little is NOT an insecure scheme. The proof saying nothing beyond a
      crossing is compatible with the scheme being perfectly secure there, and this record makes
      no claim in either direction. RQ-FRODO-a2dbe2.constraints[3] binds absolutely.
    - >-
      No attacker, no attack cost, no query strategy and no adversary appear anywhere. The
      published attack of eprint 2025/343 is cited, not reproduced and not extended.
    - >-
      No LWE hardness is estimated, consumed or implied: the computational term is set to zero,
      which is the strongest possible assumption in FrodoKEM's favour.
    - >-
      NOTHING HERE IS A STATEMENT ABOUT REACHABLE DEPLOYMENTS. A crossing at n_u = 2^13 users is
      a property of an inequality, not a claim that any deployment has 2^13 users or that
      anything happens if it does. Reachability is IDEA-20260821-c05d5f's and c2242b's question.
    - >-
      THE FV-1 BINDING-TERM VERDICT IS CELL-BY-CELL AND CONVENTION-BOUND, and must never be
      quoted as 'the residue binds for FrodoKEM'. It binds at 640-B under both conventions, at
      976-B only under the unrounded convention, and at no other cell.
    - >-
      Everything is scoped to the transcribed bound, the paper's own normalization, the declared
      thresholds and rays, the parameter sets evaluated, and the document revisions retrieved.
    - >-
      Claim tier SPLIT: crypto tier for the arithmetic (a stated inequality with stated terms
      either crosses a threshold at a computed target count or does not, at the real parameter
      sets); nothing above toy tier for any reading about FrodoKEM's actual security.
    - >-
      FV-1 AND FV-2 ARE HAND ARITHMETIC BY THE IDEA-GENERATOR, NOT RUNS AND NOT EVIDENCE. They
      are recorded as pre-run predictions so that the run can refute them; no downstream record
      may cite them as measurements. Their first-pass versions were wrong in the way documented
      in FV-1's caveat, which is itself the reason step (1) of the minimal test is to
      machine-verify them term by term.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Residue monotonicity in the target counts.) FOR EACH parameter set P and variant V, the
        statistical residue residue_{P,V}(q_RO, n_u, n_c) is non-decreasing in each of q_RO, n_u
        and n_c over the evaluated region, so the crossing locus is the boundary of a
        downward-closed set and is locatable by bisection along any ray.
      rigorous_support: >-
        The rigorous half is checkable against the real inequality rather than against a family:
        every T2 term of Eq. (3) has one of the forms (query count) x (correctness error),
        (count)/(space size), or n_u n_c(n_c - 1)/(|M| 2^lensalt) - all non-decreasing in the
        query and target counts by inspection - and a finite sum of non-decreasing functions
        multiplied by a constant factor >= 1 is non-decreasing. The classical analogue is that
        elementary fact. THE HEURISTIC HALF is that delta(n_u), which is a FUNCTION of n_u and
        not a constant, is itself non-decreasing in n_u; the paper bounds it above by delta(1) n_u
        but states no monotonicity, and the QROM arm's 10(q + q_D + 1)^2 delta(n_u) term is where
        this is most likely to matter.
      validation_plan: >-
        Check monotonicity term by term symbolically after transcription, and numerically at the
        endpoints plus at least five interior points of every ray in (n_u, n_c), at every
        parameter set, in certified interval arithmetic. Report any non-monotone term by name
        with the range over which it decreases. Predicted outcome if H1 holds: zero non-monotone
        terms and a bisection converging to the same crossing from both sides at the declared
        precision. Tail check: at the largest (n_u, n_c) evaluated the residue must exceed the
        threshold; a residue that plateaus below it means no crossing exists in range and 'no
        crossing in range' is reported rather than an extrapolated value. Sampled parameters
        recorded: rays, interior points, precision, parameter sets, variants.
    - id: H2
      statement: >-
        (Tag exhaustiveness, THREE classes - CORRECTED 2026-08-24.) FOR ALL terms and factors of
        the transcribed bound, each is exactly one of: T1, containing a computational assumption
        advantage symbol; T2, bounded by a function of the query, target and length parameters
        alone; or T3, a MODEL OR DIVERGENCE FACTOR containing neither - specifically a
        multiplicative factor determined by the distribution switch, of which
        exp(s * D_alpha(P||Q))^(1 - 1/alpha) is the instance appearing in Eq. (3).
      rigorous_support: >-
        THE PREVIOUS TWO-CLASS VERSION OF THIS ASSUMPTION IS FALSIFIED BY THE ACTUAL BOUND AND IS
        WITHDRAWN. Eq. (3) is not a sum of terms: it is a bracketed sum MULTIPLIED by
        exp(s D_alpha(P||Q))^(1-1/alpha), plus a further sum. That factor is a Renyi divergence
        between chi_Frodo and the rounded Gaussian - at Frodo-640, s = 20544, D_alpha <= 0.0000324
        at alpha = 200, worth a factor of about 1.94 - and it contains no advantage symbol and no
        query, target or length parameter. The rigorous half of the corrected assumption is the
        structure of the proof as the paper describes it: three steps, [GHS25, Thm 23] (a
        reduction), a distribution substitution (a divergence factor), and [GHS25, Thm 24] (a
        reduction), so exactly three sources of contributions. THE HEURISTIC HALF is that the
        PRINTED bound preserves that trichotomy: printed bounds fold hops together and a folded
        term can be of mixed type.
      validation_plan: >-
        Cross-check the tagging against the three named proof steps rather than against the
        displayed inequality: for every displayed term and factor, name the step it comes from,
        its type AND its coefficient, and report any whose provenance spans two. Report the count
        of mixed-type items; if any exists, the ablation must delete only its T1 part or the
        record must stop. Report explicitly WHICH terms the T3 factor multiplies, since the
        2026-08-24 correction turned on exactly that (the three trailing terms of Eq. (3) are
        outside it). The T3 factor is carried SYMBOLICALLY and the residue is reported as a
        function of the swept D_alpha, so that the lane boundary with GOAL-FRODO-001 (which owns
        whether the Renyi divergence reproduces) holds even though the residue's numeric value
        needs it. TRANSFER ASSUMPTION: the ROM chain's trichotomy is not assumed to hold in the
        QROM arm (Theorem 2), where a one-way-to-hiding step mixes a distance with a query factor
        and a gamma-spreadness term appears; the QROM arm is tagged separately or declared out of
        scope.
    - id: H3
      statement: >-
        (Multi-user correctness scaling.) FOR ALL n_u in the evaluated range, delta(n_u) <=
        delta(1) * n_u, and the crossing computed under that substitution is an upper bound on
        the crossing computed with the true delta(n_u).
      rigorous_support: >-
        The rigorous half is the cited bound itself: eprint 2025/1861 Section C.1.2 states 'The
        gap is linear in n_u as delta(n_u) <= delta(1) n_u [DHK+21]'. THE HEURISTIC HALF is that
        this bound is TIGHT ENOUGH TO BUILD A CROSSING ON, which the same sentence explicitly
        doubts: it is 'practically tight ... whenever delta(n_u) << delta(1) n_u; as mentioned in
        Section 2.2, there is evidence for the latter for KEMs built from lattice-based PKE'.
        Read carefully, the paper is saying the LINEAR BOUND IS LOOSE in exactly the regime this
        record evaluates. FV-2's E-SALT/E-DELTA separation depends on it directly, which is why
        predictions[2] now carries an indeterminate band wider than the first pass's threshold.
      validation_plan: >-
        Report every n_u-dependent crossing TWICE: once under delta(n_u) = delta(1) n_u and once
        with delta(n_u) swept over a declared ladder spanning delta(1) to delta(1) n_u, and
        report the width of the resulting band as the headline uncertainty on the multi-user arm.
        Comparison target: [DHK+21, Table 1] as cited by the paper, which the executor must
        retrieve and file; if it cannot be retrieved, the band is reported without a comparison
        target and the arm is labelled conditional. This record does NOT recompute delta for any
        n_u - that is GOAL-FRODO-001's - and the sweep is over a symbol, not an estimate.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED and no algorithm against any scheme is proposed. The
      computation is O(terms x log(range) x grid points x parameter sets) exact-rational
      evaluations - milliseconds, with the whole battery including all controls under an hour of
      single-core compute. What the record produces is a PROOF-SIDE quantity: the target counts
      beyond which the transcribed inequality certifies no more than a declared threshold,
      independent of any hardness result.
    memory_exponent: >-
      No attack memory exponent. The computation is memory-free; artifacts are a table of
      crossings and labels, kilobytes.
    best_known: >-
      Externally, eprint 2025/343 supplies the only published evaluated instances of this
      quantity located this session, read rather than recalled: their Eq. (1) and Eq. (2)
      evaluated at n_c = q_RO = 2^64, |M| = 2^128, giving 'close to 1' and 'around 2^-62'. That
      result DOMINATES this record on the generic SFO/FO comparison at that point - it is a proof
      plus an evaluation, this is only an evaluation - and it is used as the calibration target
      rather than competed with. For FrodoKEM's OWN composed Eq. (3) at multi-target counts the
      incumbent is Section C.1.2's order-of expressions, which state no number. Internally there
      is no incumbent: no record in this repository evaluates any ablated bound.
    hidden_overhead: >-
      Not asymptotic but EPISTEMIC. First, everything is downstream of a transcription that has
      been read but not yet frozen, and read through a PDF text extraction whose table column
      alignment is a real risk - and whose coefficients were in fact mis-transcribed once inside
      this record. Second, the crossing is a boundary in a two-dimensional target-count space and
      its scalar sections depend on the ray. Third, the multi-user arm rests on H3, a bound the
      paper itself calls loose, and the corrected E-SALT margin is now comparable to the H3 band.
      Fourth, FV-1 and FV-2 are hand arithmetic. Fifth, one of six single-target verdicts depends
      on a rounding convention. All five are disclosed rather than absorbed. WHAT IS NO LONGER
      HIDDEN: the eFrodoKEM salt-deletion premise, which was recalled and is now read.
    tradeoff_note: >-
      No time-memory tradeoff exists or is relevant: there is no search. The only tradeoff is
      between the density of the (n_u, n_c) ladder and the resolution of the reported crossing,
      and it is reported directly as the bisection precision.
