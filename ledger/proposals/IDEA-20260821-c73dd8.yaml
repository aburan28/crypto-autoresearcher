    No attack; evaluation and ablation contribution only. Quantitatively, and revised downward
    twice by this pass. (i) Against eprint 2025/343 on the generic transform the delta is ZERO OR
    NEGATIVE and the honest contribution is reproduction as a calibration control. (ii) Against
    eprint 2025/1861 at the single-target point the delta is ZERO for the answer - FV-1 shows the
    binding-term question is settled by the paper's own constants - and is at most the 0.66-bit
    arithmetic discrepancy FV-1 records, whose most likely explanation is this session's own
    error. (iii) THE POSITIVE DELTA IS NOW CONFINED TO: the multi-target evaluation of Eq. (3)
    for both variants at all three parameter sets with a binding-term label (no located row);
    the salt-free/salted crossing separation as a shipped ablation (no located row); the three
    sensitivity derivatives the lane's charter asks for and nobody has computed; and the H3 band,
    which quantifies how much of the multi-user answer rests on a bound the paper calls loose.
    Internally the delta is the creation of the first evaluated residue of any kind in this
    program.
