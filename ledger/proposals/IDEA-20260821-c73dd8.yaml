  object_first_candidate:
    tracked_object: >-
      The STATISTICAL RESIDUE of Eq. (3): the sum of exactly those terms containing no
      computational advantage symbol, followed as a function of the TARGET COUNTS (n_u, n_c) at
      the paper's own per-unit-t normalization, and summarized by the crossing surface and the
      label of the term binding on it. (Repointed 2026-08-24: the object is unchanged, the
      variable it is followed along is not. Following it along a single query scale was the
      defect - along that direction it does not move relative to the term it is compared with.)
    lossiness: >-
      GENUINELY AND MASSIVELY LOSSY. The projection deletes the entire computational content of
      the bound and keeps only the assumption-free part. What survives cannot reconstruct the
      bound: from the residue alone one cannot recover the LWE advantage, the lattice dimension,
      the modulus, or the bit figure. The discard is COMPATIBLE with the target's operation, and
      this is checkable against the real inequality rather than asserted of a family: Eq. (3)
      is (a sum of five non-negative terms) x exp(s D_alpha)^(1-1/alpha) + (a sum of three
      non-negative terms), and the multiplier is >= 1 because D_alpha >= 0 and s > 0. Deleting
      non-negative terms from either group therefore lower-bounds the right-hand side, so
      'residue >= 1/2' implies 'bound >= 1/2' unconditionally. The retained part propagates
      deterministically, term by term, and the inequality direction is preserved by construction
      rather than by assumption.
    propagation: >-
      One step is one increment of a target count. The law: each residue term is a monotone
      non-decreasing function of (q_RO, n_u, n_c) - a delta term multiplied by a query count, a
      q/|M| term, a collision term n_u n_c(n_c-1)/(|M| 2^lensalt) - so the residue is monotone
      and its crossing surface is well defined and locatable by bisection along any ray in
      (n_u, n_c). IF ANY TERM IS NOT MONOTONE the crossing is a set rather than a surface, and
      reporting that is required rather than optional. Note the one genuine non-monotonicity
      risk identified from primary text: delta(n_u) is a function, not a constant, and is
      bounded above by delta(1) n_u but not below; a swept delta(n_u) that is not monotone in
      n_u breaks the law, and H3 exists for it.
    survival_score: >-
      Survives the entire multi-target evaluation because the residue is defined at every
      (n_u, n_c), and dissolves as an ANSWER at the point where the deleted computational term
      would have dominated anyway - which FV-1 locates exactly, at four of the six single-target
      cells outright and at a fifth (976-B) under Table 4's printed rounding. The record therefore
      reports the CROSSOVER explicitly: the locus where the residue equals the computational term
      at the declared nominal Adv_CPA/t, using Table 4's own figures as that nominal value without
      re-deriving them. Beyond the crossover the object says nothing, and saying where that is is
      part of the deliverable.
