  assumptions:
    - >-
      The transcription tags every term computational or statistical mechanically, by the
      presence of an assumption advantage symbol, and the tagging is frozen before evaluation.
    - >-
      The bound is a sum of non-negative terms, so deleting terms is a valid one-sided
      relaxation. If the transcribed bound contains a subtraction or a non-monotone composition,
      the ablation is invalid and the record must stop.
    - >-
      The comparison target - a NIST category floor, or the published figure for the set - is
      taken as printed and is not re-derived. The record compares two printed numbers with a
      computed one and never estimates hardness.
    - >-
      The failure rate is a swept symbol whose published value is neither asserted correct nor
      asserted wrong.
    - >-
      All three parameter sets and both variants are evaluated, or the ones omitted are named.
  proof_search_map:
    bottleneck: >-
      The step in which a concrete guarantee is read off the bound by comparing its right-hand
      side against a threshold at a chosen query point. The bottleneck is that this step is
      always performed with the computational term present, so a statistical term that would
      bind on its own is never visible as such. Deleting the computational term is exactly the
      removal that changes what the comparison establishes.
    baseline_embedding:
      parameter_slice: >-
        The unsalted FO configuration with a 128-bit message space, which is the exact slice
        Glabush-Hövelmanns-Stebila analyze. On that slice this record's horizon computation must
        reproduce their published statement (binding in the region of circa 2^64 challenge
        ciphertexts; 62 bits recovered by salting at the 128-bit level) within a tolerance
        declared before the run. This is a genuine EXTERNAL baseline, which is rare in this
        program, and it is stronger than any internal fixture.
      reproduction_check: >-
        Frozen fixture holding: the transcribed unsalted bound, the paper's stated assumptions,
        the two published numbers, the declared tolerance in bits, and the pipeline's output.
        Plus the inherited internal gate: recompute 149.8 / 212.6 / 266.8 from the transcribed
        bound at the published inputs.
    observation_collision:
      observable: >-
        The scalar horizon H(P).
      distinct_preimage_search: >-
        The collision is easy to construct and is a genuine falsifier of identifiability: a bound
        binding at a message-space term with len_mu = 128 and a bound binding at a salt-collision
        term with len_salt = 128 can have IDENTICAL H, with opposite remedies (enlarge the
        message space versus lengthen the salt). Therefore H MUST ALWAYS BE REPORTED WITH ITS
        BINDING-TERM LABEL, and a bare horizon is not a permitted deliverable. A second, sharper
        collision: two parameter sets whose horizons coincide because both are reporting
        len - 1 for the same len, which is NULL-4's failure mode - the pipeline echoing its own
        input. Both collisions are searched for explicitly and reported.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A problem-specific resource measure - the horizon - realized by a specialization (set
          all computational terms to zero), with charges added only over the proved-disjoint
          block of statistical terms.
        predicted_gain: >-
          Converts a five-dimensional sweep into one scalar plus one label per parameter set,
          computable in milliseconds, and makes the answer independent of the lattice lane. No
          attack exponent is claimed; the gain is decidability at negligible cost.
      - transform: observable_fiber
        proposed_object: >-
          Hold H fixed and vary which term binds, exhibiting the fiber over the horizon and the
          intrinsic invariant (the binding-term label) that separates its members.
        predicted_gain: >-
          Turns the identifiability failure named above from a hidden defect into a reported
          coordinate.
    quantifier_order: >-
      Written out, the horizon claim is: FOR EACH parameter set P, EXISTS H(P) such that FOR ALL
      query/target vectors on the declared ray with scale x > H(P), residue_P(2^x) >= 1/2, and
      hence the transcribed bound is vacuous at those inputs REGARDLESS of the computational
      term. The existential over H is uniform in the adversary - there is no adversary in the
      statement at all - which is precisely why the result is a statement about the inequality
      and cannot be read as one about an attacker. The ray dependence is an explicit universally
      quantified parameter and is why at least three rays are evaluated: a horizon quantified
      over one ray is a weaker statement and must be labelled as such.
    method_ceiling:
      strongest_certifiable_claim: >-
        'The transcribed bound at parameter set P is vacuous for query/target scales above H(P)
        on the declared rays, with term T binding, independently of any hardness assumption.'
        The method can NEVER certify that FrodoKEM is insecure at those inputs, that an attack
        exists, that the bound is the best available (a different proof may have a different
        residue), or anything about the ephemeral variants without the salt-deletion premise
        being verified from primary text.
      nearby_object_control: >-
        The SALTED FrodoKEM bound versus the UNSALTED one at the same parameter set: the closest
        pair on which the hoped-for conclusion must behave differently, since the published
        claim is that salting recovers 62 bits at the 128-bit level. If the pipeline returns the
        same horizon for both, it has not identified the load-bearing structure. This doubles as
        a directional sensitivity check with an externally published expected magnitude.
    proof_obligations:
      - claim: Every term is tagged computational or statistical before evaluation, mechanically.
        responsibility: interface
      - claim: The bound is a sum of non-negative terms, so the ablation is a valid one-sided relaxation.
        responsibility: correctness
      - claim: The residue is monotone along each declared ray, so the horizon is a scalar.
        responsibility: correctness
      - claim: The pipeline reproduces the published unsalted-128-bit figures within the declared tolerance.
        responsibility: baseline
      - claim: The horizon is computed in exact rational or certified interval arithmetic.
        responsibility: correctness
      - claim: H is never reported without its binding-term label.
        responsibility: interface
      - claim: No security reading of a vacuous region appears anywhere in the deliverable.
        responsibility: scope
  predictions:
    - metric: >-
        guarantee horizon H(P) in bits, at threshold 1/2, per parameter set and per variant,
        with its binding-term label, on each of at least three declared rays
      direction: different
      minimum_effect: >-
        the discriminating comparison is H(P) versus the category floor for P. A margin of at
        least 8 bits above the floor at all three sets and both variants is the clean negative
        (the residue is not binding); H below the floor at any set is the positive finding
    - metric: >-
        spread of H(P) across the three rays
      direction: different
      minimum_effect: >-
        report it; a spread larger than the margin to the floor means the ray choice, not the
        bound, decides the verdict, and no verdict is issued
    - metric: >-
        NULL-1 agreement with the published unsalted-128-bit statement (binding near 2^64
        challenge ciphertexts; circa 62 bits recovered by salting)
      direction: different
      minimum_effect: >-
        within a tolerance in bits declared before the run; disagreement voids every other
        number in the run
    - metric: >-
        dH/d(len_salt), dH/d(len_mu), dH/d(log10 delta), by finite differences
      direction: different
      minimum_effect: >-
        report all three with intervals; a derivative of exactly zero for len_salt on the salted
        arm would mean the salt does not enter the residue at all and is a finding
    - metric: >-
        difference in H between the salted and salt-free (ephemeral) variants at the same
        parameter set
      direction: higher
      minimum_effect: >-
        the salted arm's H must exceed the salt-free arm's; equality means the pipeline does not
        see the salt and voids the eFrodoKEM arm
    - metric: >-
        NULL-2 horizon on a constant residue
      direction: different
      minimum_effect: must be 'no horizon'; a finite value voids the run
  minimal_test:
    design: >-
      THE CHEAPEST VALID DISCRIMINATOR IN THIS LANE, and it fits in well under an hour of
      single-core compute once the transcription exists. Implement residue_P(x) directly from
      the transcribed and tagged bound in exact rational arithmetic (Python fractions) with an
      interval cross-check. Run NULL-4's paper derivation first (a single q/2^{len} term must
      give H = len - 1). Run NULL-2 (constant residue must give no horizon). Run NULL-1 against
      the published unsalted-128-bit configuration with the tolerance declared in advance, and
      ABORT THE WHOLE RUN if it disagrees. Then bisect H at thresholds 1/2, 2^-32 and 2^-64, for
      FrodoKEM-640/976/1344 and each eFrodoKEM variant, on three declared rays, emitting H with
      its binding-term label every time. Finally three finite-difference derivatives. THIS
      DISCRIMINATES because the two explanations - 'the binding constraint on what the proof
      certifies is the hardness assumption' and 'it is a statistical term set by the length
      parameters' - predict, for the same transcribed bound, a horizon far above and a horizon
      at or below the floor respectively, and the computation that separates them does not touch
      the assumption at all. Compute: seconds to minutes. Implementation: a few hundred lines.
    controls:
      - >-
        NULL-1 external calibration against the published unsalted-128-bit figures, tolerance
        declared before the run; a failure aborts everything downstream.
      - NULL-2 constant-residue null; must return 'no horizon'.
      - >-
        NULL-3 graded term-deletion and len_salt-halving sensitivity, comparator named, threshold
        numeric and declared before the run, at least three interior points, monotonicity reported.
      - NULL-4 single-term forced value H = len - 1, derived on paper before any code runs.
      - >-
        Echo check: verify H is NOT equal to (len_mu - 1) or (len_salt - 1) for every parameter
        set, which would indicate the pipeline is reporting its own input.
      - >-
        Nearby-object control: salted versus unsalted at the same parameter set, with the
        published 62-bit magnitude as the expected separation.
      - Inherited gating baseline reproduction of 149.8 / 212.6 / 266.8.
      - >-
        Mutation control: perturb one exponent of the transcribed residue and confirm H moves by
        the derivable amount.
      - >-
        Arithmetic control: every horizon computed twice, once in exact rationals and once in
        certified intervals, and the two must bracket each other.
    required_metrics:
      - H(P) with binding-term label, per parameter set, per variant, per ray, per threshold
      - ray spread of H per parameter set
      - NULL-1, NULL-2, NULL-3, NULL-4 outcomes against their pre-declared thresholds
      - the three sensitivity derivatives with intervals
      - salted-minus-unsalted horizon difference per parameter set
      - the crossover scale at which the residue equals the declared nominal computational term
      - the term tagging table (term, computational or statistical, location in primary text)
  falsification_conditions:
    - >-
      H(P) exceeds the category floor by at least 8 bits at all three parameter sets and for
      both variants, on all three rays. The claim is refuted: the statistical residue is not the
      binding constraint on what the proof certifies, the 2025 salt fix was sufficient in this
      respect, and the lane should redirect. THIS IS A GOOD OUTCOME FOR FRODOKEM AND IS REPORTED
      AS A RESULT, not as a null run.
    - >-
      NULL-1 fails to reproduce the published unsalted-128-bit statement within the declared
      tolerance. No other number in the run is reportable; the deliverable becomes the
      discrepancy and its cause.
    - >-
      NULL-2 returns a finite horizon on a constant residue: the pipeline manufactures horizons.
    - >-
      NULL-4's echo check fires - H equals a length parameter minus one at every parameter set -
      so the pipeline is reporting its own input rather than a property of the bound.
    - >-
      Some residue term is non-monotone along a declared ray: the horizon is a set, not a
      scalar, and the record reports the set and withdraws the scalar framing.
    - >-
      The transcribed bound is not a sum of non-negative terms: the ablation is invalid and the
      record stops without producing a horizon.
    - >-
      The ray spread exceeds the margin to the floor: the ray choice decides the verdict and no
      verdict is issued.
    - >-
      Primary text shows the ephemeral variants DO carry a salt, refuting the recalled premise:
      the eFrodoKEM arm is withdrawn and only the standard-variant horizons stand.
  confounders:
    - >-
      Threshold convention. 'Vacuous' at 1/2 is a convention; a distinguishing advantage of 2^-32
      may already be operationally meaningless or meaningful depending on the reader. Reporting a
      curve across three thresholds rather than one scalar is the mitigation, and no single
      threshold is privileged in the headline.
    - >-
      Ray choice. The horizon is a supremum along a ray through a multi-dimensional input space,
      and a different ray gives a different horizon. Three rays and a reported spread is the
      mitigation; it is not a solution.
    - >-
      Identifiability: two different binding terms give the same H with opposite remedies. The
      label requirement is the mitigation and it is mandatory.
    - >-
      Echoing the input: a residue dominated by one q/2^{len} term returns len - 1, which looks
      like a discovery and is arithmetic. NULL-4 and the echo check exist for exactly this.
    - >-
      The published figures for the standard and ephemeral variants are identical in the
      retrieved rendering, which may mean the figure is a lattice estimate that the transform's
      loss was never subtracted from - in which case comparing H against it is comparing a
      transform-side quantity with an assumption-side one. If the gating baseline reproduction
      reveals that, this record's comparison target must change and the record says so in
      advance.
    - >-
      Transcription error is unrecoverable downstream: a mistagged term moves the horizon by
      whatever the term is worth.
  interpretation_limits:
    - >-
      A vacuous bound is NOT an insecure scheme. The proof saying nothing above H is compatible
      with the scheme being perfectly secure there, and this record makes no claim in either
      direction. RQ-FRODO-a2dbe2.constraints[3] binds absolutely.
    - >-
      No attacker, no attack cost, no query strategy and no adversary appear anywhere. The
      published attack of the cited work is cited, not reproduced and not extended.
    - >-
      No LWE hardness is estimated, consumed or implied: the computational term is set to zero,
      which is the strongest possible assumption in FrodoKEM's favour.
    - >-
      Everything is scoped to the transcribed bound, the declared rays, the declared thresholds,
      the parameter sets evaluated, and the document revisions retrieved.
    - >-
      Claim tier SPLIT: crypto tier for the arithmetic (a stated inequality with stated terms
      either crosses a threshold at a computed scale or does not, at the real parameter sets);
      nothing above toy tier for any reading about FrodoKEM's actual security.
    - >-
      The eFrodoKEM arm rests on a RECALLED premise (that the ephemeral variants discard the
      salt) and is void until that premise is verified from primary text.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Residue monotonicity.) FOR EACH parameter set P and FOR EACH declared ray r, the
        statistical residue residue_{P,r}(x) is non-decreasing in x over the evaluated range, so
        H(P, r) = sup{x : residue < threshold} is a well-defined scalar located by bisection.
      rigorous_support: >-
        The rigorous half: every term of the FO bound family that contains no assumption
        advantage has one of the forms (query count) x (correctness error), (query count)/(space
        size), or a birthday-style collision probability in a draw count - all non-decreasing in
        the query and draw counts by inspection, and their sum is non-decreasing. The classical
        analogue is the elementary fact that a finite sum of non-decreasing functions is
        non-decreasing; the heuristic half is that EVERY term of FrodoKEM's transcribed residue
        has one of those forms, which cannot be known before the bound is read, and QROM
        Grover-style terms are the obvious place for it to fail.
      validation_plan: >-
        Check monotonicity term by term symbolically after transcription, and numerically at the
        two endpoints plus at least five interior points of every ray, at every parameter set,
        in certified interval arithmetic. Report any non-monotone term by name with the range
        over which it decreases. Predicted outcome if H1 holds: zero non-monotone terms and a
        bisection that converges to the same H from above and below to the declared precision.
        Tail check: at the largest x evaluated the residue must be at least the threshold; a
        residue that plateaus below the threshold means H does not exist in range and 'no
        horizon in range' is reported rather than an extrapolated value. Sampled parameters
        recorded: rays, interior points, precision, parameter sets.
    - id: H2
      statement: >-
        (Tag exhaustiveness.) FOR ALL terms of the transcribed bound, the term either contains a
        computational assumption advantage symbol or is bounded by a function of the query,
        target and length parameters alone; there is no third kind.
      rigorous_support: >-
        The rigorous half is the structure of a game-hopping proof, in which each hop contributes
        either a reduction to an assumption or a statistical distance between adjacent games, and
        those are the only two sources of terms. The heuristic half is that the PRINTED bound
        preserves that dichotomy: printed bounds routinely fold several hops into one displayed
        term, and a folded term can be of mixed type.
      validation_plan: >-
        Cross-check the tagging against the game chain rather than against the displayed
        inequality: for every displayed term, name the hop or hops it comes from and their type,
        and report any term whose provenance spans both types. Sample and report the count of
        mixed-type terms; if any exists, the ablation must delete only its computational part or
        the record must stop. TRANSFER ASSUMPTION: the ROM chain's clean dichotomy is not
        assumed to hold in the QROM arm, where one-way-to-hiding style terms mix a distance with
        a query factor, and the QROM arm is tagged separately or declared out of scope.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED and no algorithm against any scheme is proposed. The
      computation itself is O(number of terms x log(range) x number of rays x number of
      parameter sets) exact-rational evaluations - hundreds of arithmetic operations, i.e.
      milliseconds, with the whole battery including all controls well under an hour of
      single-core compute. What the record produces is a PROOF-SIDE exponent: H(P) in bits, which
      is an upper bound on the scale at which the transcribed inequality says anything, and
      which no hardness result can raise.
    memory_exponent: >-
      No attack memory exponent. The computation is memory-free; artifacts are a table of
      horizons and labels, kilobytes.
    best_known: >-
      Externally, Glabush-Hövelmanns-Stebila supply the only published quantitative instance of
      this quantity that this session located: the message-space term binding at circa 2^64
      challenge ciphertexts for FrodoKEM-640 and HQC-128, with salting recovering 62 bits at the
      128-bit level. That result DOMINATES this record on the message-space term specifically -
      it is a proof, this is an evaluation - and is used as the calibration target rather than
      competed with. Internally there is no incumbent: no record in this repository computes any
      horizon, any ablated bound, or any statistical residue.
    hidden_overhead: >-
      The o(1) here is not asymptotic, it is EPISTEMIC and there are three parts. First, the
      whole result is downstream of a transcription that has not happened, and a mistagged or
      misread term moves H by whatever the term is worth, silently. Second, the horizon is a
      supremum along a chosen ray in a multi-dimensional space, so 'the horizon' is shorthand
      for 'the horizon on these rays'. Third, the eFrodoKEM arm rests on a premise this session
      could only recall. All three are disclosed rather than absorbed.
    tradeoff_note: >-
      No time-memory tradeoff exists or is relevant: there is no search. The only tradeoff is
      between the number of rays and thresholds evaluated and the confidence that the reported
      scalar is not a ray artifact, and it is reported directly as the ray spread.
  dominated_by: >-
    On the message-space term specifically, DOMINATED BY Glabush-Hövelmanns-Stebila, IACR CiC
    3(1) (2026): they prove what this record would merely evaluate, they do it for FrodoKEM-640
    by name, and they supply the salted alternative with a quantified 62-bit recovery. That is a
    real frontier row on this exact axis and it is named rather than ignored. On the GENERAL
    statistical residue - all terms at once, both variants, with a binding-term label and
    sensitivity derivatives - this session located no row to be dominated by, having checked the
    lane's eight proposals, the corpus (grep: the multi-target KEM paper is not filed; the only
    salted-FO mention is the HQC specification entry KN-LIT-b9e1a8), and the four external
    documents it could open. That is an honest 'no row located', not a verified absence: two
    PDF fetches failed and the CiC paper's body is unread, so the general horizon may well
    already be in it.
  sota_delta: >-
    No attack; evaluation and ablation contribution only. Quantitatively: against the external
    frontier the delta on the message-space term is ZERO OR NEGATIVE - the published work proves
    more than this record evaluates - and the honest contribution there is reproduction as a
    calibration control. The positive delta is (i) the generalization to the full statistical
    residue with a binding-term label, (ii) the salt-free eFrodoKEM arm, on which this session
    located no published horizon and which no record in this repository mentions (measured: 2
    repo-wide grep matches for eFrodoKEM, both in the lane's own framing records), and (iii)
    three sensitivity derivatives the lane's charter asks for and nobody has computed. Internally
    the delta is the creation of the first horizon number of any kind in this program.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    By part. (i) That the transcription arrives with terms taggable computational or statistical:
    0.85 - this is the least demanding thing BATCH-001 could produce and it falls out of the
    transcription almost for free.
    (ii) That the residue is monotone and H is a scalar on the ROM arm: 0.85; on the QROM arm,
    0.55.
    (iii) That NULL-1 reproduces the published unsalted-128-bit figures within a declared
    tolerance: 0.5, and this is the single most likely place for the run to end. Reproducing
    another group's number from their stated assumptions is exactly the exercise that usually
    exposes an unstated convention, and if it fails, saying so IS the result.
    (iv) That the salted arm's horizon sits comfortably above the category floor - i.e. the
    negative outcome: 0.65. I expect the salt fix to have worked, because it was designed by
    people who had just proved the theorem, and I would rather this record confirm that cheaply
    than have the lane spend five batches assuming otherwise.
    (v) That the salt-free eFrodoKEM horizon is materially lower than the salted one: 0.75,
    conditional on the recalled salt-deletion premise being true, which is itself about 0.8.
    (vi) That the record produces a defensible number or a defensible 'no horizon in range' for
    every cell it attempts: 0.9.
