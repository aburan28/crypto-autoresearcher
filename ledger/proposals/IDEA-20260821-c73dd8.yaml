idea:
  id: IDEA-20260821-c73dd8
  question_id: RQ-FRODO-a2dbe2
  added: '2026-08-21'
  title: >-
    REPOINTED 2026-08-24, ARITHMETIC REDONE 2026-08-24 (second repair pass). The single-target
    guarantee horizon is NOT an open question: it is forced by arithmetic on eprint 2025/1861
    Eq. (7) at the paper's own constants, and this record records that derivation instead of
    proposing to run it. What remains open and untabulated is the MULTI-TARGET arm - the
    statistical residue of Eq. (3) as a function of (n_u, n_c) rather than of a single query
    scale - and the FrodoKEM (SFO, lensalt = 256/384/512) versus eFrodoKEM (FO, lensalt = 0)
    difference, neither of which appears as a number anywhere in the primary text: Table 4 is
    single-user single-ciphertext only and Section C.1.2 gives order-of expressions with no
    evaluation.
  class: mechanism
  claim: >-
    (A) THE MECHANISM. An FO-style bound composes a computational term (an LWE advantage) with
    terms that contain no assumption at all: a correctness-error term, a message-space search
    term of the form (queries)/|M|, a salt-collision term. Those terms are paid by the
    adversary's query and target budget alone and no amount of lattice hardness reduces them.
    The structural claim is that for FO-based KEMs the binding constraint on what the proof
    CERTIFIES can be one of these statistical terms rather than the assumption, and that which
    one binds is a function of the length parameters (lenmu, lensalt) and of the target counts
    rather than of the lattice dimension.
    THIS IS NO LONGER A CONJECTURE AT THE SINGLE-TARGET POINT, BUT THE CONFIRMATION IS NARROWER
    THAN THE FIRST REPAIR PASS CLAIMED. Evaluating Eq. (7) at the paper's own constants
    (derivation in `forced_value_derivations` FV-1, redone from scratch on 2026-08-24 after the
    first pass was found to have doubled three terms and dropped one) shows: the statistical
    residue BINDS at (e)FrodoKEM-640 under the beyond-core-SVP cost model (column B of Table 4)
    under either rounding convention; it binds at (e)FrodoKEM-976 column B ONLY under the
    unrounded convention (IND-CPA = 212.6 - 4 = 208.6) and NOT under Table 4's printed IND-CPA
    value of 208, a 0.6-bit convention choice that flips that cell; and it does NOT bind at
    1344-B or at any column-C cell. So the mechanism is confirmed at one cell unconditionally,
    at a second cell conditionally on a rounding convention, and refuted at four. That answer is
    arithmetic, it was obtained without any pipeline, and it is recorded here rather than
    proposed as an experiment.
    (B) WHAT IS WITHDRAWN. The previous headline - compare the guarantee horizon H(P) against the
    NIST category floor along a declared query ray - is WITHDRAWN. Under the paper's own
    convention (Section C.1.1: q_RO < t * 2^-18 and Adv_CPA(B) <= t * 2^-134.5 at Frodo-640) every
    term of Eq. (7) is linear in t, so the ratio of residue to computational term is CONSTANT
    along that ray and the comparison has an answer forced before any run. The old
    confounders[4] guessed the cause and routed it to 'the comparison target must change'
    instead of to a pre-run forced-value derivation; that was a KN-TECH-1a5b7e Mode 3 failure
    and the correct repair was to do the derivation, which is now done.
    (C) THE REPOINTED ESTIMAND, IN TWO ARMS NEITHER OF WHICH IS TABULATED ANYWHERE.
    ARM 1, MULTI-TARGET. Eq. (3) carries three target-count-dependent statistical terms -
    n_c/|M|, q_RO * delta(n_u), and n_u * n_c * (n_c - 1) / (|M| * 2^lensalt) - and Section C.1.2
    bounds the multi-key degradation only as an order-of expression with delta(n_u) <= delta(1) *
    n_u. Nobody has evaluated them. The estimand is the CROSSING SURFACE: the locus in (n_u, n_c)
    at which the multi-target statistical terms raise the per-unit-t bound one bit above its
    single-target value, per parameter set, per variant, in interval arithmetic.
    ARM 2, THE SHIPPED ABLATION. eFrodoKEM is FrodoKEM with lensalt = 0 (Table 2, and Remark 1:
    'If salt is removed from the SFO-perp-prime transform in Figure 5, the transform becomes
    equivalent to the FO-perp-prime transform ... used in our eFrodoKEM variant'). The salt
    therefore enters the residue through exactly one term, and the two arms' crossing surfaces
    must differ by a computable amount or the pipeline is not seeing the salt.
    (D) THE FALSIFIABLE COMPARISON, RESTATED SO IT CAN COME OUT NEGATIVE. Two explanations are
    discriminated ALONG A DECLARED RAY, because the comparison is not ray-independent and the
    first repair pass stated it as though it were. On the ray n_c = 2^8 (the specification's own
    informative cap for eFrodoKEM, Section 5), sweeping n_u: E-SALT says the 2025 salt moved the
    binding multi-target term out of the residue, so the salted arm's crossing lies well beyond
    the salt-free arm's and the residual multi-target growth on the salted arm is carried by
    q_RO * delta(n_u) alone. E-DELTA says the salt is irrelevant to where the residue first
    binds, because the correctness term q_RO * delta(n_u) overtakes the message-space term at a
    smaller n_u than the salt-collision term ever mattered at - in which case the salt bought
    multi-CIPHERTEXT security and bought nothing multi-USER, and the deliverable names the
    correctness term as the multi-user binding term. FV-2 gives this session's hand prediction
    for both at Frodo-640 (E-SALT: about 10.7 bits of separation; E-DELTA: under 1 bit); either
    can be wrong, and the decision rule with its indeterminate band is in predictions[2].
    (E) WHY THIS IS NOT THE PUBLISHED RESULT. Glabush-Hoevelmanns-Stebila (eprint 2025/343 - NOT
    2025/1861, which is the FrodoKEM paper; an earlier revision of this record had the wrong
    identifier) prove the SFO transform's multi-target bound and give two evaluated numbers, and
    those are used here as an external calibration target rather than rediscovered. What they do
    not do is evaluate FrodoKEM's OWN composed bound Eq. (3) - which carries the Renyi factor,
    the distribution switch and the FrodoKEM-specific constants - at multi-target counts, for
    both variants, at all three parameter sets. Neither does the FrodoKEM paper: Table 4's caption
    reads 'Single-user, single-ciphertext security estimates'.
    (F) WHAT IS NOT CLAIMED. No attack. No break. No adversary. A horizon is a statement about
    what an inequality can certify; a bound going vacuous is NOT a scheme becoming insecure. No
    LWE hardness is estimated: the computational term is deleted, which is the strongest possible
    assumption in FrodoKEM's favour. The failure rate delta and the Renyi divergence D_alpha are
    SWEPT SYMBOLS whose published values this record neither asserts correct nor asserts wrong
    (GOAL-FRODO-002.non_duplication[0] assigns both to GOAL-FRODO-001).
  mechanism: >-
    STAGE 0 (GATE, CORRECTED 2026-08-24 - see `baseline_gate`): the transcription of Eq. (3) and
    Eq. (7) from eprint 2025/1861 with every term tagged T1/T2/T3 by the three-class taxonomy of
    H2 AT TRANSCRIPTION TIME, and the gate evaluated against Table 4's IND-CCA sec. (ROM) column,
    NOT against 149.8 / 212.6 / 266.8. The transcription must record the COEFFICIENT of each
    term, not only its shape: the whole of FV-1's correction was a coefficient error.
    STAGE 1: delete every T1 (computational) term. Because Eq. (3) is a bracketed sum multiplied
    by a strictly positive factor plus a further sum of non-negative terms, deleting non-negative
    terms from either group lower-bounds the right-hand side, so the residue's horizon is a valid
    UPPER bound on the certifiable region; the direction matters and is proved in the
    proof_obligations rather than assumed.
    STAGE 2 (REPLACES THE OLD RAY SWEEP): fix the paper's own normalization - divide by t, use
    q_RO < t * 2^-18 and t >= 2^32 exactly as Section C.1.1 does - and then sweep the TARGET
    COUNTS (n_u, n_c) over a declared ladder, which is the only direction in which the ratio of
    residue to computational term actually moves. Report the residue and the computational term
    separately at every point so the binding-term label is always available. Report every cell
    under BOTH rounding conventions for the IND-CPA input (unrounded Table 7 minus 4, and Table
    4's printed integer), because FV-1 shows one cell's verdict depends on that choice.
    STAGE 3: locate the crossing surface in (n_u, n_c) at each of FrodoKEM-640/976/1344 and each
    eFrodoKEM variant, in exact rational or certified interval arithmetic, at three declared
    thresholds (one bit above the single-target value; equality with the single-target residue;
    and the Adv/t = 2^-b level matching the published Table 4 figure for that set).
    STAGE 4: name the BINDING TERM at each point on the surface and report it as a label.
    STAGE 5: sensitivity - d(crossing)/d(lensalt), d(crossing)/d(lenmu), d(crossing)/d(log
    delta), and separately the effect of replacing delta(n_u) by its published upper bound
    delta(1) * n_u versus treating delta(n_u) as a swept symbol, since the paper itself flags
    that bound as loose ('practically tight ... whenever delta(n_u) << delta(1) * n_u').
    STAGE 6: controls, below, all in the same invocation.
  novelty_status: unverified
  baseline_gate: >-
    THE GATE THAT EVERY RECORD IN THIS LANE INHERITS, CORRECTED 2026-08-24 (red-team BLOCKING 1).
    THE OLD GATE WAS WRONG AND IS WITHDRAWN: '149.8 / 212.6 / 266.8' are NOT outputs of any
    FO/SFO bound and cannot be reproduced from one. Read from eprint 2025/1861 Table 7 ('Attack
    costs (log2) against FrodoKEM, beyond-core-SVP methodology'): 149.8 is Frodo-640 under
    BDD/C-LSF-Sieve/BKZ, 212.6 is Frodo-976 under BDD/C-LSF-Sieve/BKZ, 266.8 is Frodo-1344 under
    Dual-sieve-FFT/C-LSF-Sieve/PBKZ. They are raw LWE attack costs, taken BEFORE Theorem 3's
    reduction discount and BEFORE the transform is charged. Table 4's caption states the first
    step explicitly: 'IND-CPA numbers are obtained by taking the cheapest corresponding attacks
    in Section 7.2 and subtracting log(nbar + mbar) = 4 bits lost due to Theorem 3.' Demanding
    that an FO bound reproduce 149.8 would emit a spurious ~10-bit 'discrepancy' that is a
    category error.
    THE CORRECTED GATE: reproduce eprint 2025/1861 TABLE 4's 'IND-CCA sec. (ROM)' column -
    B = 140 / 204 / 258 and C = 130 / 192 / 246 - from Eq. (3)/(7) at the constants Section C.1.1
    fixes, together with that section's own stated endpoint Adv/t <= 2^-130.876 for Frodo-640
    under column C. The constants, all read verbatim: |M| = 2^lenmu with lenmu = 128/192/256
    (Table 1); delta(1) < 2^-138.7 / 2^-199.6 / 2^-252.5 (Table 4, 'target failure rate');
    s = 20544 at Frodo-640 (Section C.1.1: 's = 2 x (8 + 8) x 640 + 64'); D_alpha <= 0.0000324 at
    alpha = 200 for chi_Frodo-640, 0.140e-4 at alpha = 500 for chi_Frodo-976, 0.264e-4 at
    alpha = 1000 for chi_Frodo-1344 (Table 3); q_RO < t * 2^-18; t >= 2^32; Adv_CPA(B)/t <=
    2^-134.5 at Frodo-640 under column C.
    GATE CONVENTION, MADE EXPLICIT 2026-08-24 BECAUSE IT IS OUTCOME-CHANGING: Table 4 prints
    IND-CPA as an integer (145 / 208 / 262 under column B) while the caption's own recipe applied
    to Table 7 gives 145.8 / 208.6 / 262.8. The gate must be run under BOTH and both reported.
    FV-1 shows the 976-B binding-term verdict flips between them.
    A LANE-LEVEL CONSEQUENCE THE COORDINATOR MUST BE TOLD (this record does not act on it):
    GOAL-FRODO-002.completion_criteria[1] says 'the published bit-security figure' without
    saying which, and the two candidates differ by about 9 bits at level 1 (149.8 raw LWE ->
    145.8 after Theorem 3's 4 bits -> ~140.9 after the transform -> Table 4's 140). The lane's
    headline question - does FrodoKEM charge the reduction? - is therefore ALREADY ANSWERED IN
    PRIMARY TEXT: it does, about 4 bits for the distribution/sample-count reduction and about 5
    more for the transform at Frodo-640 column B.
  forced_value_derivations:
    - id: FV-1
      question: >-
        Does the statistical residue of Eq. (7) bind before the computational term at the
        single-target point? (The old predictions[0] / falsification_conditions[0] headline.)
      status: >-
        FORCED - answered by arithmetic before any run; withdrawn as an estimand. REDONE FROM
        SCRATCH 2026-08-24 (second repair pass); the first pass's numbers are superseded and the
        error is stated below.
      derivation: >-
        Write F_P = exp(s * D_alpha)^(1 - 1/alpha). From Table 3 and Section C.1.1:
        F_640 = exp(20544 * 0.0000324)^0.995 = 1.9394 (log2 = 0.9556);
        F_976 = exp(31296 * 0.0000140)^0.998 = 1.5485 (log2 = 0.6308);
        F_1344 = exp(43072 * 0.0000264)^0.999 = 3.1146 (log2 = 1.6387).
        TERM-BY-TERM, normalizing Eq. (3) by t exactly as Section C.1.1 does, at n_u = n_c = 1,
        with q_RO/t = 2^-18 and 1/t <= 2^-32. The five bracketed terms are multiplied by 2 * F;
        the three trailing terms carry COEFFICIENT 1. Writing each as log2:
        R1 = 2 * F * 6 * q_RO/|M| / t  -> log2(12) + log2 F - 18 - lenmu
        R2 = 2 * F * 2^-lambda / t     -> negligible, lambda >= 512
        R3 = 2 * F * n_c/|M| / t       -> 1 + log2 F - 32 - lenmu
        R4 = 2 * F * q_RO * delta(1)/t -> 1 + log2 F - 18 + log2 delta(1)
        R5 = delta(1)/t                -> log2 delta(1) - 32
        R6 = q_RO/|M| / t              -> -18 - lenmu
        R7 = n_u n_c (n_c - 1)/(|M| 2^lensalt)/t -> zero at n_c = 1.
        Frodo-640 (lenmu 128, delta(1) 2^-138.7): R1 = -141.46, R6 = -146.00, R4 = -154.74,
        R3 = -158.04, R5 = -170.70; SUM = 2^-141.40, binding term R1 (message space).
        Frodo-976 (lenmu 192, delta(1) 2^-199.6): R1 = -205.78, R6 = -210.00, R4 = -215.97,
        R3 = -222.37, R5 = -231.60; SUM = 2^-205.71, binding term R1.
        Frodo-1344 (lenmu 256, delta(1) 2^-252.5): R4 = -267.86, R1 = -268.78, R6 = -274.00,
        R5 = -284.50, R3 = -285.36; SUM = 2^-267.23, binding term R4 (CORRECTNESS, not message
        space - at lenmu 256 the target failure rate 2^-252.5 exceeds 1/|M| = 2^-256, which
        reverses the ordering that holds at 640 and 976).
        The COMPUTATIONAL term is 4 * F * (Adv_CPA/t), i.e. log2 = 2 + log2 F + log2(Adv_CPA/t).
        Both residue and computational term are constants in t. Their RATIO therefore never moves
        along the paper's own ray, so 'H(P) versus the category floor' cannot discriminate
        anything - which is the forcing result and the reason the old headline is withdrawn.
        SIX CELLS, UNROUNDED CONVENTION (Adv_CPA/t from Table 7 minus Theorem 3's 4 bits):
        640-B comp 2^-142.84 vs residue 2^-141.40 -> RESIDUE BINDS by 1.45 bits;
        640-C comp 2^-131.54 -> computational binds by 9.9 bits;
        976-B comp 2^-205.97 vs residue 2^-205.71 -> RESIDUE BINDS by 0.26 bits;
        976-C comp 2^-192.37 -> computational binds;
        1344-B comp 2^-259.16 vs residue 2^-267.23 -> computational binds by 8.1 bits;
        1344-C comp 2^-246.36 -> computational binds.
        SAME SIX CELLS, TABLE 4's PRINTED INTEGER IND-CPA (145 / 208 / 262 at B): 640-B comp
        2^-142.04, residue still binds by 0.65 bits; 976-B comp 2^-205.37, and the
        COMPUTATIONAL TERM NOW BINDS - the verdict at that cell is decided by the rounding
        convention, not by the mathematics; 1344-B comp 2^-258.36, computational binds either way.
      consequence: >-
        (i) The old headline is withdrawn. (ii) The structural finding recorded in its place is
        NARROWER than the first repair pass stated: FrodoKEM's level-1 beyond-core-SVP IND-CCA
        figure is set by the statistical residue rather than by the LWE term under either
        convention; the level-3 figure is set by it only under the unrounded convention; and the
        residue does not bind at the other four cells. Confirmed at one cell, convention-dependent
        at a second, refuted at four. (iii) The remaining estimand must be a quantity that MOVES,
        which is why the record is repointed onto (n_u, n_c) and lensalt.
        (iv) A term-ordering fact worth carrying into the multi-target arm: at Frodo-1344 the
        correctness term ALREADY dominates the residue at n_u = 1, so the 1344 multi-target arm
        starts in the regime E-DELTA describes.
      caveat: >-
        HAND-COMPUTED BY THE IDEA-GENERATOR ON 2026-08-24 FROM THE TRANSCRIBED CONSTANTS. NOT
        MACHINE-VERIFIED, NOT A RUN, AND NOT EVIDENCE.
        WHAT THE FIRST REPAIR PASS GOT WRONG, STATED SO IT CANNOT BE RE-INHERITED: it gave the
        three trailing terms R5, R6, R7 a coefficient of 2 that Eq. (3) does not have, and it
        omitted R4 at Frodo-1344. Its residues (2^-141.34 / 2^-205.66 / 2^-268.70), its NULL-3
        threshold (3.65 bits), its NULL-4 coefficient (c = 12F + 2 = 25.27) and its FV-2 crossings
        are all superseded by the values here. The red team's own figure for the leading
        coefficient at Frodo-640, 24.3, agrees with 12 * F_640 + 1 = 24.27 and not with 25.27,
        which is independent corroboration of the correction.
        TOTAL-BOUND CHECK AGAINST TABLE 4, as -log2(residue + computational), unrounded
        convention: 640-B 140.95, 640-C 131.54, 976-B 204.83, 976-C 192.37, 1344-B 259.16,
        1344-C 246.36. Four of six floor to the published IND-CCA (ROM) value (140, 204, 192,
        246). TWO DO NOT: 640-C gives 131.54 against the paper's own stated 2^-130.876, a gap of
        0.67 bits (a factor of about 1.59 on the computational term); and 1344-B gives 259.16,
        which floors to 259 where Table 4 prints 258, a gap of at least 0.16 and at most 1.16
        bits depending on the paper's unprinted fractional part.
        RESOLVING BOTH IS THE GATE'S FIRST DELIVERABLE and each has three admissible outcomes: an
        arithmetic error by this session, a rounding or evaluation convention in the paper, or a
        term mis-read by this session from a PDF text extraction. None of the three is assumed.
    - id: FV-2
      question: >-
        Where does the multi-target residue first bind, and does the salt move it? (The
        repointed estimand - this one is NOT forced and is what the run is for.)
      status: PREDICTED, NOT FORCED - both branches are reachable.
      derivation: >-
        Continuing FV-1's normalization at Frodo-640 with the corrected single-target residue
        baseline 2^-141.40 per unit t. The threshold is 'the multi-target term equals the
        single-target residue', which raises the per-unit-t bound by one bit.
        SALT-COLLISION TERM R7, coefficient 1: n_u n_c (n_c - 1)/(|M| 2^lensalt)/t, which at
        lensalt = 0 (eFrodoKEM) is about n_u * n_c^2 * 2^-160. It reaches the baseline at
        log2(n_u n_c^2) = 18.60. At the specification's own informative cap n_c < 2^8
        (Section 5) that is n_u ~ 2^2.6, i.e. about 6 public keys. At lensalt = 256 (FrodoKEM)
        the same term is 2^256 smaller and never binds anywhere in a physically statable range.
        CORRECTNESS TERM R4: 2 * F * q_RO * delta(n_u)/t, which under the paper's own
        delta(n_u) <= delta(1) n_u is n_u * 2^-154.74, reaching the baseline at n_u = 2^13.35.
        This term is IDENTICAL in both variants.
        MESSAGE-COUNT TERM R3: n_c * 2^-158.04, reaching the baseline at n_c = 2^16.65; also
        identical in both variants.
        ALONG THE DECLARED RAY n_c = 2^8, SWEEPING n_u: the salt-free arm crosses at
        n_u = 2^2.60 (R7 binding); the salted arm's R7 is dead, R3 contributes a fixed
        2^-150.04 (still 11.4 bits under the baseline at n_c = 2^8), so the salted arm crosses at
        n_u = 2^13.35 (R4 binding). Separation: 10.75 bits in log2(n_u), equivalently in
        log2(n_u n_c^2) at fixed n_c.
      consequence: >-
        The two explanations of claim (D) are separated by a computable margin ON A DECLARED RAY:
        E-SALT predicts about 10.7 bits of separation at Frodo-640 on the n_c = 2^8 ray; E-DELTA
        predicts under 1 bit because the correctness term would dominate first in both arms.
        THE FIRST PASS'S '12 bits' IS SUPERSEDED BY 10.75, AND THAT MATTERS: it sits only 0.75
        bits above the previously declared 10-bit decision threshold, which is less than the
        width of the H3 band, so a 10-bit threshold would have been decided by the looseness of
        delta(n_u) <= delta(1) n_u rather than by the salt. predictions[2] therefore states a
        decision rule with an explicit indeterminate band instead.
        If the run returns the two arms EXACTLY EQUAL, the pipeline is not reading lensalt and the
        run is void (that is the NULL-5 ablation control, not a finding).
      caveat: >-
        HAND-COMPUTED 2026-08-24, NOT MACHINE-VERIFIED, NOT A RUN. delta(n_u) <= delta(1) * n_u is
        the paper's cited upper bound [DHK+21] which the paper itself calls loose; H3 governs it
        and the run must report the crossing both under that bound and with delta(n_u) swept.
        The separation figure is ray-dependent by construction: on a ray with small n_c the
        salt-collision term is weak and the separation shrinks, and reporting a single scalar
        separation without its ray is not a permitted deliverable.
