# IDEA-20261003-18748d
# Wider window-table count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-18748d
  question_id: RQ-ECDLP-002
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    A width-5 window table stores 16 entries and a width-4 table stores 8
  class: representation
  claim: >-
    A window of width 5 stores 16 precomputed entries. A window of
    width 4 stores 8. Sixteen exceeds eight by 8. The product of
    the two table sizes is 128. Their sum is 24. The gap is a
    table size, not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the precomputed table. The operation
    set is reading one entry during a recoding. Two to the power
    4 is 16. Two to the power 3 is 8. Two width-4 tables both
    store 8, so that gap is 0 and their product is 64. No curve
    point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-ea34b8
      provenance: internal
      claim: >-
        Precomputation-table bounds are a different scale from these two sizes.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two widths are frozen before the powers are taken.
    - No curve point is added.
  proof_search_map:
    bottleneck: The table-size gap 8.
    baseline_embedding:
      parameter_slice: The widths 5 and 4 and the sizes 16 and 8.
      reproduction_check: >-
        Two readers must agree that 2 to the power 4 is 16 and that
        2 to the power 3 is 8.
    observation_collision:
      observable: The table-size gap and the product.
      distinct_preimage_search: >-
        Reporting both tables as size 8 drops the gap. Two width-4
        tables make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The width-4 table.
        predicted_gain: Eight fewer stored entries. No exponent.
    quantifier_order: >-
      The widths are fixed before the sizes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table sizes 16 and 8. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-4 tables. Both store 8, and the gap is 0.
    proof_obligations:
      - claim: The width-5 table stores 16 entries.
        responsibility: size
      - claim: The width-4 table stores 8 entries.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: table_gap
      direction: different
      minimum_effect: Sixteen exceeds eight by 8.
  minimal_test:
    design: >-
      Compute 2 to the power 4 and 2 to the power 3. Do not add a
      curve point.
    controls:
      - Two width-4 tables, whose size gap is 0.
      - An independent count.
    required_metrics:
      - both table sizes
      - the gap
      - the product
  falsification_conditions:
    - The width-5 table size is not 16.
    - The product of the two sizes is not 128.
  confounders:
    - A width-4 table of size 8 is a different window from a width-3 table of size 4.
  interpretation_limits:
    - A table size is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the table-size pair 8 and 4.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen width-5 table has size 2 to the power 4, and the
        frozen width-4 table has size 2 to the power 3.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of two powers of 2.
      validation_plan: >-
        Two independent powers. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Sixteen stored entries versus eight, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Recoding cost is not counted.
    tradeoff_note: A larger table can shorten digits and does not by itself shorten a walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-ea34b8
      - KR-RHO-13bf67
      - KR-RHO-898783
      - KR-IC-5a43e5
      - KR-IC-73db3f
    nearest:
      - ref: KR-RHO-ea34b8
        provenance: internal
        relation: adjacent
        delta: >-
          That row bounds precomputation tables at cryptographic
          size. This record counts table sizes 16 and 8 and claims
          no precomputation attack.
  dominated_by: >-
    No attack is claimed. Rho dominates any attack reading of a table size.
  sota_delta:
    time: zero attack delta
    memory: a constant factor of 16 versus 8
    data_queries: Two frozen widths.
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
