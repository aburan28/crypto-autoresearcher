idea:
  id: IDEA-20261007-b1e64d
  question_id: RQ-SSI-001
  added: '2026-10-07'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    The 5-division polynomial of y^2 = x^3 + 1 over F_137 has a root
    in F_137.
  class: measurement
  claim: >-
    Let p = 137 and let E be y^2 = x^3 + 1 over F_137. Require
    #E(F_137) = 138. Let psi_5 be the 5-division polynomial of E in
    F_137[x], of degree (25 - 1)/2 = 12. The claim is that psi_5 has
    at least one root in F_137. This is one root count. It does not
    assert that a formal derivative is zero, it does not evaluate
    Frobenius on points, and the exponent delta against the opened
    Õ(p^{1/4}) baseline is 0.
  mechanism: >-
    A root in F_137 is an x-coordinate of a 5-torsion point defined
    over F_137, hence a candidate cyclic kernel of order 5 over the
    base field. No root means every 5-torsion x-coordinate lies in a
    proper extension. Either outcome is a count in 0..12. A positive
    count is not an isogeny path.
    OBJECT FRAME. Representation: psi_5 as a polynomial in F_137[x].
    Operation set Sigma: evaluation of psi_5 at the 137 field
    elements, not translation. TRICHOTOMY: coordinate-dependent.
    Reason: a root is a coordinate, not a group element.
    LOSSY-PROJECTION TEST against Sigma. Discarded: the y-coordinates, the
    kernel polynomial factors over extensions, and the codomain.
    Retained: the integer number of roots in F_137. Many torsion
    configurations can share one count, so the projection is lossy.
  novelty_status: unverified
  citations:
    - ref: KN-TECH-024
      provenance: internal
      claim: >-
        The opened note states that ell-isogenies are the edges of
        the supersingular graph and gives the path-finding exponents.
        It gives no 5-division polynomial at p = 137.
      verified_by: coordinator, this design session, via knowledge/techniques/KN-TECH-024.md
    - ref: KN-OPEN-013
      provenance: internal
      claim: >-
        The opened note reports no sub-p^{1/4} generic attack. This
        idea does not search for a path.
      verified_by: coordinator, this design session, via knowledge/open-problems/KN-OPEN-013.md
  assumptions:
    - p = 137 is prime. The test checks that.
    - The root count is scored only when #E(F_137) = 138. A different count leaves the polynomial unscored.
    - psi_5 is the standard division polynomial whose roots are the x-coordinates of points of order dividing 5, excluding O. Its degree on a nonsingular curve is 12.
    - A root is counted in F_137 without multiplicity for the success bit. The recorded metric still stores the multiplicity-free count.
  predictions:
    - metric: number of distinct roots of psi_5 in F_137
      direction: higher
      minimum_effect: 1
  minimal_test:
    design: >-
      Confirm p = 137 is prime and count E(F_137). If the count is
      not 138, stop. Compute psi_5, confirm its degree is 12 and that
      it is not the zero polynomial, and evaluate it at every element
      of F_137. Record the number of roots. Do not apply Vélu and do
      not form a codomain.
    controls:
      - The curve discriminant is nonzero.
      - Degree of psi_5 is 12. Any other degree invalidates the count.
      - psi_5 is not the zero polynomial. The zero polynomial is not a root count.
      - For one named root, if any, the corresponding points have order 5. A failure invalidates that root.
    required_metrics:
      - point_count
      - psi5_degree
      - root_count
      - root_list
  falsification_conditions:
    - root_count is 0, while the point count is 138 and psi_5 has degree 12.
    - "#E(F_137) is not 138, so the root count is not scored."
    - psi_5 is the zero polynomial or has degree other than 12.
  confounders:
    - A root gives an x-coordinate. It does not by itself name which of the two y-values, when both exist, generates a cyclic kernel.
    - Roots in a quadratic extension are invisible to this count. Absence in F_137 does not say psi_5 has no root in F_{137^2}.
  interpretation_limits:
    - One polynomial at p = 137. No statement about ell = 29 or about a derivative.
    - Zero roots reject only this base-field count. They do not close path-finding.
    - A positive count is not a codomain j and not a path.
    - Exponent delta against Õ(p^{1/4}) is 0.
  heuristic_assumptions:
    - id: H1
      statement: >-
        psi_5 is treated as if it had a root in F_137 whenever the
        curve has F_137-rational 5-torsion x-coordinates. That is the
        prediction under test. It is not a theorem about this model.
        The sample is one polynomial. No transfer is claimed.
      rigorous_support: >-
        KN-TECH-024, opened, identifies ell-isogenies with edges and
        does not compute psi_5 at p = 137. The test uses the division
        polynomial over F_137.
      validation_plan: >-
        Compute psi_5 once after the point-count gate. Checks are
        degree 12, non-vanishing, and order 5 for one root if a root
        exists. Sample size one has no tail. No second prime is drawn.
  target_complexity:
    time_exponent: >-
      One division polynomial of degree 12 and 137 evaluations.
      Polynomial in the fixed p. No path search is run.
    memory_exponent: >-
      One polynomial of degree 12. No p^{1/2}-sized table is stored.
    best_known: >-
      KN-LIT-078 via the opened KN-TECH-024 note: Õ(p^{1/2})
      classically on the full graph and Õ(p^{1/4}) on the F_p
      subgraph. Neither is claimed.
    hidden_overhead: >-
      No o(1) term. Degree 12 and the field F_137 are explicit. The
      output is one integer in 0..12.
    tradeoff_note: >-
      No time-memory tradeoff and no isogeny evaluation. One
      polynomial.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      This is a toy root count of one division polynomial. It is not
      an ECDLP rho or index-calculus row. No KR-* row was claimed.
    nearest:
