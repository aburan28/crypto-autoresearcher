  assumptions:
    - >-
      The reductions' theorem statements are correct as published. This proposal audits their
      COST, not their correctness, and a correctness failure would invalidate the ledger without
      being detected by it.
    - >-
      log2(q/sigma) is a meaningful bookkeeping coordinate for this comparison. It is NOT by
      itself a hardness measure -- hardness depends jointly on (d, R) -- which is why the object
      is a pair and why Stage 2 exists. The R = 0 floor, however, is unconditional: at sigma >=
      q/2 the samples are independent of the secret.
    - >-
      Both reductions are stated for a noise model (Gaussian or continuous-Gaussian) that is not
      exactly ML-KEM's centred binomial. Applying them to CBD requires either a CBD-to-Gaussian
      transfer step with its own cost, or the explicit statement that the ledger is computed for
      the Gaussian instance of matched sigma. THIS IS A REAL GAP AND IS DECLARED, NOT ABSORBED:
      Stage 0 must record which of the two it does.
    - >-
      The free constant c and the smoothing parameter eps are NOT free: they are pinned by a
      declared negligibility level nu through delta = 2n exp(-pi n^{2c}) <= nu and
      (2d+10) eps m <= nu. The ledger is reported at three values of nu so that the choice's
      contribution in bits is a visible column. Any ledger that instantiates c "favourably"
      without exhibiting the inequality that bounds it is invalid, because c -> 0 makes delta
      vacuous (delta = 512 e^{-pi} = 22 at n = 256).
    - >-
      Corollary 3's spherical-error correction is REQUIRED by this pipeline, because the Stage-2
      estimator has no input for a skewed (ellipsoidal) error. Its search-only restriction
      (Renyi-divergence argument) therefore propagates into the ledger: a decision-variant rung
      may not use it, and rungs are tagged accordingly.
    - >-
      The estimator used in Stage 2 is applied identically to both arms, at the same version and
      cost model, and the reported quantity is a difference. No absolute cost from it is quoted.
    - >-
      Any conclusion is scoped to the exact reduction chain evaluated. Other reduction networks
      (module-SIS, worst-case-to-average-case, quantum routes) are untouched.
  proof_search_map:
    bottleneck: >-
      The total per-step charge against R at (n, k) = (256, 3): Corollary 2's log2 B_A plus
      Corollary 3's spherical-error column. If that total exceeds R_0 = 11.70 the entire chain is
      dead at rung one and nothing downstream can revive it; if it falls below R_0 the chain is
      open and the descent depth becomes a free parameter -- though Corollary 5's single-shot
      descent then charges a further 6.5 bits for the first halving at c = 0.215. Lowering the
      concrete prefactor sqrt(2d) r q n^c, or removing the spherical-error requirement by
      supplying an estimator that scores skewed errors natively, are the two things that would
      change the theorem's applicability to FIPS parameters.
    baseline_embedding:
      parameter_slice: >-
        i = -1: the un-reduced ML-KEM instance itself, at (d, R) = (2*256*k, log2(q/sigma)). This
        is the exact boundary of the family -- the chain applied zero times -- and every rung is
        compared against it under identical accounting.
      reproduction_check: >-
        Two frozen fixtures. (a) The Stage-2 estimator, run on the i = -1 rung, reproduces the
        published Kyber/ML-KEM core-SVP blocksize for the same cost model to within a declared
        tolerance recorded before the run. If it does not, the estimator arm is void and only
        Stage 0 and Stage 1 are reportable -- stated in advance precisely so that a Stage-2
        failure cannot silently downgrade into a Stage-0 conclusion. (b) SYMBOLIC FIXTURE ON THE
        PAPER'S OWN ASYMPTOTICS: the Stage-0 evaluator, run in the limit that suppresses the
        logarithmic and constant factors the paper itself ignores, must reproduce the abstract's
        n^{c+1/2} sqrt(d) form. If it does not, the concrete-constant implementation disagrees with
        the source's own summary of itself and nothing is reportable.
    observation_collision:
      observable: >-
        The hardness coordinate C = (d, R). It is the certificate carrying the whole argument, and
        it is deliberately lossy.
      distinct_preimage_search: >-
        THE COLLISION IS REAL AND IS ADMITTED UP FRONT: instances with identical C can have very
        different attack costs -- a q-ary LWE instance and a structured module instance at matched
        (d, R) is exactly such a pair, and it is NULL-1. C is therefore NOT identifying, and the
        proposal's conclusions are restricted to what C legitimately bounds: the information-
        theoretic floor at R = 0 (which no collision can breach, since R <= 0 makes the samples
        independent of the secret for every instance in the fibre) and the ESTIMATOR-RELATIVE
        comparison in Stage 2 (where the collision is handled by scoring both arms with the same
        estimator rather than by claiming C determines cost). Any conclusion that would require C
        to be identifying is out of scope and must not be drawn.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The image instance under the composed Albrecht-Deo chain, in which ML-KEM's module
          structure is exchanged for a rank-1 ring instance at an exponentially larger modulus and
          an exponentially smaller ring dimension.
        predicted_gain: >-
          Predicted NEGATIVE at ML-KEM parameters, and now predicted negative AT RUNG ONE: the
          concrete constants of Corollary 2 and Corollary 3 charge about 9.4 + 4.4 = 13.8 bits
          against an 11.70-bit budget. The proposal's value is the size of that loss and its
          decomposition into named columns (prefactor, c-choice, eps-choice, spherical
          correction), and the transform is selected precisely because its encoding, completeness,
          soundness and cost-loss obligations are already discharged by a published theorem,
          leaving only the cost-loss to be measured.
    quantifier_order: >-
      FOR ALL parameter sets P in {ML-KEM-512, 768, 1024}, FOR ALL descent depths i >= 0 for which
      the chain's hypotheses hold, THERE EXISTS no i such that the estimated attack cost of the
      i-th rung of P, scored by the frozen estimator under matched accounting, is strictly below
      the estimated attack cost of P itself. The negation -- THERE EXISTS P and THERE EXISTS i
      with strictly lower cost -- is the E2 outcome and is what the run is built to be able to
      report. Note the witness i is allowed to depend on P; nothing here claims a uniform i. Note
      also that under Stage 0's concrete constants the quantifier is vacuously satisfied on ML-KEM
      (no rung is ALIVE), which is why the same statement is also posed over NULL-2, where it is
      not vacuous.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "under the frozen cost model, the concrete constants of Corollary 2 and Corollary
        3 at declared (c, eps, nu, m), and Corollary 5's single-shot descent, no rung of THIS chain
        improves on the direct attack at these parameter sets, and the per-rung exchange rate is X
        bits of log2(q/sigma) for a factor 2^i of dimension." It cannot certify that no reduction
        helps, cannot certify anything about reductions not evaluated, cannot certify anything
        about actual attack cost as opposed to estimated cost, and cannot certify anything about
        the DECISION variant of any rung that used Corollary 3.
      nearby_object_control: >-
        The nearby object on which the hoped-for conclusion FAILS is NULL-2, the budget-relaxed
        instance with R_0 about 40 bits. If the method reports "no rung improves" for both ML-KEM
        and NULL-2 identically, the method has not identified ML-KEM's small budget as the
        load-bearing structure and its ML-KEM verdict carries no scheme-specific content. Running
        both is required, not optional, and is doubly so now that Stage 0 predicts ML-KEM's own
        ledger to be empty.
    proof_obligations:
      - claim: 'R_0 = log2(q/sigma) computed from FIPS 203 constants: 11.70 (768/1024), 11.41 (512).'
        responsibility: baseline
      - claim: 'At sigma >= q/2 the LWE samples are independent of the secret, so R = 0 is an absolute floor.'
        responsibility: correctness
      - claim: 'Corollary 2 transcribed verbatim with its admissibility condition on r and its advantage-loss term.'
        responsibility: correctness
      - claim: 'c and eps pinned by delta = 2n exp(-pi n^{2c}) <= nu and (2d+10) eps m <= nu at declared nu; the bounding inequality exhibited.'
        responsibility: size
      - claim: 'log2 B_A = log2(sqrt(2d) * r q * n^c) evaluated per parameter set; ~9.4 bits at d = 3, nu = 2^-40.'
        responsibility: size
      - claim: 'Corollary 3''s spherical-error column, with its m-dependence, its multiply-or-replace reading settled from the corollary, and its search-only restriction.'
        responsibility: size
      - claim: 'The descent charge is read from Corollary 5 in single-shot form; composing halvings is forbidden and its overcharge (5.0 bits at depth 2, c = 0.215) is reported.'
        responsibility: correctness
      - claim: 'The estimator reproduces the published i = -1 baseline within a pre-declared tolerance.'
        responsibility: baseline
      - claim: 'The Stage-0 evaluator reproduces the abstract''s n^{c+1/2} sqrt(d) form in the paper''s own asymptotic limit.'
        responsibility: baseline
      - claim: 'NULL-1 emits exactly one rung; the pipeline checks hypotheses before applying them.'
        responsibility: interface
      - claim: 'The verdict is scoped to this chain, this cost model, these (c, eps, nu, m), and these parameter sets.'
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: >-
        log2 B_A, the error-rate blow-up of the MLWE -> RLWE step at (n,k) = (256,3), computed
        from Corollary 2's concrete constants at declared (c, eps) and expressed in bits
      direction: different
      minimum_effect: >-
        A THREE-WAY PREDICTION, stated so that each branch names what it would mean.
        (i) ASYMPTOTIC READING 4.79 bits = log2(n^{1/2} sqrt(d)) at n = 256, d = 3, c -> 0: this
        is what the abstract's form gives when the concrete constants are dropped AND c is taken
        to zero. A measured 4.79 would mean the concrete constants are not load-bearing at n = 256
        and the record's Stage-0 arithmetic is wrong.
        (ii) CONCRETE READING ~9.4 bits (9.25-9.53 over eps in [2^-64, 2^-40] at d = 3): the
        prediction. Declared tolerance +/- 0.3 bits at fixed nu.
        (iii) SUPERSEDED READING 16.79 bits = log2(n^2 sqrt(d)): the 2017 wording. A measured
        16.79 would mean the implementation is reading the superseded version.
        Any value outside all three branches by more than the declared tolerance is itself the
        finding and must be reported as an error in the proposer's arithmetic.
    - metric: 'Corollary 3 spherical-error column, in bits, at n = 256 and the Stage-2-optimal m'
      direction: different
      minimum_effect: >-
        Predicted 4.40 bits at m = 768 under the (mn)^{1/4} reading, with the column reported both
        as a multiplier of and as a replacement for Corollary 2's sqrt(2d) prefactor until the
        reading is settled from the corollary text. A column below 3 bits or above 6 bits at
        m = 768 means the m-dependence was mis-transcribed.
    - metric: 'number of ALIVE rungs (R_i > 0) for ML-KEM-768 under the composed chain, with the spherical-error column included'
      direction: lower
      minimum_effect: >-
        Predicted EXACTLY 0 at every declared nu. A count of 1 or more falsifies the Stage-0
        arithmetic and re-opens the chain, which is the outcome that would most change this
        record's priority. Reported separately WITHOUT the spherical column, where the prediction
        is also 0 because the residual 2.3 bits does not buy Corollary 5's 6.5-bit first descent.
    - metric: >-
        signed difference in estimated primal blocksize, rung i minus the i = -1 baseline, on
        NULL-2 (budget-relaxed, R_0 ~ 40 bits), under matched accounting
      direction: higher
      minimum_effect: >-
        +1 blocksize unit. This is where the E1/E2 discrimination actually lives, because ML-KEM
        itself is predicted to have no ALIVE rung to score. A difference of zero or negative at
        any ALIVE NULL-2 rung is the E2 outcome and must be escalated rather than absorbed.
    - metric: >-
        overcharge in bits from composing Corollary 5 halvings versus its single-shot form, at
        descent depth 2 (256 -> 64)
      direction: higher
      minimum_effect: >-
        Predicted 5.0 bits at c = 0.215 and 3.5 bits at c -> 0. A measured overcharge of zero
        would mean the composition and single-shot forms agree and the earlier draft's
        rung-by-rung model was not pessimistic after all.
  minimal_test:
    design: >-
      STAGE 0 ONLY, as the minimal test, and it needs no lattice, no estimator and no sieve.
      One to two person-hours: re-fetch eprint 2017/612 (current version), transcribe Corollary 2,
      Corollary 3 and Corollary 5 with their admissibility conditions and locators, declare nu,
      solve the two inequalities that pin c and eps, evaluate sqrt(2d) * r q * n^c per parameter
      set, evaluate the spherical-error column at the Stage-2-optimal m both ways, recompute R_0
      for all three ML-KEM parameter sets from FIPS 203 constants, subtract, and emit the rung
      table with each rung marked ALIVE/MARGINAL/DEAD and tagged search-only where Corollary 3 was
      used. Compute time: seconds of arithmetic, single core.
      IT DISCRIMINATES BECAUSE the three-way prediction above assigns a DIFFERENT MEANING to each
      of three separated values of one number computed from one source: 4.79 says the concrete
      constants do not bind at n = 256, ~9.4 says they do and the chain is dead at rung one,
      16.79 says the implementation read the superseded version. It is not a straddle and it is
      not a version dispute -- the version question is settled by the changelog before the run --
      it is an arithmetic question with three named answers and three named consequences. The
      subtraction has no confidence interval; what it has is a declared dependence on nu, and that
      dependence is reported as a column.
      Stages 1-3 are the follow-on. On ML-KEM they are only worth running if Stage 0 returns ALIVE
      rungs, which is predicted not to happen; on NULL-2 they are worth running regardless,
      because that is where the mechanism can be exercised. If Stage 0 returns zero ALIVE rungs on
      ML-KEM the deliverable is a closure with a named obstruction, a number, a decomposition of
      that number into named columns, and forward guidance (any future reduction-cascade proposal
      against ML-KEM must exhibit total error-rate blow-up below 11.70 bits INCLUDING whatever
      correction its own scoring pipeline requires, or it is dead on arrival), and no compute is
      spent at all.
    controls:
      - >-
        NULL-1, the structure-deleted instance at matched (d, R): the chain's hypotheses fail, the
        correct rung count is 1, and a second rung voids the pipeline.
      - >-
        NULL-2, the budget-relaxed instance at R_0 ~ 40 bits, swept over at least four R_0 values
        between 11.70 and 40 so the monotonicity of the blocksize difference in R_0 is reported
        rather than assumed. Load-bearing, since ML-KEM itself is predicted to have no ALIVE rung.
      - >-
        Estimator baseline fixture: the i = -1 rung must reproduce the published core-SVP
        blocksize within a tolerance declared before the run.
      - >-
        ASYMPTOTIC-LIMIT FIXTURE: the Stage-0 evaluator, run in the paper's own asymptotic limit,
        must reproduce n^{c+1/2} sqrt(d). This is what separates "the concrete constants are large"
        from "the transcription is wrong".
      - >-
        Reading control: the exact source text for each blow-up factor, admissibility condition
        and advantage-loss term is quoted verbatim into the run record with a corollary or section
        locator AND the version date, so a later reader can check the subtraction against the
        source without re-fetching, and so that a superseded version cannot re-enter unnoticed.
      - >-
        Both arms of every comparison scored by the same estimator invocation, same version, same
        cost model, same seed policy.
    required_metrics:
      - 'R_0 per parameter set, to two decimals, with the constants it was computed from'
      - 'the declared nu, and the c and eps it pins, with the two inequalities exhibited'
      - 'log2 B_A per parameter set at each nu, with the verbatim Corollary 2 text and locator'
      - 'the spherical-error column at the Stage-2-optimal m, both readings, with verbatim Corollary 3 text and the search-only tag'
      - 'the descent charge per target dimension from Corollary 5 single-shot, and the composition overcharge'
      - 'the full rung table (i, ring dimension, module rank, log2 q_i, log2 sigma_i, d_i, R_i, status, variant tag)'
      - 'ALIVE rung count per parameter set, with and without the spherical column'
      - 'signed blocksize difference per ALIVE rung versus the i = -1 baseline (NULL-2 in practice)'
      - 'the same for NULL-2 at each swept R_0, with monotonicity in R_0 reported'
      - 'NULL-1 rung count'
      - 'estimator baseline fixture and asymptotic-limit fixture, pass/fail with tolerances declared beforehand'
  falsification_conditions:
    - >-
      Stage 0 gives total per-step charge > R_0 for every parameter set. The chain is closed at
      rung one, the E2 branch is unreachable for this chain on ML-KEM, and the deliverable is the
      budget, its column decomposition, and the closure -- a complete and useful negative. THIS IS
      THE PREDICTED OUTCOME.
    - >-
      Every ALIVE NULL-2 rung shows a strictly positive blocksize difference and the sign does not
      change across the swept R_0. The method is insensitive to the budget, and no scheme-specific
      conclusion may be reported.
    - >-
      The estimator baseline fixture fails. Stage 2 is void; only Stages 0 and 1 are reportable,
      and this is declared before the run so the downgrade cannot be presented as a result.
    - >-
      The asymptotic-limit fixture fails: the Stage-0 evaluator does not reproduce n^{c+1/2}
      sqrt(d) in the paper's own limit. The transcription of Corollary 2 is wrong and every number
      in claim (C2) is void.
    - >-
      NULL-1 emits more than one rung. The pipeline applies transformations without checking their
      hypotheses; no ledger it produced is reportable at all.
    - >-
      The recomputed log2 B_A at (256, 3) falls outside 9.4 +/- 0.3 bits at the declared nu while
      the asymptotic-limit fixture passes. The proposer's concrete arithmetic in (C2) is wrong,
      which is recorded as an error and reported with the corrected value.
    - >-
      The spherical-error column turns out NOT to be required -- e.g. an estimator that scores
      ellipsoidal errors natively is available and reproduces the baseline fixture. Then 4.4 bits
      come back onto the budget, the margin flips from about -2.1 to about +2.3 bits, and the
      chain must be re-scored against Corollary 5's 6.5-bit first descent rather than declared
      dead. This is the most likely route by which the predicted closure would be overturned.
    - >-
      Some ALIVE rung shows a blocksize difference of zero or below on ML-KEM itself. The
      proposal's headline prediction is FALSIFIED, and this is the single most valuable outcome
      available: a published polynomial-time reduction would then be leaking estimated security at
      standardised parameters, and the correct response is escalation to independent review, not
      a louder claim.
  confounders:
    - >-
      The two reductions are stated for Gaussian noise; ML-KEM's noise is centred binomial. Naive
      substitution of sigma hides a transfer step whose cost is not in the ledger. This is the
      largest single threat to the arithmetic and is why Stage 0 must declare which instance it is
      costing.
    - >-
      THE FREE CONSTANT c IS NOT ACTUALLY FREE, AND TREATING IT AS FREE IS THE FAILURE THE REPAIR
      PASS FOUND. "Instantiate c at its most favourable admissible value" is unbounded as an
      instruction: c -> 0 gives delta = 2n e^{-pi} = 22 at n = 256, a vacuous probability bound.
      c is admissible only relative to a declared negligibility target, and the ledger must
      exhibit the inequality that pins it. The same applies to eps through the (2d+10) eps m term.
      Reporting at three values of nu is the mitigation; a single "favourable" c is not reportable.
    - >-
      The spherical-error correction's magnitude depends on m, which the Stage-2 estimator also
      optimises. Optimising m for the estimator and then charging the correction at a different m
      would understate the total. The two must be optimised jointly and the chosen m reported.
    - >-
      Corollary 3's search-only restriction means a ledger that uses it says nothing about the
      decision variant. Mixing search-tagged and decision-tagged rungs in one verdict is a
      category error and the rung table must keep them separate.
    - >-
      Estimator version drift and cost-model choice can move absolute numbers by tens of bits.
      Mitigated by reporting differences only, but a model whose error depends on log q would
      still bias the comparison, since the rungs differ enormously in log q. This is a real
      residual and must be reported, not waved at.
    - >-
      Corollary 5's hypotheses may fail long before R reaches zero (very small target dimension,
      modulus no longer of the required shape). Marking rungs ALIVE purely by R > 0 would then
      overcount. The rung status must carry a separate hypotheses-hold flag.
    - >-
      Sample-count optimisation: the estimator's m-optimisation is itself a search, and a rung
      whose optimum m sits at a boundary is not comparable to one whose optimum is interior.
      Report the optimal m per rung.
  interpretation_limits:
    - >-
      No attack, break, speedup or exponent movement is claimed here or would follow from a
      negative run. A positive (E2) run would be an ESTIMATOR-RELATIVE anomaly and would still
      require independent verification before any security claim.
    - >-
      Every conclusion is scoped to the exact reduction chain, the exact parameter sets, the exact
      cost model, the exact estimator version, and the exact (c, eps, nu, m) used, and says
      nothing about other reductions, other schemes, or quantum routes.
    - >-
      The hardness coordinate C does not determine attack cost. Conclusions may rest on the R = 0
      floor (which is unconditional) and on estimator-relative differences (which are conditional
      on the estimator), and on nothing in between.
    - >-
      Stage 0's numbers in claim (C2)-(C4) are the proposer's arithmetic on verbatim theorem text
      read on 2026-08-21 from a PDF held only in an ephemeral session scratchpad. They are NOT
      measurements and no committed run supports them. Until a run re-fetches the source and
      recomputes them, they must be labelled as proposer arithmetic wherever they appear.
    - >-
      An earlier draft of this record presented two readings of the blow-up as a live dichotomy
      straddling the budget, and set recommended_priority: high on that basis. That was a version
      confusion resolved by the paper's own changelog, and the straddle no longer supports
      anything. Any downstream text quoting the straddle is quoting a withdrawn claim.
    - >-
      The claim-tier ceiling for this lane is toy-tier. Nothing here upgrades it: the ledger is a
      derivation, and the estimator arm is a model evaluation, not a solve.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (BLOW-UP FIDELITY) For all n a power of two, all module ranks d >= 1, all admissible
        (c, eps) and all error rates alpha in the range Corollary 2 quantifies over, the
        multiplicative error-rate blow-up of the MLWE -> RLWE step is exactly the factor
        sqrt(1 + 2 (r q n^c)^2 d) stated there, with no additional instance-dependent factor, and
        in particular no factor depending on the secret distribution's shape beyond its standard
        deviation.
      rigorous_support: >-
        Corollary 2 itself, which is a rigorous statement and not a heuristic, together with
        Lemma 7's tail bound Pr[max_i |sigma_i(s)| > sigma n^c] <= 2n exp(-pi n^{2c}) that supplies
        its (B, delta) pair. What is heuristic here is only the TRANSFER to ML-KEM's
        centred-binomial noise: the corollary quantifies over a discrete-Gaussian secret
        D_{(R^v)^d, alpha q}, and H1 asserts that a CBD_eta secret of standard deviation
        sqrt(eta/2) behaves under the reduction like a discrete Gaussian of the same standard
        deviation. The classical statement this imitates is the standard smoothing/Renyi-divergence
        argument by which CBD and discrete-Gaussian noise of matched variance are interchangeable
        for LWE hardness up to a small multiplicative loss in the distinguishing advantage. NOTE
        THAT THE CBD TAIL IS BOUNDED WHILE THE GAUSSIAN TAIL IS NOT, so Lemma 7's (B, delta) is
        conservative for CBD -- which is the safe direction for the ledger and must be stated as
        such rather than claimed as an improvement.
      validation_plan: >-
        Sample at reduced parameters where the reduction can be executed end to end: ring
        dimension n in {8, 16, 32}, d in {2, 3}, q = 3329, secret and error CBD_eta with eta in
        {2, 3}, 10^4 instances per cell. Apply the reduction as implemented, MEASURE the empirical
        standard deviation of the image error, and compare the measured blow-up against
        sqrt(1 + 2 (r q n^c)^2 d) with (c, eps) instantiated exactly as the ledger instantiates
        them. Compare the same quantity for a discrete-Gaussian secret of matched sigma; the
        CBD-versus-Gaussian ratio is the transfer factor H1 asserts to be 1 + o(1). TAIL CHECK:
        compare the empirical 99.9th percentile of the image error's absolute value against the
        Gaussian prediction, since a heavier image tail would break the ledger even at matched
        variance; and measure the empirical rate of the event max_i |sigma_i(s)| > sigma n^c
        against Lemma 7's delta, since that is the bound c is pinned by. TRANSFER ASSUMPTION,
        DECLARED: n in {8,16,32} is three to five doublings below 256 and the blow-up's dominant
        concrete factor r q = sqrt(n) sqrt(2 ln(2nd(1+1/eps))/pi) grows with n, so the measured
        cells constrain the FUNCTIONAL FORM in n and not the value at n = 256; the extrapolation
        to n = 256 is an assumption and must be labelled as one in every downstream use.
    - id: H2
      statement: >-
        (ESTIMATOR MONOTONICITY) For instances in the region swept by the ledger, the frozen cost
        estimator is monotone increasing in log2(1/alpha) at fixed lattice dimension and monotone
        increasing in dimension at fixed alpha, so that a sign change in the rung-versus-baseline
        difference reflects the (d, R) trade and not an artefact of the estimator's internal
        optimisation.
      rigorous_support: >-
        Monotonicity holds for the standard 2016-style uSVP success condition as an inequality in
        the root-Hermite factor, but the estimator optimises over sample count and over attack
        variants, and an optimiser's argmax need not vary monotonically. The classical statement
        being imitated is the Gaussian-heuristic/GSA cost model, in which required blocksize is a
        monotone function of the two coordinates.
      validation_plan: >-
        Before any rung is scored, sweep the estimator over a grid in (d, log2(1/alpha)) covering
        every rung's coordinates plus a margin, with at least 4 interior points per axis, and
        report whether the estimated blocksize is monotone across the grid in each axis
        separately. Report non-monotone cells explicitly. A non-monotone region containing any
        rung voids the directional reading of that rung's difference (KN-TECH-1a5b7e: two ends do
        not give a sign). This costs one extra table in a script that already exists.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED, and the honest statement is that the expected result is the
      absence of one. The quantity computed is a ledger; its cost is O(number of rungs) arithmetic
      operations for Stages 0-1, plus one estimator evaluation per ALIVE rung per parameter set
      for Stage 2 (predicted zero on ML-KEM itself, a few dozen on NULL-2). If the E2 branch
      fired, the claimed exponent would be whatever the estimator returns at the winning rung and
      would have to be stated then, not now.
    memory_exponent: >-
      No attack memory exponent is claimed. Stages 0-1 hold a table of a few dozen rows. Stage 2's
      memory is the estimator's own.
    best_known: >-
      For ML-KEM-768, the incumbent is the direct primal/dual lattice attack at the published
      core-SVP blocksize for the standard cost model; the i = -1 rung IS that incumbent and is the
      comparator. There is no incumbent at all for the quantity this proposal introduces -- no
      record in this repository states a modulus-to-noise budget for any scheme -- so on that axis
      the delta is the creation of a first number, not an improvement on one.
    hidden_overhead: >-
      Four things hide here and all four are declared. (1) The free constant c: "for any constant
      c > 0" is an ASYMPTOTIC licence, and at n = 256 the admissible c is bounded away from zero by
      delta = 2n exp(-pi n^{2c}); pinning it at nu = 2^-40 costs +1.72 bits, and the o(1) in
      n^{1/2+o(1)} is therefore not negligible at FIPS parameters. (2) The smoothing parameter eps
      enters through ln(2nd(1+1/eps)) inside r and is pinned by the advantage-loss term
      (2d+10) eps m; it contributes about 0.3 bits of spread over eps in [2^-64, 2^-40]. (3) The
      Gaussian-versus-CBD transfer, which is a real step with a real cost that the ledger does not
      currently charge. (4) The reductions are polynomial-time but their POLYNOMIAL is not costed
      anywhere here; a reduction that is polynomial with a large exponent could be more expensive
      than the attack it enables, and the ledger as designed would not see that. The
      spherical-error correction is NOT in this list because it is no longer hidden: it is an
      explicit ledger column.
    tradeoff_note: >-
      The chain IS a time-memory-like tradeoff of a different kind: it trades lattice dimension
      (which sets both sieve time and sieve memory, at 2^{0.292 beta} and 2^{0.208 beta} in the
      standard model) against modulus-to-noise ratio. That is precisely why a monotone answer is
      not automatic and why the ledger is worth writing. There is a second, sharper tradeoff the
      repair pass exposed: m buys estimator quality and simultaneously costs (mn)^{1/4} of
      spherical-error correction, so m is a genuine optimisation variable of the ledger and not a
      free parameter. Parallelisation is irrelevant at Stage 0 and is the estimator's own concern
      at Stage 2.
  dominated_by: >-
    'n/a (no result claimed)' for the attack axis: this proposal claims no attack, so no cost
    triple exists and there is no frontier row to be dominated by; writing null there would be a
    fabrication under AGENTS.md rule 5. On the DERIVATION axis the honest answer is different and
    is given rather than skipped: IDEA-20260805-574cd0 dominates on rigour within the lane -- it
    proves its subfield case symbolically and numerically -- and this proposal is strictly
    downstream of it, instantiating one of the classes 574cd0 names as unreached. On the
    reduction-descent axis, the draft IDEA-20260806-35d60b (RQ-RLWE lane) already reports a
    quantified negative for a DIFFERENT descent map, at ML-KEM-shaped parameters, in blocksize
    units (152.444 -> 152.445, noise-neutral; 233 vs 152 once the combination vector is charged).
    That is not a Pareto dominator -- different map, different currency, different lane -- but it
    is the nearest number in the repository and any reader comparing them must be told it exists.
  sota_delta: >-
    No attack; conceptual and derivation contribution only. Quantitatively: this repository
    contains NO value, no bound and no floor for the modulus-to-noise budget of any standardised
    scheme, and no rung-by-rung accounting of any reduction chain applied to FIPS 203 parameters.
    The delta is therefore the creation of a first pair of numbers -- R_0 = 11.70 / 11.41 bits and
    the per-step spend of a named published reduction, evaluated in CONCRETE constants (about 9.4
    bits from Corollary 2 plus about 4.4 bits from Corollary 3 at m = 768, against an asymptotic
    reading of 4.79) -- together with an information-theoretic floor that every future
    reduction-cascade proposal in this lane must clear. A second, smaller delta is a correction to
    the corpus: KN-LIT-4628 relays the SUPERSEDED 2017 abstract and should be superseded by an
    entry reading the 01/2020 version. Against the published state of the art the delta on attack
    cost is exactly zero and is expected to remain so.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    By part, with the straddle removed and the priority re-justified without it.
    (i) That R_0 is correctly 11.70 / 11.41 bits from FIPS 203 constants: ~0.97 (it is arithmetic,
    and the only risk is a wrong sigma convention for CBD).
    (ii) That the in-harness recomputation of log2 B_A from Corollary 2's concrete constants lands
    within 9.4 +/- 0.3 bits at the declared nu, i.e. that the proposer's transcription and
    arithmetic are right: ~0.85. The residual risk is transcription of the admissibility
    condition on r and of the ||Btilde_R|| = sqrt(n) instantiation, not the version question,
    which the changelog settles.
    (iii) That the chain has ZERO ALIVE rungs for ML-KEM-768 once the Corollary 3 column is
    charged: ~0.9. This is no longer a coin-flip between two readings; it is the near-direct
    consequence of (ii) plus a 4.4-bit column, and the dominant way it fails is the
    falsification condition that an ellipsoidal-error-capable estimator removes the column
    (which would return the margin to about +2.3 bits, still short of Corollary 5's 6.5-bit
    first descent -- so even then the ALIVE count is probably 0, and the prior on "zero ALIVE
    rungs" barely moves).
    (iv) That, conditional on ALIVE rungs existing at all (on NULL-2 in practice), every one of
    them shows a strictly positive blocksize difference: ~0.9.
    (v) That the E2 branch fires on ML-KEM itself: ~0.02, and I would bet against it hard while
    insisting the run be built to report it.
    (vi) That the run produces a defensible ledger and a defensible budget number either way:
    ~0.95.
    PRIORITY RE-JUSTIFICATION. The earlier draft rated this HIGH because two readings of the
    theorem straddled the budget and one cheap act decided between them. That justification is
    withdrawn: the changelog settles the version at zero cost and the concrete arithmetic already
    predicts closure at rung one with ~0.9 confidence, so the expected information gain from
    running Stage 0 is much lower than the draft claimed. What survives is worth MEDIUM, not high:
    the ledger is still the only artifact in the repository that states a per-scheme reduction
    budget, the closure it would record is a reusable precondition for every future
    reduction-cascade proposal in this lane, the column decomposition (prefactor, c-choice,
    eps-choice, spherical correction) tells a later proposer exactly which factor to attack, and
    the cost is one to two person-hours with no compute. It is not high because its predicted
    outcome is now known with ~0.9 confidence and because the one branch that could overturn it --
    an estimator that scores ellipsoidal errors natively -- is a tooling question that could be
    asked directly and more cheaply.
