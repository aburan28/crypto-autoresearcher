idea:
  id: IDEA-20260821-003cb0
  question_id: RQ-MLKEM-001
  added: '2026-08-21'
  title: >-
    ML-KEM has a finite REDUCTION BUDGET of log2(q/sigma) = 11.70 bits (768/1024) and 11.41 bits
    (512), and the Albrecht-Deo Module-LWE <-> Ring-LWE reduction spends a CONCRETELY COMPUTABLE
    part of it in a single step: read the constants off Corollary 2 and Corollary 3 of the CURRENT
    (01/2020) version of eprint 2017/612, not off the informal abstract, build the rung-by-rung
    ledger of the chain (MLWE_{256,k,q} -> RLWE_{256,q^k} -> RLWE_{n',q^{k*(n/n')}} via Corollary
    5's SINGLE-SHOT descent), and decide whether the composed chain ever lands on an instance
    cheaper to solve than ML-KEM itself
  class: composition
  claim: >-
    (A) THE OBJECT. Define the HARDNESS COORDINATE of an LWE-type instance as the pair
    C = (d, R) where d is the dimension of the lattice a primal attack would reduce and
    R = log2(q/sigma) is the modulus-to-noise ratio in bits. Every published reduction in the
    Module-LWE / Ring-LWE network acts on C by an explicit, theorem-stated rule, and composing
    reductions composes those rules. Nothing in this program has ever written that action down for
    ML-KEM.
    (B) THE BUDGET, WHICH IS FINITE AND SMALL. An LWE instance with sigma >= q/2 carries no
    information about its secret, so R = 0 is an absolute floor. From FIPS 203 constants alone,
    R(ML-KEM-768) = log2(3329/1) = 11.70 bits and R(ML-KEM-512) = log2(3329/sqrt(1.5)) = 11.41
    bits (the secret of ML-KEM-512 is CBD_3, sigma = sqrt(3/2)). Every reduction step that
    multiplies the error rate alpha by a factor B subtracts exactly log2(B) from R. ML-KEM
    therefore admits at most 11.70 bits of total error-rate blow-up across ANY chain of
    reductions, ever, before the image instance is information-theoretically dead. That number is
    a property of the standard, not of an algorithm, and it is the quantity this proposal
    computes, publishes and hands to every future reduction-cascade proposal as a precondition.
    (C) ONE THEOREM, TWO VERSIONS, RESOLVED BY THE PAPER'S OWN CHANGELOG -- AND A THIRD NUMBER
    THAT IS NEITHER OF THEM. An earlier draft of this record treated two circulating readings of
    the Albrecht-Deo blow-up as a live dichotomy that straddled the budget. THAT WAS A VERSION
    CONFUSION AND IT IS RESOLVED HERE AT ZERO COST, by reading the primary source. There is one
    theorem in two published versions:
    -- SUPERSEDED (ASIACRYPT 2017 wording, held VERBATIM inside this repository at
    research_digest/chunks/chunk_007.txt line 134 and relayed in KN-LIT-4628's Contribution
    section): "Our reduction increases the LWE error rate alpha by a quadratic factor in the ring
    dimension n and a square root in the module rank d for power-of-two cyclotomics. ... We also
    present a self reduction for RLWE in power-of-two cyclotomic rings that halves the dimension
    and squares the modulus while increasing the error rate by a similar factor as our MLWE to
    RLWE reduction."
    -- CURRENT (01/2020 revision of eprint 2017/612, fetched and read this session):
    "Our reduction increases the LWE error rate alpha by a factor of n^{c+1/2} * sqrt(d) for ring
    dimension n, module rank d and any constant c > 0 in the case of power-of-two cyclotomics."
    The paper's own Changelog (01/2020) decides between them outright: "the error rate expansion
    is improved from a factor of n^2 sqrt(d) to a factor of n^{c+1/2} sqrt(d) (for any constant
    c > 0)", and separately that the dimension-halving self-reduction "was originally reported to
    have an error rate expansion factor of n^{9/4} ... However in this updated version, we show
    that a factor of n^{c+1/2} ... suffices." So the 16.79-bit "quadratic" reading is the
    SUPERSEDED text and carries no live weight; the n^{c+1/2} form is current. NEITHER informal
    form is the number the budget must be spent against, because both drop the theorem's
    concrete constants: see (C2).
    (C2) THE SPECIFIC FALSIFIABLE CLAIM, STATED IN CONCRETE CONSTANTS. Corollary 2 of the current
    version states (alpha')^2 >= alpha^2 (1 + 2 (r q n^c)^2 d) with the admissibility conditions
    r >= (1/q)||Btilde_R|| sqrt(2 ln(2 n d (1 + 1/eps))/pi), ||Btilde_R|| = sqrt(n) for
    power-of-two cyclotomics (Section 3.4), and an advantage loss of at most
    [1 - (1-delta)^d] + (2d+10) eps m with delta = 2n exp(-pi n^{2c}). Instantiating c "at its
    most favourable admissible value" is UNBOUNDED as written -- c -> 0 gives
    delta = 512 e^{-pi} = 22, a vacuous bound -- so c is fixed by a declared negligibility
    requirement, not by taste. Requiring delta <= 2^-40 forces n^c >= 3.29 (c >= 0.215) and
    requiring (2d+10) eps m <= 2^-40 at d = 3, m = 768 forces eps <= 2^-53.6, whence
    ln(2 n d (1+1/eps)) ~ 44.5 and alpha'/alpha ~ sqrt(2d) * r q * n^c ~ 686. THE CLAIM IS THAT
    log2 B_A AT ML-KEM PARAMETERS IS ABOUT 9.4 BITS -- 9.25 to 9.53 over eps in [2^-64, 2^-40] at
    d = 3, and 9.1 (d = 2) to 9.6 (d = 4) across the parameter sets -- which is STRICTLY INSIDE
    the interval (4.79, 16.79) spanned by the two informal readings, and that the asymptotic form
    n^{c+1/2} sqrt(d) understates the concrete cost at n = 256 by about 4.6 bits.
    (C3) THE SECOND, LARGER OMISSION: THE SPHERICAL-ERROR CORRECTION. Section 4 of the current
    version states that "the reduction presented in Theorem 1 results in a skewed, but bounded
    error distribution", and that "the extra blow-up factor incurred when targeting a strictly
    spherical distribution can be as low as (mn)^{1/4} where m is the number of MLWE samples
    provided". At n = 256, m = 768 that is about 4.4 bits. This proposal's Stage 2 scores each
    rung with a standard lattice estimator, which has no input for a skewed (ellipsoidal) error,
    so THE CORRECTION IS MANDATORY FOR THIS PIPELINE and it was absent from the earlier draft.
    Corollary 3 carries it via a Renyi-divergence argument and therefore applies ONLY to SEARCH
    variants of MLWE -- a restriction that is itself part of the ledger.
    (C4) THE ARITHMETIC CONSEQUENCE, WHICH CLOSES THE CHAIN AT RUNG ONE FOR REASONS NEITHER
    INFORMAL READING IDENTIFIES. 11.70 - 9.4 - 4.4 < 0. Under the concrete constants the budget is
    exhausted at rung one, so the "leaves ~6.9 bits and at most two further descents" branch of the
    earlier draft is VOID. Even setting the spherical correction aside, 11.70 - 9.4 = 2.3 bits does
    not buy one descent: Corollary 5's SINGLE-SHOT reduction RLWE_n -> RLWE_{n'} costs a factor
    n^{3/2}/(n')^{1-c}, i.e. 6.5 bits for 256 -> 128 at c = 0.215. All of these are the proposer's
    arithmetic on the primary source performed 2026-08-21, NOT measurements; recomputing and
    certifying them in-harness is Stage 0's first obligation and any of them may be overturned
    there.
    (D) WHY THE ANSWER IS NOT OBVIOUSLY "REDUCTIONS NEVER HELP". A reduction from problem P to
    problem P' means an algorithm for P' solves P. If the image instance were cheaper to attack
    than ML-KEM, that WOULD be an attack on ML-KEM, and nothing forbids it a priori: the chain
    trades R linearly for d exponentially, and lattice cost is exponential in a blocksize that
    grows with d and shrinks with R. A monotone loss is the expected outcome, not a theorem, and
    the deliverable is the per-step exchange rate in bits, not the verdict. The budget-relaxed
    control (NULL-2) exists precisely so that the mechanism can be exercised where it is not
    starved.
    (E) WHAT IS NOT CLAIMED. No attack, no break, no speedup, no exponent moved. No claim that
    the reduction chain is the only one; no claim that the literature has not done this. Every
    number in this record is ARITHMETIC ON PUBLISHED CONSTANTS performed by the proposer on
    2026-08-21, not a measurement; none of it is read from a committed run, and the test's first
    obligation is to recompute all of it in-harness and certify it. No direction is declared
    impossible.
  mechanism: >-
    STAGE 0 (paper arithmetic, no compute, this is the decider -- AND IT READS COROLLARIES, NOT
    ABSTRACTS). Fix the FIPS 203 constants: n = 256, q = 3329; (k, eta1) = (2,3), (3,2), (4,2) for
    ML-KEM-512/768/1024; sigma(CBD_eta) = sqrt(eta/2). Compute R_0 = log2(q/sigma) per parameter
    set. Then read the following off the CURRENT (01/2020) version of eprint 2017/612 and record
    each with its locator and verbatim text, REFUSING the informal abstract form as a source of
    constants:
    (0a) From Corollary 2: the inequality (alpha')^2 >= alpha^2 (1 + 2 (r q n^c)^2 d); the
    admissibility condition r >= (1/q)||Btilde_R|| sqrt(2 ln(2 n d (1 + 1/eps))/pi); the value
    ||Btilde_R|| = sqrt(n) for power-of-two cyclotomics from Section 3.4; and the advantage loss
    [1 - (1-delta)^d] + (2d+10) eps m with delta = 2n exp(-pi n^{2c}) (Lemma 7).
    (0b) THE INEQUALITY THAT FIXES c, declared before any number is quoted. c is NOT free to be
    taken to zero: record a target negligibility level nu for the advantage loss, then solve
    2n exp(-pi n^{2c}) <= nu for the smallest admissible n^c, and (2d+10) eps m <= nu for the
    largest admissible eps. At nu = 2^-40, n = 256, d = 3, m = 768 this gives n^c >= 3.29
    (c >= 0.215, costing +1.72 bits) and eps <= 2^-53.6. Report the ledger at nu in
    {2^-40, 2^-64, 2^-128} so the c-choice's contribution is visible as a column and not buried.
    (0c) The sqrt(2d) * r q prefactor evaluated per parameter set, giving log2 B_A directly. At
    d = 3, nu = 2^-40 the proposer's arithmetic is r q = sqrt(n) sqrt(2 ln(2nd(1+1/eps))/pi) =
    85.1, alpha'/alpha = sqrt(6) * 85.1 * 3.29 = 686, log2 B_A = 9.42.
    (0d) A SEPARATE LEDGER COLUMN, NOT FOLDED INTO B_A: the spherical-error correction of
    Corollary 3, with its m-dependence and its search-only restriction recorded explicitly.
    Corollary 3 defines t := sqrt(alpha^2 + (r B (mn)^{1/4})^2) while Section 4's prose describes
    "the extra blow-up factor ... as low as (mn)^{1/4}". THE RELATION BETWEEN THE TWO IS AN OPEN
    READING QUESTION AND STAGE 0 MUST SETTLE IT FROM THE COROLLARY, NOT THE PROSE: whether
    (mn)^{1/4} MULTIPLIES Corollary 2's sqrt(2d) prefactor or REPLACES it (Corollary 3's proof
    takes beta = B (mn)^{1/4} sqrt(d), which its own statement of t does not show). Report the
    column both ways, with the corollary text quoted verbatim, and mark the ledger's total as a
    range until the reading is settled. At n = 256, m = 768, (mn)^{1/4} = 21.1, i.e. 4.40 bits.
    Record also that Corollary 3 rests on a Renyi-divergence argument and so applies to SEARCH
    MLWE only, and that a decision-variant ledger may not use it.
    (0e) The DESCENT step, taken from Corollary 5 in its SINGLE-SHOT form and never by composing
    halvings: RLWE_n -> RLWE_{n'} at error-rate factor n^{3/2}/(n')^{1-c} for normal-form secrets.
    Composing two halvings 256 -> 128 -> 64 overcharges the descent relative to the single-shot
    256 -> 64 by 5.0 bits at c = 0.215 and 3.5 bits at c -> 0 (proposer's arithmetic), so a
    rung-by-rung composition model is PESSIMISTIC IN THE PROPOSAL'S OWN FAVOUR and is forbidden.
    Subtract. Report the number of rungs before R crosses zero, and the value of R at each rung,
    with and without the (0d) column, at each nu.
    STAGE 1 (the two-coordinate ledger). For each admissible target dimension n' = n/2^i emit the
    rung (d_i, R_i, q_i, sigma_i, ring dimension n_i, module rank) with q_i written as an exact
    integer power, and mark each rung ALIVE (R_i > 0), MARGINAL (0 < R_i <= 1) or DEAD (R_i <= 0).
    Also mark rungs whose ring dimension has fallen below the point where Corollary 5's own
    hypotheses still hold, and rungs that are reachable only under the search-variant restriction
    of (0d).
    STAGE 2 (cost evaluation on the ALIVE rungs only). For each ALIVE rung run a standard primal
    and dual cost estimate over the sample-count parameter m, and compare with the same estimator
    run on ML-KEM itself at i = -1 (no reduction applied). Report the signed difference in
    estimated blocksize beta and in log2(cost), per rung, per parameter set. NOTE THE COUPLING
    THAT STAGE 0 EXPOSED: m enters both the estimator's own optimisation and the (0d) correction,
    so the two must be optimised jointly and the chosen m reported. The estimator is used as a
    COMPARATOR under matched accounting, not as an authority: same estimator, same version, same
    cost model, same reduction-shape assumptions on both arms, and the reported quantity is a
    DIFFERENCE, so a systematically wrong estimator that is wrong the same way on both arms does
    not move it. If Stage 0 returns zero ALIVE rungs for every parameter set and every nu, Stage 2
    runs on NULL-2 only.
    STAGE 3 (the control that can fail). Apply the identical ledger to an instance where the
    answer is known by construction: a plain LWE instance with NO module or ring structure, at
    matched (d, R). The Albrecht-Deo chain does not apply to it, so its ledger must have exactly
    one rung. If the pipeline emits more than one rung for the unstructured instance, the pipeline
    is applying a transformation whose hypotheses it is not checking, and no ledger it produced is
    reportable. Second control: apply the chain to an OVERSTRETCHED instance (q artificially
    raised at fixed sigma so R_0 is 40 bits rather than 11.7) where the budget is not binding; the
    ledger must then show many ALIVE rungs, and Stage 2 must show the dimension reduction actually
    lowering estimated cost at some i > 0 if it ever does. If it does not even there, the
    dimension-versus-ratio trade never pays and that is a stronger and more general statement than
    anything about ML-KEM.
    WHY THE TWO EXPLANATIONS SEPARATE. E1 (LOSSY-BY-CONSTRUCTION): every rung's estimated cost
    exceeds the i = -1 baseline, monotonically, and the overstretched control also shows monotone
    loss. Then the exchange rate is the deliverable and the reduction network is closed to
    attacks by a measured obstruction: "any future reduction-cascade proposal against ML-KEM must
    exhibit total error-rate blow-up under X bits, and here is X." E2 (NON-MONOTONE): some rung,
    on ML-KEM or on the overstretched control, has strictly lower estimated cost than its own
    baseline. Then the exponential dimension reduction can outrun the linear ratio loss, the
    optimal descent depth is a real free parameter, and a published polynomial-time reduction
    leaks estimated security -- which is an exponent-relevant finding and the most interesting
    outcome available here. NOTE HONESTLY THAT STAGE 0's OWN ARITHMETIC ALREADY PREDICTS ZERO
    ALIVE RUNGS ON ML-KEM, so on ML-KEM itself the live discrimination is between "Stage 0's
    concrete constants are right and the chain is dead at rung one" and "the in-harness
    recomputation overturns one of them"; the E1/E2 separation is carried by NULL-2, where the
    budget does not bind, and that is why NULL-2 is not optional.
