    (iv) That, conditional on ALIVE rungs existing, every one of them shows a strictly positive
    blocksize difference: ~0.9. (v) That the E2 branch fires on ML-KEM itself: ~0.03, and I would
    bet against it hard while insisting the run be built to report it. (vi) That the run produces
    a defensible ledger and a defensible budget number either way: ~0.95.
