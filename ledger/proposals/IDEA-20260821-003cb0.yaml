    results: >-
      The corpus contains exactly one Albrecht-Deo record, KN-LIT-4628, and it is a bulk-seeded
      abstract relay that explicitly asks to be upgraded after a careful read. NO ledger proposal,
      hypothesis, experiment or evidence record anywhere in the repository applies that reduction,
      or any reduction, to ML-KEM's parameters, and no record anywhere defines or computes a
      modulus-to-noise BUDGET for any scheme. The nearest prior art is in a NEIGHBOURING lane and
      is a draft, not a committed proposal: ideas/rlwe-mlwe-20260806/proposals.draft.yaml carries
      IDEA-20260806-35d60b (RQ-RLWE-912fdb) "Subring descent: short combinations landing in R'
      give an honest R'-LWE instance in half the dimension, at a computable noise price", whose
      own screen says "Albrecht-Deo's M-LWE-to-R-LWE reduction [is] adjacent" and whose corrected
      predicted effect at (n=256, q=3329, sigma~1, m=2, f=2) is block size 152.444 -> 152.445,
      i.e. NOISE-NEUTRAL, with descent losing once beta_c is charged. That draft is about a
      DIFFERENT map (short ring combinations landing in a subring) and its accounting is in
      blocksize, not in a ratio budget; it does not compute the budget, does not treat the
      modulus-raising reduction, and is not in this lane. In this lane, IDEA-20260805-574cd0 is
      directly relevant and SUPPORTIVE rather than duplicative: it audits GOAL-MLKEM-005's
      inherited constraint "the algebra is closed at about 17 bits", proves the constraint's
      conclusion for the subfield/trace-descent family, and then NAMES THE THREE CLASSES THE
      CONSTRAINT DOES NOT REACH -- "nonlinear maps (the compression and rounding maps of FIPS
      203), dimension-INCREASING maps, and modulus switching". A modulus-raising, dimension-
      reducing reduction is squarely inside two of those three named-uncovered classes, so this
      proposal is the named successor to 574cd0 and is not blocked by the inherited constraint.
    verdict: >-
      UNVERIFIED, and deliberately so. The two web queries above are weak evidence of absence and
      no claim is made that the literature has not costed this chain; the primary source was NOT
      readable from this session, which is recorded above rather than papered over. CLAIMED NEW
      RELATIVE TO THIS REPOSITORY: the hardness coordinate (d, R) as a tracked object; the
      definition and computation of a per-scheme reduction budget R_0 with an information-
      theoretic floor at R = 0; the rung-by-rung ledger of a composed reduction chain applied to
      FIPS 203 parameters; and the observation that two circulating readings of the same theorem's
      blow-up factor straddle that budget, which turns a literature-reading task into the lane's
      cheapest available discriminator. ASSEMBLED FROM KNOWN PARTS: both reductions are published
      and neither is claimed here; the estimator is standard; the budget arithmetic is elementary;
      the positioning inside 574cd0's named-uncovered classes is 574cd0's contribution, not this
      record's.
  object_first_candidate:
    tracked_object: >-
      THE HARDNESS COORDINATE C = (d, R) of an LWE-type instance -- lattice dimension and
      log2(q/sigma) in bits -- followed through a composition of published reductions, one rung
      per reduction applied.
    lossiness: >-
      GENUINELY LOSSY, and this is the whole reason the object is usable. C discards the public
      matrix A, the secret, the error realisation, the module rank, the ring, the sample count and
      every algebraic structure the instance has: two instances with identical C can differ in all
      of them. What is retained is exactly what each reduction's THEOREM STATEMENT promises to
      transform, which is why the discard is compatible with the operation being tracked: a
      reduction's action on C is a total function of C and the reduction's own parameters, stated
      in its theorem, with no dependence on the discarded material. This is not a change of
      coordinates -- the map from instances to C is many-to-one with fibres of astronomical size.
      IT IS ALSO NOT LOSSLESS IN THE OTHER DIRECTION AND THE PROPOSAL SAYS SO: C does not
      determine attack cost, only bounds the estimator's inputs, and Stage 2 is where the
      discarded material re-enters through the estimator's own assumptions.
    propagation: >-
      One step = one reduction. The propagation law is the theorem: Albrecht-Deo step A sends
      (d, R) = (2n, R) to (2n, R - log2 B_A(n,k)) while replacing rank k by rank 1 and q by q^k;
      step B sends (2n, R) to (n, R - log2 B_B(n)) while squaring q. Both are deterministic,
      closed-form, and composable, and the composition of the rules is the composition of the
      reductions. Measurable in one line of arithmetic per rung; falsifiable by the Stage-3
      control, which applies the pipeline where the propagation law has no right to fire.
    survival_score: >-
      Finitely many steps, and the number is the deliverable. C dissolves absolutely at R <= 0
      (the instance carries no information about its secret and no further rung means anything),
      and dissolves practically earlier, when the ring dimension falls below the regime where the
      self-reduction's hypotheses hold or where the estimator's reduction-shape model applies.
      The proposal's headline number IS the survival count: how many rungs ML-KEM's 11.70-bit
      budget buys. Under one of the two circulating readings of B_A that count is ZERO.
  null_object_control: >-
    TWO controls, both able to fail, both run in the same invocation as the signal arm.
    NULL-1, THE STRUCTURE-DELETED INSTANCE: a plain (unstructured) LWE instance at matched (d, R),
    i.e. the same dimension and same log2(q/sigma) but a uniform random matrix over Z_q with no
    ring or module structure. The Albrecht-Deo chain requires a power-of-two cyclotomic module
    structure, so its hypotheses FAIL on this object, and the correct ledger for it has exactly
    one rung. The control fails -- and voids the whole pipeline -- if the implementation emits a
    second rung, because that would prove the code is applying the transformation without checking
    the hypothesis that licenses it. This is the cheapest possible check that the pipeline is
    tracking the reduction and not merely tracking arithmetic on two numbers.
    NULL-2, THE BUDGET-RELAXED INSTANCE: the same ML-KEM shape with q raised at fixed sigma so
    that R_0 is about 40 bits instead of 11.70, i.e. an artificially overstretched instance where
    the budget is not the binding constraint. This control CAN fail in the informative direction:
    if Stage 2 shows monotone cost increase even here, then the dimension-for-ratio trade never
    pays for any parameters, which is a stronger claim than the ML-KEM one and would mean the
    ML-KEM result is not about ML-KEM at all. If instead NULL-2 shows a cost dip at some i > 0
    while ML-KEM does not, the mechanism is real and ML-KEM is merely too poor to afford it --
    which is the precise, scoped statement this design exists to produce.
    WHY NEITHER IS A CONSTANT OF THE APPARATUS: NULL-1's outcome is a rung count and its spread
    across seeds is not zero only if the pipeline is broken, which is exactly the failure being
    hunted; NULL-2's outcome is a signed blocksize difference with a comparator (the i = -1
    baseline at the same R_0) named before the run, and its dynamic range is exhibited by sweeping
    R_0 over at least four values between 11.70 and 40 bits so the statistic's monotonicity in R_0
    is reported rather than assumed (KN-TECH-1a5b7e, obligation 3 refinement).
  discriminated_from:
    - >-
      IDEA-20260805-574cd0 (same lane) audits the inherited "the algebra is closed at about 17
      bits" constraint and proves it for the subfield/trace-descent family, then names three
      classes the constraint does not reach: nonlinear maps, dimension-changing maps, and MODULUS
      SWITCHING. This proposal does not re-audit that constraint and does not re-prove the
      subfield case; it instantiates one of 574cd0's own named-uncovered classes with the specific
      published reduction that lives there, and it accounts in a currency (bits of log2(q/sigma))
      that 574cd0 does not use. 574cd0's deliverable is a constraint with an argument; this one's
      is a two-coordinate ledger with a floor.
    - >-
      IDEA-20260806-35d60b (DRAFT, RQ-RLWE-912fdb, ideas/rlwe-mlwe-20260806/proposals.draft.yaml)
      descends by taking SHORT COMBINATIONS of samples that happen to land in a subring; its noise
      price is paid in the length of the combination vector c and its verdict is that descent
      loses "because ||c|| cannot REACH the Gaussian heuristic". The Albrecht-Deo chain takes no
      combinations, requires no short c, and pays its price as a stated error-rate blow-up in the
      theorem. The two mechanisms are disjoint, they are in different lanes, and their failure
      modes are unrelated: one can fail while the other survives.
    - >-
      IDEA-20260806-e5e694 (DRAFT, RQ-RLWE-be8f64) asks whether tower-recursive MODULE REDUCTION
      changes the GSA profile shape. That is a question about an ALGORITHM operating on a fixed
      lattice. This is a question about a REDUCTION producing a different instance. Nothing here
      runs a module-native reducer, and the finding of either would leave the other untouched.
      This proposal deliberately does not enter that draft's territory.
    - >-
      IDEA-20260805-cdc87d derives the enumeration/sieving crossover under a memory price. That
      moves the COST MODEL applied to a fixed instance; this moves the INSTANCE under a fixed cost
      model. Stage 2 here would consume 20260805-cdc87d's corrected crossover as an input if it
      were available, and would be unaffected in sign by it because the reported quantity is a
      difference between two arms scored by the identical model.
    - >-
      IDEA-20260807-abacec prices the DCP -> LWE quantum route and IDEA-20260805-e805b6 audits the
      tower-PIP/determinant-ideal route. Both concern QUANTUM reductions into or out of Module-LWE
      and both are about whether an external pipeline can read the secret at all. This proposal is
      entirely classical, makes no quantum claim, and asks a different question of a different
      reduction: not "does the pipeline see s" but "what does the transformation cost in bits of
      modulus-to-noise ratio".
    - >-
      A "run the lattice estimator on ML-KEM" exercise -- which two prior campaigns in this lane
      spent eighteen batches on -- would report an absolute cost. This reports a signed DIFFERENCE
      between two arms under matched accounting, and its Stage 0 decider needs no estimator at
      all.
