idea:
  id: IDEA-20260821-003cb0
  question_id: RQ-MLKEM-001
  added: '2026-08-21'
  title: >-
    ML-KEM has a finite REDUCTION BUDGET of log2(q/sigma) = 11.70 bits (768/1024) and 11.41 bits
    (512), and every published Module-LWE <-> Ring-LWE reduction spends a computable part of it in
    a single step: build the rung-by-rung ledger of the Albrecht-Deo chain (MLWE_{256,k,q} ->
    RLWE_{256,q^k} -> RLWE_{256/2^i, q^{k*2^i}}), which moves lattice DIMENSION down exponentially
    in i while moving log2(q/sigma) down only linearly, and decide whether the composed chain ever
    lands on an instance cheaper to solve than ML-KEM itself
  class: composition
  claim: >-
    (A) THE OBJECT. Define the HARDNESS COORDINATE of an LWE-type instance as the pair
    C = (d, R) where d is the dimension of the lattice a primal attack would reduce and
    R = log2(q/sigma) is the modulus-to-noise ratio in bits. Every published reduction in the
    Module-LWE / Ring-LWE network acts on C by an explicit, theorem-stated rule, and composing
    reductions composes those rules. Nothing in this program has ever written that action down for
    ML-KEM.
    (B) THE BUDGET, WHICH IS FINITE AND SMALL. An LWE instance with sigma >= q/2 carries no
    information about its secret, so R = 0 is an absolute floor. From FIPS 203 constants alone,
    R(ML-KEM-768) = log2(3329/1) = 11.70 bits and R(ML-KEM-512) = log2(3329/sqrt(1.5)) = 11.41
    bits (the secret of ML-KEM-512 is CBD_3, sigma = sqrt(3/2)). Every reduction step that
    multiplies the error rate alpha by a factor B subtracts exactly log2(B) from R. ML-KEM
    therefore admits at most 11.70 bits of total error-rate blow-up across ANY chain of
    reductions, ever, before the image instance is information-theoretically dead. That number is
    a property of the standard, not of an algorithm, and it is the quantity this proposal
    computes, publishes and hands to every future reduction-cascade proposal as a precondition.
    (C) THE SPECIFIC FALSIFIABLE CLAIM. For the Albrecht-Deo chain -- MLWE in ring dimension n,
    rank k, modulus q reduces to RLWE in dimension n, modulus q^k; and RLWE self-reduces by
    halving n and squaring q -- the composed action on C is
    d: 2n -> 2n/2^i   (exponential in the descent depth i)
    R: R_0 -> R_0 - log2 B_A(n,k) - sum_{j=1..i} log2 B_B(n/2^{j-1})
    with B_A, B_B the error-rate blow-ups the two theorems state. The claim is that the FIRST
    step alone, B_A, either does or does not exhaust ML-KEM's entire budget, and that which of
    those holds is decided by reading one theorem statement. Two readings of the same source are
    in circulation and THEY STRADDLE THE BUDGET: the abstract as returned by web search says the
    blow-up is n^{c+1/2}*sqrt(d) for any constant c>0, which at n=256, k=3, c->0 gives
    log2 B_A -> 4.79 bits and leaves ~6.9 bits of budget; the author's own blog summary says
    "a quadratic factor in the ring dimension n and a square root in the module rank d", which
    gives log2 B_A = 2*8 + 0.79 = 16.79 bits and OVERSPENDS the 11.70-bit budget by 5.1 bits in
    one step. Under the second reading the entire reduction network is closed to ML-KEM before it
    starts; under the first it is open for one step and then closes after at most i = 2 further
    descents. THE CHEAPEST DECISIVE ACT IN THIS LANE IS READING THAT THEOREM AND DOING THE
    SUBTRACTION.
    (D) WHY THE ANSWER IS NOT OBVIOUSLY "REDUCTIONS NEVER HELP". A reduction from problem P to
    problem P' means an algorithm for P' solves P. If the image instance were cheaper to attack
    than ML-KEM, that WOULD be an attack on ML-KEM, and nothing forbids it a priori: the chain
    trades R linearly for d exponentially, and lattice cost is exponential in a blocksize that
    grows with d and shrinks with R. A monotone loss is the expected outcome, not a theorem, and
    the deliverable is the per-step exchange rate in bits, not the verdict.
    (E) WHAT IS NOT CLAIMED. No attack, no break, no speedup, no exponent moved. No claim that
    the reduction chain is the only one; no claim that the literature has not done this. Every
    number in this record is ARITHMETIC ON PUBLISHED CONSTANTS performed by the proposer on
    2026-08-21, not a measurement; none of it is read from a committed run, and the test's first
    obligation is to recompute all of it in-harness and certify it. No direction is declared
    impossible.
  mechanism: >-
    STAGE 0 (paper arithmetic, no compute, this is the decider). Fix the FIPS 203 constants:
    n = 256, q = 3329; (k, eta1) = (2,3), (3,2), (4,2) for ML-KEM-512/768/1024; sigma(CBD_eta) =
    sqrt(eta/2). Compute R_0 = log2(q/sigma) per parameter set. Then obtain the EXACT theorem
    statements of both reductions from the primary source (Albrecht-Deo, "Large Modulus Ring-LWE
    >= Module-LWE", eprint 2017/612 / ASIACRYPT 2017; the corpus already holds a bulk-seeded,
    self-declared-unverified entry KN-LIT-4628) and record log2 B_A and log2 B_B with the free
    constant c instantiated at its most favourable admissible value. Subtract. Report the number
    of rungs before R crosses zero, and the value of R at each rung. This stage alone
    discriminates the two readings in (C) and is minutes of arithmetic.
    STAGE 1 (the two-coordinate ledger). For i = 0, 1, 2, ... emit the rung
    (d_i, R_i, q_i, sigma_i, ring dimension n_i, module rank) with q_i = q^{k 2^i} written as an
    exact integer power, and mark each rung ALIVE (R_i > 0), MARGINAL (0 < R_i <= 1) or DEAD
    (R_i <= 0). Also mark rungs whose ring dimension has fallen below the point where the
    self-reduction's own hypotheses still hold.
    STAGE 2 (cost evaluation on the ALIVE rungs only). For each ALIVE rung run a standard primal
    and dual cost estimate over the sample-count parameter m, and compare with the same estimator
    run on ML-KEM itself at i = -1 (no reduction applied). Report the signed difference in
    estimated blocksize beta and in log2(cost), per rung, per parameter set. The estimator is used
    as a COMPARATOR under matched accounting, not as an authority: the same estimator, same
    version, same cost model, same reduction-shape assumptions on both arms, and the reported
    quantity is a DIFFERENCE, so a systematically wrong estimator that is wrong the same way on
    both arms does not move it.
    STAGE 3 (the control that can fail). Apply the identical ledger to an instance where the
    answer is known by construction: a plain LWE instance with NO module or ring structure, at
    matched (d, R). The Albrecht-Deo chain does not apply to it, so its ledger must have exactly
    one rung. If the pipeline emits more than one rung for the unstructured instance, the pipeline
    is applying a transformation whose hypotheses it is not checking, and no ledger it produced is
    reportable. Second control: apply the chain to an OVERSTRETCHED instance (q artificially
    raised at fixed sigma so R_0 is 40 bits rather than 11.7) where the budget is not binding; the
    ledger must then show many ALIVE rungs, and Stage 2 must show the dimension reduction actually
    lowering estimated cost at some i > 0 if it ever does. If it does not even there, the
    dimension-versus-ratio trade never pays and that is a stronger and more general statement than
    anything about ML-KEM.
    WHY THE TWO EXPLANATIONS SEPARATE. E1 (LOSSY-BY-CONSTRUCTION): every rung's estimated cost
    exceeds the i = -1 baseline, monotonically, and the overstretched control also shows monotone
    loss. Then the exchange rate is the deliverable and the reduction network is closed to
    attacks by a measured obstruction: "any future reduction-cascade proposal against ML-KEM must
    exhibit total error-rate blow-up under X bits, and here is X." E2 (NON-MONOTONE): some rung,
    on ML-KEM or on the overstretched control, has strictly lower estimated cost than its own
    baseline. Then the exponential dimension reduction can outrun the linear ratio loss, the
    optimal descent depth is a real free parameter, and a published polynomial-time reduction
    leaks estimated security -- which is an exponent-relevant finding and the most interesting
    outcome available here.
