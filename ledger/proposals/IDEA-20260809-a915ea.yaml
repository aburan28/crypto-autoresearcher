idea:
  id: IDEA-20260809-a915ea
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ARGON-141710
  goal_id: GOAL-ARGON-001
  title: >-
    The memory-access graph at the recommended parameters is finite and fixed —
    measure its depth-robustness directly instead of bounding it asymptotically
  class: measurement
  claim: >-
    For fixed (t, m, p) the Argon2 memory-access DAG is completely determined and
    can be built explicitly. The claim is that attacker-relevant structural
    quantities — above all the size of a set whose removal reduces the graph's
    depth below a target — can be computed exactly or tightly bounded on THAT
    graph, and that the measured values differ from what the asymptotic
    depth-robustness argument assumes at the parameters people actually deploy.
  mechanism: >-
    Construct the DAG by running the indexing functions symbolically; then
    compute or bound depth-reducing set sizes with exact methods at small
    parameters and with declared approximation algorithms at recommended ones,
    reporting exactness per value.
  why_not_a_renamed_known_approach: >-
    Depth-robustness is analysed asymptotically for graph families. Measuring the
    SPECIFIC graph induced by the standardized indexing at the standardized
    parameters is a different object, and it is the object every real deployment
    actually uses.
  predictions:
  - observable: depth-reducing set size versus target depth
    metric: curve, marked exact or bounded per point
    predicted: >-
      Systematically different from the asymptotic family's guarantee at
      recommended parameters. Agreement would validate the asymptotic argument
      concretely, which is a clean and useful positive.
  - observable: how far up in (t, m) exact computation reaches
    metric: largest exactly computable parameters
    predicted: Well below recommended parameters, which is why the approximation method and its guarantee must be declared rather than assumed.
  minimal_test: >-
    Build the DAG for the data-independent variant at small (t, m) where exact
    computation is possible, compute the curve exactly, then extend with the
    declared approximation to one recommended parameter set.
  controls:
  - 'CONSTRUCTION VALIDATION: the symbolically built DAG must reproduce the reference implementation''s actual memory access pattern, instrumented and compared block by block.'
  - 'APPROXIMATION-GUARANTEE DISCLOSURE: every bounded value carries its algorithm and its guarantee; a bounded value reported as exact would corrupt the whole curve.'
  falsification_conditions:
  - The symbolic DAG disagrees with the instrumented access pattern.
  - No exact computation is possible even at the smallest useful parameters, in which case the curve is entirely approximate and the record says so.
  interpretation_limits: >-
    Graph structure is not attack cost. This record measures the object the
    tradeoff bounds are statements about; the attack itself is a separate record.
  sota_delta: 'No attack. Delta: measured structure of the deployed graph where the literature has asymptotics for a family.'
  dominated_by: Not dominated by any corpus record; no memory-hard-function records exist in the corpus.
  estimated_cost: Implementation medium; compute moderate to high for the approximation at recommended parameters.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for Argon2 / memory-hard: no records. WEB NOT CHECKED.'
  source_refs:
  - RFC 9106 -- REQUIRED READ, NOT YET READ.
  - Depth-robust graph references -- RECALLED, REQUIRED READS.
