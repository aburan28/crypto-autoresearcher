idea:
  id: IDEA-20260725-005
  supersedes: IDEA-20260725-003
  supersede_reason: >-
    Anti-duplication/red-team screen returned REVISE with two verified defects:
    (1) the stated mechanism ("A4_5 is reported with the A3_5 value", an
    aliasing/assignment defect) is falsified by inspection -- SIG8_run.sage
    computes A4_5 as a CUMULATIVE rank over a different matrix; (2) branch E2
    ("the pinned 444 is wrong") was sold at full stakes despite being nearly
    excluded a priori by EV-SIG-003. This record restates the mechanism, demotes
    the anchor-error branch explicitly, replaces the from-definition
    reimplementation arm with a targeted diagnostic, and adds three new verified
    facts the original missed.
  title: >-
    Zero-contribution D4 image at D5: localising the RUN-o closure-anchor halt to
    the sems1 F4 image path, with the pinned anchor demoted-but-tested
  class: control
  claim: >-
    The A4_5 = 242 vs expected 444 mismatch recorded in
    experiments/EXP-SIG-008/runs/RUN-EXP-SIG-008-o/raw.json is confined to the
    EXP-SIG-008 sems1 driver's D4-to-D5 image path (f4_5 produced at
    SIG8_run.sage:1300 and consumed at 1313-1315) and does NOT impugn the pinned
    anchor 444: on a fresh sems1 stage-1 rebuild at n=12 seed 2 with an additive
    diagnostic, rankK5 = 2,093, A3_5 = 242 and quotient sizes 1/32/1,322 will
    reproduce, A4_5 will again be 242, the non-cumulative F4 contribution
    A4only_5 = rank(span(K5) u f4_5) - rankK5 will be 0 rather than the 443
    implied by EV-SIG-003 (A4 - A4_id = 443), and the pinned
    src/h013_f5_signatures.sage closure engine on the same cell will return
    A3/A4/A4_beyond_A3/A4_id = 242/444/202/1 unchanged -- so blast_radius on
    committed ledger records is 0 and only EXP-SIG-008 gate 2 is blocked.
  mechanism: >-
    CORRECTED MECHANISM (the original aliasing diagnosis is wrong and is
    withdrawn). SIG8_run.sage:1307-1315 computes
    C = base.stack(f3_5); C.echelonize(); A3_5 = C.rank() - rankK5;
    base2 = C.matrix_from_rows(range(C.rank()));
    C = base2.stack(f4_5); C.echelonize(); A4_5 = C.rank() - rankK5.
    A4_5 is therefore the CUMULATIVE rank of span(K5) u img(F3 lift) u img(F4
    lift) minus rankK5, computed from a genuinely different matrix than A3_5;
    there is no assignment aliasing, and A4_5 >= A3_5 holds by construction.
    A4_5 = A3_5 = 242 means exactly one thing: the D4 quotient-lift image set
    f4_5, produced at line 1300 by
    images_of_int(lift4, lifts[4][0], tag2idx5, m1) with m1 = [0] + COMBOS_LIST[1],
    contributed zero new rank over span(base2).
    Constraints already fixed by the receipt: miss4 = 0, so every image tag
    (i, mu|nu) resolved in the D5 tag index; and the D4 anchors reproduce
    EV-SIG-003 exactly (nrows 3,912, kernel_dim 110, rankK 78, quotient 32), so
    len(lift4) = 32 and the D4 quotient space is intact. The remaining loci are
    (a) f4_5 empty or all-zero after the odd-parity reduction in images_of_int
    (lines 340-345), or (b) f4_5 nonzero but wholly inside span(K5) u img(F3).
    Competing explanations and their consequences:
    E1 -- driver-local defect in the F4 image path. Blast radius 0; gate 2 blocked
    until repair.
    E2 -- semantic divergence: sems1's A4_5 is not the quantity the pinned engine
    calls A4, so the hard-coded expectation at SIG8_run.sage:1318 and
    specification.yaml:13 is an invalid gate for this path. Blast radius: the
    contract and the gate, not the EV numbers.
    E3 -- the pinned anchor 444 is genuinely wrong. DEMOTED, with reasons stated
    up front rather than sold at full stakes: (i) EV-SIG-003:29-32 records
    A3 = 242 and A4_beyond_A3 = 202 with the exact cross-check
    "A3 + A4_beyond_A3 == A4 exactly on every cell" (242 + 202 = 444) under
    canonical full_reduce, after a pre-registered C6 gate had already caught an
    arithmetically impossible earlier reading (EV-SIG-003:59-68); (ii)
    EV-SIG-003:41-43 records the same 242/444/202/1 at n=12 for BOTH seeds 2 and
    2026; (iii) the recorded A4_5 series 444/705/1,026/1,407 at n=12/15/18/21
    (EV-SIG-007:95-96, DEC-20260724-004:7) has exact constant second difference 60,
    so 444 is also the value the n=15/18/21 points extrapolate to. E3 is
    disfavoured but NOT excluded, and is tested by the pinned-engine arm.
    E4 -- non-reproducible transient: a fresh rebuild returns 444. Then nothing is
    repaired; the receipt is recorded as an unexplained halt.
    NEW FACT 1 (corrects the original record): file-level drift is NOT excluded.
    SIG8_run.sage:122-134 hashes only h013_f5_signatures.sage, semaev_tree.py,
    ic_first_fall_fast.py and macaulay_export.py; the driver that computes A4_5 is
    not in PINNED_HASHES, so instrument_sha256_matches_pinned: true says nothing
    about it.
    NEW FACT 2: SIG8_run.sage:149 emits git_commit as a hard-coded string literal
    f6fa31b08a6262760f50c19d6704fcf16d02d81a, so the receipt's own provenance
    field cannot be used to identify the driver version that produced RUN-o.
    NEW FACT 3 (resolves a confounder the original raised): the "ambiguous arm
    labelling" is not ambiguous. --arm has default 'null' (SIG8_run.sage:54) and is
    referenced only inside run_rank6 (line 1193); run_sems1 ignores it entirely.
    RUN-o's args.arm = "null" is an unused default, and its anchors are
    unambiguously the sem cell's.
  why_not_renamed_known_approach: >-
    Differential testing of two implementations of one scalar is a standard
    technique and is not claimed as new. What is specific: the disputed value is
    pinned inside a frozen approved contract, is asserted by a hard-coded
    expectation in the code under test (so that code cannot witness for itself),
    and is the gating precondition for EXP-SIG-008 gate 2. It is not a determinism
    check -- determinism is already recorded PASS (EV-SIG-006 C4, EV-SIG-008
    RUN-c). The halt is cited by no evidence record, decision, summary or analysis:
    grep for RUN-EXP-SIG-008-o across the repo returns hits only in its own run
    directory and in the three 2026-07-25 proposals (8 files total, verified).
  novelty_status: unverified
  assumptions:
    - "The diagnostic can be added additively (new output keys only) without
       altering any existing computation, and is written and reviewed BEFORE any
       arm is run."
    - "A fresh sems1 stage-1 rebuild is possible: experiments/EXP-SIG-008/work/
       sem_s1_state.json must be moved aside or the run will skip stage 1 entirely
       (SIG8_run.sage:1244-1259). RUN-o's recorded stage-1 wall time is 13 s; if a
       genuine cold rebuild takes materially longer, RUN-o did not do the work it
       appears to have done and that itself is a finding."
    - "The pinned engine src/h013_f5_signatures.sage can be driven on the n=12
       seed 2 cell independently of SIG8_run.sage. If it cannot, the E3 arm does
       not exist and the outcome must be reported as E3-UNTESTED, never as E1."
    - "The n=9 seed 1 cross-cell arm is SECONDARY, not the primary discriminator.
       Reason: the recorded A4_5 = 566 at n=9 (EV-SIG-006:82) is off the
       constant-second-difference-60 series that fits n=12/15/18/21 exactly, which
       extrapolates to 243 at n=9 -- a gap of 323 -- while the recorded A3_5 = 128
       at n=9 IS on the A3_5 series (second difference 36 across all five points).
       Either n=9 uses a different convention or the D5 regime differs at n=9
       (freeze degree 6 there, EV-SIG-006:67-77). Until that is settled the n=9
       value cannot adjudicate anything on its own."
  predictions:
    - metric: "A4_5 at n=12 seed 2 on a fresh sems1 stage-1 rebuild"
      direction: different
      minimum_effect: "exactly 242 reproduces the halt and keeps E1/E2 live;
        exactly 444 selects E4 (non-reproducible transient, nothing to repair);
        any third value falsifies the whole diagnosis"
    - metric: "GF(2) rank of the D4 image set f4_5 alone (new diagnostic)"
      direction: different
      minimum_effect: "0 selects locus (a), a degenerate/empty image set from
        images_of_int; >= 1 excludes locus (a) and forces locus (b)"
    - metric: "A4only_5 = rank(span(K5) u f4_5) - rankK5 (non-cumulative F4
        contribution, new diagnostic)"
      direction: different
      minimum_effect: "0 with rank(f4_5) > 0 selects E2, semantic divergence
        (contradicting EV-SIG-003's A4 - A4_id = 443); 443 alongside a cumulative
        A4_5 of 242 is arithmetically impossible and localises the defect instead
        to the base2/stack/echelonize step at SIG8_run.sage:1310-1315"
    - metric: "len(lift4), the D4 quotient-lift basis size"
      direction: different
      minimum_effect: "= 32 confirms the D4 quotient space is intact (RUN-o already
        records quotient 32); != 32 falsifies the scoping assumption and widens the
        defect beyond the image path"
    - metric: "A3/A4/A4_beyond_A3/A4_id from the pinned h013_f5_signatures.sage
        closure engine at n=12 seed 2"
      direction: different
      minimum_effect: "242/444/202/1 reproduces EV-SIG-003:41-43 and excludes E3;
        ANY deviation selects E3 and converts this into an evidence-integrity event"
    - metric: "blast_radius = count of committed ledger records whose numeric
        content changes under the surviving explanation"
      direction: different
      minimum_effect: "0 under E1, E2 and E4; >= 5 under E3 (EV-SIG-003, EV-SIG-005,
        EV-SIG-006, EV-SIG-007, DEC-20260724-004, SYNTHESIS-20260718)"
    - metric: "cold stage-1 wall seconds for sems1 at n=12 seed 2"
      direction: different
      minimum_effect: "<= 20 s is consistent with RUN-o's recorded 13 s; > 60 s
        means RUN-o cannot have performed a cold stage 1 and the receipt's own
        timing is evidence of reused state, a separate integrity finding"
  minimal_test:
    design: >-
      Two required arms plus one secondary arm, on one cell (n=12, seed 2, D=5),
      diagnostic written and frozen before execution.
      ARM A (instrumented sems1, required): move
      experiments/EXP-SIG-008/work/sem_s1_state.json aside, add an additive
      diagnostic immediately after SIG8_run.sage:1315 recording len(f3_5),
      len(f4_5), rank(f4_5), A4only_5 = rank(base u f4_5) - rankK5, len(lift3),
      len(lift4), and stage-1 wall seconds; run --mode sems1 --n 12 --seed 2 and
      record everything alongside the existing rankK5/A3_5/A4_5/miss3/miss4 and
      the d35_anchors block. Run it twice for determinism.
      ARM B (pinned engine, required): drive src/h013_f5_signatures.sage on the
      same cell and report A3, A4, A4_beyond_A3, A4_id. This is the ONLY arm that
      can test E3, because the sems1 expectations are hard-coded at
      SIG8_run.sage:1318 and cannot witness for themselves.
      ARM C (secondary, n=9 seed 1): repeat arm A and arm B at n=9 seed 1 and
      compare against EV-SIG-006:82 (A3_5 = 128, A4_5 = 566). Report the
      off-series status of 566 (series extrapolation 243) as part of the result;
      do not let arm C alone decide anything.
      Interpretation map fixed BEFORE execution:
      A4_5 = 444 in arm A => E4, record the halt as an unexplained non-reproducible
      transient, do NOT patch;
      A4_5 = 242 and rank(f4_5) = 0 => E1 locus (a), driver defect in
      images_of_int usage, blast radius 0, gate 2 blocked until repair;
      A4_5 = 242, rank(f4_5) > 0, A4only_5 = 0, arm B returns 444 => E2, semantic
      divergence, the contract's pinned expectation is an invalid gate and
      specification.yaml must be superseded, blast radius 0 on EV records;
      arm B returns anything but 444 => E3, evidence-integrity event, escalate to
      the Coordinator with blast_radius enumerated;
      A3_5 != 242 in arm A => the disagreement is broader than A4_5 and this
      diagnosis is falsified.
    controls:
      - "Fresh stage-1: sem_s1_state.json moved aside and its absence recorded, so
         stage 1 actually recomputes rather than being skipped."
      - "Hash SIG8_run.sage itself and record it. instrument_sha256_matches_pinned
         covers only the four files in PINNED_HASHES (SIG8_run.sage:122-134) and
         does NOT cover the driver that computes A4_5."
      - "Do not trust the receipt's git_commit: it is a hard-coded literal at
         SIG8_run.sage:149. Record the real HEAD independently."
      - "Reproduce the EV-SIG-003 / RUN-EXP-SIG-008-c D5 anchor set (nrows 31,512,
         ncols 46,709, kernel 3,415, rankK 2,093, quotient 1,322) before reading
         the disputed value."
      - "Reproduce the quotient-size gate 1/32/1,322 (the code already halts on it
         at SIG8_run.sage:1284-1291)."
      - "rank6-path independence: re-derive rank_acc on the first 12,000 columns
         and require exactly 12,000 (EV-SIG-008:58), confirming the rank6 path that
         produced RUN-EXP-SIG-008-n is untouched."
      - "Determinism: arm A executed twice, all diagnostic values compared."
      - "Diagnostic is additive-only and reviewed before any arm runs; no existing
         computation altered."
      - "Confirmation-pressure control: E1 is the convenient outcome (blast radius
         0), so arm B must be executed and reported even if arm A already looks
         like E1."
    required_metrics:
      - rankK5
      - A3_5
      - A4_5
      - A4only_5
      - rank_f4_5
      - len_f4_5
      - len_f3_5
      - len_lift3
      - len_lift4
      - miss3
      - miss4
      - quotient_sizes_D3_D4_D5
      - d35_anchor_set
      - pinned_engine_A3_A4_A4beyondA3_A4id
      - rank6_prefix_12000
      - stage1_wall_seconds
      - SIG8_run_sage_sha256
      - blast_radius_record_count
  falsification_conditions:
    - "Arm A returns A3_5 != 242 -> the disagreement is broader than the F4 image
       path and this claim's diagnosis is FALSE."
    - "Arm B (pinned engine) returns A4 != 444 at n=12 seed 2 -> the claim 'the
       pinned anchor is right, blast radius 0' is FALSE; this becomes an
       evidence-integrity event touching >= 5 committed records."
    - "Arm A returns A4_5 = 444 on a fresh rebuild -> the confined-defect claim is
       FALSE; the halt is a non-reproducible transient and must be recorded as
       unexplained, not repaired."
    - "Arm A returns rank(f4_5) > 0 AND A4only_5 = 443 AND cumulative A4_5 = 242 ->
       arithmetically impossible; the diagnostic itself is wrong and the design is
       withdrawn."
    - "len(lift4) != 32 -> the scoping assumption (D4 quotient space intact) is
       falsified and the defect is not confined to the image path."
    - "The rank6 12,000-column prefix does not reproduce rank_acc = 12,000 -> the
       rank6 path is implicated too, the n=12 D6 value extra_6 = 7,110 becomes
       suspect, and this claim's scoping is falsified."
    - "Arm B cannot be built (the pinned engine cannot be driven on this cell
       independently) -> E3 is UNTESTED and the result must be reported as such,
       never as E1."
    - "Any arm exceeds the 240 s per-invocation sage budget -> INCONCLUSIVE under
       AGENTS rule 5; a timeout is not evidence."
  confounders:
    - "Stale on-disk state in experiments/EXP-SIG-008/work/ can make an arm skip
       stage 1 outright (SIG8_run.sage:1244-1259) and reproduce a stored verdict."
    - "The expected values 2,093/242/444 are hard-coded in the sems1 assertion at
       SIG8_run.sage:1318, so arm A can never be an independent witness for them."
    - "SIG8_run.sage is not covered by PINNED_HASHES, so 'instrument matches
       pinned' in RUN-o is not evidence that the computing code was unchanged."
    - "Sage 10.9 / Python 3.14.3 / macOS-15.6-arm64 is the only recorded
       environment; a different environment introduces a second variable."
    - "Confirmation pressure toward E1 because it has blast radius 0."
    - "The n=9 A4_5 = 566 anchor is itself off the n=12..21 series by 323, so arm C
       may be comparing against a value produced under a different convention."
    - "Sage's round() in this build returns an integer-valued object (visible in
       every EXP-SIG-008 receipt: cols_fraction 1, secs_total 1182, sec 0), so
       sub-second timings are indistinguishable from zero in the receipts."
  interpretation_limits:
    - "claim_tier toy: instrument validation on the binary-field Weil-descent proxy
       at n = 9, 12. Not a mathematical result about ECDLP and not crypto-scale."
    - "A clean E1 or E2 outcome validates NO SIG conclusion; it removes one
       specific integrity doubt about one scalar and unblocks one gate."
    - "Does not address whether the closure decomposition is the right
       decomposition, only whether two implementations compute the same thing."
    - "The off-series n=9 A4_5 observation is a record-consistency observation, not
       a measurement; it does not by itself impugn EV-SIG-006."
    - "Only the Coordinator may act on an E3 outcome or amend a frozen contract;
       this proposal changes no record status."
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  source_refs:
    - ledger/proposals/IDEA-20260725-003.yaml
    - experiments/EXP-SIG-008/SIG8_run.sage
    - experiments/EXP-SIG-008/runs/RUN-EXP-SIG-008-o/raw.json
    - experiments/EXP-SIG-008/runs/RUN-EXP-SIG-008-n/raw.json
    - experiments/EXP-SIG-008/specification.yaml
    - ledger/EV-SIG-003.yaml
    - ledger/EV-SIG-006.yaml
    - ledger/EV-SIG-007.yaml
    - ledger/EV-SIG-008.yaml
    - ledger/DEC-20260724-004.yaml
