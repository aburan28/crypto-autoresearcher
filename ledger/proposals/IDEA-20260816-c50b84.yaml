idea:
  id: IDEA-20260816-c50b84
  question_id: RQ-WFS-e776b6
  added: '2026-08-16'
  title: 'Map the frontier of what is exhaustively measurable: for a family of small argument protocols,
    measure how the cost of computing an attained cheating advantage by complete enumeration grows
    with challenge-space size, round count and prover branching, and publish the reachable region
    as a table future contracts must size themselves against'
  class: tooling
  claim: '(A) Every measurement contract in this bucket rests on the same instrument: complete enumeration
    of a cheating prover''s strategy space against a complete challenge space, which yields an attained
    advantage rather than a bound. That instrument has a hard capacity, and no record in this program
    states it, so contracts are sized by guesswork and discover the boundary by timing out, which
    under AGENTS.md rule 3 produces no evidence at all. (B) The capacity is measurable directly: implement
    one parameterised enumerator, run it over a grid of challenge-space size q, round count r, and
    prover branching factor b, and record the node count, wall time and peak memory to completion,
    together with whether completion occurred at all under a fixed budget. The deliverable is the
    reachable region, expressed as the largest (q, r, b) at which an attained advantage is computable
    within a named budget on a named machine class, plus the fitted growth law of node count in each
    variable. (C) The second deliverable is the DEGRADATION MAP: for points outside the reachable
    region, what the enumerator can still produce, namely a lower bound from a truncated search with
    its truncation fraction recorded, and how far that lower bound sits below the exact value at points
    where both are computable. That comparison is the only thing that makes a truncated result interpretable,
    and it is measurable only inside the reachable region, which is why it must be measured there.
    (D) NOT CLAIMED: no attack, no soundness result about any protocol, no claim about any deployed,
    third-party or standardized system; no claim that the timings transfer to other machines, since
    the machine class is named and the numbers are stated to be machine-relative; and explicitly no
    claim that any timeout constitutes negative evidence about any protocol, since a timeout here
    is a fact about the instrument and is reported as such.'
  mechanism: 'STAGE A: build one parameterised protocol family with three knobs: challenge-space size
    q, round count r, and prover branching factor b, meaning the number of distinct first messages
    the prover may try per node. The family is deliberately structureless, since the object under
    study is the enumerator and not any protocol. STAGE B: implement the enumerator once, with an
    explicit node counter, an explicit memory ceiling, and a truncation mode that stops after a named
    node budget and returns the best advantage found together with the fraction of the tree explored.
    STAGE C: sweep the grid and record node count, wall time, peak memory, and completion status at
    every point. STAGE D: fit the growth law: node count against q, r and b separately, testing the
    pre-registered product form b to the r times q. STAGE E: draw the reachable region as the set
    of grid points completing within the named budget, and report its boundary explicitly as a table
    rather than as a plot. STAGE F: measure degradation. At points inside the region, run the truncated
    mode at several node budgets and record how far the truncated lower bound sits below the exact
    attained advantage as a function of the explored fraction. STAGE G: run the null control, a protocol
    whose attained advantage is known in closed form, to confirm the enumerator returns the right
    answer at every grid point where it completes, since a fast wrong enumerator would map a useless
    region.'
  novelty_status: unverified
  novelty_screen:
    method: Grepped ledger/proposals/ and ledger/hypotheses/ for soundness error, challenge space,
      state restoration and union bound, and read the titles of all thirteen RQ-WFS-e776b6 proposals
      from a PyYAML scan of ledger/proposals/. Read ledger/questions/RQ-WFS-e776b6.yaml. Checked the
      blacklist item covering audits of this program's own cost model and machine variance, which
      is owned by RQ-INSTR-f8faa0 with fifteen or more proposals, and read the titles of IDEA-20260809-83371c
      and IDEA-20260816-722a94 as the two closest instrument-oriented records on this question.
    results: IDEA-20260809-83371c is a tooling record that instruments the transcript, recording the
      exact bytes entering every challenge and diffing them against a declared specification; its
      object is transcript content. IDEA-20260816-722a94 calibrates a soundness instrument on protocols
      of known soundness, checking correctness rather than capacity. RQ-INSTR-f8faa0 owns audits of
      this program's cost model, machine variance and single-machine timing as such. No record on
      RQ-WFS states the capacity of the enumeration instrument, its growth law, or what a truncated
      enumeration is worth relative to a complete one.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature; exhaustive search, its exponential
      growth, and truncation as a lower-bound strategy are all standard and treated here as known.
      What is claimed new is only internal: no record here publishes the reachable region of this
      program''s own exhaustive soundness enumerator or the degradation of truncated results against
      exact ones. The parts assembled, a parameterised search tree, a node counter and a growth fit,
      are known. The record is deliberately adjacent to the blacklisted cost-model audits and distinguishes
      itself by measuring the capacity of a specific research instrument rather than machine variance
      or the program''s cost model.'
  object_first_candidate:
    tracked_object: 'The enumeration tree size function n(q, r, b): the number of nodes a complete
      enumeration visits to compute an attained advantage at those settings, together with the completion
      status at a fixed budget. Every reported quantity is a functional of this function, specifically
      its growth law and its level set at the budget.'
    lossiness: Genuinely lossy. The underlying state is the full search tree, with every node carrying
      a prover strategy and a partial transcript; n keeps a single integer per parameter point and
      discards every strategy, every transcript and the advantage itself. The discard is compatible
      with the target operation because what a future contract needs from the instrument is whether
      it finishes and how big the tree is, not which strategies it visited; those are recovered by
      the contract that actually runs the measurement. The retained function propagates deterministically
      under changing a knob, which is exactly the sizing operation a contract performs.
    propagation: 'One step of the target operation is incrementing one knob. On the tracked object
      it acts multiplicatively under the pre-registered model: incrementing r multiplies n by about
      b, incrementing b multiplies n by about b to the power r minus one, and incrementing q adds
      a factor linear in q at the leaves. The reachable region is the sublevel set of n at the node
      budget, so each knob increment moves the boundary in a predictable direction, and the measurement
      checks whether the predicted product form actually holds or whether pruning inside the enumerator
      changes it, which is the informative case.'
    survival_score: 'The tracked object survives across the entire grid by construction, since node
      count is recorded whether or not the enumeration completes. What dissolves is the ADVANTAGE,
      not the object: beyond the reachable boundary the enumerator returns a truncated lower bound
      and the exact value is unavailable, and the record''s degradation map is precisely the description
      of how much is lost there. The object itself stops being useful when pruning makes n depend
      on the protocol''s structure rather than on the knobs, which is why the family is deliberately
      structureless and why any structure-dependent deviation is reported as a finding about the instrument.'
  null_object_control: 'NULL OBJECT: a protocol family whose attained advantage is known in closed
    form at every grid point, specifically one where the prover can answer exactly d of q challenges
    independently of its message, so the attained advantage is exactly d over q with no search required.
    The identical enumerator runs against it at every grid point in the same invocation. The null
    must return exactly d over q wherever it completes, and its node count must follow the same growth
    law as the signal family, since the tree shape is identical and only the payoffs differ. If the
    null returns a wrong advantage anywhere, the mapped region is a region of a broken instrument
    and no capacity number may be published. If the null''s node count differs from the signal family''s,
    the enumerator is pruning on payoff and the growth law is protocol-dependent, which must be reported
    rather than averaged away.'
  discriminated_from:
  - IDEA-20260809-83371c instruments the transcript by recording the bytes entering every challenge
    and diffing them against a specification. That measures what a protocol hashes; this measures
    how large a search the program can afford.
  - IDEA-20260816-722a94 calibrates the soundness instrument on protocols of known soundness, which
    establishes correctness. Correctness is a precondition here and is carried as the null arm; the
    object measured is capacity, which correctness does not address.
  - The blacklisted audits of this program's cost model and machine variance under RQ-INSTR-f8faa0.
    Those measure the program's timing infrastructure across tasks; this measures one research instrument's
    reachable parameter region and the value of its degraded mode, and reports timings only as machine-relative
    context alongside node counts, which are machine-independent.
  - The query-budget record in this set, which uses the enumerator to produce a scientific result.
    This record produces no soundness result at all and exists so that such contracts can be sized
    before they are approved.
  - 'A generic remark that exhaustive search is exponential: that is a direction. This record supplies
    the constants, the boundary and the degradation map at named settings.'
  assumptions:
  - A deliberately structureless protocol family isolates the enumerator's cost from protocol-specific
    pruning; any observed structure dependence is reported as a finding about the instrument rather
    than smoothed away.
  - Node count is the machine-independent capacity measure and wall time is machine-relative context;
    the machine class is named and no timing is presented as transferable.
  - Truncated enumeration returns a valid lower bound on the attained advantage, since it explores
    a subset of strategies; this is a property of the search and is checked against exact values inside
    the reachable region.
  - A timeout or memory exhaustion at a grid point is a fact about the instrument at that point and
    is recorded as such, never as evidence about any protocol, per AGENTS.md rule 3.
  - The pre-registered growth model b to the r times q is a hypothesis about the enumerator and may
    be refuted by the data, which would itself be the deliverable.
  predictions:
  - metric: node count growth in round count r at fixed q and b
    direction: higher
    minimum_effect: 'forced value: multiplicative by a factor within ten percent of b per increment,
      under the pre-registered product model; a deviation beyond that refutes the model and is the
      reportable result'
  - metric: null-arm attained advantage at every completing grid point
    direction: different
    minimum_effect: 'forced value: exactly d over q; any deviation voids the entire mapped region'
  - metric: gap between truncated lower bound and exact attained advantage at fifty percent explored
      fraction
    direction: lower
    minimum_effect: 'explicit refusal to pre-commit: how quickly a truncated search approaches the
      optimum depends on the ordering of the tree, which this record measures rather than assumes'
  - metric: difference in node count between the signal family and the closed-form null family at
      matched knobs
    direction: different
    minimum_effect: 'forced value: zero within one percent, since the tree shapes are identical; a
      difference indicates payoff-dependent pruning and must be reported'
  minimal_test:
    design: 'One enumerator, one grid, one day of compute at most. Knobs: q in {16, 64, 256, 1024},
      r in {1, 2, 3, 4}, b in {2, 4, 8, 16}, giving 64 grid points per family. Node budget fixed at
      2 to the 26 and memory ceiling at four gigabytes, both enforced by the enumerator itself rather
      than by the operating system so that termination is recorded rather than inferred from a crash.
      At every point record node count, wall time, peak memory, completion status and the attained
      advantage if complete. Run the closed-form null family at every point in the same invocation.
      Then, at the eight largest completing points, re-run in truncated mode at explored fractions
      of one, five, twenty-five and fifty percent and record the lower bound against the exact value.
      The discriminating output is the boundary table of the reachable region plus the degradation
      curve. If the boundary sits far below the parameters that sibling contracts in this bucket assume,
      that is the reportable measured result and it changes how those contracts must be sized.'
    controls:
    - Closed-form null family with known attained advantage at every grid point, in the same invocation.
    - Zero-advantage control where the prover can answer no challenge, requiring exactly zero at every
      completing point.
    - Full-advantage control where the prover can answer every challenge, requiring exactly one and
      requiring the enumerator to terminate early if it claims any early-exit optimisation.
    - 'Determinism control: the same grid point run twice from the same seed must give identical node
      counts, confirming the enumerator has no nondeterministic ordering.'
    - 'Truncation validity control: a truncated bound at any explored fraction must never exceed the
      exact value at the same point.'
    - 'Memory ceiling control: a point deliberately set past the ceiling must terminate with a recorded
      status rather than crash.'
    required_metrics:
    - node count per grid point
    - completion status per grid point
    - wall time and peak memory per grid point on the named machine class
    - attained advantage where complete
    - fitted growth exponents in q, r and b with residuals
    - boundary of the reachable region as an explicit table
    - truncated lower bound versus exact value at named explored fractions
  falsification_conditions:
  - The closed-form null returns a wrong advantage at any completing grid point, voiding the mapped
    region.
  - A truncated bound exceeds the exact value at any point, showing the truncation is not a valid
    lower bound.
  - Node counts are not reproducible across identical seeded runs.
  - The pre-registered product growth model is refuted by the data, which is a reportable result about
    the enumerator rather than a failure of the run.
  - The signal and null families show materially different node counts at matched knobs, revealing
    payoff-dependent pruning that makes the capacity table protocol-specific and therefore much less
    useful, which must be stated plainly.
  - The reachable region is empty at the node budget, in which case the record reports that the instrument
    cannot compute an attained advantage anywhere in the grid and names the budget that would be required.
  confounders:
  - Wall time is machine-dependent and would make the region look larger or smaller on other hardware;
    node count is the primary metric precisely to avoid that, and any presentation that leads with
    time reintroduces the confound.
  - Payoff-dependent pruning would make node count a function of the protocol rather than of the knobs,
    silently invalidating the table for other protocols.
  - Memory ceilings enforced by the operating system rather than by the enumerator produce crashes
    rather than recorded statuses, and a crash is not a measurement.
  - Tree ordering determines how fast a truncated search approaches the optimum, so the degradation
    curve is a property of the implementation and not of the problem, which must be stated.
  - Interpreting a non-completing point as a statement about soundness would violate AGENTS.md rule
    3; the record's status column exists to make that impossible.
  interpretation_limits:
  - Timings are relative to the named machine class and are context only; node counts are the transferable
    quantity.
  - The capacity table describes this enumerator on this protocol family, and payoff-dependent pruning
    in a structured protocol could move the boundary in either direction.
  - No soundness result about any protocol follows from this record, which produces none by design.
  - A non-completing grid point is a fact about the instrument and is never evidence about any protocol,
    per AGENTS.md rule 3.
  target_complexity:
    time_exponent: No attack exponent is claimed. The instrument's own cost is pre-registered as growing
      like b to the power r times q in node count, and measuring that growth is the deliverable rather
      than a claim about any algorithm.
    memory_exponent: No attack memory exponent is claimed. The enumerator's own peak memory is pre-registered
      as growing like b times r for a depth-first traversal and is measured rather than asserted.
    best_known: 'The incumbent is guesswork: contracts in this program currently size exhaustive measurements
      by estimate and discover the boundary by timing out, which produces no evidence. This record
      replaces that with a measured table for one enumerator on one machine class.'
    hidden_overhead: The human cost is in keeping the record from drifting into the blacklisted territory
      of auditing the program's cost model, which means leading with node counts and treating timings
      strictly as context. In lower-order terms hides the tree-ordering choice, which silently determines
      the degradation curve, and the enforcement of the memory ceiling inside the enumerator rather
      than by the operating system, without which non-completion is a crash rather than a datum.
  dominated_by: n/a (no result claimed). This is an instrument-capacity map and claims no solve, forgery
    or cost improvement, so there is no frontier row to compare against; asserting null would be a
    fabrication.
  sota_delta: no attack; conceptual/measurement contribution only. The deliverable is a capacity table
    and a degradation curve for this program's own enumerator, with no cost comparison to any algorithm.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Part A, that the reachable region and the growth law are measurable and
    reproducible: about 0.9, since node counting is straightforward and determinism is enforceable.
    Part B, that the pre-registered product growth model survives contact with the data: about 0.7,
    with the main risk being pruning that the enumerator performs without the model accounting for
    it. Part C, that the truncated lower bound is close enough to the exact value at moderate explored
    fractions to make degraded mode scientifically usable: about 0.35, and I expect this to be disappointing,
    since a lower bound from a partially explored tree is usually far from the optimum unless the
    ordering is good, which is a separate engineering problem. Part D, that sibling contracts in this
    bucket are actually resized against the published table rather than ignoring it: about 0.5, which
    is a process question rather than a technical one.'
