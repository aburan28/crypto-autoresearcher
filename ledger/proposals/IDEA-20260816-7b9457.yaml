idea:
  id: IDEA-20260816-7b9457
  question_id: RQ-FRODO-a2dbe2
  added: '2026-08-16'
  title: 'Join the two FrodoKEM questions by propagating an interval, not a point: take an uncertainty
    range on the correctness error and push it through the reduction bound in certified interval arithmetic,
    then measure how much of the resulting bit-security width is real and how much is manufactured
    by the dependency problem of repeated occurrences.'
  class: composition
  claim: '(A) OBJECT. RQ-FRODO-3260cc asks whether a printed correctness error reproduces; RQ-FRODO-a2dbe2
    asks what it is worth. The composition of the two is an INTERVAL, not a number: given an uncertainty
    range on the correctness error, the reduction bound maps it to a range of bit-security figures.
    The tracked object is that output interval, together with its width. (B) COMPOSITION CLAIM. Interval
    propagation through the bound is sound only if the bound is monotone in the correctness error
    over the input range, and monotonicity is a checkable property term by term rather than an assumption.
    Where every occurrence of the error is in a term that is increasing in it, the output interval
    endpoints are obtained by evaluating at the input endpoints and the width is exact. Where occurrences
    have mixed sign, naive endpoint evaluation is unsound and the correct interval must be computed
    by an enclosure that accounts for the dependency, which is strictly wider than the true range.
    (C) INFLATION CLAIM. The gap between naive interval arithmetic and the true range, caused by the
    same symbol occurring in several terms and being treated as independent in each, is a measurable
    INFLATION FACTOR: the naive width divided by the true width, where the true width is obtained
    by dense sampling plus a monotone-piece argument. The claim is that this factor is computable
    at negligible cost, that it can be large enough to change how a reported interval reads, and that
    reporting an interval without it is reporting an artifact of the arithmetic. (D) WHAT IS NOT CLAIMED.
    No attack, no break, and no claim that any published bit-security figure is wrong or that any
    correctness error is wrong. An interval whose lower endpoint falls below a category floor is a
    statement about the uncertainty of a PROOF''s output under a stated input range, not a statement
    that anything is insecure; the input range is a free parameter supplied by the analyst, so the
    interval says exactly as much as that range does and no more. Nothing here re-derives any correctness
    error or estimates any lattice problem.'
  mechanism: 'STAGE 1, monotonicity certification. For each term of the transcribed bound, determine
    symbolically whether it is increasing, decreasing or non-monotone in the correctness error over
    the input range, and record a per-term verdict. This is exact and costs nothing, and it is what
    makes the interval sound rather than plausible. STAGE 2, endpoint evaluation where all terms agree
    in direction; enclosure computation where they do not. Both paths are implemented, and which path
    was taken is recorded per parameter set rather than assumed. STAGE 3, true-range measurement.
    Sample the correctness error densely across the input range, evaluate the bound exactly at each
    sample, and take the observed minimum and maximum; combine with the monotone-piece decomposition
    to certify that the sampled range is the true range up to a stated grid resolution. STAGE 4, inflation-factor
    measurement: naive interval width divided by certified true width, per parameter set and per input-range
    width. STAGE 5, zero-width null. Propagate a degenerate interval whose endpoints coincide and
    require the output to be a degenerate interval equal to the point evaluation, bit for bit; any
    widening there is pure arithmetic artifact and voids everything. STAGE 6, sweep the input range
    width from degenerate to wide and measure how the inflation factor grows, since the dependency
    problem is negligible for tiny ranges and dominant for large ones, and the crossover is the practically
    relevant number.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-FRODO-3260cc, especially its exact-rational-arithmetic constraint forbidding floating-point
      agreement, and RQ-FRODO-a2dbe2, especially its delta-term target describing conversion of a
      failure-rate discrepancy into a bit-security movement and its constraint that the failure-rate
      value belongs to the other question. Read both goals. Ran grep -ril over ledger/proposals/ for
      interval, exact rational, certified, sensitivity, and read the titles of the FRODO hits and
      of the nearest MLKEM sensitivity records.
    results: 'IDEA-20260805-f16b44 (FRODO) is the nearest record: two errors wearing the same clothes,
      a scale error in a decryption failure rate is worth its own size in bits while a tail-shape
      error is worth vastly more, so quoting only the failure rate makes them indistinguishable. That
      record converts a POINT discrepancy into bits and distinguishes two kinds of discrepancy; it
      does not propagate a range, does not address monotonicity, and does not touch the dependency
      problem. IDEA-20260805-411b60 (FRODO) predicts a point response to a single table perturbation.
      H-FRODO-e0c651 asserts that the failure rate''s dependence on the sampling table factors through
      a single scalar and derives a predicted response of a stated size in bits, which is again a
      point derivative. Exact rational and certified arithmetic are demanded as constraints across
      both FRODO questions but no proposal measures the cost of the arithmetic itself. Nothing in
      the corpus measures an interval-arithmetic inflation factor or certifies monotonicity term by
      term before propagating.'
    verdict: 'UNVERIFIED. External literature is unreachable and nothing is asserted about published
      interval-arithmetic or sensitivity practice; the dependency problem of interval arithmetic is
      elementary and this proposal does not claim to have discovered it. Claimed new inside this repository:
      composing the two FRODO questions as an interval rather than a point, requiring a per-term monotonicity
      certificate before propagation, and measuring the inflation factor so that a reported interval
      is separated into real uncertainty and arithmetic artifact. Assembled from known parts: point
      sensitivity of the bound to the failure rate is IDEA-20260805-f16b44''s and is cited rather
      than repeated; exact rational arithmetic is already a constraint of both questions; dense sampling
      as a range check is ordinary numerics.'
  object_first_candidate:
    tracked_object: The output interval of bit-security values produced by evaluating the transcribed
      reduction bound over an input interval on the correctness error, characterized by its two endpoints,
      its width, and the per-term monotonicity verdicts that justify how the endpoints were obtained.
    lossiness: 'The projection discards the entire shape of the input uncertainty, keeping only two
      endpoints: a correctness error known to lie in a range with a sharply peaked distribution and
      one known to lie in the same range uniformly map to the same object. That is a real loss and
      it is the reason the output cannot be read as a confidence statement. What survives propagates
      because monotone functions map interval endpoints to interval endpoints, so wherever the per-term
      certificate says every occurrence is increasing, one step of evaluation moves the object deterministically
      and exactly. Where the certificate says otherwise, propagation is still possible but no longer
      exact, and the object carries an inflation factor recording how much was given up.'
    propagation: One step of the target operation is substituting the interval into one term of the
      bound. A term increasing in the correctness error maps the input interval endpoints to output
      endpoints in order; a decreasing term reverses them; a non-monotone term requires an enclosure
      over its critical points. Summing terms adds intervals endpoint-wise, which is exact only when
      the terms' dependences on the shared symbol are independent, and they are not, which is precisely
      the dependency problem the inflation factor measures. The object therefore propagates exactly
      through one term and inexactly through a sum, and the design makes that distinction a measured
      quantity rather than a footnote.
    survival_score: Exactness survives as long as the correctness error appears in exactly one term,
      and degrades with the number of terms containing it. Concretely the proposal predicts the inflation
      factor is essentially one for a single-occurrence bound, grows with the occurrence count, and
      grows with the input-range width, becoming practically significant once the range spans more
      than about one binary order of magnitude. Where it becomes large is exactly where a reported
      interval stops being informative, and locating that crossover is a deliverable independent of
      any particular bound.
  null_object_control: 'ZERO-WIDTH INPUT: propagate a degenerate interval whose endpoints coincide
    at the published input value, through the IDENTICAL pipeline, in the same invocation. The output
    must be a degenerate interval equal bit for bit to the point evaluation of the same bound at the
    same value. Any widening is a pure artifact of the arithmetic implementation and voids every non-degenerate
    result, so this null is a gate rather than a comparison. A second null propagates an interval
    through a bound in which the correctness error appears exactly once, where the true range is available
    in closed form and the inflation factor must be exactly one; a factor above one there localizes
    an implementation defect. A third null uses a bound not containing the correctness error at all,
    whose output interval must be degenerate regardless of the input width.'
  discriminated_from:
  - 'IDEA-20260805-f16b44 (FRODO): converts a point discrepancy in a failure rate into bits and separates
    scale from tail-shape errors. That is a derivative at a point; this is a range propagated through
    the whole bound, and the entire content here is monotonicity certification and inflation measurement,
    neither of which a derivative needs or provides.'
  - 'IDEA-20260805-411b60 (FRODO): predicts a point response in bits to a single table perturbation,
    used to license a reproduction claim. Same point-versus-range distinction, and that record''s
    object lives in the sampling table rather than in the reduction bound.'
  - 'H-FRODO-e0c651: derives that the failure rate''s table dependence factors through one scalar
    and predicts a response of a stated magnitude. That is upstream of this proposal entirely: it
    produces the kind of input range this design would consume, and the two compose rather than compete.'
  - An ordinary sensitivity sweep that evaluates the bound at several correctness-error values and
    plots the result. That yields a curve with no soundness claim; interval arithmetic with a monotonicity
    certificate yields an enclosure, and the inflation factor quantifies exactly how much the enclosure
    gives up relative to the curve.
  - The neighbouring FRODOFO dominance-partition proposal, which projects the bound to an argmax label.
    That object discards magnitude entirely and cannot express uncertainty; this one keeps magnitude
    and discards distribution shape, so the two are complementary projections of the same inequality
    and neither subsumes the other.
  assumptions:
  - A transcription of the reduction bound is filed under RQ-FRODO-a2dbe2 constraint 1 before any
    real propagation; the monotonicity machinery, the null gates and the inflation measurement all
    run on synthetic bounds without it, and that is how this contract is scoped.
  - The input range on the correctness error is supplied by the analyst as a free parameter and is
    never derived here; deriving it belongs to RQ-FRODO-3260cc and this design must not poach it.
  - Exact rational arithmetic is used, so the zero-width null can be a bit-for-bit gate rather than
    a tolerance comparison.
  - Dense sampling plus a monotone-piece decomposition certifies the true range up to a stated grid
    resolution, and that resolution is reported rather than assumed negligible.
  - Per-term monotonicity verdicts are derived symbolically and recorded; a term whose verdict cannot
    be established is treated as non-monotone rather than optimistically as monotone.
  predictions:
  - metric: output interval width under a zero-width input interval
    direction: lower
    minimum_effect: forced value exactly 0; any positive width is an implementation artifact and voids
      the pipeline
  - metric: inflation factor on a bound where the correctness error occurs exactly once
    direction: lower
    minimum_effect: forced value exactly 1.0
  - metric: inflation factor on a bound with four occurrences at an input range spanning two binary
      orders of magnitude
    direction: higher
    minimum_effect: 1.5
  - metric: growth of the inflation factor with input-range width, measured as the fraction of adjacent
      range-width steps that increase it
    direction: higher
    minimum_effect: 0.8
  - metric: fraction of terms in a realistic multi-term bound whose monotonicity verdict in the correctness
      error is non-monotone over a two-order input range
    direction: different
    minimum_effect: 'no pre-commitment, with reason: this depends entirely on a transcription that
      does not yet exist in this corpus, and guessing it would be fabrication'
  minimal_test:
    design: 'All three nulls and the inflation measurement run on synthetic bounds and need no primary
      source. Build four synthetic bounds with one, two, four and eight occurrences of the correctness
      error, with mixed increasing and decreasing terms in the last two. For each, propagate input
      intervals of widths spanning zero to three binary orders of magnitude, computing the naive endpoint
      interval, the certified enclosure, and the densely sampled true range. The discriminating measurement
      is the inflation factor curve against occurrence count and range width, gated by the three nulls:
      zero-width input must give zero width, single-occurrence must give inflation exactly one, and
      a bound without the symbol must be insensitive to input width. If any null fails, no inflation
      number is interpretable. The whole run costs minutes in exact rational arithmetic and delivers
      a curve that tells a later batch how wide an input range it may propagate before the reported
      interval is mostly artifact.'
    controls:
    - Zero-width input null, requiring bit-for-bit degenerate output.
    - Single-occurrence bound, requiring inflation exactly one.
    - Symbol-absent bound, requiring output width independent of input width.
    - Densely sampled true range with a stated grid resolution, as the reference for the inflation
      factor.
    - Per-term monotonicity certificate, recorded per parameter set rather than assumed.
    - 'Endpoint-order check: for a bound certified decreasing, the output endpoints must swap relative
      to the input, which catches an implementation that ignores direction.'
    required_metrics:
    - output interval endpoints and width per configuration
    - inflation factor, naive width divided by certified true width
    - per-term monotonicity verdicts and the count of non-monotone terms
    - zero-width null output width
    - grid resolution of the dense sampling and the residual uncertainty it leaves
    - inflation factor as a function of occurrence count and of input-range width
  falsification_conditions:
  - The zero-width null produces a positive output width, which voids the pipeline.
  - The single-occurrence bound shows inflation above one, localizing an implementation defect.
  - The symbol-absent bound's output width depends on the input width.
  - The inflation factor does not grow with occurrence count, refuting the dependency-problem account
    of where the width comes from.
  - Dense sampling finds a value outside the certified enclosure, which means the enclosure is unsound
    and is a serious defect rather than a finding.
  - Endpoint order does not swap for a certified-decreasing bound.
  confounders:
  - The input range is chosen by the analyst, so the headline output width is set by that choice and
    not by any property of the bound; any interval quoted without its input range is meaningless.
  - Dense sampling certifies the true range only up to grid resolution, so a narrow spike between
    grid points would inflate the measured inflation factor spuriously; the monotone-piece decomposition
    is the guard and it is only as good as the per-term verdicts.
  - Synthetic bounds are authored here and their occurrence structure is chosen, so the inflation
    curve is a property of that choice as much as of interval arithmetic.
  - Exact rational arithmetic can still produce enormous denominators over many terms, and a slowdown
    could tempt a floating-point fallback that would silently break the zero-width gate.
  - Monotonicity over the input range is not the same as monotonicity everywhere, and a verdict established
    on one range must not be reused on another.
  interpretation_limits:
  - An output interval is a statement about a bound's output under an analyst-supplied input range.
    It is not a confidence interval and carries no probability.
  - An interval endpoint crossing a category floor is not a security consequence and must never be
    reported as one.
  - Inflation factors measured on synthetic bounds describe those bounds; they bound nothing about
    a real transcription until one exists.
  - Nothing here re-derives or comments on any correctness error, which belongs to RQ-FRODO-3260cc,
    and nothing here estimates any lattice problem.
  target_complexity:
    time_exponent: No attack exponent is claimed. Propagation costs O(T) exact rational operations
      per evaluation for T terms, and the dense sampling multiplies that by the grid size; minutes
      in total.
    memory_exponent: No attack memory exponent is claimed. Exact rationals with growing denominators
      are the only memory concern and are bounded by periodic reduction; megabytes.
    best_known: The incumbent is a point evaluation of the bound at a single published correctness
      error, together with the point-sensitivity treatment already proposed in this repository by
      IDEA-20260805-f16b44. This proposal does not contradict either; it adds an enclosure and, more
      importantly, the measurement that says how much of the enclosure's width is real.
    hidden_overhead: 'The per-term monotonicity certificate is human symbolic work and it does not
      scale with automation: a term whose direction cannot be established must be treated as non-monotone,
      which widens the enclosure and makes the result less useful, so there is a standing temptation
      to declare monotonicity optimistically. That temptation is the real hidden cost and only the
      dense-sampling cross-check catches it.'
  dominated_by: 'n/a (no result claimed on any cost frontier). Pareto check actually performed: grep
    -ril frodo across ledger/ returns no evidence record, so this program holds no FrodoKEM cost rows
    in time, memory or data. Against IDEA-20260805-f16b44 and IDEA-20260805-411b60, the nearest sensitivity
    records, no Pareto comparison exists because none of the three produces a cost on any axis.'
  sota_delta: no attack; conceptual and measurement contribution only. The deliverable is an inflation-factor
    curve, a set of monotonicity verdicts and a gated interval-propagation pipeline. No bit-security
    figure is asserted for any scheme and no attack cost is produced.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Claim (B), that per-term monotonicity is establishable and makes endpoint
    propagation sound where it holds: 0.85, straightforward for monomial terms and genuinely uncertain
    for anything containing a square root of a sum. Claim (C), that the inflation factor is measurable
    and exceeds 1.5 at four occurrences over a two-order range: 0.6, with the honest caveat that the
    synthetic bounds are mine and I could easily have built the effect in without noticing, which
    the single-occurrence null only partly controls. That the three nulls all pass on a first implementation:
    0.7. That a real transcription ever arrives for stage 4 within this goal''s budget: 0.3, since
    RQ-FRODO-a2dbe2 constraint 1 is undischarged; the synthetic part is what I expect to produce numbers,
    and its value is that it tells a later batch the maximum input width worth propagating.'
