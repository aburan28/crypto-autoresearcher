idea:
  id: IDEA-20261007-9b9dac
  question_id: RQ-SSI-001
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Non-isomorphic twists of a supersingular j at p = 23 differ by
    92 points
  class: measurement
  claim: >-
    Let p = 23. Whenever a supersingular j-invariant in F_{p^2} has
    two short-Weierstrass models over F_{p^2} that share that
    j-invariant and are not isomorphic over F_{p^2}, the absolute
    difference of their F_{p^2}-point counts is 92.
  mechanism: >-
    The object is a pair of models with the same j and no
    F_{p^2}-isomorphism. The observable is the absolute difference
    of the two point counts. Sigma is quadratic twist, not Frobenius
    on 2-torsion roots and not a character of an x-coordinate. A
    difference other than 92, including 0, falsifies the claim for
    that pair. No group-order formula is cited as a theorem. No
    isogeny exponent moves.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Isogenous curves have the same number of points. Twists that
        are not isogenous are outside that equality.
      verified_by: coordinator
    - ref: RQ-SSI-001
      provenance: internal
      claim: >-
        Toy-scale auxiliary structure is in scope, and toy-only
        effects are hypothesis-generating only.
      verified_by: coordinator
  assumptions:
    - Models are short Weierstrass and nonsingular. A singular model is excluded and listed.
    - Isomorphism is tested over F_{p^2}. A model isomorphic over a larger field still counts as a distinct class here when no F_{p^2}-isomorphism exists.
    - The integer 92 is 4 times 23. It is the predicted difference, not a measured one.
  predictions:
    - metric: absolute difference of F_{p^2}-point counts for each non-isomorphic twist pair
      direction: different
      minimum_effect: Every such pair differs by 92. Any other difference is the negative.
  minimal_test:
    design: >-
      At p = 23, list supersingular j-invariants in F_{p^2}. For
      each j that has two non-isomorphic short-Weierstrass models
      over F_{p^2}, count rational points of both models and record
      the absolute difference. Before any pair is scored, the point
      counter on y^2 = x^3 - x over F_23 must return the same order
      twice.
    controls:
      - The point counter agrees with itself on y^2 = x^3 - x over F_23.
      - A pair of isomorphic models is not entered as a twist pair.
      - If a j has no second non-isomorphic model, it is listed and is not scored as difference 92.
    required_metrics:
      - number of supersingular j-invariants that have a non-isomorphic twist pair
      - the multiset of absolute point-count differences
      - pass or fail of the repeated count on y^2 = x^3 - x
  falsification_conditions:
    - Some scored pair has absolute point-count difference different from 92.
    - The repeated count on y^2 = x^3 - x disagrees with itself. No twist difference from that run is admissible.
  confounders:
    - Counting points over F_p instead of F_{p^2} changes the integer.
    - Identifying twists that are isomorphic over F_{p^2} manufactures a pair the claim does not talk about.
  interpretation_limits:
    - A difference of 92 at p = 23 does not change supersingular isogeny exponents.
    - Absence of any twist pair is not success and is not the negative. The negative is a scored pair whose difference is not 92.
    - This is not the claim that every supersingular class has three rational points of order 2.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The two non-isomorphic F_{p^2} models of one supersingular j
        are assumed to carry Frobenius traces of opposite sign and
        absolute value 2p, hence point counts differing by 4p = 92.
        No source for that trace statement was opened this session.
      rigorous_support: >-
        Point counts are integers, and an absolute difference is
        defined. The identification of the difference with 4p is the
        heuristic.
      validation_plan: >-
        Direct point counts at p = 23, and the same pair search at
        p = 19. Comparison is the difference against 4p. Refutation
        is any scored pair whose difference is not 4p.
  target_complexity:
    time_exponent: >-
      Unchanged. The archived supersingular algorithm remains
      p^{1/3+o(1)}. A point-count gap is not an attack exponent.
    memory_exponent: >-
      Unchanged. The census stores one pair of models per j at
      p = 23.
    best_known: >-
      KR-RHO-755e35 equates point counts for isogenous curves and
      does not price a twist gap. RQ-SSI-001 keeps the surviving
      path-finding bounds.
    hidden_overhead: No new o(1) is claimed.
    tradeoff_note: >-
      No time-memory tradeoff. The p = 19 repeat is a validation
      sample.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      The claim is a point-count gap between twists at one prime.
      It is not an ECDLP cost or exponent.
    nearest:
      - ref: KR-RHO-755e35
        provenance: internal
        relation: adjacent
        delta: >-
          That row equates point counts inside an isogeny class.
          Non-isomorphic twists need not be isogenous. The gap is
          a difference of 92 against any other nonnegative integer.
        verified_by: coordinator
      - ref: KR-RHO-53c89f
        provenance: internal
        relation: orthogonal
        delta: >-
          Special-curve transfers are not this difference. The
          numerical gap remains 92 versus any other difference.
        verified_by: coordinator
    searched:
      corpus_grep:
        - origin/main SSI proposals dated 20261005 through 20261007
        - pull requests 1968 and 1969 idea claims
      web: []
  dominated_by: >-
    KR-RHO-755e35 was opened and does not dominate a twist gap of
    92, because it equates counts only for isogenous curves.
    KR-RHO-53c89f was opened and does not state this difference.
  sota_delta: >-
    Claimed absolute difference 92. Any other difference, including
    0, is a gap of at least 1 from 92. The comparison is that
    integer, not an exponent.
