idea:
  id: IDEA-20260805-887d67
  question_id: RQ-XEDN-002
  added: '2026-08-05'
  title: >-
    Generic versus fibre-specific relations: RQ-XEDN-002 measured the half of the
    relation lattice that is instance-independent by construction, and Minkowski
    forces the other half to grow like M^(1/n) -- so the quantity that governs a
    lifting relation source is M = |image of specialisation|, which nothing in
    this corpus has measured
  class: mechanism

  claim: >-
    Let S be one of the surfaces censused by EXP-XEDN-004, with free-x sections
    P_1, ..., P_n in E(F_p(t)), and let t_0 be a point of F_p over which the
    fibre E_{t_0} is smooth. Specialisation sigma_{t_0} : E(F_p(t)) ->
    E_{t_0}(F_p) is a group homomorphism, so the integer vectors c with
    sum_i c_i sigma_{t_0}(P_i) = O form a subgroup K_{t_0} of Z^n containing the
    GENERIC relation lattice R = {c : sum_i c_i P_i = O in E(F_p(t))}. The XEDN
    census measured R and only R: its own per-surface records carry the field
    generic_relation_is_O with value true on every reported relation, and its
    verification step is a group-law identity over F_p(t) confirmed by
    specialisation at >= 20 fibres -- i.e. it accepted a relation exactly when it
    held at every fibre simultaneously.
    Two consequences, both derivable before any run.
    (i) R is instance-independent by construction. A vector in R specialises to a
    relation at EVERY smooth fibre, so it is the same relation for every target
    instance the surface could ever be used against. Its comparator spread across
    instances is exactly zero. Whatever the coefficient bound on R turns out to
    be -- and IDEA-20260805-9ad641 argues it is forced to 1 by E_8 root geometry
    -- it cannot bear on whether a lifting construction yields a usable relation
    source, because the objects it bounds carry no information about the fibre.
    (ii) The complementary half, K_{t_0} modulo R, is forced to GROW. Take the
    P_i independent in the Mordell-Weil lattice, so R = 0 and no generic relation
    exists at all. Then Z^n / K_{t_0} embeds in E_{t_0}(F_p), so K_{t_0} is a
    full-rank sublattice of Z^n of determinant exactly
    M := |<sigma(P_1), ..., sigma(P_n)>| <= #E_{t_0}(F_p) = N ~ p, and by
    Minkowski / the Gaussian heuristic its shortest vector in the infinity norm
    satisfies lambda_1^inf(K_{t_0}) ~ M^(1/n) / 2. For n independent sections and
    M ~ p this is ~ p^(1/n): a slope of 1/n against log p, versus the census's
    reported slope of 0.0 with jackknife CI [0,0] for the generic half.
    The two halves therefore answer opposite questions, and the completed goal
    answered the one that is instance-free. The proposal's substantive content is
    what follows: the cost of FINDING a vector of K_{t_0} without prior discrete
    logarithms is governed by the volume of the search box, and the box of side
    M^(1/n) in n dimensions has volume M regardless of n -- so meet-in-the-middle
    over it costs M^(1/2), which is p^(1/2) whenever M ~ p, exactly Pollard rho
    and no better. THE EXPONENT IS CARRIED BY M, NOT BY n AND NOT BY THE
    COEFFICIENT BOUND. M has never been measured in this corpus. If a surface
    family can be exhibited on which M is systematically smaller than N -- say
    M ~ p^(2/3) -- the per-relation cost falls to p^(1/3), and that would be an
    exponent statement. If M ~ N on every family, the route is closed with a
    named obstruction and forward guidance, which is a first-class deliverable
    and is what this proposal expects.
    NOTHING HERE IS A RESULT. No run has happened; every quantity above is a
    forced value to be checked or a cost identity to be derived.

  object_first_candidate:
    tracked_object: >-
      The SPECIALISATION IMAGE, M_{t_0} = |<sigma_{t_0}(P_1), ..., sigma_{t_0}(P_n)>|,
      the order of the subgroup of E_{t_0}(F_p) generated by the specialised
      sections -- followed through the computation as the fibre t_0 varies over
      F_p and as the surface varies over the family. Everything the proposal
      claims is a function of this one integer: the determinant of the
      fibre-specific relation lattice is M, its shortest vector is M^(1/n), and
      the meet-in-the-middle cost of finding a relation is M^(1/2). The census's
      tracked object was the coefficient vector of a generic relation; M is a
      different object living on the other side of the same map.
    established_families_off_limits: >-
      Off-limits as the primary lens for this proposal: (i) xedni calculus as a
      lifting pipeline -- the lift probability is settled at alpha = 3
      (EXP-XEDN-001, DEC-20260724-021) and this proposal does not propose to
      lift anything; (ii) Semaev summation polynomials and Groebner solving;
      (iii) index calculus with an x-coordinate factor base and the whole
      smoothness/yield apparatus; (iv) isogeny, volcano and CM structure;
      (v) Pollard rho / BSGS as mechanisms rather than as the baseline they are
      here; (vi) GHS / Weil descent. Also off-limits, and this is the load-bearing
      exclusion: the degree-window raise (deg a <= 4; deg x <= 3 with deg b = 10),
      which is the declared scope of sibling goals GOAL-XEDN-002 and
      GOAL-XEDN-003 and was the red team's named next control (RT-XEDN-004 item
      4). This proposal changes the RELATION CLASS, not the degree window.
    newness_score: >-
      The distinction between a relation valid over the function field and one
      valid only at a fibre is elementary and certainly known to anyone who has
      thought about specialisation. What is absent from this corpus is any
      measurement of the second class: grep of ledger/, experiments/ and
      knowledge/ on 2026-08-05 finds specialisation used exclusively as a
      VERIFICATION step for generic relations (H-XEDN-003 assumptions,
      EXP-XEDN-004 relation_verification, "specialisation to O at >= 20 distinct
      smooth fibres") and never as a source of relations, and finds no record of
      the quantity M anywhere. The novelty claimed is that inversion of the role
      of specialisation, plus the identification of M as the exponent-carrying
      parameter. It is not a novel theorem.
    testability_score: >-
      High and cheap at toy scale. At p <= 10^5 the discrete logarithms in
      E_{t_0}(F_p) can be computed by exhaustive search, so K_{t_0} can be built
      exactly by Hermite normal form and its shortest infinity-norm vector found
      by direct enumeration or a small integer reduction in dimension <= 8. Pure
      Python, no SageMath -- which matters, because SageMath is ABSENT from this
      container (verified 2026-08-05: import sage -> ModuleNotFoundError; numpy
      2.4.6 present; sympy absent), while the frozen predicate module
      experiments/EXP-XEDN-001/xedni_sections.py imports and runs here.
      Computing DLs to build K is a legitimate toy-scale instrument and is NOT a
      claim that an attacker could do so; that distinction is enforced explicitly
      in interpretation_limits.
    survival_score: >-
      The object survives to the point where it matters and then stops, which is
      the honest answer. M controls the relation lattice's determinant, the
      shortest relation, and the meet-in-the-middle cost -- three steps of real
      propagation. It does NOT survive into an attack, because relating the
      specialised sections to an externally given target still requires the
      lift, whose probability is p^-3. The proposal states that ceiling up front
      rather than discovering it at the end.

  mechanism: >-
    Objects and maps. S -> P^1 the rational elliptic surface of
    y^2 = x^3 + a(t)x + b(t) over F_p(t) with deg a <= 2, deg b = 6, Delta not
    identically 0. L = E(F_p(t)) modulo torsion, a lattice of rank r <= 8 under
    the Shioda height pairing. P_1, ..., P_n free-x sections, generating a
    sublattice L' of rank r' <= min(n, 8). For t_0 in F_p with Delta(t_0) != 0,
    the reduction E_{t_0} : y^2 = x^3 + a(t_0)x + b(t_0) is a nonsingular curve
    over F_p with N_{t_0} = #E_{t_0}(F_p) = p + 1 - a_{t_0} points, and
    sigma_{t_0} : E(F_p(t)) -> E_{t_0}(F_p), (x(t), y(t)) |-> (x(t_0), y(t_0)),
    is a group homomorphism.

    The two relation lattices. Define
      R      = {c in Z^n : sum_i c_i P_i = O in E(F_p(t))}   (generic),
      K_{t0} = {c in Z^n : sum_i c_i sigma_{t0}(P_i) = O}    (fibre-specific).
    R is contained in K_{t_0} for every good t_0, and rank R = n - r'. The
    quotient Z^n / K_{t_0} injects into E_{t_0}(F_p) with image
    <sigma(P_1), ..., sigma(P_n)>, so [Z^n : K_{t_0}] = M_{t_0} exactly, where
    M_{t_0} is that subgroup's order. In particular K_{t_0} has FULL rank n for
    every good t_0, no matter what r' is: a free abelian group of any rank maps
    to a finite group with kernel of finite index.

    What the census measured. EXP-XEDN-004's relation_verification accepts a
    vector only after a group-law identity over F_p(t) plus specialisation to O
    at >= 20 distinct smooth fibres, and its per-surface records carry
    generic_relation_is_O: true. That is a measurement of R. Since a vector of R
    specialises to a relation at every good t_0, the observable it produces is
    constant over the whole family of fibres, hence over every target instance
    such a surface could be pointed at. This is the mirror failure of the
    lossy-projection test in its cleanest form: an observable with zero
    comparator spread.

    What is forced about the other lattice. Suppose the P_i are independent in
    L, so R = 0 and the census's own instrument would report "no relation"
    (the archived skip_reason no_relation_in_observed_span). Then K_{t_0} is a
    full-rank sublattice of Z^n with det = M_{t_0}. By Minkowski's convex body
    theorem applied to the cube [-lambda, lambda]^n, a nonzero lattice point
    exists once (2 lambda)^n >= 2^n det, i.e. lambda >= M^(1/n); the Gaussian
    heuristic sharpens this to lambda_1^inf ~ M^(1/n) / 2 for a random such
    lattice. FORCED VALUE F-M1: log(lambda_1^inf(K_{t_0})) / log(M_{t_0}) -> 1/n.
    Against the census's slope of 0 for R, this is slope 1/n > 0 for the
    complementary class. The two numbers are not in conflict; they are about
    different objects, and the point of the proposal is that only one of them
    could ever matter to a relation source.

    The cost identity, which is where the exponent lives. Finding a vector of
    K_{t_0} is trivial GIVEN discrete logarithms in E_{t_0}(F_p), and that is
    circular. Without them, the search is over the box
    B(lambda) = {c : |c_i| <= lambda} for lambda ~ M^(1/n). The number of points
    in that box is (2 lambda + 1)^n ~ M, INDEPENDENT OF n: raising n shrinks the
    side of the box exactly enough to keep its volume at M. Splitting the box
    into two halves and matching (van Oorschot-Wiener / meet-in-the-middle) costs
      time ~ M^(1/2),  memory ~ M^(1/2),  or the memory-free rho variant at
      time ~ M^(1/2) with O(1) memory,
    and no split of a box of volume M into two sets can have both sets smaller
    than M^(1/2) (AM-GM; this is the same two-table bound the corpus records as
    R10). FORCED VALUE F-M2: the per-relation cost of a lifting relation source
    of this shape is Theta(M^(1/2)) with no dependence on n, on the coefficient
    bound, or on the degree window. Since M <= N ~ p, that is at best p^(1/2) --
    exactly Pollard rho -- and it is strictly worse than rho once the lift is
    charged at p^3 (EXP-XEDN-001, DEC-20260724-021).

    Where the exponent could move, stated so it can be attacked. The only free
    parameter in F-M2 is M. If a family of (surface, fibre) pairs can be
    exhibited with M ~ p^theta for theta < 1, the per-relation cost falls to
    p^(theta/2). Three concrete mechanisms that would produce theta < 1, each of
    which is checkable and none of which this proposal asserts holds:
      (M-a) The specialised sections land in a proper subgroup. This happens
            automatically when E_{t_0}(F_p) is non-cyclic, E_{t_0}(F_p) ~
            Z/n_1 x Z/n_2 with n_2 | n_1 and n_2 | p - 1, and the sections lie in
            a single factor. The distribution of n_2 over t_0 in F_p is a
            measurable quantity nobody in this lane has measured.
      (M-b) The surface has a torsion section, or the free sections are
            divisible: if every sigma(P_i) lies in k * E_{t_0}(F_p) then
            M <= N / k.
      (M-c) The Mordell-Weil rank collapses at special fibres. Rank r' bounds the
            number of generators of the image but not its order; still, a
            systematically small image is exactly what a designed family would
            aim for.
    Forward guidance if the audit closes the route: the obstruction to name is
    "the search box has volume M regardless of dimension, so the coefficient
    bound is not a cost parameter", and what remains open is the construction of
    families with small M -- which is a question about the DISTRIBUTION OF GROUP
    ORDERS AND SUBGROUP STRUCTURE ALONG A FIBRATION, not about coefficient
    bounds, and is where a successor goal should point.

    Why this is the right next question for a completed goal. GOAL-XEDN-001
    closed on the observation that max_|coeff| stays at 1 without mu_3. Under
    this proposal that observation is about R, whose comparator spread is zero.
    The question just outside its boundary is not a wider degree window -- the
    siblings did that -- but the other lattice, whose coefficient behaviour is
    forced to be the opposite and whose governing parameter has never been
    written down.

  novelty_status: unverified

  literature_context:
    - >-
      J. H. Silverman, specialisation theorem for elliptic surfaces (the set of
      t_0 at which sigma_{t_0} fails to be injective has bounded height / is
      thin, over a NUMBER FIELD base). NOT READ -- RECALLED, UNVERIFIED. It is
      cited here specifically to record that IT DOES NOT APPLY: the base field
      here is F_p(t) with t_0 ranging over the finite field F_p, and
      sigma_{t_0} maps a free group of rank up to 8 into a group of order ~p, so
      it CANNOT be injective. The failure of the number-field intuition is the
      whole reason K_{t_0} is large, and getting this backwards would invert the
      proposal. Verifying the correct statement over function fields with finite
      constant field is a required step of the experiment.
    - >-
      T. Shioda, "On the Mordell-Weil lattices", Comment. Math. Univ. St. Pauli
      39 (1990). NOT READ -- RECALLED, UNVERIFIED. Used only for the rank bound
      r <= 8 on a rational elliptic surface, which caps n' = rank of the
      independent subfamily and therefore caps how small M^(1/n) can be made.
      Same verification obligation as in IDEA-20260805-9ad641.
    - >-
      DEC-20260724-021 and EXP-XEDN-001 for the lift probability
      P_lift(p) = (1 - 2/p + p^-3) / (2 p^3), alpha = 3, independently re-derived
      and brute-force confirmed at p = 5, 7. NOT READ this session -- relayed
      from the 2026-08-05 scouting brief, which quotes the identity. This
      proposal uses it only as the ceiling it charges against and does not
      re-derive it.
    - >-
      DEC-20260724-021 also publishes a forbidden-sentence list including "the
      multi-section or Mordell-Weil relation-source route is closed" and "no
      lifting-based relation source exists over F_p(t)". NOT READ in full --
      relayed. This proposal writes neither. It proposes a cost identity with a
      named parameter and three concrete conditions under which the identity
      would give a different answer, which is the opposite of a closure.
    - >-
      The two-table meet-in-the-middle bound |A| + |B| >= 2 sqrt(N) by AM-GM,
      recorded in this corpus as R10. NOT READ this session -- relayed. Used for
      F-M2 and re-derived inline above, so the citation is a pointer and not an
      authority.

  lossy_projection_identifiability_audit:
    projection: >-
      Two projections are compared, which is the substance of the record.
      PROJ-R: (surface, sections) |-> the generic relation lattice R and the
      infinity norm of its shortest vector. This is what the census measured.
      PROJ-K: (surface, sections, fibre t_0) |-> the pair
      (M_{t_0}, lambda_1^inf(K_{t_0})). This is what the proposal measures.
    what_is_discarded: >-
      PROJ-R discards the fibre entirely -- t_0 does not appear in it -- and with
      it every arithmetic feature of the target instance. PROJ-K discards the
      sections' coefficients and the surface's equation, retaining only the order
      of the subgroup they generate at one fibre and the geometry of the
      resulting kernel lattice.
    why_genuinely_lossy: >-
      PROJ-K is genuinely lossy: many section tuples on many surfaces give the
      same M, and M is a single integer bounded by p + 1 + 2 sqrt(p). The fibre
      over an observed (M, lambda_1) is large.
    why_compatible_with_the_operations: >-
      Compatible in the strong sense required: sigma_{t_0} is a group
      homomorphism, so the retained structure propagates deterministically under
      the group law -- K_{t_0} is exactly a kernel, and sums of sections map to
      sums of images. This is the property PROJ-R also has and is not where the
      two differ.
    is_it_only_a_change_of_coordinates: >-
      Which failure was checked for, and what the check returned, for each
      projection separately.
      PROJ-R: checked for the MIRROR failure (constant across instances, zero
      comparator spread). RESULT: FAILS. A vector of R specialises to a relation
      at every good fibre by definition of R, so the observable is literally
      independent of t_0. This is not a criticism of the census's arithmetic; it
      is the reason a bound on R cannot decide a relation-source question.
      PROJ-K: checked for BOTH failures. It is not the (Delta, Pi) failure -- the
      section coefficients are not recoverable from (M, lambda_1), so information
      is genuinely discarded. It is not the mirror failure either -- M_{t_0}
      varies with t_0 because #E_{t_0}(F_p) varies with t_0 over a Sato-Tate-like
      range of width ~4 sqrt(p), and lambda_1 varies with it; the comparator
      spread is therefore nonzero BY CONSTRUCTION, and measuring that spread is
      the experiment's first arm. This is precisely the property PROJ-R lacks and
      is the reason the proposal is not a repackaging of the census.

  assumptions:
    - >-
      That sigma_{t_0} is a group homomorphism on the smooth fibres. Standard,
      but stated because everything rests on it; a fibre with Delta(t_0) = 0 must
      be excluded and its exclusion recorded.
    - >-
      That the Gaussian heuristic applies to K_{t_0} -- i.e. that the kernel
      lattice behaves like a random full-rank sublattice of Z^n of determinant M.
      THIS IS A HEURISTIC AND IT IS LOAD-BEARING for F-M1; it is numbered as
      HEUR-XEDN-C1 below with its own falsification condition. It is exactly the
      kind of assumption the target-result profile requires to be numbered rather
      than absorbed.
    - >-
      That "independent in the Mordell-Weil lattice" can be certified. The
      certificate is a nonsingular Shioda height Gram, which the census's
      pseudo-Gram cannot provide (see IDEA-20260805-9ad641); the experiment must
      compute a real one or certify independence by a different route, and this
      dependency is declared.
    - >-
      That computing discrete logarithms at toy p to BUILD K is methodologically
      acceptable. It is, as an instrument for measuring a lattice invariant, and
      it is not acceptable as a cost model. The distinction is enforced in
      interpretation_limits and in the experiment's what_this_is_not.

  proof_search_map_note: >-
    This idea is proof-oriented -- F-M2 is a cost lower bound with quantifiers --
    so its paired hypothesis H-XEDN-2945b2 carries the filled proof_search_map
    with all four audits per docs/inventor-protocol.md section 8. Not repeated
    here.

  predictions:
    - metric: >-
        minkowski_exponent: the slope of log lambda_1^inf(K_{t_0}) against
        log M_{t_0}, over surfaces and fibres at fixed n, with n independent
        sections
      direction: higher
      minimum_effect: >-
        FORCED VALUE derived pre-run: 1/n, with the Gaussian-heuristic constant
        1/2 on the intercept, so lambda_1^inf ~ M^(1/n)/2. Declared tolerance
        before the run: the fitted slope must lie within [0.7/n, 1.4/n]. A fitted
        slope of 0 -- i.e. bounded coefficients in the fibre-specific class too --
        falsifies the central mechanism and would be a far more interesting
        outcome than confirmation.
    - metric: >-
        section_to_random_ratio: lambda_1^inf(K_{t_0}) for the specialised
        sections, divided by lambda_1^inf for n UNIFORMLY RANDOM points of
        E_{t_0}(F_p) generating a subgroup of the same order M, same n, same
        fibre
      direction: different
      minimum_effect: >-
        FORCED VALUE: 1.0 within sampling noise, predicted before the run,
        because under the mechanism the surface contributes nothing beyond n
        group elements once specialised. Declared decision rule: a mean ratio
        below 0.8 over >= 50 matched pairs is a genuine surface-specific signal
        and reopens the relation-source question with a measured effect size.
        This is the RATIO the corpus's own T-A template demands in place of a raw
        statistic, and this lane has never reported one.
    - metric: >-
        M_over_N: the distribution of M_{t_0} / N_{t_0} over all good fibres t_0
        in F_p, per surface
      direction: higher
      minimum_effect: >-
        FORCED VALUE under the generic expectation: concentrated at 1, with mass
        at 1/k for small k coming from non-cyclic E_{t_0}(F_p) and from divisible
        sections. Pre-registered: median M/N = 1. THIS IS THE QUANTITY THE WHOLE
        PROPOSAL TURNS ON and it has never been measured; any surface family with
        a systematically depressed M/N is the exponent-relevant object and is
        promoted immediately.
    - metric: >-
        box_volume_invariance: the number of integer points in the search box
        {|c_i| <= lambda_1^inf}, as a function of n
      direction: different
      minimum_effect: >-
        FORCED VALUE: ~M, flat in n. A measured box volume that DECREASES with n
        falsifies F-M2 and would mean the coefficient bound is a cost parameter
        after all, which would make the census's statistic exponent-relevant
        retroactively.
    - metric: >-
        generic_relation_share: fraction of the census's archived verified
        relations whose recorded generic_relation_is_O field is true
      direction: higher
      minimum_effect: >-
        FORCED VALUE: 1.0, read from the archive. If any archived relation is
        fibre-specific rather than generic, then the census did sample the second
        class and this proposal's framing of what it measured is wrong.

  minimal_test:
    design: >-
      Specified in full in EXP-XEDN-9bd3bd. Five stages, cheapest first, each
      able to terminate the line. STAGE 0 (zero compute, minutes): read the
      archived generic_relation_is_O fields and confirm the census measured R
      only; if any relation is fibre-specific, stop. STAGE 1 (pen and paper,
      hours, zero compute): derive F-M1 and F-M2 in full, including the AM-GM
      box-splitting bound, and have the derivation checked; a defect here ends
      the line before compute. STAGE 2 (pure Python, minutes, p <= 1009): build
      K_{t_0} exactly by brute-force discrete logarithm and Hermite normal form,
      measure lambda_1^inf by direct box enumeration, and check F-M1 at
      n = 2..8. STAGE 3 (pure Python, hours, p up to ~10^5 by baby-step
      giant-step): extend the slope fit and measure the M/N distribution over all
      good fibres. STAGE 4: the matched-random-points null and the subgroup
      positive control.
    controls:
      - >-
        NULL OBJECT, matched, forced value derived pre-run, CAN FAIL. For each
        (surface, fibre, n) cell, draw n uniformly random points of E_{t_0}(F_p)
        CONDITIONED on generating a subgroup of the same order M, and run the
        identical K-construction and lambda_1 measurement. Matched on n, on M,
        on the fibre and on the group, so the only difference is whether the
        points came from sections. FORCED VALUE: ratio 1.0. It can genuinely
        fail -- if sections specialise to points in special position the ratio
        drops -- and its failing is the outcome that would most raise the value
        of the whole XEDN lane. Recorded and committed before the section arm is
        read.
      - >-
        POSITIVE CONTROL, the effect MUST appear. Construct cells with M reduced
        by a known factor k: replace each sigma(P_i) by k * sigma(P_i), which
        forces the generated subgroup into index >= k, and require the measured
        lambda_1^inf to fall by a factor k^(1/n) within tolerance. Declared
        thresholds before the run: at n = 4 and k = 16 the predicted drop is
        exactly 2.0, and the control passes only if the measured drop is in
        [1.6, 2.5]. If lambda_1 does NOT move when M is deliberately reduced by a
        factor of 16, the instrument is not measuring the lattice determinant, it
        is broken, and NO negative result may be reported from any arm.
      - >-
        GRADED CONTROL, 7 interior points, monotonicity reported. Vary
        n = 2, 3, 4, 5, 6, 7, 8 at fixed M and report lambda_1^inf(n).
        Pre-registered prediction: strictly decreasing, tracking M^(1/n), i.e.
        the ratio lambda_1(n) / lambda_1(n+1) close to M^(1/(n(n+1))). A curve
        that FAILS TO DECAY as n increases is the canonical artifact tell of
        docs/inventor-protocol.md section 3 and localises the fault to the
        lattice construction rather than leaving "it did not work". A curve that
        decays FASTER than M^(1/n) means the kernel lattices are not
        Gaussian-heuristic-random, which refutes HEUR-XEDN-C1 in a stated
        direction and is itself a finding.
      - >-
        SECOND GRADED CONTROL on the fibre. Report lambda_1^inf and M for every
        good t_0 in F_p on a fixed surface, and check that lambda_1 tracks
        M^(1/n) ACROSS FIBRES on the same sections. This is the comparator-spread
        measurement that PROJ-R structurally cannot produce, and reporting a
        nonzero spread is the concrete demonstration that the two projections
        differ.
      - >-
        ORDERING CONTROL. Null arm and positive control are computed, recorded
        and hash-committed before the section arm's lambda_1 values are looked at.
      - >-
        BASELINE-COST CONTROL. Report the measured meet-in-the-middle cost of
        finding a K-vector without discrete logarithms, at the toy sizes, beside
        the rho baseline sqrt(N) on the same curve. Both numbers, same units,
        same fibre. A relation source that is not compared against rho on the
        same instance has not been costed.
    required_metrics:
      - fitted slope of log lambda_1^inf vs log M at each n, with confidence interval and the fit method
      - section-to-random-points ratio with number of matched pairs and seeds
      - full M/N distribution per surface over all good fibres
      - lambda_1 vs n curve with monotonicity verdict
      - positive-control drop factor at k = 4, 16, 64 against the predicted k^(1/n)
      - measured MITM cost and rho baseline on the same fibre, same units

  falsification_conditions:
    - >-
      The fitted Minkowski slope is 0, or outside [0.7/n, 1.4/n]. F-M1 is wrong
      and the claimed contrast with the census's slope-0 result collapses.
    - >-
      The measured box volume decreases with n. F-M2 is wrong; the coefficient
      bound IS a cost parameter and the census's statistic becomes
      exponent-relevant.
    - >-
      Any archived census relation is fibre-specific rather than generic. The
      proposal's account of what the census measured is wrong.
    - >-
      The section-to-random-points ratio is systematically below 0.8. The surface
      contributes real structure beyond n group elements and the relation-source
      question is reopened with a measured effect size -- the most valuable
      possible outcome and the one the proposal does not expect.
    - >-
      The positive control fails: lambda_1 does not fall when M is reduced by a
      known factor. Nothing may be reported from any arm.
    - >-
      M/N is systematically below 1 on some identifiable subfamily. F-M2's
      conclusion "no better than rho" does not apply there, and that subfamily
      becomes the successor object.

  confounders:
    - >-
      TOY-SCALE DISCRETE LOGARITHMS. Building K by brute-force DL is available
      only because p is tiny. It measures a lattice invariant; it is NOT part of
      any proposed attack, and any cost statement must be derived from the box
      volume, never from the instrument's own runtime. Conflating them would be a
      partial-cost error of exactly the kind AGENTS.md rule 4 forbids.
    - >-
      NON-CYCLIC GROUPS. When E_{t_0}(F_p) is non-cyclic, M is not determined by
      N and the Gaussian heuristic on K may be distorted by the group's own
      structure. The group structure must be reported per fibre, not just N.
    - >-
      SMALL n AND SMALL p. At n = 2, 3 and p <= 1009 the asymptotic
      lambda_1 ~ M^(1/n)/2 has large relative error; the slope fit must exclude
      cells where the predicted lambda_1 is below ~4, and that exclusion rule is
      declared before the run rather than chosen after.
    - >-
      SELECTION IN THE ARCHIVED SURFACES. The census's surfaces were found by a
      two-section Weierstrass solve, i.e. conditioned on carrying two prescribed
      sections. Any statement about the family inherits that conditioning. The
      random-points null is matched on M and n, which controls for it in the
      ratio but not in any absolute statement.
    - >-
      INDEPENDENCE CERTIFICATION. If the P_i are NOT independent in L, then
      R != 0, lambda_1(K) = lambda_1(R) = 1 trivially, and the measurement
      collapses onto the census's. Cells must be certified independent before
      they enter the slope fit, and cells that fail certification must be
      reported separately rather than dropped silently -- silent dropping is the
      censoring failure that IDEA-20260805-b6af55 raises against the census.

  interpretation_limits:
    - >-
      This is toy scale. p <= 10^5 is not crypto scale and no outcome here
      supports, weakens or bears on any claim about a deployed curve
      (AGENTS.md rule 7).
    - >-
      A confirming outcome does NOT close the lifting relation-source route. It
      supplies a named obstruction (the search box has volume M independent of
      dimension) with forward guidance (families with small M), which is what
      docs/inventor-protocol.md section 4 requires of a negative and what a
      fatigue report is not. It specifically does not license the sentences
      DEC-20260724-021 forbids.
    - >-
      A confirming outcome does NOT retract, weaken or contradict EV-XEDN-003 or
      DEC-20260725-001. Those record a correct measurement of a different object.
      What it would do is narrow their claim boundary to the generic relation
      lattice, and the mechanism for that is a superseding record under a new id,
      never an edit (AGENTS.md rule 4), and only by the Coordinator (rule 1).
    - >-
      No status change to any existing record is proposed or implied.
    - >-
      If the section-to-random ratio comes out below 0.8, that is a claimed new
      structural signal on a hard problem and is routed to independent
      review-adversarial review before any promotion; it is not a breakthrough
      claim at toy scale and must not be written as one.

  heuristic_assumptions:
    - id: HEUR-XEDN-C1
      statement: >-
        FORMAL STATEMENT. For n independent free-x sections on a surface in the
        EXP-XEDN-004 family and a uniformly chosen good fibre t_0 in F_p, the
        kernel lattice K_{t_0} = ker(Z^n -> E_{t_0}(F_p)) behaves, with respect
        to its shortest infinity-norm vector, like a uniformly random full-rank
        sublattice of Z^n of determinant M_{t_0}: precisely,
        E[log lambda_1^inf(K_{t_0})] = (1/n) log M_{t_0} + O(1) with the O(1)
        depending only on n. Quantifiers: for all n <= 8, for all surfaces in the
        frozen family, over the random choice of t_0.
      random_model_justification: >-
        The map Z^n -> E_{t_0}(F_p) is determined by the n images
        sigma(P_i); if those behave like independent uniform elements of a group
        of order M, the kernel is a uniformly random index-M sublattice, for
        which the Gaussian heuristic is the standard model and Minkowski's
        theorem supplies the rigorous upper bound lambda_1^inf <= M^(1/n). The
        rigorous half (an upper bound on lambda_1) is unconditional; only the
        matching lower bound is heuristic.
      supporting_results: >-
        Minkowski's convex body theorem applied to the cube (rigorous upper
        bound). The Gaussian heuristic for random lattices (classical, not a
        theorem in this setting). NEITHER IS CITED TO A READ SOURCE IN THIS
        RECORD; both are standard and both are to be stated with a reference in
        the experiment's stage 1, not taken from this record on trust.
      validation_experiment_ids: [EXP-XEDN-9bd3bd]
      falsification_condition: >-
        The measured mean of log lambda_1^inf / log M departs from 1/n by more
        than a factor 1.4 at n >= 4, or the lambda_1-vs-n curve is not monotone
        decreasing. Either refutes the random-lattice model for these kernels;
        the Minkowski upper bound survives regardless, so F-M2's conclusion
        (cost Theta(M^(1/2))) is only weakened, not lost -- the box volume
        argument does not use the heuristic.
    - id: HEUR-XEDN-C2
      statement: >-
        FORMAL STATEMENT. For surfaces in the frozen family, the median over good
        fibres t_0 of M_{t_0} / N_{t_0} equals 1; i.e. n >= 2 specialised
        sections generically generate the full group.
      random_model_justification: >-
        Two or more uniform elements of a finite abelian group generate it with
        probability bounded below by a constant depending on the group's rank
        (for a cyclic group, 1 - O(1/smallest prime factor)). Sections are not
        uniform, which is why this is a heuristic and not a theorem.
      supporting_results: >-
        Elementary counting for cyclic groups; the structure theorem for
        E(F_p) as a product of at most two cyclic factors. RECALLED, standard,
        not cited to a read source here.
      validation_experiment_ids: [EXP-XEDN-9bd3bd]
      falsification_condition: >-
        Median M/N below 1 on any identifiable subfamily. This is the
        falsification the proposal MOST WANTS to see, because it is the one that
        would move an exponent, and saying so explicitly is a guard against the
        proposal being written to survive.

  target_complexity:
    time_exponent: >-
      The proposal's own claim moves NO exponent and the audit is expected to
      confirm that: F-M2 gives per-relation cost Theta(M^(1/2)) = p^(1/2) when
      M ~ p, identical to Pollard rho, and strictly worse once the lift is
      charged at p^3. The exponent-relevant statement is CONDITIONAL and stated
      as such: if a subfamily with M ~ p^theta, theta < 1, exists, the
      per-relation cost is p^(theta/2), and at theta = 2/3 that is p^(1/3). The
      proposal does not claim such a subfamily exists; it identifies M as the
      only free parameter and makes measuring it the experiment.
    memory_exponent: >-
      M^(1/2) for the meet-in-the-middle form, or O(1) for the rho form of the
      same search at the same time exponent (van Oorschot-Wiener). Both are
      reported, per docs/claims-and-verification.md's requirement that memory be
      stated beside time -- a requirement the scouting brief records as missed by
      38 of 46 records in another lane.
    best_known: >-
      Pollard rho for ECDLP over F_p: time O(sqrt(p)) ~ p^(1/2), memory O(1),
      data O(1). BSGS: time p^(1/2), memory p^(1/2). No subexponential algorithm
      is known for prime-field ECDLP.
    hidden_overhead: >-
      The lift. Every statement above concerns relations among sections ALREADY
      on a surface; connecting them to an externally specified target point
      requires lifting that point into the surface, at probability
      ~ (2 p^3)^-1 per EXP-XEDN-001. That p^3 factor dominates everything else in
      the proposal and is stated here so no reader can mistake the cost identity
      for an attack cost.
    tradeoff_note: >-
      The n-dependence is a pure trade with no gain: raising n lowers the
      coefficient size to M^(1/n) and raises the number of coordinates to n,
      leaving the box volume at M. That invariance is the proposal's central
      negative and is stated as a trade rather than as a speedup.

  dominated_by: >-
    Pollard rho, on every axis, for any attack use. Rows checked across time,
    memory and data/queries before writing this field:
    (1) Pollard rho -- time p^(1/2), memory O(1), data O(1): dominates the
    proposal's M^(1/2)-time-and-memory MITM form on memory and ties on time when
    M ~ p, and dominates outright once the p^3 lift is charged;
    (2) BSGS -- p^(1/2) time and memory: ties the MITM form exactly, so the
    proposal is not even Pareto-incomparable with it;
    (3) van Oorschot-Wiener parallel collision search -- p^(1/2)/w time on w
    processors with small memory: dominates on the memory axis;
    (4) index calculus over F_p for ECDLP -- no subexponential method known, so
    nothing to compare;
    (5) the XEDN lane's own lifting route at alpha = 3 -- dominated by this
    proposal in the sense that this proposal at least identifies where the cost
    sits, but neither is an attack;
    (6) data/queries axis specifically -- the proposal needs no oracle queries
    and no chosen data, so it is not dominated there, and that is the only axis
    on which it is not, which is worth nothing on its own.
    dominated_by is therefore NOT null and the honest entry is: Pollard rho and
    BSGS both dominate or tie every cost point the mechanism can reach at M ~ p.
    The proposal's value is the conditional identification of M as the parameter
    that would have to move, and the measurement of it.
  sota_delta: >-
    Quantitatively, against the incumbent p^(1/2): the mechanism as measured is
    predicted to give p^(1/2) time with p^(1/2) memory, i.e. a delta of 0 in the
    time exponent and -1/2 in the memory exponent (worse), before the p^3 lift
    factor is charged, after which the delta is -3 in the time exponent (much
    worse). Against the XEDN lane's own state of knowledge the delta is a
    measurement: the coefficient growth exponent of the fibre-specific relation
    class moves from "unmeasured" to a fitted value with a forced prediction of
    1/n, and M/N moves from "never computed anywhere in this corpus" to a
    measured distribution. "Faster" is not claimed and would be false.

  estimated_cost:
    implementation: >-
      medium. Needs: elliptic curve arithmetic over F_p (short Weierstrass, ~60
      lines pure Python); baby-step giant-step DL (~40 lines); Hermite normal
      form over Z (~80 lines) or an equivalent kernel construction; shortest
      infinity-norm vector by box enumeration in dimension <= 8 (~50 lines,
      exact, no LLL needed at these sizes); the frozen section enumerator, which
      already exists and is pure Python. No SageMath, which is absent here.
    compute: >-
      low. Stage 2 at p <= 1009 with n <= 8 is seconds. Stage 3 at p ~ 10^5 with
      BSGS over all good fibres is the dominant cost and is estimated at single-
      digit CPU-hours; that estimate is a design figure, NOT a measurement, and
      must be replaced by a measured wall clock in the run record.
  recommended_priority: high
  honest_prior_of_survival: >-
    0.80 that F-M1 (slope 1/n) is confirmed within the declared tolerance. Not
    higher because HEUR-XEDN-C1 is a genuine heuristic and specialised sections
    are demonstrably not uniform points -- they come from a rank-<= 8 lattice and
    from surfaces selected by a two-section construction -- and because at
    n = 2, 3 the asymptotics are weak at toy p. Not lower because the Minkowski
    upper bound is unconditional, so the measured lambda_1 cannot exceed M^(1/n)
    at all, and the only question is whether it is much smaller.
    0.90 that F-M2 (box volume M, cost M^(1/2), no n-dependence) is confirmed --
    it is counting plus AM-GM and does not use the heuristic.
    0.10 that the section-to-random-points ratio comes in below 0.8, i.e. that
    there is a real surface-specific signal. Low, because specialisation is a
    homomorphism from a rank-<= 8 lattice into a group of order ~p and the image
    of a small independent set has no obvious reason to be in special position.
    Not lower, because nobody has looked, because the surfaces are a selected
    rather than uniform population, and because the scouting brief records
    DEC-20260805-2be965 finding four of five of another goal's named obstructions
    defective on audit -- this program's confident negatives have a measured
    failure rate.
    0.15 that a subfamily with systematically depressed M/N is found. That is
    the only outcome here that would move an exponent, and it is the one worth
    running the whole experiment for even at that prior.
