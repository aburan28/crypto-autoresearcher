idea:
  id: IDEA-20260809-5a9246
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-QRE-6dba8c
  goal_id: GOAL-QRE-001
  title: >-
    The physical error rate enters through the code distance, which enters
    quadratically — measure the elasticity of every output to that one number
  class: measurement
  claim: >-
    In surface-code costing, the assumed physical error rate determines the code
    distance needed for a target logical error rate, and the physical qubit count
    scales with the square of the distance. The claim is that the elasticity of
    the headline qubit count with respect to the assumed error rate is large
    enough that a factor-of-two change in that single assumption moves the
    headline by more than the difference between competing published estimates —
    and that this can be shown by direct computation rather than argued.
  mechanism: >-
    Express distance as a function of physical error rate and target logical
    error rate through the code's threshold behaviour, propagate through the
    qubit count and the cycle count, and differentiate numerically over a declared
    range of error rates.
  why_not_a_renamed_known_approach: >-
    The scaling is standard and every estimation paper states its assumed error
    rate. Computing and RANKING the elasticity, so that the headline number is
    attributed to its dominant assumption, is the contribution.
  predictions:
  - observable: elasticity of physical qubit count with respect to physical error rate
    metric: percentage change in qubits per percentage change in error rate
    predicted: >-
      Large, plausibly the largest single elasticity in the pipeline. If some
      other input dominates, that input becomes the goal's headline and the
      record says so.
  - observable: whether the elasticity is stable across the declared error-rate range
    metric: elasticity at several base points
    predicted: Rising as the error rate approaches threshold; instability near threshold must be reported rather than smoothed.
  minimal_test: >-
    Sweep the physical error rate across a declared range at fixed logical target,
    compute distance, qubits and time at each, and report elasticities at several
    base points.
  controls:
  - 'THRESHOLD CONTROL: the sweep must include points near the code threshold, where the model behaves differently, and the record must state where the model stops being valid.'
  - 'FORMULA PROVENANCE: the distance formula is either derived in the record or cited to filed text; an unsourced formula fails review.'
  falsification_conditions:
  - Elasticity is small over the whole range, contradicting the claim.
  - The distance formula cannot be sourced or derived, in which case no elasticity is admissible.
  interpretation_limits: >-
    Elasticities are properties of the model. They say nothing about what error
    rates hardware will achieve, and no such inference may be recorded.
  sota_delta: 'No feasibility claim. Delta: a ranked attribution of the headline number to its assumptions.'
  dominated_by: Not dominated by any corpus record.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for surface code / code distance: no records. WEB NOT CHECKED.'
  source_refs:
  - Surface-code costing references -- RECALLED, REQUIRED READS.
