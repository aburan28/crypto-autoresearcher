idea:
  id: IDEA-20260811-e6399d
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  axis: A5
  claim_tier: toy
  title: >-
    A j-invariant factor base with Phi_ell incidences is a real relation-collection
    scheme and it computes the ACTING GROUP, never the TORSOR COORDINATE: the set of
    MARKED pairs (E, P mod +-1) in one ordinary class is simply transitive under an
    extension of Cl(O) by (Z/N)^*/{+-1}, k is the kernel coordinate, and index calculus
    is structurally unable to reach it because decomposition needs a MONOID and a torsor
    has none -- so channel (1) closes with a named obstruction and one named missing map
  class: mechanism
  claim: |-
    (A) THE SCHEME EXISTS AND IS NOT NEW. Relation collection whose factor base is a set
    of j-invariants and whose relations are modular-polynomial incidences Phi_ell(j, j') = 0
    is an existing, published technique: it is how endomorphism rings of ORDINARY elliptic
    curves are computed subexponentially (Bisson; Bisson-Sutherland) [recall-confident,
    corpus KN-LIT-309, NOT re-verified this session]. A relation is a sequence of ell-isogeny
    steps returning to the starting j-invariant, i.e. a word in the ell-ideals that is
    trivial in Cl(O). Collecting enough of them yields the relation lattice of Cl(O), hence
    its group structure, hence (with the volcano level) the conductor f_E. THIS RECORD
    THEREFORE DOES NOT PROPOSE THAT SCHEME. It asks the only question the axis actually
    poses: what does such a relation SOLVE FOR, and can any variant of it reach k.

    (B) THE OBJECT THE DECOMPOSITION NEVER NAMES: THE MARKED CLASS. Let E/F_p be ordinary,
    End_{F_p}(E) = O of discriminant D_E, N prime with N || #E(F_p) and gcd(N, f_E) = 1,
    G = E(F_p)[N] = E[n] where n := (N, pi - 1) is an O-ideal of norm N. Define
        M := { (E', P') : E' in the F_p-isogeny class with End(E') = O,
                          P' in E'(F_p) of order N } / (isomorphism, and P' ~ -P').
    The group I(O) of invertible O-ideals coprime to N*f acts on M by
        a * (E', P') := (E'/E'[a], phi_a(P')),
    which is well defined because phi_a is unique up to an automorphism of the codomain and
    Aut = {+-1} is exactly what M quotients by. A PRINCIPAL ideal (alpha) acts by
    phi_alpha = alpha in O, which acts on the N-torsion through the reduction
    lambda : O -> O/n = Z/N, i.e. as the SCALAR [lambda(alpha)]. Hence (alpha) acts
    trivially on M iff lambda(alpha) = +-1, and the action factors through the RAY-CLASS-TYPE
    quotient
        Cl_n(O) := I(O)_{(nf)} / { (alpha) : lambda(alpha) = +-1 },
    sitting in an exact sequence
        1 -> (Z/N)^* / {+-1} -> Cl_n(O) -> Cl(O) -> 1.                                (*)
    #Cl_n(O) = h(O) * (N-1)/2 = #M, and the action is transitive, so M IS A SIMPLY TRANSITIVE
    Cl_n(O)-SET. [open, derivation sketched in `mechanism`, to be verified by the minimal test.]

    (C) WHERE k IS. The two ECDLP marked pairs (E, P) and (E, Q) lie over the SAME point of
    the Cl(O)-quotient (same curve E). So the group element connecting them lies in the
    KERNEL of (*), and under the identification of that kernel with (Z/N)^*/{+-1} it is
    exactly the class of k. Restated with no geometry:
        THE ECDLP IS THE COORDINATE OF A PAIR OF POINTS IN THE FIBRE DIRECTION OF (*),
        AND Phi_ell-INCIDENCE RELATION COLLECTION OPERATES ON THE QUOTIENT DIRECTION.
    That is the answer to channel (1) as posed: the relations solve for the class-group
    action and (with marking) for the extension class of (*); they do not and cannot
    constrain k. It is the same content as decomposition facts T1/T2 (transport preserves
    k) but stated as a group extension rather than as an invariance, which is what makes
    (D) available.

    (D) THE OBSTRUCTION, NAMED, AND IT IS STRUCTURAL RATHER THAN A COST ESTIMATE.
    Index calculus has three stages: (i) a factor base, (ii) RELATIONS obtained by
    DECOMPOSING random objects over the factor base, (iii) linear algebra, then (iv) a
    final DECOMPOSITION OF THE TARGET over the factor base. Stage (iv) is where the target
    enters and it requires a MONOID (or group) structure on the objects being decomposed:
    "write the target as a product of factor-base elements". The Cl(O) direction has that
    structure -- ideals multiply -- and is k-independent. The fibre direction, where k
    lives, is a TORSOR: M has no distinguished point, no multiplication, and therefore no
    notion of "decomposing a marked pair over a factor base of marked pairs". A torsor
    admits no index calculus, not because the cost is high but because stage (iv) is not
    expressible. This is a named obstruction in the sense of docs/inventor-protocol.md
    section 4, and it applies uniformly to every "factor base of curves / of j-invariants /
    of marked pairs" scheme, which is why it is filed as the channel's closure rather than
    as a rejection of one design.

    (E) THE ONE MISSING MAP, STATED SO IT CAN BE HUNTED. What stage (iv) needs is an
    EFFECTIVE COORDINATE MAP c : M -> Cl_n(O) trivialising the torsor, computable in time
    below sqrt(N) from (E', P') alone. Exactly one such map is known to this record, and it
    exists only in a degenerate regime: when the embedding degree is 1 (N | p - 1), the
    reduced Tate self-pairing gives t(P, Q) = t(P, P)^k in mu_N subset F_p^*, which
    trivialises the fibre direction and reduces ECDLP to a DLP in F_p^* -- the classical
    Frey-Ruck/MOV transfer (KN-TECH-032). So the missing map is not a fantasy: it exists,
    it is a self-pairing, and its existence is exactly co-extensive with the known
    degenerate family. FORWARD GUIDANCE: the live question this channel leaves open is
    whether any self-pairing-like map on M exists for k_emb > 1; every "curve factor base"
    variant is closed by (D) and should not be re-proposed without one.

    (F) WHAT IS NOT CLAIMED. No attack, no speedup, no exponent. sota_delta zero. In
    particular the record does NOT claim that computing Cl_n(O) is hard -- the opposite is
    likely, since Cl_n(O) has order h*(N-1)/2 with |disc| ~ p and subexponential class-group
    machinery applies. That is precisely the point of (D): knowing the group does not give
    the coordinate, and conflating the two is the error the record exists to forestall.
  mechanism: |-
    DERIVATION OF (B), the step the minimal test must confirm or destroy.
    1. Cl(O) acts simply transitively on the set of F_p-isomorphism classes of curves with
       End_{F_p} = O (Deuring/Waterhouse; the crater of every ell-volcano is a Cl(O)-torsor)
       [recall-confident, standard, NOT re-verified].
    2. For a in I(O) coprime to N, phi_a : E' -> E'/E'[a] is separable of degree Norm(a)
       coprime to N, hence injective on the N-torsion, so phi_a(P') again has order N. The
       action on M is therefore well defined once the +-1 ambiguity is quotiented.
    3. For a = (alpha) principal, the isogeny is alpha itself, and its restriction to
       E'[n] = G is multiplication by lambda(alpha) where lambda : O -> O/n = Z/N is the
       ring map. This is the SAME fact as H-ENDO-001 (every endomorphism acts on G as a
       scalar) used as an INPUT, not retested: H-ENDO-001 is what makes the fibre direction
       a (Z/N)^*-torsor rather than something larger, and it is what forces (*) to have
       kernel (Z/N)^*/{+-1} exactly.
    4. Counting: #M = h(O) * (N-1)/2 assuming O^* = {+-1} (i.e. D_E not in {-3, -4}) and
       #Cl_n(O) = h(O) * (N-1)/2 by (*). Transitivity plus equal cardinality gives simple
       transitivity.
    WHY THE OBSTRUCTION IN (D) IS NOT A COST ARGUMENT. Every previously recorded closure of
    a curve-side scheme in this campaign is either (i) an invariance statement (T1/T2, "k is
    the same on every curve in the class") or (ii) an arithmetic-access statement
    (IDEA-20260808-5158fa: the Artin symbol at p is trivial because pi = 1 mod n, so no
    Galois-derived invariant separates the fibre). Neither says why a scheme cannot be
    BUILT; they say the answer would be constant, or that one family of tools returns
    nothing. (D) is a third and stronger kind: the algorithmic template itself has a stage
    that requires a structure the object does not possess. That distinction is the record's
    contribution and is what makes it forward-guiding rather than another closed door.
  why_not_a_renamed_known_approach: |-
    Nearest known technique: computing End(E) for ordinary curves by relation collection in
    Cl(O) using modular polynomials (Bisson; Bisson-Sutherland, corpus KN-LIT-309)
    [recall-confident, NOT re-verified]. This record does not propose or improve that
    algorithm; it uses its existence as evidence that channel (1)'s scheme is already built,
    and then asks what it solves for. Nearest in-corpus record: IDEA-20260808-5158fa, which
    reaches the ray class field from the CHARACTERISTIC-ZERO side (CM lift, Artin symbol,
    ray class field K_n over the ring class field) and closes GALOIS access. This record
    stays in characteristic p, never lifts, and closes ALGORITHMIC access by a different
    argument (torsor has no monoid). The two obstructions are independent: 5158fa's would
    still hold if a coordinate map existed, and (D) would still hold if p had a nontrivial
    decomposition group.
  resource_label: >-
    R3 (End(E) as a ring: the ideal action, the kernel ideal n = (N, pi - 1), the ray-class
    quotient) and R4 (the class-group action on curves, and Phi_ell incidences as its
    computable presentation). No step applies an endomorphism to a point of G in order to
    extract a congruence; the scalar action of principal ideals on G is used only as an
    INPUT to compute the kernel of (*), which is the admissibility filter applied, not
    retested.
  admissibility: admissible
  predictions:
  - observable: simple transitivity of the Cl_n(O)-action on marked pairs
    metric: >-
      over a fully enumerated toy ordinary isogeny class, the number of orbits of the
      ideal-group action on M and the ratio #M / (h(O) * (N-1)/2)
    predicted: >-
      exactly 1 orbit and ratio exactly 1.000, for every tested (p, t, N) with O^* = {+-1}.
      A ratio different from 1, or more than one orbit, falsifies (B) and the record is
      superseded rather than amended.
  - observable: the fibre coordinate is exactly k
    metric: >-
      for every marked pair reachable from (E, P), the scalar lambda(alpha) attached to the
      connecting principal ideal, compared against the directly computed discrete logarithm
    predicted: >-
      exact equality up to sign in 100% of instances. This is an identity, not a
      correlation; a single mismatch is an implementation or derivation error and halts.
  - observable: independence of Phi_ell relations from the fibre coordinate
    metric: >-
      the relation lattice obtained from Phi_ell-incidence relation collection on the
      unmarked j-invariants, recomputed for instances differing only in k
    predicted: >-
      bit-identical across all values of k, since no relation references the target pair.
      This is the forced value that makes (C) a derivation rather than an impression; a
      k-dependent relation lattice would be a major positive result and would immediately
      supersede this record.
  - observable: splitting of the extension (*)
    metric: >-
      whether Cl_n(O) is isomorphic to Cl(O) x (Z/N)^*/{+-1} as a group, over the toy
      classes enumerated
    predicted: >-
      not determined by this record and deliberately left open. Both outcomes are
      informative: a split extension would say the two directions are independent as groups
      (strengthening (C)); a non-split one would say the fibre coordinate is entangled with
      the class-group coordinate, which would be the first structural hook this channel has
      produced and would be reported as such WITHOUT any cost claim.
  minimal_test:
    design: |-
      Entirely toy, no attack, single machine, order of one CPU-hour.
      STAGE 0 (zero compute, HARD GATE): finish the derivation of (B) on paper including
        the O^* = {+-1} hypothesis and the coprimality conditions, and write the exact
        cardinality bookkeeping. If #M != #Cl_n(O) the record is wrong before anything runs.
      STAGE 1 (minutes, HARD GATE): choose p of 16-22 bits and an ordinary trace t with
        h(O) between 4 and 40 and a prime N in {5, ..., 61} dividing #E(F_p). Enumerate the
        whole class by ell-isogeny walks for the two smallest split ell; for each curve
        enumerate the (N-1)/2 markings. Verify #M = h * (N-1)/2 by direct count.
      STAGE 2 (minutes): implement the ideal action on marked pairs by Velu transport of the
        point along each ell-step. Verify transitivity (one orbit) and freeness (stabiliser
        trivial) by exhaustive orbit computation.
      STAGE 3 (minutes): for each marked pair over the SAME curve E, compute the connecting
        element and check it equals k up to sign, against a directly computed discrete log.
      STAGE 4 (minutes): run Phi_ell-incidence relation collection on the UNMARKED
        j-invariants for three instances that differ only in k, and diff the relation
        lattices. Forced value: identical.
      STAGE 5 (minutes, optional): compute the group structure of Cl_n(O) and test whether
        (*) splits.
    controls:
    - >-
      NULL OBJECT (matched shape, structure destroyed): replace the marked class M by an
      abstract simply transitive Cl(O) x (Z/N)^*-set with the SAME cardinality, realised by
      random labels, and run Stages 2-4 identically. The orbit/freeness measurements must
      return the same values (they are group-theoretic), and Stage 4 must also return
      k-independence. If the null differs from the real object anywhere, the instrument is
      measuring implementation artifacts rather than the claimed structure.
    - >-
      PLANTED SIGNAL (two-directional control, mandatory per RQ-INSTR-f8faa0): run one
      instance with N | p - 1 (embedding degree 1), where the Tate self-pairing DOES
      trivialise the fibre. The pipeline must detect a computable coordinate map there and
      must NOT detect one on the matched k_emb > 1 instances. A pipeline that reports "no
      coordinate map" in both cases has not used the structure and its negative is void.
    - >-
      INSTRUMENT NULL: k = 1, so (E, P) = (E, Q) and the connecting element must be the
      identity. Any non-identity output halts the run and nothing is reported.
    - >-
      AUTOMORPHISM CONTROL: one class with D_E in {-3, -4}, where O^* is larger than {+-1}
      and the cardinality bookkeeping in (B) changes. The predicted counts must change
      accordingly; if they do not, the derivation did not use O^* and is not established.
    required_metrics:
    - '#M, h(O), (N-1)/2, and the ratio #M / (h * (N-1)/2), per instance'
    - number of orbits and stabiliser order of the ideal action on M
    - exact-match rate of the fibre coordinate against the directly computed k
    - byte-level diff of the Phi_ell relation lattice across instances differing only in k
    - group structure of Cl_n(O) and whether (*) splits, per instance
  controls:
  - >-
    See minimal_test.controls. The load-bearing one is the PLANTED-SIGNAL arm at embedding
    degree 1: it is the only setting in which the object this record says is missing
    actually exists, so it is the only way to show the measurement could have found one.
  confounders:
  - >-
    Small N makes (N-1)/2 tiny, so transitivity and freeness are easy to satisfy by
    accident. At least one instance with N >= 41 is required, and the counts must be
    reported per instance rather than pooled.
  - >-
    Velu transport at each ell-step introduces a sign ambiguity in phi_a(P). The +-1 quotient
    must be applied consistently or Stage 3's exact-match check fails for a bookkeeping
    reason and is misread as a falsification of (B).
  - >-
    Curves with j = 0 or j = 1728 have O^* larger than {+-1}; the marked-set cardinality and
    the kernel of (*) both change. These are the automorphism control, not a nuisance to
    exclude silently.
  - >-
    "Cl_n(O) is computable subexponentially" is a statement about the GROUP. Reading it as a
    statement about the TORSOR COORDINATE is the exact error (D) exists to name, and any
    write-up of this record must keep the two apart in every sentence.
  falsification_conditions:
  - >-
    #M != h(O) * (N-1)/2, or the action has more than one orbit, or a nontrivial stabiliser
    appears where O^* = {+-1}. The derivation in (B) is wrong; the record is superseded.
  - >-
    The fibre coordinate fails to equal k up to sign on any single instance. (C) is wrong and
    everything downstream is void.
  - >-
    The Phi_ell relation lattice differs between two instances differing only in k. (C) is
    refuted, the channel is NOT closed, and this becomes the campaign's most important open
    lead -- to be handed to the Coordinator under pause condition P3 rather than developed
    here.
  - >-
    A coordinate map c : M -> Cl_n(O) computable below sqrt(N) time is exhibited for any
    instance with k_emb > 1. (D) survives as a statement about index calculus but (E)'s
    forward guidance is answered and the closure must be reopened.
  interpretation_limits:
  - >-
    Toy scale only, p <= 22 bits, and the conclusions are scoped to ordinary curves with
    N || #E(F_p), gcd(N, f_E) = 1, and O^* = {+-1} except in the stated control.
  - >-
    (D) is a statement about the INDEX-CALCULUS TEMPLATE (factor base, decompose, linear
    algebra, decompose the target). It is not a statement that no algorithm can use the
    marked class, and the write-up must not slide into that reading. Non-index-calculus uses
    of M -- for instance a coordinate map of the kind (E) hunts -- are untouched.
  - >-
    Nothing here bears on H-STR-002 or on phi-stable factor bases: the factor base discussed
    is a set of CURVES or MARKED PAIRS, never a set of points on one curve. Not P2-adjacent.
  assumptions:
  - E/F_p ordinary, p > 3, End_{F_p}(E) = O of conductor f_E, N prime with N || #E(F_p), gcd(N, f * N) conditions as stated.
  - >-
    'Cl(O) acts simply transitively on the set of F_p-curves with End_{F_p} = O
    [recall-confident: Deuring/Waterhouse and the volcano-crater description of Kohel and
    Sutherland; NOT re-verified this session].'
  - >-
    'Subexponential relation collection in Cl(O) via modular polynomials computes End(E) for
    ordinary curves [recall-confident: Bisson; Bisson-Sutherland; corpus KN-LIT-309; NOT
    re-verified this session]. Used only to establish that channel (1)''s scheme already
    exists, never as a cost input to any claim here.'
  - >-
    'The reduced Tate pairing satisfies t(P, [k]P) = t(P, P)^k and is non-degenerate on
    E(F_p)[N] when N | p - 1 [recall-confident: standard, KN-TECH-032; NOT re-verified].'
  - H-ENDO-001 is used as an input (principal ideals act on G as scalars) and is not retested.
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >-
      Stage (iv) of index calculus -- decomposition of the TARGET over the factor base --
      applied to an object with no monoid structure. Removing that bottleneck means
      exhibiting an effective coordinate map c : M -> Cl_n(O); nothing else in the template
      is blocked.
    baseline_embedding:
      parameter_slice: >-
        The embedding-degree-1 slice N | p - 1. There the coordinate map exists (Tate
        self-pairing) and the whole scheme degenerates to the classical Frey-Ruck/MOV
        transfer, whose cost is the F_p^* index calculus L_p(1/3). The framework must
        reproduce that exactly at that slice.
      reproduction_check: >-
        Symbolic: verify t(P, Q) = t(P, P)^k and that solving for k is a DLP in mu_N; then
        computationally on one toy k_emb = 1 instance, recover k through the pairing and
        check it against the directly computed discrete log. Exact match required.
    observation_collision:
      observable: >-
        The Phi_ell-incidence relation lattice of the unmarked j-invariant factor base.
      distinct_preimage_search: >-
        The collision is total and is the theorem: the (N-1)/2 instances (E, P, [k]P) for
        distinct k all produce the identical relation lattice. Stage 4 measures exactly this
        collision, and its size (N-1)/2 is the number of bits the unmarked factor base
        discards. The search for a SMALLER collision class is Stage 5 plus (E).
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        ECDLP presented as the kernel coordinate of the extension
        1 -> (Z/N)^*/{+-1} -> Cl_n(O) -> Cl(O) -> 1, with encoding, completeness,
        soundness, transfer and cost-loss obligations kept separate.
      predicted_gain: >-
        Zero, and stated as zero in advance. The reduction is faithful but not effective:
        it moves the problem to a group whose ORDER is known and whose DL is subexponential,
        while leaving the instance-to-group-element map missing. Naming which of the five
        obligations fails (transfer) is the deliverable.
    - transform: observable_fiber
      proposed_object: >-
        Hold the Cl(O)-coordinate fixed (same curve E), vary the marking, and look for an
        intrinsic invariant separating the resulting marked pairs.
      predicted_gain: >-
        None for k_emb > 1; exactly one for k_emb = 1 (the Tate self-pairing). The pair of
        outcomes is what shows the search is calibrated rather than assumed.
    quantifier_order: >-
      FORALL ordinary E/F_p with End = O and O^* = {+-1}, FORALL primes N || #E(F_p) with
      gcd(N, f) = 1, FORALL finite factor bases B of j-invariants in the class, FORALL
      relations R obtainable as Phi_ell-incidence words over B: R is independent of k.
      The order matters. Swapping to EXISTS B FORALL R would be a weaker and uninteresting
      claim; swapping to FORALL B EXISTS R depending on k would be the falsifier, and Stage 4
      is built to detect exactly that swap.
    method_ceiling:
      strongest_certifiable_claim: >-
        "No index-calculus scheme whose decomposable objects are unmarked curves, or marked
        pairs under the torsor structure of M, can produce a relation constraining k." It can
        NEVER certify that the marked class is useless, nor that no coordinate map exists.
      nearby_object_control: >-
        The k_emb = 1 family, where the desired conclusion (no coordinate map) is FALSE. The
        argument must be seen to fail there. An argument that returns "closed" uniformly,
        including at k_emb = 1, has not used the non-degeneracy hypothesis and is asserting
        its conclusion.
    proof_obligations:
    - claim: M is a simply transitive Cl_n(O)-set.
      responsibility: correctness
    - claim: The kernel of (*) is (Z/N)^*/{+-1} and the connecting element of the ECDLP pair lies in it.
      responsibility: correctness
    - claim: Phi_ell-incidence relations are words in I(O) and are k-independent.
      responsibility: correctness
    - claim: Index calculus stage (iv) requires a monoid structure on the decomposed objects.
      responsibility: interface
    - claim: At k_emb = 1 the framework reproduces Frey-Ruck/MOV exactly.
      responsibility: baseline
    - claim: All conclusions are scoped to the index-calculus template and to the stated hypotheses.
      responsibility: scope
    not_applicable_reason: null
  target_complexity:
    time_exponent: >-
      NO ATTACK IS PROPOSED AND NO EXPONENT MOVES. The record's own computations are toy.
      For completeness of the accounting: the group Cl_n(O) has order h(O)*(N-1)/2 with
      |disc| ~ p, so its structure and internal discrete logs are subexponential in |disc|
      by standard class-group machinery [recall-confident, NOT re-verified]; this record
      makes NO claim that this bears on ECDLP cost, and (D) is precisely the statement of
      why it does not.
    memory_exponent: >-
      Toy: the whole marked class M has h*(N-1)/2 elements, which at 22 bits is megabytes.
      At cryptographic size #M ~ p^{1/2} * N ~ p^{3/2}, which is why no computation in this
      record scales and why the derivations, not the runs, must carry.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group operations and
      O(1) memory (KN-TECH-001, KN-TECH-006); the automorphism-discounted variant
      (KN-TECH-018); BSGS at sqrt(N) time and memory (KN-TECH-031). None is moved.
    hidden_overhead: >-
      None hidden, because nothing is claimed. The honest overhead of the OBJECT is that M
      cannot be represented at cryptographic size, so every statement about it is a
      derivation.
    tradeoff_note: >-
      Not applicable; no algorithm is produced. The known frontier's tradeoff position is
      unchanged.
  sota_delta: >-
    Zero speedup and zero data/query advantage on every axis. Deliverable delta, as counts:
    1 group extension written down that the decomposition does not name, 1 obstruction of a
    kind (template-structural) not previously used in this campaign, 1 forced value (the
    k-independence of the relation lattice) with a matched null and a planted-signal control,
    1 named missing map with its unique known instance identified, and 1 explicit scope
    statement of what the closure does not cover. Stated as counts because "a better way to
    see it" is not a value.
  dominated_by: >-
    AS AN ATTACK: mounts none, therefore dominated on every Pareto axis by every row of the
    prime-field frontier. Rows checked before writing this field: (1) parallel Pollard rho,
    0.886*sqrt(N) group ops, O(1) memory, 0 queries (KN-TECH-001, KN-TECH-006); (2)
    automorphism-discounted rho, 0.886*sqrt(N/r) with r <= 6 (KN-TECH-018); (3) BSGS,
    sqrt(N) time and sqrt(N) memory (KN-TECH-031); (4) Pohlig-Hellman -- inapplicable, N
    prime; (5) MOV/Frey-Ruck at small embedding degree, L_p(1/3) (KN-TECH-032) -- applies
    only to the degenerate family and is named here as the baseline slice; (6) the anomalous
    transfer, polynomial time (KN-TECH-033); (7) index calculus over F_p elliptic curves --
    no subexponential row exists. Time, memory and data/queries all checked; nothing here
    touches any of the three. AS A CLOSURE: dominated by nothing in the corpus for the
    torsor-monoid obstruction, which no record states; it is COMPLEMENTARY to, and weaker in
    reach than, IDEA-20260808-5158fa's Artin-symbol closure, which covers a different tool
    family.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
