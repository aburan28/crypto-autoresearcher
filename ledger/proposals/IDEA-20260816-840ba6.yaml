idea:
  id: IDEA-20260816-840ba6
  question_id: RQ-SHATWO-f196c7
  added: '2026-08-16'
  title: Treat the linearized SHA-256 message expansion as a code and measure the minimum-weight profile
    of its kernel per step count, reporting only upper bounds obtained by a declared bounded search,
    because a weight is a different object from a rank and the two need not move together
  class: theory
  claim: '(A) The carry-fixed expanded schedule defines a GF(2) linear map from the 512-bit message
    block to the 32s-bit expanded prefix. Its image is a linear code of length 32s and dimension at
    most 512, and every nonzero codeword is the expanded form of a nonzero message difference. The
    weight of a codeword is the total number of bit positions differing across the first s expanded
    words. The object here is the minimum-weight profile W(s): the least Hamming weight of a nonzero
    codeword of the length-32s code, as a function of s. (B) This is a different object from the rank
    profile studied elsewhere in this bucket, and they are independent in the strong sense that a
    fixed rank sequence admits codes with wildly different weight profiles. Rank counts how much freedom
    a set of conditions consumes; weight counts how cheap the cheapest nonzero difference is. A frontier
    story built on rank alone is silent about weight, and the honest reason to compute both is that
    nobody here knows which, if either, tracks anything. (C) NOT CLAIMED, and this is the sharpest
    limit in this record: that any number this contract produces is a minimum. Minimum-weight computation
    is not tractable in general and this contract runs a declared bounded search - randomized information
    sets plus exhaustive enumeration at toy widths only - which produces UPPER BOUNDS and nothing
    else. An upper bound is reported as an upper bound in every field of every record, and the sentence
    ''the minimum weight at step s is k'' is forbidden output unless exhaustive enumeration at that
    configuration completed and is recorded as complete. Also not claimed: that a low weight is exploitable;
    that weight predicts any reachable step count; anything about full 64-step SHA-256, HMAC-SHA-256,
    or any deployed system. A weight profile is a description of a linear code, not an attack on a
    hash.'
  mechanism: 'STAGE A. Build the carry-fixed expansion matrix by the same linearizer used for the
    rank ledger, so the two objects come from one validated construction. STAGE B. For each s, form
    the length-32s code generated by the 512 rows and run the declared bounded search for low-weight
    codewords: repeatedly select a random information set, bring the generator to systematic form
    over it, and read the weights of the resulting rows and of small combinations of them, keeping
    the smallest weight found. Record the number of iterations, which is the budget, and report the
    result strictly as an upper bound with its budget attached. STAGE C. At reduced word widths where
    the message space is enumerable, compute the true minimum by exhaustive enumeration and record
    it as EXACT, giving a calibration point that says how far the bounded search''s upper bound sits
    above truth at those widths. STAGE D. Emit W_upper(s) with budget, and W_exact(s) where available,
    never mixing the two in one column. STAGE E. Run the identical bounded search against random codes
    of the same length and dimension, giving the null band. STAGE F. Refutation route: if SHA-256''s
    upper-bound profile sits inside the random-code band at every s, the expansion''s weight structure
    is generic at the resolution this budget achieves, and that is recorded with the budget attached
    rather than as a statement about the code.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-SHATWO-f196c7 in full, which names the message-schedule expansion as an object
      in its own right independent of any characteristic search. Read docs/inventor-protocol.md sections
      2 and 4. Ran grep -rl 'RQ-SHATWO' over ledger/ experiments/ knowledge/ coordination/; grep -ril
      'linear code|generator matrix' over ledger/proposals/ ledger/hypotheses/ knowledge/techniques/
      knowledge/findings/; grep -ril 'Hamming weight' over the same; grep -ril 'message schedule|message-schedule'
      over ledger/proposals/ ledger/hypotheses/ knowledge/.
    results: '''linear code|generator matrix'' matched several proposals including IDEA-20260813-fe3c5e,
      IDEA-20260808-0b3072, IDEA-20260808-83b3ba, IDEA-20260808-a3bcf0, IDEA-20260811-531f0b and IDEA-20260805-f58517
      - grep-level hits whose bodies I did not read, none of which references RQ-SHATWO since that
      grep returns only the question, GOAL-SHA2-001 and RQ-SHATHREE-cd2cb2; several of these filenames
      sit in code-based-cryptography and ECDLP lanes by their question bindings elsewhere in the corpus,
      which I did not verify record by record. ''Hamming weight'' matched five or more proposals including
      IDEA-20260805-db5afa, IDEA-20260807-4e8da3, IDEA-20260813-5a2aaa, IDEA-20260731-019 and IDEA-20260808-b8e2d4,
      again grep-level only. ''message schedule'' matched only the two signature-lane proposals whose
      titles I read. No record in this repository computes a weight profile of any hash message schedule,
      and RQ-SHATWO carries no proposals.'
    verdict: 'UNVERIFIED. No external literature is readable here and this record asserts nothing
      about it, including whether linearized hash message schedules have been studied as codes elsewhere;
      that is exactly the kind of assertion this program forbids. Claimed new: nothing mathematical.
      Viewing a linearized expansion as a code and running information-set-style low-weight search
      are both standard, and this record says so plainly. The contribution claimed is discipline and
      pairing: reporting upper bounds as upper bounds with their budgets attached rather than as minima,
      calibrating the bounded search against exhaustive truth at toy widths so the gap is measured
      rather than assumed, and running the whole thing against random codes of matched length and
      dimension in the same invocation. Within this repository the verifiable fact is that no record
      computes a weight profile for any hash schedule and RQ-SHATWO carries no proposals.'
  object_first_candidate:
    tracked_object: 'The minimum-weight profile of the code generated by the carry-fixed expanded
      schedule truncated to s steps: W(s), the least Hamming weight of a nonzero codeword of length
      32s, followed as s grows, and reported as an upper bound W_upper(s) with the search budget attached,
      or as W_exact(s) where exhaustive enumeration completed.'
    lossiness: 'Lossy, and in a way strictly different from the rank object. Discarded: which codeword
      achieves the weight, the entire weight distribution above the minimum, the positions of the
      nonzero bits, the carry identity, the compression function, and every word value. Retained:
      one integer per step count. Codes with radically different structure share a minimum weight,
      so this is a projection rather than a re-coordinatization, and the projection is coarse enough
      that the record reports the achieving codeword alongside the number precisely because the number
      alone is so lossy. Why the remainder propagates: the truncated code at s+1 contains the truncated
      code at s as a puncturing, so W is non-decreasing in s by construction and the sequence is well-defined
      without reference to anything discarded.'
    propagation: One step of the target operation extends the code by 32 coordinates, appending the
      bits of the next expanded word. Puncturing back to s recovers the previous code exactly, so
      W(s+1) >= W(s) and the sequence is a monotone staircase whose increments record how many additional
      differing bits the next expansion step forces on the cheapest surviving difference. The increment
      at step s is therefore an exact statement about how much the recurrence at that step costs a
      difference that was already cheap, and it is that increment sequence, not the absolute weights,
      that the null comparison reads.
    survival_score: 'The object is exactly defined for every s, but its MEASURED value survives only
      as far as the search budget reaches: an upper bound is a statement about a budget, and the gap
      between bound and truth is unknown except at the toy widths where exhaustive enumeration completes.
      That calibration is the honest boundary and the contract reports it as a measured gap at those
      widths and as an unmeasured gap at w = 32. The object dissolves entirely at the union over carry
      classes, as with the rank object, and at the compression function, which it never touches.'
  null_object_control: 'Random codes of matched length 32s and matched dimension, generated by uniformly
    random GF(2) generator matrices, run through the IDENTICAL bounded search with the IDENTICAL budget
    in the same invocation, 500 draws per s. For the signal arm to mean anything, SHA-256''s upper-bound
    profile must fall below the random-code band, since a code whose cheapest differences are no cheaper
    than a random code''s has no weight structure detectable at this budget. A second control is the
    budget-sensitivity check demanded by inventor-protocol section 3: run the bounded search at three
    budgets differing by factors of ten and confirm that the upper bound DECREASES with budget as
    it must; a bound flat in budget means the search is not searching, and is the artifact signature
    rather than evidence of a true minimum.'
  discriminated_from:
  - The rank-ledger entry in this bucket, which measures the row space of the same matrix; weight
    and rank are independent invariants and a fixed rank sequence admits many weight profiles, so
    these are two different objects on one construction rather than two views of one object.
  - RQ-SHATWO-f196c7's target 5, which names the message-schedule expansion as an object in its own
    right but specifies no invariant; this supplies one and confines itself to upper bounds.
  - 'The several ''linear code|generator matrix'' grep hits in ledger/proposals including IDEA-20260813-fe3c5e
    and IDEA-20260808-0b3072: matched at grep level only, in lanes that do not reference RQ-SHATWO,
    and I did not read their bodies; none concerns a hash message schedule.'
  - Differential characteristic search, which finds a difference satisfying probabilistic conditions
    through the nonlinear compression; this computes a purely linear invariant of the schedule alone,
    with no probability, no compression function and no solver.
  - Ordinary minimum-distance computation on a designed code, which typically has structure making
    the minimum tractable; here no structure is assumed, the search is explicitly budgeted, and the
    output is labelled an upper bound in every field.
  assumptions:
  - The carry-fixed expansion matrix is correct, inherited from the rank pipeline's forced-value gate
    rank(A_16) = 512 rather than re-argued here.
  - Randomized information-set search produces valid upper bounds on the minimum weight, which is
    true by construction since every candidate it evaluates is a genuine codeword.
  - Exhaustive enumeration at reduced widths yields the exact minimum for those configurations, which
    is true by construction and bounded by the enumerated space size declared in advance.
  - Random GF(2) generator matrices of matched length and dimension are a fair null for a code whose
    only claimed structure is the recurrence; this is the standard choice and is stated as a convention
    rather than justified.
  predictions:
  - metric: monotonicity of W_upper(s) in s
    direction: higher
    minimum_effect: 'forced: non-decreasing in s, since the code at s is a puncturing of the code
      at s+1; any decrease is an implementation error and voids the run'
  - metric: W_upper(s) at fixed budget as the budget is raised by factors of ten
    direction: lower
    minimum_effect: must strictly decrease for at least one s across the three budgets; a bound flat
      in budget is the section 3 artifact signature meaning the search is not searching
  - metric: SHA-256 W_upper(s) versus the 500-draw random-code band at matched length and dimension
    direction: lower
    minimum_effect: explicit refusal to pre-commit a magnitude, because the point of the null is that
      a within-band result is an equally reportable and arguably more useful outcome; what is pre-committed
      is that a within-band result is recorded as a generic-weight finding with its budget rather
      than suppressed
  - metric: gap between W_upper and W_exact at the toy widths where exhaustive enumeration completes
    direction: different
    minimum_effect: reported as a measured integer per configuration with no predicted value, since
      it is the calibration this contract exists to supply and predicting it would be fabricating
      it
  minimal_test:
    design: 'Cheapest discriminating version: run only the toy width where exhaustive enumeration
      is affordable - w = 8 with a 128-bit message space is not enumerable, so restrict to codes generated
      by a declared 20-bit subspace of message differences, which is 2^20 enumerations per s and completes
      in minutes - and compute both W_exact(s) and W_upper(s) at three budgets on that same configuration.
      This single pass delivers the two things that matter and neither requires a solver: the calibration
      gap between bounded search and truth, which is the number that licenses every later upper bound,
      and the budget-sensitivity check that catches a search which is not searching. Add 100 random-code
      draws at matched length and dimension for the null band. If the bound is flat in budget, or
      if the gap to truth is large and erratic, the whole bounded-search approach is uninformative
      at w = 32 and the contract should not be extended there, which is a decision reached for a few
      minutes of CPU.'
    controls:
    - Random-code null band at matched length and dimension, 500 draws per s, identical search and
      identical budget, same invocation.
    - Budget-sensitivity control at three budgets differing by factors of ten, requiring the upper
      bound to decrease.
    - Exhaustive-enumeration calibration at declared reduced configurations, giving W_exact and the
      measured gap to W_upper.
    - 'Monotonicity control: W_upper(s) must be non-decreasing in s, checked at every s.'
    - 'Achieving-codeword control: every reported bound is accompanied by the codeword achieving it,
      re-verified as a genuine codeword by independent recomputation from the message difference.'
    required_metrics:
    - W_upper(s) with its search budget, per s and per carry class
    - W_exact(s) where exhaustive enumeration completed, flagged EXACT
    - measured gap W_upper minus W_exact at calibration configurations
    - random-code null band percentiles per s
    - upper bound at each of three budgets, per s
    - the achieving codeword and its independently recomputed weight, per reported bound
  falsification_conditions:
  - W_upper(s) decreases at some s, showing the puncturing relation is violated and the construction
    is wrong.
  - The upper bound is flat across three budgets differing by factors of ten, showing the search is
    not searching and no bound is informative.
  - An achieving codeword fails independent recomputation as a genuine codeword.
  - SHA-256's profile sits inside the random-code band at every s, showing the expansion's weight
    structure is generic at this budget - a reportable outcome, recorded with the budget rather than
    suppressed.
  - The measured gap between W_upper and W_exact at calibration configurations is large and erratic,
    showing bounded search is uninformative for this code family.
  - The inherited rank pipeline has not passed its rank(A_16) = 512 gate, in which case the matrix
    is unvalidated and no weight is meaningful.
  confounders:
  - Information-set search quality depends strongly on implementation details, so a high bound may
    reflect a weak search rather than a high minimum; the budget-sensitivity control is the only defence
    and it bounds this only partially.
  - Random codes of matched dimension may be a poor null for a code with a sparse generator, biasing
    the comparison; the generator sparsity is reported alongside so a reader can see the mismatch.
  - Carry-class choice affects the matrix and hence the code; one class is fixed across the sweep
    and the spread across sampled classes is reported.
  - Restricting enumeration to a declared subspace at calibration widths means W_exact is exact for
    that subspace, not for the full message space, and the record must label it as such rather than
    as the code's minimum.
  - Puncturing monotonicity holds for the code but not necessarily for a bounded search's output,
    so a decreasing bound could be a search artifact rather than a construction error; both readings
    are reported and the achieving codewords distinguish them.
  interpretation_limits:
  - Every reported number that is not flagged EXACT is an upper bound with a budget, and the sentence
    'the minimum weight is k' is forbidden output for such numbers.
  - A low weight is not an attack, an exploit, or a characteristic; the compression function is absent
    from this object entirely.
  - Weight and rank are independent invariants, so nothing here confirms or refutes anything the rank
    ledger reports.
  - All results are within a carry class or a sampled distribution over classes.
  - Nothing here is a statement about full 64-step SHA-256, HMAC-SHA-256, or any deployed system.
  target_complexity:
    time_exponent: No attack exponent is claimed. The bounded search's cost is exactly the declared
      iteration budget times one systematic-form reduction of a 512 x 32s bit-packed matrix, and it
      is reported per configuration rather than bounded asymptotically, because an upper bound whose
      cost is not stated is not a measurement.
    memory_exponent: No attack memory exponent is claimed. The largest matrix is 512 x 2048 bits,
      about 128 KiB; exhaustive calibration holds no table beyond the enumerated subspace counter.
    best_known: 'No incumbent attack. The incumbent this improves on is the absence of any weight
      invariant for this object in this program: no record computes a weight profile for any hash
      message schedule, RQ-SHATWO carries no proposals, and its target 5 names the expansion as an
      object in its own right without supplying an invariant.'
    hidden_overhead: 'The hidden cost is entirely in the honesty overhead of upper bounds. Every downstream
      reader will want to quote W_upper as a minimum, and preventing that requires the flag to travel
      with the number through every record, plot and summary - which is a human discipline cost paid
      repeatedly, not a compute cost paid once. A second hidden cost: the calibration at toy widths
      is exact only for a declared subspace, so even the EXACT column carries a scope qualifier that
      is easy to drop.'
  dominated_by: 'n/a (no result claimed). Pareto check across time, memory and data/queries: I checked
    every frontier row present in this repository and found none for this object - no experiment directory,
    evidence record, proposal or hypothesis computes a weight profile of a hash message schedule,
    and RQ-SHATWO carries no proposals - so there is no prior row to dominate this one. On the general
    problem of minimum-weight computation this repository holds no frontier table either, and it cannot
    adjudicate against external work in any direction.'
  sota_delta: 'no attack; conceptual/measurement contribution only. The delta is from zero weight
    information to a budgeted upper-bound profile with a measured calibration gap: currently this
    program holds no W value for any s, and a run would hold W_upper(s) at three budgets for every
    s with achieving codewords, W_exact at declared calibration configurations, and a 500-draw random-code
    band per s.'
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'By part. (1) That valid upper bounds and a working calibration can be
    produced: ~0.9, since every candidate the search evaluates is a genuine codeword by construction
    and exhaustive enumeration on a declared subspace is elementary. (2) That the bound decreases
    with budget as the section 3 control requires: ~0.85; a flat bound would indicate a badly implemented
    search and is more likely a bug than a finding. (3) That SHA-256''s profile falls below the random-code
    band at some s: ~0.4, and I hold this near even because a sparse structured generator plausibly
    yields cheap codewords, while tall random-like codes at these lengths often have similar minima
    at any achievable search budget. (4) That a weight profile relates to any reachable step count:
    ~0.12, held very low and untested here, for the same structural reason that governs the rank object
    - the observation-collision audit in this bucket shows an invertible message-basis change altering
    the primitive while leaving linear invariants of this kind untouched, so identifiability is in
    doubt before any measurement runs.'
