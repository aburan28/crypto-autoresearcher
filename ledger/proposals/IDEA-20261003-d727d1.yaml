# IDEA-20261003-d727d1
# j=1728 point-count ratio. Proposal only. Not approved.
idea:
  id: IDEA-20261003-d727d1
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    Point-count ratio of j=1728 against a non-CM curve, pre-registered in [1/2, 2]
  class: measurement
  claim: >-
    At one frozen prime, the ratio of the rational-point count of a
    j=1728 curve to the rational-point count of a non-CM curve at the
    same prime lies in the closed interval from 1/2 to 2. The
    automorphism order 4 has square root 2, and 2 times 2 is 4. A ratio
    outside [1/2, 2] is the surprising branch. A ratio inside the
    interval is not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. R2 is the curve equation. The label j=1728 marks
    automorphism group order 4, distinct from the j=0 case of order 6.
    The operation set is enumeration of rational points. This proposal
    measures the point-count ratio only.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        Special j, including 1728, must be compared with the
        automorphism-discounted baseline.
      verified_by: coordinator session 2026-10-03, question file read
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        The generic floor remains the exponent constraint.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - Both curves are written before the count.
    - The prime is toy and public.
  proof_search_map:
    bottleneck: The point-count ratio against the band [1/2, 2].
    baseline_embedding:
      parameter_slice: One prime, one j=1728 equation, one non-CM equation.
      reproduction_check: >-
        Two counters enumerate both curves and must agree on the ratio.
    observation_collision:
      observable: The ratio of the two point counts.
      distinct_preimage_search: >-
        A ratio outside [1/2, 2] is not the order-4 automorphism calibration.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The pair of frozen curves.
        predicted_gain: One ratio. No exponent.
    quantifier_order: >-
      The prime and both equations are fixed before enumeration.
    method_ceiling:
      strongest_certifiable_claim: >-
        The ratio at that prime. Not a statement for every prime.
      nearby_object_control: >-
        The same curve counted twice. The ratio must be 1.
    proof_obligations:
      - claim: Both point counts are complete.
        responsibility: correctness
      - claim: The ratio is inside or outside [1/2, 2].
        responsibility: size
      - claim: An inside ratio is not an attack.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: point_count_ratio
      direction: different
      minimum_effect: The ratio lies in [1/2, 2], or the run reports the outside branch.
  minimal_test:
    design: >-
      Freeze the prime and both equations. Enumerate rational points.
      Divide the counts.
    controls:
      - The same curve counted twice.
      - An independent enumeration.
    required_metrics:
      - both point counts
      - the ratio
  falsification_conditions:
    - The double count of one curve has ratio other than 1.
    - A counted point fails its equation.
  confounders:
    - The point at infinity is included in one count and omitted in the other.
  interpretation_limits:
    - One prime is not a theorem about j=1728.
    - A ratio inside [1/2, 2] does not prove the automorphism discount.
    - No transfer to a cryptographic prime.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The automorphism discount for group order 4 is 2, because 2
        squared is 4.
      rigorous_support: >-
        2 times 2 is 4. No CM theorem is claimed by this proposal.
      validation_plan: >-
        Compute the ratio. Compare it with the pre-registered interval.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: O(p) for a toy enumeration.
    best_known: >-
      Automorphism-discounted rho. A constant at or below 2 is baseline
      calibration for j=1728.
    hidden_overhead: Inclusion or exclusion of the point at infinity.
    tradeoff_note: Enumeration is the measurement, not an attack.
  estimated_cost:
