  assumptions:
    - >-
      HQC's public code is [2n, n] quasi-cyclic of rate 1/2 with n prime, and
      the total error weight is 2w with w = Theta(sqrt(n)) (sublinear).
    - >-
      The attacker holds one public key (h, s), i.e. one fixed noisy codeword,
      and no decryption oracle. A decryption-oracle setting is a different
      claim class and is out of scope for this RQ.
    - >-
      Parity-check supply cost is modelled by coherent generation with
      post-selection (amplitude sqrt(p) rather than 1/p), which is the most
      favourable honest model for the attacker.

  object_first_framing:
    established_families_declared_off_limits_as_primary_lens:
      - Grover-Prange and quantum-walk BJMM/MMT (the permutation side) -- they
        appear here only as the right-hand side of the inequality.
      - The five prior objects of TASK-20260813-9f7a4a.
      - Circuit-level qubit-count refinements of quantum ISD.
    tracked_object: >-
      THE PARITY-CHECK BIAS eps TOGETHER WITH THE SECRET-WINDOW SIZE s -- the
      two-number summary (eps, s) of a dual attack, propagated through the
      supply / bias / window cost composition.
    lossy_projection_test: >-
      PASSES. The projection sends a full dual attack configuration (a set of
      up to 2^{100+} parity-check vectors, each an element of F_2^{35338}) to
      the pair (eps, s) of a real number and an integer. The fibres are
      astronomically large: any two parity-check families with the same weight
      profile on the noise window map to the same eps. COMPATIBILITY, the half
      of the test that has teeth: eps is multiplicative under the one operation
      the attack performs on parity checks -- XOR-combining two independent
      checks multiplies their biases (the piling-up lemma) -- and s is additive
      under window merging, so the retained pair propagates deterministically
      through the attack's own operations while discarding the vectors
      themselves. A FAILING VARIANT recorded to show the test bites: tracking
      "the parity-check matrix in systematic form" loses nothing (it is a basis
      change of the dual code) and would be a change of coordinates, not an
      object.
    survival: >-
      The pair (eps, s) survives the entire dual pipeline -- supply, sample
      collection, LPN solving -- which is unusually far, and is why the family
      admits a single closed-form bound at all. It dissolves only if the LPN
      step is replaced by something whose cost is not a function of (eps, s),
      e.g. a solver exploiting the QUASI-CYCLIC structure of the parity checks
      themselves. That is named in open directions as the surviving escape.

  proof_search_map:
    bottleneck: >-
      The secret-window size s. Bias and supply are tradeable against each
      other; s is bounded below by the requirement w_P = 2w s/N >= 1, which is
      a property of the sublinear regime and is not tradeable.
    baseline_embedding:
      parameter_slice: >-
        Linear weight (w = Theta(n)) and rate R < 0.3. In that slice the bound
        must reproduce the published RLPN conclusion that dual methods BEAT
        ISD, because w_P >= 1 is satisfied by a vanishing s and the window
        constraint stops binding. A bound that closes the dual family at low
        rate and linear weight is wrong and must be discarded.
      reproduction_check: >-
        Numerically evaluate this record's cost expression at R = 0.2 and
        w/n = 0.05 and check it reproduces an advantage over ISD of the
        published order; and at R = 0.5, linear weight, check it reproduces a
        disadvantage. Frozen as a fixture with the published rate window
        (0, 0.3) as the acceptance criterion. THIS CHECK IS THE RECORD'S MAIN
        GUARD AGAINST A BOUND THAT PROVES TOO MUCH, and it must be run against
        KN-LIT-fb3102 / KN-LIT-b66899 as read sources, not against a recalled
        summary of them.
    observation_collision:
      observable: 'the pair (eps, s), and through it the total cost exponent'
      distinct_preimage_search: >-
        A collision is expected and is informative rather than fatal: two very
        different parity-check families (say weight-u-on-nu checks obtained by
        information-set randomization, versus checks obtained from the
        quasi-cyclic shift orbit of a single found check) can share (eps, s)
        while having completely different SUPPLY costs and different
        independence properties. The QC-shift family is the dangerous
        preimage, because its members are NOT independent -- the piling-up
        lemma and the eps^{-2} sample count both assume independence, and
        n shifts of one check are maximally correlated. The experiment must
        therefore measure the EFFECTIVE sample count of a QC-shift family
        empirically at toy scale rather than assuming n free samples. This is
        the same correlated-branch trap the prior wave's audit found in
        IDEA-20260813-a46301, arriving here in different notation, and it is
        named for that reason.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A resource measure charging every dual attack the three disjoint
          costs (supply, bias, window), with the window charge proved disjoint
          from the other two because it is incurred after all samples exist.
        predicted_gain: >-
          A single closed-form lower bound 2^{max(s/2, ...)} >= 2^{n/(4w)} for
          the whole family, hence a crossover condition w = sqrt(n/2).
      - transform: representation_reduction
        proposed_object: >-
          Re-express "attacker can run quantum dual sampling" as the exact
          condition "attacker can prepare sum_e sqrt(D(e)) |c + e>", turning a
          vague applicability question into a state-preparation feasibility
          question.
        predicted_gain: >-
          Converts the strongest external ingredient from an unquantified
          threat into a yes/no algebraic check that costs no compute.
    quantifier_order: >-
      FOR ALL dual-window attacks A (parametrized by nu, u, and any LPN solver
      whose cost is a function of (eps, s)), FOR ALL rate-1/2 [2n,n] codes and
      error weights 2w = o(n), THERE EXISTS no configuration with quantum cost
      below 2^{n/(4w) (1+o(1))}. Note carefully what this does NOT quantify
      over: solvers whose cost is NOT a function of (eps, s) -- in particular
      a solver exploiting quasi-cyclicity of the parity checks -- are outside
      the FOR ALL and the bound says nothing about them. Stating that
      explicitly is the difference between a scoped closure and an
      overreaching impossibility claim, which the Idea Generator contract
      forbids.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Within the (eps, s)-cost model, dual-window attacks on rate-1/2 QC-SD
        with sublinear weight cost at least 2^{n/(4w)}, and therefore lose to
        Grover-Prange whenever w < sqrt(n/2)." It can never certify anything
        about permutation-side algorithms, and it cannot certify anything about
        a solver outside the cost model.
      nearby_object_control: >-
        The nearby object where the conclusion must FAIL is a rate-0.2 code at
        linear weight, where RLPN is published to win. If the bound also closes
        that object, the bound is wrong. Second control: BIKE/QC-MDPC, where
        w = Theta(sqrt(n log n)) is larger, so w/sqrt(n/2) is larger and the
        crossover is nearer -- the method must place BIKE closer to the
        crossover than HQC, and if it does not, the w-dependence is mis-derived.
    proof_obligations:
      - claim: 'w_P = 2w s/N < 1 implies the attack recovers the zero vector'
        responsibility: correctness
      - claim: 'the LPN/WHT step costs >= 2^{s} classically, >= 2^{s/2} quantum'
        responsibility: runtime
      - claim: 'eps = (1-2u/nu)^{w_N} and sample count is eps^{-2} / eps^{-1}'
        responsibility: size
      - claim: 'parity-check supply of weight <= u on nu positions costs at least the stated post-selection amplitude'
        responsibility: feasibility
      - claim: 'the bound reproduces the published RLPN advantage at R < 0.3, linear weight'
        responsibility: baseline
      - claim: 'quantum dual sampling requires a superposition of noisy codewords'
        responsibility: interface
      - claim: 'the bound is scoped to (eps,s)-cost-model solvers'
        responsibility: scope

  predictions:
    - metric: >-
        minimum quantum cost exponent of the dual-window family at HQC-128,
        from an exact multi-parameter numerical optimization over (nu, u, p)
      direction: higher
      minimum_effect: >-
        PREDICTED >= 130 bits (crude bound gives 134), against Grover-Prange's
        66. Any optimum below 100 bits contradicts the crude bound and must be
        investigated; any optimum below 66 bits is an exponent-moving positive
        result and escalates immediately.
    - metric: 'crossover ratio w / sqrt(n/2) per parameter set'
      direction: higher
      minimum_effect: >-
        PREDICTED 0.70 / 0.75 / 0.77 at HQC-128/192/256, monotonically
        increasing. A ratio >= 1.0 at any standardized parameter set would mean
        the dual family beats Grover-Prange there and is the headline positive
        outcome. Values computed from RECALLED parameters; recompute from spec.
    - metric: >-
        feasibility of preparing sum_e sqrt(D(e)) |c+e> from one HQC public key
        plus the n cyclic shifts
      direction: different
      minimum_effect: >-
        PREDICTED infeasible: the n shift-states span an n-dimensional subspace
        while the required state has support of size about 2^{1064} with
        prescribed amplitudes, and the shifts carry correlated (not
        independent) errors. A constructive positive answer would be a major
        result and must be escalated before any further work.
    - metric: >-
        effective independent sample count of a quasi-cyclic shift orbit of
        parity checks, measured at toy scale, as a fraction of n
      direction: lower
      minimum_effect: >-
        PREDICTED well below n (correlated branches). If it is close to n, the
        supply cost drops by a factor n and the optimization must be rerun with
        that supply model -- a real, if cofactor-scale, change.
    - metric: 'reproduction of the published RLPN advantage at R = 0.2, linear weight'
      direction: different
      minimum_effect: >-
        The bound MUST show a dual-side advantage there. Failure falsifies the
        cost model, not HQC.

  minimal_test:
    design: >-
      Three stages, cheap, ordered so the falsifier runs first.
      STAGE 0 (hours, symbolic, RUNS FIRST): the baseline reproduction. Read
      KN-LIT-fb3102 and KN-LIT-b66899, encode the (supply, bias, window) cost
      expression against their stated formulas, and evaluate it at R = 0.2
      and R = 0.1 with linear weight, checking it reproduces a dual-side
      advantage over ISD consistent with the published R in (0,0.3) window. If
      it does not, STOP -- the cost model is wrong and nothing downstream is
      interpretable.
      STAGE 1 (hours, numeric): exact multi-parameter optimization of the same
      expression at HQC-128/192/256 with the true (n, w) read from the spec,
      over nu in [1, N], u in [0, nu/2], and the window error budget
      p = w_P in {1,...,8}, using exact binomial/Krawtchouk expressions rather
      than the asymptotic approximations used to write this record. Report the
      optimum, the optimizing parameters, and the crossover ratio. Report
      classical (eps^{-2}, 2^s) and quantum (eps^{-1}, 2^{s/2}) columns
      side by side under matched accounting.
      STAGE 2 (days, symbolic + small simulation): the quantum-dual-sampling
      interface check. Write down explicitly the state arXiv:2509.24796
      requires; write down the state constructible from (h, s) and its n
      cyclic shifts; compute their overlap and the dimension of the span, at
      toy n (n = 31, 43, 59) by exact linear algebra. This is a linear-algebra
      computation on n-dimensional subspaces, not a quantum simulation.
      Additionally measure the effective independent sample count of a
      QC-shift parity-check orbit at toy n by direct empirical estimation of
      the variance of the bias estimator.
    controls:
      - >-
        BASELINE CONTROL (Stage 0, mandatory and first): published RLPN
        advantage at R in (0,0.3) with linear weight must be reproduced. A
        bound that closes the dual family everywhere is a broken bound.
      - >-
        NULL OBJECT 1: a RANDOM (non-quasi-cyclic) [2n,n] code at the same
        (n,w). The optimization must return the same optimum to within the
        quasi-cyclic supply factor (at most a factor n). If the QC and random
        optima differ by more than that, the cost model is smuggling in
        structure it has not justified.
      - >-
        NULL OBJECT 2 (for the sample-independence measurement): a family of n
        INDEPENDENTLY generated parity checks at the same weight. Its effective
        sample count must measure as n. If the estimator does not return n on
        the independent family, it cannot be trusted on the shift orbit.
      - >-
        NULL OBJECT 3 (for Stage 2): the overlap computation run against a
        genuinely random n-dimensional subspace of the same ambient space. If
        the shift-orbit span is no more useful than a random subspace of the
        same dimension, the QC structure contributes nothing and Stage 2's
        answer is negative for a structural reason rather than a numerical one.
      - >-
        STRUCTURAL TELL: the optimum cost exponent must INCREASE as w decreases
        at fixed n (sparser errors force a larger window). An optimum that is
        flat or decreasing in w contradicts the mechanism and indicates the
        optimizer is finding a degenerate corner (e.g. nu = N, u = 0).
    required_metrics:
      - optimum quantum and classical cost exponents with optimizing (nu,u,p), per parameter set
      - crossover ratio w/sqrt(n/2) per parameter set
      - Stage 0 reproduction outcome at R = 0.1, 0.2, 0.3, 0.5
      - memory/QRAM requirement at the optimum, stated separately from time
      - span dimension and maximum overlap for the Stage 2 state check, per toy n
      - effective independent sample count of the QC-shift orbit, with CI

  null_object_control: >-
    See minimal_test.controls. The decisive one is NULL OBJECT 1 (random code
    at the same parameters): the whole record claims the dual family is bounded
    by a structural cost that has nothing to do with quasi-cyclicity, so the
    quasi-cyclic and random optima must agree up to the supply factor. If they
    do not, the record has accidentally measured a QC-specific effect and must
    be rewritten around it -- which would itself be the more interesting
    outcome.

  falsification_conditions:
    - >-
      STAGE 0 FAILS: the cost expression does not reproduce a dual-side
      advantage at R in (0,0.3) with linear weight. The bound is wrong; the
      record is withdrawn and superseded, and nothing downstream is reported.
    - >-
      The Stage 1 optimum at any standardized parameter set falls below
      2^{w} = Grover-Prange. Falsifies the crossover claim in the direction
      that matters and is an exponent-moving positive result requiring
      independent review.
    - >-
      The measured crossover ratio at HQC-256 reaches or exceeds 1.0.
      Falsifies "all three sets are below crossover".
    - >-
      A constructive preparation of the quantum-dual-sampling input state from
      one public key plus its shifts is exhibited. Falsifies the interface
      claim and reopens the entire family with the strongest known generator.
    - >-
      The QC-shift parity-check orbit measures as n effectively independent
      samples. Falsifies the correlated-branch expectation and lowers the
      supply cost by a factor n (cofactor-scale, but it changes the optimum).
    - >-
      The optimum cost exponent is flat or decreasing in w at fixed n.
      Falsifies the secret-window mechanism itself.

  confounders:
    - >-
      ASYMPTOTIC vs EXACT: every number in this record was derived with
      asymptotic approximations (binary entropy for binomials, (1-2 omega)^W
      for Krawtchouk). Stage 1 must use exact expressions; discrepancies of
      several bits are expected and are not findings.
    - >-
      SOLVER SUBSTITUTION: the 2^s window cost assumes a WHT/exhaustive solver.
      A better LPN solver (BKW variants, sparse-LPN reductions per
      arXiv:2312.00747) changes it. The optimization must be run with at least
      two solver models and the bound stated per model, or the FOR ALL in the
      quantifier order is false as written.
    - >-
      DEGENERATE OPTIMA: numerical optimizers park at nu = N or u = 0, which
      correspond to no attack at all. Constrain the search region and report
      the optimizing parameters, never just the optimum.
    - >-
      The recalled RLPN rate window (0, 0.3) came from a search-result summary,
      not from the paper, and the statistical-decoding bias formula came from
      memory rather than from KN-LIT-b66899. If either is different, Stage 0's
      acceptance criterion or H1 is wrong.
    - >-
      Toy-scale (n <= 59) subspace-overlap results do not extrapolate
      automatically; they establish a structural reason or they establish
      nothing.

  interpretation_limits:
    - >-
      The bound is scoped to solvers whose cost is a function of (eps, s). It
      is NOT an impossibility claim about dual-based attacks in general, and
      must never be quoted as one.
    - >-
      A closure here closes the dual lane only. It says nothing about the
      permutation lane (Grover-Prange, quantum-walk BJMM), which remains this
      RQ's baseline and its own open question.
    - >-
      Nothing here bears on HQC's DFR model or on the sibling RQs, per this
      RQ's isolation constraint.
    - >-
      Toy-scale measurements (effective sample count, subspace overlap) are
      hypothesis-generating for scaling arguments only.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a random [N, N/2] code and a uniformly random error of weight
        W = o(N), the bias of <h,e> for a dual codeword h of weight u on a
        window of size nu satisfies eps = K_{w_N}(u)/C(nu,w_N) =
        (1 - 2u/nu)^{w_N} (1 + O(w_N^2/nu)), uniformly for u/nu bounded away
        from 0 and 1/2 and w_N = o(sqrt(nu)).
      rigorous_support: >-
        The exact quantity is a ratio of Krawtchouk polynomials, a rigorous
        combinatorial identity; the heuristic is only the uniform validity of
        the (1-2u/nu)^{w_N} approximation in the stated range, imitating the
        classical hypergeometric-to-binomial limit. The corpus records for the
        statistical-decoding formulation of this bias are KN-LIT-b66899 and
        KN-LIT-fb3102, and this statement must be checked against them.
      validation_plan: >-
        Compute the exact Krawtchouk ratio and the approximation over a grid of
        (nu, u, w_N) covering the Stage 1 optimizer's region, at both toy and
        HQC scale (the exact computation is cheap; only the ATTACK is
        expensive). Compare relative error; require < 1% in the optimizing
        region. TAIL CHECK: the approximation degrades near u/nu -> 1/2, which
        is exactly where the optimizer wants to sit, so the check must be
        densest there.
      falsification_condition: >-
        Relative error above 5% anywhere in the optimizing region, or
        disagreement with the bias formula recorded in KN-LIT-b66899, in which
        case all exponents must be recomputed from the exact Krawtchouk values
        and this record's quoted numbers withdrawn.
    - id: H2
      statement: >-
        The sample count needed to identify the secret e_P from biased samples
        is Theta(s * eps^{-2}) classically and Theta(s * eps^{-1}) with
        amplitude estimation, PROVIDED the samples are independent; for a
        family of parity checks generated by quasi-cyclic shifts of a common
        seed check, the effective independent count is c(n) * n with
        c(n) = o(1).
      rigorous_support: >-
        The independent case is the classical Chernoff/Hoeffding sample bound
        for distinguishing a biased coin, paired with the amplitude-estimation
        quadratic improvement; the shift-orbit case has NO rigorous support and
        is a conjecture, flagged as such -- it imitates nothing classical and
        is exactly what the toy-scale measurement is for.
      validation_plan: >-
        At toy n in {31, 43, 59, 101}, generate (a) n independent parity checks
        and (b) the n cyclic shifts of one check, estimate the bias with each
        family over 10^5 random instances, and compare the estimator variances;
        the effective sample count is n * Var_independent / Var_orbit.
        Comparison distribution: the independent family must return effective
        count n within 10%. TAIL CHECK on the worst-case instance rather than
        the mean.
      falsification_condition: >-
        Effective count of the independent family differing from n by more than
        10% (estimator broken), or effective count of the shift orbit exceeding
        0.9n (conjecture false, supply cost drops by ~n).
    - id: H3
      statement: >-
        The expected error weight on the secret window is w_P = 2w * s/N and
        concentrates; in particular Pr[w_P = 0] = (1 - s/N)^{2w} >= 1 - 2ws/N,
        so with s < N/(2w) the attack returns the zero vector with probability
        at least 1/2.
      rigorous_support: >-
        Exact hypergeometric computation for a uniformly random weight-2w
        support; no heuristic in the statement itself. The heuristic content is
        the modelling assumption that HQC's support is uniform -- which is
        exactly the assumption IDEA-20260818-45b8ea proposes to MEASURE, and
        the two records should be read together.
      validation_plan: >-
        Direct exact evaluation of the hypergeometric probability at all three
        parameter sets over the optimizer's s range; no sampling needed. Cross-
        check against 10^6 simulated uniform supports at HQC-128 as an
        implementation test of the exact formula.
      falsification_condition: >-
        Simulated frequency differing from the exact hypergeometric by more
        than 3 sigma (implementation error), or, if IDEA-20260818-45b8ea
        measures a materially non-uniform support, recomputation under the
        measured distribution changing s_min by more than 10%.

  target_complexity:
    time_exponent: >-
      Dual family, quantum, HQC-128: >= 2^{n/(4w)} = 2^{134} (crude bound;
      exact optimum to be computed in Stage 1, predicted >= 2^{130}). Dual
      family, classical: >= 2^{n/(2w)} = 2^{268}. Crossover against
      Grover-Prange's 2^{w}: dual wins iff w > sqrt(n/2).
    memory_exponent: >-
      THE FAMILY'S MEMORY POSITION IS ITS WORST FEATURE AND MUST BE STATED
      ALONGSIDE TIME. The classical WHT step requires 2^{s} >= 2^{268} words of
      memory at HQC-128 -- physically absurd and far worse than its time cost
      relative to ISD, which runs in polynomial memory for Prange. The quantum
      variant can avoid the table by amplitude-amplifying over candidate
      secrets at 2^{s/2} time and polynomial memory, OR keep the table in QRAM
      at 2^{s} qubits. BOTH must be reported. The sample store is eps^{-1} to
      eps^{-2} parity checks unless they are coherently regenerated, which is
      the only QRAM-free option and costs a supply-circuit call per query.
      IDEA-20260808-baf8bc's memory-constrained frontier T_V(mu) is the natural
      machinery for pricing this column and should be applied to it if built.
    qubit_and_depth_exponent: >-
      Assumes FULL FAULT-TOLERANT ERROR CORRECTION throughout; nothing here is
      NISQ-compatible. Two cost models must be reported separately.
      (i) QRAM-FREE: parity checks generated coherently on demand, secrets
      searched by amplitude amplification -- time 2^{s/2} * (supply-circuit
      depth), width O(N) = O(2^{15.1}) logical qubits, depth = time (serial).
      (ii) QRAM-ASSUMED: 2^{s} QRAM cells for the WHT table and 2^{|samples|}
      for the parity-check store -- and at s >= 268 this is 2^{268} cells,
      which is not a cost model, it is a refutation. THE HONEST SUMMARY: THIS
      FAMILY'S ADVANTAGE, IF ANY, EVAPORATES UNDER ANY REALISTIC QRAM CHARGE,
      AND THE QRAM-FREE VARIANT IS THE ONLY ONE WORTH COSTING.
    best_known: >-
      Grover-Prange 2^{w(1+o(1))} = 2^{66} iterations at HQC-128; classical ISD
      + DOOM about 2^{125}; RLPN/Dual Attack 3.0 classically, published to beat
      ISD only for R < 0.3.
    hidden_overhead: >-
      The o(1) hides the supply-circuit depth (a coherent information-set
      randomization plus post-selection, of order n^3 Toffoli), the polynomial
      s factor in the sample count, and the LPN solver's own polynomial
      overheads. None of these is superpolynomial, unlike the exemplar's o(1);
      the record's uncertainty is in the optimizer's output, not in hidden
      asymptotics.
    tradeoff_note: >-
      The (eps, s) model IS a time-memory tradeoff surface: larger s buys
      smaller bias requirements and costs memory/search exponentially. The
      quantum amplitude-amplification variant sits at the polynomial-memory
      corner with time 2^{s/2}; the QRAM variant sits at the 2^{s}-memory
      corner with lower time. Parallelizes like Grover (sqrt(P)), so the
      crossover condition w = sqrt(n/2) is invariant under parallelization --
      which is the strongest thing that can be said for the bound.

  dominated_by: >-
    THE PROPOSAL AS A DUAL ATTACK IS DOMINATED (predicted), and every frontier
    row was checked. (1) Grover-Prange, 2^{66} iterations, polynomial memory,
    no QRAM: dominates on time by a predicted 64-68 bits and on memory
    absolutely. (2) Quantum-walk BJMM/MMT: dominates on time; the comparison on
    memory is model-dependent and both are bad. (3) Classical ISD + DOOM,
    2^{125} iterations, polynomial memory: dominates the CLASSICAL dual variant
    (2^{268}) on both axes, and dominates the quantum dual variant on memory.
    (4) RLPN / SD 2.0 / Dual Attack 3.0 classical, and the corpus
    statistical-decoding records KN-LIT-fb3102 and KN-LIT-b66899: at R = 1/2
    these are themselves outside their published advantage window, so they do
    not dominate this record but neither is dominated by it -- both lose to
    ISD. (5) Quantum dual-codeword sampling (arXiv:2509.24796): does not apply
    to a fixed public key absent the Stage 2 state construction, so it is NOT
    on this attack model's frontier; if Stage 2 comes out positive it becomes
    the dominating row and this record's whole cost model must be rebuilt. (6)
    Brute-force support enumeration, 2^{1064}: not on the frontier.
    dominated_by IS NOT NULL and is not claimed to be.
  sota_delta: >-
    PREDICTED -64 to -68 BITS, i.e. the dual family is predicted to be about
    2^{64} to 2^{68} times WORSE than Grover-Prange at HQC-128 (2^{130-134}
    versus 2^{66}), and about 2^{143} worse classically. The positive
    deliverable is not an attack but two reusable numbers: the crossover
    condition w = sqrt(n/2), and the measured ratios 0.70 / 0.75 / 0.77 with
    their rising trend across HQC's security levels. If Stage 1's exact
    optimum lands below 2^{66} at any parameter set, sota_delta becomes
    positive and the record escalates.

  obstruction:
    statement: >-
      A dual-window attack on sparse syndrome decoding recovers the error only
      on its secret window, and a window carrying fewer than one expected error
      coordinate returns the zero vector. The window is therefore bounded below
      by |P| >= N/(2w) independently of bias, of parity-check supply, and of
      any quantum acceleration of either, and the search over it costs at least
      2^{|P|/2} with amplitude amplification. This is a property of the OBJECT
      (a sparse error in a rate-1/2 code), not of any attempt: it is what makes
      the sublinear-weight regime structurally different from the linear-weight
      regime where RLPN's published advantage lives.
    quantity: >-
      (q1) the crossover ratio rho = w / sqrt(n/2); (q2) the exact optimum
      quantum cost exponent of the dual-window family; (q3) the deficit
      log2(dual optimum) - log2(Grover-Prange), in bits.
    value: >-
      NOT MEASURED. No run exists. PREDICTED from asymptotic approximations on
      RECALLED parameters: rho = 0.70 / 0.75 / 0.77 at HQC-128/192/256
      (dimensionless, +/- the parameter-recall uncertainty, which is not a
      statistical error bar and must be resolved by reading the spec); q2 >=
      130 bits at HQC-128; q3 approximately +68 bits (dual family worse). These
      are predictions with stated derivations and are not to be cited as
      measurements (AGENTS rule 5).
    measured_by: []
    scope: >-
      Would be claimed for rate-1/2 [2n,n] codes, Hamming metric, error weight
      2w = o(n), and solvers whose cost is a function of (eps, s) only. NOT
      claimed for low-rate codes, for linear weight, for the rank metric, for
      QC-MDPC's weight regime, or for solvers exploiting quasi-cyclicity of the
      parity checks.
    resource_check:
      examined: true
      reading: >-
        THE OBSTRUCTION IS THE HYPOTHESIS OF A PARAMETER-SELECTION THEORY, and
        the theory that wants it is DESIGN, not cryptanalysis. rho = w/sqrt(n/2)
        is a single dimensionless number that says how close a quasi-cyclic
        parameter set sits to the point where the dual lane overtakes the
        permutation lane, and HQC's three sets increase monotonically in it
        (0.70, 0.75, 0.77) because w grows faster than sqrt(n) across the
        security ladder. Extrapolated, that trend is a prediction about any
        FUTURE higher-security parameter set, and rho is the quantity to check
        before choosing one. A second reading, which the crossover form makes
        available and the verdict form does not: the same inequality read
        backwards says a designer can PUSH a scheme away from the dual lane by
        lowering w and raising n at fixed key size -- and IDEA-20260818-f8dc30's
        obstruction says exactly the opposite for the transform lane, where the
        margin is proportional to w. The two obstructions pull in opposite
        directions in the same variable, which localizes an optimum that
        neither record alone can see. A third reading FAILED and is recorded:
        no theory was found that takes the +68-bit deficit itself as a
        resource; it is simply large.
      spawned_ids: []

  estimated_cost:
    implementation: medium
    compute: low
    detail: >-
      Stage 0 and Stage 1 are a few hundred lines of exact
      binomial/Krawtchouk arithmetic plus a constrained optimizer -- core-hours,
      no simulation. Stage 2 is exact linear algebra on n-dimensional subspaces
      at n <= 59 plus a 10^5-instance bias-variance measurement -- core-hours.
      Implementation is medium because Stage 0's baseline reproduction requires
      encoding a published cost model faithfully from KN-LIT-fb3102 /
      KN-LIT-b66899, and getting that wrong invalidates everything after it.
      Total: under one core-day of compute, several days of careful
      implementation.

  recommended_priority: medium
