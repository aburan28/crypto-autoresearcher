idea:
  id: IDEA-20260818-d5668d
  question_id: RQ-QALG-122b59
  added: '2026-08-18'
  proposed_by: idea-generator
  title: >-
    THE SECRET-WINDOW BOUND FOR DUAL-BASED QUANTUM ATTACKS ON SPARSE QC-SD:
    RLPN / statistical decoding / quantum dual-codeword sampling all pay
    2^{n/(4w)} where Grover-Prange pays 2^{w}, so they win exactly when
    w > sqrt(n/2) -- and HQC's three parameter sets sit at 0.70, 0.75, 0.77 of
    that crossover, rising with security level
  class: composition

  claim: >-
    Every attack in the dual-vector family -- statistical decoding, RLPN /
    Statistical Decoding 2.0 / Dual Attack 3.0, BKW-style LPN reduction, and
    the coherent quantum-sample variants including Blanvillain-Chailloux-
    Tillich dual-codeword sampling -- shares one structural cost that no
    quantum speedup removes: it recovers the error only on a SECRET WINDOW P,
    and in the sublinear-weight regime the window must be large enough to
    contain at least one error coordinate, i.e. |P| >= N/(2w) with N = 2n. The
    search over that window costs at least 2^{|P|/2} = 2^{n/(4w)} even with
    amplitude amplification and even with parity checks supplied free. The
    claim is therefore a CROSSOVER, stated as an inequality between exponents
    rather than as a verdict: the dual family beats Grover-Prange on QC-SD
    exactly when n/(4w) < w, i.e. when w > sqrt(n/2). At HQC-128 (n = 17669,
    w = 66) the dual bound is 2^{134} against Grover-Prange's 2^{66}, a deficit
    of 68 bits, and w/sqrt(n/2) = 0.70; at HQC-192 (35851, 100) it is 0.75; at
    HQC-256 (57637, 131) it is 0.77. HQC's parameter sets approach the
    crossover as the security level rises, and whether the exact multi-
    parameter RLPN optimum crosses it at HQC-256 is an open numerical question
    this record proposes to settle. A second, independent claim with its own
    test: the recent quantum dual-sampling primitive, which produces
    minimum-weight dual codewords at the information-theoretic limit, requires
    a SUPERPOSITION OF NOISY CODEWORDS as input, and a fixed-public-key
    attacker holds exactly one noisy codeword; the n cyclic shifts of the
    syndrome give n structured, non-independent noisy codewords, and whether
    that suffices is a cheap algebraic question whose positive answer would be
    a major result and whose negative answer removes the strongest known
    generator from the dual family's cost model.
  mechanism: >-
    A dual attack partitions the N = 2n coordinates into a NOISE window
    (size nu) and a SECRET window P (size s = N - nu). It collects parity
    checks -- dual codewords h that are low weight (u) on the noise window and
    arbitrary on P -- and forms samples <h_P, e_P> = <h, y> + <h_N, e_N>, i.e.
    LPN in dimension s with secret e_P and noise <h_N, e_N> of bias
    eps = (1 - 2u/nu)^{w_N}, w_N ~ 2w * nu/N. It then solves that LPN, in the
    RLPN line by a Walsh-Hadamard transform over the 2^s candidate secrets.
    Three costs compose. (A) PARITY-CHECK SUPPLY: the number of dual codewords
    with weight <= u on the noise window is about 2^{k_dual} C(nu,<=u) 2^{-nu},
    so u is pushed up, which depresses the bias. (B) BIAS BUDGET: the number of
    samples is eps^{-2} classically and eps^{-1} with quantum amplitude
    estimation -- this is a genuine quantum lever and it is NOT the same as
    Grover's, because it is a square root in the BIAS rather than in the search
    space. (C) SECRET WINDOW: the WHT/search step costs 2^s classically and
    2^{s/2} with amplitude amplification over candidate secrets. The
    sublinear-weight regime is what makes (C) binding and is why results proved
    at linear weight do not transfer: the expected error weight on P is
    w_P = 2w * s/N, so w_P < 1 whenever s < N/(2w) -- the window contains no
    error, the recovered secret is the zero vector, and the attack learns
    NOTHING. Hence s >= N/(2w) is forced, and cost >= 2^{N/(4w)} = 2^{n/(4w)}
    quantum. Setting that against Grover-Prange's 2^{w} gives the crossover
    w = sqrt(n/2). The mechanism is exponent-first because both sides are
    exponents in the same variable and the comparison is an inequality between
    them, not a constant-factor argument; and it is a COMPOSITION rather than a
    control because the positive branch -- a multi-parameter optimum below the
    crude bound, or a QC-specific parity-check supply that changes (A) -- is a
    genuine attack construction that the same experiment would exhibit.
