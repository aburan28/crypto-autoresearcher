    at |D|^{1/4} -- and at every discriminant size below the crossover of
    IDEA-20260818-ec1740 those rows dominate it on BOTH axes simultaneously.
    It is also dominated outright by row (7) in the quantum regime.
    AS AN ANALYSIS: no incumbent memory-bounded analysis of class-group index
    calculus was found in the bounded screen; the honest statement is "none
    found in a bounded screen", not "none exists", and three memory cells of the
    frontier table are UNCHECKED, so this entry is provisional by construction.
    AS A MEASUREMENT: IDEA-20260815-f2d15e records memory as a metric and
    therefore partially overlaps on the data axis, but does not sweep beta and
    so cannot produce a trace; it does not dominate this record and this record
    does not dominate it.
    NOT NULL ON ANY AXIS.
