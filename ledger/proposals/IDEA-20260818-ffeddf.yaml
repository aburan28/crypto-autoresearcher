  obstruction:
    statement: >-
      A CLAIM ABOUT THE OBJECT: for imaginary quadratic index calculus the
      time-optimal parameter choice requires memory exponential in
      sqrt(ln|D| lnln|D|), so a memory-bounded adversary is forced off the
      optimum onto the branch where cost is dominated by the smoothness term
      1/(4 beta), which diverges as the memory bound tightens. Time and memory
      are not independently choosable for this algorithm.
    quantity: >-
      memory_time_exponent_ratio := log(peak memory) / log(total time), measured
      over the discriminant ladder; and c(W) := beta_W + 1/(4 beta_W), the best
      achievable time constant under memory bound W.
    value: >-
      NOT MEASURED. Model-predicted 1/3 (dense structure recovery, sparse
      storage) or 1/2 (sparse kernel). These are DERIVATIONS and must not be
      written into this field; the field is filled from Stage B runs with
      intervals or it stays empty.
    measured_by: []
    scope: >-
      To be stated as: the named implementation and version, prime
      discriminants D = -p at the four ladder sizes, the storage format used,
      the machine's memory hierarchy, and the beta range swept. Claimed for no
      other implementation and no other discriminant family.
    resource_check:
      examined: true
      reading: >-
        READ THE OTHER WAY ROUND, AND IT TAKES TWICE. (1) "Time-optimal requires
        exponential memory" is the HYPOTHESIS of a defender-side argument that
        this program does not currently make anywhere: parameter selection
        against a memory-bounded adversary model rather than a time-bounded one.
        In every other target in this corpus the adversary is implicitly given
        unbounded memory, which is the strictly conservative choice for a
        defender but which throws away a real and quantifiable margin. A c(W)
        curve is the artifact that makes the margin auditable, and the same
        construction transfers to every index-calculus target the program holds.
        (2) The divergence of 1/(4 beta) as beta falls is the hypothesis of a
        TRADEOFF LOWER BOUND in the restricted model: it says the index-calculus
        family has no low-memory branch with a good constant, which -- combined
        with the generic family's polynomial memory at |D|^{1/4} -- means the
        (time, memory) Pareto frontier for this problem has exactly two known
        corners and a gap between them that nobody has tried to fill. Naming
        that gap is a research direction in itself and is handed forward.
      spawned_ids: []

  confounders:
    - >-
      INTEGER COEFFICIENT GROWTH is the known unmodelled cost of the
      Hermite/Smith step and is not a function of beta. If it dominates, the
      whole one-parameter trace is the wrong object. Largest intermediate
      coefficient is therefore a required metric, and Null 1 is designed to
      expose this specific failure.
    - >-
      MEMORY HIERARCHY. Peak RSS is not cost: an algorithm that fits in cache
      and one that pages have the same RSS and wildly different time. Runs must
      report whether the working set crossed the machine's cache and RAM
      boundaries, and a beta-sweep point that crosses a boundary is annotated,
      never silently included in a fit.
    - >-
      IMPLEMENTATION DEFAULTS. Most implementations pick B by a built-in
      heuristic that may not be the modelled optimum. The beta sweep is
      mandatory precisely because the default point tells you nothing about the
      trace.
    - >-
      SPARSE VERSUS DENSE ACCOUNTING. The memory exponent differs by a factor of
      two between formats. Pooling them produces a meaningless fitted ratio.
    - >-
      SMALL-SIZE ARTIFACTS. At 2^{64} the factor base is small enough that
      constant overheads dominate both legs, so the lowest rung may not inform
      the ratio at all and must be reported separately rather than pooled.

  interpretation_limits:
    - >-
      Scoped to one cost model, one implementation family, the tested
      discriminants and the tested machine. Nothing here states that any
      deployed parameter is adequate or inadequate, and nothing here is a break
      of any deployed construction.
    - >-
      The bit figures in `claim` parts (B) and (C) are MODEL OUTPUTS with o(1)
      set to zero and constants outside the exponent dropped. They illustrate
      the shape of the memory constraint; they are not security estimates and
      must never be quoted as such.
    - >-
      c(W) is a statement about the best configuration OF THIS ALGORITHM under a
      memory bound. It says nothing about what a different low-memory algorithm
      might achieve, and the gap in the Pareto frontier is explicitly left open.
    - >-
      The omega = 2 branch's constant of 1 is COFACTOR-LEVEL relative to
      3/sqrt(8) and is almost certainly published; it is recorded for
      completeness and must not be presented as an improvement by this program
      unless a primary read establishes otherwise.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (GRH / ERH.) GRH holds for the relevant L-functions, underwriting the
        Bach-type bound making a polylogarithmic factor base generate Cl(D), the
        retrieved constant 3/sqrt(8), the analytic pinning of h(D) used in the
        specialization transform, and Booker's |D|^{1/4} row used in part (D).
      rigorous_support: >-
        Unproved. Unconditional analogues exist with worse bounds, so its
        contribution is quantifiable rather than hidden. Numbered here because
        every complexity statement in this record inherits it.
      falsification_condition: >-
        Not falsifiable here. Testable proxy: the computed group order must
        match the ERH-interval analytic estimate at every tested discriminant. A
        mismatch is a bug until proved otherwise.
      validation_plan: >-
        SAMPLE: the 12 ladder discriminants. COMPARISON: computed h against the
        truncated Euler product with ERH error term. TAIL CHECK: largest
        relative deviation. TRANSFER: none.
    - id: H2
      statement: >-
        (SMOOTHNESS DENSITY.) Reduced-ideal norms of size |D|^{1/2} are
        B-smooth with probability u^{-u(1+o(1))}, u = (d/2)/ln B, uniformly for
        u in ((log|D|)^eps, (log|D|)^{1-eps}). This supplies the 1/(4 beta) leg
        and is therefore load-bearing for c(W).
      rigorous_support: >-
        Rigorous size ingredient: Gauss reduction confines the candidate to
        [1, sqrt(|D|/3)] with counting measure near-uniform there. Classical
        distribution theorem imitated: Canfield-Erdos-Pomerance
        Psi(X,B) = X u^{-u(1+o(1))}.
      falsification_condition: >-
        Realized smoothness rate deviates from rho(u) by more than 15 percent
        systematically across three consecutive u values.
      validation_plan: >-
        SHARED WITH IDEA-20260818-170937 STAGE B, which validates exactly this
        assumption at up to 2^{160} using only the reduce-and-factor step and no
        full class group computation. This record consumes that validation
        rather than duplicating it; if 170937 is not run, this record must run
        its own reduced version at the ladder sizes and say so.
    - id: H3
      statement: >-
        (LINEAR ALGEBRA EXPONENT.) The integer Hermite/Smith computation on the
        relation matrix costs M^omega up to polylog factors and up to
        coefficient growth, with omega = 3 for the dense structure-recovery
        configuration and omega = 2 for the sparse black-box kernel
        configuration, uniformly over the tested matrix dimensions.
      rigorous_support: >-
        Rigorous ingredient: the worst-case complexities of the underlying
        routines are known. THE GAP, AND IT IS THE RECORD'S CENTRAL WEAKNESS:
        integer coefficient growth in Hermite/Smith is not captured by an
        exponent in M at all, and if it dominates, omega is not a well-defined
        parameter for this matrix family. That is exactly what Null 1 and the
        largest-intermediate-coefficient metric measure.
      falsification_condition: >-
        The measured linear-algebra time versus matrix dimension, across the
        beta sweep at fixed |D|, is not consistent with any single omega in
        [2, 3] within intervals.
      validation_plan: >-
        SAMPLE: the five-point beta sweep at |D| ~ 2^{128}, plus the four ladder
        sizes at default beta. COMPARISON: fitted slope of log(LA time) against
        log(M), against the interval [2, 3]. TAIL CHECK: the largest matrix, and
        its largest intermediate coefficient against the dimension. TRANSFER
        ASSUMPTION: that a fitted omega at M in the low thousands transfers to
        the M = 2^{35}-ish matrices the model implies at deployed sizes. THIS
        TRANSFER IS UNJUSTIFIED AND IS RECORDED AS UNJUSTIFIED; it is the
        largest single source of error in c(W).
    - id: H4
      statement: >-
        (COST-MODEL COMPLETENESS.) Total cost is the sum of exactly two legs,
        relation collection and linear algebra, with all other steps
        (reduction, factor-base construction, certificate emission) of lower
        order, uniformly over the tested range.
      rigorous_support: >-
        No rigorous support; this is the standard modelling convention in the
        index-calculus literature and is asserted, not proved. It is numbered
        because parts (B), (C) and (D) all fail if a third leg is comparable.
      falsification_condition: >-
        Measured "other" time exceeds 20 percent of total at any ladder rung.
      validation_plan: >-
        SAMPLE: all Stage B runs, with time accounted to three buckets summing
        to the total. COMPARISON: "other" fraction against 20 percent. TAIL
        CHECK: the rung with the largest "other" fraction, itemized. TRANSFER:
        none.

  target_complexity:
    time_exponent: >-
      NO IMPROVEMENT TO THE UNCONSTRAINED TIME EXPONENT IS CLAIMED. The record
      derives, and proposes to measure, the memory-constrained family
      exp((beta_W + 1/(4 beta_W) + o(1)) sqrt(ln|D| lnln|D|)) with
      beta_W = min(ln W/sqrt(ln|D| lnln|D|), 1/(2 sqrt 2)), which REDUCES to the
      known unconstrained constant at W large. The omega = 2 specialization
      would give constant 1 against 3/sqrt(8) = 1.0607 -- a 6 PERCENT
      COFACTOR-LEVEL MOVE, EXPLICITLY NOT TARGET-CLASS PER
      docs/target-result-profile.md A1, and expected to be already published.
      Stated plainly rather than dressed up.
    memory_exponent: >-
      THE RECORD'S ACTUAL SUBJECT. Derived: L_{|D|}[1/2, beta] words in sparse
      storage and L_{|D|}[1/2, 2 beta] in dense, with beta = 1/(2 sqrt 2) at the
      cubic optimum and beta = 1/2 at the sparse-kernel optimum. Exponent ratio
      to time: 1/3 and 1/2 respectively. Under the model with o(1) = 0 that is
      2^{34.8} words at 1024-bit |D| and 2^{51.8} at 2048-bit, before
      coefficient growth. The competing generic/analytic family needs polynomial
      memory (Booker) or |D|^{1/4} for a plain baby-step giant-step table.
    best_known: >-
      FRONTIER ROWS CHECKED ON TIME, MEMORY AND DATA/QUERIES:
      (1) Hafner-McCurley, time L[1/2, sqrt(2)], memory not stated in the
      retrieved abstract -- FLAGGED AS AN UNCHECKED CELL.
      (2) Biasse-Erukulangara, time L[1/2, 3/sqrt(8)] under GRH, memory not
      stated in the retrieved abstract -- UNCHECKED CELL.
      (3) de Boer-Pellet-Mary-Wesolowski Thm 1.3 (ERH), time as quoted, NO
      MEMORY BOUND IN THE THEOREM AS READ on pages 1-4 -- UNCHECKED beyond p.4.
      (4) Booker, time |D|^{1/4} GRH / |D|^{1/2} unconditional, POLYNOMIAL
      MEMORY -- this row DOMINATES index calculus on the memory axis outright.
      (5) Sutherland generic order, O((N/loglog N)^{1/2}) group operations, low
      memory.
      (6) van Oorschot-Wiener applied to the generic family: time
      |D|^{3/4}/sqrt(w) with memory w on one processor, divided by n on n
      processors -- the interpolation any memory-bounded comparison must sit
      against.
      (7) Quantum, Hallgren: polynomial time and polynomial space for quadratic
      fields, dominating every row above on both axes.
      THREE OF THESE SEVEN ROWS HAVE AN UNCHECKED MEMORY CELL. That is recorded
      as a gap in this record's own frontier table rather than papered over, and
      filling those three cells is Stage A work.
    hidden_overhead: >-
      The o(1) is large at reachable sizes and the memory figures inherit it
      doubly, since memory is an exponential of beta*sqrt(d ln d) with the same
      o(1). Additionally, integer coefficient growth in Hermite/Smith is hidden
      entirely inside "polylog" in the model and is the most likely place for
      the model to be wrong by a large factor; H3 and Null 1 exist for exactly
      that reason.
    tradeoff_note: >-
      THIS IS THE RECORD'S PRIMARY OUTPUT. Index calculus interpolates along
      c(W) = beta_W + 1/(4 beta_W), which is a WORSENING curve as memory falls
      and has no low-memory branch with a good constant. The generic family
      interpolates along van Oorschot-Wiener at |D|^{3/4}/sqrt(w). The two
      curves cross at a W-dependent discriminant size, and that crossing is
      part (D)'s measurable. Parallelization is asymmetric too: relation
      collection is embarrassingly parallel with per-worker memory O(1) but the
      linear algebra is not, so a distributed adversary faces a memory wall on
      exactly the leg that cannot be split -- which is the single most
      operationally relevant sentence in this record.

  dominated_by: >-
    CHECKED AGAINST EVERY ROW IN `target_complexity.best_known` ON TIME, MEMORY
    AND DATA/QUERIES.
    AS AN ALGORITHM: the specialization transform (analytic pinning plus sparse
    modular kernel) is DOMINATED ON TIME by nothing among the classical rows if
    its derived constant 1 is correct, but it is DOMINATED ON MEMORY by row (4)
