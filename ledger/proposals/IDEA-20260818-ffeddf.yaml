idea:
  id: IDEA-20260818-ffeddf
  question_id: RQ-CLGRP-66ab7f
  added: '2026-08-18'
  title: >-
    THE DEPLOYED COST MODEL HAS NO MEMORY AXIS: derive the memory exponent of
    class-group index calculus from the same balance that fixes the time
    constant, show that the proved constant 3/sqrt(8) is exactly the
    cubic-linear-algebra optimum, and replace the security NUMBER by a security
    CURVE in the adversary's memory
  class: composition

  claim: >-
    Deployed discriminant sizes for hidden-order class groups are justified by a
    TIME complexity, L_{|D|}[1/2, c]. No memory figure accompanies it. The claim
    has four parts.
    (A) MEMORY IS HALF THE BALANCE, NOT A LOWER-ORDER TERM. Writing
    ln B = beta*sqrt(d*ln d) with d = ln|D|, the relation-collection leg of
    index calculus has exponent coefficient beta + 1/(4beta) and the linear
    algebra leg has omega*beta, where omega is the exponent of the integer
    matrix routine. The total constant is min over beta of
    max(beta + 1/(4beta), omega*beta). DERIVATION IN THIS RECORD: at omega = 3
    the optimum is beta = 1/(2 sqrt 2) = 0.35355 and the constant is
    3/(2 sqrt 2) = 3/sqrt(8) = 1.06066 -- NUMERICALLY IDENTICAL to the constant
    Biasse and Erukulangara proved for Hafner-McCurley under GRH. The proved
    time constant appears to BE the cubic-linear-algebra optimum, which would
    mean the published time bound is linear-algebra-determined and its memory
    footprint is not optional.
    (B) THE MEMORY EXPONENT IS ONE THIRD OF THE TIME EXPONENT. At that optimum
    the relation matrix has dimension L_{|D|}[1/2, 0.35355], so sparse storage
    is L_{|D|}[1/2, 0.35355] machine words and dense storage
    L_{|D|}[1/2, 0.7071]. The ratio (memory exponent)/(time exponent) is exactly
    beta/(3beta) = 1/3. Under the record's cost model with o(1) set to zero,
    that is 2^{34.8} words at a 1024-bit discriminant and 2^{51.8} words at
    2048 bits -- of order 10^{11} and 10^{16} bytes respectively at 8 bytes per
    word, BEFORE any coefficient growth.
    (C) SECURITY IS A CURVE, NOT A NUMBER. An adversary limited to W words of
    memory cannot choose the optimizing beta. Constrained to
    beta_W = ln W / sqrt(d ln d) < 1/(2 sqrt 2), the best available constant
    becomes c(W) = beta_W + 1/(4 beta_W), which DIVERGES as W shrinks: at
    beta_W = 0.2 it is 1.45, at 0.1 it is 2.60, against 1.06 unconstrained. The
    deployed parameter argument quotes c(infinity). The gap between c(W) and
    c(infinity), expressed in bits at deployed sizes, is a computable function
    this program can publish.
    (D) THE MEMORY-CONSTRAINED CROSSOVER MOVES. Because the generic/analytic
    family runs in |D|^{1/4+o(1)} with polynomial memory, a memory bound helps
    it and hurts index calculus, so the crossover of
    IDEA-20260818-ec1740 moves UPWARD in |D| as W falls. The memory-bounded
    crossover is a second measurable quantity that no cost model in this corpus
    contains.
    ALL FOUR PARTS ARE ABOUT A COST MODEL. NOTHING HERE IS A BREAK OF ANY
    DEPLOYED CONSTRUCTION, AND NO STATEMENT THAT ANY DEPLOYED PARAMETER IS
    ADEQUATE OR INADEQUATE MAY BE DERIVED FROM IT.

  mechanism: >-
    THE BALANCE, WRITTEN OUT, BECAUSE THE WHOLE RECORD RESTS ON IT.
    Let d = ln|D| and let the factor base be the prime forms of norm at most B,
    with ln B = beta*sqrt(d ln d). Then:
    (i) FACTOR BASE SIZE. |FB| ~ B/ln B, so ln|FB| = beta*sqrt(d ln d)*(1+o(1)).
    (ii) CANDIDATE SIZE. Each relation trial reduces an ideal and tests the
    reduced norm, of size |D|^{1/2}, so ln(candidate) = d/2 and
    u = (d/2)/ln B = (1/(2 beta)) sqrt(d/ln d).
    (iii) TRIALS PER RELATION. By Canfield-Erdos-Pomerance the smoothness
    probability is u^{-u(1+o(1))}, so ln(trials) = u ln u (1+o(1)) =
    (1/(4 beta)) sqrt(d ln d) (1+o(1)), using ln u = (1/2) ln d (1+o(1)).
    (iv) RELATIONS NEEDED. Order |FB|, so relation collection has exponent
    coefficient beta + 1/(4 beta).
    (v) LINEAR ALGEBRA. The relation matrix is |FB| x (|FB|+k); recovering the
    GROUP STRUCTURE (not merely an order) requires Hermite/Smith normal form
    over the integers, cost |FB|^omega up to polylog and up to coefficient
    growth, giving exponent coefficient omega*beta.
    (vi) OPTIMIZE. min_beta max(beta + 1/(4 beta), omega beta). For omega = 3
    the two legs cross at 3 beta = beta + 1/(4 beta), i.e. beta^2 = 1/8,
    beta = 0.353553, and the value is 3 beta = 1.060660 = 3/sqrt(8). For
    omega = 2 (sparse black-box methods) they cross at beta = 1/2 with value 1.
    THE COINCIDENCE IS THE LEAD. 3/sqrt(8) is exactly the constant retrieved
    from Biasse-Erukulangara's GRH-conditional proof of the Hafner-McCurley run
    time. If that is not a coincidence, then the published constant is
    linear-algebra-determined, the memory footprint L[1/2, 0.354] is forced by
    the same optimization, and no cost model that quotes the time and omits the
    memory is quoting a self-consistent algorithm. VERIFYING THIS BY PRIMARY
    READ IS THE FIRST, ZERO-COMPUTE STEP OF THE MINIMAL TEST, and it can fail:
    their analysis may reach 3/sqrt(8) by an entirely different route, in which
    case part (A) is withdrawn and parts (B)-(D) are re-derived from whatever
    balance they do use.
    THE omega = 2 BRANCH IS FLAGGED, NOT CLAIMED. The same arithmetic gives
    constant 1 at beta = 1/2 with sparse linear algebra. 1 < 3/sqrt(8), so if
    this were a new result it would be a 6 percent exponent-constant
    improvement -- WHICH IS COFACTOR-LEVEL, NOT TARGET-CLASS, and is almost
    certainly already in the literature (Vollmer's asymptotically fast discrete
    logarithms in quadratic number fields is the first place to look, and it is
    UNREAD). It is recorded here because it is the branch that changes the
    MEMORY ratio from 1/3 to 1/2 of the time exponent, which is the
    decision-relevant part, and because a proposal that derived it and stayed
    silent would be hiding a result it did not check.
    WHY A MEMORY BOUND BITES ASYMMETRICALLY. Index calculus stores a factor base
    and a relation matrix whose sizes are tied to beta, and beta is what buys
    the good time constant; capping memory caps beta and pushes cost onto the
    1/(4 beta) smoothness term, which grows without bound. The generic/analytic
    family's memory is polynomial (Booker) or is itself tradeable by the van
    Oorschot-Wiener distinguished-point construction at time
    sqrt(N^3/w) = |D|^{3/4}/sqrt(w) with memory w. Two families, opposite
    responses to the same constraint: that is why the crossover moves and why
    the movement is measurable.

  novelty_status: unverified

  novelty_screen:
    corpus_screened: >-
      ledger/proposals grepped by mechanism keyword ('class group', 'imaginary
      quadratic', 'hidden order', 'Hafner', 'VDF'); the 11 proposals citing
      RQ-CLGRP-66ab7f opened at title/claim level; IDEA-20260815-f2d15e and
      IDEA-20260815-beb144 read in full; RQ-CLGRP-66ab7f read in full.
    occupied_lanes_found: >-
      Of the 11 adjacent proposals, IDEA-20260815-f2d15e records "memory" as one
      of several per-rung metrics and IDEA-20260809-843eb6 sweeps cost. NONE
      derives a memory exponent, NONE states a time-memory tradeoff, and NONE
      makes the adversary's memory bound a parameter of the security statement.
      The memory axis is unoccupied in this corpus for this target.
    nearest_neighbour_and_discriminator: >-
      NEAREST IS IDEA-20260815-f2d15e, which logs peak memory as an observation.
      DISCRIMINATOR: logging memory is not deriving a memory exponent, and
      neither f2d15e nor any other record states the beta + 1/(4beta) balance,
      the 1/3 exponent ratio, or the c(W) curve. SECOND NEAREST IS
      IDEA-20260818-ec1740 (this session), which measures where two families
      cross at unbounded memory; this record predicts and measures how that
      crossing MOVES under a memory bound, which is a different quantity
      requiring a different experiment.
    web_screened: >-
      Retrieved: Hafner-McCurley constant sqrt(2); Biasse-Erukulangara
      3/sqrt(8) under GRH; Booker |D|^{1/4} GRH / |D|^{1/2} unconditional;
      Sutherland O((N/loglog N)^{1/2}); de Boer-Pellet-Mary-Wesolowski ePrint
      2025/1514 Theorem 1.3 (PRIMARY READ pages 1-4). NOT screened, and these
      are the exact places the claim would already live: Vollmer,
      "Asymptotically fast discrete logarithms in quadratic number fields"
      (surfaced in search, UNREAD); Jacobson's thesis and papers on practical
      class group computation (UNREAD); Buchmann-Duellmann on the linear algebra
      step (RECALLED ONLY). THE beta-BALANCE ARITHMETIC IS STANDARD
      INDEX-CALCULUS BOOKKEEPING AND SHOULD BE ASSUMED KNOWN.
    verdict: >-
      UNVERIFIED, with an explicit expectation that the balance arithmetic in
      `mechanism` is textbook and that the omega = 2 branch is published. What
      is not known to exist anywhere is the c(W) SECURITY CURVE for deployed
      class-group discriminants and the memory-bounded crossover of part (D).
      Novelty, if any, is in (C) and (D), not in (A) or (B), and the record must
      be reviewed on that basis.

