  object_first_candidate:
    established_families_declared_off_limits: >-
      Declared off-limits as the primary lens: sweep-and-fit cost curves,
      two-torsion enumeration, parameter provenance, and any variant of "make
      relation collection faster", which is where essentially all published
      effort on this algorithm has gone and which this record deliberately does
      not touch.
    tracked_object: >-
      THE RESOURCE PAIR (log time, log memory) OF ONE COMPLETE COMPUTATION,
      tracked as a point in the plane as beta varies -- i.e. the algorithm's
      whole Pareto TRACE rather than its optimal point.
    lossiness: >-
      LOSSY-PROJECTION TEST. The pair (log T, log M) discards the algorithm, the
      discriminant, the factor base contents, the relation matrix, and every
      intermediate value: from a point on the trace nothing about the
      computation is recoverable. It is not a re-coordinatization of the
      computation. What it discards is discarded COMPATIBLY with the operation
      the record cares about -- varying beta -- because both coordinates are
      functions of beta alone under the cost model
      (log T = max(beta+1/(4beta), omega beta) sqrt(d ln d),
      log M = beta sqrt(d ln d) up to storage format), so the retained pair
      propagates deterministically along the one-parameter family. The
      projection is exactly lossy enough: it forgets everything except the two
      numbers a memory-bounded adversary must trade between.
    propagation: >-
      One step is a change of beta. It is defined exactly (both coordinates are
      closed-form in beta) and measurable exactly (re-run the implementation at
      a different factor-base bound and record the pair). This is the cheapest
      one-step propagation of any object in this session's four records.
    survival: >-
      Survives while the cost model's two legs are the only significant costs.
      It DISSOLVES when a third cost appears that is not a function of beta --
      integer coefficient growth in the Hermite/Smith step is the known
      candidate, since its size depends on h(D) and on the relation lattice's
      shape rather than on beta. Detecting that dissolution is what Null 2 is
      for, and the dissolution point is itself a reportable measurement.
    scoring: >-
      GENUINELY NEW OR REPACKAGING: the object is a repackaging of standard
      index-calculus bookkeeping into a Pareto trace; the NEW part is treating
      the adversary's memory as the free parameter of the security statement.
      Honest score: new framing, standard ingredients.
      CONCRETELY TESTABLE: yes, one re-run per beta.
      SURVIVAL: to the coefficient-growth boundary, which is named and measured
      rather than assumed away.

  proof_search_map:
    bottleneck: >-
      The integer linear algebra step (Hermite/Smith normal form of the relation
      matrix). Removing it -- replacing structure recovery by order recovery
      pinned against an analytic estimate -- changes omega from 3 to 2, changes
      the optimizing beta from 1/(2 sqrt 2) to 1/2, changes the time constant
      from 3/sqrt(8) to 1, and changes the memory-to-time exponent ratio from
      1/3 to 1/2. Nothing else in the algorithm changes.
    baseline_embedding:
      parameter_slice: >-
        omega = 3, beta = 1/(2 sqrt 2). This slice must reproduce the retrieved
        constant 3/sqrt(8) exactly, and the omega = 3, beta free slice must
        reproduce the whole published constant as a minimum.
      reproduction_check: >-
        FROZEN SYMBOLIC FIXTURE, ZERO COMPUTE: a script that, given omega,
        returns argmin_beta max(beta + 1/(4 beta), omega beta) and the value,
        asserted against (0.353553, 1.060660) for omega = 3 and (0.5, 1.0) for
        omega = 2, to six decimal places. Plus a PRIMARY READ of
        Biasse-Erukulangara to check whether their proof's balance is this one.
        If the primary read shows a different balance, part (A) is withdrawn.
    observation_collision:
      observable: >-
        The pair (measured wall clock, measured peak memory) of a completed
        computation.
      distinct_preimage_search: >-
        A COLLISION IS EXPECTED AND MUST BE HANDLED. Two different (omega, beta)
        configurations can land on the same (T, M) point -- for instance dense
        cubic linear algebra at small beta versus sparse quadratic at larger
        beta -- so the observable does NOT identify the configuration. The
        separator is the SPLIT: the fraction of time spent in linear algebra,
        which differs between the two even when the totals agree. The design
        therefore instruments the split, and any conclusion drawn from (T, M)
        alone is inadmissible. STATING THIS BEFORE THE EXPERIMENT IS THE POINT
        OF THE AUDIT.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Replace the integer Hermite/Smith computation by: (a) an
          ERH-conditional analytic estimate of h(D) accurate to within a factor
          under 2 from a truncated Euler product; (b) sparse kernel computation
          modulo several small primes by block Wiedemann, memory O(M) words;
          (c) reassembly and verification of the exact order against the
          analytic interval.
        predicted_gain: >-
          omega 3 -> 2, time constant 3/sqrt(8) -> 1 (a 6 percent exponent
          constant, EXPLICITLY COFACTOR-LEVEL AND NOT TARGET-CLASS), and memory
          exponent from 0.354 to 0.5 of sqrt(d ln d) -- i.e. this trade BUYS
          time and PAYS memory, which is the opposite of what a memory-bounded
          adversary wants and is exactly why the c(W) curve is the right output
          rather than a single improved constant.
      - transform: boundary_lift
        proposed_object: >-
          Extend the certificate family from "the computed structure" to "the
          computed structure together with the beta at which it was computed and
          the peak memory it required", so that a cost record is a point on a
          trace rather than a scalar.
        predicted_gain: >-
          Makes the c(W) curve an artifact the program can accumulate across
          runs and across goals, rather than a one-off analysis. Low
          mathematical content, high reuse.
    quantifier_order: >-
      FOR ALL memory bounds W, FOR ALL discriminants D with d = ln|D|, THERE
      EXISTS a factor-base parameter beta_W = min(ln W/sqrt(d ln d),
      1/(2 sqrt 2)) such that the index-calculus cost is
      exp((beta_W + 1/(4 beta_W) + o(1)) sqrt(d ln d)) within memory W.
      NOTE THE ORDER: beta_W depends on BOTH W and D, which is legitimate
      because an adversary knows both. What is NOT permitted, and would be a
      quantifier error, is choosing beta after seeing the instance's class
      group -- and no step of the analysis does so.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest certifiable claim is a statement about THIS COST MODEL and
        the measured behaviour of ONE implementation family: that the
        time-optimal configuration requires memory exponentially large in
        sqrt(d ln d), and that constraining memory degrades the time constant
        along the stated curve. It CANNOT certify that no low-memory algorithm
        with a better constant exists, and no record under this proposal may say
        so.
      nearby_object_control: >-
        Apply the identical analysis to integer factoring by the quadratic
        sieve, where the same balance structure holds and where the memory
        requirement of record computations is publicly documented. If the
        analysis predicts a memory exponent grossly inconsistent with published
        QS/NFS record memory usage, the model is wrong in a way that the class
        group case would hide. THIS CONTROL IS FREE -- it is arithmetic plus a
        literature lookup -- and it is the single best sanity check available.
    proof_obligations:
      - claim: "ln|FB| = beta sqrt(d ln d)(1+o(1))."
        responsibility: size
      - claim: "ln(trials per relation) = (1/(4beta)) sqrt(d ln d)(1+o(1)) via CEP."
        responsibility: success_probability
      - claim: "Linear algebra costs omega*beta in the exponent, coefficient growth included in polylog."
        responsibility: runtime
      - claim: "min_beta max(beta+1/(4beta), 3beta) = 3/sqrt(8) at beta = 1/(2 sqrt 2)."
        responsibility: baseline
      - claim: "Memory is L[1/2, beta] sparse and L[1/2, 2beta] dense."
        responsibility: memory
      - claim: "Under memory bound W the best constant is beta_W + 1/(4 beta_W)."
        responsibility: strictness
      - claim: "Claims are scoped to this cost model and one implementation family."
        responsibility: scope

  null_object_control: >-
    NULL 1 (STRUCTURELESS MATRIX NULL -- the inventor-protocol null object). Run
    the identical linear-algebra step on a RANDOM sparse integer matrix of the
    same dimension, same row weight distribution, same entry magnitudes and the
    same determinant magnitude as the real relation matrix, but with no
    class-group structure. Prediction under the cost model: time and memory
    match the real matrix within a small factor, because the cost is driven by
    dimension, density and coefficient growth rather than by arithmetic
    structure. IF THE REAL MATRIX IS SUBSTANTIALLY MORE EXPENSIVE, an unmodelled
    structural cost exists and the memory exponent derived here is a lower
    bound; if substantially cheaper, the relation lattice is atypically
    well-conditioned and the deployed cost model is pessimistic. BOTH OUTCOMES
    ARE INFORMATIVE AND NEITHER IS THE PREDICTED ONE.
    NULL 2 (INVARIANT-FACTOR NULL). Compare the Smith normal form profile of the
    real relation matrix against that of the random matrix of Null 1. Both are
    predicted to be nearly cyclic -- the random case by the classical
    Ekedahl/Cohen-Lenstra-type heuristics for random integer matrices, the class
    group case by Cohen-Lenstra for Cl(D). Agreement is a controlled null and
    means the SNF cost has no class-group-specific component. Disagreement
    localizes exactly where the structure enters.
    NULL 3 (SYNTHETIC TRACE NULL). Stub both legs with the modelled costs and
    verify the measurement pipeline recovers the injected beta-optimum and the
    injected 1/3 exponent ratio. A pipeline that cannot recover a known optimum
    cannot be trusted to report a measured one.

  predictions:
    - metric: >-
        argmin_beta and value of max(beta + 1/(4beta), omega beta), computed
        symbolically for omega in {2, 2.376, 3}
      direction: different
      minimum_effect: >-
        FORCED by arithmetic: (0.500000, 1.000000) for omega = 2 and
        (0.353553, 1.060660) for omega = 3, to six decimals. If the frozen
        fixture disagrees, the record's arithmetic is wrong and it is void.
    - metric: >-
        whether Biasse-Erukulangara's proof of the 3/sqrt(8) constant proceeds
        through this same cubic-linear-algebra balance (primary read)
      direction: different
      minimum_effect: >-
        Binary. YES: part (A) stands and the published time constant is
        linear-algebra-determined, which is a reportable reading of an existing
        proof. NO: part (A) is withdrawn, the numerical coincidence is recorded
        as a coincidence, and parts (B)-(D) are re-derived from their actual
        balance. The NO branch is not a failure of the record; it is the audit
        working.
    - metric: >-
        measured fraction of total wall clock spent in the linear-algebra step,
        at the implementation's default parameters, per discriminant size
      direction: different
      minimum_effect: >-
        The balanced-optimum model predicts a fraction in [0.35, 0.65] and
        approximately CONSTANT across discriminant sizes. A fraction outside
        that band, or one drifting monotonically with size, means the
        implementation is not at the modelled optimum and its measured cost
        curve is not the modelled algorithm's curve -- which would materially
        qualify every cost-curve record in this goal.
    - metric: >-
        fitted exponent ratio log(peak memory)/log(total time) across the
        discriminant ladder
      direction: different
      minimum_effect: >-
        Predicted 0.333 +/- 0.05 for dense cubic structure recovery with sparse
        storage, or 0.5 +/- 0.05 for the sparse-kernel configuration. A measured
        ratio above 0.7 would mean memory is growing nearly as fast as time,
        which would make memory, not time, the binding resource at deployed
        sizes and would be the record's most consequential outcome.
    - metric: >-
        c(W) curve: best achievable time constant as a function of the memory
        bound W, evaluated at W in {2^{30}, 2^{35}, 2^{40}, 2^{45}, 2^{50}}
        words at d corresponding to 1024 and 2048 bits
      direction: higher
      minimum_effect: >-
        Under the model, c(W) exceeds c(infinity) = 1.0607 by at least 0.35 at
        1024 bits for W = 2^{30} words, i.e. at least 0.35*68.3 = 24 bits of
        added attack cost from the memory bound alone. Publishing a curve whose
        spread is under 5 bits across that whole W range would falsify the
        claim that memory is decision-relevant.
    - metric: >-
        memory-bounded crossover location against the generic family, in bits of
        |D|, as a function of W
      direction: higher
      minimum_effect: >-
        Predicted to move upward monotonically as W falls, by at least 30 bits
        between W = 2^{50} and W = 2^{30} words. A non-monotone or flat response
        falsifies part (D).

  minimal_test:
    design: >-
      THREE STAGES, ORDERED, EACH GATING THE NEXT.
      STAGE A (ZERO COMPUTE, HOURS). Run the frozen symbolic fixture for omega
      in {2, 2.376, 3}. Run the nearby-object control against published QS/NFS
      record memory figures. Primary-read Biasse-Erukulangara for the balance,
      and Vollmer for the omega = 2 branch. Outcome: part (A) stands, is
      withdrawn, or is degraded to `known`.
      STAGE B (MODERATE COMPUTE, DAYS). Instrument one existing class-group
      index-calculus implementation to report, per run: factor-base bound B,
      |FB|, relations collected, wall clock split into relation collection and
      linear algebra, peak RSS split the same way, and matrix dimension,
      density and largest intermediate coefficient. Run at |D| ~ 2^{64},
      2^{96}, 2^{128}, 2^{160}, three prime discriminants each. THEN SWEEP beta:
      at |D| ~ 2^{128}, re-run at five factor-base bounds spanning a factor of
      16, tracing (log T, log M) directly. This beta-sweep IS the experiment;
      the ladder only anchors it.
      STAGE C (LOW COMPUTE, DAYS). Run Null 1 and Null 2 on matrices matched to
      the Stage B runs. Fit the memory/time exponent ratio. Publish the c(W)
      curve and the memory-bounded crossover, both as model outputs with the
      measured beta-trace overlaid and the extrapolation distance stated.
    controls:
      - Frozen symbolic fixture (Stage A, blocking).
