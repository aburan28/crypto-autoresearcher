idea:
  id: IDEA-20260829-3f0f4b
  question_id: RQ-ECDLP-160d89
  added: '2026-08-29'
  title: >-
    The (gamma, s) exponent surface: retarget the lane from output-sensitive
    joins to any sub-3/2-power join, and locate every existing lane record and
    candidate key on one two-parameter cost law
  class: measurement
  claim: >-
    The entire source-labelled four-list family has a single two-parameter cost
    law. Let the level-1 join cost L^gamma per side per attempt and let the
    survivor pair-sums be supported, in the Renyi-2 sense, on sigma = N^s group
    elements. Then with the list length optimized, expected time is
    T = N^max(gamma*(2-s)/4, s/2) and peak memory is
    M = N^max((2-s)/4, s/2), and the four-list route beats Pollard rho on TIME
    exactly when s < 1 and gamma < 2/(2-s). CONSEQUENCE, and this is the claim
    the lane has never stated. At the accepted-set density already frozen in
    K-EC-XINTERVAL-1, that is s = 2/3, the beat-rho condition is gamma < 3/2, NOT
    gamma = 1. A join for the x-coordinate interval key costing L^(3/2 - eps),
    quadratically far from output-sensitive, already yields
    N^(1/2 - eps/3) < N^(1/2), with memory N^(1/3). The lane's REVISE verdicts
    were all rendered against the gamma = 1 target and none of them tested
    gamma < 3/2. This is falsifiable both ways, since either the surface is
    arithmetically wrong, or the lane's own frozen key sits eps away from a
    strictly weaker, previously unexamined target.
  mechanism: >-
    Fix L, an accepted set D with |D| = sigma, and four independently sampled
    source-labelled lists of length L. Emitted level-1 pairs per side are
    P = L^2 * sigma / N, since the survival rate is the accepted-set density.
    Cross-side zero-relations have expectation P^2 / sigma = L^4 * sigma / N^2,
    so one attempt suffices when L = (N^2/sigma)^(1/4). Substituting, the join
    term is L^gamma = N^(gamma(2-s)/4) and the output term is P = N^(s/2), and
    the per-attempt cost is their maximum. Memory is max(L, P). The three
    published points of this lane are exact slices. (gamma,s) = (2,1) is BSGS at
    N^(1/2). (gamma,s) = (2,2/3) is exactly the Theta(L^2) = N^(2/3+o(1)) figure
    of B64-DER-2. (gamma,s) = (1,2/3) is Wagner's N^(1/3). The surface is
    therefore not a new model, since it is the model the lane has been using one
    point at a time, written down. Writing it down is what exposes the
    gamma < 3/2 region, because the beat-rho boundary is a LINE in (gamma,s), not
    the single corner the certificate C2 and C3 rows encode. The certificate rows
    C2 and C3 of H-JPR-3a00f0 pin gamma = 1 as a requirement; the surface shows
    that is sufficient but far from necessary.
  novelty_status: unverified
  citations:
    - ref: ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-671cae.yaml
      provenance: internal
      claim: >-
        B64-DER-2, every exact supplied first-level enumerator inspects
        Theta(L^2) = N^(2/3+o(1)) pairs. This is the (gamma,s) = (2,2/3) point
        and is reproduced exactly by the surface, which is the surface's baseline
        check.
      verified_by: idea-generator, full read of the checkpoint on 2026-08-29
    - ref: ledger/hypotheses/H-JPR-3a00f0.yaml
      provenance: internal
      claim: >-
        JPR-C3 requires O(L polylog N + output) join work and JPR-C4 requires
        cross-collision Theta(N^(-2/3)); these are the gamma = 1 and s = 2/3 rows
        respectively. The surface does not contradict them; it shows C3 is
        sufficient rather than necessary for a sub-rho route.
      verified_by: idea-generator, full read of the record on 2026-08-29
    - ref: IDEA-20260823-cab6c6
      provenance: internal
      claim: >-
        K-EC-XINTERVAL-1, a frozen, public, DLP-free, sign-invariant key with
        accepted-set density 1/L, whose direct enumerator costs Theta(L^2). This
        record uses that exact key as its primary test subject and changes only
        the target it is measured against.
      verified_by: idea-generator, full read of the record on 2026-08-29
    - ref: IDEA-20260817-1e0111
      provenance: internal
      claim: >-
        The prior single-number reduction of the lane to the pruning ratio r and
        the cost curve n^(1/(t+1)) * 2^(t*w*(1-r)). The surface here is a
        different parameterization, because r conflates enumeration cost with
        concentration, which is precisely the conflation IDEA-20260823-835868 was
        written to break, whereas (gamma, s) keeps them as separate coordinates.
      verified_by: idea-generator, full read of the record on 2026-08-29
    - ref: IDEA-20260829-390ccc
      provenance: internal
      claim: >-
        The companion structure theorem, which constrains only the gamma = 1
        corner and is silent on the region where gamma lies strictly between 1
        and 3/2, which is the region this record targets.
      verified_by: idea-generator, authored in this session
    - ref: >-
        A. Bostan, P. Flajolet, B. Salvy, E. Schost, "Fast computation of special
        resultants", composed sums and products, J. Symbolic Computation, 2006
      provenance: recalled
      claim: >-
        Composed sums and products of two polynomials of degrees m and n are
        computable in quasi-linear time in the OUTPUT degree mn via power sums.
        Relied on only as the reason to expect that any algebraic route to the
        pair multiset costs Omega(L^2), since the pair multiset IS the output.
        Pointer only; not fetched, and the record does not rely on its exact
        constants.
      verified_by: null
  assumptions:
    - >-
      A1. Leaves are independently sampled with recorded (a,b), so survival
      events across pairs are treated as independent at first order; correlation
      is charged in H2.
    - >-
      A2. sigma is the Renyi-2 effective support, that is 1/collision
      probability, not merely the support size. The two differ and the difference
      is measured, not assumed.
    - >-
      A3. Retries are charged as inverse success probability. The optimization
      sets success to Theta(1) per attempt, and the surface is re-derived without
      that normalization as a check.
    - >-
      A4. Memory is charged as max(list, emitted) and streaming is permitted; no
      free storage.
    - >-
      A5. The surface describes cost, not feasibility. A point on it is not an
      algorithm; exhibiting a join with a given gamma remains the whole problem.
  proof_search_map:
    bottleneck: >-
      The lane's REVISE decisions were all rendered against gamma = 1. The
      bottleneck this record attacks is the TARGET, not the algorithm, because
      nobody has asked whether the frozen x-interval key admits an
      L^(3/2-eps) join.
    baseline_embedding:
      parameter_slice: >-
        (gamma,s) = (2,1) must give exactly 1/2, which is BSGS.
        (gamma,s) = (2,2/3) must give exactly 2/3, which is B64-DER-2.
        (gamma,s) = (1,2/3) must give exactly 1/3, which is Wagner.
        (gamma,s) = (1,1) must give 1/2. Four independent checks.
      reproduction_check: >-
        Symbolic substitution into T = N^max(gamma(2-s)/4, s/2). All four must
        hold exactly, not to within o(1). If any fails the surface is wrong and
        this record is void before any measurement.
    observation_collision:
      observable: The pair (gamma, s) alone.
      distinct_preimage_search: >-
        Two objects share (gamma,s) = (2,2/3) with different meanings, namely the
        x-interval key with a full L^2 scan, and a post-hoc random point-hash of
        density 1/L with a full L^2 scan. They have identical cost and identical
        surface position but differ in whether any structure exists to exploit.
        So (gamma,s) is a COST coordinate, not a structure coordinate, and this
        record must never be read as a structural claim. That limitation is the
        collision and it is disclosed, not repaired.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Lift the admissible target from the single point gamma = 1 to the
          half-plane gamma < 2/(2-s), with the strictness obligation that the
          resulting exponent be strictly below 1/2 by a stated eps.
        predicted_gain: >-
          At s = 2/3 the target moves from L^1 to L^(3/2-eps), so the required
          speedup over the L^2 baseline shrinks from a factor L to a factor
          L^(1/2+eps). Same qualitative problem, quantitatively far easier.
      - transform: specialization_pack
        proposed_object: >-
          Retrofit every (gamma, s) point implicit in the lane's existing
          records, namely B63, B64, B71, and the XOR, pair-coin and point-hash
          controls, onto one table.
        predicted_gain: >-
          Turns a sequence of REVISE verdicts into a coverage map showing which
          part of the (gamma,s) plane has actually been probed. Expected finding,
          only the boundary where gamma is 1 or 2 has been probed at all.
    quantifier_order: >-
      FOR ALL (gamma, s) with gamma in [1,2] and s in [1/2,1], IF a level-1 join
      exists at cost L^(gamma+o(1)) with Renyi-2 survivor support N^(s+o(1)),
      THEN there exists a choice of L making expected time
      N^(max(gamma(2-s)/4, s/2)+o(1)). The existential over joins is NOT
      discharged for any (gamma,s) other than the four baseline slices; this
      record asserts a cost law, never the existence of an algorithm.
    method_ceiling:
      strongest_certifiable_claim: >-
        An exact cost identity for the family plus a coverage map of which
        (gamma,s) points the program has examined. It can NEVER certify that any
        gamma < 2 join exists, and a coverage map showing a region unexamined is
        not evidence that the region is fertile.
      nearby_object_control: >-
        The XOR prefix join sits at (gamma,s) = (1,2/3) and must land on
        N^(1/3). The independent per-pair coin sits at s = 1 with gamma = 2 and
        must land on N^(1/2), NOT on the N^(2/3) figure that JPR-REV-4 corrected.
        The surface must reproduce the CORRECTED accounting including retries,
        and if it reproduces the uncorrected N^(2/3) it has inherited the same
        error.
    proof_obligations:
      - claim: 'P = L^2 sigma / N and success = L^4 sigma / N^2 under A1.'
        responsibility: success_probability
      - claim: >-
          The optimizing list length is L = (N^2/sigma)^(1/4) and it is a true
          optimum, not a stationary point.
        responsibility: runtime
      - claim: All four baseline slices are reproduced exactly.
        responsibility: baseline
      - claim: >-
          The beat-rho region is exactly the intersection of {s < 1} with
          {gamma < 2/(2-s)}.
        responsibility: strictness
      - claim: >-
          Memory is max((2-s)/4, s/2) and equals 1/3 at s = 2/3 for every gamma.
        responsibility: memory
      - claim: The JPR-REV-4 retry correction is inherited, not re-broken.
        responsibility: correctness
      - claim: A cost coordinate is not a structure coordinate.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: surface_value_at_the_four_baseline_slices
      direction: different
      minimum_effect: >-
        Forced values, exactly 1/2, 2/3, 1/3, and 1/2. Any deviation voids the
        record.
    - metric: beat_rho_join_exponent_threshold_at_s_equals_two_thirds
      direction: different
      minimum_effect: >-
        Exactly gamma < 3/2. If the algebra gives any other threshold the record
        is wrong.
    - metric: number_of_distinct_gamma_values_probed_by_prior_lane_records
      direction: lower
      minimum_effect: >-
        Predicted at most 2, namely gamma = 1 as the target and gamma = 2 as the
        baseline, with zero records examining the open interval between 1 and 2.
        If the retrofit finds a record already probing the interior, this
        record's contribution collapses to a restatement and must be downgraded.
    - metric: renyi2_effective_support_exponent_s_for_K_EC_XINTERVAL_1
      direction: different
      minimum_effect: >-
        Predicted s = 2/3 + o(1) exactly, because the survivor sums lie in
        x^{-1}(I) by construction and |x^{-1}(I)| = Theta(N^(2/3)). If the
        measured Renyi-2 support is materially above 2/3, the key's own
        concentration row fails and the beat-rho threshold moves against it.
    - metric: peak_memory_exponent_across_the_whole_beat_rho_region
      direction: higher
      minimum_effect: >-
        At least 1/3 everywhere in the region. The family never beats rho on
        memory and must never be reported as doing so.
  minimal_test:
    design: >-
      TWO PARTS, and only PART A is inside the RQ's current claim boundary.
      PART A is static with zero runs. Step 1, derive the surface with explicit
      constants and verify all four baseline slices symbolically. Step 2,
      re-derive it WITHOUT the success = Theta(1) normalization, carrying retries
      explicitly, and confirm the JPR-REV-4 corrected pair-coin accounting is
      reproduced. Step 3, retrofit every prior record in this lane and in the
      four-list part of RQ-ECDLP-002 onto the (gamma,s) plane as a table with one
      row per record, citing the record ID and the exact sentence that fixes its
      gamma and s. Step 4, mark the beat-rho region and report which sub-regions
      have zero coverage. PART B requires a claim-boundary amendment and is NOT
      proposed as authorized here; it would be a toy-scale panel at
      24 <= log2 N <= 34 over at least 8 prime-order curves per size, measuring
      for each candidate key the realized join operation count, the emitted
      survivor count, and the Renyi-2 effective support of survivor sums, with
      the log-interval known-log key as a forced positive control at (1, 2/3) and
      a keyed PRF of the point encoding as a forced null at (2, 1).
    controls:
      - >-
        Forced positive control, the log-interval key on Z/N with known
        logarithms, must measure (gamma,s) = (1, 2/3) and land on N^(1/3).
      - >-
        Forced null, a keyed PRF of the point encoding, must measure
        s = 1.00 +- 0.02 and gamma = 2.00 +- 0.05.
      - >-
        Corrected pair-coin control must reproduce JPR-REV-4's expected time N,
        not the uncorrected N^(2/3).
      - >-
        Full-pair locator control must land exactly on the B64-DER-5 Theta(L^2)
        figure.
      - >-
        XOR prefix control, restricted to the common join-core rows only per
        JPR-REV-2, since it cannot satisfy the ECDLP-only scalar-replay rows and
        must not be scored on them.
      - >-
        Mandatory Pareto rows, Pollard rho and BSGS on every point, with time in
        group operations and memory in bytes.
      - >-
        Retrofit self-check, at least one prior record must be placed by an
        independent reader and agree on its (gamma,s).
    required_metrics:
      - surface_value_at_each_of_the_four_baseline_slices
      - beat_rho_boundary_as_an_explicit_function_gamma_lt_2_over_2_minus_s
      - retrofit_table_of_record_id_to_gamma_and_s_with_the_quoted_fixing_sentence
      - count_of_prior_records_with_gamma_strictly_between_1_and_2
      - measured_join_operation_count_exponent_per_candidate_key
      - measured_emitted_survivor_count_per_candidate_key
      - measured_renyi2_effective_support_exponent_per_candidate_key
      - matched_rho_and_bsgs_cost_and_memory_per_instance
  falsification_conditions:
    - >-
      Any of the four baseline slices is not reproduced exactly. The surface is
      wrong and the record is void.
    - >-
      The beat-rho threshold at s = 2/3 is not gamma < 3/2 under an independent
      re-derivation.
    - >-
      The retrofit finds a prior record that already examined the open interval
      between gamma = 1 and gamma = 2 for a prime-order EC key. The reframing is
      then not new and must be relabelled as a restatement of that record.
    - >-
      The surface reproduces the UNCORRECTED pair-coin accounting, showing it
      inherited the JPR-REV-4 defect.
    - >-
      PART B measures s > 2/3 + 0.05 for K-EC-XINTERVAL-1, contradicting its own
      frozen fibre calculation. The key's concentration row then fails
      independently of enumeration.
    - >-
      PART B's forced positive control fails to measure (1, 2/3), meaning the
      instrument cannot see a join that provably works, and every other
      measurement in the panel is uninterpretable.
    - >-
      EXPECTED-NEGATIVE OUTCOME, stated so this record has one. Every candidate
      key measures gamma = 2.00 +- 0.05, that is, the newly named gamma < 3/2
      region is empty for every key examined. That is a measured obstruction with
      a named quantity, not a failure, and it would make the region's emptiness a
      finding rather than an assumption.
  confounders:
    - >-
      Toy sizes compress the exponent range. At log2 N = 34, L = N^(1/3) is about
      2^11 and a gamma estimate has wide error bars. Exponent fits must be
      reported with bootstrap intervals and never as point values.
    - >-
      Wall-clock cost reflects cache behaviour at these sizes; only group and
      field operation counts may be used for exponent fits.
    - >-
      The Renyi-2 support estimator is biased at small sample sizes; a
      shuffled-side control must be run to establish the estimator's floor.
    - >-
      Sign-closure doubles apparent collisions. x-coordinate equality is not
      point equality and the two must be counted separately.
    - >-
      Selection bias in the candidate-key panel, inherited from
      IDEA-20260817-84755b and IDEA-20260823-cab6c6. A null over this panel is
      not independent evidence from those records' nulls.
    - >-
      A record's (gamma,s) placement can be ambiguous when the record does not
      state its enumeration cost. Those rows must be marked UNPLACEABLE rather
      than guessed.
  interpretation_limits:
    - >-
      PART A only is authorized by the current RQ claim boundary; PART B requires
      an explicit boundary amendment and is proposed, not requested.
    - >-
      A cost surface is not an algorithm. Naming the gamma < 3/2 region does not
      make it non-empty, and IDEA-20260829-390ccc gives a structural reason to
      expect its gamma = 1 edge to be empty.
    - >-
      Every measured number in PART B would be scoped to log2 N <= 34, the
      declared curves and the declared panel; nothing transfers to 256-bit
      curves.
    - >-
      The retrofit table is an archival reading of existing records and can
      misread them. Each placement must quote the sentence it relies on so a
      reader can overturn it.
    - >-
      No hypothesis status, experiment approval, or goal state is changed by this
      record.
  heuristic_assumptions:
    - id: H1
      statement: >-
        FIRST-ORDER INDEPENDENCE OF SURVIVAL. For four independently sampled
        source-labelled lists of length L and a predeclared accepted set D of
        density delta, the number of surviving level-1 pairs per side is
        concentrated around L^2*delta with relative fluctuation o(1), and the two
        sides' survivor sum distributions are independent. Formally,
        E[P] = L^2*delta and Var[P] = o(E[P]^2). This imitates the classical
        second-moment concentration used in Wagner's k-tree list-size analysis
        for independent uniform list elements.
      rigorous_support: >-
        The first moment is exact by linearity. The variance bound is NOT
        rigorous, because the L^2 pairs share L leaves, so survival events are
        pairwise dependent through the shared leaf, and the shared fixed key
        induces further dependence. Cauchy-Schwarz gives bounds from a measured
        Renyi-2 mass but does not establish concentration.
      validation_plan: >-
        In PART B, for each key and each size, record the full empirical
        distribution of P over at least 200 independent list draws, and compare
        its coefficient of variation against the independent-pairs prediction.
        Tail check, report the 1st and 99th percentiles against the predicted
        binomial tails, and flag any key whose survivor count has a heavier tail
        than predicted as violating H1 for that key specifically. Sampled
        parameters N, curve, key, seed, and list length recorded per cell.
        Transfer assumption, concentration observed at log2 N <= 34 is NOT
        evidence of concentration at cryptographic size and is reported only as a
        toy-tier consistency check.
    - id: H2
      statement: >-
        RENYI-2 SUFFICIENCY. The expected number of cross-side zero-relations is
        P^2 * coll, where coll is the sum over g of p_alpha(g)*p_beta(g), the
        cross-collision probability of the two survivor-sum distributions, and
        sigma defined as 1/coll is the only feature of those distributions that
        enters the cost to leading exponent order. This imitates the standard
        second-moment, Paley-Zygmund route from a collision expectation to a
        constant-probability existence statement.
      rigorous_support: >-
        The expectation identity is exact. The passage from expectation to
        constant probability requires a second-moment bound on the number of
        collisions, which requires anti-clustering control that is NOT
        established. B64-DER-4 records exactly this gap for the frozen key.
      validation_plan: >-
        In PART B, measure directly the empirical cross-collision count, its
        variance across seeds, the Renyi-2 mass of each side separately, and a
        SHUFFLED-SIDE control, permuting one side's survivor sums, to establish
        the no-structure floor. Compare the realized constant-probability rate
        against the Paley-Zygmund prediction from the measured first and second
        moments. Tail check, report the maximum number of collisions landing on a
        single group element, which detects clustering directly. Any key whose
        clustering exceeds the shuffled control by more than a factor 2 violates
        H2 and its surface placement is void.
  target_complexity:
    time_exponent: >-
      N^max(gamma*(2-s)/4, s/2). No point on the surface is claimed to be
      achieved. The record's specific quantitative content is the beat-rho
      boundary gamma < 2/(2-s), whose value at s = 2/3 is gamma < 3/2 and at
      s = 0.9 is gamma < 1.82.
    memory_exponent: >-
      N^max((2-s)/4, s/2). This equals 1/3 at s = 2/3 for every gamma in [1,2],
      so the whole s = 2/3 line of the surface costs N^(1/3) memory whether or
      not the join is fast. The family is strictly worse than rho on memory
      everywhere.
    best_known: >-
      Pollard rho at N^(1/2+o(1)) time and O(1) memory; BSGS at N^(1/2) time and
      memory; van Oorschot-Wiener total work N^(1/2) at any memory with wall
      clock N^(1/2)/m.
    hidden_overhead: >-
      The o(1) hides polylog sorting and hashing factors folded into gamma;
      per-attempt retry counts, which are folded into the optimization and become
      visible only in the un-normalized re-derivation of PART A step 2; the cost
      of evaluating the key once per element per level; coefficient storage and
      exact source replay; independent certificate re-verification; and the
      p-versus-N translation. At toy sizes the memory-access cost of N^(1/3)
      random lookups is NOT a constant factor and dominates.
    tradeoff_note: >-
      The whole s = 2/3 line sits at M = N^(1/3), hence at
      T^2*M = N^(2*max(gamma/3,1/3)+1/3). At gamma = 1 that is exactly N, the
      same iso-curve as rho and as the S*T^2 = N preprocessing frontier. At
      gamma = 3/2 it is N^(4/3), off the curve and worse. Parallelization, the
      join and the cross-side collision are both distributed sorts and
      parallelize near-linearly in wall clock, but TOTAL WORK is unchanged, so
      the correct incumbent comparison is van Oorschot-Wiener total work N^(1/2)
      and not its wall clock.
  dominated_by: >-
    As a static analysis, not applicable because no result is claimed. For the
    family, the same twelve frontier rows enumerated in IDEA-20260829-390ccc were
    checked, with the same verdicts; the only row whose applicability changes is
    row 10, preprocessing S*T^2 = N, which remains not applicable here because
    this record assumes no advice. Within the surface, every point with
    max(gamma(2-s)/4, s/2) at least 1/2 is dominated by Pollard rho on BOTH axes
    and must be reported as such; the region where s <= 2/3 and gamma < 3/2 is
    incomparable to rho, having less time and more memory, and dominates BSGS on
    both axes. No point of the surface is currently realized on an elliptic
    curve, so the realized Pareto position of this record is dominated by row 1
    outright.
  sota_delta: >-
    Realized cryptanalytic delta is 0. Quantitative delta, the admissible target
    for a sub-rho four-list route at the lane's own frozen accepted-set density
    moves from gamma = 1 to gamma < 3/2, so the required improvement over the
    L^2 baseline shrinks from a factor L = N^(1/3) to a factor
    L^(1/2) = N^(1/6). Conditional exponent delta versus rho at
    (gamma,s) = (3/2 - eps, 2/3), time exponent 1/2 - eps/3 - 1/2 = -eps/3, and
    memory exponent 1/3 - 0 = +1/3. Versus BSGS at the same point, time
    -eps/3 - 0 and memory -1/6. Methodological delta, one cost law replacing
    per-record point estimates, plus a coverage map identifying which sub-regions
    have never been examined.
  estimated_cost:
    implementation: >-
      Low for PART A, which is algebra and a retrofit table; medium for PART B,
      which needs a shared join harness plus a Renyi-2 estimator.
    compute: >-
      Zero runs for PART A; low for PART B, hours at log2 N <= 34 with lists of
      2^11 to 2^12.
  recommended_priority: high
