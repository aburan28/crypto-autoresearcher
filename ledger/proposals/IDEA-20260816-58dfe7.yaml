idea:
  id: IDEA-20260816-58dfe7
  question_id: RQ-MLKEM-003
  added: '2026-08-16'
  title: 'Build the convention-transport map KN-OPEN-016 names as its closure condition: derive, at
    zero compute, how much of the primal-minus-dual bit gap is contributed by the cost convention
    rather than by the attacks, and report whether the gap''s sign is convention-stable'
  class: theory
  claim: '(A) KN-OPEN-016''s stated closure condition has two halves and only one requires experiment.
    The second half is a statement of the primal/dual comparison in a single named cost convention.
    The object this proposal tracks is not either attack. It is the difference G = log2(cost_primal)
    - log2(cost_dual) considered as a function of the convention c, and specifically the convention-transport
    map T(c1 -> c2) that carries G from one convention to another. (B) The claim is that T is derivable
    symbolically at zero compute, because in every convention the corpus records, both attacks'' costs
    are built from the same small set of primitive counts: sieve invocations at a blocksize, sieve
    database size, number of dual vectors, FFT table size, memory words and memory accesses. A convention
    is a choice of price for those primitives. Therefore G(c2) - G(c1) equals the price change dotted
    with the DIFFERENCE of the two attacks'' primitive-count vectors, and that difference vector is
    where all convention sensitivity lives. Computing it symbolically yields, for each pair of conventions,
    an exact expression for how many bits of the primal-dual gap are convention artifact. (C) The
    decisive derived quantity is the sign-stability threshold: the smallest price perturbation, per
    primitive coordinate, that flips the sign of G. If that threshold is large compared with the spread
    between conventions the corpus records, the primal-dual ordering is convention-robust in the tested
    set; if it is small, then any statement of the form the dual attack beats the primal attack is
    a statement about a convention and must be marked as one. (D) NOT CLAIMED: no attack, no cost
    improvement, no claim that either attack beats the other, no claim about ML-KEM security, no assertion
    about what any publication contains, and no claim that the primitive-count vectors used are correct;
    they are read from this corpus''s own technique notes and are as good as those notes.'
  mechanism: 'STAGE 1. From KN-TECH-039, KN-TECH-040 and KN-TECH-044 extract for each attack a symbolic
    primitive-count vector v as a function of the shared parameters, quoting the source line for every
    extraction. STAGE 2. Write each convention as a price covector p_c over the same coordinates:
    core-SVP prices only sieve calls at 2^{0.292 beta}; a gate-count convention prices operations;
    a memory-charged convention prices words and accesses at a nonzero rate. STAGE 3. Then log2 cost
    = log2(p_c . v) and G(c) = log2(p_c . v_primal) - log2(p_c . v_dual). Derive T(c1 -> c2) = G(c2)
    - G(c1) in closed form. STAGE 4. Compute per coordinate the partial derivative of G with respect
    to log price, and solve for the perturbation setting G to zero, the sign-stability threshold.
    STAGE 5. Tabulate at three parameter points. STAGE 6. Adversarial check: perturb every extracted
    count by the largest error the source note''s own stated uncertainty admits and report whether
    any conclusion changes. Refutation: if the difference vector is dominated by one coordinate the
    corpus does not pin, the derivation returns undetermined by available notes with the missing quantity
    named, which is the honest outcome and is itself the deliverable.'
  novelty_status: unverified
  novelty_screen:
    method: grep -rilE 'dual.?attack|dual.?sieve' ledger/proposals/; grep -rilE 'memory.charg|full.cost|wiener'
      ledger/proposals/. Read KN-OPEN-016 in full including its What would close it paragraph, KN-OPEN-017
      in full, and the head of KN-TECH-044. Read titles and claim heads of IDEA-20260805-a102ec, IDEA-20260805-bb7668,
      IDEA-20260805-cd6e1e.
    results: 'IDEA-20260805-cd6e1e is the nearest methodological sibling found: a share-forcing identity
      that converts a constant-factor cryptanalytic claim into a falsifiable statement about which
      fraction of total cost it must occupy, applied to three lanes. Same genus, an algebraic identity
      over cost decompositions at zero compute, and a different object, since it constrains a claimed
      improvement''s share rather than a comparison''s convention sensitivity. IDEA-20260805-a102ec
      audits three constants in one cost script within one convention. IDEA-20260805-bb7668 changes
      which lattice is sieved, altering the count vector rather than the price. KN-TECH-040 is recorded
      in the corpus as a standing warning that cross-model comparison is meaningless, and KN-OPEN-026
      restates it; no record found turns that warning into a computed transport map with a sign-stability
      threshold.'
    verdict: 'UNVERIFIED. Nothing is asserted about external literature. Claimed new relative to this
      repository: converting KN-TECH-040''s qualitative cross-model warning into a derived map with
      a numeric sign-flip threshold per primitive coordinate, at zero compute, against KN-OPEN-016''s
      own stated closure condition. Assembled from known parts: the share-forcing style of IDEA-20260805-cd6e1e,
      the primitive-count decompositions already recorded in KN-TECH-039, KN-TECH-040 and KN-TECH-044,
      and elementary sensitivity analysis of a log-linear cost expression.'
  object_first_candidate:
    tracked_object: The difference vector delta = v_primal - v_dual of primitive counts, together
      with the price covector p_c; the derived scalars are G(c) and the per-coordinate sign-stability
      threshold.
    lossiness: 'Genuinely lossy. The full state of an attack is its entire algorithm; v retains six
      integers as functions of parameters and discards everything else, the order of operations, the
      data structures, the failure probabilities, the parameter optimisation. The discard is compatible
      with the operation of interest because a cost convention is by construction a linear functional
      on exactly these counts: no convention in the corpus prices anything v does not carry, so the
      retained part determines cost under every convention considered, exactly. What is discarded
      and matters is the parameter optimisation: each attack re-optimises its internal parameters
      under each convention, so v is itself convention-dependent through the optimiser. That second-order
      effect is named, is not captured by the linear map, and is the derivation''s principal stated
      gap.'
    propagation: 'One step of the target operation is changing one price coordinate by a factor. Under
      that step log2 cost of each attack moves by the log of the share that coordinate holds in that
      attack''s total, so G moves by the difference of the two shares. This is the entire propagation
      law and it is exact for a fixed v: dG/d(log p_j) = share_j(primal) - share_j(dual). The sign-stability
      threshold in coordinate j is therefore G(c) divided by that share difference, which is why the
      derivation reduces to computing six share differences.'
    survival_score: The derivation is exact for fixed primitive-count vectors and survives across
      every convention that prices only the six recorded coordinates, which covers core-SVP, gate-count
      and memory-charged conventions as the corpus records them. It dissolves at the first convention
      that prices something outside v, and it dissolves as an exact statement the moment re-optimisation
      under the new convention is admitted, because then v depends on p. Both dissolution points are
      named, and the entry reports the fixed-v map as a first-order statement with the re-optimisation
      correction flagged as unbounded rather than estimated.
  null_object_control: 'The null object is a synthetic attack pair with primitive-count vectors drawn
    at random from the same coordinate ranges, with no relationship to any real algorithm, run through
    the identical symbolic pipeline in the same invocation. The null must show what a structureless
    pair shows: sign-stability thresholds distributed broadly with no coordinate systematically dominating,
    and a transport map whose magnitude is the generic scale set by the price spread alone. If the
    real pair''s thresholds are indistinguishable from the random pair''s, then the primal-dual comparison
    carries no more convention structure than two arbitrary cost expressions do, and the derivation''s
    headline is a generic fact about log-linear costs rather than anything about these attacks, recorded
    as a controlled null under inventor-protocol section 3. A second control fixes v_primal = v_dual
    exactly, forcing G = 0 and every threshold undefined; the pipeline must report exactly that.'
  discriminated_from:
  - 'IDEA-20260805-cd6e1e: a share-forcing identity converting constant-factor claims into cost-share
    statements. Same genus, and this entry''s dG/d(log p) law is a share difference, so the two are
    close; the difference is that cd6e1e constrains a single claimed improvement within one convention
    while this maps one comparison across conventions and produces a sign-flip threshold.'
  - 'IDEA-20260805-a102ec: audits constants inside one cost script under one convention. This entry
    never enters a script and is indifferent to whether that correction is right; a correction to
    a constant enters here as a perturbation of v and is handled by the adversarial check.'
  - 'IDEA-20260805-bb7668: changes which lattice is sieved, which changes v. This changes p and holds
    v fixed; the two are orthogonal moves on the same expression.'
  - 'KN-TECH-040 as a standing warning: qualitative, and cited as the warrant. This entry produces
    the number the warning implies and can therefore be wrong in a way the warning cannot.'
  - 'KN-FIND-015 / EV-MLKEM-015: an empirical statement of what one pinned estimator says under one
    costing. This entry computes how much of any such statement is the costing, without running the
    estimator.'
  assumptions:
  - Each attack's cost under each considered convention is a linear functional of the six recorded
    primitive counts; a convention pricing anything else falls outside the map and is excluded by
    name.
  - Primitive-count expressions extracted from KN-TECH-039, KN-TECH-040 and KN-TECH-044 are as good
    as those notes and no better; every extraction is quoted with its source line so a later reader
    can re-derive from the note rather than from this record.
  - Internal parameter re-optimisation under a changed convention is a second-order effect for the
    fixed-v map, and its size is not estimated here; it is flagged as an unbounded correction.
  - Shares are computed at stated parameter points, so the share difference is a function of parameters
    and is tabulated as one.
  - No claim follows about which convention is physically correct.
  predictions:
  - metric: number of primitive coordinates whose share difference between primal and dual exceeds
      0.2 in absolute value at the tabulated parameter points
    direction: higher
    minimum_effect: 1
  - metric: sign-stability threshold in the memory-word coordinate, in bits of price change required
      to flip the sign of G
    direction: lower
    minimum_effect: 12
  - metric: spread of G across the three conventions considered, in bits
    direction: higher
    minimum_effect: 4
  - metric: difference between the real attack pair's dominant-coordinate share difference and the
      random-pair null's median
    direction: higher
    minimum_effect: 0.15
  minimal_test:
    design: Zero compute beyond arithmetic, and the whole test fits in one session. Extract v_primal
      and v_dual as symbolic expressions in dimension, blocksize, sample count and k_fft from the
      three named technique notes, quoting source lines. Write the three price covectors. Evaluate
      shares at three parameter points spanning the corpus's recorded range. Compute G at each point
      under each convention, the transport differences, and the six sign-stability thresholds. In
      the same script and from the same code path, evaluate the random-pair null over 1000 draws and
      the forced v_primal = v_dual control. Report the threshold table beside the null's distribution.
      This discriminates because the entire question is whether the primal-dual ordering is a fact
      about the attacks or about the price list, and a threshold small relative to the recorded price
      spread answers it one way while a large one answers it the other. The null prevents reading
      a generic property of log-linear costs as a property of these two attacks.
    controls:
    - 'Random-pair null: primitive-count vectors drawn from the same coordinate ranges with no algorithmic
      meaning, through the identical pipeline in the same invocation.'
    - Forced-degenerate control with v_primal = v_dual, where G must be exactly zero and thresholds
      undefined.
    - 'Adversarial extraction check: every count perturbed by the largest error its source note''s
      stated uncertainty admits, with conclusions re-derived.'
    - 'Convention round-trip: T(c1->c2) composed with T(c2->c1) must be exactly zero.'
    - 'Parameter-point sensitivity: all conclusions re-derived at three parameter points, with any
      point-dependent conclusion reported as point-dependent.'
    required_metrics:
    - share of each primitive coordinate in each attack's total cost, per convention, per parameter
      point
    - share difference vector per convention per point
    - G under each convention per point
    - transport differences T(c1->c2) in bits
    - sign-stability threshold per coordinate in bits
    - random-pair null distribution of dominant share difference
    - round-trip residual of the transport composition
  falsification_conditions:
  - 'Round-trip residual nonzero: the transport map is misderived and the table is void.'
  - 'Forced-degenerate control does not give G = 0: the share computation is wrong.'
  - 'Real-pair thresholds indistinguishable from the random-pair null: the derivation says nothing
    about these attacks and reports a generic property of log-linear costs.'
  - 'A primitive count cannot be extracted with a quoted source line: the derivation returns undetermined
    by available notes with the missing quantity named, which is the honest deliverable and not a
    failure.'
  - 'Conclusions flip under the adversarial perturbation admitted by the source notes'' own stated
    uncertainty: the map is too sensitive to the notes to support any verdict.'
  - 'Every sign-stability threshold exceeds the recorded price spread by a wide margin: the primal-dual
    ordering is convention-robust in the tested set, refuting the entry''s motivating expectation.'
  confounders:
  - The six coordinates are asserted to span the conventions considered; if any convention prices
    something outside them, the map silently omits a term and the thresholds are wrong in an undetected
    direction.
  - 'Extracted counts come from notes marked confidence: reported, so the whole table inherits their
    provenance level.'
  - Re-optimisation makes v depend on p, so the fixed-v map understates or overstates transport by
    an amount this design cannot bound.
  - Shares are parameter-point dependent, so a conclusion drawn at one point may reverse at another;
    three points is a thin sample of the recorded range.
  - The random-pair null's coordinate ranges are chosen, and choosing them widely enough guarantees
    the real pair looks structured while choosing them narrowly guarantees the opposite.
  interpretation_limits:
  - Every conclusion is exact only given the corpus's recorded cost decompositions and inherits any
    error in them; this is a derivation about the notes as much as about the attacks.
  - The fixed-v map is first-order and does not include re-optimisation, whose size is unbounded here.
  - Nothing here says which attack is faster, which convention is right, or anything about ML-KEM,
    FIPS 203 or any deployed system.
  - A convention-robust verdict is robust only across the three conventions actually written down,
    not across conventions in general.
  target_complexity:
    time_exponent: No attack exponent is claimed. The derivation is arithmetic on symbolic expressions
      and costs seconds.
    memory_exponent: No attack memory exponent is claimed. The derivation holds six symbolic expressions
      and three price covectors.
    best_known: No incumbent attack is challenged. The incumbent statement this addresses is KN-TECH-040's
      standing warning that cross-model comparison is meaningless, which the corpus records qualitatively;
      this entry attempts to supply the number that warning implies and is therefore falsifiable where
      the warning is not.
    hidden_overhead: 'Hidden in the lower-order terms: the re-optimisation correction, which is exactly
      the term the linear map cannot carry and which could dominate the transport at any parameter
      point. Hidden in human cost: extracting six primitive counts per attack from notes with quoted
      source lines, and defending that the six span every convention considered, is the bulk of the
      work and the place the derivation is most likely to be quietly wrong.'
  dominated_by: 'n/a (no result claimed). Every dual-attack frontier row this corpus records was checked
    for whether this entry sits on it: KN-FIND-015''s primal versus dual comparison under pinned MATZOV
    costing, KN-FIND-016''s Carrier Table 5.1 arithmetic, KN-FIND-013''s brittleness bound, and IDEA-20260805-a102ec''s
    derived correction. None is a frontier this entry occupies, because the deliverable is a sensitivity
    table for a comparison and not a cost.'
  sota_delta: no attack; conceptual/measurement contribution only. The deliverable is a per-coordinate
    sign-stability threshold table with a round-trip check, an adversarial-perturbation check, and
    a random-pair null distribution beside it.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Three separable parts. (i) That all six primitive counts can be extracted
    from the corpus''s notes with quoted source lines: about 0.55, and failure here is a reportable
    outcome rather than a wasted session, since the missing quantity is named. (ii) That the round-trip
    and forced-degenerate controls pass, i.e. the map is correctly derived: about 0.9, this is elementary
    algebra. (iii) That the real pair''s thresholds are distinguishable from the random-pair null,
    so the table says something about these attacks rather than about log-linear costs generally:
    about 0.4, and I decline to raise it, because the null''s coordinate ranges are a choice and a
    fair choice may well leave the two indistinguishable.'
