idea:
  id: IDEA-20261006-f5d30a
  question_id: RQ-VOLC-f6253b
  title: >-
    Rational 2-torsion kernel counts of y^2 = x^3 + 1 and y^2 = x^3 + x + 1
    over F_13
  class: measurement
  claim: >-
    Over F_13, the cubic x^3 + 1 has roots 4, 10, and 12, so three roots,
    and the cubic x^3 + x + 1 has the single root 7. The absolute gap of
    the two root counts is 2. A recount that returns any other pair of
    counts is a negative. Counting the roots of x^3 + 1 a second time
    has gap 0. Both curves y^2 = x^3 + B and y^2 = x^3 + x + 1 are
    nonsingular because 4 A^3 + 27 B^2 is 1 and 5 in F_13. The nearby
    cubic x^3 - x + 1 has zero roots in F_13; a counter that returns a
    positive count there is wrong. Each root is the x-coordinate of a
    rational point of order 2, hence a kernel of a separable 2-isogeny
    defined over F_13. The claim is this pair of kernel counts. It is
    not a volcano depth, not the root count of the 3-division polynomial
    over F_5, and not an ECDLP operation count.
  mechanism: >-
    Object frame. Representation: the short-Weierstrass cubic, not a
    secret scalar. Operation set: evaluation of x^3 + A x + B at the
    field elements, which lists the rational kernels of separable
    2-isogenies. The projection discards y and the isogeny codomain and
    retains the root count. It is lossy: distinct kernels can share a
    count only by being different roots, and the count itself does not
    name the codomain curve. RQ-VOLC-f6253b asks whether volcano depth
    changes an attack cost. This record measures only the rational
    kernel count that a later depth label would have to start from, at
    one prime, and it does not assign a level or a cost.
  novelty_status: unverified
  citations:
    - ref: KR-IC-1fcdbc
      provenance: internal
      claim: >-
        Characteristic-2 summation-polynomial attacks stay slower than
        rho. The F_13 kernel count is an odd-characteristic census and
        does not contradict that row.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-1fcdbc.yaml
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Isogenous curves share the same number of points. A kernel
        count is not a walk to a weaker curve.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
  assumptions:
    - >-
      A root of x^3 + A x + B in F_13 is the x-coordinate of a point of
      order dividing 2. The identity is not counted as a root. The
      design count was an exhaustive scan of the thirteen field elements.
    - >-
      Nonsingularity is 4 A^3 + 27 B^2 nonzero. The values 1 and 5 were
      computed in this session. A singular model is not a kernel count.
  proof_search_map:
    not_applicable_reason: >-
      This is a recount of two finite sets of field elements, not a
      proof that volcano depth changes an ECDLP cost.
    bottleneck: >-
      The step that decides the gap is the cardinality of the zero set
      of each cubic. The codomain j-invariant is not this cardinality.
    baseline_embedding:
      parameter_slice: F_13, the two named cubics, and the zero-root nearby cubic.
      reproduction_check: >-
        A second independent scan of the thirteen residues returns the
        same three sets of roots.
    observation_collision:
      observable: the root count
      distinct_preimage_search: >-
        The zero-root cubic shows that the count 0 is reachable. If the
        two named counts were equal, the gap claim would fail.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: the two root sets at F_13
        predicted_gain: an absolute gap of 2, or a recount that misses it
    quantifier_order: >-
      The claim is one pair of cubics at one prime. It does not say that
      every j=0 curve has three rational 2-isogenies.
    method_ceiling:
      strongest_certifiable_claim: >-
        The two root counts are 3 and 1, or a recount disagrees. No
        attack cost is certifiable from the counts.
      nearby_object_control: >-
        x^3 - x + 1 over F_13 has no root. A positive count there means
        the scanner is wrong.
    proof_obligations:
      - claim: The gap is the difference of two exhaustive root counts.
        responsibility: correctness
  predictions:
    - metric: absolute difference of the two F_13 root counts
      direction: different
      minimum_effect: the counts are 3 and 1, so the gap is 2
  minimal_test:
    design: >-
      Evaluate x^3 + 1 and x^3 + x + 1 at every element of F_13 and
      record the roots. Repeat the first cubic. Evaluate x^3 - x + 1
      and require the empty set. Do not build an isogeny or a rho walk.
    controls:
      - >-
        Self-count: the first cubic scanned twice has gap 0. A nonzero
        self-gap means the scanner is not a function of the cubic.
      - >-
        Zero-root control: x^3 - x + 1 over F_13 has no root. A positive
        count falsifies the implementation.
      - >-
        Singular refusal: if 4 A^3 + 27 B^2 is 0, do not emit a kernel
        count. Both named models are nonzero.
    required_metrics:
      - the two root lists and their cardinalities
      - the absolute gap
      - the self-count gap
      - the nearby root count
  falsification_conditions:
    - A recount returns any pair of cardinalities other than 3 and 1.
    - The self-count gap is not 0.
    - The nearby cubic x^3 - x + 1 is reported to have a root.
    - A singular model is scored as if it had a kernel count.
  confounders:
    - >-
      Counting projective 2-torsion, which includes the identity, adds
      one to each count and preserves the gap. The claim counts roots,
      not projective points. Mixing the two conventions is a void, not
      a new gap.
    - >-
      A root of multiplicity greater than 1 would still be one field
      element. Neither named cubic has a repeated root in this scan.
  interpretation_limits:
    - >-
      Three rational kernels are not a volcano depth and not a statement
      that endomorphism-ring depth changes an attack cost.
    - >-
      KR-RHO-755e35 says an isogeny walk does not reach a different
      weakness class. This count does not walk.
    - >-
      Toy field only. F_13 does not transfer to a cryptographic prime.
      The discrete-log exponent delta is 0.
  heuristic_assumptions:
    - id: H1
      statement: >-
        No random model is used. The root count is the cardinality of a
        finite set defined by a cubic polynomial over a field of 13
        elements.
      rigorous_support: >-
        A polynomial of degree 3 over a field has at most 3 roots. The
        count is an exhaustive evaluation, not a sample.
      validation_plan: >-
        Scan all 13 residues twice, independently, for each named cubic.
        Comparison distribution: equality of the two root sets, not a
        probabilistic law. Tail check: every recorded root satisfies the
        cubic and every non-root does not, so no residue is left in a tail.
  target_complexity:
    time_exponent: 1/2
    memory_exponent: 1/2
    best_known: >-
      Pollard rho at exponent 1/2. A rational kernel count does not
      change that exponent. KR-IC-1fcdbc, the top frontier-map hit for
      this claim text, is a characteristic-2 summation negative and is
      not this census.
    hidden_overhead: >-
      None is claimed. The work is 13 evaluations of two cubics.
    tradeoff_note: >-
      No time-memory tradeoff is proposed. Rho's collision tradeoff is
      unchanged.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    KR-IC-1fcdbc dominates any reading of this root count as a
    summation-polynomial attack, and that reading is not the claim.
    KR-RHO-755e35 dominates any reading of the kernels as a walk to a
    weaker curve. The discrete-log exponent delta is 0. Opened rows
    that do not dominate the integer gap itself: the root census is
    not a binary-field summation experiment and not an isogeny walk.
    The earlier F_5 count of roots of the 3-division polynomial is a
    different polynomial at a different prime.
  sota_delta: >-
    Prime-field ECDLP time-exponent delta is 0 relative to rho at
    exponent 1/2. Memory-exponent delta is 0. The quantity that is
    claimed to differ is the number of F_13-roots of x^3 + 1 versus
    x^3 + x + 1, which is 3 versus 1.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-1fcdbc
      - KR-RHO-755e35
    nearest:
      - ref: KR-IC-1fcdbc
        provenance: internal
        relation: orthogonal
        delta: >-
          Top frontier-map hit for the claim text. The row is a
          characteristic-2 summation negative. This idea is an
          odd-characteristic root count. Exponent delta 0. It adds the
          pair of cardinalities 3 and 1 at F_13, which that row does
          not record.
      - ref: KR-RHO-755e35
        provenance: internal
        relation: orthogonal
        delta: >-
          The row says isogenous curves are equally hard. The kernel
          count does not choose a codomain and does not change the
          exponent. Exponent delta 0.
    searched:
      corpus_grep:
        - ledger/proposals on origin/main for this root-count claim
        - pull requests 1928 and 1929, which record a 3-division root gap over F_5 and do not record this F_13 pair
      web: []
      blocked:
        - No primary paper on volcano depth was opened. Novelty stays unverified.
  status: proposed
  added: '2026-10-06'
  approved_by: null
