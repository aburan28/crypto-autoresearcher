idea:
  id: IDEA-20260808-2e14f7
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  title: Coordinate-degree optimisation for the factor base — the window may be taken in ANY
    degree-d map E -> P^1, which changes both the summation relation's Newton polytope and
    the fibre monodromy from C_2 to S_d, escaping the universality closure that is stated
    only for the x-coordinate cover.
  class: representation
  claim: 'Every prime-field decomposition record in this corpus takes the factor base to be
    defined by the x-coordinate, i.e. by the degree-2 map E -> E/{+-1} = P^1, and KN-FIND-a1f3c2''s
    monodromy universality (C_2^{m-2}, no exceptional locus) is a statement about THAT cover.
    For any effective divisor class of degree d >= 2 on E there is a degree-d map u_D : E
    -> P^1, and a window W in P^1 of size B defines a factor base V = u_D^{-1}(W) of about
    d*B points. The resulting "generalised summation relation" — eliminate the points from
    u_D(P_1), ..., u_D(P_m) subject to P_1 + ... + P_m = R — has a Newton polytope and a per-variable
    degree determined by d and by the class, and a fibre monodromy contained in S_d rather
    than in C_2. THE CLAIM: (i) the pair (Newton polytope, monodromy) is a genuine function
    of the chosen map and is not covered by KN-FIND-a1f3c2, which quantifies only the d =
    2 case; (ii) the small-root reach eps of E1-01 is therefore a function of the map and
    can be optimised over the moduli of degree-d maps; and (iii) yield is untouched (KN-FIND-007
    mean is exact for any factor base of the same size), so this is a pure solve-stage design
    lever, the only kind the corpus''s closures leave open.'
  mechanism: 'A degree-2 map forces the addition relation to be biquadratic (the Kummer/biextension
    structure) and forces per-variable degree 2^{m-1} after elimination. A degree-3 map, e.g.
    the y-coordinate of a short Weierstrass model or the map attached to |3(O)|, has fibres
    of size 3, so a window of size B yields about 3B points, and elimination produces a system
    with different degrees. Higher d gives larger fibres per window element, i.e. more factor
    base per unit of "archimedean budget" B, which is exactly the currency that constrains
    small-root reach: reach limits the product of the BOUNDS, and the fibre multiplicity d
    buys factor-base size that does not consume bound budget. That is a genuinely different
    trade from anything in E1-01, and it is the reason to look at d > 2.'
  why_not_a_renamed_known_approach: 'Not the curve-model line (RQ-MODEL-e61cb2, IDEA-20260807-a575c8
    / 8027a2 / dadcd2): those classify DEGREE-2 maps and show every such model is a Moebius
    reparameterisation of the Kummer line, hence neutral. That classification is exactly why
    d > 2 is the untouched part of the same moduli problem, and this record is the complement
    of theirs, not a restatement. Not KN-FIND-a1f3c2: that finding''s C_2^{m-2} is the monodromy
    of the degree-2 cover; a degree-d cover has a different Galois group, so the universality
    claim does not extend by its own terms. Not KN-FIND-007: yield is invariant and no yield
    claim is made.'
  predictions:
  - observable: fibre multiplicity and factor-base size per window element
    metric: '|V| / |W| for d = 2, 3, 4 at matched window size, toy p'
    predicted: about d (times the rationality factor), so the same bound budget buys d times
      the factor base — this is the mechanism's only free lunch and must be measured, not
      assumed
  - observable: per-variable degree of the eliminated relation
    metric: degree of the generalised summation polynomial for d = 3, m = 3, computed symbolically
    predicted: strictly larger than the d = 2 value 4; the question is by how much, and whether
      the d-fold size gain outruns the degree loss in the reach formula
  - observable: fibre monodromy
    metric: Galois group of the degree-d cover over F_p(x_2, ..., c), computed for d = 3
    predicted: S_3 or A_3 generically, i.e. NOT contained in C_2^{...}; a C_2-type answer
      would mean the degree-d cover degenerates and the escape from KN-FIND-a1f3c2 fails
  - observable: net reach
    metric: eps-hat(d) measured by planted-root recovery at matched |V|
    predicted: non-monotone in d with a maximum at small d; if eps-hat(3) > eps-hat(2) the
      lever is real and E1-01's threshold table must be recomputed per d
  minimal_test: 'Symbolic first, no compute: construct the degree-3 summation relation for
    m = 3 using the y-coordinate (or |3(O)|) and record its per-variable degree and Newton
    polytope; compute the monodromy of the degree-3 cover at a handful of toy curves by factoring
    the fibre polynomial over F_p and reading cycle types. Then, only if the polytope is competitive,
    measure eps-hat(3) against eps-hat(2) at matched |V| on the E1-01 harness.'
  controls:
  - 'Matched-|V| control (not matched-window control): the d-fold fibre gain must not be double-counted
    as both more factor base and a bigger window.'
  - Degree-2 arm as the reference, run in the identical harness.
  - 'Random-subset null of size |V|: recovery must fail.'
  - 'Yield control: measured decompositions per target must match the KN-FIND-007 mean for
    both arms; a difference means the factor base sizes were mismeasured.'
  confounders:
  - Rationality: a degree-d fibre over an F_p-point of P^1 contains between 0 and d rational
      points, so |V| fluctuates; use measured |V|.
  - For d = 3 with the y-coordinate, the map is not Galois, so "monodromy" must be computed
    as the Galois group of the Galois closure, not of the cover.
  - Degree-d maps for d >= 4 may factor through a degree-2 map (u = f(x)), in which case the
    construction collapses to the Kummer case; primitivity of the map must be checked.
  falsification_conditions:
  - The degree-3 relation's per-variable degree grows fast enough that eps-hat(3) < eps-hat(2)
    at matched |V| => the lever is negative and d = 2 is optimal, which usefully completes
    the moduli classification the RQ-MODEL lane began.
  - Every primitive degree-d map is found to factor through the Kummer quotient => the family
    is empty and the record closes with that as the obstruction.
  - The degree-3 monodromy comes out inside C_2^{...} => KN-FIND-a1f3c2 extends further than
    its stated scope, which is itself a finding worth recording.
  interpretation_limits: This changes the SOLVE stage only. It cannot change yield, and it
    does not by itself give any exponent; it supplies a parameter d to E1-01's threshold.
    Toy monodromy computations at a handful of curves are toy and cannot establish universality
    either way.
  assumptions:
  - E/F_p ordinary; degree-d maps arising from effective divisor classes of degree d.
  - Elimination performed by resultants as for Semaev polynomials.
  heuristic_assumptions:
  - id: HA-1
    statement: For a primitive degree-d map and a window W of size B, the number of rational
      points in u_D^{-1}(W) is d*B*(1 + O(B^{-1/2})), i.e. fibres are rational at the generic
      rate.
    rigorous_ingredient: Chebotarev/Frobenius equidistribution for the Galois closure of the
      cover, with error controlled by the Weil bound for the associated curve.
    distribution_imitated: Equidistribution of Frobenius cycle types over a degree-d cover,
      the same statement that gives the 1/2 rationality rate for the x-coordinate map.
    validation_route: 'Toy p in [2^18, 2^26]: count |u_D^{-1}(W)| for 10^3 random windows
      at d = 2, 3, 4 and compare against d*B. Label toy.'
    tail_checks: The empirical cycle-type distribution must match the Galois group's, which
      is also the monodromy measurement; a mismatch invalidates both.
  target_complexity:
    time_exponent: No exponent by itself. It supplies d to E1-01, whose threshold eps > m/(2(m-1))
      is then evaluated per d; a d with larger eps at matched |V| lowers the achieved exponent
      by exactly the E1-01 formula.
    memory_exponent: '"N^{beta} with beta = log_N |V|, unchanged in form."'
    best_known_baseline: '"rho N^{1/2}, memory O(1)."'
    hidden_overhead_disclosure: Constructing and evaluating a degree-d map costs polylog but
      with constants growing in d; the S_d-fold sign/branch ambiguity costs d^{m} per candidate
      rather than 2^{m-2}, which is charged and is a real constant-factor tax that grows with
      d.
    time_memory_tradeoff: '"Same as E1-01; memory is the factor base."'
  sota_delta: Zero directly; it is a parameter supply for E1-01 and a scope correction to
    KN-FIND-a1f3c2. Its independent value is that it is the only design lever left after the
    corpus's closures, since it acts on the solve and not on the yield.
  dominated_by: "Pollard rho / vOW at N^{1/2}, memory O(1), dominates every current instance.\
    \ Frontier rows checked: >-\n  rho/vOW, BSGS, Kuhn-Struik multi-target, preprocessing\
    \ frontier, special-curve\nattacks (out of scope)."
  estimated_cost: '"Implementation medium (generalised summation relations for d = 3); compute
    low."'
  recommended_priority: medium
  honest_prior_of_survival: ~0.6 that the degree-3 relation is constructible and its monodromy
    escapes C_2 as stated. ~0.15 that eps improves at matched |V|. ~0.05 that the improvement
    is enough for E1-01.
