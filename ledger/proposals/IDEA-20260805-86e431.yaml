idea:
  id: IDEA-20260805-86e431
  question_id: RQ-AES-003
  goal_id: GOAL-AES-003
  added: '2026-08-05'
  title: >-
    Read the whole number, not three bits of it: an exact cipher-free surrogate
    for the campaign's 5-round coset-collision count, and the mean-shift /
    dispersion statistics it licenses as a data-path distinguisher test at r=6
  class: mechanism

  claim: >-
    The campaign's r=5 structural object measures an integer n_5 near 2^31 and
    reports only n_5 mod 8 -- roughly 3 bits of an approximately 31-bit
    measurement, discarding the rest. THE DISCARDED PART IS EXACTLY COMPUTABLE.
    The count5 derivation (BATCH-001, section 3.5) reduces the r=5 collision
    condition to sum over columns of g_col(a_col, a'_col) = 0 with
    g_col(a, a') = G_col(a) XOR G_col(a'), where
    G_col(a)[i] = MC[i][t_i] * S(b_col[t_i] XOR a * v_col[t_i]),
    t_i = (col - j0 + i) mod 4. Because g_col SPLITS as a XOR of a one-argument
    function, the condition is H(A) = H(A') for the single map
    H(a_0,a_1,a_2,a_3) = XOR_col G_col(a_col) on (F_2^8)^4, and therefore
      n_5(K, b, j0, M) = sum_v C(m_v, 2),  m_v = |H^{-1}(v)|,  EXACTLY,
    for every key, base, excluded index and mixing matrix. The consequences,
    each a proposal and none a result:
    (1) n_5 is computable with NO CIPHER CALL beyond two rounds on one text --
    four 256-entry tables and a 2^32 XOR-and-count -- turning a 3-bit-per-trial
    residue confirmation into an EXACT approximately-31-bit forced value per
    trial, and giving the cross-instrument anchor the campaign's own next_action
    ranks third as an ANALYTIC identity rather than a third engine.
    (2) Because H is built from the S-box, the exact value DEPENDS ON THE S-BOX
    even though the mod-8 residue does not. This is the only route on the record
    that recovers AES-specific content from the object DEC-20260802-9bda5c
    ruling 3 correctly scoped as following "from round geometry alone".
    (3) The same exact-value reading, applied at r=6 where nothing is forced,
    gives a data-path statistic with a stated resolution -- a single 2^32 arm
    resolves 2^-15.5 of the count, K arms resolve 2^-15.5 / sqrt(K) -- and a
    matched 10-round-AES permutation control at identical data complexity. If a
    mean shift or a dispersion excess survives at r=6 against that control, that
    is completion criterion C3 for a data-path object; if it does not, the
    campaign gets a MEASURED bound in bits where it currently has the word
    "dead". NEITHER OUTCOME IS ASSERTED HERE.

  object_first_candidate:
    tracked_object: >-
      THE EXACT INTEGER n_r(K, b, j0, M) -- the number of unordered plaintext
      pairs in a full 2^32 diagonal coset whose r-round ciphertexts agree on the
      inverse-ShiftRows diagonal ID_{j0} -- together with its cipher-free
      surrogate, the fibre-size multiset {m_v} of the four-table XOR map
      H(A) = XOR_col G_col(a_col). The campaign's tracked object is the residue
      n_r mod 8; this proposal's tracked object is the number itself and its
      derivable predictor.
    established_families_off_limits: >-
      Off-limits as the PRIMARY lens, per RQ-AES-003: differential and truncated
      differential; linear and multidimensional linear; integral / square /
      division property; impossible differential; meet-in-the-middle and
      Demirci-Selcuk; boomerang and retracing boomerang; biclique; algebraic
      (XSL-family) and Groebner; yoyo; mixture differential / exchange; subspace
      trail; partial sums as a cost reorganisation.
      HOW THIS PROPOSAL STAYS OUT OF THEM, STATED RATHER THAN ASSERTED. The
      object is not a differential: no difference is fixed, chosen or tracked,
      and the statistic is a COLLISION COUNT of a projection of a whole coset,
      i.e. a property of the image PARTITION. It is not an integral: no sum over
      a set is taken and no balance is tested; n_4 = 0 is a bijectivity
      statement, not a zero-sum. It is not a subspace trail: the subspace trail
      is INPUT to the campaign's own derivation and this proposal changes the
      READOUT, not the trail. The genuinely new element is the readout precision
      and the surrogate, and neither is an attack lens at all.
    newness_score: >-
      The factorisation g_col(a,a') = G_col(a) XOR G_col(a') is one line and
      follows immediately from the campaign's own committed section 3.5, which
      states g in the two-argument form and stops there. It is very probably
      elementary and known outside; under RQ-AES-003 R3 that recollection may
      neither promote nor dismiss it. What is checkably absent HERE is any
      record that computes n_5 without the cipher, any record that reads the
      exact value of any n_r, and any record that states this object's
      resolution in bits.
    testability_score: >-
      Extremely high, and stage 1 is decisive at near-zero cost: the surrogate
      either reproduces at least seven committed r=5 integers TO THE DIGIT or it
      does not. An exact match on a 31-bit integer is not a curve resembling a
      curve.
    survival_score: >-
      The surrogate's exactness survives to r = 5 and NOT to r = 6, by the
      campaign's own section 3.6: at r = 6 round 3 mixes across columns and the
      per-column decomposition fails. That is a boundary this proposal states
      up front and does not try to talk past. What survives to r = 6 is only the
      EMPIRICAL exact-value statistic and its matched control -- weaker, and
      labelled weaker.

  mechanism: >-
    DERIVED IN-REPO, FROM COMMITTED ARTIFACTS. Sources read: the frozen
    pre-registration
    coordination/goals/GOAL-AES-003/batches/BATCH-001/tasks/count5/PREREGISTRATION.md
    sections 2, 3.1-3.6; its raw.jsonl; and
    coordination/goals/GOAL-AES-003/batches/BATCH-002/tasks/TASK-20260802-142a4b/cnt.c
    with its raw.jsonl. No external source was read and none is cited.

    STEP 1 -- THE COMMITTED SETUP, RESTATED, NOT RE-DERIVED. V is the full 2^32
    coset of the plaintext diagonal D_0. After round 1 the state set is a full
    coset of the column space C_0; after round 2 it is a full coset of
    M_0 = MC(SR(C_0)), and by section 3.2 column m of that state is
      w[:, m] = b_m XOR a_m * v_m,   v_m = MC[:, (-m) mod 4],
    with the four free bytes a_m ranging independently over GF(2^8). So
    A = (a_0, a_1, a_2, a_3) parameterises the coset bijectively, and A is a
    bijective relabelling of the plaintext.

    STEP 2 -- THE COMMITTED r=5 CONDITION. Section 3.5: the r=5 collision
    condition on ID_{j0} is
      sum_col g_col(a_col, a'_col) = 0 in GF(2^8)^4,
      g_col(a, a')[i] = MC[i][t] * f_{col,t}(a, a'),  t = (col - j0 + i) mod 4,
      f_{col,t}(a, a') = S(b_col[t] XOR a*v_col[t]) XOR S(b_col[t] XOR a'*v_col[t]).

    STEP 3 -- THE FACTORISATION, WHICH IS THE NEW LINE. f is a XOR of two
    one-argument terms, and multiplication by a fixed GF(2^8) constant is
    F_2-linear, hence distributes over XOR. Therefore
      g_col(a, a') = G_col(a) XOR G_col(a'),
      G_col(a)[i] := MC[i][t_i] * S(b_col[t_i] XOR a * v_col[t_i]),
                     t_i = (col - j0 + i) mod 4.
    Substituting, the condition sum_col g_col = 0 becomes
      XOR_col G_col(a_col) = XOR_col G_col(a'_col),  i.e.  H(A) = H(A').
    So the set of colliding pairs of the r=5 cipher restricted to V is EXACTLY
    the set of colliding pairs of the four-table XOR map H, and
      n_5 = sum_v C(m_v, 2) = (sum_v m_v^2 - 2^32) / 2,  m_v = |H^{-1}(v)|.
    NO CIPHER IS INVOLVED. H needs only the 16 bytes b of the round-2 coset base
    (two rounds of encryption on one text, or equivalently the first three round
    keys), the four MixColumns columns v_m, and the S-box.

    STEP 4 -- WHY THIS RECOVERS THE MOD-8 RESULT AS A COROLLARY AND STRICTLY
    MORE BESIDES. The section-3.5 orbit argument reappears as the invariance of
    H's fibres under exchanging coordinates between A and A', so n_5 = 0 mod 8
    follows from the same identity. But the identity determines the whole
    integer, not the residue: 31 bits per trial rather than 3. Under the
    campaign's own frozen decision rule an agreeing mod-8 trial costs the null
    8^-1; an EXACT agreement on a value near 2^31 whose null spread is about
    2^15.5 costs roughly 2^-15.5 per trial, so ONE exact trial is worth about
    five mod-8 trials, and a dozen exact trials are worth more than the entire
    committed r=5 grid.

    STEP 5 -- THE COST BOOKKEEPING, PER-ATTEMPT COST TIMES INVERSE SUCCESS
    PROBABILITY. Surrogate: build 4 tables of 256 32-bit words (about 2^11
    S-box calls), then 2^32 iterations of three XORs, one table read and one
    increment into a 2^32-entry uint8 occupancy array (4 GiB, inside the
    measured 15 GB envelope; max occupancy 12 was observed in the committed
    r=5 arm, so uint8 does not saturate -- an explicit guard is still required
    because saturation VOIDED the campaign's r=3 control once already). Success
    probability 1: it is a deterministic computation. Measured comparators from
    committed receipts: the BATCH-002 soft T-table engine took 549.69 s for one
    2^32 r=5 configuration; the AES-NI path is reported at 53 s per 2^32 sweep
    (MEAS-GOAL-AES-002-002, a dispatching-session measurement, not independently
    validated). The surrogate does strictly less work per input than either.

    STEP 6 -- THE NULL, FORCED AND EXACT. For a map from 2^32 inputs into 2^32
    values behaving as a uniform random function,
      E[n] = C(2^32, 2) / 2^32 = (2^32 - 1)/2 = 2147483647.5,
      sd[n] = about sqrt(E) = 46341 = 2^15.50,
    so a single full-coset arm resolves a relative deviation of 2^-15.50, and K
    independent arms resolve 2^-15.50 / sqrt(K). A 10-round AES permutation at
    the same data complexity is the matched control and its exact value is a
    MEASUREMENT, not a derivation. STATING THIS RESOLUTION IN BITS IN THE SAME
    SENTENCE AS ANY CLAIM IS MANDATORY UNDER RQ-AES-003 R4(1), and this object
    is the one place in the campaign where the resolution is good: 2^-15.5 per
    arm against the influence probe's 2^-8.8.

    STEP 7 -- WHAT THE COMMITTED DATA ALREADY SHOWS WHEN READ THIS WAY.
    ARITHMETIC PERFORMED BY THIS PROPOSING SESSION ON COMMITTED INTEGERS FROM
    BATCH-001 count5/raw.jsonl. IT IS NOT A RUN, IT IS NOT EVIDENCE, IT IS NOT
    INDEPENDENTLY REPRODUCED, AND STAGE 1 RECOMPUTES IT.
      Seven AES r=5 arms:  2147430696, 2147459328, 2147193296, 2147610584,
                           2147427792, 2147022152, 2147144880
      deviations from 2147483647.5: -52952, -24320, -290352, +126937, -55856,
                           -461496, -338768;  mean -156686
      empirical sample sd 209292;  dispersion index Var/E = 20.4 against the
                           uniform-null value 1.
      Two AES r=6 arms: 2147492183, 2147448644 -> deviations +8536, -35004,
                           mean -13234.
      One 10-round-AES control arm: 2147422794 -> deviation -60854.
      One forward-diagonal sibling arm at r=5: 2147467586 -> deviation -16062.
      One independent-round-key null at r=5: 2147660512 -> deviation +176865.
    READ HONESTLY: on the EMPIRICAL scale the r=5 mean shift is about -2.0
    standard errors at K = 7 and is NOT significant; the dispersion excess
    (20.4 against 1) is the larger effect and is itself only about a factor 3
    above the value 8 that a naive orbit-of-8 model would give. NOTHING IS
    CLAIMED FROM THESE NUMBERS. What they establish is that the exact-value
    channel is not empty and that K = 7 with unverified arm independence cannot
    settle it -- which is precisely the design input for the experiment.
    CONFOUND NAMED IMMEDIATELY: the seven arms vary j0 and it is NOT established
    from the committed fields that they use independent keys and bases; the
    records carry rk_sha256 and base, and establishing independence from those
    is a Stage-1 obligation, not an assumption.

    STEP 8 -- WHERE THE SURROGATE STOPS, STATED BEFORE IT IS TESTED. At r = 6
    the condition pulls back through TWO full rounds and, by the campaign's own
    section 3.6, round 3 mixes across columns so neither the per-column
    decomposition nor the free-inactive-column factor survives. THE SURROGATE
    DOES NOT EXTEND TO r = 6 AND THIS PROPOSAL DOES NOT CLAIM IT DOES. At r = 6
    only the empirical exact-value statistic remains, measured against a matched
    permutation control. That asymmetry is the honest shape of the proposal:
    an exact derivation at r = 5, an instrumented measurement with a stated
    resolution at r = 6.

  novelty_status: unverified

  literature_context:
    - >-
      NO EXTERNAL SOURCE READ. Every step above is derived from committed
      in-repository artifacts. Under RQ-AES-003 R3 no claim of novelty or
      non-novelty against the published reduced-round frontier is made in either
      direction, and this record must not be cited as either.
    - >-
      RECALLED, UNVERIFIED, AND EXPLICITLY NOT USED TO PROMOTE OR DISMISS: this
      session's model recalls that a "multiple-of-8" property of 5-round AES and
      a mixture/exchange structure on diagonal cosets exist in the public
      literature. That recollection is a CANDIDATE TO CHECK, never an authority.
      R3 forbids using it to downgrade the campaign's r=5 result and equally
      forbids using its absence to upgrade this proposal. It is recorded here
      only so that a reviewer knows it was in the proposing session's head and
      was not permitted to act.
    - >-
      MEASURED IN THIS SESSION AND IN TENSION WITH RQ-AES-003's provenance
      block, reported rather than resolved: the scouting sweep merged into this
      session's ANGLE-BRIEF reports arXiv and ePrint ABSTRACT endpoints
      returning HTTP 200 through this harness's proxy, while RQ-AES-003
      provenance states those hosts are unreachable and DEC-20260731-011 enacted
