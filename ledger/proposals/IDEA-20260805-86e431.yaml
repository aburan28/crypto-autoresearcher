  lossy_projection_identifiability_audit:
    projection: >-
      Full 128-bit ciphertext of each of 2^32 texts (2^32 x 128 bits) --> the
      4-byte inverse-ShiftRows diagonal (2^32 x 32 bits) --> the fibre-size
      multiset {m_v} --> the single integer n_r --> (campaign) the residue
      n_r mod 8.
    what_is_discarded: >-
      At the first arrow, 96 of 128 ciphertext bits per text. At the second, the
      identity of every text and the identity of every bucket -- only the
      multiset of fibre sizes remains. At the third, everything about the
      multiset except one symmetric function. At the FOURTH -- the one this
      proposal declines to take -- about 28 of the roughly 31 bits of that
      function.
    why_genuinely_lossy: >-
      Severely lossy at every arrow and demonstrably so: the fibre over an
      observed n_r contains an astronomically large set of ciphertext families.
    why_compatible_with_the_operations: >-
      This is where the object earns its place, and it is a derivation rather
      than an assertion. The projection to ID_{j0} is compatible with the round
      function precisely because the final round of the C1 convention omits
      MixColumns, so c XOR c' in SR(C_J) is equivalent to y XOR y' in C_J, and
      byte-alignment lets the condition pull back through the byte-wise
      SubBytes. The campaign's own section 2.1 records that GATE-RR78-1 chose
      the incompatible projection M_J and thereby measured a statistic that did
      not pull back at all. The retained part therefore propagates
      DETERMINISTICALLY, which is exactly the lossy-projection requirement, and
      the surrogate H is the propagation written down in closed form.
    is_it_only_a_change_of_coordinates: >-
      CHECKED IN BOTH DIRECTIONS, AND THE ANSWER DIFFERS BY ARROW.
      Arrow 1-3: NOT a change of coordinates. The plaintext-to-A relabelling IS
      a change of coordinates and is used as such and claimed as nothing more;
      the projection to a 32-bit readout of a 128-bit state is not invertible
      and the (Delta, Pi) = (x XOR y, x*y) char-2 failure does not arise, since
      no pair is recoverable from a fibre size.
      Arrow 4 (mod 8): this is where the MIRROR failure bites, and it is the
      failure this proposal names. The residue is not constant across instances
      -- a null arm reads 2, 4 or 7 -- so it is not literally information-free;
      but it is constant across the AES arms BY THEOREM, which means it carries
      exactly the 3 bits of "the theorem is true" and nothing about the key, the
      S-box or the round count beyond the round at which the theorem stops. That
      is a comparator with almost no spread, and it is why 28 bits per trial
      were being thrown away.

  assumptions:
    - >-
      That the committed section 3.5 condition is stated correctly. The
      factorisation is a one-line consequence OF THAT STATEMENT; if the
      statement is wrong the surrogate is wrong. Stage 1's exact reproduction
      test is precisely the check, and its failure would implicate the
      derivation, not the surrogate.
    - >-
      That cnt.c and count5.c compute what their comments say. The surrogate is
      an INDEPENDENT third derivation, so a disagreement localises to one of the
      three rather than being ambiguous -- which is the whole value of it as a
      cross-instrument anchor.
    - >-
      That the seven committed r=5 arms are independent enough to average. NOT
      ASSUMED -- flagged as a Stage-1 obligation to establish from rk_sha256 and
      base, with the honest possibility that some are the same ciphertext set
      read at different j0, which EV-AES-d8a13e already records happening once
      in BATCH-002.

  proof_search_map:
    bottleneck: >-
      The readout. Every r=5 and r=6 statement in this campaign is bottlenecked
      on a 3-bit-per-trial residue, and the frozen decision rule prices 20
      agreeing trials at 8^-20 = 2^-60 while a single exact trial is worth about
      2^-15.5 and is already paid for. The bottleneck is not compute and not the
      cipher; it is that the number was never read.
    baseline_embedding:
      parameter_slice: >-
        r = 4 and r = 3 reproduce the campaign's exact positive controls: the
        surrogate at r = 4 must return n_4 = 0 (H injective) and the r = 2 / r =
        3 exact predictions 9223372034707292160 and 36028794871480320 must be
        reproduced by the measuring engine. These are exact integer identities
        with 55 and 63 significant bits, committed and independently
        re-measured by the BATCH-001 validator.
      reproduction_check: >-
        SYMBOLIC PLUS FROZEN FIXTURE. Symbolically, at r = 4 the condition is
        a_m = a'_m for all m, so H is injective and n_4 = 0; the surrogate must
        return that without special-casing. As a fixture, the surrogate must
        reproduce each committed r=5 integer EXACTLY. A near miss is a failure:
        the prediction is an equality, not a fit.
    observation_collision:
      observable: >-
        n_r mod 8 (the campaign's observable) versus n_r itself (this
        proposal's).
      distinct_preimage_search: >-
        A COLLISION IN THE CAMPAIGN'S OBSERVABLE IS ALREADY COMMITTED AND IS THE
        ARGUMENT FOR CHANGING IT. The independent-round-key null arm (PR-D) and
        the AES arms BOTH read residue 0 at r = 5 -- as the derivation requires,
        since it uses no key-schedule property -- so the residue cannot separate
        "AES-128 with its real key schedule" from "eleven independent uniform
        round keys". DEC-20260802-9bda5c ruling 3 records the wider collision:
        uniformly random bijective S-boxes reproduce both properties at 120/120,
        so the residue cannot separate AES's S-box from a random bijection
        either. The exact value CAN separate them in principle, because H is
        built from the S-box; whether it does at achievable K is the experiment.
        Two ground-truth objects on opposite sides of "is this about AES" share
        the campaign's observable; that is a direct identifiability falsifier
        for any AES-specific reading of the mod-8 result, and it is already
        recorded as a scoping ruling.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the r=5 statistic from "collision count of a 5-round cipher on a
          coset" to "collision count of a XOR of four 256-entry tables", where
          the hypothesis is an exact integer equality rather than an
          approximate agreement. Encoding: A parameterises the coset bijectively.
          Completeness: every colliding cipher pair is a colliding H pair.
          Soundness: and conversely, by the same equivalence. Transfer: the
          equivalence is proved at r = 5 and DECLARED UNPROVED at r = 6.
          Cost loss: none; the surrogate is cheaper than the cipher.
        predicted_gain: >-
          A per-trial forced value worth about 31 bits instead of 3, a cipher-
          free cross-instrument anchor, and an S-box-sensitive reading of an
          object currently scoped as S-box-independent.
      - transform: stronger_compositional_invariant
        proposed_object: >-
          Retain the whole fibre-size multiset {m_v} -- the occupancy histogram
          cnt.c already prints -- rather than the single symmetric function n.
          More state than the conclusion needs, which is the point.
        predicted_gain: >-
          A second, independent family of statistics (higher moments of the
          histogram) available at zero extra measurement cost, each with its own
          forced Poisson value. Whether any of them separates r=6 from the
          control is exactly what is unknown and is measured, not claimed.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER AND NO WEAKER ONE: THERE EXISTS one closed form
      (the surrogate H, fixed, parameter-free once the key and j0 are given)
      such that FOR ALL keys K, bases b, excluded indices j0 and admissible
      mixing matrices M, the computed n_5 equals the measured n_5 exactly. The
      witness H may depend on (K, b, j0, M) only through the stated inputs and
      may NOT be re-fitted per instance. The weaker order -- FOR ALL instances
      THERE EXISTS a formula -- is trivially satisfiable and is explicitly NOT
      claimed and NOT admissible.
      SEPARATELY, AND WEAKER BY DESIGN: at r = 6 nothing is claimed FOR ALL
      instances. The r=6 statement is a statement about a POPULATION MEAN over a
      declared sampling distribution of keys and bases, and it will be written
      that way or not at all.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: (i) an exact, cipher-free predictor of n_5 for the AES-shaped
        SPN family at the tested mixing matrices, validated on a declared number
        of instances; (ii) a MEASURED bound, in bits, on any mean shift or
        dispersion excess of n_6 relative to a matched 10-round permutation
        control at 2^32 data. It CANNOT certify that no r=6 distinguisher
        exists -- that would be a universal impossibility claim, forbidden by
        RQ-AES-003 R6 -- and it cannot certify anything about full-round AES.
        It moves NO exponent.
      nearby_object_control: >-
        TWO, BOTH BUILDABLE AND BOTH REQUIRED. (a) THE OBJECT WHERE THE HOPED-FOR
        CONCLUSION IS KNOWN FALSE: the same coset and projection under 10-round
        AES-128, which the campaign already uses as a permutation surrogate and
        which must show no mean shift and dispersion index 1. If the r=6
        statistic cannot be separated from this object, the method has not found
        the load-bearing structure and no r=6 claim may be made. (b) THE OBJECT
        WHERE THE S-BOX IS REPLACED BY A UNIFORM RANDOM BIJECTION, which
        DEC-20260802-9bda5c ruling 3 established reproduces the mod-8 property
        at 120/120. The surrogate predicts a DIFFERENT exact value there while
        predicting the SAME residue. That pair is the sharpest available test of
        whether the exact-value channel carries S-box information at all, and it
        costs one extra table build.
    proof_obligations:
      - claim: "g_col(a,a') = G_col(a) XOR G_col(a'), from committed section 3.5."
        responsibility: correctness
      - claim: "n_5 equals the collision count of H, exactly, for all inputs."
        responsibility: correctness
      - claim: "The surrogate reproduces every committed r=5 integer to the digit."
        responsibility: baseline
      - claim: "n_4 = 0 follows from injectivity of H; surrogate returns it unforced."
        responsibility: baseline
      - claim: "E[n] = (2^32-1)/2 and sd = 2^15.50 for the uniform-random-map null."
        responsibility: correctness
      - claim: "Occupancy counters cannot saturate; a saturation guard is present."
        responsibility: runtime
      - claim: >-
          The surrogate does NOT extend to r = 6 and no r=6 statement is
          derived from it; r=6 conclusions are population statements only.
        responsibility: scope
      - claim: >-
          The surrogate requires the key (via the round-2 coset base) and is
          therefore an INSTRUMENT, never an attack; it recovers nothing.
        responsibility: scope

  predictions:
    - metric: >-
        Number of committed BATCH-001 and BATCH-002 r=5 arms whose exact n_5 the
        cipher-free surrogate reproduces to the digit
      direction: higher
      minimum_effect: >-
        ALL OF THEM. Forced value: exact equality on every arm, at least 7 arms
        from count5/raw.jsonl plus the BATCH-002 soft-engine arm
        n = 2147411968 under mixing matrix 00030101010203010101020303010102.
        A SINGLE MISMATCH falsifies the factorisation or implicates one of the
        three engines, and either is a first-class result.
    - metric: >-
        Surrogate reproduction of the independent-round-key null arm (PR-D) at
        r=5, n = 2147660512
      direction: different
      minimum_effect: >-
        EXACT. This arm is the sharpest single test because it changes the key
        schedule while leaving the derivation's hypotheses intact; the surrogate
        must hit it exactly with no special case.
    - metric: >-
        Surrogate wall clock per 2^32 configuration, measured, against the
        committed soft-engine 549.69 s for the same object
      direction: lower
      minimum_effect: >-
        Below 180 s, i.e. at least a 3x reduction, with measured peak RSS below
        6 GiB. Stated as a floor rather than a hope; the surrogate performs
        strictly fewer operations per input than the T-table engine.
    - metric: >-
        Exact-value separation between the AES S-box and a uniform random
        bijective S-box at r=5, same key, base, j0 and mixing matrix
      direction: different
      minimum_effect: >-
        The two surrogate outputs must DIFFER (they are different maps H), while
        both residues mod 8 must be 0. Predicted |difference| of order the null
        sd, about 4.6e4, i.e. far above zero. If the exact values coincide, the
        exact channel carries no more S-box information than the residue and
        this proposal's consequence (2) is FALSIFIED at zero compute.
    - metric: >-
        Mean deviation of n_6 from (2^32-1)/2 over K >= 24 independent
        (key, base, j0) arms, minus the same statistic for a matched 10-round
        AES control at K >= 24 arms and identical 2^32 data complexity
      direction: different
      minimum_effect: >-
        PRE-REGISTERED DECISION VALUE: |difference| > 4 * combined standard
        error, where the standard error is estimated EMPIRICALLY from the arms
        (not from the Poisson model, which the committed r=5 arms already
        suggest under-states the spread by an order of magnitude). At K = 24 and
        an empirical per-arm sd of 2.1e5 the resolution of the difference is
        about 6.1e4, i.e. 2^-15.1 of the count. NULL PREDICTION: no difference.
        A difference at this threshold, with the round-count decay check and the
        sibling null below, is completion criterion C3 for a data-path object at
        r = 6. NO SUCH DIFFERENCE IS PREDICTED OR CLAIMED HERE.
    - metric: >-
        Dispersion index D_r = Var(n_r)/E[n_r] across the arm population, at
        r = 5, 6, 7 and at the 10-round control
      direction: lower
      minimum_effect: >-
        FORCED at the control: D_10 = 1.00 within its own sampling error
        (relative error sqrt(2/(K-1)) = 0.29 at K = 24). MONOTONICITY REQUIRED:
        D_5 >= D_6 >= D_7 >= D_10 within error. A dispersion index that does NOT
        decay as r rises is the canonical artifact tell of
        docs/inventor-protocol.md section 3 and voids the whole reading.
        At r = 5 the SURROGATE COMPUTES D_5 exactly over the same arms, so this
        is a forced value there and a measurement elsewhere.

  minimal_test:
    design: >-
      Five stages, cheapest first; stages 1 and 2 are decisive and cost minutes.
      STAGE 0 (reading, zero compute): re-derive step 3 by hand and confirm
      against committed section 3.5. If the factorisation does not follow, stop.
      STAGE 1 (surrogate build and exact reproduction, minutes to about an hour
      of compute, DECISIVE): implement H, reproduce every committed r=5 integer
      to the digit, and reproduce n_4 = 0. Any mismatch stops the line and is
      reported as either a derivation error or an engine disagreement, with the
      three-way localisation stated.
      STAGE 2 (S-box swap, minutes): recompute the surrogate with a uniform
      random bijective S-box; confirm the residue is still 0 and the exact value
      differs.
      STAGE 3 (population arms at r=5, hours): K >= 24 independent keys and
      bases with the surrogate only (no cipher), establishing the exact
      population mean and dispersion index that the r=6 arms are compared to.
      STAGE 4 (r=6 and control, gated): K >= 24 cipher arms at r = 6, K >= 24 at
      10 rounds, plus r = 7 and the forward-diagonal sibling null. GATED ON THE
      AES-NI PATH BEING PINNED ACROSS r = 3-7 WITH A MACHINE-READABLE RECEIPT
      (RQ-AES-003 specification-pinning constraint). If it is not pinned, this
      stage is NOT run on that path and the contract says so rather than
      charging a measurement to an unpinned instrument.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, FORCED VALUE PRE-DERIVED, CAN FAIL:
        10-round AES-128 on the identical coset with the identical projection at
        identical 2^32 data complexity. FORCED: mean n = 2147483647.5, sd 46341,
        dispersion index 1.00. It fails if the measured mean or dispersion
        departs from those, which would indicate the coset-plus-projection
        construction is itself non-uniform and would invalidate every reading in
        the family including the campaign's committed ones.
      - >-
        POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR: r = 4, where n_4 = 0
        EXACTLY, and r = 2 / r = 3 where the exact 55- and 63-bit values are
        committed and independently re-measured. If the measuring engine does
        not return these, the instrument is broken and NO negative result from
        any r=6 arm may be reported at all. A SATURATION GUARD IS MANDATORY: the
        campaign's r=3 control was VOIDED once by uint8 occupancy saturation at
        a true occupancy of 2^24, and a repeat of that failure is an
        instrumentation defect, never a mathematical reading.
      - >-
        GRADED CONTROL, FOUR INTERIOR POINTS, MONOTONICITY REPORTED:
        r in {4, 5, 6, 7} plus the 10-round control, with the mean-deviation and
        dispersion statistics reported at every point. This localises where the
        structure dies instead of returning "it did not work at 6".
      - >-
        SIBLING NULL THAT ISOLATES THE NAMED PROPERTY (KN-FIND-029 rule 6;
        V-804-1): the FORWARD diagonal projection D_{j0} instead of ID_{j0} --
        wrong ShiftRows handedness, same shape, same 32 bits, same data. The
        campaign has one committed reading of it at r=5 (n = 2147467586,
        residue 2). It isolates the output geometry rather than merely
        discriminating structured from unstructured, which is the distinction
        V-804-1 has left undischarged for three batches.
      - >-
        S-BOX SIBLING (isolates the S-box rather than the geometry): uniform
        random bijective S-box, same everything else. DEC-20260802-9bda5c ruling
        3 forces the residue to agree; the exact value is where any S-box
        content must show up if it exists.
      - >-
        VERDICT-ON-THE-NULL-FIRST, AND COMMITTED BEFORE THE TREATMENT IS READ:
        the 10-round control arms are generated, measured and hash-committed
        BEFORE any r=6 arm is looked at. Absence of that commitment is
        invalid_measurement.
      - >-
        ARCHIVE CHECK (zero compute): every prior reading of this observable is
        enumerated -- BATCH-001 count5/raw.jsonl (aes_r3, aes_r4, aes_r5 x7,
        aes_r6 x2, null_sibling_fwd_diag, null_randperm_aes10,
        null_indep_roundkeys) and BATCH-002 TASK-20260802-142a4b/raw.jsonl.
        AVAILABLE, and the exact integers are used as the Stage-1 fixture rather
        than re-measured.
    required_metrics:
      - exact n_r per arm as an integer, never only as a residue
      - the occupancy histogram per arm, retained in full
      - surrogate value beside measured value, with their signed difference
      - per-arm key digest, base and j0, with an explicit independence statement
      - population mean, empirical sd and dispersion index per (r, arm family)
      - the resolution in bits of every reported statistic, in the same sentence
      - measured wall clock and measured peak RSS per arm, under CM-3
      - the AES-NI pinning receipt, or an explicit statement that it is absent

  falsification_conditions:
    - >-
      Any committed r=5 integer that the surrogate does not reproduce exactly.
      The factorisation, the campaign's section 3.5, or one of the three engines
      is wrong. The line stops and the disagreement is the deliverable.
    - >-
      The surrogate returning a non-zero value at r = 4. H is then not injective
      and the committed n_4 = 0 is contradicted by a derivation that reproduces
      r = 5; that contradiction routes to a correction record.
    - >-
      The AES S-box and a uniform random bijection giving the SAME exact n_5 on
      the same instance. Consequence (2) is dead: the exact channel carries no
      S-box information and the object is S-box-independent at every precision,
      not just at mod 8.
    - >-
      The 10-round control showing a mean shift or a dispersion index away from
      1.00 at K >= 24. The construction is non-uniform and no arm in the family
      -- including the campaign's committed ones -- may be read as a
      distinguisher.
    - >-
      A dispersion index or mean deviation that does NOT decay from r = 5 to
      r = 6 to r = 7 to the 10-round control. Artifact tell; the whole reading
      is void.
    - >-
      Occupancy counter saturation at any arm. invalid_measurement, never a
      negative observation.

  confounders:
    - >-
      ARM INDEPENDENCE IS NOT ESTABLISHED for the seven committed r=5 arms.
      EV-AES-d8a13e records BATCH-002's two r=5 arms being two projections of
      the SAME 2^32 ciphertexts differing only in j0, which invalidated a claimed
      1/64 independence figure until the validator ran the dropped arm. The same
      defect may be present in BATCH-001's arms and MUST be established from
      rk_sha256 and base before any pooled statistic is quoted.
    - >-
      THE POISSON NULL MAY UNDERSTATE THE SPREAD. The committed r=5 arms give an
      empirical dispersion index of about 20 against a Poisson value of 1. Every
      threshold in this proposal that uses a standard error must use the
      EMPIRICAL one; using the Poisson one would manufacture significance, and
      the difference is a factor of about 4.5 in the standard error.
    - >-
      THE AES-NI PATH IS UNPINNED. RQ-AES-003 forbids charging a measurement to
      it until it agrees with the pinned harness across r = 3-7 with a
      machine-readable receipt. Running Stage 4 on the soft engine instead costs
      about 550 s per arm and 48 arms would exceed a producer task; that is a
      scheduling fact and is stated rather than absorbed.
    - >-
      MULTIPLE COMPARISONS. Mean shift, dispersion index and higher histogram
      moments at four round counts is a family of tests; the decision rule must
      be frozen to ONE primary statistic (the mean-shift difference against the
      10-round control) with the rest reported as secondary, or the 4-sigma
      threshold is not what it appears to be.
    - >-
      AUTHORSHIP ASYMMETRY. A surrogate that reproduces committed numbers is
      gratifying and cheap; the design answers this by making the r=6 arm's null
      prediction the primary outcome and by pre-registering that no difference
      is expected.

  interpretation_limits:
    - >-
      THE SURROGATE IS AN INSTRUMENT, NOT AN ATTACK. It consumes the round-2
      coset base, which requires the key or two rounds of oracle access with the
      key. It recovers nothing, distinguishes nothing by itself, and moves no
      exponent. Any citation implying otherwise is a claim-tier violation.
    - >-
      NOTHING HERE EXTENDS TO r = 6 BY DERIVATION. The campaign's own section
      3.6 states why, and this record states it twice on purpose.
    - >-
      A CONFIRMED SURROGATE DOES NOT UPGRADE THE r=5 RESULT'S SCOPE.
      DEC-20260802-9bda5c ruling 3 stands: the r=4 and r=5 properties follow
      from round geometry and were reproduced with random bijective S-boxes at
      120/120. If the exact channel turns out to carry S-box information, that
      is a NEW and narrower statement about the exact value, not a retraction of
      the ruling about the residue.
    - >-
      Claim tier `toy`, reduced-round only, per RQ-AES-003 R6. No statement
      about full-round or deployed AES under any outcome. No comparison to
      published cryptanalysis in either direction (R3, symmetric).

  heuristic_assumptions:
    - id: HEUR-E1
      statement: >-
        NONE IS LOAD-BEARING FOR THE r=5 HALF. The identity
        n_5 = collision count of H is a consequence of the committed section 3.5
        condition plus the F_2-linearity of GF(2^8) constant multiplication. It
        is proved, not assumed, and its validation is an exact integer equality
        against committed measurements rather than a distributional test. This
        entry exists to record that the r=5 half is UNCONDITIONAL where the r=6
        half is not.
      rigorous_support: >-
        Distributivity of a fixed-constant GF(2^8) product over XOR; the
        bijectivity of the plaintext-to-A relabelling on the coset, which the
        committed section 3.2 establishes.
      validation_plan: >-
        Exact reproduction of at least eight committed integers, plus the
        r = 2, 3, 4 exact controls. Not a distributional validation and not
        presented as one.
    - id: HEUR-E2
      statement: >-
        For a 10-round AES-128 permutation restricted to a 2^32 coset and
        projected to 32 bits, the fibre-size multiset is distributed as
        independent Poisson(1) counts to within the sampling error at 2^32
        buckets, so E[n] = (2^32-1)/2 and Var(n) = E[n].
      rigorous_support: >-
        The standard occupancy computation for 2^32 draws into 2^32 cells; the
        permutation structure of the underlying 128-bit map contributes a
        correction of relative order 2^-96 because the coset is a 2^-96 fraction
        of the block space. Named here because every r=6 threshold depends on
        it and it would be unsound stated as fact.
      validation_plan: >-
        MEASURED, not assumed: K >= 24 independent 10-round control arms, with
        the mean and dispersion index reported BEFORE any r=6 arm is read. The
        committed single control arm (n = 2147422794, deviation -60854, i.e.
        -1.31 Poisson sd) is one datum and is explicitly not a distribution.
      falsification_condition: >-
        Measured control dispersion index outside [0.6, 1.6] at K = 24, or a
        control mean deviation exceeding 3 empirical standard errors. Either
        refutes HEUR-E2 and voids every r=6 threshold built on it.
    - id: HEUR-E3
      statement: >-
        The exact value n_5 depends on the S-box, i.e. the map H built from the
        AES S-box and the map built from a uniform random bijection have
        different collision counts on the same instance.
      rigorous_support: >-
        H is literally a function of the S-box, so equality of the counts would
        be a coincidence rather than a consequence -- but "different maps have
        different collision counts" is not a theorem, and asserting it as one
        would be exactly the error this program's controls exist to catch.
      validation_plan: >-
        Direct computation at Stage 2, minutes, on the same instance. Both
        outcomes are recorded; a coincidence at one instance is tested at 20.
      falsification_condition: >-
        Equal exact counts across 20 independent instances. Consequence (2) is
        then dead and must be withdrawn.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED BY THE SURROGATE and that is stated plainly: it is an
      instrument that needs the key. The EXPONENT AT STAKE is in the r=6 arm and
      only there: a data-path distinguisher surviving at r = 6 would beat REF-C,
      this campaign's own measured death round for the full-diagonal integral
      (exact through r = 4, dead at r = 5) and for this object's residue (forced
      at r = 5, dead at r = 6). That is a completion criterion, not an exponent.
      NO ATTACK COMPLEXITY IS CLAIMED, and the honest statement is that this
      proposal moves no exponent and is worth running because it converts a
      3-bit readout into a 31-bit one on measurements the campaign has already
      paid for.
    memory_exponent: >-
      Surrogate: 2^32 bytes of occupancy counters, 4 GiB, to be MEASURED as peak
      RSS under CM-3(f) rather than modelled. The committed soft engine used the
      same order of memory; the AES-NI engine's measured RSS is not on the
      record and must be.
    best_known: >-
      Not asserted. RQ-AES-003 R5 requires `dominated_by` to be recorded as
      unresolvable in this environment and never null.
    hidden_overhead: >-
      The surrogate's table build needs the round-2 coset base, i.e. two rounds
      of encryption on one text plus the MixColumns columns -- negligible, but
      it is the step that makes the surrogate key-dependent and therefore not an
      attack. Charged and named rather than hidden.
    tradeoff_note: >-
      The surrogate trades cipher evaluations for memory bandwidth: identical
      2^32 counting work, no AES round function. Its advantage is exactness and
      independence, not asymptotics.

  dominated_by: >-
    Unresolvable in this environment: no primary source reachable from this
    harness was read for this record, and every recalled frontier row is
    unverified-from-memory (RQ-AES-003 R5). Rows checked INSIDE this repository,
    across time, memory and data/queries, for a prior cipher-free predictor of
    n_5 or any exact-value reading of n_r: BATCH-001 count5 pre-registration and
    raw.jsonl, BATCH-002 TASK-20260802-142a4b (cnt.c, RESULTS.json, raw.jsonl)
    and TASK-20260802-9dcca8, both BATCH-002 review reports, EV-AES-001..005,
    EV-AES-d33b1c, EV-AES-d8a13e, DEC-20260802-9bda5c, DEC-20260802-b226fb, and
    the ledger proposal directory. NONE computes n_5 without the cipher and NONE
    reads the exact value of any n_r; every reading is a residue. Absence of a
    search result is not evidence that no such derivation exists (AGENTS.md
    retrieval policy).
  sota_delta: >-
    Against REF-A: NO MARGIN CLAIMED; this proposal contains no key recovery.
    Against REF-B: NO MARGIN CLAIMED; no baseline comparison is made.
    Against REF-C, and stated as a TEST rather than a result: REF-C's data-path
    wall is the full-diagonal 2^32 integral, exact through r = 4 and dead at
    r = 5, plus this campaign's own r=5-forced / r=6-dead residue. The r=6 arm
    proposed here would, IF a difference above 4 empirical standard errors were
    measured against a matched 10-round control at identical 2^32 data, sit one
    round beyond that wall. NO SUCH MEASUREMENT EXISTS AND NONE IS PREDICTED.
    Quantitative deltas actually claimed, both evidential: per-trial forced-value
    content rises from about 3 bits (residue, null cost 8^-1) to about 31 bits
    (exact integer, null spread 2^15.5 about a mean of 2^31); and the measuring
    cost per r=5 configuration falls from a committed 549.69 s to a predicted
    below 180 s with no cipher call. Published-frontier comparison: UNADJUDICABLE
    in this environment, in both directions.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: >-
    0.90 that the factorisation is correct and the surrogate reproduces the
    committed r=5 integers exactly. It is not higher because the derivation was
    read off a prose pre-registration rather than re-run, and an indexing
    convention error in t_i = (col - j0 + i) mod 4 or in the byte packing would
    break exact agreement while leaving the residue intact -- the campaign has
    already recorded one cosmetic index-convention error (D-ERR-1) in that very
    document and one substantive projection mis-specification (GATE-RR78-1). It
    is not lower because the identity is a one-line consequence of a statement
    that was independently re-worked line by line by the BATCH-001 validator,
    and because the residue it implies is confirmed at 13 arms.
    0.55 that the exact value visibly separates the AES S-box from a random
    bijection at a single instance -- lower than one might guess, because both
    counts are near 2^31 with a spread of about 2^15.5, and "different" only
    means "not equal", which is nearly certain, while "different in a way that
    identifies AES" needs a population and is a separate question.
    0.10 that the r=6 arm shows a difference above the pre-registered 4
    empirical standard errors against the matched control. Not lower because
    nobody has ever looked at this number and the committed r=5 arms already
    show a dispersion index of about 20 against a Poisson value of 1, which is
    an unexplained structural fact; not higher because r = 6 is one full round
    past every object this campaign has measured alive, the campaign's own
    derivation says nothing is forced there, and the two committed r=6 arms sit
    at +0.18 and -0.76 Poisson standard deviations, i.e. exactly where a null
    would put them.
