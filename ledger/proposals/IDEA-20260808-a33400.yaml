    NOT SCREENED - web search unavailable. "Structures" in differential cryptanalysis are
    classical and are named above as the nearest folklore; whether the RANK question has been
    answered in the literature is UNKNOWN to this session.
  discriminated_from: H-AES-49d2c7 - that object is the OUTPUT collision histogram of one
    input coset; mine is the rank of the space of CHECKS supported on that coset, computed
    before any cipher call. IDEA-20260807-7e16ac - a layout control, not a count. Classical
    "structures" - pair counting, not functional rank.
