  proof_search_map:
    bottleneck: The data budget. At r >= 5 the campaign's integral instruments die and the
      binding constraint on trying anything richer is how many chosen plaintexts fit in a
      producer slot.
    baseline_embedding:
      parameter_slice: c(r) = 1 recovers the standard charging exactly.
      reproduction_check: Setting the linear layer to the identity must return the standard
        count; frozen as a fixture.
    observation_collision:
      observable: the integer c(r).
      distinct_preimage_search: Two different linear layers with the same c(r) are expected
        and harmless. The dangerous collision is a c(r) that is the same for AES and for the
        identity layer, which is precisely prediction 5's null and is mandatory.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: the structure/delta-set incidence matrix, reduced to a subspace-lattice
        Moebius computation.
      predicted_gain: turns a 2^32-column rank problem into a rank problem on a lattice of
        dimension <= 16.
    quantifier_order: FOR ALL r, THERE EXISTS an integer c(r) such that FOR ALL structures
      S of the named family, the GF(2)-span of the r-round check functionals supported on
      S has dimension exactly c(r). Note - c(r) is claimed UNIFORM over structures; a structure-dependent
      c(r) falsifies the clean statement and reduces it to a min over structures.
    method_ceiling:
      strongest_certifiable_claim: '"One structure supports exactly c(r) independent linear
        checks." It can NEVER certify that those checks are statistically usable - that is
        HA-1 and it is measured, not proved.'
      nearby_object_control: An SPN whose MixColumns has branch number 2 (so the subspace
        trail is longer) should have a strictly LARGER c(r) at the same r. If it does not,
        the quantity is not tracking mixing.
    proof_obligations:
    - claim: closed-form |I(S)| and c(r).
      responsibility: size
    - claim: toy enumeration matches the closed form.
      responsibility: baseline
    - claim: statistical usability of independent functionals.
      responsibility: success_probability
    - claim: data saving is stated against REF-A/REF-C only.
      responsibility: scope
    not_applicable_reason: null
