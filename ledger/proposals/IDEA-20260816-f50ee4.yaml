idea:
  id: IDEA-20260816-f50ee4
  question_id: RQ-FBG-001
  added: '2026-08-16'
  title: Restate the universal algebraic-factor-base no-go of KN-OPEN-020 as a decidable predicate
    over an explicit finite grammar of factor-base descriptions, attach a numbered escape list to
    it, and calibrate the classifier by running it on the six geometries whose exact yield and coverage
    EV-FBG-001 already measured
  class: theory
  claim: '(A) KN-OPEN-020 is currently a sentence, not an instrument. It asks whether every algebraically
    described factor base over a generic prime-field elliptic subgroup fails to give a subexponential
    index calculus, and it records that the only thing proved is a scoped bounded-degree obstruction
    carried by the artifact under IDEA-20260801-021. A sentence in that shape cannot be applied to
    a new geometry: an agent proposing a base has no procedure for deciding whether the existing obstruction
    already covers it. (B) The claim is that the no-go can be rewritten as a predicate COVERED(D)
    over a small explicit grammar for describing a factor base D, where the grammar has four generators
    - a bounded-degree plane-polynomial vanishing locus, a finite union of such loci, an interval
    or coset in a named coordinate, and a set defined by a membership oracle with a stated per-element
    cost - and that COVERED is decidable by inspection of the description alone, with no compute and
    no curve. (C) The claim is further that the escapes KN-OPEN-020 lists in prose - high-degree interpolation
    descriptions, multiple simultaneous constructible predicates, target-dependent descriptions, implicit
    membership, and source-recovery algorithms - become five numbered ESCAPE clauses, each of which
    must be witnessed: for each escape, either a concrete geometry in the grammar that lands in it,
    or an explicit reduction showing that anything landing in it collapses back into the bounded-degree
    case with a stated blow-up in the intersection degree Delta. An escape with neither witness nor
    reduction is recorded as unwitnessed and stays open, which is the honest state and not a defect.
    (D) WHAT IS NOT CLAIMED. This claims no attack, no break, no speedup, and no security consequence.
    It does not claim that the universal no-go is true, does not claim that any escape is impossible,
    does not claim to close KN-OPEN-020, and does not assert anything about what the published literature
    contains. It also does not claim that a geometry classified as COVERED performs badly - COVERED
    is a statement about which existing derivation applies to a description, not a prediction about
    a measurement, and the calibration arm in (E) exists precisely to keep those two apart. (E) The
    classifier is worthless unless it agrees with what is already measured, so the deliverable includes
    running it against the six geometries in the EV-FBG-001 battery and recording every disagreement
    between the classifier verdict and the recorded exact numbers as a defect of the classifier.'
  mechanism: 'STAGE 1, grammar. Write the four generators as a small algebraic data type with explicit
    fields: locus degree d, number of components k, coordinate name, ambient set, and membership cost
    in field operations per candidate. Every description in the grammar is a finite term. STAGE 2,
    predicate. Define COVERED(D) as the conjunction of the hypotheses the bounded-degree derivation
    actually needs, read out of the artifact text rather than paraphrased: a nonzero bounded-degree
    predicate, a proper locus with finite intersection degree Delta, explicit bounded-arity descent,
    and min-entropy-random targets. Each conjunct becomes a syntactic test on the term. STAGE 3, escapes.
    Any term failing a conjunct is routed to the numbered escape for the conjunct it failed. For each
    escape, attempt a reduction: show that a term in that escape can be rewritten as a bounded union
    of covered terms with an explicit Delta blow-up. Record every reduction that succeeds symbolically
    and every one that does not. STAGE 4, calibration. Encode the six geometries from the frozen battery
    as grammar terms, run COVERED on each, and compare with the recorded exact measurements. A geometry
    the classifier calls COVERED but which shows a coverage excess outside its null band, or a geometry
    the classifier routes to an escape but which measured exactly at the null, is a classifier defect
    and is reported as such. STAGE 5, refutation route. The whole construction is refuted if the grammar
    cannot express one of the six already-measured geometries, or if a conjunct turns out to be unstateable
    as a syntactic test and needs a curve to evaluate, since then COVERED is not decidable by inspection
    and the instrument does not exist.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read in full: ledger/questions/RQ-FBG-001.yaml, knowledge/open-problems/KN-OPEN-020.md,
      KN-OPEN-006.md, KN-OPEN-001.md, ledger/hypotheses/H-FBG-001.yaml, ledger/evidence/EV-FBG-001.yaml,
      docs/inventor-protocol.md sections 1-5 and 8. Greps: grep -ril ''factor.base|factor_base'' over
      ledger/proposals (237 hits); grep -ril over ledger/proposals and ledger/hypotheses for each
      of ''arithmetic progression'', ''displacement rank'', ''high-bit'', ''coset'', ''Sidon'', ''sumset'',
      ''yield ratio'', ''matched random base'', ''B-smooth'', ''Toeplitz'', ''greedy''; grep -ril
      ''bose.chowla'' over ledger, knowledge, experiments. Read heads of IDEA-20260815-c13ef4, IDEA-20260807-e57607,
      IDEA-20260815-78fbba, experiments/EXP-RELN-0a979f/specification.yaml.'
    results: IDEA-20260801-021 owns the bounded-degree factor-base theorem itself and its artifact
      is cited by KN-OPEN-020 as the only conditional proof. KN-OPEN-020 lists the escape categories
      in prose but attaches no grammar, no decision procedure and no witnesses. No proposal found
      in the 237 factor-base hits turns the no-go into a syntactic predicate or calibrates such a
      predicate against EV-FBG-001. IDEA-20260807-e57607 performs a related move for a different lane
      - it derives which factor of an index-calculus cost expression can move an exponent - but operates
      on the cost expression, not on the description language of the base. IDEA-20260815-c13ef4 contrasts
      designed with sampled bases and does not classify descriptions.
    verdict: 'UNVERIFIED. No agent here can read external literature, so nothing is asserted about
      prior art. What is claimed new is the assembly: a finite description grammar plus a syntactic
      COVERED predicate plus a numbered escape list with a witness-or-reduction obligation plus calibration
      against already-recorded exact measurements. The parts assembled from known program state are
      the bounded-degree derivation (IDEA-20260801-021), the escape categories in prose (KN-OPEN-020),
      and the six measured geometries (EV-FBG-001). None of the four is new on its own.'
  object_first_candidate:
    tracked_object: THE DESCRIPTION TERM of the factor base - the finite syntactic object that specifies
      which curve points belong to D, carrying its locus degree, component count, coordinate of definition,
      and per-element membership cost - followed through the classification, not the curve points
      themselves.
    lossiness: 'Genuinely lossy. The description term discards the curve, the field, the prime p,
      the base size B, the actual point set, and every measured number. What survives is only the
      shape of the defining condition. That is discarded compatibly with the target operation here,
      which is application of the bounded-degree derivation: the derivation''s hypotheses reference
      only degree, properness, arity and target entropy, so a term retaining exactly those four fields
      still determines whether the derivation applies. Many distinct factor bases collapse to one
      term, which is what makes this a projection rather than a renaming.'
    propagation: 'One step of the target operation is: apply one hypothesis of the bounded-degree
      derivation to the term. Each application either confirms the conjunct and leaves the term intact,
      or fails and rewrites the term into the escape clause named by the failed conjunct. Escape rewriting
      is where structure can be lost - a reduction that maps an escape term back to a bounded union
      of covered terms multiplies the intersection degree Delta by an explicit factor, and once Delta
      exceeds the base size the conclusion is vacuous.'
    survival_score: 'The term survives all four conjunct applications for the interval, small-canonical-set
      and single-locus geometries, which is the whole grammar depth needed for the six already-measured
      geometries. It dissolves at the first target-dependent description, because the derivation''s
      min-entropy-random-target hypothesis is not a property of the term at all and the projection
      has already thrown away the target distribution. Concretely: survival through 4 of 4 conjuncts
      for static coordinate-defined geometries; survival through 2 of 4 for any geometry whose membership
      condition reads the target.'
  null_object_control: 'The null object is a RANDOM TERM of the same grammar depth: sample a description
    uniformly from the grammar at matched degree budget and matched component count, and run the identical
    COVERED procedure on it. Because a random low-degree locus is exactly the generic case the bounded-degree
    derivation was written for, the null must be classified COVERED at a rate near 1. For the signal
    arm to mean anything, the classifier must (i) classify at least 90 percent of random matched-depth
    terms as COVERED, and (ii) route at least one hand-built escape witness away from COVERED. A classifier
    that routes random terms into escapes is detecting its own looseness, not structure, and the run
    is recorded as a controlled null. Second null: the six EV-FBG-001 geometries, whose measured exact
    numbers are known, so a classifier verdict can be checked against ground truth rather than against
    itself.'
  discriminated_from:
  - 'IDEA-20260801-021 and its artifact ideas/artifacts/IDEA-20260801-021/bounded_degree_factor_base_theorem.md:
    that record PROVES the scoped obstruction for one predicate class. This one does not reprove it
    and adds no mathematical strength; it makes the existing obstruction applicable to an arbitrary
    new description by inspection, and reports where it cannot be applied.'
  - 'KN-OPEN-020 itself: the open problem states the universal question and lists escapes in prose.
    This proposal does not attempt the universal theorem and explicitly declines to close it; it converts
    the prose escape list into numbered clauses with a witness-or-reduction obligation.'
  - 'IDEA-20260807-e57607: derives which factor in an index-calculus cost expression can move an exponent
    for the automorphism lane. That operates on a cost formula and on solving degree; this operates
    on the description language of the base and claims nothing about solving degree.'
  - 'IDEA-20260815-c13ef4: designed versus sampled factor bases at matched size, a decomposition-rate
    measurement. This is a zero-compute classification of descriptions and makes no rate comparison.'
  - 'H-FBG-001 and EV-FBG-001: a six-cell measurement battery with a growth clause. This proposal
    consumes that battery as calibration ground truth rather than extending or re-running it.'
  assumptions:
  - The bounded-degree derivation's hypotheses can be read off the frozen artifact text precisely
    enough to become syntactic tests; if a hypothesis turns out to be semantic, the predicate is not
    decidable by inspection and the proposal fails at STAGE 5.
  - The four-generator grammar is expressive enough to encode the six already-measured geometries;
    if it is not, the grammar is under-powered and that is reported rather than patched by adding
    generators until it fits.
  - Classifying a term as COVERED is a statement about which derivation applies, not a prediction
    about measured yield or coverage; the calibration arm exists to detect any drift between those
    two readings.
  - Intersection degree Delta is a meaningful and computable field of a term at the degrees used here.
  predictions:
  - metric: fraction of the six EV-FBG-001 geometries encodable as terms in the four-generator grammar
    direction: higher
    minimum_effect: 5
  - metric: fraction of uniformly sampled matched-depth random terms classified COVERED (null arm)
    direction: higher
    minimum_effect: 0.9
  - metric: number of the five named escape clauses that receive an explicit witness term or an explicit
      reduction with a stated Delta blow-up
    direction: higher
    minimum_effect: 3
  - metric: number of classifier verdicts contradicting the recorded exact EV-FBG-001 numbers
    direction: lower
    minimum_effect: 'explicit refusal to pre-commit: the calibration arm has no prior baseline in
      this repository, so any pre-committed threshold would be invented rather than derived; the count
      is reported as-is with each disagreement described'
  minimal_test:
    design: 'Zero compute, one session. Write the grammar as roughly 60 lines of Python dataclasses
      in the scratchpad, write COVERED as a pure function over those dataclasses, and encode the six
      frozen geometries plus five hand-built escape witnesses as terms. Sample 200 random terms at
      matched depth using a fixed seed and run the identical COVERED function on them. The whole comparison
      is signal arm and null arm in one invocation of one script, which is what the control adequacy
      rule requires. The discriminating output is a single table: term, verdict, escape number if
      any, and for the six calibration terms the recorded exact coverage ratio next to the verdict.
      If the null arm is not classified COVERED at high rate, the predicate is loose and nothing else
      in the table can be read. If the grammar cannot express a frozen geometry, the run stops there
      and reports the inexpressible geometry, which is itself the finding.'
    controls:
    - Random matched-depth grammar terms, 200 of them, run through the identical COVERED function
      in the same invocation as the signal terms.
    - The six EV-FBG-001 geometries as ground-truth calibration terms with their recorded exact numbers
      attached.
    - A deliberately degenerate term - the full x-line, which is not a proper locus - which must fail
      the properness conjunct; a classifier that calls it COVERED is broken.
    - Seed-fixed sampling with the seed recorded, so the null arm is reproducible bit-for-bit.
    required_metrics:
    - expressibility rate of the six frozen geometries in the grammar
    - COVERED rate on the 200-term random null
    - per-escape witness or reduction status, with Delta blow-up factor where a reduction succeeds
    - count and description of classifier verdicts disagreeing with recorded exact measurements
    - number of grammar generators actually exercised by the frozen geometries
  falsification_conditions:
  - Any of the six frozen geometries cannot be written as a term in the grammar.
  - Any conjunct of the bounded-degree derivation cannot be expressed as a syntactic test and requires
    evaluating a curve, so COVERED is not decidable by inspection.
  - The random matched-depth null is classified COVERED at a rate below 0.9, showing the predicate
    is too loose to separate anything.
  - The degenerate full-x-line term is classified COVERED.
  - Every one of the five escape clauses reduces to the bounded-degree case, which would mean the
    escape list is empty and the grammar is too weak to represent the open part of KN-OPEN-020.
  - Two encodings of the same frozen geometry give different verdicts, showing the encoding is not
    well defined.
  confounders:
  - 'Encoding freedom: the same geometry can often be written as several terms, and an agent choosing
    the encoding can steer the verdict. Mitigated only by publishing every encoding used and testing
    at least two encodings per frozen geometry.'
  - Reading the derivation's hypotheses through paraphrase rather than from the frozen artifact text
    would silently change what COVERED means.
  - A grammar tuned until it fits the six frozen geometries is fitting its own calibration set; the
    random null is the only guard and it is a weak one.
  - Calibration against EV-FBG-001 imports that battery's own scope - toy sizes, m equal to 3, prime-order
    curves - into the classifier's apparent validity.
  interpretation_limits:
  - A COVERED verdict says only that one existing scoped derivation applies to a description. It is
    not evidence that the geometry is weak, and it is not progress toward the universal statement.
  - The escape list is a list of places the current derivation does not reach, not a list of promising
    directions and not a claim that any escape is reachable.
  - Nothing here bears on whether index calculus beats rho over prime fields (KN-OPEN-001), which
    stays open and untouched.
  target_complexity:
    time_exponent: No attack exponent is claimed. The classifier itself runs in time linear in the
      size of the description term and is independent of the curve, the field size and the base size.
    memory_exponent: No attack memory exponent is claimed. The classifier holds one term at a time;
      peak memory is the 200-term null sample, which is kilobytes.
    best_known: The incumbent is KN-OPEN-020 in its current form - a prose statement with a prose
      escape list - together with the scoped bounded-degree derivation of IDEA-20260801-021. There
      is no incumbent classifier to beat because none exists in this repository.
    hidden_overhead: 'The human cost is the whole cost, and it hides in reading the frozen artifact
      precisely: every conjunct turned into a syntactic test is an interpretive act, and a wrong reading
      produces a confident classifier that is wrong everywhere. A second hidden cost is maintenance
      - each new geometry family proposed in this program either fits the grammar or forces a grammar
      amendment, and amendments invalidate earlier calibration.'
  dominated_by: 'n/a (no result claimed). There is no time, memory or data point to place on any attack
    frontier, so no frontier row can be displaced. I checked the frontier rows this repository actually
    records: the generic sqrt(p) rho baseline named in KN-OPEN-001, and the m equal to 3 prime-field
    index-calculus cost expression written out in IDEA-20260807-e57607. Neither is touched, and on
    the only axis where this proposal has a cost - human hours - it is dominated by doing nothing.'
  sota_delta: 'No attack; conceptual contribution only. Quantitatively the only comparison available
    is coverage of the escape space: KN-OPEN-020 currently names 5 escape categories with 0 witnesses
    and 0 reductions, and a successful run would move that to 5 categories with at least 3 resolved
    as witness or reduction. No cost number changes.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Grammar expressiveness (can the four generators encode the six frozen
    geometries): about 0.8 - the frozen geometries are simple coordinate-defined sets and the generators
    were chosen after reading them, which inflates this number. Decidability by inspection (every
    conjunct becomes a syntactic test): about 0.45 - the min-entropy-random-target hypothesis is my
    main worry, since target entropy is not a property of the base description at all and may force
    the predicate to carry a semantic side condition. Escape resolution (at least three of five witnessed
    or reduced): about 0.5 - target-dependent descriptions and implicit membership are the hard two
    and I expect at least one to stay unwitnessed. Calibration agreement (no contradiction with EV-FBG-001):
    about 0.7, low because COVERED and measured coverage are different quantities and a naive reader
    will treat a disagreement as a classifier defect when it is a category error. Overall probability
    that the session emits a usable classifier rather than a note explaining why one cannot be written:
    about 0.4.'
