idea:
  id: IDEA-20261006-cdb6f1
  question_id: RQ-JMV-001
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Split-prime counts of two Frobenius fundamental discriminants at
    p=17
  class: measurement
  novelty_status: unverified
  claim: >-
    Let E+ be the positive curve y^2 = x^3 + x + 1 over F_17 and let
    E0 be the same-shape null y^2 = x^3 + x + 3 over F_17. Both
    cubics are nonsingular because 4A^3 + 27B^2 is nonzero modulo 17
    for A = 1 and B in {1, 3}. Let t be the trace p + 1 - #E(F_17),
    let D = t^2 - 4*17, and let D_fund be the fundamental discriminant
    obtained by removing the largest square factor so that D_fund is
    congruent to 0 or 1 modulo 4. Let s(E) be the number of primes q
    in {3, 5, 7, 11} with Kronecker symbol (D_fund / q) = +1. The
    claim is that s(E+) and s(E0) differ by at least 2. This is not
    an assertion that the traces are equal, and it is not an ECDLP
    cost claim.
  mechanism: >-
    This is a toy measurement of the one-step generating set of an
    ordinary class-group Cayley graph, which is the walk carrier named
    in RQ-JMV-001. It is not an attack. The question's own constraint
    forbids an ECDLP attack-cost improvement, and none is claimed.
    Representation: the fundamental discriminant as an integer.
    Operation set Sigma is evaluation of the Kronecker symbol at the
    fixed primes {3, 5, 7, 11}. Sigma is not translation on E(F_17).
    Trichotomy: coordinate-dependent, because the symbol depends on
    the integer D_fund and two curves with the same trace share that
    integer. LOSSY-PROJECTION TEST: the object kept is the symbol in
    {-1, 0, +1}, Sigma is Kronecker evaluation at those four primes,
    and the prime ideals above q together with the class-group
    multiplication table are discarded. Many ideal classes can sit
    over one split prime, so the symbol is a lossy projection of the
    class. F3 isogeny-path search is not the primary lens.
  assumptions:
    - >-
      Characteristic is not 2 or 3, and both named models are
      nonsingular, so each has a trace of Frobenius.
    - >-
      D_fund is constructed so that D / D_fund is a positive square
      and D_fund is congruent to 0 or 1 modulo 4.
    - >-
      A symbol of 0 means q ramifies and does not add to s(E).
    - >-
      If either trace is 0, that curve is supersingular, the ordinary
      JMV setting does not apply, and the pair is a failed probe.
  predictions:
    - metric: absolute difference |s(E+) - s(E0)|
      direction: different
      minimum_effect: >-
        The absolute difference is at least 2, against a difference
        of 0 or 1.
    - metric: trace of Frobenius of each curve
      direction: different
      minimum_effect: >-
        Neither trace is 0. A zero trace removes that curve from the
        ordinary comparison.
  minimal_test:
    design: >-
      For each of the two curves, enumerate E(F_17), set
      t = 18 - #E(F_17), set D = t^2 - 68, extract D_fund, and
      evaluate the Kronecker symbol at q = 3, 5, 7, 11. Count symbols
      equal to +1. Subtract the two counts.
    controls:
      - >-
        Nonsingularity control: recompute 4A^3 + 27B^2 modulo 17 for
        both B values and require a nonzero value.
      - >-
        Square-factor control: check that D / D_fund is a positive
        square. If not, the fundamental-discriminant step is wrong
        and the counts are not evidence.
      - >-
        Same-discriminant control: if D_fund(E+) = D_fund(E0), the
        symbols must agree. A nonzero difference in that case is an
        instrument failure.
    required_metrics:
      - t(E+)
      - t(E0)
      - D_fund(E+)
      - D_fund(E0)
      - s(E+)
      - s(E0)
  falsification_conditions:
    - >-
      |s(E+) - s(E0)| <= 1, including the case where the two
      fundamental discriminants coincide. That is a negative result
      for this pair, not an infrastructure failure.
    - >-
      Either trace is 0, or either model is singular. The ordinary
      pair was not obtained, so the gap is not established.
  confounders:
    - >-
      One ramified prime among the four can change a count by 1.
      The threshold is 2 so that a single ramified prime does not
      count as the predicted gap.
    - >-
      Extracting a non-fundamental discriminant moves both symbols
      and can invent a gap. The square-factor control is mandatory
      before the difference is read.
  interpretation_limits:
    - >-
      A gap of at least 2 says these two curves at p = 17 supply
      different numbers of split primes up to 11. It does not say
      that discrete-log cost differs inside one isogeny class.
      KR-RHO-755e35, which was opened, says curves of equal order
      share the weakness invariants named there.
    - >-
      If the traces differ, the curves are not a within-level pair.
      The claim does not convert a between-class gap into a
      within-class cost.
    - >-
      No experiment under this question is an ECDLP attack. The
      output is four Kronecker symbols per curve.
  citations:
    - ref: RQ-JMV-001
      provenance: internal
      claim: >-
        The question asks for the concrete constants of the
        Jao-Miller-Venkatesan ordinary isogeny self-reduction and
        whether discrete-log cost is constant on a level. Its methods
        include the Cayley graph on the class group generated by
        prime ideals of bounded norm. Its constraints say no
        experiment under the question produces an ECDLP attack.
      verified_by: >-
        idea-generator 2026-10-06 read ledger/questions/RQ-JMV-001.yaml
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Over a finite field, curves are isogenous if and only if they
        have the same number of points, and walking an isogeny class
        cannot reach a different weakness class such as anomalous,
        small embedding degree, or smooth order, because those
        invariants are shared.
      verified_by: >-
        idea-generator 2026-10-06 read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic-group discrete log in a prime-order group needs
        Omega(sqrt(p)) group operations.
      verified_by: >-
        idea-generator 2026-10-06 read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Under the stated statistical assumptions, naive Semaev index
        calculus over prime fields costs at least as much as generic
        algorithms.
      verified_by: >-
        idea-generator 2026-10-06 read knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
    - ref: KR-RHO-037e22
      provenance: internal
      claim: >-
        On a Koblitz curve over F_{2^m}, walking on classes of the
        group generated by Frobenius and negation reduces parallel rho
        by sqrt(2m). That factor is not used by this split-count.
      verified_by: >-
        idea-generator 2026-10-06 read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-037e22.yaml
    - ref: null
      provenance: recalled
      claim: >-
        Jao-Miller-Venkatesan 2005 is the recalled source of the
        ordinary self-reduction. Not support. KN-LIT-171 was not
        opened in this session.
      verified_by: null
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a fundamental discriminant D_fund and an odd prime q that
        does not divide D_fund, the Kronecker symbol (D_fund / q)
        equals +1 when q splits and -1 when q is inert. The test
        counts only the +1 outcomes at q in {3, 5, 7, 11}.
      rigorous_support: >-
        The splitting law for the quadratic order of fundamental
        discriminant D_fund, evaluated by quadratic reciprocity. The
        test implements the symbol. It does not look up a class
        number.
      validation_plan: >-
        The toy measurement computes both traces by enumerating
        points over F_17, extracts both fundamental discriminants,
        and counts +1 symbols. The predicted indicator is an absolute
        difference of at least 2. A difference of 0 or 1 falsifies
        the claim. No equidistribution of symbols is assumed.
  target_complexity:
    time_exponent: >-
      O(p) field operations to enumerate E(F_17), plus O(1) symbol
      evaluations at four primes. Polynomial in p = 17. No ECDLP
      exponent is in scope.
    memory_exponent: >-
      O(1) integers beyond the point list of size at most 18. Polynomial
      in p and in the prime bound 11.
    best_known: >-
      No ECDLP exponent is in scope. KR-RHO-755e35 is the opened
      statement that equal order shares weakness invariants, and
      KR-RHO-13bf67 is the opened generic lower bound Omega(sqrt(p)).
    hidden_overhead: >-
      The point count is exhaustive over a 17-element field. There is
      no o(1) asymptotic term and no transfer to cryptographic p.
    tradeoff_note: >-
      Memory is a handful of integers. This is not a van
      Oorschot-Wiener time-memory tradeoff and it is not parallelized.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    KR-RHO-755e35, equal hardness for curves of equal order, and
    KR-RHO-13bf67, generic-group Omega(sqrt(p)). Both files were
    opened. A split-count gap is not a discrete-log cost.
  sota_delta: >-
    Adds two integers s(E+) and s(E0), each between 0 and 4, predicted
    to differ by at least 2 for the named models at p = 17. Adds zero
    group operations toward the Omega(sqrt(p)) bound and no within-class
    cost separation beyond KR-RHO-755e35.
