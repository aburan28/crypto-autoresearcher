  discriminated_from: IDEA-20260805-45bf55 concerns how censored attempts are CHARGED in the
    cost accounting; this concerns what is OBSERVED and how theta is estimated - the two are
    compatible and could be adopted together. IDEA-20260805-96cb3d concerns the p_exist/p_solve
    separation itself and whether the difference should be fed to ICEX; this record accepts
    the separation and repairs the measurement of the second term. IDEA-20260805-a25f11 is
    the exact mean-yield identity (a p_exist-side statement) and is orthogonal.
