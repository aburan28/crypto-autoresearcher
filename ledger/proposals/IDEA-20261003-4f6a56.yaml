# IDEA-20261003-4f6a56
# Doubling count for the integer 16. Proposal only. Not approved.
idea:
  id: IDEA-20261003-4f6a56
  question_id: RQ-ECDLP-002
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    The integer 16 has bit length 5, 4 doublings, and 0 additions
  class: measurement
  claim: >-
    The integer 16 has bit length 5. Reaching it by doubling uses
    4 doublings and 0 additions. Five exceeds four by 1. Four
    exceeds zero by 4. The product of 5, 4, and 0 is 0. Their sum
    is 9. The gap is a digit count, not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the binary expansion of the integer
    16, which is coordinate-dependent and is not a group element.
    The bits are 1, 0, 0, 0, and 0. The operation set is reading
    one bit and doubling. Two readings of the addition count both
    give 0, so that gap is 0. No curve point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-955fd6
      provenance: internal
      claim: >-
        Symmetries that speed decomposition are a different object
        from these digit counts of the integer 16.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The integer 16 is frozen before the bits are read.
    - No curve point is added.
  proof_search_map:
    bottleneck: The gap between bit length 5 and addition count 0.
    baseline_embedding:
      parameter_slice: The counts 5, 4, and 0.
      reproduction_check: >-
        Two readers must agree that the bit length is 5, the
        doubling count is 4, and the addition count is 0.
    observation_collision:
      observable: The three counts and their product.
      distinct_preimage_search: >-
        Reporting the addition count as 4 drops the gap against
        the doubling count. Two readings of the addition count
        make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The integer 16.
        predicted_gain: Integer counts. No curve addition.
    quantifier_order: >-
      The integer is fixed before the counts.
    method_ceiling:
      strongest_certifiable_claim: >-
        The counts 5, 4, and 0. Not a scalar multiplication.
      nearby_object_control: >-
        Two readings of the addition count. Both are 0, and the gap is 0.
    proof_obligations:
      - claim: The bit length of 16 is 5.
        responsibility: size
      - claim: The doubling count is 4 and the addition count is 0.
        responsibility: size
      - claim: The product is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: digit_gap
      direction: different
      minimum_effect: Five exceeds zero by 5.
  minimal_test:
    design: >-
      Read the bits of 16 and count doublings and additions. Do not
      add a curve point.
    controls:
      - Two readings of the addition count, whose gap is 0.
      - An independent count.
    required_metrics:
      - the bit length
      - the doubling count
      - the addition count
      - the product
  falsification_conditions:
    - The addition count is not 0.
    - The product of 5, 4, and 0 is not 0.
  confounders:
    - The integer 8 has bit length 4 and is a different integer.
  interpretation_limits:
    - A digit count is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the count triple 4, 3, and 0 of the integer 8.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen integer 16 has bit length 5, 4 doublings, and
        0 additions.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of one integer.
      validation_plan: >-
        Two independent readings. A mismatch voids the product.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Not a memory bound.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: A different recoding is not counted.
    tradeoff_note: Zero additions on one integer do not by themselves shorten a walk.
  estimated_cost:
