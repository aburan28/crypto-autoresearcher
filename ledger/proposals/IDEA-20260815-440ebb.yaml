idea:
  id: IDEA-20260815-440ebb
  question_id: RQ-ECDLP-002
  added: '2026-08-15'
  title: >-
    THE TRANSPORT THEOREM HAS A COST TERM NOBODY HAS BOUNDED FROM BELOW:
    ECDLP transports along any coprime-degree F_p-isogeny, so difficulty is
    an isogeny-class invariant UP TO TRANSPORT COST -- and the campaign's
    whole endomorphism programme lives or dies on whether that cost can ever
    be sublinear in the degree
  class: theory

  claim: >-
    GOAL-ENDO-001's organising fact is transport theorem T1: the ECDLP moves
    along any F_p-isogeny of degree coprime to N, so difficulty is an
    isogeny-class invariant up to transport cost. The invariance half is
    settled and closed several lanes. THE COST HALF IS NOT: every use of T1
    assumes transport is cheap enough to ignore or expensive enough to
    block, and neither has been bounded. This record asks for a LOWER bound
    on transport cost as a function of isogeny degree, because if transport
    is necessarily linear in the degree then reaching a distant class member
    costs more than the ECDLP itself and the entire search-for-a-weak-
    representative programme is closed by cost rather than by invariance.

  mechanism: >-
    Enumerate the transport implementations (Velu on the kernel, modular-
    polynomial walking, Elkies with kernel polynomials) and derive per-step
    and composed cost as a function of degree. Seek a lower bound: any
    transport must at minimum evaluate a map whose kernel has size
    proportional to the degree, giving a candidate linear floor. Then
    measure realised transport cost at toy degrees against that floor and
    report the gap.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Read of GOAL-ENDO-001's objective and T1; grep for 'transport cost',
      'transport theorem', 'isogeny-class invariant', and for any lower
      bound on isogeny evaluation cost.
    results: >-
      T1 and the invariance conclusion are well represented and used to
      close lanes. No record derives or measures a LOWER bound on the
      transport cost term, and the closures citing T1 rely on invariance
      rather than on cost.
    verdict: >-
      UNVERIFIED. Isogeny evaluation costs are standard in the fast-
      arithmetic literature; a lower bound framed as the gate on this
      campaign's programme is what is missing here.

  object_first_candidate:
    tracked_object: >-
      THE TRANSPORT COST TERM of T1, promoted from a parenthetical to the
      audited quantity.
    lossiness: >-
      T1's usual statement projects away the cost term entirely; that
      projection is what this record refuses.
    propagation: >-
      Not applicable; a cost derivation.
    survival_score: >-
      Survives while transport implementations are enumerable. A lower
      bound covering all conceivable implementations is not attainable and
      the record claims only a bound over the enumerated ones, which is a
      real and stated limitation.

  null_object_control: >-
    NULL 1 -- SMALL-DEGREE transport, where cost is known to be cheap and
    the floor must not fire; a bound that blocks 3-isogenies is wrong. NULL
    2 -- a COMPOSED chain of small isogenies of the same total degree, which
    is the obvious way to evade a per-step bound and must be costed
    explicitly rather than assumed equivalent. NULL 3 -- a random walk of
    matched length with no target, bounding the search overhead separately
    from the evaluation cost.

  discriminated_from:
    - >-
        IDEA-20260726-009 (minimum-height representative in the isogeny
        class). COMPLEMENTARY: that record asks whether a weak
        representative exists below sqrt(p); this asks whether reaching
        one could ever be affordable. A negative here closes that record's
        route regardless of its own answer.
    - >-
        IDEA-ISO-f9b2d3 (DLP uniform within an ordinary isogeny class).
        That closure is about invariance; this is about the cost of
        exploiting it. Named because both cite T1.

  assumptions:
    - >-
        Transport implementations are enumerable in the relevant sense. A
        lower bound over an enumerated set is not a lower bound over all
        algorithms and the record must never state it as one.
    - >-
        Composed chains are the binding case. A per-step bound that a
        chain evades is not a bound at all, so chains must be costed as
        the primary object rather than as an afterthought.

  predictions:
    - metric: >-
        small-degree transport against the derived floor
      direction: different
      minimum_effect: >-
        FORCED not to fire. A floor blocking 3-isogenies is wrong and
        blocks the record.
    - metric: >-
        composed-chain cost of matched total degree
      direction: different
      minimum_effect: >-
        The binding measurement. If chains evade the per-step floor, the
        record's bound is void and must be withdrawn.
    - metric: >-
        realised transport cost versus derived floor at toy degrees
      direction: higher
      minimum_effect: >-
        Realised cost must exceed the floor; a realised cost below it
        falsifies the derivation.

  minimal_test:
    design: >-
      Derive the floor symbolically; measure realised transport at degrees
      3, 5, 7 and for a composed chain of the same total degree. Small,
      and the chain case decides whether the bound survives at all.
    controls:
      - >-
          Small-degree non-firing check.
      - >-
          Composed chain at matched total degree.
      - >-
          Random walk of matched length, separating search from
          evaluation cost.
      - >-
          Both Velu and modular-polynomial implementations costed.
    required_metrics:
      - >-
          Derived floor as a function of degree, with its enumerated
          implementation scope.
      - >-
          Realised cost per implementation and degree.
      - >-
          Composed-chain cost versus per-step sum.
      - >-
          Search overhead separated from evaluation cost.

  falsification_conditions:
    - >-
        The floor fires on small degrees. Derivation wrong.
    - >-
        Composed chains beat the floor. The bound does not survive
        composition and is withdrawn.
    - >-
        Realised cost falls below the derived floor. Derivation wrong.
    - >-
        No floor is derivable over the enumerated implementations. Report
        the failure rather than assert a bound.

  confounders:
    - >-
        IMPLEMENTATION-SCOPE OVERREACH: a bound over three known
        implementations reads as a bound over all algorithms unless stated
        otherwise, and that misreading would falsely close a lane.
    - >-
        AMORTISATION: transport cost per target falls when many targets
        share a walk, so a per-target bound must state its multi-target
        assumption.
    - >-
        PRECOMPUTATION: a walk computed once and reused changes the
        accounting entirely and must be charged separately.

  interpretation_limits:
    - >-
        A bound over enumerated implementations, never over all
        algorithms.
    - >-
        Toy degrees only; the realised-cost measurements do not
        extrapolate.
    - >-
        A negative closes the reach-a-weak-representative route on cost
        grounds within the enumerated scope only.

  heuristic_assumptions:
    - id: HEUR-ENDO-TCOST-1
      statement: >-
        Any transport of an ECDLP instance along an F_p-isogeny of
        degree d costs at least linear in d, and composing a chain of
        total degree d does not beat that floor.
      rigorous_support: >-
        The rigorous ingredient is that evaluating a d-isogeny requires
        determining its kernel, of size d, and that Velu-type formulas
        are linear in the kernel size; the sqrt-elu refinements improve
        the constant and the exponent to d^(1/2) in some regimes, WHICH
        IS EXACTLY WHY THE LINEAR CLAIM IS A HEURISTIC AND NOT A
        THEOREM. THE GAP IS NAMED: sqrt-elu already beats a naive linear
        floor, so the honest derived floor may be d^(1/2) rather than d,
        and the record must derive against the best known implementation
        rather than the naive one.
      falsification_condition: >-
        A transport implementation achieving cost below the derived
        floor at any tested degree.
      validation_plan: >-
        SAMPLE: degrees 3, 5, 7, 11, 13 and composed chains of matched
        total degree, each on >= 5 curves. COMPARISON: realised cost
        against floor, per implementation. TAIL CHECK: the cheapest
        realised transports, checked against sqrt-elu expectations.
        TRANSFER ASSUMPTION: none beyond the tested degrees.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Stated explicitly rather than omitted. The record
      bounds a cost term rather than claiming an algorithm's exponent.
    memory_exponent: >-
      Isogeny evaluation working set; negligible at toy degrees.
    best_known: >-
      The incumbent transport costs are the sqrt-elu and Velu
      implementations in the isogeny literature, which set the floor this
      record must derive against rather than the naive linear estimate.
    hidden_overhead: >-
      Deriving against sqrt-elu rather than naive Velu weakens any floor
      substantially, and IDEA-20260726-008 already re-audits sqrt-elu
      charging across this ledger -- its output should be consumed here
      rather than duplicated.
    tradeoff_note: >-
      A floor derived over few implementations is easy and weak; over many
      it is hard and strong. The record states its enumerated scope
      explicitly and does not extrapolate past it.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed) -- no
    attack is mounted, so no row of the ECDLP frontier (rho, BSGS, kangaroo,
    index calculus, isogeny) dominates or is dominated. As a cost bound: the
    sqrt-elu literature dominates any naive linear floor and must be the
    derivation baseline. As a use of T1: complementary to the invariance
    closures rather than competing. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: the first attempt in this
    program to bound T1's cost term from below rather than assume it away;
    an explicit composed-chain test that most naive bounds fail; and a
    stated implementation scope so the bound cannot be misread as universal.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.8 that a floor is derivable over enumerated implementations. 0.35 that
    it survives the composed-chain test, which is where I expect naive
    bounds to die. 0.5 that deriving against sqrt-elu rather than Velu
    weakens the floor enough to make it non-binding for the campaign's
    purposes, which would be an honest and useful negative.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
