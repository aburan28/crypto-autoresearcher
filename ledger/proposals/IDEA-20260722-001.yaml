idea:
  id: IDEA-20260722-001
  title: Rigorous m=3 EC-decomposition <-> 3SUM-Indexing reduction and conditional no-go
  class: mechanism
  claim: >-
    The m=3 prime-field EC decomposition-membership test equals B calls to
    2-SUM-with-preprocessing (3SUM-Indexing) over the group; hence under the
    3SUM-Indexing conjecture, any curve-structure-oblivious m=3 index calculus
    has total cost Theta(N^{2/3}) and cannot beat Pollard rho.
  mechanism: >-
    R decomposes as P_i+P_j+P_k iff R-P_k is a 2-sum of the factor base for some
    P_k; a 2-sum-with-preprocessing structure answers each in the (S,T) tradeoff
    that 3SUM-Indexing lower-bounds.
  novelty_status: unverified
  assumptions: [3SUM-Indexing conjecture (Golovnev et al. 2020) for the conditional bound]
  predictions:
    - metric: proved total-cost exponent for structure-oblivious m=3 IC
      direction: different
      minimum_effect: ">= 2/3 (conditional) -> strictly worse than rho's 1/2"
  minimal_test:
    design: Write the reduction both directions; state the (S,T) tradeoff; derive the exponent.
    controls: [MITM (S=B^2,T=1) as the achievable corner; Shoup Omega(sqrt N) as the generic floor]
    required_metrics: [total-cost exponent as a function of the query/setup tradeoff]
  falsification_conditions:
    - "a structure-oblivious m=3 test achieving total o(N^{2/3}) (would refute the 3SUM link)"
  confounders: [precise form of the 3SUM-Indexing conjecture]
  interpretation_limits: [conditional on a fine-grained hypothesis; tractable without Sage]
  estimated_cost: {implementation: low, compute: low}
  recommended_priority: high
  proposed_by: idea-generator
