idea:
  id: IDEA-20260722-001
  title: Covariance-aware isometry-orbit batching for layered dual attacks
  class: composition
  claim: >-
    Reusing one short-vector pool across selected negacyclic coefficient
    isometries and combining the resulting layered dual scores with
    covariance-aware weights might reduce a matched ML-KEM attack estimate by
    at least two bits; failure to meet that threshold rejects the candidate as
    non-material.
  mechanism: >-
    Negacyclic monomial multiplication acts as a signed coefficient
    permutation preserving the centered-binomial laws. The proposal combines
    that deterministic orbit with layered modulus-switching scores, batched
    convolution, and generalized least-squares weighting. It predicts a gain
    only if held-out orbit scores have effective statistical rank above one
    and the saved vector work survives complete cost accounting.
  novelty_status: speculative
  question_id: RQ-MLKEM-001
  source_refs:
    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-001/tasks/TASK-20260722-201/candidate_report.yaml
    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-001/archives/TASK-20260722-202/snapshot-receipt.json
  review_refs:
    - EV-MLKEM-001
    - DEC-20260722-003
  disposition: revise
  interpretation_limits:
    - The proposal is a speculative composition, not a demonstrated attack or breakthrough.
    - BATCH-001 performed literature and derivation review only.
    - No standardized ML-KEM parameter set was attacked or solved.
