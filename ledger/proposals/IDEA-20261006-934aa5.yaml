      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic-group discrete logarithm in a prime-order group needs
