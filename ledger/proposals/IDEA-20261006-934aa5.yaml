      verified_by: knowledge/techniques/KN-TECH-018.md
    - ref: Flajolet and Odlyzko, random mapping statistics
      provenance: recalled
      claim: >-
        Cycle lengths of a random mapping are a recalled model for the
        length-2 rate of a negation walk. This session did not open the paper.
      verified_by: null
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-0528e7
      - KR-RHO-fb88e6
      - KR-RHO-13bf67
    nearest:
      - ref: KR-RHO-0528e7
        provenance: internal
        relation: adjacent
        delta: >-
          That row prices a sqrt(m) iteration reduction and a measured
          0.790*sqrt(6) factor on BN254, with exponent held at 1/2. This
          idea counts cycles of length 3 or 6 on one toy prime-field pair
          and caps the j=0 step ratio at 1.15*sqrt(6). The separator is an
          absolute fraction gap of 0.01, and the exponent movement is 0.
      - ref: KR-RHO-fb88e6
        provenance: internal
        relation: adjacent
        delta: >-
          That row accounts for negation cycles, including 2-cycles at
          about 1/(2r) per step and a best cited practical gain of 1.29.
          This idea's extra count is lengths 3 and 6, predicted to be at
          least 0.01 on the j=0 walk and below 0.01 on the |Aut|=2 null.
  dominated_by: >-
    Automorphism-orbit rho already takes the sqrt(|Aut|) constant and keeps
    exponent 1/2 (KR-RHO-0528e7). Negation-map rho already prices fruitless
    cycles (KR-RHO-fb88e6). This control does not beat either baseline in
    time, memory, or queries.
  sota_delta: >-
    The quantitative separator is an absolute gap of 0.01 in a cycle-length
    fraction and a band of 15 percent around sqrt(6), about 2.45. The
    distance to a sub-square-root algorithm is the full exponent 1/2, and
    this idea moves that exponent by 0.
