idea:
  id: IDEA-20261006-934aa5
  question_id: RQ-EWALK-8fa147
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Length-3 and length-6 fruitless cycles on one toy j=0 orbit walk,
    against an |Aut|=2 null at the same prime
  class: control
  claim: >-
    On one frozen ordinary prime-field j=0 curve and one |Aut|=2 curve
    over the same prime p with 100 < p < 800, an r-adding walk with r=16
    detects fruitless cycles of length 3 or 6 at a rate at least 0.01
    higher on the j=0 curve than on the |Aut|=2 curve, and the ratio of
    plain-rho steps to order-6-orbit steps on the j=0 curve is at most
    1.15 times sqrt(6).
  mechanism: >-
    The tracked object is the length of a run of repeated canonicalisation
    under the automorphism group, not a point of the prime-order subgroup.
    The representation is the orbit label (lexicographically smallest
    x-coordinate, with a fixed sign rule). The operation set is the
    r-adding step composed with that canonicaliser. On the j=0 curve the
    group has order 6, so a deterministic canonicaliser can close cycles
    whose length divides 6, including 3 and 6. On the |Aut|=2 curve the
    only automorphism is negation, so a correct detector reports no cycle
    of length 3 or 6. The orbit map is lossy: each fibre has size |Aut|
    and discards the coset representative. It is a block system of the
    automorphism group, not a block system of translation. Translation on
    a prime-order subgroup has no nontrivial deterministic lossy
    projection; this quotient is taken under a different operation set.
    Canonicalising one orbit costs O(1) field operations. The cycle length
    is an instrument reading on that canonicaliser. It is not a second
    coordinate on the subgroup, and it is not claimed to shrink the
    search below the orbit of size N/|Aut|.
  assumptions:
    - Both curves are ordinary, defined over the same prime, and each has a unique prime-order subgroup of order N > 40.
    - The j=0 curve admits an F_p-rational automorphism of order 3, and the comparison curve has automorphism group of order exactly 2.
    - The same r, the same partition of the orbit set, and the same seeds are used on both curves.
    - Cycle detection is a function of the canonical representative and the walk state, and it is frozen before any steps are counted.
  predictions:
    - metric: length_3_or_6_fraction_gap
      direction: higher
      minimum_effect: >-
        The fraction of detected fruitless cycles of length 3 or 6 on the
        j=0 curve exceeds the same fraction on the |Aut|=2 curve by at
        least 0.01 absolute, over 20 walks of 5000 steps.
    - metric: j0_plain_over_orbit_step_ratio
      direction: lower
      minimum_effect: >-
        On the j=0 curve the ratio of mean plain-rho steps to mean
        order-6-orbit steps, on 30 planted logarithms, is at most
        1.15*sqrt(6).
  minimal_test:
    design: >-
      Freeze one prime p in (100, 800), one j=0 curve, and one |Aut|=2
      curve over F_p. Run three walks on the j=0 curve: plain rho, a
      negation-only canonicaliser, and an order-6 canonicaliser. Run
      plain rho and a negation canonicaliser on the |Aut|=2 curve. Use
      r=16, 20 walks of 5000 steps for cycle fractions, and 30 planted
      discrete logs for step ratios. Record BSGS group-operation counts
      on the same subgroups as a non-walk control.
    controls:
      - The |Aut|=2 curve at the same p, same r, and same seeds, where length 3 and length 6 are predicted absent.
      - Negation-only canonicalisation on the j=0 curve, where length 3 and length 6 are predicted absent and length 2 is allowed.
      - Plain rho with no orbit canonicalisation, same seeds, on both curves.
      - BSGS on both prime-order subgroups, same planted scalars, as a walk-free operation count.
    required_metrics:
      - fraction of detected cycles of length 3 or 6 on each walk
      - fraction of detected cycles of length 2 on each walk
      - mean plain-rho steps and mean orbit-walk steps on the 30 planted logs
      - BSGS group-operation counts on the same logs
  falsification_conditions:
    - The j=0 length-3-or-6 fraction does not exceed the |Aut|=2 fraction by 0.01.
    - The |Aut|=2 walk reports a length-3-or-6 fraction of at least 0.01, so the detector is not reading the automorphism group.
    - The j=0 plain-over-orbit step ratio exceeds 1.15*sqrt(6) on the 30 planted logs.
    - The negation-only walk on the j=0 curve reports a length-3-or-6 fraction of at least 0.01.
  confounders:
    - A canonicaliser that ties on x-coordinates can invent cycles whose length is an artifact of the tie rule.
    - Different subgroup orders change birthday expectations; the speedup ratio is taken within one curve, and the cycle-length gap is a count of lengths, not a step count.
    - Fruitless-cycle escapes that rewrite the walk state can suppress length 6 while leaving length 2, which would shrink the gap without changing |Aut|.
  interpretation_limits:
    - A gap in cycle-length fractions is a property of the canonicaliser. It is not a reduction of the generic exponent 1/2.
    - The cap 1.15*sqrt(6) is an instrument band around the orbit-size prediction. Landing inside the band does not show that the prediction is sharp, and landing above it does not by itself exhibit a new endomorphism.
    - The test covers one prime and two curves. It does not transfer to binary Koblitz Frobenius orbits or to cryptographic sizes.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For an r-adding walk with r=16, detected fruitless-cycle lengths
        divide |Aut|, and lengths 3 and 6 occur with frequency 0 when
        |Aut|=2 and with frequency strictly above that null when an
        order-3 automorphism is included in the canonicaliser.
      rigorous_support: >-
        The orbit set of a group of order m is a block system of that
        group. A cycle created by returning to the same canonical
        representative under a nontrivial group element has length
        dividing m. The comparison distribution is the zero count on the
        |Aut|=2 walk, not a fitted constant. Random-mapping cycle
        statistics are a recalled model for the length-2 rate of the
        negation walk and are not used as a checked bound.
      validation_plan: >-
        Sample 20 walks of 5000 steps, r=16, on both frozen curves.
        Compare the length-3-or-6 fraction on the j=0 order-6 walk with
        the same fraction on the |Aut|=2 walk and with the negation-only
        walk on the j=0 curve. The predicted comparison is a gap of at
        least 0.01 against both nulls, and a length-2 fraction on the
        negation-only walk that is positive.
  target_complexity:
    time_exponent: >-
      Unchanged at 1/2. Generic rho meets the generic-group bound up to a
      constant. An orbit walk of order 6 multiplies the constant by
      1/sqrt(6) and does not change the exponent. This idea does not beat
      that exponent.
    memory_exponent: >-
      Unchanged. Distinguished-point storage stays O(1) per walker relative
      to N. This idea does not move the memory exponent of rho or of BSGS,
      whose table is on the order of sqrt(N).
    best_known: >-
      Automorphism-orbit rho, constant factor sqrt(|Aut|) and exponent 1/2,
      as recorded on KR-RHO-0528e7, together with the negation-map fruitless-cycle
      account on KR-RHO-fb88e6. This idea does not beat either constant.
    hidden_overhead: >-
      No o(1) term is claimed. The 1.15 band is an explicit instrument
      tolerance, not a hidden cofactor.
    tradeoff_note: >-
      The measurement sits at the low-memory end of collision search. It
      does not interpolate toward a BSGS table and does not change the
      van Oorschot–Wiener time-memory curve.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  novelty_status: unverified
