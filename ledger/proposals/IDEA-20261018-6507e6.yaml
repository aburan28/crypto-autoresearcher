      claim: first cell tripped E-random vs Z/N-random for F1/gnn at 0.079 vs 0.064
      verified_by: idea-generator this session, file read
    - ref: IDEA-20260906-d1494b
      provenance: internal
      claim: INV-3'' Cauchy-Schwarz envelope and its stated consequence
      verified_by: idea-generator this session, lines 107-117 read
    - ref: analysis/sbrg-845d35-design-probe-20261017/README.md
      provenance: internal
      claim: dimension-forced sharing read against a null with the same left-kernel dimension
      verified_by: idea-generator this session, file read
  assumptions:
    - The gate count k is taken from the frozen contract by the executor; 12 is the floor visible in EV-RELN-99c688.
  predictions:
    - metric: simulated cell false-halt rate of the frozen gates under true nulls
      direction: higher
      minimum_effect: at least 0.40; below 0.15 means the trips were implementation variance
    - metric: per-gate trip frequency over 20 null worlds, tree path only
      direction: different
      minimum_effect: within binomial error of nominal a; a gate at 3a or more is a localised defect
    - metric: class-max z of E arms against matched random bases, S=8..128 bits
      direction: different
      minimum_effect: "abs(z) < 3 at every S and rung; Z/N interval reaches half ceiling at S=8 (BLOCKING)"
  minimal_test:
    design: >-
      Stage A: arithmetic replay of the gate set on Gaussian nulls, minutes. Stage B:
      20 null worlds (E/random and Z/N-random bases, true Poisson-like labels) through
      the real trees path at N=2^14. Stage C: decision-list class-max at S=8,16,32,64,128
      on 3 curves x 3 bases x rungs 2^14..2^20 plus 200 matched random bases per cell.
    controls:
      - Z/N interval positive control for the search itself
      - label permutation of targets (class-max returns to the null)
      - Z/N-random relabelling as the lookup-capacity arm
    required_metrics: [cell false-halt rate, per-gate trip rate, class-max z per S, frontier slope in log N]
  falsification_conditions:
    - Stage A below 0.15 refutes multiplicity as the explanation of the tripped cells.
    - Z/N control missing at S=8 voids Stage C negatives.
    - "Any E arm with abs(z) >= 4 at two rungs is a structure candidate, not a result."
  confounders:
    - Greedy search is not the exact class maximum; the matched null runs the same search, which cancels it to first order.
    - Gate checks are correlated, so 1-(1-a)^k overstates; Stage B measures it.
  interpretation_limits:
    - Toy scale; random-base union bound is rigorous only for classes fixed independent of D. No ECDLP claim.
  heuristic_assumptions:
    - id: H1
      statement: For a fixed predicate, the cell total of a random base is Poisson-like with variance s M Delta.
      rigorous_support: Exact mean s M (KN-FIND-007), pairwise covariance -M/N^2 (79ff48, unreviewed); imitates the Bernstein bound for sums of weakly dependent counts.
      validation_plan: 200 random bases per rung; compare the class-max ECDF with the union-bound curve; largest-S tail check.
  target_complexity:
    time_exponent: no ECDLP algorithm; closure statement only. Lift N^d at s=cN^(-2d) needs S >= 0.72 c mu N bits
    memory_exponent: a table of that length, i.e. Theta(N) advice bits (Corrigan-Gibbs and Kogan style), so no sub-p^(1/2) route from short predicates
    best_known: p^(1/2) Pollard rho, O(1) memory
    hidden_overhead: the bound is for classes independent of D; learned classes pay ln(Q) for Q selection choices
    tradeoff_note: not applicable
  dominated_by: n/a (no result claimed)
  sota_delta: zero on every ECDLP axis; replaces an unpriced gate set by priced ones
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
