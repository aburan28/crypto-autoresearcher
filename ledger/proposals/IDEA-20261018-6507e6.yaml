idea:
  id: IDEA-20261018-6507e6
  question_id: RQ-RELN-61638a
  added: '2026-10-18'
  status: proposed
  proposed_by: idea-generator
  title: >-
    Occam-priced lift frontier plus a null-on-null calibration: what the
    Cauchy-Schwarz envelope leaves open at thin slices, and what two cells that each
    tripped a different gate are worth
  class: control
  claim: >-
    (A) Design false-halt rate. EXP-RELN-82f487 halts a cell when any null check trips;
    EV-RELN-99c688 lists >=12 such checks per cell. If checks are independent at
    two-sided level a, P(cell halts | all nulls true) = 1-(1-a)^k: a=0.05, k=12..30
    gives 0.46..0.79; a=0.0027 gives 0.03..0.08. Two of two cells halted, on
    different gates each time, as this predicts. Prediction: replaying the gate
    arithmetic on simulated nulls gives cell false-halt >= 40 percent, and 20 null
    worlds through the real tree path give per-gate trip rates within binomial error
    of nominal. (B) Envelope gap. d1494b INV-3'' bounds |rho-1| by sqrt(Delta(1-s)/(s mu)),
    which is O(1) at fixed density s and allows rho~N^d at s~N^(-2d) even with
    Delta=1, so "bounded Delta closes the grammar" holds only for s bounded below.
    (C) Occam frontier. For a class of 2^S predicates fixed before seeing a random
    base, max (rho-1) <= sqrt(2 S ln2 (1-s) Delta/(s mu N)); lift N^d at s=c N^(-2d)
    needs S >= 0.72 c mu N/Delta bits, a table as long as the count vector.
    Measured class-max lifts of decision lists (S=8..128 bits) on x-interval, QR and
    small-height bases sit inside the matched-random-base class-max null at z<3.
  mechanism: >-
    Object: the class-max lift as a function of description length S, a lossy
    projection (one number per class), with nothing claimed under any group action;
    class coordinate-dependent, pair (R1 x features, Sigma = generate-and-filter).
    Null matched in degrees of freedom by construction: the same class and the same
    search budget run on 200 random bases of equal size (the lesson of the sbrg-845d35
    probe, where counting alone manufactured sharing). A trained GNN has S ~ 3e5 bits,
    so the in-sample bound is 1.7 at N=2^20, s=1/8: only held-out scoring is
    informative, and each model-selection choice costs ln(Q) in the union bound.
    Cost of the one open number: a greedy decision-list search per base on
    exhaustive tables (about 200 features, 2^20 targets). Factor base: x-windows,
    KN-OPEN-020 none proposed.
  novelty_status: unverified
  citations:
