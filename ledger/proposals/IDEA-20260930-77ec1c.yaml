idea:
  id: IDEA-20260930-77ec1c
  question_id: RQ-CERTBIN-836ce2
  added: '2026-09-30'
  status: proposed
  approved_by: null
  title: >-
    Half-fold memory against the audit's 16-byte pair column: the column
    is the m = 4 table, not an m >= 5 feasibility bound
  class: measurement
  claim: >-
    Representation class R1 of RQ-ECDLP-623a32 (x-coordinate). The attack
    stage is relation decomposition, as a memory identity for the generic
    claw that realizes multiset membership, not as a solver. This record
    cannot change the time exponent of the discrete logarithm, and that
    is why it is the right building block: it retires one column of the
    m = 83 / m = 131 counting table before any solver is sized to that
    column.

    Let k = floor(m/2). The generic claw that decides whether a target
    is an unordered m-multiset sum, with repetition allowed, stores one
    half and enumerates the other. Its memory is M_k = C(B+k-1, k)
    entries, not M_pair = B(B-1)/2. Define R_mem(m, B) = M_k / M_pair.
    Closed-form evaluation at the audit's 1% rows, 16 bytes per entry,
    arithmetic only:

    At m = 4, R_mem = 1.000002 (degree 83, B = 872790) and 1.000000
    (degree 131, B = 3574951633). The pair column is the half-fold table.

    At m = 3 the balanced claw stores pairs and scans points, so the
    pair column is the large endpoint of the tradeoff, not a memory
    lower bound. The small endpoint is the factor base itself
    (R_mem = 3.806e-8 at degree 83, B = 52544464), and the time endpoint
    is then the pair enumeration.

    At m = 7, k = 3, R_mem = 1776.33 at degree 83 (B = 5325): the 3-fold
    table is 375.2 GiB at 16 bytes, against the audit's 0.211 GiB pair
    column. The complementary 4-fold side is C(B+3, 4) = 3.353949e13
    entries. At degree 131 (B = 617668), R_mem = 2.058907e5.

    At m = 10, k = 5, R_mem = 8.021340e6 at degree 83 (B = 780): 36313.6
    GiB against 0.004527 GiB. At degree 131 (B = 21837), R_mem =
    1.736387e11.

    The time of one membership test that stores the k-fold half is
    Theta(C(B+(m-k)-1, m-k)) group additions. At even m on the cap locus
    B ~ (m! r)^{1/m} this is (m!)^{1/2} r^{1/2} up to lower-order terms,
    a sqrt(m!) multiple of a square root, which does not sit under
    Frobenius rho. No Gröbner solve at B = 52 million is proposed. No
    discrete logarithm is proposed.
  mechanism: >-
    OBJECT FRAME. Representation: R1, x-coordinates of factor-base points,
    used only as keys in a sum table. Operation set Sigma: the claw
    (A, S) -> A + S, where A is a stored k-fold multiset sum and S is an
    enumerated (m-k)-fold multiset sum. Sigma is not the full translation
    action. Trichotomy: branching (IDEA-20260806-c5d183). A hit is a claw.
    It does not propagate under translation by an element outside the
    stored half.

    LOSSY-PROJECTION TEST, against Sigma. The projection sends a pair of
    halves to the group sum and keeps the pair only on a claw with the
    target. It discards the half-identities of non-claws. The discard is
    compatible with Sigma because the membership bit is constant on
    non-claws and is determined by the claw when one exists. It is lossy
    whenever more than one pair of halves is stored. Keeping every half
    with no identification would be the table itself, which is the object
    being priced, not a coordinate change of the group element.

    OPEN NUMBER. M_k, in entries and in bytes at 16 bytes per entry, and
    the ratio R_mem. Under the regime C(B+m-1, m) << r the expected fiber
    is 1, so a claw is unique when it exists and branching b = 1. That
    uniqueness is a prediction, checked on the toy cell, not an
    assumption fed back into the audit rows.

    OFF-LIMITS COMPONENTS. F2 is the family (factor-base decomposition).
    What is added is the memory identity for the audit's published
    (degree, m, B) rows, not a new decomposition algorithm.
    IDEA-20260926-d3c5a5 ports a meet-in-the-middle engine for m in {3, 4}
    on toy cells and states that nothing there bears on ECC2K-130 except
    negatively. It does not evaluate R_mem at the 1% rows for m = 7 and
    m = 10. F7 (a preprocessing table) is the data structure being priced;
    it is named as a component, and the claim is that the pair table is
    the wrong component for m >= 5. The factor base remains the
    bounded-degree linear subspace of KN-OPEN-020, a component, not an
    escape.

    WHY THIS CANNOT MOVE THE EXPONENT, AND WHY IT IS STILL THE BUILDING
    BLOCK. Lemma (size): the stored half has M_k entries. Lemma (time):
    one exact membership test enumerates the complementary half. Lemma
    (cap): at even m and B = (m! r)^{1/m}, the enumerated half has size
    (m! r)^{1/2} / ((m/2)!) up to the stars-and-bars versus powers
    discrepancy, hence time (m!)^{1/2} r^{1/2} / ((m/2)!). Compared with
    rho's Theta(r^{1/2} m^{-1/2}), the ratio is exponential in m log m
    from Stirling, in the wrong direction. The building block is the
    retirement of the pair column as a feasibility signal at m = 7 and
    m = 10, where a reader can otherwise treat 0.211 GiB and 0.00454 GiB
    as the memory of a 1% method.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260926-d3c5a5
      provenance: internal
      claim: >-
        Meet-in-the-middle tables for m in {3, 4} on toy CERTBIN cells.
        This record adds R_mem at the audit's m = 7 and m = 10 1% rows
        and the cap-locus comparison with rho. It does not port the engine.
      verified_by: idea-generator session 2026-09-30, file read
    - ref: IDEA-20260926-4b65e3
      provenance: internal
      claim: >-
        Cap locus B_cap = (m! 2^{131})^{1/m} and the time line
        (1/2 - 1/m). This record prices memory at that shape and does
        not restate the oracle budgets.
      verified_by: idea-generator session 2026-09-30, file read
    - ref: KN-OPEN-020
      provenance: internal
      claim: >-
        The subspace factor base is the scoped bounded-degree class, used
        only so the table has keys.
      verified_by: idea-generator session 2026-09-30, file read
    - ref: "van Oorschot and Wiener, parallel collision search (recalled; not opened this session)"
      provenance: recalled
      claim: >-
        Storing one side of a claw and enumerating the other is the
        classical split. Hedge: recalled. The binomial evaluations in
        the claim were computed in this session from C(B+k-1, k) and
        B(B-1)/2; they are not taken from that paper.
      verified_by: null
  assumptions:
    - >-
      F2 and F7 are components. The proposal is the identity R_mem, not
      a new walk and not a new factor base.
    - >-
      Entries are unordered multisets with repetition, matching the
      audit ceiling. The pair column uses unordered pairs without
      repetition, B(B-1)/2, which is the count that reproduces the
      audit's 16-byte GiB figures (degree 83, m = 3, B = 52544464 gives
      2.057046e7 GiB).
  proof_search_map:
    bottleneck: >-
      The reading of the audit's last column as the memory of an m-sum
      membership test for every m. Replacing the column does not remove
      a step of rho.
    baseline_embedding:
      parameter_slice: >-
        The eight 1% rows in the handoff (degrees 83 and 131, m in
        {3, 4, 7, 10}) and the pair-GiB figures printed there.
      reproduction_check: >-
        Recompute B(B-1)/2 * 16 / 2^{30} and match the printed GiB to
        three significant figures before any half-fold number is used.
        This session's check already matches 20,570,462.6 GiB, 5,675.6
        GiB, 0.211 GiB, and 0.00454 GiB at degree 83.
    observation_collision:
      observable: whether a planted m-sum is found by the k-fold table and missed by a pair-only table
      distinct_preimage_search: >-
        One planted 7-multiset on the toy curve whose sum is not equal
        to any unordered pair sum from the same base. Two objects (the
        pair table and the 3-fold table) with different answers on that
        point.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The membership witness represented as a k-fold multiset plus a
          complementary multiset, instead of as a pair.
        predicted_gain: >-
          A correct memory figure at m = 7 and m = 10. No time-exponent gain.
    quantifier_order: >-
      FOR ALL eight audit rows, R_mem equals M_k / M_pair as computed
      from the binomial coefficients. Separately, FOR ALL even m >= 4,
      the cap-locus claw time is at least on the order of (m!)^{1/2}
      r^{1/2} / ((m/2)!), which is not below rho. Both are identities,
      checked by arithmetic, not existence claims.
    method_ceiling:
      strongest_certifiable_claim: >-
        The pair column equals the half-fold memory at m = 4 and
        understates it by the stated ratios at m = 7 and m = 10. The
        generic claw does not beat Frobenius rho.
      nearby_object_control: >-
        At m = 2 the half-fold table is the set of points and the pair
        column is a different object; applying R_mem at m = 2 without
        changing k is a proves-too-much use. The toy test includes an
        m = 2 cell where a pair table is the wrong instrument for a
        different reason (it answers 2-sums, and the claim must not say
        it fails at m = 2).
    proof_obligations:
      - claim: M_k = C(B+k-1, k) counts unordered k-multisets with repetition
        responsibility: size
      - claim: one claw test costs Theta(C(B+(m-k)-1, m-k)) additions if the half is stored
        responsibility: runtime
      - claim: at even m on the cap locus the time is a sqrt(m!) multiple of r^{1/2}, above rho
        responsibility: runtime
      - claim: the identity does not depend on the curve or on ord_m(2)
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: R_mem_at_degree83_m7
      direction: higher
      minimum_effect: equals 1776.33, not 1; a measured toy ratio below 2 at the scaled cell falsifies the binomial setup
    - metric: pair_table_finds_planted_7_sum
      direction: lower
      minimum_effect: the pair-only table returns no witness for a planted 7-sum that is not a 2-sum; a hit falsifies the discriminating instance
    - metric: claw_additions_over_rho_iterations_at_cap_m4
      direction: higher
      minimum_effect: the closed form stays above 1; this is arithmetic, not a timed race
  minimal_test:
    design: >-
      Toy cell, E_0 over F_{2^19}, m = 7, B = 16. Store the 3-fold
      multiset table and the unordered-pair table. Plant one 7-multiset
      whose sum is not a pair sum (reject and redraw if it is). Query
      both tables. Separately recompute the eight audit ratios from
      binomial coefficients and compare to the figures in this claim.
      Do not allocate the degree-83 B = 52 million table. Do not run a
      Gröbner basis. Do not solve a discrete logarithm.
    controls:
      - An m = 2 query that the pair table must answer, so a universal lookup bug cannot fake a pair-table miss
      - An m = 4 cell at B = 16 where R_mem is predicted within 1 percent of 1
      - A relabelled Z/rZ sum, same multisets, to show the byte ratio does not depend on the curve law
    required_metrics:
      - entry counts and byte counts of both tables at B = 16, m = 7
      - whether each table returns the planted witness
      - the eight recomputed R_mem values next to this claim's figures
  falsification_conditions:
    - >-
      The recomputed degree-83 m = 7 ratio differs from 1776.33 by more
      than 0.1: the binomial convention (repetition, k = floor(m/2)) does
      not match this claim and the claim is withdrawn.
    - >-
      The pair-only table returns a correct witness for the planted 7-sum:
      the discriminating instance was a 2-sum in disguise, and the test
      is redrawn once. A second disguised draw means the instance
      generator is wrong.
    - >-
      The m = 4 toy ratio differs from 1 by more than 1 percent: the pair
      column is not the m = 4 half-fold table under this encoding, and the
      "equals at m = 4" sentence is false.
  confounders:
    - >-
      Counting ordered tuples, or forbidding repetition, changes R_mem.
      The test logs the convention in the output.
    - >-
      A 16-byte entry is an accounting choice inherited from the audit,
      not a memory lower bound. The ratio is invariant to the byte width;
      the GiB figures are not.
    - >-
      Hash-table load factor can multiply bytes by a small constant. The
      metric is entry count first, resident bytes second.
  interpretation_limits:
    - >-
      KN-OPEN-020: no factor-base escape. Implicit-membership or
      high-degree bases are not constructed here. A base that does not
      materialize halves would need a different memory argument; this
      record does not supply one.
    - >-
      The time comparison with rho is a closed form at the cap locus, not
      a measured S. Full-cost S stays null.
    - >-
      Degree 83 and degree 131 share the identity because it is
      combinatorial. That transfer is not a transfer of solver behavior
      and does not use ord_m(2).
    - No n = 53 wall-clock ratio is cited.
  heuristic_assumptions:
    - id: H1
      statement: >-
        When C(B+m-1, m) <= r/64, a uniform random sum map has fibers of
        mean 1 + Theta(C/r), so the claw that stores M_k entries has
        branching b = 1 and does not need a collision list. The memory
        identity M_k itself does not depend on this heuristic.
      rigorous_support: >-
        Occupancy theorem for a random function into a set of size r, as
        in H1 of IDEA-20260930-f1d8ff. The memory count is an identity
        and is not heuristic. The uniqueness of the witness is the part
        that imitates the occupancy theorem.
      validation_plan: >-
        On the B = 16, m = 7, n = 19 cell, compute the maximum number of
        3-fold multisets that share a sum, over the whole table (C is
        small). Predicted maximum fiber is 1. Tail check: a fiber >= 3
        falsifies uniqueness at this cell and is reported; the byte ratio
        is still read. Parameters: n = 19, m = 7, B = 16, one seed.
        No extrapolation to B = 5325 is required for the ratio, which is
        an identity.
  target_complexity:
    time_exponent: >-
      Generic claw: r^{1/2} times (m!)^{1/2} / ((m/2)!) at even m on the
      cap locus, which is above the Frobenius-rho exponent 1/2. No
      improvement is claimed. Odd m is the larger half, exponent
      ceil(m/2)/m on B and hence at least 1/2 on r at the cap.
    memory_exponent: >-
      M_k entries. At the degree-83 m = 7 1% row, 2.518e10 entries
      (375.2 GiB at 16 bytes), against rho's distinguished-point memory
      which can be polylogarithmic in r. The claw is worse on memory.
    best_known: >-
      Frobenius-class Pollard rho, about sqrt(pi * r / (4 * m))
      iterations. ECC2K-130 about 2^60.9 iterations. Memory of rho is
      the distinguished-point store, not a half-fold table.
    hidden_overhead: >-
      Stirling's (m!)^{1/2} / ((m/2)!) is the explicit overhead, not an
      o(1). Stars-and-bars versus B^m/m! is a (1 + O(m^2/B)) factor at
      these B, disclosed by using the binomial form in the claim.
    tradeoff_note: >-
      Storing fewer than M_k entries and recomputing is the classical
      claw tradeoff (time times memory about the product of the two
      half sizes). The audit's pair column is one point on that curve
      only when k = 2. Parallel lookup does not change the product.
      Dominated by rho on time and on memory together.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
