      - KR-RHO-037e22
      - KR-RHO-13bf67
      - KR-RHO-7d93f6
      - KR-RHO-ea34b8
      - KR-RHO-6239aa
    nearest:
      - ref: KR-RHO-7d93f6
        provenance: internal
        relation: adjacent
        delta: >-
          That row is the collision time-memory bound T^2 S = Theta(C^2 N).
          This record does not claim that storing more pairs speeds rho.
          It prices a different table (k-fold multisets) at eight concrete
          (degree, m, B) rows. At degree 83, m = 7, the table is 1776
          times the pair column. Map row read; Dinur's paper was not opened.
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: adjacent
        delta: >-
          The generic lower bound dominates the claw. Quantitative delta
          on the cap locus: a sqrt(m!) overhead above r^{1/2}, in the
          wrong direction. No exponent improvement.
      - ref: KR-IC-5a43e5
        provenance: internal
        relation: orthogonal
        delta: >-
          Summation polynomials are not the proposal. The proposal is the
          memory of the generic realization of the same multiset count the
          audit already uses.
