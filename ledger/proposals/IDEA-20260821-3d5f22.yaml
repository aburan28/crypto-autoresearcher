idea:
  id: IDEA-20260821-3d5f22
  question_id: RQ-CLGP-b99df5
  research_question: RQ-CLGP-b99df5
  added: '2026-08-21'
  title: >-
    THE n-TORSION EDGE CHARACTER chi IS THE EXPLICIT BRIDGE MAP RQ-CLGP DEMANDS:
    it is a 1-cocycle of the Cl(O)-torsor with values in (Z/N)^*, it is FREE on
    principal ideals and carries nothing but the torsor coordinate off them, the
    forward reduction dies on a cardinality bound that no vectorization
    improvement can repair -- and the one live question, whether chi is
    predictable from cheap vertex labels, is a direct attack on the p^{1/4}
    vectorization incumbent and is measurable exactly at toy scale
  class: mechanism

  claim: >-
    FIVE CLAIMS. C1-C4 ARE DERIVATIONS COSTING NO COMPUTE AND TOGETHER DISCHARGE
    RQ-CLGP-b99df5'S DECISION TARGET ("Admit a reduction only with an explicit
    bridge map; a failed reduction with a named obstruction is the expected and
    useful outcome"). C5 IS THE ONE LIVE, EXPONENT-RELEVANT QUESTION THEY LEAVE
    OPEN, AND IT IS THE ONLY PART REQUIRING AN EXPERIMENT.

    (C1) THE BRIDGE MAP, WRITTEN DOWN. Let E/F_p be ordinary with Frobenius pi,
    O = End_{F_p}(E), and let N be a prime with N || #E(F_p). Then
    n := (N, pi - 1) is an O-ideal of norm N and G := E(F_p)[N] = E[n], a free
    rank-one O/n-module with O/n ~= F_N (this identification is already committed
    in the corpus, IDEA-20260807-02b7b2 and IDEA-20260807-5158fa). For any
    O-ideal a coprime to n, the isogeny phi_a : E -> a*E has degree N(a) coprime
    to N, so it restricts to an O/n-module ISOMORPHISM G_E -> G_{a*E}. Fix any
    LABELLING rho assigning to each curve E' of the level a generator
    rho(E') in G_{E'}, and define
        chi_rho(a, E) := log_{rho(a*E)} ( phi_a( rho(E) ) )  in (Z/N)^*.
    This is the bridge map: an explicit, well-defined function from the
    Cl(O)-torsor to the automorphism group of the point group's N-part.

    (C2) IT IS A COCYCLE, AND THAT IS ITS ONE-STEP PROPAGATION RULE.
    chi_rho(ab, E) = chi_rho(b, a*E) * chi_rho(a, E), because phi_{ab} =
    phi_b o phi_a up to the identification of codomains. So chi_rho is a
    1-cocycle of the simply transitive Cl(O)-action with values in (Z/N)^*, and
    changing the labelling rho -> [c(.)] o rho changes chi by the coboundary
    c(a*E)/c(E). Consequently EVERY candidate bridge that assigns a scalar to an
    isogeny-class edge and is compatible with composition equals chi_rho for some
    labelling: chi is not one bridge among many, it is the universal one.

    (C3) THE PRINCIPAL PART IS FREE, WHICH MAKES "THE BRIDGE IS CONSTANT" AN
    IDENTITY RATHER THAN A VERDICT. For a principal ideal (alpha) with alpha in
    O coprime to n, a*E = E and phi_{(alpha)} = alpha acts on G = E[n] as
    multiplication by the residue alpha mod n in O/n ~= Z/N. That residue is
    computable in polynomial time with NO discrete logarithm: writing
    alpha = u + v*pi with u, v in Z and using pi = 1 mod n gives
    alpha = u + v mod N. So chi is poly-time computable on the STABILISER of the
    action, and every bit of its non-trivial content sits in the torsor
    coordinate. This upgrades the standing closure of IDEA-20260807-5d7606
    ("OBS-1: the bridge is constant") from prose to an identity with an explicit
    evaluation rule, which is exactly what docs/inventor-protocol.md section 4
    requires of a closure.

    (C4) THE FORWARD REDUCTION DIES ON CARDINALITY, AND THE BOUND IS
    INFORMATION-THEORETIC. |Cl(O)| = h(D) is O(sqrt(|D|) log|D|) unconditionally
    and |D|^{1/2 + o(1)} by Siegel (ineffectively), while |G| = N which for the
    campaign's target family is of size p ~ |D|. Any reduction of ECDLP to
    Cl(O)-vectorization that routes a target through chi therefore compresses ~p
    possibilities into at most h ~ p^{1/2} classes and leaves at least
    N/h ~ p^{1/2} candidates; composing a PERFECT vectorization oracle with
    generic search still costs p^{1/2 + o(1)}. NO EXPONENT GAIN IS AVAILABLE ON
    THIS ROUTE, and no improvement to vectorization -- classical or quantum --
    can repair it, because the bound is on the size of the acting group and not
    on the cost of computing in it. NAMED OBSTRUCTION: OBS-CARD, the acting
    group is square-root-small relative to the point group.

    (C5) THE LIVE QUESTION, WHICH POINTS AT VECTORIZATION RATHER THAN AT ECDLP.
    Because the action is simply transitive, chi_rho is ALWAYS a coboundary --
    there always exists psi with chi_rho(a, E) = psi(a*E)/psi(E) -- but psi is
    obtained by transporting from a base curve, i.e. computing psi IS solving
    vectorization. CLAIM: psi is therefore a vectorization-hard object, and the
    decision-relevant question is whether a poly-time APPROXIMATION to it exists.
    Concretely: for a small prime ell split in O, is the edge character
    chi_l(E) := chi_rho(l, E) predictable, better than chance, from labels of E
    and l*E computable in poly(log p) time -- j-invariants and their ordering,
    rational 2-torsion type, ell=2 volcano level, group structure (n_1, n_2),
    Hilbert-class-polynomial root index -- when rho is the concrete labelling
    "the point of G with least x-coordinate"? A predictor materially better than
    chance would give a poly-time partial trivialisation of the torsor and would
    attack Cl(O)-vectorization on ORDINARY prime-field classes below its
    classical p^{1/4} meet-in-the-middle incumbent. A predictor at chance,
    measured against a random-labelling null with a stated minimum detectable
    effect, converts OBS-CARD's companion -- "cheap labels carry no torsor
    information" -- from an assumption into a measurement.

  mechanism: >-
    RQ-CLGP-b99df5's standing position is that "the two problems live on
    different objects". That is right, and this record says precisely how they
    fail to meet. The point group and the isogeny class are related by exactly
    one natural structure: G = E[n] is an O/n-module, so the class group acts on
    the curves and simultaneously acts on their N-torsion, and comparing the two
    actions produces a scalar per edge. The comparison requires choosing a
    generator on each curve, and there is no canonical generator of a group of
    prime order -- that is the entire obstruction, and it is a torsor obstruction,
    not a computational one. Two consequences follow in opposite directions.
    Downward: because Cl(O) is square-root-small, even a free trivialisation
    would not move the ECDLP exponent (C4). Upward: because the trivialisation
    psi IS the vectorization solution, any cheap statistical handle on chi is a
    handle on vectorization, which is the p^{1/4} problem underlying
    CSIDH-style constructions on ordinary curves. So the honest place to spend
    compute in this lane is not the ECDLP direction, which is closed by a
    counting bound, but the vectorization direction, which is open and which the
    lane has never measured.

  novelty_status: unverified

