  novelty_screen:
    method: >-
      Filesystem screening; the crypto-kb retrieval server is bound to ':memory:'
      and returns nothing. Read: the session prior-art digest covering all 15
      filed RQ-CLGP-b99df5 proposals plus the 14 RQ-CANL and 11 RQ-GGMB entries
      that touch the same objects; ledger/questions/RQ-CLGP-b99df5.yaml;
      GOAL-ENDO-001/goal.yaml. No web source was opened for this record.
    results: >-
      NEAREST FILED WORK, NAMED. (1) IDEA-20260807-02b7b2 and IDEA-20260807-5158fa
      both establish G = E[n] with n = (N, pi - 1). This record TAKES that as its
      starting point and adds the edge character, the cocycle law, the free
      evaluation on principal ideals, and the compression bound. (2)
      IDEA-20260807-0fafe8 and IDEA-20260807-5d7606 write the two reductions with
      quantifier order and record OBS-1 "the bridge is constant" -- as PROSE. This
      record supplies the object that makes OBS-1 an identity with an evaluation
      rule and a measurable residual. (3) IDEA-20260807-bbdcf3 puts h(O) and N
      side by side. This record turns that into a quantified compression argument
      with a stated consequence for the exponent. (4) IDEA-20260807-1b7241,
      -326442 and -413fcc close the ORACLE route via a generic-group simulator and
      name a residual open class; this record does not route through an oracle at
      all, which is precisely the gap IDEA-20260807-4e8da3 says the CAGG closure
      leaves open. (5) IDEA-20260811-10eacc identifies a level with Cl(O) after
      choosing a base vertex and studies a functional C on it -- the same
      identification, but a functional on VERTICES, not a character on EDGES with
      a composition law. (6) IDEA-20260811-9bb909 (RQ-EWALK) defines a LOCAL LABEL
      computable from (a,b) in poly time -- this record reuses that concept as the
      predictor's input feature set, and cites it as the source of the feature
      list rather than reinventing it.
    verdict: >-
      UNVERIFIED, and distinct from all six. What no filed record contains: the
      scalar chi_rho(a, E) as an object with a composition law; the observation
      that it is free on the stabiliser and therefore that the whole content is
      the torsor coordinate; the compression bound stated as a barrier that no
      vectorization improvement can repair; and -- the only part that costs
      compute -- the reframing of the lane's live question as an attack on
      VECTORIZATION rather than on ECDLP, with a concrete predictability
      experiment. The cohomological language is of course standard mathematics;
      the honest label is `unverified` because no external source was opened.

  object_first_candidate:
    tracked_object: >-
      chi_l(E) -- the scalar in (Z/N)^* by which a fixed small horizontal
      ell-isogeny moves the canonically labelled generator of the N-torsion --
      tracked along walks in the horizontal ell-isogeny graph of one level.
      Established families declared off-limits as the primary lens: point
      decomposition / Semaev index calculus, generic-group oracle adjudication,
      canonical lifts and height arguments, and rho-type collision walks. The
      object here is an EDGE-valued scalar on the isogeny graph, which none of
      those families tracks.
    lossiness: >-
      PASSES THE LOSSY-PROJECTION TEST, AND THE ARGUMENT IS EXPLICIT. The
      projection phi |-> chi(phi) discards the isogeny's kernel, its degree, its
      rational maps, the codomain's coordinates and its whole action on E[m] for
      every m coprime to N; it retains log_2 N bits. It is NOT a change of
      coordinates: the fibre over a fixed value of chi contains isogenies of
      unboundedly many distinct degrees (compose with any principal ideal (alpha)
      whose residue alpha mod n is 1, and infinitely many such alpha exist), so
      the forgotten structure is genuinely unrecoverable from the retained part.
      What is discarded is discarded COMPATIBLY with the operation the target
      performs -- composition of isogenies -- because the cocycle law of C2 makes
      the retained scalar propagate deterministically under composition. This is
      the exact contrast with the (Delta, Pi) example of KN-LIT-7595, where
      nothing was discarded and nothing was gained.
    propagation: >-
      One-step propagation is defined, deterministic and cheap to measure:
      chi_{l1 l2}(E) = chi_{l2}(l1 * E) * chi_{l1}(E), an exact identity that
      doubles as a CERTIFICATE -- walking any closed loop in the level must return
      the product equal to (alpha mod n) for the principal ideal the loop
      represents, a value computable independently by C3. A loop whose product
      disagrees is an implementation error, detected without any reference to the
      hypothesis under test.
    survival_score: >-
      Survives as long as N is prime, N^2 does not divide #E(F_p), the isogeny
      degree is coprime to N, and the level is non-trivial (h > 1). It dissolves
      when N | deg phi (the restriction stops being an isomorphism), when the
      curve is supersingular (O is non-commutative and the torsor language fails),
      and at the crater/floor boundary where horizontal isogenies at the conductor
      prime do not exist -- which is exactly the vertical case GOAL-ENDO-001's N18
      records as unimplemented, and which this proposal deliberately avoids by
      using only split primes coprime to the conductor.

  proof_search_map:
    bottleneck: >-
      The absence of any map from the point group G to the Cl(O)-torsor. Every
      proposed reduction in this lane needs one and none exists; C1 supplies the
      map in the OTHER direction (torsor to Aut(G)) and C4 shows why reversing it
      cannot help. For C5 the bottleneck is different and is the one worth
      attacking: computing the trivialising function psi, which is the
      vectorization problem itself.
    baseline_embedding:
      parameter_slice: >-
        The principal-ideal slice a = (alpha). There chi_rho((alpha), E) =
        alpha mod n, phi_a is an endomorphism, and the construction degenerates
        to the already-committed statement that every endomorphism acts on a
        prime-order subgroup as a scalar (H-ENDO-001). That is the exact old-method
        boundary this object must reproduce.
      reproduction_check: >-
        SYMBOLIC: verify alpha = u + v*pi and pi = 1 mod n give alpha = u + v
        mod N, then instantiate on one toy curve by computing [alpha]P directly
        and comparing with [u + v mod N]P for several alpha in O. FROZEN FIXTURE:
        archive the (alpha, u, v, residue, point) tuples. A failure here means the
        O-module identification is wrong and every later arm is void.
    observation_collision:
      observable: >-
        chi_l(E), the edge character value in (Z/N)^*.
    distinct_preimage_search: >-
      A COLLISION EXISTS BY CONSTRUCTION AND IS THE REASON C1 CANNOT BE PUSHED
      FURTHER. Two labellings rho and rho' = [c(.)] o rho differing by any
      function c into (Z/N)^* produce edge characters differing by the coboundary
      c(a*E)/c(E); in particular for any target value there is a labelling
      realising it on a given edge. So chi is identifying only RELATIVE to a fixed
      labelling, and no intrinsic conclusion about the torsor position may be read
      from a chi value alone. Two ground-truth objects on opposite sides of the
      claimed conclusion: the labelling that makes chi identically 1 on a spanning
      tree (which exists, and encodes no torsor information) and a labelling for
      which chi is injective on a cyclic subgroup of Cl(O) (which also exists, and
      encodes all of it). The experiment is therefore about ONE concrete,
      poly-time labelling -- least-x -- and generalises to no other.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move to O/n, where the endomorphism action is an exact equality
          alpha |-> u + v mod N rather than an isogeny evaluation. Obligations:
          encoding (writing alpha in the pi-basis), completeness (every alpha
          coprime to n is reached), soundness (the residue really is the scalar),
          transfer (the identification O/n ~= Z/N depends on N || #E), cost-loss
          (none -- the reduction is exact and poly-time).
        predicted_gain: >-
          Makes the principal part free, which is what isolates the torsor
          coordinate as the sole residual content and lets C4's counting argument
          be applied to it cleanly.
      - transform: observable_fiber
        proposed_object: >-
          Hold chi_l fixed and vary the ideal class; search for an intrinsic
          invariant of the curve pair separating the resulting classes. If none
          exists at toy scale, C4's compression is tight and the lane's closure is
          measured rather than asserted.
        predicted_gain: >-
          Converts OBS-CARD from a counting bound into a bound with a measured
          companion, which is what makes it re-scopable by a later reader.
    quantifier_order: >-
      THE HOPED-FOR STATEMENT, WRITTEN OUT AND THEN DENIED: "FORALL p, FORALL
      orders O, FORALL levels, THERE EXISTS a poly(log p)-time labelling rho such
      that FORALL ideals a coprime to n, chi_rho(a, E) is computable in
      poly(log p) time from (E, a*E) alone." This is FALSE unless vectorization is
      easy, because such a rho yields psi and psi solves vectorization. The
      witness rho is allowed to depend on the LEVEL but not on the ideal, and it
      is exactly that uniformity which fails. THE STATEMENT ACTUALLY TESTED IN C5
      IS WEAKER AND HAS ITS QUANTIFIERS IN A DIFFERENT ORDER: "FOR THE ONE FIXED
      labelling rho = least-x, and FOR EACH tested split prime l, THERE EXISTS a
      poly-time predictor F from cheap labels to (Z/N)^* whose accuracy on
      held-out curves exceeds chance by more than the stated minimum effect." A
      positive there is a statement about one labelling and finitely many primes,
      never about all labellings, and the record may not be read as more.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On this toy class at this N, for the least-x labelling and these split
        primes, a predictor built from this feature set does (or does not) beat
        chance by delta, with the stated minimum detectable effect." It can never
        certify that NO poly-time labelling trivialises the torsor -- that is a
        statement about all labellings and no finite experiment reaches it -- and
        it can never certify an ECDLP consequence, which C4 forecloses
        independently of any measurement.
      nearby_object_control: >-
        A LEVEL WHERE VECTORIZATION IS TRIVIALLY EASY: the crater of the same
        class, where h(-59) = 3, so the torsor has three elements and any
        predictor MUST succeed. If the predictor fails at h = 3 it is broken and
        no negative may be read from its failure at h = 72. Second nearby object:
        a randomly relabelled torsor of the same size, where chi is uniform by
        construction and the predictor MUST fail -- a predictor that succeeds
        there is fitting the label set, not chi.
    proof_obligations:
      - claim: "n = (N, pi-1) has norm N and G = E[n] is free of rank one over O/n ~= F_N"
        responsibility: baseline
      - claim: "phi_a restricts to an O/n-isomorphism when gcd(N(a), N) = 1"
        responsibility: correctness
      - claim: "chi_rho(ab,E) = chi_rho(b,a*E) chi_rho(a,E) and relabelling changes chi by a coboundary"
        responsibility: interface
      - claim: "chi_rho((alpha),E) = alpha mod n = u+v mod N, poly-time, no DL"
        responsibility: feasibility
      - claim: "h(D) <= O(sqrt(|D|) log|D|) so the compression leaves >= N/h ~ p^{1/2} candidates"
        responsibility: size
      - claim: "composing a perfect vectorization oracle with generic search costs p^{1/2+o(1)}"
        responsibility: runtime
      - claim: "the least-x predictor beats / does not beat chance by delta on held-out curves"
        responsibility: success_probability
      - claim: "toy tier, one class, N = 331, finitely many primes and one labelling"
        responsibility: scope
    not_applicable_reason: null

  assumptions:
    - >-
      The toy target is the p = 4001, t = 30 class with #E = 3972 = 2^2 * 3 * 331,
      so N = 331 and G = E[n] has order 331; discrete logarithms in G are
      exhaustive at negligible cost, which is what makes chi directly measurable.
      The executor must confirm 331 || 3972 (it does: 3972 = 12 * 331) before
      relying on the O-module identification.
    - >-
      Split primes coprime to the conductor exist and give HORIZONTAL isogenies
      constructible by the existing point-based tooling. For D_0 = -59 the
      Kronecker symbols give (-59/3) = (1/3) = 1, (-59/5) = (1/5) = 1 and
      (-59/7) = (4/7) = 1, so l = 3, 5, 7 all split; and 3 | #E = 3972 supplies a
      rational 3-torsion kernel, so harness/isogeny_class.py's point-based
      horizontal construction applies. NO VERTICAL ISOGENY IS NEEDED, which is
      deliberate: GOAL-ENDO-001's N18 records the vertical/conductor-prime
      construction as unimplemented and this design must not depend on it.
    - >-
      The least-x labelling is computable: enumerate x = 0, 1, 2, ... , lift, and
      multiply by the cofactor #E/N = 12 to land in G, keeping the first non-zero
      result. At toy scale this is trivial; at cryptographic scale it is
      poly(log p) only when the cofactor is small, and that restriction is stated
      rather than assumed away.

  predictions:
    - metric: >-
        loop_certificate_pass_rate: fraction of closed walks in the level for
        which the product of chi around the loop equals the independently
        computed residue alpha mod n of the principal ideal it represents
      direction: different
      minimum_effect: >-
        100%, zero tolerance. Anything below is an implementation error and halts
        the experiment; this is a solver-independent certificate in the sense of
        docs/claims-and-verification.md and is re-verifiable by code that never
        touches the isogeny construction.
    - metric: >-
        principal_residue_agreement: fraction of tested alpha in O for which
        [alpha]P computed on the curve equals [u + v mod N]P
      direction: different
      minimum_effect: >-
        100%, zero tolerance. This is the baseline-embedding reproduction check.
    - metric: >-
        predictor_accuracy of chi_l(E) from cheap vertex labels on held-out
        curves, for each tested split prime l
      direction: higher
      minimum_effect: >-
        Must exceed the permutation null's 99th percentile by at least the stated
        MDE. At N = 331 chance is 1/330 = 0.0030 and with 72 curves per level the
        MDE is coarse; the run must REPORT the MDE and refuse to interpret an
        effect below it, rather than quoting a p-value.
    - metric: >-
        chi_uniformity: Kolmogorov-Smirnov / chi-square distance of the observed
        chi_l distribution from uniform on (Z/N)^*
      direction: different
      minimum_effect: >-
        Reported with its power. A significant departure from uniform is itself a
        finding about the least-x labelling independent of any predictor.
    - metric: >-
        crater_control_accuracy: predictor accuracy on the h = 3 crater level
      direction: higher
      minimum_effect: >-
        Near 1.0. Failure here voids every negative read from the h = 72 level.
    - metric: >-
        random_relabelling_null_accuracy
      direction: lower
      minimum_effect: >-
        At chance, 1/330 within Monte-Carlo error. Success here means the
        predictor is fitting labels, not chi, and the positive arm is void.
    - metric: >-
        compression_ratio N/h computed for the tested class and for a
        cryptographic-size reference
      direction: higher
      minimum_effect: >-
        >= sqrt(N) up to the class-number constant. This is arithmetic, reported
        to make OBS-CARD a measured obstruction with units rather than a verdict.

  minimal_test:
    design: >-
      FOUR STEPS, ALL AT TOY SCALE, NONE REQUIRING A VERTICAL ISOGENY.
      STEP 1 (zero compute, gate): derive n = (331, pi - 1), verify N(pi - 1) =
      3972 and 331 || 3972, and verify the principal-residue rule
      chi((alpha)) = u + v mod 331 symbolically and on one curve. Halt on failure.
      STEP 2: on ONE level of the p = 4001 class (the h = 72 floor is the richest;
      the h = 3 crater is the control), build the horizontal l = 3, 5, 7 isogeny
      graph with the existing point-based tooling, and for every edge compute
      chi_l(E) by exhaustive discrete logarithm in a group of order 331 under the
      least-x labelling. Archive every (E, l, E', rho(E), rho(E'), phi_l(rho(E)),
      chi) tuple.
      STEP 3 (the certificate): verify the cocycle law on every closed loop
      against the independently computed principal residue. This validates the
      whole pipeline without reference to the hypothesis.
      STEP 4 (the discriminator): fit a predictor of chi_l(E) from the cheap
      vertex label set -- j-invariant and its ordinal position among the Hilbert
      class polynomial roots, two_torsion_x_count, group structure (n_1, n_2),
      ell=2 volcano level, least-x value itself -- with strict held-out splitting
      and a permutation test; run the identical fit on the random-relabelling null
      and on the h = 3 crater control; report accuracy, MDE and all three arms.
    controls:
      - >-
        NULL OBJECT: random-relabelling null, replacing rho(E') by a uniformly
        random generator of G_{E'} per curve, which makes chi uniform by
        construction. The predictor must fail there.
      - >-
        POSITIVE CONTROL: an adversarially chosen labelling for which chi IS a
        known function of a cheap label (e.g. rho defined so that chi_l equals the
        ordinal index of j mod N). The predictor must find it, or it cannot
        support a negative (GOAL-ENDO-001 C4, RQ-INSTR-f8faa0).
      - >-
        NEARBY-OBJECT CONTROL: the h = 3 crater level, where the torsor is tiny
        and success is compulsory.
      - >-
        SOLVER-INDEPENDENT CERTIFICATE: the loop identity of STEP 3, re-verified
        by a checker that does not call the isogeny construction code
        (docs/claims-and-verification.md).
      - >-
        MATCHED BASELINE FOR ANY VECTORIZATION CLAIM: if the predictor succeeds,
        its end-to-end cost must be charged against a sqrt(h) meet-in-the-middle
        vectorization baseline at the identical parameters, including the cost of
        computing every label and every isogeny; an unmatched "faster" is not a
        result.
      - >-
        RHO / BSGS matched controls on the ECDLP side as RQ-CLGP-b99df5's
        constraints require, recorded even though no ECDLP claim is made, so the
        record's cost statements are comparable.
    required_metrics:
      - the full edge table (E, l, E', chi) with the labelling used
      - loop-certificate pass rate and the independently computed principal residues
      - predictor accuracy with held-out splits, on the real, null and crater arms
      - the predictor's minimum detectable effect at the realised sample size
      - chi uniformity statistic with its power
      - N/h compression ratio at the tested parameters
      - end-to-end cost of any successful predictor against the sqrt(h) baseline
      - artifact manifest with hashes and a from-scratch rebuild receipt

  falsification_conditions:
    - >-
      The loop certificate fails anywhere. The implementation is wrong; no
      mathematical conclusion of any kind may be drawn, and the failure is an
      instrument finding rather than evidence.
    - >-
      The predictor's held-out accuracy sits within Monte-Carlo error of 1/330 on
      every feature subset and every tested l, while the crater control and the
      positive control both pass. C5's optimistic branch is refuted at this scope:
      the least-x labelling carries no torsor information recoverable from these
      cheap labels, the obstruction is MEASURED with a stated MDE, and the lane
      gains a closure that meets the section-4 standard rather than a fatigue
      report.
    - >-
      The predictor beats chance materially and survives the null and the
      permutation test. C5's optimistic branch survives, the record becomes a
      VECTORIZATION lead rather than an ECDLP lead, and it must be routed to an
      independent review-adversarial session before any statement is recorded --
      and its end-to-end cost charged against the sqrt(h) baseline before the word
      "faster" is used.
    - >-
      The crater control fails at h = 3. The instrument cannot detect a signal it
      is guaranteed to face, no negative may be recorded (GOAL-ENDO-001 P1), and
      the run is marked attempted_and_inconclusive.
    - >-
      C4's compression bound is found to be wrong -- i.e. some class has h
      comparable to N. That would require |D| ~ p^2, impossible for
      D = t^2 - 4p with |t| <= 2 sqrt(p), so a failure here would indicate an
      arithmetic error in the record rather than a mathematical surprise; it is
      listed because a falsification condition that cannot fire should be
      identified as such rather than padded into the list silently.

  confounders:
    - >-
      TINY N. At N = 331 chance accuracy is 0.30% and 72 curves per level give a
      predictor almost no data; overfitting is the default outcome and only strict
      held-out splitting plus a permutation test can control it. The MDE must be
      computed and reported BEFORE the fit, and a null result at this N bounds
      only large effects. This is the single largest limitation of the design and
      it is stated first for that reason.
    - >-
      LEAST-X IS ITSELF A COORDINATE OBJECT. The distribution of x-coordinates of
      G is not uniform in F_p, so chi under the least-x labelling could be
      non-uniform for reasons having nothing to do with the torsor. The uniformity
      metric is reported separately from the predictor for exactly this reason.
    - >-
      FEATURE COLLINEARITY. two_torsion_x_count, group structure and ell=2 volcano
      level are the SAME quantity on this class, as IDEA-20260821-ad7c97 derives;
      treating them as three features triples the apparent search without adding
      information and inflates the multiple-comparison burden. They must be
      declared as one feature.
    - >-
      LEVEL CHOICE. The h = 72 floor and the h = 3 crater have different class
      groups and different horizontal graphs; a result on one does not transfer to
      the other, and the crater is used only as a control.
    - >-
      COFACTOR 12. G is reached by multiplying by 12, so a point of order dividing
      12 maps to the identity and the least-x search must skip it -- the same
      degeneracy family as CORR-20260807-9f83be, which cost this campaign a
      retracted measurement. The lifting routine must assert order exactly 331.

  interpretation_limits:
    - >-
      TOY TIER. p = 4001 (12 bits), N = 331 (9 bits), one class, one labelling,
      three split primes. Nothing transfers to cryptographic scale and no transfer
      is offered.
    - >-
      C4 FORECLOSES THE ECDLP DIRECTION INDEPENDENTLY OF EVERY MEASUREMENT. No
      outcome of the experiment can produce an ECDLP claim through this bridge,
      and the record may not be cited as if it could.
    - >-
      A POSITIVE IN C5 IS A VECTORIZATION LEAD, NOT AN ECDLP RESULT, AND IT IS
      SCOPED TO ORDINARY PRIME-FIELD CLASSES OF THE TESTED SHAPE. Its relevance to
      CSIDH-style constructions, which live on supersingular curves over F_p with
      a different endomorphism structure, is NOT asserted and would need its own
      argument.
    - >-
      THE COCYCLE LANGUAGE IS DESCRIPTIVE, NOT LOAD-BEARING. Every claim can be
      stated without cohomology; the language is used because it makes the
      labelling-dependence explicit, and no theorem is imported from it.
    - >-
      NO HYPOTHESIS STATUS IS TOUCHED. H-ENDO-001 remains `approved` and is used
      here only as the admissibility filter it already is; H-STR-002 is not
      referenced and DEFER-BATCH009-001 is untouched.

  heuristic_assumptions:
    - id: H1
      statement: >-
        LABEL-INDEPENDENCE HEURISTIC. For the least-x labelling and split primes
        l coprime to the conductor, the edge characters chi_l(E) behave, as E
        ranges over one level, like independent uniform draws from (Z/N)^*,
        independent of every poly(log p)-computable vertex label of E and l*E.
      rigorous_support: >-
        RIGOROUS INGREDIENT: chi is a cocycle for a SIMPLY TRANSITIVE action, so
        for a uniformly random labelling it is exactly uniform on each edge --
        this is a theorem, not an assumption, and it is what the random-relabelling
        null instantiates. CLASSICAL STATEMENT IMITATED: that a concrete,
        arithmetically defined choice (least x) behaves like a uniform choice --
        the same shape of assumption as treating the least quadratic non-residue
        or the least primitive root as generic, and equally unproved.
      falsification_condition: >-
        Any predictor beating the permutation null's 99th percentile by more than
        the reported MDE, replicated on a second level or a second prime.
      validation_plan: >-
        SAMPLE: all 72 curves of the floor level times 3 split primes = 216 edges,
        exhaustively (not sampled); repeat on the h = 36 level for replication.
        SHORTCUT THAT MAKES THIS FEASIBLE: N = 331 makes the discrete logarithm
        defining chi exhaustive, so no DL hardness assumption enters the
        measurement -- the toy scale is chosen for exactly this reason and the
        record says so. COMPARISON: empirical distribution of chi against uniform
        on (Z/N)^*, and predictor accuracy against a 10^4-draw permutation null.
        TAIL CHECK: the most frequent chi value against the uniform 1/330
        multinomial upper quantile. TRANSFER: NONE is claimed from N = 331 to
        cryptographic N; the transfer assumption that would be needed -- that
        label-independence is not an artifact of small N -- is stated and is NOT
        discharged by this experiment.
    - id: H2
      statement: >-
        HORIZONTAL CONSTRUCTIBILITY. For each tested split prime l, both
        horizontal l-isogenies from each curve of the level are constructible by
        the existing point-based tooling, so the measured graph is the true
        horizontal graph and not a sub-graph biased toward curves with convenient
        rational kernels.
      rigorous_support: >-
        RIGOROUS INGREDIENT: l splits in O and l does not divide the conductor, so
        exactly two horizontal l-isogenies exist from each curve of the level, and
        l | #E(F_p) supplies rational l-torsion for l = 3. CLASSICAL STATEMENT
        IMITATED: that Velu's formulas on a rational kernel realise both
        horizontal directions -- which is true only when the kernel points are
        F_p-rational, and for l = 5, 7 with l not dividing #E = 3972 they are NOT,
        so the tooling may reach only a sub-graph.
      falsification_condition: >-
        The constructed graph is not 2-regular at every vertex for a given l, or
        its connected components do not have size h.
      validation_plan: >-
        SAMPLE: every vertex of the level, every tested l. COMPARISON: measured
        vertex degree against the predicted 2, and component size against h.
        TAIL CHECK: vertices of degree 0 or 1, which localise exactly where the
        point-based tooling fails and are the honest place to stop. TRANSFER: if
        l = 5, 7 are not constructible, the experiment runs on l = 3 alone and
        says so; it does NOT substitute a different construction silently. This
        is the most likely practical failure of the design and is pre-registered
        as such.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED FOR ECDLP, AND C4 PROVES NONE IS AVAILABLE ON THIS
      ROUTE: a perfect vectorization oracle composed with the residual search
      still costs p^{1/2 + o(1)}. The only exponent the record could move is
      VECTORIZATION's, and only in the optimistic branch of C5: a poly-time
      predictor of chi that partially trivialises the torsor would reduce the
      effective torsor size from h to h/2^b for b predicted bits, taking the
      meet-in-the-middle cost from h^{1/2} = p^{1/4 + o(1)} to
      (h/2^b)^{1/2}. NO SUCH PREDICTOR IS CLAIMED TO EXIST; the experiment tests
      whether one does at toy scale, and the prior stated below is low.
    memory_exponent: >-
      The vectorization incumbent this would have to beat is a meet-in-the-middle
      at about h^{1/2} = p^{1/4} TIME AND MEMORY, or a low-memory random walk at
      the same time with O(1) memory and a van Oorschot-Wiener parallel
      interpolation. Any C5 positive must be charged in both models; a gain that
      exists only in the large-memory model is a different and weaker claim and
      must be labelled as one. The experiment itself uses O(#E) = O(3972) memory.
    best_known: >-
      ECDLP on these curves: p^{1/2} (Pollard rho, automorphism-discounted per
      KN-TECH-018; BSGS at p^{1/2} time and memory). Cl(O)-vectorization on an
      ordinary class: classically about h^{1/2} = p^{1/4 + o(1)} (recalled:
      Galbraith-Hess-Smart / Galbraith-Stolbunov style meet-in-the-middle),
      quantumly subexponential (recalled: abelian hidden shift, Kuperberg /
      Childs-Jao-Soukharev). Both incumbents are recalled and must be confirmed by
      a reviewer with retrieval before any comparison is recorded.
    hidden_overhead: >-
      DISCLOSED, THREE ITEMS. (i) h(D) = |D|^{1/2+o(1)} rests on Siegel and is
      INEFFECTIVE, so "h ~ p^{1/2}" carries a constant nobody can compute; the
      unconditional O(sqrt(|D|) log|D|) upper bound is what C4 actually uses, and
      C4 needs only the upper bound, so the ineffectivity does not weaken the
      obstruction. (ii) The o(1) in the vectorization incumbent hides the cost of
      evaluating the group action, which is polynomial but not small. (iii) The
      least-x labelling is poly(log p) only when the cofactor #E/N is small; for
      large cofactors it is not poly-time and the whole construction changes
      character.
    tradeoff_note: >-
      C4's compression bound is INFORMATION-THEORETIC and therefore independent of
      the vectorization algorithm's own time-memory position: improving
      vectorization to h^{1/3} time, or to any cost at all, leaves N/h ~ p^{1/2}
      residual candidates. That independence is the reason the obstruction is
      recorded as a barrier and not as a cost.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS OF THE FRONTIER BEFORE ANSWERING. As an ECDLP
    attack: n/a (no result claimed), and C4 forecloses one on this route. As a
    vectorization attack: DOMINATED, in the current state of evidence, by the
    classical h^{1/2} = p^{1/4} meet-in-the-middle and by the quantum
    subexponential algorithm, on time, on memory and on query count -- this record
    offers no measured improvement on any of the three and would only cease to be
    dominated if C5's optimistic branch fired and survived a matched-baseline
    charge. As a structural statement about the lane: dominated by classical CM
    theory for the mathematics, and not dominated by any committed record for the
    specific assembly (edge character, free principal part, compression bound,
    predictability question), which no filed proposal contains.
  sota_delta: >-
    ZERO on every attack axis today, and the record says so before it says
    anything else. Time exponent for ECDLP unchanged at 1/2 and PROVED unchangeable
    on this route by C4; vectorization exponent unchanged at 1/4 unless C5's
    optimistic branch fires, in which case the delta is exactly b/2 bits of
    exponent for b predicted bits and must be charged end-to-end before being
    stated. What is delivered unconditionally: RQ-CLGP-b99df5's demanded explicit
    bridge map, its composition law, a free evaluation rule on the stabiliser, and
    a named obstruction OBS-CARD with a computable value N/h rather than a verdict.

  discriminated_from:
    - >-
      IDEA-20260807-02b7b2 / IDEA-20260807-5158fa establish G = E[n]. This record
      starts there and adds the edge scalar, its composition law and its
      consequences; it re-derives nothing and claims nothing about the
      identification itself.
    - >-
      IDEA-20260807-5d7606 and IDEA-20260807-0fafe8 write the two reductions with
      quantifier order and record OBS-1 "the bridge is constant" as prose. This
      record supplies the object making OBS-1 an identity with an evaluation rule,
      plus a measurable residual, which is the difference between a verdict and an
      obstruction under docs/inventor-protocol.md section 4.
    - >-
      IDEA-20260807-bbdcf3 puts h(O) and N side by side and observes the gap cuts
      both ways. This record converts the gap into a quantified compression bound
      with a stated consequence for the exponent, and names it OBS-CARD.
    - >-
      IDEA-20260807-1b7241 / -326442 / -413fcc close the ORACLE route by a
      generic-group simulator. This record does not route through an oracle, which
      is exactly the residual IDEA-20260807-4e8da3 says the CAGG closure leaves
      open; the oracle-side adjudication is filed separately as
      IDEA-20260821-805cae and the two must be read together.
    - >-
      IDEA-20260811-10eacc identifies a level with Cl(O) after choosing a base
      vertex and studies a functional C on the vertices. chi is an EDGE quantity
      with a composition law, and the composition law is what makes it certifiable
      and what makes its trivialisation equal to vectorization.
    - >-
      IDEA-20260811-9bb909 (RQ-EWALK) defines the class of poly-time LOCAL LABELS
      computable from (a, b). This record reuses that class as the predictor's
      feature set and cites it as the source rather than reinventing it; the
      question asked of the labels is different (predict an edge scalar, not
      minimise a vertex cost).

  estimated_cost:
    implementation: medium
    compute: low

  recommended_priority: medium

  honest_prior_of_survival: >-
    0.95 that C1-C3 verify exactly (they are short derivations with a certificate).
    0.98 that C4's arithmetic holds. 0.6 that the horizontal graph is constructible
    at l = 3 with the existing point-based tooling, and only 0.25 that l = 5 and 7
    are, since 5 and 7 do not divide #E = 3972 and the rational-kernel route may
    not exist -- H2 pre-registers this as the likeliest practical failure. 0.1 that
    the predictor beats chance and survives both controls, which is deliberately a
    low prior: the value of the experiment is mostly in the measured negative and
    in the certificate infrastructure it leaves behind.

