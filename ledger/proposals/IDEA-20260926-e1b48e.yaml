      log_p(det)/4 <= 1/4.
    baseline_embedding:
      parameter_slice: >-
        L = Hom(E, E^{(p)}) itself (index 1) reproduces the recorded "rank 4
        gives 1/2" of lever_corrections L1 exactly: log_p(p^2/16)/4 -> 1/2.
      reproduction_check: >-
        Symbolic fixture: det(O, Nrd) = p^2/16, det(I, Nrd/n(I)) = p^2/16, and
        det(L) = m^2 det(M) for index-m sublattices. Numeric fixture:
        recompute det on the WISDE Z-bases at every covered prime.
    observation_collision:
      observable: The Gram determinant of the certificate lattice.
      distinct_preimage_search: >-
        Every Hom(E, E') shares the same determinant p^2/16, so the determinant
        cannot distinguish targets E'. That is exactly why changing the
        auxiliary target within dimension one cannot help a rank-4 certificate.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fibre of det over all (E, E'), which is constant. Any route to a
          smaller determinant must change rank, form, or dimension g.
        predicted_gain: >-
          Removes the rank-4, dimension-one branch from the lever map at zero
