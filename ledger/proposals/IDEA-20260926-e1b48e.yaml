  minimal_test:
    design: >-
      Zero sampling beyond reading existing bases. For each WISDE-covered prime,
      parse every order type's Z-basis and compute the 4x4 Gram matrix of Nrd
      exactly over Q. Check det * 16 / p^2 = 1. For 20 random left ideals per
      prime, built from norm-2 elements, compute the Gram determinant of
      Nrd/n(I) and check the same identity. Seconds of compute.
    controls:
      - >-
        Deliberately wrong form (trace form Trd(x y-bar) without halving). It
        must return 16x and so confirms that the check can fail.
      - >-
        Index-m sublattice (random HNF of index m). It must return m^2 times,
        which checks the monotonicity step numerically.
    required_metrics:
      - per prime, per type - exact det * 16 / p^2
      - per prime - pass/fail count, with any failing basis archived

  falsification_conditions:
    - >-
      Any maximal-order basis from the dataset gives det * 16 / p^2 != 1 after
      the dataset's own normalisation check passes. The lemma's normalisation
      is then wrong, and the closure is withdrawn.
    - >-
      Anyone exhibits a rank-4 lattice INSIDE a single Hom(E, E') with the
      degree form and det <~ p. That contradicts the lemma, and the derivation
      must be found in error.

  confounders:
