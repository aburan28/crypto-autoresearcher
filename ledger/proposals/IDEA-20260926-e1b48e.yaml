  assumptions:
    - >-
      Not F1-F7 as a lens. The nearest family is F6 (endomorphism orbit); this
      record is about a determinant, not an orbit.
    - >-
      The lemma closes CERTIFICATES built from rank-4 Hom-sublattices. It does
      not say short vectors fail to exist for particular curves. BATCH-001's
      point that Minkowski gives upper bounds only is respected: the claim is
      about what such a bound can certify uniformly, not about floors on minima.

  proof_search_map:
    bottleneck: >-
