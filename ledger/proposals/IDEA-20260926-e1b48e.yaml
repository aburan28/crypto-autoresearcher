    withdrawn. A one-line normalisation check on the AOV/WISDE bases is the only
    compute.
  class: mechanism

  claim: >-
    LEMMA (derivation tier). Let E, E' be supersingular over F_{p^2}. Under the
    Deuring correspondence, Hom(E, E') with q = deg is isometric to a left ideal
    I of a maximal order O in B_{p,inf} with q = Nrd/n(I). The frozen source
    states the case E' = E^{(p)} with I = P, the two-sided ideal of reduced
    norm p (line 244). The Gram determinant of (O, Nrd) is p^2/16 (discriminant
    p^2, halved form). [O : I] = n(I)^2, and rescaling the form by 1/n(I) scales
    the determinant by n(I)^{-4}. Hence det(Hom(E, E'), deg) = p^2/16 for EVERY
    pair (E, E'). For any full-rank sublattice L of index m,
    det(L) = m^2 * p^2/16 >= p^2/16. Consequently log_p(det L)/4 >= 1/2 - o(1),
    and a Minkowski/Hermite certificate on L can never certify a vector of
    degree below about p^{1/2}.
    CONSEQUENCE FOR GOAL-SSIQ-001. DEC-20260805-2be965 corrected the
    admissibility criterion to "log_p(det)/rank <= 1/4, which admits rank 4 with
    det <~ p. Rank > 3 is exactly where N5's higher-dimensional case lives." By
    the lemma, no rank-4 lattice inside any single Hom(E, E') with the degree
    form, full-rank or of finite index, has det <~ p. The rank-4 branch of that
    window is EMPTY in dimension one, for every auxiliary target E', not only
    E^{(p)}. The draft candidate (trace-zero rank-3 lattice plus one extra
    generator) is a full-rank sublattice of Hom(E, E^{(p)}) and is withdrawn.
    WHAT REMAINS OPEN, stated so the closure is not over-read. (i) Rank <= 3
    sublattices. The rank-3 trace-zero lattice (discriminant p/4) is what gives
    1/3. A rank-2 or rank-3 certificate with log_p(det)/rank <= 1/4 is not
    excluded by this lemma. For the E^{(p)} target it runs into the
    conjugate-degree density law of H-WESO-9dc201 (proposed): only a
    p^{-1/8+o(1)} fraction of curves have delta(E) <= p^{1/4}. (ii) Lattices not
    inside a single Hom-module under deg: a direct sum over targets has rank 8
    and det p^4/256, exponent 1/2 again; non-degree forms do not measure isogeny
    degree. (iii) N5 in dimension g >= 2: Hom-lattices between abelian
    varieties or polarised products. Their rank and determinant are different
    objects, not covered here.
  mechanism: >-
    Object: the pair (Hom(E, E'), deg) as a Z-lattice, with its sublattices as
    candidate certificates. Operation set: none propagated. This is a static
    lattice-geometry obstruction and is coordinate-independent (a determinant).
    The trichotomy of IDEA-20260806-c5d183 does not apply. LOSSY-PROJECTION
    TEST: passing to a finite-index sublattice discards vectors, but it cannot
    lower the covolume. The loss runs in the wrong direction for a
    determinant-driven certificate, which is the whole content of the lemma.
    Constructive reading (inventor protocol section 4): the obstruction is a
    measured quantity, det = p^2/16 independent of (E, E'). A theory that wants
    a small-determinant rank-4 lattice must leave the single-Hom-module, degree-
    form setting.
