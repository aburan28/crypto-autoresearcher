    proof_obligations:
      - claim: det(O, Nrd) = p^2/16 for every maximal order O of B_{p,inf}.
        responsibility: baseline
      - claim: Hom(E, E') with deg is isometric to (I, Nrd/n(I)) for a left O-ideal I (Deuring).
        responsibility: interface
      - claim: det(I, Nrd/n(I)) = det(O, Nrd).
        responsibility: size
      - claim: "det(L) = [M : L]^2 det(M) for a full-rank sublattice."
        responsibility: correctness
      - claim: The lemma covers full-rank sublattices of a single Hom-module under deg, and nothing else.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: det(O, Nrd) * 16 / p^2 over every maximal-order type at every WISDE-covered prime
