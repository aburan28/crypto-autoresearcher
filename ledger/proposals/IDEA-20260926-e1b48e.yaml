    quantifier_order: >-
      FORALL supersingular E, E' over F_{p^2}, FORALL full-rank sublattices
      L <= Hom(E, E'): det(L, deg) >= p^2/16. Exact, no heuristic, and uniform in
      E, E' and L.
    method_ceiling:
      strongest_certifiable_claim: >-
        No rank-4 degree certificate inside a single Hom-module certifies an
