  title: >-
    The "rank 4 with det <~ p" window of GOAL-SSIQ-001's admissibility
    criterion cannot be entered. Every full-rank sublattice of any
    Hom(E, E') under the degree form has Gram determinant at least p^2/16, so a
    Minkowski-type certificate from a rank-4 Hom lattice has exponent at least
