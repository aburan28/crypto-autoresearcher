    "title": "Faithful-quotient obstruction: deterministic transitive abelian action KEX cannot obtain hidden entropy from a lossy public action state",
    "class": "control",
    "claim": "For a deterministic transitive action of an abelian group G on public action states X, the stabilizer of one state is the global action kernel K, so the faithful quotient G/K acts freely and transitively. More generally, if a lossy public encoding q:X->Y still supports a well-defined G-action needed to process peer public keys, then the stabilizer H of q(x0) is a global kernel on Y and G/H acts freely and transitively on the public orbit. The public key therefore identifies the effective secret coset exactly; the discarded |H/K| choices induce the same action on every public state and add zero KEX entropy. If the action does not descend, different hidden representatives can yield different shared outputs and the construction fails correctness. This is a narrow obstruction to lossiness-as-hiding, not an attack on action inversion, not a claim that hard homogeneous spaces are insecure, and not a closure of ordinary-ECC group-action KEX.",
    "mechanism": {
      "lemma_1_stabilizer_is_kernel": "Let G be abelian and transitive on X, fix x0, and let K=Stab_G(x0). For k in K and x=g*x0, k*x=k*g*x0=g*k*x0=g*x0=x. Thus every element of K fixes every state, K is the global action kernel, every stabilizer equals K, and G/K acts freely and transitively on X.",
      "lemma_2_equivariant_lossy_encoding": "Suppose q:X->Y is the public encoding and peer-key processing requires a well-defined descended action g*q(x)=q(g*x). The orbit Y0=G*q(x0) is transitive. Repeating Lemma 1 on Y0 shows H=Stab_G(q(x0)) is its global kernel and G/H acts freely and transitively on Y0. A public key q(g*x0) identifies gH; the residual H/K label cannot change any descended public action or shared output.",
      "correctness_fork": "If q is not compatible with a well-defined action, there exist x,x' with q(x)=q(x') but some secret a for which q(a*x) differs from q(a*x'). A participant receiving q(x) cannot determine a unique shared output without extra public reconstruction data. Adding enough data to restore uniqueness changes q and must be re-audited.",
      "ecc_instantiation": "Ordinary class-group and generalized/ray-class KEX candidates are commutative actions. Ideal-word or relation-lattice duplicates instantiate K; an equivariant quotient or omitted public invariant instantiates H. Volcano depth, conductor, trace, orientation tags, or level labels that are publicly recoverable cannot be credited as hidden secret coordinates.",
      "cheapest_kill": "Before implementing a proposed lossy ordinary-ECC action KEX, write its public state set, equivalence relation, and descended action. If the quotient action is well-defined, quotient by H and remove log2(|H/K|) fictitious secret bits. If it is not well-defined, exhibit one colliding public-key pair and one action element with different outputs; that is a correctness counterexample. Only candidates outside these quantifiers need a different analysis."
