      transfer assumed.
    GOAL-PATH-001: Supplies a certificate mechanism for the degree numerator in the tiered cost model.
    GOAL-SDEG-001: Targets certificate-backed prime-field solving degree with the small 8/10/12-bit S_3 boundary.
