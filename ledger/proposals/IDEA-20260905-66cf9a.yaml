idea:
  id: IDEA-20260905-66cf9a
  title: Degree-fall persistence separates Hilbert behavior from solving cost
  class: representation
  claim: 'Two Semaev-related presentations can have the same homogeneous Hilbert data but different persistence
    of degree falls. Conjecture: a filtered consequence certificate isolates this gap and explains whether a small
    first-fall degree is followed by a bounded or growing last-fall degree.'
  mechanism: A low-degree polynomial may belong to the ideal yet require higher-degree combinations of the chosen
    generators before becoming available. Track each certified consequence by its actual degree and minimum derivation
    degree. This supplies a persistence interval measuring a computation obstruction rather than just final ideal
    membership. The relation between last fall degree and degree-compatible solving degree is a source-backed structural
    anchor, but extracting a compact complete set of intervals is unproved. Boolean descended systems and direct
    prime-field systems remain distinct families, with separate nulls and labels.
  question_id: RQ-DREG-001
  question_ids:
  - RQ-DREG-001
  - RQ-SDEG-001
  - RQ-ECDLP-001
  goal_ids:
