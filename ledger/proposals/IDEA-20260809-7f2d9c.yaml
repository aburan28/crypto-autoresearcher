      payload_order: >-
        Let N=U for treatment and generic controls and N=L=U-1 for the exact
        quotient. Emit exactly 4*N left records followed by exactly 4*N right
        records. Left records have side=0, source_list=0, partner_list=1, and
        pair_ordinal=0..4*N-1 in ascending order. Right records have side=1,
        source_list=2, partner_list=3, and the same ascending ordinal range.
