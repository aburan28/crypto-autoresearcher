        - {offset: 52, width: 4, field: source_j_ordinal, encoding: u32be}
        - {offset: 56, width: 4, field: bucket, encoding: u32be}
        - {offset: 60, width: 2, field: flags, encoding: u16be}
        - {offset: 62, width: 2, field: reserved_zero, encoding: u16be, required: 0}
      synthetic_record_32_layout:
        - {offset: 0, width: 1, field: valid, encoding: u8, allowed: [0, 1]}
        - {offset: 1, width: 1, field: side, encoding: u8, codes: {left: 0, right: 1}}
        - {offset: 2, width: 1, field: source_list, encoding: u8, allowed: '0..3'}
        - {offset: 3, width: 1, field: partner_list, encoding: u8, allowed: '0..3'}
        - {offset: 4, width: 4, field: pair_ordinal, encoding: u32be}
