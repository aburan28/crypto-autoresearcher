    integer_default: unsigned_big_endian
    signed_integer_exception: >-
      eta is signed i8 two's complement and IntervalRational128 numerators are
      signed 512-bit two's-complement big-endian. Toy point and scalar payloads
      explicitly retain their declared little-endian encodings.
    reserved_byte_rule: Every reserved byte is present and MUST equal zero.
    length_rule: >-
      Every total length, header length, payload length, item count, and record
      width is checked before hashing. Trailing bytes, omitted bytes, implicit
      padding, host-sized integers, and native-endian encodings are forbidden.
    serialized_vs_derived_rule: >-
      A field appears in the message if and only if its layout row assigns an
      offset and width. Counts and offsets described as derived are recomputed
      from serialized fields and the frozen code tables and are never appended
      implicitly. SHA-256 padding is operation work, not a logical input byte.
    domain_separation_rule: >-
      The first eight bytes are a family-specific ASCII magic except for the
      already frozen TLV curve stream. Family, subtype, arm, pass, allocation,
      proposal, and schema codes occupy fixed serialized fields. No two
      admitted family/subtype combinations share the same prefix grammar.

