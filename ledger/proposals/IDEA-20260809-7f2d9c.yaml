      schema_id: crypto.autoresearch.XOFKey64.v1
      total_width_bytes: 64
      byte_order: big_endian
      proposal_id_ascii: IDEA-20260809-7f2d9c
      proposal_id_width_bytes: 20
      layout:
        - {offset: 0, width: 8, field: magic, encoding: ASCII, required_hex: '434152584f463034'}
        - {offset: 8, width: 2, field: version, encoding: u16be, required: 1}
        - {offset: 10, width: 2, field: frame_length, encoding: u16be, required: 64}
        - {offset: 12, width: 20, field: proposal_id, encoding: fixed_ASCII, required: IDEA-20260809-7f2d9c}
        - {offset: 32, width: 2, field: domain_code, encoding: u16be}
        - {offset: 34, width: 1, field: arm_code, encoding: u8}
        - {offset: 35, width: 1, field: component_code, encoding: u8}
        - {offset: 36, width: 2, field: order_bits, encoding: u16be}
        - {offset: 38, width: 1, field: curve_or_cluster, encoding: u8}
        - {offset: 39, width: 1, field: model, encoding: u8}
        - {offset: 40, width: 2, field: root, encoding: u16be}
        - {offset: 42, width: 4, field: item_ordinal, encoding: u32be}
