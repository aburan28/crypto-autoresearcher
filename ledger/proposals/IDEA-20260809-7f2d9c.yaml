    reason: >-
      The formulas, grammars, rational intervals, and compiler rows below are
      producer assertions for independent recomputation. They are not a PASS,
      a validity result, experiment readiness, approval, implementation,
      evidence, a run, or an observation.

  claim: >-
    CONDITIONAL ALGORITHM TARGET, NOT A RESULT OR ATTACK CLAIM. Let G=<P> have
    prime order N, Q=[k]P, and S be verified Boolean success for one signed-y
    four-list root. On one public preregistered family/model/root distribution,
    define p_N=Pr[S=1]=N^(-1/3+gamma_s+o(1)). If selector regularity, the
    distinct-match second-moment bridge, independent restarts, and the fully
    charged wiring model all hold, then one root has N^(1/3+o(1)) raw work and
    live entries; expected raw work is N^(2/3-gamma_s+o(1)) and formal Wiener
    exponent class is N^(7/9-gamma_s+o(1)). Formal exponent crossovers are
    gamma_s>1/6 against raw rho, gamma_s>5/18 against fully charged rho, and
    gamma_s>1/9 against standard-BSGS full exponent. These comparisons assume
    every per-event group, field, hash, join, verification, and storage cost is
    N^o(1); no common concrete time unit or concrete dominance is claimed. No
    positive gamma_s, solver, speedup, security impact, crypto-scale validation,
    novelty, theorem, closure, or breakthrough is asserted.

  mechanism: >-
    For affine R=(x,y), use the centered representative y_tilde and
    h_y(R)=sgn(y_tilde)*floor(M*abs(y_tilde)/p) mod M, with h_y(O)=0. Each
    shared canonical root samples fresh a in (Z/NZ)^*, b in Z/NZ, z in Z/MZ,
    and four length-L scalar lists without replacement. The same tuple is
    transformed deterministically into four public isomorphic models. With
    Q'=[a]Q+[b]P, select left pairs whose labels sum to z and right pairs whose
    labels sum to h_y(Q')-z. Only A+B=Q' and an independently verified
    k_hat=a^(-1)*(r1+r2+r3+r4-b) mod N count. Labels select work and never
    replace exact point equality or witness verification.

  test_object:
    tracked_object: >-
      Per model observation retain (D,Y,X,V,S): selected cross-pair denominator
      D, multiplicity-weighted exact matches Y, distinct exact matches X,
      independently verified distinct matches V, and S=1[V>=1].
    lossiness: >-
      h_y is a public lossy coordinate partition. It is not an exact quotient
      and is not assumed to propagate deterministically. The proposed escape is
      marginal and probabilistic only.
    depth_of_verified_structure: >-
      No structure is verified by this proposal. Signed-y antisymmetry, public
      isomorphism algebra, scalar recovery, the marginal link, exact finite
      control generators, and deterministic matched-mean identities remain
      proposal constructions. Enrichment, subpolynomial clustering, scaling,
      real-machine costs, and advantage are unobserved.

  root_random_variables:
    probability_space: >-
      For each size, one future pre-contract immutable manifest supplies exactly
      32 certificate-bound public curve-target pairs. Conditional on that
      manifest, every pair has weight 1/32, each of four fixed public models has
      weight 1/4, and each of 256 shared canonical roots has weight 1/256.
      Models are nested deterministic transformations of the same root tuple.
    definitions:
      - {symbol: I_L, definition: selected_left_index_pairs}
      - {symbol: I_R, definition: selected_right_index_pairs}
      - {symbol: D, definition: '|I_L|*|I_R|; diagnostic only'}
      - {symbol: Y, definition: 'sum_A C_L(A)*C_R(Q_prime-A)'}
      - {symbol: X, definition: number_of_distinct_exact_matching_A_values}
      - {symbol: V, definition: distinct_matches_whose_scalar_verifies}
      - {symbol: S, definition: '1[V>=1]; runtime success variable'}
      - {symbol: mu_N, definition: 'E[X] on the frozen marginal family'}
      - {symbol: p_N, definition: 'Pr[S=1] on the same family'}
      - {symbol: kappa_N, definition: 'E[X^2]/E[X] when E[X]>0'}

  boolean_success_derivation:
    upper_bound: 'Pr[X>=1] <= E[X].'
    lower_bound: 'Pr[X>=1] >= E[X]^2/E[X^2] = E[X]/kappa_N.'
    bridge_condition: >-
      If mu_N=N^(-1/3+gamma_x+o(1)), kappa_N=N^o(1), and V=X except with
      negligible apparatus-failure probability, then p_N has the same exponent
      and gamma_s=gamma_x. E[Y] is never substituted for Boolean probability.
    runtime_assembly: >-
      W_root=N^(1/3+o(1)); independent restarts require 1/p_N roots, hence
      expected raw work W_root/p_N=N^(2/3-gamma_s+o(1)).

  assumptions:
    - >-
      Odd prime-order short-Weierstrass subgroups with N approximately p;
      order, subgroup, cofactor, anomalous, coefficient-degeneracy, and
      exceptional-curve checks precede admission.
    - >-
      One public target, no oracle, advice, learned label, reusable root table,
      or post-treatment model selection.
    - >-
      Lists are sampled without replacement inside a list. Every complete XOF
      state uses the 64-byte binary frame below, including a u32 item ordinal
      for every list member. No state, offset, accepted index, or digest is reused.
    - >-
      Every declared operation, byte, logical transfer, archive pass, failed
      root, and retained artifact is charged by the sole compiler below.

  heuristic_assumptions:
    - id: HA-1-selector-regularity
      formal_statement: >-
        Uniformly over the frozen family and roots, |I_L| and |I_R| are
        N^(1/3+o(1)), while bucket and exact point-sum multiplicities are N^o(1).
      rigorous_support: >-
        Realized histograms would provide exact finite counts; balanced
        occupancy bounds calibrate a null and are not a theorem for signed-y.
      validation_plan: >-
        Retain every bucket count, root metric, cap flag, candidate, and
        pair-stream digest for treatment and all selector controls.
      falsification_condition: >-
        A side above 4L, combined selected pairs above 8L, or polynomial
        multiplicity invalidates the cost model; a cap failure is apparatus
        invalidity and not mathematical evidence.
    - id: HA-2-distinct-match-enrichment
      formal_statement: >-
        There exists a fixed public family/model rule with
        E[X]=N^(-1/3+gamma_x+o(1)); decision-changing scope requires
        gamma_x>5/18 together with every bridge gate.
      rigorous_support: No prime-curve theorem is asserted to support positive gamma_x.
      validation_plan: >-
        Fit marginal S and report X moments on the complete toy ladder only
        after every synthetic and isomorphism apparatus gate passes.
      falsification_condition: >-
        A complete valid UCB_99.5(gamma_s)<=5/18 closes only the declared
        formal full-exponent crossover on the exact tested family and schedule.
    - id: HA-3-subpolynomial-root-clustering
      formal_statement: >-
        For gamma_x<1/3, kappa_N=N^o(1), Y/max(1,X)=N^o(1), and
        p_N/E[X]=N^o(1) with exponent zero.
      rigorous_support: >-
        Paley-Zygmund proves the bridge if the premise holds; the premise is
        unproved for signed-y.
      validation_plan: >-
        Require UCB_99.5(delta_kappa)<=0.02 and
        LCB_99.5(delta_ratio)>=-0.02 under eta=-4,0,4. The matched-mean control
        plants +1/3 and -1/3 and must detect both.
      falsification_condition: >-
        Polynomial kappa or Y/X growth, or polynomial p_N/E[X] decay, breaks
        the runtime bridge even if matches are enriched.
    - id: HA-4-independent-restarts
      formal_statement: >-
        Conditional on input and model, disjoint framed root keys make fresh
        (a,b,z,list) draws and time to first S=1 geometric across roots. The
        four model observations inside one root are deliberately dependent.
      rigorous_support: >-
        Nonzero a and uniform b make Q' uniform for fixed Q; independence still
        requires future seed and mutable-state audits.
      validation_plan: >-
        Reject duplicate canonical tuples, list/table reuse across roots,
        mutable carry-over, or lag dependence outside a frozen null envelope.
      falsification_condition: Seed collision or reuse invalidates restart inference.
    - id: HA-5-family-and-model-scaling
      formal_statement: >-
        A frozen public curve generator and four fixed model rules define a
        stable marginal family represented by the five-size ladder.
      rigorous_support: >-
        Isomorphisms preserve ECDLP and scalar recovery but not centered-y labels.
      validation_plan: >-
        Report the uniform-model family marginal, canonical marginal,
        heterogeneity, and model fractions without selecting a model.
      falsification_condition: >-
        Failure of the family or canonical gate prevents a model-robust claim;
        heterogeneity narrows scope and charges discovery.
    - id: HA-6-wiring-access-charge
      formal_statement: >-
        Selected tables are touched at nonvanishing rate, so the formal
        repository convention FC=W*S^(1/3) applies.
      rigorous_support: >-
        The convention is retained as a symbolic assumption, not a calibrated
        candidate-specific concrete time unit.
      validation_plan: >-
        Count logical accesses and bytes from atomic rows; measured physical
        traffic and event conversion weights remain separate future gates.
      falsification_condition: >-
        A changed access exponent or worse storage exponent requires a
        superseding cost record.
    - id: HA-7-finite-size-family-model
      formal_statement: >-
        On exact 18--30-bit subgroup orders, the direct marginal log mean uses
        one fixed eta in {-4,0,4}; the intercept is free and eta is never fitted.
      rigorous_support: >-
        None for signed-y. The three eta values are preregistered sensitivity
        analyses, not a nuisance family selected from data.
      validation_plan: >-
        Every treatment and selector-control fit is run under all three eta
        values. Repeated coverage uses the twelve exact gamma-by-eta targets.
      falsification_condition: >-
        Coverage failure, curvature, or disagreement across eta makes the
        asymptotic interpretation inconclusive.

  marginal_boolean_estimand:
    estimand_name: uniform_public_model_family_marginal_boolean_probability
    exact_definition: >-
      p_N=E_C,Q[(1/4) sum_{m=0}^3 E_root S(C,Q,m,root)]. Curves and targets are
      outer draws; models and roots are nested observations.
    canonical_scope_estimand: >-
      The m=0 marginal is a required scope check and cannot rescue a failed
      primary family marginal.
    reference_order: 16777216
    link_and_mean: >-
      For fixed eta in {-4,0,4}, log p_i=alpha+beta*log(N_i/16777216)
      +eta*(N_i^(-1/3)-16777216^(-1/3)), with 0<p_i<1.
    slope_identity: >-
      gamma_s=beta+1/3 exactly. The eta term converges to a constant absorbed
      by alpha. No hazard, rare-event, complementary-log-log, or
      conditional-to-marginal conversion occurs.
    point_estimator: >-
      For each fixed eta, maximize the equal-size, equal-curve, equal-model,
      equal-root composite Bernoulli log likelihood with free alpha and beta.
      A future deterministic interval-Newton solve at 384-bit precision must
      isolate the unique interior root to width below 2^-120 and round gamma to
      Q21.104. Failure to isolate is nonconvergence, with no substitution.
    bootstrap:
      method: size_stratified_nonparametric_whole_curve_pairs_bootstrap
      draws_per_cell: 8191
      resampling_unit: >-
        At each size sample 32 complete curve-target clusters with replacement;
        move all models and roots together. Sizes are fixed strata.
      statistic: 'Refit the identical estimator and retain gamma_star=beta_star+1/3.'
      interval: >-
        Sort 8191 converged values. Type-1 ranks 41 and 8151 are the exact
        two-sided 99-percent percentile endpoints and one-sided 99.5-percent bounds.
      convergence_rule: >-
        Every draw must converge. No draw is dropped, regenerated, or replaced.

  bridge_diagnostic_estimators:
    cell_means: >-
      Compute mu=E[X], m2=E[X^2], kappa=m2/mu, p=E[S], and ratio=p/mu with the
      same design weights. Zero denominators are inconclusive.
    slope_formula: >-
      For each eta subtract eta*(N^(-1/3)-2^-8) from the log of each positive
      five-size estimate, then use equal-size OLS against log(N/2^24).
    treatment_gates:
      kappa: 'UCB_99.5(delta_kappa)<=0.02 for eta=-4,0,4.'
      ratio: 'LCB_99.5(delta_ratio)>=-0.02 for eta=-4,0,4.'
      multiplicity: 'UCB_99.5(slope of Y/max(1,X))<=0.02 for every eta.'

  proof_search_map:
    bottleneck: >-
      Establish or falsify marginal Boolean gamma_s>5/18 with per-root work and
      storage N^(1/3+o(1)); expected multiplicity or raw-only gamma_s>1/6 is insufficient.
    baseline_embedding:
      parameter_slice: >-
        gamma_s=0 gives p_N=N^(-1/3+o(1)), raw time N^(2/3+o(1)), storage
        N^(1/3+o(1)), and formal full exponent N^(7/9+o(1)), the
        memory-matched-BSGS exponent boundary.
      reproduction_check: >-
        A future S0 segmented-BSGS fixture must share point encoding, operation
        counters, widths, equality, verification, and formal Wiener calculator
        and reproduce exponents (2/3,1/3,7/9).
    observation_collision:
      observable: 'The tuple (E[Y],E[X],kappa_N,p_N/E[X],p_N).'
      distinct_preimage_search: >-
        The deterministic diffuse and concentrated streams have equal E[X] and
        E[Y], while the concentrated stream has kappa=N^(1/3) and Boolean
        probability lower by N^(-1/3).
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: 'Marginal root tuple plus kappa_N and p_N/E[X].'
        predicted_gain: Makes polynomial concentration observable.
      - transform: representation_reduction
        proposed_object: >-
          Signed-y selection followed by full points, exact equality, scalar
          reconstruction, and independent verification.
        predicted_gain: >-
          Conditional conversion of coordinate compatibility into verified
          Boolean probability, with no free oracle.
      - transform: observable_fiber
        proposed_object: >-
          Hold curve, target, canonical roots, and ECDLP fixed while changing
          the public isomorphic model or balanced label map.
        predicted_gain: Separates apparatus, representation, and group structure.
    quantifier_order: >-
      EXISTS one public h_y and one public family/model distribution fixed
      before data, and epsilon>0, SUCH THAT FOR ALL sufficiently large N in the
      distribution p_N>=N^(-1/3+5/18+epsilon+o(1)) while HA-1, HA-3, HA-4,
      and HA-6 hold. No curve, model, eta, gamma, seed, or correction is chosen
      after treatment. The toy ladder cannot establish this quantifier.
    method_ceiling:
      strongest_certifiable_claim: >-
        p_N<=1 implies gamma_s<=1/3. Four length-L lists impose N^(1/3+o(1))
        work and memory floors; the formal Wiener floor is N^(4/9+o(1)).
      nearby_object_control: >-
        An exact quotient on Z/(M^3)Z has order-one Boolean success; a balanced
        antisymmetric odd-prime cyclic label is the gamma_s=0 leading null.
    proof_obligations:
      - {claim: signed-y antisymmetry and scalar recovery, responsibility: correctness}
      - {claim: selector caps and lossless schemas, responsibility: size}
      - {claim: complete framed XOF and SHA schedules, responsibility: runtime}
      - {claim: exact finite sampler law and nine interval certificates, responsibility: interface}
      - {claim: total identity-inclusive curve equation and ordered hashes, responsibility: correctness}
      - {claim: logical traffic archive live peak spill workspace and communication, responsibility: memory}
      - {claim: marginal distinct-match exponent, responsibility: success_probability}
      - {claim: Paley-Zygmund bridge and matched-mean collision, responsibility: success_probability}
      - {claim: independent restarts and inverse-p_N cost, responsibility: runtime}
      - {claim: exponent-class-only comparison boundary, responsibility: strictness}
      - {claim: preprocessing discovery advice query and multi-target scope, responsibility: scope}
    claim_audits:
      - id: PC-BOOLEAN-COST
        baseline_reproduction: 'gamma_s=0 -> formal (raw,memory,full)=(2/3,1/3,7/9).'
        observation_collision: matched_mean_equal_means_with_distinct_Boolean_cost
        quantifier_order: 'exists fixed public rule and epsilon, then forall sufficiently large N.'
        method_ceiling: 'gamma_s<=1/3 and formal full exponent >=4/9.'
        cheapest_falsifier: repaired_matched_mean_decoder_seed_and_estimator_fixture
      - id: PC-XOF-KEY-TOTALITY
        baseline_reproduction: 'Preserve 8 fixed and 17 capped output rows and 91134286848 output bytes.'
        observation_collision: >-
          Equal domain/component fields with different list positions collided
          before the u32 ordinal; XOFKey64 separates them.
        quantifier_order: >-
          For every one of 8561226112 XOF states there exists exactly one valid
          64-byte key frame, and every multi-item list state has exactly one
          ordinal in 0..L-1.
        method_ceiling: 'Certifies deterministic byte regeneration, not pseudorandomness or ECDLP structure.'
        cheapest_falsifier: duplicate_any_complete_key_or_omit_any_list_ordinal
      - id: PC-HASH-COMPLETENESS
        baseline_reproduction: >-
          Reproduce the predecessor 785684-message arithmetic, then derive the
          exact +9 messages, +31498944 bytes, +492180 blocks, and five traffic rows.
        observation_collision: >-
          Equal raw payloads in different contexts are separated by fixed
          headers; every output digest maps to one declared archive subfield.
        quantifier_order: >-
          For every declared SHA-256 digest there exists exactly one framed
          message, one operation row, one CPU row, one wall row, and one output
          archive mapping.
        method_ceiling: 'Certifies schedule completeness, not collision resistance as a theorem.'
        cheapest_falsifier: any_family_fixture_or_full_schedule_residual
      - id: PC-CERTIFICATE-HASH-BIJECTION
        baseline_reproduction: 'Nine finite-target rectangles remain unchanged.'
        observation_collision: >-
          A certificate id without serialized directed endpoints cannot
          distinguish two computations over the same outer rectangle.
        quantifier_order: >-
          For each of nine certificate ordinals there exists exactly one
          4032-byte preimage, one source interval, one digest slot, and one cost row.
        method_ceiling: 'Certifies serialization and accounting, not strict interval inclusion.'
        cheapest_falsifier: any_source_overlap_digest_slot_alias_or_noncanonical_endpoint
      - id: PC-ARCHIVE-SELF-NEUTRALITY
        baseline_reproduction: 'Retain 42 allocations, 42 writes, 42 reads, and 2252694592 bytes per pass.'
        observation_collision: >-
          Direct hashing and zero-neutral hashing agree on an all-zero index,
          so the nonzero A5/5A round-trip fixture is required to discriminate them.
        quantifier_order: >-
          For every one of 84 allocation/pass messages exactly one output slot
          exists; for allocation 25 and both passes, all 84 output slots are
          excluded before hashing and no other byte is excluded.
        method_ceiling: 'Certifies a finite byte construction, not filesystem durability.'
        cheapest_falsifier: nonzero_round_trip_digest_change_or_dependency_cycle
      - id: PC-CAP-CONDITIONED-RATIONAL-LAW
        baseline_reproduction: 'Five dyadic rows use A/2^256 and ten non-dyadic rows use A/(2^256-1).'
        observation_collision: 'q and q_cap can round identically while differing as exact rationals.'
        quantifier_order: 'Every event has the frozen rowwise admitted law or the package is invalid.'
        method_ceiling: 'Certifies the synthetic law only; no signed-y evidence.'
        cheapest_falsifier: exact_numerator_denominator_or_interval_Newton_mismatch
      - id: PC-IDENTITY-HASH-FRAME
        baseline_reproduction: '13120 canonical plus 39360 transformed points equals 52480 checks.'
        observation_collision: >-
          Point bytes alone omit model, role, identity, and on-curve state; the
          77-byte point frame separates all ordered observations.
        quantifier_order: >-
          Every one of 160 streams contains one 60-byte header and exactly 328
          ordered 77-byte point frames.
        method_ceiling: 'Certifies fixture binding and equation apparatus, not treatment scaling.'
        cheapest_falsifier: any_ICC2_frame_length_tag_order_or_byte_total_mismatch
      - id: PC-EXPONENT-ONLY-PARETO
        baseline_reproduction: 'Widths 96,128,160 and all nine formal exponent evaluations remain exact.'
        observation_collision: >-
          Equal exponent tuples can hide incompatible concrete event units;
          the successor refuses a concrete matched-frontier inference.
        quantifier_order: >-
          Every displayed time relation is only a formal N-exponent relation
          under the stated N^o(1) event-cost assumptions.
        method_ceiling: 'No concrete runtime, matched-unit dominance, or realized frontier can be certified.'
        cheapest_falsifier: any_concrete_dominance_or_group_addition_equivalent_label
    remaining_unproved_obligations:
      - No theorem or observation supports positive gamma_s on prime curves.
      - HA-3 and family/model transfer remain unmeasured.
      - The toy ladder cannot validate cryptographic scale.
      - External novelty and real-machine constants remain unverified.
      - Every producer compiler assertion below awaits independent validation.
    not_applicable_reason: null

  predictions:
    - {id: P1-balanced-null, metric: marginal_gamma_s, direction: different, minimum_effect: 'interval contains 0; no formal full-exponent gate crosses'}
    - {id: P2-exact-quotient, metric: marginal_gamma_s, direction: higher, minimum_effect: 'interval contains 1/3 and every witness verifies'}
    - {id: P3-planted-gamma, metric: marginal_gamma_s, direction: different, minimum_effect: '1/6,5/18,3/10 ordered; 5/18 is formal exponent tie'}
    - {id: P4-matched-mean, metric: bridge_slopes, direction: different, minimum_effect: 'diffuse 0,0; concentrated +1/3,-1/3'}
    - {id: P5-eta-coverage, metric: pointwise_99_percent_coverage, direction: different, minimum_effect: '500..512 covers and at most 7 misses per side in all 12 cells'}
    - {id: P6-treatment, metric: marginal_gamma_s, direction: higher, minimum_effect: 'LCB_99.5>5/18 under every eta and every bridge/cost/scope gate'}

  deterministic_generators:
    status: prospective_not_executed
    integer_convention: >-
      All integers are unsigned unless eta is explicitly i8. SHAKE256 outputs,
      fixed binary frames, and candidate u64 words are big-endian. Lists reject
      duplicate accepted scalars. Every accepted-word index is retained.
    domain_separation_rule: >-
      XOF state identity is the complete 64-byte XOFKey64 frame below, not a
      prose string. A compiler rejects a bad magic, version, length, code,
      sentinel, reserved byte, range, duplicate frame, missing frame, or
      noncanonical ordering before any control or treatment can be admitted.
