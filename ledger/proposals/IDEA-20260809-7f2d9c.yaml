        - {offset: 28, width: 2, field: bucket, encoding: u16be}
        - {offset: 30, width: 2, field: flags, encoding: u16be}
      message_formulas:
        treatment: '64+8*U*64=64+512*U.'
        each_generic_control: '64+8*U*32=64+256*U.'
        exact_quotient: '64+8*(U-1)*32=64+256*(U-1).'
      canonical_fixture_rule: >-
        bits=18, curve=model=root=0; every capacity record is a canonical
        inactive record. Apply payload_order literally: left records carry
        (side,source_list,partner_list)=(0,0,1), right records carry (1,2,3),
