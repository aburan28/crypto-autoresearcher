  novelty_screen:
    method: >-
      FILESYSTEM, LEDGER AND WEB, same procedure as IDEA-20260901-185ca5.
      Grepped for complementation, self-equivalence, automorphism group,
      slide attack, dual cipher, Barkan, Wernsdorf; read KN-LIT-4464,
      KN-LIT-2559, KN-LIT-7062 corpus entries; WebSearch located Barkan-Biham
      (retrieved and read), the Le-Sparr-Wernsdorf-Desmedt title (abstract
      not retrievable), and the corpus rows for the slide literature.
    results: >-
      THE SELF-DUAL ATTACK CLASS AND AES'S NON-SELF-DUALITY UNDER THE EGF(2^8)
      DUALITIES ARE KNOWN (Barkan-Biham, read). THE EXACT-SLIDE CLOSURE VIA
      RCON IS KNOWN AS DESIGN RATIONALE (recalled). What this session could
      not find in any read or corpus record: a classification of the full
      round-wise affine equivariance group of AES with the key schedule
      included, the V_M computation, or a measured almost-self-similarity
      defect distribution. The Le-Sparr-Wernsdorf-Desmedt paper is the most
      likely place for part of claim (C) to be prior art and could not be
      read; it is named so the executor opens it first. Internally,
      IDEA-20260808-ddb522 uses round-function symmetries for a different
      deliverable and explicitly leaves the key-schedule question aside.
    verdict: >-
      UNVERIFIED, with claims (A), (B) and (E) KNOWN and claims (C) and (D)
      as the unresolved part. The record is filed because RQ-AES-002 C3 asks
      for barrier statements at the closure standard with an archived
      derivation and a positive control, and no committed record supplies
      one for this class; it is ranked below the two companion records
      because its expected result largely consolidates known facts.

  object_first_candidate:
    tracked_object: >-
      THE EQUIVARIANCE GROUP Aut = {(tau_K, tau_S)} of the keyed cipher, and
      its two degenerate shadows: the round-wise affine subgroup (computed)
      and the temporal shift structure of the key-schedule state sequence
      (closed exactly, defect measured). Established families declared
      OFF-LIMITS as the primary lens and not used: differential and truncated
      differential; linear and multidimensional linear; integral, square,
      division property; impossible differential; meet-in-the-middle and
      Demirci-Selcuk; boomerang and retracing boomerang; biclique; algebraic
      and Groebner; yoyo; mixture and exchange; subspace trail; partial sums.
      The slide and self-dual families are not on that list; they are the
      classes being closed, and the lens is the group, not the attack.
    lossiness: >-
      PASSES. The projection from the cipher to its equivariance group
      discards everything about the cipher except which coordinate changes it
      cannot see; 2^128 keys collapse to |Aut| orbits, and the retained
      structure propagates deterministically through every layer by
      definition (an equivariance commutes with each layer). For the temporal
      shadow, the projection of a key to its schedule-state repeat pattern
      discards the key and retains only which (j, p) pairs coincide, and
      propagates exactly under the schedule step. A trivial group is the
      honest degenerate case of a lossy projection, and establishing
      triviality is the deliverable.
    propagation: >-
      For a candidate (A, b) the one-step check is exact: conjugate one keyed
      round and test whether the result is a keyed round; the record's three
      filters are that check factored through the three layers. For the
      temporal shadow the one-step propagation is the schedule step and the
      record's lemma is the statement that a coincidence cannot survive one
      step.
    survival_score: >-
      Expected to survive ZERO filters for AES (trivial group) and all three
      for the Barkan-Biham self-dual variant (group containing the Frobenius
      of order 8). The interesting intermediate rungs are the graded controls:
      real AES with Rcon in {0, 1} (temporal shadow revives at one key, the
      Rcon = 0 fixed point of the schedule, hand-derived this session as
      words (0, 0, 0, 52525252_x) for AES-128 with the real S-box, to be
      machine-checked), and real AES with the S-box constant set to 0 and the
      binary MixColumns but the real affine matrix (square duality should
      still fail at the affine matrix, isolating that filter).

  proof_search_map:
    bottleneck: >-
      Existence of a non-trivial (tau_K, tau_S) with E_{tau_K K} o tau_S =
      tau_S o E_K for all K, P. For the round-wise subgroup the decisive step
      is filter (ii), V_M: if V_M is exactly the scalars, the rest is a finite
      check on 2040 x 256 candidates and a translation test.
    baseline_embedding:
      parameter_slice: >-
        Barkan-Biham's square-self-dual variant IS the baseline: on it the
        pipeline must find the Frobenius equivariance and the 8-fold speedup.
        The exact old-method boundary is their section 6.2 attack with 8
        chosen plaintexts P^{2^i}, reproduced at a toy key size where
        exhaustive search is enumerable.
      reproduction_check: >-
        A frozen fixture: (i) on the self-dual variant, E_{K^2}(P^2) equals
        (E_K(P))^2 on 10^3 random (K, P) at full round count; (ii) on real
        AES the same identity fails on all 10^3; (iii) the quotient search on
        a 16-bit or 20-bit toy-key self-dual instance finds the key in a
        measured mean number of trial encryptions equal to about 1/8 of plain
        exhaustive search's, ratio reported with its interval; (iv) on the
        same toy without self-duality the ratio is 1.
    observation_collision:
      observable: >-
        The group Aut (as computed) and the speedup ratio. Distinct ciphers
        with the same group collide, harmlessly. The dangerous collision is
        between "the pipeline found no equivariance" and "the pipeline cannot
        find equivariances", which is what the positive control separates.
      distinct_preimage_search: >-
        Exhibit two ciphers on each side: the self-dual variant (non-trivial
        group, pipeline must find it) and a variant with only the S-box
        constant changed to 0 but the real MixColumns (group predicted
        trivial by filter (ii) alone, pipeline must report trivial and NAME
        filter (ii) as the killer). A pipeline that reports trivial on both
        or non-trivial on both has not identified the load-bearing filter.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Reduce equivariance existence to (a) a linear-algebra subspace V_M,
          (b) a finite intersection with S-box self-equivalences, (c) a
          translation test, (d) a key-schedule compatibility test, with each
          arrow's hypothesis stated (round-wise, affine, byte-parallel
          S-layer) and its loss stated (global-only equivariances are not
          covered).
        predicted_gain: >-
          A section-4 closure naming the filter that kills each candidate
          class, plus the exact group order, at negligible compute.
      - transform: observable_fiber
        proposed_object: >-
          Hold the round function fixed and vary the forgotten structure,
          the key schedule: real schedule, Rcon in {0, 1}, Rcon = 0, sigma-
          equivariant schedule; measure which equivariances and which
          temporal coincidences appear in each fibre.
        predicted_gain: >-
          Localises every symmetry that AES's round function would admit to
          the schedule feature that removes it, which is exactly the
          forward guidance a closure needs.
    quantifier_order: >-
      ROUND-WISE CLOSURE: FOR ALL affine tau_S = (A, b) and ALL maps phi on
      round keys, if tau_S o (Add_k o lambda o SB) = (Add_{phi(k)} o lambda o
      SB) o tau_S for all k then tau_S is the identity; equivalently the
      round-wise group is trivial. The candidate tau_S is allowed to depend on
      nothing; phi is allowed to depend on tau_S. WHAT IS NOT CLAIMED: FOR ALL
      (tau_K, tau_S) with E_{tau_K K} o tau_S = tau_S o E_K -- a global
      equivariance need not be round-wise, and that class is open. TEMPORAL:
      FOR ALL keys, FOR ALL j, p >= 1, NOT (s_j = s_{j+p} AND s_{j+1} =
      s_{j+p+1}); unconditional.
    method_ceiling:
      strongest_certifiable_claim: >-
        That the round-wise affine equivariance group of AES-128/192/256 is
        trivial, hence no symmetry-quotient attack of the DES-complementation
        or Barkan-Biham self-dual form divides exhaustive search by more than
        1; that exact slid pairs over two schedule steps exist for no key; and
        the measured distribution of the almost-self-similarity defect.
        Cannot certify: absence of global-only equivariances; absence of
        probabilistic slide attacks consuming a small defect (their cost is
        bounded by the measured distribution, not closed by it).
      nearby_object_control: >-
        The Barkan-Biham self-dual variant (non-trivial group, must be
        found) and the single-filter variants (constant 0 with real
        MixColumns; binary MixColumns with real S-box constant; real
        components with Rcon in {0, 1}), each with a predicted killer filter
        that the pipeline must name.
    proof_obligations:
      - claim: >-
          The self-dual variant satisfies Theorem 1 of Barkan-Biham at full
          round count on random inputs and real AES does not.
        responsibility: baseline
      - claim: >-
          Round-wise equivariance forces tau_S into AGL(128, 2) (normaliser of
          the regular translation group).
        responsibility: correctness
      - claim: >-
          V_M is computed exactly and equals the scalar multiplications for
          the real MixColumns; contains the Frobenius block for the binary
          alternative.
        responsibility: correctness
      - claim: >-
          The affine self-equivalence set of the AES S-box is enumerated
          (BDBP algorithm re-implemented) or the closure is scoped to the
          2040-element recalled subgroup with the scoping stated.
        responsibility: feasibility
      - claim: >-
          No candidate survives filters (ii) and (iii) except the identity;
          translations fail by the S-box having no linear structure
          (recomputed).
        responsibility: strictness
      - claim: >-
          The temporal lemma holds for the three schedules with their Rcon
          sequences as pinned.
        responsibility: correctness
      - claim: >-
          The measured 8-fold speedup on the toy self-dual instance and the
          ratio 1 on the non-self-dual toy.
        responsibility: success_probability
      - claim: >-
          Scope: round-wise affine equivariances; exact slides; all three
          key sizes; the almost-self-similarity defect at 10^5 keys.
        responsibility: scope
    not_applicable_reason: null

  assumptions:
    - >-
      The pinned harness is ground truth for the S-box, MixColumns, ShiftRows
      and the three key schedules; the self-dual variant is built by editing
      exactly the constants Barkan-Biham name and nothing else, and the edit
      list is committed.
    - >-
      The normaliser of a regular elementary abelian 2-group in the symmetric
      group is the affine group (a standard fact, re-derived in one paragraph
      in the derivation note).
    - >-
      The recalled 2040 count of linear self-equivalences of inversion is
      either recomputed by an in-repo affine-equivalence algorithm or the
      closure is explicitly scoped to that subgroup.

  predictions:
    - metric: >-
        V_M_dimension: the GF(2)-dimension of the subspace of block 4-tuples
        conjugating through MixColumns to block-diagonal form, for the real M
        and for the binary alternative
      direction: different
      minimum_effect: >-
        Real M: exactly 8 (the scalar multiplications by GF(2^8)), no more.
        Binary M: strictly larger, containing [sigma] tensor I_4 for the
        Frobenius sigma. A real-M dimension above 8 is the record's most
        informative negative and is exhibited.
    - metric: >-
        surviving_candidates: number of non-identity (A, b) surviving filters
        (i)-(iii) for real AES
      direction: lower
      minimum_effect: >-
        Exactly 0. Any survivor is exhibited with its key-schedule test
        result.
    - metric: >-
        self_dual_identity_check: fraction of 10^3 random (K, P) at full
        round count on which (E_K(P))^2 = E_{K^2}(P^2)
      direction: different
      minimum_effect: >-
        1.000 on the self-dual variant, 0.000 on real AES.
    - metric: >-
        measured_quotient_speedup: ratio of the mean number of trial
        encryptions of plain exhaustive search to that of the 8-plaintext
        quotient search, over 200 random toy keys
      direction: higher
      minimum_effect: >-
        About 8 (within 10 percent) on the self-dual toy; about 1 on the
        non-self-dual toy. A ratio near 1 on the self-dual toy means the
        search implementation does not exploit the orbit and the control is
        void.
    - metric: >-
        exact_slide_coincidences: number of keys among 10^5 per key size with
        two consecutive equal schedule-state pairs at any shift
      direction: lower
      minimum_effect: >-
        Exactly 0 by the lemma; the count on the Rcon = 0 variant must be
        at least 1 (the hand-derived fixed point) and the instrument must
        report it.
    - metric: >-
        almost_self_similarity_defect: distribution over 10^5 keys of the
        minimum byte Hamming distance between s_j and s_{j+p} over all
        (j, p), per key size
      direction: different
      minimum_effect: >-
        Compared with the random null (independent uniform states of the
        same shape). Agreement within 2 standard errors records the defect
        as random-like, which bounds the probabilistic-slide class by the
        null; a systematic excess of small distances is a structural finding
        handed to that class.
    - metric: >-
        killer_filter_attribution: for each graded control variant, the
        filter at which the pipeline reports the candidate symmetry dying
      direction: different
      minimum_effect: >-
        Must match the pre-registered prediction per variant (constant-0 with
        real M dies at (ii); binary M with real constant dies at (iii);
        real components with Rcon in {0, 1} die at (iv)). A mismatch is a
        mislocalised mechanism and is reported as such.

  minimal_test:
    design: >-
      FOUR STAGES. STAGE 0 (derivation): one-page note with the normaliser
      lemma, the reduction to V_M and the self-equivalence intersection, and
      the temporal lemma for the three schedules. STAGE 1 (minutes): compute
      V_M for the real M and the binary alternative; run the self-dual
      identity check on the variant and on real AES; compute the S-box's
      linear structures (none expected) and, if the BDBP algorithm is
      implemented, its affine self-equivalences, else scope to the 2040
      recalled ones. STAGE 2 (minutes): intersect; test survivors against the
      key schedule; run the graded controls and record the killer filter for
      each. STAGE 3 (under an hour): the toy quotient-search measurement on
      self-dual and non-self-dual toys; the exact-slide count and the
      almost-self-similarity defect distribution on 10^5 keys per key size
      against the random null and on the Rcon = 0 variant. Every stage
      commits its digest before the next reads it.
    controls:
      - >-
        POSITIVE CONTROL (blocking): the Barkan-Biham self-dual variant, on
        which the pipeline must find the Frobenius equivariance and the toy
        search must show the 8-fold ratio.
      - >-
        GRADED SINGLE-FILTER CONTROLS: three variants each predicted to die at
        a named filter; the pipeline must name the right one.
      - >-
        RANDOM NULL for the defect distribution: independent uniform schedule
        states of the same shape.
      - >-
        RCON = 0 CONTROL for the temporal shadow: the instrument must report
        the fixed-point key.
      - >-
        PRE-REGISTRATION: V_M dimension predictions and killer-filter
        attributions are committed before Stage 1 runs.
    required_metrics:
      - V_M dimension and basis for real and binary M
      - self-equivalence set size (computed or scoped) and surviving-candidate count
      - self-dual identity fractions on variant and on AES
      - measured quotient speedup ratios with intervals on both toys
      - exact-slide coincidence counts, real schedules and Rcon = 0
      - almost-self-similarity defect distributions per key size versus null
      - killer-filter attribution table for the graded controls
      - derivation note and artifact manifest with hashes and a rebuild receipt

  falsification_conditions:
    - >-
      V_M for the real M has dimension above 8: a non-scalar byte-local map
      commutes with MixColumns up to block structure; it is exhibited and
      the closure is withdrawn pending its analysis. This is the outcome the
      record would most want to be wrong about.
    - >-
      A non-identity candidate survives all four filters: AES has a
      round-wise equivariance; it is exhibited with its orbit size, the
      closure is dead, and the record's construction reading applies (a
      speedup by the orbit size, constant-factor).
    - >-
      The pipeline fails to find the Frobenius equivariance on the self-dual
      variant, or the toy ratio on it is near 1: the instrument cannot see
      symmetries and the AES verdict is void.
    - >-
      The graded controls die at the wrong filters: the mechanism is
      mislocalised and no closure is stated until it is fixed.
    - >-
      An exact-slide coincidence is found on a real schedule: the temporal
      lemma or the Rcon table is wrong; exhibited and re-derived.
    - >-
      The Le-Sparr-Wernsdorf-Desmedt complementation-like property, once
      read, turns out to hold with the key schedule and to yield a speedup:
      claim (C)'s prediction is falsified by prior art and the record is
      superseded as a rediscovery, with the property recorded.

  confounders:
    - >-
      ROUND-WISE VERSUS GLOBAL EQUIVARIANCE. The derivation reaches only
      symmetries that commute with each keyed round; a symmetry of the
      composed cipher that fails round-wise is not excluded. MITIGATION:
      named in the quantifier order and the ceiling; no universal claim.
    - >-
      THE LAST ROUND LACKS MIXCOLUMNS, so the conjugation constraint differs
      there; an equivariance must satisfy both forms. MITIGATION: this only
      adds constraints; the closure via the MC o SR rounds is conservative.
    - >-
      THE SELF-EQUIVALENCE ENUMERATION MAY BE SCOPED TO THE RECALLED 2040
      linear ones plus translations rather than the full affine set.
      MITIGATION: the scoping is stated in the closure and the BDBP
      re-implementation is named as the way to remove it.
    - >-
      THE TOY SPEEDUP RATIO DEPENDS ON THE TOY KEY SIZE AND ON CYCLE-LENGTH
      DISTRIBUTION (orbits of size 1, 2, 4, 8). MITIGATION: the expected ratio
      is computed from the toy's orbit-size distribution and the measurement
      is compared with that prediction, not with a bare 8.

