idea:
  id: IDEA-20260901-335c31
  question_id: RQ-AES-002
  research_question: RQ-AES-002
  goal_id: GOAL-AES-002
  added: '2026-09-01'
  title: >-
    THE SYMMETRY GROUP OF THE KEYED CIPHER IS THE EXACT SIZE OF THE
    SYMMETRY-QUOTIENT SPEEDUP, AND FOR AES IT HAS NEVER BEEN WRITTEN DOWN WITH
    THE KEY SCHEDULE INCLUDED: classify the round-wise affine equivariances
    (tau_K, tau_S) of full-round AES -- the object behind the DES
    complementation property and the Barkan-Biham self-dual attack, which
    divides exhaustive search by the number of self-dualities -- by a
    three-gate derivation (translation-normaliser lemma, the MixColumns
    conjugation subspace V_M, the S-box self-equivalence intersection, then
    key-schedule compatibility), with Barkan-Biham's own square-self-dual
    Rijndael variant as the derived positive control on which the 8-fold
    quotient must appear as a MEASURED ratio, and with the Rcon-distinctness
    argument closing exact temporal self-similarity (slide) for all three key
    sizes in the same record, leaving the almost-self-similar defect as a
    measured obstruction quantity
  class: mechanism

  claim: >-
    SIX SEPARABLE CLAIMS. (A) THE CLASS AND ITS EXACT SPEEDUP, FROM THE
    PRIMARY TEXT. Barkan and Biham (ASIACRYPT 2002, read this session, section
    6.2) show that a cipher with the square self-duality
    (E_K(P))^2 = E_{K^2}(P^2) admits a chosen-plaintext key search in about
    2^125 operations for a 128-bit key using 8 chosen plaintexts P^{2^i}, by
    testing one key per cycle of the squaring map on keys, i.e. a speedup by
    the number of self-dualities (8 for square, more for higher-order), and
    they note the number of rounds does not affect this. This is the
    DES-complementation mechanism generalised: a pair of maps (tau_K, tau_S)
    with E_{tau_K K} o tau_S = tau_S o E_K lets one trial encryption test a
    whole orbit of keys, and the speedup is EXACTLY the orbit size, i.e. the
    order of the equivariance group's action on keys. CLAIM: the maximal
    speedup available to any attack in the symmetry-quotient class is
    |Aut|, the size of the group of equivariances, and the deliverable is
    that number for AES, with its derivation archived. (B) WHAT IS KNOWN FROM
    THE READ TEXT, RECORDED AS KNOWN. Barkan-Biham state that square
    self-duality requires every constant to be 0 or 1, that Rijndael's S-box
    constant 63_x and MixColumns coefficients 02, 03 are not, and, for the
    16th-power case, that Rijndael's affine matrix is none of the
    7 x 5 x 3^2 x 2^22 self-dual matrices. So the specific EGF(2^8) dualities
    (square, higher-power, log) are known NOT to be self-dualities of AES.
    (C) WHAT IS NOT IN THE READ TEXT AND IS THE RECORD'S CONTENT: the general
    affine equivariance group. Round-wise equivariance -- tau_S conjugating
    each keyed round Add_k o lambda o SB to a keyed round with key phi(k) --
    forces tau_S to normalise the translation group (because the quotient of
    two keyed rounds is a translation), hence tau_S is in AGL(128, 2) by the
    standard normaliser fact; then tau_S = (A, b) must satisfy
    SB(Ax + b) = A' SB(x) + b' with A' = lambda^{-1} A lambda, i.e. (A, A')
    is an affine self-equivalence pair of the S-box LAYER whose output side is
    the lambda-conjugate of its input side. The record computes: (i) the
    linear subspace V_M of 4-tuples of 8x8 GF(2) blocks (B_1..B_4) such that
    M^{-1} diag(B) M is block-diagonal (a 256-dimensional linear-algebra
    problem, exact); (ii) the finite set of affine self-equivalence output
    maps of the AES S-box (RECALLED to be generated by the 2040 linear
    self-equivalences of inversion, x -> mu x^{2^i}, pushed through the
    affine L; recomputed or scoped); (iii) their intersection subject to the
    byte-permutation induced by ShiftRows; (iv) whether any survivor is
    compatible with the key schedule, i.e. whether there is phi with
    KS(phi(K)) = (tau applied round-wise to KS(K)). PREDICTION: V_M consists
    exactly of the scalar multiplications (B_t = [lambda] for a common lambda
    in GF(2^8)), because M commutes with GF(2^8) scalars and with nothing
    else byte-local; no non-identity self-equivalence of the AES S-box has a
    scalar output map because the GF(2)-affine L does not normalise the
    multiplicative group; the only remaining candidates are pure translations,
    which fail because the S-box has no linear structure; hence the round-wise
    equivariance group of AES is TRIVIAL and the symmetry-quotient speedup is
    exactly 1. (D) THE POSITIVE CONTROL IS DERIVED FROM THE SAME PAPER.
    Barkan-Biham section 6 constructs a square-self-dual Rijndael variant:
    S-box constant 63_x replaced by 00_x or 01_x, the affine matrix replaced
    by a self-square one (they give 256 such, 128 involutive), MixColumns
    replaced by the binary self-inverse matrix with rows 1110, 1101, 1011,
    0111, Rcon drawn from {0, 1}. On that variant V_M must contain the
    Frobenius block [sigma] tensor I_4, the S-box must have sigma as a
    self-equivalence, the key schedule must be sigma-equivariant, and the
    8-fold quotient search must beat plain exhaustive search by a MEASURED
    ratio of about 8 on a toy-key-size instance (validation ladder step 2).
    (E) TEMPORAL SELF-SIMILARITY, CLOSED EXACTLY FOR ALL KEYS. Let s_j be the
    key-schedule state at Rcon step j (4, 6 or 8 words for AES-128/192/256),
    with s_{j+1} = f_j(s_j) where f_j differs from f_{j'} only by the XOR of
    Rcon_j versus Rcon_{j'} into one word. If s_j = s_{j+p} and
    s_{j+1} = s_{j+p+1} for some j, p >= 1, then f_j(s_j) = f_{j+p}(s_j),
    forcing Rcon_j = Rcon_{j+p}, which is false because the Rcon values
    02^{i-1} are distinct within each schedule (i up to 10, 8, 7). HENCE no
    key of any size has two consecutive equal schedule-state pairs at any
    shift, so exact slid pairs over two or more schedule steps do not exist
    for any key; this is a one-line rigorous closure of the exact-slide
    class, and it is RECALLED to be the design rationale for Rcon, so its
    novelty status is known. What is NOT closed and is measured instead: the
    almost-self-similarity defect, the minimum over (j, p) of the byte
    Hamming distance between s_j and s_{j+p}, whose distribution over keys is
    compared to the random null (each byte equal with probability 1/256);
    KN-LIT-5924 and KN-LIT-5151 (corpus, title level) are the probabilistic
    slide techniques that would consume a small defect, and the measured
    distribution is the obstruction quantity for them. (F) WHAT IS NOT
    CLAIMED. NOT any attack; NOT a closure of equivariances that hold for the
    composed cipher without holding round-wise (global-only equivariances),
    which are named open; NOT any relation to the published state of the art,
    unadjudicable here; NOT an exponent: the class's best case is a constant
    factor |Aut|, and the record's expected outcome is |Aut| = 1.

  mechanism: >-
    An equivariance is a change of coordinates on plaintexts, ciphertexts and
    keys that the cipher cannot see; the DES complementation property is the
    case tau = complement on all three, and Barkan-Biham's self-dual attack is
    the case tau = byte-wise squaring. Either lets the attacker query the
    oracle on tau(P), tau^2(P), ... and test the entire tau-orbit of a
    candidate key with one trial encryption, so the exhaustive-search cost
    divides by the orbit size. The mechanism this record tests is that every
    such symmetry must survive three filters in AES simultaneously: the
    translation group (forcing affinity), the GF(2^8)-linear MixColumns
    (forcing the byte-local linear part to be a common field scalar, the
    computation V_M), and the GF(2)-affine S-box layer (whose self-
    equivalences are semilinear in the field and, after L, have no scalar
    output map) -- three structures that are individually symmetric but
    jointly, as KN-FIND-028 and the Möbius-bridge closure both observe from
    other angles, rigid. The key schedule adds a fourth filter (Rcon) that on
    its own kills both the square duality and temporal self-similarity. The
    derivation names which filter kills which candidate, which is what the
    section-4 closure standard demands, and the positive control shows the
    same pipeline passing a symmetry when one is present by design.

