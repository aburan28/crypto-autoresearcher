  heuristic_assumptions:
    - id: H1
      statement: >-
        DEFECT-NULL HEURISTIC. For a uniformly random master key, the byte
        Hamming distances between distinct key-schedule states s_j and
        s_{j+p} (over all pairs j < j + p within the schedule) are
        distributed as distances between independent uniformly random states
        of the same word length, apart from the exact constraints the lemma
        imposes (no two consecutive coincidences); in particular the minimum
        distance over all pairs has the null distribution computed from
        independent uniform states.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the temporal lemma (claim E), which excludes
        distance 0 at two consecutive steps for every key, and the bijectivity
        of the schedule. CLASSICAL DISTRIBUTION IMITATED: the distribution of
        the minimum of Binomial(m, 255/256) distances over C(N, 2) pairs of
        independent uniform m-byte words (m = 16, 24, 32). THE GAP: schedule
        states are deterministically related (consecutive states share three
        of four words up to XOR for AES-128), so nearby pairs are NOT
        independent; the null must be computed for the same pair set with
        the schedule's linear relations respected, or the comparison
        restricted to pairs at distance p >= 2, and the record does the
        latter and says so.
      falsification_condition: >-
        The empirical minimum-distance distribution for p >= 2 differs from
        the null by more than 2 standard errors at 10^5 keys, or the count
        of pairs at distance <= 2 exceeds the null's 99th percentile.
      validation_plan: >-
        SAMPLE: 10^5 master keys per key size from a declared seed, expanded
        by the pinned harness; at real parameters, no shortcut needed.
        COMPARISON: histogram of minimum pairwise distance (p >= 2) against
        the null computed by simulation on independent uniform states of the
        same shape with the same pair set. TAIL CHECK: the smallest distance
        observed and the number of keys attaining it, against the null tail.
        TRANSFER: none; the closure is exact and the defect is measured at
        full scale on a sample, with binomial intervals.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED AND NONE COULD BE BY THIS CLASS: its best case is
      a constant-factor division of exhaustive search by |Aut| (Barkan-Biham
      report 2^125 versus 2^128 for factor 8), and the record's expected
      outcome is |Aut| = 1, i.e. no division. Stated so, per the search
      heuristics, and justified as a section-4 closure with a derived
      positive control, which RQ-AES-002 C3 names as a deliverable.
    memory_exponent: >-
      Negligible for the instrument; the class itself needs O(|Aut|) chosen
      plaintexts and O(1) memory.
    best_known: >-
      Definitional reference: exhaustive key search at 2^{k-1} expected. For
      the class: Barkan-Biham's self-dual attack on self-dual ciphers (not
      AES), factor equal to the number of self-dualities.
    hidden_overhead: >-
      None. The self-equivalence enumeration may be scoped; the scoping is
      disclosed.
    tradeoff_note: >-
      None; the class trades a handful of chosen plaintexts for a constant
      factor, and the record measures that the factor is 1.

