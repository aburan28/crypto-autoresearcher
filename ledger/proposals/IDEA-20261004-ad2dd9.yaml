# IDEA-20261004-ad2dd9
# Class-number count for discriminants -164 and -184. Proposal only. Not approved.
idea:
  id: IDEA-20261004-ad2dd9
  question_id: RQ-JINV-8fc13a
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    The class number of discriminant -164 is 8 and of discriminant -184 is 4
  class: measurement
  claim: >-
    Discriminant -164 has 8 reduced binary quadratic forms.
    Discriminant -184 has 4. Eight exceeds four by 4. The product of
    the two class numbers is 32. Their sum is 12. The gap is a class
    number, not an ECDLP exponent and not an absolute discriminant.
  mechanism: >-
    OBJECT FRAME. The object is the set of reduced forms. The
    operation set is counting those forms, which is coordinate-dependent
    on the discriminant and is not a translation of a curve point.
    Discriminant -164 has the forms with coefficients 5, -4, 9 and
    3, -2, 14 and 6, -2, 7 and 1, 0, 41 and 2, 2, 21 and
    3, 2, 14 and 6, 2, 7 and 5, 4, 9. Discriminant -184 has
    the forms with coefficients 5, -4, 10 and 1, 0, 46 and
    2, 0, 23 and 5, 4, 10. Two copies of class number 4 have gap 0.
    No curve is enumerated.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks whether a small discriminant confers an
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-IC-889857
      provenance: internal
      claim: >-
        A first-fall-degree dispute is a different object from these
        two class numbers.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The two discriminants are frozen before the forms are counted.
    - No curve is enumerated.
  proof_search_map:
    bottleneck: The class-number gap 4.
    baseline_embedding:
      parameter_slice: The discriminants -164 and -184 and the counts 8 and 4.
      reproduction_check: >-
        Two readers must agree that the counts are 8 and 4.
    observation_collision:
      observable: The class-number gap and the product.
      distinct_preimage_search: >-
        Reporting both class numbers as 4 drops the gap. Two copies
        of class number 4 make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The two discriminants.
        predicted_gain: Integer gap. No curve enumeration.
    quantifier_order: >-
      The discriminants are fixed before the forms are counted.
    method_ceiling:
      strongest_certifiable_claim: >-
        The class numbers 8 and 4. Not an absolute discriminant.
      nearby_object_control: >-
        Two copies of class number 4. The gap is 0.
    proof_obligations:
      - claim: Discriminant -164 has 8 reduced forms.
        responsibility: size
      - claim: Discriminant -184 has 4 reduced forms.
        responsibility: size
      - claim: The gap is not an absolute discriminant.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: class_number_gap
      direction: different
      minimum_effect: Eight exceeds four by 4.
  minimal_test:
    design: >-
      Count the reduced forms of discriminants -164 and -184. Do not
      enumerate a curve.
    controls:
      - Two copies of class number 4, whose gap is 0.
      - An independent count.
    required_metrics:
      - both class numbers
      - the gap
      - the product
  falsification_conditions:
    - The class number of -164 is not 8.
    - The product of the two class numbers is not 32.
  confounders:
    - The absolute values 164 and 184 are not the class numbers.
  interpretation_limits:
    - A class number is not a walk length.
    - No transfer to a cryptographic discriminant.
    - This is not the class-number pair 7 and 2 of discriminants -151 and -187.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen discriminant -164 has class number 8, and the
        frozen discriminant -184 has class number 4.
      rigorous_support: >-
        No class-number theorem is re-proved here. The count is a
        reading of the reduced forms.
      validation_plan: >-
        Two independent counts of the reduced forms. A mismatch voids the gap.
