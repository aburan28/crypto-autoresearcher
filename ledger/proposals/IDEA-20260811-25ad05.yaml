    "level structure" (60+ files repo-wide, all ledger/ hits inspected);
    "simply transitive|simple transitivity|torsor" (37 proposal files);
    "cofactor" (94 proposal files, ENDO-linked hits triaged);
    "Pohlig" (43 files). FULL READS: IDEA-20260811-319a07 (the seed,
    complete), IDEA-20260811-40c0b5 (complete -- the nearest record and the
    source of the elimination-cost vocabulary), IDEA-20260808-5158fa (claim and
    mechanism), IDEA-20260807-e9d57c (claim), IDEA-20260807-8cdc79 (title and
    claim opening), RQ-RAYCL-3985f4, DECOMPOSITION.md L8-L12,
    docs/inventor-protocol.md, docs/target-result-profile.md, AGENTS.md,
    VAL-20260811-de63ea (the BATCH-aeeb17 validation report).
    RESULT: no record in the corpus states the elimination cost of an AUXILIARY
    INPUT (as opposed to an oracle), no record exhibits the instance-compatible
    construction [c]R = P, and no record runs the section-2 lossy-projection
    test against the ray-class coordinate. The underlying move (public
    samplability implies zero advice value) is folklore and is NOT claimed as
    new. novelty_status is `unverified` rather than `adaptation` because the
    external half of the screen could not be run at all.
  discriminated_from: >-
    IDEA-20260811-319a07 (the seed) is the record this one adjudicates. It is
    NOT contradicted on its algebra: this record accepts (A)-(C) of the seed and
    disputes only the inference that X_m is a new OBJECT, on the grounds of the
    section-2 test the seed did not run against itself, plus the sampling lemma
    the seed does not state. Where the seed marks simple transitivity [open],
    this record treats it as settled by IDEA-20260811-9402e9 and says what would
    change if it were not.
    IDEA-20260811-40c0b5 is the nearest record in METHOD: it prices the
    elimination cost of the Cl(O)-vectorization ORACLE at p^{1/4}. This record
    prices the elimination cost of an INPUT at p^{o(1)}. Different object,
    different exponent, and the two are complementary rather than overlapping --
    40c0b5's simulator needs p^{1/4} memory and so has a memory-poor regime
    where its conclusion changes; this one does not.
    IDEA-20260807-1b7241 (CAGG simulator) proves an oracle is worth zero INSIDE
    a model that forbids seeing x(Q) as a field element. This record makes no
    model restriction: real coordinates and non-uniform advice on (p, E, t) are
    both allowed, because the sampler does not care.
    IDEA-20260807-413fcc (curve-measurable oracles carry zero bits) is the
    closest in CONCLUSION but its object is an oracle taking no group handle;
    the level structure IS a group handle (it is a point), so 413fcc does not
    cover it, and this record's argument is a sampling argument rather than an
    information-capacity argument.
    IDEA-20260808-5158fa closes the characteristic-zero route at modulus
    n = (N, pi - 1) by showing the Artin symbol at p is trivial. That is a
    Galois-theoretic closure of a DIFFERENT object (a Galois group of a number
    field, not a char-p torsor of pairs) at a SMALLER modulus. It is cited here
    as an independent consistency check pointing the same way, not as a source:
    note that the same computation at modulus m = (pi - 1) also gives
    pi = 1 mod m, so the Artin symbol of the canonical prime is trivial in
    Cl_m(O) too -- a second, independent reason to expect T1. That observation
    is recorded as a corollary in this record's forward guidance and is not
    load-bearing for any claim above.
    IDEA-20260806-0c9de1 (X_1(N) diamond torsor) is a different torsor with
    structure group (Z/N)^*/{+-1}, and its closure is by three forced values,
    not by samplability.
