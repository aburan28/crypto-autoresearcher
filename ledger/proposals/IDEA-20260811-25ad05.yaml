  claim_tier: toy
  title: >-
    THE LEVEL STRUCTURE IS THE INSTANCE, SO THE FUSION IS A RELABELLING -- A
    DEFLATION THEOREM WITH TWO INDEPENDENT LEGS. Leg 1 (elimination cost, in
    IDEA-20260811-40c0b5's own vocabulary but applied to an AUXILIARY INPUT
    rather than to an oracle): a uniformly distributed element of the fibre of
    X_m over E is SAMPLED FROM PUBLIC DATA in O(log log p) expected group
    operations, and when E(F_p) is cyclic a generator R with [c]R = P is
    CONSTRUCTED from the instance's own P in O(log p) operations -- so
    equipping a curve with (pi - 1)-level structure has elimination cost
    p^{o(1)}, not p^{1/4} and not p^{1/2}, and every algorithm that merely
    RECEIVES level structure is simulated by one that does not at zero
    exponent cost. Leg 2 (the lossy-projection test of
    docs/inventor-protocol.md section 2, run and FAILED): the seed's tracked
    object -- the ray-class coordinate -- is a BIJECTION X_m -> Cl_m(O) once
    simple transitivity holds, i.e. it is injective on the state space modulo
    ECDLP's own symmetry group (F_p-isomorphism), so it discards nothing and
    is a change of coordinates rather than a new object. The seed's own
    survival_score ("perfectly identifying", "not constant on the instance
    family") is exactly the tell section 2 names. THIS IS T1, PROVED RATHER
    THAN SUSPECTED -- and the record states precisely what T1 does NOT close
  class: mechanism

  claim: >-
    (A) WHAT IS BEING DECIDED, AND WHY A PROOF BEATS A SUSPICION. RQ-RAYCL-3985f4
    asks whether the ray-class fusion of IDEA-20260811-319a07 carries
    computational content (T2/T3) or is a faithful restatement of ECDLP (T1).
    The question record names T1 as the expected outcome and an accepted
    deliverable. A closure that says "this seems circular" is a fatigue report
    under docs/inventor-protocol.md section 4. This record supplies instead a
    named obstruction with an argument and forward guidance: the level
    structure is PUBLICLY RECONSTRUCTIBLE, hence carries no private data, hence
    no cost functional can move for any algorithm whose only use of it is to
    receive it.

    (B) SETUP AND NOTATION, FIXED ONCE. p > 3 prime; E/F_p ordinary with
    Frobenius pi, End_{F_p}(E) = O maximal in K = Q(sqrt(D_0)); m := (pi - 1)O;
    #E(F_p) = Norm(m) = N * c with N prime, N || #E(F_p), G = <P> of order N,
    Q = [k]P. Facts used, with their status stated:
      [fact, elementary] E(F_p) = ker(pi - 1) = E[m].
      [recall-confident, NOT re-verified this session -- WebSearch and WebFetch
       failed on every call, Bedrock-routed, and the crypto-kb index is empty;
       attributed by IDEA-20260811-319a07 to H. W. Lenstra Jr., Complex
       multiplication structure of elliptic curves, J. Number Theory 56 (1996)]
       E(F_p) is isomorphic to O/m as an O-module.
    X_m := {(E', P') : E' in the class with End = O, P' an O-module generator
    of E'[m]} / F_p-isomorphism, as in the seed.

    (C) LEG 1 -- THE SAMPLING LEMMA AND THE SIMULATION THEOREM.

      LEMMA 1 (DENSITY; responsibility: size). The O-module generators of
      E'(F_p) ~= O/m are exactly the elements whose class lies in (O/m)^*, so
      their density is
        rho_m := #(O/m)^* / #(O/m) = prod_{q | m} (1 - 1/Norm(q)),
      the product over the distinct prime ideals dividing m. Since
      Norm(m) = #E(F_p) < 2p, Mertens' theorem gives
      rho_m >= 1/(C * log log p) for an absolute constant C and p large, so
      1/rho_m = O(log log p) = p^{o(1)}.

      LEMMA 2 (SAMPLING; responsibility: runtime). Given (p, E, t) and the
      factorisation of #E(F_p), a uniformly random element of the fibre of X_m
      over E is produced in expected O(log log p) trials, each costing one
      random point sample plus an order check -- O(log p * log log p) group
      operations total. NOTHING SECRET IS USED.

      LEMMA 3 (INSTANCE-COMPATIBLE CONSTRUCTION; responsibility: correctness;
      scoped to E(F_p) CYCLIC as an abelian group). Let c = #E(F_p)/N. Set
      R_0 := [c^{-1} mod N] P (order N) and let T be any point of order exactly
      c, obtained as T = [N]R' for a random R' with the order check. Then
      R := R_0 + T has order N*c, hence generates E(F_p), hence is an O-module
      generator, and
        [c] R = [c] R_0 = P.
      So the instance's OWN base point is the c-th multiple of a publicly
      constructed level structure, at cost O(log p) group operations and with
      no discrete logarithm solved anywhere. When c = 1 this degenerates to
      R = P: the ECDLP instance IS an element of X_m, on the nose.

      SIMULATION THEOREM (quantifiers written out; this is the deliverable).
        FORALL p > 3, FORALL ordinary E/F_p with End_{F_p}(E) = O maximal, D
          and the factorisation of #E(F_p) given,
        FORALL probabilistic machines A that take (p, E, P, Q, s) with
          s an element of the fibre of X_m over E and run in time T,
        THERE EXISTS a machine A' taking only (p, E, P, Q), uniform in
          (p, E, O), such that
        FORALL instances (P, Q = [k]P) with <P> = G of prime order N:
          the output distribution of A'(p, E, P, Q) equals that of
          A(p, E, P, Q, s) with s drawn from the fibre's uniform distribution,
          and Time(A') <= T + O(log p * log log p),
          and Memory(A') <= Memory(A) + O(log p).
      The order is load-bearing. A' is universally quantified over instances.
      TWO WEAKER READINGS ARE NOT CLAIMED: (W1) FORALL instances THERE EXISTS
      A'_instance -- void; (W2) A' matches A only on average over the class --
      not needed, the simulation is per-instance.
      COROLLARY (the answer to sub-question (c) of the question record). No
      cost functional measured anywhere in GOAL-ENDO-001 -- rho step count,
      vectorization step count, solving degree, relation yield, any
      class-function cost of L1 -- can DECREASE when a curve is equipped with
      (pi - 1)-level structure, because the equipping is a public p^{o(1)}
      subroutine. Formally: for every such functional F and every algorithm
      family, F(with level structure) >= F(without) - p^{o(1)}.

      RELATION TO IDEA-20260811-40c0b5. That record introduced the ELIMINATION
      COST of an ORACLE and computed it as p^{1/4} for Cl(O)-vectorization.
      This record instantiates the same accounting for an AUXILIARY INPUT
      rather than an oracle, and gets p^{o(1)} -- a strictly stronger
      elimination than 40c0b5's, on a different object. The vocabulary is
      borrowed and credited; the object and the exponent are not.

    (D) LEG 2 -- THE LOSSY-PROJECTION TEST, RUN AND FAILED.
      docs/inventor-protocol.md section 2: a tracked object must be a genuinely
      LOSSY projection of the underlying state, and a projection that loses
      nothing is a change of coordinates, not a new object. The worked failure
      there is (Delta, Pi) = (x + y, x*y) in characteristic 2, where the
      unordered pair is recoverable as the roots of t^2 + Delta t + Pi.
      APPLY IT HERE. Fix a base pair (E_0, P_0). The seed's tracked object is
        kappa : X_m -> Cl_m(O),  kappa(E', P') = the class carrying
        (E_0, P_0) to (E', P').
      If the Cl_m(O)-action on X_m is simply transitive -- which
      IDEA-20260811-9402e9 shows is a three-line theorem for O maximal, not an
      open obligation -- then kappa is a BIJECTION. The state it is a
      projection of is the pair (Weierstrass model, affine point). What kappa
      discards is exactly the choice of Weierstrass model and the affine
      coordinates of the point within it -- i.e. the F_p-isomorphism class
      representative. But ECDLP is invariant under F_p-isomorphism: an
      isomorphism-equivariant relabelling of the instance is precisely the
      symmetry group of the target problem. So kappa is INJECTIVE ON THE STATE
      SPACE MODULO THE TARGET'S OWN SYMMETRY GROUP, and it retains the secret
      in full: kappa(E, Q) * kappa(E, P)^{-1} maps to k under the ring
      surjection O/m -> O/n = Z/N with n = (N, pi - 1). VERDICT: FAILS the
      section 2 test. The seed's survival_score -- "the first object in this
      lane whose value is NOT constant on {(E, P, [k]P)}", "perfectly
      identifying" -- is not a virtue but the diagnostic: an object that
      retains the entire secret has discarded nothing that mattered.

    (E) WHAT THIS DOES NOT CLOSE -- STATED BEFORE ANY READER INFERS IT.
      A bijective re-coordinatisation CAN carry computational content when the
      new coordinates support operations the old ones do not. That is exactly
      how index calculus beats generic search in F_q^*. So (D) closes the claim
      "X_m is a NEW OBJECT" and does not by itself close "Cl_m(O)'s arithmetic
      supplies a NEW ALGORITHM". The second is priced separately in
      IDEA-20260811-9bc805 (answer: the torsor walk costs p^{3/4}, the
      kernel-restricted walk IS rho at p^{1/2}, and the subexponential
      index-calculus corner is blocked at the ideal-representative step). The
      partial-information channel is priced in IDEA-20260811-34a6d8 (answer:
      zero bits of k). Only with all three does the T1 verdict cover the
      question's decision_target, and this record does not claim otherwise.

    (F) WHAT THE VERDICT LICENSES FOR LANE L10'S TEXT. Under T1 the question
      record asks for a documentation repair of
      analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md L10, whose
      stated obstruction is "the two problems live on different objects (curves
      vs. points)". This record's position: the seed is RIGHT that the
      categorical statement is false -- X_m fuses them -- and the fusion is
      nonetheless costless, so L10's CLOSURES stand while its stated REASON
      should be replaced by the coordinate statement. Drafting that replacement
      is Coordinator work under the question's routing constraint; this record
      supplies the argument and files no edit to DECOMPOSITION.md.

  resource_label: >-
    R3 (End(E) as a ring: m, O/m), R4 (class-group action lifted to pairs), R5'
    (level structure at the Frobenius modulus -- the candidate sub-entry the
    seed proposed and left to the Coordinator; this record uses the label
    without asserting the taxonomy change). The record AUDITS these resources
    rather than consuming them, in the L12 style.
  admissibility: admissible
  admissibility_argument: >-
    No step applies an endomorphism to a point of G. Lemma 3 adds a point of
    order c to a scalar multiple of P -- group operations in E(F_p), not
    endomorphism evaluation -- and the simulation theorem is a statement about
    what an algorithm is GIVEN, not about how it uses phi. H-ENDO-001 is
    therefore not the operative filter and is not retested. KN-FIND-b7e091's
    generic-group closure is extended in spirit (a publicly samplable auxiliary
    input carries no bits) and is not revisited or weakened.

  object_first_candidate:
    established_families_declared_off_limits: >-
      Named and declared off-limits as the PRIMARY lens for this session, per
      docs/inventor-protocol.md section 1: (i) the connecting ideal class
      (the vectorization object); (ii) the kernel ideal of <Q>
      (IDEA-20260807-5d7606); (iii) the scalar lambda of an endomorphism on G
      (H-ENDO-001); (iv) cost functionals as class functions (L1); (v) the
      generic-group transcript (L12); (vi) THE RAY-CLASS COORDINATE ITSELF
      (IDEA-20260811-319a07), which this record examines as a candidate and
      rejects rather than adopts. Noted as required: this program has no
      written object enumeration for the ECDLP (KN-OPEN-019), so the list above
      is a sketch, not a taxonomy.
    tracked_object: >-
      THE ELIMINATION COST OF AN AUXILIARY INPUT: for a proposed piece of
      structure s attached to an instance, the best-known cost of producing a
      correctly distributed s from public data alone. Followed as structure is
      proposed, not as a computation runs. For (pi - 1)-level structure its
      value is p^{o(1)}.
    lossiness: >-
      GENUINELY LOSSY, and the test is passed here rather than merely asserted.
      The projection maps a proposed structure -- an entire mathematical object
      with its own algebra -- to a single cost exponent. It discards the
      structure's CONTENT and keeps its PRICE. That is discarded compatibly
      with the target's operations because the price is additive over
      independent auxiliary inputs and is instance-independent by construction,
      so one-step propagation (attach another structure; add its elimination
      cost) is defined and deterministic. Nothing about s is recoverable from
      its elimination cost, which is precisely why this is not a change of
      coordinates. Contrast with the object it is applied to: the ray-class
      coordinate, which IS a change of coordinates (part D).
    propagation: >-
      One step, defined and measurable: given a structure with a claimed
      elimination procedure, measure the expected number of group operations
      to produce it and the total-variation distance between the produced
      distribution and the intended one. Both are directly instrumentable at
      toy scale. For level structure the prediction is O(log p * log log p)
      operations and TV distance 0 (the sampler is exact, not approximate).
    survival_score: >-
      Survives every structure that is a function of public data (p, E, t, the
      factorisation of #E(F_p)) plus fresh randomness. DISSOLVES exactly when a
      proposed structure is correlated with the SECRET in a way public sampling
      cannot reproduce -- e.g. a level structure required to be compatible with
      an unknown k. Naming that dissolution point is this record's forward
      guidance and it is the only door left open on this leg: exhibit a
      publicly UNSAMPLABLE element of X_m whose possession helps.

  mechanism: >-
    STEP 1 (zero compute). Fix (B) and prove Lemmas 1-3 and the simulation
    theorem as written. Each lemma has exactly one responsibility (density,
    runtime, correctness); the theorem only assembles.

    STEP 2 (zero compute). Run the lossy-projection test of part (D) in
    writing, including the explicit statement of the symmetry group modulo
    which the projection is injective. Record the verdict.

    STEP 3 (toy compute, minutes). MEASURE Lemma 1: on a ladder of toy ordinary
    curves, sample random points and measure the empirical fraction that are
    O-module generators against the Euler product prod (1 - 1/Norm(q)).

    STEP 4 (toy compute, minutes). MEASURE Lemma 3: for each instance with
    c > 1, construct R by the recipe and CHECK [c]R = P and ord(R) = N*c, over
    at least 200 instances per rung. This is a pass/fail identity, not a
    statistic.

    STEP 5 (toy compute, minutes). THE SIMULATION AUDIT. Implement a trivial
    algorithm family A that consumes a level structure (e.g. A returns the
    ray-class kernel coordinate of (E, Q) relative to s by brute force) and its
    simulator A'; verify identical output distributions over 200 instances and
    measure the overhead ratio Time(A')/Time(A) against the predicted additive
    O(log p * log log p).

    STEP 6 (zero compute). Write the residual class explicitly: structures that
    are NOT publicly samplable. Hand the algorithmic branch to
    IDEA-20260811-9bc805 and the partial-information branch to
    IDEA-20260811-34a6d8, and state that the T1 verdict is not complete without
    both.

  why_not_a_renamed_known_approach: >-
    The generic move -- an auxiliary input that can be sampled from public data
    is worth nothing -- is folklore (it is the standard argument that public
    randomness is not advice) and NO NOVELTY IS CLAIMED FOR IT. What is absent
    from this corpus is the instantiation: nobody has written down that a
    (pi - 1)-level structure is publicly samplable in p^{o(1)}, nobody has
    exhibited the explicit instance-compatible construction of Lemma 3
    ([c]R = P from the instance's own P), and nobody has run the lossy-projection
    test against the ray-class coordinate. IDEA-20260811-40c0b5 does the
    corresponding accounting for an ORACLE and reaches p^{1/4}; the analogous
    statement for an INPUT, at exponent 0, is not in the corpus and is the
    stronger of the two.

  proof_search_map:
    bottleneck: >-
      The elimination cost of (pi - 1)-level structure, i.e. the best-known cost
      of producing a correctly distributed element of the fibre of X_m over E
      from public data. Every conclusion is a comparison of that exponent
      against 0. Nothing else in the record is load-bearing; in particular the
      simulation theorem is exact once the sampler is exact.
    baseline_embedding:
      parameter_slice: >-
        Set m = (1) (trivial level structure). X_m collapses to the set of
        curves, Cl_m = Cl(O), the fibre over E is a single point, the sampler
        returns it in zero operations, and the simulation theorem degenerates
        to A' = A. That is exactly the corpus's pre-existing L10 framing, in
        which k appears nowhere. The other boundary: set c = 1 and Lemma 3
        returns R = P, so the ECDLP instance is literally an element of X_m --
        the sharpest form of the deflation, reproduced as a parameter slice
        rather than argued.
      reproduction_check: >-
        Symbolic for both boundaries, plus a frozen fixture: at m = (1) the
        sampler must emit the unique fibre element and the recovered-bit count
        must be 0; at c = 1 the constructed R must equal P exactly on 100
        percent of fixture instances. Either failing means the pipeline is not
        implementing the stated maps.
    observation_collision:
      observable: >-
        The elimination cost of the auxiliary input (a single exponent), and
        separately, in part (D), the ray-class coordinate kappa.
      distinct_preimage_search: >-
        REQUIRED AND RUN IN BOTH DIRECTIONS. For the elimination cost: the
        fibre-uniform sampler and the instance-compatible construction of Lemma
        3 are DISTINCT preimages with the same observable (both p^{o(1)}), and
        they differ in a way that matters -- Lemma 3's output is correlated
        with P, the sampler's is not. The record therefore states BOTH and
        never uses the cost alone to conclude anything about correlation; a
        reader who does has misused the observable. For kappa: the collision
        search is the OPPOSITE case -- kappa has NO distinct preimages, which
        under section 2 is the failure, not the success. Both halves of the
        audit are reported.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The structure-free machine A' obtained by inlining the sampler at the
          input site. Encoding: verbatim. Completeness: A' supplies every s that
          A could receive. Soundness: the sampler's output distribution is
          exactly the fibre-uniform one (Lemma 1 gives the support, rejection
          sampling gives uniformity). Transfer: output distribution preserved
          exactly. Cost loss: + O(log p * log log p) time, + O(log p) memory.
        predicted_gain: >-
          None as an attack. The gain is that it converts an open question
          ("does level structure help?") into a measured exponent (0), and it
          does so uniformly over instances rather than on average.
      - transform: observable_fiber
        proposed_object: >-
          Hold the ray-class coordinate fixed and vary the forgotten structure.
          The fibre of kappa is a single F_p-isomorphism class of pairs, i.e.
          the fibre is trivial modulo the target's symmetry group. An
          observable-fibre counterexample therefore does not exist, and that
          non-existence IS the section 2 verdict.
        predicted_gain: >-
          Negative by design: it certifies that the object is a relabelling. A
          transform whose predicted gain is a closure is still a transform.
    quantifier_order: >-
      ASSERTED (simulation): FORALL p, FORALL ordinary (E, O) with the
      factorisation of #E(F_p) given, FORALL A, THERE EXISTS A' uniform in
      (p, E, O) constructed by inlining the sampler, FORALL instances (P, Q):
      output distributions equal and Time(A') <= Time(A) + O(log p log log p).
      ASSERTED (Lemma 3): FORALL instances with E(F_p) cyclic, THERE EXISTS a
      deterministic O(log p) procedure producing R with [c]R = P and
      ord(R) = #E(F_p).
      NOT ASSERTED: that X_m is uninteresting as mathematics; that no algorithm
      exploiting Cl_m arithmetic exists (see part E); that any lower bound on
      ECDLP follows; that the seed is wrong about the exact sequence or the
      torsor. The record AGREES with the seed's algebra and disagrees only with
      the inference that the fusion is a new object.
      WITHOUT the factorisation of #E(F_p) the sampler's order check is more
      expensive; #E(F_p) = N*c with N prime is standard public data for a
      cryptographic curve and the dependency is disclosed rather than assumed
      away.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Equipping an ordinary curve with (pi - 1)-level structure has
        elimination cost p^{o(1)}; hence no algorithm that merely receives such
        a structure can have a smaller cost functional than one that does not,
        up to an additive p^{o(1)}." It can NEVER certify that Cl_m(O)'s
        arithmetic is useless (part E), can never certify a lower bound on
        ECDLP, and can never speak about structures correlated with k.
      nearby_object_control: >-
        THE NEARBY OBJECT WHERE THE DESIRED CONCLUSION MUST FAIL: an auxiliary
        input that is NOT publicly samplable -- concretely, the pair
        (E, R) together with the integer j such that P = [j]R for a UNIFORM
        generator R. That object has elimination cost p^{1/2} (producing j is
        an ECDLP), and the same method correctly reports a large elimination
        cost rather than 0. If the method returned p^{o(1)} there too it would
        be measuring nothing. A second control: the m = (1) slice, where the
        method must return 0 for the trivial reason. Passing both is the
        evidence that the method tracks the load-bearing quantity.
    proof_obligations:
      - claim: E(F_p) = ker(pi - 1) = E[m].
        responsibility: correctness
      - claim: >-
          E(F_p) is O-isomorphic to O/m (Lenstra), hence its O-module
          generators are exactly the classes in (O/m)^*.
        responsibility: correctness
        status: >-
          '[recall-confident] relayed by IDEA-20260811-319a07; NOT re-verified
          against a primary source this session (literature access down). Toy
          verification route: check O-cyclicity per instance directly.'
      - claim: rho_m = prod (1 - 1/Norm(q)) >= 1/(C log log p).
        responsibility: size
      - claim: The rejection sampler's output is exactly fibre-uniform.
        responsibility: correctness
      - claim: >-
          R = [c^{-1} mod N]P + T has order #E(F_p) and satisfies [c]R = P,
          for E(F_p) cyclic and T of order exactly c.
        responsibility: correctness
      - claim: The inlined simulator preserves A's output distribution exactly.
        responsibility: correctness
      - claim: >-
          kappa is a bijection X_m -> Cl_m(O) given simple transitivity, hence
          injective modulo F_p-isomorphism.
        responsibility: strictness
        status: >-
          Depends on simple transitivity, which IDEA-20260811-9402e9 argues is
          a theorem for O maximal rather than the seed's [open] obligation. If
          simple transitivity FAILED, kappa would be non-injective and part (D)
          would weaken to "almost a relabelling" -- the record says so rather
          than assuming the convenient case.

  predictions:
    - metric: >-
        empirical fraction of uniformly random points of E(F_p) that are
        O-module generators of E[m], measured over at least 10^4 samples per
        rung of a toy ladder, compared against prod_{q | m} (1 - 1/Norm(q))
      direction: different
      minimum_effect: >-
        agreement within the 95 percent binomial confidence band on every rung.
        A systematic shortfall means E(F_p) is not O-cyclic on those instances
        and the Lenstra identity as implemented is wrong -- which halts the
        line for review rather than being recorded as a finding.
    - metric: >-
        pass rate of the identity [c]R = P and ord(R) = #E(F_p) for R built by
        Lemma 3, over at least 200 instances per rung with c > 1
      direction: higher
      minimum_effect: >-
        exactly 1.00. This is an identity; anything below 1.00 is an
        implementation defect, not evidence.
    - metric: >-
        expected number of group operations to produce a fibre-uniform level
        structure, fitted as a function of log p across at least five rungs
      direction: lower
      minimum_effect: >-
        fitted exponent in p indistinguishable from 0 (fit slope of
        log(operations) against log(p) below 0.05), consistent with
        O(log p * log log p). A fitted exponent at or above 0.2 would mean the
        elimination cost is NOT p^{o(1)}, the simulation theorem's cost bound
        is wrong as stated, and Leg 1 must be recomputed with the measured
        value -- the single most consequential negative outcome available here.
    - metric: >-
        total-variation distance between the sampler's output distribution over
        the fibre and the uniform distribution, estimated on small classes where
        the fibre is fully enumerable
      direction: lower
      minimum_effect: >-
        statistically indistinguishable from 0 at 10^4 samples. A nonzero TV
        distance means the simulation theorem holds only approximately and its
        statement must be weakened to a computational-indistinguishability
        claim, which is a materially different theorem.

  minimal_test:
    design: >-
      STAGE 0 (ZERO COMPUTE, AND IT IS THE CHEAPEST VALID DISCRIMINATOR IN THIS
      QUESTION). Write out Lemma 3 and check it by hand on one instance. If a
      reviewer exhibits an element of X_m that is NOT publicly samplable and
      whose possession helps, Leg 1 is refuted at zero cost -- and that
      refutation would be a T2 event, so the stage is worth running even at a
      low prior. Also run the section 2 test in writing; it costs nothing and
      it is the whole of Leg 2.
      STAGE 1 (minutes). Toy ordinary curves, p at 12-24 bits, O maximal
      (f = 1), h(O) in [4, 40], N prime, cofactor ladder c in {1, 2, 4, 8, 9}.
      Build O, m, the finite ring O/m and the surjection O/m -> Z/N explicitly;
      verify pi = 1 mod m by ideal arithmetic.
      STAGE 2 (minutes). The density measurement of prediction 1.
      STAGE 3 (minutes). The Lemma 3 identity check of prediction 2, including
      the c = 1 degeneration where R must equal P.
      STAGE 4 (minutes). The simulation audit of STEP 5 and the TV-distance
      measurement of prediction 4, on classes small enough to enumerate the
      fibre exactly.
      Total: well under one CPU-hour with a computer-algebra system doing
      binary-quadratic-form and order arithmetic. No solver, no certificate, no
      new infrastructure, zero runs against any cryptographic parameter.
    controls:
      - >-
        NULL OBJECT (matched, mandatory): the identical pipeline with m = (1).
        The fibre is a single point, the sampler must return it in zero trials,
        the recovered-bit count must be 0, and any downstream quantity that
        still varies with k is reading k from somewhere it should not; the run
        set is then VOID, not negative.
      - >-
        PLANTED SIGNAL (two-directional, mandatory): the NOT-publicly-samplable
        control of the method ceiling -- hand the pipeline the pair (E, R)
        together with the true j such that P = [j]R. The elimination-cost
        instrument MUST report a large cost there (it must attempt and fail to
        produce j publicly). An instrument that reports p^{o(1)} for that input
        is blind and the whole run set is INVALID rather than negative.
      - >-
        Two independent constructions of O/m -- from the binary quadratic form
        and from the explicit Z-basis {1, theta} with pi = A + B*theta -- must
        agree elementwise, so a ring-arithmetic bug cannot masquerade as a
        structural finding.
      - >-
        SUPERSINGULAR REFUSAL CONTROL: one supersingular instance, where O is
        not commutative and the construction does not apply. The pipeline must
        REFUSE it rather than silently emit a number.
      - >-
        NON-CYCLIC CONTROL: one instance with E(F_p) ~= Z/d x Z/(de), d > 1.
        Lemma 3 is scoped to the cyclic case and the pipeline must fall back to
        rejection sampling there and SAY SO in its output, rather than applying
        an out-of-scope formula.
    required_metrics:
      - empirical generator density versus the Euler product, per rung
      - pass rate of [c]R = P and ord(R) = #E(F_p)
      - group operations to produce a level structure, and its fitted exponent
      - TV distance to fibre-uniform on fully enumerable classes
      - simulation overhead ratio Time(A')/Time(A)
      - per-instance h(O), |D|, conductor f, cofactor c, group structure

  controls:
    - >-
      NULL OBJECT: m = (1), as above. The matched null the deliverable requires.
    - >-
      DECAY PARAMETER: the cofactor c. The number of trials the sampler needs
      must DECREASE toward 1 as the number of distinct small prime divisors of
      #E(F_p) decreases, and must equal 1 in expectation when #E(F_p) is prime.
      A trial count that does not decay is the canonical artifact tell of
      docs/inventor-protocol.md section 3 and means the instrument is measuring
      its own overhead.
    - >-
      A second decay parameter: h(O). As h -> 1 the class has one curve, X_m
      collapses to a single fibre, and every conclusion of this record must
      survive verbatim -- it is a statement about fibres, not about classes. A
      result that changes at h = 1 means the two legs are entangled and the
      record is mis-implemented.

  confounders:
    - >-
      FACTORISATION OF #E(F_p). The order check in Lemma 2 needs it. At toy
      scale free; at crypto scale it is standard public data for a curve with
      known group order, but for an arbitrary ordinary curve it is a genuine
      (subexponential) precomputation. Charged separately, never folded into
      p^{o(1)}.
    - >-
      NON-MAXIMAL ORDERS. For f_E > 1 the ideal theory needs proper ideals and
      coprimality to the conductor, and m may fail to be coprime to it. Primary
      claims are scoped to O maximal; the general case is an explicit open
      extension, not an assumption.
    - >-
      NON-CYCLIC E(F_p). Lemma 3's explicit construction assumes Z-cyclicity.
      O-cyclicity always holds (Lenstra), so Lemma 2's sampler still applies,
      but the instance-compatible refinement does not. Checked per instance.
    - >-
      UNITS AT D_0 = -3, -4. The fibre size and the automorphism quotient both
      change; those instances are reported separately and never pooled.
    - >-
      SIGN AMBIGUITY. The kernel is (O/m)^*/image(O^*), so coordinates are
      defined up to the unit action; every recovered quantity is +-k and the
      one-bit ambiguity is reported rather than silently absorbed.

  falsification_conditions:
    - >-
      A reviewer or a measurement exhibits an element of X_m that is NOT
      producible from public data plus fresh randomness and whose possession
      changes any measured cost functional. Then Leg 1 is false, the elimination
      cost is not p^{o(1)}, and the record is superseded. This is the branch the
      record most wants tested and rates least likely.
    - >-
      The fitted exponent of the sampler's cost is at or above 0.2 in p across
      the ladder. The elimination cost is then not p^{o(1)} and every corollary
      must be recomputed with the measured value.
    - >-
      The TV distance to fibre-uniform is measurably nonzero. The simulation
      theorem then holds only in a computational-indistinguishability form and
      the exact-distribution statement in (C) is wrong as written.
    - >-
      Simple transitivity fails (see IDEA-20260811-9402e9's orbit test). Then
      kappa is not a bijection, Leg 2's verdict weakens from "relabelling" to
      "lossy but with a computable fibre", and part (D) must be restated.
    - >-
      The m = (1) null still returns k. The pipeline leaks and every
      measurement is VOID, not negative.

  interpretation_limits:
    - >-
      THIS IS NOT AN ATTACK AND CONTAINS NO ALGORITHM AGAINST ECDLP. It is a
      deflation: it shows a proposed structure is free, hence useless as
      structure. Nothing here lowers any cost.
    - >-
      IT IS ALSO NOT A LOWER BOUND. It says nothing about whether ECDLP is hard;
      it says the level structure does not make it easier.
    - >-
      Part (E) is binding: the record does NOT close the possibility that
      Cl_m(O)'s ARITHMETIC supports an algorithm. That is a separate question
      priced in IDEA-20260811-9bc805, and quoting this record as if it closed
      the algorithmic branch is a misreading.
    - >-
      Scoped to ORDINARY curves over F_p with O maximal, N prime, and (for
      Lemma 3) E(F_p) Z-cyclic. Nothing is claimed about supersingular curves,
      non-maximal orders, extension fields, or any deployed curve.
    - >-
      Toy scale for every measured quantity (p up to about 24 bits). The
      simulation theorem is scale-free; its empirical confirmation is not, and
      the two must not be conflated.
    - >-
      The Lenstra identity is carried as [recall-confident] and was NOT
      re-verified against a primary source this session. Every downstream claim
      inherits that status and says so.

  assumptions:
    - >-
      A1. E ordinary over F_p, p > 3, End_{F_p}(E) = O maximal in
      K = Q(sqrt(D_0)), N prime with N || #E(F_p), G the unique order-N
      subgroup. Checked per instance, never assumed.
    - >-
      A2. The factorisation of #E(F_p) is known (it is, for any curve whose
      group order was computed and whose prime-order subgroup is named).
    - >-
      A3. '[recall-confident, NOT re-verified this session] H. W. Lenstra Jr.,
      Complex multiplication structure of elliptic curves, J. Number Theory 56
      (1996) 227-241: E(F_p) = O/(pi - 1)O as O-modules. Relayed by
      IDEA-20260811-319a07, which itself relayed it without verification.
      WebSearch and WebFetch failed on every call this session and the crypto-kb
      index is empty, so no external check was possible.'
    - >-
      A4. '[recall-confident, NOT re-verified this session] The
      Deuring/Waterhouse/Kohel ideal-subgroup correspondence and the simple
      transitivity of Cl(O) on the set of curves in the class with End = O.'

  heuristic_assumptions:
    - id: HA-1
      statement: >-
        For a uniformly random point R of E(F_p), the probability that R is an
        O-module generator of E[m] equals rho_m = prod_{q | m} (1 - 1/Norm(q))
        EXACTLY (this is a computation, not a heuristic, once
        E(F_p) ~= O/m holds); the only distributional input is that
        1/rho_m = O(log log p) uniformly over ordinary E/F_p with #E(F_p) in
        the Hasse interval, i.e. that #E(F_p) behaves like a uniformly random
        integer of its size with respect to the number of distinct prime
        divisors.
      rigorous_support: >-
        Pairs the rigorous Mertens estimate prod_{ell <= y} (1 - 1/ell) ~
        e^{-gamma}/log y with the classical Hardy-Ramanujan / Erdos-Kac
        normal-order theorem for omega(n) on a random integer of size p, which
        is the distribution statement being imitated. The composition has the
        same shape as Heuristic 1 of the exemplar in
        docs/target-result-profile.md (rigorous bound x classical distribution
        theorem), at a far lower stake: the conclusion is p^{o(1)}, so even a
        (log p)^{O(1)} failure of the heuristic would not change the verdict.
      validation_plan: >-
        Toy scale, and the sampling shortcut is that #E(F_p) is directly
        computable so no correspondence is needed: for 10^4 ordinary curves per
        rung across p at 12, 16, 20, 24 bits, compute omega(#E(F_p)) and
        rho_m = prod (1 - 1/Norm(q)) over the prime ideals above the rational
        primes dividing #E(F_p), and compare the empirical distribution of
        1/rho_m against the Erdos-Kac prediction with mean log log p and
        variance log log p. Record the p-ladder, the sample sizes, and the
        transfer assumption explicitly: this validates the toy regime only, and
        transfer to crypto-sized p is STATED AND NOT ESTABLISHED.
      tail_checks: >-
        Compare the largest observed 1/rho_m in each rung against the predicted
        extreme-value quantile of the Erdos-Kac law at that sample size, and
        separately count curves with #E(F_p) prime (where 1/rho_m is 1 + o(1))
        as the opposite tail. A systematically heavy upper tail would inflate
        the sampler's expected cost without changing its exponent, and that
        distinction must be reported rather than smoothed.
    - id: HA-2
      statement: >-
        NOT A HEURISTIC -- RECORDED SO THAT NO CONDITIONALITY IS IMPORTED. The
        simulation theorem, Lemma 3, and the lossy-projection verdict use NO
        distributional assumption whatsoever. They are exact algebra plus exact
        rejection sampling. Only the COST BOUND O(log log p) on the expected
        number of trials touches HA-1, and only through a factor that is
        p^{o(1)} under any plausible variant.
      rigorous_support: >-
        Group theory, the cited structure theorems, and elementary probability
        for rejection sampling. No analytic input beyond HA-1's cofactor.
      validation_plan: >-
        The identity checks of predictions 2 and 4 ARE the validation: they are
        exact and computable, so the algebra is checkable rather than sampled.
      tail_checks: >-
        Not applicable (no distribution). The analogue is the m = (1) null and
        the not-publicly-samplable planted control, which must exhibit the
        opposite behaviour.

  reachability_gate: >-
    T5 STATUS: NOT BINDING, AND NOT FOR THE USUAL REASON. This record needs to
    reach no curve at all -- every construction happens on the instance's own
    curve E, at zero walk cost. The reachability question that prices getting to
    a SPECIFIED curve (T5) is orthogonal to the elimination cost of an input,
    which is why the two exponents (p^{1/4} for reaching, p^{o(1)} for equipping)
    are different numbers about different things. IDEA-20260811-40c0b5 makes the
    parallel point for oracles.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE MOVES. ECDLP stays at p^{1/2}
      (0.886*sqrt(N) group operations) before and after. The exponent this
      record DOES state is the elimination cost of the auxiliary input:
      p^{o(1)}, concretely O(log p * log log p) group operations plus O(log log p)
      order checks. The foreclosed prize, had the level structure been
      unsamplable and useful, would have been whatever the seed's D5 conditional
      promised (L_p(1/2)); this record closes that door on the INPUT side only,
      not on the arithmetic side.
    memory_exponent: >-
      O(log p) bits for the sampler and the simulator -- one curve, one point,
      one ideal. Nothing in this record needs the p^{1/4} memory that
      IDEA-20260811-40c0b5's oracle simulator needs, which is precisely why its
      elimination cost is lower. The toy enumeration of a fibre for the
      TV-distance control costs O(#(O/m)^*) storage and is the caller's choice
      of experiment, not part of any claim.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); BSGS at sqrt(N)
      time and sqrt(N) memory (KN-TECH-031); automorphism-discounted rho at
      0.886*sqrt(N/|Aut|) (KN-TECH-018), where sqrt(6) is baseline calibration
      and never an exponent. None is changed by this record in either direction.
    hidden_overhead: >-
      The o(1) in p^{o(1)} hides an O(log log p) expected trial count (HA-1) and
      an O(log p) cost per order check, i.e. a genuine (log p)^{O(1)} cofactor
      and nothing worse. Separately disclosed and NOT hidden in the o(1): the
      sampler presumes the factorisation of #E(F_p), and the whole framework
      presumes O maximal and known D -- knowing End(E) requires factoring
      t^2 - 4p, which is subexponential at crypto scale.
    tradeoff_note: >-
      Not applicable as an attack -- no algorithm is produced. For the record:
      because the elimination cost is p^{o(1)} in BOTH time and memory, no
      time-memory tradeoff can rescue the auxiliary input; unlike
      IDEA-20260811-40c0b5's p^{1/4}-memory oracle simulator, there is no
      memory-poor regime in which this record's conclusion changes. That
      robustness is the single most important honesty item here, and it points
      the other way from the usual one: the conclusion is a closure, so its
      robustness makes the closure stronger, not an attack safer.

  sota_delta: >-
    Zero. 0.886*sqrt(N) before, 0.886*sqrt(N) after, with O(1) memory in both
    cases. The delta is structural and negative: it converts the question's T1
    branch from an expectation into an argued theorem with a measured
    elimination exponent (0 rather than 1/4 or 1/2), it runs the
    lossy-projection test that the seed's own survival_score inadvertently
    fails, and it states exactly which part of T1 remains unproved after this
    record (the algorithmic branch, part E).
  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES against every row of the
    prime-field frontier this campaign recognises: parallel rho with
    distinguished points (0.886*sqrt(N) time, O(1) memory, KN-TECH-001 /
    KN-TECH-006); automorphism-discounted rho on CM curves
    (0.886*sqrt(N/|Aut|), KN-TECH-018); BSGS (sqrt(N) time and memory,
    KN-TECH-031); Pollard kangaroo on an interval of width W (about 2*sqrt(W));
    van Oorschot-Wiener at sqrt(N^3/w) with memory w. This record mounts no
    attack and is therefore dominated by every one of them on time; it consumes
    no data and no oracle queries. dominated_by is NOT null.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.95 that the sampler's measured cost exponent is indistinguishable from 0,
    since the construction is explicit and the only variable input is a trial
    count. 0.93 that Lemma 3's identity holds at 1.00 pass rate on cyclic
    instances (the remaining mass is implementation risk in the c-part
    construction). 0.90 that the TV distance is indistinguishable from 0.
    0.85 that the lossy-projection verdict survives adversarial review as
    stated, the residual risk being the objection that "modulo the symmetry
    group" is too generous a quotient -- an objection this record invites and
    would treat as the useful outcome. Below 0.03 that any element of X_m is
    exhibited that is both unsamplable and useful; that branch is the only one
    here that would move an exponent, which is why STAGE 0 states it as an
    explicit invitation.

  p2_p3_flags: >-
    P2: NOT ADJACENT. No factor base of any kind appears; H-STR-002 and
    DEFER-BATCH009-001 are untouched in both directions and nothing here bears
    on phi-stability.
    P3: NOT TRIGGERING AND NOT ADJACENT. Every exponent stated is either 0 (the
    elimination cost of an input) or 1/2 (the unchanged rho baseline). No
    candidate appears that could exceed the automorphism-discounted rho
    baseline, and the record proposes no attack whose cost could be measured
    against it. The sqrt(6) automorphism discount is not invoked as an exponent.

