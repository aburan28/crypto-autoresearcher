  novelty_screen: >-
    Screened on 2026-08-11 against the committed corpus by ripgrep, at the
    snapshot carrying the seed and the question (f05894024). EXTERNAL NOVELTY
    IS NOT ESTABLISHED AND IS NOT CLAIMED: WebSearch and WebFetch failed on
    every call this session (Bedrock-routed inference profile, access denied --
    the identical outage disclosed for the five BATCH-aeeb17 producer sessions
