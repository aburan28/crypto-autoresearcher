idea:
  id: IDEA-20260805-e732ed
  question_id: RQ-DREG-001
  added: '2026-08-05'
  title: >-
    Audit of this goal's own crypto-scale headline - the 2^1194 generic baseline
    is N(966,150)^2 at omega=2 with no memory charged, and it assumes a
    genericity the chained system's block structure demonstrably violates
  class: control

  claim: >-
    GOAL-DREG-001's BATCH-001 checkpoint carries a committed crypto-scale
    baseline: "t=7 n=161 -> d_reg=150, Grobner 2^1194 vs rho 2^80.5". Every
    ingredient of that number is reconstructible and was reconstructed this
    session, exactly. d_reg = 150 is the freeze degree of
    (1+z)^966 (1+z^2)^{-161} (1+z^3)^{-805} - the global semi-regular series for
    161 quadrics and 805 cubics in nb = n(t-2) + kt = 805 + 161 = 966 boolean
    variables at t = 7, k = ceil(161/7) = 23. And 2^1194 is exactly
    N(966,150)^2 = (2^597.19)^2, i.e. the Macaulay COLUMN COUNT SQUARED. Three
    things follow, none of which is on the record. (1) OMEGA = 2. The exponent 2
    is not an achievable dense linear-algebra exponent; at omega = 2.37 the same
    formula gives 2^1415 and at omega = 3 it gives 2^1792. The headline is the
    most optimistic member of a 600-bit family and is not labelled as such.
    (2) NO MEMORY IS CHARGED. The matrix at that degree has 2^597 columns, so
    the space requirement alone is >= 2^597 bits - which is the binding
    constraint, not the 2^1194 time, and the comparison is being made against
    Pollard rho at 2^80.5 time and NEGLIGIBLE memory. (3) THE GENERICITY IS
    FALSE FOR THIS SYSTEM. The chained system's equations are supported on
    variable BLOCKS (derived in IDEA-20260805-90a841 from src/semaev_tree.py),
    and evaluating the same series per block at t=7 gives freeze degrees 25
    (the (u_5,x_7) quadric block, 184 variables), 43 (the (u_1,x_1,x_2) cubic
    block, 207 variables) and 80 (each (u_i,u_{i+1},x_{i+2}) cubic block, 345
    variables) - against the global 150. The baseline's heuristic is therefore
    load-bearing, unnamed, unvalidated, and violated in a visible way, and the
    span between the block-bounded and global readings is 2^787 to 2^1194.
    NO ATTACK IS CLAIMED OR IMPLIED: even the most favourable reading, 2^787,
    is 700 bits above rho's 2^80.5, and this proposal's honest conclusion is
    that no direction of this audit reaches an attack. What it produces is a
    correctly-conditioned baseline in place of a bare number.

  object_first_candidate:
    tracked_object: >-
      The cost expression itself - (column count at the freeze degree)^omega -
      followed backwards through each of its inputs (nb, the degree histogram,
      the freeze degree, omega, and the omitted memory term) to the assumption
      each rests on.
    established_families_off_limits: >-
      Off-limits as the primary lens: index calculus and relation collection;
      Weil-descent decomposition attacks; new solving-degree measurements;
      Pollard rho / BSGS algorithm design; and any construction of a new attack.
      This proposal deliberately does not propose an algorithm. The semi-regular
      series is the OBJECT under audit, not the lens.
    newness_score: >-
      Auditing a load-bearing constant is the program's most-recommended and
      least-executed move. Against this goal it has never been done: the 2^1194
      figure appears in the goal record and in BATCH-001's summary as a bare
      number, with no omega stated, no memory column, no heuristic named, and no
      derivation archived. That it reconstructs exactly is itself the check that
      the audit is aimed at the right expression.
    testability_score: >-
      The reconstruction is complete and exact already (150 and 2^1194 both
      reproduced to the digit). The remaining testable content - whether block
      structure raises or lowers the true solving degree - is measurable at TOY
      scale where phi_A and phi_full differ by 2 to 3 degrees at every rung, and
      that measurement is the experiment.
    survival_score: >-
      The object survives to a number that this goal already cites and that
      GOAL-SDEG-001 and GOAL-SIG-001 read. It does not survive to an attack and
      is not claimed to.

  mechanism: >-
    RECONSTRUCTION, EXACT. At t = 7 the chained system (src/semaev_tree.py lines
    78-87) is S_3(u_1,x_1,x_2)=0, S_3(u_i,u_{i+1},x_{i+2})=0 for i=1..4, and
    S_3(u_5,x_7,R_X)=0 - six S_3 equations, hence 6n = 966 boolean equations
    after Weil descent, in n(t-2) + kt = 5*161 + 7*23 = 966 boolean unknowns. As
    derived in IDEA-20260805-90a841, an S_3 whose three arguments are all
    variables descends to boolean degree 3, and one with a constant argument
    descends to degree 2; only the last equation has a constant, so the histogram
    is 161 quadrics and 805 cubics. The freeze degree of
    (1+z)^966 (1+z^2)^{-161} (1+z^3)^{-805} is 150 - the committed value. And
    log2 N(966,150) = 597.19, so N^2 = 2^1194.4 - the committed 2^1194. Both
    reproduce, so the audit is aimed at the actual expression and not at a
    paraphrase of it.

    AUDIT 1 - THE LINEAR-ALGEBRA EXPONENT. omega = 2 is not attained by any
    known algorithm; the practical range for sparse GF(2) Macaulay linear algebra
    is Wiedemann-like (cost ~ nnz * ncols, which for a Macaulay matrix with
    O(nb^3) nonzeros per row is not N^2 either) through dense Strassen-like
    omega ~ 2.807. Reporting N^2 is a lower bound presented without the word
    "lower". Numbers: 2^1194 (omega=2), 2^1415 (omega=2.37), 2^1792 (omega=3).
    NONE of these changes the qualitative conclusion versus rho, and this
    proposal says so; what changes is whether the goal is quoting a bound or a
    cost.

    AUDIT 2 - THE MEMORY THAT IS NOT CHARGED. The matrix has N(966,150) = 2^597
    columns. Even a maximally sparse representation must address them, so memory
    >= 2^597 and the comparison "2^1194 vs 2^80.5" pits a time figure against a
    time figure while one side additionally needs 2^597 bits and the other needs
    O(1). docs/claims-and-verification.md requires memory stated beside time
    always, and docs/target-result-profile.md's own exemplar is a MEMORY-Pareto
    statement (time >= 2^106.5 AND memory >= 2^92.5 against 2^128 at negligible
    memory). Applied here, the honest row is: Groebner (2^1194 time optimistic /
    2^1415 realistic, 2^597 memory) versus rho (2^80.5 time, negligible memory,
    and fully parallelisable with van Oorschot-Wiener distinguished points). The
    Groebner route is dominated on BOTH axes, not merely behind on one.

    AUDIT 3 - THE GENERICITY, WHICH IS THE MATHEMATICAL PART. The semi-regular
    series models 966 polynomials in general position on 966 variables. They are
    not: each equation's support lies in the subring generated by the boolean
    coordinates of its three F_q-arguments, i.e. in 184, 207 or 345 variables of
    966. Evaluating the SAME series construction on each block alone gives
    freeze degrees 25 (n quadrics in n+k = 184 variables), 43 (n cubics in
    n+2k = 207) and 80 (n cubics in 2n+k = 345). Every block reaches its own
    freeze degree far below 150. The global model cannot see this because it has
    already averaged the supports away.

    WHICH WAY DOES THE ERROR GO? THIS IS NOT ASSERTED, AND THE UNCERTAINTY IS
    THE FINDING. Two opposing effects, both real: support restriction REMOVES
    columns (at t=3 the closed form gives u_D/C(nb,D) = 0.206 at n=12 D=5 rising
    to 0.258 at n=161 D=5, so about a quarter of the top-degree monomials are
    simply absent), which starves the reduction and tends to RAISE the solving
    degree; and early block saturation supplies relations the global model does
    not predict, which tends to LOWER it. Which dominates is an empirical
    question at toy scale and is exactly what the ladder in this goal is
    positioned to answer - but only if the question is asked, and no record asks
    it. The committed toy-scale direction is a data point and is quoted here
    without extrapolation: BATCH-001 records d_reg(sem) > d_reg(null), i.e. the
    real system is HARDER than the global generic model at the tested cells,
    which is the support-starvation direction and points AWAY from any attack.
    Extrapolating a toy-scale sign to t=7 n=161 is precisely what rule 7 forbids
    and is not done here.

    WHAT A CORRECTED BASELINE WOULD LOOK LIKE. Not one number but a bracket with
    its conditions attached: [block-bounded reading 2^787 at omega=2, memory
    2^394] to [global reading 2^1194 at omega=2, memory 2^597], times the omega
    factor, against rho at 2^80.5 time / negligible memory - with the sign of the
    block correction listed as UNKNOWN and the toy-scale evidence pointing at the
    harder end. Every one of those numbers is a division and an exponentiation
    away from quantities already reconstructed here.

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_grepped:
      - ledger/goals/GOAL-DREG-001.yaml (BATCH-001 checkpoint and notes)
      - ledger/RQ-DREG-001.yaml
      - ledger/evidence/EV-DREG-004/006/007/008.yaml
      - ledger/hypotheses/H-SDEG-0dd021.yaml
      - research/dreg-linear-law/scripts/dreg_crypto_cost_model.py (path cited by H-SDEG-0dd021; not opened in this session)
    grep_results:
      - >-
        The figures "2^1194" and "d_reg=150" appear in the goal record's
        BATCH-001 checkpoint and notes with no omega, no memory term, no
        heuristic name, and no derivation in any ledger record read here.
      - >-
        No record in this goal states a genericity heuristic formally, and there
