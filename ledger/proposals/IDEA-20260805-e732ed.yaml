      first stage is to look.

  lossy_projection_identifiability_audit:
    projection: >-
      The full crypto-scale cost question  -->  a single scalar 2^1194  -->  the
      binary comparison "worse than rho".
    what_is_discarded: >-
      omega; the memory axis entirely; the parallelisation asymmetry; the
      distinction between a bound and a cost; and the support structure of the
      system, which is averaged away by the series before the number is formed.
    why_genuinely_lossy: >-
      Severely. The fibre over "2^1194" includes every (omega, memory model,
      genericity assumption) triple that lands there, and those triples give
      answers spanning 2^787 to 2^1792.
    why_compatible_with_the_operations: >-
      The projection to a single time exponent is NOT compatible with the
      comparison it is used for, because the comparator (rho) differs on the
      discarded axis (memory) by 2^597. This is the same defect the program's own
      target-result profile identifies in its exemplar, where the headline
      p^{1/3+o(1)} is a time-AND-memory statement and the prior art is
      memory-negligible - i.e. Pareto-incomparable, not dominated.
    is_it_only_a_change_of_coordinates: >-
      Neither classical failure. It is not a change of coordinates (huge loss)
      and it is not constant across instances. CONSTANCY CHECK RUN: the projected
      value does vary with the inputs - 2^328 / 2^499 / 2^787 / 2^1194 at
      D = 25 / 43 / 80 / 150 - so the comparator has real spread and the audit
      has something to measure. Its failure is the incomparability one above.

  assumptions:
    - >-
      That BATCH-001's 2^1194 is N(nb,d_reg)^2 with omega = 2. Supported by
      exact reproduction to the digit (2^1194.4). NOT CONFIRMED against the
      original derivation, which this session did not open; if BATCH-001 used a
      different formula that coincidentally lands within 0.4 bits, the audit's
      first two findings need restating. Stage 1 of the experiment opens
      research/dreg-linear-law/scripts/dreg_crypto_cost_model.py and settles it.
    - >-
      That the t = 7 parameter reading (k = 23, nb = 966, 161 quadrics, 805
      cubics) matches the one BATCH-001 used. Supported by the freeze degree
      coming out at exactly 150.

  predictions:
    - metric: reconstruction of BATCH-001's d_reg and cost figures
      direction: different
      minimum_effect: >-
        EXACTLY 150 and 2^1194 (to 0.5 bits). Already obtained; the experiment
        re-derives them from the archived script rather than from this record.
    - metric: >-
        block freeze degrees at t = 7, n = 161 for the three block shapes
        (n+k, n+2k, 2n+k variables)
      direction: lower
      minimum_effect: >-
        EXACTLY 25, 43 and 80, all strictly below 150. Forced pre-run. If any
        block freeze equals or exceeds 150 the genericity finding is void.
    - metric: >-
        gap phi_full(n) - phi_A(n) at t = 3 across the toy ladder
      direction: higher
      minimum_effect: >-
        >= 2 at every n in {9,12,15,18,21,24,30}, with forced values
        phi_full = 6,7,8,9,9,10,12 and phi_A = 4,5,6,6,7,7,9. If the gap is not
        at least 2 at every rung the block effect is not present even in the
        model, and the audit's third finding collapses at zero compute.
    - metric: >-
        omega sensitivity of the headline
      direction: higher
      minimum_effect: >-
        2^1194 / 2^1415 / 2^1792 at omega = 2 / 2.37 / 3. A 598-bit span, versus
        a headline reported as one number.
    - metric: memory exponent of the Grobner route at the quoted parameters
      direction: higher
      minimum_effect: >-
        >= 2^597 bits, i.e. log2(memory) >= 597, against rho's O(log p). Forced
        by the column count. No record in this goal states any memory figure.
    - metric: >-
        toy-scale sign test - measured first-fall / saturation degree of the
        block-A subsystem alone versus the full system at n in {9,12}
      direction: lower
      minimum_effect: >-
        The block-A subsystem must saturate at a degree at least 2 below the full
        system's, matching phi_A vs phi_full. If it does not, the block model is
        wrong about the real systems and not merely about the series.

  minimal_test:
    design: >-
      Cheapest-first and mostly zero compute. Stage 1 (reading, decisive, can end
      the line): open research/dreg-linear-law/scripts/dreg_crypto_cost_model.py
      and any BATCH-001 artifact and confirm or refute that 2^1194 is
      N(966,150)^omega with omega = 2; if the formula is different, restate the
      audit against what it actually is before going further. Stage 2 (seconds):
      recompute the global and per-block freeze degrees at t=7 and across the
      t=3 toy ladder, emitting the forced values above. Stage 3 (minutes): emit
      the corrected cost table - omega in {2, 2.37, 3} x reading in {global,
      block-bounded} x {time, memory} - with rho's row beside it, every cell
      labelled with the assumption that produces it. Stage 4 (toy measurement,
      optional and separately authorised): measure the block-A subsystem's own
      saturation degree at n = 9 and n = 12 and compare to phi_A.
    controls:
      - >-
        NULL OBJECT, forced value pre-derived, CAN FAIL: apply the identical
        block-freeze computation to a system with the SAME degree histogram and
        the SAME nb but FULL supports (no blocks). Its per-block freeze degree is
        by construction identical to the global one, so the forced value of the
        gap is EXACTLY 0. If the code reports a nonzero gap for the full-support
        object it is measuring its own partitioning and not the system, and
        nothing else may be reported.
      - >-
        POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR: the reconstruction itself.
        The pipeline must return 150 and 597.19 for the committed cell. If it
        does not, the reconstruction is wrong and no audit finding stands. This
        control can fail and is the reason the audit is credible at all.
      - >-
        GRADED CONTROL, 4 interior points, monotonicity reported: interpolate
        block size from the true block (184 variables) to the full ambient (966)
        in four steps and report the freeze degree at each. It must rise
        monotonically from 25 to 150. A non-monotone curve means the freeze-degree
        computation is unstable in the regime being used.
      - >-
        NEARBY OBJECT WHERE THE CONCLUSION FAILS: t = 3, where the block gap is
        only 2 to 3 degrees and where actual measurements exist. If the block
        story cannot be seen at t = 3, claiming it at t = 7 on series arithmetic
        alone is unsupported, and the audit must say so.
    required_metrics:
      - verbatim statement of the archived cost formula, with its path, or a record that it was not found
      - global and per-block freeze degrees at t=7 and across the t=3 ladder
      - the full corrected cost table with omega and memory columns and rho beside it
      - the full-support null gap (forced 0) and the graded curve

  falsification_conditions:
    - >-
      The archived derivation shows 2^1194 is not N(966,150)^2 at omega=2.
      Findings (1) and (2) are restated against the real formula or withdrawn.
    - >-
      Any t=7 block freeze degree is >= 150, or any t=3 gap phi_full - phi_A is
      < 2. The genericity finding is void.
    - >-
      The full-support null shows a nonzero gap. Instrument broken; nothing
      reported.
    - >-
      A memory figure is found on the record for this baseline. Finding (2) is
      withdrawn.

  confounders:
    - >-
      SIGN UNKNOWN. The audit establishes that the genericity assumption is
      violated; it does NOT establish the direction of the resulting error, and
      the two candidate mechanisms (support starvation raising d_reg, block
      saturation lowering it) point opposite ways. Anyone citing this record to
      argue the true cost is LOWER is misusing it, and the toy-scale evidence on
      the books (d_reg(sem) > d_reg(null), BATCH-001) points the other way.
    - >-
      SERIES-VERSUS-SYSTEM. Every block freeze degree here is a property of a
      Hilbert series, not of a measured system. The series is a model of
      genericity being applied to a sub-object; that it freezes early is a
      statement about the model. The toy-scale stage exists to attach it to a
      real measurement.
    - >-
      SCREEN LIMIT. research/dreg-linear-law/scripts/dreg_crypto_cost_model.py
      was NOT opened in this session; it is cited by H-SDEG-0dd021 as a read and
      verified source for the builder parameters. A derivation of the cost figure
      may live there and would make finding (1) partly moot.
    - >-
      NO ATTACK ANYWHERE. Every reading examined lands hundreds of bits above
      rho. A reader skimming "2^787" out of this record without its conditions
      would be reading an attack claim into a record that makes none.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT MOVED, NO STATUS CHANGE. The proposal produces a
      conditioned baseline and a named heuristic. It does not weaken or support
      H-DREG-001, does not close RQ-DREG-001, and does not authorise any
      revision of the committed BATCH-001 checkpoint, which is immutable and
      whose correction, if warranted, is a superseding record by the Coordinator.
    - >-
      Crypto-scale ARITHMETIC on a toy-validated model is not crypto-scale
      EVIDENCE. Every number at t=7 n=161 in this record is the output of a
      heuristic series, is labelled model-derived, and carries rule 7's
      prohibition: no toy measurement in this goal supports any of it.
    - >-
      What it does license, and this is the deliverable: the goal's own headline
      acquires an omega, a memory column, a named heuristic, a falsification
      condition and a bracket. Under docs/target-result-profile.md that is the
      minimum for a cost claim, and the current record does not meet it.

  heuristic_assumptions:
    - id: HEUR-DREG-GEN-1
      statement: >-
        GLOBAL SEMI-REGULARITY. For the boolean chained Semaev system at
        parameters (t, n), the Macaulay rank at every degree D equals the
        semi-regular prediction N(nb,D) - sum_{k<=D} h_k^+ derived from
        H(z) = (1+z)^{nb} prod_i (1+z^{d_i})^{-1}, i.e. the system behaves as
        though its 2n or 6n polynomials were in general position on all nb
        variables, notwithstanding that each polynomial's support lies in a
        proper subring.
      rigorous_support: >-
        NONE OFFERED IN THIS CORPUS, and that is the point of naming it. The
        semi-regularity framework is the standard model for random systems of
        given degrees; applying it to a SUPPORT-STRUCTURED system is an
        extrapolation. It is the assumption the merged method census flags as
        the standout unnamed heuristic (24 files, 13 experiment contracts, 1
        evidence record) and as the one known to be doubtful for
        summation-polynomial systems. The primary literature (Bardet-Faugere-Salvy)
        is recorded elsewhere in this corpus as NOT RETRIEVED AND NOT VERIFIABLE
        FROM THIS ENVIRONMENT, and no citation is asserted here.
      validation_plan: >-
        Falsified or supported directly by this goal's own ladder, which is
        exactly what it is measuring: the deficit is the departure of the real
        rank from this heuristic's prediction, and it is nonzero at every rung
        measured (1,322 / 1,862 / 1,823 / 1,999 / 2,724 at D=5). So the heuristic
        is ALREADY FALSIFIED AS AN EQUALITY at toy scale, and the open question is
        only its magnitude and scaling - which makes its unlabelled use at t=7
        n=161 the defect this record reports.
    - id: HEUR-DREG-GEN-2
      statement: >-
        COST MODEL. Solving cost = (Macaulay column count at the solving degree)
        raised to omega, with omega = 2, and memory not charged.
      rigorous_support: >-
        omega = 2 is a theoretical floor for matrix multiplication and is not
        achieved by any implemented GF(2) linear algebra. The memory omission has
        no support at all; the column count IS a memory lower bound.
      validation_plan: >-
        Report the table across omega in {2, 2.37, 3} with memory beside time.
        No measurement is needed; the correction is arithmetic.

  target_complexity:
    time_exponent: >-
      The audit moves no exponent. The exponent it AUDITS is 1194 (base 2, at
      t=7 n=161, omega=2), and the bracket it opens on that exponent is
      [787, 1792] once omega and the block reading are varied - against Pollard
      rho at 80.5. Stated plainly: nothing in this bracket is an attack, and the
      value of the audit is that the goal's headline stops being a single
      unlabelled number.
    memory_exponent: >-
      >= 597 (bits, log2) for the Grobner route at the quoted parameters, versus
      O(log p) for rho. Currently absent from every record in this goal.
    best_known: >-
      Pollard rho / van Oorschot-Wiener at 2^80.5 time, negligible memory, fully
      parallelisable, for the n = 161 group order quoted in BATCH-001.
    hidden_overhead: >-
      Everything in the o(1): the cost of CONSTRUCTING the degree-150 Macaulay
      matrix at all, which semaev_tree's own module docstring records as the
      gating bottleneck ("weil_descend_to_F2 walls there") and which no cost
      figure in this goal includes.
    tradeoff_note: >-
      There is no time-memory tradeoff offered for the Grobner route in any
      record here. rho has a well-known one (van Oorschot-Wiener); the Grobner
      side does not, and that asymmetry is itself part of why the bare comparison
      misleads.

  dominated_by: >-
    Pollard rho / van Oorschot-Wiener, on every axis and by a very large margin -
    and this is recorded as a domination rather than left as null, because the
    honest answer here is that the audited route is dominated, not that nothing
    dominates it. Rows checked: TIME - rho 2^80.5 versus Grobner 2^1194 at the
    most optimistic omega; rho wins by ~1114 bits. MEMORY - rho negligible versus
    Grobner >= 2^597; rho wins. DATA/QUERIES - rho needs the group and nothing
    else; the Grobner route needs the descent construction, which is itself
    infeasible at these parameters; rho wins. PARALLELISM - rho is embarrassingly
    parallel with linear speedup under distinguished points; the linear algebra
    is not; rho wins. PREPROCESSING - rho none; Grobner the whole matrix build;
    rho wins. No row favours the audited route. THIS PROPOSAL claims no Pareto
    point of its own and offers none.
  sota_delta: >-
    Zero on every attack axis - nothing here is faster, smaller, or cheaper than
    anything. Quantitatively, on the evidentiary axis: it replaces one unlabelled
    exponent (1194) with a bracket [787, 1792] whose width is 1005 bits, attaches
    a memory exponent (>= 597) that is currently absent, and names a heuristic
    (HEUR-DREG-GEN-1) that this goal's own toy data has already falsified as an
    equality at five rungs while continuing to use it at crypto scale.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.75 that all three findings stand after stage 1. Not higher, because the
    archived derivation was not opened in this session and the whole of findings
    (1) and (2) is conditional on 2^1194 being N(966,150)^2 at omega=2 - a
    reconstruction that matches to 0.4 bits but was not confirmed against the
    source; and because "no memory figure exists" is an absence claim over
    records this screen read, not over the repository. Not lower, because the
    reconstruction reproduces the committed d_reg = 150 exactly from an
    independently derived parameter reading (k=23, nb=966, 161 quadrics + 805
    cubics), because the block freeze degrees 25/43/80 are arithmetic that
    cannot come out otherwise, and because finding (3)'s premise - that each
    equation's support lies in a proper subring - is read directly from
    src/semaev_tree.py rather than recalled. Priority is medium rather than high
    only because no reading of it produces an attack, and the goal's decisive
    measurement is elsewhere.
