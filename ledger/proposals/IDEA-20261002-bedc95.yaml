  proof_search_map:
    bottleneck: >-
      The maximum generator degree of the saturated ideal of the Kummer
      image, and the failure of those fibres to stay aligned under
      translation by t.
    baseline_embedding:
      parameter_slice: >-
        GGMP m=3 degrees 6 and at most 9, used as the comparison integers
