      coordinates of the fibre of t, evaluated by a recalled classical
      map from Mumford coordinates; the instrument records the map's
      source formula before using it. Arity m=3. Attempts: one ideal
      computation. Seeds: the relabeling bijection is the identity
      enumeration order, not an RNG. Instrument path: to be written.
      Metrics: generator degree, first-fall degree, Boolean variable count,
      L, b, on the surface, on the random quartic, on the subspace, and
      on the null curve.
    controls:
      - Identity map on Z/19Z, predicted b=1.
      - Random fixed-point-free pairing on a 19-element set, with b recorded.
      - Negation on relabelled Z/19Z, predicted b=2 and predicted failure of translation invariance.
      - Random quartic in P^3 over F_2.
      - Equal-cardinality subspace factor base.
      - Null curve over F_{2^{19}} not defined over F_2.
    required_metrics:
      - maximum generator degree (integer)
      - first-fall degree (integer)
      - Boolean variable count (integer)
      - L in bits
      - b (integer)
    outcomes:
      positive: >-
        A genus-2 model exists, the saturated ideal is generated in degree
        4, b=2, and the random quartic's first-fall degree differs from
        the surface arm.
      negative: >-
        The ideal requires a generator of degree at least 9, or b=1, or
        the first-fall degree equals the random quartic. The Riemann
        degree did not survive, or it is not using the group law.
      artifact: >-
        No genus-2 model exists, or the classical coordinate map is not
        recorded before the run. The Z/19Z branching result still stands
        on its own and does not become a degree result.
  falsification_conditions:
    - A generator of degree 5 or higher is required.
    - The ideal is generated in degree at most 2, in which case the quartic recollection is wrong and the prediction of degree 4 fails. Degree 2 is then a different claim and is not silently adopted.
    - Some translate preserves every negation fibre.
    - The first-fall degree equals that of the random quartic.
  confounders:
    - A bad affine chart can raise the apparent degree; saturation in projective coordinates is required.
    - The recalled Kummer formulae could be mis-transcribed; the reproduction check is the Z/19Z identity, which does not use those formulae, and the curve arm freezes the formulae in the output before the run.
    - First-fall degree 2 can come from the trace morphism KR-IC-f5c584. The null curve and the random quartic separate that source.
  interpretation_limits:
