  target_complexity:
    time_exponent: >-
      n/2, unchanged. A degree-4 membership polynomial at genus 2 does not
      alter 2^{n/2} / n^{1/2}.
    memory_exponent: >-
      Unchanged van Oorschot-Wiener product. The ideal is four variables
      of degree 4 before descent, then n-fold Weil descent.
    best_known: >-
      Pollard rho ~ 2^{n/2} / n^{1/2} on Koblitz, 2^60.9 at n=131.
      Index calculus has no better proven exponent on prime-degree binary
      curves (KR-IC-1fcdbc, KR-IC-9e610d). The 1/n ceiling is KR-IC-b0fcda.
    hidden_overhead: >-
      Negation canonicalisation is one lexicographic comparison of the two
      signs, a constant. The Frobenius 1/n and n^2 factors are polynomial
      in n and are not an exponent. Semaev degree at m=3 is 2 before descent.
    tradeoff_note: >-
      b=2 doubles every fibre step that lifts an image point to a group
      element. That factor is constant. No new time-memory curve is claimed.
