        comparison for a quadratic generator.
      reproduction_check: >-
        On Z/19Z with the involution x -> -x, check by enumeration that
        translating the pair {x, -x} by 1 leaves the set {x+1, -x+1},
        which is different from {x+1, -(x+1)}. This is the baseline
        collision and uses no curve.
    observation_collision:
      observable: a Kummer point, as the image of a negation pair
      distinct_preimage_search: >-
        The two signs are the two preimages. Search for a third preimage
        on the toy model. Also search for a translate t such that
        {p+t, -p+t} equals {p+t, -(p+t)} for every p; a hit would restore
