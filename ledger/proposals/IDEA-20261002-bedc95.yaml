  title: >-
    Generator degree of the Kummer image of an auxiliary abelian surface
    over F_2, with negation-orbit branching of translation by an odd-order
    point priced at b=2.
  class: mechanism
  claim: >-
    For an auxiliary abelian surface A/F_2 with a rational point t of order
    19, the ideal of the Kummer image in P^3 is generated in degree 4, and
    the negation map is a 2-to-1 projection whose fibres are not a block
    system of translation by t. The target elliptic curve stays in R1
    x-coordinates. The stage whose charge changes is factor-base membership.
    Degree 4 on an auxiliary surface does not change the rho exponent n/2.
  mechanism: >-
    Meeting: algebraic geometry (the Kummer image of an abelian surface)
    and the classical period lattice (the Riemann form, whose algebraic
    shadow is the ideal of that image). Over F_2 the complex lattice is
    not the object being computed. The testable shadow is the saturated
    ideal of the image.
    OBJECT FRAME. Representation of the elliptic point: R1 x-coordinate.
    Representation of the auxiliary point: its image in the Kummer
    threefold-complement, four projective coordinates. Operation set Sigma:
    translation by the order-19 point t on A, and negation. Sigma does not
    contain the full translation action of the target elliptic curve.
    TRICHOTOMY. Branching. Reason: the Kummer map identifies p with -p, and
    the translate of the pair {p, -p} by t is {p+t, -p+t}, which differs
    from {p+t, -(p+t)} when 2t is not zero. The fibres are not a block
    system of <t>.
    LOSSY-PROJECTION TEST against Sigma = <translation by t>. Discarded:
    the sign. Compatibility fails as a block system, and the branching
    bound is b=2, one bit of loss. Lossy: the two signs are distinct group
    elements and the image point does not select one. Level-4 theta
    coordinates separate points and would be a change of coordinates, so
    they are not the projection used here. The Kummer line of the target
    elliptic curve is closed at model lever 1 and is not this surface.
    PRICE. L = 1 bit. b = 2. Measured against the identity map (L=0, b=1),
    a random pairing on a set of the same cardinality, and negation on the
    relabelled group Z/19Z, where the same b=2 must appear if the branch
    is the involution x -> -x and must fail to commute with translation by
    1 in that labelling.
    OFF-LIMITS COMPONENT. F2 is the decomposition stage whose membership
    ideal is being priced, not the lens. The Weil-polynomial census is not
    rerun. Added: the generator degree of the image ideal and the branching
    pair (L, b). A non-Jacobian abelian surface, if the class at n=19 is
    not a Jacobian, still has a Weil polynomial and still lacks this ideal;
    the degree claim then waits on a model and the Z/19Z branching control
    still runs.
    FACTOR-BASE ESCAPE. KN-OPEN-020 class: implicit-membership (the image
    ideal), becoming high-degree if a generator of degree >= 5 appears.
    Charges: description is the four coordinates and the ideal; membership
    is ideal membership; relation is one S_3 attempt on the image values;
    descent is Weil descent of those generators; time and memory are the
    Groebner cost at m=3 on the object and on the null curve.
    REPRESENTATION CLASS. R1 on the target. R3 for the auxiliary Kummer
    coordinates (a non-function representation relative to E). Stage:
    factor-base membership.
