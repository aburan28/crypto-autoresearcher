idea:
  id: IDEA-20260805-f2fc33
  question_id: RQ-AES-003
  goal_id: GOAL-AES-003
  added: '2026-08-05'
  title: >-
    The falsified-hint control of the r=6/r=7 hinted recovery is forced to its
    observed value by counting alone: a survivor-count forced-value ladder that
    re-scopes OBS-B2-1 and converts an unfalsifiable control into a powered one
  class: control

  claim: >-
    In the r=6 and r=7 hinted constructions of TASK-20260802-9dcca8, the
    per-diagonal survivor readings that EV-AES-d8a13e OBS-B2-1 reports as
    evidence of key isolation -- histogram {1: 16} with a true hint and {0: 16}
    with any falsified hint byte -- are FORCED to those exact values, to
    probability 1 - 2.4e-7, by a counting argument that never mentions AES. The
    only property of the cipher the argument uses is that wrong-key partial
    sums are uniform on 8 bits, and that property is assumed by every arm
    equally. CONSEQUENTLY the control as read discriminates exactly ONE
    alternative -- "the attack code ignores the hint bytes" -- and is a
    CODE-PATH CHECK with near-total power rather than a cryptanalytic result
    about key isolation, which it has close to zero power to establish.
    THE SAME DERIVATION SUPPLIES THE REPAIR, AND THE REPAIR IS ALREADY HALF
    MEASURED. The statistic with real power is the SURVIVING (k3,k4) PAIR COUNT
    after each structure, which the runs already record and which no record
    reads: its forced values are 16 + (2^20 - 16) * 2^(-8S) in the true-hint arm
    and 2^20 * 2^(-8S) in a falsified arm, S = number of 2^32 structures. At
    S = 1, 2 these are 4111.9 / 4096.0 and 32.0 / 16.0 -- a factor-2 separation
    at S = 2 that CAN fail, against readings of 4066 / 32 (TRUE6) and
    4108 / 16 (WRONG6-01) already committed. This proposal claims no result:
    it proposes deriving the ladder independently, checking it against every
    committed pair count, and then measuring the falsified-arm survivor RATE
    across S in {1, 2, 3} and across corruption slots t in {0, 1, 2}, where a
    forced geometric decay of exactly 2^-8 per structure is a graded control
    that localises any departure instead of returning "it did not work".

  object_first_candidate:
    tracked_object: >-
      The CANDIDATE BITMAP cand[d][r][k3][k4] of the partial-sums filter --
      2^20 = 1,048,576 (k3, k4) pairs across 4 ciphertext diagonals d and 4
      MixColumns rows r -- followed as a POPULATION through successive 2^32-text
      structures, rather than the per-diagonal k3 survivor count the campaign
      reports. The tracked quantity is |cand| after S structures. The reported
      quantity is a heavily post-processed function of it (a k3 is reported only
      if some k4 survives in ALL FOUR rows), and that post-processing is exactly
      what destroys the information.
    established_families_off_limits: >-
      Off-limits as the PRIMARY lens for this proposal, per RQ-AES-003's
      objects_declared_off_limits_as_the_primary_lens: differential and
      truncated differential; linear and multidimensional linear; integral /
      square / division property; impossible differential; meet-in-the-middle
      and Demirci-Selcuk; boomerang and retracing boomerang; biclique; algebraic
      (XSL-family) and Groebner; yoyo; mixture differential / exchange; subspace
      trail; partial sums as a cost reorganisation.
      THIS PROPOSAL IS NOT AN ATTACK AND PROPOSES NO NEW LENS. It audits the
      CONTROL attached to an integral / partial-sums attack the campaign already
      built. RQ-AES-003 explicitly admits known families as the BASELINE and
      IMPLEMENTATION arm; the off-limits list binds a NOVEL arm, and there is no
      novel arm here. The lens actually used is elementary counting.
    newness_score: >-
      The counting argument is elementary and certainly not new as mathematics.
      What is not in this repository is the argument APPLIED TO THIS CAMPAIGN'S
      OWN CONTROL as a pre-derived forced value, and the observation that the
      informative statistic was recorded in the same JSON as the uninformative
      one and never read. The ANGLE-BRIEF of 2026-08-05 conjectured this
      ("derive the forced survivor count under a uniformly random wrong hint
      from counting alone"); this record supplies the derivation and the numbers.
    testability_score: >-
      Very high and mostly free. Stage 1 is pen-and-paper arithmetic against
      four integers that are already committed in
      coordination/goals/GOAL-AES-003/batches/BATCH-002/tasks/TASK-20260802-9dcca8/runs/.
      Stage 2 re-runs an existing binary with different nstruct and corruption
      slot; each 2^32-text structure cost a measured 44.36-128.15 s of fold time
      in the committed runs.
    survival_score: >-
      The forced-value ladder survives to every round count the construction
      runs at (r = 6 and r = 7 as built), because it depends only on the
      candidate-space size, the number of 8-bit filter equations and the number
      of structures -- not on the round count. That round-independence is itself
      the point: a statistic whose forced value does not change with r cannot be
      evidence about r.

  mechanism: >-
    DERIVED IN-REPO FROM THE COMMITTED SOURCE. The source read is
    coordination/goals/GOAL-AES-003/batches/BATCH-002/tasks/TASK-20260802-9dcca8/sq_null.c,
    mode attack6n (function mode_attack6 and worker6). No literature is cited
    and none is needed.

    THE FILTER, AS IMPLEMENTED. For ciphertext diagonal d with byte positions
    DIAGP[d] = (p0, p1, p2, p3) and MixColumns row r, the code maintains a
    bitmap cand[d][r][k3][k4] initialised to all ones and tests, for each
    structure of 2^32 chosen plaintexts,
      sum_texts ISB[ ( XOR_t IMIX[r][t] * ISB[ C[p_t] ^ K6[p_t] ] ) ^ K5'[4c+r] ] = 0
    with K6[p0], K6[p1], K6[p2] supplied as a 3-byte HINT and (k3, k4) =
    (K6[p3], K5'[4c+r]) searched exhaustively. The test is an equality in
    GF(2^8): an 8-BIT CONDITION. The candidate space per (d, r) cell is
    256 x 256 = 2^16; over 4 diagonals and 4 rows the total is
    4 * 4 * 2^16 = 2^20 = 1,048,576 pairs.

    THE FORCED VALUES. Let S be the number of structures and adopt the
    UNIFORMITY ASSUMPTION U1: for a candidate pair that is not the correct one,
    the 8-bit balance sum is uniform on GF(2^8) and independent across
    structures. Under U1 alone:
      * TRUE-HINT ARM. Exactly 16 pairs are correct (one per (d, r) cell) and
        survive with probability 1, because the level-4 integral balance is a
        theorem for the correct key bytes. Every other pair survives S
        independent 8-bit tests.
          E[|cand| after S] = 16 + (2^20 - 16) * 2^(-8S)
          S = 1: 16 + 1048560/256      = 4111.9
          S = 2: 16 + 1048560/65536    = 32.0
          S = 3: 16 + 1048560/16777216 = 16.06
      * FALSIFIED-HINT ARM. A falsified hint byte changes u0, u1 or u2 for every
        text, so the correct (k3, k4) no longer satisfies the balance either;
        ALL 2^20 pairs are then "wrong" under U1.
          E[|cand| after S] = 2^20 * 2^(-8S)
          S = 1: 4096.0    S = 2: 16.0    S = 3: 0.0625
      Binomial standard deviations: sd(S=1) = sqrt(2^20 * 2^-8 * (1 - 2^-8))
      = 63.99; sd(S=2) = sqrt(2^20 * 2^-16) = 4.0.

    WHY THE REPORTED READING IS FORCED. The code reports, per diagonal, the
    number of k3 values for which SOME k4 survives in ALL FOUR rows. After
    S = 2 structures the probability that a given wrong k3 has a surviving
    partner in one row is about 256 * 2^-16 = 2^-8, so surviving all four rows
    has probability about (2^-8)^4 = 2^-32.
      TRUE-HINT ARM: 255 wrong k3 per diagonal x 4 diagonals x 2^-32 = 2.4e-7,
      so the histogram is {1: 16} with probability 1 - 2.4e-7.
      FALSIFIED ARM: the true k3 is disqualified too, so 256 x 4 x 2^-32 =
      2.4e-7, and the histogram is {0: 16} with probability 1 - 2.4e-7.
    BOTH OBSERVED READINGS ARE THEREFORE FORCED BY U1 AND THE CANDIDATE-SPACE
    ARITHMETIC. Their likelihood ratio against any alternative that preserves U1
    is 1. This is the KN-TECH-1a5b7e failure mode named mechanically: a control
    whose comparator has zero spread is a constant of the apparatus.

    WHAT THE CONTROL DOES ESTABLISH, STATED SO THE AUDIT IS NOT MISREAD AS A
    DEMOLITION. Against the ONE alternative "the hint bytes are not actually
    consumed by the filter -- a wiring or aliasing defect", the control has
    near-total power: under that alternative the falsified arm would read
    {1: 16} and it read {0: 16}. OBS-B2-1 is therefore an EXCELLENT code-path
    and wiring check and a NEAR-VACUOUS key-isolation claim. The correct
    disposition is re-scoping, not retraction; nothing measured is wrong.

    THE ALREADY-COMMITTED CONFIRMATION, AND THE STATISTIC THAT HAS POWER. The
    same runs record `surviving_(k3,k4)_pairs` per structure. Read by THIS
    PROPOSING SESSION from the committed JSON (arithmetic performed here by
    hand, NOT a run, and to be recomputed independently in Stage 1):
      runs/TRUE6.json      nstruct=2:  S=1 -> 4066,  S=2 -> 32
      runs/WRONG6-01.json  nstruct=2:  S=1 -> 4108,  S=2 -> 16
    Against the forced values 4111.9 / 32.0 (true) and 4096.0 / 16.0 (wrong):
      TRUE6  S=1: (4066 - 4111.9)/63.99 = -0.72 sd ;  S=2: 32 vs 32.0, exact
      WRONG6 S=1: (4108 - 4096.0)/63.99 = +0.19 sd ;  S=2: 16 vs 16.0, exact
    Four committed numbers, all inside 1 sd, two exact. This is a genuine and
    unstated result in TWO directions: it is the campaign's first measurement of
    assumption U1 (the wrong-key uniformity every partial-sums cost model
    silently uses, including CM-3(d)'s success convention), and it shows the
    S = 2 pair count separates the true and falsified arms by a factor of
    exactly 2 (32 versus 16) on counts whose sd is 4 -- about 2.8 sd per run
    pair, which is real power on a statistic that was already paid for.

    THE GRADED CONTROL THE LADDER MAKES POSSIBLE. The falsified-arm forced
    values decay by EXACTLY 2^-8 per structure: 4096 -> 16 -> 0.0625. Three
    interior points, a forced ratio, and a monotonicity requirement. A measured
    ratio that departs from 2^-8 falsifies U1 and localises the departure to a
    round count and a corruption slot, rather than leaving an undifferentiated
    negative. A quantity that fails to decay at the forced rate as S rises is
    the canonical artifact tell of docs/inventor-protocol.md section 3.

    THE SLOT SYMMETRY, WHICH SUBSUMES THE CAMPAIGN'S OWN RANK-4 NEXT ACTION.
    EV-AES-d8a13e records that hint corruption was applied BY PREFIX, so a
    single falsified byte was tested only at slot t = 0, and names slots
    t = 1, 2 as unclosed. The forced value is IDENTICAL for every slot, because
    the derivation uses only that u_t changes, never which t. That converts the
    outstanding item from "run two more arms and see" into a PRE-REGISTERED
    EQUALITY with a stated tolerance, which is a strictly stronger test at the
    same cost.

  novelty_status: unverified

  literature_context:
    - >-
      NO EXTERNAL SOURCE IS CITED, READ, OR RELIED ON. The derivation is
      elementary counting over a committed C source file in this repository.
      Under RQ-AES-003 R3 no claim of novelty or non-novelty against published
      cryptanalysis is made in either direction, and none is needed: the object
      audited is this campaign's own control, and the reference is arithmetic.
    - >-
      RELAYED, NOT READ, AND NOT LOAD-BEARING: the ANGLE-BRIEF assembled for
      this session (scratchpad/scout/ANGLE-BRIEF.md, item 15) conjectured that
      this control is forced and could not fail. That brief is a scouting
      artifact of this session, not a ledger record; it is named as the origin
      of the question and carries no authority. The derivation and every number
      above were produced here.

  lossy_projection_identifiability_audit:
    projection: >-
      The candidate bitmap cand[d][r][k3][k4] (2^20 bits) --> the per-diagonal
      k3 survivor histogram (4 small integers, reported as {1: 16} / {0: 16}).
    what_is_discarded: >-
      Essentially everything. 2^20 bits of filter state are reduced to a
      four-value histogram whose entries are 0 or 1. In particular the SIZE of
      the surviving population -- the only quantity that carries information
      about the wrong-key sum distribution -- is discarded, even though the code
      computes and prints it in the same JSON object.
    why_genuinely_lossy: >-
      Maximally lossy. The fibre over the observed value {0: 16} is almost the
      entire space of bitmaps: any bitmap with fewer than one all-four-rows k3
      maps to it.
    why_compatible_with_the_operations: >-
      Perfectly compatible -- the histogram propagates deterministically from
      the bitmap. That compatibility is exactly why the projection is dangerous
      rather than safe.
    is_it_only_a_change_of_coordinates: >-
      NO. The failure checked for, and FOUND, is the MIRROR of the
      (Delta, Pi) = (x XOR y, x*y) char-2 failure: not "nothing discarded,
      nothing gained" but "so much discarded that the observable is CONSTANT
      ACROSS INSTANCES". The comparator spread is zero to within 2.4e-7: both
      the structured arm and the falsified arm land on their respective forced
      values with probability 1 - 2.4e-7 regardless of any cryptanalytic fact.
      That is the check that was run, and that is what it returned.
      The REPAIRED projection -- bitmap --> |cand| after each structure -- is
      also lossy but is NOT constant: its forced values differ between arms
      (32 versus 16 at S = 2) by more than four binomial standard deviations,
      so it retains a discriminating coordinate.

  assumptions:
    - >-
      U1, THE ONLY LOAD-BEARING ONE: for a candidate pair other than the correct
      one, the 8-bit balance sum is uniform on GF(2^8) and independent across
      structures. U1 is not proved here; it is the assumption the audit
      MEASURES, and the four committed pair counts are its first measurement.
    - >-
      That the correct (k3, k4) satisfies the balance with probability 1, i.e.
      that the level-4 integral balance holds exactly for the 2^32-text
      structure. This is the construction's own premise and is separately
      checkable; it is not established by this audit.
    - >-
      That the committed JSON fields `surviving_(k3,k4)_pairs` and the
      per-diagonal `survivor_count` mean what the source says they mean. Stage 1
      re-reads the source to confirm; a mismatch is itself a finding.

  proof_search_map:
    bottleneck: >-
      The inference "the falsified arm read {0: 16}, therefore the construction
      isolates the correct key byte". Every downstream statement about the r=6
      and r=7 constructions passes through it. If the reading is forced, the
      inference carries no weight and the constructions' isolation property is
      UNMEASURED rather than confirmed -- which is a different and honest state.
    baseline_embedding:
      parameter_slice: >-
        S -> infinity with the true hint reproduces the trivial baseline "only
        correct pairs survive", forced value exactly 16. S = 0 reproduces the
        other trivial baseline, |cand| = 2^20. The audit's formula must return
        both endpoints exactly, and does: 16 + (2^20 - 16) * 2^(-8S) at S = 0
        gives 2^20 and at large S gives 16.
      reproduction_check: >-
        EXACT INTEGER IDENTITIES against four committed measurements, not a
        curve that resembles a curve. Stage 1 either reproduces 4066, 32, 4108
        and 16 inside their stated binomial intervals or it does not.
    observation_collision:
      observable: >-
        The per-diagonal survivor histogram over 16 (d, r) cells.
      distinct_preimage_search: >-
        A COLLISION IS EXHIBITED BY DERIVATION AND IT IS THE WHOLE PROPOSAL. Two
        ground-truth objects on opposite sides of the claimed conclusion --
        (A) a construction that genuinely isolates the correct key byte, and
        (B) a construction whose filter is a uniform 8-bit sieve with no
        isolation property at all beyond the balance theorem -- produce the SAME
        observable {1: 16} / {0: 16} with probability 1 - 2.4e-7 each. No
        additional condition in the reported package separates them. The
        repaired observable |cand| DOES separate them at S = 2 (32 versus 16).
    constructive_transforms:
      - transform: stronger_compositional_invariant
        proposed_object: >-
          Preserve the population size |cand| after every structure -- more
          state than the final uniqueness verdict requires -- because that
          stronger state is what survives the filtering recursion and carries
          the distributional information the verdict throws away.
        predicted_gain: >-
          A control with a forced value that differs by a factor of 2 between
          arms and a graded 2^-8-per-structure decay, replacing a control with
          zero comparator spread. No gain to any attacker; the gain is
          evidential.
    quantifier_order: >-
      The claim under audit, written out: FOR ALL falsified hints, the survivor
      set is empty; THEREFORE the construction isolates the correct byte.
      The audit's counter-statement, in the order that matters: THERE EXISTS a
      counting model M (uniform 8-bit sieve, no isolation) such that FOR ALL
      hints, true or falsified, M predicts the observed histogram to probability
      1 - 2.4e-7. The witness M does not depend on the key, the round count, the
      corruption slot or the seed -- it is uniform over exactly the family the
      conclusion quantifies over, which is why the conclusion does not follow.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that the REPORTED READING of this control is forced, that its
        power is confined to the wiring alternative, and that the pair-count
        statistic has measurable power. It CANNOT certify that the construction
        fails to isolate the key byte -- it is silent on that, which is the
        point -- and it must not be written up as if it could. Writing "the
        isolation claim is false" would be the mirror error of the claim it
        audits.
      nearby_object_control: >-
        THE NEARBY OBJECT WHERE THE HOPED-FOR CONCLUSION FAILS IS BUILDABLE AND
        MUST BE BUILT: replace the AES filter by a pure 8-bit pseudorandom sieve
        (hash the candidate index and the structure index to 8 bits, accept iff
        zero) over the same 2^20 candidate space with the same 16 planted
        "correct" pairs. It has NO isolation property by construction. If it
        reproduces {1: 16} and {0: 16}, the control is demonstrated -- not
        merely argued -- to be insensitive to the property it names. This costs
        milliseconds and is the decisive stage.
    proof_obligations:
      - claim: "E[|cand|] = 16 + (2^20 - 16) 2^(-8S) and 2^20 2^(-8S), from the source."
        responsibility: correctness
      - claim: "P(histogram = {1:16} | true hint) = 1 - 2.4e-7 under U1."
        responsibility: correctness
      - claim: "The four committed pair counts lie inside their binomial intervals."
        responsibility: baseline
      - claim: "The pseudorandom-sieve surrogate reproduces both histograms."
        responsibility: soundness
      - claim: >-
          The audit re-scopes OBS-B2-1 and does not retract any measurement;
          nothing here says the construction fails to isolate the key byte.
        responsibility: scope

  predictions:
    - metric: >-
        Reproduction of the committed true-hint pair count at S = 1
        (runs/TRUE6.json structure 0), against the derived forced value
      direction: different
      minimum_effect: >-
        FORCED VALUE 4111.9, binomial sd 63.99. Committed reading 4066 lies at
        -0.72 sd. PREDICTION: |measured - 4111.9| < 3 * 63.99 = 192. A reading
        outside that interval falsifies U1 at S = 1 and is the most interesting
        available outcome.
    - metric: >-
        Reproduction of the committed falsified-hint pair count at S = 2
        (runs/WRONG6-01.json structure 1)
      direction: different
      minimum_effect: >-
        FORCED VALUE EXACTLY 16.0, sd 4.0. Committed reading 16. PREDICTION:
        |measured - 16| <= 12 (3 sd) in every replicate.
    - metric: >-
        Probability, under the derived counting model, that the falsified arm
        reports a non-empty per-diagonal survivor set in at least one of 16 cells
      direction: lower
      minimum_effect: >-
        FORCED VALUE 2.4e-7, derived before any run. This is the number that
        makes the control unfalsifiable, and it is the headline. If the correct
        value is instead above 1e-2, the control had real power and this
        proposal's headline objection is WRONG -- which would be a decisive and
        welcome falsification.
    - metric: >-
        Ratio of falsified-arm survivor counts between consecutive structure
        counts, |cand|(S+1) / |cand|(S), for S = 1 -> 2 and S = 2 -> 3
      direction: different
      minimum_effect: >-
        FORCED VALUE EXACTLY 2^-8 = 0.00390625 at each step, with monotone
        decay. Tolerance: the measured ratio must lie inside the 99% binomial
        interval implied by the S-th count. A ratio flat across S, or one that
        does not decay, falsifies U1 and is reported as the artifact tell.
    - metric: >-
        Slot symmetry: falsified-arm survivor count at corruption slot t = 1 and
        t = 2, compared with the committed t = 0 arms at the same S
      direction: different
      minimum_effect: >-
        FORCED to be EQUAL in distribution across slots, because the derivation
        never uses t. Predicted difference of means across slots: 0, with
        tolerance 3 * sd(S). A slot-dependent survivor rate falsifies U1 in a
        LOCALISED way and is a substantive finding about the filter, not a
        nuisance.
    - metric: >-
        Pseudorandom-sieve surrogate: per-diagonal survivor histograms at S = 2
        with 16 planted correct pairs and with none
      direction: different
      minimum_effect: >-
        PREDICTED {1: 16} and {0: 16} respectively, in at least 19 of 20
        independent surrogate trials. If the surrogate does NOT reproduce them,
        the counting model is incomplete and the audit's conclusion is withdrawn.

  minimal_test:
    design: >-
      Four stages, cheapest first, each able to terminate the audit; stage 1
      alone can end it.
      STAGE 0 (reading, ~30 min, zero compute): re-read sq_null.c mode attack6n
      and confirm the candidate space is 2^20, the filter is an 8-bit equality
      per structure, and the reported per-diagonal count requires survival in
      all four rows. If any of these is wrong the derivation is void and the
      audit stops here.
      STAGE 1 (arithmetic, ~30 min, zero compute, DECISIVE): recompute the
      forced-value ladder independently and compare with every committed
      `surviving_(k3,k4)_pairs` field in
      .../TASK-20260802-9dcca8/runs/*.json. Report each as a signed binomial
      z-score. If the committed counts are inconsistent with the ladder, the
      audit's model is wrong and the audit stops and reports that.
      STAGE 2 (surrogate, minutes, pure Python or C, no cipher): the
      pseudorandom-sieve nearby object with and without planted correct pairs,
      20 trials each.
      STAGE 3 (execution, hours): re-run attack6n at nstruct = 1 and 3 and at
      corruption slots t = 1, 2 with at least 3 independent target keys per
      cell, recording |cand| after EVERY structure.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, FORCED VALUE DERIVED PRE-RUN, CAN FAIL:
        the pseudorandom 8-bit sieve over the identical 2^20 candidate space,
        with NO isolation property. Forced values 4096 / 16 / 0.0625 at
        S = 1, 2, 3 and histogram {0: 16} at S = 2. It fails if it does not
        reproduce the committed arms' behaviour, which would show the counting
        model is incomplete.
      - >-
        POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR: the S = 1 reading of any
        arm, true or falsified, where 4096 survivors are FORCED. If any arm
        reports 0 survivors at S = 1 the instrument is broken and NO negative
        result from any other stage may be reported at all. This is the
        sensitivity demonstration; it was available in the committed data and
        was never used as one.
      - >-
        GRADED CONTROL, THREE INTERIOR POINTS, MONOTONICITY REPORTED:
        S in {1, 2, 3} with forced values 4096, 16, 0.0625 in the falsified arm
        and 4111.9, 32.0, 16.06 in the true arm. Report the two consecutive
        ratios against the forced 2^-8 and state monotonicity. A departure
        localises to a specific S rather than leaving an undifferentiated
        negative.
      - >-
        SIBLING NULL THAT ISOLATES THE NAMED PROPERTY (KN-FIND-029 practice
        rule 6): corrupt a byte of the target's ciphertext stream rather than a
        hint byte, at the same rate. Both corruptions destroy the balance; only
        the hint corruption bears on "the hint is consumed". If the two are
        indistinguishable in every reported statistic, the control does not
        isolate the hint pathway and says so.
      - >-
        ARCHIVE CHECK (zero compute): enumerate every prior reading of this same
        observable in the campaign. AVAILABLE and enumerated: TRUE6, TRUE6-S2,
        WRONG6-*, WRONG7-*, PART6-*, PART7-* under
        .../TASK-20260802-9dcca8/runs/. This is not a claim that they agree;
        Stage 1 is where that is decided.
      - >-
        VERDICT-ON-THE-NULL-FIRST. The frozen decision rule is executed on the
        pseudorandom-sieve surrogate BEFORE any new cipher arm is read. If it
        emits the same verdict on the surrogate as on the real arms, the rule
        discriminates nothing and must be rewritten before any real arm is read.
    required_metrics:
      - "|cand| after every structure, per arm, with S and the corruption slot named"
      - signed binomial z-score of each count against its forced value
      - the two consecutive ratios and their forced value 2^-8
      - per-diagonal survivor histograms, retained for continuity with OBS-B2-1
      - surrogate histograms with and without planted pairs, 20 trials each
      - measured wall clock and peak RSS per arm, under CM-3

  falsification_conditions:
    - >-
      Any committed `surviving_(k3,k4)_pairs` value lying outside a 3-sd
      binomial interval around its forced value. The counting model is then
      wrong, U1 is refuted, and the audit's headline objection is withdrawn as a
      superseding record. This would make OBS-B2-1 STRONGER than claimed, not
      weaker, and is the outcome this proposal would most like to see.
    - >-
      The pseudorandom-sieve surrogate failing to reproduce {1: 16} / {0: 16}.
      The claim that the reading is forced is then unsupported.
    - >-
      Stage 0 showing the filter is not an 8-bit equality per structure, or the
      candidate space is not 2^20. The whole derivation is void.
    - >-
      A measured slot dependence in the falsified-arm survivor rate. U1 is then
      false in a localised way, and the finding is about the filter rather than
      about the control.

  confounders:
    - >-
      THE FOUR COMMITTED COUNTS ARE NOT FOUR INDEPENDENT CONSTRAINTS. TRUE6 and
      WRONG6-01 share the same target key, the same seed 90001 and the same two
      structure bases (28db394b... and 1b6cfbc5...). The S = 2 count is
      conditioned on the S = 1 survivors of the same run, so the two numbers in
      one run are not independent either. Stage 3 must supply independent keys.
    - >-
      THE AUDIT IS CHEAP TO PRODUCE AND READS AS RIGOUR. Refuting a control is
      the easiest deliverable in this program's repertoire. The design answers
      this with a positive control that can fail, a surrogate that can fail, and
      a falsification condition (the first above) under which the audited result
      gets STRONGER.
    - >-
      SELECTION. Only some runs completed; several *.json.truncated files exist
      in the runs directory. Stage 1 must enumerate ALL run files, including
      truncated ones, and report which were unreadable rather than silently
      using the readable subset.
    - >-
      U1 IS AN ASSUMPTION IN BOTH DIRECTIONS. If U1 is false, the forced values
      are wrong and so is the claim that the control is forced. The audit
      therefore measures U1 rather than assuming it, and reports the measurement
      before any conclusion about the control.

  interpretation_limits:
    - >-
      THIS AUDIT SAYS NOTHING ABOUT WHETHER THE r=6 AND r=7 CONSTRUCTIONS
      ISOLATE THE CORRECT KEY BYTE. It says the reported control does not
      measure that. Those are different statements and merging them would be the
      error this record exists to name.
    - >-
      NO STATUS CHANGE to EV-AES-d8a13e, EV-AES-d33b1c, EV-AES-005 or
      DEC-20260802-b226fb is proposed or implied. Any re-scoping is a
      Coordinator act under AGENTS.md rule 1, on a superseding record, never an
      edit.
    - >-
      Claim tier `toy` and reduced-round only, per RQ-AES-003 R6. Nothing here
      is a statement about full-round or deployed AES, and no comparison to
      published cryptanalysis is made in either direction (R3, symmetric).
    - >-
      The r=6 construction remains DOMINATED by exhaustive search over the same
      hinted residual, and the r=7 arm remains not a key recovery. This audit
      does not change either, and every citation must carry both clauses
      (CORR-20260802-003).

  heuristic_assumptions:
    - id: HEUR-F1
      statement: >-
        U1. For every candidate pair (k3, k4) other than the correct one, for
        every diagonal d and row r, the 8-bit balance sum
        sum_texts ISB[(XOR_t IMIX[r][t] ISB[C[p_t] ^ K6[p_t]]) ^ K5'] is uniform
        on GF(2^8) and independent across distinct structures.
      rigorous_support: >-
        NOT PROVED, AND SAYING OTHERWISE WOULD BE THE ERROR. The usual argument
        -- a wrong key byte makes the partial decryption a non-integral function
        of the text, whose 2^32-fold sum is a balanced pseudorandom byte -- is
        the standard heuristic behind every partial-sums attack and predicts
        concentration, not exactness, and says nothing about the size of the
        fluctuation. Its status here is CANDIDATE TO MEASURE.
      validation_plan: >-
        The audit IS its validation: the four committed counts are its first
        measurement (all inside 1 sd, computed above), and Stage 3 adds
        independent keys, three values of S and three corruption slots, giving a
        graded test with a forced 2^-8 decay per structure.
    - id: HEUR-F2
      statement: >-
        The correct (k3, k4) survives with probability exactly 1, i.e. the
        level-4 integral balance holds exactly for the 2^32-text structure at
        the correct key bytes.
      rigorous_support: >-
        This is the construction's own premise, derived elsewhere in the
        campaign, and it is USED but not established here. If it is false the
        true-arm forced value changes from 16 + (2^20-16) 2^(-8S) to
        (2^20) 2^(-8S) and the two arms become indistinguishable at every S --
        which is itself a checkable consequence.
      validation_plan: >-
        Implied by the S = 2 separation: the true arm reading 32 against the
        falsified arm reading 16 is exactly the +16 term. Stage 3 measures it
        directly over independent keys.

  target_complexity:
    time_exponent: >-
      n/a for this audit; NO ALGORITHM IS PROPOSED AND NO EXPONENT IS MOVED, and
      that is stated plainly rather than dressed up. The proposal is a control
      audit under docs/inventor-protocol.md section 3. Its value is that it
      decides what an existing, committed, reviewed observation means, and it
      supplies the campaign with the first measurement of the uniformity
      assumption that CM-3(d)'s success-probability convention rests on.
    memory_exponent: >-
      n/a. Peak RSS of the audited binary is bounded by its 2^20-byte candidate
      bitmap plus 4 x 4 x 1024 x 8 bytes of parity tables; it will be MEASURED
      rather than modelled, per CM-3(f).
    best_known: >-
      Not applicable and deliberately not asserted. RQ-AES-003 R5 requires
      `dominated_by` to be recorded as unresolvable in this environment and
      never null; see below.
    hidden_overhead: >-
      None claimed. The audit's own cost is dominated by Stage 3's cipher arms
      at roughly 45-130 s of fold time per 2^32 structure, as measured in the
      committed runs.
    tradeoff_note: n/a.

  dominated_by: >-
    Unresolvable in this environment: no primary source reachable from this
    harness has been read for this record, and every recalled frontier row is
    unverified-from-memory (RQ-AES-003 R5). Rows checked INSIDE this repository
    for a prior derivation of this control's forced value, across time, memory
    and data/queries: EV-AES-001..005, EV-AES-d33b1c, EV-AES-d8a13e, the
    GOAL-AES-003 BATCH-001 and BATCH-002 coordination trees including
    count5/PREREGISTRATION.md, TASK-20260802-9dcca8/PREREGISTRATION.md and both
    review reports, DEC-20260802-9bda5c, DEC-20260802-b226fb, and the ledger
    proposal directory. NONE derives the survivor-count forced value or reads
    the pair counts as a control. Absence of a search result is not evidence
    that no such derivation exists (AGENTS.md retrieval policy).
  sota_delta: >-
    NO ATTACK, NO SPEEDUP, ZERO ON EVERY ATTACK AXIS (time, memory, data,
    queries, advice). Quantitatively, the deltas claimed are evidential and
    they are stated as numbers: the audited control's discriminating power
    against a non-isolating alternative goes from a likelihood ratio of 1 (zero
    comparator spread, both readings forced to probability 1 - 2.4e-7) to a
    factor-2 separation on counts with sd 4 at S = 2, about 2.8 sd per run pair;
    and the campaign gains its first MEASURED reading of assumption U1, on four
    committed integers, where it previously had none. Against REF-A, REF-B and
    REF-C this proposal claims NO margin of any kind. Published-frontier
    comparison: UNADJUDICABLE in this environment.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.85 that the headline holds -- that the reported {1: 16} / {0: 16} readings
    are forced to within a few times 1e-7 and the control's power is confined to
    the wiring alternative. It is not higher because the entire argument rests
    on U1, which is exactly the thing the campaign has never measured, and
    because the derivation was made by reading C source rather than by running
    it: a misreading of DIAGP indexing, of the four-row survival condition, or of
    the `nstruct` semantics would change the arithmetic. It is not lower because
    the model already reproduces four committed integers within 1 sd, two of
    them exactly (32 and 16 against forced 32.0 and 16.0), which is a
    non-trivial four-point agreement that a wrong model would have to be lucky
    to achieve.
    0.97 that the audit reaches a decisive reading, because Stage 1 is
    arithmetic against numbers already committed and Stage 2 is a
    milliseconds-long surrogate.
    0.10 that Stage 3 measures a departure from U1 large enough to change any
    cost figure; that outcome would be the more valuable one and is why Stage 3
    is in the design rather than deferred.
