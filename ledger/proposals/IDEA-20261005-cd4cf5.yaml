idea:
  id: IDEA-20261005-cd4cf5
  question_id: RQ-DRINF-6b5a9d
  added: '2026-10-05'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Height split of the six rank-2 Drinfeld modules over F_3: coefficient
    valuation versus gcd of tau-exponents, against one rank-3 neighbor.
  class: measurement
  claim: >-
    Let q = 3 and let the six modules be Phi_T = g tau + Delta tau^2 with
    g in F_3 and Delta in F_3 nonzero, at A-characteristic (T). Let H_coeff
    be the least i with nonzero coefficient of tau^i, and let H_gcd be the
    gcd of the tau-exponents that appear. On these six modules the multiset
    of H_coeff is {1, 1, 1, 1, 2, 2}, and H_gcd equals H_coeff on each of
    them. On the rank-3 neighbor Phi_T = tau^2 + tau^3, H_coeff = 2 and
    H_gcd = 1. This is not a torsion cardinality and not an isogeny-class
    count. No ECDLP exponent is in scope.
  mechanism: >-
    Two readings of "height" are scored before the census. Coefficient
    reading: height is the first nonzero tau-power, so g nonzero gives 1
    and g = 0 gives 2, four modules against two. Gcd reading: height is
    the gcd of the support. On rank 2 those two integers coincide, so the
    six modules cannot separate them. The rank-3 neighbor has support
    {2, 3}, so the gcd reading returns 1 and the coefficient reading
    returns 2. Agreement on the six modules with disagreement on the
    neighbor means the six-module split does not identify the invariant.
    The reverse pair of outcomes is a negative. Torsion roots are not
    counted. Frobenius characteristic polynomials are not counted.
    LOSSY-PROJECTION TEST. The ambient object is the skew polynomial
    Phi_T. Operation set Sigma is reading off coefficients, not elliptic
    translation. The projection keeps the support of exponents and
    discards the nonzero coefficient values in F_3. Compatible with
    Sigma: scaling Delta by a unit in F_3^* does not change the support.
    Lossy: Delta = 1 and Delta = 2 are distinct modules with the same
    support, so the projection is not a coordinate change.
  novelty_status: unverified
  citations:
    - ref: KN-LIT-174
      provenance: internal
      claim: >-
        Title-level note only; abstract thin; PDF not opened. The abstract
        discusses the endomorphism ring, the characteristic polynomial,
        and the number of isogeny classes. It states no height integer
        and no gcd of tau-exponents.
      verified_by: idea-generator, this session, via knowledge/literature/KN-LIT-174.md
    - ref: KN-LIT-1515
      provenance: internal
      claim: >-
        Title-level note only; abstract thin; PDF not opened. The abstract
        starts from the Carlitz module and names rank structure as a
        difference from elliptic curves. It states no height integer.
      verified_by: idea-generator, this session, via knowledge/literature/KN-LIT-1515.md
    - ref: Drinfeld 1974
      provenance: recalled
      claim: >-
        Recalled pointer, not opened: the height of a Drinfeld module in
        A-characteristic P is the least tau-power in Phi_P. Not support.
      verified_by: null
    - ref: KR-IC-955fd6
      provenance: internal
      claim: >-
        Opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml.
        The row claim is that S_m symmetry and small-order torsion speed
        point decomposition, with an FGHR estimate of about 2^130 word
        operations. That is not this height split, and the estimate is
        not used.
      verified_by: idea-generator, this session, via knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml
  assumptions:
    - tau is the q-power map x |-> x^3, and coefficients lie in F_3.
    - At A-characteristic (T) the constant term of Phi_T is 0.
    - H_coeff and H_gcd are defined from the written support, as above, because the PDF definition was not opened.
    - The rank-3 neighbor is a nearby object, not one of the six modules in the question.
  predictions:
    - metric: count of the six modules with H_coeff = 1
      direction: higher
      minimum_effect: 4
    - metric: count of the six modules with H_coeff = 2
      direction: higher
      minimum_effect: 2
    - metric: number of the six modules on which H_gcd differs from H_coeff
      direction: lower
      minimum_effect: 0
    - metric: H_coeff minus H_gcd on Phi_T = tau^2 + tau^3
      direction: higher
      minimum_effect: 1
  minimal_test:
    design: >-
      List the six pairs (g, Delta). For each written polynomial record
      H_coeff and H_gcd and the two counts. Then record both integers on
      tau^2 + tau^3. Do not count geometric roots and do not compute a
      Frobenius characteristic polynomial. If a later read of the local
      PDF of KN-LIT-174 defines height by a third rule, score that rule
      as a separate column and do not rename it to either column above.
    controls:
      - The rank-1 Carlitz reduction Psi_T = tau has H_coeff = H_gcd = 1. Agreement there is the nearby object on which the two definitions still coincide.
      - The rank-3 neighbor is the object on which coincidence is predicted to fail. If it also coincides, the two definitions were not separated.
      - Scaling Delta by 2 must not change either integer. A change means the support was mis-read.
    required_metrics:
      - height1_count
      - height2_count
      - six_module_definition_disagreements
      - rank3_H_coeff
      - rank3_H_gcd
  falsification_conditions:
    - height1_count is not 4, or height2_count is not 2.
    - Any of the six modules has H_gcd different from H_coeff.
    - On tau^2 + tau^3 the two integers are equal.
  confounders:
    - Writing Phi_T with a suppressed unit coefficient hides a tau-power and changes H_coeff.
    - Calling the gcd of the coefficients, rather than the gcd of the exponents, answers a different question.
    - A PDF definition that uses the Newton polygon of a lattice is a third column. Matching neither column is a withdrawn label, not a repaired one.
  interpretation_limits:
    - One prime field, degree 1. No statement about heights over extensions.
    - The rank-3 neighbor is outside the six-module list. It does not enlarge that list.
    - Not an attack claim. No ECDLP exponent is in scope. Isogeny classes are not counted.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        On a rank-2 module Phi_T = g tau + Delta tau^2 over F_3, the
        gcd of the tau-support equals the least exponent. This imitates
        the coincidence of two classical invariants on a too-short
        support, the way the elliptic ordinary/supersingular split is
        recalled to match a single integer on a rank-2 formal group.
        The census is exhaustive at q = 3. No transfer to larger q or
        to rank greater than 3 is claimed.
      rigorous_support: >-
        For a polynomial with at most two terms, the gcd of the
        exponents equals the least exponent whenever the least exponent
        divides the other. That divisibility holds for exponents {1, 2}
        and {2}, and fails for {2, 3}. Drinfeld's identification of
        H_coeff with the geometric height is recalled and not opened.
        KN-LIT-174 and KN-LIT-1515 do not state this divisibility.
      validation_plan: >-
        Compute both integers on all six modules and on tau^2 + tau^3.
        The predicted pattern is agreement on 6 of 6 and difference 1
        on the neighbor. A single mismatch falsifies HA-1 at this
        field. No sampling and no extrapolation.
  target_complexity:
    time_exponent: >-
      Polynomial in q and in the tau-degree. Named values q = 3 and
      tau-degree at most 3. No sub-rho claim.
    memory_exponent: >-
      Six coefficient pairs plus one neighbor. Constant memory at this
      instance.
    best_known: >-
      No ECDLP exponent is in scope. Opened baselines KN-LIT-174 and
      KN-LIT-1515 are title-level and give no height integer.
    hidden_overhead: None. The census is the whole test.
    tradeoff_note: No time-memory tradeoff. The list is exhaustive.
