idea:
  id: IDEA-20260922-70740d
  question_id: RQ-DREG-c8ae8d
  added: '2026-09-22'
  proposed_by: idea-generator
  status: proposed
  title: Resultant-tower degree and content before any Macaulay matrix
  class: measurement
  claim: >-
    Representation class R1 of RQ-ECDLP-623a32 (field coefficients of the
    summation polynomials), attack stage relation decomposition only. On one
    toy ordinary curve and one F_q-rational isogenous codomain, build S_m for
    m >= 4 by Semaev's resultant recurrence, the same frozen variable split
    on both curves. This is the recurrence that leaves the closed prime-field
    m=3 neighbor screen (RQ-DREG-d7b6d6); the observable is not m=3 d_reg.
    Before any Macaulay matrix, record the total degree and the content of
    each intermediate resultant. Content means a generator, up to units of
    F_q, of the content of that resultant as a polynomial in one variable
    over F_q of the remaining variables; it is nontrivial when that generator
    has positive total degree. A drop of at least 1 in the degree sequence,
    or a nontrivial content present on exactly one side of the edge, is a
    pre-Gröbner signal. If the degree sequences agree and the contents agree
    up to units, the resultant tower does not see an outlier on that edge
    and the idea stops. These integers are not a first-fall degree, a
    last-fall degree, a solving degree, or a degree of regularity.
  mechanism: >-
    Object frame. Representation: R1, the coefficients of the intermediate
    resultants in the summation variables. Attack stage: relation
    decomposition only. Operation set Sigma: the resultant in one frozen
    variable, then extraction of total degree and content. Sigma is not the
    translation action of the group. Trichotomy class of
    IDEA-20260806-c5d183: coordinate-dependent, because degree and content
    are properties of the presented polynomials, not of a group element.
    The projection discards every coefficient except the total degree and
    one content generator. Many polynomials share that pair, so the
    projection is lossy. The integers are a report of Sigma; they are not
    claimed to propagate under translation. The recurrence itself is
    recalled and was not opened: for m >= 4, S_m is a resultant of two
    earlier summation polynomials in one auxiliary variable, with the split
    frozen (resultant of S_3 against S_{m-1}) and used on both curves. A
    degree below the bidegree of that resultant is a leading-coefficient
    cancellation. A one-sided content is a factor over the base field that
    the neighbor's resultant does not have. Neither event is a Gröbner
    fall. No Macaulay matrix is built. If both sequences and both contents
    match, there is nothing for a later fall profile to be predicted from,
    and the idea stops on that edge.
  novelty_status: unverified
  citations:
    - ref: RQ-DREG-c8ae8d
      provenance: internal
      claim: >-
        Asks whether a degree proxy stays bounded on one classmate while
        it grows on an isogenous neighbor. Unfinished Gröbner runs are
        not degree evidence. This proposal never starts a Gröbner run.
      verified_by: idea-generator, full file read 2026-09-22
    - ref: RQ-DREG-d7b6d6
      provenance: internal
      claim: >-
        Forbids rerunning the closed prime-field m=3 neighbor screen.
        Requires a system whose degree is not stuck at that floor. The
        m >= 4 resultant recurrence is the system used here.
      verified_by: idea-generator, full file read 2026-09-22
    - ref: IDEA-20260806-c5d183
      provenance: internal
      claim: >-
        Coordinate-dependent is the trichotomy class in which the tracked
        object is a function of the representation rather than of the
        group element.
      verified_by: idea-generator, lines 1-70 read 2026-09-22
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        R1 is a field representation of coordinates. The attack stage
        named here is relation decomposition.
      verified_by: idea-generator, title and scope opening read 2026-09-22
    - ref: Semaev summation-polynomial resultant recurrence
      provenance: recalled
      claim: >-
        Summation polynomials for m >= 4 are built by a resultant in one
        auxiliary variable of two earlier summation polynomials. The
        bidegree formula for that resultant was not opened. The split
        used here is a frozen experimental choice, not a cited theorem.
      verified_by: null
  assumptions:
    - The same variable split is used on both curves.
    - Exact arithmetic only. An aborted resultant is unmeasured.
    - Toy field only. No transfer to a cryptographic curve.
  proof_search_map:
    bottleneck: >-
      Leading-coefficient cancellation, or a content factor, inside the
      resultant that builds S_m for m >= 4. Removing that cancellation
      is what would make the degree sequences differ. A Gröbner basis
      is not the bottleneck, because none is computed.
    baseline_embedding:
      parameter_slice: >-
        On one curve, the implementation's S_3 is compared with the
        recalled expanded S_3 formula before any m >= 4 resultant is
        trusted. The formula is recalled and was not opened.
      reproduction_check: >-
        Coefficient-wise agreement of that S_3 on one (a, b). Disagreement
        voids the tower. This is not a reproduction of a Macaulay profile.
    observation_collision:
      observable: >-
        The sequence of total degrees of the intermediate resultants,
        together with the content generator up to units.
      distinct_preimage_search: >-
        The domain and the codomain are two presentations. The search
        asks whether they land in the same fiber of this observable.
        The gauge orbit of one j is a third presentation: a collision
        that appears inside the orbit is a coordinate artifact.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          One F_q-rational ell-isogeny edge, ell coprime to the group
          order, with the resultant tower specialized to both Weierstrass
          models.
        predicted_gain: >-
          A degree gap of at least 1, or a one-sided content, or a
          matched sequence that stops the idea. No ECDLP exponent gain.
    quantifier_order: >-
      There exist one domain and one F_q-rational isogenous codomain
      such that, for every intermediate resultant the recurrence
      finishes, the total-degree sequences differ by at least 1 at one
      index, or the contents differ by a positive-degree factor. The
      universal reading is the stop: for all finished intermediates, the
      degrees agree and the contents agree up to units. An unfinished
      resultant sits outside both quantifiers.
    method_ceiling:
      strongest_certifiable_claim: >-
        On this edge, the resultant tower either separates the two
        models by degree or content, or it does not. That statement is
        not a fall degree and not an attack.
      nearby_object_control: >-
        The gauge orbit of the domain j, same recurrence. A gap that
        appears between two gauge models of one j is a coordinate
        artifact, and the isogeny reading is not issued.
    proof_obligations:
      - claim: >-
          Total degree and content are computed from the resultant
          polynomial itself, and are not renamed Gröbner degrees.
        responsibility: correctness
    not_applicable_reason: null
  predictions:
    - metric: resultant_degree_or_content_gap
      direction: different
      minimum_effect: >-
        At one finished intermediate, the total degrees differ by at
        least 1, or a positive-degree content generator divides one
        side and not the other.
    - metric: resultant_tower_agreement
      direction: lower
      minimum_effect: >-
        Hamming distance 0 between the finished degree sequences, and
        contents equal up to units. That reading stops the idea.
  minimal_test:
    design: >-
      Pick one toy ordinary curve and one F_q-rational ell-isogeny,
      ell coprime to the group order. Build S_3, check it against the
      recalled expanded formula, then build S_4 and, if exact arithmetic
      finishes, S_5, by the frozen resultant split, on both curves.
      Record total degree and content of each finished resultant. Run
      the same tower on one other gauge model of the domain j. Assign
      gap, agreement, artifact, or unmeasured. Do not build a Macaulay
      matrix.
    controls:
      - S_3 coefficient check on one (a, b) before the tower is trusted.
      - One gauge model of the domain j, same split.
      - The codomain tower uses (a', b') rebuilt from the codomain, not a pullback of the domain polynomials.
    required_metrics:
      - total degree of each finished intermediate, both sides
      - content generator up to units, both sides
      - whether a gap, an agreement, or a gauge artifact was assigned
      - count of aborted resultants, excluded from both readings
  falsification_conditions:
    - >-
      S_3 disagrees with the recalled expanded formula. The tower is
      void and no reading is issued.
    - >-
      Finished degree sequences agree and contents agree up to units.
      The tower does not see an outlier. The idea stops on that edge.
    - >-
      The same gap appears between two gauge models of one j. The gap
      is a coordinate artifact.
    - >-
      A reading is issued from an aborted resultant. That reading is
      withdrawn.
  confounders:
    - A different variable split on the two curves.
    - Content compared without quotienting by units of F_q.
    - Treating a lower resultant degree as a first-fall or solving degree.
    - An ell that shares a factor with the group order.
    - Pulling the domain polynomials back instead of rebuilding on (a', b').
  interpretation_limits:
    - Toy tier only. No cryptographic curve.
    - >-
      Agreement stops this idea only. It says nothing about a later
      fall profile, which this record does not compute.
    - >-
      ECDLP time exponent stays N^{1/2} (Pollard rho) and rho memory
      stays O(1). No walk is charged. No outlier is nominated for the
      syzygy gate.
    - >-
      The resultant recurrence and its generic bidegree are recalled.
      A degree gap is an observation about the polynomials that were
      built, not a confirmation of an unread formula.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For generic Weierstrass coefficients the total degree of each
        intermediate resultant equals the degree of the resultant as a
        function of the leading coefficients of its two inputs. A drop
        of at least 1 on one curve and not the other is a
        coefficient-dependent cancellation. This assumption does not
        identify that degree with a Gröbner degree. A matched sequence
        does not prove that a fall profile above any cap is flat.
      rigorous_support: >-
        The resultant of two univariate polynomials is a polynomial in
        their coefficients, of degree equal to the other's degree in
        each coefficient block, when the leading coefficients do not
        vanish. That bidegree statement is recalled (Sylvester) and was
        not opened. It is the shape H1 imitates. No theorem equating
        resultant degree with solving degree is assumed.
      validation_plan: >-
        On one toy curve with ab != 0, compute the total degree of the
        S_4 resultant and compare it with the recalled bidegree. Record
        the field order and m. A shortfall of at least 1 on this generic
        curve means the recalled bidegree is the wrong baseline, and H1
        is not used to call the neighbor special. Tail check: do not
        rewrite an aborted S_5 as degree 0. No extrapolation past the
        toy edge.
  target_complexity:
    time_exponent: >-
      N^{1/2} for the ECDLP, Pollard rho. No improvement is claimed.
    memory_exponent: O(1) for rho. The tower stores a few polynomials.
    best_known: Pollard rho, time N^{1/2}, memory O(1), for the ECDLP.
    hidden_overhead: >-
      No attack exponent is claimed, so no superpolynomial term is
      hidden in an o(1). The walk to a curve is uncharged because this
      idea does not nominate an outlier.
    tradeoff_note: >-
      Exact resultant arithmetic on one edge. Not a van Oorschot-Wiener
      tradeoff, and it does not change rho.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  dominated_by: >-
    As an ECDLP attack, Pollard rho dominates on time (N^{1/2}), memory
