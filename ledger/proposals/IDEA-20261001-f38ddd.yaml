idea:
  id: IDEA-20261001-f38ddd
  question_id: RQ-NGCC-f52138
  goal_id: GOAL-NGCC-6c8a52
  added: '2026-10-01'
  title: >-
    Reproduce or refute the published Facto-DSA-128 public-key trapdoor
    claim (sign-10-2) on the official round-1 submission
  class: mechanism
  claim: >-
    Saarinen, ePrint 2026/2266, reports that a Facto-DSA-128 public key
    yields a universal trapdoor and that forgery then takes 6.4 seconds
    (finding sign-10-2). This idea asks whether that published claim
    reproduces on the official ICCS round-1 Facto-DSA package, compiled
    from its C sources by this program. It proposes no new attack.
  mechanism: >-
    The published sign-10-2 argument, once read from the finding and the
    Facto-DSA specification, is run on a public key from the official
    key generator. No signature is supplied to the recovery. A recovered
    object counts only when a verifier built separately from the recovery
    code accepts a signature on a message chosen after recovery. The
    published 6.4 second figure is a comparison measurement, not a bound
    this idea invents.
  novelty_status: unverified
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      Facto-DSA is an NGCC round-1 signature candidate, not an
      elliptic-curve discrete-log instance. knowledge/frontiers/ecdlp
      does not contain this scheme. The corpus entry that names it is a
      round-1 listing and states that it includes no third-party analysis.
    nearest:
      - ref: KN-LIT-5e5a42
        provenance: kb
        relation: adjacent
        delta: >-
          KN-LIT-5e5a42 records that Facto-DSA is signature candidate 10
          and states that the specification, reference code, and any
          third-party analysis were not read. This idea adds an
          independent reproduction test of published finding sign-10-2.
          It adds no new attack and no cost improvement over that finding.
    searched:
      corpus_grep:
        - "knowledge/literature/KN-LIT-5e5a42.md read 2026-10-01"
      web:
        - "https://eprint.iacr.org/2026/2266 landing page fetched 2026-09-30"
      blocked: []
  test_boundary: >-
    Official Facto-DSA zip from the round-1 roster (sign-10), the
    parameter set the package names as Facto-DSA-128, two independent
    keys. Other declared parameter sets are recorded and not part of the
    success criterion. No claim about a repaired or later submission.
  falsification: >-
    On Facto-DSA-128, both independent keys fail to produce a
    fresh-message signature that a separate verifier accepts, and the
    failure is not a build or infrastructure error.
  status: proposed
  proposed_by: coordinator
