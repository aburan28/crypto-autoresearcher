# IDEA-20261004-135ff6
# Class-number count for discriminants -2003 and -1995. Proposal only. Not approved.
idea:
  id: IDEA-20261004-135ff6
  question_id: RQ-JINV-8fc13a
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    The class number of discriminant -2003 is 9 and of discriminant -1995 is 8
  class: measurement
  claim: >-
    Discriminant -2003 has 9 reduced binary quadratic forms.
    Discriminant -1995 has 8. Nine exceeds eight by 1. The product of
    the two class numbers is 72. Their sum is 17. The gap is a class
    number, not an ECDLP exponent and not an absolute discriminant.
  mechanism: >-
    OBJECT FRAME. The object is the set of reduced forms. The
    operation set is counting those forms, which is coordinate-dependent
    on the discriminant and is not a translation of a curve point.
    Discriminant -2003 has the forms with coefficients 1, 1, 501 and
    3, -1, 167 and 3, 1, 167 and 9, -7, 57 and 9, 7, 57 and 13, -5, 39
    and 13, 5, 39 and 19, -7, 27 and 19, 7, 27. Discriminant -1995 has
    the forms with coefficients 1, 1, 499 and 3, 3, 167 and 5, 5, 101
    and 7, 7, 73 and 15, 15, 37 and 19, 19, 31 and 21, 21, 29 and
    23, 11, 23. Two copies of class number 8 have gap 0. No curve
    is enumerated.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks which j-invariant distinctions change an
        attack cost.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-IC-889857
      provenance: internal
      claim: >-
        A first-fall-degree dispute is a different object from these
        two class numbers.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The two discriminants are frozen before the forms are counted.
    - No curve is enumerated.
  proof_search_map:
    bottleneck: The class-number gap 1.
    baseline_embedding:
      parameter_slice: Discriminants -2003 and -1995 and class numbers 9 and 8.
      reproduction_check: >-
        Two readers must agree that -2003 has 9 reduced forms and that
        -1995 has 8.
    observation_collision:
      observable: The class-number gap and the product.
      distinct_preimage_search: >-
        Reporting both class numbers as 8 drops the gap. Two copies of
        class number 8 make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The reduced forms of discriminant -1995.
        predicted_gain: One fewer reduced form. No exponent.
    quantifier_order: >-
      The discriminants are fixed before the forms are counted.
    method_ceiling:
      strongest_certifiable_claim: >-
        The class numbers 9 and 8. Not a curve enumeration.
      nearby_object_control: >-
        Two copies of class number 8. The gap is 0.
    proof_obligations:
      - claim: Discriminant -2003 has 9 reduced forms.
        responsibility: size
      - claim: Discriminant -1995 has 8 reduced forms.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: class_gap
      direction: different
      minimum_effect: Nine exceeds eight by 1.
  minimal_test:
    design: >-
      Count the reduced forms of discriminants -2003 and -1995. Do not
      enumerate a curve.
    controls:
      - Two copies of class number 8, whose gap is 0.
      - An independent count.
    required_metrics:
      - both class numbers
      - the gap
      - the product
  falsification_conditions:
    - The class number of -2003 is not 9.
    - The product of the two class numbers is not 72.
  confounders:
    - The absolute values 2003 and 1995 are not the class numbers.
  interpretation_limits:
    - A class number is not a walk length.
    - No transfer to a cryptographic discriminant.
    - This is not the class-number pair 8 and 7 of discriminants -1635 and -1675.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen discriminant -2003 has class number 9, and the
        frozen discriminant -1995 has class number 8.
      rigorous_support: >-
        No class-number theorem is re-proved here. The count is a
        reading of the reduced forms.
      validation_plan: >-
        Two independent counts of the reduced forms. A mismatch voids the gap.
