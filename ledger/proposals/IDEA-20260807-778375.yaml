idea:
  id: IDEA-20260807-778375
  question_id: RQ-JINV-8fc13a
  added: '2026-08-07'
  title: >-
    Small |D_0| makes the Hilbert class polynomial, the CM ideal factorisation
    of (pi - 1), and Lenstra's O-module structure E(F_p) = O/(pi-1) all cheaply
    COMPUTABLE - and this proposal argues, and then measures, that their entire
    publicly usable output on a prime-order subgroup is the single GLV
    eigenvalue lambda, so the CM ring supplies a DESCRIPTION whose effectivisation
    is DLP-equivalent
  class: mechanism

  claim: >-
    (A) WHAT SMALL |D_0| ACTUALLY MAKES CHEAP. Four things, each with a cost.
      A1 THE HILBERT CLASS POLYNOMIAL. H_{D_0}(X) has degree h(D_0). For the nine
        class-number-one discriminants -3, -4, -7, -8, -11, -19, -43, -67, -163
        it is LINEAR, so j is a single known integer (H_{-3} = X, so j = 0;
        H_{-4} = X - 1728). For class number two it is quadratic. General cost of
        computing H_D is quasi-linear in |D| by the standard CRT/floating-point
        methods; at |D_0| <= 163 it is free. So for small |D_0| the set of
        possible j-invariants with that CM order is a KNOWN, TINY, EXPLICIT SET.
      A2 THE CORNACCHIA DECOMPOSITION. End_{F_p}(E) = O_{D_0} forces
        4p = t^2 + |D_0| f^2 with t the trace; both t and f are recoverable in
        polynomial time from p and D_0 by Cornacchia's algorithm. For D_0 = -3
        this is the classical 4p = L^2 + 27M^2 form and it is what makes the six
        sextic twists' group orders computable WITHOUT point counting.
      A3 THE IDEAL ABOVE N. Since h(D_0) = 1 for D_0 in {-3,-4}, O is a PID.
        The prime ideal n dividing (pi - 1) with norm N is generated by an
        explicit element beta in O obtained by Cornacchia from 4N = u^2 +
        |D_0| v^2. beta is an ENDOMORPHISM OF DEGREE N whose kernel is exactly
        the prime-order subgroup G.
      A4 LENSTRA'S CM STRUCTURE. For an ordinary E with End(E) = O there is an
        O-module isomorphism E(F_p) = O/(pi - 1). This gives the group structure
        and, restricted to G, presents G as O/n.

    (B) THE OBSTRUCTION, STATED SHARPLY, AND IT IS THE POINT OF THE PROPOSAL.
    Every item in (A) is a statement about the curve or about an abstract module.
    The moment any of it is applied to POINTS OF G it collapses to one scalar:
      - beta from A3 has kernel G, so beta acts on G as multiplication by 0.
        Writing beta = (u + v*omega') in a fixed Z-basis {1, omega'} of O and
        letting lambda be the action of omega' on G, "beta acts as 0" reads
        u + v*lambda = 0 mod N, which SOLVES FOR lambda and returns exactly the
        GLV eigenvalue already available as a root of L^2 + L + 1 (D_0 = -3) or
        L^2 + 1 (D_0 = -4). The ideal structure therefore returns the eigenvalue
        and nothing else. [derived in this record.]
      - A4's isomorphism is not effective: exhibiting the map O/(pi-1) -> E(F_p)
        requires knowing the O-module generator's image, and inverting it on a
        given point IS the discrete logarithm. Making Lenstra's isomorphism
        explicit is DLP-equivalent, so it cannot be an ingredient of a DLP
        algorithm without circularity.
      - H-ENDO-001 supplies the general reason: G has prime order N, End(G) =
        Z/N, so every endomorphism acts as a scalar and adding endomorphisms to
        the witness lattice adds COORDINATES BUT NO CONGRUENCE - the index stays
        exactly N for every rank r.
    THE NAMED OBSTRUCTION: O has Z-rank 2, so its image in End(G) = Z/N is the
    subring generated by 1 and lambda, which is all of Z/N; a subring of Z/N
    imposes no congruence on k. Every element of the CM ring is therefore a
    known scalar, and known scalars are exactly what the generic group model
    already provides (KN-FIND-b7e091, oracle D).

    (C) SO WHY MEASURE ANYTHING. Because (B) is an ARGUMENT and the program's
    standard is that an argument plus a measurement is a closure while an
    argument alone is a hypothesis. Two things in (B) are checkable at toy scale
    and one of them could fail:
      C1 THE INDEX CLAIM. Build the witness lattice augmented not by
        endomorphisms (H-ENDO-001's design) but by IDEAL DATA: rows encoding
        beta, the ideal norm N, the conductor f, and the Cornacchia pair (u,v).
        Compute its Hermite normal form index in Z^{2r}. Predicted EXACTLY N,
        for every cell, on every instance. An index strictly below N would mean
        the CM ideal structure supplies a congruence that endomorphism-image
        data does not - which would be a genuine break of the lane's central
        obstruction and would have to be replicated independently before being
        reported as anything but a suspected bug.
      C2 THE CIRCULARITY CLAIM. Implement Lenstra's isomorphism explicitly at
        toy scale and MEASURE what it costs. Predicted: the only implementation
        that produces the map runs a discrete logarithm, so its cost tracks
        matched rho within a constant. A route that produces the map in time
        materially below sqrt(N) refutes (B) and is the interesting event.

    (D) WHAT IS CLAIMED BEYOND THE sqrt(|Aut|) CONSTANT: NOTHING, AND THE
    PROPOSAL PREDICTS ITS OWN NEGATIVE. It is filed as a recorded closure with a
    named obstruction, per the batch brief's instruction that an inadmissible
    proposal is still a legitimate deliverable. The deliverable is the exact
    cost table for (A1)-(A4) and the exact statement of what each buys, so that
    no later record in this campaign has to re-derive it.

  resource_label: >-
    R3 - End(E) as a RING: ideals, norms, class group, and the Hilbert class
    polynomial. The proposal consumes R3 and argues that R3's image in End(G) is
    the whole obstruction.

  admissibility: inadmissible_generic_group
  admissibility_argument: >-
    DECLARED INADMISSIBLE, ON PURPOSE, AND FILED ANYWAY. The resource R3 is
    genuinely non-generic as long as it stays on the curve: the ideal
    factorisation of (pi-1), the conductor f, and H_{D_0} are all invisible to a
    generic group oracle. But every USE of that resource in this proposal ends
    by applying an element of O to a point of G, and there it becomes
    multiplication by a publicly computable scalar - which is exactly Oracle D
    of KN-FIND-b7e091, shown GGM-simulable and therefore closed at exponent 1/2,
    and exactly H-ENDO-001's scalar-action argument. The proposal is admitted to
    the ledger as a CLOSURE RECORD whose value is the named obstruction in
    claim (B) plus the two falsifiable checks C1 and C2 that could overturn it.
    If C1 fires (index strictly below N), the admissibility verdict flips and
    the lane reopens; that is the only route by which this record becomes an
    attack, and it is stated in advance.

  discriminated_from:
    - >-
      H-ENDO-001, which augments the witness lattice with ENDOMORPHISMS and
      predicts index exactly N. This proposal augments with IDEAL AND
      CLASS-POLYNOMIAL data - the conductor, the Cornacchia pair, the ideal norm
      - which are ring-level objects that H-ENDO-001 never places in the
      lattice. If the index is N in both cases, this proposal has extended
      H-ENDO-001's P1 to a strictly larger data class, which is a stronger
      statement than H-ENDO-001 makes and is the reason to run it. It does NOT
      test, support, weaken or restore H-ENDO-001; only the Coordinator moves
      status.
    - >-
      KN-FIND-b7e091 Oracle D (endomorphism images), which is closed. This
      proposal asks whether the RING'S IDEAL STRUCTURE, as opposed to the
      IMAGES OF ENDOMORPHISMS, escapes that closure - and argues it does not,
      giving the argument rather than citing the finding.
    - >-
      Lane L10 (RQ-CLGP-b99df5), which asks for a reduction between Cl(O)
      vectorisation and ECDLP. This proposal does not attempt that reduction; it
      concerns the ideal above N inside a FIXED curve, not the class group
      acting between curves.
    - >-
      Lane L9 (RQ-CANL-63098f), canonical lifts and CM lifting. The Hilbert class
      polynomial appears there too, in characteristic zero. Here it is used only
      to enumerate possible j mod p and to establish that the set is tiny.
    - >-
      IDEA-20260807-94f953 (this batch), which uses h(D_0) = 1 to collapse the
      ISOGENY CRATER. Same class number, different consequence: that proposal is
      about where you can walk, this one is about what you can compute standing
      still.

  object_first_candidate:
    tracked_object: >-
      THE IDEAL n = (pi - 1, N) of O, together with its explicit generator beta
      obtained by Cornacchia - followed under the map O -> End(G) = Z/N.
    lossiness: >-
      LOSSY IN EXACTLY THE FATAL WAY. The map O -> Z/N kills the rank-2 ring
      down to a rank-1 image; an ideal of O is projected to an ideal of Z/N, and
      Z/N is a field, so the only ideals are 0 and everything. The projection
      therefore discards ALL ideal-theoretic content. That is not a defect of
      the choice of object - it is the finding, and it is what makes this a
      closure rather than an experiment.
    propagation: >-
      Deterministic on the curve: ideal multiplication corresponds to composition
      of isogenies, and ideal norms multiply. Deterministic but TRIVIAL on G:
      every ideal acts as a scalar, and the scalar of n is 0 by construction. So
      the object propagates perfectly and carries no information after one step.
    survival_score: >-
      Survives arbitrarily far on the curve side - the whole class-group action
      is built on it (KN-TECH-027 records the CSIDH form). Dies immediately on
      the point side, at the very first application to an element of G. The
      distance it survives before dissolving is ZERO STEPS in the direction this
      campaign needs.

  mechanism: >-
    STEP 1 (zero compute, symbolic). Write out the derivation in (B) explicitly
    for D_0 = -3 and D_0 = -4: fix the Z-basis of O, express beta from
    Cornacchia, impose beta|_G = 0, and check that the resulting congruence on
    lambda is exactly the root of L^2 + L + 1 (resp. L^2 + 1). If this fails to
    reproduce the known GLV eigenvalue, the derivation is wrong and the record
    is superseded before anything is run.

    STEP 2 (low compute). Verify Lenstra's structure statement E(F_p) = O/(pi-1)
    at toy scale by comparing the abstract group structure of O/(pi-1) (computed
    from the Z-lattice of pi-1 in O by Smith normal form) with the actual group
    structure of E(F_p) (computed by point counting and factoring). Report
    agreement rate across the instance grid. Disagreement means either the
    hypotheses of the theorem are not met on those instances (e.g. End(E) is not
    the maximal order) or the implementation is wrong; both are recorded, and
    the maximality of End(E) is checked separately by confirming that the
    conductor of Z[pi] in O equals f from Cornacchia.

    STEP 3 (the index measurement, C1). Build the IDEAL-AUGMENTED witness
    lattice: coordinates for (a, b) as usual, plus coordinates encoding the
    action of beta, of pi, and of the conductor-scaled elements. Compute the
    Hermite normal form and its index in the ambient Z^{2r}. Record the index per
    cell. PREDICTED EXACTLY N. Include a PLANTED POSITIVE CONTROL: an artificial
    row that genuinely does collapse the index (e.g. a row asserting k = k_0 mod
    q for a small q dividing nothing), which the instrument must detect. An
    instrument that misses the planted collapse produces void negatives.

    STEP 4 (the circularity measurement, C2). Implement two routes to Lenstra's
    isomorphism: (i) the naive route, which computes discrete logarithms and is
    therefore trivially DLP-cost; (ii) any candidate route that uses only the
    ideal data (beta, f, the Cornacchia pair, H_{D_0}) and the group operations.
    Measure both in point additions against matched rho and matched BSGS on the
    identical instance. Predicted: route (ii) does not exist, i.e. every attempt
    reduces to route (i). Any route (ii) beating rho by more than a constant is
    the interesting event and halts the line for independent review.

    STEP 5 (the cost table, and it is a deliverable in itself). Tabulate, for
    |D_0| in {3, 4, 7, 8, 11, 19, 43, 67, 163} and for a class-number-two ladder
    and for a generic |D_0|: h(D_0), deg H_{D_0}, the cost of computing H_{D_0},
    the cost of Cornacchia, whether beta is a single generator (PID) or needs an
    ideal basis, and - the column that matters - WHAT IS PUBLICLY COMPUTABLE
    ABOUT G FROM EACH. Predicted: the last column reads "lambda" in every row,
    including the generic one where lambda does not exist and the column reads
    "nothing".

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Run 2026-08-07 from the repository root.
      (1) grep -ril "hilbert class polynomial" ledger/ knowledge/ docs/ analysis/
      (2) grep -ril "small discriminant\|CM discriminant\|fundamental discriminant\|D_0" knowledge/
      (3) grep -ril "Lenstra\|complex multiplication structure" *.md analysis/ knowledge/ ledger/
      (4) read ledger/hypotheses/H-ENDO-001.yaml and
          knowledge/findings/KN-FIND-b7e091.md in full
      (5) read knowledge/techniques/KN-TECH-061.md (Honda-Tate/Waterhouse) in full
    results: >-
      (1) 24 files mention the Hilbert class polynomial; inside knowledge/ the
      hits are KN-LIT entries and knowledge/sources.json, i.e. bibliographic
      rather than analytic, plus RQ-CANL-63098f which places it in the LIFTING
      lane. (2) Seven knowledge/ files mention CM/fundamental discriminants,
      again predominantly literature entries. (3) "Lenstra" and "complex
      multiplication structure" appear in DECOMPOSITION.md and in research_digest
      material but in NO knowledge/ technique or finding and in NO ledger
      hypothesis. (4) H-ENDO-001 pins the index at N for ENDOMORPHISM-augmented
      lattices and states the scalar-action argument; it does not consider ideal
      data. KN-FIND-b7e091 closes the endomorphism-IMAGES oracle. (5)
      KN-TECH-061 records Honda-Tate/Waterhouse as the existence spine and
      explicitly warns that "proposals that rediscover Frobenius determines the
      isogeny class are duplicates" - this proposal is not that, since it asks
      what the ideal above N gives on G.
    verdict: >-
      ADAPTATION, tending to KNOWN_NEGATIVE. The mathematics in (A) is textbook
      and none of it is claimed as new. The argument in (B) is this program's own
      composition of H-ENDO-001's scalar-action result with the CM ideal
      structure, and no record in this repository states it. Nothing here is
      claimed novel against the external literature; the honest expectation is
      that (B) is folklore among CM specialists and that its value is being
      written down where this campaign can cite it.

  null_object_control: >-
    MANDATORY AND BLOCKING.
    N1 MATCHED GENERIC-|D_0| CURVE at the same p with N of the same bit length,
      for which A1-A4 are all computationally out of reach (h(D) is large,
      H_D is not computable, no small Cornacchia form). Every metric in Steps
      2-4 is run on it. The predicted result on the generic curve is that
      everything about G is exactly as hard - which is the whole finding.
    N2 PLANTED INDEX COLLAPSE (Step 3). An artificial congruence inserted into
      the lattice that genuinely lowers the index. The instrument MUST detect it.
      Failure voids every index-equals-N negative.
    N3 WRONG-DISCRIMINANT ARM. Run the Cornacchia and ideal machinery with the
      WRONG D_0 (say -4 on a j=0 curve). It must fail to produce a consistent
      beta. An instrument that produces a plausible-looking eigenvalue from the
      wrong discriminant is not reading the curve.
    DECAY PARAMETER: |D_0|, swept over the class-number-one ladder
    {3,4,7,8,11,19,43,67,163}, then class number two, then generic. Any quantity
    that is claimed to come from "small |D_0|" must DECAY along that ladder. A
    quantity that is flat across |D_0| = 3 to 163 and then jumps at generic is
    not tracking |D_0| at all - it is tracking "was constructed by the CM method"
    - and that is the canonical artifact tell for this lane.

  assumptions:
    - >-
      E/F_p is ordinary and End_{F_p}(E) is the MAXIMAL order O_{D_0}. This is
      checked, not assumed: the conductor of Z[pi] in O is computed from
      t^2 - 4p = D_0 f^2 and the level in the small-ell volcanoes is verified by
      counting rational ell-isogenies. Curves failing the check are reported
      separately, because Lenstra's statement as used here is for End(E) = O.
    - >-
      lambda is obtained WITHOUT a discrete logarithm (roots of L^2 + L + 1 or
      L^2 + 1 mod N). This exclusion is what keeps the argument non-circular and
      is inherited verbatim from H-ENDO-001's assumption list.
    - >-
      Toy scale, p up to about 2^24, exact Hermite and Smith normal forms
      computable, exact point counting available (harness/toycurve.py order()).
    - >-
      Class-number-one and class-number-two discriminant lists are used as
      finite known lists (the nine and the eighteen). They are cited as
      classical results (Heegner-Stark-Baker for h=1) and are NOT re-derived
      here; the experiment uses them only to choose instances and no conclusion
      depends on their completeness.

  proof_search_map:
    bottleneck: >-
      The step "an element of O acts on G". Everything cheap in (A) happens
      before it and everything the campaign wants happens after it, and the
      claim is that this step is a rank-2-to-rank-1 collapse that destroys all
      ideal content. That is the exact bottleneck and it is where the closure
      argument lives.
    baseline_embedding:
      parameter_slice: >-
        D_0 = -3, r = 1 (no augmentation), toy prime at 16 bits. The
        ideal-augmented lattice must reproduce H-ENDO-001's r = 1 baseline index
        of exactly N, and the derived lambda must equal the root of
        L^2 + L + 1 = 0 mod N computed independently.
      reproduction_check: >-
        Frozen fixture: a fixed (p, b, N, P, Q) with lambda computed two ways -
        by Cornacchia-plus-ideal (Step 1) and by root-finding on L^2 + L + 1 -
        compared for exact integer equality, and phi(P) = [lambda]P verified by
        recomputing the point with harness/toycurve.py. Mismatch halts the line.
    observation_collision:
      observable: >-
        The Hermite normal form index of the ideal-augmented witness lattice.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, which is the closure: a j=0 curve with
        full CM ideal data and a matched generic-|D_0| curve with none are two
        distinct ground-truth objects that produce the SAME observable (index
        exactly N). That collision establishes that the observable cannot
        distinguish "has usable CM ring structure" from "has none", which is
        precisely the statement that the ring structure supplies no congruence.
        Reporting any CM-derived advantage without exhibiting this collision is
        prohibited.
    quantifier_order: >-
      Intended: FORALL small-|D_0| ordinary curves E/F_p in the declared family,
      FORALL prime-order subgroups G of E(F_p), FORALL elements alpha of O, the
      action of alpha on G equals multiplication by a scalar that is computable
      from (E, N) alone WITHOUT reference to Q or k.
      The dangerous weaker reading, NOT claimed: EXISTS alpha whose action
      depends on Q - which would be a genuine oracle and is exactly what
      KN-FIND-b7e091's Oracle A (first-jet) is, non-simulable but privately
      computable. The audit obligation is to confirm that every scalar produced
      in Step 1 is derived from (E, N) and never from Q.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the tested toy instances, the ideal-augmented witness lattice has
        index exactly N, and no route was found from CM ideal data to Lenstra's
        isomorphism below matched rho cost." It can NEVER certify that no such
        route exists, only that none was found in the declared search - which is
        why the closure is stated with the argument in (B) carrying the weight
        and the measurement carrying only corroboration.
      nearby_object_control: >-
        THE COMPOSITE-ORDER SUBGROUP. Take the same j=0 curve and a subgroup of
        COMPOSITE order M = q1*q2. There End(G) is no longer a field, the ideal
        structure of O CAN have nontrivial image, and Pohlig-Hellman already
        exploits the factorisation. The method must behave DIFFERENTLY there. A
        method that reports the same "no content" verdict on the composite case,
        where content demonstrably exists, has not identified the load-bearing
        structure (which is the PRIMALITY of N, not the smallness of |D_0|) and
        its negative on the prime case is uninformative.
    proof_obligations:
      - claim: beta|_G = 0 yields exactly the known GLV eigenvalue.
        responsibility: correctness
      - claim: The image of O in End(G) is generated by 1 and lambda, hence all of Z/N.
        responsibility: correctness
      - claim: A subring equal to Z/N imposes no congruence on k.
        responsibility: correctness
      - claim: The ideal-augmented lattice index equals N on every tested cell.
        responsibility: soundness
      - claim: The planted index collapse is detected.
        responsibility: soundness
      - claim: >-
          Every scalar used is derived from (E, N) and never from Q, so no step
          is circular.
        responsibility: scope
      - claim: End(E) is the maximal order on every instance used for the Lenstra check.
        responsibility: scope

  predictions:
    - metric: ideal-augmented witness lattice HNF index, all cells
      direction: different
      minimum_effect: >-
        Exactly N on 100 percent of cells. A single cell with index strictly
        below N, with the eigenvalue control and the wrong-discriminant control
        both passing, refutes the closure and reopens the lane. Independent
        replication is mandatory before such a cell is reported as anything but
        a suspected implementation error.
    - metric: >-
        agreement rate between the group structure of O/(pi-1) and the measured
        group structure of E(F_p), on instances where End(E) is verified maximal
      direction: higher
      minimum_effect: >-
        At least 95 percent. Systematic disagreement means the maximality check
        is wrong or Lenstra's statement is being misapplied, and Step 4's
        interpretation is withdrawn.
    - metric: >-
        point-addition cost of the cheapest route to Lenstra's isomorphism,
        divided by matched rho cost on the identical instance
      direction: different
      minimum_effect: >-
        Predicted at least 1.0 (i.e. no better than rho) at every tested size. A
        ratio below 0.5 at any size refutes the circularity claim and halts the
        line for independent review.
    - metric: >-
        number of DISTINCT publicly computable scalars on G derived from the CM
        ring, on a D_0 = -3 curve
      direction: different
      minimum_effect: >-
        Predicted exactly 3, namely {1, lambda, lambda^2 = -1-lambda}, and
        exactly 2 on D_0 = -4. A fourth independent scalar on D_0 = -3 that is
        not a Z-combination of these contradicts the ring structure and is an
        instrument failure.
    - metric: >-
        anything claimed as a small-|D_0| effect, as a function of |D_0| along
        the ladder {3,4,7,8,11,19,43,67,163} to generic
      direction: lower
      minimum_effect: >-
        Monotone decay with at least a factor 2 between |D_0| = 3 and |D_0| =
        163. A flat profile followed by a jump at generic is the artifact tell
        and the quantity must be reported as tracking CM-method construction
        rather than |D_0|.

  minimal_test:
    design: >-
      CHEAPEST VALID DISCRIMINATOR: STEP 1, WHICH COSTS NO COMPUTE AT ALL. Write
      beta = (u + v*sqrt(D_0))/2 from Cornacchia on 4N = u^2 + |D_0| v^2, impose
      beta|_G = 0, solve for lambda, and compare with the independently computed
      root of L^2 + L + 1 = 0 mod N on one 16-bit j=0 instance. If the two agree,
      the ideal above N has been shown to return exactly the eigenvalue already
      known, and the closure argument in (B) has its load-bearing step verified
      for the price of one Cornacchia call and one quadratic root. If they
      disagree, the derivation is wrong and no further work is warranted until
      it is fixed.
      Step 3's index measurement is the next cheapest and is the only one that
      could overturn the closure.
    controls:
      - matched generic-|D_0| curve at the same p (N1)
      - planted index collapse (N2)
      - wrong-discriminant arm (N3)
      - composite-order subgroup nearby-object control
      - matched rho and matched BSGS on every instance, same operation unit
      - >-
        maximality check on End(E) before any Lenstra comparison, reported per
        instance
    required_metrics:
      - HNF index of the ideal-augmented lattice, per cell
      - the derived lambda and the independently computed lambda, exact integers
      - Smith normal form of O/(pi-1) vs measured E(F_p) structure
      - conductor f from Cornacchia vs conductor from t^2 - 4p factorisation
      - point additions for every route in Step 4, plus matched rho and BSGS
      - the Step 5 cost table, all columns, including the generic row
      - pass/fail of N1, N2, N3 and the composite-order control

  falsification_conditions:
    - >-
      Step 1's derived lambda differs from the root of L^2 + L + 1 = 0 mod N.
      The derivation in (B) is wrong; supersede this record.
    - >-
      Any cell has ideal-augmented HNF index strictly below N with all controls
      passing. The closure is refuted and the lane reopens; mandatory
      independent replication before reporting.
    - >-
      A route to Lenstra's isomorphism is found whose cost is below 0.5 x
      matched rho. The circularity claim is refuted; halt for review.
    - >-
      The planted index collapse is NOT detected. Every index-equals-N result is
      VOID rather than negative, and the run set is invalid.
    - >-
      The wrong-discriminant arm produces a consistent beta. The instrument is
      not reading the curve; all numbers void.
    - >-
      Point counting or Hermite normal form exceeds budget at the largest size.
      INFRASTRUCTURE outcome under AGENTS.md rule 5, never negative mathematical
      evidence.

  confounders:
    - >-
      NON-MAXIMAL End(E). If End(E) is a non-maximal order, the ideal above N
      may not be principal, beta may not exist as a single generator, and the
      Lenstra comparison changes. Maximality is checked per instance and
      non-maximal instances are reported in a separate stratum, not pooled.
    - >-
      TWISTS. The six sextic twists of a j=0 curve have different traces and lie
      in DIFFERENT isogeny classes. Comparing across twists without saying so
      would compare different groups. The twist is recorded with every instance.
    - >-
      CIRCULARITY BY ACCIDENT. Any implementation that uses Q while computing a
      "publicly computable" scalar has silently smuggled in the answer. Step 1's
      audit obligation exists for this and it is checked mechanically, by
      confirming Q is not read on the code path.
    - >-
      SMALL N. At toy scale N can be small enough that the quadratic
      L^2 + L + 1 = 0 mod N has degenerate behaviour (e.g. N = 3). Instances
      with N < 2^10 are excluded from the eigenvalue arm.
    - >-
      CLASS NUMBER ONE IS A FINITE LIST. Nothing about h(D_0) = 1 generalises;
      at |D_0| beyond 163 the class number grows and H_D is no longer trivially
      computable. Every statement about "small |D_0|" names the exact
      discriminant it was measured at.

  interpretation_limits:
    - >-
      This is a CLOSURE RECORD with a named obstruction, scoped to prime-order
      subgroups. It asserts nothing about composite-order groups, where the
      composite-order control is expected to behave differently.
    - >-
      Nothing here is an attack and no speedup is claimed; the predicted
      headline is a negative.
    - >-
      Toy scale only. The index-equals-N observation at 16-24 bits is
      corroboration of an elementary argument, not crypto-scale validation.
    - >-
      The argument in (B) rests on N being PRIME. Its force comes from
      End(G) = Z/N being a field, not from |D_0| being small; smallness of
      |D_0| only makes the ring data cheap to compute, which is why the
      predicted answer is "computable, yes; usable, no".
    - >-
      No statement is made about supersingular curves over F_{p^2}, where
      End(E) has rank 4 and the entire analysis differs.

  reachability_gate: >-
    NOT APPLICABLE AS A WALK: the curve is fixed. But T4 governs the family's
    availability: End(E) = O_{-3} forces j = 0 and vice versa, so a curve whose
    class does not already contain a j = 0 curve can never be walked to one and
    can never acquire the cheap CM data of (A). The cost of ACQUIRING small
    |D_0| is therefore infinite, not merely large, and the affected family is
    fixed at curve-generation time. Note the corollary for L3's cost accounting:
    the four cheap items in (A) are cheap only for the curves that already have
    them, so there is no "convert a hard curve into an easy one" step anywhere in
    this lane.

  target_complexity:
    time_exponent: >-
      NO IMPROVEMENT CLAIMED; the predicted exponent is 1/2, unchanged, because
      the closure argument says the CM ring adds no congruence. The
      computational items in (A) themselves cost: H_{D_0} quasi-linear in |D_0|
      (free at |D_0| <= 163), Cornacchia polynomial in log p, ideal
      factorisation of (pi-1) requiring only the known factorisation of #E.
    memory_exponent: >-
      All of (A) is polynomial-space in log p. Nothing here competes with rho's
      O(1) memory in any useful sense because nothing here is an algorithm for
      the DLP.
    best_known: >-
      Parallel rho with distinguished points at 0.886*sqrt(N), O(1) memory
      (KN-TECH-001, KN-TECH-006); automorphism-discounted rho on CM curves at a
      factor at most sqrt(6) (KN-TECH-018); BSGS at sqrt(N) time and memory with
      full cost N^{2/3+o(1)} (KN-TECH-031).
    hidden_overhead: >-
      None, because no asymptotic claim is made. The honest disclosure runs the
      other way: the phrase "computable in polynomial time" applies to the CM
      DATA and emphatically not to the isomorphism of (A4), whose only known
      construction runs a discrete logarithm. Any downstream record that quotes
      "E(F_p) = O/(pi-1) is computable" without that qualifier is misreading
      this one.
    tradeoff_note: >-
      Not applicable - no algorithm is produced. The only tradeoff visible is
      the one this record documents: cheap ring data against zero usable
      constraint on k.

  dominated_by: >-
    AS AN ATTACK: mounts none. Dominated on every axis, checked row by row.
    TIME - rho at 0.886*sqrt(N) (KN-TECH-001, KN-TECH-006); this proposal offers
    no algorithm and so is infinitely dominated. MEMORY - rho at O(1); same.
    DATA/QUERIES - rho needs (P,Q); this needs (P,Q) plus public curve data and
    still produces nothing, so it is dominated even on the axis where extra
    public data is free. CM-SPECIFIC - automorphism-discounted rho (KN-TECH-018)
    is the correct baseline on exactly this family and it dominates. MEMORY-RICH
    - BSGS (KN-TECH-031) dominates on time among memory-heavy methods. NOT null.
    AS A CLOSURE RECORD: the incumbents are H-ENDO-001 (which pins the index for
    endomorphism augmentation) and KN-FIND-b7e091 (which closes the
    endomorphism-images oracle). This proposal is dominated by them in
    evidential standing - H-ENDO-001 has an approved frozen protocol and
    KN-FIND-b7e091 is theorem-backed - and adds only the extension from
    endomorphism data to ideal and class-polynomial data.
  sota_delta: >-
    Zero speedup against every attack baseline; the ratio to rho is 1 by
    construction, since no algorithm is produced. Scope delta, quantitatively:
    extends the recorded no-congruence statement from the 3 (D_0 = -3) or 2
    (D_0 = -4) endomorphism-derived scalars covered by H-ENDO-001 to the full
    ideal data set {beta, f, (u,v), H_{D_0}, the Smith form of O/(pi-1)}, and
    produces one cost table with 11 discriminant rows whose final column is
    predicted to read "lambda, and nothing else" in every CM row and "nothing" in
    the generic row.

