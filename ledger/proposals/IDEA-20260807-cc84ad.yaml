idea:
  id: IDEA-20260807-cc84ad
  question_id: RQ-SQISIGN-001
  title: >-
    The second published curve: extend the SQIsign cancellation audit to
    E_aux, using the theorem-dead response-codomain arm as an exact,
    proof-backed negative control for the open E_aux arm
  class: measurement
  added: '2026-08-07'

  claim: >-
    IDEA-20260805-18a4d4 proves, by I*conj(I)=n(I)*O and triviality of
    scalars on ideal classes, that [conj(J_i)*J_j] is secret-independent for
    every pair of response codomains -- the response arm of any pairwise
    coincidence statistic is DEAD BY THEOREM, at every parameter, with no
    heuristic. That is not a reason to stop; it is a free, exact,
    theorem-backed negative control this corpus has never had. The live
    question is whether the identity extends to the SECOND published curve
    symbol, E_aux, which is not the codomain of J_i: it is the codomain of a
    complementary isogeny whose degree is a function of deg(phi_rsp) and
    hence of the signer's representative choice, not of the ideal class. The
    cancellation argument as written does not cover it. Under a batch of q
    signatures on a graph with n ~ p/12 vertices, the number of coincident
    pairs in each stream should be Poisson with mean C(q,2)/n -- at p=2^15
    (n~2730), q=200, mean ~ 7.29. The response arm MUST match this law and
    MUST be key-independent (the theorem); the E_aux arm either matches it
    too (cancellation extends empirically) or shows across-key dependence
    absent in the response arm (the cancellation does not extend). The
    paired design -- one arm proof-backed, one arm open, measured by the
    same code on the same batch -- is the entry's whole content.

  mechanism: >-
    A toy signer emits both curve symbols in each of S3-2's two arms
    (translation-shaped and simulator-shaped), consuming IDEA-20260805-bb4bf8's
    TV curve as an input to fix a commitment-walk length long enough that the
    commitment is demonstrably mixed -- otherwise a coincidence excess is
    just short-walk clustering and says nothing about cancellation. Batches
    of q in {100,200,400} run under K=8 keys with 3 replicates, and a
    pre-registered Poisson goodness-of-fit plus an across-key dispersion test
    at alpha=0.01 are applied separately to the response-codomain stream and
    the E_aux stream. Before any measurement, a one-hour algebraic kill-early
    is attempted: write the ideal J_i^aux explicitly and check whether
    conj(I_tau) pairs with I_tau there too; if the identity extends by
    algebra, the deliverable becomes a one-page proof rather than a
    3-CPU-hour experiment, strictly better and run first.

  novelty_status: unverified

  literature_context:
    - >-
      IN-CORPUS, DIRECT DEPENDENCY. IDEA-20260805-18a4d4 --
      multi_signature_transcript, secret connecting ideal cancels
      (conj(I_tau)*I_tau = scalar), class of conj(J_i)*J_j independent of
      secret, whole family of pairwise statistics dead before measurement.
      This entry is not that: 18a4d4 proves the cancellation for response
      codomains and uses it as a pre-compute falsifier that removes
      experiments; S3-7 asks whether the identity covers the second
      published curve symbol E_aux, where the ideal is not of the form
      conj(I_tau)*(...), turning 18a4d4's proven-dead arm into the negative
      control that makes the open E_aux arm's measurement admissible.
    - >-
      IN-CORPUS, DEPENDENCY (sequencing). S3-2 (this catalogue's n_bt entry)
      supplies the toy signer's two arms (translation-shaped,
      simulator-shaped) that this entry reuses without modification;
      DEDUP.md records S3-2 must run before S3-7.
    - >-
      IN-CORPUS, DEPENDENCY (commitment-walk length). IDEA-20260805-bb4bf8's
      TV curve computation is consumed as an INPUT to choose the commitment
      walk length; if that number is unavailable this entry cannot choose a
      defensible walk length and must be deferred rather than run at a
      guessed one.

  assumptions:
    - >-
      That the toy signer correctly implements the ideal-composition
      semantics that 18a4d4's identity is about; the response arm's
      key-independence gate exists precisely to test this assumption before
      any E_aux number is trusted.
    - >-
      That the coincidence partition's Poisson null (mean C(q,2)/n) is the
      correct null for a relabelling-invariant statistic on a mixed
      commitment walk of the declared length, which is why the commitment
      walk length is charged as a named dependency on bb4bf8 rather than
      guessed.
    - >-
      That E_aux's degree, being a function of deg(phi_rsp) and the signer's
      representative choice, is not itself secretly correlated with the
      connecting ideal in a way outside the cancellation argument's scope;
      this is exactly the open question the entry measures rather than
      assumes.

  predictions:
    - metric: response-arm coincident-pair count per batch (q,K,replicate)
      direction: different
      minimum_effect: >-
        Poisson(C(q,2)/n) exactly, with no key dependence at alpha=0.01;
        at p=2^15, n~2730, q=200, mean ~ 7.29. This is a theorem-derived
        exact number, not fitted.
    - metric: E_aux-arm coincident-pair count per batch (q,K,replicate)
      direction: different
      minimum_effect: >-
        Same Poisson law and same key-independence if the cancellation
        extends; a key-dependent deviation absent in the response arm if it
        does not. Either outcome is reported at equal emphasis.

  minimal_test:
    design: >-
      (1) Kill-early: attempt the algebraic extension of 18a4d4's
      cancellation to J_i^aux by hand; if it extends, stop here with a
      one-page proof. (2) Toy signer in both S3-2 arms at p in {2^13,2^15},
      consuming bb4bf8's TV-derived commitment-walk length. (3) Batches of
      q in {100,200,400} under K=8 keys, 3 replicates, pre-registered
      Poisson goodness-of-fit and across-key dispersion test at alpha=0.01,
      applied identically to both streams. (4) Known-answer gate, run
      first: the response arm must return key-independence within the
      pre-registered band -- if it does not, the toy signer is not
      implementing 18a4d4's semantics and NO E_aux NUMBER MAY BE REPORTED.
      Second rung: a planted signer whose E_aux is drawn from a
      key-dependent sub-region must be flagged at the pre-registered effect
      size.
    controls:
      - >-
        Theorem-backed negative control: the response-codomain stream, whose
        key-independence is proven rather than tested, run as the reference
        arm against which the open E_aux arm is compared with identical
        code on the identical batch.
      - >-
        Known-answer gate on the response arm itself, run first: failure
        here means the instrument is void (the theorem cannot be wrong; the
        toy signer can), and blocks any E_aux report.
      - >-
        Planted-deviation second rung: a signer whose E_aux is drawn from a
        deliberately key-dependent sub-region must be detected at the
        pre-registered effect size before an absence-of-effect finding is
        trusted.
    required_metrics:
      - per-stream, per-batch coincident-pair counts and Poisson goodness-of-fit statistic
      - per-stream across-key dispersion test statistic at alpha=0.01
      - kill-early algebraic verdict (extends / does not extend), recorded before any run

  falsification_conditions:
    - >-
      (F7a) The response arm shows across-key dispersion above the band in
      >= 1 of 3 replicates: instrument void (the theorem cannot be wrong;
      the toy signer can) -- no E_aux number may be reported.
    - >-
      (F7b) The E_aux arm matches the response arm within the band at both
      primes and all q: the cancellation extends empirically to the second
      curve, closing a second family of pair statistics -- the expected and
      still valuable outcome, converting 18a4d4's guidance from "look at
      representative-sensitive functionals" to "and the auxiliary curve is
      not one of them at toy scale".
    - >-
      (F7c) Both arms deviate from Poisson: the graph is too small or the
      walk is unmixed, and the measurement is scale-bound, not informative.

  confounders:
    - >-
      Short-walk clustering: if the commitment walk length is not
      demonstrably mixed (i.e. bb4bf8's TV number is stale or unavailable),
      a coincidence excess reflects walk length, not cancellation, which is
      why bb4bf8 is charged as a named dependency rather than a convenience.
    - >-
      The response arm's proof covers pairwise statistics on response
      codomains only; extending the negative-control discipline to
      higher-order (triple+) coincidence statistics is out of scope here.

  interpretation_limits:
    - >-
      Ceiling: toy. The response arm's key-independence is a theorem and is
      not being tested; the E_aux arm's result is a toy-scale statement
      about a toy signer, bounded by CEILING-S3(ii). High risk band: the
      algebraic kill-early may close the entry in an hour, and its most
      likely measured outcome (per this catalogue entry's own assessment) is
      a second negative.
    - >-
      Higher-dimensional structure (OL-9) enters only as an analysis
      instrument explaining why E_aux's degree is representative-dependent;
      no dimension-2-or-above computation is performed by this entry.
    - >-
      No statement about EUF-CMA, key recovery, or endomorphism-ring
      hardness follows from any outcome here; this entry costs none of
      GOAL-SSI-001's budget.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The toy signer's ideal composition faithfully implements the
        algebraic objects 18a4d4's cancellation theorem is about, so that a
        failure of the response arm's key-independence gate is attributable
        to the instrument and not to the theorem.
      rigorous_support: >-
        18a4d4's proof of I*conj(I)=n(I)*O and triviality of scalars on
        ideal classes, cited in full rather than re-derived here.
      validation_plan: >-
        Response-arm known-answer gate, run before any E_aux number is read,
        per the minimal test's step (4).

  estimated_cost:
    implementation: medium
    compute: >-
      400 x 8 x 3 x 2 x 2 ~= 4*10^4 signings at p=2^15 (n~2730 vertices),
      each O(walk length) path work -- charged as <= 3 CPU-hours, hard cap.
      Memory O(n+q), negligible. The commitment walk length is charged and
      named as a dependency on bb4bf8's TV computation, not a saving; if
      that number is unavailable the entry must be deferred rather than run
      at a guessed length.
  recommended_priority: medium

  review_refs: []
  disposition: proposed
  recorded_by: coordinator
  recorded_at: '2026-08-07'
