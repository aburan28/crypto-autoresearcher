idea:
  id: IDEA-20260820-9ad2a8
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Renyi-tail theorem from transcript information to certified ideal lists
  class: proof_architecture
  claim: >-
    A pre-registered tail bound on candidate-conditioned transcript scores may
    yield a finite-q, coverage-certified bound on an ideal list, but only if the
    theorem exposes candidate multiplicity, score dependence, data complexity,
    and the cost of realizing each candidate score. No such theorem or gain is claimed here.
  mechanism: >-
    Let U(pk) be a declared finite set of candidate ideals that reproduce the
    public curve. Define a candidate-conditioned log-score and estimate or prove
    its order-s Renyi/Chernoff tail against the genuine simulator. Develop a
    list-decoding theorem: after q transcripts, retain candidates within a
    registered likelihood margin and upper-bound both true-ideal exclusion and
    list size using a simultaneous tail inequality. The theorem must carry the
    largest observational collision class and transcript dependence, and the
    constructive corollary must output ideals plus reproduction witnesses. The
    end-to-end corollary then substitutes the finite-q list bound into a fully
    charged KN-TECH-058/057 comparison instead of treating mutual information
    or distinguishing advantage as free key recovery.
  novelty_status: unverified
  status: proposed
  source_refs:
    - id: RQ-SQISIGN-001
      provenance: internal
      use: Supplies the genuine-simulator, conversion-choice, q-scaling, and ideal-output requirements.
    - id: IDEA-20260808-287361
      provenance: internal
      use: Exact-posterior predecessor; used only to define the non-duplication boundary.
    - id: IDEA-20260808-19876e
      provenance: internal
      use: Constant-distinguisher ceiling; the proposed theorem must cross the explicit list-decoding bridge.
    - id: KN-TECH-058
      provenance: internal
      use: >-
        Unconditional Fp2 p^(1/2)(log p)^O(1) time with polynomial memory;
        conditional p^(1/3+o(1)) time and memory under Heuristic 1, hidden
        superpolynomial overhead, no concrete-cost conclusion, unverified reductions,
        and a binding GRH boundary.
    - id: KN-TECH-057
      provenance: internal
      use: Requires fully charged rows and keeps the conditional Fp p^(1/4) mixing row separate.
    - id: KN-LIT-1248
      provenance: kb
      use: Unreviewed ideal-to-isogeny pointer only; not support for novelty or the theorem.
  predictions:
    - id: P1
      statement: >-
        If every false candidate has Chernoff information at least C(p) against
        the true candidate and the declared dependence penalty is kappa(q), then
        a union-bound target is E[|L_q|] <= 1+(N-1)exp(-q*C(p)+kappa(q)).
    - id: P2
      statement: >-
        A sufficient sample target has the explicit scale
        q >= (log N+log(1/delta)+kappa(q))/C(p); if C(p) decays too quickly,
        data or score cost removes any exponent benefit.
    - id: P3
      statement: >-
        In the genuine-simulator null C(p)=0 within uncertainty and the theorem
        returns no nontrivial list shrinkage.
    - id: P4
      statement: A planted tilt with known C recovers the registered finite-q tail and list-size curve.
  controls:
    genuine_simulator_null: >-
      Use genuine simulated signatures with matched keys, messages, q, retry
      behavior, and encodings; estimate the same tail statistic and require the
      list theorem to become vacuous as C approaches zero.
    planted_positive_control: >-
      Exponentially tilt one candidate's score distribution by a known parameter,
      compute its analytic Chernoff information, and require empirical exclusion
      and list tails to cover the analytic curve.
    nearby_object_control: >-
      Apply the theorem to score labels permuted within public-curve-equivalent
      collision classes; it must retain the collision multiplicity.
  falsification_conditions:
    - The simultaneous tail bound fails under the declared transcript dependence model.
    - The theorem suppresses observational collision multiplicity or assumes candidate-conditioned sampling unavailable to an attacker.
    - Required q, score evaluation, or list verification is asymptotically or concretely no better than the charged baseline.
    - The true ideal cannot be included with probability at least 1-delta while retaining nontrivial shrinkage.
    - The constructive corollary does not output an ideal reproducing the public curve.
  confounders:
    - Renyi estimates can be dominated by rare numerical outliers.
    - Signatures may be dependent through state, retries, or adaptive messages.
    - Candidate score access may secretly require the unknown ideal.
    - Average pairwise divergence can hide a large indistinguishable collision class.
  interpretation_limits:
    - This is a proposed conditional theorem architecture, not a theorem or observed leakage.
    - A nonzero divergence does not imply efficient candidate generation, scoring, or verification.
    - Any hard-problem interpretation belongs to GOAL-SSI-001 and requires separate evidence.
    - KN-TECH-058 conditional conditions, hidden overhead, reduction status, and GRH boundary remain attached.
  heuristic_assumptions:
    - id: H1
      statement: A uniform lower tail bound C(p) holds over all false candidates outside declared collision classes.
      falsification: A false-candidate family has asymptotically smaller or zero score separation.
    - id: H2
      statement: Transcript dependence is upper-bounded by the explicit penalty kappa(q).
      falsification: Measured or proved dependence exceeds kappa(q).
  target_complexity:
    baseline: Preserve the three distinct KN-TECH-058/057 comparison rows and all conditions.
    list_bound: 1+(N(p)-1)*exp(-q*C(p)+kappa(q)) with coverage at least 1-delta
    data_threshold: (log N(p)+log(1/delta)+kappa(q))/C(p)
    exponent_claim: none
  cost_model:
    time: T_generate_U(p)+q*N_scored(p)*T_score(p)+T_list(p,q)+T_witness(p,q)
    memory: M_candidates(p)+M_tail_estimator(p,q)+M_list_and_witnesses(p,q)
    data_queries: q real signatures plus separately counted calibration, tail-estimation, and validation samples
    preprocessing: Candidate-universe construction, score calibration, collision partitioning, and tail-bound fitting
    oracle: Candidate-conditioned or simulator sampling is counted and declared unavailable if it needs the secret.
    verification: Check the tail certificate and independently reproduce the public curve for every retained ideal.
  proof_search_map:
    exact_baseline_reproduction:
      plan: Derive the charged baseline rows before substituting the list-size formula.
      pass_condition: No oracle, preprocessing, success, memory, or hidden-overhead term disappears.
    observation_collision_search:
      plan: Maximize the set of candidate ideals inducing the same score law and carry its size B(p) into the theorem.
      pass_condition: The theorem lower-bounds |L| by B(p) rather than claiming singleton recovery.
    quantifier_order_statement:
      plan: State uniformity over pk, candidates, messages, q, calibration randomness, and transcript randomness before fixing delta.
      pass_condition: The claimed coverage matches the attacker's adaptive or nonadaptive oracle model.
    method_ceiling:
      plan: Set C(p)=0 and separately let B(p) grow; solve the strongest list bound the method can honestly return.
      pass_condition: Neither limit yields a hard-problem speedup.
    nearby_object_control:
      plan: Prove the same inequality for permuted candidate labels and compare the retained collision term.
      pass_condition: The theorem does not manufacture localization from a marginal distinguisher.
  nearest_neighbors:
    - id: IDEA-20260808-287361
      discriminator: Converts candidate-conditioned tails into a finite-q list-size and coverage theorem, rather than only computing H(I|pk,T^q).
    - id: IDEA-20260808-19876e
      discriminator: Makes the missing tail-to-list bridge and its candidate scoring cost explicit.
    - id: KN-TECH-058
      discriminator: Treats the current rows as charged comparators, not as evidence that transcript information exists.
  dominated_by: n/a (no result claimed)
  sota_delta: >-
    Proposed quantitative test only: Delta_list=(q*C(p)-kappa(q))/log(p),
    capped by the initial candidate exponent and reduced by log B(p)/log p;
    Delta_e2e is measured only after six-axis costs. Current measured delta is 0.
  priority: high
  cost: low_to_medium
  prior: 0.14
  provenance: agent_generated_under_TASK-20260820-a3c65a
