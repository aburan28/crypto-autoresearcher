idea:
  id: IDEA-20261007-20ae4e
  added: '2026-10-07'
  status: proposed
  approved_by: null
  question_id: RQ-SSIQ-9702af
  title: >-
    Kernel-polynomial degree sum versus distinct codomain j on
    y^2 = x^3 + x + 6 over F_53
  class: measurement
  claim: >-
    Toy instance only, prediction fixed before any run. Let E be
    y^2 = x^3 + x + 6 over F_53. Let L be the set of separable
    isogenies of prime degree l in {3, 5, 7} with cyclic kernel from
    E, up to post-composition by an isomorphism. For each element of
    L let d be the degree of the monic polynomial whose roots are the
    distinct x-coordinates of the nonzero kernel points. Let J be the
    number of distinct codomain j-invariants. Let S be the sum of the
    degrees d. Prediction: S is at least 4 times max(1, J). A sum
    that is at most 3 times max(1, J), including the empty list
    S = 0, is a negative. This claim does not say that memory or the
    list exponent moves. The rho exponent stays 1/2 and the
    conditional isogeny exponent stays 1/3.
  mechanism: >-
    Lever F3 stores a list. The kernel polynomial is a heavier record
    than the codomain j-invariant. The ratio S / max(1, J) asks
    whether those heavier records collide onto few j-invariants or
    stay spread out. Representation: the kernel x-polynomial together
    with the codomain j. Operation set Sigma is the set of cyclic
    l-isogenies for l in {3, 5, 7}. Trichotomy class: partial-action.
    This is not a count of distinct codomains divided by the kernel
    count, and it is not the p = 47 smooth-degree list. Families F1,
    F2, F4, F5, F6, and F7 are not the lens.
  novelty_status: unverified
  citations:
    - ref: KR-IC-46d822
      provenance: internal
      claim: >-
        Gaudry decomposition for fixed n is a runtime, not a ratio of
        kernel degree to distinct j.
      verified_by: >-
        coordinator session 2026-10-07 opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic discrete logarithms need Omega(sqrt(N)) group
        operations.
      verified_by: >-
        coordinator session 2026-10-07 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
  assumptions:
    - >-
      4*(1^3)+27*(6^2) = 4+972 = 976. 976 modulo 53 is 22, not 0, so
      E is nonsingular. This session computed that residue and did
      not enumerate isogenies.
    - >-
      For odd prime l the degree d equals (l-1)/2 when the kernel is
      cyclic. The test uses that degree and does not substitute l.
    - An empty L has S = 0 and J = 0, so the comparison is 0 against 4, which is a negative.
  proof_search_map:
    not_applicable_reason: >-
      This is one pre-registered ratio at one prime, not a memory
      exponent.
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
  predictions:
    - metric: S compared with 4 times max(1, J)
      direction: higher
      minimum_effect: S at least 4 times max(1, J)
  minimal_test:
    design: >-
      Enumerate cyclic kernels of order 3, 5, and 7 from E, write
      each kernel x-polynomial, apply Vélu, and collect the distinct
      codomain j-invariants. Compute S and J. Do not replace the
      enumeration by the bound l+1.
    controls:
      - >-
        The same sum on y^2 = x^3 + 2x + 3 over F_53. The null is
        recorded and is not the success gate.
      - >-
        A kernel polynomial whose degree is not (l-1)/2 is an
        instrument failure.
    required_metrics:
      - S
      - J
      - S compared with 4 times max(1, J)
  falsification_conditions:
    - S is at most 3 times max(1, J).
    - A timeout or an incomplete kernel enumeration is infrastructure, not a falsification and not support.
  confounders:
    - Counting both directions of one isogeny doubles S. The test counts outgoing isogenies only.
  interpretation_limits:
    - >-
      A ratio of at least 4 at p = 53 does not change the memory
      exponent p^{1/3+o(1)}.
    - A negative closes only this equation and these three degrees.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The kernel x-polynomials of these short isogenies pile onto
        few codomain j-invariants, as if several kernels landed on
        one isomorphism class, enough that the degree sum is at least
        four times the number of distinct j-invariants.
      rigorous_support: >-
        There are at most l+1 cyclic subgroups of order l. That bound
        does not force the ratio. The pile-up is the unproved
        imitation.
      validation_plan: >-
        The minimal test enumerates L in full at p = 53 and compares
        S with 4 times max(1, J).
  target_complexity:
    time_exponent: p^{1/3+o(1)} conditional, unchanged
    memory_exponent: p^{1/3+o(1)} conditional, unchanged
    best_known: >-
      p^{1/2} times (log p) to a constant power, and p^{1/3+o(1)}
      time and memory conditional on the archived smoothness heuristic
    hidden_overhead: >-
      No new o(1) is claimed. The incumbent o(1) still hides the
      smoothness overhead named in the target profile.
    tradeoff_note: >-
      Storing a kernel polynomial of degree (l-1)/2 beside j is a
      constant-factor memory difference at these three primes.
      Exponent delta is 0.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Opened KR-RHO-13bf67 and KR-IC-46d822. Neither states this degree
    sum. KR-RHO-13bf67 dominates any exponent reading. The p = 47
    proposals IDEA-20261006-065073 and IDEA-20261006-ba16ab measure
    different ratios on a different curve and are not this claim.
  sota_delta: >-
    Exponent difference 0 against both p^{1/2} and p^{1/3+o(1)}. The
    counted delta is a degree-sum threshold of 4 at p = 53, against
    KR-IC-46d822's exponent 2-2/n, which is a different algorithm.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/index-calculus
    rows_checked:
      - KR-IC-46d822
      - KR-IC-b0fcda
      - KR-RHO-13bf67
      - KR-RHO-5b1c0a
      - KR-RHO-037e22
    nearest:
      - ref: KR-IC-46d822
        provenance: internal
        relation: adjacent
        delta: >-
          That row is a decomposition runtime. This proposal measures
          one degree sum at p = 53 and claims no change to 2-2/n.
      - ref: KR-RHO-037e22
        provenance: internal
        relation: orthogonal
        delta: >-
          That row is a sqrt(2m) saving on binary Koblitz rho, about
          2^60.9 iterations rather than 2^64.8 on ECC2K-130. This
          proposal does not walk a rho class.
    searched:
      corpus_grep:
        - ledger/proposals on origin/main for x^3 + x + 6
        - IDEA-20261006-065073 and IDEA-20261006-ba16ab on p = 47
      web: []
      blocked: []
