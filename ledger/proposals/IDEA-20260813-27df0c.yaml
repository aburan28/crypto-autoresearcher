idea:
  id: IDEA-20260813-27df0c
  date: '2026-08-13'
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SDITH-001
  goal_id: GOAL-SDITH-001
  title: Certified fully charged plain-SD and d-split ISD Pareto baseline
  class: control
  claim: >-
    Before evaluating a hypercube or d-split mechanism, reproduce a matched
    plain-random-SD ISD baseline and its d-split specialization after jointly
    optimizing time, peak memory, preprocessing, data, verification, and
    success amplification. This proposal makes no speedup claim; it defines the
    first mandatory comparison artifact and is falsified as a usable control if
    independent implementations do not agree on its charged Pareto frontier.
  mechanism: >-
    Apparent split-aware gains can be created by freezing an ISD parameter that
    should be reoptimized, omitting table memory, charging preprocessing to one
    side only, or comparing single-target online work with amortized work. A
    common cost functional over the same code, weight, target count, success
    probability, memory cap, and preprocessing policy removes those degrees of
    freedom. The output is a family of dominance-checked baseline rows, not a
    cryptanalytic result.
  why_not_a_renamed_known_approach: >-
    IDEA-20260805-43d6df is the direct predecessor and already builds a
    memory-charged, reoptimized ISD baseline, warning that naive accounting can
    shift 6 to 10 bits. This proposal is an independent certified reproduction
    required by the frozen RQ and extends the comparison interface to explicit
    per-key versus amortized preprocessing, target count, data, oracle access,
    verification, and a machine-checkable dominance certificate. It does not
    assert novelty over 43d6df. IDEA-20260801-017 is a toy cost measurement;
    7504c6 varies d; cbd93d bounds admissibility; and d873bc studies the separate
    MPCitH-forgery crossover.
  predictions:
    - metric: independently reproduced optimal charged work bits at each memory cap
      direction: different
      minimum_effect: >-
        Two independent evaluators must agree within 0.25 work bits or expose a
        named accounting or optimization discrepancy.
    - metric: naive-versus-fully-charged optimum gap
      direction: higher
      minimum_effect: >-
        Report the gap even if zero; no inherited 6 to 10 bit shift is assumed
        without reproducing the exact instance.
    - metric: dominance certificate coverage
      direction: higher
      minimum_effect: 100 percent of retained rows checked across time, memory, data, preprocessing, oracle, and verification.
  minimal_test:
    design: >-
      Specify, without executing here, two independent exact or interval cost
      evaluators over one frozen parameter capsule. Enumerate or certifiably
      optimize all source-defined ISD parameters for matched plain SD and
      d-split instances under identical memory caps, target counts,
      preprocessing-amortization rules, and success thresholds. Compare the
      resulting nondominated frontiers and retain full optimization traces.
    controls:
      - Reproduce the exact IDEA-20260805-43d6df parameter slice before adding new cost rows.
      - Plain random-SD control with identical code dimensions, weight, target count, and success requirement.
      - Infinite-memory and zero-preprocessing boundary checks where the formulas specialize cleanly.
      - Brute-force exact-cost checks on source-valid toy instances.
      - Planted positive control that omits one table and must be detected as undercharged.
    required_metrics:
      - Per-attempt cost and inverse success probability separately.
      - Peak and cumulative memory, table occupancy, and memory-access cost.
      - Per-key and global preprocessing, amortization denominator, and target count.
      - Data, oracle or signing-query, decoding, and verification costs.
      - Optimization trace, interval error, and dominance certificate.
  controls:
    - matched_plain_random_sd
    - exact_43d6df_slice_reproduction
    - toy_bruteforce_cost_check
    - planted_omitted_table_positive_control
  confounders:
    - Comparing different success probabilities or security instances.
    - Reoptimizing only the proposed method.
    - Treating table entries as free or charging nominal rather than peak memory.
    - Amortizing preprocessing over unavailable targets.
    - Omitting verification, failed attempts, or memory-access overhead.
    - Confusing MPCitH forgery work with the SD subproblem baseline.
  falsification_conditions:
    - Independent evaluators disagree by more than 0.25 work bits without a resolved accounting cause.
    - The retained frontier contains a row dominated in any declared target regime.
    - The planted omitted-table control is not detected.
    - Plain and d-split instances are not matched on dimensions, weight, target count, and success probability.
  interpretation_limits:
    - status proposed and novelty unverified; this record has no scientific effect.
    - A baseline artifact is not evidence that d-split or hypercube structure helps or does not help.
    - Toy agreement does not validate production formulas outside the tested parameter capsule.
    - Any later claim must cite the exact retained baseline row rather than a headline work factor.
  assumptions:
    - The primary scheme and RQ parameter capsule provide a matched plain-SD embedding.
    - Every admissible preprocessing and target-reuse policy can be stated before optimization.
    - Cost formulas expose success probability, memory, and verification rather than only operations per attempt.
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >-
      Establish one auditable cost functional and optimization domain shared by
      plain SD, d-split SD, and all later hypercube mechanisms.
    baseline_embedding:
      parameter_slice: >-
        Exact IDEA-20260805-43d6df parameter slice plus the RQ-frozen matched
        plain-SD and d-split instances; if the slice is unavailable, the task
        remains blocked rather than substituting a new one.
      reproduction_check: >-
        Reproduce per-attempt operations, inverse success, peak memory,
        preprocessing, and optimal parameter choices within 0.25 work bits.
    observation_collision:
      observable: Reported total work bits at a declared memory cap.
      distinct_preimage_search: >-
        Search for different cost decompositions or parameter settings with the
        same headline work bits but different memory, preprocessing, data, or
        verification, demonstrating why the headline alone is insufficient.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: Six-row cost vector plus success probability and target count.
        predicted_gain: Prevents scalar work factors from hiding dominated resource profiles.
      - transform: specialization_pack
        proposed_object: Single-target, multi-target, zero-preprocessing, and capped-memory baseline slices.
        predicted_gain: Makes amortization and memory assumptions explicit and comparable.
    quantifier_order: >-
      Fix the security instance, target count, memory cap, preprocessing policy,
      and success threshold first; then optimize every compared algorithm over
      its allowed parameters. Do not choose the cost regime after seeing which
      method wins.
    method_ceiling:
      strongest_certifiable_claim: >-
        Equality or a bounded discrepancy between independent charged baseline
        evaluators on the frozen parameter capsule.
      nearby_object_control: >-
        An intentionally undercharged copy that omits one table or amortizes
        over an unavailable target count; the certificate must reject it.
    proof_obligations:
      - claim: Reproduce IDEA-20260805-43d6df exactly on its declared slice.
        responsibility: baseline
      - claim: Match plain and split instances on all security-relevant parameters.
        responsibility: interface
      - claim: Prove the optimization domain covers every allowed ISD parameter choice.
        responsibility: correctness
      - claim: Separate per-attempt work from inverse success probability.
        responsibility: success_probability
      - claim: Charge peak memory, preprocessing, data, oracle, and verification.
        responsibility: memory
      - claim: Certify that no retained row is dominated in its declared regime.
        responsibility: strictness
    not_applicable_reason: null
  target_complexity:
    time_exponent: n/a; baseline reproduction, no improvement claimed
    memory_exponent: n/a; full memory frontier to be computed, not assumed
    best_known: >-
      The binding internal comparator is the memory-charged and reoptimized ISD
      baseline of IDEA-20260805-43d6df, matched to plain random SD. Its numerical
      rows must be reproduced rather than copied from retrieval summaries.
    hidden_overhead: >-
      Table construction and access, parameter search, preprocessing,
      amortization, failed attempts, data acquisition, and verification are all
      explicit; no o(1) or free-memory placeholder is allowed.
    tradeoff_note: >-
      Report the entire nondominated time-memory-preprocessing frontier. A lower
      online time with higher preprocessing is not a win unless it dominates in
      a preregistered target-count regime.
  sota_delta:
    claim: Baseline control only; current net improvement is exactly 0 bits and 0 exponent.
    current_net_work_delta_bits: 0.0
    current_time_exponent_delta: 0.0
    current_memory_exponent_delta: 0.0
    agreement_tolerance_work_bits: 0.25
    pareto_rows:
      time: Per-attempt work multiplied by inverse success and including memory access.
      memory: Peak live bytes and table occupancy, not nominal element count alone.
      data: Target and transcript counts are fixed and charged.
      preprocessing: Global and per-key work are separated with an explicit amortization denominator.
      oracle: Every oracle or signing-query call is named and charged; none is implicit.
      verification: Candidate checking and independent cost-certificate validation are charged.
    frontier_check: >-
      All six rows are checked jointly. The proposal is a prerequisite control,
      so it is retained despite reproducing 43d6df rather than claiming a new
      scientific Pareto improvement.
