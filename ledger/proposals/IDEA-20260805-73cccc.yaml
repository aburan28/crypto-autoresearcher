idea:
  id: IDEA-20260805-73cccc
  question_id: RQ-RSA-afe33c
  goal_id: GOAL-RSA-001
  added: '2026-08-05'
  title: >-
    NFS is the nearby object where the conclusion is known false: charge the
    description, membership, relation and descent costs of the number field
    sieve's own factor base, and make KN-OPEN-020's universal no-go say why it
    does not also refute the algorithm that works
  class: control

  claim: >-
    KN-OPEN-020 asks whether EVERY algebraically described factor base fails to
    give a subexponential index calculus, with description, membership,
    relation, descent, time and memory all charged. The number field sieve is a
    factor base that is algebraically described, whose membership predicate is
    polynomial time, and that DOES give a subexponential index calculus. Under
    inventor-protocol section 8 audit 4 it is therefore the required
    nearby-object control, and no record of that control exists anywhere in
    this corpus. Charging NFS's factor base under KN-OPEN-020's own cost ledger
    yields three separating conditions that any universal no-go must contain -
    (S1) the description is by HEIGHT, not by DEGREE, so Bezout does not apply
    and the factor base is superpolynomially large with a constant-length
    description; (S2) the factor base lives in AUXILIARY rings and reaches the
    target only through ring homomorphisms, so no bounded-arity sumset image
    bound of the form B^m constrains it; (S3) the relation event is
    SUBEXPONENTIALLY dense (u^{-u} with u growing like a cube root) rather than
    exponentially sparse (B^m/N). Producing that list converts KN-OPEN-020
    from an unverified universal question into a sharpened one with a named
    boundary, at zero compute, and it is a factoring-side deliverable that this
    goal owns. NO ECDLP CLAIM IS MADE OR IMPLIED and no factorization is
    attempted.

  object_first_candidate:
    tracked_object: >-
      THE DESCRIPTION LEDGER OF A FACTOR BASE: the four-tuple (description
      length in bits, description degree, membership-decision cost, relation
      -event density) carried through an index-calculus pipeline from the
      definition of the factor base, through membership testing, through
      relation collection, into the descent, with each entry charged. The
      object is chosen because KN-OPEN-020 already names exactly these charges
      and then never instantiates them on the one algorithm in the family that
      works.
    established_families_off_limits: >-
      Off-limits as the primary lens: every attempt to BUILD a better factor
      base, for elliptic curves or for anything else - summation-polynomial /
      Semaev decomposition, Gaudry-Diem descent, sumset and arithmetic
      -progression supports, Weil descent and cover attacks, xedni-style
      lifting, and any structured-support construction. Also off-limits: any
      attempt to break RSA. This proposal builds nothing and attacks nothing.
      It audits the HYPOTHESES of a stated no-go against the one object those
      hypotheses must exclude, which is the single move that the
      "declare the family off-limits" rule permits and that no record here has
      made.
    newness_score: >-
      The individual facts - that NFS's factor base is defined by a norm bound,
      that it is subexponentially large, that smoothness probability is
      u^{-u} - are textbook and no novelty is claimed for any of them. What is
      new to this corpus is their assembly into the CONTROL that KN-OPEN-020's
      own framing requires. The ANGLE-BRIEF records the gap in one sentence:
      "KN-OPEN-020's bounded-degree factor-base no-go must explain why it does
      not also refute NFS, whose factor base is algebraically described and
      works subexponentially. No record of this control exists." That the gap
      was noticed and never filled is a statement about this corpus and is all
      that is claimed.
    testability_score: >-
      High, and unusually so for a structural argument, because the four
      charges are each a number or an explicit formula rather than a
      judgement: description length in bits, description degree, membership
      cost, and relation density as an L-notation exponent. Each is derivable
      on paper and each has a pre-declared value stated below. The weak entry
      is the CLAIM OF COMPLETENESS - that (S1), (S2), (S3) are the ONLY
      separating conditions - which is not testable and is explicitly not
      claimed.
    survival_score: >-
      The object survives the whole pipeline for NFS and dies, informatively,
      for elliptic-curve index calculus at exactly (S3): the relation density
      is where the two objects part company, and it parts by an entire
      functional form (subexponential versus exponential decay), not by a
      constant. Localizing the divergence to one of the four charges is the
      deliverable.

  mechanism: >-
    DERIVED HERE. Nothing below is quoted from a source; the two in-corpus
    entries it engages, KN-OPEN-020 and KN-OPEN-006, are read and quoted where
    quoted.

    WHAT KN-OPEN-020 HOLDS, IN ITS OWN WORDS. It records that
    `ideas/artifacts/IDEA-20260801-021/bounded_degree_factor_base_theorem.md`
    "gives a derivation-level obstruction for one nonzero bounded-degree plane
    polynomial predicate, and its algebraic-degree generalization to any proper
    locus with explicit finite intersection degree Delta", that "Bezout bounds
    the factor base by 3d (or Delta)", that "tuple-image counting bounds the
    reachable target set by B^m", and that the descent interface has "the
    expected charged-trial lower bound Omega(N/B^m)". It then states why the
    universal statement remains open, listing high-degree interpolation
    descriptions, multiple constructible predicates, target-dependent
    descriptions, and implicit membership algorithms as uncovered. NOTE WHAT IS
    ABSENT FROM THAT LIST: a factor base that is not a locus at all. THE
    ARTIFACT FILE ITSELF WAS NOT READ FOR THIS PROPOSAL - only KN-OPEN-020's
    summary of it - and reading it is Stage 1 of the paired test.

    THE CONTROL OBJECT, CHARGED. In the general number field sieve for n, pick
    f of degree d_poly with root m modulo n, work in K = Q[x]/(f) with ring of
    integers O_K, and take the factor base
      FB = { rational primes q <= B } union { prime ideals p of O_K : N(p) <= B }.
    Now charge it under KN-OPEN-020's own ledger.
      (C1) DESCRIPTION LENGTH. The definition above is a constant-length string
      plus the bits of B and of f: O(log B + size(f)) bits. It does not grow
      with the factor base.
      (C2) DESCRIPTION DEGREE. UNDEFINED, and that is the finding. The set is
      not a subvariety of any fixed ambient space cut out by polynomials of
      bounded degree; it is a set of PLACES selected by an archimedean size
      condition on the norm. There is no Zariski-closed locus whose points it
      is. Bezout's theorem has nothing to act on.
      (C3) MEMBERSHIP COST. Polynomial: a prime ideal of degree one is the pair
      (q, r) with f(r) = 0 mod q, and membership is the comparison q <= B.
      Deciding whether a given norm is B-smooth is the only expensive part and
      it is charged as part of relation collection, not membership.
      (C4) CARDINALITY. |FB| = 2B/log B (1 + o(1)) by the prime ideal theorem
      counting degree-one primes, which at the standard NFS parameterization
      B = L[1/3, (8/9)^(1/3)] is superpolynomial in log n and subexponential.
      (C5) RELATION EVENT DENSITY. A pair (a, b) yields a relation when both
      norms are B-smooth, of probability L[1/3, -c] for a positive constant c
      under the standard heuristic. Subexponentially small; not
      exponentially small.

    S1 - HEIGHT IS NOT DEGREE, AND THE NO-GO CHARGES ONLY DEGREE. Put (C1) and
    (C2) together. The bounded-degree theorem's content, restated in resource
    terms, is: A FACTOR BASE CUT OUT BY A LOW-DEGREE POLYNOMIAL IS SMALL, with
    |FB| <= 3d or Delta by Bezout. NFS's factor base has a SHORT DESCRIPTION
    (C1) but no DEGREE (C2), and its cardinality (C4) is superpolynomial.
    Therefore description LENGTH and description DEGREE are different
    resources, and the no-go charges only the second. FORCED NUMBER,
    conditional on the relayed RSA-250 transcription: a post-merge matrix of
    4.05e8 rows implies a factor base of that order, so for a Bezout-type
    description to reach it one would need d >= 1.35e8, while the actual
    description is a few dozen bits. THE GAP BETWEEN THE TWO RESOURCE MEASURES
    IS EIGHT ORDERS OF MAGNITUDE ON A REAL COMPUTATION. Any universal no-go
    must either charge description length instead of degree - in which case it
    must explain how NFS escapes - or restrict its scope to loci, in which case
    it is not universal over algebraic descriptions.

    S2 - THE FACTOR BASE IS NOT IN THE TARGET GROUP, SO B^m DOES NOT BOUND
    ANYTHING. In elliptic-curve index calculus the factor base is a subset of
    E(F_p), the target group itself, so an arity-m relation is a sum of m
    factor-base points and the reachable set has size at most B^m - which is
    the tuple-image counting bound KN-OPEN-020 records, and it is what forces
    the descent trial count Omega(N/B^m). In NFS the factor base lives in the
    multiplicative monoids of TWO auxiliary rings, Z and O_K. Relations are
    multiplicative identities in those rings; the target enters only through
    the two ring homomorphisms to Z/nZ that send x to m. Consequently the
    relation module is a lattice of rank |FB| generated by an unbounded supply
    of (a, b) pairs, and there is no arity m at all: a relation is not a sum of
    m target-group elements, so no B^m image bound applies and the
    Omega(N/B^m) descent-trial lower bound has no counterpart. THE STRUCTURAL
    INGREDIENT NFS HAS AND THE ELLIPTIC-CURVE SETTING LACKS IS AN AUXILIARY
    MULTIPLICATIVE STRUCTURE OF UNBOUNDED RANK EQUIPPED WITH A HOMOMORPHISM TO
    THE TARGET. Stated that way it is a positive requirement on any future
    elliptic-curve factor base, which is forward guidance rather than a
    closure.

    S3 - SUBEXPONENTIAL VERSUS EXPONENTIAL SPARSITY, WHICH IS WHERE THE
    OBJECTS ACTUALLY DIVERGE. Compare (C5) with the elliptic-curve descent
    probability B^m/N. Fix the arity m. The elliptic-curve event has
    probability exp(-(log N)(1 - m beta')) for B = N^{beta'}, i.e. it decays
    EXPONENTIALLY in log N unless B is itself a positive power of N, which
    makes the linear algebra exponential. The NFS event decays like u^{-u}
    where u grows only like (log n / log log n)^(1/3), so its logarithm is
    (log n)^(1/3)(log log n)^(2/3) rather than log n - a cube root instead of
    a first power. THAT CUBE ROOT IS THE ENTIRE REASON NFS IS L[1/3] AND
    GENERIC BOUNDED-ARITY DESCENT IS NOT, and it is a property of the
    SMOOTHNESS EVENT ON INTEGERS, not of the factor base's description. A
    universal no-go phrased about descriptions is therefore aiming at the wrong
    resource: the load-bearing quantity is the density of the relation event,
    and the description only matters through how it constrains that density.

    THE OBSERVATION COLLISION, WHICH IS THE FALSIFIER. Take as observable the
    predicate that KN-OPEN-020's universal statement quantifies over:
    "the factor base is algebraically described and its membership predicate
    is decidable in polynomial time". NFS's factor base satisfies it and
    yields L[1/3]. A hypothetical bounded-degree elliptic-curve factor base
    satisfies it and (per the derivation-level obstruction) does not. TWO
    GROUND-TRUTH OBJECTS, ONE ON EACH SIDE OF THE CLAIMED CONCLUSION, SHARING
    THE OBSERVABLE. Under inventor-protocol section 8 audit 2 that is a direct
    falsifier of identifiability unless an additional condition separates them,
    and S1, S2, S3 are three candidate separating conditions offered for
    attack. The collision is exhibited, not conjectured, and it costs nothing.

    WHAT THIS DOES NOT DO. It does not refute the bounded-degree theorem, which
    is scoped to loci and is presumably correct in its scope. It does not
    supply an elliptic-curve factor base, and it does not claim one exists. It
    does not close KN-OPEN-020. It removes one reading of KN-OPEN-020 - the
    reading in which "algebraically described" is taken at face value - and it
    hands back a sharpened question with the boundary named, which is what
    inventor-protocol section 4 requires of anything calling itself a closure
    and which this proposal deliberately stops short of claiming.

  novelty_status: unverified

  literature_context:
    - >-
      KN-OPEN-020, "Universal algebraic-factor-base no-go for prime-field index
      calculus", READ IN FULL from the in-corpus entry. Its status is `open`
      and its confidence is `unverified`. Every quotation above is verbatim
      from it. Its source artifact
      `ideas/artifacts/IDEA-20260801-021/bounded_degree_factor_base_theorem.md`
      WAS NOT READ and reading it is a stage of the paired test; the
      characterization of the theorem above is therefore
      KN-OPEN-020's summary at second hand and may misdescribe the theorem.
    - >-
      KN-OPEN-006, READ IN FULL. It is the linear-algebra-side counterpart -
      whether designed arithmetic-progression relation supports give a
      low-displacement-rank matrix whose structured solve beats generic sparse
      Wiedemann "net of the relation-probability penalty". Its framing is the
      same trade this proposal isolates at S3: a constraint on the factor base
      buys structure and costs relation density. The ANGLE-BRIEF calls the
      KN-OPEN-006 / KN-OPEN-025 pair "the single most underexploited cross-link
      in the corpus, and neither entry cites the other"; this proposal cites
      KN-OPEN-006 for its trade-off framing and makes no claim about
      displacement rank.
    - >-
      KN-OPEN-019, the missing ECDLP tracked-object enumeration, is what
      KN-OPEN-020's own text names as a reason the universal question stays
      open ("the ECDLP attack-family taxonomy is not closed"). It is NOT
      addressed here and this proposal must not be read as narrowing it.
    - >-
      The prime ideal theorem for degree-one primes, the Bezout bound, and the
      Canfield-Erdos-Pomerance smoothness estimate are used at (C4), S1 and
      (C5). All three are standard; NO SPECIFIC CITATION, THEOREM NUMBER,
      PAGE, OR AUTHOR IS ASSERTED FOR ANY OF THEM, because none was read for
      this record. Each is a candidate to check and each is a stage of the
      paired test.
    - >-
      The L[1/3, (8/9)^(1/3)] smoothness bound and the |FB| = 2B/log B count
      are consistent with the derivation in IDEA-20260805-1775f2, which
      reproduces the classical GNFS exponent from first principles; the two
      proposals share that derivation and each states it independently.

  lossy_projection_identifiability_audit:
    projection: >-
      An entire index-calculus algorithm projected onto its FACTOR BASE'S
      DESCRIPTION LEDGER: the quadruple (description length, description
      degree, membership cost, relation-event density). Everything about the
      algorithm except how its factor base is specified and how often a
      relation occurs is discarded.
    what_is_discarded: >-
      The linear algebra entirely, the descent strategy, the target group's
      arithmetic, the ambient field, and every constant. Two algorithms with
      the same quadruple are indistinguishable under this projection even if
      one solves a completely different problem.
    why_genuinely_lossy: >-
      Radically lossy - NFS and elliptic-curve index calculus solve different
      problems in different groups and the projection retains nothing that
      distinguishes those problems.
    why_compatible_with_the_operations: >-
      Compatible because each of the four coordinates propagates
      deterministically through the pipeline: the description is fixed before
      collection, membership cost is charged per candidate, relation density
      multiplies the candidate count, and the descent trial count is the
      reciprocal of the reachable-set density. That determinism is why the
      quadruple can be used as a comparator across two different problems at
      all.
    is_it_only_a_change_of_coordinates: >-
      NO, AND THE CHECK RUN HERE IS THE MIRROR-FAILURE CHECK - is the
      projection constant across the two objects, in which case it discriminates
      nothing. IT RETURNS NON-CONSTANT AND SEPARATES THE PAIR ON THREE OF FOUR
      COORDINATES: description degree (undefined for NFS, bounded by d for the
      elliptic-curve locus), cardinality-versus-description-length (2B/log B
      against 3d), and relation density (L[1/3, -c] against B^m/N). The
      remaining coordinate, membership cost, is polynomial for BOTH - and that
      single shared coordinate IS the observation collision the mechanism
      exhibits, which is exactly the diagnostic value of running the audit.
      The (Delta, Pi) failure mode - a projection that loses nothing, so that
      the discarded structure is recoverable - is not live, since neither
      algorithm is recoverable from its quadruple; it is recorded as checked
      and inapplicable.

  predictions:
    - metric: >-
        Number of coordinates of the description ledger on which NFS's factor
        base and a bounded-degree plane-curve elliptic-curve factor base agree
      direction: different
      minimum_effect: >-
        EXACTLY 1 (membership cost, polynomial for both), out of 4. Derived
        before any reading of the theorem artifact. If the count is 0 the
        objects are separated by every coordinate and no collision exists, so
        the audit's central claim is void; if it is 2 or more the collision is
        broader than stated and the no-go's identifiability problem is worse
        than this record says. Both departures are informative and both are
        pre-declared.
    - metric: >-
        Ratio of NFS factor-base cardinality to the Bezout bound 3d that a
        degree-d description would permit, at the relayed RSA-250 scale
      direction: higher
      minimum_effect: >-
        AT LEAST 1e6, with a conditional instantiation of about 1.35e8 / d for
        the actual description degree d (which is not a well-defined number for
        NFS at all, which is the point). A ratio near 1 would mean height
        descriptions and degree descriptions are comparable resources and S1
        collapses.
    - metric: >-
        The exponent of log n in -log(relation-event probability), for NFS and
        for bounded-arity elliptic-curve descent
      direction: different
      minimum_effect: >-
        1/3 FOR NFS AND 1 FOR BOUNDED-ARITY DESCENT. That is the whole of S3,
        stated as one number against one number, and it is where the two
        objects diverge. If the elliptic-curve exponent is derived to be below
        1 for some admissible descent, S3 is wrong and the separation must be
        relocated to S1 or S2 - which would be a substantive redirection rather
        than a failure.
    - metric: >-
        Whether the bounded-degree theorem, once its artifact is READ, contains
        a hypothesis that already excludes NFS explicitly
      direction: different
      minimum_effect: >-
        A yes/no with the hypothesis quoted verbatim. YES is the most likely
        outcome and is a PASS, not a disappointment: it means the theorem is
        correctly scoped and that KN-OPEN-020's summary of it, which does not
        mention such a hypothesis, understates the theorem's precision. NO
        means the universal question as posed is refuted by an object already
        in the literature.

  minimal_test:
    design: >-
      Three stages, all pen-and-paper, no network beyond one in-repo file read,
      no compute, no solver, no seeds. STAGE 1 (the decisive one, and it runs
      first): READ
      `ideas/artifacts/IDEA-20260801-021/bounded_degree_factor_base_theorem.md`
      in full and record, verbatim, every hypothesis of the theorem. Then check
      each hypothesis against NFS's factor base and record which one fails.
      IF EXACTLY ONE HYPOTHESIS ALREADY EXCLUDES NFS AND SAYS SO, THE AUDIT
      TERMINATES HERE with the outcome "the theorem is correctly scoped and
      KN-OPEN-020's summary understates it", which is a complete and useful
      result costing under an hour. STAGE 2: write the four-coordinate
      description ledger for NFS and for the bounded-degree elliptic-curve
      factor base side by side, with each charge derived. STAGE 3: state the
      sharpened universal question, with S1, S2, S3 as the separating
      conditions any universal no-go must contain, and with the forward
      guidance (an auxiliary multiplicative structure of unbounded rank with a
      homomorphism to the target, and a relation event whose negative log grows
      sublinearly in log N) stated as a POSITIVE REQUIREMENT rather than as a
      closure.
    controls:
      - >-
        NULL OBJECT, SAME SHAPE, FORCED VALUE DERIVED PRE-RUN, CAN FAIL. Apply
        the identical four-coordinate ledger to an object that is NOT an index
        calculus at all and where no subexponential behaviour is expected:
        Pollard rho on a generic group, whose "factor base" is empty. FORCED
        VALUES DERIVED BEFORE THE AUDIT: description length O(1), description
        degree undefined, membership cost zero, relation-event density 1
        (every step produces a step, none produces a relation), and no
        subexponentiality. If the ledger nonetheless assigns rho a profile
        resembling NFS's - in particular if "description degree undefined"
        alone appears to buy subexponentiality - then the ledger is reading
        the undefined coordinate as a virtue and the whole S1 argument is an
        artifact of the encoding. THIS NULL CAN FAIL AND IT TARGETS THE EXACT
        WAY THE ARGUMENT COULD BE FAKE.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR. The
        classical index calculus for the multiplicative group of F_p, whose
        factor base is {primes <= B} - a height description with no degree,
        exactly like NFS's, and which is subexponential at L[1/2]. The ledger
        MUST assign it the same S1 and S2 profile as NFS and a DIFFERENT S3
        exponent (1/2 rather than 1/3, since it lacks the number-field norm
        reduction). If the ledger cannot separate L[1/2] from L[1/3] while
        agreeing on S1 and S2, it has not identified the load-bearing
        structure and no conclusion about KN-OPEN-020 may be drawn.
      - >-
        GRADED CONTROL, THREE INTERIOR POINTS, MONOTONICITY REPORTED. Order
        four objects by their S3 exponent: Pollard rho (no relation event),
        F_p index calculus (1/2), NFS (1/3), and a hypothetical bounded-arity
        elliptic-curve descent (1). The ledger must reproduce that ordering
        and the ordering must be monotone against known algorithmic
        complexity. A permutation localizes the error to a specific charge.
      - >-
        ORDERING CONTROL. The forced value "exactly 1 shared coordinate out of
        4" and the null's forced profile are written down and hash-committed
        BEFORE the theorem artifact is opened at Stage 1.
      - >-
        ARCHIVE CHECK, ZERO COMPUTE. Search the corpus for any prior instance
        of NFS being used as a control on an ECDLP no-go. RESULT AS OF
        WRITING: none found; KN-OPEN-020 does not mention NFS and no
        experiment, evidence or decision record does. Recorded as an absence,
        which is not evidence it was not attempted elsewhere.
    required_metrics:
      - verbatim list of every hypothesis of the bounded-degree theorem, from its artifact file
      - which hypothesis or hypotheses NFS's factor base violates, named individually
      - the four-coordinate ledger for NFS, for F_p index calculus, for bounded-arity elliptic-curve descent, and for Pollard rho
      - the count of shared coordinates between NFS and the elliptic-curve locus, against the pre-declared 1
      - the sharpened universal question, written out, with S1/S2/S3 as candidate separating conditions

  falsification_conditions:
    - >-
      The theorem artifact contains no hypothesis excluding NFS AND its
      conclusion as stated does apply to height-described factor bases. The
      theorem then contradicts a working algorithm, which is a correction-level
      finding and is routed as one rather than absorbed.
    - >-
      The shared-coordinate count is not 1. The observation collision is either
      absent (count 0) or broader (count >= 2) and the record's central claim
      must be restated.
    - >-
      The positive control fails: the ledger cannot separate F_p index calculus
      at L[1/2] from NFS at L[1/3]. Nothing about KN-OPEN-020 may then be
      reported.
    - >-
      The null fires: the ledger assigns Pollard rho an NFS-like profile,
      showing that "description degree undefined" is being read as a source of
      subexponentiality. S1 is then an artifact of the encoding.
    - >-
      The elliptic-curve descent relation-event exponent is derived below 1 for
      some admissible bounded-arity descent. S3 is wrong and the separation
      must move.

  confounders:
    - >-
      SECOND-HAND CHARACTERIZATION OF THE THEOREM. Everything in the mechanism
      about the bounded-degree obstruction comes from KN-OPEN-020's summary,
      not from the artifact. If the summary misdescribes the theorem, the
      audit's target is wrong. Stage 1 exists solely to remove this and no
      stage past it may run on the summary.
    - >-
      CATEGORY MISMATCH IS EASY TO MANUFACTURE. NFS and elliptic-curve index
      calculus solve different problems in different groups, so ANY comparison
      between them can be made to look like a separation by choosing
      coordinates that happen to differ. The four coordinates were fixed from
      KN-OPEN-020's own charge list ("description, membership, relation,
      descent") BEFORE the comparison was made, precisely so the choice is not
      post hoc; that this was the ordering is recorded here rather than
      asserted later.
    - >-
      IT IS CHEAP TO EMBARRASS AN OPEN PROBLEM. Pointing out that a universal
      statement has an obvious counterexample in a neighbouring category reads
      as rigour and costs almost nothing. The null, the positive control and
      the pre-declared shared-coordinate count exist so that the finding costs
      something to reach, and the most likely outcome - that the theorem is
      correctly scoped and only its summary is loose - is pre-declared as a
      PASS so that the audit is not incentivized toward the dramatic reading.
    - >-
      OWNERSHIP. The ECDLP consequence of this audit belongs to
      GOAL-ECDLP-001 and GOAL-FIND-001, not here. This proposal produces the
      FACTORING-SIDE half - the charged ledger for NFS's own factor base - and
      explicitly defers the elliptic-curve conclusion. A record that drifts
      into proposing an elliptic-curve factor base has left this goal's scope.

  interpretation_limits:
    - >-
      NO ECDLP CLAIM. Nothing here supports, weakens or narrows any
      elliptic-curve hypothesis, and KN-OPEN-019 and KN-OPEN-020 both remain
      open. Producing a separating condition is not producing an attack, and
      the forward guidance in S2 is a requirement that no known elliptic-curve
      construction meets.
    - >-
      NO CLOSURE IS CLAIMED. Inventor-protocol section 4 requires a named
      obstruction, an argument, and forward guidance for a closure. This
      proposal supplies an argument and forward guidance but names no
      obstruction to anything - it removes one reading of a question and
      sharpens it. Calling it a closure would be exactly the fatigue-report
      failure the protocol names.
    - >-
      NO STATEMENT ABOUT RSA. NFS appears here as a mathematical object whose
      factor base is being charged, not as an attack on a deployed key. This
      goal's claim ceiling is binding.
    - >-
      COMPLETENESS OF S1, S2, S3 IS NOT CLAIMED. There may be further
      separating conditions and there may be a single deeper one of which
      these are shadows; the record says three candidates and stops.

  heuristic_assumptions:
    - id: HEUR-FB-1
      statement: >-
        (Smoothness density.) The probability that both norms attached to a
        sieved pair are B-smooth is L[1/3, -c] for a positive constant c under
        the standard NFS heuristic; equivalently, the negative logarithm of the
        relation-event probability grows like (log n)^(1/3)(log log n)^(2/3).
      rigorous_support: >-
        This is HEUR-NFS-1 of IDEA-20260805-1775f2 under another name and it
        inherits that record's caveat in full: the Canfield-Erdos-Pomerance
        theorem is about uniformly random integers and the norms are not
        uniformly random integers. It is assumed by every published NFS
        exponent. Stated, not defended.
      validation_plan: >-
        Not validated here. S3 needs only the FUNCTIONAL FORM (cube root versus
        first power), which survives any correction to c, so the audit's
        conclusion is insensitive to the constant. That insensitivity is itself
        a checkable claim and is a Stage-2 item.
    - id: HEUR-FB-2
      statement: >-
        (Faithfulness.) KN-OPEN-020's summary faithfully describes the
        hypotheses and conclusion of the bounded-degree factor-base theorem in
        its source artifact.
      rigorous_support: >-
        NONE. It is an evidentiary assumption about an in-repo file that was
        not opened. It is the single most likely point of failure in this
        proposal and it is listed first among the confounders for that reason.
      validation_plan: >-
        Stage 1 opens the file. This is the entire reason Stage 1 runs before
        anything else.
    - id: HEUR-FB-3
      statement: >-
        (Arity.) Elliptic-curve index-calculus descent as covered by the
        bounded-degree obstruction has bounded arity m, so its reachable target
        set is at most B^m and its descent trial count is Omega(N/B^m).
      rigorous_support: >-
        Taken verbatim from KN-OPEN-020's own text, which states the
        tuple-image counting bound and the Omega(N/B^m) charge. Inherits
        HEUR-FB-2's faithfulness caveat. If some admissible descent has
        unbounded arity, S2 needs restating.
      validation_plan: >-
        Stage 1 checks whether the theorem quantifies over bounded m or over
        all m.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED AND NONE IS CLAIMED, and this is stated plainly
      rather than dressed up. The objects compared are L[1/3, 1.923] (NFS),
      L[1/2, c] (F_p index calculus), and the elliptic-curve descent bound
      Omega(N/B^m), all of them established or already in the corpus. The
      contribution is which resource separates them.
    memory_exponent: >-
      Charged for completeness under KN-OPEN-020's own ledger, which demands
      memory be charged: NFS's factor base occupies |FB| = 2B/log B storage,
      L[1/3, 0.9615] under the standard parameterization, and its relation
      matrix occupies the same exponent - the object that
      IDEA-20260805-72bcb5 instantiates at 281 GB for RSA-250. A no-go that
      charges the elliptic-curve factor base's memory must charge NFS's too,
      and NFS pays it.
    best_known: >-
      For the QUESTION being audited there is no best-known result; KN-OPEN-020
      is open and unverified and the bounded-degree obstruction is scoped and
      derivation-level. That is the state this proposal engages.
    hidden_overhead: >-
      The descent stage of NFS - individual logarithm / special-q descent for
      the discrete-logarithm variant - is not charged in the ledger above, and
      it is precisely the stage KN-OPEN-020's charge list names. Its omission
      is an incompleteness of this record and is flagged rather than hidden;
      completing it is a named successor.
    tradeoff_note: >-
      The trade the whole audit isolates is DESCRIPTION CONSTRAINT AGAINST
      RELATION DENSITY, which is the same trade KN-OPEN-006 states for
      arithmetic-progression supports on the linear-algebra side. That the two
      entries state one trade from two directions and do not cite each other is
      recorded here.

  dominated_by: >-
    n/a (no algorithm and no cost claim; nothing to dominate). Rows checked
    before setting this, so that the null is not an unchecked one: TIME - no
    algorithm proposed, so no time row applies; MEMORY - none, same reason;
    DATA/QUERIES - none, same reason; and on the AUDIT'S OWN QUESTION, the
    frontier was checked for an existing statement of why the bounded-degree
    no-go does not refute NFS, across KN-OPEN-020 (does not mention NFS),
    KN-OPEN-019, KN-OPEN-006, KN-TECH-003 and KN-TECH-005 as named in
    KN-OPEN-020's source_refs, the experiment and evidence directories, and the
    decision ledger - none found. Absence of a search result is not evidence
    that no such statement exists elsewhere.
  sota_delta: >-
    No attack; a scope and identifiability contribution, quantified as follows.
    KN-OPEN-020 currently quantifies over "every algebraically described factor
    base" with 0 recorded counterexample-candidates and 0 recorded separating
    conditions. This audit would supply 1 exhibited observation collision
    (2 ground-truth objects on opposite sides of the conclusion sharing the
    membership-cost coordinate) and 3 candidate separating conditions, each
    stated so a reviewer can attack it. On the numbers: the description-degree
    resource is separated from the description-length resource by a factor of
    about 1e8 at RSA-250 scale, and the relation-density exponent is separated
    by 1/3 against 1.
  estimated_cost:
    implementation: low
    compute: none
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.55 that the audit produces a usable separating-condition list. It is not
    higher because HEUR-FB-2 is unsupported - the theorem artifact was not
    read, and the most likely single outcome (probability about 0.5 on its own)
    is that the theorem already carries an explicit hypothesis excluding
    non-locus factor bases, in which case Stage 1 terminates the audit with a
    much smaller result. It is not lower because that smaller result is itself
    the deliverable this goal can honestly claim (KN-OPEN-020's summary is then
    shown to understate its own theorem, which matters because the summary is
    what a retrieval query returns), because the collision at the membership
    coordinate is exhibited rather than conjectured and does not depend on the
    artifact's contents, and because S3's cube-root-versus-first-power
    separation is a standard fact that no reading of the theorem can disturb.
    Separately: 0.90 that Stage 1 reaches a decisive reading, since the file is
    in this repository and needs no network.
