idea:
  id: IDEA-20260829-ece95f
  question_id: RQ-ECQ-e9b361
  goal_id: GOAL-ECQ-2298dc
  goal_id_note: >-
    RECORDED FOR ROUTING ONLY. GOAL-ECQ-2298dc is `blocked` and its next_action forbids
    resumption without a new Coordinator decision meeting one of DEC-20260824-b7557b's three
    resume conditions. Filing a proposal is not a dispatch, mints no batch, and does not
    resume the goal. If this idea is ever run it needs its own Coordinator decision, and this
    field must not be read as one.

  title: >-
    Rank is produced geometrically and lost arithmetically: measure the ISOTYPIC CONCENTRATION
    of the geometric Mordell-Weil module on rational characters, using the 2026
    Butler-Elsenhans field-of-definition algorithm, and read the blocker off Shioda's rank-68
    surface

  class: mechanism

  claim: >-
    Let X be a non-isotrivial elliptic surface over Q with base P^1 over Q, let
    M = MW(X over Qbar(t)) tensor Q be its geometric Mordell-Weil space of dimension r_geom,
    and let k be the FIELD OF DEFINITION of MW, that is the smallest number field with all
    Qbar(t)-rational points defined over k(t). Then Gal(Qbar/Q) acts on M through the finite
    group G = Gal(k/Q), and rank MW(X over Q(t)) = dim M^G, the multiplicity of the trivial
    representation. THE CLAIM UNDER TEST IS THAT THE BLOCKING QUANTITY FOR RANK 32 OVER Q IS
    NOT THE PRODUCTION OF RANK BUT ITS CONCENTRATION ON ONE CHARACTER. Concretely, define
    m_max(X) = the maximum, over the declared finite set of rational twist characters psi
    available to X (quadratic for generic j; the sextic family y^2 = x^3 + c f(t) with c in
    Q* modulo sixth powers when j = 0), of the multiplicity of psi in M. Then every twist of X
    has rank over Q(t) at most m_max(X), and the whole fixed-surface twist lever is bounded by
    that one integer. THE DECISIVE INSTANCE IS SHIODA'S SURFACE y^2 = x^3 + t^360 + 1, whose
    geometric rank is 68 and whose field of definition Butler-Elsenhans (arXiv:2601.17182)
    compute to have degree 829,440. Two readings are pre-declared and both are consequential.
    If m_max is at least 32, then a family of generic rank at least 32 over Q(t) EXISTS
    EXPLICITLY, which is the one structural route GOAL-ECQ-2298dc odds_assessment item (4)
    says nothing in the idea set exhibits, and rank 32 over Q would follow by specialisation
    for almost all rational t. If m_max is at most 8 -- the expected reading -- then this
    program has MEASURED, on the largest explicit geometric-rank object in the literature, the
    exact quantity that blocks it: 68 units of geometric rank concentrate at most m_max on any
    single rational character, and the deficit against the objective is 32 - m_max units of
    Mordell-Weil rank, stated over a named object rather than as a verdict.

  mechanism: >-
    Two committed measurements in this program are the same measurement and nobody has said
    so. DEC-20260824-b7557b lane L5 measured a surface of geometric rank 15 whose arithmetic
    rank over Q(t) is 0 on a 31-point specialisation sample, and recorded the reason in its own
    resource_check: "NS(X_Qbar) as an ABSTRACT LATTICE discards the Galois action, which is
    exactly the datum arithmetic rank depends on; the correct object is NS(X_Qbar) AS A GALOIS
    MODULE". KN-FIND-fd382f measured, over Q, a curve of rank at least 64 over a multiquadratic
    field of degree 64 in which EVERY ONE of the 64 twist classes carries exactly one point --
    64 units of rank spread perfectly flat across 64 characters, with the trivial component
    carrying 1. Both are statements about an isotypic profile, and in both the total is large
    and the trivial multiplicity is tiny. That is the mechanism: rank is an EXTENSIVE quantity
    in the size of the Galois module and an INTENSIVE quantity in any one isotypic component,
    and a rank record over Q asks for the intensive one. The reason this is now testable rather
    than rhetorical is external and recent. Butler-Elsenhans give an ALGORITHM, implemented in
    Magma, that determines the field of definition of the Mordell-Weil group of an elliptic
    surface over Q, and they run it on Shioda's rank-68 surface. That converts G from an
    unknown into a computed object, and once G is known the isotypic decomposition of M is
    ordinary character theory: mult(psi) = (1/|G|) * sum over g in G of trace(g on M) *
    conj(psi(g)). The one-step propagation is exact and deterministic. A constant twist by c
    replaces M by M tensor psi_c and leaves G and the trace function alone, so the rank of
    EVERY twist is read off ONE character table with no further geometry -- and the sum over
    all one-dimensional characters of their multiplicities is bounded by dim M = r_geom, which
    is where the hard ceiling m_max <= r_geom comes from and why the lever is finite.

  tracked_object:
    object: >-
      The geometric Mordell-Weil space M = MW(X over Qbar(t)) tensor Q AS A Q[G]-MODULE,
      G = Gal(k/Q), projected onto its character-multiplicity vector (mult(psi))_psi over the
      one-dimensional characters of G. NOT the surface, NOT the sections, NOT the j-map, NOT
      the fibre configuration.
    lossy_projection_test: >-
      PASSES, and the loss is enormous and explicit. The projection sends an elliptic surface
      over Q -- its Weierstrass model, its 2 * 360 = 720 or fewer singular fibres, every
      section's coordinates, the whole Neron-Severi lattice, every specialisation -- to a
      finite list of non-negative integers summing to at most r_geom. From that list one
      cannot recover the surface, cannot recover a single point, cannot decide whether two
      surfaces are isomorphic, and cannot compute a height. It is emphatically not a change of
      coordinates. What it DISCARDS is discarded compatibly with the operations the target
      performs: constant twisting acts on M by tensoring with a character, which permutes the
      multiplicity vector deterministically; base change along a degree-n cover replaces G by
      an open subgroup and the multiplicity vector by the restriction, which is again
      determined; and specialisation at rational t is a G-equivariant map, so the invariant
      part maps to E_t(Q). Every one of those is a deterministic one-step propagation of the
      retained data alone.
    what_the_loss_buys: >-
      Independence from the missing model. IDEA-20260824-155411 and lane L3 both stalled on
      needing the unpublished rank-17 K3 fibration. This object needs no record fibration at
      all: it is computed on PUBLISHED surfaces of known large geometric rank, and its answer
      is a ceiling that binds every twist of them at once.
    what_the_loss_costs: >-
      The multiplicity vector cannot exhibit a point, cannot give a height, and cannot say
      whether a specialisation is small. A surface passing this test with m_max large would
      still owe an exhibited-section certificate over Q(t) and an exhibited-point certificate
      over Q before anything is claimed, and the height-slope law of KN-FIND-91f871 would then
      price its fibres.

  novelty_status: unverified
  novelty_note: >-
    CORPUS CHECK PERFORMED THIS SESSION AND ITS RESULT IS MIXED, WHICH IS STATED RATHER THAN
    SMOOTHED. The Galois-module framing is NOT new to this program: DEC-20260824-b7557b
    obstruction.resource_check states it verbatim as the reversal of lane L5 and records
    spawned_ids as EMPTY with the reason that no proposal record was minted, and requests a
    KN-OPEN entry that this session could not find in knowledge/open-problems (a grep over
    that directory returned KN-OPEN-025 and KN-OPEN-009, neither of which is it). This
    proposal is therefore the first idea record carrying that reversal, and it says so instead
    of claiming the framing. IDEA-20260824-248142 (title, class and claim block read via grep
    this session) proposes the closely related DESCENT INDEX = geometric rank minus invariant
    rank, tabulated across published families; that is prior art for the QUANTITY and this
    record does not restate it. WHAT IS DIFFERENT AND WHAT THE DIFFERENCE BUYS: 248142 needs
    the invariant rank as an input it has no instrument for, and this session's external search
    supplies exactly that instrument (Butler-Elsenhans, arXiv:2601.17182, retrieved 2026-08-29,
    abstract page only) together with the full character decomposition rather than a single
    integer -- which is what turns the descent index from one number into a bound on every
    twist simultaneously. The mathematics of isotypic decomposition is classical and is NOT
    claimed as new. Shioda's rank-68 surface and its degree-829,440 field of definition are
    other people's results and are cited as such. External checking was PARTIAL: four web
    searches and three abstract fetches this session, no full paper read, and no search run
    against the specific question "has anyone tabulated m_max for high-geometric-rank
    surfaces". `unverified` is therefore the required label.

  citations:
    - ref: "arXiv:2601.17182"
      provenance: retrieved
      claim: >-
        Blair Butler and Andreas-Stephan Elsenhans, "Arithmetic Information of Rational
        Elliptic Surfaces, and Shioda's Rank 68 Elliptic Surface", v1 23 Jan 2026, v2 5 Jun
        2026. ABSTRACT STATES: the field of definition of the Mordell-Weil group of an
        elliptic surface E over P^1 defined over Q is the smallest number field k such that
        all its Qbar(t)-rational points are defined over k(t); the authors present an
        algorithm, implemented in Magma, which determines arithmetic information including the
        field of definition associated to any rational elliptic surface; and as an application
        the field of definition of Shioda's rank 68 elliptic surface y^2 = x^3 + t^360 + 1 is
        a number field of degree 829,440. A TENSION IN THE ABSTRACT IS RECORDED RATHER THAN
        RESOLVED: the algorithm's stated scope is "any rational elliptic surface", whose
        geometric Mordell-Weil rank is capped at 8 by Shioda-Tate, while the application is to
        a surface of geometric rank 68 and degree 360. Only the abstract was read, so whether
        the algorithm as published applies at arbitrary arithmetic genus is NOT established by
        this session and is the first thing the design checks.
      verified_by: >-
        idea-generator session 2026-08-29, WebFetch of the arXiv ABSTRACT PAGE for 2601.17182.
        The full text was not read; no theorem statement, algorithm, complexity bound or
        constant from it is relied on as verified.
