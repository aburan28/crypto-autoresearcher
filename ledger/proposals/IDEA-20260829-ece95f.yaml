  assumptions:
    - >-
      The Butler-Elsenhans algorithm, or a reimplementation of it, is available to this
      program. Magma is a commercial system and its availability here is NOT established; the
      design's step 0 decides between (a) Magma if a licence exists, (b) an OSCAR
      reimplementation using elliptic_surface, trivial_lattice and mordell_weil_sublattice, or
      (c) abandoning the Shioda arm and running only the small controls. Option (c) is a real
      and acceptable outcome and is not a failure of the mathematics.
    - >-
      The character table of G = Gal(k/Q) is computable once k is known. For
      |G| dividing 829,440 = 2^11 * 3^4 * 5 (a factorisation this session performed exactly:
      2^11 = 2048 and 2048 * 405 = 829,440 with 405 = 3^4 * 5) this is a group-theory
      computation of moderate size, but the group must be presented, not merely its order, and
      obtaining the presentation may be the binding cost.
    - >-
      The trace of each g in G acting on M is computable, since mult(psi) requires the
      character of M and not merely dim M. If only the field degree is recoverable and not the
      action, the design reports the DESCENT INDEX bound only and the full multiplicity vector
      is not delivered. That is a partial result and is reported as partial.

  proof_search_map:
    bottleneck: >-
      The exact step whose removal changes the campaign is: converting "geometric rank exists
      in abundance" into "arithmetic rank over Q(t)". DEC-20260824-b7557b R3 names the blocking
      quantity as AVAILABILITY of a high-rank family over Q(t) and L5 names GALOIS DESCENT as
      the reason the abundant geometric objects do not supply one. Nobody has computed the
      Galois action, so the descent has never been measured -- only sampled once, on one
      transcribed surface, with no run record. Removing that step means computing G and the
      character of M.
    baseline_embedding:
      parameter_slice: >-
        The in-repo pencil-of-cubics surface, geometric rank exactly 8 by Shioda-Tate on a
        squarefree degree-12 discriminant, all eight sections Q-rational and verified as
        polynomial identities over Q(t). This is the exact old-method boundary: field of
        definition k = Q, G trivial, M the trivial G-module of dimension 8, mult(trivial) = 8,
        every non-trivial twist of rank 0 over Q(t), descent index 0.
      reproduction_check: >-
        Frozen fixture. Rebuild the surface from the committed qt_family.json, re-verify the
        eight sections as identities over Q(t) in exact arithmetic, and require the instrument
        to return [k:Q] = 1 and mult(trivial) = 8. An instrument that returns anything else on
        an all-Q-rational E8 surface is broken, and NO number from it may be reported. This
        check runs FIRST and is a stop condition.
    observation_collision:
      observable: >-
        The multiplicity vector (mult(psi))_psi of M as a Q[G]-module, summarised by
        m_max and by the descent index r_geom - mult(trivial).
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IS EXHIBITED IN ADVANCE. The observable is a character-theoretic
        invariant, so any two surfaces whose geometric Mordell-Weil modules are isomorphic as
        Q[G]-modules collide exactly -- and this is not a hypothetical: every rational elliptic
        surface with all fibres irreducible and all sections Q-rational has M the trivial
        module of dimension 8, an infinite collision class. The collision is on SURFACE
        IDENTITY and on HEIGHT, never on the multiplicity vector itself, so the method is
        identifiable for what it claims (a ceiling on twist ranks) and provably
        non-identifiable for which surface produced it. A second collision that matters more:
        m_max is a ceiling, not an attainment, because a character can occur in M with
        multiplicity m without the corresponding twist being DEFINED OVER Q in the declared
        twist family. The design therefore reports m_max as an UPPER bound on the twist lever
        and separately reports which characters are realised by an explicit rational twist.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "the Mordell-Weil rank of every twist of X over Q(t)", an infinite family of
          hard descent problems, by "the character of one finite-dimensional representation of
          one finite group", a single linear-algebra object.
        predicted_gain: >-
          An infinite family of rank computations collapses to one character computation plus
          arithmetic, and a hard ceiling m_max <= r_geom drops out for free because the
          one-dimensional characters are pairwise orthogonal inside a space of dimension
          r_geom.
      - transform: stronger_invariant
        proposed_object: >-
          Carry the whole multiplicity vector instead of the single integer mult(trivial) that
          IDEA-20260824-248142's descent index carries. The weaker invariant answers only
          "what is the rank of X over Q(t)"; the stronger one answers "what is the rank of
          EVERY twist of X over Q(t)" at no extra cost once G is known.
        predicted_gain: >-
          The twist lever is priced exactly rather than sampled, and a negative is a theorem
          about the surface rather than a bounded search over twists.
      - transform: observable_fiber
        proposed_object: >-
          Hold the multiplicity vector fixed and vary the surface. The invariant content is the
          ceiling; the variable content is everything a rank record actually needs -- height,
          fibre types, explicit sections.
        predicted_gain: >-
          Makes the method's limits explicit before it runs, which is what prevents a ceiling
          from being reported as a family identification.
    quantifier_order: >-
      FIXED BEFORE ANY SURFACE IS OPENED. FOR ALL surfaces X in the declared test set and FOR
      ALL rational twists X^(c) with c in the declared finite twist set T(X), THERE EXISTS a
      one-dimensional character psi_c of G such that rank MW(X^(c) over Q(t)) equals
      mult_M(psi_c); and therefore FOR ALL c in T(X), rank MW(X^(c) over Q(t)) is at most
      m_max(X). Note the order carefully: m_max is allowed to depend on X (it is the thing
      being measured) but NOT on c, which is what makes it a ceiling rather than a maximum over
      a search. The correspondence c to psi_c is a PROOF OBLIGATION, not an assumption, and is
      discharged on the positive control before the Shioda arm runs.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For this surface, and for every twist in the declared rational twist family, the
        Mordell-Weil rank over Q(t) is at most m_max, an integer computed from the character of
        an explicitly determined finite group action." That is a CEILING over a declared twist
        family. It is never a rank over Q, never an exhibited curve, never a statement about
        base changes outside the declared family, and never a statement about surfaces not in
        the test set. Even m_max = 40 would certify NOTHING about rank 32 over Q until a
        specific twist is exhibited with 32 independent sections over Q(t) and a specialisation
        is certified with 32 independent points over Q in exact arithmetic.
      nearby_object_control: >-
        The closest object where the desired conclusion must FAIL: the in-repo pencil, where
        r_geom = 8 and therefore m_max is at most 8 by a theorem this program has already
        certified. If the instrument returns m_max above 8 there, it is not computing a
        multiplicity. A second nearby control where the conclusion should also fail: a rational
        elliptic surface with many reducible fibres and geometric rank 0 or 1, where m_max must
        come back at most 1.
    proof_obligations:
      - claim: rank MW(X over Q(t)) equals dim M^G with G the Galois group of the field of definition.
        responsibility: correctness
      - claim: The rational twist c corresponds to the character psi_c, verified on the positive control.
        responsibility: interface
      - claim: The instrument returns k = Q and mult(trivial) = 8 on the all-Q-rational E8 pencil.
        responsibility: baseline
      - claim: The character of M, not merely dim M, is computable at the declared group order.
        responsibility: feasibility
      - claim: Sum over one-dimensional psi of mult(psi) is at most r_geom, so m_max is at most r_geom.
        responsibility: size
      - claim: The Shioda arm fits the declared budget, or is declared out of scope before it starts.
        responsibility: runtime
    not_applicable_reason: null

  predictions:
    - metric: >-
        positive_control_multiplicity -- mult(trivial) returned by the instrument on the
        in-repo pencil-of-cubics surface, whose geometric Mordell-Weil rank is exactly 8 with
        all eight sections Q-rational
      direction: different
      minimum_effect: >-
        exactly 8, with field of definition of degree exactly 1. Any other value stops the
        experiment and no further number is reported.
    - metric: >-
        nearby_object_multiplicity -- mult(trivial) on a rational elliptic surface of geometric
        rank 0 or 1
      direction: lower
      minimum_effect: at most 1. A value above 1 voids the instrument.
    - metric: >-
        kloosterman_descent_index -- r_geom minus mult(trivial) on the transcribed
        geometric-rank-15 surface of lane L5
      direction: higher
      minimum_effect: >-
        at least 13, that is mult(trivial) at most 2, which would CONFIRM L5's sample-based
        reading with a certified computation and retire that lane's declared weakness. A
        returned mult(trivial) of 15 would CONTRADICT L5's 31-point sample and is equally
        reportable: one of the two is wrong, and finding out which is worth the run on its own.
    - metric: >-
        m_max_shioda -- the maximum multiplicity of a one-dimensional character of
        G = Gal(k/Q) in the 68-dimensional geometric Mordell-Weil module of
        y^2 = x^3 + t^360 + 1
      direction: different
      minimum_effect: >-
        reported as an integer in [0, 68] with the group order and the character it is attained
        at. THE TWO PRE-DECLARED READINGS, WRITTEN BEFORE THE COMPUTATION: m_max at least 32
        means an explicit family of generic rank at least 32 over Q(t) exists and the
        structural route GOAL-ECQ-2298dc says nothing exhibits is open -- this outcome triggers
        the full adversarial protocol before ANY claim, and is not to be reported quickly.
        m_max at most 8 is the expected reading and delivers the question's second clause as a
        number: 32 - m_max units of Mordell-Weil rank, over the named object.
    - metric: >-
        descent_index_slope -- the fitted slope of (r_geom minus mult(trivial)) against r_geom
        across the declared test set of at least four surfaces of certified geometric rank
      direction: higher
      minimum_effect: >-
        at least 0.5 per unit of geometric rank, which would say the descent loss grows with
        the geometric rank and that hunting high geometric rank is self-defeating. A fitted
        slope whose confidence interval contains 0 says descent loss is BOUNDED, which would
        reopen lane L5 with a concrete target -- find a high-geometric-rank surface with small
        field of definition -- and is the more consequential of the two outcomes.

  minimal_test:
    design: >-
      STAGE 0 (tooling decision and stop-gate, about 2 h, no mathematics). Decide the
      implementation route: Magma if a licence is actually available to this program, otherwise
      an OSCAR route, otherwise declare the Shioda arm out of scope and run stages 1 to 3 only.
      Record the decision and its basis. Also re-read arXiv:2601.17182 at FULL TEXT rather than
      abstract, and resolve the recorded scope tension between "any rational elliptic surface"
      and an application to a degree-360 surface. If the algorithm does not apply beyond
      arithmetic genus 1, the Shioda arm is dropped here and that is a complete answer.
      STAGE 1 (positive control, about 2 CPU-hours). Rebuild the pencil from the committed
      qt_family.json, re-verify the eight sections as polynomial identities over Q(t) in exact
      arithmetic, and require field of definition of degree 1 and mult(trivial) = 8. STOP
      CONDITION.
      STAGE 2 (nearby-object and null controls, about 3 CPU-hours). Run the instrument on a
      rational elliptic surface of geometric rank 0 or 1, and on a surface with a
      deliberately non-rational section obtained by twisting the pencil by a non-square, where
      mult(trivial) must DROP. A detector that returns 8 on both the pencil and its non-trivial
      twist is not seeing the Galois action.
      STAGE 3 (the L5 re-measurement, about 5 CPU-hours). Re-transcribe Kloosterman's model
      from a VERIFIED source, applying the transcription-identity protocol requested at
      DEC-20260824-b7557b knowledge_promotion REQ-1 (the paper's own generators must satisfy
      the transcribed model identically), then run the instrument. Report r_geom,
      mult(trivial), the descent index, and whether the answer agrees with L5's 31-point
      sample. This stage retires the single weakest link in the campaign's terminal decision
      and is worth running even if every other stage is abandoned.
      STAGE 4 (the Shioda arm, budget declared in advance and capped, 20 to 60 CPU-hours).
      Compute or import k, present G, compute the character of M, and report the full
      multiplicity vector, m_max, and which characters are realised by rational twists in the
      declared family c in Q* modulo sixth powers. ONE RUN. If m_max is at least 32 the run
      STOPS and routes to an adversarial review before any text is written.
    controls:
      - >-
        POSITIVE CONTROL WITH A KNOWN ANSWER: the in-repo E8 pencil, geometric rank exactly 8
        with all sections Q-rational. Expected [k:Q] = 1 and mult(trivial) = 8.
      - >-
        DIFFERENTIAL CONTROL: the SAME pencil twisted by a non-square d. mult(trivial) must
        drop to the multiplicity of chi_d, and the two runs must not return the same vector.
        This is the control that separates "computing a Galois action" from "computing a
        geometric rank twice".
      - >-
        NULL OBJECT: a rational elliptic surface of geometric Mordell-Weil rank 0 or 1.
        Expected m_max at most 1.
      - >-
        PROVES-TOO-MUCH CONTROL: feed the instrument a surface with a deliberately corrupted
        coefficient (one exponent altered, the exact hazard this program has measured twice in
        its retrieval tooling). It must fail the transcription-identity check rather than
        return a plausible number.
      - >-
        EXTERNAL CROSS-CHECK: the degree 829,440 reported by Butler-Elsenhans is an EXTERNAL
        result. If this program's own route reproduces it, that is a strong instrument check;
        if it does not, the discrepancy is reported and no multiplicity vector from that arm is
        used. This program does not adopt an external number as its own measurement.
    required_metrics:
      - field of definition degree [k:Q] per surface, with how it was obtained
      - the presented group G, its order, and its factorisation
      - the character of M and the full one-dimensional multiplicity vector, per surface
      - m_max, the character attaining it, and whether that character is realised by a rational twist
      - descent index r_geom minus mult(trivial), per surface, with r_geom's own provenance
      - transcription-identity check pass or fail for every externally sourced model
      - exact-arithmetic verification that every claimed section satisfies its model identically over Q(t)
      - wall clock, peak RSS and the exact software stack per stage

  falsification_conditions:
    - >-
      STAGE 1 GATE. If the instrument does not return degree 1 and mult(trivial) = 8 on the
      all-Q-rational E8 pencil, it is not computing what this record says it computes and no
      number from any later stage may be reported.
    - >-
      DIFFERENTIAL GATE. If the pencil and its non-square twist return the same multiplicity
      vector, the instrument is blind to the Galois action, which is the entire mechanism, and
      the idea is falsified as implemented.
    - >-
      If m_max on Shioda's surface comes back at most 8, the claim that this object could
      supply base rank 32 is FALSE and the pre-declared negative reading stands: the blocker is
      measured at 32 - m_max units of rank over a named object.
    - >-
      If Stage 3 returns mult(trivial) = 15 for Kloosterman's surface, then either L5's
      31-point sample or this instrument is wrong; no descent-index slope may be fitted until
      the conflict is resolved, and the conflict itself is the reportable result.
    - >-
      If arXiv:2601.17182's algorithm turns out at full text to be restricted to arithmetic
      genus 1, the Shioda arm is out of scope and the record says so; it is NOT replaced by a
      guess at the group.
    - >-
      A Magma licence being unavailable, an OSCAR build failing, or a computation exceeding its
      declared cap are OPERATIONAL conditions under AGENTS.md rule 3 and are never evidence
      about a descent index or a multiplicity.

  confounders:
    - >-
      TRANSCRIPTION. Every externally sourced model in this program has passed through a
      retrieval tool documented at DEC-20260824-b7557b L4 and L5 as silently dropping exponents
      (9T + 211950 against 9T^6 + 211950; 396150T against 396150T^2). A dropped exponent in
      y^2 = x^3 + t^360 + 1 would change the surface entirely while leaving the string
      plausible. Controlled by the transcription-identity protocol and by the corrupted-model
      control.
    - >-
      GEOMETRIC RANK PROVENANCE. r_geom is an INPUT for the externally sourced surfaces (68 and
      15 are other people's results) and a THEOREM only for the in-repo pencil. A descent index
      computed against a wrong r_geom is wrong by exactly that amount. Every r_geom is reported
      with its provenance and the slope fit is repeated with the externally sourced rows
      dropped.
    - >-
      THE CEILING IS NOT AN ATTAINMENT. m_max bounds the twist lever; it does not exhibit a
      twist. A surface with m_max = 20 whose attaining character is not realised by any twist
      defined over Q delivers zero units of usable rank. Reported as two separate numbers,
      never one.
    - >-
      HEIGHT PAYBACK, WHICH IS SEVERE HERE. KN-FIND-91f871's slope law gives d = 60 and slope
      720 for Shioda's surface, so its fibres grow at 720 log|t| plus a constant. At |t| = 2 the
      coefficient a6 = 2^360 + 1 is about 10^108, which is comparable to the current record
      curve's 10^100 and therefore NOT immediately disqualifying -- but at |t| = 3 it is about
      10^172. The usable parameter window is a handful of values of t and must be reported as
      such alongside any positive m_max, because a base rank nobody can specialise usefully is
      not a route.
    - >-
      GROUP PRESENTATION COST. Knowing |G| divides 829,440 is not knowing G. If only the order
      is recoverable, the multiplicity vector is not computable and only bounds are delivered.
      Disclosed here rather than discovered mid-run.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (ISOTYPIC RIGIDITY OF THE TWIST LEVER.) For a non-isotrivial elliptic surface X over Q
        with geometric Mordell-Weil space M of dimension r_geom and field of definition k with
        G = Gal(k/Q), and for every twist X^(c) in the declared rational twist family T(X),
        there is a one-dimensional character psi_c of G with
        rank MW(X^(c) over Q(t)) = mult_M(psi_c); consequently
        sum over c in T(X), up to the induced equivalence, of rank MW(X^(c) over Q(t)) is at
        most r_geom, and max over c of rank MW(X^(c) over Q(t)) is at most m_max(X).
      rigorous_support: >-
        RIGOROUS PART: rank MW(X over Q(t)) = dim M^{Gal} is the standard consequence of
        Galois descent for the Mordell-Weil group of a surface over a base defined over Q, and
        orthogonality of characters inside a space of dimension r_geom gives the sum bound
        unconditionally once the correspondence c to psi_c holds. STRUCTURAL FACT IMITATED: the
        classical decomposition of a rank over an abelian extension into a sum of twisted
        ranks, which THIS PROGRAM HAS ALREADY MEASURED IN THE NUMBER-FIELD CASE at
        KN-FIND-fd382f -- rank at least 64 over a degree-64 multiquadratic field realised as 64
        twist classes each carrying one point. The heuristic content is confined to the
        correspondence c to psi_c being exactly as stated for the sextic family at j = 0, which
        is why the design DISCHARGES it as a proof obligation on the positive control instead
        of assuming it.
      validation_plan: >-
        Sample: the in-repo pencil and all its quadratic twists by d in a declared set of at
        least 40 squarefree integers with |d| at most 200, plus the geometric-rank-0-or-1
        control surface with the same twist set. Shortcut making this feasible: the pencil's
        eight sections are exhibited over Q(t) in the committed qt_family.json, so the rank of
        each twist over Q(t) can be bounded below by a direct bounded-degree section search and
        above by PARI ellrank at three declared good specialisations -- four orders of magnitude
        cheaper than any surface-level descent. Compare: the measured twist ranks against the
        multiplicity vector the instrument predicts, entry by entry, and the SUM of measured
        twist ranks against the bound r_geom = 8. Tail check: the prediction is exactly that at
        most 8 units of rank exist across ALL 40 twists together, so the observed sum is a
        sharp tail test; a measured sum above 8 falsifies H1 outright and is not explainable by
        censoring, since every rank counted is an exhibited-section lower bound. TRANSFER
        ASSUMPTION, STATED: nothing measured on a chi = 1 surface with trivial G transfers to a
        chi = 60 surface with |G| of order 10^6, and the Shioda arm's m_max carries that
        untested transfer in full.
    - id: H2
      statement: >-
        (COMPUTABILITY OF THE CHARACTER AT THE OBSERVED GROUP ORDER.) For the surfaces in the
        declared test set, once the field of definition k is known, the trace of every
        conjugacy class of G = Gal(k/Q) acting on M is computable within the declared budget,
        so the full one-dimensional multiplicity vector -- and not merely dim M^G -- is
        recoverable.
      rigorous_support: >-
        RIGOROUS PART: character orthogonality makes mult(psi) an exact finite sum once the
        traces are known, and the traces are permutation-or-orthogonal-representation data on
        an explicit lattice. There is no probabilistic content in the formula. WHAT IS
        HEURISTIC is purely computational: that the group can be PRESENTED and its conjugacy
        classes enumerated at |G| up to about 10^6, and that the action on a 68-dimensional
        lattice is expressible. Butler-Elsenhans having reported [k:Q] = 829,440 for this exact
        surface is the only evidence that the first half is feasible, and it is external.
      validation_plan: >-
        Sample: run the character computation first at |G| = 1 (the pencil), then at |G| = 2
        (its non-square twist), then at whatever order the geometric-rank-0-or-1 control and
        Kloosterman's surface produce, before attempting 829,440. Compare: wall clock and peak
        RSS against a fitted cost model in |G| and r_geom, and extrapolate to the Shioda arm
        BEFORE running it; if the extrapolation exceeds the declared cap, the arm is not run
        and that is recorded as a measured infeasibility rather than attempted and abandoned.
        Tail check: report the largest |G| at which the full vector was recovered, and the
        largest at which only dim M^G was recovered. TRANSFER ASSUMPTION, STATED: a cost model
        fitted at |G| at most a few hundred extrapolated to |G| near 10^6 spans four orders of
        magnitude and is not licensed by anything measured; the cap exists because of that.

  target_complexity:
    time_exponent: >-
      NO CRYPTOGRAPHIC OR ASYMPTOTIC COMPLEXITY EXPONENT IS CLAIMED OR MOVED, AND THIS RECORD
      DOES NOT PRESENT ONE. What is claimed is a change of REGIME in the campaign's own search:
      the existing route prices base rank by exhibiting sections or running descent on each
      candidate twist, a cost linear in the number of twists with each term expensive; this
      route pays once per SURFACE for the character of M and then reads off every twist for
      free, a cost of O(|G| * r_geom^2) field operations for the traces plus O(|G|) per
      character for the orthogonality sums. At |G| near 10^6 and r_geom = 68 that is roughly
      10^10 elementary operations in the worst case, which is why the design caps the arm and
      extrapolates before running it.
    memory_exponent: >-
      O(r_geom^2) for the lattice plus O(|G|) for the class data; the binding term is the group
      presentation, not the module. Budget 8 GB peak RSS with a hard cap, against the 1.22 GB
      the predecessor campaign measured on this class of box.
    best_known: >-
      For the question "what is the arithmetic Mordell-Weil rank over Q(t) of a given
      high-geometric-rank surface", the best method known to this program before this session
      was: specialise at many rational t and take the minimum certified rank as an upper bound.
      DEC-20260825-a74c9e records that this program applied that procedure INVALIDLY (it needs
      an upper bound at each fibre and was fed a lower bound), and DEC-20260824-b7557b L5 used
      exactly it, on 31 specialisations, with no committed run record. The external best known
      is now Butler-Elsenhans arXiv:2601.17182, an algorithm rather than a sample. IN THIS
      REPOSITORY no instrument for the Galois action exists at all.
    hidden_overhead: >-
      Three disclosures. (1) The 829,440 is an EXTERNAL number this program has not reproduced;
      every downstream figure in the Shioda arm inherits its uncertainty entirely. (2) The
      abstract's scope phrase "any rational elliptic surface" is in tension with its own
      application to a degree-360 surface, and this session read only the abstract; if the
      algorithm is genus-1-only the arm collapses. (3) m_max is a CEILING on a lever, not a
      rank; the gap between "a character occurs with multiplicity m" and "a curve over Q has m
      independent points" contains an entire specialisation and certification pipeline that
      this record does not cost.
    tradeoff_note: >-
      Not a time-memory problem and there is no claw-finding or van Oorschot-Wiener position to
      state. The real trade is GROUP ORDER against COMPLETENESS OF THE ANSWER: at small |G| the
      full multiplicity vector is cheap; at large |G| only dim M^G, that is the descent index
      alone, may be affordable, which answers IDEA-20260824-248142's question but not this
      one's. Trivially parallel over conjugacy classes and over surfaces.

  dominated_by: >-
    FRONTIER ROWS CHECKED THIS SESSION ACROSS TIME, MEMORY AND DATA, AND TWO OF THEM DOMINATE
    THIS PROPOSAL ON PARTS OF ITS TERRITORY. (1) BUTLER-ELSENHANS THEMSELVES DOMINATE the
    instrument: the algorithm is theirs, it is implemented, and it has already been run on the
    exact surface this record's headline arm targets. This program would be reimplementing or
    licensing, and no algorithmic novelty is claimed. What is not dominated is the QUESTION
    asked of the output -- the multiplicity vector and m_max rather than the field degree --
    which their abstract does not state. (2) IDEA-20260824-248142 dominates on breadth: it
    proposes tabulating the descent index across ALL published high-geometric-rank families,
    where this record measures four surfaces; it is dominated in turn on instrumentation, since
    it names no method for computing the invariant rank and this record names one. (3)
    Obtaining the rank-17 K3 model from its author (resume condition R1) dominates on
    directness for the base-rank lane and is blocked on a human action this program cannot
    take. (4) IDEA-20260824-b26635 and IDEA-20260829-03235f dominate on a DIFFERENT lever --
    they raise chi by base change, where this record holds the surface fixed and moves within a
    fixed module -- and neither dominates the other; b26635 is additionally blocked on the same
    missing model. (5) A direct 2-descent on a specialisation answers a different question and
    is measured at 31 of 31 timeouts at coefficients four orders of magnitude smaller than the
    objects here. On the axis this record competes on -- pricing every twist of a fixed
    high-geometric-rank surface at once, with an in-repo positive control -- no row dominates
    it, because no row in this repository computes a Galois action at all.
  sota_delta: >-
    QUANTITATIVELY, AND MOSTLY NEGATIVE, WHICH IS THE HONEST FORM. Delta on rank over Q: ZERO.
    Delta on the world record: ZERO -- rank at least 31 over Q is a live claimed record held by
    others and nothing here touches it. Delta on generic rank over Q(t) held by this program:
    ZERO unless m_max turns out at least 9 on a surface with a realised rational twist, and the
    honest prior is that it will not. WHAT MOVES IS THE MEASUREMENT: the campaign's terminal
    obstruction is recorded at -15 units of Mordell-Weil rank, read off lane L6's ceiling of 17
    which itself rests on an input document with no run record; lane L5's descent collapse
    (geometric 15, arithmetic 0) rests on a 31-point sample on a model transcribed through a
    tool documented to drop exponents. This proposal replaces both with a computed integer per
    surface at a cost of roughly 10 to 70 CPU-hours, and delivers the question's second clause
    -- exactly which quantity blocks it -- as the isotypic concentration m_max with the
    deficit 32 - m_max stated over a named object. That is a change from "an obstruction read
    off a sample with no run record" to "an obstruction computed with a positive control", and
    it is smaller than it will be tempting to report.

  estimated_cost:
    implementation: high
    compute: medium
    basis: >-
      Implementation is honestly high and is the binding risk: either a Magma licence this
      program may not have, or an OSCAR reimplementation of a published algorithm from its
      abstract, plus a character-theory layer, plus the transcription-identity harness. Stages
      1 to 3 are affordable and independently valuable at roughly 10 CPU-hours; Stage 4 is
      capped at 60 CPU-hours and is NOT to be started without the Stage-2 cost extrapolation.
      Peak RSS budgeted at 8 GB with a hard cap.

  interpretation_limits:
    - >-
      THIS EXHIBITS NO CURVE AND CERTIFIES NO RANK OVER Q. Even a maximally favourable m_max
      leaves rank 32 over Q exactly as unexhibited as before; it would name a candidate object,
      not deliver a result, and GOAL-ECQ-2298dc C1 would be untouched.
    - >-
      A CEILING IS NOT AN ATTAINMENT AND A MULTIPLICITY IS NOT A RANK. m_max may not be cited
      anywhere as a Mordell-Weil rank, of anything, over any field.
    - >-
      Scoped to the surfaces in the declared test set, the declared rational twist families,
      the software stack actually used, and the geometric ranks with the provenance recorded
      for each. It bounds no surface outside that set and says nothing about non-abelian base
      changes or about covers of higher degree.
    - >-
      Rank at least 31 over Q is a LIVE CLAIMED RECORD held by others (ICARM curve no. 302,
      posted 2026-08-23). Nothing in this record is progress toward it or a restatement of it.
    - >-
      A negative m_max REPRICES the geometric-rank lane; it does not close it. Premature
      closure is a failure mode symmetric with overclaiming, and one surface, however large its
      geometric rank, is one surface.

  recommended_priority: high
  recommended_priority_basis: >-
    High on expected information gain per unit of decision value, NOT on probability of a
    positive. The expected outcome is m_max small, and that outcome is exactly the question's
    second clause delivered as a number over a named object. It is ranked below
    IDEA-20260829-073172 for FIRST TEST because its implementation risk is high and possibly
    licence-bound, and stages 1 to 3 should be funded independently of stage 4.

