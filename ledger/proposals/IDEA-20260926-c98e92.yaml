idea:
  id: IDEA-20260926-c98e92
  question_id: RQ-ICPERF-94c86e
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    THE SAME-UNIT EXCHANGE RATE: 64-bit word operations per field
    multiplication, per affine group addition and per W_4 refutation on the
    archived RC-1 instances, so that KN-FIND-5a8d3e's refutation rates and
    KN-FIND-aa2efc's per-attempt oracle budget (group-operation equivalents)
    are read on one axis for the first time, with the inversion model declared
    as a row rather than hidden in a constant
  class: measurement

  claim: >-
    CEILING FIRST. No exponent moves and no attack is claimed. Representation
    class R1 of RQ-ECDLP-623a32 (the abscissa in the polynomial basis of
    F_2[t]/(t^17 + t^3 + 1)); the attack stage whose charged cost is at issue is
    the PER-ATTEMPT DECOMPOSITION ORACLE, and the quantity supplied is a UNIT
    CONVERSION, not a cost reduction. Target arity: the instrument is
    m-agnostic; it is first exercised at m = 2 where the product law's budget is
    negative at every toy and deployed size, so the record cannot move a row
    and says so.

    THE GAP IT FILLS. Every ECC2K-130 arity row is priced in GROUP-OPERATION
    EQUIVALENTS per attempt (KN-FIND-aa2efc's budget column; the blind
    re-derivation's 2^5.73 at m = 4 under N = 4r; IDEA-20260926-4b65e3's
    corrected 2^11 to 2^50 at m = 4..16). Every measured refutation in this
    program (KN-FIND-5a8d3e at n = 17, KN-FIND-c3a917 at n = 19) is a RATE with
    no cost in any unit, and the one archived per-instance cost is wall-clock
    seconds of pure Python (RUN-CERTBIN-c417e0 closures.jsonl.gz,
    rec.wall_seconds). The review of IDEA-20260922-818b73 named this as the
    missing conversion. This record defines and measures it.

    THE INSTRUMENT, EXACTLY. Unit u = one 64-bit word XOR or AND (the closure's
    native operation: closure.py packs 4048 columns into 64 words per row and
    eliminates by row XOR). Three measured quantities per instance on the
    archived RC-1 bytes: (a) W_M4 = word operations of the plain M_4 column
    pass; (b) W_W4 = word operations of the W_4 closure up to and including the
    iteration whose echelon first contains 1 (unsatisfiable arm) or up to the
    fixpoint (satisfiable arm), counted as sum over pivots of |X| times the
    live word width; (c) W_add = word operations of one affine addition on
    E_{97044,126251}(F_{2^17}) under THREE declared inversion models, each a
    separate row rather than a hidden constant: (I-tab) exp/log table lookup,
    the RC-1 code path (TableField.div), (I-IT) Itoh-Tsujii with 4
    multiplications and 16 squarings at n = 17 (my arithmetic, recompute:
    floor(log2 16) + HW(16) - 1 = 4), (I-Fermat) pow(a, 2^17 - 2) as gf2n.Field
    does it, about 2 x 16 multiplications. A multiplication in word operations
    is the schoolbook clmul plus reduction actually executed (counted, not
    modelled); an affine addition is 1 inversion, 2 multiplications, 1
    squaring (curve.py add: one div, mul(lam, lam), mul(lam, x1 ^ x3); my
    reading of the code, recheck). The EXCHANGE RATE is kappa_add(model) =
    W_add in words; the ORACLE COST PER ATTEMPT in group-op equivalents is
    W_W4 / kappa_add(model), reported per model.

    WHAT IS PREDICTED, WITH NUMBERS (order-of-magnitude, MY ARITHMETIC,
    labelled estimates). M_4 at RC-1 is 2924 x 4048 (C-FIX); a column pass
    costs at most rows x rank x words = 2924 x 2924 x 64 = 5.5 x 10^8 words.
    The first mutant iteration stacks 18 x dim(M_4 cap B_{<=3}) products, and
    KN-FIND-5a8d3e measured that dimension at 964-978 on U62, so the stack is
    about 17,500 rows on top of the echelon; DEC-20260926-901ea1's red-team
    arithmetic gives the analogous n = 19 ratio 28631 / 4009 = 7.1 in rows.
    Hence P1: W_W4 / W_M4 in [3, 10] on U62. A schoolbook multiplication at
    n = 17 is about 17 shift-XOR steps plus reduction, order 30-60 words; so
    kappa_add is order 10^2 words under I-tab (three table lookups plus the
    packing), order 10^3 under I-IT, order 2 x 10^3 under I-Fermat. Hence P2:
    the W_4 refutation costs 2^19 to 2^24 group-op equivalents per attempt
    depending on the inversion model, against oracle A (512 quadratic
    root-findings, each one inversion, one squaring, a trace and a half-trace,
    order 4 multiplication-equivalents) at about 2^9 to 2^11 group-op
    equivalents. The predicted closure-to-oracle-A ratio is therefore in
    [2^8, 2^15]; the reading E-CLOSURE-CHEAP (ratio below 2^4) would mean the
    degree-4 mutant refutation is already competitive with exact root-finding
    at n = 17, which no record expects and which would re-rank
    IDEA-20260926-89886c's crossover l*. The record's honest prior is
    E-CLOSURE-EXPENSIVE.

    THE TOY BUDGET COLUMN IS NEGATIVE, AND THAT IS DISCLOSED. At RC-1, N =
    4 x 32603 = 2^16.99 and matched rho on the ordinary curve (negation only,
    k = 1, convention CORR-20260922-81aeab) is sqrt(pi x 32603 / 4) = 160
    group operations. The product-law floors (min over B of m! N / B^{m-1} +
    m B^2, my arithmetic) are about 2^13.2 at m = 2 (B = 40), 2^11.6 at m = 3
    (B = 23) and 2^10.8 at m = 4 (B = 16), all above 160: at toy N the linear
    algebra term N^{2/(m+1)} alone exceeds rho's N^{1/2} for every m <= 4. So
    gamma*(RC-1) is "none" at every m, exactly as at n = 131 for m <= 3, and
    this record's deliverable is the RATE, not a crossover. The ECC2K-130
    budgets are then read against a measured oracle in the same unit by
    transporting kappa_add(model) to n = 131 under H1 below, and the
    transported figure is labelled an extrapolation everywhere it appears.

  mechanism: >-
    OBJECT FRAME. Representation R1 as above; operation set Sigma = translation
    by factor-base elements (Class I, partial action, IDEA-20260806-c5d183),
    unchanged; this record adds no tracked object. TRICHOTOMY: not applicable
    to a unit instrument, stated rather than omitted. LOSSY-PROJECTION TEST:
    not applicable; nothing is projected. THE ONE OPEN NUMBER is kappa_add per
    inversion model and W_W4 per instance, both measured. WHY A RATE AND NOT A
    CONSTANT: the affine group operation's cost is dominated by the inversion,
    whose implementation varies by an order of magnitude at n = 17 (table
    lookup versus Fermat) and by another at n = 131 (no exp/log table fits;
    Itoh-Tsujii or batched Montgomery inversion, KR-RHO-cb1c58), so a single
    "8 multiplications per group operation" convention (IDEA-20260816-c1314e,
    H-ICEX-b2c8cf's kappa rows 1, 10, 100) hides the very quantity that decides
    whether a 2^11 budget is met. Reporting three rows makes the model a
    visible input. WHY WORD OPERATIONS: it is the only unit in which the
    closure (row XORs), the field arithmetic (clmul shift-XORs) and a rho step
    (the same field arithmetic) are all counted rather than timed, so the
    number reproduces on any host; wall-clock on one host is reported beside
    it as the secondary unit RQ-ICPERF-94c86e already prescribes.
    OFF-LIMITS COMPONENTS: F2 as the family (the oracle being priced is an F2
    solver); F1 enters only as the unit (one group operation); nothing added
    to either.

  novelty_status: unverified

