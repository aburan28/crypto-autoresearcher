  assumptions:
    - >-
      The archived RC-1 instance bytes (RUN-CERTBIN-3b7e05 targets and
      p1-instances, hash-bound by RUN-CERTBIN-c417e0 inputs.json) are reused
      as literal inputs; no instance is redrawn.
    - >-
      A word operation is a 64-bit XOR or AND on packed rows or on packed
      field elements; Python interpreter overhead is not a word operation and
      is reported only through the secondary wall-clock column.
    - >-
      The three inversion models are rows, not a choice; a reader picks the
      row matching the implementation being priced.
    - >-
      OFF-LIMITS COMPONENT DECLARED: F2 (the oracle priced) and F1 (the unit).

  proof_search_map:
    bottleneck: >-
      The conversion between the unit of every measured refutation cost in
      CERTBIN (word operations or seconds of a closure) and the unit of every
      ECC2K-130 budget (group-operation equivalents), without which the budget
      column cannot be compared to any oracle this program has run.
    baseline_embedding:
      parameter_slice: >-
        The RC-1 cell itself: the archived M_4 ranks and W_4 labels of
        RUN-CERTBIN-c417e0 must be reproduced exactly by the instrumented
        closure before any count is read (C-BASE analogue).
      reproduction_check: >-
        Frozen fixture: labels, iteration counts and dimensions identical on
        all 62 U62 and 62 S62 instances; the field self-test of C-SELF
        (10^4 triples, S_3 against point addition on 10^3 pairs) rerun with the
        counter active and the counts reported.
    observation_collision:
      observable: >-
        The pair (W_W4, kappa_add) per instance and model, plus wall-clock on
        the host.
      distinct_preimage_search: >-
        Two implementations with the same wall-clock could have different word
        counts (numpy vectorisation hides operations) and two with the same
        word count different wall-clocks (interpreter overhead); reporting both
        columns is what separates the two, and any pair where the wall-clock
        ratio and the word ratio differ by more than 8x is flagged as an
        instrument reading rather than a cost.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A per-instance cost record with fields W_M4, W_W4 (to first 1, and
          to fixpoint), kappa_add per model, W_oracleA, wall_seconds, host,
          added over the disjoint blocks (elimination, field arithmetic).
        predicted_gain: >-
          The first same-unit oracle cost per attempt at any CERTBIN cell; no
          cost gain.
    quantifier_order: >-
      FOR the RC-1 cell and the archived instance sets, FOR EACH of the three
      inversion models, the measured kappa_add and W_W4 are as reported;
      EXISTS no claim about any other cell; the transport to n = 131 is an
      extrapolation under H1 only.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At RC-1, one W_4 refutation costs W words (distribution over U62),
        one affine addition costs kappa_add(model) words, so the oracle costs
        W / kappa group-op equivalents per attempt under each model." It
        certifies nothing about n = 131 and nothing about SAT or Groebner
        engines.
      nearby_object_control: >-
        Oracle A (exact root-finding) on the same instances is the object
        where the closure's cost must NOT look competitive; the same-support
        null (N-F262) is the object where W_4 never reaches 1 and runs to the
        fixpoint, giving the fixpoint cost as a ceiling.
    proof_obligations:
      - claim: The operation counter reproduces every archived label, rank and iteration count.
        responsibility: baseline
      - claim: W_add per model equals the counted operations of the code path actually executed, not a formula.
        responsibility: correctness
      - claim: Word operations are host-independent (identical counts on two hosts) and wall-clock is reported separately.
        responsibility: runtime
      - claim: No figure at n = 131 is presented without the H1 label.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: W_W4_over_W_M4 (dimensionless, per U62 instance)
      direction: higher
      minimum_effect: 'in [3, 10] for at least 56 of 62 instances (first mutant iteration stack about 6x the echelon in rows; estimate)'
    - metric: closure_to_oracleA_ratio (group-op equivalents per attempt, per inversion model)
      direction: higher
      minimum_effect: 'in [2^8, 2^15] under every model (E-CLOSURE-EXPENSIVE); below 2^4 is E-CLOSURE-CHEAP and re-ranks IDEA-20260926-89886c'
    - metric: kappa_add_spread (max over models / min over models)
      direction: higher
      minimum_effect: 'at least 8x between I-tab and I-Fermat at n = 17, which is why the model is a row'
    - metric: cv_W_W4_U62 (coefficient of variation of W_W4 over U62)
      direction: lower
      minimum_effect: 'below 0.25 (every U62 refutation is at iteration 1 with near-identical stack sizes)'
    - metric: host_reproducibility (word counts on two hosts)
      direction: same
      minimum_effect: 'identical to the last word; wall-clock ratios may differ by up to 4x and are reported, not averaged'

  minimal_test:
    design: >-
      CELL. RC-1: n = 17, f = t^17 + t^3 + 1, A = 97044, B = 126251, #E = 4 x
      32603, m = 2, l = 9, V = {deg < 9}; instance sets U62, S62, C20, N-AFF62,
      N-F262 of RUN-CERTBIN-c417e0 by their archived keys. INSTRUMENT.
      experiments/EXP-CERTBIN-e94b27/impl/closure.py with a word-operation
      counter added to echelon() (sum of |X| x live words per pivot, about 15
      lines); gf2n.py Field.mul_school and TableField instrumented with a
      shift-XOR counter (about 20 lines); curve.py add() counted under the
      three inversion models (about 40 lines); oracles_rc1.py oracle A counted
      the same way. Nothing missing. PROCEDURE. (1) C-BASE regression with the
      counter active. (2) Count W_M4 and W_W4 (to first 1 and to fixpoint) on
      every instance of every set. (3) Count kappa_add under I-tab, I-IT,
      I-Fermat on 10^4 random point pairs (seed recorded) and W_oracleA on the
      144 subgroup targets. (4) Repeat step 2 on a second host for the 10
      lowest-idx U62 instances (host-reproducibility check). (5) Tabulate
      the three-model exchange-rate rows and the per-attempt oracle cost in
      group-op equivalents; append the transported n = 131 row under H1 with
      its label. SEEDS: one PCG64 stream for the point pairs, recorded; every
      instance is archived. METRICS with units: W_M4, W_W4 (64-bit word
      operations); kappa_add per model (words); W_oracleA (words);
      closure_to_oracleA_ratio (group-op equivalents, dimensionless);
      wall_seconds per instance (secondary). CONTROLS. Null object: the
      same-support nulls N-AFF62 and N-F262 (W_4 runs to the fixpoint; the
      fixpoint cost bounds the refutation cost from above). Ordinary-curve
      control: RC-1 is ordinary; the n = 17 Koblitz sibling y^2 + xy = x^3 +
      x^2 + 1 (#E = 2 x 65587, hand-derived in IDEA-20260926-89886c, recount
      at setup) gives kappa_add on a Koblitz-form curve, predicted identical
      to the word (the addition law does not read a or b beyond one XOR). No
      relabelled Z/NZ control: no group-structure claim is made. OUTCOME
      TABLE. POSITIVE: the rows exist, C-BASE passes, the U62 CV is below 0.25
      and the closure-to-oracle-A ratio lands in the pre-registered band; the
      boundary table gains its unit row and every later CERTBIN cost is
      reported in it. NEGATIVE: the ratio lands below 2^4 (E-CLOSURE-CHEAP) or
      above 2^18; either is informative and re-prices 89886c's crossover; the
      rate itself still stands. ARTIFACT: C-BASE mismatch, or word counts
      differing between hosts, or the wall-clock/word ratio differing by more
      than 8x between M_4 and W_4 (vectorisation hiding operations): the
      counter is wrong; nothing is read. FALSIFICATION THRESHOLD, FIXED NOW:
      E-CLOSURE-EXPENSIVE is falsified iff the closure-to-oracle-A ratio is
      below 2^4 under the I-Fermat model (the model most favourable to the
      closure). COST (estimate): implementation low (about 80 lines on the
      existing modules); compute about the cost of one RC-1 W_4 pass, minutes
      to an hour of pure Python.
    controls:
      - 'C-BASE regression on all archived labels, ranks, iterations and dimensions before any count is read.'
      - 'Same-support nulls N-AFF62 and N-F262 as the fixpoint-cost ceiling.'
      - 'Koblitz-form n = 17 sibling for kappa_add (predicted identical to the ordinary curve to the word).'
      - 'Two-host reproduction of word counts on 10 instances; wall-clock reported beside, never substituted.'
      - 'Three inversion models reported as rows; no single kappa is quoted alone.'
    required_metrics:
      - 'W_M4, W_W4 per instance (64-bit word operations), to first 1 and to fixpoint'
      - 'kappa_add per inversion model (words) with the 10^4-pair mean and spread'
      - 'W_oracleA per target (words)'
      - 'closure_to_oracleA_ratio per model (group-op equivalents)'
      - 'wall_seconds per instance and host; host identity'
      - 'the transported n = 131 row under H1, labelled'

  falsification_conditions:
    - 'E-CLOSURE-EXPENSIVE falsified iff closure_to_oracleA_ratio < 2^4 under I-Fermat on the U62 median.'
    - 'The unit is unstable iff cv_W_W4_U62 > 0.5 or the two-host word counts differ; then no rate is filed and the defect is localised first.'
    - 'P1 falsified iff fewer than 56 of 62 U62 instances have W_W4 / W_M4 in [3, 10]; the band is re-derived from the measured stack sizes and the record is superseded, not edited.'

  confounders:
    - >-
      numpy vectorisation executes word operations the counter must count
      explicitly from |X| and the width; a counter that reads wall-clock
      instead would import interpreter overhead.
    - >-
      The exp/log table inversion exists only at toy n; the I-tab row does not
      transport to n = 131 and is marked so; I-IT and batched inversion
      (KR-RHO-cb1c58) are the deployable rows.
    - >-
      W_W4 "to first 1" depends on the column order within the iteration; the
      iteration count and dimensions do not (least fixpoint), so both are
      reported.

  interpretation_limits:
    - 'One cell, one closure family, one field size. A rate at n = 17, transported to n = 131 only under H1 with its label.'
    - 'The toy budget column is negative at every m <= 4 at RC-1; this record cannot exhibit a crossover and does not try.'
    - 'KN-OPEN-020 class of V: scoped-out linear subspace, inherited.'
    - 'No statement about SAT or Groebner engines; their units (conflicts, F4 matrix operations) need their own rows.'

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Rate transport.) kappa_add(model) at n = 131 equals the counted
        n = 17 value scaled by the schoolbook multiplication cost ratio
        (about (131/17)^2 for shift-XOR clmul, about 60x) and the inversion
        model's multiplication count at n = 131 (Itoh-Tsujii: 8 multiplications
        and 130 squarings, my arithmetic, recompute), so that a budget of 2^b
        group-op equivalents at ECC2K-130 is 2^b x kappa_add(131, model) words.
      rigorous_support: >-
        Exact for the schoolbook operation count as a function of n (a
        derivation from the code path); the heuristic content is only that
        the same code path is the one being priced at n = 131, which is a
        declared model, not a fact about any implementation.
      validation_plan: >-
        SAMPLE: run the instrumented gf2n.Field at n in {17, 19, 23, 31, 61}
        with the schoolbook path and count words per multiplication and per
        inversion under I-IT and I-Fermat. COMPARISON: least-squares slope of
        log2 words against log2 n, predicted 2.0 for multiplication and 2.0
        plus the log-factor for inversion. TAIL: the n = 61 point against the
        fitted line. TRANSFER: only the code-path law transfers; any figure
        at n = 131 is labelled extrapolation.

  heuristic_note: >-
    Everything measured is exact counting on archived instances; H1 governs
    only the transported n = 131 row, which is decorative until an oracle at
    n = 131 exists.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES. The record converts units; at RC-1 the W_4 refutation
      is predicted to cost 2^19 to 2^24 group-op equivalents per attempt
      against oracle A's 2^9 to 2^11 and against a toy rho of 160 group
      operations.
    memory_exponent: Unchanged; the counter adds nothing to the closure's bit-packed footprint.
    best_known: >-
      Matched rho 2^60.81 on ECC2K-130 (KN-FIND-aa2efc, CORR-20260922-81aeab);
      160 group operations at RC-1.
    hidden_overhead: >-
      Interpreter overhead is deliberately excluded from the primary unit and
      appears only in wall-clock; a compiled closure changes the constant, not
      the count.
    tradeoff_note: Not applicable.

  estimated_cost:
    implementation: low
