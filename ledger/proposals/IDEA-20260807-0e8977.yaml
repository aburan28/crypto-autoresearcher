idea:
  id: IDEA-20260807-0e8977
  question_id: RQ-MTGT-2cabee
  added: '2026-08-07'
  title: >-
    THE TRANSPORT NULL BATTERY: a five-arm dose-response instrument whose null
    for "transport preserved the table's value" is a RANDOMLY RELABELLED TABLE OF
    IDENTICAL SIZE, whose decay parameter is the mixing fraction alpha of
    genuinely transported entries, and whose acceptance criterion is that
    retention be AFFINE IN alpha with slope 1 and intercept 1/N -- the instrument
    that EXP-ISADV-001 lacked, and without which no retention number produced by
    this lane may be believed
  class: control

  claim: >-
    (A) WHY AN INSTRUMENT PROPOSAL IS NEEDED HERE AND NOT ELSEWHERE. This lane's
    central measurement is a RETENTION RATE: what fraction of a preprocessing
    table's value survives being moved to another curve. Retention rates are the
    most artifact-prone quantity in this campaign, for a specific reason: THE
    TRUE ANSWER IS AT ONE OF THE TWO ENDPOINTS. Group-valued preprocessing
    retains 1.000; encoding-valued preprocessing retains the chance baseline
    (IDEA-20260807-e0ddc6). An instrument that returns 1.000 because it is
    comparing an object with itself, or returns the chance baseline because it
    silently failed to apply any map, produces EXACTLY THE EXPECTED NUMBER while
    measuring nothing. That is not hypothetical: experiments/EXP-ISADV-001/
    advice_transfer.py, read in full for this batch, applies no isogeny anywhere
    in its computation and returned the chance baseline, and its result was
    recorded as "A2 weakened, scoped negative on transfer"
    (research_directions_20260718.md section 9.1;
    outputs/prior_proposals_digest.md). The number was right and the reading was
    an over-read, and no control in that script could have caught it -- its
    controls were a positive control on the SAME curve and a uniform-random
    negative, neither of which tests whether a map was applied.

    (B) THE INSTRUMENT. Five arms, run on identical instances, identical table
    size S, identical value predicate v, identical certification code path:
      ARM T (treatment): A' = {(phi(R_i), r_i)} for a CERTIFIED F_p-isogeny phi
        with gcd(deg phi, N) = 1.
      ARM N1 (the mandated null): A' = {(sigma(R_i), r_i)} for sigma a uniformly
        random bijection G -> G'. SAME SIZE, SAME SCALARS, NO MAP.
      ARM N2 (scalar shuffle): A' = {(phi(R_i), r_{pi(i)})} for pi a uniform
        permutation. SAME POINTS AS ARM T, scrambled logs.
      ARM N3 (no-map, EXP-ISADV-001 reconstruction): A' built from an
        independently chosen generator on E' with no correspondence to P. This
        arm EXISTS SO THAT THE PRIOR RESULT CAN BE REPRODUCED INSIDE THE NEW
        INSTRUMENT and shown to be a different arm from ARM T.
      ARM P (planted positive): A' = A on the SAME curve (phi = identity).
        Retention must be 1.000 by construction; an instrument that fails here
        is broken before any curve is changed.
    ACCEPTANCE, PRE-REGISTERED: ARM P = 1.000; ARM T = 1.000; ARM N1 = ARM N2 =
    ARM N3 = 1/N, all three statistically indistinguishable from each other. If
    ARM T does not separate from ARM N1 by more than 0.999 in retention, the
    instrument has not demonstrated that it can see transport at all, and every
    downstream number in lane L13 is void.

    (C) THE DECAY TEST, WHICH IS THE PART THAT MAKES IT A CONTROL AND NOT A
    CHECKLIST. Define ARM T(alpha): a table in which a uniformly random alpha
    fraction of entries are transported by the true phi and the remaining
    1 - alpha are relabelled by a uniform sigma. Then, exactly,
      E[retention(alpha)] = alpha * 1 + (1 - alpha) * (1/N),
    an AFFINE function of alpha with slope 1 - 1/N and intercept 1/N. This is not
    a heuristic prediction; it is arithmetic, and it gives the instrument a
    KNOWN-ANSWER CALIBRATION CURVE rather than two endpoints. Sweep
    alpha in {0, 0.125, 0.25, 0.5, 0.75, 1}. Fit. Required: slope in
    [0.95, 1.05], intercept below 2/N, R^2 >= 0.99. A retention that does not
    fall as alpha falls is the canonical artifact tell
    (docs/inventor-protocol.md, controls before belief), and here it has an
    exactly known target rather than a qualitative direction.

    (D) THE SECOND DECAY AXIS, FOR THE CLASS II CLAIM. For encoding-valued
    predicates the claim is DESTRUCTION, and destruction needs its own
    dose-response or it cannot be distinguished from "the instrument never
    applied a map". Decay parameter: ell, the isogeny degree, swept over
    {1, 2, 3, 5, 7, 11} plus composite paths of length L in {1, 2, 3}. At ell = 1
    the map is an F_p-isomorphism x -> u^2 x and a DILATION-INVARIANT predicate
    must retain EXACTLY, giving a rigorous positive control; at ell >= 2
    retention must fall to the chance baseline and STAY there. A Class II
    statistic that is at chance already at ell = 1 proves the map was never
    applied -- which is precisely EXP-ISADV-001's failure mode, now detectable.

    (E) THE CERTIFICATE LAYER. Every retention count is a count of entries
    passing an INDEPENDENT check, not a count of entries the transport code
    believed it produced. The check for a known-log entry is
    [r_i] phi(P) == phi(R_i), recomputed by a scalar multiplication that does not
    call the transport routine. The check for the isogeny itself is:
    phi(P) != O, [N]phi(P) == O, phi(Q) == [k]phi(P) for the known toy k, and
    deg phi as declared. Per docs/claims-and-verification.md the wrapper
    re-verifies these independently of the solver. An arm whose isogeny
    certificate fails is INVALID (AGENTS.md rule 5), never a negative.

  resource_label: >-
    audit: consumes no resource. The instrument exists to make the R8/R4 claims
    of IDEA-20260807-a127ab and IDEA-20260807-e0ddc6 citable; it asserts no
    mechanism of its own.

  admissibility: admissible

  admissibility_argument: >-
    A control lane consumes no resource and therefore cannot fail the
    admissibility filter of DECOMPOSITION.md section 2 -- the filter closes lanes
    that claim an advantage from a GGM-simulable resource, and this lane claims
    no advantage. It is admissible in the same sense as L14
    (RQ-INSTR-f8faa0): it is what makes the other lanes' negatives mean anything.
    Recorded explicitly rather than left implicit, because a control that quietly
    reintroduces the treatment's assumption is the most common way a null battery
    fails, and the arms above are constructed so that no arm depends on the
    transport routine being correct.

  discriminated_from:
    - >-
      EXP-ISADV-001 / advice_transfer.py -- its controls are (i) a positive
      control on the SAME curve with the SAME generator, (ii) an out-of-window
      relabelled control on the same curve, (iii) a uniform-random-x negative.
      NONE of them tests whether a map between curves was applied, which is the
      only thing this lane needs tested. ARM N3 reconstructs its measurement
      inside the new battery so the two can be compared directly.
    - >-
      Lane L14 (RQ-INSTR-f8faa0) -- the campaign's general instrumentation lane.
      This record is the L13-specific specialisation: the general lane requires
      "a null object of the same shape and a decay test", and this record names
      the shape (a size-matched relabelled table), the decay parameter (alpha),
      and the exact affine calibration curve. It should be read as an instance of
      L14's requirement, not a competitor to it.
    - >-
      H-MTIC-001's non-interference control (content-hash equality of the
      factor-base log table under permuted and withheld targets). That control
      answers "did preprocessing peek at the targets"; this battery answers "did
      transport actually happen". Both are required and neither substitutes for
      the other; this record adopts the former unchanged as a sixth check.
    - >-
      IDEA-20260807-e0ddc6 -- states the dichotomy and its per-class nulls. This
      record supplies the shared instrument, the alpha calibration curve and the
      certificate layer that both e0ddc6 and a127ab depend on.

  object_first_candidate:
    tracked_object: >-
      THE RETENTION RATE ITSELF, as a function of (alpha, ell, L, arm) -- the
      measurement is the object, followed across a designed grid rather than
      reported at one cell.
    lossiness: >-
      Extremely lossy: a whole table, curve and map collapse to one number in
      [0, 1]. Deliberately so, because the point is that this one number has a
      KNOWN functional form under the null and under the treatment, and a
      measured surface that departs from both is an instrument fault rather than
      a finding.
    propagation: >-
      LOSSY-PROJECTION TEST: retention propagates deterministically under the
      alpha mixture because expectation is linear -- mixing two arms mixes their
      retentions affinely, exactly. That is the compatibility this object needs
      and it is why alpha is the right decay parameter rather than, say, table
      size. Under the ell axis the propagation is NOT deterministic for Class II
      predicates, which is the whole content of the Class II prediction, and the
      record says so instead of pretending the two axes are the same kind of
      thing.
    survival_score: >-
      The alpha calibration survives any table, any curve, any predicate and any
      scale, because it is arithmetic. The ell decay survives only as far as the
      Class II prediction does. The instrument is designed so that a failure of
      the first invalidates everything and a failure of the second is a finding.

  mechanism: >-
    STEP 1 -- FREEZE THE VALUE PREDICATE AND THE CERTIFICATE. Before any run,
    write down v (known-log pairing; DP predicate; box membership) and the
    independent check for each. Freeze the encoding of a table entry.
    STEP 2 -- BUILD THE POSITIVE CONTROL FIRST. ARM P with phi = identity.
    Retention must be exactly 1.000 and the certificate path must be exercised.
    If not, stop.
    STEP 3 -- BUILD THE NULL FIRST, TREATMENT SECOND. Run ARM N1, N2, N3 before
    ARM T is implemented, and record their retentions. This ordering is
    deliberate: it prevents the treatment's implementation from being tuned until
    it "beats" the null.
    STEP 4 -- CERTIFY THE ISOGENY. Only then construct phi and run its
    certificate (phi(P) order N, phi(Q) == [k]phi(P), declared degree). Record
    the certificate as an artifact.
    STEP 5 -- ARM T AND THE alpha SWEEP. Run ARM T(alpha) at the six declared
    alpha values, five seeds each. Fit retention against alpha; check slope,
    intercept, R^2 against the pre-registered thresholds.
    STEP 6 -- THE ell SWEEP for Class II predicates, with the ell = 1
    dilation-invariance positive control.
    STEP 7 -- PLANTED-SIGNAL DETECTION IN THE ADVERSARIAL DIRECTION. Deliberately
    break the transport (e.g. use phi's x-map but the wrong y, or use a map of
    degree sharing a factor with N) and confirm the instrument reports failure
    rather than silently producing high retention. An instrument that cannot
    detect a broken map is not a control.
    STEP 8 -- ADOPT H-MTIC-001's NON-INTERFERENCE RECEIPT: content-hash the
    table before any target is disclosed, under permuted target order, and under
    a withheld target, and require equality.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Run 2026-08-07. Commands:
      (1) grep -rn "null object\|null_object_control" ledger/ docs/ | count
      (2) grep -rn "dose.response\|decay parameter" -i ledger/ docs/
      (3) grep -rn "ISADV" . and full read of advice_transfer.py
      (4) grep -rn "non-interference" ledger/hypotheses/
      (5) read docs/inventor-protocol.md section 3 obligations via KN-TECH-056.
    results: >-
      (1) null_object_control is a mandated field across the batch and appears
      throughout the proposal ledger; ZERO records supply an EXACT calibration
      curve for the null-to-treatment mixture.
      (2) "decay parameter" appears as a requirement, not as an instantiated
      affine calibration.
      (3) advice_transfer.py has three controls, none of which tests map
      application; the experiment has no contract.md and no ledger record
      (ideas/catalogue-20260805/SCREENING.md line 175).
      (4) H-MTIC-001 carries the content-hash non-interference receipt, adopted
      here unchanged.
    verdict: >-
      ADAPTATION. The five-arm design is standard experimental practice and the
      alpha calibration is elementary probability. What is new to this program is
      the specific instantiation for isogeny transport, the pre-registered affine
      acceptance criterion, and the reconstruction of the prior null (ARM N3)
      inside the same instrument so the two can be told apart.

  null_object_control: >-
    THIS RECORD IS THE NULL OBJECT CONTROL. Restated so it is not lost in the
    body: the null for "transport preserved the table's value" is A RANDOMLY
    RELABELLED TABLE OF IDENTICAL SIZE -- same S, same scalars, same value
    predicate, same certification code, uniform random bijection sigma: G -> G'
    in place of phi|_G (ARM N1). The decay parameter is alpha, the mixing
    fraction of genuinely transported entries; retention must be affine in alpha
    with slope 1 - 1/N and intercept 1/N, fitted with R^2 >= 0.99. A retention
    that fails to fall as alpha falls voids the run set. The battery's own null
    is ARM P (identity map), which must return exactly 1.000, and its own
    adversarial control is Step 7's deliberately broken map, which must be
    detected.

  assumptions:
    - >-
      A uniformly random bijection G -> G' is samplable at toy scale by
      permuting an explicit list of the N group elements. At crypto scale it is
      not, and the null would have to be simulated lazily; this is a toy-scale
      instrument and the record says so.
    - >-
      The chance baseline for a known-log pairing is 1/N. At N ~ 2^{10} that is
      ~0.001, so with S = 256 entries and 5 seeds the expected number of
      accidental passes under ARM N1 is ~1.25. The battery must report EXACT
      counts, not rounded rates, or the null cannot be distinguished from zero.
    - >-
      Retention is measured by a certificate path that does not call the
      transport routine. Enforced by code review as part of the completion gate,
      not assumed.
    - >-
      Toy scale, claim_tier: toy. The instrument validates itself at toy scale
      and licenses no crypto-scale statement.

  proof_search_map:
    not_applicable_reason: >-
      This is a purely empirical instrument proposal. It states no theorem, no
      asymptotic bound, no certificate family beyond the elementary
      [r]phi(P) == phi(R) check already implied by T1, and no reduction. The one
      quantitative claim it makes -- that retention is affine in alpha with
      slope 1 - 1/N -- is linearity of expectation over a two-component mixture
      and is verified by the fit itself rather than argued. Recorded rather than
      omitted, per docs/inventor-protocol.md section 8.

  predictions:
    - metric: ARM P retention (identity map)
      direction: higher
      minimum_effect: EXACTLY 1.000. Anything else halts the line before ARM T runs.
    - metric: ARM N1 retention (random relabelling, size-matched)
      direction: lower
      minimum_effect: >-
        Exact pass count consistent with Binomial(S * seeds, 1/N) at the 99%
        level. A count above that is an instrument leak -- most likely the
        certificate path calling the transport routine -- and voids the battery.
    - metric: ARM T minus ARM N1 retention gap
      direction: higher
      minimum_effect: >-
        >= 0.999. A smaller gap means the instrument cannot see transport and no
        L13 retention number may be reported.
    - metric: fitted slope of retention against alpha
      direction: different
      minimum_effect: >-
        In [0.95, 1.05] with intercept < 2/N and R^2 >= 0.99. Outside that band
        the retention statistic is not measuring the mixture it claims to and
        every downstream figure is void.
    - metric: ell = 1 dilation-invariant Class II retention
      direction: higher
      minimum_effect: >-
        Exactly 1.000 for a dilation-invariant predicate under an F_p-isomorphism
        x -> u^2 x. A value at chance here PROVES no map was applied and is the
        detector for the EXP-ISADV-001 failure mode.
    - metric: Step 7 broken-map detection rate
      direction: higher
      minimum_effect: >-
        1.000 -- every deliberately broken map must be caught by the isogeny
        certificate. A single miss means the certificate is not load-bearing.

  minimal_test:
    design: >-
      STAGE 0 (minutes): ARM P on one toy curve at p ~ 1009 with S = 64. Must
      return 1.000.
      STAGE 1 (minutes, THE CHEAPEST VALID CHECK IN THE LANE): ARM N1 and ARM T
      on one ell = 2 isogeny, S = 64, 3 seeds. Two numbers. If the gap is not
      >= 0.999 the whole lane stops here at a cost of seconds.
      STAGE 2 (minutes): the alpha sweep and the affine fit.
      STAGE 3 (minutes): ARM N2, ARM N3, and the ell = 1 dilation control.
      STAGE 4 (minutes): Step 7 broken-map detection.
      STAGE 5 (low hours): repeat the whole battery at p in {2^{12}, 2^{16},
      2^{20}} and 5 seeds, and archive it as the reusable fixture that every
      later L13 run must pass before its numbers are admitted.
    controls:
      - ARM P identity-map positive control
      - ARM N1 random relabelling, size-matched (THE mandated null)
      - ARM N2 scalar shuffle
      - ARM N3 no-map reconstruction of EXP-ISADV-001
      - ell = 1 dilation-invariance positive control
      - deliberately broken map (adversarial detection control)
      - H-MTIC-001 content-hash non-interference receipt
    required_metrics:
      - exact certificate pass COUNTS per arm per seed, not rates
      - fitted slope, intercept and R^2 of retention against alpha
      - isogeny certificate outcome per constructed phi
      - retention against ell and against path length L
      - broken-map detection outcome per injected fault
      - wall clock and peak memory per arm

  falsification_conditions:
    - >-
      ARM P returns anything other than 1.000. Instrument broken; nothing
      downstream is admitted.
    - >-
      ARM N1 passes above the Binomial(S*seeds, 1/N) 99% level. The certificate
      path is leaking; the battery is INVALID, not negative.
    - >-
      The ARM T minus ARM N1 gap is below 0.999. The instrument cannot see
      transport. This is the outcome that closes the lane on instrument grounds
      rather than on mathematics, and it must be reported as such.
    - >-
      The alpha fit misses the pre-registered band. Retention is not the mixture
      statistic it is claimed to be.
    - >-
      Any deliberately broken map goes undetected by the isogeny certificate.
    - >-
      Runs exceed budget before the battery completes. INFRASTRUCTURE outcome
      (AGENTS.md rule 5), recorded as such, not as a negative on transport.

  confounders:
    - >-
      SELF-COMPARISON. The single most dangerous failure is a transport routine
      that returns its input, making ARM T identical to ARM P. Detected by
      requiring phi(P) != P and by checking that the j-invariant of E' differs
      from that of E.
    - >-
      CERTIFICATE PATH REUSE. If the check calls the same code that produced the
      transported point, retention is 1.000 by construction. Enforced by code
      review; the check must recompute [r]phi(P) from phi(P) alone.
    - >-
      SMALL N INFLATING THE NULL. At p ~ 101 the chance baseline 1/N ~ 0.01 is
      not negligible against S = 64. Minimum p for any reported figure is set so
      that S/N < 0.01.
    - >-
      SEED CORRELATION. Using the instance seed to draw both phi and sigma
      correlates treatment and null. Separate seed streams are mandatory and
      recorded.
    - >-
      ISOMORPHIC CLASSMATES. A toy class may contain curves that are
      F_p-ISOMORPHIC rather than genuinely isogenous, which silently makes ARM T
      an ell = 1 arm. j-invariants must be recorded per member and distinct.

  interpretation_limits:
    - >-
      Passing the battery proves the instrument works. It proves nothing about
      transport, about the isogeny class, or about the ECDLP. Its entire value is
      that a later negative from this lane becomes citable and a later positive
      becomes suspect until it passes.
    - >-
      Toy scale only, claim_tier: toy. A crypto-scale null cannot be sampled by
      this design (a uniformly random bijection on 2^{256} elements is not
      materialisable) and the record does not pretend otherwise.
    - >-
      ARM N3 reproducing EXP-ISADV-001's chance-baseline result is NOT a
      criticism of that experiment's execution, which was correct. It is a
      correction of the READING recorded downstream of it.

  reachability_gate: >-
    MINIMAL. The battery needs one isogeny of small degree out of one curve, plus
    one F_p-isomorphism for the ell = 1 arm. No SPECIFIED classmate must be
    reached, so the vectorization hardness in T5 does not bind. Cost: one
    kernel-subgroup search plus one Velu construction per degree, O(ell^3) field
    operations in the conservative ordinary-curve model
    (research/JMV004_branch_a_scouting_20260726.md, labelled SCOUTING there and
    used here only as a conservative bound). At toy scale the class is fully
    enumerable so paths can be found by breadth-first search, and the gate is
    satisfied by construction.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. This record produces no algorithm. Its own
      cost is O(S) certificate checks per arm times 6 alpha values times 6 ell
      values times 5 seeds, i.e. a few hundred thousand scalar multiplications at
      toy sizes.
    memory_exponent: >-
      O(S) for the table plus O(N) for the explicit group element list needed to
      sample the uniform bijection null -- the O(N) term is what caps the
      instrument at toy scale and is disclosed as the binding constraint.
    best_known: >-
      Unchanged and untouched: parallel rho at 0.886*sqrt(N) with O(1) memory
      (KN-TECH-001, KN-TECH-006), automorphism-discounted on CM curves
      (KN-TECH-018), BSGS at sqrt(N)/sqrt(N) with N^{2/3+o(1)} full cost
      (KN-TECH-031, KN-TECH-035), Bernstein-Lange preprocessing at
      S = T = N^{1/3} on the Corrigan-Gibbs--Kogan frontier (KN-LIT-013).
    hidden_overhead: >-
      The O(N) explicit-group-list requirement for the exact uniform null is the
      hidden cost, and it is the reason the battery is toy-only. A lazy null
      (sample sigma on demand) would remove it but would also weaken the
      guarantee that sigma is uniform; the record chooses the exact null and
      accepts the scale cap.
    tradeoff_note: >-
      Not applicable -- no attack, no tradeoff. Recorded because the field is
      required.

  dominated_by: >-
    AS AN ATTACK: mounts none; dominated on every axis by every frontier row --
    parallel rho (time sqrt(N), memory O(1)), automorphism-discounted rho, BSGS
    (sqrt(N)/sqrt(N), full cost N^{2/3+o(1)}), Bernstein-Lange preprocessing
    (N^{1/3}/N^{1/3}), Kuhn-Struik multi-target rho (sqrt(M*N)). Checked across
    time, memory and data/queries.
    AS AN INSTRUMENT: the incumbent is experiments/EXP-ISADV-001/
    advice_transfer.py, which has 3 controls, 372 samples, 3 primes, no isogeny,
    no contract and no ledger record. This battery dominates it on every axis
    that matters for this question (map-application detection, calibration curve,
    certificate independence) and is dominated by it on setup cost only. It is
    also strictly weaker than lane L14's general programme, which it should be
    read as an instance of rather than a substitute for.
  sota_delta: >-
    ZERO against every attack baseline; a control cannot produce a speedup.
    Instrument delta, quantitatively: adds 4 arms the incumbent lacked (random
    relabelling, scalar shuffle, identity positive control, broken-map
    adversarial control); adds 1 exact calibration curve with 6 dose levels where
    the incumbent had 2 endpoints; adds 1 independent certificate path per entry;
    and converts 1 prior scoped negative from "advice does not transfer" to
    "one encoding-valued object, moved by no map, did not transfer".

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.95 that the battery passes its own acceptance criteria once implemented --
    the arms are simple and the calibration is arithmetic. 0.75 that implementing
    it uncovers at least one real defect in a naive transport implementation
    (self-comparison or certificate reuse are common), which is the outcome that
    would justify the record on its own. ~0.00 that it produces any attack
    result, by construction. The reason to rank it high is not its prior but its
    position: it is blocking, it costs minutes, and without it neither
    IDEA-20260807-a127ab nor IDEA-20260807-e0ddc6 produces a number anyone should
    believe.

