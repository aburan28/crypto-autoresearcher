idea:
  id: IDEA-20261006-947b64
  question_id: RQ-ECDLP-002
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Distinguished-point modulus 32 versus modulus 8 on one walk in Z/401Z
  class: measurement
  claim: >-
    In Z/401Z, one planted logarithm, an r-adding walk with r = 16, and
    20 seeds, the lower median of steps to a certified collision under
    distinguishing modulus 32 is at least 1.6 times the lower median
    under modulus 8, and the lower median of the number of stored
    distinguished points under modulus 8 is at least 1.5 times the same
    count under modulus 32. Both ratios are required. A finished step
    ratio below 1.6, or a finished storage ratio below 1.5, is a
    negative for the tradeoff on this group. The generic exponent 1/2
    is not claimed to move.
  mechanism: >-
    A sparser distinguished-point rule (modulus 32) stores fewer points
    and waits longer for a repeat. A denser rule (modulus 8) stores
    more and collides sooner. The tracked object is the pair of ratios
    on one cyclic group. The walk rule is the classical
    van Oorschot-Wiener rule. Lossy projection: the observable keeps
    step totals and storage counts and drops the collision element.
    That projection is the cost question in RQ-ECDLP-002's memory-time
    clause. The open number priced here is the pair (1.6, 1.5) on
    Z/401Z, not a new interpolation formula.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-7d93f6
      provenance: internal
      claim: >-
        Finding collisions with time T and space S is governed by a
        product T squared times S. Opened this session. This idea
        measures one toy slice of that tradeoff and does not improve
        the product.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-7d93f6.yaml
    - ref: KR-RHO-6239aa
      provenance: internal
      claim: >-
        Distinguished-point density trades storage against the
        in-flight tail. Opened this session as the mechanism under
        measurement.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-6239aa.yaml
  assumptions:
    - The generator is 1. The planted logarithm is nonzero and drawn from the seed.
    - A seed that hits the cap of 4000 steps on either modulus is dropped from both moduli. It is not scored as 4000.
    - Lower median of a list of length 20 is the 10th entry in ascending order.
    - If fewer than 14 seeds finish both moduli, the ratios are not scored.
  predictions:
    - metric: >-
        Lower median of steps at modulus 32, divided by the lower
        median of steps at modulus 8, over the finished seeds.
      direction: higher
      minimum_effect: >-
        at least 1.6. A finished ratio strictly below 1.6 falsifies
        the time side of the tradeoff on this group.
    - metric: >-
        Lower median of stored distinguished points at modulus 8,
        divided by the lower median at modulus 32.
      direction: higher
      minimum_effect: >-
        at least 1.5. A finished ratio strictly below 1.5 falsifies
        the memory side of the tradeoff on this group.
  minimal_test:
    design: >-
      Group Z/401Z. For each seed in 0..19, draw the logarithm and the
      r=16 partition from SHA-256 of the UTF-8 string
      IDEA-20261006-947b64|{seed}|{role}. Run the same partition twice,
      once with distinguished predicate x divisible by 8, once with x
      divisible by 32. Stop at a certified collision or at 4000 steps.
      Record steps and the number of distinct distinguished points
      stored.
    controls:
      - >-
        A random function on a set of 401 labels, same two predicates
        applied to a hash of the label rather than to a group element.
        The step ratio on that function is recorded. If the group step
        ratio is at least 1.6 and the function's step ratio is below
        1.6, the group figure is not the generic thinning.
      - >-
        The recovered logarithm is checked by multiplication. A wrong
        value voids the seed on both moduli.
      - >-
        The two moduli share the partition. A fresh partition on only
        one modulus voids the seed.
    required_metrics:
      - steps and stored counts at both moduli per finished seed
      - the two lower-median ratios
      - the random-function step ratio
      - how many seeds finished both moduli
  falsification_conditions:
    - >-
      At least 14 seeds finish and the step ratio is strictly below
      1.6. Sparsity did not cost steps on this group.
    - >-
      At least 14 seeds finish and the storage ratio is strictly below
      1.5. Density did not cost storage on this group.
    - >-
      The group step ratio is at least 1.6 and the random-function
      step ratio is strictly below 1.6. The group figure is then not
      explained by generic thinning.
  confounders:
    - One group order and two moduli. The ratios do not transfer to cryptographic n.
    - The cap censors long sparse walks. Censored seeds leave both arms together.
    - r = 16 is frozen.
  interpretation_limits:
    - >-
      A step ratio of 1.6 at a four-fold change in modulus is a toy
      slice of the known product. It is not a new time-memory curve
      and not an exponent change.
    - No elliptic curve is built.
    - This is not a multi-target comparison and not a shared-inversion count.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On a walk of 4000 steps in Z/401Z, the fraction of elements
        divisible by m, for m in {8, 32}, is within 0.03 of the
        proportion of such residues in the group.
      rigorous_support: >-
        The proportion of residues divisible by m is an exact count
        in Z/401Z. A deterministic walk is not proved to meet that
        proportion. The 0.03 band is the toy check.
      validation_plan: >-
        On the first finished seed, for each modulus, divide the
        number of distinguished hits by the number of steps and
        compare to the exact residue proportion. Absolute error above
        0.03 falsifies H1 on that seed. The sample is this group
        only. No transfer is assumed.
  target_complexity:
    time_exponent: >-
      not beaten. Collision time remains Theta(n^{1/2}) at the
      distinguished-point density that stores about the square root
      of n points. Changing the modulus moves along that tradeoff.
    memory_exponent: >-
      not beaten. Memory stays proportional to the number of stored
      distinguished points.
    best_known: >-
      van Oorschot-Wiener parallel collision search, as recorded in
      KR-RHO-6239aa and KR-RHO-7d93f6.
    hidden_overhead: >-
      None claimed. No o(1) improvement is hidden because no
      improvement is proposed.
    tradeoff_note: >-
      The two moduli are two points on the classical density
      tradeoff. No new endpoint algorithm is offered.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-7d93f6
      - KR-RHO-6239aa
      - KR-RHO-46c2c6
      - KR-RHO-cd86f5
    nearest:
      - ref: KR-RHO-7d93f6
        provenance: internal
        relation: adjacent
        delta: >-
          That row states the time-space product. This idea adds the
          toy separators 1.6 on steps and 1.5 on storage between
          moduli 32 and 8 in Z/401Z, and it does not move the product.
    searched:
      corpus_grep:
        - titles of IDEA-20261005 and IDEA-20261006 on origin/main
        - proposal files added on design/volc-52015b and design/tors-ed9a14
      web:
        - not performed this session
      blocked:
        - multi-target reuse of one table as an algorithm claim
        - negation-map gain
  dominated_by: >-
    van Oorschot-Wiener collision search, time on the order of the
    square root of n group operations when memory holds about the
    square root of n distinguished points. Pollard rho at
    Theta(n^{1/2}) is the single-target floor.
  sota_delta: >-
    Exponent delta is 0 against Theta(n^{1/2}). The quantitative
    separator is a step ratio of at least 1.6 and a storage ratio of
    at least 1.5, against either ratio falling short, on Z/401Z.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: >-
        Z/401Z, r=16, moduli 8 and 32. Not a new attack baseline.
      reproduction_check: >-
        Recompute one finished seed with a second walk implementation
        and require the same two step counts.
    observation_collision:
      observable: the two ratios
      distinct_preimage_search: >-
        Two seeds may share a step count. The planted logarithm is
        checked by multiplication.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the seeds with a given step ratio
        predicted_gain: none as an attack
    quantifier_order: >-
      For all finished seeds the step counts and storage counts are
      nonnegative integers. The two ratios are rationals.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy statement that both ratios clear their thresholds, or
        that a named ratio falls short, on this group.
      nearby_object_control: the random function on 401 labels
    proof_obligations:
      - claim: no theorem is offered
        responsibility: scope
    not_applicable_reason: >-
      Measurement of a known density tradeoff on one toy group. The
      random function is the nearby control.
