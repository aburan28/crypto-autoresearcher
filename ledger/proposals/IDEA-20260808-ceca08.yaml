idea:
  id: IDEA-20260808-ceca08
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ECTD-001
  goal_id: GOAL-ECTD-001
  title: 'The conductor is NOT fully hidden: n_1 = gcd(A-1, f/f_E) leaks the volcano level
    through the public group structure, but the leak is bounded exactly by the cofactor because
    n_1^2 divides #E(F_p) - so a cryptographically usable near-prime-order curve leaks at
    most log_2(cofactor) bits, while a TOY instance with a fat cofactor leaks the level for
    free and would give EXP-ECTD-9e4248 a spurious detectability verdict'
  class: control
  claim: "(A) THE LEAK. By the identity derived in slice record E3-01 (Lenstra's CM structure\
    \ theorem E(F_p) = O/(pi - 1)O), the first invariant factor of the group is n_1 = gcd(A\
    \ - 1, m) with A = (t - f D_0)/2 and m = f/f_E. So for every prime ell, v_ell(n_1) = min(v_ell(A-1),\
    \ v_ell(f/f_E)), and v_ell(f/f_E) is the height of E above the floor of the ell-volcano.\
    \ The group structure - which is public, and computable in O(log p) group operations -\
    \ therefore reveals a LOWER BOUND on the volcano level at every ell dividing gcd(A-1,\
    \ f). A designer who believes the conductor is hidden behind a subexponential End(E) computation\
    \ (Bisson-Sutherland) is wrong at exactly those ell. (B) THE BOUND ON THE LEAK, WHICH\
    \ IS THE PART THAT MATTERS. n_1 | n_2 and n_1 * n_2 = #E(F_p), so n_1^2 | #E(F_p); also\
    \ n_1 | p - 1. Hence\n    n_1 <= sqrt(#E(F_p))   and   n_1 <= cofactor  when a prime N\
    \ with\n    N || #E(F_p) and N > cofactor is present.\nFor a cryptographically usable\
    \ curve #E(F_p) = c * N with c small (c = 1, 2, 4, 8 in practice), so n_1 | c and the\
    \ total leak is at most log_2 c bits - two or three bits, confined to ell = 2. THE HIDDEN-CONDUCTOR\
    \ PREMISE SURVIVES AT LARGE PRIME CONDUCTOR q, and it survives for the exact reason that\
    \ makes the curve usable. This is a two-sided finding and both sides are load-bearing.\
    \ (C) THE EXPERIMENTAL CONSEQUENCE, WHICH IS WHY THIS IS FILED AS A CONTROL. EXP-ECTD-9e4248\
    \ (approved by DEC-20260806-160175; the large-conductor vertical barrier, N in [40, 60]\
    \ bits, >= 8 conductor steps) samples toy curves. Toy curves are not selected for near-prime\
    \ order, so their cofactors can be large, and a large cofactor permits a large n_1, which\
    \ permits a free public read of the volcano level. If the experiment's curve sampler does\
    \ not RECORD the cofactor and the measured n_1 per instance, then any \"the conductor\
    \ step is detectable\" reading of its results is confounded: detectability may be an artifact\
    \ of the toy cofactor and would vanish at cryptographic parameters. Conversely, if the\
    \ experiment records them and detectability persists at instances with cofactor 1, that\
    \ is a genuine and much stronger finding. (D) THE MINIMAL ADDITION REQUESTED. Two extra\
    \ recorded fields per curve - the full group structure (n_1, n_2) and the value gcd(A-1,\
    \ f) - at essentially zero cost, plus one extra pre-registered stratification of the results\
    \ by cofactor. No change to the experiment's hypothesis, arms, or falsification criteria\
    \ is proposed. NOTE ON AUTHORITY: this record cannot and does not modify EXP-ECTD-9e4248,\
    \ which is approved and owned by the Coordinator; it is a proposal for a scoped amendment,\
    \ nothing more."
  mechanism: 'A trapdoor requires that the secret be unreadable from public data. The public
    data here includes the full group structure, not merely the group order, and the group
    structure is an O-module invariant that sees the conductor directly. The reason the leak
    is nonetheless small on real curves is that a large n_1 forces a large square factor in
    #E(F_p), which destroys the prime-order subgroup the curve exists to provide. Security
    and leakage are governed by the same integer.'
  why_not_a_renamed_known_approach: 'Nearest known: "curves at the floor of a volcano have
    cyclic group structure", a classical observation used in volcano navigation [recall-uncertain
    on attribution]. That statement is qualitative and is about navigation. This record (i)
    writes the exact identity with the cap v_ell(A-1), (ii) derives the cofactor bound n_1^2
    | #E(F_p) as the reason the leak is small on usable curves, and (iii) turns both into
    a pre-registered stratification for a specific approved experiment whose security half
    depends on the conductor being hidden. Nearest corpus record: DEC-20260806-160175''s defect
    D3 (the exact-width-prime sampling requirement); that defect is about the N bit-range,
    this one is about the cofactor, and they are independent.'
  predictions:
  - observable: leak size versus cofactor
    metric: over the curves EXP-ECTD-9e4248 would sample, the joint distribution of (cofactor
      c, n_1, gcd(A-1, f)), and the number of volcano-level bits recoverable from n_1 alone
    predicted: bits recoverable is <= log_2 c exactly, with equality when gcd(A-1, f) >= c;
      and the fraction of instances with c = 1 (zero leak) is substantial but not overwhelming
      at toy sizes, whereas at cryptographic curve-generation parameters it is essentially
      forced
  - observable: whether detectability tracks the cofactor
    metric: any "conductor step is detectable" statistic from the experiment, stratified by
      c = 1 versus c > 1
    predicted: if the effect is an artifact of the group-structure leak it is present only
      in the c > 1 stratum and absent at c = 1; if genuine it is present in both. This is
      the discrimination the record exists to enable
  - observable: near-prime-order curves
    metric: n_1 measured on >= 200 curves generated with the standard near-prime-order constraint
    predicted: n_1 in {1, 2, 4, 8} in essentially every instance
  minimal_test: 'Add to any existing toy curve-generation pipeline: for each generated curve
    record (n_1, n_2), the cofactor c, D = t^2 - 4p, its factorisation, f, D_0, A = (t - f
    D_0)/2, and gcd(A-1, f). Then (i) verify n_1 = gcd(A-1, f/f_E) against an independent
    End(E) computation on >= 30 curves where f_E is computable; (ii) tabulate the recoverable-bits
    distribution against c; (iii) repeat on 200 curves generated with a near-prime-order constraint.
    Cost: minutes on top of an existing generator.'
  controls:
  - 'NULL: curves with f = 1 (Z[pi] maximal). No level exists, and the leak statistic must
    report zero bits. Nonzero output there is an artifact.'
  - 'PLANTED: construct via a Hilbert class polynomial a curve with known conductor divisible
    by a chosen small ell and with ell | A - 1, so the leak MUST be detectable. The instrument
    must find it. Two-directional.'
  - Independent End(E) determination (modular-polynomial volcano climb) as the reference level,
    never the group structure itself - otherwise the control is circular.
  confounders:
  - Toy generators that produce exact-width primes or otherwise constrained p can correlate
    c with the level artificially; the sampler's exact distribution must be recorded (this
    is the same class of defect as DEC-20260806-160175 D3).
  - Curves with j = 0 or 1728 have larger unit groups, which changes class number formulas
    used in the cross-check but not the group-structure identity.
  - Factoring D is needed to get f and D_0; at toy scale free, and the record makes no crypto-scale
    cheapness claim.
  falsification_conditions:
  - 'Measured n_1 != gcd(A-1, f/f_E) on any instance with independently computed f_E: the
    identity is wrong and both this record and E3-01 fail.'
  - 'A near-prime-order curve with n_1 large: n_1^2 | #E(F_p) would be violated, which is
    impossible, so this outcome indicts the measurement.'
  - 'Detectability present equally at c = 1 and c > 1: the leak is NOT the explanation and
    the experiment''s finding stands on its own - the outcome that would make the vertical-barrier
    trapdoor lane interesting.'
  interpretation_limits: This is a confound control, not a result. It does not say the vertical
    barrier works or fails; it says which of the two the experiment will be able to conclude.
    It changes no hypothesis status and no experiment contract - only the Coordinator may
    do that. Toy scale throughout. The cofactor bound is exact arithmetic, not an empirical
    claim.
  assumptions:
  - As E3-01: Lenstra's CM structure theorem, ordinarity, N ||
  - n_1 | n_2 (the standard structure of E(F_q)) and n_1 | p - 1 (Weil pairing).
  - Bisson-Sutherland subexponential End(E) computation as the assumed cost of the ATTACKER's
    direct conductor recovery [corpus, KN-LIT-251 via IDEA-20260807-4f43ac].
  heuristic_assumptions:
  - id: HA-1
    statement: Over toy curves sampled by the EXP-ECTD-9e4248 pipeline, the cofactor c and
      the event ell | gcd(A-1, f) are approximately independent, so the expected leak is sum
      over ell | c of min(v_ell(A-1), level) with v_ell(A-1) geometric of parameter 1/ell.
    rigorous_ingredient: 'The exact identity n_1 = gcd(A-1, m) and the exact divisibility
      n_1^2 | #E(F_p); only the JOINT DISTRIBUTION is heuristic, never the bound.'
    distribution_imitated: Equidistribution of A - 1 in residue classes, the same heuristic
      as E3-01 HA-1, so the two records share one validation.
    validation_route: The minimal test's part (ii) measures the joint distribution directly
      at toy scale. TOY SCALE, labelled toy. The cryptographic-parameter half of the prediction
      is validated only through the exact bound n_1 | c, which is arithmetic and needs no
      sampling.
    tail_checks: 'Report the largest observed n_1 and the largest observed gcd(A-1, f), and
      check that no instance violates n_1^2 | #E(F_p) - a hard consistency check that catches
      implementation errors immediately.'
  target_complexity:
    time_exponent: No exponent claimed or moved. The leak is at most log_2(cofactor) BITS,
      which on a usable curve is 1-3 bits and changes no attack cost. Filed as a control,
      which the exponent-first bias explicitly permits when the control gates an approved
      experiment.
    memory_exponent: O(log p) per curve.
    best_known_baseline: Direct conductor recovery by Bisson-Sutherland, subexponential L_{|D|}(1/2);
      the leak is free by comparison but partial and capped.
    hidden_overhead_disclosure: Requires the factorisation of D to convert n_1 into a level
      statement. Free at toy scale, subexponential at crypto scale. Stated, not hidden.
    time_memory_tradeoff: not applicable.
  sota_delta: 'Zero as an attack. As a control: it converts a possible confound in an already-approved
    experiment into a pre-registered stratification, at essentially zero cost, and it supplies
    the exact bound (n_1 | cofactor) that determines whether the vertical-barrier trapdoor
    premise can survive to cryptographic parameters at all.'
  dominated_by: n/a (no attack result claimed). Frontier rows checked as in E3-01/E3-02; none
    approached. As a conductor-recovery method the leak is DOMINATED by Bisson-Sutherland,
    which recovers the full conductor in subexponential time whereas the leak recovers at
    most min(v_ell(A-1), level) bits - the record says so explicitly rather than presenting
    a partial oracle as a better one.
  estimated_cost: 'Implementation: low (extra recorded fields plus a Smith-normal-form check).
    Compute: low (negligible on top of the existing experiment).'
  recommended_priority: high
  honest_prior_of_survival: 0.85 that the identity verifies and the bound holds exactly (it
    is arithmetic). 0.5 that the stratification actually changes how EXP-ECTD-9e4248's results
    must be read - that depends on the sampler's cofactor distribution, which is unknown to
    this record and is precisely what part (ii) measures. Filed high because the cost is near
    zero and the downside of not measuring it is an uninterpretable primary result.
  novelty_status: unverified
  novelty_screen: Same screen as E3-07, plus the full text of GOAL-ECTD-001's BATCH-e722dd
    checkpoint and next_action (which describe EXP-ECTD-9e4248 v2, its five fixed defects,
    and CTRL-END-RING-CERTIFICATE / CTRL-HORIZONTAL-BASELINE), and IDEA-20260731-017 and IDEA-20260801-004
    (the conductor-step lineage). No corpus record uses the group structure as a conductor
    leak. WEB SEARCH UNAVAILABLE.
  discriminated_from: 'IDEA-20260731-017 / EXP-ECTD-9e4248: measure meter continuity across
    a conductor step; this record measures whether the step is publicly visible at all, which
    is the security half those records assume rather than test. DEC-20260806-160175 defect
    D3: about N bit-width sampling; this is about the cofactor and is independent. Slice record
    E3-01: same identity, used there as a cheap level instrument for the attack lane; used
    here as a leak bound for the trapdoor lane, with the cofactor argument that E3-01 does
    not make.'
