      reproduction_check: >-
        Two readers must agree that the bit length is 29, the
        doubling count is 28, and the addition count is 28.
    observation_collision:
      observable: The addition count and the product.
      distinct_preimage_search: >-
        Reporting the addition count as 28 on both readings drops
        their gap. Two readings make that gap 0.
    constructive_transforms:
