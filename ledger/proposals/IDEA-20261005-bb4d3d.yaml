        digit counts of the integer 536870911.
      verified_by: coordinator session 2026-10-05, frontier row on disk
  assumptions:
    - The integer 536870911 is frozen before the bits are read.
    - No curve point is added.
  proof_search_map:
    bottleneck: The digit-count gap between 29 and 28.
    baseline_embedding:
