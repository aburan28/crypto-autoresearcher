idea:
  id: IDEA-20260828-262f5c
  title: >-
    Cross-round scaling-consistency check (validation-ladder step 2) of the
    2026/980 "Joint Generalized Zero-Difference Property" probability gap,
    at rounds locally testable (<= 6), before its round-7 extrapolation
    (2^126.2, outside this envelope) is trusted as a target to beat.
  class: control
  claim: >-
    eprint.iacr.org/2026/980 (retrieved, unverified beyond an abstract-level
    summary) reports a key-independent 7-round AES distinguisher via a
    "Joint Generalized Zero-Difference Property" -- a quartet built from
    related differences that simultaneously satisfies three distinct
    generalized zero-difference conditions -- with a right-quartet
    probability 2^-250.4 vs a random-permutation probability 2^-253.4 (a gap
    of 2^3 = 8), at overall data/time/memory cost 2^126.2. That cost is
    outside this environment's local envelope (no GPU, 4 CPUs, 15 GB RAM)
    and CANNOT be locally reproduced. Per docs/inventor-protocol.md section
    6 step 2 ("run the entire pipeline on a scaled-down instance... and
    check that the predicted improvement appears as a measured ratio against
    the baseline, not as an extrapolation"), THIS RECORD INDEPENDENTLY
    RE-DERIVES (not copies) the joint-zero-difference mechanism's GENERAL
    SHAPE from first principles -- a quartet satisfying k >= 2 simultaneous
    zero-difference conditions across independent output byte groups -- and
    measures the analogous probability gap at rounds 3, 4, 5 and 6 (all
    locally feasible), asking whether the gap SCALES in the direction and
    rough magnitude a round-by-round extrapolation to round 7 would predict,
    OR whether it is flat/non-monotonic across the tested rounds (the
    canonical artifact tell of docs/inventor-protocol.md section 3: "a
    quantity that stays constant across rounds is instead the signature of
    an artifact"). ADDITIONALLY, since the external claim is explicitly
    "key-independent," this record runs the identical measurement across
    >= 50 independent keys per round count and reports the across-key
    variance directly, discriminating a genuinely key-independent structural
    property (near-zero across-key variance in the gap) from a property that
    is only key-independent in expectation but carries hidden key-dependent
    variance the abstract-level summary does not disclose.
  mechanism: >-
    A "joint zero-difference" quartet is built by requiring several disjoint
    output byte groups to EACH independently satisfy a zero-difference
    condition after some fixed number of rounds; if the conditions were
    truly independent under the round function's mixing, the joint
    probability would be the PRODUCT of the individual probabilities, and
    the gap over a random permutation (which has no such structure) would
    scale multiplicatively with the number of joint conditions and,
    separately, decay predictably as more rounds are added between the
    quartet's construction point and the measurement point. THE TRACKED
    QUANTITY here is the SCALAR LOG-PROBABILITY GAP g(r) = -log2(Pr[right
    quartet | real AES, r rounds]) + log2(Pr[right quartet | random
    permutation, r rounds]), measured as a function of round count r --
    this is explicitly a MEASUREMENT-DESIGN object (an experimentally
    estimated summary statistic), not a step-by-step tracked propagation
    object in the lossy-projection sense of docs/inventor-protocol.md
    section 2, and this record states that distinction openly rather than
    forcing an object-first framing where none applies: the discipline
    invoked here is the validation ladder (section 6), not the lossy-
    projection test. Nearest known method: the joint-zero-difference
    construction itself (established per the retrieved abstract, off-limits
    as a novelty claim); this record's contribution is the LOCAL, ROUND-
    SCALED reproduction of its qualitative behavior as an independent
    consistency check on an extrapolation this program cannot otherwise
    afford to test at the scale where it matters.
  novelty_status: unverified
  citations:
    - ref: "eprint.iacr.org/2026/980 ('Key-Independent Secret-Key Distinguisher for 7-Round AES based on the Joint Generalized Zero-Difference Property')"
      provenance: retrieved
      claim: >-
        A key-independent 7-round AES distinguisher with data/time/memory
        2^126.2, success probability ~77.8%, right-quartet probability
        2^-250.4 vs random-permutation 2^-253.4.
      verified_by: "idea-generator subagent, WebSearch/WebFetch retrieval, 2026-08-28 (abstract-level summary only, not full primary text)"
  assumptions:
    - The pinned FIPS-197 harness is ground truth at rounds 3-6.
    - The generic joint-zero-difference construction re-derived here may differ from the paper's actual (unread) construction; any conclusion is scoped to this record's own re-derivation.
    - 2^28-2^30 total AES-NI evaluations per round-count/key combination is affordable within the stated compute budget (low, per the estimated_cost below).
  proof_search_map:
    not_applicable_reason: >-
      Not proof-oriented. This is a heuristic-validation-style measurement
      per docs/target-result-profile.md A7 and the inventor-protocol's
      validation ladder step 2, applied to a claim this program cannot
      afford to test at its native scale. The cheap audits are discharged
      inline: baseline reproduction is the round-3/4 gap (expected near
      zero, since a joint zero-difference condition at very few rounds
      should be close to trivially satisfiable or close to random); the
      observation collision is exactly the across-key variance check named
      in the claim; the method ceiling is a consistency verdict on an
      extrapolation, never an attack at round 7.
  predictions:
    - metric: log-probability gap g(r) at r = 3
      direction: lower
      minimum_effect: g(3) measurably smaller than g(6) (gap grows with round count, consistent with an extrapolation toward a nonzero g(7))
    - metric: log-probability gap g(r) at r = 6
      direction: higher
      minimum_effect: g(6) > g(3) by at least 1 bit, with monotonic (non-decreasing) behavior across r = 3,4,5,6
    - metric: across-key standard deviation of g(r) at each round count, >= 50 keys
      direction: lower
      minimum_effect: standard deviation small relative to the mean gap (consistent with "key-independent"); a standard deviation comparable to or exceeding the mean gap falsifies the key-independence claim for this record's own construction
    - metric: g(r) measured on a keyed random permutation (null), same r and data volume
      direction: lower
      minimum_effect: g_null(r) statistically indistinguishable from 0 at every tested r; a nonzero g_null indicates the instrument, not AES, is producing the signal
  minimal_test:
    design: >-
      (1) From first principles, construct a generic joint-zero-difference
      quartet family (k >= 2 simultaneous conditions on disjoint output byte
      groups) for AES-128 reduced to r = 3, 4, 5, 6 rounds. (2) For each r
      and >= 50 independent keys, estimate Pr[right quartet] over a
      pre-registered sample size (>= 2^24 quartets per (r, key) pair,
      feasible on 4 cores with AES-NI) and compute g(r) per key. (3) Repeat
      identically on a keyed random permutation of the same block size as
      the null. (4) Plot g(r) vs r and the across-key distribution at each
      r; check monotonicity and variance.
    controls:
      - Random-permutation null at every round count and identical data volume.
      - Independent re-implementation of the quartet sampler, cross-checked on a small fixed instance.
      - Pre-registration of the sample size and the >= 50-key requirement before any measurement, to prevent post-hoc sample-size selection.
    required_metrics: [g(r) per key per round, across-key mean and standard deviation of g(r), g_null(r), monotonicity of the mean gap across r, data and wall-clock cost]
  falsification_conditions:
    - g(r) is flat (no measurable increase) across r = 3 to 6 -- the canonical artifact tell per docs/inventor-protocol.md section 3; this record's own re-derived construction does not carry the claimed structural growth, whether or not the (unread) paper's actual construction does.
    - g_null(r) is measurably nonzero at any tested round -- instrument defect, stop before trusting any AES-side measurement.
    - Across-key standard deviation of g(r) is comparable to or exceeds the mean gap at any round -- the "key-independent" framing does not hold for this record's own construction (which may still differ from the paper's).
  confounders:
    - This record's generic re-derivation of the joint-zero-difference construction is NOT confirmed to match the paper's actual (unread) construction; a negative or positive result here is scoped to this record's own version only.
    - Extrapolating a 4-point (r=3..6) trend to r=7 is itself a heuristic step and is reported as a consistency check, not as a prediction of the actual r=7 gap value.
    - Sample-size limits at r=6 (2^24 quartets per key, 50 keys = 2^29.6 total) may leave the measured gap noise-dominated if the true gap is smaller than this record's prediction; the pre-registered sample size and its resulting resolution floor must be reported explicitly alongside any null result.
  interpretation_limits: >-
    Reduced-round only (r <= 6), RQ-AES-001 ceiling. This record produces a
    CONSISTENCY VERDICT on an extrapolation, not a distinguisher, not a key
    recovery, and not a verification of the round-7 paper's actual claim
    (which remains outside this environment's compute envelope and whose
    primary text was not read). A positive (monotonic, low-variance) result
    supports treating the round-7 claim as a plausible target to beat in a
    future record; a negative result supports treating it with more caution,
    scoped explicitly to this record's own re-derived construction.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        The joint-zero-difference construction's log-probability gap g(r)
        grows (weakly monotonically) with round count over the range where
        the construction is meaningfully non-trivial, mirroring the
        behavior classical zero-difference / multiple-of properties show
        when extended by additional rounds.
      rigorous_support: >-
        No rigorous bound is claimed; this is an empirical scaling
        hypothesis modeled on the general pattern that structural AES
        distinguishers (the classical 4-round zero-difference / multiple-of
        properties) show a probability gap that persists through the
        rounds the structure is designed to survive and vanishes once
        diffusion destroys it -- the SHAPE of that transition (not its
        exact location) is what this record tests for its own construction.
      validation_plan: >-
        Measure g(r) at r = 3, 4, 5, 6 as described, with a pre-registered
        prediction of weak monotonic growth; report the raw per-key gap
        values (not just the mean) so any bimodal or outlier structure is
        visible, and report the sample size at which the resolution floor
        (the smallest measurable gap given the sample size) exceeds the
        measured gap, flagging any round where the result is
        resolution-limited rather than a genuine zero.
  target_complexity:
    time_exponent: >-
      No attack proposed. This is a bounded-scale consistency measurement;
      its own cost is <= 2^30 total AES-NI evaluations across all rounds and
      keys, explicitly NOT compared to any exponent, and explicitly unable
      to test the round-7 claim's actual 2^126.2 cost.
    memory_exponent: negligible (counters and small per-key statistics arrays).
    best_known: >-
      The retrieved-but-unverified 2026/980 abstract reports 2^-250.4 vs
      2^-253.4 (a gap of 2^3) at round 7, cost 2^126.2 -- named here as the
      external target this record cannot directly test, only assess for
      extrapolation plausibility.
    hidden_overhead: not applicable; no asymptotic form claimed by this record.
    tradeoff_note: not applicable.
  dominated_by: >-
    Checked all 12 filed RQ-AES-001 proposals; none performs a cross-round
    consistency check on an external claim's extrapolation. This record
    does not compete with 2026/980 (it cannot test the same round count) and
    is not dominated by any internal record on this specific axis.
  sota_delta: >-
    No attack delta claimed; n/a (no result claimed) is the honest default
    unless the measurement produces a clear positive or negative consistency
    verdict, in which case the delta is purely methodological: a documented
    plausibility check (or a documented reason for caution) on a 2026
    external result this program could not otherwise afford to engage with
    at its native scale.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  question_id: RQ-AES-001
  goal_id: GOAL-AES-001
