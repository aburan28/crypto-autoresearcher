idea:
  id: IDEA-20260807-f6137c
  question_id: RQ-INSTR-f8faa0
  added: '2026-08-07'
  title: >-
    CLOSURE: three instruments this campaign should not build, each with a named
    obstruction, an argument and forward guidance -- a "true degree of regularity"
    meter for Semaev systems (no ground truth exists, so no planted signal of known
    size can be constructed), a best-in-class attack-cost estimator at any scale
    where it would matter (its null would have to be a cryptographic-scale isogeny
    class, which is unbuildable), and a single-armed displacement-rank adjudicator
    (it cannot separate the two explanations its own decision record left open)
  class: control

  claim: >-
    (A) WHY AN AUDIT LANE OWES A CLOSURE. RQ-INSTR-f8faa0's decision target is that
    an instrument that cannot detect a planted signal cannot support a negative and
    one that fires on a matched null cannot support a positive. That is a
    CONSTRUCTIBILITY CRITERION, and it can fail in advance: for some quantities no
    planted signal of known size can be constructed even in principle, and for
    others no matched null object exists. Naming those before they are built is the
    cheapest thing this lane can do, and under docs/inventor-protocol.md section 4 a
    closure needs a named obstruction, an argument and forward guidance -- not a
    count of rejected mechanisms. Three are named below and each meets that
    standard. THIS IS NOT A DECLARATION THAT ANY DIRECTION IS IMPOSSIBLE: each
    closure is scoped to a specific instrument shape and each names what remains
    open in its place.

    (B) CLOSURE 1 -- DO NOT BUILD A "TRUE DEGREE OF REGULARITY" METER FOR SEMAEV
    SYSTEMS.
      OBSTRUCTION: definitional non-uniqueness on non-semi-regular systems.
      ARGUMENT. The degree of regularity in the Bardet-Faugere-Salvy sense is
      defined through the Hilbert series of the homogenised ideal UNDER A
      SEMI-REGULARITY HYPOTHESIS: it is the index of the first non-positive
      coefficient of the series a semi-regular system would have. KN-TECH-011
      records that Semaev systems "are structured (symmetric, sparse) and may not be
      semi-regular, so measured solving degrees can deviate from Hilbert-series
      predictions", and KN-TECH-075 records the same caveat for the closest external
      literature: "Solving degree is not the same as degree of regularity, and
      structured systems routinely violate the semi-regularity assumptions under
      which the latter is computed." Off the semi-regular locus the candidate
      definitions -- the Hilbert-series index, the maximum degree in an F5 run, the
      Castelnuovo-Mumford regularity of the homogenised ideal, and the first-fall
      degree -- separate, and they separate by amounts that are not bounded in
      general. Now apply this lane's own criterion. To validate a d_reg meter one
      needs a family of systems whose TRUE d_reg is known and DIFFERENT by a known
      amount, so the meter's recovery of that difference can be checked. On the
      semi-regular locus such a family exists but is exactly the locus where every
      definition agrees and no meter is needed. Off it, no such family exists,
      because there is no agreed value to plant. A meter with no constructible
      positive control cannot support a negative result, by the lane's own rule; and
      a meter whose null object (a shape-matched random system) is semi-regular
      while the object of study is not will systematically differ from it for
      reasons that are not about ECDLP, so it cannot support a positive either. Both
      directions fail before a line of code is written.
      FORWARD GUIDANCE, AND IT IS CONCRETE. Three things remain open and are
      buildable. (i) The SOLVING DEGREE for a NAMED monomial order, which is
      definition-faithful and computable exactly by Macaulay rank -- that is
      IDEA-20260807-899c5e. (ii) The FIRST-FALL DEGREE, likewise a rank comparison
      with no semi-regularity assumption. (iii) The HILBERT-SERIES PREDICTION
      computed from the degrees alone, reported as a PREDICTION rather than as a
      measurement, with the GAP between it and the measured solving degree as the
      reported quantity. The gap is well defined even where d_reg is not, and the
      gap is exactly the quantity that carries the structural information the
      campaign wants. Additionally, IDEA-20260806-e4f96e's polynomial-calculus
      refutation degree is a genuinely solver-independent lower bound, which is a
      stronger object than d_reg and does not need semi-regularity at all.

    (C) CLOSURE 2 -- DO NOT BUILD AN ESTIMATOR OF min over the class of an
    ATTACK-COST FUNCTIONAL, AT ANY SCALE WHERE THE ANSWER WOULD MATTER.
      OBSTRUCTION: the required null object is a cryptographic-scale isogeny class,
      which cannot be constructed, and the toy-scale surrogate is a different
      statistical object with no controlled extrapolation between them.
      ARGUMENT, IN THREE LIMBS.
        Limb 1 -- THE ESTIMAND CHANGES WITH THE CLASS SIZE. At toy p the class has
        of order 100 curves (RUN-ICINV-p4001-a: 138 in the target class) and is
        completely enumerated, so min over the class is computed exactly. At
        cryptographic p the class has h(O) of order sqrt(p) curves, so min over the
        class is the minimum of an unobservable population and any estimate of it is
        an extreme-value extrapolation. The exact minimum of 138 values and the
        left-tail extrapolation of 2^128 values are not the same quantity, and no
        amount of toy-scale work turns one into the other. AGENTS.md rule 7 forbids
        presenting the first as evidence about the second.
        Limb 2 -- THE NULL CANNOT BE BUILT. This lane's rule requires the identical
        measurement against a matched null object of the same shape. The matched null
        for "the minimum over an isogeny class at cryptographic p" is "the minimum
        over a matched random set of curves at cryptographic p of the same size",
        i.e. a set of about sqrt(p) curves, which cannot be enumerated, stored or
        measured. Substituting a small random sample changes the estimand on BOTH
        sides identically only if the left tails of the two populations have the
        same shape -- which is precisely the unknown the instrument was built to
        settle. The null is circular.
        Limb 3 -- EVEN A CORRECT ESTIMATE WOULD NOT BE AN ATTACK, BY T5. The
        campaign's own reachability gate says a cost-minimising curve is useful only
        if goodness is common enough to hit by random walking or detectable by a
        local test at each step of a walk; reaching a curve identified only by a
        global address is the vectorization problem, at about sqrt(h), i.e. about
        p^{1/4}. So a class minimum that is neither common nor locally detectable
        buys nothing even if measured perfectly. An instrument whose best possible
        output cannot change any conclusion is not worth its null.
      FORWARD GUIDANCE, AND IT IS SPECIFIC. Three buildable substitutes.
        (i) THE CLASS-WIDE DISTRIBUTION, not its minimum: estimate quantiles of C
        over the class by random walking, with the mixing time MEASURED at toy scale
        rather than assumed from the GRH-conditional statement in T5. Quantiles of a
        sample are estimates of quantiles of the population; minima are not.
        (ii) LOCAL DETECTABILITY, which is T5's own condition (ii) and is a
        yes/no question with a proper null: is there a test evaluable at a single
        curve, in time polynomial in log p, whose value correlates with C? Its null
        is a shuffled-label version of the same test, and both directions are
        constructible. This is the question that actually decides the lane.
        (iii) AN EXPLICIT EXTREME-VALUE MODEL, if anyone wants the minimum: state
        the tail assumption as a numbered heuristic with a falsification condition
        and a validation route in the style of
        docs/claims-and-verification.md's heuristic records, and report the estimate
        as conditional on it. That is allowed; what is not allowed is an unlabelled
        extrapolation.

    (D) CLOSURE 3 -- DO NOT BUILD A SINGLE-ARMED DISPLACEMENT-RANK ADJUDICATOR FOR
    LANE L5.
      OBSTRUCTION: the two live explanations differ by a nuisance variable that a
      one-armed measurement holds constant, so no single-arm output can separate
      them, and this is not speculation -- it is the recorded state of
      DEC-20260727-009.
      ARGUMENT. DEC-20260727-009's instrument_question_disposition records that
      whether the displacement-rank metric measures phi-invariance or the
      row-insertion bookkeeping is UNADJUDICATED, that arm E as frozen was "a valid
      EXISTENCE control and a MIS-SPECIFIED COMPARATIVE one, diverging by closure
      convention on an uncontrolled nuisance variable rather than by endomorphism
      content", and that "no downstream record may call phi_alpha an artifact, and
      none may call it validated." THIS RECORD ASSERTS NEITHER, and the closure is
      about the INSTRUMENT SHAPE only: a measurement that emits one alpha per
      instance, with the closure convention not varied and the suppression count not
      reported, cannot distinguish the two explanations no matter how many instances
      it runs, because they predict the same single number. Running more instances
      of a design that cannot separate two hypotheses is the definition of a
      measurement that cannot support either verdict.
      FORWARD GUIDANCE, AND IT IS ALREADY WRITTEN. DEC-20260727-009's next_actions
      specifies the two-arm design: arm A-prime with the dedup and zero-filter
      disabled, making a sharp pass/fail prediction; and arm E-prime, a phi-free
      closure that emits each orbit once and never suppresses, isolating the closure
      convention from endomorphism content; both matching base-row budgets and
      reporting alpha conditional on suppression count, with sha256 of the factor
      base and of the final row list per cell so an alpha is checkable without
      re-execution. That design is the successor and this closure exists to stop a
      one-armed version being built instead. Note also GOAL-ENDO-001 pause condition
      P2: any lane result bearing on H-STR-002 in either direction pauses this
      campaign until DEFER-BATCH009-001 is discharged under GOAL-ECDLP-001, so this
      campaign is in any case not the place to resolve it.

    (E) WHAT THIS CLOSURE IS NOT. It is not a claim that d_reg is meaningless, that
    isogeny classes have uniform attack cost, or that displacement rank is an
    artifact. Each closure names an INSTRUMENT SHAPE that cannot be controlled and
    hands back a substitute that can. Under docs/inventor-protocol.md section 7 that
    is exactly the distinction between a closure and a declaration of impossibility.

  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: >-
    An audit of instrument constructibility. No oracle, no algorithm, no resource.
    Closure 2's Limb 3 CITES the admissibility filter's downstream analogue -- T5,
    the reachability gate -- as part of the argument, which is the intended use of
    the filter: killing a lane before it costs anything.

  discriminated_from:
    - >-
      IDEA-20260807-899c5e, which BUILDS the solving-degree and first-fall meters.
      Closure 1 is the argument for why those two and not a d_reg meter; the two
      records are complementary and were written together.
    - >-
      A fatigue report. This record names three specific instrument shapes, gives a
      mechanism for each obstruction, and names concrete substitutes. It does not
      say "we screened N instruments and rejected them", which
      docs/inventor-protocol.md section 4 classifies as a statement about the search
      whose honest status is unverified.
    - >-
      DEC-20260727-009 itself. That decision adjudicated H-STR-002 and left the
      instrument question open in both directions. Closure 3 adds nothing to the
      adjudication and takes nothing from it; it argues only that a one-armed design
      cannot close it, which is a statement about designs and is consistent with the
      decision's own next_actions.
    - >-
      IDEA-20260807-caf061, which handles what to do when several instruments report
      at once. This handles which instruments not to build at all.

  object_first_candidate:
    tracked_object: >-
      THE CONSTRUCTIBILITY PAIR (planted signal of known size, matched null object)
      for a proposed instrument -- tracked as a two-bit answer per candidate
      instrument, with the obstruction named when either bit is zero.
    lossiness: >-
      GENUINELY LOSSY, and this is the cheapest lossy projection in the campaign. It
      forgets the instrument's implementation, its cost, its expected result and the
      mathematics it would measure, retaining two bits and a reason. What it discards
      is discarded compatibly with the campaign's operations: refining an
      instrument's implementation cannot turn a zero bit into a one, because the bits
      are properties of the ESTIMAND and not of the code. That is exactly why the
      audit can run before any code exists.
    propagation: >-
      Under composing instruments the pair propagates by conjunction: a composite
      instrument is controllable only if each stage is. Under changing scale it does
      NOT propagate, which is Closure 2's whole content: an instrument controllable
      at toy p can be uncontrollable at cryptographic p, and the bits must be
      re-evaluated per scale.
    survival_score: >-
      Survives every implementation change and every budget change. Dies when the
      estimand is redefined -- which is precisely what each forward-guidance
      substitute does, and why substitution rather than abandonment is the right
      response.

  mechanism: >-
    STEP 1 -- STATE THE CONSTRUCTIBILITY TEST AS A CONTRACT GATE. For each proposed
    instrument, before implementation: name the planted signal of known size and
    the matched null object of the same shape, or record that one cannot be
    constructed and why. Two bits and a reason. This is a paper exercise costing
    minutes and it is the gate the three closures below pass through.

    STEP 2 -- WRITE THE THREE CLOSURE ARGUMENTS AS AN ARCHIVED NOTE, with the
    citations checked: KN-TECH-011 and KN-TECH-075 for the semi-regularity caveat,
    T5 in DECOMPOSITION.md section 3 for the reachability limb, and
    DEC-20260727-009's instrument_question_disposition and next_actions for the
    third, quoted rather than paraphrased.

    STEP 3 -- ATTEMPT TO FALSIFY CLOSURE 1 CHEAPLY AND CONCRETELY. Construct a
    candidate ground-truth family for d_reg: take a system that IS semi-regular by
    construction (a generic dense system of the same degrees), compute its
    Hilbert-series d_reg symbolically, then perturb it toward the Semaev structure
    in declared steps and record where the four candidate definitions separate. If
    they do NOT separate anywhere along the path to the actual Semaev system, then a
    ground truth does exist along that path, Closure 1 is falsified, and a d_reg
    meter becomes buildable. This is the record's own falsifier and it is cheap.

    STEP 4 -- ATTEMPT TO FALSIFY CLOSURE 2. Take the completely enumerated class at
    p = 4001, compute the exact minimum of each functional, then compute the minimum
    of samples of size s for s = 5, 10, 20, 40, and fit the sample-minimum bias as a
    function of s. If the bias is well modelled by a one-parameter tail law over the
    whole range, an extreme-value route exists and Closure 2 weakens to "buildable
    conditional on a numbered tail heuristic" -- which is what its forward guidance
    (iii) already says. If the fit is poor at toy scale, where the population is
    fully observed, it will not be better where it is not.

    STEP 5 -- RECORD THE RESULT AS A CLOSURE OR A WITHDRAWAL, and in either case
    name what remains open. A withdrawn closure is a better outcome than a closure
    and this record is written so that either is reportable.

  novelty_status: unverified
  novelty_screen:
    method: >-
      Commands run 2026-08-07: rg -i "degree of regularity|solving degree" over
      knowledge/ (16 files); full reads of KN-TECH-004, KN-TECH-011, KN-TECH-075,
      KN-OPEN-002; full read of DEC-20260727-009 and H-STR-002; full read of
      DECOMPOSITION.md including T5 and section 5; full read of
      docs/inventor-protocol.md sections 4 and 7; reads of harness/semaev.py and
      harness/isogeny_class.py.
    results: >-
      The semi-regularity caveat is recorded in KN-TECH-011 and KN-TECH-075; the
      reachability dichotomy is recorded as T5; the UNADJUDICATED instrument
      question and its two-arm successor are recorded in DEC-20260727-009. NO record
      draws the constructibility consequence -- that these caveats make specific
      instruments uncontrollable in principle rather than merely difficult -- and no
      record in ledger/, knowledge/, docs/ or analysis/ contains a
      do-not-build list of any kind.
    verdict: novel
  novelty_status_note: >-
    RECORDED AS `unverified` DELIBERATELY, and the two fields disagree on purpose.
    The novelty_screen's verdict is that no such record exists in this repository,
    which is what the screen can establish. `novelty_status: unverified` is the
    honest label for the CLAIM itself, because a closure argument's real question is
    whether someone outside this program has already settled the constructibility
    question for d_reg meters, and no external literature check was performed for
    that in this session. Under agents/idea-generator.md a claim not checked against
    external literature is `unverified`, and a closure record is exactly the kind of
    claim where a memory-based novelty assertion would be worst.

  null_object_control: >-
    MANDATORY, AND FOR A CLOSURE THE NULL IS A NEARBY INSTRUMENT THAT IS
    CONSTRUCTIBLE. For each closure, exhibit a neighbouring instrument that PASSES
    the constructibility test, and show what changed. Closure 1's neighbour is the
    solving-degree meter (order named, Macaulay rank, planted signal available by
    appending a redundant high-degree generator, matched null available as a
    shape-matched random system). Closure 2's neighbour is the class-quantile
    estimator (planted signal available by shifting one class's values, matched null
    available as a random curve set of the same sample size). Closure 3's neighbour
    is the two-arm design of DEC-20260727-009's next_actions. A closure whose
    neighbour is not constructible either is not a closure about instrument shape --
    it is a closure about the whole subject, and this record makes no such claim.
    DECAY PARAMETER: the distance from the closed instrument to its neighbour,
    measured as the number of design changes needed. If a closed instrument becomes
    constructible after ONE change, the closure is about that change and must be
    restated as such rather than as a closure of the instrument. A closure that
    survives no design perturbation is a fatigue report in disguise.

  assumptions:
    - >-
      The four candidate definitions of degree of regularity coincide on semi-regular
      systems and can separate off that locus. The first half is standard; the second
      is the load-bearing claim and Step 3 is written to falsify it.
    - >-
      Semaev systems are not semi-regular in general. Recorded in KN-TECH-011 as an
      applicability limit ("may not be semi-regular") and in KN-TECH-075 for the
      adjacent literature. Treated as a caveat of the corpus, not as a theorem, and
      Step 3 tests it along an explicit path.
    - >-
      h(O) is of order sqrt(p) for a typical imaginary quadratic order of
      discriminant about -4p, so a cryptographic-scale class cannot be enumerated.
      Standard order of magnitude; nothing in the argument depends on the constant.
    - >-
      T5 as stated in DECOMPOSITION.md: reaching a specified curve in the class is
      the vectorization problem at about sqrt(h) classically. Cited there as
      GRH-conditional and not proved; Closure 2's Limb 3 depends on it and says so.
    - >-
      DEC-20260727-009's disposition is binding: the L5 instrument question is
      UNADJUDICATED and no record may resolve it in either direction. This record
      complies and asserts nothing about phi_alpha.

  proof_search_map:
    bottleneck: >-
      The step from "the definitions can differ" to "no ground truth exists". That
      is the only inferential move in Closure 1, and Step 3 is designed to break it
      if it is breakable.
    baseline_embedding:
      parameter_slice: >-
        A generic dense system with the degree profile of the S_3 decomposition
        system at factor-base size 4 -- the smallest instance where a Hilbert-series
        d_reg is computable symbolically in seconds.
      reproduction_check: >-
        On that generic system, all four candidate definitions must return the same
        integer. If they do not agree even on a semi-regular system, the argument's
        premise is wrong in the other direction and the closure is restated.
    observation_collision:
      observable: >-
        The pair of bits (planted signal constructible, matched null constructible).
      distinct_preimage_search: >-
        REQUIRED. Find two instruments with the same bit pair on opposite sides of
        the conclusion: one that is genuinely uncontrollable and one that merely
        looks so because nobody has constructed the control. The candidate pair is
        the d_reg meter (claimed uncontrollable) against the first-fall meter
        (controllable, and superficially similar). If the audit cannot separate them,
        the audit is measuring familiarity rather than constructibility, and that
        would falsify the method rather than any individual closure.
    quantifier_order: >-
      Intended: FOR ALL implementations of the named instrument shape, THERE DOES NOT
      EXIST a family of instances with known and different true values of the
      estimand. The dangerous stronger reading, NOT claimed: FOR ALL instruments
      touching degree of regularity, no control exists -- which is false, since the
      first-fall and solving-degree meters are controllable and are recommended.
      The dangerous weaker reading, also NOT claimed: FOR THIS implementation no
      control was found -- which would be a fatigue report.
    method_ceiling:
      strongest_certifiable_claim: >-
        "This instrument shape, for this estimand, at this scale, has no
        constructible positive control (or no constructible matched null), for the
        stated reason; here is a neighbouring shape that has both." It can never
        certify that the underlying mathematics is uninteresting, that the quantity
        does not exist, or that no future construction will be found.
      nearby_object_control: >-
        The neighbouring constructible instrument named for each closure. That IS the
        nearby-object control, and its existence is what keeps each closure a
        statement about shape rather than about subject.
    proof_obligations:
      - claim: The four d_reg definitions agree on semi-regular systems.
        responsibility: correctness
      - claim: They separate on the Semaev system, by a measured amount.
        responsibility: correctness
      - claim: No ground-truth family exists off the semi-regular locus.
        responsibility: soundness
      - claim: >-
          The matched null for a class-minimum at cryptographic p is itself a
          cryptographic-scale class.
        responsibility: soundness
      - claim: >-
          A one-armed alpha measurement returns the same value under both live
          explanations.
        responsibility: soundness
      - claim: Each closure names a constructible neighbour.
        responsibility: scope

  predictions:
    - metric: >-
        number of the four candidate d_reg definitions that agree, along the
        perturbation path from a generic dense system to the Semaev system
      direction: lower
      minimum_effect: >-
        Four at the generic end, at most three at the Semaev end, with the
        separation point identified. Pre-registered: if all four still agree at the
        Semaev end, Closure 1 is FALSIFIED, a ground truth exists, and a d_reg meter
        becomes buildable -- which would be a better outcome than the closure.
    - metric: >-
        goodness-of-fit of a one-parameter tail law to the sample-minimum bias at
        s = 5, 10, 20, 40 against the exact class minimum at p = 4001
      direction: different
      minimum_effect: >-
        Report R^2 and the maximum residual. A good fit weakens Closure 2 to
        "conditional on a numbered heuristic"; a poor fit at toy scale, where the
        population is fully observed, closes the extrapolation route firmly.
    - metric: >-
        number of design changes needed to turn each closed instrument into its
        constructible neighbour
      direction: higher
      minimum_effect: >-
        At least two for each closure. If any closure's neighbour is one change away,
        the closure is restated as being about that change, which is a weaker and
        more honest claim.
    - metric: >-
        number of closures in this record that survive their own falsification
        attempt
      direction: different
      minimum_effect: >-
        Reported as a count out of three, with the survivors and the withdrawals
        named. Zero survivors is a complete and useful outcome and would mean the
        campaign should build all three.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): write the three closure arguments with quoted
      citations; run the constructibility gate on each; record the bit pairs.
      STAGE 1 (an hour, and it is the cheapest falsifier here): the d_reg definition
      perturbation path at factor-base size 4. Symbolic Hilbert series plus a
      Macaulay rank profile; four definitions; report where they separate.
      STAGE 2 (minutes): the sample-minimum bias fit on the already-measured
      p = 4001 class. No new curve work; the values exist in RUN-ICINV-p4001-a's
      raw-result.json.
      STAGE 3 (zero compute): the neighbour-distance count for each closure.
      STAGE 4 (zero compute): write the do-not-build list with, for each entry, the
      obstruction, the argument, the neighbour, and the falsifier that was attempted
      and its result.
    controls:
      - the generic dense system, where all four definitions must agree
      - the first-fall meter, a superficially similar but controllable instrument
      - the exact class minimum at p = 4001, as ground truth for the sample-minimum
        bias
      - DEC-20260727-009's two-arm design, as Closure 3's constructible neighbour
    required_metrics:
      - the four candidate d_reg values along the perturbation path
      - the separation point and the separation magnitude
      - sample-minimum bias versus s, with the exact minimum
      - neighbour distance in design changes, per closure
      - the two-bit constructibility pair per instrument, with reasons

  falsification_conditions:
    - >-
      All four d_reg definitions agree on the Semaev system. Closure 1 is withdrawn
      and a d_reg meter is buildable.
    - >-
      The definitions disagree even on the generic dense system. The argument's
      premise is wrong and the closure is restated rather than kept.
    - >-
      The sample-minimum bias fits a one-parameter tail law with small residuals.
      Closure 2 weakens to conditional-on-a-heuristic, which its own forward guidance
      already anticipates.
    - >-
      Any closed instrument's constructible neighbour is one design change away. That
      closure is restated as a closure of the change, not of the instrument.
    - >-
      A reader finds an external construction of a d_reg ground truth for structured
      systems. novelty_status is already `unverified` for exactly this reason and the
      record would be superseded rather than defended.

  confounders:
    - >-
      FAMILIARITY MASQUERADING AS CONSTRUCTIBILITY. The audit could reject
      instruments that are merely unfamiliar. The observation-collision search
      against the first-fall meter is the guard, and if it fails the method is
      falsified rather than the individual closure.
    - >-
      SCALE-DEPENDENT BITS. Closure 2's obstruction is a function of scale, so the
      bit pair must be recorded per scale. An instrument recorded uncontrollable
      without a scale is a mis-recorded closure.
    - >-
      QUOTING VERSUS PARAPHRASING DEC-20260727-009. That decision constrains what may
      be said about phi_alpha in either direction. Closure 3 must quote and must not
      characterise, and any paraphrase risks becoming the assertion the decision
      forbids.
    - >-
      THE CLOSURE ITSELF BECOMING A LICENCE. A do-not-build list can be misread as
      permission to stop searching, which docs/inventor-protocol.md treats as a
      failure mode symmetric with overclaiming. Each entry therefore carries a
      constructible neighbour, and an entry without one may not be added.
    - >-
      EXTERNAL LITERATURE NOT CHECKED. Stated in novelty_status and repeated here
      because it is the most likely way this record is wrong.

  interpretation_limits:
    - >-
      A closure about instrument SHAPE is not a closure about the subject. Nothing
      here says degree of regularity is uninteresting, that isogeny classes have flat
      attack cost, or that displacement rank means anything in either direction.
    - >-
      Closure 2 is scoped by scale. At toy p the class minimum is computed exactly
      and is perfectly well defined; what is closed is its use as an estimate of a
      cryptographic-scale quantity.
    - >-
      Closure 3 is scoped to the instrument DESIGN and complies with
      DEC-20260727-009's prohibition on adjudicating phi_alpha in either direction.
      GOAL-ENDO-001's P2 makes this campaign the wrong place to revisit it in any
      case.
    - >-
      novelty_status is `unverified`. No external literature check was performed for
      the constructibility question, and this record must not be cited as
      establishing that none exists.

  reachability_gate: >-
    NOT APPLICABLE AS A MOVEMENT, and stated rather than omitted: this record moves
    between no curves and runs no walk. T5 nonetheless appears INSIDE Closure 2 as
    the third limb of the argument -- an instrument whose best possible output cannot
    change a conclusion because the winning curve is unreachable is not worth its
    null. That is a use of the gate as a reasoning step, not an evasion of it.

