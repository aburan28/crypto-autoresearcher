idea:
  id: IDEA-20260807-053a55
  question_id: RQ-TORS-8c7b79
  added: '2026-08-07'
  title: >-
    THE KERNEL-OR-INJECTIVE DICHOTOMY FOR ELL-ISOGENY POINT TRANSPORT: the images
    (phi(P), phi(Q)) under an F_p-rational Elkies ell-isogeny are genuinely
    point-dependent, publicly computable ell-torsion data obtainable without any
    discrete logarithm, and they create exactly zero new information about k --
    because every isogeny is either injective on G (a relabelling with an
    efficiently computable inverse) or contains G in its kernel (annihilating the
    instance), with no intermediate case, and the unique annihilating isogeny has
    degree N, costs Otilde(sqrt(N)) by sqrt-elu, and does not depend on Q at all
  class: mechanism

  claim: >-
    (A) THE POINT-DEPENDENT DATA, NAMED AS THE LANE DEMANDS. Let ell be an Elkies
    prime for E, i.e. X^2 - tX + p has a root mod ell, equivalently t^2 - 4p is a
    square mod ell, equivalently Frobenius has an eigenvalue in F_ell on E[ell],
    equivalently E admits an F_p-rational subgroup C of order ell. Let
    phi: E -> E' = E/C be the corresponding Vélu isogeny. The data
      D_ell(E, P, Q) = (E', phi(P), phi(Q))
    is POINT-dependent (it changes when P or Q changes with E fixed), and it is
    PUBLICLY COMPUTABLE WITHOUT A DISCRETE LOGARITHM by an explicit three-step
    procedure: (i) build psi_ell over F_p by the standard recurrence, degree
    (ell^2-1)/2 <= 84 for ell <= 13; (ii) factor psi_ell over F_p and identify the
    degree-(ell-1)/2 kernel polynomial h_C whose root set is the x-coordinate set
    of a Galois-stable order-ell subgroup, tested directly by closure of the root
    set under the x-only group law; (iii) apply Vélu's formulae to h_C to get E'
    and the rational maps of phi, then evaluate phi at P and at Q. Nothing in this
    pipeline uses k.

    (B) WHAT IT LEAKS ABOUT k: NOTHING, AND THE REASON IS A DICHOTOMY WITH NO
    MIDDLE CASE. Let psi: E -> E'' be ANY isogeny defined over F_p. Then
    ker(psi) intersect G is a subgroup of G. Since |G| = N is prime, that
    intersection is either trivial or all of G. Exactly two cases:
      CASE I -- ker(psi) ∩ G = {O}. Then psi restricted to G is an injective group
        homomorphism onto psi(G), which is cyclic of order N, and
        psi(Q) = psi([k]P) = [k]psi(P). The instance transports with k UNCHANGED
        (DECOMPOSITION.md T1). Moreover psi|_G is EFFICIENTLY INVERTIBLE: the dual
        isogeny satisfies psihat(psi(R)) = [deg psi]R, so
        R = [ (deg psi)^{-1} mod N ] psihat(psi(R)), and (deg psi)^{-1} mod N is a
        single modular inversion. Hence the transported instance and the original
        are inter-reducible in O(polylog) group operations plus the cost of one
        isogeny evaluation. FORMAL CONSEQUENCE (a simulator, in the style of
        KN-FIND-b7e091 but for a different oracle class): any algorithm A that is
        given (E, P, Q) together with D_ell for a set of Elkies primes can be
        simulated by an algorithm A' given only (E, P, Q), at an additive cost of
        one isogeny construction and evaluation per ell. Therefore D_ell cannot
        reduce the query complexity of solving for k below what A' achieves.
      CASE II -- G ⊆ ker(psi). Then psi(P) = psi(Q) = O and the instance is
        annihilated: both points collapse to the identity and every trace of k is
        destroyed. Because G is cyclic of prime order, the minimal such psi is the
        quotient by G itself, of degree exactly N.
    THERE IS NO THIRD CASE. In particular no isogeny PARTIALLY degenerates G, so
    no isogeny can create a claw or a collision in k that did not already exist.
    This is the exact structural reason the SIDH-style torsion-image attacks
    (KN-TECH-025, KN-TECH-026) have no ECDLP analogue: there the SECRET IS THE
    ISOGENY and the published torsion images are auxiliary data about it; here the
    isogeny is public and computable and the secret is a scalar on which every
    isogeny acts invertibly.

    (C) THE ANNIHILATING ISOGENY IS COMPUTABLE AND USELESS, WITH A COST FIGURE.
    Case II's isogeny E -> E/G is computable: its kernel is G = <P>, which is
    known. Vélu's formulae cost O(N) field operations; the sqrt-elu construction of
    Bernstein, De Feo, Leroux and Smith (KN-LIT-764) computes E/<P> and phi(R)
    in Otilde(sqrt(N)) field operations. So the cost of the ONLY isogeny that
    could touch k is Otilde(sqrt(N)) -- the same exponent as the rho baseline
    (KN-TECH-006) and BSGS (KN-TECH-031) -- and its output E/G depends only on the
    subgroup G, hence only on P, and is COMPLETELY INDEPENDENT OF Q and therefore
    of k. A quantity that is independent of Q cannot distinguish two targets. So
    the case that is not closed by the simulator is closed by a cost bound AND by
    a Q-independence argument, jointly.

    (D) WHAT THE DATA IS ACTUALLY GOOD FOR, STATED SO THE CLOSURE IS A REDIRECTION
    AND NOT A DEAD END. D_ell is the ONLY publicly computable way to move a
    POINT-CARRYING ECDLP instance between curves of an isogeny class. It is
    therefore the required instrument for every campaign lane that wants to compare
    attack cost across the class while keeping the same k: L1 (RQ-ICINV-475b5e),
    L2 (RQ-VOLC-f6253b), L13 (RQ-MTGT-2cabee), and the multi-step walk version in
    IDEA-20260807-631e80. This proposal therefore delivers (i) a closure of the
    k-information question with a named obstruction, and (ii) a verified,
    certificate-carrying transport primitive that the rest of the campaign
    consumes. Both are deliverables; the second is why the proposal is worth
    implementing rather than only deriving.

    (E) HARD-CONSTRAINT ENGAGEMENT. The lane's hard constraint says a curve-only
    statistic is k-independent by construction, so only point-dependent publicly
    computable data is interesting. D_ell passes that filter: it is point-dependent
    and publicly computable. This record's contribution is to show that passing the
    filter is NECESSARY BUT NOT SUFFICIENT, and to supply the second filter the
    lane actually needs: point-dependent data is uninteresting whenever the map
    producing it is efficiently invertible on G, because then a simulator exists.
    That second filter is reusable and is the record's main transferable output.

  resource_label: R5
  admissibility: admissible
  admissibility_argument: >-
    ADMISSIBLE as a resource use, with the closure delivered anyway. The
    admissibility filter excludes lanes whose only use of a map is to apply it to
    points of G. This proposal's PRIMARY consumption of R5 is not that: the
    Elkies condition, the factorisation of psi_ell over F_p, and the identification
    of the Galois-stable order-ell subgroup are all statements about E[ell] as a
    Galois module, invisible to the generic group oracle, and the kernel polynomial
    h_C is field data of exactly the kind R1 and R5 are defined to supply.
    HOWEVER -- and this is the honest part -- the moment the constructed phi is
    applied to P and Q, the filter bites in full: phi|_G is an injective
    homomorphism of a prime-order group, hence multiplication by a scalar under
    any identification (H-ENDO-001), and the resulting oracle is simulable by the
    explicit simulator in claim (B) Case I. So the resource genuinely escapes the
    generic model at the CURVE level and genuinely fails to escape it at the POINT
    level, and this record's job is to prove that boundary rather than to assert
    either side of it.

  discriminated_from:
    - >-
      EV-ICI-0bdaaa / H-ICI-063e91 / DEC-20260804-d0c452. That line tested whether
      the Elkies ell-isogeny PREIMAGE OF A FACTOR BASE augments index-calculus
      relation yield, and found the augmentation ratio indistinguishable from a
      random bijection at 8 of 9 cells with |aug - null| < 0.004. That is a
      measurement about factor bases and relation yield (R1). THIS proposal makes
      no factor-base claim and mounts no index calculus; it concerns the transport
      of the INSTANCE POINTS and proves a dichotomy rather than measuring a ratio.
      The overlap is the machinery (Elkies isogenies at small ell), and reusing
      that machinery rather than rebuilding it is part of the plan.
    - >-
      KN-FIND-b7e091 Oracle D (endomorphism images). That oracle returns phi(G),
      phi(Q) for endomorphisms phi of E, and is simulable because on prime-order
      prime-field curves with End = Z every phi is [m]. The present oracle returns
      images under ISOGENIES TO OTHER CURVES, which are not endomorphisms and whose
      images live in a different group; the simulator in claim (B) is therefore a
      NEW construction, not a citation. Filing it extends KN-FIND-b7e091 to a
      genuinely new oracle class, which is exactly the intended use of L12
      (RQ-GGMB-6eaabc).
    - >-
      KN-TECH-025 / KN-TECH-026 (SIDH torsion-point images and the Kani embedding
      attacks). Those break schemes that PUBLISH torsion images of a SECRET
      isogeny. This record explains why the pattern does not transfer: the ECDLP
      secret is a scalar, every isogeny acts invertibly on the prime-order
      subgroup, and there is no unbalanced-degree structure to exploit. This
      discrimination is stated because "SIDH was broken by torsion images, so
      torsion images should help here" is precisely the plausible-sounding
      inference this lane exists to test.
    - >-
      DECOMPOSITION.md T1/T2. T1 states transport preserves k and T2 states
      class-wide vulnerability. This record adds what T1/T2 do not: the DICHOTOMY
      (no partial degeneration), the SIMULATOR (so transported data adds no query
      power), the COST of the annihilating case, and its Q-independence.

  object_first_candidate:
    tracked_object: >-
      THE TRANSPORTED INSTANCE (E', phi(P), phi(Q)) -- the pair of points followed
      across one Elkies ell-isogeny, together with the curve it lands on.
    lossiness: >-
      FAILS THE LOSSY-PROJECTION TEST, and the record says so in advance rather
      than discovering it in an experiment. On G the map phi is injective and
      efficiently invertible via the dual isogeny and one modular inversion, so it
      discards NOTHING about the point. By docs/inventor-protocol.md section 2 that
      makes it a change of coordinates, not a new object. What IS genuinely lossy
      is the map at the CURVE level -- E |-> E/C forgets C and forgets the level of
      E in the ell-volcano when ell divides the conductor -- and that lossiness is
      k-independent by construction, which is the lane's hard constraint biting
      from the other side. The two halves of the object have opposite defects: the
      point half loses nothing, the curve half loses only k-independent data.
    propagation: >-
      Propagates deterministically and exactly: phi(R + S) = phi(R) + phi(S), and
      composing transports across several ell composes the isogenies. Exactness is
      what makes theorem (A) of IDEA-20260807-df906f apply -- an exactly
      propagating map on a prime-order group is injective or constant, and here it
      is injective, which is the "loses nothing" branch. The two records' arguments
      meet exactly here and neither is redundant.
    survival_score: >-
      Survives arbitrarily many transport steps with k unchanged, which sounds like
      strength and is in fact the closure: an object that survives everything while
      preserving all information is a relabelling. It "dies" only in Case II, where
      it destroys the instance instead.

  mechanism: >-
    STEP 1 (zero compute) -- write the dichotomy and the simulator. The simulator
    must be exhibited concretely: given an algorithm A expecting
    (E, P, Q, {D_ell}), the simulator A' constructs each D_ell itself from
    (E, P, Q) by the pipeline in claim (A) and forwards it. State the exact
    additive cost per ell in field operations and note that it does not depend on
    k. This is the whole closure and it costs nothing.

    STEP 2 (implementation, medium) -- the transport primitive:
      2a. psi_ell over F_p for ell in {3,5,7,11,13} (shared with
          IDEA-20260807-df906f; build once, cache).
      2b. Elkies test: check whether t^2 - 4p is a square mod ell, where t is
          obtained from the curve's order (computable exactly at toy scale by
          harness/toycurve.py's order()/order_bsgs()).
      2c. Kernel-polynomial extraction: factor psi_ell over F_p; for each candidate
          product of irreducible factors of total degree (ell-1)/2, test whether
          the root set is the x-coordinate set of a subgroup by checking closure
          under the x-only addition. Report ALL rational kernels found, because
          their COUNT is the volcano-level statistic used by
          IDEA-20260807-1d9c5f.
      2d. Vélu: construct E' and the rational maps; evaluate at P and Q.
      2e. CERTIFICATE (mandatory, docs/claims-and-verification.md): for every
          transport, emit and re-verify independently of the constructor --
          phi(P) lies on E'; phi(P) has order exactly N; phi(Q) = [k]phi(P) where
          k is the harness ground truth; and the round trip
          [ell^{-1} mod N] * phihat(phi(P)) = P. A transport that fails any of
          these four is an infrastructure failure (AGENTS.md rule 5), not evidence.

    STEP 3 (the measurement that is not implied by the dichotomy) -- transport
    COST, which the theory does not give: measure field operations and wall clock
    per Elkies step as a function of ell and field bits, and the number of Elkies
    primes among {3,5,7,11,13} per curve. This is the input L1, L2 and
    IDEA-20260807-631e80 need in order to charge their own designs honestly, and
    it is not derivable from the dichotomy.

    STEP 4 (the Case II cost check, small and decisive) -- construct E/<P> by plain
    Vélu at small N (N up to a few thousand, i.e. 12-16 field bits) and confirm
    (i) that phi(P) = phi(Q) = O, and (ii) that the resulting curve E/G is
    IDENTICAL for two different targets Q and Q' on the same (E, P). The second
    check is the Q-independence claim made concrete; it is cheap and it is the only
    empirical content Case II has. sqrt-elu (KN-LIT-764) is cited for the
    asymptotic Otilde(sqrt(N)) figure and is NOT implemented here; the record must
    not present the toy plain-Vélu run as validating the sqrt-elu cost.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Commands run 2026-08-07 from the repository root:
      `grep -ril "Elkies\|Atkin" ledger/ knowledge/ docs/ analysis/`;
      `grep -ri "Velu\|sqrt.lu" knowledge/`;
      `grep -ri "transport" analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md`;
      plus full reads of EV-ICI-0bdaaa, DEC-20260804-d0c452, KN-TECH-025,
      KN-FIND-b7e091, KN-LIT-764 (header and contribution), KN-LIT-237.
    results: >-
      Elkies/Atkin: 6 ledger records, all in the ICI line (Elkies isogeny preimages
      of a FACTOR BASE) or in the Wesolowski cost-model line (KN-FIND-4e7a92), plus
      the campaign's own RQ-TORS-8c7b79 and DECOMPOSITION.md. Vélu: KN-LIT-764
      (sqrt-elu, Otilde(sqrt(l)) per isogeny), KN-LIT-129 (SQALE), KN-LIT-065.
      Transport: DECOMPOSITION.md states T1 and T2 as [fact] but states no
      dichotomy, no simulator, and no cost for the annihilating case. NO record in
      ledger/ or knowledge/ states that every isogeny is injective-or-annihilating
      on a prime-order subgroup, and none exhibits the transported-instance
      simulator.
    verdict: >-
      ADAPTATION. The mathematics is elementary (prime order plus the kernel
      intersection) and Vélu, the dual isogeny, and sqrt-elu are all standard; no
      mathematical novelty is claimed. What is new to this corpus is the DICHOTOMY
      stated as a closure with a simulator, the Q-independence of the annihilating
      case, and the sqrt-elu cost figure attached to it. External novelty is
      UNVERIFIED: no web literature search for a prior published statement of the
      transported-instance simulator was performed in this session, and that gap is
      recorded rather than papered over.

  null_object_control: >-
    MANDATORY AND SUPPLIED. MATCHED NULL OBJECT: replace the Elkies isogeny phi by
    a RANDOM BIJECTION of G onto a cyclic group of order N -- concretely,
    R |-> [m]R for a uniformly random m in (Z/N)^*, composed with an arbitrary
    relabelling. This null has the same shape as transport (an injective
    homomorphism of G with an efficiently computable inverse) and the SAME
    information content, so every k-related statistic computed after transport must
    match it. This is deliberately the same null shape that EV-ICI-0bdaaa used and
    that produced |aug - null| < 0.004 in the factor-base setting; reusing it makes
    the two results directly comparable. DECAY PARAMETER: the number of composed
    transport steps. If any statistic appears to distinguish real transport from
    the random-bijection null, that difference must GROW with the number of steps
    if it reflects isogeny structure and must be flat or shrink if it is an
    artifact of one-step implementation detail. A difference identical at 1, 2 and
    4 steps is the canonical artifact tell (docs/inventor-protocol.md section 3).
    SECOND NULL, for the curve half: compare the transported curve E' against a
    uniformly random curve of the same p -- E' must be in the same isogeny class
    (same t) and the random curve must not, which is a blocking check that the
    transport is real and not a relabelling bug.

  assumptions:
    - >-
      gcd(ell, N) = 1 for every transport prime used, so phi is injective on G.
      Enforced by construction: ell <= 13 and N is the largest prime factor of
      #E(F_p), which at 16+ field bits exceeds 13. The driver asserts it.
    - >-
      t is exactly computable at toy scale, so the Elkies condition can be tested
      directly rather than inferred. harness/toycurve.py provides order() (O(p),
      exact) and order_bsgs() (Hasse-interval search). SEA is NOT available and is
      not required.
    - >-
      Vélu's formulae and the dual-isogeny relation phihat ∘ phi = [deg phi] are
      standard and are used without re-derivation; the certificate in STEP 2e
      checks them numerically on every instance, so a misimplementation is caught
      per-transport rather than assumed away.
    - >-
      The sqrt-elu figure Otilde(sqrt(l)) is RELAYED from KN-LIT-764's reported
      contribution and abstract; that paper was not read in full here and the
      figure is not re-derived. It is used only for the Case II asymptotic remark
      and nothing in this proposal's own measurements depends on it.

  proof_search_map:
    bottleneck: >-
      The kernel-polynomial extraction (STEP 2c). Factoring psi_ell over F_p is
      cheap at degree <= 84, but identifying WHICH product of irreducible factors
      is a Galois-stable subgroup requires a subgroup-closure test over candidate
      factor subsets, and the number of subsets grows with the number of
      irreducible factors. This is the exact step whose feasibility bounds the
      largest usable ell, and it is why the declared cap is ell <= 13.
    baseline_embedding:
      parameter_slice: >-
        ell = 3 on a curve where 3 is an Elkies prime and where the rational
        3-isogeny can be verified independently: the kernel is a Galois-stable
        subgroup of order 3, so h_C has degree 1 and is a single linear factor of
        psi_3 (degree 4). At that slice the whole pipeline reduces to finding a
        root of a quartic, which is checkable by hand.
      reproduction_check: >-
        Frozen fixture: one 16-bit curve with 3 Elkies, with h_C, E', phi(P),
        phi(Q) all recorded, and an independent recomputation of #E' by
        harness/toycurve.py's order(), which must equal #E exactly (isogenous
        curves over F_p have equal order). An order mismatch is a hard failure of
        the transport implementation.
    observation_collision:
      observable: >-
        The transported instance (E', phi(P), phi(Q)).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED IN ONE DIRECTION AND FAIL IN THE OTHER,
        which is the sharpest audit available here. (i) Two DIFFERENT k values give
        DIFFERENT transported instances -- so the observable does not collide
        across targets and transport is not lossy on k. (ii) Two different starting
        curves E_1, E_2 in the same class can transport to the SAME E' -- so the
        observable does collide across sources, which is precisely the curve-level
        lossiness. The pair of results, one collision and one non-collision, is the
        empirical form of the dichotomy and must both be exhibited.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the question "does moving the instance between curves help?" into
          the exact algebraic condition "is ker(psi) ∩ G trivial or everything?",
          where it becomes a statement about subgroups of a group of prime order
          and is decided immediately. Encoding obligation: every isogeny used must
          be F_p-rational with computable kernel. Soundness obligation: the
          simulator must not need k. Transfer obligation: the conclusion must be
          stated for composed transports, not only single steps -- it is, because
          the composition of injective maps is injective.
        predicted_gain: >-
          Converts an open-ended empirical question about isogeny classes into a
          two-case argument with zero compute. No attack gain.
      - transform: observable_fiber
        proposed_object: >-
          Hold the transported curve E' fixed and vary the source: the fibre is the
          set of curves in the class admitting an ell-isogeny to E', which is
          non-trivial and is exactly the volcano-neighbourhood structure. The
          intrinsic invariant distinguishing them is the volcano level, which is
          k-independent -- the handoff to IDEA-20260807-1d9c5f.
        predicted_gain: >-
          Identifies precisely where the object's real (curve-level) content lives
          and confirms it is on the k-independent side.
    quantifier_order: >-
      Claimed: FORALL F_p-rational isogenies psi from E, FORALL instances
      (E, P, Q) with P of prime order N, EITHER psi|_G is injective (and then
      FORALL k, psi(Q) = [k]psi(P), and THERE EXISTS an efficiently computable
      inverse on psi(G)) OR G ⊆ ker(psi) (and then FORALL k, psi(P) = psi(Q) = O).
      The witness (which case) depends on psi and E but NOT on k or Q, which is
      exactly the uniformity the closure needs. The dangerous weaker reading NOT
      claimed: "for every k there exists an isogeny that is injective on G",
      which is true but vacuous.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Adding transported instances across F_p-rational isogenies to the
        adversary's input does not reduce the number of group operations needed to
        recover k, because the extra input is self-generatable." It can NEVER
        certify anything about isogenies not defined over F_p, about
        higher-dimensional (Kani-style) embeddings, about instances where the
        isogeny itself is secret, or about the ECDLP's absolute difficulty.
      nearby_object_control: >-
        The nearby object where the conclusion FAILS is SIDH (KN-TECH-025): there
        the isogeny is secret and unbalanced-degree, torsion images are published,
        and the analogous "extra input" is famously NOT self-generatable -- it
        broke the scheme. A method that could not distinguish the ECDLP setting
        from SIDH would not have identified the load-bearing structure, which is
        WHO KNOWS THE ISOGENY. The write-up must exhibit that contrast explicitly.
    proof_obligations:
      - claim: ker(psi) ∩ G is trivial or all of G, because |G| is prime.
        responsibility: correctness
      - claim: phi|_G injective implies phi(Q) = [k]phi(P) with the same k.
        responsibility: correctness
      - claim: The inverse of phi|_G is computable as [deg phi ^{-1} mod N] ∘ phihat.
        responsibility: correctness
      - claim: The simulator constructs D_ell without k, at the stated additive cost.
        responsibility: interface
      - claim: E/<P> depends only on P, not on Q.
        responsibility: correctness
      - claim: The Otilde(sqrt(N)) figure for E/<P> is relayed from KN-LIT-764 and not re-derived.
        responsibility: scope
      - claim: Every transport carries a certificate re-verified independently of the constructor.
        responsibility: correctness

  predictions:
    - metric: >-
        Transport certificate pass rate: phi(P) on E', order of phi(P) equal to N,
        phi(Q) = [k]phi(P) against harness ground truth, and the dual round trip
      direction: different
      minimum_effect: >-
        100 percent pass across all Elkies ell in {3,5,7,11,13} and all cells at
        16, 20 and 24 field bits. Any failure is an implementation failure under
        AGENTS.md rule 5 and blocks every downstream lane that consumes this
        primitive. BASIS - derivation (T1 plus the dual-isogeny relation);
        NOT measured anywhere in this campaign.
    - metric: >-
        #E'(F_p) compared with #E(F_p) after each transport
      direction: different
      minimum_effect: >-
        Exactly equal on 100 percent of transports. A single mismatch means the
        constructed curve is not isogenous and the pipeline is wrong. BASIS -
        standard (isogenous curves over F_p have equal order); used here as a
        KNOWN-ANSWER CALIBRATION.
    - metric: >-
        E/<P> computed from two instances (E, P, Q) and (E, P, Q') with Q != Q'
      direction: different
      minimum_effect: >-
        Identical j-invariant on 100 percent of pairs, at 12-16 field bits where
        plain Vélu at degree N is affordable. This is the Q-independence claim made
        concrete and is the only falsifiable content of Case II. BASIS -
        derivation; UNTESTED.
    - metric: >-
        Number of Elkies primes among {3,5,7,11,13} per curve, over 50 random toy
        curves at each field size
      direction: different
      minimum_effect: >-
        Reported as a distribution, not as a threshold. The heuristic expectation
        is about half of the five primes (each ell is Elkies when t^2 - 4p is a
        square mod ell), giving a mean near 2.5, and the measured mean is compared
        against that. This is a HEURISTIC EXPECTATION (see H1), not a theorem, and
        a deviation is informative about the toy family's curve generator rather
        than about the mathematics.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, the primary deliverable): the dichotomy, the
      simulator, the Q-independence argument, and the SIDH contrast, written out.
      STAGE 1 (hours): implement 2a-2d and validate on the ell = 3 frozen fixture
      with the independent order recomputation.
      STAGE 2 (HARD GATE): the four-part transport certificate on every transport.
      No downstream number is reported until this passes at 100 percent.
      STAGE 3 (hours): transport cost measurement across ell in {3,5,7,11,13} and
      16/20/24 field bits, 5 seeds each; report field operations and wall clock per
      step and the Elkies-prime distribution.
      STAGE 4 (minutes): the Case II Q-independence check at 12-16 bits by plain
      Vélu at degree N.
      STAGE 5 (hours): the random-bijection null and the composed-step decay test.
      BUDGET NOTE: ell is capped at 13 because deg psi_ell = (ell^2-1)/2 reaches 84
      there and the kernel-subset search in 2c grows with the factor count; ell = 17
      (degree 144) is explicitly out of scope for this contract.
    controls:
      - random-bijection null [m]R with m uniform in (Z/N)^* (blocking)
      - random-curve second null: transported curve must share t, random curve must not (blocking)
      - independent recomputation of #E' by order()/order_bsgs() (blocking)
      - four-part transport certificate per transport (blocking)
      - composed-step decay test at 1, 2, 4 steps
      - >-
        Atkin-prime negative control: for a prime ell where t^2 - 4p is a
        non-residue mod ell, the pipeline must find NO rational kernel polynomial.
        An implementation that returns a kernel for an Atkin prime is wrong.
    required_metrics:
      - certificate pass/fail per transport, with the four sub-checks separately
      - #E' versus #E per transport
      - field operations and wall clock per Elkies step, by ell and field bits
      - number and identity of Elkies primes per curve
      - j-invariant of E/<P> for paired (Q, Q') at 12-16 bits
      - random-bijection null statistics on the identical pipeline
      - kernel count per (curve, ell) -- handed to IDEA-20260807-1d9c5f

  falsification_conditions:
    - >-
      A transport is found for which phi(Q) != [k]phi(P) with the certificate's
      other three checks passing. This contradicts T1 and an elementary property of
      group homomorphisms; treat as a suspected implementation error and replicate
      independently before reporting anything else.
    - >-
      An isogeny is exhibited whose kernel meets G in a proper non-trivial
      subgroup. This contradicts primality of N and is an arithmetic error.
    - >-
      E/<P> differs between two instances sharing (E, P). The Q-independence claim
      is false as stated and the Case II half of the closure is withdrawn.
    - >-
      The Atkin-prime negative control returns a rational kernel polynomial. The
      kernel-extraction test is wrong and every kernel count it produced is void.
    - >-
      The kernel-subset search at ell = 11 or 13 exceeds the wall-clock budget on
      a majority of curves. That is an INFRASTRUCTURE outcome under AGENTS.md
      rule 5, is recorded as a scope reduction of the declared ell ladder, and is
      not evidence about the dichotomy.

  confounders:
    - >-
      Kernel ambiguity when several rational ell-isogenies exist. On a curve at the
      crater of the ell-volcano there can be two or more rational kernels; the
      transport is then not canonical and the choice must be recorded per
      transport, or two runs that differ only in kernel choice will look like
      irreproducibility.
    - >-
      The ramified case ell | (t^2 - 4p), where the characteristic polynomial has a
      double root mod ell. The Elkies/Atkin dichotomy has this third, exceptional
      branch and the driver must classify it explicitly rather than forcing it into
      one side.
    - >-
      Vélu normalisation. E' is determined up to F_p-isomorphism by the formulae
      used; a different normalisation changes (a', b') and hence the j-invariant
      comparison. The convention must be frozen before STAGE 3 and reported with
      every transported curve.
    - >-
      Toy-scale curve generation (KN-TECH-034): anomalous curves (#E = p,
      KN-TECH-033) and smooth-order curves (KN-TECH-030) must be excluded from the
      run set before any cost number is interpreted.

  interpretation_limits:
    - >-
      This closes the k-information content of F_p-rational isogeny transport. It
      says nothing about isogenies over extension fields, about higher-dimensional
      embeddings (KN-TECH-026), or about settings where the isogeny is secret.
    - >-
      The cost numbers in STAGE 3 are toy-scale pure-Python measurements and are
      NOT a cost model for any cryptographic size; they exist to let other lanes
      charge their designs honestly at the same scale.
    - >-
      The Otilde(sqrt(N)) figure for the annihilating isogeny is relayed from
      KN-LIT-764 and is not validated here.
    - >-
      A passing certificate proves the transport is correct on that instance. It
      proves nothing about hardness (docs/claims-and-verification.md), and no
      evidence record derived from this may assert above claim_tier: toy.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For the declared toy curve family, a fixed small prime ell is an Elkies
        prime for a uniformly generated curve with probability approaching 1/2,
        independently across the ell in {3,5,7,11,13} up to the constraints imposed
        by t being fixed once the curve is drawn -- so the number of Elkies primes
        among the five behaves like a Binomial(5, 1/2) variable with mean 2.5.
      rigorous_support: >-
        The rigorous half: ell is Elkies exactly when t^2 - 4p is a square mod ell,
        which for a FIXED curve is a decidable condition with no probability in it
        at all. The distributional half imitates the classical equidistribution
        statements for Frobenius traces -- the Elkies/Atkin split for reductions of
        a fixed curve is the subject of KN-LIT-1175 (least Elkies prime bounded by
        (2 log 4q + 4)^2 under GRH) and KN-LIT-1310 (asymptotic distribution of the
        Elkies-prime count is Gaussian). Both are RELAYED FROM ABSTRACTS in this
        corpus and neither was read in full here; they are cited as the classical
        statements the heuristic imitates, not as proofs of it.
      validation_plan: >-
        SAMPLE: 50 curves per field size at 16, 20, 24 bits, drawn by
        harness/toycurve.py's deterministic generator with recorded seeds, with
        t computed exactly. SHORTCUT: none is needed -- exact point counting is
        affordable at these sizes, which is why toy scale is the right place to
        measure this. COMPARISON DISTRIBUTION: the empirical count distribution
        against Binomial(5, 1/2), by chi-squared. TAIL CHECK: the fraction of
        curves with ZERO Elkies primes among the five, compared against the
        predicted 1/32; a heavy zero tail would mean transport is unavailable on a
        material fraction of curves and would directly reduce the reach of
        IDEA-20260807-631e80. TOY SCALE ONLY, LABELLED AS SUCH: this validates a
        toy-family property, not a cryptographic-scale distribution, and the
        Gaussian result of KN-LIT-1310 is about a different (large-ell, many-prime)
        regime and is not tested here.

  reachability_gate: >-
    REQUIRED AND ANSWERED, because this proposal moves between curves.
    IS A GOOD OBJECT REACHABLE, AND AT WHAT COST? One Elkies step reaches a
    SPECIFIC ell-isogenous neighbour at cost O(polylog p) field operations at toy
    scale (measured in STAGE 3), and there are at most 2 horizontal plus
    level-dependent descending neighbours per Elkies ell. Under T5, a UNIFORMLY
    RANDOM curve in the class is reachable in O(log p) steps because the crater is
    a Cayley graph of Cl(O) and is a rapid mixer under GRH (KN-LIT-237, relayed
    from abstract). A SPECIFIED curve is the vectorization problem and costs
    ~sqrt(h(O)) ~ p^{1/4} classically at best. THIS PROPOSAL DOES NOT NEED EITHER
    GUARANTEE: it makes a claim about ONE step and about the composition of steps,
    both of which are cheap and local. The reachability gate therefore does not
    bind here -- but it binds hard on IDEA-20260807-631e80, which is exactly why
    that proposal is separate and carries the mixing measurement. Recording the
    gate as non-binding, with the reason, is the honest answer rather than an
    omission.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; the record's content is that transport moves
      no exponent. Case I: transport costs O(polylog p) per step and preserves the
      exponent exactly. Case II: the annihilating isogeny costs Otilde(N^{1/2})
      field operations by sqrt-elu (KN-LIT-764, relayed), which is the SAME
      exponent as the rho baseline, and its output is k-independent, so it cannot
      be part of a faster attack even at that cost.
    memory_exponent: >-
      O(polylog) for Case I transport (one kernel polynomial of degree <= 84 plus
      the rational maps). Case II by plain Vélu is O(N) memory and by sqrt-elu is
      Otilde(N^{1/2}); the latter is relayed, not measured.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and small per-processor memory (KN-TECH-001, KN-TECH-006), with
      the automorphism discount of at most sqrt(|Aut|) on CM curves (KN-TECH-018);
      BSGS at 2*sqrt(N) operations and sqrt(N) storage (KN-TECH-031);
      Pohlig-Hellman fixing N (KN-TECH-030). Transport changes none of these on
      either side of an isogeny, which is the content of T2.
    hidden_overhead: >-
      The polylog transport cost hides a per-curve setup: building psi_ell (degree
      up to 84) and the kernel-subset search, both of which are one-off per
      (curve, ell) but are the actual wall-clock driver at toy scale in pure
      Python. The Otilde in the sqrt-elu figure hides log factors that KN-LIT-764
      states and that are not reproduced here.
    tradeoff_note: >-
      Transport is a pure time cost with negligible memory, so it sits at the
      low-memory end and does not interact with the van Oorschot-Wiener
      time-memory curve. It parallelises trivially across curves and across ell,
      which matters only for the instrument's throughput, not for any attack.

  dominated_by: >-
    AS AN ATTACK: mounts none, and proves it cannot. Dominated on every axis by
    every row of the prime-field frontier, checked individually: parallel rho with
    distinguished points (0.886*sqrt(N) group operations, O(1) memory per
    processor, linear parallel speedup, KN-TECH-001/KN-TECH-006); the
    automorphism-discounted rho variant on CM curves (KN-TECH-018); BSGS
    (2*sqrt(N) time, sqrt(N) memory, KN-TECH-031); Pohlig-Hellman (KN-TECH-030).
    Data/query axis: transport ADDS data (the transported instances) and by the
    simulator that added data is worth nothing, so it is dominated there too.
    AS AN INSTRUMENT: the incumbent is "no point-carrying cross-curve transport
    exists in this program's harness", so on the instrument axis this is not
    dominated -- it is the first such primitive, and its value is that L1, L2,
    L13 and IDEA-20260807-631e80 cannot run without it.
  sota_delta: >-
    Zero speedup against any attack baseline, and a proof that zero is the correct
    value rather than an unmeasured guess. Quantified deltas actually claimed:
    (i) a simulator reducing the transported-instance oracle to the plain instance
    at an additive cost of one isogeny construction and evaluation per ell --
    O(polylog p) at toy scale, measured in STAGE 3; (ii) a cost figure of
    Otilde(N^{1/2}) (relayed, KN-LIT-764) for the unique k-touching isogeny,
    matching the rho exponent exactly, with the additional and decisive property
    that its output is independent of Q; (iii) a certificate-carrying transport
    primitive with a four-part independent re-verification, which no existing
    harness module provides.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.98 that the dichotomy and the simulator are correct -- both are elementary,
    and the residual is that "isogeny defined over F_p" hides a separability or
    inseparability case at ell = p that the write-up must handle explicitly.
    0.8 that the kernel-extraction pipeline works at ell <= 7 on first
    implementation and 0.55 at ell in {11, 13}, where the factor-subset search is
    the risk. 0.95 that the Q-independence check at 12-16 bits confirms as
    predicted. Near 0 that any k-information is found, and the record is filed
    BECAUSE that near-zero is a proof rather than a guess, plus the instrument is
    needed downstream regardless of the closure.

