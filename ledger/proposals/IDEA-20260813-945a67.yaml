idea:
  id: IDEA-20260813-945a67
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SLHDSA-001
  goal_id: GOAL-SLHDSA-001
  title: Constants-tracked ADRS alias propagation bound with subtree-reuse certificates
  class: mechanism
  claim: >-
    Under a frozen single-fault model for stateless SLH-DSA address handling, every
    fault that makes two logically distinct hash invocations use the same effective
    ADRS either yields an explicit node/subtree-reuse certificate or lies in a
    separately enumerated non-alias class; the first deliverable is a constants-
    tracked upper bound on alias opportunities per signing transcript, not a
    forgery, security loss, or deployed exploit claim.
  mechanism: >-
    Model ADRS construction and mutation as a typed data-flow graph from layer,
    tree, type, key-pair, chain, hash, and tree-height/index fields to every
    tweakable-hash invocation. Propagate a declared overwrite, skip, stale-load,
    or bit fault symbolically. When two graph sinks acquire an identical effective
    address, emit the two logical node descriptors, their first merge point, and
    the maximal reused node or subtree as a verifier-checkable alias certificate.
    Count opportunities with exact loop and parameter constants instead of a
    qualitative fault narrative.
  why_not_a_renamed_known_approach: >-
    The semantic receipt identifies IDEA-20260807-c4f1fc as an object-first fault
    neighbor with novelty and identifiability context. This proposal's distinct
    deliverable is an ADRS-field propagation theorem, exact opportunity count, and
    node/subtree-reuse certificate. It does not infer paper contents from the two
    unreviewed-preprint hits and does not merge fault resistance into the ordinary
    FIPS 205 proof-slack claim class.
  predictions:
    - observable: Effective-address collision pairs under each frozen fault primitive
      metric: Exact count by parameter set, ADRS field, hash family, layer, and first graph merge point
      predicted: Every counted pair has a replayable certificate; uncertified pairs falsify completeness
    - observable: Reused-object extent
      metric: Node count and subtree height covered by the certified alias
      predicted: Field faults separate into local-node, chain-segment, authentication-path, and subtree classes rather than one undifferentiated count
    - observable: Bound tightness on a toy complete trace
      metric: Enumerated alias pairs divided by the symbolic upper bound
      predicted: Enumeration never exceeds the bound; a large avoidable gap identifies exactly which union-bound term is slack
  minimal_test:
    parameter_slice: One source-verified tiny hypertree/FORS/WOTS+ parameterization preserving every ADRS field transition, plus symbolic parameter variables for the theorem statement.
    procedure:
      - Reproduce the fault-free ADRS trace and prove all logical objects have the intended typed addresses.
      - Freeze one fault primitive and injection time before enumerating traces.
      - Generate alias certificates from the symbolic graph and independently enumerate all toy sink pairs.
      - Check certificate replay, compare exact counts with every constants-tracked bound term, and retain non-alias fault outcomes separately.
    discriminating_outcomes:
      - Certified aliases matching enumeration support propagation completeness, not exploitability.
      - Equal hash outputs without equal effective ADRS support an ordinary hash-collision explanation, not address aliasing.
      - Identical ADRS with different logical objects but no shared secret-dependent hash input supports domain reuse without node reuse; it must remain a separate class.
  controls:
    - Exact null: inject the identical fault primitives into a typed shadow implementation whose ADRS word is recomputed from immutable logical coordinates immediately before each hash; alias count must be zero except declared logical duplicates.
    - Planted positive: force one selected tree-index field to a known earlier value for a chosen interval; the analyzer must emit the predetermined node pair and maximal reused subtree certificate.
    - Fault-free control: enumerate the same transcript with no injection and require injective logical-object-to-effective-address mapping modulo explicitly allowed repeats.
    - Nearby control: corrupt message or hash-input bytes while leaving ADRS unchanged to distinguish data faults from address aliases.
  confounders:
    - An incorrect or incomplete FIPS 205 ADRS state machine.
    - Undefined implementation behavior, compiler transformations, or transient hardware faults outside the frozen abstract model.
    - Logical objects that legitimately share an address by specification convention.
    - Treating identical ADRS as reused secret-dependent input without checking the full hash-call tuple.
  falsification_conditions:
    - Toy enumeration finds an address alias not represented by a symbolic path and certificate.
    - The planted-positive maximal reused object is misidentified.
    - The exact-null implementation produces an unexplained alias.
    - The symbolic upper bound is violated or hides parameter-dependent factors in big-O notation.
  interpretation_limits:
    - An alias certificate is not a forgery certificate and says nothing about fault feasibility on a real device.
    - The bound covers only the frozen stateless single-fault primitives and injection windows.
    - No conventional FIPS 205 security-proof bound is weakened by this separate fault analysis.
    - Multi-fault, persistent-state, side-channel, and implementation-specific effects are out of scope.
  assumptions:
    - The authoritative FIPS 205 text and a reference ADRS construction are retrieved and line-by-line bound before approval.
    - Logical node identity and the complete tweakable-hash input tuple can be reconstructed from a trace.
    - The fault model specifies location, timing, duration, value distribution, and attacker observation.
  heuristic_assumptions:
    - id: H1
      statement: The frozen abstract fault primitives approximate at least one implementable stateless fault channel.
      validation: Require an implementation-specific mapping and fault-injection evidence in a separately approved task; until then label feasibility unverified.
    - id: H2
      statement: Reused-object extent correlates with cryptanalytic relevance.
      validation: Compare certificate classes against a separate oracle experiment that reveals only the duplicated hash-call tuple; nonmonotone or null response blocks any exploitability inference.
  proof_search_map:
    bottleneck: Prove typed address injectivity without faults, complete symbolic propagation with faults, and an exact alias-opportunity count without assuming that aliases imply forgeries.
    baseline_embedding:
      parameter_slice: Source-verified tiny instances exercising FORS, WOTS+, and hypertree address transitions.
      reproduction_check: Reproduce every fault-free ADRS word and hash-call tuple from the authoritative algorithm before injecting faults.
    observation_collision:
      audit: Search for distinct logical nodes with equal ADRS but unequal hash inputs, and equal hash outputs with unequal ADRS, so neither observable is mistaken for a reuse certificate.
      failure_response: Strengthen the certificate to the full typed hash-call tuple or narrow the claim class.
    constructive_transforms:
      - Typed SSA/data-flow expansion of ADRS writes
      - Fault-symbol propagation to hash-call sinks
      - Lowest-common-ancestor transform from colliding node descriptors to maximal reused-subtree certificate
    quantifier_order: >-
      Fix the parameter set, implementation trace semantics, fault primitive, and
      injection window first. For every single injection in that set, every
      effective-address collision is certified or assigned to a named non-alias
      outcome; probability enters only after a fault distribution is separately declared.
    method_ceiling:
      statement: Symbolic reachability and counting prove opportunity bounds only; they cannot establish physical fault rates or forgery advantage.
      nearby_counterobject: A message-data fault can duplicate a hash output or node value while preserving distinct effective addresses.
    proof_obligations:
      - Fault-free typed-address injectivity lemma
      - Per-primitive propagation completeness lemma
      - Certificate correctness and maximality lemma
      - Exact per-component opportunity count and constants-tracked total bound
      - Explicit separation from any later exploitability or advantage reduction
    not_applicable_reason: null
  target_complexity:
    time_exponent: null
    memory_exponent: null
    best_known_baseline: Source-verified FIPS 205 address-transition count and the nearest internal object-first fault analysis; no primary-source fault bound is asserted.
    hidden_overhead_disclosure: Full signing traces, symbolic fault states, certificate generation, enumeration, replay verification, preprocessing, and storage are charged per parameter set.
    time_memory_tradeoff: Materializing all sink states enables pairwise audit at high memory; streaming with indexed address summaries lowers memory but repeats provenance reconstruction.
  sota_delta: >-
