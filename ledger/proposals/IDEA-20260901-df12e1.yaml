      verified_by: this idea-generator session, fetch-tool summary of the ar5iv page
    - ref: IDEA-20260805-72bcb5
      provenance: internal
      claim: >-
        Charges block Wiedemann in bytes with an information-theoretic
        per-row floor and a sequential-depth floor; its traffic identity
        counts bytes streamed from memory, not bytes crossing domains. This
        record adds the cross-domain term, which is the one a partition can
        or cannot move.
      verified_by: this idea-generator session, claim block read
    - ref: IDEA-20260805-1775f2
      provenance: internal
      claim: >-
        Charges the shared matrix as S^theta; the exponent theta is a
        convention about memory, not about communication. This record
        measures the graph property that decides whether communication is
        Theta(M) per iteration regardless of convention.
      verified_by: this idea-generator session, claim block read
    - ref: KN-LIT-094
      provenance: kb
      claim: >-
        Full-cost model in which wiring a large memory costs; the reason a
        cut fraction is a cost quantity and not a curiosity.
      verified_by: this idea-generator session, corpus note read
    - ref: >-
        Friedman, A proof of Alon's second eigenvalue conjecture, 2003/2008;
        Bollobas, The isoperimetric number of random regular graphs, 1988
      provenance: recalled
      claim: >-
        RECALLED. Random regular graphs are expanders almost surely with an
        isoperimetric constant bounded below; the rigorous graph fact that
        H1 imitates for hypergraphs.
      verified_by: null

  novelty_screen:
    method: >-
      FILESYSTEM AND LEDGER SCREENING, WEB SEARCH FOR MATRIX PARTITIONING IN
      NFS LINEAR ALGEBRA. Grepped ledger/proposals for METIS, nested
      dissection, edge cut, block Lanczos, hypergraph, partition, expander;
      read the claim blocks of the linear-algebra cost records. Web search
      found Bisseling-Flesch 2006 and GPU block-Wiedemann papers; none
      reachable in full.
    results: >-
      Partitioning NFS matrices for parallel linear algebra is established
      practice (Mondriaan case study; CADO's bwc uses a two-dimensional
      process grid). No record in this ledger, and no source reached this
      session, states the cut fraction's scaling in M or compares it with a
      degree-matched random null, which is the identifiability question this
      record poses. The 'structured elimination' family the RQ names as
      forward guidance is addressed at the exponent level by the same
      measurement, since elimination fill is governed by separators.
    verdict: >-
      UNVERIFIED. The instrument is standard; the question (null-matched,
      size-scaled cut fraction as an exponent obstruction) is not found in
      the sources reached, but the nearest paper could not be read.

  object_first_candidate:
    tracked_object: >-
      THE CUT FRACTION phi(k, M) OF THE RELATION-BY-PRIME HYPERGRAPH, followed
      across k and across the matrix dimension M, and compared with its value
      on a degree-matched null. Off-limits as the primary lens: block
      Wiedemann and block Lanczos variants, merge heuristics, GPU or cluster
      implementations, Galois-symmetry quotients. This record proposes no
      linear-algebra method; it measures the one graph quantity every such
      method's communication is bounded by.
    lossiness: >-
      PASSES. The projection matrix -> phi(k, M) discards every entry, every
      row identity and the field; it keeps one number per (k, M). It is lossy
      by construction and not a change of coordinates. It is compatible with
      the operation of interest because the communication of a matrix-vector
      product under a given partition is a function of the cut alone, and
      the minimum over partitions is a property of the hypergraph, invariant
      under row and column permutation -- so reordering tricks cannot change
      it, which is precisely why it decides the exponent question.
    propagation: >-
      One step is one size. phi at the next size is predicted under (E) to
      equal phi at this size within noise and to equal the null; under (S) it
      is predicted to fall. The per-step measurement is the pair (phi_real,
      phi_null) at each M, and the reading is the difference and the trend.
    survival_score: >-
      Survives at every size the pipeline produces a matrix for; dissolves
      where the partitioner's heuristic quality changes with M (H2 guards
      this) and at cryptographic sizes where the matrix cannot be produced
      and the conclusion is a transfer under H1.

  proof_search_map:
    bottleneck: >-
      The per-iteration cross-domain communication of block Wiedemann, whose
      exponent equals that of M times phi. If phi is a constant this term's
      exponent is beta and the total's is 2 beta, matched to arithmetic, and
      the 'communication wall' is a constant-factor wall; if phi decays the
      exponent drops.
    baseline_embedding:
      parameter_slice: >-
        k = 1 gives phi = 0 trivially (no communication) and must be
        reproduced; a random balanced partition gives phi close to
        1 - 1/k per pin-touching column and is the upper-bound slice every
        partitioner must beat. The configuration-model null at each k is the
        baseline the real matrix is read against.
      reproduction_check: >-
        Frozen fixture, a synthetic random hypergraph with the degree
        sequences of the 60-digit matrix, whose phi under the chosen
        partitioner is computed once and stored; the pipeline must reproduce
        it within 2 per cent before any real matrix is read.
    observation_collision:
      observable: >-
        phi(k, M) and its difference from the null. Two hypergraphs with the
        same degree sequences and different structure could share phi -- for
        instance a planted-separator hypergraph whose separator the
        partitioner fails to find. That collision is exactly H2's failure
        mode, and it is guarded by two independent partitioners and by a
        PLANTED-STRUCTURE positive control, a matrix rewired to contain a
        known small separator, on which phi must fall.
      distinct_preimage_search: >-
        Planted-separator matrices at three separator sizes are constructed
        from the real matrix by rewiring and the partitioners must recover
        phi below the null by the planted amount; if they do not, the
        instrument cannot see structure and no negative is read.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the degree sequences fixed (the null) and vary the forgotten
          structure -- the correlations between rows that share a special-q,
          the dense small-prime block, merge fill -- by ablating each in
          turn: remove dense columns, permute rows within special-q groups,
          reverse merge. Read phi after each ablation.
        predicted_gain: >-
          Under (S), the ablation that returns phi to the null names the
          ingredient carrying the structure; under (E), no ablation changes
          phi and the closure is stronger for having tried them.
    quantifier_order: >-
      Under (E): FOR ALL k >= 2 and FOR ALL sizes M in the range run, phi(k,
      M) >= phi_null(k, M) (1 - delta) with delta the noise band; the witness
      partition may depend on the matrix and the conclusion may not. The
      claimed consequence for cryptographic sizes is a transfer under H1 and
      is stated as conditional. Under (S): THERE EXISTS a k and a trend in M
      with phi below the null, exhibited by the partitions themselves.
    method_ceiling:
      strongest_certifiable_claim: >-
        A measured cut fraction with intervals at three sizes for two
        problems, and its relation to the degree-matched null; hence a
        conditional statement that partition-based or separator-based
        communication reduction cannot (E) or can (S) move the communication
        exponent at these sizes. It cannot certify anything about the
        arithmetic term, about memory, or about implementations; and (E)
        cannot rule out structure a hypergraph partitioner does not see, only
        structure it does.
      nearby_object_control: >-
        THE PLANTED-SEPARATOR MATRIX, on which the conclusion of (E) is known
        false by construction; the instrument must show phi falling by the
        planted amount there. A second nearby object is the DENSE-COLUMN-
        STRIPPED matrix, where bwc already separates the small primes and
        where phi is predicted to move toward the null if the dense block was
        carrying whatever structure the full matrix shows.
    proof_obligations:
      - claim: >-
          The cross-domain communication of a matrix-vector product under a
          k-partition equals the connectivity cut of the column hyperedges.
        responsibility: baseline
      - claim: >-
          The configuration-model rewiring preserves both degree sequences
          exactly and mixes (10 times the pin count of swaps, with a
          convergence check on phi across replicates).
        responsibility: correctness
      - claim: >-
          The partitioners are within a constant factor of optimal on both
          real and null instances, evidenced by two partitioners agreeing
          and by the planted-separator recovery.
        responsibility: feasibility
      - claim: >-
          Total communication over a run scales as phi times nonzeros times
          M, so the exponent statement follows from phi's trend.
        responsibility: runtime
      - claim: >-
          Scope: matrices from one implementation at 60-100 digits, two
          problems, the partitioners named, the k range 2-64.
        responsibility: scope

  assumptions:
    - >-
      The post-merge matrices from IDEA-20260901-dedcea's runs (or fresh runs
      of the same pipeline) are available in CADO's sparse format at three
      sizes for both problems; if only two sizes exist, the trend in M is
      reported on two points and labelled as such.
    - >-
      An open hypergraph partitioner (KaHyPar, PaToH or Mondriaan) handles
      matrices up to a few million rows on one workstation; the 100-digit
      matrix may need coarsening, which is declared.
    - >-
      Dense columns are identified by a declared weight threshold committed
      before partitioning.

  predictions:
    - metric: >-
        phi_real_over_null, the ratio of the real matrix's k-way connectivity
        cut fraction to the configuration-model null's, at k in {2, 4, 8, 16,
        32, 64}
      direction: different
      minimum_effect: >-
        (E) is a ratio within [0.85, 1.15] at every k after dense-column
        removal; (S) is a ratio at or below 0.7 at some k >= 8. Between is
        reported as weak structure with the ablation that explains it.
    - metric: >-
        phi_trend_in_M, the fitted slope of log phi(16, M) against log M over
        the sizes run, real and null
      direction: different
      minimum_effect: >-
        (E) is a real slope within 0.05 of the null's slope (both near zero);
        (S) is a real slope at least 0.1 more negative than the null's.
    - metric: >-
        planted_recovery, on the planted-separator control, the fraction of
        the planted cut reduction the partitioners recover
      direction: higher
      minimum_effect: >-
        At least 0.8 for both partitioners; below 0.5 means the instrument is
        blind and no (E) may be read.
    - metric: >-
        dense_block_share, the fraction of the full matrix's cut carried by
        columns above the dense threshold
      direction: different
      minimum_effect: >-
        Reported; if above 0.5 the dense block dominates communication and
        bwc's separate handling of it is the structure that matters, which is
        a constant-factor statement and is labelled as one.
    - metric: >-
        dlp_agreement, the same ratio and slope on the DLP matrices
      direction: different
      minimum_effect: >-
        Same classification (E or S) as factoring at each size; a
        disagreement localises the structure to an ingredient the two
        problems do not share (polynomial selection, per IDEA-20260901-
        d88b5c) and is reported as such.
    - metric: >-
        communication_exponent_estimate, under (E) the implied exponent of
        total communication relative to the arithmetic term, under (S) the
        implied reduction
      direction: different
      minimum_effect: >-
        (E) implies equality with the arithmetic exponent within the noise
        band; (S) implies a reduction equal to the measured slope, stated as
        conditional on H1.

  minimal_test:
    design: >-
      SIX STEPS. STEP 0 (blocking): commit the partitioners and their
      settings, the k grid, the dense threshold, the rewiring swap count, the
      planted-separator sizes and the noise band before any matrix is read;
      compute and store the synthetic-fixture phi. STEP 1: obtain post-merge
      matrices for factoring and DLP at 60, 80, 100 digits from the
      IDEA-20260901-dedcea pipeline or fresh runs, with their hashes. STEP 2:
      for each matrix, strip dense columns at the threshold, build the column
      hypergraph, partition with both partitioners at each k, record phi;
      build five configuration-model replicates by degree-preserving edge
      swaps and partition them identically; record the null's mean and
      spread. STEP 3: planted-separator controls, rewire the real matrix to
      contain a separator of 1, 5 and 10 per cent of pins and check recovery.
      STEP 4: ablations, permute rows within special-q groups, restore dense
      columns, and (if the pre-merge matrix is kept) partition it too. STEP
      5: fit the trend in M, classify (E) or (S) per problem, and write the
      obstruction block under (E) or the building-block note under (S). STEP
      6: emit the artifact manifest with matrix hashes, partition files,
      seeds and a rebuild receipt.
    controls:
      - >-
        DEGREE-MATCHED CONFIGURATION-MODEL NULL, five replicates per matrix,
        the reference against which every phi is read.
      - >-
        PLANTED-SEPARATOR POSITIVE CONTROL at three sizes, blocking; the
        instrument must see planted structure or no negative is read.
      - >-
        TWO PARTITIONERS, agreement within 10 per cent required on both real
        and null instances.
      - >-
        SYNTHETIC FIXTURE reproduced before any real matrix is read.
      - >-
        DLP MATRICES from the same pipeline as the free cross-problem control.
      - >-
        PRE-REGISTRATION of every threshold and grid.
    required_metrics:
      - phi(k, M) real and null with intervals, per problem, per size, with and without dense columns
      - trend slopes in M for real and null
      - planted-separator recovery fractions per partitioner
      - dense-block share of cut
      - ablation phi values with the ingredient each ablation removes
      - partitioner agreement statistics
      - matrix hashes, seeds, partition files, rebuild receipt

  falsification_conditions:
    - >-
      Planted recovery below 0.5 or partitioner disagreement above 10 per
      cent. The instrument is blind and nothing is read; reported as an
      instrument failure.
    - >-
      Real-to-null ratio at or below 0.7 at some k, or a trend slope
      materially below the null's. Explanation (S), the hypergraph has
      separable structure; the ablations name it and the record hands the
      coordinator a building block for a communication-exponent lane. This
      outcome falsifies the closure and is welcome.
    - >-
      Ratio within the band and slope matching the null at all sizes and
      both problems. Explanation (E); the obstruction block is written with
      the measured phi and the closure of the partition/separator class for
      the exponent is recorded, scoped, with forward guidance naming what
      remains (constant-factor communication reduction, dense-block handling,
      algorithms that do not multiply by the matrix).
    - >-
      Disagreement between factoring and DLP classifications at the same
      size. Structure is in an unshared ingredient; reported, not closed.

  confounders:
    - >-
      PARTITIONER HEURISTICS SCALE DIFFERENTLY WITH M, so a trend in phi could
      be a trend in solver quality. MITIGATION: the null undergoes the same
      partitioner at the same M, and the reading is the real-minus-null
      difference; the planted control checks quality at each size.
    - >-
      DENSE COLUMNS dominate the cut trivially. MITIGATION: declared
      threshold, both with and without reported, share of cut reported.
    - >-
      MERGE PARAMETERS change the graph. MITIGATION: identical merge settings
      across sizes and problems, recorded; pre-merge matrices partitioned as
      an ablation where kept.
    - >-
      SMALL k HIDES STRUCTURE that only appears at k comparable to the number
      of special-q groups. MITIGATION: k up to 64 and the special-q
      permutation ablation.
    - >-
      THE CONFIGURATION MODEL CAN CREATE MULTI-PINS (a column twice in a row);
      MITIGATION: swaps rejected when they would, and the count of rejections
      reported.

  interpretation_limits:
    - >-
      CLAIM TIER (b) or (c) of RQ-GNFS-c6ce52, a toy-tier measurement at
      60-100 digits on one implementation, or a named obstruction with a
      measured quantity. No implementation is built and no parallel run is
      timed; the communication exponent statement is arithmetic from phi
      under H1 and is conditional.
    - >-
      (E) closes the partition and separator class FOR THE EXPONENT ONLY;
      constant-factor communication gains, which are what the Mondriaan case
      study and bwc's process grid deliver, are untouched and expected.
    - >-
      Nothing here changes time, memory or the constant of NFS, and nothing
      is a statement about any deployed key.
    - >-
      Transfer from 10^6-row matrices to 10^8-row matrices is under H1 and
      is a stated assumption; the record measures three sizes precisely so
      the trend, not a point, is what transfers.

  heuristic_assumptions:
    - id: H1
      statement: >-
        RANDOM-HYPERGRAPH BEHAVIOUR OF THE RELATION HYPERGRAPH. Conditioned
        on its row and column degree sequences, the post-merge relation-by-
        prime hypergraph with dense columns removed has minimum balanced
        k-way connectivity cut within a constant factor of that of a uniformly
        random hypergraph with the same degree sequences, uniformly in the
        dimension M over the range run and, as a transfer assumption, beyond
        it.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the cut identity for matrix-vector communication
        (exact), and the exact preservation of degree sequences by the
        configuration-model rewiring. CLASSICAL STATEMENT IMITATED: random
        regular graphs are expanders almost surely (Bollobas; Friedman,
        RECALLED), so their balanced cuts are a constant fraction of edges
        independent of size; the hypergraph analogue is assumed. THE GAP:
        the relation hypergraph has correlated rows (special-q) and merge-
        induced fill, neither of which a degree sequence captures; H1 is
        exactly what the null comparison tests.
      falsification_condition: >-
        Real-to-null ratio at or below 0.7 at any k with planted recovery
        above 0.8, or a real trend slope more negative than the null's by
        0.1.
      validation_plan: >-
        SAMPLE: six matrices (three sizes, two problems), five null
        replicates each, six values of k, two partitioners. SHORTCUT: none
        needed at these sizes; at larger sizes the same statistic can be
        computed on a coarsened matrix and that substitution is declared.
        COMPARISON: distribution of phi over null replicates against the
        real value, per (k, M). TAIL CHECK: the smallest null phi over
        replicates against the real phi, so that a real value inside the
        null's range is read as null even if below its mean. RECORDED
        PARAMETERS: degree sequences, swap counts, seeds, partitioner
        settings.
    - id: H2
      statement: >-
        PARTITIONER ADEQUACY. The heuristic partitioners find cuts within a
        constant factor of the minimum on both real and null instances at
        every size run, so the real-minus-null difference reflects the
        hypergraphs and not the solver.
      rigorous_support: >-
        RIGOROUS INGREDIENT: none; balanced hypergraph partitioning is
        NP-hard and the solvers are heuristics. CLASSICAL STATEMENT IMITATED:
        multilevel partitioners' empirical near-optimality on sparse
        matrices, established practice. THE GAP: adversarial or highly
        structured instances can defeat coarsening; the planted-separator
        control and the two-partitioner agreement are the guards.
      falsification_condition: >-
        Planted recovery below 0.8 or partitioner disagreement above 10 per
        cent on any instance.
      validation_plan: >-
        SAMPLE: the planted controls at three separator sizes per matrix and
        the two partitioners on every instance. COMPARISON: recovered cut
        reduction against planted; partitioner A against B. TAIL CHECK: the
        worst instance's agreement. RECORDED PARAMETERS: as above.

  target_complexity:
    time_exponent: >-
      NO CHANGE CLAIMED. The arithmetic term of block Wiedemann stays
      L[1/3, 2 beta] = L[1/3, 1.923] and the record does not touch it.
      Under (E) the communication term is shown, at the sizes run and
      conditionally beyond, to share that exponent, which is a closure;
      under (S) a partitioned block Wiedemann would have communication
      exponent 2 beta minus the measured decay rate, stated as conditional.
      Either way the record is a building block for the charged cost model
      and says so.
    memory_exponent: >-
      Unchanged at L[1/3, beta]; the record measures a property of the
      object that occupies that memory.
    best_known: >-
      Block Wiedemann and block Lanczos at O(M times nonzeros) arithmetic
      with the two-dimensional process-grid distribution used by CADO's bwc
      (RECALLED as to the grid) and Mondriaan partitioning for block Lanczos
      (Bisseling-Flesch 2006, metadata only), both constant-factor
      communication reductions.
    hidden_overhead: >-
      DISCLOSED. The block width b, the dense-column handling and the
      partitioner's own cost are constants here; the exponent statement is
      about phi's trend only, and phi is measured at three points.
    tradeoff_note: >-
      The communication term is the parallel form of the linear-algebra
      cost; this record is exactly a measurement of how it scales with the
      number of memory domains k and with M, which is the position
      RQ-GNFS-c6ce52 asks to be stated rather than implied.

  dominated_by: >-
    CHECKED, n/a (no result claimed). No attack, time, memory or data point
    is offered. As a measurement it is nearest to Bisseling-Flesch 2006,
    which partitions the same kind of matrix for speed and (as far as this
    session can tell without reading it) does not pose the null-matched
    scaling question; it is not dominated by any record in this ledger.
