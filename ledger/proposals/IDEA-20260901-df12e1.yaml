idea:
  id: IDEA-20260901-df12e1
  question_id: RQ-GNFS-c6ce52
  research_question: RQ-GNFS-c6ce52
  goal_id: null
  added: '2026-09-01'
  title: >-
    THE COMMUNICATION WALL HAS A GRAPH, AND NOBODY HAS ASKED WHETHER IT IS AN
    EXPANDER. Measure the k-way hypergraph cut fraction of the post-merge
    relation-by-prime matrix that block Wiedemann streams, against a
    degree-matched configuration-model null and across three sizes, so that
    a cut fraction that matches the null and stays CONSTANT in the dimension
    is the structural tell that no partitioning, ordering or structured
    elimination can move the exponent of the communication term below the
    matrix-dimension exponent beta -- a closure with a measured obstruction --
    while a cut fraction that sits below the null or decays with the
    dimension is a building block for a communication exponent below beta;
    the DLP matrix from the same pipeline is the free control
  class: control

  claim: >-
    FOUR SEPARABLE CLAIMS. (A) THE OBJECT. After filtering and merge the
    number field sieve's linear algebra is repeated multiplication of a sparse
    matrix, rows relations and columns prime ideals, by a block of vectors.
    On any machine with more than one memory domain the cost of that step
    has a communication term equal, per iteration, to the number of vector
    entries that must cross a domain boundary, which for a partition of the
    rows into k parts is the hypergraph connectivity cut of the column
    hyperedges (sum over columns of parts touched minus one), a standard
    identity of parallel sparse matrix-vector multiplication. RQ-GNFS-c6ce52
    target 4 asks whether any structural ingredient moves the EXPONENT of the
    communication term rather than its constant. The exponent question is
    decided by one measurable quantity, the cut fraction phi(k, M) = cut /
    (number of nonzeros) as a function of the matrix dimension M. (B) THE
    DICHOTOMY, PRE-REGISTERED. If the relation hypergraph behaves like a
    random hypergraph with its degree sequences, then phi(k, M) is bounded
    below by a constant for every k >= 2 and is essentially independent of M,
    so per-iteration communication is Theta(M) times the block width, the
    total over M / b iterations is Theta(M^2 / b) entries, and the
    communication term has the same L-exponent 2 beta as the arithmetic
    term: NO partitioning, row ordering, nested dissection or structured
    elimination moves it, because none of them can beat the cut of an
    expander. That is explanation (E), and if it holds the deliverable is an
    obstruction block at the docs/inventor-protocol.md section-4 standard --
    the measured phi, its interval, the runs, and the scope -- which closes
    the 'structure-exploiting linear algebra' class for the exponent while
    leaving it open for constants. If instead phi(k, M) sits materially below
    the null or decays with M, the hypergraph has separable structure
    inherited from the factor base or the sieve, and the communication
    exponent of a partitioned block Wiedemann is below 2 beta by the decay
    rate, a building block worth its own lane. That is explanation (S). (C)
    THE STRUCTURAL TELL. Per docs/inventor-protocol.md section 3, a quantity
    that should decay and does not is the signature of an artifact, and read
    in the identifiability direction a quantity that stays constant as the
    parameter meant to reveal structure grows is the signature of NO
    structure. phi is measured at 60, 80 and 100 digits (and on the DLP
    matrices of the same pipeline, which have the same graph type and
    different sizes); constancy in M within noise, together with agreement
    with the null, is (E). (D) NOT CLAIMED. No speedup, no exponent, no
    parallel implementation; the record is a measurement of a graph property
    of matrices produced by one implementation at small sizes, and its
    only consequence for cryptographic sizes is conditional on the
    transfer assumption H1 stated below.

  mechanism: >-
    Block Wiedemann's Krylov phase computes M/b matrix-block products; on k
    memory domains each product moves, at minimum, one vector entry per
    column that touches more than one domain, per extra domain touched --
    the connectivity metric, which hypergraph partitioners minimise. For a
    random hypergraph whose hyperedges have bounded average size and whose
    vertex degrees are bounded away from one, the minimum cut of any balanced
    k-partition is a constant fraction of the pins (expansion of random
    hypergraphs; the graph analogue is Friedman's and Bollobas's expansion
    of random regular graphs, RECALLED), so phi is bounded below
    independently of M. The relation hypergraph is not random: rows found
    under one special-q share that prime, small primes appear in a constant
    fraction of rows (the dense columns bwc already separates), and merge
    creates structured fill. Whether any of that makes phi decay is the
    question, and a degree-matched null answers it because the null shares
    every one-vertex statistic and destroys every correlation. The
    communication exponent then follows arithmetically: total communication
    is (M / b) times phi times nonzeros times b over the run, i.e. phi times
    nonzeros times M, so the exponent is that of nonzeros times M times phi,
    and only phi can lower it.

  novelty_status: unverified

  citations:
    - ref: >-
        Bisseling, Flesch, Mondriaan sparse matrix partitioning for attacking
        cryptosystems by a parallel block Lanczos algorithm, a case study,
        Parallel Computing 32(7-8), 2006, 551-567
      provenance: recalled
      claim: >-
        NOT READ. Known to this session only from web-search result snippets
        and the article landing page's metadata on 2026-09-01; the article
        itself returned HTTP 403 and was never opened, so the provenance is
        recorded as recalled rather than retrieved. Per the snippets it
        applies Mondriaan partitioning to NFS matrices for block Lanczos and
        reports speedups of 8 on 16 processors at 82 digits and 7 at 98
        digits on an SGI Origin 3800. Whether the paper compares the cut
        against a random null or studies its scaling in M is unknown to this
        session; it is the nearest prior work and must be read by the
        executor. Every figure here is unverified.
      verified_by: null
    - ref: >-
        Boudot, Gaudry, Guillevic, Heninger, Thome, Zimmermann, 240-digit
        experiment, ePrint 2020/697
      provenance: retrieved
      claim: >-
        Relayed via a fetch-tool summary: post-merge matrices of 282M rows at
        density 200 (RSA-240) and 36M rows at density 253 (DLP-240); Krylov
        cost 69 and 544 core-years respectively. These are the only record-
        scale dimensions this record's toy matrices are eventually compared
