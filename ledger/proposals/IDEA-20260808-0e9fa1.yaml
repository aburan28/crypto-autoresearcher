idea:
  id: IDEA-20260808-0e9fa1
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  title: 'Rigorous windowed yield via the determinant method: apply points-on-varieties-in-small-
    boxes bounds to the Semaev hypersurface to decide, unconditionally, whether the windowed
    decomposition count matches the KN-FIND-007 mean or falls below it.'
  class: measurement
  claim: 'The windowed decomposition count for a target R is the number of F_p-points of the
    hypersurface S_{m+1}(x_1,...,x_m,x_R) = 0 whose coordinates lie in a box of side B. KN-FIND-007
    gives the mean over R exactly, but says nothing about whether a BOX (as opposed to an
    average over all r) attains it. The claim is that the p-adic determinant method (Bombieri-Pila
    / Heath-Brown / Salberger lineage) and the "points on curves and surfaces in small boxes
    mod p" literature give an UNCONDITIONAL upper bound on that count as a function of (m,
    B, p, deg S), and that comparing this bound against the heuristic B^m/(m! p) at the E1-01
    operating point B = p^{eps/m} decides the windowed family in one of exactly two ways:
    (i) the bound exceeds the heuristic, so no obstruction is proved and E1-01 stands or falls
    on the solver; or (ii) the bound is BELOW the heuristic, in which case windowed factor
    bases are yield-deficient unconditionally and the whole family dies with a rigorous theorem
    rather than a measurement.'
  mechanism: 'The determinant method constructs, for a variety and a box, an auxiliary polynomial
    of controlled degree vanishing at all box points, via a determinant/lattice argument;
    the resulting bound is typically of the shape B^{c} with c strictly less than the dimension
    when the box is small relative to p. That is precisely the regime here: B = p^{eps/m}
    with eps < 1, so the box side is a fractional power of p. Crucially, this is a DIFFERENT
    bound family from the Weil/Deligne exponential-sum bounds that KN-FIND-c93d45 shows cannot
    close the arithmetic-factor-base gap: the determinant method does not go through character
    sums at all, so the DL circularity obstruction recorded there does not apply.'
  why_not_a_renamed_known_approach: KN-FIND-c93d45 closes the route "bound the yield of an
    ARITHMETIC (multiplicative subgroup / character-describable) factor base with the Weil
    bound"; the failure there is that square-root cancellation is too weak against the main
    term. This record targets a BOX factor base with a bound family that has no square-root
    barrier because it is geometric, not analytic. It is also not KN-FIND-007, which is an
    exact mean and carries no information about any particular box.
  predictions:
  - observable: the exponent c in the determinant-method bound for S_{m+1} in a box of side
      B
    metric: c as a function of m and deg S_{m+1} = 2^{m-1}, derived symbolically
    predicted: c < m for every m >= 2, with the deficit shrinking as deg grows; the decisive
      comparison is c*log B versus m*log B - log p
  - observable: toy-scale exact count vs the derived bound
    metric: exact number of windowed m-decompositions summed over 10^4 random targets, p in
      [2^18, 2^26], m = 3, B swept
    predicted: the exact count matches the KN-FIND-007 mean to within Poisson error AND lies
      below the determinant bound; a violation of the bound is an error in the derivation
      and must be found before anything else proceeds
  - observable: whether the bound bites at the operating point
    metric: sign of (determinant bound) - (heuristic mean) at B = p^{eps/m}
    predicted: positive (bound does not bite) for m >= 4 at eps < 1; if negative, the windowed
      family is closed unconditionally, which is a stronger result than anything currently
      in the corpus
  minimal_test: 'Stage 1, zero compute: instantiate the determinant-method bound for a hypersurface
    of degree 2^{m-1} in m variables over F_p restricted to a box of side B, for m = 3, 4,
    5, and evaluate the sign of the comparison at B = p^{eps/m} for eps in {0.5, 0.75, 1.0}.
    Stage 2, cheap compute: at p ~ 2^22 and m = 3, exhaustively count windowed decompositions
    for 10^4 targets and check both the KN-FIND-007 mean and the derived bound.'
  controls:
  - 'Random-subset arm of equal size: the KN-FIND-007 mean must be identical, so any difference
    in measured counts isolates a box effect (which is the whole question).'
  - 'Random hypersurface of the same degree in the same box: separates "Semaev-specific" from
    "degree-and-dimension-generic" behaviour.'
  - Exhaustive enumeration as ground truth at the smallest p, so the counter itself is verified
    before it is used at larger p.
  confounders:
  - Determinant-method bounds are usually stated for irreducible varieties; S_{m+1} has known
    symmetry and may factor over F_p for special parameters, which would break the bound's
    hypotheses rather than the bound.
  - Boxes near the boundary (B close to p^{1/2}) sit outside the regime where these bounds
    are non-trivial; the comparison must state its validity range.
  - The 2:1 x-coordinate fibre and 2-torsion inflate counts and must be normalised out.
  falsification_conditions:
  - Measured counts exceed the derived bound at any tested cell => the instantiation is wrong;
    no conclusion may be drawn until reconciled.
  - The bound is below the heuristic mean at the operating point AND toy counts confirm the
    deficit => windowed factor bases are yield-deficient, E1-01 dies, and the corpus gains
    a rigorous negative that does not depend on any solver.
  - The bound is trivially above the heuristic for all m => the record produces no obstruction
    and should be recorded as such rather than dressed as support.
  interpretation_limits: 'An upper bound that does not bite proves nothing positive: it removes
    one possible obstruction, it does not establish that windowed decompositions exist at
    the heuristic rate. Toy counts are toy. The bound''s hypotheses (irreducibility, non-degeneracy)
    must be checked per m, not assumed.'
  assumptions:
  - S_{m+1} absolutely irreducible over F_p for the parameters used (checkable at small m).
  - Uniform targets; window is an interval.
  heuristic_assumptions:
  - id: HA-1
    statement: The windowed decomposition count for a uniform target is Poisson with parameter
      mu = C(B+m-1,m)/N, i.e. the box behaves like a random subset for this statistic.
    rigorous_ingredient: '"The exact mean of KN-FIND-007."'
    distribution_imitated: '"Representation-function Poisson heuristic."'
    validation_route: Exact histogram at toy p and comparison against Poisson(mu) by chi-square,
      with a random-subset arm. Label toy. This is the same measurement as E1-01 HA-1 and
      must be produced once and shared.
    tail_checks: Coverage must satisfy coverage <= min(1, mu) (KN-FIND-007) and must not exceed
      the Sidon ceiling; the maximum count must not exceed the Poisson prediction by more
      than a log factor.
  target_complexity:
    time_exponent: 'Moves no exponent. It is a gate on E1-01: outcome (ii) sets E1-01''s achievable
      exponent to "none", outcome (i) leaves it at the E1-01 conditional value.'
    memory_exponent: '"n/a."'
    best_known_baseline: '"rho N^{1/2} (the thing E1-01 would have to beat)."'
    hidden_overhead_disclosure: '"No asymptotic claim; the bound''s implied constants depend
      on m and deg and must be tracked."'
    time_memory_tradeoff: '"n/a."'
  sota_delta: 'Zero as an attack. As evidence it is the only route in this slice that could
    produce an UNCONDITIONAL negative about prime-field index calculus, which the corpus does
    not have: every existing closure is either a derivation inside a model or a toy measurement.'
  dominated_by: '"n/a (no result claimed; this is a bound derivation and a counting measurement)."'
  estimated_cost: '"Implementation low-medium; compute low (exhaustive counting at p <= 2^26)."'
  recommended_priority: medium
  honest_prior_of_survival: ~0.15 that the bound bites at the operating point (determinant
    bounds are usually weaker than the heuristic in this regime). ~0.6 that the derivation
    is clean enough to record either way, which is the realistic deliverable.
  novelty_status: unverified
  novelty_screen: Screened against EXISTING_PROPOSALS.txt, REJECTED_TITLES.txt (which contains
    ECDLP-IDEA-326 polynomial-partitioning Abel-Jacobi incidence and ECDLP-IDEA-379 Ax-Katz,
    both different bound families), KNOWLEDGE_BARRIERS.txt, and KN-FIND-c93d45's index entry.
    No record applies determinant-method / points-in-boxes bounds to Semaev. Marked unverified
    because the external literature (Bombieri-Pila, Heath-Brown, Salberger, Chang-Cilleruelo-Garaev-Shparlinski)
    could not be checked this session.
  discriminated_from: KN-FIND-c93d45 (Weil/character-sum route for arithmetic factor bases
    — different bound family and different factor base); KN-FIND-007 (exact mean, no box statement);
    KN-TECH-010 (finite-field incidence bounds — Szemeredi-Trotter type, which are about point-line
    incidences rather than box points on a hypersurface).
  source_refs:
  - KN-FIND-007 (in-repo, read), KN-FIND-c93d45 (index), KN-TECH-010, KN-TECH-016 (in-repo)
  - '"UNVERIFIED external: Bombieri-Pila 1989; Heath-Brown 2002; Salberger; Chang-Cilleruelo-Garaev-Shparlinski
    on points on curves in small boxes mod p. Cited from memory."'
  proof_search_map:
    bottleneck: '"Whether a BOX attains the average decomposition yield."'
    baseline_embedding:
      parameter_slice: '"B = p reproduces the exact global count and must match KN-FIND-007."'
      reproduction_check: '"Symbolic: bound at B = p must be >= C(p+m-1,m)/N."'
    observation_collision:
      observable: '"windowed decomposition count."'
      distinct_preimage_search: A random subset and a box with identical counts is the expected
        outcome and is the null; a systematic difference would be the finding.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: '"Determinant-method auxiliary polynomial vanishing on all box points."'
      predicted_gain: '"An unconditional upper bound where only heuristics exist today."'
    quantifier_order: FOR ALL primes p, FOR ALL ordinary E/F_p, FOR ALL targets R, the number
      of windowed m-decompositions is at most F(m, B, p). The decision is the sign of F(m,
      B, p) - C(B+m-1,m)/N at B = p^{eps/m}.
    method_ceiling:
      strongest_certifiable_claim: '"An unconditional upper bound on windowed yield; never
        a lower bound."'
      nearby_object_control: 'Extension-field index calculus, where the analogous ''box''
        is a subfield and the yield is provably at the heuristic rate: the method must not
        spuriously prove a deficit there.'
    proof_obligations:
    - claim: '"S_{m+1} absolutely irreducible for the parameters used"'
      responsibility: correctness
    - claim: '"the box-point bound and its validity range"'
      responsibility: size
    - claim: '"comparison sign at the operating point"'
      responsibility: strictness
