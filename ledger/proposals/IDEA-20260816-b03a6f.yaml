idea:
  id: IDEA-20260816-b03a6f
  question_id: RQ-ASCON-2dfd8b
  added: '2026-08-16'
  title: Treat each published Ascon result not as a result but as a DEPENDENCY SIGNATURE -- the finite
    set of specification features its exploited property reads -- and adjudicate transfer to SP 800-232
    by intersecting that signature with the submission-to-standard delta set, so every cell defaults
    to UNDETERMINED and can only be resolved by a named, checkable feature-level dependency edge
  class: tooling
  claim: '(A) The applicability table RQ-ASCON-2dfd8b asks for is currently unbuildable in a defensible
    way because its cells are adjudicated by human impression: a reader looks at a result, looks at
    a specification difference, and forms a judgement whose evidence chain is not recorded. This proposal
    replaces the cell verdict with a two-part machine object: a DEPENDENCY SIGNATURE per result --
    a labelled subset of a declared, finite feature basis of the specification (round count applied
    at each call site, round-constant schedule slice, bit and byte ordering convention, IV word contents,
    rate/capacity split, domain-separation and padding bits, mode-level injection and observation
    interface) -- and a DELTA SET per specification difference over the same basis. The cell verdict
    is then the output of a fixed function of those two sets, with UNDETERMINED as the default and
    the only escape being a recorded dependency edge naming which feature the exploited property reads
    and where in the specification that feature is preserved or broken. (B) The deliverable is the
    basis, the adjudication function, a mechanically checkable cell schema, and a validator that rejects
    any cell asserting applies or does-not-apply without a complete edge chain. (C) NOT CLAIMED: that
    any particular published result exists, that any result transfers or fails to transfer, that the
    feature basis is complete, that the adjudication function is sound in any formal sense, or that
    a populated table would say anything about the security of Ascon. This program cannot read external
    literature and this record asserts nothing about what the literature contains. (D) The measurable
    content is the RESOLUTION RATE of the adjudicator against synthetic inputs: how often the function
    escapes UNDETERMINED, and whether that rate depends on the content of a signature or merely on
    its size. A tool that resolves cells at the same rate on random signatures as on structured ones
    is resolving on shape and is worthless, and that is the failure this record is built to detect
    before any real result is ever entered.'
  mechanism: 'Stage one fixes the feature basis by reading only the standardized specification structure
    as a set of independently specifiable knobs, without reference to any attack. Stage two defines
    the signature type: for each feature, a label in {reads-value, reads-position, reads-count, independent},
    chosen because those four are the distinctions a specification delta can actually change. Stage
    three defines the adjudication function as a table over (label, delta-kind) pairs: a delta that
    changes a constant value cannot break a result whose dependency is reads-count; a delta that changes
    bit position breaks reads-position unless a conjugation witness exists; everything else is UNDETERMINED.
    Stage four implements the cell validator: a cell is well-formed only if it names the feature,
    the label, the delta-kind, and a pointer to the specification text asserting preservation or breakage.
    Stage five runs the adjudicator over synthetic signature populations -- structured ones drawn
    from a generative model of plausible dependency patterns, and null ones drawn uniformly at the
    same cardinality -- and reports the resolution rate of each arm. Refutation is a resolution rate
    on the null arm statistically indistinguishable from the structured arm, which would show the
    function is deciding on cardinality rather than content and must be redesigned or abandoned.'
  novelty_status: unverified
  novelty_screen:
    method: 'Shared screen run this session over the repository at /home/user/crypto-autoresearcher:
      grep -ril ascon over ledger/proposals, ledger/hypotheses, ledger/evidence and experiments; grep
      -il for sponge, duplex, domain.separation, little-endian, round constant, IV constant, capacity,
      rekey, data limit and constrained device over ledger/proposals/*.yaml (output truncated at head
      -20 for the larger hits, so those lists are partial and are reported as partial). Files read
      in full or in part: ledger/questions/RQ-ASCON-2dfd8b.yaml in full, ledger/goals/GOAL-ASCON-001.yaml
      first 60 lines, docs/inventor-protocol.md sections 1-8, ledger/proposals/IDEA-20260807-c4f1fc.yaml
      and ledger/proposals/IDEA-20260808-95a21c.yaml first 40 lines each, headers of knowledge/techniques/KN-TECH-066.md,
      KN-TECH-073.md and KN-TECH-074.md.'
    results: 'The ascon grep returned NO ledger record at all: the only two matches in the whole tree
      were experiments/EXP-MLKEM-006/analysis/failed_attempts/attempt1-no-wrap-probes/RUN-MLKEM-021/stdout.txt
      and experiments/EXP-MLKEM-005/runs/RUN-MLKEM-017/stdout.txt, both incidental strings in run
      logs. RQ-ASCON-2dfd8b and GOAL-ASCON-001 exist and carry zero proposals. The sponge/duplex grep
      found exactly two proposals, IDEA-20260807-c4f1fc (hash and permutation primitives are modelled
      as ideal objects everywhere in the corpus) and IDEA-20260808-95a21c (sponge/Merkle-Damgard prefix
      amortisation as a Fiat-Shamir cost-model audit under RQ-FAEST-001). No record in the corpus
      builds a document-to-document applicability table or a dependency-signature formalism; the greps
      for applicability audit, transfers to, specification delta and standardization delta returned
      no proposal file. GOAL-ASCON-001 explicitly names GOAL-SHA3-001, GOAL-BLAKE-001 and GOAL-SIMSPK-001
      as adjacent and states the non-duplication boundaries this record must respect.'
    verdict: 'UNVERIFIED. No agent in this environment can read external literature, so nothing here
      is or can be a claim about prior art. What is claimed NEW relative to this repository is the
      reduction of an applicability cell to a pair of subsets of a declared finite feature basis plus
      a fixed adjudication function with UNDETERMINED as the default absorbing state, and the accompanying
      null-signature calibration of the adjudicator. What is ASSEMBLED FROM KNOWN PARTS: the UNDETERMINED-is-the-finding
      discipline is stated in RQ-ASCON-2dfd8b itself; the requirement that a control run identically
      alongside the signal is docs/inventor-protocol.md section 3; the quantifier and observation-collision
      audits are section 8; the practice of auditing a quantity that was computed once and inherited
      since is the recurring program pattern named in the RQ motivation.'
  object_first_candidate:
    tracked_object: 'The dependency signature of a cryptanalytic result: a vector over a declared
      finite basis of specification features, each coordinate labelled reads-value, reads-position,
      reads-count or independent. The result itself -- its technique, its complexity, its authors,
      its data requirement -- is not tracked. Only which specification knobs its exploited property
      reads is tracked, and that vector is what is carried through the adjudication.'
    lossiness: 'Genuinely lossy and deliberately so. Discarded: the attack technique, its time and
      memory and data costs, its round reach, its success probability, its proof structure, and the
      identity of the result. Retained: which specification features the exploited property reads
      and in what modality. The discard is compatible with the target operation because the operation
      is a specification delta, and a delta acts only on features -- it cannot touch anything the
      discarded coordinates hold. Two results with identical signatures are, under any specification
      delta, indistinguishable in transfer status, which is precisely the equivalence the object is
      designed to expose. The signature is far from invertible: infinitely many distinct results share
      one signature.'
    propagation: 'One step of the target operation is the application of a single submission-to-standard
      difference, represented as a delta-kind on one feature coordinate. Acting on a signature it
      produces, coordinatewise, one of three outcomes: PRESERVED when the delta-kind cannot alter
      the labelled modality (a constant-value change against a reads-count dependency), BROKEN-UNLESS-WITNESSED
      when the modality is exactly the one the delta alters (a position permutation against reads-position,
      escapable only by exhibiting a conjugation witness), or UNDETERMINED otherwise. Composing the
      deltas is a fold over coordinates in which UNDETERMINED is absorbing: any coordinate that comes
      back UNDETERMINED makes the whole cell UNDETERMINED, and this asymmetry is the point.'
    survival_score: The object survives exactly as far as the feature basis is a genuine coordinate
      system for the specification. It dissolves the moment an exploited property depends on an interaction
      between features that the basis represents as independent coordinates -- for instance a property
      that reads the joint arrangement of round-constant values AND bit ordering. The measurable form
      of the dissolution is the fraction of synthetic signatures the adjudicator cannot resolve for
      a reason other than genuine uncertainty; the design target is that this fraction be reported
      rather than minimised, since a basis that resolves everything is a basis that is lying.
  null_object_control: 'The identical adjudication function is run over NULL SIGNATURES: vectors drawn
    uniformly at random over the same basis with cardinality distribution matched to the structured
    arm, generated by the same code path and adjudicated by the same function in the same invocation,
    and against DELTA SETS likewise drawn uniformly. For the signal arm to mean anything the null
    arm must show a MATERIALLY LOWER escape-from-UNDETERMINED rate: if random signatures resolve as
    often as structured ones, the function is deciding on the number of coordinates touched rather
    than on the modality labels, and no populated table it produces would carry information. The prespecified
    reading is that a null resolution rate within the structured arm confidence interval is a controlled
    null and refutes the tool, not the target.'
  discriminated_from:
  - IDEA-20260807-c4f1fc -- observes that hash functions and unkeyed permutations are modelled as
    ideal objects everywhere in this corpus and proposes a structured-input axis specific to SLH-DSA.
    That record opens a cryptanalytic lane against a construction; this record builds an ADJUDICATION
    INSTRUMENT for transfer of results between two versions of a document and computes nothing about
    any permutation.
  - IDEA-20260808-95a21c -- a Fiat-Shamir per-attempt cost-model audit for FAEST using sponge/Merkle-Damgard
    prefix amortisation. That is a unit-of-account correction inside one specification; this is a
    mapping between two specifications and has no cost model in it.
  - The program's August 2026 self-audit wave (the cost-model, machine-variance and instrument-validity
    proposals under RQ-INSTR-f8faa0 named in this session's portfolio review). Those audit THIS PROGRAM'S
    OWN claims; this audits the relationship between two external documents and its own instrument
    only as a null control.
  - A literature survey or systematisation-of-knowledge table. Those assert what results exist and
    what they show; this record forbids that assertion, defaults every cell to UNDETERMINED, and its
    output is defined to be a coverage statement rather than a security statement.
  - KN-OPEN-3f7a21, which per this session's briefing owns the audit of citation_verified markings
    in the literature corpus. That is about the provenance of records already filed here; this is
    about the feature-dependency structure of results that are not filed here at all.
  assumptions:
  - A finite feature basis of the standardized specification can be written down from the specification
    structure alone, without reference to any attack, and both documents can be expressed over it
    once they are filed as KN-LIT entries.
  - The four dependency modalities reads-value, reads-position, reads-count and independent are sufficient
    to express the distinctions a specification delta can make; interactions requiring a fifth modality
    will be visible as unresolvable cells rather than as silent misclassification.
  - UNDETERMINED being absorbing under composition is the correct default; the cost of that choice
    is a table dominated by UNDETERMINED cells, which RQ-ASCON-2dfd8b explicitly declares to be the
    deliverable rather than a failure.
  - Synthetic structured signatures can be generated from a declared generative model without smuggling
    in the adjudication function's own decision boundary; this assumption is itself checked by inspecting
    the generator for feature-label correlations before the run.
  - No cell may ever be populated from an abstract, an excerpt, or a secondary description, so the
    tool sits unused on real inputs until primary texts are filed -- and the tool's validity does
    not depend on that filing.
  predictions:
  - metric: escape-from-UNDETERMINED rate on structured synthetic signatures minus the same rate on
      cardinality-matched null signatures
    direction: higher
    minimum_effect: at least 0.20 absolute difference in resolution rate, with non-overlapping 95
      percent bootstrap intervals over 10000 synthetic pairs; below that the adjudicator is declared
      shape-driven and is redesigned
  - metric: fraction of all cells returning UNDETERMINED when a realistic delta set touching four
      or more feature coordinates is applied
    direction: higher
    minimum_effect: above 0.5, pre-committed as a prediction that the honest table is mostly undetermined
      rather than mostly resolved
  - metric: number of cell records rejected by the validator for asserting a verdict without a complete
      evidence edge, when fed deliberately malformed cells
    direction: different
    minimum_effect: 100 percent rejection of the 40 hand-built malformed fixtures; anything below
      100 percent is an instrument defect
  - metric: sensitivity of the resolution rate to the order in which deltas are folded
    direction: different
    minimum_effect: exactly zero -- a forced value, since UNDETERMINED is absorbing and any order
      dependence is a bug rather than a finding
  minimal_test:
    design: 'Zero external data and no cryptographic computation. Implement the feature basis, the
      signature type, the adjudication function and the cell validator in about 400 lines of Python.
      Generate two synthetic populations in the SAME process invocation from one seeded generator:
      a structured arm whose signatures are drawn from a declared generative model of plausible dependency
      patterns, and a null arm drawn uniformly with cardinality matched per-sample to the structured
      arm. Apply an identical family of synthetic delta sets to both and record, per arm, the escape-from-UNDETERMINED
      rate, the per-coordinate verdict histogram, and the fold-order sensitivity. Separately feed
      40 hand-built malformed cell fixtures to the validator and record the rejection rate. The whole
      test costs minutes of CPU and its entire value is deciding, before any primary text is ever
      read, whether the adjudicator carries information or merely shape.'
    controls:
    - 'Null-signature arm: uniform random signatures, cardinality-matched, same generator code path,
      same invocation, same adjudication function.'
    - 'Null-delta arm: uniform random delta sets applied to the structured signatures, isolating whether
      resolution comes from the delta structure or the signature structure.'
    - 'Fold-order permutation control: every cell adjudicated under three random orderings of the
      delta coordinates; any disagreement is a defect, not a result.'
    - 'Malformed-cell fixture set: 40 hand-built cells with missing feature names, missing modality
      labels, missing specification pointers, or verdicts inconsistent with their edges.'
    - 'Generator-independence check: the structured generator inspected and reported for correlations
      that would encode the adjudicator''s decision boundary, with the inspection output attached
      to the run record.'
    required_metrics:
    - escape-from-UNDETERMINED rate per arm with bootstrap confidence interval
    - per-coordinate verdict histogram (preserved / broken-unless-witnessed / undetermined) per arm
    - fold-order sensitivity, reported as the count of cells whose verdict changes under reordering
    - validator rejection rate on the malformed fixture set
    - cardinality distribution of signatures per arm, to demonstrate the matching held
    - wall-clock and seed for reproducibility, recorded through the standard run manifest
  falsification_conditions:
  - The null arm's escape-from-UNDETERMINED rate is statistically indistinguishable from the structured
    arm's, showing the adjudicator decides on cardinality rather than modality.
  - Fold-order sensitivity is nonzero, showing the composition rule is not the absorbing fold it is
    specified to be.
  - The validator accepts any malformed fixture, showing the evidence-chain requirement is not actually
    enforced.
  - The structured generator is found to encode the adjudication table, making the structured arm
    circular and its resolution rate meaningless.
  - The feature basis cannot be written down from specification structure alone without importing
    attack-specific vocabulary, which would make every signature an argument rather than an observation.
  - More than a small declared fraction of realistic dependency patterns require a modality outside
    the declared four, showing the type is too coarse to carry the audit.
  confounders:
  - The structured generative model is authored by the same agent as the adjudication function, so
    agreement between them may reflect shared authorship rather than shared truth; the generator-independence
    check is the only defence and it is imperfect.
  - Cardinality matching between arms can be defeated by correlations between which coordinates are
    touched and how many, so per-coordinate histograms must be inspected and not only the aggregate
    rate.
  - UNDETERMINED being absorbing makes the aggregate rate insensitive to improvements in individual
    coordinate rules, potentially hiding a genuinely better basis behind an unchanged headline number.
  - An apparently high structured resolution rate could come from a small number of coordinates that
    are trivially resolvable, rather than from the basis working broadly.
  - The eventual real inputs are unavailable in this environment, so every number here is about the
    instrument and none is about Ascon.
  interpretation_limits:
  - A working adjudicator says nothing about Ascon. It says a table could be built defensibly once
    both documents are filed as primary texts.
  - No cell in any output of this tool may be read as a security statement; a cell reading does-not-apply
    means one property was checked against one feature, not that a class of attacks fails.
  - The resolution rates measured here are properties of a synthetic population chosen by this program
    and do not predict resolution rates on real results.
  - A high UNDETERMINED fraction is the expected and honest outcome and must never be reported as
    evidence of weakness or of strength.
  target_complexity:
    time_exponent: No attack exponent is claimed. The instrument's cost is linear in the number of
      cells and in the size of the feature basis.
    memory_exponent: No attack exponent is claimed. Memory is linear in the number of synthetic samples
      held for bootstrap resampling.
    best_known: 'The incumbent is the ordinary practice this record replaces: an unrecorded human
      judgement that a published result does or does not still apply after a specification change,
      backed by no evidence chain. Within this repository the incumbent has no competitor -- the ascon
      grep returned zero ledger records.'
    hidden_overhead: 'The human cost dominates and is not small: assigning a dependency signature
      to a real result requires reading its primary text and identifying the exploited property, which
      is exactly the expensive labour the tool cannot do. The tool makes the labour auditable, not
      cheaper. A second hidden cost is basis maintenance: every basis revision invalidates every previously
      assigned signature, and the record schema must therefore version the basis or the whole table
      silently rots.'
  dominated_by: n/a (no result claimed). Checked explicitly against every axis on which a Pareto comparison
    could be made -- time, memory, data/queries -- and there is no frontier row here because no attack,
    distinguisher or bound is produced. The comparison this record does support is instrument-versus-unrecorded-judgement,
    on which it costs strictly more effort per cell and produces a strictly checkable artifact.
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitatively the only delta
    is instrument-level: from zero recorded evidence chains per applicability judgement to one mandatory,
    machine-validated evidence chain per cell, at a measured validator rejection rate on malformed
    input that the experiment reports.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Separately: that a finite feature basis can be written from specification
    structure alone, about 0.8, because a specification is a finite document of independently editable
    knobs. That the four declared modalities suffice for most real dependency patterns, about 0.45,
    because interactions between ordering and constants are exactly the case that needs a fifth. That
    the null arm resolves materially less than the structured arm, about 0.6, since the adjudicator
    does key on modality labels but cardinality effects are a real risk. That the tool is ever run
    on real published results in this environment, below 0.15, because that requires primary texts
    this program cannot obtain -- and the instrument''s validity does not depend on that happening.'
