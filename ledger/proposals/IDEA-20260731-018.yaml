idea:
  id: IDEA-20260731-018
  question_id: RQ-ECTD-001
  title: >-
    Trapdoor-DDH-first gate on ordinary F_p — can a secret isogeny unlock a
    private DDH/pairing-like predicate without a full ECDLP trapdoor?
  class: mechanism
  claim: >-
    There is no efficiently evaluable private predicate Π, derived from a secret
    ordinary F_p-isogeny chain of length L = O(log N) with degrees in
    {2,3,5,7,11,13}, that solves DDH on E_pub(F_p)[N] with advantage >= 1/2
    while public path recovery and public End-ring recovery each cost >= 0.5 *
    matched_rho at toy N in [32,48] bits — unless Π factors through a
    class-invariant (forbidden) or a pairing on a publicly identifiable
    embedding. Operational claim for the batch: any proposed ordinary-field
    trapdoor-DDH construction must exhibit (i) a verified private DDH solver
    certificate on >=10 random DDH instances, (ii) a matched public baseline
    failing those instances inside the same budget, and (iii) a red-team
    MITM/path budget >= 0.5 rho. Falsified (construction exists in scope) if
    such a Π is demonstrated with certificates;         supported-as-barrier (for the
    narrow ordinary+short-chain fragment) if the admitted (non-quarantined)
    candidate Π designs fail the private-advantage or the path-hardness limb
    under the frozen oracle specs; PI-C remains quarantined until KN-LIT-7633
    is citation-verified.
  mechanism: >-
    Dent–Galbraith (KN-LIT-7633) and Kutas–Petit–Silva (KN-LIT-7634) show that
    secret isogenies can unlock pairings/DDH on specially structured
    (often supersingular) groups. Over ordinary prime fields, MOV/Frey–Rück
    embedding degree is a class invariant, so a secret isogeny cannot create a
    low embedding degree that the public curve lacks. Any ordinary trapdoor-DDH
    must therefore use a non-pairing predicate (hidden representation, private
    endomorphism oracle beyond GLV, or disguised correspondence) or accept that
    the supersingular/pairing route does not transfer. This idea installs an
    explicit gate before claiming an ordinary Teske-DDH stepping stone, and
    prefers barrier or construction with certificates over narrative analogy to
    KN-LIT-7634.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-07-31'
    corpus_paths_grepped:
      - knowledge/literature/KN-LIT-7633.md
      - knowledge/literature/KN-LIT-7634.md
      - knowledge/literature/KN-LIT-5102.md
      - ledger/proposals
    grep_results:
      - KN-LIT-7634 is supersingular trapdoor DDH — not ordinary F_p
      - No ledger IDEA freezes an ordinary-F_p trapdoor-DDH certificate gate
    conclusion: >-
      Gate/barrier proposal adapting Dent–Galbraith/Kutas–Petit–Silva to ordinary
      prime fields; novelty unverified. Dent–Galbraith PDF still unverified
      (citation_verified false).
  assumptions:
    - DDH instance sampling is uniform in the N-primary subgroup.
    - Secret chain degrees coprime to N.
    - 'Class-invariant pairing routes are excluded by detector (embedding degree).'
  revise_status: revised_BATCH-002
  revise_notes_applied:
    - TASK-20260731-031
    - TASK-20260731-049
  predictions:
    - metric: private_ddh_advantage_minus_public
      direction: higher
      minimum_effect: >-
        construction lane — advantage >= 1/2 private vs <= 0.05 public on 10
        instances; barrier lane — all admitted (non-quarantined) Π fail this split
  pi_oracle_freeze:
    note: >-
      Oracles frozen before any EXP coding. Candidate (C) quarantined until
      KN-LIT-7633 has citation_verified:true with an obtainable PDF. Candidate
      (A) must be auxiliary-input-free or explicitly labeled non-trapdoor-DDH.
    candidates:
      - id: PI-A-ENDO-DDH
        status: admitted_if_aux_free
        inputs: >-
          DDH tuple (P, aP, bP, cP) on E_pub(F_p)[N]; secret endomorphism phi
          for trapdoor holder only; NO Cheon-style short-exponent auxiliary list
          unless a separate non-DDH arm is declared.
        outputs: boolean guess whether c ≡ ab (mod N)
        budget: poly(log N) group/endo ops private; public baseline same wall without phi
        forbidden: treating Cheon auxiliary-input advantage as trapdoor-DDH
      - id: PI-B-PRIVATE-ENDO-VIA-ISOGENY
        status: admitted
        inputs: >-
          DDH tuple on E_pub; secret isogeny chain chi: E_pub -> E_priv of length
          L=O(log N), degrees in {2,3,5,7,11,13}, unlocking an endomorphism on
          E_priv not efficiently available on E_pub
        outputs: boolean DDH guess
        budget: dual-isogeny + endo eval poly(log N); public path MITM >= 0.5 matched_rho
        forbidden: low embedding-degree pairing routes (class-invariant)
      - id: PI-C-DENT-STYLE-MULTIVARIATE
        status: quarantined
        reason: >-
          KN-LIT-7633 Dent–Galbraith PDF citation_verified:false. Do not invent
          theorem numbers. Unblock only after primary PDF is filed.
  minimal_test:
    design: >-
      Freeze Π oracles as in pi_oracle_freeze. Run certificate gate at N~32–48
      bits for PI-A (aux-free only) and PI-B; PI-C quarantined. For each admitted
      candidate: (i) verified private DDH solver on >=10 random DDH instances,
      (ii) matched public baseline failing those instances inside the same budget,
      (iii) red-team MITM/path budget >= 0.5 matched_rho. Do not claim ECDLP
      trapdoor from DDH advantage alone. KN-LIT-7634 supersingular toy adaptation
      is harness positive control only.
    controls:
      - Public solver without trapdoor (must fail DDH).
      - Class-invariant MOV detector (must catch forbidden low-embedding designs).
      - Supersingular positive control adapted from KN-LIT-7634 at toy size if
        implementable — validates the harness, not ordinary transfer.
      - >-
        PI-A ablation: if any auxiliary-input channel is present in a side arm,
        re-run without it; advantage must survive for trapdoor-DDH credit.
    required_metrics:
      - per-candidate private/public DDH success counts
      - path-recovery cost vs rho
      - embedding-degree detector outcomes
      - PI-A aux-ablation outcome when applicable
  falsification_conditions:
    - 'A candidate passes all three limbs with certificates: ordinary trapdoor-DDH
      exists in tested scope; independent review-adversarial mandatory before any
      promotion.'
    - 'Harness accepts a class-invariant MOV construction as a pass: gate void.'
  confounders:
    - Cheon-style attacks requiring auxiliary input not implied by DDH alone (PI-A).
    - Toy subgroups where DDH is easy for everyone.
    - Incomplete Dent–Galbraith PDF (PI-C quarantined; no theorem invention).
  interpretation_limits:
    - >-
      Failure of admitted candidates (A aux-free, B) is a scoped screen with named
      oracles — not inventor-protocol §4 closure that ordinary trapdoor-DDH is
      impossible. HEUR-ECTD-DDH-1 must not be read as a closure heuristic from
      this screen.
    - Supersingular KN-LIT-7634 success does not transfer.
    - Not an ECDLP trapdoor lane; keep separate from GOAL completion criterion (i).
  heuristic_assumptions:
    - id: HEUR-ECTD-DDH-1
      statement: >-
        For ordinary prime-order E/F_p with embedding degree > log^2 N, no
        poly(log N)-time predicate computable from a short secret isogeny chain
        distinguishes DDH with constant advantage.
      rigorous_support: >-
        None; generic-group intuition plus class-invariant embedding degree.
        Falsified by any certified ordinary Π.
      validation_plan: >-
        The minimal_test itself is the validation; no crypto-scale sampling
        correspondence is claimed.
  target_complexity:
    time_exponent: >-
      trapdoor holder poly(log N) for DDH; public >= 1/2 for path recovery
      (aspirational; toy only)
    memory_exponent: poly(log N) for trapdoor; MITM path ~ ell^{1/2}
    best_known: >-
      KN-LIT-7634 supersingular trapdoor DDH; ordinary baseline is generic DDH
      hardness alongside ECDLP
    hidden_overhead: isogeny chain storage and dual evaluation
    tradeoff_note: MITM on the secret path
  dominated_by: >-
    Kutas–Petit–Silva for supersingular trapdoor DDH; Pollard rho / generic DDH
    for ordinary curves absent a passing Π
  sota_delta: >-
    No ordinary trapdoor-DDH construction claimed. Deliverable is a certificate
    gate that blocks silent analogy from KN-LIT-7634 to ordinary F_p and forces
    either a verified Π or a scoped fail of named candidates.
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: medium
