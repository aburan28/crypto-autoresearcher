# =============================================================================
# IDEA-20261001-5c936b -- Karabina symmetric PDP vs XOR-SAT on toy S_3 cells.
# Calibrates KR-IC-8b9daa against KR-IC-5765d2; no break / no exponent claim.
# =============================================================================
idea:
  id: IDEA-20261001-5c936b
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    DOES KARABINA'S SYMMETRIC PDP BEAT XOR-SAT ON TOY S_3 WEIL-DESCENT CELLS?
    On binary toys n∈{17,19,23} with frozen V (dim ℓ∈{3,4}), compare wall time
    and success of a frozen Karabina symmetric-function / Weil-restriction
    formulation against the program's admitted XOR-SAT path on identical
    descended S_3 instances.

  class: heuristic_validation

  claim: >-
    KR-IC-8b9daa reports Karabina's symmetric-function reformulation of
    binary-curve PDP as a constant/polynomial gain in the decomposition step;
    KR-IC-5765d2 records XOR-SAT (WDSat / CryptoMiniSat) as the measured
    binary PDP path. CLAIM: at each toy cell (n,ℓ)∈{17,19,23}×{3,4}, on a
    frozen batch of ≥30 identical descended S_3 PDP instances, Karabina-form
    median wall time is ≤ 0.8× XOR-SAT median wall time among instances both
    solvers finish — OR the ratio is >0.8 and is recorded as
    Karabina-not-faster at this scale. CLAIM TIER: heuristic_validation.
    NO break. NO exponent. NO claim that Karabina yields practical binary IC
    (KR-IC-1fcdbc remains the practical negative). NO n≥131 transfer.

  mechanism: >-
    OBJECT FRAME. Representation: Semaev S_3 on x-coordinates with factor
    base {P : x(P)∈V}, once encoded via Karabina's symmetric-function /
    Weil-restriction variables (KR-IC-8b9daa) and once via the admitted
    Boolean/XOR CNF path (KR-IC-5765d2 / KR-IC-5a43e5 / KR-IC-73db3f).
    Operation set: two elimination/search engines only — report time and
    success, not a full IC campaign. Trichotomy: Class I partial-action (IC
    relation under FB translation) used as instrument. Lossy-projection:
    solvers discard algebraic content beyond satisfiability; null is a
    random Boolean system of matched size/degree whose Karabina/SAT ratio
    should not inherit Semaev structure. OFF-LIMITS: asserting KR-IC-889857;
    re-running Crossbred-vs-XOR-SAT (IDEA-20261001-3f2d06); F4-trace replay
    (IDEA-20261001-c35b2a); provisioning new CAS mid-run. WHAT IS NEW: a
    pre-registered Karabina-form vs XOR-SAT wall-time ratio band on
    RQ-BINSTD toys.

  novelty_status: unverified
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
