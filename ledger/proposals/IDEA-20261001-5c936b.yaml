  assumptions:
    - Frozen (n,ℓ) cells, V construction, and identical instance batches for both engines.
    - Karabina-form encoder and XOR-SAT path already admitted or cell is failed_infrastructure.
    - Ratio band 0.8 and ≥30 instances pre-registered; no post-hoc edits.
    - A faster toy engine ≠ practical binary IC (KR-IC-1fcdbc).

  heuristic_assumptions:
    - id: HEUR-BINSTD-5c936b-H1
      formal_statement: >-
        FORALL (n,ℓ)∈{17,19,23}×{3,4}: on a frozen batch of ≥30 identical
        descended S_3 PDP instances, among instances both engines finish,
        median_wall(Karabina-form) ≤ 0.8 × median_wall(XOR-SAT).
      random_model_justification: >-
        Rigorous: KR-IC-8b9daa reports a structural reformulation that reduces
        variable/equation count by symmetry; KR-IC-5765d2 measures XOR-SAT as
        the program's baseline. Classical: if the reformulation only shuffles
        equivalent Boolean content, the wall-time ratio should concentrate near
        1; a ≤0.8 median band is the transfer hypothesis under test at toys —
        not a claim that the constant/poly gain survives at cryptographic n.
      supporting_results:
        - KR-IC-8b9daa
        - KR-IC-5765d2
      validation_experiment_ids: []
      falsification_condition: >-
        Ratio >0.8 at a completed cell (Karabina-not-faster), OR Karabina-form
        success rate is strictly below XOR-SAT by ≥0.2 on the same batch, OR
        either engine is absent (infrastructure stop, never mathematical
        falsification).

  predictions:
    - metric: karabina_over_xorsat_median_wall_ratio
      direction: upper_bounded
      minimum_effect: '≤ 0.8 among dual-finish instances at each (n,ℓ) cell'
    - metric: dual_finish_count
      direction: lower_bounded
      minimum_effect: '≥ 20 dual-finish instances per cell, else report shortfall'
    - metric: karabina_success_rate
      direction: lower_bounded
      minimum_effect: '≥ XOR-SAT success − 0.2 on the same batch'

  minimal_test: >-
    Stage 0: freeze V, seeds, Karabina encoder pin, XOR-SAT pin, ratio band.
    Stage 1: n=17, ℓ∈{3,4} — ≥30 instances; report medians ± bootstrap CI.
    Stage 2: n=19,23 + random-Boolean null of matched size. Budget: ≤8
    CPU-hours. Stop if either engine absent (IMP, never evidence).

  controls:
    - ctl_identical_instance_batch
    - null_random_boolean_matched_size
    - ctl_bootstrap_ci_reported
    - ctl_no_posthoc_ratio_edit

  falsification_conditions:
    - Claiming practical binary IC from a toy Karabina win (KR-IC-1fcdbc).
    - Transferring the ratio to n≥131 without a new contract.
    - Editing the 0.8 band after seeing timings.
    - Treating engine absence as mathematical falsification.
    - Confusing this with Crossbred (IDEA-20261001-3f2d06) or F4-trace (c35b2a).

  target_complexity:
    time_exponent: >-
      No exponent claimed. Engine-path meter only; even a ≤0.8 toy ratio does
      not move binary ECDLP vs rho (KR-IC-1fcdbc / KR-IC-9e610d).
    memory_exponent: Negligible — store per-instance wall times and success bits.
    best_known: >-
      KR-IC-8b9daa (Karabina constant/poly gain reported); KR-IC-5765d2
      (XOR-SAT measured baseline).
    hidden_overhead: Encoder constants; CNF/XOR encoding size; solver seeds.
    tradeoff_note: n/a — meter, not an attack tradeoff.

  estimated_cost:
