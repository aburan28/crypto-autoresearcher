idea:
  id: IDEA-20260807-bfa86b
  question_id: RQ-JINV-8fc13a
  added: '2026-08-07'
  title: >-
    The POSITIVE control for lane L3 - plant a known-answer sub-birthday weakness
    and require the instruments to find it at the predicted cost, because an
    instrument that cannot detect a real weakness produces void negatives - built
    on the boundary result that the GLV coordinate change is a measure-preserving
    bijection of the key space, so no j=0-specific key distribution beats the
    same-entropy generic one in EXPONENT, and the one lever in this lane that
    does move an exponent (key entropy) lies OUTSIDE the campaign's R1-R8
    resource taxonomy entirely
  class: control

  claim: >-
    (A) WHY A POSITIVE CONTROL IS NOT OPTIONAL HERE. docs/inventor-protocol.md
    section 3 requires that a signal be checked against a null before it is
    believed. It does not, by itself, require the converse - that the instrument
    be shown able to see a signal that IS there - but DECOMPOSITION.md's L14
    states both directions: "the instrument must fail to detect a signal in a
    matched random object, AND must detect a PLANTED signal - both directions."
    Lane L3 is about to produce a series of negatives (see the other eight
    proposals in this batch, of which at least five predict their own negative).
    A NEGATIVE FROM AN INSENSITIVE INSTRUMENT IS NOT EVIDENCE. This record
    supplies the planted signals that make those negatives citable.

    (B) THE KEY-SIDE PLANT, WITH ITS COST KNOWN IN ADVANCE. On a j=0 curve, draw
    the secret as k = k1 + k2*lambda mod N with (k1, k2) uniform in a box of side
    S = ceil(N^{alpha/2}) for a declared alpha in (0, 1), instead of k uniform in
    Z/N. The support has about N^alpha elements, so the best generic search costs
    Theta(N^{alpha/2}) - a genuine, known-answer, sub-birthday weakness whose
    exponent is fixed by construction. The instrument's job is to recover k at
    that cost using a two-dimensional Gaudry-Schost-style search over the box.
    PASS means the L3 pipeline can see a real exponent-level structure when one
    is present; FAIL means every L3 negative in this batch is VOID rather than
    negative.

    (C) THE BOUNDARY RESULT THIS CONTROL ALSO ESTABLISHES, AND IT IS THE RECORD'S
    MATHEMATICAL CONTENT. It is tempting to read (B) as "j=0 curves are weak
    against structured keys". They are not, and the reason is exact. The GLV
    decomposition is the bijection
        Z/N  <->  a fundamental domain of the lattice
                  L = {(a,b) in Z^2 : a + b*lambda = 0 mod N},
    which has determinant N (this is H-ENDO-001's index-pinning result P1, and it
    is rigorous rather than heuristic because lambda_1 = 1 is a unit). A
    BIJECTION PRESERVES CARDINALITY. Therefore a key distribution supported on a
    set of size M has support of size M in either coordinate system, and the
    birthday cost of searching it is Theta(sqrt(M)) either way. CONSEQUENTLY:
      NO KEY DISTRIBUTION ON A j=0 CURVE HAS A SMALLER SEARCH EXPONENT THAN THE
      SAME-ENTROPY DISTRIBUTION ON A GENERIC CURVE.
    What DOES change is the SHAPE of the support - an interval becomes a
    two-dimensional box - and hence the CONSTANT of the search algorithm
    (one-dimensional kangaroo versus two-dimensional Gaudry-Schost), plus the
    sqrt(|Aut|/2) = sqrt(3) automorphism discount that applies to both. Constants,
    not exponents. [derived in this record from the bijection; elementary.]

    (D) THE OBSERVATION ABOUT THE CAMPAIGN'S OWN TAXONOMY, WHICH IS WORTH MORE
    THAN THE CONTROL. The one lever in this entire lane that genuinely moves an
    exponent is the ENTROPY OF k: alpha in (B) is a free parameter and the cost
    exponent is alpha/2. That lever is not R1, not R2, ..., not R8. The R1-R8
    taxonomy in DECOMPOSITION.md section 2 enumerates CURVE-SIDE resources -
    coordinates, equation, ring, isogeny graph, torsion, lifts, pairings,
    multi-instance structure - and the key distribution is not among them,
    because it is not a property of the curve at all. THIS IS A GAP IN THE
    DECOMPOSITION, IT IS BENIGN (the campaign is about curve structure, and a
    low-entropy key is a protocol failure rather than a curve weakness), AND IT
    SHOULD BE RECORDED RATHER THAN DISCOVERED LATER BY SOMEONE MISFILING A KEY-
    DISTRIBUTION RESULT AS A CURVE RESULT. Recording it is this proposal's second
    deliverable.

    (E) WHAT IS CLAIMED BEYOND THE sqrt(|Aut|) CONSTANT: NOTHING ABOUT CURVES.
    The exponent alpha/2 in (B) is planted by the experimenter and is a property
    of the instance generator, never of the curve; presenting it as a curve
    result would be exactly the category error (D) exists to prevent. Filed as a
    control and as a boundary statement.

  resource_label: >-
    "audit: consumes no resource (positive control)". The planted arm changes the
    KEY DISTRIBUTION, which by claim (D) is outside R1-R8 by construction - and
    that exclusion is itself part of the deliverable rather than an oversight.

  admissibility: admissible
  admissibility_argument: >-
    A control names no attack mechanism and so cannot be inadmissible. Its
    relationship to the filter is instructive and is stated rather than assumed:
    the planted weakness is REAL - it genuinely lowers the search exponent to
    alpha/2 - and it is nonetheless outside the filter, because the filter asks
    what non-generic CURVE resource a mechanism consumes and this consumes none.
    A low-entropy key is weak in the generic group model too; Shoup's bound is
    Omega(sqrt(|support|)), not Omega(sqrt(N)). So the plant is simultaneously
    admissible, real, and irrelevant to the campaign's question - which is
    precisely the configuration that makes it a good positive control, since it
    tests sensitivity without contaminating the research claim.

  discriminated_from:
    - >-
      IDEA-20260807-a3d644 (this batch), the NEGATIVE control battery - matched
      nulls on which the instrument must detect nothing. This is the positive
      side. An instrument validated on only one side is not validated: a
      pipeline that always reports "no difference" passes every null and is
      useless, and a pipeline that always reports "difference" passes every
      plant and is worse. Both records are required and neither substitutes for
      the other.
    - >-
      H-ENDO-001, whose P2/P3 concern the GEOMETRY of the augmented witness
      lattice (first minimum shrinkage, meet-in-the-middle cost) for a UNIFORM
      k. This record uses only P1 (index exactly N) and only as the statement
      that the GLV map is a bijection; it then asks a different question, about
      NON-UNIFORM k, which H-ENDO-001 does not address anywhere. It does not
      test, support, weaken or restore that hypothesis.
    - >-
      KN-TECH-031's interval-search accounting ("a mechanism that spends C
      operations to shrink the search from n to L only wins if
      C + 2*sqrt(L) < 0.886*sqrt(n)"), which is the one-dimensional version of
      this record's cost frame. This record supplies the two-dimensional
      analogue on the GLV box and observes that the exponent is the same.
    - >-
      Any protocol-level claim about biased nonces or low-entropy keys. This
      record makes none: the plant is a laboratory instrument, the scope
      statement forbids reading it as a statement about any deployed system, and
      the constraint in RQ-JINV-8fc13a limiting work to public constructions and
      toy benchmarks is binding.

  object_first_candidate:
    tracked_object: >-
      THE INSTRUMENT'S DETECTION CURVE - measured recovery cost as a function of
      the planted exponent alpha - followed as alpha is swept from 1.0 (no plant,
      uniform k) down to 0.4.
    lossiness: >-
      LOSSY: the whole pipeline collapses to one number per alpha. Everything
      about the curve, the walk, the solver and the instance is discarded except
      the measured cost. Nothing about any secret is recoverable from the curve,
      because it is a curve of costs, not of keys.
    propagation: >-
      Deterministic in the sense that matters: the predicted curve is
      cost = c * N^{alpha/2} for a constant c, so the LOG-LOG SLOPE against alpha
      is a fixed 1/2 and propagates exactly as alpha is varied. The slope, not the
      intercept, is the tested quantity, which makes the object robust against
      implementation constants - the standard reason to prefer slopes to absolute
      timings in this program (KN-TECH-052-style fitting discipline).
    survival_score: >-
      Survives across curve families (the slope must be 1/2 on generic, j=1728
      and j=0 alike, with only the intercept moving by sqrt(3)). Dies at alpha
      close to 1, where the plant becomes indistinguishable from a uniform key
      and the detection question is vacuous - which is why the sweep must reach
      well below 1 and why alpha = 1 is included as the built-in null.

  mechanism: >-
    STEP 1 (the plant, low implementation). Extend the toy instance generator so
    that a j=0 (and j=1728, and generic) instance can be produced with k drawn
    from a declared distribution: uniform on Z/N (alpha = 1, the built-in null),
    uniform on an interval of length N^alpha, or uniform on a GLV box of side
    N^{alpha/2}. The distribution is recorded in the instance and is NOT
    disclosed to the solver.

    STEP 2 (the detector). Implement two searches: a one-dimensional
    kangaroo/BSGS over an interval, and a two-dimensional Gaudry-Schost-style
    search over a box in the GLV coordinates, both with the automorphism
    quotient available on special-j curves. Each returns k with a certificate
    re-verified independently by harness/toycurve.py (docs/claims-and-verification.md).

    STEP 3 (the sweep, and it is the deliverable). For alpha in
    {1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4} and three field sizes and three curve
    families, measure recovery cost in F_p multiplications. Fit log(cost) against
    alpha*log(N). PREDICTED SLOPE EXACTLY 1/2 in every family. The intercept must
    differ between families by exactly the automorphism factor, i.e. by
    sqrt(3) between generic and j=0 and sqrt(2) between generic and j=1728, and
    by nothing else.

    STEP 4 (THE BOUNDARY TEST, WHICH IS CLAIM (C) MADE FALSIFIABLE). At a FIXED
    support size M, compare three shapes: an interval of length M on a generic
    curve; an interval of length M on a j=0 curve; a GLV box with M points on a
    j=0 curve. Predicted: all three cost Theta(sqrt(M)), differing only by
    constants, with the j=0 arms cheaper by at most sqrt(3). A SHAPE THAT COSTS
    MATERIALLY LESS THAN sqrt(M) WOULD REFUTE CLAIM (C) and would be the one
    genuinely exponent-relevant event this lane could produce - so this step is
    both a control and a real experiment, which is why the proposal is not merely
    housekeeping.

    STEP 5 (the curve-side plant, a second and independent sensitivity test).
    Inject an artificial curve-side signal into the L1/L3 variance instrument:
    construct a synthetic "curve" whose measured cost functional is deliberately
    biased by a declared amount d, and verify the stratified analysis of
    IDEA-20260807-94f953 and the null battery of IDEA-20260807-a3d644 recover d
    within their stated confidence intervals, for d swept down to the smallest
    effect the lane intends to claim. This calibrates the MINIMUM DETECTABLE
    EFFECT SIZE of every L3 functional, which is a number no L3 negative can be
    interpreted without and which no other proposal in this batch produces.

    STEP 6 (record the taxonomy gap of claim (D)) as a note for the Coordinator,
    with the recommendation that it be handled by an explicit scope sentence in
    DECOMPOSITION.md rather than by adding an R9 - because the key distribution
    is genuinely not a curve resource and adding it would blur the filter that
    makes the taxonomy useful. That recommendation is advisory; only the
    Coordinator amends the decomposition.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Run 2026-08-07 from the repository root.
      (1) read DECOMPOSITION.md L14 and section 2 (R1-R8) in full
      (2) read docs/inventor-protocol.md section 3 in full
      (3) read ledger/hypotheses/H-ENDO-001.yaml in full, especially the P1
          index-pinning derivation
      (4) read knowledge/techniques/KN-TECH-031.md in full (interval search,
          kangaroo, the C + 2 sqrt(L) accounting)
      (5) grep -ril "planted\|positive control" ledger/ knowledge/ docs/
    results: >-
      "Planted" controls appear in this program's practice - H-ENDO-001's
      falsification list includes "the planted index-collapse positive control is
      NOT detected" and DECOMPOSITION.md L14 requires both directions - so the
      DEVICE is established here. What is absent: no record plants a KEY-SIDE
      weakness, no record sweeps a planted exponent to measure a detection slope,
      no record states the minimum detectable effect size for any L3 functional,
      and no record contains the bijection argument of claim (C) or the taxonomy
      observation of claim (D). KN-TECH-031 supplies the one-dimensional cost
      frame and not the two-dimensional one.
    verdict: >-
      ADAPTATION. Planted-signal calibration is standard experimental practice
      and the GLV bijection is H-ENDO-001's P1 restated; neither is claimed as
      new. New to this program: the alpha-sweep detection curve, the fixed-support
      shape comparison of Step 4, the minimum-detectable-effect calibration of
      Step 5, and the recorded taxonomy gap.

  null_object_control: >-
    THE BUILT-IN NULL IS alpha = 1.0 - a uniform key, i.e. no plant at all. The
    instrument must report cost Theta(sqrt(N)) there and must NOT report a
    detected structure. An instrument that "detects" a plant in a uniform
    instance is producing false positives and every L3 negative it underwrites is
    worthless in the opposite direction from the usual failure.
    SECOND NULL: the generic-curve arm at every alpha. The detection slope must
    be 1/2 there too - the plant is not a curve effect and must be detected
    equally well on a curve with no automorphism. If the detector only works on
    j=0 curves, it is exploiting the plant's coordinate system rather than its
    entropy and Step 4's boundary test is invalid.
    THIRD NULL: a plant in the WRONG coordinates - a GLV box drawn with a random
    lambda' that is not the curve's eigenvalue. The two-dimensional detector must
    FAIL there, because the box is not a box in the true coordinates. Success
    would mean the detector is not using the GLV structure at all.
    DECAY PARAMETER: alpha. Detection must DEGRADE MONOTONICALLY as alpha rises
    toward 1, vanishing at alpha = 1. A detector whose reported "signal" is flat
    across alpha is the canonical artifact tell and its outputs are void.

  assumptions:
    - >-
      LAWFUL SCOPE, AND IT IS BINDING. Every instance is synthetic and generated
      by this program at toy scale. No deployed system, wallet, key or protocol
      is analysed, targeted or referenced, per the constraints in
      RQ-JINV-8fc13a. The plant is a laboratory calibration device and the record
      makes no claim about any real key-generation procedure.
    - >-
      lambda is publicly computable without a discrete logarithm (roots of
      L^2 + L + 1 or L^2 + 1 mod N), inherited from H-ENDO-001's assumption list.
    - >-
      The two-dimensional search's constant is not assumed; it is measured. Only
      the EXPONENT 1/2 is predicted, and the fit is on the slope.
    - >-
      Toy scale, N up to about 2^28 for the search arms so that a full uniform
      solve at alpha = 1 remains affordable as the anchor point. Anchoring at
      alpha = 1 is what makes the slope meaningful, so it may not be skipped for
      budget reasons.
    - >-
      Every recovered k is certified by recomputing k*P and comparing with Q.
      An uncertified recovery is not a detection.

  proof_search_map:
    bottleneck: >-
      The claim that the search cost depends only on the SUPPORT SIZE and not on
      the coordinate system. Everything in claim (C) rests on it, and Step 4 is
      built to attack it directly rather than to assume it.
    baseline_embedding:
      parameter_slice: >-
        alpha = 1.0 on a generic curve. The measured cost must reproduce the
        program's baseline convention 0.886*sqrt(N) within its stated band
        (KN-TECH-006), and the j=0 arm at alpha = 1 must reproduce
        0.886*sqrt(N/3) per IDEA-20260807-a3d644 claim (D).
      reproduction_check: >-
        Frozen fixture: fixed instances at three sizes, measured cost compared
        against the convention. A miss at alpha = 1 means the instrument is
        mis-calibrated and no slope may be reported, because the slope is fitted
        through that anchor.
    observation_collision:
      observable: >-
        The measured recovery cost.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, and its success is claim (C): an
        interval of size M on a generic curve and a GLV box of size M on a j=0
        curve are two distinct ground-truth objects that must produce the SAME
        observable up to a constant. If they do, the observable is a function of
        support size alone and no j=0-specific key weakness exists. If they do
        NOT - if the box is materially cheaper - claim (C) is refuted and the
        lane has found something real. Both branches are informative and the
        search is mandatory rather than optional.
    quantifier_order: >-
      Intended: FORALL curve families in the declared set, FORALL alpha in the
      declared sweep, the measured recovery cost is Theta(N^{alpha/2}) with a
      family-dependent CONSTANT and a family-INDEPENDENT exponent.
      The dangerous weaker reading, NOT claimed: FORALL families EXISTS an
      exponent - which would permit the exponent to depend on the family and is
      exactly what claim (C) denies. The audit obligation is that the slope is
      fitted separately per family and the three slopes are compared, rather than
      pooling them into one fit that could hide a family-dependent exponent.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the tested toy instances, the recovery cost exponent for a planted
        support of size N^alpha is alpha/2 in every curve family, and the L3
        functionals' minimum detectable effect size is d_min." It can NEVER
        certify that no key distribution anywhere has a better exponent on a j=0
        curve - claim (C)'s bijection argument does that, and the experiment only
        corroborates it - nor that the instrument would detect a structure of a
        kind not planted, which is the permanent limitation of every positive
        control and is stated rather than glossed.
      nearby_object_control: >-
        A PLANT THAT IS NOT SEARCHABLE BY THE DETECTOR: k drawn from a support of
        size N^alpha that is a pseudorandom SUBSET rather than a box or an
        interval. The best generic cost is still Theta(N^{alpha/2}) by birthday,
        but neither the kangaroo nor the two-dimensional search can exploit it,
        so the detector must FAIL while the weakness is real. This is the sharpest
        possible reminder of what a positive control does and does not license:
        passing it shows the instrument sees THE PLANTED SHAPE, not that it sees
        every weakness, and any L3 negative must be scoped to the shapes actually
        planted.
    proof_obligations:
      - claim: "The GLV map is a bijection Z/N <-> a fundamental domain of L."
        responsibility: correctness
      - claim: "A bijection preserves support size, hence the birthday exponent."
        responsibility: correctness
      - claim: "The measured slope is 1/2 in every family."
        responsibility: runtime
      - claim: "alpha = 1 reproduces the baseline convention in every family."
        responsibility: baseline
      - claim: "The wrong-coordinates plant is NOT detected."
        responsibility: soundness
      - claim: "Every recovery carries a re-verified certificate."
        responsibility: soundness
      - claim: >-
          Conclusions are scoped to the planted shapes; the pseudorandom-subset
          control is reported alongside every pass.
        responsibility: scope

  predictions:
    - metric: >-
        fitted slope of log(recovery cost) against alpha*log(N), per curve family
      direction: different
      minimum_effect: >-
        0.50 within 0.05 in all three families, with the three slopes agreeing
        within 0.05 of each other. A family-dependent slope refutes claim (C) and
        is the single most important possible outcome of this record.
    - metric: >-
        intercept ratio between the generic and j=0 arms at fixed alpha
      direction: lower
      minimum_effect: >-
        sqrt(3) = 1.732 within 25 percent, consistent with
        IDEA-20260807-a3d644's independently measured constant. Disagreement
        between the two records is an instrument failure in one of them and both
        must halt.
    - metric: >-
        cost at fixed support size M, comparing interval-on-generic,
        interval-on-j0 and GLV-box-on-j0 (Step 4)
      direction: different
      minimum_effect: >-
        All three within a factor 3 of each other and all Theta(sqrt(M)). Any arm
        materially below sqrt(M) refutes claim (C) and halts the line for
        independent review under AGENTS.md rule 12.
    - metric: detection at alpha = 1.0 (the built-in null)
      direction: different
      minimum_effect: >-
        NO structure detected, cost consistent with the baseline convention. A
        false positive here voids the instrument in the direction opposite to the
        usual failure and is just as fatal.
    - metric: detection with a wrong-lambda GLV box
      direction: different
      minimum_effect: >-
        FAILURE to detect, at every alpha. Success means the detector is not
        using the curve's eigenvalue and Step 4's comparison is meaningless.
    - metric: >-
        minimum detectable effect size d_min for each L3 cost functional, from
        the curve-side plant (Step 5)
      direction: different
      minimum_effect: >-
        Reported as a number per functional, whatever it is. Any L3 negative
        claiming "no effect" must be restated as "no effect above d_min", and an
        L3 negative reported without d_min is incomplete.

  minimal_test:
    design: >-
      CHEAPEST VALID DISCRIMINATOR: THE THREE-POINT SLOPE CHECK ON ONE CURVE
      FAMILY. Fix one j=0 toy curve at 24 bits. Generate planted instances at
      alpha = 1.0, 0.7 and 0.4 and run the two-dimensional detector on all three.
      If the log-log slope is 1/2 and alpha = 1.0 reproduces the baseline, the
      instrument is calibrated well enough to underwrite this lane's negatives at
      that field size. Three solves at 24 bits, one of which (alpha = 0.4) is
      nearly free, and the whole calibration is done.
      Step 4's fixed-support shape comparison is the next cheapest and is the
      part with genuine mathematical content, since it is the only falsification
      route for claim (C).
      Step 5's curve-side plant is separable and can be dispatched with whichever
      L3 measurement lands first; it does not need this record's search machinery.
    controls:
      - alpha = 1.0 built-in null on every family
      - generic-curve arm at every alpha
      - wrong-lambda GLV box, which must not be detected
      - >-
        pseudorandom-subset plant, a real weakness the detector must MISS, to
        bound what a pass licenses
      - matched rho and matched BSGS at alpha = 1 as the baseline anchor
      - certificate re-verification of every recovered k
    required_metrics:
      - recovery cost in F_p multiplications per (family, alpha, size, seed)
      - fitted slope and intercept per family, with confidence intervals
      - fixed-support shape comparison (Step 4), all three arms
      - pass/fail of the built-in null, the wrong-lambda control and the
        pseudorandom-subset control
      - minimum detectable effect size per L3 functional (Step 5)
      - certificate pass rate, which must be 100 percent
      - the declared plant distribution per instance, recorded but withheld from
        the solver until after the run

  falsification_conditions:
    - >-
      The fitted slope differs from 1/2 by more than 0.05 in any family. Either
      the detector is wrong or claim (C) is; both must be resolved before any L3
      negative is reported.
    - >-
      The three families' slopes differ from each other by more than 0.05. Claim
      (C) is refuted: the exponent depends on the curve family, which would be
      the lane's first exponent-level result and requires review-breakthrough
      handling under AGENTS.md rule 12.
    - >-
      Any Step 4 arm costs materially below sqrt(M). Claim (C) refuted; halt.
    - >-
      The built-in null at alpha = 1 reports a detection. False positive; the
      instrument is void.
    - >-
      The wrong-lambda control is detected. The detector is not using the curve's
      structure and Step 4 is meaningless.
    - >-
      The detector cannot recover the planted key at alpha = 0.4 within budget.
      THE L3 INSTRUMENT IS INSENSITIVE AND EVERY NEGATIVE IN THIS BATCH IS VOID
      RATHER THAN NEGATIVE - which is the outcome this record exists to make
      visible, and it is a serious one.
    - >-
      Any recovered k fails certificate verification. Run INVALID, not negative.

  confounders:
    - >-
      IMPLEMENTATION CONSTANTS DOMINATE AT TOY SCALE. Absolute costs at 24 bits
      are dominated by Python overhead. Only slopes are interpreted, and the
      slope fit needs at least three alpha values and at least three field sizes
      before it means anything.
    - >-
      THE PLANT'S SHAPE IS THE PLANT'S LIMITATION. A pass shows the instrument
      sees boxes and intervals. The pseudorandom-subset control exists to make
      that limit explicit and must be reported next to every pass, or the
      calibration will be over-read.
    - >-
      THE AUTOMORPHISM DISCOUNT AND THE PLANT INTERACT. On a j=0 curve at small
      alpha the box can be small enough that the automorphism identifications
      fold parts of it onto itself, changing the effective support. The box is
      chosen inside a fundamental domain for the automorphism action, and the
      choice is recorded, or the sqrt(3) intercept comparison is confounded.
    - >-
      alpha NEAR 1 IS UNINFORMATIVE by construction. The sweep must reach 0.4 or
      below for the slope to be identified, and budget must be allocated
      accordingly rather than spent on the expensive high-alpha end.
    - >-
      STEP 5's SYNTHETIC BIAS IS NOT A CURVE. It calibrates the ANALYSIS, not
      the curve-measurement pipeline end to end. A separate plant injected at the
      curve level would be stronger and is named here as a possible extension
      rather than claimed as done.

  interpretation_limits:
    - >-
      NO CLAIM ABOUT ANY DEPLOYED SYSTEM, KEY-GENERATION PROCEDURE OR PROTOCOL.
      Every instance is synthetic and toy-scale, and the record's scope statement
      forbids any other reading.
    - >-
      A PASS LICENSES NOTHING BEYOND SENSITIVITY TO THE PLANTED SHAPES at the
      tested sizes. It does not establish that the instrument would see a
      structure nobody thought to plant.
    - >-
      Claim (C) is about EXPONENTS. Constants do differ between coordinate
      systems and between families, by up to sqrt(3), and the record measures
      them rather than dismissing them.
    - >-
      The taxonomy observation in (D) is advisory. Only the Coordinator amends
      DECOMPOSITION.md, and this record proposes no amendment beyond a scope
      sentence.
    - >-
      Toy scale throughout. The slope 1/2 measured at 20-28 bits is a
      calibration, not a crypto-scale validation of anything.

  reachability_gate: >-
    NOT APPLICABLE AS A WALK: no isogeny is computed and the curve is fixed. The
    gate is nonetheless worth stating in its key-side form, because it is the
    exact analogue and it is the boundary this record draws: the planted
    weakness is not REACHABLE BY AN ATTACKER AT ALL - it must be handed over by
    the instance generator. An attacker facing a uniformly drawn k cannot
    manufacture a low-alpha instance at any cost, just as an attacker facing a
    generic curve cannot walk to a j = 0 one at any cost (T4). Both halves of
    this lane's exponent story are therefore gated by something the attacker does
    not control, which is the cleanest statement of why L3 is a calibration lane
    rather than an attack lane.

  target_complexity:
    time_exponent: >-
      The planted instances have search exponent alpha/2 by construction, with
      alpha declared by the experimenter. THIS IS NOT AN ALGORITHMIC CLAIM: the
      exponent is an input, not an output. For uniform keys (alpha = 1) the
      exponent is 1/2 in every family, which is claim (C) and is what the record
      corroborates.
    memory_exponent: >-
      The two-dimensional Gaudry-Schost-style search is low-memory with
      distinguished points, matching rho's O(1) profile; BSGS variants trade to
      sqrt(support) memory. Both are measured, because a detector that only works
      with large memory would not be usable as this lane's instrument at larger
      sizes.
    best_known: >-
      Parallel rho with distinguished points at 0.886*sqrt(N), O(1) memory
      (KN-TECH-001, KN-TECH-006); automorphism-discounted rho (KN-TECH-018); BSGS
      and the interval/kangaroo finisher at about 2*sqrt(L) with the full-cost
      caveat (KN-TECH-031). For a support of size M the frontier is
      Theta(sqrt(M)) and claim (C) says the GLV coordinate change does not move
      it.
    hidden_overhead: >-
      Disclosed: the two-dimensional search's constant is not known in advance in
      this program and is measured, so the intercept comparison carries whatever
      that constant is; and the automorphism folding at small alpha (see
      confounders) can perturb the effective support in a way that inflates the
      apparent discount if the box is not chosen inside a fundamental domain.
    tradeoff_note: >-
      The detector has a genuine time-memory dial (distinguished-point
      granularity in the low-memory variant versus table size in the BSGS
      variant) and both ends are measured, because the lane's instrument must
      remain usable at the largest toy size and the memory-heavy end fails first.

  dominated_by: >-
    AS AN ATTACK: mounts none - the only "advantage" is planted by the
    experimenter and cannot be obtained by an attacker. Checked row by row.
    TIME - rho at 0.886*sqrt(N) (KN-TECH-001, KN-TECH-006) dominates for uniform
    keys, and for a planted support of size M the frontier is Theta(sqrt(M))
    which this record matches rather than beats. MEMORY - rho at O(1); the
    low-memory detector matches and does not beat it. DATA/QUERIES - no
    advantage. CM-SPECIFIC - automorphism-discounted rho (KN-TECH-018) is the
    anchor the alpha = 1 arm reproduces. MEMORY-RICH - BSGS and the interval
    finisher (KN-TECH-031) dominate in that corner and are the correct comparison
    for the table-based detector variant. NOT null.
    AS A CONTROL: no incumbent exists for L3; H-ENDO-001's planted index-collapse
    control is the nearest device in the corpus and it calibrates a different
    instrument (lattice index, not search cost).
  sota_delta: >-
    Zero speedup against every baseline, on every axis, for uniform keys - and
    claim (C) argues that is unavoidable rather than incidental, because the GLV
    map is a cardinality-preserving bijection. Calibration delta, quantitatively:
    produces one detection slope per curve family (predicted 0.500 +- 0.05), one
    intercept ratio (predicted sqrt(3) = 1.732 for j=0 against generic), and one
    minimum-detectable-effect number d_min per L3 cost functional - the last of
    which converts every "no effect" in this batch from an unbounded claim into
    the bounded and honest "no effect above d_min". Boundary delta: records that
    the only exponent-moving lever in this lane, key entropy alpha, lies outside
    R1-R8 and is not attacker-controllable.

