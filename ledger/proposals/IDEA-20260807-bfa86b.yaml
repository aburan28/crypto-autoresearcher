  recommended_priority: medium

  honest_prior_of_survival: >-
    0.95 that claim (C)'s bijection argument holds - it is H-ENDO-001's P1
    restated and P1 is rigorous. 0.85 that the measured slope is 0.5 within 0.05
    in all three families; the risk is toy-scale constants swamping the fit, not
    mathematics. 0.7 that the detector recovers alpha = 0.4 plants comfortably at
    all three sizes, which is the sensitivity threshold that matters. Under 0.05
    that a family-dependent exponent appears - and that branch would be the most
    consequential outcome in the batch, which is why it is worth the sweep. The
    proposal is ranked medium: it is not going to find an attack, but at least
    five other proposals in this batch predict their own negatives, and without
    d_min those negatives are unbounded claims. It should be scheduled alongside
