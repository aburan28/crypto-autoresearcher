idea:
  id: IDEA-20260829-bc9cc5
  question_id: RQ-MLKEM-003
  added: '2026-08-29'
  title: >-
    Every one of the 28 filed proposals in this lane moves the NUMERATOR. The margin is a
    DIFFERENCE, and its denominator - the NIST reference cost 143 / 207 / 272 - is recorded in
    this program's own committed evidence as UNVERIFIABLE (EV-MLKEM-020 H11) and as never
    re-charged for memory (H8, checked_by "nobody"), with a stated sensitivity of one bit of
    cutoff error to 78 percent of Kyber-1024's entire result. Track the AES key-search REFERENCE
    COMPUTATION as the object, price it in the same cost model the attack is priced in, and
    discriminate "the committed margin is a property of the lattice estimate" from "the committed
    margin is a difference of two independently modelled numbers, only one of which this program
    has ever costed"
  class: measurement
  claim: >-
    (A) THE STRUCTURAL ASYMMETRY. A NIST security-category verdict is the sign of a difference:
    log2(best attack cost) minus log2(reference cost). This program has produced eighteen batches,
    twenty-eight proposals and at least two committed evidence records about the first term and
    exactly zero measurements of the second. EV-MLKEM-020 records the difference as
    140.1994731076207 / 200.9587149140538 / 270.7236234535225 against "NIST classical cutoffs
    143 / 207 / 272" (read directly from that file this session, line 127-128), i.e. undercuts of
    2.800527 / 6.041285 / 1.276377 bits. The same record's own assumption table, read this
    session at lines 420-453, states H8 "The NIST cutoff is not itself re-charged for memory" with
    validation_status "unvalidated ... The AES-is-O(1)-storage argument is sound in shape and
    unverified against the reference computation" and checked_by "nobody"; and H11 "NIST cutoffs
    143 / 207 / 272 taken from archived program records" with validation_status "UNVERIFIABLE. No
    FIPS 203 or NIST call text is readable under this program's network policy; neither reviewer
    endorses the cutoffs. A one-bit error moves c* by 0.0113 / 0.0076 / 0.0055 - the last being
    78% of Kyber-1024's entire c*." The record's unresolved_confounds section calls the cutoffs
    "THE DENOMINATOR OF THE WHOLE EXERCISE".
    (B) THE CLAIM PROPER, TWO-SIDED AND FALSIFIABLE. The reference cost is not a constant; it is
    a function R(metric, circuit, search-order) exactly as the attack cost is a function of
    (cost model, sieve, blocksize). The claim is that at least one of the following three
    readings moves R by at least 1.276377 bits - the smallest committed margin, at ML-KEM-1024 -
    and therefore changes the SIGN of a committed verdict at at least one parameter set:
    (R1) THE CIRCUIT READING. R = |keyspace| x (gates per trial). The second factor is a specific
    published circuit synthesis in a specific gate basis; a different basis or a better synthesis
    moves it, and the corpus already holds one such improvement for the quantum variant of the
    same circuit family (KN-LIT-706 records "For AES-128, the number of Toffoli gates can be
    reduced by more than 88% compared to Almazrooie et al.'s and Grassl et al.'s estimates").
    Whether the CLASSICAL count NIST used has moved similarly is unread anywhere in this program.
    (R2) THE SEARCH-ORDER READING. R assumes cost = |keyspace| x (one full trial). An exhaustive
    search enumerated in a structured order amortises key-schedule and early-round work across
    subtrees of keys, so the AMORTISED gates per key tried is at most, and generally below, the
    per-trial circuit count. The gap is measurable by counting, not modelling.
    (R3) THE METRIC READING, WHICH IS THE ONE THAT CAN CHANGE SIGN IN BOTH DIRECTIONS. The
    NIST pqc-forum thread "Update on category 1 security" (WebFetch, this session) states
    verbatim "We're pretty sure any attack on that scale would need to use custom hardware, like
    what's used in bitcoin mining. By doing a little comparison shopping for bitcoin mining
    equipment, we estimated that the cost of 2^143 bit operations was about 2^64 US$", and the
    same thread discusses memory-access limits of 2^120 bits and 2^100 bits and a depth limit of
    2^75. So the reference side has at least four declared metrics in circulation - bit
    operations, bit operations under a memory-access cap, depth-limited cost, and dollars - and
    this program has only ever used the first. Under a dollar or memory-access metric the
    reference is essentially unchanged (its working set is a few kilobits per core) while the
    sieve pays 2^(0.2075 n) cells, which moves the difference IN ML-KEM'S FAVOUR; under an
    improved-circuit or amortised-search reading the reference falls, which moves it AGAINST.
    The deliverable is the signed table, not a slogan.
    (C) WHAT DISCRIMINATES. EXPLANATION A, STABLE DENOMINATOR - the reference cost moves by less
    than 0.5 bits across every reading enumerated above and every sign in EV-MLKEM-020 is
    unchanged; then H8 and H11 are CLOSED with a number, the lane's twenty-eight numerator
    proposals inherit a validated denominator, and this record's own claim is refuted. EXPLANATION
    B, MOVABLE DENOMINATOR - at least one reading moves it by at least 1.276377 bits; then every
    bit-level margin this program has committed is a statement about an uncosted reference and
    must be re-quoted as an interval.
    (D) WHAT IS NOT CLAIMED. No attack, no break, no new algorithm, no claim that ML-KEM is or is
    not in any category, and no claim about what FIPS 203 says - the primary text remains
    unreadable from this harness. Nothing here proposes a status change to any committed record.
  mechanism: >-
    STAGE 0, PROVENANCE, AND ONE ROUTE THIS PROGRAM DID NOT KNOW IT HAD. RQ-MLKEM-003's own
    provenance block records csrc.nist.gov and nist.gov as unreachable (proxy CONNECT 403). This
    session successfully fetched a NIST pqc-forum thread through groups.google.com/a/list.nist.gov,
    which is a DIFFERENT host and is reachable. Stage 0 exhausts that route for the primary
    statements of the category definitions and the reference cost, records exactly which URLs
    resolved, and records failures as failures. Any number that cannot be sourced is carried as
    conditional and flagged, never estimated.
    STAGE 1, THE SYMMETRY ARM, ZERO COMPUTE. EV-MLKEM-020 charges the attack T x M^c and leaves
    the reference at c = 0 (H6, H8). Recompute its critical exponent c* under the SYMMETRIC rule
    in which both sides are charged T x M^c, with M_ref the measured working set of one
    key-search core. Because M_ref is polynomial and M_sieve is 2^(0.2075 n), the direction is
    FORCED - a symmetric charge can only raise the reference, hence can only lower c* - so only
    the MAGNITUDE carries information, and the record says so before running. Deliverable: the
    signed shift in c* per parameter set, computed in closed form from numbers already committed.
    STAGE 2, THE CIRCUIT AND SEARCH-ORDER ARM, THE ONLY ARM THAT MEASURES. Take a public
    bitsliced AES-128/192/256 key-search core, compile it to a fixed, declared gate basis
    (AND, XOR, NOT with NOT free; and separately the {AND, XOR} basis), and COUNT: (i) gates per
    full trial; (ii) gates per key tried when the search is enumerated in an order that shares
    key-schedule and early-round work across a subtree of 2^t keys, for t on a grid; (iii) the
    core's working set in bits. Counting, not timing. Report |keyspace| x (ii) as R_measured per
    category and the signed difference against 143 / 207 / 272.
    STAGE 3, THE METRIC TABLE. Evaluate the difference (attack minus reference) under each of the
    four declared metrics of part (R3), holding the attack side at EV-MLKEM-020's committed
    figures and its stated memory model, and report a 4 x 3 signed table with the sign of the
    verdict per cell and the reading that produced it.
    STAGE 4, THE LEVERAGE STATEMENT. For each cell, multiply the movement in the reference by
    EV-MLKEM-020's own published sensitivity (one bit of cutoff error moves c* by 0.0113 / 0.0076
    / 0.0055) and report the induced movement in c*, so the result lands in the same units the
    committed record uses rather than in a new one.
  novelty_status: unverified
  novelty_screen:
    method: >-
      Read in full this session: RQ-MLKEM-003; the 28-title prior-art inventory for this RQ;
      IDEA-20260821-472aa2 (lines 1-681); IDEA-20260828-5b7795; IDEA-20260816-725f05 (head);
      IDEA-20260816-bd7f26 (head); IDEA-20260816-08eda1 (head); EV-MLKEM-020 lines 388-467 and
      595-634 plus a targeted grep of the whole file for 143 / cutoff / 0.2075 / 0.292.
      Greps: `question_id: RQ-MLKEM-003` over ledger/proposals (28 files, matching the supplied
      inventory exactly); `AES key search|key-search|Grassl|gates per AES|reference cost|NIST
      cutoff` over knowledge/ (hits: KN-OPEN-016, KN-LIT-110, KN-LIT-706, KN-LIT-5969).
      Web this session: WebSearch on the NIST category gate-count derivation; WebFetch of
      https://groups.google.com/a/list.nist.gov/g/pqc-forum/c/GR3plWpSV4U/m/NajnbRmxBQAJ
      (succeeded, one verbatim quote extracted); WebFetch of https://blog.cr.yp.to/20231023-
      clumping.html (FAILED, parse error - recorded as unfetched).
      The crypto-kb MCP retrieval index was not queried; no `kb` provenance appears here.
    results: >-
      Of the 28 filed RQ-MLKEM-003 proposals, all 28 titles concern the ATTACK side: core-SVP
      convention, sieve constants, dual-attack score geometry, module-structure discount, memory
      pricing, dimensions-for-free, the quantum resource triple, hybrid variants, the FO
      transform, and the Arora-Ge flank. None takes the reference computation as its object.
      IDEA-20260821-472aa2 is the nearest: it uses published depth-limited Grover key-search
      figures for AES-128 as NULL-K, a calibration answer key for a QUANTUM depth pipeline, and
      explicitly declines to quote them ("NO VALUES ARE QUOTED IN THIS RECORD because I have not
      read them"). That is the reference computation used as an instrument check on the attack
      side of a quantum audit; this record makes the reference computation the measured object of
      a classical one, which is a different role and a different resource.
      EV-MLKEM-020 itself names the gap: H8 checked_by "nobody", H11 "UNVERIFIABLE ... neither
      reviewer endorses the cutoffs", and an unresolved confound calling the cutoffs the
      denominator of the whole exercise. So the gap is not merely unfilled, it is pre-declared as
      debt in committed evidence.
    verdict: >-
      UNVERIFIED. Two of the four external claims this record leans on were not fetched from
      primary text (the Grassl-derived classical gate count; the cr.yp.to clumping post), and the
      external literature on amortised classical key search was not searched systematically.
      Claimed new RELATIVE TO THIS REPOSITORY: (i) the reference computation as a tracked,
      measured object rather than a constant, (ii) the symmetric-charge recomputation of c*,
      (iii) the four-metric signed table, and (iv) the observation that
      groups.google.com/a/list.nist.gov is reachable from this harness while csrc.nist.gov is not.
      Assembled from known parts: gate counting is standard, the T x M^c family is
      EV-MLKEM-020's, and the metrics are NIST's own.
  object_first_candidate:
    established_families_off_limits: >-
      Declared off-limits as the primary lens for this record: everything on the attack side -
      sieve cost constants (IDEA-20260807-8fbc86, -20260805-fc6361, -f7c912), dual-attack score
      geometry (IDEA-20260805-5a4409, -a102ec, -bb7668, IDEA-20260808-0eb075, IDEA-20260816-ba5bd8,
      -725f05), memory pricing of the sieve (IDEA-20260816-70e41d, -7bc28c, IDEA-20260821-46c09f),
      the module-structure discount (IDEA-20260816-b824af, -f4ce0b, -fdc8e8, -bd7f26),
      dimensions-for-free (IDEA-20260821-374af4), the oracle-call schedule (IDEA-20260821-41cd67)
      and the quantum resource triple (IDEA-20260821-472aa2). All of them are numerator work.
    tracked_object: >-
      The reference computation's cost coordinate pair (G, W) - G the amortised gate count per key
      tried in a declared basis and a declared search order, W the working set in bits of one
      search core - carried through exactly the same charging operation the attack side is carried
      through, T x M^c, and then through NIST's own alternative metrics (memory-access cap,
      depth cap, dollars).
    lossiness: >-
      LOSSY, and the discard is what makes it a cost object. The underlying state is a complete
      key-search machine: the cipher's algebraic structure, the key schedule's contents, the
      plaintext-ciphertext pair, the wiring, the clocking, the enumeration order. The projection
      retains two non-negative numbers. It discards the cipher entirely - AES and any other
      permutation with the same amortised gate count and working set are the same object here.
      NOT A CHANGE OF COORDINATES, and this is provable rather than assertable: two key-search
      circuits with identical (G, W) can differ in depth by unbounded factors and in whether they
      admit subtree amortisation at all, so the map is many-to-one and non-invertible.
      THE COMPATIBILITY CONDITION: the operation being modelled - a cost charge of the form
      T x M^c, or a memory-access cap, or a price per gate and per bit - is by construction a
      function of operation count and working set ALONE. It reads exactly the retained
      coordinates and nothing else, so the discarded structure is discarded compatibly and the
      retained pair propagates deterministically under composition (serial composition adds G,
      takes max of W; replication multiplies G, multiplies W).
    propagation: >-
      One step is one halving of the search space assigned to a core, or one increment of the
      amortisation depth t. Under an increment of t, G falls by the shared prefix work divided by
      2^t and W rises by the size of the retained prefix state - a deterministic, countable
      exchange. The cheap internal falsifier: at t = 0 the pipeline must reproduce the
      per-trial circuit gate count of the published AES circuit in the same basis, to the digit.
      If it does not, the counter is wrong and no amortised number is reportable.
    survival_score: >-
      Survives the whole reference computation exactly, because the reference computation is
      finite, public, and has no probabilistic component - this is the object's main advantage
      over anything on the attack side. It dissolves at the boundary between a gate count and a
      buildable machine (routing, clock distribution, yield), and at the boundary where NIST's
      own definition is a policy choice rather than a physical quantity. Reported as: the object
      answers "what does the reference cost under metric X" exactly, and answers "which metric
      NIST intends" not at all.
  null_object_control: >-
    NULL-R, THE REPRODUCTION NULL AND THE LOAD-BEARING ONE. Run the identical counting pipeline
    at amortisation depth t = 0 against a published AES gate count in the same declared basis.
    The pipeline must reproduce it within the source's own stated slack. OBJECT REMOVED: the
    amortisation and the metric transformation. OBJECT PRESERVED: the counting. CAN IT FAIL: yes,
    and if it does, every number this record produces is uninterpretable and the batch reports
    exactly that instead.
    NULL-Z, THE ZERO-CHARGE NULL. At c = 0 the symmetric-charge recomputation must return
    EV-MLKEM-020's committed c* inputs and the committed undercuts 2.800527 / 6.041285 /
    1.276377 exactly. Any deviation means the arithmetic harness differs from the committed one
    and nothing downstream is comparable.
    NULL-P, THE POLYNOMIAL-REFERENCE NULL. Replace the reference by an artificial one with a
    deliberately enormous working set (W set to the sieve's own 2^(0.2075 n)). The symmetric
    charge must then move c* to zero or beyond. If it does not, the charge is not being applied
    to the reference at all and Stage 1 is void.
    FORCED VALUES DECLARED BEFORE ANY MEASUREMENT, so they are not later reported as findings:
    (1) a symmetric memory charge can only RAISE the reference and hence only LOWER c*;
    (2) amortisation across a key subtree can only LOWER or leave unchanged the amortised gates
    per key, never raise it; (3) at c = 0 and metric "bit operations" the pipeline must return the
    committed numbers unchanged. The informative content is confined to magnitudes and to the
    metric arm, and the report must state that restriction.
  discriminated_from:
    - >-
      IDEA-20260821-472aa2 uses published depth-limited Grover AES-128 figures as NULL-K, an
      answer key for a quantum depth-accounting pipeline, and quotes no values. That record's
      object is the coherent depth of a quantum sieve; this record's object is the classical
      reference computation's amortised gate count and working set. Different resource, different
      side of the comparison, different metric, and 472aa2 makes no claim about the classical
      cutoffs it inherits.
    - >-
      IDEA-20260816-70e41d and IDEA-20260816-7bc28c price the SIEVE's memory by size and by access
      locality. Both are numerator work and both leave the denominator at c = 0. This record
      charges the denominator, which is precisely the assumption (H8) those records inherit
      without checking.
    - >-
      IDEA-20260805-522b48's identifiability audit argues that every ML-KEM security number this
      campaign produced is a statement about the instrument. This record agrees and adds the half
      that audit did not cover: the instrument on the reference side, which is not the lattice
      estimator at all but a gate count and a metric choice.
    - >-
      EV-MLKEM-020's own sensitivity family sweeps the sieve-memory exponent, the memory unit, the
      charge model and the sieve dimension - four numerator knobs. It sweeps the cutoff not at all;
      it states its sensitivity to a one-bit cutoff error and stops. This record supplies the
      sweep that sensitivity statement calls for.
