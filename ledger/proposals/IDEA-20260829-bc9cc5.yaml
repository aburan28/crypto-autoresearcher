  minimal_test:
    design: >-
      Stage 1 alone is the minimal discriminator and needs no new measurement: recompute
      EV-MLKEM-020's c* under a symmetric T x M^c charge using a working-set figure for the
      reference core taken from a declared, cited implementation, and recompute the three margins
      under each of the four declared metrics with the reference held at its inherited value.
      Closed-form arithmetic on committed numbers; minutes of compute. Stage 2 (the gate count and
      the amortisation sweep) is the follow-on and is the only part needing an implementation.
    controls:
      - NULL-Z, the zero-charge null - the pipeline must return the committed undercuts exactly at c = 0.
      - NULL-P, the polynomial-reference null - an artificial reference with sieve-sized working set must drive c* to zero or beyond.
      - NULL-R, the reproduction null - at t = 0 the gate counter must reproduce a published AES gate count in the declared basis.
      - The time-memory-tradeoff nearby object, charged under every metric, to confirm the metric arm can distinguish working sets.
