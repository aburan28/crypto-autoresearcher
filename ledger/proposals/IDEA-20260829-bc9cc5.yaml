  falsification_conditions:
    - >-
      If every reading in part (B) moves the reference by less than 0.5 bits at all three
      categories, and no cell of the 4 x 3 table changes sign, then the denominator is stable, H8
      and H11 are closed with a number, and this record's central claim is REFUTED. That is a
