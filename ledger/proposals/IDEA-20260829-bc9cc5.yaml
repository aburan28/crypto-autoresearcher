  assumptions:
    - >-
      The reference computation NIST's categories name is exhaustive key search on AES with the
      stated key length, and its cost is |keyspace| x (cost per key tried) under whichever metric
      is declared. If a primary source shows NIST intends something else, the record says so and
      stops rather than salvaging.
    - >-
      A gate count is only meaningful with a declared basis. Every count in this record carries its
      basis, and no count in one basis is compared with a count in another.
    - >-
      EV-MLKEM-020's attack-side figures are taken as given and are NOT recomputed here. This
      record moves only the denominator, so that any movement it reports is attributable.
    - >-
      Subtree amortisation of a key search is a counting question about a specific enumeration
      order, not a cryptanalytic advance. If the measured amortisation is zero for AES's key
      schedule, that is the answer and the R2 arm closes at zero.
    - >-
      Primary NIST text may remain unreachable. In that case R1 and R2 are still measurable (they
      are properties of a circuit, not of a document) while the comparison target 143 / 207 / 272
      stays conditional and is labelled so in every cell.
  proof_search_map:
    bottleneck: >-
      The unexamined substitution of a fixed constant (143 / 207 / 272) for a cost-model-dependent
      quantity R(metric, circuit, search order) at the exact point where the sign of a category
      verdict is taken. Removing that substitution is what changes the conclusion, and it is
      performed implicitly by every margin figure this program holds.
    baseline_embedding:
      parameter_slice: >-
        Metric "bit operations", amortisation depth t = 0, charge exponent c = 0 on the reference.
        That configuration must reproduce EV-MLKEM-020's committed undercuts 2.800527 / 6.041285 /
        1.276377 exactly. It is a runnable configuration of the pipeline, not a limit argument.
      reproduction_check: >-
        Frozen fixture: the three committed log2(rop) values and the three cutoffs, differenced by
        the new harness, must equal the committed undercuts to all printed digits. Separately, at
        t = 0 the gate counter must reproduce a published AES circuit's count in the same basis.
    observation_collision:
      observable: >-
        The signed margin in bits, m = log2(attack cost) - log2(reference cost), per parameter set.
      distinct_preimage_search: >-
        COLLISION FOUND AND IT IS THE POINT OF THE RECORD. The same m arises from (a) an attack
        that is 2 bits cheaper than modelled against an unchanged reference, and (b) an unchanged
        attack against a reference that is 2 bits more expensive than modelled. This program's
        twenty-eight proposals all search preimage class (a); nothing distinguishes the two from m
        alone. The separating condition is to report the PAIR (attack cost, reference cost) with
        its metric, never the difference alone, and this record's deliverable is that pair.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Carry the pair (cost, working set) with a declared metric on BOTH sides of the comparison
          instead of a single scalar difference under an unstated metric. The stronger state is
          what survives a change of metric; the difference does not.
        predicted_gain: >-
          Makes the metric question decidable at all. Measurable output: a 4 x 3 signed table of
          margins, and the induced movement in EV-MLKEM-020's c* via its own published sensitivity
          coefficients 0.0113 / 0.0076 / 0.0055 per bit.
      - transform: representation_reduction
        proposed_object: >-
          Restate the category verdict as an inequality between two costs computed in ONE declared
          metric, with explicit encoding, soundness and cost-loss obligations for the metric
          conversion, rather than as a comparison of a modelled exponent with an inherited constant.
        predicted_gain: A conditional verdict with a checkable side condition (the metric).
    quantifier_order: >-
      FOR EACH parameter set p in {512, 768, 1024} and FOR EACH metric M in {bit operations,
      bit operations under a memory-access cap, depth-limited cost, dollars}, THERE EXISTS a
      reference cost R(p, M) computed by the Stage 2-3 pipeline, and the verdict is
      sign(A(p, M) - R(p, M)). THE DISCRIMINATING CLAIM, which is the one that can fail: THERE
      EXISTS a pair (p, M) for which |R(p, M) - cutoff(p)| >= 1.276377 bits. NOT claimed: anything
      uniform over metrics, anything about metrics NIST has not declared, anything about which
      metric is correct, and nothing about parameter sets other than the three.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under metric M, with the gate basis B and search order O declared, the reference
        computation for category k costs R bits, against the inherited constant C, and the
        resulting margin at ML-KEM-p is m bits, moving EV-MLKEM-020's c* by delta." Nothing about
        whether ML-KEM is secure, nothing about which metric NIST intends, nothing about
        buildability, and nothing about attacks.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion fails is a reference computation with the
        SAME gate count but a large working set - for example a time-memory-tradeoff key search
        with precomputed tables. The method must charge it differently from the memoryless search
        under a memory-priced metric and identically under a pure gate metric. If the pipeline
        treats the two identically under every metric, it is reading gate count only and has not
        identified the load-bearing structure. This control is explicitly constructible and is in
        the required-metrics list.
    proof_obligations:
      - claim: At c = 0 and metric "bit operations" the pipeline reproduces the committed undercuts exactly.
        responsibility: baseline
      - claim: At amortisation depth t = 0 the gate counter reproduces a published AES gate count in the same basis.
        responsibility: correctness
      - claim: NULL-P (an artificial reference with sieve-sized working set) drives c* to zero or beyond.
        responsibility: soundness
      - claim: The tradeoff-search nearby object is charged differently from the memoryless search under a memory-priced metric.
        responsibility: strictness
      - claim: Every gate count carries its basis and no cross-basis comparison is made.
        responsibility: interface
      - claim: No claim is made about which metric NIST intends, or about FIPS 203's text.
        responsibility: scope
