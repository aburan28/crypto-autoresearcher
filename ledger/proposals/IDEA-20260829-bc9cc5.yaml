  confounders:
    - >-
      Basis mismatch. A count in {AND, XOR, NOT} is not a count in {NAND} or in {Toffoli, CNOT},
      and the inherited constant's basis is exactly what Stage 0 may fail to source. A basis
      difference alone can move a count by more than a bit, which would masquerade as a finding.
    - >-
      NIST's constant may already include a margin or a rounding intended as conservative. A
      measured reference below the constant may therefore be evidence of NIST's deliberate
      conservatism rather than of an error, and the record cannot distinguish these without
      primary text stating the intent - which EV-MLKEM-020's H6 already records as never stated.
    - >-
      The four metrics are not independent: a memory-access cap and a dollar price both charge
      memory, so cells will correlate and the count of sign changes overstates the number of
      independent findings. Report the correlation structure, not just the count.
    - >-
      The attack side's memory figure in EV-MLKEM-020 is itself recorded as "not supplied by the
      attack's own instrument path" and assembled from a literal in an uncalled function. Any
      metric arm that charges memory on both sides inherits that defect on the numerator side, and
      the record must carry it forward rather than treat the numerator as solid.
  interpretation_limits:
    - >-
      This measures a REFERENCE COMPUTATION, not ML-KEM. A finding that the reference is cheaper
      than the inherited constant is a statement about a gate count and a metric, not a statement
      that ML-KEM is insecure, and not a claim about any category assignment NIST has made.
    - >-
      Primary FIPS 203 and NIST call text remain unread by this program. Every comparison against
      143 / 207 / 272 is conditional on H11's inherited values, exactly as EV-MLKEM-020 records.
    - >-
      Claim tier: toy-tier under docs/claims-and-verification.md, because no certified instance at
      standardized scale exists and none is produced here. The reference-side counts are exact for
      the circuit counted and carry no extrapolation, which is the one place this record is
      stronger than the numerator work it complements.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The amortised cost per key tried in an exhaustive AES key search enumerated in subtree
        order is G(t) = G_0 - S(t)/2^t + O(1), where G_0 is the per-trial circuit gate count in
        the declared basis, t is the number of key bits held fixed across a subtree, and S(t) is
        the gate count of the prefix computation (key-schedule rounds and cipher rounds) that
        depends only on the fixed bits. G(t) is non-increasing in t and bounded below by the gate
        count of the suffix computation.
      rigorous_support: >-
        The inequality G(t) <= G_0 is rigorous and elementary (shared work is computed once per
        subtree, not once per key), and it imitates the standard amortisation accounting used for
        exhaustive search over structured key spaces. What is NOT rigorous is the SIZE of S(t) for
        AES's key schedule, which is a property of the schedule's diffusion and must be counted,
        not assumed - AES-128's schedule mixes the whole key quickly, so S(t) may be near zero and
        the arm may close at zero. That possibility is stated up front, not hidden.
      validation_plan: >-
        Sample: instrument a bitsliced AES-128 key-search core and count gates in the declared
        basis at t = 0, 8, 16, 24, 32, over at least 2^16 keys per t, on the actual enumeration
        order used. Compare the measured G(t) against the closed form above by fitting S(t) and
        checking monotonicity. Tail check: at t equal to the full key length, G(t) must collapse
        to the suffix-only count, a value computable independently by counting the suffix circuit
        directly - a forced value the fit must hit. Transfer assumption, stated explicitly: the
        measured G(t) is a property of the counted implementation and basis, and transfers to
        NIST's inherited constant only if that constant's circuit and basis are identified in
        Stage 0. If Stage 0 fails, the arm reports G(t) for the counted circuit and makes no
        comparison.
    - id: H2
      statement: >-
        The working set of one reference key-search core is W_ref = O(polylog) in the key length
        and independent of the search space size, so that under a charge T x M^c the reference is
        multiplied by W_ref^c while the attack is multiplied by (n 2^(0.2075 n))^c, and the
        induced shift in the critical exponent c* is c* x log2(W_ref) / log2(M_sieve) to first
        order.
      rigorous_support: >-
        The first clause is a structural fact about a memoryless exhaustive search (each core
        holds one key, one state, one round-key window) and is verifiable by counting registers,
        which is why it is presented as a measurement rather than an assumption. The first-order
        shift formula is exact algebra on EV-MLKEM-020's own charge family. What is heuristic is
        the claim that the reference machine as NIST costs it is memoryless rather than
        table-based; EV-MLKEM-020's H8 records the same argument as "sound in shape and unverified
        against the reference computation".
      validation_plan: >-
        Sample: count the live registers of the counted core at each cycle and take the maximum,
        for all three key lengths; report W_ref in bits with its counting convention. Compare
        against the nearby-object control - a table-based tradeoff key search - whose W is by
        construction large, and confirm the charge distinguishes them. Tail check: setting
        W_ref := M_sieve must drive the computed c* to zero (NULL-P), a forced value the
        arithmetic must hit exactly.
  target_complexity:
    time_exponent: >-
      No attack is proposed, so no attack exponent is claimed. The quantity this record moves is
      the REFERENCE exponent: 143 / 207 / 272 bits of "gate", proposed to be re-derived as
      log2(|keyspace|) + log2(amortised gates per key) under a declared basis and metric.
    memory_exponent: >-
      Reference side: W_ref bits per core, claimed polylogarithmic and to be measured (H2).
      Attack side: unchanged from EV-MLKEM-020's model, n x 2^(0.2075 n) elements of Z_q, whose
      own o(n) term that record states is unbounded.
    best_known: >-
      MODEL-RELATIVE, AND THE LABEL IS THE POINT. The current best-known statement in this
      program is EV-MLKEM-020's primal_bdd under RC.MATZOV at 140.1994731076207 /
      200.9587149140538 / 270.7236234535225 log2 rop versus inherited cutoffs 143 / 207 / 272.
      BOTH sides are modelled: the attack side by RC.MATZOV (a cost model whose gate counts
      KN-LIT-122 records as already revised downward once), the reference side by an inherited
      constant that EV-MLKEM-020 marks UNVERIFIABLE and that no reviewer endorsed. Neither side is
      a run. "ML-KEM-1024 undercuts by 1.276377 bits" is therefore a statement inside a pair of
      cost models, not a measurement.
    hidden_overhead: >-
      On the reference side, everything below the gate: routing, clocking, error rates, yield, and
      the conversion from logical gates to any physical or monetary unit. NIST's own thread
      converts through bitcoin-mining hardware pricing, which embeds a market and a date. On the
      attack side, the o(n) in 2^(0.2075 n + o(n)) is unbounded by anything this program holds.
    tradeoff_note: >-
      The comparison is memory-asymmetric by construction: the reference is memoryless and
      perfectly parallel (embarrassingly so - 2^128 independent cores, no communication), while
      the sieve needs 2^(0.2075 n) randomly accessed cells and does not parallelise for free. Any
      metric that charges memory or memory access therefore moves the comparison in ML-KEM's
      favour, and any metric that charges only gates ignores the single largest structural
      difference between the two machines. This record's deliverable is exactly that tradeoff
      stated per metric rather than assumed away.
  dominated_by: >-
    n/a (no attack, algorithm, or complexity result claimed). Pareto check performed against every
    row this program holds on the relevant frontier: EV-MLKEM-020's eighteen-cell attack family
    (RC.MATZOV / RC.ABLR21 x primal_bdd / primal_usvp / dual_hybrid x three parameter sets),
