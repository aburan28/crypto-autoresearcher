idea:
  id: IDEA-20260823-835868
  question_id: RQ-ECDLP-160d89
  added: '2026-08-23'
  title: Joinable partial-verifier certificate for source-labelled four-list ECDLP
  class: mechanism
  claim: >-
    The decision-relevant gate for a Wagner-style prime-order ECDLP route is
    not a scalar pruning ratio. It is a source-resolved, output-sensitive
    joinability certificate. For four lists of length L=N^(1/3), a valid
    certificate must simultaneously show: qualifying pairs are enumerable in
    O(L+output), each filtered pair list has Theta(L) elements, the two
    conditioned pair-sum distributions have collision probability
    Theta(N^(-2/3)), the final zero relation succeeds with constant
    probability, source coefficients replay without inversion, and all costs
    fit O(L polylog N) time and memory. Equal pruning without these conditions
    does not identify attack cost.
  mechanism: >-
    Split four source-labelled leaf lists into two pair joins. A filter of
    density 1/L turns L^2 possible pairs into L survivors, but only if it is
    joinable can those survivors be found without L^2 work. Constant final
    success further requires the two survivor distributions to collide at
    rate 1/L^2=N^(-2/3), rather than the ambient 1/N. The certificate records
    both requirements separately and carries source coefficients through the
    final exact point check. This exposes the exact place where an approximate
    coordinate projection must do real work.
  novelty_status: unverified
  novelty_screen:
    method: >-
      Direct reads of the current goal, BATCH-fb7af9 disposition, prior Wagner
      proposal IDEA-20260817-1e0111, paired projection proposal
      IDEA-20260817-84755b, rejected preallocation T07 source join, and related
      propagation records. Primary Wagner and generalized-birthday papers were
      retrieved directly. The local derived KB reported zero indexed points,
      so absence searches were unavailable and no novelty inference is made.
    result: >-
      Wagner, source-labelled joins, exact-propagation rigidity, and pruning
      measurements are prior internal or published material. The only proposed
      delta is the explicit sufficient certificate plus the observation
      collision showing that pruning alone cannot identify end-to-end cost.
    verdict: UNVERIFIED; no priority or literature-exhaustiveness claim.
  explicit_successor_of:
    - IDEA-20260817-1e0111
    - IDEA-20260817-84755b
    - ideas/rejected/preallocation/20260724-a_T07_wagner_generalized_birthday_source_join_preid_duplicate.md
  correction_to_prior_formulation: >-
    The earlier cost interpolation in terms of pruning ratio r is insufficient.
    A post-hoc predicate and a joinable relation can share r while differing by
    an exponent in pair enumeration or retries. This record supersedes only
    the claim that the lane reduces to one measurable number; it does not edit
    or erase the earlier record.
  certificate_conditions:
    - id: JPR-C1-SOURCE
      condition: >-
        Every leaf stores (a,b,R=aP+bQ); every pair stores summed coefficients;
        the final point identity is independently replayed and the denominator
        coefficient is nonzero modulo N.
    - id: JPR-C2-DECOMPOSABLE-KEY
      condition: >-
        A public key or bounded auxiliary state is computable on each leaf so
        qualifying pairs are located by sorting, hashing, or bounded bucket
        joins, not by evaluating a predicate on all L squared sums.
    - id: JPR-C3-OUTPUT-SENSITIVE
      condition: >-
        Expected and high-probability work per pair join is O(L polylog N plus
        output), peak memory O(L polylog N), and output size Theta(L).
    - id: JPR-C4-CONDITIONAL-COLLISION
      condition: >-
        The two filtered pair-sum distributions have cross-collision
        probability Theta(N^(-2/3)) with a stated Renyi-2 or second-moment
        bound, not merely a marginal survival rate.
    - id: JPR-C5-CORRELATION-CONTROL
      condition: >-
        Dependence created by reused keys, coefficients, negation, and the
        target Q is charged. A lower bound gives constant probability of at
        least one exact zero collision.
    - id: JPR-C6-VERIFICATION
      condition: >-
        Candidate point equalities and recovered scalars are independently
        verified; zero denominators, duplicate sources, and replay failures are
        counted as rejects rather than successes.
    - id: JPR-C7-FULL-COST
      condition: >-
        List construction, key evaluation, sorting/hashing, bucket skew,
        output processing, exact verification, retries, and memory are all
        included. The resulting exponent must be below one half in total work.
  observation_collision:
    observable: Pair survival rate 1/L, previously summarized as pruning ratio r.
    preimage_a: >-
      XOR group F_2^(3m), L=2^m, prefix-matching join. It is enumerable in
      O(L+output), emits L pairs, confines sums to a kernel of size 2^(2m), and
      gives collision probability 2^(-2m).
    preimage_b: >-
      Independent per-pair Bernoulli survival 1/L in a prime cyclic group. It
      emits L pairs only after L^2 predicate evaluations and leaves sums
      uniform, with collision probability 1/N.
    preimage_c: >-
      A post-hoc random hash subset of group points of density 1/L. It has the
      desired support size and collision probability but still normally needs
      L^2 pair-sum evaluations to enumerate.
    conclusion: >-
      The same pruning observable maps to N^(1/3), N^(2/3), or worse total
      cost. Pruning ratio alone is not a sufficient statistic for the attack.
  predictions:
    - A valid exact quotient positive control passes all seven conditions.
    - Random coordinate hashes fail C2 or C4 even when their survivor count passes.
    - Any surviving elliptic-curve candidate must exhibit a non-generic, testable join-key structure.
  minimal_test:
    design: >-
      Static symbolic audit first. For each proposed relation, fill a seven-row
      certificate with explicit asymptotic bounds and run the three
      observation-collision controls. No implementation is authorized in this
      batch. Only a later approved successor may benchmark candidates that
      survive every static row.
    controls:
      - XOR prefix projection as a nearby positive control.
      - Independent per-pair coin as a same-pruning/no-concentration null.
      - Post-hoc point hash as a same-pruning/concentration-but-no-join null.
      - Full pair table as a proves-too-much cost control.
      - Pollard rho and BSGS Pareto rows.
    required_metrics:
      - join_enumeration_operation_exponent
      - filtered_output_exponent
      - conditioned_cross_collision_exponent
      - per_attempt_success_exponent
      - retry_exponent
      - total_time_exponent
      - peak_memory_exponent
      - source_replay_success_and_reject_conditions
  falsification_conditions:
    - A condition is redundant yet removing it cannot produce a counterexample.
    - The XOR control fails the certificate.
    - Either prime cyclic null passes all seven conditions as N^(1/3).
    - The cost theorem omits an L squared enumeration or N^(1/3) retry term.
    - A final relation requires solving an additional DLP to recover its sources.
  proof_search_map:
    baseline_reproduction: >-
      Re-derive four-list L=N^(1/3) Wagner accounting and the no-concentration
      branch with per-attempt success N^(-1/3), retries N^(1/3), total
      N^(2/3), plus BSGS/rho controls.
    observation_collision_search: >-
      Hold survival 1/L fixed across XOR prefix, independent pair coin, and
      post-hoc point hash while varying enumeration and collision entropy.
    quantifier_order: >-
      There exists one public, pre-data relation family and constants c,C such
      that for all sufficiently large prime orders N in the declared curve
      family, every JPR-C1..C7 bound holds over predeclared list randomness.
      No curve, projection, bucket width, or decoder is selected after outputs.
    method_ceiling: >-
      Without C2 one can certify only a post-hoc filter with Omega(L^2) work.
      Without C4 one can certify only ambient collision and N^(1/3) retries.
      Exact nontrivial quotient structure is unavailable in a prime-order
      group; this does not prove all approximate relations fail.
    nearby_object_control: >-
      XOR truncation must pass because a genuine quotient exists. Random
      prime-cyclic predicates must fail C2 or C4. A method that passes all
      objects proves too much.
  citations:
    - ref: https://www.iacr.org/archive/crypto2002/24420288/24420288.pdf
      provenance: retrieved
      claim: Wagner generalized-birthday k-tree and k=4 N^(1/3) baseline.
      verified_by: coordinator TASK-20260823-14f80f
    - ref: https://eprint.iacr.org/2016/312
      provenance: retrieved
      claim: Generalized-birthday k-tree refinements and time-memory tradeoff context.
      verified_by: coordinator TASK-20260823-14f80f
    - ref: https://arxiv.org/abs/1404.2226
      provenance: retrieved
      claim: Coordinate-bit extractor context for elliptic-curve sums; not a joinability theorem.
      verified_by: coordinator TASK-20260823-14f80f
    - ref: https://arxiv.org/abs/1302.4210
      provenance: retrieved
      claim: Bilinear exponential-sum context for elliptic-curve coordinates; not source-resolved output-sensitive enumeration.
      verified_by: coordinator TASK-20260823-14f80f
    - ref: IDEA-20260817-1e0111
      provenance: internal
      claim: Prior pruning-ratio route and exact-propagation boundary.
      verified_by: coordinator TASK-20260823-14f80f
  dominated_by: >-
    As a present attack, Pollard rho dominates because no elliptic-curve
    relation has passed the certificate. In the positive conditional branch,
    N^(1/3) time and N^(1/3) memory is not dominated by rho (less time, more
    memory) or BSGS (less time and memory), but remains conditional on all
    seven rows. CM calibration and fixed Fourier moments do not dominate this
    static gate because neither currently supplies an end-to-end exponent path.
  sota_delta: >-
    Current realized attack delta: 0. Conditional positive delta versus rho:
    time exponent 1/3-1/2=-1/6, memory exponent 1/3-0=+1/3. Versus BSGS:
    time and memory exponent deltas both -1/6. Static methodological delta:
    separates two previously conflated costs and supplies a falsifiable gate;
    it is not cryptanalytic evidence.
  interpretation_limits:
    - No elliptic-curve predicate is shown to satisfy the certificate.
    - Exact quotient rigidity does not imply an impossibility for every approximate statistic.
    - Source-labelled leaves avoid post-hoc source inversion but do not solve joinability.
    - A static PASS would authorize only a later stronger review, not implementation.
  estimated_cost:
    implementation: none_in_this_batch
    experiment: zero_runs
    review: two_independent_xhigh_static_reviews
