    verdict: >-
      UNVERIFIED. External novelty unresolvable here (R3, symmetric); internally the battery's
      four classes appear unowned, and each maps to a named standing debt rather than to a
      prior experiment.

  assumptions:
    - >-
      [fact, committed] The standing null readings (EV-AES-e4c091), the comparator seat
      readings (14-19 at 2^30), the SipRound absence (EV-AES-4ba350), the exclusion's expected
      trivial rate 2^-32 at |S|=1 (BATCH-002 section 3), the alignment premise pointer
      (BATCH-002 section 2).
    - >-
      [dependency] B1's fixtures come from IDEA-20260901-ec54fe's census; F4 states the
      fallbacks if the census supplies no null cells or fails to land (structure-destroyed
      cell on the affine cipher; or B1 deferred, never faked).
    - >-
      [implementation] The archived SipRound specification is sufficient to re-implement the
      substitute from spec alone, or the archived source is reusable verbatim with hash parity
      (BATCH-7939d0 discipline); the executor verifies which before Stage 0 closes.
    - >-
      [scope] Toy tier; the yoyo-probe pipeline only; the single-machine scope of the campaign
      (the battery does not defend against machine-level artifacts, stated in confounders); no
      full-round or deployed-AES claim; no mechanism claim in any branch.

  predictions:

  predictions:
    - id: PR-1
      metric: >-
        B1 - hit counts of >= 2 census-null cells on the affine cipher, matched exposure
      direction: same_as_null
      minimum_effect: >-
        Each count inside the null band (<=12 at 2^32; Garwood 95% CI contains 1.0 rate ratio
        at 2^30). One excess is the artifact indictment (GATE failure, escalation).
    - id: PR-2
      metric: >-
        B2 - hit counts of the three misaligned geometries on AES r=5 at 2^30
      direction: same_as_null
      minimum_effect: >-
        All three inside the null band at matched exposure. Prior, disclosed: P(all three null)
        ~ 0.75 - the alignment premise has one historical pointer and the census (where it
        applies) predicts null, but a geometry-conjugated probe on a structured cipher is
        unmeasured territory and a SIGNAL on (iii) specifically would be the most interesting
        failure.
    - id: PR-3
      metric: >-
        B3 - fresh-lineage SipRound substitute count and fresh-lineage AES comparator count at
        matched 2^30
      direction: different
      minimum_effect: >-
        Substitute at the null (OUTCOME-A' per the frozen comparator: Garwood CI contains the
        null rate ratio; exact conditional-binomial p reported), comparator seat at the
        committed excess (14-19 band). BOTH on the fresh lineage, or the battery does not test
        what it claims.
    - id: PR-4
      metric: >-
        B4 - signed W>=1 count delta between exclusion-disabled and exclusion-enabled builds,
        on one AES r=5 arm and one null arm
      direction: different
      minimum_effect: >-
        Delta equals the identified trivial-trial count exactly, trial-by-trial, on both arms
        (the trivial trials force W=3, so each contributes exactly one W>=1 event when
        included). Any other delta indicts the exclusion implementation.
    - id: PR-5
      metric: >-
        The ideal-permutation anchor seat at the battery's exposure
      direction: same_as_null
      minimum_effect: >-
        Re-measured null reading consistent with EV-AES-e4c091 (R_null inside the committed
        CI), so the battery's own baseline is seated in the same block.

  minimal_test: >-
    CHEAPEST FALSIFYING SUBSET (one producer slot, in ascending cost): B4 first (two small arms
    at 2^28 suffice for the exact-delta check - the trivial rate 2^-32 gives ~1 trivial trial
    per 2^32, so the audit uses the campaign's standard exposure and the delta is checked
    trial-by-trial rather than statistically; at 2^28 the prediction is zero-or-one trivial
    trials and the delta must match exactly). Then B2(i) shifted diagonals (one 2^30 arm).
    Then B1 (two 2^30 affine arms - minutes each). B3 is the most expensive arm (a full
    fresh-lineage implementation plus matched 2^30 pair) and is sequenced last because it is
    also the one whose failure most damages the campaign's exclusion record rather than this
    batch's mechanism readings. FULL BATTERY: two-to-three producer slots.
  preregistered_decision_rule: >-
    Committed before any arm: ALL PASS -> record the defence dossier enumerating exactly which
    downstream readings it unblocks (ec54fe's census verification arms, 69912d's table,
    bcb117's ramp), and the V-804-1 sibling-null discipline is discharged for the named cells
    for the first time. ANY FAIL -> the failing battery's indictment reading fires: B1/B2
    failure -> pipeline manufactures excess on known-structured/known-null objects -> ALL
    mechanism readings of this batch blocked, independent review convened, and the five
    exclusion records' interpretability is flagged in the same sentence (they rest on the same
    pipeline); B3 failure -> the substitute absences are lineage-suspect -> the class-exclusion
    conclusion of EV-AES-5478a0/4ba350 is flagged pending re-measurement on a repaired lineage
    (no status change by this record - flagging only, the Coordinator owns status); B4 failure
    -> exclusion defect -> repair, then re-run the affected arms of whichever ideas already
    ran. Budget halts are resource_exhaustion, never passes.

  test_boundary: >-
    Toy tier; the pinned probe family and the frozen comparator; r=5 for B2/B4, the census's
    named cells for B1, the archived SipRound specification for B3. The battery defends the
    pipeline for THIS batch's readings only - a pass does not generalize to future probe
    variants, other geometries beyond the tested set, or other instruments. NOTHING about
    full-round or deployed AES; no published-frontier comparison in either direction; no
    mechanism claim in any branch.

  falsification_conditions:
    - >-
      F1 (THE DESIGNED FALSIFIER - B1/B2 FAILURE). Any known-null cell reads excess on the
      affine cipher, or any misaligned geometry reads excess on AES. The pipeline manufactures
      excess; this record's claim (the battery passes) is falsified; the result is the batch's
      most valuable negative. Escalation: independent review before any further mechanism
      reading; dependent ideas blocked; the failure is recorded with the exact arm, count, CI
      and prediction, and is NEVER reclassified as evidence about the cipher (rule 5's spirit
      applied to instrument failures).
    - >-
      F2 (B3 FAILURE). The fresh-lineage substitute arm reads SIGNAL, or the fresh-lineage
      comparator seat fails to reproduce the committed excess. One of the two lineages is
      defective; the substitute absences are suspect; the record names which arm failed and
      flags the exclusion records' interpretability without changing their status.
    - >-
      F3 (B4 FAILURE). The exclusion-toggle delta differs from the identified trivial-trial
      count. The exclusion logic is wrong in at least one build; every arm in the campaign that
      relied on the exclusion is potentially miscounted at the ~2^-32 level; repair dispatched;
      recorded as an instrument defect with the signed delta and the trial-level audit trail.
    - >-
      F4 (CENSUS DEPENDENCY FAILURE). B1 cannot run because IDEA-20260901-ec54fe's census
      produces no NULL-predicted cell (every cell SKELETON-ALIVE). Then B1 falls back to the
      pre-registered alternative fixture: the structure-destroyed cell (A={0,1,2,3}, S={0}) on
      the AFFINE cipher, whose committed AES reading is ~null and whose affine prediction the
      census supplies (PR-5 of ec54fe). If the census itself fails to land (its F1), B1 is
      deferred, not faked - the battery runs B2-B4 and reports B1 as not-run-with-reason.
    - >-
      NOT A FALSIFICATION - budget halts (rule 5); a fresh-lineage implementation that cannot
      be built in budget (B3 reported as not-run, the battery's defence scoped accordingly);
      a SIGNAL on B2(iii) that survives the conjugated-census check is F1 and is additionally
      the most interesting scientific failure - recorded with full escalation.

  controls:
    - >-
      NULL OBJECT - the ideal-permutation anchor seat (PR-5), re-measured in-block at the
      battery's exposure, exactly as EV-AES-e4c091 established it.
    - >-
      KNOWN-FALSE CONTROLS (proves-too-much) - B1 cells (structured cipher, null predicted by
      derivation) and B2 objects (structured cipher, misaligned probe, null predicted) - the
      battery IS the known-false control for the other three ideas, stated as such.
    - >-
      POSITIVE CONTROLS IN-BLOCK - B1's anchor cell re-measured on the affine cipher
      (probability 1, must fire) and B3's comparator seat (excess, must fire): a battery whose
      positive seats do not fire has tested nothing, whatever the null seats read.
    - >-
      DECAY/ARTIFACT-TELL PARAMETER - B2's three misalignments are graded: (i) preserves
      diagonal structure with a shift, (ii) preserves it with roles swapped, (iii) destroys it
      by conjugation; a battery that shows excess growing across (i)->(iii) rather than
      vanishing is exhibiting the canonical artifact signature (signal where structure is
      destroyed) and is read as an indictment even if individual arms sit at the band edge.
    - >-
      PRE-REGISTRATION AS COMMITTED DIGEST - all cell choices, the conjugation pi, the SipRound
      specification reference, and the pass bands committed before the first arm (V-804-2).

  confounders:
    - >-
      CENSUS DEPENDENCY - B1's fixtures are only as good as the census derivation; the blocking
      anchor reproduction inside ec54fe is the prerequisite, and F4 states the fallback if the
      census supplies no null cells or fails to land.
    - >-
      FRESH-LINEAGE FIDELITY (B3) - a re-implementation from specification can drift from the
      archived oracle (the BATCH-7939d0 verbatim-source sha256 parity discipline is the model:
      where the archived source is reusable, reuse it verbatim with hash parity and build the
      fresh lineage only for the COUNTING and trial-generation path; where reuse is impossible,
      the drift is a named limitation of the battery arm, recorded).
    - >-
      THE EXCLUSION TOGGLE (B4) changes which trials enter the count; the trial-by-trial audit
      (trivial trials identifiable in raw receipts) is what makes the delta exact rather than
      statistical, and a receipt format that does not identify trivial trials makes B4 a new
      run rather than a toggle - verified before promising.
    - >-
      MISALIGNED-GEOMETRY ARMS (B2) reuse the trial stream and masks; only the PW/CW emission
      changes, and the probe's run-time table emission (BATCH-002 section 2) is recorded per
      arm so a table-emission bug cannot masquerade as a geometry effect.
    - >-
      SHARED MACHINE - the battery runs on the same machine as the mechanism arms; a
      machine-level defect (PRNG, threading) would affect both, and the battery does not claim
      to defend against machine-level artifacts - only pipeline-level ones. Stated, per the
      campaign's single-machine scope.

  interpretation_limits:
    - >-
      claim_tier toy. A pass is a defence dossier scoped to this batch's readings, never a
      certification of the pipeline in general; a failure is an instrument indictment, never
      evidence about AES (rule 5 applied to pipelines).
    - >-
      B3's pass extends the substitute exclusions' robustness along ONE axis (one substitute,
      one fresh counting lineage); the other three exclusions keep exactly the robustness their
      own records state.
    - >-
      NOTHING about full-round or deployed AES; no published-frontier comparison in either
      direction; no mechanism claim in any branch of any rule.
    - >-
      Timeouts, crashes and infrastructure failures are never negative mathematical evidence
      (rule 5), and in this record they are additionally never PASSes.

  heuristic_assumptions:
    - id: H1
      statement: >-
        PIPELINE SOUNDNESS UNDER KNOWN-ANSWER TESTS. The frozen pipeline returns null-band
        readings on every pre-registered known-null fixture (B1 cells, B2 geometries) and
        fires every pre-registered known-signal seat (affine anchor, AES comparator), at the
        battery's exposures.
      rigorous_support: >-
        RIGOROUS PART - the fixtures' predictions are exact (census derivations) or committed
        (comparator seats); nothing statistical is assumed about them. WHAT IS HEURISTIC is only
        that the pipeline, which passed weaker controls, passes these stronger ones - and the
        battery exists because that inference is exactly the one the inventor protocol forbids
        making without the measurement.
      validation_plan: >-
        The battery itself; H1 is the record's claim, not its premise.
      falsification_condition: >-
        F1/F2/F3, each with its committed indictment reading.
    - id: H2
      statement: >-
        LINEAGE-INDEPENDENCE OF THE ABSENCE. The SipRound substitute's absence of excess is a
        property of the construction, not of the producer lineage that first measured it.
      rigorous_support: >-
        RIGOROUS PART - none available; this is precisely what B3 measures. The supporting
        datum is that the construction's per-trial semantics (fresh key per trial, O(1) memory,
        direct evaluation) were validated line-by-line by EV-AES-4ba350's independent validator,
        which bounds but does not eliminate lineage risk on the counting path.
      validation_plan: >-
        B3 with verbatim-source reuse where possible and hash parity (BATCH-7939d0 discipline).
      falsification_condition: >-
        F2.

  obstruction:
    quantity: >-
      The campaign's undischarged instrument debt - V-804-1's sibling-null discipline, standing
      for three-plus batches (a control that discriminates without isolating is not an
      instrument for the property it names); BATCH-010 red team's shared-harness risk class,
      carried but never tested; the trivial-trial exclusion, verified by code reading only; the
      geometry-alignment premise, resting on one historical pointer.
    measured_value: >-
      Not a scalar - four named debts, each with a committed provenance: V-804-1 (named in
      RQ-AES-003 constraints and in EV-AES-048545's knowledge_promotion context; three-plus
      batches undischarged as of this writing); shared-harness risk (BATCH-010 red team
      synthesis, cited via IDEA-20260808-83b3ba's confounders); exclusion logic (BATCH-002
      section 3, code-verified by validator trace in EV-AES-e4c091's OBS-B9-2 lineage);
      alignment premise (BATCH-002 PREREGISTRATION section 2, one failed first-replication
      pointer). Units: named debts; error bars: not applicable - the obstruction is categorical,
      and the battery converts each debt into a pass/fail arm.
    runs_read_from: >-
      RQ-AES-003 constraints block, EV-AES-e4c091, EV-AES-048545, the BATCH-002 frozen probe
      preregistration, IDEA-20260808-83b3ba's confounders (citing BATCH-010).
    scope_claimed: >-
      The debts are claimed over the campaign's yoyo-probe pipeline only; nothing here speaks
      to other instruments in the repository.
    resource_check:
      examined: true
      reading: >-
        The same sensitivity that makes the debt live - the probe detects structure at 2^-30
        per-trial resolution, so any pipeline defect at that scale is indistinguishable from a
        signal - is the asset: that resolution is exactly what makes the known-null fixtures
        sharp (a null prediction at 2^-30 is a real prediction, not a vacuous one), and the
        census's null cells turn the debt into fixtures at zero cipher cost. The obstruction
        re-reads as the battery's design principle.

  target_complexity:
    time_exponent: >-
      No attack, no exponent. B4 two small arms; B1 two affine arms (minutes); B2 three 2^30
      arms; B3 one matched 2^30 pair plus implementation time. Total two-to-three producer
      slots at demonstrated rates.
    memory_exponent: >-
      O(1) per query on every arm (direct evaluation; the SipRound construction is O(1) by
      EV-AES-4ba350's validated property).
    best_known: >-
      The committed controls are the baseline (ideal-permutation null, structure-destroyed
      seats, r=10 decay seat); the battery is strictly stronger on the known-false axis and
      adds the lineage axis no committed control occupies.
    hidden_overhead: >-
      Disclosed: B3's fresh-lineage implementation is the battery's real cost and its fidelity
      limit; B1 inherits the census's derivation risk (F4 states the fallback); the battery
      does not defend against machine-level artifacts (single-machine scope, stated).
    tradeoff_note: >-
      No time-memory tradeoff in content. Evidential tradeoff: the cheapest subset (B4, B2(i),
      B1) buys the pipeline defence for the mechanism arms at one slot; B3 buys the exclusion
      records' lineage-robustness at one further slot and can be deferred without weakening the
      in-batch defence.

  dominated_by: >-
    CHECKED ROW BY ROW across time, memory and data/queries. ROW 1, EV-AES-e4c091's
    ideal-permutation null - structureless object, one geometry cell; dominated BY IT on the
