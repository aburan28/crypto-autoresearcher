    corpus_method: >-
      Read in full this session - EV-AES-e4c091 (the standing null and its U4 boundaries),
      EV-AES-5478a0, EV-AES-048545, DEC-20260804-73977c, DEC-20260901-bad1e5, DEC-20260805-af8565,
      RQ-AES-003 (the V-804-1 sibling-null debt in constraints), the BATCH-002 frozen probe
      preregistration (section 2 alignment premise, section 3 exclusion), IDEA-20260808-83b3ba
