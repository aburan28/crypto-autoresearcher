      control), and the goal-file checkpoint for BATCH-b41ba9. Titles screened for all 24
      GOAL-AES-003 proposals and every proposal mentioning 'yoyo' (19 records).
    results: >-
      No committed control occupies the known-false direction this battery occupies: the
      standing nulls are structureless objects (EV-AES-e4c091), the structure-destroyed seats
      are one mask mutation each, and no committed or proposed record runs the probe on a
      known-structured object in a derivation-named null cell, on misaligned geometries at
