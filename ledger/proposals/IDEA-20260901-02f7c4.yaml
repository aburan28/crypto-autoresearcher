idea:
  id: IDEA-20260901-02f7c4
  question_id: RQ-AES-003
  goal_id: GOAL-AES-003
  added: '2026-09-01'
  proposed_by: idea-generator
  status: proposed
  class: control

  title: >-
    THE INSTRUMENT THAT LOCALIZES THE EXCESS MUST FIRST BE SHOWN INCAPABLE OF MANUFACTURING IT -
    a proves-too-much battery run on objects whose answer is known in advance: census-null
    cells measured on the AFFINE cipher (a cipher known to produce maximal signal elsewhere
    under the same pipeline), misaligned and role-swapped probe geometries at exposure, a
    cross-lineage re-measurement of one substitute absence, and a signed-delta audit of the
    trivial-trial exclusion. Every mechanism reading produced by this batch's other three ideas
    is interpretable only if this battery passes; a failure here is the most valuable result
    the batch can produce, because it would indict the pipeline rather than the cipher.

  object: >-
    TRACKED OBJECT - THE PIPELINE'S ARTIFACT PROFILE. The pipeline is (probe geometry + trial
    stream + counting + trivial-trial exclusion + frozen comparator), and the battery measures
    whether it can produce excess where a prior derivation or a committed measurement says none
    exists. Four batteries:
      B1 KNOWN-NULL CELLS ON A KNOWN-STRUCTURED OBJECT - at least two cells from
      IDEA-20260901-ec54fe's census whose affine prediction is P(W>=1) = 2^-30 per trial,
      measured on the affine cipher (SBOX = id) at matched exposure. The affine cipher is the
      strongest available known-false object: the SAME pipeline produces probability-1 signal on
      the SAME cipher in the anchor cell, and the algebra says these cells carry none. An excess
      here is an artifact manufactured on a structured object - strictly stronger indictment
      than the ideal-permutation null, which is structureless.
      B2 MISALIGNED-GEOMETRY BATTERY - three pre-registered probe-geometry mutations on AES r=5
      at 2^30: (i) shifted diagonals (PW/CW offset by +1 mod 4 relative to the frozen tables);
      (ii) role-swapped tables (PW <-> CW); (iii) a pre-registered random byte-coordinate
      conjugation (a fixed permutation pi of the 16 state bytes, committed with digest; probe
      tables conjugated by pi, cipher unchanged). Predicted NULL for all three - for (i)/(ii)
      by the conjugated census where the census applies, for (iii) by generic full-rank of the
      conjugated word maps (stated as a derivation to be checked in Stage 0, not as a theorem).
      The historical precedent - BATCH-002 section 2 records that a first replication attempt
      read no signal by swapping which diagonals were used - is cited as a POINTER, never as a
      control; this battery runs the misalignment at exposure under the frozen comparator.
      B3 CROSS-LINEAGE SUBSTITUTE RE-MEASUREMENT - the cheapest substitute absence (the
      fresh-key-per-trial SipRound Feistel of EV-AES-4ba350: O(1) memory, direct evaluation)
      re-implemented FROM ITS ARCHIVED SPECIFICATION by a lineage sharing no code with the
      original producer, at matched 2^30, with a live r=5 AES comparator seat re-measured on
      the SAME fresh lineage. Purpose: all four substitute exclusions were each measured by
      their own instrument lineage, while the comparator seat is the campaign's standard
      lineage; a counting defect CONDITIONAL ON A SUBSTITUTE CODE PATH would manufacture
      absence exactly as a real mechanism difference would (BATCH-010 red team's shared-harness
      risk class, carried in IDEA-20260808-83b3ba's confounders, never discharged).
      B4 EXCLUSION-TOGGLE AUDIT - one AES r=5 arm and one null-object arm, each run in two
      builds: the standard build with the trivial-trial exclusion enabled, and a build with it
      deliberately disabled. Pre-registered exact prediction: disabling raises the W>=1 count by
      exactly the number of trivial trials (expected ~N x 2^-32 at |S|=1, each forcing W=3), so
      the signed delta verifies the exclusion logic arithmetically rather than by code reading
      alone.
    The retained quantity per battery arm is the frozen-comparator reading with its pre-registered
    pass/fail label - a defence dossier, not a mechanism claim.

  lossy_projection_test: >-
    The projection (pipeline version, lineage, build flags) -> (per-arm pass/fail against the
    pre-registered prediction) discards everything about the cipher's content; the battery's
    arms are chosen so that the cipher's contribution is KNOWN in advance (by derivation for
    B1/B2, by committed measurement for B3's expected absence, by arithmetic for B4). Genuinely
    lossy - the object under test is the pipeline, and the cipher is a fixture. COMPATIBILITY:
    the projection is used only under the frozen comparator and the campaign's null-band
    conventions; nothing here propagates to mechanism claims except through the explicit
    "battery passed" gate that the other three ideas' decision rules reference. THE SHARP EDGE:
    a battery arm that reads excess where the prediction says null is not a discovery about the
    cipher - it is a discovery about the pipeline, and the record's rules treat it as such
    (V-class, invalid_measurement, escalation), never as a new positive signal.

  claim: >-
    One claim with four sub-claims, each a pass prediction, and one gate statement.

    (C1) B1 PASS. The census-null cells read null on the affine cipher: counts inside the null
    band (<=12 at 2^32, Garwood CI containing the null rate at 2^30). This discharges, for the
    first time in this campaign, a sibling-null on a KNOWN-SIGNAL object: V-804-1's undischarged
    discipline ("a control that discriminates without isolating is not an instrument") has stood
    for three-plus batches precisely because no available object was both structured and
    predictably null in a named cell; the census manufactures such objects at zero cipher cost.

    (C2) B2 PASS. All three misaligned geometries read null on AES r=5 at 2^30 (counts inside
    the null band). Then the excess is SR-ALIGNED-GEOMETRY-SPECIFIC at exposure - the alignment
    premise of BATCH-002 section 2, which until now rested on a single historical failed
    replication attempt (a pointer), becomes a measured, pre-registered control.

    (C3) B3 PASS. The SipRound absence survives re-measurement on an independent lineage:
    substitute arm at the null, comparator seat at the committed excess (14-19 at 2^30 within
    the Poisson band), both on the fresh lineage. Then the substitute-class exclusions are
    LINEAGE-ROBUST along one instrument axis, extending EV-AES-5478a0's class statement (which
    is round-count-robust and key-robust within one family) with instrument-robustness for the
    ideal-approximating class.

    (C4) B4 PASS. The exclusion-toggle delta equals the trivial-trial count on both arms,
    within exact arithmetic (the trivial trials are identifiable in the raw receipts, so the
    delta is checkable trial-by-trial, not just in expectation).

    (GATE) If C1-C4 all pass, the pipeline is DEFENDED for exactly the readings this batch's
    other ideas produce - and the record enumerates which readings those are, so the defence is
    scoped, not general. If any Ci fails, the failing battery is an artifact indictment: the
    dependent mechanism readings are BLOCKED pending repair, the failure is classified
    invalid_measurement (never negative evidence, rule 5), and the repair is dispatched under
    its own task. A battery that fails OPEN (excess where null predicted) additionally escalates
    to independent review before any further mechanism reading is recorded, because a
    pipeline that manufactures excess on known-null objects undermines the interpretability of
    every excess and every absence in the campaign, including the five exclusion records.

    (WHAT IS NOT CLAIMED) Passing the battery does NOT make any mechanism reading true - it
    removes one artifact class from its interpretation, exactly as BATCH-009 recorded about its
    own null object ("removes that explanation and leaves every other standing"). No statement
    about full-round or deployed AES; no published-frontier comparison in either direction
    (R3); no claim that the battery exhausts the artifact space (it covers the four named
    classes, and an artifact outside them remains possible - stated, not smoothed).

  mechanism: >-
    The campaign's standing conclusion - the excess lives in the SPN round geometry operating on
    AES's actual round content - is a conclusion about a cipher, but every measurement of it is
    a product of a pipeline, and the pipeline has known undischarged debts: V-804-1's sibling-null
    discipline (three-plus batches), BATCH-010 red team's shared-harness risk class, the
    trivial-trial exclusion verified until now only by code reading, and a geometry-alignment
    premise resting on one historical pointer. Each of the other three ideas in this round
    sharpens a mechanism reading; this one sharpens the instrument those readings are made
    with, and it does so using the campaign's own strongest new asset - the exact affine census
    - to manufacture objects whose answer is known before any trial runs. The candidate this
    record pursues is that the pipeline WILL pass, because every individual component has
    passed weaker versions of these tests; the record's value is that the tests now exist in
    their strongest available form, pre-registered, with the failure readings attached.

  why_not_a_renamed_known_approach: >-
    Nearest known method - known-answer testing / regression fixtures in instrument validation
    (general practice, no external source named or needed); the known-false discipline of
    docs/inventor-protocol.md ("run the argument on objects where its conclusion is known
    false") applied to a MEASUREMENT PIPELINE rather than an argument. Nearest internal records
    - EV-AES-e4c091 (the ideal-permutation null: structureless object, one geometry cell),
    BATCH-002 A4/R3-A5 (structure-destroyed controls: one mask mutation), BATCH-002 A3 (the
    r=10 decay seat), IDEA-20260808-bfee7e's baseline-embedding control (the derivation must
    return 4.0 for an ideal permutation - a derivation-side cousin of B1, never executed). This
    record differs from all of them in the DIRECTION of the known-answer: every prior control
    ran the probe on objects expected to lack structure; B1/B2 run it on objects expected to
    lack SIGNAL despite PRESENCE of structure (the affine cipher in null-predicted cells;
    AES under misaligned geometry), which is the proves-too-much     direction no committed control
    occupies. LOSSY-PROJECTION TEST - see the field above; PASSES with the fixture status of
    the cipher stated.

  novelty_status: unverified
  novelty_screen:
    knowledge_retrieval_status: >-
      crypto-kb MCP retrieval was UNAVAILABLE this session (Qdrant storage locked by another
      instance / lineage collection not built); the tools were attempted and errored, and the
      silence is NOT read as novelty (AGENTS.md knowledge retrieval policy). Corpus-side screen
