  assumptions:
    - >-
      The expansion recurrence and word width are as recalled. If the width were
      not 32 or the rotation not by one, C1 still holds (invertibility needs
      only that the rotation is a bijection) but every reported count is about a
      different primitive.
    - >-
      "Disturbance vector" is taken to mean a codeword of the expansion code,
      per RQ-DIFFP-a5c483's own scope text. A retrieved summary suggests the
      literature's ambient object may be larger; H1 measures that difference
      inside this program rather than assuming it away.
    - >-
      The cost surrogate is the Hamming weight of the array. Both the 80-step
      weight and the steps-20-to-79 weight are computed and reported separately;
      neither is asserted to be any published cost function.
    - >-
      Rotation-orbit quotienting uses the canonical form of IDEA-20260829-f2ffc1
      if that record has been executed, and otherwise recomputes it here and
      reports it as THIS run's measurement.

  proof_search_map:
    bottleneck: >-
      Enumerating the disturbance vectors an attack could use. Treated as
      information-set decoding over a [2560, 512] binary code this is
      infeasible, and it is the reason goal completion criterion 2 (a covering
      statement over the BUDGET-FEASIBLE difference space) has stood untouched
      across four batches. IDEA-20260829-f2ffc1 names this exact step as the one
      its representation does not help with.
    baseline_embedding:
      parameter_slice: >-
        Restrict the window set to the single window j = 64 and set the pattern
        weight threshold to t rather than to floor(16t/65). The algorithm then
        degenerates EXACTLY to naive enumeration of one information set at full
        weight, which is the baseline: correct, complete and costing
        sum over i <= t of C(512, i). The pigeonhole is precisely the step from
        that slice to 65 windows at threshold 0.246t.
      reproduction_check: >-
        Frozen fixture at toy parameters (width w in {2, 4}, rank r in {2, 4},
        step count 5r): run BOTH the single-window-at-weight-t baseline and the
        all-windows-at-0.246t sieve and require the returned SETS to be
        identical element by element, not merely equal in cardinality, at every
        t up to the toy code's length. A cardinality-only check would pass an
        implementation that found the right number of wrong codewords.
    observation_collision:
      observable: >-
        The set of codewords of weight at most t, and its rotation-orbit
        canonical forms.
      distinct_preimage_search: >-
        TWO SEARCHES, BOTH CHEAP AND BOTH RUN. (i) DUPLICATE PREIMAGES: one
        codeword is reachable from several windows, so the raw sieve emits it
        multiple times; the deduplication key is the full 2560-bit array and any
        two distinct arrays sharing a canonical form that are NOT rotations of
        one another falsify the canonicalisation. (ii) MISSED PREIMAGES, WHICH
        IS THE FALSIFIER THAT MATTERS: draw random codewords, measure their true
        weight t, and require the sieve run at that t to contain each of them.
        A single miss falsifies C2 or its implementation and is reported before
        any count.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The 65 overlapping free coordinate systems, with the covering
          multiplicity bounded by 16, so that the weight budget can be charged
          to whichever window is cheapest. The disjointness needed by the
          transform is replaced here by an EXACT multiplicity bound, which is
          stronger than disjointness and is what makes the charge rigorous.
        predicted_gain: >-
          The enumeration threshold drops from t to floor(16t/65), taking the
          cost from C(512, t) to 65 C(512, 0.246t) -- about 2^123 at t = 32.
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family from "a low-weight codeword exhibited"
          to "the COMPLETE set of codewords of weight at most t, with a proof of
          completeness", and prove a strict inward improvement over
          probabilistic low-weight search, which exhibits members and certifies
          nothing about the complement.
        predicted_gain: >-
          A rigorous cost-bounded denominator and a rigorous minimum-distance
          lower bound, neither of which any probabilistic search can produce at
          any budget.
    quantifier_order: >-
      C2 is "FOR ALL codewords W, THERE EXISTS a window j with wt_j(W) at most
      floor(16 wt(W)/65)" -- an existential inside a universal, discharged
      uniformly by an averaging argument with no dependence on W beyond its
      weight, which is exactly why it can be turned into an algorithm. C3 is
      "FOR ALL codewords W with wt(W) at most t, the sieve outputs W", a
      universally quantified completeness statement proved by C2 and checked
      empirically by the missed-preimage search. The EXISTENTIAL that this
      record does NOT claim is "THERE EXISTS a codeword outside every published
      family", which requires a census this program does not have.
    method_ceiling:
      strongest_certifiable_claim: >-
        The COMPLETE set of codewords of the SHA-1 expansion code of Hamming
        weight at most t, for the largest t the declared budget reaches, with a
        completeness proof; the exact rotation-orbit count of that set; and, if
        the set is empty, a rigorous lower bound of t + 1 on the code's minimum
        weight. IT CANNOT CERTIFY anything about attack cost, cannot say whether
        any output codeword is new (the readable census is empty), cannot reach
        weight 32 within a four-core campaign budget, and cannot say anything
        about the larger ambient code named in H1 until that code is also
        enumerated.
      nearby_object_control: >-
        SHA-0, AND IT IS ALSO THE FULL-SCALE POSITIVE CONTROL, WHICH IS THE
        POINT. Removing the one-bit rotation makes the code split into 32
        independent copies of a length-80 binary code with a 16-bit information
        space, so the complete low-weight set is computable EXACTLY by a
        different method -- enumerate all 65535 nonzero column codewords, sort
        by weight, and combine. The sieve run on SHA-0 must reproduce that set
        exactly. An instrument that returns the same structure for SHA-0 and
        SHA-1 is not reading the rotation, and one that returns only empty sets
        for both has never been shown to fire. A SECOND nearby object where the
        pigeonhole must still hold but the exponent must change: a truncated
        60-step variant, where there are 45 windows rather than 65 and the
        threshold becomes floor(16t/45); the measured cost must move accordingly
        or the implementation is not using the window count it reports.
    proof_obligations:
      - claim: >-
          PO-0. The expansion recurrence, step count and word width are pinned
          from FIPS 180-4 primary text before any number is computed.
        responsibility: baseline
      - claim: >-
          PO-1. Backward invertibility of the recurrence, verified by
          round-tripping 10^4 random 512-bit window patterns through forward and
          backward expansion from every one of the 65 windows.
        responsibility: correctness
      - claim: >-
          PO-2. The covering multiplicity of each step index across the 65
          windows is computed explicitly and its maximum verified to be 16, per
          index, in a printed table rather than asserted.
        responsibility: correctness
      - claim: >-
          PO-3. Completeness at toy parameters against exhaustive enumeration,
          set-equality and not cardinality-equality.
        responsibility: strictness
      - claim: >-
          PO-4. The measured expansion rate and the exact number of patterns
          enumerated are reported, so the exponent claim is arithmetic over
          measured quantities and not an estimate.
        responsibility: runtime
      - claim: >-
          PO-5. Every count is scoped to the expansion code, to the weight
          definition used (80-step and 20-to-79 reported separately), to the
          threshold t actually reached, and to the rotation subgroup used for
          the orbit count.
        responsibility: scope
      - claim: >-
          PO-6. An empty output is reported as a COMPLETE ENUMERATION RETURNING
          NOTHING with its proof of completeness, never as a search that failed
          and never as evidence about any weight above t.
        responsibility: scope

