  minimal_test:
    design: >-
      ONE EXECUTOR TASK IN FIVE STAGES, FAILING FAST, WITH THE FULL-SCALE
      POSITIVE CONTROL BEFORE ANY SHA-1 NUMBER IS READ. STAGE 0 pins the
      recurrence, step count and width from FIPS 180-4 primary text, implements
      forward and backward expansion, and discharges PO-1 and PO-2 with printed
      tables. STAGE 1 runs the toy positive control: for width in {2, 4}, rank
      in {2, 4} and step count 5 times rank, enumerate the whole code by brute
      force, and require SET EQUALITY with the sieve at every t. STAGE 2 IS THE
      FULL-SCALE POSITIVE CONTROL AND IT GATES EVERYTHING: on SHA-0 at 80 steps,
      compute the complete low-weight set independently by enumerating the 65535
      nonzero codewords of the length-80 column code and combining across
      columns, then require the sieve to reproduce it exactly in both
      directions. IF THIS ARM DOES NOT FIRE, NO SHA-1 RESULT MAY BE
      INTERPRETED. STAGE 3 runs the SHA-1 sieve at t = 16 (about 1.4 times 10^9
      patterns, minutes) and then at t = 20 (about 1.8 times 10^11 patterns,
      about 1.3 hours on four cores at a conservatively measured rate), emits
      the complete output set, and computes the rotation-orbit count by Burnside
      on the found set. STAGE 4 runs the missed-preimage search, the H3 window
      distribution measurement, the 60-step truncation control and the null
      objects, and emits a measured-rate extrapolation table for t up to 32 with
      every extrapolated cell FLAGGED AS EXTRAPOLATED and every unmeasured cell
      written as null rather than as 0.
    controls:
      - >-
        FULL-SCALE POSITIVE CONTROL, GATING (SHA-0): a NON-EMPTY known answer
        computed by a completely different algorithm that the sieve must
        reproduce exactly. This exists because an instrument that has only ever
        returned the empty set has never been shown to fire, and an empty SHA-1
        result from such an instrument certifies nothing.
      - >-
        TOY POSITIVE CONTROL: set equality against brute-force exhaustive
        enumeration at parameters where the whole code fits in memory.
      - >-
        MISSED-PREIMAGE CONTROL: random codewords of measured weight must be
        returned by the sieve run at that weight. This is the completeness
        claim's direct empirical test and it can fail.
      - >-
        NULL OBJECT 1: a RANDOM 512-dimensional binary subspace of the same
        ambient dimension with no window structure. The sieve's window
        reconstruction must be inapplicable or must return a different count;
        identical behaviour means the pipeline is not using the recurrence.
      - >-
        NULL OBJECT 2: the SAME sieve run with the recurrence's tap positions
        randomly permuted. The low-weight counts must change; if they do not,
        the sieve is measuring the ambient dimension rather than the code.
      - >-
        NEARBY-OBJECT CONTROL: the 60-step truncation, where the window count
        drops from 65 to 45 and the threshold and the measured cost must move
        accordingly.
      - >-
        PRE-REGISTERED LITERATURE CROSS-CHECK, WITHOUT OPENING ANY PAPER: the
        t <= 24 output must be empty if the retrieved secondary-summary
        assertion about minimum weight is correct. This is registered BEFORE the
        run and its contradiction is reported as a first-class finding.
      - >-
        DEFERRED PUBLISHED-PATH CONTROL, PRE-REGISTERED FOR WHOEVER ACQUIRES
        FIRST: when and only when a published disturbance vector becomes
        readable in this program, the sieve run at that vector's measured weight
        MUST contain it. Recorded now so that the prediction is on the record
        before the object is; it is NOT a control this run can execute, and it
        is reported as unmeasured rather than as satisfied.
    required_metrics:
      - toy_set_equality_fraction, per (width, rank, t) cell
      - sha0_known_answer_agreement, both inclusion directions, with cardinalities
      - sha1_lowweight_count per t, with every codeword emitted as an artifact
      - missed_preimage_count with the draw count and seeds
      - patterns_enumerated, expansions_performed and measured wall clock per t
      - measured_enumeration_ratio and the pigeonhole bound beside it
      - cost_bounded_rotation_orbit_count with per-rotation fixed-point counts
      - min_window_weight_distribution, observed versus hypergeometric prediction
      - null_object_counts, both null objects, reported separately
      - the 60-step truncation cost and threshold
      - weight measured BOTH over 80 steps and over steps 20 to 79, never pooled

  falsification_conditions:
    - >-
      Any toy cell where the sieve's output set differs from exhaustive
      enumeration. C3 is false as implemented; the record is superseded, not
      patched.
    - >-
      Any missed preimage: a codeword of weight at most t that the sieve run at
      threshold t does not return. C2 or its implementation is false.
    - >-
      The covering multiplicity table shows any step index in more than 16
      windows. The pigeonhole constant is wrong and every threshold with it.
    - >-
      Backward expansion fails to round-trip. C1 is false and the 65 windows are
      not coordinate systems.
    - >-
      The SHA-0 arm does not reproduce the independently computed known answer
      exactly. The instrument is not shown to fire and no SHA-1 number from the
      run may be cited, in either direction.
    - >-
      A nonzero codeword of weight at most 24 is returned for SHA-1. Either the
      implementation is defective or the retrieved minimum-weight assertion is
      wrong; both are reported, with the codeword printed, before any other
      result.
    - >-
      The null objects produce the same counts as the real code. The sieve is
      not reading its input.
    - >-
      FIPS 180-4 primary text gives a different recurrence, step count or width.
      Every number is withdrawn rather than reinterpreted.

  confounders:
    - >-
      THE AMBIENT-CODE RISK, WHICH IS THE LARGEST ONE AND IS NOT RESOLVED BY ANY
      CONTROL HERE. A retrieved summary asserts that the disturbance-vector
      space is the XOR-sum of the expansion code and a code describing the block
      cipher. If so, this record enumerates a SUBSET or a DIFFERENT SET from
      what the literature calls disturbance vectors, and the covering fraction
      built on it has the wrong denominator. H1 gives an acquisition-free
      validation route; until it runs, every count is scoped to the expansion
      code by name in every emitted field.
    - >-
      AN EMPTY RESULT LOOKS LIKE A WORKING INSTRUMENT. Returning nothing at
      t <= 24 is the predicted outcome and is also exactly what a broken sieve
      returns. This is why the SHA-0 arm is gating and why the missed-preimage
      control uses codewords of measured weight rather than of hoped-for weight.
    - >-
      WEIGHT DEFINITION. The 80-step weight and the steps-20-to-79 weight give
      different thresholds and different sets. Reporting one number without
      naming which would repeat, at the level of a weight, the selector defect
      this campaign already fixed at the level of a differing-cell count.
    - >-
      DEDUPLICATION COST. A codeword light in many windows is emitted many
      times; a naive implementation could spend more time deduplicating than
      enumerating, or could deduplicate on a lossy key and silently drop
      distinct codewords. The dedup key is the full array and the duplicate rate
      is a reported metric.
    - >-
      MEASURED RATE VERSUS ASSUMED RATE. The t = 32 exponent figure is
      arithmetic on a measured expansion rate, and a rate measured on the toy
      instance does not transfer to the full one. The rate is measured at full
      SHA-1 parameters and reported with the extrapolation, or the extrapolation
      is not emitted at all.

  interpretation_limits:
    - >-
      NO PATH IS CLAIMED NEW, no collision is claimed, no attack cost is
      claimed, and nothing is said about any deployed system. Claim tier ceiling
      `analyzed`, per GOAL-DIFFP-84d641's standing ceiling.
    - >-
      A COMPLETE ENUMERATION AT WEIGHT t SAYS NOTHING ABOUT WEIGHT t + 1. The
      output is a fact about a threshold that a declared budget reached, and the
      regime where published disturbance vectors are believed to live is NOT
      reached on a four-core machine.
    - >-
      A cost-bounded orbit count is a DENOMINATOR. It becomes a covering
      fraction only when a numerator exists, and the numerator requires a
      readable census, which is currently of size zero.
    - >-
      Scoped to the expansion code as pinned, to width 32, to 80 steps, to the
      rotation subgroup used for the orbit count, to the weight definitions
      reported, and to the thresholds actually run. SHA-0 and the 60-step
      truncation appear ONLY as controls and no result about either is claimed.
    - >-
      The low-weight-codeword framing is PUBLISHED at search-summary level. Any
      novelty here is confined to the 65-window pigeonhole, the completeness
      guarantee and the orbit count, and even that is `unverified` because no
      paper was opened.

  heuristic_assumptions:
    - id: H1
      statement: >-
        AMBIENT-CODE IDENTIFICATION. The disturbance-vector space relevant to
        SHA-1 collision attacks is exactly the message-expansion code C, rather
        than the XOR-sum of C with a second linear code L derived from the
        linearized step function. Formally, the assumption is that the object
        being enumerated and the object the literature calls a disturbance
        vector coincide as subsets of the 2560-bit space.
      rigorous_support: >-
        NONE. RQ-DIFFP-a5c483's scope text defines the disturbance vector as a
        codeword of the linearized message expansion, and this record follows
        that definition; a retrieved search-result summary asserts the larger
        sum-of-two-codes object. The two definitions are not reconciled anywhere
        in this program and the disagreement is recorded rather than resolved.
      validation_plan: >-
        EXECUTABLE WITHOUT ACQUISITION, WHICH IS THE POINT. Construct L directly
        from the SHA-1 step function by replacing every modular addition with
        XOR -- a derivation from the pinned specification, not from any paper --
        and form C + L. Report dim(C), dim(L), dim(C + L) and dim(C intersect L)
        as measured ranks. Then run the identical sieve on C + L at the same
        thresholds (noting that the window argument must be RE-DERIVED for C + L
        and may not hold, which is itself the measurement) and report both
        low-weight sets side by side with their intersection. Sampled
        parameters: width 32, 80 steps, thresholds t in {16, 20}. TAIL CHECK:
        inspect individually the lightest codewords found in C + L but not in C.
        TRANSFER ASSUMPTION, STATED: no count for either code transfers to the
        other, and if the window bijection fails for C + L the sieve is simply
        not applicable there and that is reported as a scope limit rather than
        as an empty result.
    - id: H2
      statement: >-
        COST RELEVANCE OF THE WEIGHT THRESHOLD. There exists a threshold T such
        that every disturbance vector usable in a collision attack has Hamming
        weight at most T over steps 20 to 79, so that a complete enumeration at
        threshold T is a complete enumeration of the attack-relevant space. This
        imitates the classical practice of selecting disturbance vectors by low
        weight in the later rounds, which KN-TECH-066's local-collision
        accounting motivates.
      rigorous_support: >-
        The rigorous part is only that each set bit outside the first round
        marks a local collision whose conditions must be paid for, so cost is
        non-decreasing in the count. That T EXISTS and that it is small is NOT a
        theorem, and a retrieved summary indicates published cost functions
        weight positions unequally, which would make a flat threshold a coarse
        surrogate.
      validation_plan: >-
        Report the sieve's output as a CURVE in t rather than at a single
        assumed T, so that no threshold is load-bearing; publish the count and
        the orbit count at every t reached, and the measured cost at each. Cross
        check against IDEA-20260829-ea385e's cost proxy by computing, for every
        codeword found, both the plain 20-to-79 weight and a position-weighted
        variant, and report the Spearman rank correlation; a coefficient below
        0.7 means the threshold choice is load-bearing and every figure must be
        reported under both surrogates. TRANSFER ASSUMPTION, STATED: no transfer
        to any published cost function is claimed, and locating T is an
        acquisition obligation, not a measurement this record can make.
    - id: H3
      statement: >-
        PIGEONHOLE SLACK. For a codeword of weight t, the minimum window weight
        min_j wt_j(W) behaves like the minimum of 65 heavily overlapping
        hypergeometric draws of 512 coordinates from 2560 containing t marked
        ones, whose mean is 0.2 t, rather than sitting at the worst-case bound
        0.24615 t. Formally, the assumption is that the empirical distribution
        of min_j wt_j over codewords of weight t is stochastically dominated by
        the corresponding distribution for a uniformly random weight-t binary
        array of the same shape.
      rigorous_support: >-
        The upper bound 0.24615 t is a THEOREM and the sieve's completeness
        depends only on it, never on H3; H3 concerns the PRACTICAL cost and the
        possibility of a cheaper incomplete variant. The classical statement it
        imitates is the standard hypergeometric model for the weight of a random
        subset of coordinates of a fixed-weight vector, used throughout
        information-set decoding to predict success probabilities.
      validation_plan: >-
        Sample codewords by expanding random window patterns under declared
        seeds, bin them by measured total weight t, and for each bin plot the
        empirical distribution of min_j wt_j against the hypergeometric
        prediction with mean 512 t / 2560 and against the worst-case bound.
        Sampled parameters: 10^5 draws, width 32, 80 steps, t bins covering the
        observed range. TAIL CHECK: report the maximum observed min_j wt_j and
        confirm it never exceeds floor(16t/65), since a single violation would
        falsify C2 empirically before any proof is re-read. TRANSFER ASSUMPTION,
        STATED: any incomplete cheaper variant built on H3 loses the
        completeness guarantee and must be reported under a different metric
        name, never merged with the complete counts.

  target_complexity:
    time_exponent: >-
      65 times the sum over i <= floor(16t/65) of C(512, i) expansions, each
      expansion about 64 word operations, roughly 2^11 bit operations. Measured
      points intended: t = 16 gives u = 3 and about 1.4 times 10^9 patterns
      (2^30.4, about 2^41 bit operations); t = 20 gives u = 4 and about 1.8
      times 10^11 patterns (2^37.4, about 2^48 bit operations). Arithmetic
      extrapolations, labelled as such: t = 24 gives u = 5 and about 2^44
      patterns; t = 32 gives u = 7 and about 2^57 patterns, about 2^68 bit
      operations.
    memory_exponent: >-
      O(1) working memory -- the sieve streams patterns and holds only the
      output set, which is predicted empty for SHA-1 at the thresholds reached
      and is bounded by the SHA-0 known answer's size on the control arm. No
      table, no birthday storage. THE ABSENCE OF A MEMORY COST IS A REAL
      PROPERTY AND IS THE REASON THIS IS PARALLELISABLE WITHOUT COORDINATION.
    best_known: >-
      IN THIS PROGRAM: no method at all. The cost-bounded enumeration has never
      been attempted here; IDEA-20260829-f2ffc1 states explicitly that its
      representation does not make it easier, and the only baseline on record is
      enumeration of the whole code at 2^512. IN THE LITERATURE: UNKNOWN,
      because no paper was opened, and the position is probably worse for this
      record than for most -- a retrieved summary states that the low-weight
      codeword framing is published and that an exhaustive search over a cost
      function was published in 2008. Probabilistic low-weight search of the
      Canteaut-Chabaud or Stern family is the standard tool for FINDING light
      codewords and is expected to dominate this sieve on that task; it produces
      NO completeness statement, which is the only axis on which this record
      claims anything.
    hidden_overhead: >-
      No asymptotic parameter and no o(1) to hide anything in. What IS hidden
      and is stated plainly: the exponent 65 C(512, 0.246t) is still
      superexponential in t, so the method does not reach the weight regime
      where published disturbance vectors are believed to live inside a
      four-core campaign budget; and the completeness guarantee is only as good
      as the ambient-code identification of H1, which is unresolved.
    tradeoff_note: >-
      Embarrassingly parallel across the 65 windows and across pattern blocks,
      with no shared state and no communication, so wall clock divides by cores
      exactly. A time-memory tradeoff EXISTS and is named but NOT claimed: a
      meet-in-the-middle inside each window, splitting the 512-bit pattern into
      two halves and matching on a projected partial syndrome, would trade
      memory for time in the standard Stern shape. It is not analysed here, is
      not counted in any figure, and is recorded as the obvious successor.

  dominated_by: >-
    PARETO CHECK, ROW BY ROW, ACROSS TIME, MEMORY AND DATA. (1) Against
    enumeration of C to find low-weight codewords: NOT dominated -- 2^512 versus
    2^37 at t = 20, same negligible memory, no data. (2) Against a single-window
    enumeration at full weight t, which is the baseline_embedding slice: NOT
    dominated -- C(512, t) versus 65 C(512, 0.246t), a factor of about 2^123 at
    t = 32, same memory. (3) Against probabilistic low-weight codeword search
    (information-set decoding, Canteaut-Chabaud, Stern, and their modern
    descendants): DOMINATED ON THE TASK OF FINDING ONE LIGHT CODEWORD, almost
    certainly and by a wide margin, and NOT COMPARABLE on the task this record
    claims, which is COMPLETE enumeration with a proof plus an exact orbit
    count. Stated in this direction rather than the flattering one. (4) Against
    IDEA-20260829-f2ffc1: NOT dominated and strictly complementary -- that
    record computes the FULL code's orbit count in closed form and states that
    the cost-bounded count is out of its reach; this one computes the
    cost-bounded count and needs f2ffc1's canonical form to quotient it. (5)
    Against IDEA-20260829-ea385e: NOT dominated -- that decides WHICH quotient
    is legitimate and computes no set; this computes a set and quotients it by
    the rotation subgroup only, which is the quotient ea385e predicts is the
    safe one. (6) Against IDEA-20260829-9e6650 and IDEA-20260829-c92c2f: NOT
    dominated and disjoint -- verdict semantics and an MD5 necessary condition
    respectively. (7) Against the pending roughly 2950-second selector-swap
    control in the goal's live next_action: NOT dominated, NOT a substitute, and
    NOT presupposing its funding decision. (8) Against the retrieved-but-unopened
    Manuel classification and its exhaustive cost-function search: POSSIBLY
    DOMINATED AND THE ROW IS OPEN. If that work enumerated the cost-feasible
    space exhaustively, this record's enumeration is a re-derivation whose only
    remaining delta is the completeness proof and the orbit count. Resolving the
    row requires acquisition, which is a coordinator decision under
    AMD-20260824-DIFFP-ACQ-1 and not this record's to take. (9) Against the
    retrieved-but-unopened coding-theory line (Pramstaller-Rechberger-Rijmen;
    Rijmen-Oswald; Jutla-Patthak): UNKNOWN, same reason; the minimum-distance
    lower bound this sieve would produce at t <= 24 is very likely ALREADY
    PUBLISHED and stronger, and the record says so rather than claiming it.
    (10) Against the 2026-08-28 RQ-SHAONE and RQ-MDFIVE proposal round
    (cost-model calculators, detector coverage on real collisions, HMAC hidden
    initial state, template density): NOT dominated and disjoint -- none
    enumerates the disturbance-vector space or computes any orbit count.
  sota_delta: >-
    QUANTITATIVELY, AGAINST THE ONLY BASELINES THIS PROGRAM HOLDS. The number of
    SHA-1 disturbance vectors of bounded weight that this program can currently
    enumerate completely is ZERO at any weight, and the cost-bounded orbit count
    is UNCOMPUTED. This proposal returns a complete set and an exact
    rotation-orbit count at t = 20 for about 2^37 pattern expansions on four
    cores, and at t = 24 for about 2^44 with declared additional budget. Against
    the naive single-window baseline the exponent falls by about 40 binary
    orders of magnitude at t = 24 and about 123 at t = 32. AGAINST THE
    LITERATURE: NO DELTA IS CLAIMED. The low-weight-codeword framing is
    published at search-summary level, a minimum-distance bound of at least 25
    on the last 60 words is published at search-summary level, and an exhaustive
    disturbance-vector search is published at search-summary level; this record
    would at best re-derive them with a completeness proof and an orbit count.
    NO CRYPTANALYTIC DELTA OF ANY KIND IS CLAIMED: no collision, no attack, no
    cost improvement, no path claimed new, and nothing about any deployed
    system.

  estimated_cost:
    implementation: medium
    compute: medium
    basis: >-
      Implementation is a few hundred lines of C or Rust plus a Python driver --
      forward and backward expansion, a weight-bounded pattern enumerator, a
      deduplicating set, and a Burnside orbit counter. Compute is minutes at
      t = 16 and about 1.3 hours on four cores at t = 20 at a conservative
      measured rate of 10^7 expansions per core-second; t = 24 needs about five
      core-days and is declared as a SEPARATE budget request, not assumed. The
      SHA-0 control arm is seconds.

  recommended_priority: high
