idea:
  id: IDEA-20260829-d81e3b
  question_id: RQ-DIFFP-a5c483
  goal_id: GOAL-DIFFP-84d641
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    EVERY SIXTEEN CONSECUTIVE STEPS OF THE SHA-1 EXPANSION ARE A FREE COORDINATE
    SYSTEM, SO A PIGEONHOLE OVER THE 65 WINDOWS TURNS COMPLETE LOW-WEIGHT
    DISTURBANCE-VECTOR ENUMERATION FROM A 2^512 PROBLEM INTO A
    WEIGHT-0.246t PATTERN SEARCH -- delivering the COST-BOUNDED orbit count that
    IDEA-20260829-f2ffc1 explicitly declared out of its own scope, with SHA-0 as
    a full-scale known-answer positive control the instrument must reproduce
    exactly
  class: algorithm

  claim: >-
    Let C be the SHA-1 linearized message-expansion code, the set of 80-tuples
    of 32-bit words with W_i equal to the one-bit left rotation of
    W_(i-3) XOR W_(i-8) XOR W_(i-14) XOR W_(i-16) for 16 <= i <= 79. Write
    wt(W) for the Hamming weight of the whole 80-word array (2560 bits) and
    wt_j(W) for the weight of the 16-word window starting at step j.
    FOUR CLAIMS, EACH SEPARATELY FALSIFIABLE.
    (C1) FREE WINDOWS. For every j with 0 <= j <= 64, the map sending a
    codeword to its window (W_j, ..., W_(j+15)) is a BIJECTION from C onto the
    512-bit space. Forward it is the recurrence; backward it is the same
    recurrence solved for W_(i-16), which is possible because the one-bit
    rotation is invertible. There are 65 such coordinate systems, not one.
    (C2) PIGEONHOLE. Each step index lies in at most 16 of the 65 windows, so
    the sum over j of wt_j(W) is at most 16 wt(W), and therefore EVERY codeword
    of total weight t has at least one window of weight at most
    floor(16t/65) = floor(0.24615 t).
    (C3) COMPLETE ENUMERATION AT A REDUCED EXPONENT. Consequently the algorithm
    "for each of the 65 windows, for each 512-bit pattern of weight at most
    u = floor(16t/65), expand and keep the codewords of total weight at most t"
    returns EVERY codeword of weight at most t, with NO omissions and no
    probabilistic failure, at a cost of 65 times the sum over i <= u of
    C(512, i) expansions. At t = 24 that is about 2^44 expansions; at t = 32
    about 2^57; against about 2^180 for a single-window enumeration at weight t
    and 2^512 for enumerating C.
    (C4) THE COST-BOUNDED DENOMINATOR FOLLOWS AT NO EXTRA COST. The output set
    is closed under bit-rotation, because rotation is a coordinate permutation
    and preserves weight exactly, so Burnside applied to the FOUND SET yields
    the EXACT number of rotation-orbits of codewords of weight at most t. That
    is the cost-bounded orbit count -- the denominator goal completion criterion
    2 actually needs, and the one IDEA-20260829-f2ffc1 states in its own
    method_ceiling that its representation does NOT deliver.
    PRE-REGISTERED TWO-SIDED OUTCOME. A search-result summary (not a paper this
    session opened) asserts that the minimum weight of a nonzero codeword of
    this code projected on the last 60 words is at least 25. If that is right,
    the sieve MUST return EXACTLY the zero codeword at every t <= 24, and a
    nonempty result at t <= 24 is either an implementation defect or a
    contradiction of that assertion -- in both cases the most valuable output
    the run can produce.
    NO PATH IS CLAIMED NEW, NO COLLISION IS CLAIMED, AND NO ATTACK COST IS
    CLAIMED.

  mechanism: >-
    THE BOTTLENECK, NAMED EXACTLY. This campaign has no covering fraction for
    SHA-1 because it has no cost-bounded denominator, and it has no cost-bounded
    denominator because "enumerate the disturbance vectors that an attack could
    actually use" has been treated as an information-set-decoding problem over a
    [2560, 512] binary code -- infeasible, and explicitly excluded from
    IDEA-20260829-f2ffc1's ceiling.
    THE MECHANISM IS A CHANGE OF WHICH COORDINATE SYSTEM YOU SEARCH IN, AND IT
    IS THE ONLY IDEA IN THIS RECORD. Standard low-weight-codeword search fixes
    one information set and hopes the target's weight falls inside it; that is
    probabilistic and gives no completeness. Here the code has 65 DIFFERENT
    natural information sets -- the 65 sliding 16-step windows -- and they are
    not independent: they overlap so heavily that each coordinate is counted at
    most 16 times across all of them. Averaging over the 65 windows is therefore
    a hard pigeonhole, not a heuristic: a light codeword cannot be heavy in
    every window at once. Searching all 65 windows at the REDUCED weight
    threshold 0.246t is then EXHAUSTIVE for weight t, and the exponent falls
    because C(512, 0.246t) is astronomically smaller than C(512, t).
    WHY THE FACTOR IS 16/65 AND NOT 16/80. The windows must fit inside the
    80-step array, so there are 65 of them and the interior steps are covered 16
    times while the 15 steps at each end are covered fewer. The bound uses only
    the upper limit 16, which is why it is rigorous rather than an average-case
    statement; the practical cost is lower and that gap is measured, not
    assumed, by heuristic H3.
    THE LOSSY-PROJECTION TEST, APPLIED BEFORE ANY COMPUTE AND ANSWERED IN THE
    AFFIRMATIVE. The tracked object is the pair (window index, window weight
    pattern). It discards the codeword's content outside the window -- an
    enormous quotient, 2048 of the 2560 bits -- and what it retains propagates
    DETERMINISTICALLY under the target's own operation, because the expansion
    recurrence reconstructs those 2048 bits exactly and uniquely from the 512
    retained ones. It is not a change of coordinates in the disqualifying sense
    of docs/inventor-protocol.md section 2 precisely because the projection is
    ONTO ONE WINDOW AT A TIME while the constraint being tested (total weight)
    lives outside it: the algorithm gains its exponent from the mismatch between
    what the projection keeps and what the predicate reads.
    WHAT THIS DOES NOT DO, STATED HERE RATHER THAN DISCOVERED LATER. It does not
    make an attack cheaper, does not find a collision, and does not reach the
    weight regime where published disturbance vectors are believed to live
    inside a campaign-sized budget on a four-core machine. It converts an
    infeasible-in-principle count into a feasible-with-declared-budget count at
    a stated threshold, and it does so with a completeness guarantee that
    probabilistic low-weight search cannot offer at any budget.

