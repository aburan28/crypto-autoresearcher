idea:
  id: IDEA-20260805-72bcb5
  question_id: RQ-RSA-afe33c
  goal_id: GOAL-RSA-001
  added: '2026-08-05'
  title: >-
    Charge the block-Wiedemann step in bytes, not core-years: an
    information-theoretic matrix-traffic identity, a sequential-depth floor
    that no core-year figure expresses, and the one cross-problem forced value
    the literature already set up for free - the DLP-240 versus RSA-240
    linear-algebra ratio on identical hardware
  class: measurement

  claim: >-
    A core-year is not a unit for the linear-algebra stage of the number field
    sieve. Three quantities are forced by the published matrix dimensions
    alone, before any implementation detail is known, and none of them is
    recoverable from a core-year figure: (1) a matrix cannot be smaller than
    log2 C(N, d_row) bits per row, which at the relayed RSA-250 post-merge
    dimensions is 694 bytes per row and 281 GB in total, and block Wiedemann
    must stream that object once per pass; (2) the number of passes is
    2N/b + N/b for blocking width b, which fixes a SEQUENTIAL DEPTH that
    additional cores cannot buy down, so the same 250 core-years is compatible
    with wall-clock times differing by orders of magnitude; (3) the ratio of
    the discrete-logarithm linear algebra to the factorization linear algebra
    at the SAME 240-digit size on the SAME hardware and software is forced, up
    to the matrix dimensions, by the ring the vectors live in - and two
    plausible cost models for that ratio, an arithmetic-bound one and a
    traffic-bound one, differ by more than an order of magnitude, so the
    published record adjudicates between them at zero compute. This proposal
    claims no factorization and says nothing about any deployed key; it
    proposes the instrument that GOAL-RSA-001's first technical gate requires,
    with the failure mode named in advance.

  object_first_candidate:
    tracked_object: >-
      MATRIX BYTES CROSSING THE MEMORY BOUNDARY PER UNIT OF KRYLOV PROGRESS.
      Not operations, not core-seconds, not core-years: bytes moved per
      sequential block-Wiedemann iteration, followed from the relation files,
      through filtering and merge into the post-merge sparse matrix, through
      each Krylov pass, through the block Berlekamp-Massey stage, and out into
      the solution stage. The object is chosen because it is the one quantity
      that is (a) invariant across implementations, (b) bounded below by
      information theory rather than by engineering, and (c) systematically
      absent from every published record cost, which reports core-years.
    established_families_off_limits: >-
      Off-limits as the primary lens: every method of making the linear algebra
      FASTER - structured / displacement-rank solvers, Galois-symmetry
      quotients, Lanczos versus Wiedemann variants, GPU or FPGA
      reimplementation, filtering and merge heuristics, and the choice of
      sparse-matrix format. Also off-limits: every method of making relation
      collection faster. This proposal proposes NO speedup to anything. It is
      an audit of what the published numbers can and cannot mean, and using an
      optimization lens would immediately regress it into a variant of known
      work.
    newness_score: >-
      The individual ingredients are elementary and certainly known to the
      practitioners who ran the records: an entropy bound on a sparse matrix,
      the Coppersmith iteration count, and the observation that mod-l vectors
      are wider than GF(2) vectors. What this corpus does not hold, and what
      the ANGLE-BRIEF's F12 section records as "specified and unexecuted", is
      any of them written down for factoring, and nothing at all that turns the
      same-size factorization-versus-discrete-logarithm pair into a
      PRE-REGISTERED FORCED VALUE with two competing pre-declared predictions.
      A cross-problem control that the literature has already run, and that no
      one has used as a control, is the cheapest thing in this goal.
    testability_score: >-
      High and cheap, with an honest asymmetry that is stated up front: the
      entropy floor and the sequential-depth floor are exact given the matrix
      dimensions but have LOW DISCRIMINATING POWER (they are floors, and the
      measured value clears them comfortably); the cross-problem ratio has HIGH
      discriminating power because the two candidate models differ by a factor
      of about 21 and all implementation constants cancel. The contract must
      not present the weak test as if it carried the strong test's weight.
    survival_score: >-
      The object survives from the relation files to the solution, which is
      why it is worth tracking; it stops being informative exactly where the
      published record stops reporting - no record in this corpus states the
      blocking width b, the number of sequences, the aggregate bandwidth, or
      the wall-clock of the linear-algebra stage, so the object's value must be
      recovered from primary text or the line stops.

  mechanism: >-
    PROVENANCE FIRST, BECAUSE EVERY NUMBER BELOW DEPENDS ON IT. The record
    figures used here are taken from the provenance block of RQ-RSA-afe33c,
    WHICH ITSELF DECLARES THEM UNVERIFIED SEARCH-EXCERPT MATERIAL TO BE RE-READ
    FROM PRIMARY TEXT. They are, verbatim from that block: RSA-250 at 829 bits,
    roughly 2700 core-years total, 130 / 2450 / 250 core-years for polynomial
    selection / sieving / linear algebra on Intel Xeon Gold 6130 at 2.1 GHz,
    8.7G raw and 6.1G unique relations, 405M rows at density 252 after merge;
    RSA-240 at 795 bits; a 795-bit prime-field discrete logarithm at the same
    size. THE PHASE FIGURES AS QUOTED SUM TO 2830, NOT 2700. Nothing below
    asserts any of these; each derived quantity is written as a FUNCTION of
    them, and the numeric instantiation is labelled conditional. The matrix
    dimensions for RSA-240 and for the 795-bit DLP are NOT in this corpus at
    all and are a Stage-0 acquisition.

    PART A - THE ENTROPY FLOOR ON THE MATRIX. A post-merge NFS matrix over
    GF(2) is a bit matrix; all of its content is its support. Specifying which
    d_row of N columns are occupied in a row costs at least log2 C(N, d_row)
    bits, and no encoding - delta coding, Golomb coding, blocked formats,
    reordering - can beat that on average. Hence
      S_min = N . log2 C(N, d_row) / 8 bytes.
    CONDITIONAL INSTANTIATION at the relayed RSA-250 dimensions N = 4.05e8,
    d_row = 252: log2 C(N, d_row) = 5553.5 bits = 694.2 bytes per row, so
    S_min = 2.8115e11 bytes = 281.1 GB (261.8 GiB). For comparison a flat
    32-bit column index costs N . d_row . 4 = 408.2 GB, so real formats sit
    within about 1.5x of the floor and the floor is TIGHT ENOUGH TO BE USEFUL
    rather than vacuous. Note what this says on its own: the linear-algebra
    stage of RSA-250 could not have been run on a machine unable to hold a
    quarter of a terabyte of matrix, and that fact is invisible in "250
    core-years".

    PART B - PASSES, WORK, AND SEQUENTIAL DEPTH. Coppersmith block Wiedemann
    with left-block width m and right-block width n performs about N/m + N/n
    Krylov block-products and about N/n solution block-products. Counting in
    VECTOR-iterations (each block-product advances n vectors) the total is
    N(n/m + 2), which is 3N when m = n and 2.5N when m = 2n - blocking-choice
    independent to within 20 per cent. At N = 4.05e8 that is 1.01e9 to 1.22e9
    vector-iterations. Counting in PASSES OVER THE MATRIX, with b the number
    of vectors carried per pass, it is (2N + N)/b = 3N/b passes, so
      total matrix traffic  T = (3N/b) . S,
      sequential depth      D = (2N/b) Krylov passes, strictly ordered.
    D IS THE QUANTITY A CORE-YEAR FIGURE CANNOT EXPRESS. Krylov iterate i+1
    depends on iterate i; no number of cores shortens the chain. Adding
    hardware shortens the time PER pass (by splitting the matrix, at the price
    of one global vector exchange per pass) but never the number of passes.
    Therefore
      T_wall  >=  (3N/b) . S / BW_aggregate,
    a wall-clock floor that is a property of the matrix and the machine and is
    entirely absent from the reported cost. CONDITIONAL INSTANTIATION at
    b = 64: 3N/b = 1.898e7 passes, T = 5.34e18 bytes of matrix traffic; at an
    aggregate 1 TB/s that is 41 days of wall clock and at 100 TB/s it is 10
    hours - the SAME 250 core-years either way. That two-orders-of-magnitude
    spread inside one core-year figure is the whole argument for completion
    criterion 2.

    PART C - THE PARALLEL SCALING LAW, AND WHY b IS NOT FREE. Increasing b
    divides the pass count and hence the sequential depth, while multiplying
    the work per pass by the same factor, so the TOTAL work is invariant in b
    and the wall clock falls as 1/b. The brake is the block Berlekamp-Massey
    (lingen) stage, whose cost grows superlinearly in b - RECALLED AND
    UNVERIFIED: at least quadratically, plausibly b^(omega-1) times N up to
    logarithmic factors, WITH NO CITATION ASSERTED AND NO EXPONENT CLAIMED.
    The optimum b therefore balances (3N/b) . S / BW against T_lingen(b), and
    b is a FORCED VALUE of the record: a model that predicts an optimal b far
    from the one actually used has mis-costed one of the two terms. Extracting
    the b actually used is a Stage-0 acquisition item and, if the primary text
    reports it, this is a genuine pre-registered prediction rather than a fit.

    PART D - THE CROSS-PROBLEM FORCED VALUE, WHICH IS THE ONE WITH POWER.
    The 2020 experiment ran a 795-bit factorization and a 795-bit prime-field
    discrete logarithm on the SAME hardware with the SAME software. Every
    implementation constant - cache behaviour, format overhead, cluster
    efficiency, scheduler loss - is therefore common to both and cancels in
    the ratio of their linear-algebra costs. Write N_f, w_f for the
    factorization matrix and its per-nonzero cost, N_d, w_d likewise for the
    discrete logarithm; the factorization works over GF(2) with b_f vectors
    bit-packed into machine words, the discrete logarithm works over Z/lZ with
    l of w_l 64-bit words and b_d sequences. TWO PRE-DECLARED MODELS, BOTH
    STATED BEFORE ANY RECORD FIGURE IS READ.
      MODEL-ARITH (the stage is compute-bound). Word-operations are
      (vector-iterations) x (nonzeros) x (word-ops per nonzero per vector):
      3 N_f W_f / 64 for the factorization (one 64-bit XOR advances 64
      vectors) against 3 N_d W_d . 2 w_l for the discrete logarithm (a
      multiply-accumulate of a w_l-word residue). Predicted ratio
        R_arith = 128 w_l . (N_d^2 d_d) / (N_f^2 d_f).
      At w_l = 13 and equal matrix dimensions, R_arith = 1664.
      MODEL-TRAFFIC (the stage is bandwidth-bound, which is what Part A
      suggests). Traffic is (passes) x (index stream + gathered vector
      entries): (3N_f/64)(S_f + 8 W_f) against (3N_d/b_d)(S_d + 8 w_l W_d).
      At equal dimensions, w_l = 13, b_d = 8 this gives
        R_traffic = 79.4,
      and 158.8 at b_d = 4, 39.7 at b_d = 16.
    THE TWO MODELS DIFFER BY A FACTOR OF ABOUT 21 AT THE SAME PARAMETERS. The
    published record contains the measurement that separates them, it was
    produced for a different purpose entirely, and this corpus has never used
    it. If the measured ratio lands outside BOTH brackets, neither model
    reproduces the record and that is the reproduction failure this goal's
    next_action says is a RESULT and not a setback.

    PART E - THE DISCREPANCY IS A DATUM, NOT A ROUNDING NUISANCE. 130 + 2450 +
    250 = 2830 against a headline 2700. The candidate explanations are
    enumerable and distinguishable from primary text: (1) rounding of the
    headline; (2) different hardware between the announcement and the talk,
    which changes what a core-year means and therefore changes every
    normalization in Part D; (3) a phase double-counted or a phase omitted -
    note that FILTERING AND MERGE APPEARS IN NO PHASE OF THE QUOTED BREAKDOWN,
    though it must read 6.1G relations and run a graph algorithm over them,
    which by Part A's argument is a memory-bound stage of the same order as the
    matrix; (4) an extraction error in the search excerpt. Explanation (3)
    would mean the published breakdown omits a stage, and would be the most
    consequential of the four for anyone extrapolating from it. The
    transcription must settle this against primary text rather than smooth it
    over, which is what this goal's next_action already requires.

  novelty_status: unverified

  literature_context:
    - >-
      RQ-RSA-afe33c provenance block. This is the ONLY source of the record
      figures used above, and it declares itself unverified: "OBTAINED BY
      SEARCH-TOOL EXCERPT ON 2026-08-04, NOT FILED AS KN-LIT", listing the
      CADO-NFS RSA-250 announcement, the PRACE talk, the merge/filtering paper
      and eprint 2020/697 as documents seen in excerpt only, and stating that
      the figures "are RESEARCH TARGETS TO BE RE-READ FROM PRIMARY TEXT".
      Every numeric instantiation in this proposal inherits that status.
    - >-
      KN-LIT-3007, "Comparing the difficulty of factorization and discrete
      logarithm: a 240-digit experiment" (Thome, Zimmermann). NOT READ. The
      in-corpus entry is 2026-07-24 bulk-seeded with null year, venue and all
      four identifiers, and its own caveat says claims are relayed from the
      abstract. Its Contribution paragraph, which IS in the entry and is quoted
      rather than paraphrased, reports "the factorization of RSA-240, a
      795-bit number, and a discrete logarithm computation over a 795-bit
      prime field", that the two computations "were done using the same
      hardware and software", and that "the last page of this paper also
      reports on the factorization of RSA-250". The same-hardware-same-software
      sentence is the entire basis for Part D's cancellation argument and it is
      the first thing Stage 0 must confirm against primary text.
    - >-
      KN-LIT-016 (Wiedemann 1986, coordinate recurrence, doi 10.1109/TIT.1986.
      1057137) and KN-LIT-017 (Coppersmith 1994, block Wiedemann over GF(2),
      doi 10.1090/S0025-5718-1994-1192970-7) are in-corpus with real
      identifiers and are the sources for the algorithm's shape. The specific
      iteration count N/m + N/n plus N/n used in Part B is RECALLED FROM THE
      ALGORITHM'S STRUCTURE AND NOT QUOTED FROM EITHER PAPER; it is a
      CANDIDATE TO CHECK and Stage 0 checks it. The claim that the total is
      blocking-independent to within 20 per cent follows from the recalled
      form and falls with it.
    - >-
      KN-TECH-008 (structured / sparse linear algebra) and KN-OPEN-006
      (designed arithmetic-progression relation supports and displacement
      rank) are the in-corpus entries nearest this stage. KN-OPEN-006 asks
      whether a structured solve can beat generic sparse Wiedemann NET OF the
      relation-probability penalty, and explicitly demands the same fully
      charged cost model this proposal is trying to build. The two entries do
      not cite each other and neither has an owning experiment.
    - >-
      KN-OPEN-025 (Galois symmetry on the TNFS linear-algebra stage) is the
      corpus's other unowned linear-algebra-charging question. Its own text
      warns that deriving an end-to-end consequence from a single-stage
      speedup "would be precisely the partial-cost error AGENTS.md rule 4 and
      KN-TECH-035 forbid" - which is the same discipline this proposal
      applies, from the other direction. NOT PURSUED HERE: this proposal is
      about the factoring linear algebra and makes no TNFS claim.
    - >-
      RECALLED, UNVERIFIED, NOT A CITATION: that the 795-bit discrete
      logarithm was computed modulo a large prime factor l of p-1 of nearly
      full size, hence w_l near 13 64-bit words. If l is materially smaller
      the Part D predictions move proportionally. w_l, b_d, b_f, N_d and d_d
      are ALL Stage-0 acquisitions and none is asserted here.

  lossy_projection_identifiability_audit:
    projection: >-
      An entire record computation - hardware, software, scheduling, months of
      wall clock, terabytes of relations - projected onto the pair
      (matrix bytes streamed, sequential passes), and then onto the single
      dimensionless RATIO of that pair between the discrete-logarithm and the
      factorization run at the same size.
    what_is_discarded: >-
      All absolute scale, all hardware identity, all efficiency, all constants,
      and both problems' relation-collection stages entirely.
    why_genuinely_lossy: >-
      Genuinely and deliberately: the ratio is invariant under any change that
      affects both runs equally, which is the entire cluster and the entire
      software stack. That invariance is exactly what makes the ratio a usable
      comparator and is why the projection is worth making.
    why_compatible_with_the_operations: >-
      Compatible because block Wiedemann's cost decomposes multiplicatively
      into (passes) x (per-pass cost), and the ring the vectors live in enters
      only the second factor while the matrix dimensions enter only through
      the first and through the nonzero count. The retained part therefore
      propagates deterministically: given (N, d_row, b, w_l) the model returns
      one number.
    is_it_only_a_change_of_coordinates: >-
      NO. THE FAILURE CHECKED FOR HERE IS THE MIRROR FAILURE - a projection so
      lossy that it is constant across instances, which would be fatal because
      a comparator with zero spread cannot discriminate. THE CHECK RETURNS
      NON-CONSTANT AND, MORE THAN THAT, RETURNS TWO WELL-SEPARATED VALUES: the
      arithmetic-bound and traffic-bound models give 1664 and 79.4 at identical
      inputs, a factor of 21. A projection whose two candidate laws differ by
      21x on the same input has ample comparator spread. The (Delta, Pi)
      failure - nothing discarded, hence nothing gained - is not live here,
      since the projection discards the entire absolute scale; it is recorded
      as checked and inapplicable.
    identifiability_caveat: >-
      The honest weakness is on the OTHER side of the projection. The entropy
      floor and the wall-clock floor are FLOORS, and the measured record clears
      them by roughly an order of magnitude, so they cannot distinguish a
      correct model from a badly wrong one. Only the ratio in Part D has
      discriminating power, and the contract must weight the three tests
      accordingly rather than reporting three passes as three confirmations.

  predictions:
    - metric: >-
        S_min, the information-theoretic floor on the post-merge RSA-250
        matrix, in bytes, computed as N . log2 C(N, d_row) / 8
      direction: different
      minimum_effect: >-
        EXACTLY 694.2 bytes per row and 2.8115e11 bytes total, CONDITIONAL on
        the transcription N = 4.05e8, d_row = 252. This is a derived floor, not
        a measurement: if primary text reports a stored matrix SMALLER than
        S_min, either the transcription is wrong or the reported figure is not
        the post-merge matrix, and the contract must say which.
    - metric: >-
        Ratio of the reported 250 core-years to the pure-arithmetic lower
        bound 3 N W / (64 . 2.1e9) core-seconds
      direction: higher
      minimum_effect: >-
        AT LEAST 1, and predicted in the band 5 to 100. Conditional
        instantiation: the arithmetic floor is 29.2 core-years at b = 64 and
        3.65 core-years at b = 512, giving ratios 8.6 and 68.5 against the
        relayed 250. A ratio BELOW 1 falsifies the transcription or the
        iteration count outright. THIS TEST HAS LOW POWER and is labelled a
        sanity gate, not a discriminator.
    - metric: >-
        R = (discrete-logarithm linear-algebra cost) / (factorization
        linear-algebra cost) at 795 bits on identical hardware and software,
        normalized by (N_d^2 d_d)/(N_f^2 d_f)
      direction: higher
      minimum_effect: >-
        PRE-DECLARED BRACKETS, FIXED BEFORE THE PUBLISHED VALUE IS READ.
        MODEL-ARITH predicts 128 w_l = 1664 at w_l = 13, admissible band
        [832, 2496] for w_l in [6.5, 19.5]. MODEL-TRAFFIC predicts 832/b_d
        scaled by the index-stream share, giving 79.4 at b_d = 8, admissible
        band [40, 160] for b_d in [4, 16]. The two bands are DISJOINT. A
        measured R inside one band selects that model; a measured R between
        them (roughly 160 to 832) means the stage is neither purely
        compute-bound nor purely bandwidth-bound and the model must be a
        weighted combination whose weight is then MEASURED rather than
        assumed; a measured R outside both is a reproduction failure and
        terminates the extrapolation branch of this goal, which is the
        cheapest possible outcome for the campaign budget.
    - metric: >-
        Sequential depth D = 2N/b of the Krylov stage, and the implied
        wall-clock floor D . S / BW_aggregate
      direction: different
      minimum_effect: >-
        D = 1.27e7 at b = 64 (conditional instantiation), and a wall-clock
        floor spanning 10 hours to 41 days as the aggregate bandwidth spans
        100 TB/s to 1 TB/s. THE PREDICTION IS THE SPREAD ITSELF: two orders of
        magnitude of wall clock are compatible with one core-year figure. If
        primary text reports both a wall-clock and a core-year figure for the
        linear algebra, their quotient gives the effective aggregate bandwidth
        directly, and it must land within the physical range of the reported
        cluster - a genuine falsifier.
    - metric: >-
        Resolution of 130 + 2450 + 250 = 2830 against the headline 2700
      direction: different
      minimum_effect: >-
        Exactly one of the four enumerated explanations, established by
        quotation from primary text, or an explicit record that primary text
        does not settle it. A record that reports the discrepancy as "rounding"
        WITHOUT a quotation supporting that reading fails this metric.

  minimal_test:
    design: >-
      Stages ordered cheapest-first; stages 0 and 1 need no network beyond
      document retrieval and no compute beyond exact integer arithmetic.
      STAGE 0 (acquisition and filing, mandatory under RQ-RSA-afe33c's own
      constraints, and the only stage that can be blocked by the environment):
      obtain and file as KN-LIT the RSA-250 announcement, the RSA-240 / DLP-240
      paper, and the NFS simulation methodology, at stated provenance levels;
      extract N, d_row, b, number of sequences, w_l, wall-clock and core-years
      for EACH of the three computations; resolve or record-as-unresolved the
      2830-versus-2700 discrepancy. STAGE 1 (exact integer arithmetic,
      seconds): compute S_min, the pass count, the sequential depth, the
      arithmetic floor and both Part D model predictions, from the Stage-0
      numbers, in exact integer or Fraction arithmetic. STAGE 2 (comparison):
      evaluate the three predictions against the published measurements, in the
      pre-registered order sanity-gate then depth then ratio, with the ratio's
      brackets frozen before the published DLP linear-algebra figure is looked
      at. STAGE 3: the charged linear-algebra statement required by completion
      criterion 2 - memory footprint, communication requirement, parallel
      scaling law - written with every optimistic assumption individually
      flagged.
    controls:
      - >-
        NULL OBJECT, SAME SHAPE, FORCED VALUE DERIVED PRE-RUN, CAN FAIL. A
        RANDOM SPARSE MATRIX of the identical dimensions and density
        (N = 4.05e8, d_row = 252, uniform support) substituted for the real
        post-merge matrix. Its entropy floor is by construction the same 694.2
        bytes per row, and its pass count and sequential depth are identical.
        FORCED VALUE: every Part A and Part B quantity is UNCHANGED. This null
        can fail in a specific and informative way - if the real matrix's
        stored size is materially BELOW the random matrix's entropy floor, the
        real matrix has exploitable structure (block structure from the merge,
        or the small-prime density gradient), which is a finding in its own
        right and is exactly the structure KN-OPEN-006 asks about. Running the
        null is what converts "the matrix is 281 GB" from a number into a
        statement about whether NFS matrices are compressible beyond generic.
      - >-
        POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR. The Part D ratio
        machinery applied to a case with a KNOWN answer: the same matrix solved
        over GF(2) versus over Z/lZ for a small l fitting in ONE word
        (w_l = 1). MODEL-ARITH then predicts a ratio of 128 and MODEL-TRAFFIC
        predicts 64/b_d times the traffic share - both small and both easily
        checkable on a toy matrix inside this harness. IF THE MACHINERY DOES
        NOT REPRODUCE A MEASURED SMALL-l RATIO ON A TOY MATRIX, THE INSTRUMENT
        IS BROKEN AND NO STATEMENT ABOUT THE RECORD RATIO MAY BE REPORTED.
      - >-
        GRADED CONTROL, FOUR INTERIOR POINTS, MONOTONICITY REPORTED. Predicted
        ratio as a function of w_l in {1, 2, 4, 8, 13}: MODEL-ARITH is exactly
        linear in w_l, MODEL-TRAFFIC is affine in w_l with a nonzero intercept
        from the index stream. The two laws are therefore distinguishable by
        SHAPE and not only by magnitude, and a toy sweep over w_l localizes
        which term is mis-costed instead of leaving "the ratio did not match".
      - >-
        ORDERING CONTROL. The Part D brackets, the null's forced values, and
        the positive control's outcome are computed, written down and
        hash-committed BEFORE the published discrete-logarithm linear-algebra
        figure is read. The published factorization figure may be read first
        because it is the normalizer; the DLP figure is the treatment.
      - >-
        ARCHIVE CHECK, ZERO COMPUTE. Search the corpus for any prior charged
        cost of an NFS linear-algebra stage. RESULT AS OF WRITING: none. The
        nearest records are KN-TECH-008, KN-OPEN-006 and KN-OPEN-025, none of
        which computes one. Recorded as an absence, not as a passed check.
    required_metrics:
      - N, d_row, b, number of sequences, w_l, wall clock and core-years for each of RSA-240, RSA-250 and the 795-bit DLP, each with a page or section reference or an explicit "not stated in the source"
      - S_min per row and in total, in exact integer arithmetic
      - pass count, sequential depth, and the implied aggregate bandwidth if both wall clock and core-years are available
      - both Part D model predictions with their brackets, committed before the DLP figure is read
      - the toy positive-control measurement at w_l = 1 and the graded w_l sweep
      - a verbatim resolution of the 2830-versus-2700 discrepancy, or an explicit statement that primary text does not resolve it

  falsification_conditions:
    - >-
      The reported linear-algebra core-years fall BELOW the pure-arithmetic
      floor 3 N W / 64 divided by the clock rate. The iteration count, the
      density, the dimension or the transcription is then wrong, and the whole
      instrument is withdrawn until it is found.
    - >-
      A stored post-merge matrix size below S_min is reported. Either the
      transcription is wrong or the matrix is not what it is described as.
    - >-
      The measured cross-problem ratio lands outside both pre-declared
      brackets. Neither cost model reproduces the record. THIS IS A RESULT,
      NOT A SETBACK: it closes the campaign's most expensive branch before any
      RSA-2048 table is built, which is precisely what GOAL-RSA-001's
      next_action asks the first gate to do.
    - >-
      The toy positive control at w_l = 1 does not reproduce its predicted
      ratio. No statement about the record ratio may then be made at all.
    - >-
      Primary text shows the two 795-bit computations did NOT share hardware
      and software. The cancellation argument in Part D collapses and the
      ratio test must be withdrawn or re-derived with an explicit hardware
      normalization.
    - >-
      Primary text reports a blocking width or sequence count so far from the
      Part C optimum that the balance argument is refuted. The parallel scaling
      law as stated is then wrong.

  confounders:
    - >-
      TRANSCRIPTION IS THE DOMINANT RISK. Every conditional number here rests
      on figures the source question itself labels unverified excerpt material,
      and one of them is already internally inconsistent by 130 core-years.
      Stage 0 exists to remove this confounder and no stage past it may run on
      the excerpt figures.
    - >-
      CORE-YEARS ARE NOT COMPARABLE ACROSS PHASES. Sieving is compute- and
      latency-bound and vectorizes; linear algebra is bandwidth- and
      synchronization-bound. Summing them into a single "2700 core-years"
      adds quantities whose binding resource differs, which is why the sum is
      not obviously meaningful even before the 2830 discrepancy. This is a
      criticism of the UNIT, not of the record computation, and it must be
      written that way.
    - >-
      THE FLOORS ARE FLOORS. Two of the three tests can only fail catastrophically
      and cannot confirm. Reporting three passed tests as three confirmations
      would be exactly the over-reading this program's control discipline
      exists to prevent.
    - >-
      MODEL-TRAFFIC's b_d AND MODEL-ARITH's w_l ARE BOTH UNKNOWN UNTIL STAGE 0.
      With two free integers there is a temptation to fit. The brackets are
      therefore declared over the plausible RANGES of both, before reading, and
      the ranges are stated as ranges rather than as point values.
    - >-
      FILTERING AND MERGE IS UNCOSTED HERE TOO. This proposal charges the
      solve, not the funnel that produces the matrix. If the funnel is a
      comparable cost - and Part E raises the possibility that it is missing
      from the published breakdown entirely - then a charged model of the
      solve alone is still an incomplete charged model, and it says so.

  interpretation_limits:
    - >-
      A statement about a cost model and about published measurements. NOT a
      factorization, NOT an attack, NOT a statement about any deployed RSA key,
      and NOT a claim that any published record is wrong. Finding a
      transcription discrepancy in a search excerpt is a statement about the
      excerpt.
    - >-
      Scope is 795-bit and 829-bit record computations. Nothing here transfers
      to RSA-1024, RSA-2048 or RSA-3072, and this goal's next_action explicitly
      forbids building that table before the reproduction gate passes. This
      proposal does not build it.
    - >-
      A passed ratio test validates the CHARGING CONVENTION at one size on one
      cluster with one software stack. It is not evidence that the convention
      extrapolates, and any extrapolation remains conditional on numbered
      heuristics stated elsewhere.
    - >-
      The Part D cancellation argument is only as good as the
      same-hardware-same-software sentence, which is currently a relayed
      abstract claim in a bulk-seeded corpus entry.

  heuristic_assumptions:
    - id: HEUR-LA-1
      statement: >-
        (Streaming.) For all record-scale NFS matrices, the matrix does not fit
        in any level of cache, so each block-Wiedemann pass moves at least
        S_min bytes from main memory or from the network, and the total
        matrix traffic is at least (3N/b) . S_min.
      rigorous_support: >-
        S_min is an entropy bound and is rigorous given the dimensions; the
        does-not-fit-in-cache premise is arithmetic at the relayed dimensions
        (281 GB against cache sizes measured in megabytes) and is not a
        heuristic at record scale. What IS heuristic is "at least once": a
        sufficiently clever blocking could in principle reuse a resident
        submatrix across several logical passes. No such scheme is known to
        this record and none is assumed to be impossible.
      validation_plan: >-
        Falsified if primary text describes a formulation that touches the
        matrix fewer than 3N/b times. Checked at Stage 0.
    - id: HEUR-LA-2
      statement: >-
        (Cancellation.) All implementation-dependent efficiency factors of the
        2020 experiment are common to its factorization and its discrete
        -logarithm runs, so they cancel in the ratio R to within a factor of 2.
      rigorous_support: >-
        Rests entirely on the relayed claim that both were run with the same
        hardware and software. Even granting it, the two stages exercise the
        machine differently - GF(2) is a pure XOR-gather workload, mod-l is a
        multiply-accumulate workload with different vectorization - so
        "cancels to within a factor of 2" is an assumption and not a
        derivation. It is the load-bearing assumption of the strongest test in
        this proposal and is flagged as such.
      validation_plan: >-
        The factor-of-2 tolerance is already inside the width of the
        pre-declared brackets (both span a factor of 3 or more), so the test
        survives a moderate violation. A violation larger than that would need
        the two runs' efficiencies to be independently reported, which they
        probably are not; if so, the test's power is reported as reduced rather
        than the assumption being quietly strengthened.
    - id: HEUR-LA-3
      statement: >-
        (Iteration count.) Block Wiedemann with left width m and right width n
        performs N/m + N/n Krylov block-products and N/n solution
        block-products, so the vector-iteration total is N(n/m + 2) and lies in
        [2.5N, 3N] for m in [n, 2n].
      rigorous_support: >-
        RECALLED FROM THE STRUCTURE OF THE ALGORITHM, NOT QUOTED FROM
        KN-LIT-017. The Krylov sequence must be long enough for the block
        Berlekamp-Massey step to determine a generating matrix polynomial,
        which is where N/m + N/n comes from. This is a candidate to check and
        it is the single recalled quantity that most of Part B and all of
        Part D rest on.
      validation_plan: >-
        Stage 0 verifies it against KN-LIT-017 or the CADO-NFS documentation.
        If it is wrong, every pass count and both Part D predictions move by
        the same factor and the RATIO test survives unchanged - which is a
        further reason to weight the ratio test above the floors.

  target_complexity:
    time_exponent: >-
      n/a for this audit. NO EXPONENT IS MOVED AND NONE IS CLAIMED. Stated
      plainly because the house bias is exponent-first and this proposal is
      not an exponent proposal: it is the measurement instrument without which
      the exponent proposal IDEA-20260805-1775f2 cannot be calibrated against
      anything. The exponent that proposal moves is 1.9230 to 1.9496; this one
      supplies the data that would say which of those the world is in.
    memory_exponent: >-
      The whole point. S = N . d_row, instantiated at 281 GB for RSA-250, with
      the sequential depth 2N/b and the aggregate-bandwidth requirement stated
      beside it. Reporting the linear algebra in core-years alone omits
      exactly these.
    best_known: >-
      The published record figures themselves, which are time-only. There is
      no charged NFS linear-algebra cost in this corpus to improve on; that
      absence is the gap GOAL-RSA-001 exists to fill.
    hidden_overhead: >-
      Filtering and merge, charged nowhere and possibly missing from the
      published phase breakdown; polynomial selection's memory; the block
      Berlekamp-Massey stage, whose cost in b is recalled and unverified; the
      network fabric, which the sequential-depth argument requires but which no
      record figure in this corpus describes.
    tradeoff_note: >-
      b is the tradeoff knob and it trades WALL CLOCK against BERLEKAMP-MASSEY
      COST at constant total work. That is a genuine time-memory-communication
      tradeoff and completion criterion 2 requires it stated; Part C states it
      and names the unverified exponent it needs to close.

  dominated_by: >-
    n/a (no algorithm proposed, no Pareto point claimed). Rows checked before
    setting this: on TIME, the published record figures are the incumbents and
    this proposal does not compete with them, it audits them; on MEMORY, no
    incumbent exists in this corpus - KN-TECH-008 describes sparse solvers
    without charging them, KN-TECH-035 charges memory but computes no factoring
    number, KN-TECH-057 does the isogeny analogue, KN-LIT-2663 gives an
    area-time exponent but no concrete matrix footprint, and KN-OPEN-006 and
    KN-OPEN-025 ask for exactly this and have no owning experiment; on
    DATA/QUERIES, the axis is degenerate for factoring (one integer input, no
    oracle) and is recorded as checked rather than dropped; on
    PREPROCESSING, the relation files themselves are the preprocessing and
    this proposal charges only the solve, which is stated as an incompleteness
    under hidden_overhead rather than claimed as a scope choice.
  sota_delta: >-
    No attack, no speedup; a measurement and provenance contribution, stated
    quantitatively as what it would add to the corpus. Currently 0 records in
    this program state a memory footprint, a sequential depth, or a
    communication requirement for any NFS computation; this proposal would
    supply 3 numbers per record computation for 3 record computations, plus one
    cross-problem ratio with two pre-declared, disjoint, order-of-magnitude-
    separated predictions (1664 versus 79.4, a factor of 21). Against the
    published record it changes no reported number; it states which of them can
    be compared with which.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.60 that the instrument reaches a decisive reading. It is not higher
    because the entire line is gated on Stage-0 document acquisition, because
    b, b_d, w_l, N_d and d_d are all unknown to this corpus and any of them
    being unreported in primary text weakens or kills the ratio test, and
    because the two floors have acknowledged low power. It is not lower
    because the ANGLE-BRIEF measured ePrint abstract pages, arXiv and
    author-hosted PDFs as reachable this session (only eprint PDF bodies
    return 403), because CADO-NFS's own announcement and the PRACE talk are
    author-hosted rather than eprint-gated, and because the arithmetic is
    exact integer work with no solver dependency in a container whose
    scientific-Python state is itself disputed. Separately: 0.35 that the
    cross-problem ratio lands cleanly inside one of the two brackets, 0.45
    that it lands between them and forces a weighted model, and 0.20 that it
    lands outside both - and the last outcome is the one that closes the
    campaign's expensive branch, so a low probability on it is not a reason
    against running.
