idea:
  id: IDEA-20260816-b7a34b
  question_id: RQ-SNFS-005666
  added: '2026-08-16'
  title: Calibrate the selection inflation of a K-statistic distinguishing battery before any trapdoored
    prime exists, by running the battery on two identically generated honest classes with fabricated
    labels and measuring the null distribution of the maximum separation over K, which fixes the threshold
    a real battery must clear
  class: control
  claim: '(A) THE FREEZE RULE IS NECESSARY AND NOT SUFFICIENT. RQ-SNFS-005666 requires the statistic
    battery to be frozen before the prime classes are generated, and GOAL-SNFS-001 charges the Red
    Team with verifying the freeze order. Freezing prevents a statistic being chosen after seeing
    which one separates. It does not prevent the remaining, unavoidable inflation: with K frozen statistics,
    the maximum separation over K is larger than any single statistic''s separation even under a perfect
    null, and a battery that reports its best statistic without accounting for K is overstating by
    a computable amount. (B) THE CALIBRATION. Generate two samples from the IDENTICAL honest generator
    with different seeds, label one arm A and the other arm B arbitrarily, and run the frozen battery.
    Every statistic is measuring pure noise by construction. Record the maximum over the K statistics
    of the separation, repeat over many independent label assignments and seed pairs, and the resulting
    distribution of the maximum IS the threshold the real battery must clear. This requires no trapdoored
    prime, no special-form construction, and no literature. (C) THE DELIVERABLE IS A NUMBER AND A
    RECEIPT. The number is T(K, N, alpha), the alpha-quantile of the maximum separation under the
    null at battery size K and sample size N. The receipt is a hash of the battery file, the sample
    sizes and the scoring path, emitted before generation and referenced by any later detectability
    record. Together they convert the freeze rule from a procedural instruction into a checkable artifact.
    (D) WHY IT MATTERS HERE SPECIFICALLY. The most likely outcome of the whole detectability campaign
    is a non-separation, and the second most likely is a weak separation on one statistic out of many.
    Without T, those two outcomes are indistinguishable in the record, and the second will be written
    up as a finding. With T, the second is correctly recorded as inside the inflation band. (E) WHAT
    IS NOT CLAIMED. No detector, no separation, no statement about trapdoors, and no claim that any
    particular battery is adequate or inadequate. The claim is only that T is measurable in advance,
    that its measurement costs nothing compared with the campaign, and that a battery reported without
    it cannot be interpreted. It is a control, and controls do not have results about the world.'
  mechanism: 'STAGE ONE: freeze the battery of K statistics, the separation measure and the sample
    sizes, and emit a hash receipt. STAGE TWO: generate 2M independent samples of N primes each from
    one honest generator, all with distinct recorded seeds. STAGE THREE: pair them arbitrarily into
    M label assignments, each pair giving a fabricated A-versus-B contrast in which no real difference
    exists. STAGE FOUR: for each pair, compute all K separations and record their maximum, producing
    an empirical distribution of the maximum over M replicates. STAGE FIVE: read off T at the declared
    quantiles and also record the distribution of the per-statistic separations, since if any individual
    statistic is systematically off chance the generator or the scoring path is broken and T is meaningless.
    STAGE SIX: sweep K by taking nested subsets of the battery and sweep N, producing T as a surface
    rather than a single number, since a later record may use a different battery size or sample size
    and must be able to read its own threshold. STAGE SEVEN: validate against the analytic expectation,
    since under independence the maximum of K chance separations has a known extreme-value form, and
    a large discrepancy indicates the statistics are strongly correlated, which is itself worth measuring
    and reporting because a correlated battery has a smaller effective K than its nominal one. The
    control is established when T is stable across replicates and the effective K is reported alongside
    the nominal one; it fails if per-statistic separations are off chance, in which case nothing downstream
    is interpretable.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read in full: RQ-SNFS-005666, whose constraints require the frozen battery, and GOAL-SNFS-001,
      whose next_action states that the battery must be committed with its own hash before a single
      prime is generated. Read docs/inventor-protocol.md section 3. Greps: grep -ril -E ''multiple
      comparison|max-of-K|look-elsewhere|selection inflation'' ledger/proposals/ ledger/hypotheses/,
      which returned seven files, headers inspected; grep -ril -E ''ROC|false.positive rate'' ledger/proposals/.'
    results: The multiple-comparison grep returned records under RQ-CLGP-b99df5, RQ-ECDLP-002 and
      neighbouring questions, including IDEA-20260807-4e8da3 and IDEA-20260807-a3d644, which are class-group
      and isogeny arguments where the phrase appears incidentally; none of them calibrates a max-over-K
      null distribution as a deliverable. The batch briefing names IDEA-20260815-bc26a3 as owning
      the program's own false-positive rate, which is a program-level audit of research outcomes;
      this record instead calibrates one specific statistical battery for one specific class before
      it is used, and produces a threshold artifact rather than a program verdict. No record in the
      corpus emits a battery hash receipt.
    verdict: 'UNVERIFIED. Nothing about external literature is asserted. Claimed new relative to this
      repository: the packaging of a max-over-K null calibration plus a battery freeze receipt as
      a standalone prerequisite artifact for the SNFS detectability campaign, together with the effective-K
      measurement that reports how much correlation shrinks the nominal battery size. Assembled from
      known parts: multiple-comparison correction and extreme-value reasoning are entirely standard,
      and the freeze requirement is already written into RQ-SNFS-005666 and GOAL-SNFS-001. What is
      offered is the artifact, not the idea that inflation exists.'
  object_first_candidate:
    tracked_object: The maximum, over the K frozen statistics, of the two-sample separation between
      two identically distributed samples, followed as a random variable across independent replicates.
      The object is that maximum and its distribution, not any individual statistic and not any prime.
    lossiness: Genuinely lossy, and deliberately so. Each replicate begins with 2N primes, roughly
      2N times n bits of information, and is projected to K separations and then to a single maximum.
      Everything about the primes is discarded, including which generator produced them, since both
      arms use the same one. The maximum still propagates because the operation that matters, enlarging
      the battery from K to K+1, acts on the maximum directly by a max with one more term, requiring
      nothing about the discarded primes. The honest limitation is that the maximum discards which
      statistic attained it, and the correlation structure that determines the effective K lives in
      that discarded information, which is why the per-statistic distribution is retained separately.
    propagation: One step of the target operation is K maps to K+1, adding a statistic to the battery.
      Under independence the null distribution of the maximum shifts upward by the expected increment
      of an extreme-value maximum, so the alpha-quantile T grows like the appropriate quantile of
      the K+1-fold maximum, which for a roughly Gaussian per-statistic null grows like sqrt(2 log
      K) in standardised units. Under correlation the shift is smaller, and the ratio between the
      observed shift and the independent prediction defines the effective K. That ratio is the propagation
      measurement and it is what a later record actually needs.
    survival_score: 'The calibration survives exactly as far as the frozen battery and the fixed sample
      size do: T is valid for the exact K, N, scoring path and generator it was measured with, and
      it dissolves the moment any of the four changes, which is why the deliverable is a surface over
      K and N rather than a scalar. Concretely, at N = 2000 and K up to 20 the surface is measured
      on a grid of nested subsets, and outside that grid the specification requires re-measurement
      rather than interpolation.'
  null_object_control: 'The entire experiment IS a null-object control, which creates an unusual obligation:
    it needs its own control to show it has power. That control is a spiked replicate, in which one
    arm is drawn from a deliberately different generator so that a known separation exists, and the
    calibration must place that replicate far above T. Without the spiked arm, a T computed from a
    broken pipeline that always returns chance would look perfect. The null must therefore show two
    things: all per-statistic separations at chance across replicates, and the spiked replicate exceeding
    T at the declared quantile.'
  discriminated_from:
  - 'The generator-attribution control in this batch: that one measures whether a statistic sees the
    generator, using two DIFFERENT honest generators. This one uses the SAME generator twice and measures
    inflation from battery size. They are complementary and neither substitutes for the other.'
  - 'IDEA-20260815-bc26a3, the program''s own false-positive rate, named as saturated in this batch
    briefing: that audits the research program''s outcomes across records. This calibrates one battery
    for one class and emits a threshold and a hash receipt.'
  - 'IDEA-20260807-4e8da3 and IDEA-20260807-a3d644 under RQ-CLGP-b99df5: surfaced by the multiple-comparison
    grep, but those are class-group and isogeny arguments in which the phrase is incidental and no
    null calibration is produced.'
  - 'A generic shuffled-label permutation test: that is a control on one statistic within one experiment.
    This measures the distribution of the maximum across a battery and across independent sample pairs,
    and emits a reusable threshold surface rather than a per-experiment p-value.'
  assumptions:
  - Two samples from the same generator with different seeds are identically distributed, which is
    true by construction and is the entire basis of the calibration.
  - The separation measure is exchangeable under label swapping, checked by the symmetry of the measured
    distribution.
  - M replicates are enough to estimate the alpha-quantile of the maximum with useful precision, which
    is checked by bootstrap on the replicate set itself.
  - The battery statistics are pure functions with no free parameters, enforced by the hash receipt
    taken before generation.
  predictions:
  - metric: per-statistic separation under the null, averaged over replicates
    direction: different
    minimum_effect: 0.5 within the bootstrap band for every statistic; any excursion voids the calibration
  - metric: T at K = 10, N = 2000, alpha = 0.05, in area-under-the-curve units
    direction: higher
    minimum_effect: strictly above the single-statistic 0.05 threshold, by at least 0.01 area-under-the-curve
      units
  - metric: effective K, that is the K that reproduces the observed maximum distribution under an
      independence model
    direction: lower
    minimum_effect: 'no pre-commitment: the correlation structure of the frozen battery is unknown
      before it is measured, and stating a number now would be inventing the answer'
  - metric: spiked-replicate separation relative to T
    direction: higher
    minimum_effect: the spiked replicate must exceed T at alpha = 0.05, otherwise the calibration
      has no demonstrated power
  minimal_test:
    design: 'One generator, many seeds, one battery. Freeze ten statistics computable from p alone
      and hash the file. Generate 200 independent samples of 2000 primes each at n = 64 from a single
      honest generator, all seeds recorded. Form 100 arbitrary pairs, and for each pair compute all
      ten separations and take the maximum. The empirical distribution of those 100 maxima gives T
      at the 0.95 and 0.99 quantiles directly. Add ten spiked pairs in which one arm comes from a
      deliberately different generator, and confirm they land above T. The discrimination requires
      no modelling at all: the null is exact by construction, so the only failure modes are implementation
      ones, and both are checked, namely per-statistic chance behaviour and spiked power. Cost is
      400000 prime generations at 64 bits plus ten cheap statistics each, tens of minutes in pure
      Python and a few tens of megabytes.'
    controls:
    - The spiked-replicate arm, which must exceed T and demonstrates the calibration has power.
    - Per-statistic chance verification across replicates, which must hold for every statistic individually.
    - A label-symmetry check, swapping A and B within each pair, which must leave every separation
      unchanged in magnitude.
    - A seed-independence check, confirming no correlation between replicates sharing adjacent seeds.
    - A nested-subset sweep over K to confirm T is monotone increasing in K, which it must be by construction.
    required_metrics:
    - distribution of the maximum separation over K across replicates
    - T at declared quantiles for each (K,N) grid point
    - per-statistic mean separation and its bootstrap interval
    - effective K against nominal K
    - spiked-replicate separations relative to T
    - battery hash receipt and its timestamp relative to generation
  falsification_conditions:
  - Any individual statistic deviates from chance across replicates, voiding the calibration because
    the null is broken.
  - T is not monotone increasing in K, which is impossible under a correct implementation and therefore
    indicates a bug.
  - The spiked replicates do not exceed T, showing the calibration cannot detect a separation that
    exists and is therefore useless as a threshold.
  - T varies materially between disjoint halves of the replicate set, meaning it is not estimable
    at this M.
  - The label-symmetry check fails, indicating the separation measure is not exchangeable and the
    whole construction is invalid.
  confounders:
  - Seeds drawn from a single stream can correlate across replicates if the generator state is not
    reset, which would narrow the measured null and understate T.
  - Statistics that are algebraic functions of one another shrink the effective K without changing
    the nominal one, and reporting only nominal K overstates the correction.
  - Sample size N interacts with the separation measure's variance, so T measured at one N does not
    apply at another, which is why the surface is required.
  - A generator with a subtle periodicity would produce non-chance per-statistic behaviour and be
    mistaken for a scoring bug or vice versa.
  - Bootstrap intervals on quantiles of a maximum are less reliable than on means, so the precision
    of T is itself uncertain and must be reported.
  interpretation_limits:
  - 'T is a threshold, not a result: exceeding it is necessary for a separation claim and nowhere
    near sufficient, since generator attribution and accidental base rates still apply.'
  - T is valid only for the exact battery, sample size, scoring path and generator measured, and must
    be re-measured otherwise.
  - Nothing about trapdoors, detectability or any parameter set follows from this control in either
    direction.
  - A battery with a small effective K is not thereby a bad battery; the number describes redundancy,
    not quality.
  target_complexity:
    time_exponent: No attack exponent is claimed and nothing is attacked. Instrument cost is 2 M N
      prime generations plus K statistic evaluations each, so linear in every parameter, with prime
      generation dominating at O(n^3) bit operations per Miller-Rabin candidate.
    memory_exponent: No attack memory exponent is claimed. The score matrix is O(M N K) reals if retained
      in full, a few tens of megabytes at the stated parameters, and can be streamed to O(M K) by
      computing separations online.
    best_known: The incumbent is the procedural instruction in RQ-SNFS-005666 and GOAL-SNFS-001 to
      freeze the battery, which supplies no threshold. This repository holds no max-over-K calibration
      and no battery hash receipt for any campaign, so there is no numerical incumbent. No external
      baseline is asserted.
    hidden_overhead: The hidden overhead is that a correctly measured T makes weak results disappear,
      and every incentive in a campaign pushes against running it first. There is also a real cost
      in prime generation, since the calibration needs far more primes than the detectability measurement
      itself, which is a genuine reason it tends not to get done and is stated plainly rather than
      minimised.
  dominated_by: n/a for attack claims, none is made. As a control, I checked every record surfaced
    by the multiple-comparison and ROC greps, including IDEA-20260807-4e8da3 and IDEA-20260807-a3d644,
    plus the program-level self-audit record named in the briefing, and none produces a reusable max-over-K
    threshold, so the frontier is empty by direct check. Against the cheaper alternative of a per-experiment
    shuffled-label permutation test, this is dominated on cost and dominates on reusability, since
    a permutation test must be rerun inside every experiment while T is measured once per battery;
    that two-row comparison is the honest frontier.
  sota_delta: No attack; control and instrument contribution only. Quantitatively the delta is from
    a procedural rule with no number to a measured threshold surface T(K,N,alpha) with an effective-K
    correction and a hash receipt, at a cost of roughly 4 times 10^5 prime generations. Nothing is
    faster and no attack figure changes.
  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'That T is measurable and stable at the stated parameters: about 0.9,
    since the null is exact by construction and only implementation errors threaten it. That the spiked
    control demonstrates power: about 0.9 for the same reason. That the effective K is materially
    below the nominal K, meaning the battery is redundant: about 0.6, since cheap statistics of integers
    tend to be correlated. That running this first actually changes how the campaign''s headline detectability
    record is written: about 0.5, which depends entirely on scheduling rather than on the mathematics,
    and that dependence is why the recommended priority is high.'
