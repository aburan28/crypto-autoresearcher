idea:
  id: IDEA-20260904-7fd218
  added: '2026-09-04'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SATIC-1ae57a
  title: >-
    Two-axis factor attribution for the pdp - every toggleable ingredient moves
    EITHER the leaf count OR the cost per leaf, never both, and the leaf-count
    budget is exactly log2(blowup from a bad backdoor) plus log2|G| with nothing
    left for the solver brand

  class: measurement

  claim: >-
    SCOPE: symmetrized S_{m+1} pdp over F_{2^n} descended to F_2, and the direct
    model of src/semaev_tree.py; m = 3 primarily, m = 4 as one out-of-sample
    cell; l in 6..8; CNF and CNF-XOR encodings; DPLL and CDCL solvers available
    as Python-bindable or in-harness. CLAIM TIER toy. NO ATTACK, NO EXPONENT
    IMPROVEMENT.

    (A) THE ATTRIBUTION CLAIM. Write total pdp solving cost as
    T = N_leaf x c_leaf and measure the two factors SEPARATELY. Then each of the
    six toggleable ingredients below moves exactly one of the two by more than
    20%, and the assignment is:

        ingredient                              N_leaf      c_leaf
        F1 encoding: CNF vs CNF-XOR vs ANF        no          YES
        F2 core-variable branching order          YES         no
        F3 native XOR propagation vs CNF parity   no          YES
        F4 clause learning on/off                 no          YES
        F5 Gaussian elimination on/off            no*         YES (worse)
        F6 m! symmetry breaking on/off            YES         no

    (* F5 is predicted to reduce N_leaf by at most 2%, which is why it is a
    net loss; the mechanism is IDEA-20260904-e12b5a.)

    (B) THE BUDGET CLAIM, ADDITIVE IN LOG2. On UNSAT instances,
    log2 N_leaf = ml + B(order) - log2|G|, where B(order) >= 0 is the BACKDOOR
    BLOWUP of the branching order used: B = 0 for any order restricted to the ml
    core variables, and B > 0 for an order that decides substituted monomial
    variables. All of F2's contribution is B(order) -> 0, and all of F6's is
    log2|G| = log2(m!) = 2.585 bits at m = 3 and 4.585 bits at m = 4. Nothing
    else contributes to this axis. In particular the CNF-XOR model contributes
    ZERO bits of leaf reduction relative to the CNF model at equal branching
    order -- its entire benefit is on the c_leaf axis via a ~6.5x smaller
    variable count and a ~8x smaller clause count (Table 1 of the frozen source,
    l = 6, n = 19: 5019 vars / 19577 clauses for CNF versus 767 vars / 2364 cnf
    clauses + 52 xor clauses for CNF-XOR).

    (C) THE CONSEQUENCE FOR THE SOURCE'S THREE ANOMALIES, EACH BECOMING A
    TESTABLE STATEMENT RATHER THAN A PUZZLE.
      C-a. "The win is the model, not the solver" (claim C2) is restated as: F2
           carries the whole leaf-axis effect, so patching a core-variable order
           into ANY complete solver recovers the whole leaf-axis gain, and what
           remains is c_leaf.
      C-b. The residual gap between a generic CDCL solver with the core order
           and a dedicated XOR solver is predicted to be ENTIRELY c_leaf, with
           the two leaf counts agreeing within 5%. Predicted contributors to
           c_leaf, each separately toggleable: clause-database growth and
           restart bookkeeping (F4), parity re-derivation through CNF instead of
           a native XOR set (F3), and dynamic versus static memory allocation.
      C-c. A solver with NO XOR reasoning outperforming an XOR-aware one
           (CaDiCaL versus CryptoMiniSat on the CP 2020 slide) is restated as a
           statement about B(order): predicted MECHANISM is that CaDiCaL's
           activity heuristic concentrates its DECISIONS on the ml core
           variables by itself, achieving B ~ 0 without being told, while the
           other solver does not. This is directly measurable as
           core_decision_fraction = (decisions on core variables) / (total
           decisions), predicted >= 0.8 for the solver with the smaller leaf
           count and <= 0.4 for the one with the larger, on the SAME instance.
           If the two solvers have similar core_decision_fraction but very
           different leaf counts, C-c is false and the anomaly is something
           else.

    (D) WHAT WOULD FALSIFY THE WHOLE FRAMING. Any ingredient that moves BOTH
    axes by more than 20% breaks the additive decomposition and means the two
    factors are not separable, in which case the correct model is not
    T = N x c and the record says so and stops.

  mechanism: >-
    WHY THE TWO AXES SHOULD SEPARATE. In a complete backtracking search the leaf
    count is determined by (i) which variables are decided, and (ii) which
    subtrees are pruned. Under Proposition 1 of the frozen source the ml core
    variables are a strong backdoor with respect to unit propagation, so an
    order restricted to them has tree height exactly ml; an order that decides
    substituted monomial variables instead has height up to the full variable
    count (767 at l = 6, n = 19 in the CNF-XOR model; 5019 in the CNF model),
    and the excess height is wasted because those variables are functionally
    determined by the core ones. That is B(order), and it is a property of the
    ORDER, not of the solver's propagation machinery. Pruning, meanwhile, is
    what IDEA-20260904-3c7a91 claims is absent above the leaf level in this
    model. If both hold, N_leaf is a function of (ml, B(order), |G|) alone --
    which is precisely the additive log2 budget of (B).

    Everything else a solver does -- how it stores clauses, whether it learns,
    whether parity is derived natively or re-derived through 2^{k-1} CNF clauses
    per XOR of size k (equation (9) of the source), whether it maintains a GF(2)
    matrix -- changes the WORK PER NODE and cannot change which nodes are
    visited, because it cannot change what unit propagation entails. Clause
    learning is the one ingredient that could in principle move both axes, since
    a learnt clause can prune; the prediction that it does not is a direct
    consequence of the no-above-leaf-pruning mechanism, and it is the sharpest
    single test of that mechanism.

    THE LOSSY-PROJECTION TEST. The tracked object is the ORDERED PAIR
    (visited-node count, per-node work), i.e. the projection of a solver run
    onto the two-dimensional "search-size / node-cost" plane, discarding the
    identity of every node, the clause database, the assignment trail, and the
    entire proof the solver constructs. It is genuinely lossy: the fibre over a
    point of the plane contains every run with that many nodes at that cost, an
    enormous set. The discarding is COMPATIBLE with the solver's operations
    because the two coordinates evolve under disjoint mechanisms -- decide and
    backtrack change the node count and never the per-node cost; learn, restart,
    allocate and propagate change the per-node cost and, IF the no-pruning
    mechanism holds, never the node count. That disjointness is exactly the
    deterministic-propagation property the test demands, and it is also the
    claim being tested, which is the honest position: the projection is
    well-founded if and only if (A) is true, and the experiment measures
    precisely that. The projection that FAILS the test and is therefore rejected
    as the object: total wall clock, which loses the factorisation and is a
    single number that six different ingredients can move for six different
    reasons -- the shape of every solver benchmark, and the reason claim C6 as
    stated cannot answer this RQ's decision_target.

  novelty_status: unverified

