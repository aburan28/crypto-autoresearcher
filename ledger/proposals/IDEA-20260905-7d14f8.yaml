idea:
  id: IDEA-20260905-7d14f8
  title: Local-chart gluing certificates for curve-model conversion
  class: representation
  claim: A finite atlas of rational coordinate maps with compatible local completions can certify that a conversion
    preserves the group identity and all declared rational points, while separating isomorphisms from isogenies.
  mechanism: Track rational-map domains and transition functions. Cross-multiplication proves the map identities
    only where denominators are invertible; at each excluded point, a local parameter or a second projective chart
    must supply a compatible image. Gluing then gives a total morphism on the smooth projective curve. A separate
    inverse-composition certificate distinguishes degree-one equivalence from a degree-d isogeny with a kernel.
    This prevents a removable chart singularity from being confused with a missing group element, and prevents equal
    curve orders from being used as an inverse-map proof. The prospective structural gain is a reusable atlas proof
    whose coefficient specialization is cheap once exceptional loci are certified.
