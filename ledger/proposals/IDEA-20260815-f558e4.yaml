idea:
  id: IDEA-20260815-f558e4
  question_id: RQ-PROP-24458b
  added: '2026-08-15'
  title: >-
    THE PROPAGATION CEILING, AND WHY THE EXTREMAL OBJECT IS THE ONE YOU CANNOT
    COMPUTE: Cauchy-Davenport forces the STRICT propagation rate of every
    balanced lossy partition of a prime-order subgroup to be exactly ZERO, not
    merely below 1; and under the majority (best-F) relaxation the only partitions
    that sustain a rate independent of the fiber count are ARITHMETIC PROGRESSIONS
    IN THE DISCRETE-LOG COORDINATE -- which is to say BSGS and kangaroo -- while
    every efficiently computable coordinate-derived statistic is pinned to the
    1/s baseline within the Weil scale O(N^-1/2), closing escape E1 with a named
    obstruction instead of a fatigue report
  class: theory

  claim: >-
    (A) THE GAP THIS FILLS, STATED IN THE OWNING RECORD'S OWN WORDS.
    IDEA-20260807-df906f proved that on a prime-order group every EXACTLY
    propagating projection is injective or constant, and then listed four escapes.
    Its interpretation_limits say: "Theorem (A) is a statement about EXACT
    propagation only. It does not bound probabilistic propagation, and nothing in
    this record may be cited as closing the probabilistic regime." Escape E1 says
    the theorem "forces q < 1 for any lossy v, but says NOTHING about how far
    below 1." THIS RECORD SUPPLIES THE MISSING BOUND. It is the successor that
    record's own text asks for, and it uses a tool -- additive combinatorics in
    Z/N -- with ZERO occurrences anywhere in this repository's ledger or
    knowledge corpus (see novelty_screen).

    (B) THE TWO NOTIONS OF PROPAGATION, WHICH MUST NOT BE CONFLATED, AND WHICH
    THIS RECORD SEPARATES BEFORE MEASURING ANYTHING. Let G be the prime-order
    subgroup, |G| = N prime, and let v: G -> S be a statistic with |S| = s, fibers
    A_1..A_s partitioning G.
      STRICT propagation q_strict = the fraction of pairs (R,R') for which the
      fiber of R+R' is FORCED by the pair of fibers (v(R), v(R')) -- i.e. the
      pairs (i,j) with A_i + A_j contained in a single fiber.
      MAJORITY propagation q_maj = max over all functions F: SxS -> S of
      Pr_{R,R'}[v(R+R') = F(v(R), v(R'))]. This is the notion symmetric-key
      cryptanalysis actually uses (a bias/correlation), and it is the notion E1
      means. Its trivial baseline is 1/s -- guess the largest fiber -- and the
      quantity of interest is the ADVANTAGE q_maj - 1/s, never q_maj itself.
    CONFLATING THESE TWO IS THE SINGLE EASIEST WAY TO PRODUCE A FALSE POSITIVE
    HERE, because q_strict = 0 and q_maj = 1/2 can hold for the SAME object.

    (C) SUB-RESULT 1 -- THE STRICT RATE IS IDENTICALLY ZERO, BY CAUCHY-DAVENPORT.
    Cauchy-Davenport: for nonempty A, B in Z/N with N prime,
    |A + B| >= min(N, |A| + |B| - 1). If the pair (i,j) is strictly determined
    then A_i + A_j is inside some fiber A_m, so
    a_m >= min(N, a_i + a_j - 1) where a_i = |A_i|. For a BALANCED partition
    (a_i = N/s for all i) with 2 <= s < N this reads N/s >= 2N/s - 1, i.e.
    N/s <= 1, i.e. s >= N -- false. Hence NO pair is strictly determined and
    q_strict = 0 EXACTLY. This sharpens the rigidity theorem from the qualitative
    "q < 1" to a quantitative vanishing, and it does so with a classical theorem
    rather than a measurement. For UNBALANCED partitions the same inequality
    a_i + a_j - 1 <= a_max confines the strictly determined pairs to the small
    fibers and bounds q_strict <= (a_max' / N)^2 where a_max' is the largest fiber
    admitting a determined pair; the s = 2 case works out to q_strict <= 1/9,
    attained only under a sum-free-type condition on the small fiber.

    (D) SUB-RESULT 2 -- UNDER THE MAJORITY RELAXATION THE EXTREMAL OBJECTS ARE
    ARITHMETIC PROGRESSIONS, AND THAT IS EXACTLY WHY THEY ARE USELESS. Vosper's
    theorem is the stability companion to Cauchy-Davenport: equality
    |A + B| = |A| + |B| - 1 in Z/N (outside listed degenerate cases) forces A and
    B to be arithmetic progressions with the same common difference. The
    prediction this record commits to in advance is that the near-extremal
    partitions for q_maj are exactly the AP partitions -- equivalently, after
    rescaling by the common difference, the INTERVAL partitions of Z/N. An
    interval partition is an interval partition IN THE DISCRETE-LOG COORDINATE:
    its fibers are {k : k in [jN/s, (j+1)N/s)} where k is the very exponent the
    ECDLP asks for. EVALUATING IT ON A POINT R REQUIRES KNOWING log_P(R). So the
    ceiling is attained, and it is attained by an object that presupposes the
    answer. THAT IS THE CLOSURE, and it is a closure at the
    docs/inventor-protocol.md section 4 standard: a named obstruction
    (Cauchy-Davenport with Vosper stability), an argument (extremality forces AP
    structure; AP structure in Z/N is DL-coordinate structure), and a redirection
    (the open question becomes whether any efficiently computable statistic
    APPROXIMATES an AP in the DL coordinate, which is a Fourier question with a
    Weil answer -- see (E)).

    ITS CONSISTENCY CHECK, WHICH IS THE REASON TO BELIEVE IT: the two extremal
    families the argument predicts are the two incumbent non-generic
    special-purpose algorithms. Interval fibers are the BSGS/kangaroo structure
    (Pollard lambda works precisely because the exponent is confined to an
    interval); coset fibers -- the other degenerate case in Kneser's theorem, and
    the one that needs a proper subgroup -- are Pohlig-Hellman, and they are
    absent here exactly because N is prime. An enumeration that independently
    re-derives the known incumbents as its extremal cases is doing real work.

    (E) SUB-RESULT 3 -- THE EFFICIENTLY COMPUTABLE REGIME IS PINNED AT THE WEIL
    SCALE. For v derived from curve coordinates -- v(R) = a bucket of x(R), a
    quadratic character of a division polynomial, any function cut out by
    bounded-degree algebraic conditions -- the advantage q_maj - 1/s is controlled
    by the Fourier coefficients of the fiber indicators along the DL coordinate,
    i.e. by sums of the shape SUM_k e_N(ck) * 1_{v(kP) = j}. Those are character
    sums over the points of an elliptic curve, and the Weil/Bombieri-type bounds
    (Kohel-Shparlinski, Lange-Winterhof lineage) give square-root cancellation,
    hence an advantage O(N^-1/2) up to the degree of the defining conditions. THE
    PREDICTION: every efficiently computable coordinate-derived statistic sits at
    the 1/s baseline within O(N^-1/2), with NO dependence on how cleverly the
    buckets are chosen, and the excess SHRINKS as N grows -- the structural tell
    of docs/inventor-protocol.md section 3, since a genuine structure would not
    decay in the parameter that is supposed to preserve it.

    (F) THE CONSTRUCTIVE BRANCH, WHICH IS NOT DECORATION. If some efficiently
    computable v is measured with an advantage that does NOT decay like N^-1/2
    across the toy ladder, then by (D) it is approximating an AP in the DL
    coordinate, and an efficiently computable approximate-AP statistic IS an
    exponent-relevant primitive: it localises k to a sub-interval at poly cost,
    which is the input a kangaroo method consumes directly. This record therefore
    has a genuine positive outcome and is not a pre-committed negative. The honest
    prior on that branch is low and is stated in honest_prior_of_survival.

    (G) WHAT THIS SESSION ALREADY CHECKED, LABELLED AS WHAT IT IS. The arithmetic
    of (C) and (D) was verified by direct exhaustive computation during ideation,
    NOT under the run harness, and it is NOT a run record and carries no run id.
    It is reported here so the proposal's arithmetic can be audited before any
    compute is authorised, per AGENTS.md rule 5 on never asserting unmeasured
    numbers. Exhaustive over all pairs, N in {11, 23, 31, 37, 41}, s in {2,3,4,5}:
    q_strict = 0.0000 in EVERY cell for both interval and random balanced
    partitions, matching (C) with no exception. q_maj for the interval partition
    was 0.5455, 0.5785, 0.5217, 0.5369, 0.5558, 0.5265, 0.5332, 0.5407 across the
    tested (N,s) cells -- FLAT NEAR 1/2 AND INDEPENDENT OF s -- while q_maj for
    random balanced partitions tracked 1/s downward (0.6198 at s=2 to 0.2635 at
    s=5). On three toy curves (p = 101, 103, 107) the efficiently computable
    x-coordinate bucket gave q_maj of 0.530/0.394/0.342/0.282 at s = 2/3/4/5
    against baselines 0.500/0.333/0.250/0.200 -- an excess of 0.03 to 0.09, which
    at N ~ 110 is exactly the N^-1/2 ~ 0.095 scale of (E) -- while the DL-interval
    statistic on the same curves held 0.504 to 0.524 flat across all s. THE
    SEPARATION IS ALREADY VISIBLE AT p ~ 100. CAVEAT RECORDED RATHER THAN BURIED:
    those three curves were used at FULL group order (N = 115, 118, 105), which is
    COMPOSITE, so Cauchy-Davenport does not strictly apply to them and they
    function as a smoke check on the measurement code, not as evidence for (C).
    The frozen protocol below requires prime-order subgroups throughout.

  mechanism: >-
    STAGE 1 (SYMBOLIC, ZERO COMPUTE, THE ACTUAL DELIVERABLE). Write the derivation
    of (C) in full, with the unbalanced case carried explicitly rather than waved
    at, and state the (D) extremality claim in the precise form Vosper licenses --
    including every degenerate case Vosper and Kneser list, since those cases are
    where a false closure would hide. Label it `derivation` per
    docs/claims-and-verification.md. IF THE UNBALANCED CASE DOES NOT CLOSE, SAY SO
    AND STOP: a partial ceiling honestly bounded is worth more than a general one
    asserted.

    STAGE 2 (EXHAUSTIVE TOY VERIFICATION OF (C) AND (D)). Prime N only, N in
    {11, 23, 31, 47, 67, 101, 211, 431, 809, 1601}, s in {2,...,8}. For each cell
    compute q_strict and q_maj exactly over all N^2 pairs for: the interval
    partition; the coset-like partition (as a NEGATIVE control -- it cannot exist
    for prime N, and code that reports one is buggy); random balanced partitions
    (>= 200 samples); the best-of-many random partition; and adversarially
    optimised partitions by local search. RECORD THE FULL DISTRIBUTION, not the
    maximum alone.

    STAGE 3 (THE EFFICIENTLY COMPUTABLE LADDER, ON PRIME-ORDER SUBGROUPS). Toy
    curves chosen so that the target subgroup has PRIME order N, with N spanning
    at least a 6x range so an N^-1/2 trend is fittable. Statistics: x-coordinate
    buckets; y-coordinate buckets; quadratic character of x; quadratic character
    of psi_ell(x(R)) for ell in {3,5,7} (the df906f ladder, now measured under the
    majority notion it was never measured under); Legendre symbol combinations;
    and a declared-in-advance adversarial search over bounded-degree algebraic
    bucket definitions. Fit the advantage against N^-1/2 and report the exponent
    with a confidence interval.

    STAGE 4 (NULLS, BOTH DIRECTIONS). Matched random-partition null at identical
    (N, s); matched random-FUNCTION null (v assigned by a seeded PRF on the point
    encoding, which is efficiently computable but carries no curve structure);
    and a PLANTED POSITIVE -- an interval partition in the DL coordinate, which
    the pipeline MUST detect with a large advantage. A pipeline that does not
    separate the planted positive from the random null emits no numbers.

    STAGE 5 (THE DECISION). Report the ceiling, the measured extremal families,
    the efficiently computable exponent, and either the closure of E1 within the
    tested scope with its named obstruction and forward guidance, or the
    identified statistic that breaks the ceiling, which routes immediately to a
    separate proposal with its own exponents and cost table.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Case-insensitive corpus grep over ledger/proposals (814 records),
      ledger/hypotheses (291), and all of knowledge/ for the tool names and for
      the mechanism, not merely the conclusion: "Cauchy-Davenport", "Vosper",
      "Kneser", "critical pair", "sumset lower bound", "Freiman-Ruzsa", "bias
      ceiling", "maximal bias", "Fourier analysis on Z/N", "how far below 1",
      "probabilistic propagation", "linear cryptanalysis analogue", "bias of the
      x-coordinate", "additive character", "square-root cancellation", "iterated
      sumset", "doubling constant".
    results: >-
      Cauchy-Davenport: 0. Vosper: 0. Kneser: 1 (unrelated context). critical
      pair: 0. sumset lower bound: 0. Freiman-Ruzsa: 0. bias ceiling: 0. maximal
      bias: 0. Fourier analysis on Z/N: 0. linear cryptanalysis analogue: 0. bias
      of the x-coordinate: 0. iterated sumset: 0. doubling constant: 0. "how far
      below 1": 1 -- IDEA-20260807-df906f itself, i.e. the record that POSES this
      gap. "probabilistic propagation": 3, all of them statements that the regime
      is open. "additive character": 7 and "square-root cancellation": 10, none in
      a propagation-ceiling context.
    verdict: >-
      UNVERIFIED, leaning genuinely new TO THIS PROGRAM but explicitly NOT new
      mathematics. Cauchy-Davenport (1813/1935), Vosper (1956), Kneser (1953) and
      Weil-type bounds for character sums on curves are all classical and none is
      claimed here. What the screen supports is that NO record in this repository
      has applied additive combinatorics in Z/N to the propagation question, and
      that the question itself is posed-and-left-open by an existing record. The
      novelty being claimed is the CONNECTION and the resulting ceiling, at
      strength `unverified` until an independent reviewer checks the derivation
      and the literature for a prior statement of exactly this ceiling -- which,
      given how classical the ingredients are, is a live possibility and must be
      searched rather than assumed absent.

  object_first_candidate:
    tracked_object: >-
      THE FIBER PARTITION ITSELF, treated as the object rather than any particular
      statistic. The record's move is to stop asking "does THIS v propagate" and
      ask "over ALL v with s values, what is the supremum of the propagation
      rate, and which v attain it". That quantifies over the whole candidate
      space at once, which is what makes it a ceiling rather than one more screen.
    lossiness: >-
      Genuinely lossy by construction: s << N, so v discards log(N/s) bits. The
      lossy-projection test of docs/inventor-protocol.md section 2 is what the
      whole record is about -- Cauchy-Davenport is precisely the statement that in
      Z/N with N prime the discarded part CANNOT be discarded compatibly with the
      group law, and (C) turns that into a number.
    propagation: >-
      STRICT: zero for balanced partitions, by (C). MAJORITY: 1/s + advantage,
      with the advantage the entire object of study.
    survival_score: >-
      The object survives exactly as far as the group is prime-order and the
      operation is the group law. It dissolves immediately on composite order
      (where coset partitions exist -- Pohlig-Hellman) and on E[ell] (which is not
      prime-order as a group, escape E3). Both boundaries are sharp and are the
      nearby-object controls.

  null_object_control: >-
    THREE NULLS, ALL REQUIRED, AND ONE PLANTED POSITIVE.
    NULL 1 -- RANDOM BALANCED PARTITION at matched (N, s). This is the baseline
    every advantage is measured against. Its own q_maj is NOT 1/s exactly but
    1/s + O(N^-1/2) fluctuation, and reporting an efficiently computable
    statistic's excess without subtracting this fluctuation is the single most
    likely false positive in the record.
    NULL 2 -- RANDOM FUNCTION on the point encoding via a seeded PRF: efficiently
    computable, structurally empty. Separates "this statistic is cheap" from "this
    statistic sees the curve".
    NULL 3 -- MATCHED COMPOSITE-ORDER GROUP at nearly equal size. There the
    ceiling MUST break, because coset partitions exist. A pipeline reporting the
    same ceiling on composite order has a bug, not a theorem.
    PLANTED POSITIVE -- the DL-interval partition, which the pipeline must flag
    with a large, s-independent advantage. Measured at 0.504-0.524 in the ideation
    smoke check; the frozen run must reproduce that on prime-order subgroups.

  discriminated_from:
    - >-
      IDEA-20260807-df906f (PRIME-ORDER CONGRUENCE RIGIDITY). THIS RECORD IS ITS
      SUCCESSOR, NOT ITS DUPLICATE, and it is careful about the boundary. That
      record proves the EXACT-regime theorem and measures ONE object family (the
      psi_ell residue ladder) in the probabilistic regime; this record bounds the
      probabilistic regime for ALL s-valued objects at once and identifies the
      extremal ones. It does not restate or re-derive theorem (A); it cites it.
      The one overlap worth naming: Stage 3 re-measures the psi_ell ladder under
      the MAJORITY notion, which df906f did not use, and if the two records'
      numbers disagree that disagreement is itself a finding about the measurement
      definition and must be reported, not reconciled quietly.
    - >-
      KN-OPEN-020 and the bounded-degree factor-base theorem. DIFFERENT OBJECT AND
      DIFFERENT QUANTITY: that lane bounds FACTOR BASES and DECOMPOSITION rates for
      index calculus via Bezout and tuple-image counting; this one bounds the
      PROPAGATION rate of a tracked statistic via sumset growth. Neither implies
      the other -- a factor base is a subset, a tracked object is a partition, and
      the failure modes are unrelated. Stated because both are "no-go flavoured"
      and could be mistaken for one another by an index scan.
    - >-
      KN-OPEN-010 (transfer operator of the translation-by-P walk). That lane
      studies the SPECTRUM of a coarse-grained operator to localise k into a
      shrinking interval; this one studies the COMBINATORIAL sumset obstruction to
      any statistic propagating at all. The point of contact is real and is named
      rather than hidden: a coarse-graining IS a fiber partition, so the ceiling
      of (D) applies to the transfer-operator lane's coarse-grainings too, and if
      this record's derivation stands it constrains that lane's achievable
      localisation. That implication is flagged for the coordinator and is NOT
      claimed as a result here.
    - >-
      KN-TECH-005 and the generic-group lower bound. NOT THAT: the GGM bound
      constrains generic ALGORITHMS; this constrains MAPS out of a prime-order
      group and holds in any model, exactly as df906f records for theorem (A).
      Nothing here interacts with the sqrt(p) barrier in either direction.
    - >-
      The classical MOV/Frey-Ruck transfer and the anomalous-curve attack. Both
      are exact homomorphisms out of G into another group; theorem (A) already
      explains why they must be injective where they exist, and neither is a lossy
      tracked object. Named because "map out of G" could be read to include them.

  assumptions:
    - >-
      N is prime. Load-bearing for BOTH Cauchy-Davenport and the rigidity theorem
      this builds on, and enforced by the protocol rather than assumed of the
      curve.
    - >-
      Vosper's theorem's degenerate cases are correctly enumerated in Stage 1.
      NOT VERIFIED YET, and it is the most likely place for the (D) claim to be
      wrong in a way that survives casual reading. An incorrectly enumerated
      degenerate case would make the extremality claim false while leaving every
      measurement in Stages 2-3 unchanged and still-correct.
    - >-
      Weil-type square-root cancellation applies to the specific coordinate
      statistics of Stage 3 at the degrees used. Standard in shape, but the
      constants and the admissible degree range must be taken from a cited bound
      rather than assumed; an unstated constant is where an O(N^-1/2) claim
      silently becomes vacuous at toy N.
    - >-
      Toy N large enough for an N^-1/2 trend to be distinguishable from a
      constant. This is why Stage 3 demands a >= 6x range in N rather than a
      single size; at one size the two hypotheses are not separable at all.

  proof_search_map:
    bottleneck: >-
      THE EXTREMALITY CLAIM (D), not the ceiling (C). (C) is a two-line
      consequence of a classical theorem and the ideation check already confirms
      it exactly. (D) asserts that the near-extremal partitions for the MAJORITY
      notion are APs, and Vosper is a statement about EQUALITY in Cauchy-Davenport
      for the STRICT notion. THE BRIDGE FROM STRICT-EXTREMAL TO MAJORITY-EXTREMAL
      IS NOT SUPPLIED BY VOSPER AND IS THE RECORD'S REAL MATHEMATICAL DEBT. It is
      named here rather than glossed, and Stage 2's adversarial local search
      exists precisely to look for a majority-extremal partition that is NOT an AP
      -- which would refute (D) while leaving (C) intact.
    baseline_embedding:
      parameter_slice: >-
        N = 23, s = 3, interval partition versus random balanced partition,
        exhaustively over all 529 pairs. Small enough to check by hand, large
        enough that 1/s = 0.333 and the interval value ~0.54 are unambiguously
        different.
      reproduction_check: >-
        Frozen fixture: at N = 23, s = 3 the pipeline must return q_strict = 0
        for both partitions and q_maj = 0.5369 for the interval partition, both
        by exact rational arithmetic over all pairs. These are the numbers the
        ideation check produced; the frozen run must reproduce them EXACTLY or the
        discrepancy is an implementation bug and blocks the record. Exactness is
        available here because the quantity is a ratio of integers -- there is no
        reason to accept floating-point agreement.
    observation_collision:
      observable: >-
        The pair (q_strict, q_maj) of a partition.
      distinct_preimage_search: >-
        THE COLLISION IS EXPECTED AND IS THE POINT: many structurally different
        partitions share the same (0, ~1/s) observable, which is exactly why a
        single measured value can never establish that a statistic is
        structureless. The identifiability question the record must answer is the
        converse one -- does a HIGH q_maj have a unique structural preimage (AP)
        or do non-AP partitions also achieve it? That is (D), and Stage 2's
        adversarial search is the direct search for a collision on the high side.
        A found collision falsifies (D) as an identifiability claim.
    constructive_transforms:
      - transform: method_ceiling
        proposed_object: >-
          Replace "screen candidate tracked objects one at a time" by "bound the
          supremum over the entire s-valued candidate space". ENCODING: a
          statistic as a fiber partition of Z/N. COMPLETENESS: the encoding is
          exact -- every s-valued statistic IS a partition, with no candidate
          escaping it. SOUNDNESS: the bound applies to all of them. TRANSFER: to
          E(F_p) via the group isomorphism E(F_p) ~= Z/N, which is
          non-constructive but is NOT NEEDED CONSTRUCTIVELY -- the ceiling is a
          statement about what exists, and existence transfers along an
          isomorphism whether or not the isomorphism is computable. THAT
          ASYMMETRY IS THE RECORD'S CENTRAL LEVER and is stated explicitly because
          it is the step a reader is most likely to challenge.
          COST LOSS: none; the transform removes compute rather than adding it.
      - transform: stronger_compositional_invariant
        proposed_object: >-
          Track the whole fiber-size profile (a_1..a_s) rather than only s,
          because Cauchy-Davenport's bound is stated in the sizes and the
          unbalanced case is where any surviving strict propagation must live.
        predicted_gain: >-
          Converts the balanced-case vanishing into a bound covering all
          partitions, which is what closing E1 rather than a corner of it needs.
    quantifier_order: >-
      WRITTEN OUT BECAUSE THE ORDER IS THE WHOLE CLAIM. The ceiling is: FOR ALL
      prime N, FOR ALL s in [2, N), FOR ALL balanced partitions v, q_strict(v) = 0.
      Note the witness does NOT depend on v -- that is what makes it a ceiling
      rather than a screen. THE TRAP, NAMED: the majority statement is weaker and
      must NOT be written in the same order. It is FOR ALL v, q_maj(v) <= 1/s +
      eps(N) ONLY for v in the efficiently computable class; for arbitrary v the
      interval partition is an explicit counterexample at ~1/2, so a uniform
      "for all v" majority ceiling IS FALSE and this record must never state one.
      The efficiently-computable restriction is doing real work and is not a
      convenience.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "within the tested prime-order toy range and the declared
        statistic families, the strict propagation rate is exactly zero as
        derived, the majority advantage of every tested efficiently computable
        statistic decays with N at a fitted exponent consistent with -1/2, and the
        only tested partitions sustaining an s-independent advantage are AP/
        interval partitions in the DL coordinate." THAT IS NOT A THEOREM ABOUT THE
        ECDLP and does not bound any algorithm's running time. In particular it
        says nothing about escapes E2 (auxiliary state), E3 (objects on E[ell]) or
        E4 (objects not tracked under the group law), which remain fully open.
      nearby_object_control: >-
        THE COMPOSITE-ORDER GROUP at nearly the same size, where the conclusion
        MUST fail because coset partitions exist and give genuine lossy exact
        propagation (Pohlig-Hellman). A method that reports the same ceiling on
        Z/(N-1) as on Z/N has not identified the load-bearing structure -- which
        is primality -- and is measuring something else. This control costs one
        extra column and is mandatory.
    proof_obligations:
      - claim: q_strict = 0 for every balanced partition of Z/N, N prime, 2 <= s < N.
        responsibility: correctness
      - claim: the unbalanced bound on q_strict, with its extremal configuration.
        responsibility: size_bound
      - claim: near-extremal majority partitions are APs (the Vosper bridge).
        responsibility: correctness
      - claim: efficiently computable coordinate statistics have advantage O(N^-1/2).
        responsibility: success_probability
      - claim: the pipeline detects the planted interval partition and separates all three nulls.
        responsibility: interface
      - claim: exact rational arithmetic, no floating-point acceptance thresholds.
        responsibility: interface

  predictions:
    - metric: q_strict over all balanced partitions at every tested prime N and s
      direction: lower
      minimum_effect: >-
        FORCED EXACTLY ZERO, no exception, by (C). A single nonzero value at prime
        N with a balanced partition falsifies the derivation or reveals a bug, and
        either way blocks the record. This is the cheapest and sharpest gate in
        the proposal.
    - metric: q_maj of the DL-interval partition, as s grows
      direction: different
      minimum_effect: >-
        PREDICTED FLAT NEAR 0.5 AND INDEPENDENT OF s -- ideation check gave 0.5217
        to 0.5785 across s in {2,3,4,5} at five primes. If it instead decays like
        1/s, the extremality claim (D) is wrong and the record's closure collapses
        to the strict statement (C) alone, which must then be reported as the only
        surviving result.
    - metric: >-
        advantage q_maj - 1/s of each efficiently computable coordinate statistic,
        fitted against N over a >= 6x range of prime N
      direction: lower
      minimum_effect: >-
        Fitted exponent consistent with -1/2 within its confidence interval. AN
        EXPONENT SIGNIFICANTLY ABOVE -1/2 -- in particular an advantage that does
        not decay at all -- IS THE RECORD'S POSITIVE OUTCOME and routes to the
        constructive branch (F). An exponent below -1/2 means the statistic is
        even more structureless than Weil requires and is unremarkable.
    - metric: adversarially optimised non-AP partition achieving high q_maj
      direction: different
      minimum_effect: >-
        Predicted NOT FOUND. If local search finds a non-AP partition with
        s-independent q_maj near 0.5, (D) is refuted as an identifiability claim
        and the taxonomy gains a genuinely new extremal family -- which would be a
        MORE valuable outcome than the predicted one and must be reported as such
        rather than treated as a failed run.
    - metric: composite-order nearby-object control
      direction: higher
      minimum_effect: >-
        FORCED: q_strict must be substantially ABOVE zero there (coset partitions
        exist). A zero reading on composite order means the pipeline is not
        measuring what it claims and voids every other number in the run.
    - metric: planted-positive detection and three-null separation
      direction: different
      minimum_effect: >-
        FORCED: planted interval flagged with large advantage; all three nulls at
        baseline within fluctuation. Failure voids the run.

  minimal_test:
    design: >-
      Stage 1 plus Stage 2 at N in {11, 23, 31, 47, 67}, s in {2,...,5}, exhaustive
      over all pairs with exact rational arithmetic, plus the planted positive and
      the composite-order control. That is minutes of compute and no curve
      arithmetic at all -- the group is Z/N and the ECDLP does not appear. It
      already decides (C) outright and gives the first real evidence on (D). Stage
      3 is the expensive half and is gated on (C) and (D) surviving Stage 2.
    controls:
      - Random balanced partition null, >= 200 samples per cell.
      - Random-function (seeded PRF) null.
      - Composite-order group at matched size, where the ceiling must break.
      - Planted DL-interval positive, which must be detected.
      - Exact rational arithmetic; no floating-point equality anywhere.
      - >-
        Adversarial local search for a non-AP high-q_maj partition, run as a
        genuine attempt to refute (D) and not as a formality.
    required_metrics:
      - q_strict and q_maj per (N, s, partition family), exact rationals.
      - Full distribution over random partitions, not the maximum alone.
      - Fitted advantage exponent versus N with confidence interval, per statistic.
      - Pass/fail of every forced gate, recorded individually.
      - Artifact manifest with hashes and a from-scratch rebuild receipt.

  falsification_conditions:
    - >-
      Any nonzero q_strict for a balanced partition at prime N. Falsifies (C) or
      reveals a bug; the record stops until resolved.
    - >-
      q_maj of the interval partition decaying like 1/s. Falsifies (D); the
      closure collapses to (C) and must be reported at that reduced strength.
    - >-
      A non-AP partition with s-independent high q_maj. Falsifies (D) as an
      identifiability claim; report as a new extremal family.
    - >-
      An efficiently computable statistic with non-decaying advantage. Falsifies
      the (E) barrier and OPENS the constructive branch; route to a new proposal.
    - >-
      Zero q_strict on the composite-order control. Pipeline bug; all numbers void.
    - >-
      Stage 1 finds that Vosper's degenerate cases do not support the (D) bridge.
      Then (D) is withdrawn BEFORE any Stage 2 interpretation, and the record
      reports (C) plus an explicit statement that the majority regime is
      unbounded by this route.

  confounders:
    - >-
      BASELINE FLUCTUATION MISTAKEN FOR ADVANTAGE. A random balanced partition has
      q_maj = 1/s + O(N^-1/2), not 1/s. At N ~ 100 that fluctuation is ~0.1, which
      is LARGER than any excess the ideation check saw. Every advantage must be
      measured against the empirical random-partition distribution at the same
      (N, s), never against 1/s. THIS IS THE MOST LIKELY WAY THIS RECORD PRODUCES
      A FALSE POSITIVE.
    - >-
      COMPOSITE ORDER LEAKING IN. Toy curves rarely have prime group order; using
      the full group instead of a prime-order subgroup silently reintroduces coset
      partitions and would manufacture a spurious ceiling violation. The ideation
      smoke check did exactly this, which is why its curve numbers are labelled a
      smoke check and not evidence.
    - >-
      SMALL-s DEGENERACY. At s = 2 the baseline is 0.5 and the interval value is
      ~0.52; the two are barely separated and the s = 2 column carries almost no
      information. Conclusions must be drawn from the TREND across s, not from any
      single column, and s = 2 should be reported but never load-bearing.
    - >-
      MAJORITY-NOTION AMBIGUITY. q_maj as defined takes the best F over all
      functions SxS -> S. An implementation that instead takes the most common
      value of v on the whole group, or that ties-breaks inconsistently, computes a
      different quantity. The definition must be fixed in code and cross-checked
      against a brute-force enumeration of F at the smallest cell.
    - >-
      TOY-RANGE EXTRAPOLATION. Fitting an exponent over N in the low thousands and
      calling it asymptotic is exactly the failure docs/inventor-protocol.md
      section 6 step 2 warns about. The fitted exponent is a toy-range fit and must
      be reported as one.

  interpretation_limits:
    - >-
      This bounds ONE escape (E1) of four. E2 (auxiliary state), E3 (objects on
      E[ell]) and E4 (objects not under the group law) are untouched, and nothing
      here may be cited as closing KN-OPEN-019.
    - >-
      No attack, no exponent, no cost claim against Pollard rho or BSGS. The
      record's positive branch would produce a PRIMITIVE, not an algorithm, and
      converting one into the other needs a separate proposal with its own cost
      table per docs/target-result-profile.md A8.
    - >-
      The ceiling is about s-valued statistics on the group. A tracked object with
      unbounded image, or one carrying auxiliary state, is outside the quantifier
      and is not bounded by anything here.
    - >-
      Toy scale throughout; claim_tier capped at toy. The asymptotic statements
      are `derivation` artifacts, never "proved", per
      docs/claims-and-verification.md.
    - >-
      The ideation numbers in claim (G) are a pre-authorisation arithmetic check
      run outside the harness. They are not a run record, carry no run id, and no
      evidence record may cite them. They exist so the proposal can be audited
      before compute is spent.

  heuristic_assumptions:
    - id: HEUR-PROP-C1
      statement: >-
        For every prime N and every s with 2 <= s < N, and every partition of Z/N
        into s parts of equal size (up to the unavoidable remainder), no ordered
        pair of parts (A_i, A_j) satisfies A_i + A_j contained in a single part.
      rigorous_support: >-
        This is NOT a heuristic in the target-profile sense -- it is a direct
        consequence of the Cauchy-Davenport theorem, which is rigorous and
        classical, composed with the pigeonhole inequality on part sizes. It is
        recorded in this block because the record's whole ceiling rests on it and
        because the remainder handling for s not dividing N is a genuine gap in
        the two-line argument that Stage 1 must close properly.
      falsification_condition: >-
        A single exhibited (N, s, partition) triple at prime N with a strictly
        determined pair.
      validation_plan: >-
        SAMPLE: exhaustive over all ordered pairs for N in {11, 23, 31, 47, 67,
        101, 211, 431, 809, 1601}, s in {2..8}, for interval, random (>= 200 per
        cell) and locally-optimised partitions. COMPARISON: forced value zero,
        exact rational arithmetic. TAIL CHECK: the cells with the most unbalanced
        remainder, since that is where the s-does-not-divide-N gap lives. TRANSFER
        ASSUMPTION, STATED: none needed -- the claim is finitary at each N and the
        general statement is derived, not extrapolated.
    - id: HEUR-PROP-E1
      statement: >-
        For a statistic v on the prime-order subgroup whose fibers are cut out by
        algebraic conditions of degree bounded by d in the curve coordinates, the
        majority advantage q_maj(v) - 1/s is O(d * N^(-1/2)) uniformly in s.
      rigorous_support: >-
        Composition of a rigorous bound with a classical distribution statement, in
        the shape docs/target-result-profile.md A2 requires: the rigorous
        ingredient is the Weil/Bombieri bound for character sums over the points of
        an algebraic curve (Kohel-Shparlinski and Lange-Winterhof lineage, to be
        cited exactly in Stage 1 rather than gestured at), which caps the relevant
        Fourier coefficients at O(d * sqrt(N)); the distributional ingredient is
        the standard expansion of a majority advantage in terms of those
        coefficients. THE COMPOSITION IS NOT YET WRITTEN and is a Stage 1 duty; the
        constants and the admissible degree range are the part most likely to be
        vacuous at toy N.
      falsification_condition: >-
        A bounded-degree algebraic statistic whose measured advantage fails to
        decay across a >= 6x range of prime N, with the random-partition
        fluctuation properly subtracted.
      validation_plan: >-
        SAMPLE: >= 10 statistic families x >= 6 prime subgroup orders spanning a 6x
        range x s in {2..8}, each against >= 200 matched random partitions. TAIL
        CHECK: report the 10 (statistic, N, s) cells with the largest advantage and
        state whether they share a statistic family, a prime, or a small s -- a
        cluster at small s is the degeneracy confounder, not a finding. TRANSFER
        ASSUMPTION, STATED AND UNJUSTIFIED: that a toy-range fitted exponent
        describes behaviour at cryptographic N. NOTHING IN THIS RECORD SUPPORTS
        THAT and it is recorded as an open extrapolation.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. This record proposes no algorithm for the
      ECDLP and cannot move any exponent. Stated explicitly rather than omitted.
      The costs it carries are measurement costs: q_strict and q_maj are exact over
      all N^2 pairs at O(N^2) group operations per (N, s, partition) cell, which is
      seconds at N <= 1601 and is the reason the decisive Stage 2 is essentially
      free. The BARRIER it may establish is a statement about what cannot happen,
      whose value is that it removes a candidate space rather than that it speeds
      anything up.
    memory_exponent: >-
      O(N) machine words to hold the partition and O(s^2) counters; kilobytes at
      the toy ladder. No memory question arises.
    best_known: >-
      For the underlying ECDLP the incumbent is Pollard rho at O(sqrt(N)) time and
      negligible memory (KN-TECH-005 lineage), and NOTHING IN THIS RECORD COMPETES
      WITH IT. For the specific question of a propagation ceiling on a prime-order
      group there is no incumbent bound in this repository at all -- that absence
      is what the record addresses and is documented in novelty_screen. Whether one
      exists in the external literature is UNVERIFIED and is a declared Stage 1
      search obligation, not an assumption.
    hidden_overhead: >-
      The dominant hidden cost is in the ARGUMENT, not the compute: the bridge from
      Vosper's strict-equality stability to majority-extremality is unwritten, and
      if it needs a Kneser-type or Freiman-type input the Stage 1 effort grows
      substantially and the resulting statement may carry additional hypotheses
      that weaken (D). That risk is named in proof_search_map.bottleneck.
    tradeoff_note: >-
      The record exposes a tradeoff intrinsic to the whole tracked-object
      programme: an object's propagation rate and its computability pull in
      opposite directions. The extremal objects (intervals in the DL coordinate)
      have maximal propagation and zero computability; the computable objects
      (coordinate-derived) have full computability and Weil-scale propagation.
      IF THAT TRADEOFF IS REAL AND TIGHT, IT IS THE STRUCTURAL REASON THE
      SYMMETRIC-SIDE TAXONOMY DOES NOT PORT, and it is stated as the record's
      central conjecture rather than as a result.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS BEFORE ANSWERING, per docs/inventor-protocol.md
    section 5. AS AN ATTACK: n/a (no result claimed) -- the record mounts no attack
    and holds no position on any attack frontier, so no row of the ECDLP frontier
    (rho, BSGS, kangaroo, index calculus, isogeny) dominates or is dominated.
    AS A BARRIER: the nearest incumbent is the bounded-degree factor-base
    obstruction behind KN-OPEN-020, which bounds a DIFFERENT quantity (factor-base
    decomposition) by a DIFFERENT method (Bezout and tuple-image counting); it
    neither implies nor is implied by this ceiling, so neither dominates.
    AS A STRUCTURAL STATEMENT ABOUT TRACKED OBJECTS: IDEA-20260807-df906f's
    rigidity theorem is STRICTLY STRONGER in the exact regime -- it settles it
    completely -- and this record does not improve it there and does not try to.
    This record is only non-dominated in the probabilistic regime, which that
    theorem explicitly does not reach. Null is NOT claimed on any axis.
  sota_delta: >-
    No attack, no speedup, no exponent. QUANTITATIVE CONTENT DELIVERED, stated as
    numbers rather than as "better": a sharpening of the program's central
    structural fact from the qualitative "q < 1" to the exact "q_strict = 0" for
    balanced partitions at prime order, verified exhaustively at N in {11,23,31,
    37,41} with zero exceptions; a measured separation between the extremal object
    (q_maj 0.5217-0.5785, flat in s) and random partitions (0.6198 at s=2 falling
    to 0.2635 at s=5) already visible at N < 50; a measured advantage of 0.03-0.09
    for efficiently computable x-coordinate buckets at N ~ 110 against an expected
    Weil scale of N^-1/2 ~ 0.095; and, if Stage 1 closes, the first quantitative
    bound in this repository on the largest named-open escape from the rigidity
    theorem. Against the prior state of that escape -- which was "says NOTHING
    about how far below 1" -- the delta is the entire bound.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.97 that (C) holds and Stage 2 confirms q_strict = 0 at every prime cell --
    it is a classical theorem plus pigeonhole and the ideation check already saw it
    with no exception, so the residual risk is the s-does-not-divide-N remainder
    case rather than the mathematics. 0.6 that (D) survives Stage 1 in the strong
    form stated: the Vosper bridge from strict to majority extremality is a real
    gap and I expect it to need an extra hypothesis or to weaken to "AP partitions
    are AMONG the extremal families" rather than "are the only ones". 0.85 that the
    efficiently computable statistics of Stage 3 show a decaying advantage
    consistent with (E), since that is what Weil bounds predict and what the smoke
    check saw. 0.1 that any tested efficiently computable statistic shows a
    non-decaying advantage -- the constructive branch (F), which is the outcome
    that would matter most and is the reason the record is worth running even
    though I expect it to close. 0.35 that an independent literature search finds
    this exact ceiling already stated somewhere in the additive-combinatorics or
    exponential-sums literature, in which case the contribution is the CONNECTION
    to the program's tracked-object question and the novelty label must drop
    accordingly rather than be defended.

