idea:
  id: IDEA-20261006-6374b1
  question_id: RQ-ECDLP-002
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Joint distinguished-point table versus four separate walks on Z/503Z
  class: measurement
  claim: >-
    In the cyclic group Z/503Z, with the group law ordinary addition and
    the element written as an integer in {0, 1, ..., 502}, four planted
    logarithms of a public generator, and a point called distinguished
    when its representative is divisible by 16, the median over 16
    seeds of the joint-walk step count J and the median of the summed
    separate-walk step count S satisfy S / J >= 1.4, in exact rational
    arithmetic, whenever both searches recover all four logarithms
    inside a cap of 2000 steps per walk. This is the known multi-target
    amortization. It does not beat a square-root of L times the group
    order, and it does not move the generic exponent 1/2.
  mechanism: >-
    One distinguished-point walk stores each distinguished element with
    the coefficient that reached it. Each of the four targets is a
    second coefficient on the same element. A separate walk repeats
    that storage four times. The tracked object is the pair of medians
    (S, J), not a new walk rule. Lossy projection: the observable keeps
    step counts and drops the collision element. The projection is
    compatible with the cost question because RQ-ECDLP-002 asks about
    multi-target cost, and the step count is the cost. The open number
    priced here is the ratio S/J on this one group, against the
    threshold 1.4.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-46c2c6
      provenance: internal
      claim: >-
        Reusing distinguished points across L targets costs about the
        square root of 2 L n in total rather than L times the square
        root of n. Read from the frontier row opened this session.
        The row is the baseline this measurement does not beat.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-46c2c6.yaml
    - ref: KR-RHO-6239aa
      provenance: internal
      claim: >-
        van Oorschot-Wiener distinguished points trade storage against
        the in-flight tail. Opened this session as the walk mechanism,
        not as a new algorithm.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-6239aa.yaml
  assumptions:
    - The generator is 1 in Z/503Z. The four planted logarithms are drawn from the seed and are nonzero.
    - A walk that hits the cap without a collision is incomplete. It is not a step count of 2000 in the median.
    - Sixteen seeds are frozen. The ratio is not recomputed after dropping a seed.
    - No elliptic curve is built. The group is the integers modulo 503.
  predictions:
    - metric: >-
        S / J, where S is the lower median of the sixteen summed
        separate-walk step counts and J is the lower median of the
        sixteen joint-walk step counts. Lower median of 16 values is
        the 8th in ascending order.
      direction: higher
      minimum_effect: >-
        at least 1.4. A finished ratio strictly below 1.4 falsifies
        the amortization on this group.
  minimal_test:
    design: >-
      Group order n = 503, generator 1, L = 4 targets, distinguishing
      modulus 16, 16 seeds, cap 2000 steps on each walk. Seed s uses
      SHA-256 of the UTF-8 string IDEA-20261006-6374b1|{s}|{role} to
      draw the four logarithms and the walk's partition. The joint
      walk is one r-adding walk with r = 16. Each separate walk uses
      the same partition and a disjoint step counter. Record steps
      until all four logs are certified by a collision, or the cap.
    controls:
      - >-
        Permuted labels. The distinguishing predicate reads pi(x)
        mod 16 = 0, where pi is a fixed permutation of Z/503Z drawn
        from seed IDEA-20261006-6374b1|pi before any walk. The group
        law is still addition. If the identity labeling has ratio at
        least 1.4 and the permuted labeling has ratio below 1.4, the
        identity ratio is a labeling artifact.
      - >-
        Each recovered logarithm is checked by multiplying the
        generator. A wrong logarithm voids that seed.
      - >-
        A seed that caps out is dropped from both medians together.
        Dropping it from only one arm is forbidden. If fewer than 12
        seeds finish, the ratio is not scored.
    required_metrics:
      - joint steps and separate-sum steps per finished seed
      - lower medians J and S
      - the rational S/J
      - the same ratio under the permuted labeling
      - how many seeds finished
  falsification_conditions:
    - >-
      At least 12 seeds finish on the identity labeling and S/J is
      strictly below 1.4. The amortization is absent on this group.
    - >-
      The identity ratio is at least 1.4 and the permuted-label ratio
      is strictly below 1.4. The identity figure is then a property of
      the residue representatives, not of the joint table.
  confounders:
    - One group order. A ratio on 503 does not transfer to cryptographic n.
    - The cap of 2000 can censor long walks. Censored seeds are dropped in pairs, and a sample below 12 seeds is unscored.
    - r = 16 is frozen. A different branch count is a different experiment.
  interpretation_limits:
    - >-
      The known multi-target bound is about the square root of 2 L n.
      A ratio of 1.4 against four separate walks can hold while the
      joint cost still sits on that bound. No exponent move is claimed.
    - Toy order only.
    - This is not a curve computation and not a negation-map walk.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Along a walk of 2000 steps in Z/503Z, the fraction of
        elements divisible by 16 is within 0.02 of 1/16.
      rigorous_support: >-
        In a uniformly random subset of Z/503Z the indicator of
        divisibility by 16 has mean equal to the number of such
        residues over 503. A walk is not proved uniform here. The
        0.02 band is the toy check, not a mixing theorem.
      validation_plan: >-
        On the first finished joint walk, count distinguished hits
        over the steps actually taken and compare the fraction to
        1/16. Absolute error above 0.02 falsifies H1 on this seed.
        No transfer to other orders is assumed.
  target_complexity:
    time_exponent: >-
      not beaten. One discrete log remains Theta(n^{1/2}). Four logs
      by the known joint bound are about the square root of 4 n, not
      a lower exponent.
    memory_exponent: >-
      not beaten. Memory is the distinguished-point table, the same
      van Oorschot-Wiener storage.
    best_known: >-
      Pollard rho at Theta(n^{1/2}) per target, and the multi-target
      bound recorded in KR-RHO-46c2c6.
    hidden_overhead: >-
      None claimed. No o(1) attack term is hidden because no attack
      improvement is proposed.
    tradeoff_note: >-
      The joint table spends memory once. That is the classical
      tradeoff already in the cited row. No new interpolation is
      offered.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-46c2c6
      - KR-RHO-6239aa
      - KR-RHO-7d93f6
      - KR-RHO-cd86f5
      - KR-RHO-fb88e6
    nearest:
      - ref: KR-RHO-46c2c6
        provenance: internal
        relation: adjacent
        delta: >-
          That row states the multi-target bound. This idea adds a
          toy ratio threshold of 1.4 for S against J on Z/503Z with
          L=4 and does not claim to go under the bound.
    searched:
      corpus_grep:
        - titles of IDEA-20261005 and IDEA-20261006 on origin/main
        - proposal files added on design/volc-52015b and design/tors-ed9a14
      web:
        - not performed this session
      blocked:
        - negation-map fruitless cycles (KR-RHO-fb88e6)
        - grumpy-giant versus baby-step giant-step
  dominated_by: >-
    The multi-target bound in KR-RHO-46c2c6, about the square root of
    2 L n group operations in total. Pollard rho at Theta(n^{1/2})
    remains the single-target floor.
  sota_delta: >-
    Exponent delta is 0 against Theta(n^{1/2}). The quantitative
    separator is a median step ratio S/J of at least 1.4, versus a
    finished ratio strictly below 1.4, on Z/503Z with four targets.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: >-
        Z/503Z, L=4, distinguishing modulus 16, r=16. Not an attack
        baseline below the known bound.
      reproduction_check: >-
        Recompute one finished seed with a second walk implementation
        and require the same step count.
    observation_collision:
      observable: the step-count ratio
      distinct_preimage_search: >-
        Two seeds may share a ratio. That carries no discrete log
        beyond the four planted ones, which are checked by
        multiplication.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the set of seeds with a given ratio
        predicted_gain: none as an attack
    quantifier_order: >-
      For all finished seeds in the frozen list of 16, the step
      counts are nonnegative integers. The ratio is one rational.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy statement that S/J is at least 1.4 or strictly below
        1.4 on this group and this cap.
      nearby_object_control: the permuted-label walk
    proof_obligations:
      - claim: no theorem is offered
        responsibility: scope
    not_applicable_reason: >-
      Measurement of a known amortization on one toy group. The
      permuted labeling is the nearby control.
