idea:
  id: IDEA-20260905-be63be
  title: Orbit stabilizers and the second factorial moment of relation supply
  class: mechanism
  claim: For a complete automorphism-orbit factor base, stabilizer-weighted tuple-target incidence and its second
    factorial moment can describe distinct tuple-orbit yield and target concentration. Distinctness alone does not
    certify informative relation rank; that requires a separately conditioned rank-increment certificate.
  mechanism: Fix a finite automorphism group A preserving the factor base B and ordered arity m. Define I={(t,R)
    in B^m x G:sum(t_i)=R}, with diagonal action a(t,R)=((a(t_i)),a(R)). The fixed-target fiber I_R is quotiented
    only by A_R={a:a(R)=R}; full A acts on the joint incidence space and its target-orbit quotient. For a chosen
    R, sum_{t in I_R}|Stab_A_R(t)|/|A_R| counts distinct A_R-orbits exactly. Replacing R by a(R) conjugates A_R
    and transports tuples bijectively, preserving the statistic; a tuple with sum R is never placed back in the
    old fiber after its target moves. Pair incidence counts distinct such quotient objects under the frozen target
    sampling law. Orbit duplicate removal affects distinct yield, while distinct quotient objects can still give
    dependent rows. Retain eta_distinct=distinct-orbits/raw-tuples and separately gamma_r=Pr(rank increment | fresh
    orbit, current row space and declared sampler). No independence or rank gain is inferred from orbit counting.
  question_id: RQ-EQIC-8cb959
