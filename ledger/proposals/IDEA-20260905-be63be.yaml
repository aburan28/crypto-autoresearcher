  assumptions:
  - Complete finite automorphism orbits with r dividing p-independent constants; signs and repeated summands handled
    explicitly.
  - H-STR-002 remains weakened; no claim about rank from row appending or orbit symmetry alone.
  predictions:
  - metric: Weighted orbit count, second factorial moment, stabilizer distribution and fraction of zero-yield targets
    direction: different
    minimum_effect: The second moment distinguishes two equal-mean incidence tables, and stabilizer correction makes
      duplicated orbit copies contribute zero additional supply.
  minimal_test:
    design: At later approval, exact finite combinatorial identities on self-generated group tables with N in {13,19,31},
      r=3 where available, arity m=2 or 3 and bases of 3 or 6 elements. No logarithm computation; group labels are
      fixture input. The paper action audit sends any moved formal target R to a(R) along with every tuple; stabilizers
      conjugate and weighted orbit count is unchanged. Duplicating a list entry leaves the set of quotient orbits
      unchanged. The separate same-rank control prevents replacing eta_distinct by rank yield.
    proposal_only: true
    controls:
    - type: matched_null
      description: Random subsets of the same size and orbit-permuted incidence tables preserving all marginal counts.
    - type: known_false
      description: A deliberately duplicated tuple-orbit list must increase raw count while leaving the distinct-orbit
        count unchanged.
    - type: same_rank_control
      description: Two distinct supplied tuple-orbits whose declared coefficient rows lie in the same existing row
        span increase distinct count while informative rank remains fixed; reject any rank-gain conclusion from
        distinctness alone.
    required_metrics:
    - Weighted orbit count, second factorial moment, stabilizer distribution and fraction of zero-yield targets
    - construction work, peak bytes, certificate size
    required_artifacts:
    - Exact fixtures
    - Independent certificates
    - Complete controlled outputs
    stopping_rule: First exact contradiction or stated finite panel; missing prerequisites and limits are inconclusive.
      No execution in this task.
  falsification_conditions:
  - The corrected second moment is determined solely by the fixed size and arity on all admissible fixtures, or
    apparent extra supply is entirely orbit duplication.
