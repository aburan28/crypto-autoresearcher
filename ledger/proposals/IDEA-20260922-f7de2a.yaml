idea:
  id: IDEA-20260922-f7de2a
  question_id: RQ-DREG-c8ae8d
  added: '2026-09-22'
  proposed_by: idea-generator
  status: proposed
  title: Syzygy witness before any fall-profile outlier
  class: control
  claim: >-
    A scalar gap in new_falls is not a mechanism. An off-locus outlier
    nominated by IDEA-20260922-805a59 or by label C of IDEA-20260922-221a70
    is admissible only when the extra fall, or the missing fall, is
    witnessed by an explicit polynomial combination of the generators.
    On the outlier's (a, b) the combination lies in degree below D. On an
    isogeny neighbor at distance 1 the same degree has no such combination.
    Both checks are exact linear algebra on finished Macaulay matrices.
    The attack stage is relation decomposition only, in an R1 coordinate
    representation. Proves-too-much control: the same witness search on a
    random coefficient system with the same monomial support is not
    reported as a curve effect. Nearby-object control: the gauge orbit of
    the outlier j reproduces the witness, or the witness is a coordinate
    artifact. This idea does not search for the outlier. It is the
    acceptance test for outcome O3 of RQ-DREG-c8ae8d. Zero candidates
    means zero acceptances, which is a completed run of the gate.
  mechanism: >-
    Object frame. Representation: R1, the coefficients (a, b) inside the
    Semaev generators. Attack stage: relation decomposition only.
    Operation set Sigma: Macaulay multiplication by monomials up to the
    degree D of the disputed fall, and F_p-linear combinations of those
    rows. Sigma is not the translation action. Trichotomy class of
    IDEA-20260806-c5d183: coordinate-dependent, because the witness is a
    relation among the presented polynomials and changes when (a, b)
    changes. The projection discards the discrete logarithm, the point,
    and the rest of the fall profile, and retains one multiplier tuple
    (q_i) together with three bits: present on the outlier, absent on the
    neighbor, absent or present on the random system as required below.
    The tuple is lossy: it is one vector in a left kernel, not the curve
    and not a factor base. It does not propagate under translation.
    Shared instrument: new_falls from IDEA-20260916-4b7c1e decides
    presence and absence. The witness is a concrete vector realizing a
    positive new_falls(D), recovered from the kernel of the
    degree-exactly-D columns, not a new definition of new_falls. An extra
    fall at D on the outlier is accepted only if new_falls(D) = 0 on the
    neighbor and new_falls(D) = 0 on the support-matched random system, so
    the fall is not the generic fall of that support. A missing fall at D
    on the outlier is accepted only if the neighbor carries an explicit
    witness at D and the random system also has new_falls(D) > 0, so the
    absence is not what a generic system of that support does. F2 is the
    component whose syzygies are being certified. No new factor base.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260916-4b7c1e
      provenance: internal
      claim: >-
        new_falls(D) > 0 means level D produces a consequence of degree
        below D that level D-1 did not produce. The witness is a vector
        realizing that dimension. The definition is not restated.
      verified_by: idea-generator, lines 1-200 read 2026-09-22
    - ref: RQ-DREG-c8ae8d
      provenance: internal
      claim: >-
        O3 requires an explicit syzygy witness for a fall that is not
        shared by an isogeny neighbor. This record is that gate.
      verified_by: idea-generator, full file read 2026-09-22
    - ref: IDEA-20260806-c5d183
      provenance: internal
      claim: Coordinate-dependent trichotomy class.
      verified_by: idea-generator, lines 1-70 read 2026-09-22
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: R1 field representation; relation-decomposition stage.
      verified_by: idea-generator, title and scope opening read 2026-09-22
    - ref: IDEA-20260807-6eb96b
      provenance: internal
      claim: Gauge orbit is the nearby object. Many models, one j.
      verified_by: idea-generator, claim opening read 2026-09-22
    - ref: IDEA-20260807-f6137c
      provenance: internal
      claim: >-
        A true degree-of-regularity meter has no planted ground truth.
        The witness is a checkable polynomial, which is the substitute
        this gate uses.
      verified_by: idea-generator, claim opening read 2026-09-22
    - ref: KN-OPEN-020
      provenance: internal
      claim: >-
        Bounded-degree algebraic factor bases are scoped, and the
        universal no-go is open. This gate adds no factor base.
      verified_by: idea-generator, statement section read 2026-09-22
    - ref: RQ-ICINV-475b5e
      provenance: internal
      claim: Parent question. Cited, not restated.
      verified_by: idea-generator, title read 2026-09-22
    - ref: RQ-DREG-bd6c86
      provenance: internal
      claim: Parent question. Cited, not restated.
      verified_by: idea-generator, title read 2026-09-22
    - ref: RQ-VOLC-f6253b
      provenance: internal
      claim: Parent question. Cited, not restated.
      verified_by: idea-generator, title read 2026-09-22
    - ref: RQ-ECTD-001
      provenance: internal
      claim: Parent question. Cited, not restated.
      verified_by: idea-generator, title read 2026-09-22
  assumptions:
    - >-
      A candidate pair is supplied by a measurement record. This gate
      does not enumerate a class.
    - >-
      The neighbor is at isogeny distance 1 and the degree is coprime to
      the group order. Otherwise the pair is out of scope for O3.
    - >-
      Exact linear algebra over F_p. A numerical rank is not a witness.
    - >-
      IDEA-20260807-427cf3 is not assumed. A witnessed gap at matched
      factor-base cardinality is allowed to stand.
  proof_search_map:
    bottleneck: >-
      Believing a difference of integers new_falls without a polynomial
      that exhibits it. Also the uncomputable degree of regularity, which
      this gate does not compute.
    baseline_embedding:
      parameter_slice: >-
        On one fixture curve, take a degree D with new_falls(D) > 0 under
        IDEA-20260916-4b7c1e and recover a multiplier tuple whose
        combination has degree below D. That is the baseline extraction,
        before any outlier is judged.
      reproduction_check: >-
        The combination reduces to zero against the generators, and its
        degree is below D. A second elimination's kernel contains the
        same tuple or another tuple of the same degree drop.
    observation_collision:
      observable: >-
        Existence of a multiplier tuple giving a degree drop at a named D
      distinct_preimage_search: >-
        The outlier and each gauge model of its j are distinct
        presentations that must share the drop. The outlier and its
        distance-1 neighbor are the pair that must not share it. A
        collision with the neighbor rejects the candidate.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fiber of coefficient specializations (a, b) that admit an
          explicit degree drop at D, with the neighbor and the random
          system as points that must lie outside or inside that fiber
          according to the extra-fall or missing-fall rule.
        predicted_gain: >-
          Turns a scalar gap into an accept or reject. No ECDLP exponent
          gain.
    quantifier_order: >-
      For all candidate pairs (E, E') submitted to the gate, accept only
      if there exists a multiplier tuple and there exists a degree D such
      that the combination on E has degree below D, and for that same D
      the neighbor E' has new_falls(D) = 0 from a finished matrix (extra
      fall), or the symmetric missing-fall condition holds. For all
      support-matched random systems in the control batch, a fall at that
      D is not reported as a curve effect. For all tested gauge models of
      j(E), a witness of the same drop exists. If no pair is submitted,
      the set of acceptances is empty.
    method_ceiling:
      strongest_certifiable_claim: >-
        Toy-tier acceptance or rejection of a supplied pair. The gate
        cannot discover an outlier and cannot certify a degree above the
        cap.
      nearby_object_control: >-
        The gauge orbit of the outlier j must reproduce the witness. A
        non-isogenous curve of the same order is not an O3 neighbor; a
        witness that appears there as well is a same-order coefficient
        effect and fails the isogeny-neighbor contrast.
    proof_obligations:
      - claim: >-
          Acceptance requires a stored multiplier tuple that reduces to
          a nonzero polynomial of degree below D on the outlier, a
          finished rank showing the neighbor lacks that fall, a random
          support-matched system that does not get reported as a curve,
          and a reproducing gauge model.
        responsibility: correctness
    not_applicable_reason: null
  predictions:
    - metric: o3_witness_decision
      direction: different
      minimum_effect: >-
        Each supplied pair receives exactly one label. Accept-extra: a
        stored tuple drops the degree below D on the outlier,
        new_falls(D) = 0 on the finished neighbor, new_falls(D) = 0 on
        the finished random system, and at least two other gauge models
        reproduce a drop at that same D. Accept-missing: the neighbor has
        a stored tuple at D, the outlier has new_falls(D) = 0, the random
        system has new_falls(D) > 0, and the gauge orbit reproduces the
        absence. Reject: any one of those checks fails. Empty: no pair
        was supplied, so the number of acceptances is 0. A gap of
        new_falls with no stored tuple is a reject.
    - metric: random_system_reported_as_curve
      direction: lower
      minimum_effect: >-
        The count of random-system falls reported as curve effects is 0.
        One such report voids the batch.
  minimal_test:
    design: >-
      First run the extractor on one fixture curve at one degree where
      new_falls(D) > 0, and store the tuple. Then, when a candidate pair
      exists, run the four checks in the prediction at the disputed D.
      Build one random system by keeping the monomial support of the
      outlier's generators and replacing nonzero coefficients with fresh
      uniform nonzero field elements. If no candidate pair exists, emit
      Empty and stop. Do not search a class inside this record.
    controls:
      - >-
        Proves-too-much: the random support-matched system. Its falls are
        logged and are not curve effects.
      - >-
        Nearby object: at least two further gauge models of the outlier j.
      - >-
        Fixture extraction on a curve that is not claimed to be an
        outlier, to show the extractor can succeed and can be checked by
        reduction.
      - Neighbor matrix unfinished: the pair is Unmeasured, which counts as Reject for acceptance and is not an absence.
    required_metrics:
      - stored multiplier tuple or an explicit statement that none exists
      - degree of the combination on the outlier
      - new_falls(D) on the neighbor and on the random system
      - gauge-orbit reproduction bit
      - the label Accept-extra, Accept-missing, Reject, or Empty
  falsification_conditions:
    - >-
      The fixture extraction fails on a degree with new_falls(D) > 0.
      The gate is void and accepts nothing.
    - >-
      A pair is accepted without a stored tuple. That acceptance is
      withdrawn.
    - >-
      The random system shows the same drop and the pair was accepted as
      a curve effect. That acceptance is withdrawn.
    - >-
      A gauge model of the outlier j fails to reproduce the drop. The
      witness is a coordinate artifact and the pair is rejected.
    - >-
      Empty is a valid outcome. It falsifies nothing about the class. It
      falsifies any claim that this gate found an outlier.
  confounders:
    - Reading a difference of two integers as a syzygy.
    - A kernel vector that reduces to the zero polynomial.
    - Comparing tuples across different (a, b) as if the generators were the same polynomials.
    - An unfinished neighbor matrix called an absence.
    - A random system whose support was not actually the same.
    - Gauge u = 1 counted as an independent model.
  interpretation_limits:
    - >-
      KN-OPEN-020: no new factor base. The witness is a syzygy of an
      existing presentation.
    - >-
      Acceptance is toy-tier evidence about the proxy. It is not a
      discrete-log algorithm. The walk to the outlier remains uncharged.
      Charging it is future work after an Accept label, not part of this
      gate.
    - >-
      A flat profile does not prove the solving degree is small above
      the cap. H1 is not the Petit-Quisquater assumption. This gate does
      not compute the Bardet-Faugère-Salvy degree of regularity.
    - >-
      Reject and Empty are completed controls. They are not evidence
      that no outlier exists outside the supplied pairs.
    - One witness at one degree does not constrain other degrees.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Inside the cap, a witnessed new_falls(D) > 0 tracks a real growth
        of the solving degree of that presentation, and a certified
        new_falls(D) = 0 tracks the absence of that growth at D. This is
        not the Petit-Quisquater first-fall-degree assumption. A profile
        that is flat through the cap does not prove the solving degree
        is small above the cap.
      rigorous_support: >-
        none; this is the hypothesis under test. The existence of the
        multiplier tuple is exact linear algebra once the matrix is
        built. Equating that tuple with the solving degree is not a
        theorem used here.
      validation_plan: >-
        On the fixture curve, reduce the stored tuple against the
        generators and check the degree by exact division. Then compare
        D with the highest degree of a finished degree-by-degree
        elimination on that same curve if one finishes by D_max.
        Disagreement by 1 or more falsifies H1 on the fixture.
        Parameters: one toy curve, one degree D, no cryptographic
        transfer. Tail check: a witness at D says nothing about degrees
        above D_max, and the report states that.
    - id: H2
      statement: >-
        A degree drop that also appears in a uniform random coefficient
        system of the same monomial support is a property of the support,
        not of the curve. The gate therefore refuses to call it a curve
        effect.
      rigorous_support: >-
        none; this is the hypothesis under test. It imitates the idea
        that a generic system with a given support has a determined
        Macaulay behaviour, which IDEA-20260807-f6137c records as
        unavailable as ground truth for Semaev systems. The random arm
        is a control, not a semi-regularity theorem.
      validation_plan: >-
        Draw at least four independent random systems with the fixture
        curve's monomial support. Record the set of D <= D_max with
        new_falls(D) > 0. If those four sets disagree among themselves,
        the support does not determine the profile at this size, and H2
        is too strong for that support: the gate may not use "the"
        generic fall as a single set, and must say so. Parameters: four
        draws, one support, toy p. No tail law beyond that stability
        check.
  target_complexity:
    time_exponent: N^{1/2} for the ECDLP. No improvement is claimed.
    memory_exponent: >-
      O(1) for rho. The gate stores one kernel vector and a few capped
      matrices at one degree D.
    best_known: >-
      Pollard rho, time N^{1/2}, memory O(1). For the meter, one
      degree-capped rank profile plus one kernel extraction.
    hidden_overhead: >-
      No attack is claimed. An accepted O3 cell still has an uncharged
      walk. This gate does not hide that cost inside an o(1).
    tradeoff_note: >-
      The gate runs only on supplied pairs. It is not a search and it
      is not a rho tradeoff.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  dominated_by: >-
    As an ECDLP attack, Pollard rho dominates on time, memory, and
    queries. As an acceptance test, a bare difference of new_falls
    values does not dominate this gate, because that difference has no
    polynomial witness. Checked against IDEA-20260916-4b7c1e, which
    defines the dimension the witness must realize, and against
    IDEA-20260807-f6137c, which blocks a true d_reg meter. No published
    attack was found in the opened records that accepts an isogeny-class
    outlier on a scalar fall gap alone. The survey of attacks stopped at
    rho plus the records named in discriminated_from.
  sota_delta: >-
    ECDLP time-exponent delta 0. Memory-exponent delta 0. Query delta 0.
    The gate adds a stored multiplier tuple and two negative checks
    (neighbor and random system) that a scalar new_falls gap does not
    contain.
  discriminated_from: >-
    IDEA-20260916-4b7c1e defines new_falls as a dimension. This record
    demands a vector that realizes a differing dimension and refuses to
    treat the integer as the mechanism.
    IDEA-20260731-016 would call a rare meter gap an endpoint. This gate
    rejects that gap unless the syzygy, the neighbor, the random system,
    and the gauge orbit all agree with the rule.
    IDEA-20260807-427cf3 is not assumed; a witnessed gap at matched
    factor-base size is eligible and a mere rank-profile claim is not.
    IDEA-20260807-8b9486 locates support changes. A support change is
    not automatically a witness; the random system has the same support
    and is the control that blocks that shortcut.
    IDEA-20260807-6eb96b is the gauge-orbit control used on the outlier,
    not a new null design.
    IDEA-20260807-f6137c: agreed, do not compute Bardet-Faugère-Salvy
    degree of regularity. The witness is a polynomial, which that
    closure says a d_reg meter cannot plant.
    IDEA-20260807-899c5e: the degree of a reduced basis is not the
    witness.
    IDEA-20260826-2259f8 uses the first fall as the meter. This gate can
    accept a later fall or a missing fall, and only with a tuple.
    IDEA-20260903-47f358 searches for a lower first fall. This record
    does not search.
    IDEA-20260901-2fb77b is about fibration counts. Different object.
    Parent questions RQ-ICINV-475b5e, RQ-DREG-bd6c86, RQ-VOLC-f6253b,
    and RQ-ECTD-001 are cited and not restated.
