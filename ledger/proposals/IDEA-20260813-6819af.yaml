idea:
  id: IDEA-20260813-6819af
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MQOM-001
  goal_id: GOAL-MQOM-001
  title: >-
    Reduction-loss saturation ledger: isolate every TCitH ROM/QROM game hop
    and search for a matching adversary or a provable slack witness
  class: control
  claim: >-
    After the primary TCitH ROM and QROM proofs are filed, their concrete
    security bounds can be decomposed into a directed ledger of individual
    game hops, each with an exact advantage transformation, query dependence,
    abort event and parameter substitution.  For every multiplicative or
    additive loss, a finite toy adversary family can be searched for either a
    saturation witness or a strict upper bound showing the loss is proof slack.
    The product of independently worst-case hop losses is not assumed jointly
    attainable: compatibility constraints between hop witnesses are the main
    observable.  This proposal makes no statement that the published bound is
    loose or tight because no primary proof or adversary was analyzed here.
  mechanism: >-
    Represent the reduction as games G_0 through G_k and record inequalities
    Adv_i <= a_i Adv_{i+1}+b_i with exact query, challenge and repetition
    domains.  For each hop, define a witness ratio between the achieved toy
    advantage change and its stated bound.  Then encode witness compatibility:
    the oracle-query pattern, transcript event or forgery distribution that
    saturates hop i may make hop j impossible.  A joint optimization over the
    same adversary/transcript distribution gives a lower bound on attainable
    total loss, while symbolic composition gives the proof upper bound.  The
    interval between them is a concrete tightness bracket.  ROM and QROM ledgers
    remain separate; any measure-and-reprogram or quantum-query factor is not
    treated as a classical sampling probability unless the primary lemma says so.
  why_not_a_renamed_known_approach: >-
    IDEA-20260801-018 measures overall toy TCitH tightness, IDEA-20260805-7abf04
    derives a zero-slack Fiat-Shamir/grinding inequality, and IDEA-20260808-
    721f2b computes an exact toy optimal-forger DP.  This proposal uses those
    objects only as possible endpoint fixtures: its new carrier is the full
    hop-by-hop loss ledger and the joint compatibility of separate saturation
    witnesses.  It is also distinct from cec9b6's correlated GGM/tree proof
    dependency channel and aa551f's challenge-space combinatorics because it
    covers every declared ROM/QROM hop with one compositional accounting rule.
  predictions:
    - observable: identity-hop fixture
      metric: saturation_ratio
      predicted: exactly 1 with zero additive loss
    - observable: planted abort hop
      metric: achieved_to_bound_loss_ratio
      predicted: >-
        Equal to 1 for an adversary whose success is supported exactly on the
        planted abort event of frozen probability p.
    - observable: independently versus jointly optimized hops
      metric: compatibility_gap_bits
      predicted: >-
        Joint attainable loss is never worse than the product of independent
        hop upper bounds; strict separation identifies incompatible witnesses.
    - observable: ROM versus QROM query factors
      metric: loss_bits_by_query_budget
      predicted: >-
        Every factor is reproduced symbolically from its primary lemma and
        evaluated on the exact parameter/query table without silent rounding.
  minimal_test:
    design: >-
      File the primary proof and transcribe each game, event, lemma and bound
      into a schema checked by a second transcription.  Freeze toy oracle and
      adversary spaces small enough for exhaustive optimization, plus identity,
      planted-abort and incompatible-hop controls.  Reproduce the final bound
      by symbolic composition.  Optimize each hop separately and all hops
      jointly over the same adversary representation.  Report upper and lower
      loss brackets in bits, never a single tightness label.  No solving-degree
      or MQ hardness experiment is part of this proposal.
    test_boundary:
      instances: filed ROM/QROM proof games and finite toy oracle/adversary spaces
      parameters: exact scheme query bounds plus explicitly smaller exhaustive toy budgets
      oracle_model: symbolic ROM and separately specified finite QROM surrogate only where a primary lemma licenses it
      preprocessing: proof transcription and adversary-space construction are charged
      stopping_rule: stop if independent transcription or identity-hop reproduction fails
    required_metrics:
      - exact a_i, b_i, event and query dependence for every hop
      - independently optimized and jointly optimized witness ratios
      - proof upper bound, attainable lower bound and gap in bits
      - adversary and transcript certificates for every reported witness
      - state-space size, time, memory and preprocessing
  controls:
    - name: identity game hop
      kind: exact_null
      construction: two byte-for-byte identical finite games with the same oracle and transcript law
      forced_value: zero advantage difference and saturation ratio one for the equality bound
      gate: any discrepancy invalidates the ledger or optimizer
    - name: planted abort event
      kind: biased_positive
      construction: >-
        Modify a finite game only on a public event E of exact probability p
        and use an adversary succeeding exactly on E.
      forced_value: additive advantage gap p and exact saturation of the union/abort bound
      gate: the optimizer must recover the witness and exact p before real hops are classified
    - name: incompatible-witness pair
      kind: nearby_object_control
      construction: >-
        Two hops whose individual worst cases require disjoint first oracle
        queries, so each saturates alone but no one adversary saturates both.
      forced_value: joint loss strictly smaller than product of independent worst cases
      gate: failure shows the joint optimizer does not enforce one common adversary
  confounders:
    - A finite QROM surrogate is not a quantum proof and cannot validate a general quantum lemma.
    - Transcription errors can manufacture or erase security bits; dual transcription and source anchors are mandatory.
    - Hop-wise saturation does not imply simultaneous saturation.
    - Optimizer failure or budget exhaustion is infrastructure, not evidence of proof tightness.
    - Primary TCitH proofs and exact parameter substitutions were not checked in this task.
  falsification_conditions:
    - The identity hop does not reproduce equality exactly.
    - The planted abort witness is not recovered with exact advantage p.
    - Joint optimization returns a value exceeding the symbolic proof upper bound.
    - Recomposition of transcribed hops fails to reproduce the filed final bound.
    - A claimed slack hop lacks a certified adversary lower bound and a proved upper restriction on the searched class.
  interpretation_limits:
    - A toy compatibility gap is scoped to the finite adversary/oracle class.
    - No result changes random-MQ hardness or constitutes a TCitH forgery.
    - QROM conclusions require primary quantum-proof review; classical DP cannot establish them.
    - Security-bit improvements require Coordinator synthesis of the exact filed proof, parameters and independent review.
  assumptions:
    - Every proof hop can be represented with explicit games, events and advantage inequalities.
    - The finite toy adversary class is enumerable and certificates can be replayed independently.
    - ROM and QROM resources remain separately accounted and are never silently equated.
  heuristic_assumptions:
    - id: HEUR-6819AF-1
      formal_statement: >-
        The dominant incompatibility between hop-wise worst cases appears in
        exhaustive adversaries using at most four toy oracle queries.
      rigorous_support: none beyond finite exhaustive coverage; larger-query adversaries may realize new compatibility patterns
      validation_plan: compute exact brackets for nested query budgets one through four and require stabilization before extrapolation
      falsification_condition: compatibility gap changes by more than one bit between the last two budgets
    - id: HEUR-6819AF-2
      formal_statement: >-
        At exact scheme parameters, at least eighty percent of the final proof-
        loss bits are attributable to at most three explicitly named hops.
      rigorous_support: purely algebraic once primary factors are transcribed, but the eighty-percent concentration is unknown
      validation_plan: evaluate the exact symbolic ledger and rank marginal bit contributions under one-at-a-time replacement by equality
      falsification_condition: more than three hops are required to account for eighty percent
  proof_search_map:
    bottleneck: distinguishing unavoidable reduction loss from independently maximized but jointly incompatible proof slack
    baseline_embedding:
      parameter_slice: identity hops and the exact final parameter substitution from the filed proof
      reproduction_check: symbolic recomposition must reproduce the published final expression and toy identity exactly
    observation_collision:
      observable: list of individual hop saturation ratios
      distinct_preimage_search: >-
        Construct compatible and incompatible hop systems with identical
        individual ratios but different joint attainable loss.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: joint witness-compatibility constraint graph
        predicted_gain: separates hop-wise from end-to-end tightness
      - transform: telescoping_potential
        proposed_object: exact additive log-loss ledger over game hops
        predicted_gain: localizes bit loss without hiding additive abort terms
    quantifier_order: >-
      For every adversary in the frozen class there exists one induced
      transcript distribution shared across all hops; there may not be a
      different adversary chosen independently for each hop when claiming an
      end-to-end lower bound.
    method_ceiling:
      strongest_certifiable_claim: exact tightness bracket for the finite toy adversary/oracle class and symbolic filed upper bound
      nearby_object_control: incompatible-hop fixture with the same marginal hop ratios as a compatible fixture
    proof_obligations:
      - claim: every transcribed hop matches its primary source
        responsibility: baseline
      - claim: witness advantage is computed exactly in both adjacent games
        responsibility: correctness
      - claim: joint optimizer uses one common adversary and transcript law
        responsibility: interface
      - claim: finite class and QROM surrogate limitations are explicit
        responsibility: scope
      - claim: state-space and optimization costs are charged
        responsibility: runtime
    not_applicable_reason: null
  target_complexity:
    time_exponent: no attack exponent; exhaustive toy optimization may be exponential in adversary state and query count
    memory_exponent: explicit dynamic-program or linear-optimization state size, fully reported
    best_known_baseline: >-
      IDEA-20260801-018 overall toy tightness, IDEA-20260805-7abf04 one zero-
      slack inequality and IDEA-20260808-721f2b endpoint optimal-forger DP.
    hidden_overhead_disclosure: proof transcription, QROM state representation, joint compatibility constraints and exact arithmetic
    time_memory_tradeoff: retain all adversary states for exact DP or recompute layers with lower memory and higher time
    data_queries: symbolic/toy oracle queries only; exact query budgets are explicit
    preprocessing: proof ledger and finite game construction, charged
    oracle_model: ROM and QROM kept separate
    retry_success_accounting: no retries; exact finite optimization or bounded incomplete outcome
  sota_delta: >-
    Quantitative output is a bit interval [attainable loss, proof upper loss]
    per hop and end to end.  Until computed from primary proofs, the security-
    bit delta is zero and tightness remains unverified.
  dominated_by: >-
    n/a (no attack result claimed).  Checked all eight MQOM prior rows across
    time, memory, data, preprocessing and oracle model.  IDEA-20260808-721f2b
    may dominate endpoint toy-forger optimization and 7abf04 may dominate its
    one inequality, but neither dominates full-hop joint compatibility.
    External Pareto status is unverified.
  estimated_cost:
    implementation: high
    compute: medium
    data: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.95 that a dual-transcribed ledger localizes proof-loss bits; 0.65 that
    incompatible hop witnesses produce a nonzero toy gap; unknown whether the
    exact dominant QROM loss is improvable without new proof techniques.
  novelty_status: unverified
  novelty_screen: >-
    Internal receipts include overall tightness, one FS/grinding inequality,
    correlated tree dependencies and optimal-forger DP, but no complete
    end-to-end saturation-compatibility ledger.  The index is stale, and no
    primary proof literature was checked; novelty is unverified.
  discriminated_from: >-
    Exact nearest neighbor IDEA-20260808-721f2b finds an exact toy optimal
    forger at the endpoint.  This proposal decomposes every proof hop and asks
    whether the separate worst-case witnesses can be realized by that same
    adversary across the whole reduction.
