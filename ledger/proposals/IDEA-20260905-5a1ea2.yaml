idea:
  id: IDEA-20260905-5a1ea2
  added: '2026-09-05'
  recorded_at: '2026-09-05'
  title: >-
    THE SUMSET ENVELOPE, GRAMMAR-FREE AND WITH ITS BLIND SPOT NAMED: the x-histogram
    of P+Q over a factor base F has an additive-character transform whose maximum
    bounds the yield lift of EVERY interval or residue predicate at once and a
    quadratic-character transform whose maximum bounds every Legendre-type predicate
    -- the additive envelope is provably blind to the one known-true concentration
    (a subgroup-contained base on an even-order curve, whose sumset lives on the
    squares and is spectrally flat by Gauss sums), and the recalled bilinear bound
    is vacuous exactly at index-calculus sizes |F| <= sqrt(p), so both envelopes are
    measured with their decay slope at |F| = p^(1/3) and p^(1/2)
  class: measurement
  question_id: RQ-ECDLP-4fcbd3
  question_ids: [RQ-ECDLP-4fcbd3, RQ-FBG-001, RQ-ECDLP-002, RQ-CRYPTO-001]
  goal_ids: [GOAL-ECDLP-001, GOAL-CRYPTO-001]
  goal_applicability:
    GOAL-ECDLP-001: >-
      Turns the lane's factor-base premise ("x(P+Q) over factor-base sums is not
      flat") into two numbers per base with a null of the same shape and a decay
      slope, and supplies an upper envelope that every future x-line predicate
      proposal (IDEA-20260830-c5c614's grammar included) is bounded by.
    GOAL-CRYPTO-001: >-
      Locates the only regime where the literature bound is vacuous (|F| below
      sqrt(p)) and measures there, which is where an index-calculus relation
      collector would have to live.
  status: proposed
  proposed_by: claude-code-session
  claim: >-
    (A) THE OBJECT. For a factor base F of size m inside a prime-order subgroup G
    of E(F_p), let H_F(x) = #{(P, Q) in F x F, P != +-Q : x(P + Q) = x} for x in
    F_p. Define the additive envelope S_add(F) = max over a != 0 of |sum over x of
    H_F(x) e(a x / p)| / m^2 and the quadratic envelope S_quad(F) = max over c in
    F_p of |sum over x of H_F(x) Legendre(x - c)| / m^2. Both are one FFT each
    (the second is a cyclic convolution of H_F with the Legendre symbol).
    (B) WHY THEY ARE ENVELOPES. For any predicate pi on x with additive Fourier
    l^1 norm ||pi^||_1, the relative excess of the sumset mass on pi over its
    density is at most S_add(F) * ||pi^||_1 / |supp pi|, by Parseval; intervals and
    residue classes have ||pi^||_1 = O(p log p), so their lift is bounded by
    S_add * O(p log p)/|supp pi|. Legendre-type predicates of x - c are bounded by
    S_quad directly. So the pair (S_add, S_quad) bounds the lift of every cheap
    x-line predicate in the two classes at once, without choosing a grammar.
    (C) THE NULL AND ITS PREDICTED LEVEL. For F a uniformly random m-subset of G
    the pair counts are Poisson-like with mean m^2/p per x, the transform at each
    a != 0 is a sum of about m^2 unit phases, so |H^(a)| is about m and the
    maximum over p frequencies is about m sqrt(2 log p): S_add(null) = sqrt(2 log
    p)/m, and S_quad(null) is the same order. That is the white level, and it
    scales like 1/m.
    (D) THE PREDICTIONS. (D1) For the interval base F_B = {W in G : x(W) < B} and
    the residue base F_res = {W : x(W) = 0 mod m0}, at m = p^(1/3) and m =
    p^(1/2), both envelopes are within a factor 2 of the random null's envelopes,
    and their slope against log p at fixed m = p^(gamma) is -gamma within +-0.1
    (that is, they track 1/m). (D2) The recalled bilinear bound (double character
    sums over elliptic curves, Banks-Friedlander-Garaev-Shparlinski, recalled as
    of the shape sqrt(|A||B|) sqrt(p) up to logs) gives S_add <= c sqrt(p)/m for
    m above sqrt(p) and NOTHING below it; the measurement at m = p^(1/3) is
    therefore in the unproved regime, and (D1) predicts the white level there
    anyway. (D3) THE BLIND SPOT, WHICH IS THE POSITIVE CONTROL. On a cyclic curve
    of order 2q with rational 2-torsion (e, 0), a base F inside the index-2
    subgroup has F + F inside it too, so H_F is supported on {x : x - e is a
    square}; then S_quad(F) at c = e equals 1 exactly (maximal), while S_add(F) is
    about 1/sqrt(p) because the indicator of the squares has Gauss-sum-flat
    additive spectrum: for m < sqrt(p) the additive envelope of this maximally
    structured base is BELOW the random null. An additive-only instrument would
    call the known leak flat. The instrument must therefore carry both envelopes,
    and the positive control must be reported as S_quad = 1 and S_add at or below
    the null level.
  mechanism: >-
    WHY THE SUMSET COULD BE NON-FLAT AT ALL. x(P + Q) = lambda^2 - x_P - x_Q with
    lambda = (y_Q - y_P)/(x_Q - x_P): an algebraic correspondence of bounded degree
    applied to the box F x F. A base defined by an x-line condition constrains the
    inputs algebraically, and the pushforward of a structured box along a
    bounded-degree correspondence need not be flat; c5c614 makes this argument for
    the target side. Whether the deviation is at the white level or above it is a
    question the bilinear bounds answer only for |F| > sqrt(p); below that the
    only available answers are measurements.
    WHY TWO ENVELOPES AND NOT ONE. The cheap x-line predicates the program uses
    come in two families: size conditions (intervals, residues, low bits), which
    expand in additive characters, and residuosity conditions (Legendre symbols
    of x - c), which are multiplicative characters. The additive spectrum of a
    multiplicative object is flat (Gauss sums), so an additive envelope cannot see
    residuosity structure and a quadratic envelope cannot see interval structure.
    The 2-torsion object is exactly a residuosity structure, which is why it is
    the control that forced the second envelope into the design.
    RELATION TO CONSERVATION AND TO c5c614. KN-FIND-007 fixes the MEAN yield over
    the whole group; both envelopes are statements about the DISTRIBUTION and are
    consistent with conservation by construction (the a = 0 term is the mean and
    is excluded from the max). c5c614 measures the lift of a frozen predicate
    grammar with a random-partition null and a decay arm; this record measures the
    grammar-free upper envelope of all such lifts in two character families, so a
    white envelope here bounds every predicate c5c614 could freeze, and a lift
    found there must show up here as an envelope above the null.
    THE LOSSY-PROJECTION TEST. The tracked object is the pair of envelopes, two
    numbers from a histogram of p bins from m^2 pairs; it discards which pairs
    produced which x and keeps only the extremal correlation with each character
    family. It propagates compatibly with the operation relation collection
    performs (select targets by a predicate, count hits), because the lift of any
    predicate is bounded by the retained numbers. It passes; it is a change of
    coordinates only at m^2 = p when every bin is distinguishable, which is the
    degenerate case excluded by the size cap m <= p^(1/2).
  novelty_status: unverified
  novelty_screen:
    method: >-
      search_knowledge unavailable in this container (index empty). Local grep
      over ledger and knowledge for factor base, sumset, decomposition yield,
      x-line predicate, double character sums, Shparlinski; nearest records read
      as cited. Incomplete; no global novelty claim.
    nearest_internal_record: IDEA-20260830-c5c614
    precise_difference: >-
      c5c614 freezes a grammar of x-line predicates and measures each predicate's
      yield lift on the target side with a random-partition null and a growth arm.
      This record computes, from the same sumset, the maximum over ALL additive
      and all quadratic characters at once (grammar-free envelopes), proves the
      envelopes bound every predicate lift in those families, names the additive
      envelope's blind spot with the object that exposes it, and places the
      measurement at the sizes where the literature bound is vacuous.
    second_nearest: KN-FIND-007
    second_difference: >-
      Conservation fixes the mean; the envelopes exclude the mean term and measure
      distribution only, so they are neither refuted nor implied by it.
    scope: No global novelty claim.
  citations:
    - ref: IDEA-20260830-c5c614
      provenance: internal
      claim: >-
        Title, claim (A)-(B), mechanism and citations sections read; frozen
        x-line predicate grammar, random-partition null, growth arm, and the
        red-team probe's 1/8-window-in-log-space excess of 8.01 versus 1.0 on the
        whole group.
      verified_by: claude-code-session 2026-09-05 (Read, sections named; the
        predictions and minimal_test sections were not read)
    - ref: KN-FIND-007
      provenance: internal
      claim: >-
        Mean per-target decomposition yield is binom(B+m-1, m)/N for every base of
        size B; only the distribution is free; the finding says nothing about the
        distribution of counts.
      verified_by: claude-code-session 2026-09-05 (Read, all lines)
    - ref: RQ-FBG-001
      provenance: internal
      claim: >-
        The factor-base geometry question and its growth-with-N clause, as
        relayed in c5c614's citation of it.
      verified_by: claude-code-session 2026-09-05 (relayed through c5c614; the
        RQ record itself was not opened)
    - ref: harness/toycurve.py
      provenance: internal
      claim: Exact affine arithmetic, naive point counting, lift_x.
      verified_by: claude-code-session 2026-09-05 (Read, lines 1-330)
    - ref: Banks, W., Friedlander, J., Garaev, M. and Shparlinski, I., Double character sums over elliptic curves and finite fields, Pure Appl. Math. Q. 2 (2006)
      provenance: recalled
      claim: >-
        Recalled as bounding sums of additive characters of x(P + Q) over P in A,
        Q in B by an expression of the shape sqrt(|A||B|) sqrt(p) up to logs,
        nontrivial only when |A||B| exceeds p. Title, venue and exact shape
        unverified here; first reading obligation for the lane's factor-base arm.
      verified_by: null
    - ref: 'Gauss sums (classical) -- the additive Fourier transform of the Legendre symbol has modulus sqrt(p) at every nonzero frequency'
      provenance: recalled
      claim: >-
        Classical; used for the blind-spot statement (D3). Any number theory text
        states it; recorded as recalled because no agent opened a source for it
        in this program.
      verified_by: null
  assumptions:
    - >-
      Bases are subsets of the prime-order subgroup G (cofactor 1 curves for the
      primary arm) so that P + Q stays in G and the x-histogram is over G's
      x-coordinates.
    - >-
      Pairs with P = +-Q are excluded (doubling is a different correspondence and
      P + (-P) = O has no x); the count of excluded pairs is reported.
    - >-
      Toy scale, field_bits 12 to 24, m in {p^(1/3), p^(1/2)} rounded, 32 random
      bases per cell for the null distribution.
  proof_search_map:
    bottleneck: >-
      The inequality "envelope at the white level 1/m" for structured bases at
      m <= sqrt(p), where no bilinear bound applies. Its failure is the only route
      from sumset non-flatness to a yield-relevant lift above what c5c614's
      grammar could find.
    baseline_embedding:
      parameter_slice: >-
        The random base at every cell (the null of the same shape), and the
        single-cell k = 1 degenerate check: the a = 0 term reproduces the pair
        count m(m-1) minus excluded pairs exactly.
      reproduction_check: >-
        The a = 0 coefficient equals the number of counted pairs exactly; the
        random null's envelope matches sqrt(2 log p)/m within a factor 1.5.
    observation_collision:
      observable: the pair (S_add, S_quad)
      distinct_preimage_search: >-
        A base with residuosity structure and a base with interval structure can
        have identical S_add (the first is flat additively); that is the named
        blind spot and it is separated by S_quad. A base with structure in a
        character family outside both (higher-order multiplicative characters,
        for instance cubic residues on a curve with p = 1 mod 3) is invisible to
        both envelopes, and that limit is stated rather than hidden.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fibre of "white envelope" over the space of x-line bases, enumerated
          on interval and residue bases at two size exponents.
        predicted_gain: None on the exponent; a bound reusable by every x-line proposal.
    quantifier_order: >-
      FOR ALL cells in the ladder, FOR ALL frequencies a != 0 and shifts c: the
      transforms are at the white level. The alternative is existential in (a) or
      (c) and must persist across p at fixed size exponent.
    method_ceiling:
      strongest_certifiable_claim: >-
        At toy scale, the measured envelopes and slopes for the named bases, and
        detection of the known-true object by S_quad. Cannot certify flatness in
        character families outside the two measured, nor at larger p beyond the
        slopes.
      nearby_object_control: >-
        The subgroup-contained base on a cyclic order-2q curve: S_quad = 1 at c =
        e (known-true concentration) and S_add at or below the null (the blind
        spot, known in advance).
    proof_obligations:
      - claim: The envelope inequality in (B) via Parseval.
        responsibility: correctness
      - claim: The null level sqrt(2 log p)/m for random bases.
        responsibility: size
      - claim: Gauss-sum flatness of the squares' indicator, hence S_add(control) at or below null.
        responsibility: baseline
      - claim: Two FFTs of length p per base within one tool window at p <= 2^24.
        responsibility: runtime
      - claim: Toy tier; no transfer.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: envelope_ratio_to_null
      direction: different
      minimum_effect: >-
        Null: S_add(F)/S_add(null) and S_quad(F)/S_quad(null) within a factor 2 at
        every cell for the interval and residue bases. Structure: a ratio above 4
        at the two largest p with a positive slope in log p.
    - metric: envelope_slope_vs_log_p
      direction: different
      minimum_effect: >-
        Null: slope -gamma +- 0.1 at fixed m = p^gamma for both envelopes.
        Structure: slope above -gamma + 0.25.
    - metric: positive_control_quadratic_envelope
      direction: higher
      minimum_effect: S_quad(F_sub) = 1 at c = e exactly; S_add(F_sub) at or below the null.
  minimal_test:
    design: >-
      For field_bits in {12, 16, 20, 24}, three seeds, prime-order curves: build
      F_B, F_res and 32 random bases at m = p^(1/3) and m = p^(1/2); compute H_F
      over all pairs; two FFTs per base; report envelopes, ratios to the null
      distribution, and slopes. On a cyclic order-2q curve per size, run the
      subgroup-contained base as the positive control.
    controls:
      - 32 uniformly random m-subsets of G per cell (null of the same shape)
      - second curve family per size
      - subgroup-contained base on an order-2q curve (known-true; S_quad must read 1)
      - exact a = 0 pair-count reproduction per base
    required_metrics:
      - S_add and S_quad per base per cell with the null distribution beside them
      - slopes against log p at each size exponent
      - the positive control's two envelopes
      - wall seconds and peak bytes per cell
  falsification_conditions:
    - >-
      An interval or residue base has an envelope ratio above 4 at the two largest
      p with a positive slope, replicated on the second curve family. Claim (D1)
      is FALSE for that base and the envelope becomes a resource for c5c614's
      grammar, which is then the successor.
    - >-
      The positive control's S_quad is not 1 at c = e, or its S_add is above the
      null. The instrument or the descent claim is wrong; nothing is reported.
    - >-
      The random null's envelope departs from sqrt(2 log p)/m by more than a
      factor 1.5. Normalisation defect; instrument, not result.
  confounders:
    - >-
      Excluded pairs (P = +-Q) and the point at infinity bias the count at tiny
      m; the count of excluded pairs is reported and the null shares it.
    - >-
      At m = p^(1/2) the histogram has one expected hit per bin; the envelopes are
      then dominated by Poisson noise on both arms, which is why the null is a
      distribution of 32 draws and not a formula.
  interpretation_limits:
    - Toy tier; the size exponents 1/3 and 1/2 are the index-calculus sizes for
      m = 3 and m = 2 decompositions and nothing else is measured.
    - A white envelope bounds lifts in two character families only; higher-order
      multiplicative structure is out of scope and said so.
    - No attack, no exponent; the deliverable is an envelope and a slope.
  heuristic_assumptions:
    - id: H1
      statement: >-
        White-envelope heuristic: for x-line bases of size m <= sqrt(p), the
        sumset x-histogram's additive and quadratic transforms behave like those
        of a random m-subset, so both envelopes are at sqrt(2 log p)/m.
      rigorous_support: >-
        Above m = sqrt(p) the recalled bilinear bound (unverified here) forces the
        additive envelope down to c sqrt(p)/m; below it there is no rigorous
        support, and the classical statement imitated is the Poisson law of a
        random subset's pair counts.
      validation_plan: >-
        This record's measurement at m = p^(1/3) and p^(1/2) against 32 random
        bases per cell, with the tail check that the largest envelope observed
        across all cells has null exceedance probability above 1/(number of
        bases measured).
  target_complexity:
    time_exponent: >-
      No exponent claim. Under the null, no x-line predicate lifts yield beyond
      c5c614's bounded channels; a measured envelope above the null would model
      to a relation-cost factor 1/coverage reduction that is bounded by the
      envelope times the predicate's l^1 norm, reported as a model only.
    memory_exponent: O(p) for the toy histogram; not an attack quantity.
    best_known: 'Generic rho 0.886 sqrt(N) (KN-TECH-006); conservation bounds the mean (KN-FIND-007).'
    hidden_overhead: None; a measurement.
    tradeoff_note: Not applicable.
  estimated_cost:
    implementation: low
    compute: low
    note: >-
      m^2 group additions per base (16 million at m = 4096) is minutes in pure
      Python; two FFTs of length p <= 2^24 are seconds; the ladder is a few CPU
      hours.
  recommended_priority: medium
  dominated_by: null
  dominated_by_check: >-
    Checked against c5c614 (a grammar, dominated on breadth by this envelope but
    not on the yield metric it measures, which this record does not measure) and
    KN-FIND-007 (mean only). Set to null after that check.
  sota_delta: >-
    Zero on the exponent. The delta is an envelope every x-line proposal is
    bounded by, a named blind spot of additive-only instruments, and a measurement
    in the regime where the literature bound is vacuous.
  inference:
    policy: research-deep
    requested_policy: research-deep
    reasoning_effort: max
    resolved_model_id: null
    model_verified: false
    fallback_used: false
    degraded_requirements: []
    runtime_provenance: >-
      Authored directly in the top-level Claude Code session at max effort on the
      user's direction, not by a dispatched idea-generator subagent; no batch or
      task envelope exists for it. Model identifier not probed.
