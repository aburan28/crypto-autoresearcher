idea:
  id: IDEA-20260807-d329e2
  question_id: RQ-JINV-8fc13a
  added: '2026-08-07'
  title: >-
    Index the factor base by the Aut-QUOTIENT coordinate on special-j curves
    (w = y^2 for j=0, w = x^2 for j=1728) and derive the resulting summation
    polynomial: the derivation predicts that the quotient multiplies BOTH the
    fibre size AND the per-variable degree by exactly r = |Aut|/2, so the trade
    is neutral per variable and the net effect is linear algebra divided by r^2
    against relation collection multiplied by r^{m-1} - strictly worse than
    transporting relations in the x-coordinate, and the designated falsification
    test of the IDEA-20260807-f00729 closure
  class: algorithm

  claim: >-
    (A) THE CONSTRUCTION. On an ordinary curve with F_p-rational Aut of order
    2r (r = 3 for j=0 with p congruent to 1 mod 3, r = 2 for j=1728 with p
    congruent to 1 mod 4), the quotient E/Aut is a projective line and the
    quotient coordinate is explicit:
      j=0  (y^2 = x^3 + b):  w = y^2 = x^3 + b. The fibre of w is
        {(x, +-y) : x^3 = w - b} - three cube roots times two signs = SIX
        points, i.e. exactly one Aut-orbit.
      j=1728 (y^2 = x^3 + a x): w = x^2. The fibre is {(+-x, +-y)} - FOUR
        points, exactly one Aut-orbit.
    A factor base indexed by w therefore covers 2r points per element instead of
    the 2 points that an x-indexed element covers. That is the whole appeal: the
    same point coverage with r times fewer unknowns.

    (B) THE COST OF MAKING IT WORK, DERIVED. There is a summation polynomial in
    the quotient coordinate and its degree is forced. Using the weighted
    homogeneity of S_3 at a=0 (weight 4 with deg(x)=1, deg(b)=3), one has
    S_3(zeta x1, zeta x2, zeta x3) = zeta * S_3(x1,x2,x3) for zeta^3 = 1
    [derived in IDEA-20260807-477e40 claim (C)]. Define
      Pi(x1,x2,x3) = product over u,v in {0,1,2} of S_3(x1, zeta^u x2, zeta^v x3).
    Then Pi(zeta x1, x2, x3) = zeta^9 Pi = Pi, and likewise in x2 and x3, so Pi
    lies in F_p[x1^3, x2^3, x3^3] = F_p[w1 - b, w2 - b, w3 - b] and IS a
    polynomial in the quotient coordinates. Its degree: 9 factors each of
    x1-degree 2 gives x1-degree 18, hence degree 18/3 = 6 in x1^3, hence
      DEGREE EXACTLY 6 = 2r IN EACH w_i.
    The same computation at j=1728 with 4 factors gives x1-degree 8, hence
    degree 4 = 2r in each w_i. [both derived in this record; to be verified
    symbolically as the experiment's first act.]
    GENERAL FORM OF THE LAW: the quotient multiplies the fibre size by r AND
    multiplies the per-variable degree by r. Exactly r, in both places.

    (C) THE ACCOUNTING, AND IT COMES OUT NEGATIVE. Match point coverage: an
    x-base of size B and a w-base of size B/r cover the same 2B points, so the
    decomposition probability of a random target is the same and the number of
    ATTEMPTS per relation is the same.
      LINEAR ALGEBRA: B columns become B/r columns, so a dense or Wiedemann
        solve costs r^2 times less. Factor 9 (j=0), 4 (j=1728).
      RELATIONS NEEDED: B becomes B/r, a factor r fewer.
      COST PER DECOMPOSITION ATTEMPT: the arity-m system has per-variable degree
        2r instead of 2, so its Bezout number goes from 2^m to (2r)^m, a factor
        r^m more.
      NET COLLECTION COST: (B/r) relations x (same attempts) x (r^m per attempt)
        = r^{m-1} times MORE than the x-coordinate route.
    So the quotient coordinate buys r^2 on linear algebra and pays r^{m-1} on
    collection: a wash at m = 1 (meaningless), a factor-3 collection penalty at
    m = 2, a factor-9 penalty at m = 3 for j=0.
    CRUCIALLY, THE COMPETITOR IS NOT UNSTRUCTURED INDEX CALCULUS. It is
    IDEA-20260807-f8a045's route, which keeps the DEGREE-2 x-system and obtains
    the same r^2 linear-algebra saving by transporting each found relation
    through phi - paying NOTHING extra on collection. Against that competitor
    this proposal is worse by exactly r^{m-1} and it is worse for a reason that
    is structural, not implementational.

    (D) WHY PROPOSE IT AT ALL, AND WHAT WOULD MAKE IT WIN. Because (C) is a
    prediction and because there is one specific way it could be wrong. Pi
    factors: grouping the 9 factors by the difference of the two shift indices
    gives Pi = Pi_0 Pi_1 Pi_2 with Pi_d = product over u of
    S_3(x1, zeta^u x2, zeta^{u+d} x3), each of w1-degree 2 rather than 6. If any
    Pi_d were itself a function of (w1,w2,w3) the effective degree would fall
    from 6 to 2, the r^m penalty would vanish, and the quotient route would win
    outright by r^2 with no cost. The derivation says this does NOT happen -
    Pi_d is sent to Pi_{d-1} by x2 -> zeta x2, so the Pi_d are conjugate and
    individually not w-functions - but that derivation is exactly the kind of
    claim a symbolic computation should be made to confirm rather than believed.
    THE TWO OUTCOMES, FIXED IN ADVANCE:
      O1 Pi has w-degree exactly 2r and does not factor into w-functions. The
        quotient-coordinate route is strictly dominated by relation transport by
        r^{m-1}, the IDEA-20260807-f00729 closure survives its designated test,
        and lane L3's polynomial-level automorphism route is closed with a
        number attached. PREDICTED.
      O2 Pi factors into w-functions of degree below 2r. The closure's forward
        guidance item G2 fires, the quotient IS worth using at the polynomial
        level, and this becomes the lane's first genuine mechanism - still a
        constant (bounded by r^2 = 9), still not an exponent, but a real one.

    (E) WHAT IS CLAIMED BEYOND THE sqrt(|Aut|) CONSTANT: NOTHING. Even outcome
    O2 caps at a factor r^2 <= 9 on the linear-algebra stage of an algorithm
    that does not beat rho over prime fields. Filed as baseline calibration and
    as a falsification test of a closure, never as an attack.

  resource_label: >-
    R1 and R2 - x- and y-coordinates as field elements, and the curve equation
    that defines the quotient map. The quotient coordinate w is field data; no
    map is applied to a point of G in order to extract a group-theoretic
    advantage.

  admissibility: admissible
  admissibility_argument: >-
    The mechanism replaces one field-valued factor-base index by another and
    computes a different polynomial. Nothing in it queries the group beyond
    ordinary point arithmetic, so H-ENDO-001's scalar-action argument does not
    bind: that argument constrains what endomorphisms can do to the prime-order
    subgroup, whereas the quantity at stake here is the degree of a polynomial
    over F_p. KN-FIND-b7e091 closes oracles simulable by group operations and
    equality tests; the coefficients and degree of Pi are not such an output.
    Admissible - and predicted to lose anyway, which is a different and more
    useful fact than being inadmissible.

  discriminated_from:
    - >-
      IDEA-20260807-f8a045 (this batch), which obtains the SAME r^2
      linear-algebra saving by transporting relations in the x-coordinate. That
      is this proposal's true competitor and the comparison against it - not
      against unstructured index calculus - is the required reporting frame. The
      two are two realisations of one quotient; the point of running this one is
      to establish which realisation pays for it.
    - >-
      IDEA-20260807-477e40 (this batch), which measures the support of S_m under
      a=0 / b=0 in the SAME coordinate. This proposal changes coordinate and
      builds a different polynomial; it consumes 477e40's weighted-homogeneity
      result as an input and cannot be run before it.
    - >-
      IDEA-20260807-f00729 (this batch), the closure. This proposal is that
      closure's designated falsification test: f00729 predicts that algebraic
      constructions on E/Aut pay the non-homomorphism as a degree increase, and
      (B) computes that increase to be exactly r. If O2 fires, f00729's forward
      guidance G2 was right to leave the class open.
    - >-
      Lane L11 (RQ-MODEL-e61cb2), which compares Weierstrass, Montgomery,
      Edwards, Hessian, Jacobi-quartic, theta and Kummer models OF THE SAME
      CURVE. The Kummer line there is the quotient by NEGATION ONLY (r = 1).
      This proposal is the quotient by the FULL automorphism group at special j,
      which L11's model list does not contain. If the executor finds that a
      published model already realises E/Aut for j=0, that is an ingredient and
      must be recorded rather than treated as a collision.
    - >-
      KN-TECH-002, which gives deg(S_n) = 2^{n-2} per variable in the
      x-coordinate. The claim here is the analogous degree in the quotient
      coordinate, which KN-TECH-002 does not state.

  object_first_candidate:
    tracked_object: >-
      THE Aut-ORBIT, addressed by its quotient coordinate w - i.e. the same
      object IDEA-20260807-f00729 closes, but approached as a point of a variety
      rather than as an element of a set.
    lossiness: >-
      LOSSY: w forgets which of the 2r points of the fibre is held, discarding
      log2(2r) = 2.58 bits (j=0) or 2 bits (j=1728) per element. The forgetting
      is not recoverable from w alone.
    propagation: >-
      THE CRUX, AND IT IS THE SAME FAILURE AS f00729 SEEN ALGEBRAICALLY. w does
      not propagate through addition: w(P+Q) is not a function of w(P), w(Q).
      What DOES exist is an ALGEBRAIC RELATION among w(P_1), ..., w(P_n) when
      the points sum to zero, namely Pi = 0 - and restoring that relation is
      exactly what forces the degree from 2 to 2r. So the projection is
      compatible with the target's operations only after paying a degree
      multiplier equal to the amount forgotten. The lossy-projection test is
      passed (the object is genuinely lossy and the retained part does satisfy a
      deterministic algebraic relation) but the price of determinism is
      quantified and is the reason for the predicted loss.
    survival_score: >-
      Survives the construction of the summation polynomial at every arity, at
      a degree cost of r per variable per arity. Dies as a COST IMPROVEMENT at
      m >= 2 by the accounting in (C). Dies completely on generic curves, where
      r = 1 and the construction reduces to the ordinary x-coordinate.

  mechanism: >-
    STEP 1 (symbolic, minutes, HARD GATE). Verify (B) for j=0: form
    Pi = product over u,v of s3_expr(0,b) with x2 -> zeta^u x2, x3 -> zeta^v x3
    over F_p[zeta]/(zeta^2+zeta+1), expand, and check that every monomial has
    x_i-degree divisible by 3 in each variable separately. Then substitute
    x_i^3 = w_i - b and report the exact degree in each w_i. Assert 6. If Pi is
    not a polynomial in the x_i^3, the derivation is wrong and the proposal ends
    here.

    STEP 2 (symbolic, minutes, THE DECIDING TEST). Factor Pi over F_p for three
    declared primes and over the function field F_p(b). For each irreducible
    factor, test whether it is invariant under x_i -> zeta x_i SEPARATELY in each
    variable - i.e. whether it is itself a function of the w's. Predicted: only
    the full product is, and the three conjugate pieces Pi_0, Pi_1, Pi_2 are not.
    A factor that IS a w-function and has degree below 6 is outcome O2 and halts
    the line for independent verification before anything else is run.

    STEP 3 (symbolic, minutes). Repeat Steps 1-2 for j=1728 with the four-fold
    product and w = x^2; assert degree 4. Two families agreeing with the derived
    law "degree = 2r" is much stronger evidence than one.

    STEP 4 (implementation, medium). Build the w-indexed decomposition solver:
    factor base of B/r quotient elements, system {Pi(w1, ..., wm, w_R) = 0,
    membership equations for each w_i}, solved with the same solver and the same
    settings as the x-indexed baseline. Every recovered decomposition is
    certified by lifting back to points and re-verifying the sum with
    harness/toycurve.py - the lift is r-fold ambiguous and the certificate must
    name the chosen lift, which is the practical face of the non-homomorphism.

    STEP 5 (measurement). On matched instances, measure four cost quantities for
    three arms - x-indexed baseline, x-indexed with relation transport
    (IDEA-20260807-f8a045's route), and w-indexed - namely: attempts per
    relation, solver time per attempt, relations needed, and linear-algebra
    cost. Report the three arms' totals in one table in a single unit (F_p
    multiplications), plus matched rho and matched BSGS.

    STEP 6 (the honest closing move). Whatever the outcome, state the
    w-indexed route's cost as a RATIO TO THE RELATION-TRANSPORT ROUTE, not to
    unstructured index calculus. Reporting it against the weaker competitor
    would manufacture a speedup that the better-known method already has.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Run 2026-08-07 from the repository root.
      (1) grep -ril "summation polynomial" knowledge/ -> 40+ files; read
          KN-TECH-002 in full
      (2) grep -ril "kummer\|quotient coordinate\|y-coordinate factor base"
          knowledge/ ledger/ docs/ analysis/
      (3) read ledger/questions/RQ-MODEL-e61cb2.yaml summary in
          DECOMPOSITION.md section 4 (L11)
      (4) read harness/semaev.py in full
    results: >-
      KN-TECH-002 defines S_n in the x-coordinate only and records the symmetry
      exploitation of KN-LIT-004 (permutation and negation) without any
      automorphism-quotient coordinate. Kummer-line material in the corpus is
      about the negation quotient (r = 1), which is the standard x-coordinate
      and is already the baseline. L11 lists seven curve models, none of which is
      E/Aut for special j. harness/semaev.py builds S_3 and S_4 in x only. NO
      RECORD IN THIS REPOSITORY CONSTRUCTS A SUMMATION POLYNOMIAL IN AN
      AUTOMORPHISM-QUOTIENT COORDINATE.
    verdict: >-
      ADAPTATION, with an explicit external-priority caveat. Summation
      polynomials with respect to a general function of the curve, and symmetry
      reduction of decomposition systems, are established themes in the
      index-calculus literature, and it is entirely possible that the degree law
      "quotient multiplies degree by r" is published. A Stage-0 literature check
      is part of the design and a positive hit would supply the m >= 3 answer for
      free. NO NOVELTY IS CLAIMED AGAINST THE EXTERNAL LITERATURE; what is
      claimed is that this program has not computed it and that the resulting
      number decides a closure it is about to record.

  null_object_control: >-
    MANDATORY AND BLOCKING.
    N1 THE r = 1 NULL: run the identical construction on a GENERIC-j curve,
      where the automorphism group is {+-1} and the "quotient coordinate" is
      just x. The construction must reduce EXACTLY to S_3 with degree 2 - i.e.
      the machinery must return the baseline when there is no extra structure.
      An implementation that produces a degree-6 polynomial on a generic curve
      is wrong and every number it produced is void.
    N2 THE SIZE-MATCHED NULL: an x-indexed factor base of size B/r (NOT matched
      on coverage) run through the same solver, to separate "fewer unknowns" from
      "quotient structure". The w-route must beat this arm on relation yield -
      if it does not, its coverage claim in (C) is false.
    N3 THE FAKE-QUOTIENT NULL: index the factor base by an arbitrary 2r-to-1
      function of x that is NOT the Aut-quotient, and attempt the same
      construction. No summation polynomial of degree 2r should exist, and the
      pipeline must fail. Success here would mean the pipeline is not using the
      automorphism at all.
    DECAY PARAMETER: the arity m. The derived penalty r^{m-1} GROWS with m. A
    measured penalty flat in m contradicts the Bezout accounting in (C) and is
    the artifact tell; a penalty that shrinks with m would be outcome O2
    arriving by a different door and must be audited before it is believed.

  assumptions:
    - >-
      p congruent to 1 mod 3 (j=0) or 1 mod 4 (j=1728), curve ordinary, so the
      quotient map is defined over F_p and w takes values in F_p.
    - >-
      The weighted-homogeneity of S_3 at a=0 and b=0, which is
      IDEA-20260807-477e40's Step 2 output. This proposal DEPENDS on that result
      and must not be run before it.
    - >-
      The Bezout-number proxy for per-attempt solver cost. This is a proxy, not
      a measurement; Step 5 measures actual solver time and the two are reported
      side by side. If they disagree the measured time governs and the Bezout
      accounting in (C) is reported as refuted as a cost model.
    - >-
      Toy scale, p up to about 2^20 for the w-indexed solver (the degree-6
      system is materially harder than the degree-2 one and the reachable size is
      smaller - which is itself part of the finding).
    - >-
      Every decomposition is certified by lifting to points and re-verifying
      with harness/toycurve.py. An uncertified w-level "solution" is not a
      relation, because the lift can fail.

  proof_search_map:
    bottleneck: >-
      The degree of the quotient-coordinate summation polynomial. Everything in
      the accounting flows from it: 2r makes the route lose by r^{m-1}, anything
      below 2r could make it win. It is a single integer, computable
      symbolically in minutes, and it is the entire proposal.
    baseline_embedding:
      parameter_slice: >-
        r = 1 (generic curve). The construction must reproduce S_3 exactly -
        same 13 monomials, same per-variable degree 2 - because the quotient by
        {+-1} is the x-coordinate and the x-coordinate summation polynomial is
        S_3.
      reproduction_check: >-
        Frozen fixture: run the product construction with the trivial group and
        assert term-by-term equality with harness/semaev.py's s3_expr on a fixed
        (a,b). Any difference is an instrument failure and halts the line.
    observation_collision:
      observable: >-
        The per-variable degree of the quotient-coordinate summation polynomial.
      distinct_preimage_search: >-
        Search for a DIFFERENT 2r-to-1 map from E to A^1 (not the Aut-quotient)
        admitting a summation polynomial of the same degree 2r. If one exists,
        the degree is a function of the map's degree alone and carries no
        automorphism content - which would mean the construction is not using
        the special j-invariant at all and the whole framing is wrong. This is
        the N3 control promoted to a falsifier, and it is the sharpest available
        test of whether the object is the automorphism or merely a covering.
    quantifier_order: >-
      Intended: FORALL ordinary E/F_p with F_p-rational Aut of order 2r, EXISTS
      a polynomial Pi in the quotient coordinates, of degree exactly 2r in each
      variable, vanishing precisely when representatives of the fibres sum to
      zero, and FORALL arities m the resulting system costs r^{m-1} more than
      the relation-transport route.
      The dangerous weaker reading, NOT claimed: EXISTS a curve EXISTS a target
      for which the quotient route is cheaper - which could be arranged by
      instance selection and would be worthless. The audit obligation is that
      the cost comparison in Step 5 is run over the full declared instance grid
      and reported in full, with no instance dropped.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the tested toy instances and arities, the quotient-coordinate
        decomposition system costs r^{m-1} more in relation collection and r^2
        less in linear algebra than the x-coordinate system with relation
        transport." It can never certify anything about arities beyond those
        tested, about other quotients, or about the ECDLP. In particular even
        outcome O2 certifies at most a constant factor r^2 <= 9 on one stage of
        an algorithm that loses to rho.
      nearby_object_control: >-
        THE NEGATION QUOTIENT (r = 1), where the hoped-for degree increase does
        NOT occur because there is nothing to forget beyond the sign that the
        x-coordinate already forgets. The method must report degree 2 there and
        degree 2r on special j. A construction that reports a degree increase on
        the negation quotient is double-counting the sign and its numbers are
        void.
    proof_obligations:
      - claim: "Pi lies in F_p[x1^3, x2^3, x3^3] for a=0."
        responsibility: correctness
      - claim: "deg_{w_i} Pi = 2r exactly (6 for j=0, 4 for j=1728)."
        responsibility: correctness
      - claim: "The conjugate pieces Pi_d are not individually w-functions."
        responsibility: correctness
      - claim: "The construction reduces to S_3 at r = 1."
        responsibility: baseline
      - claim: "Every w-level solution lifts to a certified point decomposition."
        responsibility: soundness
      - claim: >-
          The cost comparison is stated against the relation-transport route,
          not against unstructured index calculus.
        responsibility: scope

  predictions:
    - metric: per-variable degree of the quotient-coordinate summation polynomial at m=2
      direction: higher
      minimum_effect: >-
        Exactly 6 for j=0 and exactly 4 for j=1728, against 2 in the
        x-coordinate. Any other value refutes the derivation in (B). This is the
        single number the proposal exists to produce.
    - metric: >-
        number of irreducible factors of Pi that are individually functions of
        the quotient coordinates
      direction: different
      minimum_effect: >-
        Predicted exactly 1 (Pi itself). A count of 2 or more with degree below
        2r is outcome O2 and halts the line for independent verification.
    - metric: >-
        measured relation-collection cost of the w-route divided by that of the
        relation-transport route, at matched coverage, m = 2
      direction: higher
      minimum_effect: >-
        Predicted 3.0 for j=0 (2.0 for j=1728) within a factor 2. A ratio below
        1 refutes the accounting in (C).
    - metric: >-
        measured linear-algebra cost of the w-route divided by the x-baseline
        (no transport)
      direction: lower
      minimum_effect: >-
        Predicted 1/9 for j=0 (1/4 for j=1728) within 30 percent. This must
        AGREE with the linear-algebra saving IDEA-20260807-f8a045 measures by the
        transport route; disagreement between the two proposals is an instrument
        failure in one of them and both must halt.
    - metric: collection penalty as a function of arity m
      direction: higher
      minimum_effect: >-
        Growing as r^{m-1}: a ratio of at least 2.5 between the m=3 and m=2
        penalties for j=0. Flat in m refutes the Bezout accounting.
    - metric: total fully charged cost of every arm divided by matched rho
      direction: higher
      minimum_effect: >-
        Predicted strictly greater than 1 for all three index-calculus arms at
        every tested size. This is the sanity frame and it must be reported with
        every other number.

  minimal_test:
    design: >-
      CHEAPEST VALID DISCRIMINATOR: STEPS 1 AND 2, WHICH ARE PURELY SYMBOLIC AND
      COST MINUTES. Form the nine-fold product for one j=0 curve over
      F_p[zeta]/(zeta^2+zeta+1), confirm it lies in F_p[x1^3,x2^3,x3^3], read off
      the degree in w, and factor it. Those two operations decide O1 versus O2
      completely, and they decide it before a single relation is collected, a
      single solver is invoked, or a single line of the w-indexed pipeline
      (Step 4, the expensive part) is written. If the degree is 6 and the factors
      are conjugate, the route is dominated by r^{m-1} and Steps 4-5 become
      OPTIONAL confirmation rather than necessary work.
    controls:
      - r = 1 generic curve, which must reproduce S_3 exactly (N1)
      - x-indexed base of size B/r, unmatched coverage (N2)
      - fake 2r-to-1 index map, which must fail (N3)
      - the relation-transport arm, which is the true competitor
      - matched rho and matched BSGS on every instance
      - certificate verification by lifting every w-solution back to points
    required_metrics:
      - per-variable degree of Pi in w, per family
      - full factorisation of Pi with per-factor invariance test
      - monomial count and Newton polytope of the w-system vs the x-system
      - attempts per relation, solver seconds per attempt, relations needed, LA
        cost - separately, for all three arms
      - certificate pass rate and lift-ambiguity resolution count
      - total F_p multiplications per arm, plus matched rho and BSGS
      - largest (p, m) reached per arm and the reason for the ceiling

  falsification_conditions:
    - >-
      Pi is not a polynomial in the x_i^3. The construction in (B) is wrong and
      the proposal ends at Step 1.
    - >-
      deg_w Pi is not 2r. The derived degree law is false; supersede this record
      before any cost claim is made.
    - >-
      An irreducible factor of Pi of degree below 2r is itself a w-function.
      Outcome O2: the route may win, IDEA-20260807-f00729's guidance item G2
      fires, and independent verification is mandatory before use.
    - >-
      The r=1 null produces degree above 2. The instrument double-counts the
      sign; every number void.
    - >-
      The fake-quotient control succeeds. The construction is not using the
      automorphism; the framing is wrong and the record is superseded.
    - >-
      A w-level "solution" fails to lift to a certified point decomposition at a
      rate above 1 percent. The lift ambiguity is not being resolved correctly
      and no relation count is trustworthy.
    - >-
      The degree-6 system exceeds the solver budget before any relation is
      collected. INFRASTRUCTURE outcome under AGENTS.md rule 5 - and note it is
      itself weak evidence FOR the predicted penalty, but it may not be reported
      as mathematical evidence.

  confounders:
    - >-
      COVERAGE MATCHING IS THE WHOLE COMPARISON. A w-base of size B compared
      against an x-base of size B is not a fair test - it has r times the
      coverage. Every comparison is at matched coverage (B_w = B/r) and the
      unmatched arm is run only as control N2.
    - >-
      BEZOUT IS A PROXY. Solver cost is not the Bezout number. Both are
      reported; if they disagree, the measured time governs.
    - >-
      LIFT AMBIGUITY IS A REAL COST. Every w-solution must be lifted to points to
      become a relation, and the lift is r-fold ambiguous. That cost is charged
      to the w-route and not silently absorbed.
    - >-
      SMALL-p DEGENERACY. At small p the fibres can collide (w - b a cube of a
      repeated root, or w = 0), collapsing orbits. Degenerate w values are
      enumerated and excluded.
    - >-
      COMPARING AGAINST THE WEAK COMPETITOR. Reporting the w-route's r^2 linear-
      algebra saving against unstructured index calculus, rather than against the
      transport route which already has it, would manufacture a speedup. Step 6
      exists to prevent this and it is a reporting obligation, not a suggestion.

  interpretation_limits:
    - >-
      A CONSTANT IS AT STAKE, bounded by r^2 <= 9, inside an algorithm that does
      not beat rho over prime fields. Nothing here touches an exponent.
    - >-
      Scoped to short Weierstrass form, j in {0, 1728}, arities m in {2,3}, toy
      primes, and the declared solver.
    - >-
      Outcome O1 closes the polynomial-level automorphism route WITH A NUMBER
      (r^{m-1}), which is stronger than closing it with an argument, but it
      closes only the constructions of this shape.
    - >-
      Outcome O2 would not be an attack. It would be a constant-factor
      improvement to a losing algorithm, and converting it into anything else is
      separate work with its own record.
    - >-
      The reachable (p, m) for the w-route will be smaller than for the x-route
      precisely because the degree is higher. That asymmetry must be reported;
      it is not a defect of the experiment, it is the finding in operational
      form.

  reachability_gate: >-
    NOT APPLICABLE AS A WALK - the curve is fixed and no isogeny is computed.
    T4 bounds the reach as usual: the quotient coordinate of this proposal exists
    only when Aut has order above 2, which requires D_0 = -3 or D_0 = -4, and by
    T4 no curve outside those classes can be walked to one. So even outcome O2
    would confer nothing on a generic curve at any price, and the mechanism is
    permanently confined to the family named in the scope statement of
    IDEA-20260807-51675e.

  target_complexity:
    time_exponent: >-
      UNCHANGED at every stage; only constants move, and the derived net is a
      LOSS of r^{m-1} on collection against a gain of r^2 on linear algebra
      relative to the transport route. In the program's prime-field
      index-calculus cost model, where the total is dominated by the |F|-size
      linear algebra, outcome O1 still leaves this route worse than transport
      once collection is charged at m >= 2.
    memory_exponent: >-
      The w-indexed matrix has B/r columns, so peak matrix memory falls by
      exactly r - the same constant the transport route already gets. Against
      rho's O(1) memory this is no improvement.
    best_known: >-
      Parallel rho with distinguished points at 0.886*sqrt(N), O(1) memory
      (KN-TECH-001, KN-TECH-006); automorphism-discounted rho at a factor at
      most sqrt(6) (KN-TECH-018); BSGS at sqrt(N) time and memory with full cost
      N^{2/3+o(1)} (KN-TECH-031). Within index calculus, the relevant incumbent
      is the x-coordinate system at per-variable degree 2^{n-2} (KN-TECH-002)
      with relation transport (IDEA-20260807-f8a045).
    hidden_overhead: >-
      Disclosed in full: the lift ambiguity (every w-solution costs up to r
      point-level checks to become a relation), the smaller reachable (p, m) at
      degree 2r, and the fact that the r^2 linear-algebra saving is NOT
      exclusive to this route and is available more cheaply elsewhere. That last
      item is the one a careless write-up would hide, and it is the reason the
      proposal's honest headline is a domination rather than a speedup.
    tradeoff_note: >-
      An explicit and quantified time-time tradeoff rather than time-memory:
      r^2 off the linear-algebra stage against r^{m-1} onto the collection
      stage, with the crossover at m = 3 for j=0. Parallelisation position:
      relation collection parallelises trivially and linear algebra does not, so
      moving cost FROM linear algebra TO collection is favourable in a parallel
      model - which is the one respect in which outcome O1 does not fully damn
      the route, and it is stated here rather than omitted.

  dominated_by: >-
    AS AN ATTACK: dominated on every axis, checked row by row. TIME - rho at
    0.886*sqrt(N) (KN-TECH-001, KN-TECH-006); every index-calculus arm here is
    predicted to lose at every tested size and the experiment reports the
    margin. MEMORY - rho at O(1) versus B/r stored columns; rho dominates.
    DATA/QUERIES - no advantage; both need only (E,P,Q). CM-SPECIFIC -
    automorphism-discounted rho (KN-TECH-018) dominates on exactly this family.
    MEMORY-RICH - BSGS (KN-TECH-031) dominates on time among memory-heavy
    methods. WITHIN THE LANE - dominated by IDEA-20260807-f8a045's relation-
    transport route by a predicted factor r^{m-1} in collection at equal linear-
    algebra cost, which is the specific and most informative domination and the
    one the write-up must lead with. NOT null.
  sota_delta: >-
    Zero against rho, and NEGATIVE against the better in-lane method: the
    predicted delta versus relation transport is a factor 3 worse at m = 2 and
    9 worse at m = 3 for j=0 (2 and 4 for j=1728), at equal linear-algebra cost.
    Versus unstructured index calculus the linear-algebra delta is a factor 9
    (j=0) or 4 (j=1728), i.e. 3.17 or 2.00 bits - but that comparison is
    forbidden as a headline by Step 6 because the transport route already
    supplies it for free. Under outcome O2 the delta would become a factor at
    most r^2 = 9 against the transport route, still a constant and still inside
    a losing algorithm.

