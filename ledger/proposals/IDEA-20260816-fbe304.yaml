idea:
  id: IDEA-20260816-fbe304
  question_id: RQ-PMA-001
  added: '2026-08-16'
  title: Census the complete image of the 3x3 principal-minor map over F_q for q in 3, 5, 7 by exhaustive
    enumeration of every matrix, and publish the realizable 7-tuple set as a finite measured object
    against which any PMA obstruction predicate can be scored with zero remaining ground-truth uncertainty
  class: measurement
  claim: '(A) For n = 3 and k = F_q with q in {3, 5, 7} the principal-minor assignment problem is
    not merely tractable but FINITE AND COMPLETELY DECIDABLE by direct enumeration: there are exactly
    q^9 matrices (19683, 1953125, 40353607) and exactly q^7 candidate prescribed tables (2187, 78125,
    823543) once p_empty is normalised to 1, so the realizable set R_3(q), defined as the image of
    the map A maps to (det A[S,S] for the seven nonempty S in {1,2,3}), can be computed in full and
    stored in full. (B) The deliverable is that set together with three derived numbers per field:
    its cardinality, its density |R_3(q)| / q^7, and the fiber-size distribution (how many matrices
    realize each realizable table). (C) With R_3(q) in hand, ANY candidate PMA3 obstruction predicate
    becomes scoreable without brute-force re-derivation per instance: soundness failures and completeness
    failures are read off by set membership rather than by argument, which is what makes this a reusable
    instrument rather than a one-off result. (D) What is NOT claimed: nothing here establishes anything
    about n = 4, about k(t), about infinite constant fields, or about the divisor-parity predicate
    of IDEA-20260726-012, which is a statement over a rational function field and is not tested by
    any finite-constant-field census. No general theorem about PMA at any size is claimed, and the
    census cannot become one; a finite census over three fields is a table of facts about three fields.
    No attack, speedup, or security consequence of any kind is claimed or implied. (E) Also not claimed:
    that density is the right summary statistic. It is reported because it is cheap and because a
    null needs it, not because the realizable set is expected to be describable by a density.'
  mechanism: 'Stage 1 enumerates all q^9 matrices over F_q in a vectorized integer representation,
    computes the seven principal minors of each by explicit cofactor formulas modulo q (no library
    determinant, no floating point), and accumulates a dictionary from the 7-tuple to a count. Stage
    2 inverts that dictionary into R_3(q) plus the fiber-size histogram. Stage 3 verifies the census
    two ways: the sum of all fiber sizes must equal q^9 exactly, and an independent randomly sampled
    set of 10^4 matrices per field must have every computed table found in R_3(q). Stage 4 computes
    the density and, as a null, the same three statistics for the image of the SAME enumeration applied
    to a shape-matched but structurally meaningless map (see null_object_control). Stage 5 checks
    the diagonal-conjugation invariance property directly: for a sample of matrices, A and D A D^{-1}
    and A-transpose must land on the identical tuple; a violation means the minor code is wrong, not
    that the mathematics is surprising. The claim is refuted, in the sense of the instrument being
    unusable, if Stage 3 accounting does not close exactly, if the invariance check fails, or if memory
    or time exceeds the declared budget at q = 7 and the run therefore reports a partial enumeration,
    which must be recorded as an exhaustion boundary and never as a census.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read ledger/questions/RQ-PMA-001.yaml in full, ledger/hypotheses/H-PMA-001.yaml in full,
      ledger/proposals/IDEA-20260726-012.yaml in full, experiments/EXP-PMA-001/specification.yaml,
      ledger/decisions/DEC-20260807-5adc24.yaml. Ran case-insensitive greps over ledger/proposals/
      and ledger/hypotheses/ for: principal.minor, principal minor, PMA4, PMA3, divisor.parity, square.class,
      Artin.Schreier, anchored triple, exhaust, hyperdeterminant, Holtz, gauge orbit, diagonal conjugation,
      vanishing ideal. Listed experiments/ for any PMA directory and grepped ledger/evidence/ for
      PMA.'
    results: 'Only three records in the whole ledger mention principal minors at all: IDEA-20260726-012
      (the single PMA proposal), H-PMA-001 (its hypothesis), and IDEA-20260805-6eac55, which mentions
      minors only incidentally in a HAWK lattice context and is unrelated. PMA3 returns ZERO hits
      anywhere. Exactly one experiment directory exists, experiments/EXP-PMA-001, and it contains
      an empty runs/ directory, so no PMA run record and no PMA evidence record exists; ledger/evidence/
      has zero PMA hits. DEC-20260807-5adc24 paused EXP-PMA-001 for a fabricated approval citation
      (TASK-20260727-011 cites DEC-20260727-002, which is about an unrelated goal). Gauge orbit hits
      (IDEA-20260807-c36472 and others) are ECDLP reachability records, not matrix-gauge records.'
    verdict: 'UNVERIFIED. No agent here can read external literature, so nothing is asserted about
      what exists outside this repository. Claimed new INSIDE this repository: the n = 3 exhaustive
      image census as a stored object, which no record contains. Assembled from known parts: the principal-minor
      map itself is defined in IDEA-20260726-012; brute-force existence deciding is already an intended
      module of EXP-PMA-001 (module B), but scoped there to per-instance decisions over k(t), never
      to a complete image census over a finite constant field. The move is from per-instance decision
      to total enumeration, which is a change in what is stored, not a new mathematical mechanism.'
  object_first_candidate:
    tracked_object: 'The FIBER of the principal-minor map at n = 3: for each realizable 7-tuple p,
      the set of matrices over F_q mapping to it, followed as a counted set rather than as a solution.
      What is carried through the computation is the pair (tuple, fiber size), and the census is the
      total accounting of those pairs.'
    lossiness: 'Genuinely lossy, and the loss is large and measurable. A matrix over F_q has 9 coordinates;
      the tracked tuple has 7. Even before counting, the diagonal-conjugation torus (order (q-1)^2)
      and transposition act trivially on the tuple, so fibers have size at least of that order wherever
      the action is free. The census MEASURES the loss instead of assuming it: the fiber-size histogram
      is exactly the amount of matrix information the projection discards, per table. The projection
      is compatible with the operations that matter here because principal minors are simultaneously
      invariant under diagonal conjugation and transpose, so the retained tuple propagates deterministically
      under both.'
    propagation: One step of the target operation is a single entry perturbation A to A + c E_ij.
      For i = j this shifts exactly the 4 minors of subsets containing i, additively by c times the
      complementary minor, which is a deterministic and computable action on the tracked tuple. For
      i not equal j the off-diagonal entry appears only in products a_ij a_ji, so the tuple sees a_ij
      only through those products, and the census records how many distinct matrices this collapses.
    survival_score: 'Total survival at n = 3 for q in {3, 5, 7}: the structure is not merely traced
      but exhausted, because q^9 is at most 4.04e7. It dissolves at n = 4 for q at least 5 (5^16 =
      1.526e11 matrices, outside any stated budget here), and at n = 5 for every q (3^25 = 8.47e11).
      The stated survival boundary is therefore: complete at (n=3, q<=7), open at (n=3, q>=11) where
      q^9 >= 2.36e9, and handed to entry 2 of this bucket at n = 4.'
  null_object_control: 'The identical enumeration and identical statistics are run against a shape-matched
    null: the map A maps to (f_S(A) for the seven nonempty S), where each f_S is a fixed uniformly
    random degree-|S| polynomial in the entries of A drawn once from a declared seed, matching the
    principal-minor map in output arity, in coordinate degrees, and in field. The null must show a
    substantially LARGER image density and a substantially FLATTER fiber-size histogram than the signal
    arm. If the null reproduces the signal arm''s density and histogram within the declared tolerance,
    then no property specific to principal minors has been measured and the census is recorded as
    a controlled null: informative about arity and degree only.'
  discriminated_from:
  - 'IDEA-20260726-012: that proposal is a one-directional obstruction certificate over k(t) with
    char k not 2, and never enumerates matrices or computes an image; this entry computes no discriminant,
    tests no square class, and works over finite constant fields where the k(t) valuation argument
    does not even apply.'
  - 'EXP-PMA-001 module B (independent constructive existence decider): decides ONE prescribed instance
    at a time by branching over orientation roots. This entry never branches and never solves; it
    enumerates the domain and reads the image off. The outputs are different types: a verdict versus
    a set.'
  - 'Generic brute-force search over matrices as a solving technique: nothing is being solved here.
    The deliverable is a stored image and a histogram, which is the opposite direction of a search.'
  - 'The ECDLP gauge-orbit records (IDEA-20260807-c36472 and siblings): those track reachability of
    curve classes under isogeny transport; the only shared word is gauge and the group, object, and
    question are unrelated.'
  assumptions:
  - Principal minors are computed by explicit exact cofactor expansion over F_q with no floating point
    and no library determinant, so no rounding or characteristic-dependent library behaviour enters.
  - q^9 enumeration at q = 7 (4.04e7 matrices, 7 minors each) fits the declared wall-clock and memory
    budget under vectorization; if it does not, the run reports an exhaustion boundary rather than
    a census.
  - The realizable set for a given q is representable in memory as at most q^7 bits (823543 bits at
    q = 7), which is trivially satisfiable.
  - No transfer whatsoever is assumed from finite constant fields to k(t); this entry deliberately
    does not touch RQ-PMA-001's function-field scope and says so.
  predictions:
  - metric: fiber_size_accounting_residual
    direction: lower
    minimum_effect: exactly 0 -- the sum of all fiber sizes must equal q^9 exactly for each q, with
      no tolerance
  - metric: image_density_signal_arm
    direction: lower
    minimum_effect: 'I refuse to pre-commit a numeric value. Reason: the density is the primary unknown
      this census exists to measure, and pre-committing a number I cannot derive would be a fabricated
      statistic under AGENTS.md rule 5. I pre-commit only the ORDERING in the next row.'
  - metric: density_gap_signal_minus_null
    direction: lower
    minimum_effect: signal density strictly less than null density, with a gap of at least a factor
      of 1.5 at q = 5 and q = 7; a gap below 1.5 is recorded as a controlled null
  - metric: diagonal_conjugation_invariance_violations
    direction: lower
    minimum_effect: exactly 0 across 10^4 sampled (A, D) pairs per field; any violation is an instrument
      bug, not a result
  minimal_test:
    design: 'Run only q = 3 first, at a cost of 19683 matrices, which executes in well under a second
      in pure Python. That single field already discriminates: it produces a complete R_3(3), a complete
      fiber histogram, an exact accounting residual, and the null-arm comparison. If the accounting
      residual is nonzero at q = 3 the instrument is broken and nothing larger should run. If the
      signal-versus-null density gap is absent at q = 3, the whole census framing is already in doubt
      and the q = 5 and q = 7 stages are not worth their compute. Only after q = 3 closes exactly
      do q = 5 (1.95e6 matrices) and q = 7 (4.04e7 matrices) run, in that order, each with the same
      three checks. The discriminating measurement is therefore the pair (accounting residual, density
      gap) at q = 3, which costs seconds and decides whether the remaining budget is spent at all.'
    controls:
    - 'Null-object arm: shape-matched random polynomial map of identical arity and coordinate degrees,
      run in the same invocation over the same enumeration, with the identical statistics computed
      by the identical code path.'
    - 'Accounting control: sum of fiber sizes equals q^9 exactly, checked per field before any statistic
      is reported.'
    - 'Invariance control: A, D A D^{-1}, and A-transpose must produce byte-identical tuples on 10^4
      sampled matrices per field.'
    - 'Positive control: 10^4 uniformly sampled matrices per field must each have their computed tuple
      present in the stored R_3(q); a miss is a census bug.'
    - 'Independent minor implementation: a second, slower, obviously-correct cofactor implementation
      recomputes the tuple for 10^3 sampled matrices per field and must agree exactly with the vectorized
      one.'
    required_metrics:
    - cardinality of R_3(q) per field
    - image density |R_3(q)| / q^7 per field
    - fiber-size histogram per field, with min, max, median and the count of fibers of each size
    - fiber_size_accounting_residual per field
    - null-arm cardinality, density, and fiber histogram per field
    - diagonal_conjugation_invariance_violations
    - per-field wall clock and peak memory
    - count of matrices whose tuple contains a zero minor, reported separately as a degeneracy class
  falsification_conditions:
  - 'The fiber-size accounting residual is nonzero for any field: the enumeration is incomplete or
    double counting, and no census may be reported.'
  - 'Any sampled matrix produces a tuple absent from the stored realizable set: the image store is
    wrong.'
  - 'Diagonal conjugation or transpose changes a computed tuple: the minor implementation is wrong
    and every downstream number is void.'
  - The two independent minor implementations disagree on any sampled matrix.
  - 'The signal and null arms produce densities within a factor of 1.5 and fiber histograms that are
    statistically indistinguishable: recorded as a controlled null, meaning arity and degree explain
    the observation and principal-minor structure does not.'
  - 'The q = 7 stage exceeds its declared budget: the run reports an exhaustion boundary at q = 7
    and the census stands only for q = 3 and q = 5. This is a scope statement, never negative mathematical
    evidence (AGENTS.md rule 3).'
  confounders:
  - 'Small-field artifacts: at q = 3 there are only two nonzero field elements, so density statistics
    are dominated by the smallness of the field rather than by PMA structure. Reporting q = 3 alone
    would be misleading and the three-field trend is the only readable signal.'
  - 'Zero minors: tables containing zeros sit on degenerate loci and may dominate the image count
    while carrying no information about the nondegenerate question RQ-PMA-001 actually asks; they
    must be counted separately.'
  - The null map's random polynomials could accidentally be degenerate (identically zero on a subspace),
    inflating its density; the null must be redrawn under a declared rule if any f_S is identically
    zero and the redraw must be recorded.
  - Vectorized modular arithmetic can silently overflow in fixed-width integer types before reduction;
    the implementation must reduce at every multiply or use an exact type.
  - The fiber-size histogram conflates the gauge group action with genuine extra multiplicity; the
    gauge orbit size must be divided out explicitly before the histogram is interpreted as multiplicity.
  interpretation_limits:
  - This is a census over three finite fields at one size. It is a table of facts about (n=3, q in
    {3,5,7}) and nothing more; extrapolation to larger q, larger n, or to k(t) is not supported and
    is not attempted.
  - The census says nothing about the divisor-parity predicate of IDEA-20260726-012, which lives over
    a rational function field where the valuation argument is the whole content.
  - No attack, speedup, cryptographic consequence, or ECDLP relevance is claimed. The candidate count
    of this work in the source-to-scalar sense is zero.
  - A density is a summary and can hide the structure that matters; the stored set, not the density,
    is the deliverable.
  target_complexity:
    time_exponent: No attack exponent is claimed. The census cost is exactly q^9 exact minor evaluations,
      which is a stated enumeration cost, not a cryptanalytic complexity.
    memory_exponent: No attack exponent is claimed. Storage is q^7 bits for the image indicator plus
      a fiber histogram bounded by |R_3(q)| counters, i.e. at most 823543 bits at q = 7.
    best_known: The incumbent for deciding a single PMA3 instance is the constructive branch-and-check
      decider already specified as module B of experiments/EXP-PMA-001/specification.yaml. This entry
      does not beat it per instance and does not try to; it amortizes across all instances of a field
      at once.
    hidden_overhead: 'The human cost is in the accounting discipline, not the compute: getting the
      fiber sum to close exactly, keeping the gauge orbit separated from genuine multiplicity, and
      resisting the temptation to report a density as if it were a theorem. Also hidden: the stored
      image for a hypothetical q = 11 would be 2.36e9 matrices to enumerate, so the instrument does
      not extend by simply asking for more budget.'
  dominated_by: 'n/a (no result claimed). Checked explicitly: this proposal claims no time, memory,
    or data/query point on any cryptanalytic frontier, so there is no frontier row to compare against.
    It is a measurement instrument for a toy algebraic question with no source-to-scalar output.'
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitatively, the only comparison
    available is against per-instance deciding: one census at q = 5 costs 1.95e6 minor-tuple evaluations
    and answers all 78125 possible prescribed tables at once, versus 78125 separate decider invocations;
    that ratio is an amortization fact about this instrument, not a speedup against any published
    method.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part A (the enumeration closes exactly at q = 3 and q = 5): 0.95, because
    it is a finite loop with an exact accounting check and the only failure mode is an implementation
    bug the accounting check catches. Part A at q = 7: 0.8, because 4.04e7 matrices times 7 minors
    in Python needs real vectorization and could exceed budget; that outcome is a reported boundary,
    not a failure. Part B (the density and histogram are computed and stored): 0.95, conditional on
    A. Part C (the signal-versus-null density gap exceeds 1.5): 0.55, genuinely uncertain, because
    a random degree-matched map over a tiny field may well have image density comparable to the principal-minor
    map; this is exactly why the null runs. Part D (the census turns out to be USEFUL to a later predicate
    score): 0.4, because usefulness depends on someone bringing a finite-field predicate, and IDEA-20260726-012''s
    predicate is function-field only.'
