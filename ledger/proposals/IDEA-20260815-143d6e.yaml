idea:
  id: IDEA-20260815-143d6e
  question_id: RQ-ECDLP-002
  added: '2026-08-15'
  title: >-
    THE TIER LADDER HAS ACCUMULATED DEFERRALS AND NOBODY HAS COSTED WHAT
    UNBLOCKING IT WOULD TAKE: price each deferred lane's minimum viable
    batch and rank by cost per unblocked conclusion
  class: audit

  claim: >-
    PATH coordinates a series in which SDEG, RELN, SIG and MONO are deferred
    and ICEX cannot execute. Prioritisation decisions choose directions;
    none of them prices the alternatives. Costing each deferred lane's
    minimum viable batch and dividing by the conclusions it unblocks gives
    the campaign a ranking it currently makes by judgement alone.

  mechanism: >-
    For each deferred lane, specify the smallest batch that would discharge
    its blocking obligation, estimate its compute and implementation cost
    from comparable completed batches, and count the downstream conclusions
    it unblocks from the dependency graph.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-PATH-001 next_action and the deferred lanes' next
      actions; grep 'cost per conclusion', 'minimum viable batch',
      'unblock'.
    results: >-
      Prioritisation decisions select directions without pricing them; no
      record costs the deferred lanes or ranks them by unblocking value.
    verdict: >-
      ADAPTATION. Cost-benefit ranking is elementary; applying it to a
      campaign with four deferred lanes and a blocked consumer is what is
      missing.

  object_first_candidate:
    tracked_object: >-
      THE COST PER UNBLOCKED CONCLUSION for each deferred lane.
    lossiness: >-
      Reducing a lane to one ratio discards its scientific interest, which
      is deliberate: the ranking is an input to prioritisation, not a
      replacement for it.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while comparable completed batches exist to estimate from;
      lanes with no comparable precedent are reported as unestimable
      rather than guessed.

  null_object_control: >-
    NULL 1 -- a completed lane whose actual cost is known, re-estimated by
    the same method; the estimate must land near the actual or the method is
    not calibrated. NULL 2 -- a lane with no downstream consumers, whose
    ratio must be undefined rather than infinite, forcing the count to be
    handled explicitly.

  discriminated_from:
    - >-
        The reachability audit in this series, which determines which
        conclusions are reachable; this prices reaching them and should
        consume its output rather than duplicate it.
    - >-
        Coordinator prioritisation decisions, which this informs rather
        than replaces; the ranking is an input and the decision remains
        the Coordinator's.

  assumptions:
    - >-
        Comparable completed batches exist for cost estimation; lanes
        without precedent are reported unestimable.
    - >-
        Downstream conclusion counts come from the reachability audit
        rather than being recounted here, so the two records must agree by
        construction.

  predictions:
    - metric: >-
        completed-lane calibration
      direction: different
      minimum_effect: >-
        FORCED: re-estimate lands near the known actual cost, else the
        estimation method is uncalibrated and the ranking is noise.
    - metric: >-
        no-consumer lane null
      direction: different
      minimum_effect: >-
        FORCED undefined ratio, handled explicitly rather than as
        infinity.
    - metric: >-
        cost per unblocked conclusion, ranked
      direction: different
      minimum_effect: >-
        The deliverable; the ranking is an input to prioritisation and
        explicitly not a decision.

  minimal_test:
    design: >-
      Symbolic. Estimate all four deferred lanes, calibrate against one
      completed lane, consume the reachability audit's conclusion counts.
    controls:
      - >-
          Completed-lane cost calibration.
      - >-
          No-consumer lane null.
      - >-
          Conclusion counts taken from the reachability audit, not
          recounted.
      - >-
          Unestimable lanes reported rather than assigned a guess.
    required_metrics:
      - >-
          Estimated minimum viable batch cost per lane.
      - >-
          Unblocked conclusion count per lane.
      - >-
          Ranked cost per conclusion.
      - >-
          Calibration error against the completed lane.

  falsification_conditions:
    - >-
        Calibration is far off. The estimation method is not usable and
        the ranking must not be produced.
    - >-
        Most lanes are unestimable. The audit cannot rank and reports that
        instead.
    - >-
        One lane dominates the ranking. The campaign has a clear cheapest
        unblock, which is directly actionable.
    - >-
        The ranking is flat. Cost gives no guidance and the choice remains
        a scientific judgement, which is a legitimate outcome to record.

  confounders:
    - >-
        ESTIMATION OPTIMISM: minimum viable batches are systematically
        under-costed because the hard parts surface during execution, and
        the calibration against a completed lane is the only check.
    - >-
        CONCLUSION COUNTING: conclusions differ enormously in value, so a
        raw count treats a decisive result and a minor control as equal,
        which the ranking must state prominently.

  interpretation_limits:
    - >-
        A prioritisation input; makes no scientific claim and does not
        decide anything.
    - >-
        Conclusion counts inherit the reachability audit's assumptions.
    - >-
        Cost per conclusion ignores scientific value, which is exactly
        what the Coordinator's judgement supplies.

  heuristic_assumptions:
    - id: HEUR-PATH-COST-1
      statement: >-
        A deferred lane's minimum viable batch cost is estimable from
        comparable completed batches to within a factor that does not
        reorder the ranking.
      rigorous_support: >-
        Rigorous ingredient: completed batches in this campaign have
        recorded costs, giving a base rate. THE GAP: the deferred lanes
        were deferred precisely because something about them was hard,
        so they are systematically unlike the batches that completed --
        which biases the estimate low for exactly the lanes being
        priced.
      falsification_condition: >-
        The calibration lane's re-estimate differing from its actual
        cost by enough to reorder the ranking.
      validation_plan: >-
        SAMPLE: all four deferred lanes plus >= 2 completed lanes for
        calibration. COMPARISON: re-estimate against actual for the
        completed lanes. TAIL CHECK: the lane whose estimate is least
        supported by precedent, reported explicitly. TRANSFER: stated
        and unjustified, given the selection effect on what got
        deferred.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic; no compute.
    memory_exponent: >-
      Negligible.
    best_known: >-
      No incumbent costing exists; prioritisation decisions in this
      campaign select directions without pricing them.
    hidden_overhead: >-
      The selection effect on deferrals biases every estimate low, which
      is named rather than corrected since no correction is defensible.
    tradeoff_note: >-
      A cost ranking is cheap and ignores scientific value; it informs
      prioritisation without substituting for it.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As science: nothing is claimed. As a
    campaign costing: none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: an estimated minimum viable
    batch cost per deferred lane, a cost-per-unblocked-conclusion ranking
    calibrated against completed lanes, and an explicit statement that the
    ranking ignores scientific value.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.7 that comparable completed batches support estimation. 0.5 that
    calibration lands close enough for the ranking to be meaningful, given
    the selection effect on deferrals. 0.5 that one lane clearly dominates,
    which would be directly actionable for a campaign currently blocked on
    four.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
