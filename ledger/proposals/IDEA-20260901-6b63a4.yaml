  proof_search_map:
    bottleneck: >-
      The per-step canonicalisation cost of a rho walk on <lambda>-orbits. It is the only
      cost that binds in IDEA-20260807-18d2f7's analysis, and it is the product of two
      factors the program has always priced separately - the orbit size h and the cost of
      applying the map. T1 removes the assumption that those two factors are independent.
    baseline_embedding:
      parameter_slice: >-
        n = 1, i.e. alpha a unit. There alpha^h = [1] identically in O, T1's hypothesis
        fails, and the known state of affairs is recovered exactly - h in {2, 4, 6} with
        a free map, giving the KN-TECH-018 discount sqrt(|Aut|). The theorem must NOT
        exclude this slice, and reproducing it is the check that the argument has not
        proved too much.
      reproduction_check: >-
        FROZEN SYMBOLIC FIXTURE, BLOCKING, computed before any curve is drawn. On a toy
        j = 0 curve with p = 1 mod 3, alpha = zeta_3 must give N(alpha) = 1, h = 3, and
        the T1 right-hand side (n^{h/2} + 1)^2 = 4 < N - i.e. the inequality is VIOLATED,
        which is correct and required, because the hypothesis n >= 2 does not hold. A run
        in which T1's inequality holds at n = 1 is measuring something other than what it
        claims. On the same curve alpha = [2] must give n = 4, and the measured
        h = ord_N(2) must satisfy 4^h >= (sqrt(N)-1)^2. Both cells are pre-registered.
    observation_collision:
      observable: >-
        The pair (N(alpha), ord_N(lambda_alpha)).
      distinct_preimage_search: >-
        REQUIRED, AND TWO COLLISIONS ARE IDENTIFIED IN ADVANCE RATHER THAN DISCOVERED
        LATER. (i) alpha and its conjugate bar(alpha) have the same norm and, since
        lambda_{bar alpha} = Tr(alpha) - lambda_alpha mod N, generally a DIFFERENT order -
        so the observable separates them, which is a check that it is not merely reading
        the norm. (ii) The dangerous collision: a UNIT alpha at j = 0 with (1, 3) and a
        hypothetical non-unit alpha with (n, 3) for some n. T1 says the second requires
        n >= N^{1/3}; the two would be indistinguishable on the ORDER coordinate alone,
        which is precisely why the object is the PAIR and why a design reporting only
        orbit sizes would prove nothing. This audit fixes the required metrics.
        (iii) Sought empirically: two curves with different D_0 whose spectra Sigma_B
        agree as multisets. If found at a rate above the matched-random null, the
        observable is measuring the ambient (Z/N)^* rather than the endomorphism ring and
        the arm must be redesigned.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace "the orbit of P under <lambda>" - which carries only its size - by the
          pair (norm of the generating endomorphism, order of its scalar). The extra
          state preserved is the norm, and the norm is what survives the recursion
          alpha -> alpha^h because norms are multiplicative while orbit sizes are not.
        predicted_gain: >-
          Converts a cost heuristic into an inequality. Concretely, it excludes every
          (n, h) cell with n^h < (sqrt(N)-1)^2, which for a 256-bit N and h <= 6 excludes
          every endomorphism of norm below about 2^42 - a region that includes the entire
          small-|D_0| supply the lane has been hoping is exploitable.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable "there is a free map with a short orbit" fixed and vary the
          forgotten structure, namely whether alpha is a unit. The intrinsic invariant
          distinguishing the two is whether alpha^h - [1] is zero IN O or merely zero
          ON G - a distinction invisible to any cost measurement, since both maps cost
          O(1) to apply at n = 1 and small |D_0|.
        predicted_gain: >-
          Identifies the load-bearing structure as the vanishing of alpha^h - 1 in the
          ring, not as cheapness. This is the record's answer to RQ-JINV-8fc13a's actual
          question and the reason small |D_0| is not a weaker j = 0.
    quantifier_order: >-
      CLAIMED IN THIS ORDER. FOR ALL primes p > 3, FOR ALL ordinary E/F_p, FOR ALL primes
      N > 6 with a subgroup G <= E(F_p) of order N, FOR ALL alpha in End_{F_p}(E) with
      N(alpha) >= 2: setting h = ord_N(lambda_alpha), the inequality
      N(alpha)^h >= (sqrt(N) - 1)^2 HOLDS. The witness h is allowed to depend on
      (E, N, alpha) - it is defined by them - and no uniformity in h is claimed or needed.
      THE WEAKER READING EXPLICITLY NOT CLAIMED - "for every curve there EXISTS an alpha
      whose orbit is long", which is trivial. THE STRONGER READING EXPLICITLY NOT CLAIMED
      - any statement about maps on G that are not induced by endomorphisms, or about
      supersingular or extension-field curves, where End is non-commutative or Frobenius
      supplies extra degree-1-like maps and the whole argument must be re-run.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For every ordinary prime-field curve and every endomorphism of norm n >= 2, the
        multiplicative order of the induced scalar on a prime-order subgroup of order N
        is at least log N / log n - o(1); hence any subgroup of (Z/N)^* of order at most
        h that is generated by images of endomorphisms is generated by units or by
        endomorphisms of norm at least N^{1/h}; hence, under the declared cost model, no
        orbit-collapse rho discount beyond sqrt(|Aut|) is available from End(E)." IT CAN
        NEVER CERTIFY - anything about maps on G not induced by endomorphisms, anything
        about labels or selectors (332ce9's S1-S3), anything about relation collection,
        incidence, walk mixing or meet-in-the-middle over an isogeny class, anything
        about supersingular or extension-field curves, and nothing whatever about the
        hardness of the ECDLP.
      nearby_object_control: >-
        THE OBJECT ON WHICH THE HOPED-FOR CONCLUSION FAILS, and it must be run: the
        j = 0 curve with alpha = zeta_3, where a free map with a short orbit DOES exist.
        The method must distinguish it from a D_0 = -7 curve carrying a norm-2
        endomorphism - both have CM, both have an explicitly computable endomorphism
        costing O(1) field operations, both induce a scalar on G - and it must
        distinguish them by the one quantity the claim says is load-bearing, namely
        N(alpha). A method that reports a short orbit on the D_0 = -7 arm, or a long
        orbit on the j = 0 control, has not identified the load-bearing structure and
        every number it produced is void. SECOND NEARBY OBJECT: alpha = [2] on any curve,
        which is CHEAPER to apply than any CM endomorphism (one group doubling) and whose
        orbit is <2> <= (Z/N)^*. If cheapness alone were the resource this control would
        show a short orbit; T1 says its order is at least log_4 N, and the measurement
        must confirm that.
    proof_obligations:
      - claim: '#ker(psi) <= deg(psi) for a nonzero isogeny psi.'
        responsibility: correctness
      - claim: 'deg(alpha) = N(alpha) = |alpha|^2 on End of an ordinary curve.'
        responsibility: correctness
      - claim: 'n >= 2 implies alpha^h != [1] in O, so alpha^h - [1] is nonzero.'
        responsibility: strictness
      - claim: 'G <= ker(alpha^h - [1]), hence N <= (n^{h/2} + 1)^2.'
        responsibility: size
      - claim: >-
          Every generator of a subgroup of order h has scalar order dividing h, so T1
          applies generator-wise to a multiply generated H.
        responsibility: correctness
      - claim: >-
          Evaluating a degree-n endomorphism costs Omega(n) field operations under the
          declared presentation.
        responsibility: runtime
      - claim: >-
          The j = 0 unit slice is reproduced and is NOT excluded by T1.
        responsibility: baseline
      - claim: >-
          The record closes only the orbit-collapse route and names the label, selector,
          relation-collection and meet-in-the-middle routes as open.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        indicator that n^h >= (sqrt(N) - 1)^2, evaluated for every enumerated alpha with
        N(alpha) in [2, B], over every curve in the toy family
      direction: different
      minimum_effect: >-
        TRUE on 100 percent of (curve, alpha) pairs, with ZERO exceptions. A single
        violation falsifies T1, contradicts an elementary degree bound, and therefore
        first indicts the implementation; it requires independent review before any
        description.
    - metric: >-
        OBST-EIG(E, B) = min over non-unit alpha of norm <= B of ord_N(lambda_alpha),
        divided by the T1 floor log N / log B, per curve
      direction: higher
      minimum_effect: >-
        Strictly greater than 1 on every curve, and under H1 much greater - the
        pre-registered expectation is a median ratio above 0.1 * (N-1) / (log N / log B),
        i.e. that the floor is nowhere near tight. A measured ratio close to 1 on a
        family of curves would mean the floor IS tight and would be a genuinely new and
        interesting structural finding about CM eigenvalues, reported as such.
    - metric: >-
        ord_N(lambda_alpha) at n = 1 on the j = 0 and j = 1728 positive controls
      direction: lower
      minimum_effect: >-
        Exactly 3 at j = 0 with alpha = zeta_3 and exactly 2 at j = 1728 with alpha = i,
        on every control curve. These are BLOCKING. If the instrument cannot see a short
        orbit where one provably exists, its long orbits elsewhere carry no information.
    - metric: >-
        count of (curve, alpha) pairs with N(alpha) <= B and ord_N(lambda_alpha) <= 6,
        over the whole toy family
      direction: lower
      minimum_effect: >-
        Exactly the number of UNIT alpha, i.e. exactly the curves with j = 0 or j = 1728
        contributing their |Aut| units and nothing else. A single NON-UNIT pair in this
        cell is a direct falsifier of C1 as a practical statement and, at toy N where
        N^{1/6} is small, is not impossible - which is what makes this a real test rather
        than a tautology. Any such pair triggers GOAL-ENDO-001 pause condition P3 before
        it is described.
    - metric: >-
        empirical CDF of log(ord_N(lambda_alpha)) / log(N-1) over enumerated non-unit
        alpha, against the same statistic for uniformly drawn elements of (Z/N)^*
      direction: different
      minimum_effect: >-
        Agreement within 3 binomial standard errors in every decile, on every curve.
        Systematic deviation is the H1 finding and is reported whether or not any short
        orbit appears.
    - metric: >-
        the same CDF split by |D_0|, at MATCHED N across the toy family
      direction: different
      minimum_effect: >-
        NO |D_0| trend. The pre-registered null is that the eigenvalue order distribution
        is |D_0|-independent once N is fixed, i.e. that small |D_0| buys a cheaper alpha
        and not a shorter orbit. A monotone downward trend in order with decreasing
        |D_0| would be an advantage beyond sqrt(|Aut|) and is the record's one positive
        outcome.

  minimal_test:
    design: >-
      THE CHEAPEST VALID DISCRIMINATOR COSTS ZERO COMPUTE AND IS T1 ITSELF - four lines
      of degree bookkeeping, checkable by hand, which convert "the sqrt(|Aut|) ceiling is
      an observed constant" into "the ceiling is a norm-order inequality" for the whole
      orbit-collapse class. The empirical arm exists to test the instrument and to
      measure OBST-EIG, not to establish T1.
      STAGE 0 (zero compute, BLOCKING as a review item): write out T1, C1 and the
      several-generator extension; evaluate the exclusion region n^h < (sqrt(N)-1)^2 at
      the program's standard parameter sizes and tabulate the minimum norm forced at
      h = 2, 3, 4, 6 for N of 14, 24, 160 and 256 bits.
      STAGE 1 (minutes, positive controls, BLOCKING): toy j = 0 curve over F_p with
      p = 1 mod 3 and prime-order G; construct alpha = zeta_3 as (x, y) -> (zeta_3 x, y);
      compute lambda_alpha by evaluating alpha on a generator and solving one small DLP
      by enumeration at toy N; report ord_N(lambda_alpha), required to be 3. Repeat at
      j = 1728 with alpha = i, required 2.
      STAGE 2 (the arm): for each curve in a matched-N family spanning |D_0| from small
      to generic, enumerate every alpha in O with 2 <= N(alpha) <= B by solving
      4 N(alpha) = u^2 + |D| v^2 over the integers; construct each alpha explicitly as a
      Velu isogeny composed back to E and VERIFY it is an endomorphism by checking
      alpha^2 - Tr(alpha) alpha + N(alpha) = 0 on sampled points; compute lambda_alpha
      and ord_N(lambda_alpha) exactly; report the T1 indicator, OBST-EIG, and the order
      CDF.
      STAGE 3 (nulls, mandatory): repeat Stage 2's order statistics with lambda drawn
      uniformly from (Z/N)^*, and with alpha = [m] for m = 2, 3, 5 on every curve.
    controls:
      - >-
        POSITIVE CONTROL, BLOCKING - j = 0 with alpha = zeta_3 must return
        ord_N(lambda) = 3, and j = 1728 with alpha = i must return 2. Without a
        demonstrated short orbit somewhere, "orbits are long" is an unfalsifiable
        constant and the record has measured nothing.
      - >-
        NULL OBJECT OF THE SAME SHAPE - lambda drawn uniformly at random from (Z/N)^* on
        the SAME N, with the identical order computation. If the endomorphism-derived
        order distribution matches this null, the record's finding is a controlled null
        and is recorded as such rather than as a property of End(E).
      - >-
        SQRT(|Aut|) BASELINE AS THE NULL HYPOTHESIS, per RQ-JINV-8fc13a's decision_target
        - any measured orbit-collapse advantage is expressed against the
        automorphism-discounted rho baseline (KN-TECH-018), and a factor at or below
        sqrt(6) is baseline calibration and is recorded as such, never as an attack.
      - >-
        CHEAPNESS-HELD-FIXED CONTROL - alpha = [2], the cheapest map available on any
        curve. If cheapness rather than degree-1-ness were the operative resource this
        control would show a short orbit. It must not.
      - >-
        DECAY PARAMETER - N(alpha) swept over 1, 2, 3, 4, 5, 7 where the order permits.
        The pre-registered shape is a STEP at n = 1, not a decay. A quantity that decays
        smoothly with n is measuring evaluation cost or map complexity, not degree, and
        the interpretation must change accordingly. Stating the predicted shape in
        advance is what makes this control informative.
      - >-
        ENDOMORPHISM CERTIFICATE CONTROL - every constructed alpha re-verified as an
        endomorphism by code sharing no state with the producer, via
        alpha^2 - Tr alpha + N(alpha) = 0 on independently sampled points. Verification
        fraction must be 1.0. Without it the arm may be measuring an isogeny to a twist.
    required_metrics:
      - per curve - p, a, b, j, t, N, cofactor, D, D_0, f, |Aut|
      - per (curve, alpha) - N(alpha), Tr(alpha), lambda_alpha, ord_N(lambda_alpha)
      - the T1 indicator n^h >= (sqrt(N)-1)^2 per pair, and the count of violations
      - OBST-EIG(E, B) per curve and its ratio to the floor log N / log B
      - the order CDF per curve, and the same for the uniform-lambda null
      - endomorphism certificate verification fraction, required 1.0
      - the Stage 0 exclusion table at 14, 24, 160 and 256 bits

  falsification_conditions:
    - >-
      F1 (ZERO COMPUTE, PRIMARY). A counterexample to T1 - a non-unit alpha with
      n^h < (sqrt(N)-1)^2. Since the proof is a degree bound, this would mean
      #ker <= deg or the norm identity is being misapplied; the record is withdrawn by a
      superseding proposal and the implementation is indicted first.
    - >-
      F2 (THE INTERESTING FALSIFIER, AND IT IS THE ONLY POSITIVE OUTCOME AVAILABLE HERE).
      A curve carrying a non-unit alpha of norm at most B with ord_N(lambda_alpha) small
      enough that h * c(alpha) is below the cost of a group addition. That is an
      orbit-collapse discount beyond sqrt(|Aut|), i.e. exactly what RQ-JINV-8fc13a asks
      about. GOAL-ENDO-001 pause condition P3 fires - work STOPS for an independent
      review-adversarial session before any record states it, and for review-breakthrough
      at max effort before any record calls it a break.
    - >-
      F3. The j = 0 or j = 1728 positive control fails to return order 3 or 2. Instrument
      failure; every number in the run is void and it returns to the executor as a defect,
      never as support for the null.
    - >-
      F4. The uniform-lambda null reproduces the endomorphism arm's order distribution
      exactly AND the arm shows no |D_0| structure. Then the finding is a CONTROLLED NULL
      - End(E) contributes nothing the ambient group (Z/N)^* does not - which is the
      pre-registered expected deliverable, and it must be recorded with its successor
      named or it has not finished (docs/inventor-protocol.md section 4).
    - >-
      F5. The cost model in the assumptions is refuted - a presentation of a degree-n
      endomorphism admitting n^{o(1)} evaluation. Then C1's cost corollary is void, T1
      stands unchanged, and the record must be re-read as an arithmetic statement only.
    - >-
      NOT A FALSIFICATION - the Velu construction of a norm-n endomorphism exceeding the
      time or memory budget. That is an infrastructure outcome under AGENTS.md rule 5 and
      is never evidence about orbits.

  confounders:
    - >-
      CONSTRUCTING alpha EXPLICITLY IS THE DOMINANT IMPLEMENTATION RISK. A norm-n CM
      endomorphism is an n-isogeny composed with an isomorphism back to E, and a wrong
      post-composition yields an isogeny to a TWIST rather than an endomorphism, which
      would produce a lambda that is not a scalar at all. The certificate control targets
      exactly this and is blocking.
    - >-
      lambda_alpha CAN BE OBTAINED WITHOUT EVALUATING alpha, as a root of
      X^2 - Tr(alpha) X + N(alpha) mod N. Computing it that way and then reporting it as
      a measurement of the endomorphism would make the arm circular. The design requires
      lambda to be obtained by EVALUATION on a point and then cross-checked against the
      root, with disagreements reported.
    - >-
      AT TOY N THE EXCLUSION REGION IS WEAK. n^h >= (sqrt(N)-1)^2 with N about 2^14 and
      h = 3 needs only n >= 25, which is inside the reachable norm range - so short orbits
      for non-units are genuinely POSSIBLE at toy scale and their appearance is NOT a
      contradiction of T1. This is a feature: it means the toy arm can exhibit the
      boundary rather than only confirm a vacuous inequality. Every observed short orbit
      must be checked against T1 numerically before it is called a violation.
    - >-
      N - 1's DIVISOR STRUCTURE IS A CONFOUND FOR THE ORDER DISTRIBUTION. A curve whose
      N - 1 is smooth admits many small orders and one whose N - 1 is 2q admits almost
      none, independently of the endomorphism ring. The factorisation of N - 1 is a
      reported covariate and the order CDF is reported both raw and conditioned on it.
    - >-
      MATCHED N IS REQUIRED FOR THE |D_0| ARM. Comparing orders across different N
      compares different groups (Z/N)^*. The matched-order construction
      D = (t-2)^2 - 4N of H-JINV-5a0b9e is the available device and this record reuses
      it for the family, without reusing its statistics or its conclusions.

  interpretation_limits:
    - >-
      claim_tier toy for every measured quantity, per RQ-JINV-8fc13a's ceiling. T1 is a
      DERIVATION under docs/claims-and-verification.md; the enumeration verifies the
      implementation over a finite range, not the theorem.
    - >-
      NO EXPONENT IS MOVED AND NO ATTACK IS PROPOSED. The honest ceiling of this record's
      subject matter is a CONSTANT - the RQ is explicitly about a constant-factor null -
      and it is worth a test anyway for two reasons stated plainly: the constant is the
      null hypothesis every other proposal in this lane must be scored against, and the
      derivation prices one branch of an EXPONENT rung another record left open, at zero
      compute.
    - >-
      THE RUNG IS PRICED, NOT CLOSED. IDEA-20260807-18d2f7's N^{1/3} rung survives this
      record entirely on its label and selector side, and its arbitrary-lambda branch,
      costing about log2(N) group operations to apply, is untouched. Any statement that
      this record closes that rung is FALSE and is forbidden.
    - >-
      SCOPED TO ORDINARY CURVES OVER PRIME FIELDS WITH p > 3 AND A PRIME-ORDER SUBGROUP.
      Supersingular curves have non-commutative End and are excluded by RQ-JINV-8fc13a's
      scope; extension and subfield curves give Frobenius as an extra degree-1-like map
      and the whole argument must be re-run there.
    - >-
      H-ENDO-001 is the admissibility filter and is not retested; KN-FIND-b7e091's
      generic-group closure is treated as binding. Nothing here bears on H-STR-002, so
      GOAL-ENDO-001 pause condition P2 is not engaged - no factor base is constructed and
      no phi-stable structure is tested.
    - >-
      A NEGATIVE HERE DOES NOT SAY SPECIAL j IS WORTHLESS. It says the ORBIT-COLLAPSE
      route is capped at n = 1. The relation-collection, incidence, walk-mixing and
      meet-in-the-middle routes are other records' subjects and are untouched.
    - >-
      Timeouts, crashes and infrastructure failures are never negative mathematical
      evidence (AGENTS.md rule 5).

  heuristic_assumptions:
    - id: H1
      statement: >-
        EIGENVALUE ORDER EQUIDISTRIBUTION. Fix a norm bound B. As (E, alpha) ranges over
        ordinary curves with prime subgroup order N and alpha in End(E) with
        2 <= N(alpha) <= B, the induced scalar lambda_alpha behaves, with respect to
        multiplicative order, like a uniformly random element of (Z/N)^*. Formally, for
        every divisor d of N - 1,
        Pr[ ord_N(lambda_alpha) divides d ] = d / (N - 1) + o(1),
        so in particular Pr[ ord_N(lambda_alpha) <= N^{1/3} ] = O(N^{-2/3}), which is the
        density figure claim (C2) rests on.
      rigorous_support: >-
        RIGOROUS PART. lambda_alpha is a root of X^2 - Tr(alpha) X + N(alpha) modulo N,
        so it is an algebraic quantity determined by two integers of size O(sqrt(B) +
        sqrt(N)); for each fixed d | N - 1 the condition ord | d is the condition that
        lambda lies in the unique subgroup of order d, and the number of (Tr, Norm) pairs
        whose root lies in that subgroup is d times the number of preimages, giving the
        stated density if the roots equidistribute. T1 itself is rigorous and INDEPENDENT
        of H1 - only claim (C2)'s density figure uses H1.
        DISTRIBUTION IMITATED. The classical statement being imitated is the
        equidistribution of Frobenius eigenvalues in residue classes, in the same way
        Dickman-de Bruijn is imitated for smoothness of algebraically produced integers.
        WHY IT COULD FAIL, STATED HONESTLY. lambda_alpha is not a random element: for
        alpha a unit it is an exact root of unity of order 2, 4 or 6, which is a total
        failure of H1 and is precisely the positive-control cell. Small |D_0| pins Tr and
        Norm to a short list, so the sample of available lambda per curve is small and
        arithmetically constrained.
      validation_plan: >-
        WHAT TO SAMPLE - every alpha in O with 2 <= N(alpha) <= B, on every curve of a
        matched-N toy family at N between 2^14 and 2^24, exhaustively rather than by
        sampling, so the reported order is exact per pair. WHICH SHORTCUT MAKES IT
        FEASIBLE - the norm equation 4 N(alpha) = u^2 + |D| v^2 enumerates O directly, and
        lambda_alpha is cross-checked against the root of X^2 - Tr X + N mod N, so no
        isogeny evaluation is needed for the statistics arm (it is needed only for the
        certificate control). For larger parameters, sample lambda via the (Tr, Norm) root
        WITHOUT constructing the curve, and record that as an explicit TRANSFER
        ASSUMPTION - the larger-parameter arm tests the number theory, not the geometry.
        AGAINST WHICH PREDICTED DISTRIBUTION - the empirical CDF of
        log(ord_N(lambda))/log(N-1) against the exact distribution for a uniform element
        of (Z/N)^*, computed from the factorisation of N - 1 rather than approximated.
        TAIL CONSISTENCY CHECKS - report the SMALLEST observed order over the whole
        family, the number of pairs with order below N^{1/3}, and the largest prime
        q | N - 1 dividing no observed order. Under H1 the count below N^{1/3} should be
        about (number of pairs) * N^{-2/3}, i.e. zero at every scale tested; a nonzero
        count that survives the certificate control is F2 and stops the work.
        SAMPLED PARAMETERS RECORDED - p, a, b, N, t, D, D_0, f, B, the factorisation of
        N - 1, and per pair (Tr, Norm, lambda, order).
      falsification_condition: >-
        A measured count of pairs with ord_N(lambda) <= N^{1/3} exceeding the H1
        prediction by more than 3 Poisson standard deviations, on curves whose
        endomorphism certificates all verify. H1 is refuted, C2's density figure is void,
        and IDEA-20260807-18d2f7's cheap-action branch is reopened with a concrete object.
    - id: H2
      statement: >-
        EVALUATION-COST ADEQUACY. For an endomorphism alpha of degree n presented as a
        Velu-composed rational map, the number of F_p operations to evaluate alpha on one
        point is at least c0 * n for a constant c0 > 0 measurable on the toy family, and
        the cost of canonicalising a <lambda_alpha>-orbit of size h is at least
        (h - 1) times that.
      rigorous_support: >-
        RIGOROUS PART - the defining rational functions of a degree-n isogeny have degree
        Theta(n) and its kernel has up to n points, so the map cannot be written down in
        fewer than Omega(n) coefficients. DISTRIBUTION IMITATED - none; this is an
        implementation-adequacy assumption of the same kind as a regression fixture, and
        it is stated separately from T1 so that a cost-model objection cannot be
        mistaken for an objection to the arithmetic.
      validation_plan: >-
        WHAT TO SAMPLE - measured field-operation counts for evaluating each constructed
        alpha, on at least 50 points per alpha, across the norm ladder n = 2, 3, 5, 7,
        11, 13. AGAINST WHICH PREDICTION - a linear fit of operation count against n,
        reporting c0 and the residuals; a sublinear fit is the interesting outcome and
        refutes H2 rather than being absorbed. TAIL CHECK - the largest n at which the
        linear model still fits within 20 percent. TRANSFER - nothing about constants at
        toy scale transfers to cryptographic p; only the Omega(n) shape is claimed to.
      falsification_condition: >-
        A measured evaluation cost growing slower than n^{1 - epsilon} for any fixed
        epsilon > 0 over the tested ladder. H2 is refuted and C1's cost corollary is
        withdrawn while T1 stands.

  target_complexity:
    time_exponent: >-
      1/2, UNCHANGED, and no exponent is claimed. This record proposes no algorithm. What
      it bounds is an exponent another record computed: IDEA-20260807-18d2f7 shows that a
      cheap invariant for an orbit of size N^{alpha} would give total cost about
      N^{(1-alpha)/2} + N^{alpha}, minimised at alpha = 1/3. T1 shows the ACTION half of
      that configuration is unavailable from a cheap endomorphism at any alpha for which
      the orbit is short, and, under H1, is available in the window alpha = 1/3 only with
      heuristic density N^{-2/3}. The residual route to N^{1/3} is the label and selector
      class, whose cost profile is unknown and is not estimated here.
    memory_exponent: >-
      O(1), unchanged - the rho baseline's memory. This record stores nothing beyond a
      per-curve table; the toy verification enumerates O to norm B, which is O(B/sqrt|D|)
      elements, and computes orders in O(log N) each, so its own memory is negligible.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group operations and
      O(1) memory (KN-TECH-001, KN-TECH-006), and on |Aut| > 2 curves the
      automorphism-discounted variant with a constant at most sqrt(6) (KN-TECH-018).
      BSGS at sqrt(N) time and sqrt(N) memory. van Oorschot-Wiener at sqrt(N^3/w) time
      with memory w. Generic lower bound Omega(sqrt(N)) (Shoup).
    hidden_overhead: >-
      Disclosed in three places. (a) T1's o(1) is exactly the 2 log(1 - N^{-1/2}) term and
      is negligible for N > 2^10; no asymptotic sleight is involved. (b) The step from T1
      to C1 passes through the cost model H2, which is an assumption about presentations
      of isogenies and not a theorem; a hypothetical n^{o(1)}-evaluable presentation would
      void C1 and leave T1 intact. (c) C2's density N^{-2/3} is heuristic under H1 and
      additionally assumes N - 1 has a divisor near N^{1/3}; both are stated rather than
      buried.
    tradeoff_note: >-
      No time-memory tradeoff arises for this record's own content. For the object it
      bounds, the relevant tradeoff is IDEA-20260807-18d2f7's - orbit size N^{alpha}
      against canonicalisation cost, balancing at alpha = 1/3 with O(1) memory per
      processor plus a distinguished-point table. T1 removes the cheap-endomorphism
      route to the balance point and leaves the curve otherwise untouched. Parallelisation
      position is unchanged: an automorphism-discounted rho parallelises linearly and this
      record changes nothing about that.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES, so this is not a bare null.
    TIME - parallel Pollard rho with distinguished points at 0.886*sqrt(N) (KN-TECH-001,
    KN-TECH-006) dominates; this record proposes nothing that runs against an ECDLP
    instance at all. MEMORY - rho at O(1) dominates; the verification stores a per-curve
    table of size O(B). DATA/QUERIES - no query advantage is claimed in any model; no
    queries are consumed. CM-SPECIFIC - automorphism-discounted rho at
    1.2533*sqrt(N/|Aut|) (KN-TECH-018) dominates on the j = 0 and j = 1728 families and is
    the very constant this record derives. MEMORY-RICH - BSGS at sqrt(N)/sqrt(N) and
    van Oorschot-Wiener at sqrt(N^3/w) dominate on their own axes. MULTI-TARGET -
    Kuhn-Struik at sqrt(LN) dominates; nothing here is multi-target. GENERIC LOWER BOUND -
    Shoup's Omega(sqrt(N)) is not competed with. Every row dominates trivially because no
    algorithm is proposed, so `null` is not available and is not written.
  sota_delta:
    time_exponent: '0 (no change)'
    memory_exponent: '0 (no change)'
    data_or_query_exponent: '0 (no queries)'
    note: >-
      ZERO on every cost axis, and zero is the historically expected answer for this
      research question. The delta that exists is structural and countable. (i) The
      sqrt(|Aut|) ceiling on orbit-collapse speedups moves from an empirical constant
      (KN-TECH-018 records it with no derivation) to a consequence of a norm-order
      inequality covering ALL endomorphisms, not only units - which is strictly more than
      H-JINV-db2776's S2, an automorphism-classification argument, and complementary to
      IDEA-20260811-332ce9, which bounds the label rather than the action. (ii) An
      explicit exclusion region: for a 256-bit N, every endomorphism whose scalar has
      order at most 6 has norm at least about 2^42, which removes the entire small-|D_0|
      supply from the orbit-collapse question at zero compute. (iii) One branch of
