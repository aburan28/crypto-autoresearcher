  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-09-01'
  proposed_by: idea-generator
  status: proposed
  class: mechanism

  title: >-
    A CHEAP ENDOMORPHISM CANNOT HAVE A SMALL ORBIT. For every ordinary E/F_p and every
    non-unit alpha in End(E) of norm n, the multiplicative order h of the scalar
    lambda_alpha by which alpha acts on the prime-order subgroup obeys
    n^h >= (sqrt(N) - 1)^2, hence n >= N^{1/h}. So the configuration that produces a rho
    discount - a FREE map with a SHORT orbit - is available only at n = 1, and the
    sqrt(|Aut|) constant is forced by a norm-order tradeoff rather than by which maps
    happen to be free. This prices the ONE branch of IDEA-20260807-18d2f7's N^{1/3} rung
    that record asserts is cheap for small |D_0|, at heuristic density N^{-2/3}.

  object: >-
    TRACKED OBJECT - THE EIGENVALUE ORDER SPECTRUM. For a curve E with End_{F_p}(E) = O
    and prime-order subgroup G of order N, define
    Sigma_B(E) = { ( N(alpha), ord_N(lambda_alpha) ) : alpha in O, 1 <= N(alpha) <= B },
    where lambda_alpha in Z/N is the scalar by which alpha acts on G (H-ENDO-001) and
    ord_N is multiplicative order. What is retained is a finite set of PAIRS OF SMALL
    INTEGERS - a norm and an order. The curve equation, the j-invariant, the points, the
    ring structure of O, the isogeny class and every coordinate are discarded.
    ESTABLISHED FAMILIES DECLARED OFF-LIMITS AS THE PRIMARY LENS FOR THIS RECORD, per
    docs/inventor-protocol.md section 1, because RQ-JINV-8fc13a is heavily mined
    (56 proposals, 3 hypotheses): the automorphism-order function and the sqrt(|Aut|)
    rho discount itself (KN-TECH-018, H-JINV-db2776); Semaev support, Newton-polytope,
    BKK and degeneration screens (H-JINV-0e8819, IDEA-20260811-97e244,
    IDEA-20260811-6034d0, IDEA-20260811-a7c1df); the Cl(O)-torsor and crater-cardinality
    functionals (IDEA-20260826-d61c49, IDEA-20260828-f3c50e); the relation-collection
    density battery (H-JINV-5a0b9e); the ORBIT-LABEL function f as a morphism to P^1
    (IDEA-20260811-332ce9); and volcano DEPTH, which belongs to RQ-VOLC-f6253b and is
    being worked concurrently.
    CANDIDATE OBJECTS ENUMERATED AND SCORED on (genuinely new in this corpus / one-step
    propagation definable and measurable / how far it survives):
    (a) the scalar lambda_alpha alone - already named as the lane's answer by
        IDEA-20260807-778375 ("the CM ring's publicly usable output on G is the single
        GLV eigenvalue lambda"), so a repackaging; testable; survives but says nothing
        new;
    (b) the label morphism f with its degree - IDEA-20260811-332ce9's object; already
        owned, and it bounds the LABEL rather than the ACTION;
    (c) deg(alpha) alone - a repackaging of |Aut| once one asks only whether it is 1;
    (d) the PAIR (N(alpha), ord_N(lambda_alpha)) - new in this corpus as far as this
        session could check; its one-step propagation is exactly multiplicativity,
        lambda_{alpha beta} = lambda_alpha lambda_beta, so the norm coordinate and the
        order coordinate propagate under composition by two different laws (norms
        multiply, orders take lcm-divisor behaviour), which is what makes the pair
        informative where either coordinate alone is not; it survives the whole
        endomorphism ring and dies exactly at the point where alpha stops being an
        endomorphism, which is the boundary this record claims;
    (e) the full ideal class of alpha - carries strictly more, is heavier to compute,
        and is the Cl(O) object other records already own.
    (d) is adopted. KN-OPEN-019 applies: this program has no written object-enumeration
    for the ECDLP, so the scoring above is a SKETCH, not a taxonomy.

  lossy_projection_test: >-
    The projection alpha -> (N(alpha), ord_N(lambda_alpha)) is maximally lossy: from a
    pair of integers nothing about the curve, the ring, the point or the scalar is
    recoverable, and the fibres are large - every alpha and its conjugate bar(alpha) have
    the same norm, and every alpha with the same lambda has the same order coordinate,
    so infinitely many alpha share one pair. It is NOT a change of coordinates.
    COMPATIBILITY WITH THE TARGET'S OPERATIONS, WHICH IS THE PART THAT HAS TO BE
    CHECKED. The operations this record uses the object under are (i) composition in O
    and (ii) restriction to G. Under (i) the retained part propagates deterministically:
    alpha -> lambda_alpha is a ring homomorphism O -> Z/N (H-ENDO-001), so
    N(alpha beta) = N(alpha) N(beta) and lambda_{alpha beta} = lambda_alpha lambda_beta,
    hence ord_N(lambda_{alpha beta}) divides lcm(ord, ord). Under (ii) it is defined by
    construction. It is NOT compatible with F_p-isogeny to another curve - the target
    curve has a different N and a different O in general - and this record never uses it
    across an isogeny. Stating the incompatibility is part of passing the test, not a
    caveat bolted on afterwards.

  claim: >-
    Four statements. T1 is a theorem, C1 and C2 are its corollaries, and M is the
    measurement that turns C2 from an argument into a number.

    (T1) THE NORM-ORDER TRADEOFF. Let E/F_p be ordinary with p > 3, let G <= E(F_p) have
    prime order N, and let alpha in End_{F_p}(E) have norm (equivalently degree)
    n = N(alpha) >= 2. By H-ENDO-001 alpha acts on G as multiplication by a scalar
    lambda_alpha in (Z/N)^*; let h = ord_N(lambda_alpha). Then
        n^h >= (sqrt(N) - 1)^2,   equivalently   h >= log N / log n - o(1),
        equivalently   n >= N^{1/h} (1 - o(1)).
    PROOF. alpha^h acts on G as lambda_alpha^h = 1, so G is contained in
    ker(alpha^h - [1]). Since n >= 2, N(alpha^h) = n^h != 1, so alpha^h != [1] in O and
    the endomorphism alpha^h - [1] is nonzero. For any nonzero isogeny psi,
    #ker(psi) <= deg(psi), and deg = norm on End of an ordinary curve. Writing |.| for
    the complex absolute value on the imaginary quadratic order, the triangle inequality
    gives
        N >= is at most  deg(alpha^h - 1) = |alpha^h - 1|^2 <= (|alpha|^h + 1)^2
                       = (n^{h/2} + 1)^2,
    read in the direction N <= (n^{h/2} + 1)^2. Hence n^{h/2} >= sqrt(N) - 1. QED.
    The one place the hypothesis n >= 2 is used is in concluding alpha^h != [1]; for a
    UNIT alpha (n = 1) one has alpha^h = [1] identically in O and the argument gives
    nothing - which is exactly the escape, and it is the whole content of the corollary
    below.

    (C1) THE CHEAP-AND-SHORT CONFIGURATION EXISTS ONLY AT n = 1, HENCE ONLY AT
    j = 0 AND j = 1728. A rho equivalence-class discount of sqrt(h) needs an orbit of
    size h that is generated by a map costing O(1) to apply. By T1, a non-unit alpha with
    orbit size h has norm n >= N^{1/h}; evaluating an endomorphism of degree n as a
    rational map costs Omega(n) field operations, so the per-step canonicalisation cost
    is Omega(h N^{1/h}) - astronomically above one group addition for every h >= 2 at
    cryptographic N. Units escape T1 entirely, and over F_p with p > 3 the unit group of
    an imaginary quadratic order is cyclic of order 2, 4 or 6, with 4 only at j = 1728
    and 6 only at j = 0. THEREFORE the sqrt(|Aut|) ceiling on orbit-collapse speedups is
    a consequence of a norm-order tradeoff, uniform over all ordinary prime-field curves
    and all endomorphisms, and small |D_0| - which supplies genuinely cheap non-unit
    endomorphisms of norm ~|D_0|/4 - supplies maps whose orbits are LARGE, never short.
    EXTENSION TO SEVERAL GENERATORS, which the single-alpha statement does not
    immediately give: if H = <lambda_{alpha_1}, ..., lambda_{alpha_r}> has order h then
    every ord_N(lambda_{alpha_i}) divides h, so T1 applies to each generator separately
    and every non-unit generator has norm >= N^{1/h}. A small subgroup cannot be
    generated by cheap non-unit endomorphisms however many are used.

    (C2) THE PRICE OF THE EXPONENT RUNG'S CHEAP-ACTION BRANCH. IDEA-20260807-18d2f7
    tabulates a ladder of subgroups H <= (Z/N)^* and computes that a cheap invariant for
    an orbit of size h = N^{1/3} would give an N^{1/3} prime-field ECDLP algorithm - an
    exponent move from 1/2 to 1/3. For the band 6 < h < N its own table records that the
    action is realisable "at cost: free if lambda is a unit (impossible for h > 6), a few
    field operations if lambda is the eigenvalue of an efficiently computable non-unit
    endomorphism (small |D_0| only), and about log2(N) group operations for an arbitrary
    lambda". THIS RECORD PRICES THE MIDDLE ENTRY. h is not a free parameter of that
    branch: for a given alpha, h = ord_N(lambda_alpha) is DETERMINED, lambda_alpha being
    a root of X^2 - Tr(alpha) X + N(alpha) modulo N. Landing h in the exponent-relevant
    window h ~ N^{1/3} therefore requires lambda_alpha to fall inside a subgroup of
    (Z/N)^* of order about N^{1/3}, which under heuristic H1 below has probability about
    N^{1/3}/N = N^{-2/3} per (curve, alpha) pair, and additionally requires N - 1 to have
    a divisor of that size. The cheap-action branch in the useful window is therefore a
    COINCIDENCE OF DENSITY ABOUT N^{-2/3}, not a family, and it is not selectable by an
    attacker who is handed a curve. The rung's remaining content is entirely the LABEL
    and SELECTOR question, which is IDEA-20260811-332ce9's S1-S3 and is untouched here.

    (M) THE MEASURED OBSTRUCTION. The reusable number is
        OBST-EIG(E, B) = min { ord_N(lambda_alpha) : alpha in O, 2 <= N(alpha) <= B },
    reported per curve together with the T1 floor log N / log B, the ratio between them,
    and the empirical distribution of ord_N(lambda_alpha)/(N-1) over the enumerated
    alpha. T1 predicts OBST-EIG >= log N / log B on EVERY curve with zero exceptions;
    H1 predicts OBST-EIG is in fact close to the maximum, not the floor.

    (WHAT IS NOT CLAIMED) No exponent is moved. No attack is proposed. No advantage over
    the automorphism-discounted rho baseline is claimed in any direction, and the honest
    sota_delta is zero on every axis. T1 is elementary and is offered as a DERIVATION
    under docs/claims-and-verification.md, not as a proved theorem of record. The record
    does not close IDEA-20260807-18d2f7's rung and any summary saying it does is wrong.

  mechanism: >-
    The rho equivalence-class speedup consumes exactly one resource - a group of
    automorphisms of the SET G that is (i) small enough to enumerate per step and
    (ii) free to apply. The program has always read the first condition off |Aut| and the
    second off "the map is a unit, so it is one field multiplication". T1 shows the two
    conditions are not independent: on an ordinary curve the only maps available on G are
    the images of End(E), the image map is a ring homomorphism onto a subring of Z/N, and
    an endomorphism whose image has finite order h must satisfy alpha^h - 1 = 0 on G,
    which is a DEGREE statement - deg(alpha^h - 1) >= #ker >= N. Degree is the same
    quantity as cost, because evaluating an isogeny of degree n costs Omega(n). So
    "short orbit" and "cheap map" are the two ends of one inequality, and only the units,
    for which alpha^h - 1 is identically zero rather than merely zero on G, sit at both
    ends at once. That is why j = 0 and j = 1728 are special and why small |D_0| is not a
    weaker version of them: small |D_0| moves n from ~p down to O(1), which by T1 moves h
    only from >= 2 up to >= log N / log|D_0| - the wrong direction for an orbit collapse
    and the right direction for IDEA-20260807-18d2f7's large-orbit rung, whose binding
    constraint is therefore the label and not the action.

