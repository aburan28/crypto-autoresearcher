idea:
  id: IDEA-20260805-705614
  question_id: RQ-SLHDSA-001
  goal_id: GOAL-SLHDSA-001
  added: '2026-08-05'
  title: >-
    Quantifier-order audit of the FORS interleaved-target bound: the reachable
    occupancy set, a one-line proof that no worst-case-occupancy bound can be
    non-vacuous at FIPS 205 parameters, and the nearby object -- a
    publicly-computable-index variant -- where the whole conclusion is false
  class: audit

  claim: >-
    The FORS multi-target bound is a statement of the form
      FOR ALL adversaries A with at most q signing queries and at most Q hash
      queries, Adv_ITSR(A) <= f(q, Q, h, a, k),
    and the entire question of whether it is tight reduces to WHICH SET OF
    OCCUPANCY VECTORS the quantifier over A is allowed to range over. This
    proposal audits that quantifier and derives three things before any compute:
    (1) A FORCED VALUE THAT CONSTRAINS THE PROOF WITHOUT READING IT. The maximum
        of SUM_i gamma_i^k over the simplex {gamma >= 0, SUM_i gamma_i = q} is
        q^k, attained at a vertex, by convexity of x -> x^k for k >= 1. A bound
        that quantifies over worst-case occupancy therefore yields per-attempt
        success 2^{-h} q^k 2^{-ak}; at SLH-DSA-128s (h, a, k) = (63, 12, 14) and
        q = 2^64 that is 2^{-63 + 896 - 168} = 2^{665}, i.e. VACUOUSLY ABOVE 1.
        Hence the published bound CANNOT be a worst-case-occupancy bound. It must
        contain a probabilistic occupancy argument, and everything interesting
        about its tightness lives in that argument. This is derived here, at zero
        compute, before the text has been read, and it tells the reader exactly
        where in the proof to look.
    (2) THE SLACK OF THE OBVIOUS PROOF MOVE, COMPUTED. The natural probabilistic
        step is a maximum-load tail bound -- "except with probability 2^{-s}, no
        hypertree leaf is used more than G times" -- followed by
        SUM_i gamma_i^k <= (SUM_i gamma_i) * G^{k-1} = q * G^{k-1}. That surrogate
        is loose against the exact moment 2^h * T_k(q/2^h) by a factor that is an
        exact ratio of computable integers. Computing it for the six FIPS 205
        sets, over a grid of tail-probability targets s, IS the slack measurement
        the goal's first completion criterion asks for -- and it is a
        measurement of the PROOF, not of the scheme.
    (3) THE NEARBY OBJECT WHERE THE CONCLUSION IS KNOWN FALSE, WITH ITS COST.
        Replace the secret-keyed message randomizer R = PRF_msg(SK.prf, ., M) by
        a publicly computable R = H(M). Nothing else changes. In that hypothetical
        variant the adversary CAN grind offline to concentrate the occupancy, the
        reachable set becomes the whole simplex, and the worst case in (1) is
        approachable at a stated cost. Costing that variant produces the number
        that quantifies what the randomizer buys -- a number this corpus does not
        have -- and it is the inventor-protocol section 8 audit-4 control: a
        method that cannot separate SLH-DSA from this variant has not identified
        the load-bearing structure.
    NO CLAIM IS MADE ABOUT SLH-DSA'S SECURITY, AND NO ATTACK ON SLH-DSA IS
    PROPOSED. The variant in (3) is not SLH-DSA and must never be reported as if
    it were.

  object_first_candidate:
    tracked_object: >-
      THE REACHABLE OCCUPANCY SET Gamma(I) -- the set of occupancy vectors
      gamma over the 2^h FORS key pairs that an adversary can induce, as a
      function of its CONTROL INTERFACE I. Followed through: control interface
      (what the adversary may choose and what it may observe) -> reachable set
      Gamma(I) -> the extremal value of SUM_i gamma_i^k over Gamma(I) -> the
      bound's per-attempt success probability -> the claimed security. The
      object is the SET, not any particular occupancy: the whole audit is about
      how the quantifier over adversaries translates into a quantifier over
      occupancies, and that translation is where a bound is loose or wrong.
    established_families_off_limits: >-
      Off-limits as the PRIMARY lens: (a) hash-function cryptanalysis of any
      kind; (b) fault, Rowhammer, and memory-corruption attacks on the stateless
      construction -- a strictly separate claim class under RQ-SLHDSA-001 and
      untouched here; (c) side channels; (d) WOTS+ and hypertree structural
      attacks; (e) algebraic and lattice devices, blocked by construction for
      hash-based schemes; (f) the concrete-cost re-derivation itself, which is
      IDEA-20260805-fbe36a's job -- this record must not become a second copy of
      it, and its deliverable is a statement about the PROOF's quantifiers and
      about a HYPOTHETICAL VARIANT, not a recomputation of the same curve.
    newness_score: >-
      Item (1) is elementary convexity and the conclusion "the proof must be
      probabilistic in the occupancy" is surely known to anyone who has written
      such a proof. Item (3)'s qualitative content -- that the message randomizer
      exists to prevent multi-target concentration -- is RECALLED-UNVERIFIED as
      the published design rationale (KN-LIT-4938's title, "Mitigating
      Multi-Target Attacks in Hash-based Signatures", points straight at it, and
      that entry is a bulk-seeded stub this program has not read). What is not in
      this corpus, and what this record supplies, is the QUANTITATIVE version of
      item (3) and the explicit reachable-set framing that makes the quantifier
      question answerable by a reading task rather than an argument.
    testability_score: >-
      Items (1) and (2) are exact arithmetic, seconds, pure Python integers.
      Item (3) is a closed-form grinding-cost optimization, one page, no compute.
      Item (2)'s comparison against the ACTUAL proof requires the primary text
      and is the only step with an obtainability risk; the goal's own
      pause_conditions cover that outcome.
    survival_score: >-
      The reachable-set object survives as far as the control interface is
      precisely stated and dies the moment it is not -- which is exactly the
      right failure mode for an audit, because it forces the interface to be
      written down. Its weakness is that the interesting answer may be "the
      proof already does the exact-moment thing", in which case the deliverable
      is a confirmed-tight verdict. That is pre-declared as a usable outcome.

  lossy_projection_identifiability_audit:
    projection: >-
      An adversary strategy (its message choices, adaptivity, and offline hash
      queries) projected onto the single set-valued observable Gamma(I), and
      thence onto one real number, max_{gamma in Gamma(I)} SUM_i gamma_i^k.
    what_is_discarded: >-
      All adaptivity structure, all message content, the ordering of queries, and
      every distinction between strategies inducing the same occupancy
      distribution.
    why_genuinely_lossy: >-
      Enormously lossy: the fibre over a reachable set contains every strategy
      with that reach. Not a change of coordinates.
    why_compatible_with_the_operations: >-
      The ITSR success probability of any strategy is a function of the induced
      occupancy and revealed-leaf sets alone (derived in IDEA-20260805-fbe36a
      step 2), so the projection commutes with what the security game does.
    is_it_only_a_change_of_coordinates: >-
      No. The reachable set is not recoverable from the strategy space by any
      relabelling; it is a genuine forgetful map, and the extremal-value
      summary forgets even more.
    which_failure_was_checked_for: >-
      THE MIRROR FAILURE, and it is the live risk here. A summary as coarse as
      "max over the reachable set" could easily be CONSTANT across every
      interface worth distinguishing -- if every interface reached the whole
      simplex, the observable would carry no information and this proposal would
      be worthless. CHECK PERFORMED, ON PAPER, AND IT SEPARATES:
      for the randomized-index interface the reachable set is (under
      HEUR-SLHDSA-OCC-1) a single multinomial DISTRIBUTION whose extremal
      k-th power sum concentrates at 2^h T_k(lambda), while for the
      publicly-computable-index interface the reachable set includes the vertex
      with value q^k. At 128s, q = 2^64, those are 2^96 and 2^896 -- 800 bits
      apart. The comparator spread is not zero; it is the largest spread in this
      goal. The lossless failure was also checked and is refuted on cardinality
      grounds.

  mechanism: >-
    DERIVED HERE. All structural facts about SLH-DSA are RECALLED-UNVERIFIED and
    are candidates to check against FIPS 205; the mathematics is independent of
    them except through the constants.

    PART 1 -- THE CONTROL INTERFACE, WRITTEN OUT. In SLH-DSA the hypertree leaf
    used by a signature is (idx_tree, idx_leaf) extracted from
    H_msg(R, PK.seed, PK.root, M) with R = PRF_msg(SK.prf, opt_rand, M).
    SK.prf is secret. The adversary chooses M and may see the resulting index
    AFTER the fact; it cannot compute the index of an unsigned message and cannot
    choose a message for a target index. Its control interface is therefore
    exactly: choose q, choose the messages, observe the indices. Under the
    random-oracle idealization of PRF_msg and H_msg this induces the uniform
    multinomial and nothing else. NOTE, AND IT MATTERS: FIPS 205's "deterministic"
    signing mode is RECALLED-UNVERIFIED to set opt_rand = PK.seed while keeping
    SK.prf in the PRF input, so even deterministic SLH-DSA has an index the
    adversary cannot compute. If that recollection is wrong -- if any mode makes
    the index publicly computable -- the nearby object of Part 3 stops being
    hypothetical and the finding changes character completely. VERIFYING THIS ONE
    SENTENCE IS THE HIGHEST-VALUE READING TASK IN THE GOAL.

    PART 2 -- THE CONVEXITY FORCED VALUE. For k >= 1 the function x -> x^k is
    convex on [0, infinity), so SUM_i gamma_i^k over the simplex SUM_i gamma_i = q
    is maximized at a vertex: gamma = (q, 0, ..., 0), value q^k. Consequently the
    worst-case-occupancy per-attempt success probability is
      p_wc = 2^{-h} (q / 2^a)^k = 2^{k(64 - a) - h}   at q = 2^64,
    which for the six RECALLED parameter sets is, in log2:
      128s 2^{14*52 - 63}   = 2^{665}
      128f 2^{33*58 - 66}   = 2^{1848}
      192s 2^{17*50 - 63}   = 2^{787}
      192f 2^{33*56 - 66}   = 2^{1782}
      256s 2^{22*50 - 64}   = 2^{1036}
      256f 2^{35*55 - 68}   = 2^{1857}
    -- every one vacuously above 1. THE CONCLUSION IS UNCONDITIONAL GIVEN THE
    PARAMETERS: no bound whose occupancy quantifier is worst-case can say
    anything at FIPS 205 parameters. This is a constraint on the proof derived
    without reading the proof, and it converts "is the bound tight" into the
    sharper and answerable "which probabilistic occupancy argument does it use".

    PART 3 -- THE SURROGATE LADDER AND ITS SLACK. Between the vacuous worst case
    and the exact moment sit the surrogates a real proof would plausibly use.
    Ordered from loosest to tightest:
      S0  worst case:            SUM gamma^k <= q^k                    (vacuous)
      S1  max-load tail bound:   SUM gamma^k <= q * G^{k-1}, where G is the
          smallest integer with 2^h * P[Poisson(lambda) > G] <= 2^{-s}
      S2  exact moment:          E[SUM gamma^k] = 2^h * T_k(lambda)
      S3  exact moment with leaf collisions:
                                 2^h * E[m(X)^k],  m(g) = 2^a(1-(1-2^{-a})^g)
    S1 is the interesting one because it is the move a careful prover makes when
    an exact moment is inconvenient, and its looseness is computable exactly:
      slack_1(q, s) = log2( q * G(s)^{k-1} ) - log2( 2^h * T_k(lambda) ).
    Both terms are exact integers (G by a Poisson tail search over rationals).
    The deliverable is slack_1 tabulated over the six sets and over
    s in {64, 128, 192, 256}, plus the resolved question of which rung the actual
    text stands on. NOTE THE DIRECTION: S1 is an UPPER bound on the attack's
    success, so a loose S1 makes the PROOF conservative, i.e. the true margin is
    LARGER than the proof asserts. A slack found here is good news for SLH-DSA
    and bad news for anyone quoting the bound as if it were tight.

    PART 4 -- THE NEARBY OBJECT, AND WHAT THE RANDOMIZER BUYS. Define VARIANT-P
    (hypothetical, NOT SLH-DSA, NOT ANY DEPLOYED SCHEME): identical to SLH-DSA
    except R = H(M) is publicly computable, so the index map M -> (idx_tree,
    idx_leaf) is public. Now the adversary can grind. The cheapest concentrated
    attack: find G messages that all map to a common hypertree leaf, then have
    them signed; at that leaf every FORS tree t then has |S_t| distinct revealed
    leaves out of 2^a, and forging at that leaf succeeds with probability
    PROD_t (|S_t|/2^a) per trial. Taking G = 2^a * ln(2^a) makes every leaf of
    every FORS tree revealed with constant probability (a coupon-collector
    argument, stated as such and to be made rigorous in the experiment), after
    which forgery at that leaf is free apart from finding one fresh message that
    maps to it, at cost 2^h.
    THE GRINDING COST is a multi-collision search: producing G messages sharing
    one of 2^h buckets costs about 2^{h(G-1)/G} * G/e hash evaluations by the
    standard multi-collision estimate (RECALLED-UNVERIFIED as the standard
    formula and to be re-derived, not cited). For 128s (h = 63, a = 12):
    G ~ 2^12 * ln(2^12) ~ 2^15.1, giving roughly 2^{63 * (1 - 1/2^15.1)} * 2^{13.7}
    ~ 2^{76.7} offline hash evaluations plus about 2^15 signature queries.
    Against IDEA-20260805-fbe36a's C2 figure of 2^{133.7} for SLH-DSA itself at
    q = 2^64, THE MESSAGE RANDOMIZER IS WORTH ROUGHLY 57 BITS AT 128s -- and
    that is a number this corpus does not have and that the goal's slack question
    needs, because it says how much of SLH-DSA's FORS margin is bought by the
    randomizer rather than by k and a. EVERY FIGURE IN THIS PARAGRAPH IS A
    PRE-REGISTERED ESTIMATE TO BE RE-DERIVED IN THE EXPERIMENT, INCLUDING THE
    MULTI-COLLISION FORMULA, AND NONE IS A MEASUREMENT.
    THE CONTROL VALUE OF VARIANT-P: it is the closest object to SLH-DSA on which
    the hoped-for conclusion ("the multi-target term is governed by the exact
    moment") is FALSE. Any analysis, any bound, and any instrument that reports
    the same answer for SLH-DSA and VARIANT-P is not reading the load-bearing
    structure, and the experiment runs both through the identical pipeline for
    exactly that reason.

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_searched:
      - knowledge/ (grep sphincs, SLH-DSA, FORS, WOTS), ledger/, experiments/, docs/
    findings:
      - >-
        No record in this corpus performs a quantifier-order audit on any
        signature-scheme security bound. The session angle brief records the
        section 8 audit-4 nearby-object control as "run almost nowhere here" and
        names hash-based signatures specifically (F11) as a place where D10 is
        NOT blocked.
      - >-
        KN-LIT-4938's title indicates the multi-target mitigation rationale is
        published. THE PAPER HAS NOT BEEN READ; the entry is a 2026-07-24
        bulk-seeded stub with null identifiers. It is named as a candidate to
        check, never as an authority, and the quantitative claim in Part 4 is
        this record's derivation, not a relayed one.
    conclusion: >-
      Novelty unverified. The qualitative rationale is very likely published; the
      quantitative separation and the reachable-set framing are not in this
      corpus. Per angle-brief T-H, discount this screen: it can only see what was
      staged into the corpus, and 95 percent of that carries a bulk-seed caveat.

  assumptions:
    - >-
      B1. The recalled control interface is correct -- in particular that SK.prf
      is in the PRF input in EVERY signing mode. Falsifying this changes the
      finding from "audit of a hypothetical variant" to something requiring
      AGENTS.md rule 12 routing, and the experiment must halt and escalate rather
      than continue.
    - >-
      B2. Convexity argument: exact and unconditional, no assumption.
    - >-
      B3. The multi-collision cost formula. RECALLED-UNVERIFIED; to be re-derived
      from first principles in the experiment, with the derivation shown. If the
      re-derivation disagrees with the recalled form, the recalled form is
      discarded and the derived one used, and the discrepancy is recorded.
    - >-
      B4. The coupon-collector argument for G. Stated as an argument sketch, to
      be made rigorous or replaced by an exact expected-cover computation.

  proof_search_map_note: >-
    This idea is proof-oriented (it audits a security bound). Its
    proof_search_map is carried in full on the paired hypothesis
    H-SLHDSA-3a403a, which covers both this record and IDEA-20260805-fbe36a
    under one map rather than duplicating it; the map's quantifier_order and
    method_ceiling / nearby_object_control fields are written for this record's
    content specifically.

  heuristic_assumptions:
    - id: HEUR-SLHDSA-QO-1
      formal_statement: >-
        FOR ALL adversaries A against SLH-DSA with the stated control interface,
        the reachable set Gamma(A) of occupancy vectors is supported on the
        uniform multinomial and A cannot shift its extremal k-th power sum by
        more than the multinomial's own upper tail. Formally: there is no
        strategy A and no leaf i such that E[gamma_i under A] exceeds
        q * 2^{-h} * (1 + negl).
      rigorous_support: >-
        Conditional on PRF_msg being a secure PRF under SK.prf. This is the
        SAME assumption the scheme already makes for unforgeability, so it adds
        no new trust -- but it is an assumption and is recorded as one rather
        than smuggled in as a structural fact.
      random_model_justification: >-
        A cannot evaluate PRF_msg without SK.prf, so the index of an unsigned
        message is unpredictable to it; and it must commit to M before the index
        exists.
      validation_plan: >-
        Reading task on FIPS 205's signing algorithm; plus the VARIANT-P contrast
        arm, which demonstrates what a violation would look like quantitatively.
      falsification_condition: >-
        Any published or derived route by which an adversary influences
        (idx_tree, idx_leaf). Discovery of one is an AGENTS.md rule 12 event and
        must be escalated, not written up in this record.
    - id: HEUR-SLHDSA-QO-2
      formal_statement: >-
        The published FORS multi-target bound stands on rung S1 (max-load tail
        bound) or S2 (exact moment) of the surrogate ladder, not on S0.
      rigorous_support: >-
        S0 is excluded unconditionally by Part 2's vacuity computation given the
        parameters. Which of S1 and S2 it stands on is NOT derivable and is a
        reading question -- this heuristic is the record's honest statement of
        what it does not know.
      random_model_justification: not applicable -- this is a claim about a document, not about a random object.
      validation_plan: Stage 0 reading of the primary text with a verbatim quotation.
      falsification_condition: >-
        The text uses a surrogate not on the ladder. That outcome is MORE
        interesting than either predicted one and the experiment treats it as a
        success, not a failure.

  predictions:
    - metric: >-
        Q1 -- log2 of the worst-case-occupancy per-attempt success probability
        p_wc = 2^{k(64-a)-h} at q = 2^64, for the six parameter sets
      direction: higher
      minimum_effect: >-
        EXACTLY 665, 1848, 787, 1782, 1036, 1857 respectively -- all strictly
        greater than 0, hence vacuous. Exact integers, derived pre-run,
        conditional on the recalled (h, a, k). Any value <= 0 at any set falsifies
        the vacuity conclusion for that set and the audit's Part 2 must be
        rewritten.
    - metric: >-
        Q2 -- slack_1(q = 2^64, s = 128) = log2(q * G^{k-1}) - log2(2^h T_k(lambda))
        for the six sets
      direction: higher
      minimum_effect: >-
        Strictly positive at every set (forced: the max-load surrogate is an
        upper bound on the exact moment for any valid G, by the power-mean
        inequality). NO NUMERIC PREDICTION IS PRE-REGISTERED FOR ITS SIZE,
        deliberately: G depends on the tail-probability convention and this
        record refuses to invent a number it has not derived. The SIGN is forced
        and is the falsifiable content; a non-positive value means the G search
        or the moment computation is wrong.
    - metric: >-
        Q3 -- separation between SLH-DSA and VARIANT-P under the identical
        analysis pipeline, in bits, at 128s
      direction: higher
      minimum_effect: >-
        At least 30 bits. Pre-registered estimate approximately 57 bits
        (2^{133.7} versus roughly 2^{76.7}); the 30-bit floor is set well below
        the estimate so that a rough multi-collision re-derivation cannot
        manufacture a pass. A separation BELOW 30 bits would mean the randomizer
        buys much less than the design rationale implies and would be the most
        interesting outcome in this record. A separation of ZERO means the
        pipeline is blind to the control interface and NO conclusion of any kind
        may be reported.
    - metric: >-
        Q4 -- the rung of the surrogate ladder occupied by the primary text's
        bound
      direction: different
      minimum_effect: >-
        A verbatim quotation with equation or theorem number identifying S1, S2,
        S3, or an unlisted surrogate; or an explicit record that the text could
        not be obtained under the goal's declared source-preference order.
    - metric: >-
        Q5 -- graded control on the control interface: interpolate between
        SLH-DSA and VARIANT-P by giving the adversary the ability to reject and
        resubmit a message after seeing its index, with a resubmission budget
        r in {0, 1, 4, 16, 64}
      direction: higher
      minimum_effect: >-
        The achievable max_i gamma_i must be monotonically non-decreasing in r,
        and the r = 0 cell must reproduce the pure multinomial exactly. Five
        interior points; a non-monotone sequence localises the error in the
        reachable-set model rather than leaving "the interface matters".

  minimal_test:
    design: >-
      Carried by experiments/EXP-SLHDSA-9cbad4/specification.yaml as its
      Stage 0 gate G0-B, Stage 1 arm QO, and Stage 5. Ordered cheapest-first.
      Stage 1 arm QO is pure integer arithmetic and can terminate the line: if
      Q1 does not come out vacuous the audit's premise is wrong. Stage 5 (the
      VARIANT-P contrast) is one page of derivation plus a small exact
      computation and needs no primary text at all, so it survives the goal's
      pause_condition on source availability.
    controls:
      - >-
        NULL OBJECT (same shape, forced value pre-derived, CAN FAIL): the
        reachable-set analysis applied at k = 1. With one FORS tree the
        occupancy concentration has no leverage -- SUM gamma_i^1 = q identically
        for EVERY occupancy vector, so the max over the simplex equals the min
        equals q, and the worst case coincides with the exact moment. Forced
        slack: EXACTLY 0 bits between S0, S1 and S2 at k = 1. If the pipeline
        reports any separation at k = 1 it is manufacturing structure.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR:
        VARIANT-P. The concentration effect MUST appear there -- the reachable
        set provably contains high-occupancy vectors because the index map is
        public. If the pipeline reports no advantage for VARIANT-P, the
        instrument is blind to the control interface and NO NEGATIVE RESULT
        ABOUT SLH-DSA MAY BE REPORTED FROM ANY ARM.
      - >-
        GRADED CONTROL, 5 interior points, monotonicity reported: the
        resubmission-budget ladder r in {0, 1, 4, 16, 64} of prediction Q5,
        interpolating between the two interfaces. This is what turns "the
        randomizer matters" into "here is the rate at which it stops mattering",
        and it localises any failure to a specific interface strength.
      - >-
        ORDERING CONTROL: the surrogate-ladder computation and the VARIANT-P
        derivation are committed and hashed BEFORE Stage 0's primary text is
        read, so the ladder cannot be reverse-engineered to match the text.
      - >-
        ARCHIVE CHECK (zero compute): no prior quantifier-order audit exists in
        this corpus for any scheme. Recorded as unavailable, not as passed.
    required_metrics:
      - p_wc in log2 per parameter set, as an exact integer
      - G(s) per parameter set per s, with the tail computation shown
      - slack_1 in bits per set per s
      - VARIANT-P grinding cost derivation and its total, with every step shown
      - the k = 1 null's zero-separation check
      - the resubmission-ladder monotonicity table
      - verbatim quotation of the bound, or a recorded failure to obtain it

  falsification_conditions:
    - >-
      Q1 is not vacuous at some parameter set. Part 2's central derivation is
      wrong for that set and the record must be superseded.
    - >-
      slack_1 is non-positive anywhere. The surrogate ladder is mis-ordered and
      the analysis is defective.
    - >-
      The k = 1 null shows a non-zero separation between S0 and S2. The pipeline
      is manufacturing structure; nothing may be reported.
    - >-
      VARIANT-P shows no advantage over SLH-DSA. The instrument cannot see the
      control interface, which is the only thing it was built to see.
    - >-
      Stage 0 finds that some SLH-DSA signing mode makes the index publicly
      computable. HEUR-SLHDSA-QO-1 is refuted; the work stops and escalates
      under AGENTS.md rule 12 rather than being written up here.
    - >-
      The resubmission ladder is non-monotone in r. The reachable-set model is
      wrong somewhere between the two endpoints.

  confounders:
    - >-
      VARIANT-P IS NOT SLH-DSA, AND THE TEMPTATION TO REPORT IT AS IF IT WERE IS
      THE PRINCIPAL RISK OF THIS RECORD. Every artifact it produces carries the
      label. A hypothetical variant's weakness is not a deployed scheme's
      weakness, and RQ-SLHDSA-001's constraint that operational consequences
      follow from claims about standardized parameter sets applies with full
      force.
    - >-
      READING RISK. "Which rung the bound stands on" is a question about a
      document. A paraphrase, a summary, or a model's recollection of the proof
      cannot answer it. Only a quotation can, and the absence of one is recorded
      as absence.
    - >-
      RECALLED MULTI-COLLISION FORMULA. Part 4's cost rests on a remembered
      estimate. It is re-derived in the experiment; until then the 57-bit figure
      is a pre-registered estimate and nothing else.
    - >-
      DIRECTIONAL COMFORT. A loose S1 makes the proof conservative and the
      scheme look better. That is the comfortable answer and therefore the one
      to hold to the higher standard; the k = 1 null and the VARIANT-P positive
      control are both able to fail and both must pass first.

  interpretation_limits:
    - >-
      NO ATTACK ON SLH-DSA IS PROPOSED OR IMPLIED. The only attack costed is
      against VARIANT-P, which is a hypothetical object constructed as a control.
    - >-
      A finding that the bound is loose is a finding about the BOUND. It does not
      weaken the scheme; it means the scheme's true margin against this attack is
      larger than the bound asserts.
    - >-
      Nothing here bears on fault, Rowhammer, or memory-corruption results.
      Separate claim class, untouched, and never to be reported alongside.
    - >-
      The audit covers the FORS layer's interleaved-target bound only. WOTS+ and
