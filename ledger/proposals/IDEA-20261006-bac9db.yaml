  proof_search_map:
    bottleneck: >-
      Whether a repeated cubic occupies two slots. Collapsing equal
      values removes the gap this measurement exists to see.
    baseline_embedding:
      parameter_slice: >-
        The pair predicate that both N_f and N_g are B-smooth, which
        rejects both named points.
      reproduction_check: >-
        Monomial and Horner expansions agree, and the pair predicate
        returns 0 at both points.
    observation_collision:
      observable: >-
        The acceptance indicator of the three-slot count.
      distinct_preimage_search: >-
        h = f and h = (x+1)^3 are different polynomials and are predicted
        to share the indicator 1. That collision is intended: the
        observable does not identify which cubic supplied the second
        smooth slot.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The two points (1,4) and (2,8), the bound 7, and three named cubics.
        predicted_gain: >-
          Four indicators separating the duplicate from x^3 + 2. No
          asymptotic gain.
    quantifier_order: >-
      For both points in {(1,4), (2,8)}, the slot predicate accepts h = f
      and rejects h = x^3 + 2. There exists a third cubic, (x+1)^3, that
      is accepted at both points and is not equal to f. The quantifiers
      do not range over primes of cryptographic size.
    method_ceiling:
      strongest_certifiable_claim: >-
        The four indicators under this predicate and this bound. Not a
        relation yield for a sieve region, and not a field logarithm.
      nearby_object_control: >-
        (x+1)^3 must accept both points. If it is rejected, the smooth
        test is not the one defined here.
    proof_obligations:
      - claim: The six integers match the expansions named in the mechanism.
        responsibility: correctness
      - claim: The duplicate and the treatment differ at both points.
        responsibility: strictness
      - claim: No deployment cost and no ECDLP exponent is inferred.
        responsibility: scope
    not_applicable_reason: >-
      The map audits a two-point integer predicate. It is not a proof of
      a sieve runtime.
