idea:
  id: IDEA-20261006-bac9db
  title: >-
    Slot-count of three cubic norm forms at two named sieve points
  class: measurement
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  added: '2026-10-06'
  question_id: RQ-PAIR-f2e31f
  novelty_status: unverified
  claim: >-
    Fix B = 7 and the binary cubics N_f(a,b) = a^3 + a b^2 + b^3,
    N_g(a,b) = a^3 + a^2 b + b^3, and N_h(a,b) for a third monic cubic h.
    A nonzero integer is B-smooth when every prime factor of its absolute
    value is at most 7; the units ±1 count as smooth. Score a point by how
    many of the three integers (N_f, N_g, N_h) are B-smooth, counting a
    repeated form as two slots. The score predicate accepts when that count
    is at least 2. At (a,b) = (1,4) and at (a,b) = (2,8) the predicate
    accepts when h = f and rejects when h = x^3 + 2. The two indicators
    therefore differ. No discrete logarithm is computed. No cost for a
    deployed prime is stated.
  mechanism: >-
    Two readings of a third polynomial are separated before any count is
    treated as a yield. Slot reading: each supplied cubic is one slot, so
    h = f puts the same integer in two slots and can accept a point that
    the pair (f, g) rejects. Distinct-value reading: equal integers are
    collapsed before the count, so h = f and a third cubic with a large
    prime factor are scored alike at these points. The hand expansions
    that the test must recompute are N_f(1,4) = 81 = 3^4, N_g(1,4) = 69
    = 3*23, N_{x^3+2}(1,4) = 129 = 3*43, N_f(2,8) = 648 = 2^3*3^4,
    N_g(2,8) = 552 = 2^3*3*23, and N_{x^3+2}(2,8) = 1032 = 2^3*3*43.
    Under B = 7 the slot reading accepts both points for h = f and rejects
    both for h = x^3 + 2. OBJECT FRAME. The representation is the
    coefficient vector of a monic cubic in Z[x], together with the integer
    pair (a,b). Sigma is evaluation of those binary forms. Sigma is not
    translation on a curve. Trichotomy class: coordinate-dependent, because
    the acceptance bit changes when the coefficient vector of h changes
    and (a,b) stays fixed. LOSSY-PROJECTION TEST. The projection discards
    the prime factorization and keeps the Boolean that every prime factor
    is at most 7, then the count of true Booleans among the three slots.
    The discard is compatible with Sigma because each form is evaluated on
    its own and the predicate is a function of those three Booleans.
    Lossy: 81 and 648 become the same Boolean, so the exponents are not
    recovered. OFF-LIMITS AS PRIMARY LENS: families F1-F7. Component
    used: F2, only as this Boolean on integer values of binary forms, not
    as a factor base attached to a curve. F4 is not a component.
  assumptions:
    - Smoothness is trial division of one integer by primes at most 7. No density law is used.
    - h = f is the duplicate null. h = x^3 + 2 is the treatment. Both f = x^3 + x + 1 and g = x^3 + x^2 + 1 are irreducible over F_2, and x^3 + 2 is Eisenstein at 2.
    - The point (0,0) is not in the test. The value 0 is not scored as smooth.
  predictions:
    - metric: >-
        Acceptance indicator of the three-slot predicate at (1,4) and at
        (2,8), for h = f and for h = x^3 + 2
      direction: different
      minimum_effect: >-
        At each of the two points the indicator is 1 for h = f and 0 for
        h = x^3 + 2. A gap of one indicator at either point is enough to
        separate the readings; both points are pre-registered.
  minimal_test:
    design: >-
      Expand each binary form by monomials and again by Horner. Require
      the two expansions to agree. Trial-divide the absolute values by
      primes at most 7. Apply the three-slot predicate. Also score the
      nearby cubic (x+1)^3, whose values are (a+b)^3, so 125 at (1,4)
      and 1000 at (2,8).
    controls:
      - >-
        Duplicate null h = f. Predicted indicators 1 and 1. If this null
        is rejected, the slots were collapsed before counting.
      - >-
        Treatment h = x^3 + 2. Predicted indicators 0 and 0. If this
        treatment is accepted, a prime larger than 7 was dropped.
      - >-
        Nearby reducible (x+1)^3. Predicted indicators 1 and 1, because
        5 is at most 7. This cubic must not be scored as a copy of x^3 + 2.
      - >-
        Same-shape check on the pair alone: both f and g are monic
        cubics of height 1. The pair predicate "both values are
        B-smooth" rejects both points. The third slot is what changes
        the duplicate's score.
    required_metrics:
      - The six absolute values, each from two expansion methods
      - The two indicators for h = f
      - The two indicators for h = x^3 + 2
      - The two indicators for (x+1)^3
  falsification_conditions:
    - The two expansion methods disagree at either point.
    - Either indicator for h = f is 0, or either indicator for h = x^3 + 2 is 1.
    - All three cubics h = f, h = x^3 + 2, and h = (x+1)^3 receive the same indicator at both points.
    - Raising the bound from 7 to 23 is reported as the same experiment. At bound 23 the integer 69 becomes smooth and the (1,4) gap is a different question.
  controls:
    - Duplicate polynomial against a same-degree irreducible with a prime factor above the bound.
    - Reducible cube (x+1)^3 as a nearby object that accepts for a different reason.
  confounders:
    - Deduplicating equal integers before counting makes h = f look like a single smooth slot and erases the gap.
    - Treating 0 as smooth, or dropping the unit plus or minus 1, changes scores at points that are not in this pair but can leak into a shared routine.
    - A bound other than 7, especially any bound at least 23, changes which of 23 and 43 are small.
  interpretation_limits:
    - Not an attack. No discrete logarithm, no relation matrix, and no ECDLP exponent.
    - The indicators are not a bit level for any deployed curve and not a memory charge at deployment parameters.
    - Acceptance of two sieve points does not select polynomials for a degree-12 field and does not calibrate an asymptotic constant.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        For all four named evaluations at (1,4) and (2,8), the monomial
        expansion and the Horner expansion are equal as integers, and the
        B-smooth Boolean for B = 7 is the Boolean that the absolute value's
        prime factors lie in {2,3,5,7}. The duplicate h = f occupies two
        slots. No statement is made about a random integer of the same size.
      rigorous_support: >-
        A binary form of degree 3 is the homogenization b^3 f(a/b). Equality
        of two evaluation orders is polynomial arithmetic. Trial division up
        to 7 decides the Boolean for these six integers because each integer
        is smaller than 7^2 times a one-digit cofactor that was factored by
        hand in this proposal; the test repeats that division.
      validation_plan: >-
        Recompute the six integers by both evaluation orders, factor by
        trial division, and apply the predicate. Then repeat at the single
        extra point (4,4), where both N_f and N_g equal 192 = 2^6*3, so
        every third cubic is predicted to accept. If (4,4) is rejected, the
        predicate is not the one pre-registered and the (1,4) and (2,8)
        gaps are void. No second box is required for the pass/fail line.
  target_complexity:
    time_exponent: >-
      Six integer evaluations and trial division by primes at most 7.
      No new exponent. No sub-rho claim. The generic-group bound in the
      opened row KR-RHO-13bf67 is not improved and not used as a runtime.
    memory_exponent: >-
      A constant number of integers. No matrix is stored.
    best_known: >-
      Opened row KR-RHO-13bf67 states an Omega(square root of p)
      generic-group lower bound. This measurement does not state an
      ECDLP time. Opened note KN-LIT-3743 relays an L-notation sentence
      at abstract level; that sentence is not a baseline this idea moves.
    hidden_overhead: >-
      None derived. No o(1) term from a sieve analysis is present.
    tradeoff_note: >-
      No time-memory tradeoff. The output is four indicators.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
