proposal:
  id: IDEA-20261007-7625cc
  title: Random-walk endpoint routing as an EndRing trapdoor interface
  area: SSI
  question_ids: [RQ-SSI-1946c9]
  goal_ids: [GOAL-SSI-2fa82a]
  status: proposed
  class: trapdoor-interface-typed-obstruction
  claim: >-
    Test whether the endpoint relation of a publicly sampled constant-degree
    supersingular isogeny walk can be inverted in polynomial time from every
    complete evaluable basis of the source endomorphism ring, and whether a
    relation inverter can reconstruct that complete ring. This proposal does
    not assert that either algorithm exists.
  mechanism: >-
    From bare E, sample and explicitly encode an ell-isogeny walk pi and map it
    to the canonical endpoint y. The desired trapdoor algorithm Route(E,B,y)
    accepts any full evaluable End(E) basis B and returns any path to y. For the
    correctly directed proof lead, combine the sampled pi with an inverter's
    pi' as dual(pi') composed with pi, repeat, and attempt rank-four generation
    and full-order saturation.
  predictions:
    - id: P1
      metric: public_interface_typing
      prediction: >-
        Sample and Eval use only the bare curve, fixed ell, path coins, and
        public validation data; no secret-correlated public field is needed.
    - id: P2
      metric: any_basis_route_success
      prediction: >-
        A qualifying Route, if found, succeeds for every certified full basis
        and every honest-support endpoint with explicit polynomial cost and
        negligible failure.
    - id: P3
      metric: complete_ring_reconstruction
      prediction: >-
        Repeated sampled-path/inverter-path collisions yield evaluable
        endomorphisms that generate and saturate the complete rank-four order
        with an explicit polynomial success bound.
  minimal_test: >-
    Zero-run symbolic gate: write Route(E,B,y) without endpoint-ring,
    orientation, planted-basis, or routing-table oracles; then prove invariance
    under B -> B U for arbitrary U in GL_4(Z). The present packet fails at the
    first step and records the missing algorithm.
  controls:
    - Reproduce the CEST/RWCT provenance-versus-necessity regression.
    - Exhibit pi versus pi followed by an edge and its dual as an endpoint collision.
    - Replace the output by the full path; public inversion must be detected.
    - Quantify over every valid full basis rather than an existential planted basis.
  falsification_conditions:
    - >-
      Route requires an endpoint ring, orientation, connecting ideal, planted
      labels, or non-polynomial routing advice not derivable from (E,B,y).
    - >-
      A declared polynomial smaller witness enables all admitted inversions
      without reconstructing a complete evaluable End(E) basis.
    - >-
      Collision-derived endomorphisms remain in a proper suborder or fail to
      saturate with the claimed polynomial probability.
    - >-
      A selected-message compiler requires recovery of the original path even
      though the endpoint relation has multiple preimages.
  heuristic_assumptions:
    - name: collision_loop_generation
      statement: >-
        Inverter outputs differ often enough from sampled paths, and resulting
        loops have enough diversity to generate the full order.
      validation_route: >-
        Prove a distributional generation-and-saturation lemma before any
        implementation; a bounded experiment could only explore toy behavior.
    - name: source_ring_routing
      statement: >-
        A source complete ring basis contains sufficient efficiently usable
        information to route to honest random-walk endpoints.
      validation_route: >-
        Supply and analyze Route on the exact challenge distribution, including
        arbitrary basis changes and failure tails.
  target_complexity:
    time: polynomial in lambda and L for fixed ell
    memory: polynomial in lambda and L
    comparison_baseline: unknown from scoped sources
    achieved: false
  cost:
    research_runs: 0
    next_step: proof and algorithm design only
    implementation_eligible: false
  proof_search_map: coordination/design/TASK-20261007-d54864/tasks/TASK-20261007-61dd3f/proof-search-map.yaml
  prior_art:
    - ref: KN-LIT-6572
      relation: summary reports a torsion-attack trapdoor with auxiliary torsion images
    - ref: KN-LIT-6628
      relation: summary reports an auxiliary-point hidden-isogeny assumption
    - ref: KN-LIT-827
      relation: summary reports SIDH-oriented key-updatable PKE
    - ref: KN-LIT-1260
      relation: summary reports a LIT-diagram PKE
    - ref: BATCH-65c2dd
      relation: avoids finite evaluator tuples and planted noncommutative words
  novelty_status: unverified
  novelty_note: Primary papers were not read in this task.
  dominated_by: unresolved
  sota_delta:
    quantitative_value: null
    reason: No inversion algorithm is achieved, so no comparison is meaningful.
  obstruction:
    type: missing_any_basis_inversion_algorithm
    resource_check: >-
      Zero-run symbolic search used the frozen interface schema and scoped
      corpus pointers; no implementation resource could supply a missing
      mathematical router.
    argument: >-
      Public endpoint evaluation is typed, but no polynomial algorithm maps an
      arbitrary complete source basis and endpoint to a connecting path. The
      map is many-to-one, and smaller-witness necessity is also unproved.
    forward_guidance: >-
      Define Route(E,B,y) with universal basis-change invariance before testing
      collision-loop reconstruction or a PKE compiler.
  scientific_runs: 0
  created_at: '2026-10-07'
  producer_task_id: TASK-20261007-61dd3f
