  batch: EC-STRUCTURE-20260825
  cluster: 'C2-noncommutativity: where the quaternion analogy dies'
  title: '''ABSENT'' IS NOT ''UNREACHABLE'': price every route by which an ordinary prime-field curve
    could be related to an object with DEFINITE quaternionic endomorphisms, and either produce a lower
    bound at or above matched rho or name the cheapest bridge'
  class: measurement
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: Each individual obstruction (no F_p-isogeny between ordinary and supersingular curves;
    the ordinary/supersingular dichotomy under reduction) is standard and recalled. The proposed contribution
    is the assembled pricing table and the insistence that an absence claim in this ledger be converted
    into a measured obstruction with a resource check, as the closure standard requires.
  claim:
    semantic_part: The definite quaternion structure that the exemplar p^(1/3) result consumes is not
      merely absent from ordinary prime-field curves; the question is at what price it can be reached,
      and that price has never been computed in this program.
    evaluator_part: 'Unestablished: every entry in the pricing table. This record proposes the table and
      the method, and asserts no bound.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - 'Enumerate the routes. R1: an F_p-isogeny from E to a supersingular curve -- obstructed because isogenous
    curves share their Frobenius trace and hence their ordinary/supersingular type; record the obstruction
    as a measured degree condition rather than as prose. R2: base change to F_(p^n) and an isogeny there;
    price n. R3: reduction of a global curve at a different prime, where the same curve can be supersingular;
    price the lift and the transport of the ECDLP instance, which is where the CANL lane''s height budget
    already bites. R4: an abelian surface with definite quaternionic multiplication having E as an isogeny
    factor; determine whether such a surface over F_p is necessarily supersingular and therefore has no
    ordinary factor.'
  - For each route, produce either a proof that it cannot be traversed, or an explicit cost in the security
    parameter, and compare with matched rho.
  - 'Record the result as an obstruction block with a resource check: the statement, the quantity, its
    value, and its scope.'
  lossy_projection_test:
    tracked_object: the endomorphism algebra type of an abelian variety
    what_is_discarded: everything about the variety except its endomorphism algebra
    propagation: isogeny-invariant, which is exactly why the routes are so constrained
    verdict: PASSES; isogeny invariance is the reason the object is both a good invariant and a hard one
      to change.
  predictions:
  - id: P1
    status: established_formula
    statement: Isogenous curves over F_p have equal Frobenius traces and hence the same ordinary/supersingular
      type.
  - id: P2
    status: unestablished
    statement: Every route in the table costs at least matched rho on the security parameter.
  - id: P3
    status: unestablished
    statement: No abelian surface over F_p with definite quaternionic multiplication has an ordinary elliptic
      curve as an isogeny factor.
  minimal_discriminating_test:
    status: specified_not_run
    test: 'Toy-scale exhaustive check of P1 and P3 over small p: enumerate isogeny classes, classify endomorphism
      algebras of products and of simple surfaces, and check the factor condition directly.'
    pass: P1 and P3 hold on every enumerated case at toy scale.
    fail: A counterexample to P3 at toy scale would be a genuinely interesting positive and would redirect
      the whole cluster.
  controls:
  - Supersingular curves in the same enumeration as the positive control that the classification code
    detects definite algebras when they are present.
  - Products E x E' of ordinary curves, whose algebra is split, as the known negative.
  confounders:
  - '''Reachable'' must be defined relative to a cost model or the table is vacuous.'
  - Toy-scale enumeration may miss phenomena that appear only for large p.
  - Route R3 overlaps the canonical-lift lane's already-measured height budget; double-counting a closed
    obstruction as a new one would be an error.
  falsification:
    semantic: Any traversable route with cost below matched rho falsifies the expected outcome and is
      the result worth having.
    evaluator: An error in the endomorphism-algebra classification scopes out that row.
    not_falsification: An unenumerated route; the table must say it is unenumerated.
  why_this_is_not_a_variant: KN-FIND-7e4b90 and KN-FIND-5c1a03 assert absence. The CANL lane priced ONE
    route (canonical lifting) and closed it on a height budget. This record asks for the complete table
    and, crucially, requires the entries be measured quantities in an obstruction block rather than prose
    -- which is the difference between a fatigue report and a closure under this program's own standard.
  limits:
  - 'Zero-run: nothing here has been executed, measured, or independently reviewed.'
  - Proposal tier only; claim ceiling is stated in claim_ceiling and is not exceeded.
  - No end-to-end ECDLP algorithm, exponent, or cost claim is made.
  - 'Novelty is unverified: no literature screen was performed for this batch.'
  - Public parameters and toy instances only; no live key, wallet, or deployed target.
