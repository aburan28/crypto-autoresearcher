idea:
  id: IDEA-20261005-ccc1ad
  question_id: RQ-QLWE-9108dc
  added: '2026-10-05'
  status: proposed
  approved_by: null
  title: >-
    The opened Ideal-SVP texts do not contain an archimedean-fibre sentence:
    KN-LIT-6130 is title-only, the named PDF is absent, and the digest abstract
    quotes worst-case/average-case Ideal-SVP plus rapid mixing and then stops
  class: measurement
  claim: >-
    Opened on 2026-10-05: knowledge/literature/KN-LIT-6130.md,
    knowledge/techniques/KN-TECH-060.md, knowledge/techniques/KN-TECH-046.md,
    and research_digest/chunks/chunk_023.txt at the heading
    "file: 12171116.pdf (30p)". Not opened: downloads/12171116.pdf and
    downloads/12171116 (1).pdf; the downloads directory is absent and Read of
    downloads/12171116.pdf returned file not found. KN-LIT-6130.md states that
    no abstract was extractable and records only the title-level claim
    "Random Self-reducibility of Ideal-SVP via Arakelov Random Walks"; a
    search of that file finds no archimedean-fibre, covering-radius, or height
    sentence. KN-TECH-060.md states that the Néron–Tate height is a positive
    semi-definite quadratic form on A(K) tensor R, obtained as a limit of Weil
    heights, and contains no sentence on an archimedean fibre. The digest line
    is a truncated abstract, ending inside the letters "algori". From that
    truncation the self-reducibility sentence is: "We then exploit this result
    to relate the average-case and the worst-case of the Shortest Vector
    Problem in ideal lattices." The mixing sentence in the same truncation is:
    "we prove that, subject to the Riemann Hypothesis for Hecke L-functions,
    certain random walks on the Arakelov class group have a rapid mixing
    property." That mixing sentence does not say what an archimedean fibre
    contributes. No sentence in the truncation, in KN-LIT-6130.md, or in
    KN-TECH-060.md assigns the archimedean fibre a role in mixing, covering
    radius, or the height pairing. The same truncation also says the reduction
    "loses no more than a ˜O(√n) factor on the Hermite approximation factor"
    for Hermite-SVP in ideal lattices of certain cyclotomic fields; that
    expression is asymptotic and was not evaluated. No hand-sized formula was
    extracted, so no numerical check at a discriminant or a cyclotomic
    conductor was performed. This absence is the reading outcome. It is not a
    theorem about the unread paper, and no venue or year was checked
    (KN-LIT-6130.md has venue null and year null).
  mechanism: >-
    The tracked object is a sentence in an opened file. The test keeps two
    sentences and discards the rest of the paper, which is a lossy projection
    of the unread PDF onto text this checkout actually contains. A missing
    file and a truncated abstract do not propagate into a formula. The
    Néron–Tate quadratic form in KN-TECH-060.md is not substituted for the
    missing archimedean-fibre sentence.
  novelty_status: unverified
  citations:
    - ref: KN-LIT-6130
      provenance: internal
      claim: >-
        The entry says no abstract was extractable from the first two pages of
        a local PDF and that the only recorded claim is the title. Local copy
        paths are downloads/12171116 (1).pdf and downloads/12171116.pdf.
      verified_by: knowledge/literature/KN-LIT-6130.md
    - ref: KN-TECH-060
      provenance: internal
      claim: >-
        The Néron–Tate height attached to a symmetric ample line bundle is a
        positive semi-definite quadratic form on A(K) tensor R, obtained as a
        limit of Weil heights, vanishing exactly on the torsion subgroup. The
        file contains no archimedean-fibre sentence.
      verified_by: knowledge/techniques/KN-TECH-060.md
    - ref: research_digest/chunks/chunk_023.txt
      provenance: internal
      claim: >-
        The line headed "file: 12171116.pdf (30p)" contains a truncated
        abstract. Quotable there: the average-case/worst-case Ideal-SVP
        sentence, the rapid-mixing sentence under the Riemann Hypothesis for
        Hecke L-functions, and a loss of no more than a tilde-O of square-root
        n on the Hermite approximation factor for certain cyclotomic fields.
        The archimedean fibre is not named. The dump ends mid-word.
      verified_by: research_digest/chunks/chunk_023.txt
    - ref: KN-TECH-046
      provenance: internal
      claim: >-
        The technique note composes a quantum polynomial-time Ideal-SVP result
        at approximation factor exp(O~(sqrt(n))) in cyclotomic fields, and it
        says that composition was read from other abstracts and that the
        number theory was not verified in that note. Used only as the named
        baseline.
      verified_by: knowledge/techniques/KN-TECH-046.md
  assumptions:
    - >-
      The four opened paths are the copies read on 2026-10-05. Absence of
      downloads/ is an observation about this checkout.
    - >-
      A title and a truncated abstract are not a checked theorem. The Riemann
      Hypothesis sentence is text inside the dump, not an assumption used to
      infer a missing fibre formula.
    - >-
      Case-sensitive search of KN-LIT-6130.md and KN-TECH-060.md for
      archimedean, fibre, fiber, and covering radius returned no matches.
      The same search of research_digest/chunks/chunk_023.txt returned no
      matches.
  predictions:
    - metric: >-
        number of sentences, in the files opened on 2026-10-05, that state
        what an archimedean fibre contributes to mixing, covering radius, or
        the height pairing
      direction: different
      minimum_effect: >-
        0. One quoted sentence in a later readable PDF is a different outcome
        and is not a number that can be filled in from the files already opened.
    - metric: >-
        number of body sentences, beyond the title, relating worst-case
        Ideal-SVP to average-case Ideal-SVP in the opened digest truncation
      direction: different
      minimum_effect: >-
        1, the average-case/worst-case sentence quoted in the claim, against
        0 such sentences in KN-LIT-6130.md.
    - metric: >-
        absolute discrepancy of one hand evaluation of an extracted formula
        at one tiny discriminant or one tiny cyclotomic conductor
      direction: different
      minimum_effect: >-
        uncomputed. The only quantitative expression extracted is an
        asymptotic Hermite-factor loss of tilde-O of square-root n, which is
        not a few-line identity. Discrepancy is undefined until a short
        formula is extracted.
  minimal_test:
    design: >-
      Re-open knowledge/literature/KN-LIT-6130.md,
      knowledge/techniques/KN-TECH-060.md, and the two PDF paths named in
      KN-LIT-6130.md. Quote at most one random-self-reducibility sentence and
      at most one archimedean-fibre sentence, or record that the file is
      missing or that the sentence is absent. If a formula of a few arithmetic
      operations is present, evaluate it at one tiny discriminant (for example
      -3 or -4) or one tiny cyclotomic conductor and compare with direct
      arithmetic. The 2026-10-05 execution of this design is the claim above:
      PDF missing, fibre sentence absent, numerical branch not taken.
    controls:
      - >-
        Do not treat the Néron–Tate quadratic-form sentence in KN-TECH-060.md
        as the archimedean-fibre sentence.
      - >-
        Do not treat the title in KN-LIT-6130.md as an extracted theorem.
      - >-
        Positive instrument check: the same quote-or-absence procedure on
        KN-TECH-046.md does record an explicit approximation-factor sentence,
        exp(O~(sqrt(n))), so the procedure can keep a sentence when one is
        present.
      - >-
        A missing PDF is recorded as unreadable. It is not recorded as a
        proof that the unread paper lacks the sentence.
    required_metrics:
      - quote_or_absence_self_reducibility
      - quote_or_absence_archimedean_fibre
      - numerical_check_or_explicit_skip
  falsification_conditions:
    - >-
      A sentence quoted in the claim does not occur in the file named as its
      source.
    - >-
      KN-LIT-6130.md or KN-TECH-060.md contains an archimedean-fibre
      contribution sentence. The 0-count is then false.
    - >-
      downloads/12171116.pdf or downloads/12171116 (1).pdf is readable in
      this checkout and contains either requested sentence. The "file not
      found" outcome is then false for that file.
    - >-
      A few-line formula is present in an opened source and no numerical
      comparison is reported. The explicit skip is then incomplete.
    - >-
      Writing a self-reducibility theorem or an archimedean-fibre formula
      that was not in an opened file. That invents the theorem and falsifies
      the reading by leaving the measurement.
  confounders:
    - >-
      The digest abstract is truncated mid-word, so a later page of the paper
      can contain the fibre sentence without it appearing in the dump.
    - >-
      Broken spacing in the dump ("number eld", "o er") can hide a word. The
      strings archimedean, fibre, fiber, and covering radius still do not
      occur in that file.
    - >-
      The rapid-mixing sentence can be misread as the archimedean-fibre
      sentence. It names the Arakelov class group and a Riemann Hypothesis
      hypothesis; it does not name the fibre.
  interpretation_limits: >-
    Ideal-SVP self-reducibility reading only. Not a Selmer or Sha certificate.
    Not a rank certificate and not a result under RQ-ECRANK-27dcc5 or GOAL-ECQ.
    The paper's theorem was not checked. Provenance of the unread PDF remainder
    is not retrieved. No deployed system is discussed. No exponent moves.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        No distributional hypothesis is used. The Riemann Hypothesis for
        Hecke L-functions appears only as words inside the truncated abstract.
        This idea does not assume it, and does not infer a fibre contribution
        from it.
      rigorous_support: >-
        The support is the opened text. There is no bound being imitated and
        no classical distribution theorem being applied.
      validation_plan: >-
        Re-open the same four paths and match the quotations. If a PDF becomes
        readable, quote the two requested sentences or record their absence,
        and run the numerical branch only if the extracted formula is a few
        lines.
  target_complexity:
    time_exponent: >-
      O(1) human time for the reading. No Ideal-SVP exponent moves.
    memory_exponent: O(1)
    best_known: >-
      exp(O~(sqrt(n))) Ideal-SVP as composed in KN-TECH-046, and the
      Néron–Tate quadratic form as stated in KN-TECH-060. Neither is improved.
    hidden_overhead: >-
      No algorithmic o(1) term is claimed. The unread remainder of the paper
      is an evidence gap.
    tradeoff_note: >-
      No time-memory tradeoff is proposed. This is not an attack claim.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      This is an Ideal-SVP sentence extraction under RQ-QLWE-9108dc. The
      ECDLP frontier map is the wrong ledger for that reading.
    nearest:
      - ref: KN-LIT-6130
        provenance: internal
        relation: adjacent
        delta: >-
          The knowledge entry has 0 extracted abstract sentences. This
          reading adds 1 truncated abstract paragraph from
          research_digest/chunks/chunk_023.txt, containing 1
          worst-case/average-case sentence and 1 rapid-mixing sentence, and
          0 archimedean-fibre sentences. The Hermite-factor loss written in
          that paragraph is one tilde-O of square-root n. No time exponent
          changes.
      - ref: KN-TECH-060
        provenance: internal
        relation: orthogonal
        delta: >-
          0 archimedean-fibre sentences and 0 new height evaluations. The
          opened note contributes the existing quadratic-form description of
          the Néron–Tate height and nothing further. Delta on the pairing
          is zero.
  dominated_by: >-
    n/a (no attack result claimed). Baselines opened before that phrase was
    used: KN-TECH-046, quantum polynomial time for Ideal-SVP at approximation
    factor exp(O~(sqrt(n))) in cyclotomic fields, and KN-TECH-060, the
    Néron–Tate height as a quadratic form from a limit of Weil heights.
  sota_delta: >-
    Not an attack claim. Delta versus exp(O~(sqrt(n))) Ideal-SVP is zero on
    the time exponent. Delta versus the Néron–Tate pairing is zero
