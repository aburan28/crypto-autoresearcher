    "title": "Character-block elimination for a covariant Frobenius Macaulay system",
    "class": "representation",
    "claim": "R3 representation at the extension-field descended-system stage. At a fixed full degree D, equivariant blocks may reduce total rank/solve work by >=20% against directly reducing the tagged n-target system, and may or may not beat one ordinary single-target solve. Passing the first comparison is not an attack advantage.",
    "mechanism": "Object: an equivariant Macaulay map decomposed into C_n character modules. Operation set Sigma: simultaneous cyclic permutation of target tags and coordinate blocks, followed by exact character projection. Trichotomy: coordinate-dependent; this is a solver/representation object, not a lossy quotient under the full group translation action. Discarded information: off-character coordinates are discarded inside each block; every character and target-recovery projection is retained across the complete computation. Make covariance explicit by a tagged direct sum of n conjugate target presentations, rather than pretending Frobenius stabilizes one target ideal. If char(F_q) does not divide n, decompose the cyclic action over a splitting extension of degree e=ord_n(q). Reduce each character block and descend the answer back to F_q with exact compatibility checks. The n-fold construction and e-fold coefficient extension are charged before any gain.",
