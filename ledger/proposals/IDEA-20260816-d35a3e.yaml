idea:
  id: IDEA-20260816-d35a3e
  question_id: RQ-FBG-001
  added: '2026-08-16'
  title: Split every factor-base geometry by the COORDINATE IT IS DEFINED IN - the exponent group
    reachable only through a discrete logarithm, versus the x-line reachable by a membership test
    - and measure coverage excess separately on each side, so that the realizability gap between the
    two is a number rather than an intuition
  class: representation
  claim: '(A) THE OBSERVATION. A factor base is a set of curve points, but a geometry describing that
    set can be written in either of two coordinates. An EXPONENT-SIDE geometry names the base by its
    discrete logarithms - a Sidon set, an arithmetic progression, or a coset inside the exponent group
    Z_N. An X-LINE-SIDE geometry names it by a condition on the point itself - x lying in an interval,
    x a quadratic residue, x in the image of a fixed low-degree polynomial. These are not two notations
    for one thing. A geometry defined in the exponent coordinate is constructed by choosing exponents
    and multiplying the generator, so its discrete logarithms are known by construction; a geometry
    defined on the x-line is constructed by testing candidate points, so its discrete logarithms are
    not known. (B) THE CLAIM. The claim is that this split, not the named family, is the variable
    that organises the measured coverage excess: exponent-side geometries can attain the counting
    ceiling because the sumset structure they optimise is exactly the structure the ceiling is stated
    in, while x-line-side geometries land at the null because the discrete-logarithm map carries no
    relation between the x-line condition and the exponent sumset. The frozen battery is evidence
    consistent with this and was not designed to test it - its three untyped x-line geometries measured
    a yield ratio of exactly 1.000000 at every size, and the red-team objection recorded against it
    names an exponent-side Sidon construction reaching a coverage ratio of 1.1071. (C) THE MEASUREMENT.
    Build both sides at matched size on the same curves, measure coverage excess against the identical
    matched random null, and additionally record for each geometry a REALIZABILITY flag: whether membership
    can be decided without a discrete logarithm, and at what cost per candidate. The deliverable is
    a two-column table of excess-with-error-bars indexed by side, plus the realizability flag, so
    that any excess found on the exponent side is immediately visible as an excess that cannot be
    used to build a factor base for an unknown target. (D) WHAT IS NOT CLAIMED. No attack, no break,
    no speedup, no security consequence. It is NOT claimed that exponent-side geometries are useless
    - they are excellent measuring rods and this proposal treats them as instruments. It is NOT claimed
    that no x-line geometry can reach the ceiling; the claim is a measured gap over the tested families
    and the honest reading of a large gap is an obstruction with a stated scope, not an impossibility.
    It is NOT claimed that coverage excess translates into relation yield in a running index calculus,
    and the contract''s ceiling says so.'
  mechanism: 'STAGE 1. On a toy prime-order curve with a precomputed discrete-logarithm table from
    harness/toycurve.py, fix a base size B and construct four exponent-side geometries by choosing
    exponent sets and mapping them through the generator: a Bose-Chowla style Sidon set, an arithmetic
    progression, a multiplicative coset of a small subgroup of the exponent ring''s unit group, and
    a greedy low-collision set. STAGE 2. Construct four x-line-side geometries by testing candidate
    x values against a condition and keeping those that lie on the curve: a high-bit interval, a low-bit
    interval, x a quadratic residue, and x in the image of a fixed cubic. Each is trimmed or extended
    to exactly the same B. STAGE 3. For every geometry compute, by exact enumeration over the whole
    group at toy size, the number of size-m multisets from the base summing to each target, then the
    coverage - the fraction of targets hit at least once - and the excess against a matched random
    base of identical size drawn in the same invocation. STAGE 4. For every geometry record the realizability
    flag and the per-candidate membership cost in field operations, measured by instrumented counting
    rather than asserted. STAGE 5. Compare the excess distributions of the two sides. The mechanism
    refutes the claim if x-line geometries show excess comparable to exponent-side ones, or if exponent-side
    geometries fail to separate from the null, in which case the coordinate of definition is not the
    organising variable and the six-family taxonomy stands.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-FBG-001, H-FBG-001 and EV-FBG-001 in full, including the red-team objection RT-1
      recording the Bose-Chowla coverage ratio of 1.1071 and the headroom ceiling. Read KN-OPEN-020
      and KN-OPEN-001. Greps over ledger/proposals and ledger/hypotheses for 'Sidon' (8+ hits), 'coset'
      (8+ hits), 'high-bit' (2 hits), 'arithmetic progression' (8+ hits), 'matched random base' (8+
      hits), and grep -ril 'bose.chowla' over ledger, knowledge and experiments (11 hits). Read the
      head of experiments/EXP-RELN-0a979f/specification.yaml and IDEA-20260815-c13ef4.
    results: 'The Bose-Chowla construction appears in H-FBG-001, H-RELN-66c079, H-MONO-663fb4, H-ICLIFT-d31664,
      GOAL-ICLIFT-001, DEC-20260724-020, EV-FBG-001, EXP-RELN-0a979f and several IDEA-20260805 records,
      always as a low-additive-energy or low-collision construction. EXP-RELN-0a979f states explicitly
      in its what_this_is_not that such a base has discrete logarithms known by construction and is
      a measuring rod. So the realizability observation exists in this program as a caveat inside
      one contract. What does not exist in any record I read is the SPLIT used as the independent
      variable: no record groups geometries by coordinate of definition, and no record reports excess
      separately per side with a measured membership cost. IDEA-20260815-c13ef4 splits designed against
      sampled, which cuts a different way - a designed x-line interval is designed but x-line-side,
      and a randomly drawn exponent set is sampled but exponent-side.'
    verdict: 'UNVERIFIED. Nothing is asserted about external literature. What is claimed new is the
      use of coordinate-of-definition as the independent variable and the pairing of measured excess
      with a measured membership cost in the same table. What is assembled from known parts: the exact
      counting protocol and matched random null from the frozen battery; the Bose-Chowla construction
      and the measuring-rod caveat, both already recorded in this program; the four x-line families,
      three of which the frozen battery already measured.'
  object_first_candidate:
    tracked_object: THE PREIMAGE OF THE GEOMETRY UNDER THE DISCRETE-LOGARITHM MAP - the subset of
      the exponent group Z_N corresponding to the base, carried together with a single bit recording
      whether that preimage was chosen directly or arose as the image of an x-line condition.
    lossiness: 'Lossy. The preimage discards the y-coordinates, the curve equation, the field arithmetic
      and the ordering of the points; what is retained is a subset of Z_N plus one provenance bit.
      This is discarded compatibly with the target operation, because the operation is addition of
      m base elements, and addition of points corresponds exactly to addition of exponents - so the
      retained subset determines every multiset sum. Many different curves and bases collapse to the
      same retained object, which is what makes it a projection. The provenance bit is the part that
      does NOT survive the projection to pure arithmetic and is exactly why it is carried explicitly:
      two subsets of Z_N can be identical as sets and differ completely in whether a factor base realising
      them can be built without solving discrete logarithms.'
    propagation: 'One step of the target operation, adding one more base element to a partial sum,
      acts on the retained object as translation of the accumulated sumset by the base subset: S_{k+1}
      equals S_k plus D, computed in Z_N. This is deterministic and exact on the retained part, which
      is the propagation the lossy-projection test asks for. The provenance bit does not propagate
      at all - it is constant along the computation - and that is the honest statement: it is metadata
      about constructibility, not a dynamical quantity.'
    survival_score: 'The retained subset propagates exactly through all m steps of the decomposition,
      so structure survives the entire target operation at toy scale where the discrete-logarithm
      table can be built. It dissolves precisely when the table cannot be built - at field sizes past
      roughly 2^40 with the exact enumeration protocol, and at cryptographic sizes absolutely - so
      the object survives the operation completely but survives the SCALE not at all. Stated concretely:
      full survival through m equal to 3 additions at N up to about 2^20 with exact counting, and
      no survival as a computable object beyond the reach of a discrete-logarithm table.'
  null_object_control: 'The mandatory null is a MATCHED RANDOM BASE: B distinct group elements drawn
    uniformly without replacement from the same group, in the same invocation, measured by the identical
    exact counter, with the identical coverage definition. For the signal arm to mean anything the
    null must reproduce two known quantities: mean multiset count per target equal to binomial(B+m-1,
    m) divided by N exactly, and coverage at or below min(1, mean). A second null is required on the
    provenance side: a RANDOM EXPONENT SET, which is exponent-side by provenance but carries no designed
    structure, and which must land at the null coverage. If a random exponent set shows excess, the
    excess is an artifact of the exponent-side construction pipeline rather than of geometry, and
    the entire side comparison is void.'
  discriminated_from:
  - 'H-FBG-001 and EV-FBG-001: a six-geometry battery indexed by family name with a growth clause
    on yield ratio. This proposal re-indexes by coordinate of definition, measures coverage rather
    than mean yield (which that battery proved is size-forced at exactly 1.000000), and adds a measured
    membership cost that battery did not record.'
  - 'IDEA-20260815-c13ef4: designed versus sampled bases. That split is orthogonal - this proposal
    contains designed x-line bases and sampled exponent-side bases, which c13ef4''s axis cannot separate.'
  - 'EXP-RELN-0a979f: a graded additive-energy census that owns the deficit coordinate of the decomposition
    distribution and uses a low-energy base as a measuring rod. This proposal does not measure additive
    energy, does not grade by energy, and takes the measuring-rod caveat as its independent variable
    rather than as a footnote.'
  - 'KN-OPEN-020: asks whether every algebraically described base fails. This proposal measures a
    gap between two description coordinates and explicitly declines to make a universal statement.'
  - 'IDEA-20260807-e57607: works on solving degree and cost exponents in the automorphism lane; nothing
    here touches solving degree.'
  assumptions:
  - At toy sizes a full discrete-logarithm table is constructible, so exponent-side geometries can
    be mapped to points and x-line geometries can be mapped to exponents in the same run.
  - Coverage, not mean yield, is the only free coordinate at fixed base size, as the exact counting
    identity in the frozen evidence record established; if that identity is wrong the entire design
    collapses and STAGE 3 detects it.
  - Trimming a geometry to exactly B elements does not itself destroy the structure being tested;
    the trimming rule is fixed in advance and a trimming-order control is required.
  - Membership cost measured by instrumented operation counting is a fair proxy for construction cost
    at these sizes, acknowledging that constant factors differ from a production implementation.
  predictions:
  - metric: coverage excess of the best exponent-side geometry over the matched random null
    direction: higher
    minimum_effect: 1.05
  - metric: coverage excess of every x-line-side geometry over the matched random null
    direction: different
    minimum_effect: 'forced value: predicted to lie within the permutation-null band, that is a ratio
      whose family-wise interval contains 1.00, on the reading that the discrete-logarithm map carries
      no relation between an x-line condition and the exponent sumset'
  - metric: measured per-candidate membership cost, exponent side versus x-line side
    direction: different
    minimum_effect: 'explicit refusal to pre-commit a ratio: exponent-side membership is free by construction
      and x-line membership costs a curve-equation evaluation, so the ratio is dominated by implementation
      constants rather than by anything the proposal is testing; the numbers are reported without
      a threshold'
  - metric: coverage excess of the random-exponent-set provenance control
    direction: different
    minimum_effect: 'forced value: 1.00 within the null band; any deviation voids the side comparison'
  minimal_test:
    design: 'One curve, one size, one arity, both sides, one invocation. Take a single prime-order
      toy curve with N near 2^14 from harness/toycurve.py, build the full discrete-logarithm table
      once, set B equal to ceiling of (6N) to the one-third power so the counting regime matches the
      frozen battery, and construct eight geometries - four exponent-side, four x-line-side - plus
      the matched random null and the random-exponent provenance control, all at exactly that B. Count
      exactly, over the complete target space, the number of size-3 multisets from each base summing
      to each target; derive coverage and the excess ratio against the matched random null; run 200
      permutation draws on the base labelling for a null band. The discriminating output is whether
      the two sides separate in excess while the provenance control sits at the null. If the provenance
      control shows excess, stop: the pipeline is generating the signal. This design is cheap because
      the counting identity means no target sampling is needed and no solver is invoked at all.'
    controls:
    - Matched random base of identical size B drawn in the same invocation and measured by the identical
      counter.
    - Random exponent set of size B - exponent-side provenance, no designed structure - which must
      sit at the null.
    - 'Trimming-order control: each geometry built at 1.2B and trimmed to B under two independent
      trimming rules, reported separately.'
    - Exact-counting verification against brute force on a small subcase, reproducing the frozen battery's
      own counter check.
    - 'Closed-form total check: the summed multiset count over all targets must equal binomial(B+m-1,
      m) exactly for every base, which is a per-cell integrity test that costs nothing.'
    required_metrics:
    - coverage per geometry, exact
    - coverage excess ratio against the matched random null, with bootstrap interval
    - permutation-null band per cell from at least 200 label permutations
    - measured per-candidate membership cost in field operations
    - 'realizability flag: membership decidable without a discrete logarithm, yes or no'
    - closed-form total check residual, which must be exactly zero
    - effective base size after deduplication and negation collapse
  falsification_conditions:
  - The random-exponent provenance control shows excess outside the null band, meaning the construction
    pipeline generates the signal.
  - An x-line-side geometry shows coverage excess at or above the best exponent-side geometry, refuting
    the coordinate split as the organising variable.
  - No exponent-side geometry separates from the null, refuting the premise that the ceiling is attainable
    at these parameters.
  - The closed-form total check is nonzero for any base, invalidating the counter.
  - The two trimming rules give different verdicts for the same geometry, showing the effect is a
    trimming artifact.
  - Effective base size after negation collapse differs across sides, making the matched-size control
    not actually matched.
  confounders:
  - 'Negation closure: an x-line geometry is automatically closed under the point negation that fixes
    x, so its effective count of distinct group elements differs from an exponent-side set of the
    same nominal size. This is the single most dangerous confounder here and is why effective size
    is a required metric.'
  - Trimming to exact B can destroy or create structure depending on the rule.
  - A single curve conflates curve-specific accidents with the side effect; the minimal design accepts
    this and the full contract adds curves.
  - Membership cost is implementation-dependent and can be made to favour either side by choosing
    where to charge the curve-equation evaluation.
  - Small N makes coverage saturate toward 1 and compresses all excesses, which can hide a real difference.
  interpretation_limits:
  - Coverage excess is not relation yield and is not index-calculus cost; nothing about running time
    follows.
  - A large measured gap is an obstruction over the tested families at the tested scale, not a proof
    that no x-line geometry can reach the ceiling.
  - An exponent-side excess is not usable to attack anything, because the base's discrete logarithms
    are known by construction; the contract records it as an instrument reading.
  - Toy scale only; the object is not computable beyond the reach of a discrete-logarithm table.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement itself costs order N times B squared
      operations for the exact enumeration at arity 3 under the multiset-count formulation, which
      is a measurement cost and not an attack cost.
    memory_exponent: No attack memory exponent is claimed. Peak memory is one count vector of length
      N plus the discrete-logarithm table of length N, so linear in N at toy sizes.
    best_known: The incumbent for the measured quantity is the matched random base, whose coverage
      ratio is 1.000 by definition and whose construction cost is B uniform draws. The incumbent for
      the ceiling is the exact bound coverage at most min(1, mean) recorded in the frozen evidence
      record, with the Bose-Chowla construction reported there as attaining it at a ratio of 1.1071.
      For the underlying problem the incumbent is the generic square-root method named in KN-OPEN-001,
      which this proposal does not approach and does not claim to.
    hidden_overhead: 'The lower-order terms hide the discrete-logarithm table: every exponent-side
      construction is free only because the table was built, and the table is the whole reason the
      object is toy-scale. The human cost hides in the negation-closure bookkeeping, which is easy
      to get wrong and silently converts a matched-size comparison into a mismatched one. A third
      overhead is that the realizability flag is a judgement about whether a membership test exists,
      and an agent can widen the notion of membership test until everything qualifies.'
  dominated_by: 'n/a (no result claimed) for attack axes; there is no time, memory or query point
    to place on an attack frontier. On the measurement''s own frontier the check is real and I performed
    it against every row this repository records for coverage: the matched random base at ratio 1.000
    with construction cost B draws; the Bose-Chowla construction at ratio 1.1071, which dominates
    every geometry this proposal will build on the excess axis and is dominated by all of them on
    the realizability axis since its logarithms are known; the whole-group low-collision greedy at
    1.0269 recorded in the same red-team objection; and the frozen battery''s own best untyped result,
    coset_union at 1.0012 with an interval containing 1. No proposed geometry is expected to displace
    the Bose-Chowla row on excess, and the proposal says so in advance.'
  sota_delta: 'No attack; measurement contribution only. Quantitatively: the recorded excess frontier
    runs from 1.0012 (coset_union, interval contains 1) through 1.0269 (whole-group greedy) to 1.1071
    (Bose-Chowla, ceiling-attaining), against a headroom ceiling reported at plus 54 percent. This
    proposal predicts its x-line arm lands at 1.00 and its exponent-side arm reproduces something
    in the 1.03 to 1.11 range, so it adds no new best excess and instead adds a second axis - measured
    membership cost and a realizability flag - on which the existing best row is dominated.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'The counting identity holding (mean forced, coverage the only free coordinate):
    about 0.95, since it is an exact combinatorial statement already verified over 336 cells in the
    frozen battery and I re-derived it by hand. Exponent-side arm separating from the null: about
    0.85, because the Bose-Chowla ratio of 1.1071 is already recorded at comparable parameters, with
    the residual risk being that my reimplementation differs. X-line arm landing at the null: about
    0.6 - the frozen battery measured exactly 1.000000 mean yield for three x-line families, but coverage
    was only reported to about 1 percent and one x-line family, coset_union, reached 1.0012, so a
    small real x-line excess is quite possible and would be the interesting outcome. The coordinate
    split being the ORGANISING variable rather than one of several: about 0.35, which is the weakest
    part - negation closure and effective size are plausible alternative explanations for any gap
    I find, and I expect the honest verdict to be that the split explains part of the variance and
    effective size explains another part. Provenance control staying at the null: about 0.9. Overall
    probability the run yields a defensible two-sided table with error bars rather than a confound
    report: about 0.55.'
