idea:
  id: IDEA-20260723-001
  title: Compact target-label common-factor construction obligation
  class: representation
  claim: >-
    No new algorithm is claimed. The retained academic obligation is to exhibit
    an explicit target-independent compact representation that constructs the
    exact support factor z_R from source-labelled pair data with complete
    replay inside the B^(9/4)/B^(5/4) cost rectangle for N=B^5, or to leave the
    frontier unchanged.
  mechanism: >-
    Exact fifth-label support is encoded by z_R=gcd(g_I,r_R). Standard
    represented-resultant and indexing routes expose Theta(B^3) target-dependent
    coordinates or miss the rectangle. The open step is an oracle-free compact
    constructor, not a backend substitution.
  novelty_status: known
  question_id: RQ-CRYPTO-001
  source_refs:
