idea:
  id: IDEA-20261006-42b03f
  question_id: RQ-TORS-8c7b79
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Sum of F_31-rational roots of psi_3 on y^2=x^3+1 is not zero
  class: measurement
  claim: >-
    REPRESENTATION. The object is the monic 3-division polynomial of
    y^2=x^3+1 over F_31, in the affine x-coordinate. It is not a
    Kummer line and it is not a factor-count comparison of psi_7.
    No attack-stage cost is claimed to change. The discrete-log
    exponent delta versus Pollard rho is 0. Let S be the sum of the
    distinct roots in F_31 of that monic polynomial. The empty sum is
    0. The claim is that S is not 0, after the discriminant is checked
    nonzero and the degree is checked equal to 4. Two explanations are
    discriminated. Shifted fiber: the rational roots are a nonempty
    proper subset whose sum is nonzero. Symmetric fiber: the rational
    roots sum to 0, including the case of no rational roots. Sum 0 is
    the negative. Vieta forces the sum of all geometric roots to 0
    because psi_3 has no x^3 term. That identity does not force the
    sum of the F_31-rational roots to be 0. This is not a discrete
    logarithm.
  mechanism: >-
    The representation is the set of F_31-rational roots of monic
    psi_3. The operation set is addition in F_31, not the elliptic
    group law. The projection keeps the sum and discards which roots
    occurred. Many subsets share a sum, so the projection is lossy.
    The priced integer is S. No factor base is proposed.
  novelty_status: unverified
  citations:
    - ref: RQ-TORS-8c7b79
      provenance: internal
      claim: >-
        The question asks whether ell-torsion carries publicly
        computable information about a discrete log. This sum is
        curve-only and k-independent.
      verified_by: design session 2026-10-06 read ledger/questions/RQ-TORS-8c7b79.yaml
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: S_m is not psi_3. No decomposition is run.
      verified_by: design session 2026-10-06 read knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic discrete log needs Omega(sqrt(p)) group operations.
        This sum does not change that exponent.
      verified_by: design session 2026-10-06 read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
  assumptions:
    - >-
      A=0 and B=1, so 4A^3+27B^2=27, and 27 mod 31 is not 0. The model
      is nonsingular. That residue was checked while writing this
      proposal. S was not computed.
    - >-
      psi_3 = 3x^4 + 6A x^2 + 12B x - A^2. For this model that is
      3x^4 + 12x. The monic polynomial is that polynomial divided by
      its leading coefficient. Degree other than 4 means the
      instrument built the wrong polynomial.
    - Distinct means each root is added once. Multiplicity is not added again.
  predictions:
    - metric: sum of distinct F_31-rational roots of monic psi_3
      direction: different
      minimum_effect: not equal to 0
  minimal_test:
    design: >-
      Build monic psi_3 for y^2=x^3+1 over F_31. Evaluate it at every
      field element. Sum the distinct roots. Also sum them from a
      second evaluation. A disagreement invalidates the instrument.
    controls:
      - The discriminant residue is nonzero. A zero discriminant invalidates the run.
      - The polynomial has degree 4 and is monic. Otherwise the claim is not scored.
      - A second evaluation reproduces the root set. A mismatch invalidates the instrument.
      - The point at infinity is not a root of psi_3 and is not added into S.
    required_metrics:
      - S
      - the degree
      - the discriminant residue
      - the size of the rational root set
  falsification_conditions:
    - S equals 0. That equality, including the empty sum, is the negative.
    - The two evaluations disagree, so the instrument is invalid and the claim is not established.
    - The degree is not 4, or the discriminant is 0.
  confounders:
    - >-
      Adding a double root twice would change S. The definition adds
      each distinct root once.
    - >-
      The sum of all geometric roots is 0 by Vieta. Reporting that
      algebraic sum as S is a different integer and does not score
      the claim.
  interpretation_limits:
    - The sum does not depend on a secret scalar. The discrete-log exponent delta is 0.
    - A nonzero S is not an attack and does not move rho.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The F_31-rational roots of psi_3 on this j=0 model form a
        subset whose sum is nonzero, at the rate expected if Frobenius
        fixes a subset that is not a union of pairs summing to 0. The
        null is a uniform nonempty subset of a 4-element set of formal
        roots, not a model of the division polynomial.
      rigorous_support: >-
        psi_3 has degree (9-1)/2=4. Frobenius acts on its roots. The
        rational roots are the fixed points of that action. Vieta
        constrains the sum of all four geometric roots, not the sum of
        the rational subset.
      validation_plan: >-
        Compute S at p=31. Then compute the same sum for y^2=x^3+1
        over F_37 and record whether it is also nonzero. A zero at
        p=31 falsifies the claim. A zero at p=37 does not rewrite the
        p=31 row. No cryptographic prime is used.
  target_complexity:
    time_exponent: >-
      One degree-4 evaluation over F_31. The discrete-log exponent
      stays 1/2. Delta versus Pollard rho is 0.
    memory_exponent: O(1) relative to p. The output is one field element.
    best_known: >-
      Pollard rho at Theta(N^{1/2}) group operations (KR-RHO-13bf67).
      Prime-field Semaev index calculus does not beat that cost under
      KR-IC-5931ee.
    hidden_overhead: No o(1) attack term.
    tradeoff_note: No time-memory tradeoff. The output is one field element.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    As a discrete-log method this sum is dominated by Pollard rho and
    by KR-IC-5931ee. Those rows do not state S for this model. They
    dominate any reading of S as an attack.
  sota_delta: >-
    Discrete-log time-exponent delta versus Pollard rho is 0. The sum
    costs one degree-4 scan and does not multiply or divide that rho
    cost. The claimed separation is S not equal to 0, not a speedup.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/index-calculus
    rows_checked:
