idea:
  id: IDEA-20260922-805a59
  question_id: RQ-DREG-c8ae8d
  added: '2026-09-22'
  proposed_by: idea-generator
  status: proposed
  title: Class-wide degree-capped Semaev fall profile
  class: measurement
  claim: >-
    On one fully enumerated toy ordinary F_p-isogeny class, rebuild the same
    Semaev point-decomposition system on every curve from that curve's own
    (a, b), with one frozen factor-base rule and one frozen monomial order.
    The system is S_3 on every curve, and S_4 only on those curves where the
    same degree cap still finishes. The observable is new_falls(D) as defined
    in IDEA-20260916-4b7c1e; this record does not restate that rank identity.
    d_ff is exact once the profile is measured with no gaps from the generator
    degree. d_lf_obs, the largest D <= D_max with new_falls(D) > 0, is only a
    certified lower bound on later falls. "Does not explode" means d_lf_obs
    equals d_ff out to the cap. "Explodes" means that certified lower bound
    is strictly larger than d_ff inside the cap. A matrix that does not
    finish is neither outcome. The attack stage is relation decomposition
    only, in an R1 coordinate representation (RQ-ECDLP-623a32). Before any
    run, the completed curves are read as exactly one of three outcomes.
    (O1) The new_falls vector is constant on the class up to the gauge-orbit
    null of IDEA-20260807-6eb96b. (O2) It varies only on a named locus
    (a = 0, b = 0, or full rational 2-torsion). (O3) Some off-locus curve
    stays at its first fall while a distance-1 isogeny neighbor has
    d_lf_obs >= d_ff + 1. O1 and O2 are successes of the measurement. O3 is
    the only reading that later justifies a reachability argument, and only
    at toy tier. O3 is not accepted by this record alone; the syzygy gate
    is IDEA-20260922-f7de2a.
  mechanism: >-
    Object frame. Representation: R1, the field representation of the
    Weierstrass coefficients and of the x-coordinates in the Semaev
    generators. Attack stage: relation decomposition only. Operation set
    Sigma: Macaulay multiplication of those generators by monomials up to
    one frozen total-degree cap, then exact F_p-linear combinations. Sigma
    is not the translation action of the group. Trichotomy class of
    IDEA-20260806-c5d183: coordinate-dependent, because the fall profile is
    a property of the polynomial presentation, not of the group element.
    The projection discards the discrete logarithm, the point, and the
    generators, and retains the integer vector new_falls(D) for D <= D_max.
    That vector is lossy. It is the report of the Macaulay spaces Sigma
    builds; the integers themselves are not claimed to propagate under
    Sigma (IDEA-20260916-4b7c1e). Families F2 and F3 of IDEA-20260802-002
    are components, not the lens: the Semaev system is the already-scoped
    presentation being measured, and the isogeny graph is only the census
    of the class. Shared instrument, one paragraph. new_falls, d_ff, and
    d_lf_obs are IDEA-20260916-4b7c1e. The question's readings are O1, O2,
    and O3 in RQ-DREG-c8ae8d. D_max is one integer, identical for every
    curve, frozen before the run, at least one degree past the generator
    degree. S_4 is omitted on a curve whose S_4 matrix at that cap does
    not finish, and the omission is recorded as unmeasured rather than as
    a high degree. The gauge orbit of one j (several u, one curve, model
    y^2 = x^3 + u^4 a x + u^6 b) is subtracted before any class difference
    is called an isogeny effect.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260916-4b7c1e
      provenance: internal
      claim: >-
        Defines falls(D), new_falls(D), d_ff, and d_lf^obs, and states that
        d_ff is exact with no gaps while the largest observed fall is only
        a certified lower bound. This proposal uses that instrument across
        one isogeny class and does not redefine it. d_lf_obs here is that
        d_lf^obs.
      verified_by: idea-generator, lines 1-200 read 2026-09-22
    - ref: RQ-DREG-c8ae8d
      provenance: internal
      claim: >-
        States outcomes O1, O2, and O3 and forbids reading an unfinished
        Gröbner run as a high degree of regularity.
      verified_by: idea-generator, full file read 2026-09-22
    - ref: IDEA-20260806-c5d183
      provenance: internal
      claim: >-
        Coordinate-dependent is the trichotomy class in which the tracked
        object is a function of the representation rather than of the group
        element.
      verified_by: idea-generator, lines 1-70 read 2026-09-22
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        R1 is a field representation of coordinates. The named stage here
        is relation decomposition.
      verified_by: idea-generator, title and scope opening read 2026-09-22
    - ref: RQ-ICINV-475b5e
      provenance: internal
      claim: >-
        Parent question on whether any attack-cost functional varies inside
        an F_p-isogeny class. Cited, not restated.
      verified_by: idea-generator, title read 2026-09-22
    - ref: RQ-DREG-bd6c86
      provenance: internal
      claim: >-
        Parent question on how the solving degree of one Semaev system
        grows with the descent parameters. Cited, not restated.
      verified_by: idea-generator, title read 2026-09-22
    - ref: RQ-VOLC-f6253b
      provenance: internal
      claim: >-
        Parent question on whether volcano depth changes an attack cost.
        Cited, not restated. Volcano level is a covariate here.
      verified_by: idea-generator, title read 2026-09-22
    - ref: RQ-ECTD-001
      provenance: internal
      claim: >-
        Parent question on a Teske-style rare endpoint. Cited, not restated.
      verified_by: idea-generator, title read 2026-09-22
    - ref: Petit-Quisquater first-fall-degree assumption
      provenance: recalled
      claim: >-
        The assumption that the solving degree stays near the first fall
        degree, as named in IDEA-20260916-4b7c1e. H1 of this record is not
        that assumption. The paper was not opened.
  assumptions:
    - >-
      F2 (Semaev decomposition) is a component, not the lens. The factor
      base is the already-scoped rule frozen as an input. No new factor
      base is proposed.
    - >-
      F3 (isogeny path) is a component, not the lens. Edges are used to
      certify that the vertex set is one class.
    - >-
      IDEA-20260807-427cf3 is not assumed. A profile that varies at matched
      factor-base cardinality is admissible and would contradict that claim
      on the tested class.
    - p > 3, short Weierstrass, ordinary, one frozen monomial order.
    - >-
      Neighbor edges used in an O3 reading have degree coprime to the group
      order. Otherwise the edge is not used for transport language.
  proof_search_map:
    bottleneck: >-
      The uncomputable Bardet-Faugère-Salvy degree of regularity, and any
      F4 run that does not finish. The quantity actually computed is the
      capped fall profile.
    baseline_embedding:
      parameter_slice: >-
        The single-curve fall profile of IDEA-20260916-4b7c1e, reproduced
        on one curve of the class before the census is compared.
      reproduction_check: >-
        On that one curve, falls(D) recomputed as the dimension of the
        low-degree part of the rowspace equals rank(M_D) minus the rank
        on the degree-exactly-D columns, at every completed D.
    observation_collision:
      observable: the new_falls vector up to D_max
      distinct_preimage_search: >-
        Two distinct j-invariants in the class, or one j and a second
        Weierstrass model in its gauge orbit, carrying the same vector.
        A collision across j is O1 or the off-locus part of O2. A
        collision only inside the gauge orbit, with a different vector
        on another j, is a real presentation difference.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fiber of curves in one class with a given new_falls vector,
          restricted to matrices that finish by D_max.
        predicted_gain: >-
          Separates a class-constant profile from a locus-only change and
          from an off-locus bounded-versus-rising pair. No ECDLP exponent
          gain.
    quantifier_order: >-
      For all curves E in one census-complete toy class, for all degrees
      D from the generator degree through D_max at which the matrix
      finishes with no gaps, the new_falls vector is defined. O1 is for
      all such E, the vector equals the gauge-orbit vector. O2 is for all
      off-locus E, the vectors agree, and there exists a locus curve whose
      vector differs. O3 is there exists an off-locus E and there exists
      a distance-1 neighbor E' such that d_lf_obs(E) = d_ff(E) and
      d_lf_obs(E') >= d_ff(E') + 1. Incomplete cells sit outside all three
      quantifiers.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy-tier statement about this proxy on the tested classes. Not
        a degree of regularity, not a solving degree above the cap, and
        not an ECDLP algorithm.
      nearby_object_control: >-
        The gauge orbit of one j in the class, and one non-isogenous
        curve of the same order at the same p if one is available. A
        profile gap that appears inside the gauge orbit is a coordinate
        artifact.
    proof_obligations:
      - claim: >-
          d_ff and d_lf_obs are read only from completed ranks with no
          gaps, and an unfinished matrix is excluded from O1, O2, and O3.
        responsibility: correctness
    not_applicable_reason: null
  predictions:
    - metric: class_fall_profile_reading
      direction: different
      minimum_effect: >-
        On one census-complete toy class the completed curves receive
        exactly one label. O1: every completed curve has d_lf_obs = d_ff
        and the same new_falls vector as the gauge orbit of one j. O2:
        the vectors differ only on the named locus, and the lower bound
        on that locus differs by at least 1 from the off-locus value.
        O3: some off-locus curve has d_lf_obs = d_ff while a distance-1
        neighbor has d_lf_obs >= d_ff + 1. Any unfinished matrix is a
        fourth label, unmeasured, and is not one of those three.
    - metric: gauge_orbit_new_falls_hamming
      direction: lower
      minimum_effect: >-
        At least four distinct u in F_p* give Hamming distance 0 between
        new_falls vectors. A positive distance means the meter sees the
        model, and no class reading is reported until that distance is
        subtracted.
  minimal_test:
    design: >-
      Enumerate one ordinary F_p-isogeny class at a prime small enough
      that the census and every S_3 matrix at the frozen D_max finish.
      The enumerator and its completeness certificate belong to the later
      protocol; a census without a recorded certificate does not support
      a universal quantifier over the class. Rebuild S_3 from each (a, b).
      Add S_4 only where that same cap finishes. Compute new_falls(D) at
      every degree from the generator degree through D_max. Assign O1, O2,
      O3, or unmeasured from the pre-registered rule. Run the gauge orbit
      of one j in the same batch.
    controls:
      - Gauge orbit of one j, at least four models.
      - >-
        One support-matched random coefficient system with the same
        monomial support as S_3, not labelled as a curve.
      - The single-curve identity check against IDEA-20260916-4b7c1e.
      - >-
        Matched factor-base cardinality across the class, so a profile
        change is not quietly a change in factor-base size.
    required_metrics:
      - new_falls vector per completed curve
      - d_ff and d_lf_obs per completed curve
      - count of unfinished cells, excluded from the three readings
      - gauge-orbit Hamming distance
      - which reading was assigned
  falsification_conditions:
    - >-
      The rank identity fails on the fixture curve. The instrument is
      void and no O-reading is issued.
    - >-
      The gauge-orbit Hamming distance is positive. Class variation is
      not interpretable on that run.
    - >-
      Every completed curve has d_lf_obs = d_ff and one common vector.
      That is O1, a completed measurement, and it falsifies "there is a
      low-degree outlier in this class".
    - >-
      An O3 label is issued from an unfinished neighbor matrix. That
      label is withdrawn. A timeout is not an explosion.
  confounders:
    - Unfinished matrices read as high degree.
    - Gauge change of (a, b) read as an isogeny change.
    - Factor-base cardinality changing with the model.
    - Monomial order changed between curves.
    - S_4 on some curves and S_3 on others compared as one profile.
    - An ell-edge whose degree shares a factor with the group order.
  interpretation_limits:
    - >-
      KN-OPEN-020: this idea proposes no new factor base. It measures an
      existing bounded-degree Semaev presentation. The factor base, if
      the frozen rule uses one, is an input.
    - Claim tier is toy. No transfer to a cryptographic curve.
    - >-
      d_lf_obs is not the last-fall degree, not the solving degree, and
      not the Bardet-Faugère-Salvy degree of regularity. A flat profile
      does not prove the solving degree is small above the cap.
    - >-
      ECDLP time exponent stays 1/2. An O3 curve would still have to beat
      Pollard rho after the walk to that curve is charged. This proposal
      does not charge that walk. Charging it is future work under O3,
      and only after IDEA-20260922-f7de2a accepts the cell.
    - O1 and O2 are complete results. They are not failures to find an attack.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On this Semaev family, inside the frozen cap, d_lf_obs tracks
        whether the solving degree is growing: d_lf_obs > d_ff when a new
        consequence appears at a degree a finished degree-by-degree
        elimination must pass, and d_lf_obs = d_ff when no such growth is
        seen inside the cap. This is not the Petit-Quisquater
        first-fall-degree assumption. A flat profile does not prove the
        solving degree is small above the cap.
      rigorous_support: >-
        none; this is the hypothesis under test. It imitates the Macaulay
        fact that a fall at D is a polynomial consequence derived at
        degree D, which is the rank identity in IDEA-20260916-4b7c1e, and
        it does not imitate a theorem equating the capped profile with
        the solving degree.
      validation_plan: >-
        On one toy curve whose degree-by-degree elimination finishes at
        some D* <= D_max, compare the highest degree that elimination
        uses with d_lf_obs. A disagreement of 1 or more falsifies H1 on
        that curve. Separately recompute the rank identity at every
        completed degree of that curve. Parameters: one enumerated toy
        class, p small enough that the census and the cap finish, recorded
        by the later protocol. No extrapolation to cryptographic p. Tail
        check: new_falls(D) = 0 on (d_ff, D_max] is not written down as
        new_falls(D) = 0 for D > D_max.
  target_complexity:
    time_exponent: >-
      N^{1/2} for the ECDLP, the Pollard rho exponent. No improvement
      is claimed.
    memory_exponent: >-
      O(1) for rho. The meter stores one degree-capped Macaulay matrix
      per degree per curve.
    best_known: >-
      Pollard rho, time N^{1/2}, memory O(1), for the ECDLP. For the
      meter, the cost of one degree-capped rank profile.
    hidden_overhead: >-
      A toy outlier still has to beat rho after the walk is charged.
      This proposal does not do that charging. Nothing asymptotic is
      hidden in an o(1) term because no attack exponent is claimed.
    tradeoff_note: >-
      The meter is a per-degree exact rank, parallel across curves.
      It is not a van Oorschot-Wiener time-memory tradeoff and it does
      not change the rho attack.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  dominated_by: >-
    As an ECDLP attack, Pollard rho dominates on time (N^{1/2}), memory
    (O(1)), and queries (one instance). Checked as an instrument against
    the proposals named in discriminated_from, which were opened this
    session: none of them certifies a last-fall lower bound inside a
    degree cap while refusing timeouts as evidence. On that axis this
    meter is undominated. It was not checked against every published
    ECDLP algorithm; the attack axis does not need that check because
    rho already dominates and no attack is claimed.
  sota_delta: >-
    ECDLP time-exponent delta 0 (remains 1/2). ECDLP memory-exponent
    delta 0. Query delta 0. Meter cost is one capped rank profile per
    curve, which is not an improvement on rho.
  discriminated_from: >-
    IDEA-20260731-016 screens a class with full algebraic meters and a
    rare-endpoint threshold; its bit lengths are far above a capped
    rank, and a timeout there is a named confound. This meter is
    degree-capped and an unfinished cell is unmeasured.
    IDEA-20260807-427cf3 claims the Macaulay rank profile is determined
    by factor-base size alone. This census can falsify that on one
    class and does not assume it.
    IDEA-20260807-8b9486 locates the (a, b) vanishing locus of the
    support. This record measures the fall profile, including off that
    locus.
    IDEA-20260807-6eb96b is the gauge-orbit null. It is a control here,
    not a new proposal.
    IDEA-20260807-f6137c argues a true degree-of-regularity meter has no
    ground truth. Agreed. This record does not compute the
    Bardet-Faugère-Salvy degree of regularity.
    IDEA-20260807-899c5e separates the degree of the reduced basis from
    the degree the computation reached. This record reports the fall
    profile, not that output degree.
    IDEA-20260826-2259f8 replaces a flat d_reg = 2 reading with the
    first fall. This record keeps every later fall inside the cap, so
    a rising lower bound is visible.
    IDEA-20260903-47f358 searches for a lower first fall inside a class.
    This record adds the explosion contrast: a classmate that stays at
    the first fall while a neighbor's lower bound rises.
    IDEA-20260916-4b7c1e defines the instrument. This record applies it
    to every curve of one class.
    IDEA-20260901-2fb77b counts rational ell-isogeny fibrations by
    volcano depth. Different object. Depth is a covariate, not the
    observable.
    RQ-ICINV-475b5e, RQ-DREG-bd6c86, RQ-VOLC-f6253b, and RQ-ECTD-001
    are parent questions and are not restated as claims.
