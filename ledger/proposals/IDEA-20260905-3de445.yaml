  assumptions:
  - Learned clauses are read from the solver's proof trace (LRAT/DRAT addition lines) with inprocessing disabled;
    the block map is computed from the encoder's variable table.
  - The direct ANF system is used for D_elim; the symmetrized presentation is a second arm.
  - Memory contract on the Macaulay build with abort-before-allocation; aborted cells give lower bounds on D_elim.
  proof_search_map:
    bottleneck: Whether any consequence of the pdp system that omits a block is derivable cheaply - by resolution
      (bounded width) or by Macaulay (bounded degree). If yes, a block-ordered search prunes above the leaves and
      the exponent moves; if no, the ceiling has an algebraic reason.
    baseline_embedding:
      parameter_slice: 'l = 3, m = 3: the elimination ideal I intersect F_2[blocks 1,2] is computable exactly by
        brute force (enumerate the 64 pairs, find those extending to a solution, compute the vanishing ideal''s
        minimal generators), and D_elim is computable at every D up to 9 = ml.'
      reproduction_check: 'Frozen fixture: at l = 3 the brute-force elimination ideal''s minimal degree equals the
        degree of the first block-supported element found in the Macaulay row space at D = ml; the block-support
        histogram of a cadical proof at l = 3 is compared with the brute-force count of possible narrow clauses.'
    observation_collision:
      observable: The block-support histogram and D_elim(m-1, e).
      distinct_preimage_search: PREDICTED COLLISION with the N0 null of b40e6d on both observables; the non-collision
        searched for is a real instance with a narrow learned clause or a lower D_elim than the null - the localising
        outcome.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: Track block support of every derived clause, more than the final leaf count requires, because
        support is what survives resolution and what a block-ordered search could exploit.
      predicted_gain: Converts "learning does nothing" into "learning derives no narrow-support clause", with the
        offending clause exhibitable.
    - transform: representation_reduction
      proposed_object: Replace the CDCL question by the exact algebraic condition "row space at degree D meets the
        block-(1..k) monomial subspace in degree <= e", decidable by rank with a kernel-projection step.
      predicted_gain: Solver-free at every l the Macaulay contract reaches; transfer declared unmet for orders that
        are not block orders.
    quantifier_order: 'CLAIMED: FORALL cells, seeds, solvers in the boundary, the count of learned clauses with
      non-full support and length < ml - l is 0 (witness independent of instance); and FORALL e <= 3, D_elim(m-1,
      e) exceeds the tested D. NOT CLAIMED: any statement at untested D or l; the record forbids reading "no narrow
      clause at l <= 8" as a bound.'
    method_ceiling:
      strongest_certifiable_claim: 'Toy-tier: zero narrow learned clauses on the tested proofs; D_elim lower bounds
        at l <= 6; identical behaviour on the null. It cannot certify that no derivation exists at higher width
        or degree.'
      nearby_object_control: 'KNOWN-FALSE OBJECT: the system plus l redundant linear equations c_{1,j} = c_{2,j},
        on which narrow clauses (support {1,2}, length 2) must be learned within the first 2^{l} conflicts and D_elim(2,
        1) must be 1. If the instrument reports full support there, it is blind and reports nothing.'
    proof_obligations:
    - claim: Support is monotone under resolution, so the histogram propagates.
      responsibility: correctness
    - claim: The block map of every variable is correct (checked against the encoder table).
      responsibility: interface
    - claim: D_elim is computed by exact rank with the kernel-projection step validated at l = 3.
      responsibility: correctness
    - claim: The known-false object produces narrow clauses and D_elim = 1.
      responsibility: feasibility
    - claim: Nothing transfers beyond tested l, D, solvers and orders.
      responsibility: scope
    not_applicable_reason: null
  predictions:
  - metric: UNSAT narrow_clause_count = learned clauses with support omitting a block and length < ml - l, m = 3,
      l in {4..8}, cadical and kissat
    direction: lower
    minimum_effect: Exactly 0 at every cell. A single narrow clause falsifies (A) and is exhibited by name with
      its derivation depth.
  - metric: UNSAT full_support_fraction = learned clauses with support [m] / all learned clauses
    direction: higher
    minimum_effect: '>= 0.99.'
  - metric: SAT narrow_clause_count on planted instances (search stops early)
    direction: lower
    minimum_effect: 0; reported separately because the SAT-side proof is a prefix.
  - metric: D_elim(m-1, e) for e in {1,2,3}, l in {3,4,5,6}, direct system
    direction: higher
    minimum_effect: Above the tested D at l >= 4 (lower bound reported); at l = 3 equal to the brute-force value.
  - metric: known_false narrow_clause_count and D_elim(2,1) on the redundant-linear object
    direction: higher
    minimum_effect: '>= 2^{l-1} narrow clauses and D_elim(2,1) = 1; otherwise instrument failure.'
  - metric: null_agreement = both observables on N0 versus real, per cell
    direction: different
    minimum_effect: Identical (0 narrow clauses, same D_elim bound); a real-only narrow clause or lower D_elim is
      the localising outcome.
  minimal_test:
    design: STAGE 0 (zero compute). Commit the block map, the brute-force elimination ideal at l = 3, and the D_elim
      fixture. STAGE 1 (instrument). Parse cadical/kissat proof traces at l = 3 into the histogram; validate the
      kernel-projection rank step against brute force; run the known-false object. STAGE 2. m = 3, l in {4..8},
      n in {3l-1, 4l}, 10 UNSAT and 10 planted instances, >= 3 seeds, two solvers; histogram per run; D_elim at
      l <= 6 under the memory contract. STAGE 3. N0 and N1 nulls at l in {4,5,6}; prime-field arm at m = 2, s in
      {3..6}, p = 65537 (digit blocks as blocks). STAGE 4. Report counts, D_elim table, and any exhibited narrow
      clause with its Macaulay membership degree.
    controls:
    - SHAPE-MATCHED RANDOM NULL (N0, N1 of IDEA-20260904-b40e6d).
    - PLANTED-SATISFIABLE INSTANCES with certificate re-verification.
    - KNOWN-FALSE OBJECT (l redundant cross-block linear relations) on which narrow clauses must appear.
    - BRUTE-FORCE ELIMINATION IDEAL at l = 3 as the exact oracle.
    - PREPROCESSING CONTROL (inprocessing disabled, verified).
    required_metrics:
    - block_support_histogram (by support set and clause length)
    - narrow_clause_count, full_support_fraction
    - D_elim(k, e) or lower bound, Ncols, rank engine, peak_rss_mb, aborted_flag
    - instrumented_leaf_count, solver_conflicts
    - certificate_verified (SAT arm), termination_reason
    - l, m, n, s, p, seed, curve_id, target_kind, null_tier, solver_version
  falsification_conditions:
  - 'F1. A narrow learned clause on a real instance: (A) is false; the clause, its polynomial and its Macaulay membership
    degree are the deliverable and a propagator using it is the next proposal.'
  - 'F2. D_elim(m-1, e) within the tested D at l >= 4: a low-degree elimination element is derivable; exhibited,
    and the search order that uses it is costed.'
  - 'F3. The known-false object shows no narrow clauses: instrument failure; no result.'
  - 'F4. Real and null differ on either observable: localising outcome, run the b40e6d ladder.'
  - 'F5 (pre-registered negative). Both predictions holding: the closure is recorded with D_elim lower bounds as
    the measured obstruction and the resource_check asking which theory reads a high elimination degree as an asset.'
  confounders:
  - Clause minimisation and vivification change learned-clause length without changing support; support, not length,
    is primary.
  - XOR-cut auxiliaries inherit full support conservatively; a narrow clause hidden behind an auxiliary would be
    missed - the direct model without cuts is run as a second encoding.
  - D_elim is presentation-dependent; direct and symmetrized arms are not pooled.
  - Aborted Macaulay cells give only lower bounds and are labelled.
  interpretation_limits:
  - CLAIM TIER toy; l <= 8 (proofs), l <= 6 (Macaulay).
  - Zero narrow clauses on tested solvers is not a proof that none is derivable; D_elim lower bounds are bounds,
    not values.
  - No exponent is moved; sota_delta on attack cost is zero.
  heuristic_assumptions:
  - id: H1
    statement: NARROW-CLAUSE ABSENCE. Under the block core order, a CDCL solver on an UNSAT pdp instance learns
      no clause of length < ml - l whose support omits a block, uniformly over n in [3l-1, 4l].
    rigorous_support: 'RIGOROUS HALF: every F-set clause has full support (equation (6)); conflict analysis produces
      clauses containing at least one literal of the conflicting F-set clause''s reason chain. IMITATED LAW: Ben-Sasson-Wigderson
      - a system with no narrow refutation has only wide derived clauses; the assumption is that the pdp system,
      like a random system of its shape, has resolution width close to ml.'
    validation_plan: 'SAMPLE proof traces at l in {4..8}; SHORTCUT: capped-depth subcube proofs at l = 9, 10; COMPARE
      with the null; TAIL: the single narrowest non-full-support clause, exhibited.'
  - id: H2
    statement: ELIMINATION-DEGREE GROWTH. D_elim(m-1, e) grows at least linearly in l for every fixed e <= 3.
    rigorous_support: 'RIGOROUS HALF: the row space at degree D is spanned by multiples of generators of degree
      >= 2, so D_elim >= first fall; existence of degree-1 elimination elements is a dimension count. IMITATED LAW:
      semi-regularity of the generic system, under which nothing of low degree appears before the degree of regularity.'
    validation_plan: 'Exact ranks at l in {3..6}; COMPARE with the semi-regular degree and with e1e38b''s first
      fall on the prime-field arm; TAIL: the smallest D at which any block-supported element of any degree appears.'
  target_complexity:
    time_exponent: NO EXPONENT IMPROVED. If (A) and (B) hold, the search stays at ml - log2 m! bits and the enumeration
      bound (m-1)l bits (96c4f3) remains the poly-memory floor; Pollard rho 0.886 N^{1/2} dominates. If (B) fails
      with D_elim small, a block-ordered search prunes at depth (m-1)l and the exponent would drop toward (m-1)l
      - that is the conditional stake, prior <= 0.05.
    memory_exponent: Proof traces 2^{ml}/m! clauses; Macaulay at Ncols(ml, D) columns under a 4 GiB contract; both
      reported as peak RSS.
    best_known: Enumeration at 2^{(m-1)l}/(m-1)!; Groebner (reported); rho.
    hidden_overhead: Proof parsing (linear), the Macaulay build, and the kernel-projection rank step (an extra elimination
      per degree).
    tradeoff_note: None proposed; a positive result would name a propagator, not a tradeoff.
  estimated_cost:
    implementation: low
    compute: medium
    basis: Proof parsing ~150 lines on top of the shared encoder; cadical/kissat present; Macaulay engine exists
      (EXP-DREG-001); the projection step ~100 lines. Compute dominated by l = 8 proofs and l = 6 Macaulay.
  recommended_priority: high
  dominated_by: 'CHECKED ROW BY ROW: dominated as an algorithm by the (m-1)-fold enumeration, MITM, and Pollard
    rho / VW; Groebner F4 (reported), generic CDCL, crossbred and hybrid (fc5e3e, da1428) produce no elimination-degree
    measurement. As a mechanism record: n/a (no result claimed).'
  sota_delta: 'Zero on attack axes. Deliverables: the exact count (predicted 0) of narrow learned clauses on tested
    proofs, and the D_elim table with lower bounds - the first measurement in the program of the algebraic quantity
    whose smallness would give above-leaf pruning.'
