idea:
  id: IDEA-20260807-8cdc79
  question_id: RQ-CLGP-b99df5
  added: '2026-08-07'
  title: >-
    THE KN-TECH-081 TWO-STAGE DISCIPLINE TRANSFERRED TO THE ORDINARY
    PRIME-FIELD SETTING, WHERE IT COLLAPSES: for an imaginary quadratic order
    the unit group has Dirichlet rank ZERO, so the log-unit lattice is the zero
    lattice and stage 2 (shorten the generator) is VACUOUS -- PIP equals
    SG-PIP and both are subexponential -- so no L10 mechanism may rest on "the
    principal ideal problem is hard"; the operative stage-2 ANALOGUE is
    relation-lattice CVP, which prices ACTION EVALUATION and not vectorization,
    and neither stage sits on the ECDLP side of the missing bridge
  class: composition

  claim: >-
    (A) WHAT KN-TECH-081 ACTUALLY DEMANDS. Its single most transferable
    instruction is that a proposal resting on "PIP is hard" must say WHICH
    STAGE it means: stage 1, find some generator of a principal ideal; stage 2,
    shorten it by decoding the log-unit lattice. The commutative cyclotomic
    history is unambiguous that these break at different times, and that
    Soliloquy died at stage 2. This record applies that discipline, without
    exception, to the ordinary prime-field setting of lane L10.

    (B) THE TRANSFER, AND THE COLLAPSE. Here the ring is O, an order in an
    IMAGINARY QUADRATIC field K = Q(sqrt(t^2 - 4p)). By Dirichlet's unit
    theorem the rank of O_K^* is r_1 + r_2 - 1 = 0 + 1 - 1 = 0. The unit group
    is therefore FINITE: {+-1} for disc < -4, order 4 for disc -4, order 6 for
    disc -3, and {+-1} for every non-maximal order of conductor f > 1 except
    the small exceptional cases. Consequences, stated sharply:
      (B1) THE LOG-UNIT LATTICE IS THE ZERO LATTICE. There is nothing to
           decode. Given one generator g of a principal ideal, every other
           generator is ug with u in a group of size at most 6, so the
           SHORTEST generator is found by trying at most 6 candidates.
      (B2) STAGE 2 IS VACUOUS. PIP and SG-PIP coincide in this setting. The
           distinction KN-TECH-081 exists to preserve is REAL in the
           cyclotomic and quaternion settings and is EMPTY here, and saying so
           is the transfer's first result.
      (B3) STAGE 1 IS SUBEXPONENTIAL, NOT HARD. Computing the class group and
           solving PIP in an imaginary quadratic order is done by index
           calculus on ideals: Hafner-McCurley give expected time
           L_{|D|}(1/2, sqrt(2) + o(1)) (Las Vegas; GRH-conditional
           refinements give exponent 3/sqrt(8)). So neither stage is a source
           of hardness.
    NET: NO MECHANISM IN LANE L10 MAY REST ON "PIP IS HARD". That is a
    prohibition this record establishes and hands to the rest of the campaign,
    and it is cheap, checkable, and permanent.

    (C) WHERE THE HARDNESS ACTUALLY LIVES -- THE OPERATIVE STAGE-2 ANALOGUE.
    The two-stage shape does transfer, but to a different pair of problems:
      STAGE 1' (structure): compute Cl(O) and express a target class in terms
        of a chosen generating set of small split primes l_1, ..., l_n.
        Subexponential (Hafner-McCurley).
      STAGE 2' (shortening): given the class as an exponent vector, find a
        SHORT equivalent vector by decoding the RELATION LATTICE
        L = {e in Z^n : prod l_i^{e_i} = 1 in Cl(O)}. This is a CVP instance,
        and it is exactly the step CSI-FiSh performed for the CSIDH-512 order
        (KN-LIT-3339). It is what makes the group action EVALUABLE in
        polynomial time for an arbitrary class.
    So the true analogue of "shorten the generator" is "shorten the exponent
    vector", and the lattice being decoded is the RELATION lattice, not the
    unit lattice. This is the substantive content of the transfer.

    (D) THE DECISIVE OBSERVATION FOR L10, AND IT IS A NEGATIVE. Stage 1' and
    stage 2' both control the cost of EVALUATING the action a |-> [a] * E.
    NEITHER controls the cost of INVERTING it, which is vectorization, and
    which stays at ~sqrt(h) (KN-TECH-027) even when Cl(O)'s structure and a
    reduced relation lattice are fully known -- indeed CSI-FiSh publishes that
    structure and the scheme's security rests on vectorization remaining hard
    with it in hand. Therefore:
      (D1) Making the action cheap does not make the torsor invertible. The
           group side being fully solved and the torsor side remaining hard is
           the sharpest available demonstration of the group/torsor
           distinction, and it is empirical rather than conjectural: a
           published computation exists on one side and no attack followed on
           the other.
      (D2) Neither stage sits on the ECDLP side of the bridge. Stage 1'
           operates on ideals, stage 2' on an integer lattice; neither
           consumes or produces a point of E, so neither can be the missing
           bridge map that IDEA-20260807-5d7606 and IDEA-20260807-bbdcf3 show
           to be absent.
    NET: the KN-TECH-081 discipline, correctly applied, tells L10 where NOT to
    look, and that is its value here.

    (E) THE ONE PLACE IT COULD STILL BITE, NAMED SO IT IS NOT LOST. Stage 2'
    is a lattice problem in dimension n (the number of small primes used), and
    its difficulty grows with n. If a class-group route to ECDLP ever existed,
    stage 2' would be on its critical path, because the route would have to
    EVALUATE the action to test candidate classes. So the honest forward
    guidance is: stage 2' is a cost multiplier on any future L10 attack, never
    a source of one. Recording the multiplier now is cheaper than rediscovering
    it later.

  resource_label: >-
    R3 (End(E) as a ring: ideals, principality, unit group, class group
    structure and the relation lattice). R4 appears only as the setting the
    evaluated action lives in.
  admissibility: admissible
  admissibility_argument: >-
    Admissible: unit rank, principality, and relation lattices are properties
    of the RING O and are entirely invisible to a generic group oracle for G.
    No step applies an endomorphism to a point of G, so H-ENDO-001's scalar
    collapse does not apply and neither closed oracle class of KN-FIND-b7e091
    is used. The proposal then reaches a negative for a reason unrelated to
    admissibility: both stages are on the curve/ideal side of a bridge that
    does not exist.

  discriminated_from:
    - >-
      KN-TECH-081 itself, which is about NON-COMMUTATIVE PIP -- rank-1
      quaternion orders (assumed hard, the SoliloQuat assumption KN-LIT-7647)
      and rank >= 2 matrix rings M_g(O) (heuristic polynomial, KN-LIT-7641).
      This record transfers only the DISCIPLINE (which stage?) to a
      commutative rank-0-unit setting and reports that the discipline's
      distinction is empty there. It asserts nothing about the quaternion
      rows and explicitly does not touch KN-OPEN-024.
    - >-
      KN-TECH-046, the commutative cyclotomic structured-lattice line, where
      the unit rank is LARGE and stage 2 is the whole game. The contrast with
      rank 0 here is the point, not a duplication.
    - >-
      IDEA-20260807-0fafe8, which uses Hafner-McCurley in an a fortiori
      argument about ORACLES. This record uses it to classify the two stages
      by difficulty. Same citation, different use, and the two records agree.
    - >-
      KN-TECH-027, which records CSIDH's costs but not the two-stage
      decomposition of the underlying ideal arithmetic.

  object_first_candidate:
    tracked_object: >-
      THE PAIR (unit group O^*, relation lattice L) attached to the
      endomorphism ring, followed as the conductor f and the small-prime
      generating set vary. Concretely: the rank of O^* (always 0) and the
      successive minima of L.
    lossiness: >-
      LOSSY: it forgets the curve, the points, the class group elements
      themselves, and every algorithm, retaining only a rank and a lattice
      shape. The discarding is compatible with the target's operations because
      the two-stage discipline's entire content is which of those two objects
      obstructs -- so the retained part determines the propagation of
      "is this stage hard" under changes of the ring. It is not a change of
      coordinates: a whole family of hardness questions collapses onto the
      unit rank plus lambda_1(L).
    propagation: >-
      One-step propagation is defined and measurable. Under an isogeny step
      that stays on the crater, O is unchanged and both components are
      unchanged. Under a step that changes volcano level, O changes by the
      conductor and the propagation is given explicitly: the unit rank stays
      0 (a theorem, for every imaginary quadratic order), and L changes by the
      computable relation between Cl(O) and Cl(O_K). So the object propagates
      deterministically and its rank component is CONSTANT everywhere -- which
      is the collapse.
    survival_score: >-
      The rank-0 component survives EVERY ordinary prime-field instance
      without exception, because it is a theorem about imaginary quadratic
      fields. It dies only on leaving that setting: real quadratic (rank 1,
      the regulator appears), cyclotomic (rank ~n/2, KN-TECH-046), quaternion
      (KN-TECH-081's middle row). Naming exactly where it dies is what makes
      this a transfer rather than a slogan.

  mechanism: >-
    STEP 1 (zero compute, symbolic, HARD GATE). State and check the rank
    computation: r_1 = 0, r_2 = 1, rank = 0; enumerate the finite unit groups
    by discriminant (order 6 at -3, order 4 at -4, order 2 otherwise; order 2
    for every f > 1 except the exceptional small cases). Conclude (B1), (B2).
    If any toy instance produces a unit group of rank > 0, the implementation
    is wrong, since the theorem admits no exceptions.

    STEP 2 (toy compute). Instrument stage 1 directly: for toy discriminants,
    (a) generate principal ideals by multiplying a random element's ideal,
    (b) recover a generator by the standard reduction of the corresponding
    binary quadratic form to the principal form, (c) enumerate all generators
    and confirm the count equals |O^*|. Metric: the number of distinct
    generators per principal ideal. PREDICTED: exactly |O^*| in {2, 4, 6}.
    This is the empirical face of stage-2 vacuity and it is nearly free.

    STEP 3 (toy compute). Build the relation lattice: choose n small split
    primes; compute Cl(O) structure at toy scale by direct enumeration of
    reduced forms; build L as the kernel of Z^n -> Cl(O); reduce L (LLL is
    sufficient at these dimensions); measure lambda_1, the covering radius
    estimate, and the CVP cost for random targets.

    STEP 4 (toy compute, THE COST SPLIT -- this is the discriminating
    measurement). On the same toy classes, measure in identical units
    (action evaluations, and separately wall clock):
      (M1) cost of EVALUATING [a] * E for a uniformly random class a, WITH the
           reduced relation lattice available (stage 2' used);
      (M2) the same WITHOUT it (naive: factor the ideal, walk with the raw
           exponent vector);
      (M3) cost of INVERTING the action -- vectorization by kangaroo/MITM on
           the Cayley graph -- WITH the reduced lattice available;
      (M4) the same WITHOUT it.
    PREDICTED: M1 << M2 by a large and growing factor (stage 2' matters a lot
    for evaluation); M3 ~ M4 within noise, and both ~ sqrt(h) (stage 2'
    matters not at all for inversion). THAT CONTRAST IS THE RESULT. It is a
    two-by-two design with a pre-registered pattern, and any of the four cells
    coming out differently is informative.

    STEP 5 (zero compute). Write the prohibition (B3-net) and the forward
    guidance (E) into the lane's record so later proposals cannot re-import
    "PIP is hard".

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Repository greps on 2026-08-07 over ledger/, knowledge/, docs/,
      analysis/: "principal ideal|PIP|SG-PIP"; "unit group|Dirichlet|log-unit";
      "relation lattice|CSI-FiSh|CVP"; "Hafner|McCurley". Full reads:
      KN-TECH-081, KN-TECH-027, KN-FIND-5c1a03. One external web check on the
      Hafner-McCurley complexity statement.
    results: >-
      KN-TECH-081 is the only record stating the two-stage discipline; it
      covers commutative cyclotomic (via KN-TECH-046) and non-commutative
      settings and explicitly says "Does NOT bear on the ECDLP". No record
      anywhere applies the discipline to an ORDINARY prime-field endomorphism
      ring, and no record observes the rank-0 collapse. "Hafner"/"McCurley":
      ZERO hits in knowledge/ -- the class-group index-calculus line is absent
      from this corpus. CSI-FiSh is present as KN-LIT-3339 (read) with
      KN-TECH-051, KN-LIT-4784, KN-LIT-6380 adjacent, but the relation lattice
      is nowhere described as the operative stage-2 analogue.
    verdict: >-
      ADAPTATION. Dirichlet's unit theorem, Hafner-McCurley, and the CSI-FiSh
      relation-lattice computation are all published and none is claimed as
      new. New to this corpus: the explicit transfer of KN-TECH-081's
      discipline into the ordinary prime-field setting, the observation that
      the distinction it protects is EMPTY there because the unit rank is 0,
      the identification of the relation lattice as the operative stage-2
      analogue, and the two-by-two evaluation-versus-inversion cost design
      that makes the claim measurable. KN-TECH-081's own statement that it
      does not bear on the ECDLP is CONFIRMED rather than contradicted by this
      record, and the record says so.

  null_object_control: >-
    MANDATORY AND BLOCKING, and it is a POSITIVE control because the predicted
    result in cells M3/M4 is a null. Matched object of the same shape: a
    REAL quadratic order of comparable discriminant size, where the unit rank
    is 1 and the regulator is nontrivial. Run Step 2's generator-counting
    pipeline there. It MUST report infinitely many generators (in practice: a
    generator family growing with the fundamental unit's powers, so the
    measured count blows past |O^*| immediately). A pipeline that reports a
    finite bounded generator count in the real quadratic case cannot detect a
    nonzero unit rank at all, so its rank-0 finding on imaginary quadratic
    orders is vacuous and the run set is INVALID rather than negative.
    SECOND NULL, for Step 4: a SHUFFLED relation lattice -- replace L by a
    random lattice of the same dimension and determinant. Cell M1 must
    DEGRADE to roughly M2 with the shuffled lattice (the speedup is a property
    of L, not of having any lattice), while M3 must be unchanged.
    DECAY PARAMETER: n, the number of small primes generating the lattice. The
    M1-versus-M2 gap must GROW with n (larger n gives shorter vectors and
    cheaper walks); a gap that fails to grow with n means the measurement is
    reading implementation overhead rather than lattice quality, which is the
    canonical artifact tell.

  assumptions:
    - >-
      O is an order in an imaginary quadratic field. This is automatic for
      ORDINARY curves over F_p (t^2 < 4p) and fails for supersingular curves
      over F_p where End_{F_p} can be an order in an imaginary quadratic field
      too but End_{Fbar_p} is a quaternion order. The record is scoped to the
      ordinary case and says so; the supersingular case is KN-TECH-081's
      territory and is untouched.
    - >-
      Hafner-McCurley is quoted for the complexity of class-group computation
      and PIP in imaginary quadratic orders. It is not implemented here; toy
      instances are solved by direct enumeration of reduced forms, which is
      exponential but trivial at these sizes, and the record never presents
      enumeration timings as evidence about the subexponential algorithm.
    - >-
      CSI-FiSh (KN-LIT-3339) is cited for the fact that the CSIDH-512 class
      group structure and relation lattice were computed, and that
      vectorization is still relied on for security afterwards. The record
      does not reproduce that computation and marks the claim as REPORTED
      from the corpus entry rather than independently verified here.
    - >-
      "Vectorization stays at ~sqrt(h) with the relation lattice known" is a
      FIELD ASSUMPTION (it is what CSI-FiSh's security rests on), not a
      theorem. It is what cells M3/M4 test at toy scale, and it is labelled
      conditional wherever it is used.

  proof_search_map:
    bottleneck: >-
      Step 4's cell M3-versus-M4 comparison: whether knowledge of the reduced
      relation lattice measurably assists INVERSION. Everything else is either
      a theorem (rank 0) or a citation. If M3 is materially below M4, the
      lane's central assumption is wrong and this becomes an attack proposal
      rather than a prohibition.
    baseline_embedding:
      parameter_slice: >-
        n = 1 (a single generating prime, so the relation lattice is
        one-dimensional and stage 2' is trivial). The evaluation cost must
        then reduce to the naive walk length, i.e. M1 = M2 exactly. If the
        two-by-two design does not degenerate correctly at n = 1, the
        instrument is measuring something other than lattice quality.
      reproduction_check: >-
        Frozen fixture: one toy class with h = 256, n = 1, seeds fixed; assert
        M1 = M2 to within measurement granularity, and assert M3 = M4 within
        10 percent. Both must hold before the n-sweep is run.
    observation_collision:
      observable: >-
        The measured cost ratio M3/M4 -- does the relation lattice help
        inversion?
      distinct_preimage_search: >-
        REQUIRED. Find two settings with the same M3/M4 ratio but very
        different lattice quality (very different lambda_1). Predicted:
        abundant collisions, i.e. M3/M4 ~ 1 across the whole range of lattice
        quality, which establishes that the observable is INSENSITIVE to the
        lattice and therefore that the lattice is not on the inversion path.
        The collision is the desired outcome and its absence -- a monotone
        dependence of M3/M4 on lambda_1 -- would be the finding.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "is PIP hard here" by "what is the rank of O^*", which is
          answered by Dirichlet with no computation at all.
        predicted_gain: >-
          Eliminates an entire class of proposals at zero cost. This is the
          record's main deliverable: a permanent, checkable prohibition.
      - transform: stronger_invariant
        proposed_object: >-
          Replace the single number lambda_1(L) by the full successive-minima
          profile of the relation lattice, and correlate the profile with
          both M1 and M3.
        predicted_gain: >-
          A curve rather than a point; it can show that evaluation cost
          tracks the profile while inversion cost does not, which is a much
          stronger separation than two scalars.
    quantifier_order: >-
      WHAT IS ASSERTED UNCONDITIONALLY: FORALL orders O in an imaginary
      quadratic field, THERE EXISTS a finite group U with |U| <= 6 such that
      FORALL principal ideals I of O and FORALL generators g, g' of I, THERE
      EXISTS u in U with g' = u g. (Dirichlet, rank 0.) Note the quantifier on
      U comes BEFORE the ideal -- the unit group is a property of the ring,
      not of the ideal -- which is precisely what makes stage 2 vacuous
      uniformly rather than instance by instance.
      WHAT IS ASSERTED CONDITIONALLY (on the field assumption): FORALL toy
      classes and FORALL relation lattices L, the inversion cost is
      independent of L up to noise. This is measured, not proved.
      NOT CLAIMED: that PIP is easy in any non-commutative setting; that
      vectorization is hard (that is assumed, and labelled); that the ECDLP is
      hard.
    method_ceiling:
      strongest_certifiable_claim: >-
        "In the ordinary prime-field setting, the PIP/SG-PIP distinction is
        empty and neither stage is a source of hardness; the relation lattice
        prices action EVALUATION and, at toy scale, does not price
        INVERSION." It can NEVER certify anything about quaternion orders,
        about cyclotomic fields, about vectorization at cryptographic size, or
        about the ECDLP itself.
      nearby_object_control: >-
        THE REAL QUADRATIC ORDER (unit rank 1) and, at one remove, the
        cyclotomic setting of KN-TECH-046 (unit rank ~n/2). There the desired
        conclusion FAILS -- stage 2 is not vacuous -- which proves the
        argument is using the rank and not merely restating "commutative
        things are easy".
    proof_obligations:
      - claim: >-
          rank(O^*) = 0 for every order in an imaginary quadratic field.
        responsibility: correctness
      - claim: >-
          Hence at most 6 generators per principal ideal, so SG-PIP reduces to
          PIP with O(1) overhead.
        responsibility: correctness
      - claim: >-
          Stage 1 (PIP / class group) is L_{|D|}(1/2) by Hafner-McCurley.
        responsibility: runtime
        status: 'cited, not reproduced'
      - claim: >-
          The relation lattice reduces action-evaluation cost measurably.
        responsibility: runtime
      - claim: >-
          The relation lattice does NOT reduce inversion cost.
        responsibility: baseline
        status: 'measured at toy scale, conditional'
      - claim: >-
          The real-quadratic control exhibits a nonzero unit rank in the same
          pipeline.
        responsibility: soundness

  predictions:
    - metric: >-
        number of distinct generators of a principal ideal in a toy imaginary
        quadratic order
      direction: lower
      minimum_effect: >-
        Exactly |O^*| in {2, 4, 6}, on 100 percent of tested ideals, matching
        the discriminant. Any ideal with more falsifies the rank computation
        and halts the line.
    - metric: >-
        M1/M2, the action-evaluation cost ratio with versus without the
        reduced relation lattice, as a function of n
      direction: lower
      minimum_effect: >-
        Below 0.5 at n >= 8 and DECREASING in n. A ratio that does not
        decrease with n means the measurement reads overhead, not lattice
        quality, and the design must be fixed before anything is reported.
    - metric: >-
        M3/M4, the vectorization cost ratio with versus without the reduced
        relation lattice
      direction: different
      minimum_effect: >-
        In [0.8, 1.25] at every n and every h on the ladder. A ratio below
        0.5 that persists is a genuine finding about torsor inversion and is
        escalated for independent review; it would also convert this record
        from a prohibition into an attack lead.
    - metric: >-
        generator count in the REAL quadratic control
      direction: higher
      minimum_effect: >-
        Unbounded (in practice above 100 within the search bound). A finite
        small count means the pipeline cannot see a nonzero unit rank and
        every rank-0 finding is void.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): the rank computation and the
      prohibition. Free, and it is the whole first deliverable.
      STAGE 1 (minutes): generator counting on toy imaginary quadratic orders,
      plus the real-quadratic control.
      STAGE 2 (hours): build Cl(O) and the relation lattice for toy classes
      with h in {64, 256, 1024, 4096}; sweep n in {1, 4, 8, 16}; record the
      successive-minima profile.
      STAGE 3 (hours, THE DISCRIMINATOR): the two-by-two design M1-M4, in
      action evaluations, with the shuffled-lattice null.
      STAGE 4 (zero compute): write the prohibition and the forward guidance.
    controls:
      - >-
        real quadratic order (unit rank 1) -- the pipeline MUST see a nonzero
        rank there
      - >-
        shuffled relation lattice of matched dimension and determinant -- M1
        must degrade, M3 must not change
      - >-
        n = 1 degeneracy check (M1 = M2 exactly)
      - >-
        vectorization baseline fitted against sqrt(h) before any ratio is
        computed
    required_metrics:
      - generator counts per principal ideal, by discriminant
      - relation-lattice dimension, determinant, and full successive-minima
        profile
      - M1, M2, M3, M4 in action evaluations, per (h, n), with seeds
      - the same on the shuffled-lattice null
      - real-quadratic control generator counts

  falsification_conditions:
    - >-
      M3/M4 falls below 0.5 persistently. Knowledge of the relation lattice
      assists INVERSION; the group/torsor separation is weaker than assumed;
      escalate for independent review and reclassify this record as an attack
      lead rather than a prohibition.
    - >-
      Any toy imaginary quadratic order exhibits a principal ideal with more
      than 6 generators. Contradicts Dirichlet; halt and debug, and do not
      report as mathematics until independently replicated.
    - >-
      The real-quadratic control shows a bounded generator count. Instrument
      blind; run set INVALID rather than negative.
    - >-
      M1/M2 does not decrease with n. The lattice-quality measurement is
      reading overhead; the evaluation half of the claim is unsupported and
      must be withdrawn, though the rank-0 prohibition survives untouched.

  confounders:
    - >-
      UNIT-GROUP EXCEPTIONS. Discriminants -3 and -4 have units of order 6 and
      4. Toy ladders overweight small discriminants, so these appear far more
      often than at crypto scale. Report the discriminant with every generator
      count and never average across them.
    - >-
      NON-MAXIMAL ORDERS. For conductor f > 1 the unit group is {+-1} even at
      D_K = -3 or -4, and h(O) follows the conductor formula rather than
      h(O_K). A pipeline that silently uses O_K in place of O will produce
      wrong class numbers and wrong lattices.
    - >-
      LATTICE REDUCTION QUALITY. LLL versus BKZ versus exact CVP give
      different M1 values. The reduction algorithm and its parameters are
      frozen before Stage 3 and reported with every number, or M1/M2 measures
      the reduction library rather than the mathematics.
    - >-
      UNIT MISMATCH. "Action evaluations" must be counted with a fixed
      generator set; comparing M1 (few large steps) against M2 (many small
      steps) in wall clock instead of evaluations would produce a spurious
      speedup from implementation detail.
    - >-
      TOY h IS SMALL. At h = 64 the relation lattice is nearly trivial and
      stage 2' has almost nothing to do. The ladder must reach h >= 1024
      before the n-sweep is interpreted.

  interpretation_limits:
    - >-
      This record establishes a PROHIBITION for lane L10 (no mechanism may
      rest on "PIP is hard") and a COST ATTRIBUTION (relation lattice prices
      evaluation, not inversion). It is not an attack and claims no speedup.
    - >-
      It asserts NOTHING about the non-commutative rows of KN-TECH-081.
      KN-OPEN-024 remains exactly as open as it was, and reading this record
      as bearing on quaternion PIP would be precisely the conflation
      KN-TECH-081 exists to prevent.
    - >-
      QUANTUM: PIP in commutative orders is quantum-polynomial
      (KN-TECH-046 line), which if anything strengthens (B3) -- neither stage
      is hard, classically OR quantumly. That remark concerns the CLASS GROUP
      and not the ECDLP, and the campaign is classical; no quantum claim is
      made.
    - >-
      Toy scale for everything measured. h in the thousands is not the
      CSIDH-512 class group, and the M3/M4 null at toy scale is a calibration
      of a field assumption, never a validation of it at cryptographic size.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The unit group of any order in an imaginary quadratic field is finite
        of order at most 6.
      rigorous_support: >-
        NOT A HEURISTIC -- Dirichlet's unit theorem with r_1 = 0, r_2 = 1
        gives rank 0, and the torsion is the group of roots of unity in K,
        which for imaginary quadratic K is {+-1} except at D_K = -3, -4.
        Listed as H1 only so that the toy pipeline is required to reproduce it
        rather than assume it.
      validation_plan: >-
        Exhaustive generator counting on every toy discriminant in the ladder,
        compared against the predicted |O^*| by discriminant; plus the
        real-quadratic control to show the counter CAN exceed 6. Comparison
        distribution: a delta at |O^*|, not a spread. Tail check: the maximum
        generator count observed across all instances must equal 6 and be
        attained only at D = -3. LABELLED TOY SCALE for the implementation,
        though the underlying statement is a theorem at all scales.
    - id: H2
      statement: >-
        For a uniformly random class in Cl(O), the shortest exponent vector
        over n small split primes has infinity-norm concentrated near
        (h)^{1/n} up to the lattice's reduction quality, so the
        action-evaluation cost with a reduced relation lattice scales like
        n * h^{1/n} rather than like the naive walk length.
      rigorous_support: >-
        Combines the rigorous Minkowski bound on the relation lattice (det L =
        h, dimension n, so lambda_1 <= sqrt(n) h^{1/n}) with the classical
        Gaussian-heuristic expectation that a random target's CVP distance
        tracks the covering radius. The Minkowski half is rigorous; the
        concentration half is the heuristic and it imitates the standard
        random-lattice model.
      validation_plan: >-
        Sample 10^3 uniform classes per (h, n) cell; measure the infinity-norm
        of the decoded exponent vector; compare the empirical distribution
        against the Gaussian-heuristic prediction for a random lattice of the
        same determinant and dimension; tail checks on the largest observed
        norm versus the covering-radius bound. LABELLED TOY SCALE; toy h and
        small n are not the CSIDH regime and the record does not extrapolate.

  reachability_gate: >-
    T5 IS ADDRESSED DIRECTLY AND THIS RECORD IS WHERE ITS COST IS SET. Stage
    2' is exactly the machinery that determines what "one step" costs on the
    Cayley graph, and hence how expensive the T5 dichotomy's two sides are:
    reaching a UNIFORMLY RANDOM curve is O(log p) small-prime steps
    (GRH-conditional rapid mixing) and needs no lattice; reaching a SPECIFIED
    curve given its class needs the relation lattice to turn the class into a
    short walk, and reaching a specified curve NOT given its class is
    vectorization at ~sqrt(h). So this record supplies the per-step cost that
    every other L10 proposal's reachability accounting multiplies by, and cell
    M1 is precisely that number measured. It does not itself need to reach any
    specified curve, so it passes the gate at the cost of one lattice
    reduction per class.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT CLAIMED. The record's quantities are: stage 1 at
      L_{|D|}(1/2, sqrt2 + o(1)) (cited, per-class, superpolynomial); stage 2'
      at CVP in dimension n, polynomial for the n used in practice after an
      LLL/BKZ preprocessing whose cost is charged separately; action
      evaluation at n * h^{1/n} small-prime steps under H2; and inversion
      UNCHANGED at ~sqrt(h) = p^{1/4} action evaluations.
    memory_exponent: >-
      Stage 2' stores the reduced basis of L, i.e. O(n^2) integers -- entirely
      negligible. Stage 1 at crypto scale stores a relation matrix whose size
      is the dominant memory cost of the index calculus and is
      subexponential; it is cited, not run.
    best_known: >-
      Class group / PIP in imaginary quadratic orders: L_{|D|}(1/2, sqrt2 +
      o(1)) (Hafner-McCurley 1989), with GRH-conditional exponent 3/sqrt(8).
      Relation-lattice reduction for a CSIDH-sized order: performed in
      CSI-FiSh (KN-LIT-3339). Vectorization: ~sqrt(h) classical (KN-TECH-027).
      ECDLP: 0.886 sqrt(N) (KN-TECH-001, KN-TECH-006). This record improves
      none of them.
    hidden_overhead: >-
      Two disclosures. First, the L(1/2) in stage 1 is SUPERPOLYNOMIAL and is
      a per-class precomputation; quoting a downstream route as "polynomial
      once the class group is known" hides it, and this record refuses to.
      Second, the h^{1/n} in H2 hides the reduction quality of L: a poorly
      reduced lattice gives exponent-vector norms far above the Minkowski
      bound, so the "polynomial evaluation" claim is contingent on a
      successful reduction that is itself charged.
    tradeoff_note: >-
      Larger n gives shorter exponent vectors and cheaper walks at the cost of
      a larger lattice to reduce and more isogeny formulas to implement -- a
      genuine tradeoff, measured by the n-sweep. It is a tradeoff in the
      ACTION-EVALUATION cost only and does not touch the inversion exponent,
      which is the record's point.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES on both relevant frontiers.
    As an ECDLP attack: mounts none, so dominated by parallel rho (0.886
    sqrt(N), O(1) memory, KN-TECH-001/KN-TECH-006), BSGS (sqrt(N)/sqrt(N)),
    automorphism-discounted rho (KN-TECH-018) and kangaroo on a known
    interval. As a class-group computation: dominated on time by
    Hafner-McCurley at L_{|D|}(1/2) -- the toy pipeline uses exhaustive
    enumeration of reduced forms, which is exponential and is used only
    because it is exact and trivial at 32 bits. As a relation-lattice
    computation: dominated by the published CSI-FiSh computation
    (KN-LIT-3339), which was carried out at a discriminant this campaign
    cannot approach. dominated_by is NOT null on any of the three.
  sota_delta: >-
    Zero speedup against any baseline, on every frontier checked. The delta is
    a prohibition plus a cost attribution, stated quantitatively: (i) SG-PIP
    reduces to PIP with an overhead factor of at most 6 (the unit group order)
    in this setting, versus the exponential-in-rank log-unit decoding that
    stage 2 costs in the cyclotomic setting of KN-TECH-046 -- so the "hard
    stage" of the commutative structured-lattice line has overhead 6 here;
    (ii) the relation lattice is predicted to cut action-evaluation cost by a
    factor above 2 at n >= 8 and growing in n, while cutting inversion cost by
    a factor in [0.8, 1.25], i.e. not at all.

