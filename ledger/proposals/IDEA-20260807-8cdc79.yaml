  recommended_priority: medium

  honest_prior_of_survival: >-
    1.0 that the rank-0 collapse holds -- it is Dirichlet's theorem, and the
    only risk is implementation. 0.9 that the generator counting and the
    real-quadratic control both behave as predicted. 0.75 that the M1/M2
    evaluation speedup is cleanly measurable at toy h (small h leaves stage 2'
    little to do). 0.9 that M3/M4 shows no inversion benefit. Priority is
