idea:
  id: IDEA-20260807-a2fb45
  question_id: RQ-MTGT-2cabee
  added: '2026-08-07'
  title: >-
    CLOSURE WITH A NAMED OBSTRUCTION -- THE PREPROCESSING FRONTIER IS AN
    ISOGENY-CLASS INVARIANT: the achievable (S, T) set of any advice-based DLP
    algorithm is the same on every member of an F_p-isogeny class up to an
    additive O(L*ell^3) field-operation term, by a two-way simulation, so the
    optimisation "find the classmate on which preprocessing is cheapest" -- the
    ONLY route by which L13 could ever produce a single-instance attack -- is
    VACUOUS, and any L13 proposal whose payoff is a better (S, T) on one curve is
    inadmissible on its face
  class: mechanism

  claim: >-
    (A) THE FUNCTIONAL BEING CLOSED, DEFINED PRECISELY SO THE CLOSURE HAS EDGES.
    For a curve E with distinguished point P generating a prime-order subgroup G
    of order N, define
        F(E, P) := { (S, T) : there is an algorithm that, given S bits of advice
                     depending only on (E, P), solves Q = [k]P in T online group
                     operations with success probability >= 2/3 }.
    F is the ACHIEVABLE PREPROCESSING FRONTIER of the instance. Corrigan-Gibbs--
    Kogan bound it from below by S*T^2 = Omega~(N) (KN-LIT-013, KN-TECH-005) and
    Bernstein-Lange realise a point on it at S = T = N^{1/3}. The only way lane
    L13 could ever produce an attack on a single deployed curve is if F VARIED
    across the isogeny class, so that an attacker could preprocess on the
    cheapest classmate and transport. This record closes that.

    (B) THE CLOSURE, AS A TWO-WAY SIMULATION. Let E, E' be F_p-isogenous with a
    path of length L and maximum step degree ell, gcd(deg, N) = 1. Let phi be the
    composite, phi-hat its dual, and write delta := 2*c_eval + C_build/(queries)
    for the transport overhead, where c_eval <= 6*L*ell field operations per
    point (Velu; KN-LIT-780) and C_build = O(L*ell^3) is paid once.
      DIRECTION 1. Given advice a of size S achieving online time T on (E, P),
      the SAME STRING a achieves online time T + delta on (E', phi(P)): on input
      (E', phi(P), Q'), apply phi-hat to P' and Q', obtaining an instance on E
      with the same k by T1, then run the E-algorithm with advice a. Correctness
      is T1; the extra cost is two isogeny evaluations.
      DIRECTION 2. Symmetric, using phi in place of phi-hat.
      HENCE  F(E, P) + (0, delta)  subset  F(E', phi(P))  and conversely, so
        F(E, P) = F(E', phi(P))  UP TO AN ADDITIVE delta IN THE TIME COORDINATE
        AND EXACTLY IN THE ADVICE COORDINATE.
      THE NAMED OBSTRUCTION: THE PREPROCESSING FRONTIER IS AN ISOGENY-CLASS
      INVARIANT. Its advice axis is invariant EXACTLY, with no additive slack at
      all, because the same advice string is reused verbatim.

    (C) WHAT THE CLOSURE FORBIDS, STATED SO IT IS USABLE. It forbids every
    proposal of the following shape: "search the isogeny class for a curve E*
    on which preprocessing is cheaper, preprocess there, and transport." The
    minimum of F over the class equals F at every member, so the search returns
    the curve you started on. In particular it forbids: a class-wide search for a
    smaller table; a class-wide search for a faster online phase; a class-wide
    search for a better time-memory point; and any claim that the class-minimum
    of a preprocessing cost is below the class-maximum by more than delta. It
    also gives lane L13 its honest prior: the lane's remaining content is
    ACCOUNTING ACROSS CURVES (IDEA-20260807-a127ab, IDEA-20260807-406fef), not
    OPTIMISATION WITHIN THE CLASS.

    (D) WHAT THE CLOSURE DOES NOT REACH -- THE FORWARD GUIDANCE, WHICH IS THE
    PART THAT MAKES THIS A CLOSURE AND NOT A FATIGUE REPORT
    (docs/inventor-protocol.md section 4). Four classes remain open and they are
    named with the reason the simulation fails on each:
      OPEN-1. NON-GROUP-LEVEL PREPROCESSING. F is defined over algorithms that
        access G as a group. Preprocessing whose cost depends on the CURVE
        EQUATION -- Semaev relation collection, factor-base construction,
        Groebner solving degree -- is not a functional of (G, P) and the
        simulation says nothing about it, because Direction 1 would have to
        translate an E-factor-base into an E'-factor-base and the shape
        invariants do not transport (IDEA-20260807-e0ddc6, Class II/III). THIS
        IS LANE L1's TARGET (RQ-ICINV-475b5e) AND THE CLOSURE HANDS IT OVER
        RATHER THAN ABSORBING IT.
      OPEN-2. ADVICE SIZE VERSUS ADVICE ENCODING. The advice axis is invariant
        because the same STRING is reused. But the number of BITS needed to
        write a table may depend on the curve: a curve with a small j-invariant,
        a small CM discriminant, or a sparse Weierstrass model might admit a
        shorter encoding of the same table. That is a compression question about
        the representation, not about the group, and the simulation does not
        touch it. Predicted to be worth O(1) bits per entry at most, but it is
        genuinely open and is the one micro-lane this closure leaves inside L13.
      OPEN-3. NON-NEGLIGIBLE delta. The closure is up to an additive delta, and
        delta is negligible only when ell is polylog and L is short. A class
        whose members are connected only by large-degree isogenies would have a
        non-negligible delta; whether such a class exists for cryptographic
        parameters is not settled here. Related: the reachability gate below.
      OPEN-4. NON-CLASSICAL MODELS. Quantum path-finding in an ordinary class is
        subexponential, and a quantum preprocessing frontier is a different
        functional. Nothing here applies.

    (E) WHY THIS RECORD'S ADMISSIBILITY VERDICT IS THE NEGATIVE ONE. The
    admissibility filter of DECOMPOSITION.md section 2 closes a lane whose only
    use of phi is to apply it to points of G. Direction 1 and Direction 2 do
    exactly and only that. So THE SINGLE-INSTANCE READING OF L13 IS
    INADMISSIBLE, and this record's verdict is inadmissible_generic_group -- not
    because the argument is weak but because the argument PROVES the filter's
    verdict for this functional. A generic adversary handed one group can
    simulate the "other curve" by relabelling, and gains nothing. Recording the
    inadmissibility as a derived theorem rather than as a screening opinion is
    the deliverable.

  resource_label: >-
    R8 and R4 nominally (the functional is a preprocessing functional and the map
    is an isogeny), but the finding is that NEITHER RESOURCE DELIVERS ANYTHING
    for this functional: R4's action on G is a relabelling and R8's advice axis
    is invariant under it. The honest label is therefore "R8/R4, closed".

  admissibility: inadmissible_generic_group

  admissibility_argument: >-
    The closure argument IS the inadmissibility argument, which is why the two
    coincide here. F(E, P) is a functional of the abstract advice-augmented
    group. phi|_G is an efficiently computable group isomorphism, so a
    generic-group adversary against (E', phi(P)) is simulable by a generic-group
    adversary against (E, P) with the identical advice string and two extra
    isogeny evaluations, and conversely. Every use of phi in the argument is an
    application of phi to points of G, which is precisely the pattern the section
    2 filter closes, and KN-FIND-b7e091's Oracle D closure (endomorphism images
    are computable from Q alone) is the same phenomenon one step down. The
    inadmissibility verdict is therefore not a screening judgement but a
    consequence: for THIS functional, on ONE instance, the isogeny class is
    generic-group information. What is NOT closed is the M-instance accounting
    (IDEA-20260807-a127ab, IDEA-20260807-406fef), where the resource is the
    identification BETWEEN encodings rather than the action WITHIN one, and those
    records are correspondingly labelled admissible. The two verdicts are
    consistent and their boundary is exactly the number of instances.

  discriminated_from:
    - >-
      IDEA-20260807-5cabfc (L2) -- closes cost functionals that factor through
      the abstract triple (G, P, Q), for VERTICAL isogenies, using the fact that
      depth lives in E[ell^infinity]. This record closes the PREPROCESSING
      frontier, for ANY isogeny in the class, using a two-way SIMULATION with an
      explicit additive overhead. The functionals differ (a set of achievable
      (S, T) pairs is not a number), the maps differ (any isogeny, not only
      vertical), and this record's argument carries a cost term that 5cabfc's
      does not need. Where they overlap they agree.
    - >-
      H-ENDO-001 -- every ENDOMORPHISM acts on G as a scalar. That is the
      one-curve statement. This record is the two-curve statement for a
      functional rather than for a lattice, and it does not restate H-ENDO-001's
      index-pinning argument.
    - >-
      KN-FIND-b7e091 -- closes the incidence and endomorphism-image ORACLES by
      exhibiting simulators. This record closes a FUNCTIONAL by exhibiting a
      two-way algorithm translation. Same genre, different object, and this
      record's translation carries a cost that the oracle simulators do not.
    - >-
      Lane L1 (RQ-ICINV-475b5e) -- asks whether NON-group-level cost functionals
      (Semaev solving degree, relation yield) vary across the class. This record
      explicitly does NOT answer that and hands it over as OPEN-1. That handover
      is load-bearing: a closure that quietly absorbed L1's question would be
      overclaiming.

  object_first_candidate:
    tracked_object: >-
      THE ACHIEVABLE FRONTIER F(E, P) ITSELF -- a SET of (S, T) pairs, tracked as
      the curve moves along the isogeny graph.
    lossiness: >-
      LOSSY: every algorithm, every advice encoding, every constant and every
      implementation collapses into the boundary of a region in the (S, T) plane.
      The curve equation, the j-invariant and the endomorphism ring are all
      forgotten.
    propagation: >-
      LOSSY-PROJECTION TEST, RUN AND PASSED. What F discards -- the algorithm's
      internals and the curve's field-level data -- is discarded compatibly with
      the operation "move along an isogeny", because the two-way simulation
      rebuilds any achieving algorithm on the neighbour from the same advice.
      The retained part therefore propagates deterministically, and it propagates
      TRIVIALLY: F(E') = F(E) + (0, delta). A projection whose propagation is the
      identity is the strongest possible form of the test being passed and the
      weakest possible form of the object being useful -- which is exactly what a
      closure looks like, and saying so is the point.
    survival_score: >-
      F survives every isogeny in the class, unboundedly, with only the additive
      delta accumulating. It dies at gcd(deg, N) != 1 and at any change of field.
      Its uselessness for attack is not a survival failure; it is the finding.

  mechanism: >-
    STEP 1 -- WRITE THE SIMULATION OUT IN FULL, BOTH DIRECTIONS, WITH THE COST
    TERM EXPLICIT. This is a proof obligation, not a measurement, and it is done
    before any compute. Include the case where phi is a composite of L steps and
    the case where the dual is used.
    STEP 2 -- IDENTIFY EXACTLY WHERE THE SIMULATION BREAKS. For each of OPEN-1
    through OPEN-4, exhibit the specific step of Direction 1 that fails and why.
    A closure whose author cannot say where its own argument stops is a fatigue
    report.
    STEP 3 -- THE NEARBY-OBJECT CONTROL, WHICH IS BLOCKING. Apply the identical
    argument to a functional that is NOT group-level -- the m = 3 Semaev
    decomposition yield over an x-box factor base, measured by harness/semaev.py.
    THE ARGUMENT MUST FAIL TO APPLY. If the same reasoning appears to prove that
    Semaev yield is a class invariant, the argument is too strong and is wrong,
    because L1's whole premise is that such functionals might vary. This control
    is the cheapest possible falsification of the closure and it costs nothing.
    STEP 4 -- MEASURE delta AT TOY SCALE. Construct explicit paths in enumerable
    toy classes, count the field operations of two-point transport, and confirm
    delta is small relative to a measured single-target online phase. This does
    not test the closure (which is a theorem) but it tests whether the closure's
    "up to delta" qualifier is doing hidden work.
    STEP 5 -- EMPIRICAL CONSISTENCY, WHICH IS A CHECK AND NOT A PROOF. Measure a
    concrete (S, T) point -- table size and online walk length for a
    Bernstein-Lange-style store -- on EVERY member of an enumerable toy class,
    with matched seeds. Predicted: zero variance beyond the harness's own
    run-to-run spread. Non-zero structured variance would contradict the closure
    and require the argument to be re-examined before the measurement is trusted.
    STEP 6 -- WRITE THE FORWARD-GUIDANCE PARAGRAPH of (D) into a form the
    coordinator can route: OPEN-1 to L1, OPEN-2 stays in L13, OPEN-3 to the
    reachability work, OPEN-4 out of campaign scope.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Run 2026-08-07. Commands:
      (1) grep -rin "class invariant\|isogeny.class.invarian" analysis/ ledger/ knowledge/
      (2) grep -rin "two-way simulation\|simulator" knowledge/findings/ ledger/
      (3) read of DECOMPOSITION.md T1/T2/T3 and section 2
      (4) read of IDEA-20260807-5cabfc claim (A)-(C)
      (5) grep -rin "achievable frontier\|(S, T)" ledger/proposals/
    results: >-
      (1) DECOMPOSITION.md T3 already states the general principle ("if an
      attack-cost functional C(E) is provably constant on the isogeny class, this
      axis is closed for that functional -- with a named obstruction"). This
      record is the L13 instance of T3, applied to the PREPROCESSING frontier
      specifically, which no record instantiates.
      (2) KN-FIND-b7e091 gives oracle simulators; no record gives an
      algorithm-translation simulation between curves.
      (4) IDEA-20260807-5cabfc closes single-number functionals for vertical
      isogenies; the preprocessing frontier as a SET, and the additive cost term,
      are not in it.
      (5) Zero records define an achievable (S, T) set for a curve.
    verdict: >-
      ADAPTATION. The mechanism is DECOMPOSITION.md's own T3 applied to a
      specific functional, and the simulation is two lines of T1. Nothing
      mathematical is new. What is new is that the closure is stated for the
      exact functional L13 would need to vary, with its additive cost term
      explicit and its four open classes named -- which is what turns a screening
      opinion into a closure at the inventor-protocol standard.

  null_object_control: >-
    MANDATORY AND BLOCKING, AND IT IS THE NEARBY-OBJECT CONTROL OF STEP 3: apply
    the identical closure argument to the m = 3 Semaev decomposition yield and
    Groebner solving-degree proxy over a fixed x-box factor base -- a functional
    that is explicitly NOT group-level and that lane L1 exists to test. THE
    ARGUMENT MUST FAIL. If it appears to succeed, the argument proves too much
    and is void.
    SECOND NULL, EMPIRICAL: measure the concrete (S, T) point on every member of
    an enumerable toy class against a matched set of curves of the SAME ORDER N
    drawn from DIFFERENT classes. Within-class variance must be indistinguishable
    from within-curve seed noise; between-class variance is unconstrained by this
    record and serves as the scale against which "zero" is read.
    DECAY PARAMETER: the number of class members enumerated, m. The measured
    within-class variance of (S, T) must NOT grow with m beyond seed noise. A
    variance that grows with m means the "invariant" is only invariant on the
    members that were looked at first, which is the canonical artifact tell in
    its class-enumeration form.

  assumptions:
    - >-
      gcd(deg phi, N) = 1 throughout. Stated because it is the exact hypothesis
      of T1 and the exact place the closure fails (the degree-N quotient E -> E/G
      annihilates the instance rather than transporting it).
    - >-
      The advice string is reused VERBATIM in Direction 1. This is what makes the
      advice axis exactly invariant with no additive slack, and it is worth
      isolating because it is a stronger statement than the time axis enjoys.
    - >-
      c_eval <= 6*L*ell field operations per point (Velu, relayed from
      KN-LIT-780, a bulk-seeded entry marked "not verified here") and
      C_build = O(L*ell^3) in the ordinary F_p setting (relayed from
      research/JMV004_branch_a_scouting_20260726.md, explicitly SCOUTING and not
      evidence). Both are conservative; better constants strengthen the closure.
    - >-
      F is defined with respect to algorithms that access G through the group
      law. Extending F to algorithms that read the curve equation is exactly
      OPEN-1 and is not assumed away.
    - >-
      Toy-scale measurements in Steps 4-5 are consistency checks on a theorem,
      not evidence for it. A theorem is not confirmed by a toy run and the record
      does not present it as such.

  proof_search_map:
    bottleneck: >-
      The additive term delta. The closure is exact on the advice axis and
      approximate on the time axis, and every objection to it will attack delta:
      is C_build really amortisable, is c_eval really O(ell) per point, and is
      delta really o(T). This is the single step on which the closure's strength
      turns.
    baseline_embedding:
      parameter_slice: >-
        L = 0, phi = identity. The simulation must degenerate to "the same
        algorithm with the same advice", delta = 0, F(E) = F(E).
      reproduction_check: >-
        Trivial but required: the toy pipeline must report delta = 0 and identical
        (S, T) for the identity map. A pipeline that reports nonzero delta at
        L = 0 is measuring its own overhead and every delta figure it produces is
        inflated by that amount.
    observation_collision:
      observable: >-
        "Zero within-class variance of the measured (S, T) point."
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, WHICH IS WHY THE SECOND NULL IS
        BLOCKING: a measurement pipeline that is INSENSITIVE to the curve -- for
        instance one whose table-building code depends only on N and the seed --
        also produces zero within-class variance, for a reason that has nothing
        to do with isogenies. The disambiguator is the between-class arm: the
        pipeline must show NONZERO variance across curves of the same order in
        DIFFERENT classes if it is to be credited with detecting anything.
        Reporting zero within-class variance without the between-class arm is
        prohibited by this record.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "the cheapest curve in the class to preprocess on" by "the
          achievable frontier of the abstract advice-augmented group", which is
          the same for all of them.
        predicted_gain: >-
          Eliminates an entire optimisation lane at zero compute. The gain is in
          SEARCH COST SAVED, not in attack cost; the attack delta is zero and is
          reported as zero.
      - transform: stronger_invariant
        proposed_object: >-
          The frontier as a SET rather than a single achievable point, so that
          the closure covers every time-memory tradeoff at once rather than one
          operating point.
        predicted_gain: >-
          Closes the whole (S, T) plane in one argument instead of closing
          S = T = N^{1/3} and leaving other operating points open.
    quantifier_order: >-
      INTENDED: FORALL F_p-isogeny classes C, FORALL E, E' in C with a path of
      length L and max degree ell, FORALL (S, T) in F(E, P), it holds that
      (S, T + delta(L, ell)) is in F(E', phi(P)), and symmetrically.
      The DANGEROUS weaker reading, NOT claimed: FORALL E, E' EXISTS some pair of
      operating points that match -- which would be satisfied trivially and would
      not close the optimisation. The audit obligation is that (S, T) is
      quantified universally and delta depends only on the path, not on the
      algorithm or on the instance.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The achievable advice/online-time frontier for group-law algorithms is
        constant on an F_p-isogeny class, exactly on the advice axis and up to
        an additive delta = O(L*ell^3) field operations on the time axis." It can
        NEVER certify anything about algorithms that read the curve equation
        (OPEN-1), about advice ENCODING length (OPEN-2), about classes requiring
        large-degree steps (OPEN-3), or about quantum models (OPEN-4). Any
        summary dropping "for group-law algorithms" is overclaiming under
        AGENTS.md rule 4.
      nearby_object_control: >-
        The Semaev decomposition yield and Groebner solving-degree proxy, per
        Step 3. The argument MUST fail there. This control is what distinguishes
        a closure from a slogan and it is blocking.
    proof_obligations:
      - claim: Direction 1 is correct (the pulled-back instance has the same k).
        responsibility: correctness
      - claim: Direction 2 is correct.
        responsibility: correctness
      - claim: delta depends only on (L, ell) and not on the algorithm or the advice.
        responsibility: runtime
      - claim: The advice axis is invariant with no additive slack.
        responsibility: correctness
      - claim: The argument FAILS on the Semaev nearby object.
        responsibility: soundness
      - claim: Each of OPEN-1..OPEN-4 names the exact step where the simulation breaks.
        responsibility: scope
      - claim: The measurement pipeline shows nonzero between-class variance.
        responsibility: baseline

  predictions:
    - metric: within-class variance of the measured (S, T) operating point
      direction: lower
      minimum_effect: >-
        Indistinguishable from within-curve seed noise on every enumerable toy
        class, at every class size m. Structured nonzero variance contradicts the
        closure and must be investigated as a measurement artifact BEFORE it is
        read as a mathematical result.
    - metric: between-class variance of the same operating point
      direction: higher
      minimum_effect: >-
        Detectably nonzero, or the pipeline is curve-insensitive and its zero
        within-class result means nothing. This is the observation-collision
        disambiguator and it is a pass/fail gate on the whole measurement.
    - metric: delta measured at L = 0 (identity map)
      direction: lower
      minimum_effect: EXACTLY zero. Nonzero means the pipeline is charging its own overhead as transport.
    - metric: >-
        applicability of the closure argument to the Semaev decomposition yield
      direction: different
      minimum_effect: >-
        MUST FAIL. A written argument that appears to extend to Semaev yield is a
        falsification of this record, not a strengthening of it, and the record
        is superseded rather than amended.
    - metric: measured delta / measured online phase T
      direction: lower
      minimum_effect: >-
        Reported per cell. At toy scale delta/T will be LARGE (the transport cost
        does not shrink while T does), and that must be reported as a scale
        artifact rather than as a weakness of the closure, whose delta is
        asymptotically o(T) for ell = polylog(p).

  minimal_test:
    design: >-
      STAGE 0 (zero compute, AND IT IS THE WHOLE RESULT): Steps 1 and 2 -- the
      two-way simulation written out, with the exact break point named for each
      of OPEN-1..OPEN-4. A closure is a written argument; if it does not survive
      review at this stage there is nothing to run.
      STAGE 1 (zero compute, HARD GATE): Step 3, the nearby-object control. Apply
      the argument to Semaev yield and confirm it fails. Costs nothing and is the
      cheapest falsification available.
      STAGE 2 (minutes): Step 4's delta measurement on one toy class, including
      the L = 0 identity check.
      STAGE 3 (low hours): Step 5's within-class and between-class variance
      measurement over enumerable toy classes at p in {2^{10}, 2^{12}, 2^{14}},
      matched seeds, class size m swept.
      STAGE 4 (zero compute): Step 6's routing paragraph.
    controls:
      - Semaev-yield nearby-object control (argument must fail)
      - between-class variance arm (pipeline sensitivity check)
      - identity-map arm (delta must be exactly zero)
      - matched-seed within-curve repeats (the noise floor the zero is read against)
      - class-size sweep m (decay parameter for the enumeration artifact)
    required_metrics:
      - the written simulation, both directions, with delta explicit
      - the named break point for each of OPEN-1..OPEN-4
      - within-class and between-class variance of (S, T), per class, per m
      - measured delta in field operations, per path, including L = 0
      - within-curve seed-noise floor
      - pass/fail of the nearby-object control

  falsification_conditions:
    - >-
      The closure argument, written out, also proves that a non-group-level
      functional (Semaev yield) is class-invariant. The argument is too strong,
      is wrong, and this record is superseded.
    - >-
      Structured nonzero within-class variance of (S, T) survives its seed-noise
      floor and the between-class sensitivity check. The closure is false as
      stated and lane L13 acquires a live target; this would require independent
      replication before any interpretation.
    - >-
      delta is measured nonzero at L = 0. Instrument fault; every delta figure is
      void.
    - >-
      The pipeline shows zero BETWEEN-class variance too. It is curve-insensitive
      and its within-class zero is uninformative; the run set is INVALID rather
      than confirming.
    - >-
      A member of the class is connected only by steps of degree comparable to N,
      making delta non-negligible. OPEN-3 becomes binding and the closure's
      qualifier is doing real work; this must be reported rather than absorbed.

  confounders:
    - >-
      CURVE-INSENSITIVE PIPELINE. The dominant risk: a measurement whose table
      construction depends only on (N, seed) will report zero within-class
      variance for a trivial reason. The between-class arm is the required
      antidote and is blocking.
    - >-
      TOY CLASS SIZE. Enumerable toy classes have few prime-order members, so the
      within-class variance estimate has few degrees of freedom. The m sweep and
      the seed-noise floor are what make the zero readable.
    - >-
      ISOMORPHIC MEMBERS. Two class members that are F_p-isomorphic are one curve
      and will trivially show zero variance. j-invariants must be recorded and
      distinct.
    - >-
      delta AMORTISATION AMBIGUITY. Whether C_build is charged once per path,
      once per target, or once per class changes delta by orders of magnitude.
      The convention must be frozen before Stage 2 and reported with every
      figure.
    - >-
      CONFLATING THE CLOSURE WITH ITS MEASUREMENT. The closure is a theorem; the
      measurement is a consistency check. A passing measurement does not confirm
      the theorem and a failing one indicts the measurement first. This ordering
      must be stated in the write-up.

  interpretation_limits:
    - >-
      This closes an OPTIMISATION, not a problem. It says the class has no better
      curve to preprocess on; it says nothing about whether preprocessing itself
      is good, and it leaves the entire Corrigan-Gibbs--Kogan frontier exactly
      where it was.
    - >-
      It does NOT close lane L13. The accounting-across-curves results
      (IDEA-20260807-a127ab, IDEA-20260807-406fef) survive it untouched, because
      they concern M instances and this concerns one.
    - >-
      It does NOT close lane L1. OPEN-1 is handed over explicitly and any reading
      of this record as settling within-class variance of Semaev-side functionals
      is a misreading that the nearby-object control exists to prevent.
    - >-
      Toy measurements are consistency checks at claim_tier: toy and license no
      crypto-scale statement.
    - >-
      The additive delta is asymptotically negligible and concretely may not be.
      Every use of the closure must carry its qualifier.

  reachability_gate: >-
    THE GATE IS WHAT MAKES THE CLOSURE'S OWN QUALIFIER MEANINGFUL, AND IT CUTS
    BOTH WAYS. Direction 1 and Direction 2 both require an EXPLICIT path between
    the two SPECIFIED curves, so the closure as an ALGORITHMIC statement is only
    as constructive as path-finding, at p^{1/4+o(1)} field operations
    (see IDEA-20260807-a127ab heuristic H1, with its concrete-versus-asymptotic
    split). But as a CLOSURE the gate is irrelevant in the helpful direction: to
    rule OUT a class-wide optimisation one only needs the path to EXIST, not to
    be findable, because if the attacker cannot find the path to the allegedly
    better curve then the optimisation is unavailable for that reason instead.
    THE CLOSURE IS THEREFORE ROBUST TO THE GATE: either the frontier is invariant
    (no better curve) or the better curve is unreachable (no access to it), and
    both branches close the optimisation. This is the only record in the lane for
    which a FAILING reachability gate strengthens rather than weakens the
    conclusion, and that asymmetry is recorded as the reason it is worth writing.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record removes an optimisation rather
      than producing an algorithm. What it fixes is that the best achievable
      online exponent for group-law preprocessing on ANY member of the class is
      the same as on E, i.e. 1/3 at S = N^{1/3}, and that no class-wide search
      lowers it.
    memory_exponent: >-
      Likewise fixed: the achievable advice exponent is class-invariant EXACTLY,
      with no additive slack, so no classmate offers a smaller table for the same
      online time.
    best_known: >-
      Bernstein-Lange at S = T = N^{1/3} on the Corrigan-Gibbs--Kogan frontier
      S*T^2 = Omega~(N) (KN-LIT-013, KN-TECH-005); parallel rho at 0.886*sqrt(N)
      with O(1) memory (KN-TECH-001, KN-TECH-006), automorphism-discounted by at
      most sqrt(6) on CM curves (KN-TECH-018); BSGS at sqrt(N) time and memory
      with N^{2/3+o(1)} full cost (KN-TECH-031, KN-TECH-035); Kuhn-Struik
      multi-target rho at sqrt(M*N). This record changes none of them and
      explains why one route to changing them cannot work.
    hidden_overhead: >-
      The entire result hides inside "for group-law algorithms" and "up to
      delta". Both qualifiers are load-bearing: the first is OPEN-1, the second
      is OPEN-3, and neither may be dropped in any downstream summary.
    tradeoff_note: >-
      The closure covers the WHOLE (S, T) plane, not one operating point, which
      is why it is stated for a frontier rather than for S = T = N^{1/3}. That
      makes it a statement ABOUT the tradeoff curve rather than a point on it:
      the curve is the same on every classmate. Parallelization position is
      likewise invariant, since the simulation preserves the algorithm and adds
      only two isogeny evaluations per instance.

  dominated_by: >-
    AS AN ATTACK: mounts none and forbids one. Dominated on every axis by every
    row of the prime-field frontier -- parallel rho (0.886*sqrt(N) time, O(1)
    memory), automorphism-discounted rho on CM curves, BSGS (sqrt(N)/sqrt(N),
    N^{2/3+o(1)} full cost), Bernstein-Lange preprocessing (N^{1/3}/N^{1/3}),
    Kuhn-Struik multi-target rho (sqrt(M*N)). Checked across time, memory and
    data/queries.
    AS A CLOSURE: the incumbents are DECOMPOSITION.md T3 (the general principle,
    stated without instantiation) and IDEA-20260807-5cabfc (single-number
    functionals, vertical isogenies). This record dominates both on COVERAGE for
    the preprocessing functional (a set rather than a number, any isogeny rather
    than vertical, an explicit cost term rather than none) and is dominated by
    5cabfc on GENERALITY of the functional class it addresses, since 5cabfc
    covers every abstract-triple functional including rho and BSGS while this
    covers only the advice-augmented frontier.
  sota_delta: >-
    ZERO speedup against every attack baseline; a closure produces none. Closure
    delta, stated quantitatively: eliminates a search over up to h ~ p^{1/2}
    class members for a better preprocessing operating point, by showing the
    advice axis is invariant EXACTLY (slack 0 bits) and the time axis invariant
    up to delta = O(L*ell^3) field operations, which is 2^{56} at p = 2^{256}
    with ell ~ 2^{16}, L ~ 2^8, against an online phase of ~2^{89} field
    operations -- a relative slack of 2^{-33}. Names 4 open classes that survive
    the closure and routes each.

