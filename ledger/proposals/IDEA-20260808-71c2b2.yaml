  title: 'Overshoot the Aubry-Oyono-Vincent degree bound instead of matching it: treating
    the search radius T as a free parameter ABOVE (p/2)^{1/3} converts the paper''s rare-event
    success probability into a Theta(1) event, and the joint re-optimisation of (B, T) lowers
    the coefficient of the disclosed superpolynomial overhead from 2/sqrt(6) = 0.8165 to 2/3
    of sqrt(log p * log log p).'
  class: algorithm
  claim: "ONE FREE PARAMETER IS PINNED FOR A REASON THAT STOPS APPLYING AS SOON AS IT IS NAMED.\
    \ The frozen source sets its search radius at the structural bound T = (p/2)^{1/3} (Theorem\
    \ 1.5, line 81) because that is the value at which a solution is GUARANTEED to exist,\
    \ and then pays a rare-event factor P0^{-1} = u^{u(1+o(1))} for the guaranteed solution's\
    \ degree failing to be B-smooth (Lemma 3.5, line 187). Claim: running the SAME Algorithm\
    \ 2 at a LARGER radius T = K * (p/2)^{1/3} with K = p^{o(1)} costs a factor K more in\
    \ table size and buys back a factor 1/rho^{2/3} in success probability, and the product\
    \ is strictly smaller. Precisely, and conditional on HA-1 and HA-2 below:\n  (i) per-attempt\
    \ cost and memory  =  B * T * p^{o(1)}  (Lemma 3.2/3.3\n      with the threshold-generic\
    \ Lemma 3.4 of IDEA-20260805-250e50 STEP 1);\n  (ii) the expected number of isogenies\
    \ E -> E^{(p)} of degree <= T is\n      c * T^{3/2} / sqrt(p) with c an absolute constant\
    \ (rank-3 trace-zero\n      lattice of determinant p/4; the same counting law the corpus\
    \ already\n      carries as derivation D1, EV-SSIQ-e43afd O-5);\n  (iii) therefore the\
    \ expected number of B-SMOOTH ones is\n      c * T^{3/2} * rho(u_T) / sqrt(p), u_T = log\
    \ T / log B, and setting\n      this to 1 gives T* = p^{1/3} * (c rho)^{-2/3} and a per-attempt\n\
    \      success probability Theta(1);\n  (iv) total = B * p^{1/3} * rho(u)^{-2/3} against\
    \ the incumbent's\n      B * p^{1/3} * rho(u)^{-1}.\nRe-optimising B for the new objective\
    \ (in-session derivation, offered for attack): the incumbent's optimum solves u^2(log\
    \ u + 1) = L/3 and gives overhead exp(2 sqrt(L log L / 6)) = exp(0.8165 sqrt(L log L));\
    \ the new objective solves u^2(log u + 1) = L/2 and gives exp((2/3) sqrt(L log L)), L\
    \ = log p. THE EXPONENT DOES NOT MOVE: both are p^{1/3+o(1)}. What moves is the coefficient\
    \ inside the o(1), by the factor 0.8165 -> 0.6667."
  mechanism: 'THE PAPER''S OWN REMARK 1 (line 191) CONCEDES THE PHENOMENON AND DECLINES TO
    USE IT: "there are generally multiple small (non-cyclic) isogenies E -> E^{(p)}, and it
    is sufficient for any one of them to be smooth ... While practically relevant, this phenomenon
    is absorbed in the hidden term". Remark 1 observes multiplicity AT THE FIXED RADIUS (p/2)^{1/3},
    where the Minkowski/Hermite count gives O(1) vectors -- a constant, hence genuinely absorbable.
    The present claim is structurally different: the multiplicity is a FUNCTION of the radius,
    growing as T^{3/2}/sqrt(p), and the radius is a parameter the algorithm never varies.
    Growing it to make the smooth-vector count Theta(1) converts a p^{-o(1)} success probability
    into a Theta(1) one at a p^{o(1)} price, and the two p^{o(1)} factors are NOT the same
    size. Concretely, in the exponent of the total cost, log(cost) = b + L/3 + alpha * u log
    u where u = L/(3b), b = log B, and alpha = 1 for the incumbent (one candidate, probability
    rho) but alpha = 2/3 for the overshoot variant (the count is T^{3/2}, so log T grows by
    (2/3) log(1/rho) rather than the incumbent''s log(1/rho) appearing as a multiplicative
    attempt count). Minimising over b in each case gives the two coefficients above. Correctness
    is inherited, not re-proved: the generalised Lemma 3.4 with X = (BT)^{1/2} is exactly
    IDEA-20260805-250e50''s STEP 1, which this record CONSUMES and does not restate as its
    own. Cyclicity is preserved: if the smooth vector of degree <= T is imprimitive, phi =
    phi'' o [m], then phi'' has smaller and still B-smooth degree and cyclic kernel, so the
    primitive count (a 1/zeta(3) factor) is the operative one and is absorbed into c.'
  why_not_a_renamed_known_approach: 'NEAREST KNOWN METHOD IS THE FROZEN SOURCE ITSELF AT ITS
    OWN SECTION 4.1, which already "optimis[es] B for best time" (line 232). The difference
    is exactly one variable: Section 4.1 optimises B with P0 taken from Lemma 3.5, i.e. computed
    from the SINGLE smallest isogeny at the FIXED radius (p/2)^{1/3}. This record optimises
    (B, T) jointly with P0 computed from the smooth-vector COUNT at a free radius. Section
    4.1 explicitly flags the resulting optimism in the OTHER direction ("the above numbers
    may be OVERESTIMATING the factor 1/P0 (see Remark 1)", line 240) -- so the source knows
    its 1/P0 is loose and does not repair it. This record repairs it and shows the repair
    changes the optimal B, not just the constant.'
  predictions:
  - observable: Symbolic reproduction gate. Setting T = (p/2)^{1/3} and K = 1 in the overshoot
      cost function.
    metric: value of X returned by the generalised Lemma 3.4
    predicted: EXACTLY B^{1/2}(p/2)^{1/6}, character for character with line 167 of the frozen
      source. Any other value kills the record at zero compute.
  - observable: The overhead coefficient, computed symbolically from the two stationarity
      conditions u^2(log u + 1) = L/3 and = L/2.
    metric: coefficient of sqrt(L log L) in log(total cost) minus L/3
