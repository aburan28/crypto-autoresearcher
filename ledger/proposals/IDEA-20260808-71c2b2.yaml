  confounders:
  - The o(1) coefficients being compared are both superpolynomial; a coefficient ratio is
    meaningful only if BOTH are computed under the same per-entry cost model. EV-PEC-857664
    established that the source's own model understates per-entry cost by a bracket of [1.327,
    1.576] bits at NIST-I. That correction is common to both branches and cancels in the ratio
    but not in any absolute figure, and no absolute figure may be quoted from this record
    (SC-3).
  - Smoothness of distinct short vectors of the same lattice may be positively correlated
    (they share the lattice's arithmetic), which would make the Theta(1) crossover occur later
    than predicted. HA-2 names this and the Stage-2 measurement is designed to see it.
  - At larger radius the vectors are less likely to be primitive; the 1/zeta(3) primitivity
    factor is a constant but the JOINT law of (primitivity, smoothness) is not obviously factorising.
  falsification_conditions:
  - The K = 1 reproduction gate does not return X = B^{1/2}(p/2)^{1/6}.
  - The fitted exponent of N(T) in T is outside [1.35, 1.65] with an estimator that has been
    anchored on a synthetic object of known exponent (GOAL-SSIQ-001 instrument_calibration
    standing practice -- this campaign has already been burned twice by unanchored exponent
    estimators, GD-4).
  - Empirical P0 at radius K p^{1/3} fails to reach 1/2 for any K <= 100 at the tested primes,
    while the model predicts it should. The multiplicity is then not harvestable and the record
    collapses to a restatement of Remark 1.
  - A reader shows the per-entry cost grows superlinearly in B at the relevant range, so that
    the extra table mass costs more than the model charges. The coefficient comparison is
    then invalid as stated and must be redone inside the corrected estimator.
  interpretation_limits: 'NO EXPONENT IS CLAIMED TO MOVE. This is an o(1)-level result and
    says so: it reduces a disclosed superpolynomial overhead, which the source itself names
    as the reason the asymptotic advantage does not translate into a concrete threat (line
    13, line 39). Its priority is NOT that it is target-class -- it is not -- but that it
    is a required building block for every concrete-cost row in GOAL-P13-001, because P0 multiplies
    every one of the eighteen margin rows identically and has never been tested in that campaign
    (GOAL-P13-001.pause_condition_watch, item iii). Conditional on Heuristic 1 throughout;
    SC-1 applies to any Isogeny-problem restatement.'
  assumptions:
  - The frozen in-repo transcription faithfully reproduces the archived result.
  - The generalised (threshold-free) Lemma 3.4 of IDEA-20260805-250e50 STEP 1 is sound. This
    record consumes it; it does not re-derive it and would fall with it.
  - Memory equals time at every point of the curve, as in the incumbent. The overshoot variant
    makes memory WORSE by the same factor K it makes time better by rho^{1/3}; on a memory-bounded
    machine the comparison must be made on the van Oorschot-Wiener curve and not at the high-memory
    endpoint.
  heuristic_assumptions:
  - id: HA-1
    statement: 'SHORT-VECTOR COUNT. There is an absolute constant c > 0 such that for a uniformly
      random supersingular E/F_{p^2} and for T in [p^{1/4}, p^{1/2}], the expected number
      of cyclic isogenies phi : E -> E^{(p)} of degree at most T is c * T^{3/2} * p^{-1/2}
      * (1 + o(1)), uniformly in p.'
    rigorous_ingredient: The rank-3 trace-zero sublattice of Hom(E, E^{(p)}) has determinant
      p/4 (AOV Section 5.1, relayed through EV-SSIQ-e43afd O-6; CITED-NOT-VERIFIED in this
      corpus). Hermite on that lattice reproduces Theorem 1.5's constant exactly (DEC-20260805-2be965's
      D1), which is the strongest available check that the determinant normalisation is right.
      The expected count is then the volume of a ternary ellipsoid, and the first-moment version
      is provable by Eichler's optimal-embedding class number formula (see S1-02 and S1-03).
    distribution_imitated: 'The Siegel-Rogers mean-value theorem for random lattices: the
      expected number of lattice points in a set of volume V is V/det, with V the ternary
      ball of radius T^{1/2} in the degree form.'
    validation_route: The paper's own Section 4.2 sampler, extended from "shortest vector"
      to "all vectors below a radius". 100,000 samples at p = 5*2^248-1 and 10,000 at p =
      27*2^500-1, i.e. CRYPTO SCALE, not toy. Fit c and the two exponents. Additionally cross-check
      against the exhaustive AOV delta_E data at p <= 265,207 (toy, and labelled toy).
    tail_checks: The K = 1 slice must return E[N] consistent with the Minkowski count (an
      O(1) number, predicted ~6 up to units and sign) and must reproduce the two published
      smoothest-sample tail facts at lines 250 and 252.
  - id: HA-2
    statement: NEAR-INDEPENDENCE OF SMOOTHNESS ACROSS SHORT VECTORS. Conditioned on the lattice,
      the events {deg phi_i is B-smooth} for the distinct primitive vectors phi_i of degree
      <= T are pairwise near-independent in the sense that Pr[no smooth vector] = exp(-(1+o(1))
      * sum_i rho(u_i)) uniformly in the stated range.
    rigorous_ingredient: Canfield-Erdos-Pomerance (Theorem 1.4, line 77) for each individual
      degree; nothing rigorous is available for the joint law.
    distribution_imitated: Poissonisation of rare independent events, the same shape as the
      classical heuristic that the smooth values of distinct polynomials at a common argument
      are independent.
    validation_route: 'Directly measurable on the SAME crypto-scale Deuring samples: for each
      sampled order, record the vector of largest-prime-factors of all short vectors, and
      test pairwise rank correlation against a permutation null in which the largest-prime-factors
      are shuffled across orders.'
    tail_checks: The empirical Pr[no smooth vector below radius T] versus the Poisson prediction,
      in the deep tail where the prediction is ~1/1000 -- the regime where Section 4.2's own
      tail checks live.
  target_complexity:
    time_exponent: 'p^{1/3+o(1)}, UNCHANGED. What changes is the o(1): the coefficient of
      sqrt(log p * log log p) in the exponent of the overhead falls from 2/sqrt(6) = 0.8165
      to 2/3 = 0.6667 (in-session derivation).'
    memory_exponent: p^{1/3+o(1)}, UNCHANGED in exponent and WORSE in the o(1) by the factor
      K = (c rho)^{-2/3}. Memory is traded against the time saving; this is stated because
      a memory-blind reading would count the saving twice.
    best_known_baseline: p^{1/3+o(1)} time AND memory conditional on Heuristic 1 (OneEnd/EndRing;
      additionally GRH for Isogeny, SC-1); p^{1/2}(log p)^{O(1)} unconditional at polynomial
      memory; joined by van Oorschot-Wiener sqrt(N^3/w).
    hidden_overhead_disclosure: The overhead remains SUPERPOLYNOMIAL. The record reduces its
      coefficient and does not remove it. It additionally inherits, unreduced, the per-entry
      cost correction of EV-PEC-857664 (bracket [1.327, 1.576] bits at NIST-I) and adds no
      new o(1) of its own beyond the enumeration of a larger radius.
    time_memory_tradeoff: On the vOW curve the claw sets have size N = B*T, so one attempt
      is (BT)^{3/2}/w^{1/2}; the overshoot variant moves BOTH the numerator (up, by K^{3/2})
      and the attempt count (down, by rho^{1/3}), and the net sign on the middle-memory curve
      is NOT the same as at the high-memory endpoint and must be computed separately. That
      computation is part of Stage 1 and is the place this record is most likely to lose.
  sota_delta: Zero on the exponent axis. On the o(1) axis, the derived saving is a factor
    exp(0.1498 * sqrt(L log L)), i.e. 2^{6.55} at log2 p = 256 and 2^{9.87} at log2 p = 512,
    MINUS whatever the memory inflation K^{3/2} costs on the actual machine. Both numbers
    are model outputs, not measurements.
  dominated_by: 'Not dominated on time at the high-memory endpoint (it is the incumbent point
    with a smaller cofactor). ROWS CHECKED: (i) the frozen source''s Section 4.1 table at
    five sizes, time and memory (lines 234-238); (ii) KN-TECH-058''s two tiers and the vOW
    interpolation; (iii) KN-TECH-057''s full-cost rows -- MITM p^{2/3}, Delfs-Galbraith p^{1/3}
    (F_p), vOW p^{1/2} (F_p2) and p^{1/4} (F_p, conditional on unproven mixing); (iv) all
    five EV-SSIQ-* records for a prior sub-1/3 point (none exists); (v) data/query axis --
    not applicable, the problem takes no oracle and no samples. IT IS DOMINATED IN THE MIDDLE-MEMORY
    REGIME by the vOW curve whenever K^{3/2} exceeds rho^{-1/3}, and that crossover is exactly
    what Stage 1 computes.'
  estimated_cost: 'Implementation medium (a quaternion short-vector enumerator plus factoring;
    the sampler already exists in the paper''s Section 4.2 form). Compute low to medium: enumeration
    to radius K p^{1/3} multiplies the paper''s own sampling cost by roughly the number of
    vectors found, i.e. a small constant times K^{3/2}. Stage 0 and Stage 1 are zero compute.'
