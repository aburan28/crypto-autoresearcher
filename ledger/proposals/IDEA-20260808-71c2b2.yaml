      OF A MODEL, NOT MEASURED SAVINGS, and they are stated so a measurement can contradict
      them.
  - observable: 'Crypto-scale Deuring-side sampling (the paper''s own Section 4.2 method):
      for each sampled maximal order, enumerate ALL vectors of the two-sided ideal P of norm/p
      <= K(p/2)^{1/3} for K on a grid, factor each norm, record the smallest B-smooth one.'
    metric: empirical N(T) = mean number of vectors of degree <= T, fitted as c * T^{3/2}
      / sqrt(p)
    predicted: Fitted exponent 1.5 +- 0.05 in T at fixed p, and 0.5 +- 0.05 in p at fixed
      T/p^{1/3}. A fitted exponent materially away from 3/2 falsifies HA-1 and with it the
      whole record.
  - observable: gain in the smallest-smooth-degree statistic
    metric: E[log(smallest B-smooth degree in radius K p^{1/3})] as a function of K
    predicted: Decreasing in K with the Theta(1) crossover at K = (c rho)^{-2/3}; and the
      empirical P0 at radius K p^{1/3} must reach 1/2 within a factor 2 of the predicted K.
      A P0 that saturates BELOW 1 as K grows falsifies HA-2 (independence of the smoothness
      of distinct short vectors).
  minimal_test: 'Three stages, cheapest first, each able to terminate the line. STAGE 0 (zero
    compute, hours): re-derive the two stationarity conditions and the two coefficients symbolically;
    check the K = 1 reproduction gate against line 167. If the reproduction gate fails, STOP.
    STAGE 1 (zero compute): write the cost function''s admissible region and state where the
    overshoot variant is DOMINATED -- it is dominated whenever the per-entry cost grows with
    B faster than linearly, which is exactly the regime KN-FIND-4e7a92''s corrected estimator
    lives in, so this stage must charge the corrected estimator and not the source''s one-F_{p^2}-op
    convention (which EV-PEC-857664 refuted in the attack''s disfavour). STAGE 2 (the real
    measurement, and it is CHEAP because it reuses the paper''s own sampler): quaternion-side
    sampling of random maximal orders in B_{p,infty} at p = 5*2^248 - 1 and p = 27*2^500 -
    1, enumerating the ideal P''s short vectors out to radius K(p/2)^{1/3} rather than only
    its minimum. This is a strict superset of the computation Section 4.2 already reports,
    so a failure to reproduce Section 4.2''s own minimum statistics is an instrument failure
    and blocks every other reading.'
