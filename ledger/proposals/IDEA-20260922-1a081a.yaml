  minimal_test:
    design: >-
      Zero compute; arithmetic and corpus audit only. (1) GREP AUDIT: enumerate
      every cost law for binary-field index calculus in ledger/ and knowledge/
      and classify each as Frobenius-blind or Frobenius-aware, and as reading or
      not reading a curve coefficient. Emit the list, including the failures.
      (2) BASELINE TABLE: recompute the ten rho rows and the two extra-lane rows
      from the audit dump by an independent script, with cofactor read per curve,
      and reproduce IDEA-20260915-8fe0ef's (227, 55) as the gate. (3) FAN: for
      each of the four Assumption-1 resolutions, take the corresponding cost
      column as handed over from the SEMBIN lane (or mark it OPEN if not yet
      available) and emit the ten-row verdict with the margin, the branch label
      and Delta(m). (4) Write the STRUCTURALLY EMPTY cells for the GHS column on
      all ten rows, citing the prime-m certificate, not this record.
      OUTCOMES. (A) (C1) survives the grep: the table is built with five attack
      columns and the K/B difference is a baseline fact; the reach fan is a
      lookup. (B) (C1) fails -- some filed law does read the curve: the failing
      law is named, the table needs ten columns for that line only, and the
      record's (C3) applies to the rest. (C) A resolution column arrives from
      SEMBIN in which the cost depends on lambda_x strongly enough that (C1)'s
      single-scalar factorisation is not a good approximation: then lambda_x's
      K/B ratio becomes load-bearing and IDEA-20260922-8ac1ea's measurement is a
      prerequisite, which is recorded as a dependency rather than guessed.
    controls:
      - >-
        NEARBY OBJECT (no-Frobenius): sect193r1/r2 at m = 193 must receive no
        <tau,-1> row. A pipeline that gives them one has keyed the correction on
        the extension degree rather than on the curve.
      - >-
        NEARBY OBJECT (Frobenius outside FIPS): sect239k1 (a = 0, b = 1, m = 239,
        h = 4) must receive one, while c2tnb239v1/v2/v3 over the same field must
        not. The pair isolates "Koblitz" from "field".
      - >-
        KNOWN-FALSE: charge the K rows with the negation-only baseline and
        confirm the fan's verdicts move by exactly the tabulated 0.5*log2(m); a
        fan insensitive to the baseline choice is not charging a baseline.
      - >-
        RECONSTRUCTION: order bit-lengths and cofactors re-derived from the hex
        by a second party, since the table above is hand arithmetic.
    required_metrics:
      - the classified list of filed binary cost laws, with the two bits per law
      - ten rho rows plus sect193r1/r2 and sect239k1, in log2 group operations
      - Delta_rho(m) at the five m, and Delta(m) per line and per resolution
      - per cell: branch label, margin in bits, and the resolution column it came from
      - the GHS column as STRUCTURALLY EMPTY on all ten rows with its certificate
  falsification_conditions:
    - >-
      A filed binary index-calculus cost law that reads a or b other than through
      lambda_x or r falsifies (C1) as an unqualified statement; the record is
      then re-scoped to the laws that satisfy it and the exception is named.
    - >-
      A recomputed Delta_rho(m) differing from 0.5*log2(m) + (h-bit) by more than
      0.05 bits at any m means the cofactors or order bit-lengths above are
      wrong; that is an arithmetic error to be located, not a finding.
    - >-
      A Frobenius-aware line whose measured relation-count gain is NOT a factor
      m (IDEA-20260915-8fe0ef's own falsifier at ratio above 2/n) breaks (C3)'s
      negative branch; the sign statement then holds only with the measured
      factor substituted.
    - >-
      If the SEMBIN lane resolves Assumption 1 in a way that makes T_IC depend on
      the curve directly (for example through a coset construction whose
      disjointness depends on Tr(a)), (C1) is false for that line and the fan
      must carry ten columns for it.
  confounders:
    - >-
      COFACTOR ASYMMETRY MASQUERADING AS FROBENIUS. K-233/283/409/571 have h = 4
      and their B partners h = 2, so half a bit of every Delta_rho is cofactor,
      not symmetry. Reporting Delta_rho without decomposing it attributes that
      half-bit to the Frobenius.
    - >-
      sqrt(2m) VERSUS sqrt(m). The Koblitz gain is sqrt(2m) over plain rho and
      sqrt(m) over negation-only rho. Mixing the two overstates the Koblitz
      defence by half a bit at every row; this record uses sqrt(m) throughout and
      flags IDEA-20260915-8fe0ef's label.
    - >-
      OPERATION UNITS. rho is counted in group operations; index-calculus laws in
      this corpus are variously in SAT conflicts, field operations and wall
      clocks (IDEA-20260815-66496a). A margin computed across units measures the
      units. Every cell must declare its primary unit and the exchange rate used.
    - >-
      ASYMPTOTIC ONSET. Semaev's and Nagao's bounds have unstated n_0. A margin
      at m = 163 may lie entirely below it; the fan states this per cell and
      never reads a margin as a refutation of an asymptotic theorem.
    - >-
      lambda_x IS NOT KNOWN TO BE CURVE-BLIND. (C1) asserts the cost LAWS are
      blind except through lambda_x; it asserts nothing about lambda_x itself,
      whose K/B behaviour is the subject of IDEA-20260922-8ac1ea. Treating
      lambda_x as equal across a K/B pair without measuring it is the single
      most likely way this record is misused.
  interpretation_limits:
    - >-
      This is a composition and indexing record. It computes no new cost, tests
      no mechanism, and makes no claim about any curve's security at any outcome.
    - >-
      All deployed-parameter numbers are hand arithmetic on a secondary source
      and are proposal-time, not evidence. The question requires re-derivation
      from FIPS 186-4 for any cell at claim strength.
    - >-
      No factor base is introduced, so KN-OPEN-020 is not engaged; the record
      inherits whatever class the line it indexes belongs to and says so per cell.
    - >-
      Scoped to the ten FIPS binary curves plus sect193r1/r2 and sect239k1, and
      to the cost laws filed in this repository on 2026-09-22. It says nothing
      about lines not yet filed.
  heuristic_assumptions:
    - id: HB1-1
      statement: >-
        (CURVE-BLINDNESS, corpus-scoped) For every index-calculus cost law L for
        E/F_{2^m} filed in this repository on 2026-09-22, there exist functions f
        and g with L = f(m, l, m_a, omega) * g(lambda_x(E, V, m_a), r). In
        particular L(K-m) = L(B-m) whenever lambda_x and r agree.
      rigorous_support: >-
        RIGOROUS PART: S_3 depends on the curve only through b (RQ-SEMBIN-9e8f82
        scope, exact), and the Weil descent of S_3 to F_2 in a fixed basis has a
        top-degree part independent of b, so the Macaulay structure above the
        constant term is literally identical across any two curves over the same
        field. HEURISTIC PART: that no filed law reads the constant term is a
        claim about the corpus, not a theorem; it is settled by enumeration and
        is therefore the cheapest possible validation.
        CLASSICAL ANALOGUE IMITATED: the standard "generic system" reading under
        which solving degree is a function of the degree sequence and the number
        of variables alone -- the same reading that IDEA-20260815-05c761 warns
        conflates solving degree with degree of regularity. HB1-1 inherits that
        warning and is stated only about FILED LAWS, never about true costs.
      validation_plan: >-
        Enumerate every cost law in ledger/ and knowledge/ whose object is an
        index calculus over a binary field: for each, record whether a, b, Tr(a)
        or #E appears anywhere in its expression other than inside lambda_x or r.
        Sample = the complete filed set, so this is a census, not an estimate; no
        distributional comparison applies and the tail check is the explicit list
        of exceptions. Transfer assumption: none -- the statement is about the
        corpus and is not extrapolated to unfiled laws.
    - id: HB1-2
      statement: >-
        (YIELD PARITY) For a K/B pair at equal m and equal factor base V and
        arity m_a, lambda_x(K-m)/lambda_x(B-m) lies in [1/4, 4] -- i.e. the yield
        is curve-sensitive by at most two bits, so (C3)'s sign is decided by the
        baseline and the orbit quotient and not by the yield.
      rigorous_support: >-
        RIGOROUS PART: the expected number of m_a-fold decompositions of a random
        target over V is |Fb_E ∩ V|^{m_a}/(m_a! * r) up to a multiset correction,
        so any K/B yield difference must come from |Fb_E ∩ V| -- the count of
        V-elements that are x-coordinates of E-points -- and from the trace-parity
        class structure of H-SEMBIN-83a856, which differs between Tr(a) = 1 and
        Tr(a) = 0 curves by a factor of at most 2 in the admissible-arity
        constraint. CLASSICAL ANALOGUE IMITATED: the equidistribution of the
        E-side indicator (1 + (-1)^{Tr(x + a + b/x^2)})/2 over a subspace, whose
        character sum is a subspace Kloosterman sum bounded by Weil at 2 sqrt(q)
        -- the same analogue IDEA-20260915-8fe0ef's H1 uses, here applied to the
        COUNT rather than to the orbit distribution.
      validation_plan: >-
        Measured, not assumed: this is exactly what IDEA-20260922-8ac1ea's
        exhaustive tables at n <= 41 produce. Sample: all K/B pairs over F_{2^n}
        for n in {17, 19, 23, 29, 31} with V of dimension l and m_a chosen
        balanced, tabulating |Fb_E ∩ V| exhaustively (2^l tests) and lambda_x
        from the exhaustive pair/triple table. Predicted distribution: the
        binomial count Binomial(2^l - 1, 1/2) for |Fb_E ∩ V| on both curves, with
        the two counts differing by O(sqrt(2^l)) and hence lambda_x by
        1 + O(m_a 2^{-l/2}). Tail check: the fraction of pairs with ratio outside
        [1/2, 2] must be below 0.05 at l >= 8. TRANSFER ASSUMPTION, STATED: the
        deployed rows assume the same parity persists from n <= 41 to m >= 163,
        an extrapolation of a factor 4 to 14 in n, justified only by the Weil
        bound improving with q and recorded as an assumption, not a result.
  heuristic_note: >-
    HB1-1 is a census and can be discharged at zero compute; HB1-2 is the only
    quantity in this record that needs a measurement, and it is measured by a
    sibling proposal rather than here. Both are stated so that a failure is
    locatable: HB1-1 fails by naming a law, HB1-2 by exhibiting a K/B pair with a
    yield ratio outside the stated window.
  target_complexity:
    time_exponent: >-
      This record moves no exponent and claims none. It asserts that the
      index-calculus time exponent over F_{2^m} is a function of m and the
      attacker's (l, m_a, omega), identical on K-m and B-m, while the matched
      baseline exponent is log2(r)/2 - 0.5*log2(m) on Koblitz rows and
      log2(r)/2 elsewhere. The only quantity it produces is the per-curve margin
      in bits, tabulated above at 77.16 to 284.83 for the baseline side.
    memory_exponent: >-
      Unchanged and inherited per line. The baseline is charged under van
      Oorschot-Wiener at the Pareto minimum of its own time-memory curve, per
      EV-SEMBIN-71e5cd O-6/O-7, so that no cell repeats the 29-bit overcharge
      that review found.
    best_known: >-
      Matched rho with the curve's own symmetries: 2^{77.16} group operations on
      K-163 and 2^{80.83} on B-163, up to 2^{279.75} on K-571 and 2^{284.83} on
      B-571 (this record's arithmetic). No index-calculus line filed in this
      program is within 40 bits of any of those rows under a memory-charging
      metric, and this record does not claim otherwise.
    hidden_overhead: >-
      None introduced. The o(1) hiding in the lines this record indexes stays
      theirs and is reported in their own cells, with IDEA-20260913-41c4f0's H1-H5
      enumeration carried as the template for what a cell must disclose.
    tradeoff_note: >-
      The baseline is memory-cheap (O(w) distinguished points) and perfectly
      parallel under vOW; every index-calculus row in this table is memory-heavy
      at the linear-algebra stage. The fan reports time and memory beside each
      other so that a time-only crossover is never read as a crossover.
  estimated_cost:
    implementation: low
    compute: none
    qualification: >-
      Arithmetic in the log2 domain plus a corpus grep. Advisory; the cost is in
      getting the units and the cofactors right, not in computing. No run at
      m >= 131 is requested or implied.
  asymptotic_claim:
    problem: ECDLP on the ten FIPS 186-4 binary curves, plus sect193r1/r2 and sect239k1
    prior_best: >-
      rho with the curve's own symmetries: 0.886 sqrt(r) on non-subfield rows,
      sqrt(pi r/(4m)) on Koblitz rows
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      none introduced; the record's own content is the bit-exact constant
      0.5*log2(m) + (h-bit) separating a K row from its B partner
    claim_kind: audit
  dominated_by: >-
    Every proposal in this record's scope is dominated, in the Pareto sense
    across time and memory, by the matched rho row for its own curve: 2^{77.16}
    (K-163), 2^{80.83} (B-163), 2^{111.40} (K-233), 2^{115.83} (B-233),
    2^{136.26} (K-283), 2^{140.83} (B-283), 2^{198.99} (K-409), 2^{203.83}
    (B-409), 2^{279.75} (K-571), 2^{284.83} (B-571), 2^{95.83} (sect193r1/r2),
    2^{114.38} (sect239k1) group operations at O(w) memory and full vOW parallel
    efficiency. FRONTIER ROWS CHECKED: (i) negation-only rho 0.886 sqrt(r);
    (ii) rho on <tau,-1> classes sqrt(pi r/(4m)); (iii) vOW at the Pareto minimum
    of T = W(1/M + 1/w), Mem = 3n max(w, M), per EV-SEMBIN-71e5cd O-6/O-7;
    (iv) exhaustive search 2^{log2 r}; (v) Semaev 2015's 2^{1.6986 sqrt(n ln n)}
    under each of the four assumption resolutions; (vi) Nagao Theorem 1's
    O(n^{8w+1}) as costed in IDEA-20260913-41c4f0; (vii) the GHS/cover column,
    which is STRUCTURALLY EMPTY on every row in this record's scope because every
    extension degree is prime (analysis/binstd-curve-audit/). There is no
    data/query axis for this problem. This record claims no row of its own and is
    therefore dominated trivially; it reports where the existing rows sit.
  sota_delta:
    time: >-
      Zero. No time exponent moves. The record's quantitative output is the
      per-curve margin table and the exact K/B gap 0.5*log2(m) + (h-bit) = 3.67,
      4.43, 4.57, 4.84, 5.08 bits at m = 163, 233, 283, 409, 571.
    memory: >-
      Zero. The memory column is inherited per line and charged beside time so
      that no time-only crossover is reported as a crossover.
    data_queries: >-
      Not applicable; neither rho nor any index-calculus line in scope consumes
      queries or data beyond the single target instance.
  frontier_check:
    status: checked
    note: >-
      All seven frontier rows above were enumerated before dominated_by was
      written. The GHS column was checked and found structurally empty by the
      prime-degree certificate in analysis/binstd-curve-audit/, which is the one
      cell in this record's scope that is closed rather than merely dominated.
  recommended_priority: high
  priority_rationale: >-
    Zero compute, and it is the indexing the question's decision target is made
    of: without (C1) the reachability table needs ten independent attack cells,
    nine of which are copies. Its best case is not an exponent and it says so --
    the K/B difference is a constant 3.67 to 5.08 bits. It is ranked high as a
    REQUIRED BUILDING BLOCK of the exponent-moving line, namely the Frobenius-
    aware branch of (C3): the sign flip says that any future orbit-quotient
    result should be aimed at the Koblitz rows and any Frobenius-blind result at
    the B rows, and that choice is currently being made by neither.
  first_deliverable: >-
    The classified list of filed binary cost laws (Frobenius-aware or blind;
    curve-reading or not), plus the twelve-row baseline table recomputed
    independently with the (227, 55) reproduction gate passed.
  next_gate: >-
    Coordinator review of whether (C1) survived the census. If it did, the
    reachability table is opened with five attack columns; if it did not, the
    named exception is recorded and the fan is built with ten columns for that
    line only. Either way no hypothesis status moves and no run is authorised.
