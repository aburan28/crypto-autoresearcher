      nothing to the recharge.
      (3) IDEA-20260915-8fe0ef owns the ord_n(2) lane table and the Koblitz rho
      correction on TOY ICPERF cells. What is added here: the correction stated
      as sqrt(m) rather than sqrt(2m) against the negation-only row (with that
