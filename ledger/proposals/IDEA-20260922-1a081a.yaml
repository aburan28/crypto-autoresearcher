      baseline for a Frobenius-blind line, and the sign flip when it is not.
      (2) IDEA-20260913-9c54f9 recharges Semaev's Table 3 with integer k and a
      memory column and shows the FIPS conclusion needs only bounded solving
      degree at SOME k_0. That record owns the recharge and the assumption
