idea:
  id: IDEA-20260922-1a081a
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    CURVE-BLINDNESS: every index-calculus cost law this program has filed over
    F_{2^m} is a function of (m, l, m_a, omega, yield) and never reads the curve
    coefficients, so Semaev's "n = 409, 571 are theoretically broken" claim has
    FIELD granularity while the baseline it must beat has CURVE granularity --
    which means the ten FIPS binary rows collapse to five attack columns and ten
    distinct rho rows, the K/B margin gap is exactly 0.5*log2(m) + (h-bit) bits,
    and the SIGN of that gap flips according to whether the attack line is
    Frobenius-aware. One zero-compute discriminator decides, per curve, which of
    the ten falls first under each possible resolution of Assumption 1.
  class: composition
  claim: >-
    R1/R3-neutral; the stage whose charged cost this record changes is NONE --
    it changes the INDEXING of the charged costs already filed, which is what
    RQ-BINSTD-b6f698's decision target is made of.

    Three statements, all decidable by arithmetic and grep, none requiring a run.

    (C1) CURVE-BLINDNESS. For a binary curve E: y^2 + xy = x^3 + a x^2 + b over
    F_{2^m}, the third summation polynomial is
    S_3(x1,x2,x3) = (x1x2 + x1x3 + x2x3)^2 + x1x2x3 + b
    (RQ-SEMBIN-9e8f82 scope block, provenance internal). It reads the curve ONLY
    through b, and not at all through a. Every filed cost law in this program's
    binary index-calculus lane -- Semaev's 2^{1.6986 sqrt(n ln n)}, Nagao's
    O(n^{8w+1}) (IDEA-20260913-41c4f0), the exhaustive-core PDP law c*2^{m_a l}
    (IDEA-20260915-0d8e90), the relation-phase law N_rel/lambda_x * C_U, the
    linear-algebra column -- is a function of (m, l, m_a, omega) and of ONE
    curve-dependent scalar, the relation yield lambda_x. The predicted grep
    result is that no filed law contains a, b or the group order except through
    lambda_x and through r in the yield denominator. If that survives the grep,
    then the ten FIPS binary curves present at most FIVE distinct index-calculus
    columns, one per m in {163, 233, 283, 409, 571}, and the reachability table
    of RQ-BINSTD-b6f698 must be built with that asymmetry stated, not with ten
    independent attack cells implying ten independent computations.

    (C2) THE BASELINE IS NOT CURVE-BLIND, AND THE GAP IS EXACT. Matched rho
    carries every symmetry the curve grants. Negation-only rho costs
    sqrt(pi*r/4) = 0.886*sqrt(r); rho on <tau,-1> classes of size 2m costs
    sqrt(pi*r/(4m)), so the Koblitz gain OVER THE NEGATION-ONLY ROW is exactly
    sqrt(m), i.e. 0.5*log2(m) bits -- not sqrt(2m). (sqrt(2m) is the gain over
    PLAIN rho, sqrt(pi*r/2); IDEA-20260915-8fe0ef states "sqrt(2n) below the
    negation-only 0.886 sqrt(r) row", while its own n = 17 figures 227 -> 55
    have ratio 4.13 = sqrt(17.05) = sqrt(n). The figures there are right and the
    label is off by sqrt(2); this record uses sqrt(m) and says why.) Adding the
    cofactor split -- h = 4 on K-233/283/409/571 against h = 2 on their B
    partners, h = 2 on both at m = 163, read off the audit dump -- the K/B rho
    gap at equal m is 0.5*log2(m) + 0.5 bits for m in {233, 283, 409, 571} and
    0.5*log2(163) = 3.67 bits at m = 163.

    (C3) THE SIGN FLIPS, AND THE FLIP IS THE DISCRIMINATOR. Define the per-curve
    margin M(curve) = log2 T_IC - log2 T_rho, and Delta(m) = M(K-m) - M(B-m).
    A FROBENIUS-BLIND index-calculus line has T_IC equal on K-m and B-m by (C1),
    so Delta(m) = log2 T_rho(B-m) - log2 T_rho(K-m) = +(0.5*log2 m + 0.5) > 0:
    the pseudorandom B-curve is the EASIER target and falls first, and the
    Koblitz curve's own symmetry is a DEFENCE against index calculus of exactly
    that many bits. A FROBENIUS-AWARE line (GGMP-type orbit quotient,
    KN-LIT-796; IDEA-20260915-8fe0ef S3) divides the relation count by m and the
    linear algebra by m^2, so on the relation-dominated branch T_IC(K-m) falls by
    log2(m) and Delta(m) = 0.5 - 0.5*log2(m) < 0 for every m >= 5: the Koblitz
    curve becomes the easier target. The two regimes are separated by a single
    bit-valued fact about the attack, and the crossing is sharp. NO FILED RECORD
    IN THIS PROGRAM STATES WHICH SIDE ANY OF ITS BINARY COST ROWS IS ON.
  mechanism: >-
    OBJECT FRAME. Representation of the point: R1 (field representation of the
    coordinates -- the record is representation-neutral and inherits whatever R1
    class the line it indexes uses). Operation set Sigma: translation by
    factor-base elements ONLY, i.e. the index-calculus partial action; the
    tracked object is the relation vector over the factor base, which is Class I
    (PARTIAL-ACTION) of IDEA-20260806-c5d183 -- it propagates under addition of a
    factor-base point and under nothing else. This record does not introduce a
    new object; it is a composition record over the objects the corpus already
    has, and it says so. LOSSY-PROJECTION TEST: the relation vector discards the
    group element entirely and retains only its expression over Fb; the discard
    is Sigma-compatible because adding a factor-base element adds a basis vector,
    and it is lossy in the representation used because distinct points with the
    same relation support differ (the fibre of the projection is non-trivial
    whenever |Fb|^{m_a} > r, which is the regime every filed law operates in).
    Since no NEW object is proposed, the "price the one open number" obligation
    is discharged by (C1)'s single free scalar: the yield lambda_x, whose
    measurement is the business of IDEA-20260922-8ac1ea and of the RELN
    questions, not of this record.

    WHY THE DECOMPOSITION IS EXACT AND NOT A SLOGAN. The binary decomposition
    pipeline has four inputs: the field F_{2^m} with a basis; the factor base V
    (an F_2-subspace or coset, chosen by the attacker, not by the curve); the
    arity m_a; and the curve. The curve enters at exactly three places and they
    are separable:
      (i)  S_3 and hence every chained/Weil-descended equation: through b only.
      (ii) E-side membership x in x(E), i.e. Tr(x + a + b/x^2) = 0, and with it
           the trace-parity class map P -> Tr(x_P) + Tr(a) computing E/2E
           (H-SEMBIN-83a856, supported): through a and b.
      (iii) Whether tau is an endomorphism of E at all: through "a and b both in
           F_2", which is the Koblitz condition, and NOT through either alone.
    Path (i) moves only the constants of the descended system; path (ii) moves
    only the yield; path (iii) moves the symmetry group of the whole problem.
    (C1) is the statement that every filed COST law is blind to (i) and (ii)
    except through lambda_x, and that only lines that opt into (iii) see any
    curve at all. The Semaev/Nagao asymptotics do not opt in, which is precisely
    why "the FIPS binary curves at n = 409, 571" is a statement about two FIELDS
    and reaches four curves with two different verdicts.

    WHAT THE REACH FAN IS. Assumption 1 (Semaev 2015, d_F4 <= 4) has, in the
    SEMBIN questions' own framing, four live resolutions: (A1) holds for all k;
    (A2) holds only for k <= ceil(n/m_a) (Semaev's Section 4.4 caveat); (A3)
    holds only for k <= k_0 with k_0 an absolute constant (the reading
    IDEA-20260913-9c54f9 shows the FIPS conclusion actually needs); (A4) fails.
    This record does NOT decide among them -- that is RQ-SEMBIN-fa2e3f's --
    and it does not recharge Table 3 -- that is IDEA-20260913-9c54f9's. It takes
    each resolution's cost column as an input and emits the ten-row verdict with
    the (C2) baseline beside it and the (C3) sign attached, so that a resolution
    arriving from the SEMBIN lane converts into a per-curve reachability verdict
    by table lookup rather than by a fresh derivation each time.

    PROPOSAL-TIME ARITHMETIC (mine, this session, from the audit dump at
    analysis/binstd-curve-audit/binary-curve-params.txt; NOT evidence, and NOT a
    substitute for FIPS 186-4 at claim strength). Reading bitlength(order) and
    cofactor off the dump and applying the (C2) formulas in log2:
      curve    log2 r   rho_neg   rho_<tau,-1>   note
      K-163    162.0    80.83     77.16          h = 2, a = 1, b = 1
      B-163    162.0    80.83     --             h = 2 (sect163r2)
      K-233    231.0    115.33    111.40         h = 4, a = 0, b = 1
      B-233    232.0    115.83    --             h = 2
      K-283    281.0    140.33    136.26         h = 4
      B-283    282.0    140.83    --             h = 2
      K-409    407.0    203.33    198.99         h = 4
      B-409    408.0    203.83    --             h = 2
      K-571    569.0    284.33    279.75         h = 4
      B-571    570.0    284.83    --             h = 2
    and for the two extra rows this lane owns: sect193r1/r2 (log2 r = 192.0,
    h = 2, NOT a subfield curve) rho_neg = 95.83 with no Frobenius row at all;
    sect239k1 (log2 r = 237.0, h = 4, a = 0, b = 1, a Koblitz curve) rho_neg =
    118.33, rho_<tau,-1> = 114.38. The K/B gaps Delta_rho(m) = rho_neg(B-m) -
    rho_<tau,-1>(K-m) are 3.67, 4.43, 4.57, 4.84, 5.08 bits at m = 163, 233,
    283, 409, 571. Those five numbers ARE the discriminator of (C3), and they
    are the whole per-curve content of any Frobenius-blind claim about "the FIPS
    binary curves".
  novelty_status: unverified
  origin:
    kind: idea-generator lane B (FIPS 186-4 binary curves), batch of 2026-09-22
    date: '2026-09-22'
    scope: >-
      Population-indexed composition over already-filed mechanism records. No new
      mechanism, no new object, no run at m >= 131.
    overlap_review: >-
      NEAREST FILED NEIGHBOURS AND WHAT IS ADDED.
      (1) IDEA-20260913-41c4f0 costs Nagao's Theorem 1 at the five FIPS LABELS
      against vOW rho. It is indexed by n, treats "FIPS binary label" as a
      synonym for a value of n, and never splits K from B. What is added here is
