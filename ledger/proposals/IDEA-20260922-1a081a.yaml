  assumptions:
    - >-
      DECLARED OFF-LIMITS COMPONENT USED: F2 (factor-base decomposition) of
      IDEA-20260802-002 is the component, as the question requires. What is added
      beyond F2 is not a new relation mechanism but the indexing theorem (C1) and
      the sign result (C3); the record introduces no factor base and therefore
      has no KN-OPEN-020 obligation of its own.
    - >-
      F1 (walk-collision) is used as the BASELINE, not as a lens, and is charged
      with the curve's own symmetries as the question's constraint demands.
    - >-
      The fan takes each Assumption-1 resolution's cost column as an INPUT. This
      record grants whichever resolution it is handed and tests none of them.
    - >-
      "Relation-dominated branch" in (C3) means the regime in which relation
      collection, not linear algebra and not descent, is the dominant term. When
      linear algebra dominates, the Frobenius-aware gain is m^2 rather than m and
      Delta(m) = 0.5 - 1.5*log2(m); the fan reports which branch each cell is on.
  proof_search_map:
    bottleneck: >-
      Not an algorithmic step. The bottleneck is that the program's binary cost
      records are indexed by n and the question's decision target is indexed by
      curve, so every "which curve does this reach" question currently requires a
      fresh derivation and has been answered zero times.
    baseline_embedding:
      parameter_slice: >-
        m_a = 1, |Fb| = 1: the degenerate index calculus in which the factor base
        is a single point and the "decomposition" is a scalar search. At that
        slice T_IC degenerates to exhaustive search 2^{log2 r} and Delta(m)
        reduces to the pure baseline gap 0.5*log2(m) + 0.5, which is
        independently checkable against the rho table.
      reproduction_check: >-
        Reproduce, cell for cell, the ten rho numbers in the mechanism table from
        the audit dump by an independent script, and reproduce
        IDEA-20260915-8fe0ef's n = 17 pair (227, 55) from the same formulas.
        A pipeline that cannot emit 227 and 55 has not implemented (C2).
    observation_collision:
      observable: >-
        Delta(m) = M(K-m) - M(B-m), the signed per-curve margin difference in
        bits at fixed m.
      distinct_preimage_search: >-
        Delta(m) near zero has at least three distinct preimages: (a) a
        Frobenius-blind line with m near 2 (impossible at deployed m, so
        excluded); (b) a Frobenius-aware line on the linear-algebra-dominated
        branch whose relation branch is blind, giving cancellation between the
        m and m^2 terms; (c) a line whose yield lambda_x differs between K-m and
        B-m by a factor near m, which (C1) asserts does NOT happen and which
        IDEA-20260922-8ac1ea measures. The fan separates them by reporting the
        branch and lambda_x as columns rather than only the margin.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          the reachability table's attack side re-presented as a 5-column object
          (one per m) plus a 10-row baseline object plus a single curve-indexed
          scalar lambda_x, instead of a 10x k matrix of independent cells.
        predicted_gain: >-
          halves the number of cells that need an independent computation, makes
          the K/B difference a one-line consequence rather than a derivation, and
          exposes lambda_x as the only place a curve fact can hide.
      - transform: observable_fiber
        proposed_object: >-
          the fibre of "attack column" over "curve" -- the set of curves a single
          computed cost applies to verbatim.
        predicted_gain: >-
          turns "which curves does this claim reach" from a judgement into a
          lookup, and makes any record that claims a curve-specific index-calculus
          cost without naming a curve-dependent input immediately auditable.
    quantifier_order: >-
      (C1) is: FOR EVERY filed cost law L in this program's binary lane, THERE
      EXISTS a factorisation L = f(m, l, m_a, omega) * g(lambda_x) -- a statement
      about the corpus, falsifiable by exhibiting ONE filed law that reads a or b
      otherwise. (C3) is: FOR EVERY m in the FIPS set and FOR EVERY line in a
      named regime, Delta(m) has the stated sign -- a statement about the two
      regimes, not about any curve's security, and it cannot contradict any
      asymptotic theorem because it compares charged costs at fixed m.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under the cost laws filed in this repository as of 2026-09-22, and with
        matched rho charged at sqrt(pi r/(4m)) on Koblitz rows and
        0.886 sqrt(r) elsewhere from the parameters in
        analysis/binstd-curve-audit/, the per-curve margins of the ten FIPS
        binary curves are [table], the K/B gap at equal m is
        0.5 log2(m) + [h-bit], and its sign is [+/-] according to whether the
        line is Frobenius-aware." Conditional on the corpus, silent on security,
        and asserting nothing about whether any resolution of Assumption 1 is
        true.
      nearby_object_control: >-
        sect193r1 and sect193r2. They have prime m = 193, no subfield structure,
        and therefore NO Frobenius row at all -- so Delta is undefined for them,
        and any pipeline that emits a <tau,-1> baseline for sect193 has applied
        the Koblitz correction by extension degree instead of by curve. The
        second control is sect239k1, a Koblitz curve at m = 239 that is NOT in
        the FIPS set: it must receive a Frobenius row while c2tnb239v1/v2/v3 over
        the same field must not.
    proof_obligations:
      - claim: No filed binary cost law reads a or b except through lambda_x and r.
        responsibility: correctness
      - claim: The rho column is charged with the curve's own symmetry group, per curve.
        responsibility: baseline
      - claim: Cofactor h is read per curve from the dump, never assumed equal within a pair.
        responsibility: correctness
      - claim: Each cell reports which branch (relation- or linear-algebra-dominated) it is on.
        responsibility: scope
      - claim: No cell asserts a resolution of Assumption 1; each is labelled with its input column.
        responsibility: scope
      - claim: No claim about any deployed curve's security is made at any outcome.
        responsibility: scope
    not_applicable_reason: null
