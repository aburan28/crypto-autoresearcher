  predictions:
    - {metric: "toy decryption-agreement rate", direction: "higher", minimum_effect: "agreement at least 0.85 over N at least 200 trials if hardcore-invariance holds, against chance baseline 0.50 plus-minus 0.07"}
    - {metric: "distinct-preimage hardcore-flip rate", direction: "different", minimum_effect: "if at least 0.15 of Inv-recovered preimages are valid but give flipped hc bit, template fails with preimage-non-uniqueness obstruction"}
  minimal_test:
    design: "Implement syntax only at one declared toy prime slice with fixed E0, L, Lp, B, S; run N at least 200 random-bit encryptions with fresh r, decrypt with the stated toy Inv, and record agreement, preimage equality, and failure taxonomy."
    controls: ["null inverter guessing a random bit, must score near 0.50", "public-only decryptor without sk, must not exceed chance plus tolerance", "fixed-seed replay for determinism of Eval and hc"]
    required_metrics: ["agreement rate with Wilson interval", "hardcore-flip rate among valid preimages", "inverter success and failure-taxonomy counts", "per-operation toy timings with no extrapolation"]
  falsification_conditions:
    - "Agreement inside the chance band falsifies the correctness claim and returns hardcore-non-invariance or inverter-incompleteness."
    - "Valid recovered paths with flipped hc bits falsify the chosen predicate and return preimage-non-uniqueness with forward repair to a path-invariant predicate or template abandonment."
    - "Eval requiring sk on any input is a circularity obstruction that invalidates the instance under constraint 3."
    - "Inv finding no path at toy size is inverter-incompleteness on that slice, never evidence about hardness."
  confounders:
    - "Small-p endpoint collisions inflating distinct-preimage counts."
    - "Non-canonical endpoint encodings or twist tie-breaks masquerading as preimage differences."
    - "Toy Inv parameter tuning standing in for the stated KLPT shape."
    - "PRNG bias in r sampling or walk-step expansion."
  interpretation_limits:
    - "Toy syntax and correctness only; no security, hardness, or parameter extrapolation."
    - "No IND-CPA, IND-CCA, KEM, deployment, or secure slash deployable language."
    - "Scoped to the tested prime, walk lengths, bound B, and solver stated in the run."
  heuristic_assumptions:
    - id: "H1"
      statement: "For walk length Lp at or above the stated mixing bound, the Eval endpoint distribution is epsilon-close to stationary on the supersingular graph and sampled smooth-degree integers follow the uniform-integer smoothness law at that size."
      rigorous_support: "Ramanujan expansion and mixing bound for the supersingular graph plus the Canfield-Erdos-Pomerance smoothness theorem, both recalled and unchecked here."
      validation_plan: "Sample endpoints at the toy prime via Deuring-tracked walks, compare endpoint histogram to stationary by chi-square, compare empirical smoothness counts to Dickman-de Bruijn rho, add tail check on smoothest sample, and record the toy-to-crypto transfer assumption explicitly."
    - id: "H2"
      statement: "The stated KLPT-shape inverter given a correct maximal order returns a B-smooth E_pk to E_c path with probability at least q on Eval-produced endpoints."
      rigorous_support: "Proved KLPT output bound under GRH plus heuristic prime-sampling density, recalled and unchecked here."
      validation_plan: "Measure toy success rate versus predicted prime-sampling density, compare latency distribution, tail-check largest sampled prime, and state parameters and transfer limits."
