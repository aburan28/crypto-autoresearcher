idea:
  id: "IDEA-20261007-20f660"
  question_id: RQ-SSI-1946c9
  status: proposed
  added: '2026-10-07'
  approved_by: null
  title: "Random-walk endpoint hardcore-mask PKE template with public evaluation"
  class: mechanism
  claim: "There exists a well-typed toy PKE syntax (KeyGen, Eval, Encrypt, Decrypt) where Encrypt uses only pk plus public coins via a public walk-evaluation Eval, Decrypt inverts Eval endpoints using only the EndRing witness via a stated path-finder, and toy decryption-agreement reaches the stated threshold; otherwise the run exhibits the named preimage-non-uniqueness, hardcore-non-invariance, circular-evaluation, or inverter-incompleteness obstruction."
  mechanism: "KeyGen starts from a base curve E0 with known EndRing (example slice: j=1728 curve over F_{p^2} for p=3 mod 4 with explicit quaternion basis), takes an honest smooth-degree random walk w_sk to E_pk while pushing the order forward through explicit Velu steps (Deuring tracking), and outputs sk as an EndRing basis of E_pk with pk as (p, E_pk encoding, smoothness bound B, walk lengths L and Lp, hardcore selector S, Eval description, auxiliary list defaulting to empty). Public Eval(pk, r) expands public randomness r into Lp smooth steps from E_pk and outputs a canonical endpoint encoding E_c. Encrypt of a 1-bit m samples uniform r, sets c1=Eval(pk, r) and c2=m xor hc_S(r) with hc_S a public Goldreich-Levin-style parity predicate and no hash or ROM. Decrypt runs a stated inverter Inv(sk, c1) that finds a smooth E_pk to E_c path using sk and re-derives the lexicographically-first preimage r-prime with Eval(pk, r-prime)=c1, then outputs m-prime=c2 xor hc_S(r-prime). Correctness holds iff hc_S(r-prime)=hc_S(r). Reduction skeleton is EndRing over D_KeyGen to path-finding (GRH equivalence shape) to one-way inversion of f_pk(r)=Eval(pk, r) to 1-bit indistinguishability; each hop is a skeleton entry only with no toy security inference."
  novelty_status: unverified
  citations:
    - {ref: "KN-OPEN-013", provenance: "recalled", claim: "Post-SIDH EndRing versus path-finding context and Otilde(p^{1/4}) baseline", verified_by: null}
    - {ref: "KN-LIT-074", provenance: "recalled", claim: "Conditional EndRing to isogeny-path equivalence under GRH", verified_by: null}
    - {ref: "KN-TECH-028", provenance: "recalled", claim: "Deuring and KLPT context as ingredients", verified_by: null}
    - {ref: "IDEA-20261004-e4c461", provenance: "recalled", claim: "Label-transport barrier template; this idea differs by testing preimage-non-uniqueness of a public Eval rather than hidden labelings", verified_by: null}
    - {ref: "KN-LIT-6572", provenance: "recalled", claim: "Prior supersingular PKE pointer to position against, not checked", verified_by: null}
    - {ref: "KN-LIT-6628", provenance: "recalled", claim: "Prior supersingular PKE pointer to position against, not checked", verified_by: null}
  assumptions:
    - "D_EndRing is the honest-KeyGen output distribution: toy prime p, fixed E0 with known order, step primes {2, 3}, no-backtrack walk of length L, PRNG stated in the run."
    - "Output equivalence: sk and sk-prime are equivalent iff each contains the other (discriminant plus containment check at toy size, procedure stated); failure is inequivalence, not a break."
    - "Auxiliary data defaults to none; any torsion basis, torsion image, orientation descriptor, trusted parameter, or hidden path appended to pk is listed separately and priced by IDEA-20261007-cd446e."
    - "Encrypt receives no secret witness; any Eval needing sk is a circularity obstruction that invalidates the instance."
    - "Unconditional syntax claim at toy scale only; 1-bit indistinguishability hop is a skeleton entry with no security claim."
  proof_search_map:
    bottleneck: null
    baseline_embedding: {parameter_slice: null, reproduction_check: null}
    observation_collision: {observable: null, distinct_preimage_search: null}
    constructive_transforms: []
