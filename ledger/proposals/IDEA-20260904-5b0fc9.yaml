idea:
  id: IDEA-20260904-5b0fc9
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  handoff_id: TASK-20260904-9a7471
  added: '2026-09-04'

  title: >-
    "CGL IS AFFECTED" IS A STATEMENT ABOUT AN ENDOMORPHISM AND A CGL COLLISION IS
    A STATEMENT ABOUT TWO EQUAL-LENGTH 2-POWER PATHS, AND THE TWO ARE SEPARATED
    BY A LENGTH OVERHEAD NOBODY HAS MEASURED: the p^{1/3} algorithm returns
    alpha of degree (deg omega)^2 p delta, and turning it into a colliding
    message pair requires an ideal-to-isogeny conversion whose output exponent is
    kappa * log_2 p for an unmeasured kappa, against an EXISTENCE FLOOR of
    (1/2) log_2 p -- so there is a message-length band in which the attack
    produces nothing and CGL's resistance there is governed by non-existence
    rather than by hardness

  class: measurement

  claim: >-
    STATED FIRST. The frozen source's scope statement is not disputed: at
    arbitrary message length the CGL hash IS affected, and this record agrees.
    What is claimed is that the affectedness is LENGTH-INDEXED, that the index is
    a measurable ratio kappa, that this program has never measured or even named
    it, and that CGL's security margin in the band below kappa * log_2 p is
    currently unstated in either direction.

    (A) WHAT A CGL COLLISION IS, PRECISELY. The CGL hash walks the 2-isogeny
    graph from a fixed base curve E_0, one message bit selecting one of the two
    non-backtracking continuations at each step, and outputs the j-invariant of
    the endpoint. A collision on two messages of the SAME length L is a pair of
    DISTINCT non-backtracking 2-power isogeny paths E_0 -> E_t of degree 2^L
    each. Composing one with the dual of the other gives an endomorphism of E_0
    of degree 2^{2L} whose kernel is CYCLIC (the non-backtracking and distinctness
    conditions are exactly cyclicity of the composite). Conversely a cyclic
    2^{2L}-degree endomorphism of E_0 splits into two distinct non-backtracking
    2^L-paths and is a collision. SO: CGL COLLISION AT LENGTH L IS EXACTLY
    "PRODUCE A CYCLIC ENDOMORPHISM OF E_0 OF DEGREE 2^{2L}".

    (B) THE EXISTENCE FLOOR, WHICH IS FREE ARITHMETIC. The number of
    2^{2L}-degree endomorphisms of a fixed supersingular curve is, by the Brandt
    / Eichler mass count, about 12 * 2^{2L} / p on average over curves. That is
    below 1 unless 2^{2L} >~ p/12, i.e.
        L >= (1/2) log_2 p - O(1).
    BELOW THAT LENGTH NO COLLISION EXISTS AT ALL, for any adversary, at any cost.
    CGL's collision resistance in that band is INFORMATION-THEORETIC and is
    nothing to do with the endomorphism problem. This is elementary and it is not
    in any record in this program.

    (C) WHAT THE ATTACK ACTUALLY PRODUCES. Theorem 1.1's algorithm returns
    alpha = omega-hat o Frob o phi o omega in End(E'), of reduced norm
    (deg omega)^2 * p * delta with delta up to (p/2)^{1/3} and deg omega = 2^{n},
    n = O(log p). That is NOT a 2-power degree, NOT cyclic in general, and NOT an
    endomorphism of E_0. Converting it into a CGL collision requires the full
    chain:
      K1. Move to E_0: run the algorithm on E_0 (fine, E_0 is a supersingular
          curve like any other -- unless End(E_0) is already public, in which
          case the whole chain is polynomial and CGL is broken for reasons that
          predate this algorithm; see interpretation limits).
      K2. Go from ONE endomorphism to the full ring End(E_0), which is
          Corollary 1.2's cascade with its unstated call count and saturation
          step -- audited separately in IDEA-20260904-9bf9c6.
      K3. Produce a LEFT IDEAL of End(E_0) of 2-power norm 2^{2L}, cyclic,
          i.e. solve the KLPT-style norm equation in the 2-power case.
      K4. Translate the ideal into an actual isogeny path (ideal-to-isogeny),
          and check the composite is cyclic so the two halves really are
          distinct non-backtracking messages.
    STEPS K3-K4 ARE WHERE THE LENGTH IS DECIDED, and every classical account this
    session can recall says the achievable exponent is
        2L = kappa * log_2 p,   kappa > 1 strictly,
    with kappa around 3 for the original KLPT norm-equation solution and smaller
    for later variants. Against the floor 2L >= log_2 p (kappa = 1) of (B), the
    attack therefore lands a factor kappa above the shortest collision that
    exists.

    (D) THE CONSEQUENCE, STATED AS A BAND RATHER THAN A VERDICT. Write
    L_floor = (1/2) log_2 p and L_attack = (kappa/2) log_2 p. Then:
      * L < L_floor: NO COLLISION EXISTS. Resistance is unconditional.
      * L_floor <= L < L_attack: a collision exists but the p^{1/3} route does
        not produce one. What the true cost is in this band is OPEN, and it is
        open in an interesting direction -- shorter collisions are RARER, so the
        band is where a generic search is hardest and where a structural attack
        would have to be cleverer, not lazier.
      * L >= L_attack: the p^{1/3} route applies and CGL is affected exactly as
        the frozen source says.
    A deployment that hashes arbitrary-length messages is in the third regime and
    the scope statement is exact for it. A deployment that uses CGL as a
    FIXED-LENGTH compression function, or that truncates, or that bounds message
    length -- and any Merkle-Damgard or sponge-style construction over CGL does
    exactly this per block -- may sit in the second band, where the published
    scope statement asserts more than the algorithm delivers.

    (E) THE MEASUREMENT. kappa is not a matter of opinion. At toy primes the
    entire 2-isogeny graph is enumerable, so the SHORTEST cyclic 2-power
    endomorphism at every vertex is computable exactly by breadth-first search --
    giving L_floor empirically, per curve, with its distribution. And an
    implementation of the K3-K4 chain at the same primes gives L_attack
    empirically. The ratio kappa = L_attack / L_floor is then a measured number
    with error bars over a stated scope, which is precisely what
    docs/inventor-protocol.md section 4 asks a negative or scoping result to
    produce instead of prose.

    (F) NOT CLAIMED. That CGL is safe. That the frozen source is wrong. That
    kappa is large -- modern ideal-to-isogeny variants may well achieve kappa
    close to 1, in which case the band is empty, the record closes with a
    measured kappa, and the scope statement is vindicated with a number attached
    for the first time.

  mechanism: >-
    TRACKED OBJECT: the LENGTH BUDGET of a collision -- the pair
    (L_floor(E_0), L_attack(E_0)), i.e. the shortest cyclic 2-power endomorphism
    degree that EXISTS at E_0 and the shortest one the attack chain can
    CONSTRUCT -- carried per curve rather than per algorithm.

    LOSSY-PROJECTION TEST (algebraic, zero compute). The projection sends the
    whole attack -- an algorithm, an endomorphism ring, an ideal, an isogeny
    path -- to two integers measured in bits. It is enormously lossy: neither the
    collision nor the ring is recoverable from the pair. What it discards is
    discarded COMPATIBLY with the operation that matters here, namely COMPOSITION
    OF PATHS: lengths add under composition, so L is additive where degrees are
    multiplicative, and the retained quantity propagates deterministically
    through every step of the chain K1-K4 (each step either adds a known number
    of bits or is length-neutral). That additivity is exactly why a length budget
    can be tracked end to end while the objects it summarises cannot. Contrast
    the projection that FAILS the test: tracking the DEGREE of the endomorphism
    rather than its 2-adic length loses nothing (degree and length determine each
    other for 2-power isogenies) and is a change of units, not an object.

    WHY THE TWO NUMBERS ARE DIFFERENT AND THAT IS THE WHOLE POINT. L_floor is a
    property of the LATTICE End(E_0) -- the shortest cyclic vector whose norm is
    a power of 2 -- and is a representation question for a quaternary quadratic
    form restricted to a very thin set of target values. L_attack is a property
    of the ALGORITHM that solves the norm equation, and no norm-equation solver
    is required to return a minimal solution; they return a solution that exists
    and is findable. The gap between "a representation exists" and "this solver
    finds one" is the entire content of kappa, and it is the same gap that makes
    KLPT-style outputs long.

  exponent_lever:
    is_exponent_moving: false
    statement: >-
      EXPLICITLY NOT EXPONENT-MOVING. No exponent is improved and none is
      claimed. This is scope and feasibility work on a SURVIVING assumption's
      deployment, and it is offered at medium priority on the grounds that (i)
      the frozen source names CGL first on its affected list, (ii) this program
      has recomputed CGL's cost margins (IDEA-20260815-72c70d) without ever
      checking whether the attack produces an object of the right shape, and
      (iii) the measurement is exact at toy scale and produces a reusable number.
      A record that improves nothing and says so is ranked accordingly.

  novelty_status: unverified

  novelty_screen:
    kb_retrieval: >-
      NOT AVAILABLE. CRYPTO_KB_QDRANT_URL is the in-memory sentinel; no query was
      issued and no silence is read as evidence of absence.
    method: >-
      Read this session: the 195-entry SSI/isogeny digest in full; the frozen
      source in full; IDEA-20260815-72c70d lines 1-60. Greps over
      ledger/proposals for CGL (18 files), KLPT, 2-power cycle, message length,
      collision resistance. No external source was opened.
    results: >-
      Eighteen records mention CGL. IDEA-20260815-72c70d recomputes CGL's
      collision and preimage MARGINS under the new baseline with memory charged
      and is explicitly a cost recomputation. IDEA-20260808-dfd76a censuses the
      affected list for omissions. IDEA-20260806-a3ef00, IDEA-20260804-84328c and
      IDEA-20260804-4c9ac0 are structural records that mention CGL in passing.
      NOT ONE of them states that a CGL collision is a CYCLIC 2-POWER
      ENDOMORPHISM, none computes the existence floor, and none mentions the
      conversion length. The strings "KLPT" and "ideal-to-isogeny" appear in the
      SQIsign lane (IDEA-20260805-2a669e, IDEA-20260725-003) and never in a CGL
      context.
    verdict: >-
      UNVERIFIED. The correspondence in (A) is textbook and the floor in (B) is
      an elementary mass count; both are certainly known. The value of kappa is
      certainly known to the isogeny community and is stated in the KLPT
      literature this session did not open. What is claimed as new is confined to
      this program: no record states the length band, and the frozen source's
      scope listing has been quoted here without it. A reviewer with retrieval
      should read the KLPT paper and the modern ideal-to-isogeny variants, which
      may make the whole band empty in one read.

