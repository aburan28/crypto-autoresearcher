  null_object_control: >-
    NULL OBJECT ONE (blocking): the GENERIC BIRTHDAY SEARCH on the digest, run at
    the same toy primes and the same message lengths. It bounds the band's
    significance from below: a band in which generic search is already cheaper
    than the structural route is a band nobody would attack structurally, and
    reporting it as a security-relevant gap would be an artifact of looking only
    at structural attacks.
    NULL OBJECT TWO (blocking): the BACKTRACKING NON-COLLISION. Every claimed
    collision is decoded to two messages and the messages compared; equal
    messages are a null result, not a collision. This is the observation
    collision of the proof_search_map turned into a code-level control.
    KNOWN-ANSWER CALIBRATION (blocking): the Brandt mass count must reproduce the
    measured L_floor within a few bits at all four primes; and on a base curve
    with known End the chain must run with K1-K2 free, isolating kappa.
    DECAY CHECK: the count of cyclic 2^{2L}-endomorphisms must GROW like 2^{2L}/p
    as L increases, and L_floor must GROW like (1/2) log_2 p across the four
    primes. A floor that does not move with p is the canonical artifact tell of
    docs/inventor-protocol.md section 3 -- it would mean the search is limited by
    the graph's diameter rather than by arithmetic -- and the run is rejected
    rather than interpreted.

