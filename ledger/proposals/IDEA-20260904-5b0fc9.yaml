  assumptions:
    - >-
      A CGL collision at length L is exactly a cyclic 2^{2L}-degree endomorphism
      of the base curve. Stated in (A) as a correspondence and verified directly
      at toy scale rather than assumed.
    - >-
      End(E_0) is NOT public. If it is, CGL is broken in polynomial time by
      KLPT alone and has been since long before the p^{1/3} algorithm; this
      record then concerns only the trusted-setup variants, which is where
      IDEA-20260808-dfd76a's finding lives.
    - >-
      The deployed CGL parameter of interest is p of order 2^256, per the frozen
      source's own report of [14]'s suggestion.
    - >-
      Toy 2-isogeny graphs at p in {2437, 3889, 5737, 7333} are fully enumerable,
      so the shortest cyclic 2-power endomorphism at every vertex is exact ground
      truth by breadth-first search.

  proof_search_map:
    not_applicable_reason: >-
      NOT PROOF-ORIENTED. This record proposes no theorem, no asymptotic bound,
      no certificate family, no reduction and no closure argument. It proposes a
      MEASUREMENT of two integers per curve and a scope statement conditioned on
      their ratio. The two audits of KN-TECH-080 that could still apply are
      recorded here rather than silently omitted, because section 8 requires a
      non-applicable audit to say why:
      BASELINE REPRODUCTION -- applicable and adopted as a control rather than as
      a map entry: the measured L_floor distribution must reproduce the Brandt
      mass count 12 * 2^{2L}/p = 1 at L = (1/2) log_2 p - O(1) across the four
      toy primes, and that reproduction is a blocking control in minimal_test.
      OBSERVATION COLLISION -- applicable and material, so it is stated in full
      here: the observable is "a cyclic 2^{2L}-degree endomorphism of E_0", and
      two DISTINCT ground-truth objects share it -- (i) a genuine collision on
      two distinct non-backtracking messages, and (ii) a composite that is a
      2-power endomorphism but whose factorisation BACKTRACKS, which decodes to
      the SAME message twice and is not a collision at all. The separating
      condition is cyclicity of the composite's kernel, and an implementation
      that omits the cyclicity check will report collisions that are not
      collisions. This is a real and easy failure mode and it is a required
      metric.
      The remaining two audits -- quantifier order and method ceiling -- have no
      content for a two-integer measurement, and are recorded as inapplicable
      rather than filled with a restatement of the claim.

  object_first_candidate:
    established_families_off_limits: >-
      Declared off-limits as the primary lens: the endomorphism search itself
      (the incumbent, the smooth ball, the alpha axis) -- this record takes the
      endomorphism as GIVEN and looks only downstream of it; generic collision
      search on the digest, which is IDEA-20260815-72c70d's own null; cost-margin
      recomputation, which is 72c70d's whole subject; and the trusted-setup /
      known-End_0 lane, which is IDEA-20260808-dfd76a's.
    tracked_object: >-
      The length budget (L_floor, L_attack) of a collision at the base curve.
    lossiness: >-
      Two integers standing for an entire attack chain; nothing about the chain
      is recoverable from them.
    propagation: >-
      Additive and exact: lengths add under composition of paths, so each step
      K1-K4 contributes a measurable number of bits and the budget can be
      audited end to end. This additivity is the one-step propagation rule and is
      what makes the object trackable.
    newness_score: >-
      As mathematics, elementary and old. As a record here, absent: no CGL record
      in the pool states the correspondence, the floor, or the conversion length.
    testability_score: >-
      Very high. L_floor is exact by breadth-first search at toy primes;
      L_attack is exact once the K3-K4 chain is implemented; the ratio is a
      measured number.
    survival_score: >-
      The object survives for any graph-walking hash with a fixed step degree,
      so the same measurement immediately applies to any CGL variant using
      3-isogenies or a different base, which is stated as forward guidance rather
      than claimed as a result.

  predictions:
    - metric: >-
        M1 -- L_floor(E_0), the shortest CYCLIC 2-power endomorphism exponent,
        measured exactly by breadth-first search over every vertex of the four
        committed toy 2-isogeny graphs
      direction: different
      minimum_effect: >-
        Predicted to concentrate at 2L = log_2(p/12) + O(1), matching the Brandt
        mass count, with a spread of a few bits and a left tail at the vertices
        with extra automorphisms. A measured distribution centred more than 3
        bits away from the mass-count prediction refutes the counting model at
        these sizes and the record must re-derive the floor before proceeding.
    - metric: >-
        M2 -- kappa = 2 L_attack / log_2 p, measured by running the K3-K4 chain
        at the same toy primes with End(E_0) supplied from ground truth
      direction: higher
      minimum_effect: >-
        Predicted strictly above 1. Recalled expectation is around 3 for a
        classical KLPT-style solver and lower for modern variants. A measured
        kappa within 1.2 of 1 EMPTIES THE BAND of claim (D) and closes the
        record benignly with a number; a measured kappa above 2 opens a
        message-length band of width at least (1/2) log_2 p bits in which the
        attack does not apply.
    - metric: >-
        M3 -- fraction of K3-K4 outputs whose composite is NOT cyclic, i.e.
        whose two halves backtrack and decode to the same message
      direction: lower
      minimum_effect: >-
        Predicted small but NONZERO. Every such output is a non-collision that a
        careless implementation would count as a collision, which is exactly the
        observation collision named in the proof_search_map. A measured fraction
        above 0.1 means the chain needs an explicit cyclicity enforcement step
        and its cost must be added to L_attack's accounting.
    - metric: >-
        M4 -- the preimage analogue: the shortest 2-power isogeny E_0 -> E_t for
        a uniformly random target E_t, measured exactly at toy primes, against
        the attack-achievable length
      direction: different
      minimum_effect: >-
        Predicted floor at 2^L >= p/12, i.e. L >= log_2(p/12), which is TWICE the
        collision floor -- so the preimage band and the collision band have
        different widths and must be reported separately. A record that quotes
        one band for both is wrong by a factor of 2 in the exponent of the
        length.
    - metric: >-
        M5 -- generic-search null: the cost of finding a length-L collision by
        birthday search on the digest, at each L in the band
      direction: different
      minimum_effect: >-
        Predicted about p^{1/2} independent of L once L exceeds the floor, since
        the digest space is the p/12 curves. THE BAND ONLY MATTERS WHERE THIS
        GENERIC COST EXCEEDS WHAT THE STRUCTURAL ATTACK WOULD HAVE COST, and
        reporting the band without this comparison would overstate it.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, and it may empty the record): read the KLPT paper
      and the modern ideal-to-isogeny variants and extract kappa with a citation.
      If kappa is close to 1, claim (D)'s band is empty, the record closes with a
      measured external number, and no compute is spent. STAGE 1 (minutes):
      enumerate the four committed toy 2-isogeny graphs, compute L_floor at every
      vertex by breadth-first search over CYCLIC 2-power endomorphisms, and score
      M1 against the Brandt mass count. STAGE 2 (hours): implement K3-K4 at the
      same primes with End(E_0) taken from quaternion-side ground truth, and
      score M2 and M3. STAGE 3 (minutes): the preimage analogue M4. STAGE 4
      (zero compute): the generic-search comparison M5 and the band width in bits
      at the deployed size p ~ 2^256, stated as illustrative arithmetic on
      recalled parameters and flagged as such. NO COLLISION IS SOUGHT AT ANY
      CRYPTOGRAPHIC PARAMETER, NO ENDOMORPHISM RING IS COMPUTED FROM A CURVE, AND
      NOTHING IN THIS TEST CONSTITUTES AN ATTACK ON A DEPLOYED SYSTEM.
    controls:
      - >-
        MASS-COUNT CALIBRATION (blocking). The measured L_floor distribution must
        match 12 * 2^{2L}/p = 1 within a few bits at all four primes before any
        band is reported. This is the baseline reproduction named in the
        proof_search_map.
      - >-
        CYCLICITY CHECK (blocking). Every claimed collision must be decoded back
        into two messages and the two messages compared. A "collision" whose two
        messages are equal is a backtracking artifact and is not a collision.
        This is the observation-collision separator and it must be enforced in
        code, not in prose.
      - >-
        RE-VERIFICATION CERTIFICATE (blocking). Every claimed collision at toy
        scale is verified by independently re-hashing both messages with a
        separate implementation of the walk, per docs/claims-and-verification.md.
        A claimed collision without a re-verified certificate is not admissible
        evidence in this program at any scale.
      - >-
        GENERIC-SEARCH NULL. Birthday search on the digest at the same primes,
        which bounds the band's significance from below and must not be exceeded
        by any structural claim.
      - >-
        KNOWN-END NULL. Run the whole chain on a base curve whose End is known by
        construction. There K1 and K2 are free and only K3-K4 contribute, which
        ISOLATES kappa from the cascade's cost. This is the arm that actually
        measures kappa; the full-chain arm measures the chain.
    required_metrics:
      - L_floor per vertex, per prime, with the mass-count residual
      - kappa per instance, distribution over at least 200 instances per prime
      - non-cyclic (backtracking) output fraction
      - preimage floor and attack length, reported separately from the collision numbers
      - band width in bits at p ~ 2^256, flagged as illustrative

  falsification_conditions:
    - >-
      F1. kappa measures within 1.2 of 1. The band is empty, the frozen source's
      scope statement is exact at every length above the existence floor, and the
      record CLOSES with a measured kappa -- a complete and useful outcome that
      costs one paper read plus a toy run.
    - >-
      F2. The measured L_floor distribution does not match the Brandt mass count.
      The existence floor of claim (B) is wrong; the whole band construction
      collapses and must be re-derived before anything else.
    - >-
      F3. The cyclicity check finds that most K3-K4 outputs backtrack. Then the
      correspondence in (A) is being used incorrectly by the chain and L_attack
      as measured is meaningless until the enforcement step is added and charged.
    - >-
      F4. Generic birthday search on the digest is cheaper than the structural
      route at every L in the band. The band is real but IRRELEVANT, and the
      record must say so rather than report a band that no attacker would care
      about.
    - >-
      F5. A reviewer establishes that deployed CGL usage is always
      arbitrary-length. Then the band has no deployment in it, the record's scope
      claim is vacuous in practice, and its surviving content is the existence
      floor and kappa as measured numbers.
    - >-
      F6. Budget exhaustion or an unavailable KLPT implementation. INFRASTRUCTURE
      outcome under AGENTS.md rule 5; never evidence about kappa.

  confounders:
    - >-
      C1. THE BIGGEST ONE: this record's whole band depends on a recalled value
      of kappa. If the modern ideal-to-isogeny variants used inside SQIsign2D
      already achieve near-minimal length -- which is plausible, since signature
      size is exactly what those variants optimise -- then kappa is near 1 and the
      band is empty. The record is written so that this outcome is a clean close
      rather than a disappointment.
    - >-
      C2. Toy primes have log_2 p around 11-13, so L_floor is 5 or 6 bits and
      kappa is measured over a range where constants dominate the asymptotics
      completely. The TREND across the four primes is the only transferable
      quantity, and even that is weak. No kappa measured at toy scale may be
      quoted as the deployed value; the deployed value must come from the
      literature read in Stage 0.
    - >-
      C3. End(E_0) is supplied from ground truth in the test, so the measurement
      isolates K3-K4 and says nothing about K1-K2. Any reading of the result as
      an end-to-end attack cost is a category error, and the full-chain arm
      exists precisely to keep the two separated.
    - >-
      C4. The 2-isogeny graph at small p has many short cycles for reasons of
      small-graph combinatorics rather than arithmetic, so L_floor's left tail at
      toy scale is contaminated. Vertices with extra automorphisms (j = 0, 1728)
      must be reported separately, with the convention fixed in advance.
    - >-
      C5. "CGL" is a family, not a scheme: base curve choice, step degree,
      message encoding, and whether the output is truncated all vary. The
      measurement is of the 2-isogeny, untruncated, fixed-base variant, and every
      number is scoped to it.

  interpretation_limits:
    - >-
      NO COLLISION IS PRODUCED AT ANY CRYPTOGRAPHIC PARAMETER AND NONE IS SOUGHT.
      Every measurement is at toy primes with p under 10^4 and is
      hypothesis-generating for the deployed regime only.
    - >-
      The frozen source's scope statement is NOT disputed. At arbitrary message
      length CGL is affected and this record agrees; the claim is that the
      statement is length-indexed and that the index has never been measured here.
    - >-
      kappa is a recalled external quantity. If it is near 1 the record's central
      claim is empty, and Stage 0 is designed to find that out first.
    - >-
      If End(E_0) is public -- the trusted-setup question of
      IDEA-20260808-dfd76a -- then CGL is polynomially broken independently of
      everything here and this record does not apply.
    - >-
      This record does not touch, cite, or depend on the frozen EXP-WESOVOW-001
      charging-law defect, the fitted_opt / PAPER_PAIRS anchor reconciliation,
      the P = 512 crossover, or the w = 2^80 sign.
    - >-
      SURVIVOR SCOPE. CGL publishes no torsion-point images under a secret
      isogeny -- indeed it publishes no secret isogeny at all -- so nothing here
      uses or assumes any, and the SIDH/SIKE break plays no role.
    - Academic and defensive cryptanalysis only, per RQ-SSI-001's constraints.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a fixed supersingular E_0 over F_{p^2}, the number of CYCLIC
        endomorphisms of degree 2^{2L} is c * 2^{2L}/p * (1 + o(1)) for
        2^{2L} > p^{1+epsilon}, with c an absolute constant depending only on the
        automorphism weight of E_0; consequently the least L with a cyclic
        2^{2L}-endomorphism is (1/2) log_2 p + O(1) for all but an o(1) fraction
        of curves.
      rigorous_support: >-
        RIGOROUS SIDE. The Brandt matrix diagonal entry B_{2^{2L}}(E_0, E_0)
        counts endomorphisms of that degree, its average over the p/12 curves is
        governed by the Eichler mass formula, and the total over all curves is a
        divisor-sum expression -- an exact identity, not an estimate. The cyclic
        restriction removes the endomorphisms divisible by [2^k], a set whose
        size is a lower-order term for 2^{2L} above p.
        CLASSICAL DISTRIBUTION STATEMENT IMITATED. The equidistribution of Brandt
        matrix entries about their mean, i.e. that a fixed curve receives its
        share of degree-n endomorphisms as an average curve would -- the same
        family of assumption as the frozen source's own Heuristic 1, and it can
        fail exactly at curves with unusually small endomorphisms, which is why
        the extreme left tail is a required metric rather than an aggregate.
      validation_plan: >-
        WHAT TO SAMPLE. The exact count of cyclic 2^{2L}-endomorphisms at every
        vertex, for L from 1 up to the graph diameter, at p in {2437, 3889, 5737,
        7333}. Fully exhaustive; no sampling error at all.
        SHORTCUT FOR LARGER p. The quaternion side: for a sampled maximal order,
        count vectors of norm 2^{2L} in the order directly, which is a lattice
        theta-series computation and needs no curve arithmetic. This reaches
        p = 5*2^248 - 1 using the frozen source's own order sampler, and it is
        the only way any number here becomes relevant to a deployed size.
        COMPARISON DISTRIBUTION. Empirical count against c * 2^{2L}/p on a
        log-log plot; fit the slope in L (predicted 2 in log_2 terms, i.e. the
        count doubles per unit of 2L) and the offset in p (predicted -1).
        TAIL CHECKS. (i) The MINIMUM of L_floor over all vertices at each prime,
        which is the curve most vulnerable to a short collision and which is the
        quantity a designer choosing a base curve would care about; (ii) the
        fraction of vertices whose L_floor is more than 2 bits below the mean,
        which is the "weak base curve" rate.
        PARAMETERS RECORDED: p, the automorphism convention at j = 0 and 1728,
        the cyclicity definition used, and the graph construction.
    - id: H2
      statement: >-
        The exponent kappa achieved by the K3-K4 chain is a constant independent
        of the input ideal and of p, so that L_attack = (kappa/2) log_2 p
        uniformly.
      rigorous_support: >-
        NONE ESTABLISHED HERE, and it is isolated so a reviewer can reject it
        without touching H1 or the existence floor. Norm-equation solvers of the
        KLPT family are analysed with output exponents of the form (constant)
        times log p, which is the shape H2 assumes, but the constant may depend
        on the ideal's norm, on the base curve's special structure, or on
        heuristic assumptions internal to the solver that this session cannot
        state.
      validation_plan: >-
        WHAT TO SAMPLE. The achieved exponent over at least 200 random left
        ideals per toy prime, with the base curve fixed, and then over three
        different base curves to test independence of the base.
        COMPARISON. The empirical distribution of 2 L_attack / log_2 p against a
        constant; report the coefficient of variation. A CV above 0.2 refutes H2
        and means kappa is a distribution, not a constant, in which case the band
        must be reported using its upper quantile rather than its mean.
        TAIL CHECK. The maximum achieved exponent, since a solver that
        occasionally returns a much longer isogeny widens the band in the
        direction that matters.
        TRANSFER ASSUMPTION, STATED. Toy-scale kappa is dominated by constants
        (confounder C2) and does NOT transfer; the deployed value must come from
        the Stage-0 literature read, and the toy measurement's only role is to
        check the SHAPE (constant times log p) and the base-independence.

  target_complexity:
    time_exponent: >-
      NO ALGORITHM IS PROPOSED AND NO EXPONENT IS IMPROVED. For reference, the
      cost of the attack chain this record scopes is p^{1/3+o(1)} for K1-K2
      (conditional on Heuristic 1, and with IDEA-20260904-9bf9c6's unmeasured
      call count) plus polynomial for K3-K4. What this record contributes is not
      a cost but a LENGTH: L_attack = (kappa/2) log_2 p bits, against an
      existence floor of (1/2) log_2 p bits.
    memory_exponent: >-
      Inherited p^{1/3+o(1)} from K1-K2; K3-K4 are polynomial-memory. Unchanged
      by anything here and recorded so a scope record is not read as a memory
      result.
    best_known: >-
      For CGL collision finding at unbounded message length: p^{1/3+o(1)} time
      and memory via the frozen source's cascade, conditional on Heuristic 1;
      p^{2/5+o(1)} unconditional via eprint 2026/1575 (abstract level, relayed);
      p^{1/2}(log p)^{O(1)} at polynomial memory via Delfs-Galbraith; and a
      generic birthday search on the digest at about p^{1/2} with tunable memory,
      which is the floor no structural attack may be reported as failing to beat.
      For collision finding BELOW L_attack: NO ALGORITHM IS KNOWN, and that gap
      is the record's subject.
    hidden_overhead: >-
      kappa itself is the hidden overhead, and it hides in the phrase "affected"
      rather than in an o(1). Additionally, K2 inherits Corollary 1.2's unmeasured
      call count and saturation, and K3 inherits whatever heuristics the
      norm-equation solver carries -- solvers in this family are typically
      analysed heuristically, so the chain's total conditionality is Heuristic 1
      PLUS the solver's own assumptions, which is strictly more than the frozen
      source's headline claim carries.
    tradeoff_note: >-
      Not applicable: no time-memory tradeoff is proposed. There is, however, a
      LENGTH-COST tradeoff implicit in the record and it is worth naming as
      forward guidance -- a solver willing to spend more time might return a
      shorter ideal, so kappa is presumably a function of the solver's own
      budget, and measuring kappa as a single number may itself be the wrong
      shape. That is left open.

  dominated_by: >-
    n/a in the attack sense -- NO RESULT IS CLAIMED AND NO ALGORITHM IS PROPOSED.
    The frontier was nonetheless checked row by row across time, memory and
    data/queries, so this is a checked null and not an unchecked one:
    (i) generic birthday collision search on the digest, about p^{1/2} time with
    tunable memory and zero preprocessing -- this row DOMINATES every structural
    route at any message length where the structural route does not apply, and it
    is the row that decides whether the band matters (prediction M5);
    (ii) Wesolowski p^{1/3} time and memory plus the conversion chain, heuristic
    -- the current best structural route at lengths above L_attack;
    (iii) Udovenko p^{2/5} time and memory, unconditional -- dominated on time by
    (ii) but not on assumptions, and it feeds the same conversion chain with the
    same kappa, so the band is IDENTICAL for it, which is worth noting;
    (iv) Delfs-Galbraith p^{1/2} at polynomial memory -- dominates every row on
    memory and is the right comparison at bounded memory;
    (v) van Oorschot-Wiener interpolation between (ii) and (iv);
    (vi) the polynomial break available when End(E_0) is public, which dominates
    everything absolutely on the trusted-setup variants and is out of scope here;
    (vii) data/queries: all rows use zero data and zero oracle queries.
    In the SCOPE sense the nearest incumbent is IDEA-20260815-72c70d, which
    dominates on breadth (it recomputes both margins with memory charged) and is
    dominated here on shape (it never asks whether the attack's output is a
    collision of the right length).
  sota_delta: >-
    +0 on time, +0 on memory, +0 on data/queries. No attack and no improvement.
    QUANTIFIED DELIVERABLES:
    (1) L_floor = (1/2) log_2 p - O(1), the message length below which NO CGL
    collision exists at any cost -- an unconditional statement this program has
    never recorded, measured exactly at four primes and validated at
    cryptographic size through the quaternion theta-series shortcut.
    (2) kappa, measured, with its distribution and its base-curve independence
    tested; the recalled expectation is around 3 and the record's value is the
    same whether the measurement confirms or refutes that.
    (3) The band width, (kappa - 1)/2 * log_2 p bits, stated at p ~ 2^256 as
    illustrative arithmetic and flagged as such.
    (4) The preimage analogue, whose floor is TWICE the collision floor, so a
    program quoting one band for both is wrong by a factor of two.
    (5) The cyclicity separator, without which an implementation reports
    non-collisions as collisions.

