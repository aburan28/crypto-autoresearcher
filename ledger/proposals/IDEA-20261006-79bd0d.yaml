idea:
  id: IDEA-20261006-79bd0d
  question_id: RQ-JINV-8fc13a
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Scaling-automorphism count on y^2 = x^3 + 1 over F_13 against one
    non-special model
  class: control
  claim: >-
    Let E_0 be y^2 = x^3 + 1 over F_13, which has j-invariant 0, and let
    E_gen be y^2 = x^3 + x + 1 over F_13. A scaling automorphism is a
    u in F_13-star such that (x, y) mapped to (u^2 x, u^3 y) preserves
    the equation. The number of such u on E_0 is exactly 6, and the
    number on E_gen is exactly 2. A count on E_gen of 3 or more, or a
    count on E_0 other than 6, is a negative. No discrete logarithm is
    computed, and the generic-group exponent 1/2 is unchanged.
  mechanism: >-
    PAIR (representation, Sigma): the representation is the scaling
    parameter u in F_13-star. Sigma is the set of maps
    (x, y) mapped to (u^2 x, u^3 y) that preserve the short-Weierstrass
    equation. Sigma is not translation. Trichotomy class:
    coordinate-dependent, because the surviving object is a coordinate
    change that preserves the model. The projection keeps only the
    count of such u and discards which points are moved. Many points
    share one u, so the projection is lossy. It is not a block system
    of the full translation group. Two explanations are separated before
    the count. Explanation A: E_0 has exactly the six scalings coming
    from u^6 = 1, and E_gen has exactly the two scalings u = plus or
    minus 1, so the only gap is the constant sqrt(6) versus sqrt(2)
    already stated in KR-RHO-0528e7. Explanation B: E_gen has a third
    scaling, so a non-special j carries an extra rational automorphism
    that the sqrt(|Aut|) constant does not price. No rho walk is run.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        An automorphism group of order m reduces rho iterations by
        sqrt(m). The opened row gives sqrt(6) for j = 0 and sqrt(4)
        for j = 1728, and says the exponent 1/2 does not change.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs a square-root number of group
        operations. This idea does not beat that bound.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks whether a special j confers an ECDLP
        advantage beyond the sqrt(|Aut|) constant.
      verified_by: ledger/questions/RQ-JINV-8fc13a.yaml
  assumptions:
    - E_0 and E_gen are nonsingular and ordinary over F_13. A singular or supersingular model is a failed setup.
    - j(E_gen) is neither 0 nor 1728. If it is, the non-special arm is invalid.
    - Two u that induce the same map (u^2, u^3) are counted once.
  proof_search_map:
    bottleneck: >-
      Whether a non-special j over F_13 has more than two scaling
      automorphisms.
    baseline_embedding:
      parameter_slice: >-
        One prime, p = 13, and two models. No rho iteration is run.
      reproduction_check: >-
        The identity u = 1 is a scaling automorphism of both models.
        If it is not, the count is invalid.
    observation_collision:
      observable: the integer count of scaling automorphisms
      distinct_preimage_search: >-
        Distinct j-invariants can share a count of 2. A count of 3 or
        more on E_gen is the collision that kills explanation A.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: the pair of models at p = 13
        predicted_gain: >-
          Two integers, 6 and 2. No exponent.
    quantifier_order: >-
      At p = 13, the scaling-automorphism count of E_0 is 6 and the
      count of E_gen is 2. This is one prime, not every prime.
    method_ceiling:
      strongest_certifiable_claim: >-
        The non-special model has no extra scaling automorphism beyond
        negation at p = 13, or it has at least one.
      nearby_object_control: >-
        The map u = -1 on E_gen, which must be counted. If negation
        fails the equation, the instrument is wrong.
    proof_obligations:
      - claim: both models are ordinary and nonsingular
        responsibility: baseline
      - claim: the count on E_0 is 6
        responsibility: correctness
      - claim: the count on E_gen is 2
        responsibility: strictness
    not_applicable_reason: >-
      No exponent is claimed. The map is still filled for this one prime.
  predictions:
    - metric: number of scaling automorphisms of E_0
      direction: different
      minimum_effect: exactly 6
    - metric: number of scaling automorphisms of E_gen
      direction: different
      minimum_effect: exactly 2
  minimal_test:
    design: >-
      Over F_13, test every u in 1 through 12. Keep u when
      A u^4 = A and B u^6 = B for the model's coefficients. Count the
      distinct pairs (u^2, u^3). Do not run Pollard rho.
    controls:
      - u = 1 is kept on both models. Otherwise the scan is invalid.
      - u = -1 is kept on E_gen. Otherwise the scan is invalid.
      - j(E_gen) is computed from the curve coefficients and is neither 0 nor 1728.
      - A supersingular model, trace divisible by 13, is not scored.
    required_metrics:
      - count_j0
      - count_generic
      - j_generic
      - trace_j0
      - trace_generic
  falsification_conditions:
    - count_generic is 3 or more.
    - count_j0 is not 6.
    - j_generic is 0 or 1728.
    - Either model is singular or supersingular.
  confounders:
    - Counting u rather than distinct maps (u^2, u^3) can inflate the count. The metric is the number of distinct maps.
    - Extra automorphisms that are not scalings of this shape are outside the count. The claim does not say the geometric automorphism group was listed by another method.
  interpretation_limits:
    - A count of 6 against 2 is the constant in KR-RHO-0528e7. It does not change the exponent 1/2.
    - No discrete logarithm is computed.
    - Failure at p = 13 is a failure at p = 13 only.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On a short-Weierstrass model with A and B both nonzero and j not
        in {0, 1728}, the only u in F_p-star with A u^4 = A and
        B u^6 = B are u = plus or minus 1. On y^2 = x^3 + B the same
        condition is u^6 = 1, and the number of solutions in F_p is
        gcd(6, p - 1). At p = 13 that gcd is 6. This imitates the unit
        group of the order of discriminant -3. It is not a new theorem.
      rigorous_support: >-
        KR-RHO-0528e7, opened, states the rho discount sqrt(6) for j = 0
        and says the exponent stays 1/2. It does not compute the count
        at p = 13.
      validation_plan: >-
        At this single pair, record both counts. If count_generic is not
        2, H1 is false at p = 13. If the identity is missing, refuse the
        count. No second prime and no transfer to a cryptographic prime
        is claimed.
  target_complexity:
    time_exponent: >-
      Twelve scalings at one prime p = 13. The generic-group exponent
      1/2 is unchanged.
    memory_exponent: O(1) field elements
    best_known: >-
      KR-RHO-0528e7, opened, prices j = 0 at a constant sqrt(6).
      KR-RHO-13bf67, opened, gives the square-root generic bound. This
      count beats neither.
    hidden_overhead: >-
      No o(1) term. The test is two models at p = 13.
    tradeoff_note: >-
      No time-memory tradeoff. The scan is exhaustive in u.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-0528e7
      - KR-RHO-13bf67
      - KR-RHO-755e35
    nearest:
      - ref: KR-RHO-0528e7
        provenance: internal
        relation: adjacent
        delta: >-
          The opened row states the constant sqrt(6) for j = 0 and
          sqrt(4) for j = 1728. This idea adds two integers at p = 13,
          the scaling counts 6 and 2, and does not change the exponent.
  dominated_by: >-
    The automorphism discount in KR-RHO-0528e7 dominates any reading of
    these two counts as an attack. Pollard rho, at the square-root
    exponent in KR-RHO-13bf67, dominates the same reading. The counts
    do not beat either baseline.
  sota_delta: >-
    No exponent is derived. The quantitative delta is the pair of
    integers (count on E_0, count on E_gen), predicted (6, 2), at the
    prime 13. The generic-group exponent stays 1/2.
