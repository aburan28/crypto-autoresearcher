idea:
  id: IDEA-20260807-5876b8
  question_id: RQ-GGMB-6eaabc
  added: '2026-08-07'
  title: >-
    THE ORACLE-FRAMING COLLAPSE: because a prime-field ECDLP instance is fully
    specified by public data, every realizable augmenting oracle is either
    GGM-simulable (hence closed at exponent 1/2 in charged work) or poly-time
    self-computable from that public data (hence not a resource at all but a
    named subroutine whose implementation cost must be charged) -- so a
    NON-SIMULABLE verdict, by itself, carries zero information about attack cost
  class: mechanism

  claim: >-
    (A) THE MODEL, FIXED BEFORE ANY VERDICT. An instance is
    I = (p, a, b, N, P, Q) with Q = [k]P and G = <P> of prime order N. A GENERIC
    adversary A holds opaque handles and may (i) request the group operation on
    handles, (ii) test handles for equality, (iii) query an augmenting oracle O.
    A SIMULATOR S for O has A's interface -- handles, the group oracle, and the
    non-encoding public parameters (p, a, b, N) -- but NOT the concrete
    coordinates of P and Q and NOT k. Every handle A can ever hold was built from
    the two initial handles by group operations, so S can maintain for each
    handle h the FORMAL LINEAR FORM lambda(h) = (alpha, beta) in (Z/N)^2 with
    h = [alpha]P + [beta]Q. S knows lambda exactly. S does not know k. This
    lambda is the tracked object of the whole generic model and of this lane.

    (B) SUFFICIENT CRITERION FOR SIMULABILITY (S1). If O's answer on a handle
    tuple (h_1..h_r) plus adversary-supplied field/public arguments args is a
    function f(lambda(h_1), ..., lambda(h_r), p, a, b, N, args) computable
    WITHOUT k, then S answers by computing f, with simulator overhead
    T_sim = cost(f). S1 is not a heuristic; it is a construction.

    (C) THE LEMMA THAT COLLAPSES THE TAXONOMY (L1). S1 implies SELF-
    COMPUTABILITY. The real adversary, unlike the generic one, HAS the concrete
    coordinates of P and Q, and it also knows lambda(h) for every handle h it
    built -- it chose the scalars. So it can evaluate the same f itself, in
    poly(log p) time whenever cost(f) is poly. Therefore
      SIMULABLE ==> SELF-COMPUTABLE,
    and contrapositively NOT SELF-COMPUTABLE ==> NOT SIMULABLE. The two axes are
    not independent: one implies the other, and the informative direction is the
    contrapositive.

    (D) THE DICHOTOMY. For prime-field ECDLP every augmenting oracle O falls in
    exactly one of four cells, and each cell has a DIFFERENT adjudication:
      (a) SIMULABLE. Shoup (KN-TECH-005) applies to the simulated algorithm:
          g + q*T_sim >= c*sqrt(N), where g is A's own group-operation count and
          q its query count. The lane is closed at exponent 1/2 IN CHARGED WORK.
          The exact sense of "charged" is the subject of IDEA-20260807-7270d1
          and matters when T_sim is large.
      (b) NOT SIMULABLE, but SELF-COMPUTABLE in poly(log p) time from
          (p, a, b, N, P, Q, query). Then the oracle hands the real adversary
          NOTHING IT DID NOT ALREADY HAVE. The augmented model is equal to the
          plain non-generic model; the GGM adjudication is SILENT, not negative;
          and the only remaining question is whether the concrete algorithm that
          computes O, charged at its real cost, beats 0.886*sqrt(N). The oracle
          framing must be discarded and replaced by a charged cost analysis.
          Every R1/R2/R7 oracle the campaign has named lands here.
      (c) NOT SELF-COMPUTABLE in poly time, but REALIZABLE at some cost C. The
          oracle is HIDING WORK. Adjudication is arithmetic: does
          q*C + g < 0.886*sqrt(N) hold for the q the algorithm needs? This is the
          only cell where a real cryptanalytic question survives, and the
          campaign's live targets (arity-m decomposition over F_p; a shortest-
          isogeny oracle) sit in it.
      (d) NOT REALIZABLE WITHOUT k. Oracle A of KN-FIND-b7e091 (the first-jet
          oracle, which needs k to evaluate dQ = k*dG) is the type case. This is
          not an attack model; no adversary can instantiate it.

    (E) THE CONSEQUENCE THIS LANE EXISTS TO ENFORCE. "Non-simulable" is a
    disjunction over cells (b), (c), (d). In (b) and (d) it carries ZERO
    information about attack cost. KN-FIND-b7e091 already observed this
    empirically for two oracles -- Oracle A "non-simulable but privately
    computable", Oracle B "non-simulable but no k-recovery" -- and recorded them
    as a completeness footnote. This proposal asserts those are not exceptions
    but the RULE, with a reason: Oracle A is cell (d), Oracle B is cell (b)
    (elliptic-net values W(m,n) are computable in poly time by the adversary,
    which knows the index (m,n) it asked about and the coordinates of P and Q).
    Therefore: NO LANE IN THIS CAMPAIGN MAY REPORT NON-SIMULABILITY AS PROGRESS.
    A lane must place its oracle in (b), (c) or (d) and, if (c), produce C.

    (F) WHAT WOULD REFUTE IT, AND THAT IS THE VALUABLE BRANCH. Exhibit a
    prime-field oracle that is realizable, not self-computable in poly time, and
    for which q*C + g < 0.886*sqrt(N) with q the query count an actual algorithm
    needs. That is a cell-(c) inhabitant with a WINNING cost accounting, i.e. a
    sub-rho prime-field algorithm. The dichotomy is designed so that the search
    for a counterexample IS the search for an attack, which is the correct place
    for the campaign's effort to go.

    (G) WHAT THIS IS NOT. It is not a hardness proof, not a lower bound, and not
    a claim that cell (c) is empty -- it is provably non-empty. It is a claim
    about where adjudication effort should be spent and about what a verdict may
    be said to mean.

  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: >-
    This proposal consumes no non-generic resource because it mounts no attack.
    It is the admissibility filter itself, stated as a dichotomy rather than as a
    case list. Its output is a classification obligation imposed on other lanes:
    each must name its cell. The proposal is admissible under DECOMPOSITION.md
    section 2 in the same way L12 is -- as an audit -- and it is the audit's
    theoretical backbone.

  discriminated_from:
    - >-
      KN-FIND-b7e091 (BINDING, not revisited). That finding adjudicates FOUR
      named oracles and records two as "non-simulable but useless" as a
      completeness note. This proposal does not change any of its four verdicts;
      it asserts they are instances of a dichotomy, DERIVES all four from the
      dichotomy as a baseline-reproduction check, and converts the completeness
      note into a rule with a mechanism. If the derivation fails on any of the
      four, this proposal is wrong and the finding stands unchanged.
    - >-
      IDEA-20260806-530fdd / H-AOM-8d4a83 (degree-budgeted algebraic oracle model
      AOM_d). That proposal grades simulability by the DEGREE d of the algebraic
      variety defining the oracle and bounds T_sim by Bezout / Lang-Weil. It is
      an axis INSIDE cell (a): it says how expensive the simulator is as a
      function of d. This proposal adds an ORTHOGONAL axis -- self-computability
      -- and its content is that cells (b) and (d) exist and are where almost
      every candidate oracle actually lands, which AOM_d does not address at all
      because an oracle in cell (b) may have unbounded d and still be worthless.
      The two compose: AOM_d refines (a); this refines the complement of (a).
    - >-
      H-GGM-001 (status `analyzed`). That hypothesis proposes a machine-checkable
      simulability TEST returning SIMULABLE / NON-SIMULABLE. This proposal says
      that binary output is under-determined and must be replaced by a four-cell
      verdict; the procedure that implements it is IDEA-20260807-63056d.
    - >-
      KN-TECH-005. That record already states the screen "is the augmented oracle
      simulable with O(1) overhead?". This proposal states why that screen, taken
      alone, produces uninformative negatives.

  object_first_candidate:
    tracked_object: >-
      lambda: {handles} -> (Z/N)^2, the formal linear form (alpha, beta) of each
      group element the adversary holds, together with the pair of integers
      (T_sim, C_impl) attached to each oracle: the cost of computing the oracle's
      answer FROM lambda, and the cost of computing it from the full public
      input.
    lossiness: >-
      GENUINELY LOSSY, and this is checkable with no compute. lambda([alpha]P +
      [beta]Q) = (alpha, beta) discards the x- and y-coordinates entirely: it
      discards 2*log_2(p) bits of field data per element and retains
      2*log_2(N) bits of scalar data. Two points with the same lambda on
      different curves in the same isogeny class have completely different
      coordinates. The projection is not a change of coordinates: coordinates
      cannot be recovered from lambda without k and the curve equation, which is
      exactly the recovery the ECDLP is about.
    propagation: >-
      DETERMINISTIC AND EXACT under every group operation:
      lambda(h_1 + h_2) = lambda(h_1) + lambda(h_2), lambda([n]h) = n*lambda(h),
      lambda(-h) = -lambda(h). It is also exact under any F_p-isogeny of degree
      coprime to N (see IDEA-20260807-d73e83). It does NOT propagate under any
      coordinate-valued map, and that failure is precisely the definition of a
      non-generic resource. This is the inventor-protocol section 2 test applied
      with the projection lambda, and the identity worth stating once:
      GGM-SIMULABILITY IS THE LOSSY-PROJECTION TEST WITH PROJECTION lambda.
    survival_score: >-
      Survives every group operation, every endomorphism (which acts on lambda as
      a scalar, H-ENDO-001), every isogeny of degree coprime to N, and every
      change of curve model. Dies the instant an operation reads a coordinate as
      a field element -- which is exactly resource R1 -- and dies at a map into a
      different group (R7) or a different characteristic (R6). The set of
      operations that kill it IS the resource taxonomy of DECOMPOSITION.md
      section 2, which is a nontrivial consistency check on that taxonomy.

  mechanism: >-
    STEP 1 (zero compute) -- WRITE THE MODEL DOWN. Fix the four-cell definition
    in (D) with the simulator's knowledge set stated exactly: {handles, group
    oracle, p, a, b, N, lambda}, explicitly excluding {coordinates of P and Q, k}.
    Ambiguity in this set is the single largest source of bogus verdicts, because
    a simulator granted the coordinates can answer EVERY point-valued oracle
    honestly and the whole model trivializes.

    STEP 2 (zero compute, HARD GATE) -- BASELINE REPRODUCTION. Derive all four
    KN-FIND-b7e091 verdicts from the dichotomy:
      Oracle C (incidence, VERIFICATION form: does h_{i1} + ... + h_{im} = h_Q?):
        answer = [ sum_j lambda(h_{ij}) == lambda(h_Q) ] -- a function of lambda
        alone. Cell (a), T_sim = O(m). Reproduces the finding exactly.
      Oracle D (endomorphism image): phi acts on G as multiplication by a public
        scalar (H-ENDO-001), so lambda(phi(h)) = mu*lambda(h). Cell (a),
        T_sim = O(log N). Reproduces the finding exactly.
      Oracle A (first jet): dQ = k*dG by the invariant-differential identity, so
        the answer is a function of k. No simulator without k; no adversary
        without k either. Cell (d). Reproduces "privately computable".
      Oracle B (elliptic net): W(m,n) depends on x([m + nk]P), an encoding
        quantity, so not a function of lambda -- but the adversary supplied
        (m, n) and holds the coordinates of P and Q, so it computes
        [m]P + [n]Q and then W(m,n) itself in poly time. Cell (b). Reproduces
        "no k-recovery below standard DLP", and explains it.
    IF ANY OF THE FOUR FAILS TO REPRODUCE, THE DICHOTOMY IS FALSE AND THIS
    PROPOSAL ENDS AT STEP 2 WITH THE FINDING UNCHANGED.

    STEP 3 (zero compute) -- CELL (c) NON-EMPTINESS, so the dichotomy is not
    vacuous. Exhibit the arity-m DECOMPOSITION oracle over F_p (given a target
    handle h_R and a declared factor base S of size L, return m factor-base
    elements summing to R, or bottom). Not a function of lambda: the answer
    depends on which points have x-coordinates in S. Not poly-time
    self-computable at useful L by any known method: the brute-force route costs
    binomial(L, m) and the algebraic route is a Groebner computation on the
    Semaev system whose recorded prime-field cost exceeds sqrt(N)
    (KN-FIND-f8c290, KN-TECH-004, KN-TECH-011). Realizable at some cost C. So
    cell (c) is inhabited by exactly the object the index-calculus lane studies.

    STEP 4 (zero compute) -- APPLY TO THE CAMPAIGN'S TEN CANDIDATE ORACLES and
    publish a cell per oracle, with the witness required by
    IDEA-20260807-63056d.

    STEP 5 (bounded compute, TOY) -- MECHANIZE STEP 2 as a regression fixture so
    that any future oracle spec added to the campaign is re-adjudicated against
    the four frozen b7e091 verdicts before its own verdict is trusted.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      ripgrep via the harness Grep tool (semantics of `grep -ril`), run
      2026-08-07 over ledger/, knowledge/, docs/, analysis/ and the wider tree.
      Patterns: "simulab|simulator|generic-group|generic group model";
      "self-computable|publicly computable|public data|poly-time computable from
      public"; "simulator overhead|T_sim|simulation overhead|charged work|
      overhead per query"; "Oracle A|Oracle B|Oracle C|Oracle D|oracle class|
      oracle taxonomy".
    results: >-
      Simulability terms: 60+ files (result cap reached), concentrated in
      KN-FIND-b7e091, EV-GGM-79e710, H-GGM-001, KN-TECH-005, KN-OPEN-005,
      IDEA-20260726-004, IDEA-20260806-530fdd, DEC-20260804-3b4258, and the
      fourteen BATCH-cb71b5 RQ records. "self-computable / publicly computable":
      62 occurrences over 40 files; the phrase is used descriptively (e.g.
      KN-FIND-b7e091's "privately computable", H-ENDO-001's "publicly computable
      eigenvalues") and NOWHERE as a classification axis paired against
      simulability. "Oracle A..D": 16 files, all downstream of the same finding.
      No record in the corpus states the implication SIMULABLE ==> SELF-
      COMPUTABLE, and no record states that a NON-SIMULABLE verdict is
      uninformative by default.
    verdict: adaptation
  novelty_screen_note: >-
    ADAPTATION, and the honest reason: the simulation paradigm, the
    formal-linear-form simulator, and the observation that real adversaries hold
    public data are all standard in cryptography. Nothing in (A)-(C) is claimed
    as new mathematics. What is new TO THIS PROGRAM is the pairing of the two
    axes into a four-cell dichotomy and the resulting rule that non-simulability
    is not progress. No claim of novelty against the external literature is made
    and none was checked beyond the corpus; a published statement of the same
    dichotomy would be an ingredient, not a disappointment.

  null_object_control: >-
    MANDATORY AND BLOCKING. NULL OBJECT: the SHAM ORACLE O_rand, which on any
    query returns a uniformly random element of the answer type, independent of
    the instance. O_rand must be adjudicated CELL (a), SIMULABLE with
    T_sim = 0 group operations (the simulator tosses coins), and USELESS. DECAY
    PARAMETER: the number r of independent uniform random bits appended to a
    genuine oracle's answer. Appending r random bits must leave the cell verdict
    and the usefulness verdict UNCHANGED for every r; a procedure whose verdict
    moves with r is reading noise as structure and is void. SECOND NULL: the
    CONSTANT ORACLE returning 0 always -- cell (a), T_sim = 0. THIRD NULL, in
    the opposite direction: the DLP ORACLE itself (given a handle, return
    lambda's second coordinate resolved against k, i.e. return k). It must be
    adjudicated NOT SIMULABLE and NOT SELF-COMPUTABLE, i.e. cell (c) with
    C = the cost of the best known DLP algorithm -- so that the arithmetic
    q*C + g >= 0.886*sqrt(N) is satisfied with equality at q = 1, which is the
    correct and self-consistent answer. A dichotomy that places the DLP oracle in
    (a) or (b) is unsound and every verdict it produced is void.

  assumptions:
    - >-
      The simulator's knowledge set is exactly {handles, group oracle, p, a, b,
      N, lambda} and excludes {coordinates of P and Q, k}. If the campaign later
      wishes a different convention it must supersede this record rather than
      reinterpret it; the verdicts are not stable under a change of this set.
    - >-
      "Poly-time" means poly(log p) with the curve fixed. An oracle self-
      computable in time p^{0.4} is NOT in cell (b) under this definition; it is
      in cell (c) with C = p^{0.4}, and cell (c) is where the cost arithmetic
      happens. The boundary is drawn at polynomial deliberately, because that is
      where "the adversary already had it for free" stops being true.
    - >-
      G has prime order N and Q = [k]P with k unknown and uniform. Composite
      order, multi-generator, and preprocessing settings are OUT OF SCOPE and
      are named as the method's ceiling below.
    - >-
      Shoup's bound (KN-TECH-005) applies to the simulated generic algorithm.
      This is cited, not reproved.

  proof_search_map:
    bottleneck: >-
      Step 2, the baseline reproduction. The dichotomy's entire value is that it
      DERIVES the four standing verdicts instead of listing them; if any of the
      four does not fall out, the dichotomy is not a generalization of the
      finding and the record is worthless. This is the exact step whose failure
      changes the conclusion, and it costs zero compute.
    baseline_embedding:
      parameter_slice: >-
        The four KN-FIND-b7e091 oracles at the b7e091 parameters: prime-order
        prime-field curve, End_{F_p}(E) = Z or CM, arity m for incidence, and the
        first-jet and elliptic-net specifications as written in that record.
      reproduction_check: >-
        SYMBOLIC, plus a frozen regression fixture. Symbolic: exhibit for each of
        C and D the explicit function f of lambda and the exact T_sim (O(m) and
        O(log N)); exhibit for A the k-dependence; exhibit for B the poly-time
        public computation. Fixture: freeze the four oracle specifications as
        machine-readable records and require any future run of the adjudicator to
        reproduce SIMULABLE / SIMULABLE / cell (d) / cell (b) exactly. A mismatch
        halts the line.
    observation_collision:
      observable: >-
        The cell label in {a, b, c, d}, plus the pair (T_sim, C_impl).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, which is why the label alone is not a
        conclusion. Two oracles with the SAME cell label and radically different
        cryptanalytic value: (i) the x-coordinate oracle and (ii) the anomalous-
        curve p-adic elliptic-logarithm oracle (KN-TECH-033) are BOTH cell (b) --
        both non-simulable, both poly-time self-computable -- yet the second
        solves the ECDLP in O(log p) on trace-one curves and the first solves
        nothing. The collision is a direct falsifier of the reading "cell (b)
        means harmless". The additional condition that separates them is stated
        as part of the claim: cell (b) means THE ORACLE IS NOT A RESOURCE, not
        that the ALGORITHM computing it is weak. Any summary that conflates the
        two is overclaiming, and this collision is the reason the record insists
        on the distinction.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move "is this oracle a resource?" out of the informal simulability
          question and into the exact condition "does the answer factor through
          lambda, and if not, is it poly-time computable from the public input?"
          -- two decidable-in-practice questions with separate encoding,
          completeness, soundness and cost-loss obligations, replacing one
          question with no agreed semantics.
        predicted_gain: >-
          Converts N bespoke per-oracle arguments into one classification with
          four cells and a mechanical obligation per cell. Gain is in the
          STRENGTH AND UNIFORMITY OF THE STATEMENT and in adjudication cost; zero
          attack speedup is claimed.
      - transform: observable_fiber
        proposed_object: >-
          Hold the cell label fixed at (b) and vary the forgotten structure --
          the concrete algorithm implementing the oracle -- to produce the
          x-coordinate / anomalous-lift pair above. The intrinsic invariant
          distinguishing them is the trace condition t = 1, which is curve data,
          not oracle data.
        predicted_gain: >-
          Bounds what the cell label may be used for, and locates the real
          question in the implementing algorithm rather than the oracle
          interface. This is a limiting result about the proposal's own
          observable and is recorded as such.
    quantifier_order: >-
      INTENDED, SIMULABLE branch:
        EXISTS a simulator S (efficient, generic, knowledge set as fixed above),
        FORALL generic oracle-augmented adversaries A,
        FORALL instances I = (p, a, b, N, P, Q, k) in the declared family,
        the view of A interacting with (real group, real O on I) is identically
        distributed to its view interacting with (labelled group, S), and S makes
        at most T_sim group-oracle calls per O-query.
      Hence FORALL A: g(A) + q(A)*T_sim >= c*sqrt(N).
      THE ORDER IS LOAD-BEARING. The simulator is quantified FIRST and may not
      depend on A, on I, or on k. The dangerous weaker reading, which is NOT
      claimed and which most informal simulability arguments actually establish:
        FORALL I EXISTS S_I -- letting the simulator depend on the instance,
      which is satisfiable by the simulator that hard-codes k and therefore
      proves nothing.
      NON-SIMULABLE branch, and the two forms must never be conflated:
        (N-strong) FORALL efficient generic S, EXISTS A and an instance
          distribution D such that A distinguishes with non-negligible advantage.
        (N-weak) EXISTS instances I, I' with identical generic transcript
          distributions on which O's answers differ -- so no simulator that is a
          FUNCTION OF lambda ALONE is correct.
      (N-weak) does NOT imply (N-strong), because a simulator may lazily SAMPLE
      answers from the correct joint distribution rather than compute them. Every
      NON-SIMULABLE verdict in this campaign must state which form it
      establishes; the corpus's existing verdicts are (N-weak).
    method_ceiling:
      strongest_certifiable_claim: >-
        "For prime-order prime-field ECDLP instances whose public data is
        (p, a, b, N, P, Q), with a single generator and no preprocessing, every
        realizable augmenting oracle is in cell a, b, c or d; cells a, b and d
        carry no attack advantage per query, and cell (c) reduces to the cost
        arithmetic q*C + g vs 0.886*sqrt(N)." It can NEVER certify that cell (c)
        is empty, that a given cell-(c) oracle is expensive, or anything about
        the ECDLP's hardness. Dropping any of the four qualifiers (prime order /
        prime field / single instance / no preprocessing) is overclaiming under
        AGENTS.md rule 4.
      nearby_object_control: >-
        THE PREPROCESSING / ADVICE ORACLE (resource R8, lane L13). An S-bit
        advice string about the curve, computed offline, is realizable and is NOT
        poly-time self-computable per instance when S is large -- so it sits
        outside cell (b) even though it is "public". The Corrigan-Gibbs-Kogan
        tradeoff S*T^2 = Omega~(N) (KN-TECH-005, KN-LIT-013) shows the advice
        model is genuinely different and that the per-instance cost arithmetic of
        cell (c) is the wrong accounting there: the cost is amortized over many
        targets. So the dichotomy as stated FAILS on the nearest object to it,
        and the failure is named here rather than discovered later. A method that
        could not distinguish the single-instance from the preprocessing setting
        would not have identified the load-bearing structure; this one does, and
        the price is that L13 must be adjudicated under a different accounting.
    proof_obligations:
      - claim: >-
          S1 (a function of lambda is simulable) is a correct construction with
          the stated knowledge set.
        responsibility: correctness
      - claim: L1 (simulable implies self-computable) holds as stated.
        responsibility: correctness
      - claim: >-
          All four KN-FIND-b7e091 verdicts are derivable from the dichotomy.
        responsibility: baseline
      - claim: Cell (c) is non-empty (arity-m decomposition over F_p).
        responsibility: feasibility
      - claim: >-
          The DLP oracle is placed in cell (c) with C equal to the best known DLP
          cost, and the resulting arithmetic is self-consistent.
        responsibility: soundness
      - claim: >-
          The four cells are exhaustive and mutually exclusive under the fixed
          definitions of realizable / self-computable / simulable.
        responsibility: correctness
      - claim: >-
          Every reported verdict names the simulator knowledge set, the
          quantifier form, and the scope qualifiers.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        number of KN-FIND-b7e091 oracle verdicts reproduced by the dichotomy,
        out of 4
      direction: different
      minimum_effect: >-
        4 of 4, with the explicit f and T_sim exhibited for C and D and the
        explicit obstruction exhibited for A and B. 3 or fewer falsifies the
        proposal outright. Pre-registered before any derivation is written down.
    - metric: >-
        cell assignment of the campaign's ten named candidate oracle classes
        (isogeny transport, j-invariant, volcano level, class-group action,
        factor-base membership, summation-polynomial evaluation, torsion
        structure, canonical height, pairing, model change)
      direction: different
      minimum_effect: >-
        PRE-REGISTERED PREDICTION, recorded so it cannot be tuned afterwards:
        cells (a)/(a)/(a)/(a)/(b)/(a)/(a)/(b)/(b)/(b) respectively, with ZERO
        landing in cell (c) and zero in (d). If any of the ten lands in (c) with
        a C below 0.886*sqrt(N), the campaign has found its target and P3 of
        GOAL-ENDO-001 (independent review before any record states an excess)
        triggers immediately.
    - metric: >-
        number of distinct-preimage collisions found at fixed cell label
      direction: higher
      minimum_effect: >-
        At least 1 -- the x-coordinate / anomalous-lift pair is exhibited in this
        record. Finding it is a SUCCESS of the audit and a LIMIT on the label,
        and the prediction is recorded so the limit cannot later be presented as
        a surprise.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE, hours): write the model of (A), the
      criterion S1, the lemma L1, and derive the four b7e091 verdicts. This is
      pencil work and it is the whole experiment; if it fails, nothing else runs.
      STAGE 1 (zero compute): run the three null-object controls -- sham oracle,
      constant oracle, DLP oracle -- through the same derivation and check the
      required verdicts (a, a, c).
      STAGE 2 (zero compute): apply to the ten candidate classes and publish the
      cell table with the pre-registered prediction alongside the outcome.
      STAGE 3 (toy compute, <= 10 min, OPTIONAL): mechanize Stage 0 as a frozen
      regression fixture over the eight oracle specifications (4 baseline +
      3 nulls + 1 new) so future oracles are adjudicated against it. Toy curves
      at p <= 2^20 are used ONLY to make the (N-weak) witnesses concrete and
      independently checkable; they do not bound the verdicts, which are
      arguments and are scale-independent (this is the same standing distinction
      H-GGM-001 records).
    controls:
      - >-
        sham oracle O_rand (uniform random answers): must be cell (a),
        T_sim = 0, useless
      - >-
        constant oracle: must be cell (a), T_sim = 0, useless
      - >-
        DLP oracle: must be cell (c) with C = best known DLP cost; a verdict of
        (a) or (b) voids the instrument
      - >-
        the four frozen KN-FIND-b7e091 specifications, as the baseline fixture
      - >-
        decay control: append r independent uniform random bits to each oracle's
        answer for r in {0, 8, 64}; every verdict must be invariant in r
    required_metrics:
      - cell label in {a, b, c, d} per oracle, with the witness required by cell
      - T_sim in group operations per query, as an explicit function or bound
      - C_impl in field operations per query, or "not poly" with the reason
      - which quantifier form (N-weak / N-strong) each non-simulable verdict
        establishes
      - pass/fail of every null control and of the four-verdict fixture
      - the pre-registered ten-oracle cell prediction beside the outcome

  falsification_conditions:
    - >-
      Any of the four KN-FIND-b7e091 verdicts fails to fall out of the
      dichotomy. The dichotomy is not a generalization of the standing finding;
      this record is superseded and the finding is unchanged.
    - >-
      The DLP oracle is adjudicated cell (a) or (b). The dichotomy is unsound,
      because it would then claim the DLP oracle confers no advantage, and every
      verdict it produced is void.
    - >-
      Someone exhibits a realizable prime-field oracle that is simulable but NOT
      self-computable, i.e. a counterexample to L1. The two axes are then
      independent, the four cells are not exhaustive, and the collapse claim in
      (C) is false.
    - >-
      A verdict changes when r random bits are appended to an oracle's answer.
      The classification is reading noise and is void.
    - >-
      An oracle among the campaign's ten lands in cell (c) with C such that
      q*C + g < 0.886*sqrt(N) for an algorithm's actual q. This does not falsify
      the dichotomy -- it CONFIRMS it and simultaneously identifies an attack.
      Recorded as a falsification of the pre-registered prediction, not of the
      mechanism, and it triggers GOAL-ENDO-001 pause condition P3.

  confounders:
    - >-
      SIMULATOR KNOWLEDGE-SET DRIFT. A simulator granted the concrete
      coordinates of P and Q answers every point-valued oracle honestly and the
      model trivializes; a simulator granted k answers everything. The set is
      frozen in (A) and every verdict must restate it. This is the single
      largest confounder in the lane and it is silent when it strikes.
    - >-
      POLY / NON-POLY BOUNDARY AT TOY SCALE. At p <= 2^20 every cost is small
      and "poly-time self-computable" is not empirically distinguishable from
      "cheap". The cell (b)/(c) boundary must be decided by an asymptotic
      argument about the implementing algorithm, never by a toy timing.
    - >-
      ORACLE SPECIFICATION AMBIGUITY. "The incidence oracle" names at least two
      different objects with different T_sim (verification form and search
      form); see IDEA-20260807-7270d1. A cell label attached to an ambiguous
      specification is meaningless. Specifications must be frozen with their
      quantifier structure before adjudication.
    - >-
      CONFLATING THE ORACLE WITH ITS IMPLEMENTING ALGORITHM. The x-coordinate /
      anomalous-lift collision is the standing warning: cell (b) says the
      interface is not a resource; it says nothing about the algorithm behind it.

  interpretation_limits:
    - >-
      This is an adjudication framework, not a bound. It closes no lane by
      itself; it says what a closure must contain.
    - >-
      Scoped to prime-order subgroups of prime-field curves with fully public
      instance data, single instance, no preprocessing. R8 / L13 is explicitly
      outside it (see method_ceiling).
    - >-
      Cell (a) closes at exponent 1/2 IN CHARGED WORK. What "charged" means when
      T_sim is large is not settled here and is the subject of
      IDEA-20260807-7270d1; until that is adjudicated, a cell-(a) verdict with
      large T_sim must be reported with T_sim beside it and not as a bare
      closure.
    - >-
      Nothing here bears on quantum algorithms, side channels, fault models, or
      any setting where the adversary's public data is not the full instance.
    - >-
      A cell-(b) verdict is NOT a statement that the associated lane is
      worthless. It is a statement that the lane's ORACLE FRAMING is worthless
      and must be replaced by a charged algorithm. Lanes L1, L3, L11 are affected
      in exactly this way and should read it as a redirection, not a closure.

  reachability_gate: >-
    NOT APPLICABLE: this proposal moves between no curves and proposes no
    isogeny walk, so T5 does not bind. It does however BOUND the reachability
    question for lanes that do: see IDEA-20260807-d73e83, which shows that the
    walk itself is simulable, so reachability cost can never be the source of an
    advantage -- only the resource consumed after arrival can be.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE ARE LOAD-BEARING. Every claim in (A)-(E) is derivational: S1 is a
        construction, L1 is an implication, the four-cell partition is a
        definition plus an exhaustiveness argument, and the baseline reproduction
        is a symbolic derivation. No distributional assumption is made about
        curves, scalars, smoothness, or class numbers, and the record deliberately
        contains no such assumption so that its failure modes are logical rather
        than statistical.
      rigorous_support: >-
        Shoup's generic lower bound (KN-TECH-005, KN-LIT-011) is the only
        external theorem relied on, and it is cited, not reproved. H-ENDO-001's
        scalar-action fact is used for the Oracle D reproduction and is elementary
        (End of a prime-order cyclic group is Z/N).
      validation_plan: >-
        Not a distributional validation. The check is the Stage 0/1 derivation
        plus the frozen four-verdict fixture and the three null oracles. If a
        later reviewer finds a distributional assumption smuggled into the
        exhaustiveness argument, that is a falsification of this record's own
        claim to be heuristic-free and must be recorded as such.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NO ALGORITHM IS PROPOSED. The proposal's
      OUTPUT is a classification. What it asserts about exponents is a
      conditional preservation: for every cell-(a) oracle, the exponent of the
      augmented problem remains 1/2 in charged work, i.e.
      g + q*T_sim >= c*sqrt(N). For cell (b) the exponent of the augmented
      problem equals the exponent of the unaugmented non-generic problem, whose
      best known value is 1/2 (rho). For cell (c) the exponent is
      undetermined and is the campaign's real target.
    memory_exponent: >-
      The audit itself is O(1) memory: it is pencil work plus a fixture of eight
      oracle specifications. No large table is built.
    best_known: >-
      Parallel Pollard rho with distinguished points, 0.886*sqrt(N) group
      operations and O(1) memory per processor (KN-TECH-001, KN-TECH-006);
      automorphism-discounted on CM curves by at most sqrt(6) (KN-TECH-018);
      BSGS at sqrt(N) time and sqrt(N) memory (KN-TECH-031).
    hidden_overhead: >-
      The phrase "in charged work" hides the entire content of
      IDEA-20260807-7270d1: a cell-(a) closure with T_sim exponential in a
      parameter is quantitatively vacuous even though the verdict is correct.
      Disclosed here and required in every downstream summary. Second hidden
      cost: "poly-time self-computable" hides an unbounded polynomial degree, so
      a cell-(b) oracle with a degree-20 implementation is free asymptotically
      and unusable concretely.
    tradeoff_note: >-
      Not applicable to the audit, which mounts no attack. For the objects it
      classifies, the relevant tradeoff position is inherited from the
      incumbent: rho occupies the O(1)-memory corner and is not displaced by
      anything in this record. The one place a genuine tradeoff enters is the
      preprocessing model named in method_ceiling, where S*T^2 = Omega~(N).

  dominated_by: >-
    AS AN ATTACK: none is mounted, so this is dominated by every row of the
    prime-field frontier on every axis. Checked row by row across time, memory
    and data/queries: parallel rho with distinguished points (0.886*sqrt(N)
    time, O(1) memory, no queries) dominates on all three; automorphism-
    discounted rho on CM curves (KN-TECH-018) dominates by a further factor
    <= sqrt(6) on time at equal memory; BSGS (KN-TECH-031) dominates on nothing
    relative to rho but still dominates this proposal, which has no time-memory
    point at all. There is no axis on which this record improves an attack, and
    `null` would be a fabrication.
    AS AN ADJUDICATION INSTRUMENT: the incumbent is the binary SIMULABLE /
    NON-SIMULABLE test of H-GGM-001 as applied in KN-FIND-b7e091. This proposal
    dominates it on RESOLUTION (4 cells and 2 cost numbers versus 1 bit) and on
    the informativeness of a negative verdict; it is dominated by the incumbent
    on MATURITY -- the incumbent has an archived evidence record (EV-GGM-79e710)
    and a Coordinator decision (DEC-20260804-3b4258) and this has neither.
  sota_delta: >-
    Zero speedup against any attack baseline; the delta on the attack frontier
    is exactly 0 on time, 0 on memory and 0 on queries. Instrument delta stated
    as numbers: replaces a 1-bit verdict with a 4-cell label plus the pair
    (T_sim, C_impl); converts 2 of the 4 standing KN-FIND-b7e091 verdicts
    ("non-simulable but useless") from case-by-case observations into instances
    of a stated rule; imposes on the campaign's 10 named candidate oracle
    classes a pre-registered cell prediction of (a x 6, b x 4, c x 0, d x 0)
    against which the actual adjudication is scored; and costs approximately 0
    compute-seconds, being a derivation.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that all four baseline verdicts reproduce -- the derivations for C, D
    and A are short and I have written them out above; the residual risk is
    concentrated in B, where "poly-time self-computable" depends on the exact
