    ten candidate oracles lands in cell (c) at all, and below 0.02 that one
    lands there with C small enough to matter -- so the most likely honest
    headline is "every oracle this campaign can name is either simulable or
    already free to the adversary", which is a closure with a mechanism and not
    a fatigue report.

