idea:
  id: IDEA-20260808-40aab9
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-ENDO-001
  title: 'The Kani / Robert higher-dimensional embedding - the single largest recent structural
    ingredient in isogeny cryptanalysis - reaches prime-field ordinary ECDLP if and only if
    the embedding degree is 1, i.e. exactly the MOV-degenerate case: a graph-type (N,N)-kernel
    needs a rational full N-torsion basis, N | p - 1 is equivalent to that, and CM cannot
    supply the missing second point because every endomorphism acts on G as a scalar'
  class: mechanism
  claim: "(A) WHAT THE MACHINERY NEEDS. The SIDH-breaking machinery (Castryck-Decru; Maino-Martindale;\
    \ Robert) embeds an unknown isogeny into a computable isogeny of principally polarised\
    \ abelian varieties by building a maximal isotropic kernel of the form of a GRAPH. Concretely\
    \ in dimension 2: from E x E' one needs K subset (E x E')[N] with K = (Z/N)^2, maximal\
    \ isotropic for the product Weil pairing, and K intersecting E x 0 trivially - i.e. K\
    \ is the graph of an isomorphism E[N] -> E'[N]. (B) THE RATIONALITY EQUALITY. Over F_p\
    \ with N prime and N || #E(F_p): E(F_p)[N] = G is CYCLIC of order N. By Balasubramanian-Koblitz,\
    \ E[N] is contained in E(F_{p^k}) if and only if N | p^k - 1; hence the full N-torsion\
    \ is F_p-rational if and only if ord_N(p) = 1, i.e. N | p - 1, i.e. embedding degree k_emb\
    \ = 1. THEREFORE a graph-type (N,N)-kernel is F_p-rational exactly when k_emb = 1 - and\
    \ in that case ECDLP already transfers to the DLP in F_p^* by MOV/Frey-Ruck in polynomial\
    \ time. There is no intermediate regime: the Kani route and the MOV route coincide exactly.\
    \ (C) THE THREE THINGS ONE MIGHT TRY INSTEAD, PRICED.\n  (C1) K = G x G'. This IS F_p-rational\
    \ and IS maximal isotropic of order\n       N^2 (the Weil pairing restricted to a cyclic\
    \ subgroup is trivial by\n       alternation, so G x G' is isotropic). But its quotient\
    \ is the SPLIT\n       product (E/G) x (E'/G'), which is computable and carries no\n \
    \      information about k. Split kernels are the ones that say nothing.\n  (C2) The graph\
    \ Gamma_k = {(R, [k]R) : R in G} subset (E x E)[N]. This is\n       F_p-rational, is isotropic,\
    \ and DOES depend on k. But it has order\n       N, not N^2, so (E x E)/Gamma_k carries\
    \ a polarisation of type (1, N)\n       rather than a principal one, and computing it\
    \ is an N-isogeny with N\n       PRIME: >-\n         Otilde(N) by Velu, Otilde(sqrt(N))\
    \ by sqrt-Velu\n       (Bernstein-De Feo-Leroux-Smith) [recall-confident]. At best that\n\
    \       matches rho, and no smoothness is available to split it.\n  (C3) Use CM to supply\
    \ the second basis point: take {P, phi(P)} for a\n       non-scalar endomorphism phi.\
    \ This FAILS for the sharpest possible\n       reason, and it is this program's own: G\
    \ has prime order, so\n       End(G) = Z/N and phi acts on G as multiplication by a scalar\
    \ lambda\n       (H-ENDO-001; KN-FIND-b7e091). Hence phi(P) = [lambda]P lies in G and\n\
    \       is never independent of P. An endomorphism cannot enlarge the\n       rational\
    \ torsion, only relabel it.\n(D) THE RESIDUAL OPEN CELL, NAMED. What is NOT closed: N\
    \ composite with a smooth factor n, where a rational (n,n)-graph might be assembled and\
    \ the isogeny computed in Otilde(n) - but that is exactly the Pohlig-Hellman- broken regime\
    \ and gives nothing new; and working over F_{p^{k_emb}}, where the torsion is rational\
    \ by construction but N is prime so the isogeny costs Otilde(sqrt(N)) at best while MOV\
    \ already reduced the problem there. Both are stated so the closure has edges."
  mechanism: 'The higher-dimensional machinery converts knowledge of torsion IMAGES into a
    computable isogeny. Its input requirement is a rational full-torsion basis together with
    its images. Prime-field ECDLP publishes exactly one point and its image, on a cyclic rational
    torsion group, and the CM structure that looks like it might supply a second independent
    point provably cannot, because prime order forces scalar action. So the input requirement
    fails not by degree, not by cost, but by rank: the rational torsion has rank 1 where the
    machinery needs rank 2.'
  why_not_a_renamed_known_approach: 'Nearest known statement: "SIDH breaks because torsion
    images are published; ECDLP publishes no torsion images". That folklore statement is about
    the SECRET being an isogeny rather than a scalar. This record makes a different and sharper
    claim: even granting that the secret [k] IS an isogeny (it is, of degree k^2) and that
    its action on the rational torsion IS published (it is: Q = [k]P), the machinery still
    fails, and the failure is an exact equality with the embedding degree. The corpus contains
    Kani analyses only on the supersingular / SQIsign side (IDEA-20260806-7955a5, IDEA-20260805-2acde5,
    IDEA-20260725-003, IDEA-20260807-053a55); none states the prime-field ordinary equality,
    and none uses H-ENDO-001 to close the CM escape (C3).'
  predictions:
  - observable: rank of the F_p-rational N-torsion
    metric: 'over >= 500 toy ordinary curves with a prime N || #E(F_p), the F_p-rank of E[N](F_p),
      computed by exhibiting generators, cross- tabulated against k_emb = ord_N(p)'
    predicted: rank 1 in exactly those instances with k_emb > 1, rank 2 in exactly those with
      k_emb = 1, with no exceptions. This is an if-and-only-if, so a single off-diagonal cell
      falsifies (B)
  - observable: information content of the split kernel
    metric: the isomorphism class of (E x E)/(G x G) as a function of k, sampled over many
      k with (E, P) fixed
    predicted: constant in k (zero distinct values beyond one), confirming C1 carries no information
  - observable: cost of the (1, N)-polarised route
    metric: field operations to compute (E x E)/Gamma_k for toy N, against 0.886 sqrt(N) group
      operations for rho at the same N
    predicted: the isogeny route is not cheaper at any tested N, and its measured scaling
      exponent in N is >= 1/2; a measured exponent below 1/2 would falsify C2 and would be
      a significant result
  minimal_test: 'Two cheap parts. (i) PURE ARITHMETIC: sample 500 toy ordinary curves at 16-24
    bits with a prime N dividing #E(F_p); for each compute k_emb = ord_N(p) and determine
    whether E[N] is F_p-rational (equivalently whether N | p - 1 and N^2 | #E(F_p) - both
    cheap tests) and, where rational, exhibit a second independent generator. Fill the 2x2
    contingency table. (ii) ONE WORKED (1,N) INSTANCE: at a very small N (say N < 200), construct
    Gamma_k explicitly and compute the quotient abelian surface by a standard library, timing
    it against rho on the same instance. Part (i) alone discriminates (B) and costs minutes.'
  controls:
  - 'PLANTED POSITIVE: include curves constructed to have k_emb = 1 (choose p and N with N
    | p - 1, e.g. via a CM construction). The instrument must report rank 2 for them; if it
    reports rank 1 everywhere, the rank test is broken and no negative conclusion may be drawn.'
  - 'SUPERSINGULAR CONTROL: one supersingular curve over F_{p^2} with rational full N-torsion,
    where the graph kernel IS assemblable, to confirm the machinery''s input requirement is
    being tested rather than assumed.'
  - 'CM CONTROL for (C3): on j = 0 and j = 1728 curves, verify directly that phi(P) = [lambda]P
    for the measured lambda, i.e. that the endomorphism image lies in G - the concrete instance
    of H-ENDO-001 that (C3) rests on.'
  confounders:
  - 'N^2 | #E(F_p) can make E[N] partially rational without k_emb = 1; the record assumes
    N || #E(F_p) and instances violating that must be excluded, not pooled.'
  - Over F_p there are curves with N | p - 1 that are of no cryptographic interest; their
    presence in the sample is intended (they are the positive control) and must not be read
    as a vulnerability finding.
  - A library that silently computes the quotient over an extension field would make C2 look
    cheaper than it is; the field of definition must be asserted per computation.
  falsification_conditions:
  - 'Any toy instance with k_emb > 1 and F_p-rational full N-torsion: (B) is wrong and the
    closure fails.'
  - 'Any endomorphism phi of an ordinary E/F_p and any P of prime order N with phi(P) not
    in <P>: H-ENDO-001''s scalar argument is wrong, (C3) reopens, and much else in this campaign
    changes.'
  - 'A measured cost exponent below 1/2 for the (1, N)-polarised quotient: C2''s pricing is
    wrong.'
  interpretation_limits: Closure of one route on ordinary prime-field curves only. It says
    nothing about supersingular curves (where the machinery works and is deployed), nothing
    about SIDH-like protocols, and nothing about composite N. It is a derivation resting on
    a cited external theorem (Balasubramanian-Koblitz) that was NOT re-verified this session;
    if that citation is wrong the equality in (B) must be re-derived before the closure stands.
  assumptions:
  - 'E/F_p ordinary, N prime, N || #E(F_p), p > 3.'
  - 'Balasubramanian-Koblitz: for N | #E(F_p) with N not dividing p - 1, E[N] is contained
    in E(F_{p^k}) iff N | p^k - 1 [recall-confident, NOT re-verified].'
  - Kani's criterion and its algorithmic use require a maximal isotropic kernel of graph type
    [recall-confident; KN-TECH-026 in this corpus].
  - H-ENDO-001's scalar-action argument (approved, no evidence) is used as a FILTER exactly
    as GOAL-ENDO-001 permits, not re-tested here.
  heuristic_assumptions:
  - id: HA-1
    statement: No heuristic is load-bearing. (B) and (C3) are exact; (C2) is a cost statement
      resting on the best published isogeny-evaluation exponent.
    rigorous_ingredient: Balasubramanian-Koblitz rationality criterion; alternation of the
      Weil pairing on a cyclic group; End(Z/N) = Z/N for prime N.
    distribution_imitated: not_applicable
    validation_route: The 2x2 contingency table of the minimal test is a direct check of the
      only non-trivial input, at toy scale, labelled toy.
    tail_checks: Not applicable. The analogue is the planted k_emb = 1 positive control, which
      must populate the off-diagonal cell the negative claim predicts empty for k_emb > 1.
  - id: HA-2
    statement: 'For the C2 pricing only: it is assumed that no sub-square-root algorithm exists
      for evaluating an N-isogeny of PRIME degree N between abelian surfaces over F_p. This
      is the standing state of the art, not a theorem.'
    rigorous_ingredient: sqrt-Velu achieves Otilde(sqrt(N)) for prime-degree isogenies of
      elliptic curves [recall-confident], and no better prime-degree exponent is known in
      dimension 2.
    distribution_imitated: not_applicable
    validation_route: Literature scan when web access is restored; until then the assumption
      is flagged and the C2 conclusion is stated as conditional on it.
    tail_checks: not_applicable
  target_complexity:
    time_exponent: No improvement claimed. What is foreclosed would have been a polynomial-
      time break (the SIDH template runs in polynomial time when its inputs are available),
      so the foreclosed prize is maximal and the closure is worth recording. The standing
      exponent stays 1/2.
    memory_exponent: Not applicable. The C2 route would need Otilde(sqrt(N)) memory under
      sqrt-Velu, matching BSGS and hence dominated.
    best_known_baseline: rho at 0.886 sqrt(N) time, O(1) memory; MOV/Frey-Ruck polynomial
      time when k_emb is small (KN-TECH-032).
    hidden_overhead_disclosure: None hidden. The one soft point is HA-2 (no sub-sqrt prime-degree
      higher-dimensional isogeny algorithm), stated explicitly.
    time_memory_tradeoff: not applicable to a closure.
  sota_delta: Zero speedup. The delta is that the biggest recent external ingredient in isogeny
    cryptanalysis is priced out of prime-field ECDLP by an equality rather than by silence,
    with the residual open cell named.
  dominated_by: 'n/a (no result claimed). Frontier rows checked and not approached: rho 0.886
    sqrt(N) / O(1); BSGS sqrt(N) / sqrt(N); automorphism-discounted rho 0.886 sqrt(N/r) /
    O(1); van Oorschot-Wiener sqrt(N^3/w) / w; MOV when k_emb small (polynomial, but only
    in the degenerate cell this record identifies).'
  estimated_cost: "Implementation: >-\n  low for part (i) (order tests and ord_N(p)); medium\
    \ for\npart (ii) (needs an abelian-surface isogeny library). Compute: low."
  recommended_priority: high
  honest_prior_of_survival: 0.92 that the contingency table comes out exactly as predicted
    (it is a restatement of a standard criterion). 0.03 that any escape survives. The record's
    expected value is in preventing a recurring high-cost proposal class rather than in the
    chance of a surprise.
  novelty_status: unverified
  novelty_screen: Same corpus screen as E3-01, plus grep of ledger/proposals for "Kani|higher-dimensional
    isogeny|abelian surface|glue-and-split|Robert embedding" (all hits inspected; every one
    is supersingular / SIDH / SQIsign context, RQ-SSI-001 or RQ-SQISIGN-*), and of KNOWLEDGE_BARRIERS
    for KN-TECH-025/026 and KN-FIND-b7e091. WEB SEARCH UNAVAILABLE; the Balasubramanian-Koblitz
    and sqrt-Velu citations are recall-confident and unverified.
  discriminated_from: IDEA-20260806-7955a5 applies Kani's input conditions to a supersingular
    / rank question and returns NOT_IN_KANI_REGIME; that record's object is a published rank,
    this record's object is F_p-rationality of torsion and its conclusion is an if-and-only-if
    with the embedding degree. IDEA-20260807-464ff8 and -30868b close distortion maps and
    one-point self-pairings on G; those are pairing questions, this is a kernel- assembly
    question, and the shared ingredient (cyclic G) is used for a different conclusion. IDEA-20260807-653dda
    / -6c7540 develop k_emb = ord_N(t-1); this record uses k_emb = ord_N(p) as a rationality
    criterion rather than as a transfer cost.
