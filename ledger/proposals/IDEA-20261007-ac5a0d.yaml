idea:
  id: IDEA-20261007-ac5a0d
  question_id: RQ-SSI-001
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    At least one supersingular j at p = 23 admits a degree-2
    endomorphism
  class: measurement
  claim: >-
    Let p = 23. The number of supersingular j-invariants in
    F_{p^2} that satisfy Phi_2(j, j) = 0, for the degree-2 modular
    polynomial, is at least 1.
  mechanism: >-
    Phi_2(j, j) = 0 means a cyclic isogeny of degree 2 from a curve
    of invariant j to a curve of the same invariant, an endomorphism
    of degree 2. Multiplication by an integer has square degree, so
    degree 2 is not [n]. The object is that self-correspondence on
    the supersingular j-line. It is not the count of rational roots
    of a 2-division cubic, and it is not a character sum. A count of
    0 falsifies the claim. No path-finding algorithm is proposed.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Equal point counts across an isogeny class do not decide
        whether Phi_2(j, j) vanishes.
      verified_by: coordinator
    - ref: RQ-SSI-001
      provenance: internal
      claim: >-
        Toy-scale auxiliary structure is in scope, and toy-only
        effects are hypothesis-generating only.
      verified_by: coordinator
  assumptions:
    - Phi_2 is the degree-2 modular polynomial used by the test, checked by the control below before any supersingular j is scored.
    - j-invariants are taken in F_{p^2}. A root in a larger field is not counted.
    - Supersingularity uses the same trace test the class list records.
  predictions:
    - metric: number of supersingular j in F_{p^2} at p = 23 with Phi_2(j, j) = 0
      direction: higher
      minimum_effect: The count is at least 1. The count 0 is the negative.
  minimal_test:
    design: >-
      List supersingular j-invariants in F_{p^2} at p = 23 and
      evaluate Phi_2(j, j). Before that list is scored, the same
      polynomial must return 0 on the j-pair of a Vélu 2-isogeny
      with a rational kernel, and must return nonzero on the pair
      (0, 1).
    controls:
      - The Vélu 2-isogeny pair evaluates to 0, and (0, 1) does not.
      - Each j is scored once. A repeated j is not a second hit.
      - A nonsupersingular root of Phi_2(X, X) is listed and is not added to the count.
    required_metrics:
      - number of supersingular j-invariants in F_{p^2}
      - number of those j with Phi_2(j, j) = 0
      - pass or fail of the Vélu pair check
  falsification_conditions:
    - The Vélu pair check passes and the supersingular count is 0.
    - The Vélu pair check fails. No supersingular count from that run is admissible.
  confounders:
    - Using Phi_ell for ell other than 2 scores a different endomorphism degree.
    - Counting geometric isogenies whose codomain j differs from the domain j inflates a different set.
  interpretation_limits:
    - A count of at least 1 at p = 23 does not change supersingular isogeny exponents.
    - The claim does not say every class has three rational points of order 2.
    - This is not a security claim.
  heuristic_assumptions:
    - id: H1
      statement: >-
        At least one supersingular j at p = 23 is assumed to lie on
        the diagonal of the degree-2 modular correspondence. No
        class-number or endomorphism-ring theorem was opened to
        force that root.
      rigorous_support: >-
        Phi_2(j, j) is a polynomial evaluation. Existence of a root
        inside a finite list is a finite check. The expectation that
        the supersingular list meets the diagonal is the heuristic.
      validation_plan: >-
        Direct evaluation at p = 23, and the same count at p = 19.
        Comparison is the count against 1 and against 0. Refutation
        is a count of 0 at p = 23.
  target_complexity:
    time_exponent: >-
      Unchanged. The archived supersingular algorithm remains
      p^{1/3+o(1)}. A diagonal root is not an attack exponent.
    memory_exponent: >-
      Unchanged. The census stores the supersingular j-list at
      p = 23.
    best_known: >-
      RQ-SSI-001 keeps the surviving path-finding bounds.
      KR-RHO-755e35 does not price Phi_2(j, j).
    hidden_overhead: No new o(1) is claimed.
    tradeoff_note: >-
      No time-memory tradeoff. The p = 19 count is a validation
      sample.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      The claim is a root count of one modular polynomial on one
      toy supersingular list. It is not an ECDLP cost or exponent.
    nearest:
      - ref: KR-RHO-755e35
        provenance: internal
        relation: orthogonal
        delta: >-
          Equal point counts do not decide Phi_2(j, j) = 0. The gap
          is a count of at least 1 versus a count of 0.
        verified_by: coordinator
      - ref: KR-RHO-53c89f
        provenance: internal
        relation: orthogonal
        delta: >-
          Special-curve transfers are not this diagonal root. The
          numerical gap remains 1 versus 0.
        verified_by: coordinator
    searched:
      corpus_grep:
        - origin/main SSI proposals dated 20261005 through 20261007
        - pull requests 1968 and 1969 idea claims
      web: []
  dominated_by: >-
    KR-RHO-755e35 and KR-RHO-53c89f were opened. Neither states the
    number of supersingular j at p = 23 with Phi_2(j, j) = 0.
    Neither dominates the gap between a count of at least 1 and a
    count of 0.
  sota_delta: >-
    Claimed count at least 1. The negative is count 0. The gap is
    at least 1. The comparison is that integer, not an exponent.
