idea:
  id: IDEA-20261006-dcc7f7
  title: >-
    Integer carry of x agrees with an x-wrap of the sum on at least 11
    of 24 pairs over one F_31 curve
  class: measurement
  claim: >-
    On the first ordinary short-Weierstrass curve y^2 = x^3 + A x + B
    over F_31, with (A, B) scanned from (1, 1) in lexicographic order,
    nonsingular, and with trace not divisible by 31, let n be the
    largest prime factor of the point count and require n at least 13.
    Draw 24 ordered pairs of distinct points in the prime-order
    subgroup whose sum is not the identity. Let c be 1 when the sum of
    the least nonnegative residues of x(P) and x(Q) is at least 31, and
    let u be 1 when the least nonnegative residue of x(P+Q) is strictly
    smaller than both x(P) and x(Q). Let N be the number of pairs with
    c = 1 and u = 1. The claim is N at least 11. A finished N of 10 or
    less is the concrete negative. Representation class R1, the least
    nonnegative integer digit of x. The attack stage is collision
    structure only as a coordinate statistic. The time exponent stays
    1/2.
  mechanism: >-
    OBJECT FRAME. Representation R1: the least nonnegative residue of
    the affine x-coordinate, added as an integer in {0, ..., 30}, with
    a carry bit c when that integer sum meets or exceeds 31. Operation
    set Sigma is addition of two independent subgroup points, not
    doubling and not the full translation orbit. Trichotomy:
    coordinate-dependent. The carry is a function of the chosen integer
    residues, and the curve sum does not have to wrap its x-coordinate
    when that integer sum carries. LOSSY-PROJECTION TEST against Sigma.
    The pair (c, u) discards both points and keeps two bits. The image
    has four values, so the projection is lossy whenever more than one
    pair is scored. The priced open number is N, the count of pairs
    where both bits are 1, with separator 11. Off-limits families are
    not the lens. No factor base is proposed. This is not a y-half bit
    and it is not a doubling agreement.
  novelty_status: unverified
  status: proposed
  added: '2026-10-06'
  proposed_by: coordinator
  approved_by: null
  question_id: RQ-ECDLP-623a32
  citations:
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm on a prime-order group needs Omega(sqrt(p))
        group operations. This idea cites that bound as the unchanged
        baseline, not as a statement about integer carries of x.
      verified_by: >-
        coordinator opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
    - ref: KR-RHO-5b1c0a
      provenance: internal
      claim: >-
        A representation/subset-sum approach over F_{p^2} costs
        p^{1.314}, worse than rho. This idea does not run a subset-sum
        attack and stays on the prime field F_31.
      verified_by: >-
        coordinator opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-5b1c0a.yaml
        on 2026-10-06
    - ref: KN-FIND-ffe1df
      provenance: internal
      claim: >-
        Theorem C says an exactly sum-compatible bucket index on a
        prime-order group is a surjective homomorphism, impossible for
        1 < M < N. The carry bit is not asserted to be sum-compatible.
      verified_by: >-
        coordinator opened knowledge/findings/KN-FIND-ffe1df.md
        (Theorem C paragraph) on 2026-10-06
  assumptions:
    - >-
      x-coordinates are least nonnegative residues in {0, ..., 30}.
      A signed residue is a different digit and is not scored.
    - >-
      Pairs with P + Q equal to the identity are excluded before N is
      counted. They are not pairs with u = 0.
    - >-
      The first eligible (A, B) is selected by nonsingularity, trace
      not divisible by 31, and n at least 13, before N is scored.
  predictions:
    - metric: N, the number of the 24 pairs with c = 1 and u = 1
      direction: higher
      minimum_effect: >-
        N at least 11. A finished N of 10 or less is the concrete
        negative.
  minimal_test:
    design: >-
      Scan A from 1 upward and, for each A, B from 1 upward, on
      y^2 = x^3 + A x + B over F_31. Skip singular models, models
      whose trace is divisible by 31, and models whose largest prime
      factor n is less than 13. On the first remaining curve, take
      the prime-order subgroup generated by the first affine point of
      order n in (x, y) lexicographic order. Draw pair index t from 0
      through 23 by SHA-256 of the UTF-8 string
      IDEA-20261006-dcc7f7|pair|{t}|{side} reduced modulo n - 1, plus
      1, as a scalar, side in {P, Q}. Reject a draw when the two
      points coincide or sum to the identity, and redraw that index
      once with the suffix |retry. If the redraw still fails, stop
      and record the test incomplete. Count N on the 24 accepted
      pairs. Stop after one curve.
    controls:
      - >-
        Negation control: x(-P) = x(P) for every scored point. The
        carry does not see a sign. Any failure of this identity
        invalidates the digit and N is not scored.
      - >-
        Shuffle control: 200 shuffles of the 24 carry bits against
        the fixed wrap bits. Record the 95th percentile of the
        shuffled counts. N is still scored against 11, not against
        that percentile.
      - >-
        Identity check that every accepted sum lies on the curve.
    required_metrics:
      - selected A and B
      - n
      - N
      - number of rejected draws
      - negation-control pass or fail
  falsification_conditions:
    - A finished sample of 24 accepted pairs has N at most 10.
    - No (A, B) with A, B at most 12 yields an eligible curve.
    - The negation control fails.
  confounders:
    - >-
      Twenty-four pairs is a small sample. N at least 11 is about a
      0.02 upper tail under an independent fair-bit model, so a single
      curve can miss it without saying anything about a larger prime.
    - >-
      The least-nonnegative cut is a coordinate convention. A balanced
      signed digit would be a different carry.
    - >-
      Pairs that sum to the identity are excluded. A curve with many
      such collisions in the draw shrinks the accepted sample only
      through the one redraw; a second failure stops the test.
  interpretation_limits:
    - >-
      A count on F_31 is claim_tier toy. It does not change time
      exponent 1/2 or memory exponent 0.
    - >-
      This is not a factor base and does not enter index calculus.
    - >-
      The carry is not claimed to be sum-compatible, so Theorem C of
      KN-FIND-ffe1df is a fence, not a hypothesis under test.
    - >-
      KR-RHO-5b1c0a is a subset-sum cost over F_{p^2}. This idea does
      not build those lists.
  heuristic_assumptions:
    - id: H1
      statement: >-
        If the carry bit and the wrap bit were independent and each
        equal to 1 on about one quarter of pairs, N would follow
        Binomial(24, 1/4). The excess claim is the upper tail of that
        law. No transfer to a larger prime is assumed.
      rigorous_support: >-
        Finite binomial model on 24 paired bits. The opened row
        KR-RHO-13bf67 is the complexity baseline, not a distributional
        theorem for this carry.
      validation_plan: >-
        Compute the exact binomial tail with arbitrary-precision
        integers. The separator 11 is the smallest integer k such that
        P(X >= k) for X binomial(24, 1/4) is at most 0.05, since the
        tail at 10 is about 0.055 and the tail at 11 is about 0.021.
        Beside that, the 200 shuffles of c against fixed u must have
        their own 95th percentile at most 11. If that shuffle
        percentile is 12 or more, the independence model is a poor
        description of the pairing and N is not scored.
  target_complexity:
    time_exponent: >-
      unchanged p^{1/2} group operations for a prime-order subgroup
    memory_exponent: >-
      unchanged O(1) distinguished-point memory for the rho baseline;
      this measurement stores one curve of size less than 2*31
    best_known: >-
      Pollard rho, Theta(sqrt(N)) group operations, KR-RHO-13bf67
    hidden_overhead: >-
      none claimed; no new algorithm is proposed, so there is no o(1)
      term
    tradeoff_note: >-
      No time-memory tradeoff is proposed. One enumeration of 24 sums
      does not use parallelism.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    No opened row dominates this count. Rows opened and not dominating
    N: KR-RHO-13bf67 (generic Omega(sqrt(p)) bound; this idea does not
    search), KR-RHO-5b1c0a (subset-sum over F_{p^2} at p^{1.314}; this
    idea stays on F_31 and does not build lists), KR-RHO-cb1c58
    (batched inversion across walks; this idea does not invert),
    KR-IC-5931ee (naive prime-field Semaev does not beat generic
    methods; this idea has no summation polynomial). KR-RHO-13bf67 is
    the matching exponent baseline, not a stricter result about N.
  sota_delta: >-
    Zero change to time exponent 1/2 and to memory exponent 0 against
    KR-RHO-13bf67. The new quantity is N, the number of 24 pairs on
    one curve over F_31 where the integer carry of x and the x-wrap
    of the sum are both 1, scored against the separator 11.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-5b1c0a
      - KR-RHO-cb1c58
      - KR-IC-5931ee
      - KR-RHO-53c89f
    nearest:
      - ref: KR-RHO-5b1c0a
        provenance: internal
        relation: orthogonal
        delta: >-
          That row prices a subset-sum representation over F_{p^2} at
          p^{1.314}. This idea does not search and does not leave the
          prime field. The scored quantity is a count N of carry-and-wrap
          pairs against the separator 11.
      - ref: KR-RHO-cb1c58
        provenance: internal
        relation: orthogonal
        delta: >-
          That row shares one inversion across many walks. This idea
          counts an integer carry of x-coordinates. It does not batch
          inversions and does not change the cost of an affine step.
      - ref: KN-FIND-ffe1df
        provenance: internal
        relation: orthogonal
        delta: >-
          Theorem C forbids an exactly sum-compatible nontrivial bucket
          index. This carry is not offered as a sum-compatible index.
    searched:
      corpus_grep:
        - >-
          ledger/proposals on origin/main and the idea files of PRs
          1939 and 1937, for integer carry, Edwards inversion, and
          chord slope
      web: []
      blocked:
        - web search not run; novelty_status stays unverified
