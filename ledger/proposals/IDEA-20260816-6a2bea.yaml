idea:
  id: IDEA-20260816-6a2bea
  question_id: RQ-ALR-002
  added: '2026-08-16'
  title: 'Measure what a truncated nested projector moment stream actually discards by counting the
    collision fiber: how many distinct weighted candidate configurations share the first j moments
    for every j below 2c, so that moment order becomes a measured lossiness curve rather than a threshold
    quoted from the reconstruction bound'
  class: mechanism
  claim: '(A) H-ALR-002 records that exactly 2c weighted source moments recover a degree-c candidate
    locator by weighted Hankel rank and Berlekamp-Massey coefficient reversal, and EV-ALR-002 confirms
    this on 13 controls. The number 2c is a sufficiency threshold. What no ALR record states is the
    shape of the loss below it: at j moments with j < 2c, how large is the set of distinct configurations
    of weights and abscissae that produce the identical moment prefix. (B) That fiber size is the
    honest content of the lossy-projection test for this object. A projection to j scalars from an
    n-point weighted support is lossy exactly to the extent that the fiber is large, and it is a change
    of coordinates when the fiber is a single point. The entry measures the fiber size as a function
    of j and reports the curve. (C) Concretely: for fixed toy parameters, enumerate or sample configurations
    of c nonzero weights on distinct abscissae over F_p, group them by their first j moments, and
    report the distribution of group sizes for j = 1, 2, up to 2c and beyond. The predicted law is
    that the fiber size falls like p^(c-j) for j at most c and collapses to one at j = 2c, so the
    measured curve either exhibits that geometric decay or does not. (D) The operational payoff is
    a truncation budget: if the fiber is already small at j well below 2c, a constructor may emit
    fewer moments and verify; if the fiber stays large until the last moment, the 2c figure is tight
    and there is no cheaper interface. (E) NOT CLAIMED: no attack, no speedup, no claim that fewer
    than 2c moments suffice for exact recovery, no claim that any constructor emitting fewer moments
    exists, and no assertion about the literature on Prony-type reconstruction. The entry measures
    a fiber; it builds nothing, and a small fiber at a small enumerable cell is a statement about
    that cell only.'
  mechanism: 'STAGE 1, fix the configuration space. A configuration is a set of c distinct abscissae
    in F_p together with c nonzero weights, matching the shape H-ALR-002 specifies with squarefree
    source divisor and distinct source x-coordinates. STAGE 2, define the measurement. For each configuration
    compute the moment vector M_k = sum over P of m_P times x(P)^k, for k from 0 to j-1, exactly over
    F_p. STAGE 3, at small p and small c, enumerate the configuration space exhaustively and bucket
    configurations by their moment prefix, producing exact fiber-size distributions rather than estimates.
    At larger p, sample and estimate collision rates by birthday counting with the sampling design
    recorded. STAGE 4, plot fiber size against j and locate the j at which the median fiber size reaches
    one and the j at which the maximum fiber size reaches one, reporting both. STAGE 5, run the identical
    bucketing against the two null arms described below and compare curves. STAGE 6, apply the protocol''s
    structural tell: fiber size should decay as j increases, because more moments is more information.
    A fiber size that stays flat across j is the signature of a bucketing bug or of a degenerate configuration
    space, not of a hard object, and the run reports flatness as an instrument fault. The claim is
    established by a decay curve matching or departing from the p^(c-j) law with the departure quantified,
    and refuted if buckets do not collapse by j = 2c, which would contradict EV-ALR-002 and indicate
    a measurement fault here rather than there.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read in full ledger/questions/RQ-ALR-002.yaml, ledger/hypotheses/H-ALR-002.yaml, ledger/evidence/EV-ALR-002.yaml
      and experiments/EXP-ALR-002/specification.yaml. Greps run: grep -ril ''power.projection|modular
      composition|Berlekamp.Massey|Prony'' ledger/proposals/ (3 hits: IDEA-20260807-fafc04, IDEA-20260814-270e03,
      IDEA-20260805-72bcb5, all titles resolved); grep -ril ''projector'' ledger/proposals/ (4 hits,
      all titles resolved); grep -ril ''Fermat'' ledger/ knowledge/ (only H-ALR-002 in the ledger).'
    results: IDEA-20260807-fafc04 under RQ-EQLA-0d3f40 uses Berlekamp-Massey and the linear complexity
      of a Krylov sequence, but its object is the minimal polynomial of an index-calculus relation
      operator under an equivariance fold, not a weighted moment stream, and its question is whether
      an isotypic basis change is free. IDEA-20260814-270e03 under RQ-ECDLP-002 tracks the linear-recurrence
      complexity of a coordinate word and explicitly measures state-collision fibers over toy scalars,
      which is the nearest methodological neighbour found anywhere in the repository. The four projector
      hits are FN-DSA, ML-KEM, SNOVA and RQ-MSI records with no relation to nested projector moments.
      RQ-ALR-002 carries zero proposals.
    verdict: 'UNVERIFIED. No claim is made about published work. Assembled from known parts: collision-fiber
      counting as a discipline is taken directly from IDEA-20260814-270e03 and named as such, and
      the 2c sufficiency threshold is inherited verbatim from H-ALR-002 and EV-ALR-002. Claimed new
      only as the application: measuring the fiber of the truncated weighted moment map for the ALR
      nested projector object, which converts a quoted sufficiency threshold into a measured lossiness
      curve, and which no record in this repository does for this object.'
  object_first_candidate:
    tracked_object: 'The truncated weighted moment vector of length j: the first j power sums, weighted
      by the Fermat-projector trace weights m_P, of the source abscissae. The object followed through
      the computation is this length-j vector of field elements, never the underlying configuration
      of abscissae and weights that produced it.'
    lossiness: 'The projection discards the individual pairs (m_P, x(P)) entirely and keeps j field
      elements in place of 2c or more. For j below 2c this is genuinely lossy and the fiber is the
      measurable proof of it: many distinct candidate configurations map to the same prefix, and no
      locator can be recovered. At j equal to 2c the map becomes injective on configurations of support
      size c, and beyond that the projection stops discarding anything relevant, so moments past 2c
      are a change of coordinates and the entry says so explicitly. The retained prefix still propagates
      because power sums are additive over the source support and each step of the target operation
      contributes to every moment by a fixed rule.'
    propagation: One step of the target operation is adding one source point P with its projector-trace
      weight m_P to the accumulated moment stream. It acts on the tracked object by the map M_k to
      M_k plus m_P times x(P)^k for every k simultaneously, which is deterministic, exactly computable,
      and independent of the order in which source points are processed. The Hankel matrix built from
      the prefix gains rank at most one per added support point, which is the deterministic rank staircase
      the run measures alongside the fiber.
    survival_score: 'The structure survives to exactly j = 2c and becomes redundant beyond it, which
      is the reconstruction side. On the lossiness side the interesting survival number is how far
      below 2c the fiber remains larger than one: the entry reports the smallest j at which the median
      fiber size is one, and the smallest j at which the maximum fiber size over all enumerated configurations
      is one, and states these separately because a median-one fiber with a large maximum is not a
      recovery guarantee.'
  null_object_control: 'Replace the projector-trace weights by uniformly random nonzero elements of
    F_p on the same abscissae, keeping support size c fixed, and run the IDENTICAL bucketing and fiber
    counting in the same invocation. The null must show the generic collision behaviour: fiber sizes
    decaying like p^(c-j) with collapse at 2c, since a weighted Vandermonde system with random weights
    is generically nondegenerate. The signal arm means something only if the elliptic projector weights
    depart from that curve, either by colliding more, which would indicate the weights carry less
    information than random ones, or less, which would indicate structure. A second null replaces
    the abscissae by random field elements while keeping the elliptic weights, separating weight structure
    from support structure.'
  discriminated_from:
  - IDEA-20260814-270e03 counts state-collision fibers for a coordinate-word recurrence under a public
    predicate on x-coordinates, gating on a companion-state decoder; this entry counts fibers of a
    weighted moment map whose weights are Fermat-projector traces, an entirely different map with
    an entirely different domain, and the shared content is the fiber-counting discipline, which is
    cited.
  - IDEA-20260807-fafc04 measures the degree of a minimal polynomial and the linear complexity of
    a Krylov sequence to decide whether an equivariance fold is free; it concerns a relation operator
    in index calculus, not a moment stream, and asks a cost question rather than a lossiness question.
  - EV-ALR-002 itself, which records that 2c moments suffice on 13 controls; that is a sufficiency
    statement, while this entry measures the failure profile strictly below the threshold, which no
    record contains.
  - 'The blacklisted P(decomp) as a distribution rather than a scalar, IDEA-20260815-f9e978: that
    record replaces a scalar probability by a distribution in the decomposition lane; this entry replaces
    a scalar threshold by a fiber-size curve for a moment map, sharing only the general shape of the
    move and none of the object.'
  - 'Generic Prony or Berlekamp-Massey variants with no new tracked object: the tracked object here
    is the truncated prefix and the deliverable is its fiber, not a reconstruction algorithm.'
  assumptions:
  - The source divisor is squarefree with distinct source x-coordinates, as H-ALR-002 assumes.
  - Total target degree stays below the characteristic in every enumerated cell, so weights are nonzero
    exactly on candidates.
  - c is known to the measurement, since the fiber is defined relative to configurations of a fixed
    support size.
  - Exhaustive enumeration is feasible at the smallest cells, so the sampled cells can be calibrated
    against exact counts.
  - Field arithmetic is exact and bucketing is by exact equality, never by a tolerance.
  predictions:
  - metric: median_fiber_size_at_j_equals_c
    direction: higher
    minimum_effect: 2
  - metric: smallest_j_with_maximum_fiber_size_one
    direction: different
    minimum_effect: 2c, forced by the weighted Vandermonde reconstruction that EV-ALR-002 already
      verified; a measured value below 2c would contradict that record and a value above it would
      indicate a measurement fault
  - metric: log_fiber_size_slope_against_j_below_c
    direction: lower
    minimum_effect: -0.8
  - metric: elliptic_arm_minus_random_weight_null_arm_median_fiber_size
    direction: different
    minimum_effect: 0
  minimal_test:
    design: 'One Python script over exact F_p arithmetic. Take p in 11, 13, 17 and c in 2, 3, where
      the configuration space of c distinct abscissae with c nonzero weights is small enough to enumerate
      exhaustively. For each configuration compute the full moment vector to length 2c plus 2, then
      for each j bucket configurations by their length-j prefix using an exact dictionary keyed on
      the integer tuple. Report per j the number of buckets, the median bucket size, and the maximum
      bucket size. In the same invocation repeat verbatim with weights drawn uniformly at random and
      again with abscissae drawn uniformly at random, giving two null arms. The exhaustive cells cost
      seconds and calibrate the sampled cells at p = 101 and c = 4, where 10^6 sampled configurations
      give collision estimates with stated binomial error. It discriminates because the buckets are
      exact and the collapse point is a hard fact about the map: a run that fails to collapse at 2c
      has a bug, and a run that collapses much earlier has found something the sufficiency threshold
      hides.'
    controls:
    - Random-weight null arm on identical abscissae, same invocation.
    - Random-abscissae null arm with elliptic weights, same invocation, separating weight structure
      from support structure.
    - 'Exhaustive-versus-sampled calibration: at the smallest cells the sampled estimator must reproduce
      the exact bucket statistics within its stated error.'
    - Collapse assertion at j = 2c, which must hold in every arm and is a check on the implementation
      before any curve is read.
    - 'Monotonicity assertion: bucket count must be non-decreasing in j, since a longer prefix cannot
      merge buckets.'
    required_metrics:
    - bucket_count_per_j
    - median_fiber_size_per_j
    - maximum_fiber_size_per_j
    - smallest_j_with_median_fiber_size_one
    - smallest_j_with_maximum_fiber_size_one
    - log_fiber_size_slope_against_j
    - null_arm_fiber_curves
    - weighted_hankel_rank_per_j
  falsification_conditions:
  - Buckets fail to collapse to size one at j = 2c in any arm, contradicting EV-ALR-002 and indicating
    a measurement fault rather than a result.
  - Bucket count is not monotone in j, which is impossible for a prefix map and therefore identifies
    a bug.
  - The elliptic arm's fiber curve is indistinguishable from both null arms at every j, so projector
    weights carry no structure beyond random weights.
  - The measured slope of log fiber size against j is flat below c, the structural tell that the measurement
    is not seeing information accrue.
  - The sampled estimator disagrees with the exhaustive count outside its stated error at the calibration
    cells.
  - Weights are found to vanish on true candidates in any cell, indicating the below-characteristic
    assumption was violated and the configuration space is not what it was declared to be.
  confounders:
  - Small p making the whole configuration space degenerate, so fibers are large for counting reasons
    rather than structural ones; the multi-p sweep bounds but does not remove this.
  - Fixing c in the measurement while a real constructor would not know c, so the measured fiber is
    conditional on information a constructor lacks.
  - Weight distributions induced by the projector being nearly constant, which would make the elliptic
    arm resemble a uniform-weight arm rather than a random-weight arm; a uniform-weight third arm
    is therefore recorded even though it is not a null.
  - Sampling bias in the large-p cells if abscissae are drawn with replacement, which would manufacture
    collisions.
  - Hankel rank being computed over F_p where no direction is negligible, so rank is exact and no
    truncation tolerance exists, which is a strength here but makes the curve insensitive to near-degeneracy.
  interpretation_limits:
  - A small fiber below 2c does not exhibit a constructor that emits fewer moments; it states that
    fewer moments would not have been ambiguous at the tested parameters.
  - All curves are scoped to the tested p and c, and c is small enough to enumerate, which is far
    from any operational regime.
  - Fiber size is measured relative to a known support size c, and a constructor that must also discover
    c faces a different and larger problem.
  - No claim is made about reconstruction stability, since over F_p there is no metric and near-degeneracy
    has no meaning.
  target_complexity:
    time_exponent: No attack exponent is claimed. The entry reports the enumeration and bucketing
      cost as an observed count of field operations, which is a property of the measurement and not
      of any algorithm against the ECDLP.
    memory_exponent: No memory exponent is claimed for any attack. The relevant reported quantity
      is the interface length j in field elements, compared against the 2c figure H-ALR-002 specifies,
      and against the nN body that EV-ALR-002 records for the represented routes.
    best_known: The incumbent interface is the 2c-moment stream that H-ALR-002 specifies and EV-ALR-002
      verifies on 13 controls; this entry measures whether the prefix below it is as uninformative
      as the threshold implies and claims no improvement on the interface.
    hidden_overhead: 'Hidden in the lower-order terms is the cost of knowing c, which the measurement
      is given for free and a constructor is not, and the cost of verifying a candidate locator once
      emitted. The human cost hides in the bucketing key: keying on a tuple of field elements is correct,
      keying on a string representation silently merges buckets when representations are not canonical.'
  dominated_by: n/a (no result claimed). All frontier rows recorded in this lane were checked, namely
    the B^(5/2) rho proxy and the B^(7/2) represented projector and A-linear target-Krylov routes
    named in EV-ALR-002, and a fiber-size curve is not a point on any of them.
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverable is
    the fiber-size curve against j with its slope, the smallest j at which the maximum fiber size
    reaches one, and the difference between that j and the quoted 2c.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'That the exhaustive cells run and the collapse at 2c is reproduced: 0.9,
    since EV-ALR-002 already verified the reconstruction on 13 controls and a failure here would be
    a bug in this run. That the fiber curve shows clean geometric decay matching p^(c-j): 0.6, because
    that is the generic prediction and the elliptic weights may perturb it. That the elliptic arm
    departs measurably from the random-weight null: 0.3, since projector traces are small nonnegative
    integers reduced mod p and may behave close to arbitrary nonzero weights for collision purposes.
    That the maximum fiber size reaches one strictly before 2c at any tested cell: 0.15, stated separately
    and low, because 2c is a tight bound for weighted Vandermonde reconstruction and an earlier collapse
    would more likely indicate a degenerate configuration space than a discovery.'
