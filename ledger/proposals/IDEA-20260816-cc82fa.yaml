idea:
  id: IDEA-20260816-cc82fa
  question_id: RQ-NTRU-9015ee
  added: '2026-08-16'
  title: 'Before the reduction profile is used as an observable of an NTRU lattice, test whether it
    is one: reduce three provably identical lattices presented in three different bases at the same
    budget and measure how far apart the resulting Gram-Schmidt profiles are relative to the dense-sublattice
    kink they are meant to detect'
  class: control
  claim: '(A) A Gram-Schmidt log-norm profile is a property of a basis, not of a lattice. Proposals
    in this program intend to read the dense-sublattice event off the profile of a reduced NTRU basis.
    That reading is valid only if, at the reduction budget actually used, the profile is a function
    of the lattice to within a tolerance smaller than the feature being read. This is testable directly
    and cheaply: present the same lattice in several bases related by unimodular transforms, reduce
    each under the identical algorithm and budget, and measure the spread of the resulting profiles.

    (B) The claim under test is that the profile spread across bases of the identical lattice, measured
    as the maximum over index i of the difference in log GS norm, is not small compared with the amplitude
    of the dense-sublattice kink that the profile is supposed to reveal, at the budgets this program
    can afford. If that is so, then profile-based detection of the overstretched event is instrument-limited
    and its sensitivity is set by basis presentation rather than by the lattice, and every profile-based
    measurement in the goal needs an error bar it currently does not have.

    (C) The contribution is an error bar, not a verdict: the deliverable is a measured tolerance tau(n,
    q, budget) which any later profile measurement must exceed before a feature is claimed. A small
    tau is a good outcome, licensing profile-based work; a large tau is a good outcome too, because
    it converts an unstated assumption into a measured obstruction with a number attached, which is
    what docs/inventor-protocol.md section 4 requires of a negative result.

    (D) What is NOT claimed: nothing about whether the overstretched event exists, where it sits,
    or whether it is detectable in principle; nothing about any parameter set; and no assertion that
    any specific proposal is wrong. It is not claimed that profile spread is caused by any particular
    mechanism. It is also not claimed that the tested transforms are representative of all bases;
    they are a specific, declared family, and the tolerance is scoped to that family, which is a real
    limitation because an adversarially chosen basis could be worse.'
  mechanism: 'Stage 1: construct, for one NTRU instance, four presentations of the identical lattice:
    the standard 2n x 2n block basis; its Hermite normal form; the result of applying a random unimodular
    transform with bounded entries; and the result of applying a random unimodular transform with
    large entries, which is the stress case because it destroys the input profile completely while
    leaving the lattice untouched. Verify identity of the lattices by checking equal Hermite normal
    forms, exactly, in integer arithmetic. This verification is what makes the experiment a control
    rather than a comparison of different objects.

    Stage 2: reduce all four under the identical algorithm and identical budget, recording the full
    Gram-Schmidt log-norm profile of each output.

    Stage 3: compute the spread, defined as the maximum over index of the range across the four profiles,
    and its restriction to the index window where a dense-sublattice kink is expected to sit. Compute
    the kink amplitude in the same units from an instance deliberately placed deep in the regime where
    a rank-n plant exists, so that the comparison of spread to feature is like for like.

    Stage 4: repeat across q on both sides of the region of interest, and across the matched random
    q-ary control, where no kink exists and the spread is therefore a pure instrument measurement.

    Refutation of the concern, which is the outcome that licenses further profile work, is a spread
    that stays below a fixed fraction of the kink amplitude at all tested cells. Confirmation of the
    concern yields tau as an explicit function of budget, which is directly usable: it tells later
    work how much budget buys how much profile stability.'
  novelty_status: unverified
  novelty_screen:
    method: Read all nine RQ-NTRU-9015ee proposal titles and classes; read IDEA-20260809-24eec3's
      title and claim opening in full since it is the proposal this control is aimed at. grep -ril
      'profile', 'basis-dependent', 'unimodular', 'Hermite normal form', 'instrument' over ledger/proposals/
      and ledger/hypotheses/. Read docs/inventor-protocol.md section 3 on controls before belief.
    results: IDEA-20260809-24eec3 proposes exactly the profile-as-observable reading this entry audits,
      and IDEA-20260809-2976d8 audits the estimator rather than the profile. 'profile' matched many
      proposals across the corpus (IDEA-20260727-006, IDEA-20260807-291968, IDEA-20260811-dcbea4 and
      others), none of which concern basis-invariance of a reduced lattice profile. No hit for 'unimodular'
      as a basis-presentation control in the NTRU proposals. The program's instrument-validity work
      is concentrated under RQ-INSTR-f8faa0 and concerns timing, machine variance and cost models,
      which is a different instrument entirely.
    verdict: 'UNVERIFIED. No claim about external literature; basis-dependence of reduction output
      is elementary and certainly known. What is claimed new relative to this repository is turning
      it into a pre-registered tolerance tau(n, q, budget) that gates the profile-based measurements
      this goal already plans, and requiring the kink amplitude to be measured in the same units in
      the same invocation so that the comparison is like for like. Assembled from known parts: Hermite
      normal form equality as an identity check, standard reduction, and the null lattice from IDEA-20260809-28289c.'
  object_first_candidate:
    tracked_object: The profile-difference vector d(i) = max over presentations of log ||b*_i|| minus
      min over presentations of log ||b*_i||, indexed by position i in 1..2n, for a fixed lattice
      and a fixed reduction budget.
    lossiness: 'Lossy: d(i) discards which basis produced which profile, all off-diagonal Gram-Schmidt
      coefficients, the actual short vectors found, and the lattice''s identity beyond its dimension.
      It retains only the envelope of disagreement. The discarded information is discarded compatibly
      with the operation of interest, increasing the reduction budget, because the envelope''s evolution
      under more budget is exactly the quantity of interest and does not require knowing which presentation
      was which. Honest caveat: if the presentations were to converge pairwise in a structured way,
      d(i) would hide that, so the raw per-presentation profiles are retained in the run artifacts
      even though d(i) is the primary object.'
    propagation: One step of the target operation is an increment of the reduction budget, either
      a larger block size or another tour. Under it each presentation's profile moves toward the algorithm's
      fixed shape and d(i) is expected to contract. The propagation claim is that d(i) contracts monotonically
      in budget and that its contraction rate, not its initial value, is the useful instrument characteristic,
      because it says how much budget buys how much agreement.
    survival_score: 'The object survives as long as the reduction algorithm has not fully converged,
      which at NTRU-relevant dimensions is essentially always at affordable budgets. It dissolves
      trivially in the regime where reduction reaches its fixed point, where d(i) goes to zero and
      the control becomes uninformative; that regime is reachable only at very small n, which is itself
      worth reporting as the boundary. Concretely: expected to be informative for 2n >= 32 at LLL-only
      and small block sizes, and expected to vanish at 2n <= 16.'
  null_object_control: 'The matched random q-ary lattice with the same dimension 2n, determinant q^n
    and modulus, presented in the identical four ways and reduced at the identical budget. This null
    has no dense sublattice, so any d(i) it exhibits is pure instrument spread with no feature to
    confuse it with. The null must show d(i) of the same order as the NTRU arm''s d(i) outside the
    kink window for the instrument interpretation to hold; if the NTRU arm''s spread were much larger
    everywhere, the spread would itself be structure-dependent, which is a different and also reportable
    finding. A second forced-value null: two presentations that are identical by construction must
    give d(i) = 0 exactly, which gates the pipeline.'
  discriminated_from:
  - IDEA-20260809-24eec3 uses the profile as a signal; this entry measures whether the profile is
    well-defined enough at affordable budgets to carry a signal, and produces the tolerance that proposal
    would need. It is a prerequisite, not a competitor, and it is aimed at that proposal by name.
  - IDEA-20260809-2976d8 scores the lattice estimator against certified recoveries; the estimator
    and the profile are different instruments and a valid estimator says nothing about profile stability.
  - RQ-INSTR-f8faa0's instrument work concerns timing, machine variance and cost models; nothing there
    measures the reproducibility of a geometric observable across equivalent inputs.
  - A convergence check on a single basis measures how the profile settles under more budget; this
    measures disagreement across presentations at fixed budget, which is a different and stronger
    requirement, since a profile can be stable per basis and still basis-dependent.
  - IDEA-20260809-28289c's matched nulls exist to give the signal arm a comparison; here the null
    is used as a pure instrument channel with no feature in it, which is a different use of the same
    object and is named as such.
  assumptions:
  - Hermite normal form equality is a sound identity check for two integer bases spanning the same
    lattice, which is exact and not heuristic.
  - A reduction implementation is available and deterministic given a seed, so that spread across
    presentations is not confounded with algorithmic randomness; if the implementation is randomised,
    the seed is fixed and a same-basis different-seed arm is added.
  - Large-entry unimodular transforms can be generated without integer blow-up making reduction infeasible;
    entry bounds are declared in advance.
  - The dense-sublattice kink has an amplitude measurable in the same log GS units, so the comparison
    of spread to feature is meaningful.
  predictions:
  - metric: d(i) for two identical presentations
    direction: different
    minimum_effect: forced value exactly 0; nonzero invalidates the pipeline
  - metric: maximum over i of d(i) at LLL-only budget, relative to the measured kink amplitude
    direction: higher
    minimum_effect: 0.5
  - metric: maximum over i of d(i) at the largest affordable block size, relative to LLL-only
    direction: lower
    minimum_effect: 0.5
  - metric: ratio of NTRU-arm spread to matched-null spread, measured outside the kink index window
    direction: different
    minimum_effect: no pre-commitment; the pre-committed statement is only that the ratio is reported
      with a CI, because a directional guess here would be invention
  minimal_test:
    design: 'One NTRU instance family at n = 24 and three moduli, one below, one near and one above
      the region where a rank-n plant is expected. For each instance produce four presentations, verify
      identical Hermite normal form exactly, reduce all four with the same algorithm, seed and budget,
      and record full profiles. Compute d(i), its maximum, and its maximum restricted to the index
      window where a kink appears in the deepest-regime instance. Run the identical pipeline on the
      matched random q-ary null. Repeat at two budgets, LLL-only and one small block size, so the
      contraction rate is measured rather than assumed. Twenty instances per cell. The discriminating
      quantity is max_i d(i) divided by the kink amplitude at the same cell: below 0.5 licenses profile-based
      detection with a stated error bar, above 1 says the profile is not an instrument at that budget
      and the number quantifies by how much.'
    controls:
    - Identical-presentation forced null, d(i) = 0 exactly, gating the pipeline.
    - Matched random q-ary lattice, same dimension, determinant and modulus, four presentations, same
      budgets.
    - Same-basis different-seed arm if the reduction implementation is randomised, separating algorithmic
      randomness from basis effects.
    - Budget ladder, at least two budgets, so contraction is measured.
    - Hermite normal form equality assertion on every presentation pair, which aborts the run if any
      two presentations are not the same lattice.
    required_metrics:
    - per-presentation Gram-Schmidt log-norm profile
    - d(i) vector
    - max_i d(i) per cell and budget
    - kink amplitude in the same units
    - ratio of spread to kink amplitude
    - contraction of max_i d(i) between budgets
  falsification_conditions:
  - The identical-presentation null returns nonzero d(i), invalidating the pipeline.
  - max_i d(i) below 0.2 of the kink amplitude at every cell and budget, which refutes the concern
    and licenses profile-based detection with a small error bar.
  - The Hermite normal form assertion fails on any pair, meaning the presentations were not the same
    lattice and no comparison is possible.
  - Spread fails to contract with increased budget, which falsifies the contraction claim in the propagation
    statement and means budget does not buy agreement.
  - Spread in the matched null being an order of magnitude below the NTRU arm outside the kink window,
    which would mean spread is structure-dependent and the pure-instrument reading is wrong.
  confounders:
  - Reduction implementation randomness masquerading as basis dependence, addressed by the fixed-seed
    and different-seed arms.
  - Large-entry unimodular transforms making reduction slower and so effectively lowering the budget
    for that presentation, which must be controlled by equalising budget in algorithm steps rather
    than in wall-clock.
  - Numerical precision in the reduction implementation's Gram-Schmidt, which at high entry magnitudes
    can itself produce spread; this is measured by recomputing profiles in exact arithmetic from the
    output basis.
  - Choosing the kink index window after seeing the data, which is prevented by fixing the window
    from the deepest-regime instance before the comparison cells are analysed.
  interpretation_limits:
  - The tolerance is scoped to the declared family of presentations; an adversarial presentation could
    be worse and nothing here bounds that.
  - A small tau licenses profile work at the tested budgets only, and budget-scaled conclusions do
    not transfer to larger n without a new measurement.
  - Nothing here bears on whether the overstretched event exists or where it sits.
  target_complexity:
    time_exponent: No attack exponent claimed. The control costs four reductions per instance instead
      of one, a constant factor of four on whatever the profile-based measurement would have cost.
    memory_exponent: No attack memory exponent claimed; memory is that of one reduction plus four
      stored profiles of length 2n.
    best_known: There is no incumbent tolerance for profile-based detection inside this repository;
      IDEA-20260809-24eec3 proposes the detection without one, which is exactly the gap this fills.
    hidden_overhead: The hidden cost is the requirement for a trustworthy reduction implementation
      with a known-answer control, which this environment does not obviously have; that cost is real
      and is recorded as a derivation gap rather than assumed away. The human cost is in pre-registering
      the kink index window.
  dominated_by: 'n/a (no result claimed). Frontier check: this produces no attack quantity, so there
    is no time, memory or data frontier row it could sit on. Against other instrument-validity work
    in the repository it is not comparable, because RQ-INSTR-f8faa0''s instruments are timing and
    cost models, not geometric observables.'
  sota_delta: No attack; measurement-validity contribution only. The delta is that profile-based claims
    in this goal would carry a measured error bar instead of none.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'That the forced null and Hermite assertions pass and the pipeline is
    sound: 0.85, with the residual risk entirely in reduction-implementation availability. That max_i
    d(i) is at least 0.5 of the kink amplitude at LLL-only budget, meaning the concern is real: 0.65,
    because LLL output shape is well known to depend on input presentation. That spread contracts
    by at least half at a larger block size: 0.7. That the resulting tau is small enough to license
    profile work at some affordable budget: 0.5. The entry is worth running under every branch of
    these, which is unusual and is the reason for the high priority.'
