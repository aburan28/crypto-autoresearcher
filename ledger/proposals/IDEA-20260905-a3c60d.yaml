idea:
  id: IDEA-20260905-a3c60d
  title: Predicate transport through a bounded-rank correspondence module
  class: composition
  claim: 'For a finite dictionary of public curve predicates, repeated isogeny pullback may remain in a bounded-rank
    linear space even when individual formulas grow. Conjecture: a useful such dictionary exists only when its connection
    matrices and exceptional components are compactly certifiable; otherwise predicate transport accumulates its
    full description cost.'
  mechanism: View advice predicates as functions attached to curve vertices. Each explicit correspondence pulls
    them back. A finite-dimensional span stable under these pullbacks permits transport by a connection matrix,
    while a loop tests consistency. Group-valued tables supply the trivial exact-retention boundary; coordinate
    indicators generally enlarge the span. A structural positive would be a family with unexpectedly slow span growth,
    not a claimed online solver. This directly asks when preprocessing retains mathematical value after transport
    while charging the storage of the dictionary and connection maps.
