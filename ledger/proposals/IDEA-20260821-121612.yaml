idea:
  id: IDEA-20260821-121612
  question_id: RQ-MLKEM-002
  added: '2026-08-21'
  title: >-
    Is the source-level stride reading this lane's obstruction depends on even WELL DEFINED on a
    compiled artifact? Freeze an unroll-normalized, memory-operand-based extractor; calibrate it
    at both ends (a hand-written .S floor, an archived known-incomplete routine as the nonzero
    anchor); run it over 40 toolchain cells on the TWO pinned, distinct, x86-buildable comparison
    routines EXP-MLKEM-009 rejected; and report where it is ambiguous
  class: measurement

  claim: >-
    (0) REVISION NOTICE, FIRST BECAUSE IT CHANGES THE DELIVERABLE. This record is a repaired
    revision filed under its own identifier after a red-team screen on 2026-08-21 found four
    blocking defects in its predecessor. (i) The previous Stage-1 rule summed the byte widths of
    LOAD INSTRUCTIONS in the back-edge; on x86 a folded memory operand (`vpxor -0x20(%rsi,%rax),
    %ymm1,%ymm0`, `vpternlogq`) consumes bytes without issuing a load instruction, so the rule
    undercounts by the number of folded operands even on a single-back-edge loop with
    unconditional loads -- exactly the case H1 claimed rigour for. (ii) The previous NULL-2 forced
    value (w = 32 in every AVX2-capable cell) was FALSE AS MEASURED: the screen compiled the
    declared NULL-2 body and reports clang 18.1.3 at `-O2 -march=x86-64-v3` unrolling it 8x to a
    256-byte-per-buffer back-edge while gcc 13.3 at the same settings emits a single 32-byte body,
    so the declared must-not-vary calibrator varies -- and varies for the very phenomenon the
    experiment exists to study, which is KN-TECH-1a5b7e mode 4. (iii) reachable_triples
    (L mod w > 0) was the headline deliverable, but a compiler-generated epilogue is emitted
    together with the main loop under a semantics-preservation obligation, so a nonzero residue in
    an auto-vectorised body says something about the unroll factor and NOTHING about defect
    reachability; the design had no arm in which the count should be zero. (iv) The population was
    stated as five candidates; the pinned, distinct, x86-buildable population is TWO.
    All four are repaired below. The extractor is redefined, the calibrators are replaced,
    reachable_triples is WITHDRAWN as a deliverable, and the matrix is re-scoped.
    (A) THE OBJECT. Every neighbourhood predicate this lane has used is evaluated on SOURCE
    TEXT. EXP-MLKEM-009's strict order rejected candidate libraries with phrases about source
    style ("length-parameterized CRYPTO_memcmp", "len/32 intrinsic loop + scalar remainder",
    "runtime-length scalar loop", "length-parameterized portable compare"), and
    IDEA-20260805-3c957e's obstruction turns on a per-candidate integer w, the effective vector
    stride, which its Stage B proposes to read FROM SOURCE. But w is not a property of source
    text. It is a property of the pair (source, toolchain configuration), and the red-team
    compiles above show it is not even a single well-defined integer per pair: a compiled body has
    a per-source-iteration granularity, an unroll factor, a back-edge granularity that is their
    product, and an epilogue, and the four are routinely different.
    (B) THE CLAIM, FALSIFIABLE AND SHARP, AND IT IS NO LONGER ABOUT RESIDUES. Under the frozen
    v2 extractor defined in Stage 1, for at least one of the two pinned x86-buildable routines
    there is at least one mainstream cell (gcc/clang at -O0..-O3/-Os with a -march in
    {x86-64, x86-64-v2, x86-64-v3, x86-64-v4}) in which the quantities the obstruction argument
    consumes are NOT WELL DEFINED -- i.e. the extractor must report AMBIGUOUS or UNMEASURABLE
    rather than an integer -- or in which the measured per-source-iteration stride w_source
    differs from the value the source reading assigns to that routine. The complement is equally
    reportable: determinacy 1.0 across all cells with w_source equal to the source reading
    everywhere means the shortcut IDEA-20260805-3c957e takes is licensed on this population by a
    stronger instrument than its own Stage B.
    (C) WHAT EACH ANSWER MEANS, DECLARED BEFORE THE RUN. Determinacy 1.0 and w_source stable:
    the source-level reading is sound on this population, 3c957e's Stage B is CONFIRMED by a
    stronger method, and the closure it offers is strengthened -- a fully reportable negative for
    this proposal. Determinacy below 1.0: the lane has been assigning an integer to an artifact
    for which no unique integer exists in a named fraction of mainstream builds, every
    source-syntactic rejection in EXP-MLKEM-009 is a verdict about an unnamed build, and the
    report names the exact cells. w_source stable but back-edge granularity varying: the source
    reading is sound and the VARIATION IS UNROLLING, which is a fact about compilers and not about
    defect reachability -- and stating that in advance is what stops a nonzero residue count from
    being misread as a finding.
    (D) WHAT reachable_triples IS AND WHY IT IS NO LONGER A DELIVERABLE. IDEA-20260805-3c957e's
    defect class is a SEPARATE, HAND-WRITTEN remainder path that is absent, mis-bounded or
    unreachable. A compiler-generated epilogue is not a member of that class: the vectoriser emits
    it together with the main loop and only performs the transformation under a
    semantics-preservation proof. Therefore L mod w_backedge > 0 in an auto-vectorised body is a
    statement about the unroll factor, and a nonzero triple obtained that way DOES NOT contradict
    strict_order_immunity = 5/5 read as a statement about source-level mechanism. The count is
    retained only as a diagnostic reported ALONGSIDE its value on the null object of NULL-3, never
    alone, and it is replaced as a deliverable by (i) determinacy, (ii) w_source spread,
    (iii) a per-project column recording whether the project's OWN default flag set yields
    w_source not dividing 32 AND whether a hand-written remainder path exists in the source, and
    (iv) static coverage completeness, which has calibrators at both ends.
    (E) WHAT IS NOT CLAIMED. No attack, no oracle, no exploitation path, no attack-cost
    estimate, no timing/power/EM/cache/fault measurement, no statement about MLWE hardness
    or about ML-KEM's security at any parameter set. No claim that any named library is
    defective: a stride that fails to divide 32 makes a defect class REACHABLE, it does not
    make a defect present, and the two must not be conflated. No direction is declared
    impossible. Any newly observed conformance defect escalates to the coordinator per
    RQ-MLKEM-002 and is published by no agent.

  mechanism: >-
    STAGE 0 -- FIX THE POPULATION FROM THE PRIMARY RECORD. Read
    experiments/EXP-MLKEM-009/analysis/second_implementation_selection.md directly (done this
    session; see citations) and record what it actually contains. Five rejections are listed; the
    population usable by an x86 matrix is TWO. BoringSSL CRYPTO_memcmp at pinned commit
    ed1271af005c1def37a100d5924f1c8c8ae7062c, and PQClean ml-kem-1024/avx2 verify.c at pinned
    commit 10738d92323117d84bb6202c85722ddfd96dc1d4, are pinned, distinct and x86-buildable.
    mlkem-native and aws-lc BOTH carry `commit: n/a`, so 80 of the previously declared 200 cells
    were unspecified; they are reported as UNMEASURABLE-UNTIL-PINNED and never as w = anything,
    and pinning them is a prerequisite task for whoever owns the lane, not an assumption of this
    record. Moreover the analysis file's own evidence states "aws-lc ml_kem uses mlkem-native
    ct_memcmp path", so those two entries are ONE routine and any per-candidate count over the
    five double-counts it. PQClean_aarch64_verify is an aarch64-backend routine while the declared
    -march set is entirely x86; compiling it under x86 marches would measure a routine in a
    toolchain it is never built with, so it is DROPPED from this matrix and recorded as a
    separate, not-run aarch64 matrix requiring its own cross toolchain.
    STAGE 1 -- FREEZE THE v2 EXTRACTOR BEFORE ANY CANDIDATE IS COMPILED. Disassemble the
    comparison function and identify the innermost back-edge (the loop whose latch dominates the
    accumulate). Then, and this is the repaired definition:
    (a) ENUMERATE MEMORY OPERANDS, NOT LOAD INSTRUCTIONS. Every instruction in the body
    contributes each of its memory operands, with base register, index, displacement and width --
    including operands folded into ALU instructions (`vpxor mem, ymm, ymm`, `vpternlogq $0xf6,
    mem, ymm, ymm`, `pcmpeqb mem, xmm`), which consume input bytes while issuing no load
    instruction. The previous rule missed exactly these and is withdrawn.
    (b) GROUP BY BASE POINTER. The input buffers are the read-only base registers; a two-buffer
    comparison must show exactly two. A cell showing a different number is flagged AMBIGUOUS with
    the disassembly attached.
    (c) UNROLL FACTOR u = the number of distinct operand displacements per input base register in
    one back-edge traversal (equivalently, the induction-variable increment divided by the operand
    width). Consecutive displacements must be uniformly spaced; if they are not, the cell is
    AMBIGUOUS.
    (d) w_source = the operand width, i.e. the bytes of ONE input buffer consumed per SOURCE-LEVEL
    iteration. w_backedge = u * w_source, the bytes of one input buffer consumed per traversal of
    the back-edge. BOTH ARE REPORTED. w_source is the quantity a source reading claims to know;
    w_backedge is the quantity that determines the size of a compiler-generated epilogue.
    (e) COVERAGE SET. Where the trip count is statically computable at a fixed L (a constant-folded
    length, or a length passed as a literal in the harness translation unit), compute the set of
    byte offsets of each input buffer provably read by the whole routine -- main loop over its
    computed trip count, plus every prologue/epilogue block -- and report
    coverage_deficit = L - |offsets read|. Where the trip count is not statically computable, the
    cell is UNMEASURABLE for coverage and reports w only.
    (f) phi, the reduction lane-coverage, as before: the fraction of accumulator lanes read by the
    instructions between the last accumulate and the branch on the verdict.
    The script implementing (a)-(f) is frozen and its hash committed before Stage 3.
    STAGE 2 -- CALIBRATE AT BOTH ENDS, AND PUBLISH THE CALIBRATION DISASSEMBLY. Four calibration
    objects (NULL-1, NULL-2, NULL-2b, NULL-3) plus one archived anchor (NULL-4), compiled over the
    identical 40 cells, scored and COMMITTED WITH THEIR FULL DISASSEMBLY before any candidate is
    read. The red-team screen's repro script
    (/tmp/claude-0/-home-user-crypto-autoresearcher/15de1654-2503-5954-afd1-67e6db6674e9/scratchpad/rt/repro.sh)
    is the starting point for the NULL-2 half of this stage and is cited as the reason the stage
    exists; the run must regenerate it under its own frozen harness rather than importing results.
    STAGE 3 -- THE MATRIX. Compile the two pinned routines' comparison translation units over
    2 compilers x 5 optimisation levels (-O0, -O1, -O2, -O3, -Os) x 4 -march targets = 40 cells
    each, at L in {768, 1088, 1568} where a length is needed, and record
    (w_source, u, w_backedge, phi, coverage_deficit, determinacy) per cell.
    STAGE 4 -- REPORT AGAINST THE PRIOR READING, CELL BY CELL. For each routine, state the stride
    the source reading assigns it (BoringSSL CRYPTO_memcmp: one byte per source iteration; PQClean
    avx2 verify: 32 bytes per source iteration with a hand-written scalar remainder loop), and
    report per cell whether w_source agrees. Separately report the residue L mod w_backedge NEXT
    TO the same quantity computed on NULL-3, so the reader sees the null-object value and the
    candidate value together and cannot read the latter as a defect signal.
    WHY THIS IS THE RIGHT DECOMPOSITION. The obstruction "32 | L, so L mod w = 0 for w | 32, so
    the coverage-deficit silent set is empty" is ARITHMETICALLY CORRECT and is not under attack
    here. What is under attack is the step that assigns w to a candidate. That step carries an
    implicit quantifier -- it asserts a single w per candidate where the honest statement is "for
    each toolchain configuration t, a w(candidate, t)" -- and the repaired instrument shows it
    also carries an implicit UNIQUENESS assumption, since a compiled body has several defensible
    strides. This proposal measures whether either assumption survives contact with a compiler.

  novelty_status: unverified

  novelty_screen:
    method: >-
      THE crypto-kb MCP RETRIEVAL INDEX IS UNAVAILABLE THIS SESSION -- it is configured with
      an in-memory Qdrant and answers nothing (stated in the batch brief and repeated here so
      no reader mistakes silence for a null result). Retrieval instrument was therefore the
      Grep tool (ripgrep) run against /home/user/crypto-autoresearcher, plus WebSearch and
      WebFetch, which do work in this session. Commands and their results, verbatim as run:
      (G1) pattern `-O2|-O3|optimisation level|optimization level|auto-vectoriz|autovectoriz|
      objdump|cross-compiler|toolchain`, -i, over ledger/proposals/, files_with_matches ->
      4 files: IDEA-20260816-2c1f20, IDEA-20260805-ee2018, IDEA-20260805-3c957e,
      IDEA-20260805-1beeca. (G2) grep of `question_id|^  title|^  class` on
      IDEA-20260816-2c1f20 -> question_id RQ-ARGON-141710, an Argon2 memory-cost measurement,
      unrelated. (G3) pattern `strcmp|CCTV|C2SP|MAL-BIND|Kemmy`, -i, over **/*.{yaml,md},
      count mode -> 8 occurrences across 5 files (RQ-HYBRID-cdf2b2, a GOAL-MLKEM-005 census,
      two GOAL-AES-003 review files, one GOAL-AES-003 prereg); NONE under RQ-MLKEM-002.
      (G4) pattern `detection power|hitting set|generator adequacy|adequacy probe|instrument
      adequacy`, -i, over ledger/, count mode -> 67 occurrences across 43 files, confirming
      the lane has an extensive adequacy history that this record must not restate.
      Read in full: ledger/questions/RQ-MLKEM-002.yaml; the complete lane inventory of five
      existing proposals; IDEA-20260805-3c957e and IDEA-20260805-ee2018 in full;
      IDEA-20260805-1beeca claim and object blocks; IDEA-20260724-002 head; the status,
      completion_criteria and batch_checkpoint dispositions of GOAL-MLKEM-002;
      docs/inventor-protocol.md; docs/target-result-profile.md;
      knowledge/techniques/KN-TECH-1a5b7e.md in full; agents/idea-generator.md.
      REPAIR PASS, 2026-08-21: experiments/EXP-MLKEM-009/analysis/second_implementation_selection.md
      READ FIRST-HAND AND IN FULL by the author of this record (not transitively), which is what
      established the two-routine population, the two `commit: n/a` entries and the
      aws-lc/mlkem-native duplication; and the red-team screen's findings read in full.
      Web: (W1) WebSearch "compiler optimization breaks constant-time code 'what you get is
      what you C' auto-vectorization comparison loop" -> 10 links, mostly irrelevant patents;
      one relevant, arXiv 2209.01129. (W2) WebFetch https://arxiv.org/abs/2209.01129 ->
      RETRIEVED AND READ (Binsec/Rel). (W3) WebFetch of
      https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.203.ipd.pdf FAILED -- the converter
      returned unreadable binary; recorded as an infrastructure outcome, never as evidence.
    results: >-
      Inside this repository: IDEA-20260805-3c957e names compiler-determined stride, but it
      names it in its `confounders` block ("Auto-vectorization can give a scalar source loop
      a 16- or 32-byte stride, and can constant-propagate a `len` parameter into a fixed
      bound... This confound cuts in the proposal's favour... so it is flagged rather than
      relied upon"). It is flagged and explicitly NOT measured, while that same record's
      Stage B and its strict_order_immunity prediction read stride from source. That is the
      exact gap this proposal fills, and it is a gap the prior record itself opened.
      IDEA-20260805-ee2018 mentions toolchain only to say a census must record it.
      IDEA-20260805-1beeca proposes reading pinned ASSEMBLY of one already-built artifact
      (wolfSSL), which is a single-cell instance of the matrix proposed here and does not ask
      whether the value varies. No record in the corpus compiles anything across an
      optimisation or -march sweep, and no record in the corpus distinguishes per-source-iteration
      stride from back-edge stride. Outside: Binsec/Rel (retrieved) establishes for the
      TIMING property that source- and IR-level verdicts do not survive the backend; no
      source found, and none searched for, that asks the same question of a FUNCTIONAL
      coverage property. Absence of a search result is not evidence of absence.
    verdict: >-
      UNVERIFIED. Claimed new relative to this repository: making the tuple
      (w_source, u, w_backedge, coverage set) as a function of build configuration the tracked
      object; separating per-source-iteration stride from back-edge stride at all; and using the
      extractor's DETERMINACY, not a residue count, as the deliverable that audits a quantifier
      already on file. ASSEMBLED FROM KNOWN PARTS: the residue arithmetic is
      IDEA-20260805-3c957e's; the lane-coverage definition is IDEA-20260805-ee2018's;
      disassembly-based stride reading is ordinary practice; the general "compilers do not
      preserve source-level security properties" framing is Binsec/Rel's and older; and
      memory-operand folding and loop unrolling are elementary compiler facts that this record
      failed to account for in its first version rather than discovering.

  object_first_candidate:
    tracked_object: >-
      The map t -> (w_source(f, t), u(f, t), phi(f, t), Cov(f, t, L)) for a FIXED comparison
      source f, where t ranges over toolchain configurations (compiler, version, optimisation
      level, -march), w_source is the bytes of one input buffer consumed per source-level
      iteration, u the unroll factor, phi the reduction lane-coverage, and Cov the set of input
      byte offsets provably read at length L. The object followed is not the comparison and not
      its silent set; it is the SMALL TUPLE THE OBSTRUCTION ARGUMENT CONSUMES, tracked across the
      one transformation the lane has never varied. The previous version tracked a single integer
      w and a rational phi; splitting w into (w_source, u) is the repair, because the red-team
      compiles show the unsplit quantity is not a function of (f, t) in any useful sense.
    lossiness: >-
      Massively lossy and lossy in a way that is proved rather than asserted. A compiled
      comparison routine is thousands of bits of instruction encoding; the projection keeps
      two integers, a rational and a subset of [0, L). The fibres are visibly non-singleton: a
      32-byte intrinsics body and a byte loop that gcc vectorised to 32 bytes have the same
      w_source, and IDEA-20260805-3c957e already proves a second collapse -- every w in
      {1,2,4,8,16,32} has the identical residue vector (0,0,0) at the standardized lengths.
      Nothing about instruction selection, register pressure, scheduling, constant-time discipline
      or behaviour at non-ML-KEM lengths is recoverable. What is discarded is discarded COMPATIBLY
      with the operation the target applies -- selecting a FIPS 203 parameter set, i.e. choosing L
      -- for the coverage component, because Cov is defined at a fixed L and recomputed per L, and
      for the stride component only when the trip count is statically computable. WHERE IT IS NOT,
      THE PROJECTION IS NOT COMPATIBLE AND THE CELL IS REPORTED UNMEASURABLE RATHER THAN GIVEN A
      NUMBER; measuring how often that happens is now the headline deliverable rather than an
      admitted risk.
    propagation: >-
      One step of the operation of interest is "recompile under a different t". The
      propagation law is empirical, not algebraic, and that is the point: the proposal
      measures the one-step propagation (w_source, u, Cov)(f, t) -> (w_source, u, Cov)(f, t')
      directly and reports the spread of each component separately. A projection whose one-step
      propagation under recompilation is the identity ON THE w_source COMPONENT licenses the
      source-level shortcut; one whose u component moves while w_source does not licenses it too,
      and says the movement is unrolling. The second operation, "change parameter set", has the
      closed-form law L mod w and is taken from IDEA-20260805-3c957e unchanged.
    survival_score: >-
      Survives two steps and dissolves at the third, and the boundary is stated in advance.
      Step 1, recompilation: measured here, and the measurement includes an explicit
      not-well-defined outcome. Step 2, parameter-set change: closed form for the residue,
      recomputation for coverage. Step 3, PREDICTING THE SILENT SET: dissolves, because a
      coverage deficit computed statically is a claim about what the disassembly proves is read,
      not about what a running comparison does with what it reads; and because L mod w_backedge > 0
      tells you nothing at all when the epilogue is compiler-generated. The proposal therefore
      stops at "the input to the obstruction is (or is not) well defined and stable" and says so.

  null_object_control: >-
    FIVE controls on the identical extractor code path, with forced values derived before any
    candidate is touched, spanning both ends of the dynamic range, and EACH ABLE TO FAIL. The
    previous version had two, one of whose forced values was false as measured.
    NULL-1, THE MUST-VARY OBJECT. A plain portable byte loop `for (i=0;i<len;i++) r |= a[i]
    ^ b[i];` with len a runtime parameter. FORCED: w_source MUST differ between the -O0 cell and
    at least one -O2/-O3 cell with a vector-capable -march, because -O0 emits a scalar byte
    operand per iteration by construction. Threshold numeric: max w_source / min w_source >= 2
    across the 40 cells. If the extractor reports the same w_source in every cell for this source,
    it is not reading the loop body and NO candidate measurement may be reported.
    NULL-2, THE C-LEVEL MUST-NOT-VARY OBJECT, RESTATED AT THE ONLY LEVEL WHERE IT HOLDS. The
    hand-written 32-byte AVX2 intrinsics body with an explicit `i += 32` and a full-register
    `_mm256_testz_si256`-style reduction, compiled in the identical 40 cells. FORCED: w_source = 32
    and phi = 1 in every AVX2-capable cell. NOT FORCED, AND EXPLICITLY UNCONSTRAINED: u and
    w_backedge, which the compiler may set to anything -- the red-team screen reports observing
    u = 8, w_backedge = 256 under clang 18.1.3 `-O2 -march=x86-64-v3` and u = 1, w_backedge = 32
    under gcc 13.3 at the same settings. The previous version forced w_backedge = 32 here and was
    refuted by a 30-second compile. This arm can still fail -- a w_source other than 32 in an
    AVX2-capable cell means the extractor is mis-attributing operands -- but it is now a
    calibrator for the operand-width rule only, and its variation in u is DATA, not instrument
    failure. That distinction is the mode-4 repair: the previous decision rule could not tell
    instrument failure from the phenomenon under study.
    NULL-2b, THE TRUE MUST-NOT-VARY FLOOR, AND IT CANNOT BE WRITTEN IN C. A hand-written x86-64
    assembly comparison (.S, assembled not compiled) with a literal 32-byte stride and a literal
    bound. FORCED: w_source = 32, u = 1, w_backedge = 32, phi = 1 and coverage_deficit = 0 in ALL
    40 cells, because no optimisation level or -march may rewrite an assembled body. It can fail:
    any variation whatsoever indicts the extractor rather than the compiler. THE RECORD STATES
    PLAINLY, per the red-team finding, THAT NO C-LEVEL OBJECT CAN SERVE AS A MUST-NOT-VARY
    CALIBRATOR, because every C-level stride is subject to unrolling and vectorisation; the
    previous design's central instrument assumption was therefore unsound at the language level
    and not merely at the value level.
    NULL-3, THE COMPLETENESS-BY-CONSTRUCTION NULL OBJECT, WHICH THE PREVIOUS DESIGN LACKED
    ENTIRELY. Run the COMPLETE frozen pipeline -- extractor plus residue arithmetic -- on a body
    whose completeness is guaranteed by construction: the auto-vectorised NULL-1 byte loop, whose
    epilogue the compiler emits under a semantics-preservation obligation. FORCED:
    coverage_deficit = 0 in every cell where the trip count is computable. ALSO REPORTED, AND
    PREDICTED NONZERO: L mod w_backedge for this known-complete object. The red-team screen
    reports clang 18 unrolling this loop to 64/128/256-byte back-edges, and 1568 mod 64 =
    1568 mod 128 = 1568 mod 256 = 32 while 1088 mod 128 = 1088 mod 256 = 64, so the withdrawn
    deliverable is positive on an object with no defect. Publishing that number next to the
    candidate numbers is what prevents the artifact reading. This control can fail in the
    informative direction: a nonzero coverage_deficit on a compiler-generated body means the
    EXTRACTOR is wrong, and no candidate coverage number may be reported.
    NULL-4, THE KNOWN-NONZERO ANCHOR. The wolfSSL v5.9.1 pre-fix AVX2 comparison routine, whose
    silent set EV-MLKEM-005 records as exactly {1536..1567} at ML-KEM-1024 and empty at the other
    two parameter sets. FORCED: coverage_deficit = 32 at L = 1568 and 0 at L = 768 and 1088. This
    is the only arm that exhibits the extractor detecting a real incompleteness, and without it
    "deficit 0 everywhere" is indistinguishable from an extractor that always returns 0 --
    KN-TECH-1a5b7e mode 2. CONDITIONALITY STATED IN ADVANCE: if that routine cannot be isolated as
    a compilable translation unit at the pinned tag, the anchor is reported UNAVAILABLE and the
    coverage deliverable is downgraded to "calibrated at the zero end only", which is a stated
    weakening and not a silent one.
    ORDER: NULL-1, NULL-2, NULL-2b, NULL-3, NULL-4 are scored and committed with full disassembly
    BEFORE any candidate is disassembled. Graded interior points -O1 and -Os are reported as
    interior rungs, and MONOTONICITY IS NOT ASSUMED -- IDEA-20260805-3c957e already proves
    w -> L mod w is non-monotone, and there is no reason optimisation level should be monotone in
    w either; the report states the observed ordering rather than asserting one.

  discriminated_from:
    - >-
      IDEA-20260805-3c957e derives the arithmetic obstruction 32 | L and predicts
      strict_order_immunity = 5/5 by READING STRIDE FROM SOURCE. This record does not restate
      that arithmetic, does not compute a residue table as its deliverable, and does not
      claim the obstruction is wrong. It measures whether the one input the obstruction takes
      from outside itself is well defined, and it is the only record in the lane that can return
      "the input is not well defined". If it returns "the input is stable",
      IDEA-20260805-3c957e is confirmed by a stronger method than its own Stage B. It explicitly
      does NOT claim that a nonzero L mod w_backedge contradicts 5/5.
    - >-
      IDEA-20260805-ee2018 tracks the PERIOD of a silent set as a mechanism discriminator and
      proposes lane coverage as a neighbourhood predicate, measured behaviourally through the
      ld --wrap differential instrument. This record measures phi and coverage STATICALLY, from
      disassembly, without running the comparison at all, and its question is whether the
      predicate's value is build-stable -- a question about ee2018's own census methodology,
      not a competing predicate.
    - >-
      IDEA-20260805-1beeca reads pinned wolfSSL assembly to break an observation collision
      between C-BND(1536) and C-COV(64) on ONE artifact. This record varies the toolchain over
      a matrix on two other artifacts and asks about variance and determinacy, not identity.
      Reading one binary cannot answer a question about spread; that is a sample size of one.
      The overlap that does exist is declared: NULL-4 re-reads the same wolfSSL routine 1beeca
      reads, but as a CALIBRATOR with a forced value taken from EV-MLKEM-005, not as a subject.
    - >-
      IDEA-20260724-001 and IDEA-20260724-002 concern the GENERATOR and the adequacy control
      of the differential gate. Nothing here generates a mutation, runs a comparison, or
      touches the gate. This is a static-analysis measurement and would be run even if the
      gate were retired.
    - >-
      IDEA-20260821-13b667 computes the per-probe power of a generator against a silent set. This
      record never runs a probe; it asks whether a static reading of the compiled artifact yields
      the integers that a silent-set argument consumes. The two meet only at NULL-4, where both
      use EV-MLKEM-005's archived profile as a known answer.
    - >-
      A constant-time / timing analysis (Binsec/Rel and its lineage) asks whether the binary
      leaks through execution time. RQ-MLKEM-002 forbids timing, power, EM, cache and fault
      measurement outright. Nothing here times anything; the measured quantities are counts of
      bytes in memory operands, counts of lanes read, and sets of byte offsets, all static.

