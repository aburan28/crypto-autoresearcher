idea:
  id: IDEA-20260821-121612
  question_id: RQ-MLKEM-002
  added: '2026-08-21'
  title: >-
    Defect-neighbourhood membership is a property of the COMPILED ARTIFACT, not of the
    source text: read the effective compare stride and reduction lane-coverage of the five
    candidates GOAL-MLKEM-002 rejected on source-syntactic grounds out of their disassembly
    across a 40-cell toolchain matrix, and decide whether IDEA-20260805-3c957e's predicted
    5/5 arithmetic immunity survives compilation
  class: measurement

  claim: >-
    (A) THE OBJECT. Every neighbourhood predicate this lane has used is evaluated on SOURCE
    TEXT. EXP-MLKEM-009's strict order rejected five candidate libraries with phrases about
    source style ("length-parameterized CRYPTO_memcmp", "len/32 intrinsic loop + scalar
    remainder", "runtime-length scalar loop", "length-parameterized portable compare"), and
    IDEA-20260805-3c957e's obstruction turns on a per-candidate integer w, the effective
    vector stride, which its Stage B proposes to read FROM SOURCE. But w is not a property
    of source text. It is a property of the pair (source, toolchain configuration): a
    byte-at-a-time XOR-OR loop compiles to w = 1 under gcc -O0 and to a vectorised body of
    w = 16, 32 or 64 bytes under -O2/-O3 with a -march that permits it, and a call to a
    length-parameterized comparison can be inlined and its length constant-folded at a call
    site that knows L.
    (B) THE CLAIM, FALSIFIABLE AND SHARP. For at least one of the five candidates recorded
    as rejected in experiments/EXP-MLKEM-009/analysis/second_implementation_selection.md,
    there exists a MAINSTREAM build configuration (one of gcc/clang at -O2 or -O3 with a
    -march in {x86-64, x86-64-v2, x86-64-v3, x86-64-v4}) under which the effective stride of
    the compiled comparison body does NOT divide 32, placing that candidate inside the
    arithmetically reachable region that IDEA-20260805-3c957e's third prediction
    (strict_order_immunity = 5/5) says is empty for all five.
    (C) WHAT EACH ANSWER MEANS, DECLARED BEFORE THE RUN. If the measured stride of every
    candidate divides 32 in all 40 cells, then stride is build-invariant on this population,
    the source-level reading IDEA-20260805-3c957e relies on is sound, its 5/5 prediction
    is confirmed by a stronger instrument than the one it proposed, and the closure it offers
    is STRENGTHENED, not weakened -- a fully reportable negative for this proposal. If any
    cell disagrees, then "the defect-mechanism neighbourhood" is not a well-defined function
    of the artifacts the lane has been reasoning about, every source-syntactic rejection in
    EXP-MLKEM-009 is a verdict about an unnamed build, and the successor population named in
    IDEA-20260805-3c957e (stride >= 64) is reachable from ordinary portable C rather than
    only from hand-written AVX-512.
    (D) WHAT IS NOT CLAIMED. No attack, no oracle, no exploitation path, no attack-cost
    estimate, no timing/power/EM/cache/fault measurement, no statement about MLWE hardness
    or about ML-KEM's security at any parameter set. No claim that any named library is
    defective: a stride that fails to divide 32 makes a defect class REACHABLE, it does not
    make a defect present, and the two must not be conflated. No direction is declared
    impossible. Any newly observed conformance defect escalates to the coordinator per
    RQ-MLKEM-002 and is published by no agent.

  mechanism: >-
    STAGE 1 -- FREEZE THE EXTRACTOR BEFORE ANY CANDIDATE IS COMPILED. Define "effective
    stride" mechanically, not by taste: disassemble the comparison function, identify the
    innermost back-edge (the loop whose latch dominates the accumulate), and sum the byte
    widths of the loads issued in one traversal of that back-edge. For a fully unrolled or
    branch-free body with no back-edge, the effective stride is the total bytes loaded.
    Define "reduction lane-coverage" phi as the fraction of accumulator lanes read by the
    instructions between the last accumulate and the branch on the verdict. Both are read
    from objdump output by a frozen script whose hash is committed before Stage 3.
    STAGE 2 -- CALIBRATE THE EXTRACTOR ON OBJECTS WHOSE ANSWER IS KNOWN BY CONSTRUCTION.
    Two calibration sources with pre-derived, opposite forced values (see controls).
    STAGE 3 -- THE MATRIX. Compile each of the five recorded strict-order rejections, at
    their pinned commits, over 2 compilers x 5 optimisation levels (-O0, -O1, -O2, -O3, -Os)
    x 4 -march targets = 40 cells per candidate, and record (w, phi) per cell.
    STAGE 4 -- RE-EVALUATE THE OBSTRUCTION CELL BY CELL. For each (candidate, cell) compute
    L mod w at L = 768, 1088, 1568 using IDEA-20260805-3c957e's own arithmetic, and report
    the number of (candidate, cell, parameter-set) triples with L mod w > 0. That count is
    the deliverable. IDEA-20260805-3c957e's reading implies it is 0 for every triple whose
    candidate it classified as w <= 32; any nonzero triple names the exact build under which
    a rejected candidate is in the reachable region.
    WHY THIS IS THE RIGHT DECOMPOSITION. The obstruction "32 | L, so L mod w = 0 for
    w | 32, so the coverage-deficit silent set is empty" is ARITHMETICALLY CORRECT and is
    not under attack here. What is under attack is the step that assigns w to a candidate.
    That step carries an implicit quantifier -- it asserts a single w per candidate where the
    honest statement is "for each toolchain configuration t, a w(candidate, t)". This
    proposal measures the spread of w over t. A spread of zero validates the shortcut; a
    nonzero spread means the shortcut was a choice of representative.

  novelty_status: unverified

  novelty_screen:
    method: >-
      THE crypto-kb MCP RETRIEVAL INDEX IS UNAVAILABLE THIS SESSION -- it is configured with
      an in-memory Qdrant and answers nothing (stated in the batch brief and repeated here so
      no reader mistakes silence for a null result). Retrieval instrument was therefore the
      Grep tool (ripgrep) run against /home/user/crypto-autoresearcher, plus WebSearch and
      WebFetch, which do work in this session. Commands and their results, verbatim as run:
      (G1) pattern `-O2|-O3|optimisation level|optimization level|auto-vectoriz|autovectoriz|
      objdump|cross-compiler|toolchain`, -i, over ledger/proposals/, files_with_matches ->
      4 files: IDEA-20260816-2c1f20, IDEA-20260805-ee2018, IDEA-20260805-3c957e,
      IDEA-20260805-1beeca. (G2) grep of `question_id|^  title|^  class` on
      IDEA-20260816-2c1f20 -> question_id RQ-ARGON-141710, an Argon2 memory-cost measurement,
      unrelated. (G3) pattern `strcmp|CCTV|C2SP|MAL-BIND|Kemmy`, -i, over **/*.{yaml,md},
      count mode -> 8 occurrences across 5 files (RQ-HYBRID-cdf2b2, a GOAL-MLKEM-005 census,
      two GOAL-AES-003 review files, one GOAL-AES-003 prereg); NONE under RQ-MLKEM-002.
      (G4) pattern `detection power|hitting set|generator adequacy|adequacy probe|instrument
      adequacy`, -i, over ledger/, count mode -> 67 occurrences across 43 files, confirming
      the lane has an extensive adequacy history that this record must not restate.
      Read in full: ledger/questions/RQ-MLKEM-002.yaml; the complete lane inventory of five
      existing proposals; IDEA-20260805-3c957e and IDEA-20260805-ee2018 in full;
      IDEA-20260805-1beeca claim and object blocks; IDEA-20260724-002 head; the status,
      completion_criteria and batch_checkpoint dispositions of GOAL-MLKEM-002;
      docs/inventor-protocol.md; docs/target-result-profile.md;
      knowledge/techniques/KN-TECH-1a5b7e.md in full; agents/idea-generator.md.
      Web: (W1) WebSearch "compiler optimization breaks constant-time code 'what you get is
      what you C' auto-vectorization comparison loop" -> 10 links, mostly irrelevant patents;
      one relevant, arXiv 2209.01129. (W2) WebFetch https://arxiv.org/abs/2209.01129 ->
      RETRIEVED AND READ (Binsec/Rel). (W3) WebFetch of
      https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.203.ipd.pdf FAILED -- the converter
      returned unreadable binary; recorded as an infrastructure outcome, never as evidence.
    results: >-
      Inside this repository: IDEA-20260805-3c957e names compiler-determined stride, but it
      names it in its `confounders` block ("Auto-vectorization can give a scalar source loop
      a 16- or 32-byte stride, and can constant-propagate a `len` parameter into a fixed
      bound... This confound cuts in the proposal's favour... so it is flagged rather than
      relied upon"). It is flagged and explicitly NOT measured, while that same record's
      Stage B and its strict_order_immunity prediction read stride from source. That is the
      exact gap this proposal fills, and it is a gap the prior record itself opened.
      IDEA-20260805-ee2018 mentions toolchain only to say a census must record it.
      IDEA-20260805-1beeca proposes reading pinned ASSEMBLY of one already-built artifact
      (wolfSSL), which is a single-cell instance of the matrix proposed here and does not ask
      whether the value varies. No record in the corpus compiles anything across an
      optimisation or -march sweep. Outside: Binsec/Rel (retrieved) establishes for the
      TIMING property that source- and IR-level verdicts do not survive the backend; no
      source found, and none searched for, that asks the same question of a FUNCTIONAL
      coverage property. Absence of a search result is not evidence of absence.
    verdict: >-
      UNVERIFIED. Claimed new relative to this repository: making (stride, lane-coverage) as
      a function of build configuration the tracked object, and using its spread to audit a
      quantifier in an obstruction already on file. ASSEMBLED FROM KNOWN PARTS: the residue
      arithmetic is IDEA-20260805-3c957e's; the lane-coverage definition is
      IDEA-20260805-ee2018's; disassembly-based stride reading is ordinary practice and the
      general "compilers do not preserve source-level security properties" framing is
      Binsec/Rel's and older. No external novelty is claimed.

  object_first_candidate:
    tracked_object: >-
      The map t -> (w(f, t), phi(f, t)) for a FIXED comparison source f, where t ranges over
      toolchain configurations (compiler, version, optimisation level, -march) and w is the
      effective stride and phi the reduction lane-coverage read from the disassembly. The
      object followed through the computation is not the comparison and not its silent set;
      it is the PAIR OF INTEGERS THE OBSTRUCTION ARGUMENT CONSUMES, tracked across the one
      transformation the lane has never varied.
    lossiness: >-
      Massively lossy and lossy in a way that is proved rather than asserted. A compiled
      comparison routine is thousands of bits of instruction encoding; the projection keeps
      one integer and one rational. The fibres are visibly non-singleton: a 32-byte
      intrinsics body and a byte loop that gcc vectorised to 32 bytes have the same w, and
      IDEA-20260805-3c957e already proves a second collapse -- every w in {1,2,4,8,16,32}
      has the identical residue vector (0,0,0) at the standardized lengths. Nothing about
      instruction selection, register pressure, scheduling, constant-time discipline or
      behaviour at non-ML-KEM lengths is recoverable. What is discarded is discarded
      COMPATIBLY with the operation the target applies -- selecting a FIPS 203 parameter set,
      i.e. choosing L -- because L mod w is a closed form in (L, w) alone. That is exactly
      why the retained part still propagates deterministically and why the obstruction can be
      stated for code not yet written.
    propagation: >-
      One step of the operation of interest is "recompile under a different t". The
      propagation law is empirical, not algebraic, and that is the point: the proposal
      measures the one-step propagation w(f, t) -> w(f, t') directly and reports the spread.
      The second operation, "change parameter set", has the closed-form law L mod w and is
      taken from IDEA-20260805-3c957e unchanged. A projection whose one-step propagation
      under recompilation is the identity is a build-invariant and licenses the source-level
      shortcut; a projection whose one-step propagation is not the identity does not.
    survival_score: >-
      Survives exactly two steps and dissolves at the third, and the boundary is stated in
      advance. Step 1, recompilation: measured here. Step 2, parameter-set change: closed
      form. Step 3, PREDICTING THE SILENT SET: dissolves, because L mod w > 0 tells you a
      coverage deficit is reachable and tells you NOTHING about whether the remainder path is
      correct. The proposal therefore stops at reachability and says so, rather than
      pretending the object survives to a verdict about any implementation.

  null_object_control: >-
    TWO calibration objects, both compiled in the same invocation and on the identical
    extractor code path, with forced values derived before any candidate is touched, and
    BOTH able to fail.
    NULL-1, THE MUST-VARY OBJECT. A plain portable byte loop `for (i=0;i<len;i++) r |= a[i]
    ^ b[i];` with len a runtime parameter. FORCED: its effective stride MUST differ between
    the -O0 cell and at least one -O2/-O3 cell with a vector-capable -march, because -O0
    emits a scalar byte load per iteration by construction. If the extractor reports the same
    w in every cell for this source, the extractor is not reading the loop body and NO
    candidate measurement may be reported. This is the check that the instrument can see
    variation at all -- KN-TECH-1a5b7e obligation 3, with the comparator named (the -O0 cell
    of the same source) and the threshold numeric (w must differ by at least a factor 2).
    NULL-2, THE MUST-NOT-VARY OBJECT. A hand-written 32-byte AVX2 intrinsics body with an
    explicit `i += 32` and a full-register `_mm256_testz_si256`-style reduction, compiled in
    the identical 40 cells. FORCED: w = 32 and phi = 1 in EVERY cell where the target permits
    AVX2, because the stride is written in the source as a literal. If this varies, the
    extractor is mis-attributing loads (e.g. counting a memcpy in an adjacent inlined
    function) and again nothing may be reported.
    WHY BOTH ARE NEEDED AND WHY NEITHER IS DECORATIVE. NULL-1 alone would pass for an
    extractor that reports a random number per cell; NULL-2 alone would pass for an extractor
    that always reports the literal it finds nearest in the source. Together they pin the
    dynamic range at both ends, and neither is invariant by construction, which is the mode-1
    failure KN-TECH-1a5b7e names. Graded interior points: -O1 and -Os are reported as interior
    rungs, and MONOTONICITY IS NOT ASSUMED -- IDEA-20260805-3c957e already proves w -> L mod w
    is non-monotone, and there is no reason optimisation level should be monotone in w either;
    the report states the observed ordering rather than asserting one.

  discriminated_from:
    - >-
      IDEA-20260805-3c957e derives the arithmetic obstruction 32 | L and predicts
      strict_order_immunity = 5/5 by READING STRIDE FROM SOURCE. This record does not restate
      that arithmetic, does not compute a residue table as its deliverable, and does not
      claim the obstruction is wrong. It measures the one input the obstruction takes from
      outside itself, and it is the only record in the lane that can return "the input is not
      well defined". If it returns "the input is stable", IDEA-20260805-3c957e is confirmed
      by a stronger method than its own Stage B.
    - >-
      IDEA-20260805-ee2018 tracks the PERIOD of a silent set as a mechanism discriminator and
      proposes lane coverage as a neighbourhood predicate, measured behaviourally through the
      ld --wrap differential instrument. This record measures phi STATICALLY, from
      disassembly, without running the comparison at all, and its question is whether the
      predicate's value is build-stable -- a question about ee2018's own census methodology,
      not a competing predicate.
    - >-
      IDEA-20260805-1beeca reads pinned wolfSSL assembly to break an observation collision
      between C-BND(1536) and C-COV(64) on ONE artifact. This record varies the toolchain over
      a matrix on FIVE other artifacts and asks about variance, not identity. Reading one
      binary cannot answer a question about spread; that is a sample size of one.
    - >-
      IDEA-20260724-001 and IDEA-20260724-002 concern the GENERATOR and the adequacy control
      of the differential gate. Nothing here generates a mutation, runs a comparison, or
      touches the gate. This is a static-analysis measurement and would be run even if the
      gate were retired.
    - >-
      A constant-time / timing analysis (Binsec/Rel and its lineage) asks whether the binary
      leaks through execution time. RQ-MLKEM-002 forbids timing, power, EM, cache and fault
      measurement outright. Nothing here times anything; the measured quantities are counts of
      bytes in load instructions and counts of lanes read, both static.

  citations:
    - ref: arXiv:2209.01129
      provenance: retrieved
      claim: >-
        "Binsec/Rel: Symbolic Binary Analyzer for Security with Applications to Constant-Time
        and Secret-Erasure", Daniel, Bardin, Rezk (2022). Relied on for one point only: that
        security-relevant properties of cryptographic code "are generally not preserved by
        compilers", and specifically that the authors found gcc -O0 and clang backend passes
        introducing constant-time violations in implementations previously deemed secure by
        an LLVM-level verifier. The property there is TIMING and is out of scope for
        measurement here; it is cited as prior art for the general framing that a source- or
        IR-level verdict need not survive to the binary, which is the framing this proposal
        transports to a functional coverage property.
      verified_by: idea-generator@2026-08-21
    - ref: experiments/EXP-MLKEM-009/analysis/second_implementation_selection.md
      provenance: internal
      claim: >-
        Source of the five strict-order rejections and their verbatim source-style rationales,
        reached first at second hand through IDEA-20260805-3c957e mechanism (4). THE ANALYSIS
        FILE WAS SUBSEQUENTLY OPENED AND READ IN FULL by the orchestrating coordinator session
        on 2026-08-21, which confirmed all five rejection entries and the verbatim rationales
        ("length-parameterized CRYPTO_memcmp"; "len/32 intrinsic loop + scalar remainder";
        "runtime-length scalar loop"; "length-parameterized portable verify"; "mlkem-native
        length-parameterized compare"), together with
        strict_fixed_bound_disposition: empty_preferred_public_neighborhood and
        criterion_used: widened_optimized_compare. Stage 0 re-reads it as a run input regardless.
      verified_by: coordinator@2026-08-21 (orchestrating session; source read in full this session)
    - ref: IDEA-20260805-3c957e
      provenance: internal
      claim: >-
        The identity L = 32*(du*k + dv), the 27-cell residue table, the five reachable cells,
        and the prediction strict_order_immunity = 5/5. Read in full in this session.
      verified_by: idea-generator@2026-08-21
    - ref: IDEA-20260805-ee2018
      provenance: internal
      claim: >-
        The three-part anatomy (accumulate / reduce / finalize) of an optimized constant-time
        comparison and the definition of lane-coverage phi. Read in full in this session.
      verified_by: idea-generator@2026-08-21
    - ref: null
      provenance: recalled
      claim: >-
        That gcc and clang at -O2/-O3 with a vector-capable -march auto-vectorise simple
        byte-wise XOR-OR reduction loops, and that -O0 does not. RECALLED FROM GENERAL
        PRACTICE, NOT VERIFIED IN THIS SESSION AGAINST ANY COMPILER OR DOCUMENT. It is
        load-bearing only for NULL-1's forced value, and NULL-1 is exactly the arm that
        detects it if it is wrong: a NULL-1 that does not vary halts the experiment.
      verified_by: null

  assumptions:
    - >-
      The five recorded strict-order rejections can be fetched at their pinned commits and
      compiled. A fetch or build failure is an INFRASTRUCTURE outcome under AGENTS.md rule 3
      and is never negative evidence about any implementation; the matrix is reported over
      the cells that built, with every failure listed.
    - >-
      "Effective stride" as defined in Stage 1 is extractable from objdump output for these
      routines. Software pipelining, mixed-width bodies, and multi-versioned functions
      (ifunc/target_clones) can make it ambiguous; ambiguity is REPORTED AS AMBIGUITY with the
      disassembly attached, never resolved by preference.
    - >-
      The comparison routine is identifiable in the binary. Static inlining into a caller can
      dissolve the function boundary; where it does, the record says so and that cell is
      reported as unmeasurable rather than as w = anything.
    - >-
      No conclusion transfers beyond the compilers, versions, flags, host architecture and
      pinned commits actually used. A 40-cell matrix on linux/amd64 says nothing about aarch64,
      about a compiler version not tested, or about a distribution's patched toolchain.

  predictions:
    - metric: >-
        stride_spread: the number of distinct effective-stride values w observed for a single
        fixed candidate source across its 40 toolchain cells
      direction: higher
      minimum_effect: >-
        At least 2 for at least one of the five candidates. A value of exactly 1 for all five
        is the clean negative and means stride is build-invariant on this population.
    - metric: >-
        reachable_triples: the number of (candidate, cell, parameter-set) triples with
        L mod w > 0, computed with IDEA-20260805-3c957e's own arithmetic at
        L in {768, 1088, 1568}
      direction: higher
      minimum_effect: >-
        At least 1. IDEA-20260805-3c957e's reading of the same five candidates implies 0.
        Any triple at all names a specific build under which a rejected candidate sits in the
        reachable region, and identifies it by compiler, flag set and parameter set.
    - metric: >-
        NULL-1 stride ratio: max_w / min_w over the 40 cells of the portable byte loop
      direction: higher
      minimum_effect: >-
        At least 2.0, declared before the run. Below 2.0 the extractor cannot see variation
        and the entire matrix is void -- no candidate number may be reported.
    - metric: >-
        NULL-2 stride variance: the number of distinct w values over the AVX2-capable cells of
        the hand-written 32-byte intrinsics body
      direction: lower
      minimum_effect: >-
        EXACTLY 1, with w = 32 and phi = 1. Any other value means the extractor mis-attributes
        loads and the matrix is void.
    - metric: >-
        phi_spread: the number of distinct reduction lane-coverage values observed per
        candidate across cells
      direction: different
      minimum_effect: >-
        No number is predicted, and the refusal is deliberate. phi is expected to be 1
        everywhere for correct code; a spread above 1 would be a conformance observation, not
        a methodology observation, and would trigger the RQ-MLKEM-002 escalation clause
        immediately rather than being reported here.

  minimal_test:
    design: >-
      One invocation, four stages, no crypto executed. STAGE 0 (reading, minutes): re-open
      experiments/EXP-MLKEM-009/analysis/second_implementation_selection.md directly and
      re-record the five candidates and their pinned commits, replacing the transitive
      quotation in this record with a first-hand one. STAGE 1 (minutes): freeze the stride and
      lane-coverage extractor script and commit its hash. STAGE 2 (minutes): compile NULL-1
      and NULL-2 over the 40 cells and score both forced values. IF EITHER FAILS, STOP AND
      REPORT INSTRUMENT FAILURE -- no candidate number is admissible. STAGE 3 (tens of
      minutes): compile the five candidates' comparison translation units over the same 40
      cells, extract (w, phi) per cell, compute L mod w at the three standardized lengths, and
      emit the reachable_triples count with the disassembly of every nonzero triple attached.
      TOTAL: roughly 300 compiles of small translation units plus 300 objdump passes. This is
      under an hour of single-core compute and is the cheapest valid discriminator in the lane
      because it needs no build of a full library, no key material, no ciphertext, no
      generator, and no comparison to ever execute.
    controls:
      - NULL-1, the must-vary portable byte loop, forced ratio >= 2.0, scored before candidates.
      - NULL-2, the must-not-vary 32-byte intrinsics body, forced w = 32 and phi = 1 in every AVX2-capable cell.
      - >-
        ORDERING CONTROL: NULL-1 and NULL-2 verdicts are emitted and committed BEFORE any
        candidate disassembly is read, per KN-TECH-1a5b7e's null-first rule. A matrix read
        before the nulls are scored is inadmissible.
      - >-
        NEARBY-OBJECT CONTROL WHERE THE CONCLUSION MUST FAIL: a comparison whose length is a
        compile-time constant equal to 1568 in the translation unit. Its stride may vary but
        its COVERAGE cannot be deficient, so the reachable_triples arithmetic must be reported
        for it as reachability-only and must not be read as a defect. If the pipeline reports
        this object as "in the defect neighbourhood" without the reachability qualifier, the
        reporting conflates reachability with presence and must be rewritten.
      - >-
        ARCHIVE CHECK (zero compute): enumerate every prior record that assigns a stride to any
        of the five candidates and record the value it assigned, so the matrix can be scored
        against the prior assignment cell by cell rather than in aggregate.
      - >-
        TOOLCHAIN PROVENANCE: exact compiler versions, host CPU, and the full command line of
        every cell recorded in the run manifest; a matrix without them is unreproducible and
        is not a measurement.
    required_metrics:
      - per-(candidate, cell) effective stride w and lane-coverage phi, with the disassembly excerpt each was read from
      - stride_spread per candidate
      - reachable_triples with each triple named by candidate, compiler, flags and parameter set
      - NULL-1 ratio and NULL-2 distinct-value count, emitted before the candidate table
      - the list of cells that failed to build or were unmeasurable, with the reason
      - the frozen extractor script and its hash

  falsification_conditions:
    - >-
      stride_spread = 1 for all five candidates and reachable_triples = 0. The claim in (B) is
      FALSE as stated, stride is build-invariant on this population, and the finding is
      recorded as a confirmation of IDEA-20260805-3c957e's Stage B methodology obtained by a
      stronger instrument. This is the expected-to-be-common outcome and it is a deliverable.
    - >-
      NULL-1 fails to vary. Instrument failure; the whole matrix is void and NO conclusion,
      positive or negative, may be drawn about any candidate.
    - >-
      NULL-2 varies. Extractor mis-attribution; same consequence.
    - >-
      The comparison function cannot be located in a majority of cells. The measurement is
      not executable as designed and the design is withdrawn and restated, not patched after
      seeing partial results.
    - >-
      Fetch or build failure. INFRASTRUCTURE outcome (AGENTS.md rule 3), never mathematical or
      conformance evidence.

  confounders:
    - >-
      FUNCTION MULTIVERSIONING. ifunc / target_clones emit several bodies and select at
      runtime; a static extractor sees several strides for one symbol. The report must list
      all of them rather than picking the first, and a symbol with multiple bodies is its own
      reported category.
    - >-
      LINK-TIME OPTIMISATION AND CALL-SITE SPECIALISATION. The stride in the standalone object
      file need not be the stride in the linked library, and a length-parameterized routine
      inlined at a call site that knows L can become a fixed-bound routine. The matrix as
      designed measures the translation unit; extending it to the linked artifact is a
      declared limitation, not an oversight, and it cuts AGAINST the proposal's own claim
      being conservative -- LTO can only add cells the matrix did not see.
    - >-
      REACHABILITY IS NOT PRESENCE. A stride not dividing 32 makes a coverage deficit possible;
      whether the remainder path is correct is a separate question this measurement cannot
      touch. Any restatement of a nonzero reachable_triples count as "a defect was found" is a
      serious overread and is forbidden by this record's interpretation limits.
    - >-
      SELECTION BY THE FIVE. The candidate set is the five EXP-MLKEM-009 happened to record.
      That is a convenience sample of the lane's own history, not a sample of the ecosystem,
      and every count is a floor over those five under the cells that built.
    - >-
      EXTRACTOR TASTE IN "INNERMOST BACK-EDGE". Software-pipelined or rotated loops make the
      innermost back-edge ambiguous. The definition is frozen before the run precisely so the
      ambiguity cannot be resolved in whichever direction makes the result interesting.

  interpretation_limits:
    - >-
      NOT AN ATTACK, NOT AN ORACLE, NOT AN EXPLOITATION PATH, NOT A COST ESTIMATE, NOT A
      STATEMENT ABOUT MLWE HARDNESS OR ML-KEM SECURITY AT ANY PARAMETER SET. RQ-MLKEM-002's
      constraints bind unchanged, including escalation of any newly observed defect to the
      coordinator and publication by no agent.
    - >-
      NO STATUS CHANGE is proposed for GOAL-MLKEM-002, for IDEA-20260805-3c957e, or for any
      hypothesis, evidence or decision record. This record proposes a measurement and nothing
      else; only the Coordinator moves anything.
    - >-
      The result is scoped to the exact compilers, versions, flag sets, host architecture and
      pinned commits used, and to the translation-unit level rather than the linked library.
      Claim tier laboratory/toy, not raisable by citation.
    - >-
      A negative (stride is build-invariant) closes nothing about the isolation-versus-systemic
      question. It removes one methodological doubt from one prior record. Premature closure is
      a failure mode symmetric with overclaiming.

  heuristic_assumptions:
    - id: H1
      statement: >-
        FOR ALL comparison sources f in the tested population and FOR ALL toolchain
        configurations t in the 40-cell matrix, the quantity w(f, t) extracted by the frozen
        Stage-1 rule equals the number of input bytes consumed per traversal of the routine's
        accumulate loop at run time.
      rigorous_support: >-
        Not a distributional heuristic; a decoding-fidelity assumption. It is rigorous for a
        straight-line loop with a single back-edge and unconditional loads, where the loads in
        the body are exactly the bytes consumed. It IMITATES no classical distribution theorem
        and is not presented as one. It fails, and is expected to fail, for predicated loads,
        gather instructions, software-pipelined prologues and multiversioned bodies.
      validation_plan: >-
        NULL-2 validates the upper end (a source with w written as a literal must extract to
        that literal in every cell) and NULL-1 the lower end (a source that must vary must be
        seen to vary). Additionally, for any cell where the extracted w disagrees with the
        loop trip count implied by the loop bound visible in the disassembly, the cell is
        flagged unmeasurable rather than reported. No sampling at cryptographic scale is
        needed or claimed; this assumption is about a disassembler, not about ML-KEM.
    - id: H2
      statement: >-
        The 40 configurations {gcc, clang} x {-O0,-O1,-O2,-O3,-Os} x {x86-64, x86-64-v2,
        x86-64-v3, x86-64-v4} contain at least one configuration under which each candidate
        would plausibly be built in practice.
      rigorous_support: >-
        None. This is a JUDGEMENT ABOUT DEPLOYMENT PRACTICE with no measurement behind it in
        this record, and it is stated as an assumption rather than smuggled into the claim.
        Nothing in the arithmetic depends on it; it affects only how interesting a nonzero
        reachable_triples count is.
      validation_plan: >-
        Record, for each of the five candidates, the default flag set its own build system
        emits, and mark which of the 40 cells that default corresponds to. A reachable triple
        occurring at a project's OWN default is materially different from one occurring at a
        flag combination nobody uses, and the report must distinguish the two rather than
        aggregating them.

  proof_search_map:
    bottleneck: >-
      The assignment of a single integer w to a candidate implementation. Everything else in
      IDEA-20260805-3c957e's obstruction is closed-form arithmetic on (L, w); this is the only
      step that takes input from outside the argument, and it is the only step whose removal
      changes what the obstruction covers.
    baseline_embedding:
      parameter_slice: >-
        The exact old-method boundary is "w read once from source text", i.e. the degenerate
        matrix with a single cell. This proposal reduces to IDEA-20260805-3c957e's Stage B
        exactly when the matrix is restricted to one cell per candidate, so the baseline is a
        parameter slice and not a different method.
      reproduction_check: >-
        The 27-cell residue table of IDEA-20260805-3c957e is recomputed by the same frozen
        script and must reproduce its five reachable cells -- (64,1024), (128,768), (128,1024),
        (256,768), (256,1024) -- exactly, before any candidate is measured. A mismatch means
        the arithmetic layer was reimplemented incorrectly and halts the run.
    observation_collision:
      observable: >-
        The pair (w, phi) read from disassembly, and downstream the residue vector
        (L mod w) over the three standardized lengths.
      distinct_preimage_search: >-
        Collisions are known and are proved, not hunted: IDEA-20260805-3c957e establishes that
        w = 128 and w = 256 have the identical residue vector (0, 64, 32), and that all
        w in {1,2,4,8,16,32} collapse to (0,0,0). A further collision at the (w, phi) level is
        exhibited here: a hand-written 32-byte intrinsics body and an auto-vectorised byte loop
        both extract to w = 32, phi = 1 and are indistinguishable in this observable. The
        conclusion this proposal draws -- "the input to the obstruction is or is not stable" --
        is INVARIANT under all three collisions, because it depends only on whether w varies,
        not on which w it is. That is stated explicitly so no reader mistakes the collisions
        for falsifiers of this record.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "the source text of a comparison routine" by "the multiset of (w, phi) over a
          declared toolchain matrix" as the representative of a candidate in the neighbourhood
          predicate. In the new representation, membership in the reachable region is an exact
          arithmetic condition on a measured integer rather than a judgement about prose.
        predicted_gain: >-
          Eliminates the taste judgement that produced empty_preferred_public_neighborhood and
          second_impl_unavailable. Encoding obligation: the matrix must be declared before the
          candidates are read. Soundness obligation: NULL-2. Completeness obligation: NULL-1.
          Transfer obligation: translation unit versus linked library, declared unmet.
    quantifier_order: >-
      The obstruction as written on file reads: FOR ALL candidates c, EXISTS w = w(c) such that
      FOR ALL parameter sets P, L(P) mod w = 0. The honest statement is: FOR ALL candidates c,
      FOR ALL toolchains t, EXISTS w = w(c, t) such that FOR ALL P, L(P) mod w(c,t) = 0. The
      difference is a witness (w) allowed to depend on a parameter (t) that the uniform-looking
      conclusion never mentions. This proposal measures whether that dependence is trivial.
      A finding that it is trivial UPGRADES the on-file quantifier from a slip to a theorem
      over the tested matrix; a finding that it is not localises the exact witness.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Over the 40 declared cells and the five declared candidates, the effective stride
        takes k distinct values, and j (candidate, cell, parameter-set) triples satisfy
        L mod w > 0." Nothing about untested toolchains, nothing about defect presence, nothing
        about any implementation not in the five, and nothing about aarch64.
      nearby_object_control: >-
        The nearby object on which the hoped-for conclusion FAILS is a comparison written in
        hand-written assembly (wolfSSL's own armv8-mlkem-asm.S is the concrete instance). Its
        stride is invariant under every compiler flag by construction, so the method returns
        stride_spread = 1 there and can say nothing -- correctly. A method that reported a
        toolchain effect on a hand-written assembly routine would have failed to identify the
        load-bearing structure, which is compilation, and this control is what would catch it.
    proof_obligations:
      - claim: The frozen extractor reproduces w for objects whose w is known by construction.
        responsibility: correctness
      - claim: The residue layer reproduces IDEA-20260805-3c957e's five reachable cells exactly.
        responsibility: baseline
      - claim: The extractor can distinguish at least two strides on one source.
        responsibility: strictness
      - claim: 300 compiles plus 300 disassembly passes complete inside one single-core hour.
        responsibility: runtime
      - claim: Reachability is reported as reachability and never as defect presence.
        responsibility: scope
    not_applicable_reason: null

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE COULD BE: RQ-MLKEM-002 forbids attack-cost
      estimation and this proposal proposes no algorithm against any cryptographic problem.
      The measurement cost is 5 candidates x 40 cells = 200 compiles plus 2 x 40 = 80
      calibration compiles, each a small translation unit, plus one objdump pass per object.
      Order of magnitude: minutes to tens of minutes of one core. Stating it plainly rather
      than dressing a static-analysis sweep as cryptanalysis.
    memory_exponent: >-
      n/a. Peak storage is the disassembly of 280 small objects, well under a gigabyte.
    best_known: >-
      There is no incumbent. No record in this repository measures stride or lane-coverage as
      a function of build configuration; the nearest is IDEA-20260805-3c957e's single-cell
      source reading, which this reduces to at matrix size 1.
    hidden_overhead: >-
      The honest hidden cost is not compute, it is JUDGEMENT: "effective stride" is
      well-defined for a simple loop and ambiguous for a pipelined or multiversioned body, and
      the fraction of cells landing in the ambiguous class is unknown before the run and could
      in principle be most of them. If it is, the deliverable degrades from a matrix to a
      report that the quantity is not extractable at scale -- which is itself a finding about
      every source-level stride claim in the lane, including IDEA-20260805-3c957e's.
    tradeoff_note: >-
      No time-memory tradeoff arises. The only tradeoff is coverage versus cost: the matrix
      can be widened (more compiler versions, LTO, linked artifacts, aarch64) at linear cost,
      and every widening can only add reachable triples, never remove one, so the reported
      count is monotone in matrix size and is always a FLOOR.

  dominated_by: >-
    n/a (no result claimed; no algorithm, no attack, no cost triple, hence no Pareto point
    across time, memory or data/queries). Rows checked inside this repository on 2026-08-21 for
    a prior measurement of build-dependent stride or lane-coverage: all five RQ-MLKEM-002
    proposals (IDEA-20260724-001, -002, IDEA-20260805-1beeca, -3c957e, -ee2018); GOAL-MLKEM-002
    and its batch checkpoints; RQ-MLKEM-002; and the four ledger/proposals files returned by
    grep G1. IDEA-20260805-3c957e is the only record that mentions the phenomenon and it
    mentions it as an unmeasured confounder. Externally, one row was checked and it is
    Binsec/Rel, which dominates this proposal on RIGOUR for the timing property (symbolic
    binary analysis with a soundness argument, versus a disassembly heuristic here) and does
    not address the functional coverage property at all; no external search for prior work on
    build-dependent functional comparison coverage was performed, and absence of a search
    result is not evidence of absence.
  sota_delta: >-
    No attack; methodology and search-design contribution only. Quantitatively: the lane
    currently assigns each candidate ONE stride value, read once, from source, with no error
    bar and no stated dependence; this replaces that with a 40-cell measured multiset per
    candidate and reports the spread. Against IDEA-20260805-3c957e's third prediction the
    delta is a direct test of a number already on file (5/5) by an instrument that record
    itself named as a confounder and declined to use. Against GOAL-MLKEM-002's
    second_impl_unavailable disposition the delta is that a candidate rejected as
    "length-parameterized" may be, under a named build, exactly the fixed-stride object the
    goal said it could not find -- or may provably not be, which is equally reportable.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    By part, and the parts point in opposite directions. (i) That NULL-1 varies and NULL-2 does
    not, licensing the instrument: ~0.85 -- the -O0 versus -O3 contrast on a byte loop is about
    as robust as compiler behaviour gets, but extraction from real disassembly is fiddlier than
    it sounds. (ii) That stride_spread >= 2 for at least one of the five: ~0.75, because at
    least one of the five is described as a portable scalar loop and -O0 alone forces a
    different stride from -O3 there; note this part is nearly forced and therefore carries
    little information on its own, which is why the deliverable is reachable_triples and not
    stride_spread. (iii) That reachable_triples >= 1, i.e. some cell lands at a stride NOT
    dividing 32 -- the part that actually contradicts a number on file: ~0.35. Auto-vectorised
    byte loops most often land at 16 or 32 bytes, both of which divide 32 and produce nothing;
    reaching 64 needs 2x unrolling or a zmm body, which -O3 with x86-64-v3/v4 sometimes does and
    often does not. I would bet against this part, and that is exactly why it is worth one hour.
    (iv) That the extractor is defeated by multiversioning or pipelining on a majority of cells:
    ~0.2, and if it happens it is the more interesting outcome.

