  assumptions:
    - >-
      The TWO routines named in Stage 0 can be fetched at their pinned commits and compiled as
      standalone translation units. A fetch or build failure is an INFRASTRUCTURE outcome under
      AGENTS.md rule 3 and is never negative evidence about any implementation; the matrix is
      reported over the cells that built, with every failure listed.
    - >-
      mlkem-native and aws-lc are NOT assumed measurable. Their entries in
      second_implementation_selection.md carry `commit: n/a`, so they are reported as
      unmeasurable-until-pinned; and the same file's evidence says the aws-lc ML-KEM path uses
      mlkem-native's ct_memcmp, so if both are later pinned they are counted ONCE unless a
      first-hand source reading shows two distinct routines.
    - >-
      PQClean's aarch64 verify.c is NOT in this matrix. Measuring an aarch64-backend routine under
      x86 -march flags would produce numbers about a toolchain it is never built with; an aarch64
      matrix with its own cross toolchain is declared as separate future work and is not run here.
    - >-
      "Per-source-iteration stride" as defined in Stage 1(d) is extractable from objdump output
      for these routines in SOME cells. Software pipelining, mixed-width bodies, gather/scatter,
      predicated (AVX-512 masked) operands and multi-versioned functions (ifunc/target_clones)
      can make it ambiguous; ambiguity is REPORTED AS AMBIGUITY with the disassembly attached,
      never resolved by preference, and the ambiguous fraction is a headline number rather than
      an embarrassment.
    - >-
      The comparison routine is identifiable in the binary. Static inlining into a caller can
      dissolve the function boundary; where it does, the record says so and that cell is
      reported as unmeasurable rather than as w = anything.
    - >-
      No conclusion transfers beyond the compilers, versions, flags, host architecture and
      pinned commits actually used. A 40-cell matrix on linux/amd64 says nothing about aarch64,
      about a compiler version not tested, or about a distribution's patched toolchain.

  predictions:
    - metric: >-
        determinacy: the fraction of the 2 routines x 40 cells in which the frozen v2 extractor
        returns a single well-defined (w_source, u, phi) triple rather than AMBIGUOUS or
        UNMEASURABLE
      direction: lower
      minimum_effect: >-
        Below 1.0, i.e. at least one ambiguous or unmeasurable cell across the 80. Exactly 1.0 is
        the clean negative and means the quantity the lane's obstruction consumes is well defined
        on every mainstream build of this population -- a direct strengthening of
        IDEA-20260805-3c957e's Stage B. This is the headline deliverable and its value is not
        known in advance in either direction.
    - metric: >-
        w_source_spread: the number of distinct w_source values observed for a single fixed
        routine across its 40 cells, and whether w_source equals the value the source reading
        assigns that routine
      direction: higher
      minimum_effect: >-
        At least 2 for at least one routine, or at least one cell where w_source disagrees with
        the source reading. A spread of exactly 1 matching the source reading for both routines is
        the clean negative. NOTE THE HONEST DISCOUNT: for the BoringSSL byte loop this is close to
        forced (-O0 gives 1, a vectorising cell gives 16 or 32), so this metric carries little
        information on its own and is reported as a supporting observable, not as a finding.
    - metric: >-
        coverage_deficit: L - |input byte offsets provably read|, per (routine, cell, parameter
        set), reported only in cells where the trip count is statically computable
      direction: different
      minimum_effect: >-
        No direction is predicted for the candidates and the refusal is deliberate: both are
        known-correct routines and a nonzero deficit would be a CONFORMANCE observation triggering
        the RQ-MLKEM-002 escalation clause immediately rather than being reported here. The
        prediction that carries the information is on the controls: EXACTLY 0 on NULL-3
        (compiler-generated, complete by construction) and EXACTLY 32 / 0 / 0 on NULL-4 at
        L = 1568 / 1088 / 768. Those two together are what license reading a candidate zero as a
        measurement rather than as an instrument artifact.
    - metric: >-
        NULL-1 w_source ratio: max w_source / min w_source over the 40 cells of the portable byte
        loop
      direction: higher
      minimum_effect: >-
        At least 2.0, declared before the run. Below 2.0 the extractor cannot see variation
        and the entire matrix is void -- no candidate number may be reported.
    - metric: >-
        NULL-2 w_source distinct-value count over AVX2-capable cells, and NULL-2b full-tuple
        distinct-value count over all 40 cells
      direction: lower
      minimum_effect: >-
        EXACTLY 1 for NULL-2's w_source (with w_source = 32, phi = 1); EXACTLY 1 for NULL-2b's
        entire tuple (w_source = 32, u = 1, w_backedge = 32, phi = 1, coverage_deficit = 0). Any
        other value means the extractor mis-attributes memory operands and the matrix is void.
        NULL-2's u and w_backedge are REPORTED AND UNCONSTRAINED, and are expected to take at
        least two values across the matrix; that variation is data about unrolling, NOT instrument
        failure, and the previous version's contrary forced value is withdrawn as refuted.
    - metric: >-
        null_object_residue: L mod w_backedge computed by the complete frozen pipeline on NULL-3,
        the known-complete compiler-generated body
      direction: higher
      minimum_effect: >-
        Reported, not thresholded, and expected NONZERO in at least one cell. A nonzero value here
        is the demonstration that the withdrawn reachable_triples deliverable is positive on an
        object with no defect, and it must be printed adjacent to every candidate residue in the
        report. If it comes out zero in every cell, the withdrawal was over-cautious and the
        record says so.
    - metric: >-
        default_flag_column: per project, whether its OWN default build flags yield w_source not
        dividing 32, and whether a hand-written remainder path exists in its source
      direction: different
      minimum_effect: >-
        No number is predicted; this is a two-bit census over two projects, read from the build
        system and from the source. It is included because it is the only column in this record
        that speaks to IDEA-20260805-3c957e's ACTUAL defect class (a separate hand-written
        remainder path that is absent, mis-bounded or unreachable), which a compiler-generated
        epilogue is not a member of.

  minimal_test:
    design: >-
      One invocation, five stages, no crypto executed. STAGE 0 (done, minutes): read
      experiments/EXP-MLKEM-009/analysis/second_implementation_selection.md first-hand and fix the
      population at two pinned x86-buildable routines, recording the unpinned and out-of-architecture
      entries as such. STAGE 1 (minutes): freeze the v2 extractor script -- memory operands not
      load instructions, grouped by base pointer, unroll-normalized -- and commit its hash. STAGE 2
      (minutes): compile NULL-1, NULL-2, NULL-2b, NULL-3 and NULL-4 over the 40 cells, score every
      forced value, and PUBLISH THE FULL DISASSEMBLY OF THE CALIBRATORS, NULL-2 INCLUDED, before
      any candidate is touched. IF ANY FORCED VALUE FAILS, STOP AND REPORT INSTRUMENT FAILURE --
      no candidate number is admissible. STAGE 3 (tens of minutes): compile the two candidates'
      comparison translation units over the same 40 cells and extract the tuple per cell. STAGE 4
      (minutes): report determinacy, w_source spread against the source reading, coverage deficits
      next to their control values, and the residue next to NULL-3's residue.
      TOTAL: 2 candidates x 40 + 5 calibration objects x 40 = 280 compiles of small translation
      units plus 280 objdump passes. Under an hour of single-core compute. It remains the cheapest
      valid discriminator in the lane because it needs no build of a full library, no key
      material, no ciphertext, no generator, and no comparison to ever execute.
    controls:
      - NULL-1, the must-vary portable byte loop, forced w_source ratio >= 2.0, scored before candidates.
      - NULL-2, the C intrinsics body, forced w_source = 32 and phi = 1 in AVX2-capable cells, with u and w_backedge reported and unconstrained.
      - NULL-2b, the hand-written .S floor, entire tuple forced constant across all 40 cells; the only true must-not-vary object available.
      - NULL-3, the completeness-by-construction null object, forced coverage_deficit = 0, residue reported and expected nonzero.
      - NULL-4, the archived known-incomplete anchor, forced coverage_deficit 32 / 0 / 0 at L = 1568 / 1088 / 768, or reported UNAVAILABLE.
      - >-
        ORDERING CONTROL: all five calibrator verdicts, with disassembly, are emitted and
        committed BEFORE any candidate disassembly is read, per KN-TECH-1a5b7e's null-first rule.
        A matrix read before the nulls are scored is inadmissible.
      - >-
        NEARBY-OBJECT CONTROL WHERE THE METHOD MUST FAIL: a comparison whose length is a runtime
        parameter that is NOT constant-folded in the translation unit, so the trip count is not
        statically computable. The method must report coverage UNMEASURABLE there, not deficit 0.
        A pipeline that reports 0 for it is reporting the absence of evidence as evidence of
        completeness, which is the failure this control exists to catch.
      - >-
        ARCHIVE CHECK (zero compute): enumerate every prior record that assigns a stride to either
        of the two routines and record the value it assigned, so the matrix can be scored against
        the prior assignment cell by cell rather than in aggregate.
      - >-
        TOOLCHAIN PROVENANCE: exact compiler versions, host CPU, and the full command line of
        every cell recorded in the run manifest; a matrix without them is unreproducible and
        is not a measurement.
    required_metrics:
      - per-(routine, cell) w_source, u, w_backedge, phi, coverage_deficit and a determinacy label, with the disassembly excerpt each was read from
      - determinacy over the 80 candidate cells, and the list of ambiguous cells with the reason
      - w_source spread per routine, against the stride its source reading assigns
      - the five calibrator scorecards with FULL disassembly, emitted before the candidate table
      - NULL-3's coverage_deficit and its L mod w_backedge, printed adjacent to every candidate residue
      - the per-project default-flag column and the presence or absence of a hand-written remainder path, quoted from source
      - the list of cells that failed to build or were unmeasurable, with the reason
      - the frozen extractor script and its hash

  falsification_conditions:
    - >-
      determinacy = 1.0 and w_source matches the source reading in all 80 cells. The claim in (B)
      is FALSE as stated, the source-level reading is well defined and stable on this population,
      and the finding is recorded as a confirmation of IDEA-20260805-3c957e's Stage B methodology
      obtained by a stronger instrument. This is a fully reportable deliverable.
    - >-
      NULL-1 fails to vary. Instrument failure; the whole matrix is void and NO conclusion,
      positive or negative, may be drawn about any routine.
    - >-
      NULL-2's w_source varies over AVX2-capable cells, or NULL-2b's tuple varies at all.
      Extractor mis-attribution of memory operands; same consequence. NOTE what is NOT a
      falsifier any more: variation in NULL-2's u or w_backedge, which the previous version
      treated as instrument failure and which is in fact the phenomenon under study.
    - >-
      NULL-3 shows a nonzero coverage_deficit on a compiler-generated body. The coverage
      extractor is wrong; no coverage number is reportable, and the record is repaired before
      anything else is read.
    - >-
      NULL-4 is unavailable or shows a deficit other than 32 / 0 / 0. Either the anchor cannot be
      built -- in which case the coverage deliverable is downgraded and labelled
      calibrated-at-one-end -- or the extractor cannot see a known incompleteness, in which case
      no coverage zero means anything.
    - >-
      The comparison function cannot be located in a majority of cells. The measurement is
      not executable as designed and the design is withdrawn and restated, not patched after
      seeing partial results.
    - >-
      Fetch or build failure. INFRASTRUCTURE outcome (AGENTS.md rule 3), never mathematical or
      conformance evidence.

  confounders:
    - >-
      MEMORY-OPERAND FOLDING. On x86 an ALU instruction may take a memory operand, so bytes are
      consumed without a load instruction being issued; `vpxor mem, ymm, ymm` and
      `vpternlogq $imm, mem, ymm, ymm` both do this, and the second additionally fuses the XOR and
      OR of the accumulate into one instruction. A rule that sums load widths undercounts by the
      number of folded operands. THIS IS NOT A HYPOTHETICAL: it is the defect that falsified this
      record's H1 in its own calibration object. The v2 rule counts operands; any future variant
      of the rule must be re-scored against both calibrators before use.
    - >-
      LOOP UNROLLING. The compiler may replicate the body u times, multiplying the back-edge byte
      count by u while leaving the source-level granularity unchanged. Reporting the back-edge
      count as "the stride" conflates the two. The v2 rule separates them and reports both.
    - >-
      COMPILER-GENERATED EPILOGUES. A vectoriser emits remainder handling together with the main
      loop under a semantics-preservation obligation, so an auto-vectorised body has a nonzero
      L mod w_backedge and complete coverage simultaneously. Any reading of that residue as
      reachability of IDEA-20260805-3c957e's defect class is a category error; NULL-3 exists to
      make the error visible in the artifact.
    - >-
      FUNCTION MULTIVERSIONING. ifunc / target_clones emit several bodies and select at
      runtime; a static extractor sees several tuples for one symbol. The report must list
      all of them rather than picking the first, and a symbol with multiple bodies is its own
      reported category and counts as non-determinate.
    - >-
      LINK-TIME OPTIMISATION AND CALL-SITE SPECIALISATION. The stride in the standalone object
      file need not be the stride in the linked library, and a length-parameterized routine
      inlined at a call site that knows L can become a fixed-bound routine. The matrix as
      designed measures the translation unit; extending it to the linked artifact is a
      declared limitation, not an oversight.
    - >-
      REACHABILITY IS NOT PRESENCE. A stride not dividing 32 makes a coverage deficit possible;
      whether the remainder path is correct is a separate question. Any restatement of a residue
      count as "a defect was found" is a serious overread and is forbidden by this record's
      interpretation limits.
    - >-
      SELECTION BY WHAT WAS PINNED. The population is the subset of EXP-MLKEM-009's five entries
      that carries a commit and builds on x86: two routines. That is a convenience sample of the
      lane's own history, narrowed further by the record-keeping of a prior experiment, and every
      count is a floor over those two under the cells that built.
    - >-
      EXTRACTOR TASTE IN "INNERMOST BACK-EDGE". Software-pipelined or rotated loops make the
      innermost back-edge ambiguous. The definition is frozen before the run precisely so the
      ambiguity cannot be resolved in whichever direction makes the result interesting, and an
      ambiguous cell is counted against determinacy rather than resolved.

  interpretation_limits:
    - >-
      NOT AN ATTACK, NOT AN ORACLE, NOT AN EXPLOITATION PATH, NOT A COST ESTIMATE, NOT A
      STATEMENT ABOUT MLWE HARDNESS OR ML-KEM SECURITY AT ANY PARAMETER SET. RQ-MLKEM-002's
      constraints bind unchanged, including escalation of any newly observed defect to the
      coordinator and publication by no agent.
    - >-
      NO STATUS CHANGE is proposed for GOAL-MLKEM-002, for IDEA-20260805-3c957e, or for any
      hypothesis, evidence or decision record. This record proposes a measurement and nothing
      else; only the Coordinator moves anything.
    - >-
      A NONZERO L mod w_backedge IS NOT A CONTRADICTION OF strict_order_immunity = 5/5. That
      prediction is about source-level mechanism -- a separate hand-written remainder path that is
      absent, mis-bounded or unreachable -- and a compiler-generated epilogue is not a member of
      that class. This limit is stated in the claim as well because the previous version's
      headline deliverable invited exactly this misreading.
    - >-
      THIS RECORD IS A REPAIRED REVISION AND ITS PREDECESSOR TEXT IS WRONG WHERE IT DIFFERS: the
      load-counting Stage-1 rule, NULL-2's w = 32 forced value across all AVX2 cells,
      reachable_triples as a deliverable, the five-candidate population and the cost model of
      200 candidate compiles are all withdrawn. No experiment was run under the previous text.
    - >-
      The result is scoped to the exact compilers, versions, flag sets, host architecture and
      pinned commits used, and to the translation-unit level rather than the linked library.
      Claim tier laboratory/toy, not raisable by citation.
    - >-
      A negative (the extractor is determinate and stride is build-invariant) closes nothing about
      the isolation-versus-systemic question. It removes one methodological doubt from one prior
      record. Premature closure is a failure mode symmetric with overclaiming.

  heuristic_assumptions:
    - id: H1
      statement: >-
        DECODE FIDELITY, v2. FOR ALL comparison sources f in the tested population and FOR ALL
        toolchain configurations t in the 40-cell matrix, the quantity w_source(f, t) extracted by
        the frozen Stage-1 v2 rule -- the width of one memory OPERAND attributable to one input
        base pointer, after dividing the back-edge operand count by the detected unroll factor --
        equals the number of input bytes consumed per SOURCE-LEVEL iteration of the routine's
        accumulate loop at run time; and w_backedge = u * w_source equals the bytes consumed per
        back-edge traversal.
      rigorous_support: >-
        Not a distributional heuristic; a decoding-fidelity assumption. It is rigorous for a loop
        with a single back-edge, uniformly spaced operand displacements per base pointer, and no
        predication, where every byte consumed appears as a memory operand of some instruction in
        the body. THE PREVIOUS VERSION OF H1 COUNTED LOAD INSTRUCTIONS AND WAS FALSIFIED IN ITS
        OWN CALIBRATION OBJECT: the red-team screen reports gcc 13.3 `-O3 -march=x86-64-v4`
        emitting a single-back-edge loop with one 32-byte vmovdqu and one 32-byte operand folded
        into a vpternlogq, i.e. 32 bytes of load instructions against 64 bytes consumed, in
        exactly the "straight-line loop with a single back-edge and unconditional loads" case the
        old text claimed rigour for. It imitates no classical distribution theorem and is not
        presented as one. It fails, and is expected to fail, for predicated/masked loads, gather
        instructions, software-pipelined prologues, non-uniform operand spacing, and
        multiversioned bodies; every one of those makes the cell AMBIGUOUS rather than wrong.
      validation_plan: >-
        Score the amended rule against BOTH calibration objects before freezing, in both
        compilers and at every optimisation level, and publish the disassembly: NULL-2b (hand
        assembly) validates the floor, NULL-2 (C intrinsics) validates the operand-width rule
        while deliberately NOT constraining u, and NULL-1 validates that variation is visible at
        all. Additionally, for any cell where u * w_source disagrees with the induction-variable
        increment visible in the disassembly, the cell is flagged AMBIGUOUS rather than reported.
        No sampling at cryptographic scale is needed or claimed; this assumption is about a
        disassembler, not about ML-KEM.
    - id: H2
      statement: >-
        The 40 configurations {gcc, clang} x {-O0,-O1,-O2,-O3,-Os} x {x86-64, x86-64-v2,
        x86-64-v3, x86-64-v4} contain at least one configuration under which each routine
        would plausibly be built in practice.
      rigorous_support: >-
        None. This is a JUDGEMENT ABOUT DEPLOYMENT PRACTICE with no measurement behind it in
        this record, and it is stated as an assumption rather than smuggled into the claim.
        Nothing in the arithmetic depends on it; it affects only how interesting any per-cell
        finding is.
      validation_plan: >-
        Record, for each of the two routines, the default flag set its own build system emits,
        and mark which of the 40 cells that default corresponds to. That mapping is the
        default_flag_column deliverable, and a finding at a project's OWN default is materially
        different from one at a flag combination nobody uses; the report must distinguish the two
        rather than aggregating them.
    - id: H3
      statement: >-
        COVERAGE COMPUTABILITY. FOR a cell in which the trip count of the accumulate loop is a
        compile-time constant at a fixed L, the set of input byte offsets read by the compiled
        routine is exactly reconstructible from the disassembly by unrolling the main loop
        symbolically and adding the prologue and epilogue blocks.
      rigorous_support: >-
        Rigorous for a body whose addressing is affine in the induction variable with a computable
        bound, which is the common case for a vectorised comparison. NOT rigorous, and reported as
        UNMEASURABLE rather than assumed, when the bound is a runtime value, when addressing is
        indirect or gathered, or when the routine is multiversioned. The nearby-object control (a
        genuinely runtime-length routine) exists to confirm that the pipeline says UNMEASURABLE
        there rather than 0.
      validation_plan: >-
        Two-ended: NULL-3 (compiler-generated, complete by construction) must yield deficit 0 and
        NULL-4 (archived wolfSSL pre-fix AVX2) must yield deficit 32 at L = 1568 and 0 at the
        other two lengths, matching EV-MLKEM-005. The fraction of candidate cells where coverage
        is computable at all is reported as its own number and is not assumed to be large.

  proof_search_map:
    bottleneck: >-
      The assignment of a single integer w to a candidate implementation. Everything else in
      IDEA-20260805-3c957e's obstruction is closed-form arithmetic on (L, w); this is the only
      step that takes input from outside the argument. The repaired reading of the bottleneck is
      sharper than the previous one: the step assumes not only that w is stable across toolchains
      but that a compiled body HAS a unique w, and the second assumption is the weaker of the two.
    baseline_embedding:
      parameter_slice: >-
        The exact old-method boundary is "w read once from source text", i.e. the degenerate
        matrix with a single cell and u fixed at 1. This proposal reduces to IDEA-20260805-3c957e's
        Stage B exactly when the matrix is restricted to one cell per routine and w_source is
        reported without u, so the baseline is a parameter slice and not a different method.
      reproduction_check: >-
        The 27-cell residue table of IDEA-20260805-3c957e is recomputed by the same frozen
        script and must reproduce its five reachable cells -- (64,1024), (128,768), (128,1024),
        (256,768), (256,1024) -- exactly, before any candidate is measured. A mismatch means
        the arithmetic layer was reimplemented incorrectly and halts the run.
    observation_collision:
      observable: >-
        The tuple (w_source, u, phi, coverage set) read from disassembly, and downstream the
        residue vector (L mod w_backedge) over the three standardized lengths.
      distinct_preimage_search: >-
        Collisions are known and are proved, not hunted: IDEA-20260805-3c957e establishes that
        w = 128 and w = 256 have the identical residue vector (0, 64, 32), and that all
        w in {1,2,4,8,16,32} collapse to (0,0,0). A further collision at the tuple level is
        exhibited here: a hand-written 32-byte intrinsics body and an auto-vectorised byte loop
        both extract to w_source = 32, phi = 1 and are indistinguishable in this observable. THE
        COLLISION THE PREVIOUS VERSION MISSED IS THE LOAD-BEARING ONE: a compiler-generated
        epilogue and an absent hand-written remainder path produce the SAME nonzero residue while
        having opposite meanings, and no residue-based observable can separate them. That is why
        the residue is demoted to a diagnostic printed next to its null-object value, and why the
        source-level presence of a hand-written remainder path is now a reported column of its
        own. The conclusion this proposal draws -- "the input to the obstruction is or is not well
        defined and stable" -- is INVARIANT under the first three collisions, because it depends
        only on whether w_source varies and whether the extractor is determinate.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "the source text of a comparison routine" by "the multiset of
          (w_source, u, phi, coverage) over a declared toolchain matrix, with a determinacy label"
          as the representative of a candidate in the neighbourhood predicate. In the new
          representation, membership in the reachable region is an exact arithmetic condition on a
          measured integer where one exists, and an explicit NOT-DEFINED where one does not.
        predicted_gain: >-
          Eliminates the taste judgement that produced empty_preferred_public_neighborhood and
          second_impl_unavailable, and makes "no integer exists here" a first-class answer instead
          of an unstated choice. Encoding obligation: the matrix must be declared before the
          candidates are read. Soundness obligation: NULL-2b. Completeness obligation: NULL-1.
          Non-triviality obligation: NULL-4. Artifact obligation: NULL-3. Transfer obligation:
          translation unit versus linked library, declared unmet.
    quantifier_order: >-
      The obstruction as written on file reads: FOR ALL candidates c, EXISTS w = w(c) such that
      FOR ALL parameter sets P, L(P) mod w = 0. The honest statement is: FOR ALL candidates c,
      FOR ALL toolchains t, EXISTS w = w(c, t) such that FOR ALL P, L(P) mod w(c,t) = 0 -- and
      even that overstates, because the inner EXISTS is not unique: a compiled body admits at
      least w_source and w_backedge = u * w_source, which differ whenever the compiler unrolls.
      This proposal measures whether the dependence on t is trivial AND whether the witness is
      unique. A finding that both hold UPGRADES the on-file quantifier from a slip to a theorem
      over the tested matrix; a finding that either fails localises the exact witness.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Over the 40 declared cells and the two declared routines, the frozen v2 extractor was
        determinate in m of 80 cells, w_source took k distinct values per routine, and the
        statically provable input coverage was complete in every cell where it was computable."
        Nothing about untested toolchains, nothing about defect presence, nothing about any
        implementation not in the two, nothing about the linked library, and nothing about aarch64.
      nearby_object_control: >-
        The nearby object on which the hoped-for conclusion FAILS is a comparison whose length is
        a runtime parameter that the compiler cannot constant-fold in the translation unit: its
        trip count is not statically computable, so the method genuinely cannot compute a coverage
        set and must report UNMEASURABLE -- not deficit 0. A method that returns 0 there is
        reporting its own blindness as a completeness certificate. (The previous nearby object,
        hand-written assembly, is retained but PROMOTED to a calibrator, NULL-2b, because the
        method handles it correctly rather than failing on it, which made it a weak ceiling test.)
    proof_obligations:
      - claim: The v2 extractor reproduces w_source and coverage for objects whose values are known by construction.
        responsibility: correctness
      - claim: The residue layer reproduces IDEA-20260805-3c957e's five reachable cells exactly.
        responsibility: baseline
      - claim: The extractor can distinguish at least two w_source values on one source.
        responsibility: strictness
      - claim: The extractor reports a nonzero coverage deficit on the archived known-incomplete routine.
        responsibility: strictness
      - claim: The extractor reports zero coverage deficit on a compiler-generated complete body.
        responsibility: correctness
      - claim: 280 compiles plus 280 disassembly passes complete inside one single-core hour.
        responsibility: runtime
      - claim: Reachability is reported as reachability, never as defect presence, and a compiler epilogue is never reported as a defect class member.
        responsibility: scope
    not_applicable_reason: null

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE COULD BE: RQ-MLKEM-002 forbids attack-cost
      estimation and this proposal proposes no algorithm against any cryptographic problem.
      The measurement cost is 2 routines x 40 cells = 80 compiles plus 5 x 40 = 200
      calibration compiles, each a small translation unit, plus one objdump pass per object.
      Order of magnitude: minutes to tens of minutes of one core. The previous version's
      "5 candidates x 40 cells = 200 compiles" is withdrawn: 80 of those 200 cells were
      unspecified because two entries carry no pinned commit, 40 more were an aarch64 routine
      under x86 flags, and 40 of the remainder double-counted one routine.
    memory_exponent: >-
      n/a. Peak storage is the disassembly of 280 small objects, well under a gigabyte.
    best_known: >-
      There is no incumbent. No record in this repository measures stride, unroll factor,
      lane-coverage or static input coverage as a function of build configuration; the nearest is
      IDEA-20260805-3c957e's single-cell source reading, which this reduces to at matrix size 1
      with u fixed at 1.
    hidden_overhead: >-
      The honest hidden cost is not compute, it is JUDGEMENT, and this record now measures the
      overhead instead of merely admitting it: "effective stride" is well-defined for a simple
      loop and ambiguous for a pipelined, masked, gathered or multiversioned body, and the
      fraction of cells landing in the ambiguous class is unknown before the run and could in
      principle be most of them. If it is, the deliverable is not degraded -- that fraction IS the
      deliverable, and a large one is a finding about every source-level stride claim in the lane,
      including IDEA-20260805-3c957e's and including this record's own previous version.
    tradeoff_note: >-
      No time-memory tradeoff arises. The only tradeoff is coverage versus cost: the matrix
      can be widened (more compiler versions, LTO, linked artifacts, aarch64 with its own
      toolchain) at linear cost. NOTE A CORRECTION TO THE PREVIOUS VERSION'S MONOTONICITY CLAIM:
      it asserted that every widening can only ADD reachable triples so the count is a floor.
      That is true of the residue count and is now irrelevant, since the residue count is no
      longer a deliverable. Determinacy is NOT monotone in matrix size -- adding cells can lower
      it -- and it is reported as a fraction over the declared matrix, never as a bound.

  dominated_by: >-
    n/a (no result claimed; no algorithm, no attack, no cost triple across time, memory or
    data/queries, hence no Pareto point). Rows checked inside this repository on 2026-08-21 for
    a prior measurement of build-dependent stride, unroll factor or static coverage: all five
    RQ-MLKEM-002 proposals (IDEA-20260724-001, -002, IDEA-20260805-1beeca, -3c957e, -ee2018);
    GOAL-MLKEM-002 and its batch checkpoints; RQ-MLKEM-002; EV-MLKEM-005; and the four
    ledger/proposals files returned by grep G1. IDEA-20260805-3c957e is the only record that
    mentions the phenomenon and it mentions it as an unmeasured confounder; IDEA-20260805-1beeca
    reads one already-built artifact and is DOMINATED on spread (n = 1) while DOMINATING on depth
    for that single artifact. Externally, one row was checked and it is Binsec/Rel, which
    dominates this proposal on RIGOUR for the timing property (symbolic binary analysis with a
    soundness argument, versus a disassembly heuristic here) and does not address the functional
    coverage property at all; no external search for prior work on build-dependent functional
    comparison coverage was performed, and absence of a search result is not evidence of absence.
  sota_delta: >-
    No attack; methodology and search-design contribution only. Quantitatively: the lane
    currently assigns each candidate ONE stride value, read once, from source, with no error
    bar, no stated dependence on the toolchain, and no distinction between per-iteration and
    per-back-edge granularity; this replaces that with a per-cell tuple over 40 cells for each of
    the two routines that are actually pinned and x86-buildable, plus an explicit determinacy
    fraction. Against IDEA-20260805-3c957e's third prediction the delta is NOT a contradiction and
    is no longer claimed as one: the delta is a test of whether that prediction's input is well
    defined, by an instrument that record itself named as a confounder and declined to use.
    Against GOAL-MLKEM-002's second_impl_unavailable disposition the delta is a measured account
    of what "length-parameterized" means in a compiled artifact. HONEST DISCOUNT: two of the three
    supporting observables (w_source spread, residue) are near-forced and are reported as such;
    the informative quantities are determinacy, the coverage deficits against their two-ended
    calibrators, and the default-flag column.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    By part, and the parts point in opposite directions. (i) That the v2 extractor passes NULL-1,
    NULL-2's w_source, NULL-2b and NULL-3 together: ~0.6. The previous version put 0.85 on the
    weaker pair (NULL-1 varies, NULL-2 does not) and a 30-second compile refuted the NULL-2 half,
    so that estimate was not merely wrong but wrong about the easiest-to-check part of the design;
    the number here is lower on purpose and the coverage extractor is the piece I trust least.
    (ii) That NULL-4 is buildable as an isolated translation unit and reproduces 32 / 0 / 0:
    ~0.5, and it is the single most valuable arm, because without it a zero deficit means nothing.
    (iii) That determinacy comes out below 1.0, i.e. at least one ambiguous cell among 80: ~0.6 --
    -O0 and -Os bodies are simple, but AVX-512 masked epilogues at -march=x86-64-v4 are exactly
    the predicated-operand case the rule excludes. (iv) That w_source spread >= 2 for the
    BoringSSL byte loop: ~0.9, near-forced, and therefore weighted as calibration rather than as
    a finding. (v) That the report is delivered with the residue printed next to its null-object
    value so that no reader can take a compiler epilogue for a defect: ~0.95, since that
    juxtaposition is now the reason the metric survives at all.

