    verified_by: knowledge/literature/KN-LIT-105.md
  - ref: 'Concrete form d = n*ln(4/3)/ln(n/(2*pi*e)) for the dimensions-for-free count'
    provenance: recalled
    claim: >-
      The closed form commonly attributed to the same paper and used by cost estimators. NOT
