    verified_by: null
  assumptions:
  - The pinned lattice-estimator's d4f implementation can be read from source and pinned in
    Stage 0; if it cannot, the arithmetic leg is not executable and the record says so.
  - The GOAL-MLKEM-004 instrument can be rebuilt; its own reproducibility_warning says it will
    not survive session end, and a failed rebuild is an infrastructure failure under AGENTS.md
    rule 5, never negative evidence.
  - Blocksizes 55-90 are reachable within budget on this instrument, which the committed dim-70
    bgj1 timing of 335.2 s makes plausible but does not establish for the lifting-augmented
    variant.
  - The success radius tau is declared before any data exists and never revised; a tau chosen
    after seeing m(f) would set f_meas to whatever is wanted.
  proof_search_map:
    bottleneck: >-
      Not a proof. The bottleneck in the COST CHAIN, which is what this record targets, is the
      map beta -> effective sieve dimension. Everything downstream (the 0.292 exponent, the
      memory charge, the category comparison) is applied to that number.
    baseline_embedding:
      parameter_slice: >-
        f = 0 reproduces the no-d4f baseline exactly: the sieve runs at full blocksize and m(0)
        is the pool minimum. This is the exact old-method boundary.
      reproduction_check: >-
        Bitwise: m(0) must equal min over pool of ||v|| computed by an independent code path.
        A frozen fixture at beta = 60, one seed, is stored and re-checked on every rebuild.
    observation_collision:
      observable: f_meas(beta), a single integer per (beta, seed).
      distinct_preimage_search: >-
        COLLISION FOUND AND IT IS THE POINT OF NULL-A: a non-sieve pool with matched cardinality
        and matched norm multiset is a distinct preimage that may yield the same f_meas. The
        design does not assume it does not; it measures it. If the collision is real, f_meas
        does not identify "sieving" and the interpretation is restricted to "pool of this size
        and norm profile", which is stated as the scope in that branch.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Replace the quoted d4f convention by the measured threshold f_meas, moving the estimator
        input from a fitted formula to an observed quantity with an error bar.
      predicted_gain: >-
        A signed correction of size 0.292 * (f_meas - f_law) bits per parameter set, with the
        sign unknown before the run. Committed margins are 2.80 / 6.04 / 1.28 bits, so a
        correction of 5-14 dimensions is decision-relevant at every set.
    quantifier_order: >-
      FOR ALL beta in [55, 90] and FOR ALL seeds in the declared set, THERE EXISTS a lift depth
      f_meas(beta, seed) such that m(f) <= tau*gh(beta) for all f <= f_meas and m(f) > tau*gh(beta)
      for f = f_meas + 1. The claim is then about the seed-averaged f_meas. NOTE THE ORDER
      CAREFULLY: nothing here is claimed uniformly in beta beyond the measured window, and H1 is
      the only bridge to beta ~ 400-900.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At blocksizes 55-90, on ML-KEM-shaped q-ary bases with q = 3329 and this sieve, the
        achievable free-dimension count is F(beta) +/- e." Nothing about FIPS 203 blocksizes,
        nothing about other lattice families, nothing about other sieves.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion fails is a lattice with an unusually
        flat Gram-Schmidt profile (e.g. a random unimodular-transformed cube), where lifting
        succeeds far deeper because there is no q-ary shape to fight. Running the same
        measurement there must give a materially different f_meas; if it gives the same one, the
        instrument is reading a property of the lifting code and not of the lattice.
    proof_obligations:
    - claim: m(0) equals the pool minimum bitwise.
      responsibility: baseline
    - claim: m(f) is non-decreasing in f up to noise.
      responsibility: correctness
    - claim: The pool-cardinality-forced component of f_meas is computed and subtracted.
      responsibility: strictness
    - claim: NULL-A is drawn at least 8 times and reported as an interval.
      responsibility: success_probability
    - claim: No statement is made about beta > 90 except through H1.
      responsibility: scope
    not_applicable_reason: null
  predictions:
  - metric: 'signed residual f_meas(beta) - (11.5 + 0.075*beta), averaged over seeds, in dimensions'
    direction: different
    minimum_effect: 1.5
  - metric: 'signed residual f_meas(beta) - beta*ln(4/3)/ln(beta/(2*pi*e)), in dimensions'
    direction: different
    minimum_effect: 1.5
  - metric: 'f_meas(sieve pool) - f_meas(NULL-A matched non-sieve pool), in dimensions'
    direction: higher
    minimum_effect: 1.0
  - metric: 'fitted slope d(f_meas)/d(beta) over the measured window'
    direction: different
    minimum_effect: '0.02 away from 0.075, i.e. an interval excluding the linear law''s slope'
  - metric: 'implied bit correction 0.292 * (f_meas - f_estimator_law) extrapolated to the
      estimator''s actual blocksizes under H1'
    direction: different
    minimum_effect: '1.276377 bits, i.e. the committed ML-KEM-1024 margin - below that the
      correction cannot flip any category verdict and is reported as such'
  minimal_test:
    design: >-
      TWO LEGS, AND LEG 1 IS A COMPLETE DELIVERABLE ON ITS OWN.
      LEG 1, ARITHMETIC, under one hour of single-core compute and no sieve: read the pinned
      lattice-estimator's d4f implementation and the (beta, eta) it selects for each FIPS 203
      set; tabulate both published laws at those blocksizes; report the signed gap in dimensions
      and in bits at 0.292 bits/dimension; compare against the committed margins +2.800527 /
      +6.041285 / +1.276377. Outcome is a single table with a sign per parameter set. If the two
      laws agree within 4.37/0.292 = 1 dimension at every FIPS blocksize, the convention question
      is settled negatively and Leg 2 is not worth running - that is a clean, cheap, negative
      stopping rule.
      LEG 2, MEASUREMENT: rebuild the instrument; beta in {55, 60, 65, 70, 75, 80, 85, 90}; three
      seeds per beta; for each, sweep f upward from 0 until m(f) crosses tau*gh(beta); record
      f_meas. Run NULL-A at 8 draws per cell. Emit the frozen three-branch rule on NULL-A first,
      then on the real arm. Report f_meas with intervals, both signed residuals, the slope fit,
      and the forced pool-cardinality component subtracted.
      WHY THIS IS THE CHEAPEST VALID DISCRIMINATOR: the two competing explanations differ in the
      SIGN of a slope inside the measured window, so no extrapolation is needed to separate them
      and the smallest blocksizes carry as much discriminating weight as the largest.
    controls:
    - 'NULL-A: matched-size, matched-norm-profile non-sieve pool, 8+ draws, identical lifting
      code path, verdict emitted on it before the real arm'
    - 'f = 0 bitwise regression against an independent pool-minimum computation'
    - 'monotonicity gate on m(f); non-monotone means the lifting path is broken and nothing is
      reported'
    - 'forced-value subtraction: the pool-cardinality-driven component of f_meas, derived in
      closed form in Stage 0'
    - 'flat-profile nearby-object control (random unimodular basis) to check f_meas is reading
      the lattice and not the lifting code'
    - 'instrument rebuild receipt reproducing the committed dim-70 bgj1 database size of 75511
      vectors before any new measurement is trusted'
    required_metrics:
    - f_meas(beta, seed) with per-beta interval over seeds
    - m(f) curve, full, for at least one (beta, seed) per blocksize, archived
    - signed residual against each of the two published laws, with interval
    - NULL-A f_meas interval over >= 8 draws
    - fitted slope d(f_meas)/d(beta) with confidence interval
    - forced pool-cardinality component and the residual after subtraction
    - the Leg 1 table of law-vs-law gaps in dimensions and bits at the estimator's actual blocksizes
    - wall-time and peak RSS per cell, and the rebuild receipt
  falsification_conditions:
  - 'Both residuals are within 1.5 dimensions of zero across the whole window: the two laws agree
    with measurement and with each other where it can be checked, the convention question is
    empirically empty in this range, and the extrapolation gap at FIPS blocksizes is reported as
    the only remaining uncertainty. This is a negative and it is the outcome I would bet on
    second-most.'
  - 'NULL-A returns the same f_meas as the sieve pool within its interval: the discount is a
    property of pool size and norm profile, not of sieving, and no statement about sieve-derived
    free dimensions is reportable from this instrument.'
  - 'm(f) is not monotone in f: the lifting implementation is wrong; no f_meas is reported and
    the batch reports an implementation defect.'
  - 'The measured f_meas equals the forced pool-cardinality component within error: the
    measurement is about cardinality and the object dissolves.'
  - 'The flat-profile nearby object returns the same f_meas as the q-ary lattices: the
    instrument reads the lifting code rather than the lattice and the object is void.'
  - 'Leg 1 shows the two laws differ by less than 1 dimension at the estimator''s actual
    blocksizes: the premise of the whole record is wrong and it is withdrawn at zero compute
    cost.'
  confounders:
  - >-
    Preprocessing quality. f_meas depends on how well the block was reduced before the sieve.
    Two runs at the same beta with different preprocessing give different f_meas. Preprocessing
    must be pinned exactly and recorded, and the sweep must include one deliberately
    under-preprocessed cell to expose the sensitivity.
  - >-
    The success radius tau. f_meas is defined relative to it and moves with it. Declared before
    the run; the report includes f_meas at three declared tau values so the reader sees the
    dependence rather than one hidden choice.
  - >-
    Pool cardinality is not a free variable: g6k sets the database size from a formula in the
    dimension, so lowering the sieve dimension by f also shrinks the pool, and the two effects
    on m(f) act in the same direction. This is the forced component and is why it must be
    subtracted rather than argued away.
  - >-
    Sieve kernel. bgj1, bdgl, gauss and hk3 do not produce the same pool. f_meas is scoped to
    the kernel used and at least two kernels must be run or the number is about one kernel.
  - >-
    q-ary structure at small beta. Below the point where the q-vectors are eliminated, the block
    is not a generic lattice and f_meas may reflect the q-ary shape. The fit must exclude the
    range where this bites and must say where that range ends.
  - >-
    Hardware and BLAS configuration change wall-time but not f_meas; f_meas is dimensionless,
    which is one of the reasons this object is preferable to a timing-based one.
  interpretation_limits:
  - Blocksizes 55-90 are toy scale. Nothing here is a statement about FIPS 203 parameter sets,
    which need beta of order 400-900. The only bridge is heuristic H1 and it is an assumption.
  - A signed correction to a cost-model input is not an attack, a break, a speedup or a security
    claim, and it does not change the status of EV-MLKEM-020 or any other record.
  - The number is a property of this sieve implementation, this preprocessing, this lattice
    family and this success radius. It is not a universal constant.
  - >-
      If the correction points toward LOWER attack cost, that is still not a break: it would move
      an estimate that already sits within a few bits of a category boundary, and the direction of
      movement must be reported without adjectives.
  - AGENTS.md rule 12 is UNMET and inherited from GOAL-MLKEM-003/004. Nothing here may be
    recorded as correcting EV-MLKEM-015, EV-MLKEM-020 or any predecessor record.
  heuristic_assumptions:
  - id: H1
    statement: >-
      (EXTRAPOLATION) Let f_meas(beta) be the seed-mean achievable free-dimension count measured
      on ML-KEM-shaped q-ary bases with q = 3329 for beta in [55, 90], with the sieve kernel and
      preprocessing pinned. H1 asserts that the SIGN of the residual
      r(beta) = f_meas(beta) - f_law(beta) is constant for all beta in [55, B] with B the
      estimator's largest selected blocksize (of order 900), for each of the two candidate laws
      f_law. H1 asserts NOTHING about the magnitude of r beyond the measured window.
    rigorous_support: >-
      The rigorous part is Ducas's d = Theta(n/log n) (KN-LIT-105), which fixes the asymptotic
      growth class but not the constant and not the finite-beta behaviour. The classical
      distribution statement H1 imitates is the extreme-value law for the minimum of a large
      sample: with K = 2^(0.2075*(beta-f)) pool vectors whose lifted norms are treated as
      independent draws from a fixed law, m(f) concentrates around the K-th order statistic, so
      f_meas inherits a log K / rate growth. H1 is the assertion that the residual between the
      empirical curve and the fitted law does not change sign as beta leaves the measurable
      window - the same kind of assumption as "this integer behaves like a uniformly random
      integer of its size", and it is weaker than assuming the magnitude extrapolates.
    validation_plan: >-
      SAMPLE: f_meas at beta = 55, 60, 65, 70, 75, 80, 85, 90, three seeds each, two sieve
      kernels, three tau values. SCALE: chosen because GOAL-MLKEM-004's committed instrument
      block records bgj1 at dimension 70 completing in 335.2 s, so the top of the window is
      within an order of magnitude of a measured runtime. COMPARISON DISTRIBUTION: the residual
      r(beta) against zero, and against the closed-form forced order-statistic curve derived in
      Stage 0. TAIL CHECK: the sign of r at the two largest reachable blocksizes taken alone must
      agree with the sign of r fitted over the whole window; if the largest-beta cells disagree
      with the fit, H1 is reported as UNSUPPORTED at the top of its own window, which is a
      stronger negative than any extrapolation argument. TRANSFER ASSUMPTION, STATED: nothing
      validates H1 above beta = 90 and no sampling shortcut analogous to the Deuring
      correspondence exists for this quantity; unlike the isogeny exemplar, there is no way to
      sample f_meas at cryptographic blocksizes, and that is the honest limit of this design.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. What is claimed is a signed correction to the DIMENSION at
      which the core-SVP exponent is evaluated: the cost convention is 2^(0.292 * (beta - f)),
      so a correction of D dimensions is a factor 2^(0.292*D) in the estimated attack time. At
      D = 5 that is 1.46 bits; at D = 13 it is 3.80 bits. The measurement's own cost is
      O(sum over f of pool(beta-f) * beta) lift operations per (beta, seed) cell.
    memory_exponent: >-
      NO ATTACK MEMORY EXPONENT IS CLAIMED. d4f reduces the sieve dimension, so it also reduces
      the memory charge 2^(0.2075*(beta-f)) by 0.2075*D bits in the same direction as the time
      correction - a fact worth reporting because it means the correction does NOT cancel between
      time and memory and moves memory-charged margins by 0.2075/0.292 = 71% as much as
      free-memory ones. The measurement's own peak memory is the sieve pool: the committed
      dim-70 figure is 75511 vectors, so a dim-90 pool is about 2^(0.2075*20) = 17.4x larger.
    best_known: >-
      There is no incumbent MEASUREMENT of f_meas in this repository - the grep returned zero
      proposals using the term. The incumbent CONVENTIONS are the two published laws, and the
      estimator's is executed inside the committed EV-MLKEM-020 numbers. Externally, empirical
      d4f behaviour is certainly studied in the sieving literature (the g6k default is described
      in its own docstring as coming "from exact-SVP experiments"), so this is a re-measurement
      in a new setting, not a first measurement, and is labelled `adaptation` in spirit even
      though the overall novelty_status is unverified.
    hidden_overhead: >-
      Three honest disclosures. (i) The 0.292 conversion is itself an asymptotic constant with an
      unbounded o(n); EV-MLKEM-020's own record notes "THE o(1) IN 2^(0.2075n + o(n)) IS
      UNBOUNDED HERE", and the same applies to the time exponent. Converting dimensions to bits
      at 0.292 is a convention-internal statement, not a physical one. (ii) f_meas is measured
      with a specific preprocessing and a specific kernel; the convention-vs-measurement gap this
      record hunts could be partly a kernel-choice gap. (iii) The window 55-90 is roughly one
      sixth to one tenth of the blocksizes that matter, which is a larger extrapolation ratio
      than the exemplar profile's validation experiments enjoy.
    tradeoff_note: >-
      d4f is the rare cost-model input that moves time and memory in the SAME direction, so it
      does not trade off - it shifts the whole (time, memory) point along the sieve's own
      exponent ray with slope 0.2075/0.292. This is directly relevant to IDEA-20260816-70e41d's
      memory-priced crossover and to the frontier geometry of the sibling record
      IDEA-20260821-46c09f, and the Leg 1 table should be handed to both.
  dominated_by: >-
    n/a (no attack result claimed), and this is stated after checking rather than asserted. There
    is no attack cost triple here to place on any frontier: nothing is solved, nothing is
    recovered, no query is made. On the MEASUREMENT axis, the frontier rows I checked inside this
    repository are IDEA-20260805-f7c912 (delta(beta) by real reduction), IDEA-20260807-8fbc86
    ((c_T, c_M) by wall-time and peak database size), IDEA-20260805-fc6361 (saturation-ball
    census) and the six committed GOAL-MLKEM-004 batches (EV-MLKEM-da9e3b, -50901f, -b43de0,
    -ba6c25, -d777f0, -2cd08b); none computes f_meas or any monotone function of it, so none
    dominates. Externally I did not verify whether a published empirical d4f curve at these
    blocksizes exists; if it does it dominates Leg 2 outright and Leg 1 is unaffected. Writing
    `null` here without that caveat would be a fabrication under AGENTS.md rule 5.
  sota_delta: >-
    No attack; measurement contribution only. Quantitatively: the repository currently holds ZERO
    values, zero bounds and zero null floors for the achievable free-dimension count, while
    holding three committed bit counts (140.1994731076207 / 200.9587149140538 /
    270.7236234535225) that are computed at dimensions already net of that count. The delta is
    the creation of a first measured value with a null floor, plus a zero-compute table
    quantifying how much of those three numbers is convention choice. Against the committed
    margins (2.800527 / 6.041285 / 1.276377 bits) the illustrative law-vs-law gap of 1.54-3.85
    bits is of the same order or larger, which is the entire reason to run it.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: >-
    By part. (i) That Leg 1 is executable, i.e. the pinned estimator's d4f expression and
    selected blocksizes can be read from source: ~0.9. (ii) That the two published laws differ by
    more than 4.37 dimensions at ML-KEM-1024's blocksize, so the convention question is live:
    ~0.75, and this is the load-bearing part - my own arithmetic says 13.17 dimensions at
    beta = 875 but the real blocksize and the estimator's real expression may both differ.
    (iii) That the instrument rebuilds: ~0.7, given GOAL-MLKEM-004's explicit
    reproducibility_warning and its own pause condition for exactly this. (iv) That Leg 2 returns
    a residual exceeding 1.5 dimensions against at least one law: ~0.55. (v) That NULL-A separates
    from the sieve arm, licensing the word "sieve" in the interpretation: ~0.5 - I would bet
    against this one most readily, because GOAL-MLKEM-004's whole history is non-sieve ensembles
    reproducing sieve effects, and I expect pool cardinality to carry much of f_meas.
    (vi) That the batch produces a defensible number or a defensible bound: ~0.85.
