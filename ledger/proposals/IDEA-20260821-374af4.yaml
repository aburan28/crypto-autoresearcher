    verified_by: ledger/goals/GOAL-MLKEM-004.yaml
  - ref: 'BDGL16 sieve exponents 2^{0.292n+o(n)} time, 2^{0.2075n+o(n)} memory'
    provenance: recalled
    claim: >-
      The core-SVP time constant 0.292 used throughout this record to convert dimensions to
