    form the figure moves. (iii) That the instrument rebuilds: ~0.7, given GOAL-MLKEM-004's
    explicit reproducibility_warning and its own pause condition for exactly this. (iv) That Leg 2
    returns a residual exceeding 1.5 dimensions against the Ducas law on the clamp-free window:
    ~0.5, revised DOWN from 0.55 because the usable window is now four cells rather than eight.
    (v) That the slope test separates the two laws: ~0.15, revised sharply DOWN - the laws differ
    by 0.0164 in slope over the reachable window and this design does not have that resolution;
    the level test is the discriminator. (vi) That NULL-A separates from the sieve arm, licensing
    the word "sieve" in the interpretation: ~0.5 - I would bet against this one most readily,
    because GOAL-MLKEM-004's whole history is non-sieve ensembles reproducing sieve effects, and
    I expect pool cardinality to carry much of f_meas. (vii) That the batch produces a defensible
    number or a defensible bound: ~0.85. PRIORITY LOWERED from high to medium on this revision:
    the cheap leg that justified `high` is now largely committed work, and what remains is a
    four-cell toy-scale measurement whose slope discriminator does not have the power the filed
    version claimed.
