    verified_by: idea-generator@2026-08-21
  - ref: 'KN-LIT-105 (Ducas, "Shortest Vector from Lattice Sieving: a Few Dimensions for Free",
      ePrint 2017/999, EUROCRYPT 2018)'
    provenance: internal
    claim: >-
      Corpus entry, citation_verified: read. States d = Theta(n / log n) dimensions come for
