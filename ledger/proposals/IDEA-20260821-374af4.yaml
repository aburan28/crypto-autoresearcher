    results: >-
      CORRECTED ON RED-TEAM REVIEW; the filed version of this field asserted "NO record in
      ledger/proposals, ledger/hypotheses, ledger/evidence or knowledge/ measures, fits, or
      tracks the dimensions-for-free count", and that is FALSE.
      WHAT THE REPOSITORY ACTUALLY HOLDS. GOAL-MLKEM-003 BATCH-011 (task TASK-20260803-fb52f4)
      committed a run whose results.json carries axis_B_dimensions_for_free with
      d4f_at_stage1_beta = 35.67737953719783 / 47.85832227236001 / 61.098712419599856,
      d4f_worth_bits = 7.99837454400668 / 10.30550794877945 / 12.991238337845346, and the
      with/without pairs log2_rop_with_d4f = 139.65604148085845 / 196.3662433539826 /
      262.3356800074737 against log2_rop_no_d4f = 147.65441602486513 / 206.67175130276206 /
      275.32691834531903; the producing source evaluates the pinned estimator's own
      RC.MATZOV.d4f at the dual stage-1 blocksize and builds an explicit no-d4f counterfactual
      class. EV-MLKEM-021 carries it as numbered hypothesis H12, "Dimensions-for-free is applied
      by both sides and cancels", validation_status "validated_this_batch for MAGNITUDE (7.9984
      / 10.3055 / 12.9912 bits) and justified by INFERENCE for the published side", checked by
      producer AXIS B, validator M21, red team OBJ-10. So the d4f MAGNITUDE is committed
      evidence, the d4f LAW is identifiable from that evidence (the values reproduce
      beta*ln(4/3)/ln(beta/(2*pi*e)) at the recorded betas), and the leg of this record that
      proposed to establish either is withdrawn. In knowledge/, KN-LIT-105 (Ducas, ePrint
      2017/999, citation_verified: read) is the source of the law and its "Not verified here"
      section records the Theta(n/log n) analysis was not re-derived here; KN-LIT-109 and
      KN-OPEN-016 record Guo-Johansson combining d4f with bulk short-vector output and the
      recorded inability to combine the two, which is a constraint on any attack that would use
      f_meas but not on measuring it; KN-TECH-039 and KN-TECH-043 carry d4f as a tagged
      technique.
      WHAT SURVIVES AS A REPOSITORY NEGATIVE, AND IT IS THE WHOLE OF THE RESIDUAL CLAIM: nothing
      in ledger/, coordination/ or knowledge/ holds a MEASURED achievable free-dimension count,
      a bound on it, or a null floor for it. Every d4f number in this program is the output of
      evaluating a formula, not of running a sieve and seeing how many dimensions it could
      actually give up. f_meas is unmeasured here and the greps above are the evidence for that
      narrower statement.
      The nearest in-lane measurement records remain: IDEA-20260805-f7c912, which measures the
      block-size-to-root-Hermite map delta(beta) by running real reduction - a different scalar
      summary of a different object; IDEA-20260807-8fbc86, which fits (c_T, c_M) from wall-time
      and peak database size and whose own confounder list warns that "g6k's database size is
      not the same quantity as the asymptotic memory in c_M"; and IDEA-20260805-fc6361, whose
      saturation-ball census counts lattice points inside a ball at fixed dimension. None of the
      three can produce f_meas. EV-MLKEM-020's own two d4f mentions - confirming the estimator
      executes the d4f path, and reporting that "the estimator's own floored-d4f convention moves
      it by < 0.2%" - are a sensitivity on c*, the memory-charge critical exponent, not on the
      bit count.
    verdict: >-
      UNVERIFIED, and NARROWED ON REVIEW. Three citations here are retrieved or internal and
      re-readable (the two g6k source functions, the BATCH-011 results.json, EV-MLKEM-021); the
      external picture beyond that is recalled and flagged. Nothing is asserted about what the
      external literature contains: measuring d4f empirically is certainly done inside the
      sieving community, and this record does not claim otherwise.
      CLAIMED NEW RELATIVE TO THIS REPOSITORY, AFTER THE CORRECTION: (i) f_meas - the MEASURED
      achievable free-dimension count - as a tracked object with a null floor, which remains
      unmeasured anywhere in ledger/, coordination/ or knowledge/; (ii) the identification of
      dim4free_wrapper's clamp and the beta = 74.1176 crossover, which no record in this program
      carries and which makes half the filed measurement window uninterpretable against the
      unclamped law; (iii) the separation of the law the ESTIMATOR charges (Ducas) from the law
      the IMPLEMENTATION applies (clamped linear), which this lane has been treating as one
      quantity.
      EXPLICITLY WITHDRAWN AS A NOVELTY CLAIM: (a) that the repository holds no d4f value - it
      holds 7.9984 / 10.3055 / 12.9912 bits at BATCH-011 and EV-MLKEM-021 H12; (b) that reading
      the estimator's d4f implementation is an open task - it is committed; (c) the inversion of
      the committed margins into 9.59 / 20.69 / 4.37 dimensions, which is one division and is
      not a contribution.
      ASSEMBLED FROM KNOWN PARTS: the instrument is GOAL-MLKEM-004's, the estimator numbers are
      EV-MLKEM-020's and BATCH-011's, the lifting construction is Ducas's, and the linear fit and
      its clamp are g6k's.
  object_first_candidate:
    established_families_off_limits: >-
      This lane's mined families are declared off-limits as the primary lens: dual-attack score
      geometry (six batches of GOAL-MLKEM-004 and eight in-lane proposals), estimator-arithmetic
      differencing (twelve batches of GOAL-MLKEM-003, of which BATCH-011 is the one that already
      sized d4f), and the module-structure discount (four in-lane proposals). None of them is
      used here. The lens is the SVP oracle's own dimension, measured rather than computed.
    tracked_object: >-
      m(f) = min over the sieve pool of || Babai-lift of v into the full beta-block ||, as a
      function of the lift depth f. One real number per (beta, f, seed). f_meas(beta) is the
      largest f at which m(f) still clears the declared success radius.
    lossiness: >-
      LOSSY, hard, and in a direction compatible with the target operation. The full state is
      the pool: about 2^(0.2075*(beta-f)) vectors each of dimension beta-f, i.e. GOAL-MLKEM-004
      committed 75511 vectors at dimension 70. The projection retains ONE scalar per lift depth
      and discards which vector achieved it, all other vectors, all coefficient data and the
      whole geometry of the pool. This is not a change of coordinates: from m(f) one cannot
      reconstruct even a single pool vector, and pools with wildly different geometry give
      identical m(f). Compatibility with the operation is the non-trivial part and is exactly
      what makes the object work: Babai lifting is applied vector-wise, so the minimum over the
      lifted pool is determined by the pool as a set without reference to the order in which the
      sieve produced it, and increasing f by one composes one more rounding step onto every
      lift. What is discarded (identity, ordering, all non-minimal vectors) is discarded
      compatibly because the SVP oracle's downstream consumer - the BKZ tour - uses only the
      shortest lifted vector it is handed.
    propagation: >-
      One step is f -> f+1: sieve one dimension lower, lift one dimension further. The
      propagation law is deterministic given the basis and the pool, and monotone in one
      direction only - m(f) is non-decreasing in f in expectation, because a deeper lift adds a
      rounding error term and removes a dimension of sieving. That monotonicity is a CHEAP
      INTERNAL FALSIFIER: if the measured m(f) is not monotone up to noise, the lifting
      implementation is wrong and no f_meas is reportable.
    survival_score: >-
      Survives to the point where m(f) crosses the success radius, and that crossing IS the
      quantity of interest, so the object is designed to dissolve exactly where the answer lives.
      Beyond f_meas the object is uninformative: m(f) grows and carries no further structure.
      Reported as: the number of lift depths over which m(f) stays below the radius, at each
      beta, which is f_meas(beta) itself.
  null_object_control: >-
    Written against the six load-bearing lines of KN-TECH-1a5b7e's checklist.
    OBJECT REMOVED: sieving. NULL-A, the non-sieve pool of matched size and matched norm
    profile. Generate a pool of lattice vectors in the same projected sublattice by random
    integer combinations followed by Babai rounding against the same reduced basis, resampled
    until its norm multiset matches the real sieve pool's decile-by-decile, then run the
    IDENTICAL lifting and minimisation code path. OBJECT PRESERVED: dimension, basis, norm
    distribution, pool cardinality, lifting code, success radius.
    CAN THIS NULL FAIL: YES, and the failure direction is pre-declared. If NULL-A returns the
    same f_meas as the sieve pool, then the free dimensions come from the norm distribution and
    the pool size alone, sieving contributes nothing to the discount, and the entire d4f
    literature's attribution to sieving is not readable from this instrument - a strong negative
    that would be reported as the headline.
    FORCED VALUE DERIVATION, done before the run: a pool of K vectors whose lifted norms were
    independent draws from a fixed law would have E[m(f)] falling like the K-th order statistic,
    so f_meas would grow like log K / (rate). Since K = 2^(0.2075*(beta-f)) is itself set by the
    dimension, part of any observed growth of f_meas in beta is FORCED by pool size alone. The
    forced component is computed in closed form in Stage 0 and subtracted before any residual
    against a published law is read. If the whole measured f_meas equals the forced component,
    the measurement is about pool cardinality and not about the sieve.
    FORCED VALUE DERIVATION, SECOND ITEM, ADDED ON RED-TEAM REVIEW: over the clamped window
    beta in {55, 60, 65, 70} the value g6k applies is FORCED to be (beta-40)/2 rounded down -
    7 / 10 / 12 / 15 - by dim4free_wrapper and not by any property of the lattice. Reporting
    "g6k's applied d4f is far below the linear law at small beta" is therefore a forced fact and
    is inadmissible as a finding. Only the residual of the MEASURED f_meas against a named law
    carries information, and on those four cells it must be reported against all three targets
    or not at all.
    COMPARATOR N_DRAWS: NULL-A is a generated comparator, so it is drawn at least 8 times per
    (beta, f) cell and reported as an interval, per KN-TECH-1a5b7e mode 5. A residual read
    against a single draw is not reportable.
    MAXIMAL REMOVAL CONTROL: at f = 0 no lifting occurs, so m(0) must equal the pool minimum
    exactly, bitwise. If it does not, the lifting path is broken.
    VERDICT ON THE NULL ARM FIRST: the frozen decision rule (which of the four branches - above
    both laws, between them, below both, or intervals overlapping both - the residual falls in)
    is emitted on NULL-A before the real arm is looked at. Same branch on both arms means the
    rule discriminates nothing.
