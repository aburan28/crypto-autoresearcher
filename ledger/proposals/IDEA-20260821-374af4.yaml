      EV-MLKEM-020 mentions d4f twice - confirming the estimator executes the d4f path, and
      reporting that "the estimator's own floored-d4f convention moves it by < 0.2%" - but that
      sensitivity is on c*, the memory-charge critical exponent, NOT on the bit count, and
      changing the FLOORING of a fixed law is not the same as changing the LAW.
    verdict: >-
      UNVERIFIED. Two citations here are retrieved and re-readable (the g6k source line, the
      eprint abstracts); the rest is recalled and flagged. Nothing is asserted about what the
      external literature does or does not already contain: measuring d4f empirically is
      certainly done inside the sieving community, and this record does not claim otherwise.
      CLAIMED NEW RELATIVE TO THIS REPOSITORY: (i) naming f_meas as a tracked object at all,
      (ii) the observation that two published d4f laws differ at ML-KEM blocksizes by more
      dimensions than the committed margins tolerate, and (iii) the inversion of the committed
      margins into a required-d4f-error in dimensions (9.59 / 20.69 / 4.37). ASSEMBLED FROM
      KNOWN PARTS: the instrument is GOAL-MLKEM-004's, the estimator numbers are EV-MLKEM-020's,
      the lifting construction is Ducas's, and the linear fit is g6k's.
  object_first_candidate:
    established_families_off_limits: >-
      This lane's mined families are declared off-limits as the primary lens: dual-attack score
      geometry (six batches of GOAL-MLKEM-004 and eight in-lane proposals), estimator-arithmetic
      differencing (twelve batches of GOAL-MLKEM-003), and the module-structure discount (four
      in-lane proposals). None of them is used here. The lens is the SVP oracle's own dimension.
    tracked_object: >-
      m(f) = min over the sieve pool of || Babai-lift of v into the full beta-block ||, as a
      function of the lift depth f. One real number per (beta, f, seed). f_meas(beta) is the
      largest f at which m(f) still clears the declared success radius.
    lossiness: >-
      LOSSY, hard, and in a direction compatible with the target operation. The full state is
      the pool: about 2^(0.2075*(beta-f)) vectors each of dimension beta-f, i.e. GOAL-MLKEM-004
      committed 75511 vectors at dimension 70. The projection retains ONE scalar per lift depth
      and discards which vector achieved it, all other vectors, all coefficient data and the
      whole geometry of the pool. This is not a change of coordinates: from m(f) one cannot
      reconstruct even a single pool vector, let alone the pool, and pools with wildly different
      geometry give identical m(f). Compatibility with the operation is the non-trivial part and
      is exactly what makes the object work: Babai lifting is applied vector-wise, so the minimum
      over the lifted pool is determined by the pool as a set without reference to the order in
      which the sieve produced it, and increasing f by one composes one more rounding step onto
      every lift. What is discarded (identity, ordering, all non-minimal vectors) is discarded
      compatibly because the SVP oracle's downstream consumer - the BKZ tour - uses only the
      shortest lifted vector it is handed.
    propagation: >-
      One step is f -> f+1: sieve one dimension lower, lift one dimension further. The
      propagation law is deterministic given the basis and the pool, and monotone in one
      direction only - m(f) is non-decreasing in f in expectation, because a deeper lift adds a
      rounding error term and removes a dimension of sieving. That monotonicity is a CHEAP
      INTERNAL FALSIFIER: if the measured m(f) is not monotone up to noise, the lifting
      implementation is wrong and no f_meas is reportable.
    survival_score: >-
      Survives to the point where m(f) crosses the success radius, and that crossing IS the
      quantity of interest, so the object is designed to dissolve exactly where the answer lives.
      Beyond f_meas the object is uninformative: m(f) grows and carries no further structure.
      Reported as: the number of lift depths over which m(f) stays below the radius, at each
      beta, which is f_meas(beta) itself.
  null_object_control: >-
    Written against the six load-bearing lines of KN-TECH-1a5b7e's checklist.
    OBJECT REMOVED: sieving. NULL-A, the non-sieve pool of matched size and matched norm
    profile. Generate a pool of lattice vectors in the same projected sublattice by random
    integer combinations followed by Babai rounding against the same reduced basis, resampled
    until its norm multiset matches the real sieve pool's decile-by-decile, then run the
    IDENTICAL lifting and minimisation code path. OBJECT PRESERVED: dimension, basis, norm
    distribution, pool cardinality, lifting code, success radius.
    CAN THIS NULL FAIL: YES, and the failure direction is pre-declared. If NULL-A returns the
    same f_meas as the sieve pool, then the free dimensions come from the norm distribution and
    the pool size alone, sieving contributes nothing to the discount, and the entire d4f
    literature's attribution to sieving is not readable from this instrument - a strong negative
    that would be reported as the headline.
    FORCED VALUE DERIVATION, done before the run: a pool of K vectors whose lifted norms were
    independent draws from a fixed law would have E[m(f)] falling like the K-th order statistic,
    so f_meas would grow like log K / (rate). Since K = 2^(0.2075*(beta-f)) is itself set by the
    dimension, part of any observed growth of f_meas in beta is FORCED by pool size alone. The
    forced component is computed in closed form in Stage 0 and subtracted before any residual
    against a published law is read. If the whole measured f_meas equals the forced component,
    the measurement is about pool cardinality and not about the sieve.
    COMPARATOR N_DRAWS: NULL-A is a generated comparator, so it is drawn at least 8 times per
    (beta, f) cell and reported as an interval, per KN-TECH-1a5b7e mode 5. A residual read
    against a single draw is not reportable.
    MAXIMAL REMOVAL CONTROL: at f = 0 no lifting occurs, so m(0) must equal the pool minimum
    exactly, bitwise. If it does not, the lifting path is broken.
    VERDICT ON THE NULL ARM FIRST: the frozen decision rule (which of the three branches - above
    both laws, between them, below both - the residual falls in) is emitted on NULL-A before the
    real arm is looked at. Same branch on both arms means the rule discriminates nothing.
  discriminated_from:
  - >-
    IDEA-20260805-f7c912 measures delta(beta), the root-Hermite factor, by running real
    reduction. That is a property of the OUTPUT BASIS PROFILE at a given blocksize. f_meas is a
    property of how far the SVP ORACLE'S DIMENSION can be reduced below the blocksize. The two
    enter the estimator at different places - delta sets which beta is needed, d4f sets what that
    beta costs - and either could be right while the other is wrong. Running f7c912 would not
    produce f_meas and running this would not produce delta.
  - >-
    IDEA-20260807-8fbc86 fits (c_T, c_M) from wall-time and peak database size versus dimension.
    It measures the cost of a sieve call AT a dimension. This measures WHICH dimension the call
    is made at. Multiplying its answer by the wrong dimension gives the wrong bit count no matter
    how well c_T is fitted, which is precisely why the two are complementary rather than
    duplicative. Its own confounder list already concedes that its database-size proxy is not the
    asymptotic memory quantity.
  - >-
    IDEA-20260805-fc6361 censuses lattice points inside the saturation ball at fixed dimension,
    against the forced value (4/3)^(d/2). That is a static count in one lattice at one dimension.
    f_meas is a threshold in the lift-depth parameter and is undefined without the lifting map,
    which fc6361 never applies.
  - >-
    IDEA-20260816-70e41d locates the enumeration/sieving crossover as a curve over a memory
    price. d4f moves the sieve leg of that crossover but the crossover is not measured here and
    no memory price appears anywhere in this record.
  - >-
    IDEA-20260816-08eda1 (Fourier support of the FFT score landscape) and every other dual-attack
    record in this lane concern the distinguisher. This record never scores a candidate and never
    touches a dual lattice; primal_bdd's SVP call is the only object.
