  sota_delta: >-
    No attack; measurement contribution only. CORRECTED ON RED-TEAM REVIEW - the filed claim that
    "this repository holds ZERO values, zero bounds and zero null floors for the achievable
    free-dimension count" was false as written, because it was read as covering the d4f count in
    general and the repository holds committed values for that at BATCH-011 and EV-MLKEM-021 H12.
    Quantitatively and as now checked: the repository holds the d4f MAGNITUDE (7.9984 / 10.3055 /
    12.9912 bits) and the d4f LAW (Ducas, identifiable from the committed values), and holds ZERO
    measured ACHIEVABLE counts, zero bounds on one, and zero null floors for one. The delta is
    (i) a first measured value of f_meas with a null floor at beta in 75-90, (ii) the
    identification of g6k's dim4free_wrapper clamp and the beta = 74.1176 crossover, which no
    record in this program carries, (iii) the separation of the law the estimator CHARGES from
    the law the implementation APPLIES, and (iv) a zero-compute table of the law-vs-law gap at
    the primal blocksizes 389/606/855 and 423/641/890 - 4.87 to 13.49 dimensions, 1.42 to 3.94
    bits - which exceeds the committed margin at ML-KEM-1024 (1.276377 bits) and is 39-55% of it
    at the other two sets. WITHDRAWN FROM THE DELTA: the claim to be first to name, size or
    locate the d4f discount in this program, and the blanket statement that the convention gap
    exceeds every committed margin.
