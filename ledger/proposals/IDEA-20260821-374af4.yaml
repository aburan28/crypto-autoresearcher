      Observations block: primal_bdd/RC.MATZOV = 140.1994731076207 / 200.9587149140538 /
      270.7236234535225 bits at the three FIPS 203 sets against cutoffs 143 / 207 / 272, margins
      +2.800527 / +6.041285 / +1.276377; effective sieve dimensions bkz 353.197381 / 557.152930 /
      792.144373 and svp 385.084530 / 590.132012 / 825.235330; RC.MATZOV verified to execute the
      d4f path; estimator commit 3e48ef421ec256afddb3e7d2249a77eab6e9ba12.
    verified_by: ledger/evidence/EV-MLKEM-020.yaml
  - ref: GOAL-MLKEM-004 instrument block (KN-TECH-14efa5)
    provenance: internal
    claim: >-
      verified_by_execution: g6k dim 70 qary q=3329 bgj1 -> db 75511 vectors (335.2 s); g6k dim
