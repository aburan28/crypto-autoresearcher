    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: >-
    By part, revised after the red-team finding. (i) That Leg 1 is executable: ~0.95, higher than
    filed, because most of it is now a citation to committed evidence rather than a source read.
    (ii) That the two laws differ by more than 4.37 dimensions at ML-KEM-1024's blocksize, so the
    convention question is live: ~0.9, revised UP from 0.75, because the hand derivation at the
    inverted blocksizes 855 and 890 gives 12.77 and 13.49 dimensions - but this is conditional on
