  confounders:
  - >-
    Preprocessing quality. f_meas depends on how well the block was reduced before the sieve.
    Two runs at the same beta with different preprocessing give different f_meas. Preprocessing
    must be pinned exactly and recorded, and the sweep must include one deliberately
    under-preprocessed cell to expose the sensitivity.
  - >-
    The success radius tau. f_meas is defined relative to it and moves with it. Declared before
    the run; the report includes f_meas at three declared tau values so the reader sees the
    dependence rather than one hidden choice.
  - >-
    Pool cardinality is not a free variable: g6k sets the database size from a formula in the
    dimension, so lowering the sieve dimension by f also shrinks the pool, and the two effects
    on m(f) act in the same direction. This is the forced component and is why it must be
    subtracted rather than argued away.
  - >-
    THE CLAMP, PROMOTED FROM AN UNKNOWN TO A CONTROLLED CONFOUNDER ON RED-TEAM REVIEW. g6k's
    dim4free_wrapper applies int(min((beta-40)/2, dim4free)) and returns 0 below beta = 40, so
    over 55-70 the implementation's own free-dimension count is 7/10/12/15 rather than the
    linear law's 15/16/16/16. Any comparison of a measured f_meas against "the g6k law" at those
    blocksizes is a comparison against a function not in force. Handled by splitting the window
    and by naming every residual's target.
  - >-
    THE TWO LAWS ARE NOT INTERCHANGEABLE AND THE FILED RECORD TREATED THEM AS RIVALS FOR ONE
    ROLE. The pinned estimator charges Ducas; g6k applies the clamped linear rule. A residual
    against the g6k law says something about the implementation; only a residual against the
    Ducas law bears on the committed bit counts. Reporting one as if it were the other is the
    single most likely misreading of this record's output.
  - >-
    Sieve kernel. bgj1, bdgl, gauss and hk3 do not produce the same pool. f_meas is scoped to
    the kernel used and at least two kernels must be run or the number is about one kernel.
  - >-
    q-ary structure at small beta. Below the point where the q-vectors are eliminated, the block
    is not a generic lattice and f_meas may reflect the q-ary shape. The fit must exclude the
    range where this bites and must say where that range ends.
  - >-
    Hardware and BLAS configuration change wall-time but not f_meas; f_meas is dimensionless,
    which is one of the reasons this object is preferable to a timing-based one.
  interpretation_limits:
  - Blocksizes 55-90 are toy scale, and the clamp-free part of that window is only four cells
    wide. Nothing here is a statement about FIPS 203 parameter sets, which need beta of order
    389-890. The only bridge is heuristic H1 and it is an assumption.
  - The estimator's d4f law is Ducas and g6k's linear rule is an implementation default. A
    residual against one is not a residual against the other, and this record's output is
    uninterpretable if the two are merged.
  - The d4f MAGNITUDE is already committed at BATCH-011 and EV-MLKEM-021 H12 (7.9984 / 10.3055 /
    12.9912 bits, at the DUAL stage-1 blocksizes). Nothing here re-establishes it, nothing here
    contradicts it, and the primal blocksizes this record derives are a different slice.
  - A signed correction to a cost-model input is not an attack, a break, a speedup or a security
    claim, and it does not change the status of EV-MLKEM-020, EV-MLKEM-021 or any other record.
  - The number is a property of this sieve implementation, this preprocessing, this lattice
    family and this success radius. It is not a universal constant.
  - >-
      If the correction points toward LOWER attack cost, that is still not a break: it would move
      an estimate that already sits within a few bits of a category boundary, and the direction of
      movement must be reported without adjectives.
  - The part-(B) blocksizes and gaps were derived BY HAND during a red-team repair on 2026-08-24,
    not by an executed run. No run record backs them. They are labelled as arithmetic throughout
    and Stage 0a is the gate that makes them citable.
  - AGENTS.md rule 12 is UNMET and inherited from GOAL-MLKEM-003/004. Nothing here may be
    recorded as correcting EV-MLKEM-015, EV-MLKEM-020, EV-MLKEM-021 or any predecessor record.
  heuristic_assumptions:
  - id: H1
    statement: >-
      (EXTRAPOLATION) Let f_meas(beta) be the seed-mean achievable free-dimension count measured
      on ML-KEM-shaped q-ary bases with q = 3329 for beta in [55, 90], with the sieve kernel and
      preprocessing pinned. H1 asserts that the SIGN of the residual
      r(beta) = f_meas(beta) - f_Ducas(beta) is constant for all beta in [55, B] with B the
      estimator's largest selected blocksize (eta_svp = 890 for ML-KEM-1024). H1 asserts NOTHING
      about the magnitude of r beyond the measured window, and nothing at all about the residual
      against the g6k law, whose clamp makes it a different function below beta = 74.1176.
    rigorous_support: >-
      The rigorous part is Ducas's d = Theta(n/log n) (KN-LIT-105), which fixes the asymptotic
      growth class but not the constant and not the finite-beta behaviour. The classical
      distribution statement H1 imitates is the extreme-value law for the minimum of a large
      sample: with K = 2^(0.2075*(beta-f)) pool vectors whose lifted norms are treated as
      independent draws from a fixed law, m(f) concentrates around the K-th order statistic, so
      f_meas inherits a log K / rate growth. H1 is the assertion that the residual between the
      empirical curve and the charged law does not change sign as beta leaves the measurable
      window - the same kind of assumption as "this integer behaves like a uniformly random
      integer of its size", and it is weaker than assuming the magnitude extrapolates.
    validation_plan: >-
      SAMPLE: f_meas at beta = 55, 60, 65, 70, 75, 80, 85, 90, three seeds each, two sieve
      kernels, three tau values, with the primary residual restricted to the clamp-free cells
      75-90. SCALE: chosen because GOAL-MLKEM-004's committed instrument block records bgj1 at
      dimension 70 completing in 335.2 s, so the top of the window is within an order of
      magnitude of a measured runtime; beta = 100 would be of order 550x that and is out of
      budget. COMPARISON DISTRIBUTION: the residual r(beta) against zero, and against the
      closed-form forced order-statistic curve derived in Stage 0. TAIL CHECK: the sign of r at
      the two largest reachable blocksizes taken alone must agree with the sign of r fitted over
      the clamp-free window; if the largest-beta cells disagree with the fit, H1 is reported as
      UNSUPPORTED at the top of its own window, which is a stronger negative than any
      extrapolation argument.
      THE SAMPLING SHORTCUT QUESTION, ARGUED RATHER THAN ASSERTED (RESTATED ON RED-TEAM REVIEW,
      because the filed version declared a shortcut nonexistent without naming an obstruction).
      WHAT DOES EXIST: a validated BKZ simulator (KN-LIT-101, Chen-Nguyen) predicts the
      Gram-Schmidt PROFILE a schedule produces at arbitrary beta at zero sieve cost, and the
      sibling record IDEA-20260821-41cd67 puts that instrument to work on the call-count
      question. WHAT IT DOES NOT GIVE, AND THIS IS THE NAMED OBSTRUCTION: f_meas is a threshold
      on the minimum BABAI-LIFTED NORM OVER A REALISED POOL, and no simulator in this program's
      corpus models the pool - simulators emit basis profiles, not the multiset of vectors a
      sieve returns, and the lifted minimum is a functional of that multiset. KN-LIT-101's own
      corpus entry says the simulator predicts output quality and running time, not pool
      contents. So the shortcut covers the profile leg and not the pool leg, and f_meas is on the
      pool leg. FORWARD GUIDANCE, so that this is a boundary and not a closure: the classes that
      would remove the obstruction are (a) a saturation model that predicts the lifted-norm
      order statistic from (beta, f, pool size) alone, which the forced-value derivation in
      null_object_control is the first step of and which could be validated against the measured
      cells; (b) an implementation that measures f_meas at larger beta on a machine this program
      does not have, which is a budget question and not a mathematical one; (c) a published
      empirical d4f curve at cryptographic beta, whose existence I did not check and which would
      dominate Leg 2 outright. TRANSFER ASSUMPTION, STATED: nothing in this design validates H1
      above beta = 90, and the honest ceiling is that the record delivers a measured value with a
      null floor at toy scale plus a stated extrapolation.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. What is claimed is a signed correction to the DIMENSION at
      which the core-SVP exponent is evaluated: the cost convention is 2^(0.292 * (beta - f)),
      so a correction of D dimensions is a factor 2^(0.292*D) in the estimated attack time. At
      D = 5 that is 1.46 bits; at D = 13 it is 3.80 bits. The measurement's own cost is
      O(sum over f of pool(beta-f) * beta) lift operations per (beta, seed) cell.
    memory_exponent: >-
      NO ATTACK MEMORY EXPONENT IS CLAIMED. d4f reduces the sieve dimension, so it also reduces
      the memory charge 2^(0.2075*(beta-f)) by 0.2075*D bits in the same direction as the time
      correction - a fact worth reporting because it means the correction does NOT cancel between
      time and memory and moves memory-charged margins by 0.2075/0.292 = 71% as much as
      free-memory ones. The measurement's own peak memory is the sieve pool: the committed
      dim-70 figure is 75511 vectors, so a dim-90 pool is about 2^(0.2075*20) = 17.4x larger.
    best_known: >-
      CORRECTED ON RED-TEAM REVIEW. The incumbent VALUE for the d4f discount in this repository
      is GOAL-MLKEM-003 BATCH-011 / EV-MLKEM-021 H12: 7.9984 / 10.3055 / 12.9912 bits, from
      d4f_at_stage1_beta 35.6774 / 47.8583 / 61.0987, validated_this_batch for MAGNITUDE. The
      incumbent LAW is the Ducas closed form, executed inside the committed EV-MLKEM-020 figures.
      There is no incumbent MEASUREMENT of f_meas - the achievable count - anywhere in ledger/,
      coordination/ or knowledge/, and that is the only place this record claims to be first.
      Externally, empirical d4f behaviour is certainly studied in the sieving literature (the g6k
      default is described in its own docstring as coming "from exact-SVP experiments"), so this
      is a re-measurement in a new setting, not a first measurement, and would be labelled
      `adaptation` in spirit even though the overall novelty_status is unverified.
    hidden_overhead: >-
      Four honest disclosures. (i) The 0.292 conversion is itself an asymptotic constant with an
      unbounded o(n); EV-MLKEM-020's own record notes "THE o(1) IN 2^(0.2075n + o(n)) IS
      UNBOUNDED HERE", and the same applies to the time exponent. Converting dimensions to bits
      at 0.292 is a convention-internal statement, not a physical one. (ii) f_meas is measured
      with a specific preprocessing and a specific kernel; the convention-vs-measurement gap this
      record hunts could be partly a kernel-choice gap. (iii) The clamp-free window is four cells
      wide (75-90), which is roughly one twelfth of the blocksizes that matter and is a larger
      extrapolation ratio than the exemplar profile's validation experiments enjoy. (iv) The
      part-(B) inversion is hand arithmetic pending Stage 0a; if the estimator's expression is
      not exactly the Ducas closed form, the six blocksizes and all six gaps move.
    tradeoff_note: >-
      d4f is the rare cost-model input that moves time and memory in the SAME direction, so it
      does not trade off - it shifts the whole (time, memory) point along the sieve's own
      exponent ray with slope 0.2075/0.292. This is directly relevant to IDEA-20260816-70e41d's
      memory-priced crossover and to the frontier geometry of the sibling record
      IDEA-20260821-46c09f, and the Leg 1 table should be handed to both.
  dominated_by: >-
    n/a (no attack result claimed), and this is stated after checking rather than asserted. There
    is no attack cost triple here to place on any frontier: nothing is solved, nothing is
    recovered, no query is made. CORRECTED ON RED-TEAM REVIEW: the enumeration recorded at filing
    named the six GOAL-MLKEM-004 batches and omitted GOAL-MLKEM-003 entirely, which is where the
