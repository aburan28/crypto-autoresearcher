  - ref: 'g6k master, g6k/algorithms/bkz.py, function default_dim4free_fun'
    provenance: retrieved
    claim: >-
      Verbatim: "def default_dim4free_fun(blocksize): ... return int(11.5 + 0.075*blocksize)",
