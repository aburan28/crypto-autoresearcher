idea:
  id: IDEA-20260821-374af4
  question_id: RQ-MLKEM-003
  added: '2026-08-21'
  title: >-
    The dimensions-for-free discount is committed in this program as a SIZE (7.9984 / 10.3055 /
    12.9912 bits, GOAL-MLKEM-003 BATCH-011, EV-MLKEM-021 H12) but never as an ACHIEVABLE COUNT:
    track the MINIMUM LIFTED NORM AS A FUNCTION OF LIFT DEPTH over the sieve pool, measure the
    achievable free-dimension count f_meas directly at the blocksizes the instrument can reach,
    and report the signed residual of f_meas against the law the pinned estimator actually
    charges (Ducas) and against the law the g6k implementation actually applies (the clamped
    linear rule), which are different functions and which the record now separates
  class: measurement
  claim: >-
    (A) WHAT IS LOAD-BEARING, AND WHAT PART OF IT IS ALREADY COMMITTED. CORRECTED ON RED-TEAM
    REVIEW. EV-MLKEM-020 records, as a reproduced observation under lattice-estimator commit
    3e48ef421ec256afddb3e7d2249a77eab6e9ba12, that primal_bdd / RC.MATZOV costs
    140.1994731076207 / 200.9587149140538 / 270.7236234535225 bits at the three FIPS 203
    parameter sets against NIST classical cutoffs 143 / 207 / 272, i.e. undercuts of
    +2.800527 / +6.041285 / +1.276377 bits; and that the effective sieve dimensions are
    bkz 353.197381 / 557.152930 / 792.144373 and svp 385.084530 / 590.132012 / 825.235330, with
    the validator confirming programmatically that "RC.MATZOV genuinely executes the d4f path".
    The word EFFECTIVE is the point: those dimensions are already net of a dimensions-for-free
    (d4f) subtraction. The core-SVP charge is 2^(0.292 * effective dimension), so a shift of D
    dimensions in the d4f rule moves the reported cost by 0.292*D bits. Inverting the committed
    margins gives the exact size of the d4f error that would erase each undercut: 9.59
    dimensions for ML-KEM-512, 20.69 for ML-KEM-768, 4.37 for ML-KEM-1024 (arithmetic on
    committed numbers, not a measurement).
    WHAT THE FILED VERSION OF THIS RECORD GOT WRONG: it asserted that no record in this
    repository measures, models or tracks the d4f count. That is false of GOAL-MLKEM-003
    BATCH-011, whose committed results.json (task TASK-20260803-fb52f4) holds
    axis_B_dimensions_for_free with d4f_at_stage1_beta = 35.67737953719783 / 47.85832227236001 /
    61.098712419599856 and d4f_worth_bits = 7.99837454400668 / 10.30550794877945 /
    12.991238337845346, produced by a run whose source (dual_gap_decomposition.py, the AXIS B
    block, the call RC.MATZOV.d4f(stage1_matzov beta)) evaluates the PINNED ESTIMATOR'S OWN d4f
    function; and EV-MLKEM-021 carries this as numbered hypothesis H12 ("Dimensions-for-free is
    applied by both sides and cancels", validation_status "validated_this_batch for MAGNITUDE
    (7.9984 / 10.3055 / 12.9912 bits)", checked by producer AXIS B, validator M21, red team
    OBJ-10). The d4f MAGNITUDE is therefore committed evidence in this program, and the leg of
    this record that proposed to establish it is withdrawn. WHAT REMAINS UNMEASURED, and is the
    whole of the residual claim, is f_meas: the ACHIEVABLE free-dimension count, i.e. how many
    dimensions a real sieve pool can actually give up and still return a short enough vector.
    No record in this repository holds a value, a bound, or a null floor for that.
    (A2) WHICH LAW THE ESTIMATOR CHARGES, NOW ESTABLISHED RATHER THAN ASSUMED. The BATCH-011
    values are reproduced to the digits shown by beta*ln(4/3)/ln(beta/(2*pi*e)) evaluated at the
    dual-attack stage-1 blocksizes 387 / 589 / 823 recorded in EV-MLKEM-021 H12 (387 -> 35.6774,
    589 -> 47.8583, 823 -> 61.0987; recomputed by hand during this repair and agreeing with the
    committed values to the precision of that hand computation, ~7 significant figures). The
    pinned estimator therefore implements the DUCAS CLOSED FORM, not the g6k linear fit. Any
    residual that bears on the committed bit counts is a residual against the Ducas law. The g6k
    linear rule is an IMPLEMENTATION DEFAULT, not the estimator's charge, and the filed version
    of this record conflated the two.
    (B) THE TWO LAWS DISAGREE AT THE ACTUAL PRIMAL-BDD BLOCKSIZES, AND THE GAP EXCEEDS THE
    COMMITTED MARGIN AT EXACTLY ONE PARAMETER SET. ARITHMETIC DERIVATION PERFORMED BY HAND
    DURING THIS REPAIR ON 2026-08-24 FROM COMMITTED NUMBERS; IT IS NOT A RUN, NO RUN RECORD
    BACKS IT, AND STAGE 0 MUST REPRODUCE IT PROGRAMMATICALLY BEFORE IT IS CITED AS A RESULT.
    Inverting beta - beta*ln(4/3)/ln(beta/(2*pi*e)) against EV-MLKEM-020's committed effective
    dimensions recovers the nominal blocksizes: beta_bkz = 389 / 606 / 855 (giving 353.1975 /
    557.1529 / 792.1449 against the committed 353.197381 / 557.152930 / 792.144373) and
    eta_svp = 423 / 641 / 890 (giving 385.0846 / 590.1320 / 825.2359 against the committed
    385.084530 / 590.132012 / 825.235330). At those blocksizes the unclamped g6k linear law
    11.5 + 0.075*beta and the Ducas law differ by:
    beta = 389: 40.675 vs 35.803 = 4.87 dimensions = 1.42 bits;
    beta = 606: 56.950 vs 48.847 = 8.10 dimensions = 2.37 bits;
    beta = 855: 75.625 vs 62.855 = 12.77 dimensions = 3.73 bits;
    eta = 423: 43.225 vs 37.915 = 5.31 dimensions = 1.55 bits;
    eta = 641: 59.575 vs 50.868 = 8.71 dimensions = 2.54 bits;
    eta = 890: 78.250 vs 64.764 = 13.49 dimensions = 3.94 bits.
    HONEST COMPARISON AGAINST THE COMMITTED MARGINS, WHICH THE FILED VERSION OVERSTATED: the
    convention gap is 1.42-1.55 bits against ML-KEM-512's 2.800527-bit margin (51-55% of it),
    2.37-2.54 bits against ML-KEM-768's 6.041285 (39-42%), and 3.73-3.94 bits against
    ML-KEM-1024's 1.276377 (292-308% of it). SO THE CHOICE BETWEEN THE TWO CONVENTIONS EXCEEDS
    THE MARGIN AT ML-KEM-1024 ONLY, and is a large minority of it at the other two. The blanket
    statement that it is "larger than the margin the lane is arguing about" is withdrawn.
    (B2) THE g6k LAW IS CLAMPED, AND THE CLAMP BINDS OVER HALF THE FILED MEASUREMENT WINDOW.
    ADDED ON RED-TEAM REVIEW. g6k does not apply default_dim4free_fun directly. The tours apply
    dim4free_wrapper, read verbatim from g6k/algorithms/bkz.py at master on 2026-08-24:
    `def dim4free_wrapper(dim4free_fun, blocksize): if blocksize < 40: return 0; dim4free =
    dim4free_fun(blocksize); return int(min((blocksize - 40)/2, dim4free))`, and
    naive_bkz_tour, pump_n_jump_bkz_tour and slide_tour all call it. The clamp (beta-40)/2 is
    below the linear law exactly when 0.5*beta - 20 < 11.5 + 0.075*beta, i.e. for beta <
    31.5/0.425 = 74.1176. Over the FILED window {55, 60, 65, 70, 75, 80, 85, 90} the value g6k
    actually applies is 7 / 10 / 12 / 15 / 17 / 17 / 17 / 18, whereas the unclamped linear law
    gives 15 / 16 / 16 / 16 / 17 / 17 / 17 / 18 and the Ducas law gives 13.53 / 13.74 / 13.99 /
    14.28 / 14.58 / 14.90 / 15.24 / 15.58. At beta = 55, 60, 65, 70 the function in force is the
    clamp, not the law, so a residual taken there against 11.5 + 0.075*beta is a residual
    against a function the cited implementation does not apply. The clamp does not bind at
    ML-KEM blocksizes (389-890 >> 74.1), so part (B) is unaffected; the defect was confined to
    the measurement window and is repaired in part (C).
    (C) THE CLAIM PROPER, FALSIFIABLE, WITH THE WINDOW SPLIT. At blocksizes beta on
    ML-KEM-shaped q-ary bases (q = 3329), the MEASURED achievable free-dimension count
    f_meas(beta) - the largest f such that a sieve run in the projected sublattice of dimension
    beta - f, followed by Babai lifting of every pool vector back to the full block, still
    returns a vector of norm at most the target - departs from the Ducas law
    beta*ln(4/3)/ln(beta/(2*pi*e)) by at least 1.5 dimensions on the CLAMP-FREE window
    beta in {75, 80, 85, 90}, with a sign stable across seeds. The sign is the deliverable:
    positive means the estimator charges too much and the committed 140.2 / 201.0 / 270.7
    figures are OVERSTATED; negative means they are UNDERSTATED. On the CLAMPED window
    beta in {55, 60, 65, 70} the same measurement is reported against BOTH the clamped value
    int(min((beta-40)/2, int(11.5+0.075*beta))) and the two unclamped laws, as three separate
    signed residuals, and NO statement about which law the estimator should use is drawn from
    those four cells. The two published laws are separated by 2.10 dimensions at beta = 55 and
    2.67 at beta = 90 (unclamped linear minus Ducas), both above the 1.5-dimension resolution
    the design claims, so the LEVEL of f_meas discriminates the two laws inside the reachable
    window; the SLOPE does not, and part (C) no longer claims it does - see the prediction list.
    (D) WHAT IS NOT CLAIMED. No attack, no break, no exponent moved, no statement about FIPS 203
    security. Measurements at beta <= 90 are toy scale and say nothing about beta ~ 389-890
    except through numbered heuristic H1, whose whole content is that the extrapolation is an
    assumption. A measurement that agrees with a law inside error is a real and reportable
    outcome that closes nothing. Nothing here is offered as a correction to EV-MLKEM-020,
    EV-MLKEM-021 or BATCH-011; AGENTS.md rule 12 is UNMET and inherited.
  mechanism: >-
    STAGE 0 - CITE, DO NOT REDISCOVER; THEN FREEZE. RESTATED ON RED-TEAM REVIEW. The filed
    version made Stage 0 "read the pinned estimator's d4f implementation". That is already done
    and committed: cite GOAL-MLKEM-003 BATCH-011 task TASK-20260803-fb52f4 results.json
    (axis_B_dimensions_for_free) and EV-MLKEM-021 hypothesis H12 for the d4f MAGNITUDE
    (7.9984 / 10.3055 / 12.9912 bits at the dual stage-1 blocksizes 387 / 589 / 823), and cite
    the same run's source for the fact that the estimator's own d4f function is the one
    evaluated. Stage 0's remaining, genuinely open jobs are three and all are zero-compute:
    (0a) reproduce PROGRAMMATICALLY the part-(B) inversion - that beta_bkz = 389 / 606 / 855 and
    eta_svp = 423 / 641 / 890 return EV-MLKEM-020's committed effective dimensions under the
    Ducas law - and record any disagreement with the hand derivation as a defect of this record;
    (0b) freeze the g6k clamp: record dim4free_wrapper's min((beta-40)/2, .) rule, the crossover
    beta* = 31.5/0.425 = 74.1176, and the applied-value table 7/10/12/15/17/17/17/18 over the
    measurement window, so that no residual is ever taken against a function that is not in
    force at that cell; (0c) declare the success radius tau and the three residual targets
    (clamped g6k value, unclamped g6k law, Ducas law) before any data exists.
    STAGE 1 - INSTRUMENT. Rebuild the GOAL-MLKEM-004 instrument per KN-TECH-14efa5
    (passagemath-standard 10.8.7 + fpylll 0.6.4 + g6k 0.1.2) and record the rebuild in the
    receipt. That goal's committed instrument block reports g6k bgj1 at dimension 70, q = 3329,
    producing a database of 75511 vectors in 335.2 s, and gauss_sieve at dimension 50 producing
    4075 vectors in 0.94 s, so the achievable dimension range is known from committed execution
    rather than guessed.
    STAGE 2 - THE TRACKED OBJECT. For each blocksize beta and each seed, build a q-ary basis,
    BKZ-preprocess it, then for lift depth f = 0, 1, 2, ... run the sieve in the projected
    sublattice of dimension beta - f, and for every vector v in the resulting pool compute the
    Babai lift of v back to the full beta-block and record the resulting norm. Retain ONLY
    m(f) = min over the pool of the lifted norm. The curve f -> m(f) is the object. f_meas(beta)
    is the largest f with m(f) <= tau * gh(beta), for the tau declared in Stage 0 and never
    revised. NOTE that the sweep sets f EXPLICITLY, so g6k's own dim4free choice does not enter
    the measurement; the clamp of part (B2) affects only which law the residual is taken against.
    STAGE 3 - THE COMPARISON, LEVEL FIRST AND SLOPE SECOND. On the clamp-free window
    beta in {75, 80, 85, 90} report (i) the signed residual of f_meas against the Ducas law
    (the estimator's charge) and (ii) against the unclamped linear law, with intervals over
    seeds. On the clamped window beta in {55, 60, 65, 70} report those two residuals AND (iii)
    the residual against the clamped applied value, all three separately labelled. Then report
    (iv) whether residuals (i) and (ii) have opposite signs, which is the case that says the
    truth lies between the conventions, and (v) the extrapolated gap at beta_bkz = 389/606/855
    and eta_svp = 423/641/890 under H1, stated as an extrapolation and never as a measurement.
    THE SLOPE TEST IS DEMOTED AND THE REASON IS ARITHMETIC: over 55-90 the Ducas law's own slope
    is (15.579 - 13.530)/35 = 0.0586 while the linear law's is 0.0750, a separation of 0.0164,
    so distinguishing the two by slope needs a fitted-slope resolution better than about 0.008
    over a 35-blocksize baseline with per-cell noise of order 1 dimension. That is marginal and
    the design does not rest on it; the LEVEL separation (2.10 dimensions at beta = 55, 2.67 at
    beta = 90) is what carries the discrimination.
    STAGE 4 - WHY THIS DISCRIMINATES. Two explanations of the d4f discount are live and both are
    represented by a law in current use. Explanation 1: d4f is set by the sub-exponential
    asymptotic n/log n (Ducas), which is what the pinned estimator charges, and the g6k linear
    fit over-credits at large beta. Explanation 2: d4f is genuinely near-linear in the
    computable range and the asymptotic constant is not yet operative, so the estimator
    UNDER-credits the attacker and the committed bit counts are overstated. The two predict
    f_meas levels 2.1-2.7 dimensions apart inside the reachable window, in opposite directions
    from each other, and the measurement reads which one it sits on. A third outcome - f_meas
    below BOTH laws - is pre-declared as its own branch, meaning the discount is over-credited
    by every convention in use and every committed bit count in this lane is understated. A
    fourth - f_meas between them, with intervals overlapping both - is also pre-declared and
    means the reachable window cannot separate the conventions, which is a reportable negative.
