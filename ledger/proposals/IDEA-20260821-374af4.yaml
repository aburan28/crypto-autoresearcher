      08eda1, f7c912) and none concerns d4f; `grep -rn "question_id: RQ-MLKEM" ledger/proposals/`
      -> 21 distinct RQ-MLKEM-003 proposals, whose full title list was read in this session.
      Read in full: ledger/questions/RQ-MLKEM-003.yaml, ledger/goals/GOAL-MLKEM-004.yaml,
      ledger/proposals/IDEA-20260807-8fbc86.yaml (lines 1-120),
      knowledge/literature/KN-LIT-105.md, knowledge/techniques/KN-TECH-1a5b7e.md,
      docs/inventor-protocol.md, docs/target-result-profile.md; read selectively
      ledger/evidence/EV-MLKEM-020.yaml lines 100-169 and 466-505.
      WEB (all fetched this session, 2026-08-21): WebSearch 'lattice sieving "dimensions for
      free" measured discount g6k blocksize 2025' (9 links returned); WebFetch
      https://raw.githubusercontent.com/fplll/g6k/master/g6k/algorithms/bkz.py -> returned the
      verbatim `default_dim4free_fun` body quoted in the claim; WebFetch
