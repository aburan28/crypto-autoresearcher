      and that is why the clamp-free window is only four cells wide.
  - The success radius tau is declared before any data exists and never revised; a tau chosen
    after seeing m(f) would set f_meas to whatever is wanted.
  - The measurement sets the lift depth f explicitly, so g6k's dim4free_wrapper does not enter
    the measured quantity; it enters only the choice of which law a residual is taken against.
  proof_search_map:
    bottleneck: >-
      Not a proof. The bottleneck in the COST CHAIN, which is what this record targets, is the
      map beta -> effective sieve dimension. Everything downstream (the 0.292 exponent, the
      memory charge, the category comparison) is applied to that number. BATCH-011 established
      what that map's FORMULA is worth; what is unestablished is whether a real pool achieves it.
    baseline_embedding:
      parameter_slice: >-
        f = 0 reproduces the no-d4f baseline exactly: the sieve runs at full blocksize and m(0)
        is the pool minimum. This is the exact old-method boundary, and BATCH-011's `_NoD4F`
        counterfactual is its committed arithmetic analogue.
      reproduction_check: >-
        Bitwise: m(0) must equal min over pool of ||v|| computed by an independent code path.
        A frozen fixture at beta = 60, one seed, is stored and re-checked on every rebuild.
        Additionally, Stage 0a must reproduce BATCH-011's three d4f values from the Ducas
        expression at betas 387 / 589 / 823 before the part-(B) inversion is trusted.
    observation_collision:
      observable: f_meas(beta), a single integer per (beta, seed).
      distinct_preimage_search: >-
        COLLISION FOUND AND IT IS THE POINT OF NULL-A: a non-sieve pool with matched cardinality
        and matched norm multiset is a distinct preimage that may yield the same f_meas. The
        design does not assume it does not; it measures it. If the collision is real, f_meas
        does not identify "sieving" and the interpretation is restricted to "pool of this size
        and norm profile", which is stated as the scope in that branch. A SECOND COLLISION,
        ADDED ON REVIEW: at beta in {55, 60, 65, 70} the clamped applied value and the Ducas law
        are numerically close (7/10/12/15 versus 13.53/13.74/13.99/14.28 - close at beta = 70,
        far at beta = 55), so a residual quoted without naming its target is ambiguous by up to
        7 dimensions. Every residual carries its target's name or it is not reportable.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Replace the CHARGED d4f convention by the MEASURED threshold f_meas, moving the estimator
        input from a formula to an observed quantity with an error bar.
      predicted_gain: >-
        A signed correction of size 0.292 * (f_meas - f_law) bits per parameter set, with the
        sign unknown before the run. Committed margins are 2.80 / 6.04 / 1.28 bits, so a
        correction of 5-14 dimensions is decision-relevant at ML-KEM-1024 and is a large minority
        of the margin at the other two sets.
    quantifier_order: >-
      FOR ALL beta in {75, 80, 85, 90} (the clamp-free window) and FOR ALL seeds in the declared
      set, THERE EXISTS a lift depth f_meas(beta, seed) such that m(f) <= tau*gh(beta) for all
      f <= f_meas and m(f) > tau*gh(beta) for f = f_meas + 1. The claim is then about the
      seed-averaged f_meas and its residual against the Ducas law. NOTE THE ORDER CAREFULLY:
      nothing is claimed uniformly in beta beyond the measured window, H1 is the only bridge to
      beta ~ 389-890, and the four clamped cells {55, 60, 65, 70} are quantified separately and
      contribute no statement about which law the estimator should charge.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At blocksizes 75-90, on ML-KEM-shaped q-ary bases with q = 3329 and this sieve, the
        achievable free-dimension count is F(beta) +/- e, and its signed residual against the
        Ducas law charged by the pinned estimator is r +/- e." Nothing about FIPS 203 blocksizes,
        nothing about other lattice families, nothing about other sieves, and nothing about which
        law is right outside 75-90.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion fails is a lattice with an unusually
        flat Gram-Schmidt profile (e.g. a random unimodular-transformed cube), where lifting
        succeeds far deeper because there is no q-ary shape to fight. Running the same
        measurement there must give a materially different f_meas; if it gives the same one, the
        instrument is reading a property of the lifting code and not of the lattice.
    proof_obligations:
    - claim: m(0) equals the pool minimum bitwise.
      responsibility: baseline
    - claim: m(f) is non-decreasing in f up to noise.
      responsibility: correctness
    - claim: The pool-cardinality-forced component of f_meas is computed and subtracted.
      responsibility: strictness
    - claim: Every residual names its target law, and the clamped window's residuals are reported
        against all three targets.
      responsibility: interface
    - claim: NULL-A is drawn at least 8 times and reported as an interval.
      responsibility: success_probability
    - claim: Stage 0a reproduces BATCH-011's committed d4f values and the part-(B) inversion
        programmatically before either is cited.
      responsibility: baseline
    - claim: No statement is made about beta > 90 except through H1.
      responsibility: scope
    not_applicable_reason: null
