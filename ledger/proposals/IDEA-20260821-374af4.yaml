idea:
  id: IDEA-20260821-374af4
  question_id: RQ-MLKEM-003
  added: '2026-08-21'
  title: >-
    The dimensions-for-free discount is the one input to ML-KEM's committed bit counts that is
    a curve fitted at blocksize 60-90 and then evaluated at blocksize 400-900, and the two
    published laws for it disagree by more dimensions than the entire margin of ML-KEM-1024:
    track the MINIMUM LIFTED NORM AS A FUNCTION OF LIFT DEPTH over the sieve pool, measure the
    achievable free-dimension count directly at blocksizes the instrument can reach, and report
    which law the measurement follows and in which direction the estimator errs
  class: measurement
  claim: >-
    (A) WHAT IS LOAD-BEARING AND UNMEASURED. EV-MLKEM-020 records, as a reproduced observation
    under lattice-estimator commit 3e48ef421ec256afddb3e7d2249a77eab6e9ba12, that primal_bdd /
    RC.MATZOV costs 140.1994731076207 / 200.9587149140538 / 270.7236234535225 bits at the three
    FIPS 203 parameter sets against NIST classical cutoffs 143 / 207 / 272, i.e. undercuts of
    +2.800527 / +6.041285 / +1.276377 bits; and that the effective sieve dimensions are
    bkz 353.197381 / 557.152930 / 792.144373 and svp 385.084530 / 590.132012 / 825.235330,
    with the validator confirming programmatically that "RC.MATZOV genuinely executes the d4f
    path". The word EFFECTIVE is the whole point: those dimensions are already net of a
    dimensions-for-free (d4f) subtraction. The core-SVP charge is 2^(0.292 * effective
    dimension), so under that same convention a shift of D dimensions in the d4f rule moves the
    reported cost by 0.292*D bits. Inverting the committed margins gives the exact size of the
    d4f error that would erase each undercut: 9.59 dimensions for ML-KEM-512, 20.69 for
    ML-KEM-768, and 4.37 for ML-KEM-1024 (arithmetic derivation from the committed numbers, not
    a measurement).
    (B) THE TWO PUBLISHED LAWS DISAGREE BY MORE THAN THAT AT ML-KEM BLOCKSIZES. Two d4f rules
    are in circulation. The g6k implementation default, read verbatim from
    g6k/algorithms/bkz.py at master, is `def default_dim4free_fun(blocksize): return
    int(11.5 + 0.075*blocksize)`, with the docstring "Return expected number of dimensions for
    free, from exact-SVP experiments" - a two-parameter linear fit to experiments in the
    blocksize range where exact SVP is checkable, i.e. tens, not hundreds. The asymptotic law
    of KN-LIT-105 (Ducas, ePrint 2017/999) is d = Theta(n / log n), concretely
    n*ln(4/3)/ln(n/(2*pi*e)) in the form this program has recorded. These two are not the same
    function and they diverge. ILLUSTRATIVE DERIVATION, NOT A MEASUREMENT, at two stated
    hypothetical blocksizes chosen only to show the scale (the actual blocksizes must be read
    from the pinned estimator run, not from this record): at beta = 421 the linear law gives
    43.075 free dimensions and the asymptotic law 37.79, a gap of 5.28 dimensions = 1.54
    core-SVP bits; at beta = 875 the linear law gives 77.125 and the asymptotic law 63.95, a gap
    of 13.17 dimensions = 3.85 bits. ML-KEM-1024's committed undercut is 1.276377 bits. THE
    CHOICE BETWEEN TWO PUBLISHED CONVENTIONS FOR ONE UNMEASURED QUANTITY IS THEREFORE LARGER
    THAN THE MARGIN THE LANE IS ARGUING ABOUT, AND THE PROGRAM HAS NEVER MEASURED IT.
    (C) THE CLAIM PROPER, FALSIFIABLE. At blocksizes beta in [55, 90] on ML-KEM-shaped q-ary
    bases (q = 3329), the MEASURED achievable free-dimension count f_meas(beta) - the largest f
    such that a sieve run in the projected sublattice of dimension beta - f, followed by Babai
    lifting of every pool vector back to the full block, still returns a vector of norm at most
    the target - departs from at least one of the two published laws by at least 1.5 dimensions,
    with a sign that is stable across seeds. Which law it follows, and the SIGN of the residual,
    is the deliverable. Positive residual against the estimator's law means the estimator is
    charging too much and the committed 140.2 / 201.0 / 270.7 figures are OVERSTATED; negative
    means they are UNDERSTATED. Both are results and the design cannot avoid producing one.
    (D) WHAT IS NOT CLAIMED. No attack, no break, no exponent moved, no statement about FIPS 203
    security. Measurements at beta <= 90 are toy scale and say nothing about beta ~ 400-900
    except through numbered heuristic H1 below, whose whole content is that the extrapolation is
    an assumption. A measurement that agrees with both laws inside error is a real and reportable
    outcome that closes nothing.
  mechanism: >-
    STAGE 0 - ARITHMETIC, NO COMPUTE, DONE FIRST AND FROZEN. Read from the pinned
    lattice-estimator the exact (beta, eta, d4f) triple it uses for each FIPS 203 set, so the
    illustrative blocksizes in the claim are replaced by the real ones. Tabulate both published
    d4f laws at those blocksizes and record the signed gap in dimensions and, at 0.292 bits per
    dimension, in bits. This alone is under an hour and is a complete deliverable if the sieve
    legs cannot be run.
    STAGE 1 - INSTRUMENT. Rebuild the GOAL-MLKEM-004 instrument per KN-TECH-14efa5
    (passagemath-standard 10.8.7 + fpylll 0.6.4 + g6k 0.1.2) and record the rebuild in the
    receipt. That goal's committed instrument block already reports g6k bgj1 at dimension 70,
    q = 3329, producing a database of 75511 vectors in 335.2 s, and gauss_sieve at dimension 50
    producing 4075 vectors in 0.94 s, so the achievable dimension range is known from committed
    execution rather than guessed.
    STAGE 2 - THE TRACKED OBJECT. For each blocksize beta and each seed, build a q-ary basis,
    BKZ-preprocess it, then for lift depth f = 0, 1, 2, ... run the sieve in the projected
    sublattice of dimension beta - f, and for every vector v in the resulting pool compute the
    Babai lift of v back to the full beta-block and record the resulting norm. Retain ONLY
    m(f) = min over the pool of the lifted norm. The curve f -> m(f) is the object. f_meas(beta)
    is the largest f with m(f) <= tau * gh(beta), for a success radius tau declared in Stage 0
    and never revised.
    STAGE 3 - THE COMPARISON. Fit f_meas(beta) over the measured range and report (i) the signed
    residual against 11.5 + 0.075*beta, (ii) the signed residual against
    beta*ln(4/3)/ln(beta/(2*pi*e)), (iii) whether the two residuals have opposite signs, which
    is the case that says the truth lies between the conventions, and (iv) the extrapolated gap
    at the estimator's actual blocksizes under H1, stated as an extrapolation.
    STAGE 4 - WHY THIS DISCRIMINATES. Two explanations of the d4f discount are live in the
    literature and both are represented by a law in current use. Explanation 1: d4f is set by the
    sub-exponential asymptotic n/log n and the linear fit is a local approximation that
    over-credits at large beta. Explanation 2: d4f is genuinely near-linear in the computable
    range and the asymptotic constant is not yet operative. The two make OPPOSITE predictions
    about the sign of d(f_meas)/d(beta) minus 0.075 in the measured window, and the measurement
    reads that sign directly. A third outcome - f_meas below BOTH laws - is possible and is
    pre-declared as its own branch, meaning the discount is over-credited by every convention in
    use and every committed bit count in this lane is understated.
  novelty_status: unverified
  novelty_screen:
