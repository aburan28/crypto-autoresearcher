      first Gram-Schmidt norm, not the number of dimensions a sieve can skip);
      IDEA-20260807-8fbc86, which fits (c_T, c_M) from wall-time and peak database size and
      whose own confounder list warns that "g6k's database size is not the same quantity as the
      asymptotic memory in c_M" - it measures the COST of a sieve call, not the DIMENSION at
