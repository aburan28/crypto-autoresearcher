idea:
  id: IDEA-20260906-09b937
  title: >-
    Quadratic-order residue representation of x-coordinates: the factor base of
    points whose x has a small-norm lift in O_K modulo a split prime is an
    implicit-membership base (KN-OPEN-020 class 2) with O(log p) membership by
    Gauss reduction, predicted to be a reparametrisation of the one-dimensional
    integer window at equal box volume -- the Coppersmith reach sees only the
    product of bounds, and the null is measured on the existing small-root harness
  class: control
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-623a32
  goal_id: GOAL-ECDLP-001
  added: '2026-09-06'
  proposed_at: '2026-09-06'
  proposed_by: idea-generator
  claim: >-
    REPRESENTATION CLASS R1 (field representation of a coordinate: quadratic-order
    residue). ATTACK STAGES whose charged cost is claimed to change: factor-base
    membership (from an integer comparison to a two-dimensional lattice reduction,
    both O(log p)) and relation decomposition (a small-root solve with 2m integer
    unknowns of size T^(1/2) instead of m unknowns of size T). NON-GENERIC
    OPERATION made cheap: deciding membership of a point in a base cut by a
    two-dimensional norm ball, via Gauss-Lagrange reduction of the rank-2 lattice
    coset x + p_K in O_K, which reads the coordinate and is not available to a
    black-box group encoding.
    (A) THE REPRESENTATION. Let K = Q(sqrt(-D)) with ring of integers O_K, and p a
    prime that splits in K, p O_K = p_K p_K-bar, so F_p = O_K / p_K. Every x in F_p
    is a coset x + p_K of the rank-2 lattice p_K (covolume p in the natural
    embedding). Let alpha(x) be a shortest vector of that coset (Gauss-Lagrange
    reduction, O(log p) operations) and N(alpha(x)) its norm. The factor base is
      F_T = { P in G : N(alpha(x(P))) <= T },
    of size about c_K T with c_K = 2 pi / sqrt(|disc K|) for T below about p,
    the same order as the one-dimensional window W_T = { P : x(P) < T } for the
    same T. Membership is an implicit description in the sense of KN-OPEN-020
    (a union of about c_K T residue classes with no bounded-degree polynomial
    predicate), and the record charges it: description O(1), membership O(log p),
    relation search as below, descent not needed at m fixed, memory |F_T|.
    (B) THE DECOMPOSITION SYSTEM. With x_i = alpha_i mod p_K and alpha_i = a_i +
    b_i omega, |a_i|, |b_i| <= T^(1/2), the summation relation S_{m+1}(x_1, ...,
    x_m, x_R) = 0 in F_p becomes S_{m+1}(a_1 + b_1 omega, ..., x_R) = 0 in
    O_K / p_K, a polynomial congruence in 2m small integer unknowns. A
    Coppersmith / Jochemsz-May small-root solve applies with the bound product
    prod_i (T^(1/2))^2 = T^m, identical to the one-dimensional product T^m, and
    with twice the number of variables at the same total degree.
    (C) THE PRE-REGISTERED PREDICTION (controlled null). The measured small-root
    reach eps-hat (planted-root recovery rate as in the E1-01 harness) at matched
    |F| satisfies eps-hat(2D) <= eps-hat(1D), with equality within the
    replication spread; the decomposition-yield conservation of KN-FIND-007 fixes
    the mean yield at C(|F| + m - 1, m) / N for both bases exactly, so no yield
    claim exists to test. The alternative that would make the representation
    matter: eps-hat(2D) > eps-hat(1D) at matched |F| on three field sizes,
    invariant under the PGL_2 battery and absent from the matched random subset
    of the same size -- in which case the representation changed the solve stage
    and the E1-01 threshold table must be recomputed for the two-dimensional box.
    (D) WHAT IS NOT CLAIMED. No CM structure is used on the target curve; the
    ring O_K is a bookkeeping device for F_p and acts on nothing. The CM small-norm
    lens dropped in IDEA-20260806-c5d183's residue (membership untestable without
    the answer) is a different object: there the small-norm condition was on the
    endomorphism image, here it is on the coordinate and membership is testable.
  mechanism: >-
    THE PAIR. Representation: x(P) written as its shortest O_K-lift alpha(x(P))
    in the coset x(P) + p_K. Operation set Sigma: translation by factor-base
    elements only, the partial action of index calculus (IDEA-20260806-c5d183
    Class I); NOT the full translation action. Trichotomy: Class I,
    partial-action, one-line reason: the tracked object is the relation vector of
    a target over F_T and it propagates deterministically exactly under adding a
    factor-base element, which is F2 used as a component and named as such.
    LOSSY-PROJECTION TEST AGAINST SIGMA. The projection is P -> (relation vector
    of P over F_T, or 'undecomposable'); it discards everything about P but its
    decomposition, is defined only on the decomposable subset (the branching event
    the (L, b) meter prices), and its fibre partition is a block system of
    <Sigma> = the sumset semigroup of F_T by construction, exactly as for every
    index-calculus base. It is lossy in the representation used because |F_T|^m
    << N. Nothing here differs from F2 at the level of the object; what the
    record tests is whether the REPRESENTATION of the base (two-dimensional
    smallness) changes the solve cost at fixed |F|, which KN-FIND-007 leaves open
    and the corpus's windowed lanes have only measured for one-dimensional windows.
    WHY THE PREDICTION IS A NULL AND WHY IT IS STILL WORTH ONE RUN. Coppersmith-type
    reach conditions depend on the product of the bounds and degrade with the
    number of variables at fixed degree; a two-dimensional box of the same volume
    has the same product and twice the variables, so the derivation predicts no
    gain and a possible loss. The run is worth doing because (i) the coordinator's
    object list names the quadratic-order R1 representation and no record has
    measured it, (ii) it is an hour on an existing harness, and (iii) it converts
    'two-dimensional smallness' from an unexamined idea into a measured ratio
    with a mechanism, which is the section 4 closure standard.
    STAGE 0 (zero compute). Fix K (say D = 3 and D = 7 so both a class-number-one
    ring and a generic one appear), verify p splits, write alpha(x) and the
    expansion of S_{m+1}(a_i + b_i omega, ..., x_R) over Z[omega]/p_K, and state
    the Jochemsz-May shape and its reach bound for 2m variables versus m.
    STAGE 1 (minutes, gate). Count |F_T| and |W_T| at matched T on three curves
    per size and confirm |F_T| / |W_T| is c_K within 10 percent; report the
    KN-FIND-007 conservation mean as a calibration (must match exactly).
    STAGE 2 (an hour). On the E1-01 planted-root harness at m = 3 and m = 4,
    measure eps-hat for the one-dimensional window, the two-dimensional norm ball
    at matched |F|, and a matched random subset of F_p of the same size (which
    has no smallness structure and must fail), over three field sizes.
    STAGE 3. Controls below; decay check on the size ladder.
  novelty_status: unverified
  citations:
    - ref: knowledge/open-problems/KN-OPEN-020.md
      provenance: internal
      claim: >-
        The bounded-degree algebraic factor base is scoped out; the open classes
        are high-degree, implicit-membership and target-dependent descriptions,
        each to be charged for description, membership, relation, descent, time
        and memory. This record's base is implicit-membership and charges them.
      verified_by: TASK-20260906-f71aaa direct read 2026-09-06
    - ref: knowledge/findings/KN-FIND-007.md
      provenance: internal
      claim: >-
        Mean per-target decomposition yield is C(B + m - 1, m) / N for every base
        of size B; only coverage, rank, recognisability and solve cost are worth
        measuring. This record measures solve cost (reach) and claims no yield.
      verified_by: TASK-20260906-f71aaa direct read 2026-09-06
    - ref: ledger/proposals/IDEA-20260806-c5d183.yaml
      provenance: internal
      claim: >-
        Class I placement of index calculus and the residue note that the CM
        small-norm lens has membership untestable without the answer; this
        record's smallness is on the coordinate, with testable membership.
      verified_by: TASK-20260906-f71aaa direct read 2026-09-06
    - ref: ledger/proposals/IDEA-20260808-2e14f7.yaml
      provenance: internal
      claim: >-
        The windowed factor base with the E1-01 small-root reach eps-hat as the
        solve-stage metric, measured by planted-root recovery at matched |V|.
        This record reuses that metric and harness with a different window shape.
      verified_by: TASK-20260906-f71aaa direct read 2026-09-06
    - ref: >-
        D. Coppersmith, 'Small solutions to polynomial equations, and low exponent
        RSA vulnerabilities', J. Cryptology 1997; E. Jochemsz and A. May, 'A strategy
        for finding roots of multivariate polynomials with new applications in
        attacking RSA variants', ASIACRYPT 2006
      provenance: recalled
      claim: >-
        Multivariate small-root conditions depend on the product of the bounds and
        worsen with the number of variables at fixed degree. Recalled; the exact
        exponent for the 2m-variable shape must be derived in Stage 0, not quoted.
      verified_by: null
  assumptions:
    - >-
      Off-limits component used and named: F2 (factor-base decomposition)
      supplies the object; what is added is the two-dimensional representation of
      smallness and its measured effect on the solve stage.
    - >-
      p splits in K; K is fixed before any curve is chosen; the target curve has
      no CM by O_K (a CM curve is admitted only as a labelled structured control).
    - The E1-01 harness and its eps-hat definition are frozen and reused unchanged; a harness change voids the comparison.
    - Toy scale, p up to about 32 bits; claim_tier toy.
    - No external literature was opened this session; novelty is unverified and the recalled small-root references are pointers.
  proof_search_map:
    bottleneck: >-
      The dependence of the small-root reach on the number of variables at fixed
      bound product. If reach depended only on the product, the two representations
      would tie exactly; if it degrades with variable count, the two-dimensional
      box loses; only a reach that IMPROVES with the O_K structure would make the
      representation a lever, and no mechanism for that is known to this session.
    baseline_embedding:
      parameter_slice: >-
        The one-dimensional window x(P) < T, which is the E1-01 baseline; the
        two-dimensional construction with b_i forced to 0 and T^(1/2) replaced by
        T reproduces it exactly as a special case of the same solver call.
      reproduction_check: >-
        Run the harness with b_i = 0 and confirm eps-hat equals the recorded
        E1-01 value for the same curve, m and T within the replication spread.
    observation_collision:
      observable: The measured reach eps-hat at matched |F|, m, and field size, with its bootstrap interval.
      distinct_preimage_search: >-
        Expected and required: the one-dimensional window and the matched random
        subset already differ on this observable (E1-01's own control), so it
        discriminates; the two-dimensional ball and the one-dimensional window are
        predicted to COLLIDE on it, and that collision is the closure.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace 'small x-coordinate' by 'small O_K-lift of x'; encoding exact,
          completeness exact (every x has a shortest lift), soundness spent in the
          solver's variable count, cost loss the 2m-versus-m shape.
        predicted_gain: Zero, derived from the bound product; the run measures the sign of the residual.
    quantifier_order: >-
      FOR the declared K, the declared curves and sizes, m in {3, 4}, and the
      frozen harness, FOR ALL matched |F|: eps-hat(2D) <= eps-hat(1D) within the
      spread. NOT claimed: any statement for all quadratic orders, all solvers,
      or cryptographic p.
    method_ceiling:
      strongest_certifiable_claim: >-
        'At matched factor-base size the two-dimensional norm-ball base has
        small-root reach [equal to / below / above] the one-dimensional window on
        the declared toy curves.' It can never certify anything about yield
        (conserved), about linear algebra, or about scale.
      nearby_object_control: >-
        The inert case F_{p^2} = O_K / (p), where 'b_i = 0' is the subfield
        condition and the two-dimensional structure is a genuine algebraic
        (Weil-restriction) lever of Gaudry's extension-field index calculus. It
        lives on a different group (E(F_{p^2})) and controls the SOLVER, not the
        claim: a harness that cannot see the subfield lever there has not
        identified what a real two-dimensional structure looks like.
    proof_obligations:
      - claim: '|F_T| is about c_K T and the conservation mean matches KN-FIND-007 exactly.'
        responsibility: baseline
      - claim: The 2m-variable small-root shape has bound product T^m, equal to the one-dimensional product.
        responsibility: correctness
      - claim: Membership costs O(log p) by Gauss-Lagrange reduction and is charged.
        responsibility: runtime
      - claim: The reach comparison is at matched |F|, matched m, matched harness.
        responsibility: interface
      - claim: Conclusions are scoped to the declared K, curves, sizes and solver.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: '|F_T| / |W_T| at matched T, three curves per size'
      direction: different
      minimum_effect: Within 10 percent of c_K = 2 pi / sqrt(|disc K|) at every cell; a larger deviation is a counting error.
    - metric: measured mean decompositions per target over F_T versus C(|F_T| + m - 1, m) / N
      direction: different
      minimum_effect: Exactly equal in the mean over all targets (KN-FIND-007 calibration); any deviation voids the run.
    - metric: eps-hat(2D) minus eps-hat(1D) at matched |F|, m in {3, 4}, three field sizes, with bootstrap intervals
      direction: lower
      minimum_effect: >-
        Predicted at or below zero within the spread on every cell. A positive
        difference exceeding the spread on all three sizes, growing with size,
        absent from the random-subset control and invariant under the PGL_2
        battery is the lead branch and is not expected.
    - metric: eps-hat for the matched random subset of the same size
      direction: lower
      minimum_effect: Recovery must fail (eps-hat at the no-structure floor of E1-01); otherwise the harness is measuring size, not smallness.
  minimal_test:
    design: >-
      Stages 0-3 of the mechanism on the frozen E1-01 planted-root harness, three
      prime-order toy curves at 20, 26 and 32 field bits, K in {Q(sqrt(-3)),
      Q(sqrt(-7))}, m in {3, 4}, T chosen so |F| in {2^8, 2^10, 2^12}; matched
      one-dimensional window, matched random subset, and the controls below;
      every gate run before any reach number is read. No attack is run and no
      scalar is recovered beyond the planted-root protocol; claim_tier toy.
    controls:
      - >-
        PGL_2(F_p) random-reparametrisation battery of IDEA-20260807-4fc635
        applied to x before the O_K lift; the reach distribution over 30 draws
        must contain the one-dimensional value.
      - >-
        Translation-conjugate null of IDEA-20260807-4fc635, base cut on x(P - R)
        with retargeting; every metric must reproduce exactly.
      - Matched random prime-order curve at the same p.
      - Pollard rho with distinguished points and BSGS as matched cost controls on the same curves; no solve is claimed against them.
      - Matched random subset of F_p of size |F_T| (known-false object; recovery must fail).
      - The b_i = 0 slice reproducing the recorded E1-01 baseline exactly (calibration gate).
      - A CM-by-O_K curve as a labelled structured control, reported separately and never pooled.
    required_metrics:
      - '|F_T|, |W_T|, c_K ratio per cell'
      - conservation-mean calibration per cell (exact)
      - eps-hat per base per cell with bootstrap intervals and the PGL_2 draw distribution
      - membership cost in field operations and lattice-reduction steps per point
      - solver wall clock, lattice dimension and peak memory per cell
  falsification_conditions:
    - The b_i = 0 slice does not reproduce the E1-01 baseline. Harness fault; nothing is reported.
    - The random-subset control recovers roots. The harness measures size, not smallness; void.
    - >-
      eps-hat(2D) exceeds eps-hat(1D) beyond the spread on all sizes, growing
      with size, invariant under the battery and absent from the random subset.
      The prediction is falsified and the two-dimensional box is a genuine
      solve-stage lever to be costed.
    - >-
      eps-hat(2D) at or below eps-hat(1D) everywhere. The prediction holds; the
      R1 quadratic-order representation is closed at toy scale for this solver
      family with the bound-product mechanism.
    - Budget exhaustion. Infrastructure outcome, never evidence.
  confounders:
    - >-
      Lattice-dimension growth in the 2m-variable solver can make the
      two-dimensional arm time out at m = 4; a timeout is not a negative reach
      and is reported as infrastructure.
    - >-
      The constant c_K makes 'matched T' and 'matched |F|' differ; every
      comparison is at matched |F| (measured), never at matched T.
    - Small-field coincidences in the shortest-vector map (ties in the coset minimum); ties are counted and reported.
    - A CM curve pooled with generic curves would attribute a CM effect to the representation; CM is a separate labelled arm.
  interpretation_limits:
    - No exponent, no yield claim, no attack. The record tests one representation of smallness on one solve-stage metric at toy scale.
    - >-
      KN-OPEN-020 class named as implicit-membership description. Costs charged
      are description O(1), membership O(log p), relation search equal to the
      small-root solve, descent not used at fixed m, time and memory as measured.
      The record does not claim to escape the bounded-degree theorem; it tests a
      base outside its hypotheses and predicts no gain.
    - A null closes only the norm-ball family for the declared K and solver; other implicit-membership descriptions remain open.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The number of x in F_p whose shortest lift in x + p_K has norm at most T
        is c_K T (1 + O(T^(-1/2))) for T below about p / 4, i.e. the coset minima
        are distributed like the lattice points of a norm ball of covolume p.
      rigorous_support: >-
        Gauss's lattice-point count for the norm form in a fundamental domain
        (rigorous with error O(T^(1/2))), imitating the equidistribution of
        residues in an interval that gives |W_T| = T exactly.
      validation_plan: >-
        SAMPLE: exhaustive count over F_p at p of 20, 26 and 32 bits for both K.
        COMPARISON: c_K T with the O(T^(1/2)) band. TAIL CHECK: the maximum norm
        among the T smallest coset minima versus its prediction. PARAMETERS
        recorded: p, K, T. No transfer claimed.
  heuristic_assumptions_note: >-
    The reach comparison itself is a measurement with a pre-registered sign,
    not a heuristic; H1 only guarantees the factor bases are matched in size.
  target_complexity:
    time_exponent: 'No exponent claimed; predicted improvement 0 (the E1-01 threshold is unchanged if eps-hat ties).'
    memory_exponent: 'Unchanged: N^beta with beta = log_N |F|, as in IDEA-20260808-2e14f7.'
    best_known: 'Pollard rho at 0.886 sqrt(N) and O(1) memory (KN-TECH-006); BSGS (KN-TECH-031); windowed small-root index calculus per the E1-01 lane with its recorded thresholds.'
    hidden_overhead: >-
      The 2m-variable solver's lattice dimension grows with the variable count;
      this is a constant-factor tax that the record predicts makes the
      two-dimensional arm slower, not faster.
    tradeoff_note: Same as the windowed lane; memory is the factor base.
  dominated_by: >-
    Pollard rho and BSGS dominate every instance of this lane at toy scale, and
    the one-dimensional window of the E1-01 lane is predicted to dominate the
    two-dimensional ball on reach at matched |F| and equal memory. Frontier rows
    checked: rho with distinguished points (KN-TECH-006), automorphism-discounted
    rho (KN-TECH-018), BSGS (KN-TECH-031), multi-target, preprocessing frontier,
    windowed small-root index calculus (IDEA-20260808-2e14f7 and the E1-01
    baseline). Data and queries: none issued.
  sota_delta:
    time_exponent_improvement_claimed: 0
    memory_exponent_improvement_claimed: 0
    data_query_improvement_claimed: 0
    scope: >-
      Controlled null proposal; the deliverable is one measured ratio
      eps-hat(2D)/eps-hat(1D) at matched |F| with a bound-product mechanism, which
      closes or opens the R1 quadratic-order representation at toy scale.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
