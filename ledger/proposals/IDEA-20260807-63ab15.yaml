idea:
  id: IDEA-20260807-63ab15
  question_id: RQ-JMV-001
  added: '2026-08-07'
  title: Both approved JMV hypotheses declare their central input LOAD-BEARING AND UNVERIFIED
    because 'the paper is not in the corpus' -- but KN-LIT-171 IS that paper, bulk-seeded two
    days earlier from a PDF's first two pages, and RQ-JMV-001's knowledge_gap is wrong in every
    particular
  class: tooling
  claim: 'H-JMV-001 rests on the claim that Figure 1 of Jao-Miller-Venkatesan misreports c_pi
    for P-256 and records: ''UNVERIFIED AND LOAD-BEARING ... The paper is not in the corpus. An
    independent reviewer must check the verbatim table transcription against the source before
    any conclusion is drawn.'' H-JMV-002 carries the identical flag for Theorem 1.1, Corollary
    1.2, Proposition 3.1 and Lemma 4.1, adding that ''A factor of 2 here moves log(k/c) across
    zero''. Both are status: approved. RQ-JMV-001''s knowledge_gap says ''JMV 2005 (arXiv:math/0411378)
    has no KN-LIT entry ... Ingestion APPROVED under DEC-20260726-003 at the next free id (currently
    KN-LIT-082).'' EVERY PART OF THAT IS WRONG AGAINST COMMITTED STATE: KN-LIT-171 is the paper
    (title ''Do All Elliptic Curves of the Same Order Have the Same Difficulty of Discrete Log?'',
    authors Jao/Miller/Venkatesan, arxiv 0411378, added 2026-07-24); KN-LIT-082 is Pohlig-Hellman
    1978, so the reserved id is taken; and DEC-20260726-003 is a decision about EXP-FCP-002/003
    and fixed-curve preprocessing containing no JMV ingestion approval. Nor does KN-LIT-171 supply
    what the hypotheses need: its own ''Not verified here'' section says it was ''generated during
    the 2026-07-24 bulk seeding pass from the local PDF''s first two pages ... claims are relayed
    from the paper''s abstract without independent verification'' -- no Figure 1, no Lemma 4.1,
    no normalization convention -- and its ''Local copies'' list points at a directory that does
    not exist in this repository.'
  mechanism: 'The decisive first step costs one careful read, not compute. Supersede KN-LIT-171
    with a verified entry carrying: the verbatim Figure 1 rows; the statements of Theorem 1.1,
    Corollary 1.2, Proposition 3.1 and Lemma 4.1; and -- because H-JMV-002 says a factor of 2
    decides the sign -- the paper''s own Cayley-graph DEGREE and EIGENVALUE NORMALIZATION conventions,
    which are exactly where such a factor hides. Then correct RQ-JMV-001''s knowledge_gap by a
    superseding record. Only then are EXP-JMV-001 and EXP-JMV-004 worth dispatching. SECOND, AND
    SEPARATELY: RQ-JMV-001''s third declared gap G3 -- ''the cross-level case, which the paper
    explicitly does not cover'' -- has no hypothesis and no experiment, and is represented in
    the ledger only by a conditional sentence inside EXP-JMV-006''s frozen spec (''If a spread
    is found, EXP-JMV-007 ... becomes worth scheduling''), where EXP-JMV-006 is itself listed
    under unapproved_experiments and EXP-JMV-007 has no directory. Frame G3 directly: at the toy
    sizes RQ-JMV-001 already scopes (p ~ 2^20, full level enumerable), compute the order lattice
    for a c_pi with several divisors and ask first whether the VERTICAL (level-changing) graph
    is even connected at enumerable sizes, then whether any mixing statement is formulable given
    the class-number ratio between adjacent orders.'
  novelty_screen:
    screened_on: '2026-08-07'
    corpus_paths_grepped:
    - knowledge/literature
    - ledger/hypotheses
    - ledger/handoffs
    - experiments
    grep_results:
    - No handoff, experiment or decision tasks anyone with verifying the four JMV statement transcriptions.
    - EXP-JMV-007 has no directory; G3 has no H-* record.
    - arxiv.org is reachable from this environment as measured on 2026-08-07 (arXiv PDF retrieved,
      HTTP 200, valid PDF), so the verification is executable now.
    conclusion: The verification task is unframed and the cross-level gap is unframed.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS: proposing any ECDLP attack. RQ-JMV-001''s own
      constraint forbids it and this record respects that.'
    tracked_object: 'For the verification half: the verbatim transcription and its normalization
      convention. For G3: the order lattice between Z[pi] and O_K, tracked through the connectivity
      of its vertical graph.'
    one_step_propagation_rule: A vertical isogeny step changes the order by one prime level; the
      class-number ratio at that step is computable exactly.
    newness_score: The verification half is zero-novelty bookkeeping that two approved hypotheses
      depend on. G3 is the part of 'same order means same difficulty' that the source literature
      explicitly does not claim.
  lossy_projection_identifiability_audit:
    projection: the isogeny class -> its order lattice with vertical adjacency.
    what_is_discarded: The curves themselves; only the endomorphism-order level is retained.
    is_it_only_a_change_of_coordinates: 'NO for G3 -- many curves share a level. The verification
      half is not an object question at all and is labelled class: tooling for that reason.'
    mirror_failure_check: 'CHECKED for G3: the vertical graph''s connectivity is a computable
      yes/no at enumerable sizes and is not forced either way a priori.'
  null_object_control:
    primary_null: 'For G3: a RANDOM graph on the same level set with matched degrees. If mixing
      behaviour matches, the level structure carries nothing. For the verification half the control
      is a second independent transcription by a different reader, compared character by character.'
    secondary_nulls:
    - 'FORCED VALUE: the horizontal (same-level) graph is known connected under the paper''s hypotheses;
      the instrument must reproduce that before any vertical claim.'
  assumptions:
  - arXiv remains reachable; if it is not at execution time, that is recorded as SOURCE-BLOCKED
    rather than absorbed.
  - p ~ 2^20 makes the level structure fully enumerable, as RQ-JMV-001 scopes.
  predictions:
  - metric: agreement of the verified Figure 1 transcription with H-JMV-001's assumed c_pi = 3
      for P-256
    direction: different
    minimum_effect: Any disagreement withdraws H-JMV-001's subject, which its own falsification_conditions
      already anticipate.
  - metric: connectivity of the vertical level graph at enumerable sizes
    direction: different
    minimum_effect: Disconnection at any tested c_pi structurally excludes a JMV-style argument
      across levels.
  minimal_test:
    design: Read the source; produce the verified superseding KN-LIT entry with the four statements
      and the normalization conventions, double-transcribed. Separately, enumerate the order lattice
      at two c_pi values with several divisors at p ~ 2^20 and report vertical connectivity and
      adjacent class-number ratios.
    controls:
    - independent second transcription
    - random matched-degree graph null
    - horizontal-connectivity forced value
    required_metrics:
    - verbatim Figure 1 rows and the four statements
    - degree and eigenvalue normalization convention
    - vertical graph connectivity and component sizes
    - class-number ratios at each level step
  falsification_conditions:
  - 'The source confirms H-JMV-001''s assumed values: the arithmetic-audit claim has no subject
    and is withdrawn, which the hypothesis itself states as its falsifier.'
  - 'The two transcriptions disagree: neither is admissible until reconciled.'
  - 'The vertical graph is connected with fast mixing: G3 is not the obstruction it might be,
    and order-only curve selection is better supported than the literature claims.'
  confounders:
  - Bulk-seeded KN-LIT entries can look verified; the superseding entry must state its provenance
    level explicitly per KN-OPEN-3f7a21.
  - Class-number computations at p ~ 2^20 are exact but the levels may be few, limiting what connectivity
    means.
  interpretation_limits:
  - Neither half is an ECDLP attack; RQ-JMV-001 forbids one.
  - G3 results at p ~ 2^20 are toy scale.
  - Correcting RQ-JMV-001's knowledge_gap is a Coordinator act; this record supplies the correction's
    content, not the transition.
  heuristic_assumptions:
  - id: HEUR-JMV3-1
    statement: Vertical connectivity at p ~ 2^20 is indicative at cryptographic sizes.
    rigorous_support: None; class numbers grow and the structure may change.
    validation_plan: Report at two c_pi structures and state the limit explicitly.
  target_complexity:
    time_exponent: n/a
    memory_exponent: n/a
    best_known: JMV 2005's own GRH-conditional mixing result, once verified
    hidden_overhead: n/a
    tradeoff_note: No attack proposed.
  dominated_by: n/a (no attack claimed; source verification plus a structural census)
  sota_delta: No attack. Unblocks the only two approved hypotheses under RQ-JMV-001 and removes
    the risk of running an experiment whose subject may not exist; frames the one gap the source
    paper declares out of scope.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 0.9 that the source is retrievable and the transcription completes.
    0.35 that the verified Figure 1 differs from the assumed value in a way that matters -- H-JMV-001
    exists precisely because someone suspected it does. 0.5 that the vertical graph is connected
    at enumerable sizes. 0.05 that anything here bears on attack cost, which it is not meant to.
