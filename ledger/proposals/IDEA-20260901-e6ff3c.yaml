idea:
  id: IDEA-20260901-e6ff3c
  question_id: RQ-VOLC-f6253b
  research_question: RQ-VOLC-f6253b
  goal_id: GOAL-ENDO-001
  added: '2026-09-01'
  title: >-
    THE LEVEL-COLLISION RATE IS THE NUMBER THIS LANE HAS NEVER MEASURED, AND IT
    BOUNDS EVERY DEPTH-CONDITIONING ATTACK AT ONCE: run KN-TECH-080 audit 2 on the
    volcano level itself by searching a whole enumerated isogeny class -- the
    program's only EXACT-N matched family -- for pairs of curves at DIFFERENT
    levels that agree on every statistic in a frozen polylog-cost battery, with
    the G-only sub-battery as a KNOWN-COLLIDING positive control and the true
    level as a KNOWN-SEPARATING one, so the instrument is validated in both
    directions before any rate is read; a rate that stays high as the battery
    grows is structural blindness and a closure at the section-4 standard, and a
    rate that falls is a cheap level detector nobody has built
  class: control

  claim: >-
    FIVE SEPARABLE CLAIMS. (A) NAMES THE MISSING NUMBER. (B) IS THE DERIVED
    TWO-DIRECTIONAL VALIDATION THAT MAKES IT READABLE. (C) IS THE SECOND
    DELIVERABLE, WHICH IS AN INSTRUMENT THE WHOLE GOAL NEEDS. (D) IS THE DECAY
    TEST. (E) IS WHAT IS NOT CLAIMED.

    (A) THE MISSING NUMBER. Every depth-conditioning proposal in this lane
    presumes, without measurement, that a curve's volcano level is either readable
    from cheap public data or not. IDEA-20260808-4d77a6 measures one statistic and
    reports it is often vacuous; IDEA-20260807-a6fb2a predicts that all ARITHMETIC
    size functionals of j are level-blind and that one ALGEBRAIC one is not;
    IDEA-20260901-c7e601 constructs a two-valued Galois-degree indicator at
    O~(ell^2 log p). None of these measures the quantity that governs the whole
    question: THE LEVEL-COLLISION RATE. Define a frozen battery
    s(E) = (s_1(E), ..., s_K(E)) of statistics each computable in polylog(p) time
    from public data, and define a COLLISION as a pair of curves in the SAME
    isogeny class at DIFFERENT levels with s(E) = s(E') at the declared
    resolution. The collision rate as a function of K and of the resolution is a
    measured curve, and it is exactly the identifiability bound on every algorithm
    that wants to condition on depth using cheap data. One collision falsifies
    identifiability for that battery outright and is exhibited rather than
    inferred; a rate is a quantitative obstruction with units and error bars, which
    is what docs/inventor-protocol.md section 4 requires and what this lane's
    standing conclusions do not have.

    (B) THE INSTRUMENT IS VALIDATED IN BOTH DIRECTIONS BY DERIVED ANCHORS, NOT BY
    HOPE. A collision search is only interpretable if the searcher can be shown to
    find collisions that are provably there and to find none where there are
    provably none. This record has both anchors and both are derivations rather
    than plants:
      POSITIVE ANCHOR (collisions are provably present): the sub-battery of
      statistics computable from the prime-order subgroup alone -- the order N,
      the group structure of G, any transcript of group operations, and the
      scalar action of any candidate endomorphism -- has collision rate exactly 1
      on every pair of levels, because by IDEA-20260901-7b8856 the scalar c*d is a
      valid group-endomorphism multiplier for every divisor d of f, so no G-only
      observable separates any two levels. An apparatus that reports a collision
      rate below 1 on the G-only sub-battery is broken.
      NEGATIVE ANCHOR (collisions are provably absent): adding the true level
      v_ell(f_E) itself to the battery forces the collision rate to exactly 0 by
      definition. An apparatus that still reports collisions there is broken in
      the other direction.
    These two anchors bracket the instrument at 1 and 0 before any real battery is
    read, which is precisely the two-directional control DECOMPOSITION.md lane L14
    demands and which no committed VOLC measurement currently has.

    (C) THE SECOND DELIVERABLE: THE ISOGENY CLASS AS THE PROGRAM'S ONLY EXACT-N
    MATCHED NULL FAMILY. Every null object used in this campaign so far is a
    matched RANDOM CURVE at the same p, which necessarily has a DIFFERENT group
    order and therefore a different rho cost, a different Pohlig-Hellman profile
    and a different decomposition probability -- so it is matched on p and on
    nothing that governs the measurement. By Tate's theorem two curves over F_p
    are isogenous exactly when they have the same number of points, so a single
    isogeny class is a family of curves with IDENTICAL N, identical embedding
    degree, identical anomalous and smoothness status, and identical generic cost
    (T1, T2), differing only in j, the curve equation, the volcano level and
    |Aut|. That is an exact-N matched null family, it is the strongest null this
    program can construct, and depth is precisely the knob that sets how large it
    is -- since h(O_f) is about f times h(O_K). This record certifies or breaks
    that family in the same pass as the collision search, at no extra cost,
    because both are computed from the same enumerated class.

    (D) THE DECAY TEST, STATED BEFORE MEASUREMENT. If the battery has real
    resolving power, the collision rate must FALL as K grows and as the resolution
    is tightened. A collision rate that is essentially constant in K is the
    canonical artifact tell of docs/inventor-protocol.md section 3 read in the
    identifiability direction: it means the added statistics are functions of the
    ones already present -- which in this lane is the expected failure, since
    IDEA-20260811-565915 proves that inside one class every level quantity is a
    function of the single integer f_E, so a battery of level-derived statistics
    has effective dimension one no matter how many columns it has. A flat rate is
    therefore not a null result but a MEASURED STATEMENT OF STRUCTURAL BLINDNESS,
    and it is the closure this lane is entitled to write if it comes out that way.

    (E) WHAT IS NOT CLAIMED. NOT that any battery is complete -- a collision-free
    margin bounds only the audited battery. NOT that a cheap level detector would
    be an attack: IDEA-20260807-4f43ac argues a level oracle is a curve-only
    constant and hence generic-group simulable, and IDEA-20260901-7b8856 shows the
    level cannot be certified from inside G at all, so a detector changes the
    instrument budget and not the exponent. NOT any ECDLP speedup; sota_delta is
    +0 in every branch. NOT that the exact-N null family is free of confounds --
    |Aut| and the group structure vary across a class and are named confounders.

  mechanism: >-
    The lane's live question is whether depth is invisible or merely unmeasured,
    and the two are distinguished by a quantity nobody has computed: how often two
    curves at different levels look identical to everything cheap. The mechanism
    is to make that quantity the deliverable. An isogeny class is the right arena
    because it holds N, and therefore every group-theoretic cost, exactly fixed,
    so any statistic that varies within it varies for a curve-level reason and any
    statistic that does not vary is provably level-blind on that class. The
    apparatus is a search over pairs, which is quadratic in the class size and
    therefore trivially affordable at toy scale where a class has a few hundred
    curves. The two derived anchors turn what would otherwise be an
    uninterpretable search into a calibrated one: the G-only sub-battery must
    collide always and the true-level battery must never collide, so the
    instrument's response is pinned at both ends of its range before any
    interesting battery is run. And the decay of the rate in K distinguishes a
    battery that is merely small from one that is structurally blind, which is the
    difference between "we did not look hard enough" -- a fatigue report, whose
    honest status the protocol fixes at `unverified` -- and a closure with a named
    obstruction.

  novelty_status: unverified

  citations:
    - ref: IDEA-20260816-7c9222
      provenance: internal
      claim: >-
        Runs the KN-TECH-080 audit-2 observation-collision search on the SNFS
        detectability battery, searching for pairs of primes inside and outside a
        hypothesis class agreeing on every statistic, and argues that the
        collision RATE as a function of battery size K is the real deliverable
        while a collision-free margin is the symmetric positive result. This
        record applies the same audit shape to a completely different object --
        the volcano level of a curve inside one isogeny class -- and adds two
        DERIVED anchors that 7c9222 does not have.
      verified_by: this idea-generator session, read in full through claim (E)
    - ref: IDEA-20260808-4d77a6
      provenance: internal
      claim: >-
        n_1 = gcd(A - 1, f/f_E) is a publicly computable lower bound on the
        ell-volcano level, costing O(log p) group operations, and is expected to be
        informative essentially only at ell = 2 and 3 and identically vacuous on a
        substantial fraction of classes -- with the record explicitly claiming
        usefulness only conditionally on a MEASURED non-vacuity rate. This record
        measures that rate as one column of its battery and generalizes the
        question from one statistic to a battery.
      verified_by: this idea-generator session, read in full through claim (C)
    - ref: IDEA-20260807-a6fb2a
      provenance: internal
      claim: >-
        Predicts that every ARITHMETIC size functional of j -- bit length, Hamming
