  novelty_screen:
    method: >-
      FILESYSTEM AND LEDGER SCREENING ONLY. The crypto-kb MCP server is bound to
      ':memory:' with an empty index and returns nothing; it was NOT called and
      its silence is not read as novelty. Enumerated all 14 proposals carrying
      question_id RQ-VOLC-f6253b and read the claim block of each; read
      IDEA-20260816-7c9222 (the audit-2 record for a different object) in full
      through its claim; read DECOMPOSITION.md sections 3 and 4 including L14; read
      RQ-VOLC-f6253b and the three H-VOLC hypothesis heads. No external paper and
      no web source was opened.
    results: >-
      NEAREST FILED WORK, NAMED WITH ITS DIFFERENCE. (1) IDEA-20260816-7c9222 is
      the closest by DESIGN SHAPE and it is a different object entirely: its
      collision search is over PRIMES and an SNFS hypothesis class, under
      RQ-SNFS-005666. The transfer of the audit shape to a new object is
      deliberate and is declared rather than concealed; what is added here and not
      present there is the pair of DERIVED anchors that bracket the instrument at
      rates 1 and 0, which is possible only because this object has a provable
      collision (the G-only sub-battery) and a provable separator (the true
      level). (2) IDEA-20260815-101067 asks whether COST varies with level. This
      record asks whether CHEAP PUBLIC STATISTICS can identify the level. Those are
      different questions with different metrics -- a variance versus a collision
      rate -- and different consequences: 101067's null would say depth does not
      matter, whereas this record's collision result would say depth cannot be
      cheaply conditioned on even if it did. (3) IDEA-20260807-3f5545 decomposes
      the VARIANCE of cost functionals by level vector against a level-permutation
      null; that null is borrowed here as a control, but a variance decomposition
      and a pairwise collision search answer different questions and 3f5545's
      design cannot exhibit a collision pair. (4) IDEA-20260808-4d77a6 measures one
      statistic's vacuity; this record makes that one column of a battery and
      measures the joint rate. (5) IDEA-20260807-a6fb2a predicts per-column
      blindness for arithmetic functionals of j; those predictions are imported as
      pre-registered per-column expectations rather than re-derived.
    verdict: >-
      UNVERIFIED. The audit-2 shape is prescribed by KN-TECH-080 and is already
      instantiated in this repository for another object, so the DESIGN is an
      adaptation and is labelled as one in the text. What is not in any committed
      record is the object (level identifiability inside an exact-N class), the
      derived two-anchor calibration, the exact-N null-family certification, and
      the decay-in-K reading as structural blindness. No external source was
      opened, so `unverified` is the only permissible label.

  object_first_candidate:
    tracked_object: >-
      THE SCORE VECTOR s(E) OF A FROZEN POLYLOG-COST PUBLIC BATTERY, followed
      across an entire enumerated isogeny class and compared PAIRWISE against the
      level label -- so the tracked object is not a curve, not a level, and not a
      cost, but the FIBRE STRUCTURE of the map E |-> s(E) restricted to one class.
      Established families declared OFF-LIMITS as the primary lens for this
      record: cost-functional stratification by level; variance decomposition;
      regression on f_E; the endomorphism scalar or degree; the walk and its
      height process; the isogeny pullback. This record measures the resolving
      power of an instrument, not a property of curves.
    lossiness: >-
      PASSES THE LOSSY-PROJECTION TEST, AND THE TEST IS THE MEASUREMENT. The
      projection E |-> s(E) is lossy by construction -- it retains K numbers from
      an object carrying at least log(h(O_f)) bits of positional information --
      and the record's entire purpose is to measure HOW lossy, in the one direction
      that matters, namely whether the level survives. It cannot degenerate into a
      change of coordinates, because K is fixed and small while the class is large;
      the interesting question is the opposite one, whether it is so lossy that
      nothing survives. Compatibility with the target's operations is where the
      subtlety sits and it is stated explicitly: the battery's columns are NOT
      required to propagate deterministically under an isogeny step, and most will
      not; what is required is that they be computable per curve at polylog cost,
      which is a weaker condition. This record is therefore an instrument audit
      rather than an attack object, and the honest consequence is that it can
      close a channel but can never open one.
    propagation: >-
      ONE-STEP PROPAGATION IS DEFINED FOR THE LABEL AND MEASURED FOR THE SCORE.
      The level propagates exactly: an ell-isogeny step changes v_ell(f_E) by
      exactly one and leaves every other coordinate fixed. The score vector's
      propagation is precisely what is unknown and is measured: for each column,
      the record reports the distribution of s_i(E') - s_i(E) across single
      ell-isogeny steps, which is a per-column sensitivity and is a finer
      deliverable than the collision rate itself. A column whose one-step
      distribution is centred at zero with small spread is level-blind by
      construction and can be dropped from the battery, which is how the battery
      is pruned without tuning it against the answer.
    survival_score: >-
      Survives for any enumerated isogeny class with at least two levels and at
      least two curves per level, which at toy scale is routine. Dissolves in
      three named places. (i) At a class with f = 1 there is only one level and
      the collision question is vacuous -- the record's degenerate control. (ii) At
      cryptographic scale the class cannot be enumerated, so the pairwise search
      must be replaced by sampling, which changes the estimator and is declared
      rather than assumed away. (iii) The audit's conclusion never extends beyond
      the audited battery, so the object's reach is bounded by the columns someone
      thought to include -- which is the honest limit of every identifiability
      result and is why the deliverable is a rate with a battery attached rather
      than a verdict.

  proof_search_map:
    bottleneck: >-
      The exact step is the unmeasured premise shared by every depth-conditioning
      design in this lane: that a curve's level is or is not available to a cheap
      algorithm. Both a closure and an attack in this lane are blocked on it, and
      it has never been measured. Removing it converts the lane's standing
      saturation language -- which the inventor protocol classifies as
      `unverified` until an obstruction is measured -- into either a quantitative
      obstruction or a cheap detector.
    baseline_embedding:
      parameter_slice: >-
        IDEA-20260808-4d77a6's single-statistic result is the K = 1 slice: a
        battery consisting of n_1 alone, whose collision rate is by that record's
        own analysis high on most classes and low on classes with ell | (A - 1).
        The audit must reproduce those two regimes exactly at K = 1 before any
        larger K is read.
      reproduction_check: >-
        A FROZEN FIXTURE at K = 1 with s = n_1 on two classes, one with
        ell | (A - 1) and one without, reproducing 4d77a6's predicted vacuity
        pattern. A mismatch means either the battery implementation or 4d77a6's
        derivation is wrong, and localising that is worth more than the rest of
        the record.
    observation_collision:
      observable: >-
        The observable is the score vector s(E) at the declared resolution, and
        the audit IS the collision search -- so this field is not a check on the
        record, it is the record's subject. Stated for the audit's own sake: the
        conclusion of the record is carried by the collision RATE, and the object
        that could collide with it is a rate produced by a broken searcher, which
        is why the two derived anchors of claim (B) exist.
      distinct_preimage_search: >-
        THE SEARCH IS THE EXPERIMENT AND IT IS EXHAUSTIVE AT TOY SCALE. All pairs
        of curves in the class are compared -- about 9500 pairs for a 138-curve
        class, trivial -- so no sampling error enters the collision count. Pairs
        are stratified by level distance, since a collision between adjacent levels
        and one between the crater and the floor mean different things and must be
        reported separately.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable s(E) fixed and vary the forgotten structure -- the
          level -- exhibiting explicit pairs of curves with equal scores and
          different levels, then look for an intrinsic invariant separating them.
          The candidate separators are the reference detectors deliberately kept
          OUT of the polylog battery: the Galois-degree indicator of
          IDEA-20260901-c7e601 at O~(ell^2 log p), and the LLL-based algebraic
          size functional of IDEA-20260807-a6fb2a.
        predicted_gain: >-
          Either an exhibited collision family, which is a hard falsifier of cheap
          identifiability and a closure with a measured rate, or a collision-free
          margin, which is a positive statement about the battery's resolution.
          Both are results and the design cannot return nothing.
      - transform: specialization_pack
        proposed_object: >-
          Build the resolution measure as a per-column sensitivity -- the
          distribution of one-step score changes across single ell-isogeny steps --
          and add columns only over blocks proved to be non-redundant, i.e.
          columns whose one-step distribution is not a deterministic function of
          the columns already present.
        predicted_gain: >-
          Prevents the battery from being inflated with restatements of f_E, which
          IDEA-20260811-565915 proves is the failure mode here, and makes the
          decay-in-K reading meaningful rather than automatic.
    quantifier_order: >-
      EXPLICIT, AND THE DIRECTION OF THE CONCLUSION DEPENDS ON IT. The falsifying
      form is: there EXIST curves E, E' in one class with different levels and
      s(E) = s(E'), which is established by exhibiting one pair and quantifies over
      nothing. The positive form is: for ALL pairs in the enumerated class with
      different levels, s(E) is different from s(E') by at least the measured
      margin -- which is a statement about THAT class only and does NOT quantify
      over classes, over p, or over batteries. Reading a collision-free margin on
      one class as a general identifiability claim is the quantifier error this
      audit exists to prevent, and it is the error most likely to be made
      downstream.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest thing this method can certify is a collision rate, or a
        collision-free margin, FOR THE AUDITED BATTERY ON THE ENUMERATED CLASSES.
        It cannot certify that no cheap statistic exists -- only that none of the
        K audited ones works; it cannot certify anything about cost, about
        attacks, or about classes it did not enumerate; and a collision-free
        margin is not a detector until someone shows the margin survives on a
        class the battery was not designed against.
      nearby_object_control: >-
        THE NEARBY OBJECT IS THE LEVEL-PERMUTED CLASS -- the same curves with their
        level labels randomly shuffled, which is IDEA-20260807-3f5545's null. On
        that object the desired conclusion (that the battery reads the level) is
        known false by construction, so the measured collision rate there is the
        rate a blind battery produces, and the real rate is only meaningful as a
        DIFFERENCE from it. A battery whose real and permuted rates coincide has
        identified nothing, and reporting the real rate alone would look like a
        result while being one.
    proof_obligations:
      - claim: >-
          A single isogeny class over F_p has constant N, by Tate.
        responsibility: baseline
      - claim: >-
          The G-only sub-battery has collision rate exactly 1 across levels.
        responsibility: correctness
      - claim: >-
          Adding the true level to the battery drives the collision rate to 0.
        responsibility: correctness
      - claim: >-
          The pairwise search is exhaustive at the enumerated class sizes, so the
          reported rate carries no sampling error.
        responsibility: feasibility
      - claim: >-
          Every battery column is computable in polylog(p) time from public data.
        responsibility: runtime
      - claim: >-
          The measured rate is reported as a difference against the
          level-permuted null.
        responsibility: correctness
      - claim: >-
          Scope: the enumerated classes, the frozen battery, the declared
          resolution.
        responsibility: scope

  assumptions:
    - >-
      At least one toy isogeny class can be enumerated completely with certified
      level labels. The committed p = 4001, t = 30 census of 138 curves across
      five ell = 2 levels (IDEA-20260821-ad7c97, H-VOLC-707f6c) is the candidate,
      and its identification must be re-derived rather than imported; if it does
      not reproduce, the record halts at the first gate.
    - >-
      Level labels come from at least two independent labellers that agree, per
      IDEA-20260807-b1b604. An audit built on asserted labels measures nothing in
      either direction.
    - >-
      Every battery column has a declared cost and a declared resolution before
      any collision is counted. A battery assembled after seeing the collisions is
      not an audit.

  predictions:
    - metric: >-
        g_only_collision_rate: fraction of different-level curve pairs that
        collide when the battery consists only of statistics computable inside the
        prime-order subgroup
      direction: higher
      minimum_effect: >-
        EXACTLY 1.000. This is the derived positive anchor of claim (B). Anything
        below 1 means the apparatus is separating levels using information it
        provably does not have, and every other number in the record is void.
    - metric: >-
        true_level_collision_rate: the same fraction when the true level is
        included as a column
      direction: lower
      minimum_effect: >-
        EXACTLY 0.000. The derived negative anchor. A non-zero rate means the
        comparator or the resolution logic is broken.
    - metric: >-
        polylog_battery_collision_rate: fraction of different-level pairs
        colliding on the frozen polylog battery, reported separately for adjacent
        levels and for crater-versus-floor pairs
      direction: different
      minimum_effect: >-
        Reported with a binomial confidence interval and against the
        level-permuted null. A rate within 2 standard errors of the permuted null
        means the battery reads nothing about the level; a rate at least 0.2 below
        it means some column is informative and must be identified individually.
    - metric: >-
        collision_rate_decay_in_K: the collision rate as columns are added in a
        pre-declared order, fitted for a trend in K
      direction: lower
      minimum_effect: >-
        A statistically significant decrease over the pre-declared column order.
        A rate flat in K to within 2 standard errors is STRUCTURAL BLINDNESS --
        the added columns are functions of those already present, exactly as
        IDEA-20260811-565915 predicts for level-derived quantities -- and is the
        record's closure outcome, to be recorded as an obstruction block with the
        measured flat rate, its error bars, the runs it is read from, and its
        scope.
    - metric: >-
        per_column_one_step_sensitivity: for each column, the distribution of
        s_i(E') - s_i(E) across single ell-isogeny steps that change the level
      direction: different
      minimum_effect: >-
        Reported per column. A column whose distribution is concentrated at zero
        is level-blind and its inclusion inflates K without adding resolution;
        this is how the battery is pruned honestly rather than tuned. The
        arithmetic functionals of j are PRE-REGISTERED as expected to be
        concentrated at zero, following IDEA-20260807-a6fb2a's prediction, and a
        departure from that would falsify a6fb2a rather than this record.
    - metric: >-
        exact_n_null_certification: within-class spread of the matched rho and
        BSGS baselines across all curves of the class, at fixed N and fixed
        sampler
      direction: lower
      minimum_effect: >-
        Consistent with zero within sampler noise, as T1 and T2 require. A
        non-zero spread means the isogeny class is NOT a clean exact-N null family
        and the whole campaign's use of it as one must be revisited -- which,
        given that EV-ENDO-10109d records unexplained within-class over-dispersion
        of a related quantity, is a live possibility and is the single most
        consequential thing this record could find.
    - metric: >-
        reference_detector_gap: the collision rate of the polylog battery minus
        that of the same battery augmented by the O~(ell^2 log p) Galois-degree
        indicator of IDEA-20260901-c7e601
      direction: higher
      minimum_effect: >-
        A gap of at least 0.3 would show that the level is available at
        polynomial-in-ell cost but not at polylog cost, which localises the price
        of depth information to a specific cost class rather than declaring it
        absent -- the most useful possible form of a negative here.

  minimal_test:
    design: >-
      SIX STEPS, TOY SCALE, ALL CHEAP. STEP 0 (blocking): freeze the battery.
      Declare K columns with their costs and resolutions in a file committed
      BEFORE any collision is counted -- candidate columns include n_1 and n_2 of
      the group structure, gcd(A - 1, f), the number of rational 2- and
      3-isogenies, the factorization type of the cubic, the bit length and Hamming
      weight of j, the multiplicative order of j, the rational-reconstruction
      height of j, |Aut|, and the quadratic character of a, b -- together with the
      declared column order for the decay fit. STEP 1 (minutes): reproduce the
      enumerated class and its level labels from scratch, requiring agreement
      between at least two independent labellers, and halt on any disagreement.
      STEP 2 (seconds): run the two DERIVED ANCHORS -- the G-only sub-battery must
      give collision rate exactly 1 and the true-level battery exactly 0. If
      either fails, stop; the searcher is broken. STEP 3 (minutes): run the
      exhaustive pairwise collision search on the frozen battery, stratified by
      level distance, and report the rate with a binomial interval. STEP 4
      (minutes): run the identical search on the LEVEL-PERMUTED class and report
      the difference; then run the decay fit by adding columns in the declared
      order. STEP 5 (minutes): compute the per-column one-step sensitivities, the
      exact-N null certification (within-class spread of the matched rho and BSGS
      baselines), and the reference-detector gap by augmenting the battery with
      the Galois-degree indicator. Repeat STEPS 1 to 5 on a second class at a
      different p, and on a degenerate f = 1 class where the collision question is
      vacuous and the apparatus must say so rather than return a number.
    controls:
      - >-
        DERIVED POSITIVE ANCHOR (blocking): the G-only sub-battery, whose collision
        rate is provably 1 by IDEA-20260901-7b8856. The searcher must find those
        collisions.
      - >-
        DERIVED NEGATIVE ANCHOR (blocking): the true-level battery, whose collision
        rate is 0 by definition. The searcher must find none.
      - >-
        LEVEL-PERMUTATION NULL: the same measurement on shuffled level labels,
        borrowed from IDEA-20260807-3f5545. The reported result is the difference
        against it, never the raw rate.
      - >-
        DEGENERATE-CLASS CONTROL: an f = 1 class with one level, where the
        apparatus must report the question as vacuous rather than emit a rate.
      - >-
        PRE-REGISTRATION CONTROL: the battery, its column order, and the
        resolutions are frozen in a committed file before any collision is
        counted. A battery adjusted after seeing collisions is not an audit and
        the run is invalid.
      - >-
        TWO-CLASS REPLICATION: everything is repeated at a second prime, since a
        single class's collision structure could be an accident of its conductor.
    required_metrics:
      - G-only anchor rate (must be 1) and true-level anchor rate (must be 0)
      - collision rate on the frozen battery, stratified by level distance, with binomial intervals
      - level-permuted null rate and the difference
      - decay fit of the rate in K over the pre-declared column order
      - per-column one-step sensitivity distributions
      - within-class spread of matched rho and BSGS baselines (the exact-N null certification)
      - reference-detector gap with the Galois-degree column added
      - exhibited collision pairs, listed explicitly with their j-invariants and levels
      - frozen battery file hash recorded before the run
      - artifact manifest with source hashes, seeds, and a rebuild receipt

  falsification_conditions:
    - >-
      The G-only anchor rate is below 1, or the true-level anchor rate is above 0.
      The searcher is broken in one of the two directions and no rate may be read.
      This is the blocking gate and it is derived rather than assumed.
    - >-
      The frozen battery's collision rate is indistinguishable from the
      level-permuted null. The battery reads nothing about the level; combined
      with a flat decay in K this is the record's CLOSURE outcome and must be
      recorded as an obstruction block -- the measured rate, its confidence
      interval, the runs, and the scope -- with forward guidance naming the
      classes that remain open, specifically the polynomial-in-ell detectors that
      were deliberately excluded from the battery.
    - >-
      The collision rate falls significantly with K and reaches a collision-free
      margin. Cheap level identification is possible on the tested classes; the
      responsible columns must be named individually, and the result is an
      instrument, not an attack, per claim (E).
    - >-
      The within-class spread of the matched rho or BSGS baseline is non-zero
      beyond sampler noise. The isogeny class is not the exact-N null family
      claim (C) asserts, T1 or T2 is being violated by the instrument, and this
      finding outranks everything else in the record.
    - >-
      The arithmetic functionals of j show non-trivial one-step sensitivity. That
      falsifies IDEA-20260807-a6fb2a's negative-half prediction rather than this
      record, and must be reported as such.
    - >-
      The class does not reproduce its committed level cardinalities. The
      enumeration is wrong and the record halts at STEP 1.

  confounders:
    - >-
      LEVEL AND |Aut| AND GROUP STRUCTURE MOVE TOGETHER. Within a class, |Aut| is
      determined by the End-order discriminant and the rational group structure is
      determined by the level via Lenstra's theorem (H-VOLC-707f6c), so a battery
      column that reads the group structure is reading the level indirectly.
      MITIGATION: such columns are declared as level-derived in the frozen file,
      and the decay analysis reports rates with and without them, since including
      them makes cheap identification trivially true for the wrong reason.
    - >-
      EFFECTIVE DIMENSION ONE. IDEA-20260811-565915 proves every level quantity
      inside a class is a function of f_E, so a battery of level-derived columns
      cannot decay in K however large K is. MITIGATION: this is not a nuisance but
      the predicted mechanism of the closure outcome, and the per-column
      sensitivity analysis is what exposes it rather than hiding it in the
      aggregate rate.
    - >-
      RESOLUTION IS A FREE PARAMETER. Declaring two score vectors equal at a
      coarse resolution manufactures collisions; at a fine resolution it
      manufactures separation. MITIGATION: the resolution is frozen per column
      before the run, and the rate is reported as a curve over a declared
      resolution grid rather than at one point.
    - >-
      SMALL LEVEL CELLS. On the committed class the crater holds 3 curves and the
      floor 72, so pair counts per level-distance stratum are wildly unbalanced
      and an aggregate rate is dominated by the deep strata. MITIGATION: rates are
      reported per level-distance stratum with their own intervals and never
      pooled without weights.
    - >-
      AN AUDIT CANNOT PROVE ABSENCE. A collision-free margin bounds the audited
      battery only, and a high collision rate does not prove no cheap statistic
      exists. MITIGATION: stated in the method ceiling, the quantifier order and
      the interpretation limits, and the forward guidance names the excluded cost
      class explicitly.

  interpretation_limits:
    - >-
      CLAIM TIER TOY, per RQ-VOLC-f6253b. Two enumerated classes at p of a few
      thousand, one frozen battery, one declared resolution grid. No transfer to
      cryptographic scale, where the class cannot be enumerated and the estimator
      would have to change.
    - >-
      THE RESULT IS ABOUT AN INSTRUMENT, NOT ABOUT CURVES. A collision rate bounds
      what cheap data can identify; it says nothing about whether depth matters if
      identified, which is IDEA-20260815-101067's question, and nothing about the
      ECDLP, whose exponent is untouched in every branch.
    - >-
      A CLOSURE FROM THIS RECORD IS SCOPED TO THE AUDITED BATTERY AND THE
      ENUMERATED CLASSES, and must be written with its forward guidance: the
      polynomial-in-ell detectors deliberately excluded here (the Galois-degree
      indicator, the LLL algebraic size functional) remain open, and so does any
      statistic nobody has thought of. A count of columns that failed is a fatigue
      report; the measured rate with its scope is not.
    - >-
      THE EXACT-N NULL CERTIFICATION IS THE RECORD'S HIGHEST-VALUE BY-PRODUCT AND
      ITS MOST FRAGILE. EV-ENDO-10109d records unexplained within-class
      over-dispersion of a related quantity and H-VOLC-707f6c attributes it at one
      prime to a target sampler confined to an index-2 subgroup. If that
      attribution is right the certification will pass once the sampler is fixed;
      if it is wrong the certification will fail and the campaign's null family is
      not what it thinks. Either way the sampler must be reported alongside the
      result.
    - >-
      NOTHING HERE ADJUDICATES THE CONTESTED KN-FIND-002 AND KN-FIND-b7e091
      RECORDS. The G-only anchor uses IDEA-20260901-7b8856's derivation, which is
      independent of both readings of the incidence oracle, and this record takes
      no side on the recorded contradiction.

  heuristic_assumptions:
    - id: H1
      statement: >-
        BATTERY GENERICITY. For a column s_i that is NOT a function of the level,
        the values s_i(E) across the curves of one isogeny class behave like
        independent samples from a fixed distribution that does not depend on the
        level -- formally, the conditional distribution of s_i given the level is
        the same for every level, so the column contributes no separating power
        and its contribution to the collision rate is that of an independent
        random label with the same marginal.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the j-invariants at level i are the roots in F_p of
        the Hilbert class polynomial of the corresponding discriminant, and
        reduction mod p destroys archimedean height, so no ARITHMETIC size
        functional of j retains information about which class polynomial it came
        from -- this is IDEA-20260807-a6fb2a's derived negative half and it is the
        rigorous core of H1. CLASSICAL STATEMENT IMITATED: the working assumption
        that reductions of CM points are equidistributed in F_p, i.e. that a root
        of a degree-h polynomial mod p is indistinguishable from a uniform element
        of F_p by any statistic not sensitive to the polynomial's degree. THE GAP,
        STATED: equidistribution of CM points modulo p is a deep and only partially
        proved subject, the class sizes here are tiny, and the columns are not
        independent of one another. H1 is therefore the hypothesis the
        level-permutation null is designed to test rather than a background
        assumption.
      falsification_condition: >-
        A column whose empirical distribution differs across levels by more than a
        Kolmogorov-Smirnov band at the declared level, or a real-versus-permuted
        collision-rate difference that cannot be attributed to any single column.
        Either falsifies H1 for that column, which is a positive finding about
        that column and must be reported individually rather than absorbed.
      validation_plan: >-
        SAMPLE: every curve of each enumerated class -- a census, not a sample, at
        toy scale -- with at least two classes at different primes and, where the
        class is small, a third class added rather than resampling the same one.
        SHORTCUT: at larger p, where enumeration is impossible, the Deuring-style
        shortcut is to construct curves at prescribed levels by CM construction or
        by descending from a known crater curve, which samples the level strata
        directly without enumerating the class; that substitution changes the
        estimator and must be recorded as such. COMPARISON: per-column empirical
        CDF by level against the pooled CDF, by two-sample Kolmogorov-Smirnov;
        and, for the arithmetic functionals of j, against the uniform-on-F_p
        reference that IDEA-20260807-a6fb2a predicts. TAIL CHECK: the extreme
        values of each column -- the smallest and largest observed -- against the
        predicted quantiles of the reference distribution, since a level effect
        confined to the tail would be invisible in the body. TRANSFER: the sampled
        parameters (p, t, D_0, f, class size, per-level cardinalities) are recorded
        in full and no extrapolation in p is made.
    - id: H2
      statement: >-
        EFFECTIVE DIMENSION ONE FOR LEVEL-DERIVED COLUMNS. Any column that is a
        deterministic function of f_E contributes no NEW separating power beyond
        the first such column, so the collision rate restricted to level-derived
        columns is constant in K once K is at least 1, and its value is determined
        by the number of divisors of f rather than by K.
      rigorous_support: >-
        RIGOROUS INGREDIENT: IDEA-20260811-565915's derivation that inside one
        class disc End(E), the ell-level, the minimal non-scalar norm and |Aut| are
        all functions of the single integer f_E -- a deterministic statement, not a
        statistical one. CLASSICAL STATEMENT IMITATED: none needed; this is a
        functional-dependence argument. THE GAP: a column may be a function of f_E
        in principle while being computed at a resolution that loses the
        dependence, in which case it behaves like noise rather than like a
        restatement; the per-column sensitivity analysis distinguishes these two
        cases empirically.
      falsification_condition: >-
        The collision rate over level-derived columns decreases significantly as
        such columns are added. Then some column is not the function of f_E it was
        declared to be, which is either an error in the declaration or a genuinely
        new invariant, and either is worth more than the rate.
      validation_plan: >-
        SAMPLE: all level-derived columns on all curves of both classes. SHORTCUT:
        none. COMPARISON: the measured collision rate over level-derived columns
        against the analytic value implied by #div(f), which is computable exactly
        from f. TAIL CHECK: the crater and floor strata separately, since they have
        the most extreme cardinalities and are where a spurious decay would show
        first. TRANSFER: none; the dependence is derived and the measurement tests
        the declaration.

  target_complexity:
    time_exponent: >-
      NO ECDLP EXPONENT IS CLAIMED OR MOVED; target and best known are both
      n^{1/2 + o(1)} and sota_delta is +0 in every branch. THIS RECORD IS
      EXPLICITLY A BUILDING BLOCK and per the search heuristics of
      agents/idea-generator.md it says so rather than dressing an instrument audit
      as an exponent result. Its justification for priority is that it is a
      PREREQUISITE in both directions: the campaign cannot write a closure for
      lane L2 at the inventor-protocol section-4 standard without a measured
      obstruction, and this record's collision rate is the only candidate for that
      measurement; and no depth-conditioning attack can be costed without knowing
      the cost class in which the level becomes available, which this record
      brackets from below while IDEA-20260901-c7e601 brackets it from above. The
      audit itself costs O(|class|^2 * K) polylog-cost evaluations, which is under
      10^5 cheap operations on a 138-curve class.
    memory_exponent: >-
      O(|class| * K) score values, kilobytes at toy scale. No table, no
      preprocessing, no tradeoff. Against the ECDLP baseline, memory target and
      best known are both those of the incumbent, O(1) for rho with distinguished
      points.
    best_known: >-
      For the ECDLP: parallel Pollard rho with the negation map at n^{1/2 + o(1)}
      time and O(1) memory per processor, BSGS at n^{1/2} time and memory, and the
      automorphism-discounted variant on CM curves (KN-TECH-018) -- all three are
      matched controls in this record's exact-N null certification rather than
      targets. For cheap level determination, which is the axis this record
      bounds: IDEA-20260808-4d77a6's n_1 at O(log p) group operations where
      non-vacuous, and IDEA-20260901-c7e601's Galois-degree indicator at
      O~(ell^2 log p).
    hidden_overhead: >-
      DISCLOSED. Nothing hides in an o(1) because no asymptotic is claimed. What
      IS hidden and must be reported: the cost of enumerating the class and
      certifying its level labels, which dominates the audit itself and is charged
      to IDEA-20260807-b1b604's certifier; and the fact that at cryptographic
      scale the exhaustive pairwise search is impossible, so any extension would
      measure a different estimator on a sampled subfamily.
    tradeoff_note: >-
      The only tradeoff worth recording is between battery cost and resolving
      power, and measuring that tradeoff IS the deliverable: the record reports
      the collision rate as a function of the battery's declared cost class,
      polylog versus polynomial-in-ell, which localises the price of depth
      information rather than declaring it free or unavailable. Parallelization is
      trivial across pairs and across classes.

  dominated_by: >-
    CHECKED ACROSS EVERY ROW OF THE FRONTIER, ON TIME, MEMORY AND QUERIES, BEFORE
    ANSWERING. As an ECDLP attack: n/a (no result claimed) -- no time, memory or
    query point is offered and no frontier row applies; `null` would be a
    fabrication. As a level-determination method: DOMINATED on cost by
    IDEA-20260808-4d77a6's n_1 where that is non-vacuous, and dominated on
    coverage by IDEA-20260901-c7e601's Galois-degree indicator; this record builds
    no detector and competes with neither -- it measures where the boundary
    between them lies. As an audit design: dominated by KN-TECH-080 audit 2, which
    prescribes the shape, and adapted from IDEA-20260816-7c9222, which instantiates
    it for a different object; the adaptation is declared rather than presented as
    invention. As a null-object family: NOT dominated -- no committed record in
    this repository certifies the isogeny class as an exact-N matched null, and
    every null currently in use is matched on p only, which is strictly weaker on
    every axis that governs the measurements.
  sota_delta: >-
    +0 ON EVERY ATTACK AXIS IN EVERY BRANCH. Time exponent 1/2 before and after,
    memory unchanged, query model untouched, claim tier toy. What the record moves
    is stated quantitatively and internally: the number of MEASURED obstructions
    available to lane L2 goes from zero to one (a collision rate with a confidence
    interval, a battery, and a scope), which is the difference between a closure at
    the inventor-protocol standard and a fatigue report whose honest status is
    `unverified`; and the campaign's null-object family is upgraded from
    matched-on-p to matched-on-N, or is shown not to be, which is the more
    consequential of the two.

  discriminated_from:
    - >-
      IDEA-20260816-7c9222 runs the same audit shape on PRIMES and an SNFS
      hypothesis class under a different RQ. Same design template, entirely
      different object; and this record adds two DERIVED anchors bracketing the
      instrument at 1 and 0, which that record does not have and which its object
      may not admit.
    - >-
      IDEA-20260815-101067 asks whether COST varies with level. This asks whether
      cheap public data can IDENTIFY the level. Different question, different
      metric (variance versus collision rate), different consequence: a null there
      says depth does not matter, a collision here says depth cannot be cheaply
      conditioned on even if it did.
    - >-
      IDEA-20260807-3f5545 decomposes the variance of cost functionals by level
      VECTOR against a level-permutation null. This record borrows that null and
      answers a different question with an exhaustive pairwise search that can
      EXHIBIT a collision pair, which a variance decomposition cannot.
    - >-
      IDEA-20260808-4d77a6 measures the vacuity of ONE statistic. This record
      makes it one column of a frozen battery and measures the joint identifiability
      rate, with 4d77a6's result as its K = 1 baseline-embedding check.
    - >-
      IDEA-20260807-a6fb2a predicts per-functional blindness for arithmetic size
      functionals of j and constructs an LLL-based algebraic detector. Those
      predictions become pre-registered per-column expectations here; the LLL
      detector is deliberately EXCLUDED from the polylog battery and used as a
      reference, so this record tests a6fb2a rather than restating it.
    - >-
      IDEA-20260901-7b8856 (this session) derives the G-only indistinguishability
      that this record uses as its positive anchor. Different object; that record
      proves the anchor, this one uses it to calibrate an instrument.

  estimated_cost:
    implementation: medium
    compute: low

  recommended_priority: medium

  honest_prior_of_survival: >-
    0.95 that both derived anchors behave as predicted, since both are
    derivations. 0.7 that the polylog battery's collision rate is
    indistinguishable from the level-permuted null and flat in K -- the closure
    outcome, which follows from IDEA-20260811-565915's effective-dimension-one
    argument for level-derived columns and from IDEA-20260807-a6fb2a's blindness
    prediction for the arithmetic ones. 0.2 that some column unexpectedly
    separates, most plausibly a group-structure column reading the level
    indirectly through Lenstra's theorem, which is why such columns are declared
    in advance. 0.25 that the exact-N null certification FAILS on the first pass
    because of the sampler artifact already recorded in H-VOLC-707f6c, in which
    case the sampler fix is the deliverable and outranks the audit.

