idea:
  id: IDEA-20260809-c48d6a
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-HYBRID-cdf2b2
  goal_id: GOAL-HYBRID-001
  title: >-
    Implement the deployed and proposed combiners from their specifications and
    fill their rows cell by cell, with a derivation or an artifact in every cell
  class: measurement
  claim: >-
    The binding table for the actually deployed hybrid construction and its
    proposed alternatives can be filled completely: each cell is either a
    derivation from that combiner's key-derivation inputs or a literal
    certificate. The claim is that no cell needs to be left as an assertion, and
    that at least one cell differs from what a reader would assume from the
    combiner's advertised security property.
  mechanism: >-
    Implement each combiner exactly as specified, validate on published vectors,
    then for each taxonomy property either derive the outcome from the lattice
    position or attempt the certificate directly.
  why_not_a_renamed_known_approach: >-
    Each combiner's own paper states its properties. Filling one table across
    combiners with a uniform standard of evidence per cell — derivation or
    artifact, never assertion — is the contribution.
  predictions:
  - observable: number of cells requiring an artifact rather than a derivation
    metric: count
    predicted: A minority; most cells should follow from the lattice, which is why the lattice is built first.
  - observable: cells differing from the advertised property
    metric: count with explanation
    predicted: >-
      At least one, most likely because an advertised property is stated under
      honest key generation while the taxonomy's version quantifies over
      adversarial generation. That distinction is the likely finding.
  minimal_test: >-
    Implement at least two combiners, validate on vectors, fill every cell with
    derivation or artifact, and list any cell that could not be settled.
  controls:
  - 'VECTOR VALIDATION per combiner before any cell is filled.'
  - 'INDEPENDENT VERIFICATION of every artifact by a second implementation.'
  falsification_conditions:
  - A combiner cannot be implemented faithfully from its specification, which is recorded as a specification gap rather than as a binding result.
  - Cells cannot be settled either way, in which case they are reported as undetermined.
  interpretation_limits: >-
    Specification-level constructions implemented by this program. No deployed TLS
    implementation, browser or service is tested or named, and a binding failure
    is never presented as a confidentiality break.
  sota_delta: 'No attack. Delta: one uniformly evidenced table across combiners.'
  dominated_by: Downstream of IDEA-20260809-c41b2e; not dominated by any corpus record.
  estimated_cost: Implementation medium; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep: no combiner records. WEB NOT CHECKED.'
  source_refs:
  - Hybrid key exchange drafts and X-Wing -- RECALLED, REQUIRED READS.
