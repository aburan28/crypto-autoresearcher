idea:
  id: IDEA-20260816-29e9bc
  question_id: RQ-SIMSPK-f6a6c0
  added: '2026-08-16'
  title: 'Algebraic-degree reach over the constant space: propagate the bit-based division property
    of the AND-RX round exhaustively at word sizes where the propagation set fits in memory, cross-check
    every symbolic result against a directly measured integral distinguisher over full structured
    plaintext sets, and place the standardized triple in the resulting distribution of balanced-bit
    round counts.'
  class: mechanism
  claim: '(A) Integral and division-property reach is the portfolio measure with the cleanest independent
    cross-check available anywhere in this campaign: the symbolic propagation predicts that a specific
    output bit is balanced after r rounds, and that prediction can be tested directly by encrypting
    a full structured plaintext set and XOR-summing the bit. Two instruments, one integer, with no
    shared code path. This makes it the natural place to establish that the campaign''s symbolic machinery
    is measuring the cipher rather than itself. (B) The claim is that bit-based division property
    propagates through the AND-RX round by rules that are exact for the copy, XOR and rotation operations
    and specific to the AND at the rotation offsets, so the propagation is a deterministic function
    of the rotation triple, and r_div(a,b,c), the largest round count after which some output bit
    is still provably balanced, is computable exhaustively over the constant space at small word sizes.
    (C) The claim is that the symbolic and experimental instruments must agree in one direction and
    may legitimately disagree in the other: division property is sound for balancedness, so a bit
    predicted balanced must measure balanced, while a bit not predicted balanced may still measure
    balanced because the propagation over-approximates. A predicted-balanced bit that measures unbalanced
    is a hard falsification of the propagation implementation and is the single most valuable outcome
    the run can produce. (D) The claim is that the resulting distribution of r_div over the constant
    space, with its tie structure, gives the standardized triple a percentile under a measure the
    RQ names as part of the portfolio prior evaluation did not cover. (E) NOT CLAIMED: that r_div
    is the true integral reach rather than a lower bound; that the propagation rules used are the
    tightest available; that any triple is anomalous or unremarkable; that a balanced bit at r rounds
    implies anything about attacking r or more rounds; and no attack, distinguisher or security consequence
    for any variant.'
  mechanism: 'STAGE A, propagation rules: state the bit-based division property transition rules for
    the three primitives present. Copy, when a bit feeds two places, splits the exponent vector; XOR
    merges by addition with a saturation condition; rotation permutes coordinates exactly. The AND
    at offsets a and b couples coordinates i - a and i - b into coordinate i and is where the rotation
    triple enters. Freeze the rules in a preregistration file with a hash. STAGE B, propagation engine:
    represent the division property as a set K of exponent vectors in {0,1}^{2n}, held as a set of
    integers, and propagate round by round, applying the standard reduction that removes any vector
    dominated by another in the set, which is what keeps K from exploding. Track the round at which
    every output bit''s balancedness prediction is lost. STAGE C, experimental cross-check: for the
    same constant and the same structured input set implied by the initial division property, encrypt
    all 2^d plaintexts through r rounds with random keys and XOR-sum each output bit. Every bit predicted
    balanced must sum to zero for every key tested; any nonzero sum is a hard falsification. STAGE
    D, exhaustive sweep over orbit representatives at word sizes 4, 6 and 8, producing the r_div distribution
    and the standardized triple''s percentile. STAGE E, nulls in the same invocation: a random-constant
    family giving r_div''s spread when nothing is designed; a matched random quadratic round function
    with the same number of AND gates, testing whether r_div is a property of the rotation geometry
    or merely of having that many quadratic terms; and a linear round-function control whose r_div
    must be maximal since a linear map preserves balancedness indefinitely.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril SIMSPK over ledger/proposals, ledger/hypotheses and experiments; grep -ril 'division
      property' over ledger/proposals, with the title block of IDEA-20260805-33a11e read in full;
      grep -ril 'integral' over ledger/proposals cross-referenced against area codes in filenames;
      read RQ-SIMSPK-f6a6c0's methods and targets sections, which name integral and division-property
      reach as a portfolio member; read GOAL-SIMSPK-001's completion criteria; read KN-LIT-5292; checked
      this environment for numpy, z3, python-sat and pulp, all absent, which rules out the usual MILP
      formulation of division-property propagation and forces the set-based engine described here.
    results: 'No proposal under RQ-SIMSPK-f6a6c0. Every division-property hit is in the AES area:
      IDEA-20260805-33a11e is the nearest, titled around algebraic degree in the KEY argument and
      a forced saturation index for the AES key schedule deciding at zero compute how many round keys
      a key-varying integral or division-property object can survive. That is a zero-compute bound
      on one fixed cipher''s key schedule; this entry is an exhaustive sweep of a data-side propagation
      over a parameter space with an experimental cross-check, sharing only the word division property.
      The remaining IDEA-20260805 hits are AES structural proposals. RQ-SIMSPK-f6a6c0 names integral
      and division-property reach explicitly as part of the FULL computable portfolio that, as far
      as this program''s corpus shows, prior evaluation did not cover, making this one of the RQ''s
      named extension axes. The absence of any MILP solver in this environment is a material constraint
      recorded here because it dictates the instrument.'
    verdict: 'UNVERIFIED. No claim is made about what any external publication contains regarding
      division property for SIMON. Assembled from known parts: bit-based division property and its
      copy, XOR and AND transition rules are standard; dominance reduction of the propagation set
      is standard; integral distinguisher verification by XOR-summing a structured set is standard.
      Claimed new only in combination and only locally: the propagation run as an exhaustive parameter
      sweep rather than against one cipher, the paired experimental cross-check executed in the same
      invocation so the symbolic instrument is validated on every constant rather than on one, and
      the matched random-quadratic null that separates rotation geometry from mere quadratic-term
      count.'
  object_first_candidate:
    tracked_object: 'The division property of the state: a set K of exponent vectors in {0,1}^{2n},
      where membership of a vector u records that the sum over the structured input set of the monomial
      x^u may be nonzero. Equivalently, the surviving monomial support of the cipher''s algebraic
      normal form restricted to the chosen structured set. What is followed through the computation
      is that set, reduced at each round by removing vectors dominated by others.'
    lossiness: 'Genuinely lossy. Passing from the algebraic normal form to the division property discards
      every coefficient, retaining only which monomials may appear, and it discards which specific
      plaintexts are in the structured set beyond the set''s division property. The discard is compatible
      with the operations because the transition rules are derived from how monomials can be produced:
      rotation permutes exponent coordinates exactly, XOR merges monomial supports exactly, and the
      AND produces monomials whose exponents are unions of the inputs'' exponents, which is where
      over-approximation enters. The retained part therefore propagates deterministically as a one-sided
      over-approximation, sound for balancedness: if no vector in K is the all-ones vector restricted
      to an output bit, that bit is provably balanced. The over-approximation is the price and it
      is stated everywhere, because reading a lost balancedness prediction as a proof of imbalance
      is the characteristic misuse.'
    propagation: One round acts on K as follows. The left branch is copied into the round function
      and into the branch swap, which splits each vector's left-half exponents across the two destinations.
      The round function applies rotation, which permutes the exponent coordinates by the same index
      map the rotation induces; then the AND at offsets a and b, which maps a pair of input exponent
      coordinates at positions i - a and i - b to output coordinate i, generating for each output
      the union of contributing input exponents; then XOR with S^c, which merges the resulting sets.
      The Feistel XOR merges the round function's output division property with the right branch's.
      After each round the set is reduced by dominance so that only minimal vectors remain, which
      is the sole thing keeping the propagation tractable and is itself an exact operation rather
      than an approximation.
    survival_score: 'The object survives until K''s minimal elements reach the all-ones vector on
      every output bit, at which point no bit is provably balanced and the object has dissolved. The
      concrete number is r_div(a,b,c), the largest r such that at least one output bit is predicted
      balanced after r rounds. A companion number, |K_r|, the reduced set size per round, is reported
      because it governs feasibility: if |K_r| grows past the declared memory ceiling the propagation
      is halted and the result is a budget outcome, never a statement that no balanced bit exists.
      Expectation is r_div in the single digits at small word sizes, with the interest lying in its
      variation across the constant space rather than in its absolute value.'
  null_object_control: 'Three nulls, all executable in the same invocation as the signal arm. The
    primary null object is a rotation triple drawn uniformly from (Z/n)^3, propagated identically,
    giving the r_div distribution over random constants; a distribution with fewer than two distinct
    values means the measure cannot rank at that word size and no percentile may be quoted. The second
    null is a matched random quadratic round function with the same number of AND gates and the same
    output width but with the AND inputs wired to uniformly random bit positions rather than to rotations:
    this separates whether r_div reflects rotation geometry or merely the count of quadratic terms,
    and the signal arm means nothing about rotations unless the two distributions differ. The third
    null is a purely linear round function, for which balancedness is preserved indefinitely and r_div
    must therefore hit the round ceiling; if it does not, the propagation engine is faulty and the
    signal arm is void. Alongside these, the experimental arm provides a null of a different kind:
    XOR-sums of bits NOT predicted balanced, measured on random keys, which should be nonzero for
    at least some keys, confirming the experiment can detect imbalance at all.'
  discriminated_from:
  - IDEA-20260805-33a11e bounds, at zero compute, how many round keys a key-varying integral or division-property
    object can survive in the AES key schedule. It is a key-side bound on one fixed cipher; this entry
    is a data-side propagation swept over a cipher parameter space with an experimental cross-check
    on every constant, and neither result implies the other.
  - Generic MILP-based division-property search, the standard modern instrument, encodes propagation
    as an integer program and asks a solver. This environment has no MILP solver, so the instrument
    here is an explicit set-based propagation with dominance reduction, which is exact where it completes
    and memory-bounded where it does not, and whose failure mode is a declared memory ceiling rather
    than a solver timeout.
  - The impossible-differential companion contract propagates difference supports and is sound for
    impossibility. Division property propagates monomial supports and is sound for balancedness. The
    two have opposite soundness polarity and different objects, and the portfolio treats them as independent
    measures precisely because a constant can rank differently under each.
  - An integral attack, which uses a balanced-bit distinguisher plus key guessing to recover key material,
    is explicitly out of scope. This entry computes only the distinguisher's reach as a score and
    produces no key-recovery procedure, no data complexity and no attack.
  - KN-LIT-5292's stub records differential and linear content only. This proposal asserts nothing
    about whether division property was studied there and treats any recovered text as a comparison.
  assumptions:
  - The round function has the form f(x) = (S^a x AND S^b x) XOR S^c x within a Feistel with a key
    XOR; pinned in STAGE 0 against the specification and its test vectors.
  - 'The bit-based division property transition rules for copy, XOR, rotation and AND, as frozen in
    STAGE A, are correct. This is not assumed blindly: it is exactly what the experimental cross-check
    tests, on every constant, in the same invocation.'
  - Dominance reduction of the propagation set is exact and loses no balancedness prediction, which
    is checked at word size 4 by propagating with and without reduction and comparing the resulting
    predictions.
  - Round keys XORed into the state do not affect division-property propagation for a data-side integral,
    which is standard and is checked experimentally by XOR-summing under several random keys.
  - Orbit representatives from the symmetry-quotient contract are used where available; otherwise
    the raw grid is used and the multiplicity distortion is named.
  predictions:
  - metric: number of (constant, round, output bit) triples where the propagation predicts balanced
      but the experimental XOR-sum is nonzero for some tested key
    direction: lower
    minimum_effect: 0
  - metric: r_div of the purely linear round-function control
    direction: higher
    minimum_effect: 'forced to the round ceiling: a linear round preserves balancedness indefinitely,
      so any smaller value is an implementation fault and halts the run'
  - metric: number of distinct r_div values over the random-constant null family at each tested word
      size
    direction: higher
    minimum_effect: 2
  - metric: difference between the r_div distribution of the rotation family and that of the matched
      random-quadratic family with equal AND-gate count
    direction: different
    minimum_effect: 'explicit refusal to pre-commit a magnitude: the campaign has no prior measurement
      of either distribution, so any effect size named now would be fabricated. What is pre-committed
      is that both distributions are reported in full with their tie structures and that no statement
      attributing r_div to rotation geometry is made unless the two differ beyond the reported resampling
      band.'
  minimal_test:
    design: 'Fix word size n = 4, block 8 bits. The division-property set lives in {0,1}^8, so at
      most 256 vectors before reduction, and propagation is trivially exact with no memory risk. There
      are 64 triples, so the entire constant space propagates in under a second. The experimental
      cross-check at this size is complete rather than sampled: the full codebook is 256 plaintexts,
      so every structured set of dimension d up to 8 can be encrypted exhaustively under, say, 32
      random keys, and every predicted-balanced bit can be verified for every constant, every round
      and every key. The whole thing costs on the order of 64 times 256 times 32 times 8 round evaluations,
      roughly 4 million, seconds in pure Python. Run the linear control, the matched random-quadratic
      null and the random-constant null in the same invocation. The single discriminating output is
      the count of predicted-balanced-but-measured-nonzero events: zero licenses the propagation engine
      for larger word sizes, and any nonzero count localizes a defect in the frozen rules with an
      exact witness triple, which is the most useful failure this campaign could buy for a few seconds
      of compute.'
    controls:
    - Experimental XOR-sum cross-check of every predicted-balanced bit, under multiple random keys,
      executed in the same invocation as the symbolic propagation and against a separately written
      cipher implementation.
    - Purely linear round-function control whose r_div must reach the round ceiling.
    - Matched random-quadratic round function with equal AND-gate count, separating rotation geometry
      from quadratic-term count.
    - Random-constant null family establishing r_div's spread when nothing is designed.
    - 'Dominance-reduction control at n = 4: propagate with and without reduction and confirm identical
      balancedness predictions.'
    - 'Detection-power control: XOR-sums of bits NOT predicted balanced must be nonzero for at least
      some keys, confirming the experiment can see imbalance.'
    required_metrics:
    - count of predicted-balanced-but-measured-nonzero events, an exact integer, with witness triples
    - r_div per orbit representative per word size
    - reduced propagation set size |K_r| per round, and the round at which any memory ceiling binds
    - number of distinct r_div values and tie count at the standardized triple's value
    - r_div distribution on the random-constant null and on the matched random-quadratic null
    - r_div of the linear control
    - wall-clock seconds and peak resident memory per stage
  falsification_conditions:
  - Any predicted-balanced bit measuring nonzero under any tested key, which falsifies the frozen
    propagation rules or their implementation and voids every r_div computed from them.
  - The linear control failing to reach the round ceiling, which shows the propagation engine loses
    balancedness spuriously.
  - Dominance reduction changing any balancedness prediction at n = 4, which invalidates the reduction
    step used at all larger sizes.
  - Fewer than 2 distinct r_div values over the random-constant null family, which withdraws the measure's
    licence to rank at that word size.
  - The detection-power control finding no nonzero XOR-sums anywhere, which means the experiment cannot
    detect imbalance and its agreement with the symbolic arm is vacuous.
  - The reduced set size exceeding the declared memory ceiling before r_div is determined for a majority
    of constants, in which case the sweep is a budget outcome and no distribution may be reported
    at that word size.
  confounders:
  - The choice of initial structured set, its dimension d and which bit positions are active, strongly
    influences r_div, and a set chosen to favour a particular rotation geometry would manufacture
    a ranking. The initial sets are enumerated systematically over all dimension-d coordinate subsets
    at small n and the enumeration rule is frozen before the sweep.
  - Dominance reduction is exact for balancedness but changes the set size, so |K_r| as a secondary
    metric is a property of the reduction as much as of the cipher and may not be interpreted as a
    complexity measure of the constant.
  - A matched random-quadratic null with AND inputs wired at random may have accidentally poor diffusion,
    biasing the comparison; multiple independent draws are used and their spread is reported.
  - At small word sizes the round ceiling is reached quickly and r_div saturates for many constants,
    producing heavy ties that make percentiles unstable; the tie count travels with every rank.
  - Using the raw grid instead of orbit representatives inflates spread by counting symmetric duplicates
    and shifts the standardized triple's percentile for reasons unrelated to the measure.
  interpretation_limits:
  - r_div is a lower bound on integral reach under one set of over-approximating propagation rules
    and one enumerated family of initial structured sets. It is not the true reach and may not be
    quoted as one.
  - A bit predicted balanced is provably balanced under the model; a bit not predicted balanced is
    not thereby unbalanced, and no record may read the absence of a prediction as a positive claim.
  - A balanced bit at r rounds is not an attack on r rounds. No key recovery, data complexity or security
    statement about any variant follows.
  - All results are scoped to the tested word sizes, the pinned round-function form, the frozen initial-set
    enumeration and the round ceiling reached, and nothing about designer intent follows in either
    direction.
  - The experimental cross-check validates the symbolic instrument only on the constants, rounds and
    keys actually tested; agreement there does not certify the rules at word sizes or round counts
    not run.
  target_complexity:
    time_exponent: 'No attack exponent is claimed. Instrument cost: symbolic propagation is O(r |K|
      n) set operations per constant with |K| bounded by the declared ceiling; the experimental cross-check
      costs 2^d encryptions per (constant, key, round), which is 2^8 at n = 4 and 2^{16} at n = 8,
      so the cross-check rather than the propagation dominates and sets the word-size limit.'
    memory_exponent: No attack memory exponent is claimed. The propagation set holds at most the declared
      ceiling of vectors, each one integer of 2n bits; the declared ceiling is 200000 vectors, a few
      tens of mebibytes in Python, and exceeding it halts the constant and records a budget outcome.
    best_known: 'The incumbent for this measure inside the campaign is nothing: RQ-SIMSPK-f6a6c0 records
      integral and division-property reach as part of the portfolio prior evaluation did not cover
      as far as this corpus shows, and no value exists here for any constant. The incumbent instrument
      in general practice is MILP-based propagation, which is unavailable in this environment; the
      set-based engine is used instead and its limitation, memory rather than solver time, is reported
      rather than hidden.'
    hidden_overhead: 'Hidden in the lower-order terms: the experimental cross-check costs 2^d encryptions
      and grows with word size far faster than the propagation does, so the binding constraint at
      n = 8 and above is the validation rather than the measurement, and dropping the validation to
      reach larger sizes would silently remove the only thing making the symbolic arm trustworthy.
      Hidden in the human cost: freezing the initial-structured-set enumeration before seeing which
      sets favour which constants.'
  dominated_by: 'n/a (no result claimed). Pareto check performed across time, memory and data/queries:
    no attack, distinguisher-based procedure or query-bounded algorithm is produced, so no frontier
    row exists on any axis. Among instruments, MILP-based propagation would dominate the set-based
    engine on reach at every word size where a solver is available and is simply unavailable here;
    exhaustive experimental verification dominates both on certainty at word sizes where the full
    codebook is encryptable, roughly n <= 8, and that crossover is reported.'
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverables are
    the exact integer count of predicted-balanced-but-measured-nonzero events, predicted zero, the
    r_div distribution over the constant space with its tie structure at each tested word size, the
    same on two independent nulls, and the word size at which the experimental cross-check stops being
    affordable in this environment. No time, memory or data complexity is compared against any cryptanalytic
    frontier because none is produced.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'Part (A), that the paired symbolic and experimental instruments give
    an unusually strong validation: 0.9, this is structural. Part (B), that the frozen propagation
    rules are implemented correctly on the first attempt: 0.5, because the copy-and-split bookkeeping
    through a Feistel is exactly the kind of thing that is wrong the first time; the cross-check exists
    to catch it and a caught error at n = 4 is a cheap, valuable outcome rather than a failure. Part
    (C), that agreement holds once implementation is correct: 0.9, since division property is sound
    for balancedness by construction. Part (D), that r_div has at least two distinct values across
    the constant space and can rank anything: 0.5, with the real risk that at small word sizes r_div
    saturates for nearly all constants; a saturated distribution is a clean measured obstruction that
    tells the campaign this measure needs larger word sizes than the cross-check can afford. That
    the matched random-quadratic null differs from the rotation family: 0.4, and a non-difference
    would be the more interesting result, since it would say r_div counts AND gates rather than reading
    rotation geometry.'
