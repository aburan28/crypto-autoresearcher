    compute: low
  recommended_priority: medium-high
  honest_prior_of_survival: >-
    0.55 that at least one abort site in the signing procedure has a
    secret-reading failure condition. It is not lower because a retry loop
    around a norm equation whose target is built from the secret ideal is the
    natural shape of the recalled algorithm, and because the scheme's own stated
    weakness is the intricacy of the objects manipulated in ideal-to-isogeny
    conversion - intricacy is where conditional branches live. It is not higher
    because competent designers know the Fiat-Shamir-with-aborts lesson, because
    the redesign is reported (RELAYED, NOT READ) to sample the response from a
    more natural distribution, and because the whole recalled picture may simply
    be wrong.
    SEPARATELY, 0.10 that a measured CV exceeds 2^-32 at toy scale, and 0.03
    that anything survives the scale question in HEUR-AB-3. The audit is
    proposed on the asymmetry: a derived closure costs a day of reading, and the
    tail outcome is a data-axis attack on a Round-3 candidate.
