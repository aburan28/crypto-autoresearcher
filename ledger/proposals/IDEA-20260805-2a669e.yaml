    literature, since no specification or paper has been read; that gap is why
    novelty_status is unverified.
  sota_delta: >-
    No attack. The quantitative deliverable is a frozen conversion, stated
    before any measurement, from one measured number to a decision:
    CV -> N_detect = Theta(CV^-2), with thresholds fixed at CV <= 2^-64 (dead at
    any budget), CV in [2^-64, 2^-32] (dead at realistic budgets, alive in
    principle), CV >= 2^-32 (N_detect <= 2^64, routed to rule-12 review). No
    record in this corpus states such a conversion for any isogeny scheme, and
    the corpus contains zero SQISIGN-area records of any kind.

  estimated_cost:
    implementation: >-
      Stage 0-1: none beyond reading and algebra, and they may settle the
      question outright. Stage 2: MEDIUM-HIGH and deliberately gated - it needs
      only the identified abort site, not the whole scheme, but a norm-equation
      solvability site still needs quaternion arithmetic, and this container has
