idea:
  id: IDEA-20260905-d8c55f
  title: Fitting-minor certificates for honest change of characteristic
  class: representation
  claim: 'For a fixed integral polynomial presentation at bounded degree D, exact minors can certify all but finitely
    many exceptional characteristics for its Macaulay rank. Conjecture: the earliest Semaev-chain syzygy classes
    separate into integral free classes and characteristic-torsion classes, providing a precise transfer boundary
    without extrapolating the Boolean ladder.'
  mechanism: A Macaulay matrix over Z has a rational rank; a nonzero maximal minor certifies the same lower rank
    outside its prime divisors, while larger minors vanish identically. The module cokernel and its Fitting ideals
    localize torsion. A Boolean quotient is not merely a characteristic specialization of an arbitrary prime-field
    digit presentation, so an explicit common integral model is mandatory. Where no common model exists, the transfer
    statement is unavailable. Where it exists, characteristic-specific torsion becomes a reusable positive resource
    for understanding why a degree deficit appears only in one field.
  question_id: RQ-DREG-001
  question_ids:
  - RQ-DREG-001
  - RQ-SDEG-001
  - RQ-ECDLP-001
  goal_ids:
