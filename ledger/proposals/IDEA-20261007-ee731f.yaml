idea:
  id: IDEA-20261007-ee731f
  question_id: RQ-TORS-8c7b79
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    2-division cubic on y^2 = x^3 + 8x + 9 over F_61 has 0, 1, or 3 roots
  class: control
  claim: >-
    Let E be y^2 = x^3 + 8x + 9 over F_61. Let Delta = -16(4*8^3 + 27*9^2).
    If Delta = 0 the model is singular and the run is an invalid setup.
    Otherwise let r be the number of distinct roots in F_61 of
    x^3 + 8x + 9, and let s be the number of affine points P with 2P = O.
    Then r is in {0, 1, 3}, r is not 2, and r = s. A value r = 2 on a
    nonsingular model, or r different from s, is a negative. No discrete
    logarithm is computed, and the generic-group exponent 1/2 is unchanged.
  mechanism: >-
    PAIR (representation, Sigma): the representation is the cubic
    x^3 + Ax + B with A = 8 and B = 9. Sigma is the set of its roots in
    F_61. A root is the x-coordinate of an affine point fixed by negation.
    The cubic has no x^2 term, so the roots sum to 0. Two distinct roots
    force the third, which is their sum's negative. Exactly two distinct
    roots would require a repeated root, and a repeated root shares a
    zero with the derivative 3x^2 + A, which is the singular case. The
    projection keeps the integer r and discards which roots occurred.
    Explanation A: a nonsingular model has r in {0, 1, 3} and that integer
    equals the number of affine points of order dividing 2. Explanation B:
    a nonsingular model has exactly two distinct roots, so the
    sum-to-zero constraint failed or the point counter disagrees. No rho
    walk is run.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs a square-root number of group
        operations. This idea does not beat that bound.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        An automorphism group of order m reduces rho iterations by
        sqrt(m). Negation is the order-2 case. This idea does not
        measure that discount.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
    - ref: RQ-TORS-8c7b79
      provenance: internal
      claim: >-
        The question asks whether ell-torsion for ell different from
        the group order carries public information about the discrete
        log or about attack cost.
      verified_by: ledger/questions/RQ-TORS-8c7b79.yaml
  assumptions:
    - The model is the short-Weierstrass equation written above. A change of variables is a different test.
    - Characteristic is not 2 or 3. The prime is 61.
    - A singular model is an invalid setup, not the negative.
  predictions:
    - metric: number of distinct F_61-roots of x^3 + 8x + 9
      direction: different
      minimum_effect: an element of {0, 1, 3}
    - metric: absolute difference between that root count and the number of affine points with 2P = O
      direction: lower
      minimum_effect: exactly 0
  minimal_test:
    design: >-
      Over F_61, evaluate the discriminant. If it is 0, name the setup
      invalid and stop. Otherwise test every x in 0 through 60 for a
      root of x^3 + 8x + 9, and list the affine points with y = 0.
      Compare the two integers. Do not run Pollard rho.
    controls:
      - The point at infinity is not counted as an affine root.
      - A repeated root is recorded with multiplicity one in the distinct-root count and forces the singular check.
      - The same prime and the same coefficients are used for the root scan and the point scan.
    required_metrics:
      - root_count
      - affine_two_torsion_count
      - discriminant
  falsification_conditions:
    - The model is nonsingular and root_count is 2.
    - The model is nonsingular and root_count differs from affine_two_torsion_count.
  confounders:
    - Counting a double root twice can invent a count of 2. The metric is distinct roots.
    - Points with y different from 0 are not 2-torsion. Including them inflates s.
  interpretation_limits:
    - A count in {0, 1, 3} does not change the exponent 1/2.
    - No discrete logarithm is computed.
    - The test is this one model at p = 61 only.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a cubic x^3 + Ax + B over a field of characteristic not 2
        or 3, a repeated root is equivalent to a shared root with
        3x^2 + A, which is the vanishing of the discriminant of
        y^2 = x^3 + Ax + B. A nonsingular model therefore has 0, 1, or
        3 distinct roots in the algebraic closure, and the count inside
        F_p is still in that set.
      rigorous_support: >-
        The derivative test is the usual singular-point criterion for
        a short-Weierstrass model. KR-RHO-13bf67, opened, is the
        exponent ceiling and does not state this root count.
      validation_plan: >-
        At this single model, record the discriminant, the distinct
        root count, and the affine 2-torsion count. If the discriminant
        is nonzero and the root count is 2, H1 is false at p = 61. No
        second prime is claimed.
  target_complexity:
    time_exponent: >-
      Sixty-one evaluations of one cubic. The generic-group exponent
      1/2 is unchanged.
    memory_exponent: O(1) field elements
    best_known: >-
      KR-RHO-13bf67, opened, gives the square-root generic bound.
      KR-RHO-0528e7, opened, prices negation at sqrt(2). This count
      beats neither.
    hidden_overhead: >-
      No o(1) term. The test is one model at p = 61.
    tradeoff_note: >-
      No time-memory tradeoff. The scan is exhaustive in x.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-0528e7
      - KR-RHO-755e35
    nearest:
      - ref: KR-RHO-0528e7
        provenance: internal
        relation: adjacent
        delta: >-
          The opened row prices an automorphism of order 2 at a
          constant sqrt(2). This idea adds the integer root count of
          one 2-division cubic at p = 61 and does not change the
          exponent.
  dominated_by: >-
    The generic-group bound in KR-RHO-13bf67 dominates any reading of
    this root count as an attack. The automorphism discount in
    KR-RHO-0528e7 dominates any reading of the negation points as a
    new walk. The count does not beat either baseline.
  sota_delta: >-
    No exponent is derived. The quantitative delta is the pair
    (root_count, affine_two_torsion_count), predicted to lie in
    {(0, 0), (1, 1), (3, 3)} when the discriminant is nonzero, at the
    prime 61. The generic-group exponent stays 1/2.
