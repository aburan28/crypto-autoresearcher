  assumptions:
    - >-
      A1. The advice is per-target (bits of log_P(Q)), exactly as 7169d6's
      statement 3 defines it; per-group preprocessing is a different
      resource with its own frontier and is not compared here.
    - >-
      A2. 7169d6's exponent for the advised route is taken as input
      including its own proof obligations; if 7169d6's mu = 0 reconciliation
      fails, this record's four-list column is void and its kangaroo column
      stands.
    - A3. Kangaroo's exponent 1/2 in |W| is taken as textbook (H1).
    - >-
      A4. Single target. Multi-target reuse of the join output is a named
      open axis (B64-DER-6) and is excluded.
    - A5. N prime; no exact nontrivial quotient of G is assumed.

  proof_search_map:
    bottleneck: >-
      The lane's Pareto comparisons omit the only control that matters for
      a conditional route: the cheapest algorithm consuming the same
      resource. Supplying it changes the verdict on the advised branch from
      'a new point on the T^2 M = N curve' (7169d6) to 'dominated on both
      axes by an existing algorithm', which is decision-changing.
    baseline_embedding:
      parameter_slice: >-
        mu = 0: kangaroo on the whole group is rho up to a constant;
        four-list is BSGS-like at (1/2, 1/2). Both at exponent 1/2, the
        four-list side dominated on memory already.
      reproduction_check: >-
        Symbolic: max((1+0)/4, (1-0)/2) = 1/2 and (1-0)/2 = 1/2. Frozen
        fixture: the six-row (T, M) table at mu in {0, 1/6, 1/3, 1/2, 2/3, 1}
        must show equal time on the first three rows and strictly smaller
        kangaroo time on the last three, with kangaroo memory 0 on all six.
    observation_collision:
      observable: The time exponent (1-mu)/2 for mu <= 1/3.
      distinct_preimage_search: >-
        Two algorithms share it: kangaroo on W and the advised four-list
        route. They differ in memory (0 versus (1-mu)/2) and in whether the
        concentration set is sampled directly or through pair sums. A
        report quoting only the time exponent cannot distinguish them,
        which is why the memory column is mandatory in the table.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The same-resource control as a certificate row: for each
          conditional branch of the lane (advice about x; computable key;
          oracle), the cheapest known consumer of that resource and its
          (T, M).
        predicted_gain: >-
          Turns a per-record Pareto argument into a table with one row per
          resource; the lane's advised branch is dominated in the first
          row, and its key branch is dominated by the Fourier cascade in
          the second.
      - transform: observable_fiber
        proposed_object: >-
          Hold the resource fixed (a size-|W| concentration set) and vary
          the ambient group: prime-order G (interval, directly samplable)
          versus F_2^n (subgroup coset, reachable only through the join).
        predicted_gain: >-
          Names the structural reason the four-list machinery is worthless
          on one and valuable on the other: samplability of the
          concentration set from its description.
    quantifier_order: >-
      FOR ALL prime N, FOR ALL mu in [0, 1], FOR ALL Q, given the top
      mu*log2(N) bits of log_P(Q): THERE EXISTS an algorithm (kangaroo on
      W) with time exponent (1-mu)/2 and memory O(log N), and the advised
      four-list route has time exponent max((1+mu)/4, (1-mu)/2) and memory
      exponent max((1+mu)/4, (1-mu)/2); the first weakly dominates the
      second on time and strictly on memory. The witness does not depend on
      Q or on the list randomness. NOT CLAIMED: anything about per-group
      preprocessing, multi-target reuse, or resources other than bits of x.
    method_ceiling:
      strongest_certifiable_claim: >-
        Pareto dominance of one conditional branch by one existing
        algorithm on two typed axes plus one typed resource. It can NEVER
        certify that no four-list route beats kangaroo under a DIFFERENT
        resource, and it is not an ECDLP lower bound.
      nearby_object_control: >-
        Where the dominance FAILS: F_2^{3m} with random-oracle lists and
        the prefix quotient as the resource. The cheapest two-list consumer
        is 2^{3m/2}, Wagner's four-list route is 2^{m}; the four-list
        structure contributes a factor 2^{m/2} and the control passes it.
        The load-bearing difference is that the XOR concentration set is a
        subgroup coset not samplable from the oracle, whereas a
        prime-order interval is samplable as Q + [i]P once its endpoints
        are known. A version of this argument that also 'dominated' Wagner
        on XOR would prove too much.
    proof_obligations:
      - claim: Kangaroo on an interval of size |W| costs Theta(sqrt(|W|)) with O(log N) memory.
        responsibility: baseline
      - claim: >-
          max((1+mu)/4, (1-mu)/2) equals (1-mu)/2 iff mu <= 1/3, and exceeds
          it otherwise.
        responsibility: strictness
      - claim: The advised route's memory exponent equals its time exponent at every mu.
        responsibility: memory
      - claim: The four-list route's R(W) is never below 1 on the balance law.
        responsibility: correctness
      - claim: The dominance uses only known, typed axes (JPR-REV-3 compliance).
        responsibility: scope
      - claim: On F_2^{3m} with random-oracle lists the same-resource control passes Wagner.
        responsibility: feasibility
      - claim: >-
          The advice is per-target and the preprocessing frontier is not
          the comparison row (interface with 7169d6's open obligation on
          per-group advice, which stays open).
        responsibility: interface
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The resource consumed by a conditional route (here: an interval for
      x), and the cheapest algorithm consuming it.
    lossiness: >-
      Not a projection of the group state; this is a control on cost
      claims, and the lossy-projection test is not applicable. Stated
      rather than skipped, per docs/inventor-protocol.md section 2.
    propagation: Not applicable.
    survival_score: Not applicable.

  null_object_control: >-
    The record IS the null-object control for the advised branch. Its own
    controls: mu = 0 (both sides at exponent 1/2, blocking); F_2^{3m} with
    random-oracle lists (Wagner must beat the same-resource two-list
    method, blocking, proves-too-much); the guessed variant of 7169d6
    (kangaroo with guessed top bits costs 2^{k} sqrt(N/2^{k}) = sqrt(N 2^{k}),
    worse than rho, consistent with 7169d6's 1/2 + mu/2 ceiling and with
    this record). DECAY PARAMETER: mu; the four-list-minus-kangaroo time
    gap must be exactly 0 up to mu = 1/3 and grow as (1+mu)/4 - (1-mu)/2 =
    (3mu - 1)/4 beyond; any other shape is an arithmetic error.

  discriminated_from:
    - >-
      IDEA-20260829-7169d6. NEAREST RECORD. It derives the advised
      exponent and lists kangaroo as 'not applicable' with a remark that
      the comparison should be revisited. EXACT DELTA: this record performs
      the revisit, finds dominance at every mu with the crossing at 1/3,
      and converts the finding into a certificate row. 7169d6's positive
      corollary ('(1/3)log N bits buy exponent 1/3') is unchanged; what
      changes is that those bits buy the same exponent from kangaroo at no
      memory, so the corollary prices the ADVICE, not the route.
    - >-
      IDEA-20260901-133fd3 (RQ-ECDLP-002). Prices re-randomisation into
      promise classes and gives kangaroo's ratio R = 2. It does not concern
      four-list routes; this record places the four-list route on its law
      as a consistency check and is otherwise independent.
    - >-
      IDEA-20260829-390ccc and IDEA-20260829-3f0f4b. Both list kangaroo as
      not applicable for the no-advice setting, correctly; this record
      concerns the advice setting only and does not contradict them.
    - >-
      IDEA-20260901-a66d70 and IDEA-20260901-d77aa8 (this session). Those
      supply the same-resource control for the COMPUTABLE-KEY branch (the
      Fourier cascade); this record supplies it for the ADVICE branch and
      names both in JPR-C8. Different resource, different baseline.

  predictions:
    - metric: M1 -- four-list time exponent minus kangaroo time exponent as a function of mu
      direction: different
      minimum_effect: >-
        FORCED: exactly 0 on [0, 1/3] and exactly (3mu - 1)/4 on (1/3, 1].
    - metric: M2 -- four-list memory exponent minus kangaroo memory exponent
      direction: higher
      minimum_effect: >-
        Exactly max((1+mu)/4, (1-mu)/2) > 0 at every mu; at mu = 1/3 it is
        1/3.
    - metric: M3 -- the four-list route's R(W) on the balance law
      direction: higher
      minimum_effect: >-
        At least 1 for every |W|; equal to Theta(1) for |W| >= N^{2/3} and
        N^{1/2}|W|^{-3/4} below. A value below 1 anywhere contradicts K3.
    - metric: M4 -- outcome of the same-resource control on F_2^{3m} with random-oracle lists
      direction: different
      minimum_effect: >-
        FORCED: Wagner at 2^{m} beats the two-list consumer at 2^{3m/2}; the
        control must PASS the four-list machinery there or it proves too
        much.

  minimal_test:
    design: >-
      STATIC AND SYMBOLIC ONLY, zero runs, inside the RQ claim boundary.
      Step 1: the mu = 0 reconciliation on both sides (Stage 0). Step 2:
      the six-row (T, M) table and the two inequalities (M1, M2). Step 3:
      the balance-law placement (M3). Step 4: the XOR control (M4).
      Step 5: write JPR-C8 with the two baselines named. No FUTURE
      experiment is needed; the record is complete at zero compute.
    controls:
      - mu = 0 slice on both sides (blocking baseline).
      - F_2^{3m} random-oracle Wagner versus two-list (blocking, proves-too-much).
      - Guessed-bits variant, must reproduce 7169d6's ceiling (consistency).
      - Mandatory Pareto rows, Pollard rho and BSGS, which both sides must dominate or tie appropriately.
    required_metrics:
      - six_row_time_memory_table_for_both_algorithms
      - crossing_point_of_the_two_time_exponents
      - four_list_R_of_W_as_a_closed_form
      - outcome_of_the_XOR_same_resource_control
      - text_of_JPR_C8_with_named_baselines_per_resource

  falsification_conditions:
    - >-
      F1. The mu = 0 slice fails on the four-list side. Inherited from
      7169d6; this record's four-list column is void, its kangaroo column
      stands, and the dominance claim is suspended.
    - >-
      F2. An independent derivation finds the four-list advised time
      exponent strictly below (1-mu)/2 for some mu in [0, 1/3]. Then the
      route beats kangaroo on the same advice, the record inverts into a
      positive lead, and it is routed to review-breakthrough rather than
      claimed.
    - >-
      F3. The XOR control 'dominates' Wagner. Proves too much; the record's
      control is wrong and void until repaired.
    - >-
      F4. Kangaroo's interval cost is shown to be worse than
      sqrt(|W|)^{1+delta} for some delta > 0. Textbook bound false; the
      record is void.

  confounders:
    - >-
      Constants: kangaroo's 2 versus the four-list route's own constants
      are not compared; only exponents are claimed, and at toy scale the
      constants would dominate any measurement, which is one reason none
      is proposed.
    - >-
      Per-target versus per-group advice: the two frontiers differ and the
      record is explicit that it treats per-target advice only.
    - >-
      Multi-target reuse: a four-list join output could in principle serve
      several targets; excluded and named.
    - >-
      Parallel span: both algorithms parallelize linearly in wall clock
      with total work unchanged, so the comparison is on total work; a
      report comparing wall clock at unequal processor counts would be a
      category error.

  interpretation_limits:
    - Zero runs, no implementation, no curve generation, no ECDLP result.
    - >-
      A dominance statement for one conditional branch under one resource;
      not an impossibility for four-list routes and not an ECDLP lower
      bound.
    - >-
      Depends on 7169d6's exponent for the four-list column; if that
      record is falsified the column is void.
    - No hypothesis, experiment, or goal status changes; no sub-rho mechanism is claimed.

  heuristic_assumptions:
    - id: H1
      statement: >-
        KANGAROO COST. On an interval W of size |W| in a prime-order group,
        the expected number of group operations to a collision in a
        distinguished-point kangaroo walk is (2 + o(1)) sqrt(|W|), uniformly
        for |W| >= (log N)^{C}.
      rigorous_support: >-
        The rigorous ingredient is the exact interval size; the
        distributional half is the standard random-walk collision analysis
        (birthday law for two walks in a set of size |W|), the same
        heuristic charged for rho in KN-TECH-006. Only the exponent 1/2 is
        load-bearing here.
      validation_plan: >-
        Symbolic only in this record. FUTURE (separate authority, not
        requested): at 24 to 34 bits, 200 seeds per cell, |W| in
        {N^{1/2}, N^{2/3}, N^{5/6}, N}, compare the empirical step count
        against 2 sqrt(|W|) with a Kolmogorov-Smirnov test against the
        Rayleigh-type law; tail check on the 99th percentile. No transfer
        assumption for the exponent.
    - id: H2
      statement: >-
        FOUR-LIST ADVISED EXPONENT. The advised route's expected time and
        memory are N^{max((1+mu)/4, (1-mu)/2)} as derived in 7169d6 from
        the 3f0f4b surface at gamma = 1, s = 1 - mu.
      rigorous_support: >-
        Inherits 3f0f4b's H1 (first-order independence of survival) and H2
        (Renyi-2 sufficiency) and 7169d6's H1 and H2. Not re-derived here;
        the record is explicit that it consumes that exponent.
      validation_plan: >-
        Symbolic re-derivation of the substitution as a check on 7169d6,
        including the branch crossing at mu = 1/3; any discrepancy is
        reported against 7169d6, not absorbed.

  target_complexity:
    time_exponent: >-
      No attack. Two conditional exponents are compared: kangaroo at
      (1-mu)/2 and four-list at max((1+mu)/4, (1-mu)/2), both given the
      advice; the record's number is their difference, 0 on [0, 1/3] and
