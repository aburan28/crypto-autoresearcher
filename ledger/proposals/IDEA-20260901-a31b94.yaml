idea:
  id: IDEA-20260901-a31b94
  question_id: RQ-ECDLP-160d89
  goal_id: null
  added: '2026-09-01'
  title: >-
    THE SAME-ADVICE CONTROL: with the top mu*log2(N) bits of the target
    logarithm supplied, the advised four-list route of IDEA-20260829-7169d6
    runs in N^{max((1+mu)/4, (1-mu)/2)} time and memory, while Pollard's
    kangaroo on the interval those bits define runs in N^{(1-mu)/2} time and
    O(log N) memory -- equal time for mu <= 1/3 and strictly less for
    mu > 1/3, at negligible memory throughout -- so the four-list structure
    contributes exactly zero at every advice level; this settles the open
    frontier obligation of 7169d6, adds a mandatory certificate row (the
    cheapest same-resource baseline), and identifies XOR as the one nearby
    object where the machinery genuinely adds, because there the
    concentration set is a subgroup rather than an interval
  class: control

  claim: >-
    Setting. G = <P> of prime order N, Q = [x]P. ADVICE(mu): the top
    mu*log2(N) bits of x are supplied, equivalently x is known to lie in an
    interval W of size |W| = N^{1-mu}. Two algorithms use exactly this
    resource and nothing else.

    (K1) KANGAROO ON W. Pollard's lambda / Gaudry-Schost / Galbraith-Ruprai
    on an interval of size |W| finds x in (2 + o(1)) sqrt(|W|) =
    Theta(N^{(1-mu)/2}) group operations with O(log N) memory
    (distinguished points), parallelizing linearly in wall clock with
    total work unchanged. Recalled constants; the exponent is standard.

    (K2) THE ADVISED FOUR-LIST ROUTE (7169d6 statement 3, taken as input).
    With leaves aP + bQ, b in {0, 1}, and the advice, the log-interval key
    is computable on every leaf, the two-pointer join runs at gamma = 1,
    and the route's expected time is N^{max((1+mu)/4, (1-mu)/2)} with peak
    memory N^{max((1+mu)/4, (1-mu)/2)} (the list and survivor sizes on the
    IDEA-20260829-3f0f4b surface at s = 1 - mu).

    (K3) DOMINANCE (arithmetic). For mu in [0, 1/3]: (1-mu)/2 >= (1+mu)/4,
    so the four-list time exponent is (1-mu)/2, EQUAL to kangaroo's, while
    its memory exponent is (1-mu)/2 against kangaroo's 0. For mu in (1/3, 1]:
    the four-list time exponent is (1+mu)/4 > (1-mu)/2, STRICTLY WORSE than
    kangaroo's, and its memory is (1+mu)/4 > 0. Therefore, for every mu in
    [0, 1], kangaroo weakly dominates on time and strictly dominates on
    memory: the advised four-list route is Pareto-dominated by an algorithm
    using the identical advice. The four-list structure contributes zero
    time and costs N^{(1-mu)/2} memory at the exponent where it is
    advertised (mu = 1/3: both at N^{1/3} time, four-list at N^{1/3} memory,
    kangaroo at O(log N)).

    (K4) WHY, IN ONE SENTENCE. At mu <= 1/3 the four-list route is a
    birthday search inside W realized indirectly through pair sums, and
    kangaroo is a birthday search inside W realized directly through
    Q + [i]P; both cost sqrt(|W|); the pair-sum detour buys nothing because
    an interval in a prime-order group is directly samplable once its
    endpoints are known, whereas a subgroup coset in F_2^n given by a
    random oracle is not. In the balance-law language of
    IDEA-20260901-133fd3 (read this session), the four-list route's ratio is
    R(W) = N^{1/2} |W|^{-3/4} for |W| <= N^{2/3} and R(W) = Theta(1) for
    |W| >= N^{2/3}, never below 1, consistent with that record's cascade
    prediction and with kangaroo's R = 2.

    (K5) THE CERTIFICATE ROW THIS ADDS. JPR-C8-SAME-RESOURCE: any certificate
    for a four-list route must exhibit the cheapest known algorithm that
    uses the SAME key, advice, or oracle, and show the route is not
    dominated by it. For advice about x the baseline is kangaroo (this
    record); for a key computable on every point the baseline is the sparse
    Fourier cascade of IDEA-20260901-a66d70 and IDEA-20260901-d77aa8
    (polynomial time at the corner). No prior row of H-JPR-3a00f0 asks
    this, and the lane's REVISE verdicts compared only against rho and
    BSGS, which is the wrong control for a conditional route.

    (K6) NOT CLAIMED. No ECDLP result, no impossibility, no statement about
    multi-target amortization, and no statement about XOR beyond the
    observation in method_ceiling.

  mechanism: >-
    THE TRACKED OBJECT is the RESOURCE (advice, key, or oracle) a
    conditional route consumes, and the null object for an ALGORITHM is
    the cheapest other algorithm consuming the same resource. This is
    docs/inventor-protocol.md section 3 ('controls before belief') applied
    to a cost claim rather than to a measurement: a conditional exponent
    is an artifact until the identical resource has been handed to the
    simplest competitor. The four-list lane has compared its conditional
    N^{1/3} to rho and BSGS for fifty-seven batches; neither uses the
    resource, so neither is the control.

    STAGE 0 (zero compute, HARD GATE). Reproduce the mu = 0 slice on both
    sides: kangaroo on W = Z/N (interval of full size) costs
    2 sqrt(N), i.e. rho up to a constant; the advised four-list route at
    mu = 0 is 7169d6's N^{1/2} time and N^{1/2} memory point (a four-list
    meet-in-the-middle). Both must land on exponent 1/2; if the four-list
    side does not, 7169d6's baseline reconciliation is broken and this
    record inherits the break.

    STAGE 1 (symbolic). Write (K3) as two inequalities with the crossing
    at mu = 1/3 and check the memory column: four-list memory is
    N^{max((2-s)/4, s/2)} at s = 1 - mu, which equals the time exponent;
    kangaroo memory is O(log N) distinguished points. Tabulate (T, M) for
    both at mu in {0, 1/6, 1/3, 1/2, 2/3, 1}.

    STAGE 2 (symbolic). Derive the four-list route's R(W) for the balance
    law and check it is never below 1; record the consistency with 133fd3
    as a cross-check, not as evidence.

    STAGE 3 (symbolic, the nearby object). Run the same-resource control
    on F_2^{3m} with random-oracle lists and the prefix key: the resource is
    the prefix quotient; the cheapest two-list method using it is still
    2^{3m/2} because the lists cannot be sampled inside the kernel coset;
    Wagner's four-list route is 2^{m}; so on XOR the four-list structure
    contributes a factor 2^{m/2} and the control PASSES it. The difference
    from G: in a prime-order group the resource (an interval for x) makes
    the concentration set directly samplable, so the detour through pair
    sums is redundant; in XOR the concentration set is a subgroup coset
    reachable only through the join. This is the exact reason the same
    machinery has opposite value on the two objects, and it is recorded as
    the method's load-bearing structure.

    STAGE 4 (symbolic). Write JPR-C8 and, for each branch of the lane's
    existing certificate (advice branch, computable-key branch), name the
    same-resource baseline and its cost.

  novelty_status: unverified

  novelty_screen:
