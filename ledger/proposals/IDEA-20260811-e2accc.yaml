idea:
  id: IDEA-20260811-e2accc
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  axis: A5
  claim_tier: toy
  title: >-
    The Drinfeld-module discrete logarithm is easy for exactly one reason -- the exponent
    ring F_q[T] CONTAINS the constant field F_q and the module action is F_q-LINEAR, so the
    unknown is a coordinate vector and the problem is a linear system -- and that ingredient
    transfers to elliptic curves over F_p in exactly one place, the anomalous case N = p,
    where the formal logarithm supplies the missing linearity and the Smart/Satoh-Araki/
    Semaev attack IS the Drinfeld attack; everywhere else it fails at LINEARITY, not at
    representability, and the CM order cannot supply it
  class: mechanism
  claim: |-
    (A) THE INGREDIENT, DERIVED FROM SCRATCH SO THE RECORD DOES NOT DEPEND ON AN
    UNVERIFIABLE CITATION. Let A = F_q[T], let L be a field containing F_q, and let
    phi : A -> L{tau} be a Drinfeld A-module, i.e. an F_q-algebra homomorphism into the
    twisted polynomial ring, so that every phi_a acts on the additive group G_a(L) = L as an
    F_q-LINEAR (additive, F_q-semilinear-free) map. The analogue of the discrete logarithm is:
    given P in L and Q = phi_a(P), find a in A. Write a = sum_{i=0}^{d} a_i T^i with
    a_i in F_q. Because phi is a ring homomorphism and is F_q-linear,
        phi_a = sum_i a_i (phi_T)^i,     hence     Q = phi_a(P) = sum_i a_i P_i,
    where P_i := phi_{T^i}(P) = (phi_T)^i(P) is computable from P by i applications of the
    public map phi_T. So Q is an F_q-LINEAR COMBINATION OF d+1 PUBLICLY COMPUTABLE ELEMENTS,
    and recovering (a_0, ..., a_d) is solving a linear system over F_q inside the F_q-vector
    space L. Polynomial time. [fact, elementary; the derivation is three lines and is given
    here in full precisely so that no step rests on recall.] Attribution: this is, to the
    best of the author's recall, the observation behind the published statement that
    Drinfeld-module public-key cryptosystems are insecure [recall-uncertain: Scanlon, J.
    Cryptology, circa 2001; author, title and venue NOT verified this session because web
    search and web fetch were both unavailable]. The record's argument does not depend on the
    attribution being right.

    (B) THE INGREDIENT ISOLATED INTO THREE NECESSARY CONDITIONS. The attack in (A) needs, and
    uses, exactly:
      D1. the exponent ring A CONTAINS a field F_q (so the unknown has coordinates in a set
          that can be solved for by linear algebra rather than searched);
      D2. the object acted on is an F_q-VECTOR SPACE (here G_a(L) = L);
      D3. the action map a |-> phi_a(P) is F_q-LINEAR IN a.
    Remove any one and the attack evaporates. D1 alone is not enough (base-b digits of an
    integer exponent always exist -- that is what BSGS and Pohlig-Hellman use -- and they buy
    a square root, not polynomial time). D3 is the load-bearing one.

    (C) THE EXACT STEP THAT FAILS OVER F_p, STATED AS THE DELIVERABLE THE AXIS ASKED FOR.
    For E/F_p with G = <P> of prime order N != p:
      D1 FAILS. The exponent ring is Z (or, if one prefers, End_{F_p}(E) = O). Z contains no
        field; O contains no field; the only field through which multiplication-by-k factors
        on G is F_N = Z/N itself, and writing k in an F_N-basis of F_N is the identity map.
      D2 FAILS in the only way that matters. G is a Z-module of order N coprime to p; it
        carries no F-vector-space structure for any field F smaller than F_N.
      D3 FAILS, and this is the precise sentence: the map k |-> [k]P is Z-linear in k and is
        NOT linear over any proper coefficient set. One can always write k = sum_i k_i c^i
        and compute [c^i]P (representability holds), but [k]P is not sum_i k_i * [c^i]P in
        any structure where the k_i can be solved for, because E(F_p) has no scalar
        multiplication by the digits. THE FAILURE IS LINEARITY, NOT REPRESENTABILITY. Every
        "write the exponent in a clever basis" idea is a restatement of representability and
        is therefore already priced at BSGS.
    This is a complete answer to channel (2) as posed: the ingredient is named, the failing
    step is named, and the failure is located at D3.

    (D) THE ONE PLACE THE INGREDIENT DOES TRANSFER, AND IT IS ALREADY KNOWN. Suppose instead
    N = p, i.e. E/F_p is ANOMALOUS with #E(F_p) = p. Then D1-D3 are all restored: the
    subgroup of order p lies in the kernel of reduction of a lift, the formal group over Z_p
    has a formal logarithm which is an isomorphism onto the additive group, and the induced
    map on E(F_p) is F_p-LINEAR in the exponent. The discrete logarithm is then a single
    division in F_p -- the Smart/Satoh-Araki/Semaev attack (KN-TECH-033). THE DICTIONARY:
    Drinfeld modules live in "special characteristic", where the characteristic of the
    exponent ring's residue field coincides with the characteristic of the base; the
    anomalous case is the unique elliptic instance of that same coincidence, since it is
    exactly the case where the group order shares the characteristic. So the function-field
    gift and the anomalous-curve break are the same phenomenon, and the corpus's existing
    taxonomy entry for the anomalous transfer is its elliptic name. [The corpus already
    records anomalous-as-formal-group in IDEA-20260807-df5984's CLASS III; what is new here
    is the identification with the Drinfeld mechanism and the three-condition isolation that
    makes the identification checkable rather than suggestive.]

    (E) CAN THE CM / ENDOMORPHISM STRUCTURE SUBSTITUTE? NO, AND THE REASON IS COMPUTED, NOT
    ASSERTED. Two candidate substitutions, both closed:
      (E1) USE O AS THE EXPONENT RING. k lies in Z inside O, and in the Z-basis {1, omega}
        its coordinate vector is (k, 0) -- the substitution returns the original unknown. And
        by H-ENDO-001 (used as an INPUT, not retested) O acts on G through the ring map
        O -> O/n = Z/N, i.e. by scalars, so the O-module structure on G adds coordinates and
        no congruence. There is no F_q analogue because O has no residue field smaller than
        F_N through which the action factors non-trivially.
      (E2) USE THE RANK-2 STRUCTURE. For a rank-2 Drinfeld module the p-torsion is
        (A/p)^2 and endomorphisms act by 2x2 matrices rather than scalars, which is the
        structural difference that makes the rank-2 theory rich. The elliptic analogue is
        E[N] = (Z/N)^2, and Frobenius acts on it with eigenvalue 1 on G (since pi fixes
        E(F_p) pointwise) and, because det(pi | E[N]) = deg(pi) = p mod N, with the other
        eigenvalue equal to p mod N. [fact] So the rank-2 module structure is COMPLETELY
        EXPLICIT AND PUBLIC -- diag(1, p mod N) in the eigenbasis -- and contains no unknown
        for k to hide in. The substitution fails by an explicit computation. (Consistency
        check with the rest of the corpus: the two eigenvalues coincide exactly when
        N | p - 1, which is the embedding-degree-1 family where Frey-Ruck/MOV already
        applies. The degenerate case of this record's argument is the known attack family,
        which is what a correct argument should do.)

    (F) FORWARD GUIDANCE. The only unclosed direction in this channel is to MANUFACTURE a
    constant field where none exists. That requires a base field with a proper subfield, and
    F_p has none -- which is the subject of a companion record (IDEA-20260811-e64549) and is
    the exact reason GHS/Weil descent is confined to F_{q^n} with n > 1. A genuine transfer
    would need an F-algebra structure on the exponent ring acting F-linearly on G for some
    F strictly between "nothing" and F_N. No such structure is known to this record, and the
    record does NOT assert that none exists.
  mechanism: |-
    The whole content is the isolation D1-D3 and the location of the failure at D3. The
    causal statement, in one sentence: an attack is linear-algebraic exactly when the unknown
    is a coordinate vector over a field the action respects; Drinfeld modules put the
    exponent's coefficients and the module's scalars in the SAME field F_q, and elliptic
    curves over F_p put the exponent in Z and the scalars nowhere, except when the group
    order collides with the characteristic and the formal group supplies F_p on both sides.
  why_not_a_renamed_known_approach: |-
    Not an approach at all in the algorithmic sense: it is a transfer analysis whose output is
    a named failing step. It is not a renaming of the anomalous attack, because it does not
    propose the anomalous attack; it explains why the anomalous attack is the unique elliptic
    survivor of a function-field phenomenon, which is a statement about the SPACE of attacks
    and not about any curve. It is not a renaming of H-ENDO-001, because H-ENDO-001 is the
    input to (E1) rather than its conclusion, and (E2) is closed by an eigenvalue computation
    that H-ENDO-001 does not supply.
  resource_label: >-
    R6 (lifts to Z_p / the formal group) for part (D), and R5 (ell-torsion for ell != N as a
    Galois module) for part (E2). Parts (A)-(C) consume no resource because they are a
    negative transfer analysis. NO NEW TAXONOMY ENTRY IS NEEDED: the Drinfeld import lands
    inside R6, and the record's contribution is to say which existing cell it lands in and
    why it is already occupied by the anomalous transfer. Nothing anywhere applies an
    endomorphism to a point of G to extract a congruence.
  admissibility: admissible
  predictions:
  - observable: solvability of the Drinfeld linear system
    metric: >-
      for a rank-1 and a rank-2 Drinfeld A-module over a toy L = F_{q^m}, the rank and
      consistency of the linear system Q = sum_i a_i P_i, and whether the recovered a
      satisfies phi_a(P) = Q
    predicted: >-
      exact recovery in 100% of instances, in time polynomial in m and log q. This is the
      PLANTED-POSITIVE arm and it is what shows the pipeline can detect the ingredient when
      the ingredient is present.
  - observable: solvability of the same template on an anomalous elliptic curve
    metric: >-
      for E/F_p with #E(F_p) = p, exact recovery of k through the formal logarithm, and the
      operation count
    predicted: >-
      exact recovery, O(log p) operations. Second planted-positive arm; it is what makes the
      identification in (D) an empirical statement rather than an analogy.
  - observable: solvability of the same template on a generic curve
    metric: >-
      for E/F_p with N prime, N != p, the best F_p-linear fit of k to the digit vector of
      k in any base c, measured as the fraction of instances recovered
    predicted: >-
      recovery rate indistinguishable from guessing, i.e. 1/N up to sampling error. FORCED
      VALUE from D3, derived before measuring; any recovery rate materially above chance
      refutes (C) and is escalated to the Coordinator under pause condition P3 rather than
      written up here.
  - observable: the Frobenius matrix on E[N]
    metric: >-
      the eigenvalues of pi acting on E[N] for sampled ordinary curves, computed
      independently of the derivation
    predicted: >-
      exactly {1, p mod N} in every instance, with a non-diagonalisable Jordan block exactly
      when N | p - 1. A single instance with an eigenvalue outside {1, p mod N} falsifies
      (E2).
  minimal_test:
    design: |-
      Toy, single machine, order of one CPU-hour, no attack on any deployed object.
      STAGE 0 (zero compute, HARD GATE): write out D1-D3 and check that removing each one
        individually breaks the derivation in (A). If any of the three can be removed with
        the attack surviving, the isolation is wrong and nothing downstream is meaningful.
      STAGE 1 (minutes): implement a rank-1 and a rank-2 Drinfeld module over F_q[T] with
        q in {2, 3, 5} and L = F_{q^m} for m up to ~30; run the linear solve; verify exact
        recovery. PLANTED POSITIVE 1.
      STAGE 2 (minutes): construct an anomalous curve over a 20-30 bit prime by CM (or by
        searching small p), and recover k through the formal logarithm. PLANTED POSITIVE 2.
      STAGE 3 (minutes): on a matched generic ordinary curve at the same p, run the same
        linear-fit template over a grid of bases c and record the recovery rate against the
        1/N chance baseline.
      STAGE 4 (minutes): compute pi on E[N] for ~100 sampled ordinary curves and check the
        eigenvalues against {1, p mod N}, including at least three curves with N | p - 1.
    controls:
    - >-
      NULL OBJECT for Stage 3 (matched shape, structure destroyed): replace [k]P by a random
      injection Z/N -> F_p x F_p and run the identical linear-fit template. The recovery rate
      must be statistically indistinguishable from the elliptic case. If the elliptic case
      does better than the random null, that difference -- not the absolute rate -- is the
      signal, and it is a P3 event.
    - >-
      TWO PLANTED POSITIVES (Stages 1 and 2), which are the two-directional control the
      instrumentation lane requires: a pipeline that fails to recover k where the ingredient
      IS present has not tested anything by failing where it is absent.
    - >-
      INSTRUMENT NULL: k = 1 in every arm; the recovered value must be 1 exactly.
    - >-
      DEGENERATE-FAMILY CONTROL: curves with N | p - 1, where (E2) predicts a Jordan block
      and where the known Frey-Ruck transfer applies. The eigenvalue computation must behave
      differently there; if it does not, it is not measuring the module structure.
    required_metrics:
    - recovery rate and operation count per arm (Drinfeld rank 1, Drinfeld rank 2, anomalous, generic, random null)
    - rank and consistency of the linear system in the Drinfeld arms
    - eigenvalues of pi on E[N] per sampled curve, and the diagonalisability flag
    - the 1/N chance baseline computed per instance, not pooled
  controls:
  - >-
    See minimal_test.controls. The two planted positives are load-bearing: without them a
    negative on the generic curve is uninformative, and the record would be a fatigue report
    rather than a closure.
  confounders:
  - >-
    Drinfeld modules in GENERIC characteristic versus SPECIAL characteristic behave
    differently, and the dictionary in (D) is about the special-characteristic coincidence.
    Implementing the wrong one in Stage 1 would make the analogy look better or worse than it
    is; the characteristic must be recorded per instance.
  - >-
    The anomalous arm needs a genuine lift and a correctly normalised formal logarithm.
    Precision loss there produces a false negative that would be misread as evidence against
    (D).
  - >-
    "The template fails" is not the same as "no linear structure exists". Stage 3 tests one
    family of linear templates (digit vectors in a base c) and its negative is scoped to that
    family, which is stated in interpretation_limits and must not be widened.
  - >-
    Anomalous curves are excluded by every standard curve-generation procedure, so (D) has no
    bearing on any deployed parameter set and must not be presented as if it did.
  falsification_conditions:
  - >-
    Removing D1, D2 or D3 from the derivation in (A) leaves the attack intact. The isolation
    is wrong and the whole transfer analysis is void.
  - >-
    Either planted-positive arm fails. The pipeline cannot detect the ingredient and no
    negative from Stage 3 may be recorded.
  - >-
    Stage 3 recovery rate materially exceeds both the 1/N baseline and the random null. (C)
    is refuted. PAUSE CONDITION P3 APPLIES: the excess is NOT to be quantified in any record;
    the run is flagged and handed to the Coordinator for an independent review-adversarial
    session.
  - >-
    An eigenvalue of pi on E[N] outside {1, p mod N}. (E2) is refuted and the rank-2
    substitution is reopened.
  interpretation_limits:
  - >-
    Toy scale only. Nothing here is an attack; the two positive arms reproduce published
    breaks of objects nobody deploys (Drinfeld cryptosystems, anomalous curves).
  - >-
    (C) is scoped to the three conditions D1-D3 and to the digit-vector family of linear
    templates. It is NOT a claim that no linearisation of the ECDLP exists, and the write-up
    must not slide into that reading.
  - >-
    The attribution of (A) to the published Drinfeld-cryptosystem break is
    [recall-uncertain] and unverified; the mathematics is derived in full and does not depend
    on it, but the record may not be cited as establishing the attribution.
  assumptions:
  - 'A = F_q[T]; phi an F_q-algebra homomorphism A -> L{tau}; the module action on G_a(L) is F_q-linear. [fact, definitional.]'
  - E/F_p ordinary with N prime, N || #E(F_p); the anomalous arm uses N = p instead.
  - >-
    'The formal logarithm of the formal group of an elliptic curve over Z_p is an isomorphism
    onto the additive formal group over Q_p, and for anomalous curves this yields a
    polynomial-time discrete logarithm [recall-confident: Smart; Satoh-Araki; Semaev; corpus
    KN-TECH-033. NOT re-verified this session].'
  - >-
    'det(pi | E[N]) = deg(pi) = p mod N and pi acts as the identity on E(F_p) [fact,
    elementary].'
  - H-ENDO-001 is an input to (E1) and is not retested.
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >-
      Condition D3, F_q-linearity of the action in the exponent. Everything else in the
      Drinfeld attack is bookkeeping, and every proposed transfer to F_p must say how it
      restores D3 or it is not a transfer.
    baseline_embedding:
      parameter_slice: >-
        The anomalous slice N = p. There the elliptic setting satisfies D1-D3 through the
        formal group and the framework must reproduce the Smart/Satoh-Araki/Semaev attack
        exactly, including its O(log p) cost.
      reproduction_check: >-
        Computational, Stage 2: recover k on a toy anomalous curve and compare against a
        directly computed discrete logarithm; exact match, every instance, no tolerance.
    observation_collision:
      observable: >-
        The triple (D1, D2, D3) as a yes/no vector for a given algebraic setting.
      distinct_preimage_search: >-
        Sought deliberately: two settings with the same vector and different DLP difficulty.
        The vector (yes, yes, yes) occurs for Drinfeld modules and for anomalous curves and
        both are easy -- consistent. The vector (no, no, no) occurs for generic elliptic
        curves over F_p and for generic curves over F_{q^n}, but the latter admits GHS/Weil
        descent, which is EASIER for some parameters. THAT IS A GENUINE COLLISION and it is
        recorded rather than hidden: it shows D1-D3 are sufficient but not necessary for
        weakness, so the record's negative in (C) closes only the D1-D3 route and not the
        function-field direction as a whole. The companion record IDEA-20260811-e64549 exists
        because of this collision.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        The ECDLP presented as a linear system over a coefficient field, which is what the
        Drinfeld setting achieves.
      predicted_gain: >-
        Zero, and the record says which of the five obligations fails (encoding: there is no
        coefficient field to encode into).
    - transform: observable_fiber
      proposed_object: >-
        Hold "DLP is easy" fixed and vary the forgotten structure across Drinfeld, anomalous,
        embedding-degree-1 and generic settings, looking for the intrinsic invariant that
        separates them.
      predicted_gain: >-
        The invariant is predicted to be "the exponent's coefficients and the module's
        scalars live in a common field", and the four settings are the calibration points.
    quantifier_order: >-
      FORALL E/F_p with N prime and N != p, FORALL fields F and FORALL F-vector-space
      structures V with an embedding of G into V, the map k |-> [k]P is F-linear ONLY IF
      F = F_N. Note the order: EXISTS F FORALL k would be the useful claim for an attacker
      and is exactly what is denied; FORALL k EXISTS F is trivially true and is the confusion
      the explicit quantifiers exist to prevent.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The D1-D3 linearisation route to the ECDLP over F_p is available exactly in the
        anomalous case." It can NEVER certify that no linearisation exists, nor say anything
        about non-linear function-field techniques such as Weil descent.
      nearby_object_control: >-
        E over F_{q^n} with n > 1, where the desired conclusion (no function-field leverage)
        is FALSE because GHS works. The argument must be seen to fail there, and it does --
        for a reason OUTSIDE D1-D3, which is exactly the collision recorded above.
    proof_obligations:
    - claim: The Drinfeld DLP is a linear system over F_q.
      responsibility: correctness
    - claim: D1, D2, D3 are each necessary for that.
      responsibility: strictness
    - claim: All three fail for E/F_p with N != p, with D3 as the essential failure.
      responsibility: feasibility
    - claim: All three hold for N = p via the formal logarithm.
      responsibility: baseline
    - claim: The O-module and E[N]-module substitutions both fail, the second by eigenvalue computation.
      responsibility: correctness
    - claim: Conclusions are scoped to the D1-D3 route.
      responsibility: scope
    not_applicable_reason: null
  target_complexity:
    time_exponent: >-
      No ECDLP exponent moves and none is claimed. For the settings where the ingredient IS
      present the costs are the published ones: polynomial for the Drinfeld DLP, O(log p) for
      the anomalous transfer. For E/F_p with N != p the exponent stays 1/2.
    memory_exponent: >-
      Toy; the linear systems in the test are of dimension at most a few hundred.
    best_known: >-
      Parallel rho at 0.886*sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006); anomalous
      transfer polynomial (KN-TECH-033); Frey-Ruck/MOV at small embedding degree
      (KN-TECH-032). None is moved.
    hidden_overhead: >-
      None; nothing asymptotic is claimed. The honest overhead of the ANALYSIS is that its
      negative is scoped to one route.
    tradeoff_note: Not applicable; no algorithm is produced.
  sota_delta: >-
    Zero on every axis. Deliverable delta, as counts: 1 three-line self-contained derivation
    of why the Drinfeld DLP is linear-algebraic, 3 isolated necessary conditions, 1 exact
    failing step named (D3, linearity, not representability), 1 identification of the unique
