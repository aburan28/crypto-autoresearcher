idea:
  id: IDEA-20260812-318db8
  added: '2026-08-13'
  proposed_by: idea-generator
  filed_by: coordinator
  status: proposed
  question_id: RQ-ARGON-141710
  goal_id: GOAL-ARGON-001
  filing_note: >-
    Formal ledger filing of TASK-20260809-4e04eb's proposal.md content
    (coordination/goals/GOAL-ARGON-001/batches/BATCH-09d69e/tasks/TASK-20260809-4e04eb/proposal.md,
    578 lines, read in full), per DEC-20260812-03fa10's reconciliation_ruling
    (vs_a915ea: SUPERSEDE) and next_actions item 1. This record is the
    surviving, superseding RQ-ARGON-141710 formalization of "measure the
    Argon2 memory-access DAG's depth-robustness directly against a
    null-controlled comparator." IDEA-20260809-a915ea is NOT edited
    (immutable, AGENTS.md rule 4); its dominated_by field is separately
    corrected by CORR-20260812-1f7c9a. The `claim`, `mechanism`, `predictions`,
    `controls`, `falsification_conditions`, and `interpretation_limits` fields
    below restate proposal.md Sec.4/Sec.5/Sec.7 content, updated only where
    KN-LIT-7f3c21 (RFC 9106, filed 2026-08-12) resolves a claim from RECALLED
    to READ -- no substantive mechanism change from the source proposal.

  title: >-
    Recency-biased reference selection collapses per-lane depth-robustness
    relative to a window-matched uniform-reference null, at a scale visible
    already at RFC-recommended lane lengths
  class: measurement

  claim: >-
    For fixed (t, q) and a single Argon2 lane, the real reference-index DAG
    (chain edges plus the RFC 9106-specified within-window reference edge per
    block) requires a materially SMALLER node-removal set to halve its depth
    than a window-matched null graph whose reference edges are drawn uniformly
    from the same candidate window, because RFC 9106's within-window offset
    transform is recency-biased (confirmed, not recalled: KN-LIT-7f3c21,
    "Reference index mapping," Sec. 3.4.2 -- the transform
    zz = |W|-1-((|W|*J1^2)/2^32) concentrates probability toward large zz,
    i.e. toward recently computed blocks; this matches proposal.md's C6
    recollection near-verbatim). This is a structural/graph-theoretic claim
    only: no attack, no cost measurement, no parameter-set safety verdict or
    recommendation is made or implied anywhere in this record (matching
    GOAL-ARGON-001's binding synthetic-input-only, no-deprecation
    constraints).

  mechanism: >-
    Three-step causal chain (proposal.md Sec.4, unchanged by RFC confirmation
    -- KN-LIT-7f3c21 confirms the premises, does not alter the argument): (1)
    every lane is, independent of reference edges, a single linear chain of
    length t*q-1 (RFC 9106 Sec. 3.2, "B[i][j] = G(B[i][j-1], B[l][z])" --
    KN-LIT-7f3c21 confirms this exactly, resolving proposal.md's C1 from
    RECALLED to READ), lower-bounding graph depth at t*q-1 and unaffected by
    removing non-chain nodes; (2) whether a removal set shatters this chain
    into short pieces or leaves it substantially bridged is governed by how
    far back surviving reference edges reach relative to the size of the gaps
    created (the classical depth-robust-graph mechanism); (3) if the
    within-window offset transform is recency-biased as RFC 9106 Sec. 3.4.2
    now confirms (resolving C6 from RECALLED to READ), the typical bridging
    distance at any point in the lane is short relative to the window size
    W(j), so a removal set spaced slightly larger than that typical bridging
    distance should sever most bridging routes with a removal set far sparser
    than a graph with reference edges spread evenly across the full window
    would require.

  why_not_a_renamed_known_approach: >-
    Depth-robustness is analyzed asymptotically for graph FAMILIES in the
    literature this record is likely qualitatively adjacent to (dominated_by,
    below). Measuring the SPECIFIC graph induced by RFC 9106's standardized
    indexing functions at RFC-adjacent parameters, against a window-matched
    null built to isolate exactly the within-window selection rule (not a
    generic asymptotic comparator), with a required independent-known-family
    calibration bounding the measurement pipeline's own error, is a different
    and more specific object and test design than restating the asymptotic
    theory (proposal.md Sec.2's lossy-projection framing: this measurement
    discards block content entirely and is purely topological, which is
    exactly the coordinate change that makes it a measurement of THIS graph
    rather than a re-derivation of a general bound).

  predictions:
    - observable: >-
        rho = |S*_real| / |S*_unif|, the ratio of node-removal-set sizes
        (each as a fraction of q, so rho is scale-free) needed to bring the
        real graph and the window-matched uniform-null graph to <=50% of
        native depth (t*q-1), using a declared greedy eps-depth-reducing-set
        heuristic (proposal.md Sec.6 step 5: topological longest-path DP,
        remove the node nearest the current longest path's midpoint, repeat)
      metric: ratio, reported per tested (variant, t, q) triple
      predicted: >-
        rho <= 0.5 at every tested RFC-9106-adjacent (t, q) pair confirms the
        material-effect claim; rho >= 0.8 at any tested pair falsifies it;
        rho in [0.5, 0.8) is reported as a genuine partial effect, not
        rounded into either bucket. This is a genuine two-outcome
        discriminator: rho ~= 1 (bias exists per the precondition check below
        but is too weak at this coarse a depth target to matter at
        RFC-adjacent scale) is an equally real, informative, and different
        possible outcome, as is a value strictly between the two thresholds.
    - observable: >-
        empirical distribution of z_j / W(j) (window-relative reference
        offset) versus Uniform[0, 1)
      metric: Kolmogorov-Smirnov test statistic and p-value
      predicted: >-
        PRECONDITION, checked first and reported separately (proposal.md
        Sec.4 "Precondition falsification"): the test should reject
        uniformity (p <= 0.05 at a sample size large enough to detect a
        practically meaningful departure) if the recency-bias premise (C6,
        now RFC-confirmed as to the transform's existence and shape, but not
        yet as to whether it is PRACTICALLY material at RFC-adjacent q) is
        load-bearing. Failure to reject uniformity falsifies the mechanism's
        supporting premise outright, independent of any numeric rho reading.

  minimal_test: >-
    Proposal.md Sec.6 steps 1-5, 7-8 unchanged (RFC 9106 primary text is now
    obtained, filed as KN-LIT-7f3c21, discharging step 1's precondition;
    steps 2-5 build G_real/G_unif and run the KS precondition check and
    greedy heuristic; step 7 sweeps q at 3+ RFC-adjacent scales before any
    attempt at the literal RFC-recommended q; step 8 reports rho, the KS
    result, the cross-check, and the scale-sweep trend exactly, not blurred
    together). Step 6 (the self-referential small-q exact/ILP cross-check
    comparing greedy against exact ONLY on G_real/G_unif themselves) is
    SUPERSEDED, per DEC-20260812-03fa10's calibration_design_ruling, by
    IDEA-20260809-bcf891's independent-known-family calibration as a REQUIRED
    precondition control -- frozen as such in EXP-ARGON-2608c2.

  controls:
    - >-
      Null-object control: G_unif, identical chain edges and per-position
      candidate-window size W(j), differing only in the within-window
      selection rule (uniform vs. RFC-specified transform) -- isolates the
      within-window selection rule as the source of any measured rho
      deviation from 1, controlling for the trivial window-size-shrinkage
      confound near the start of a lane (proposal.md Sec.7).
    - >-
      Precondition control: the KS test on z_j/W(j) vs Uniform[0,1) runs
      BEFORE any eps-depth-reducing-set compute is spent (cheap, pure
      counting) and is the first thing reported per proposal.md Sec.4's
      explicit precedence rule.
    - >-
      Structural-tell control: rho vs. q scaling behavior swept across 3+
      RFC-adjacent scales; rho trending flat or toward 1 as q grows is
      expected either way (depth-robust-graph guarantees are constant
      fractions), but rho trending sharply TOWARD 0 as q grows is treated as
      grounds to suspect the measurement pipeline (heuristic degrading
      differentially, implementation divergence from spec) before being
      reported as a scaling finding (proposal.md Sec.4 secondary control).
    - >-
      REQUIRED PRECONDITION CONTROL, per DEC-20260812-03fa10's
      calibration_design_ruling: IDEA-20260809-bcf891's independent-known-family
      calibration -- run the SAME measurement pipeline (graph builder + greedy heuristic)
      against a graph family with independently-derived depth-robustness
      properties and a deliberately shallow family, at sizes matching the
      Argon2 toy-scale sweep, BEFORE any Argon2-graph rho number is trusted.
      This bounds the greedy heuristic's systematic error in BOTH directions
      (unlike the superseded self-referential cross-check, which only bounds
      "how much do G_real and G_unif differ between greedy and exact," not
      "is the greedy heuristic itself biased in a direction that corrupts
      every reported rho"). Frozen concretely in EXP-ARGON-2608c2.

  falsification_conditions:
    - rho >= 0.8 at any tested RFC-adjacent (t, q) pair, for a given variant (material-effect falsification).
    - >-
      The KS precondition check fails to reject uniformity of z_j/W(j) at the
      required toy-scale q values, for a given variant (precondition
      falsification -- the mechanism's supporting premise itself is refuted
      for that variant, independent of any numeric rho outcome, and the rho
      prediction is not interpreted as informative even if it happens to
      numerically satisfy the confirm bucket).

  interpretation_limits: >-
    Single-lane (p=1) slice only (proposal.md Sec.5); real Argon2 with p>1
    has cross-lane reference edges that can only add bridging routes, never
    remove them, so this is a conservative simplification, not a claim about
    the full multi-lane graph (extending to true multi-lane topology is
    IDEA-20260809-b9e9cc's downstream mechanism, not this record's). The
    greedy heuristic gives an upper bound on the true minimum
    eps-depth-reducing-set size, never an exact minimum, except at the small
    exact/ILP-tractable scales EXP-ARGON-2608c2's calibration uses; any
    reported rho at RFC-adjacent scale is a ratio of two upper bounds. No
    claim about attack cost, wall-clock time, or memory in any adversary
    model -- rho is a dimensionless topological ratio, feeding a later,
    separate tradeoff-attack-cost record (IDEA-20260809-ac5947's lineage). No
    claim that any recommended parameter set is unsafe, and no recommendation
    or deprecation of any parameter set. Literal RFC-9106-recommended q
    (~5.2e5 for the FIRST RECOMMENDED tuple; ~1.6e4 for the SECOND, per
    KN-LIT-7f3c21 Sec.4) is out of scope for the frozen toy-scale contract;
    any transfer from RFC-adjacent toy q to literal recommended q is an
    explicitly named extrapolation, not a direct observation.

  sota_delta: >-
    No attack, no algorithm proposed. This record contributes a specific,
    falsifiable, null-controlled test design (the rho ratio, its two-tier
    falsification thresholds, the KS precondition check, and -- new relative
    to a915ea -- the REQUIRED independent-known-family calibration per
    DEC-20260812-03fa10) that did not exist as a filed, sourced ledger record
    before this filing. Not a numeric result of any kind.

  dominated_by: >-
    UNKNOWN -- NOT null, and not inherited uncritically from
    IDEA-20260809-a915ea's now-corrected text (CORR-20260812-1f7c9a). Freshly
    re-checked at filing time (2026-08-13): grepped knowledge/INDEX.md for
    Argon2|memory-hard|depth-robust|pebbling|Alwen|Blocki|scrypt|Percival
    (case-insensitive) -- the same eight memory-hard-function-adjacent
    records found by TASK-20260809-4e04eb on 2026-08-09
