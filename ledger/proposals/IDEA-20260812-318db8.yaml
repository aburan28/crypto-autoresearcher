    web-literature check needed to answer that (attempted and failed on
    session infrastructure per proposal.md Sec.0/Sec.10, and NOT
    re-attempted by this filing, which has no web-search tool available in
    its own task scope) remains unperformed in any session to date.
    Therefore: "unknown -- likely dominated qualitatively by Alwen-Blocki-
    family depth-robust-graph results (candidate: KN-LIT-3385, title matches
    exactly but content is unverified past the title -- no abstract,
    authors, or year were extracted during the 2026-07-24 bulk seeding
    pass); a live web-literature check to confirm or rule out an existing
    numerically comparable null-controlled per-lane measurement has not been
    performed in any session to date." Setting dominated_by: null would
    assert a full frontier check that did not happen (a fabrication under
    AGENTS.md rule 5 and the inventor protocol's Pareto-honesty duty); naming
    a specific paper without verified content would be an equally
    unsupportable claim in the other direction.

