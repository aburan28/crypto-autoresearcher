  assumptions:
  - Every exponent entering S is read from a primary source in Stage 0 or the point is excluded.
    A frontier assembled from recollection is worthless at margins of 0.004.
  - Classical bits, QCRAM bits and qubits are DIFFERENT resources. Plotting them on one memory axis
    requires a declared conversion, and the record's default is to plot only points whose memory is
    classical-or-QCRAM bits and to carry the qubit count as a separate annotated column, never as
    an axis.
  - The o(d) terms are ignored throughout. This is not a small assumption at margins of 0.004 and
    it is why the survival score is one step.
  - The dimension d used to express exponents in bits is the committed effective sieve dimension,
    not the lattice dimension, and the two must not be confused.
  proof_search_map:
    bottleneck: >-
      The step whose removal changes the conclusion: the assertion, implicit in every priced cost
      model in this lane, that sweeping a scalar memory price explores the achievable time-memory
      frontier. That assertion is a claim about convexity and it has never been checked here.
    baseline_embedding:
      parameter_slice: >-
        alpha = 0 reproduces the free-memory core-SVP convention exactly (select minimum t,
        ignore m), and m0 = infinity reproduces it too. Both parameterisations agree at that
        boundary, which is why the discrepancy is invisible to anyone who only ever evaluates at
        the free-memory point - the exact situation this lane is in.
      reproduction_check: >-
        Symbolic: at alpha = 0 the price minimiser must be the global time-minimiser of S, and at
        m0 >= max m the budget minimiser must be the same point. Asserted as a unit test on the
        hull code, checked, and archived as a frozen fixture.
    observation_collision:
      observable: 'The hull-membership boolean per algorithm.'
      distinct_preimage_search: >-
        COLLISION FOUND, DELIBERATELY, AND IT IS THE OBJECT''S DEFINING WEAKNESS: two algorithms
        with identical (m, t) have identical hull status, so the observable cannot distinguish
        (for example) a sieve that parallelises perfectly from one that does not, nor one whose
        o(d) is mild from one whose o(d) is savage. A concrete collision on the two SIDES of the
        conclusion: an algorithm with a favourable exponent pair and a superpolynomial o(d) is
        on-hull and useless, while an algorithm just above the hull with a tiny o(d) may be the
        fastest thing at every reachable dimension. The record therefore reports hull status
        WITHOUT asserting operational superiority, and every conclusion is phrased as a statement
        about the SELECTION RULE, not about the algorithms.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Replace the scalar-price parameterisation by the budget parameterisation, in which the
        hypothesis "memory is bounded by M" is an exact half-plane constraint rather than a
        weighting.
      predicted_gain: >-
        Not a speedup: a completeness gain in the instrument. The measurable output is the integer
        |budget-optimal set minus price-optimal set| and the bits by which each such point beats
        the best price-selectable alternative at its budget.
    - transform: observable_fiber
      proposed_object: >-
        Hold the hull-membership observable fixed and vary the discarded structure (o(d) terms,
        parallelisability, QCRAM dependence) to exhibit two algorithms with the same status and
        opposite operational verdicts.
      predicted_gain: >-
        A bounded, explicit statement of what hull membership does NOT determine - which is
        required before anyone uses this record's output to rank attacks.
    quantifier_order: >-
      THEOREM (part A, standard): FOR ALL finite S and FOR ALL alpha >= 0, THERE EXISTS a
      minimiser of t + alpha*m that is a vertex of the lower-left convex hull of S; equivalently,
      for any point p strictly above the hull, THERE IS NO alpha for which p is the unique
      minimiser. DISCRIMINATING EXISTENTIAL, which is what the computation decides: THERE EXISTS a
      budget m0 and a point p in S such that p uniquely minimises t subject to m <= m0 AND p is
      strictly above the hull. NOTE THE ORDER: the theorem is universal in alpha and is not in
      doubt; the whole empirical content is the existential over (m0, p), and it is decided by
      arithmetic on a finite set.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Over the set S of published SVP algorithm exponent pairs that Stage 0 could read, at
        dimension d, the price parameterisation selects the subset A and the budget
        parameterisation selects the subset B, and B minus A is [explicit list], with each such
        point beating the best price-selectable alternative at its budget by [explicit bits]."
        NOTHING about which algorithm is actually fastest, nothing about concrete cost, nothing
        about ML-KEM's security.
      nearby_object_control: >-
        The nearby object where the desired conclusion fails is a set S' identical to S but with
        every point perturbed onto its own hull (i.e. an exactly convex frontier). The method must
        return B minus A empty there. If it does not, the method is detecting its own arithmetic
        and not the geometry - this is NULL-1, and it is run first.
    proof_obligations:
    - claim: The price minimiser is always a hull vertex.
      responsibility: baseline
    - claim: The budget minimiser need not be, exhibited by explicit example or shown impossible over S.
      responsibility: strictness
    - claim: Hull computation uses exact rational arithmetic; NULL-1 returns all-on-hull.
      responsibility: correctness
    - claim: Every exponent in S is read from a primary source or the point is excluded.
      responsibility: interface
    - claim: The false-positive rate for an off-hull verdict is calibrated by NULL-2 over >= 8 draws.
      responsibility: success_probability
    - claim: No conclusion is drawn about concrete cost at any dimension.
      responsibility: scope
    not_applicable_reason: null
  predictions:
  - metric: '|B minus A|, the number of algorithms budget-optimal at some m0 and price-optimal at
      no alpha, over the Stage-0 point set'
    direction: higher
    minimum_effect: '1 - a single such point refutes the completeness of the price parameterisation;
      zero vindicates it'
  - metric: 'vertical distance from the classical 3-tuple point (0.1887, 0.3588) to the hull of
      {enumeration, 2-sieve}, in exponent units'
    direction: different
    minimum_effect: '0.004 - the illustrative derivation puts it at exactly this order, so the
      prediction is that the answer is NOT robustly signed and the honest verdict is UNDECIDED
      until the enumeration constant is read'
  - metric: 'hull status of the quantum 3-tuple point before (0.3098) and after (0.2846) ePrint
      2025/2189'
    direction: different
    minimum_effect: 'a status change from off-hull to on-hull; if the status is unchanged, the
      external ingredient did not move the geometry and part (C) is withdrawn'
  - metric: 'classical-minus-quantum time exponent gap at m = 0.1887 divided by the same gap at
      m = 0.2075'
    direction: higher
    minimum_effect: '1.5 - the illustrative value is 2.75; a ratio at or below 1 would mean the
      quantum advantage SHRINKS under a memory budget and reverses part (D) entirely'
  - metric: 'number of off-hull points in S versus the NULL-2 calibrated interval at the sigma
      implied by exponent uncertainty'
    direction: higher
    minimum_effect: 'outside the NULL-2 interval; inside it, no non-convexity is reportable'
  minimal_test:
    design: >-
      ONE SCRIPT, UNDER ONE HOUR OF SINGLE-CORE COMPUTE, NO SIEVE, NO LATTICE, NO INSTRUMENT
      REBUILD. Step 1: read the primary sources and build S with exact rationals, one row per
      algorithm with (k, m, t, memory-model, qubits, source, page). Exclude anything unread.
      Step 2: run NULL-1 (linear tradeoff, must return all-on-hull) and NULL-2 (convex-plus-noise,
      >= 8 draws, gives the false-positive interval), and emit the classification rule's verdict on
      both BEFORE touching S. Step 3: compute the exact lower-left hull of S; emit per-point status
      and off-hull distance in exponent units and in bits at 385.084530 / 590.132012 / 825.235330.
      Step 4: sweep alpha and m0; emit A, B and B minus A. Step 5: recompute S with the quantum
      3-tuple point at 0.3098 instead of 0.2846 and report the difference - this is the
      external-ingredient arm and it is one line. Step 6: Stage 4's sensitivity region over the
      enumeration constant and the 2-sieve constant, with every point whose status flips inside the
      plausible range labelled UNDECIDED.
      WHY THIS IS THE CHEAPEST VALID DISCRIMINATOR IN THE LANE: the two explanations of the lane's
      own memory methodology differ in the value of one integer computed from a table of published
      constants. No instrument is rebuilt, no sieve is run, no seed is drawn, and the answer cannot
      be argued away by a hardware confounder. The dominant cost is READING, and the reading is
      owed anyway.
    controls:
    - 'NULL-1: exactly linear log-log tradeoff, must return all-on-hull, catches the
      nearly-collinear floating-point failure that a 0.004 margin invites'
    - 'NULL-2: convex-plus-noise ensemble, >= 8 draws, supplies the false-positive rate for any
      off-hull verdict'
    - 'NULL-3 forced-value derivation: the dominated (0.2075, 0.3300) point must come back
      off-hull and the coordinate extremes must come back on-hull; these carry no information and
      may not be reported as findings'
    - 'exact rational arithmetic throughout, with a unit test that the alpha = 0 price minimiser
      equals the global time minimiser'
    - 'the pre-2025 quantum arm (0.3098) as the before-picture of the external-ingredient
      insertion'
    - 'a memory-model column that prevents classical bits, QCRAM bits and qubits being silently
      plotted on one axis'
    required_metrics:
    - the full S table with source and page per exponent, and the exclusion list
    - hull membership and exact off-hull distance per point, in exponent units and in bits at the
      three committed effective sieve dimensions
    - A (price-selectable set), B (budget-selectable set), and B minus A
    - NULL-1 verdict and NULL-2 false-positive interval over >= 8 draws
    - classical and quantum frontier slopes and the gap ratio between m = 0.2075 and m = 0.1887
    - the before/after hull under the 0.3098 -> 0.2846 substitution
    - the sensitivity region over the enumeration and 2-sieve constants, with the UNDECIDED list
  falsification_conditions:
  - 'B minus A is empty: the price parameterisation is complete over the readable algorithm set,
    Explanation 1 wins, IDEA-20260816-70e41d needs no repair, and this record''s methodological
    claim is refuted. This is a clean negative and I put substantial probability on it.'
  - 'The off-hull count on S lies inside NULL-2''s calibrated interval: S is indistinguishable
    from a convex set given the uncertainty in its own exponents, and no non-convexity is
    reportable at any dimension.'
  - 'NULL-1 reports any point of a linear tradeoff as off-hull: the hull implementation is wrong,
    nothing is reported, and an arithmetic defect is recorded.'
  - 'The quantum 3-tuple point has the same hull status at 0.3098 and at 0.2846: the external
    ingredient did not move the geometry, part (C) is withdrawn, and the record''s claim to have
    brought in a decision-relevant result fails.'
  - 'The gap ratio between m = 0.1887 and m = 0.2075 is at or below 1: the quantum advantage
    shrinks rather than grows under a memory budget and part (D) is reversed. This would be a more
    interesting result than the predicted direction and is fully reachable if the recalled
    Laarhoven constant is wrong.'
  - 'Stage 0 cannot read enough primary sources to populate three distinct memory values: the hull
    is degenerate, convexity is vacuous, and the record reports that it could not be tested.'
  confounders:
  - >-
    THE o(d) TERMS, and this is the dominant one. Gaps of 0.004-0.005 in exponent are far inside
    what an unbounded o(d) can move. EV-MLKEM-020's own record already states "THE o(1) IN
    2^(0.2075n + o(n)) IS UNBOUNDED HERE". Nothing in this record survives being read as a
    concrete cost statement, and the survival score says one step for exactly this reason.
  - >-
    Memory-model incommensurability. QCRAM bits are not classical bits and neither is a qubit. A
    hull computed across mixed memory models is a category error unless the conversion is declared;
    the record's default is to segregate the classical and quantum hulls and to report them
    separately, and the cross-model comparison in part (D) is explicitly a comparison of two
    separate hulls, not a single hull.
  - >-
    The enumeration point is dimension-dependent (t grows like log d) while the sieve points are
    not, so hull membership is a function of d and any statement without a stated d is
    meaningless. Every reported status carries its d.
  - >-
    Selection of S. Which algorithms are included changes the hull, and an incomplete S can
    manufacture non-convexity by omission. The exclusion list is therefore a required artifact and
    is as important as the inclusion list.
  - >-
    Published exponents are optimised asymptotically, not at d = 400. A family whose exponent is
    optimal may have a worse constant; conversely the tuple-sieve literature's own tradeoff curves
    are continua and discretising them at a few k values can create spurious pockets.
  interpretation_limits:
  - This is arithmetic on asymptotic exponents. It is not a measurement, not an attack, not a cost
    prediction, and not a statement about ML-KEM's security. Expressing an exponent gap "in bits at
    d = 385" is a device for conveying SIZE and is not a claim that any attack costs that many bits.
  - Hull membership does not rank algorithms operationally; the observation-collision analysis
    above exhibits explicit pairs where it is misleading in both directions.
  - The quantum points are conditional on QCRAM. arXiv 2410.13759, retrieved this session,
    concludes there is "little to no quantum speedup in the dimensions of cryptographic interest";
    part (D) must be read against that and is voided if the sibling record IDEA-20260821-472aa2
    finds the quantum points depth-inadmissible.
  - Nothing here proposes a status change to EV-MLKEM-020, EV-MLKEM-015 or any committed record.
    AGENTS.md rule 12 is UNMET and inherited from GOAL-MLKEM-003/004.
  - No direction is declared impossible. A finding that the price parameterisation is complete
    over today's S says nothing about tomorrow's S; the October-2025 insertion is the proof of that.
  heuristic_assumptions:
  - id: H1
    statement: >-
      (COMMENSURABILITY) For every algorithm in S, the published pair (m, t) is stated in the same
      cost model up to a factor 2^{o(d)}, and the o(d) terms are small enough relative to the hull
      margins that hull membership computed from the leading exponents alone agrees with hull
      membership computed from the true cost functions, for all d in [385, 826]. H1 IS ALMOST
      CERTAINLY FALSE AT THE 0.004 MARGIN and the record says so; it is stated as a numbered
      assumption precisely so that the reader can see which conclusions die with it. The
      conclusions that do NOT depend on H1 are the theorem in part (A) and the before/after hull
      change in part (C) at fixed convention, which are statements about a convention's selection
      rule and hold whatever the true costs are.
    rigorous_support: >-
      The rigorous ingredient is the supporting-hyperplane theorem: for a finite point set, the
      minimiser of any linear functional with non-negative coefficients lies on the lower-left
      convex hull. That is exact and unconditional. The classical distribution statement H1
      imitates is the standard asymptotic-dominance convention under which exponents are compared
      at all - the same convention that lets the literature say 2^{0.292n} beats 2^{0.3588n} - and
      H1 is nothing more than the assertion that this program may use that convention at the
      dimensions it cares about. Naming it makes visible that the whole lane already assumes it
      silently every time it converts an exponent to a bit count.
    validation_plan: >-
      SAMPLE: not sampleable in the usual sense - there is no experiment that measures an o(d)
      term. What IS validatable, and is the honest substitute, is the leading-exponent convention
      against real runs at small d: take the two algorithm families this program can actually
      execute (a 2-sieve kernel and pruned enumeration, both present in the GOAL-MLKEM-004
      instrument per KN-TECH-14efa5), measure their wall-time and peak memory at d = 50..85, fit
      empirical (m, t) pairs, and check whether the EMPIRICAL points fall on the same side of the
      empirical hull as the asymptotic points do. COMPARISON: empirical hull membership versus
      asymptotic hull membership, per family. TAIL CHECK: the crossing dimension at which
      enumeration and sieving swap hull positions, empirically located versus the value the
      asymptotic constants predict; KN-LIT-105's corpus entry records the crossover reported at
      dimension 70 (KN-LIT-106), which gives one external anchor to check against.
      TRANSFER ASSUMPTION, STATED: this validates the convention at d = 50-85 and says nothing
      about d = 385-826, and the entire tuple-sieve part of S cannot be validated at all because
      no 3-sieve implementation is in this program's instrument. That is a real gap and it is why
      H1 is labelled as almost certainly false at the margins in question. This validation leg is
      OPTIONAL and is not part of the one-hour minimal test; it is named so that a coordinator can
      route it to the sibling record IDEA-20260807-8fbc86, which already owns that measurement.
  target_complexity:
    time_exponent: >-
      NO NEW ATTACK EXPONENT IS CLAIMED AND NONE IS PROPOSED. What this record produces is a
      statement about which published exponent pairs a cost convention can select. The exponents
      themselves are other people's: classical 2-sieve 0.292 at memory 0.2075 [recalled], classical
      3-sieve 0.3588 at memory 0.1887 [retrieved], quantum 2-sieve 0.265 at memory 0.2075
      [recalled], quantum 3-sieve 0.2846 at memory 0.1887 [retrieved, ePrint 2025/2189, improving
      0.3098]. The record's own compute cost is a convex hull of a few dozen points: O(n log n),
      seconds.
    memory_exponent: >-
      The record's own memory is a table of a few dozen rows. THE POINT OF THE RECORD IS THE
      MEMORY EXPONENT AXIS ITSELF: the claim is that the lane's instrument reads that axis through
      a scalar price, which is provably blind to any point above the hull, and that a hard budget
      is the parameterisation matching both the physical situation and the way ePrint 2025/2189
      states its own result ("when total memory is limited to 2^{0.1887d}").
    best_known: >-
      There is no incumbent in this repository: no record computes a hull of algorithm cost pairs
      or distinguishes price from budget selection. The incumbent PRACTICE is the priced charge
      T*M^c, committed in EV-MLKEM-020 with c* = 0.03164649 / 0.04588645 / 0.00705473, and
      IDEA-20260816-70e41d's proposed price-parameterised crossover curve. Externally, the
      price/budget distinction is elementary convex analysis and no novelty is claimed for it.
    hidden_overhead: >-
      Stated bluntly, because this is the record's weakest flank: the entire analysis lives in
      leading exponents and the margins that decide its conclusions (0.0040 classical, 0.0050
      quantum) are far smaller than any honest bound on the o(d) terms, which are formally
      unbounded and which the committed record EV-MLKEM-020 already flags as unbounded. In addition
      the quantum points hide a QCRAM assumption whose physical cost arXiv 2410.13759 estimates at
      ~10^13 physical qubits and ~10^31 years at d = 400, i.e. the quantum half of the frontier is
      a statement about a machine nobody has costed as buildable.
    tradeoff_note: >-
      This record IS a time-memory tradeoff record, so the note is the content: the classical
      frontier trades 3.553 exponent units of time per exponent unit of memory saved between
      m = 0.2075 and m = 0.1887, the quantum frontier 1.043, so quantum sieving is 3.4x cheaper to
      squeeze on memory. PARALLELISATION POSITION, and it is not decoration: tuple sieves reduce
      memory at the cost of time and are therefore the natural family under a hard-budget regime,
      while the price regime never selects them unless they are exactly on the hull - so the choice
      of parameterisation changes which family a cost model believes an attacker uses, which
      changes the parallelisation model, which changes the wall-clock estimate. That chain is the
      practical reason the integer |B minus A| is worth an hour.
  dominated_by: >-
    n/a (no result claimed on any attack axis), stated after checking rather than asserted. This
    record implements no algorithm, solves no instance and makes no query, so there is no cost
    triple to place on a frontier. On the ANALYSIS axis I checked every RQ-MLKEM-003 proposal
    title (21 of them) and the committed GOAL-MLKEM-003/004 evidence records; the only one
    occupying adjacent ground is IDEA-20260816-70e41d, and part (A) shows it is not dominating but
    complementary - it supplies measured points, this supplies the geometry. EXTERNALLY: ePrint
    2025/2189 dominates any claim about the quantum memory-budgeted frontier outright and is
    CITED, not competed with; if a published paper already states the price/budget observation for
    lattice cost models, it dominates this record's part (A) entirely and I did not search
    specifically for one. Writing `null` here would be a fabrication under AGENTS.md rule 5.
  sota_delta: >-
    No attack; conceptual and bookkeeping contribution only. Quantitatively: this repository holds
    ZERO computed hulls, ZERO budget-parameterised selections, and ZERO record of ePrint 2025/2189,
    while holding a committed priced-memory analysis (EV-MLKEM-020) whose entire mutation family
    lives inside the price parameterisation. The delta is (i) one integer, |B minus A|, currently
    unknown and computable in an hour, (ii) the first entry of a 2025 quantum result into this
    program, and (iii) two derived slopes (3.553 classical, 1.043 quantum) whose ratio names a
    direction - the quantum advantage grows under a memory budget - that no record in this lane has
    stated.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    By part. (i) That the theorem in part (A) is correct: ~0.99 - it is textbook convex analysis
    and if it is wrong the error is mine in the statement, not in the mathematics. (ii) That Stage
    0 can read enough primary sources to populate at least three distinct memory values: ~0.85,
    given that two of the four anchor points were already retrieved this session. (iii) That
    |B minus A| >= 1, i.e. the price parameterisation is genuinely incomplete over today's S:
    ~0.45 - I would not bet on this, and the empty answer is a perfectly good deliverable that
    vindicates a sibling proposal. (iv) That the quantum 3-tuple point changes hull status across
    the 0.3098 -> 0.2846 substitution: ~0.6, and this rests entirely on the recalled Laarhoven
    and enumeration constants, which is why Stage 0 is not optional. (v) That the gap-widening
    direction in part (D) survives Stage 0: ~0.7. (vi) That the batch produces a defensible table
    and a defensible integer, or a defensible statement that the exponents are too uncertain to
    decide: ~0.95 - this is the highest-probability deliverable in this batch of four, which is
    exactly why it should run first.
