  minimal_test:
    design: >-
      ONE SCRIPT, UNDER ONE HOUR OF SINGLE-CORE COMPUTE, NO SIEVE, NO LATTICE, NO INSTRUMENT
      REBUILD. Step 0: enumerate the corpus's (m, t) pairs per Stage 0a and emit the inclusion and
      exclusion lists BEFORE any reading of external primary text, so that the corpus contribution
      is separable from the web contribution. Step 1: read the primary sources and build S with
      exact rationals, one row per algorithm with (k, m, t, memory-model, qubits, source, page),
      and one row per named reading where a source is ambiguous. Exclude anything unread.
      Step 2: run NULL-1 (linear tradeoff, must return all-on-hull) and NULL-2 (convex-plus-noise,
      >= 8 draws, gives the false-positive interval), and emit the classification rule's verdict on
      both BEFORE touching S. Step 3: compute the exact lower-left hull of S per reading cell; emit
      per-point status and off-hull distance in exponent units and in bits at 385.084530 /
      590.132012 / 825.235330. Step 4: sweep alpha and m0; emit A, B and B minus A per reading.
      Step 5: run NULL-4. Arm 4a instantiates the continuum from Stage 0c and recomputes
      |B minus A| against it; arm 4b recomputes at three k-grid densities and reports monotonicity.
      IF NEITHER ARM CAN RUN, |B minus A| IS DECLARED UNCONTROLLED AND IS NOT REPORTED AS A
      FINDING. Step 6: the external-ingredient arm - recompute S with the quantum 3-tuple point at
      0.3098 instead of 0.2846, and separately with KN-LIT-703's (0.1395, 0.2989) removed, and
      report both differences. The second of those two ablations is what withdrew part (C) and it
      is run explicitly rather than asserted. Step 7: Stage 4's sensitivity region over the four
      named inputs, with every point whose status flips across any named reading labelled UNDECIDED.
      WHY THIS IS THE CHEAPEST VALID DISCRIMINATOR IN THE LANE: the two explanations of the lane's
      own memory methodology differ in the value of one integer computed from a table of published
      constants. No instrument is rebuilt, no sieve is run, no seed is drawn, and the answer cannot
      be argued away by a hardware confounder. The dominant cost is READING, and the reading is
      owed anyway.
