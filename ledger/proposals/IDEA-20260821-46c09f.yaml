  object_first_candidate:
    established_families_off_limits: >-
      Declared off-limits as the primary lens: dual-attack score geometry (six GOAL-MLKEM-004
      batches, eight in-lane proposals), estimator-arithmetic differencing (twelve GOAL-MLKEM-003
      batches), the module-structure discount (four in-lane proposals), and single-run resource
      fitting (IDEA-20260807-8fbc86). The lens here is the SET OF ALGORITHMS itself, treated as a
      point cloud in exponent space - an object none of those families instantiates.
    tracked_object: >-
      The hull-membership indicator of each algorithm family: for each published SVP algorithm, the
      pair (m, t) of per-dimension exponents together with the boolean "is this point a vertex of
      the lower-left convex hull of the set", and when false, the exact vertical distance to the
      hull. One boolean and one rational per algorithm.
    lossiness: >-
      LOSSY IN THE STRONGEST WAY IN THIS BATCH OF PROPOSALS. The underlying state is an entire
      algorithm: its data structures, its correctness argument, its constants, its o(d) terms, its
      parallelisability, its numerical stability. The projection retains TWO RATIONALS. Everything
      that distinguishes bgj1 from bdgl from hk3 is discarded; two algorithms with different
      mechanisms and identical exponents are identified. This is emphatically not a change of
      coordinates - the map from algorithms to (m, t) is enormously many-to-one and provably
      non-invertible.
      THE COMPATIBILITY CONDITION, which is what makes the projection legitimate rather than merely
      crude: the operations the target performs on this set are (a) taking the minimum of a linear
      functional t + alpha*m, and (b) taking the minimum of t over a half-plane m <= m0. BOTH
      OPERATIONS FACTOR THROUGH THE (m, t) PROJECTION EXACTLY - they read nothing else about the
      algorithm - so the retained part propagates deterministically under precisely the operations
      that define "which attack does a cost model select". That is the whole reason the object is
      the right one for a cost-convention question and the wrong one for an implementation
      question, and the record says so in interpretation_limits.
    propagation: >-
      One step is: add one algorithm to S. Hull membership of every existing point can only change
      in one direction - a point can be evicted from the hull by a new point but never restored -
      so the propagation law is monotone and the hull is a decreasing set under insertion. THAT
      MONOTONICITY IS THE CHEAP INTERNAL FALSIFIER AND IT HAS ALREADY FIRED ONCE, BEFORE ANY
      COMPUTE: inserting KN-LIT-703's (0.1395, 0.2989) evicted the 2025 quantum 3-tuple point from
      the hull under reading Q1, which is exactly the monotone eviction the law predicts and which
      withdrew this record's original headline. The record reports the before/after hull for every
      insertion explicitly, and the KN-LIT-703 insertion is now one of the declared arms.
      A second, sharper propagation: hull membership is a function of the dimension d ONLY through
      the enumeration point (whose t grows like log d), so the record can emit hull membership as a
      function of d and report the dimension at which each point enters or leaves the hull. That
      crossing dimension is a derived quantity nobody in this lane has computed.
    survival_score: >-
      Survives exactly as long as the exponents are the whole story, which is to say until the
      o(d) terms are comparable to the gaps being resolved. The gaps here are 0.0040 (classical,
      C1) and 0.001159 (quantum, Q2) in exponent, and the o(d) terms are formally unbounded, so the
      object dissolves ALMOST IMMEDIATELY when read as a statement about concrete cost. Reported
      honestly as: the object survives one step (it decides which algorithm a cost CONVENTION
      selects) and does not survive the second step (it does not decide which algorithm is actually
      faster at d = 385). This is the shortest survival of any record in this batch and it is
      stated up front rather than discovered by a reviewer.
  null_object_control: >-
    Four controls, all executable in the same script, all able to fail.
    NULL-1, THE CONVEX-BY-CONSTRUCTION FAMILY. Apply the identical hull code to a point set drawn
    from an exactly linear log-log tradeoff - the van Oorschot-Wiener-style interpolation
    t = (3/2)*nu - (1/2)*m sampled at 20 values of m. Every point of a linear curve is on its own
    lower hull, so the test MUST return "all on hull" with zero off-hull distance. CAN IT FAIL:
    yes, and this is the specific failure it is built to catch - a floating-point orientation test
    on nearly-collinear points is exactly how a 0.004 margin gets misclassified, and NULL-1 fires
    on it. If NULL-1 reports any point off-hull, the implementation is wrong and no result is
    reported.
    NULL-2, THE CALIBRATED FALSE-POSITIVE RATE. Draw point sets from a strictly convex curve plus
    Gaussian noise of declared magnitude sigma, at the same cardinality as S. The expected number
    of off-hull points is then a function of sigma alone and is estimated over at least 8 draws
    (KN-TECH-1a5b7e mode 5: a generated comparator is a measurement and needs a sample size). This
    supplies the false-positive rate to quote beside any "off-hull" verdict on S. CAN IT FAIL:
    yes - if the observed off-hull count on S is inside the interval NULL-2 produces at the sigma
    implied by the exponents' own uncertainty, then S is indistinguishable from a convex set with
    noise and NO non-convexity is reportable.
    NULL-3, THE FORCED-VALUE DERIVATION (obligation 4, done before running), NOW STATED
    CONDITIONALLY BECAUSE ITS PREMISE IS NOT UNCONDITIONAL. The coordinate extremes of S in each
    coordinate are forced on-hull under every reading and carry no information. The dominated point
    (0.2075, 0.3300) is forced OFF-hull ONLY UNDER READING C1, where a 2-sieve sits at
    (0.2075, 0.292) and dominates it; under reading C2, where the corpus records the classical
    sieve at (0.292, 0.292), that point is not dominated and is in fact a hull vertex. The forced
    set is therefore emitted PER READING, and a run that reports a reading-dependent fact as a
    forced one, or a forced fact as a finding, is inadmissible. The informative content is
    restricted to the interior points that are not forced under the reading in force, and the
    report must state that restriction.
    NULL-4, THE DISCRETISATION-DENSITY CONTROL, WHICH IS THE ONE THAT CAN KILL THE HEADLINE.
    ADDED ON RED-TEAM REVIEW; it is the parameter meant to destroy the signal, and no earlier
    control varied it. |B minus A| counts points that are budget-optimal at some m0 and
    price-optimal at no alpha, i.e. pockets of non-convexity. A pocket can be manufactured purely
    by sampling a CONTINUOUS tradeoff curve at a few values of k, and this record's own confounder
    list already says so. NULL-4 has two arms and a pre-declared inadmissibility rule.
    ARM 4a, THE CONTINUUM: instantiate the parametric tuple-sieve tradeoff curve read in Stage 0c
    from the body of ePrint 2017/1228 (and the corresponding quantum curve where one exists),
    sample it densely, recompute the lower hull and |B minus A| against the continuum, and report
    both the discrete and the continuum answer side by side. DECLARED IN ADVANCE: A POCKET THAT
    VANISHES UNDER THE CONTINUUM IS AN ARTIFACT OF DISCRETISATION AND IS NOT REPORTABLE AS A
    FINDING, whatever its size in bits on the discrete set.
    ARM 4b, THE DENSITY SWEEP (KN-TECH-1a5b7e obligation 3 refinement - two endpoints do not
    establish a direction): recompute |B minus A| at AT LEAST THREE k-grid densities, e.g.
    k in {2,3}, k in {2,3,4}, k in {2,3,4,5,6} where Stage 0 can read them, and REPORT whether
    |B minus A| is monotone in grid density rather than assuming it. A |B minus A| that grows with
    density is the signature of a continuum being chopped; one that is flat or shrinks is the
    signature of a real pocket.
    CAN NULL-4 FAIL: yes, in three distinct ways, and two of them kill the deliverable.
    (i) The continuum arm returns |B minus A| = 0 while the discrete set returns a positive
    integer: the headline is an artifact and the record's Explanation-2 claim is refuted.
    (ii) |B minus A| is monotone increasing in grid density: same verdict, reached without the
    continuum. (iii) Stage 0c cannot obtain the parametric form AND fewer than four distinct k
    values can be read, so neither arm can run: then |B minus A| IS REPORTED AS UNCONTROLLED FOR
    DISCRETISATION AND IS NOT A FINDING - the batch reports a reading failure and the price/budget
    theorem of part (A), which needs no k-grid at all, is the only surviving deliverable. Outcome
    (iii) is the one this session's own failed PDF fetch makes likely, and it is declared here
    rather than discovered by a reviewer.
    VERDICT ON THE NULL ARM FIRST: the classification rule (on-hull / off-hull / UNDECIDED under
    the sensitivity region of Stage 4) is emitted on NULL-1 and NULL-2 before S is classified. If
    it emits the same labels on the convex null as on S, it discriminates nothing.
    CAN THE WHOLE RECORD FAIL: yes, and cheaply, and one leg of it already has. Part (C)'s original
    headline was refuted by arithmetic before any compute. If Stage 2's set difference is empty, or
    if NULL-4 shows it is a discretisation artifact, the price parameterisation is complete over S,
    Explanation 1 wins, IDEA-20260816-70e41d needs no repair, and this record's methodological claim
    is refuted at a cost of under an hour.
