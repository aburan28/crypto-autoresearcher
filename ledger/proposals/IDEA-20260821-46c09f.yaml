      unchanged.
  object_first_candidate:
    established_families_off_limits: >-
      Declared off-limits as the primary lens: dual-attack score geometry (six GOAL-MLKEM-004
      batches, eight in-lane proposals), estimator-arithmetic differencing (twelve GOAL-MLKEM-003
      batches), the module-structure discount (four in-lane proposals), and single-run resource
      fitting (IDEA-20260807-8fbc86). The lens here is the SET OF ALGORITHMS itself, treated as a
      point cloud in exponent space - an object none of those families instantiates.
    tracked_object: >-
      The hull-membership indicator of each algorithm family: for each published SVP algorithm, the
      pair (m, t) of per-dimension exponents together with the boolean "is this point a vertex of
      the lower-left convex hull of the set", and when false, the exact vertical distance to the
      hull. One boolean and one rational per algorithm.
    lossiness: >-
      LOSSY IN THE STRONGEST WAY IN THIS BATCH OF PROPOSALS. The underlying state is an entire
      algorithm: its data structures, its correctness argument, its constants, its o(d) terms, its
      parallelisability, its numerical stability. The projection retains TWO RATIONALS. Everything
      that distinguishes bgj1 from bdgl from hk3 is discarded; two algorithms with different
      mechanisms and identical exponents are identified. This is emphatically not a change of
      coordinates - the map from algorithms to (m, t) is enormously many-to-one and provably
      non-invertible.
      THE COMPATIBILITY CONDITION, which is what makes the projection legitimate rather than merely
      crude: the operations the target performs on this set are (a) taking the minimum of a linear
      functional t + alpha*m, and (b) taking the minimum of t over a half-plane m <= m0. BOTH
      OPERATIONS FACTOR THROUGH THE (m, t) PROJECTION EXACTLY - they read nothing else about the
      algorithm - so the retained part propagates deterministically under precisely the operations
      that define "which attack does a cost model select". That is the whole reason the object is
      the right one for a cost-convention question and the wrong one for an implementation
      question, and the record says so in interpretation_limits.
    propagation: >-
      One step is: add one algorithm to S. Hull membership of every existing point can only change
      in one direction - a point can be evicted from the hull by a new point but never restored -
      so the propagation law is monotone and the hull is a decreasing set under insertion. THAT
      MONOTONICITY IS THE CHEAP INTERNAL FALSIFIER AND ALSO THE HEADLINE MECHANISM: the October-2025
      result is exactly one such insertion, and the record reports the before/after hull explicitly.
      A second, sharper propagation: hull membership is a function of the dimension d ONLY through
      the enumeration point (whose t grows like log d), so the record can emit hull membership as a
      function of d and report the dimension at which each point enters or leaves the hull. That
      crossing dimension is a derived quantity nobody in this lane has computed.
    survival_score: >-
      Survives exactly as long as the exponents are the whole story, which is to say until the
      o(d) terms are comparable to the gaps being resolved. The gaps here are 0.0040 and 0.0050 in
      exponent, and the o(d) terms are formally unbounded, so the object dissolves ALMOST
      IMMEDIATELY when read as a statement about concrete cost. Reported honestly as: the object
      survives one step (it decides which algorithm a cost CONVENTION selects) and does not
      survive the second step (it does not decide which algorithm is actually faster at d = 385).
      This is the shortest survival of any record in this batch and it is stated up front rather
      than discovered by a reviewer.
  null_object_control: >-
    Three controls, all executable in the same script, all able to fail.
    NULL-1, THE CONVEX-BY-CONSTRUCTION FAMILY. Apply the identical hull code to a point set drawn
    from an exactly linear log-log tradeoff - the van Oorschot-Wiener-style interpolation
    t = (3/2)*nu - (1/2)*m sampled at 20 values of m. Every point of a linear curve is on its own
    lower hull, so the test MUST return "all on hull" with zero off-hull distance. CAN IT FAIL:
    yes, and this is the specific failure it is built to catch - a floating-point orientation test
    on nearly-collinear points is exactly how a 0.0040 margin gets misclassified, and NULL-1 fires
    on it. If NULL-1 reports any point off-hull, the implementation is wrong and no result is
    reported.
    NULL-2, THE CALIBRATED FALSE-POSITIVE RATE. Draw point sets from a strictly convex curve plus
    Gaussian noise of declared magnitude sigma, at the same cardinality as S. The expected number
    of off-hull points is then a function of sigma alone and is estimated over at least 8 draws
    (KN-TECH-1a5b7e mode 5: a generated comparator is a measurement and needs a sample size). This
    supplies the false-positive rate to quote beside any "off-hull" verdict on S. CAN IT FAIL:
    yes - if the observed off-hull count on S is inside the interval NULL-2 produces at the sigma
    implied by the exponents' own uncertainty, then S is indistinguishable from a convex set with
    noise and NO non-convexity is reportable.
    NULL-3, THE FORCED-VALUE DERIVATION (obligation 4, done before running). Two facts are forced
    and therefore carry no information: the dominated point (0.2075, 0.3300) must be off-hull, and
    the extreme points of S in each coordinate must be on-hull. Both are derived in advance and
    checked; a run that reports them as findings is inadmissible. The informative content is
    restricted to the INTERIOR points, and the report must state that restriction.
    VERDICT ON THE NULL ARM FIRST: the classification rule (on-hull / off-hull / UNDECIDED under
    the sensitivity region of Stage 4) is emitted on NULL-1 and NULL-2 before S is classified. If
    it emits the same labels on the convex null as on S, it discriminates nothing.
    CAN THE WHOLE RECORD FAIL: yes, and cheaply. If Stage 2's set difference is empty, the price
    parameterisation is complete over S, Explanation 1 wins, IDEA-20260816-70e41d needs no repair,
    and this record's methodological claim is refuted at a cost of under an hour.
  discriminated_from:
  - >-
    IDEA-20260816-70e41d locates the enumeration/sieving crossover as a curve over a one-parameter
    memory price, by MEASURING step counts and peak list sizes for both algorithms on identical
    lattices and composing them with a priced cost functional. That record measures two algorithms
    and prices them. THIS record measures nothing, considers the whole published family, and makes
    a statement about what its selection rule can and cannot see. The relationship is not
    duplication but repair-or-vindicate: Stage 2's answer either tells 70e41d it needs a budget
    sweep as well, or tells it that its price sweep is complete. Either way 70e41d's measurement
    programme is unaffected and remains necessary, because this record supplies no measured
    exponents at all.
  - >-
    EV-MLKEM-020's T*M^c charge and its committed c* = 0.03164649 / 0.04588645 / 0.00705473 are a
    memory PRICE in exactly the sense of part (A) - the record's own headline is that "the
    inequality c* << 1/3 survives every mutation anyone has yet applied to it". Part (A) shows
    that entire family of mutations lives inside the price parameterisation and therefore cannot
    reach an off-hull algorithm no matter how c is varied. That is a scope statement about a
    committed record and NOT a correction to it; nothing here proposes any status change, and
    AGENTS.md rule 12 is UNMET and inherited.
  - >-
    IDEA-20260807-8fbc86 fits (c_T, c_M) empirically at dimensions 50-85 to test whether the
    relayed 0.292 / 0.2075 are right. This record takes published exponents as given and asks
    about the GEOMETRY of the set they form. If 8fbc86's fit changes a constant, this record's
    Stage 4 sensitivity diagram already shows which hull memberships flip - so the two compose
    directly and neither substitutes for the other.
  - >-
    IDEA-20260821-472aa2 (this session's sibling) asks whether the quantum points in S are
    physically admissible at all, by charging circuit depth and QRAM. THIS record deliberately
    takes them at face value so that the two can be read against each other: if 472aa2 finds the
    quantum points inadmissible under a depth budget, this record's part (D) conclusion is voided
    and the two together form a complete argument. That dependency is stated, not hidden.
  - >-
    IDEA-20260821-374af4 and IDEA-20260821-41cd67 (this session's siblings) measure inputs to the
    per-call cost. They move points within the plane; this record asks about the plane's geometry.
    No overlap in object, method, or cost.
