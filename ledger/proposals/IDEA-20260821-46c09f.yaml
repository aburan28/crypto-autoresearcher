  proof_search_map:
    bottleneck: >-
      The step whose removal changes the conclusion: the assertion, implicit in every priced cost
      model in this lane, that sweeping a scalar memory price explores the achievable time-memory
      frontier. That assertion is a claim about convexity and it has never been checked here.
    baseline_embedding:
      parameter_slice: >-
        alpha = 0 reproduces the free-memory core-SVP convention exactly (select minimum t,
        ignore m), and m0 = infinity reproduces it too. Both parameterisations agree at that
        boundary, which is why the discrepancy is invisible to anyone who only ever evaluates at
        the free-memory point - the exact situation this lane is in.
      reproduction_check: >-
        Symbolic: at alpha = 0 the price minimiser must be the global time-minimiser of S, and at
        m0 >= max m the budget minimiser must be the same point. Asserted as a unit test on the
        hull code, checked, and archived as a frozen fixture.
    observation_collision:
      observable: 'The hull-membership boolean per algorithm.'
      distinct_preimage_search: >-
        COLLISION FOUND, DELIBERATELY, AND IT IS THE OBJECT''S DEFINING WEAKNESS: two algorithms
        with identical (m, t) have identical hull status, so the observable cannot distinguish
        (for example) a sieve that parallelises perfectly from one that does not, nor one whose
        o(d) is mild from one whose o(d) is savage. A concrete collision on the two SIDES of the
        conclusion: an algorithm with a favourable exponent pair and a superpolynomial o(d) is
        on-hull and useless, while an algorithm just above the hull with a tiny o(d) may be the
        fastest thing at every reachable dimension. The record therefore reports hull status
        WITHOUT asserting operational superiority, and every conclusion is phrased as a statement
        about the SELECTION RULE, not about the algorithms.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Replace the scalar-price parameterisation by the budget parameterisation, in which the
        hypothesis "memory is bounded by M" is an exact half-plane constraint rather than a
        weighting.
      predicted_gain: >-
        Not a speedup: a completeness gain in the instrument. The measurable output is the integer
        |budget-optimal set minus price-optimal set|, SURVIVING NULL-4, and the bits by which each
        such point beats the best price-selectable alternative at its budget.
    - transform: observable_fiber
      proposed_object: >-
        Hold the hull-membership observable fixed and vary the discarded structure (o(d) terms,
        parallelisability, QCRAM dependence) to exhibit two algorithms with the same status and
        opposite operational verdicts.
      predicted_gain: >-
        A bounded, explicit statement of what hull membership does NOT determine - which is
        required before anyone uses this record's output to rank attacks.
    quantifier_order: >-
      THEOREM (part A, standard): FOR ALL finite S and FOR ALL alpha >= 0, THERE EXISTS a
      minimiser of t + alpha*m that is a vertex of the lower-left convex hull of S; equivalently,
      for any point p strictly above the hull, THERE IS NO alpha for which p is the unique
      minimiser. DISCRIMINATING EXISTENTIAL, which is what the computation decides: THERE EXISTS a
      budget m0 and a point p in S such that p uniquely minimises t subject to m <= m0 AND p is
      strictly above the hull. NOTE THE ORDER: the theorem is universal in alpha and is not in
      doubt; the whole empirical content is the existential over (m0, p), and it is decided by
      arithmetic on a finite set - a finite set whose FINITENESS is itself the artifact NULL-4
      controls for, since the underlying tuple-sieve family is a continuum.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Over the set S of published SVP algorithm exponent pairs that Stage 0 could read, under
        the named reading (C_i, Q_j), at dimension d, the price parameterisation selects the subset
        A and the budget parameterisation selects the subset B, and B minus A is [explicit list]
        and survives / does not survive the continuum arm, with each surviving point beating the
        best price-selectable alternative at its budget by [explicit bits]." NOTHING about which
        algorithm is actually fastest, nothing about concrete cost, nothing about ML-KEM's security.
      nearby_object_control: >-
        The nearby object where the desired conclusion fails is a set S' identical to S but with
        every point perturbed onto its own hull (i.e. an exactly convex frontier). The method must
        return B minus A empty there. If it does not, the method is detecting its own arithmetic
        and not the geometry - this is NULL-1, and it is run first. The SECOND nearby object, added
        on review, is the continuum from which S is a sample: the method must not manufacture a
        pocket there, and that is NULL-4.
    proof_obligations:
    - claim: The price minimiser is always a hull vertex.
      responsibility: baseline
    - claim: The budget minimiser need not be, exhibited by explicit example or shown impossible over S.
      responsibility: strictness
    - claim: Hull computation uses exact rational arithmetic; NULL-1 returns all-on-hull.
      responsibility: correctness
    - claim: Every exponent in S is read from a primary source or a verbatim corpus transcription,
        or the point is excluded; the exclusion list names KN-LIT-4639's memory exponent, the
        0.3717 triple sieve and the 0.368 min-space variant.
      responsibility: interface
    - claim: The false-positive rate for an off-hull verdict is calibrated by NULL-2 over >= 8 draws.
      responsibility: success_probability
    - claim: Every reported |B minus A| is accompanied by the continuum answer and the
        three-density monotonicity report, or is declared uncontrolled and not a finding.
      responsibility: strictness
    - claim: No illustrative figure computed from a rounded input is reported as a result; Stage 1's
        exact rational values supersede every number in part (B).
      responsibility: correctness
    - claim: No conclusion is drawn about concrete cost at any dimension.
      responsibility: scope
    not_applicable_reason: null
