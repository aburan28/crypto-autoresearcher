      and, in KN-TECH-020 and KN-TECH-043, describe the classical sieve as 2^{0.292n} time AND
      SPACE; KN-TECH-044 records a min-space variant at 0.368 and the kissing-number memory floor
      2^{0.2075n}; KN-LIT-122 (AGPS20) records that the realisable circuit-level quantum speedup
      is small and assumption-laden, i.e. that no quantum row of S should be read as a cost.
      KN-OPEN-017 states as an OPEN PROBLEM of this program exactly the question of where the
      enumeration/sieving crossover moves once sieving memory is charged, and records that "no
      source in this corpus computes the crossover under full cost" - which is the closest standing
      statement of this record's subject matter and was not cited when this record was filed.
      WHAT SURVIVES AS A REPOSITORY NEGATIVE: no proposal in any lane uses any of these entries as
      an object; nothing in this repository computes a hull of algorithm cost pairs, tests
      convexity, or distinguishes price from budget selection. The corpus contains NO entry for
      ePrint 2025/2189; the grep for 0.2846 and for "Engelberts" returns nothing, so that
