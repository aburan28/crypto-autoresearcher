    results: >-
      CORRECTED ON RED-TEAM REVIEW. The corpus contains MORE (m, t) pairs than this record's first
      screen saw, and one of them reverses this record's original headline. Specifically:
      KN-LIT-703 (ePrint 2019/101, citation_verified: read) records a quantum k-Sieve at
      2^{0.2989d} time / 2^{0.1395d} memory in the QRAM model, and records Laarhoven's anchor as
