      point. PARALLELISATION POSITION, and it is not decoration: tuple sieves reduce memory at the
      cost of time and are therefore the natural family under a hard-budget regime, while the price
      regime never selects them unless they are exactly on the hull - so the choice of
      parameterisation changes which family a cost model believes an attacker uses, which changes
      the parallelisation model, which changes the wall-clock estimate. That chain is the practical
      reason the integer |B minus A| is worth an hour.
