idea:
  id: IDEA-20260821-46c09f
  question_id: RQ-MLKEM-003
  added: '2026-08-21'
  title: >-
    Price and budget are not the same parameterisation of memory, and the difference is exactly
    the lower convex hull: track the HULL MEMBERSHIP of each SVP algorithm's (memory-exponent,
    time-exponent) pair, prove that no linear memory price can ever select an off-hull algorithm
    while a hard memory budget routinely does, and recompute the hull over the FULL set of
    (memory-exponent, time-exponent) pairs this corpus already records - KN-LIT-703's quantum
    k-Sieve at (0.1395, 0.2989), KN-LIT-4639's quantum random-walk sieve, KN-LIT-6765's tuple
    points, KN-TECH-040's core-SVP anchors - rather than a hand-picked subset; under one hour of
    single-core arithmetic, against a convex-by-construction null AND a discretisation-density
    sweep that can declare the headline integer an artifact
  class: representation
  claim: >-
    (A) THE REPRESENTATION CLAIM, WHICH IS A THEOREM AND NOT AN EXPERIMENT. Let S be the finite
    set of (m, t) pairs, m = log2(memory)/d and t = log2(time)/d, over the known SVP algorithm
    families at dimension d. Two ways to ask "what does memory cost" are in use in this lane.
    PRICE: minimise t + alpha*m over S for a scalar price alpha >= 0, which is what
    IDEA-20260816-70e41d's memory-priced crossover curve does and what EV-MLKEM-020's T*M^c
    charge does. BUDGET: minimise t subject to m <= m0 for a hard ceiling m0. THE TWO ARE NOT
    EQUIVALENT AND THE OBSTRUCTION IS EXACTLY CONVEXITY: for every alpha the price minimiser is a
    vertex of the LOWER CONVEX HULL of S, by the standard supporting-hyperplane argument, so an
    algorithm strictly above the hull is selected by NO price whatsoever; whereas the budget
    minimiser at m0 is the lowest t among points with m <= m0, which can be an off-hull point.
    Consequently, if the hull of S has any point strictly above it that is nonetheless the
    time-minimiser at some achievable budget, then every price-parameterised crossover in this
    lane systematically mis-locates the optimum at those budgets, and the size of the miss is
    computable exactly.
    (B) THE HULL IS RAZOR-THIN AT EXACTLY THE POINT THAT MATTERS - UNDER ONE READING OF THE
    CLASSICAL ANCHOR, AND NOT UNDER THE OTHER.
    ILLUSTRATIVE DERIVATION, ARITHMETIC ONLY, FROM A MIXTURE OF RETRIEVED, CORPUS AND RECALLED
    EXPONENTS, AND NOT A FINDING - every recalled input is flagged in `citations` and Stage 0
    replaces all of them with read values before any conclusion is drawn.
    Classical points: 2-sieve at (0.2075, 0.292) [RECALLED memory, corpus-contested - see the
    READING AMBIGUITY paragraph below]; 3-sieve at (0.1887, 0.3588) [RETRIEVED, ePrint 2017/1228,
    verbatim "time 2^{0.3588n + o(n)} and space 2^{0.1887n + o(n)}", and independently recorded in
    corpus entry KN-LIT-6765]; 3-sieve at larger memory (0.2075, 0.3300) [RETRIEVED, same source];
    Herold-Kirshanova triple sieve at t = 0.3717 with memory NOT stated in either the abstract or
    KN-LIT-6765 [EXCLUDED from S until read]; "min-space" sieving at t = 0.368 with memory NOT
    stated in KN-TECH-044 [EXCLUDED until read]. Enumeration at (approx 0, 0.125*log2 d)
    [RECALLED constant, and refused by IDEA-20260805-cdc87d - see `discriminated_from`].
    At d = 385.084530, the committed ML-KEM-512 effective SVP sieve dimension from EV-MLKEM-020,
    enumeration sits at t = 1.074. The chord from enumeration (0, 1.074) to the 2-sieve
    (0.2075, 0.292) has slope -3.769 and passes through t = 0.3628 at m = 0.1887. The 3-sieve
    sits at 0.3588, i.e. BELOW the chord BY 0.0040 IN EXPONENT = 1.54 BITS AT THIS DIMENSION.
    PRECISION NOTE ADDED ON THE 2026-08-24 PROVENANCE PASS: those two figures are computed with
    the enumeration anchor rounded to 1.074. Carrying it unrounded (0.125 * log2(385.084530) =
    1.0737357) gives chord slope -3.767402, chord height 0.3629271 at m = 0.1887, and a margin of
    0.0041 in exponent = 1.59 bits. The difference is rounding, it does not change the sign, and
    it is far inside the uncertainty in the recalled enumeration constant itself - which
    IDEA-20260805-cdc87d refuses outright. Stage 1 computes this in exact rationals and the
    illustrative figures here are not to be quoted as results.
    READING AMBIGUITY THAT DECIDES THIS PARAGRAPH, ADDED ON REVIEW AND LOAD-BEARING: the memory
    exponent 0.2075 is NOT recorded anywhere in this corpus as the memory of the 2^{0.292n} sieve.
    KN-LIT-107 records 2^{0.2075b} as core-SVP's "best plausible" TIME floor from the kissing
    number; KN-TECH-044 records 2^{0.2075n} as a LOWER BOUND on sieve memory; and KN-TECH-020 and
    KN-TECH-043 record the BDGL-class sieve as "2^{0.292n} heuristic time AND SPACE" and
    "2^{0.292n+o(n)} time and comparable space". Call these READING C1 (2-sieve at (0.2075, 0.292),
    the record's recalled value) and READING C2 (2-sieve at (0.292, 0.292), the corpus's own text).
    Under C2 the enumeration-to-2-sieve chord is far shallower, BOTH tuple points (0.1887, 0.3588)
    AND (0.2075, 0.3300) are lower-hull vertices, and the point NULL-3 derives as "forced off-hull"
    is not off-hull at all. Stage 0 must resolve C1 versus C2 from primary text before any hull is
    reported, and Stage 4 carries both as named readings rather than as an interval.
    (C) THE QUANTUM CASE, RECOMPUTED OVER THE CORPUS'S OWN QUANTUM POINTS - AND THE ORIGINAL
    HEADLINE OF THIS RECORD IS WITHDRAWN BY THAT RECOMPUTATION.
    WHAT THIS PARAGRAPH SAID WHEN FILED, AND WHY IT IS WITHDRAWN. As filed, part (C) asserted that
    ePrint 2025/2189's improvement of quantum 3-tuple sieving from 2^{0.3098d} to 2^{0.2846d}
    flipped that algorithm from off-hull to on-hull, and that this flip was the record's headline
    deliverable. That assertion was computed over a three-point quantum set {enumeration,
    (0.2075, 0.265), 3-tuple} assembled from recollection. The corpus already contains a fourth
    point that the filed novelty screen's grep pattern could not match: KN-LIT-703
    (ePrint 2019/101, Kirshanova-Martensson-Postlethwaite, citation_verified: read) records a
    quantum k-Sieve solving SVP in 2^{0.2989d+o(d)} time using 2^{0.1395d+o(d)} memory in the QRAM
    model. Inserting (0.1395, 0.2989) into the quantum set changes the answer:
    READING Q1, keeping this record's own recalled Laarhoven anchor (0.2075, 0.265). The quantum
    lower hull between m = 0.1395 and m = 0.2075 is the chord of slope -0.498529, which passes
    through t = 0.274372 at m = 0.1887, not 0.28964. The NEW 3-tuple point at 0.2846 is then
    ABOVE that hull by 0.010228 = 3.94 bits at d = 385.084530, and the OLD point at 0.3098 is
    above it by 0.035428 = 13.64 bits. BOTH ARE OFF-HULL; THE STATUS IS UNCHANGED ACROSS THE
    0.3098 -> 0.2846 SUBSTITUTION; and this record's own falsification_conditions item 4 fires.
    Under Q1, part (C) as filed is REFUTED BEFORE ANY EXPERIMENT and is withdrawn.
    READING Q2, using the Laarhoven anchor as KN-LIT-703 itself records it - "solves SVP in
    2^{0.2653d+o(d)} time steps AND MEMORY", i.e. the point (0.2653, 0.2653), which is also the
    figure KN-LIT-4639 relays for Laa16. The hull chord from (0.1395, 0.2989) to (0.2653, 0.2653)
    has slope -0.267091 and passes through t = 0.285759 at m = 0.1887. The new 3-tuple point at
    0.2846 is then BELOW it by 0.001159 = 0.45 bits and the old point at 0.3098 is above it by
    0.024041 = 9.26 bits, so the status DOES change - but 0.45 bits is a tenth of the smallest
    margin this record calls decidable and sits squarely inside Stage 4's UNDECIDED band. Under
    Q2 the honest verdict is UNDECIDED, not on-hull.
    WHAT PART (C) NOW CLAIMS, AND IT IS WEAKER AND CHEAPER TO TEST THAN WHAT IT REPLACED: the
    hull status of the 2025 quantum 3-tuple point is DECIDED BY WHICH READING OF THE LAARHOVEN
    ANCHOR STAGE 0 ESTABLISHES, is off-hull under the reading this record originally used, and is
    on-hull by less than half a bit under the reading the corpus records. The decision-relevant
    object that survives is a different one: KN-LIT-703's (0.1395, 0.2989) is a quantum memory
    frontier point 0.0492 in exponent to the LEFT of anything this lane has ever considered, it is
    a hull vertex under both readings by construction (it is the minimum-memory point of the
    quantum set), and no record in this program has ever placed it.
    A FURTHER POINT THE CORPUS HOLDS AND THIS RECORD CANNOT YET USE: KN-LIT-4639
    (Chailloux-Loyer, "Lattice sieving via quantum random walks", citation_verified: read) records
    a quantum sieve at 2^{0.2570d+o(d)}, strictly faster than the 0.265 anchor, and states it
    "quantif[ies] the amount of quantum memory and quantum random access memory" - but the corpus
    entry does NOT record that memory exponent. The point is therefore EXCLUDED from S with its
    time coordinate recorded and its memory coordinate marked unread. IF Stage 0 reads a memory
    exponent at or below 0.2075 for it, it dominates the Laarhoven anchor outright and every
    number in Q1 and Q2 is recomputed against it. This exclusion is the single largest known gap
    in S and is declared here rather than discovered later.
    (D) A SECOND CONSEQUENCE FROM THE SAME OBJECT: THE DIRECTION SURVIVES THE CORPUS INSERTION,
    THE MAGNITUDE DOES NOT. As filed this paragraph reported a classical frontier slope of 3.553
    and a quantum slope of 1.043 between m = 0.2075 and m = 0.1887, hence a 3.4x flatter quantum
    frontier and a gap ratio of 2.75. The quantum slope 1.043 was computed from the 3-tuple point,
    which the recomputation above shows is off-hull under Q1, so that number is WITHDRAWN. The
    recomputed quantum HULL slope between those memories is 0.498529 under Q1 and 0.267091 under
    Q2, i.e. the quantum frontier is 7.1x or 13.3x flatter than the classical 3.553, not 3.4x.
    The derived gap ratio (classical-minus-quantum time exponent at m = 0.1887, divided by the
    same at m = 0.2075) is 3.127 under (C1, Q1), 6.486 under (C1, Q2), and 1.299 under (C2, Q1),
    where the classical hull vertices are (0.1887, 0.3588) and (0.2075, 0.3300). ALL THREE EXCEED
    1, so the direction - the classical-quantum gap WIDENS as the memory budget tightens - is
    robust across every reading this session could construct; the specific value 2.75 is not, and
    is replaced by the range 1.30-6.49 pending Stage 0. ML-KEM's quantum category assignment was
    made under a FREE-MEMORY convention; under a memory budget the quantum advantage is LARGER,
    not smaller, and that direction is what part (D) now claims.
    (E) WHAT IS NOT CLAIMED. No attack is implemented, no instance is solved, nothing is measured.
    Every number above is arithmetic on published asymptotic exponents whose o(d) terms are
    unbounded, and asymptotic exponents do not license any statement about concrete cost at
    d = 385 or d = 825 - the conversion "exponent times dimension = bits" is a convention-internal
    device used to express SIZE, not a cost prediction, and is labelled as such wherever it
    appears. The quantum points additionally assume QRAM/QCRAM, which the sibling record
    IDEA-20260821-472aa2 attacks directly and which this record deliberately takes at face value
    so that the two can be compared; KN-LIT-122 (Albrecht-Gheorghiu-Postlethwaite-Schanck) is the
    corpus's standing warning that a quantum exponent is not a cost without a circuit-level
    source, and it applies to every quantum row of S. No FIPS 203 parameter set is affected or
    cleared here.
  mechanism: >-
    STAGE 0 - BUILD S FROM THE CORPUS FIRST, THEN FROM PRIMARY SOURCES, AND EXCLUDE THE REST.
    STAGE 0a, ZERO-COMPUTE AND OWED BEFORE ANYTHING ELSE: enumerate every (m, t) pair already
    recorded in knowledge/. The set found by the corrected screen below is: KN-LIT-6765
    (0.1887, 0.3588) and (0.2075, 0.3300), plus t = 0.3717 with memory unstated; KN-LIT-703
    (0.1395, 0.2989) quantum QRAM, plus Laarhoven at (0.2653, 0.2653) as that entry states it;
    KN-LIT-4639 quantum random walk at t = 0.2570 with memory unstated; KN-LIT-107 / KN-TECH-040 /
    KN-TECH-038 / KN-TECH-042 core-SVP anchors t = 0.292 classical, t = 0.265 quantum, t = 0.2075
    "best plausible" floor; KN-TECH-020 and KN-TECH-043 recording the classical sieve as
    2^{0.292n} time AND space; KN-TECH-044 recording sieve memory bounded below by 2^{0.2075n} and
    a min-space variant at t = 0.368. EVERY ONE OF THESE ROWS ENTERS S OR ENTERS THE EXCLUSION
    LIST WITH A REASON. The C1/C2 and Q1/Q2 reading ambiguities in part (B) and part (C) are
    resolved here or carried as named readings throughout.
    STAGE 0b - REPLACE EVERY RECALLED EXPONENT WITH A READ ONE. Fetch and read the primary sources
    for each family and record, per point, the exact (m, t) pair, the memory MODEL (classical
    bits, QCRAM bits, qubits - these are not interchangeable and must not be plotted on one axis
    without a declared conversion), the k of the tuple sieve, and whether o(d) is additive in the
    exponent or multiplicative. Any point whose source cannot be read is EXCLUDED from S and
    recorded as excluded, not estimated. Priority order for reading, by how much the answer moves:
    (1) KN-LIT-4639's memory exponent, (2) the Laarhoven anchor Q1-versus-Q2, (3) the classical
    2-sieve memory C1-versus-C2, (4) the enumeration constant. This is the entire cost of the
    record and it is reading, not compute.
    STAGE 0c - THE CONTINUUM AND THE GRID, DECLARED BEFORE ANY HULL IS COMPUTED. The tuple-sieve
    literature's tradeoff is a CONTINUUM in k and in an internal parameter, and S discretises it.
    Read the body of ePrint 2017/1228 for the parametric (m(k, .), t(k, .)) curve for arbitrary
    tuple size, and the corresponding quantum curve where one exists, and record the parametric
    form verbatim with its page. If the body cannot be obtained, record that and carry the
    consequence declared in NULL-4: no |B minus A| arising from a tuple-sieve point is reportable
    as a finding.
    STAGE 1 - THE HULL, COMPUTED. Compute the lower-left convex hull of S (minimise t, minimise m)
    with exact rational arithmetic, not floating point, because the classical 3-sieve's margin of
    0.0040 under C1 and the quantum 3-tuple margin of 0.001159 under Q2 are within a few ulps of
    the kind of error a naive orientation test makes. Emit, per point: on-hull or off-hull, and if
    off-hull, the exact vertical distance to the hull in exponent units and in bits at each of the
    three committed effective sieve dimensions 385.084530 / 590.132012 / 825.235330 from
    EV-MLKEM-020. Emit one hull per (classical reading, quantum reading) cell of the C1/C2 x Q1/Q2
    table, never a single hull.
    STAGE 2 - THE TWO SELECTION MAPS, COMPUTED AND COMPARED. For alpha on a grid in [0, 1], record
    the price minimiser; for m0 on a grid covering [0, 0.30], record the budget minimiser. Emit
    the set of algorithms selected by SOME price and the set selected by SOME budget. The
    difference of those two sets is the deliverable. Its size is a small integer and it is either
    empty or not. IT IS NOT REPORTABLE UNTIL NULL-4 HAS RUN.
    STAGE 3 - WHY THIS DISCRIMINATES BETWEEN TWO EXPLANATIONS OF THIS LANE'S OWN METHODOLOGY.
    EXPLANATION 1, THE ONE CURRENTLY IN USE: memory is a priced resource, the crossover between
    algorithm families is a curve over that price, and sweeping the price traces the whole
    achievable frontier - so a price sweep is a complete instrument. EXPLANATION 2: memory is a
    hard physical ceiling, the achievable set is not convex, and the price sweep is blind to
    exactly the algorithms that live in the non-convex pockets. THESE ARE DISTINGUISHED BY ONE
    INTEGER: the number of points in S that are budget-optimal at some m0 and price-optimal at no
    alpha, SURVIVING THE CONTINUUM ARM. Zero means Explanation 1 is right, the price
    parameterisation is complete, and IDEA-20260816-70e41d's framing needs no repair - a clean
    negative that strengthens a sibling. Non-zero AND surviving NULL-4 names the blind spot and
    quantifies it in bits. Non-zero and NOT surviving NULL-4 is a discretisation artifact and is
    reported as such, which is a third outcome declared in advance.
    STAGE 4 - THE SENSITIVITY THAT DECIDES CREDIBILITY. Because the classical 3-sieve's hull
    margin is 0.0040 under C1 and the quantum 3-tuple margin 0.001159 under Q2, the answer is not
    robust and pretending otherwise would be the failure mode. Report the hull membership of every
    point as a function of the four most uncertain inputs - the Chailloux-Loyer memory exponent,
    the Laarhoven anchor (Q1/Q2), the classical 2-sieve memory (C1/C2), and the enumeration
    constant (0.125 versus IDEA-20260805-cdc87d's in-lane 0.047640) - as an explicit region
    diagram, and state for each point the interval or reading-set over which its hull status is
    stable. A point whose status flips across any named reading is reported as UNDECIDED, not as
    on-hull or off-hull. Under this rule the 2025 quantum 3-tuple point is ALREADY UNDECIDED
    before the batch runs, from the arithmetic in part (C), and the batch's job is to decide it.
