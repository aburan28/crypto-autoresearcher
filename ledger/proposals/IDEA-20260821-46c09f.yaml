    results: >-
      The corpus contains the classical tuple-sieve frontier as KN-LIT-6765 (Herold-Kirshanova-
      Laarhoven) and the d4f paper as KN-LIT-105, and NO proposal in any lane uses either as an
      object. The corpus contains NO entry for ePrint 2025/2189; the grep for 0.2846 and for
      "Engelberts" returns nothing, so the October-2025 quantum 3-tuple result is absent from this
      program entirely and is being brought in by this record. IDEA-20260816-70e41d is the closest
      in-lane record and is the direct target of the methodological claim: it parameterises memory
      by a PRICE, which the theorem in part (A) shows can only ever select hull vertices. Nothing
      in this repository computes a hull of algorithm cost pairs, tests convexity, or distinguishes
      price from budget selection. EV-MLKEM-020's T*M^c charge is a price in exactly the sense of
      part (A) and its committed critical exponents c* = 0.03164649 / 0.04588645 / 0.00705473 are
      price thresholds, not budget thresholds.
    verdict: >-
      ADAPTATION, and labelled that rather than speculative because the mathematical content of
      part (A) is the standard supporting-hyperplane fact and is not new to anybody; what is new
      is applying it to THIS lane's memory-charge methodology and recomputing the frontier with a
      result the corpus does not have. NOVELTY IS NOT CLAIMED against the external literature:
      whether someone has already published the observation that the memory-budgeted quantum
      advantage exceeds the free-memory one is UNKNOWN to this record, I did not search for it
      specifically, and a reviewer with retrieval should chase it. CLAIMED NEW RELATIVE TO THIS
