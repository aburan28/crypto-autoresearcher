idea:
  id: IDEA-20260821-46c09f
  question_id: RQ-MLKEM-003
  added: '2026-08-21'
  title: >-
    Price and budget are not the same parameterisation of memory, and the difference is exactly
    the lower convex hull: track the HULL MEMBERSHIP of each SVP algorithm's (memory-exponent,
    time-exponent) pair, prove that no linear memory price can ever select an off-hull algorithm
    while a hard memory budget routinely does, and recompute the hull with an October-2025
    quantum 3-tuple-sieve result that this corpus does not contain and that moves a point across
    it - under one hour of single-core arithmetic, against a convex-by-construction null
  class: representation
  claim: >-
    (A) THE REPRESENTATION CLAIM, WHICH IS A THEOREM AND NOT AN EXPERIMENT. Let S be the finite
    set of (m, t) pairs, m = log2(memory)/d and t = log2(time)/d, over the known SVP algorithm
    families at dimension d. Two ways to ask "what does memory cost" are in use in this lane.
    PRICE: minimise t + alpha*m over S for a scalar price alpha >= 0, which is what
    IDEA-20260816-70e41d's memory-priced crossover curve does and what EV-MLKEM-020's T*M^c
    charge does. BUDGET: minimise t subject to m <= m0 for a hard ceiling m0. THE TWO ARE NOT
    EQUIVALENT AND THE OBSTRUCTION IS EXACTLY CONVEXITY: for every alpha the price minimiser is a
    vertex of the LOWER CONVEX HULL of S, by the standard supporting-hyperplane argument, so an
    algorithm strictly above the hull is selected by NO price whatsoever; whereas the budget
    minimiser at m0 is the lowest t among points with m <= m0, which can be an off-hull point.
    Consequently, if the hull of S has any point strictly above it that is nonetheless the
    time-minimiser at some achievable budget, then every price-parameterised crossover in this
    lane systematically mis-locates the optimum at those budgets, and the size of the miss is
    computable exactly.
    (B) THE HULL IS RAZOR-THIN AT EXACTLY THE POINT THAT MATTERS, AND A 2025 RESULT MOVED IT.
    ILLUSTRATIVE DERIVATION, ARITHMETIC ONLY, FROM A MIXTURE OF RETRIEVED AND RECALLED EXPONENTS,
    AND NOT A FINDING - every recalled input is flagged in `citations` and Stage 0 replaces all of
    them with read values before any conclusion is drawn.
    Classical points: 2-sieve at (0.2075, 0.292) [RECALLED]; 3-sieve at (0.1887, 0.3588)
    [RETRIEVED, ePrint 2017/1228, verbatim "time 2^{0.3588n + o(n)} and space 2^{0.1887n + o(n)}"];
    3-sieve at larger memory (0.2075, 0.3300) [RETRIEVED, same source], which is strictly
    dominated by the 2-sieve at identical memory and is therefore never selected by price OR
    budget - a useful sanity anchor. Enumeration at (approx 0, 0.125*log2 d) [RECALLED constant].
    At d = 385.084530, the committed ML-KEM-512 effective SVP sieve dimension from EV-MLKEM-020,
    enumeration sits at t = 1.074. The chord from enumeration (0, 1.074) to the 2-sieve
    (0.2075, 0.292) has slope -3.769 and passes through t = 0.3628 at m = 0.1887. The 3-sieve
    sits at 0.3588, i.e. BELOW the chord BY 0.0040 IN EXPONENT = 1.54 BITS AT THIS DIMENSION. The
    classical 3-sieve is therefore on the hull by a margin smaller than ML-KEM-512's committed
    2.800527-bit undercut, and whether it is on the hull at all is decided by the enumeration
    constant, which is recalled here and contested in the literature.
    (C) THE QUANTUM CASE, WHERE THE ANSWER CHANGED IN OCTOBER 2025 AND THIS CORPUS DOES NOT KNOW.
    ePrint 2025/2189 (Engelberts, Chen, Gilani, van Hoof, Jeffery, de Wolf, RETRIEVED and read
    this session) improves quantum 3-tuple sieving from 2^{0.3098d} to 2^{0.2846d} using
    2^{0.1887d} classical and QCRAM bits and 2^{o(d)} qubits, and states it is "the fastest known
    quantum algorithm for SVP when total memory is limited to 2^{0.1887d}" - a budget statement,
    not a price statement. With the quantum 2-sieve at (0.2075, 0.265) [RECALLED] and quantum
    enumeration at roughly half the classical enumeration exponent, the chord to m = 0.1887 sits
    at t = 0.2896 by the same arithmetic. THE OLD QUANTUM 3-SIEVE AT 0.3098 IS ABOVE THAT CHORD BY
    0.0202 = 7.8 BITS AT d = 385 AND IS THEREFORE OFF-HULL AND SELECTABLE BY NO MEMORY PRICE; THE
    NEW ONE AT 0.2846 IS BELOW IT BY 0.0050 = 1.9 BITS AND IS ON THE HULL. A single external
    result flipped an algorithm from price-invisible to price-selectable, which is precisely the
    behaviour that makes the price parameterisation unsafe to rely on.
    (D) A SECOND, INDEPENDENT CONSEQUENCE FROM THE SAME OBJECT. The classical frontier's slope
    between m = 0.2075 and m = 0.1887 is (0.3588-0.292)/0.0188 = 3.553 exponent units of time per
    exponent unit of memory; the quantum frontier's is (0.2846-0.265)/0.0188 = 1.043. THE QUANTUM
    FRONTIER IS 3.4x FLATTER, so the classical-quantum exponent gap WIDENS as the memory budget
    tightens: 0.027 at m = 0.2075 versus 0.0742 at m = 0.1887, a factor 2.75. At the committed
    ML-KEM-512 sieve dimension that is 10.40 bits versus 28.57 bits; at the committed ML-KEM-1024
    dimension 825.235330 it is 22.28 bits versus 61.23 bits. ML-KEM's quantum category assignment
    was made under a FREE-MEMORY convention. Under a memory budget the quantum advantage is
    LARGER, not smaller - a direction this lane has never stated and which points against ML-KEM's
    margin rather than for it.
    (E) WHAT IS NOT CLAIMED. No attack is implemented, no instance is solved, nothing is measured.
    Every number above is arithmetic on published asymptotic exponents whose o(d) terms are
    unbounded, and asymptotic exponents do not license any statement about concrete cost at
    d = 385 or d = 825 - the conversion "exponent times dimension = bits" is a convention-internal
    device used to express SIZE, not a cost prediction, and is labelled as such wherever it
    appears. The quantum points additionally assume QCRAM, which the sibling record
    IDEA-20260821-472aa2 attacks directly and which this record deliberately takes at face value
    so that the two can be compared. No FIPS 203 parameter set is affected or cleared here.
  mechanism: >-
    STAGE 0 - REPLACE EVERY RECALLED EXPONENT WITH A READ ONE. Fetch and read the primary sources
    for each family and record, per point, the exact (m, t) pair, the memory MODEL (classical
    bits, QCRAM bits, qubits - these are not interchangeable and must not be plotted on one axis
    without a declared conversion), the k of the tuple sieve, and whether o(d) is additive in the
    exponent or multiplicative. Any point whose source cannot be read is EXCLUDED from S and
    recorded as excluded, not estimated. This is the entire cost of the record and it is reading,
    not compute.
    STAGE 1 - THE HULL, COMPUTED. Compute the lower-left convex hull of S (minimise t, minimise m)
    with exact rational arithmetic, not floating point, because the classical 3-sieve's margin of
    0.0040 is within a few ulps of the kind of error a naive orientation test makes. Emit, per
    point: on-hull or off-hull, and if off-hull, the exact vertical distance to the hull in
    exponent units and in bits at each of the three committed effective sieve dimensions
    385.084530 / 590.132012 / 825.235330 from EV-MLKEM-020.
    STAGE 2 - THE TWO SELECTION MAPS, COMPUTED AND COMPARED. For alpha on a grid in [0, 1], record
    the price minimiser; for m0 on a grid covering [0, 0.21], record the budget minimiser. Emit
    the set of algorithms selected by SOME price and the set selected by SOME budget. The
    difference of those two sets is the deliverable. Its size is a small integer and it is either
    empty or not.
    STAGE 3 - WHY THIS DISCRIMINATES BETWEEN TWO EXPLANATIONS OF THIS LANE'S OWN METHODOLOGY.
    EXPLANATION 1, THE ONE CURRENTLY IN USE: memory is a priced resource, the crossover between
    algorithm families is a curve over that price, and sweeping the price traces the whole
    achievable frontier - so a price sweep is a complete instrument. EXPLANATION 2: memory is a
    hard physical ceiling, the achievable set is not convex, and the price sweep is blind to
    exactly the algorithms that live in the non-convex pockets. THESE ARE DISTINGUISHED BY ONE
    INTEGER: the number of points in S that are budget-optimal at some m0 and price-optimal at no
    alpha. Zero means Explanation 1 is right, the price parameterisation is complete, and
    IDEA-20260816-70e41d's framing needs no repair - a clean negative that strengthens a sibling.
    Non-zero names the blind spot and quantifies it in bits.
    STAGE 4 - THE SENSITIVITY THAT DECIDES CREDIBILITY. Because the classical 3-sieve's hull
    margin is 0.0040 and the quantum one 0.0050, the answer is not robust and pretending otherwise
    would be the failure mode. Report the hull membership of every point as a function of the two
    most uncertain inputs - the enumeration constant and the 2-sieve time constant - as an
    explicit region diagram, and state for each point the interval of those constants over which
    its hull status is stable. A point whose status flips inside the plausible range of a recalled
    constant is reported as UNDECIDED, not as on-hull or off-hull.
