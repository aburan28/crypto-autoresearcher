  confounders:
  - >-
    THE o(d) TERMS, and this is the dominant one. Gaps of 0.001-0.005 in exponent are far inside
    what an unbounded o(d) can move. EV-MLKEM-020's own record already states "THE o(1) IN
    2^(0.2075n + o(n)) IS UNBOUNDED HERE". Nothing in this record survives being read as a
    concrete cost statement, and the survival score says one step for exactly this reason.
  - >-
    DISCRETISATION OF A CONTINUUM, PROMOTED FROM A CONFOUNDER TO A CONTROLLED ARM ON RED-TEAM
    REVIEW. The tuple-sieve literature's tradeoff curves are continua in k and in an internal
    parameter; sampling them at two or three k values can create pockets of non-convexity that
    exist only in the sample. Every declared null except NULL-4 is blind to this mode: NULL-1 tests
    orientation arithmetic on a linear set, NULL-2 calibrates false positives from Gaussian noise
    on exponents, NULL-3 derives forced facts. NULL-4 is the arm that varies the parameter meant to
    destroy the signal - the density of the k-grid - and its inadmissibility rule is binding.
  - >-
    ROUNDING IN THE ILLUSTRATIVE ARITHMETIC, ADDED 2026-08-24. Part (B)'s margin is quoted as
    0.0040 in exponent (1.54 bits) with the enumeration anchor rounded to 1.074, and as 0.0041
    (1.59 bits) with it unrounded at 1.0737357. A 3% wobble in a quantity the record itself calls
    razor-thin is a real confounder for anyone quoting these figures, even though it is far inside
    the uncertainty in the recalled enumeration constant. Stage 1's exact rational requirement and
    the rounding self-check in `controls` exist to keep this out of any reported number.
  - >-
    Memory-model incommensurability. QCRAM bits are not classical bits and neither is a qubit. A
    hull computed across mixed memory models is a category error unless the conversion is declared;
    the record's default is to segregate the classical and quantum hulls and to report them
    separately, and the cross-model comparison in part (D) is explicitly a comparison of two
    separate hulls, not a single hull. KN-LIT-703's point is a QRAM-model point and ePrint
    2025/2189's is a classical-plus-QCRAM point; whether they belong on the same axis is itself a
    Stage 0 decision to be declared, not assumed.
  - >-
    The enumeration point is dimension-dependent (t grows like log d) while the sieve points are
    not, so hull membership is a function of d and any statement without a stated d is
    meaningless. Every reported status carries its d.
  - >-
    Selection of S, and this record is its own cautionary example. Which algorithms are included
    changes the hull; an incomplete S can manufacture non-convexity by omission AND can manufacture
    a spurious on-hull verdict by omission, which is exactly what happened to part (C) when
    KN-LIT-703 was absent. The exclusion list is therefore a required artifact and is as important
    as the inclusion list.
  - >-
    Published exponents are optimised asymptotically, not at d = 400. A family whose exponent is
    optimal may have a worse constant.
  interpretation_limits:
  - This is arithmetic on asymptotic exponents. It is not a measurement, not an attack, not a cost
    prediction, and not a statement about ML-KEM's security. Expressing an exponent gap "in bits at
    d = 385" is a device for conveying SIZE and is not a claim that any attack costs that many bits.
  - Hull membership does not rank algorithms operationally; the observation-collision analysis
    above exhibits explicit pairs where it is misleading in both directions.
  - The quantum points are conditional on QRAM/QCRAM. KN-LIT-122 in this corpus and arXiv
    2410.13759 retrieved this session both conclude the realisable quantum advantage is small;
    part (D) must be read against both and is voided if the sibling record IDEA-20260821-472aa2
    finds the quantum points depth-inadmissible.
  - Every number in parts (B), (C) and (D) is reported under a NAMED READING of a contested
    constant. A number quoted without its reading label is a misquotation of this record.
  - Part (B)'s figures are additionally quoted at the precision of a rounded enumeration anchor;
    0.0040 / 1.54 bits becomes 0.0041 / 1.59 bits unrounded. Neither is a result, both are
    superseded by Stage 1, and the difference is recorded rather than smoothed over.
  - Nothing here proposes a status change to EV-MLKEM-020, EV-MLKEM-015 or any committed record.
    AGENTS.md rule 12 is UNMET and inherited from GOAL-MLKEM-003/004.
  - No direction is declared impossible. A finding that the price parameterisation is complete
    over today's S says nothing about tomorrow's S; the October-2025 insertion, and the KN-LIT-703
    insertion that reversed it, are both proofs of that.
  heuristic_assumptions:
  - id: H1
    statement: >-
      (COMMENSURABILITY) For every algorithm in S, the published pair (m, t) is stated in the same
      cost model up to a factor 2^{o(d)}, and the o(d) terms are small enough relative to the hull
      margins that hull membership computed from the leading exponents alone agrees with hull
      membership computed from the true cost functions, for all d in [385, 826]. H1 IS ALMOST
      CERTAINLY FALSE AT THE 0.004 MARGIN and the record says so; it is stated as a numbered
      assumption precisely so that the reader can see which conclusions die with it. The
      conclusions that do NOT depend on H1 are the theorem in part (A) and the before/after hull
      change under a named insertion at fixed convention, which are statements about a convention's
      selection rule and hold whatever the true costs are.
    rigorous_support: >-
      The rigorous ingredient is the supporting-hyperplane theorem: for a finite point set, the
      minimiser of any linear functional with non-negative coefficients lies on the lower-left
      convex hull. That is exact and unconditional. The classical distribution statement H1
      imitates is the standard asymptotic-dominance convention under which exponents are compared
      at all - the same convention that lets the literature say 2^{0.292n} beats 2^{0.3588n} - and
      H1 is nothing more than the assertion that this program may use that convention at the
      dimensions it cares about. Naming it makes visible that the whole lane already assumes it
      silently every time it converts an exponent to a bit count.
    validation_plan: >-
      SAMPLE: not sampleable in the usual sense - there is no experiment that measures an o(d)
      term. What IS validatable, and is the honest substitute, is the leading-exponent convention
      against real runs at small d: take the two algorithm families this program can actually
      execute (a 2-sieve kernel and pruned enumeration, both present in the GOAL-MLKEM-004
      instrument per KN-TECH-14efa5), measure their wall-time and peak memory at d = 50..85, fit
      empirical (m, t) pairs, and check whether the EMPIRICAL points fall on the same side of the
      empirical hull as the asymptotic points do. That same fit is the instrument that decides the
      C1/C2 reading empirically. COMPARISON: empirical hull membership versus asymptotic hull
      membership, per family. TAIL CHECK: the crossing dimension at which enumeration and sieving
      swap hull positions, empirically located versus the value the asymptotic constants predict;
      KN-LIT-105's corpus entry records the crossover reported at dimension 70 (KN-LIT-106), which
      gives one external anchor to check against, and KN-OPEN-017 records that this crossover is
      the corpus's own open question under a memory charge.
      TRANSFER ASSUMPTION, STATED: this validates the convention at d = 50-85 and says nothing
      about d = 385-826, and the entire tuple-sieve part of S cannot be validated at all because
      no 3-sieve implementation is in this program's instrument. That is a real gap and it is why
      H1 is labelled as almost certainly false at the margins in question. This validation leg is
      OPTIONAL and is not part of the one-hour minimal test; it is named so that a coordinator can
      route it to the sibling record IDEA-20260807-8fbc86, which already owns that measurement.
  target_complexity:
    time_exponent: >-
      NO NEW ATTACK EXPONENT IS CLAIMED AND NONE IS PROPOSED. What this record produces is a
      statement about which published exponent pairs a cost convention can select. The exponents
      themselves are other people's: classical 2-sieve 0.292 at memory 0.2075 [recalled, C1] or
      0.292 [corpus, C2]; classical 3-sieve 0.3588 at memory 0.1887 and 0.3300 at 0.2075
      [retrieved]; quantum 2-sieve 0.265 at memory 0.2075 [recalled, Q1] or 0.2653 at 0.2653
      [corpus KN-LIT-703, Q2]; quantum k-Sieve 0.2989 at memory 0.1395 in the QRAM model [corpus
      KN-LIT-703]; quantum random walk 0.2570 at unread memory [corpus KN-LIT-4639, EXCLUDED];
      quantum 3-sieve 0.2846 at memory 0.1887 [retrieved, ePrint 2025/2189, improving 0.3098]. The
      record's own compute cost is a convex hull of a few dozen points: O(n log n), seconds.
    memory_exponent: >-
      The record's own memory is a table of a few dozen rows. THE POINT OF THE RECORD IS THE
      MEMORY EXPONENT AXIS ITSELF: the claim is that the lane's instrument reads that axis through
      a scalar price, which is provably blind to any point above the hull, and that a hard budget
      is the parameterisation matching both the physical situation and the way ePrint 2025/2189
      states its own result ("when total memory is limited to 2^{0.1887d}"). The corpus's own
      leftmost memory point is now KN-LIT-703's 0.1395, which is 0.0492 further left than anything
      this lane has considered.
    best_known: >-
      There is no incumbent COMPUTATION in this repository: no record computes a hull of algorithm
      cost pairs or distinguishes price from budget selection. The incumbent PRACTICE is the priced
      charge T*M^c, committed in EV-MLKEM-020 with c* = 0.03164649 / 0.04588645 / 0.00705473, and
      IDEA-20260816-70e41d's proposed price-parameterised crossover curve, and IDEA-20260805-cdc87d's
      T*M^alpha ladder. The incumbent CORPUS STATEMENT of the neighbouring question is KN-OPEN-017,
      which asks where the enumeration/sieving crossover moves under full cost and records that no
      source in the corpus computes it; KN-TECH-044 is its technique entry. Externally, the
      price/budget distinction is elementary convex analysis and no novelty is claimed for it.
    hidden_overhead: >-
      Stated bluntly, because this is the record's weakest flank: the entire analysis lives in
      leading exponents and the margins that decide its conclusions (0.0040 classical under C1,
      0.001159 quantum under Q2) are far smaller than any honest bound on the o(d) terms, which are
      formally unbounded and which the committed record EV-MLKEM-020 already flags as unbounded. In
      addition the quantum points hide a QRAM/QCRAM assumption whose realisable advantage KN-LIT-122
      finds "small" at the circuit level and whose physical cost arXiv 2410.13759 estimates at
