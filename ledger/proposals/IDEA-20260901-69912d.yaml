idea:
  id: IDEA-20260901-69912d
  question_id: RQ-AES-003
  goal_id: GOAL-AES-003
  added: '2026-09-01'
  proposed_by: idea-generator
  status: proposed
  class: mechanism

  title: >-
    WHICH LAYER CARRIES THE SKELETON - surgical geometry mutations (identity ShiftRows, identity
    MixColumns, swapped layer order, non-AES MDS matrix, non-MDS invertible matrix, changed
    ShiftRow offsets, independent round keys), each GATED on the exact affine rank prediction of
    IDEA-20260901-ec54fe before any nonlinear arm runs. The affine gate converts the branch-number
    ladder of IDEA-20260808-83b3ba from an ordering test into an exact-prediction test, adds the
    three knobs 83b3ba lacks (layer order, SR offsets, key schedule), and pre-registers a
    mutation x S-box table whose agreement pattern alone identifies which component of the round
    geometry the r=5 excess lives in. This record SUPERSEDES 83b3ba as filed, absorbing its two
    knobs and its controls.

  object: >-
    TRACKED OBJECT - THE COMPONENT DEPENDENCE PROFILE of the affine yoyo skeleton and of the
    nonlinear residual. A mutation m is one surgical change to the round geometry holding all
    content fixed: M1 SR -> identity; M2 MC -> identity; M3 layer order swapped (MC applied
    before SR inside each round, convention otherwise unchanged); M4 MC -> a non-AES MDS matrix
    over GF(2^8) with branch number 5, two independent draws; M5 MC -> an invertible non-MDS
    4x4 GF(2^8) matrix with measured branch number 3-4; M6 SR -> a different row-offset set
    (pre-registered: offsets (0,1,3,2) instead of (0,1,2,3)), measured under BOTH the aligned
    probe (PW/CW tables re-derived from the mutated SR and emitted/verified at run time per the
    BATCH-002 section 2 discipline) and the original probe (mismatched-probe control); M7 round
    keys drawn independently and uniformly per round instead of from the AES-128 key schedule
    (AES S-box arm and one random-bijective-S-box arm). The retained quantity per (m, S-box) is
    one frozen-comparator reading (hit count, excess factor, Garwood CI, full W histogram) at
    r=5 - a profile over mutations, not a scalar.
    ESTABLISHED FAMILIES DECLARED OFF-LIMITS AS THE PRIMARY LENS per docs/inventor-protocol.md
    section 1: re-running any whole-cipher substitution (already excluded five ways), and the
    branch-number ladder AS AN EXPLORATORY ORDERING TEST (83b3ba's design) - it is retained here
    only as the M2/M4/M5/AES row of a prediction-gated table.

  lossy_projection_test: >-
    The projection (mutated cipher, key, seed) -> (affine rank quadruple of the mutated skeleton,
    frozen-comparator hit count) discards the S-box values in the affine gate and the trial
    stream in both gates. Fibres are enormous (all keys/seeds of an affine mutation share one
    rank quadruple; the nonlinear reading is a count over 2^30+ trials). Genuinely lossy.
    COMPATIBILITY: under the yoyo trial on differences the affine part propagates exactly (P1 of
    IDEA-20260901-ec54fe, adopted by reference); the nonlinear reading propagates only
    statistically, and the record never transfers a statement between the two gates.
    THE SHARP EDGE: a mutation whose affine gate predicts SKELETON-NULL but whose nonlinear arm
    reads SIGNAL is the object this record is built to find - it would mean the residual excess
    does not require the skeleton, which no committed record currently contemplates. That
    outcome is a finding, not a failure, and is pre-registered as reading R2 below.

  claim: >-
    Three statements. G is the gate, T is the table, R is the reading rule.

    (G) THE AFFINE GATE. For every mutation m in {M0..M7-affine}, the mutated cipher with
    SBOX = id is affine, so IDEA-20260901-ec54fe's census machinery computes its exact per-trial
    law in cell (r=5, A={0}, S={0}) at zero cipher cost. Each mutation receives a pre-committed
    gate label: SKELETON-ALIVE (predicted P(W>=1) > 2^-30, with the exact value and predicted W)
    or SKELETON-NULL (predicted P = 2^-30). The gate table is committed with its digest before
    any measurement arm of this record runs.

    (T) THE MEASUREMENT TABLE. Pre-registered arms at r=5, frozen comparator, matched exposure
    (2^32 where affordable, else 2^30 with the campaign's matched-exposure rule):
      identity-S-box block (exact-prediction tests): M0 (baseline seat), M1, M2, M4-draw-1,
      M6-aligned - each compared against its gate prediction with ZERO tolerance (the affine
      law is exact; any deviation is a defect, not a datum).
      random-bijection-S-box block (residual-tracking tests): M0, M1, M2, M4-draw-1, M5,
      M6-aligned, M6-mismatched, M7 (plus the AES-S-box M7 arm) - each binned SIGNAL (count
      above the null band: >12 at 2^32, i.e. excess factor > 3.0x per BATCH-002 N1) or NULL
      (inside the band), with full counts, Garwood CIs and W histograms reported regardless.
      branch-number covariate: for M4 (both draws) and M5, the branch number of the instantiated
      matrix VERIFIED by exhaustive minor/determinant computation, never assumed from the
      construction (83b3ba's control, inherited).

    (R) THE READING RULE, PRE-REGISTERED AND TOTAL.
      (R1) AGREEMENT - every mutation's SIGNAL/NULL reading matches its gate label. Then the
      component dependence of the skeleton is IDENTIFIED (which layers the skeleton needs) and
      the nonlinear residual TRACKS the skeleton across every mutation tested; the localization
      answer is the set of layers whose removal the gate shows the skeleton needs.
      (R2) EXCESS WITHOUT SKELETON - some mutation with gate label SKELETON-NULL reads SIGNAL
      under a nonlinear S-box. Then the residual does not require the skeleton at all; the
      mechanism question splits into two independent phenomena and this is the most
      consequential redirect the batch can produce. It is a finding, escalated to independent
      review before any description, not averaged with R1.
      (R3) SKELETON WITHOUT RESIDUAL - some mutation with gate label SKELETON-ALIVE reads NULL
      under a nonlinear S-box (while its identity-S-box arm reproduces its exact prediction).
      Then the skeleton is not SUFFICIENT for the residual; the named mutation identifies the
      component through which nonlinearity must interact with geometry - a positive
      localization result one step weaker than R1.
      (R4) DEFECT - any identity-S-box arm deviates from its exact gate prediction. Void;
      invalid_measurement; repair before any reading.
      Sub-readings retained from 83b3ba and now gated: (S1) if M4 reproduces (SIGNAL) and M5
      does not, the tracked invariant is MDS-class (branch number or finer); if M4 does not
      reproduce, the invariant is specific to AES's MixColumns or to the SR-MC pair, and 83b3ba's
      monotone-branch-number premise is falsified as stated; (S2) if M1 reads NULL, ShiftRows'
      diagonal-to-column action is load-bearing for the residual, as 83b3ba predicted, but now
      with the gate saying in advance whether the skeleton agrees.

    (WHAT IS NOT CLAIMED) No statement about full-round or deployed AES; no comparison to
    published cryptanalysis in either direction (R3); no claim that the mutation panel exhausts
    the geometry space (it is a frozen panel, and a mutation outside it is post-hoc); no claim
    that agreement R1 constitutes a MECHANISM PROOF - it is a component identification at toy
    tier over eight mutations, and the record says so.

  mechanism: >-
    Five exclusions and one maximal reproduction have cornered the excess: it needs AES's round
    geometry, it does not need the S-box values, it does not need nonlinearity, and it dies
    under every non-SPN substitute. The only ingredient no committed arm has varied is the
    INTERNAL COMPOSITION of the geometry - which of ShiftRows, MixColumns, their order, their
    specific matrices, and the key schedule carries the effect. The affine gate makes this
    variation exact before it makes it empirical: because the skeleton's response to any
    mutation is a rank computation, each nonlinear arm tests a PREDICTED row rather than
    exploring an ordering, which is the difference between a localization experiment and a
    screen. The candidate mechanism this record pursues is that the skeleton lives in the
    ShiftRows-diagonal-to-column action composed with MixColumns' byte mixing (the wide-trail
    pair), that the residual follows the skeleton, and that the specific AES matrices are
    replaceable by any MDS layer - but every one of those clauses is a row of table T, not a
    premise.

  why_not_a_renamed_known_approach: >-
    Nearest known method - the wide-trail strategy's branch-number reasoning (recalled,
    unverified; named as the source of the M4/M5 knob and never as authority) and the general
    "replace one AES layer and observe" construction used in cipher-design evaluation
    (recalled). Neither is used here as a derivation or a distinguisher: branch number is an
    EMPIRICAL COVARIATE in a     prediction-gated table, and layer replacement is the intervention,
    not the claim. Nearest internal record - IDEA-20260808-83b3ba, whose knobs M1 (ShiftRows
    off), M4/M5 (branch-number ladder) this record absorbs; the differences are (i) the affine
    gate (83b3ba has no exact predictions - it pre-registers an ORDERING, this record
    pre-registers a PREDICTED TABLE), (ii) the three added knobs M3/M6/M7, (iii) the affine
    maximal reproduction (EV-AES-048545 O-7) which postdates 83b3ba's design and makes the gate
    possible, and (iv) the R2 reading (excess without skeleton), which 83b3ba's framing cannot
    express because it assumes the excess and the geometry vary together. LOSSY-PROJECTION TEST
    - see the field above; PASSES with the affine/nonlinear transfer boundary stated.

  novelty_status: unverified
