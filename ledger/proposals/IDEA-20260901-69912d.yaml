  assumptions:
    - >-
      [fact, committed] The pinned cipher convention, probe geometry, frozen comparator and
      null-band conventions of BATCH-002 and the exclusion records; the affine anchor reading
      (EV-AES-048545 O-7).
    - >-
      [dependency] The census machinery of IDEA-20260901-ec54fe computes the mutated skeletons;
      if ec54fe's Stage 0 fails, this record's gate falls back to computing the eight affine
      rank quadruples directly (the same sparse GF(2) matrix products) and says so - the gate
      is the deliverable, whichever record's code produces it.
    - >-
      [implementation, to be confirmed by code read] The campaign's probe can take a mutated
      layer without changing its counting logic (83b3ba's assumption, inherited, not assumed).
    - >-
      [scope] Toy tier; r=5; the frozen panel; exposures already demonstrated affordable under
      the shared-machine envelope (4 cores per RQ-AES-003 constraints at the time of the cited
      batches; the current machine's core count is a dispatch-time fact, not an assumption of
      this record).

  predictions:
    - id: PR-1
      metric: >-
        Gate table - exact affine per-trial law for M0..M7 in cell (r=5, A={0}, S={0}),
        committed with digest before any arm runs
      direction: different
      minimum_effect: >-
        A complete labelled table (SKELETON-ALIVE with exact probability and predicted W, or
        SKELETON-NULL) for all eight mutations, plus the verified branch numbers of the M4/M5
        draws. The table is a deliverable even if no measurement runs.
    - id: PR-2
      metric: >-
        Identity-S-box block readings (M0, M1, M2, M4-draw-1, M6-aligned) against gate
        predictions
      direction: different
      minimum_effect: >-
        EXACT agreement on every arm (the affine law has no error term). One deviation is R4,
        void, never a near-miss.
    - id: PR-3
      metric: >-
        Random-bijection block SIGNAL/NULL pattern across M0, M1, M2, M4-draw-1, M5,
        M6-aligned, M6-mismatched, M7
      direction: different
      minimum_effect: >-
        One of R1/R2/R3 with the responsible mutations named. Recorded prior, disclosed as a
        prior: P(R1) ~ 0.55, P(R3) ~ 0.25, P(R2) ~ 0.10, P(R4) ~ 0.10.
    - id: PR-4
      metric: >-
        Branch-number sub-reading - M4 (two MDS draws, branch 5 verified) vs M5 (non-MDS,
        branch 3-4 measured) vs M2 (identity, branch 2)
      direction: different
      minimum_effect: >-
        S1 resolves: M4 SIGNAL and M5 NULL (MDS-class invariant), or M4 NULL (AES-specific or
        SR-MC-pair invariant), or a pattern neither (which falsifies the monotone premise and
        names the weight-enumerator fallback exactly as 83b3ba pre-committed).
    - id: PR-5
      metric: >-
        Key-schedule arm M7 - independent uniform round keys vs AES schedule, under AES S-box
        and under one random bijection
      direction: different
      minimum_effect: >-
        AFFINE PREDICTION (exact, pre-registered): the skeleton is key-independent, so M7's
        identity-S-box gate label equals M0's (this is a theorem-level consequence of P1 in
        ec54fe and is checked by the gate table, not by measurement). NONLINEAR READING (open):
        whether the residual's MAGNITUDE is key-schedule-sensitive - the seed-to-seed variance
        14 vs 19 (EV-AES-5478a0 OBS-B16-3) is unexplained and M7 is the first arm that can
        attribute it to schedule structure vs Poisson noise.
    - id: PR-6
      metric: >-
        M6 mismatched-probe control - original PW/CW tables under mutated SR offsets
      direction: same_as_null
      minimum_effect: >-
        NULL, pre-registered: the excess is expected to follow the SR-aligned geometry, so the
        misaligned probe is expected to read null on a cipher whose skeleton (gate-predicted)
        may be alive. A SIGNAL here is falsification F3 and hands the probe-alignment premise to
        IDEA-20260901-02f7c4.

  minimal_test: >-
    STAGE 0 (zero cipher compute): extend the census machinery of IDEA-20260901-ec54fe to the
    eight mutated skeletons; commit the gate table with digest; verify M4/M5 branch numbers
    exhaustively. STAGE 1 (one producer slot): the identity-S-box block (five exact arms at
    2^30 - the affine arms cost minutes each). STAGE 2 (two producer slots): the
    random-bijection block at 2^32 (measured ~255 s per arm at D-5's rate; eight arms fit the
    campaign's demonstrated envelope). The CHEAPEST DISCRIMINATING SUBSET, if budget binds, is
    Stage 0 plus M2-identity-S-box: if the gate predicts SKELETON-DEAD for identity MixColumns
    (this record's prior: ~0.8), the single exact arm confirms that MixColumns is load-bearing
    for the skeleton and the whole "which layer" question is half-answered at under ten minutes
    of compute.
  preregistered_decision_rule: >-
    Committed before Stage 1: apply R to the completed table exactly as written - R1 records the
    component identification and names the load-bearing layers; R2 escalates (excess without
    skeleton; independent review before description); R3 records the sufficiency failure and
    names the interaction component; R4 voids and dispatches repair. Sub-reading S1/S2 recorded
    beside R whatever the outcome. No post-hoc mutation, no post-hoc binning, no mutation
    outside the frozen panel read as if it were in it. A budget halt is resource_exhaustion.

  test_boundary: >-
    Toy tier; r=5 only (round-count dependence of the component profile is a successor question,
    not this one); the frozen eight-mutation panel; one probe cell (A={0}, S={0}, plus M6's
    geometry variants); mutated ciphers measured are the modified ciphers actually run, never
    AES beyond the M0 seat (interpretation_limits of 83b3ba, inherited verbatim). NOTHING about
    full-round or deployed AES; no published-frontier comparison in either direction.

  falsification_conditions:
    - >-
      F1 (BLOCKING DEFECT). Any identity-S-box arm deviates from its exact gate prediction.
      R4 fires; void; invalid_measurement; never negative evidence (rule 5).
    - >-
      F2 (THE MAIN MECHANISM FALSIFIER). The branch-number sub-reading is FLAT - M2, M5, M4 and
      the AES-MC seat all read alike under the random bijection. Diffusion-strength readings of
      the excess, including 83b3ba's monotone premise and any wide-trail account, are falsified;
      the record names the weight-enumerator fallback as the successor object exactly as 83b3ba
      pre-committed, and says plainly that this record's own M4/M5 rows contributed the
      falsification.
    - >-
      F3 (PROBE-ALIGNMENT FALSIFIER). M6-aligned reads NULL while M6-mismatched reads SIGNAL
      (or the aligned arm reads NULL with gate label SKELETON-ALIVE and the mismatched arm
      SIGNAL). The excess does not follow the SR-aligned geometry; the BATCH-002 section 2
      alignment premise is indicted; handoff to IDEA-20260901-02f7c4 and independent review.
    - >-
      F4 (KNOB DISAGREEMENT). M1 (identity SR) reads SIGNAL under the random bijection while
      its gate label is SKELETON-NULL, AND M2 behaves per its gate - the two structural knobs
      disagree about what carries the effect. Reported as an unresolved contradiction, never
      averaged (83b3ba's rule, inherited).
    - >-
      NOT A FALSIFICATION - R2 (excess without skeleton) and R3 (skeleton without residual) are
      readings, not failures; budget halts are resource_exhaustion (rule 5); a matrix draw whose
      branch number differs from its target is re-drawn or relabelled, never silently used.

  controls:
    - >-
      NULL OBJECT - the standing ideal-permutation null seat at the block's exposure, plus the
      M0 baseline seat in both S-box blocks (the comparator seat is re-measured in-block, never
      reused across batches, per the frozen-comparator discipline of EV-AES-e4c091/5478a0).
    - >-
      KNOWN-FALSE CONTROLS (proves-too-much) - every mutation whose gate label is
      SKELETON-NULL is an object KNOWN by derivation to lack the skeleton; its identity-S-box
      arm must read exactly null and its nonlinear arm must read null under R1. An excess on a
      known-skeleton-free mutated cipher under the identity S-box is the artifact indictment.
    - >-
      POSITIVE CONTROL - the M0 seat in both blocks must reproduce the committed readings
      (AES ~59/2^32 within the Poisson band; random bijection ~51-59/2^32; identity S-box
      probability 1 per trial) or the block is void.
    - >-
      SIBLING-NULL DISCIPLINE (V-804-1, KN-FIND-029 rule 6) - the panel is designed so that
      each named property has a mutation that removes IT while holding the others: branch
      number (M4 vs M5), SR action (M1), MC action (M2), order (M3), offsets (M6), schedule
      (M7). A knob that discriminates without isolating is flagged in the report, not believed.
    - >-
      BRANCH-NUMBER VERIFICATION - exhaustive minor computation for every instantiated matrix,
      per draw, recorded in the artifacts (83b3ba's control, inherited).
    - >-
      PRE-REGISTRATION AS COMMITTED DIGEST - gate table committed before Stage 1 (V-804-2).

  confounders:
    - >-
      MUTATED INVERTIBILITY - M4/M5/M6 ciphers must remain invertible for the decrypt leg of the
      probe; invertibility is verified per construction before any arm, and a non-invertible
      draw is excluded and counted, never silently dropped.
    - >-
      KEY-SCHEDULE INTERACTION - changing MC changes what the schedule feeds; all arms except M7
      keep the AES-128 schedule fixed (83b3ba's confounder, inherited), and M7 varies the
      schedule BY DESIGN, so the two effects are separated rather than blended.
    - >-
      RANDOM-DRAW BRANCH NUMBER IS A RANDOM VARIABLE - measured per draw, never assumed
      (inherited); a draw landing on an unintended branch number is relabelled to its measured
      value.
    - >-
      SHARED-HARNESS BUGS CONDITIONAL ON THE ROUND FUNCTION (BATCH-010 red team's residual risk
      class) - at least one arm of the identity-S-box block should run on an instrument lineage
      independent of the campaign's standard probe (mitigation named; the cross-lineage battery
      IDEA-20260901-02f7c4 B3 owns the substitute-side version of this).
    - >-
      KN-FIND-029 PRACTICE RULE 4 - a structured key/plaintext can whiten to a constant state on
      which a mixing layer is the identity; every arm uses the campaign's splitmix64 random
      trial stream, never structured inputs.

  interpretation_limits:
    - >-
      claim_tier toy. Identifying which component carries a statistic is NOT producing a
      distinguisher; a confirmed component identification most likely REMOVES a claimed
      distinguisher (83b3ba's limit, inherited verbatim).
    - >-
      Results are about the modified ciphers actually run, never about AES beyond the M0 seat;
      no full-round or deployed-AES statement; no published-frontier comparison in either
      direction.
    - >-
      Agreement R1 over eight mutations is a component IDENTIFICATION at toy tier, not a proof
      that no further geometric ingredient exists; the panel is frozen, not exhaustive.
    - >-
      Timeouts, crashes and infrastructure failures are never negative mathematical evidence
      (rule 5).

  heuristic_assumptions:
    - id: H1
      statement: >-
        SKELETON-TRACKING. For every mutation m whose affine gate predicts SKELETON-ALIVE with
        per-trial probability p_m, the nonlinear random-bijection arm reads SIGNAL, and for
        every m predicted SKELETON-NULL it reads NULL - i.e. the residual's presence/absence
        follows the skeleton's across the panel.
      rigorous_support: >-
        RIGOROUS PART - the gate labels are exact affine computations (P1 of
        IDEA-20260901-ec54fe). What is heuristic is the tracking itself: no committed datum
        shows how a nonlinear bijection interacts with a mutated skeleton, and the campaign's
        only mutation-free data points are "identity S-box: probability 1" and "random/AES
        bijection: ~15x". DISTRIBUTION IMITATED - none; the assumption is tested arm-by-arm,
        never smoothed into a curve.
      validation_plan: >-
        The measurement table T IS the validation plan; the pre-registered reading R1/R2/R3 is
        its decision rule.
      falsification_condition: >-
        R2 or R3 (either tracking failure) or F4 (knob disagreement); each has a committed
        reading.
    - id: H2
      statement: >-
        MDS-GENERICITY OF THE SKELETON. The skeleton survives replacing AES's MixColumns by any
        branch-number-5 MDS matrix (M4 reproduces), and dies under non-MDS invertible mixing
        (M5 does not) - the tracked invariant is the MDS property, not the specific AES matrix.
      rigorous_support: >-
        RIGOROUS PART - branch number 5 is the minimum distance of the [I | L] code, a
        definition-level fact checkable exhaustively for each instantiated L (83b3ba's
        HA-1 rigorous ingredient, inherited). WHAT IS HEURISTIC is that the skeleton's survival
        depends on L only through that distance; the S1 sub-reading tests it and the
        weight-enumerator fallback is pre-named if it fails.
      validation_plan: >-
        M4 two independent draws plus M5, all with verified branch numbers, compared against
        the gate predictions and against each other (S1).
      falsification_condition: >-
        F2 (flat ladder) or M4 failing to reproduce while its gate says SKELETON-ALIVE (which
        would be an R3 instance naming MixColumns-specificity).

  obstruction:
    quantity: >-
      The component-dependence profile of the r=5 excess - currently ZERO measured mutations of
      the internal geometry; the only committed component-level datum is the whole-geometry
      statement "SPN geometry present vs absent" (five exclusions vs one reproduction).
    measured_value: >-
      No mutation has been measured, so the profile is empty; the scalar inputs are the AES seat
      (59/2^32, Garwood CI per BATCH-713991), the random-bijection seats (58/51 at 2^32), the
      affine seat (probability 1 per trial, exact), and the whole-cipher absences (0-2 hits at
      2^30 across the substitute classes, EV-AES-5478a0). Units: hits at frozen exposure;
      error bars: Poisson/Garwood as committed, exact where affine.
    runs_read_from: >-
      BATCH-002, BATCH-713991, BATCH-b41ba9, BATCH-009/014/015/7939d0 (via their evidence
      records and closing decisions).
    scope_claimed: >-
      Toy tier, one probe cell, r=5; the emptiness of the profile is the obstruction, claimed
      over the entire internal geometry of the round.
    resource_check:
      examined: true
      reading: >-
        The same emptiness that obstructs every mechanism account offered so far (no committed
        arm has varied the inside of the geometry, so every account is underdetermined) is the
        asset of this record: each empty row is an exact-prediction arm costing minutes, and
        the rows where the gate predicts NULL are simultaneously the known-false fixtures of
        IDEA-20260901-02f7c4. The obstruction re-reads as an unexploited cheap grid.

  target_complexity:
    time_exponent: >-
      No attack, no exponent. Stage 0 zero cipher compute; Stage 1 five affine arms at 2^30
      (minutes); Stage 2 eight arms at 2^32 (~255 s each at the D-5 rate) - two-to-three
      producer slots at the campaign's demonstrated envelope.
    memory_exponent: >-
      O(1) per query (table-driven S-box SPN, direct evaluation); M4/M5 matrices are 16 bytes
      each. No memory-bound workload.
    best_known: >-
      The campaign's committed seats are the baseline (AES 59, random bijections 58/51, affine
      probability 1, substitutes 0-2 at 2^30). No improvement claimed on any cost axis.
    hidden_overhead: >-
      Disclosed: eight mutations are eight points; a component identification over eight
      mutations generalizes to the panel, never beyond it. Branch-number verification is
      exhaustive per draw and costs seconds.
    tradeoff_note: >-
      No time-memory tradeoff in content. The evidential tradeoff: Stage 1 is exact and cheap,
      Stage 2 is statistical and 30x costlier; the decision rule is written so Stage 1 alone
      already answers the skeleton half of the question.

