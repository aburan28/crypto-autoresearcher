idea:
  id: IDEA-20260809-972c9e
  question_id: RQ-SSI-001
  added: '2026-08-09'
  title: Two 2026 reformulations of the supersingular isogeny problem sit uncited -- one a polynomial
    system the program's own solving-degree instrument was built for, the other a proved polynomial
    equivalence to a computable quadratic-form invariant, alongside the unconditional replacement
    for the GRH-conditional reduction network the whole isogeny campaign rests on
  class: representation
  claim: 'Two uncited route classes and one conditionality-hygiene debt, all on the program''s
    most-developed lane. (a) ALGEBRAIC MODELLING. KN-LIT-1540 (''Algebraic Modelings of the Supersingular
    Isogeny Problem'', arXiv 2607.05160, 2026) presents the problem as a multivariate polynomial
    system for 2-power and 3-power degree isogenies via Renes formulas, proves the systems zero-dimensional,
    computes the dimension of the highest-degree part, shows they are NOT in generic coordinates,
    and reports experimentally that Groebner solving beats the modular-polynomial modeling. This
    program owns a mature instrument for exactly those quantities -- RQ-SDEG-001 is a certificate-backed
    solving-degree scaling law, RQ-MODEL-e61cb2 asks whether the choice of curve model changes
    summation-polynomial or solving degree, and the entire ECDLP campaign is built on first-fall/solving-degree
    measurement -- and no record asks whether it transfers. (b) THE HUMBERT EQUIVALENCE. KN-LIT-1485
    (Kirimli-Martindale, eprint 2025/1295) PROVES that, under GRH and in the SQIsign and CSIDH
    contexts, the computational isogeny problem is polynomially equivalent to the computational
    refined Humbert invariant problem, and includes an algorithm for a maximal-order basis from
    its norm form; KN-LIT-1462 computes that invariant for principally polarized superspecial
    abelian surfaces and applies it to fixed-isogeny-degree WITHOUT endomorphism rings; KN-LIT-1396
    characterises the underlying Gross lattice. No record asks whether an algorithm for the invariant
    is a route to the isogeny problem -- which the equivalence says it is -- nor prices computing
    it against the p^{1/3+o(1)} baseline RQ-SSIQ-9702af exists to move. (c) CONDITIONALITY. KN-LIT-1499
    proves Isogeny, EndRing and MaxOrder equivalent UNCONDITIONALLY, removing GRH from previously
    known reductions and extending the network to HomModule; the campaign''s heuristic ledgers
    are stated against the GRH-conditional versions and nothing has updated the accounting that
    docs/target-result-profile.md makes central. Verified: all six entries are cited by nothing
    outside generated index files, and ''refined Humbert'', ''HomModule'' and ''MaxOrder'' return
    ZERO across 459 proposals and the whole repository respectively.'
  mechanism: 'PRICE BOTH ROUTES BEFORE BUILDING EITHER; a closed route with a named obstruction
    is a fine deliverable here. HUMBERT, zero compute: read KN-LIT-1485 and extract the POLYNOMIAL
    in the equivalence -- the equivalence only helps this program if computing the refined Humbert
    invariant is cheaper than the p^{1/3+o(1)} baseline it must beat, and the reduction''s own
    overhead may already close the route. ALGEBRAIC MODELLING: reproduce the KN-LIT-1540 systems
    at the smallest primes where a Groebner run terminates and measure exactly what the ECDLP
    lane measures -- solving degree, first-fall degree, and the gap -- against a matched null
    (a random zero-dimensional system of the same degree profile and variable count). Two pre-compute
    falsification checks first, per the proof-architecture portfolio: does the exponent-carrying
    quantity RQ-SSIQ tracks even APPEAR in this modelling, and is the ''not in generic coordinates''
    property the SAME one that makes the ECDLP first-fall bound non-predictive? A negative --
    ''the solving degree grows the same way and the modelling buys nothing at scale'' -- is a
    cheap, publishable method-ceiling statement for a route the campaign has never priced. Independently
    and at no compute, transcribe KN-LIT-1499''s reduction network and mark which statements in
    the SSI/SSIQ/WESO heuristic ledgers can drop their GRH conditioning.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - RQ-SDEG-001's object is the Semaev summation system over prime fields and its scope is decomposition
      cost for index calculus -- it shares the METHOD with KN-LIT-1540 and none of the OBJECT.
      RQ-SSIQ-9702af scopes the isogeny campaign to 'which exponent-carrying factor of the p^{1/3+o(1)}
      algorithm can move', with method vocabulary from the OneEnd/Wesolowski lineage; a polynomial-system
      route is not among its methods and no lever in its thirteen checkpoints names one. RQ-SSI-001's
      committed work is graph/quaternion-lattice, not algebraic modelling. On the Humbert side,
      IDEA-20260806-a3ef00 with H-GEN-7a1474 is the Gross-lattice genus/spinor-genus DECOMPOSITION
      of a SINGLE curve's maximal order -- a ternary quadratic form -- and its claim is information-theoretic
      (I(EndRing) = 0 + log2(#spinor genera) + log2(h), asserting a DEFI-style collapse cannot
      occur); KN-LIT-1485's object is the refined Humbert invariant of a superspecial abelian
      SURFACE attached to a PAIR of curves and its claim is ALGORITHMIC. Different object, different
      modality, and neither a3ef00 nor H-GEN-7a1474 mentions Humbert invariants; the only ledger
      occurrence of 'Humbert' is IDEA-20260805-51996a, using Humbert SURFACES to detect (n,n)-splittings
      in a separate ECTD-trapdoor argument. I confirmed IDEA-20260805-f9e801 (the nearest WESO
      record) is the middle-memory-line reproduction, a different object again.
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: the p^{1/3+o(1)} algorithm
      and its lever map, which GOAL-SSIQ-001 owns. The object is an ALTERNATIVE FORMULATION of
      the same problem.'
    tracked_object: The polynomial system encoding the supersingular isogeny problem, tracked
      through the pair (solving degree, first-fall degree) exactly as the ECDLP lane tracks its
      own systems.
    one_step_propagation_rule: Raising the parameter raises both degrees; the gap between them
      is the quantity the ECDLP instrument was built to measure and composes the same way here.
    newness_score: The reformulations are published and uncited here. What is new in this program
      is that its solving-degree instrument was built for exactly this shape of object and has
      never been pointed at the isogeny side.
  lossy_projection_identifiability_audit:
    projection: the isogeny problem -> a zero-dimensional polynomial system.
    what_is_discarded: The geometry; only the algebraic system is retained.
    is_it_only_a_change_of_coordinates: 'NO -- the system is a genuine re-encoding and its solving
      degree is not recoverable from the isogeny formulation without solving it. Honest caveat:
      a re-encoding that is merely a change of coordinates would show a solving degree matching
      the null exactly, which is the expected outcome and is why the null is mandatory.'
    mirror_failure_check: CHECKED. The measurement must be able to match the null. A random zero-dimensional
      system of the same degree profile and variable count is the comparator, and matching it
      is the modal result.
  null_object_control:
    primary_null: A RANDOM ZERO-DIMENSIONAL SYSTEM of the same degree profile and variable count.
      If the isogeny system's solving degree matches it, the reformulation carries no exploitable
      structure and the route closes on a measurement.
    secondary_nulls:
    - 'TWO PRE-COMPUTE FALSIFICATION CHECKS FIRST, per the proof-architecture portfolio: does
      the exponent-carrying step survive the re-encoding at all, and is the refined Humbert invariant
      cheaper to compute than the p^{1/3+o(1)} baseline it must beat? The reduction''s own overhead
      may already close the Humbert route at zero compute.'
    - Reproduce the ECDLP lane's own solving-degree measurement on a known system first, so the
      instrument is known to transfer.
  assumptions: []
  predictions:
  - metric: solving degree and first-fall degree of the reformulated system versus a matched random
      null
    direction: different
    minimum_effect: A gap differing from the null's at two prime sizes.
  minimal_test:
    design: 'Zero-compute first: read KN-LIT-1485 and extract the POLYNOMIAL in the equivalence;
      if computing the refined Humbert invariant is not cheaper than the baseline, that route
      closes immediately. Then reproduce the KN-LIT-1540 systems at the smallest primes where
      a Groebner run terminates and measure solving degree, first-fall degree and the gap against
      the matched random null.'
    controls:
    - matched random zero-dimensional system
    - Humbert-overhead pre-compute check
    - ECDLP-lane instrument reproduction on a known system
    required_metrics:
    - solving and first-fall degree per prime
    - gap versus null
    - Humbert invariant computation cost against the baseline
  falsification_conditions:
  - 'The Humbert reduction''s own overhead exceeds the p^{1/3+o(1)} baseline: that route closes
    at zero compute, which is a fine deliverable and the record says so up front.'
  - 'The reformulated system''s solving degree matches the random null: the re-encoding carries
    no exploitable structure.'
  - 'No Groebner run terminates at any prime where the system is constructible: an instrumentation
    limit, recorded as such and not as evidence about the formulation.'
  confounders:
  - Degree profile matching between the real and null systems is the whole comparison and is easy
    to get wrong; state the matching explicitly.
  - Groebner behaviour at the smallest terminating primes may be unrepresentative.
  - A published equivalence is not necessarily an efficient reduction; the polynomial matters.
  interpretation_limits:
  - Toy scale. No cryptographic-scale claim about the isogeny problem.
  - A solving-degree measurement is not an attack and does not by itself move any exponent.
  heuristic_assumptions:
  - id: HEUR-ISALT-1
    statement: Solving-degree behaviour at the smallest terminating primes is directionally representative.
    rigorous_support: None; this is the standard weakness of the ECDLP lane's own measurements
      too.
    validation_plan: Measure at two or three primes and report the trend, not a point.
  target_complexity:
    time_exponent: No claim. Measures whether an alternative formulation has algebraic structure
      the p^{1/3+o(1)} route does not use.
    memory_exponent: Groebner memory reported per run.
    best_known: Wesolowski 2026 p^{1/3+o(1)} for the supersingular isogeny problem.
    hidden_overhead: The reduction's own polynomial, which may already close the route.
    tradeoff_note: A favourable solving degree on a reformulation is not an attack until the reduction's
      overhead is charged.
  dominated_by: 'Wesolowski 2026 p^{1/3+o(1)}, trivially, since no attack is proposed. Rows checked:
    Wesolowski p^{1/3+o(1)}; Delfs-Galbraith p^{1/2} at polynomial memory; vOW; MITM; Kohel.'
  sota_delta: ZERO on every attack axis; no attack is proposed. Supplies RQ-SSIQ with the one
    thing thirteen checkpoints at a single prime have not produced -- a route class OUTSIDE the
    incumbent algorithm family -- or closes it cheaply with a named obstruction, while putting
    the program's single most-developed instrument on a second target at near-zero marginal implementation
    cost. The KN-LIT-1499 half is pure conditionality hygiene on the program's most-cited exemplar
    line, and conditional-on-explicit-heuristics is the exact discipline docs/target-result-profile.md
    holds up as the target shape.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 0.8 that the Humbert overhead check is decidable from the paper at
    zero compute. 0.5 that it closes that route immediately. 0.6 that the algebraic-modelling
    systems are constructible and terminate at some prime. 0.8 that the solving degree matches
    the null if measured, which is the modal outcome. 0.05 that a structural gap survives.
