idea:
  id: IDEA-20261006-ffe333
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    One Frobenius-cyclic relation at n = 3 has uncollapsed rank 3 and
    collapsed rank 1
  class: measurement
  claim: >-
    Representation class R1, x-coordinates. The attack stage is linear
    algebra on one relation, and no discrete logarithm is solved. Let
    E be the lexicographically first ordinary curve
    y^2 = x^3 + a x^2 + b x + c over F_3 with a not 0. Let
    F_{27} = F_3[z]/(z^3 + 2 z + 1). Let G be a prime-order subgroup
    of E(F_{27}) of order at least 7 that is not contained in E(F_3).
    Let P, σ(P), σ^2(P) be one free orbit of the 3-power Frobenius,
    three distinct points of G. Let T = P + σ(P), and require T,
    σ(T), and σ^2(T) to be three distinct points. Write the relation
    T = P + σ(P) and its two Frobenius images as rows in the ordered
    basis (P, σ(P), σ^2(P)). The claim is that those rows are
    (1, 1, 0), (0, 1, 1), and (1, 0, 1), that this 3 by 3 matrix has
    rank 3 over the rationals, and that summing each row into one
    orbit-collapsed column produces the 3 by 1 matrix of all 2s,
    which has rank 1. A hit-rate ratio is not the claim. The time
    exponent stays the opened Gaudry exponent q^{2-2/n} at n = 3,
    which is q^{4/3}, and Pollard rho stays q^{n/2}.
  mechanism: >-
    OBJECT FRAME. Representation: R1, the x-coordinate in F_{27}.
    Operation set Sigma: addition of two orbit points, and the
    3-power Frobenius. Sigma is not the full translation action of G.
    TRICHOTOMY. Partial-action. One relation row is a standard basis
    combination of two orbit points. Frobenius permutes the columns.
    The three rows are the cyclic shifts of (1, 1, 0). Their sum is
    (2, 2, 2), and the three pairwise sums-minus-the-third are the
    nonzero vectors (0, 2, 0), (2, 0, 0), and (0, 0, 2), so the rank
    is 3. Collapsing the orbit identifies the three columns, and
    each row becomes the integer 2, so the collapsed rank is 1.
    LOSSY-PROJECTION TEST. The projection keeps the two ranks and
    discards the discrete logarithms. It is lossy because many
    targets can share one exponent pattern. This record does not
    claim an escape from the bounded-degree factor-base class.
  novelty_status: unverified
  citations:
    - ref: KR-IC-b0fcda
      provenance: internal
      claim: >-
        Frobenius-invariant factor bases reduce the number of systems
        by up to 1/n and speed linear algebra by n^2. The opened row
        does not state the rank of this 3 by 3 matrix.
      verified_by: coordinator, 2026-10-06, knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
    - ref: KR-IC-46d822
      provenance: internal
      claim: >-
        For fixed n, Gaudry decomposition is heuristic Õ(q^{2-2/n}).
        At n = 3 that exponent is 4/3. This rank does not replace it.
      verified_by: coordinator, 2026-10-06, knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic discrete logarithm needs Ω(√N) group operations.
        Three addition checks are not a discrete-logarithm algorithm.
      verified_by: coordinator, 2026-10-06, knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
  assumptions:
    - The lex-first ordinary curve with a nonzero x^2 coefficient exists over F_3. If a pre-registered sweep of the 27 coefficient triples with a = 0 skipped finds none, the cell is unmeasured.
    - z^3 + 2 z + 1 is irreducible over F_3. A factor makes the cell unmeasured.
    - A free orbit of size 3 exists in G, and T = P + σ(P) has three distinct Frobenius images. If not, the cell is unmeasured.
  proof_search_map:
    not_applicable_reason: >-
      One 3 by 3 rank. Not a theorem about Gaudry's exponent.
  predictions:
    - metric: uncollapsed_rank
      direction: different
      minimum_effect: the 3 by 3 exponent matrix has rank 3, and the collapsed column has rank 1
  minimal_test:
    design: >-
      Freeze the lex-first ordinary curve and one size-3 orbit.
      Add P + σ(P) and apply Frobenius twice. Write the three
      exponent rows. Compute the rank over the rationals and the
      rank of the column of row-sums. Re-add each image with a
      second group-law implementation.
    controls:
      - A second group-law check of each of the three sums. A failed check voids the cell.
      - The three orbit points are distinct, and the three targets are distinct.
      - The collapsed column is the vector of the three row-sums, not a new sample.
    required_metrics:
      - the 3 by 3 matrix
      - its rank
      - the collapsed rank
      - the number of second-addition failures, required to be 0
  falsification_conditions:
    - >-
      The three orbit points are distinct, the three targets are
      distinct, the second additions agree, and the 3 by 3 rank is
      not 3 or the collapsed rank is not 1.
    - A second addition disagrees. The cell is void.
  confounders:
    - If T lies in the orbit, the exponent row is not (1, 1, 0). That draw is unmeasured, not a rank of 3.
    - Rank over F_3 can drop because 2 = -1. The claim is the rank over the rationals.
    - Linear-algebra dimension of a full relation matrix is not this one-relation rank.
  interpretation_limits:
    - One relation, q = 3, n = 3. No statement at n = 5 and no hit-rate ratio.
    - The Gaudry exponent 4/3 and rho's 3/2 are untouched.
    - A rank of 3 does not close Frobenius-invariant factor bases.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Frobenius is a group homomorphism, so the image of
        T = P + σ(P) is σ(T) = σ(P) + σ^2(P), and the third image
        is σ^2(P) + P. The exponent pattern is then the cyclic
        shifts of (1, 1, 0). The model imitated is exact integer
        linear algebra on three vectors, not a smoothness law.
      rigorous_support: >-
        The q-power Frobenius of a curve defined over F_q is an
        endomorphism. KR-IC-b0fcda, opened, uses that endomorphism
        to collapse factor bases. It does not compute this rank.
        The rank identity is finite linear algebra once the rows
        are those shifts.
      validation_plan:
        sampling: all three images of the one relation, with no subsampling
        comparison: the two ranks against 3 and 1
        tail_check: >-
          If any image repeats, record the repetition and mark the
          cell unmeasured. Do not drop a repeated point and still
          report rank 3.
        parameters: q = 3, n = 3, one orbit, one relation. No transfer to n > 3.
  target_complexity:
    time_exponent: >-
      Unchanged. Opened KR-IC-46d822 gives 2 - 2/n = 4/3 in q at
      n = 3. Rho remains n/2 = 3/2. This rank moves neither.
    memory_exponent: >-
      Unchanged. Three rows of three integers. No matrix for a full
      factor base is stored.
    best_known: >-
      KR-IC-46d822, opened, heuristic Õ(q^{2-2/n}). KR-IC-b0fcda,
      opened, a factor up to n on the number of systems.
    hidden_overhead: >-
      No o(1) attack term. The pieces inside Gaudry's Õ are not
      measured.
    tradeoff_note: >-
      Not a time-memory tradeoff. The output is two ranks.
