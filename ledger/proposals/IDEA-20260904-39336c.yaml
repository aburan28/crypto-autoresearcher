    conclusion: >-
      unverified, and honestly so: the load-bearing external claims were read at
      abstract and snippet depth, not from the papers. The idea is an
      ADAPTATION -- published tools applied to an in-house polytope -- and its
      value does not depend on the tools being novel, only on their bounds
      differing from Jochemsz-May, which their own abstracts assert for other
      problems.

