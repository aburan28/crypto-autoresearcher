idea:
  id: IDEA-20260904-39336c
  question_id: RQ-PFDR-ae2fba
  added: '2026-09-04'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE CLOSURE'S SUPPLY NUMBER IS ONE STRATEGY'S VALUE, NOT AN OPTIMUM, AND
    THE GAP IS 0.1592 WHILE THE MISS IS 0.0481: run the 2024-2026 provably
    optimal / provably correct automated Coppersmith machinery -- Ryan's
    optimal shift-polynomial computation (EUROCRYPT 2025) and the sumset-theory
    asymptotic-bound algorithm of Feng, Luo, Chen, Nitaj and Pan -- on the true
    S_3 polytope AND on the JOINT three-equation system that the closure never
    solved jointly, because 30 percent of the available slack to the
    information ceiling decides the family.
  class: composition

  claim: >-
    The closure of IDEA-20260903-81a943 rests on one supply number,
    eps_available(S_3) = 0.8408, the Jochemsz-May EXTENDED-strategy reach of the
    13-monomial S_3 polytope, against a demand of 8/9 = 0.8889. Three facts make
    that number a target rather than a wall.
    (F1) SLACK. The information ceiling for this normalization is eps = 1, so
    the unexploited slack on the S_3 polytope is 1 - 0.8408 = 0.1592, and the
    required gain is 0.0481, i.e. 30.2 percent of the slack. Nothing
    information-theoretic forbids it.
    (F2) THE STRATEGY IS NOT THE OPTIMUM. Jochemsz-May prescribes ONE shift set.
    Keegan Ryan (EUROCRYPT 2025, eprint 2024/1577) gives algorithms that
    provably compute an OPTIMAL set of shift polynomials via Groebner bases and
    a lattice provably containing all desired short vectors, with a symbolic
    polytope-based precomputation of polynomial running time, and reports
    improved asymptotic bounds on three of over a dozen previously studied
    problems. Feng, Luo, Chen, Nitaj and Pan (eprint 2024/1330) give the first
    provable algorithm for the asymptotic bounds themselves via sumset theory,
    explicitly including bounds for the Jochemsz-May extended strategy and for
    variants extended to SYSTEMS of polynomial equations, with public code.
    (F3) THE CLOSURE NEVER SOLVED THE SYSTEM JOINTLY. Its supply side is the
    reach of the WORST BLOCK as a single equation, normalized by dividing the
    demand by the equation count. The actual object at (m, w) = (4, 2) is a
    system of three S_3 equations sharing the unknowns y_1, y_2 -- exactly the
    input shape the system-aware methods of (F2) are built for, and exactly the
    shape a per-block analysis cannot see gains in.
    CLAIM: eps_opt(S_3) and eps_opt(the joint three-equation system at
    (m, w) = (4, 2)) are computable today with published tools and no new
    mathematics, and the windowed family is alive iff either exceeds 8/9. The
    claim is falsified by computing both and finding them <= 0.8889, and it is
    confirmed by exhibiting a shift set whose bound exceeds 8/9 and whose
    planted-root recovery matches at toy scale.
    SECOND ARM (IDEA-20260808-e2315e, never executed, now with a number).
    Charging shift-lattice dimension as an exponent N^{delta} costs
    delta * omega' in the time exponent with omega' >= 2 the reduction exponent,
    so the demand becomes
    eps_required = (A + 1/2 + beta + delta*omega')/(A+1) and the dimension lever
    pays iff d(eps)/d(delta) > omega'/(A+1), which at (m, w) = (4, 2) is 2/3.
    The total gain needed is still 0.0481. Sweeping eps-hat(D) over two decades
    of dimension and fitting the slope decides it; the univariate control, where
    the asymptote 1/d is a theorem and the slope is exactly zero, validates the
    fit.

  mechanism: >-
    This is the exemplar's move from docs/target-result-profile.md A4: an
    external, very recent mathematical result converted into an attack on a
    named bottleneck. The bottleneck is a single scalar, eps_available. It was
    computed by the standard hand strategy from 2006. Between 2023 and 2026 the
    field replaced hand-crafted shift sets with automated and provably optimal
    ones (Meers-Nowakowski ASIACRYPT 2023; Ryan EUROCRYPT 2025; Feng et al.
    sumset theory; the 2026 linear-programming formulation), and those methods
    report asymptotic improvements on established problems. The margin to be
    overturned here is 0.0481 in a quantity whose value is 0.8408 and whose
    ceiling is 1 -- the smallest gap this program has measured between a
    published-method value and an attack threshold. The conversion mechanism is
    the same in both directions: reach converts to time exponent at rate
    E = w+1 = 3 (derived in IDEA-20260904-8dccc9), so 0.0481 of reach is exactly
    0.144 of time exponent, the distance from the family's present N^{0.644} to
    rho's N^{0.5}.

  novelty_status: unverified

  novelty_screen:
    kb_index: >-
      Empty (CRYPTO_KB_QDRANT_URL = ':memory:'); search_knowledge not called.
    corpus_grepped: >-
      Repository grep for 'Coppersmith', 'Jochemsz', 'smallroot_reach',
      'eps_available', '0.8408'. Only eight files contain the reach numbers,
      all from today's closure and its instrument. KN-TECH-015 records
      Coppersmith small-root lattice methods and the O~(D^6 bits^3) cost model;
      IDEA-20260808-e2315e proposes charging dimension as an exponent and was
      never executed. No record in this corpus cites Ryan 2024/1577, Feng et al.
      2024/1330, Meers-Nowakowski, or the 2026 linear-programming paper, and no
      record computes a reach by any method other than the hand Jochemsz-May
      strategy.
    external: >-
      WebSearch performed 2026-09-04 (two queries on improved multivariate
      Coppersmith bounds and on automated Coppersmith). eprint.iacr.org is
      BLOCKED by this container's proxy (301 to
      iacr.org/you_have_been_blocked.txt) so no PDF was opened. The IACR
      Artifact Archive page for EUROCRYPT 2025 artifact a13 WAS fetched and
