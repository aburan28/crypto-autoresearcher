        at artifacts.iacr.org/eurocrypt/2025/a13/
      provenance: retrieved
      claim: >-
        Algorithms using Groebner basis theory and lattice theory that provably
        compute an optimal set of shift polynomials and construct a lattice
        provably containing the desired short vectors; a heuristic
