  assumptions:
    - >-
      The published tools apply to systems of multivariate polynomials modulo a
      known prime p in bounded unknowns, which is exactly the shape of the
      windowed decomposition system.
    - >-
      Reach is compared in the closure's normalization,
      prod(bounds) <= p^{eps * #equations}, and any tool reporting a different
      normalization is converted explicitly before comparison.
    - >-
      omega' >= 2 for any practical lattice-reduction algorithm, pinned in the
      contract.
    - >-
      The closure's demand side is taken as given and is not re-derived here
      (IDEA-20260904-e9675e does that).

  proof_search_map:
    bottleneck: >-
      eps_available, the largest bound exponent at which a Coppersmith-family
      method certifiably returns the roots of the windowed decomposition system.
      Everything else in the family is at its floor.
    baseline_embedding:
      parameter_slice: >-
        Restricting any of the automated methods to the Jochemsz-May
        extended shift set must reproduce 0.8408 on the S_3 polytope and 0.4137
        on S_4. That is the exact old-method boundary, and reproducing it is
        the gate before any improved number is read.
      reproduction_check: >-
        Frozen fixture: the external tool's output on the S_3 support,
        restricted to the JM shift set, asserted equal to the committed
        0.8408 within 1e-3; and its univariate output asserted equal to 1/d for
        d in {1,2,3,4,5,8,16}, the same calibration the in-house instrument
        passes.
    observation_collision:
      observable: >-
        The asymptotic bound reported for a (support, bound vector) pair.
      distinct_preimage_search: >-
        The true S_3 system and a random polynomial system with the identical
        supports and bounds must receive the same bound from every tool, since
        all of them are polytope-driven. If they differ, a tool is using
        coefficient information and its output is not the quantity the closure
        compares against. Conversely, if the joint three-equation bound equals
        the per-block bound exactly, the closure's per-block shortcut is
        vindicated and (F3) is empty -- a clean and useful negative.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family from the Jochemsz-May shift set to the
          provably optimal shift set of Ryan 2024/1577, and from per-equation
          bounds to the system-aware bounds of Feng et al. 2024/1330.
        predicted_gain: >-
          Unknown in sign for THIS polytope; the deliverable is the number. The
          threshold is +0.0481, and the available slack to the information
          ceiling is 0.1592. This is a strict inward improvement if positive and
          a strengthened closure if not; it is not "feasibility".
      - transform: specialization_pack
        proposed_object: >-
          Charge lattice dimension as N^{delta} and build the demand curve
          eps_required = (A + 1/2 + beta + delta*omega')/(A+1), so dimension is
          a priced resource rather than an implementation choice.
        predicted_gain: >-
          A break-even slope d(eps)/d(delta) > omega'/(A+1) = 2/3 at (4, 2); the
          empirical slope is the deliverable.
    quantifier_order: >-
      EXISTS a shift set (equivalently a lattice construction) and EXISTS
      eps > 8/9 such that FOR ALL sufficiently large p and FOR ALL generic
      ordinary E/F_p, the method returns every windowed decomposition of every
      target whenever the bound volume is at most p^{3 eps}. The shift set may
      depend on m, w and the polytope; it may NOT depend on p or on the
      instance, and a construction whose dimension must grow with p is charged
      through delta rather than admitted for free. The negation this record can
      establish is: FOR the S_3 polytope and FOR the joint (4, 2) system, the
      provably optimal shift set gives eps <= 8/9.
    method_ceiling:
      strongest_certifiable_claim: >-
        A provably optimal asymptotic bound WITHIN the shift-lattice paradigm,
        still conditional on algebraic independence at root extraction. It can
        never certify that no method outside that paradigm does better, and the
        record must not present "provably optimal shift polynomials" as
        "provably optimal algorithm".
      nearby_object_control: >-
        The univariate congruence, where the ceiling 1/d is established and the
        optimal-shift machinery must not exceed it. A tool that reports better
        than 1/d univariately is misconfigured or its normalization has been
        mistranslated, and no multivariate number from that run may be used.
    proof_obligations:
      - claim: >-
          the external tool reproduces 0.8408 on the JM shift set and 1/d
          univariately
        responsibility: baseline
      - claim: >-
          normalization conversion between the tool's convention and the
          closure's is exact
        responsibility: interface
      - claim: >-
          the reported bound is attained by an actual reduction at toy scale
        responsibility: correctness
      - claim: >-
          lattice dimension and reduction cost are charged, including under the
          delta arm
        responsibility: runtime
      - claim: >-
          any bound above 8/9 is accompanied by a planted-root recovery at toy
          scale before it is called a lead
        responsibility: success_probability
      - claim: >-
          generic prime-field curves, toy tier, no crypto-scale claim
        responsibility: scope
    not_applicable_reason: null

  object_first:
    tracked_object: >-
      The SHIFT-SET CERTIFICATE: the finite set of polynomial multiples of the
      system whose integer combinations the reduction searches, together with
      the bound vector.
    lossy_projection_test: >-
      Lossy: the certificate retains only which monomials appear and with which
      modulus powers, discarding all coefficient values and hence the curve, the
      target, and the field arithmetic; distinct systems with the same support
      share a certificate. Compatible: the operations the method performs --
      Minkowski sums of supports, multiplication by shift monomials, powering,
      determinant accounting -- are all defined on the certificate alone, so it
      propagates deterministically. It is the same object family as the closure
      tracked; what changes is that the closure fixed ONE certificate by hand
      and this record optimizes over the family. Honest scoring: (1) not a new
      object, a new search over an old one; (2) concretely testable, since its
      one-step propagation is exactly the shift-set construction and its cost
      datum is the lattice determinant condition; (3) it survives as far as
      root extraction, where algebraic independence is assumed and where H1
      probes it -- the same dissolution point as every Coppersmith method.
    survival: >-
      Survives the whole lattice construction; dissolves at root extraction.

  predictions:
    - metric: >-
        External tool's bound on the S_3 support restricted to the Jochemsz-May
        shift set, against the committed 0.8408
      direction: different
      minimum_effect: >-
        Agreement within 1e-3. Disagreement is a normalization mismatch and must
        be resolved before any other number is read; this is the gate.
    - metric: >-
        eps_opt(S_3), optimal shift set, single equation
      direction: higher
      minimum_effect: >-
        Any value strictly above 0.8408 is a real supply gain and must be
        reported even if below 8/9, because it is the first evidence that the
        closure's supply number is not the paradigm's optimum. A value above
        0.8889 reopens the family at (m, w) = (4, 2).
    - metric: >-
        eps_opt(joint three-equation system at (m, w) = (4, 2)) minus
        eps_opt(worst single block)
      direction: higher
      minimum_effect: >-
        Strictly positive would show the closure's per-block shortcut is lossy;
        exactly zero within 1e-3 would show it is tight, which vindicates the
        closure's construction and is a clean strengthening. Both outcomes are
        pre-registered and neither is assumed.
    - metric: >-
        Empirical slope d(eps-hat)/d(log_p D) from a dimension sweep
        D in {20, 40, 80, 160, 320} at fixed toy p
      direction: higher
      minimum_effect: >-
        Break-even is omega'/(A+1) = 2/3 at (4, 2). A fitted slope below 2/3 at
        every measured D closes the dimension lever with a number, which
        IDEA-20260808-e2315e asked for and never got. A slope above 2/3 that
        persists over two decades reopens it.
    - metric: >-
        Univariate control, eps-hat(D) asymptote
      direction: different
      minimum_effect: >-
        1/d within 0.02 for d in {2, 3, 5}, with slope zero. A fit that misses
        this invalidates the fitting procedure and every multivariate slope read
        from it.

  minimal_test:
    design: >-
      STAGE 0 (hours, no research compute). Install the public artifacts --
      Ryan's EUROCRYPT 2025 artifact and github.com/fffmath/AsymptoticBounds --
      and reproduce their own published examples, then the two calibration
      gates: univariate 1/d, and the S_3 polytope restricted to the JM shift
      set giving 0.8408. Nothing beyond this stage is read until both gates
      pass. STAGE 1 (hours). Compute eps_opt for the S_3 support as a single
      equation; compute it for the JOINT three-equation system at
      (m, w) = (4, 2) with the shared unknowns y_1, y_2 declared; report both
      against 8/9. STAGE 2 (CPU-hours, only if Stage 1 clears or comes within
      0.02). Planted-root recovery on the actual system at p ~ 2^24 with the
      constructed windowed decomposition, the scrambled-window null, and the
      random-polytope null; classify bound failures separately from
      root-extraction failures. STAGE 3 (CPU-hours, independent of Stage 1).
      The dimension sweep and slope fit, with the univariate control, since
      that curve is needed by this lane regardless of the Stage 1 outcome and
      should be produced once.
    controls:
      - >-
        Theorem calibration: 1/d univariately, on every tool used.
      - >-
        Old-method reproduction: JM-restricted shift set must return 0.8408 on
        S_3 and 0.4137 on S_4.
      - >-
        Random-polytope null: identical support, random coefficients, same
        bound; the reach must match, since reach is polytope-determined.
      - >-
        Scrambled-window null: a uniformly random size-B subset must not be
        recoverable at any dimension.
      - >-
        Failure-mode separation: bound failure versus algebraic-independence
        failure logged separately.
      - >-
        Charged-cost control: lattice dimension, reduction wall-clock and peak
        memory reported beside every eps; an eps attained only at an unrunnable
        dimension is reported as such.
    required_metrics:
      - >-
        eps_opt per configuration with the shift-set description and lattice
        dimension
      - >-
        eps_opt(joint) - eps_opt(per-block), the quantity measuring (F3)
      - >-
        margin against 8/9, and the implied time exponent 1/2 - 3 * margin
      - >-
        planted-root recovery threshold and failure-mode split
      - >-
        fitted d(eps-hat)/d(log_p D) with the univariate control's fitted
        asymptote

  falsification_conditions:
    - >-
      The tools do not reproduce 1/d or 0.8408 under their own conventions.
      Instrument or translation failure; nothing is reported.
    - >-
      eps_opt(S_3) and eps_opt(joint) are both <= 0.8889. The closure survives
      an attack by the strongest published machinery, and its supply number is
      upgraded from "one strategy's value" to "the paradigm's optimum for this
      polytope" -- a strictly stronger closure, and the honest headline.
    - >-
      eps_opt(joint) equals eps_opt(per-block) within 1e-3. The closure's
      per-block shortcut is tight, and (F3) is retired.
    - >-
      eps_opt > 0.8889 for some configuration, with Stage 2 recovery matching.
      The windowed family is alive at (m, w) = (4, 2), the implied time exponent
      is 1/2 - 3 * (eps_opt - 8/9), and this is a target-class lead requiring
      independent review before anything is claimed.
    - >-
      eps_opt > 0.8889 but Stage 2 recovery fails at the same bound with
      root-extraction failures dominating. The bound is not a reach; the
      algebraic-independence heuristic is the binding constraint and the lane's
      honest supply number stays where it was. This is the outcome that would
      matter most for every other proposal in this lane.
    - >-
      Fitted dimension slope below 2/3 at every D, with the univariate control
      passing. The superpolynomial-dimension lever of IDEA-20260808-e2315e is
      closed with a number.

  confounders:
    - >-
      Normalization mismatch is the dominant risk: published bounds are often
      stated per-variable or as products of bounds, and a mistranslation of a
      factor of n or of the equation count would manufacture or destroy the
      entire 0.048 margin. The conversion must be written out and checked on the
      calibration cases in both directions.
    - >-
      "Provably optimal shift polynomials" is optimality within a paradigm, not
      optimality of the algorithm; conflating the two would overclaim badly.
    - >-
      The external claims are read at abstract and snippet depth because eprint
      is proxy-blocked; an applicability condition stated in the papers and not
      in the abstracts could void Stage 1 entirely, and the contract must budget
      for that.
    - >-
      Larger lattices can fail for floating-point precision rather than
      mathematics; failures must be classified or the slope fit is meaningless.
    - >-
      The dimension sweep's omega' depends on the reduction algorithm and block
      size, which must be pinned in the contract or the break-even threshold
      moves under the measurement.

  interpretation_limits:
    - >-
      Toy tier. A reach computed asymptotically and probed at p ~ 2^24
      calibrates shape, not a crypto-scale exponent.
    - >-
      A positive Stage 1 without Stage 2 is a bound, not a reach, and must never
      be reported as a speedup.
    - >-
      This bears on ONE polytope and ONE cell. Other (m, w) cells inherit
      nothing without being run.
    - >-
      The external results are cited at the depth actually verified; if a
      reviewer opens the papers and the abstracts overstate, this record's
      premise weakens accordingly and that is the correct outcome.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For the S_3 polytope and the joint (4, 2) system, the asymptotic bound
        reported by the optimal-shift machinery is ATTAINED by an actual
        reduction, i.e. the short vectors returned are algebraically independent
        at the target point, uniformly for lattice dimension up to 10^4 and
        p in [2^24, 2^64].
      rigorous_support: >-
        Howgrave-Graham's lemma is unconditional; only joint independence is
        assumed. The distribution imitated is univariate Coppersmith, where
        dimension O(d/eps) suffices and the asymptotic bound is attained
        exactly. Note that Feng et al.'s contribution is described as making the
        BOUND provable, not the independence, so H1 remains genuinely heuristic
        under every tool considered.
      validation_plan: >-
        SAMPLE: planted windowed decompositions at p in {2^24, 2^32, 2^48},
        constructed by choosing four windowed points and setting R to their sum,
        30 instances per bound, bound exponent swept in steps of 0.02 around the
        reported eps_opt. COMPARISON: empirical recovery fraction against the
        step function the bound predicts. TAIL CHECK: the largest bound at which
        any instance is recovered and the smallest at which any fails, plus the
        fraction of failures classified as root-extraction. TRANSFER: toy p
        calibrates the shape of the recovery curve only; the record states the
        sampled p values and claims nothing at 256 bits.
    - id: H2
      statement: >-
        eps(D) is non-decreasing and concave in log D for these systems, so a
        two-decade sweep determines its asymptote to within 0.02 and its slope
        to within 0.1.
      rigorous_support: >-
        Monotonicity is rigorous -- enlarging the shift set cannot shrink the
        set of recoverable roots. Concavity and the convergence rate are
        assumed, imitating univariate Coppersmith convergence.
      validation_plan: >-
        Measure eps-hat(D) on the univariate control where the asymptote 1/d is
        a theorem and the slope is exactly zero; require the two-decade fit to
        recover 1/d within 0.02 before any multivariate slope is quoted. If the
        control's fitted asymptote misses, the fitting procedure is invalid and
        no slope may be read.

  target_complexity:
    time_exponent: >-
      Conditional on H1 and on eps_opt > 8/9 at (m, w) = (4, 2):
      N^{1/2 - 3 * (eps_opt - 8/9)}. At eps_opt = 0.92 that is N^{0.407}; at the
      information ceiling eps = 1 it is N^{0.167}, and with m free and the m!
      factor restored the same accounting reaches L_N(1/2, 2), i.e.
      subexponential prime-field ECDLP. That is the prize and it is explicitly
      NOT claimed. The present measured position is N^{0.644}.
    memory_exponent: >-
      N^{beta}, beta in (1/6, 1/4), for the factor base and sparse matrix, plus
      the shift lattice. Under the delta arm the lattice itself becomes a memory
      object of size N^{delta}, a term the base family does not carry, and it is
      charged: memory = max(N^{beta}, N^{delta}).
    best_known: >-
      Pollard rho / vOW at 0.886 sqrt(N) with O(1) memory; BSGS at
      sqrt(N)/sqrt(N).
    hidden_overhead: >-
      The o(1) here is not small: LLL/BKZ at O~(D^6 bits^3) with D the optimal
      shift set's dimension, which the automated methods may make LARGER than
      Jochemsz-May's in exchange for a better bound -- the trade is explicitly
      part of what Ryan's graph-optimization heuristic addresses, and it must be
      reported, not hidden. The m! = 24 factor at m = 4 is a constant. Root
      extraction is heuristic and is the assumption H1 attacks.
    tradeoff_note: >-
      The delta arm moves this family from memory-light toward memory-heavy and
      must therefore be compared against vOW at matched memory rather than
      against plain rho. Relation collection is embarrassingly parallel; the
      lattice reduction is not, and a per-target reduction of dimension
      N^{delta} is a serial bottleneck that parallel rho does not have.

  dominated_by: >-
    Pollard rho / vOW at N^{1/2}, O(1) memory. All nine frontier rows checked as
    in IDEA-20260904-8dccc9: rho with negation, BSGS, kangaroo (not comparable),
    automorphism-discounted rho, Pohlig-Hellman (not applicable), preprocessing
    S T^2 = N (not comparable), Kuhn-Struik sqrt(TN) (not comparable),
    special-curve attacks (out of scope), and no published prime-field index
    calculus. The family's present position N^{0.644} is dominated by rho on
    time and by nothing on memory, since its memory N^{1/4} is below BSGS's
    N^{1/2} -- a fact that matters only if the time exponent ever drops below
    1/2, and it has not.

  sota_delta: >-
    +0 today. Quantified deltas claimed on execution: (i) eps_available is
    recomputed under a provably optimal shift set instead of one hand strategy,
    turning 0.8408 from an assumption into either a measured optimum or a
    superseded number; (ii) the first joint (multi-equation) reach computation
    in this lane, quantifying the loss in the closure's per-block shortcut;
    (iii) the dimension-slope number that IDEA-20260808-e2315e specified in
    August and never obtained, against an explicit break-even of 2/3; (iv) if
    eps_opt clears 8/9, a time exponent of 1/2 - 3*(eps_opt - 8/9) at memory
    N^{1/4}, which would be target-class in the sense of
    docs/target-result-profile.md A1 and would require the full A2-A8 treatment
    before any promotion.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    ~0.75 that both calibration gates pass and the tools apply to this system
    shape at all. ~0.35 that eps_opt(S_3) exceeds 0.8408 by any measurable
    amount. ~0.12 that eps_opt clears 8/9 at some cell. ~0.05 that a Stage 2
    planted-root probe confirms it. ~0.10 that the dimension slope exceeds 2/3.
    Priority HIGH because this is the only proposal in this session that attacks
    the exact number the closure rests on with an external ingredient the
    closure did not have, because the gap is 30 percent of the available slack
    rather than an order of magnitude, and because the negative branch converts
    a strategy-specific closure into a paradigm-optimal one.

  scope: >-
    The supply side of the windowed prime-field decomposition family at
    (m, w) = (4, 2) and the S_3 / S_4 polytopes, under Coppersmith-family
    solvers including the 2023-2026 automated and provably-optimal variants,
