idea:
  id: IDEA-20260820-53aa2d
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Frozen adaptive-policy prequential e-value audit for SQIsign public messages
  class: sequential_simulator_diagnostic
  claim: >-
    A prequential e-value process evaluated under a frozen adaptive policy may
    test simulator calibration on rare public histories while controlling the
    chosen sequential false-alarm level. It does not establish a distinguisher,
    leakage channel, or attack without a separately validated deviation.
  mechanism: >-
    Before evaluation, freeze a policy mapping the observed public transcript
    history to the next allowed public query or message stratum. Use a
    simulator-derived predictive law to construct bounded one-step e-factors
    whose conditional expectation is at most one, and multiply them into a
    nonnegative test supermartingale. The planted positive applies a calibrated
    conditional tilt only after a preregistered rare public history; an iid
    schedule is the nearby-policy control.
  novelty_status: unverified
  status: proposed
  corrects: IDEA-20260820-653179
  supersedes: IDEA-20260820-653179
  correction: >-
    Preserves the predecessor's frozen adaptive public-message policy,
    prequential e-values, rare-history conditional tilt, and iid control. Adds
    complete task-bound internal citation verification and removes the
    unsupported GRH-boundary assertion. KN-TECH-058's reductions and heuristic
    assumptions remain inherited and unverified.
  source_refs:
    - ref: IDEA-20260820-653179
      provenance: internal
      verified_by: TASK-20260820-5f47b5
      use: immutable corrected predecessor
    - ref: KN-TECH-058
      provenance: kb
      verified_by: TASK-20260820-5f47b5
      use: inherited and unverified baseline boundaries only
    - ref: RQ-SQISIGN-001
      provenance: internal
      verified_by: TASK-20260820-5f47b5
      use: scope of simulator question
  predictions:
    - id: P1
      statement: Under the true-simulator null, the probability that the e-process ever crosses 20 is at most 0.05 plus Monte Carlo error.
    - id: P2
      statement: A planted rare-history conditional odds tilt of 1.5 yields crossing probability at least 0.80 by the frozen horizon H.
    - id: P3
      statement: The iid schedule control crosses no more often than 0.05 plus Monte Carlo error under both null implementations.
  controls:
    true_simulator_null: Run the identical frozen adaptive policy against fresh declared-simulator transcripts and audit optional-stopping calibration.
    planted_positive: Multiply the declared conditional odds by 1.5 only after a preregistered rare public history, renormalizing the public outcome law.
    observation_collision: At identical public histories and next public outcomes, the e-factor must be identical for all hidden construction paths.
    nearby_object: Replace the adaptive policy by an iid schedule matched on the marginal query frequencies.
  falsification_conditions:
    - The null ever-crossing rate exceeds 0.05 beyond Monte Carlo error.
    - The e-factor cannot be proven to have conditional mean at most one under the frozen simulator law.
    - Power against the 1.5 odds tilt is below 0.80 by horizon H.
    - Results require changing the policy after evaluation begins.
  confounders:
    - estimating rare-history probabilities from evaluation data
    - zero-probability support mismatches
    - hidden state shared between policy and generator
    - numerical overflow in product e-values
  interpretation_limits:
    - A crossing indicates predictive misspecification under one policy only.
    - No security conclusion follows without reproducing the deviation on an independently specified implementation.
    - Timing, retries, hidden state, and hard-problem oracles are excluded.
  heuristic_assumptions:
    - The simulator predictive law is evaluable on every public history reached by the frozen policy.
    - Bounded e-factors are computed without data-dependent clipping.
    - KN-TECH-058 reductions and heuristics remain inherited and unverified.
  target_complexity:
    time: O(R * H * C_pred)
    memory: O(H_policy) or streaming state
    data: R sequences of at most H public outcomes
    scope: one frozen adaptive policy and one matched iid control
  cost_model:
    time: one predictive-law evaluation and one verifier replay per step
    memory: public policy state and log e-value accumulator
    data: R independent sequences per condition
    preprocessing: freeze policy, rare-history trigger, e-factor cap, horizon, and threshold
    oracle_access: declared public transcript generator only
    verification: recompute every conditional factor and threshold crossing from logged public histories
  proof_search_map:
    exact_baseline_reproduction: Prove and enumerate conditional mean-one e-factors on a finite toy simulator.
    observation_collision_search: Search hidden-path collisions at the same public history/outcome and require equal factors.
    quantifier_order_statement: Freeze policy and betting rule before sampling any evaluation sequence.
    method_ceiling: Bound inference to histories reached by the frozen policy by horizon H.
    nearby_object_control: Use an iid schedule matched on marginal query frequencies.
  nearest_neighbors:
    - IDEA-20260820-653179
    - IDEA-20260820-93a735
  dominated_by: n/a (no result claimed)
  sota_delta:
    metric: claimed SQIsign security loss
    baseline: 0
    proposed: 0
    delta: 0
    units: bits
    rationale: sequential calibration proposal only
  recommended:
    next_test: Finite-state exact-null proof followed by 100 null and planted-positive sequential repetitions.
    stopping_rule: Each repetition stops at threshold 20 or the frozen horizon H; no policy updates are allowed.
    required_artifacts: [policy_table, predictive_law, e_factor_spec, public_histories, seeds, crossing_report]

