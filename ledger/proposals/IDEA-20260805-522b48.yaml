idea:
  id: IDEA-20260805-522b48
  question_id: RQ-MLKEM-003
  added: '2026-08-05'
  title: >-
    The instrument is structure-blind: an observation-collision audit proving
    that every ML-KEM security number this campaign produced is a statement
    about UNSTRUCTURED LWE at matched parameters, and a search for the cheapest
    observable that separates the two
  class: identifiability_audit

  claim: >-
    Twelve batches of GOAL-MLKEM-003 produced security numbers by evaluating a
    cost function on a parameter tuple. The tuple is (n, q, secret
    distribution, error distribution, number of samples). It contains NO
    representation of the ring Z[X]/(X^256+1), of the module rank as anything
    other than a multiplier on n, or of the negacyclic structure. Therefore the
    following is a FORCED VALUE, derivable before any run: an unstructured LWE
    instance with n = 512, q = 3329 and centred-binomial parameters matching
    ML-KEM-512 produces a BIT-IDENTICAL cost output. Two distinct ground-truth
    objects share the observable. Under docs/inventor-protocol.md section 8
    audit 2 that is a direct falsifier of identifiability: no statement of the
    form "ML-KEM's margin is X bits" is recoverable from this instrument, only
    "unstructured LWE at these parameters has margin X bits", and the module
    structure lies entirely in the fibre. The audit costs one source read and
    one arithmetic comparison. Its second half -- the part that makes it a
    research contribution rather than a complaint -- is to name the smallest
    additional observable that DOES separate the pair, and to derive its value.

  object_first_candidate:
    tracked_object: >-
      THE INSTRUMENT'S INPUT FIBRE. Track, through the campaign's own pipeline,
      the map
        scheme --> parameter tuple P = (n_eff, q, Xs, Xe, m) --> cost estimate,
      and study the FIBRE of the first arrow: the set of mathematically distinct
      cryptographic objects that map to the same P. The tracked object is not a
      lattice and not an attack; it is the equivalence class the instrument
      cannot see past. This is the observable-fibre transform of the inventor
      protocol section 8 applied to the campaign's own measuring device rather
      than to a target.
    established_families_off_limits: >-
      Off-limits as the primary lens: (1) computing any new estimator number and
      differencing it against another -- the move EV-MLKEM-af61e7 names as the
      campaign's obstruction; (2) dual-vs-primal comparison in any form;
      (3) the Carrier Pwrong/Pgood lineage; (4) memory-charge conventions with c
      as a free parameter; (5) implementation conformance. This proposal does
      not compute a security level at all. It computes a FIBRE.
    newness_score: >-
      The observation that lattice estimators are structure-blind is not new to
      the field and this record does not claim it is; it is standard that the
      best known attacks on Module-LWE ignore the ring, which is exactly why
      estimators ignore it. WHAT IS NEW HERE IS THE DIRECTION OF THE INFERENCE.
      The field reads structure-blindness as evidence that structure does not
      help the attacker. This proposal reads it as a constraint on what the
      campaign's own records are entitled to say, and it converts that into a
      pre-registered check with a forced value and a nearby-object control. No
      record in this campaign performs it; twelve batches wrote "ML-KEM" over
      outputs of a function that never saw ML-KEM.
    testability_score: >-
      Maximal and nearly free. The forced value is bit-identity of two outputs,
      or, if a Sage-bearing environment is unavailable, an equivalent read of
      the pinned parameter-object constructor. BATCH-012 established that a
      Sage-bearing route exists (passagemath-standard 10.8.7) and reproduced
      primal_bdd exactly; the check needs one more evaluation on a hand-built
      parameter object.
    survival_score: >-
      The collision survives every downstream stage of the campaign, because
      every stage consumes the estimator's output. It dissolves exactly where an
      attack starts using the ring -- which is the forward-guidance half of the
      proposal and the reason it is not merely negative.

  mechanism: >-
    DERIVED IN THIS RECORD, with its one unverified premise labelled.

    THE PREMISE, LABELLED. The lattice-estimator's LWE parameter object is
    constructed from (n, q, Xs, Xe, m) and its cost functions consume only that
    tuple. RECALLED, UNVERIFIED -- the pinned source was not read for this
    record. THIS IS THE AUDIT'S FIRST AND CHEAPEST STAGE and it is where the
    proposal can die: if the pinned parameter object carries a ring, a module
    rank, or any structural field that a cost function reads, the collision does
    not exist as stated and the audit must report that instead. The premise is
    supported, but not established, by two committed facts: EV-MLKEM-021 records
    that the whole published-vs-estimator gap was traced to which CALLABLE was
    invoked -- `lwe.dual_hybrid` bound to `class MATZOV` versus the module-level
    `lwe_dual.dual_hybrid(fft=True)` -- with no structural field anywhere in the
    diagnosis; and EV-MLKEM-af61e7's OBJ-1 swept n on "the fixed Kyber shape",
    which is only a meaningful operation if n is a free scalar in the input.

    THE COLLISION, IF THE PREMISE HOLDS. Let
      P_mlkem = (n = 512, q = 3329, Xs = CBD(eta1), Xe = CBD(eta2), m),
    the tuple the campaign feeds for ML-KEM-512, and let P_plain be the SAME
    tuple presented as an unstructured LWE instance over Z^512. Then
    cost(P_mlkem) = cost(P_plain) EXACTLY, bit for bit, because the two calls
    are the same call. The ground-truth objects are not the same: one is a rank-2
    module over Z[X]/(X^256+1) with an automorphism group containing the 512
    isometries +/- X^i, the other is a lattice with generic automorphism group
    {+/-1}. The observable does not separate them. QUANTIFIER FORM, written out
    because that is where the error lives:
      the campaign's records assert  FOR ALL ML-KEM instances, margin = X;
      the instrument establishes     FOR ALL instances WITH THIS PARAMETER
                                     TUPLE, cost_model_output = X.
    The second does not imply the first for any property not determined by the
    tuple. The gap is not a quibble about wording: it is the exact reason a
    structural attack would be invisible to every number this campaign
    produced, in either direction.

    THE NEARBY OBJECT WHERE THE CONCLUSION IS KNOWN FALSE -- AND IT IS FREE.
    FrodoKEM is unstructured LWE by design. It is the matched null object for
    every structured-lattice claim, a framing the ANGLE-BRIEF records as
    available and unused anywhere in this program. The control is: run the
    identical pipeline on a Frodo-shaped instance and on the ML-KEM-shaped
    instance at MATCHED (n, q, sigma). If the pipeline returns the same answer,
    it has proven it is not using the structure it is named for. That is the
    inventor protocol's section 8 audit 4 applied at zero marginal cost, and it
    is the strongest single sentence the audit can produce.

    THE SECOND HALF: WHAT WOULD SEPARATE THEM. A negative that stops here is a
    complaint. Three candidate separating observables are named, each with a
    derivation sketch and a cost, and the audit's deliverable is to evaluate
    them:
    (S1) AUTOMORPHISM-ORBIT MEMORY. The negacyclic action v -> X*v is an
         isometry of the coefficient embedding, so on the UNPROJECTED module
         lattice every sieve list entry carries 2n = 512 free companions. A
         sieve storing orbit representatives saves exactly log2(2n) = 9.000000
         bits of log2 M. Using the campaign's own log2 M = 88.4941 / 131.6573 /
         180.9250 (derived by division from EV-MLKEM-020's committed margins and
         c* values), this raises c* by +11.3% / +7.3% / +5.2%. The observable
         separates: the Frodo-shaped instance has no such orbit and saves 0 bits.
         LOAD-BEARING LIMITATION, stated with the number every time it is cited:
         BKZ sieves on PROJECTED sublattices, which do not inherit the ring
         action, so this saving applies to a sieve on the full lattice and is an
         upper bound on what the attack as costed could claim.
    (S2) SAMPLE-COUNT ASYMMETRY. Module-LWE with rank k over degree-n R supplies
         its samples in blocks of n that share one ring element, whereas
         unstructured LWE supplies them independently. Any estimator that treats
         m as a free integer is assuming independence the module instance does
         not have. Whether this changes the optimum is UNKNOWN TO THIS RECORD
         and is a derivation, not a run.
    (S3) SECRET-SPACE VOLUME. CBD(eta) on n*k coefficients has the same support
         size in both readings, so S3 is predicted NOT to separate -- it is
         included precisely as a candidate that should fail, so the audit
         reports at least one negative separation and cannot be accused of
         selecting only separations that work.

    WHY THIS IS NOT A REPACKAGING OF EV-MLKEM-af61e7. That record's obstruction
    is about the DIFFERENCE of two estimator outputs being uninterpretable
    because the two sides make incompatible assumptions. This proposal's
    obstruction is about a SINGLE estimator output being unattributable to
    ML-KEM at all. They are independent: fixing af61e7's asymmetry by matching
    the assumptions on both sides would leave this collision completely intact.

  novelty_status: unverified

  literature_context:
    - >-
      EV-MLKEM-021 (READ, via GOAL-MLKEM-003 batch_log and this goal's brief):
      the whole published-vs-estimator dual gap resolved to callable identity,
      `lwe.dual_hybrid is lwe_dual.matzov` executed True, with D1 =
      +4.132437 / +7.421620 / +11.481588 bits. Cited as evidence about what the
      campaign's instrument reads, not as evidence for this proposal's claim.
    - >-
      EV-MLKEM-af61e7 (READ, via the goal record and brief): the named
      obstruction, and OBJ-1's sweep of n on the fixed Kyber shape finding the
      margin monotone, unbounded, and sign-changing between n = 384 and n = 512.
      That sweep is itself a demonstration that n is a free scalar in the
      instrument -- the fact this proposal turns into a collision.
    - >-
      FrodoKEM as the unstructured matched null. NOT READ; no FrodoKEM
      specification was retrieved for this record and no Frodo parameter value
      is asserted here. GOAL-FRODO-001 exists in this program and its brief does
      not use this framing (ANGLE-BRIEF section 3 F4/F5). Any Frodo parameters
      used by the audit must be read from primary text and filed, not recalled.
    - >-
      The standard position that no known attack on Module-LWE exploits the ring
      and that structured and unstructured LWE are estimated identically for
      that reason. RECALLED, UNVERIFIED, and it is the strongest objection to
      this proposal rather than support for it: if it is right, the collision is
      a faithful reflection of the state of knowledge and the audit's finding is
      about the RECORDS' wording, not about the instrument's adequacy. The audit
      must state which of the two it found.

  lossy_projection_identifiability_audit:
    projection: >-
      Cryptographic object (a scheme with a ring, a module rank, a sampler and a
      parameter set) --> the parameter tuple (n_eff, q, Xs, Xe, m) --> one cost
      number.
    what_is_discarded: >-
      The ring and its automorphisms, the module rank as anything but a
      multiplier, the negacyclic convolution, the compression and rounding maps,
      the FO transform, and the sample-block dependence structure.
    why_genuinely_lossy: >-
      Provably lossy: the fibre contains at least two objects that are not
      isomorphic as lattices with automorphisms -- a rank-2 module over
      Z[X]/(X^256+1) with |Aut| >= 512 and an unstructured instance with
      |Aut| = 2 -- and exhibiting that pair IS the audit.
    why_compatible_with_the_operations: >-
      Compatible in the strong sense that the retained tuple propagates
      deterministically to the cost output: that is exactly why the collision is
      forced and exact rather than approximate.
    is_it_only_a_change_of_coordinates: >-
      NO. It is the MIRROR failure and the proposal is about that failure rather
      than a victim of it: the projection is so lossy that it is CONSTANT across
      the structural axis, i.e. zero comparator spread between ML-KEM and a
      matched unstructured instance. Being able to name a projection's mirror
      failure with a forced value -- exact equality of two outputs -- is the
      cheapest identifiability falsifier available, and here the constancy is
      the finding rather than the flaw in the finding.
    which_failure_was_checked: >-
      Both were checked. Change-of-coordinates: not applicable, since the map to
      the tuple is not invertible. Constant-projection: CHECKED AND FOUND TO BE
      THE POINT, with the separating-observable search (S1/S2/S3) added
      precisely so the session does not stop at a constancy result.

  assumptions:
    - >-
      That the pinned estimator's parameter object and cost functions read only
      the scalar tuple. RECALLED, UNVERIFIED. Stage 1 of the audit is to read the
      pinned source and quote the constructor; if it is false the proposal is
      withdrawn and the audit reports where structure enters.
    - >-
      That the campaign's records do in fact attribute their numbers to ML-KEM
      rather than to the tuple. This is checkable by reading them and is
      partially confirmed already: GOAL-MLKEM-003's own title asks whether "the
      core-SVP margin" is conservative "at FIPS 203 dimensions".

  predictions:
    - metric: >-
        Bitwise equality of the pinned cost-function output on the ML-KEM-shaped
        parameter tuple and on an identically-valued tuple presented as
        unstructured LWE, at all three FIPS 203 parameter sets, for both
        primal_bdd and matzov
      direction: different
      minimum_effect: >-
        FORCED VALUE: EXACT EQUALITY, 6 of 6 cells, to the last representable
        bit -- because they are literally the same call. Any single inequality
        FALSIFIES the premise, means the instrument does carry structure, and is
        far more interesting than the predicted outcome.
    - metric: >-
        Number of fields in the pinned LWE parameter object that encode ring
        degree, module rank as a ring parameter, or any automorphism data
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 0. To be established by quotation from the pinned
        source with file and line, in the style EV-MLKEM-021 used for
        `estimator/lwe.py:13`. A count above 0 refutes the proposal.
    - metric: >-
        Count of records in this campaign whose stated conclusion is scoped to
        "ML-KEM" / "FIPS 203" / "Kyber-N" rather than to the parameter tuple
      direction: higher
      minimum_effect: >-
        PREDICTED >= 5 of the eleven EV-MLKEM records this goal cites. This is a
        census of wording against entitlement, reported as a table with quoted
        sentences and no status changes proposed. A count of 0 would mean the
        campaign already scoped correctly and the audit's second half is its
        only content.
    - metric: >-
        Derived memory saving from the negacyclic orbit on the unprojected
        module lattice, in bits of log2 M, and the resulting c*
      direction: different
      minimum_effect: >-
        FORCED VALUE log2(2 * 256) = 9.000000 bits exactly, giving
        c* = 0.035229 / 0.049253 / 0.007424 against the committed
        0.03164649 / 0.04588645 / 0.00705473, i.e. +11.3% / +7.3% / +5.2%.
        Reported together with the projection limitation, and with the explicit
        statement that it does not approach c* = 1/3.
    - metric: >-
        Number of the three candidate separating observables (S1, S2, S3) that
        actually separate, on derivation
      direction: different
      minimum_effect: >-
        PRE-REGISTERED: S1 separates, S3 does not, S2 unknown. Recording a
        predicted NON-separation in advance is what keeps this from being a
        search for confirmations.

  minimal_test:
    design: >-
      Four stages, cheapest first, zero compute until stage 3.
      STAGE 1 (reading, minutes, DECISIVE AND CAN END THE LINE): read the pinned
      estimator's LWE parameter constructor and the two cost functions actually
      used by this campaign; quote them with file and line. If a structural field
      exists, STOP and report that.
      STAGE 2 (algebra, ~1 hour, zero compute): write out the quantifier
      statement and the collision; derive S1's 9.000000 bits and its c*
      consequences; derive or refute S2 and S3.
      STAGE 3 (execution, minutes, only if an estimator-bearing environment is
      available): evaluate the 6 cells and record exact equality or the
      difference.
      STAGE 4 (census, zero compute): the wording table, with NO status change
      proposed for any record.
    controls:
      - >-
        NULL OBJECT WITH A PRE-DERIVED FORCED VALUE THAT CAN FAIL: the
        "unstructured presentation" arm. Its forced value is exact equality with
        the ML-KEM arm. It can fail -- if any structural field is read anywhere
        in the call graph, the outputs differ -- and that failure is the
        proposal's own falsification, which is the correct shape for a null.
      - >-
        POSITIVE CONTROL, WHERE THE INSTRUMENT MUST MOVE: perturb one field of
        the tuple that the instrument certainly does read -- q, or the error
        standard deviation -- by one unit and confirm the output CHANGES. If the
        output does not move under a change the instrument must see, the harness
        is broken and NO conclusion about invariance may be drawn from the null
        arm. Without this control an "exact equality" result is indistinguishable
        from a harness that returns a constant.
      - >-
        GRADED CONTROL, 4 INTERIOR POINTS: sweep the error standard deviation by
        factors {1.00, 1.02, 1.05, 1.10, 1.25} and report the output sequence and
        its monotonicity. This measures the instrument's sensitivity floor in
        bits per relative parameter change, which is the number needed to say how
        large a structural effect would have had to be to show up. Reporting
        "the instrument is blind to structure" without that floor is unquantified.
      - >-
        NEARBY-OBJECT CONTROL: the Frodo-shaped unstructured instance at matched
        (n, q, sigma), the object where "structure matters" is known false by
        construction.
      - >-
        ORDERING CONTROL: the wording census (Stage 4) is written from a list of
        record ids fixed before any sentence is read, so the table cannot be
        assembled from records selected for embarrassing wording.
    required_metrics:
      - quoted constructor and cost-function signatures with file and line
      - the 6-cell equality table, or the recorded reason it could not be run
      - the sensitivity floor in output bits per 1% parameter change
      - the derivation of S1, S2, S3 with S3's predicted non-separation reported
      - the wording census table with quoted sentences and record ids

  falsification_conditions:
    - >-
      The pinned parameter object or any cost function on the campaign's call
      path reads ring degree, module structure, or automorphism data. The
      collision claim is false; withdraw it and report where structure enters.
    - >-
      The 6-cell comparison returns any inequality. Same disposition.
    - >-
      The positive control does not move. Nothing may be concluded from the
      equality result; the deliverable is an instrument report.
    - >-
      The wording census finds every record already scoped to the parameter
      tuple. The audit's first half is then already discharged by the campaign
      and only the separating-observable half is a contribution -- and the record
      must say so rather than claim a correction it did not make.

  confounders:
    - >-
      TRIVIALITY RISK, THE MAIN ONE. "Two identical function calls return
      identical values" is trivially true and can be dressed up as a finding.
      The non-trivial content is entirely in (a) the derived quantifier
      statement, (b) the sensitivity floor that says how large a structural
      effect would have had to be, and (c) the separating observables with
      numbers. A version of this audit that reports only the equality has
      produced nothing and must be marked as such.
    - >-
      DIRECTION OF THE FIELD'S CONSENSUS. If no known attack uses the ring, the
      instrument's blindness is faithful. The audit must distinguish "the
      instrument cannot see structure" from "there is nothing to see", and it
      CANNOT settle the second. It must say so.
    - >-
      ENVIRONMENT. Sage is absent from this container (verified this session:
      ModuleNotFoundError). Stage 3 depends on the BATCH-012 passagemath route.
      If that route is unavailable, Stage 3 is reported as not run --
      infrastructure signal, never a result -- and Stages 1, 2 and 4 stand alone,
      which is why they were ordered first.

  interpretation_limits:
    - >-
      This audit does NOT show that ML-KEM is weaker or stronger than estimated.
      It shows what the campaign's numbers are ABOUT. Any reading of it as a
      security claim in either direction is a misreading and the record says so.
    - >-
      It proposes NO status change to any evidence, knowledge or goal record.
      Rule 12 is unmet and unwaived; the wording census is descriptive and
      carries no correction.
    - >-
      The 9.000000-bit orbit saving is derived for a sieve on the UNPROJECTED
      module lattice. It is not established for the attack as costed, and every
      citation must carry that clause.
    - >-
      Claim tier: `estimate` for the derived quantities, `design_only` for the
      census. Nothing here is a measurement of a lattice.

  heuristic_assumptions:
    - id: HEUR-SB-4
      statement: >-
        The campaign's cost pipeline factors as
        scheme -> tuple -> cost, with no arrow from scheme to cost bypassing the
        tuple, for every callable used in BATCH-001 through BATCH-012.
      rigorous_support: >-
        Not proved. Supported by EV-MLKEM-021's callable-identity diagnosis and
        by EV-MLKEM-af61e7's ability to sweep n freely, neither of which is
        proof. It is falsifiable by one source read and that read is Stage 1.
      validation_plan: >-
        Stage 1, by quotation with file and line. This is the only load-bearing
        assumption in the proposal and it is discharged first.
    - id: HEUR-SB-5
      statement: >-
        The negacyclic action v -> X*v is an isometry of the coefficient
        embedding of Z[X]/(X^n+1), so orbits in any norm ball have size dividing
        2n.
      rigorous_support: >-
        Elementary and derived: the companion matrix of X^n+1 acting on
        coefficient vectors is a signed permutation, hence orthogonal. This one is
        a proof, not a heuristic, and is listed here only because the memory
        saving derived from it depends additionally on a sieve being able to
        exploit it, which is NOT proved.
      validation_plan: >-
        The isometry needs no validation. The exploitability does, and the
        honest statement is that it is unvalidated and bounded above by
        log2(2n).

  target_complexity:
    time_exponent: >-
      n/a. No attack, no algorithm, no time claim. This proposal moves no
      exponent and does not pretend to; it decides what a set of existing
      numbers means.
    memory_exponent: >-
      Touched only through S1: a derived upper bound of log2(2n) = 9.000000 bits
      of memory saving for a sieve on the unprojected module lattice, which is a
      CONSTANT, not an exponent, and is stated as a constant.
    best_known: >-
      For the underlying question (does the ring help an attacker) the incumbent
      position is that no known attack exploits it. This proposal does not
      contradict that and does not test it.
    hidden_overhead: n/a.
    tradeoff_note: >-
      The only direction this audit can move the campaign's headline is toward
      LESS confidence in the attribution of its numbers, which is the direction
      that costs the campaign something. That asymmetry is deliberate.

  dominated_by: >-
    n/a (no result on the cost frontier is claimed). Rows checked:
    TIME -- no time claim; nothing on the time frontier can dominate an audit.
    MEMORY -- the only memory quantity produced is the derived 9-bit orbit
    bound; the incumbent is the campaign's own log2 M = 88.4941 / 131.6573 /
    180.9250 (derived from EV-MLKEM-020's committed numbers), which this bound
    modifies rather than competes with.
    DATA / QUERIES -- none consumed.
    Corpus rows checked for a prior identifiability or collision audit of this
    instrument: EV-MLKEM-011 through -021 and the 6-hex EV-MLKEM records in this
    goal's brief, GOAL-MLKEM-003's twelve batch_log rows, and the proposals
    IDEA-20260731-001 and IDEA-20260801-012. None performs a section-8 audit-2
    collision search on the estimator itself; EV-MLKEM-021's callable-identity
    finding is the nearest and is a different question (which function ran, not
    what its input can distinguish). External rows NOT checked and declared
    unchecked: any published discussion of estimator structure-blindness.
  sota_delta: >-
    No attack and no cost improvement, so the delta is epistemic and is stated
    quantitatively where it can be: the audit converts N campaign records
    (predicted >= 5) from claiming a scheme-level margin to claiming a
    tuple-level margin, and it supplies the instrument's sensitivity floor in
    output bits per 1% parameter change -- a number the campaign has never
    reported and without which "no structural effect was seen" is unquantified.
    The one numeric contribution is S1's 9.000000 bits and the resulting
    +11.3% / +7.3% / +5.2% on c*, bounded above and limited by projection.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.85 that the collision is confirmed as stated. High because the premise is
    weakly but independently corroborated by two committed evidence records and
    because estimators of this family are designed to be parameter-driven. It is
    not higher because the premise is RECALLED and unread, and this campaign has
    already been wrong twice in one batch about what its own instrument does
    (EV-MLKEM-021's two corrected Coordinator errors) -- which is a direct
    warning against costing an unread source path from memory. It is not lower
    because Stage 1 settles it in minutes either way and both branches are
    reportable.
    SEPARATELY: 0.35 that the audit produces a separating observable whose value
    anyone should act on. S1 is real but bounded by the projection limitation;
    S2 is genuinely unknown; S3 is predicted to fail. A 0.35 prior on a
    zero-compute audit is a good trade and that is the whole argument for
    running it.
