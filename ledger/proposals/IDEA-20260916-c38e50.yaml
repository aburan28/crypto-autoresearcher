        logarithm": exploits symmetries of summation polynomials (point
        negation, and extra automorphisms on Edwards / twisted Jacobi
        intersection curves) to shrink the systems solved during point
        decomposition, claiming an exponential factor about 2^{omega(n-1)} in
        decomposition-solving cost, with the curve model materially affecting
