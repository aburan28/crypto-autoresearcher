      provenance: recalled
      claim: >-
        RECALLED FROM MEMORY AND NOT RETRIEVED THIS SESSION. The general
        technique - decompose a G-equivariant matrix into isotypic blocks via
        the central idempotents of the group algebra and compute rank,
        eigenvalues or a relaxation block by block - is classical and widely
        used (symmetry-adapted bases in computational algebra; symmetry
