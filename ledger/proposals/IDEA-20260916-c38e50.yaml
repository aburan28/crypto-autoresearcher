idea:
  id: IDEA-20260916-c38e50
  question_id: RQ-DREG-bd6c86
  added: '2026-09-16'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE MACAULAY MATRIX OF A SYMMETRIC DECOMPOSITION SYSTEM IS S_m-EQUIVARIANT,
    SO ITS EXACT RANK IS A SUM OF ISOTYPIC BLOCK RANKS OF SIZE d_lambda/m! -
    which buys a factor of about m!^2 / max_lambda d_lambda in both time and
    peak memory for the MEASUREMENT (about 2400x at m = 5) at cells where no
    full rank and no solve is affordable, and simultaneously localises every
    degree fall in an irreducible component, giving the first testable reading
    of whether FGHR symmetrization preserves or destroys the low-degree
    behaviour it is used to exploit
  class: tooling

  claim: >-
    (A) THE DECOMPOSITION. Let F_q have characteristic coprime to m! (so
    q > m suffices for q prime), let the direct point-decomposition system be
    S_{m+1}(x_1,...,x_m, x_R) together with factor-base membership generators
    f_V(x_i) and, in the descended setting, the field equations - a system on
    which the symmetric group S_m acts by permuting the m factor-base
    variables (and, after Weil descent to F_q, by permuting their coordinate
    BLOCKS). The degree-D Macaulay matrix M_D is then S_m-EQUIVARIANT: S_m
    permutes the columns (monomials) and permutes the rows (monomial x
    generator pairs), and the row space is an F_q[S_m]-submodule of the
    permutation module on monomials. Because char(F_q) does not divide m! and
    every ordinary irreducible representation of S_m is realisable over the
    prime field, F_q[S_m] = direct sum over partitions lambda of m of
    M_{d_lambda}(F_q), and therefore
        rank(M_D) = sum over lambda of d_lambda * rank(M_D^lambda),
    where M_D^lambda is the lambda-isotypic block, of dimensions about
    (R_D d_lambda / m!) x (C_D d_lambda / m!). NO FIELD EXTENSION IS NEEDED.
    (B) THE COST STATEMENT, WITH EXPONENTS. Exact rank of an a x b matrix
    costs Theta(a b min(a,b)) field operations. Summing the blocks gives
    total cost about (R_D C_D min / m!^3) * sum_lambda d_lambda^3, and since
    sum_lambda d_lambda^2 = m! exactly, sum d_lambda^3 <= m! * max_lambda
    d_lambda. So the total work is at most (max_lambda d_lambda / m!^2) times
    the monolithic cost, and the PEAK block is (max_lambda d_lambda / m!)^2
    times the monolithic footprint. At m = 4 (m! = 24, max d = 3) that is a
    factor 192 in time and 64 in peak memory; at m = 5 (m! = 120, max d = 6)
    a factor 2400 in time and 400 in peak memory. Memory, not time, is what
    stopped the program's ladder (a 2026-08-28 GOAL-DREG-001 attempt died at
    roughly 12 GiB against an 8 GiB contract with 768,212 columns and its rank
    kernel never invoked), so the peak-block factor is the operative one.
    (C) THE SCIENTIFIC PAYLOAD, WHICH IS NOT A SPEEDUP. Each degree fall now
    carries an IRREDUCIBLE LABEL: new_falls(D) (the meter of
    IDEA-20260916-4b7c1e) decomposes as sum_lambda d_lambda *
    new_falls^lambda(D). CLAIM C is the pre-registered dichotomy. If the falls
    are concentrated in the TRIVIAL component lambda = (m), then the
    symmetrized system - the system in the elementary symmetric variables that
    Faugere-Gaudry-Huot-Renault use to obtain their speedup (KN-LIT-004) -
    RETAINS them, and symmetrization is degree-neutral: its exponential
    speedup is free. If instead a positive fraction of the falls lives in
    non-trivial components, then the symmetrized system has a STRICTLY HIGHER
    first fall degree than the unsymmetrized one, and the FGHR speedup is
    bought at a degree cost that no published cost model in this corpus
    charges. Either answer is a statement about a deployed technique, and
    neither is currently known here.
    (D) WHAT THIS DOES NOT DO. It does not make a solve cheaper (the solutions
    of the decomposition system are the ones FGHR already exploits), it does
    not apply to the binary CHAINED presentation at t = 3 where the available
    symmetry is a single transposition of order 2 = char (the group algebra is
    not semisimple and the decomposition fails - stated here, not discovered
    later), and it moves no ECDLP exponent. What it moves is the largest
    (m, n', q, D) cell at which the per-degree rank profile and the Hilbert
    function are MEASURABLE at all.

  mechanism: >-
    OBJECT FRAME. Representation: the direct S_{m+1} decomposition system in
    the m-block variable presentation, refined by the isotypic decomposition
    of the monomial permutation module - an R1-class representation
    (coordinates of the point in a chosen field basis, refined by a group
    action on the coordinate blocks) touching the RELATION DECOMPOSITION
    stage. Operation set Sigma: the Macaulay/XL step set (multiply by a
    monomial under a degree cap; take F_q-linear combinations) TOGETHER WITH
    the S_m block-permutation action - and the second half is exactly what
    makes the object non-trivial, because Sigma must contain the symmetry for
    the decomposition to be preserved. Trichotomy class
    (IDEA-20260806-c5d183): COORDINATE-DEPENDENT. The isotypic label of a
    polynomial is a function of the presentation and of the chosen group
    action on coordinates, not of the group element or of the ideal; that is
    why it can carry presentation information that ideal invariants provably
    cannot (IDEA-20260830-cb8e46).
    LOSSY-PROJECTION TEST AGAINST THAT Sigma. The tracked object is the
    isotypic component of a polynomial - the projection p |-> (its image under
    the central idempotent e_lambda). It is genuinely lossy: e_lambda p
    discards every other component of p, and from one component one cannot
    reconstruct p, the curve, the target or the solution set. The discard is
    EXACTLY Sigma-compatible, and this is a theorem rather than a hope: the
    e_lambda are central idempotents of F_q[S_m], so they commute with the
    S_m-action, and the Macaulay operations (multiplication by a
    SYMMETRISED monomial orbit-sum, and F_q-linear combination) preserve each
    component. The one honest caveat is that multiplication by a NON-symmetric
    monomial does NOT preserve components - it moves between them - so the
    correct statement is that the row space decomposes as a module and the
    rank is the sum of block ranks, while an individual row need not lie in a
    single block. The block decomposition is applied to the MODULE, which is
    the object, and the per-row statement is not claimed. This is the same
    structure as, and is not the same object as, IDEA-20260807-61049d's
    trivial isotypic component of the RELATION LATTICE under an endomorphism:
    different group, different module, different consequence.
    WHY THE CHARACTERISTIC CONDITION IS LOAD-BEARING AND WHERE IT BITES. The
    decomposition requires char(F_q) not dividing m!. In the
    characteristic-two Weil-descent setting - the regime of
    Petit-Quisquater, Semaev 2015/310 and this program's GOAL-DREG-001 ladder
    - that fails for every m >= 2. The honest scope is therefore: (i) the
    ODD-characteristic direct system, F_q with q > m, which is exactly
    RQ-DREG-bd6c86's prime-field F'/F'' arm and Nagao's p >= 3 regime
    (KN-LIT-71b758 Proposition 2, d_F <= 3p + 1); (ii) in characteristic 2,
    only a subgroup of odd order, e.g. the m-cycle for odd m, giving a factor
    g = m in blocks but requiring arithmetic in F_{2^d} with d = ord_g(2), so
    the NET gain is about g^2 / d^{1.58} - roughly 2.25x at g = 3, which the
    record states plainly as marginal rather than dressing it as a speedup.
    The interesting binary application is therefore the DIRECT S_{m+1}
    descended system at odd m, not the chained one.

  novelty_status: unverified

  citations:
