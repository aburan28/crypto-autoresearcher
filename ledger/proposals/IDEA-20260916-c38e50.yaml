  assumptions:
    - >-
      char(F_q) does not divide m!. This is a HARD PRECONDITION checked per
      cell, not an approximation. Where it fails (the binary chained arm), the
      record says the method does not apply, and only the odd-order-subgroup
      variant with its honestly marginal gain is offered.
    - >-
      The system is genuinely S_m-symmetric as presented. The DIRECT
      S_{m+1}(x_1..x_m, x_R) system with identical membership generators on
      each x_i is; the CHAINED presentation is NOT (its symmetry is the
      automorphism group of the chain topology, which for t = 3 is a single
      transposition). Any cell must declare which presentation it uses and its
      actual symmetry group, computed rather than assumed.
    - >-
      Exact arithmetic over F_q with no numerical linear algebra anywhere. The
      central idempotents e_lambda have denominators dividing m!, which is
      invertible by the precondition.
    - >-
      OFF-LIMITS COMPONENTS DECLARED: family F2 (factor-base decomposition) is
      the underlying system and family F6 (automorphism/symmetry orbit) is
      used as a COMPONENT - the S_m action. What is added is not orbit tracking
      for an attack but a block decomposition of a measurement matrix; no
      new factor base is proposed and KN-OPEN-020 is not engaged.

  proof_search_map:
    bottleneck: >-
      Peak memory of one exact rank at degree D. The program's ladder stopped
      on memory, not on time (768,212 columns at roughly 12 GiB against an
      8 GiB contract, rank kernel never invoked). Removing the monolithic
      matrix by replacing it with m!/d_lambda-fold smaller blocks changes
      which cells exist, and it changes no mathematics, because the block sum
      identity is exact.
    baseline_embedding:
      parameter_slice: >-
        m = 1, or any cell where S_m is trivial: the decomposition has one
        block and reproduces the monolithic rank identically. More usefully:
        at every tested cell the SUM of block ranks must equal the
        independently computed monolithic rank, and that equality IS the
        baseline embedding, checkable wherever the monolithic rank is
        affordable.
      reproduction_check: >-
        Frozen fixture: at the smallest cells (m = 3, q in {5,7}, n' = 1,
        D = 3,4) compute both the monolithic rank and sum_lambda d_lambda *
        rank(M_D^lambda) and require EXACT integer equality. A single mismatch
        halts the line and is reported as an instrument failure, never as a
        degree result.
    observation_collision:
      observable: >-
        The labelled fall profile (new_falls^lambda(D))_{lambda, D}.
      distinct_preimage_search: >-
        REQUIRED. Two systems with the same TOTAL fall profile but different
        labelled profiles would show the labels carry information the totals
        do not - and the search is constructive: take the genuine system and
        the same system with one generator replaced by a symmetrised random
        polynomial of matched multidegree (the N3 arm of
        IDEA-20260916-9d2fa6). If their labelled profiles coincide, the labels
        add nothing and this record's payload (C) is void even though its cost
        claim (B) stands - those two outcomes are separable and the record
        commits to reporting them separately.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the rank computation from the monomial permutation module to
          its isotypic decomposition, where the hypothesis "the degree-D piece
          has rank r" becomes a sum of exact per-block rank conditions.
          Encoding: symmetry-adapted basis via central idempotents.
          Completeness: every component is computed, none dropped - which is
          exactly what distinguishes this from symmetrizing the SYSTEM.
          Soundness: the block-sum identity. Transfer: STATED TO FAIL when
          char divides m!. Cost loss: constructing the symmetry-adapted basis,
          charged in full.
        predicted_gain: >-
          Peak memory divided by (m!/max_lambda d_lambda)^2 - 64x at m = 4,
          400x at m = 5 - and total time divided by m!^2/max_lambda d_lambda,
          192x and 2400x respectively, before charging basis construction.
      - transform: stronger_invariant
        proposed_object: >-
          Retain the labelled fall profile rather than its total, because the
          label is what survives symmetrization and the total is not.
        predicted_gain: >-
          A testable statement about whether the FGHR symmetrization preserves
          the low-degree behaviour it is used to exploit.
    quantifier_order: >-
      CLAIMED: FORALL fields F_q with char not dividing m!, FORALL degrees D,
      FORALL S_m-stable generating sets of the stated shape, rank(M_D) =
      sum_lambda d_lambda rank(M_D^lambda), uniformly, with the blocks
      constructed in advance from the group alone and NOT depending on the
      instance. That order matters: the symmetry-adapted basis is built from
      m and D only, so it is shared across all instances at a cell and its
      construction cost is amortised. NOT CLAIMED: that for every instance
      there EXISTS a block decomposition making the computation cheap - that
      weaker statement is vacuous, since any matrix has a rank-revealing
      factorisation one cannot find in advance.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At these (m, n', q, D) cells, the exact per-degree rank profile,
        Hilbert function and labelled fall profile of this presentation are
        such-and-such, computed within a peak memory (m!/max d_lambda)^2 times
        smaller than the monolithic computation." It can NEVER certify a
        solving degree (F4 does not respect the decomposition), can never
        certify anything at cells where char divides m!, and can never turn a
        measurement into an asymptotic statement.
      nearby_object_control: >-
        BLOCKING: the DELIBERATELY ASYMMETRIC instance. Break the symmetry by
        giving x_1 a different membership generator (a factor base of a
        different size for one variable). The decomposition must then FAIL to
        reproduce the monolithic rank, and the instrument must detect and
        refuse the cell rather than silently reporting a wrong number. An
        instrument that returns a plausible answer on an asymmetric system has
        not identified the load-bearing structure and is void. Second nearby
        object: the SAME system over F_q with q | m! (e.g. m = 3, q = 3),
        where the group algebra is not semisimple and the block sum must fail.
    proof_obligations:
      - claim: >-
          F_q[S_m] is split semisimple when char does not divide m!, and the
          central idempotents are computable over the prime field.
        responsibility: correctness
      - claim: >-
          The degree-D Macaulay row space is an F_q[S_m]-submodule of the
          monomial permutation module for an S_m-stable generating set.
        responsibility: correctness
      - claim: >-
          rank(M_D) = sum_lambda d_lambda rank(M_D^lambda), verified by exact
          integer equality against the monolithic rank at every affordable
          cell.
        responsibility: baseline
      - claim: >-
          Block dimensions and peak memory match the predicted
          (d_lambda/m!)-scaling within 20 percent, measured.
        responsibility: memory
      - claim: >-
          Symmetry-adapted basis construction cost is charged and is amortised
          over instances at a cell, with the amortisation stated per cell.
        responsibility: runtime
      - claim: >-
          The asymmetric nearby object is REFUSED, not answered.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        sum_lambda d_lambda * rank(M_D^lambda) versus the monolithic
        rank(M_D), at m = 3, q in {5,7}, n' in {1,2}, D = 3,4
      direction: different
      minimum_effect: >-
        FORCED EXACT INTEGER EQUALITY at every cell. A discrepancy of 1
        falsifies the implementation or the equivariance assumption, and the
        record commits to hand-deriving the disagreeing cell.
    - metric: >-
        peak resident memory of the largest single block versus the monolithic
        matrix, at m = 4 and m = 5
      direction: lower
      minimum_effect: >-
        Predicted at most (max_lambda d_lambda / m!)^2 + 20 percent of the
        monolithic footprint: at most about 1/64 at m = 4 and about 1/400 at
        m = 5. A measured ratio above 1/10 at m = 5 falsifies the cost claim
        (B) and the record is re-costed; the payload (C) is unaffected by that
        failure and is reported separately.
    - metric: >-
        largest (m, n', D) cell at which a per-degree rank completes within
        the memory contract, blocked versus monolithic
      direction: higher
      minimum_effect: >-
        At least one cell must become measurable that was not - specifically,
        the record predicts that at m = 5 a degree-D cell whose monolithic
        matrix exceeds the contract by up to 100x becomes measurable. If NO
        new cell is reached, the tooling claim has failed on its own terms
        regardless of the ratios.
    - metric: >-
        fraction of new_falls(D) carried by the TRIVIAL component,
        sum over D of d_(m) new_falls^(m)(D) / sum over D of new_falls(D)
      direction: different
      minimum_effect: >-
        THE SCIENTIFIC DECISION METRIC, threshold fixed before data. >= 0.9 at
        every tested cell means symmetrization is degree-neutral and the FGHR
        speedup is free of a degree cost AT THOSE CELLS. <= 0.5 means a
        substantial part of the low-degree behaviour is destroyed by
        symmetrization, and every cost model in this corpus that composes an
        FGHR-style speedup with a small assumed degree must charge the
        difference. Between 0.5 and 0.9 is reported as unresolved.
    - metric: >-
        the asymmetric nearby-object cell and the char | m! cell
      direction: different
      minimum_effect: >-
        BOTH MUST BE REFUSED BY THE INSTRUMENT. A numerical answer on either
        is an instrument failure and voids the battery.

  minimal_test:
    design: >-
      STAGE 0 - ZERO COMPUTE, HARD GATE. Write out the equivariance argument
      and the block-sum identity; verify by hand at m = 2 (two blocks, trivial
      and sign) on a three-monomial fixture over F_5.
      STAGE 1 - SYMMETRY-ADAPTED BASIS, MINUTES. Construct the central
      idempotents of F_q[S_m] for m = 3,4,5 and the projected bases of the
      monomial modules at degrees 3,4,5. Validate by two independent checks:
      the idempotents sum to 1 and are orthogonal; the dimensions of the
      projected spaces sum to the full monomial count.
      STAGE 2 - EXACT AGREEMENT, MINUTES. m = 3, q in {5,7}, n' in {1,2},
      D = 3,4: compute both the monolithic rank and the block sum, require
      integer equality. THIS GATE PRECEDES EVERY OTHER NUMBER.
      STAGE 3 - THE REFUSAL CONTROLS, MINUTES. The asymmetric instance and the
      char | m! instance (m = 3, q = 3). Both must be refused.
      STAGE 4 - THE RANGE EXTENSION, HOURS. m = 4 and m = 5 over
      q in {7,11,13}, n' in {1,2}, D up to the first cell the blocked
      computation cannot reach; report the monolithic pre-flight size for each
      so the extension is quantified rather than asserted.
      STAGE 5 - THE LABELLED FALL PROFILE, HOURS. Report
      new_falls^lambda(D) per component per cell and the trivial-component
      fraction, with the pre-registered verdict.
      STAGE 6 - THE BINARY ODD-ORDER VARIANT, HOURS, CLEARLY SCOPED. Direct
      descended S_4 system over F_{2^n}, Gamma = C_3, arithmetic in F_4;
      report the NET gain (predicted about 2.25x) so the honest smallness of
      the characteristic-two case is on the record rather than inferred.
      STAGE 7 - ZERO COMPUTE. Report, including every cell the blocked
      computation still could not reach.
    controls:
      - >-
        MONOLITHIC-AGREEMENT CONTROL (blocking) at every affordable cell.
      - >-
        ASYMMETRIC-INSTANCE REFUSAL (blocking): the instrument must detect
        that S_m does not act and refuse.
      - >-
        NON-SEMISIMPLE REFUSAL (blocking): char | m! must be refused.
      - >-
        IDEMPOTENT VALIDATION: orthogonality, sum to identity, and projected
        dimensions summing to the monomial count.
      - >-
        SYMMETRISED-RANDOM ARM (the N3 rung of IDEA-20260916-9d2fa6) at
        matched cells, so the labelled profile has a null with the same
        symmetry.
      - >-
        BASIS-CONSTRUCTION COST CHARGED and reported separately from the rank
        cost, with the per-cell amortisation stated.
    required_metrics:
      - 'rank(M_D^lambda) per component, d_lambda, and the block sum'
      - 'monolithic rank(M_D) wherever affordable, and the exact difference'
      - 'block dimensions, peak RSS per block, wall time per block, basis construction time'
      - 'new_falls^lambda(D) per component and the trivial-component fraction'
      - 'monolithic pre-flight size for every cell reached only by the blocked route'
      - 'refusal outcomes for both refusal controls'
      - 'net gain measured for the characteristic-two C_3 variant'

  falsification_conditions:
    - >-
      The block sum differs from the monolithic rank at any affordable cell.
      The decomposition or its implementation is wrong; the battery is void.
    - >-
      Peak block memory exceeds 1/10 of the monolithic footprint at m = 5.
      The cost claim (B) is false as stated and is re-derived or withdrawn.
    - >-
      No cell becomes measurable that was not measurable before. The tooling
      claim has failed on its own terms even if the ratios look good, because
      the deliverable is range, not ratios.
    - >-
      The instrument returns a number on the asymmetric instance. It is not
      detecting the structure it claims to use; void.
    - >-
      The labelled profile is identical to the symmetrised-random arm's at
      every cell. The labels carry no information about the summation
      polynomial and payload (C) is void; (B) survives and is reported alone.
    - >-
      Symmetry-adapted basis construction dominates the rank cost at every
      cell. The gain is eaten by its own preprocessing and the method is a
      building block for nothing.

  confounders:
    - >-
      SPARSITY VERSUS BLOCK SIZE. The monolithic Macaulay matrix is sparse;
      the isotypic blocks are denser (the change of basis fills in). A 400x
      dimension reduction with a 50x density increase is a much smaller real
      gain, and the measured metric is PEAK RSS AND WALL TIME, never dimension
      ratios. This is the most likely way the cost claim fails and it is named
      in advance.
    - >-
      BASIS CONSTRUCTION COST at m = 5, D = 5 may itself be large; it is
      charged, reported separately, and its amortisation over instances at a
      cell is stated per cell rather than assumed.
    - >-
      PRESENTATION SYMMETRY IS NOT THE SYSTEM'S ONLY SYMMETRY. Point negation
      (x is invariant under P -> -P for the x-coordinate) and curve
      automorphisms are separate symmetries exploited by FGHR; mixing them
      with the S_m block action without checking that the combined group acts
      would give a wrong decomposition. Only the S_m block action is used
      here, and the group is computed per cell.
    - >-
      THE CHAINED ARM IS NOT COVERED. Anyone reading a conclusion here as
      applying to the GOAL-DREG-001 binary chained ladder is reading beyond the
      record; char 2 with a transposition is exactly the excluded case.
    - >-
      LABELS ARE PRESENTATION-BOUND. The isotypic label of a fall depends on
      the S_m action chosen, which depends on the variable blocking. A
      different blocking gives different labels, so the labelled profile is
      compared only within one blocking convention.

  interpretation_limits:
    - >-
      TOOLING plus one mechanism prediction. No attack, no exponent, no
      statement about any deployed curve.
    - >-
      Every number is scoped to the tested (m, n', q, D) cell, the direct
      S_{m+1} presentation, the stated blocking and the stated field-equation
      convention.
    - >-
      The FGHR degree-cost reading (payload C) is a statement about the
      systems tested, not about FGHR's published claims, which were not
      re-derived and whose paper was not read by this session.
    - >-
      KN-OPEN-020 class: not applicable - no factor base is proposed; the
      existing membership generators are used unchanged.
    - >-
      The cost factors in (B) are DERIVED from the block dimensions and the
      Theta(a b min(a,b)) rank cost. They are predictions to be measured, not
      measurements; the only measured quantities will be peak RSS and wall
      time.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The isotypic blocks of the degree-D Macaulay matrix have rank close to
        their generic value - i.e. the row space distributes across components
        in proportion to the component dimensions, up to the structural
        deficits under study: |rank(M_D^lambda) / rank(M_D) - d_lambda^2 / m!|
        is below 0.1 for every lambda at every tested cell, EXCEPT where a
        structural fall is localised, which is the signal.
      rigorous_support: >-
        The rigorous ingredient is the exact identity rank(M_D) = sum_lambda
        d_lambda rank(M_D^lambda) together with sum_lambda d_lambda^2 = m!,
        which fixes the proportions a "uniform" row space would give. The
        classical statement imitated is the equidistribution of a random
        submodule of a permutation module across its isotypic components, the
        module-theoretic analogue of a random subspace meeting every
        coordinate block in its expected dimension.
      validation_plan: >-
        SAMPLE - at m = 3,4 over q in {5,7,11}, n' in {1,2}, D = 3,4,5, with
        20 random targets per cell, compute the per-component rank fractions;
        and compute the SAME fractions on the symmetrised-random null arm
        (rung N3 of IDEA-20260916-9d2fa6) which has the same symmetry and
        random coefficients. COMPARISON DISTRIBUTION - the observed fractions
        against d_lambda^2 / m!, and against the null arm's observed
        fractions, which is the operative comparison because the null arm
        supplies the empirical "generic" baseline rather than an assumed one.
        TAIL CHECKS - (a) the component with the LARGEST deviation is reported
        individually at every cell, never only the aggregate; (b) the single
        target achieving the largest deviation is archived with its curve and
        factor base; (c) the number of cells where a component's fraction is
        zero (the component is entirely absent from the row space) is reported,
        since a vanishing component is the sharpest possible localisation and
        would be the headline. SAMPLED PARAMETERS RECORDED - m, n', q, curve,
        target, factor base, D, blocking convention, seed. TRANSFER
        ASSUMPTIONS - NONE; nothing is claimed at m > 5, at cryptographic q,
        or in characteristic 2 beyond the explicitly scoped C_3 variant.
    - id: H2
      statement: >-
        The symmetry-adapted change of basis increases the density of the
        Macaulay matrix by a factor below 10 at the tested cells, so that the
        predicted peak-memory gain of (m!/max d_lambda)^2 is realised to
        within a factor 10.
      rigorous_support: >-
        No theorem is available and the record says so: fill-in under a
        symmetry-adapted basis is a property of the monomial support and is
        not controlled by any bound cited here. The rigorous anchor is only
        the exact dimension count of the blocks, which is a lower bound on
        what can be achieved; density is the free parameter and is the
        declared risk of the whole cost claim.
      validation_plan: >-
        SAMPLE - measure nonzero counts before and after projection at every
        cell of Stages 2 and 4, starting with the smallest. COMPARISON - the
        measured density ratio against 1 (no fill-in) and against the
        break-even ratio at which the block route stops winning, which is
        computed per cell IN ADVANCE and recorded, so the test can fail. TAIL
        CHECK - the densest block at the largest cell is reported individually.
        TRANSFER - none; density at m = 3 does not predict density at m = 5,
        and the m = 5 cells carry their own measurement or are reported as
        not measured.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. As an instrument, for the
      degree-D exact rank: from Theta(R_D C_D min(R_D,C_D)) monolithic to at
      most (max_lambda d_lambda / m!^2) times that, i.e. a constant factor in
      m - 192x at m = 4, 2400x at m = 5 - before charging basis construction
      and fill-in. This is a CONSTANT-FACTOR instrument gain, not an exponent,
      and search bias 1 of the Idea Generator contract says so plainly: it is
      offered as a REQUIRED BUILDING BLOCK for the exponent question, because
      the growth law RQ-DREG-bd6c86 asks about cannot be fitted from cells that
      cannot be computed, and the program's ladder is currently memory-bound.
    memory_exponent: >-
      Peak footprint from Theta(R_D C_D) monolithic to
      Theta(R_D C_D (max d_lambda / m!)^2) for the largest block - 1/64 at
      m = 4, 1/400 at m = 5 - modulo the fill-in factor of H2. Blocks are
      computed sequentially so peak is the largest block, not the sum.
    best_known: >-
      For MEASURING these systems: the monolithic exact-rank instrument of
      EXP-DREG-001 (block-m4ri, memory-bound at roughly 12 GiB / 768,212
      columns) and a full Magma F4 run (unbounded; 111-126 GB reported by
      Kosters at n = 45 per KN-LIT-e77232 as recorded in KN-LIT-fa346d). For
      SOLVING these systems: FGHR symmetrization (KN-LIT-004) claims about
      2^{omega(n-1)}, and this record neither reproduces nor improves it - it
      measures whether it costs degree. For the ECDLP: Pollard rho, unaffected.
    hidden_overhead: >-
      Three disclosures. (1) The factor m!^2 / max d_lambda is a DIMENSION
      count; fill-in under the symmetry-adapted basis can eat it and H2 is the
      falsifiable form of that risk. (2) Basis construction is superlinear in
      the monomial count and is charged; at the largest cells it may dominate.
      (3) The whole method is inapplicable in the characteristic-two chained
      regime that most of this program's ladder lives in, which bounds its
      practical reach to the odd-characteristic arm of RQ-DREG-bd6c86.
    tradeoff_note: >-
      Blocks are independent, so the computation is embarrassingly parallel
      across components with no communication, and the time-memory position
      improves in both coordinates simultaneously rather than trading one for
      the other - which is the unusual and attractive feature of an exact
      symmetry decomposition, when the fill-in does not spoil it.

  dominated_by: >-
    CHECKED ROW BY ROW. As an ATTACK: n/a - none is mounted; rho (N^{1/2},
    O(1)), BSGS, van Oorschot-Wiener, multi-target sqrt(TN), preprocessing
    S*T^2 = Omega~(N), and meet-in-the-middle index calculus all dominate on
    every axis and none is affected. As a SOLVING technique for these systems:
    DOMINATED BY FGHR (KN-LIT-004), which symmetrizes and solves the smaller
    system directly; this record deliberately keeps all components and is
    therefore strictly more expensive for solving, and is not proposed for
    solving. As an INSTRUMENT: not dominated in this corpus - the monolithic
    rank engine it extends is a special case (one block), and no other in-corpus
    record decomposes the measurement matrix by symmetry. Externally the
    technique is almost certainly known in general form (see the `recalled`
    citation) and the honest classification is `adaptation`.
  sota_delta: >-
    Zero on every ECDLP cost axis. Quantified deltas: (1) instrument range -
    a predicted 64x (m = 4) to 400x (m = 5) reduction in peak memory for the
    per-degree rank, against a ladder that is currently memory-bound and has
    "n = 21, n = 24 sem/null: not attempted" on record; the deliverable is the
    list of cells that become measurable, and if that list is empty the record
    has failed; (2) a first measurement of whether FGHR-style symmetrization
    preserves the low-degree falls - currently unknown here and uncosted in
    every cost model in this corpus that composes a symmetrization speedup with
    a small assumed degree of regularity. Against the external state of the art
    the instrument is an adaptation of standard equivariant linear algebra and
    no novelty is claimed for it.

  estimated_cost:
    implementation: high
    compute: medium
    basis: >-
      Implementation HIGH and stated as such: central idempotents of F_q[S_m],
      symmetry-adapted bases of monomial modules at several degrees, a
      projection that preserves exactness, the refusal controls, and the
      agreement gate are all new code with real correctness risk, and the
      corpus already records one wrong-observable incident in this lane
      (KN-OPEN-5b3a08, the s4_expr collision bug on 21 archived runs). Compute
      MEDIUM: Stages 0-3 are minutes; Stage 4 is the real cost and is bounded
      by the memory contract by construction, with every unreached cell
      reported. The instrument's own value is that its cost is bounded in
      advance by a pre-flight block-dimension count.

  recommended_priority: medium

  discriminated_from: >-
    KN-LIT-004 (FGHR) symmetrizes the SYSTEM to solve it faster and discards
    the non-invariant part; this record decomposes the MEASUREMENT MATRIX and
    keeps every part, which is what makes the total rank recoverable and the
    FGHR degree question askable. IDEA-20260807-61049d uses isotypic
    components of the relation LATTICE under a curve endomorphism - different
    group, different module, no Macaulay matrix. IDEA-20260916-4b7c1e supplies
    the observable that this record labels. IDEA-20260916-9d2fa6 supplies the
    symmetric null arm that this record's labelled profile is compared against.

