idea:
  id: IDEA-20260821-9ad4a2
  question_id: RQ-HQC-001
  added: '2026-08-21'
  title: >-
    Every HQC attack that folds cyclic shifts assumes without argument that the
    shifts are ALL the free instances the ring supplies; re-express key recovery
    in R = F_2 x F_{2^{n-1}} and separate the WEIGHT-preserving symmetry group
    (order n(n-1)) from its CODE-preserving subgroup (the only part a
    same-code merge can use), then compute the exact fixed-point count that
    decides whether the two coincide - a closure with a named obstruction, or a
    publicly testable weak-h class
  class: representation

  claim: >-
    (A) THE UNARGUED STEP. Sendrier's Decoding-One-Out-of-Many discount for a
    quasi-cyclic code, the quantum orbit-folding of IDEA-20260813-a46301, and
    the multi-instance costing of IDEA-20260821-726cc7 all consume the SAME
    resource: a family of syndromes that are (i) different, (ii) weight-preserving
    images of one another, and (iii) syndromes OF THE SAME CODE. Every one of
    them takes that family to be the n cyclic shifts. NOWHERE IN THIS
    REPOSITORY, and nowhere this session could find externally, is it argued that
    n is the maximum. It is assumed.

    (B) THE STRUCTURE THAT MAKES THE QUESTION ANSWERABLE. H-HQC-d46460
    establishes in this lane, from HQC's own parameter-selection rule ("the
    smallest primitive prime greater than n_1 n_2"), that n is prime, 2 is a
    primitive root mod n, ord_n(2) = n - 1, X^n - 1 = (X-1).Phi(X) with Phi
    irreducible, and therefore R = F_2[X]/(X^n - 1) is isomorphic to
    F_2 x F_{2^{n-1}} - EXACTLY TWO FACTORS. In that setting the coordinate
    permutations that are ring automorphisms of R are exactly the MULTIPLIER MAPS
    sigma_a : X -> X^a for gcd(a, n) = 1, a group isomorphic to (Z/n)^* of order
    n - 1, and the Frobenius z -> z^2 on the big factor is sigma_2, which
    generates the whole multiplier group precisely because 2 is primitive. Every
    sigma_a permutes coordinates and therefore PRESERVES HAMMING WEIGHT. Together
    with the n cyclic shifts tau_i : X -> X.X^i they generate a group G of order
    n(n-1) - about 2^{28.2} at HQC-1 - acting on instances, every element of
    which maps a weight-w solution to a weight-w solution.

    (C) THE CLAIM, AND IT IS A SEPARATION CLAIM. G is the WEIGHT-preserving
    group; only its CODE-preserving subgroup is usable by a same-code merge.
    A shift tau_i sends the instance (h, s) to (h, X^i s) - same h, same code.
    A multiplier sigma_a sends it to (sigma_a(h), sigma_a(s)) - a DIFFERENT code
    unless sigma_a(h) happens to lie in the shift orbit of h. So the usable
    subgroup is
    Stab(h) = { (a, i) : sigma_a(h) = X^i h }, and the DOOM instance count is
    exactly n . |Stab(h)| / n = |{a : exists i, sigma_a(h) = X^i h}| times n
    divided by nothing - concretely, the number of distinct same-code syndromes
    available is n times the index-count of that stabiliser. CLAIM: for h drawn
    by HQC's seed expander, Stab(h) is trivial with probability 1 - epsilon(n),
    where epsilon(n) is EXACTLY COMPUTABLE by orbit-counting, and therefore the
    instance count available to any same-code merge is exactly n - the assumption
    everyone makes, now with an argument and a number instead of a convention.

    (D) THE COMPUTATION, AND IT IS FREE. For a fixed nonidentity pair (a, i), the
    map k -> a.k + i mod n is a permutation of Z/n, and the number of h in F_2^n
    fixed by the induced coordinate permutation is exactly 2^{c(a,i)} where
    c(a,i) is that permutation's cycle count. So
    |{h : Stab(h) nontrivial}| <= sum over (a,i) != (1,0) of 2^{c(a,i)},
    and epsilon(n) <= 2^{-n} times that sum. Every c(a,i) is computable in O(n)
    time by walking cycles, and there are n(n-1) pairs, so the whole exact upper
    bound costs O(n^2 . n) = about 5.5 x 10^{12} elementary steps at HQC-1 if
    done naively - and O(n . tau(n-1)) if done properly, because c(a,i) depends
    only on ord_n(a) and on whether a = 1, which reduces the sum to one term per
    divisor of n - 1. THAT REDUCTION IS THE WHOLE COMPUTATIONAL CONTENT AND IT
    MAKES THE ANSWER A MATTER OF SECONDS AT DEPLOYED PARAMETERS.

    (E) THE TWO OUTCOMES, BOTH USABLE, DECLARED BEFORE THE RUN. OUTCOME-CLOSED:
    epsilon(n) is astronomically small at all three levels, so no deployed key
    admits a larger same-code orbit, the DOOM instance count is exactly n by
    symmetry, and the record is a CLOSURE at the inventor-protocol section 4
    standard - a named obstruction (the multiplier group acts on the code, not
    within it, and only the trivial stabiliser survives), an argument (the
    fixed-point count), and forward guidance (what remains open is whether
    instances can come from somewhere OTHER than symmetry, namely from multiple
    ciphertexts, which is IDEA-20260821-726cc7's Q axis, and from the
    decisional-to-search structure of 2-DQCSD-P, which nobody here has touched).
    OUTCOME-WEAK-h: epsilon(n) is non-negligible at some level, in which case
    there is a class of public keys with a strictly larger free-instance orbit, a
    correspondingly larger DOOM discount, AND A MEMBERSHIP TEST COMPUTABLE FROM
    THE PUBLIC KEY ALONE - which would be a weak-key class in a scheme about to
    be standardised.

    (F) WHAT IS NOT CLAIMED. No attack. No exponent. Even in the WEAK-h branch
    the discount is at most a further factor at most n - 1 inside a square root,
    i.e. at most about 14 bits at HQC-1, against work factors above 128 bits.
    This is a CEILING computation and a building block: it fixes the N axis of
    IDEA-20260821-726cc7 on the single-ciphertext side, and it is proposed
    because that record's cost surface is meaningless if N is not pinned. Under
    docs/target-result-profile.md checklist item C1 this is NOT a target-class
    result and is not presented as one.

  mechanism: >-
    STAGE 0 (THE ALGEBRA, ZERO COMPUTE, AND IT IS THE LOSSY-PROJECTION TEST).
    Write the key-recovery instance as the pair (h, s) with s = x + h.y,
    w(x) = w(y) = w. Under the CRT isomorphism psi : R -> F_2 x F_{2^{n-1}}
    established by H-HQC-d46460, the instance becomes a pair of scalar equations,
    one in F_2 (the evaluation character chi, which is
    IDEA-20260805-db5afa's object) and one in the field F_{2^{n-1}}. THE POINT
    OF THE RE-EXPRESSION IS NOT TO SOLVE THE FIELD EQUATION - it is one equation
    in two unknowns over a field and carries no information without the weight
    constraint - BUT TO IDENTIFY THE SYMMETRIES. In the field factor, the Galois
    group of F_{2^{n-1}}/F_2 is cyclic of order n - 1 generated by Frobenius, and
    under psi Frobenius pulls back to the coordinate permutation k -> 2k mod n,
    i.e. sigma_2. Because 2 is primitive mod n, <sigma_2> is the entire multiplier
    group (Z/n)^*. SO THE GALOIS GROUP OF THE BIG FACTOR AND THE MULTIPLIER GROUP
    OF THE RING ARE THE SAME OBJECT, and HQC's own primitivity requirement is
    what makes them coincide. That identification is the structural ingredient
    and it is what makes the fixed-point count tractable.

    STAGE 1 (THE EXACT COUNT, SECONDS). For each divisor d of n - 1, let a be an
    element of order d in (Z/n)^*. The permutation pi_{a,i} : k -> a.k + i mod n
    has a cycle structure determined by d and by whether a = 1. For a != 1 the map
    has a unique fixed point k_0 = i.(1-a)^{-1}, and every other orbit has size
    exactly d (the multiplicative order of a), so c(a,i) = 1 + (n-1)/d, EXACTLY
    AND INDEPENDENTLY OF i. For a = 1 and i != 0 the map is a single n-cycle so
    c = 1. Therefore
    sum over (a,i) != (1,0) of 2^{c(a,i)}
      = (n - 1) . 2^1  +  n . sum over d | (n-1), d > 1 of phi(d) . 2^{1 + (n-1)/d}.
    THE DOMINANT TERM IS d = 2, i.e. a = n - 1 (the reversal map), giving
    n . 2^{1 + (n-1)/2}. So the exact upper bound is
    epsilon(n) <= 2^{-n} . [ 2(n-1) + n . sum_{d | n-1, d>1} phi(d) 2^{1+(n-1)/d} ],
    dominated by n . 2^{(n+1)/2 - n} = n . 2^{-(n-1)/2}. THIS IS A CLOSED FORM,
    EVALUABLE IN MILLISECONDS ONCE n - 1 IS FACTORED, AND IT IS THE HEADLINE
    NUMBER. Every step above is derived in this record and is to be re-derived
    and re-checked in-harness; NOTHING HERE IS A MEASUREMENT and no number in
    this paragraph may be cited as one.

    STAGE 2 (BRUTE-FORCE VERIFICATION AT SMALL n, MINUTES). The closed form is a
    combinatorial claim and must be checked against exhaustive enumeration.
    Choose the primitive primes n in {11, 13, 19, 29, 37, 53, 59, 61, 67, 83}
    (2 a primitive root mod n - verified in-harness, not assumed). For each, and
    for n <= 29 exhaustively over all 2^n vectors h, compute Stab(h) directly by
    testing all n(n-1) group elements, and count |{h : Stab(h) nontrivial}|
    exactly. Compare against the closed form. THIS IS A HARD GATE: a closed form
    that does not reproduce an exhaustive count at n = 11, 13 and 19 is wrong and
    nothing downstream is reported. For the larger n, sample 10^7 uniform h and
    check the empirical rate against the bound (which will be far below the
    sampling floor, so the check there is one-sided and is reported as such).

    STAGE 3 (THE CODE-PRESERVING VERSUS WEIGHT-PRESERVING SEPARATION, THE ACTUAL
    DELIVERABLE). For each small n, and for random h, compute the FULL permutation
    automorphism group of the quasi-cyclic code C_h = { (u, v) : v = h.u } (or of
    the syndrome-decoding instance's code, whichever the FORK in stage 0 resolves
    to) by direct search over the n(n-1) candidate group elements, and report
    |Aut_G(C_h)|. The claim is |Aut_G(C_h)| = n for all but an epsilon fraction of
    h. Report the empirical distribution of |Aut_G(C_h)| over 10^5 random h at
    each small n, alongside the closed-form prediction of the exceptional rate.

    STAGE 4 (THE PARAMETER-RULE CONTROL, WHICH IS THE NEARBY OBJECT). Repeat the
    whole computation for primes n where 2 is NOT primitive - so that
    X^n - 1 factors into MORE than two pieces and R has more than two field
    factors. The prediction is that the exceptional set is LARGER there, because
    an h supported on a union of cosets of the subgroup <2> mod n is fixed by
    more multipliers. IF THE PIPELINE RETURNS THE SAME ANSWER FOR PRIMITIVE AND
    NON-PRIMITIVE n, IT IS REPORTING THE GROUP ORDER AND NOT THE CODE, and no
    conclusion is drawn. This control also gives the record its forward guidance
    in the OUTCOME-CLOSED branch: it identifies HQC's primitivity rule as the
    thing that closes the door, which is a property of the parameter-selection
    rule and not of quasi-cyclicity in general - so a quasi-cyclic scheme that
    does not impose primitivity does not inherit the closure.

    STAGE 5 (THE DEPLOYED EVALUATION). Evaluate the closed form at n = 17669,
    35851 and 57637, having factored each n - 1 in-harness. Report epsilon(n) per
    level, and report the MEMBERSHIP TEST explicitly - given a public key's h,
    testing Stab(h) triviality costs O(n . tau(n-1)) with the same divisor
    reduction, i.e. milliseconds - so that the WEAK-h branch, if it fires, comes
    with a runnable test rather than an assertion.

