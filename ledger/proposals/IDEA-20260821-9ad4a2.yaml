    results: >-
      IN-CORPUS. H-HQC-d46460 owns the ring decomposition R = F_2 x F_{2^{n-1}}
      and the primitivity consequence, and uses them for a DFR object - the
      identity w(e') = w_e mod 2, which is IDEA-20260805-db5afa's evaluation
      character. NEITHER RECORD MENTIONS THE MULTIPLIER GROUP, the Galois action,
      code automorphisms, or the instance-orbit question; their object is the
      error vector's parity and their consequence is about SPEC Eq. (3)'s
      binomial model, not about attack cost. IDEA-20260813-a46301 and
      IDEA-20260813-c34e09 fold the cyclic-shift orbit in quantum walks and take
      the orbit size n as given. IDEA-20260805-baa4da defers DOOM entirely. NO
      RECORD IN THIS REPOSITORY ASKS WHETHER THE CYCLIC SHIFTS EXHAUST THE
      SAME-CODE SYMMETRY, and no record computes an automorphism group of any
      code.
      EXTERNAL. Nothing found this session bears on it, and the search was not
      aimed at it - see the recorded gap above.
    verdict: >-
      UNVERIFIED, with the specific exposure named: the permutation automorphism
      group of cyclic and quasi-cyclic codes is classical coding theory, the
      multiplier group of a cyclic code of prime length is textbook material, and
      it is entirely plausible that "the automorphism group of a random
      quasi-cyclic code of prime length with 2 primitive is the cyclic group" is
      a known lemma with a known proof. CLAIMED NEW RELATIVE TO THIS REPOSITORY:
      the separation of the weight-preserving group from its code-preserving
      subgroup as the quantity that bounds a DOOM-style instance count; the exact
      fixed-point closed form with the divisor reduction; and the framing in which
      the answer is either a closure on the instance axis or a publicly testable
      weak-h class. IF THE LEMMA IS KNOWN, this record becomes a citation plus a
      concrete evaluation at HQC's three parameter sets and a membership test -
      which is less than a discovery and more than nothing, and which is exactly
      what IDEA-20260821-726cc7 needs as an input. STAGE 0 MUST INCLUDE A
      LITERATURE SEARCH AIMED AT THIS QUESTION, which this session did not run.

  object_first_candidate:
    tracked_object: >-
      The pair of groups (G, Aut_G(C_h)) - the weight-preserving coordinate
      symmetry group of the ambient ring, of order n(n-1), and its subgroup
      preserving the specific code C_h - followed as h varies over the seed
      expander's output. What is tracked is the INDEX, i.e. how much of the
      available symmetry survives the choice of code.
    established_families_off_limits: >-
      Declared off-limits as the primary lens for this record: (i) the DFR /
      decryption-failure family, which is eighteen of this lane's twenty
      proposals; (ii) the COST family - charging memory to an ISD variant - which
      is IDEA-20260805-baa4da's and IDEA-20260821-726cc7's, and which this record
      feeds rather than duplicates; (iii) the EVALUATION-CHARACTER family, which
      is IDEA-20260805-db5afa's and H-HQC-d46460's and which uses the same ring
      decomposition for a completely different purpose; (iv) quantum orbit
      folding, IDEA-20260813-a46301's. The symmetry-group lens is this record's.
    lossiness: >-
      THE PROJECTION IS h -> Aut_G(C_h), FROM 2^n POSSIBLE h TO A SUBGROUP OF A
      GROUP OF ORDER n(n-1), AND IT IS THE SHARPEST LOSSY PROJECTION IN THIS
      BATCH. At HQC-1 it maps 2^17669 objects onto a lattice of subgroups of a
      group of order 2^28.2 - the fibres are astronomically large, and generically
      one fibre (the trivial-stabiliser one) contains essentially everything.
      COMPATIBILITY WITH THE TARGET'S OPERATIONS, WHICH IS THE PART THAT MATTERS:
      the operation a DOOM-style merge performs is "apply a group element to an
      instance and keep it if the code is unchanged", and that operation is
      determined ENTIRELY by Aut_G(C_h) - the discarded structure of h plays no
      role in it whatsoever. So the retained part propagates deterministically
      under exactly the operation being studied, which is inventor-protocol
      section 2's requirement stated in full.
      IT IS NOT A CHANGE OF COORDINATES, and the check is explicit: h cannot be
      recovered from Aut_G(C_h), because generically the map is constant. The
      (Delta, Pi) = (x XOR y, x.y) failure - where nothing was discarded because
      the pair was recoverable as the roots of a quadratic - has the opposite
      character here: essentially EVERYTHING is discarded, and the honest risk is
      the mirror one, that the projection is so lossy it is constant and carries
      no information. THAT MIRROR RISK IS EXACTLY WHAT MAKES THE MEASUREMENT
      INTERESTING RATHER THAN VACUOUS: a constant projection with the value n IS
      the closure, stated as a theorem about the fibre rather than as a shrug, and
      a non-constant one is the weak-h class.
    propagation: >-
      One step of the target operation is "apply one group element (a, i) to the
      instance". Its one-step propagation law is completely explicit:
      (h, s) -> (sigma_a(h), sigma_a(X^i s)), the solution (x, y) ->
      (sigma_a(X^i x), sigma_a(X^i y)) with weight exactly preserved, and the code
      preserved if and only if sigma_a(h) lies in the shift orbit of h. That
      one-step law is measurable by direct computation for any concrete h, at
      deployed n, in O(n log n) - so the object satisfies inventor-protocol
      section 1's testability axis exactly.
    survival_score: >-
      Survives one step and its survival is BINARY AND COMPUTABLE, which is
      unusual and is the record's main attraction. Either the group element
      preserves the code, in which case the instance survives into the merge, or
      it does not, in which case it produces a related instance in a different
      code that a same-code merge cannot use. There is no gradual dissolution and
      no ambiguity, so the "how far does it survive" question has an exact answer
      per group element and an exact expectation over h.

  null_object_control: >-
    THREE ARMS, EACH WITH A FORCED VALUE DERIVED BEFORE THE RUN, AND EACH ABLE TO
    FAIL.
    NULL-1, THE OBJECT WITH A KNOWN LARGE AUTOMORPHISM GROUP. Run the same
    automorphism search on h = all-ones (whose code is the repetition-like
    degenerate case) and on h = 0. FORCED VALUE: Aut_G is the FULL group G of
    order n(n-1), because sigma_a fixes both vectors coordinatewise. IF THE
    SEARCH DOES NOT FIND THE FULL GROUP THERE, IT IS BLIND AND NO NEGATIVE RESULT
    FROM IT IS REPORTABLE. This is the arm that answers the standing objection to
    every "we searched and found nothing" claim.
    NULL-2, THE CONSTRUCTED WEAK OBJECT. Build h whose support is a union of
    cosets of the subgroup of index 2 in (Z/n)^* - i.e. a quadratic-residue-shaped
    support - so that sigma_a(h) = h for every a in that subgroup BY
    CONSTRUCTION. FORCED VALUE: |Aut_G(C_h)| >= n.(n-1)/2. This arm makes the
    weak class non-empty by construction, so the enumeration in stage 3 has a
    positive control to find, and the empirical rate over random h can be
    compared against a known-nonzero reference rather than against zero.
    NULL-3, THE COUNTING NULL. Compare the closed form of stage 1 against
    EXHAUSTIVE enumeration over all 2^n vectors at n = 11, 13, 19. FORCED VALUE:
    exact agreement, integer for integer. A closed form that misses an exhaustive
    count is wrong, and this arm cannot be passed by a broken implementation.
    COMPARATOR SPREAD IS NONZERO BY CONSTRUCTION: NULL-1 and NULL-2 exhibit both
    ends of the dynamic range of |Aut_G(C_h)| - the full group at one end and the
    predicted cyclic group of order n at the other - so obligation 3 is met with
    both ends exhibited. THE GRADED MIDDLE, WITH AT LEAST THREE INTERIOR POINTS:
    construct h fixed by exactly the subgroup of order d, for d running over
    several divisors of n - 1, and check that the search returns |Aut_G| = n.d
    each time and that the returned value is MONOTONE in d. Two ends do not give a
    direction (KN-TECH-1a5b7e's refinement); the interior points do.
    RULE-ON-THE-NULL-FIRST: the two-branch verdict (OUTCOME-CLOSED versus
    OUTCOME-WEAK-h) is emitted on NULL-1, NULL-2 and the graded points before any
    random-h cell is read. If it emits OUTCOME-CLOSED on NULL-2 - an h
    constructed to be weak - the rule discriminates nothing and is rewritten.

  discriminated_from:
    - >-
      H-HQC-d46460 and IDEA-20260805-db5afa use the SAME ring decomposition
      R = F_2 x F_{2^{n-1}} and the SAME primitivity fact. They apply it to the
      ERROR VECTOR to force w(e') = w_e mod 2, a DFR object with a DFR
      consequence (SPEC Eq. (3)'s binomial model). This record applies it to the
      INSTANCE and its symmetry group, an attack-cost object with an attack-cost
      consequence (the DOOM instance count). The shared ingredient is cited as
      established rather than reclaimed, and neither record's result is affected
      by this one's outcome in either direction.
    - >-
      IDEA-20260813-a46301 (Quantum-DOOM) and IDEA-20260813-c34e09
      (orbit-quotient continuous-time walk) FOLD the cyclic-shift orbit inside a
      quantum walk. Both take the orbit size n as an input. This record computes
      whether n is the right input. A positive OUTCOME-WEAK-h here would change
      their orbit size; a negative would supply the argument they currently
      assume. Neither is a substitute for the other and neither is quantum.
    - >-
      IDEA-20260821-726cc7 (this batch) takes the instance count N as given and
      computes what it COSTS under a memory charge. This record computes what N
      CAN BE from symmetry. They were deliberately kept apart rather than merged
      because their objects, their failure modes and their controls are entirely
      different - one is a cost surface with a monotonicity control, the other is
      a group computation with an automorphism-finder control - and merging them
      would produce a record whose null could not be run on either half.
    - >-
      IDEA-20260805-baa4da's forced inequality M < G_Prange^{3/4} is about the
      memory axis at a fixed instance count. This is about the instance axis at
      no cost model at all. baa4da's DOOM deferral is the specific gap this
      record fills on the symmetry side.
    - >-
      Every DFR-side record in the lane concerns whether decryption fails. This
      concerns how many free instances an attacker gets. They share only the ring.

  citations:
    - ref: H-HQC-d46460
      provenance: internal
      claim: >-
        That HQC's parameter rule "the smallest primitive prime greater than
        n_1 n_2" forces n prime with 2 a primitive root, hence ord_n(2) = n - 1,
        hence X^n - 1 = (X-1).Phi(X) with Phi irreducible of degree n - 1, hence
        R = F_2 x F_{2^{n-1}} with EXACTLY TWO factors; and that primitivity was
        independently checked per level and marked [SESSION-COMPUTED] in that
        record, with the consequence that if it fails at any level the uniqueness
        clause is void.
      verified_by: 'the record''s statement, assumption and heuristic blocks were
        printed with context and read, idea-generator@2026-08-21; the record was
        NOT read in full'
    - ref: 'Sendrier, "Decoding One Out of Many", PQCrypto 2011'
      provenance: recalled
      claim: >-
        That the n cyclic shifts of a quasi-cyclic syndrome supply n instances of
        the same code for free, and that an ISD variant of Stern's type gains
        about sqrt(N) from N such instances. NOT READ THIS SESSION.
      verified_by: null
    - ref: >-
        Classical coding theory: the permutation automorphism group of a cyclic
        code of prime length n over F_2 contains the cyclic shifts and the
        multipliers X -> X^a for gcd(a,n) = 1, and the multiplier subgroup that
        preserves a given cyclic code is determined by the code's defining set
      provenance: recalled
      claim: >-
        The multiplier/Frobenius structure used in stage 0. THIS IS THE
        LOAD-BEARING RECALLED CLAIM OF THE RECORD and it is textbook material I
        did not open. If the recollection is wrong about which maps are ring
        automorphisms of F_2[X]/(X^n - 1), stage 0 is wrong and the whole record
        collapses - which is why stage 2's brute-force enumeration at n = 11, 13,
        19 tests the group action directly rather than trusting the algebra.
      verified_by: null
    - ref: 'IDEA-20260813-a46301'
      provenance: internal
      claim: >-
        That its Quantum-DOOM construction folds "the n cyclic shifts of the
        syndrome of a single quasi-cyclic instance", which "are n distinct
        syndromes of the SAME code", and treats the classical sqrt(n) gain as a
        baseline.
      verified_by: 'matching passages printed with context and read,
        idea-generator@2026-08-21'
    - ref: KN-TECH-1a5b7e (null sufficiency)
      provenance: internal
      claim: >-
        Obligation 3's criterion (a named comparator, a numeric threshold, both
        ends of the dynamic range, and monotonicity across at least three interior
        points), and mode 4's null-first check.
      verified_by: 'read in full, idea-generator@2026-08-21'

  assumptions:
    - >-
      That the coordinate permutations which are ring automorphisms of
      F_2[X]/(X^n - 1) are exactly the multipliers sigma_a, gcd(a,n) = 1. RECALLED
      AND NOT VERIFIED FROM A SOURCE; tested directly by stage 2's enumeration
      rather than assumed.
    - >-
      That the relevant code for the key-recovery instance is C_h and that "same
      code" is the right condition for a DOOM merge. If a merge can absorb
      instances from RELATED codes at some cost, the code-preserving restriction
      is too strong and the ceiling this record computes is not the operative
      one. STATED SO A REVIEWER CAN ATTACK IT, and named in the forward guidance
      as the most promising way the closure could be wrong.
    - >-
      That the fixed-point cycle count for k -> a.k + i mod n with a != 1 is
      1 + (n-1)/ord(a). DERIVED IN THIS RECORD from the fact that the map has a
      unique fixed point and acts on the complement by multiplication by a after
      translation; to be re-derived and checked against enumeration in stage 2,
      never assumed.
    - >-
      That h is drawn uniformly from F_2^n by the seed expander. HQC generates h
      from a seed via a SHAKE-based expander, which under the random-oracle model
      is uniform; if the deployed expander has structure (e.g. rejection or
      alignment artefacts), the exceptional rate could differ from the uniform
      one. Stage 5 states this explicitly and the record does not test the
      expander - IDEA-20260816-967721 is the record that treats a deployed
      sampler as an object with its own null, and the same discipline would be
      needed here before any deployment-facing claim.
    - >-
      That n - 1 can be factored at all three levels. n - 1 is about 2^14.1 to
      2^15.8, so trial division suffices; this is not an assumption so much as an
      observation, recorded because the divisor reduction is what makes the
      computation cheap.

  predictions:
    - metric: >-
        Closed-form exceptional count against exhaustive enumeration at
        n = 11, 13, 19
      direction: different
      minimum_effect: >-
        EXACT AGREEMENT, integer for integer. A hard gate: disagreement means the
        closed form or the group action is wrong and nothing downstream is
        reported.
    - metric: '|Aut_G(C_h)| on NULL-1 (h = all-ones and h = 0)'
      direction: different
      minimum_effect: >-
        EXACTLY n(n-1), the full group. If the search returns less, it is blind
        and no negative result from it is reportable.
    - metric: '|Aut_G(C_h)| on NULL-2 (coset-structured h)'
      direction: higher
      minimum_effect: >-
        At least n(n-1)/2, by construction. This is the positive control the
        enumeration must find.
    - metric: '|Aut_G(C_h)| across the graded ladder of constructed h with stabiliser order d'
      direction: higher
      minimum_effect: >-
        n.d at each of at least three interior d values, MONOTONE in d and
        reported as such.
    - metric: 'Empirical rate of nontrivial Aut_G(C_h) over 10^5 random h at n in {11, 13, 19, 29}'
      direction: lower
      minimum_effect: >-
        Consistent with the closed form. At n = 11 the dominant closed-form term
        gives a rate of order n.2^{-(n-1)/2} which is around 2^{-1.5}, i.e.
        VISIBLE AT SMALL n - so the small-n arm is a genuine two-sided test and
        not a vacuous one. At n = 29 the same expression is around 2^{-9.1},
        still visible at 10^5 samples. THAT THE RATE IS MEASURABLE AT SMALL n AND
        NEGLIGIBLE AT DEPLOYED n IS THE WHOLE REASON THE LADDER EXISTS. All
        figures in this paragraph are hand-derived in this record from the stage-1
        formula, are INDICATIVE ONLY, and must be recomputed in-harness; they are
        not measurements and no evidence record may cite them.
    - metric: 'epsilon(n) at n = 17669, 35851, 57637'
      direction: lower
      minimum_effect: >-
        Pre-registered as BELOW 2^{-1000} at every level, on the structural ground
        that the dominant term is n.2^{-(n-1)/2} and n exceeds 17000. A value
        anywhere near a negligibility threshold would mean the divisor structure
        of n - 1 does something unexpected at these specific n, which would itself
        be the finding and would be reported as such.
    - metric: 'Primitive versus non-primitive n control'
      direction: higher
      minimum_effect: >-
        The exceptional rate must be STRICTLY LARGER for non-primitive n at
        comparable size, because the subgroup <2> mod n is proper there and h
        supported on its cosets is fixed by more multipliers. If the pipeline
        returns the same rate for both, it is reporting the group order and not
        the code, and no conclusion is drawn.

  minimal_test:
    design: >-
      Pure Python integers, no external library, under 250 lines, three phases.
      PHASE A (seconds): derive and evaluate the stage-1 closed form; run NULL-3
      against exhaustive enumeration at n = 11, 13, 19 (2^19 = 524288 vectors, so
      exhaustive is trivial). PHASE B (minutes): the automorphism search at
      n in {11, 13, 19, 29, 37, 53, 59, 61, 67, 83}, with NULL-1, NULL-2 and the
      graded d-ladder run and reported FIRST, then 10^5 random h per n. PHASE C
      (seconds): factor n - 1 at the three deployed levels and evaluate
      epsilon(n); emit the membership test and time it on a synthetic public key.
      Plus the primitive/non-primitive control across phases A and B.
      THE DISCRIMINATION: two branches, declared in advance, both usable.
      OUTCOME-CLOSED gives the closure with its obstruction block and fixes the
      N axis of IDEA-20260821-726cc7 at N = n. OUTCOME-WEAK-h gives a key class
      with a public membership test. There is no "run it and see": the branches
      are defined by a numeric threshold on epsilon(n) declared before phase C.
      DECIDABLE INSIDE AN HOUR OF SINGLE-CORE COMPUTE, including every control.
    controls:
      - >-
        NULL-1: h = all-ones and h = 0, forced value Aut_G = full group of order
        n(n-1). The automorphism-finder's blindness test.
      - >-
        NULL-2: coset-structured h, forced value at least n(n-1)/2. The positive
        control the enumeration must find.
      - >-
        NULL-3: closed form against exhaustive enumeration at n = 11, 13, 19,
        exact integer agreement required.
      - >-
        GRADED LADDER with >= 3 interior points: constructed h with stabiliser of
        order d for several divisors d of n - 1, monotonicity in d reported.
      - >-
        NEARBY-OBJECT CONTROL: primes n where 2 is not primitive, where the
        exceptional rate must be strictly larger. A pipeline reporting the same
        answer for both is reporting the group and not the code.
      - >-
        ORDERING CONTROL: NULL-1, NULL-2, NULL-3 and the graded ladder are
        computed, hash-committed and REPORTED BEFORE any random-h statistic.
      - >-
        FORK CONTROL: the two readings of which code the key-recovery instance
        lives in (the QC code generated by (I | rot(h)), versus its dual /
        parity-check form) computed side by side, since the automorphism group is
        the same for a code and its dual but the instance framing differs and
        picking one silently would be an unexamined choice.
    required_metrics:
      - 'the derived closed form, written out, with its divisor reduction'
      - 'exhaustive exceptional counts at n = 11, 13, 19, and the closed-form values beside them'
      - '|Aut_G(C_h)| for NULL-1, NULL-2 and every graded ladder point, reported first'
      - 'empirical distribution of |Aut_G(C_h)| over 10^5 random h per small n'
      - 'epsilon(n) at n = 17669, 35851, 57637, with the factorisation of each n - 1'
      - 'the primitive/non-primitive comparison at matched sizes'
      - 'the membership test, its cost, and its measured runtime on a synthetic key'
      - 'the branch the frozen rule emits, on the null arms first and then on the real arms'

  falsification_conditions:
    - >-
      NULL-1 does not return the full group. The automorphism finder is blind; no
      negative result from it is reportable, and this is the arm whose absence
      makes every "we searched and found nothing" claim worthless.
    - >-
      NULL-3 disagrees with exhaustive enumeration at any of n = 11, 13, 19. The
      closed form or the group action is wrong; package void.
    - >-
      The graded ladder is not monotone in d. The statistic detects a departure
      but cannot sign one; no directional reading is attached.
    - >-
      The primitive and non-primitive arms return the same exceptional rate. The
      pipeline is reporting the group order rather than the code; no conclusion
      is drawn.
    - >-
      THE EXPECTED OUTCOME, PRE-DECLARED AS USABLE: epsilon(n) is astronomically
      small at all three levels and every random h has |Aut_G(C_h)| = n exactly.
      Then the DOOM instance count is exactly n by symmetry and the record is a
      CLOSURE, written at the inventor-protocol section 4 standard with its
      obstruction block - the quantity epsilon(n), its value with the reading it
      was computed under, the runs it is read from, and its scope - and with
      forward guidance naming what remains open: instances from MULTIPLE
      CIPHERTEXTS (IDEA-20260821-726cc7's Q axis), instances from RELATED codes
      if a merge can absorb them at sublinear cost (the assumption this record
      flags as its most attackable), and the decisional structure of 2-DQCSD-P and
      3-DQCSD-PT, which nobody in this lane has touched. IT DOES NOT DECLARE ANY
      DIRECTION IMPOSSIBLE and it does not close RQ-HQC-001.
    - >-
      THE OTHER OUTCOME: epsilon(n) non-negligible at some level. A weak-h class
      exists with a public membership test. THIS MAY NOT BE STATED UNTIL the
      closed form has passed NULL-3 at three sizes, the automorphism finder has
      passed NULL-1 and NULL-2, and an independent reviewer has re-derived the
      count - because a weak-key claim against an algorithm about to be
      standardised is exactly the claim that must not be made carelessly.
    - >-
      Stage 0's literature search finds the lemma already published. Then the
      record is a citation plus an evaluation at three parameter sets plus a
      membership test, and it says so - which is still the input
      IDEA-20260821-726cc7 needs and is still absent here.

  confounders:
    - >-
      THE RECALLED ALGEBRA IS THE BIGGEST RISK AND IT IS NAMED IN THE CITATIONS.
      The claim that the multipliers are exactly the coordinate-permutation ring
      automorphisms is textbook material I did not open. Stage 2's direct
      enumeration tests the group action rather than the recollection, which is
      why it is a gate and not a sanity check.
    - >-
      WHICH CODE. The key-recovery instance can be framed with the code generated
      by (I | rot(h)) or with its parity-check form, and "the automorphism group"
      differs in presentation though not in essence. The FORK control computes
      both.
    - >-
      SEED-EXPANDER STRUCTURE. epsilon(n) is computed for uniform h. HQC's h comes
      from a SHAKE-based expander, and a structured expander output would change
      the deployed rate. This record does not test the expander and says so; the
      claim is scoped to uniform h.
    - >-
      SMALL-n ARTEFACTS. At n = 11 the exceptional rate is of order 2^{-1.5}, so
      "exceptional" is not exceptional at all there, and the small-n arm tests the
      COUNTING rather than the negligibility. Reading a small-n rate as evidence
      about deployed n would be exactly the toy-to-crypto extrapolation
      KN-FIND-f8c290 and KN-FIND-2a8b7e record.
    - >-
      A SUBGROUP THAT PRESERVES THE CODE SETWISE BUT NOT THE INSTANCE. An
      automorphism could map C_h to itself while mapping the syndrome outside the
      usable set; the enumeration must check the INSTANCE condition
      sigma_a(h) = X^i h and not merely a code isomorphism, and reporting the
      latter as the former would inflate the usable orbit.

  interpretation_limits:
    - >-
      THIS IS A CEILING, NOT A COST. It says how many free same-code instances
      symmetry supplies; it says nothing about how expensive they are to use,
      which is IDEA-20260821-726cc7's question, nor about whether any ISD variant
      realises the gain.
    - >-
      NO EXPONENT IS MOVED AND THE MAGNITUDE IS SMALL. Even the WEAK-h branch
      changes the orbit by a factor at most n - 1 inside a square root, i.e. at
      most about 14 bits at HQC-1 against work factors above 128. Under
      docs/target-result-profile.md C1 this is not a target-class result. Its
      justification as a building block is explicit and is the only justification
      offered.
    - >-
      A cost-model or group computation at crypto parameters is a MODEL claim, not
      crypto-tier evidence. Nothing is executed at HQC's parameters; expressions
      are evaluated at them, and RQ-HQC-001's toy ceiling stands.
    - >-
      Scoped to uniform h and to the two code framings run. Not a statement about
      HQC's seed expander, about quantum orbit folding, or about codes that are
      quasi-cyclic without prime length or without 2 primitive - and stage 4's
      control is precisely what makes that limitation visible rather than
      implicit.
    - >-
      An OUTCOME-CLOSED verdict closes the SYMMETRY route to more instances at the
      tested scope. It does not close the instance question, which has at least
      two other routes named in the forward guidance.

  heuristic_assumptions:
    - id: H1
      statement: >-
        FOR ALL primes n with 2 a primitive root, FOR ALL a in (Z/n)^* with
        a != 1, and FOR ALL i in Z/n, the permutation k -> a.k + i of Z/n has
        exactly one fixed point and all other orbits of size ord_n(a), so its
        cycle count is c(a,i) = 1 + (n-1)/ord_n(a), independently of i.
      rigorous_support: >-
        Not a distributional claim at all - it is elementary group theory, proved
        by translating the unique fixed point to the origin, after which the map
        is multiplication by a and its orbits are cosets of <a> acting on the
        nonzero residues. The proof is given here rather than cited, and the
        reason it is filed as a numbered assumption rather than a lemma is that
        the whole closed form of stage 1 stands or falls on it.
      validation_plan: >-
        SAMPLE: all n(n-1) pairs (a, i) at n in {11, 13, 19, 29, 37}, with cycle
        counts computed by walking the permutation directly and compared against
        1 + (n-1)/ord_n(a) for every pair - an exhaustive check, not a
        statistical one, so agreement is exact or the formula is wrong.
        COMPARISON DISTRIBUTION: not applicable; this is a deterministic identity.
        TAIL CHECK: the extreme case a of order 2 (a = n - 1, the reversal), which
        gives the dominant term c = 1 + (n-1)/2 and therefore drives epsilon(n);
        it is verified separately at every n on the ladder because an error there
        changes the headline by a factor 2^{(n-1)/2}.
        TRANSFER ASSUMPTION: none - the identity is uniform in n and is checked at
        five values before being used at three others.
    - id: H2
      statement: >-
        FOR THE DEPLOYED CLAIM ONLY. h produced by HQC's SHAKE-based seed
        expander is distributed uniformly on F_2^n for the purpose of computing
        P[Stab(h) nontrivial], i.e. the expander is modelled as a random oracle.
      rigorous_support: >-
        None that is rigorous - it is the standard random-oracle modelling of a
        SHAKE-based expander, the same modelling SPEC itself relies on elsewhere.
        The classical statement it imitates is that a fixed-length squeeze of a
        random oracle is uniform.
      validation_plan: >-
        SAMPLE: 10^6 h drawn from the deployed expander at a reduced n where the
        exceptional rate is measurable (n = 11, 13, 19, 29, where H1's closed form
        predicts rates between about 2^{-1.5} and 2^{-9.1}), against 10^6 h drawn
        from a system CSPRNG. COMPARISON DISTRIBUTION: the closed-form rate from
        stage 1, which is a two-sided prediction. TAIL CHECK: the observed
        distribution of |Aut_G(C_h)| across its full support, not merely the
        trivial/nontrivial dichotomy - an expander defect would more plausibly
        show as a shifted support than as a shifted rate. TRANSFER ASSUMPTION,
        STATED PLAINLY: the reduced n are three orders below deployed n and the
        expander's output length differs, so a pass here does NOT validate the
        expander at deployed n; it only fails to falsify it at reduced n, and the
        deployed claim remains scoped to uniform h.

  proof_search_map:
    bottleneck: >-
      The exact step whose removal changes the conclusion is the passage from
      "sigma_a preserves weight" to "sigma_a preserves the code". Every free-
      instance count in the quasi-cyclic literature and in this repository rests
      on that passage being made only for the shifts, and the multiplier part is
      neither used nor excluded. Deciding it is the bottleneck for any statement
      about the instance axis.
    baseline_embedding:
      parameter_slice: >-
        Restricting G to its shift subgroup - i.e. setting a = 1 throughout -
        recovers exactly the standard DOOM instance count N = n. The published
        state of knowledge is therefore the a = 1 boundary case of this record's
        object, which makes this a family extension rather than a new object.
      reproduction_check: >-
        FROZEN FIXTURE: with the multiplier part disabled, the pipeline must
        return |Aut_G(C_h)| = n for every h including NULL-1's h = all-ones,
        because the shifts always preserve C_h. Checked symbolically and on every
        arm.
    observation_collision:
      observable: >-
        The integer |Aut_G(C_h)|, and the branch the frozen rule emits from it.
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IT IS THE REASON THE INSTANCE CONDITION IS CHECKED
        RATHER THAN A CODE ISOMORPHISM. Two distinct situations give the same
        |Aut_G(C_h)| > n: an automorphism that maps C_h to itself AND maps the
        syndrome into the usable set (a genuine extra instance), and one that maps
        C_h to itself but sends the syndrome outside it (no extra instance at
        all). These sit on opposite sides of the claimed conclusion. THE
        SEPARATING CONDITION is testing sigma_a(h) = X^i h at the instance level,
        which is what the enumeration does; a package reporting a code
        automorphism count as an instance count has not separated the preimages.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move from the ring R to its CRT decomposition F_2 x F_{2^{n-1}}, where
          the hypothesis "which weight-preserving maps fix the code" becomes an
          exact condition on a Galois orbit, and the multiplier group and the
          Galois group are identified because 2 is primitive.
        predicted_gain: >-
          Turns a search over a group of order n(n-1) into a closed-form
          fixed-point count with one term per divisor of n - 1 - from about
          5.5 x 10^12 elementary steps at HQC-1 to milliseconds. Separate
          obligations: encoding (the CRT map), completeness (every coordinate
          permutation that is a ring automorphism is a multiplier), soundness (a
          multiplier fixing the code fixes the instance only under the stated
          condition), transfer (the identification of Galois with multiplier needs
          primitivity), and cost-loss (none - the reduction is exact).
      - transform: observable_fiber
        proposed_object: >-
          Hold |Aut_G(C_h)| fixed at its generic value n and vary h to look for an
          intrinsic invariant distinguishing the fibre's members - the record
          predicts there is none, which is exactly the statement that the
          projection is constant and the closure holds.
        predicted_gain: >-
          Converts "we did not find a weak class" into "the fibre is everything",
          which is the difference between a fatigue report and a closure.
    quantifier_order: >-
      FOR ALL levels L in {HQC-1, HQC-3, HQC-5}, THERE EXISTS an exact rational
      epsilon(n_L) such that FOR ALL h outside a set of density at most
      epsilon(n_L), the code-preserving subgroup of G is EXACTLY the cyclic shift
      group of order n. NOTE THE ORDER CAREFULLY: epsilon is allowed to depend on
      the level, and the exceptional SET is allowed to depend on the level, but
      the conclusion for a given h may NOT depend on which a is tried - the
      quantifier over a is inside, universal, and that is what the enumeration
      checks. A statement of the form "for each a there exists h" would be
      vacuous and is not what is claimed.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At HQC's three parameter sets, the density of public keys h whose
        code-preserving symmetry group properly contains the cyclic shifts is at
        most epsilon(n), and for every other h the free same-code instance count
        available to a DOOM-style merge is exactly n." It can NEVER certify that
        no OTHER source of free instances exists, that no attack beats the
        symmetry ceiling, or anything about a merge that absorbs related codes.
      nearby_object_control: >-
        A quasi-cyclic code of prime length where 2 is NOT primitive, where the
        subgroup <2> is proper and the exceptional set is genuinely larger. If the
        method returns the same verdict there, it has not identified the
        load-bearing structure (which is the primitivity rule, not
        quasi-cyclicity) and the closure is not scoped correctly. This control is
        stage 4 and is mandatory.
    proof_obligations:
      - claim: 'The coordinate-permutation ring automorphisms of R are exactly the multipliers'
        responsibility: correctness
      - claim: 'c(a,i) = 1 + (n-1)/ord_n(a) for a != 1'
        responsibility: size
      - claim: 'The closed form reproduces exhaustive counts at n = 11, 13, 19'
        responsibility: baseline
      - claim: 'The automorphism finder finds the full group on NULL-1'
        responsibility: feasibility
      - claim: 'The instance condition, not a code isomorphism, is what is tested'
        responsibility: soundness
      - claim: 'The whole package runs in under an hour on one core'
        responsibility: runtime
      - claim: 'The conclusion is scoped to uniform h and to primitive prime n'
        responsibility: scope
    not_applicable_reason: null

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE IS MOVED, AND THE RECORD SAYS SO IN
      ITS OWN CLAIM. The quantity at stake is at most a factor n - 1 inside a
      square root, i.e. at most about 14 bits at HQC-1 in the weak branch and
      exactly 0 bits in the expected branch, against work factors above 128 bits.
      THE COMPUTATION costs O(n . tau(n-1)) per level after the divisor reduction -
      milliseconds - plus O(sum over small n of 2^n) for the exhaustive gate,
      which is 2^19 at the largest and therefore seconds. Under
      docs/target-result-profile.md checklist item C1 this is NOT target-class,
      and per search heuristic 1 its justification as a REQUIRED BUILDING BLOCK is
      explicit: IDEA-20260821-726cc7's cost surface is parameterised by N, and an
      N that is assumed rather than argued makes that surface an assumption
      dressed as a computation.
    memory_exponent: >-
      O(2^n) bits for the exhaustive gate at n <= 19, i.e. under a megabyte, and
      O(n) for everything else. Stated beside time because
      docs/claims-and-verification.md requires it always.
    best_known: >-
      There is no incumbent in this repository: no record computes an automorphism
      group of any code, and the instance count n is used without argument by
      IDEA-20260813-a46301 and deferred by IDEA-20260805-baa4da. EXTERNALLY the
      honest statement is that this session ran no search aimed at the question
      and that the classical coding-theory literature on automorphism groups of
      cyclic and quasi-cyclic codes is large and old, so the baseline is UNKNOWN
      HERE and establishing it is stage 0.
    hidden_overhead: >-
      Two disclosures. (i) The closed form's dominant term comes from the order-2
      multiplier (the reversal a = n - 1), and if n - 1 has an unusual divisor
      structure at one of the three deployed n the dominant term could move to a
      different divisor - which is why n - 1 is factored in-harness rather than
      assumed to behave typically. (ii) The whole record's algebra rests on a
      RECALLED textbook fact, and the exhaustive gate at three small n is the only
      thing standing between that recollection and a wrong closure.
    tradeoff_note: >-
      Not applicable - no memory-limited search and no parallelisation question.
      The only tradeoff is the exhaustive gate's largest n against its 2^n cost,
      and it is resolved by capping it at n = 19 and using sampling above that,
      with the one-sidedness of the sampled check reported.

  dominated_by: >-
    n/a (no result claimed on any attack axis). Rows checked across all three axes
    inventor-protocol section 5 names. TIME: milliseconds at deployed parameters
    after the divisor reduction; no cheaper route exists in this corpus because no
    route exists at all. MEMORY: under a megabyte. DATA / QUERIES: zero -
    everything is derived or enumerated, nothing is queried. ON THE QUESTION
    ADDRESSED: the incumbent is the unargued convention N = n used by
    IDEA-20260813-a46301 and by the external DOOM literature; this proposal does
    not DOMINATE that convention in the Pareto sense, because a convention has no
    cost triple - it either confirms it with an argument or refutes it, and which
    of those it does is the experiment. Against the EXTERNAL state of the art on
    ANY attack axis: zero delta. No attack, no faster algorithm, no lower cost,
    and in the expected branch no change to any published number at all.
  sota_delta: >-
    No attack; a ceiling and, in the expected branch, a closure. QUANTITATIVELY:
    computed bounds on the free same-code instance count for HQC in this
    repository before, 0 - the number n is used by two records and argued by
    none. After, epsilon(n) at three levels with an exhaustive gate at three
    small n and a public membership test. In the WEAK-h branch the delta would be
    a key class with a runnable test, worth at most about 14 bits of discount at
    HQC-1 and reported with that ceiling attached. In the expected CLOSED branch
    the delta is a closure at the inventor-protocol section 4 standard with a
    named obstruction, an argument and forward guidance - which this program's
