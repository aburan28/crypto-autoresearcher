idea:
  id: IDEA-20261001-ff0049
  question_id: RQ-NGCC-f52138
  goal_id: GOAL-NGCC-6c8a52
  added: '2026-10-01'
  title: >-
    Reproduce or refute the published full-round MoFang collision claim
    (hash-19-1) on the official round-1 submission
  class: mechanism
  claim: >-
    Saarinen, ePrint 2026/2266, credits Tsinghua Hash Lab with full-round
    MoFang collisions (finding hash-19-1) and points to Yuan et al., ePrint
    2026/2152, for a MoFang analysis. This idea asks whether a published
    colliding pair reproduces on the official ICCS round-1 MoFang package,
    hashed by code this program compiles from the submission sources. It
    proposes no new attack and no new colliding pair.
  mechanism: >-
    The published witness, once read from finding hash-19-1 or from ePrint
    2026/2152, is two messages. They count as a collision only when they
    differ as byte strings and a hasher built separately from the witness
    producer returns equal full-round digests. Reduced-round or truncated
    digests do not count.
  novelty_status: unverified
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      MoFang is an NGCC round-1 hash candidate, not an elliptic-curve
      discrete-log instance. A walk of knowledge/ on 2026-10-01 found no
      entry naming MoFang. knowledge/frontiers/ecdlp does not contain it.
    nearest: []
    none_found_after:
      - "walk of knowledge/ for MoFang on 2026-10-01: no file"
      - "https://eprint.iacr.org/2026/2266 names finding hash-19-1; the paper text was the copy supplied with the target request and was not re-executed"
  test_boundary: >-
    Official MoFang zip from the round-1 roster (hash-19), every instance
    the package declares, full rounds only. No claim about a repaired or
    later submission.
  falsification: >-
    For some declared instance, the published message pair hashes to two
    different full-round digests under the separately compiled hasher, and
    the failure is not a build or infrastructure error.
  status: proposed
  proposed_by: coordinator
