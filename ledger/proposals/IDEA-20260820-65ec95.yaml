  novelty_screen:
    method: Screened 28 direct-tree RQ-SQISIGN-001 proposals; persistent search_knowledge was unavailable.
    verdict: Unverified; local distinction is not literature novelty.
  predictions:
    - metric: accepted verifier-stratum residual Cramer V
      direction: higher
      minimum_effect: V >= 0.10 with corrected p < 0.01
    - metric: held-out public-response classifier AUC
      direction: higher
      minimum_effect: AUC >= 0.60 with 95% lower bound above 0.55
    - metric: true-simulator residual
      direction: different
      minimum_effect: remain inside central 95% permutation band
  minimal_test:
    design: >-
      Freeze one step, live coordinate, dead coordinate, and opposite nonzero
      deltas. Compare no fault, zero delta, both live deltas, genuine simulator,
      dead-coordinate fault, and a 1.25-fold planted public-stratum tilt.
    controls:
      - Matched genuine true-simulator null.
      - Zero-delta real-signer null.
      - Nonzero fault on a proven-dead diagnostic coordinate.
      - Opposite-delta replication.
      - Planted 1.25-fold accepted-stratum tilt.
    required_metrics: [rejection_rate, verification_rate, Cramer_V, coordinate_energy, classifier_AUC]
  controls:
    - Explicit rejection accounting in every arm.
    - Plant strength swept from 1.05 through 1.25.
    - Arm labels blinded until features and thresholds are frozen.
    - No time, retries, length, power, cache, or branch observations.
  falsification_conditions:
    - Both nonzero live-coordinate deltas remain in all null bands while planted-positive power is >= 0.90.
    - Dead-coordinate or zero-delta effects equal or exceed live-coordinate effects.
    - Silent rejection filtering, parser imbalance, or simulator miscalibration invalidates the test.
  confounders:
    - Acceptance conditioning itself creates structure if arms are unmatched.
    - The fault may create parser-invalid rather than algebraically altered objects.
    - Coordinate labels can change under representative conventions.
    - Instrumentation can consume randomness.
  interpretation_limits:
    - A public-law tilt is not a certified secret-dependent channel.
    - The result would cover only the fixed step, coordinate, deltas, and implementation.
    - Kani, SQIsign-002, and GOAL-SSI-001 are excluded.
  fault_oracle:
    name: O_coord_fault
    intervention: Add one declared nonzero field element to one named coordinate before a named boundary.
    exposed: Published transcript, explicit rejection, parse result, and standard verification.
    excluded: [time, retry_count, signature_length, secret, power, cache, branch_trace]
  heuristic_assumptions:
    - id: H1
      statement: The named coordinate reaches the normalization/rejection predicate or a labelled public field.
      rigorous_support: Dataflow reachability is exactly inspectable; statistical survival is not guaranteed.
      validation_plan: Verify fixed-input dataflow, then remove internal labels before held-out public testing.
    - id: H2
      statement: Registered public statistics detect a tilt of the declared minimum magnitude.
      rigorous_support: Exact multinomial and permutation calibration supports only the planted model.
      validation_plan: Sweep planted tilt factors and freeze N before fault labels are opened.
  target_complexity:
