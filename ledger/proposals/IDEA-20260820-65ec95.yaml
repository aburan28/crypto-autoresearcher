idea:
  id: IDEA-20260820-65ec95
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Accepted-stratum anisotropy from a localized coordinate fault, provenance-corrected
  class: control
  corrects: IDEA-20260820-95f8c8
  supersedes: IDEA-20260820-95f8c8
  correction_scope: >-
    Preserves the additive single-coordinate fault immediately before a named
    normalization or rejection boundary, explicit rejection accounting, and zero,
    dead-coordinate, and opposite-delta controls. It repairs provenance and removes unsupported GRH wording.
  claim: >-
    For a fixed toy implementation, adding a declared field element to one named
    intermediate coordinate before normalization or rejection can tilt the
    verifier-accepted public transcript strata when that boundary is anisotropic.
    This proposal claims no side channel, recovery, forgery, or SSI result.
  mechanism: >-
    O_coord_fault(s,i,delta) adds delta to coordinate i at step s and then allows
    ordinary normalization, rejection, and verification. Rejection remains an
    outcome. Compare accepted-stratum residuals, response-coordinate ranks, and a
    held-out classifier conditional on public inputs. An anisotropic boundary can
    convert a local perturbation into acceptance-conditioned public bias.
  novelty_status: unverified
  status: proposed
  source_refs:
    - {id: RQ-SQISIGN-001, provenance: internal, verified_by: TASK-20260820-922be8}
    - {id: KN-TECH-057, provenance: internal, verified_by: TASK-20260820-922be8}
