idea:
  id: IDEA-20260801-014
  question_id: RQ-UOV-001
  title: >-
    UOV security-model calibration: measured MinRank/oil-space attack cost
    at toy parameters versus the model's prediction
  class: measurement
  claim: >-
    The plain-UOV security model that three other candidates (MAYO, QR-UOV,
    SNOVA) depend on can be calibrated at toy parameters: the measured
    best-known key-recovery attack cost (MinRank- and oil-space-recovery-
    style attacks) on random toy UOV instances, compared to the model's
    prediction over a range of (m, n, q), either matches the model within a
    stated factor or departs from it. A calibrated model is the shared
    baseline for the three dependent candidates.
  mechanism: >-
    UOV's security rests on the oil-space-recovery and MinRank problem costs;
    the model predicts attack cost as a function of (m, n, q). At toy
    parameters the prediction and the attack are both computable, giving a
    calibration ratio. The calibration curve over (m, n, q) is the deliverable
    that the dependent candidates' analyses can reference.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/literature
      - ledger/proposals
    grep_results:
      - No existing proposal calibrates the plain-UOV security model at toy
        parameters in this program.
    conclusion: >-
      Measurement proposal; novelty unverified against full literature, which
      is the point of the calibration.
  assumptions:
    - Toy (m, n, q) parameters preserve the attack model's scaling direction.
    - The best-known attack at toy sizes is implementable.
  predictions:
    - metric: measured_vs_model_attack_cost_ratio
      direction: different
      minimum_effect: >-
        A ratio outside [0.5, 2] at 3+ parameter cells is a calibration
        departure.
  minimal_test:
    design: >-
      Select a grid of toy (m, n, q) cells; for each, run the best-known
      attack on >= 10 random instances, measure cost, and compare to the
      model's prediction; emit the calibration table and any cells with
      departure.
    controls:
      - Reproduce the model's predictions independently.
      - Null control: random (non-UOV) MQ systems at the same (m, n, q).
    required_metrics:
      - measured attack cost per cell
      - model prediction per cell
      - ratio and significance per cell
  falsification_conditions:
    - Ratios within tolerance across the grid (model calibrated).
    - Departure at 3+ cells (model needs correction; dependent candidates'
      analyses affected).
  confounders:
    - Toy-size artifacts breaking the model's asymptotics.
    - Attack implementation quality differences.
  interpretation_limits:
    - Toy calibration only; no crypto-scale claim about UOV's parameters.
    - Calibration is a baseline, not a break.
  heuristic_assumptions:
    - id: HEUR-UOV-CAL-1
      statement: >-
        The UOV attack model's cost scaling is monotone in (m, n, q), so toy
        calibration cells are directionally informative.
      rigorous_support: >-
        None directly; standard model-scaling assumption, tested by the grid
        trend.
      validation_plan: Check monotonicity of the calibration ratios across
        the grid.
  target_complexity:
    time_exponent: n/a (calibration)
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: null
  sota_delta: >-
    No attack claimed. Deliverable is a calibrated (m, n, q) cost table that
    anchors the three dependent candidates' analyses.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
