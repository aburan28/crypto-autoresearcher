idea:
  id: IDEA-20261016-15a6fc
  question_id: RQ-ENDO-476761
  goal_id: null
  added: '2026-10-16'
  proposed_by: idea-generator
  status: proposed
  approved_by: null
  title: >-
    Route kP through a small-degree F_p-isogenous neighbour: a = -3 gain
    versus conversion on deployed curves (known-scalar cost, not ECDLP)
  class: representation
  claim: >-
    (1) For a deployed prime-order curve E with a not in {-3, 0}, kP =
    phi_hat(k' phi(P)), k' = k/ell mod n, via a rational ell-isogeny (ell <= 13,
    depth <= 2) onto E' with -3/a' a fourth power; modelled one-shot cost with
    conversion charged is lower on some curves, by a few percent. (2) Ascent
    to a crater with |D_K| <= 20 hits zero deployed curves. (3) Isogeny-cycle
    GLV is a re-statement control. No ECDLP or rho cost moves.
  mechanism: >-
    #E is isogeny-invariant, so prime-order E never gains Montgomery or Edwards
    form (4 | #E; availability follows 2-volcano level, IDEA-20260811-fe0934).
    Only a = -3 stays open: (x,y) -> (u^2 x, u^3 y) scales a by u^4. Doubling
    drops from 1M+8S+1*a to 3M+5S; an ell-isogeny costs O(ell) M, paid twice.
    Arm 2: t^2-4p = f^2 D_K, ascend ell-volcanoes for ell | f. Lossy-projection
    test against Sigma = {ell-isogenies, duals}: phi is injective on <P>, so
    nothing is lost; a change of coordinates (coordinate-dependent class).
    The open number is a cost, not an object.
  novelty_status: unverified
  citations:
    - ref: Brier and Joye, AAECC-15, LNCS 2643, pp. 43-50 (2003)
      provenance: recalled
      claim: move to an isogenous curve with faster arithmetic; content unopened
      verified_by: null
    - ref: https://eprint.iacr.org/2005/420
      provenance: retrieved
      claim: Doche-Icart-Kohel, abstract only; [ell] = phi_hat phi, other mechanism
      verified_by: web fetch 2026-10-16
    - ref: https://www.hyperelliptic.org/EFD/g1p/auto-shortw-jacobian-3.html
      provenance: retrieved
      claim: dbl-2007-bl 1M+8S+1*a; dbl-2001-b 3M+5S; add-2007-bl 11M+5S
      verified_by: web fetch 2026-10-16
    - ref: IDEA-20260811-fe0934
      provenance: internal
      claim: model availability is a function of 2-volcano level
      verified_by: ledger/proposals/IDEA-20260811-fe0934.yaml
  assumptions:
    - Short Weierstrass, p > 3, ordinary, ell != n; I = 100 M, width-4 NAF.
    - Two cost columns, both charging the 1*a term of generic doubling - S = 1 M (harness/endosweep/curvesweep.arithmetic) and S = 0.8 M.
  predictions:
    - metric: routed vs direct kP equality, 1000 random scalars per route
      direction: different
      minimum_effect: 1000/1000; one mismatch voids the route
    - metric: modelled net gain g = 1 - C_route/C_direct, 256 bit, projective conversion
      direction: higher
      minimum_effect: g in (0, 15%] at S = 1 M, (0, 12%] at S = 0.8 M, where a hit exists at ell <= 7; g <= 0 with affine conversion
    - metric: gain on P-256 (a = -3) and a = 0 curves (secp256k1, BN254)
      direction: different
      minimum_effect: exactly 0
    - metric: fraction of a not in {-3,0} curves with an a = -3 neighbour at depth 1
      direction: higher
      minimum_effect: 0.4 (1-(1-q)^m, q = 1/gcd(4,p-1), m about 3); none via ell = 2 on odd order
    - metric: deployed curves with ascent to |D_K| <= 20
      direction: lower
      minimum_effect: 0 hits; the D = -3 f^2 control must hit
  minimal_test:
    design: >-
      harness/endosweep/isomodel.py: BFS over ell in {2,3,5,7,11,13}, depth 2,
      from each targets.py curve and the controls. Per node: a'-class, model,
      cost with and without conversion (both S columns; projective, affine).
      Every route checked by kP both ways. Arm 2 from nist.py D_K, f. Modelled
      only; wall clock against tuned direct kP before any speed statement.
    controls:
      - Positive 1, E = E'/<K> by Velu from y^2 = x^3 - 3x + b, a != -3
      - Positive 2, j = 0 curve descended ell^v steps, D = -3 f^2
      - Negative 1, P-256, gain exactly 0
      - Negative 2, prime-order curve with no rational ell <= 13 isogeny
      - Negative 3, a = 0 curves, gain <= 0
    required_metrics: [a'-class, model, C_route, C_direct (both columns), routes verified, neighbour counts vs Kronecker, D_K, f]
  falsification_conditions:
    - No deployed a != -3 curve has an a = -3 neighbour at ell <= 13, depth <= 2; arm 1 rejected in that scope.
    - Every modelled gain <= 0 after conversion in both columns; arm 1 rejected for one-shot kP. Persistent-on-E' reported separately.
    - Any control mismatch is an instrument defect, not a result.
    - Hit fraction outside the binomial 99% band of 1/gcd(4,p-1) refutes H1 at sampled sizes.
    - An ascent hit on a deployed curve refutes the zero-hit prediction.
  confounders:
    - Constant-time stacks use complete formulas (RCB 2016, recalled) with other a = -3 savings.
    - About 20-40 deployed curves, so fractions are descriptive; fixed-base kP out of scope.
  interpretation_limits:
    - Constructive cost only; modelled counts are not timings.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The class of a' in F_p^*/(F_p^*)^4 of a rational ell-neighbour is
        uniform and independent across neighbours: P(-3/a' fourth power) =
        1/gcd(4, p-1).
      rigorous_support: fourth-power density in F_p^*; no theorem for modular-polynomial neighbours
      validation_plan: >-
        Random curves at 32, 64, 128 bit (1e4, 1e4, 1e3), neighbours ell <= 13;
        hit fraction vs 1/gcd(4,p-1), binomial CI, by p mod 4, ell, depth.
        Transfer to 160-521 bit assumed.
    - id: H2
      statement: >-
        For ell not dividing f there are 1 + (D_K/ell) in {0, 2} rational
        ell-neighbours, the sign a fair coin over deployed D_K; none for ell = 2 on odd order.
      rigorous_support: volcano structure, ordinary curves (recalled); E[2](F_p) = 0
      validation_plan: exact kernel-polynomial root count vs Kronecker symbol for every target
    - id: H3
      statement: a projective Velu evaluation costs 2*ell + 10 M, no inversion.
      rigorous_support: Velu has O(ell) terms; the constant is a modelling choice
      validation_plan: counting wrapper on explicit.py at ell = 3, 7, 13, tolerance 30%
  target_complexity:
    time_exponent: unchanged; rho Theta(n^{1/2}), kP O(log n) group operations
    memory_exponent: unchanged, polylogarithmic
    best_known: direct kP on E with the cheapest formulas; rho Theta(n^{1/2})
    hidden_overhead: two conversions c(ell) plus one modular multiplication, all counted
    tradeoff_note: none; independent kP parallelise trivially
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    Arm 1 modelled gain positive: about 0.6 with *a charged, 0.35 without;
    wall-clock win about 0.2. Arm 2 on deployed curves about 0.02.
