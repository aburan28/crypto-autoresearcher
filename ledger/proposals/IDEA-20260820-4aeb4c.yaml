idea:
  id: IDEA-20260820-4aeb4c
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Conditional-independence graph audit across SQIsign public transcript fields
  class: simulator_diagnostic
  claim: >-
    A preregistered conditional-independence graph over public algebraic,
    serializer, challenge, and verifier fields may expose a specific simulator
    factorization mismatch. Graph rejection alone is not leakage evidence and
    does not imply key, ideal, or path recovery.
  mechanism: >-
    Declare a directed acyclic graph whose nodes are only public transcript
    fields and whose edges encode the simulator's asserted conditional
    factorization. For each absent edge, compute a held-out conditional
    dependence statistic using a fixed public-stratum partition. The planted
    positive inserts one marginal-preserving dependence edge between a frozen
    serializer label and challenge label while keeping their individual
    distributions unchanged.
  novelty_status: unverified
  status: proposed
  corrects: IDEA-20260820-a0649e
  supersedes: IDEA-20260820-a0649e
  correction: >-
    Preserves the predecessor's public conditional-independence graph and
    marginal-preserving planted edge. Adds complete verified_by bindings for
    internal sources and deletes unsupported GRH language. KN-TECH-058 is used
    only for its inherited-and-unverified reduction and heuristic caveats.
  source_refs:
    - ref: IDEA-20260820-a0649e
      provenance: internal
      verified_by: TASK-20260820-5f47b5
      use: immutable corrected predecessor
    - ref: KN-TECH-058
      provenance: kb
      verified_by: TASK-20260820-5f47b5
      use: baseline caveats; no reduction is treated as verified
    - ref: RQ-SQISIGN-001
      provenance: internal
      verified_by: TASK-20260820-5f47b5
      use: question scope
  predictions:
    - id: P1
      statement: Under genuine-simulator nulls, familywise rejection across frozen absent-edge tests is at most 0.05 plus Monte Carlo error.
    - id: P2
      statement: A planted conditional mutual information of at least 0.02 bits yields at least 80% power for the designated missing edge.
    - id: P3
      statement: Empirical node marginals in the planted positive remain within total-variation distance 0.02 of their null marginals.
  controls:
    true_simulator_null: Generate fresh declared-simulator transcripts and apply the identical graph, strata, estimator, and correction.
    planted_positive: Insert one serializer-to-challenge dependence of at least 0.02 bits while preserving both public node marginals.
    observation_collision: Map distinct hidden witnesses to identical public node tuples and require identical graph statistics.
    nearby_object: Permute the challenge node within each public parent stratum to destroy the planted edge while retaining all parent and marginal counts.
  falsification_conditions:
    - Familywise null rejection exceeds 0.05 beyond Monte Carlo error.
    - Power against the 0.02-bit planted edge is below 0.80.
    - The graph requires an unobserved or secret-valued node.
    - The planted-positive node marginals move by total variation above 0.02.
  confounders:
    - sparse conditioning strata
    - deterministic serializer relations mistaken for stochastic dependence
    - graph selection after viewing evaluation data
    - finite-sample estimator bias
  interpretation_limits:
    - Rejection identifies failure of one public-field factorization only.
    - Passing does not establish full transcript equivalence.
    - No timing, fault, key-recovery, or GOAL-SSI-001 hard-problem claim follows.
  heuristic_assumptions:
    - Frozen public strata have enough samples for the declared estimator.
    - Node extraction and serializer parsing are deterministic and public.
    - KN-TECH-058 reductions and heuristic assumptions remain inherited and unverified.
  target_complexity:
    time: O(q * e * C_dep)
    memory: O(e * s)
    data: q public transcripts
    scope: e preregistered absent edges over s public strata
  cost_model:
    time: parse q transcripts and evaluate e conditional-dependence tests
    memory: contingency or kernel summaries for e edges and s strata
    data: q independent public transcripts per condition
    preprocessing: freeze graph, node extractors, strata, estimator, and multiplicity correction
    oracle_access: none beyond declared transcript sources
    verification: replay parsing, verify marginals, and recompute every absent-edge statistic
  proof_search_map:
    exact_baseline_reproduction: Enumerate a toy public-field DAG and reproduce exact conditional independences.
    observation_collision_search: Enumerate hidden witnesses with the same public node tuple and check statistic invariance.
    quantifier_order_statement: Freeze DAG and tests before evaluation data are generated.
    method_ceiling: Record that tested conditional independences do not imply equality of full transcript laws.
    nearby_object_control: Within-parent permutation destroys only the designated conditional edge.
  nearest_neighbors:
    - IDEA-20260820-a0649e
    - IDEA-20260820-56f047
  dominated_by: n/a (no result claimed)
  sota_delta:
    metric: claimed SQIsign leakage
    baseline: 0
    proposed: 0
    delta: 0
    units: bits per transcript
    rationale: graph-audit proposal only
  recommended:
    next_test: Toy exact-DAG calibration followed by frozen null, edge-positive, and within-parent permutation tests.
    stopping_rule: Stop at preregistered q and do not add edges or strata after evaluation begins.
    required_artifacts: [graph_specification, node_extractors, strata_definition, raw_public_nodes, seeds, edge_test_report]

