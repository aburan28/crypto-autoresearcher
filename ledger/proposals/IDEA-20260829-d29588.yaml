idea:
  id: IDEA-20260829-d29588
  question_id: RQ-SYMF-5ab172
  title: >-
    Represent a published attack by its author-declared cost CURVE and
    validity domain rather than by the single operating point the paper
    happened to tabulate, and measure how many frontier comparisons that
    re-representation creates, overturns, or exposes as transcription defects
  class: representation
  claim: >-
    A published symmetric-cryptanalysis result is generically a FAMILY of
    attacks parameterised by a constraint the author chose a point on (data
    available, memory budget, number of related keys, precomputation charged
    or not), and the committed frontier ledger stores only the chosen point.
    Re-representing a row as the triple (author-declared cost function C over
    a declared parameter, author-declared validity domain D, author's chosen
    point x0 in D) will, on a declared sample of at least 6 rows drawn from
    families whose primary sources state a parameterised complexity, produce
    three measurable effects. (Q1) At least 3 ordered pairs that point-form
    declares incomparable become comparable, because their curves overlap on a
    nonempty common domain. (Q2) At least one currently asserted or
    currently-null dominance relation changes verdict when the candidate
    dominated row's curve is evaluated at the dominator's constraint rather
    than at its own. (Q3) SELF-CONSISTENCY AS A TRANSCRIPTION DETECTOR - each
    reconstructed curve is over-determined by the author's own reported
    point(s), so evaluating C at x0 must reproduce the tabulated cost within a
    precommitted 0.1-bit residual; a row whose tabulated value does not lie on
    its own source's formula is a transcription or convention defect, and a
    value accidentally taken from a different row of the same table will
    generically miss the curve by many bits. The claim is that this check is
    DECISIVE where a point-form ledger is silent - point-form has one number
    and no way to contradict itself.
  mechanism: >-
    TRACKED OBJECT. The object followed through the computation is the
    author-declared cost FUNCTION together with its declared validity domain -
    C: D -> (time, data, memory, preprocessing, queries, success probability),
    not a point in the codomain. One-step propagation is defined and
    measurable - dominance between two rows becomes pointwise comparison of
    two functions restricted to D1 intersect D2, which is computable
    symbolically when both are closed-form and numerically on a declared
    sampling grid otherwise.
    LOSSY-PROJECTION TEST (algebraic, no compute), AND THE POINT OF THE
    PROPOSAL. The projection paper -> (C, D, x0) is strictly lossy - it
    discards the trail, the key-schedule structure, the proof, the
    implementation, and every mechanism detail; infinitely many attacks map to
    one curve. The retained part propagates deterministically under the
    dominance operation because curve dominance is defined pointwise on the
    intersected domain. So the object PASSES. Now apply the same test to the
    incumbent object, the point-form row - the further projection (C, D, x0)
    -> C(x0) discards D. That discard is NOT compatible with the operation the
    instrument performs - dominance compares two rows, and once D is gone
    there is no way to know whether the two tabulated numbers were taken under
    the same constraint, so the retained part does NOT propagate
    deterministically under dominance. THE INCUMBENT REPRESENTATION FAILS THE
    SECOND HALF OF THE LOSSY-PROJECTION TEST. That is an algebraic argument,
    it costs no compute, and it is the mechanism this proposal rests on;
    everything downstream is measurement of how much it matters on real rows.
    WHY THE PROGRAM'S OWN RECORD SAYS THIS IS LIVE. The red-team review of
    batch 1 found that "Two-related-key 12/13-round AES-256 TRADEOFFS were
    omitted" (EV-SYMF-d46055, J3) - a tradeoff is a curve, and it was omitted
    precisely because the schema has no slot for one. The same review found
    that the full AES-256 four-related-key row omitted source-reported memory
    2^77 to 2^77.5 - an INTERVAL, which is a curve's shadow reported as a
    range and stored as nothing. And O-SYMF-4 records RIPEMD-160 at 42 of 80
    steps with expected 2^47.4 versus measured runs normalised to about 2^41.9
    and 2^43.9 - three numbers for one result, which point-form must either
    collapse or split into incomparable rows.
    WHY THE OVER-DETERMINATION CATCHES TRANSCRIPTION ERRORS. In point form a
    tabulated exponent has no internal check - any digit string parses. In
    curve form the tabulated value must satisfy C(x0) = value, an equation the
    paper itself supplies. A digit transposition (61.2 -> 16.2) or a value
    borrowed from an adjacent table row will generically violate it by many
    bits, whereas a genuine value satisfies it to rounding. The 0.1-bit
    residual threshold is precommitted so that the check cannot be tuned after
    seeing the residuals.
  tracked_object: >-
    The author-declared cost function with its declared validity domain and
    the author's chosen operating point, propagated by pointwise comparison on
    intersected domains.
  lossy_projection_test: >-
    PASSES for the curve object (strictly lossy in mechanism; deterministic
    under pointwise dominance on the intersected domain). EXPLICITLY FAILS for
    the incumbent point object - dropping the validity domain discards
    information the dominance operation consumes, so point-form dominance is
    not well defined across rows reported under different constraints. This
    asymmetry is the proposal's core argument and is checkable without any
    experiment.
  novelty_status: unverified
  citations:
    - ref: EV-SYMF-d46055
      provenance: internal
      claim: >-
        Review finding J3 - "Two-related-key 12/13-round AES-256 tradeoffs
        were omitted" and "The now-retrievable SHA-2 paper supplies missing
        47-step SHA-256 and 51-step SHA-512 cost vectors". Review finding J2 -
        "The full AES-256 four-related-key row omits source-reported memory
        2^77 to 2^77.5" and "SHA-1 chosen-prefix rows omit source-explicit
        storage, RAM, graph construction, and manual-preparation costs".
        Observation O-SYMF-4 - RIPEMD-160 ePrint 2026/1744 is 42-of-80 steps,
        expected 2^47.4, with measured 560-core runs normalised to about
        2^41.9 and 2^43.9 reduced compression calls.
      verified_by: >-
        idea-generator subagent, 2026-08-29, Read tool, full record read
        (149 lines).
    - ref: knowledge/frontiers/symmetric-frontier-schema.yaml
      provenance: internal
      claim: >-
        The costs block of required_row_fields is [time, data, memory,
        preprocessing, queries, success_probability] - six SCALAR slots with
        no parameter, no validity domain, and no function. dominance_rules
        require comparing rows only when every dominance_domain_key field is
        identical and forbid inferring a favourable ordering from
        null/qualitative/compound/incompatible values.
      verified_by: >-
        idea-generator subagent, 2026-08-29, Read tool, full file read
        (137 lines).
    - ref: knowledge/frontiers/symmetric-cryptanalysis.yaml
      provenance: internal
      claim: >-
        Cost entries are stored as {value, unit, null_reason} triples with a
        single scalar value - for example row LEGACY-SHA1-IP-COLLISION-THEORY
        stores time value 2^61.2 with data, memory, preprocessing and
        success_probability all null_reason not_stated_by_source. Confirms
        there is no representational slot for a parameterised cost.
      verified_by: >-
        idea-generator subagent, 2026-08-29, Read tool, PARTIAL READ - header
        blocks and the first two canonical rows read in full (lines 1-160);
        the remaining canonical and baseline rows were NOT read this session.
    - ref: RQ-SYMF-5ab172
      provenance: internal
      claim: >-
        cost_axes are [time, data, memory, preprocessing, queries,
        success_probability]; constraint that unknown or unstated costs remain
        explicit nulls and prevent a dominance claim where the missing axis
        matters; no cryptanalytic search or attack execution is authorized.
      verified_by: >-
        idea-generator subagent, 2026-08-29, Read tool, full record read
        (47 lines).
    - ref: "IACR ePrint 2024/1447 (source of the omitted two-related-key 12/13-round AES-256 tradeoffs, per EV-SYMF-d46055 citations block, retrieved under TASK-20260825-9eda3a)"
      provenance: recalled
      claim: >-
        Relied on as the expected supplier of at least one explicit
        parameterised tradeoff (data/time/memory) for reduced-round AES-256
        under two related keys. The existence and provenance of this source
        are internal-verified via EV-SYMF-d46055; its CONTENT is not read by
        this subagent.
      verified_by: null
      note: >-
        NOT READ THIS SESSION by this subagent. EV-SYMF-d46055 records it as
        retrieved and verified by TASK-20260825-9eda3a with the claim
        "Omitted 12/13-round AES-256 two-related-key tradeoffs requiring a
        successor". Any curve reconstructed from it must be extracted by the
        executing task directly from the source with an exact locator.
    - ref: "van Oorschot and Wiener, parallel collision search - time approximately sqrt(N^3/w) for memory w"
      provenance: recalled
      claim: >-
        The canonical example of a cryptanalytic cost stated natively as a
        CURVE over a memory parameter and used at many points on that curve,
        supporting the premise that authors do state parameterised costs when
        the structure has one.
      verified_by: null
    - ref: docs/target-result-profile.md
      provenance: internal
      claim: >-
        Section A8 and Part D require time-memory tradeoffs and
        parallelization behaviour in a concrete-cost table, and cite the van
        Oorschot-Wiener interpolation as the exemplar's own tradeoff
        statement - i.e. the program's own quality bar already demands
        curve-form reporting for new results while its frontier ledger stores
        only points for published ones.
      verified_by: >-
        idea-generator subagent, 2026-08-29, Read tool, full file read
        (397 lines).
  assumptions:
    - >-
      A curve is admitted ONLY when the primary source states it - as a
      formula, an explicit tradeoff table with at least two points, or a
      stated parameter range. A curve fitted by this program to a single
      published point is forbidden and is recorded as "no curve recoverable".
    - >-
      The validity domain D is taken from the source's own stated range. Where
      no range is stated, D is the singleton {x0} and the row REMAINS
      point-form; the instrument never extrapolates a formula outside its
      declared range.
    - >-
      The instrument writes a derived overlay. It never edits a committed row,
      never flips a committed is_frontier value in place, and never promotes a
      curve-derived comparison into canonical dominance without Coordinator
      review.
    - >-
      No cryptanalytic search, attack execution, or reproduction occurs; per
      RQ-SYMF-5ab172 none is authorized. Evaluating an author's own formula is
      arithmetic on a published claim, not verification of it.
    - >-
      The MD5 collision-path content firewall of GOAL-MD5-001 binds every
      retrieval route used to extract a curve, exactly as it binds this goal.
  proof_search_map:
    bottleneck: >-
      Comparing two rows whose reported operating points sit at different
      constraints (different data budgets, memory budgets, related-key counts,
      or preprocessing conventions). Under the committed schema this is
      resolved by refusal, so every such pair contributes zero comparative
      information; removing this bottleneck is the only thing that changes the
      frontier's content without acquiring new literature.
    baseline_embedding:
      parameter_slice: >-
        Collapse every validity domain to the singleton {x0}. The instrument
        then compares exactly the tabulated points and reduces precisely to
        the committed point-form dominance.
      reproduction_check: >-
        Frozen fixture - with all domains collapsed to singletons, the
        recomputed dominance edges and is_frontier flags over the 21 canonical
        and 9 verified-baseline rows must equal the committed values element
        for element (21 admitted_partial_frontier, 9
        admitted_verified_baseline_frontier_unresolved). Any mismatch halts
        the experiment before any curve is used.
    observation_collision:
      observable: >-
        The reconstructed cost curve C restricted to the overlapping domain.
      distinct_preimage_search: >-
        COLLISION IDENTIFIED, WITH A SEPARATING CONDITION. Two attacks can
        share an identical time-versus-memory curve over the whole overlap
        while differing in MEMORY ACCESS PATTERN - one doing sequential
        streaming over a table, the other doing random access - so that their
        true full cost, once memory access and interconnect are charged,
        differs substantially even though the observable is identical. Curve
        dominance would then launder a cache-hostile attack into dominating a
        streaming one. SEPARATING CONDITION, which is a concrete schema
        recommendation rather than a caveat - the memory axis must carry an
        access-pattern qualifier (sequential / random / negligible / unstated)
        and curve dominance must refuse to fire across differing qualifiers,
        exactly as the committed anti_laundering_rules already refuse across
        quantum and classical. A second collision to hunt during execution -
        two DIFFERENT source formulas that agree on the sampled grid but
        diverge between grid points; mitigated by symbolic comparison wherever
        both formulas are closed-form, and by reporting the grid resolution
        whenever they are not.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the six scalar cost slots with (function, declared domain,
          declared point) triples, so that "comparable" becomes "domains
          intersect" and "dominates" becomes a universally quantified
          pointwise inequality on the intersection.
        predicted_gain: >-
          MODELED, NOT MEASURED. At least 3 new comparable pairs and at least
          1 changed verdict on the declared 6-row sample. Encoding obligation
          - the triple must round-trip to the committed point form.
          Soundness obligation - no comparison may fire outside the declared
          domain. Transfer obligation - curve-derived comparisons are labelled
          as such and never silently merged with point-form ones. Cost-loss
          obligation - the extra representational cost is one formula and one
          interval per row, recorded with locators.
      - transform: boundary_lift
        proposed_object: >-
          Treat the point-form ledger as the boundary case (domain = a point)
          of the curve-form family and prove a strict inward improvement -
          curve form admits every comparison point form admits, plus at least
          one more.
        predicted_gain: >-
          MODELED, NOT MEASURED. Strictness is the falsifiable content - if
          the curve form admits exactly the same comparisons as point form on
          this sample, the lift is not strict here and the proposal's Q1
          fails, which is a clean negative and is reported as such.
    quantifier_order: >-
      CURVE DOMINANCE IS CLAIMED AS - row1 dominates row2 iff FOR ALL x in
      D1 intersect D2, C1(x) is no worse than C2(x) on every charged axis, AND
      THERE EXISTS x in D1 intersect D2 with C1(x) strictly better on at least
      one axis. THE DEFECT THIS EXPOSES - a point-form comparison silently
      asserts only the existential half ("there exists a constraint, namely
      the one each author happened to pick, at which the numbers order this
      way"), which is cherry-picking with the quantifier hidden by the
      representation. Making the quantifier explicit is most of the
      contribution. NOT CLAIMED - that the universal half holds outside
      D1 intersect D2, or that either curve is valid outside its declared
      domain.
    method_ceiling:
      strongest_certifiable_claim: >-
        For a named pair of rows whose sources state parameterised costs with
        overlapping declared domains, that one row's declared cost function is
        no worse on every charged axis at every point of the overlap and
        strictly better somewhere - together with the residual of each curve
        against its own author's reported point. The method can NEVER certify
        that either published formula is correct, that the attacks work, that
        either curve is valid outside its declared domain, or that a curve
        with a missing axis (null memory, null preprocessing) dominates one
        that charges that axis.
      nearby_object_control: >-
        Evaluate a reconstructed curve ONE STEP OUTSIDE its declared domain -
        for example a two-related-key AES-256 formula evaluated at a data
        budget below the number of chosen plaintexts the related-key setting
        requires, or a memory-parameterised collision formula at w below one
        table entry. The conclusion demonstrably fails there (the attack does
        not exist at that parameter). A method that reports a dominance verdict
        on such a point has not identified the load-bearing structure and its
        domain handling is broken; this control must be run and must return
        "outside domain, no verdict".
    proof_obligations:
      - claim: >-
          Domain-collapsed reconstruction reproduces the committed point-form
          dominance edges and is_frontier flags exactly.
        responsibility: baseline
      - claim: >-
          Every admitted curve carries a primary-source locator and a quoted
          formula or tradeoff table; no curve is fitted.
        responsibility: interface
      - claim: >-
          Every admitted curve satisfies C(x0) = tabulated value within 0.1
          bits, or is reported as a self-consistency failure and excluded from
          comparison.
        responsibility: correctness
      - claim: >-
          Curve dominance fires only on the intersected declared domain and
          only when the memory access-pattern qualifiers agree.
        responsibility: strictness
      - claim: >-
          Symbolic comparison is used wherever both formulas are closed-form;
          where a numeric grid is used, its resolution is reported with every
          verdict.
        responsibility: correctness
      - claim: >-
          All conclusions scoped to the declared 6-row sample, the sources
          actually read, and the committed snapshot.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: >-
        Q1 - number of ordered row pairs that are incomparable under
        point-form dominance but comparable under curve-form dominance on a
        nonempty intersected declared domain, over the declared sample of at
        least 6 rows
      direction: higher
      minimum_effect: >-
        at least 3 new comparable pairs. Zero new comparable pairs falsifies
        the strictness half of the boundary lift on this sample.
    - metric: >-
        Q2 - number of dominance verdicts that CHANGE (null to resolved, or
        resolved in the opposite direction) when the candidate dominated row's
        curve is evaluated at the dominator's constraint rather than at its
        own
      direction: different
      minimum_effect: >-
        at least 1 changed verdict. Zero changed verdicts is informative and
        is reported as such - it would mean the reported operating points
        happen to be constraint-aligned on this sample, so point-form was not
        misleading here.
    - metric: >-
        Q3 - number of rows in the sample whose tabulated cost fails the
        self-consistency check C(x0) = tabulated value within 0.1 bits
      direction: different
      minimum_effect: >-
        Two-sided and both sides informative. At least 1 failure identifies a
        concrete transcription or convention defect in the committed ledger
        and demonstrates over-determination as a working detector; 0 failures
        across all reconstructed curves means the sampled rows are internally
        consistent at 0.1-bit resolution and the detector had no yield on this
        sample - which bounds, but does not establish, the ledger's
        transcription quality.
    - metric: >-
        Q4 - fraction of the sampled rows for which NO curve is recoverable
        from the primary source (no formula, no multi-point tradeoff table, no
        stated parameter range)
      direction: higher
      minimum_effect: >-
        at least 0.30. A high value is the named obstruction - the literature
        reports points, not curves, so comparability cannot be repaired by
        re-representation alone and must be repaired by re-derivation, which
        is a different and much more expensive research programme. A value
        below 0.10 means curves are routinely available and the committed
        schema is discarding them.
  minimal_test:
    design: >-
      STEP 0 - run the domain-collapsed frozen fixture against the committed
      canonical compilation; halt on mismatch. STEP 1 - declare the row sample
      BEFORE reading any source, from families the program's own review
      already flagged as tradeoff-bearing - the two-related-key 12/13-round
      AES-256 rows (IACR ePrint 2024/1447), the 47-step SHA-256 and 51-step
      SHA-512 cost vectors from the SHA-2 source named in EV-SYMF-d46055 J3,
      the SHA-1 chosen-prefix rows (graph construction and storage traded
      against per-collision cost, USENIX Security 2020), the full AES-256
      four-related-key row with its 2^77 to 2^77.5 memory interval, and the
      RIPEMD-160 42/80-step row with its expected-versus-measured triple.
      STEP 2 - for each, extract verbatim any stated formula, tradeoff table,
      or parameter range with an exact locator; where none exists, record "no
      curve recoverable" and keep the row point-form. STEP 3 - run the
      self-consistency check for every reconstructed curve at the author's own
      point(s); exclude failures from comparison and report them as candidate
      defects. STEP 4 - compute curve dominance on intersected domains,
      symbolically where possible, and diff against the committed point-form
      verdicts. STEP 5 - run both controls (out-of-domain evaluation must
      return "no verdict"; access-pattern mismatch must refuse). Report Q1 to
      Q4 whatever they are; a run in which no curve is recoverable is a
      complete result.
    controls:
      - >-
        Domain-collapsed baseline (STEP 0) as a frozen regression fixture
        against the committed 21/9 dispositions - can fail, and halts the run.
      - >-
        Out-of-domain control - every reconstructed curve is evaluated at a
        point outside its declared range and the instrument must return "no
        verdict" rather than a number.
      - >-
        Access-pattern control - a synthetic pair of curves identical on the
        overlap but with differing memory access-pattern qualifiers; the
        instrument must refuse to order them.
      - >-
        Blind re-extraction control - a second reader independently extracts
        the formula and domain for at least 3 of the sampled rows from the
        same locators; disagreement in the extracted formula is reported and
        blocks use of that curve. This is the control that catches the failure
        mode the question was written about, an extracted value that came from
        the wrong row.
      - >-
        Point-form parity check - every curve-derived comparison is also
        reported in point form, so a reader can see exactly which verdicts are
        new and which are inherited.
    required_metrics:
      - "Q1 new comparable pairs, listed with both rows and the intersected domain"
      - "Q2 changed verdicts, each with the old point-form verdict, the new curve verdict, and the constraint at which the change occurs"
      - "Q3 self-consistency residual in bits for every reconstructed curve, with the 0.1-bit threshold applied and failures itemised"
      - "Q4 fraction of sampled rows with no recoverable curve, with the search boundary per row"
      - "per-curve source locator and verbatim quoted formula or tradeoff table"
      - "blind re-extraction agreement on at least 3 rows"
      - "out-of-domain control outcome (must be 'no verdict') and access-pattern control outcome (must be 'refuse')"
      - "comparison mode per verdict (symbolic or numeric) and grid resolution where numeric"
  falsification_conditions:
    - >-
      STEP 0 fixture fails - the domain-collapsed instrument does not
      reproduce the committed point-form dispositions. Run halts, discrepancy
      reported, numeric claims withdrawn.
    - >-
      Q1 = 0 - curve form admits no comparison point form does not; the
      boundary lift is not strict on this sample and the representational
      claim fails here.
    - >-
      Q4 at or above 0.80 - almost no source states a curve; the named
      obstruction is "the published record is point-form and re-representation
      cannot recover comparability", with forward guidance toward
      re-derivation of cost formulas from published attack descriptions, a
      separate and much larger programme.
    - >-
      Q3 = 0 together with Q1 = 0 - curves exist, are internally consistent,
      and change nothing; point-form was adequate for this sample and the
      proposal's practical value on the current ledger is nil.
    - >-
      Blind re-extraction disagrees on a formula for any sampled row - the
      extraction step is not reproducible and every number derived from that
      row is withdrawn.
    - >-
      The out-of-domain or access-pattern control returns a verdict instead of
      refusing - instrument failure; all curve-derived verdicts from that run
      are void.
  confounders:
    - >-
      Extraction bias. An analyst who expects a tradeoff can read one into a
      sentence that does not state one. Mitigated by requiring a verbatim
      quotation with a locator for every admitted curve, by the blind
      re-extraction control, and by the standing prohibition on fitting.
    - >-
      Domain inflation. Stating a wider validity range than the source
      supports manufactures overlaps and hence comparisons. Mitigated by
      recording the domain as a quotation and by the out-of-domain control.
    - >-
      Grid artefacts. Two curves that cross between sampled points can be
      mis-ordered by a numeric comparison. Mitigated by symbolic comparison
      where both are closed-form and by reporting grid resolution otherwise;
      an unresolved crossing is reported as "incomparable", never rounded away.
    - >-
      Missing-axis asymmetry. A curve with null memory can appear to dominate
      one that charges memory, which is exactly the defect the red team found
      in point form (omitted 2^64 for full MD4, omitted 2^77 to 2^77.5 for
      AES-256). The committed null-handling rule must be applied unchanged to
      curves, and this must be verified rather than assumed.
    - >-
      Expected-versus-measured conflation. The RIPEMD-160 row carries an
      expected cost and two normalised measured costs; treating these as three
      points of one curve would violate the committed rule that author-reported
      complexity and measured expenditure remain separate result kinds. They
      must be kept as separate objects, and this row is included in the sample
      partly to test that the instrument does keep them separate.
  interpretation_limits:
    - >-
      Scoped to the declared row sample, the primary sources actually read
      with locators recorded, and the committed snapshot commit
      5fc23783da8a2e62e2b3ab8728e47c48958ce02f.
    - >-
      Evaluating an author's formula is arithmetic on a published claim. It
      confirms nothing about whether the attack works, and a curve-derived
      dominance is a statement about two published claims, not about two
      attacks.
    - >-
      Curve-derived comparisons are never merged into canonical dominance
      without Coordinator review; the deliverable is a labelled overlay.
    - >-
      A self-consistency failure localises a defect between the source and the
      ledger row; it does not by itself say which of the two is wrong, and the
      report must say so.
    - >-
      No claim is made that curve form is the right representation in general -
      only that on this sample it does or does not change measurable outcomes.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Validity of a stated formula across its stated range.) For a primary
        source that states a cost formula C together with a parameter range D,
        C is valid at every x in D and not merely at the author's tabulated
        point x0 - formally, FOR ALL x in D, the cost of the described attack
        instantiated at x equals C(x) up to the source's own stated precision.
      rigorous_support: >-
        Not proved here, and it is a genuine assumption rather than a
        formality, because authors routinely derive a formula under
        simplifying conditions that hold only near the parameters they
        instantiate. The rigorous ingredient available is that such formulas
        are DERIVED rather than fitted, and that the classical
        time-memory-tradeoff statements this imitates - the van
        Oorschot-Wiener parallel-collision-search interpolation
        time approximately sqrt(N^3/w), used across a wide range of w, and the
        exemplar profile's own requirement that a new result state its
        tradeoff curve - are used in exactly this way throughout the
        literature.
      validation_plan: >-
        WHAT TO SAMPLE - every reconstructed curve in the declared sample,
        evaluated at every point the source itself tabulates (not only x0).
        SCALE - complete enumeration; sources that tabulate two or more points
        give two or more independent consistency equations per curve and are
        preferred in sample selection for exactly that reason. SHORTCUT USED
        TO REACH SCALE - none needed; this is arithmetic on published tables,
        which is why the validation is cheap. PREDICTED DISTRIBUTION -
        residuals concentrated at 0, all within the precommitted 0.1-bit
        threshold, with dispersion attributable only to the source's stated
        rounding. COMPARISON - report the empirical residual distribution
        against the 0.1-bit threshold; a systematic nonzero offset across a
        source's points indicates a convention mismatch rather than a
        transcription error and is reported as a distinct diagnosis. TAIL
        CHECK - the single largest residual and the row carrying it, reported
        explicitly, since a transposed digit is a tail event invisible in a
        median. TRANSFER ASSUMPTION, STATED - consistency at the author's
        tabulated points supports validity BETWEEN them by interpolation only,
        never outside D, and never for a formula with a single tabulated
        point, where the check is vacuous and must be reported as vacuous.
