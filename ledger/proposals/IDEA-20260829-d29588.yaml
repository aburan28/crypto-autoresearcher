    hidden_overhead: >-
      The o(1) is human extraction and it dominates by orders of magnitude.
      Locating a formula and its stated range in a paper, with a verbatim
      quotation and locator, is tens of minutes per row and does not shrink
      with better code; the blind re-extraction control doubles it on the rows
