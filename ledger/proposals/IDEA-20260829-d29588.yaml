    time_exponent: >-
      NO CRYPTANALYTIC EXPONENT IS CLAIMED OR MOVED. Instrument cost - curve
      dominance over P rows on A = 6 axes at D sampled domain points is
      O(P^2 * A * D); at P = 10 and D = 64 that is about 1.7e4 evaluations,
      milliseconds. Symbolic comparison of closed-form expressions is O(P^2)
      calls to a small computer-algebra routine. Self-consistency checking is
      O(P) formula evaluations.
    memory_exponent: >-
      O(P * D) stored evaluations - kilobytes. No memory pressure and no
      time-memory tradeoff in the computation itself.
    best_known: >-
      The incumbent representation is the committed six-scalar cost block,
