idea:
  id: IDEA-20260809-a985a1
  question_id: RQ-MLKEM-002
  added: '2026-08-09'
  title: GOAL-MLKEM-002 was completed with its discriminating criterion resolved into a third
    outcome class -- neither rival world was reached, the instrument was proven adequate at the
    exact moment its population turned out to be empty, and nobody has asked whether the emptiness
    is a property of the search or of the ecosystem
  class: measurement
  claim: 'GOAL-MLKEM-002 criterion 1 requires a repaired hardened gate that ''reaches a unique
    outcome class under frozen precedence in which both generator_hardening_insufficient and isolated_to_audited_commits
    are reachable worlds''. Across BATCH-003 and BATCH-004 the official class was first synthetic_control_inadequate
    (DEC-20260730-005, red team OBJ-RT006-001/002: the INTERPOSE_COMPARE path is a probe-local
    tautology) and then second_impl_unavailable (DEC-20260730-006, after GNU ld --wrap on linux/amd64
    was admitted as an adequacy repair) -- the strict fixed-bound neighborhood is EMPTY and NEITHER
    named world was distinguished. DEC-20260731-001 closes the goal recording criterion_1_adequacy_gate
    as ''addressed_in_scope_per_DEC-20260730-006'' rather than met, and lists among limitations
    ''Strict fixed-bound neighborhood remains empty''. Criterion 2 does admit an infrastructure-unavailability
    branch so its disposition is within contract; criterion 1''s does not. So the isolation-versus-systemic
    question the whole two-goal conformance line was built to ask has never been answered and
    no record owns it. The instrument was PROVEN ADEQUATE (--wrap works, red team cleared OBJ-RT007-001/002)
    at the exact moment the population it was to be pointed at turned out to be empty -- a good
    instrument with no subject -- and closure followed. Nothing frames the population itself:
    which shipped ML-KEM implementations actually use fixed-bound hand-written vector comparison
    tails, over what corpus, and whether the empty neighborhood is a property of the search or
    of the ecosystem. That is a different axis (population census) on the same object as the axis
    studied (instrument adequacy).'
  mechanism: 'MAKE THE POPULATION THE TRACKED OBJECT, NOT THE INSTRUMENT. Enumerate ML-KEM implementations
    reachable from source (PQClean, liboqs, mlkem-native, the reference FIPS 203 code, and any
    vendor forks obtainable here -- the source-gate measurement in REVIEW-UNADDRESSED-20260807
    section 5 shows most sources download), classify each comparison routine by tail structure
    (fixed-bound hand-written vector, compiler-generated, memcmp-family), and report the count
    in the strict fixed-bound class WITH THE EXACT ENUMERATION BOUNDARY stated. NULL OBJECT OF
    THE RIGHT SHAPE BEFORE BELIEF, which the closed goal never had: run the same classifier over
    a set of non-PQC C comparison routines and check it does not report the strict class everywhere
    or nowhere. If the count is genuinely zero, that is a publishable scoping statement about
    the ecosystem and it retires the criterion honestly; if it is not zero, the --wrap instrument
    that already works and is already red-team-cleared has a subject and criterion 1 becomes answerable
    for the first time.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - 'The lane''s discipline was scrupulous about not overclaiming -- DEC-20260731-001 forbids
      paraphrasing EV-MLKEM-008/009/010 as H-MLKEM-004 support -- and that same care meant the
      empty result was recorded as a limitation rather than promoted into a question; it performs
      only the ledger transition and explicitly changes no research disposition. The preference
      order for finding a second implementation was exhausted inside one batch under maximum_batches
      = 4, so the emptiness reads as a budget fact rather than an ecosystem fact and nobody tested
      which it is. Verified: second_impl_unavailable appears across goal, hypothesis, handoff,
      decision and evidence records inside this one lane plus four ML-KEM proposals, none of which
      proposes a census of the population, and a title scan of all 459 for an implementation census,
      fixed-bound tails, comparison routines or --wrap returns ZERO. No successor goal exists.'
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: the differential gate itself,
      which GOAL-MLKEM-002 completed and proved adequate. The object is the POPULATION the gate
      was built to discriminate.'
    tracked_object: Per reachable ML-KEM implementation, the classification of its comparison
      routine by tail structure (fixed-bound hand-written vector, compiler-generated, memcmp-family).
    one_step_propagation_rule: Each implementation contributes one classification; the population
      count is their sum under an explicitly stated enumeration boundary.
    newness_score: Nil as mathematics. The content is that a goal was completed with its discriminating
      criterion resolved into a third outcome class -- neither rival world reached -- and the
      instrument was proven adequate at the exact moment its population became the open question.
  lossy_projection_identifiability_audit:
    projection: the implementation ecosystem -> a count in the strict fixed-bound class.
    what_is_discarded: Everything about each implementation except its comparison tail.
    is_it_only_a_change_of_coordinates: 'NO -- the count does not exist. Honest caveat: a WEAK
      object, one integer, whose value depends entirely on the enumeration boundary, which is
      why the boundary must be stated explicitly.'
    mirror_failure_check: CHECKED. The classifier must be able to report a non-empty strict class
      and an empty one; both are live outcomes and the record commits to reporting either.
  null_object_control:
    primary_null: 'NULL OBJECT OF THE RIGHT SHAPE BEFORE BELIEF, WHICH THE CLOSED GOAL NEVER HAD:
      run the same classifier over a set of NON-PQC C comparison routines and check it does not
      report the strict class everywhere or nowhere. A classifier that does either is measuring
      its own bias.'
    secondary_nulls:
    - State the exact enumeration boundary with the count; a population figure without its boundary
      is not a measurement.
    - The source-gate measurement in REVIEW-UNADDRESSED-20260807 section 5 shows most sources
      download, so the enumeration is executable.
  assumptions: []
  predictions:
  - metric: ML-KEM implementations in the strict fixed-bound comparison class
    direction: different
    minimum_effect: Any count with its boundary stated. Zero is a publishable scoping statement
      about the instrument's relevance.
  minimal_test:
    design: Enumerate ML-KEM implementations reachable from source (PQClean, liboqs, mlkem-native,
      the reference FIPS 203 code, obtainable vendor forks); classify each comparison routine
      by tail structure; report the strict-class count with the enumeration boundary; run the
      non-PQC null first.
    controls:
    - non-PQC comparison-routine null
    - explicit enumeration boundary
    - reference FIPS 203 code as a known case
    required_metrics:
    - per-implementation classification with source and commit
    - strict-class count
    - enumeration boundary statement
    - null classifier behaviour
  falsification_conditions:
  - 'The strict class is empty across all reachable implementations: the gate discriminates a
    population that does not exist, which is a publishable scoping statement about a completed
    goal and the most valuable outcome here.'
  - 'The null classifier reports the strict class everywhere or nowhere: it is measuring its own
    bias and no count is admissible.'
  - 'The class is large: the gate''s relevance is established and the completed goal''s value
    rises.'
  confounders:
  - Implementations change; the count is dated and pinned to commits or it is not reproducible.
  - '''Fixed-bound hand-written vector'' is a judgement on generated assembly in some cases; state
    the criterion.'
  - Vendor forks are unevenly reachable, which biases the enumeration and must be recorded.
  interpretation_limits:
  - A population census. It revises no conclusion of GOAL-MLKEM-002 and disputes no measurement.
  - Implementation conformance, not cryptanalysis.
