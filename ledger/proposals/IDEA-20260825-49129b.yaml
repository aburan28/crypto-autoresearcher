idea:
  id: IDEA-20260825-49129b
  title: Frobenius-semilinear dyadic remainder automaton
  class: composition
  question_ids:
    - RQ-ECDLP-002
  goal_ids:
    - GOAL-ECDLP-001
  source_handoff: TASK-20260825-10a615
  status: proposed
  object: >-
    A sparse Frobenius-semilinear transition state for composing dyadic
    target-local remainders on an explicitly named structured prime-field
    curve family.
  depth_of_verified_structure: >-
    Conceptual mechanism only; no family theorem, recurrence, implementation,
    or experiment was executed in this task.
  claim: >-
    On explicitly identified prime-field curve families, the dyadic target-local
    remainder state may admit a sparse Frobenius-semilinear transition automaton:
    parent states are obtained from child states by a fixed p-power coefficient
    map plus a bounded affine bridge. If the transition is exact and its rank,
    degree, and nonzero counts remain sublinear in the frozen interface, it could
    supply a public P1553 recurrence with a lower update cost. This is a scoped
    candidate, not a claim that Frobenius alone defeats the generic lower bound.
  mechanism: >-
    Treat coefficient vectors in the target-local quotient ring as a semilinear
    state under the Frobenius map x -> x^p. For a dyadic split I = I_0 union I_1,
    derive an update S_I = A_I(S_{I_0}, F(S_{I_1}), b_I), where A_I is a typed
    sparse affine map and b_I records boundary, CRT, multiplicity, and orientation
    data. The operation is a state transition, not a Frobenius projector, norm
    jet, elliptic-net value, or high-degree selector. The proposed gain comes only
    if the semilinear map has a provably small active rank and remains exact on
    all exception strata.
  nearest_record_delta:
    screened_against:
      - FINDING-PF-IC-001:ECFG-P1536-R0
      - FINDING-PF-IC-001:ECFG-P1537-R1
      - FINDING-PF-IC-001:ECFG-P1547-R0
      - FINDING-PF-IC-001:ECFG-P1551-R0
      - FINDING-PF-IC-001:ECFG-P1552-R0
      - GOAL-ECDLP-001.next_action
    overlap_axes:
      - Frobenius action on prime-field representations
      - dyadic state composition
      - target-local recurrence search
    exact_delta: >-
      P1536/P1537 use Frobenius projectors and norm-jet transport, P1547 uses
      prime-to-p jet coordinates, and P1551 uses a finite-domain high-degree
      selector. This proposal uses none of those observables: it asks only for a
      sparse semilinear transition on a typed remainder state, with explicit rank
      and boundary metadata. It therefore survives only if the map is exact and
      cheaper than materializing the prior representations.
  novelty_status: unverified
  duplicate_screen:
    corpus_scope: >-
      The handoff's 106 current RQ-ECDLP-002 proposals and adjacent ECDLP,
      Semaev, endomorphism, isogeny, representation, multi-target, and
      cost-model records were treated as the declared comparison corpus.
    method: >-
      Compared the observable, transition algebra, Frobenius usage, and claimed
      cost leverage against the named P1536-P1552 frontier and generic controls.
    outcome: >-
      No exact state-transition duplicate was identified in the available
      frontier summaries. The proposal remains unverified because a sparse
      Frobenius update can collapse to an already-screened projector or jet route.
    unresolved_gaps:
      - The 106 proposal bodies require Coordinator ID-by-ID confirmation.
      - A nontrivial semilinear map may exist only on a small exceptional curve family and then fail the target scope.
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: The question permits structured prime-field families but requires public, falsifiable mechanisms.
      verified_by: ledger/questions/RQ-ECDLP-002.yaml:7-38
    - ref: GOAL-ECDLP-001
      provenance: internal
      claim: >-
        The goal requires an instantiated recurrence or circuit identity and
        forbids unsupported assertions of a specialized circuit.
      verified_by: ledger/goals/GOAL-ECDLP-001/goal.yaml:9469-9499
    - ref: FINDING-PF-IC-001:ECFG-P1536-R0
      provenance: internal
      claim: The adjacent Frobenius-projector/norm-jet route is a prior boundary.
      verified_by: ledger/FINDING-PF-IC-001.md:1479-1526
    - ref: FINDING-PF-IC-001:ECFG-P1547-R0
      provenance: internal
      claim: The prime-to-p jet-coordinate family is an adjacent but excluded mechanism.
      verified_by: ledger/FINDING-PF-IC-001.md:2348-2386
    - ref: KN-FIND-b7e091
      provenance: internal
      claim: >-
        Endomorphism-image oracles on ordinary prime-order curves are generic
        group simulable, so the proposal cannot count a public Frobenius map as
        an automatic non-generic oracle.
      verified_by: knowledge/findings/KN-FIND-b7e091.md:16-28
    - ref: KN-TECH-080
      provenance: internal
      claim: Cheap proof audits and exact transfer obligations are mandatory.
      verified_by: knowledge/techniques/KN-TECH-080.md:26-124
  assumptions:
    - The selected curve family has a publicly computable Frobenius action on the typed coefficient state.
    - The dyadic bridge is semilinear and sparse without hidden source-root access.
    - Active rank and coefficient growth admit a uniform bound across all declared CRT and exception strata.
    - Any non-generic leverage comes from the state transition's exact structure, not merely from computing [p] in the group.
  proof_search_map:
    bottleneck: >-
      The bottleneck is proving an exact low-rank state update for a parent
      target-local remainder from its dyadic children.
    baseline_embedding:
      parameter_slice: >-
        On ordinary curves with End_Fp(E)=Z, specialize the transition to the
        identity or to the generic group transcript and reproduce the p^(1/2)
        baseline rather than counting Frobenius as free.
      reproduction_check: >-
        Freeze a small-field recurrence and compare every transition against
        direct quotient-ring recomputation, including the cost of applying the
        p-power map and materializing coefficients.
    observation_collision:
      observable: >-
        Semilinear state (coefficient vector, active-rank basis, bridge map,
        CRT/valuation/lineage metadata, and orientation).
      distinct_preimage_search: >-
        Find distinct child-state tuples with the same compressed semilinear
        state but different parent remainders or group coefficients; include a
        generic ordinary curve and a structured curve to separate family-specific
        from universal claims.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          A typed remainder state retaining the smallest boundary/valuation
          metadata needed for exact semilinear composition.
        predicted_gain: >-
          Preserve enough state for recursion while discarding roots and unused
          coefficients; only a proved rank bound can turn this into a complexity
          gain.
    quantifier_order: >-
      There exists a declared curve family F and a uniform typed state such that
      for every E in F, public P,Q, and valid dyadic split, the semilinear update
      is exact; only if this universal-in-family statement holds may one assert
      that there exists a parameter schedule beating the family baseline.
    method_ceiling:
      strongest_certifiable_claim: >-
        The method can certify an exact recurrence on a named structured family;
        it cannot certify a generic prime-field ECDLP improvement or a scalar
        recovery without separate relation and descent proofs.
      nearby_object_control: >-
        Apply the same transition to ordinary End_Fp(E)=Z curves and to random
        coefficient states with equal dimensions. Any rank or yield advantage
        must disappear on the nearby controls.
    proof_obligations:
      - claim: Semilinear recurrence identity
        responsibility: correctness
      - claim: Public coefficient and Frobenius construction
        responsibility: interface
      - claim: Rank, degree, nonzero, and coefficient-growth bounds
        responsibility: size
      - claim: Family and exception-stratum scope
        responsibility: scope
      - claim: Per-transition runtime, memory, and traffic
        responsibility: runtime
      - claim: Relation yield and scalar recovery under explicit hypotheses
        responsibility: success_probability
    not_applicable_reason: null
  predictions:
    - metric: direct recurrence equality
      direction: higher
      minimum_effect: exact agreement on every frozen toy fixture
    - metric: active transition rank versus full state dimension
      direction: lower
      minimum_effect: a reproducible sublinear rank regime on the declared family
    - metric: transition coefficient growth
      direction: lower
      minimum_effect: within the frozen bound for every CRT and exception stratum
    - metric: relation yield on structured versus ordinary/null curves
      direction: different
      minimum_effect: any increase must vanish under the ordinary-curve and random-state controls
  minimal_test:
    design: >-
      Specify a toy symbolic audit over a small structured family and an ordinary
      control family. Enumerate every dyadic split, compute direct and semilinear
      parent states, and record rank, nonzeros, coefficient bits, lineage,
      multiplicity, orientation, and full relation cost. Do not infer an attack
      from a rank signal alone.
    controls:
      - Ordinary End_Fp(E)=Z curves where Frobenius is treated only as public group computation.
      - Random coefficient states with the same dimensions and degree profile.
      - Squarefree and repeated-root inputs, all CRT/exception strata.
      - Q and -Q and deliberately permuted lineage labels.
      - Pollard rho and standard Semaev m=2 matched controls.
    required_metrics:
      - exact recurrence and certificate equality
      - rank, degree, nonzeros, coefficient growth, and live storage
      - transition build/query time and traffic
      - source enumeration and witness dependence
      - relation yield and end-to-end time-memory-data comparison
  falsification_conditions:
    - The transition is a projector, jet, selector, or generic scalar multiplication in renamed form.
    - Exactness fails on any declared family member, exception stratum, repeated root, lineage collision, or orientation.
    - Rank savings disappear as the prime size or dyadic depth grows.
    - The structured/null yield gap fails to decay under a parameter that destroys the proposed Frobenius alignment.
    - The complete source-to-target path is not below Pollard rho after charging Frobenius and sparse linear algebra.
  confounders:
    - Frobenius coefficient maps can be counted as free although they require field operations and storage.
    - Low rank on toy curves may be caused by small characteristic or accidental CM structure.
    - Family-specific gains may not apply to generic prime-field curves in scope.
    - A rank signal can be an artifact of repeated or unlabelled state encoding.
  interpretation_limits:
    - A structured-family recurrence is not a generic ECDLP result.
    - Frobenius structure alone is not a non-generic oracle on ordinary curves.
    - A null-control separation is necessary but not sufficient for relation recovery.
    - Negative evidence is scoped to the tested family, ring, and depth.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On the selected structured family, the active rank of the semilinear
        transition remains at most the declared sublinear bound uniformly over
        dyadic depth and prime size.
      rigorous_support: >-
        The p-power map is exact, but no bound on the compressed active rank is
        established by the current records.
      validation_plan: >-
        Compute exact rank on a family of toy primes and on correspondence-based
        public samples, compare rank-growth confidence intervals to random-state
        and ordinary-curve nulls, and explicitly test the largest-depth tail.
    - id: H2
      statement: >-
        Any excess relation yield induced by semilinear alignment is not present
        in degree-matched random polynomials or in the same curve family after a
        structure-destroying parameter permutation.
      rigorous_support: >-
        This is a falsifiable control assumption, not a theorem; the generic
        group simulation result blocks treating it as automatic leverage.
      validation_plan: >-
        Run identical measurements on elliptic, random-polynomial, ordinary-curve,
        and destroyed-structure controls, compare full yield distributions and
        tails, and record transfer limits.
  target_complexity:
    time_exponent: >-
      Unverified conditional target p^(1/3+o(1)) on a named structured family;
      p^(1/2+o(1)) remains the established generic baseline.
    memory_exponent: >-
      Conditional p^(o(1)) to p^(1/3+o(1)) depending on stored transition bases;
      no verified bound.
    best_known: p^(1/2+o(1)) generic rho, with specialized methods requiring separate public structure and full accounting
    hidden_overhead: >-
      Include Frobenius application, basis construction, rank updates, coefficient
      swell, failed relation probability, sparse solve, descent, and family
      membership tests.
    tradeoff_note: >-
      Reusing transition bases saves time but consumes memory; distributed rank
      updates incur synchronization and coefficient traffic that must be charged.
  cost_boundary:
    public_inputs: E, P, Q, p, n, explicit structured-family parameters, dyadic geometry, and typed state basis
    per_attempt: >-
      Build child states and semilinear maps, apply Frobenius, bridge to parent,
      filter and verify relation candidates, perform sparse solve/descent, and
      recover and independently verify the scalar.
    preprocessing: >-
      Family-specific basis and transition construction, CRT data, reusable
      coefficient transforms, and all rank computations.
    online: >-
      State updates, interval selection, relation/certificate conversion,
      source unranking, and independent verification.
    success_probability: >-
      Unspecified; any claimed expected cost must multiply measured/proved
      per-attempt cost by inverse success probability.
    time: >-
      Charge field Frobenius, sparse matrix operations, polynomial work, relation
      collection, sparse linear algebra, descent, scalar recovery, and validation.
    memory: >-
      Charge transition bases, active-rank coordinates, CRT and lineage metadata,
      relation tables, certificates, caches, and replicas.
    data_queries: >-
      Charge public group operations, coefficient and rank queries, relation and
      verification requests, and worker traffic.
    exclusions: >-
      No hidden family oracle, secret scalar, deployed target, free Frobenius,
      witness, factorization, support table, or source enumeration.
  dominated_by:
    result: Pollard rho baseline (KN-TECH-006) and generic-group lower-bound controls
    frontier_checked: [generic rho, BSGS, standard Semaev, P1536-P1552 structured representations, endomorphism-image oracle]
    reason: >-
      Public Frobenius structure is currently either generic-group simulable or
      unverified on the proposed state, so the baseline dominates all verified
      axes until a strict family-scoped gain is shown.
  sota_delta:
    time_exponent: "0 verified; conditional aspiration -1/6 on a named family only"
    memory_exponent: "0 verified; conditional range p^(o(1)) to p^(1/3)"
    data_queries: "0 verified; Frobenius and certificate traffic unresolved"
    status: unverified
  estimated_cost:
    implementation: high
    compute: medium
    rationale: >-
      Symbolic recurrence and rank audits are costly but bounded; family-wide
      validation and end-to-end accounting are high-risk.
  priority: medium
  recommended_priority: medium
