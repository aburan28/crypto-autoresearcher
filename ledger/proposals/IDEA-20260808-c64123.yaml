idea:
  id: IDEA-20260808-c64123
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ECTD-001
  goal_id: GOAL-ECTD-001
  title: 'GOAL-ECTD-001''s "descent" half has zero finite-field content and this is a one-line
    consequence of Lang''s theorem: H^1(F_p, E) = 0 forces the l-descent map to be the isomorphism
    E(F_p)/l = E(F_p)[l], which on a prime-order subgroup with l != N is IDENTICALLY ZERO
    - so every descent- based trapdoor must live on a lift, where the recorded height obstruction
    already applies, and the only non-degenerate case l = N needs rational full N-torsion,
    i.e. embedding degree 1'
  class: mechanism
  claim: "(A) THE DEGENERACY, DERIVED. Let E/F_p and l != p be a prime. The absolute Galois\
    \ group of F_p is Zhat, of cohomological dimension 1, and Lang's theorem gives H^1(F_p,\
    \ A) = 0 for every connected algebraic group A over F_p, in particular H^1(F_p, E) = 0.\
    \ The Kummer sequence 0 -> E[l] -> E -> E -> 0 then yields the exact sequence\n    0 ->\
    \ E(F_p)/l E(F_p) -> H^1(F_p, E[l]) -> H^1(F_p, E)[l] = 0,\nso the l-descent map is an\
    \ ISOMORPHISM onto H^1(F_p, E[l]), which for a finite Galois module over a finite field\
    \ has the same order as the invariants E[l]^{Frob} = E(F_p)[l]. Hence\n    E(F_p)/l E(F_p)\
    \ = E(F_p)[l],  canonically in size, with no Sha,\nno Selmer gap and no rank information:\
    \ the \"Selmer group\" and the \"Mordell-Weil quotient\" coincide, which is the precise\
    \ sense in which descent over a finite field is empty. (B) THE CONSEQUENCE FOR ECDLP.\
    \ Let G = <P> have prime order N with N || #E(F_p), and let l != N. Then G/lG = 0, so\
    \ the descent class of every point of G is trivial and the descent map carries NO information\
    \ distinguishing Q = [k]P from P. This is the cohomological form of the rigidity already\
    \ recorded in this campaign (any curve-only or divisibility-only statistic is k-independent),\
    \ and it upgrades it from a case analysis to a single structural reason. (C) THE ONE NON-DEGENERATE\
    \ CASE, AND ITS PRICE. For l = N the descent map G/NG = G -> H^1(F_p, E[N]) is an isomorphism\
    \ of groups of order N, so it is not zero - but computing the connecting map explicitly\
    \ requires a basis of E[N] and the Weil pairing on it, hence F_p-rational full N-torsion,\
    \ hence (Balasubramanian-Koblitz) N | p - 1, hence embedding degree 1, hence MOV already\
    \ applies. Exactly the same degenerate cell as slice record E3-04 identifies for the Kani\
    \ route; the two closures meet at the same wall, which is itself worth recording. (D)\
    \ THE CONSEQUENCE FOR THE TRAPDOOR GOAL. GOAL-ECTD-001's title names \"torsion/descent\"\
    \ as a priority family. This record asserts that no descent-based trapdoor can exist at\
    \ the finite-field level, because the object a designer would hide in - the Selmer/Sha\
    \ gap - is provably zero over F_p. Every surviving descent trapdoor must therefore live\
    \ on a characteristic-zero or p-adic lift, where the recorded Xedni obstruction (lifted\
    \ points have canonical height of order N) bites, and where the designer has no more freedom\
    \ than the attacker because the canonical lift is a FUNCTION of E rather than a choice\
    \ (IDEA-20260807-44ba75's point)."
  mechanism: 'Descent works over number fields because H^1(K, E) is huge and the Selmer group
    sits strictly between the Mordell-Weil quotient and the cohomology, leaving room for Sha
    - room in which arithmetic information hides. Over a finite field Lang''s theorem collapses
    that room to nothing: the curve is a connected group over a field of cohomological dimension
    1, so every torsor under it is trivial. A trapdoor needs a place to hide information that
    the public cannot compute; the descent formalism over F_p has no such place, and this
    is a theorem rather than an observation about current techniques.'
  why_not_a_renamed_known_approach: "Nearest known: \"Xedni fails because lifted points have\
    \ height about N\" (Jacobson-Koblitz-Silverman-Stein-Teske, recorded in DECOMPOSITION.md\
    \ L9). That is a statement about the COST of lifting. This record is a statement about\
    \ the finite-field side: it says there is nothing to lift TOWARD, because the finite-field\
    \ descent is already zero, so the lift is not an optimisation of a finite-field method\
    \ but the entire method. Nearest second: >-\n  IDEA-20260807-df906f's rigidity theorem\
    \ (a propagating map on a\nprime-order group is rigid); that argument is combinatorial\
    \ and about maps, this one is cohomological and about the descent exact sequence specifically,\
    \ and it also handles the l = N case, which rigidity does not address."
  predictions:
  - observable: triviality of the descent class on G
    metric: 'for toy ordinary curves and every prime l dividing #E(F_p) with l != N, the image
      of P and of Q = [k]P in E(F_p)/l E(F_p), computed explicitly via the group structure,
      over many resampled k with (E, P) fixed'
    predicted: identical for P and Q and independent of k, in 100% of samples; any k-dependence
      falsifies (B) and would be a major positive result
  - observable: size identity
    metric: '#(E(F_p)/l E(F_p)) against #E(F_p)[l], for all l | #E(F_p), over >= 200 toy curves'
    predicted: exactly equal in every instance (this is (A) as an identity)
  - observable: the l = N cell
    metric: 'fraction of toy curves with prime N || #E(F_p) for which a rational basis of
      E[N] exists, cross-tabulated against N | p - 1'
    predicted: rational basis exists exactly when N | p - 1, matching E3-04's contingency
      table; the two records must agree cell by cell and a disagreement indicts one of them
  minimal_test: 'Cheap and self-contained. (i) For 200 toy ordinary curves at 16-24 bits,
    compute the full group structure Z/n_1 x Z/n_2 and, for every prime l | #E(F_p), verify
    #(E(F_p)/l) = #E(F_p)[l]. (ii) For each curve fix P of prime order N, sample 100 values
    of k, and verify that the class of [k]P in E(F_p)/l E(F_p) is constant in k for every
    l != N. (iii) Cross-tabulate the l = N rationality cell against N | p - 1. Existing harness
    point-arithmetic suffices; no new machinery.'
  controls:
  - 'PLANTED POSITIVE: on a curve with l^2 | #E(F_p) and l | n_1 (non-cyclic l-part), the
    quotient E(F_p)/l has order l^2 and points OUTSIDE G do have distinguishable classes.
    The instrument must detect that variation; if it reports "no variation" there, it is blind
    and cannot support (B).'
  - 'NUMBER-FIELD CONTROL: run the identical descent computation for a curve over Q with known
    nontrivial Sha or rank, confirming the code detects a nonzero Selmer gap where one exists.
    This separates "descent is empty over F_p" from "our descent code returns empty".'
  - 'k-RESAMPLING NULL: the canonical control the lane mandates - resample k with the curve
    fixed. Any statistic that moves must be an artifact.'
  confounders:
  - Curves with l | n_1 (non-cyclic l-torsion) genuinely have larger E(F_p)/l; pooling them
    with cyclic instances would create a spurious appearance of variation.
  - 'The cofactor of N in #E(F_p) is where all the l != N structure lives; if the cofactor
    is 1 the test is vacuous and such instances must be reported separately.'
  - Implementations that compute "descent" by lifting to Z silently change the question; the
    field of definition of every computation must be asserted.
  falsification_conditions:
  - 'Any measured k-dependence of the descent class on G for l != N: (B) is wrong and the
    descent lane reopens with a concrete instance.'
  - 'Any toy curve with #(E(F_p)/l) != #E(F_p)[l]: (A) is wrong, which would contradict Lang''s
    theorem and indict the computation first.'
  - 'A rational basis of E[N] on a curve with N not dividing p - 1: (C) is wrong and E3-04
    falls with it.'
  interpretation_limits: This is a statement about DESCENT over F_p, not about elliptic curves
    over F_p in general, and certainly not about descent over number fields where it is a
    powerful tool. It closes a family for GOAL-ECTD-001 and gives forward guidance (lifts
    only); it does not close the lift route, which lane L9 owns. Toy verification confirms
    a derivation; it is not crypto-scale evidence and is not presented as such.
  assumptions:
  - E/F_p an elliptic curve, l != p prime.
  - 'Lang''s theorem: H^1(F_q, A) = 0 for a connected algebraic group A over a finite field
    [recall-confident, standard].'
  - cd(Gal(F_pbar/F_p)) = 1 [recall-confident, standard].
  - Balasubramanian-Koblitz for the l = N cell, as in E3-04 [recall-confident, NOT re-verified].
  heuristic_assumptions:
  - id: HA-1
    statement: 'No heuristic is load-bearing in (A), (B) or (C); all three are derivations
