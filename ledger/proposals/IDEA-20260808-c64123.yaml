      cofactor #E(F_p)/N is small and typically smooth for cryptographically generated curves,
      so the l != N cell is typically thin.'
    rigorous_ingredient: Lang's theorem and the Kummer exact sequence.
    distribution_imitated: 'For the scope note only: the standard heuristic that #E(F_p)/N
      behaves like a random small integer, as used in curve-generation practice.'
    validation_route: The toy test measures the cofactor distribution directly over the 200
