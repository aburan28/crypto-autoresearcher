idea:
  id: IDEA-20260807-9ecc6f
  question_id: RQ-EQLA-0d3f40
  added: '2026-08-07'
  title: >-
    CLOSURE WITH THE OBSTRUCTION NAMED: the commutant of a finite abelian group
    acting on a phi-stable factor base is a PRODUCT OF FULL MATRIX ALGEBRAS of
    size B/g, which admits no superfast solver - so the alpha^2 B log B cost
    model of H-STR-002 is imported from nilpotent-shift Toeplitz theory and does
    not apply, the entire available saving is g in relations and g^2 in
    linear-algebra operations, block-diagonalisation and orbit-quotienting are
    THE SAME saving and must not be multiplied, and g <= 3 on the x-coordinates
    of any prime-field curve

  class: mechanism

  claim: >-
    (A) WHAT THE PROGRAM'S COST MODEL ASSUMES. H-STR-002, IDEA-20260726-002 and
    the committed harness all price the structured solve at
    alpha^2 * B * ceil(log2 B), and compare it to Wiedemann at 2 B^2. That
    formula is the Toeplitz-like/displacement-rank cost of Kailath-Kung-Morf
    type theory, whose superfast divide-and-conquer solvers require the
    displacement operators to be NILPOTENT lower-shift matrices Z with Z^B = 0.
    The reason is structural: Schur complements of Toeplitz-like matrices are
    again Toeplitz-like with controlled displacement rank, which is what makes
    the recursion close. EV-STR-003 recorded this as an OPEN cost-model
    objection (RT-CM-1: "displacement-rank theory applied to a finite-order
    permutation rather than a nilpotent shift") and explicitly stated that
    RT-CM-1 through RT-CM-6 "remain OPEN and must not be described as settled".
    This record settles RT-CM-1, in the negative, with an argument.

    (B) THE OBSTRUCTION, NAMED. The operator actually used in this lane is
    Sigma, the permutation matrix of the phi-action on the factor base, of
    FINITE ORDER g (g = 3 on the x-coordinates of a j = 0 curve). A matrix M with
    M Sigma = Sigma M lies in the COMMUTANT of the representation of C_g on
    F_N^B. Since gcd(g, N) = 1 and F_N contains a primitive g-th root of unity
    (forced: lambda has multiplicative order g in (Z/N)^*, so g | N - 1), Maschke
    and Wedderburn give
      F_N^B = direct sum over the g characters of C_g of eigenspaces, each of
      dimension B/g, and
      Commutant = product over j = 0..g-1 of M_{B/g}(F_N),
    a product of g FULL matrix algebras of size B/g. There is no proper
    structure inside a full matrix algebra: a generic element of M_{B/g}(F_N) has
    no displacement structure with respect to any nilpotent shift, its inverse
    costs (B/g)^omega dense or 2 (B/g) matrix-vector products sparse, and no
    log-factor solver exists or is claimed to exist in the literature for it.
    THE OBSTRUCTION IS THEREFORE: g-fold equivariance buys exactly a g-fold
    block split and nothing inside the blocks; the blocks are generic; and
    "superfast" is unavailable because the displacement operator has finite
    order rather than being nilpotent.

    (C) THE ARITHMETIC, STATED HONESTLY AND WITHOUT DOUBLE COUNTING.
      Dense: B^3 becomes g (B/g)^3 = B^3 / g^2.  Gain g^2.
      Sparse Wiedemann: 2 B * nnz becomes sum_j 2 (B/g) nnz_j <= 2 (B/g) nnz.
        Gain g. (Each Fourier block is (B/g) x (B/g) with nnz_j at most the
        number of nonzero group-algebra entries, which is at most nnz / g when
        each g x g circulant block carries one nonzero coefficient.)
      THESE ARE CONSTANT FACTORS, NOT EXPONENTS. This record claims NOTHING more
      than a constant factor and identifies no place where more could come from
      over a prime field.
    THE DOUBLE-COUNTING TRAP, which is the real content of (C). One is tempted
    to compose the g-fold block split with the g-fold orbit quotient of
    IDEA-20260727-001 and claim g^2 in the sparse case. That is wrong, and the
    reason is exact: the orbit-quotient fold r -> sum_t lambda^t r_{sigma^t(i)}
    IS the isotypic projection onto the lambda-eigenspace, written in
    orbit-representative coordinates (IDEA-20260807-0e4d83). They are the same
    map. Block-diagonalising and then quotienting quotients twice.
    THE CORRECT ACCOUNTING, against a size-matched generic factor base with B
    columns and B independent unknowns: g fewer relations needed (B/g instead of
    B) and g^2 fewer linear-algebra operations (2 (B/g)^2 w instead of 2 B^2 w),
    because only ONE of the g blocks is informative and the other g-1 need never
    be formed. That is precisely the published Frobenius-orbit reduction of
    Galbraith-Granger-Merz-Petit (eprint 2020/1315: "a reduction by a factor of
    1/n" in polynomial systems and "an acceleration of the linear algebra step
    ... by a factor n^2"), with their extension degree n replaced by g.

    (D) WHY g IS BOUNDED BY 3 OVER A PRIME FIELD, WHICH IS WHERE THE LANE ENDS.
    The group acting must (i) map the factor base to itself, (ii) be realisable
    on x-coordinates by a map cheap enough not to swamp the saving, and (iii)
    act on G so that orbit logarithms are related by publicly known scalars -
    without (iii) there is no reduction in unknowns and hence no saving at all.
    Over F_p the maps satisfying all three are the units of End_{F_p}(E), i.e.
    Aut(E), of order 2 (generic), 4 (D_0 = -4) or 6 (D_0 = -3). On
    X-COORDINATES the negation acts trivially - (x, y) and (x, -y) share x - so
    an x-coordinate factor base has ALREADY spent the factor 2, and the residual
    group is mu_3 for j = 0 and mu_2 for j = 1728. Hence g <= 3, marginal sparse
    gain <= 3, marginal dense gain <= 9, over the baseline every implementation
    already uses. On subfield curves the analogous group is generated by
    Frobenius and has order n, unbounded in the field extension degree - which
    is exactly why eprint 2020/1315 is a real result there and why its analogue
    here is a constant.

    (E) THE FORWARD GUIDANCE, which is what makes this a closure and not a
    fatigue report. What remains open after this obstruction:
      (i) Groups acting on the factor base that do NOT act as scalars on G -
        set-symmetries of the factor-base defining condition, or the S_m
        permutation of summands. These change the POLYNOMIAL SYSTEM and hence
        relation-collection cost (lane L4), not the linear algebra; and
        EV-EQJ-001 measured that for S_3 semidirect (Z/2)^3 the ranks do not
        split at all, so the block route there is worse, not better.
      (ii) Endomorphisms of norm > 1 whose eigenvalue has large multiplicative
        order, giving g unbounded. That is a genuine attempt at a super-constant
        and it is written up separately as IDEA-20260807-45a69f, whose predicted
        obstruction is different (generic-group simulability) and must be
        checked on its own terms.
      (iii) Structure in the SPARSITY PATTERN rather than in the group action -
        whether equivariance changes the column-weight distribution enough to
        alter structured Gaussian elimination (IDEA-20260807-d20846).
      (iv) Whether the g-fold relation saving survives the density penalty at
        all (IDEA-20260807-d6956c). If it does not, even the constant is zero.
    NOTHING HERE DECLARES ANY DIRECTION IMPOSSIBLE. It names one obstruction,
    argues it, and says what is left.

  resource_label: >-
    audit: consumes no resource. This record prices the R1 + R3 mechanism that
    the other L5 proposals consume; it makes no measurement requiring a curve
    and mounts nothing.

  admissibility: admissible

  admissibility_argument: >-
    An audit consumes no resource and cannot be inadmissible on the
    resource-naming ground. Its conclusion, however, bears directly on
    admissibility: the mechanism it prices is admissible (the equivariance is
    realised by field operations on x-coordinates, not by group-oracle outputs)
    and is nonetheless capped at a constant, which is the outcome the
    DECOMPOSITION section 2 filter predicts for any lane whose informational
    content reduces to scalar action on G. The record is therefore a worked
    instance of the filter rather than an exception to it.

  discriminated_from:
    - >-
      IDEA-20260727-001, which argued that the H-STR-002 advantage "is the
      orbit-representative reduction ... instantiated with orbit length r = 3",
      via a COST-MODEL COMPARISON with three numbers and a brute-force
      determinacy check. This record supplies the algebraic reason
      (commutant = product of full matrix algebras; finite order versus
      nilpotent shift), states the double-counting trap explicitly, and derives
      the ceiling g <= 3 on x-coordinates from the trivial action of negation -
      a bound that record does not contain and that changes its stated r = 3
      relation / r^2 = 9 linear-algebra figures into 3 and 9 measured against
      the ALREADY-negation-quotiented baseline rather than against a raw one.
    - >-
      H-STR-002, whose prediction "structured solve cost O(alpha^2 B log B)
      beats generic Wiedemann O(B^2)" is exactly the cost model this record
      argues is inapplicable. This record does not re-assert or re-test
      H-STR-002 and moves no status; it addresses RT-CM-1, an objection EV-STR-003
      recorded as OPEN and which no arm of EXP-STR-002/003/004 tested.
    - >-
      EV-EQJ-001 / DEC-20260718-006, which measured isotypic block-splitting for
      a group acting on summands and found "rank never splits - every surviving
      block has r_lambda = r_full", i.e. block-restricted linear algebra cost 4x
      MORE (LA factor 0.25 exactly at all cells). That is the failure mode when
      the group does not act as a scalar on G. This record explains why the
      phi-action fails differently - the rank splits perfectly, and the perfect
      split is already the orbit quotient - and the pair of failure modes is the
      lane's real map.
    - >-
      eprint 2020/1315 (Galbraith-Granger-Merz-Petit). Nothing in that paper is
      contested. This record's claim is about the PARAMETER: their n is the
      extension degree and grows; the prime-field analogue is bounded by
      |Aut(E)| and, on x-coordinates, by 3.

  object_first_candidate:
    tracked_object: >-
      THE COMMUTANT ALGEBRA A = { M in M_B(F_N) : M Sigma = Sigma M } of the
      finite-order permutation Sigma, tracked as an abstract algebra rather than
      as a set of matrices. The question "what does equivariance buy" is exactly
      "what algorithms does A admit that M_B(F_N) does not".
    lossiness: >-
      LOSSY IN THE WRONG DIRECTION, AND THIS IS THE FINDING. Passing from M to
      its isotypic block tuple (M_0, ..., M_{g-1}) loses NOTHING: the map is an
      algebra ISOMORPHISM A -> product of M_{B/g}(F_N), invertible by the inverse
      DFT over C_g. By docs/inventor-protocol.md section 2 a projection that
      loses nothing is a CHANGE OF COORDINATES, NOT A NEW OBJECT. The
      group-algebra/block-circulant view of the relation matrix therefore cannot
      be a new attack object; it can only be an implementation-level constant.
      The genuinely lossy object in this lane is the SINGLE informative block
      M_lambda (IDEA-20260807-0e4d83), which discards g-1 of the g blocks - and
      discarding them is legitimate only because they are provably
      information-free, which is a fact about the ECDLP setup and not about the
      algebra. Applying the section-2 test here is what separates the two, and
      it costs no compute.
    propagation: >-
      Exactly and deterministically: products, sums, inverses and Schur
      complements all act blockwise, because the map is an algebra isomorphism.
      That is precisely why nothing further can be extracted - the blocks are
      unconstrained, so any algorithm valid for a generic (B/g) x (B/g) matrix is
      the best available inside a block.
    survival_score: >-
      The isomorphism survives every change that keeps gcd(g, N) = 1 and keeps
      the g-th roots of unity in F_N; both are forced here. It DIES at a group
      whose order shares a factor with N (Maschke fails, the algebra is no longer
      semisimple and only a block-TRIANGULAR form is available - still a constant
      factor, and worse); and it dies at a non-abelian group, where the blocks
      have multiplicity and the split is into matrix algebras of size
      (multiplicity) x (multiplicity) over division rings - which is the
      EV-EQJ-001 situation and is where "rank never splits" was measured.

  mechanism: >-
    This is an ARGUMENT, not an experiment, and its steps are proof steps. It is
    nonetheless falsifiable at every one of them and each is cheap to check
    symbolically at toy scale.

    STEP 1. Establish the split. Verify gcd(g, N) = 1 and that F_N contains a
    primitive g-th root of unity (forced: lambda has order g mod N). Construct
    the g idempotents e_j = (1/g) sum_t zeta^{-jt} Sigma^t explicitly over F_N;
    verify e_j e_k = delta_{jk} e_j and sum_j e_j = I numerically. This is a
    known-answer test of the whole framework and takes milliseconds.

    STEP 2. Exhibit the isomorphism. For a random equivariant M, compute the g
    blocks and verify that block multiplication reproduces the blocks of M^2,
    and that reassembly from blocks returns M exactly. This establishes
    computationally that no information is lost, which is the section-2 verdict.

    STEP 3. Price the three cost models on the SAME instance, in the SAME unit
    (field operations), with memory reported beside time:
      (a) plain Wiedemann on the full B x B equivariant system: 2 B * nnz;
      (b) blockwise Wiedemann on all g blocks: sum_j 2 (B/g) nnz_j;
      (c) Wiedemann on the single informative block: 2 (B/g) nnz_lambda;
      (d) the H-STR-002 model alpha^2 B ceil(log2 B) with the measured alpha.
    Report all four. The claim is (b)/(a) about 1/g, (c)/(a) about 1/g^2, and
    that (d) is not a valid cost for ANY of them because no algorithm achieving
    it on a finite-order-commutant matrix is exhibited. Whoever wishes to defend
    (d) must exhibit the algorithm; the burden is stated here explicitly.

    STEP 4. The literature obligation, discharged before the argument is
    reported as a closure. Search for any superfast (softly linear in B) solver
    for matrices commuting with a finite-order permutation, i.e. for
    block-circulant systems with generic blocks. The expected finding is that
    the standard method IS the DFT block-diagonalisation, giving exactly the
    factor g, and that superfast methods require displacement with respect to
    nilpotent shifts. If instead such a solver is found, THIS RECORD IS WRONG
    and the finding is an ingredient of enormous value to the lane - so the
    search is run to succeed, not to confirm.

    STEP 5. The nearby-object control, run before the closure is written.
    Apply the same argument to the S_m action on summands (EV-EQJ-001's object),
    where the group does not act as a scalar on G, and check that the argument
    predicts what was measured there: blocks with multiplicity, no reduction in
    unknowns, and hence NO saving - which is what "LA factor (all-blocks) = 0.25
    exactly at all cells" reports. An argument that cannot retrodict the one
    measured instance of block-splitting this program already has is not ready
    to be a closure.

    STEP 6. Write the closure at the docs/inventor-protocol.md section 4
    standard: named obstruction (B), argument (STEPS 1-5), forward guidance
    (E). Explicitly NOT a claim that any direction is impossible.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Ripgrep over the whole repository on 2026-08-07:
      "commutant|Wedderburn|Maschke|isotypic|group algebra|group-algebra";
      "block-circulant|block circulant|circulant"; "displacement rank";
      "Toeplitz|Hankel"; "superfast|super-fast". Full reads of H-STR-002,
      EV-STR-003 (RT-CM-1..RT-CM-6), IDEA-20260726-002, IDEA-20260727-001,
      H-EQJ-001, EV-EQJ-001, harness/endomorphism_la.py. External: eprint
      2020/1315 abstract fetched directly, its two factors (1/n systems,
      n^2 linear algebra) read verbatim.
    results: >-
      "Maschke/Wedderburn" appear in H-EQJ-001's mechanism line, for the
      summand-permutation group. "commutant" appears in IDEA-20260805-530869 and
      IDEA-20260805-bd8339, both in the ML-KEM / QR-UOV lanes and both about
      simultaneous block-diagonalisation of PUBLIC KEY matrices, not about
      ECDLP relation matrices. The specific statement that the commutant of a
      finite-order permutation is a product of full matrix algebras and
      therefore admits no superfast solver appears NOWHERE. RT-CM-1 in EV-STR-003
      raises the nilpotent-versus-finite-order objection and explicitly leaves it
      OPEN; no record answers it. The double-counting trap (isotypic projection =
      orbit fold) appears nowhere. The bound g <= 3 on x-coordinates, from
      negation acting trivially on x, appears nowhere - IDEA-20260727-001 uses
      r = 3 without noting that the residual group on x-coordinates is exactly
      mu_3 because the factor 2 is already spent.
    verdict: >-
      ADAPTATION, and one part is a DUPLICATE-with-attribution: the cost ceiling
      (g in relations, g^2 in linear algebra) is exactly eprint 2020/1315's
      published result with n replaced by g, and IDEA-20260727-001 already
      identified that correspondence. What is new to this corpus is the algebraic
      obstruction that answers RT-CM-1, the section-2 verdict that the group-
      algebra view is a change of coordinates, the explicit double-counting
      prohibition, and the x-coordinate bound g <= 3.

  null_object_control: >-
    MANDATORY AND BLOCKING even for an argument, because the argument's
    empirical limb (STEP 3) reports measured ratios.
    NULL 1 - MATCHED RANDOM EQUIVARIANT MATRIX: a random matrix of identical
    shape, density and column-orbit structure, made exactly Sigma-equivariant by
    construction, with NO curve behind it. PREDICTED: identical block sizes,
    identical ratios (b)/(a) about 1/g and (c)/(a) about 1/g^2. The ratios are
    properties of the ALGEBRA, so the null must match, and its matching is the
    calibration that forbids reporting the factor g as an elliptic-curve finding.
    DECAY PARAMETER: the equivariance fraction c, the fraction of rows that are
    exact Sigma-shifts. As c falls from 1 to 0 the blocks stop being
    well-defined, the reassembly check of STEP 2 must fail, and the measured
    ratios must degrade smoothly to 1 (no saving). A ratio that stays at 1/g for
    a non-equivariant matrix means the blocks are being formed from a matrix
    they do not describe, and every number is void.
    NULL 2 - THE NEARBY OBJECT (STEP 5): the S_m summand action, where the
    argument predicts NO saving and EV-EQJ-001 measured none. A version of this
    argument that predicted a saving there would be falsified by an existing
    committed run set.
    NULL 3 - NON-COPRIME ORDER: a synthetic instance with g | N (constructible
    only synthetically here, since g in {2, 3} and N is a large prime, so it must
    be built as an abstract matrix problem over a small F_N with N = g). Maschke
    fails, the split must degrade to block-triangular, and the measured ratio
    must be worse than 1/g. This checks that the argument's hypotheses are
    load-bearing rather than decorative.

  assumptions:
    - >-
      g = order of the phi-action on x-coordinates, gcd(g, N) = 1, and F_N
      contains a primitive g-th root of unity. All three are forced for
      j = 0 (g = 3, N prime > 3, and 3 | N - 1 because lambda has order 3) and
      are verified per instance rather than assumed.
    - >-
      "Superfast" means softly linear in B. The claim in (B) is that no such
      solver for generic-block block-circulant systems is known; it is a claim
      about the state of the literature, discharged by STEP 4, and it is
      explicitly falsifiable by exhibiting one. It is NOT a claim that none can
      exist - that would violate the Idea Generator prohibition on declaring a
      direction impossible.
    - >-
      Sparse Wiedemann cost is modelled as 2 B matrix-vector products of cost
      nnz each. Blocking, preconditioning and Coppersmith's block variant change
      constants and parallelism, not the ratio between the equivariant and plain
      cases, which is what the argument is about.
    - >-
      nnz_j <= nnz / g requires each g x g circulant block to carry a single
      nonzero coefficient - the sparse regime. In the dense-block regime the
      bound is nnz_j <= nnz and the sparse gain degrades from g toward 1. This is
      measured in STEP 3 rather than assumed, and it is the argument's most
      fragile numerical step.

  proof_search_map:
    bottleneck: >-
      The exact step whose removal would change the conclusion: the absence of a
      softly-linear solver for a generic (B/g) x (B/g) block. If such a solver
      existed the whole ceiling would move. STEP 4 is therefore not
      bibliographic decoration; it is the load-bearing search.
    baseline_embedding:
      parameter_slice: >-
        g = 1 (no group). The argument must reduce to plain Wiedemann at
        2 B * nnz with no split, exactly reproducing the incumbent cost model.
        And g = n on a subfield curve must reproduce eprint 2020/1315's stated
        1/n and n^2.
      reproduction_check: >-
        Symbolic in both directions: set g = 1 in every formula of (C) and check
        that all three cost models collapse to 2 B * nnz; set g = n and check the
        formulas yield exactly the published 1/n and n^2. A cost model that does
        not reproduce the published result at its own parameter value is not an
        embedding and the argument halts.
    observation_collision:
      observable: >-
        The measured ratio (blockwise cost) / (plain cost), predicted 1/g.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED: NULL 1 (a random equivariant matrix
        with no curve) and the genuine relation matrix give the SAME ratio. The
        collision is total and it is the point - the ratio is a property of the
        algebra. It fixes exactly what may be concluded: the factor g is not
        evidence about elliptic curves, about Semaev systems or about
        endomorphisms; it is arithmetic about C_g. Reporting it otherwise is
        prohibited.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move "does equivariance help" into the exact algebra-isomorphism
          statement A = product of M_{B/g}(F_N). Encoding: the idempotents e_j;
          completeness: sum e_j = I; soundness: e_j e_k = delta_{jk} e_j;
          transfer: the blocks solve the original system; cost-loss: the DFT
          costs nnz field operations, negligible.
        predicted_gain: >-
          Converts an open cost-model objection (RT-CM-1) into a decided one,
          and converts a vague "block structure helps" into the exact constants
          g and g^2 with a prohibition on multiplying them.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the factor-g ratio) fixed and vary the forgotten
          structure: curve-derived versus synthetic equivariant matrices. The
          intrinsic invariant that distinguishes them is NOT the ratio - it is
          the informative rank of IDEA-20260807-0e4d83, which is where any real
          curve content would have to live.
        predicted_gain: >-
          Redirects the lane's measurement effort from a quantity that cannot
          carry curve content to one that could.
    quantifier_order: >-
      Intended: FORALL finite abelian groups C_g with gcd(g, N) = 1 and mu_g
      contained in F_N, FORALL matrices M in the commutant of the regular
      representation on F_N^B, THERE EXISTS an algebra isomorphism (independent
      of M, depending only on g and B) carrying M to g blocks of size B/g; and
      FORALL such M, the blockwise sparse solve costs at most (1/g) times the
      plain solve. The isomorphism is uniform in M - that uniformity is what
      makes it a change of coordinates rather than an M-dependent trick, and it
      is exactly the quantifier order that makes the section-2 verdict bite.
      The dangerous weaker reading, NOT claimed: for each M there exists SOME
      basis in which it splits, which is true of far more matrices and would
      prove nothing.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Equivariance under a finite abelian group of order g, acting freely on
        the factor base with g | N - 1, reduces the sparse linear-algebra cost
        by exactly a factor g relative to the same matrix solved without the
        split, and by g^2 relative to a size-matched generic factor base; and it
        supplies no further structure inside the blocks." It can NEVER certify a
        statement about relation collection, about arity, about non-abelian
        groups, about groups whose order divides N, or about the ECDLP.
      nearby_object_control: >-
        Two of them, both mandatory. (i) The S_m summand action (EV-EQJ-001),
        where the hoped-for conclusion FAILS and the argument must predict that
        failure. (ii) A subfield curve with g = n, where the conclusion holds and
        is unbounded - the argument must reproduce eprint 2020/1315 there. An
        argument that cannot distinguish these two from the prime-field case has
        not identified the load-bearing structure, which is precisely
        "does the group act on G as a scalar, and how large can it be".
    proof_obligations:
      - claim: The idempotents e_j are orthogonal and sum to the identity.
        responsibility: correctness
      - claim: The block map is an algebra isomorphism (nothing is lost).
        responsibility: correctness
      - claim: nnz_j <= nnz / g in the sparse regime.
        responsibility: size
      - claim: Blockwise sparse solve costs at most (1/g) times the plain solve.
        responsibility: runtime
      - claim: >-
          No softly-linear solver for generic-block block-circulant systems is
          known.
        responsibility: feasibility
      - claim: The argument retrodicts EV-EQJ-001's measured non-splitting.
        responsibility: baseline
      - claim: g <= 3 on x-coordinates of a prime-field curve.
        responsibility: scope

  heuristic_assumptions:
    - id: HEUR-L5-5
      statement: >-
        NO HEURISTIC IS LOAD-BEARING FOR THE ALGEBRA. Maschke, Wedderburn and the
        DFT diagonalisation of F_N[C_g] are theorems under the stated coprimality
        and root-of-unity hypotheses, both of which are verified per instance.
      rigorous_support: >-
        Standard representation theory of finite abelian groups over a splitting
        field of characteristic coprime to the group order.
      validation_plan: >-
        The idempotent known-answer test of STEP 1 validates the implementation
        against the theorem; it is reported as an implementation check and never
        as evidence for the theorem.
    - id: HEUR-L5-6
      statement: >-
        In the regime this lane operates in, the nonzero coefficients of the
        relation matrix are spread across orbits so that each g x g circulant
        block carries at most one nonzero coefficient, giving nnz_j <= nnz / g.
      rigorous_support: >-
        Imitates the standard sparse-relation heuristic that a weight-m relation
        touches m distinct factor-base elements, hence m distinct orbits, with
        probability 1 - O(m^2 g / B). It is NOT a theorem: relations touching two
        elements of the same orbit exist and are exactly the free relations of
        IDEA-20260807-61049d.
      validation_plan: >-
        Measure, per instance, the fraction of harvested relations whose support
        meets some orbit more than once, and report nnz_j / (nnz / g) directly
        rather than assuming it is 1. Predicted distribution: the number of
        within-orbit collisions in a weight-m random subset, i.e. binomial with
        mean about m(m-1)(g-1)/(2B). Tail check: the maximum per-instance
        collision count. TOY SCALE ONLY.

  predictions:
    - metric: blockwise_sparse_cost / plain_sparse_cost (all g blocks)
      direction: lower
      minimum_effect: >-
        In [0.8/g, 1.2/g] on both the curve arm and NULL 1, i.e. about 1/3 for
        g = 3. A ratio materially below 1/g on the curve arm and not on the null
        would mean the curve contributes structure the algebra does not explain
        and would be the one interesting event.
    - metric: informative_block_cost / plain_sparse_cost (one block only)
      direction: lower
      minimum_effect: >-
        In [0.8/g^2, 1.2/g^2], i.e. about 1/9 for g = 3, and identical on the
        null. This is the honest headline constant of the whole L5 lane.
    - metric: >-
        the H-STR-002 model value alpha^2 B ceil(log2 B) divided by the measured
        blockwise cost
      direction: different
      minimum_effect: >-
        Report it, do not defend it. Predicted: at alpha = 1 and B = 397 the
        H-STR-002 model gives 397 * 9 = 3573 operations for a system whose
        informative block alone is 132 x 132; any model asserting that a
        132 x 132 generic solve costs 3573 field operations is asserting a
        softly-linear solver, and the burden is to exhibit it. A gap of two
        orders of magnitude is the expected finding.
    - metric: reassembly exactness in STEP 2 as a function of equivariance fraction c
      direction: different
      minimum_effect: >-
        Exact at c = 1, failing for c < 1 with the failure magnitude rising
        monotonically as c falls. A reassembly that stays exact at c = 0 means
        the blocks are not being formed from the matrix and every ratio is void.

  minimal_test:
    design: >-
      This is an argument; its "test" is a symbolic audit plus a cheap
      measurement, and it costs almost nothing.
      STAGE 0 (zero compute): STEP 4, the literature obligation. Run it FIRST,
      because a positive hit inverts the record.
      STAGE 1 (seconds): STEP 1 idempotent known-answer test, per instance.
      STAGE 2 (seconds): STEP 2 isomorphism/reassembly check, on random
      equivariant matrices and on a curve-derived one.
      STAGE 3 (minutes): STEP 3, all four cost models on identical instances, in
      field operations, with peak memory beside each.
      STAGE 4 (minutes): NULL 1 across equivariance fraction c; NULL 3
      non-coprime synthetic.
      STAGE 5 (zero compute): STEP 5 retrodiction of EV-EQJ-001, then write the
      closure at the section-4 standard.
    controls:
      - >-
        NULL 1 - matched random equivariant matrix, identical shape, density and
        column-orbit structure, swept over the equivariance fraction c.
      - >-
        NULL 2 - the S_m summand action; the argument must predict EV-EQJ-001's
        measured non-splitting.
      - NULL 3 - synthetic non-coprime instance where Maschke fails.
      - g = 1 and g = n limiting cases, symbolically.
      - >-
        Matched Pollard rho with negation and BSGS in group operations for the
        Pareto row, even though nothing is attacked.
    required_metrics:
      - idempotent orthogonality residuals (must be exactly zero over F_N)
      - reassembly exactness flag per matrix and per c
      - nnz, nnz_j for each j, and the measured nnz_j / (nnz / g)
      - all four cost-model values in field operations, plus peak memory
      - the three ratios in predictions, curve arm and null arm
      - within-orbit support-collision fraction per instance (HEUR-L5-6)
      - the literature search log for STEP 4, with what was searched and found

  falsification_conditions:
    - >-
      STEP 4 finds a softly-linear solver for generic-block block-circulant or
      finite-order-commutant systems. The named obstruction is false, the
      ceiling moves, and this record is superseded by one that adopts the
      solver. This is the outcome the record would most like to be wrong about
      and it is checked first.
    - >-
      The measured blockwise ratio is materially below 1/g on the curve arm and
      NOT on the matched null. The algebra does not explain the saving and
      something curve-specific is present; independent review before any
      interpretation.
    - >-
      The reassembly check fails at c = 1. The block construction is wrong and
      every cost number in the record is void - an instrument failure, not a
      mathematical result.
    - >-
      The argument fails to retrodict EV-EQJ-001's non-splitting. It does not
      capture the distinction between scalar and non-scalar group actions, and
      it is not ready to be a closure.
    - >-
      Someone exhibits a factor base over F_p, stable under a group of order
      g > 3 acting on x-coordinates by maps of degree o(B) and acting on G by
      publicly known scalars. The ceiling g <= 3 is false as stated and the lane
      reopens. IDEA-20260807-45a69f is the deliberate attempt to do exactly this.

  confounders:
    - >-
      COST UNITS. EV-STR-003 recorded RT-CM-6, non-comparable units, as OPEN.
      All four cost models must be reported in the SAME unit (field
      multiplications in F_N) with memory beside them, or the comparison repeats
      the defect.
    - >-
      alpha = 0 DEGENERACY. RT-CM-2 records that the H-STR-002 model prices an
      alpha = 0 matrix at zero operations. Any comparison including model (d)
      must handle alpha = 0 explicitly rather than reporting a zero cost.
    - >-
      THE BASELINE IS ALREADY NEGATION-QUOTIENTED. Comparing the phi structure
      against a baseline that has not spent the factor 2 inflates the apparent
      gain from 3 to 6. Every reported ratio must name which baseline it uses.
    - >-
      RECTANGULAR SYSTEMS. Relation matrices are R x B with R > B. The
      commutant argument is stated for square matrices; for rectangular ones the
      correct statement is about the module map, and the block sizes are
      (R/g) x (B/g). EV-STR-003 recorded that the rectangular limb of the
      committed displacement code was NEVER EXERCISED in 16 of 16 cells, so this
      is not a hypothetical gap.
    - >-
      PARALLELISM. A g-fold block split is embarrassingly parallel; a plain
      Wiedemann is not, but Coppersmith block Wiedemann is. Comparing serial
      operation counts while one side is trivially parallel and the other needs
      blocking is a real confounder for any wall-clock statement, and no
      wall-clock statement is made here for that reason.

  interpretation_limits:
    - >-
      THE LINEAR-ALGEBRA STAGE IS NOT THE DOMINANT COST OF PRIME-FIELD INDEX
      CALCULUS - RELATION COLLECTION IS. EV-STR-001 measured the linear-algebra
      share at 0.4% to 3% of the charged total at p = 211, 1009 and 4099. The
      entire ceiling this record establishes - a factor of at most 9 - applies to
      that share. Multiplied through, the best possible effect of the whole L5
      lane on a charged total is under 3%, and that is BEFORE the density penalty
      is charged. This limit belongs in any summary of this record.
    - >-
      Toy tier for the measured limb; the algebraic limb is scale-free but is an
      argument about cost models, not about the ECDLP.
    - >-
      This is a closure of ONE mechanism (finite-abelian-group equivariance of
      the relation matrix over a prime field) within a stated scope. It declares
      NO direction impossible and it names four open classes in (E).
    - >-
      It does not reject, restore or otherwise move H-STR-002, and it is not
      authorised to. It answers RT-CM-1, one of six open cost-model objections;
      RT-CM-2 through RT-CM-6 remain open and must not be described as settled by
      this record or by any record citing it.

  reachability_gate: >-
    T5's isogeny-walk form does not apply; no curve is moved between. T4 binds
    and is the sharpest statement available: g = 3 requires D_0 = -3 and g = 2
    (on x-coordinates) requires D_0 = -4, both fixed by the isogeny class and
    unreachable by any walk from a class lacking them. So the ceiling of this
    record is not merely small, it is unreachable for the generic prime-field
    curve at any cost - g = 1 there and the entire lane is empty. Cost of
    reaching a good object from a generic curve: infinite. Within the D_0 = -3
    family the object is free (B multiplications by zeta). SCOPE NOTE, not an
    attack claim: secp256k1 has a = 0 and lies in the family, so the ceiling
    applies to it and equals a factor of at most 9 on a stage worth at most 3%.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES IN EITHER DIRECTION, AND THE RECORD'S CONTENT IS THAT
      NONE CAN, BY THIS MECHANISM, OVER A PRIME FIELD. The claim is explicitly
      and only a constant factor: at most g = 3 in sparse linear-algebra
      operations relative to the same matrix, at most g^2 = 9 relative to a
      size-matched generic factor base, and 0 additional beyond the orbit
      quotient because they are the same operation. Where more WOULD have to
      come from, if it came: a group of unbounded order acting on the factor
      base with all three properties of (D). Over F_p no such group is exhibited
      and (D) argues why; over F_{q^n} Frobenius is one and eprint 2020/1315 is
      the result.
    memory_exponent: >-
      Constant factor g^2 = 9 at the linear-algebra stage (a (B/3) x (B/3) block
      instead of B x B) and g = 3 in stored relations. No exponent moves. The
      DFT change of basis is in-place up to a factor g of temporaries.
    best_known: >-
      Parallel rho with distinguished points at 0.886 sqrt(N) group operations
      and O(1) memory (KN-TECH-001, KN-TECH-006); automorphism-discounted rho at
      about 0.36 sqrt(N) on j = 0 (KN-TECH-018); BSGS at 2 sqrt(N) time and
      sqrt(N) memory, full cost N^{2/3+o(1)} (KN-TECH-031). For the
      linear-algebra stage: sparse Wiedemann at 2 B * nnz, with the classical
      orbit-representative reduction already available (KN-TECH-018, and eprint
      2020/1315 in the extension-field setting).
    hidden_overhead: >-
      No o(1), since no asymptotic claim. Disclosed instead, and it is the
      important disclosure: the factor g in RELATIONS NEEDED is contingent on the
      density penalty being below g, and EV-STR-002 measured 2-3x for g = 3.
      If the penalty equals g the relation-side saving is exactly zero and only
      the linear-algebra factor g^2 on a 3% stage remains, i.e. under 3% of the
      total. That is the honest bottom line of the L5 lane as currently
      understood.
    tradeoff_note: >-
      The g-fold split is embarrassingly parallel across blocks, which is its
      one genuine practical merit and is worth recording; but Coppersmith block
      Wiedemann already parallelises the unsplit problem, so the marginal
      parallelism gain is also a constant. No cryptanalytic time-memory tradeoff
      is produced.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES, and not null. As an
    attack: none is mounted, so dominated on every axis by parallel rho
    (0.886 sqrt(N) time, O(1) memory, KN-TECH-001/KN-TECH-006), by
    automorphism-discounted rho on these exact curves (about 0.36 sqrt(N),
    KN-TECH-018), and by BSGS (2 sqrt(N) time, sqrt(N) memory, KN-TECH-031). As
    a COST MODEL for the equivariant linear-algebra stage: the incumbent is
    H-STR-002's alpha^2 B log B, which this record argues is invalid; the
    genuinely dominating alternative is plain Wiedemann on the orbit-quotient
    matrix at 2 (B/g)^2 w, which this record shows equals the block route
    exactly - so the two are Pareto-INCOMPARABLE (identical cost) and the
    quotient route dominates on implementation simplicity. As a CLOSURE: nothing
    in this repository currently answers RT-CM-1, so nothing dominates it there.
  sota_delta: >-
    Zero speedup against any attack baseline. Quantitatively: establishes an
    upper bound of g = 3 on the sparse linear-algebra saving and g^2 = 9 against
    a size-matched generic factor base, against a stage measured at 0.4% to 3%
    of charged total (EV-STR-001), giving a hard ceiling under 3% on the whole
    L5 lane's effect - versus the H-STR-002 cost model's implied claim of
    B/alpha^2/log B, which at B = 397 and alpha = 1 is a factor of about 44 and
    is argued here to be unattainable by any exhibited algorithm. The delta
    between the claimed and the defensible saving is therefore about 44 versus
    at most 9, on a stage worth at most 3%.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that STEP 4 finds no softly-linear solver for generic-block
    block-circulant systems, so the named obstruction stands. 0.95 that the
    measured ratios land at 1/g and 1/g^2 on both arms. 0.8 that the argument
    retrodicts EV-EQJ-001 cleanly. 0.85 that the g <= 3 ceiling on x-coordinates
    survives challenge - the residual risk is entirely in
    IDEA-20260807-45a69f's attempt to exhibit a larger group, which is filed
    precisely so that this ceiling is attacked rather than assumed. Overall this
    is the cheapest high-confidence deliverable in the lane and its value is
    that it converts an open objection into a decided one and prevents the
    lane's constants from being multiplied together.

