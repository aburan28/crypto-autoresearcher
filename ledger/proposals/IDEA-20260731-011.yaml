idea:
  id: IDEA-20260731-011
  question_id: RQ-ECDLP-002
  title: Structure-destruction null control — any claimed sub-birthday ECDLP speedup must vanish under
    a same-shape null object
  class: control
  claim: For any proposed prime-field ECDLP algorithm A that reports wall-clock or operation counts below
    0.7 * matched_rho on a toy curve family F, the same implementation run on a null object N(F) that
    preserves bit sizes, group order magnitude, and API shape but DESTROYS the algebraic structure A claims
    to exploit (e.g. replace curve addition with a random regular oracle of equal cost; or replace Semaev
    polynomials with random multihomogeneous systems; or scramble endomorphism eigenvalues) will NOT reproduce
    a comparable speedup. Specifically the null speedup ratio R_null = cost_A(N(F))/matched_rho_null stays
    >= 0.95 whenever the real ratio R_real = cost_A(F)/matched_rho is < 0.7. A method that is equally
    fast on the null object is packaging an implementation artifact, not a mathematical ECDLP advance
    (inventor-protocol controls-before-belief).
  mechanism: 'The inventor protocol requires that apparent signals be tested against null objects of the
    same shape before belief. ECDLP proposals in this ledger have repeatedly confused instrument effects
    (displacement rank, p-flat query costs, incomplete matrices) with mechanism. This control is a reusable
    gate: no sub-birthday claim proceeds to support/promote without a documented null that fails to show
    the same speedup. It complements IDEA-20260727-004 (simulation-overhead budget) by targeting empirical
    speedups rather than GGM simulability verdicts.'
  novelty_status: adaptation
  novelty_screen:
    screened_on: '2026-07-31'
    corpus_paths_grepped:
    - docs/inventor-protocol.md
    - ledger/proposals
    grep_results:
    - Inventor protocol §3 mandates null-object controls; no dedicated RQ-ECDLP-002 IDEA installs a reusable
      structure-destruction gate for sub-birthday claims.
    literature_verified: []
    conclusion: Adaptation of inventor-protocol control into a ledger-ready experiment template.
  assumptions:
  - A candidate algorithm A with a claimed R_real < 0.7 exists or is planted as a positive control.
  - Null objects are specified per mechanism class before execution.
  predictions:
  - metric: null_vs_real_speedup_gap
    direction: higher
    minimum_effect: R_null - R_real >= 0.25 whenever R_real < 0.7 for structure-exploiting A
  minimal_test:
    design: 'Plant a positive control: BSGS or rho with an artificial 4x operation-count bug that reports
      false speedup. Confirm the null control FLAGS it (R_null also low). Then apply the gate to any live
      candidate claiming R_real<0.7 (initially: none required; the deliverable is the harness plus positive-control
      pass). Include Semaev-random and random-oracle nulls.'
    controls:
    - 'Positive control: planted false speedup must be detected.'
    - 'Negative control: honest matched rho on real vs null must show R_real ≈ R_null ≈ 1.'
    - Matched BSGS.
    required_metrics:
    - R_real, R_null, detection flag for planted bug
    - null-object specification hash per run
  falsification_conditions:
  - 'Planted false speedup not detected: harness void.'
  - 'Honest rho shows R_real < 0.7 vs R_null >= 0.95: calibration bug.'
  confounders:
  - Poor null design that accidentally preserves the exploited structure.
  - Wall-clock noise at toy scale; prefer operation counts.
  interpretation_limits:
  - Passing the null gate is necessary, not sufficient, for a real exponent claim.
  - Does not itself move ECDLP exponents.
  heuristic_assumptions:
  - id: HEUR-NULL-1
    statement: For each named mechanism class (Semaev-IC, endomorphism-lattice, isogeny-transfer, GGM-oracle),
      there exists a polynomial-time-samplable null object that preserves cost-model API shape while removing
      the structural invariant the mechanism cites.
    rigorous_support: Methodological; construction is per-class and must be argued in the frozen protocol.
    validation_plan: Positive planted-bug control plus honest-rho negative control as in minimal_test.
  target_complexity:
    time_exponent: n/a (control gate)
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: Null construction cost must stay << candidate runtime or the gate is impractical
    tradeoff_note: n/a
  dominated_by: null
  sota_delta: No attack delta; methodology delta — blocks false sub-birthday promotions
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
