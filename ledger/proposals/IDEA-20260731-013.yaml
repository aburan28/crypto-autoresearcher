idea:
  id: IDEA-20260731-013
  question_id: RQ-ECDLP-002
  title: >-
    Shared distinguished-point table for T-target Pollard rho — measuring the
    multi-target generic baseline that every IC amortization claim compares
    against
  class: measurement
  claim: >-
    Let E/F_p carry a prime-order subgroup G of order N and let
    {Q_1..Q_T} be T uniform independent targets. Two generic constructions are
    compared in a single cost convention. (A) INDEPENDENT RUNS: T Pollard-rho
    walks, one per target, total expected cost 0.886 * T * sqrt(N) group ops
    (fitted exponent gamma = 1 in total = N^{1/2} * T^{gamma}). (B) BATCH/SHARED
    TABLE: a pseudorandom walk that simultaneously tracks all T targets with a
    single shared distinguished-point table (each step tests the current point
    against the T target tags; a DP collision within one target's tag resolves
    that target). The ledger currently carries the claim that construction (B)
    solves all T targets in ~sqrt(T*N) total group ops (per-target ~sqrt(N/T),
    i.e. gamma = 1/2) as UNVERIFIED (flagged in IDEA-20260731-012 matched
    baseline); this measurement installs it as a measured, archived baseline or
    kills it at tested scope. CLAIM: at toy scale, construction (B) fits
    gamma in [0.45, 0.60] with constant c(T,N) = total / sqrt(T*N) in
    [0.5, 2.0] and no monotone trend in T or N, and — the structural half — a
    same-shape random-function walk (no group law, same state space and DP
    rule) reproduces gamma and c within fit error, |gamma_EC - gamma_null|
    <= 0.05: the sharing advantage is a generic birthday phenomenon, not ECDLP
    structure. A deviation |gamma_EC - gamma_null| > 0.15 is a non-generic
    multi-target signal and requires independent review before any
    interpretation. This baseline is the "matched multi-target rho" that
    SG-ECDLP-004, IDEA-20260731-010, and IDEA-20260726-001 compare against and
    is currently unmodeled in this ledger.
  mechanism: >-
    ATTACK OBJECT: the batch/shared distinguished-point-table walk as a generic
    algorithm over (G, P, {Q_i}) — not "ECDLP" generically and not an IC
    construction. The multi-target advantage is a birthday effect: a single
    walk's point stream collides with T target orbits, so the first resolution
    arrives after ~sqrt(N/T) steps; the open quantities are (i) whether a
    shared-table implementation realizes the full T^{1/2} total-work reduction
    (gamma = 1/2) or degrades toward gamma = 1 through tag-collision overhead
    and DP-table contention, and (ii) which constants attach (negation
    canonicalization 0.886 vs a null's 1.0, x-only vs full-coordinate steps).
    The Corrigan-Gibbs-Kogan bound S*T^2 = Omega~(eps*N) (KN-LIT-013) supplies
    the rigorous lower reference: in the small-advice regime (S = N^{o(1)}) the
    total work to solve T targets is Omega~(sqrt(T*N)), so gamma = 1/2 is the
    floor the generic construction is the candidate to saturate — the
    measurement checks saturation and constants. Every multi-target IC claim in
    this ledger (SG-ECDLP-004 amortization, IDEA-20260731-010, IDEA-20260726-001
    crossover) compares against "matched multi-target rho" without an archived
    model of construction (B); a wrong baseline constant or exponent invalidates
    those comparisons symmetrically in both directions. The null-walk arm is the
    inventor-protocol section-3 control: a random-function walk on an N-state
    set with the same DP rule must reproduce gamma and c, isolating the
    birthday effect from curve arithmetic. Distinct from parallel rho on M
    processors (IDEA-20260727-008/005: wall-time T = N^{1/2}/M, total work
    unchanged — a processor axis, not a target-amortization axis) and from
    KN-LIT-013 itself (the asymptotic tradeoff bound, not an implementation
    constant measurement).
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-07-31'
    corpus_paths_grepped:
    - ledger/proposals
    - ledger/hypotheses
    - knowledge/INDEX.md
    - knowledge/techniques
    - knowledge/open-problems
    - knowledge/literature
    grep_results:
    - >-
      The multi-target rho construction is classical folklore (parallel/batch
      rho; van Oorschot-Wiener distinguished-point practice), but no ledger
      record measures or archives its total-op exponent in T or its constants;
      the ledger's own baseline convention flags it UNVERIFIED (IDEA-20260731-012
      matched_baseline: "shared distinguished-point table ~ sqrt(T*N) total ops —
      UNVERIFIED (standard Kuhn-Struik-style claim, not archived in this
      corpus)").
    - >-
      IDEA-20260727-008 and IDEA-20260727-005 use distinguished points only as
      parallel-rho wall-time (T = N^{1/2}/M on M processors) and as the
      endomorphism-witness MITM; neither measures target-amortization scaling in
      T. IDEA-20260731-003 (FAEST, RQ-FAEST-001) uses distinguished points only
      for collision-search memory charging — different question, no overlap.
    - >-
      IDEA-20260726-001 measures the IC-vs-frontier crossover (the IC side);
      IDEA-20260731-010 measures IC amortization (the IC side); neither measures
      the generic baseline construction itself. This record's object is the
      baseline, which is precisely the quantity those records need as the
      matched control and currently lack.
    - >-
      KN-OPEN-001 (does IC beat rho on prime fields) and KN-OPEN-019 (attack
      object closure) are adjacent open questions; this record does not claim to
      resolve them, only to pin the generic multi-target reference line.
    literature_verified:
    - KN-LIT-013 (Corrigan-Gibbs-Kogan preprocessing bound; archived)
    - KN-TECH-005 (generic GGM lower bound; archived)
    conclusion: >-
      Classical construction, unmeasured in this ledger; the contribution is the
      archived baseline with the random-function null control and the fitted
      gamma. novelty_status unverified, not stronger: the underlying construction
      is prior art and no novelty is claimed for it.
  assumptions:
  - All T targets are uniform independent elements of the same prime-order
    subgroup G (fresh (a,b) pair per target, never reuse).
  - The DP rule (probability theta of being distinguished), the step function,
    and the tag test are frozen before execution and applied identically to the
    EC walk and the null walk.
  - T <= 512 and N in {2^16, 2^20, 2^24} are the tested envelope; any
    extrapolation beyond it is a model statement.
  - Construction (B) is implemented as stated (shared table, per-step tag
    test); a tag test costs one group addition per target per step and is
    charged in group-operation equivalents.
  predictions:
  - metric: total_ops_exponent_in_T_gamma
    direction: different
    minimum_effect: >-
      Construction (B) fits total = c * N^{1/2} * T^{gamma} with gamma in
      [0.45, 0.60] (R^2 >= 0.95, >= 3 T-points per N) at >= 2 of 3 tested bit
      sizes, against gamma ~ 1.0 for construction (A) independent runs on the
      same instances. A fitted gamma >= 0.85 on (B) falsifies the sqrt(T*N)
      claim at tested scope.
  - metric: shared_table_constant_c_T_N
    direction: different
    minimum_effect: >-
      c(T,N) = total / sqrt(T*N) lies in [0.5, 2.0] at every tested (T, N)
      cell with no monotone trend in T or N beyond the reported fit interval.
  - metric: null_vs_ec_gamma_gap
    direction: lower
    minimum_effect: >-
      |gamma_EC - gamma_null| <= 0.05, where the null is a random-function walk
      on an N-state set with the identical DP rule and tag semantics. A gap
      > 0.15 is a non-generic signal (reportable, review-required, not
      discardable).
  - metric: memory_axis_shared_vs_independent
    direction: lower
    minimum_effect: >-
      Shared-table memory in bits is reported at every cell and compared with T
      independent tables; the prediction is a measured memory reduction factor
      at least 2 at T = 64 (the sharing effect on storage), reported separately
      from the time exponent.
  minimal_test:
    design: >-
      Toy scale, N in {2^16, 2^20, 2^24} prime-order subgroups, T in
      {1, 2, 4, 8, 16, 32, 64, 128, 256, 512}. (1) Implement construction (A):
      T independent rho walks with negation canonicalization; record total
      group ops to solve all T targets, seeds logged. (2) Implement construction
      (B): one shared DP table, per-step tag test against all T targets, DP rule
      theta pre-registered; record total group ops, DP-table size, and per-target
      resolution order. (3) Implement the NULL walk: a random function on an
      N-state set (realized by a fixed random table or a hash of the state)
      with the identical DP rule and tag semantics; same measurements. (4) Fit
      gamma by log-log regression of total ops against T at each N, for (A),
      (B), and null; report intervals and R^2. (5) Report c(T,N), the memory
      axis, and the resolution-order statistics (order in which targets are
      solved: uniform vs systematic is itself a walk-quality diagnostic). (6)
      Repeat at N = 2^20 with theta varied by 4x to confirm gamma is theta-
      invariant (a theta-dependent gamma means the DP rule is a confounder, not
      a parameter).
    controls:
    - >-
      Independent-runs control (construction A) on identical instances and
      seeds: the gamma = 1 reference line.
    - >-
      Random-function null walk (same state space, same DP rule): must reproduce
      gamma and c within fit error; the canonical inventor-protocol section-3
      control for the claim that the sharing gain is generic.
    - >-
      Planted-bug positive control: corrupt the tag test for one target (wrong
      multiple); the harness must fail to resolve that target while resolving
      the others — otherwise the resolution accounting is not trustworthy.
    - >-
      Negation-calibration control: single-target rho with vs without negation
      must show the 0.886 vs ~1.0 constant difference; a harness that cannot
      resolve a known constant cannot certify an exponent.
    - >-
      Matched BSGS with memory reported (single-target sanity at each N);
      multi-target BSGS amortization reported separately, never merged into the
      rho baseline.
    - >-
      Scale control: gamma fit across >= 3 T-points per N with pre-registered
      fit-quality rule (R^2 >= 0.95, else the size is dropped by the rule, not
      after seeing gamma).
    required_metrics:
    - total group ops per (construction, N, T) cell, with seed log
    - fitted gamma and constant per construction with intervals and R^2
    - c(T,N) table and trend-slope intervals
    - gamma_null and the gap |gamma_EC - gamma_null| per N
    - DP-table size in bits per cell, shared vs independent
    - resolution-order statistics per cell
    - theta-sweep gamma stability at N = 2^20
    - matched BSGS ops and memory; planted-bug control outcome
  falsification_conditions:
  - 'TOY-TIER FALSIFIER: construction (B) fits gamma >= 0.85 at all tested N
    with successful resolution of all T targets — the sqrt(T*N) sharing claim
    is absent in tested scope; the ledger''s multi-target baselines must use
    T * 0.886 * sqrt(N) (independent runs) and SG-ECDLP-004 comparisons must be
    re-read accordingly. Toy-scope statement only.'
  - 'TOY-TIER FALSIFIER: c(T,N) outside [0.5, 2.0] with a monotone trend in T
    or N — the model is wrong in a stated direction; report and re-derive
    before any baseline use.'
  - 'STRUCTURAL SIGNAL (not a falsifier of the measurement, a falsifier of the
    generic-model null): |gamma_EC - gamma_null| > 0.15 reproduced across
    seeds — a non-generic multi-target effect; independent review required
    before any interpretation, per AGENTS.md rule 12 if promoted.'
  - 'Infrastructure: failure to resolve all T targets within the declared
    budget on either construction, or a theta-dependent gamma at the 4x sweep —
    infrastructure-inconclusive, not evidence against the sqrt(T*N) claim.'
  confounders:
  - Tag-test cost per step scales as T group additions; at large T this term can
    dominate the walk itself, biasing gamma upward — the tag test must be
    charged identically on EC and null walks and its share of total cost
    reported per cell.
  - DP-table contention and resolution-order effects (the first target is cheap,
    the last expensive) make the TOTAL-work metric the only pre-registered
    primary; per-target order statistics are diagnostics, not claims.
  - The negation constant 0.886 applies to the EC walk; the null walk has no
    negation, so the constants differ by construction — the exponent gamma, not
    the constant, is the comparable quantity, and this is why the gap metric is
    on gamma.
  - At toy N the birthday regime is barely entered for small T; T >= 8 at the
    smallest N may be required for a stable fit, decided by the pre-registered
    fit-quality rule.
  interpretation_limits:
  - A confirmed gamma ~ 1/2 pins the generic multi-target baseline at toy scale;
    it is a baseline calibration, not an attack improvement and not an ECDLP
    statement of any kind beyond the generic model.
  - The CGK bound (KN-LIT-013) already guarantees total = Omega~(sqrt(T*N)) in
    the small-advice regime; a measured gamma >= 1/2 is therefore a saturation
    confirmation, never a novelty, and any claim of a non-generic multi-target
    gain requires the null-gap signal above.
  - The baseline directly serves SG-ECDLP-004 (shared-factor-base multi-target
    IC amortization) as its matched rho reference; it does not by itself move
    any single-target exponent.
  - Toy envelope only (N <= 2^24, T <= 512); crypto-scale constants and any
    memory-subsystem effects are out of scope and must not be extrapolated.
  heuristic_assumptions:
  - id: HEUR-MT-RHO-1
    statement: >-
      For T uniform targets on one curve, the batch/shared-DP-table construction
      solves all T targets in c * sqrt(T*N) * (1 + o(1)) group operations with
      c bounded (0.5 <= c <= 2.0), i.e. the per-target cost decays as
      sqrt(N/T), saturating the Corrigan-Gibbs-Kogan small-advice floor, and the
      constants (negation, DP rule) shift c but not the exponent in T.
    rigorous_support: >-
      The lower bound is RIGOROUS: KN-LIT-013 (archived) gives S*T^2 =
      Omega~(eps*N), which at S = N^{o(1)} advice forces total work
      Omega~(sqrt(T*N)). The upper side is the classical birthday/occupancy
      model for one walk against T tagged orbits (the multi-target birthday
      effect), which is the standard random-model justification; the classical
      distribution statement imitated is the coupon-collector/birthday analysis
      of parallel rho. What is heuristic is that a shared-table implementation
      attains the floor without tag-collision overhead degrading gamma.
    validation_plan: >-
      Sampled quantity: total group ops per (N, T) under construction (B) and
      the null walk. Shortcut: toy N makes full resolution feasible with logged
      seeds. Comparison distribution: the gamma fit against the RIGOROUS floor
      line (gamma = 1/2); the null walk must agree with the EC walk on gamma —
      the distribution-level comparison that licenses the generic interpretation.
      Tail consistency check: the resolution-order statistics (last-target cost
      vs first-target cost) against the coupon-collector prediction. LABEL:
      TOY-SCALE; extrapolation beyond N = 2^24 / T = 512 is a model statement.
  target_complexity:
    time_exponent: >-
      Measurement record: claims no attack improvement. The quantity pinned is
      the exponent of total work in T for the generic multi-target baseline:
      gamma = 1 (independent runs, construction A) vs the candidate gamma = 1/2
      (construction B), against the rigorous CGK floor total = Omega~(sqrt(T*N)).
    memory_exponent: >-
      Construction (B) shared table: theta-scaled walk length entries, measured
      in bits and reported per cell; independent runs (A) need no table. The
      memory-time tradeoff of the DP rule is a measured axis, not an assumption.
    best_known: >-
      Single-target: Pollard rho ~0.886 sqrt(N) group ops, N^{o(1)} memory
      (KN-TECH-001); BSGS 2^{n/2} time x n*2^{n/2} bits (KN-TECH-031/035).
      Multi-target: CGK floor sqrt(T*N) (KN-LIT-013); no archived ledger
      measurement of the implementation constants.
    hidden_overhead: >-
      The per-step tag test costs T group additions and is charged; its share of
      total cost is reported per cell. DP-rule constants (theta, storage layout)
      are disclosed per run; o(1) terms are not claimed because no exponent
      improvement is claimed.
    tradeoff_note: >-
      The DP rule trades memory (table size ~ theta * walk length) against
      expected walk length; theta-invariance of gamma at the 4x sweep is the
      control that this tradeoff is a constant, not a confounder. Parallelization
      is a processor axis (van Oorschot-Wiener), deliberately out of scope.
  matched_baseline: >-
    SAME COST CONVENTION ON BOTH SIDES, serial classical: costs in
    group-operation equivalents (1 point addition = 1 op; scalar multiplications
    charged by their operation count); memory charged separately in bits (table
    entries x bit-width); preprocessing and query data charged (factor base,
    sumset tables, pool, walk data). Baselines written down: Pollard rho ~ 0.886
    * 2^(n/2) group ops serial constant memory (KN-TECH-001, archived); BSGS ~
    2^(n/2) time x n * 2^(n/2) bits memory (KN-TECH-031/035, archived); multi-
    target rho: independent runs T * 0.886 * 2^(n/2); shared distinguished-point
    table ~ sqrt(T * N) total ops — the object measured by THIS record, flagged
    UNVERIFIED in IDEA-20260731-012's matched_baseline; preprocessing frontier
    S*T^2 = Omega~(eps*N) (KN-LIT-013, archived); generic GGM Omega(sqrt(N))
    (KN-TECH-005, archived). Quantum: stated separately under MAXDEPTH; none
    claimed here. On the measured side the same convention charges walk steps,
    tag tests, DP tests, and storage on the EC walk, the independent-runs
    control, and the null walk identically.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  dominated_by: >-
    Nothing in this ledger measures or archives the multi-target rho baseline;
    there is no competing record to be dominated by. As a generic baseline it
    sits below (is not superseded by) any IC-side amortization claim: SG-ECDLP-004
    and IDEA-20260731-010 depend on this measurement, not the reverse. The
    single-target rows of the frontier (time, memory) are unchanged by this
    record and remain dominated by rho/BSGS as always. Every row checked as
    documented.
  sota_delta: >-
    Quantitative: converts the UNVERIFIED "shared distinguished-point table ~
    sqrt(T*N)" baseline entry into a measured, archived gamma with interval and
    constants (target gamma in [0.45, 0.60], c in [0.5, 2.0]) at toy scale, with
    a null-walk control separating generic birthday structure from curve
    arithmetic; no attack delta, no exponent claim beyond the generic baseline.
  source_refs:
  - ledger/proposals/IDEA-20260731-012.yaml
  - ledger/proposals/IDEA-20260731-010.yaml
  - ledger/proposals/IDEA-20260726-001.yaml
  - ledger/proposals/IDEA-20260727-008.yaml
  - ledger/proposals/IDEA-20260727-005.yaml
  - knowledge/literature/KN-LIT-013.md
  - knowledge/techniques/KN-TECH-005.md
  - knowledge/techniques/KN-TECH-001.md
