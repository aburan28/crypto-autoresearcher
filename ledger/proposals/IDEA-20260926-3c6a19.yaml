  citation_note: >-
    No web search was run. All window arithmetic is this session's hand
    arithmetic on 4b65e3's model and is labelled for recomputation. The
    statement that no published work measures the solution-count
    dependence of Groebner or closure costs on Weil-descended summation
    systems is a statement about this corpus and my recollection, not a
    literature result.

  assumptions:
    - >-
      The finding's model with the product law's calls column replaced by
      B/mu above the cap; LA = m B^2; N = 2^131.
    - >-
      An all-solutions call is charged C_all(B) and returns mu relations,
      all certified; a first-solution call is charged C_one(B).
    - >-
      Relations from the same target are independent rows for the linear
      algebra up to the generic-position heuristic (IDEA-20260805-061f97's
      rank threshold applies to the assembled matrix); mu relations of one
      target share the right-hand side but not the support.
    - OFF-LIMITS COMPONENT DECLARED - F2 only.
    - Arithmetic only at deployed parameters; executable cells at n = 17 (RC-1) and n = 19.

  proof_search_map:
    bottleneck: >-
      epsilon for the algebraic oracle: if it is below (m-1)/m the above-cap
      column of (B) is live for that oracle and the per-call budget at
      m = 6 is 2^50 rather than 2^36.7; if it is at or above, the window is
      worthless and the cap convention of 4b65e3 is the whole story.
    baseline_embedding:
      parameter_slice: >-
        mu = 1 reproduces 4b65e3's column term for term; the enumeration
        oracle reproduces the m N identity at every B (epsilon = (m-1)/m);
        the MITM oracle reproduces 845a77's review numbers at the cap and
        m! N / B^{m/2-1} above it.
      reproduction_check: >-
        Symbolic, zero compute: calls x C_all for the enumeration oracle must
        simplify to m N at every B; at B = B_cap the per-call budget must
        equal 4b65e3's. Frozen fixture: on RC-1 at l = 9 oracle A's
        decomposition counts over the 468 archived targets give mu_measured,
        which must match the count histogram's mean under the cell's
        conventions before the ladder is read.
    observation_collision:
      observable: >-
        The fitted epsilon per solver per m on the RC-1 ladder, with the
        completeness certificate at every rung.
      distinct_preimage_search: >-
        A low epsilon has two preimages: (i) the solver's cost genuinely
        grows slower than the solution count, or (ii) the solver returns an
        INCOMPLETE solution set at large mu (a closure at bounded degree D
        may separate only part of the variety), so C_all is undercounted.
        Separated by the completeness check against oracle A's exhaustive
        set at every rung (blocking) and by reporting the deciding degree per
        rung.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The resource measure calls x C_all + LA with calls = m! N/B^{m-1},
          specialised to B in [B_cap, B_LA] for m in {5, 6, 8} and to the
          three reference oracles (enumeration, MITM, algebraic).
        predicted_gain: The above-cap column of the ECC2K-130 table and the neutral line; zero compute.
      - transform: boundary_lift
        proposed_object: >-
          Lift RQ-CERTBIN-836ce2's fixed-(n', l) policy to an l ladder
          crossing the cap, so that the measured quantity is epsilon rather
          than a cost at one l.
        predicted_gain: A measured exponent per solver per m against the neutral line.
    quantifier_order: >-
      FOR ALL m >= 5 THERE EXISTS a window [B_cap, B_LA] in which an
      all-solutions oracle with epsilon < (m-1)/m lowers the total below its
      cap-locus value, with per-call budgets as in (B); FOR the enumeration
      oracle epsilon = (m-1)/m exactly and the window is neutral. NOT
      CLAIMED: epsilon for any algebraic oracle at n = 131; the record
      measures it at n = 17 and 19 for named solvers.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On ECC2K-130 the above-cap per-call budgets are [column]; on the
        RC-1 ladder l in {9, ..., 13} at m = 2 and l in {6, 7, 8} at m = 3
        the enumeration oracle reads epsilon = (m-1)/m within 0.05, and the
        degree-D closure oracle reads epsilon = [value] with complete
        solution sets certified at every rung." It can NEVER certify
        epsilon at n = 131, nor for unnamed solvers.
      nearby_object_control: >-
        The enumeration oracle (epsilon known exactly, the calibration);
        the same-support random Boolean system with k planted solutions for
        k in {1, 4, 16, 64} (the null for how a structureless system's
        closure cost grows with its solution count); the relabelled Z/NZ
        control on which mu is the same by KN-FIND-007 but no algebraic
        oracle exists (enumeration only).
    proof_obligations:
      - claim: The above-cap column at m in {5, 6, 8} and the neutral line, recomputed in Python.
        responsibility: correctness
      - claim: calls x C_all for the enumeration oracle is m N at every B (symbolic).
        responsibility: baseline
      - claim: Every rung's solution set from the closure oracle equals oracle A's exhaustive set (completeness certificate).
        responsibility: correctness
      - claim: epsilon per solver per m fitted from at least four rungs with intervals and deciding degrees.
        responsibility: runtime
      - claim: Nothing here asserts epsilon at n = 131 or a budget met by any oracle.
        responsibility: scope

  predictions:
    - metric: above_cap_per_call_budget_column (log2 group-op equivalents)
      direction: higher
      minimum_effect: 37.1 at (m = 5, B = 2^29.0), 50.3 at (m = 6, B = 2^26), about 60 at (m = 6, B = 2^28, one call), recomputed within 0.5 bit; no window at m = 4 (B_LA = 2^29.4 below B_cap = 2^33.9).
    - metric: epsilon_enumeration (fitted slope of log2 C_all against log2 mu at fixed n, m)
      direction: flat
      minimum_effect: (m-1)/m within 0.05 (0.5 at m = 2, 0.667 at m = 3); a deviation is an instrument defect.
    - metric: mu_measured_over_mu_predicted (dimensionless)
      direction: flat
      minimum_effect: within 20 percent at every rung under the cell's conventions (x(2E) targets, negation); the ratio must be the SAME on the relabelled Z/NZ control (KN-FIND-007).
    - metric: epsilon_closure (same fit, degree-D closure oracle, complete sets only)
      direction: different
      minimum_effect: >-
        No directional pre-registration; the a-priori expectation is at or
        above (m-1)/m. LEAD reading is epsilon_closure below (m-1)/m - 0.1
        over at least three rungs above the cap with completeness certified
        and the deciding degree not growing along the ladder.
    - metric: C_all_over_C_one_closure (dimensionless, per rung)
      direction: higher
      minimum_effect: at least 1 by construction; the harvest-all convention's implicit value is 1 and any measured value above 2 at mu >= 4 says that convention overstates the harvest-all gain by that factor.
    - metric: epsilon_null (the same fit on random Boolean systems with planted k solutions)
      direction: different
      minimum_effect: reported with interval; a closure epsilon materially below the null's with the same solver is the structure reading, above it is not.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): recompute (B) and (C) in Python; commit the
      above-cap column. STAGE 1 (calibration, minutes): on RC-1 (n = 17,
      m = 2) run oracle A at l in {9, 10, 11, 12, 13} over 200 subgroup
      targets per rung, recording every decomposition; mu_measured per rung;
      confirm the m N identity numerically (calls x C_all flat in l within
      10 percent). STAGE 2 (the measurement): at each rung run the degree-D
      closure oracle (macaulay.py, closure.py, elim.py at D in {3, 4}) on 40
      targets (20 with the highest counts, 20 random), recording ops to the
      first certified solution (C_one), ops to the complete solution set
      (C_all) and the completeness check against oracle A; fit
      epsilon_closure and epsilon_enumeration. Repeat at m = 3 on n = 17,
      l in {6, 7, 8} (cap 6.5) with the (m-1)-fold loop as the enumeration
      oracle and the chained-S_3 closure of IDEA-20260926-89886c's builder,
      as far as D = 4 sizes allow. STAGE 3 (null): the same closure on
      same-support random Boolean systems with k planted solutions, k in
      {1, 4, 16, 64}, to read epsilon_null. STAGE 4 (zero compute): write the
      three-row outcome and the second column. No attack is run.
    cell:
      curve: >-
        RC-1: n = 17, F_2[t]/(t^17 + t^3 + 1), A = 97044, B = 126251, #E = 4 *
        32603, x(2E) subgroup targets (KN-FIND-5a8d3e, DEC-20260926-cb4487);
        KOBLITZ ARM: y^2 + xy = x^3 + 1 at n = 17 (#E = 4 * 137 * 239,
        composite; used only for the m = 2 enumeration arm) and at n = 19
        (#E = 4 * 130873, recompute). GENERIC CONTROL: relabelled Z/NZ with
        N = 32603 and a random base of 2^l elements (enumeration only; mu
        identical by KN-FIND-007).
      m: 2 (primary ladder), 3 (secondary ladder).
      l: '{9, 10, 11, 12, 13} at m = 2 (mu about 0.2 to 50 under the cell''s conventions); {6, 7, 8} at m = 3 (cap 6.5).'
      factor_base: V = {deg < l} in polynomial basis; a size-matched random subspace on two rungs as the null base.
      targets: 200 per rung for mu (oracle A); 40 per rung for costs (20 high-count, 20 random); seeds enumerated 0..39.
      seeds: enumerated, recorded.
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py, curve.py (RC-1 field and curve)
      - experiments/EXP-CERTBIN-e94b27/impl/oracles_rc1.py (oracle A, exhaustive over x_1 in V; returns all solutions)
      - experiments/EXP-CERTBIN-e94b27/impl/macaulay.py, closure.py, elim.py (degree-D closure with certificates; the all-solutions readout of the closure's variety is NEW, about 80 lines)
      - 'NEW: (m-1)-fold loop with operation counter for m = 3 (about 60 lines); planted-solution random Boolean system generator (about 80 lines); elasticity fits (about 60 lines)'
      - 'missing: a WDSat, CaDiCaL or msolve binary for a second solver arm (not installed; the closure is the only algebraic arm and says so); the chained-S_3 builder at m = 3 is 89886c''s and is NEW if not yet written'
    procedure:
      - 1. Stage 0 recomputation; commit.
      - 2. Stage 1 ladder with oracle A; mu per rung; m N identity check (blocking).
      - 3. Stage 2 closure arm with C_one, C_all, completeness against oracle A at every rung (blocking on completeness).
      - 4. Stage 3 null systems with planted k.
      - 5. Fit epsilon per arm with intervals and deciding degrees; write the outcome.
    metrics:
      - name: mu_measured
        unit: decompositions per target
        definition: mean count of certified decompositions over 200 targets per rung
      - name: C_one and C_all
        unit: column-pass elimination operations (closure) or group operations (loop), per target
        definition: ops to the first certified solution and to the complete certified set
      - name: completeness
        unit: fraction
        definition: targets where the closure's solution set equals oracle A's
      - name: epsilon
        unit: dimensionless
        definition: least-squares slope of log2 C_all against log2 mu_measured across rungs, per arm, with interval
      - name: deciding_degree
        unit: integer
        definition: least D at which the closure returns the complete set
    controls:
      - ENUMERATION ORACLE as the exact calibration (epsilon = (m-1)/m; blocking).
      - COMPLETENESS against oracle A at every rung (blocking; an incomplete set is an artifact).
      - SAME-SUPPORT RANDOM BOOLEAN SYSTEMS with planted k solutions (the null for cost growth with solution count).
      - RELABELLED Z/NZ (mu must agree exactly; enumeration only).
      - SIZE-MATCHED RANDOM SUBSPACE base on two rungs (null base).
      - CERTIFICATES on every decomposition (docs/claims-and-verification.md).
    outcomes:
      positive: >-
        (LEAD) epsilon_closure below (m-1)/m - 0.1 over at least three
        above-cap rungs with completeness certified and a flat deciding
        degree, and below epsilon_null: the above-cap column is live for
        the closure oracle; the ECC2K-130 per-call budget at m = 6 becomes
        2^50 for that solver family; route to SEMBIN/SDEG review before any
        interpretation.
      negative: >-
        epsilon_closure at or above (m-1)/m, or the deciding degree grows
        with mu: the harvest-all convention's implicit epsilon = 0 is
        refuted for algebraic oracles on these cells, the cap convention of
        4b65e3 is the honest one, and the above-cap column is recorded as
        closed for closure-type oracles with the mechanism "cost grows at
        least as the solution count".
      artifact: >-
        incomplete solution sets, epsilon_enumeration off (m-1)/m, or mu
        disagreeing with the Z/NZ control: instrument or convention defect;
        nothing read.
    falsification_threshold: >-
      Stated before any run: LEAD requires epsilon_closure's 95 percent
      interval entirely below (m-1)/m - 0.05 at m = 2 or m = 3 over at least
      three rungs above the cap, completeness 1.0 on those rungs, deciding
      degree constant, and epsilon_closure below epsilon_null's interval.
      Anything else is negative or artifact.
    estimated_cost:
      implementation: low
      compute: >-
        ESTIMATE, order of magnitude: oracle A at l = 13 is 2^13 root
        findings per target, 200 targets, seconds; closures at 2l <= 26
        Boolean unknowns and D = 4 (about 18000 columns) are minutes each,
        40 per rung, 5 rungs, hours; the m = 3 arm at l = 8 (about 41
        unknowns with intermediates, D = 4) is the cost driver and may be
        run at D = 3 only, reported as such. Under a day on one core.
    required_metrics:
      - mu_measured per rung with the Z/NZ agreement
      - C_one, C_all, completeness, deciding_degree per target per rung per arm
      - epsilon per arm per m with intervals; epsilon_null
      - certificate pass rate; termination_reason per instance

  falsification_conditions:
    - 'The recomputed above-cap column differs from (B) by more than 0.5 bit: arithmetic error, corrected before use.'
    - 'calls x C_all for the enumeration oracle is not flat in l within 10 percent: the m N identity or the instrument is wrong; nothing else read.'
    - 'mu_measured disagrees with the relabelled Z/NZ control beyond sampling error: KN-FIND-007 is violated on this cell, which is impossible if the instrument is right; instrument defect.'
    - 'The LEAD threshold fires: the above-cap window is live for the closure oracle and the cap convention understates the arity lever at m >= 5 for that solver family.'
    - 'The closure oracle returns incomplete sets at every above-cap rung even at D = 4: C_all is not measurable with this instrument and the record reports that limitation, not an epsilon.'

  confounders:
    - >-
      INCOMPLETENESS at bounded degree is the main artifact and is
      blocking; the deciding degree is reported per rung.
    - >-
      CONVENTIONS on RC-1 (x(2E) targets, negation) shift mu by constants;
      the ladder is read in mu_measured, never in nominal mu.
    - >-
      SMALL LADDER: five rungs at m = 2 and three at m = 3 give a short
      lever for an exponent; intervals are reported and only the sign of
      epsilon - (m-1)/m is carried forward.
    - >-
      RANK of the mu relations from one target: they share a right-hand
      side and may be more dependent than relations from distinct targets;
      the assembled rank per rung is reported (IDEA-20260805-061f97's
      instrument) and the effective relations per call is mu times the
      rank fraction.
    - >-
      OUTPUT FLOOR: at large mu the cost of writing mu solutions dominates
      and epsilon tends to 1 trivially; rungs where m mu exceeds 10 percent
      of C_all are flagged.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT. A second column of the arity table and a
      measured solver property at n <= 19.
    - >-
      KN-OPEN-020 CLASS: subspace base, scoped class, inherited.
    - >-
      The above-cap budgets are per CALL and an oracle must return mu
      certified relations per call to earn them; a first-solution oracle
      earns 4b65e3's column, not this one.
    - >-
      Toy scale; the closure oracle is one solver family and epsilon for
      Groebner or SAT engines is not measured (not installed).
    - >-
      FORWARD GUIDANCE: (i) if the LEAD reading fires, the m = 6 single-call
      regime (one target, 2^27.5 decompositions, budget about 2^60) is a
      qualitatively different object -- an underdetermined descended system
      with 168 unknowns and 131 equations -- and belongs to SDEG/SEMBIN;
      (ii) the multi-target reading (IDEA-20260926-20ba8f) composes with
      this one: above the cap each target's descent also yields mu
      relations, so the per-target cost in that row is C_all/mu; (iii) the
      rank fraction of same-target relations is a RELN question.

  heuristic_assumptions:
    - id: H1
      statement: >-
        POISSON COUNTS. The number of decompositions of a uniformly random
        target is Poisson with mean mu = C(B+m-1, m)/N (mean exact by
        KN-FIND-007), so above the cap almost every target has about mu
        decompositions and calls = B/mu.
      rigorous_support: The mean is exact; the Poisson shape imitates the occupancy law and its failure mode is coverage concentration, irrelevant above the cap where coverage is saturated.
      validation_plan: >-
        SAMPLE: oracle A's counts over 200 targets per rung. COMPARISON:
        chi-squared against Poisson(mu_measured). TAIL: the maximum count
        against the Poisson tail. TRANSFER: the mean transfers exactly.
    - id: H2
      statement: >-
        ELASTICITY TRANSFER. The sign of epsilon - (m-1)/m for a named
        solver at n in {17, 19} indicates its sign at larger n for that
        solver, as a heuristic about how the solving degree of the descended
        system responds to the degree of its zero-dimensional ideal.
      rigorous_support: >-
        None; the enumeration's epsilon is exact and calibrates the fit; for
        closure-type solvers the relation between ideal degree and solving
        degree is KN-OPEN-3c8f51-adjacent and is measured, not assumed.
      validation_plan: >-
        SAMPLE: the two ladders. COMPARISON: epsilon_closure against
        epsilon_enumeration and epsilon_null. TAIL: the largest C_all per
        rung. TRANSFER ASSUMPTION, stated: sign only, heuristic only.

  heuristic_note: >-
    (B) and (C) are arithmetic under H1's mean, which is exact. The
    a-priori expectation, stated in advance: the enumeration reads its
    exact value, the closure reads epsilon at or above the neutral line
    with a growing deciding degree, and the above-cap column is recorded
    as a target the algebraic oracles do not earn at toy scale.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES. Above the cap the per-call budget is 2^37.1 at
      (m = 5, B = 2^29.0), 2^50.3 at (m = 6, B = 2^26), about 2^60 at one
      call (m >= 6), each call returning mu relations; the total falls
      with B iff epsilon < (m-1)/m. The enumeration oracle sits on the
      neutral line; MITM below it but above rho at every B.
    memory_exponent: >-
      The relation matrix grows to B_LA up to 2^29.2 rows at m = 5
      (2^34.6 bytes at 35 bytes per row), disclosed; the all-solutions
      oracle's own memory (the closure's Macaulay matrix or the MITM table)
      is solver-dependent.
    best_known: matched rho 2^60.81 (KN-FIND-aa2efc); within the family, 4b65e3's cap-locus column.
    hidden_overhead: >-
      The rank fraction of same-target relations and the output floor m mu
      per call are the two constants that could move the column by bits and
      are measured.
    tradeoff_note: >-
      Moving B above the cap trades a larger linear algebra (still under
      rho by construction of B_LA) for fewer, richer oracle calls; relation
      collection stays embarrassingly parallel and the LA inherits
      IDEA-20260922-2e2a58's floor at the larger B.

  estimated_cost:
    implementation: low
    compute: medium
    qualification: >-
      Reuses the RC-1 instruments; new code is the all-solutions readout,
      the m = 3 loop, the planted null and the fits; hours to a day of
      single-core time, dominated by the m = 3 closures.

  asymptotic_claim:
    problem: ECDLP on ECC2K-130 by subspace-base index calculus above the cap locus with an all-solutions oracle
    prior_best: 4b65e3's cap-locus column (one relation per call); matched rho 2^60.81
    time_exponent: unchanged; the per-call budget column above the cap is a target conditional on epsilon < (m-1)/m
    memory_exponent: relation matrix up to B_LA = sqrt(rho/m) rows
    hidden_cofactor: the rank fraction of same-target relations; the output floor
    claim_kind: cost_model_second_column_plus_solver_property_measurement

  dominated_by: >-
    n/a (no attack claimed), checked row by row: matched rho (2^60.81, O(1)
    per walk) dominates every above-cap cell because no oracle is known
    with C_all below the column, and the two oracles whose epsilon is known
    (enumeration, MITM) sit at m N and above rho respectively; BSGS
    dominated by rho; multi-target and preprocessing rows are
    IDEA-20260926-20ba8f's and untouched here. Not null on any axis.

  sota_delta:
    time: >-
      Zero on attack capability. New numbers: the above-cap window
      [B_cap, sqrt(rho/m)] per m on ECC2K-130 (empty at m = 4), the per-call
      budgets 2^37.1 (m = 5), 2^50.3 (m = 6, B = 2^26), about 2^60 (one
      call), the neutral line epsilon < (m-1)/m, and the placement of the
      enumeration and MITM oracles on it.
    memory: the larger relation matrix above the cap, stated.
    data_queries: none.

  frontier_check:
    status: pending
    note: >-
      Whether the dependence of Groebner-basis or XL cost on the number of
      solutions of a Weil-descended summation system has been measured or
      bounded in the published literature (Faugere-Gaudry-Huot-Renault,
      Petit-Quisquater, Semaev) was not checked; the harvest-all versus
      one-per-target accounting is surely discussed in the index-calculus
      balancing literature in some form.

  recommended_priority: medium
  priority_rationale: >-
    The above-cap column is a genuine second row of the table that the
    cap-locus correction leaves out, and at m = 6 it is 13.6 bits more
    forgiving per call; whether any solver earns it is one measurable
    exponent on instruments the CERTBIN lane already runs, with an exact
    calibration arm. Medium because the a-priori expectation is that
    algebraic oracles pay for every solution they return, in which case the
    record closes the harvest-all convention for them with a measured
    reason rather than opening a lever.

  first_deliverable: >-
