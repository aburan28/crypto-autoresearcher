idea:
  id: IDEA-20260926-3c6a19
  question_id: RQ-CERTBIN-836ce2
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    ONE TARGET IS mu RELATIONS ABOVE THE CAP: for B > B_cap every target has
    mu = B^m/(m! N) decompositions and an all-solutions oracle returns them
    all, so the product law's calls column is B/mu, opening a window at
    m >= 5 (none at m = 4) where the per-call budget rises to 2^37 (m = 5)
    and 2^50 (m = 6, B = 2^26); whether it pays is one measurable number,
    the solution-count elasticity of the oracle across the cap on the RC-1
    cell

  class: mechanism

  claim: >-
    Representation class R1 of RQ-ECDLP-623a32 (x-coordinate subspace base);
    the attack stage whose charged cost changes is RELATION COLLECTION,
    specifically the accounting "one decomposable target = one relation"
    that the product law and its cap-locus correction both assume.

    (A) THE TWO CONVENTIONS THE CORPUS ALREADY CARRIES, AND THE NUMBER
    NEITHER MEASURES. KN-FIND-007 states that under a harvest-all solve the
    relations per processed target equal the conservation mean mu =
    C(B+m-1, m)/N exactly; H-ICEX-9e54c2 and H-PFDR-26bcee price prime-field
    index calculus under both a harvest-all convention (relations per call =
    mu, cost per call D independent of mu) and a one-relation-per-target
    convention (pinned at the kink B_k = (m! N)^{1/m}); IDEA-20260926-4b65e3
    corrects the ECC2K-130 table under the second convention and states in
    its assumptions that "a solver that must find ALL decompositions to find
    one is charged at its full cost". The two conventions coincide at the
    cap (mu = 1) and diverge above it, and what decides between them is a
    property of the ORACLE that no record measures: the SOLUTION-COUNT
    ELASTICITY epsilon = d log C_all / d log mu at fixed (n, m), where
    C_all(B) is the cost of returning every decomposition of one target
    over a base of size B. Harvest-all assumes epsilon = 0; the cap
    convention assumes epsilon is irrelevant because it never leaves mu = 1.

    (B) THE ABOVE-CAP WINDOW ON ECC2K-130, PRICED. With an all-solutions
    oracle the product law reads calls x C_all + LA with calls = B/mu = m!
    N/B^{m-1} and LA = m B^2, so B may rise above B_cap until LA meets rho
    at B_LA = sqrt(rho/m). MY ARITHMETIC (rho = 2^60.81, N = 2^131): B_LA =
    2^29.40 (m = 4), 2^29.24 (m = 5), 2^29.11 (m = 6), 2^28.9 (m = 8). At
    m = 4, B_cap = 2^33.9 exceeds B_LA, so there is NO window (LA binds
    below the cap, as 4b65e3 says). At m = 5 the window is B in [2^27.58,
    2^29.24], mu up to 2^8.3; at B = 2^29.0, LA = 2^60.32, the remaining
    budget is 2^59.0, mu = 2^7.1, calls = 2^21.9, and the per-CALL budget is
    2^37.1 against 2^32.4 at the cap, with each call returning 2^7.1
    relations. At m = 6 the window is [2^23.42, 2^29.11]; at B = 2^26, LA =
    2^54.6, mu = 2^15.5, calls = 2^10.5, per-call budget 2^50.3 against
    2^36.7 at the cap, each call returning 2^15.5 relations (output floor
    m mu = 2^18.1 words); at B = 2^28, mu = 2^27.5 and ONE call returning
    2^27.5 decompositions of a single target, at a budget of about 2^60,
    replaces the whole relation phase. At m = 8, B = 2^24: mu = 2^{192 -
    146.3} = 2^45.7, one call. So above the cap the arity table has a
    second column: per-call budgets of 2^37 (m = 5), 2^50 (m = 6), about
    2^60 (m >= 6 at one call), all with the LA still under rho.

    (C) WHEN THE WINDOW PAYS, AS ONE INEQUALITY. Calls scale as B^{-(m-1)}
    and C_all as mu^epsilon = B^{m epsilon} (up to constants), so calls x
    C_all scales as B^{m epsilon - (m - 1)}: the total DEcreases with B
    above the cap iff epsilon < (m - 1)/m, i.e. 0.8 at m = 5, 0.833 at m =
    6. Two reference oracles sit exactly on known values. The enumeration
    oracle (IDEA-20260904-96c4f3, the (m-1)-fold loop) returns all
    decompositions at C_all = B^{m-1}/(m-1)!, so epsilon = (m-1)/m EXACTLY
    and the total is the m N identity, flat in B: the window buys nothing,
    which is consistent. The two-list meet-in-the-middle oracle
    (IDEA-20260922-845a77) has C_all = B^{ceil(m/2)}, epsilon = ceil(m/2)/m
    = 0.6 (m = 5) or 0.5 (m = 6), below the neutral line, so its total
    FALLS with B above the cap, m! N / B^{m/2 - 1} at even m; but its
    absolute cost is above rho at every B on ECC2K-130 (2^84.5 at m = 6,
    B = 2^28), so the window helps it without saving it. The output floor
    C_all >= m mu gives epsilon -> 1 for any oracle once the output
    dominates, so the window is bounded above by the B at which m mu
    reaches the per-call budget. The open number is epsilon for the
    ALGEBRAIC oracles, the ones whose C at the cap is what the seam prices:
    a Macaulay or mutant closure returns the variety of the descended
    system, and whether its cost grows like the number of solutions
    (epsilon near 1, the degree of the zero-dimensional ideal enters the
    solving degree), like the enumeration (0.8), or slower, is not stated
    anywhere in this corpus or, to my knowledge, measured for Weil-descended
    summation systems. STATED SO IT CAN FAIL: the a-priori expectation is
    epsilon >= (m-1)/m for the degree-D closure oracle on the RC-1 ladder
    (the window is worthless for it); the LEAD reading is epsilon below
    (m-1)/m over at least three rungs above the cap with certified complete
    solution sets, at which point the second column of (B) is live for that
    solver and its per-call budget at m = 6 is 2^50, thirteen bits above the
    cap-locus target.

    (D) WHY THIS IS NOT KN-FIND-007's YIELD OR RELN's COVERAGE. Yield
    conservation fixes mu exactly and is not in question; coverage is the
    fraction of targets with at least one decomposition and is irrelevant
    above the cap (nearly all targets have many). What is measured here is
    a cost property of the solver as the solution count grows, which
    KN-FIND-007 explicitly says it does not capture ("says nothing about the
    cost of finding a decomposition").

  mechanism: >-
    OBJECT FRAME. Representation: R1, the x-coordinate subspace V of
    dimension l in polynomial basis, exactly RQ-CERTBIN-836ce2's object,
    with l swept ACROSS the cap l_cap = (n + log2 m!)/m rather than fixed at
    it. Operation set Sigma: translation by factor-base elements (Class I).
    No new tracked object; the record changes the accounting of one
    stage and measures one property of the solver.

    TRICHOTOMY. Class I, partial-action, as for every F2 line; the
    obligation of that class is coverage (IDEA-20260806-c5d183), which above
    the cap is saturated, and the record's content is the cost side that the
    class's obligation does not cover.

    LOSSY-PROJECTION TEST. Not applicable to an accounting-plus-measurement
    record, stated rather than omitted; the factor base is the scoped
    subspace class of KN-OPEN-020, inherited.

    THE PRICED OPEN NUMBER. epsilon(solver, n, m), fitted from C_all along
    the l ladder across the cap, together with the completeness check that
    the solver's solution set equals the enumeration's. Secondary: the
    ratio C_all / C_one at each rung (how much more an all-solutions call
    costs than a first-solution call), which is what the harvest-all
    convention silently sets to 1.

    OFF-LIMITS COMPONENTS USED, NAMED. F2 only. What is added beyond
    KN-FIND-007, H-ICEX-9e54c2, H-PFDR-26bcee and 4b65e3: the above-cap
    window on the ECC2K-130 table with its LA ceiling, the neutral line
    epsilon < (m-1)/m, the placement of the enumeration (neutral) and
    MITM (below neutral, but above rho) oracles on it, and the elasticity
    measurement for the algebraic oracle on the CERTBIN cells.

    REPRESENTATION CLASS (RQ-ECDLP-623a32): R1; attack stage RELATION
    COLLECTION (calls column).

  novelty_status: unverified

  origin:
    kind: generator_search
    date: '2026-09-26'
    scope: >-
      Lane TASK-20260926-35e1b7 (S2), seam item "relations that are not one
      target = one relation (partial decompositions, relations among
      factor-base elements found by collision inside the sumset, priced
      against KR-RHO-13bf67 and the product law)". The collision-inside-
      the-sumset candidate is closed by round 1 (IDEA-20260926-136bd3 (C4):
      a generic join costs >= 2^62.5 per relation; KR-RHO-13bf67) and the
      partial-decomposition candidate by IDEA-20260926-1db0e8 (j = 1 birthday,
      j = 2 at 2^124); both are cited, not re-proposed. The surviving
      "not one-to-one" object is one target yielding mu > 1 relations above
      the cap, which no round-1 record prices on ECC2K-130. OWNERSHIP
      (DEC-20260924-4f8a03 R2): RQ-CERTBIN-836ce2, because the measurement
      is a decomposition-cost property (the oracle's cost as a function of
      solution count) on that question's own RC-1 cell and l ladder; the
      resulting second column is handed to RQ-BINSTD-b6f698's table, and
      the yield side is RELN's and is quoted (KN-FIND-007), not re-measured.
    overlap_review: >-
      Grepped ledger/ and knowledge/ for "harvest-all", "all decompositions",
      "all solutions", "every decomposition", "partial decomposition",
      "large prime", "relations per target", "mu > 1", "elasticity".
      NEAREST: KN-FIND-007 (harvest-all relations per solve equal the mean;
      says nothing about solve cost); H-ICEX-9e54c2 (prime-field window as
      the intersection of a harvest-all balance, a one-per-target threshold
      and a trial-count bound; charges D_trial per target independent of
      mu, i.e. epsilon = 0 implicitly); H-PFDR-26bcee (F: under harvest-all
      T = (B+1) kappa/mu, again with s(B) independent of mu);
      IDEA-20260926-4b65e3 (the cap convention; assumes an all-solutions
      solver is charged at full cost and stays at mu = 1); IDEA-20260904-
      96c4f3 (the enumeration oracle and the m N identity, which this record
      identifies as epsilon = (m-1)/m exactly); IDEA-20260922-845a77 and its
      review (MITM at B^{ceil(m/2)}, placed here at epsilon = ceil(m/2)/m);
      IDEA-20260926-89886c (sat/unsat asymmetry at m = 3, a per-attempt
      property at the cap; orthogonal to the above-cap regime where almost
      every attempt is satisfiable); KN-FIND-5a8d3e (the RC-1 cell and its
      instruments, reused). No record states the above-cap window on the
      ECC2K-130 table, the neutral line, or measures the solution-count
      elasticity of an algebraic oracle.

