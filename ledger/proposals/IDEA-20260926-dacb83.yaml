  proof_search_map:
    bottleneck: >-
      Which component's bytes bind an ECC2K-130 index-calculus row at the
      cap locus, and whether the Frobenius collapse changes it; every
      memory verdict in the lane so far has charged the matrix only.
    baseline_embedding:
      parameter_slice: >-
        The 2e2a58 review's reproduced figures (2^40.63 bytes published rho
        storage; about 1 GiB at theta = 2^-35) and 4b65e3's matrix bytes at
        the cap are the fixtures the recomputation must reproduce before any
        new line is read.
      reproduction_check: >-
        Zero compute: 60.9 - 35.63 = 25.27; 2^35.63 x 32 = 2^40.63; B_cap at
        m = 4..8 to 0.05 bit; 4b65e3's 2^34 and 2^30 byte figures at m = 5, 6
        within 1 bit under its (unstated) storage model, with the model
        difference explained.
    observation_collision:
      observable: The tuple (M1, M2, M3, P*, binding component) per (m, locus, B' reading).
      distinct_preimage_search: >-
        Two rows with the same binding component can differ by 20 bits in
        margin; the column carries the margin. Two oracle types with the same
        time cost can differ by 40 bits in memory (closure versus MITM); the
        column carries them as separate lines, never as "the oracle".
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The resource measure "peak bytes across the disjoint blocks
          (matrix, oracle working set, DP store)" per row, with the maximum
          reported as the binding component and the rest as margins.
        predicted_gain: The first memory-charged ECC2K-130 reachability rows that include the oracle; no cost gain.
    quantifier_order: >-
      FOR ALL m in {4, 5, 6, 8}, FOR BOTH loci and BOTH B' readings, the
      column values are as computed under the stated storage models;
      E-ORACLE-BINDS is FOR ALL cap rows; E-MATRIX-BINDS is EXISTS one. NOT
      CLAIMED: the rank of the collapsed matrix, or any oracle's time.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under the stated storage models the bytes are [table]; the binding
        component per row is [field]; P* per row is [value]; at the toy
        cells the closure's measured peak RSS is within a factor 2 of M2a."
        It cannot certify anything about an oracle the program has not
        built, nor the collapsed rank.
      nearby_object_control: >-
        The m = 4 row, where the matrix alone approaches R-PUB and the
        collapse CAN change the binding component: the object where the
        claim "the collapse moves nothing that binds" is nearest to failing
        and must be reported as such.
    proof_obligations:
      - claim: The fixtures above are reproduced to the stated precision.
        responsibility: baseline
      - claim: The binomial sums and byte conversions at N_bool = 4 d_cap ... 8 d_cap are recomputed exactly.
        responsibility: correctness
      - claim: The toy closure's peak RSS matches M2a within a factor 2 at RC-1 and n = 19.
        responsibility: feasibility
      - claim: Both rho conventions and both B' readings appear on every row.
        responsibility: interface
      - claim: No statement about the collapsed matrix's rank.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: M1 at (m = 5, cap) in log2 bytes, uncollapsed and collapsed
      direction: same
      minimum_effect: '31.7 and 24.7 within 1 bit under the sparse model'
    - metric: M2a at (m = 5, cap) in log2 bytes
      direction: higher
      minimum_effect: 'about 41.2 within 1 bit; above M1 by at least 8 bits under either B'' reading'
    - metric: binding_component per cap row
      direction: same
      minimum_effect: 'E-ORACLE-BINDS iff "oracle" on every m in {4, 5, 6, 8}; E-MATRIX-BINDS iff "matrix" on any'
    - metric: P* at (m = 5, cap) in log2 walks
      direction: same
      minimum_effect: 'about 26.7 uncollapsed and 19.7 collapsed within 1 bit'
    - metric: toy closure peak RSS against M2a (RC-1 M_4 2924 x 4048; n = 19 M_4 4009 x 6196)
      direction: same
      minimum_effect: 'measured within a factor 2 of the bit-packed formula (RC-1: 2924 x 4048 / 8 = 1.48 MB for the matrix; the recorded peak_rss_bytes per set includes the interpreter and the product stack and is read as an upper bound)'

  minimal_test:
    design: >-
      STAGE 0 (zero compute, the deliverable). A Python script (about 100
      lines, fractions and math.comb) that emits, for m in {4, 5, 6, 8},
      locus in {cap, free}, B' in {B, B/131}: M1 (sparse and dense lines),
      M2a at degree 4 (and degree 3 as a second line), M2b, M3 under R-PUB
      and R-FLOOR at P in {2^16, 2^20, 2^24, 2^28}, P*, binding component and
      margin in bits; with the fixtures of the baseline check reproduced
      first. STAGE 1 (toy validation of the accounting, minutes). CELLS:
      RC-1 (n = 17, m = 2, l = 9) and the n = 19 cell (m = 2, l = 10) with
      their archived M_4 shapes (2924 x 4048; 4009 x 6196); the committed
      per-set peak_rss_bytes of RUN-CERTBIN-c417e0 and RUN-CERTBIN-a3fc60
      checkpoints as the measured oracle working set (upper bound including
      the interpreter); a fresh single-instance M_4 and W_4 run at each cell
      with resource.getrusage read before and after (the increment as the
      lower-bound measurement); a toy relation matrix at m = 2 built by the
      loop over 2^9 or 2^10 base points with its bytes measured against M1;
      a Frobenius-collapse ACCOUNTING arm on the n = 17 Frobenius-stable
      9-dimensional V of IDEA-20260926-917981 (F_2 + ker g(sigma)): count the
      orbit classes (predicted 2 fixed + 30 orbits of size 17 = 32 classes,
      my arithmetic) and the bytes of the orbit-labelled matrix against M1's
      collapsed line -- bytes only, NO rank statement (b19793's question).
      INSTRUMENT. experiments/EXP-CERTBIN-e94b27/impl/ (closure.py,
      macaulay.py, gf2n.py, curve.py); the committed checkpoint files; new
      code about 150 lines. Nothing missing. CONTROLS. Fixture reproduction
      (blocking). Null object for the accounting: a random dense GF(2)
      matrix of the same shape as M_4, whose measured bytes must equal the
      formula (the accounting does not depend on structure). Ordinary versus
      Koblitz: the n = 19 Koblitz sibling's matrix bytes at matched (m, l)
      must equal the ordinary cell's (bytes do not read the curve). No
      relabelled Z/NZ control: no group-structure claim. OUTCOME TABLE.
      POSITIVE (E-ORACLE-BINDS, accounting validated within 2x): the column
      is filed for the ECC2K-130 row with "oracle" as the binding component
      at every cap row and P* tabulated; every m >= 5 oracle proposal must
      henceforth state its working set in bytes beside its time. NEGATIVE
      (E-MATRIX-BINDS at some m): the matrix and hence the collapse and the
      b19793 rank question are live on the memory axis at that m; reported
      with the margin and handed to that batch as an input, never decided
      here. ARTIFACT (fixtures not reproduced; toy bytes off the formula by
      more than 2x on the random-matrix null): the accounting is wrong;
      nothing is filed. FALSIFICATION THRESHOLD, FIXED NOW: E-ORACLE-BINDS is
      falsified iff at any m in {4, 5, 6, 8} at the cap M1 (uncollapsed)
      exceeds min(M2a at degree 4, M2b), or iff the toy peak-RSS increment
      for a single M_4 build is below half the bit-packed formula (which
      would mean the formula overstates the oracle). COST (estimate):
      implementation low; compute seconds for Stage 0, minutes for Stage 1.
    controls:
      - 'Fixture reproduction of the 2e2a58-review rho storage figures and 4b65e3''s B_cap values (blocking).'
      - 'Random dense GF(2) matrix of M_4''s shape as the accounting null (bytes must equal the formula).'
      - 'Koblitz n = 19 sibling versus the ordinary n = 19 cell at matched (m, l): identical bytes.'
      - 'Both rho conventions and both B'' readings on every row; the collapse arm reports bytes only.'
    required_metrics:
      - 'M1, M2a, M2b, M3 in log2 bytes per (m, locus, B'' reading, rho convention)'
      - 'P* per row; binding component and margin in bits'
      - 'toy measured bytes (matrix, closure increment, per-set peak RSS) against the formulas'
      - 'orbit-class count on the stable V at n = 17 and the collapsed matrix bytes'

  falsification_conditions:
    - 'E-ORACLE-BINDS falsified iff M1 exceeds min(M2a, M2b) at any cap row under the uncollapsed reading.'
    - 'The accounting is falsified (nothing filed) iff the random-matrix null''s measured bytes differ from the formula by more than 2x, or the fixtures are not reproduced.'
    - 'The P* prediction is falsified iff the recomputed P* at (m = 5, cap) differs from 26.7 / 19.7 by more than 1 bit; the record is then superseded with the corrected line.'

  confounders:
    - >-
      Peak RSS of a Python process includes the interpreter and numpy
      buffers; the single-instance increment and the formula bracket the
      oracle's true working set from below and above, and both are reported.
    - >-
      A degree-4 Macaulay matrix is the pure-Python closure's footprint; an
      F4 engine's footprint is different (GOAL-ICPERF AP-4 reports 6.6-10 GB
      at 42 variables) and is tabulated as a separate oracle line only where
      a measurement exists.
    - >-
      R-PUB is one configuration of one 2009-2010 effort; a rerun could
      choose a coarser theta and store fewer points; that is exactly why
      R-FLOOR and P* are on the row.
    - >-
      The collapsed reading assumes the shift label is stored per entry;
      a representation storing shifts implicitly changes M1 by the 7 bits
      per entry, disclosed in the model.

  interpretation_limits:
    - 'A column of a cost model, not a measurement of any oracle at n = 131; the only measurements are toy accounting checks.'
    - 'The collapsed rank (whether B/131 is the effective dimension) is IDEA-20260922-b19793''s in BATCH-b67954 and is not decided or prejudged here.'
    - 'Nothing about time; the time floors are 4b65e3''s and KN-FIND-aa2efc''s.'
    - 'KN-OPEN-020 class of V: scoped-out linear subspace, inherited.'

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Working-set model.) A degree-D Macaulay-type oracle on the descended
        S_{m+1} at m d_cap Boolean unknowns has a peak working set within a
        factor 2 of its bit-packed matrix rows x columns / 8 bytes, plus the
        first mutant stack for W_D.
      rigorous_support: >-
        Exact for the matrix itself; the factor 2 imitates the observed ratio
        between formula and peak RSS on the archived toy runs, which is what
        Stage 1 measures.
      validation_plan: >-
        SAMPLE: the two archived cells' per-set peak_rss_bytes and fresh
        single-instance increments. COMPARISON: measured over formula within
        [0.5, 2]. TAIL: the W_4 product stack (up to 18 x dim(M_4 cap B_{<=3})
        rows) as the worst case. TRANSFER: the formula transfers exactly; the
        factor is asserted only within the measured band.

  heuristic_note: >-
    Stage 0 is arithmetic under stated storage models; H1 governs only how
    the closure's formula bytes are read as a working set, and it is
    measured at Stage 1 before any cap row is filed.

  target_complexity:
    time_exponent: Unchanged; the record charges no time.
    memory_exponent: >-
      Tabulated, not claimed: matrix N^{1/m} rows at the cap (B_cap), oracle
      working set polynomial in m d_cap at fixed degree for a closure and
      N^{ceil(m/2)/m} for MITM, rho N^0 (R-FLOOR) or the published 2^40.63
      bytes (R-PUB).
    best_known: Matched rho 2^60.81 time on ECC2K-130 at 2^40.63 bytes (R-PUB) or Theta(P) records (R-FLOOR).
    hidden_overhead: The storage constants (32 bytes per record, bits per index), made explicit per line.
    tradeoff_note: >-
      The DP density trades rho's storage against its in-flight tail
