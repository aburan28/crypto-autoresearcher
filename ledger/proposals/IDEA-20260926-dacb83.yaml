idea:
  id: IDEA-20260926-dacb83
  question_id: RQ-ICPERF-94c86e
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    A MEMORY-CHARGED REACHABILITY COLUMN AT THE CAP LOCUS: bytes for the
    relation matrix (both Frobenius-collapse readings B' in {B_cap,
    B_cap/131}), for the oracle's own working set (degree-4 closure, MITM
    table) and for matched rho under two storage conventions (published
    2^35.63 distinguished points; the Theta(P) floor), with the zero-run
    prediction that at m >= 5 the binding memory is the oracle's, not the
    matrix's, and the collapse moves nothing that binds
  class: measurement

  claim: >-
    CEILING FIRST. No exponent, no attack; a cost-model column. Representation
    R1; the attack stages charged are LINEAR ALGEBRA (matrix bytes) and the
    PER-ATTEMPT ORACLE (working set), against rho's distinguished-point
    storage. Target arity: every m in {4, 5, 6, 8} at ECC2K-130, at the
    cap locus B_cap = (m! 2^131)^{1/m} of IDEA-20260926-4b65e3 and, as the
    second row, at KN-FIND-aa2efc's free-oracle optimum. It cannot move a
    time row; it can invert a MEMORY verdict, which IDEA-20260922-2e2a58
    already argues is the axis that decides the lane.

    THE GAP. IDEA-20260922-2e2a58 (design_after, HOLD-M; review sound_with_
    corrections) prices the memory axis at the free-oracle balance B' =
    N^{1/(m+1)} against rho's storage floor Theta(P) and preregisters (E2)
    "the memory axis binds at every competitive row by B'/(gP)"; its B' is
    read both as B and B/g (the Frobenius orbit collapse, g = 131 on
    ECC2K-130), and whether the collapse survives the rank question is
    IDEA-20260922-b19793's, absorbed into the revision batch BATCH-b67954 and
    NOT touched here. IDEA-20260926-4b65e3 moved the locus to the cap and
    stated the matrix bytes there (about 2^34 bytes at m = 5) without a rho
    comparison and without the oracle's memory. The seam card names "the
    producer's section 6.2" (RESEARCH_ECC2K130_RR_SOLVER_PANEL.md in the
    external repository of KN-FIND-aa2efc, not hashed in EV-ICPERF-10c5fc
    and NOT OPENED this session) as carrying a memory-charged reachability
    discussion; this record does not cite its content and builds the column
    from this ledger's numbers only.

    THE COLUMN, DEFINED. Per (m, locus in {cap, free}, B' reading in {B,
    B/131}): (M1) sparse relation matrix bytes = B' rows x m entries x
    (ceil(log2 B') + 7) bits (7 bits for the Frobenius shift label when
    collapsed, 0 otherwise) / 8; (M2) oracle working set: (M2a) the degree-4
    Macaulay matrix of the Weil-descended S_{m+1} at d_cap unknowns per
    summand, bit-packed, rows = 131 x #multipliers of degree <= 2 in
    N_bool = m d_cap variables, columns = sum_{i<=4} C(N_bool, i); (M2b) the
    MITM table |V|^{ceil(m/2)} entries x 32 bytes; (M3) rho storage under
    convention R-PUB, the published ECC2K-130 configuration, 2^35.63 points
    x 32 bytes = 2^40.63 bytes (KN-LIT-096 as reproduced by the 2e2a58
    review: 60.9 - 25.27 = 35.63), and under R-FLOOR, Theta(P) records for P
    concurrent walks (2e2a58 limb (B)), tabulated at P in {2^16, 2^20, 2^24,
    2^28}; (M4) the crossover P*(m, reading) at which R-FLOOR equals M1, and
    the binding component per row.

    THE ZERO-RUN ARITHMETIC (mine, labelled, to be recomputed in Python
    before use). At the cap: B_cap = 2^33.90, 2^27.58, 2^23.42, 2^18.29 at
    m = 4, 5, 6, 8 (4b65e3, reproduced). M1 at m = 5, uncollapsed: 2^27.58 x
    5 x 28 bits = 2^34.7 bits = 2^31.7 bytes (about 3.4 GB); collapsed
    B' = 2^20.55: 2^20.55 x 5 x 28 bits = 2^27.7 bits = 2^24.7 bytes (about
    27 MB). At m = 4: 2^33.90 x 4 x 34 bits = 2^41.0 bits = 2^38.0 bytes
    uncollapsed, 2^31.0 bytes collapsed. At m = 6: 2^23.42 x 6 x 24 bits =
    2^30.6 bits = 2^27.6 bytes; m = 8: 2^18.29 x 8 x 19 bits = 2^25.5 bits =
    2^22.5 bytes. M2a at m = 5, d_cap = 28 (N_bool = 140): multipliers of
    degree <= 2 number 1 + 140 + C(140, 2) = 9871, rows = 131 x 9871 = 2^20.3;
    columns sum_{i<=4} C(140, i) = 1 + 140 + 9730 + 447580 + 15331915 =
    2^23.9; bit-packed bytes = 2^20.3 x 2^23.9 / 8 = 2^41.2 bytes (about 2.5
    TB) for ONE attempt's Macaulay matrix at degree 4. M2b at m = 4:
    B_cap^2 = 2^67.8 entries; at m = 5 B_cap^3 = 2^82.7. M3: R-PUB = 2^40.63
    bytes; R-FLOOR at P = 2^20 is 2^25 bytes. THE READINGS THAT FOLLOW. (i) At
    m = 5 the matrix (2^31.7 or 2^24.7 bytes) is BELOW the published rho
    storage (2^40.63 bytes) under either B' reading; 2e2a58's (E2) does not
    hold at the cap against R-PUB. (ii) Against R-FLOOR it holds iff P is
    below P* = M1 / 32 bytes = 2^26.7 (uncollapsed) or 2^19.7 (collapsed) at
    m = 5, so the memory verdict at the cap is a function of the rho storage
    convention and of P, and the column must carry P*. (iii) The oracle's
    working set dominates the matrix at EVERY m for both oracle types the
    program has: the degree-4 closure needs about 2^41 bytes per attempt at
    m = 5, ten bits above the matrix; the MITM table is astronomically above.
    Hence the memory-binding component at the cap is the ORACLE, and the
    Frobenius collapse -- which shrinks only M1 by 2^7 -- moves nothing that
    binds. (iv) At m = 4 the matrix alone (2^38.0 bytes uncollapsed) is
    within 2.6 bits of R-PUB; m = 4 is the one row where the collapse
    changes which component binds against R-PUB.

    THE TWO READINGS, PRE-REGISTERED. E-ORACLE-BINDS: the recomputation
    confirms (iii) at every m in {4, 5, 6, 8} at the cap, and the toy
    validation below measures the closure's bytes within a factor 2 of the
    M2a formula, so the column's binding-component field reads "oracle" on
    every cap row. E-MATRIX-BINDS: the recomputation or the toy validation
    finds the matrix bytes above the oracle's at some m (for example because
    a closure can be run at a degree below 4 with far fewer columns, or
    because the descended system's sparsity lets M2a be stored in far fewer
    bytes than bit-packed dense), and then the collapse and the rank question
    of b19793 are live on the memory axis. The record's prior is
    E-ORACLE-BINDS by a wide margin for any Macaulay-type oracle and by an
    even wider one for MITM; the honest content is that the column then says
    "memory is decided by the oracle's own footprint, which no ECC2K-130
    record has ever charged".

  mechanism: >-
    OBJECT FRAME. Representation R1; Sigma = translation by factor-base
    elements (Class I), unchanged; no tracked object. TRICHOTOMY and
    LOSSY-PROJECTION TEST: not applicable to a cost column, stated. THE ONE
    OPEN NUMBER: the measured oracle working set in bytes at the toy cells
    against the M2a formula, and P* per row. WHY THE ORACLE'S MEMORY HAS
    BEEN INVISIBLE: every ECC2K-130 record charges the oracle in TIME
    (group-op equivalents per attempt) and the linear algebra in both time
    and bytes; but a Macaulay or Groebner solve at 140 Boolean unknowns and
    degree 4 is a matrix of 2^41 bytes, and an F4 run at 42 variables already
    took 6.6 to 10 GB resident on this host (GOAL-ICPERF-e6b6a4 next_action,
    AP-4 measurements), so per-attempt memory is the first resource an
    m >= 5 oracle exhausts, before its time budget is even tested. WHY THE
    COLLAPSE IS FOLDED IN AS AN INPUT, NOT DECIDED: B' = B/131 requires the
    collapsed matrix to keep rank B/131 in the sense b19793 asks; this
    record tabulates both readings and lets that record decide. OFF-LIMITS
    COMPONENTS: F2 (family), F6 (the Frobenius orbit, as the collapse
    input); nothing added.

