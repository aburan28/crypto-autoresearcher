  assumptions:
    - >-
      Sparse matrix storage of m column indices per row at ceil(log2 B') bits
      each (plus 7 shift bits when collapsed); dense storage is tabulated as
      a second line (B'^2 bits) and is never the primary.
    - >-
      Oracle memory is charged per attempt at its peak, not amortised; a
      streaming or block variant of the closure is a different oracle and is
      not priced.
    - >-
      The two rho conventions are rows, not a choice; R-PUB is the published
      configuration and R-FLOOR the storage floor.
    - >-
