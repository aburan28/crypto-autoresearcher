  sota_delta: >-
    DEFINITIONAL-REFERENCE DELTA: ZERO. No attack, no key recovery, and
    therefore no margin whatsoever against exhaustive key search at any key
    size under CM-1; the published-state-of-the-art comparison is
    UNADJUDICABLE in this environment and is asserted in neither direction
    (R5 clause, same sentence). The quantitative contribution, if the
    experiment runs, is the measured comparative death-round ordering across
    the plaintext axis and the two key-schedule classes - a structural
    finding about which mixing path dominates, feeding either a C3-style
    barrier or a documented surprise.

