      WebSearch this session (2026-08-28) for "interpolation attack AES key
      schedule varying key byte" surfaced "Combined Attacks on the AES Key
      Schedule" (eprint 2012/098) and "New Representations of the AES Key
      Schedule" (eprint 2020/1253) as titles in the same technical
      neighborhood; NEITHER WAS FETCHED OR READ this session (title/snippet
