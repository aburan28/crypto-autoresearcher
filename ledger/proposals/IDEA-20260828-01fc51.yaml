    newness_score: >-
      ADAPTATION of the sister proposal's machinery (I1-I4 identities are
      generic algebraic facts about GF(2^8) interpolation, reused verbatim)
      to a structurally distinct axis whose translation-covariance breaks at
      a DIFFERENT, DERIVABLE round for each of two disjoint byte classes -
      that derivation, and the resulting comparative prediction, is the
      specific content this repository does not hold and the literature
      search above did not resolve either way.
    testability_score: >-
      Identical cost class to the sister proposal: one reading costs 256
      encryptions (fixing 15 key bytes and the plaintext, sweeping the 16th
      key byte over GF(2^8)) plus one exact GF(2^8) interpolation; a full
      ladder over r = 1..10, both byte classes (w[3] vs w[0]/w[1]/w[2]), and
      several hundred (plaintext, fixed-key-bytes) instances fits comfortably
      in one producer slot.
    survival_score: >-
      LOW, stated honestly: the plaintext-axis sister proposal already
      predicts (and gives a strong prior for) early death of the naive
      co-degree statistic; adding a second, EARLIER-injected nonlinear path
      on the key axis is expected to make death occur no later, most likely
      strictly earlier. The deliverable is the MEASURED comparative death-
      round pair (or the derived contradiction if the prediction fails),
      which is informative either way.

  mechanism: >-
    ALL STRUCTURAL CLAIMS BELOW ARE DERIVED FROM THE AES-128 KEY SCHEDULE
    RECURRENCE, RESTATING AND EXTENDING IDEA-20260805-8053e1's (C2)
    computation. AES-128 key schedule: w[0..3] = master key words; for i not a
    multiple of 4, w[i] = w[i-4] xor w[i-1]; for i a multiple of 4 (i >= 4),
    w[i] = w[i-4] xor SubWord(RotWord(w[i-1])) xor Rcon[i/4].

    CLASS A (c in w[3], bytes 12-15). w[4] = w[0] xor SubWord(RotWord(w[3]))
    directly consumes w[3] inside a SubWord call. Varying byte c within w[3]
    therefore makes w[4] - and hence ROUND KEY 1 - depend on x NONLINEARLY
    from the very first key-derived round key that differs from round key 0.
    Round key 0 = the master key itself, so round key 0's dependence on x is
    a pure translation (identical in form to the plaintext-axis mechanism);
    round key 1 is where class A's path diverges from the plaintext axis.

    CLASS B (c in w[0], w[1], or w[2], bytes 0-11). w[4] does NOT depend on
    the varied byte (SubWord(RotWord(w[3])) is now a FIXED constant), so w[4]
    = w[0](x) xor const is a pure translation in x; w[5] = w[4] xor w[1],
    w[6] = w[5] xor w[2], w[7] = w[6] xor w[3] propagate this translation
    linearly (assuming only ONE word varies) all the way to w[7] - so ROUND
    KEY 1 is STILL a pure translation in x for class B, matching the
    plaintext axis exactly at this round. The break occurs at w[8] = w[4] xor
    SubWord(RotWord(w[7])) xor Rcon[2]: w[7] carries the translation
    delta(x) established above, so SubWord is now applied to an argument that
    already varies with x, and w[8] - hence ROUND KEY 2 - is the first
    nonlinear-in-x round key for class B. THIS MATCHES, AND IS A DIRECT
    RESTATEMENT OF, IDEA-20260805-8053e1's SESSION-COMPUTED result ("at most 1
    of 10 SubWord calls shared" for a one-word key difference), reinterpreted
    here as a ROUND INDEX rather than a lookup-sharing fraction.

    THE COMPARATIVE PREDICTION. On the plaintext axis (sister proposal),
    translation covariance (identity I4) holds at EVERY round because
    AddRoundKey always applies x -> x xor (a FIXED constant, since the key is
    fixed) - there is no analogous "extra S-box injection" event, ONLY the
    round function's own S-box layer, applied every round starting at round 1
    (after AddRoundKey then SubBytes). On the key axis, class A's translation
    covariance ALREADY breaks by round key 1 (before or alongside the round
    function's own round-1 S-box layer acts on the translated state), and
    class B's breaks by round key 2 - i.e. the key schedule injects nonlinear
    dependence on x through a SECOND CHANNEL, independent of and in addition
    to the round function's own S-box mixing of the state. FORCED, TESTABLE
    CONSEQUENCE: the key-axis co-degree ladder (measuring, exactly as in the
    sister proposal, Pr[c(g) >= m] against the exact null 2^{-8m}) is
    predicted to reach its null level-1 rate NO LATER than the plaintext-axis
    ladder for the SAME output byte j, and for class A specifically, no later
    than class B.

