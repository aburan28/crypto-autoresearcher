  assumptions:
    - >-
      That the harness's AES-128 key-schedule implementation matches the
      FIPS-197 recurrence exactly (verified independently by the pinned
      known-answer vectors); a discrepancy here would invalidate the derived
      round-index predictions.
    - >-
      That 256 encryptions per reading (sweeping one key byte) and a handful
      of readings per (round, class, output byte j) fit the measured
      resource envelope; trivially true at this cost class.

  proof_search_map:
    bottleneck: >-
      Whether the branch-number weight-5 NECESSARY condition on MixColumns
      activity is also SUFFICIENT for every specific shape pair -- not
      applicable here; this record's bottleneck is instead whether the
      derived round-index breakpoints (round key 1 for class A, round key 2
      for class B) hold exactly under the pinned key schedule, which is the
      step every downstream reading depends on.
    baseline_embedding:
      parameter_slice: >-
        The plaintext-axis sister proposal's own death-round measurement for
        the identical output byte j, whose mechanism (translation covariance
        breaking only at the round function's own S-box layer) is the
        reference this record's key-axis measurement is compared against.
      reproduction_check: >-
        The plaintext-axis death round must be reproduced (or reused directly
        from that record's own run) before the key-axis comparison is
        trusted.
    observation_collision:
      observable: the round at which each axis's co-degree ladder first reaches its null level-1 rate.
      distinct_preimage_search: >-
        The dangerous collision is class A and class B producing the SAME
        measured death round despite the derived one-round gap between their
        nonlinear injection points; any such agreement is reported explicitly
        as a discriminating case requiring re-derivation.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: the key-axis co-degree death round, replacing a lookup-sharing fraction as the tracked quantity
        predicted_gain: a direct, testable round-index prediction rather than a static count.
    quantifier_order: >-
      FOR the pinned AES-128 key schedule and a fixed plaintext, THE derived
      round-index breakpoint for each byte class is claimed to hold EXACTLY;
      the empirical death-round comparison across classes is then measured,
      not assumed.
    method_ceiling:
      strongest_certifiable_claim: >-
        an exact round-index prediction for when each key-byte class's
        co-degree ladder first departs from a pure translation, verified
        directly against the pinned key schedule; no claim beyond the tested
        output bytes and round range.
      nearby_object_control: not applicable beyond the class-A/class-B distinction itself, which serves as its own internal control.
    proof_obligations:
      - claim: round key 1 is nonlinear in x for class A
        responsibility: correctness
      - claim: round key 1 is a pure translation in x for class B, breaking only at round key 2
        responsibility: correctness
      - claim: the measured death-round ordering matches the derived breakpoints
        responsibility: success_probability
    not_applicable_reason: null

  predictions:
    - metric: "round_key_1_class_A_linearity (does round key 1's dependence on a varied w[3] byte remain affine in x?)"
      direction: lower
      minimum_effect: >-
        FORCED: NO. Round key 1 must already be a nonlinear (SubWord-mediated)
        function of x for class A. Verified by direct symbolic/numeric check
        on the pinned key schedule, independent of any co-degree reading.
    - metric: "round_key_1_class_B_linearity (same, for a varied w[0]/w[1]/w[2] byte)"
      direction: higher
      minimum_effect: >-
        FORCED: YES, affine (a pure translation). If found nonlinear, the
        derivation above is wrong and the record is superseded before any
        co-degree reading is trusted.
    - metric: "codegree_level_1_death_round_key_axis_class_A vs plaintext_axis (same output byte j, N = 4096 samples per round)"
      direction: lower
      minimum_effect: >-
        Predicted class-A death round <= plaintext-axis death round, plausibly
        by exactly 1 round, given the earlier nonlinear injection at round key
        1. No exact round number is pre-registered (would invite fitting);
        the ORDERING is pre-registered and is falsifiable.
    - metric: "codegree_level_1_death_round_key_axis_class_B vs class_A"
      direction: higher
      minimum_effect: >-
        Predicted class-B death round >= class-A death round (class B's
        nonlinear injection starts one round later, at round key 2 vs round
        key 1), by exactly 1 round if the mechanism is exact and no other
        effect dominates.
    - metric: "matched_random_permutation_false_positive_rate (same data complexity, all axes)"
      direction: lower
      minimum_effect: >-
        Predicted at null (2^{-8} +/- 3 standard deviations at N = 4096),
        matching the sister proposal's calibration exactly, since the null
        model does not depend on which axis is varied.

  minimal_test:
    design: >-
      Four stages, cheapest first. STAGE 0 (seconds, can end the line):
      symbolically/numerically verify the class-A and class-B round-key
      linearity predictions directly against the pinned AES-128 key schedule,
      independent of any interpolation code - if either forced value fails,
      stop and correct the derivation before anything else runs. STAGE 1
      (seconds): re-use the sister proposal's exact GF(2^8) interpolation code
      unmodified, redirecting its varying-byte selection from a plaintext
      position to a master-key position; confirm the S-box 9-term positive
      control and the random-function null still pass unchanged (they do not
      depend on which axis is varied). STAGE 2 (minutes): the co-degree ladder
      over r = 1..10 for class A (one representative byte in w[3]) and class B
      (one representative byte each in w[0], w[1], w[2]), N = 4096 samples per
      round per class, matched-random-permutation control interleaved. STAGE 3
      (paper): compare the three measured death rounds (plaintext axis from
      the sister proposal's own run, class A, class B) and write the
      comparative barrier/finding statement.
    controls:
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR: the
        raw AES S-box's 9-term interpolation identity, unchanged from the
        sister proposal - if the reused interpolation code does not return
        exactly 9 coefficients at the derived exponents, the instrument is
        broken and no reading from this proposal may be trusted either.
      - >-
        NULL OBJECT OF THE SAME SHAPE, AND IT CAN FAIL: a uniformly random
        128-bit bijection substituted for AES at every round, read through the
        identical varying-key-byte restriction. Forced value: level-m rate
        exactly 2^{-8m}, independent of which byte position is nominally
        "varied" (since the substitute has no key schedule at all - this null
        also checks that the harness correctly treats the varied byte as an
        independent input regardless of cipher structure).
      - >-
        SIBLING NULL THAT ISOLATES THE PROPERTY: repeat the class-A vs class-B
        comparison with the key schedule's SubWord calls forced to the
        identity (an AES-128 variant with a linear key schedule, analogous to
        IDEA-20260805-4bd60c's L0 rung but applied to the KEY SCHEDULE only,
        real S-box kept in the round function). FORCED PREDICTION: with a
        linear key schedule, classes A and B collapse to a single case and
        their co-degree death rounds must MATCH the plaintext axis exactly
        (no extra nonlinear injection exists). If they do not match under this
        sibling, the class-A/class-B distinction in the main experiment is not
        attributable to the key schedule's nonlinearity and the whole
        comparative claim is void.
      - >-
        ORDERING CONTROL: null-object and sibling-null readings are computed
        and hash-committed before the real-AES class-A/class-B treatment
        readings are looked at.
      - >-
        ARCHIVE CHECK (zero compute): no prior record in this repository or in
        the two title-only eprint hits found this session measures a co-degree
        or comparable structural ladder along a KEY-BYTE axis. Recorded as
        unavailable rather than a passed check.
    required_metrics: [class-A and class-B round-key linearity check results verbatim, co-degree level-1 and level-2 rates per round per class per output byte j, measured death rounds for the plaintext axis class A and class B with the ordering verdict, matched-random-permutation false-positive rate at the same data complexity, linear-key-schedule sibling-null result]

  falsification_conditions:
    - >-
      The class-A or class-B round-key linearity forced value is wrong
      (measured against the pinned key schedule). The derivation is wrong and
      the record is superseded with the corrected round indices before any
      co-degree reading is trusted.
    - >-
      The S-box positive control or the random-function null fails (inherited
      from the reused interpolation code). Instrument broken; nothing may be
      reported.
    - >-
      The predicted ordering (class-A death round <= plaintext-axis death
      round <= or related to class-B death round) is violated after
      replication on independent key/plaintext batches. The comparative
      mechanism claim is false as stated and must be recorded as a negative
      finding about the relative mixing rates of the two paths, not
      discarded.
    - >-
      The linear-key-schedule sibling null does NOT collapse class A and
      class B to the plaintext-axis death round. The class distinction is not
      attributable to key-schedule nonlinearity and the comparative claim is
      void.

  confounders:
    - >-
      OUTPUT BYTE AND WORD-INTERACTION EFFECTS. Different output bytes j may
      show different death rounds regardless of axis, and varying a byte
      within a word can interact with MixColumns' branch structure
      differently depending on byte position within the word. Declared
      pre-run: (c, j) pairs are drawn and reported per-cell, exactly as the
      sister proposal requires for (i, j).
    - >-
      MULTI-BYTE INTERACTION WHEN VARYING WITHIN CLASS B. The class-B
      derivation assumes exactly ONE key byte varies; if the implementation
      accidentally perturbs a second byte (e.g. through an indexing error)
      the linear propagation chain through w[5]/w[6]/w[7] breaks silently.
      Stage 0's direct check on the pinned key schedule is the mitigation.
    - >-
      SESSION-DERIVED VALUES ARE NOT HARNESS MEASUREMENTS. The round-index
      breakpoints (round key 1 for class A, round key 2 for class B) are
      derived on paper here and must be re-confirmed against the actual
      pinned implementation in stage 0; a discrepancy is reported, not
      reconciled.

  interpretation_limits:
    - >-
      CLAIM TIER toy by default (RQ-AES-002 R7), for the same reason as the
      sister proposal: a d=1-byte-coset-scale measurement is toy regardless of
      the full-round ambition it serves.
    - >-
      A negative (both axes die at essentially the same round, or the
      predicted ordering fails) closes ONLY the named comparison at the
      tested scale (d=1, this instrument, this budget) and is not a universal
      statement that key-schedule and round-function nonlinearity mix
      information at the same rate in general; forward guidance: repeat at
      d=2 byte cosets if budget permits, and extend the class-A/class-B
      distinction to AES-192/256's different key-schedule cadence (every 6th
      or 8th word, with an extra SubWord for AES-256), which this proposal
      does not attempt and names as open.
    - >-
      A positive (a persistent, unexpectedly HIGH co-degree at round 10 on
      either axis) would be a candidate full-round distinguisher and routes to
      review-breakthrough at max effort under AGENTS.md rule 12, exactly as
      the sister proposal states for its own axis.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE LOAD-BEARING ON THE ROUND-INDEX DERIVATION. The class-A/class-B
        breakpoints (round key 1 vs round key 2) follow deterministically
        from the published AES-128 key-schedule recurrence and are not
        distributional claims.
      rigorous_support: >-
        Given in the mechanism, a direct propagation argument through the
        w[i] recurrence, restating IDEA-20260805-8053e1's session-computed
        SubWord-sharing bound as a round index rather than a fraction.
      validation_plan: >-
        Stage 0 checks both breakpoints directly against the pinned key
        schedule by symbolic substitution and numeric confirmation on
        multiple random key/byte choices - an exact check, not a statistical
        one.
    - id: H2
      statement: >-
        COMPARATIVE MIXING RATE. The key schedule's extra SubWord injection
        makes co-degree structure collapse no later on the key axis than on
        the plaintext axis, for the same output byte.
      rigorous_support: >-
        NOT A THEOREM - this is the genuinely uncertain empirical content of
        the proposal. The round-function's OWN S-box layer, applied to the
        full state every round starting at round 1, may already dominate
        mixing so completely that an additional, narrower (one-byte-wide)
        nonlinear injection from the key schedule adds no measurable
        additional collapse. Stated as a heuristic precisely so a null result
        (no measurable difference between axes) is reportable as a real
        finding about which path dominates mixing, not dismissed as
        "expected."
      validation_plan: >-
        MEASURED directly: the death-round comparison across axes and classes
        described in minimal_test, replicated on independent key/plaintext
        batches, with the ordering (or its absence) reported as the primary
        result regardless of which way it comes out.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVED. As in the sister proposal, the possible positive
      case (a persistent structural distinguisher at full round count) would
      have data/time complexity approx 2^{8d} for a d-byte-wide varying
      region; converting any such finding into a key-recovery mechanism is
      explicitly NOT part of this proposal.
    memory_exponent: >-
      2^8 field elements per reading (d = 1 varying byte); negligible, stated
      beside time as required.
    best_known: >-
      The reference for RQ-AES-002 is exhaustive key search under CM-1
      (definitional); the published state of the art is UNADJUDICABLE in this
      environment, asserted in neither direction.
    hidden_overhead: >-
      Exact GF(2^8) interpolation cost is O(2^{16}) field multiplications per
      reading at d = 1 (identical to the sister proposal); stated here rather
      than discovered at run time.
    tradeoff_note: >-
      Data and time move together as 2^{8d}, as in the sister proposal; no
      memory-for-time trade exists in this object.

  dominated_by: >-
