idea:
  id: IDEA-20260828-01fc51
  added: '2026-08-28'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-AES-002
  goal_id: GOAL-AES-002
  title: >-
    The key-schedule axis of the co-degree ladder: does the AES-128 key
    schedule's SECOND nonlinear injection path collapse univariate GF(2^8)
    structure earlier than the plaintext axis, with an exact predicted round
    at which each master-key byte position first goes nonlinear
  class: mechanism

  claim: >-
    Fix a plaintext P and 15 of the 16 AES-128 master-key bytes; let x range
    over GF(2^8) as the value of the remaining master-key byte c, and define
    g_{c,j}(x) = ciphertext byte j of AES-128_{K(x)}(P) at round count r. As in
    the sister object IDEA-20260805-62359f (varying a PLAINTEXT byte instead),
    g_{c,j} has a unique GF(2^8) interpolation polynomial and a well-defined
    co-degree c(g) = 255 - deg(g). CLAIM, DERIVED HERE FROM THE AES-128 KEY
    SCHEDULE RECURRENCE (the same recurrence IDEA-20260805-8053e1 already
    audited for a different purpose): the round at which g_{c,j}'s dependence
    on x FIRST becomes provably nonlinear (i.e. the point at which the
    translation-covariant structure available on the plaintext axis breaks) is
    EXACTLY DERIVABLE and depends on which master-key WORD c lies in.
    Specifically: for c in the last word (bytes 12-15, i.e. w[3]), the
    dependence is already nonlinear by ROUND KEY 1 (w[4] = w[0] xor
    SubWord(RotWord(w[3])) xor Rcon[1] uses w[3] inside a SubWord call
    directly); for c in the first three words (bytes 0-11, i.e. w[0], w[1],
    w[2]), round key 1's dependence on x remains a PURE TRANSLATION (matching
    the plaintext-axis mechanism exactly), and nonlinearity first enters at
    ROUND KEY 2, because w[8] = w[4] xor SubWord(RotWord(w[7])) xor Rcon[2]
    and w[7] already carries x-dependence through the w[4]..w[7] translation
    chain, so SubWord is now applied to a TRANSLATED argument. THIS IS A
    DIRECT EXTENSION OF THE C2 COMPUTATION ALREADY DERIVED AND
    SESSION-COMPUTED IN IDEA-20260805-8053e1 (round-key sharing bounds),
    re-purposed here to predict a co-degree DEATH ROUND rather than a shared-
    lookup COUNT. The proposal is a comparative measurement: does the
    key-schedule's EXTRA S-box application (relative to the plaintext axis,
    which enters the round function's OWN S-box layer at the same rate as
    always) make the key-axis co-degree ladder die NO LATER THAN - and
    plausibly one round EARLIER THAN - the plaintext-axis ladder, when both
    are read from the SAME round at which their respective nonlinear paths
    begin.

  object_first_candidate:
