idea:
  id: IDEA-20260807-0fafe8
  question_id: RQ-CLGP-b99df5
  added: '2026-08-07'
  title: >-
    BACKWARD REDUCTION ATTEMPT, WITH TWO INDEPENDENT OBSTRUCTIONS: an ECDLP
    oracle for every curve in the isogeny class does not solve
    Cl(O)-vectorization, because (i) Hom(Z/N, Cl(O)) = Hom(Cl(O), Z/N) = 0
    whenever N > h(O), so the oracle's answers admit no homomorphic transport,
    and (ii) vectorization inverts a TORSOR action rather than a group law --
    and the strictly stronger Cl(O)-DLP oracle, available subexponentially by
    Hafner-McCurley, is already known not to suffice
  class: mechanism

  claim: >-
    (A) THE REDUCTION BEING ATTEMPTED, WITH ITS QUANTIFIER ORDER WRITTEN OUT.

      FORALL primes p > 3,
      FORALL orders O with Z[pi] subset O subset O_K, K = Q(sqrt(t^2 - 4p)),
      THERE EXISTS a probabilistic polynomial-time oracle machine S
      such that FORALL pairs (E, E') of curves over F_p with
        End_{F_p}(E) = End_{F_p}(E') = O,
        Pr[ S^{DL}(p, E, E') = [a] with [a] * E = E' ] >= 2/3,

    where DL is a discrete-logarithm oracle answering, at unit cost, on ANY
    curve in the isogeny class and for ANY pair of points in a cyclic
    subgroup.

    ORDER MATTERS AND IS THE USUAL FAILURE POINT. S is quantified BEFORE the
    curve pair, so one machine must handle all pairs -- this is the honest
    reading of "vectorization reduces to ECDLP". Three weaker readings that
    must never be substituted:
      (W1) FORALL (E, E') THERE EXISTS S_{E,E'} -- the machine may depend on
           the pair, hence may hardwire the answer. Vacuous.
      (W2) FORALL (E, E') THERE EXISTS a sequence of DL queries whose answers
           DETERMINE [a] information-theoretically. Possibly true and useless:
           determination is not computation, and (C) shows the determination
           map is not a homomorphism, so no algebraic extraction exists.
      (W3) S is allowed unbounded queries. Then S can enumerate Cl(O) and walk
           -- but that is the sqrt(h) baseline achieved WITHOUT the oracle, so
           it is not a reduction, it is the incumbent.

    (B) WHAT THE ORACLE ACTUALLY PROVIDES. DL inverts multiplication in a
    cyclic group of order N. Its answer space is Z/N. The target answer space
    is Cl(O), a finite abelian group of order h = h(O). The reduction must
    transport answers from the first to the second.

    (C) OBS-3, HOM-VANISHING -- AND IT IS RIGOROUS, UNCONDITIONAL, AND
    TWO-SIDED. h(O) = O(sqrt(|disc O|) log|disc O|) with |disc O| = |t^2 - 4p|
    <= 4p, so h(O) = O(sqrt(p) log p); and N = #E(F_p)/c >= (p + 1 -
    2 sqrt(p))/c for cofactor c. Hence N > h(O) whenever
        c < (p + 1 - 2 sqrt p) / (C sqrt p log p),
    i.e. for every cofactor up to roughly sqrt(p)/log p -- which comfortably
    includes all standardised curves (c <= 8) and all curves this campaign
    tests. Given N prime and N > h, gcd(N, h) = 1, and therefore
        Hom(Z/N, Cl(O)) = 0 and Hom(Cl(O), Z/N) = 0.
    (Proof, both directions, one line each: the image of a homomorphism out of
    Z/N is a subgroup of Cl(O) of order dividing the prime N and dividing h,
    hence trivial; the image of a homomorphism out of Cl(O) is a quotient of
    Cl(O) inside Z/N, so its order divides gcd(h, N) = 1.)
    CONSEQUENCE: no group-homomorphic transport of oracle answers exists in
    EITHER direction. This is the same counting fact that closes the forward
    homomorphic route in IDEA-20260807-bbdcf3, applied here to the oracle's
    answer space.

    (D) OBS-4, THE TORSOR OBSTRUCTION -- WHY EVEN A PERFECT GROUP ORACLE FOR
    THE RIGHT GROUP WOULD NOT SUFFICE, WHICH IS THE A FORTIORI ARGUMENT.
    Vectorization is not a DLP. It is inversion of a FREE TRANSITIVE ACTION of
    Cl(O) on a set X of curves: given x, y in X, find a with a . x = y. The
    set X carries no group law and no basepoint-independent structure; the
    only handle is the evaluation map (a, x) |-> a . x.
    Now the a fortiori step. The DLP INSIDE Cl(O) -- given ideal classes A, B
    with B = A^k, find k -- is subexponential: Hafner-McCurley compute the
    structure of the class group of an imaginary quadratic order in expected
    time L_{|D|}(1/2, sqrt(2) + o(1)) (Las Vegas; GRH-conditional refinements
    give the exponent 3/sqrt(8)), and class-group DLP follows by the same
    index-calculus machinery. Despite this, classical vectorization is still
    ~O(sqrt(h)) (KN-TECH-027) -- the group side is subexponential and the
    TORSOR side is not. That gap is direct evidence that solving a group does
    not solve its torsor. An ECDLP oracle is not even a Cl(O)-DLP oracle: it
    solves a DIFFERENT group with which Cl(O) shares no nontrivial
    homomorphism by (C). So if the strictly more relevant oracle does not
    suffice, the less relevant one a fortiori does not.
    HONESTY MARKER: the a fortiori step is CONDITIONAL on the standing belief
    that classical vectorization costs ~sqrt(h). That belief is an assumption
    of the field, not a theorem, and is labelled as such below. OBS-3 is
    unconditional; OBS-4 is not.

    (E) THE SUBROUTINE ENUMERATION -- THE CHECKABLE FORM OF THE ARGUMENT. Every
    known route to evaluating or inverting the class-group action decomposes
    into these subroutines, and none of them is a DLP in a group of order N:
      (E1) act by a small prime ideal l = (ell, pi - lambda): find the
           lambda-eigenspace of Frobenius on E[ell] and quotient. Cost:
           linear algebra mod ell. NOT a DLP.
      (E2) express an arbitrary class in terms of the chosen small primes:
           relation-lattice CVP, the CSI-FiSh step (KN-LIT-3339). NOT a DLP.
      (E3) compute the structure of Cl(O): index calculus on ideals
           (Hafner-McCurley). This IS a DLP-flavoured computation, but in
           Cl(O), and it is already subexponential without any oracle.
      (E4) find the connecting class from (E, E'): meet-in-the-middle or
           kangaroo on the Cayley graph, ~sqrt(h). NOT a DLP; it is a
           collision search in a torsor.
    A backward reduction must speed up (E4), and (E4)'s only interface is the
    evaluation map. A DL oracle offers no interface to it. Falsifying this
    record means exhibiting a fifth subroutine, or a rewriting of (E4) as a
    DLP in a group of order N.

  resource_label: >-
    R4 (isogeny graph / class-group action -- the object being solved for) and
    R3 (End(E) as a ring -- ideals, norms, class number bounds). The ECDLP
    oracle is the GRANTED resource, not the consumed one.
  admissibility: admissible
  admissibility_argument: >-
    Admissible under the campaign filter, but note the filter is being used in
    an unusual direction here: the proposal does not attack ECDLP at all, it
    attacks vectorization USING ECDLP. Nothing applies an endomorphism to a
    point of G, so H-ENDO-001's scalar collapse is irrelevant, and the closed
    oracle classes of KN-FIND-b7e091 (incidence, endomorphism-image) are not
    invoked. The resource named (R4) genuinely escapes the generic group
    because the class-group action moves between curves, which a generic group
    oracle cannot express. The proposal is then closed by OBS-3/OBS-4, not by
    the admissibility filter.

  discriminated_from:
    - >-
      IDEA-20260807-5d7606, the FORWARD direction. That record grants a
      vectorization oracle and attacks ECDLP; this one grants an ECDLP oracle
      and attacks vectorization. The obstructions are DIFFERENT: forward dies
      on the prime-order collapse of the kernel-ideal bridge (a constancy
      statement about a map that exists); backward dies on Hom-vanishing plus
      the torsor/group distinction (a non-existence statement plus an a
      fortiori). The asymmetry of the two failure modes is itself a finding
      and neither record subsumes the other.
    - >-
      KN-TECH-027 records CSIDH's classical/quantum costs. It does not
      consider ECDLP oracles at all.
    - >-
      DEC-20260804-3677f1 and DEC-20260725-004 both treat CSIDH vectorization
      as an ADJACENT baseline that dominates a supersingular-lane proposal.
      Neither asks whether an ECDLP oracle assists vectorization. No overlap.
    - >-
      KN-TECH-081's non-commutative PIP question. That is a rank-1 quaternion
      order problem; this is a rank-0-unit commutative order problem. The
      transfer is analysed separately in IDEA-20260807-8cdc79.

  object_first_candidate:
    tracked_object: >-
      THE ANSWER-SPACE PAIR (Z/N, Cl(O)) together with the group
      Hom(Z/N, Cl(O)) + Hom(Cl(O), Z/N) of possible algebraic transports. The
      tracked object is the transport group itself, followed as p, t and the
      cofactor c vary.
    lossiness: >-
      LOSSY AND COMPATIBLY SO: it forgets everything about the curves, the
      points, the ideals and the algorithms, retaining only two orders and
      their gcd. What it discards is discarded compatibly with the target's
      operations because any algebraic transport of oracle answers must be a
      group homomorphism on answer spaces, and homomorphisms are determined by
      the orders in exactly the way retained. It is emphatically NOT a change
      of coordinates: an entire algorithmic question collapses to gcd(N, h).
    propagation: >-
      One-step propagation is defined and measurable: given an instance, the
      object is (N, h, gcd(N, h)); under a step of the class-group action the
      curve changes and (N, h, gcd) does NOT (N and h are class invariants).
      So the object is constant along the Cayley graph, which is exactly why
      no walking strategy can escape the obstruction.
    survival_score: >-
      Survives every isogeny step, every choice of base curve, and every
      cofactor below ~sqrt(p)/log p. DIES when N <= h, i.e. when the cofactor
      is enormous -- the escape regime probed in IDEA-20260807-bbdcf3 and
      IDEA-20260807-326442's boundary discussion. Knowing exactly where it
      dies is what makes it a real object rather than a slogan.

  mechanism: >-
    STEP 1 (zero compute). Freeze the quantifier order of (A) and the three
    weaker readings. Any subsequent argument is checked against it.

    STEP 2 (zero compute, symbolic, HARD GATE). Prove OBS-3 in the exact
    stated form, including the explicit cofactor threshold. Two one-line
    arguments plus the class-number bound. This is the unconditional core.

    STEP 3 (toy compute, cheap). VERIFY the threshold empirically rather than
    trusting the asymptotic: over a ladder of toy primes, enumerate ordinary
    curves, compute t, D, the conductor, O, h(O) (by counting reduced forms),
    N and c, and record the empirical distribution of h(O)/N. Predicted: h/N
    concentrated near p^{-1/2} times a log factor, and NEVER >= 1 for c small.
    The measurement also produces the ESCAPE SET: all toy instances with
    N <= h, which are handed to the boundary analysis.

    STEP 4 (zero compute). Run the subroutine enumeration (E1)-(E4) against
    the current literature and against this corpus, and record for each
    whether any known algorithm rewrites it as a DLP in a group of order N.
    Predicted: none. This step is a literature audit, and a positive hit is an
    ingredient rather than a disappointment.

    STEP 5 (toy compute, the interesting one). CHARGE the a fortiori argument
    instead of asserting it. On toy classes with h between 50 and 5000:
    (a) measure the cost of vectorization by kangaroo/MITM on the Cayley
    graph, in action evaluations, and fit against sqrt(h);
    (b) grant an ORACLE that solves DLP in Cl(O) (implemented by brute force
    at toy scale, so it is exact and free) and re-measure -- i.e. give the
    attacker the strictly stronger oracle;
    (c) confirm that (b) does not reduce the measured cost below (a).
    This makes the a fortiori step a MEASURED statement at toy scale rather
    than a conditional belief, which is the honest way to use it.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Repository greps on 2026-08-07 over ledger/, knowledge/, docs/,
      analysis/: "vectoriz"; "class group|Cl\(O\)|class number"; "torsor";
      "Hafner|McCurley|CSI-FiSh|Beullens|Kuperberg|subexponential". External
      check: one web search on the Hafner-McCurley complexity statement,
      confirming expected time exp((sqrt2 + o(1)) sqrt(log d log log d)) for
      the class group of an imaginary quadratic order (JAMS 1989) and the
      GRH-conditional refinement to exponent 3/sqrt(8).
    results: >-
      Zero records in ledger/ or knowledge/ propose or analyse an
      ECDLP-oracle-to-vectorization reduction. "Hafner"/"McCurley": ZERO hits
      anywhere in knowledge/ -- the class-group index-calculus line is absent
      from this corpus, which is itself worth recording. "CSI-FiSh" appears as
      KN-LIT-3339 (marked read) and KN-TECH-051/KN-LIT-4784/KN-LIT-6380
      (SCALLOP, lossy CSI-FiSh). KN-TECH-027 gives classical vectorization as
      ~O(sqrt(#Cl)).
    verdict: >-
      ADAPTATION. The group/torsor distinction and the Hom-vanishing count are
      elementary and certainly not new mathematics; Hafner-McCurley is 1989.
      New to this corpus: the explicit backward reduction statement with its
      quantifier order, the cofactor threshold at which OBS-3 lapses, the
      subroutine enumeration (E1)-(E4), and the a fortiori argument made
      MEASURABLE at toy scale by granting a brute-force Cl(O)-DLP oracle.
      No external novelty is claimed.

  null_object_control: >-
    MANDATORY AND BLOCKING. The matched null for Step 5 is a PLANTED-BRIDGE
    torsor: build a synthetic free transitive action of Cl(O) on a set X of h
    labels in which the label of a . x is defined to be a SIMPLE function of a
    (e.g. its index under a fixed enumeration), so that a Cl(O)-DLP oracle
    provably DOES solve vectorization. The measurement pipeline of Step 5(b)
    must show a large cost drop on this planted null. If it does not, the
    pipeline cannot detect an oracle benefit at all and every "no benefit"
    reading from the real torsor is void; the run set is INVALID, not
    negative.
    DECAY PARAMETER: h. The cost ratio (with oracle)/(without oracle) on the
    REAL torsor must stay at 1 +- noise as h grows over the ladder; on the
    PLANTED null it must fall like 1/sqrt(h). A benefit on the real torsor
    that does NOT decay away as h grows is the canonical artifact tell and
    means the toy implementation leaked structure the real problem lacks.

  assumptions:
    - >-
      Ordinary curves; End_{F_p}(E) = O and the action of Cl(O) on the set of
      curves with that exact endomorphism ring is free and transitive
      (Deuring/Waterhouse; Kohel for the volcano stratification). Verified per
      instance at toy scale by counting the orbit, not assumed.
    - >-
      N prime and N > h(O). Both are CHECKED per instance and instances
      failing either are routed to the escape-set analysis rather than
      silently dropped.
    - >-
      The a fortiori step (D) uses the standing belief that classical
      vectorization is ~sqrt(h). THIS IS AN ASSUMPTION OF THE FIELD, NOT A
      THEOREM, and it is the one place this record is conditional. OBS-3 does
      not depend on it.
    - >-
      Hafner-McCurley is quoted for the class-group computation complexity of
      IMAGINARY QUADRATIC orders. It is used only to establish that the group
      side is easier than the torsor side; no step of any proposed algorithm
      runs it.

  proof_search_map:
    bottleneck: >-
      Step 4's subroutine enumeration (E1)-(E4). OBS-3 is a two-line count and
      cannot be the bottleneck; the risk concentrates entirely in whether the
      enumeration of interfaces to the class-group action is exhaustive.
    baseline_embedding:
      parameter_slice: >-
        Set the DL oracle to a null oracle (always returns 0). S must then
        degenerate to plain vectorization, whose baseline is meet-in-the-
        middle / kangaroo on the Cayley graph at ~sqrt(h) action evaluations
        (KN-TECH-027; the p^{1/4} figure in KN-TECH-029 is the neighbouring
        supersingular F_p-subgraph statement and must not be conflated with
        it). Any claimed reduction must beat sqrt(h) at the same parameters.
      reproduction_check: >-
        Frozen fixture: three toy classes with h in {64, 256, 1024}. Measure
        MITM/kangaroo vectorization cost in action evaluations and fit against
        c sqrt(h); require the fitted exponent in [0.40, 0.60]. If the
        baseline does not reproduce, no oracle-benefit comparison is
        interpretable.
    observation_collision:
      observable: >-
        The transported answer: any function f mapping DL-oracle outputs in
        Z/N to elements of Cl(O) that the reduction would use.
      distinct_preimage_search: >-
        REQUIRED. Search for a nonzero homomorphic f. Predicted result:
        Hom(Z/N, Cl(O)) = 0, so the search returns only f = 0 -- every DL
        answer maps to the identity class, the maximal possible collision.
        Then EXTEND the search to non-homomorphic f: the honest statement is
        that non-homomorphic transports are NOT excluded by OBS-3 and are the
        residual open class, since an arbitrary function Z/N -> Cl(O) exists
        in abundance; what is excluded is that any such function is
        COMPUTABLE from the instance and CORRECT for all instances. That
        distinction must be written into the conclusion.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "does an ECDLP oracle help vectorize" by "is there a nonzero
          homomorphism between the two answer spaces", a question decided by
          gcd(N, h).
        predicted_gain: >-
          Collapses an algorithmic question to an arithmetic one, at zero
          compute, with an explicit boundary (N <= h) where the collapse
          fails. That boundary is the record's forward guidance.
      - transform: boundary_lift
        proposed_object: >-
          Instances with N <= h (huge cofactor), where gcd(N, h) may be N and
          a nonzero homomorphism EXISTS abstractly.
        predicted_gain: >-
          Tests whether the obstruction is really about the counting or about
          something deeper. Prediction: even where a homomorphism exists it is
          not canonical and not computable from public data, so the deeper
          obstruction survives -- which would be a stronger result than the
          count alone.
    quantifier_order: >-
      INTENDED: FORALL p, FORALL O, THERE EXISTS a PPT oracle machine S, such
      that FORALL curve pairs (E, E') in the O-stratum, S^{DL}(E, E') returns
      the connecting class with probability at least 2/3.
      NOT CLAIMED: FORALL (E,E') THERE EXISTS S_{E,E'} (vacuous); or an
      information-theoretic determination statement with no constructibility
      (true and useless).
      WHAT THIS RECORD ASSERTS UNCONDITIONALLY: FORALL p, O with N prime and
      N > h(O), THERE EXISTS NO nonzero group homomorphism Z/N -> Cl(O) and
      none Cl(O) -> Z/N. Note the existential is negated and the statement has
      no algorithmic quantifier at all, which is why it is a theorem and not a
      conjecture.
    method_ceiling:
      strongest_certifiable_claim: >-
        "No backward reduction whose extraction of the connecting class from
        oracle answers is a group homomorphism on answer spaces can work, for
        N prime and N > h(O)." It can NEVER certify that no backward reduction
        exists: non-homomorphic extractions, many-instance/statistical
        extractions, and reductions that use the oracle on auxiliary groups of
        non-prime order all remain outside. Dropping any qualifier is
        overclaiming.
      nearby_object_control: >-
        THE PLANTED TORSOR of null_object_control, where a Cl(O)-DLP oracle
        DOES solve vectorization by construction. The method must NOT close
        that object. A version of the argument that also "closes" the planted
        torsor is proving too much and has identified the wrong structure.
    proof_obligations:
      - claim: h(O) = O(sqrt(|disc O|) log |disc O|), unconditional.
        responsibility: size
      - claim: >-
          N > h(O) for every cofactor below the stated threshold, with the
          threshold made explicit.
        responsibility: size
      - claim: >-
          gcd(N, h) = 1 implies both Hom groups vanish.
        responsibility: correctness
      - claim: >-
          The enumeration (E1)-(E4) of interfaces to the class-group action is
          exhaustive for known algorithms.
        responsibility: scope
      - claim: >-
          At toy scale, granting an exact Cl(O)-DLP oracle does not reduce
          measured vectorization cost.
        responsibility: baseline
      - claim: >-
          The planted torsor null DOES show an oracle benefit.
        responsibility: soundness

  predictions:
    - metric: >-
        maximum over the toy instance set of h(O)/N, for instances with
        cofactor c <= 8
      direction: lower
      minimum_effect: >-
        Strictly below 1 on 100 percent of such instances, and the fitted
        scaling of h/N against p has slope in [-0.65, -0.35] (predicted -1/2
        up to logs). A single c <= 8 instance with h >= N falsifies the stated
        threshold and forces its recomputation.
    - metric: >-
        ratio of vectorization cost WITH an exact Cl(O)-DLP oracle to cost
        WITHOUT it, on real toy classes, in action evaluations
      direction: different
      minimum_effect: >-
        Ratio in [0.8, 1.25] at every h on the ladder, i.e. no benefit beyond
        noise. A ratio below 0.5 that persists as h grows would refute OBS-4's
        a fortiori step and would be a genuine finding about torsor inversion,
        escalated for independent review.
    - metric: >-
        the same ratio on the PLANTED torsor null
      direction: lower
      minimum_effect: >-
        Below 0.2 at h >= 256 and falling like 1/sqrt(h). If it does not, the
        pipeline cannot see an oracle benefit and every real-torsor reading is
        void.
    - metric: >-
        number of distinct nonzero homomorphisms Z/N -> Cl(O) found by
        exhaustive search at toy scale
      direction: lower
      minimum_effect: >-
        Exactly zero whenever gcd(N, h) = 1; exactly the predicted count
        (number of elements of order dividing N in Cl(O), minus 1) when
        gcd(N, h) = N. This is a known-answer calibration of the search code
        and both branches must be observed.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): prove OBS-3 with the explicit
      cofactor threshold, and run the (E1)-(E4) literature audit. If a
      reviewer names a fifth interface or rewrites (E4) as a group DLP, the
      record is refuted before compute.
      STAGE 1 (minutes): toy enumeration of ordinary classes; record
      (p, t, D, f, O, h, N, c) per instance; compute h/N; collect the escape
      set N <= h.
      STAGE 2 (hours): implement the class-group action on toy classes
      (small split primes acting on curves, verified by orbit counting);
      measure MITM/kangaroo vectorization cost; fit against sqrt(h).
      STAGE 3 (hours, THE DISCRIMINATOR): re-run Stage 2 with an exact
      brute-force Cl(O)-DLP oracle granted for free; compute the cost ratio.
      Then run the identical measurement on the planted torsor null.
      STAGE 4 (zero compute): exhaustive homomorphism search at toy scale as
      a known-answer calibration, in both the gcd = 1 and gcd = N regimes.
    controls:
      - >-
        planted torsor with a constructed group-to-torsor bridge -- the
        instrument MUST report a large oracle benefit there
      - >-
        orbit-count verification that the implemented action is free and
        transitive on the O-stratum (h curves, h classes)
      - >-
        known-answer homomorphism counting in both gcd regimes
      - >-
        baseline reproduction of sqrt(h) vectorization cost before any ratio
        is computed
    required_metrics:
      - h(O), N, c, h/N per instance, with the escape set listed explicitly
      - vectorization action-evaluation counts with and without the oracle
      - the same on the planted null, per h
      - fitted exponent of cost against h, with confidence interval
      - homomorphism counts per gcd regime

  falsification_conditions:
    - >-
      A c <= 8 instance is found with h(O) >= N. OBS-3's threshold is wrong as
      stated; recompute it and rescope every conclusion that used it.
    - >-
      Granting the exact Cl(O)-DLP oracle reduces measured vectorization cost
      by more than a factor 2, persistently as h grows, on real toy classes.
      OBS-4's a fortiori step is false; escalate for independent review before
      any interpretation.
    - >-
      The planted torsor null shows NO oracle benefit. Instrument blind; run
      set INVALID rather than negative.
    - >-
      A reviewer exhibits an interface (E5) to the class-group action that is
      a DLP in a group of order N. The subroutine enumeration is incomplete
      and the record is superseded.

  confounders:
    - >-
      TOY-SCALE h IS TINY. At p ~ 2^16, h can be under 100, where sqrt(h) and
      h differ by less than an order of magnitude and cost fits are
      unreliable. The ladder must reach h >= 1000 before any exponent fit is
      reported, and h must be printed with every measurement.
    - >-
      ACTION-EVALUATION COST IS NOT CONSTANT. Acting by a large-norm ideal
      costs more than by a small one. If the oracle-granted variant happens to
      use cheaper ideals, a spurious speedup appears. The metric must be
      action evaluations of a FIXED small-prime generator set, not wall clock.
    - >-
      CONDUCTOR STRATIFICATION. Curves in one isogeny class sit at different
      volcano levels with different O and different h. Mixing levels in one
      cost fit produces a meaningless exponent. Stratify by O.
    - >-
      THE ESCAPE SET IS SELECTED, NOT RANDOM. Instances with N <= h are found
      by search and are unrepresentative; any statistic computed on them is
      conditional on that selection and must be reported as such.

  interpretation_limits:
    - >-
      This closes homomorphic transport, not all reductions. Non-homomorphic,
      statistical, and many-instance reductions are explicitly outside.
    - >-
      QUANTUM: Kuperberg/Regev-style subexponential quantum vectorization
      (KN-TECH-027, KN-TECH-051, KN-OPEN-014, KN-LIT-071) attacks the CLASS
      GROUP side and says nothing about the ECDLP. It does not bear on this
      record in either direction, and the campaign is classical. Recorded here
      solely so no reader imports it as relevant.
    - >-
      Hafner-McCurley is cited for a complexity statement about class group
      computation in imaginary quadratic orders. It is not run, not
      reimplemented, and not claimed to be improved.
    - >-
      Toy scale for everything empirical. h in the thousands is not h ~
      2^{256}, and the a fortiori measurement is a toy-scale calibration of a
      field-standard belief, never a validation of it at cryptographic size.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For ordinary curves over F_p with cofactor c <= 8, the class number of
        End_{F_p}(E) satisfies h(O) < N. Formally: h(O) <= C sqrt(|t^2-4p|)
        log|t^2-4p| for an absolute constant C, and (p+1-2 sqrt p)/c exceeds
        that bound for all p above an explicit threshold.
      rigorous_support: >-
        UNCONDITIONAL, not heuristic: analytic class number formula plus the
        classical elementary bound L(1, chi_D) = O(log|D|). Listed as H1 only
        so the constant C and the threshold are pinned by measurement rather
        than assumed.
      validation_plan: >-
        Compute h(O) exactly for every toy discriminant on the ladder by
        counting reduced binary quadratic forms, fit C, and record the
        smallest p at which the threshold holds for c = 1, 2, 4, 8. Compare
        the empirical distribution of h(O)/sqrt(|D|) against the
        Cohen-Lenstra-flavoured expectation that it concentrates around a
        constant times L(1, chi) with no mass near zero; tail check on the
        smallest observed h(O)/sqrt(|D|). LABELLED TOY SCALE.
    - id: H2
      statement: >-
        Classical vectorization on a Cl(O)-torsor of size h costs
        Theta(sqrt(h)) action evaluations, with no algorithm exploiting
        knowledge of the group structure of Cl(O) to do better.
      rigorous_support: >-
        Imitates the generic collision/birthday bound for inverting a free
        transitive action accessed only through its evaluation map. It is a
        FIELD ASSUMPTION (it is what CSIDH's classical parameter sizing rests
        on, KN-TECH-027) and NOT a theorem; the campaign records it as such
        and does not launder it into a proof.
      validation_plan: >-
        Measure vectorization cost against h over the toy ladder with and
        without an exact Cl(O)-DLP oracle; compare the fitted exponent against
        the predicted 1/2 and the oracle-granted variant against the same;
        tail check on the single fastest observed solve versus the predicted
        distribution of collision times. Then run the planted-torsor positive
        control to show the measurement CAN see an exponent change.
        LABELLED TOY SCALE; toy h in the thousands validates the instrument,
        not the assumption at CSIDH sizes.

  reachability_gate: >-
    T5 IS THE ENTIRE DIFFICULTY OF THE PROBLEM BEING SOLVED HERE, not an
    incidental cost. This proposal's target IS reaching a specified curve, so
    the gate is not passed by design: reaching E' from E is exactly
    vectorization at ~sqrt(h) = p^{1/4} action evaluations. Random walking to
    a UNIFORM curve is cheap (O(log p) steps under the GRH-conditional rapid
    mixing cited in T5), which is precisely the dichotomy T5 states, and the
    proposal exploits nothing from the cheap side. Consequently: any
    experiment here must budget sqrt(h) per solved instance and must cap h so
    the toy ladder terminates. Concretely, h <= 4096 keeps a single solve
    under a few thousand action evaluations.

  target_complexity:
    time_exponent: >-
      NO IMPROVEMENT CLAIMED IN EITHER PROBLEM. Vectorization stays at
      ~sqrt(h) = p^{1/4 + o(1)} action evaluations classically; ECDLP stays at
      0.886 sqrt(N) = p^{1/2} group operations. The record's content is that
      the granted oracle moves neither exponent.
    memory_exponent: >-
      Kangaroo-style vectorization is O(1) memory; MITM is sqrt(h) memory. The
      toy pipeline uses the kangaroo variant to keep memory O(1), and records
      which variant produced each number, since the two sit at different
      points of the frontier.
    best_known: >-
      Vectorization: ~sqrt(h) classical (KN-TECH-027); subexponential quantum
      via Kuperberg (KN-TECH-027, KN-TECH-051) -- QUANTUM, out of campaign
      scope. Class-group structure and Cl(O)-DLP: L_{|D|}(1/2, sqrt 2 + o(1))
      classical (Hafner-McCurley 1989). ECDLP: 0.886 sqrt(N) (KN-TECH-001,
      KN-TECH-006).
    hidden_overhead: >-
      The sqrt(h) figure hides the cost of ONE action evaluation, which is
      polynomial but not small: it requires an ell-torsion eigenspace
      computation per step, and for a general class a relation-lattice
      decomposition first (E2). At cryptographic size that is the difference
      between p^{1/4} "steps" and p^{1/4} times a substantial polynomial.
      Disclosed here because "p^{1/4}" is otherwise read as cheaper than it is.
    tradeoff_note: >-
      Vectorization admits the standard van Oorschot-Wiener style
      time-memory-parallelism interpolation on the Cayley graph (distinguished
      points on the isogeny graph), so the sqrt(h) figure parallelises
      linearly with O(1) memory per core. This is stated for cost honesty; no
      part of this proposal proposes to run it at scale.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES on BOTH frontiers, because
    this proposal touches two problems.
    Against the ECDLP frontier: mounts no ECDLP attack, so dominated by
    parallel rho (0.886 sqrt(N) time, O(1) memory, KN-TECH-001/KN-TECH-006),
    by BSGS (sqrt(N)/sqrt(N)), by automorphism-discounted rho on CM curves
    (KN-TECH-018) and by kangaroo on a known interval.
    Against the vectorization frontier: dominated by MITM/kangaroo on the
    Cayley graph at ~sqrt(h) time (KN-TECH-027) -- the proposed
    oracle-assisted route is predicted to TIE it, never beat it -- and,
    outside the campaign's classical scope, by Kuperberg-style quantum
    vectorization on the time axis.
    dominated_by is therefore NOT null on either frontier.
  sota_delta: >-
    Zero on both frontiers, stated quantitatively: ECDLP 0.886 sqrt(N) before
    and after; vectorization Theta(sqrt(h)) before and after, with the
    predicted oracle-granted cost ratio in [0.8, 1.25]. The delta is a closure
    with an unconditional core (Hom-vanishing for all cofactors below
    ~sqrt(p)/log p), a conditional a fortiori step that is explicitly labelled
    conditional and then MEASURED at toy scale, and a four-item enumeration of
    the interfaces a future reduction would have to attack.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.99 that OBS-3 holds exactly as stated for c <= 8 -- it is a counting
    argument with a comfortable margin. 0.90 that the toy measurement shows no
    oracle benefit (the residual 0.10 is dominated by implementation leakage
    at tiny h, not by mathematics). 0.7 that the planted-torsor control fires
    correctly on the first implementation. 0.5 that the toy ladder reaches
    h >= 1000 within budget, which is the binding practical risk. Priority is
    MEDIUM rather than high because the unconditional core (Stage 0) is nearly
    free and the expensive Stages 2-3 only convert a field-standard belief
    into a toy-scale calibration.

