idea:
  id: IDEA-20260809-439aa8
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-AEADC-8db132
  goal_id: GOAL-AEADC-001
  title: >-
    Padding-based commitment fixes claim a bound in bits of padding — test the
    bound by attacking one bit below it
  class: control
  claim: >-
    Padding-based repairs (prepending a fixed block of zeros to the plaintext and
    checking it on decryption) carry a claimed commitment level as a function of
    the padding length. The claim is that the bound is testable rather than merely
    citable: at padding lengths BELOW the claimed threshold, a collision
    construction should succeed with measurable cost, and at the threshold it
    should exceed the declared budget. Measuring the boundary is a direct test of
    the bound's tightness.
  mechanism: >-
    Sweep the padding length. For each length, run the collision construction
    with the padding blocks as additional linear constraints and measure success
    and cost. The transition from feasible to infeasible locates the empirical
    boundary, which is then compared against the claimed one.
  why_not_a_renamed_known_approach: >-
    Testing a claimed bound by approaching it from below is standard scientific
    practice and unusual in this specific setting, where padding lengths are
    chosen from a formula. The record's value is the empirical boundary and its
    comparison with the formula.
  predictions:
  - observable: construction success versus padding length
    metric: success rate and cost per length
    predicted: A sharp feasibility boundary. A boundary substantially below the claimed threshold indicates the bound is loose; above it would indicate the bound is wrong, which would be a significant finding requiring careful re-verification before recording.
  - observable: cost growth near the boundary
    metric: cost versus padding length
    predicted: Exponential in the padding length, as the bound's derivation implies; polynomial growth would contradict the derivation and must be investigated before any claim.
  minimal_test: >-
    Sweep padding length from zero to beyond the claimed threshold, with declared
    per-length budget, recording success, cost, and certificates where found.
  controls:
  - 'ZERO-PADDING ANCHOR: at zero padding the construction must succeed exactly as in IDEA-20260809-313546, confirming the sweep''s lower anchor.'
  - 'BUDGET DECLARATION: the per-length budget is declared before the sweep, since an undeclared budget turns infeasibility into an artifact of when the run was stopped (AGENTS.md rule 3).'
  falsification_conditions:
  - Cost does not grow with padding length, contradicting the mechanism.
  - The empirical boundary coincides exactly with the claimed threshold, which would mean the bound is tight and the record reports a confirmation rather than a gap.
  interpretation_limits: >-
    Infeasibility at a given padding length within a declared budget is a budget
    statement about this construction, never a proof that no cheaper construction
    exists.
  sota_delta: 'No attack. Delta: an empirical boundary against a claimed bound, which is the difference between citing a fix and testing it.'
  dominated_by: Downstream of IDEA-20260809-313546; not dominated by any corpus record.
  estimated_cost: Implementation small; compute moderate near the boundary.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for padding-based commitment: no records. WEB NOT CHECKED.'
