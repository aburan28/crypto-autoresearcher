idea:
  id: IDEA-20260811-22b6b8
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE T5 GATE, WORKED END TO END IN THE ONE CLASS THAT ADMITS IT - the
    committed p = 4001, t = 30 class contains exactly one degeneration vertex
    (j = 2257) among 138, and membership is decidable by TWO MULTIPLICATIONS
    (a^3 + 8b^2 = 0), so T5's local-test clause passes perfectly; measure the
    hitting-time distribution of a Velu 2-isogeny walk to that vertex against the
    volcano's known downward drift, and then charge the prize honestly - a
    439 -> 391 support drop worth about zero by the campaign's own committed
    support-versus-time pair. A PASSING REACHABILITY GATE THAT DELIVERS NOTHING
    IS THE FINDING
  class: algorithm

  object: >-
    OBJ-WALK, the hitting-time distribution of a self-avoiding-free random
    isogeny walk to a LOCALLY DECIDABLE target vertex inside one isogeny class.
    The tracked object is the walk's position projected onto the Boolean
    "is the current vertex on the degeneration divisor" - a one-bit lossy
    projection of the whole curve that is computable in O(1) field operations
    from the vertex's own equation, with no global address, no class-group
    element, and no discrete logarithm.

  resource: >-
    R4 (the isogeny graph) primarily, with R2 supplying the local test.
    H-ENDO-001 admissibility: the walk moves between curves, never applies an
    endomorphism to a point of G, and the transported instance keeps the same k
    by T1. Nothing here needs a non-scalar action on G.

  claim: >-
    (A) THE T5 GATE, RESTATED AND THEN ANSWERED. DECOMPOSITION.md T5 admits a
    cost-minimising vertex only if goodness is (i) common enough to hit by random
    walking, or (ii) decided by a LOCAL test evaluable at each step. In every
    other lane of this campaign clause (ii) is the hard one - volcano level needs
    isogeny counting, endomorphism order needs class-group data, "good for
    Groebner" needs a solve. HERE CLAUSE (ii) IS FREE: the degeneration condition
    is a polynomial identity in (a, b), two multiplications and an addition, with
    no point counting and no isogeny computation. This is, as far as the corpus
    shows, the only object in GOAL-ENDO-001 for which clause (ii) is genuinely
    cheap, and that makes it the right place to run the gate to completion.
    (B) THE INSTANCE, WHICH IS ALREADY CERTIFIED. p = 4001, t = 30,
    D = -15104 = -59 * 16^2, conductor 16, a 2-volcano of depth 4 with level
    sizes 3, 9, 18, 36, 72 summing to the committed 138, Hurwitz-certified and
    independently re-enumerated with zero disagreements (EV-ICINV-6b6264). Exactly
    one member, (a, b) = (441, 294) with j = 2257, lies on a^3 + 8b^2 = 0, and the
    committed adjudication establishes there is no off-by-one in either direction.
    So the target is a SINGLE KNOWN VERTEX out of 138 in a class the campaign has
    already enumerated and certified - the cheapest possible setting for a
    hitting-time experiment, with the ground truth known in advance.
    (C) THE PREDICTION, CONDITIONAL ON A GATE AND STATED BOTH WAYS. The walk is
    on an ell = 2 volcano, and random ell-isogeny walks on a volcano DRIFT
    DOWNWARD: from a level-i vertex with i below the floor, most outgoing edges
    descend, so the stationary distribution concentrates on the floor rather than
    being uniform. GATE: first determine the LEVEL of the vertex (441, 294) by
    Velu, not by a 2-torsion count - the committed 2-torsion level variable
    resolved 2 of 5 levels and is wrong (red_team_notes.md section 10). THEN:
      P-FLOOR - if the target is on the floor (72 of 138 vertices), the median
        hitting time is predicted BELOW 138 steps, and specifically in
        [40, 200], because the walk's stationary mass concentrates exactly where
        the target is.
      P-CRATER - if the target is on the crater (3 of 138), the median hitting
        time is predicted ABOVE 300 steps and possibly far above, because the
        walk must climb against the drift; the ascending step is the rare one.
      P-MID - if the target is at an intermediate level, the prediction is
        between, and the record reports the measured value without a
        pre-registered band, labelling it exploratory.
    The bands are PRE-REGISTERED UNTESTED TOLERANCES, chosen a priori, and are
    stated as such rather than as derivations.
    (D) THE PRIZE, CHARGED HONESTLY BEFORE THE WALK IS RUN. Reaching the target
    buys an S_4 monomial support of 391 instead of 439 - a 10.9% support
    reduction. The campaign's committed calibration for what a support reduction
    is worth is the j = 0 pair: 30.8% support drop, -0.44% Groebner time, +3.41%
    gb_size in the wrong direction. Scaling that crudely, a 10.9% support drop is
    worth a fraction of a percent of solve time at best, AND the walk costs 138
    or more isogeny computations plus the transport of the instance. THE PRIZE IS
    NEGATIVE ON NET AND THIS RECORD SAYS SO BEFORE MEASURING IT. That is not a
    reason to skip the experiment - it is the reason the experiment is worth
    running, because it produces the campaign's first complete worked instance of
    a T5 gate that PASSES and still yields nothing, which is a methodological
    result the decomposition document predicts but has never demonstrated.
    (E) WHY THE TOY MEASUREMENT IS NOT POINTLESS. At 138 vertices one would
    simply enumerate; walking is silly. The experiment is a PROXY for the
    asymptotic question - does the hitting time to a locally-decidable target
    scale like the class size h, like h log h, or worse, on a volcano with drift -
    and the record must state that transfer assumption explicitly and must
    measure the scaling by repeating at two further classes of different sizes
    rather than asserting it from one.

  mechanism: >-
    An isogeny volcano is a tree of ell-isogenies grafted onto a crater cycle
    that is a Cayley graph of the class group. Walks on the crater mix rapidly
    under GRH; walks that leave the crater fall, because a vertex below the crater
    has one ascending and ell descending edges. So the hitting time to a target
    is governed by which level the target is on, and the experiment measures
    precisely that dependence. The local test contributes nothing to the walk's
    dynamics - it only tells you when to stop - which is why the record can
    separate the two halves of T5 cleanly: clause (ii) is about the STOPPING
    RULE and clause (i) is about the DYNAMICS, and this is the first design in
    the campaign where they are not entangled.

  novelty_status: adaptation
  novelty_note: >-
    Volcano structure and the downward drift of random ell-isogeny walks are
    established (Fouquet-Morain, Sutherland; CITATIONS TO BE VERIFIED in the run
    record, not asserted from memory). The rapid mixing of the crater Cayley
    graph under GRH is cited in DECOMPOSITION.md T5 and is not proved there. THE
    ADAPTATION is running the gate on a target defined by a J-MEASURABLE local
    test - which is a kind of target the isogeny-walk literature does not
    normally consider, because it is defined by the curve's equation rather than
    by its endomorphism ring. Corpus grep: no record in this campaign measures
    any hitting time or any walk length distribution; MATCHED-ORDER-DESIGN.md E3
    proposes the gate but is a design note, not a proposal or contract.
  not_a_duplicate_of: >-
    NOT IDEA-20260807-94f953, which analyses the CRATER of small-|D_0| classes
    and the DESCENDING direction with a Dickman-de Bruijn smoothness heuristic;
    that record's target is defined arithmetically (the maximal order) and its
    local test is isogeny counting, not a two-multiplication identity. NOT
    IDEA-20260811-3e08e0, which decides whether a class contains a target at all
    - the census - and hands the within-class question here. This record assumes
    the class contains one, which is true for t = 30 by committed data.

  assumptions:
  - >-
    The class enumeration and the identification of (441, 294) as the unique
    degeneration vertex are correct as committed and independently re-verified
    (EV-ICINV-6b6264, VAL-20260810-dc8bd8).
  - >-
    THE VOLCANO IS BUILT AND THE LEVELS ASSIGNED BY VELU. The committed
    2-torsion-count level variable resolved 2 of 5 levels and is not admissible.
  - >-
    Transport of the ECDLP instance along the walk is by isogenies of degree
    coprime to the prime subgroup order. At p = 4001, t = 30 the group order is
    3972 = 2^2 * 3 * 331, so the prime-order subgroup is of order 331 and
    2-isogenies are coprime to it; the contract must verify this rather than
    assume it, and must verify k-preservation with an independently re-checked
    certificate.
  - >-
    The walk is a genuine random walk on the 2-isogeny graph with the edge
    multiset given by Velu, not a walk on a synthesised adjacency list.

  proof_search_map:
    bottleneck: >-
      The bottleneck is T5 itself: the campaign has never measured a hitting
      time, so its central reachability dichotomy is asserted rather than
      instrumented. Removing that gap is the point.
    baseline_embedding:
      parameter_slice: >-
        The baseline is the UNIFORM-TARGET case: hitting time to a uniformly
        random vertex of the class, which for a rapidly mixing walk on 138
        vertices should have mean near 138 and a roughly geometric distribution.
        The special-vertex hitting time is then reported as a RATIO against that
        baseline, which cancels most implementation detail.
      reproduction_check: >-
        Run the walk to 20 uniformly chosen targets, confirm the mean hitting
        time is within a factor 2 of the class size, and confirm the
        distribution is approximately geometric. A walk whose uniform-target
        hitting time is wildly off is not mixing and no special-target result is
        interpretable.
    observation_collision:
      observable: The stopping time of the walk.
      distinct_preimage_search: >-
        PERFORMED. The stopping time collides across everything - two completely
        different targets at the same level have the same hitting-time
        distribution up to symmetry, which is precisely why the LEVEL, and not
        the target's j-invariant, is the explanatory variable. The record
        therefore reports hitting time BY LEVEL and treats the special vertex as
        one draw from its level's distribution, not as a distinguished object.
        This is what prevents the design from attributing to "specialness"
        something that is merely "being on the floor".
    constructive_transforms:
    - transform: telescoping_potential
      proposed_object: >-
        The volcano level as a potential function: each step changes it by +-1
        with level-dependent probabilities, so the hitting time decomposes into a
        birth-death chain on 5 levels plus a within-level mixing time.
      predicted_gain: >-
        Turns a 138-state hitting-time question into a 5-state one plus a mixing
        term, giving a predictive model that can be checked against the measured
        distribution rather than fitted to it.
    quantifier_order: >-
      FOR ALL start vertices and FOR ALL seeds, the walk reaches the target in a
      number of steps whose median lies in the pre-registered band for the
      target's level. The band depends on the LEVEL, which is a property of the
      target discovered at gate time - so the record must fix the band AFTER
      determining the level but BEFORE running the walks, and must record the
      timestamps proving that order.
    method_ceiling:
      strongest_certifiable_claim: >-
        A measured hitting-time distribution at three class sizes with a fitted
        scaling exponent, plus an honest net-cost accounting of the prize. It
        CANNOT certify asymptotic behaviour at cryptographic h from three toy
        classes, and the record must report the fitted exponent with its
        uncertainty rather than extrapolating.
      nearby_object_control: >-
        The nearby object where the desired conclusion fails is a target defined
        by a NON-local property - say "the vertex whose Groebner solve is
        fastest". The walk cannot stop at it without solving at every step, so the
        cost is multiplied by the solve cost. Running that variant and measuring
        the blow-up is what shows the method is tracking locality and not
        something else, and it is a cheap secondary arm.
    proof_obligations:
    - claim: The uniform-target baseline hitting time is near the class size
      responsibility: baseline
    - claim: The special vertex's level determines its hitting-time band
      responsibility: correctness
    - claim: Transport preserves k along the walk
      responsibility: correctness
    - claim: The net cost of reaching the target exceeds the prize
      responsibility: scope
    - claim: The scaling with class size is measured, not extrapolated
      responsibility: scope

  predictions:
  - metric: uniform_target_median_hitting_time_over_class_size
    direction: different
    minimum_effect: >-
      In [0.35, 2.0] - i.e. the median hitting time to a uniform target is
      between 48 and 276 steps for a 138-vertex class. A pre-registered untested
      tolerance around the geometric-mixing expectation of about
      138 * ln 2 = 96.
  - metric: special_vertex_median_hitting_time
    direction: different
    minimum_effect: >-
      In [40, 200] if the target is on the floor, above 300 if on the crater;
      band selected by the level gate before the walks run. Both bands are
      pre-registered untested tolerances.
  - metric: hitting_time_by_level_monotonicity
    direction: higher
    minimum_effect: >-
      Median hitting time is MONOTONE INCREASING as the target's level rises from
      floor to crater, across all five levels, with the crater at least 3x the
      floor. This is the real physical prediction of the drift mechanism and it
      is far more informative than the single special-vertex number.
  - metric: local_test_cost_per_step_as_a_fraction_of_step_cost
    direction: lower
    minimum_effect: >-
      Below 1% - the a^3 + 8b^2 test is two multiplications against a Velu
      isogeny evaluation. Reported to make the "clause (ii) is free" claim
      quantitative rather than rhetorical.
  - metric: net_prize_accounting
    direction: different
    minimum_effect: >-
      NEGATIVE: the total cost (median hitting time x per-step isogeny cost +
      transport + certificate verification) exceeds the expected saving (10.9%
      support reduction scaled by the committed support-to-time relation, which
      gives well under 1% of one solve). Reported as an explicit arithmetic
      statement with every term named, so that the conclusion is auditable rather
      than asserted.
  - metric: scaling_exponent_of_hitting_time_in_class_size
    direction: higher
    minimum_effect: >-
      Fitted over three classes of different sizes; reported with uncertainty.
      An exponent near 1 supports the O(h) reading; an exponent near 1.5 or above
      would mean the drift makes even locally-decidable targets expensive, which
      would be a genuinely useful negative for every lane relying on T5 clause
      (ii).

  minimal_test:
    design: >-
      (1) Rebuild the p = 4001, t = 30 class by Velu and assign levels by Velu;
      confirm 138 vertices, level sizes 3/9/18/36/72, and locate (441, 294) and
      its level. (2) FIX THE PRE-REGISTERED BAND for the special vertex from its
      level, and record the fix before any walk runs. (3) Run at least 1000
      independent random 2-isogeny walks from uniformly chosen start vertices,
      stopping at the special vertex, recording the FULL hitting-time
      DISTRIBUTION - never a point estimate (committed failure mode N5). (4) Run
      the same for 20 uniformly chosen targets and for at least 5 targets at each
      of the five levels. (5) Transport an ECDLP instance along a sample of the
      walks and verify k-preservation by an independently re-checked certificate.
      (6) Repeat the whole design at two further classes of different sizes to
      fit the scaling exponent. (7) Produce the net-prize accounting table with
      every term.
    controls:
    - >-
      C-UNIFORM (BLOCKING baseline). Hitting time to uniform targets must be near
      the class size with an approximately geometric distribution. A walk that
      fails this is not mixing and no result is interpretable.
    - >-
      C-VELU (BLOCKING). Levels assigned by Velu; the 2-torsion-count level
      variable is not admissible.
    - >-
      C-LEVEL-MATCHED (the null of the same shape). The special vertex's hitting
      time is compared against the distribution for OTHER vertices AT THE SAME
      LEVEL. If it is inside that distribution - which is predicted - then there
      is nothing special about reaching it beyond its level, and the record says
      so. This control is what prevents the design from manufacturing a finding
      out of the drift.
    - >-
      C-NONLOCAL. The secondary arm with a non-locally-decidable target, to
      quantify what clause (ii) is actually worth.
    - >-
      C-TRANSPORT. Certificate verification of k-preservation, re-checked
      independently of the walker (docs/claims-and-verification.md).
    required_metrics:
    - class_rebuild_vertex_count_and_level_sizes
    - special_vertex_level
    - full_hitting_time_distribution_special_and_uniform_and_per_level
    - level_matched_comparison
    - local_test_cost_fraction
    - transport_certificate_verification_rate
    - scaling_exponent_across_three_classes
    - net_prize_accounting_table

  lossy_projection_answer: >-
    THE WALK'S TRACKED OBJECT IS A ONE-BIT PROJECTION OF THE CURVE - "am I on the
    divisor" - and it is the most lossy projection in this batch. It is
    compatible with the walk's operation in the only sense that matters for a
    stopping rule: it is computable at the current vertex from the vertex's own
    data, so it propagates trivially. But it does NOT propagate through the
    isogeny in any useful way - knowing the bit at E tells you nothing about the
    bit at a neighbour of E, which is exactly why the walk must test at every
    step and why the hitting time is governed by the graph rather than by any
    gradient. THAT IS THE HONEST STATEMENT OF WHY THIS IS A SEARCH AND NOT AN
    ALGORITHM. And the prize the search wins is a support reduction, which the
    committed j = 0 pair says projects onto essentially zero cost. So the record
    contains a lossy projection at both ends and it names both, which is the
    point of running it.

  t5_reachability_answer: >-
    THIS RECORD IS THE T5 ANSWER, INSTRUMENTED. Clause (ii) passes at under 1% of
    a step's cost. Clause (i) passes WITHIN this class, since the target is 1 of
    138 and the walk finds it in a measured number of steps. AND THE COMBINATION
    STILL YIELDS NOTHING, because the prize is a support reduction of 10.9% and
    the campaign's own committed calibration says support does not project onto
    cost. Composed with IDEA-20260811-3e08e0 - which shows that only about twelve
    classes per p contain such a vertex at all - the full T5 verdict for this
    object is: unreachable for almost every instance, reachable and worthless for
    the rest. That is a closure with a named obstruction and forward guidance,
    and it is arrived at by measurement rather than by assertion.

  null_object: >-
    C-LEVEL-MATCHED is the null of the same shape and it is the essential one:
    other vertices at the same volcano level, hit by the identical walk. The
    prediction is that the special vertex is UNREMARKABLE within its level, so
    the null and the treatment should coincide. C-UNIFORM is the mixing baseline
    and C-NONLOCAL is the contrast that quantifies clause (ii)'s value.

  falsification_conditions:
  - >-
    C-UNIFORM fails - the uniform-target hitting time is far from the class size
    or the distribution is not approximately geometric. The walk is not mixing;
    the run is INVALID rather than negative.
  - >-
    The special vertex's hitting time lies outside the distribution for its own
    level. Something about the target beyond its level affects reachability,
    which is unexpected and would need explanation before use.
  - >-
    Hitting time is NOT monotone in level. The drift mechanism is wrong for this
    volcano and the predictive model in the proof-search map must be discarded.
  - >-
    The fitted scaling exponent exceeds 1.5. Locally-decidable targets are
    expensive to reach even in principle, which weakens T5 clause (ii) for EVERY
    lane in the campaign - a broadly useful negative.
  - >-
    Transport fails to preserve k on any sampled walk. The T1 arm is invalid and
    the ECDLP framing of the record collapses to a pure graph experiment, which
    must then be relabelled.
  - >-
    The net-prize accounting comes out POSITIVE. The record's central expectation
    is wrong and reaching the vertex is worth its cost - which would demand
    immediate escalation and independent replication, since it contradicts the
    committed support-versus-time calibration.

  confounders:
  - >-
    Level, which explains almost everything and is not the special vertex's
    specialness. C-LEVEL-MATCHED exists to prevent the confusion and is blocking.
  - >-
    Start-vertex distribution. Starting uniformly over VERTICES and starting
    uniformly over the walk's stationary distribution give different hitting
    times; the contract must declare which and report both if cheap.
  - >-
    Backtracking. A walk that may immediately reverse its last step behaves
    differently from a non-backtracking one; the contract must declare the walk
    type. Non-backtracking is the realistic model and should be primary.
  - >-
    Small class size. At 138 vertices the asymptotic regime is not reached and
    the scaling fit rests on three points; the transfer assumption is stated
    rather than hidden and no crypto-scale claim is made.
  - >-
    Isogeny degree versus subgroup order. Any walk step of degree sharing a
    factor with the prime subgroup order breaks transport; at this class only
    2-isogenies are used and 331 is coprime to 2, but the check is explicit.

  interpretation_limits:
  - >-
    Three toy classes. The scaling exponent is a measurement at those sizes with
    stated uncertainty, never an asymptotic claim.
  - >-
    The prize accounting uses the committed j = 0 support-to-time relation as a
    scaling guide; that relation is a single uncontrolled pair of numbers and is
    itself the subject of IDEA-20260811-18bbf9. If that record changes the
    relation, this record's accounting must be redone.
  - >-
    claim_tier toy. No attack, no exponent, no speedup, sota_delta zero.

  heuristic_assumptions:
  - id: H1
    statement: >-
      The crater of an ell-volcano is a Cayley graph of the class group Cl(O) and
      is a rapid mixer, so a walk restricted to the crater equidistributes in
      O(log p) steps.
    rigorous_support: >-
      This is GRH-CONDITIONAL and is cited rather than proved in
      DECOMPOSITION.md section 3 (T5), which states it as cited and not proved
      there. The rigorous companion is the expander property of the
      class-group Cayley graph under GRH; the classical distribution statement it
      imitates is equidistribution of ideal classes.
    validation_plan: >-
      Sample: 1000 walks restricted to the crater of each of the three classes,
      measuring the total-variation distance from uniform as a function of step
      count. Comparison: exponential decay of total-variation distance with the
      fitted mixing time compared against O(log p). Tail check: the least-visited
      crater vertex after a fixed budget against the multinomial minimum
      prediction. Transfer to cryptographic p is explicitly NOT claimed; the toy
      craters have 3 vertices at this class, which is far too small to fit a
      mixing time, so the crater arm must use the N = 19507 family's larger
      craters or be reported as unmeasurable and dropped.
  - id: H2
    statement: >-
      A random ell-isogeny walk on a volcano of depth d has a downward drift, so
      its stationary distribution concentrates on the floor with mass ratio
      approximately ell^i across levels.
    rigorous_support: >-
      The volcano structure theorem (Fouquet-Morain; Sutherland) gives the edge
      counts per level - one ascending edge and ell descending edges below the
      crater - from which the drift follows by an elementary birth-death
      argument. CITATIONS TO BE VERIFIED in the run record.
    validation_plan: >-
      Sample: the empirical occupancy of the five levels over 10^5 walk steps in
      the p = 4001, t = 30 class, whose level sizes 3/9/18/36/72 are already
      committed. Comparison: the predicted occupancy ratios against the observed,
      by chi-square. Tail check: the observed frequency of reaching the crater,
      against the birth-death prediction, which is the rarest event and the one
      the drift model most easily gets wrong.

  target_complexity:
    time_exponent: >-
      NONE CLAIMED FOR AN ATTACK. The measured quantity is a hitting time, whose
      scaling in the class size h is the object of the experiment; h itself is
      about p^{1/2} for a random ordinary class, so a hitting time linear in h is
      p^{1/2} isogeny computations - already as expensive as rho, which the
      record states so that nobody reads a successful walk as cheap.
    memory_exponent: >-
      O(1) for a non-backtracking walk; the experiment stores only the current
      vertex and the step count.
    best_known: >-
      0.886*sqrt(N) group operations and O(1) memory for parallel rho
      (KN-TECH-001, KN-TECH-006); automorphism-discounted on CM curves
      (KN-TECH-018). Since a walk costing Theta(h) = Theta(p^{1/2}) isogenies is
      already comparable to solving the ECDLP outright at toy sizes, the walk is
      dominated before it starts, and that comparison is part of the deliverable.
    hidden_overhead: >-
      Per-step Velu isogeny cost, which is polynomial but not negligible, and the
      transport plus certificate verification. All are charged in the net-prize
      table.
    tradeoff_note: >-
      No time-memory tradeoff exists for the walk itself. Reaching a SPECIFIED
      vertex by class-group action rather than by walking is the CSIDH
      vectorisation problem at about sqrt(h) ~ p^{1/4} classically
      (DECOMPOSITION.md T5) - cheaper than the walk in the exponent, and the
      record must report that a directed route exists and is cheaper, which
      makes the random walk the wrong algorithm even for its own goal.

  dominated_by: >-
    Dominated on every axis. As an attack component: parallel rho with
    distinguished points at 0.886*sqrt(N) and O(1) memory (KN-TECH-001,
    KN-TECH-006) beats a walk costing Theta(h) isogenies followed by a solve. As
    a way of REACHING the target: class-group vectorisation at about p^{1/4}
    dominates the random walk at about p^{1/2} in the exponent. As a source of
    advantage: the automorphism-discounted baseline (KN-TECH-018) already
    captures everything special j is worth, at sqrt(6). Checked against all four.
  sota_delta: >-
    ZERO, and in fact negative as an algorithm: the record's own accounting
    predicts the walk costs more than the prize is worth.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  expected_value: >-
    MEDIUM, AND EXPLICITLY A PROPOSAL I BELIEVE IS A DEAD END WORTH KILLING
    CLEANLY. Its algorithmic outcome is predicted negative on net before it runs,
    and it is dominated by vectorisation even at its own task. Its value is
    methodological and real: the campaign's central dichotomy T5 has never been
    instrumented, and this is the one object for which both clauses can be made
    to pass, so it produces the worked example that makes every future T5
    invocation in this campaign concrete rather than rhetorical - plus a measured
    hitting-time-versus-level curve that any later lane relying on local
    detectability can reuse. I would run it LATE, after the symbolic records, and
    only if the coordinator wants the T5 instrumentation; if budget is tight, the
    census in IDEA-20260811-3e08e0 already delivers the closure and this record
    delivers only the demonstration.
