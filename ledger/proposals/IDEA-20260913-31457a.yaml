  recommended_priority: high
  proof_search_map:
    bottleneck: >-
      Whether a coordinate-dependent label can have fibres that are cosets
      of a proper subgroup. Everything else follows: coset fibres give
      b = 1 propagation and an exact pruner; the absence of proper
      subgroups on a prime-order subgroup gives the forced value (C3).
    baseline_embedding:
      parameter_slice: >-
        The abstract object this instantiates is the reduction map
        Z/(ab) -> Z/a, which is IDEA-20260806-c5d183's own composite-order
        positive control and the entire content of Pohlig-Hellman. The
        exact slice is a = 4, b = 7, ab = 28 on the frozen curve.
      reproduction_check: >-
        Symbolic plus a frozen fixture: the violation counter must return
        EXACTLY 0 both for d on E(F_23) and for the abstract reduction
        Z/28Z -> Z/4Z, and must return the balls-in-bins expectation for a
        random 4-symbol label. Two of the three answers are known for free
        from the statement, which is what makes this a baseline
        reproduction rather than a similar-looking table.
    observation_collision:
      observable: >-
        The pair (image size, violation count) for a coordinate-dependent
        label.
      distinct_preimage_search: >-
        REQUIRED AND IT SUCCEEDS, which is why it is stated in the claim
        rather than discovered later. Two structurally different objects
        share the observable (4, 0): the descent character d on E(F_23),
        and the composition of d with any relabelling of (Z/2)^2 by a
        bijection -- including one that destroys the group structure of the
        label set while preserving every fibre. They agree on "lossy and
        deterministic" and disagree on "the label multiplies". THE
        OBSERVABLE THEREFORE MAY NOT BE USED to argue that a label is a
        homomorphism; the homomorphism property is asserted and checked
        separately, which is why REAL VALUE 1 is a 784-pair count and not
        an inference from image size.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (lossy, deterministic, image size 4) fixed and
          vary the forgotten structure -- the group order. The intrinsic
          invariant distinguishing the resulting objects is the divisor
          lattice of |E(F_p)|: for 4 | |E(F_p)| the object exists, for
          prime order it does not. That is why the record is about the
          cofactor and not about elliptic curves.
        predicted_gain: >-
          Localises the family's entire gain to the cofactor and supplies
          the mechanism for the eight-way negative at zero compute.
      - transform: stronger_invariant
        proposed_object: >-
          Carry the label alongside the branch rather than only the point,
          so that the halving step retains enough state to be
          deterministic. The stronger state is exactly the two descent
          bits, and it is what survives the recursion down the 2-adic
          ladder.
        predicted_gain: >-
          b = 4 collapses to b = 1 at cost c, turning 4^k into k*(1+c).
          Gain on the ECDLP exponent: 0.
    quantifier_order: >-
      (C2): FOR ALL p odd, FOR ALL E/F_p with fully split cubic, FOR ALL
      R, S in E(F_p): d(R + S) = d(R)*d(S), and FOR ALL R in 2E(F_p) the
      four halves of R carry four distinct d-values. The label map is fixed
      before R and S and may not depend on either. (C3): FOR ALL odd-order
      subgroups <P>, FOR ALL R in <P>: d(R) = (+1,+1). THE READING NOT
      CLAIMED: "for all coordinate-dependent labels there exists a Sigma
      under which they propagate", which is false and is what the eight
      2026-09-13 calibrators measured.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "on the declared curve family, d is an exact
        4-valued propagating label with a perfect branch pruner at measured
        cost c, and it is constant on every odd-order subgroup". It can
        NEVER certify that no coordinate-dependent label propagates on a
        prime-order subgroup -- that is Theorem A's job, and this record
        only exhibits the composite-order witness. It certifies nothing
        about the ECDLP exponent.
      nearby_object_control: >-
        The object where the hoped-for conclusion FAILS is the order-7
        subgroup of the very same curve, where d is constant; and
        Sigma = {[1/3]} on the same curve, where b = 1 and there is nothing
        to prune. A method that could not distinguish the 2-part from the
        3-part on one curve has not identified the load-bearing structure,
        which is the divisor lattice of the group order.
    proof_obligations:
      - claim: >-
          #E(F_23) = 28 with order multiset {14:18, 7:6, 2:3, 1:1}, cubic
          roots {1,2,20}, and y^2 = x^3 + 16x + 6 is the short form.
        responsibility: baseline
      - claim: >-
          0 violations of the homomorphism identity over 784 ordered pairs,
          image of size 4, product of the three characters identically +1.
        responsibility: correctness
      - claim: >-
          |2E(F_23)| = 7 and 2E(F_23) = <(3,9)>; the four halves of (3,9)
          carry four distinct labels; (10,4) is the unique 3-division point.
        responsibility: strictness
      - claim: >-
          d is constant on every odd-order subgroup, because squaring is a
          bijection there.
        responsibility: scope
      - claim: >-
          c is reported as a measured ratio to one curve addition, and the
          gain is reported as a cofactor factor rather than as an exponent.
        responsibility: interface
      - claim: >-
          The 2-torsion convention is part of the object's definition and
          is disclosed.
        responsibility: interface
