  minimal_test:
    execution_status: design_only
    design: >-
      STAGE 0 (zero compute beyond exact finite-field arithmetic, HARD
      GATE, and the whole deliverable). On the frozen p = 23 curve:
      recompute #E = 28 and the order multiset; recompute the three roots
      and the 2-torsion x-coordinates; recompute d on all 28 points under
      the declared convention; count homomorphism violations over all 784
