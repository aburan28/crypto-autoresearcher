      This is a structured curve family and is declared as such; standardized
      prime-order curves do NOT satisfy it and the record claims nothing about
      them beyond (C3).
    - >-
      The convention at a 2-torsion point (replace x - e_i by the product of
      the other two root differences) is part of the object's definition, not
      an implementation detail, and is disclosed.
    - >-
      Pohlig-Hellman on the 2-part is used as a component and is named.
      No factor base is proposed.
    - >-
      No secret scalar is targeted; the frozen cell is a public toy.
