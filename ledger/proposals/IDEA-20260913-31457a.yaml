      - measured c in group-operation equivalents at three field sizes
      - ladder cost against 4^k branch following
  falsification_conditions:
    - >-
      A nonzero violation count for d on the frozen curve. The recalled
      2-descent homomorphism fact is then misstated or the convention is
      wrong, and this record is superseded rather than amended.
    - >-
      The four halves of (3,9) do not carry four distinct labels. kappa < 4
      and (C2) is false as stated; the exchange rate must be re-measured
      and the record re-scoped.
    - >-
      d is non-constant on <(3,9)>. (C3) is false, and with it
      IDEA-20260806-c5d183 Theorem A and KN-FIND-ffe1df Theorem C would be
      contradicted on an explicit object. This is the single most valuable
      outcome available here and must be routed to an independent
      review-breakthrough session before any interpretation.
    - >-
      The matched random-label null returns 0 violations. The instrument
      has no discriminating power and no positive may be read from it.
    - >-
      The Z/28Z -> Z/4Z positive control returns nonzero violations.
      Instrument broken; nothing is reported.
    - >-
      The measured c exceeds the cost of simply following all four branches
      at the smallest field size. Then the pruner is not a pruner at that
      scale, which bounds the exchange rate from the wrong side and is
      reported as such rather than suppressed.
  confounders:
    - >-
      The 2-torsion convention. Choosing x - e_i literally at x = e_i gives
      chi(0) = 0 and breaks the homomorphism; the product convention is
      required and a careless implementation will produce violations that
      are about the convention and not about the object.
    - >-
      j-invariant degeneracy. Curves with full rational 2-torsion over a
      small p can be forced into special j; the frozen cell has j = 5 with
      0 and 1728 mod 23 equal to 0 and 3, so it is neither, but the larger
      frozen curves must be checked the same way.
    - >-
      Confusing the cofactor gain with an exponent gain. The search space
      shrinks by 4 and the birthday cost by 2. Reporting that as a speedup
      without the exponent statement would be exactly the overclaim this
      record exists to forestall.
    - >-
      Confusing this object with chi(x) (IDEA-20260913-d76b38) or with the
      cubic character of y (IDEA-20260913-1eb65c). The characters here are
      evaluated at x - e_i for the three ROOTS and their product is
      identically +1, which neither neighbour's object satisfies.
    - >-
      Reading the constancy on <(3,9)> as a property of this particular
      curve. It is forced by oddness of the subgroup order, holds for every
      such curve, and is the general statement (C3); the toy only exhibits
      it.
  interpretation_limits:
    - >-
      NOT AN ATTACK LENS. Filed as class `control`. The object is CONSTANT
      on the prime-order target and therefore useless there by
      construction; its value is as the family's positive control and as
      the coset mechanism behind the eight-way 2026-09-13 negative.
    - >-
      Sigma EXTENDS TO THE FULL TRANSLATION ACTION of E(F_p), which the
      object-frame constraint forbids for a candidate lens. That is
      permitted here ONLY because #E(F_p) is composite, which is the exact
      hypothesis IDEA-20260806-c5d183 Theorem A excludes, and the record is
      offered as that theorem's nearby-object control rather than as a
      counterexample to it.
    - >-
      STRUCTURED CURVE FAMILY. Full rational 2-torsion is required. The
      record says nothing about standardized prime-order curves except the
      forced value (C3), and it licenses no transfer to them.
    - >-
      The established gain is the cofactor 4 in search space and 2 in
      birthday cost. established_exponent_gain = 0.
    - >-
      The eight-way 2026-09-13 result remains a FATIGUE REPORT under
      docs/inventor-protocol.md section 4 until an obstruction block with a
      measured quantity is written for it. This record supplies the
      candidate mechanism and the positive control; it does not by itself
      convert that result into a closure, and it must not be quoted as
      doing so.
    - >-
      No factor base, so KN-OPEN-020 does not apply. Not the Kummer line
      and not a degree-d function on E.
  heuristic_assumptions:
    - id: H1-IDEA-20260913-31457a
      statement: >-
        NONE OF (C1), (C2) OR (C3) IS HEURISTIC. (C1) is the statement that
        the fibres of [2] are the cosets of E[2], which is exact finite
        group theory. (C2) is the statement that the complete 2-descent map
        has kernel exactly 2E(K), which is an algebraic theorem (recalled,
        not opened) and is additionally verified here as a complete finite
        enumeration on the frozen curve. (C3) is the statement that every
        element of an odd-order group is a square, which is one line. This
        item is numbered and recorded PRECISELY SO THAT THE ABSENCE IS
        EXPLICIT rather than inferred from silence: no reader may later
        attribute a distributional assumption to this record's core.
      rigorous_support: >-
        Lagrange and the fibre structure of an isogeny for (C1); the
        complete 2-descent homomorphism for (C2), verified as a complete
        784-pair enumeration rather than taken on the citation's authority;
        squaring is a bijection on an odd-order group for (C3).
      random_model_justification: >-
        Not applicable: every quantity is an exact finite count. The
        comparison law used in the controls is the balls-in-bins violation
        expectation for a random 4-symbol label, which is the null and not
        a model of the object.
      validation_plan: >-
        SAMPLE: the complete 28-point group and all 784 ordered pairs --
        exhaustive, so no sampling law is involved and complete
        verification at a size is stronger than a distributional check.
        SHORTCUT MAKING LARGER PARAMETERS FEASIBLE: at p near 2^20 and 2^26
        the pair enumeration is replaced by 10^5 uniformly random pairs
        with the sample size stated, and the violation count must remain
        exactly 0. COMPARISON DISTRIBUTION: the balls-in-bins expectation
        for the random-label null. TAIL CHECK: the largest violation count
        observed over 200 independent random-label replicates against the
        binomial tail. TRANSFER ASSUMPTION, STATED: the exact enumeration
        is at p = 23 only; the larger cells are sampled and are labelled as
        such.
      falsification_condition: >-
        Any violation of d(R+S) = d(R)d(S) at any tested size, or a
        nonzero count at p = 23 where the enumeration is complete.
    - id: H2-IDEA-20260913-31457a
      statement: >-
        The pruning cost c, measured as the ratio of two Legendre-symbol
        evaluations to one elliptic-curve addition on the same
        implementation, lies between 0.05 and 0.5 group-operation
        equivalents for p between 2^8 and 2^26, and does not grow faster
        than the field-multiplication count of a single exponentiation by
        (p-1)/2.
      rigorous_support: >-
        The rigorous ingredient is the operation count: a Legendre symbol
        by Euler's criterion costs one exponentiation, about
        1.5*log_2 p field multiplications, while a curve addition costs one
        inversion plus a handful of multiplications; the ratio is therefore
        a bounded function of log p and of the inversion-to-multiplication
        ratio. The heuristic half is only the CONSTANT, which depends on
        the implementation and on whether a binary-gcd Jacobi symbol
        replaces the exponentiation.
      random_model_justification: >-
        No distributional model. The comparison is a measured ratio against
        the same implementation's own addition cost, which is why the
        metric is defined as a ratio and not as a wall-clock time.
      validation_plan: >-
        SAMPLE: 10^5 timed Legendre evaluations and 10^5 timed additions
        per field size, at p near 2^8, 2^20 and 2^26 with full rational
        2-torsion, reporting the median ratio with a bootstrap interval and
        the binary-gcd variant separately. COMPARISON DISTRIBUTION: the
        predicted 1.5*log_2 p multiplication count. TAIL CHECK: the 99th
        percentile ratio, so that a heavy tail is attributed to the
        inversion and not to the symbol. TRANSFER ASSUMPTION: the ratio is
        implementation-specific and is not transferable to another
        arithmetic library.
      falsification_condition: >-
        A measured ratio above 1 at any tested size, which would mean the
        pruner costs more than following a branch and would invert the
        exchange-rate conclusion at that scale.
  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED. The pruner shrinks the search space by the
      2-part of the cofactor, h_2, giving a birthday cost
      0.886*sqrt(n) after Pohlig-Hellman has already removed h_2 -- i.e.
      it reproduces the standard Pohlig-Hellman position and adds nothing
      to it asymptotically. Against 0.886*sqrt(n) the delta is exactly 0.
    memory_exponent: >-
      O(1) group elements: a canonical-halving ladder stores a walk state
      and a label, not a table. Against rho's O(1) and BSGS's sqrt(n),
      unchanged.
    best_known: >-
      Pollard rho with distinguished points at about 0.886*sqrt(n) on the
      largest prime factor after Pohlig-Hellman; BSGS at
      (2*sqrt(n), sqrt(n)); automorphism discount at most sqrt(6) on CM
      curves (KN-TECH-018).
    best_known_comparator: >-
      Pollard rho; BSGS; Pohlig-Hellman on the 2-part (KN-TECH-030), which
      is the incumbent this record's mechanism reproduces.
    hidden_overhead: >-
      No o(1) is claimed because there is no asymptotic claim. What hides
      instead and is disclosed: (i) the constant c, which is
      implementation-dependent and is measured rather than assumed; (ii)
      the requirement of full rational 2-torsion, which is a curve-family
      precondition and not a free parameter; (iii) the fact that the gain
      is the cofactor, which standardized curves deliberately make 1 or 8.
    tradeoff_note: >-
      No time-memory tradeoff is opened. The pruner is sequential inside
      the ladder; the ladder itself parallelises only across the
      independent prime-power components, which is Pohlig-Hellman's own
      position. Recorded explicitly rather than omitted.
    cost_model: >-
      One unit = one group operation on the frozen curve; c is reported in
      the same unit. Stage 0 is a few thousand F_23 operations.
      established_exponent_gain = 0.
    data_query_cost: >-
      Every character evaluation is charged. No oracle queries and no
      preprocessing advice.
    established_exponent_gain: 0
