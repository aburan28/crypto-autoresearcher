idea:
  id: IDEA-20260809-15e1cd
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-PAIR-f2e31f
  goal_id: GOAL-PAIR-001
  title: >-
    A certified end-to-end discrete logarithm in a small tower field, run here,
    to anchor every constant the asymptotic pairing estimates leave free
  class: measurement
  claim: >-
    A complete discrete logarithm in GF(p^k) for a small prime and the same
    tower shape as the deployed curve is reachable inside one batch, and the
    observed (operations, memory) pair pins the model constants that published
    pairing security levels leave implicit. Without such an anchor, any figure
    this goal produces is a restatement of somebody else's constants; with it,
    the extrapolation is this program's own.
  mechanism: >-
    Build the tower, select polynomials, collect relations, run linear algebra
    over the appropriate ring, and perform an individual logarithm. Emit the
    recovered exponent as a certificate, re-verified by exponentiation in an
    independent implementation.
  why_not_a_renamed_known_approach: >-
    Small-field DL computations are routine. The point is not the computation
    but its ROLE: it is used as a calibration anchor for an extrapolation that
    the goal must otherwise inherit, and the record commits in advance to
    reporting the anchor's disagreement with the model if there is one.
  predictions:
  - observable: recovered exponent verifies
    metric: boolean certificate check
    predicted: Yes; a failure means the pipeline is wrong and no later figure is admissible.
  - observable: ratio of observed cost to the asymptotic model evaluated at the same parameters
    metric: dimensionless ratio, reported per phase
    predicted: >-
      Order-of-magnitude agreement at best, with relation collection closer than
      linear algebra. A ratio far from one is expected at small sizes and its
      TREND across sizes is the calibration; a flat ratio would be surprising
      and more valuable than agreement.
  minimal_test: >-
    Three field sizes in increasing order with the same tower shape, each run to
    a certified exponent, with per-phase operation counts and peak memory
    recorded and seeds declared.
  controls:
  - 'SELF-CONSISTENCY: recompute the logarithm of a random known power and confirm the pipeline returns the known exponent.'
  - 'PHASE ISOLATION: relation collection, linear algebra and descent are timed and memory-profiled separately, because the model treats them separately and a merged number cannot calibrate it.'
  falsification_conditions:
  - No certified exponent is obtained at any of the three sizes within the batch budget, in which case the calibration is unavailable and every later extrapolation must say so.
  - Per-phase costs cannot be separated cleanly, making the calibration unusable for a model that is stated per phase.
  interpretation_limits: >-
    Toy-scale calibration. Nothing here is a statement about a deployment-sized
    field, and non-completion at a size is a budget outcome about this
    implementation (AGENTS.md rule 3).
  sota_delta: 'No attack. Delta: an owned anchor point where the goal would otherwise have none.'
  dominated_by: Not dominated by any corpus record; GOAL-RSA-001 anchors a different algorithm and its constants do not transfer.
  estimated_cost: Implementation medium; compute hours at the largest of the three sizes.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for exTNFS/pairing/GF(p^12): no records. WEB NOT CHECKED.'
  source_refs:
  - exTNFS primary reference -- RECALLED, REQUIRED READ, NOT YET READ.
