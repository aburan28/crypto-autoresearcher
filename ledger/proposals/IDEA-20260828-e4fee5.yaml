idea:
  id: IDEA-20260828-e4fee5
  question_id: RQ-MLKEM-001
  added: '2026-08-28'
  proposed_by: idea-generator
  status: proposed
  title: >-
    Quantifying, not asserting, the module-to-ideal-lattice embeddability
    obstruction: the CRT-slotwise non-derogacy and global-gluing probability
    of ML-KEM's public matrix A, via classical random-matrix-over-finite-field
    theory
  class: control

  claim: >-
    IDEA-20260805-e805b6's mechanism section asserts, as a stated fact and
    without measurement, a second independent obstruction to any
    principal-ideal-problem (PIP) attack on module-rank-k>=2 ML-KEM: "a
    uniformly random A does not lie in a commutative subalgebra of M_k(R) of
    the right index," which is why "the historical progression rank-1 break
    -> rank-2 does not follow." This proposal converts that assertion into a
    measured, falsifiable number. Via the CRT decomposition established
    elsewhere in this corpus (IDEA-20260821-019d2f: X^256+1 splits over
    F_3329 into 128 irreducible quadratics, so R_q ~= product of 128 copies
    of F_{q^2}), a uniform A in R_q^{k x k} decomposes into 128 independent
    uniform matrices A_i in M_k(F_{q^2}). A NECESSARY condition for M(A) to be
    re-expressible as a rank-1 ideal lattice over a bigger ring is (i) each
    A_i is non-derogatory (minimal poly = characteristic poly, i.e. F_{q^2}[A_i]
    is a full degree-k field extension) AND (ii) the 128 per-slot companion-form
    conjugators CRT-glue into ONE global invertible matrix P simultaneously
    putting A into global companion form. Two competing hypotheses: H0
    (expected) -- per-slot non-derogacy is nearly certain (classical theory
    predicts failure probability O(1/q^2), i.e. astronomically rare, since
    q^2 = 11,082,241), so e805b6's obstruction is NOT at the per-slot level;
    it is at the GLOBAL GLUING step, which should fail with overwhelming
    probability because 128 independently-drawn field extensions coinciding
    into one coherent global ring structure is a measure-zero-style
    coincidence. This REFINES e805b6 by locating exactly where its asserted
    obstruction bites. H1 (falsifying) -- either per-slot non-derogacy fails
    often enough at the real (k, q) to matter, or global gluing succeeds
    non-negligibly, in which case e805b6's rank-reduction claim is wrong or
    incomplete and the principal-ideal route to module-LWE is not closed by
    it, reopening the highest-priority open lane this program has audited.

  mechanism: >-
    Two measurements, cheapest first. (1) NON-DEROGACY: sample A uniformly in
    R_q^{k x k} at the EXACT ML-KEM values q=3329, n=256, k in {2,3,4} (no
    scale-down needed -- k is tiny and the CRT slots are a fixed, tractable
    field F_{q^2}). CRT-project to 128 matrices A_i in M_k(F_{q^2}); for each,
    test char_poly(A_i) == min_poly(A_i) via a Krylov-sequence rank test
    (rank of [v, A_i v, ..., A_i^{k-1} v] for random v; full rank k iff
    non-derogatory for that v, repeated over several v to bound false
    negatives). (2) GLOBAL GLUING: for each sampled full A, compute the
    per-slot conjugator P_i putting A_i into companion form (exists iff
    non-derogatory), CRT-reconstruct a single P in R_q^{k x k} from the
    {P_i}, and test whether P^{-1} A P is EXACTLY a global block-companion
    structure consistent with a degree-nk extension generator (not merely
    128 independently-valid local companion forms). Because the 128 slots
    are drawn independently, this global consistency condition is expected
    to fail essentially always -- but this is exactly the assumption e805b6
    left unmeasured, and this record measures it directly rather than
    asserting it.

  novelty_status: unverified

  citations:
    - ref: IDEA-20260805-e805b6
      provenance: internal
      claim: >-
        Asserts, without measurement, that a uniformly random ML-KEM matrix A
        does not lie in a commutative subalgebra of M_k(R) of the right
        index, so the module lattice is not generically a rank-1 ideal
        lattice over a bigger ring -- the "rank reduction" obstruction this
        proposal quantifies rather than assumes.
      verified_by: "idea-generator subagent (read in full this session, 2026-08-28)"
    - ref: IDEA-20260821-019d2f
      provenance: internal
      claim: >-
        X^256+1 splits over F_3329 into 128 irreducible quadratics, giving
        R_q isomorphic to a product of 128 copies of F_{q^2}; this proposal's
        CRT-slot decomposition inherits this fact rather than re-deriving it.
      verified_by: >-
        idea-generator subagent (title/claim excerpt read this session, 2026-08-28;
        full record not read; Stage 1 of minimal_test includes an independent
        round-trip sanity check of the decomposition itself)
    - ref: "J. Fulman, 'Random matrix theory over finite fields', Bull. AMS 39 (2002)"
      provenance: recalled
      claim: >-
        Classical theory of random matrices over finite fields gives the
        probability that a uniform k x k matrix is cyclic/non-derogatory; a
        secondary web search this session surfaced a specific paraphrase
        ("probability of order 1 - q^-3") attributed to this line of work.
      verified_by: null
    - ref: "Ming-Xing Luo, arXiv:2605.17412 (Module Lattice Security Part IV)"
      provenance: recalled
      claim: >-
        Claims a probabilistic polynomial-time quantum attack on Module-LWE
        over 2-power cyclotomics via a principal-ideal-problem tower
        decomposition; context only -- this exact paper is already the
        subject of IDEA-20260805-e805b6's audit and is NOT re-audited here.
      verified_by: null
  assumptions:
    - >-
      That "ideal-lattice-equivalent" for the purposes of this record means
      specifically the companion-matrix/CRT-gluing construction described
      above, not some weaker or structurally different notion of embedding a
      module lattice could admit. A negative finding closes this construction
      only (per inventor-protocol §4), not the PIP family in general.
    - >-
      That the CRT-slot decomposition fact inherited from IDEA-20260821-019d2f
      is correctly stated; Stage 1 includes an independent round-trip check
      rather than trusting the citation alone.

  proof_search_map:
    bottleneck: >-
      The step, inside any PIP-based attack on module-rank-k>=2 MLWE, where
      the k x k matrix A would need to be simultaneously (across all 128 CRT
      slots) conjugate to a companion form generating ONE coherent
      degree-nk extension ring. This is the necessary precondition this
      record measures rather than asserts.
    baseline_embedding:
      parameter_slice: >-
        k=1: the module IS already an ideal in R with no gluing required --
        the classical CDPR/RLWE setting. This is the correct baseline slice
        (as e805b6 itself names it) and must show gluing succeeding with
        probability 1.
      reproduction_check: >-
        Verify computationally that the gluing test reports success on 100%
        of trials at k=1 before any k>=2 result is trusted; failure here
        voids the experiment.
    observation_collision:
      observable: >-
        The pair (per-slot minimal-polynomial degree, global CRT-glued
        conjugator existence).
      distinct_preimage_search: >-
        Two instances must give DIFFERENT gluing-test outcomes by
        construction: a genuine random ML-KEM-shaped A (expected: fail), and
        a DESIGNED A built by reducing a single global companion generator
        into every slot (expected: succeed). If the test cannot separate
        them, the instrument -- not the mathematics -- is broken.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (per-slot non-derogacy = true for all 128
          slots) fixed and vary the forgotten structure (mutual compatibility
          of the 128 slot-companion bases); name the intrinsic invariant (the
          isomorphism type of the induced extension per slot) that separates
          a gluable A from a non-gluable one.
        predicted_gain: >-
          None to an attacker. The gain is locating precisely which layer of
          e805b6's asserted obstruction carries the load.
    quantifier_order: >-
      The PIP-route claim needs: THERE EXISTS a global commutative embedding
      for the SPECIFIC (A, s, e) of a target key. This record tests: FOR ALL
      uniformly random A, does such an embedding exist with non-negligible
      probability? A 0-of-2000 empirical answer is evidence, not proof,
      against existence at these parameters for GENERIC A; it does not
      resolve the question for adversarially chosen or weak A, which remains
      open and is named as such.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "for uniformly random ML-KEM-shaped A at n=256, k in
        {2,3,4}, q=3329, the companion-matrix CRT-gluing construction of a
        module-to-ideal-lattice embedding succeeds with empirical probability
        consistent with 0 over 2000 trials." It cannot certify that no
        embedding of any kind exists.
      nearby_object_control: >-
        The designed/companion-generator A (positive control) is the nearby
        object where gluing DOES succeed by construction; the test's ability
        to separate it from generic A is the entire content of the audit.
    proof_obligations:
      - claim: "per-slot non-derogacy probability ~ 1 - O(1/q^2)"
        responsibility: success_probability
      - claim: "CRT decomposition R_q ~= product F_{q^2} round-trips exactly"
        responsibility: baseline
      - claim: "gluing test separates the designed positive control from derogatory negative controls"
        responsibility: correctness
      - claim: "audit closes only the companion-matrix CRT-gluing construction, not the whole PIP family"
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        per_slot_non_derogatory_fraction over 10,000 sampled matrices in
        M_k(F_{q^2}), q=3329, per k in {2,3,4}
      direction: higher
      minimum_effect: >-
        >= 0.999 at every k. A value materially below this (e.g. < 0.9) would
        falsify the classical-theory expectation and be the single most
        surprising finding available in this experiment.
    - metric: >-
        global_gluing_success_rate over 2000 sampled full A in R_q^{k x k}
      direction: lower
      minimum_effect: >-
        0/2000 predicted. ANY successful gluing event is the highest-priority
        finding this session can produce and reopens the PIP-for-modules
        question as live.
    - metric: >-
        slot_independence chi-squared p-value between CRT-slot matrices under
        a from-scratch FIPS-203-style SampleNTT and a matched synthetic-
        uniform null
      direction: different
      minimum_effect: >-
        p > 0.01 expected (no detectable deviation). A low p-value flags an
        unrelated finding belonging to the XOF-defect family
        (IDEA-20260807-331ae5), not this one, and must be routed there.

  minimal_test:
    design: >-
      Stage 0 (done): e805b6 and 019d2f read in full/excerpt this session.
      Stage 1 (numpy/sympy, minutes): implement CRT-slot extraction at
      q=3329, n=256; verify exact round-trip reconstruction over 50 random
      polynomials before proceeding -- a required positive control. Stage 2
      (numpy/sympy, minutes-hours): Monte Carlo non-derogacy test, 10,000
      samples per k in {2,3,4}, over F_{q^2}. Stage 3 (numpy/sympy, hours):
      global-gluing test on 2000 full sampled A. Stage 4 (optional,
      infrastructure-gated): chi-squared slot-independence test against a
      real SampleNTT implementation; if no validated SHAKE128-based
      implementation exists in-repo, this stage is reported as an
      infrastructure gap, not a negative result.
    controls:
      - >-
        POSITIVE CONTROL (non-derogacy detector): scalar matrices cI (always
        maximally derogatory, min-poly degree 1 for k>=2) must be detected
        as non-derogatory=False in 100% of trials, or the detector code is
        broken and nothing else may be reported.
      - >-
        POSITIVE CONTROL (gluing detector): a DESIGNED A with every slot set
        to the companion matrix of the SAME fixed degree-k polynomial must be
        detected as gluing-success=True, or the gluing test is broken and no
        negative result about generic A may stand.
      - >-
        GRADED CONTROL: k=1 (trivial success expected) through k=4; report
        whether gluing-success vanishes monotonically as k grows.
    required_metrics:
      - "per-slot non-derogacy fraction, per k, with per-slot-position breakdown (not just an aggregate)"
      - "global gluing success count / 2000, per k"
      - "positive-control pass/fail for both detectors"
      - "CRT round-trip check result"

  falsification_conditions:
    - "per_slot_non_derogatory_fraction < 0.9 at any tested k"
    - "Any successful global gluing event in the 2000-trial sample"
    - "Either positive control (scalar-matrix detector; designed-companion gluing detector) fails"
    - "chi-squared slot-independence test shows p < 0.001 under real SampleNTT (a real but different finding, to be routed to IDEA-20260807-331ae5's family)"

  confounders:
    - >-
      "Necessary condition" framing: absence of non-derogacy+gluing proves
      only that ONE specific (companion-matrix) construction fails, not that
      no embedding of any kind exists via a different, non-CRT-aligned
      commutative subalgebra.
    - >-
      Sampling a subset of the 128 slot positions per trial for cost reasons
      could bias the estimate if behavior varies systematically across slot
      position (e.g. by Galois-conjugate prime); the per-slot-position
      breakdown metric exists specifically to catch this.
    - >-
      Computer-algebra/modular-arithmetic bugs are the largest realistic risk
      in an "elementary but easy to get wrong" computation; the two positive
      controls exist specifically to catch this before any negative claim.

  interpretation_limits:
    - >-
      This is an exact-parameter (not scaled-down) but NECESSARY-CONDITION-
      ONLY audit. A negative result closes the companion-matrix CRT-gluing
      construction specifically, not the PIP family, per inventor-protocol §4.
    - >-
      Claim tier is `derivation`+`toy` in the sense that k is small, though n
      and q are the REAL ML-KEM values -- a genuine strength relative to most
      audits in this corpus, stated plainly rather than oversold.
    - >-
      A positive finding (gluing succeeds) would NOT itself be an attack; it
      would only mean the downstream Luo-Part-IV-style pipeline (already
      separately shown information-free by e805b6's determinant-ideal
      argument) has an input it did not have before. This record must be
      read alongside e805b6, not as a replacement for it.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For k x k matrices over a finite field F with |F| >> k, the
        probability that a uniform matrix is non-derogatory (cyclic) is
        1 - O(1/|F|), imitating the classical fact that a random object of
        this type is "generic" with probability approaching 1 as the
        underlying field grows -- analogous to a random polynomial being
        separable with high probability.
      rigorous_support: >-
        Classical random-matrix-over-finite-fields theory (Fulman 2002 and
        related work on cyclic matrices) -- RECALLED at summary level only;
        the exact finite-(k, q) closed form is NOT independently confirmed
        this session.
      validation_plan: >-
        Direct Monte Carlo enumeration over M_k(F_{q^2}) at the EXACT ML-KEM
        values q=3329 (q^2=11,082,241), k in {2,3,4}, 10,000 samples per
        cell, testing char_poly==min_poly via a Krylov-rank test. No
        scale-down or extrapolation is needed since k is tiny and q is fixed;
        this is one of the rare cases in this program where the real
        parameters are directly computable.
    - id: H2
      statement: >-
        The 128 CRT-slot matrices induced by a uniform A in R_q^{k x k} are
        i.i.d. uniform over M_k(F_{q^2}).
      rigorous_support: >-
        The CRT isomorphism R_q ~= product F_{q^2} is a ring isomorphism
        (inherited, established elsewhere in this corpus); uniformity of the
        induced slot matrices follows if the sampling procedure induces
        uniformity over R_q, which FIPS 203's own rationale assumes under a
        random-oracle model for its XOF and is NOT re-derived here.
      validation_plan: >-
        Chi-squared independence/uniformity test on CRT-projected slot
        matrices from >= 2000 independently-seeded, real (or faithfully
        re-implemented and vector-checked) FIPS-203 SampleNTT outputs,
        against a matched synthetic-uniform null.

  target_complexity:
    time_exponent: >-
      n/a -- no attack is proposed. This audit bears on whether a
      PRECONDITION for the PIP route (whose claimed complexity, if the
      Part-IV pipeline were faithful, would be O(n^3 log^2 n) quantum gates,
      i.e. polynomial) is ever met at module rank k>=2. Expected outcome adds
      a second, independent, load-bearing reason (beyond e805b6's
      determinant-ideal argument) that this route does not reach ML-KEM.
    memory_exponent: "n/a for the audit; O(poly(k,n)) to run the experiment itself."
    best_known: >-
      Classical/quantum sieve-based attacks per this program's pinned
      estimator (2^0.292*beta classical; see IDEA-20260828-411711 this
      session for a fresh quantum comparison point); the PIP route under
      audit claims polynomial time IF its precondition holds, which this
      record and e805b6 both independently argue against.
    hidden_overhead: "None claimed; this audit produces a probability estimate, not an asymptotic algorithm."
    tradeoff_note: "n/a."

  dominated_by: >-
    n/a (no result claimed; this audit targets an unmeasured assumption
    inside IDEA-20260805-e805b6's own argument, not an independent Pareto
    point). On the underlying question -- can a module-rank-k>=2 MLWE
    instance ever be re-expressed as a rank-1 ideal lattice -- the incumbent
    position is e805b6's determinant-ideal argument plus its own asserted
    rank-reduction claim; this proposal supplies the missing measurement for
    the latter.
  sota_delta: >-
    No attack; no time/memory/data figure changes. The deliverable is a
    quantified probability (expected near 1 per-slot, near 0 globally) that
    converts an existing ledger record's unmeasured assertion into a number,
    closing (or, if falsified, dramatically reopening) one specific
    construction inside the already-audited PIP family.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  source_refs:
