idea:
  id: IDEA-20260815-f4deca
  question_id: RQ-PAIR-21313f
  added: '2026-08-15'
  title: >-
    GALOIS SYMMETRY IS PROPOSED TO ACCELERATE TNFS LINEAR ALGEBRA AND KN-
    OPEN-025 ASKS FOR WHICH AUTOMORPHISM ORDERS: measure the end-to-end gain
    rather than the linear-algebra gain alone
  class: measurement

  claim: >-
    KN-OPEN-025 asks for which automorphism orders Galois symmetry
    accelerates TNFS linear algebra and what the end-to-end gain is. A
    speedup confined to one stage can be erased by the cost of arranging it
    -- the polynomial selection constrained to admit the automorphism may be
    worse, and the relation collection may suffer. Measuring end to end is
    what the open problem actually asks.

  mechanism: >-
    For each automorphism order, run constrained polynomial selection,
    relation collection and linear algebra with and without the symmetry
    exploited. Report the per-stage and end-to-end gain.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of KN-OPEN-025; grep 'Galois symmetry', 'automorphism order',
      'TNFS' (6), 'exTNFS' (13).
    results: >-
      KN-OPEN-025 poses the question and remains open; no record measures
      the end-to-end gain across stages.
    verdict: >-
      ADAPTATION. The linear-algebra speedup from Galois symmetry is
      published; the contribution is the end-to-end measurement the open
      problem names as its actual question.

  object_first_candidate:
    tracked_object: >-
      THE END-TO-END GAIN from exploiting Galois symmetry, rather than the
      linear-algebra gain in isolation.
    lossiness: >-
      Reporting one stage's speedup projects away the cost of arranging
      it, which is exactly where the gain can vanish.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while constrained polynomial selection is feasible for the
      tested automorphism orders; orders where it is not are reported as
      unreachable rather than as unfavourable.

  null_object_control: >-
    NULL 1 -- automorphism order one, which is the unconstrained case and
    must reproduce the baseline exactly. NULL 2 -- symmetry present but not
    exploited, isolating the selection constraint's cost from the
    exploitation's benefit, which is the decomposition that makes an end-to-
    end number interpretable.

  discriminated_from:
    - >-
        The exTNFS memory-charging record in this series, which costs the
        stages under memory charging; this varies the automorphism order
        and should share its cost model.
    - >-
        Published Galois-symmetry linear-algebra results, which give the
        per-stage gain this record puts in context.

  assumptions:
    - >-
        Constrained polynomial selection is feasible for several
        automorphism orders at the tested field sizes.
    - >-
        The symmetry's benefit and the selection constraint's cost are
        separable, which NULL 2 is designed to test rather than assume.

  predictions:
    - metric: >-
        order-one baseline reproduction
      direction: different
      minimum_effect: >-
        FORCED to reproduce the unconstrained baseline.
    - metric: >-
        selection-constraint cost with symmetry unexploited
      direction: different
      minimum_effect: >-
        Isolates the constraint's cost; if it exceeds the exploitation
        benefit, the end-to-end gain is negative regardless of the
        linear-algebra speedup.
    - metric: >-
        end-to-end gain per automorphism order
      direction: different
      minimum_effect: >-
        The measurement KN-OPEN-025 asks for; per-stage gains are
        reported alongside but the end-to-end number is the answer.
    - metric: >-
        orders where constrained selection is infeasible
      direction: different
      minimum_effect: >-
        Reported as unreachable rather than as unfavourable, since the
        two are different conclusions.

  minimal_test:
    design: >-
      Two automorphism orders plus order one, all three stages, both
      nulls, at the smallest tested field.
    controls:
      - >-
          Order-one unconstrained baseline.
      - >-
          Symmetry-present-but-unexploited control.
      - >-
          Per-stage costs reported alongside the end-to-end figure.
      - >-
          Infeasible orders reported as unreachable, never as measured
          negatives.
    required_metrics:
      - >-
          Per-stage and end-to-end cost per automorphism order.
      - >-
          Selection-constraint cost isolated from exploitation benefit.
      - >-
          List of orders where constrained selection was infeasible.

  falsification_conditions:
    - >-
        The order-one baseline does not reproduce. Harness wrong; halt.
    - >-
        The selection constraint costs more than the exploitation saves.
        The end-to-end gain is negative, which is a genuine answer to KN-
        OPEN-025 and the outcome most likely to be missed by stage-only
        measurement.
    - >-
        End-to-end gain is positive for some orders. KN-OPEN-025's
        question is answered for those orders with a measured number.
    - >-
        Constrained selection is infeasible everywhere. The question is
        unreachable at these field sizes and must be reported as such.

  confounders:
    - >-
        STAGE-ONLY REPORTING: quoting the linear-algebra gain alone is
        exactly the error this record exists to avoid, and per-stage
        numbers must never be presented without the end-to-end figure.
    - >-
        SELECTION QUALITY: a constrained selection that is simply worse-
        executed than the unconstrained one would show a spurious
        negative, so selection effort must be matched and reported.

  interpretation_limits:
    - >-
        Measures one published technique end to end; proposes nothing new.
    - >-
        Scoped to the tested field sizes and automorphism orders.
    - >-
        A negative end-to-end gain binds the tested orders and selection
        effort, not the technique in general.

  heuristic_assumptions:
    - id: HEUR-PAIR-GAL-1
      statement: >-
        The cost of constraining polynomial selection to admit an
        automorphism is independent of the benefit that automorphism
        brings to linear algebra.
      rigorous_support: >-
        Rigorous ingredient: the two stages are separate computations
        with separate cost models, so their costs add. THE GAP: the
        constraint changes which polynomial pair is selected, which
        changes the relation-collection cost and the resulting matrix's
        structure -- so the linear-algebra benefit itself depends on the
        constraint, and the two are not independent at all.
      falsification_condition: >-
        Linear-algebra gain varying with which constrained polynomial
        pair was selected.
      validation_plan: >-
        SAMPLE: >= 3 selected pairs per automorphism order, so the
        within-order variation is visible. TAIL CHECK: the pair with the
        worst end-to-end result, checked for selection quality.
        TRANSFER: none beyond the tested field sizes.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is full pipeline runs across automorphism
      orders.
    memory_exponent: >-
      Relation-collection and linear-algebra dominated; substantial.
    best_known: >-
      Incumbents are the published Galois-symmetry linear-algebra results
      and standard exTNFS; both are used and neither is improved.
    hidden_overhead: >-
      Constrained polynomial selection may be far more expensive than
      unconstrained, and that cost is part of the end-to-end figure rather
      than a setup expense.
    tradeoff_note: >-
      Exploiting symmetry buys linear-algebra time and costs selection
      freedom; the end-to-end number is where that trade is settled.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As a technique: dominated by the published
    Galois-symmetry results. As an end-to-end measurement answering KN-
    OPEN-025: none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent claim of its own. Content delivered: end-to-end
    gain from Galois symmetry across automorphism orders with the selection-
    constraint cost isolated from the exploitation benefit, which is the
    question KN-OPEN-025 poses and which stage-only measurements cannot
    answer.

  estimated_cost:
    implementation: high
    compute: high
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.5 that constrained selection is feasible for two orders at tested
    sizes, which is the binding risk. 0.85 that the order-one baseline
    reproduces. 0.45 that the end-to-end gain is negative or negligible once
    selection cost is charged, which would answer KN-OPEN-025 in the
    direction stage-only work would miss.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
