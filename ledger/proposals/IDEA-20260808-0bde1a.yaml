    and that is a named prior-art check. Honest status: "not dominated in-corpus; one plausible
    external convention unchecked".'
  estimated_cost: Implementation medium (an exact enumerator in pure Python is the largest
    piece; NEG-2 and NEG-3 are schema plus bookkeeping). Compute medium, dominated by NEG-2's
    mandatory matched nulls.
  recommended_priority: medium
  honest_prior_of_survival: 0.65 that NEG-2 and NEG-3 are adopted and useful; 0.3 that NEG-1
    is affordable anywhere the goal actually cares about. The realistic outcome is that NEG-1
    is available only in the easy corner, and saying so with a measured dimension limit is
    itself the deliverable.
  novelty_status: screened
  novelty_screen: SCREENED against ledger/proposals/IDEA-20260807-a4f5c5.yaml (read in full
