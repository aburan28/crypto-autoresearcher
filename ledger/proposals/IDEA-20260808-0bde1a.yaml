idea:
  id: IDEA-20260808-0bde1a
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ECDSA-87625f
  goal_id: GOAL-ECDSA-001
  title: 'A frontier whose NON-recovery points are uncertified cannot locate a boundary: three
    verifiable failure certificates (lattice enumeration exhaustion, Fourier null-quantile,
    and an explicit budget receipt) that separate "provably not there" from "not found within
    budget", with the program''s own rule 5 encoded as a distinct certificate kind rather
    than as prose'
  class: measurement
  claim: "SCOPE. The negative points of the memory-charged frontier GOAL-ECDSA-001 completion\
    \ criterion 2 asks for. NOT an attack, NOT a statement about ECDLP.\nTHE PROBLEM, STATED\
    \ PRECISELY. Every claimed RECOVERY on this frontier carries a cheap certificate (d*G\
    \ == Q) and RQ-ECDSA-87625f makes it mandatory. Every claimed NON-recovery — which is\
    \ what a BOUNDARY is made of — currently carries nothing. A frontier assembled from uncertified\
    \ negatives cannot distinguish the three situations AGENTS.md rule 5 and GOAL-ECDSA-001's\
    \ pause_conditions already know are different:\n  (i) the instance genuinely admits no\
    \ solution within the searched set,\n  (ii) the solver searched the right set and missed,\n\
    \  (iii) the run hit a declared budget and stopped.\nUnder rule 5 only (i) is evidence\
    \ about the leakage model; (ii) is an implementation fact and (iii) is a budget fact.\
    \ TODAY ALL THREE ARE RECORDED IDENTICALLY.\nTHE CLAIM. Each of the three admits a checkable\
    \ certificate at cost comparable to the search itself, and the three are constructible:\n\
    \  NEG-1 (LATTICE EXHAUSTION). For dimension D <= 60, run exact\n    enumeration with\
    \ a radius R chosen so that the target vector t of\n    X1-01 would necessarily have norm\
    \ <= R (a bound computable from\n    (l, N, m) with no heuristic — it is a triangle inequality\
    \ on the\n    coordinate ranges, not a Gaussian-heuristic estimate). Emit the\n    enumeration\
    \ tree node count, the radius, and the basis. The\n    certificate statement is \"no lattice\
    \ point of norm <= R decodes to a\n    scalar reproducing the public key\", and it is\
    \ re-verifiable by\n    re-running the enumeration from the emitted basis and seed.\n\
    \  NEG-2 (FOURIER NULL QUANTILE). Emit the FFT peak height, the FFT size\n    2^t, the\
    \ number of combinations M, and the empirical null-maximum\n    distribution measured\
    \ on the SAME pipeline with the SAME M fed\n    unbiased inputs. The certificate statement\
    \ is \"the observed peak lies\n    at the q-th quantile of the matched null\", with q\
    \ reported. This is a\n    two-directional instrument by construction: it cannot report\
    \ a\n    negative without also having demonstrated what a positive looks like.\n  NEG-3\
    \ (BUDGET RECEIPT). Emit the declared budget, the resource actually\n    consumed, and\
    \ the stopping rule that fired. The certificate statement\n    is \"unreached\", never\
    \ \"not recoverable\".\nCLAIM: with these three kinds, every negative point on the frontier\
    \ becomes classifiable, and the fraction of the program's negative points that are of\
    \ kind (iii) rather than (i) is MEASURABLE — and is predicted to be the large majority.\n\
    THE DISCRIMINATOR. If most negatives classify as NEG-3, then the published \"boundary\"\
    \ at any curve size is a budget contour and the goal's criterion-3 question (resource\
    \ gap or structural obstruction) is answered \"resource gap\" by the frontier's own metadata.\
    \ If a material fraction classify as NEG-1 with a radius R that provably contains the\
    \ target, then there are instances where the lattice route provably fails and the boundary\
    \ has structural content at those cells. These are different worlds and the current record\
    \ format cannot tell them apart."
  mechanism: 'DERIVED IN-REPO. The three certificate kinds are constructed from material already
    in this program''s contract.

    WHY NEG-1 IS POSSIBLE AT ALL. The HNP target vector''s coordinates are bounded EXACTLY,
    not heuristically: the first m coordinates are 2^{l+1} u_i with |u_i| <= n/2^{l+1}, so
    each is bounded by n; the (m+1)st is d < n; the last is n. Hence ||t||^2 <= (m+2) n^2
    and R = n sqrt(m+2) is a PROVEN radius containing the target whenever the embedding is
    correct. Exact enumeration to radius R therefore either finds a decoding vector or proves
    none exists below R. The cost is the enumeration node count, which is exponential in D
    but is FINITE AND MEASURED, and the certificate is exactly that count plus the basis.
    This converts "BKZ didn''t find it" (an implementation fact) into "no vector below a proven
    radius decodes" (a fact about the instance), for the dimensions where enumeration is affordable.
    THE HONEST LIMIT IS DIMENSION: D <= 60 covers m <= 58, which at l = 4 covers N up to about
    200 by X1-02''s information bound and at l = 1 covers essentially nothing. SO NEG-1 IS
    AVAILABLE EXACTLY WHERE THE PROBLEM IS EASY, AND THAT LIMIT IS THE FINDING, NOT A FLAW
    TO BE HIDDEN.

    WHY NEG-2 IS THE PROTOCOL''S OWN RULE MADE EXECUTABLE. docs/inventor-protocol.md section
    3 requires that any reported signal be run against a null object of the same shape. NEG-2
    is that requirement applied to a NEGATIVE: reporting "no peak" is meaningless without
    the null''s peak distribution, because the whole content of "no peak" is "not larger than
    the null". Recording the quantile makes the negative quantitative and makes the instrument''s
    sensitivity visible.

    WHY NEG-3 IS NOT BUREAUCRACY. AGENTS.md rule 5 says a timeout is not evidence against
    a mathematical hypothesis. GOAL-ECDSA-001''s pause_conditions explicitly anticipate that
    published rungs at terabyte RAM will be unreachable and instructs that they be recorded
    as unreached. A distinct certificate KIND enforces that in the data model rather than
    trusting prose, which is the difference between a rule and a control.'
  why_not_a_renamed_known_approach: 'NEAREST KNOWN METHOD: reporting "attack failed" with
    parameters, which is universal. The difference is that a failure becomes a CHECKABLE OBJECT
    with a statement, a verifier, and a re-verification procedure — the same standing this
    program already gives to successes. Against IDEA-20260807-a4f5c5: that record fault-injects
    the POSITIVE certificate verifier (does it reject a wrong discrete log?) and explicitly
    notes that docs/claims-and-verification.md distinguishes invalid_measurement from negative_observation
    and that the distinction "has never been exercised". This record proposes the missing
    OBJECT for the negative branch. The two are complements: a4f5c5 tests the verifier that
    exists; this one supplies certificates for the case where no verifier exists at all.'
  predictions:
  - observable: Classification of every negative point produced by the goal's own first reproduction
      batch
    metric: fraction in {NEG-1, NEG-2, NEG-3}
    predicted: NEG-3 (budget) at least 0.7 of negatives at N >= 112; NEG-1 obtainable only
      at N <= 64 with l >= 4. A NEG-1 fraction above 0.2 at N >= 112 would falsify my reading
      of the enumeration cost and would be very good news for the frontier.
  - observable: Enumeration node count for NEG-1 at (N, l, m) cells where the information
      bound says the instance is underdetermined
    metric: log2 nodes, and whether enumeration terminates within budget
    predicted: Terminates for D <= 40 within 10^3 seconds; the node count grows by at least
      a factor 4 per unit of D in the tested range. Non-growth would indicate the radius is
      being applied wrongly.
  - observable: NEG-2 quantile on runs where the key IS recoverable (planted positive)
    metric: q
    predicted: Above 0.999 for every recoverable instance. A recoverable instance whose peak
      sits at the null median means the Fourier instrument has no power at that cell and no
      negative from that cell is admissible.
  - observable: Number of frontier points in the eventual deliverable that carry no certificate
      of any kind
    metric: count
    predicted: Zero, by construction. A nonzero count is a process failure and is reported
      as one.
  minimal_test: 'Implement the three certificate kinds as record schemas plus verifiers, then
    run them against the goal''s own toy ladder at N in {32, 48, 64}, l in {1, 2, 4}, m swept
    across the X1-02 window. Include TWO planted positives (instances known recoverable) and
    TWO matched nulls (unbiased nonces) per cell. Measure: does NEG-1 ever fire on a recoverable
    instance (it must not — that would be a soundness failure); does NEG-2''s quantile separate
    planted positives from nulls; does NEG-3 fire only when a declared budget was actually
    exhausted.'
  controls:
  - 'SOUNDNESS CONTROL FOR NEG-1: run it on instances where the key IS recoverable. It must
    never emit an exhaustion certificate. A single false exhaustion invalidates the kind.'
  - 'MATCHED NULL FOR NEG-2: unbiased nonces at the same M and t. The quantile distribution
    on nulls must be uniform on [0,1]; any deviation means the null model is wrong.'
  - 'DECAY TEST: as l falls from 4 to 1 at fixed everything else, the fraction of NEG-1-certifiable
    cells must fall to zero (the enumeration dimension explodes). If it does not, the radius
    or the dimension is being computed wrongly.'
  - 'BUDGET HONESTY CONTROL: deliberately set a budget so low that a KNOWN recoverable instance
    is cut off. It must produce NEG-3, not NEG-1 or NEG-2. This is the exact rule-5 failure
    mode and it must be exercised.'
  confounders:
  - The proven radius R = n sqrt(m+2) is loose; enumeration to a loose radius is far more
    expensive than to the Gaussian-heuristic radius, so NEG-1's affordability is worse than
    a practitioner's intuition suggests. Reporting the tight-radius node count alongside is
    tempting and is FORBIDDEN unless the tight radius is separately proven to contain the
    target, because a heuristic radius destroys the certificate's meaning.
  - NEG-2's null must be generated by the SAME code path, or it measures the difference between
    two implementations rather than the presence of a signal.
  - 'A negative can be caused by a wrong embedding (a bug), which none of the three kinds
    detects. Hence the planted positives are mandatory, not optional: they are the only thing
    standing between "certified negative" and "certified bug".'
  falsification_conditions:
  - NEG-1 emits an exhaustion certificate on a recoverable instance. The kind is unsound and
    is withdrawn.
  - NEG-2's quantile on matched nulls is not uniform. The null model is wrong and no NEG-2
    certificate may be issued until it is fixed.
  - The low-budget control produces NEG-1 or NEG-2 rather than NEG-3. The classifier confuses
    budget exhaustion with mathematical absence, which is the exact defect the record exists
    to prevent.
  - Enumeration at D = 40 with the proven radius does not terminate within 10^4 seconds at
    any tested cell. NEG-1 is unavailable in practice and the record says so, reducing the
    deliverable to NEG-2 and NEG-3.
  interpretation_limits: AN EVIDENCE-FORMAT RESULT. It recovers no key, improves no attack,
    and moves no exponent. It cannot make a negative TRUE — it can only make a negative's
    SCOPE explicit. NEG-1's scope is "no vector below R in this basis decodes", which is a
    statement about one embedding, not about the leakage model; NEG-2's is "this pipeline's
    statistic did not separate from its own null at this M and t". Neither licenses "l bits
    at N bits is not recoverable" and the record forbids that sentence. Toy scale throughout.
  assumptions:
  - The embedding of X1-01 is correct (guarded by the planted positives, not assumed).
  - Exact arithmetic in the enumeration; no floating-point Gram-Schmidt shortcuts that could
    miss a vector.
  heuristic_assumptions:
  - id: HA-6
    statement: (Null exchangeability for NEG-2.) FOR ALL (M, t), the distribution of the FFT
      maximum computed on unbiased nonces through the identical pipeline is the correct reference
      distribution for the same statistic computed on leaked nonces under the null that the
      key is not localizable at that (M, t).
    rigorous_ingredient: Under exactly uniform nonces the residuals are exactly uniform mod
      n, so the FFT bins are exactly exchangeable; this part is a theorem, not a heuristic.
      What is assumed is that the pipeline's own artifacts (finite precision, binning, duplicate
      combinations) affect both arms identically.
    distribution_imitated: The permutation / exchangeability null used throughout this program's
      instrumentation lane, and the Gumbel extreme-value law for the maximum.
    validation_route: 'Generate 10^3 null runs at each of t in {10,12,14,16}, form the empirical
      CDF of the maximum, and check uniformity of the resulting quantiles by a Kolmogorov-Smirnov
      statistic against U[0,1]. Compare the empirical maximum''s location against the Gumbel
      prediction and report the discrepancy. TOY LABEL: toy-scale; the quantile machinery
      is t-local and does not depend on N.'
    tail_checks: The 0.999 quantile is the operative one (planted positives are predicted
      above it), and the empirical 0.999 quantile from 10^3 draws has an order-statistic uncertainty
      that must be reported — with N_draws = 10^3 the smallest resolvable p-value is 10^{-3},
      which is exactly the KN-FIND-031 caution (an empirical survival function's lowest nonzero
      value is 1/N) and it is respected here rather than rediscovered.
  target_complexity:
    time_exponent: NO EXPONENT MOVES. NEG-1 costs an exact enumeration, which is 2^{Theta(D
      log D)} in the worst case and is affordable only for D <= about 60 — that limit is stated,
      not hidden. NEG-2 and NEG-3 cost a constant factor over the run they annotate (NEG-2
      doubles the run, since it requires a matched null of the same size).
    memory_exponent: NEG-1 polynomial in D; NEG-2 equal to the run it annotates; NEG-3 O(1).
    best_known_baseline: 'The current practice: no certificate at all for negatives. There
      is no baseline to beat, which is the point.'
    hidden_overhead_disclosure: NEG-2 DOUBLES the cost of every negative frontier point, because
      the matched null is a full second run. That is a real and material charge against the
      goal's 10800-second campaign budget and it is stated here rather than discovered during
      a batch.
    time_memory_tradeoff: Not applicable to the certificates themselves. NEG-1's radius/dimension
      tradeoff is the only lever and it is proven-radius-or-nothing.
  sota_delta: 'Zero on attack cost. On the frontier''s information content: converts an unknown
    fraction (predicted >= 0.7) of negative points from uninterpretable to classified, and
    makes the goal''s criterion-3 resource-versus-structure question answerable from metadata
    alone rather than from a new experiment.'
  dominated_by: 'CHECKED. Nothing in this program''s corpus provides negative certificates;
    IDEA-20260807-a4f5c5 covers positive-certificate fault injection and explicitly leaves
