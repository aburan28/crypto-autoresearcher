idea:
  id: IDEA-20260815-fa6a12
  question_id: RQ-EQLA-0d3f40
  added: '2026-08-15'
  title: >-
    SPARSE LINEAR ALGEBRA IS THE SECOND HALF OF EVERY INDEX-CALCULUS
    EXPONENT AND THIS PROGRAM COSTS IT FROM A CITED ASYMPTOTIC: measure
    Wiedemann and Lanczos on the actual relation matrices the lane produces
  class: cost-model

  claim: >-
    The ICEX exponent is relation cost plus linear-algebra cost. The lane
    measures the first and cites the second as sparse-matrix asymptotics.
    Real relation matrices have a specific sparsity pattern and a specific
    structure from the factor base, and iterative solver cost on them is
    measurable rather than citable.

  mechanism: >-
    Collect actual relation matrices from the lane's runs. Run block
    Wiedemann and Lanczos on them, measuring operations and memory. Compare
    against the cited asymptotic and against random sparse matrices of
    matched dimension and density.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Grep 'sparse linear algebra', 'Wiedemann', 'Lanczos', 'block'; read
      of RQ-EQLA-0d3f40 and GOAL-ICEX-001's charging constraint.
    results: >-
      Sparse linear algebra is cited as a cost term throughout; no record
      measures solver cost on the lane's actual matrices.
    verdict: >-
      ADAPTATION. Both solvers are classical and their asymptotics are
      published; the contribution is measuring them on the matrices this
      campaign actually generates.

  object_first_candidate:
    tracked_object: >-
      SOLVER COST on real relation matrices, replacing the cited
      asymptotic.
    lossiness: >-
      An asymptotic projects away the matrix's actual structure, which for
      relation matrices is highly non-random and is exactly what solver
      cost responds to.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while the lane's runs retain their relation matrices; if
      they do not, matrices must be regenerated and that cost is reported.

  null_object_control: >-
    NULL 1 -- random sparse matrices at matched dimension and density,
    giving the cost the asymptotic predicts for unstructured input. NULL 2
    -- a matrix with a known solution, verifying solver correctness before
    any timing is admitted.

  discriminated_from:
    - >-
        The cited sparse-solver asymptotics, which this measures against
        on real input rather than improving.
    - >-
        KN-OPEN-006, which asks whether DESIGNED supports give a
        structured matrix with a faster solve; this measures the solve
        cost of the matrices the lane currently produces, which is the
        baseline that question needs.

  assumptions:
    - >-
        Relation matrices from the lane's runs are retained or
        regenerable.
    - >-
        Both solvers are implementable or available in a form whose cost
        is measurable rather than opaque.

  predictions:
    - metric: >-
        known-solution verification
      direction: different
      minimum_effect: >-
        FORCED correct before any timing is recorded.
    - metric: >-
        solver cost on real matrices versus matched random sparse
      direction: different
      minimum_effect: >-
        The measurement; real relation matrices are structured and may
        solve faster or slower than the random reference.
    - metric: >-
        measured cost against the cited asymptotic
      direction: different
      minimum_effect: >-
        If real matrices depart materially from the asymptotic, the
        lane's second cost term is wrong and the ICEX exponent moves.

  minimal_test:
    design: >-
      Matrices from the lane's smallest completed runs, both solvers, both
      nulls.
    controls:
      - >-
          Random sparse matched-density null.
      - >-
          Known-solution correctness verification.
      - >-
          Both solvers measured, since their costs differ on structured
          input.
      - >-
          Matrix sparsity pattern recorded, not just density.
    required_metrics:
      - >-
          Operations and memory per solver per matrix.
      - >-
          Comparison against matched random sparse.
      - >-
          Comparison against the cited asymptotic.
      - >-
          Sparsity pattern statistics per matrix.

  falsification_conditions:
    - >-
        Solver correctness fails. Implementation wrong; no timing
        admissible.
    - >-
        Real matrices match the random reference. The asymptotic is
        adequate and the lane's citation is justified.
    - >-
        Real matrices solve materially faster. The lane's linear-algebra
        term is overstated and the ICEX exponent improves for index
        calculus.
    - >-
        Real matrices solve materially slower. The term is understated,
        which is the direction that would be easy to miss and would
        flatter index calculus if unmeasured.

  confounders:
    - >-
        DENSITY-ONLY MATCHING: random matrices matched on density alone do
        not reproduce the relation matrix's structure, so the null is a
        weak reference and the sparsity pattern must be reported
        alongside.
    - >-
        SMALL-MATRIX ARTIFACTS: iterative solvers have startup costs that
        dominate at small dimension, which is exactly the regime the
        lane's toy runs produce.

  interpretation_limits:
    - >-
        Measures a cost term; produces no exponent and no comparison.
    - >-
        Scoped to the lane's actual matrices at their current sizes.
    - >-
        Small-matrix behaviour does not extrapolate to the sizes where the
        exponent would matter.

  heuristic_assumptions:
    - id: HEUR-EQLA-1
      statement: >-
        Solver cost measured on the lane's toy relation matrices
        reflects the cost behaviour at the sizes the exponent comparison
        targets.
      rigorous_support: >-
        Rigorous ingredient: the published complexities for block
        Wiedemann and Lanczos are asymptotic in matrix dimension and
        weight, giving the functional form. THE GAP: at toy dimensions
        the asymptotic regime has not been reached and startup costs
        dominate, so a toy measurement may say nothing about the regime
        that matters -- which is the record's central limitation rather
        than a footnote.
      falsification_condition: >-
        Measured cost failing to approach the asymptotic form as matrix
        dimension grows across the available range.
      validation_plan: >-
        SAMPLE: every retained matrix, spanning as wide a dimension
        range as the lane's runs provide. COMPARISON: measured cost
        against the asymptotic form, as a function of dimension. TAIL
        CHECK: the largest matrix, which is the only one near any
        asymptotic regime. TRANSFER: stated and unjustified.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is one solve per matrix per solver.
    memory_exponent: >-
      Solver working set, which is the memory term being measured.
    best_known: >-
      Incumbents are the published block Wiedemann and Lanczos analyses,
      measured here on real input and not improved.
    hidden_overhead: >-
      Toy matrix dimensions sit far below any asymptotic regime, which
      limits what the measurement can support.
    tradeoff_note: >-
      Measuring on real matrices costs little and replaces a cited term
      with a measured one; the toy-dimension limitation is the price.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As solvers: entirely dominated by the
    published sparse linear algebra literature. As measurement on this
    lane's matrices: none exists. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: measured block Wiedemann and
    Lanczos cost on the relation matrices this campaign actually produces,
    against matched random sparse input and against the asymptotic the lane
    currently cites for its second cost term.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.6 that relation matrices are retained or cheaply regenerable. 0.9 that
    solver correctness verifies. 0.4 that real matrices depart materially
    from the random reference, which would mean the lane's cited term is
    wrong in one direction or the other.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
