idea:
  id: IDEA-20260815-d389da
  question_id: RQ-ROS-595c15
  added: '2026-08-15'
  title: >-
    ROS FEASIBILITY IS A THRESHOLD IN CONCURRENCY, AND DEPLOYED SYSTEMS SET
    CONCURRENCY LIMITS FOR CAPACITY REASONS: map which published protocols
    have limits below the threshold and which have no limit at all
  class: theory

  claim: >-
    The ROS attack becomes feasible above a concurrency threshold. Whether a
    deployed blind-signature or threshold protocol is exposed depends on
    whether it bounds concurrent sessions at all, and most specifications
    discuss concurrency for liveness rather than for ROS. Mapping
    specifications against the threshold turns a cryptographic result into a
    deployment statement.

  mechanism: >-
    Enumerate protocols in the corpus using a ROS-vulnerable structure. For
    each, extract any stated concurrency bound from its specification.
    Compare against the measured threshold and classify as bounded-below,
    bounded-above, or unbounded.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-ROS-001 objective; grep 'ROS', 'concurrency limit',
      'session bound'.
    results: >-
      The goal asks which deployments sit below the threshold; no record
      extracts stated concurrency bounds and compares them.
    verdict: >-
      ADAPTATION. The attack and its threshold are published; the
      contribution is the specification-to-threshold mapping the goal
      names.

  object_first_candidate:
    tracked_object: >-
      THE STATED CONCURRENCY BOUND of each protocol specification, against
      the ROS threshold.
    lossiness: >-
      Reducing a protocol to one bound discards its session semantics, so
      protocols whose concurrency is bounded implicitly rather than
      explicitly are a separate reported category.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while specifications state concurrency behaviour; those
      that do not are the mapping's most important entries.

  null_object_control: >-
    NULL 1 -- a protocol with no ROS-vulnerable structure, which must
    classify as not applicable rather than as safe; conflating the two is
    the mapping's central risk. NULL 2 -- a protocol with an explicit low
    bound, which must classify as bounded-below.

  discriminated_from:
    - >-
        The ROS cost-curve record in this series, which measures the
        threshold; this consumes it and must not be run before it.
    - >-
        General concurrency guidance in protocol specifications, which
        addresses liveness rather than ROS.

  assumptions:
    - >-
        Protocols using a ROS-vulnerable structure are identifiable from
        their specifications.
    - >-
        The measured threshold from the cost-curve record is available;
        without it this record has nothing to compare against and must not
        proceed on a cited asymptotic.

  predictions:
    - metric: >-
        not-applicable null
      direction: different
      minimum_effect: >-
        FORCED classified not applicable, never safe.
    - metric: >-
        explicit-low-bound null
      direction: different
      minimum_effect: >-
        FORCED bounded-below.
    - metric: >-
        count of protocols with no stated bound
      direction: different
      minimum_effect: >-
        The deliverable; unbounded concurrency with a ROS-vulnerable
        structure is the deployment-relevant finding.

  minimal_test:
    design: >-
      Symbolic mapping over the corpus's protocol set, both nulls,
      consuming the measured threshold.
    controls:
      - >-
          Not-applicable null distinguishing inapplicable from safe.
      - >-
          Explicit-low-bound null.
      - >-
          Threshold taken from the measured cost curve, never from a
          cited asymptotic.
      - >-
          Implicitly bounded protocols reported as a separate category.
    required_metrics:
      - >-
          Classification per protocol with its specification citation.
      - >-
          Count of unbounded protocols with ROS-vulnerable structure.
      - >-
          Both null outcomes.

  falsification_conditions:
    - >-
        The not-applicable null classifies as safe. The mapping conflates
        inapplicable with secure and is actively misleading.
    - >-
        The measured threshold is unavailable. This record cannot run and
        must wait rather than substitute an asymptotic.
    - >-
        Several protocols are unbounded with a vulnerable structure. A
        deployment-relevant finding requiring review before disclosure.
    - >-
        All vulnerable protocols are bounded below the threshold.
        Reassuring and worth recording explicitly.

  confounders:
    - >-
        INAPPLICABLE VERSUS SAFE, the mapping's central risk: a protocol
        without the vulnerable structure is not evidence that bounds are
        unnecessary.
    - >-
        IMPLICIT BOUNDS: a protocol may bound concurrency through rate
        limiting or session state without saying so, and classifying it
        unbounded would overstate exposure.

  interpretation_limits:
    - >-
        Maps specifications against a measured threshold; makes no claim
        about any deployment's actual configuration.
    - >-
        Scoped to the enumerated protocols and their specification
        versions.
    - >-
        Unbounded in specification is not the same as unbounded in
        deployment.

  heuristic_assumptions:
    - id: HEUR-ROS-MAP-1
      statement: >-
        A protocol's stated concurrency bound reflects the concurrency
        an attacker can actually obtain against a deployment.
      rigorous_support: >-
        Rigorous ingredient: where a specification mandates a bound, a
        conforming implementation enforces it. THE GAP: attackers target
        deployments rather than specifications, and rate limits, load
        balancers and multiple endpoints all change the effective
        concurrency in both directions -- so the mapping describes
        specifications and not exposure.
      falsification_condition: >-
        A deployment demonstrably permitting concurrency above its
        specification's stated bound.
      validation_plan: >-
        SAMPLE: every enumerated protocol, with the specification text
        cited per classification. TAIL CHECK: protocols whose bound is
        stated only as guidance rather than as a requirement. TRANSFER:
        none; specifications are not deployments and the record says so.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic; no compute beyond consuming the measured
      threshold.
    memory_exponent: >-
      Negligible.
    best_known: >-
      The incumbent is the published ROS analysis and per-protocol
      security arguments; no specification-to-threshold mapping exists
      here.
    hidden_overhead: >-
      The gap between specification and deployment is the dominant hidden
      term and cannot be closed by reading specifications.
    tradeoff_note: >-
      A specification mapping is cheap and bounded; a deployment survey
      would be far more informative and is out of scope.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As cryptanalysis: nothing is mounted. As a
    specification mapping against a measured threshold: none exists here.
    Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a per-protocol classification
    of stated concurrency bounds against the measured ROS threshold, with
    inapplicable protocols distinguished from safe ones and implicitly
    bounded protocols reported separately.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.85 that vulnerable-structure protocols are identifiable. 0.6 that the
    measured threshold is available when this runs, since it depends on the
    cost-curve record succeeding. 0.4 that at least one enumerated protocol
    is unbounded in specification, which would be the deployment-relevant
    finding.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-ROS-595c15
    - GOAL-ROS-001
    - RQ-TECDSA-8d340d
    - KN-TECH-056
    - KN-TECH-080
    - docs/inventor-protocol.md
  id_allocation_provenance: >-
    Minted with `python3 tools/allocate_id.py --next idea --date 20260815`
    and verified free with `--check` before use; no state was scanned for a
    "next free number".
