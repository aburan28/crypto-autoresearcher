idea:
  id: IDEA-20260809-1143bf
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-EDDSA-9b8473
  goal_id: GOAL-EDDSA-001
  title: >-
    The prime-order-encoding null object: repeat the entire enumeration over
    Ristretto and require the divergence set to be EMPTY
  class: control
  claim: >-
    A prime-order group encoding with a canonical serialization is the object
    this whole divergence class was designed away by. Running the identical
    enumeration over it must yield an EMPTY divergence set. If it does not, the
    divergences are not caused by cofactor and encoding structure and every
    causal statement in this goal is wrong — which makes this the cheapest
    falsification control available for the entire campaign.
  mechanism: >-
    Instantiate the same predicate lattice over the prime-order encoding: the
    cofactored/cofactorless distinction collapses because the torsion subgroup is
    trivial in the quotient, and the canonicity predicates collapse because the
    encoding is canonical by construction. Every candidate object from the
    enumeration is mapped through and re-evaluated.
  why_not_a_renamed_known_approach: >-
    Ristretto is a known construction with a known purpose. Using it as a
    NULL-OBJECT CONTROL for a measurement campaign — rather than as a
    recommendation — is the methodological content, and it follows the
    inventor-protocol requirement that null-object controls precede belief.
  predictions:
  - observable: size of the divergence set over the prime-order encoding
    metric: integer
    predicted: >-
      Exactly zero. Any nonzero value falsifies the causal account of this
      goal's findings and must halt the campaign's interpretation until
      explained.
  - observable: number of predicates that remain non-trivial in the quotient
    metric: integer
    predicted: Substantially fewer than in the base setting; the predicates that survive identify what the encoding does NOT fix, which is a useful residue.
  minimal_test: >-
    Implement the prime-order encoding from its specification, validate against
    its test vectors, map every enumerated candidate through, evaluate the
    lattice, and report the divergence set's size and the surviving predicates.
  controls:
  - 'IMPLEMENTATION VALIDATION: the encoding implementation must pass its own test vectors first; an incorrect implementation would produce a spurious empty set, which is the specific failure mode that makes a null control useless.'
  - 'POSITIVE CONTROL: deliberately disable one canonicity check in the prime-order implementation and confirm the divergence set becomes non-empty, proving the harness can detect divergence in this setting at all.'
  falsification_conditions:
  - The divergence set over the prime-order encoding is non-empty and the cause is not an implementation defect.
  - The positive control fails to produce divergence, meaning the harness cannot detect divergence here and the empty result is uninformative.
  interpretation_limits: >-
    An empty divergence set is a statement about this encoding under this
    enumeration, not a recommendation to adopt it and not a security comparison
    between schemes.
  sota_delta: 'No attack. Delta: a falsification control that most measurement campaigns omit and that costs almost nothing here.'
  dominated_by: Not dominated by any corpus record.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for Ristretto/decaf: no records. WEB NOT CHECKED.'
  source_refs:
  - The Ristretto specification -- REQUIRED READ, NOT YET READ.
