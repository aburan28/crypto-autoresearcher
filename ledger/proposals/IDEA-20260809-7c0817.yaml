idea:
  id: IDEA-20260809-7c0817
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-WFS-e776b6
  goal_id: GOAL-WFS-001
  title: >-
    Is transcript completeness decidable? Propose a static criterion and score it
    against the certificate enumeration, reporting both error directions
  class: mechanism
  claim: >-
    Transcript completeness can be checked mechanically by a criterion over the
    dataflow into each challenge derivation: every value the verifier will later
    use in a check must be reachable, in the dataflow sense, from the challenge's
    input. The claim is that this criterion accepts exactly the instantiations
    with no certificate in the enumeration — or, if it does not, that its false
    accepts and false rejects are few and characterizable, which is the honest and
    still-useful outcome.
  mechanism: >-
    Instrument the transform so that each challenge's input is a declared set of
    values with provenance. The criterion computes, for each verifier check, the
    set of values it depends on, and requires that set to be contained in the
    inputs of every challenge the check's soundness relies on. Containment failure
    is a rejection.
  why_not_a_renamed_known_approach: >-
    Taint and dataflow analysis are standard program-analysis techniques. Casting
    Fiat-Shamir soundness as a containment property over verifier-check
    dependencies, and SCORING that criterion against constructive forgeries rather
    than against intuition, is the research content — and the negative outcome is
    publishable.
  predictions:
  - observable: false accepts of the criterion against the certificate enumeration
    metric: count
    predicted: >-
      Zero for the enumerated single-element omissions. Any false accept is the
      most valuable output of this record, since it identifies a soundness
      dependency the dataflow view does not see.
  - observable: false rejects on instantiations with no certificate
    metric: count and characterization
    predicted: Nonzero -- the criterion is expected to be conservative, and the shape of its conservatism is what a practitioner needs to know.
  minimal_test: >-
    Implement the criterion, run it over every instantiation in the enumeration,
    report both error counts, and characterize each error case.
  controls:
  - 'GROUND-TRUTH CONTROL: scoring uses the constructive certificates from IDEA-20260809-792aca, not judgement about which instantiations look safe.'
  - 'PROTOCOL-DIVERSITY CONTROL: the criterion is scored on at least two structurally different reference protocols, since a criterion tuned to one protocol''s shape is not a criterion.'
  falsification_conditions:
  - The criterion has false accepts that cannot be repaired without protocol-specific special cases.
  - The criterion rejects every realistic instantiation, making it useless in practice.
  interpretation_limits: >-
    A criterion scored against an enumeration is validated on that enumeration
    only. It is not a soundness proof for any protocol and may never be presented
    as one, and it is scored on reference implementations exclusively.
  sota_delta: >-
    Delta: a mechanical check where the field relies on review, with its error
    profile measured rather than asserted. If the criterion fails, the failure
    characterizes why the property resists mechanization, which is equally useful.
  dominated_by: Downstream of IDEA-20260809-792aca; not dominated by any corpus record.
  estimated_cost: Implementation medium to high; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for dataflow / static criterion: no records. WEB NOT CHECKED.'
  source_refs:
  - Fiat-Shamir soundness references -- RECALLED, REQUIRED READS.
