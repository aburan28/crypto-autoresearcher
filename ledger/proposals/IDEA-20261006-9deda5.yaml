idea:
  id: IDEA-20261006-9deda5
  question_id: RQ-CANL-63098f
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Doubling-denominator size on the integer model y^2 = x^3 + 1 against
    y^2 = x^3 + x + 1
  class: control
  claim: >-
    Let E_cm be the integer model y^2 = x^3 + 1 and let E_gen be the
    integer model y^2 = x^3 + x + 1. Reduce both modulo 13. For each
    affine point over F_13 that is not 2-torsion, lift x and y to
    integers in {0, 1, ..., 12} and form the doubling slope over Q.
    Let H be the maximum of the absolute values of the denominators of
    those slopes, written in lowest terms. The prediction is
    13 * H(E_cm) >= H(E_gen). A strictly smaller left side is a
    negative. This is a denominator proxy for the height that makes
    Xedni fail, not a Néron-Tate height and not a lift attack. No
    discrete logarithm is computed, and the generic-group exponent 1/2
    is unchanged.
  mechanism: >-
    PAIR (representation, Sigma): the representation is the denominator
    of the doubling slope on the naive integer model. Sigma is the
    chord-and-tangent double of one lifted point, not translation on
    E(F_13). Trichotomy class: coordinate-dependent, because the slope
    is a coordinate formula and discards the point at infinity. The
    projection keeps the largest denominator and discards the numerator
    and the y-coordinate of 2P. Many points can share one denominator,
    so the projection is lossy. It is not a block system of the
    translation group. Two explanations are separated before the
    maximum. Explanation A: complex multiplication does not shrink this
    denominator by more than one factor of 13, so the quantity that
    makes Xedni fail is not improved on this CM model. Explanation B:
    13 * H(E_cm) is strictly less than H(E_gen), so the CM model is
    smaller in this proxy. KR-IC-cd159a, opened, says Xedni succeeds
    with negligible probability. This comparison does not claim a
    successful lift. No factor base is built.
  novelty_status: unverified
  citations:
    - ref: KR-IC-cd159a
      provenance: internal
      claim: >-
        Silverman's xedni calculus was shown by
        Jacobson-Koblitz-Silverman-Stein-Teske to succeed with
        negligible probability. Lifting-based ECDLP approaches inherit
        that obstruction.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-cd159a.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs a square-root number of group
        operations. This proxy does not beat that bound.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: RQ-CANL-63098f
      provenance: internal
      claim: >-
        The question asks whether CM on the canonical lift changes the
        height quantity that makes Xedni fail. The question names that
        quantity as canonical height of order N.
      verified_by: ledger/questions/RQ-CANL-63098f.yaml
  assumptions:
    - The integer model is the same equation, not a p-adic canonical lift. Calling H a Néron-Tate height is invalid.
    - A point with y divisible by 13 is skipped. If every point is skipped, H is undefined and the comparison is refused.
    - E_cm has j-invariant 0 modulo 13 and is ordinary. E_gen has j-invariant neither 0 nor 1728 and is ordinary.
  proof_search_map:
    bottleneck: >-
      Whether the CM integer model shrinks the largest doubling
      denominator by more than a factor of 13.
    baseline_embedding:
      parameter_slice: >-
        Two integer models and one prime, p = 13. No point is lifted to
        a global rank computation.
      reproduction_check: >-
        The slope of a doubled point, reduced modulo 13, matches the
        group-law double on the reduced curve. A mismatch invalidates H.
    observation_collision:
      observable: the integer 13 * H(E_cm) - H(E_gen)
      distinct_preimage_search: >-
        Two non-isomorphic models can share a denominator. A negative
        value of that integer is the collision that kills explanation A.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          E_gen, the non-CM integer model at the same prime, paired with
          E_cm.
        predicted_gain: >-
          One inequality of two positive integers. No exponent.
    quantifier_order: >-
      At p = 13, for these two models, 13 * H(E_cm) is at least
      H(E_gen), when both maxima are defined. This is not every CM
      discriminant.
    method_ceiling:
      strongest_certifiable_claim: >-
        This denominator proxy does not shrink under the CM model by
        more than a factor of 13, or it does.
      nearby_object_control: >-
        E_gen. If H(E_gen) is undefined, there is no comparison.
    proof_obligations:
      - claim: both reduced models are ordinary
        responsibility: baseline
      - claim: each retained slope reduces to the group-law double
        responsibility: correctness
      - claim: 13 * H(E_cm) >= H(E_gen)
        responsibility: strictness
    not_applicable_reason: >-
      No exponent is claimed. The map is still filled for this pair.
  predictions:
    - metric: 13 * H(E_cm) - H(E_gen)
      direction: higher
      minimum_effect: at least 0
    - metric: number of non-2-torsion points contributing a slope on each model
      direction: higher
      minimum_effect: at least 1 on each model
  minimal_test:
    design: >-
      Enumerate x in 0 through 12. Keep a point when the right-hand side
      is a nonzero square modulo 13. Lift to integers in that range.
      Compute lambda = (3 x^2 + A) / (2 y) over Q in lowest terms.
      H is the maximum absolute denominator. Compare 13 * H(E_cm) with
      H(E_gen). Check one doubled point on each model against the
      group law modulo 13. Do not search for a dependence among lifted
      points and do not run Xedni.
    controls:
      - At least one retained slope on each model reduces modulo 13 to the group-law double. Otherwise H is invalid.
      - j(E_gen) modulo 13 is neither 0 nor 1728.
      - A model with trace divisible by 13 is not scored.
      - If either H is undefined, the comparison is refused.
    required_metrics:
      - H_cm
      - H_gen
      - point_count_cm
      - point_count_gen
      - j_gen
      - trace_cm
      - trace_gen
  falsification_conditions:
    - 13 * H(E_cm) is strictly less than H(E_gen), with both H defined.
    - Either model has no retained slope.
    - A retained slope does not match the group law modulo 13.
    - Either model is singular or supersingular, or j(E_gen) is 0 or 1728.
  confounders:
    - The representative y in 0 through 12, rather than the negative residue, changes the integer slope. The same nonnegative lift is used on both models.
    - A p-adic canonical lift can move denominators that this naive model does not see. The claim does not call H a canonical height.
  interpretation_limits:
    - A denominator ratio is not a successful Xedni lift and does not contradict KR-IC-cd159a.
    - No discrete logarithm is computed. The exponent 1/2 is unchanged.
    - The scope is these two models at p = 13.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On a random integral short-Weierstrass model with coefficients
        in {0, 1}, the largest doubling denominator of the nonnegative
        lifts of the F_p-points is not smaller on the CM model
        y^2 = x^3 + 1 than on y^2 = x^3 + x + 1 by more than a factor
        p. This imitates a uniform denominator up to size O(p). It is
        not the Néron-Tate height machine.
      rigorous_support: >-
        KR-IC-cd159a, opened, says xedni succeeds with negligible
        probability because of the height obstruction, and it does not
        evaluate this denominator at p = 13.
      validation_plan: >-
        At this pair, record H(E_cm) and H(E_gen). If 13 * H(E_cm) is
        strictly less than H(E_gen), H1 is false at p = 13. If either
        maximum is undefined, refuse the comparison. No second prime
        and no claim that the proxy equals the Néron-Tate height.
  target_complexity:
    time_exponent: >-
      Two passes over 13 field elements. The generic-group exponent
      1/2 is unchanged.
    memory_exponent: O(1) integers of size at most a small power of 13
    best_known: >-
      KR-IC-cd159a, opened, says xedni fails with negligible success
      probability. KR-RHO-13bf67, opened, gives the square-root generic
      bound. This proxy beats neither.
    hidden_overhead: >-
      The proxy is not the canonical height. That gap is stated in the
      claim and is not hidden in an o(1) term.
    tradeoff_note: >-
      No time-memory tradeoff. No p-adic precision parameter is used.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-cd159a
      - KR-RHO-13bf67
      - KR-IC-5931ee
    nearest:
      - ref: KR-IC-cd159a
        provenance: internal
        relation: adjacent
        delta: >-
          The opened row says xedni succeeds with negligible
          probability. This idea adds one inequality,
          13 * H(E_cm) >= H(E_gen), for a denominator proxy at p = 13.
          It does not claim a lift that finds a dependence, and the
          square-root exponent is unchanged.
  dominated_by: >-
    KR-IC-cd159a dominates any reading of this denominator as an attack,
    because the opened row already says xedni succeeds with negligible
    probability. Pollard rho, at the square-root exponent in
    KR-RHO-13bf67, dominates the same reading. The proxy does not beat
    either baseline.
  sota_delta: >-
    No exponent is derived. The quantitative delta is the integer
    13 * H(E_cm) - H(E_gen), predicted at least 0, at the prime 13.
    The generic-group exponent stays 1/2.
