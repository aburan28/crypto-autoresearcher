idea:
  id: IDEA-20260815-af4007
  question_id: RQ-SSI-001
  added: '2026-08-15'
  title: >-
    THE SIDH BREAK NEEDED TORSION IMAGES OF KNOWN DEGREE; ENUMERATE WHICH
    POST-SIDH SCHEMES STILL PUBLISH BOTH, AS A STANDING SURFACE AUDIT RATHER
    THAN A PER-SCHEME REACTION
  class: control

  claim: >-
    Kani-based recovery needs a secret isogeny of known degree plus its
    action on a torsion basis of modulus exceeding that degree. Post-SIDH
    designs each argue they withhold one of the two. No record enumerates
    the condition pair across the whole family and checks each design
    against it uniformly, so every new scheme is audited ad hoc.

  mechanism: >-
    State the two conditions precisely. For each post-SIDH design in the
    corpus, extract what is published about degree and torsion action, and
    mark each condition met, withheld, or unclear. Report the unclear cases
    as the audit's actual output.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of KN-TECH-3b593f route 2 and KN-OPEN-015; grep for 'torsion
      image' (33), 'Kani' (81), 'published-data surface'.
    results: >-
      The condition pair is recorded and applied to prime-field ECDLP in
      KN-TECH-3b593f; GOAL-SQISIGN-002 audits one design. No uniform
      cross-family enumeration exists.
    verdict: >-
      ADAPTATION. The criterion is established; the contribution is
      applying it uniformly and surfacing the unclear cases.

  object_first_candidate:
    tracked_object: >-
      THE PUBLISHED-DATA SURFACE of each design, indexed by the two Kani
      preconditions.
    lossiness: >-
      Reducing a design to two bits is deliberately lossy and is what
      makes a uniform comparison possible.
    propagation: >-
      Not applicable; this record proposes no tracked object propagating
      under a group law.
    survival_score: >-
      Survives while design specifications are available; designs whose
      published data is ambiguous are the audit's real content.

  null_object_control: >-
    NULL 1 -- SIDH itself, which must be marked as meeting both conditions;
    failure means the criterion is misapplied. NULL 2 -- CSIDH, which must
    not, since it publishes no torsion images.

  discriminated_from:
    - >-
        KN-TECH-3b593f. THAT APPLIES the criterion to prime-field ECDLP
        and closes it; this applies the same criterion across the isogeny
        design family.
    - >-
        GOAL-SQISIGN-002, which audits one design in depth; this is a
        shallow uniform pass whose purpose is to find which designs
        deserve that depth.

  assumptions:
    - >-
        Design specifications state what is published precisely enough to
        classify. Where not, the design is marked unclear rather than
        assumed safe.
    - >-
        The two conditions are jointly necessary for Kani recovery, as
        recorded; this is inherited from KN-TECH-3b593f and not re-
        derived.

  predictions:
    - metric: >-
        SIDH and CSIDH controls
      direction: different
      minimum_effect: >-
        FORCED: SIDH meets both, CSIDH does not. Failure means the
        criterion is misapplied and the audit is void.
    - metric: >-
        count of designs marked unclear
      direction: different
      minimum_effect: >-
        The deliverable; a large count means the family's published-data
        surface is not well documented.
    - metric: >-
        designs meeting both conditions
      direction: different
      minimum_effect: >-
        Any such design needs immediate independent review, not a note
        in a table.

  minimal_test:
    design: >-
      Symbolic classification of the designs already in the corpus, with
      both controls run first.
    controls:
      - >-
          SIDH positive control.
      - >-
          CSIDH negative control.
      - >-
          Unclear cases listed, never defaulted to safe.
    required_metrics:
      - >-
          Per-design classification of both conditions with the cited
          specification text.
      - >-
          Count of unclear cases.
      - >-
          Control outcomes.

  falsification_conditions:
    - >-
        A control misclassifies. Criterion misapplied; audit void.
    - >-
        Most designs are unclear. The audit cannot conclude and reports
        that instead.
    - >-
        A design meets both conditions. Route to independent review
        immediately.

  confounders:
    - >-
        SPECIFICATION DRIFT: designs change between rounds and an audit
        against a stale specification is worse than none.
    - >-
        SAFE-BY-DEFAULT BIAS: marking an ambiguous design safe is the
        specific error that would make this audit harmful.

  interpretation_limits:
    - >-
        Classifies published data only; says nothing about a design's
        security.
    - >-
        Inherits the two-condition criterion without re-deriving it.

  heuristic_assumptions:
    - id: HEUR-SSI-KANI-1
      statement: >-
        A post-SIDH design is exposed to Kani-style recovery only if it
        publishes both a secret isogeny of known degree and its action
        on a sufficiently large torsion basis.
      rigorous_support: >-
        The rigorous ingredient is Kani's lemma and the embedding
        construction used by the SIDH attacks, as recorded in KN-
        TECH-3b593f. THE GAP: necessity is not proved -- later work
        could relax either condition, and the audit would then be
        classifying against an obsolete criterion.
      falsification_condition: >-
        A published recovery not requiring both conditions.
      validation_plan: >-
        SAMPLE: every post-SIDH design in the corpus. COMPARISON:
        classification against the criterion, with controls. TAIL CHECK:
        designs marked unclear, reported individually. TRANSFER: none;
        each design is classified separately.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic classification only.
    memory_exponent: >-
      Negligible.
    best_known: >-
      The incumbent is per-design analysis in the isogeny literature,
      which is deeper and non-uniform; this record adds only uniformity.
    hidden_overhead: >-
      A classification table invites being read as a security verdict,
      which it is not.
    tradeoff_note: >-
      A shallow uniform pass buys comparability and forfeits depth; it is
      a triage instrument, not an analysis.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    frontier row applies. As analysis: dominated by per-design work in the
    literature. As a uniform triage: none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a uniform two-condition
    classification across the post-SIDH family, and an explicit list of
    designs whose published-data surface cannot be classified from their
    specifications.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that controls classify correctly. 0.4 that most designs classify
    cleanly; I expect a substantial unclear set, which is itself the useful
    output. 0.05 that any current design meets both conditions.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
