idea:
  id: IDEA-20260809-87c235
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CLGRP-66ab7f
  goal_id: GOAL-CLGRP-001
  title: >-
    Search directly for low-order elements at DEPLOYED discriminant sizes — this
    is cheap, decidable, and nobody has to solve anything hard to do it
  class: measurement
  claim: >-
    Testing whether a specific group contains findable elements of small order
    does not require computing the class group: candidate elements can be
    constructed from the discriminant's structure and their orders verified by
    direct composition. The claim is that this check runs at DEPLOYED discriminant
    sizes in seconds, that it is a decidable structural property rather than an
    estimate, and that it is the one thing in this goal that can be evaluated at
    real parameters without any extrapolation at all.
  mechanism: >-
    Construct candidate low-order elements from ambiguous forms and from any
    structure the discriminant exposes, then verify order by composition. Absence
    of findable low-order elements within the constructed class is recorded as
    absence within that class, with the class stated.
  why_not_a_renamed_known_approach: >-
    The construction of two-torsion from ambiguous forms is classical. Running it
    as a direct check AT DEPLOYED SIZES — where every other question in this goal
    requires extrapolation — is the opportunity, and it converts one assumption
    from estimated to checked.
  predictions:
  - observable: findable low-order elements at deployed discriminant sizes
    metric: count within the declared construction class
    predicted: >-
      Zero for discriminants chosen with the standard countermeasure, since that
      is what the countermeasure is for. A nonzero count would be a significant
      structural finding requiring independent re-verification and, if confirmed,
      disclosure before publication.
  - observable: runtime of the check at deployed sizes
    metric: seconds
    predicted: Seconds; if it is not fast, the check is not the cheap decidable property claimed and the record says so.
  minimal_test: >-
    Run the construction and order verification at several deployed-size
    discriminants generated by this program according to published rules, and
    report counts and runtimes with the construction class stated.
  controls:
  - 'POSITIVE CONTROL: a deliberately chosen discriminant lacking the countermeasure must yield low-order elements, proving the check has power at these sizes.'
  - 'SELF-GENERATED PARAMETERS: all discriminants are generated by this program from published rules; no third-party deployment parameter is probed or evaluated.'
  falsification_conditions:
  - The positive control yields nothing, meaning the check lacks power and its negative results are uninformative.
  - The construction class cannot be stated precisely, in which case absence cannot be scoped and must not be reported as absence.
  interpretation_limits: >-
    Absence within a declared construction class is not absence of low-order
    elements. This limit is stated in the same sentence as any negative result.
  sota_delta: 'No attack. Delta: one assumption checked at real parameters rather than extrapolated -- rare in this goal and in the program generally.'
  dominated_by: Complements IDEA-20260809-83cbc7, which enumerates cases at small sizes; not dominated by any corpus record.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for low-order assumption: no records. WEB NOT CHECKED.'
  source_refs:
  - Low-order and adaptive-root assumption references -- RECALLED, REQUIRED READS.
