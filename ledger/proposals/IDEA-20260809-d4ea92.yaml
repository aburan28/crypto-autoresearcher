idea:
  id: IDEA-20260809-d4ea92
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-HYBRID-cdf2b2
  goal_id: GOAL-HYBRID-001
  title: >-
    State the protocol-level rescue argument precisely enough that the settings
    where it does NOT apply become a list
  class: composition
  claim: >-
    The standard response to combiner binding concerns is that the surrounding
    protocol hashes the full transcript, so binding at the combiner level is
    unnecessary. The claim is that this argument has explicit preconditions —
    which values enter the transcript hash, at what point the derived secret is
    used, whether any use precedes transcript binding — and that stating them
    yields an enumerable list of settings where the rescue does not apply, which
    is what a designer reusing a combiner outside that protocol needs.
  mechanism: >-
    Write the argument as a chain of conditions on the surrounding protocol; for
    each condition, construct a minimal abstract setting violating it and show,
    with a certificate against this program's own reference composition, that the
    binding failure becomes observable there.
  why_not_a_renamed_known_approach: >-
    The rescue argument is made informally in design discussions. Making its
    preconditions explicit and exhibiting a violating setting for each is the
    contribution, and it is the difference between "usually fine" and a stated
    scope.
  predictions:
  - observable: number of distinct preconditions in the argument
    metric: count
    predicted: Small -- two to four. A long list would mean the rescue is fragile, which would be a significant finding for anyone reusing these combiners.
  - observable: constructibility of a violating setting per precondition
    metric: boolean per precondition
    predicted: Constructible for each; a precondition with no constructible violation is either redundant or implied by another, and the record says which.
  minimal_test: >-
    Enumerate the preconditions from filed text, build a minimal reference
    composition for each violation, and produce a certificate showing the binding
    failure becoming observable.
  controls:
  - 'RESCUE-INTACT CONTROL: with every precondition satisfied, no certificate may be produced, confirming the argument holds where it claims to.'
  - 'PASSAGE CITATION for each precondition attributed to a specification; reconstructed preconditions are labelled as this program''s.'
  falsification_conditions:
  - A certificate is produced with all preconditions satisfied, contradicting the rescue argument.
  - Preconditions cannot be stated precisely from filed text, in which case the record reports the argument as informally specified.
  interpretation_limits: >-
    Violating settings are abstract reference compositions built for this
    analysis, not descriptions of any real protocol. No deployed protocol is
    claimed to violate any precondition.
  sota_delta: 'Delta: an explicit scope for an argument that currently circulates as a reassurance.'
  dominated_by: Downstream of IDEA-20260809-c48d6a; not dominated by any corpus record.
  estimated_cost: Implementation medium; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for transcript binding: no records. WEB NOT CHECKED.'
  source_refs:
  - TLS 1.3 key schedule and the hybrid drafts -- REQUIRED READS.
