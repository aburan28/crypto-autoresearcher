idea:
  id: IDEA-20260901-8e3a59
  question_id: RQ-SHAONE-081e3a
  research_question: RQ-SHAONE-081e3a
  goal_id: GOAL-SHA1-001
  added: '2026-09-01'
  title: >-
    THE EFFECTIVE PER-BLOCK COST EXPONENT IS c MINUS f, AND f IS BOUNDED BY THE
    MATCHING NUMBER OF THE NEUTRAL-BIT-TO-CONDITION DEPENDENCY GRAPH: make that
    bipartite graph the tracked object, compute its matching number as a
    compute-free predictor of the free degrees of freedom, and measure at MD5 and
    reduced-step scale whether the achieved free freedom equals the matching
    number (a structural, predictable exponent) or falls short of it (a measured
    correlation deficit the standard "each neutral bit halves the cost" accounting
    omits).
  class: mechanism
  claim: >-
    FIVE SEPARABLE CLAIMS. (A) THE EXPONENT. The expected cost of one
    near-collision block is 2^{c-f} compression-function evaluations, where c is
    the number of uncontrolled sufficient conditions remaining after message
    modification forces the early ones, and f is the number of INDEPENDENT free
    degrees of freedom (neutral bits, tunnels) usable to generate fresh candidate
    continuations from one base solution without re-solving the early rounds. c-f
    is the per-block cost exponent, and both terms are properties of the chosen
    disturbance vector and its message-modification schedule. (B) THE OBJECT AND
    ITS BOUND. Define the bipartite dependency graph G with left vertices the
    candidate neutral bits (message-freedom bits that do not disturb an
    already-satisfied early condition) and right vertices the uncontrolled
    conditions, with an edge when flipping that bit can re-randomize that
    condition. The usable free freedom f is bounded above by the maximum matching
    number nu(G): a set of neutral bits can independently re-randomize at most nu
    distinct conditions, because two bits matched to the same condition do not add
    independent freedom. nu(G) is computable in polynomial time from the
    first-order (linearized) propagation, at zero cryptographic compute. (C) THE
    DISCRIMINATION. At MD5 and reduced-step scale where the block search runs end
    to end, measure the achieved f (the log2 of independent low-cost continuations
    per base solution before condition satisfaction correlates) and compare to
    nu(G). If measured f equals nu(G), the per-block exponent c-nu is a STRUCTURAL,
    compute-free predictor of search cost -- a cost model that needs no search to
    evaluate. If measured f is strictly below nu(G), higher-order carry
    interactions couple the neutral bits, and the deficit nu-f is a measured
    correlation correction that the standard degrees-of-freedom accounting
    (KN-TECH-066), which effectively assumes f equals the raw neutral-bit count,
    omits. (D) WHAT IS NOT CLAIMED: no attack, no new collision, no SHA-1 cost
    figure, no claim that any published per-block cost is wrong; a matching number
    and a deficit measured on an analogue are statements about that analogue's
    search dynamics. (E) A result showing f equals nu(G) is fully valuable: it
    licenses a compute-free per-block cost predictor for this search family, which
    is currently an untested assumption in this repository.
  mechanism: >-
    STAGE 1: fix a reduced-step SHA-1 (and an MD5 instance via GOAL-MD5-001's
    pipeline) with a declared disturbance vector and message-modification schedule
    at a scale where the full-freedom (base) per-block cost 2^c is directly
    measurable. STAGE 2: construct G. For each candidate neutral bit, compute, by
    first-order (linearized) difference propagation, the set of uncontrolled
    conditions it can toggle without disturbing an already-satisfied early
    condition; this is the bit's adjacency in G. STAGE 3: compute nu(G) by a
    standard bipartite maximum-matching algorithm, and also the maximum set of
    bits that pairwise toggle disjoint condition sets (a proxy for fully
    independent freedom), reporting both. STAGE 4: measure achieved f empirically:
    from many base solutions, count how many independent conforming continuations
    are generated per base before the marginal continuation's condition
    satisfaction becomes correlated with earlier ones (detected as a departure of
    the continuation success rate from the independent-Bernoulli prediction), and
    take f as its log2. STAGE 5: compare measured f to nu(G) and to the raw
    neutral-bit count, and report the two deficits (raw-count minus nu, and nu
    minus measured f); the first is the structure the matching captures, the
    second is the residual correlation the matching misses. STAGE 6, null control:
    build a synthetic condition chain whose conditions are placed to have NO
    first-order dependency on the neutral bits (later-word conditions with no data
    path from the freedom bits), whose G is by construction a perfect matching; the
    measured f there must equal nu(G), validating that any deficit in the real arm
    is genuine correlation and not an instrument artifact.
  novelty_status: unverified
  citations:
    - ref: KN-TECH-066
      provenance: internal
      claim: >-
        Message modification spends message freedom to force early expensive
        conditions deterministically; the neutral-bit technique varies bits that
        do not disturb already-satisfied early conditions to generate cheap
        candidate continuations. Freedom degrees are finite and the count belongs
        in the claim.
      verified_by: Read in full this session.
    - ref: KN-LIT-5099
      provenance: kb
      claim: >-
        OJLCA determines the maximum success probability and the smallest set of
        message conditions attaining it, folding dependencies among local
        collisions -- the correct reference for the uncontrolled-condition count c.
      verified_by: Read the corpus entry (title/abstract level) this session.
    - ref: eprint 2006/105 (Klima, Tunnels in Hash Functions)
      provenance: recalled
      claim: >-
        RECALLED, NOT OPENED. Tunnels are structured neutral bits providing extra
        free degrees of freedom in MD5 collision search via first-round selective
        functions; the archetype of the freedom bits G's left vertices represent.
      verified_by: null
  novelty_screen:
    method: >-
      Filesystem and ledger screening only; the crypto-kb MCP index is empty and
      was not callable. Read RQ-SHAONE-081e3a and GOAL-SHA1-001 in full, and the
      claim blocks of all 18 existing RQ-SHAONE proposals. Read in full
      IDEA-20260816-ade53e (abort-depth tail distribution), IDEA-20260828-521e40
      (per-worker resident-state footprint versus neutral-bit budget),
      IDEA-20260816-389b1b (hardware efficiency coefficient), and KN-TECH-066.
    results: >-
      IDEA-20260816-ade53e measures the abort-depth DISTRIBUTION and its tail to
      test whether per-block cost is geometric; it treats the search dynamically
      but has no dependency graph and no matching number, and does not decompose
      the exponent into c minus f. IDEA-20260828-521e40 measures the MEMORY
      footprint of the neutral-bit table as a function of the neutral-bit budget b,
      an occupancy/resource question, and explicitly treats b as a declared budget
      rather than deriving the USABLE free freedom from a dependency structure.
      IDEA-20260816-389b1b measures throughput efficiency, unrelated. No corpus
      record models the neutral-bit-to-condition dependency as a bipartite graph
      or uses its matching number to predict the effective cost exponent.
    verdict: >-
      UNVERIFIED. Degrees-of-freedom accounting and neutral bits/tunnels are
      standard (KN-TECH-066, Klima recalled), so the ingredients are known. What
      is not in any committed record is the specific object -- the bipartite
      dependency graph and its matching number as an upper bound on and predictor
      of the usable free freedom f, with the nu-minus-f deficit as a measured
      correlation correction. No external primary source was opened; unverified is
      the honest label.
  object_first_candidate:
    tracked_object: >-
      THE BIPARTITE NEUTRAL-BIT-TO-CONDITION DEPENDENCY GRAPH G AND ITS MATCHING
      NUMBER nu(G), followed as the message-modification schedule is applied.
      Established families declared OFF-LIMITS as the primary lens: the abort-depth
      tail distribution; the resident-memory footprint; the raw degrees-of-freedom
      count. This record follows the STRUCTURE that determines how much of the raw
      freedom is usable, not the freedom count and not the search's timing.
    lossiness: >-
      PASSES THE LOSSY-PROJECTION TEST. The projection retains, per neutral bit,
      only the SET of conditions it can toggle (its adjacency in G), discarding the
      bit's identity, the message words, and all internal state. It is compatible
      with the target operation to FIRST ORDER: under linearized difference
      propagation the toggled-condition set is determined by the bit and the DV
      alone, so the adjacency propagates deterministically. What is discarded --
      the higher-order carry interactions -- is EXACTLY what can make measured f
      fall below nu(G), so the lossiness is not a defect but the very quantity the
      record measures. It is not a change of coordinates because G collapses the
      full message freedom to an incidence structure whose matching number is a
      single integer.
    propagation: >-
      One step of the target operation is applying one neutral bit to a base
      solution. It acts on G by consuming that left vertex and, to first order,
      freeing the conditions it is matched to; a maximum matching is the largest
      set of such steps that free distinct conditions. The achieved f is measured
      as the point at which further steps stop freeing distinct conditions -- i.e.
      where the empirical propagation departs from the first-order graph.
    survival_score: >-
      Survives while first-order linearization is faithful, which is the early- to
      middle-round region where message modification operates. Dissolves where
      carries couple neutral bits strongly (late rounds, high-weight regions),
      at which point nu(G) overpredicts f and the graph must be augmented with
      measured higher-order edges or abandoned as a predictor -- a boundary the
      nu-minus-f deficit locates quantitatively.
  proof_search_map:
    bottleneck: >-
      Whether the usable free freedom f in a near-collision-block search is
      predicted by the matching number nu(G) of the neutral-bit-to-condition
      dependency graph. Removing this replaces the untested raw-count degrees-of-
      freedom assumption with a compute-free structural predictor of the per-block
      cost exponent, or measures exactly how far that predictor is optimistic.
    baseline_embedding:
      parameter_slice: >-
        The full-freedom base case (no neutral bits applied) must reproduce the
        measured per-block cost 2^c, and a synthetic no-dependency chain must
        reproduce f equal to nu(G) exactly.
      reproduction_check: >-
        Frozen fixtures: the base-case cost 2^c measured directly, and the
        synthetic no-dependency null giving f equal to its (perfect) nu. A miss on
        the null means the f-measurement instrument is biased and the run halts.
    observation_collision:
      observable: >-
        The matching number nu(G) and the measured free freedom f.
      distinct_preimage_search: >-
        Two distinct dependency graphs with equal nu but different measured f would
        show nu is not sufficient to predict f; searching for such a pair across
        DVs and schedules is the direct test of the object's adequacy, and finding
        one is a useful negative that refines the object toward a higher-order
        incidence structure.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Recast usable freedom as a bipartite matching in the first-order
          incidence structure, with encoding (adjacency from linearized
          propagation), soundness (f at most nu, argued from independence of
          matched conditions), and cost-loss (the nu-minus-f deficit) as separate
          obligations.
        predicted_gain: >-
          Converts an empirical "how many neutral bits actually help" question
          into a polynomial-time graph computation with a measured correction
          term.
    quantifier_order: >-
      EXPLICIT. Upper-bound form: for ALL usable neutral-bit sets, the independent
      free freedom is at most nu(G) -- a bound argued structurally. Predictor
      form: there EXISTS a regime (early/middle rounds, first-order faithful) in
      which measured f equals nu(G); the record measures the boundary of that
      regime rather than asserting it universally.
    method_ceiling:
      strongest_certifiable_claim: >-
        That f is at most nu(G) always, and equals it within the first-order
        regime on the tested analogues. It cannot certify the per-block cost of
        full SHA-1, nor that nu(G) predicts f outside the first-order regime, nor
        anything about the detector or a deployed system.
      nearby_object_control: >-
        A DV/schedule whose neutral bits are known to interact strongly (a
        high-weight late region): the method must report f well below nu(G) there,
        and a method that still predicts f equal to nu has not captured the
        load-bearing higher-order structure.
    proof_obligations:
      - claim: f is at most nu(G) for any usable neutral-bit set.
        responsibility: correctness
      - claim: nu(G) is computed in polynomial time from first-order propagation.
        responsibility: runtime
      - claim: The synthetic no-dependency null yields f equal to nu.
        responsibility: baseline
      - claim: Scope is the tested analogues, DVs, and the first-order regime.
        responsibility: scope
    not_applicable_reason: null
  assumptions:
    - >-
      A reduced-step SHA-1 and an MD5 instance can be run end to end so that per-
      block cost and per-base continuation counts are directly measurable.
    - >-
      First-order (linearized) difference propagation gives a faithful adjacency
      for G in the early/middle rounds; where it does not, the deficit measures
      the failure rather than the assumption being hidden.
    - >-
      The empirical detector of "correlation onset" (departure from independent-
      Bernoulli continuation success) is validated on the synthetic null before it
      is trusted on the real arm.
  predictions:
    - metric: >-
        free_freedom_bound_check: measured f versus nu(G)
      direction: lower
      minimum_effect: >-
        f must be at most nu(G) in every cell (a measured f above nu falsifies the
        graph or the instrument). The reported quantity is the deficit nu minus f.
    - metric: >-
        exponent_prediction_error: measured log2(per-block cost) versus predicted
        c minus nu(G)
      direction: different
      minimum_effect: >-
        Within a pre-declared factor in the first-order regime; a systematic
        underprediction (real cost higher than 2^{c-nu}) is the correlation-deficit
        signature and its size is the deliverable.
    - metric: >-
        null_arm_match: measured f versus nu(G) on the synthetic no-dependency
        chain
      direction: different
      minimum_effect: >-
        Must be equal within measurement error; a deficit here means the
        instrument is biased and no real-arm deficit is admissible.
    - metric: >-
        raw_count_overcount: raw neutral-bit count minus nu(G)
      direction: higher
      minimum_effect: >-
        Expected positive (the graph captures structure the raw count ignores);
        if zero, the matching adds nothing over counting and the object is a
        change of coordinates for these DVs, which the record would state plainly.
  minimal_test:
    design: >-
      SIX STEPS at reduced-step SHA-1 and MD5 scale. STEP 1: measure the base-case
      per-block cost 2^c directly. STEP 2: build G by first-order propagation and
      compute nu(G) and the raw neutral-bit count. STEP 3: run the synthetic
      no-dependency null and confirm measured f equals nu (instrument validation,
      blocking). STEP 4: measure achieved f on the real DV/schedule via
      independent-continuation counting with correlation-onset detection. STEP 5:
      report measured f versus nu versus raw count, the two deficits, and the
      per-block exponent prediction error. STEP 6: repeat on a second DV known to
      have strongly interacting neutral bits (nearby-object control) and confirm
      the larger deficit there.
    controls:
      - >-
        SYNTHETIC NO-DEPENDENCY NULL (blocking): conditions with no first-order
        path from the neutral bits, whose G is a perfect matching; measured f must
        equal nu or the instrument is biased.
      - >-
        BASE-CASE FIXTURE: the no-neutral-bit per-block cost 2^c, measured
        directly.
      - >-
        NEARBY-OBJECT CONTROL: a strongly-interacting DV where f must fall well
        below nu.
      - >-
        RAW-COUNT REFERENCE: the raw neutral-bit count reported alongside nu so the
        matching's added value is visible.
    required_metrics:
      - measured f, nu(G), and raw neutral-bit count per cell
      - the two deficits (raw minus nu, nu minus f)
      - per-block exponent prediction error (measured versus c minus nu)
      - synthetic-null f-versus-nu agreement
      - correlation-onset detector calibration on the null
      - artifact manifest with seeds, DV/schedule declarations, and rebuild receipt
  falsification_conditions:
    - >-
      Measured f exceeds nu(G) in any cell. The upper-bound claim is false or the
      instrument is broken; the graph model is refuted for that DV until the edge
      definition is corrected.
    - >-
      On the synthetic no-dependency null, measured f does not equal nu. The
      f-measurement is biased and no real-arm deficit is admissible. Blocking gate.
    - >-
      Measured f equals nu(G) across all tested cells including the strongly-
      interacting nearby object. Then c minus nu is a clean compute-free per-block
      cost predictor over the tested range -- the positive outcome -- and the
      correlation-correction hypothesis is falsified, which is itself a useful,
      reportable result licensing the predictor.
    - >-
      raw-count minus nu is zero for all tested DVs. The matching captures nothing
      the raw count does not; the object collapses to a change of coordinates for
      these DVs and the record says so.
  confounders:
    - >-
      FIRST-ORDER FIDELITY. The adjacency of G is computed by linearized
      propagation; late-round carries make it optimistic. MITIGATION: the deficit
      nu minus f is the intended measurement of this, and the regime boundary is
      reported rather than assumed.
    - >-
      CORRELATION-ONSET DEFINITION. "When continuations become correlated" is a
      declared statistical threshold; a loose threshold inflates f, a tight one
      deflates it. MITIGATION: the threshold is calibrated on the synthetic null
      and frozen before the real arm is measured.
    - >-
      DV AND SCHEDULE ARE COUPLED. c and the neutral-bit set both depend on the
      message-modification schedule; changing the schedule changes both. MITIGATION:
      the schedule is declared and held fixed within each comparison, and f is
      reported per (DV, schedule) pair.
  interpretation_limits:
    - >-
      Results are scoped to the tested reduced-step SHA-1 and MD5 analogues, the
      declared DVs and schedules, and the first-order regime. No numeric transfer
      to full SHA-1 is made; the deliverable is a structural predictor and its
      measured error, not a SHA-1 cost.
    - >-
      This bounds and predicts a per-block cost exponent term; it is a building
      block for a cost model, not an attack and not a detector statement.
    - >-
      No statement about any deployed system, per RQ claim_tier_ceiling.
  heuristic_assumptions:
    - id: H1
      statement: >-
        USABLE FREEDOM EQUALS MATCHING NUMBER IN THE FIRST-ORDER REGIME. Within
        the rounds where linearized difference propagation is faithful, the number
        of independent free degrees of freedom f satisfies f equals nu(G), and
        equivalently each maximally-matched neutral bit contributes one
        independent factor of 2 to the number of low-cost continuations.
      rigorous_support: >-
        RIGOROUS INGREDIENT: f at most nu(G) is a structural bound -- two neutral
        bits matched only to the same condition cannot independently re-randomize
        two conditions (exact, from the definition of a matching on the incidence
        structure). CLASSICAL STATEMENT IMITATED: independent conditions contribute
        multiplicatively to freedom, so log2(continuations) is additive over a
        matching, mirroring the degrees-of-freedom accounting of KN-TECH-066. THE
        GAP: equality (f equals nu) requires no higher-order coupling, which fails
        in late rounds; the deficit measures the gap.
      validation_plan: >-
        SAMPLE: many base solutions per (DV, schedule) at reduced-step SHA-1 and
        MD5 scale, with at least two DVs (one first-order-clean, one strongly
        interacting) and the synthetic null. SHORTCUT: reduced-step and MD5-scale
        search substitutes for unreachable full SHA-1 and is recorded as a transfer
        assumption. COMPARISON: empirical distribution of independent-continuation
        counts against the geometric/Bernoulli prediction implied by nu(G); measured
        f against nu. TAIL CHECK: the maximum observed independent-continuation
        run against its predicted quantile, since correlation onset shows first in
        the deep tail. TRANSFER: all sampled parameters recorded; no extrapolation
        of the deficit to full SHA-1.
  target_complexity:
    time_exponent: >-
      NO SHA-1 EXPONENT IS CLAIMED OR MOVED; this is an EXPONENT-DECOMPOSITION
      building block. It states the per-block cost exponent as c minus f and
      supplies nu(G) as a compute-free predictor of f, tightening the standard
      raw-count estimate. Its priority rests on being a prerequisite for any
      honest per-block cost model (the other half of the chosen-prefix cost) and
      on being cheap: nu(G) is polynomial-time and the validation runs at MD5 and
      reduced-step scale.
    memory_exponent: >-
      Negligible: G is a small bipartite graph (hundreds of vertices) and the
      matching computation is polynomial-space. No table, no tradeoff on the
      predictor itself; the search it predicts carries its own memory, charged
      elsewhere (IDEA-20260828-521e40, IDEA-20260816-71d4dd).
    best_known: >-
      The standard accounting (KN-TECH-066) treats usable freedom as the raw
      neutral-bit count, an untested upper estimate in this corpus with no
      structural correction and no measured deficit.
    hidden_overhead: >-
      The nu-minus-f deficit is the disclosed overhead the raw count hides; the
      first-order-regime boundary is disclosed and measured.
    tradeoff_note: >-
      Not applicable to the predictor; the predicted search's time-memory position
      is charged in the companion memory-footprint records.
  dominated_by: >-
    CHECKED ACROSS THE FRONTIER. As a SHA-1 attack: n/a (no result claimed) -- no
    collision or cost point offered; null would be a fabrication. As a per-block
    cost-model component: NOT dominated -- the incumbent raw-count degrees-of-
    freedom accounting (KN-TECH-066) and IDEA-20260828-521e40's memory-footprint-
    versus-b curve neither predict f from structure nor measure the correlation
    deficit; this record adds both. As a graph computation: bipartite maximum
    matching is a classical polynomial algorithm, so the METHOD is dominated by
    standard combinatorial optimization, and the record claims only its
    application to the freedom-prediction question.
  sota_delta: >-
    +0 on every SHA-1 attack axis. What it moves, quantitatively and internally:
    the per-block cost exponent term f goes from an unmeasured raw-count estimate
    to a structural predictor nu(G) with a measured correction nu minus f, so a
    cost model can be evaluated WITHOUT running the search, with a stated error
    bar; the corpus gains its first dependency-graph model of near-collision-block
    freedom.
  discriminated_from:
    - >-
      IDEA-20260816-ade53e measures the abort-depth DISTRIBUTION and its tail to
      test the geometric-cost hypothesis; it has no dependency graph and no
      matching number and does not decompose the exponent into c minus f. This
      record predicts f structurally before any search is run.
    - >-
      IDEA-20260828-521e40 measures the MEMORY footprint of the neutral-bit table
      as a function of the neutral-bit budget b; it charges a resource, whereas
      this record derives the USABLE freedom from the graph structure and predicts
      the TIME exponent. The two are complementary (memory versus usable-freedom).
    - >-
      IDEA-20260816-389b1b measures a hardware throughput efficiency coefficient;
      unrelated object (device throughput, not search freedom).
    - >-
      IDEA-20260901-7d0bfd (this wave) maps w*(DV), the uncontrolled-condition
      count c, over the DV code; this record models the OTHER exponent term f and
      its usable fraction. They compose: the per-block exponent is c(DV) minus
      f(DV, schedule).
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.95 that the f-at-most-nu bound holds (it is structural). 0.9 that the
    synthetic null gives f equal to nu (instrument validation). 0.55 that measured
    f equals nu on the first-order-clean DV (the clean-predictor outcome) versus
    0.45 that a measurable deficit appears there; a clear deficit on the strongly-
    interacting DV is expected at 0.8. 0.3 that raw-count minus nu is zero for the
    tested DVs (the object collapses to counting), which would be a clean negative.
