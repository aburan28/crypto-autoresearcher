      verified_by: TASK-20260906-284fe9 (summary in task context read 2026-09-06; full record not opened)
    - ref: 'J. Velu, Isogenies entre courbes elliptiques, C. R. Acad. Sci. Paris 273 (1971); D. Kohel, PhD thesis (1996), kernel polynomials'
      provenance: recalled
      claim: Explicit F_p-rational ell-isogeny from a Galois-stable kernel polynomial (a degree-(ell - 1)/2 factor of the division polynomial); NOT opened this session.
      verified_by: null

  assumptions:
    - Prime-order toy curves at 8-12 bits for measured cells (Groebner budget); 16-bit cells only for the exact invariance checks of Fact 1; 24-32 bit walk cells are design pins.
    - ell in {3, 5, 7} with an F_p-rational kernel found by factoring the division polynomial over F_p; cells without such a kernel for any ell <= 7 are skipped and counted.
    - The solve-side statistic is the frozen grevlex Groebner of the protocol with the ordinal degree-reached record of IDEA-20260808-5e257f; censored cells are infrastructure outcomes, never evidence (AGENTS.md rule 3).
    - Coset cells require B | p - 1 as in 9ef88c; the ladder is restricted to such (p, B) pairs, with a matched random base at the same (p, B).

  proof_search_map:
    bottleneck: >-
      Fact 2's density claim for f_{phi(V)}: if the image of a
      multiplicative coset under f_phi were again a coset (or otherwise
      sparse), the transported ideal would remain binomial and the test
      would not discriminate. Checked symbolically at Stage 0.
    baseline_embedding:
      parameter_slice: >-
        ell = 1 (phi the identity) must reproduce 9ef88c's degree B - 1 and
        cost O~(B^m) on the coset base, and the semi-regular degree on the
        random base. Fact 1 must hold with phi the identity trivially and
        with any phi exactly.
      reproduction_check: >-
        Frozen fixture: 10-bit prime-order curve with B = 6 | p - 1, coset
        base and random base, m = 2; Groebner solving degree recorded at
        ell = 1; sumset mW enumerated and compared bit-for-bit after
        transport at ell = 3.
    observation_collision:
      observable: The pair (solving degree, Macaulay cost) before and after transport, with p_exist as the invariant control.
      distinct_preimage_search: >-
        Two bases with identical p_exist but different solving degree (the
        coset base and its transport under O-REVERT) are the discriminating
        pair; if the ordinal-degree instrument cannot separate B - 1 from
        the semi-regular value at the chosen cells, the instrument is void.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the abstract configuration (log(V), log R) fixed and vary the
          encoding by phi; any change in the solve statistic is an encoding
          effect by construction.
        predicted_gain: The dichotomy becomes a measured fibre, not an argument.
    quantifier_order: >-
      FOR ALL E of prime order N, FOR ALL F_p-isogenies phi with
      gcd(deg phi, N) = 1, FOR ALL V, R: the decomposition data of (V, R)
      and (phi(V), phi(R)) coincide (Fact 1, unconditional). The empirical
      claim: FOR ALL tested coset cells, the transported solving degree lies
      in the random-base band (O-REVERT) or in the collapsed band
      (O-PERSIST); quantified over the tested panel only.
    method_ceiling:
      strongest_certifiable_claim: >-
        'On the tested panel, the coset base's solve-cost collapse is (or is
        not) preserved by isogeny transport, hence is an encoding object (or
        a subset object).' It cannot certify anything about other
        structured bases without running them, nor anything at crypto scale.
      nearby_object_control: >-
        Where the conclusion FAILS by construction: phi with image coset
        (if any exists for special (ell, c)), detected at Stage 0 and
        excluded; and the random base, where there is no collapse to lose.
    proof_obligations:
      - claim: Fact 1 (exact invariance of decompositions under phi).
        responsibility: correctness
      - claim: Fact 2 (degree preserved, binomial shape not, generically).
        responsibility: correctness
      - claim: The ordinal-degree instrument separates B - 1 from the semi-regular value at the chosen cells.
        responsibility: strictness
      - claim: Groebner cells complete within budget at 8-12 bits, m = 2, B <= 12.
        responsibility: runtime
      - claim: Toy-only scope; walk cells are pins.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The solving degree and Macaulay cost of the decomposition ideal
      I_R(V), followed under the operation set of F_p-isogenies of degree
      coprime to N, with the decomposition multiset as the exactly
      invariant companion.
    established_families_off_limits: >-
      Off-limits as the primary lens: factor-base geometry for mean yield
      (KN-FIND-007, 0ff796); isogeny transport COST (440ebb); JMV as a DLOG
      re-randomiser (3182cf); Groebner instrumentation for its own sake
      (H-SEMAEV lane); the coset base as a design (9ef88c owns it; here it
      is the planted object).
    lossiness: >-
      GENUINELY LOSSY: (E, V, R) -> solving degree keeps one integer and
      forgets the curve, the base and the target. Whether it propagates
      deterministically under the named operation set is precisely the
      question; the companion projection (E, V, R) -> decomposition
      multiset does propagate exactly (Fact 1) and is not a change of
      coordinates (its fibre is the whole isogeny class). Under translation
      the object is Class I partial action as for all index calculus
      (IDEA-20260806-c5d183).
    propagation: >-
      Exact for the existence companion; for the solve statistic, O-REVERT
      means 'does not propagate' (coordinate-dependent object) and
      O-PERSIST means 'propagates' (subset object).
    survival_score: >-
      Survives one isogeny by construction; the honest score is that the
      record expects the solve-side object to DIE at the first step for
      structured bases and to be trivially invariant for random ones.

  null_object_control: >-
    NULL-A, BLOCKING, MATCHED: a uniformly random base of the same size at
    the same p, transported by the same phi; its solving degree is
    predicted semi-regular before and after (no structure to lose) and its
    p_exist bit-identical. NULL-B: the coset base with its elements
    RELABELLED (a permutation of V, no transport); every statistic must be
    unchanged, ruling out ordering artifacts in the Groebner run. PLANTED
    POSITIVE CONTROL, BLOCKING: the coset base itself at ell = 1, which
    must show 9ef88c's degree B - 1 and the DFT-solvable cost; if it does
    not, 9ef88c's slice is not reproduced and the transport test is void.
    DECAY PARAMETER q: fraction of the coset's elements replaced by random
    x-classes on E, q in {0, 1/B, 2/B, 0.5, 1}; the number of nonzero
    coefficients of f_V rises from 2 toward B + 1 and the solving degree is
    predicted to rise with it (a step at q = 1/B if the binomial mechanism
    is all-or-nothing, which is itself reported); a solving degree flat in
    q is the artifact tell of docs/inventor-protocol.md section 3 and voids
    the arm. SECOND GRADED PARAMETER: the number of nonzero coefficients of
    f_{phi(V)} across ell in {3, 5, 7}, predicted B + 1 (dense) for all.
    ORDERING CONTROL: the ell = 1 values, the transported sumsets and the
    Stage 0 density counts are computed and hashed before any transported
    Groebner run is read.

  discriminated_from:
    - >-
      IDEA-20260807-e0ddc6 -- NEAREST RECORD. It states the transport
      dichotomy and predicts (Class III) that Groebner-side difficulty
      transports because the description degree does. EXACT DELTA: this
      record tests that sentence on the one base in the corpus whose
      Groebner difficulty is derived from a SHAPE rather than a degree
      (9ef88c), and pre-registers that the sentence must be refined to
      'the semi-regular ceiling transports' if O-REVERT occurs; e0ddc6
      names no structured base and runs no Groebner.
    - >-
      IDEA-20260808-9ef88c. Derives the coset collapse and concedes it
      loses to MITM. Delta: this record does not restate the collapse; it
      asks whether the collapse is a property of the coordinates or of the
      subset, which 9ef88c does not address, and uses its derivation as the
      forced ell = 1 slice.
    - >-
      IDEA-20260807-0ff796. Class invariance of mean yield. Delta: Fact 1
      is the pointwise (exact) version and is used as the blocking control,
      not as the finding.
    - >-
      IDEA-20260812-3182cf and IDEA-20260815-440ebb. JMV as a DLOG
      re-randomiser and the transport-cost lower bound. Delta: here the
      walk re-randomises the SOLVER INSTANCE of a relation collector, the
      transport is charged as one Velu evaluation per base element, and at
      toy scale the class is enumerated instead of walked.
    - >-
      IDEA-20260815-c13ef4. AP-structured bases and decomposition RATE.
      Delta: rate is exactly invariant under transport (Fact 1) and is not
      the question here; the AP-in-x base is run as a weak-structure arm
      only.

  predictions:
    - metric: M1 -- Fact 1 bit-identity of decomposition multisets and p_exist before and after transport, every arm, 8-16 bits
      direction: different
      minimum_effect: FORCED, exact; any discrepancy is an implementation fault (wrong kernel, wrong sign handling) and nothing is read.
    - metric: M2 -- Stage 0 nonzero-coefficient count of f_{phi(V)} for the coset base, ell in {3, 5, 7}, B in {4, 6, 8, 12}
      direction: higher
      minimum_effect: >-
        Predicted B + 1 (dense) on every (ell, B, c) except a set of measure
        zero to be listed; a sparse image (fewer than B/2 nonzero
        coefficients) on any cell is excluded from the transport test and
        reported as the nearby object.
    - metric: M3 -- ell = 1 coset solving degree versus 9ef88c's B - 1 and versus the matched random base's semi-regular degree
      direction: lower
      minimum_effect: >-
        Coset degree at most B - 1 and at least 2 below the random-base
        degree at B >= 6, m = 2; otherwise the instrument cannot separate
        the bands and the record is void.
    - metric: M4 -- transported coset solving degree at ell in {3, 5, 7} against the two bands
      direction: different
      minimum_effect: >-
        PRE-REGISTERED PREDICTION O-REVERT: inside the random-base band on
        every cell and every ell. O-PERSIST is inside the collapsed band on
        all cells; O-PARTIAL is any mixture, reported per statistic.
        Replication: 2 seeds, 2 kernels per ell where available.
    - metric: M5 -- q-decay of the solving degree on E and the nonzero-count of f_V
      direction: higher
      minimum_effect: >-
        Monotone non-decreasing in q with the random-base value reached at
        q = 1 within the instrument's resolution; a step at q = 1/B is
        reported as the all-or-nothing signature of the binomial mechanism.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): prove Fact 1; compute f_{phi(V)}
      symbolically for the coset base at small B and ell = 3, 5 and record
      its nonzero-coefficient count (M2). STAGE 1 (minutes): toy curves at
      8-12 bits with B | p - 1 for B in {4, 6, 8, 12}; factor division
      polynomials to find F_p-rational kernels for ell in {3, 5, 7}; Velu
      transport; verify M1 on every arm. STAGE 2 (minutes): ell = 1 slice
      (M3) on coset and random bases with the frozen grevlex Groebner and
      the ordinal-degree record. STAGE 3 (hours, bounded by the protocol's
      per-attempt budget): transported runs (M4) on coset, random, and
      relabelled arms; q-decay ladder on E (M5); at 8-10 bits enumerate the
      whole isogeny class and record the distribution of solving degree
      over it for the transported coset base. STAGE 4 (zero compute):
      classify O-REVERT / O-PERSIST / O-PARTIAL per the pre-registered
      bands. CHEAPEST VALID DISCRIMINATOR: Stage 0's density count plus
      Stage 2 and one transported cell at (10 bits, B = 6, ell = 3, m = 2)
      -- minutes to an hour; if the coset degree does not separate from the
      random band at ell = 1, or Fact 1 fails, nothing else is worth
      running.
    controls:
      - NULL-A matched random base of the same size at the same p, transported identically (blocking).
      - NULL-B relabelled coset base with no transport (blocking; must be unchanged).
      - Planted ell = 1 coset slice reproducing 9ef88c (blocking).
      - q-decay ladder on E and the dense-count ladder over ell (blocking).
      - AP-in-x base as a weak-structure arm, reported not fitted.
      - Mandatory Pareto rows on one instance per p, Pollard rho with negation (0.886 sqrt(N)) and BSGS (sqrt(N) time and memory), in group operations, as controls only.
    required_metrics:
      - decomposition multiset hashes and p_exist before and after transport per arm and cell
      - nonzero-coefficient counts of f_V and f_{phi(V)} per cell
      - solving degree reached, Macaulay dimensions and operation counts at ell = 1 and at each ell, per arm, seed and kernel, with censoring recorded as infrastructure
      - random-base band (min, max) per cell and the classification per cell
      - class-enumeration distribution of the transported degree at 8-10 bits
      - sha256 of every curve, kernel polynomial, base and seed list
      - matched rho and BSGS operation counts and BSGS memory

  falsification_conditions:
    - F1. Fact 1 fails on any arm. Implementation fault; nothing is read.
    - F2. Stage 0 finds f_{phi(V)} sparse for generic (ell, c). Fact 2 is wrong and the test does not discriminate; the record is superseded.
    - F3. The ell = 1 coset slice does not reproduce 9ef88c's collapse. The planted control fails; no transport verdict may be issued and 9ef88c's slice is reported as not reproduced at these cells.
    - F4. Random-base degree changes under transport beyond the band. The Groebner instrument is encoding-sensitive even without structure; the semi-regular reference itself is not transport-invariant, which refutes e0ddc6's Class III at its own baseline and voids this record's bands.
    - F5. O-PERSIST replicated across seeds and kernels. The record's pre-registered prediction is FALSE; the outcome is routed to independent review as stated and 9ef88c's mechanism is reported as insufficient.

  confounders:
    - KERNEL AVAILABILITY. Not every toy curve has an F_p-rational ell-kernel for small ell; cells without one are skipped and counted, never imputed.
    - GROEBNER CENSORING. Cells that exceed budget are infrastructure outcomes; the ordinal-degree record of 5e257f is used so that partial progress is not read as a zero.
    - EQUATION CHOICE (GAUGE). E' from Velu is one Weierstrass model; a further isomorphism changes coefficients but not shape statistics; reported once per model.
    - CONSTANT c AND B | p - 1. The coset construction constrains p; matched random bases share the same p and B so the comparison is within-cell.
    - SIGN CLOSURE. phi(-P) = -phi(P), so W transports as a symmetric set; verified in M1.
    - SMALL B. At B = 4 the collapsed and semi-regular bands may overlap; such cells are run but excluded from the classification.

  interpretation_limits:
    - Toy tier (claim_tier toy) at 8-12 bit Groebner cells and 16-bit invariance checks; walk cells at 24-32 bits are design pins and are not run.
    - NO ATTACK, NO EXPONENT MOVED. 9ef88c already records that the coset base loses to MITM; deciding whether its collapse is an encoding object changes no frontier.
    - O-REVERT refines one sentence of e0ddc6 and confirms 9ef88c as coordinate-born; it does not close any direction and names other structured bases (AP-in-x, automorphism orbits) as what remains.
    - The JMV walk is cited for the beyond-toy design only; nothing GRH-conditional is measured here.
    - No experiment, hypothesis, approval, status transition or run is created by this record.

  heuristic_assumptions:
    - id: HEUR-1
      statement: >-
        GENERIC DENSITY. For a multiplicative coset c mu_B and an
        F_p-rational isogeny phi of prime degree ell coprime to B and N, the
        vanishing polynomial of the image set has all B + 1 coefficients
        nonzero except on a proper Zariski-closed set of (phi, c).
      rigorous_support: >-
        The coefficients are polynomial functions of c and of the kernel
        polynomial's coefficients; each is not identically zero (checked
        symbolically at small B), so the vanishing locus is proper. The
        classical statement imitated is that a generic specialisation avoids
        a proper closed set; over F_p the exceptional set has density
        O(deg/p).
      validation_plan: >-
