    results: >-
      e0ddc6 states the dichotomy and predicts Groebner difficulty
      transports; 9ef88c derives the coset collapse; 0ff796 proves mean
      yield is class-invariant; 440ebb bounds transport cost; 3182cf
      composes JMV with class-group actions as a re-randomiser; c36472
