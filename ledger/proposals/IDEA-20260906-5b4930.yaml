      provenance: retrieved
      claim: Under GRH, random walks of length O(log q) on the ell-isogeny graph of ordinary curves with the same endomorphism-ring level mix to near-uniform (Theorem 5.1), and DLOG reduces in polynomial time along an explicit isogeny path (Theorem 4.1). Exact wording not fully legible in the fetched PDF; relied on only for these statements.
      verified_by: TASK-20260906-284fe9 (PDF fetched and summarised 2026-09-06)
    - ref: IDEA-20260807-e0ddc6
      provenance: internal
      claim: Transport compatibility dichotomy; Class III sentence that Groebner-side difficulty transports because the description degree is preserved by a resultant.
      verified_by: TASK-20260906-284fe9 (claim (A)-(B) read 2026-09-06)
    - ref: IDEA-20260808-9ef88c
