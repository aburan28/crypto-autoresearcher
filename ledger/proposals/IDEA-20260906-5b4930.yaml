idea:
  id: IDEA-20260906-5b4930
  question_id: RQ-RELN-001
  goal_id: GOAL-RELN-001
  added: '2026-09-06'
  title: >-
    TWO FILED RECORDS PREDICT OPPOSITE THINGS ABOUT ONE ISOGENY: e0ddc6 says
    the Groebner-side decomposition difficulty is a transport invariant
    (degree of the membership polynomial is preserved by a resultant), while
    9ef88c derives a coset base whose solve cost collapses to O~(B^m) BECAUSE
    its membership polynomial is a binomial x^B - c^B -- a SHAPE that a
    degree-ell isogeny maps to a dense degree-B polynomial. Transport the
    coset base through one F_p-rational ell-isogeny with gcd(ell, N) = 1:
    p_exist is exactly invariant (control), and the solving degree either
    reverts to the semi-regular value (the collapse is an encoding object,
    e0ddc6 Class II, and e0ddc6's Class III sentence must be refined) or
    stays collapsed (the advantage is a subset property and 9ef88c's
    mechanism is not the explanation); with the Jao-Miller-Venkatesan
    walk as the beyond-toy average-case device and the whole isogeny class
    enumerated at toy scale instead
  class: control

  claim: >-
    SETTING. E/F_p of prime order N; an F_p-rational isogeny phi: E -> E' of
    prime degree ell with gcd(ell, N) = 1, so phi restricted to E(F_p) is a
    group isomorphism onto E'(F_p) (transport theorem T1 as used by
    IDEA-20260807-e0ddc6 and IDEA-20260815-440ebb). For a factor base V of
    x-classes on E let phi(V) be the x-classes of the images; x(phi(P)) =
    f_phi(x(P)) with f_phi a rational function of degree ell. For a target
    R, the decomposition ideal is I_R(V) = (S_{m+1}(x_1..x_m, x(R)),
    f_V(x_1), ..., f_V(x_m)) with f_V = prod_{v in V} (x - v), and its
    transport is I_{phi(R)}(phi(V)) on E'.

    FACT 1 (EXACT INVARIANCE OF EXISTENCE). R = sum e_i P_i with x(P_i) in V
    iff phi(R) = sum e_i phi(P_i) with x(phi(P_i)) in phi(V). Hence the
    multiset of decompositions, c(R), coverage, p_exist and the additive
    energy of the base are bit-identical on E and E'. This is the control
    that must hold in every arm, and it is IDEA-20260807-0ff796's class
    invariance made pointwise.

    FACT 2 (THE MEMBERSHIP POLYNOMIAL TRANSPORTS IN DEGREE, NOT IN SHAPE).
    f_{phi(V)}(X) = prod_{v in V} (X - f_phi(v)) has degree exactly B
    (e0ddc6's resultant argument gives the same polynomial up to a
    constant). For V = c mu_B (9ef88c's coset, B | p - 1), f_V = x^B - c^B
    has TWO nonzero coefficients; f_{phi(V)} is the vanishing polynomial of
    the image set {f_phi(c zeta) : zeta^B = 1}, which is not a coset of any
    multiplicative subgroup for generic (phi, c) and whose polynomial is
    generically DENSE (all B + 1 coefficients nonzero). This is a zero-
    compute symbolic check for small B and ell = 3, 5 (Stage 0), and the
    number of nonzero coefficients of f_{phi(V)} is the graded structure
    statistic of this record.

    THE TENSION, STATED EXACTLY. e0ddc6 (A), Class III: 'the Groebner-side
    difficulty of decomposition, which is governed by deg g and by the
    summation polynomial, transports'. 9ef88c (i)-(iii): the coset base's
    Groebner basis is the generating set itself (lattice ideal), the
    solving degree is at most B - 1 per variable instead of the semi-regular
    ceil((m(B - 1) + D_S)/2), and the solve costs O~(B^m) by an
    m-dimensional DFT. Both cannot be right about the transported coset
    base: by Fact 2 the transported membership ideal is no longer binomial,
    so 9ef88c's mechanism gives no collapse on E', while e0ddc6 predicts
    the same difficulty on E' as on E. The record is the experiment that
    decides which sentence must be refined.

    OUTCOMES, PRE-REGISTERED. O-REVERT: on E' the solving degree of the
    transported coset base equals the semi-regular value observed for a
    matched RANDOM base (within the lane's ordinal-degree instrument,
    IDEA-20260808-5e257f), while p_exist is bit-identical. Meaning: the
    collapse is an ENCODING object -- Class II in e0ddc6's own taxonomy, a
    coordinate-dependent object in the trichotomy of IDEA-20260806-c5d183 --
    and e0ddc6's Class III sentence is refined to 'the SEMI-REGULAR ceiling
    transports; structured collapses below it do not'. 9ef88c's finding
    stands as stated (its own honest note is that it loses to MITM anyway)
    but is confirmed to be a property of the coordinates, not of the subset
    of G. O-PERSIST: the transported base keeps a solving degree near B - 1
    and a cost near O~(B^m) on E'. Meaning: the collapse is a property of
    the abstract subset log(V) of Z/N (a Class I object), 9ef88c's binomial
    mechanism is NOT the explanation, and something else about the coset
    (its logs form a coset of the index-B subgroup of (Z/N)^*? -- no: they
    do not, the coset is multiplicative in F_p, not in Z/N) is doing the
    work; this outcome routes to independent review because it would be
    the first transport-invariant solve-cost advantage in the corpus.
    O-PARTIAL: degree reverts but cost does not, or the reverse -- the two
    statistics of 9ef88c decouple, and the record reports which one is the
    encoding object.

    THE AVERAGE-CASE DEVICE. A single phi is one sample from the isogeny
    class. Beyond toy scale the Jao-Miller-Venkatesan random walk on the
    ell-isogeny graph of the class (retrieved: expander under GRH, walk
    length O(log q), Theorem 5.1 of eprint 2004/312) makes the endpoint
    near-uniform over curves of the same endomorphism-ring level, so a
    walk-transported base is an average-case instance of the class and the
    decomposition pulls back exactly through the walk (Fact 1 composed).
    At toy scale the device is unnecessary: the whole class is enumerated
    (all (a, b) with the same N at 8-12 bits, of size the class number
    h(t^2 - 4p), tens of curves), and the distribution of solving degree
    over the class is measured directly. The walk is a design pin for
    24-32 bit cells and is not run.

  mechanism: >-
    A lossy-projection test on a named operation set. The object is the
    solving degree (and Macaulay cost) of I_R(V); the operation set is
    {F_p-isogenies of degree coprime to N}; the question is whether the
    object propagates deterministically under it. Fact 1 shows the
    existence data propagates exactly (it is a function of the abstract
    configuration). 9ef88c's derivation shows the collapse is a function
    of the exponent lattice of f_V, which is an encoding datum; Fact 2
    shows that datum is not preserved. Therefore, IF 9ef88c's mechanism is
    the whole story, O-REVERT is forced; e0ddc6's Class III sentence was
    written for the generic (semi-regular) case where deg g is the only
    parameter and is correct there. The record does not presume the
    answer: O-PERSIST is written as a live outcome with its consequence.

  novelty_status: unverified

  novelty_screen:
