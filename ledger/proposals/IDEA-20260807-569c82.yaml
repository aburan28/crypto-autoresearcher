      all of them, which is precisely why that subfamily is excluded from the
      campaign's target family by construction.
    hidden_overhead: >-
      The MOV crossing condition hides the entire NFS constant and the practical
      cost of index calculus in F_{p^k}, and this record quotes no number for it.
      Second disclosure: "small k_emb" is not a sharp threshold; it is where two
      cost curves cross, and the crossing depends on parameters this record does
      not fix.
    tradeoff_note: >-
      Not applicable to the closure. For MOV the relevant position is that the
      transfer is cheap and the subsequent field DLP is the entire cost, so the
      attack's tradeoff position is that of NFS in F_{p^{k_emb}}, inherited
      wholesale and not analysed here.

