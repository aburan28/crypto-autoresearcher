idea:
  id: IDEA-20260807-569c82
  question_id: RQ-GGMB-6eaabc
  added: '2026-08-07'
  title: >-
    THE PAIRING ORACLE IS THE CONSTANT ORACLE ON A PRIME-ORDER SUBGROUP, AND NO
    CM ENDOMORPHISM CAN RESCUE IT: the Weil pairing is alternating so e(R,S) = 1
    identically on G x G, and the campaign's own binding fact -- every
    endomorphism acts on G as a scalar (H-ENDO-001) -- forbids a distortion map
    inside End_{F_p}(E), which closes DECOMPOSITION lane L8's stated open
    question about a CM-specific self-pairing computable without a second
    independent point; usefulness therefore requires resource R7, and the
    embedding degree that gates R7 is an isogeny-class invariant, so no walk can
    change it
  class: mechanism

  claim: >-
    (A) THE ORACLE. PAIR(h_1, h_2) returns the pairing value of two handles from
    G, in mu_N inside F_{p^{k_emb}}, where k_emb is the embedding degree, the
    least k with N | p^k - 1.

    (B) THE FIRST FACT, AND IT IS ELEMENTARY. The Weil pairing e_N is
    ALTERNATING: e_N(R, R) = 1 for every R. G is cyclic of prime order N, so
    every pair of its elements is (R, S) = ([a]P, [b]P), and bilinearity gives
    e_N(R, S) = e_N(P, P)^{ab} = 1. THE WEIL PAIRING RESTRICTED TO G x G IS
    IDENTICALLY 1. The oracle is therefore the CONSTANT ORACLE: verdict SIM with
    T_sim = 0 group operations, existential width Z = 1, and zero bits about k.
    It is closed by the strongest verdict available in this lane and it is closed
    by an identity, not by an estimate.

    (C) THE SECOND FACT, RELAYED AND FLAGGED. For an ordinary curve over F_p with
    k_emb > 1, the reduced Tate pairing is likewise DEGENERATE on G x G: G is the
    eigenvalue-1 eigenspace of Frobenius in E[N], and non-degeneracy of the
    reduced Tate pairing holds on G x G_2 where G_2 is the eigenvalue-p
    eigenspace, not on G x G. This is the standard reason pairing-based protocols
    use two distinct groups. [RELAYED, NOT RE-DERIVED HERE -- it is standard in
    the pairing literature and the corpus's own KN-TECH-032 records the MOV/
    Frey-Ruck setting but not this degeneracy statement; it must be confirmed
    before being cited as more than a working fact.] The boundary case k_emb = 1
    (N | p - 1) admits a nontrivial Tate self-pairing, and those curves are
    broken outright by the transfer into F_p^* regardless, so the exception is
    real and irrelevant.

    (D) THE THIRD FACT, AND IT IS THE PROPOSAL'S ACTUAL CONTRIBUTION, BECAUSE IT
    CLOSES A QUESTION THE CAMPAIGN WROTE DOWN AS OPEN. DECOMPOSITION lane L8
    states: "nothing here is novel unless a CM-specific self-pairing computable
    without a second independent point exists". A self-pairing that is useful
    needs a DISTORTION MAP: a map psi with psi(P) not in G, so that
    e_N(P, psi(P)) is nontrivial. On an ordinary prime-field curve the natural
    candidate for psi is a CM endomorphism. IT CANNOT WORK, AND THE REASON IS THE
    CAMPAIGN'S OWN ADMISSIBILITY FILTER: G has prime order N, so
    End(G) = Z/N and EVERY endomorphism of E acts on G as multiplication by a
    scalar lambda (H-ENDO-001). Hence psi(P) = [lambda]P is IN G, and
    e_N(P, psi(P)) = e_N(P, P)^lambda = 1. THERE IS NO DISTORTION MAP INSIDE
    End_{F_p}(E) FOR A PRIME-ORDER SUBGROUP, FOR ANY CM DISCRIMINANT, INCLUDING
    D_0 = -3 AND D_0 = -4. L8's stated escape hatch is closed by the same
    one-line fact that closes the endomorphism lane, which is a satisfying
    consistency of the decomposition and worth recording as such.
    [Verheul's theorem gives the same conclusion from a different direction --
    that non-trivial distortion maps do not exist for ordinary curves -- and is
    the external citation for this; NOT READ HERE and flagged accordingly. The
    argument above is self-contained and does not need it.]

    (E) WHAT IS LEFT, AND IT IS EXACTLY MOV. A useful pairing needs a SECOND
    independent point of order N, which exists only in E(F_{p^{k_emb}}) -- i.e.
    it needs resource R7, a map into a different group. There the oracle is
    NON-SIMULABLE (its answers are elements of a different group entirely, not
    functions of lambda) and SELF-COMPUTABLE (Miller's algorithm, polynomial
    time from public data), so it is cell (b) / verdict PUB in the
    IDEA-20260807-5876b8 taxonomy: the oracle framing is empty and the question
    is the cost of the resulting ALGORITHM. That algorithm is MOV/Frey-Ruck
    (KN-TECH-032) and it wins exactly when finite-field index calculus in
    F_{p^{k_emb}} costs less than 0.886*sqrt(N), i.e. when
      L_{p^{k_emb}}[1/3, c] < 0.886 * sqrt(N).
    [The numeric crossing point is a relayed equivalence, not derived here: the
    widely published security-equivalence tables place a prime field of about
    3072 bits at roughly 128-bit security against the number field sieve, which
    at a 256-bit N would put the crossing near k_emb of order 10. THE EXACT
    CONSTANT IS FLAGGED AS UNVERIFIED IN THIS CORPUS and must be either derived
    or sourced before any record quotes a number.]

    (F) THE CAMPAIGN-SPECIFIC OBSERVATION THAT MAKES THIS A SCOPING RESULT.
    k_emb = ord_N(p mod N) depends only on p and N. Both are isogeny-class
    invariants (DECOMPOSITION T4 fixes t, hence p and N across the class).
    THEREFORE THE EMBEDDING DEGREE IS CONSTANT ON AN ISOGENY CLASS AND NO ISOGENY
    WALK CAN CHANGE IT. Combined with IDEA-20260807-d73e83, which shows the walk
    is generically invisible anyway, lane L8 is a pure SCOPING lane exactly as
    DECOMPOSITION says: the only question is which CM families happen to have
    small k_emb, and that is a property of the class one is handed, not a
    property one can navigate to.

    (G) THE CONTROL ROLE, WHICH IS THE OTHER REASON TO FILE THIS. The pairing
    oracle on a SUPERSINGULAR prime-field curve with k_emb = 2 IS non-simulable
    and IS useful -- it is a genuine positive control for the adjudication
    procedure, and one of only two this lane can name over prime fields (the
    other being the anomalous-curve transfer, KN-TECH-033). Its existence is what
    keeps the adjudicator honest; its exclusion from the campaign's target family
    is what makes the campaign's negatives narrow. Both facts belong in the same
    sentence and are developed in IDEA-20260807-5ddd98.

  resource_label: >-
    R7 (pairings into F_{p^k}) as CLAIMED by lane L8. VERDICT: on G x G the
    resource is not delivered at all -- the pairing is identically trivial, so
    the oracle consumes no resource and is the constant oracle. R7 is genuinely
    consumed only after moving to E(F_{p^{k_emb}}) to obtain a second independent
    point, at which stage the oracle is self-computable and the question is the
    cost of MOV.
  admissibility: inadmissible_generic_group
  admissibility_argument: >-
    INADMISSIBLE in its G x G form, and filed as a recorded closure per the
    IDEATION-BRIEF's non-negotiable 1. The oracle's only use of the pairing is to
    apply it to points of G, and on a prime-order cyclic group the alternating
    Weil pairing is identically 1 -- so the oracle is a constant function,
    simulable at T_sim = 0, carrying zero bits. The obstruction is named twice
    over: alternation of the Weil pairing, and (for the endomorphism-augmented
    variant) the scalar action of End on a prime-order subgroup, H-ENDO-001. The
    R7-consuming form is ADMISSIBLE but is not new: it is MOV, recorded as
    `known` by KN-TECH-032's screening rule.

  discriminated_from:
    - >-
      KN-TECH-032 (MOV/Frey-Ruck and the embedding degree), which records the
      transfer, the small-k condition, and the Balasubramanian-Koblitz
      population statistics. This record does not restate any of that. Its new
      content is (i) the G x G triviality, which makes the pairing ORACLE a
      constant oracle rather than a weak one, (ii) the H-ENDO-001 argument
      closing L8's CM-self-pairing escape, and (iii) the class-invariance of
      k_emb, which converts L8 into a scoping lane by argument rather than by
      assertion.
    - >-
      KN-FIND-b7e091's Oracle D (endomorphism images). That closes endomorphism
      images. This record USES the same underlying scalar-action fact for a
      different purpose -- to rule out distortion maps -- and does not re-derive
      or re-test it.
    - >-
      IDEA-20260807-413fcc, which closes curve-measurable oracles by
      k-independence. The embedding-degree ORACLE ((p, N) -> k_emb) is a member of
      that class and is closed there. This record is about the PAIRING oracle,
      which takes handles, and needs a different argument.
    - >-
      IDEA-20260807-d73e83. That record shows the walk is invisible; this one
      shows the specific quantity L8 might have hoped to vary along a walk -- the
      embedding degree -- is constant on the class for an independent reason. Two
      arguments reaching the same place, which is worth having because either
      could fail.

  object_first_candidate:
    tracked_object: >-
      The pairing value e(h_1, h_2) in mu_N, i.e. an element of a DIFFERENT
      group of the same order N sitting inside F_{p^{k_emb}}^*.
    lossiness: >-
      LOSSY IN PRINCIPLE: two points are projected to one root of unity, and the
      individual points are not recoverable from the pairing value. But on G x G
      the projection is MAXIMALLY lossy -- everything is sent to 1 -- and a
      projection with a one-point image is not a new object, it is the trivial
      map. This is the degenerate end of the inventor-protocol section 2 test:
      the failure mode there is a projection that loses NOTHING (a change of
      coordinates); the failure mode here is a projection that loses EVERYTHING.
      Both are worthless and the second is easier to detect.
    propagation: >-
      Bilinear, hence perfectly deterministic:
      e([a]P, [b]P) = e(P, P)^{ab}. On G x G the base value is 1 so every image
      is 1 and the propagation is constant. In the R7 setting with a second
      independent point R, e(P, R)^{ab} propagates the pair of exponents
      multiplicatively -- which is exactly a homomorphism from the elliptic group
      to a multiplicative group, and that is what makes MOV an attack when the
      target group is weak.
    survival_score: >-
      On G x G the object survives everything and says nothing, which is the
      degenerate case scoring zero. In the R7 setting it survives the transfer
      and dies only where finite-field DLP is hard, i.e. at large k_emb -- which
      is the generic case for ordinary prime-field curves (KN-TECH-032). So the
      object's survival is inversely related to its usefulness, and the crossing
      point is the MOV condition.

  mechanism: >-
    STEP 1 (zero compute) -- THE TRIVIALITY IDENTITY. Write out
    e_N(R, S) = e_N(P, P)^{ab} = 1 using alternation and bilinearity. Two lines.
    Record the verdict SIM, T_sim = 0, Z = 1.

    STEP 2 (zero compute) -- THE TATE STATEMENT of (C), with its [relayed] flag,
    and a note that confirming it is a Stage-0 literature obligation before it is
    used in any conclusion.

    STEP 3 (zero compute) -- THE DISTORTION-MAP CLOSURE of (D). Combine
    H-ENDO-001's scalar action with bilinearity to show every End-built
    self-pairing on G is trivial. Note explicitly which curves this covers: ALL
    ordinary prime-field curves with a prime-order subgroup, including j = 0 and
    j = 1728, which are exactly the CM cases L8 would have looked at.

    STEP 4 (zero compute) -- CLASS INVARIANCE OF k_emb. k_emb = ord_N(p mod N);
    p and N are fixed by the trace; the trace is fixed on the class (T4). Hence
    k_emb is class-constant. One line, and it converts L8 into a scoping lane.

    STEP 5 (toy compute, <= 15 minutes, CONFIRMATORY AND CHEAP) -- THE
    TRIVIALITY CHECK. At p <= 2^20 on curves with a prime-order subgroup and
    small k_emb (chosen so that F_{p^{k_emb}} arithmetic is feasible in pure
    Python), compute the Weil pairing e_N(R, S) for many pairs from G and verify
    it is 1 in every case; then compute e_N(P, R) for R a second independent
    point of order N obtained in E(F_{p^{k_emb}}) and verify it is NOT 1,
    confirming the instrument can produce a nontrivial pairing at all. THE
    SECOND HALF IS THE POSITIVE CONTROL AND IS BLOCKING: a pairing implementation
    that returns 1 for everything would "confirm" (B) while being broken.

    STEP 6 (zero compute) -- write the L8 closure with its forward guidance: what
    remains open is only the population question (which CM families have small
    k_emb, and whether any standardized curve is near them), which is a survey,
    not an experiment.

  novelty_status: known
  novelty_screen:
    method: >-
      ripgrep via the harness Grep tool (semantics of `grep -ril`), 2026-08-07,
      over knowledge/, ledger/, docs/, analysis/. Patterns: "MOV|Frey-R|
      embedding degree|pairing|distortion"; "anomalous|trace one|trace 1";
      "Oracle A|Oracle B|Oracle C|Oracle D".
    results: >-
      KN-TECH-032 records MOV/Frey-Ruck, the embedding degree, the supersingular
      k <= 6 bound, and the Balasubramanian-Koblitz negligible-probability
      statistic, together with the program's screening rule that any transfer
      into a field DLP is `known` unless it works at large k. KN-TECH-005 and
      KN-TECH-030 cross-reference it. RQ-PAIR-21313f states the lane. NO record
      states the G x G triviality of the Weil pairing on a prime-order subgroup,
      the H-ENDO-001 argument against distortion maps, or the class-invariance of
      k_emb.
    verdict: known
  novelty_screen_note: >-
    KNOWN, and stated as such deliberately. Every mathematical fact used here is
    textbook: alternation of the Weil pairing, the eigenspace structure of the
    Tate pairing, Verheul's non-existence of distortion maps on ordinary curves,
    and the MOV transfer. NOTHING IS CLAIMED AS NEW MATHEMATICS. What the record
    contributes is bookkeeping the campaign needs: it closes a question the
    campaign's own decomposition wrote down as open (L8's CM self-pairing), it
    does so from the campaign's own binding fact rather than from an external
    citation, and it supplies one of the lane's two positive controls. A
    `known` novelty status with real campaign value is a legitimate deliverable
    and is preferable to dressing textbook facts as a discovery.

  null_object_control: >-
    MANDATORY AND BLOCKING, and here the null and the positive control are the
    two halves of one measurement.
    NULL DIRECTION: the pairing of two elements of G must be 1 for every pair
    tested. This is the claim, and on its own it is unfalsifiable by a broken
    implementation that always returns 1.
    PLANTED-SIGNAL DIRECTION, THEREFORE BLOCKING: the same implementation must
    return a NON-trivial value for e_N(P, R) with R a second independent point of
    order N in E(F_{p^{k_emb}}), and must satisfy the bilinearity check
    e_N([a]P, R) = e_N(P, R)^a for random a. An implementation failing either is
    void and the G x G result it produced is not evidence.
    DECAY PARAMETER: the order of the subgroup. Take a curve with a COMPOSITE
    subgroup of order N' = N_1 * N_2 and pair elements within it: the triviality
    argument uses primality (cyclicity of the subgroup is what forces every pair
    to be (aP, bP)), so on a non-cyclic N'-torsion subgroup the pairing must
    become nontrivial. The measured triviality must therefore DECAY as the
    subgroup stops being cyclic of prime order. Triviality that persists on a
    non-cyclic subgroup is the artifact tell and means the implementation is not
    computing a pairing.

  assumptions:
    - >-
      G is cyclic of prime order N inside E(F_p). Every claim in (B) and (D) uses
      cyclicity; nothing here applies to the full N-torsion or to composite-order
      subgroups.
    - >-
      The Weil pairing is alternating. Textbook (Silverman AEC III.8), used
      without proof.
    - >-
      The Tate-pairing degeneracy statement of (C) is RELAYED and flagged; it is
      not load-bearing for (B) or (D), which stand without it.
    - >-
      Verheul's non-existence of distortion maps on ordinary curves is cited but
      NOT READ HERE and is NOT load-bearing: (D)'s argument from H-ENDO-001 is
      self-contained and covers exactly the endomorphisms available on a
      prime-field ordinary curve.
    - >-
      The MOV crossing point is a relayed security-equivalence, flagged
      unverified, and no numeric claim is made on it.

  proof_search_map:
    bottleneck: >-
      Step 3, the distortion-map closure. Steps 1 and 4 are one-liners and Step 2
      is relayed; the only place this record adds something the campaign did not
      have is the argument that no endomorphism of an ordinary prime-field curve
      can serve as a distortion map on a prime-order subgroup. That is the exact
      step whose failure would reopen L8, and it costs zero compute.
    baseline_embedding:
      parameter_slice: >-
        The supersingular curve over F_p with k_emb = 2 and a known distortion
        map. At this slice the record's conclusion must FAIL -- the distortion
        map exists, the self-pairing is nontrivial, and MOV applies. This is the
        boundary of the claim and reproducing the known break there is the
        baseline check.
      reproduction_check: >-
        SYMBOLIC plus a toy fixture: on a supersingular toy curve at p <= 2^16
        with k_emb = 2, exhibit the distortion map, verify e_N(P, psi(P)) != 1,
        and verify that the transfer reduces the ECDLP to a DLP in F_{p^2}^*.
        Frozen as a fixture. IF THE RECORD'S ARGUMENT ALSO KILLED THE
        SUPERSINGULAR CASE, IT WOULD BE PROVING TOO MUCH AND WOULD BE WRONG --
        this check is what catches that, and it is the reason the slice is chosen
        on the far side of the boundary.
    observation_collision:
      observable: >-
        The pairing value, and derivatively the verdict SIM/T_sim = 0 on G x G.
      distinct_preimage_search: >-
        REQUIRED AND IT SUCCEEDS TRIVIALLY, WHICH IS THE POINT: every pair in
        G x G has the same observable, namely 1. The collision class is all of
        G x G, so the observable is maximally non-identifying and the oracle is
        the constant oracle. A more interesting collision, on the far side: the
        supersingular curve with k_emb = 2 and an ordinary curve with k_emb = 2
        (which can occur, though rarely) share the small-k property and differ on
        distortion-map availability -- so k_emb alone does not determine
        exploitability, and the separating condition is supersingularity. This
        bounds any conclusion drawn from k_emb by itself.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move "is there a useful self-pairing?" into the exact algebraic
          condition "does there exist psi in End with psi(P) not in G?", which by
          H-ENDO-001 is the condition "does End(G) contain a non-scalar?", which
          for prime N is the condition "is Z/N non-commutative?" -- decidably
          false. Encoding, completeness, soundness and transfer obligations are
          all trivial here because the reduction is an equality of groups.
        predicted_gain: >-
          Converts an open lane question into a decided one at zero cost. No
          attack speedup; the gain is one fewer open item and one more
          consistency link between the campaign's binding facts.
      - transform: observable_fiber
        proposed_object: >-
          Hold "k_emb small" fixed and vary supersingularity; the fiber contains
          both exploitable and non-exploitable curves, separated by the existence
          of a distortion map.
        predicted_gain: >-
          Prevents the campaign from using small k_emb as a proxy for
          exploitability, which is the error a scoping lane is most likely to
          make.
    quantifier_order: >-
      THE CLOSURE CLAIM, WITH THE ORDER:
        FORALL primes p, FORALL ordinary E/F_p, FORALL prime-order subgroups
        G = <P> of order N, FORALL endomorphisms psi in End_{F_p}(E), FORALL
        R, S in G:
          e_N(R, S) = 1  and  psi(P) is in G, hence e_N(P, psi(P)) = 1.
      The universal over psi comes AFTER the choice of curve and BEFORE any
      choice of pairing argument, which is what makes the conclusion cover CM
      curves uniformly rather than case by case on the discriminant.
      THE EXISTENTIAL THAT WOULD BREAK IT, stated so it is clear what a
      counterexample looks like: EXISTS an ordinary prime-field E, a prime-order
      G, and a publicly computable map psi with psi(P) not in G. Such a psi
      cannot be an endomorphism of E by H-ENDO-001; it would have to be something
      else entirely, and naming what that could be is the forward guidance.
      THE MOV CLAIM'S ORDER, which is weaker and must not be blurred with the
      closure: EXISTS a subfamily (small k_emb) FORALL members of which the
      transfer wins. An existential over families, not a universal.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On an ordinary prime-field curve with a prime-order subgroup G, every
        pairing of two elements of G is trivial and no endomorphism of E is a
        distortion map for G." It can NEVER certify that no useful pairing-based
        attack exists -- MOV exists and works at small k_emb -- nor anything
        about supersingular curves, composite-order subgroups, the full
        N-torsion, or curves over extension fields.
      nearby_object_control: >-
        THE SUPERSINGULAR PRIME-FIELD CURVE WITH k_emb = 2, where the desired
        conclusion FAILS: a distortion map exists, the self-pairing is
        nontrivial, and the ECDLP transfers. The method must NOT kill this case;
        if it does, it is proving too much. That is the sharpest available check
        on (D) and it is why the baseline slice was chosen there.
        A SECOND nearby object: a composite-order subgroup, where cyclicity fails
        and the Weil pairing on the subgroup need not be trivial. Named so the
        cyclicity assumption is visible.
    proof_obligations:
      - claim: >-
          e_N(R, S) = 1 for all R, S in a cyclic prime-order G, by alternation
          and bilinearity.
        responsibility: correctness
      - claim: >-
          Every psi in End_{F_p}(E) satisfies psi(G) = G, hence
          e_N(P, psi(P)) = 1.
        responsibility: correctness
      - claim: >-
          k_emb = ord_N(p mod N) is constant on an F_p-isogeny class.
        responsibility: correctness
      - claim: >-
          The argument does NOT kill the supersingular k_emb = 2 case.
        responsibility: baseline
      - claim: >-
          The pairing implementation returns a nontrivial value on G x G_2 and
          satisfies bilinearity.
        responsibility: interface
      - claim: >-
          The Tate-degeneracy statement is flagged relayed and is not used in any
          load-bearing position.
        responsibility: scope

  predictions:
    - metric: >-
        Weil pairing value e_N(R, S) over many random pairs from a prime-order G
        on toy curves with small k_emb
      direction: different
      minimum_effect: >-
        Exactly 1 in 100 percent of cases, at every tested curve and pair. A
        single nontrivial value contradicts alternation and is a suspected
        implementation error until replicated independently.
    - metric: >-
        e_N(P, R) with R a second independent order-N point in E(F_{p^{k_emb}}),
        plus the bilinearity check e_N([a]P, R) = e_N(P, R)^a
      direction: different
      minimum_effect: >-
        Nontrivial value in at least 99 percent of cases and bilinearity holding
        in 100 percent. This is the blocking positive control; failure voids the
        null result.
    - metric: >-
        e_N(P, psi(P)) for psi a CM endomorphism on j = 0 and j = 1728 toy curves
      direction: different
      minimum_effect: >-
        Exactly 1 in 100 percent of cases, at every CM discriminant tested. This
        is the direct measurement of (D), and it is cheap: the campaign already
        has j = 0 and j = 1728 toy curves in H-ENDO-001's test boundary.
    - metric: >-
        variation of k_emb across an enumerated toy isogeny class
      direction: different
      minimum_effect: >-
        Exactly zero variation. k_emb depends only on p and N, both class
        constants. Any variation means the class enumeration is wrong (it
        contains curves of different trace) and is an instrument failure.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, 1 hour): the three arguments -- triviality,
      distortion-map impossibility, class-invariance of k_emb -- plus the
      supersingular boundary check that the argument does not prove too much.
      STAGE 1 (zero compute): Stage-0 literature obligation -- confirm or refuse
      to rely on the Tate-degeneracy statement of (C); log whatever is found to
      knowledge/literature/ with an honest verified/relayed marker.
      STAGE 2 (toy compute, <= 15 min, HARD GATE): the pairing implementation's
      positive control -- nontrivial e_N(P, R) and bilinearity on a curve with
      k_emb = 2 at p <= 2^16.
      STAGE 3 (toy compute, <= 15 min): the G x G triviality measurement, the CM
      self-pairing measurement on j = 0 and j = 1728, and the composite-order
      decay control.
      STAGE 4 (toy compute, included): the supersingular k_emb = 2 fixture, where
      the distortion map must exist and the self-pairing must be nontrivial.
      STAGE 5 (zero compute): write the L8 closure with forward guidance (the
      remaining question is a population survey, not an experiment).
    controls:
      - >-
        nontrivial e_N(P, R) with a second independent point, plus bilinearity
        (blocking positive control)
      - >-
        supersingular k_emb = 2 fixture where the distortion map must exist
        (proving-too-much control, blocking)
      - >-
        composite-order subgroup where triviality must FAIL (decay control)
      - >-
        isogeny-class enumeration with trace recorded per curve, so k_emb
        invariance is checked against a class that is actually a class
      - >-
        factored order and #E != p per curve (KN-TECH-030, KN-TECH-033 hygiene)
    required_metrics:
      - fraction of G x G pairs with trivial pairing, per curve
      - value and bilinearity check of e_N(P, R) on the positive control
      - e_N(P, psi(P)) per CM discriminant tested
      - k_emb per curve across the enumerated class
      - pass/fail of the supersingular fixture and the composite-order control

  falsification_conditions:
    - >-
      A nontrivial Weil pairing between two elements of a cyclic prime-order G.
      This contradicts alternation; it is an implementation error until
      independently replicated, and only then a mathematical event.
    - >-
      A publicly computable psi on an ordinary prime-field curve with
      psi(P) not in G for prime-order G. This contradicts H-ENDO-001's scalar
      action; L8 reopens, and the campaign's admissibility filter itself would
      need re-examination, so it would be a major event requiring the AGENTS.md
      rule 12 escalation.
    - >-
      The positive control fails -- e_N(P, R) trivial or bilinearity violated.
      The implementation is broken and the triviality result is void, not
      confirmed.
    - >-
      The supersingular fixture also comes out trivial. The argument proves too
      much and is wrong somewhere; the record is superseded rather than patched.
    - >-
      k_emb varies across an enumerated isogeny class. The class enumeration is
      wrong (mixed traces) and every class-invariance claim that used it is void.

  confounders:
    - >-
      AN IMPLEMENTATION THAT ALWAYS RETURNS 1 would "confirm" the central claim
      while being broken. This is the dominant confounder and the entire reason
      the positive control is blocking rather than advisory.
    - >-
      PROVING TOO MUCH. An argument that also kills the supersingular case is
      wrong. The boundary fixture catches it.
    - >-
      CYCLICITY. Every claim uses prime order. A toy curve whose "prime-order
      subgroup" is actually composite silently breaks the argument's hypothesis,
      not its conclusion, and the order must be factored per curve.
    - >-
      FIELD ARITHMETIC AT k_emb > 2. Pure-Python F_{p^k} arithmetic is slow and
      the tested k_emb must stay small; conclusions about large k_emb come from
      the argument, never from the measurement.
    - >-
      RELAYED-FACT CREEP. The Tate degeneracy and Verheul's theorem are flagged
      relayed. If a downstream record quotes either as established on the
      strength of this proposal, that is a citation failure originating here.

  interpretation_limits:
    - >-
      Scoped to ordinary prime-field curves with a cyclic prime-order subgroup.
      Nothing transfers to supersingular curves, composite-order subgroups, the
      full N-torsion, or extension fields -- and the supersingular exclusion is
      not incidental, it is where the positive control lives.
    - >-
      This closes the pairing ORACLE on G x G and L8's CM-self-pairing question.
      It does NOT close pairing-based attacks: MOV works at small k_emb and is
      recorded as `known` (KN-TECH-032).
    - >-
      No numeric MOV crossing point is claimed; the relayed security-equivalence
      is flagged unverified in this corpus.
    - >-
      The measurements are toy scale (p <= 2^16 to 2^20) and confirm an argument
