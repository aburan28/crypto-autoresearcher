  reachability_gate: >-
    DISCHARGED BY INVARIANCE. L8 is the one lane where a reachability question
    has a fully decided answer: the embedding degree k_emb = ord_N(p mod N)
    depends only on class-invariant data, so NO isogeny walk changes it, at any
