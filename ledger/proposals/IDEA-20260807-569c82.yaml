  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED BY THIS RECORD. For the objects it
      classifies: the G x G pairing oracle leaves the exponent at 1/2 exactly
      (T_sim = 0, Z = 1, zero information). The R7 form is MOV, whose cost is
