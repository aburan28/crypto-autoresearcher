    requested_reasoning_effort: high
    resolved_model_id: claude-fable-5-1 (as reported by the runtime; not probe-verified)
    model_verified: false
    fallback_used: false
    degraded_requirements: []
    bedrock_used: false

  yaml_parse_disclosure: >-
    NO INTERPRETER WAS AVAILABLE TO THIS SESSION (no shell tool); this file
    was not machine-parsed by its author. Every prose value is a folded
