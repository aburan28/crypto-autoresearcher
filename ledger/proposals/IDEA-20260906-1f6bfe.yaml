idea:
  id: IDEA-20260906-1f6bfe
  question_id: RQ-RELN-61638a
  goal_id: null
  goal_id_note: >-
    Not bound to a GOAL record. GOAL-RELN-001 (factor-base decomposition
    probability audit) is the natural host, as RQ-RELN-61638a itself states;
    binding is a Coordinator ledger-archive act and is not performed by this
    record.
  added: '2026-09-06'
  title: >-
    SYMBOLIC REGRESSION AS THE INVARIANT EXTRACTOR: RECOVERY CONTROLS FIRST,
    HELD-OUT RUNG, EVERY RECOVERED EXPRESSION IS A PROOF OBLIGATION -- a
    deterministic, pinned symbolic-regression pipeline over MEASURED SUMMARY
    STATISTICS of the decomposition-count vector c_D(r) (mean, dispersion
    index, k-rich counts, coverage, multiset additive energy) as functions of
    (N, B, m, geometry), gated by three pre-registered recovery controls it
    must reproduce with the constants free, scored on a held-out N rung
    against a PRE-COMMITTED list of candidate expressions, and converting each
    survivor into a proof obligation with a proves-too-much control object
  class: measurement
  class_note: >-
    Measurement with a tooling flavour: the deliverable is an instrument
    (a frozen grammar search plus a pinned PySR run) and the list of
    candidate invariants it is pointed at. It measures which closed forms the
    committed and sibling tables support; it proves nothing by itself.

  claim: >-
    (A) THE QUESTION THIS INSTRUMENT DECIDES. For the decomposition-count
    vector c_D(r) of a size-B base D at arity m in a group of prime order N,
    every summary statistic that the program has measured or will measure
    (the mean mu = M/N with M = C(B+m-1, m); the dispersion index
    Delta = Var_r[c_D]/mu; the multiset additive energy E_m(D) = sum_r c_D(r)^2;
    the k-rich counts R_k = #{r : c_D(r) >= k}; the coverage
    cov = R_1/N; the third factorial moment) either has a closed form in
    (N, B, m) that coincides with the RANDOM-BASE law for x-line-defined
    bases on prime-order curves, or departs from it by an expression with
    explicit N- or B-dependence. Symbolic regression (SR) over the exhaustive
    toy tables, with recovery controls and a held-out rung, is the cheapest
    instrument that can tell those two apart and hand the departure, if any,
    to a prover as a stated formula. The user's gold standard (quoted in
    RQ-RELN-61638a) is candidate invariants that can actually be proved; this
    record's output is exactly a list of such candidates, each marked with a
    status and a proof route, never a result.

    (B) THE FALSIFIABLE CONTENT, IN THREE PREDICTIONS. (B1) A frozen grammar
    search (primary engine) and a pinned PySR run (secondary engine), given
    only the tabulated statistics with all constants free, RECOVER the three
    pre-registered proved-or-derived laws -- INV-1 (mean = C(B+m-1, m)/N,
    KN-FIND-007), INV-7 (the m = 2 exact random law
    1 - C(n-B, B)/C(n, B), n = (N-1)/2, IDEA-20260906-86cd30) and INV-8
    (the semi-regular reference d_reg = ceil((m(B-1)+D_S)/2),
    IDEA-20260808-093497) -- each at expression complexity <= 10 nodes with
    zero residual on the integer-valued data. If any control is not
    recovered the pipeline is uninformative and NO new expression may be
    reported from it. (B2) NULL OUTCOME, PREDICTED: for the three x-line
    geometries of EXP-FB3-001 (high_bit_interval, small_height, coset_union)
    and for the x-interval bases of the sibling battery, the Pareto-optimal
    expression for Delta on the held-out rung 2^20 coincides, within held-out
    error, with the random-base expression -- which this record corrects
    from the seed sketch's 1 - 1/N to 1 - m(B-1)/N + O((1+mu)/N) for B
    DISTINCT elements (candidate INV-A1 below; derived in-record,
    unreviewed). (B3) ALIVE OUTCOME, NOT PREDICTED: an expression for Delta,
    E_3 or an R_k with explicit N- or B-dependence beyond the random law,
    fitted on N <= 2^18, that predicts the 2^20 rung within tolerance where
    the random law does not, replicated on at least 3 curves, and that FAILS
    on the proves-too-much controls (Z/N with the interval base [1, B],
    whose Delta is of order B^2; the small-multiples log-space base) in the
    sense of not being the same expression there. That outcome creates a
    proof obligation and a counterexample search at 2^22 before any proof
    attempt, and would feed the growth exponent of IDEA-20260830-c5c614; it
    is not itself evidence of anything.

    (C) WHAT IS NEW RELATIVE TO THE NEAREST RECORD. IDEA-20260806-071255
    types LENSES of the group action (candidate projections pi : G -> S) and
    reported zero hits for 'symbolic regression' in this repository. This
    record regresses closed forms for MEASURED SUMMARY STATISTICS of the
    count vector against (N, B, m, geometry) -- the object is a statistic of
    a base, not a projection of a point -- and binds every recovered
    expression to a pre-registered candidate list and a proof route. The two
    records share the methodological stance (recover a known answer first,
    refuse to report what was derivable) and nothing else.

  mechanism: >-
    STEP 1 -- THE DATA, WITH EXACT PATHS AND THEIR CONVENTIONS. Four
    sources, each carried into the pipeline with an explicit `convention`
    column and NEVER rescaled to another record's convention. (a) The
    exhaustive count-vector summaries of the sibling battery
    IDEA-20260906-d1494b (same session; not yet committed when this record
    was written; its run directory is bound at experiment design as
    experiments/EXP-<its area>-<tok>/runs/*/summary.json): E_m, Delta, R_k
    for k in {1..8}, coverage, third factorial moment, per geometry (E with
    x-interval / QR-class / low-degree-image bases; E with matched random
    base; Z/N with interval base; Z/N with random base; Bose-Chowla B_3 base
    where constructible), per N in {2^14, 2^16, 2^18, 2^20, 2^22 if run},
    with an OFF-DIAGONAL B-ladder (at least 3 values of B per N) and
    m in {2, 3}. If the sibling is not committed, this record's experiment
    specifies the same enumeration itself (FFT convolution of the indicator
    of log(D), O(N log N) per cell, discrete logs known by construction for
    measurement only) -- the pipeline does not depend on the sibling's
    approval. (b) The committed EXP-FB3-001 battery:
    experiments/EXP-FB3-001/runs/RUN-FB3-001-N14/raw-result.json,
    experiments/EXP-FB3-001/runs/RUN-FB3-001-N16/raw-result.json,
    experiments/EXP-FB3-001/runs/RUN-FB3-001-N18/raw-result.json
    (the `cells[]` array: fields geometry, N, B, curve_index, rep_seed,
    evaluation_domain, exact_total, stats.{mean, coverage, concentration,
    variance, max_count}, metrics.{mean, coverage, concentration}.null_mean
    and null_sd over 200 matched-random draws), plus
    runs/RUN-FB3-001-FAMILY/raw-result.json (aggregates) and
    runs/RUN-FB3-001-CTRL/raw-result.json (controls). Convention: m = 3,
    UNSIGNED multisets from B distinct logs, whole-group targets,
    B = ceil((6N)^(1/3)), 3 untyped geometries x 3 sizes x 4 curves x 4
    seeds = 144 untyped cells and 144 typed cells; the symmetric arm
    D u (-D) is reported in experiments/EXP-FB3-001/conservation.md section 3
    only. (c) The DREG deficit series: ledger/EV-DREG-001.yaml,
    ledger/EV-DREG-002.yaml, ledger/EV-DREG-003.yaml (these three live under
    ledger/, not ledger/evidence/; EV-DREG-004..008 live under
    ledger/evidence/) and ledger/DEC-20260718-018.yaml: Semaev arm, D = 5,
    rank 28,096 / 69,073 / 125,099 / 143,882 against sr_pred 29,418 /
    70,935 / 126,922 / 145,881, deficit 1,322 / 1,862 / 1,823 / 1,999 at
    n_vars = 12 / 15 / 17 / 18. Convention: n_vars is a variable count in a
    polynomial system, NOT a group order; four points; no held-out rung
    exists (EV-DREG-004 records n = 21 as untouched). This source is
    therefore a PREDICTION target only: the three lowest-complexity
    expressions fitted to the four points emit pre-registered n = 21 values
    to be scored if that cell is ever measured; nothing is fitted-and-reported
    from four points. (d) The top features and partial-dependence curves of
    the learned predictor of sibling IDEA-20260906-79ff48 (same session; not
    yet committed), used as INPUT VARIABLES: SR regresses the predictor's
    output and the measured lift rho(D, pi) of IDEA-20260830-c5c614 on those
    features, so a learned model's opaque function is compressed into a
    formula that can be read and attacked. If 79ff48 is not committed, source
    (d) is empty and the record says so in its run report.

    STEP 2 -- THE TWO ENGINES, PINNED. PRIMARY: a from-scratch bounded
    grammar search, exhaustive up to a declared complexity C_max (default
    12 nodes; count of enumerated expressions reported), over the operator
    set {+, -, *, /, pow, log, exp, binomial(., .), floor, ceil} with leaves
    drawn from the declared input variables {N, B, m, n = (N-1)/2, M, mu,
    |W|, D_S, n_vars} and free constants; constants are fitted by exact
    rational reconstruction with bounded denominator (<= 64) on integer- or
    rational-valued targets and by least squares otherwise; the enumeration
    order, the seed used for any tie-breaking, and the grammar are part of
    the frozen contract. It is primary because it is deterministic,
    auditable, and COMPLETE up to C_max: 'no expression of complexity
    <= C_max fits' is then a coverage statement about the grammar, not a
    remark about a stochastic search's luck. SECONDARY: PySR (Cranmer,
    SymbolicRegression.jl backend; provenance recalled) at ONE exact release
    recorded by version string and package hash in the frozen contract --
    the author does not assert a version number from memory -- run with
    deterministic = True, procs = 0, multithreading = False and a fixed
    random_state, which the PySR review literature (recalled; search snippet
    seen 2026-09-06) states is the only configuration in which the seed
    controls the result. PySR reaches complexities the exhaustive engine
    cannot; every PySR expression within C_max must be re-found by the
    exhaustive engine or it is reported as 'stochastic-search only', and
    any exhaustive-engine expression PySR misses is recorded as a PySR
    completeness failure at that complexity (heuristic H2 below). Tool
    version, Julia version, seed, grammar, C_max, node-counting rule and
    input-variable list are frozen before any data are read.

    STEP 3 -- STAGE 0, RECOVERY CONTROLS, HARD GATE. Three tables are
    generated or read and fed to both engines with all constants free:
    (i) INV-1: the (N, B, m, mean) table from source (b) `stats.mean` at
    m = 3 and from source (a) at m in {2, 3}; required recovery
    binomial(B + m - 1, m)/N (or B(B+1)(B+2)/(6N) at fixed m = 3) at zero
    residual, complexity <= 10. (ii) INV-7: the (N, B, p_exist) table
    computed EXACTLY by exhaustive enumeration of 2-decompositions over 200
    random x-class bases per cell at 8-16 bits (the validation route of
    86cd30, re-run here so the control does not rest on an unreviewed
    derivation) plus the closed-form table; required recovery
    1 - binomial(n - B, B)/binomial(n, B), complexity <= 10; if the
    exhaustive table and the closed form disagree the control is REPLACED by
    the exhaustive table and the disagreement is reported to the 86cd30 lane
    -- it is not silently fixed. (iii) INV-8: the (m, B, D_S, d_reg) table
    from the exact integer-convolution of IDEA-20260808-093497 Stage 0
    (first non-positive coefficient of (1 + ... + z^(B-1))^m (1 - z^(D_S)))
    for m in {2, 3, 4}, B in {4..64}; required recovery
    ceil((m(B-1) + D_S)/2), complexity <= 10. (iv) Two zero-compute sanity
    fits on source (b): variance = concentration + mean - mean^2 and
    Delta = concentration/mean + 1 - mean (INV-A6), at zero residual. A
    control that is not recovered ends the line for that engine; a control
    recovered only above complexity 10 is reported as a degraded instrument
    and the bound for every later claim is raised accordingly.

    STEP 4 -- STAGE 1, FIT AND HOLD OUT. For each target statistic and each
    geometry arm, fit on all cells with N <= 2^18 and predict the 2^20 rung
    (and 2^22 where source (a) provides it). Report the full Pareto front of
    (complexity, held-out error) for BOTH engines; held-out error is measured
    in units of the matched-random null's standard error at that rung
    (curve-cluster bootstrap over the 4 independent curves, since replicate
    seeds do not resample deterministic geometries). The PRE-COMMITTED
    candidate list the front is scored against: INV-2 (Delta = E_m/M - mu),
    INV-2' (Delta_random = 1 - 1/N, sampling with replacement), INV-A1
    (Delta_random = 1 - m(B-1)/N + O((1+mu)/N), distinct elements), INV-2''
    (forced negation term |W|^3/4 in E_3 for W = -W), INV-9
    (Delta >= 1 - mu, equality iff B_m), INV-A3, INV-A4, INV-A5, INV-A6 and
    the unknown target INV-4c (E_3 of an x-interval base
    = (1 + o(1))(M + M^2/N)). An expression on the front is scored as
    'matches candidate X', 'matches no candidate' or 'contradicts candidate
    X', so that a recovered expression is compared with a list written
    before the fit rather than admired after it. Distinct expressions whose
    held-out errors lie within one null SE of each other are reported AS A
    SET; the pipeline never picks one.

    STEP 5 -- STAGE 2, PROOF OBLIGATIONS. Every expression that survives the
    held-out rung and is not on the proved list becomes a
    `proof_obligation` record with (1) the statement with its convention,
    (2) a proof route, (3) a proves-too-much control object -- Z/N with the
    interval base [1, B], the small-multiples base {1..B} in log space,
    relabelled Z/N random -- on which the expression must FAIL if it is a
    claim about elliptic-curve x-defined bases specifically and must HOLD if
    it is a claim about Z/N, and (4) a counterexample search at the next rung
    (2^22, or a fifth B value at 2^20) run BEFORE any proof attempt. An
    expression that holds on the E arm and on the Z/N random arm alike is a
    property of random sets, not of curves, and is filed as such.

    STEP 6 -- HONEST ACCOUNTING. The run report carries: the enumerated
    expression count per C_max; the recovery complexity of each control on
    each engine; the Pareto fronts; the observation-collision sets; the
    scored candidate list with every entry marked matched / unmatched /
    contradicted; the proof obligations opened; and, for the DREG source,
    the three pre-registered n = 21 predictions with their complexities.

