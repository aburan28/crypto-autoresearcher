  assumptions:
    - >-
      N = #E(F_p) is an odd prime on every curve arm, so that m < N is a unit
      mod N and the affine action of INV-3 and the distinctness casework of
      INV-A1 apply; even-order curves are outside every statement here.
    - >-
      The sibling battery IDEA-20260906-d1494b (or this record's own
      enumeration) provides exhaustive count vectors at 2^20 with an
      off-diagonal B-ladder; without off-diagonal cells the matched-size rule
      B = ceil((6N)^(1/3)) makes B and N collinear and no expression can
      separate B-dependence from N-dependence (confounder C4).
    - >-
      Discrete logs are known by construction for measurement only
      (EXP-FB3-001 convention); nothing here is an attack step.
    - >-
      PySR at the pinned release honours deterministic = True with
      procs = 0 and multithreading = False (recalled; verified at contract
      freeze by two identical runs, which is a blocking check).
    - >-
      Toy tier throughout (N <= 2^22); no crypto-scale claim follows from
      any outcome.

  object_first_candidate:
    tracked_object: >-
      The SUMMARY-STATISTIC VECTOR s(D) = (mu, Delta, E_m, R_1..R_8,
      third factorial moment) of the count vector c_D, together with its
      pushforward s(D | S) along a representation-decidable target set S
      (a predicate on x(R) of density sigma, as in IDEA-20260830-c5c614).
      The pair (representation, operation set) is: representation = the
      log-set log(D) in Z/N seen through the statistic; operation set
      Sigma = the affine maps r -> ur + t of Z/N acting on bases (INV-3)
      together with translation by D (INV-6).
    trichotomy_class: >-
      s(D) alone is a partial-action object (Class I of IDEA-20260806-c5d183):
      it propagates exactly under the affine action, s(uD + t) = s(D), and
      not under an arbitrary change of D. The pushforward s(D | S) with an
      x-defined S is coordinate-dependent (Class III): S is not affine-
      invariant, and that is exactly where elliptic-curve-specific content
      could live (INV-3). The record tracks both and says which is which in
      every table row.
    lossiness: >-
      GENUINELY LOSSY, and the discard is compatible with Sigma: s(D)
      forgets which base in an affine orbit D was (the fibre over a value of
      s contains every base with the same count-vector statistics, of which
      there are many -- e.g. every B_m set of size B has the same s), and it
      forgets the count vector itself (R_k and E_m are sums over targets).
      Under the affine action the retained part propagates deterministically
      (it is invariant), so it passes the lossy-projection test against the
      NAMED operation set; it fails against 'replace D by another base',
      which is not in Sigma and is not claimed.
    established_families_off_limits: >-
      Families F1-F7 of IDEA-20260802-002; the bounded-degree algebraic
      factor base of KN-OPEN-020; the yield, coverage and rank channels
      closed as constant-bounded by IDEA-20260830-772cff. Coverage appears
      here ONLY as a recovery-control target (INV-A4) and as a consequence of
      dispersion (conservation), never as a lever. The mean is INV-1 and is a
      control by construction.
    survival_score: >-
      s(D) survives every base and every m (it is defined for all of them);
      its INFORMATIVENESS dies exactly when the E-arm statistics coincide
      with the random law -- the predicted outcome -- at which point the
      residual object is the pushforward s(D | S), whose decay exponent
      c5c614 already prices.

  null_object_control: >-
    (1) RANDOM-BASE NULL, MATCHED: for every (N, B, m, geometry) cell, the
    same statistics on 200 uniformly random B-subsets (source (b) already
    carries null_mean and null_sd); every E-arm expression is scored
    against the null-arm expression, not against zero. (2) STRUCTURE-
    DESTRUCTION NULL: relabelled Z/N with a random base; an expression that
    holds there is a property of random sets. (3) POSITIVE CONTROL,
    BLOCKING: Z/N with the interval base [1, B] at m = 3, where E_3 is of
    order B^5 and Delta of order B^2; the pipeline must recover an expression
    with that growth or it cannot see over-dispersion and no null result may
    be reported from it. (4) SIDON CONTROL: a Bose-Chowla B_3 base (log
    space, Z/(q^3 - 1)), where Delta = 1 - mu and coverage = min(1, M/N)
    exactly (INV-A4); the pipeline must recover the under-dispersion floor.
    (5) DECAY TELL (docs/inventor-protocol.md section 3): for the small-
    multiples base, replace a fraction q in {0, 0.25, 0.5, 0.75, 1} of the
    base by random logs; the fitted excess Delta - Delta_random must fall
    monotonically to zero at q = 1; a flat excess is the artifact signature
    and voids the arm. (6) ORDERING CONTROL: the candidate list, the
    grammar, C_max, the seed and the closed-form control tables are written
    and hashed before any measured table is read.

  discriminated_from:
    - >-
      IDEA-20260806-071255 -- NEAREST RECORD. It types LENSES pi : G -> S of
      the group action by a proved trichotomy and refuses candidates whose
      forced value is derivable; it recorded zero hits for 'symbolic
      regression'. EXACT DELTA: this record's inputs are measured summary
      statistics of a base's count vector as functions of (N, B, m,
      geometry), not projections of points; its output is a scored list of
      closed-form candidate invariants with proof routes, not a typed
      frontier of (L, b) triples. It borrows 071255's discipline (recover a
      known answer before reporting an unknown one) and nothing of its
      object.
    - >-
      IDEA-20260906-86cd30, KN-FIND-007, IDEA-20260808-093497. They PROVE or
      DERIVE the three laws used here as recovery controls. Delta: this
      record consumes them as instrument calibration; if the pipeline cannot
      recover them it reports nothing, and if the exhaustive re-check of
      INV-7 disagrees with 86cd30 the disagreement is reported to that lane.
    - >-
      IDEA-20260830-c5c614 and IDEA-20260815-f9e978. They MEASURE the lift of
      an x-decidable target set and the distribution of P(decomp | target).
      Delta: this record turns their measured tables (and the sibling
      predictor's features) into candidate closed forms; an alive INV-4c
      outcome would feed c5c614's growth exponent, and a null outcome adds
      the random-law expression as an analytic reference for their nulls.
    - >-
      IDEA-20260805-a25f11. It identifies the m = 2 collision deficit with the
      additive energy of W and proposes a graded energy census. Delta: this
      record states the second-moment identity at general m as INV-2 and asks
      SR whether E_3 for x-defined bases has any closed form beyond the random
      one; the census is a data source for it, not a competitor.
    - >-
      The 'AI discovers a formula' genre -- FunSearch (2023), AI Feynman
      (2020), PySR applications -- provenance recalled for all. Delta: here
      every expression is scored against a PRE-REGISTERED list written before
      the fit, distinct expressions of equal held-out error are reported as a
      set and never one picked, and every survivor becomes a proof
      obligation with a proves-too-much control object and a counterexample
      search before any proof attempt. A formula found and admired is not an
      output of this pipeline.

  candidate_invariants:
    - id: INV-1
      statement: >-
        For every base D of B distinct elements of a finite abelian group of
        order N and every m >= 1, sum_r c_D(r) = C(B+m-1, m); hence the mean
        per-target count mu = C(B+m-1, m)/N depends on (B, m, N) only.
      status: proved
      proof_route: >-
        Double count over size-m multisets (KN-FIND-007, derivation-level,
        validator-recomputed, confirmed on 67,784 closed-form checks in
        EXP-FB3-001). Used here as recovery control (i).
      proves_too_much_control: >-
        Not applicable as a discriminator: the identity holds on Z/N interval,
        small-multiples and random bases alike, which is why it is a control
        and not a claim about curves.
      settled_by: null
    - id: INV-2
      statement: >-
        sum_r c_D(r)^2 = E_m(D) := #{ordered pairs (A, A') of size-m multisets
        from D with sum A = sum A'}. Hence Var_r[c_D] = E_m/N - mu^2 and the
        dispersion index Delta(D) := Var/mean = E_m/M - mu. Since the M
        diagonal pairs give E_m >= M, Delta >= 1 - mu.
      status: provable_elementary
      proof_route: >-
        Expand sum_r c(r)^2 as a count of ordered pairs of multisets with the
        same sum; the rest is algebra. Checked in-record; the a25f11 record
        states the m = 2 case. Not yet on the ledger at general m.
      proves_too_much_control: >-
        Holds for every base in every abelian group; its only discriminating
        content is the value of E_m, which the other entries address.
      settled_by: null
    - id: INV-2prime
      statement: >-
        For D of B elements drawn i.i.d. uniformly from Z/N (N prime, with
        replacement, B counted with multiplicity), E[E_m(D)] = M + M(M-1)/N
        and E[Delta] = 1 - 1/N exactly, because for A != A' the difference
        sum A - sum A' is a nonzero integer combination of independent
        uniforms with coefficients of absolute value <= m < N and is uniform
        on Z/N.
      status: provable_elementary
      proof_route: >-
        Uniformity of a nontrivial linear form in independent uniform
        variables over a prime-order group; linearity of expectation.
        CORRECTION TO THE SEED SKETCH: this is the with-replacement law. The
        program's random base is B DISTINCT logs, and the distinct-element
        correction is NOT O(m/B) as sketched but of order mB/N (INV-A1),
        which dominates the 1/N term for every B >= 2.
      proves_too_much_control: >-
        A statement about random multisets in Z/N; must hold on the Z/N
        random arm and must FAIL on the Z/N interval arm (Delta of order
        B^2).
      settled_by: null
    - id: INV-2doubleprime
      statement: >-
        If W = -W with |W| = 2B and m = 3, then for every Q in W the B
        multisets {P, -P, Q} (one per x-class, including Q's own) sum to Q,
        so c_W(Q) >= B = |W|/2 on W and E_3(W) >= 2B * B^2 = |W|^3/4. The
        forced mass is exactly 2B^2 = |W|^2/2 multisets out of
        M = C(2B+2, 3), a fraction ~ 3/(2B) of all multisets, concentrated
        on the 2B targets of W.
      status: provable_elementary
      proof_route: >-
        Direct enumeration of the forced multisets (checked in-record: the
        multisets {P, -P, Q} for P ranging over the B x-classes are pairwise
        distinct and distinct across Q). CORRECTION TO THE SEED SKETCH: the
        forced term |W|^3/4 exceeds the random excess ~ M^2/N ~ |W|^6/(36N)
        iff |W|^3 < 9N; at the M ~ N operating point |W| ~ (6N)^(1/3) the
        ratio forced/random is 1.5 (comparable, not dominant), and with
        |W| = 2B, B = (6N)^(1/3) it is |W|^3 = 48N > 9N and the random term
        dominates. 'Across the entire index-calculus range' overstates; the
        correct reading is 'comparable at the operating point, dominant
        below it'. The reduced convention (exactly m points, signs free, no
        {P, -P} pair) must be declared before any dispersion number is
        reported, as the seed says.
      proves_too_much_control: >-
        Must be ABSENT on the unsigned convention (the 144 FB3 cells use B
        distinct logs with no forced negation pairs) and PRESENT on the
        symmetric arm of conservation.md section 3 (B' = 234); a pipeline
        that reports a forced term on the unsigned cells has mixed
        conventions.
      settled_by: null
    - id: INV-3
      statement: >-
        The affine group of Z/N (r -> ur + t, u a unit) acts on bases with
        c_{uD+t}(ur + mt) = c_D(r). A uniformly random B-subset is invariant
        in law under this action, so for any FIXED target set S the expected
        lift rho(S) = E[sum_{r in S} c_D(r)]/(|S| mu) equals exactly 1.
        Clusters in the log coordinate cannot exist for a random base; any
        cluster is a property of the specific log-set log(D) up to affine
        maps, and the representation enters only through which log-set an
        x-defined base produces.
      status: provable_elementary
      proof_route: >-
        Multisets map to multisets under elementwise affine maps; translation
        by t alone already shows E[c_D(r)] is target-independent (m is a unit
        mod N). QUALIFICATION to the seed sketch: the VARIANCE of a cell
        total needs the covariances P[sum A = r, sum A' = r'] for r != r',
        which the pair-counting of INV-A1 supplies but which do not 'follow
        from INV-2 prime' alone; that computation is part of the obligation.
      proves_too_much_control: >-
        Holds for random bases in Z/N with or without a curve; the
        discriminating content is entirely in the pushforward along an
        x-defined S, which is INV-4c.
      settled_by: null
    - id: INV-4
      statement: >-
        With ORDERED-tuple energy E^ord_m(D) = #{(d_1..d_m, d'_1..d'_m) in
        D^(2m) : sum d = sum d'} one has E^ord_m = (1/N) sum_chi |S_D(chi)|^(2m),
        S_D(chi) = sum_{P in D} chi(P) over characters of the cyclic group;
        the trivial character contributes B^(2m)/N, and if |S_D(chi)| <= K
        for chi != 1 then E^ord_m <= B^(2m)/N + K^(2m-2) B by Parseval.
      status: provable_elementary
      proof_route: >-
        Fourier inversion on the cyclic group; standard. TWO THRESHOLDS,
        separated here because the seed conflates them: the bound beats the
        trivial E^ord_m <= B^(2m-1) as soon as K < B, i.e. (with the recalled
        Kohel-Shparlinski-type K ~ p^(1/2) log p for x-interval bases)
        B > p^(1/2) log p; it certifies the RANDOM value B^(2m)/N (1 + o(1))
        only when K^(2m-2) B << B^(2m)/N, i.e. B >> p^(m/(2m-1)), which at
        m = 3 is p^(3/5) -- far above the index-calculus B ~ p^(1/3). The
        multiset energy of INV-2 differs from the ordered energy by a
        bounded combinatorial factor per multiplicity pattern; the
        translation is part of the obligation.
      proves_too_much_control: >-
        Z/N with the interval base [1, B]: |S(chi)| ~ B at small frequencies,
        so the bound does not go through, and E_3 is of order B^5 there; the
        instrument must see that over-dispersion.
      settled_by: null
    - id: INV-4c
      statement: >-
        CONJECTURE (open target): for x-interval bases on prime-order curves
        and B in [p^(1/3), p^(1/2)], E_3(D) = (1 + o(1)) (M + M^2/N), i.e.
        Delta(D) = Delta_random (1 + o(1)); the x-interval base carries no
        excess 3-fold additive energy beyond the random law.
      status: open
      proof_route: >-
        No route below B ~ p^(3/5) is known to this record; the character-sum
        route (INV-4) is the only one recalled and it stops at p^(3/5). The
        toy instrument here is the only probe; an alive outcome would be a
        formula to attack, a null outcome the measured obstruction (the
        energy excess with its interval per rung) for the record.
      proves_too_much_control: >-
        Z/N interval base (Delta of order B^2, the departure is KNOWN to
        exist) and the small-multiples log-space base (concentration ratio
        1224 at 2^18 in EXP-FB3-001); any 'no departure' expression must NOT
        fit those arms.
      settled_by: null
    - id: INV-5a
      statement: >-
        L(4 O) = span{1, x, y, x^2}, so P_1 + P_2 + P_3 + P_4 = O iff the four
        points are the intersection of E with a curve alpha x^2 + beta x +
        gamma y + delta = 0 (counted with multiplicity). Hence at m = 3,
        c_D(R) is the number of such conics through -R whose other three
        intersections with E lie in D, and at m = 2 it is the number of lines
        through -R meeting D twice. The degenerate case gamma = 0 is the pair
        of vertical lines {P, -P, Q, -Q}, which is exactly the forced
        negation cluster of INV-2''.
      status: provable_elementary
      proof_route: >-
        Riemann-Roch for the dimension, Abel's theorem for the equivalence
        sum P_i ~ 4 O iff sum P_i = O; all four points affine since O is not
        in D and R != O, so the pole order is exactly 4 and the conic is
        unique up to scalar.
      proves_too_much_control: >-
        Not applicable (an exact reformulation on the curve; it says nothing
        about Z/N and cannot be tested there).
      settled_by: null
    - id: INV-5b
      statement: >-
        CONJECTURE: the mass of k-rich targets sum_{r : c_D(r) >= k} c_D(r) for
        an x-interval base is bounded by a point-conic incidence bound over
        F_p in the two-parameter family of conics of INV-5a, giving an upper
        bound on cluster mass that decays in k faster than the random-law
        Poisson tail would allow beyond some k_0(B, p).
      status: open
      proof_route: >-
        Point-curve incidence bounds over F_p (Stevens-de Zeeuw 2017,
        Bourgain-Katz-Tao 2004; recalled) applied to the conic family through
        a fixed point; whether they beat the trivial bound at B ~ p^(1/3) is
        exactly the open question. SR's role: fit the measured k-rich counts
        R_k against the Poisson tail N P[Poisson(mu) >= k] and report the
        largest k at which the two agree.
      proves_too_much_control: >-
        Z/N interval base, where k-rich mass is deterministic and large
        (c(r) of order B^2 near r = 3B/2); an incidence-type bound stated for
        curves must not hold there.
      settled_by: null
    - id: INV-6
      statement: >-
        Sigma_m(D) = Sigma_{m-1}(D) + D: if R is m-decomposable then R - P is
        (m-1)-decomposable for some P in D. Decomposability propagates along
        translation-by-D edges with an arity shift.
      status: provable_elementary
      proof_route: >-
        Definition unfolding. Recorded so that a learned model given
        translation edges is credited with a theorem, not a discovery; the
        discovery question is correlation at FIXED m along coordinate
        neighbourhoods, which is INV-4c again.
      proves_too_much_control: Not applicable (holds in every abelian group).
      settled_by: null
    - id: INV-7
      statement: >-
        On a prime-order curve, for a uniformly random B-subset V of the
        n = (N-1)/2 x-classes and any target R != O, P[R has a signed
        2-decomposition over V] = 1 - C(n-B, B)/C(n, B) (loop counted), and
        c(R) follows the runs distribution of a random B-subset of a path.
      status: provable_elementary
      proof_route: >-
        Derived in IDEA-20260906-86cd30 (proposal status, not yet
        validator-reviewed): the m = 2 incidence graph is a path, so failure
        is an independent B-set of a path. Used here as recovery control
        (ii), with the closed form RE-CHECKED by exhaustive enumeration at
        8-16 bits before it is trusted as a control; a disagreement replaces
        the control by the exhaustive table and is reported to the 86cd30
        lane.
      proves_too_much_control: >-
        Z/N interval base at m = 2 in the unsigned convention, where c(r) is a
        deterministic triangular profile, not the runs law.
      settled_by: null
    - id: INV-8
      statement: >-
        The semi-regular reference degree of the m-variable decomposition
        system with generator degrees (D_S, B, ..., B) is
        d_reg = ceil((m(B-1) + D_S)/2), the index of the first non-positive
        coefficient of (1 + z + ... + z^(B-1))^m (1 - z^(D_S)).
      status: provable_elementary
      proof_route: >-
        Generating-function coefficient a_d - a_{d - D_S} with a the m-fold
        convolution of the length-B box, unimodal and symmetric about
        m(B-1)/2; derived in IDEA-20260808-093497 and hand-verified there on
        two cells. Used as recovery control (iii) on the degree side, with the
        table generated by exact integer convolution.
      proves_too_much_control: >-
        Not a claim about curves; the control is that the formula must FAIL
        (be replaced by the true first-fall degree) on a non-semi-regular
        system, e.g. the Semaev arm of DREG whose rank deficits 1,322 /
        1,862 / 1,823 / 1,999 are exactly the departure.
      settled_by: null
    - id: INV-9
      statement: >-
        Delta(D) >= 1 - mu with equality iff D is a B_m set in the multiset
        sense (all m-fold sums with repetition distinct); under-dispersion is
        the signature of a low-energy base, and Bose-Chowla B_3 bases attain
        the floor.
      status: provable_elementary
      proof_route: >-
        The equality clause of INV-2; Bose-Chowla B_h sets have all h-fold
        sums with repetition distinct by definition (recalled). Consistent
        with the red-team measurement max_count = 1 at q = 13.
      proves_too_much_control: >-
        A Z/N statement; B_3 sets are built in log space (Z/(q^3 - 1)) and
        are not x-decidable, so the floor is a control, not a lever.
      settled_by: null
    - id: INV-A1
      statement: >-
        NEW (derived in-record, unreviewed). For D a uniformly random
        B-subset of Z/N (N prime, DISTINCT elements) and m < N, the ordered
        pairs (A, A') of m-multisets whose multiset difference is
        c ({a} - {b}) for a single pair a != b and 1 <= c <= m number
        P_prop = B(B-1) C(B+m-1, m-1) (hockey-stick sum over c), and each has
        collision probability exactly 0; every other pair A != A' collides
        with probability 1/N (1 + O(m^2/N)). Hence
        E[E_m(D)] = M + (M(M-1) - P_prop)/N + O(M^2/N^2) and
        E[Delta(D)] = 1 - m(B-1)/N + O((1+mu)/N).
        At m = 3: Delta_random = 1 - 3(B-1)/N + O((1+mu)/N).
      status: provable_elementary
      proof_route: >-
        Casework on the multiset difference: proportional differences force
        a = b (c is a unit mod N), impossible under distinctness; non-
        proportional differences fix one element as a function of the others
        that avoids the excluded values except on O(1/N) of the space.
        Hockey-stick identity sum_{j=0}^{m-1} C(B-1+j, j) = C(B+m-1, m-1) and
        P_prop/(M N) = m(B-1)/N. The O-term's constant is the open part of
        the obligation. ONE-CELL SPOT CHECK made while deriving (disclosed,
        not evidence): RUN-FB3-001-N18 cell 1 (N = 261643, B = 117) has null
        concentration 1.0938256 and mean 1.0465367, giving Delta_null =
        1.0938256/1.0465367 + 1 - 1.0465367 = 0.99865, against the predicted
        1 - 3*116/261643 = 0.99867 and the seed sketch's 1 - 1/N = 0.999996.
        The 2^14 and 2^16 null means were NOT inspected and are the
        pre-registered check: predicted Delta_null = 1 - 3(B-1)/N at
        (B, N) = (47, ~16.3e3) and (74, ~65.5e3), i.e. about 0.9916 and
        0.9967, against a null SE of the mean of roughly 6e-4.
      proves_too_much_control: >-
        A Z/N statement: must hold on the Z/N random arm and the E random arm
        alike (it is NOT a curve claim) and must FAIL on the Z/N interval and
        small-multiples arms. It is also the correction of INV-2' that makes
        the predicted NULL outcome of INV-4c a sharp expression rather than
        '1 - 1/N'.
      settled_by: null
    - id: INV-A2
      statement: >-
        NEW. At m = 2 in the x-class convention, for a uniformly random
        B-subset V, the expected k-rich count is
        E[#{R != O : c(R) >= k}] = (N - 1) P_runs[c >= k], with P_runs the
        two-term loop mixture of the runs law of IDEA-20260906-86cd30
        Corollary 2d, because every nonzero target has the same law.
      status: provable_elementary
      proof_route: >-
        Linearity of expectation over targets plus Corollary 2a/2d of 86cd30
        (target-independence of the law); the variance of the runs count is
        classical (recalled, Feller vol. 1) and gives the second moment for
        free.
      proves_too_much_control: >-
        Z/N interval at m = 2 (deterministic k-rich profile 2B + 1 - 2k
        targets for the unsigned base [1, B], k <= B/2 roughly); the runs
        law must not fit it.
      settled_by: null
    - id: INV-A3
      statement: >-
        NEW. Exact count of the forced negation clusters at m = 3 as a
        function of |W|: for every symmetric W of size 2B, exactly
        |W|^2/2 multisets of type {P, -P, Q} exist, each target Q in W
        receives exactly |W|/2 of them, targets outside W receive none, and
        the induced dispersion floor is
        Delta(W) >= (|W|^3/4 + M - |W|^2/2)/M - mu with M = C(|W|+2, 3).
      status: provable_elementary
      proof_route: >-
        Enumeration as in INV-2'' plus the diagonal count for the remaining
        multisets; equality iff the non-forced multisets have all sums
        distinct and avoid W.
      proves_too_much_control: >-
        Absent on unsigned bases (the 144 FB3 cells), present on the
        symmetric arm (B' = 234) and on any Z/N symmetric set; it is a
        convention statement, not a curve statement.
      settled_by: null
    - id: INV-A4
      statement: >-
        NEW as a stated formula. For any B_3 set D (all 3-multiset sums
        distinct) with M <= N, coverage(D) = M/N = C(B+2, 3)/N exactly and
        Delta(D) = 1 - mu; for Bose-Chowla's schedule |A| = q, N = q^3 - 1
        the coverage ratio against the Poisson random value tends to
        (1/6)/(1 - e^(-1/6)) = 1.0856. Check against the committed
        red-team probe: C(15, 3)/2196 = 455/2196 = 0.207195, which is the
        recorded coverage to six digits.
      status: provable_elementary
      proof_route: >-
        The accounting identity cov = mean - (1/N) sum (c-1)^+ of
        conservation.md with (c-1)^+ = 0 for a B_3 set. Used as a recovery
        control on the coverage side (Sidon control 4).
      proves_too_much_control: >-
        Log-space construction in Z/(q^3 - 1); not x-decidable; the control
        is that no x-defined base in the battery may reach it (INV-9 floor).
      settled_by: null
    - id: INV-A5
      statement: >-
        NEW. Third factorial moment under the random model: with
        T = sum_r c(c-1)(c-2) (ordered triples of pairwise distinct multisets
        with equal sums), E[T] = T_2/N^2 + T_1/N + O(.), where T_2 counts
        triples whose two difference vectors are linearly independent mod N
        and non-degenerate under distinctness and T_1 the rank-one triples;
        to leading order (1/N) E[T] = mu^3 (1 + o(1)), the Poisson third
        factorial moment, so the skewness of the random count vector is
        mu^(-1/2) (1 + o(1)).
      status: conjecture
      proof_route: >-
        Same casework as INV-A1 one level up (classify triples by the rank of
        the difference lattice); provable_elementary in the i.i.d. model, a
        conjecture with distinctness corrections whose combinatorics are not
        written out here. SR target: the measured (1/N) T against mu^3 on the
        random and E arms.
      proves_too_much_control: >-
        Z/N interval base (T of order B^7, not mu^3 N); must fail there.
      settled_by: null
    - id: INV-A6
      statement: >-
        Convention-translation identity for the committed FB3 tables: with
        conc = (1/N) sum_r c(r)(c(r) - 1) (the frozen concentration statistic),
        Var_r[c] = conc + mu - mu^2 and Delta = conc/mu + 1 - mu; hence the
        144-cell table yields Delta and E_3 = N(conc + mu) exactly without
        any rescaling.
      status: provable_elementary
      proof_route: >-
        One line from sum c^2 = sum c(c-1) + sum c. Used as zero-compute
        sanity fit (iv); the table also stores `variance`, which must equal
        conc + mean - mean^2 to floating precision in every cell.
      proves_too_much_control: Not applicable (an identity of definitions).
      settled_by: null

  proof_search_map:
    bottleneck: >-
      Whether ANY summary statistic of the count vector for x-defined bases
      has a closed form in (N, B, m) that departs from the random law
      (INV-A1 and its k-rich, coverage and third-moment companions). If none
      does at toy scale, the cluster question of RQ-RELN-61638a(i) reduces to
      the pushforward lift of c5c614 with the random law as its analytic
      null; if one does, that expression is the theorem to prove.
    baseline_embedding:
      parameter_slice: >-
        The three recovery controls as exact slices: INV-1 on every cell
        (m = 3 and m = 2), INV-7 on the m = 2 random arm, INV-8 on the
        integer-convolution table; plus INV-A4 on the Sidon control and
        INV-A6 on the committed variance column. Every one must be recovered
        with zero residual and complexity <= 10 before Stage 1 opens.
      reproduction_check: >-
        Frozen fixture: the hashed closed-form tables for (i)-(iv) and the
        exhaustive 8-16 bit m = 2 enumeration; both engines must emit the
        stated expressions (or algebraic equivalents, checked by symbolic
        simplification) at the stated complexity.
    observation_collision:
      observable: >-
        A (complexity, held-out error) point on the Pareto front for a target
        statistic.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED: many algebraically distinct
        expressions share a front point on <= 4 rungs (e.g. 1 - 3(B-1)/N,
        1 - 3B/N and 1 - c N^(-2/3) are indistinguishable on the matched-size
        diagonal B = ceil((6N)^(1/3)) because B and N are collinear there).
        The pipeline reports every such set as a SET and never picks a
        member; the off-diagonal B-ladder of source (a) is the only thing
        that separates B-dependence from N-dependence and is therefore a
        data REQUIREMENT, not an option.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Pack the statistics by convention (unsigned D at m = 3; x-class W at
          m = 2; symmetric D u -D) and fit within a convention only; cross-
          convention relations (the 2^m factor, the forced term) are
          candidate invariants, not preprocessing.
        predicted_gain: >-
          Removes the largest known source of spurious N-dependence
          (convention drift across records) before any fit is run.
      - transform: observable_fiber
        proposed_object: >-
          For each front expression, the set of bases (E x-interval, E random,
          Z/N random, Z/N interval, Sidon, small-multiples) on which it holds;
          an expression whose fibre contains both E arms and the Z/N random
          arm is a random-set law.
        predicted_gain: >-
          Turns 'SR found a formula' into 'SR found a formula about THIS class
          of bases', which is the only form a proof obligation can take.
      - transform: stronger_invariant
        proposed_object: >-
          Replace Delta by the full k-rich profile (R_1..R_8) and the third
          factorial moment, which can detect a departure Delta cannot (a
          heavy tail with the same variance).
        predicted_gain: >-
          A departure invisible in the second moment but visible in the tail
          would still be caught; the Poisson tail is the pre-registered
          reference (INV-A5, INV-5b).
    quantifier_order: >-
      What the instrument can support: FOR ALL target statistics s in the
      declared list, FOR ALL expressions e in the frozen grammar with
      complexity <= C_max, IF e fits every cell with N <= 2^18 within the
      null SE AND predicts the 2^20 cells within the null SE, THEN e is a
      candidate invariant for s over the tested bases, with the fibre of
      bases on which it holds recorded. What it can support about the null:
      FOR ALL e in the grammar with complexity <= C_max, no e departs from
      the random law on the E arms within tolerance -- a coverage statement
      scoped to the grammar, C_max and the rungs. What it can NEVER
      support: FOR ALL N, or any statement outside the grammar.
    method_ceiling:
      strongest_certifiable_claim: >-
        'Within this grammar, at complexity <= C_max, on these rungs and
        conventions, the only expressions for s on x-defined bases that
        survive the held-out rung are algebraically equivalent to the random
        law' -- or the complementary list of survivors with their fibres.
        SR finds expressions; proofs are separate work and are not certified
        by anything here. Nothing about m >= 4, crypto scale, solve cost or
        any exponent.
      nearby_object_control: >-
        Z/N with the interval base [1, B], where the departure from the
        random law is KNOWN to exist (E_3 of order B^5, Delta of order B^2)
        and where the instrument must recover an expression with that growth;
        and the small-multiples log-space base with concentration ratio
        1224 at 2^18. If the pipeline reports 'no departure' on either, it
        is blind and its E-arm null is void.
    proof_obligations:
      - claim: The three recovery controls are recovered at complexity <= 10 with zero residual on both engines.
        responsibility: baseline
      - claim: INV-A1's O((1+mu)/N) remainder has an explicit constant, and its leading term matches the committed 2^14 and 2^16 null means.
        responsibility: correctness
      - claim: Every front expression is scored against the pre-committed list and every equal-error set is reported as a set.
        responsibility: interface
      - claim: Every survivor has a proves-too-much control on which it was actually run and a counterexample search at the next rung before any proof attempt.
        responsibility: strictness
      - claim: Off-diagonal (N, B) cells exist at every rung so that B- and N-dependence are separately identifiable.
        responsibility: feasibility
      - claim: Every conclusion carries grammar, C_max, rungs, conventions and the claim tier toy.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        P1 -- recovery complexity of INV-1, INV-7, INV-8, INV-A4, INV-A6 on
        each engine (nodes), and residual
      direction: different
      minimum_effect: >-
        Each recovered at <= 10 nodes with zero residual on both engines;
        PySR at the pinned seed reproduces itself bit-identically on a second
        run. Any control not recovered ends the line for that engine; a
        control recovered only above 10 nodes degrades every later bound.
    - metric: >-
        P2 -- committed-data check of INV-A1: Delta_null from the 2^14 and
        2^16 FB3 null means (Delta = conc_null/mu + 1 - mu) against
        1 - 3(B-1)/N
      direction: different
      minimum_effect: >-
        Agreement within 3 null SE of the mean (about 2e-3) at both rungs,
        for all three untyped geometries' shared nulls; the sketch value
        1 - 1/N is predicted to be REJECTED by more than 10 SE at 2^14.
        Zero new compute. A miss at either rung refutes INV-A1's leading term
        and it drops to `conjecture`.
    - metric: >-
        P3 -- held-out error at 2^20 of the best expression for Delta on the
        E x-interval arm, in null SE, versus the random-law expression
        (INV-A1) evaluated there
      direction: different
      minimum_effect: >-
        PREDICTED NULL: |Delta_obj - Delta_random| <= 3 null SE at 2^20 on
        every curve, and no front expression beats INV-A1's held-out error
        by more than 1 SE. ALIVE: an expression with explicit N- or
        B-dependence beyond INV-A1 that beats it by >= 5 SE at 2^20,
        replicated on >= 3 curves, absent on the Z/N random arm, and not the
        Z/N interval expression -- opens a proof obligation and a 2^22
        counterexample search; it is not evidence.
    - metric: >-
        P4 -- k-rich counts R_k for k in {2..8} on the E arms against the
        Poisson tail N P[Poisson(mu) >= k] and against the runs law at m = 2
        (INV-A2)
      direction: different
      minimum_effect: >-
        Agreement within 3 SE for every k with expected count >= 5 at m = 2
        (exact law) and at m = 3 (Poisson within the Janson bracket of
        86cd30). A replicated excess at some k_0 that GROWS with N across
        2^14..2^20 is the alive tail signature (INV-5b).
    - metric: >-
        P5 -- observation-collision set size on the Delta front per arm
        (number of distinct expressions within 1 SE of the best)
      direction: different
      minimum_effect: >-
        At least 3 on the diagonal-only data (B and N collinear), at most 1
        once the off-diagonal B-ladder is included. If the set does not
        shrink with the off-diagonal cells, the grammar's B/N separation is
        insufficient and no B-dependence claim may be made.
    - metric: >-
        P6 -- pre-registered n_vars = 21 deficit predictions from the three
        lowest-complexity fits to the DREG series 1,322 / 1,862 / 1,823 /
        1,999
      direction: different
      minimum_effect: >-
        Three numbers with complexities, emitted and hashed BEFORE any n = 21
        cell is run; scored only if EV-DREG-004's untouched cell is ever
        measured. No claim is made from four points, and the report must say
        the fit is unidentifiable at this sample size.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): freeze grammar, C_max = 12, node
      counting, input variables, seed, PySR release + Julia version by hash;
      write and hash the candidate list (INV-1..INV-9, INV-A1..INV-A6, INV-4c)
      and the closed-form control tables; verify INV-A6 and the `variance`
      column on all 288 FB3 cells. STAGE 0b (minutes): exhaustive m = 2
      enumeration at 8-16 bits for control (ii); integer convolution for
      control (iii). STAGE 0c (minutes, HARD GATE): both engines on the
      control tables; PySR run twice for bit-identity. STAGE 0d (zero new
      compute): P2 on the committed 2^14 / 2^16 null means. STAGE 1
      (CPU-hours at most): fit every target statistic on source (a) + (b)
      cells with N <= 2^18 per convention, predict 2^20; Pareto fronts and
      collision sets; score against the list. STAGE 2 (zero compute): open
      proof obligations for survivors; run their proves-too-much controls
      (already in the tables) and schedule the 2^22 counterexample search.
      CHEAPEST VALID DISCRIMINATOR: Stage 0d -- reading Delta_null off the
      committed 2^14 and 2^16 FB3 null means and comparing it with
      1 - 3(B-1)/N versus 1 - 1/N. It costs nothing, needs no sibling data,
      decides INV-A1's leading term outright, and is the first place the
      pipeline can be wrong.
    controls:
      - Recovery controls INV-1, INV-7 (exhaustively re-checked), INV-8, INV-A4, INV-A6 (blocking; zero residual, complexity <= 10)
      - Matched random-base null per cell (200 draws; null_mean / null_sd already committed for source (b))
      - Z/N interval base [1, B] positive control (blocking; Delta of order B^2 must be recovered)
      - Relabelled Z/N random base structure-destruction null
      - Bose-Chowla B_3 Sidon under-dispersion control
      - Small-multiples base with q-decay ladder (flat excess voids the arm)
      - Off-diagonal B-ladder at every N (identifiability control; P5)
      - Second PySR run at the same seed (bit-identity; blocking)
      - Ordering control: candidate list, grammar and control tables hashed before any measured table is read
    required_metrics:
      - enumerated expression count per C_max and engine
      - recovery complexity and residual of each control on each engine
      - Pareto front (complexity, held-out error in null SE) per statistic, arm and convention
      - observation-collision set per front point
      - scored candidate list (matched / unmatched / contradicted) per statistic
      - Delta_null from committed 2^14 / 2^16 / 2^18 null means versus INV-A1 and versus 1 - 1/N
      - k-rich profile R_k versus Poisson tail and runs law per arm and rung
      - proof obligations opened, each with control fibre and counterexample-search plan
      - three hashed n_vars = 21 DREG predictions with complexities
      - PySR version string and hash, Julia version, seed, wall clock, peak RSS

  falsification_conditions:
    - >-
      F1. A recovery control is not recovered, or is recovered only above 10
      nodes, on the primary engine. The pipeline is uninformative; no new
      expression may be reported; the record's Stage 1 and 2 are void until
      the grammar or engine is repaired and re-frozen under a new ID.
    - >-
      F2. PySR at the pinned configuration does not reproduce itself
      bit-identically. The secondary engine is dropped from every claim and
      the report says so.
    - >-
      F3. The committed 2^14 or 2^16 null means disagree with INV-A1's
      leading term by more than 3 SE. INV-A1 drops to `conjecture`; the
      predicted null of P3 is re-expressed against the measured null arm
      instead of a closed form.
    - >-
      F4. The Z/N interval positive control is fitted by the random-law
      expression within tolerance. The instrument is blind to over-
      dispersion; no null result on any E arm may be reported.
    - >-
      F5. The observation-collision set does not shrink when off-diagonal
      cells are added (P5). No B-versus-N claim may be made from this
      grammar.
    - >-
      F6. An 'alive' expression survives 2^20 but is also found on the
      relabelled Z/N random arm. It is a random-set law mis-filed as a curve
      law; it is re-filed and no curve claim is made.
    - >-
      F7. An expression survives 2^20 and its proves-too-much control, then
      fails the 2^22 counterexample search. It is recorded as refuted with
      the counterexample cell; no proof attempt is opened.

  confounders:
    - >-
      C1. SELECTION OVER MANY EXPRESSIONS. Thousands of expressions are tried;
      some fit four rungs by chance. Mitigation: Pareto reporting, the
      held-out rung, scoring against a list written before the fit, and
      reporting equal-error sets as sets. A single 'best' expression is never
      reported.
    - >-
      C2. CONSTANTS ABSORBING N-DEPENDENCE. A fitted real constant can hide
      a slowly varying function of N. Mitigation: constants are rational
      with bounded denominator on integer-valued targets; on real targets a
      constant is refitted on each rung subset and reported as drifting if it
      moves by more than its own uncertainty.
    - >-
      C3. CONVENTION MISMATCH ACROSS RECORDS. FB3 uses unsigned multisets of B
      distinct logs at m = 3 with whole-group targets; 86cd30 uses x-classes V
      and W = V u -V with signs at m = 2 over random bases; the symmetric FB3
      arm uses D u -D with B' = 2B (or 2B - 2 when a negation pair occurs);
      DREG's n is a variable count; KN-FIND-007's 1.1071 lives in
      Z/(q^3 - 1). Convention mismatch must be resolved by READING each
      record's convention into a `convention` column, never by rescaling;
      the 2^m factor and the forced term are candidate invariants, not
      preprocessing.
    - >-
      C4. COLLINEARITY OF B AND N on the matched-size diagonal
      B = ceil((6N)^(1/3)): any function of B is a function of N there.
      Mitigation: the off-diagonal B-ladder is a data requirement (P5).
    - >-
      C5. PSEUDO-REPLICATION. The 4 replicate seeds do not resample the
      deterministic x-line geometries (analysis.md section 8); error bars use
      a curve-cluster bootstrap over the 4 independent curves.
    - >-
      C6. GRAMMAR-SHAPED RESULTS (071255's confounder). 'Nothing beyond the
      random law was found' may mean 'the grammar cannot express it'. The
      grammar and C_max are reported with every conclusion.
    - >-
      C7. SIBLING DEPENDENCY. Sources (a) and (d) are sibling proposals not
      yet committed; if absent, (a) is replaced by this record's own
      enumeration and (d) is empty, and the report states which.
    - >-
      C8. ONE CELL WAS INSPECTED while deriving INV-A1 (disclosed above); the
      2^18 agreement is therefore not a pre-registered check, and only the
      2^14 / 2^16 null means and the 2^20 rung count as such.

  interpretation_limits:
    - >-
      Toy tier (N <= 2^22); no crypto-scale statement follows from any
      outcome; no exponent is moved by any outcome.
    - >-
      A recovered expression is a candidate invariant, never evidence
      (RQ-RELN-61638a constraint 4); a proof obligation is a task for a
      prover, not a result.
    - >-
      Over-dispersion is not a lever by itself: by conservation it LOWERS
      coverage, and clusters are exploitable only if they are locatable from
      x(R) without a discrete logarithm (INV-3, c5c614). An alive INV-4c
      outcome is a formula to prove, and only its pushforward along an
      x-decidable set could ever feed an exponent.
    - >-
      Every conclusion is scoped to the frozen grammar, C_max, conventions,
      rungs, curves and engines; 'the random law is the only closed form' is
      a coverage statement about the grammar, honest status `unverified` as
      a closure unless a named obstruction accompanies it.
    - >-
      No experiment, hypothesis, approval, status change or run is created by
      this record; no existing record is edited.

  heuristic_assumptions:
    - id: H1
      statement: >-
        RANDOM-BASE MODEL. For D a uniformly random B-subset of Z/N (N prime)
        and every ordered pair (A, A') of distinct m-multisets whose multiset
        difference is not c({a} - {b}), P[sum A = sum A'] = 1/N (1 + O(m^2/N));
        proportional differences collide with probability 0. Consequently
        E[Delta] = 1 - m(B-1)/N + O((1+mu)/N) (INV-A1) and the k-rich profile
        is Poisson(mu) to the same order.
      rigorous_support: >-
        Exact for i.i.d. uniform elements (a nonzero linear form in independent
        uniforms over a prime-order group is uniform) -- the classical
        uniformity statement it imitates; the distinct-element version is the
        same statement conditioned on an event of probability 1 - O(B^2/N),
        with the proportional pairs removed exactly.
      validation_plan: >-
        (1) Zero compute: Delta_null from the committed FB3 null means at
        2^14 / 2^16 / 2^18 against 1 - 3(B-1)/N (P2). (2) Exhaustive
        averaging over ALL B-subsets at N in {31, 61}, B in {4, 5}, m in
        {2, 3}: E[E_m] against M + (M(M-1) - P_prop)/N exactly, which
        isolates the O(M^2/N^2) remainder. (3) Monte Carlo, 10^4 random bases
        at N ~ 2^14 and 2^16, B on the off-diagonal ladder: empirical
        distribution of Delta and of R_k against Poisson(mu); tail check --
        the largest observed c(r) over all bases against the Poisson extreme-
        value prediction, and the smallest observed Delta against the Sidon
        floor 1 - mu. Sampled parameters recorded per cell; toy scale; no
        transfer assumption is made beyond 2^22.
    - id: H2
      statement: >-
        SEARCH COMPLETENESS. PySR at the pinned release, seed and
        configuration finds every expression of complexity <= C_max that the
        exhaustive engine finds on the same table, and the exhaustive engine
        is complete by construction up to C_max.
      rigorous_support: >-
        Exhaustive enumeration is complete up to C_max by definition; PySR's
        evolutionary search has no completeness guarantee, and the recalled
        review literature says its seed controls the result only in single-
        process mode. H2 is stated so that a PySR 'not found' is never used
        as evidence.
      validation_plan: >-
        Run both engines on the control tables and on every Stage 1 table;
        record every exhaustive-engine expression PySR misses and every PySR
        expression the exhaustive engine cannot reach (complexity > C_max).
        Comparison: agreement rate on the front up to C_max; a miss rate
        above 0 at any complexity demotes PySR's negatives at that complexity.
        Second PySR run at the same seed for bit-identity (blocking).
    - id: H3
      statement: >-
        RUNG TRANSFER. The (N, B)-dependence of every target statistic on the
        E arms is smooth enough between 2^18 and 2^20 that an expression
        fitted on three rungs and an off-diagonal ladder is meaningfully
        tested on a fourth; equivalently, the held-out error of a TRUE law is
        within the null SE.
      rigorous_support: >-
        The exact laws INV-1 and INV-7 transfer to any rung with zero error,
        which anchors the tolerance: a held-out failure of an m = 3
        expression is the expression's, not the rung's. This imitates the
        standard train/held-out logic of AI Feynman and PySR usage
        (recalled).
      validation_plan: >-
        Fit INV-1 and INV-7 on N <= 2^18 and confirm zero held-out error at
        2^20 and 2^22 before any m = 3 expression is judged; report the
        held-out error of INV-A1 on the RANDOM arm as the reference tolerance
        for the E arms.

  target_complexity:
    time_exponent: >-
      NOT AN EXPONENT PROPOSAL. Measurement/tooling: exhaustive count vectors
      cost O(N log N) per cell by FFT (seconds at 2^22); the grammar search
      costs O(#expressions x #cells) with #expressions exponential in C_max
      (millions at C_max = 12, CPU-minutes to hours); PySR CPU-hours at
      most. Relation collection is untouched.
    memory_exponent: >-
      O(N) integers per count vector at toy scale; negligible otherwise.
    best_known: >-
      Unchanged: Pollard rho with negation at 0.886 sqrt(N) group operations
      and O(1) memory; BSGS at sqrt(N) time and memory; no proven prime-field
      index-calculus advantage; the m = 3 cost ledger of IDEA-20260830-772cff
      at Theta(N^(2/3)).
    hidden_overhead: >-
      Nothing hides in an o(1) because nothing asymptotic is claimed. What is
      hidden is the grammar: the achievable expression set is a function of
      C_max and the operator list, both disclosed with every conclusion.
    tradeoff_note: >-
      Not applicable; no algorithm is produced. WHAT AN ALIVE INV-4c
      REFUTATION WOULD FEED: if E_3 (or a k-rich count) for an x-defined base
      exceeds the random law by a factor growing like N^(2 delta') across
      2^14..2^22 AND the excess mass sits on an x-decidable set S of density
      sigma, then the lift rho(D, S) of IDEA-20260830-c5c614 grows like
      N^delta with delta <= delta', and only a SUSTAINED delta > 0 moves the
      relation-collection exponent 1/2 -> (1 - delta)/2 there; excess energy
      that is not locatable from x(R) moves nothing (and lowers coverage by
      conservation). That number, with its interval per rung, is what this
      record would hand to the c5c614 ledger; the predicted value is
      delta' = 0.

  dominated_by: >-
    AS AN ATTACK: n/a (no result claimed); checked row by row on the prime-
    field frontier -- parallel rho with negation (0.886 sqrt(N), O(1)
    memory), BSGS, van Oorschot-Wiener, the generic sumset claw of
    IDEA-20260829-66a876, preprocessing S T^2 = N (KN-TECH-005), the
    Theta(N^(2/3)) m = 3 index-calculus ledger of IDEA-20260830-772cff --
    every row dominates the realised position trivially because none is
    mounted. AS AN INSTRUMENT: dominated by IDEA-20260806-071255 on breadth
    of object (it types every lens in a grammar; this record regresses a
    fixed list of statistics), by the sibling exhaustive battery
    IDEA-20260906-d1494b on raw measurement (this record consumes its
    tables), and by the three source records on the proved laws (it
    re-derives nothing they prove). Not dominated on the axis 'closed-form
    extraction with recovery controls, held-out rung and proof obligations',
    because no record in the corpus does that (novelty_screen).
  sota_delta: >-
    Cryptanalytic delta: 0 on time, 0 on memory, 0 on data. Measurement
    delta, as counts: 3 pre-registered recovery controls plus 2 sanity
    identities the instrument must pass; a candidate list of 9 seed
    invariants re-checked in-record with 3 corrections (INV-2' with-
    replacement scope, INV-2'' range claim, INV-4's two thresholds) and 6
    additional candidates (INV-A1..A6) each with a proof route; 1 new closed
    form (INV-A1, Delta_random = 1 - m(B-1)/N + O((1+mu)/N)) that is
    checkable on committed data at zero compute and replaces the seed's
    1 - 1/N as the null against which INV-4c is scored; and 3 hashed
    n_vars = 21 predictions for the DREG series in place of a fit.

  estimated_cost:
    implementation: medium
    compute: low
    basis: >-
      Implementation: grammar engine with exact rational constant fitting
      (~500 lines), PySR harness with pinning and bit-identity check (~100
      lines), three data adapters carrying conventions (~300 lines), the
      m = 2 exhaustive check and the integer convolution (reuse 86cd30 /
      093497 Stage 0 code paths, ~150 lines), FFT count vectors at 2^20 /
      2^22 if the sibling battery is absent (~100 lines). Compute: design
      figure, not a measurement -- Stage 0 minutes; Stage 1 under 10
      CPU-hours in total for both engines across all tables; 2^22 count
      vectors seconds per cell.
  recommended_priority: high
  priority_rationale: >-
    It is the user's stated gold standard, it costs almost nothing beyond
    the sibling battery it reads, its first discriminator (P2) needs no new
    data at all, and its null outcome is as useful as its alive one: an
    exact random-law expression for the E-arm statistics converts the cluster
    question into c5c614's lift question with an analytic null, while an
    alive outcome is a theorem statement rather than a model.

  honest_prior_of_survival: >-
    0.9 that both engines recover the three controls at <= 10 nodes. 0.8
    that INV-A1's leading term matches the committed 2^14 / 2^16 null means
    within 3 SE (the risk is the unwritten O((1+mu)/N) constant at 2^14
    where mu ~ 1.1 and B/N is largest). 0.85 that the E x-interval arm's
    Delta coincides with INV-A1 at 2^20 (the null outcome). 0.05 that any
    expression with genuine N-dependence beyond the random law survives
    2^20 and its controls. Most likely headline: 'every summary statistic of
    the count vector for x-line bases at toy scale is the random-set law,
    now stated as a closed form with its finite-B correction, and the
    cluster question is exactly the pushforward lift of c5c614'.

  open_directions: >-
    (1) If the null holds, the next object is the pushforward s(D | S) for
    x-decidable S from the 79ff48 predictor's features -- SR on the lift
    itself. (2) If INV-A1 fails at 2^14, the remainder term is the theorem
    to write; it is elementary. (3) The DREG series gains a held-out rung
    only when n_vars = 21 is measured; until then it is a prediction target.
    (4) m = 4 and the reduced signed convention are untouched here.

