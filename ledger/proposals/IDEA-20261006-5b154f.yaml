idea:
  id: IDEA-20261006-5b154f
  question_id: RQ-VOLC-f6253b
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Count of ordinary rational 7-isogeny edges whose Phi_7 root counts differ, for primes from 23 through 61
  class: measurement
  claim: >-
    REPRESENTATION AND STAGE. The tracked label is the j-invariant of a
    short Weierstrass model. R2 was read in RQ-ECDLP-623a32 as curve
    models; j is the isomorphism invariant of the model, not a point
    encoding. The collision-structure stage of an ECDLP attack is not
    claimed to change, and the discrete-log exponent delta versus
    Pollard rho is 0. For each prime p with 23<=p<=61 and p not equal
    to 7, and for each ordinary j in F_p (the curve is ordinary when
    its trace is nonzero), let d(j) be the number of distinct roots in
    F_p of the classical modular polynomial Phi_7(j,Y). An edge is an
    unordered pair of distinct ordinary j-invariants with
    Phi_7(j,j')=0. Let G be the number of those edges with d(j) not
    equal to d(j'). The claim is G>=1. Two explanations are
    discriminated. E-vertical: at least one rational 7-isogeny in the
    box joins vertices of different root counts. E-level: every such
    edge preserves d, so G=0. G=0 is the negative. This is not the
    floor-versus-crater gap of liftable S_3 roots on a 2-volcano, not
    an internal-versus-leaving count of supersingular 2-isogenies, and
    not an ECDLP algorithm.
  mechanism: >-
    OBJECT FRAME. The representation is the j-invariant (R2 as the
    invariant of the curve model). The operation set Sigma is the set
    of F_p-rational 7-isogenies between ordinary curves, a partial
    action on j-invariants: most pairs are not related. Trichotomy:
    branching. d(codomain) is not determined by a rule that always
    preserves d(source), which is what the count G measures. LOSSY
    PROJECTION. The projection discards j, the kernel polynomial, and
    the Weierstrass coefficients, and keeps one integer d(j) in
    {0,1,...,8}. Many j share a value, so it is lossy. Horizontal
    edges are the Sigma-steps compatible with keeping d; edges that
    change d are the branching. F3, an isogeny path, is a component
    only as a single edge. What is added is the integer |d(j)-d(j')|,
    not a path from a public key to a weak curve. F1, F2, and F4
    through F7 are not used. PRICED OPEN NUMBER. G, the number of
    root-count-changing edges in the box. No factor base is proposed.
  novelty_status: unverified
  citations:
    - ref: RQ-VOLC-f6253b
      provenance: internal
      claim: >-
        The question asks whether endomorphism-ring depth in an
        ell-isogeny volcano changes any measurable ECDLP attack cost,
        and it names rational ell-isogeny counts as the level label.
        Evidence is capped at toy tier. Depth is invisible on a
        prime-order subgroup if every endomorphism acts as a scalar.
      verified_by: idea-generator 2026-10-06 read ledger/questions/RQ-VOLC-f6253b.yaml
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Over a finite field, isogenous curves have the same number of
        points, and walking the isogeny class does not reach a
        different group-structure weakness class.
      verified_by: idea-generator 2026-10-06 read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        An automorphism group of order m reduces rho's iteration count
        by about sqrt(m). The exponent stays 1/2. For j=0 the factor
        is sqrt(6); for j=1728 it is sqrt(4).
      verified_by: idea-generator 2026-10-06 read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
    - ref: Kohel, thesis on endomorphism rings of elliptic curves, the isogeny volcano
      provenance: recalled
      claim: >-
        Rational ell-isogeny counts are the usual level label of an
        ell-volcano. The thesis was not opened in this session, so
        this record does not treat that description as a checked
        theorem and does not set novelty from it.
      verified_by: null
  assumptions:
    - >-
      Phi_7 means the classical modular polynomial of level 7, monic
      of degree 8 in each variable and symmetric. A polynomial that
      fails symmetry or degree is not Phi_7, and the run is invalid.
    - >-
      d(j) counts distinct F_p-roots, not multiplicity. A double root
      contributes 1.
    - >-
      Ordinary means the trace of Frobenius is nonzero. For p>3 this
      is the same integer condition as #E(F_p) not equal to p+1, and
      the test uses that count.
    - >-
      Self-roots Phi_7(j,j)=0 are not edges. An endomorphism loop is
      not a pair of distinct vertices.
  proof_search_map:
    not_applicable_reason: >-
      This is an existence count of edges in a finite box of primes.
      It is not a proof that volcano depth changes an ECDLP exponent.
    bottleneck: >-
      The integer G. A cost functional that is constant on edges is a
      different quantity and is not measured here.
    baseline_embedding:
      parameter_slice: primes p from 23 through 61 except 7, level ell=7, ordinary j only
      reproduction_check: >-
        On every scored edge, Phi_7(j,j')=Phi_7(j',j), both j are
        ordinary, and both d values are recomputed from a second
        factorization of the same univariate polynomial.
    observation_collision:
      observable: d(j)
      distinct_preimage_search: >-
        Two ordinary j with the same d and no edge between them are
        the collision the projection allows. The claim fails only when
        no edge changes d.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the fiber of one integer d under the ordinary j-line
        predicted_gain: G>=1, or an explicit G=0
    quantifier_order: >-
      Exists one unordered ordinary edge in the stated prime box with
      d(j) not equal to d(j'). Not for every edge, and not for every
      prime.
    method_ceiling:
      strongest_certifiable_claim: >-
        Either G>=1 in this box or G=0. The strongest attack-cost
        statement this method can support is that rho's exponent is
        unchanged across any scored edge, because the two curves share
        their point count.
      nearby_object_control: >-
        Supersingular j, those with #E(F_p)=p+1, are excluded. If the
        only root-count gap in the box is on a supersingular vertex,
        G for the ordinary graph is 0 and the claim fails. Emitting
        that supersingular gap as G is an invalid score.
    proof_obligations:
      - claim: G counts only ordinary, distinct, symmetry-checked edges.
        responsibility: correctness
  predictions:
    - metric: G, the number of ordinary 7-isogeny edges in the box with unequal Phi_7 root counts
      direction: higher
      minimum_effect: G at least 1
  minimal_test:
    design: >-
      For each prime p from 23 through 61 except 7, build Phi_7,
      factor Phi_7(j,Y) for every j in F_p, mark ordinary j by a
      point count different from p+1, and count unordered pairs of
      distinct ordinary roots with unequal d.
    controls:
      - >-
        Symmetry control: every scored edge satisfies
        Phi_7(j,j')=Phi_7(j',j). One asymmetric evaluation invalidates
        the polynomial.
      - >-
        Degree control: Phi_7 is degree 8 in Y. A different degree
        invalidates the run.
      - >-
        Supersingular exclusion: vertices with #E(F_p)=p+1 are not
        in G. A gap that exists only there does not score.
      - >-
        Same-point-count control: for one scored edge, compute both
        point counts. They must agree. A disagreement means the edge
        is not an F_p-isogeny of elliptic curves, and the instrument
        is invalid.
    required_metrics:
      - G
      - the number of ordinary edges in the box, including those that preserve d
      - one explicit edge (p, j, j', d(j), d(j')) if G>=1, or the statement that no edge exists
      - the point counts on one scored edge, or the statement that there was no edge
  falsification_conditions:
    - G=0 after a complete pass over the box. That integer is the negative.
    - Phi_7 fails the degree or symmetry check, so G is not a count of modular roots and the claim is not established.
    - The only gaps found touch a supersingular vertex. Ordinary G is then 0.
    - A scored edge has two different point counts. The isogeny label is then false and the claim is not established.
  confounders:
    - >-
      A prime with no ordinary rational 7-isogeny contributes 0 to G.
      The claim is about the whole box, so a single empty prime is not
      by itself the negative.
    - >-
      Multiple roots can make a naive multiplicity count differ from
      the distinct-root count. The definition uses distinct roots.
    - >-
      j=0 and j=1728 can carry extra automorphisms. They are allowed
      in the box as ordinary vertices, and a gap at those j is still
      a gap of d, not an automorphism discount on rho.
  interpretation_limits:
    - >-
      d(j) is the level label the question already names. A nonzero G
      says the label is non-constant on some edge in this box. It does
      not say that rho, BSGS, or index calculus changes cost across
      that edge. KR-RHO-755e35 says the point count is shared, so the
      rho exponent delta is 0.
    - >-
      KR-RHO-0528e7's sqrt(m) factor is a constant on automorphism
      orbits. This record does not measure that factor and does not
      claim a constant-factor attack.
    - >-
      No factor base is defined. This is not a KN-OPEN-020 escape.
  heuristic_assumptions:
    - id: H1
      statement: >-
        In the box 23<=p<=61, p not 7, the edges of the ordinary
        7-isogeny graph include at least one edge whose endpoints have
        different numbers of F_p-roots of Phi_7, at the same rate one
        would expect if a positive-density subset of ordinary curves
        lay off the crater.
      rigorous_support: >-
        Phi_7(j,Y)=0 is the proved condition for a cyclic 7-isogeny of
        the geometric curve. The distribution being imitated is that
        the volcano height is positive for a positive fraction of
        ordinary j, which is not proved for this box by this session.
      validation_plan: >-
        Compute G exactly in the box, which is small enough that the
        distribution claim is replaced by a census. Then compute the
        same G at ell=11 for the three primes 23, 29, and 31 only, and
        compare the sign of G-1/2. If G is 0 at ell=7 and positive at
        ell=11, or the reverse, the "some ell has a depth-changing
        edge" reading survives and the "every small ell is horizontal
        in this box" reading fails. No transfer to cryptographic p is
        claimed.
  target_complexity:
    time_exponent: >-
      Factoring Phi_7(j,Y) for all j and all p<=61 is polynomial in
      that fixed bound. The discrete-log exponent stays 1/2. Delta
      versus Pollard rho is 0.
    memory_exponent: O(1) per j beyond the degree-8 polynomial.
    best_known: >-
      Pollard rho at Theta(N^{1/2}) on any one curve in the box
      (KR-RHO-13bf67). Isogenous curves share N (KR-RHO-755e35).
    hidden_overhead: >-
      No o(1) discrete-log term. Building Phi_7 is a fixed
      precomputation for ell=7, not an attack cost.
    tradeoff_note: >-
      No collision-search tradeoff. The output is one integer G.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: low
  dominated_by: >-
    As an ECDLP method, walking these edges is dominated by Pollard rho
    on a single curve. The rows read were KR-RHO-755e35, KR-RHO-0528e7,
    KR-RHO-13bf67, and KR-RHO-53c89f. Same point count across an
    isogeny, an automorphism constant of at most sqrt(6), the generic
    Omega(sqrt(N)) bound, and pairing or anomalous attacks only on
    special traces. None of those rows gives the integer G, so they do
    not dominate the edge census. They dominate any claim that G moves
    an exponent.
  sota_delta: >-
    Discrete-log time-exponent delta versus Pollard rho is 0. Shared
    point count across a scored edge means both endpoints have the same
    Theta(N^{1/2}) rho cost. G is an edge count in a box of primes at
    most 61, not a speedup factor.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/generic-rho
    rows_checked:
      - KR-RHO-755e35
      - KR-RHO-0528e7
      - KR-RHO-13bf67
      - KR-RHO-53c89f
    nearest:
      - ref: KR-RHO-755e35
        provenance: internal
        relation: adjacent
        delta: >-
          That row fixes #E(F_p) across an F_p-isogeny, so the rho
          cost has delta 0 across an edge. The integer added here is
          G, the count of edges whose Phi_7 root counts differ. That
          row does not define G.
      - ref: KR-RHO-0528e7
        provenance: internal
        relation: orthogonal
        delta: >-
          Automorphism orbits cut rho's iteration count by sqrt(m)
          with m at most 6. The exponent delta is 0. G is not an
          iteration count, and this record claims no sqrt(m) factor.
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: orthogonal
        delta: >-
          The frontier match ranked the generic-group bound first.
          The discrete-log exponent delta versus Omega(sqrt(N)) is 0.
          G is an edge count, not a group-operation count.
    searched:
      corpus_grep:
        - >-
          ledger/proposals IDEA-*.yaml for Phi_7 root counts and
          degree-changing 7-isogeny: no matches of this edge count
        - >-
          ledger/proposals IDEA-*.yaml for Phi_7: hits are a cyclotomic
          polynomial in binary fields and a list that names Phi_7 among
          small modular polynomials inside IDEA-20260807-257001. Neither
          hit is a count of ordinary edges whose root counts differ.
