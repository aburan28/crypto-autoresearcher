idea:
  id: IDEA-20260816-ebedd8
  question_id: RQ-HAWK-001
  added: '2026-08-16'
  title: 'Read the failed density heuristic as a resource rather than an obstruction: the recorded
    measurement that the easy-instance density vanishes under bounded-denominator sampling is the
    shape of hypothesis a re-randomisation-as-mixing argument wants, and this entry names which theory
    takes it up and which cannot.'
  class: mechanism
  claim: '(A) KN-OPEN-028 records a closure with an unusual shape: the re-randomisation mechanism
    SURVIVED its cost correction (Q2, closed), while the density estimate attached to it FAILED, placing
    the algorithm in Case C - bounded-denominator sampling of fractional O_F-ideals, easy-instance
    density tending to zero as the bound grows (EV-HAWK-c99848, EV-HAWK-21edba, DEC-20260805-ed4cd3).
    Under docs/inventor-protocol.md section 4 an obstruction is a measurement and must be read twice;
    the second reading asks which theory wants it, and that reading has never been performed on this
    quantity. (B) The claim is that this obstruction has at least one taker, identifiable by a purely
    symbolic argument. A conjugation orbit, G mapping to U-star G U, that spreads so thinly over the
    attached nrd-PIP instances that no polynomial number of draws finds an easy one is, restated without
    changing a single quantity, an orbit that MIXES: the induced distribution on instance space does
    not concentrate on the easy stratum. A statement of that shape is the hypothesis, not the conclusion,
    of a random-self-reducibility argument, which needs exactly that a random re-representation of
    a fixed instance is spread over its class. The same measurement is therefore an obstruction to
    the attack and a candidate input to a worst-case-to-average-case statement about the same instance
    class. (C) The claim is that the reading is not free: it holds only if the spreading is over the
    whole class rather than merely over the complement of the easy stratum, and the difference between
    those two is a second, unmeasured quantity - the total variation between the conjugation-induced
    distribution and a canonical distribution on the class - which this entry names as the load-bearing
    unknown and specifies how to bound at toy scale. (D) NOT CLAIMED: that any random self-reduction
    for module-LIP exists or is provable; that the mixing holds; that KN-OPEN-028 is reopened, its
    Q1, Q2 and Q3 closures being consumed here as settled inputs rather than as questions; that HAWK
    is secure or insecure, or that a random self-reduction would make it either; that this bears on
    the ECDLP. No attack, no exponent, no security consequence.'
  mechanism: 'Stage 1 states the obstruction as a quantity with a scope, in the obstruction-block
    form of templates/research-records.md: the density d(R) of easy nrd-PIP instances among those
    reachable by conjugation with denominators bounded by R, with the recorded content being that
    d(R) tends to zero - a direction only. Stage 2 writes the two readings side by side as formal
    statements. Reading one, already recorded: d(R) small means guessing is super-polynomial. Reading
    two, the resource reading: let mu_G be the distribution on instances induced by conjugating a
    fixed G by short unimodular matrices drawn from the sampler; d(R) small says mu_G assigns little
    mass to the easy stratum. Stage 3 identifies what a random-self-reducibility argument actually
    requires, which is not that mu_G avoids a thin stratum but that mu_G is close to a canonical distribution
    on the whole class in total variation. Stage 4 exhibits the gap: closeness to canonical implies
    avoidance of a thin stratum, but avoidance does not imply closeness, so the recorded measurement
    is a necessary and not a sufficient condition for the resource reading. That asymmetry is the
    entry''s actual content and is derivable with no compute. Stage 5 makes the missing quantity measurable
    at toy scale: at small ring degree, enumerate the conjugation orbit of a fixed G under a bounded
    generating set of short unimodular matrices, bin the resulting instances by a computable conjugation-equivariant
    invariant, and compare the empirical bin distribution against that of instances sampled directly,
    by total variation. Stage 6 records which theories the reading serves - random self-reducibility
    of the class, and separately any argument needing that representation search is not a shortcut
    - and which it cannot, recording explicitly that a failed reading in which no theory takes it
    up is a complete and honest outcome under section 4 and is not a closure of the obstruction.'
  novelty_status: unverified
  novelty_screen:
    method: Read knowledge/open-problems/KN-OPEN-028.md in full with attention to its q2_closure text;
      read ledger/evidence/EV-HAWK-c99848.yaml and EV-HAWK-21edba.yaml in full for the Case C derivation
      and the definite versus indefinite correction. Read docs/inventor-protocol.md section 4 in full,
      including the resource_check paragraph and the obstruction-block requirement. Grep -ril 'hawk|module-lip|nrd-pip|nrdpip|lattice
      isomorphism' over ledger/proposals/ (11 hits, all titles read). Grep -ril 'fractional ideal'
      over ledger/proposals/ returned 0 files. Grep -ril 'unimodular' over ledger/proposals/ returned
      7 files.
    results: No proposal in ledger/proposals/ mentions fractional ideals at all, which is the specific
      arithmetic object the fourth heuristic's correction turns on. The seven unimodular hits sit
      in the tau-cocycle and Galois-involution lane (IDEA-20260805-6eac55, IDEA-20260805-128f35, IDEA-20260808-b1358c)
      and in ECDLP-side records; none treats the conjugation action as a mixing operator or asks what
      the vanishing density is a hypothesis for. KN-OPEN-028's own q2_closure says the re-randomisation
      mechanism SURVIVES and that it 'is a search over instance representations rather than over solutions,
      and docs/inventor-protocol.md asks generators to look for exactly that move' - so the corpus
      has flagged the mechanism as interesting but has not performed the resource reading on the density
      measurement itself. docs/inventor-protocol.md describes tools/obstruction_registry.py as deriving
      the standing obstruction set and re-posing this question at each rerank; I did not run it and
      do not know whether it already lists this obstruction, which is stated rather than assumed either
      way.
    verdict: 'UNVERIFIED. Claimed new: the specific resource reading identifying the vanishing easy-instance
      density as a necessary-but-not-sufficient condition for a mixing hypothesis, and the identification
      of the total-variation gap as the load-bearing unmeasured quantity. Assembled from known parts:
      the density measurement and its Case C derivation, already committed in EV-HAWK-c99848; the
      observation that re-randomisation searches representations rather than solutions, already written
      into KN-OPEN-028''s q2_closure; the resource-check discipline itself, adopted program-wide in
      docs/inventor-protocol.md section 4. What is genuinely new here is only the direction of implication
      and the naming of the gap. This program cannot read external literature and asserts nothing
      about whether such a reading exists outside.'
  object_first_candidate:
    tracked_object: 'The conjugation-induced distribution mu_G on nrd-PIP instance space: fix a public
      Gram matrix G, let U range over the short unimodular matrices the re-randomiser draws, and track
      the pushforward of the sampler''s distribution under the map sending U to the instance attached
      to U-star G U. The object followed is a probability measure on a class, not an instance and
      not a lattice.'
    lossiness: Genuinely lossy. Passing from the orbit to the induced measure on class invariants
      discards the identity of every individual instance, retaining only how much mass sits in each
      invariant bin. This is discarded compatibly with the operation of interest because the attack
      step - draw a conjugate, test whether it is easy - depends on the orbit only through the mass
      it places on the easy stratum, and a mixing argument depends on it only through bin masses too.
      What does not survive is any question about a particular conjugator or a particular instance,
      which is precisely why this object can characterise and cannot attack.
    propagation: 'One step of the target operation is a single re-randomisation draw: sample U, form
      U-star G U, read its class invariant. Under this step the tracked measure propagates by convolution
      with the sampler''s step distribution on the acting group, restricted to the invariant bins.
      It is deterministic at the level of the measure even though each draw is random, which is what
      makes the object trackable: the measure after k draws is the k-fold convolution, and ''does
      it mix'' is a question about that iteration.'
    survival_score: The measure-level description survives exactly as long as the class invariant
      used for binning is genuinely conjugation-equivariant. It dissolves at the first invariant separating
      instances the sampler cannot distinguish, and concretely it is expected to survive at ring degrees
      4, 8 and 16 with a determinant-and-genus-style invariant and to become uninformative by degree
      32, where the number of bins exceeds the number of orbit elements enumerable within budget.
      That crossover degree is itself a reportable number.
  null_object_control: 'The null object is a random instance of the same shape: instead of the conjugation
    orbit of a fixed G, draw the same number of instances directly and independently from a declared
    sampler on the class (matching determinant and rank, ignoring orbit structure), and run the identical
    binning and total-variation computation in the same invocation. For the signal arm to mean anything,
    the null must show near-zero total variation from the direct sampler by construction, establishing
    the estimator''s floor at the given sample size, and the orbit arm''s total variation must exceed
    that floor by more than the bootstrap confidence interval. If the orbit arm''s total variation
    is indistinguishable from the floor, the orbit is empirically as spread as direct sampling at
    this scale, which is recorded as a controlled null that strengthens rather than weakens the resource
    reading and must be reported as such rather than as a finding about the attack.'
  discriminated_from:
  - 'KN-OPEN-028 q2_closure: that closure states the re-randomisation mechanism survives its cost
    correction. This entry does not re-examine survival; it takes the closure as given and asks what
    the accompanying density measurement is a hypothesis for, which the closure does not address.'
  - 'EV-HAWK-c99848''s Case C derivation: that record establishes the direction of d(R). This entry
    does not re-derive it, does not dispute it and does not attempt to bound it - the magnitude question
    is a separate contract in this batch, deliberately kept apart so neither can borrow the other''s
    conclusion.'
  - 'IDEA-20260805-128f35 and IDEA-20260808-b1358c (involution census, third cocycle lattice): those
    track Galois symmetries and cocycle lattices as algebraic objects; this tracks a probability measure
    on instance space under a group action. Different object, different operation, no shared metric.'
  - 'Generic random-self-reducibility folklore for lattice problems: the move here is not to assert
    a self-reduction but to identify one specific already-measured quantity as a necessary condition
    for one, and to name the total-variation gap separating necessary from sufficient. Nothing is
    claimed to follow.'
  - 'IDEA-20260801-019 (independent reimplementation of the reported attack): that would run the attack;
    this deliberately never runs the subfield solve, because the resource reading is about the distribution
    and not about solve success.'
  assumptions:
  - The re-randomisation sampler's step distribution on short unimodular matrices can be specified
    concretely enough to enumerate at toy ring degree; where the route's exact sampler is unknown
    to this corpus, a declared substitute is used and the substitution is recorded as a scope limit
    rather than glossed.
  - A conjugation-equivariant class invariant computable in exact integer arithmetic exists at toy
    degree, with enough bins to be informative and few enough to estimate.
  - The easy stratum is thin in the sense the Case C derivation records; this is taken as given from
    EV-HAWK-c99848 and is not re-tested here.
  - Total variation on binned invariants is a meaningful proxy for total variation on the class. This
    is false in general and is recorded as the principal scope limit, with the bin count reported
    alongside every total-variation number.
  predictions:
  - metric: total variation between the orbit-induced bin distribution and the direct-sampler bin
      distribution, at ring degree 8
    direction: higher
    minimum_effect: must exceed the estimator floor established by the null arm by at least 3 bootstrap
      standard errors to count as non-mixing at this scale
  - metric: number of distinct invariant bins reached by the enumerated orbit, as a fraction of bins
      reached by direct sampling at equal sample size
    direction: lower
    minimum_effect: 0.8; below this the orbit is measurably confined and the resource reading is weakened
      at this scale
  - metric: crossover ring degree at which bin count exceeds enumerable orbit size
    direction: different
    minimum_effect: 'refusal to pre-commit: this depends on the chosen invariant''s bin growth, which
      is not known before the invariant is fixed, and guessing it would be a fabricated expectation'
  - metric: whether the run identifies at least one named theory taking the obstruction as hypothesis
    direction: different
    minimum_effect: 'forced value: at least 1, or an explicitly recorded ''examined: true, no taker'',
      which is a complete and honest outcome and not a failure'
  minimal_test:
    design: 'The symbolic half costs nothing and is the primary deliverable: write the two readings
      as formal statements, exhibit the implication direction (closeness to canonical implies avoidance
      of a thin stratum; avoidance does not imply closeness), and name the total-variation gap. That
      alone discriminates the entry, because if the implication runs both ways the resource reading
      is free and there is nothing to measure. The measured half is deliberately minimal: at ring
      degrees 4 and 8 only, fix one G built by a declared HAWK-shaped rule, enumerate the conjugation
      orbit under a bounded word-length generating set of short unimodular matrices, compute one exact-integer
      conjugation-equivariant invariant per orbit element, and bin. In the same invocation, draw an
      equal number of instances directly from a declared sampler and bin identically. Report total
      variation between the two binned distributions with a bootstrap interval, plus the null arm''s
      estimator floor from two independent direct samples. Total compute is minutes at degree 4 and
      under an hour at degree 8, with exact integer arithmetic and no lattice reduction.'
    controls:
    - 'Null arm: two independent direct samples binned against each other in the same invocation,
      establishing the estimator''s floor at the sample size used.'
    - 'Second base point control: repeat the orbit enumeration from a different G on the same class;
      if orbit total variation differs materially between base points, the quantity is base-point
      dependent and must be reported per base point.'
    - 'Invariant sensitivity control: run the identical pipeline with a second, coarser conjugation-equivariant
      invariant and report both; a conclusion that flips with bin granularity is reported as granularity-dependent.'
    - 'Word-length control: report total variation as a function of generating-word length 1 through
      L, so that any mixing claim is a claim about a curve rather than about one point.'
    - Equivariance unit test on the chosen invariant over random conjugates, run before any measurement.
    required_metrics:
    - total variation between orbit-induced and direct-sampler bin distributions, per ring degree
    - estimator floor from the null arm at matched sample size
    - bootstrap confidence interval on each total variation
    - bin coverage fraction of the orbit relative to direct sampling
    - total variation as a function of word length
    - number of orbit elements enumerated and the enumeration budget consumed
  falsification_conditions:
  - The symbolic stage shows the implication runs both ways - avoidance of the easy stratum does imply
    closeness to canonical under the sampler in question - in which case the resource reading is free,
    nothing needs measuring, and this entry collapses into the already-committed closure.
  - 'Orbit total variation sits at the null arm''s estimator floor at every word length and both ring
    degrees, meaning the orbit is empirically indistinguishable from direct sampling at this scale:
    a controlled null which supports the resource reading and refutes this entry''s premise that a
    gap needs measuring.'
  - The chosen invariant fails the conjugation-equivariance unit test, invalidating the binning.
  - Bin coverage collapses below 0.2 at ring degree 4, meaning the orbit is confined enough that the
    mixing reading is unavailable at any scale this program can reach.
  - 'No theory is identified that takes the obstruction as hypothesis, recorded as ''examined: true,
    no taker'' - an honest complete outcome that falsifies claim (B) specifically.'
  confounders:
  - The re-randomisation sampler used by the route is not held in this corpus; a declared substitute
    may mix better or worse than the real one, and any measured total variation is a statement about
    the substitute.
  - Enumeration budget silently truncates the orbit, and a truncated orbit looks less spread than
    the real one, so bin coverage is confounded with budget and must be reported jointly with orbit
    size.
  - EV-HAWK-21edba records that an earlier record confused the definite quaternion setting with the
    indefinite one; the same confusion would corrupt any invariant chosen from quaternion-order intuition
    rather than from the number-field setting that correction identifies as relevant.
  - Binned total variation systematically underestimates true total variation, so a small measured
    value is weak evidence of mixing while a large one is strong evidence against it; this asymmetry
    must be stated with every number.
  interpretation_limits:
  - A necessary condition being satisfied is not a self-reduction; no run under this contract can
    produce one and none is claimed.
  - Everything measured is at ring degrees 4 and 8 under a declared substitute sampler, and no extrapolation
    to HAWK's parameters, to the route's sampler, or to any security statement is licensed.
  - KN-OPEN-028 stays closed; this entry consumes its closures as settled inputs and produces no answer
    to any of its three questions.
  - 'A ''no taker'' outcome closes nothing about the obstruction: under docs/inventor-protocol.md
    section 4 it records only that this session found no theory, and later sessions may.'
  target_complexity:
    time_exponent: 'No attack exponent is claimed, and this entry deliberately produces none: the
      measured quantity is a distributional distance, which has no exponent interpretation. The measurement
      itself costs orbit size times invariant cost, both bounded by the declared budget.'
    memory_exponent: No attack memory exponent is claimed. Storage is one integer vector per orbit
      element at degree at most 8, kilobytes to megabytes.
    best_known: The incumbent for HAWK-shaped key recovery in this corpus remains Straznickas-Weis,
      unconditional, 2^{(n/2+1)+o(n)} (KN-LIT-7592). The nrd-PIP route itself is recorded as super-polynomial
      with no sub-exponential advantage established (EV-HAWK-c99848). This entry is not on that frontier
      at all.
    hidden_overhead: 'Two things hide here. First the substitute sampler: choosing it is a research
      decision disguised as an implementation detail, and every number depends on it. Second the human
      cost of the symbolic stage, which is where the entry''s real content lives - the implication-direction
      argument is short but must be right, and a wrong direction makes the whole measured half pointless.'
  dominated_by: 'Checked against every route row recorded in KN-OPEN-028''s live-surface table - Straznickas-Weis
    at 2^{(n/2+1)+o(n)} (KN-LIT-7592); the nrd-PIP route at super-polynomial, underived (KN-LIT-7674);
    definite/indefinite LIP reporting HAWK unaffected (KN-LIT-7648); the SLIP AM-intersect-coAM ceiling
    (KN-LIT-7671) - plus generic lattice reduction on the 2n-dimensional lattice. No attack or improvement
    is produced, so no frontier row is entered: n/a (no result claimed).'
  sota_delta: No attack; conceptual and measurement contribution only. The quantities moved are the
    direction of implication between the recorded density measurement and a mixing hypothesis, which
    goes from unstated to stated, and an empirical binned total variation at ring degrees 4 and 8,
    which goes from unmeasured to measured with an error bar and a null-arm floor.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part (B), that a resource reading exists and is statable: 0.7 - the shape
    of the measurement, a distribution avoiding a stratum, is a familiar hypothesis shape, so a taker
    is likely, but that likelihood is a judgement about mathematics I have not done. Part (B) as specifically
    a random-self-reducibility taker rather than some other theory: 0.4, because self-reduction arguments
    need closeness to a canonical distribution and the gap named in part (C) may be unbridgeable in
    this setting. Part (C), that the total-variation gap is the load-bearing unknown and not some
    other quantity: 0.6. That the toy measurement at degrees 4 and 8 is informative rather than budget-limited
    into noise: 0.45, with the enumerable-orbit versus bin-count crossover the main risk. Probability
    the honest outcome is ''examined: true, no taker'': 0.25, and that outcome is recorded as complete
    rather than as failure.'
