idea:
  id: IDEA-20260806-bcbcf5
  question_id: RQ-SSI-001
  added: '2026-08-06'
  title: >-
    RANDOM-MATRIX ANALYSIS OF ISOGENY GRAPHS HAS THE WRONG NULL, AND USING IT
    GUARANTEES A FALSE POSITIVE: the eigenvalues are Hecke eigenvalues, so a
    measured deviation from GOE is the arithmetic, not a weakness -- and the
    eigenvalue/eigenvector split forces the whole spectral lane's budget, since
    eigenvalues carry ZERO bits about any individual curve and eigenvector
    coordinates cost the full class number
  class: measurement

  claim: >-
    (A) THE ABELIAN SIDE IS VACUOUS, IN ONE LINE. For the ECDLP the natural
    "matrix from group operations" is the adjacency operator of a Cayley graph on
    the cyclic group <P>. That group is abelian, so the operator is diagonalised
    by the characters and every eigenvalue is an EXPLICIT character sum
    sum_{s in S} omega^{s j}. There is no ensemble, no universality class, and
    nothing random: the spectrum is a closed formula. Tracy-Widom, GOE spacing,
    and spectral-gap universality have no content here, and this is the same
    character-orthogonality wall KN-OPEN-010 expects the transfer-operator lane to
    hit. Random matrix theory applied to the ECDLP group is not a promising lane
    with an unknown answer; it is a computation whose answer is already written.

    (B) THE ISOGENY SIDE IS GENUINELY NON-ABELIAN, AND THAT IS WHERE THE TRAP IS.
    The supersingular ell-isogeny graph is a connected (ell+1)-regular Ramanujan
    graph on about p/12 vertices, and its adjacency matrix is the Brandt matrix.
    Its eigenvalues are NOT drawn from a Wigner ensemble: they are Hecke
    eigenvalues attached to weight-2 modular forms of level p, constrained by the
    Ramanujan bound |a_ell| <= 2 sqrt(ell), with an explicit Eisenstein
    eigenvalue ell+1. RECALLED, NOT RE-READ IN THIS SESSION, AND STAGE 0 VERIFIES
    IT. The consequence is a prediction about anyone who runs the obvious
    experiment:
      A LEVEL-SPACING TEST AGAINST A GOE NULL WILL REPORT A DEVIATION, AND THE
      DEVIATION WILL BE THE ARITHMETIC.
    That is the canonical artifact tell of docs/inventor-protocol.md section 3 in
    a new setting: a signal that is real, reproducible, and means nothing about
    cryptographic weakness. The correct null is the arithmetic one -- the
    Plancherel / Sato-Tate-type measure for Hecke eigenvalues at ell -- and the
    research question is whether there is a deviation from THAT.

    (C) THE BUDGET, FORCED BY WHERE CURVE-SPECIFIC INFORMATION LIVES. The
    eigenvalues of the Brandt matrix are a property of the WHOLE GRAPH at a given
    p: they are identical no matter which vertex you are standing on. So no
    eigenvalue statistic can carry a single bit about an individual curve, which
    is what every attack in this lane would need. Curve-specific information lives
    entirely in the EIGENVECTOR COORDINATES at that vertex -- which are, up to
    normalisation, the Gross-period / theta-coefficient data of that curve's
    lattice. Computing an eigenvector coordinate requires the graph, whose size is
    about p/12. HENCE: eigenvalue methods cost little and learn nothing about a
    vertex; eigenvector methods learn everything and cost the class number. There
    is no intermediate regime unless someone exhibits a sublinear-time estimator
    for a single eigenvector coordinate, and naming that as the ONLY opening is
    the useful output of this analysis.

    (D) THE ONE STRUCTURE WORTH MEASURING, AND IT IS FORCED RATHER THAN HOPED.
    The Frobenius conjugation E |-> E^{(p)} is an involution on the vertex set
    that commutes with the ell-isogeny adjacency operator. So the operator
    decomposes into its +1 and -1 eigenspaces under that Z/2 action, and the
    fixed locus of the involution is exactly the F_p-rational subset -- the
    Delfs-Galbraith target set, of size about sqrt(p). The multiplicity
    difference between the two symmetry sectors is therefore pinned by a
    fixed-point count, which is a DERIVABLE FORCED VALUE and an exact instrument
    check. The genuinely open question sits on top of it: beyond what this
    symmetry forces, is any eigenvector LOCALISED -- concentrated on a small
    vertex set? A localised eigenvector would be a computationally distinguished
    subset of the supersingular graph, which is precisely what a path-finding
    algorithm wants and what the Ramanujan property is normally taken to forbid.
    Ramanujan expansion bounds the spectral gap, not eigenvector localisation, so
    the question is not closed by citing expansion.

    (E) WHAT THIS IS NOT. NOT a claim that isogeny graphs are weak. NOT a claim
    that a deviation from the arithmetic null exists. NOT an attack. The
    deliverable is the correct null, the forced budget of (C), the symmetry
    check of (D), and a localisation measurement with a pre-registered
    interpretation for both outcomes.

  discriminated_from:
    - >-
      KN-TECH-017 (transfer operators and Koopman spectral methods) and
      KN-OPEN-010 / RQ-TRA-001 / EV-TRA-001. Those study the coarse-grained
      TRANSLATION operator on the ECDLP group -- the abelian side of (A) -- and
      ask whether coarse-graining can localise k. This proposal takes that as the
      settled vacuous case and moves the spectral question to the non-abelian
      isogeny graph, where the operator is not diagonalised by characters.
    - >-
      IDEA-20260805-c4f675 (the H-PSEUDO character-sum constant has never been
      divided by its own null). Same discipline -- a statistic reported without
      its correct null -- applied to a different object. This record is the
      isogeny-side instance of that failure mode and cites it as the precedent.
    - >-
      IDEA-20260804-170692 (local transport signatures) and IDEA-20260804-4c9ac0
      (kernel-Frobenius type profiles). Those track path-local data; this one
      analyses the global spectral object. Section (C) constrains them usefully:
      any vertex-distinguishing statistic must ultimately be eigenvector-side
      information, so those proposals are implicitly estimating eigenvector
      coordinates by local sampling, and the budget in (C) is the ceiling they
      face.
    - >-
      "Tracy-Widom", "level spacing", "GOE" as a matrix ensemble: ZERO genuine
      hits in this repository -- the 108 apparent "GOE" matches are substrings of
      "goes" and the surname "Goel". "random matrix" occurs in seven files, all
      lattice-side or literature. The lens is absent from this program.

  object_first_candidate:
    tracked_object: >-
      THE SPECTRAL DATA OF THE BRANDT / ell-ISOGENY OPERATOR at a fixed p: the
      eigenvalue multiset, its symmetry-sector decomposition under Frobenius
      conjugation, and the eigenvector coordinate profile.
    lossiness: >-
      The eigenvalue multiset is MAXIMALLY LOSSY with respect to individual
      curves -- one value for the whole graph, fibre = every vertex -- which is
      exactly (C). The eigenvector coordinate vector is not lossy at all. The
      object therefore splits cleanly into a useless-and-cheap half and an
      informative-and-expensive half, and recording that split is the deliverable.
    propagation: >-
      Eigenvalues are invariant under every isogeny step (they are graph
      invariants), so they propagate perfectly and carry nothing. Eigenvector
      coordinates transform by the adjacency action, which is exactly a walk --
      so following them IS path-finding. The zero-information and
      full-information cases are the two endpoints, with nothing between.
    survival_score: >-
      Eigenvalues survive everything, forever, uselessly. Eigenvector coordinates
      survive one step at cost ell+1 branching, which is the ordinary walk.

  mechanism: >-
    STEP 1 -- ESTABLISH THE CORRECT NULL FROM PRIMARY TEXT. Stage 0 obtains the
    precise statement of the Brandt-matrix / Hecke-eigenvalue correspondence and
    the eigenvalue distribution it implies at level p and weight 2, and writes it
    into a knowledge entry. Everything downstream is a comparison against that
    null, so quoting it from memory is not acceptable and the record says so.

    STEP 2 -- BUILD THE GRAPH TWICE AND CHECK THE COUNT. At each toy p construct
    the supersingular vertex set by two independent methods that must agree
    exactly, and check the vertex count against the classical mass formula. No
    spectral quantity is computed before this passes.

    STEP 3 -- THE SYMMETRY CHECK, WHICH IS THE INSTRUMENT'S CALIBRATION. Compute
    the Frobenius involution on vertices, decompose the operator into its two
    symmetry sectors, and check the multiplicity difference against the derived
    fixed-point count -- i.e. against the size of the F_p-rational subset, which
    is independently computable as a class number. Exact integer agreement is
    required. This is the check that the spectral pipeline is measuring the
    graph and not its own indexing.

    STEP 4 -- SPACING STATISTICS AGAINST BOTH NULLS. Compute the level-spacing
    distribution and compare it against (i) the GOE prediction and (ii) the
    arithmetic null from Step 1. Report BOTH comparisons in the same table. The
    pre-registered interpretation: agreement with the arithmetic null and
    disagreement with GOE is the CONFIRMATION branch and asserts nothing about
    security; agreement with GOE would mean the graph is more generic than the
    arithmetic predicts, which is the surprising branch and would itself be a
    finding about the modular-forms side rather than about cryptography.

    STEP 5 -- LOCALISATION. Compute the inverse participation ratio of every
    eigenvector and compare against the delocalised prediction for a random
    vector of the same dimension. Any eigenvector localised beyond what the
    Frobenius symmetry of Step 3 forces is the one result in this record that
    would be cryptanalytically interesting, and it must be reproduced at three
    primes before it is recorded.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      grep -ril over ledger/, knowledge/, docs/ for "random matrix",
      "Tracy-Widom", "level spacing", "spectral gap", "Brandt", "eigenvector",
      "inverse participation", performed 2026-08-06 against merge-base 0c856274.
    results: >-
      "Tracy-Widom", "level spacing", "inverse participation": ZERO hits. "random
      matrix": seven files, none isogeny-side. Brandt matrices appear in
      supersingular contexts but no record computes or analyses their spectrum.
      No record in this repository states the arithmetic null or the
      eigenvalue/eigenvector information split.
    verdict: >-
      ADAPTATION. The Ramanujan property of these graphs, the Brandt-Hecke
      correspondence, and arithmetic-quantum-chaos spacing statistics are all
      published; none is claimed as new here, and the specific eigenvalue
      distribution is RECALLED AND UNVERIFIED until Stage 0. What is new to this
      program is the null-correctness argument and the budget split. No novelty
      is claimed against the external literature, where spacing statistics for
      arithmetic graphs are a studied subject that Stage 0 must locate.

  null_object_control: >-
    THE ENTIRE POINT OF THE RECORD IS THAT THE OBVIOUS NULL IS WRONG, so the
    controls are unusually load-bearing. (1) CORRECT NULL: the arithmetic
    (Hecke-eigenvalue) distribution, established in Stage 0 before any
    measurement. (2) INCORRECT NULL, RUN DELIBERATELY: GOE. Reporting both is
    what demonstrates the artifact rather than asserting it. (3) SAME-SHAPE
    RANDOM GRAPH: a random (ell+1)-regular graph on the same number of vertices,
    which should match GOE and NOT match the arithmetic null -- this is what
    proves the two nulls are distinguishable by the instrument at the tested
    sizes. Without (3), a claim that the arithmetic null fits better is not
    supported, because the two nulls might be indistinguishable at that graph
    size.

  assumptions:
    - >-
      The Brandt-Hecke correspondence and the Ramanujan bound hold as recalled.
      Verified at Stage 0; the record is void without it.
    - >-
      Toy p up to roughly 10^4, so the full vertex set and its spectrum are
      computable. Every measured statistic is scoped there, and finite-size
      effects on spacing statistics are expected to be large at p/12 in the
      hundreds -- which is why (3) above is required rather than optional.
    - >-
      ell is a small fixed prime; the spectrum depends on ell and every reported
      statistic names it.

  proof_search_map:
    bottleneck: >-
      Whether any eigenvector coordinate at a single vertex is estimable in time
      sublinear in the class number. That is the only opening (C) leaves, and the
      whole lane's value depends on it.
    baseline_embedding:
      parameter_slice: >-
        The Eisenstein eigenvalue ell+1 with its all-ones eigenvector must appear
        exactly, at every p and ell.
      reproduction_check: >-
        Exact: the largest eigenvalue equals ell+1 and its eigenvector is
        constant. Integer and exact-rational comparison, no tolerance. A pipeline
        that misses this is not computing the adjacency spectrum.
    observation_collision:
      observable: >-
        The eigenvalue multiset.
      distinct_preimage_search: >-
        NOT A SEARCH BUT A DERIVATION, AND IT IS TOTAL: every vertex of the graph
        has the same eigenvalue multiset, so the collision class is the entire
        vertex set. That is statement (C) and it is what makes eigenvalue-based
        vertex distinguishing impossible rather than merely hard. The audit is
        satisfied in the strongest possible way and the conclusion is recorded as
        an obstruction rather than as a difficulty.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the eigenvalue multiset fixed (automatic) and vary the vertex,
          looking for an intrinsic invariant that distinguishes vertices and is
          computable below class-number cost.
        predicted_gain: >-
          Predicted none; the eigenvector coordinate is the natural candidate and
          costs the class number. An exception would be the finding.
      - transform: stronger_invariant
        proposed_object: >-
          The symmetry-sector decomposition under Frobenius conjugation --
          preserving more state than the raw multiset, because the sector
          multiplicities see the fixed locus that the multiset does not.
        predicted_gain: >-
          An exact fixed-point identity usable as an instrument check, and a
          principled place to look for localisation.
    quantifier_order: >-
      The claim: FORALL p, FORALL ell, FORALL vertices E, E' of the ell-isogeny
      graph, the eigenvalue multiset computed at E equals that computed at E'.
      This is trivially true because the multiset is a graph invariant -- and
      that triviality IS the content, since it is exactly what a vertex-
      distinguishing method would need to be false. The quantifier order to watch
      is in the localisation claim, where "EXISTS an eigenvector FORALL primes"
      and "FORALL primes EXISTS an eigenvector" are different statements and only
      the second is testable at three primes.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At these p and ell, the spacing statistics match the arithmetic null and
        not GOE, and no eigenvector is localised beyond what the Frobenius
        symmetry forces." NEVER a hardness claim, and never an asymptotic claim
        from three toy primes.
      nearby_object_control: >-
        A random (ell+1)-regular graph of the same size, where the arithmetic
        structure is absent by construction. The method must distinguish it from
        the isogeny graph. If it cannot, the instrument lacks the resolution to
        support any statement about which null fits, and every conclusion in
        Step 4 is withdrawn.
    proof_obligations:
      - claim: The arithmetic null is correctly stated from primary text.
        responsibility: baseline
      - claim: The Eisenstein eigenvalue ell+1 appears exactly.
        responsibility: correctness
      - claim: Sector multiplicity difference matches the fixed-point count.
        responsibility: correctness
      - claim: The two nulls are distinguishable at the tested graph sizes.
        responsibility: success_probability
      - claim: Eigenvalue statistics carry no vertex-specific information.
        responsibility: scope

  predictions:
    - metric: >-
        goodness of fit of the level-spacing distribution to the arithmetic null
        versus to GOE
      direction: different
      minimum_effect: >-
        The arithmetic null fits materially better, and the random-regular-graph
        control shows the reverse ordering. Both halves required; the second is
        what shows the instrument can tell the nulls apart at this size.
    - metric: >-
        multiplicity difference between the two Frobenius symmetry sectors
      direction: different
      minimum_effect: >-
        Exact integer agreement with the independently computed size of the
        F_p-rational subset. Any mismatch halts the run as an instrument failure.
    - metric: >-
        maximum inverse participation ratio over eigenvectors, versus the
        delocalised prediction
      direction: different
      minimum_effect: >-
        Predicted: no localisation beyond the symmetry sectors. A localised
        eigenvector reproduced at three primes is the one cryptanalytically
        interesting outcome and triggers a full hand analysis before any claim.
    - metric: >-
        number of bits about an individual vertex extractable from the eigenvalue
        multiset
      direction: different
      minimum_effect: >-
        Exactly 0, by derivation. Stated as a prediction so that any analysis
        claiming otherwise is visibly in conflict with a derivation rather than
        with an expectation.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): obtain and state the arithmetic null; derive the
      fixed-point identity of (D); derive the (C) budget.
      STAGE 1 (minutes, HARD GATE): build the vertex set twice at each toy p;
      check against the mass formula; confirm the Eisenstein eigenvalue.
      STAGE 2 (HARD GATE): the symmetry-sector check against the fixed-point
      count, exact integers.
      STAGE 3 (HARD GATE): the random-regular-graph control, establishing that
      the two nulls are distinguishable at these sizes.
      STAGE 4 (minutes): spacing statistics against both nulls, reported together.
      STAGE 5 (minutes): eigenvector localisation, three primes.
    controls:
      - arithmetic (Hecke) null, established before measurement
      - GOE null, run deliberately to exhibit the artifact
      - random (ell+1)-regular graph of the same size
      - two independent vertex-set constructions plus the mass-formula count
      - Eisenstein eigenvalue exactness
    required_metrics:
      - full eigenvalue multiset per (p, ell), with sector labels
      - spacing-distribution fit statistics against both nulls, and for the
        random-graph control
      - sector multiplicity difference versus fixed-point count
      - inverse participation ratio per eigenvector
      - vertex count versus mass formula
      - wall-clock and memory, and the largest p reached

  falsification_conditions:
    - >-
      The Eisenstein eigenvalue is absent or wrong. Instrument failure; nothing
      reported.
    - >-
      The sector multiplicity difference disagrees with the fixed-point count.
      Either the derivation in (D) is wrong or the implementation is; the run
      halts either way.
    - >-
      The random-regular-graph control is not distinguishable from the isogeny
      graph. The instrument lacks resolution and all Step 4 conclusions are
      withdrawn.
    - >-
      Spacing statistics match GOE and not the arithmetic null. The recalled
      Brandt-Hecke picture is wrong or misapplied; this is a finding about the
      modular side and the record is superseded rather than amended.
    - >-
      A localised eigenvector is found beyond the symmetry sectors, at three
      primes. (C)'s conclusion that spectral methods offer no intermediate regime
      is refuted, and this becomes a live direction.

  confounders:
    - >-
      USING GOE AS THE NULL. This is the artifact the record exists to prevent
      and it would produce a confident, reproducible, meaningless deviation.
    - >-
      Finite-size effects. At p ~ 10^4 the graph has under a thousand vertices
      and spacing statistics are noisy; the random-graph control is what makes
      any comparison interpretable, and without it the whole of Step 4 is
      uninterpretable rather than merely weak.
    - >-
      ell-dependence. The spectrum changes with ell; a statistic measured at one
      ell says nothing about another, and every number must name it.
    - >-
      Reading eigenvalue results as vertex-level results. (C) forbids it, and the
      forbidding is a derivation, not a caution.

  interpretation_limits:
    - >-
      Scoped to the tested primes, the tested ell, and the ell-isogeny graph over
      F_{p^2}. Three toy primes support no asymptotic statement, and a spacing
      statistic measured at one ell says nothing about another.
    - >-
      A match with the arithmetic null is a CONFIRMATION of known structure and
      asserts nothing whatever about the hardness of path-finding or EndRing.
    - >-
      The information split in (C) is a statement about eigenvalue and
      eigenvector data specifically. It does not bound spectral-adjacent methods
      that never form the operator, and it must not be summarised as closing
      "spectral methods".
    - >-
      The Brandt-Hecke correspondence and the eigenvalue distribution are
      RECALLED and unverified until Stage 0. Every downstream claim inherits that
      status until the primary text is read.

  heuristic_assumptions:
    - id: H1
      statement: >-
        At the tested graph sizes, the level-spacing distribution of the
        ell-isogeny adjacency operator is closer to the arithmetic
        (Hecke-eigenvalue) prediction than to the GOE prediction, and the gap is
        larger than the finite-size fluctuation measured on a random regular
        graph of the same size.
      rigorous_support: >-
        Rigorous side: the eigenvalues are Hecke eigenvalues subject to the
        Ramanujan bound |a_ell| <= 2 sqrt(ell), which is a hard constraint no
        Wigner ensemble satisfies. Heuristic side: that this constraint dominates
        the observed spacing behaviour at graph sizes in the hundreds, rather
        than being swamped by finite-size noise -- which is exactly what the
        random-graph control measures rather than assumes.
      validation_plan: >-
        Compute spacings at a ladder of at least eight primes spanning a factor
        100 in p, at two values of ell, and fit the gap between the two nulls as
        a function of graph size. Comparison distributions: the arithmetic
        prediction and the GOE prediction, both computed explicitly; and the
        random-regular-graph control, which supplies the finite-size fluctuation
        scale. Tail check: the extreme spacings, where the Ramanujan bound bites
        hardest and the two nulls differ most. Toy scale only and labelled so;
        this validates a finite-size pattern, not an asymptotic statement.

  target_complexity:
    time_exponent: >-
      NOT AN EXPONENT PROPOSAL. The output is a null-correctness result and a
      budget. The budget itself is the closest thing to a complexity statement:
      eigenvalue methods cost O(poly) in the graph size and yield 0 bits per
      vertex; eigenvector methods yield full information at cost linear in the
      class number, i.e. about p/12, which is WORSE than the p^{1/2} baseline.
    memory_exponent: >-
      Full spectrum computation is O((p/12)^2) memory naively, which is the
      binding constraint and caps p at about 10^4 on ordinary hardware.
    best_known: >-
      Supersingular path-finding: KN-TECH-058's corrected classical figure and
      the p^{1/3+o(1)} exemplar; memory-charged variants KN-TECH-050. Unchanged.
    hidden_overhead: >-
      Nothing asymptotic is claimed. What hides, and is disclosed, is that the
      whole eigenvector route costs the class number -- so any spectral "attack"
      quoting only eigenvalue computations has omitted the step where the
      information actually is.
    tradeoff_note: >-
      Not applicable; no algorithm is produced. If a sublinear eigenvector-coordinate
      estimator were found, it would need costing against KN-TECH-050 before any
      comparison to path-finding baselines.

  dominated_by: >-
    As an ATTACK: mounts none; dominated on time, memory and query by every
    supersingular frontier row -- KN-TECH-058's classical baseline, the
    p^{1/3+o(1)} exemplar, KN-TECH-050's memory-charged variants. The eigenvector
    route is dominated by a factor of about p^{1/2} on time alone, since it costs
    p/12 against a p^{1/2} baseline, and that comparison is the honest summary of
    the lane.
    As a NULL-CORRECTNESS result: nothing in this corpus dominates it, because no
    record computes these spectra at all.
  sota_delta: >-
    Zero speedup, and a derived NEGATIVE delta for the only complete method in
    the lane: eigenvector-based vertex identification costs about p/12 against a
    p^{1/2} baseline, i.e. worse by roughly p^{1/2}. Deliverables as counts:
    1 corrected null (arithmetic rather than GOE) that would otherwise guarantee
    a false positive, 1 derived information split (0 bits eigenvalue-side, full
    information eigenvector-side at class-number cost), 1 exact fixed-point
    identity usable as an instrument check, 3 blocking controls including a
    resolution control that no spacing study is interpretable without, and 1
    named opening (a sublinear eigenvector-coordinate estimator).

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that the arithmetic null fits and GOE does not, conditional on the
    random-graph control showing the two are distinguishable at these sizes --
    and that condition is genuinely uncertain at 0.6, which is the main risk to
    the whole measurement. 0.05 that any eigenvector is localised beyond the
    symmetry sectors. The record's durable value is (A) and (C): they let this
    program decline the spectral lane for a derived reason, and they stop a
    future session from reporting a GOE deviation as a cryptanalytic signal.

