idea:
  id: IDEA-20260815-6c956e
  question_id: RQ-JINV-8fc13a
  added: '2026-08-15'
  title: >-
    SPECIAL-j CURVES ARE EXCLUDED FROM EVERY CONTROL IN THIS PROGRAM AS
    AUTOMORPHISM ARTIFACTS: measure what they actually do, since a
    systematically excluded family is a systematically unexamined one
  class: measurement

  claim: >-
    Records across this corpus exclude j=0 and j=1728 from random controls
    to avoid automorphism artifacts. The exclusion is methodologically
    correct for those controls and has the side effect that the family is
    never measured. Whether these curves differ from generic ones beyond the
    known automorphism factor is a question the exclusion policy guarantees
    nobody answers.

  mechanism: >-
    Run the program's standard measurement battery on special-j curves and
    on generic controls, with the known automorphism factor divided out
    explicitly. Report any residual difference beyond that factor.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Grep 'j=0', 'j=1728', 'special-j', 'automorphism artifact'; read of
      RQ-ECDLP-912694 and RQ-JINV-8fc13a.
    results: >-
      RQ-ECDLP-912694 studies special-j isogeny closure specifically; the
      broader question of whether these curves differ beyond the
      automorphism factor across the standard battery is not measured.
    verdict: >-
      UNVERIFIED. The automorphism factor itself is classical and already
      exploited in the literature; the residual question is what this
      record measures.

  object_first_candidate:
    tracked_object: >-
      THE RESIDUAL DIFFERENCE between special-j and generic curves after
      dividing out the known automorphism factor.
    lossiness: >-
      Dividing out the automorphism factor is the projection that makes
      the comparison meaningful, and getting that division wrong is the
      record's central risk.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives at toy sizes; special-j curves exist at every prime
      satisfying the congruence conditions, so the sample is easy to
      build.

  null_object_control: >-
    NULL 1 -- generic curves matched on group order, the reference. NULL 2
    -- special-j curves with the automorphism factor NOT divided out, which
    must show the known factor; if they do not, the factor is being computed
    wrongly and every residual claim is void.

  discriminated_from:
    - >-
        RQ-ECDLP-912694, which asks whether special-j curves can leave
        their CM automorphism locus by rational isogeny; this asks what
        they do on the standard battery.
    - >-
        The automorphism factor-base reduction already recorded here,
        which is the known effect this record divides out rather than
        rediscovers.

  assumptions:
    - >-
        The automorphism factor is computable exactly for these curves,
        which it is since the automorphism group is known.
    - >-
        The standard battery is applicable to special-j curves without
        modification; where it is not, that inapplicability is itself
        informative.

  predictions:
    - metric: >-
        factor-not-divided control
      direction: different
      minimum_effect: >-
        FORCED to show the known automorphism factor; failure means the
        factor is mis-computed and voids the residual analysis.
    - metric: >-
        residual difference after dividing the factor out
      direction: different
      minimum_effect: >-
        The measurement; no direction pre-committed, and any residual is
        the finding.
    - metric: >-
        battery components inapplicable to special-j curves
      direction: different
      minimum_effect: >-
        Reported explicitly, since inapplicability is a structural
        difference rather than a gap.

  minimal_test:
    design: >-
      Ten special-j curves and ten matched generic controls across the
      standard battery, both nulls.
    controls:
      - >-
          Generic matched controls.
      - >-
          Automorphism-factor-not-divided control.
      - >-
          Both j=0 and j=1728 reported separately, since their
          automorphism groups differ.
      - >-
          Battery components inapplicable to special-j curves listed
          rather than skipped silently.
    required_metrics:
      - >-
          Battery results per curve class, before and after dividing the
          automorphism factor.
      - >-
          Residual difference with intervals.
      - >-
          List of inapplicable battery components.

  falsification_conditions:
    - >-
        The factor-not-divided control does not show the known factor.
        Factor mis-computed; residual analysis void.
    - >-
        No residual difference. Special-j curves differ only by the known
        factor, which justifies the exclusion policy with a measurement
        rather than an assumption.
    - >-
        A residual difference appears. The exclusion policy has been
        hiding a structural difference and the finding needs its own
        follow-up.
    - >-
        Much of the battery is inapplicable. That structural difference is
        itself the result and should be characterised rather than worked
        around.

  confounders:
    - >-
        FACTOR MIS-DIVISION: the automorphism group differs between j=0
        and j=1728, so a single factor applied to both would manufacture a
        residual on one of them.
    - >-
        SELECTION: special-j curves exist only for primes satisfying
        congruence conditions, so the generic controls must be drawn from
        the same primes to avoid a prime-family confound.

  interpretation_limits:
    - >-
        Measures a curve family on the standard battery; establishes no
        attack.
    - >-
        Scoped to the tested battery, curve counts and toy sizes.
    - >-
        A null residual justifies the exclusion policy at this scope
        rather than proving it correct.

  heuristic_assumptions:
    - id: HEUR-JINV-1
      statement: >-
        Special-j curves differ from generic curves only by the factor
        their larger automorphism group directly implies.
      rigorous_support: >-
        Rigorous ingredient: the automorphism group's order gives an
        exact factor for equivalence-class-based methods, and that
        factor is classical. THE GAP: automorphisms also change the
        curve's endomorphism ring and its CM discriminant, which affects
        quantities the automorphism-order factor does not describe -- so
        'the known factor' may not capture everything the automorphisms
        cause.
      falsification_condition: >-
        A residual difference after dividing the automorphism factor,
        reproducible across curves.
      validation_plan: >-
        SAMPLE: >= 10 curves per class x the full battery, with j=0 and
        j=1728 kept separate. COMPARISON: residual against matched
        generic controls drawn from the same primes. TAIL CHECK: the
        battery components with the largest residual, reported with the
        curve's CM discriminant. TRANSFER: none beyond toy sizes.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is one battery run per curve.
    memory_exponent: >-
      Battery-dependent; modest at toy sizes.
    best_known: >-
      The incumbent is the classical automorphism speedup factor, which
      this divides out rather than improving.
    hidden_overhead: >-
      The CM structure of special-j curves affects more than the
      automorphism order, which is why a single divided factor may leave a
      spurious residual.
    tradeoff_note: >-
      Excluding special-j curves keeps controls clean and guarantees the
      family is never measured; this record pays the small cost of
      measuring it once.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As cryptanalysis: nothing is mounted. As a
    measurement of a systematically excluded family: none exists here. Not
    null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: the standard battery run on
    special-j curves with the automorphism factor explicitly divided out,
    testing whether the program's exclusion policy hides any structural
    difference beyond the factor it was designed to remove.

  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that the curves and controls are constructible. 0.7 that the
    automorphism factor is divided correctly, with the j=0 versus j=1728
    distinction the main risk. 0.3 that a residual appears, which would mean
    the exclusion policy has been hiding something.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
