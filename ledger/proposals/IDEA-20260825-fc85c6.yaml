idea:
  id: IDEA-20260825-fc85c6
  title: Transposed subresultant target-local remainder transducer
  class: representation
  question_ids:
    - RQ-ECDLP-002
  goal_ids:
    - GOAL-ECDLP-001
  source_handoff: TASK-20260825-10a615
  status: proposed
  object: >-
    A typed target-local quotient-ring remainder state for r_R mod g_I,
    including degree, leading coefficient, CRT stratum, lineage, multiplicity,
    and Q-orientation metadata.
  depth_of_verified_structure: >-
    Conceptual mechanism only; the cited goal trigger and adjacent frontier
    records were read, but no recurrence, implementation, or experiment was
    executed in this task.
  claim: >-
    A typed, public, root-free transducer can compute the target-local remainder
    r_R mod g_I by applying a transposed half-gcd/subresultant recurrence to the
    frozen elliptic polynomial interface. If the recurrence preserves degree,
    multiplicity, CRT component labels, and the Q versus -Q orientation, it can
    supply the exact P1553 intake object without enumerating source roots or
    represented factor-base tables. This is a candidate mechanism only; no
    exponent reduction is claimed until the complete source-to-target path is
    proved and charged.
  mechanism: >-
    Store the Euclidean quotient matrices for the pair (g_I, r_R) in a balanced
    product tree and apply their transposes to target coefficients. The state is
    a typed quotient-ring remainder together with boundary degree, leading
    coefficient, CRT-stratum tag, and lineage/multiplicity metadata. Transposed
    multiplication turns a remainder query into a sequence of polynomial matrix
    products, so the operation is an exact representation/reduction chain rather
    than a collision-recovery oracle. The proposed object is lossy with respect
    to source roots, but the discarded roots are discarded compatibly with
    Euclidean updates; the retained remainder is the deterministic state passed
    to the next dyadic block.
  nearest_record_delta:
    screened_against:
      - FINDING-PF-IC-001:ECFG-P1533-R0
      - FINDING-PF-IC-001:ECFG-P1533-R2
      - FINDING-PF-IC-001:ECFG-P1536-R0
      - FINDING-PF-IC-001:ECFG-P1547-R0
      - GOAL-ECDLP-001.next_action
      - KN-TECH-003
    overlap_axes:
      - public polynomial representations
      - target-local relation extraction
      - exact coefficient and multiplicity accounting
    exact_delta: >-
      P1533 is a collision-recovering multiset resultant route and P1536/P1547
      use projector or jet-coordinate constructions. This proposal never forms
      a resultant, never projects a point oracle, and never evaluates at roots;
      it exposes only a transposed Euclidean remainder state. Relative to the
      current goal trigger, the missing deliverable is an actual typed recurrence
      with its ring and coefficient-growth interface, not an assertion that such
      a circuit might exist.
  novelty_status: unverified
  duplicate_screen:
    corpus_scope: >-
      The handoff identifies 106 current RQ-ECDLP-002 proposal records and the
      adjacent ECDLP, Semaev, endomorphism, isogeny, representation,
      multi-target, and cost-model records as the comparison corpus.
    method: >-
      Compared the tracked object, operation-level update, source-recovery
      requirement, and all-axis cost boundary against the named frontier and
      the question/goal records; generic rho and ordinary Semaev relation
      collection are mandatory controls, not claimed novelty.
    outcome: >-
      No exact mechanism duplicate was identified in the available frontier
      summaries. The construction remains an unverified speculative extension
      until the Coordinator performs the per-file 106-record check.
    unresolved_gaps:
      - ID-by-ID proposal titles and bodies were not independently re-read in this role's read surface.
      - A transposed remainder may reduce to a previously filed subresultant or quotient route.
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question requires a novelty-screened public mechanism with a
        cheapest decisive test and full prime-field ECDLP accounting.
      verified_by: ledger/questions/RQ-ECDLP-002.yaml
    - ref: GOAL-ECDLP-001
      provenance: internal
      claim: >-
        The current intake trigger names a typed target-local remainder
        transducer and requires exact lineage, CRT, orientation, and cost gates.
      verified_by: ledger/goals/GOAL-ECDLP-001/goal.yaml:9469-9499
    - ref: FINDING-PF-IC-001:ECFG-P1533-R0
      provenance: internal
      claim: >-
        The nearest screened route is a collision-recovering multiset
        resultant producer, which this proposal does not reproduce.
      verified_by: ledger/FINDING-PF-IC-001.md:1337-1366
    - ref: FINDING-PF-IC-001:ECFG-P1536-R0
      provenance: internal
      claim: >-
        A Frobenius-projector and norm-jet route is an adjacent representation
        family and is excluded from this mechanism.
      verified_by: ledger/FINDING-PF-IC-001.md:1479-1526
    - ref: KN-TECH-003
      provenance: internal
      claim: >-
        Standard ECDLP index calculus uses a factor base, relation collection,
        and sparse linear algebra; these remain in the cost boundary.
      verified_by: knowledge/techniques/KN-TECH-003.md:14-21
    - ref: KN-TECH-080
      provenance: internal
      claim: >-
        Proof-oriented proposals must run baseline, collision, quantifier, and
        method-ceiling audits before compute.
      verified_by: knowledge/techniques/KN-TECH-080.md:26-124
  assumptions:
    - The frozen elliptic polynomial interface defines g_I and r_R over an explicitly typed ring without hidden root or witness inputs.
    - Half-gcd quotient matrices can be represented with declared coefficient and degree bounds at every CRT stratum.
    - Exact transposed products preserve source lineage and multiplicity even on nonreduced or coalesced fibres.
    - Any relation yield or smoothness gain is an empirical conditional, not a consequence of the transducer alone.
  proof_search_map:
    bottleneck: >-
      The bottleneck is the unimplemented exact computation of r_R mod g_I from
      E, P, and Q without roots, source enumeration, support tables, or witnesses.
    baseline_embedding:
      parameter_slice: >-
        Prime-order generic curve with n approximately p, public P and Q, and
        the baseline Pollard-rho transcript charged at time p^(1/2+o(1)),
        negligible memory, and p^(1/2+o(1)) group data.
      reproduction_check: >-
        Symbolically instantiate the same ring operations with a degree-one
        block and verify that the transducer's charged path is no cheaper than
        the baseline relation-free path; retain a frozen polynomial fixture.
    observation_collision:
      observable: >-
        The complete typed remainder state (coefficient vector, degree,
        leading coefficient, CRT tag, orientation bit, and lineage/multiplicity
        summary).
      distinct_preimage_search: >-
        Search two distinct source multisets, including a squarefree pair and a
        repeated-root pair, with identical proposed state but different source
        coefficients; any collision that changes the recovered relation is a
        direct falsifier.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          A quotient-matrix remainder state computed by transposed half-gcd
          updates in the target-local quotient ring.
        predicted_gain: >-
          Remove root enumeration from the interface and expose output-sensitive
          block updates; conditional exponent gain is possible only if the
          resulting relation density and sparse solve costs also improve.
    quantifier_order: >-
      For every prime-field curve E and public P,Q in the declared scope, there
      exists a typed recurrence T such that for every valid dyadic block I,
      T(E,P,Q,I) equals the exact r_R mod g_I state; only after this universal
      correctness claim is established may one assert that there exists a
      parameter schedule with lower total cost.
    method_ceiling:
      strongest_certifiable_claim: >-
        The method can certify exact target-local remainder computation under
        stated ring and degree bounds; by itself it certifies neither a solved
        discrete logarithm nor a relation-density improvement.
      nearby_object_control: >-
        Apply the same recurrence to a degree-matched random polynomial pair and
        to an elliptic pair with the proposed structure deliberately destroyed;
        the recurrence must remain exact while any claimed density advantage
        disappears.
    proof_obligations:
      - claim: Exact typed recurrence
        responsibility: interface
      - claim: Degree and coefficient bounds for each product-tree node
        responsibility: size
      - claim: Transpose correctness and orientation recovery
        responsibility: correctness
      - claim: Root-free source and witness independence
        responsibility: scope
      - claim: Per-block time, memory, traffic, and build/query split
        responsibility: runtime
      - claim: Any relation yield or success probability under a named heuristic
        responsibility: success_probability
    not_applicable_reason: null
  predictions:
    - metric: remainder equality on exact and random polynomial controls
      direction: higher
      minimum_effect: 1.0 exact agreement; any mismatch falsifies the recurrence
    - metric: source enumeration count per target-local block
      direction: lower
      minimum_effect: 0 root or witness enumerations on every accepted input
    - metric: coefficient bit growth relative to the declared bound
      direction: lower
      minimum_effect: no uncharged growth beyond the product-tree bound
    - metric: relation yield after the transducer is inserted
      direction: different
      minimum_effect: must be measured against matched Semaev and random-polynomial nulls; no assumed increase
  minimal_test:
    design: >-
      On toy prime fields, instantiate the frozen elliptic polynomial interface
      for all dyadic blocks and compare the transposed recurrence against a
      separately implemented exact remainder computation. Include all CRT and
      exception strata, squarefree and repeated roots, coalesced lineages, Q
      versus -Q, and a negative random-polynomial instance.
    controls:
      - Pollard rho on the same toy groups as the generic baseline.
      - Standard Semaev m=2 relation collection with the BKK mixed-volume control.
      - Degree-matched random polynomial pairs with no elliptic provenance.
      - Deliberately broken input orientation and repeated-root cases.
      - Two distinct source lineages engineered to collide on unlabelled remainders.
    required_metrics:
      - exact remainder and recovered coefficient equality
      - lineage and multiplicity preservation rate
      - Q versus -Q separation rate
      - degree, rank, nonzero count, coefficient bits, and live storage
      - build time, query time, traffic, and source-enumeration count
      - relation yield and total time/memory/data against controls
  falsification_conditions:
    - Any input requires an unlisted root, factor, witness, support table, or source enumeration.
    - The recurrence fails on a repeated, coalesced, nonreduced, CRT, or Q versus -Q case.
    - Two distinct lineages share the complete state and lead to different relations.
    - Measured relation yield is indistinguishable from the matched random-polynomial null while costs increase.
    - The full charged path remains at least Pollard-rho cost at every declared parameter slice.
  confounders:
    - A faster polynomial remainder can be hidden by sparse linear algebra, relation filtering, or source unranking.
    - Apparent density changes can arise from degree imbalance, exceptional curves, or malformed CRT labels.
    - Product-tree reuse can be counted as free preprocessing even when its build traffic dominates.
    - A toy-field exactness result may not transfer to cryptographic bit sizes.
  interpretation_limits:
    - Exact transducer correctness is not a discrete-log solve.
    - A relation-yield signal is not evidence without the same-shape null and destroyed-structure control.
    - Any asymptotic target is conditional until all bit, memory, data, and amortization terms are proved.
    - Negative results apply only to the declared ring, degree, curve, and parameter scope.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Conditional on the exact transducer, eligible target-local blocks have
        relation-producing residues whose density is within a polylogarithmic
        factor of the corresponding random polynomial model at the same degree.
      rigorous_support: >-
        The exact remainder recurrence and its degree/coefficient bounds are
        rigorous; no theorem currently proves the random-model density transfer.
      validation_plan: >-
        Sample toy and correspondence-generated public curves where block
        enumeration is feasible, compare empirical residue and relation-yield
        CDFs to degree-matched random polynomials, and check tails as the block
        depth and prime size increase; state transfer assumptions explicitly.
    - id: H2
      statement: >-
        CRT-stratum labels and lineage metadata do not create an asymptotically
        growing collision multiplicity beyond the declared state size.
      rigorous_support: >-
        The proposed state includes the metadata needed for exact recovery, but
        a uniform collision bound is not known.
      validation_plan: >-
        Exhaustively enumerate small strata, count equal-state distinct-lineage
        fibres with exact confidence intervals, and compare to a random-labelled
        null while increasing repeated-root and coalescence frequency.
  target_complexity:
    time_exponent: >-
      Unverified conditional target p^(1/3+o(1)) for a complete relation/descent
      path; the only established fallback is p^(1/2+o(1)) generic rho.
    memory_exponent: >-
      Conditional target p^(1/3+o(1)) if the quotient-ring table is retained;
      otherwise p^(o(1)) only for the generic-rho fallback.
    best_known: p^(1/2+o(1)) time with polynomial or negligible memory via Pollard rho, with specialized routes separately costed
    hidden_overhead: >-
      The o(1) may hide polynomial-in-log factors, coefficient swell, sparse
      linear algebra, failed-attempt inverse success probability, and a
      superpolynomial smoothness or relation-density overhead; none is free.
    tradeoff_note: >-
      A stored quotient-ring table trades memory for time and may be distributed
      by a van Oorschot--Wiener style schedule; parallel traffic and duplicate
      work must be charged rather than absorbed into the exponent.
  cost_boundary:
    public_inputs: E, P, Q, prime p, group order n, ring/base/CRT descriptions, and dyadic interval I
    per_attempt: >-
      Construct g_I, construct r_R, build the subresultant product tree, execute
      transposed updates, recover a relation or reject, and verify the relation
      independently.
    preprocessing: >-
      All reusable polynomial products, CRT basis data, and coefficient tables,
      with build time, memory, and network traffic charged separately.
    online: >-
      Query-time matrix-vector products, block selection, relation filtering,
      source unranking, and independent certificate verification.
    success_probability: >-
      No value asserted; total expected cost must be per-attempt cost multiplied
      by inverse measured or proved success probability.
    time: >-
      Include polynomial multiplication, quotient construction, coefficient
      normalization, relation collection, sparse linear algebra, descent, and
      final scalar recovery.
    memory: >-
      Include all live quotient matrices, CRT metadata, factor-base state,
      certificates, caches, and distributed replicas.
    data_queries: >-
      Count public group operations, field operations, polynomial coefficients,
      relation requests, verification queries, and inter-worker traffic.
    exclusions: >-
      No secret-key, wallet, deployed-target, oracle, hidden factorization,
      witness-conditioned input, or free preprocessing is allowed.
  dominated_by:
    result: Pollard rho baseline (KN-TECH-006) and the best specialized route after the full frontier comparison
    frontier_checked: [generic rho, BSGS, standard Semaev relation collection, endomorphism variants, multi-target preprocessing]
    reason: >-
      Until exactness and a strict all-axis gain are proved, the proposal is
      dominated by the established baseline in verified time, memory/data
      predictability, and deployability.
  sota_delta:
    time_exponent: "0 verified; conditional aspiration -1/6 versus p^(1/2)"
    memory_exponent: "no verified improvement; conditional table cost +1/3"
    data_queries: "no verified improvement; full relation and verification path unknown"
    status: unverified
  estimated_cost:
    implementation: high
    compute: medium
    rationale: >-
      Toy exactness is moderate, but typed ring construction, repeated-root
      handling, source unranking, and all-axis cost validation are substantial.
  priority: high
  recommended_priority: high
