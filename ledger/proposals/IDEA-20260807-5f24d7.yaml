idea:
  id: IDEA-20260807-5f24d7
  question_id: RQ-PAIR-21313f
  added: '2026-08-07'
  title: >-
    THE MOV COST FUNCTIONAL IS A MINIMUM OVER THREE BRANCHES, NOT ONE, AND ITS
    BINDING OBSTRUCTION AT LARGE EMBEDDING DEGREE IS REPRESENTATION SIZE RATHER
    THAN INDEX-CALCULUS COST - a transferred instance may always be attacked by
    generic rho INSIDE F_{p^k}, so a cost model that charges only
    L_{p^k}(1/3) overstates the transfer's badness by an unbounded amount and
    is wrong in the same direction as the model that charged only the Miller
    loop was wrong in the other; the honest functional is
    C_pairing + min(NFS-family, 0.886 sqrt(N) field multiplications), subject to
    a hard wall at k.ceil(log2 p) bits per field element, and the deliverable is
    the crossover k*(p, N) below which the transfer beats rho on the curve
  class: measurement

  claim: >-
    (A) THE DEFECT BEING REPAIRED, AND ITS TWIN. This campaign has a recorded
    cost-model failure - according to the account in
    ideas/catalogue-20260805/A4-transfers-lattice.md sections 0 and A4-5, which
    is the source read for this record, EV-IT-002 observation O-4 and
    DEC-20260803-004 both record that a special-solver cost
    C_special_MOV = ceil(k . log2 p) charged only the Miller loop and omitted
    the dominant field DLP, and that this defect class recurred three times. The
    obvious repair - charge L_{p^k}(1/3) - introduces the OPPOSITE error, and
    that is what this record is about. For k of size comparable to N,
    L_{p^k}(1/3) is a number so large that reporting it as the cost of the
    transfer is not conservative, it is simply false, because nobody attacking a
    transferred instance would run index calculus. They would run rho in the
    image group.

    (B) THE CORRECT FUNCTIONAL. The MOV/Frey-Ruck transfer maps G injectively
    into mu_N inside F_{p^k}^*. Solving the DLP in mu_N admits at least three
    algorithms and the attacker takes the cheapest -
      BRANCH 1 - the NFS family in F_{p^k}, at L_{p^k}(1/3, c) with c depending
        on the variant - plain NFS, TNFS and exTNFS for composite k, SNFS when
        p has a special form. KN-OPEN-025 records that TNFS linear-algebra
        speedups at k = 6 and 12 are reported but that NO end-to-end figure
        exists in this corpus, so the constant here is not settled.
      BRANCH 2 - GENERIC rho INSIDE mu_N, at approximately 0.886 sqrt(N)
        multiplications in F_{p^k}. This branch is ALWAYS available, needs no
        smoothness, no factor base and no linear algebra, and it is the branch
        the L(1/3)-only model omits.
      BRANCH 3 - not attacking the transferred instance at all, i.e. rho on the
        curve at 0.886 sqrt(N) group operations. This is the baseline the whole
        comparison is against.
    Therefore
      C_MOV(p, N, k) = C_pairing(p, k) + min( L_{p^k}(1/3, c) , 0.886 sqrt(N) . M(k, p) )
    where M(k, p) is the cost of one multiplication in F_{p^k}. Comparing
    Branch 2 with Branch 3 gives the sharp qualitative statement -
    THE TRANSFER IS NEVER MORE THAN A poly(k) FACTOR WORSE THAN DOING NOTHING,
    in an operation-count model, because rho in the image costs the same number
    of steps with more expensive steps. So "the transfer is astronomically
    expensive at large k" is FALSE as a time statement, and the reason large k
    is safe must be found elsewhere.

    (C) WHERE IT IS ACTUALLY FOUND - THE REPRESENTATION WALL. One element of
    F_{p^k} occupies k . ceil(log2 p) bits. At k of size comparable to N, that
    is a number of bits of size comparable to N . log p - so a SINGLE element of
    the target field cannot be written down, let alone multiplied. The transfer
    is infeasible at large k because its image group is not representable, not
    because index calculus in it is slow. This is a MEMORY statement, it is
    exact rather than asymptotic, and it is robust to every future improvement
    in NFS - which is precisely the property one wants from a safety argument.
    It is also the honest version of what KN-TECH-032 asserts qualitatively.

    (D) THE DELIVERABLE - k*(p, N). Define k*(p, N) as the largest embedding
    degree at which C_MOV(p, N, k) is below the matched rho baseline
    0.886 sqrt(N) group operations, computed separately under each NFS variant
    and reported as a table over standardised parameter sizes (roughly 192, 224,
    256, 384 and 521 bits). k* is what turns a measured k
    (IDEA-20260807-98a970) into a verdict. NO VALUE OF k* IS ASSERTED IN THIS
    RECORD. Any figure a reader may recall - including the familiar guidance
    that parameter validation should require k above some threshold - must be
    RE-DERIVED here with its constants stated, not quoted from memory, because
    quoting it is exactly how the three recorded cost-model failures happened.

    (E) WHAT THIS IS NOT. It is not an attack, not a new algorithm, and not a
    claim that any curve is weaker or stronger than believed. It is a cost model
    with three branches instead of one, a hard wall stated in bits, and a
    crossover table. Its expected effect on every deployed curve is precisely
    zero, and its expected effect on this campaign is to stop a fourth
    recurrence of the same accounting error.

  resource_label: >-
    R7 (pairings into F_{p^k}), consumed as a COST MODEL rather than as an
    attack - the record prices the R7 route and never runs it.
  admissibility: admissible
  admissibility_argument: >-
    Admissible - the transfer target F_{p^k} is a different group and its cost
    is not a generic-group quantity, so KN-FIND-b7e091 does not apply and no
    endomorphism is applied to any point of G. The record is nevertheless
    expected to conclude that the admissible route is priced out of contention
    for every curve of interest, which is a quantitative closure rather than a
    filtered one.

  discriminated_from:
    - >-
      ideas/catalogue-20260805/A4-transfers-lattice.md item A4-5, which proposes
      a frozen field-DLP-inclusive C_MOV oracle calibrated against published DLP
      records, with a pairing-friendly positive control, a random-curve null and
      a formula-substitution tripwire. THIS RECORD ADOPTS ALL OF THAT and adds
      three things A4-5 does not have - (i) the rho-in-the-image branch, without
      which the oracle returns numbers that are not merely conservative but
      wrong; (ii) the representation wall k.ceil(log2 p) as the actual binding
      obstruction at large k, which makes the SAFE verdict independent of NFS
      constants; (iii) the inversion of the oracle to produce k*(p, N) rather
      than only evaluating it. A4-5 is catalogue-only, mints no identifier and
      was never run.
    - >-
      IDEA-20260807-98a970, which MEASURES k per deployed curve. That record
      needs this one's k* to convert a measurement into a verdict, and this one
      needs that record's k to have anything to compare. The dependency runs
      both ways and is declared in both.
    - >-
      KN-TECH-032, which states qualitatively that the attack "wins exactly when
      k is small". This record supplies the threshold and corrects the implied
      cost model.
    - >-
      KN-OPEN-025, which records that TNFS linear-algebra speedups at k = 6, 12
      are reported but that no end-to-end TNFS figure exists in this corpus.
      That open problem is a BLOCKING INPUT to Branch 1's constant, and this
      record must state its k* under an explicit, named NFS-variant assumption
      rather than pretending the constant is settled.
    - >-
      KN-TECH-035 (full-cost accounting). This record adopts its discipline -
      memory, wiring and communication are charged, and the representation wall
      in (C) is exactly a full-cost statement rather than a processor-step one.
    - >-
      NOT the classical transfer itself, which is KN-TECH-032 and is not in
      question. This is its price list.

  object_first_candidate:
    tracked_object: >-
      THE COST FUNCTIONAL C_MOV AS A FUNCTION OF k, with its three branches and
      its representation wall, followed as k sweeps from 1 to N.
    lossiness: >-
      Lossy - it discards the curve, the points, the pairing values and the
      algorithms' internals, retaining a single real-valued function of one
      integer variable. It is not a change of coordinates - no attack is
      recoverable from its cost curve.
    propagation: >-
      Deterministic under the operation "change k", which is the only operation
      that acts on it, and compatible with what is discarded - the cost of a
      transfer genuinely depends on (p, N, k) and on nothing else that was
      thrown away. That is what makes the functional a legitimate object rather
      than a summary statistic, and it is why the crossover k* is well defined.
    survival_score: >-
      Survives every change of curve at fixed (p, N, k), which is the whole
      isogeny class (IDEA-20260807-b92080). Dissolves when the attack is not a
      transfer into a finite field at all - a cover attack into a Jacobian has a
      different functional entirely, and this object says nothing about it.

  mechanism: >-
    STEP 1 - FREEZE THE FORMULA BEFORE LOOKING AT ANY CALIBRATION POINT. Write
    C_pairing(p,k) as an explicit count of F_{p^k} operations for a Miller loop
    of length log2 N plus the final exponentiation, and write both DLP branches
    with their constants named as symbols. Hash the specification. This ordering
    is not bureaucratic - it is the specific control that would have caught the
    recorded C_special_MOV substitution.
    STEP 2 - THE REPRESENTATION WALL, which costs nothing and should be computed
    first. Tabulate k . ceil(log2 p) bits for each standardised p and for
    k in {1, 2, ..., 24, 10^3, 10^6, 10^9, N}. State the k at which one field
    element exceeds, respectively, a cache line, a machine's memory, and the
    estimated storage of the planet. This is exact arithmetic, it is the
    strongest part of the record, and it does not depend on any NFS constant.
    STEP 3 - CALIBRATE BRANCH 1. Transcribe at least three published
    finite-field DLP computations into knowledge/literature with their exact
    field sizes and reported effort - NONE is transcribed in this corpus today
    and this is the blocking dependency A4-5 already identified. Predict each
    with the frozen formula and report the ratio predicted-to-actual. If no
    record can be transcribed, ship the model as UNCALIBRATED, forbid its use as
    a decision threshold, and say so - never calibrate against a remembered
    figure.
    STEP 4 - COMPUTE k*(p, N) by solving
    C_pairing + min(branch 1, branch 2) = 0.886 sqrt(N) for k, numerically, once
    per (parameter size, NFS variant). Report the full curve, not just the
    crossing point, and report separately under plain NFS, under exTNFS for
    composite k, and under SNFS for special p - three columns, because the
    answer differs and collapsing them hides the assumption.
    STEP 5 - THE SENSITIVITY ANALYSIS, which is what makes the table usable.
    Recompute k* with the Branch 1 constant varied over the range that
    KN-OPEN-025's unresolved end-to-end TNFS question leaves open, and report
    how much k* moves. If k* is insensitive to that range, the open problem does
    not block the verdict and the record should say so; if it is sensitive, the
    verdict is conditional and must be labelled so.
    STEP 6 - EMIT THE VERDICT COLUMN for IDEA-20260807-98a970's table, and the
    tripwire unit test asserting that ceil(k . log2 p) is not an admissible
    C_MOV value.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Run 2026-08-07. grep -i over ledger/, knowledge/, docs/, analysis/,
      ideas/ for "C_MOV", "C_special_MOV", "L(1/3)", "index calculus",
      "crossover", "full cost", "TNFS", "representation". Reads of KN-TECH-032,
      KN-TECH-035, KN-OPEN-025, KN-FIND-3a7d42, and
      ideas/catalogue-20260805/A4-transfers-lattice.md items A4-5 and A4-8 and
      section 0.
    results: >-
      A4-5 proposes the field-DLP-inclusive oracle and is the closest prior art;
      it is catalogue-only and unrun. Its formula
      C_MOV = C_pairing + C_fieldDLP(p^k) has NO minimum and no rho-in-the-image
      branch, and mentions no representation wall. KN-TECH-035 supplies the
      full-cost discipline but not this functional. KN-FIND-3a7d42 records that
      working in F_{p^{N/2}} is equivalent in difficulty to the MOV attack,
      which is an adjacent cost statement and should be checked for consistency
      with the branch structure here. No crossover k* appears anywhere in the
      repository.
    verdict: >-
      ADAPTATION, with one specific correction. The cost model is standard
      cryptanalytic bookkeeping and nothing in it is claimed as new
      mathematics. The correction - that the functional is a MINIMUM including
      generic rho in the image, and that the large-k obstruction is
      representation size - is new to this program and is the reason to file the
      record separately from A4-5 rather than as a restatement of it. No claim
      of novelty against external literature; the observation that one can run
      rho in the image group is elementary and surely known.

  null_object_control: >-
    MANDATORY AND BLOCKING, adopted in part from A4-5 because those are the
    right controls.
    PAIRING-FRIENDLY POSITIVE - a BN- or BLS-shaped parameter set with k = 12.
    The model MUST return C_MOV below the matched rho baseline there. An oracle
    that cannot see the real MOV win where one exists is void, and this is the
    control that the k > 10^6 SAFE verdicts depend on.
    RANDOM-CURVE NULL - 100 sampled (p, N, k) triples from
    IDEA-20260807-6c7540's sampler. C_MOV divided by matched rho must exceed 1
    on 100 out of 100. A single sub-1 ratio means either the model or the order
    computation is wrong.
    DECAY PARAMETER - k itself. C_MOV / rho must be a monotonically increasing
    function of k over the whole sweep, and it must CROSS 1 exactly once. A
    non-monotone curve, or one that crosses more than once, indicates the branch
    selection is mis-implemented - most likely the minimum is being taken with
    inconsistent units.
    FORMULA-SUBSTITUTION TRIPWIRE - a unit test asserting that
    C_special_MOV = ceil(k . log2 p) is rejected by the model as inadmissible,
    so the exact substitution that voided EV-IT-002 cannot recur silently. This
    is A4-5's control and it is retained verbatim in purpose.
    UNIT NULL - the entire model evaluated with all costs in group operations
    versus all costs in bit operations. The crossover k* must be the same
    quantity in both accountings up to the declared conversion; a k* that
    depends on the unit system is an accounting error, and this is the cheapest
    check of the minimum's correctness.

  assumptions:
    - >-
      [BLOCKING, and currently unmet] The Branch 1 constant requires at least
      three transcribed finite-field DLP records. NONE is transcribed in this
      corpus. Until they are, every k* is UNCALIBRATED and may not be used as a
      decision threshold.
    - >-
      [open] The end-to-end TNFS effect of the reported k = 6, 12 linear-algebra
      speedups is unknown (KN-OPEN-025). Branch 1's constant is therefore a
      RANGE, not a value, and Step 5 exists to report how much that range moves
      k*.
    - >-
      Branch 2's cost 0.886 sqrt(N) multiplications in F_{p^k} assumes rho
      applies to mu_N with the usual constant. mu_N is cyclic of prime order N,
      so this is standard, but the constant is inherited from KN-TECH-006 for
      elliptic-curve groups and the record must state that it is being reused
      for a multiplicative group.
    - >-
      The account of the EV-IT-002 / DEC-20260803-004 defect is taken from
      ideas/catalogue-20260805/A4-transfers-lattice.md sections 0 and A4-5,
      which this session READ. The underlying evidence and decision records were
      NOT read in this session, and the citation is to the catalogue's account
      of them, not to the records themselves.
    - >-
      Scope - prime fields and transfers into F_{p^k}. Nothing here covers
      binary fields, covers into Jacobians, or the anomalous transfer.

  proof_search_map:
    bottleneck: >-
      Branch 1's constant. Everything about the exact position of k* depends on
      it, and it is the only quantity in the model that this corpus cannot
      currently supply. The representation wall in (C), by contrast, needs no
      constant at all, which is why Step 2 comes first.
    baseline_embedding:
      parameter_slice: >-
        Two slices, both mandatory. (i) k = 12 at BN-like parameters, where the
        transfer is known NOT to break the curve at deployed sizes but where the
        model must produce a finite, recognisable cost. (ii) k = 1, where the
        transfer reduces to a DLP in F_p and the model must reproduce the plain
        NFS cost for a prime field of that size.
      reproduction_check: >-
        Frozen fixtures with hashed specifications, evaluated before any
        calibration point is examined, plus the three transcribed DLP records of
        Step 3 with the predicted-to-actual ratio reported per record.
    observation_collision:
      observable: >-
        The crossover integer k*.
      distinct_preimage_search: >-
        REQUIRED. Find two parameter sets with the same k* and different
        (p, N) - trivially available - and record the consequence, which is that
        k* is a coarse function of the parameter SIZE and must never be quoted
        without the size it was computed for. This is the exact failure mode by
        which a threshold gets quoted out of context, and it is the failure mode
        the campaign has already suffered three times in this family.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Replace the cost-based SAFE verdict with the representation-based one
          - "a single element of the target field does not fit in the observable
          universe" - which is a hard bound rather than an algorithmic estimate.
        predicted_gain: >-
          A safety statement immune to every future NFS improvement, obtainable
          at zero compute and with no transcribed constants. This is the
          strongest and cheapest part of the whole record.
      - transform: representation_reduction
        proposed_object: >-
          Invert the oracle - solve for k* rather than evaluating C_MOV at a
          given k.
        predicted_gain: >-
          One threshold per parameter size replaces one evaluation per curve,
          and the audit of IDEA-20260807-98a970 becomes a comparison instead of
          a computation.
    quantifier_order: >-
      Claimed - FOR EACH parameter size and FOR EACH named NFS variant, EXISTS
      an integer k* such that FOR ALL k > k*, C_MOV exceeds the matched rho
      baseline. NOT claimed - a single k* valid for all sizes and all variants,
      which is what quoting a remembered threshold implicitly asserts and which
      the observation-collision search shows to be unsupportable.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under the frozen formula, the named NFS variant, and the transcribed
        calibration records, a transfer beats matched rho only for k at most
        k*, and for k above the representation wall the transfer is infeasible
        for reasons independent of any DLP algorithm." It certifies nothing
        about attacks that are not transfers, nothing about whether rho itself
        is optimal, and nothing about any specific curve without that curve's
        measured k.
      nearby_object_control: >-
        A curve with k just BELOW k*, where the desired conclusion (safe) must
        FAIL and the model must return AFFECTED. If the model returns safe on
        both sides of its own crossover it has no resolving power. A toy
        instance of this is constructible and must be run.
    proof_obligations:
      - claim: The three branches are all available to an attacker and the minimum is the correct combinator.
        responsibility: correctness
      - claim: One element of F_{p^k} occupies k.ceil(log2 p) bits.
        responsibility: size
      - claim: The frozen formula reproduces at least three transcribed DLP records within a stated band.
        responsibility: baseline
      - claim: C_MOV/rho is monotone in k and crosses 1 exactly once.
        responsibility: runtime
      - claim: k* is invariant under the choice of cost unit.
        responsibility: correctness
      - claim: The pairing-friendly positive returns a win.
        responsibility: feasibility
      - claim: k* is reported per NFS variant and never as a single number.
        responsibility: scope

  predictions:
    - metric: >-
        the ratio C_MOV / matched rho at k = ord_N(p) for 100 random sampled
        parameter triples
      direction: higher
      minimum_effect: >-
        Above 1 on 100 out of 100. Any triple below 1 indicates a model or order
        error and halts the line.
    - metric: >-
        C_MOV / matched rho on the k = 12 pairing-friendly positive control
      direction: lower
      minimum_effect: >-
        Below 1 at parameter sizes where the transfer is genuinely the better
        attack. If the model never returns a win at any size for k = 12, it
        cannot see the attack it exists to price.
    - metric: >-
        the ratio between the L(1/3)-only cost and the three-branch cost at
        k of size comparable to N
      direction: different
      minimum_effect: >-
        Unbounded - this is the size of the error the record corrects, and
        reporting it explicitly at one concrete parameter size is the record's
        clearest single output.
    - metric: >-
        movement of k* as Branch 1's constant is swept over the range left open
        by KN-OPEN-025
      direction: different
      minimum_effect: >-
        Reported as an interval per parameter size. If the interval is narrower
        than 1, the open problem does not block the verdict; if it is wider than
        4, every verdict near the boundary must be labelled conditional.
    - metric: >-
        the k at which one element of F_{p^k} exceeds 2^80 bits, per parameter
        size
      direction: different
      minimum_effect: >-
        Reported as an exact integer per size. This number requires no
        calibration, no constants and no assumptions, and it is the record's
        most robust output.

  minimal_test:
    design: >-
      STAGE 1 (minutes, zero dependencies): the representation-wall table of
      Step 2. It is exact arithmetic and it alone settles the large-k question.
      STAGE 2 (hours): freeze and hash the formula. STAGE 3 (HARD GATE, hours):
      the unit null and the tripwire test. STAGE 4 (blocking, hours to days):
      transcribe three finite-field DLP records; if impossible, ship
      UNCALIBRATED. STAGE 5 (hours): compute k* per size per variant, plus the
      sensitivity sweep. STAGE 6 (HARD GATE): the pairing-friendly positive and
      the random-curve null. STAGE 7: emit the verdict column and the
      just-below-k* nearby-object control.
      THE CHEAPEST DECISIVE STEP IS STAGE 1 - a table of k . ceil(log2 p) bits,
      computable in a minute, which already establishes the lane's safety
      statement in a form no future algorithmic improvement can touch.
    controls:
      - pairing-friendly k = 12 positive - the model must return a win
      - random-curve null - 100 out of 100 ratios above 1
      - just-below-k* nearby object - must be returned AFFECTED
      - unit null - k* invariant under the cost unit
      - formula-substitution tripwire - ceil(k log2 p) rejected
      - monotonicity sweep in k with a single crossing
    required_metrics:
      - k* per parameter size per NFS variant, with the sensitivity interval
      - the full C_MOV/rho curve as a function of k, not only the crossing
      - the representation wall in bits per (size, k) cell
      - predicted-to-actual ratio for each transcribed DLP record, or an explicit UNCALIBRATED flag
      - the L(1/3)-only versus three-branch ratio at one concrete large k
      - pass or fail of every control

  falsification_conditions:
    - >-
      The model returning C_MOV below matched rho for any random sampled
      parameter triple with large k. Either the branch minimum or the order
      computation is wrong; halt.
    - >-
      Failure of the pairing-friendly positive control. The oracle is blind to a
      real transfer win and every SAFE verdict derived from it is void.
    - >-
      k* depending on the choice of cost unit. Accounting error; the minimum is
      being taken across inconsistent quantities.
    - >-
      C_MOV/rho non-monotone in k or crossing 1 more than once. Branch selection
      is mis-implemented.
    - >-
      No finite-field DLP record transcribable in this environment. The model
      ships UNCALIBRATED, may not be used as a decision threshold, and the
      verdict column of IDEA-20260807-98a970 rests on the representation wall
      alone - which is weaker in coverage but stronger in robustness, and the
      record must say exactly that rather than presenting an uncalibrated number.
    - >-
      A published result showing that rho in mu_N inside F_{p^k} does not cost
      0.886 sqrt(N) field multiplications. Branch 2's constant is wrong and the
      correction, while still directionally right, is mis-quantified.

  confounders:
    - >-
      Unit mixing. Branch 1 is usually quoted in an abstract operation count,
      Branch 2 in field multiplications, Branch 3 in elliptic-curve group
      operations. Taking a minimum across three different units is the single
      most likely way to produce a wrong k*, and the unit null exists for
      exactly this.
    - >-
      Precomputation amortisation. Branch 1 splits into a one-off precomputation
      and a per-target descent; a single-target comparison charges the whole
      precomputation, a multi-target one does not. This record is
      SINGLE-TARGET throughout and must say so; the multi-target regime is a
      different question (catalogue item A4-8, unrun).
    - >-
      Special p. Many standardised primes are of a special form chosen for fast
      reduction, which can enable SNFS and lower Branch 1's constant materially.
      This is a real effect and must appear as its own column, not as a footnote.
    - >-
      Reading the representation wall as a time bound. It is a memory and
      representability bound. A machine that could represent the elements would
      face Branch 2's time cost, which is only poly(k) worse than rho - so the
      two obstructions are different in kind and must not be conflated.
    - >-
      Treating an UNCALIBRATED k* as a threshold. The recorded history of this
      defect class in this campaign is three recurrences; the tripwire and the
      explicit flag exist because of it.

  interpretation_limits:
    - >-
      A cost model. It mounts no attack, moves no exponent, and changes no
      curve's security.
    - >-
      Its expected effect on every deployed parameter set is exactly zero, and
      any summary suggesting otherwise is overclaiming.
    - >-
      k* is per size and per NFS variant. A single quoted threshold is not a
      supported output of this record.
    - >-
      The correction in (B) makes the transfer look BETTER than the previous
      model did, at large k. That is the honest direction of the correction and
      it must not be suppressed because it is uncomfortable - the safety
      argument is then carried by (C), which is stronger.

  reachability_gate: >-
    NOT A MOVE BETWEEN CURVES. The reachability content is that k, and hence the
    position on this cost curve, is an isogeny-class invariant
    (IDEA-20260807-b92080), so an attacker cannot move along the curve at any
    cost. The record therefore prices a route that is fixed at instance-creation
    time - which is what makes k* a scope threshold rather than a search target.

  target_complexity:
    time_exponent: >-
      NO NEW ALGORITHM. The exponents priced are - Branch 1 at L_{p^k}(1/3, c),
      subexponential in the target field size; Branch 2 at N^{1/2} field
      multiplications; Branch 3 at N^{1/2} group operations. The record's
      contribution is the combinator and the threshold, not an exponent.
    memory_exponent: >-
      THE RECORD'S CENTRAL QUANTITY. One target-field element occupies
      k.ceil(log2 p) bits, so the memory exponent of the transfer route grows
      LINEARLY in k with no algorithmic remedy. At k of size comparable to N
      this is the binding constraint and it dominates every time consideration.
      Branch 1's own memory - the factor-base linear algebra - must additionally
      be charged under KN-TECH-035 rather than counted as processor steps.
    best_known: >-
      Rho at 0.886 sqrt(N) group operations with O(1) memory (KN-TECH-001,
      KN-TECH-006), which is Branch 3 and the baseline; BSGS at sqrt(N) time and
      memory with n^{2/3+o(1)} full cost (KN-TECH-031, KN-TECH-035);
      MOV/Frey-Ruck (KN-TECH-032), which is what is being priced.
    hidden_overhead: >-
      Two disclosures. (i) Branch 1's constant is not settled in this corpus and
      KN-OPEN-025 records an unresolved end-to-end TNFS question at exactly the
      embedding degrees that matter - so every k* carries an interval, not a
      point. (ii) The o(1) in L_{p^k}(1/3) is doing real work at the small field
      sizes where a toy validation is possible, which is why toy calibration is
      NOT a substitute for transcribed records at realistic sizes.
    tradeoff_note: >-
      The three branches ARE a tradeoff surface - Branch 1 buys time with
      enormous memory and a precomputation, Branch 2 buys O(1) memory with
      sqrt(N) time in an expensive field, Branch 3 buys O(1) memory with
      sqrt(N) time in a cheap group. Reporting only the time-optimal branch
      would misstate the frontier, and the record reports the full surface with
      parallelisation noted - Branches 2 and 3 parallelise linearly with
      distinguished points (KN-TECH-006), Branch 1's linear algebra does not.

  dominated_by: >-
    Every frontier row checked on time, memory and data. This record mounts no
    attack and is dominated as an attack by rho at 0.886 sqrt(N) with O(1)
    memory (KN-TECH-001, KN-TECH-006), by automorphism-discounted rho
    (KN-TECH-018), by BSGS (KN-TECH-031, KN-TECH-035) and by MOV/Frey-Ruck on
    the small-k families it prices (KN-TECH-032); the anomalous transfer
    (KN-TECH-033) is a different family and is not priced here.
    As a COST MODEL the incumbent in this repository is A4-5's proposed oracle,
    which is unrun and which this record shows to be wrong in one branch; the
    external incumbents are the standard NFS/TNFS cost estimates that set
    pairing parameters, which dominate this record on rigour and on calibration
    and which it does not attempt to improve. It dominates A4-5 on the branch
    structure and the representation wall, and dominates nothing else.
  sota_delta: >-
    Zero speedup on every axis against every baseline. Non-zero deltas, stated
    quantitatively - it changes the cost model from one branch to three, and the
    magnitude of that change is unbounded at large k (prediction 3 measures it
    at one concrete parameter size); it adds a memory bound of exactly
    k.ceil(log2 p) bits that requires no constants and cannot be improved by any
    algorithmic advance; and it converts a per-curve evaluation into one
    threshold k* per parameter size per NFS variant, with an explicit
    sensitivity interval where the corpus's TNFS knowledge is incomplete.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.95 that the three-branch correction is right - running rho in the image
    group is elementary and always available, and the only way it fails is if
    the constant differs. 0.99 that the representation wall is right; it is
    arithmetic. 0.30 that three finite-field DLP records can be transcribed from
    primary sources in this environment, which is the blocking dependency and
    the reason the honest expected output is a table whose large-k column is
    solid and whose small-k column is UNCALIBRATED. 0.50 that k* turns out to be
    insensitive to KN-OPEN-025's open range, which would be a convenient
    outcome and must not be assumed. Priority is MEDIUM - the representation
    wall alone justifies the record and costs a minute, but the calibrated
    threshold that IDEA-20260807-98a970 wants is likely to remain out of reach
    here.

