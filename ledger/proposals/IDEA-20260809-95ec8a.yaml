idea:
  id: IDEA-20260809-95ec8a
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CLGRP-66ab7f
  goal_id: GOAL-CLGRP-001
  title: >-
    Retrodict a published class group computation record before extrapolating
    anything — a model that cannot explain a completed computation predicts nothing
  class: control
  claim: >-
    Published class group computation records report their discriminant, method
    and resource consumption. The claim is that this goal's fitted curve must
    retrodict such a record within a pre-registered tolerance, that this is a
    stronger test than internal consistency of the sweep, and that a miss
    disqualifies the extrapolation until explained.
  mechanism: >-
    Instantiate the fitted curve at the record's discriminant size, translate the
    machine model explicitly, and compare per phase against the reported
    consumption with the tolerance committed in advance.
  why_not_a_renamed_known_approach: >-
    Records are usually cited as evidence that computations are hard. Using one as
    a SCORING TARGET for a fitted curve, with a pre-registered tolerance and a
    disqualification rule, is the methodological content.
  predictions:
  - observable: predicted versus reported cost at the record's parameters
    metric: ratio per phase
    predicted: Within the pre-registered tolerance after machine-model translation; a systematic underprediction is the expected failure direction because this program's sweep is small and its implementation unoptimized.
  - observable: whether the record reports enough to score
    metric: categorical
    predicted: Partially; missing fields are listed rather than filled with assumptions.
  minimal_test: >-
    One or two records, tolerance committed in a prior record, curve instantiated,
    per-phase comparison reported with the translation stated and missing fields
    listed.
  controls:
  - 'PRE-REGISTRATION of the tolerance before the comparison runs.'
  - 'TRANSLATION UNIFORMITY: one translation rule applied to all records; a per-record rule is fitting.'
  falsification_conditions:
  - The curve misses every record beyond tolerance, disqualifying the extrapolation until repaired.
  - No record can be scored from published text, in which case the goal's calibration rests on its own sweep alone and every extrapolation record must say so.
  interpretation_limits: >-
    Retrodiction validates the curve at the record's size, not at deployed sizes;
    the extrapolation gap remains and is stated separately.
  sota_delta: 'No attack. Delta: an external scoring target for a curve that would otherwise be self-validated.'
  dominated_by: Downstream of IDEA-20260809-843eb6; not dominated by any corpus record.
  estimated_cost: Acquisition-dominated; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for record retrodiction: parallel record exists in GOAL-PAIR-001 for a different curve. WEB NOT CHECKED.'
  source_refs:
  - Published class group computation records -- RECALLED, REQUIRED READS, NOT LOCATED.
