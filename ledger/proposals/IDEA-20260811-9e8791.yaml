idea:
  id: IDEA-20260811-9e8791
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-EQLA-0d3f40
  goal_id: GOAL-ENDO-001
  title: >-
    AMDAHL BEFORE ALGEBRA: measure the stage cost-share vector of the index
    calculus pipeline as this program actually runs it, because if the linear
    algebra stage is below 0.1 percent of total cost at every arity the harness
    can reach, then the ENTIRE L5 lane is optimising a stage whose complete
    elimination would move the pipeline by less than 1.001x -- a closure on cost
    with a named obstruction, obtained without constructing any phi-stable
    structure and therefore bearing on H-STR-002 in neither direction
  class: measurement

  claim: >-
    (A) THE QUANTITY NOBODY HAS RECORDED. The campaign has cost functionals for
    relation yield, decomposition rate and Groebner time, and it has four
    proposals about the linear-algebra stage's structure. It has NO measurement
    of what fraction of the pipeline's cost that stage represents. Call the
    fraction s. Amdahl's identity is exact: a speedup of g on the stage gives a
    pipeline speedup of 1/((1 - s) + s/g), which is at most 1/(1 - s) even for
    g = infinity.
    (B) THE PREDICTION. At the arities and factor-base sizes this harness can
    reach (m = 2, 3 and, where feasible, 4 at toy p), relation collection is
    dominated by Groebner solving per decomposition attempt, while the linear
    algebra is a sparse solve on a matrix of size about |V| by |V| with |V| in
    the hundreds. The prediction is s < 10^{-3} at every tested configuration,
    hence a pipeline ceiling below 1.001 even for a perfect linear-algebra
    solver. If that holds, the honest statement about L5 is not that equivariant
    linear algebra fails but that it is unmeasurable in this program's operating
    regime, which is a different and more useful closure.
    (C) THE SECOND HALF, WHICH IS INSTRUMENT CALIBRATION AND NOTHING ELSE.
    DECOMPOSITION L5's decisive test asks for displacement rank and
    block-circulant structure of relation matrices measured against a
    random-permutation null. This record measures ONLY THE NULL ARM: the
    displacement rank of the relation matrices the harness already produces from
    ordinary, unstructured factor bases. The prediction is full displacement rank
    up to a constant, matching a random sparse 0/1 matrix of the same dimensions
    and density. This establishes the null band that any future structured arm
    would have to beat, and it does so without constructing a phi-stable factor
    base.
    (D) THE PAUSE-CONDITION STATEMENT, MADE EXPLICITLY BECAUSE IT IS THE REASON
    THE DESIGN IS SHAPED THIS WAY. Pause condition P2 forbids anything bearing on
    H-STR-002 in either direction while DEFER-BATCH009-001 is open. H-STR-002
    concerns the cost model of a structured, equivariant relation matrix. This
    record constructs no equivariant factor base, imposes no phi-stability, and
    measures no structured arm; it measures (i) where the time goes in the
    unstructured pipeline and (ii) the unstructured matrix's displacement rank as
    a null. Neither quantity is evidence for or against H-STR-002's cost model,
    exactly as EV-ICINV-6b6264 records for its own contract.

  mechanism: >-
    A stage's optimisation potential is bounded by its cost share, and cost
    shares in this pipeline are set by the ratio of Groebner work per relation to
    matrix work per relation. Groebner solving at arity m on a factor base of
    size |V| is superpolynomial in practice, while a sparse solve is Otilde(|V|^2)
    at the sizes reachable here; the ratio therefore grows with |V| and the
    linear algebra becomes relatively cheaper as the experiment gets larger,
    which is the opposite of the asymptotic regime where index calculus is
    interesting. That inversion is the named obstruction: the lane's target stage
    is dominant only in a regime this program cannot instrument.

  tracked_object: >-
    The stage cost-share vector (relation search, Groebner solving, relation
    verification, matrix assembly, sparse solve, log recovery) normalised to sum
    to one, tracked as a function of arity and factor-base size.

  resource: >-
    R1 (x-coordinates as field elements, via the relation matrix). The record
    consumes no endomorphism structure at all, which is why it is safe under P2.

  lossy_projection_test: >-
    PASSES, in a modest register. The cost-share vector is a six-number
    projection of a whole run and discards every relation, every curve and every
    seed; runs with entirely different mathematics share a share vector. It
    propagates deterministically under the operation that matters here --
    composition of pipeline stages -- because shares of a composed pipeline are
    computable from the shares and totals of its parts. The record notes honestly
    that this is an accounting object, not a mathematical one, and that its value
    is priority information rather than structure.

  t5_reachability: >-
    Not applicable and stated: no curve selection, no walk, no class. If a future
    structured arm found a linear-algebra gain, T5 would not engage either, since
    the gain would live on one curve.

  null_object: >-
    A synthetic pipeline with a DELIBERATELY inflated linear-algebra stage --
    the same runs with the sparse solve replaced by a dense solve, or with the
    factor base enlarged until the matrix dominates -- which the instrument must
    report as a large s. An instrument that reports s < 10^{-3} on a pipeline
    engineered to be matrix-dominated is broken, and this is the two-directional
    control the campaign requires. For the displacement-rank half, the null is a
    random sparse 0/1 matrix of matched dimensions and density, and the planted
    positive is a genuinely block-circulant matrix of the same size whose
    displacement rank the instrument must report as small.

  why_not_a_renamed_known_approach: >-
    The lane's four committed records argue about what equivariance would buy:
    Wiedemann iteration counts and isotypic blocks (IDEA-20260807-fafc04),
    structured Gaussian elimination destroyed by folding (-d20846), the commutant
    as a product of full matrix algebras (-9ecc6f), and free relations that
    determine nothing (-61049d). Every one of them is an analysis of the stage's
    internal structure. None asks what the stage is worth. Amdahl's identity is
    not a new technique; applying it as a lane-priority gate is not present in
    this corpus.

  novelty_status: adaptation
  novelty_screen: >-
    Screened this session against the RQ-EQLA lane (IDEA-20260807-fafc04,
    -d20846, -9ecc6f, -61049d, -1e673d, -0e4d83, -45a69f), DECOMPOSITION L5, and
    the P2 language in DEC-20260810-d70ece and EV-ICINV-6b6264. WEB SEARCH
    UNAVAILABLE this session; Amdahl's identity and displacement rank are
    classical.

  discriminated_from: >-
    NOT IDEA-20260807-9ecc6f, whose commutant closure bounds the ACHIEVABLE
    saving inside the stage; this record bounds the VALUE of any saving inside
    the stage, and the two multiply rather than overlap. NOT
    IDEA-20260807-d20846, which shows folding destroys structured Gaussian
    elimination; that is a statement about a structured arm this record does not
    build. NOT IDEA-20260807-fafc04, which proposes measuring minimal-polynomial
    degree and Krylov linear complexity with and without an isotypic fold -- the
    fold is exactly the construction P2 makes hazardous, and its absence here is
    deliberate.

  assumptions:
  - >-
    The campaign harness's index-calculus pipeline is instrumentable per stage
    without changing its behaviour, i.e. counters can be added without altering
    the algorithm. If instrumenting changes the measured shares the record is
    void and says so.
  - >-
    Cost is measured in field operations where possible and in wall-clock only as
    a cross-check, since wall-clock on an oversubscribed host is not a
    measurement -- the campaign has recorded load averages above 43 on a 14-core
    machine, and a stage-share measurement taken under that load is void.
  - >-
    Toy factor-base sizes. The record makes NO claim about the asymptotic regime
    where the linear algebra is known to matter; the obstruction it names is
    explicitly regime-bound.

  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
    - transform: null
      proposed_object: null
      predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
    - claim: null
      responsibility: null
    not_applicable_reason: >-
      Purely empirical cost accounting plus an instrument calibration. Amdahl's
      identity is arithmetic and requires no proof search; the displacement-rank
      prediction for a random sparse matrix is a known genericity statement being
      used as a null band rather than proved here. Section 8 of the inventor
      protocol requires the reason to be recorded rather than the map omitted.

  predictions:
  - metric: linear_algebra_cost_share_s
    direction: lower
    minimum_effect: >-
      Below 10^{-3} at every tested (arity, factor-base size) cell. A cell with
      s >= 0.1 makes the lane live at that cell and must be reported prominently
      rather than averaged away.
  - metric: pipeline_ceiling_from_perfect_linear_algebra
    direction: different
    minimum_effect: >-
      1/(1 - s) below 1.001, i.e. far inside the sqrt(6) = 2.449 band that
      KN-TECH-018 defines as baseline calibration. This is the closure statement
      and it is a number, not an adjective.
  - metric: displacement_rank_of_unstructured_relation_matrices
    direction: different
    minimum_effect: >-
      Within 2 of min(rows, cols) for the shift-based displacement operator,
      matching the random sparse null within its own spread. A small displacement
      rank in the UNSTRUCTURED arm would be a genuine surprise about the
      harness's relation matrices and must be reported as such.
  - metric: trend_of_s_with_factor_base_size
    direction: lower
    minimum_effect: >-
      Decreasing over at least a fourfold range of |V|, confirming the inversion
      argued in the mechanism. An increasing trend means the toy regime is
      approaching the asymptotic one and the closure's scope must shrink
      accordingly.

  minimal_test:
    design: >-
      Instrument the existing pipeline with per-stage field-operation counters
      and per-stage wall-clock, run it on a grid of arity m in {2, 3} and
      factor-base size across at least a fourfold range at toy p, on an
      UNLOADED host, with at least 10 seeds per cell. Report the share vector per
      cell with its distribution. Then export the relation matrices and compute
      displacement rank against the random-sparse null and the block-circulant
      planted positive. Total: hours.
    controls:
    - >-
      MATRIX-DOMINATED PIPELINE as the inflated null, which must show a large s.
    - >-
      RANDOM SPARSE MATRIX null and BLOCK-CIRCULANT planted positive for the
      displacement-rank half, both mandatory and blocking.
    - >-
      HOST-LOAD GUARD: record load averages at every run and invalidate any cell
      measured above a declared threshold. A degraded run is an infrastructure
      event, never a null result (AGENTS.md rule 5), and this campaign has
      already recorded a dispatch gated on exactly this.
    - >-
      INSTRUMENTATION-NEUTRALITY CHECK: total runtime with and without counters
      must agree within 5 percent, or the measurement is void.
    required_metrics:
    - per_stage_field_operations_and_wall_clock_per_cell
    - normalised_stage_share_vector_with_distribution
    - amdahl_ceiling_per_cell
    - displacement_rank_of_each_relation_matrix
    - null_and_planted_displacement_ranks
    - host_load_at_each_run

  falsification_conditions:
  - >-
    s >= 0.1 at any tested cell. The lane is live in this program's own operating
    regime and the closure claim fails.
  - >-
    s increases with factor-base size. The inversion argument is wrong and the
    closure's regime bound is unsupported.
  - >-
    The inflated-null pipeline is not detected as matrix-dominated. The
    instrument is void and every share it reported is meaningless.
  - >-
    The unstructured relation matrices show low displacement rank. A genuine
    surprise; report it, replicate it, and do NOT interpret it as bearing on
    H-STR-002, which concerns structured bases.

  confounders:
  - >-
    HOST LOAD. Stage shares measured under oversubscription are meaningless and
    the campaign has recorded load averages above three times the core count.
    The guard is blocking, not advisory.
  - >-
    Implementation quality asymmetry: a naive sparse solver would inflate s for
    reasons unrelated to the mathematics, and a highly tuned Groebner backend
    would deflate it. Report the solver and its asymptotics alongside every share.
  - >-
    Toy scale is the whole point and also the whole limitation. The closure is
    regime-bound by construction and any citation of it as a general statement
    about index calculus is a misuse.

  interpretation_limits:
  - >-
    TOY SCALE, claim_tier toy. NO ATTACK, NO EXPONENT, NO SPEEDUP; sota_delta
    zero.
  - >-
    P2 RESPECTED, EXPLICITLY: no equivariant or phi-stable factor base is
    constructed, no isotypic fold is applied, and no structured relation matrix
    is measured. Nothing in this record bears on H-STR-002 in either direction,
    and any later citation of it against H-STR-002 is a misuse of the record.
  - >-
    A confirmed small s does NOT say equivariant linear algebra cannot work. It
    says this program cannot measure whether it works, which is a statement about
    the instrument's regime and is the honest form of the closure.
  - >-
    H-ENDO-001 used, not retested; KN-FIND-b7e091 binding.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      At the arities and factor-base sizes reachable by this harness, the
      per-relation cost of Groebner solving exceeds the per-relation cost of
      sparse linear algebra by at least three orders of magnitude, uniformly over
      the tested grid.
    rigorous_support: >-
      Rigorous ingredient: the sparse solve is Otilde(|V|^2) field operations for
      a matrix with O(1) entries per row at arity m, while a single decomposition
      attempt at arity m requires solving a zero-dimensional system whose Bezout
      number is |V|^{m-1}/g with g = 2 (IDEA-20260807-dadcd2), and Theta(|V|)
      relations are needed. The distribution imitated is none: this is a
      complexity comparison, and the heuristic content is only that the measured
      constants do not overturn the exponent gap at toy sizes.
    validation_plan: >-
      The measurement is the validation, and it is direct. Comparison: the
      predicted ratio computed from the counted operations against the measured
      ratio, per cell. Tail check: the cell with the largest |V| and the smallest
      arity, which is where the matrix is relatively most expensive and where a
      violation of HA-1 would first appear; report that cell individually rather
      than pooled.

  target_complexity:
    time_exponent: >-
      No attack exponent claimed or moved. The record BOUNDS a potential gain: at
      s < 10^{-3} the achievable pipeline speedup from any linear-algebra
      improvement is under 1.001x, which is inside baseline calibration and is
      not an attack under any reading.
    memory_exponent: >-
      Unchanged; the record measures shares and does not alter the pipeline.
    best_known: >-
      Parallel Pollard rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-001,
      KN-TECH-006). No index-calculus variant over a prime field is competitive
      at any size this program can run, which is the background fact that makes
      the whole stage-share question a priority question rather than an attack
      question.
    hidden_overhead: >-
      None hidden. The one thing an unwary reader could over-generalise is the
      regime bound, and it is stated three times.
    tradeoff_note: >-
      Not applicable.

  dominated_by: >-
    As an attack: not an attack; dominated by every frontier row -- parallel rho
    at 0.886 sqrt(N), O(1) memory (KN-TECH-001, KN-TECH-006); the
    automorphism-discounted variant (KN-TECH-018); BSGS at sqrt(N)/sqrt(N)
    (KN-TECH-031). As an analysis of L5: dominated by IDEA-20260807-9ecc6f on the
    achievable-saving axis, which already caps the saving at g in relations and
    g^2 in operations; this record caps the VALUE of that saving and the two
    compose.
  sota_delta: >-
    Zero on every attack axis. Against campaign priorities: converts a lane with
    four analytical proposals and no measurement into a lane with a measured
    ceiling.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: low

  honest_prior_of_survival: >-
    0.85 that s < 10^{-3} at every tested cell. 0.9 that the unstructured
    displacement rank is full. 0.00 that anything here produces a speedup. FILED
    AS A PROBABLE DEAD END THAT IS CHEAP ENOUGH TO KILL: its expected outcome is
    a number that lowers a lane's priority, and it costs a few hours of
    instrumentation on a pipeline that should be instrumented anyway.

  source_refs:
