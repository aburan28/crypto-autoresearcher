  lossy_projection_identifiability_audit:
    projection: >-
      The sealed attempt cohort {(X_i, terminal_code_i)} --> the coordinatewise
      aggregate C_IC[c], with the terminal codes retained in the receipts but
      NOT entering the aggregate, and thence --> alpha.
    what_is_discarded: >-
      The censoring indicator and hence the censoring fraction q; the shape of
      the right tail beyond M; and the distinction between an attempt that cost
      M and an attempt that was stopped at M.
    why_genuinely_lossy: >-
      Genuinely lossy in a way that cannot be undone: min(X, M) with the
      indicator dropped is not invertible, and the fibre over an observed
      aggregate contains cohorts with wildly different true costs -- everything
      from "all attempts finished just under M" to "all attempts were stopped at
      M and would have run forever".
    why_compatible_with_the_operations: >-
      Fully compatible with coordinatewise aggregation, which is why the defect
      is invisible in the frozen artifact: min(X, M) is a perfectly good
      additive coordinate and sums correctly. The failure is not in the algebra
      of the aggregation; it is that the aggregated quantity estimates something
      other than the cost.
    is_it_only_a_change_of_coordinates: >-
      NO, and the check performed was for the MIRROR failure, the
      constant-projection one. QUESTION ASKED: does the projected quantity
      retain spread across the instances it is meant to distinguish? ANSWER:
      IT LOSES ITS SPREAD IN ell PRECISELY WHERE IT MATTERS -- with a fixed cap,
      E[min(X,M)] tends to the constant M, so the aggregate becomes CONSTANT
      ACROSS CELLS and the comparator's spread in the growth direction goes to
      zero. That is exactly the zero-comparator-spread artifact tell, arriving
      through a route nobody looks at, and it is the structural diagnostic the
      inventor protocol section 3 asks for: the quantity that should keep
      growing with ell stops growing, and the parameter meant to reveal
      structure (ell) instead reveals the cap.

  assumptions:
    - >-
      That the protocol's per-attempt wall cap is applied per attempt across
      the whole ladder at a fixed 300 s, rather than being re-declared per cell
      at seal time. TEXTUAL SUPPORT: budgets.per_attempt_defaults is a single
      block with no per-cell override and schedule_obligations does not list a
      per-cell cap among the fields to be sealed. IF a per-cell cap scaled as
      sqrt(ell) is intended, repair R2 is already satisfied and the slope half
      of this proposal is void while the level half, the censoring fraction, the
      aggregate ambiguity and the budget arithmetic all stand. Stage 0 records
      which is intended before any measurement.
    - >-
      That an attempt's cost distribution has a right tail reaching beyond the
      cap at the tested cells. For rho this is exactly quantified. For an IC
      relation search it is asserted rather than measured here and is labelled
      RELAYED-UNVERIFIED; no IC arm is run and no IC censoring fraction is
      claimed.

  proof_search_map_note: >-
    Carried by the paired hypothesis H-ICEX-a2e95b.

  predictions:
    - metric: >-
        Ratio of the censored charged aggregate to the uncensored aggregate for
        matched Pollard rho, at cap multiples c = M/sqrt(ell) in
        {0.25, 0.5, 1, 2, 4}, pooled over the ladder cells
      direction: lower
      minimum_effect: >-
        FORCED VALUES 0.197413 / 0.382925 / 0.682689 / 0.954500 / 0.999937,
        each within the Monte Carlo band at the declared replicate count.
        Derived before any run from erf(c/sqrt 2). Monotone increasing in c. A
        measured ratio outside the band at any c falsifies either the birthday
        survival model or the implementation, and which one is decided by the
        separate goodness-of-fit check below rather than by assumption.
    - metric: >-
        Ratio of censored-with-restart cost per certified solve to the
        uncensored mean, same cells and same c ladder
      direction: higher
      minimum_effect: >-
        FORCED 6.416425 / 3.258850 / 1.735051 / 1.103896 / 1.000272. Monotone
        DECREASING in c, i.e. the OPPOSITE direction to the first prediction.
        The pre-registered content is the opposition itself: if both aggregates
        move the same way, the account is wrong.
    - metric: >-
        Fitted ladder slope of log2(charged aggregate) on n for matched rho with
        a FIXED cap M = 300 equivalent step units held constant across
        n in {8, 10, 12, 16}
      direction: lower
      minimum_effect: >-
        Predicted to fall strictly below 0.35, against a true exponent of
        exactly 0.5 and against the uncensored control's fitted slope which must
        land within its CI of 0.5. The asymptotic forced value is 0; the
        threshold 0.35 is set conservatively because the ladder is short and c
        is not yet small at n = 8. A fitted slope inside the uncensored CI
        refutes the slope half of the proposal.
    - metric: >-
        Fitted ladder slope of log2(cost per certified solve) under the same
        fixed cap
      direction: higher
      minimum_effect: >-
        Predicted strictly above 0.65 against a true 0.5, with asymptotic forced
        value 1. Together with the previous prediction this is the headline: the
        SAME runs, differing only in an unstated accounting convention, must
        straddle the true exponent from both sides.
    - metric: >-
        Fitted ladder slope under repair R2, cap scaled as M = c0 sqrt(ell) with
        c0 = 1, both aggregates
      direction: different
      minimum_effect: >-
        BOTH must return a slope whose CI contains 0.500, because a constant
        bias ratio is absorbed into the intercept. This is the constructive
        half and it must fire; if the repair does not restore the slope, the
        diagnosis is wrong even if the bias is real.
    - metric: >-
        Budget feasibility ratio computed from the frozen artifact:
        maximum_attempts * per_attempt_wall / per_campaign_wall
      direction: higher
      minimum_effect: >-
        EXACTLY 5.3333 (= 128 * 300 / 7200), and floor(7200/300) = 24 attempts.
        Zero compute, one division, from committed text. Predicted before the
        stage runs; if the arithmetic does not reproduce, the numbers were
        misread and the whole budget section is withdrawn.

  minimal_test:
    design: >-
      Four stages, cheapest-first, each able to terminate the line. STAGE 0
      (zero compute, minutes): recompute the budget ratio from the frozen text
      and record whether the per-attempt cap is intended fixed or per-cell. If
      it is per-cell and sqrt(ell)-scaled, the slope half is void immediately
      and the record says so. STAGE 1 (zero compute, one page): re-derive
      E[min(X,M)] = sqrt(pi ell/2) erf(c/sqrt 2), P(X<=M) = 1-exp(-c^2/2), the
      two ratio families, and the two asymptotic limits 0 and 1. STAGE 2
      (seconds, pure Python, no dependency): run matched Pollard rho to
      completion at n in {8,10,12,16}, recording the FULL uncensored step count
      per attempt; then apply every cap in the c ladder POST HOC to the same
      recorded costs. This is the design's central economy -- the censored and
      uncensored arms are the identical runs, so the comparison has no
      between-arm confound at all. STAGE 3 (minutes): fit the ladder slopes
      under fixed-M and under sqrt(ell)-scaled-M, both aggregates, and report
      the four slopes against the true 0.5.
    controls:
      - >-
        NULL OBJECT (same shape, forced value pre-derived, CAN FAIL) -- THE
        UNCENSORED ARM, c = infinity, on the identical recorded runs. FORCED
        VALUES: aggregate ratio EXACTLY 1.000, per-success ratio EXACTLY 1.000,
        fitted slope with CI containing 0.500. This null can genuinely fail: if
        the uncensored slope does not contain 0.5, the rho implementation is not
        the algorithm modelled and no censoring conclusion may be drawn from it.
      - >-
        POSITIVE CONTROL (if it does not fire, NO negative may be reported) --
        the c = 0.25 cell, where the derived distortion is 5.1x downward in
        aggregate (a). The measured ratio must land in the Monte Carlo band
        around 0.197413. This is the sensitivity demonstration: it shows the
        instrument CAN see a censoring distortion of the size the account
        predicts. If a 5x distortion is invisible, nothing about smaller ones
        may be concluded.
      - >-
        GRADED CONTROL, 5 INTERIOR POINTS, MONOTONICITY REPORTED -- the c ladder
        {0.25, 0.5, 1, 2, 4}. FORCED: aggregate (a) ratio MONOTONE INCREASING to
        1, aggregate (b) ratio MONOTONE DECREASING to 1, and the two curves
        approaching 1 from opposite sides with no crossing. Monotonicity is
        reported as a pass/fail per adjacent pair, so a failure localises to a
        cap value rather than leaving "the effect did not appear".
      - >-
        SURVIVAL-MODEL GOODNESS-OF-FIT CONTROL. Before any ratio is interpreted,
        the empirical survival of the recorded rho step counts is compared to
        exp(-t^2/(2 ell)) at each cell. If the model fails, the derived forced
        values are wrong but the DIRECTION of the bias is not, because
        E[min(X,M)] <= E[X] holds for every distribution. The record therefore
        pre-declares which conclusions survive a model failure (the sign and the
        repairs) and which do not (the specific numbers).
      - >-
        NEARBY-OBJECT CONTROL -- BSGS, whose cost is nearly deterministic
        (ceil(sqrt(ell)) baby steps plus a uniform number of giant steps) rather
        than heavy-tailed. FORCED: at the same c, BSGS's censoring distortion
        must be SMALLER than rho's, because a concentrated distribution has less
        mass beyond any cap set above its mean. This is the closest object where
        the hoped-for conclusion weakens, and it is included because it cuts
        against the headline: it shows the effect is a property of the cost
        DISTRIBUTION, so an arm with concentrated cost is barely affected.
      - >-
        ARCHIVE CHECK (zero compute). Prior censoring-fraction measurements in
        this corpus: NOT FOUND. EV-ICEX-001 records that no ICEX measurement has
        ever executed. Recorded as unavailable, not as a passed check.
      - >-
        VERDICT-ON-THE-NULL-FIRST. The uncensored arm is analysed and its
        slope written down before any capped arm is examined.

  falsification_conditions:
    - >-
      The uncensored control's fitted slope CI does not contain 0.5. The
      instrument is broken; NO negative may be reported (AGENTS.md rule 5).
    - >-
      Measured aggregate ratios do not follow erf(c/sqrt 2) within the Monte
      Carlo band AND the empirical survival matches exp(-t^2/2ell). The
      derivation is wrong and is withdrawn.
    - >-
      The two aggregates move in the SAME direction with c. The opposition claim
      is refuted and the record must be rewritten around whichever direction
      survives.
    - >-
      Under a fixed cap the fitted slope stays inside the uncensored CI at every
      cell. The slope-contamination claim is refuted at this ladder; the level
      claim may still stand and must be reported separately.
    - >-
      Repair R2 (sqrt(ell)-scaled cap) fails to restore a slope CI containing
      0.5. The diagnosis is wrong even if the bias is real, and the constructive
      recommendation must be withdrawn.
    - >-
      The budget arithmetic does not reproduce 5.3333 and 24. The numbers were
      misread and that section is withdrawn without prejudice to the rest.
    - >-
      Stage 0 establishes that the cap is per-cell and sqrt(ell)-scaled by
      intent. The slope half is void; the aggregate ambiguity, the missing
      censoring fraction, and the budget arithmetic stand.

  confounders:
    - >-
      POST-HOC CAPPING IS NOT IDENTICAL TO A REAL TIMEOUT. Applying caps after
      the fact to recorded full costs eliminates the between-arm confound but
      also eliminates real timeout side effects: partial-state loss, restart
      overhead, and cache effects. The design accepts this deliberately and says
      so; it isolates the ACCOUNTING effect, which is what is being audited, and
      it explicitly does not claim to measure the operational cost of a timeout.
    - >-
      WALL CLOCK VERSUS STEP UNITS. The frozen cap is 300 wall-clock seconds
      while the derivation is in step units. Converting requires a per-step
      time, which is machine-dependent, so the c ladder is defined directly in
      step units and the wall-clock cap is translated only for the budget
      arithmetic. Conflating the two would reintroduce exactly the unit problem
      IDEA-20260805-c8524f audits.
    - >-
      THE IC ARM IS NOT MEASURED, SO THE ASYMMETRY CLAIM IS UNTESTED HERE. The
      assertion that algebraic relation search is more heavy-tailed than rho is
      RELAYED-UNVERIFIED, is not measured by this package, and is not used in
      any forced value. It appears only as motivation and must not be cited as
      a finding.
    - >-
      SELECTION OF THE CAP LADDER. The c values were chosen to span the regime
      where erf(c/sqrt 2) moves; a different ladder would show a different
      effect size. This is disclosed rather than presented as neutral, and the
      monotonicity requirement is what makes the ladder informative rather than
      cherry-picked.
    - >-
      SCOPE. No SDEG, MONO, or RELN feed is consumed, no C_IC is assembled, and
      no IC campaign is run. The measured arms are generic baselines, which is
      what keeps this package outside the ICEX measurement ban recorded in
      DEC-20260731-015 / EV-ICEX-001.

  interpretation_limits:
    - >-
      A confirming outcome establishes that a charging convention in one frozen
      design artifact biases a measured exponent by a derivable amount on a
      GENERIC BASELINE. It establishes nothing about index calculus, moves no
      exponent, does not advance or close KN-OPEN-001, and licenses no status
      change to any record.
    - >-
      Toy tier and unraisable. The ladder is 8-16 bits and the arms are generic
      algorithms.
    - >-
      NOTHING HERE ARGUES FOR CHARGING TIMEOUTS AS INFINITE OR FOR TREATING
      THEM AS NEGATIVE MATHEMATICAL EVIDENCE. AGENTS.md rule 5 and the
      protocol's OBL-TERMINAL-VOCABULARY stand unqualified. The argument is
      that the symmetric error -- reading a timeout as a cheap attempt -- is
      currently unguarded, and that the guard is a reported fraction plus a
      scaled cap, not a change to how timeouts are classified.
    - >-
      The protocol is not superseded or edited by this proposal. If an amendment
      is warranted it is a new Coordinator record under a new id naming the
      exact clause (AGENTS.md rule 4).

  heuristic_assumptions:
    - id: HEUR-ICEX-C1
      statement: >-
        The Pollard-rho step count at group order ell has survival function
        S(t) = exp(-t^2/(2 ell)) (1 + o(1)), hence E[X] = sqrt(pi ell/2) and
        E[min(X,M)] = sqrt(pi ell/2) erf(M/sqrt(2 ell)).
      random_model_justification: >-
        The birthday computation, derived from S(t) rather than imported; the
        heuristic step is the passage from a structured r-adding walk to a
        uniform random function, which is known to be imperfect for small r and
        for which no source is cited here.
      supporting_results: []
      validation_experiment_ids: [EXP-ICEX-01a79b]
      falsification_condition: >-
        The empirical survival of the recorded step counts departs from
        exp(-t^2/2ell) beyond the declared Kolmogorov-Smirnov band at any cell.
        THE SPECIFIC FORCED NUMBERS ARE THEN VOID; the one-sided inequality
        E[min(X,M)] <= E[X] and the repairs SURVIVE, because they hold for every
        distribution. This split is declared before the run so that a model
        failure cannot be used to rescue either side.
    - id: HEUR-ICEX-C2
      statement: >-
        The frozen per-attempt wall cap is constant across the ladder cells
        rather than scaled with the cell.
      random_model_justification: >-
        NOT A DISTRIBUTIONAL ASSUMPTION AT ALL -- it is a reading of a committed
        artifact, and it is the single reading on which the slope half of the
        proposal depends. Recorded as a heuristic assumption rather than as a
        fact precisely because its author is unavailable to confirm it.
      supporting_results: []
      validation_experiment_ids: [EXP-ICEX-01a79b]
      falsification_condition: >-
        Stage 0 obtains a Coordinator statement that the cap is per-cell and
        scaled. The slope half is void; the level half, the aggregate
        ambiguity, the absent censoring fraction and the budget arithmetic
        stand unaffected.

  target_complexity:
    time_exponent: >-
      n/a. NO EXPONENT IS MOVED AND NO ALGORITHM IS PROPOSED. The proposal is
      about how an exponent is measured, not about what any algorithm costs.
      Stated plainly because the target-result profile biases toward
      exponent-moving work: this is not that, and its claim to attention is
      that it gates the only exponent this goal can report.
    memory_exponent: n/a -- no algorithm proposed.
    best_known: >-
      Unchanged: Pollard rho at 0.886 sqrt(N) group operations under this
      program's convention (KN-TECH-035).
    hidden_overhead: >-
      n/a. The proposal's own cost is one page of derivation plus minutes of
      pure-Python rho runs, and post-hoc capping means the censored and
      uncensored arms cost the same as the uncensored arm alone.
    tradeoff_note: >-
      The c parameter IS a measurement tradeoff: larger caps buy less bias at
      the price of longer campaigns, and the derived table prices that trade
      exactly -- c = 2 buys a bias below 0.006 in alpha at n = 12 for four times
      the per-attempt budget of c = 1.

  dominated_by: >-
    n/a (no result claimed). FRONTIER ROWS CHECKED so this null is not the
    unchecked kind AGENTS.md rule 5 forbids: (i) time -- Pollard rho
    0.886 sqrt(N), BSGS sqrt(N) processor steps; unaffected, no faster algorithm
    proposed. (ii) memory -- rho O(1) or 2^theta, BSGS sqrt(N); unaffected.
    (iii) data/queries -- no oracle model, no queries, no preprocessing, no
    advice. (iv) full cost / AT^2 -- KN-TECH-035's N^{2/3+o(1)} for BSGS and N
    for rho; unaffected and quoted rather than improved. No algorithm is
    proposed so no Pareto point is claimed. On the METHODOLOGICAL question, the
    incumbent inside this corpus is the frozen charging rule itself; the nearest
    adjacent instrument is IDEA-20260802-007's planted-bug detection ladder,
    whose declared 1.25x-8x range CONTAINS the distortions derived here, making
    it a detector for this defect rather than a competitor. A grep of the ICEX
    protocol for censoring corrections returned two occurrences of the word and
    no correction; absence of a search result elsewhere in the corpus is not
    evidence that none exists.
  sota_delta: >-
    No attack; measurement contribution only. Quantitatively the proposal claims
    four numbers against the status quo: a censoring distortion of 5.07x
    downward in the charged aggregate and 6.42x upward in cost-per-success at
    c = 0.25; an asymptotic fixed-cap exponent of 0 for the first aggregate and
    1 for the second against a true 1/2; an alpha shift at n = 12 ranging from
    -0.19506 to +0.22348 across the c ladder, every entry at c <= 1 exceeding
    the effect the goal seeks; and a budget feasibility ratio of 5.3333 in the
    frozen artifact. None of these four exists in this corpus today, and the
    protocol's twelve-entry confounders list contains none of them.

  estimated_cost:
    implementation: low
    compute: very low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.88 that the derived bias directions and the budget arithmetic survive. It
    is that high because E[min(X,M)] <= E[X] is a theorem rather than a model,
    because the two closed forms follow from one integral each, because the
    budget ratio is a division on committed text, and because the entire
    measurement uses one set of rho runs with caps applied post hoc, which
    removes the usual between-arm confound. It is not higher because HEUR-ICEX-C2
    -- the reading that the cap is fixed rather than per-cell -- is a reading of
    someone else's artifact and would void the slope half if wrong, because the
    specific forced numbers depend on the birthday model at small ell where
    Rayleigh behaviour is roughest, and because a reviewer may hold that the
    sealed schedules were always going to set caps per cell in practice, which
    would make the finding a documentation defect rather than a measurement one
    -- still worth recording, but smaller. Probability that the smallest
    deliverable lands -- the one-sided inequality, the missing censoring-fraction
    metric, and the 5.3333 budget ratio, all of which hold under every reading
    and every distribution -- is about 0.97.
