idea:
  id: IDEA-20260805-45bf55
  question_id: RQ-ICEX-001
  added: '2026-08-05'
  title: >-
    A fixed attempt cap drives the measured exponent to 0 or to 1 depending on
    which aggregate is charged: the ICEX protocol charges right-censored
    attempts at their cap, names TIMEOUT_CENSORED in its terminal vocabulary,
    and then contains no censoring fraction, no survival estimator and no
    attempts-per-replica pin -- while its own budget block forces censoring by
    construction at a ratio of 5.33
  class: control

  claim: >-
    The ICEX protocol charges every attempt "including failed and censored
    attempts" (accounting.stage_definitions.relation_collection) and maps a wall
    cap to TIMEOUT_CENSORED (budgets.exhaustion_mapping). A search of all 905
    lines finds the word "censored" exactly twice -- in those two places -- and
    finds NO censoring fraction metric, NO survival estimator, NO restart
    convention, and NO pin on attempts per replica. That combination is not a
    stylistic gap; it makes the reported exponent a function of an
    infrastructure parameter, and the function is derivable in closed form.
    Model an attempt's cost as X with survival S, and let the cap be M (in the
    same units as X). Two different aggregates are consistent with the
    protocol's text, and it never says which is meant:
      (a) CHARGED AGGREGATE, sum of min(X_i, M) over the sealed schedule;
      (b) CHARGED COST PER CERTIFIED SUCCESS, with a restart after a timeout.
    For the matched Pollard-rho control, where S(t) = exp(-t^2/(2 ell)) and the
    true group-operation exponent is EXACTLY 1/2, both aggregates have exact
    closed forms. Writing c = M / sqrt(ell):
      (a) E[min(X,M)] / E[X] = erf(c / sqrt 2) = 2*Phi(c) - 1;
      (b) (E[min(X,M)] / P(X <= M)) / E[X]
          = erf(c/sqrt 2) / (1 - exp(-c^2/2)).
    SESSION-COMPUTED FORCED TABLE, monotone in OPPOSITE directions, both tending
    to 1 as c grows:
      c    = 0.25      0.50      1.00      2.00      4.00
      (a)  = 0.197413  0.382925  0.682689  0.954500  0.999937
      (b)  = 6.416425  3.258850  1.735051  1.103896  1.000272
    The corresponding shifts in the frozen alpha at n = 12 are
    -0.19506 / -0.11541 / -0.04589 / -0.00560 / -0.00001 for (a) and
    +0.22348 / +0.14203 / +0.06625 / +0.01188 / +0.00003 for (b). Every entry
    at c <= 1 is larger in magnitude than the entire quantity the goal is trying
    to resolve.
    AND THE ASYMPTOTIC BEHAVIOUR IS WORSE THAN THE LEVEL SHIFT, BECAUSE A FIXED
    CAP MEANS c SHRINKS AS ell GROWS. With M fixed across the ladder,
    c = M / sqrt(ell) tends to 0, and for c << 1:
      (a) E[min(X,M)] -> M, a CONSTANT, so the fitted exponent -> 0;
      (b) E[min]/P(X<=M) -> M / (M^2/(2 ell)) = 2 ell / M, so the fitted
          exponent -> 1.
    The true exponent is 1/2. A fixed cap therefore drives the measurement to
    either end of [0,1] -- the choice of end being an unstated accounting
    convention -- on an object whose exponent is known exactly by construction.
    FINALLY, THE FROZEN BUDGET BLOCK FORCES CENSORING BY ARITHMETIC:
    budgets.per_attempt_defaults.wall_clock_seconds = 300 and
    per_campaign_defaults.maximum_attempts = 128 give 38,400 s of attempt
    budget against per_campaign_defaults.wall_clock_seconds = 7,200 s, a ratio
    of exactly 5.333. At most 24 full-length attempts fit in a campaign, so any
    128-attempt schedule either has mean attempt cost <= 56.25 s or is truncated.
    THIS IS AN AUDIT, NOT AN ATTACK. No exponent is moved, no mechanism is
    proposed, and no IC measurement is requested: every derivation above and
    every measurement below uses generic baselines and synthetic cost variables.

  object_first_candidate:
    tracked_object: >-
      THE PER-ATTEMPT COST AS A RIGHT-CENSORED RANDOM VARIABLE, together with
      its terminal code -- the pair (min(X, M), 1{X <= M}) -- followed through
      the protocol's coordinatewise aggregation into C_IC and then through
      alpha. The protocol tracks the first component and discards the second at
      the aggregation step. What is being followed here is the discarded
      indicator: the censoring pattern is the object, and the claim is that it
      carries more of the reported exponent than the mathematics does.
    established_families_off_limits: >-
      Off-limits as the primary lens: Semaev summation polynomials and any
      decomposition or relation mechanism; Groebner and solving-degree
      instrumentation; factor-base geometry; descent trees; endomorphism, GLV,
      volcano, and isogeny leverage; xedni and lifting; incidence and
      sum-product bounds; spectral and expander framings; multi-target
      amortization. No cryptanalytic mechanism is proposed. The lens used is
      elementary survival analysis applied to a cost accounting rule, and the
      accounting rule is the object under test.
    newness_score: >-
      Right-censoring bias is elementary and universally known in survival
      analysis; nothing in the mathematics is new. What is not in this corpus is
      the observation that this program's charging convention creates it, that
      the direction of the resulting exponent bias is opposite for the two
      aggregates the frozen text admits, and that a FIXED cap moves the SLOPE
      rather than the level -- driving a known 1/2 to 0 or to 1. The protocol's
      own confounders list has twelve entries, including
      "wall_clock_noise_vs_exact_group_op_counters" and
      "R_gain_zero_with_fabricated_alpha"; censoring is not among them, and
      neither is the budget arithmetic. Nearest prior art is
      IDEA-20260802-007, whose planted-bug ladder measures a detection floor for
      accounting distortions of 1.25x to 8x; the distortions here are 5.1x at
      c = 0.25 in aggregate (a) and 6.4x in aggregate (b), i.e. inside that
      ladder's declared range -- so 007's instrument would DETECT this defect if
      it were pointed at it, and it has not been. That is a concrete, checkable
      complementarity rather than a claim of independence.
    testability_score: >-
      Maximal, and the control is unusually good: Pollard rho's cost
      distribution is known in closed form, so the censored and uncensored
      aggregates can both be computed analytically AND measured, on the same
      runs, in seconds of pure Python. The budget arithmetic is one division.
    survival_score: >-
      The censoring object survives to any scale, because the mechanism is a
      property of the accounting rule and not of the algorithm. It is at its
      most dangerous exactly where the program most wants to measure -- the
      largest cell, where c is smallest -- which is the reverse of a
      finite-size artifact and is why it will not go away by scaling up.

  mechanism: >-
    DERIVED IN THIS RECORD; every numeric value is SESSION-COMPUTED from the
    stated closed forms and is re-derived as stage 1 of the paired experiment.

    SETUP. An attempt has cost X > 0 with survival function S(t) = P(X > t). A
    cap M truncates it: the charged cost is min(X, M) and the terminal code is
    TIMEOUT_CENSORED when X > M. Two elementary facts, both exact:
      E[min(X, M)] = int_0^M S(t) dt,        E[X] = int_0^inf S(t) dt,
    so E[min(X,M)] <= E[X] ALWAYS, with deficit int_M^inf S(t) dt. The charged
    aggregate is a lower bound on the true cost of the work attempted, never an
    unbiased estimate, and the bias is one-sided by a theorem rather than by
    assumption.

    THE CONTROL WHERE EVERYTHING IS COMPUTABLE. For Pollard rho under the
    birthday model (HEUR-ICEX-R1, carried by H-ICEX-4ccbaa and re-derived
    there), S(t) = exp(-t^2 / (2 ell)) in step units. Then
      E[X] = int_0^inf exp(-t^2/(2 ell)) dt = sqrt(pi ell / 2),
      E[min(X,M)] = int_0^M exp(-t^2/(2 ell)) dt
                  = sqrt(pi ell / 2) * erf(M / sqrt(2 ell)),
      P(X <= M) = 1 - exp(-M^2 / (2 ell)).
    With c := M / sqrt(ell) the two ratios in the claim follow immediately, and
    both depend on M and ell ONLY through c. That is the key structural fact:
    censoring bias is scale-free in c, so it is controllable by scaling the cap
    with sqrt(ell) and uncontrollable by fixing it.

    THE SLOPE RESULT, WHICH IS THE REAL FINDING. Hold M fixed across the ladder
    (which is exactly what budgets.per_attempt_defaults does -- 300 wall-clock
    seconds at every cell). Then c = M / sqrt(ell) falls like ell^{-1/2}.
      Small-c expansion: erf(x) = 2x/sqrt(pi) + O(x^3), so
        E[min(X,M)] -> sqrt(pi ell/2) * (2M / (sqrt(pi) sqrt(2 ell))) = M.
      The charged aggregate SATURATES AT THE CAP. Its log is log M, constant in
      ell, so the fitted exponent tends to 0.
      Meanwhile P(X <= M) -> M^2 / (2 ell), so cost per certified success
        E[min]/P -> M / (M^2/(2 ell)) = 2 ell / M,
      whose fitted exponent tends to 1.
    TRUE EXPONENT: EXACTLY 1/2. A single unstated accounting choice therefore
    selects between a measured 0 and a measured 1 on an object whose answer is
    known. No mathematics about index calculus is involved; this happens to the
    baseline.

    WHY THE DIRECTION MATTERS FOR THIS GOAL SPECIFICALLY. The completion
    criterion asks whether alpha's CI excludes 1/2. Aggregate (a) biases every
    arm's alpha DOWNWARD, and biases it more at larger ell -- i.e. it
    manufactures the "alpha < 1/2" verdict the goal is designed to test for.
    Aggregate (b) biases UPWARD and would manufacture the opposite. The bias is
    also ASYMMETRIC BETWEEN ARMS, and asymmetric in the direction that favours
    the treatment: rho and BSGS have light-tailed, tightly concentrated costs
    (Rayleigh; sd of log2 X = 0.9252 bits, derived in IDEA-20260805-c8524f)
    while an algebraic relation search is heavy-tailed, so at a common cap the
    IC arm is censored far more often and receives far more of the discount.
    An accounting rule that discounts the arm it censors most is not a neutral
    convention.

    THE INVERSION OF RULE 5. AGENTS.md rule 5 and the protocol's
    OBL-TERMINAL-VOCABULARY exist to prevent a timeout being read as NEGATIVE
    mathematical evidence, and that protection is correct and must be kept.
    What the charging rule does is the mirror image: it converts a timeout into
    a CHEAP ATTEMPT, i.e. into POSITIVE evidence for the arm that timed out.
    Both readings are errors and only one is currently guarded against. Stating
    this is not an argument for charging timeouts as infinite -- that would be
    the forbidden reading in the other direction. It is an argument for
    reporting the censoring fraction, for using an aggregate that acknowledges
    it, and for scaling the cap with sqrt(ell) so that c is constant across the
    ladder.

    THE BUDGET ARITHMETIC, ZERO COMPUTE, FROM THE FROZEN TEXT.
      per_attempt_defaults.wall_clock_seconds     = 300
      per_campaign_defaults.maximum_attempts      = 128
      per_campaign_defaults.wall_clock_seconds    = 7200
      128 * 300 = 38,400 s  vs  7,200 s  =>  ratio 5.3333,
      floor(7200 / 300) = 24 full-length attempts per campaign.
    So a sealed 128-attempt schedule is feasible only if the mean attempt costs
    at most 7200/128 = 56.25 s, i.e. only if the per-attempt cap binds on at
    most a small minority -- or the campaign terminates early and the schedule
    is itself truncated, which is a SECOND censoring mechanism (censoring of the
    attempt sequence rather than of the individual attempt) with its own bias.
    Neither is mentioned in the artifact. This single division is the cheapest
    decisive check in the whole proposal and it runs before anything else.

    THE REPAIRS, all cheap and all derivable rather than stipulated.
      R1. Report the censoring fraction q per cell per arm as a mandatory
          metric. It is free -- the terminal codes are already recorded.
      R2. Scale the cap with the cell: M = c0 * sqrt(ell) for a declared c0,
          so that the bias ratio is CONSTANT across the ladder and therefore
          absorbed into the intercept of a slope fit instead of contaminating
          the slope. This is the single highest-value change and it costs
          nothing.
      R3. Declare which aggregate is reported, (a) or (b), before the seal.
      R4. When q exceeds a declared threshold, treat alpha as UNDEFINED at that
          cell, exactly as the protocol already treats R_gain = 0 under
          OBL-ZERO-RANK-COST. The machinery for an undefined verdict exists;
          it is simply not wired to this condition.
      R5. Report a Kaplan-Meier or lower-bound-corrected aggregate alongside the
          raw one, so the size of the correction is visible rather than assumed
          small.

  novelty_status: unverified

