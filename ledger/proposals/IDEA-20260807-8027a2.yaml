  reachability_gate: >-
    TRIVIAL AND STATED EXPLICITLY, AND IN THIS RECORD IT IS TRIVIAL IN THE
    STRONGEST POSSIBLE SENSE: the Kummer line is not reached, it is already where
    the computation is. T5 gates movement between CURVES at cost about p^(1/4);
    this record moves nowhere at all. The quotient map E -> E/{+-1} is the
    x-coordinate the program has been using since KN-TECH-002, so the "model
    change" costs zero operations and is available on every curve without any
    existence condition - unlike the Edwards and Hessian models, which need
    rational 4- and 3-torsion respectively. That universality is precisely why the
    Kummer line is the terminal object of the lane and why no reachability cost can
    be charged against it.

  target_complexity:
    time_exponent: >-
