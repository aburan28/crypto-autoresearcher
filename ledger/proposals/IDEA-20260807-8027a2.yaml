idea:
  id: IDEA-20260807-8027a2
  question_id: RQ-MODEL-e61cb2
  added: '2026-08-07'
  title: >-
    THE KUMMER LINE IS NOT A NEW MODEL, IT IS THE TERMINAL ONE - Semaev's S_3 IS
    the differential-addition quadratic whose two roots are x(P+Q) and x(P-Q),
    with the exactly verifiable identity disc_T S_3(x1,x2,T) = 16 f(x1) f(x2);
    the "sum defined only up to sign" is therefore the SOURCE of the 2^(m-2)
    rather than a defect, the false-relation rate is predicted to be EXACTLY
    ZERO, and sign resolution costs at most 2^(m-1) group operations - so x-only
    working neither helps nor hurts asymptotically and the corpus should stop
    treating it as an unexplored model
  class: mechanism

  claim: >-
    (A) THE IDENTIFICATION. For a generic-j curve, E/{+-1} is the Kummer line
    P^1, and EVERY degree-2 coordinate on E is a Moebius reparametrisation of the
    quotient map E -> E/{+-1}. Short Weierstrass x, Montgomery x, twisted Edwards
    y, and the Hessian x + y are all such coordinates. Therefore SEMAEV'S
    SUMMATION POLYNOMIAL ALREADY IS THE KUMMER-LINE OBJECT: S_m(x_1,...,x_m) = 0
    says "there EXIST signs eps_i with sum eps_i P_i = O", which is a statement
    about points of the Kummer line and nothing else. Working "x-only" is not a
    change of model; it is a description of what the standard method already does.
    The corpus has treated Kummer/theta as an unexplored direction (the inherited
    PO-004 note in inputs/refs/research/
    proofs_Dreg_conservation_weil_invariance.md leaves "the intrinsic (non-x-line)
    abelian-surface / Kummer / theta / Mumford summation relation" OPEN), and this
    record's job is to separate the part of that which is genuinely open (GENUS 2
    Kummer SURFACES) from the part which is already occupied (the genus-1 Kummer
    LINE).

    (B) S_3 IS THE DIFFERENTIAL-ADDITION QUADRATIC. Read harness/semaev.py's
    s3_expr as a polynomial in x_3:
      S_3 = A T^2 + B T + C, A = (x_1 - x_2)^2,
      B = -2[(x_1 + x_2)(x_1 x_2 + a) + 2b],
      C = (x_1 x_2 - a)^2 - 4b(x_1 + x_2).
    Its two roots are exactly x(P_1 + P_2) and x(P_1 - P_2). This is the Montgomery
    differential-addition structure written as a polynomial: on the Kummer line the
    "sum" of two points is not a point but the UNORDERED PAIR {x(P+Q), x(P-Q)},
    and S_3 is the quadratic that has that pair as its roots. Nothing about
    x-only arithmetic is missing from Semaev's method - it IS Semaev's method.

    (C) THE EXACT IDENTITY, HAND-DERIVED AND SPOT-CHECKED, WHICH IS THE
    INSTRUMENT DELIVERABLE. From the chord formulas,
      x(P+Q) - x(P-Q) = -4 y_1 y_2 / (x_1 - x_2)^2,
    hence disc_T S_3 = A^2 (root difference)^2 = (x_1 - x_2)^4 * 16 y_1^2 y_2^2 /
    (x_1 - x_2)^4, i.e.
      disc_T S_3(x_1, x_2, T)  =  16 f(x_1) f(x_2),   f(x) = x^3 + a x + b.
    I verified this at two independent specialisations by hand:
      x_1 = x_2 = x gives LHS/4 = [2x(x^2+a)+2b]^2 = 4 f(x)^2 = RHS/4;
      x_2 = 0 gives LHS/4 = a^2x_1^2 + 4abx_1 + 4b^2 - a^2x_1^2 + 4b x_1^3
                          = 4b f(x_1) = RHS/4.
    This is extremely non-generic: a random (2,2,2) form has an irreducible
    discriminant of degree 4 in x_1, whereas this one has degree 3 and FACTORS
    COMPLETELY into one-variable factors. That total splitting is the algebraic
    fingerprint of the Kummer structure, it is checkable exactly in one line of
    sympy, and it is a far sharper instrument gate than "the planted root is a
    root".

    (D) WHAT THE SIGN AMBIGUITY COSTS AND WHAT IT BUYS - THE PART THE BRIEF ASKS
    TO BE STATED EXACTLY.
      (D1) WHAT IT BUYS - the entire factor 2^(m-2) instead of 2^(m-1). Because x
      is invariant under negation, the m-1 sign choices collapse under the global
      sign, and the per-variable degree is 2^(m-2), not 2^(m-1). If one insisted on
      tracking signed points, the relation variety would be a 2:1 cover and the
      system strictly larger. The ambiguity is a QUOTIENT and quotients are cheap.
      (D2) WHAT IT COSTS - after solving, one holds a coordinate tuple
      (x_1,...,x_m) and must determine WHICH signed lift is the actual relation.
      Brute force is at most 2^(m-1) group operations per solution (fix the first
      sign, try the rest, and the global sign is free). For m fixed this is O(1);
      concretely 4 at m = 3 and 8 at m = 4. harness/semaev.py's _find_decomposition
      already does exactly this, over (A, -A) x (B, -B), which is the m = 2 case.
      (D3) WHAT IT DOES NOT COST - THERE ARE NO FALSE POSITIVES. By the DEFINITION
      of the summation polynomial, S_m(x_1,...,x_{m-1}, x_R) = 0 iff there EXIST
      signs with sum eps_i P_i eps_R R = O. So every solution lifts to a genuine
      signed relation, and since R and -R give the same x, both are usable. The
      predicted false-relation rate is EXACTLY 0. This is a strong, cheap,
      binary instrument test and any nonzero rate means the polynomial or the
      lifting code is wrong.
      (D4) WHERE IT COULD HURT AND DOES NOT - one might fear the ambiguity
      propagates into the linear-algebra stage as an unknown sign vector,
      branching 2^m per relation. It does not, because (D2) resolves the sign
      BEFORE the relation is written down, at O(1) cost. A design that defers sign
      resolution to the linear algebra would pay 2^m per relation and would be
      strictly worse; recording that as a named anti-pattern is part of the
      deliverable.

    (E) THE ASYMMETRY THAT IS ACTUALLY WORTH MEASURING. The identity in (C) says
    the discriminant of the summation quadratic is a product of one-variable
    factors given by the curve's own defining polynomial in the chosen coordinate.
    So the model choice shows up in the DEGREES OF THOSE FACTORS: on short
    Weierstrass f is a cubic (three affine 2-torsion x-values plus the branch
    point at infinity); on twisted Edwards the branch locus of y is the quartic
    (1 - y^2)(a - d y^2), with no branch point at infinity; on Montgomery it is
    x(x^2 + Ax + 1) with the fourth branch point at infinity. In every case there
    are exactly 4 branch points (Riemann-Hurwitz for a degree-2 map from a genus-1
    curve to P^1), and a model is exactly a choice of WHERE THOSE 4 POINTS SIT
    relative to 0, 1, infinity. That is the correct reformulation of "curve model"
    for this lane and it is developed in IDEA-20260807-a575c8; this record's part
    is the discriminant identity that exposes the branch locus directly inside the
    summation polynomial.

    (F) THE TWO OUTCOMES.
      OUTCOME 1 - the identity holds exactly, the false-relation rate is 0, and
        sign resolution costs at most 2^(m-1). Then the x-only/Kummer direction is
        CLOSED for genus 1 with a named obstruction (the Kummer line is the
        terminal degree-2 quotient and Semaev already computes on it), and the
        residual open direction is precisely and only the genus-2 Kummer surface
        route that PO-004 flagged - which this record does NOT close and explicitly
        forwards.
      OUTCOME 2 - the identity fails, or a nonzero false-relation rate appears.
        Then either harness/semaev.py's s3_expr is not the summation polynomial it
        claims to be, or the lifting logic in _find_decomposition is incomplete.
        Either is an instrument defect that invalidates every EXP-SEMAEV number in
        the ledger and must be fixed first. That is a high-value negative.

  resource_label: R1 (x-coordinates as field elements), with R2 for the coordinate choice.
  admissibility: admissible
  admissibility_argument: >-
    ADMISSIBLE. R1 is the canonical non-generic resource: the oracle returns FIELD
    data (a coordinate value) rather than a group element, so the generic-group
    simulator of KN-FIND-b7e091 cannot produce it, and Shoup's bound does not
    apply to the algebraic step. H-ENDO-001 is irrelevant - no endomorphism is
    applied to points of G. The honest qualifier is that this record makes no
    attack and its content is a closure plus an instrument identity, so the
    admissible resource is being spent on precision rather than on speed.

  discriminated_from:
    - >-
      KN-TECH-002 and KN-TECH-003, which define summation polynomials and the
      decomposition test. This record adds the identification of S_3 with the
      differential-addition quadratic, the exact discriminant identity, and the
      sign-resolution accounting, none of which appear in those entries.
    - >-
      The inherited PO-004 note (inputs/refs/research/
      proofs_Dreg_conservation_weil_invariance.md section 2.2), which lists
      "Kummer / theta / Mumford" as the OPEN escape from degree invariance. This
      record splits that list: the genus-1 Kummer LINE is closed here; the genus-2
      Kummer SURFACE and theta coordinates on abelian surfaces remain open and are
      explicitly forwarded, not claimed.
    - >-
      IDEA-20260807-dadcd2, which proves the degree law. This record supplies the
      concrete m = 3 realisation, the discriminant identity, and the exact cost
      accounting for the sign ambiguity - which the law does not address at all.
    - >-
      EV-REP-001's observation that the naive Weierstrass collinearity system
      "W_native_x" has d_reg growing 4 -> 12 because "its extra solutions are +-y
      sign branches, NOT a model property". That observation is the empirical
      shadow of (D1): keeping y explicit un-quotients the sign and inflates the
      system. This record supplies the mechanism that EV-REP-001 diagnosed but did
      not derive.
    - >-
      KN-LIT-4613, KN-LIT-4614, KN-LIT-7559, KN-LIT-3061, KN-LIT-3513, KN-LIT-921,
      KN-LIT-1224, KN-LIT-493 in knowledge/SOURCES.md, all Kummer-related. These
      are known to me only as title rows; all appear to concern efficient
      arithmetic or isogenies on Kummer surfaces, not summation polynomials. If any
      contains a genus-1 Kummer summation-polynomial analysis this record is
      duplicate and must be reclassified.

  object_first_candidate:
    tracked_object: >-
      THE UNORDERED PAIR {x(P+Q), x(P-Q)} - equivalently the root pair of the
      differential-addition quadratic - tracked through the m-fold decomposition
      as the pair is chained.
    established_families_off_limits: >-
      Off-limits as primary lens for this session: rho, BSGS, Semaev-as-an-
      algorithm-to-tune, Weil descent, pairing transfer, lattice/HNP, isogeny
      walks, endomorphism leverage. The object here is a quotient of the group,
      not an algorithm.
    lossiness: >-
      LOSSY, COMPATIBLY, AND THE COMPATIBILITY IS EXACTLY WHAT MAKES THE KUMMER
      LINE WORK - the lossy-projection test applied algebraically and at zero
      compute. The projection P -> x(P) forgets the sign; the fibre has 2 elements
      so it is strictly non-injective and is not a change of coordinates. The
      discard is compatible with the group operation in the precise sense that
      {x(P+Q), x(P-Q)} is a well-defined function of (x(P), x(Q)) - which is the
      content of (B). It is NOT true that x(P+Q) alone is a function of
      (x(P), x(Q)); the branching factor is exactly 2, and the pair is the
      smallest deterministic object. This is the canonical Class-II "branching"
      case of the trichotomy in IDEA-20260806-c5d183: a lossy projection cannot
      propagate deterministically under the full translation action, and the
      Kummer line's response is to branch by 2 and carry the pair.
    propagation: >-
      One step, given the auxiliary x(P-Q), the pair collapses to a single value
      (that is differential addition, and it is why the Montgomery ladder works).
      Without the auxiliary value the branching is 2 per step, giving 2^(m-1)
      leaves for an m-fold chain and 2^(m-2) after the global-sign quotient - the
      summation polynomial degree. So the object's propagation rule and the
      Semaev degree are the same statement, which is the record's main content.
    survival_score: >-
      Survives every degree-2 reparametrisation (all standard models). Dies when
      the coordinate has degree not equal to 2, where the fibre is not a
      {+-1}-orbit and the pair structure is replaced by an n-element fibre with no
      quotient - which is exactly the Hessian-x case of IDEA-20260807-5f5ace.

  mechanism: >-
    STEP 1 - THE DISCRIMINANT IDENTITY, SYMBOLICALLY, AS A HARD GATE. Compute
    sympy.discriminant(s3_expr(a, b), x3) with a, b symbolic and check it equals
    16*(x1^3 + a*x1 + b)*(x2^3 + a*x2 + b) identically over Z[a, b, x1, x2]. Not
    modulo a prime, not on samples - identically. If this fails, s3_expr is not
    the summation polynomial and every EXP-SEMAEV record that used it needs
    revisiting; that is the single highest-value possible outcome of this record
    and it costs one function call.
    STEP 2 - THE ROOT IDENTIFICATION. For 500 random on-curve pairs (P, Q) over a
    16-bit prime, check that the two roots of s3_expr(a,b) at (x(P), x(Q), T) are
    exactly {x(P+Q), x(P-Q)} computed independently by harness/toycurve.py's add.
    Predicted: exact set equality in 100% of cases where x(P) != x(Q).
    STEP 3 - THE FALSE-RELATION RATE. Generate 5000 coordinate tuples that solve
    S_m over a small factor base at m = 3 and m = 4; for each, search the 2^(m-1)
    sign patterns for a genuine relation sum eps_i P_i = eps_R R using
    harness/toycurve.py as the independent verifier. Predicted rate of tuples with
    NO valid sign pattern: EXACTLY 0 out of 5000. Also record the empirical
    distribution of how many sign patterns work per tuple (predicted: usually
    exactly 1, occasionally 2 when a summand is 2-torsion or coincides).
    STEP 4 - THE SIGN-RESOLUTION COST. Measure the number of group operations
    actually spent per resolved relation at m = 2, 3, 4, 5. Predicted at most
    2^(m-1) with the naive search, and the record also asks whether an incremental
    strategy (resolve signs left to right, pruning) reduces it to O(m) - that is a
    small, honest, constant-factor engineering question with a definite answer.
    STEP 5 - THE MODEL SWEEP OF THE IDENTITY. Repeat Step 1 for the Montgomery,
    Edwards and Hessian-s summation polynomials of the sibling records. Predicted:
    the discriminant always factors as a product of two one-variable polynomials,
    each being (up to squares and the clearing factor) the model's own branch
    polynomial - cubic for Weierstrass and Montgomery, quartic for Edwards. The
    DEGREES of the factors are the model-dependent part; the FACTORISATION TYPE is
    the model-independent part. That contrast is the measurement.
    STEP 6 - THE NULL. Apply the random-Moebius null of IDEA-20260807-4fc635. The
    discriminant identity must survive as a factorisation statement (it is
    intrinsic) but the factor degrees must move as branch points cross infinity. A
    null in which the factorisation type breaks means the identity is being
    computed on a non-reduced polynomial.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep over ledger/ and knowledge/ for "Kummer" and for "differential
      addition" (2026-08-07). Full reads of KN-TECH-002, KN-TECH-003 (via
      KN-TECH-002 cross-reference), harness/semaev.py, harness/toycurve.py,
      ledger/EV-REP-001.yaml, and inputs/refs/research/
      proofs_Dreg_conservation_weil_invariance.md sections 1.5 and 2.2.
    results: >-
      INTERNAL - "Kummer" in knowledge/ resolves to SOURCES.md title rows only
      (KN-LIT-4613, 4614, 7559, 3061, 3513, 921, 1224, 493, 1417), none read
      beyond the title, and all appear to concern arithmetic or isogenies on
      Kummer SURFACES. "differential addition" returns no substantive record. The
      identity disc_T S_3 = 16 f(x_1) f(x_2) appears NOWHERE in this repository.
      The inherited PO-004 note explicitly leaves Kummer/theta OPEN, which is the
      statement this record narrows.
      EXTERNAL - that S_3 is the differential-addition quadratic is standard and
      NO NOVELTY IS CLAIMED FOR IT; it is folklore in the Montgomery-ladder
      literature (KN-LIT-4950 "Montgomery curves and the Montgomery ladder" is in
      the corpus index, title only). The discriminant identity is elementary and
      is very likely also known; it is recorded here for its use as an instrument
      gate, not as a discovery. Cheng-Kodera-Miyaji 2019 (IEICE E102-A(9)
      1061-1071) may contain related material and is Stage-0 reading.
    verdict: adaptation

  null_object_control: >-
    MANDATORY. Matched null for the false-relation-rate measurement: RANDOM
    COORDINATE TUPLES from the same factor base that do NOT solve S_m. For these
    the sign search must find NO valid relation, with rate EXACTLY 0 successes out
    of 5000 - the mirror of the positive test. An instrument that finds relations
    for non-solutions is finding them by accident and the positive rate means
    nothing. DECAY PARAMETER: the factor-base size B. As B grows the accidental
    hit probability for the null must decay like B^m/N; a null hit rate that does
    NOT decay as B is reduced is the canonical artifact tell. SECOND NULL for the
    discriminant identity: a RANDOM (2,2,2) form with the same support as s3_expr,
    whose discriminant must be irreducible of degree 4 in x_1 - confirming that
    total splitting is a property of the summation polynomial and not of the shape.

  assumptions:
    - >-
      x(P) != x(Q) in Step 2; the coincident case is the tangent branch and is
      excluded from the root-pair statement, though it must still satisfy S_3 = 0.
    - >-
      p > 3 and the curve non-singular, so f has distinct roots and the four
      branch points are distinct.
    - >-
      "Generic j" for the terminality claim in (A). For j = 0 and j = 1728 there
      are quotients by larger automorphism groups and the Kummer line is not
      terminal; those cases are handled by IDEA-20260807-dadcd2 and are excluded
      here.
    - >-
      harness/toycurve.py's add is correct; it is the independent verifier and its
      correctness is assumed, not tested, by this record.

  proof_search_map:
    bottleneck: >-
      Step 1, the discriminant identity. It is one symbolic computation, it either
      holds identically or it does not, and it is the gate through which every
      other claim in this record passes.
    baseline_embedding:
      parameter_slice: >-
        m = 2, where harness/semaev.py's _find_decomposition already implements the
        sign search over (A, -A) x (B, -B). The predicted sign-resolution cost
        2^(m-1) = 2 must match what that code actually does, which is 4 tests with
        the global sign not exploited - a factor-2 inefficiency this record would
        expose as its smallest concrete finding.
      reproduction_check: >-
        Run measure_s3_decomposition on a frozen instance and confirm the reported
        certificate verifies under verify_decomposition_certificate, and that the
        number of sign tests performed matches the prediction.
    observation_collision:
      observable: >-
        The factorisation type of disc_T S_3 as a polynomial in (x_1, x_2).
      distinct_preimage_search: >-
        REQUIRED. Search for a non-summation (2,2,2) form whose discriminant also
        splits into one-variable factors. If such forms are common, total splitting
        does not identify summation polynomials and the identity is a weak gate;
        if they are rare, it is a strong one. Either answer calibrates the gate and
        neither invalidates it.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Use the discriminant's factorisation as the observable and study its
          fibre - which (2,2,2) forms share it. This is what turns an identity
          into an instrument with a known false-positive rate.
        predicted_gain: >-
          A gate whose strength is quantified rather than assumed, at the cost of
          one extra sampling loop.
      - transform: representation_reduction
        proposed_object: >-
          Restate "the sign ambiguity of x-only arithmetic" as "the branching
          factor of the projection E -> E/{+-1}", which is a number (2) rather
          than a difficulty.
        predicted_gain: >-
          Converts a recurring qualitative worry in the corpus into the exact cost
          2^(m-1) group operations and the exact benefit 2^(m-2) versus 2^(m-1)
          in degree.
    quantifier_order: >-
      CLAIMED - FORALL p > 3 and FORALL non-singular y^2 = x^3 + ax + b over F_p,
      disc_T S_3(x_1, x_2, T) = 16 f(x_1) f(x_2) IDENTICALLY as polynomials; and
      FORALL solutions of S_m over the factor base, THERE EXISTS a sign pattern
      giving a genuine relation, findable in at most 2^(m-1) group operations.
      NOT CLAIMED - that exactly one sign pattern works (there can be more when
      2-torsion or coincidences occur); nor anything about genus 2.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For genus-1 curves of generic j, x-only / Kummer-line working is exactly
        what Semaev's method already does; it changes no degree, introduces no
        false relations, and costs at most 2^(m-1) group operations per relation
        to disambiguate." It can NEVER certify anything about genus-2 Kummer
        surfaces, theta coordinates on abelian surfaces, or Mumford representations
        - which remain OPEN and are forwarded.
      nearby_object_control: >-
        THE GENUS-2 KUMMER SURFACE, on which the conclusion is NOT claimed and
        may well fail: there the quotient is by {+-1} on an abelian surface, the
        "sum up to sign" structure is richer, and PO-004 records it as the only
        construction that could escape the degree invariance. Naming it as the
        nearby object where the method's conclusion does not reach is what
        prevents this record from being read as a closure of "Kummer" in general.
    proof_obligations:
      - claim: The roots of S_3 in T are x(P+Q) and x(P-Q).
        responsibility: correctness
      - claim: "disc_T S_3 = 16 f(x_1) f(x_2) identically."
        responsibility: correctness
      - claim: Every solution of S_m lifts to some signed relation.
        responsibility: correctness
      - claim: Sign resolution costs at most 2^(m-1) group operations.
        responsibility: runtime
      - claim: The false-relation rate is 0.
        responsibility: success_probability
      - claim: Genus 2 is not covered.
        responsibility: scope

  predictions:
    - metric: >-
        symbolic equality disc_T s3_expr(a,b) == 16*f(x1)*f(x2) over Z[a,b,x1,x2]
      direction: different
      minimum_effect: >-
        EXACT identity, zero tolerance, symbolic not numeric. Failure is an
        instrument defect affecting the whole EXP-SEMAEV family.
    - metric: >-
        fraction of random on-curve pairs for which the roots of S_3 in T equal
        {x(P+Q), x(P-Q)}
      direction: different
      minimum_effect: EXACTLY 1.000 over 500 trials with x(P) != x(Q).
    - metric: false-relation rate among solutions of S_m over the factor base
      direction: different
      minimum_effect: >-
        EXACTLY 0 out of 5000 at m = 3 and at m = 4. Any nonzero rate is a
        falsification of (D3) and a defect in either the polynomial or the lifting.
    - metric: group operations per resolved relation
      direction: different
      minimum_effect: >-
        At most 2^(m-1); measured against harness/semaev.py's current 2^m loop,
        which is predicted to be a factor 2 wasteful at every m.
    - metric: >-
        degree of each one-variable factor of the discriminant, per model
      direction: different
      minimum_effect: >-
        Cubic for Weierstrass and Montgomery, quartic for twisted Edwards, with
        the FACTORISATION TYPE (product of two one-variable factors) identical in
        every model. A model where the type breaks falsifies the branch-locus
        reading in (E).

  minimal_test:
    design: >-
      STAGE 1 (SECONDS, and it is the cheapest decisive test in the whole lane):
      one call to sympy.discriminant on s3_expr with symbolic a, b, compared
      against 16*f(x1)*f(x2). Pass or fail, immediately.
      STAGE 2 (minutes): the 500-pair root identification against
      harness/toycurve.py.
      STAGE 3 (an hour): the false-relation-rate measurement at m = 3, 4 with the
      matched non-solution null, over 3 primes and 3 seeds.
      STAGE 4 (minutes): sign-resolution cost counting and the left-to-right
      pruning variant.
      STAGE 5 (an hour): the discriminant identity across the Montgomery, Edwards
      and Hessian-s polynomials produced by the sibling records.
      STAGE 6 (minutes): the random-(2,2,2)-form null for gate calibration and the
      random-Moebius null.
    controls:
      - non-solution coordinate tuples (must yield no relation)
      - random (2,2,2) forms with matched support (discriminant must not split)
      - random-Moebius null per IDEA-20260807-4fc635
      - >-
        the m = 2 baseline already implemented in harness/semaev.py, as the
        reproduction anchor
      - >-
        a deliberately corrupted s3_expr (one coefficient perturbed), which the
        discriminant gate must reject - proving the gate has teeth
    required_metrics:
      - symbolic pass/fail of the discriminant identity, per model
      - root-set agreement fraction over random pairs
      - false-relation rate and its confidence interval, positive and null arms
      - group operations per resolved relation, per m, naive and pruned
      - factor degrees of the discriminant, per model
      - number of valid sign patterns per solution (distribution)

  falsification_conditions:
    - >-
      The discriminant identity fails symbolically. Then s3_expr is not the
      summation polynomial as documented, and the correct disposition is an
      instrument-defect report that supersedes nothing but blocks every
      EXP-SEMAEV interpretation until resolved.
    - >-
      The roots of S_3 in T are not {x(P+Q), x(P-Q)}. (B) is false.
    - >-
      A solution of S_m admits no valid sign pattern. (D3) is false and the
      x-only setting DOES introduce false positives - which would be a genuine
      cost of the Kummer view and would change the accounting in (D).
    - >-
      Sign resolution needs more than 2^(m-1) operations in the worst case
      observed. (D2) is false.
    - >-
      The random-(2,2,2) null also splits totally. The gate has no discriminating
      power and must not be used as an instrument check.
    - >-
      The corrupted-s3_expr control passes the gate. The gate is not implemented
      correctly and nothing is reported.

  confounders:
    - >-
      2-TORSION AND COINCIDENT SUMMANDS produce solutions with more than one valid
      sign pattern and can inflate or deflate the measured rates. They must be
      counted separately, not filtered silently (AGENTS.md rule 8).
    - >-
