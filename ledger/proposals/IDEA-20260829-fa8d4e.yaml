idea:
  id: IDEA-20260829-fa8d4e
  question_id: RQ-SCURVE-7af163
  goal_id: GOAL-SCURVE-873d08
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    SCHOOF-LITE - certify the ODD small-prime structure of #E(F_p) and
    #E^t(F_p) from the curve equation alone by computing the trace of Frobenius
    modulo each small odd prime q, with NO point counting, NO base point and NO
    SEA backend; the first instrument in this program that binds a group order to
    the curve COEFFICIENT, now checked against the published trace in the
    in-repository SafeCurves mirror
  class: algorithm

  claim: >-
    IDEA-20260829-d052e6 certifies the 2-PART of the M-221 curve and twist
    cofactors from Legendre symbols. The ODD part is untouched by it and by
    every other record in this repository, and the odd part is exactly what the
    question's "subgroup, cofactor, and invalid-curve confinement costs"
    diagnostic needs. This record supplies it, and - because the SafeCurves
    mirror at inputs/SAFECURVES-20260825/ IS PRESENT IN THIS REPOSITORY and
    publishes the trace, both cofactors and the twist subgroup order for M-221 -
    it can now be checked against a reference value rather than merely emitted.
    Five separable sub-claims of decreasing rigour, each independently
    falsifiable.

    (C1) RIGOROUS, NO HEURISTIC, NO COMPUTE. Let E/F_p be an elliptic curve with
    trace of Frobenius t, so #E(F_p) = p + 1 - t and #E^t(F_p) = p + 1 + t. For
    every prime q different from p:
    q divides #E(F_p) if and only if t is congruent to p + 1 modulo q, and
    q divides #E^t(F_p) if and only if t is congruent to -(p + 1) modulo q.
    Both statements are immediate from the two order formulas and need nothing
    else. THE CONSEQUENCE IS THE WHOLE POINT - the small-odd-prime divisibility
    of BOTH the curve group and the twist group is a function of t modulo q
    alone, and t modulo q is computable without ever computing t.

    (C2) FEASIBLE, WITH AN EXPLICIT COST. Schoof's identity states that the
    Frobenius endomorphism pi satisfies pi^2 - t*pi + p = 0 on the whole curve
    and hence on the q-torsion subgroup E[q]. Working in the ring
    R_q = F_p[x, y] / (psi_q(x), y^2 - f(x)), where psi_q is the q-th division
    polynomial of degree (q^2 - 1)/2 for odd q, one finds the unique t_q in
    Z/qZ satisfying, as an identity in R_q,
    (x^{p^2}, y^{p^2}) + [p mod q](x, y) = [t_q](x^p, y^p),
    by trying all q candidate values. This costs O(q^2 log p) multiplications in
    F_p with schoolbook polynomial arithmetic, and O(q^2 log p) bits of memory.
    NO MODULAR POLYNOMIALS, NO ELKIES PRIMES, NO ISOGENY COMPUTATION AND NO
    COMPUTER-ALGEBRA SYSTEM ARE REQUIRED - only F_p arithmetic on Python
    arbitrary-precision integers and polynomial arithmetic built on it. This is
    the specific reason the lane is unblocked in an environment whose declared
    assumption is that no SEA backend exists.

    (C3) THE REFERENCE VALUES NOW EXIST IN THIS REPOSITORY, AND THAT CHANGES
    WHAT THE INSTRUMENT IS FOR. Read on 2026-08-29 from
    inputs/SAFECURVES-20260825/tables/, whose provenance and authority order are
    recorded below.
    From tables/disc.tsv, the M-221 TRACE is published as
    t = -3509210517603025598879416729141978.
    From tables/twist.tsv, the M-221 COFACTOR is 2^3 and the TWIST COFACTOR is
    2^2, and the twist prime subgroup order is published in full as
    l' = 2^219 - 877302629400756399719854182285495.
    From tables/complete.tsv, M-221 has exactly 1 point of order 2 and exactly 2
    points of order 4.
    From tables/rho.tsv and tables/twist.tsv, the rho cost is 2^108.8 and the
    twist rho cost is 2^109.3.
    THE INSTRUMENT'S PRIMARY OUTPUT IS THEREFORE NO LONGER AN UNCHECKED
    CERTIFICATE BUT A COMPARISON. For each odd prime q the run emits t mod q
    computed from (p, A) alone and compares it against the published t reduced
    modulo q. AGREEMENT ON THE PRIMES UP TO 31 IS A 36.55-BIT CONSISTENCY RESULT
    binding the published trace to the published curve equation - a binding no
    record in this program currently holds for any curve. DISAGREEMENT IS A
    FINDING ABOUT THE TRANSCRIPTION or about the instrument, and the record
    pre-commits to excluding implementation error first, then re-reading
    pages/disc.html at the authoritative tier, before any external statement.

    (C4) A FREE, ZERO-COMPUTE, TWO-ROUTE CHECK ON THE PUBLISHED TRACE ITSELF,
    AVAILABLE BEFORE ANY INSTRUMENT IS BUILT. The mirror publishes t in
    tables/disc.tsv AND publishes the twist cofactor 2^2 together with the exact
    twist subgroup order l' in tables/twist.tsv. These are INDEPENDENT columns of
    independent pages. Since #E^t = 4*l' and #E + #E^t = 2p + 2 exactly, the
    trace is DERIVABLE as t = #E^t - (p + 1) = 4*l' - p - 1. That derived value
    must equal the published t exactly. This is one big-integer multiply and one
    subtraction, it uses no instrument at all, and it is the cheapest test in
    this record. PREDICTED EXACT EQUALITY. A mismatch localises a defect to one
    of two named columns of one named page and is a material process finding
    about the mirror.

    (C5) THE STANDALONE EVIDENTIAL WEIGHT, STATED HONESTLY AND SEPARATELY,
    BECAUSE IT IS SMALL. Independently of any published value, the run certifies
    that no odd prime q at most Q divides #E or #E^t. Under a null in which t is
    uniform modulo each q, the probability of passing all ten primes from 3 to 31
    is the product of (1 - 2/q), which is 0.0621, that is 4.01 bits. FOUR BITS,
    NOT THIRTY-SIX. The 36.55 bits of log2 of the product of those primes is the
    strength of C3's comparison against a published trace and may never be quoted
    for the standalone statement. Both numbers appear in this record precisely so
    neither can be substituted for the other downstream.

  mechanism: >-
    THE TRACKED OBJECT is the action of Frobenius on the q-torsion, compressed
    to the single residue t mod q; equivalently the characteristic polynomial of
    pi restricted to E[q], which is determined by the pair (t mod q, p mod q)
    and hence, p being fixed, by t mod q alone.

    LOSSY-PROJECTION TEST (docs/inventor-protocol.md section 2), applied BEFORE
    any compute.
    WHAT IS DISCARDED. The 221-bit trace collapses to a residue modulo a prime
    below 32 - at q = 31 that is five bits out of 112 significant bits of t. The
    group structure, the base point, the odd part of the order, the j-invariant
    and the CM data are all discarded. The fibre over a fixed residue vector is,
    by Hasse, of size about 4*sqrt(p) divided by the product of the primes,
    which for M-221 at Q = 31 is about 2^{112 - 36.55} = 2^{75.4} admissible
    traces. The projection is enormously lossy.
    IS IT A CHANGE OF COORDINATES? No. Nothing about A, about #E or about t is
    recoverable from the residue vector; the fibre above is superpolynomially
    large.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS THE AUDIT USES? Four
    operations, four deterministic answers. (i) QUADRATIC TWISTING sends t to
    -t, so the residue vector of E^t is the negation of that of E, componentwise
    and exactly - no recomputation is needed and this is the source of the twist
    half of C1. (ii) F_p-ISOMORPHISM leaves t unchanged, so the vector is a
    genuine isomorphism invariant, unlike d052e6's halving chain whose
    intermediate symbols are model-dependent. (iii) MODEL CHANGE between
    Montgomery, twisted Edwards and short Weierstrass is a birational
    F_p-isomorphism, so the vector is preserved exactly; only psi_q must be
    recomputed in the new model. (iv) F_p-ISOGENY of any degree preserves #E and
    hence t, so the vector is an ISOGENY-CLASS invariant - strictly coarser than
    the curve and strictly finer than d052e6's terminal valuation. THE RETAINED
    PART PROPAGATES DETERMINISTICALLY UNDER ALL FOUR. PASSES.
    WHERE THE STRUCTURE DISSOLVES, MEASURED NOT ASSUMED. At the value of q where
    (q^2 - 1)/2 makes the polynomial arithmetic unaffordable. The dissolution is
    a budget boundary, not a mathematical one, and the deliverable must report
    the largest q actually reached rather than the largest hoped for.

    WHY AN INSTRUMENT AT ALL, NOW THAT THE TRACE IS PUBLISHED IN THE REPOSITORY.
    Three reasons, stated because the objection is the right one to raise.
    FIRST, THE PUBLISHED TRACE IS A TRANSCRIPTION AND THE GOAL'S STANDING DEFECT
    IS EXACTLY THAT - the campaign's own next_action records that every stated
    numeric relation is a transcription plus a pending check, and every criterion
    cell in the intake is declared user_supplied_unverified. An independently
    derived t mod q IS the pending check, and it is the only one available that
    starts from the curve equation rather than from another transcribed integer.
    SECOND, IDEA-20260829-e37b52's consistency lattice provably cannot supply it,
    because its identity I1 relates h, l, h' and p_2 to 2p + 2 and NEVER READS
    THE COEFFICIENT A; an error in A is invisible to it by construction, and is
    caught here with probability about 1 - 2^{-36.55}. THIRD, the instrument
    transfers to curves the mirror does not cover, including every synthetic
    control this program generates, where no published trace exists.

    WHY THIS IS NOT d052e6 AND NOT ITS EXTENSION. d052e6 tracks Legendre symbols
    of explicitly computable field elements down a halving chain and returns
    v_2. It is confined to the prime 2 by construction, because halving is a
    2-descent and there is no odd analogue of it that costs O(1) exponentiations.
    Schoof-lite tracks a polynomial identity in a ring of dimension (q^2 - 1)/2
    and returns a residue modulo q. The two share the target quantity - the
    cofactor - and share NOTHING ELSE - not the object, not the algorithm, not
    the cost class, not the failure modes. Their outputs COMPOSE by the Chinese
    remainder theorem into t modulo 2^{v} times the product of the odd primes,
    and that composition is a deliverable neither can produce alone. NOTE ALSO
    THAT THE MIRROR NOW SETTLES d052e6's OWN PREDICTIONS FOR THIS ROW -
    tables/twist.tsv gives M-221 cofactor 2^3 and twist cofactor 2^2, which is
    exactly d052e6's claim C2 forcing v_2(#E^t) = 2 from v_2(#E) >= 3 at
    p congruent to 1 modulo 4, and tables/complete.tsv's "1 point of order 2"
    is exactly its cyclic branch chi(A^2 - 4) = -1.

    WHY NOT JUST RUN SEA. Because it is not available. Implementing SEA requires
    modular polynomials Phi_q, which are large precomputed objects this program
    does not hold, and an isogeny-kernel computation. Schoof's original
    algorithm requires only psi_q, which is generated by a three-line recurrence.
    The cost difference is real and is disclosed in target_complexity - Schoof at
    a single q is O(q^2 log p) F_p-operations, and reaching a FULL point count
    would need the primes up to about 600 for a 221-bit p, where
    (q^2 - 1)/2 is about 180000 and the run is hopeless. THIS RECORD THEREFORE
    CLAIMS A SMALL-PRIME SIEVE AND NOT A POINT COUNT, and any downstream record
    that writes "#E = ..." from this instrument's output alone has committed a
    claim-tier violation - though #E is now separately AVAILABLE from the mirror
    by C4's derivation, which is a transcription-derived value and must be
    labelled as one.

    EXECUTION. Step 0, zero compute - run C4's two-route check on the published
    columns. Step 1, implement psi_q by the standard recurrence and verify it
    symbolically against the defining property that its roots are exactly the
    x-coordinates of the nonzero q-torsion, checked at toy scale by exhaustive
    root-finding. Step 2, implement arithmetic in R_q and the Frobenius identity
    search. Step 3, VALIDATE BY EXHAUSTION at toy scale - for several small
    primes p, for EVERY admissible Montgomery A, compute t by direct enumeration
    of Legendre symbols and compare t mod q against Schoof-lite for every q that
    fits. This is a complete census, not a sample. Step 4, apply the frozen
    instrument to (p = 2^221 - 3, A = 117050) for increasing q until budget, and
    compare each residue against the published t reduced modulo q. Step 5, run
    the SAME code on the quadratic-twist model at full size and require the
    residue vector to be exactly the negation - a full-size, independent,
    self-contained correctness check that does not use any published value.

