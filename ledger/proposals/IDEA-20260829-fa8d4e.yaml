  minimal_test:
    design: >-
      STAGE 0, ZERO COMPUTE BEYOND ONE MULTIPLY, AND IT IS THE CHEAPEST VALID
      DISCRIMINATOR IN THIS RECORD. Run C4 - read l' and the twist cofactor from
      tables/twist.tsv, compute 4*l' - p - 1, and compare against the published
      trace in tables/disc.tsv. Then derive C1 and the Frobenius identity and
      write the derivation note; confirm p = 2^221 - 3 is congruent to 1 modulo 4
      and that the published trace is congruent to 2 modulo 4. A failure at this
      stage is the cheapest possible negative and it costs no instrument at all.
      STAGE 1, minutes of compute, and it settles the instrument. EXHAUSTIVE
      CENSUS at three primes near 2^13 to 2^15, at least one congruent to 1
      modulo 4 and one congruent to 3 modulo 4. For EVERY A in F_p with A^2 - 4
      nonzero, compute t by direct enumeration of Legendre symbols over all x, an
      O(p) pass; compute t mod q by Schoof-lite for q in {3, 5, 7, 11, 13};
      require exact agreement on every single (A, q) pair. Complete population,
      not a sample.
      STAGE 2, minutes to hours. Apply the frozen instrument to
      (p = 2^221 - 3, A = 117050) for q ascending from 3 until the wall-clock
      cap, emitting a per-prime certificate AND its comparison against the
      published trace as each completes, so a budget stop leaves a usable partial
      result rather than nothing.
      STAGE 3, same cost as Stage 2. The full-size twist-model self-check, which
      uses no published value.
      STAGE 4, minutes. The nulls and controls - 10^3 random A at the real p for
      the uniformity test, the A' = 117051 nearby control, and the Anomalous row
      positive control against its published t = 1.
      STAGE 5, seconds. Compose with IDEA-20260829-d052e6's v_2 by the Chinese
      remainder theorem and publish t modulo 2^{v_2 + 2} times the product of
      the odd primes reached, beside the mirror's published t, as the family's
      first equation-derived constraint on a group order and its first
      independent check of a published one.
    controls:
      - >-
        POSITIVE, BLOCKING, AND IT MUST FIRE AT TOY SCALE. Constructed toy curves
        with a KNOWN small prime dividing #E - built by choosing p and t with
        t congruent to p + 1 modulo q and finding a curve of that trace by
        search at 13 to 15 bits. The instrument must return exactly that
        divisibility. An instrument that has only ever returned "q does not
        divide" cannot certify "q does not divide"; this is
        IDEA-20260807-98a970's rule and it is blocking here.
      - >-
        POSITIVE, BLOCKING, AT CRYPTOGRAPHIC SIZE - the Anomalous row, whose
        mirror trace is published as exactly 1. The instrument must return
        t congruent to 1 modulo every q. This control did not exist before the
        mirror was available and it is the strongest addition the mirror makes to
        this record's design.
      - >-
        POSITIVE, FULL SIZE, USING NO PUBLISHED VALUE - the quadratic-twist model
        at 2^221 - 3, whose residue vector is forced by theory to be the exact
        negation. This is the parameter-matched positive control that
        distinguishes testing the instrument from testing the table.
      - >-
        NEGATIVE, PARAMETER-MATCHED - A' = 117051 over the same p, same field,
        identical code path, not predicted to give the same residues, and absent
        from the mirror so that no published value can leak into the verdict.
      - >-
        NULL, SAME SHAPE - 10^3 uniformly random admissible A at the real p,
        identical code path, for the uniformity test above, with seeds recorded.
      - >-
        REFUSAL CONTROL - a SUPERSINGULAR curve at a prime congruent to 3 modulo
        4, where t is 0, fed to the identical pipeline. The instrument must
        return t congruent to 0 modulo every q and must NOT crash or silently
        return a random residue.
      - >-
        CROSS-IMPLEMENTATION - psi_q generated twice, once by the recurrence and
        once by explicit interpolation from the q-torsion x-coordinates at toy
        scale where those are computable by root-finding. Disagreement voids the
        run.
      - >-
        SOURCE-TIER CONTROL - for every mirror value that enters a reported
        comparison, re-read the corresponding cell from pages/*.html before the
        comparison is published, per MIRROR-DEF-1's authority order. A tier-2
        value that disagrees with its tier-1 source is a mirror defect and must
        be reported as one.
    required_metrics:
      - 'the C4 two-route trace check as an exact integer difference, expected zero'
      - 'per toy p and per q, the exhaustive agreement fraction with brute-force t'
      - 'for M-221, per q, the value t mod q, the published t mod q, and their difference'
      - 'for M-221, the composed constraint on t modulo the product of primes reached'
      - 'for the twist model, per q, the residue and its agreement with the negation'
      - 'for the Anomalous row, per q, the residue against the published t = 1'
      - 'per q, measured F_p-multiplication count and wall clock, and the fitted exponent'
      - 'the uniformity chi-square statistic per q over 10^3 random A at the real p'
      - 'the largest q reached and the wall-clock cap that stopped it'
      - 'per mirror value used, the file, the table number, the line, and the tier read'

  falsification_conditions:
    - >-
      4*l' - p - 1 does not equal the published trace for M-221. Two independent
      mirror columns are mutually inconsistent - halt, re-read both cells from
      pages/twist.html and pages/disc.html at the authoritative tier, and report
      a mirror defect if the tier-1 reading confirms it. This is a process
      finding about the intake, not a mathematical result, and must not be
      dressed up as one.
    - >-
      Any (A, q) pair in the exhaustive toy census where Schoof-lite disagrees
      with brute-force t mod q. The implementation or the derived identity is
      wrong, the 221-bit application is withdrawn, and the counterexample is
      reported as a refutation artifact per docs/claims-and-verification.md.
    - >-
      Schoof-lite disagrees with the published trace modulo any q at 221 bits.
      Material discrepancy - halt, exclude implementation error, re-read
      pages/disc.html, and escalate to independent review before any statement
      leaves the repository. A transcription or implementation error is far
      likelier than a finding and must be excluded first.
    - >-
      The full-size twist-model residue vector is not the exact negation of the
      curve's. A size-dependent implementation defect exists that the toy census
      did not catch; the certificate is withdrawn and the defect is reported,
      which is a directly useful negative for heuristic H2 of
      IDEA-20260829-d052e6 and for every other instrument in this campaign.
    - >-
      The Anomalous positive control returns anything other than t congruent to 1
      modulo every q, or the supersingular refusal control returns anything other
      than 0. Instrument failure under AGENTS.md rule 3; the whole run is void.
    - >-
      A planted small factor in the toy positive control is not recovered. The
      instrument cannot fire and certifies nothing; nothing is reported.
    - >-
      The fitted cost exponent is materially different from 2. The cost model is
      refuted; target_complexity must be rewritten before the instrument is
      applied to the 383-bit or 511-bit siblings, where a wrong cost model turns
      a planned run into an unbounded one.

  confounders:
    - >-
      WHICH COFACTOR. This instrument sees divisibility of #E by q. It does NOT
      see the cofactor in the sense of #E divided by the prime subgroup order l,
      because it never learns l - though the mirror now publishes it. "No small
      odd prime divides #E" and "the odd part of the cofactor is 1" coincide only
      if the odd part of #E is prime or has all its factors above the reached Q,
      and the second possibility is excluded only by the mirror's transcribed
      claim, not by this instrument.
    - >-
      REACHED Q IS THE BINDING SCOPE. "No small odd factor" means "no odd prime
      factor below the largest q actually reached", and that number must appear
      in every sentence quoting the result.
    - >-
      THE FOUR-BIT AND THE THIRTY-SIX-BIT NUMBERS ARE FOR DIFFERENT CLAIMS. 4.01
      bits is the standalone evidential weight of finding no small factor. 36.55
      bits is the strength of the comparison against the published trace. Quoting
      the larger for the standalone claim is the central dishonesty available
      here and the record pre-commits against it.
    - >-
      AGREEMENT WITH A TRANSCRIPTION IS NOT PROOF OF EITHER SIDE. If the derived
      residues match the published trace, neither the instrument nor the mirror is
      thereby proved correct - a shared upstream error would produce the same
      agreement. What agreement excludes is INDEPENDENT error in either, which is
      a real but bounded gain, and the informative case remains disagreement.
    - >-
      MIRROR TIER. Every value used here is tier 2 (tables/*.tsv). MIRROR-DEF-1
      concerns pages/*.txt, which this record does not use, but the tier-1
      pages/*.html remain the authority and a tier-2 reading may not be the last
      word on any externally reported number.
    - >-
      TOY-SCALE DEGENERACY RATE. At 13 to 20 bits a randomly chosen curve is
      supersingular or has tiny order far more often than at 221 bits, as
      KN-TECH-033 states. The census must count these cases rather than let them
      dominate an agreement statistic.

  interpretation_limits:
    - >-
      A residue is not a security statement. It bounds the small-subgroup and
      invalid-curve confinement available in the chosen-input oracle model of
      KN-TECH-034, an ADJACENT-MODEL result, and says nothing whatsoever about
      the ECDLP in the prime subgroup.
    - >-
      C1 is proved; C4 is exact integer arithmetic on transcribed values; C2 is a
      classical algorithm re-derived and validated by exhaustive census at 13 to
      20 bits and applied at 221 bits, with the transfer carried by heuristic H2
      and partially discharged at full size by the twist-model and Anomalous
      controls.
    - >-
      THE MIRROR IS INTAKE, NOT EVIDENCE. Every criterion cell in it remains
      user_supplied_unverified under the goal's claim boundaries, and this record
      adjudicates no cell. What the mirror changes is that the campaign's numbers
      are now AVAILABLE to be checked, not that they are established.
    - >-
      TRANSFER TO THE OTHER 19 CURVES, STATED EXACTLY. (a) FULL AND
      UNCONDITIONAL transfer of C1 and C2 - they hold for EVERY elliptic curve
      over EVERY prime field, with no Montgomery hypothesis, no branch on p
      modulo 4 and no model restriction. This is a strictly wider transfer than
      IDEA-20260829-d052e6 achieves. (b) FULL TRANSFER of C4's two-route trace
      check to every one of the twenty rows, since tables/disc.tsv publishes a
      trace and tables/twist.tsv publishes a cofactor and an l' for all of them;
      running C4 on all twenty is a twenty-row consistency sweep costing twenty
      multiplications and it should be done in the same sitting. (c) COST transfer
      is NOT free and scales as log p at fixed q, so the 383-bit rows M-383 and
      Curve383187 cost about 1.7 times M-221 per prime and the 511-bit row M-511
      about 2.3 times; the reached Q will differ per row and must be reported per
      row. (d) The Edwards rows E-222, Curve1174 and E-382 need only a birational
      conversion to Weierstrass form, which preserves t exactly, so the residues
      transfer through the conversion even though d052e6's halving chain does not.
      (e) NO TRANSFER to any statement about the prime subgroup order, on any
      curve.
    - >-
      The current certificate schema of docs/claims-and-verification.md has kinds
      discrete_log, decomposition and none only. A trace-residue certificate is
      none of these; the run is therefore a measurement run with certificate kind
      `none` and the audit certificate travels as a run artifact with its own
      re-verification recipe. That schema gap is disclosed, not papered over.
    - >-
      OPERATIONAL OBSERVATION, RETAINED BECAUSE IT IS TRUE AND NOT BECAUSE IT
      BLOCKS ANYTHING. Live fetches of safecurves.cr.yp.to and of cr.yp.to on
      2026-08-29 both failed with "Parse Error - Content-Length can't be present
      with Transfer-Encoding", a different failure mode from the HTTP 502
      recorded in the prior session's capsule and now seen on two hosts. THIS DOES
      NOT MEAN THE DATA IS UNAVAILABLE - it is in this repository at
      inputs/SAFECURVES-20260825/ and was read here. The observation is recorded
      only so that no future session wastes a budget re-attempting the live site.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For p a fixed odd prime and A drawn uniformly from the admissible
        Montgomery coefficients over F_p, the residue t mod q of the trace is
        uniformly distributed on Z/qZ up to an error that tends to 0 as p tends
        to infinity, for each fixed odd prime q; consequently the probability
        that no prime q with 3 <= q <= Q divides either #E or #E^t is the
        product over those q of (1 - 2/q), which equals 0.0621 at Q = 31.
      rigorous_support: >-
        Two rigorous halves and one honest gap. (i) The map from traces to curve
        counts is governed by the Deuring correspondence - the number of
        F_p-isomorphism classes with a given trace t, weighted by automorphisms,
        is the Hurwitz-Kronecker class number H(4p - t^2) - and Birch's
        horizontal Sato-Tate theorem gives the limiting semicircle law for
        t/(2*sqrt(p)) as p grows. Equidistribution of t modulo a FIXED q over the
        family follows from the same class-number weights being asymptotically
        insensitive to the residue class, which is the standard statement being
        imitated. (ii) The rigorous FLOOR is that 4 divides #E for every
        Montgomery curve (d052e6 C1), so the q = 2 component is NOT uniform and
        is excluded from H1 by construction; H1 is asserted for odd q only. THE
        GAP - the family here is Montgomery coefficients over one fixed p, not
        all curves over all p, and equidistribution over that restricted family
        at fixed p is not proved. That is exactly what the validation measures.
      validation_plan: >-
        SAMPLING - the exhaustive toy census of Stage 1 gives the EXACT
        distribution of t mod q over ALL admissible Montgomery A at three primes
        near 2^13 to 2^15, a complete population rather than a sample, for
        q in {3, 5, 7, 11, 13}; plus a 10^3 uniformly random subsample of A at
        the real 221-bit prime, seeds recorded, for the same q. COMPARISON
        DISTRIBUTION - empirical frequency of t mod q against the uniform
        distribution on Z/qZ by an exact chi-square goodness-of-fit test with
        expected counts stated in advance. TAIL CHECK - the observed rate of
        curves with q dividing #E against the predicted 1/q, separately for each
        q, and the observed joint rate of "no small odd factor at all" against
        the predicted 0.0621; a toy population of about 10^4 curves should
        contain about 620 such curves. TRANSFER - the distribution is validated
        at 13 to 20 bits and at 221 bits by subsample, and is reported at 221
        bits only as a NULL for interpreting M-221's own residues, never as a
        property of M-221. A FAR LARGER FULL-SIZE TEST OF THIS SAME ASSUMPTION IS
        SPECIFIED IN IDEA-20260829-acd407, whose sweep measures it on about
        33000 real curves at 511 bits, and the two should be read together.
    - id: H2
      statement: >-
        A Schoof-lite implementation whose output agrees with brute-force point
        counting on 100 percent of an exhaustive toy population at 13 to 20 bits
        is correct at 221 bits; formally, the map from (p, A, q) to t_q has no
        size-dependent failure mode - overflow, modular-reduction, exponent
        range, or polynomial-degree truncation - that first appears above 20
        bits.
      rigorous_support: >-
        NONE as a mathematical statement, and the record says so plainly. This is
        the same assumption as heuristic H2 of IDEA-20260829-d052e6 and the
        archived plan's H4, inherited deliberately. THREE DIFFERENCES FROM
        d052e6, all in this record's favour and all stated as mitigation rather
        than support. First, the underlying arithmetic is Python
        arbitrary-precision integers, where the classes of size-dependent bug
        that motivate the assumption are largely absent by construction - an
        argument about the implementation, not a proof about the mathematics.
        Second, THIS RECORD HAS A FULL-SIZE POSITIVE CONTROL THAT USES NO
        PUBLISHED VALUE, the twist-model negation identity, which exercises the
        entire pipeline at 221 bits against a theoretically forced answer. Third,
        the mirror supplies a SECOND full-size positive control with a
        closed-form answer, the Anomalous row at t = 1.
      validation_plan: >-
        Five checks, none of which discharges the assumption. (i) Exhaustive toy
        census agreement at 13 to 20 bits. (ii) The full-size twist-model
        negation check at 2^221 - 3 for every q reached - a forced answer,
        computed by the same code from different inputs, using no published
        value. (iii) The Anomalous row at t = 1, a cryptographic-size input with
        a closed-form answer. (iv) The q = 2 branch agreeing with d052e6's
        independently derived depth-0 output AND with the mirror's published
        count of 1 point of order 2, at full size. (v) The comparison against the
        published trace itself, which is a CONSISTENCY check between a derivation
        and a transcription - if they agree neither is thereby proved, and if
        they disagree at least one is wrong, which is the informative case.
        Together these leave a materially smaller gap than a toy census alone,
        and the record states the residual gap rather than declaring it closed.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. C4 costs one big-integer multiplication and
      one subtraction. As an audit instrument, computing t mod q costs
      O(q^2 log p) multiplications in F_p with schoolbook polynomial arithmetic,
      that is O(q^2 log^3 p) bit operations, and O(q^3 log p / log q)
      F_p-multiplications summed over all primes up to Q. Concretely at 221 bits,
      q = 13 has division-polynomial degree 84 and needs about 3 times 10^6
      F_p-multiplications, seconds in Python; q = 31 has degree 480 and needs
      about 10^8, minutes to an hour. Verification of an emitted residue by a
      second implementation is the SAME cost as producing it - this certificate
      is NOT succinct, unlike d052e6's dozen exponentiations, and that asymmetry
      is disclosed.
    memory_exponent: >-
      O(q^2 log p) bits of working memory - at q = 31 and 221 bits that is about
      480 coefficients of 221 bits, roughly 13 kilobytes, utterly negligible.
      The 48 GB envelope is not a binding constraint anywhere in this proposal.
      The certificate is O(q^2 log p) bytes per prime.
    best_known: >-
      For the FULL group order, SEA at soft-O(log^4 p) bit operations, which
      dominates this record on information absolutely - it returns #E, from which
      every residue follows - but is UNAVAILABLE in the declared environment.
      Schoof's original algorithm at soft-O(log^5 p) is the same algorithm as
      here run to completion and is out of budget by many orders of magnitude at
      221 bits. INSIDE THIS PROGRAM the best known route to any odd cofactor fact
      is now a TRANSCRIPTION FROM THE IN-REPOSITORY MIRROR, which is zero cost
      and which this record does not attempt to beat on cost - it attempts to
      CHECK it, which is a different axis. Against the ECDLP attack frontier -
      rho at 0.886*sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006),
      automorphism-discounted rho (KN-TECH-018), BSGS (KN-TECH-031, KN-TECH-035),
      MOV and Frey-Ruck at small embedding degree (KN-TECH-032), the trace-one
      additive transfer (KN-TECH-033) - this record is dominated by all of them
      because it is not an attack.
    hidden_overhead: >-
      No o(1) and nothing superpolynomial in the stated cost. Three honest hidden
      costs. (i) The q^2 in the exponent is brutal in practice - the reachable Q
      is set by budget, not by theory, and the deliverable's scope is whatever Q
      the run actually reached. (ii) The certificate is not succinct;
      re-verification costs what production costs, so an independent check
      doubles the budget rather than being free. (iii) The epistemic cost -
      exhaustive validation at 13 to 20 bits, application at 221, carried by H2,
      mitigated but not removed by two full-size positive controls.
    tradeoff_note: >-
      The genuine tradeoff is PRIMES versus TIME and it is cubic. Reaching Q
      costs about Q^3 / (3 ln Q) F_p-multiplications times log p, and buys
      log2(product of primes up to Q) bits of equation-to-transcription binding,
      which grows only like Q / ln 2 by Mertens. So the marginal bit costs about
      Q^2 operations and the curve is punishing - going from Q = 31 to Q = 61
      roughly octuples the cost for about 30 extra bits. Parallelisation is
      EXCELLENT and is the reason the 14 cores matter here where they did not in
      the four prior records - the primes are completely independent, so the
      sweep is embarrassingly parallel with speedup limited only by the largest
      single q. There is no time-memory tradeoff; memory is negligible at every
      reachable Q.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW BEFORE WRITING THIS FIELD; `null` is not
    asserted. AS AN ATTACK it is dominated by every row simultaneously on time,
    memory and data, because it is not an attack - rho (KN-TECH-001,
    KN-TECH-006), automorphism-discounted rho (KN-TECH-018), BSGS (KN-TECH-031,
    KN-TECH-035), MOV and Frey-Ruck (KN-TECH-032) and the trace-one transfer
    (KN-TECH-033). AS A WAY TO LEARN THE ODD COFACTOR it is now STRICTLY AND
    COMPLETELY DOMINATED, on every cost axis, BY READING
    inputs/SAFECURVES-20260825/tables/twist.tsv, which is in this repository,
    costs one file read, and gives the cofactor, the twist cofactor and the exact
    twist subgroup order. THAT DOMINATION IS REAL AND OPERATIVE AND THIS RECORD
    CONCEDES IT WITHOUT QUALIFICATION. It is also dominated on information by SEA
    and by Schoof run to completion, and by IDEA-20260829-e37b52's
    Hasse-uniqueness certificate whenever a base point and a certified-prime l
    are in hand - which the mirror's tables/base.tsv and tables/primeproofs.tsv
    may now supply, and which should be checked before this record is scheduled.
    AS AN INDEPENDENT CHECK ON A TRANSCRIPTION, COMPUTED FROM THE CURVE
    COEFFICIENT, it is NOT dominated - no incumbent inside or outside this program
    was identified that derives a constraint on #E from (p, A) alone without a
    point-counting backend, and the mirror cannot check itself. That is the whole
    of the record's remaining case and it is stated narrowly.
  sota_delta: >-
    ZERO speedup against any attack baseline on every axis - time, memory, data,
    queries. THE DELTA AS DATA HAS SHRUNK AND IS RESTATED HONESTLY - the corpus
    under knowledge/ and ledger/ still holds ZERO trace values and ZERO
    odd-cofactor facts for any of the twenty curves, but inputs/ now holds all of
    them, so this record no longer creates the numbers and instead creates the
    CHECK. QUANTITATIVELY AS BINDING - the family's consistency machinery gains
    its first equation-to-order link: 36.55 bits at Q = 31 against the published
    trace, where IDEA-20260829-e37b52 provably supplies 0 bits because identity
    I1 never reads A. That is the precise, previously invisible error class this
    record closes, and it is unchanged by the mirror's availability because the
    mirror also never reads A. QUANTITATIVELY AS COST - an independent
    equation-derived constraint on the odd part at 221 bits moves from "requires
    SEA, declared unavailable, therefore impossible" to "O(q^2 log p)
    F_p-operations per prime, seconds to minutes"; that is an
    impossible-to-feasible transition for the CHECK, not for the value.
    QUANTITATIVELY AS A FREE RESULT - C4 binds two independent mirror columns for
    all twenty rows at the cost of twenty multiplications, which no record in this
    program currently does and which is available before any code is written. AS
    SCOPE, the standalone no-small-factor finding is worth 4.01 bits and is
    reported at that size and no larger.
  estimated_cost:
    implementation: medium
    compute: medium
    basis: >-
      Implementation is division polynomials by recurrence, arithmetic in
      F_p[x,y]/(psi_q, y^2 - f), and the candidate search - a few hundred lines
      with no external dependency. C4 is three lines. Compute is minutes at q at
      most 13, up to an hour at q = 31 on 14 cores, plus an O(p) toy census pass
      at 2^13 to 2^15. The binding budget item is the largest q attempted and it
      must be capped in the handoff.
  recommended_priority: high

