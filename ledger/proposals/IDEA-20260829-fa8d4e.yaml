  assumptions:
    - >-
      The executor session has a shell and Python 3 with arbitrary-precision
      integers. This is the assumption the archived batch could not make and is
      the declared reason the whole family is stuck.
    - >-
      No SEA, Sage or PARI backend. The proposal is constructed to need none;
      psi_q comes from a recurrence and everything else is F_p arithmetic.
    - >-
      Curve parameters (p, A) are taken from the intake tuple of
      RQ-SCURVE-7af163, CROSS-CHECKED against
      inputs/SAFECURVES-20260825/tables/equation.tsv and tables/field.tsv - which
      agree exactly - and re-checked for self-consistency: p prime at a stated
      tier, A^2 - 4 nonzero mod p and equal to the mirror's published 13700702496
      as an integer, and the curve nonsingular. No parameter is typed from memory.
    - >-
      Every mirror value used is a TIER-2 reading from tables/*.tsv. Before any
      claim leaves the repository the corresponding pages/*.html cell must be
      read, per MIRROR-DEF-1's authority order. No value is taken from
      pages/*.txt anywhere in this record.
    - >-
      The curve is ORDINARY at p. For a Montgomery curve with p congruent to 1
      modulo 4 this is forced - 4 divides #E by d052e6 C1 and p + 1 is congruent
      to 2 modulo 4, so t is congruent to 2 modulo 4 and in particular nonzero,
      hence not supersingular. p = 2^221 - 3 is congruent to 1 modulo 4 because
      2^221 is congruent to 0 modulo 4 and -3 is congruent to 1 modulo 4. The
      mirror's published trace ends in the digits 141978, and 141978 is congruent
      to 2 modulo 4, so the published value is CONSISTENT with the derivation;
      the executor must confirm both.
    - >-
      Scope is prime fields of odd characteristic. Binary and extension fields
      are out of scope.

  proof_search_map:
    bottleneck: >-
      Obtaining an INDEPENDENTLY DERIVED constraint on the ODD part of #E or
      #E^t - one computed from the curve equation rather than transcribed. The
      mirror removes the retrieval bottleneck and leaves the VERIFICATION
      bottleneck exactly where the goal's next_action puts it: every stated
      numeric relation is a transcription plus a pending check, and until now the
      only route to the pending check was point counting, which environment
      assumption E2 declares unavailable. Removing this is what makes the
      "subgroup, cofactor and invalid-curve confinement cost" diagnostic
      answerable from the equation.
    baseline_embedding:
      parameter_slice: >-
        At q = 2 the algorithm must degenerate to root-counting of
        f(x) = x^3 + A x^2 + x over F_p, and must therefore reproduce
        IDEA-20260829-d052e6's depth-0 output exactly - the same number of
        rational 2-torsion points and the same value of chi(A^2 - 4). Both are
        now pinned by the mirror, which reports exactly 1 point of order 2 for
        M-221 in tables/complete.tsv, hence 2-torsion rank 1, hence
        chi(A^2 - 4) = -1. d052e6's depth-0 stage is the best-known baseline
        inside this program for the prime 2 and Schoof-lite must CONTAIN it.
      reproduction_check: >-
        A frozen regression fixture asserting bit-identical agreement between
        the q = 2 branch, d052e6's depth-0 output on (2^221 - 3, 117050), and
        the mirror's published count of 1 point of order 2, run before any odd q
        is trusted; plus, at toy scale, exact agreement of t mod q with
        brute-force point counting for every admissible A and every affordable q.
    observation_collision:
      observable: >-
        The residue vector (t mod q) over the primes reached, together with the
        derived divisibility bits.
      distinct_preimage_search: >-
        REQUIRED, AND THE ANSWER IS KNOWN IN ADVANCE AND MUST BE WRITTEN INTO
        THE DELIVERABLE RATHER THAN DISCOVERED. Collisions are MASSIVE and
        PROVABLE - any two curves whose traces agree modulo the product of the
        primes reached produce the identical observable, and by Hasse there are
        about 4*sqrt(p) / M of them per class, which for M-221 at Q = 31 is
        about 2^{75.4}. THE CONSEQUENCE - the observable does NOT identify #E,
        does NOT identify the curve, and does NOT identify the isogeny class. It
        identifies exactly one thing, the residue class of t, and every
        downstream citation must say so. This limitation is UNCHANGED by the
        mirror: agreeing with a published trace on ten small primes leaves
        2^{75.4} traces consistent with the observable, so the comparison is
        strong evidence of consistency and is not a determination of #E. A SECOND
        AND SHARPER COLLISION - the curve and its quadratic twist have residue
        vectors that are negatives of each other, so for a q with p + 1 congruent
        to 0 modulo q the two are INDISTINGUISHABLE at that q; the record must
        therefore never infer which of the pair it is looking at from a single
        residue.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the question "what is the odd cofactor of this 221-bit curve",
          which as posed requires a point count, by the question "what is the
          unique t_q making the Frobenius identity hold in
          F_p[x, y]/(psi_q, y^2 - f)", which is a fixed number of polynomial
          multiplications in a ring of dimension (q^2 - 1)/2.
        predicted_gain: >-
          Small-prime divisibility of BOTH orders at 221 bits in
          O(q^2 log p) F_p-multiplications, seconds per prime in Python, versus
          an SEA point count that is unavailable in this environment. Encoding,
          completeness, soundness and cost-loss obligations are listed
          separately below; the cost loss is real and is that only a residue,
          never the order, is obtained.
      - transform: stronger_invariant
        proposed_object: >-
          Preserve the full residue t mod q rather than the single divisibility
          bit the confinement question asks for. The residue is an
          isogeny-class invariant that composes across primes by the Chinese
          remainder theorem and cross-checks against the mirror's published
          trace; the bit does neither.
        predicted_gain: >-
          36.55 bits of equation-to-order binding at Q = 31 instead of the 4.01
          bits available from the divisibility bits alone - a factor this record
          is required to state in both directions so neither is quoted for the
          other.
      - transform: boundary_lift
        proposed_object: >-
          Read the mirror's two independent columns - the published trace, and
          the twist cofactor together with the exact twist subgroup order -
          against the exact identity #E + #E^t = 2p + 2, turning a transcription
          into an over-determined system before any instrument exists.
        predicted_gain: >-
          A full-strength consistency check on the published trace at the cost of
          one multiply and one subtract, available at Step 0 and independent of
          every heuristic in this record. This is C4.
    quantifier_order: >-
      C1 is claimed UNIFORMLY. FOR ALL primes q different from p and FOR ALL
      elliptic curves E/F_p, q divides #E(F_p) if and only if t is congruent to
      p + 1 modulo q. No witness depends on the instance. C2 is claimed
      UNIFORMLY IN q AND EXISTENTIALLY IN THE WITNESS. FOR ALL odd primes q
      different from p and FOR ALL ordinary E/F_p, THERE EXISTS a unique t_q in
      Z/qZ satisfying the Frobenius identity in R_q, and the search over the q
      candidates finds it. C3, C4 and C5 are claimed PER CURVE AND PER PRIME and
      are EXISTENTIAL - FOR THIS (p, A) and THIS q, THERE EXISTS the exhibited
      residue with the exhibited witness data, and it agrees with the exhibited
      published value. NOT CLAIMED at any point - any statement determining #E
      from this instrument alone.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For this (p, A), t is congruent to t_0 modulo M, where M is the product
        of the primes reached, hence q divides #E for exactly the listed q and q
        divides #E^t for exactly the listed q; and t_0 agrees with the mirror's
        published trace reduced modulo M." It certifies NOTHING about #E itself,
        nothing about the primality of the odd part, nothing about the rho cost
        and nothing about the ECDLP. Pushed to its limit the method would need
        the product of primes to exceed 4*sqrt(p), which for a 221-bit p means
        primes to about 600 and a division polynomial of degree about 180000;
        that is a full point count and it is OUT OF BUDGET BY MANY ORDERS OF
        MAGNITUDE. The ceiling is therefore a sieve, and the record says so.
      nearby_object_control: >-
        THREE, AND THEY DO DIFFERENT JOBS. (i) THE QUADRATIC TWIST MODEL of the
        same curve at the same prime, processed by the identical code path from
        its own Weierstrass coefficients. Its residue vector MUST be exactly the
        componentwise negation of E's. This is a full-size, parameter-matched,
        independent check that costs one extra run, uses NO published value, and
        no toy census can substitute for it. (ii) A' = 117051 over the same p -
        one unit of coefficient away, same field, same code path, and NOT
        predicted to give the same vector; the mirror publishes nothing about it,
        which is exactly why it tests the instrument rather than the table. (iii)
        THE ANOMALOUS ROW, whose mirror trace is published as t = 1 and whose
        cofactor is 1 - a trace known in closed form at cryptographic size. The
        instrument must return t congruent to 1 modulo every q. A pipeline that
        cannot reproduce the one large trace with a closed-form answer is not
        trustworthy on an unknown one.
    proof_obligations:
      - claim: >-
          q divides #E(F_p) if and only if t is congruent to p + 1 modulo q, and
          q divides #E^t(F_p) if and only if t is congruent to -(p + 1) modulo q.
        responsibility: correctness
      - claim: >-
          psi_q generated by the standard recurrence has degree (q^2 - 1)/2 for
          odd q and its roots in the algebraic closure are exactly the
          x-coordinates of the nonzero q-torsion points.
        responsibility: correctness
      - claim: >-
          The Frobenius identity has a unique solution t_q in Z/qZ, so the
          search over q candidates is well posed and cannot return two answers.
        responsibility: strictness
      - claim: >-
          Computing t mod q costs O(q^2 log p) F_p-multiplications and
          O(q^2 log p) bits of memory with schoolbook arithmetic.
        responsibility: runtime
      - claim: >-
          4*l' - p - 1 equals the mirror's published trace exactly, where l' is
          the mirror's published twist subgroup order and 2^2 its twist cofactor.
        responsibility: baseline
      - claim: >-
          The toy validation is EXHAUSTIVE over admissible A at each size where
          exhaustiveness is claimed, and is labelled a subsample everywhere else.
        responsibility: scope
      - claim: >-
          A second implementation can re-verify each emitted t_q from (p, A, q)
          at the same asymptotic cost, using only the published witness data.
        responsibility: interface
      - claim: >-
          Correctness of the implementation at 221 bits given exhaustive
          validation at 13 to 20 bits.
        responsibility: success_probability
    not_applicable_reason: null

