    Schoof's algorithm is a 1985 result and is `known` mathematics; the divisor
    criterion C1 is one line of algebra and is textbook. NOTHING NEW IS CLAIMED
    ABOUT EITHER. What is new is confined to this program - the corpus contains
    no implementation, no trace residue and no odd-cofactor certificate for any
    curve, and no record anywhere binds a group order to a curve coefficient.
    THE LABEL REMAINS `unverified`, AND THE REASON HAS CHANGED. It is no longer
    that no source was retrieved - the in-repository SafeCurves mirror was read
    directly this session and supplies the trace, the cofactors and the twist
    subgroup order. It is that the mirror is a SNAPSHOT OF ONE SITE'S TABLES and
    contains no primary mathematical literature for the ALGORITHM - Schoof 1985
    was not opened, and two external PDF fetches this session returned undecodable
    streams. The novelty of the method against the mathematical literature is
    therefore still unchecked, which is precisely what `unverified` records.
