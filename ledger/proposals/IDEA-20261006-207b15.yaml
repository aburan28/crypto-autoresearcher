idea:
  id: IDEA-20261006-207b15
  question_id: RQ-LHW-1877bb
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Ordered bit-triple hits of the weight-3 set versus its multiply-by-3
    image in Z/251
  class: measurement
  novelty_status: unverified
  claim: >-
    Let L be the set {1, 2, 4, 8, 16, 32, 64, 128} inside the additive
    group Z/251Z. Let W be the set of sums of three distinct elements of
    L. Every such sum lies between 7 and 224 inclusive, so reduction
    modulo 251 is the identity on W and |W| = C(8, 3) = 56. Let N be
    the multiply-by-3 image {3w mod 251 : w in W}. Since 3 does not
    divide 251, multiplication by 3 is bijective and |N| = 56. Let I(S)
    be the number of ordered triples of distinct elements of L whose
    sum lies in S. The positive object is W and the same-shape null is
    N. The claim is I(W) = 336 and I(N) <= 168. No discrete logarithm
    is computed and no ECDLP exponent is claimed.
  mechanism: >-
    This is a toy measurement on the plain-integer arm of
    RQ-LHW-1877bb, not an ECDLP attack. Representation: length-8 bit
    strings, read as elements of Z/251Z. Operation set Sigma is addition
    of three distinct elements of L. Sigma is not the full translation
    action of Z/251Z. Trichotomy: partial-action, because only sums of
    three distinct basis elements are retained; overlapping supports and
    carries are outside Sigma. LOSSY-PROJECTION TEST: the object kept is
    the sum in Z/251Z, Sigma is addition of three distinct elements of
    L, and the order of the three summands is discarded. The discard is
    compatible with Sigma because addition is commutative, so the sum
    propagates deterministically. The projection is lossy because each
    element of W has 3! = 6 ordered preimages. Families F1 through F7
    are not the primary lens.
  assumptions:
    - >-
      251 is prime and 3 is invertible modulo 251, so |N| = |W|.
    - >-
      Sums of three distinct elements of L are at most 224, which is
      strictly less than 251, so they do not wrap.
    - >-
      The indicator uses ordered triples. An unordered count is a
      different metric and is not the claim.
  predictions:
    - metric: I(W), ordered triples of distinct elements of L with sum in W
      direction: different
      minimum_effect: >-
        I(W) equals 336. Any other integer means the enumerator does
        not match unique binary expansions.
    - metric: I(N), ordered triples of distinct elements of L with sum in N
      direction: lower
      minimum_effect: >-
        I(N) is at most 168, which is 168 below the control value 336.
  minimal_test:
    design: >-
      Enumerate all 336 ordered triples of distinct elements of L.
      Record the sum of each triple. Count how many sums lie in W and
      how many lie in N, where N is computed by multiplying each of the
      56 elements of W by 3 modulo 251. Compare the two counts to 336
      and 168.
    controls:
      - >-
        Positive control: I(W) must equal 336. If it does not, the
        enumeration is an instrument failure and I(N) is not read as
        evidence.
      - >-
        Same-cardinality control: |N| must equal 56. If it does not,
        the image was not bijective and the null is not same-shape.
      - >-
        Translate control, recorded and not part of the claim: let
        N1 = {w + 1 mod 251 : w in W} and record I(N1). This detects
        whether a drop is special to multiplication by 3.
    required_metrics:
      - I(W)
      - I(N)
      - "|W|"
      - "|N|"
      - I(N1)
  falsification_conditions:
    - >-
      I(N) >= 169. That is a negative result for the claimed drop, not
      an infrastructure failure.
    - >-
      I(W) is not 336, or |N| is not 56. The instrument or the
      same-shape hypothesis failed, and the drop is not established.
  confounders:
    - >-
      Counting unordered triples would divide the control by 6 and
      make 168 the wrong threshold.
    - >-
      Reducing a sum modulo 251 before comparing with W would be
      harmless for W, whose sums are already below 251, but must be
      applied the same way when testing membership in N.
  interpretation_limits:
    - >-
      A confirmed drop says only that this multiply-by-3 image meets
      fewer bit-triples than W inside Z/251. It does not give a
      low-storage discrete-log algorithm and does not change any ECDLP
      exponent.
    - >-
      I(N1) is a control reading. It is not a second claim.
    - >-
      The test to run first among the three ideas is this one, because
      the control I(W) = 336 is exact and the discriminator is one
      integer.
