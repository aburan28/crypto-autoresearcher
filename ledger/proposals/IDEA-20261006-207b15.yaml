  heuristic_assumptions:
    - id: H1
      statement: >-
        Each of the 56 sums of three distinct elements of L has exactly
        six ordered writings, and none of those sums wraps modulo 251,
        so I(W) = 336.
      rigorous_support: >-
        Uniqueness of base-2 expansions for integers from 0 through
        255. The largest three-bit sum from L is 224, which is less
        than 251.
      validation_plan: >-
        The toy measurement enumerates all 336 ordered triples, checks
        I(W) = 336 and |N| = 56, and computes I(N). The predicted
        indicator is I(N) <= 168. The outcome I(N) >= 169 falsifies
        the claim. No distribution for N is assumed.
  target_complexity:
    time_exponent: >-
      O(m^3) arithmetic steps at m = 8, namely 336 triple sums. This
      is polynomial in m. No ECDLP exponent is in scope.
    memory_exponent: >-
      O(m + C(m, 3)) field elements at m = 8, the list L and the two
      56-element sets. Polynomial in m.
    best_known: >-
      No ECDLP exponent is in scope. KR-RHO-13bf67 states the generic
      prime-order bound Omega(sqrt(p)). This test does not compute a
      discrete log.
    hidden_overhead: >-
      None beyond listing C(8, 3) sums. There is no o(1) term and no
      superpolynomial factor.
    tradeoff_note: >-
      Both 56-element sets are stored. The test does not use a
      time-memory tradeoff and is a single enumeration, not a parallel
      collision search.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    KR-RHO-5b1c0a, representation cost p^{1.314} on F_{p^2}, and
    KR-RHO-898783, kangaroo cost (2+o(1)) sqrt(N) on an interval.
    Both files were opened. This count does not improve either bound.
