idea:
  id: IDEA-20260805-57fc49
  question_id: RQ-FRODO-3260cc
  added: '2026-08-05'
  title: >-
    The Renyi order is a sample-count receipt: solve backwards from the published
    order for the sample budget FrodoKEM's designers charged, and audit what the
    divergence argument delivers above it
  class: audit

  claim: >-
    FrodoKEM's tabulated error distribution is not the rounded Gaussian its
    hardness is inherited from, and the gap is bridged by a Renyi-divergence
    argument whose visible output is two printed numbers per parameter set: an
    order a and a divergence. This proposal asserts that those two numbers, plus
    the target security level, DETERMINE A THIRD NUMBER THE DOCUMENT NEED NEVER
    PRINT -- the sample count the argument was tuned for -- and that recovering it
    is a one-line inversion which (i) converts an unstated modelling choice into a
    checkable quantity, (ii) discriminates between two readings of the printed
    divergence that differ by more than four orders of magnitude, and (iii) exposes
    the argument's behaviour under target count, which is where a conversion error
    would survive longest because it looks like no number at all. The mechanism
    below carries out the inversion on the extraction-damaged excerpt this program
    holds and reports what it returns, INCLUDING AN ANOMALY AT FRODO-1344 that is
    either a defect in this proposal's recalled inputs or a real feature of the
    document. Which, is exactly what the audit determines. NO CLAIM IS MADE THAT
    FRODOKEM'S ARGUMENT IS WRONG. No run has happened, no primary text has been
    read, and the most likely single outcome is that the argument is fine and the
    audit's deliverable is the derivation the document omits.

  object_first_candidate:
    tracked_object: >-
      THE LOSS PAIR (T1, T2) = (lambda/a, N * log2 R_a), followed through the
      divergence argument as a function of the order a and the sample count N.
      Not the divergence, and not the order: the PAIR of loss terms they generate,
      because the two move in opposite directions in a and the document's choice of
      a is a statement about where the designers put the balance point. Tracking
      the pair rather than either component is what makes the sample count
      recoverable.
    established_families_off_limits: >-
      Off-limits as the primary lens: everything in the lattice-estimator family
      (BKZ cost models, core-SVP, primal/dual/hybrid attacks, sieve memory) --
      GOAL-FRODO-001.non_duplication assigns that lane to GOAL-MLKEM-003 and
      GOAL-MLKEM-004 and a batch that finds itself deriving a sieve cost has left
      its lane; all implementation-side attacks (KN-LIT-2088, KN-LIT-3859,
      KN-LIT-118, KN-TECH-047); statistical-distance arguments as a substitute for
      the divergence argument, since replacing the tool is not auditing it; and
      decryption-failure attacks, which are a different link of the same chain and
      belong to IDEA-20260805-411b60 and IDEA-20260805-f16b44. The lens retained is
      elementary calculus on the loss function plus explicit quantifier bookkeeping.
    newness_score: >-
      The probability-preservation and multiplicativity properties of Renyi
      divergence are standard tools and are certainly known to the designers. What
      is not in this corpus, and what is proposed here, is the INVERSION: treating
      the printed order as a receipt from which the charged sample count is
      recovered, and then asking what happens above it. This corpus contains no
      FRODO-area record of any kind and no analysis of a divergence-to-bit-security
      conversion for any scheme; grep on 2026-08-05 finds Renyi mentioned in eight
      literature entries and in no ledger record.
    testability_score: >-
      High and almost free. The inversion is a closed-form solve. Its inputs are
      three printed numbers per parameter set plus the sample count, and the whole
      sensitivity table is arithmetic. What is expensive is neither: it is reading
      the specification carefully enough to know which samples the argument charges.
    survival_score: >-
      The pair survives the entire argument, because multiplicativity over
      independent samples is exactly the operation the argument applies and the
      pair is defined to transform simply under it. It dissolves at the point where
      the samples cease to be independent -- which is a named limit, not a
      surprise, and the audit states it.

  mechanism: >-
    THE TOOL, STATED SO IT CAN BE ATTACKED. RECALLED AS STANDARD, UNVERIFIED, AND A
    READ TARGET -- the probability-preservation property of the Renyi divergence
    (attributed in memory to the Bai-Langlois-Lepoint-Stehle-Steinfeld line of work
    on replacing statistical distance by Renyi divergence in lattice security
    proofs; THAT ATTRIBUTION IS RECALLED AND HAS NOT BEEN CHECKED AGAINST ANY PAPER
    BY THIS PROGRAM, and checking it is Stage 1 of any experiment built on this
    record). For distributions P (deployed, tabulated) and Q (ideal, rounded
    Gaussian) with Supp(P) contained in Supp(Q), and for a > 1,

      R_a(P||Q) = ( sum_z P(z)^a Q(z)^{1-a} )^{1/(a-1)},
      Q(E) >= P(E)^{a/(a-1)} / R_a(P||Q)   for every event E,
      R_a(P^N || Q^N) = R_a(P||Q)^N        (multiplicativity over independence).

    Rearranged into bit-security bookkeeping: if an adversary achieves success
    probability at most 2^{-lambda} against the ideal distribution, its success
    probability against the deployed one is at most

      2^{ -((a-1)/a) * ( lambda - N * log2 R_a(P||Q) ) },

    so the deployed bit security is lambda' = lambda - T1 - T2 with

      T1 = lambda / a            (the exponent-sharpening loss)
      T2 = N * log2 R_a(P||Q)    (the accumulation loss)          [to first order]

    THIS IS THE WHOLE MECHANISM AND EVERYTHING ELSE FOLLOWS FROM IT. T1 falls in a,
    T2 rises in a (the Renyi divergence is non-decreasing in its order -- a
    theorem, and the audit's own instrument check). So there is an interior optimum,
    and AT THE OPTIMUM THE TWO TERMS ARE COMPARABLE. That is the receipt.

    THE INVERSION. For small divergences, log R_a(P||Q) ~ (a/2) * chi2(P||Q) where
    chi2 is the Pearson divergence, i.e. log R_a is asymptotically LINEAR in a.
    Write log2 R_a = c * a. Then total loss L(a) = lambda/a + N c a, minimised at

      a* = sqrt( lambda / (N c) ),   and equivalently   N* = lambda / (c a^2)

    for the printed a. So: GIVEN the printed order and the printed divergence, N*
    is the sample count at which that order is optimal. If the designers tuned a,
    N* is the count they charged. If N* is nowhere near any natural sample count of
    the scheme, either they did not tune a, or the printed divergence means
    something other than what was assumed, or a figure is wrong. Each branch is a
    finding.

    THE INVERSION CARRIED OUT, ON DAMAGED INPUTS, LABELLED. Using the excerpt
    figures from RQ-FRODO-3260cc.provenance (orders 200 / 500 / 1000, divergences
    0.324e-4 / 0.140e-4 / 0.264e-4 for Frodo-640 / 976 / 1344), reading the printed
    divergence as R_a - 1 PER SAMPLE, taking N = 2*n*nbar + 2*nbar*n + nbar^2 (the
    chi samples in one key plus one ciphertext, nbar = 8) and lambda = 143 / 209 /
    274 (RECALLED TARGET SECURITY LEVELS, UNVERIFIED, AND THE WEAKEST INPUTS HERE),
    the following are SCOUT-COMPUTED on this machine outside the harness and must
    be re-run in-harness before citation:

      Frodo-640 : N = 20544, T2 = 0.960 bits, T1 = 0.715 bits, T2/T1 = 1.34,
                  implied a* = 173 against a printed 200, N* = 15297
      Frodo-976 : N = 31296, T2 = 0.632 bits, T1 = 0.418 bits, T2/T1 = 1.51,
                  implied a* = 407 against a printed 500, N* = 20696
      Frodo-1344: N = 43072, T2 = 1.641 bits, T1 = 0.274 bits, T2/T1 = 5.99,
                  implied a* = 409 against a printed 1000, N* = 7194

    READ THESE CAREFULLY, BECAUSE THEY SAY THREE DIFFERENT THINGS.
    (i) At Frodo-640 and Frodo-976 the printed order sits within about 20 per cent
    of the balance point computed from a sample count nobody told this program, and
    the total loss lands near 1 to 1.7 bits. Two independent parameter sets landing
    that close is not a coincidence and is strong evidence that the reading of the
    printed divergence as a PER-SAMPLE quantity is correct, and that the argument
    is tuned as this mechanism models it. That is a real, cheap, pre-run validation
    of the whole model, obtained before any source was read.
    (ii) At Frodo-1344 the printed order is 2.4 times the balance point and the
    implied sample count is 7194 against a recalled 43072 -- a factor of six. THIS
    IS AN ANOMALY AND IT IS REPORTED AS ONE. It has at least four explanations and
    this proposal asserts none of them: the recalled lambda for Frodo-1344 is wrong;
    the excerpt's 0.264e-4 is extraction-damaged (note it is LARGER than the 976
    figure while the corresponding sigma is smaller, which is plausible but is not
    checked); the designers charged a different sample count at level 5; or the
    order genuinely is not tuned there. RESOLVING THIS IS THE AUDIT'S FIRST
    CONCRETE TASK and it is worth doing precisely because a mis-tuned order costs
    bits without printing a wrong number anywhere.
    (iii) The reading of the printed divergence is not determined by the document's
    table. If 0.324e-4 is instead R_a(P^N || Q^N) - 1 for the WHOLE scheme, then T2
    is 4.7e-5 bits rather than 0.960 -- a factor of 2^14.3 -- and the balance
    argument fails badly at all three parameter sets. THE BALANCE ITSELF IS
    THEREFORE THE DISCRIMINATOR between the two readings, and it already favours
    the per-sample reading at two parameter sets out of three. That is a forced
    value doing real work at zero compute.

    THE QUANTIFIER, WHICH IS THE PART THAT LOOKS LIKE NO NUMBER. T2 is LINEAR IN N.
    Written with explicit quantifiers, the conversion says: FOR ALL adversaries
    consuming at most N samples, THERE EXISTS a bound of the stated form. N is
    therefore a declared budget, and everything hinges on whether the document
    binds it before or after the adversary chooses how many targets to attack. In a
    multi-target setting with T independent keys, the samples an adversary sees are
    T*N, so T2 becomes T * N * log2 R_a and the accumulation loss is MULTIPLIED BY
    THE TARGET COUNT. At the excerpt's Frodo-640 figures a single target costs 0.96
    bits and T = 2^20 targets would cost 2^20 times that -- which is not a small
    correction but a total collapse of the bound, and therefore almost certainly
    means the argument is not intended to be applied that way. The audit's job is
    to determine WHAT THE DOCUMENT ACTUALLY SAYS about the quantifier, and to state
    it, because the difference between "the reduction is applied per instance and
    multi-target loss is handled by a separate hybrid argument" and "the divergence
    bound is claimed uniformly over the adversary's whole view" is invisible in the
    printed numbers and is exactly where a conversion error survives.

    WHAT WOULD MAKE THIS INTERESTING RATHER THAN TIDY. The audit becomes a finding
    only if one of: the Frodo-1344 anomaly survives correct inputs; the document's
    quantifier does not bind N before the target count; or the exact recomputed
    R_a disagrees with the printed divergence under BOTH readings. Otherwise the
    deliverable is a derivation the document omits, stated at a tier that
    RQ-FRODO-3260cc caps at TOY for any security reading, and that is an honest and
    sufficient outcome.

  novelty_status: unverified

  literature_context:
    - >-
      NOT READ -- RELAYED CLAIM. The FrodoKEM specification, the standard
      proposals at frodokem.org, the CiC/eprint paper (eprint 2025/1861) and
      draft-longa-cfrg-frodokem-02 are named in RQ-FRODO-3260cc.provenance as the
      documents seen in a search excerpt on 2026-08-04. THIS PROPOSAL HAS READ NONE
      OF THEM. Every FrodoKEM number in it is a research target.
    - >-
      RECALLED, UNVERIFIED. The Renyi-divergence-in-place-of-statistical-distance
      technique is attributed in memory to Bai, Langlois, Lepoint, Stehle and
      Steinfeld. NO PAPER, THEOREM NUMBER, VENUE OR YEAR IS ASSERTED, because none
      has been checked. The probability-preservation inequality and multiplicativity
      as stated in the mechanism are likewise RECALLED and are CANDIDATES TO CHECK.
      Verifying both statements against a primary source, and recording the exact
      form and its side conditions, is a required stage of any experiment built on
      this record -- not a citation to be leaned on.
    - >-
      CORPUS SEARCH, 2026-08-05. Renyi divergence appears in this corpus in
      knowledge/literature entries KN-LIT-1491, KN-LIT-4112, KN-LIT-4435,
      KN-LIT-5388, KN-LIT-5510, KN-LIT-6575, KN-LIT-6665 and KN-LIT-7372, and in no
      ledger record. NONE of these has been opened by this proposal and none is
      cited as support for anything here. They are listed as the places a
      literature stage should start. Their reliability is additionally discounted
      by KN-OPEN-3f7a21, which measured that 7457 corpus entries carry
      "citation_verified: read" with zero backing artifacts present.
    - >-
      IN-REPO AND READ: GOAL-FRODO-001.non_duplication, which forbids this goal
      from re-estimating LWE hardness at Frodo's dimensions. This proposal
      complies: lambda enters ONLY as a target security level read from the
      document, and no value of it is derived, defended, or disputed here. If a
      stage finds itself estimating lambda it has left the lane and must hand off.

  lossy_projection_identifiability_audit:
    projection: >-
      The full pair of distributions (chi, rounded Gaussian) over 25 support points,
      together with the scheme's whole sample structure --> the two-number loss pair
      (T1, T2) at a single order a.
    what_is_discarded: >-
      The entire shape of both distributions, and the entire Renyi curve except its
      value at one order. A single scalar R_a summarises a 25-point pair of
      measures; and the argument then keeps only its logarithm scaled by N.
    why_genuinely_lossy: >-
      Massively lossy and not invertible. Infinitely many distribution pairs share a
      given R_a at a given order -- indeed the fibre is a positive-codimension
      variety in the simplex -- so the projection cannot be a change of coordinates.
      This is precisely why the divergence argument is a BOUND rather than a
      characterisation, and stating it this way is what makes the method-ceiling
      audit honest.
    why_compatible_with_the_operations: >-
      Compatible in the strongest available sense: the operation the security
      argument performs on the distributions is taking N-fold products over
      independent samples, and R_a is exactly MULTIPLICATIVE under that operation.
      The retained scalar therefore propagates deterministically -- log2 R_a simply
      scales by N -- which is the condition the lossy-projection test requires and
      the reason the loss pair is the right tracked object rather than the
      divergence alone.
    is_it_only_a_change_of_coordinates: >-
      NO, checked in both directions. It is not the KN-LIT-7595 failure (nothing
      discarded): the map from distribution pairs to R_a is many-to-one by a wide
      margin. It is not the mirror failure (constant across instances) either, and
      this was checked numerically rather than asserted: on the excerpt the loss
      pairs are (0.715, 0.960), (0.418, 0.632) and (0.274, 1.641) at the three
      parameter sets, which have visible spread in both coordinates and in their
      ratio (1.34, 1.51, 5.99). A comparator with zero spread would have been the
      kill; it has spread, and one of the three points is an outlier, which is the
      opposite of the failure mode.

  assumptions:
    - >-
      That the deployed distribution is the one whose divergence from the ideal is
      printed. If the document computes the divergence for the TABULATED
      distribution while the SAMPLER realises a slightly different one (a sign-bit
      or bit-budget convention difference), the printed number is about a
      neighbouring object. IDEA-20260805-390957's identity C3 is the check that
      settles this and it is a declared dependency of this proposal.
    - >-
      That the samples are independent, so multiplicativity applies. FrodoKEM's
      error matrices are drawn independently entry-wise as far as this proposal
      recalls; if any structure couples them the multiplicativity step needs a
      different justification. Read target.
    - >-
      That log R_a is approximately linear in a over the relevant range, which is
      what makes the inversion a closed form. This is asymptotic in small
      divergence and is CHECKED by the audit rather than assumed: recomputing R_a
      exactly at several orders and fitting the linearity is a declared stage, and
      a failure of linearity changes a* without changing the audit's structure.

  predictions:
    - metric: >-
        Reading determination: whether the printed divergence is per-sample or
        whole-scheme, decided by which reading makes the printed order lie within a
        factor of 2 of the balance point at a majority of parameter sets
      direction: different
      minimum_effect: >-
        The PER-SAMPLE reading, predicted before the source is read. Excerpt
        evidence, SCOUT-COMPUTED: ratios T2/T1 of 1.34 and 1.51 at Frodo-640 and
        Frodo-976 under the per-sample reading, against a ratio of order 1e-5 under
        the whole-scheme reading. If primary text shows the whole-scheme reading,
        this prediction is FALSIFIED and the balance-point model of the designers'
        tuning is wrong -- an outcome that would be more informative than the
        prediction holding.
    - metric: >-
        N*, the sample count at which the printed order is optimal, computed by
        inversion per parameter set, compared against the scheme's actual chi
        sample count read from the specification
      direction: different
      minimum_effect: >-
        Agreement within a factor of 3 at Frodo-640 and Frodo-976. SCOUT-COMPUTED
        excerpt values: N* = 15297 against N = 20544 (factor 1.34) and N* = 20696
        against N = 31296 (factor 1.51). AT FRODO-1344 NO SUCH AGREEMENT IS
        PREDICTED: the excerpt gives N* = 7194 against N = 43072, a factor of 6.0,
        and this proposal pre-registers that discrepancy as an ANOMALY TO RESOLVE
        rather than predicting it away. Predicting agreement everywhere would be
        predicting against this record's own computation.
    - metric: >-
        Total loss lambda - lambda' = T1 + T2, in bits, per parameter set, at the
        document's own order and sample count
      direction: different
      minimum_effect: >-
        Below 4 bits at every parameter set, and matching whatever loss the
        document itself states, if it states one, to within 1 bit. Excerpt values
        1.675 / 1.050 / 1.914 bits. A document-stated loss differing by more than 1
        bit from the recomputation is a discrepancy in the sense
        RQ-FRODO-3260cc.decision_target asks about.
    - metric: >-
        Sample-count sensitivity: the loss at N/4, N/2, N, 2N, 4N, 16N, 256N, and
        the sample count N_crit at which the total loss reaches 1, 5 and 20 bits
      direction: higher
      minimum_effect: >-
        Loss strictly increasing in N with slope exactly log2 R_a bits per sample
        -- a FORCED VALUE, since T2 is linear in N by multiplicativity and T1 does
        not depend on N at all. Any computed sensitivity curve that is not affine in
        N with that exact slope indicates an error in the implementation, not a
        feature of FrodoKEM. This is the audit's own instrument check and it is free.
    - metric: >-
        Quantifier determination: whether the document binds the sample count N
        before or after the adversary's target count T, recorded with a section
        reference
      direction: different
      minimum_effect: >-
        A single unambiguous answer with a quotation. If N is bound before T, state
        the multi-target loss as T * N * log2 R_a and state the target count at
        which it exceeds 1 bit. If the document handles multi-target separately,
        record that and state that the divergence argument's scope is single-target,
        which is a scope statement and NOT a weakness.
    - metric: >-
        Monotonicity instrument check: R_a computed exactly at a grid of at least
        eight orders spanning the printed one
      direction: higher
      minimum_effect: >-
        Strictly non-decreasing in a at every consecutive pair, with no exception.
        This is a THEOREM about Renyi divergence, so a violation is a bug in the
        pipeline and NOT a fact about FrodoKEM. It is the cheapest available
        demonstration that the divergence code is not broken and it must be run and
        reported before any recomputed divergence is compared to a printed one.

  minimal_test:
    design: >-
      Five stages, ordered cheapest-first, and the first two need no FrodoKEM
      figures at all -- which is deliberate, because
      GOAL-FRODO-001.next_action holds the source gate shut and a contract whose
      early stages are source-free can be designed now and executed in the right
      order later.
      STAGE 0 (GATE, READING). The source gate of RQ-FRODO-3260cc.constraints[0]:
      acquire and file the specification and the primary divergence analysis as
      KN-LIT entries with provenance levels and extraction damage marked. NOTHING
      BELOW MAY EXECUTE BEFORE THIS IS COMMITTED.
      STAGE 1 (SOURCE-FREE ALGEBRA, ZERO COMPUTE). Derive the conversion from the
      probability-preservation inequality and multiplicativity, symbolically,
      including the T1/T2 decomposition, the optimum a*, and the inversion for N*.
      Verify the two recalled properties of Renyi divergence against a primary
      source and record the exact statement and side conditions, or record that
      they could not be obtained. This stage is where the audit can be shown wrong
      most cheaply.
      STAGE 2 (SOURCE-FREE INSTRUMENT CHECK, SECONDS). Implement R_a in exact
      rational arithmetic and validate it on distributions with closed-form
      answers, BEFORE any FrodoKEM table is loaded. See controls.
      STAGE 3 (INVERSION, SECONDS, NEEDS STAGE 0). Recompute R_a exactly from the
      filed table against the filed ideal distribution at the printed order,
      compare to the printed divergence under both readings, invert for N*, and
      emit the sensitivity table.
      STAGE 4 (QUANTIFIER AUDIT, READING). Write the conversion out with explicit
      quantifiers as the document states it, and determine where N is bound
      relative to the target count.
    controls:
      - >-
        NULL OBJECT WITH A CLOSED FORM, FORCED VALUE DERIVED PRE-RUN, CAN FAIL.
        Two Bernoulli distributions P = (p, 1-p), Q = (q, 1-q). Then
        R_a(P||Q)^{a-1} = p^a q^{1-a} + (1-p)^a (1-q)^{1-a}, an exact rational for
        rational p, q. The pipeline must return that value EXACTLY at every tested
        order, as a Fraction, with no floating point anywhere. It can fail
        outright, and it tests the divergence code without reference to FrodoKEM.
      - >-
        SECOND NULL, THE IDENTICAL-DISTRIBUTION CASE. P = Q. FORCED VALUE:
        R_a(P||P) = 1 EXACTLY, at every order, for every P. A pipeline that returns
        anything other than exactly 1 is broken. Cheap and absolutely decisive.
        Declared explicitly as a control that CANNOT fail for a correct
        implementation and therefore proves little on its own -- it is included as a
        smoke test and is NOT counted as a sensitivity demonstration
        (KN-TECH-1a5b7e's named failure mode).
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR. Take the
        filed FrodoKEM table and perturb it by a KNOWN, seeded amount -- move u
        units of mass between two cells -- then recompute R_a. The divergence MUST
        increase, and its increase must be detectable at the printed order. THE
        PASS THRESHOLD IS DECLARED HERE, BEFORE THE RUN: for a perturbation that
        changes the second moment by 1 part in 1e4, the recomputed R_a - 1 must
        change by at least 1 part in 1e3 of its own value. IF IT DOES NOT, THE
        PIPELINE CANNOT DETECT A DISCREPANCY OF THE SIZE BEING LOOKED FOR AND NO
        AGREEMENT WITH THE PRINTED NUMBER MAY BE REPORTED AS A VERIFICATION -- this
        is RQ-FRODO-3260cc.constraints's mutation requirement applied to the
        divergence side, where the goal record states it only for the table side.
      - >-
        GRADED CONTROL, FIVE INTERIOR POINTS, MONOTONICITY REPORTED. Compute R_a at
        orders a in {a/8, a/4, a/2, a, 2a, 4a, 8a} around the printed order and
        report (i) monotonicity in a, which is forced by theorem, and (ii) the
        measured linearity of log R_a in a, which is the approximation the inversion
        rests on. Report the deviation from linearity as a number. If log R_a is not
        close to linear over the tested range, the closed-form a* is wrong and must
        be replaced by a numerical minimisation -- the audit continues, with a
        stated correction, rather than failing.
      - >-
        ARCHIVE CHECK, ZERO COMPUTE. Search for any prior computation of a Renyi
        divergence in this program's ledger. RESULT AS OF 2026-08-05: NONE. Eight
        literature entries mention the concept; no ledger record computes one. This
        is recorded as an absence, not claimed as a passed check.
      - >-
        VERDICT-ON-THE-NULL-FIRST ORDERING. The decision rule for "reproduced
        versus discrepancy" is executed on the Bernoulli null and on the perturbed
        table BEFORE the published FrodoKEM divergence is looked at, and the null
        arm's results are hash-committed first. If the rule emits the same verdict
        on the perturbed and unperturbed tables, it discriminates nothing and must
        be rewritten before the real comparison is read.
    required_metrics:
      - the conversion derived symbolically, with every side condition of the probability-preservation inequality stated
      - the primary-source statement of the two Renyi properties, quoted, or a recorded failure to obtain it
      - exact-rational R_a per parameter set at the printed order, as a Fraction
      - printed divergence, the reading determined for it, and the evidence for that reading
      - T1, T2, total loss, N*, and the full sensitivity table over N
      - the quantifier statement as the document gives it, quoted with a section reference
      - null, positive-control and graded-control outcomes, committed before the treatment arm

  falsification_conditions:
    - >-
      The exact recomputed R_a agrees with the printed divergence under NEITHER
      reading, at any parameter set. The proposal's model of what the printed number
      denotes is then wrong, and the correct response is to re-read rather than to
      declare a discrepancy -- a distinction this record fixes before the run so it
      cannot be chosen afterwards.
    - >-
      The positive control fails: a seeded perturbation of the stated size does not
      move the recomputed divergence by the stated amount. Nothing may be reported
      as a verification, in either direction.
    - >-
      R_a is not monotone in a on the computed grid. The pipeline is broken; halt
      and repair, and report nothing about FrodoKEM.
    - >-
      The document turns out not to use a Renyi argument at all, or to use a
      different divergence (statistical distance, KL, max-log). The proposal's
      subject does not exist as described and the record is superseded rather than
      patched.
    - >-
      The sensitivity curve is not affine in N with slope log2 R_a. Implementation
      error, not a FrodoKEM finding.
    - >-
      The Frodo-1344 anomaly disappears entirely once correct lambda and N are read.
      The proposal's most interesting pre-registered observation is then explained
      by this program's own recalled inputs being wrong, WHICH IS THE MOST LIKELY
      OUTCOME and is recorded as such rather than discovered later.

  confounders:
    - >-
      RECALLED SECURITY LEVELS. lambda = 143 / 209 / 274 is model memory. T1 =
      lambda/a is proportional to it, and the Frodo-1344 anomaly is most sensitive
      to exactly this input: a lambda of 274 versus, say, 128 changes T1 by a factor
      of 2.1 and moves a* correspondingly. This is the single most likely source of
      the anomaly and the audit must resolve lambda by reading before interpreting it.
    - >-
      THE SAMPLE COUNT N IS A MODELLING CHOICE, NOT A FACT. Whether the argument
      charges keygen samples, encapsulation samples, both, or only the samples in
      the public LWE instance changes N by a factor of up to 4, and N* by the same.
      The audit's sensitivity table is the honest response: report the loss across a
      range of N rather than picking one.
    - >-
      EXTRACTION DAMAGE. The orders and divergences come from a visibly damaged
      excerpt in which delimiters were lost. That IDEA-20260805-390957's
      normalisation identity returns exactly 2^16 on the same row is evidence the
      integers survived in order; it is NOT evidence the trailing order and
      divergence were parsed correctly.
    - >-
      FIRST-ORDER BOOKKEEPING. The decomposition lambda' = lambda - T1 - T2 drops
      cross terms that are second order in the small quantities. At losses of 1 to 2
      bits out of 143 that is safe by inspection, but it is an approximation and is
      named as one; the exact bound is the inequality itself and the audit reports
      both.
    - >-
      TIDINESS BIAS. An audit that ends "the numbers are consistent" is cheap to
      produce and reads as rigour. The positive control and the pre-registered
      Frodo-1344 anomaly exist so that a clean outcome costs something to reach.

  interpretation_limits:
    - >-
      SPLIT CLAIM TIER, ENFORCED, PER RQ-FRODO-3260cc.scope.claim_tier_ceiling. The
      ARITHMETIC statement -- that an exactly recomputed R_a does or does not equal a
      printed figure at the standardised parameters -- is a CRYPTO-tier claim,
      because it is a finite exact computation at the real parameter sets. Every
      SECURITY statement derived from it, including every bit-loss number in this
      record, is capped at TOY and may not be cited above it. A batch that blurs the
      two has failed regardless of what it computed
      (GOAL-FRODO-001.next_action, verbatim).
    - >-
      A discrepancy in a bit-loss figure is NOT AN ATTACK and NOT A BREAK. It is a
      documentation or analysis defect until costed, and costing it needs an
      attacker model this proposal does not supply.
    - >-
      Nothing here is evidence about the hardness of LWE at Frodo's dimensions,
      in either direction. lambda is an input read from a document, never a quantity
      this goal derives or disputes.
    - >-
      A clean reproduction verifies an arithmetic assertion about a published
      number. It does not verify the security proof, the reduction's applicability,
      or the parameter choice.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Probability preservation) For distributions P, Q with Supp(P) contained in
        Supp(Q) and every a > 1, and every event E:
        Q(E) >= P(E)^{a/(a-1)} / R_a(P||Q).
      rigorous_support: >-
        RECALLED AS A STANDARD LEMMA, NOT RE-DERIVED AND NOT CITED TO ANY SPECIFIC
        PAPER, THEOREM NUMBER, OR PAGE, because none has been checked by this
        program. It follows from Holder's inequality applied to the pair
        (P(E), Q(E)) with exponents a and a/(a-1), and that derivation is short
        enough to be reproduced independently in Stage 1 rather than cited. IT IS
        LOAD-BEARING: the entire conversion is this inequality.
      validation_plan: >-
        Reproduce the Holder derivation in full in Stage 1, and independently verify
        the inequality numerically on the Bernoulli null across a grid of (p, q, a,
        E) in exact rational arithmetic, checking it is tight where Holder says it
        should be. Then locate a primary source and record its exact statement, or
        record that it could not be obtained.
    - id: H2
      statement: >-
        (Multiplicativity) R_a(P_1 x ... x P_N || Q_1 x ... x Q_N) =
        prod_i R_a(P_i||Q_i), hence R_a(P^N||Q^N) = R_a(P||Q)^N for i.i.d. samples.
      rigorous_support: >-
        Immediate from the product form of the defining sum; RECALLED AS STANDARD
        and reproducible in two lines. LOAD-BEARING: T2's linearity in N, and hence
        the entire sample-count sensitivity result, is exactly this property.
      validation_plan: >-
        Verify numerically on the Bernoulli null for N = 2, 3, 4 by direct
        computation over the product space in exact rationals, and derive it
        symbolically. Cost: seconds.
    - id: H3
      statement: >-
        (Linearity of the log-divergence in the order) log R_a(P||Q) = c*a*(1+o(1))
        over the range of orders in use, with c = chi2(P||Q)/2.
      rigorous_support: >-
        A second-order expansion of the Renyi divergence around a = 1 gives
        log R_a ~ (a/2) chi2 for small divergence. NOT RE-DERIVED HERE and NOT
        CITED. It is load-bearing ONLY for the closed-form inversion a* =
        sqrt(lambda/(N c)); the audit's substantive results (the exact R_a, the
        sensitivity table, the quantifier statement) do not depend on it.
      validation_plan: >-
        The graded control measures the linearity directly across seven orders and
        reports the deviation. If linearity fails, replace the closed form by
        numerical minimisation of L(a) and continue -- a stated correction, not a
        failure.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED BY THIS PROPOSAL, and it is stated plainly rather than
      dressed up. What moves is a CONSTANT: the number of bits of security the
      divergence step costs, currently 1 to 2 bits at the excerpt figures, and the
      rate at which that constant grows with sample count. This is cofactor
      accounting and it is proposed anyway, for the reason
      docs/target-result-profile.md's cost-honesty clause implies: a constant that
      nobody has recomputed sits underneath a security claim about a deployed
      scheme, and the sample-count dependence of it is the one part of that claim
      that is not a printed number and therefore cannot be checked by inspection.
    memory_exponent: >-
      n/a. The computation is a sum over 25 support points in exact rationals.
    best_known: >-
      The document's own figures, whatever they turn out to be. There is no
      competing published recomputation known to this program, and no search this
      program has run would reliably find one (KN-OPEN-3f7a21).
    hidden_overhead: >-
      None in the computation. The real cost is reading the specification precisely
      enough to fix N, lambda, and the quantifier -- three quantities the audit's
      whole result depends on and none of which is a table entry.
    tradeoff_note: >-
      The order a is itself a time/loss tradeoff knob internal to the proof and the
      audit reports the trade curve L(a) rather than a single point.

  dominated_by: >-
    n/a (no result claimed; no attack, no algorithm, no cost improvement, hence no
    Pareto point to dominate). FRONTIER ROWS CHECKED before writing null: (i) TIME
    -- the inversion is closed-form arithmetic on three numbers; nothing could be
    cheaper than reading the document, which is the actual cost; (ii) MEMORY -- 25
    rationals; (iii) DATA / QUERIES / PREPROCESSING -- one document read, zero
    oracle queries, zero samples, zero precomputation; (iv) the corpus's own
    frontier for this specific question, searched 2026-08-05: no FRODO-area ledger
    record of any kind exists, and no ledger record anywhere computes a Renyi
    divergence. Absence of a search result is not evidence that no prior work
    exists, and this corpus's novelty screens are explicitly discounted by
    KN-OPEN-3f7a21.
  sota_delta: >-
    No attack; conceptual and evidentiary contribution only. Quantitatively: the
    audit produces (a) an exact-rational R_a per parameter set at crypto scale
    where the document supplies a floating-point figure, (b) a loss curve
    d(loss)/dN = log2 R_a bits per sample, currently unstated anywhere this program
    can see, and (c) the recovered sample budget N*, currently unstated. Against
    the incumbent practice of quoting the printed divergence downstream, the delta
    is the difference between an unchecked constant and a derived one -- zero bits
    of attack advantage, and the sample-count scaling that nobody has written down.

  estimated_cost:
    implementation: low
    compute: negligible
  recommended_priority: high
  honest_prior_of_survival: >-
    0.20 that the audit finds a genuine discrepancy -- a printed divergence that
    does not reproduce under either reading, a mis-tuned order that survives correct
    inputs, or a quantifier that binds N after the target count. It is not lower
    than 0.20 because the Frodo-1344 balance ratio computed in this record is 6.0
    against 1.34 and 1.51 at the other two parameter sets, which is a real
    numerical outlier obtained before reading anything and is not explained by any
    mechanism this proposal knows; because the conversion step is, in
    RQ-FRODO-3260cc's own words, the least visible link in the chain; and because
    the corpus's one precedent for auditing a standardisation document's arithmetic
    (GOAL-HQC-001 BATCH-002) found an error on its first attempt. It is not higher
    than 0.20 because the single most likely explanation of the anomaly is that
    this record's recalled lambda and N for Frodo-1344 are simply wrong, because
    FrodoKEM has been reviewed for years by people who understand the tool far
    better than this program does, and because two of three parameter sets already
    land within 20 per cent of the balance point under this proposal's own model,
    which is evidence the designers did tune it. SEPARATELY: 0.90 that the audit
    reaches a decisive reading conditional on Stage 0 succeeding, and roughly 0.75
    that Stage 0 succeeds at all given that
    GOAL-FRODO-001.pause_conditions explicitly contemplates source acquisition
    failing under the network policy.
