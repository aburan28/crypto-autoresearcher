idea:
  id: IDEA-20260815-6d4580
  question_id: RQ-ICINV-475b5e
  added: '2026-08-15'
  title: >-
    ISOGENY-CLASS INVARIANTS ARE USED TO ARGUE DIFFICULTY IS UNIFORM, BUT
    THE INVARIANTS THEMSELVES ARE NEVER MEASURED ACROSS A CLASS: enumerate a
    full small isogeny class and measure which quantities actually vary
  class: measurement

  claim: >-
    Several closures in this program rest on difficulty being an isogeny-
    class invariant. That argument distinguishes quantities that vary within
    a class from those that do not, and the distinction is asserted from
    theory rather than measured. Enumerating a complete small isogeny class
    and computing every cheap invariant on every member settles which is
    which by construction.

  mechanism: >-
    Enumerate a complete ordinary isogeny class at toy size. For each member
    compute group structure, volcano level, j-invariant, endomorphism ring
    conductor, and every cheap curve statistic available. Report which vary
    and which are constant across the class.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-ENDO-001's transport theorem and IDEA-20260807-1d9c5f;
      grep 'isogeny class invariant', 'volcano level', 'class
      enumeration'.
    results: >-
      IDEA-20260807-1d9c5f identifies the rational-kernel count as the one
      quantity varying within a class; no record enumerates a full class
      and measures every cheap invariant to check that identification.
    verdict: >-
      ADAPTATION. Isogeny-class structure is classical and one varying
      quantity is already identified here; the contribution is exhaustive
      measurement across a complete class rather than argument.

  object_first_candidate:
    tracked_object: >-
      EVERY CHEAP CURVE INVARIANT, measured across a complete isogeny
      class.
    lossiness: >-
      Reducing a curve to a vector of invariants discards its full
      structure, which is exactly the reduction the class-invariance
      arguments rely on.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives at toy sizes where a class is fully enumerable; class size
      grows with the class number and bounds the reachable range.

  null_object_control: >-
    NULL 1 -- two curves in DIFFERENT isogeny classes, where class-invariant
    quantities must differ; if they do not, the quantity is not
    distinguishing classes and is uninformative. NULL 2 -- the same curve
    twice, where every invariant must agree, catching computation
    instability.

  discriminated_from:
    - >-
        IDEA-20260807-1d9c5f, which identifies the rational-kernel count
        as varying; this record checks that identification exhaustively
        and looks for others it missed.
    - >-
        IDEA-ISO-f9b2d3, which closes DLP uniformity within an ordinary
        class; this measures the invariants that closure reasons about.

  assumptions:
    - >-
        A complete ordinary isogeny class is enumerable at toy size, which
        requires the class number to be small.
    - >-
        The invariant list is broad enough that a varying quantity would
        be caught; an unlisted invariant is the enumeration's blind spot.

  predictions:
    - metric: >-
        same-curve null
      direction: different
      minimum_effect: >-
        FORCED all invariants agree; disagreement means computation
        instability.
    - metric: >-
        different-class null
      direction: different
      minimum_effect: >-
        FORCED class-invariant quantities differ; agreement means the
        quantity does not distinguish classes.
    - metric: >-
        set of invariants varying within the class
      direction: different
      minimum_effect: >-
        The deliverable; anything beyond the already-identified
        rational-kernel count is a genuine addition.
    - metric: >-
        completeness of the enumerated class
      direction: different
      minimum_effect: >-
        FORCED to equal the class number computed independently, which
        is a free exact check on the enumeration.

  minimal_test:
    design: >-
      One small ordinary isogeny class, fully enumerated, all cheap
      invariants, both nulls.
    controls:
      - >-
          Same-curve stability null.
      - >-
          Different-class distinguishing null.
      - >-
          Class size checked against the independently computed class
          number.
      - >-
          Invariant list declared in advance so it cannot be trimmed
          after seeing results.
    required_metrics:
      - >-
          Value of every invariant for every class member.
      - >-
          Set of varying versus constant invariants.
      - >-
          Class enumeration completeness check.
      - >-
          Artifact manifest with hashes and rebuild receipt.

  falsification_conditions:
    - >-
        Class size does not match the class number. Enumeration
        incomplete; results void.
    - >-
        The same-curve null disagrees. Computation unstable.
    - >-
        An invariant varies that was assumed constant. The class-
        invariance arguments relying on it must be revisited, which is the
        record's highest-value outcome.
    - >-
        Only the already-identified quantity varies. The existing
        identification is confirmed exhaustively rather than by argument,
        which strengthens the closures resting on it.

  confounders:
    - >-
        INVARIANT-LIST INCOMPLETENESS: a quantity nobody listed could vary
        and would be missed, so a null result binds the declared list
        only.
    - >-
        SMALL-CLASS ATYPICALITY: classes small enough to enumerate may
        have atypical structure, so the result does not transfer to large
        classes.

  interpretation_limits:
    - >-
        Measures invariants on one class; establishes no general theorem
        about isogeny classes.
    - >-
        Scoped to the enumerated class, its size, and the declared
        invariant list.
    - >-
        A constant invariant across one small class is not proof of class-
        invariance.

  heuristic_assumptions:
    - id: HEUR-ICINV-1
      statement: >-
        The declared invariant list is broad enough that any quantity
        varying within an ordinary isogeny class would be detected.
      rigorous_support: >-
        Rigorous ingredient: the theory of isogeny volcanoes determines
        which quantities are constant on a class and which vary with
        volcano level, giving a theoretical prediction for most listed
        invariants. THE GAP: the list is drawn from what this program
        computes cheaply, which is a convenience criterion rather than a
        theoretical one, so a theoretically varying quantity that is
        expensive to compute would simply be absent.
      falsification_condition: >-
        A quantity known from theory to vary within a class that the
        declared list does not include.
      validation_plan: >-
        SAMPLE: complete class enumeration, all declared invariants.
        TAIL CHECK: invariants whose theoretical status is uncertain,
        reported separately from those with clear predictions. TRANSFER:
        none beyond the enumerated class.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is invariant computation for every class
      member.
    memory_exponent: >-
      Negligible per curve at toy size.
    best_known: >-
      The incumbent is IDEA-20260807-1d9c5f's identification of the
      rational-kernel count, which this checks exhaustively rather than
      improving.
    hidden_overhead: >-
      Expensive invariants are excluded by the convenience criterion,
      which is the enumeration's structural blind spot.
    tradeoff_note: >-
      A complete small class gives exhaustive certainty at small scale; a
      sampled large class gives weaker evidence at more relevant scale.
      This record takes the first and states the limitation.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As theory: entirely dominated by the
    classical isogeny-volcano literature, which predicts most of these
    answers. As exhaustive measurement in this program: none exists. Not
    null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: every cheap invariant
    measured across a completely enumerated ordinary isogeny class, with the
    enumeration verified against the class number, testing exhaustively an
    identification the program currently holds on one record's argument.

  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.8 that a class small enough to enumerate is findable at toy size. 0.95
    that the completeness check works, since the class number is
    independently computable. 0.25 that an unexpected invariant varies,
    which would require revisiting the closures that rest on class-
    invariance.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-ICINV-475b5e
