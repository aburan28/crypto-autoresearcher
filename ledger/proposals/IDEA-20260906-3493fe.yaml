    "claim": "A nested collision generator whose dependency DAG has a small regenerable separator may retain sqrt(W)*poly(m) time with polynomial storage; the proposal tests the regeneration multiplier that single-level fibre-surplus accounting omits.",
    "mechanism": "R3 non-function representation: a collision derivation DAG with typed separator seeds, paired with Sigma={regenerate a child, verify a collision, discard a completed subtree}. Partial-action on derivations. Completed internal histories are discarded, but a deterministic seed and input binding regenerate their exact outputs. This is genuine history loss; the group point remains explicitly verified.\n\nBuild the two-level representation collision procedure with deterministic child streams. Instead of caching every child output or rerunning whole trees, retain seeds at a separator selected by a weighted pebbling recurrence. Each stored seed costs words and each regeneration charges all hash and group operations. Define r(v), the exact recomputation count of node v, and T=sum_v r(v)c(v). Only a proof that separator width and weighted replay overhead are polynomial can reach the LHW storage target. This does not assume that producing a valid child collision has unit cost; rare child successes and correlation of reused streams enter the recurrence.",
