idea:
  id: IDEA-20260905-ab4a6e
  title: 'THE QUADRATIC-ORDER BOX FACTOR BASE - x(P) read as a residue of a small element u + v*omega of an imaginary
    quadratic order O_K modulo a split prime, small meaning |u|, |v| <= B^{1/2} - is predicted to be a reparametrisation
    of the interval base (norm-height bookkeeping: |S_3(alpha)| <= B^2 against |pi| = p^{1/2} is the same dimensionless
    ratio as B^4 against p), EXCEPT on a curve with CM by O_K where the unit group acts on box and curve simultaneously
    and the base is automorphism-orbit-structured; a representation record whose predicted generic outcome is a
    controlled null with the CM curve as the labelled positive control'
  class: representation
  claim: 'REPRESENTATION CLASS AND STAGE (RQ-ECDLP-623a32): class R1 (field representation of the x-coordinate as
    a reduced element of O_K/(pi)); attack stages whose charged cost is addressed are factor-base membership and
    relation decomposition; the claimed change is 0 on generic curves and the known factor |Aut| on CM curves. Let
    O_K = Z[omega] be the maximal order of an imaginary quadratic field of small discriminant D, p a prime splitting
    in O_K, pi a generator of a prime above p (N(pi) = p, F_p = O_K/(pi)), rho : O_K -> F_p the reduction. BOX BASE:
    F_box = { P in G : x(P) = rho(u + v omega), |u|, |v| <= B^{1/2} }, of size about B (by IDEA-20260905-d0fee4
    (C1)). (Q1) MEMBERSHIP is one Gauss reduction of x(P) against the lattice (pi): polylog. (Q2) SMALL-ROOT RATIO
    TIE. The relation S_3(x_1, x_2, x_3) = 0 mod pi lifts to S_3(alpha_1, alpha_2, alpha_3) = lambda pi in O_K with
    |S_3(alpha)| <= c B^2 (degree 4 in |alpha| <= B^{1/2}) against |pi| = p^{1/2}: ratio B^2/p^{1/2} = (B^4/p)^{1/2},
    the same dimensionless ratio as the interval base''s B^4 against p. The small-root reach of the windowed family
    is predicted UNCHANGED. (Q3) GENERIC PREDICTION. On a curve with End(E) not containing O_K, F_box is log-random:
    arity-3 yield, the H-PSEUDO statistic C(p) (as in IDEA-20260902-701458 (S5)) and Groebner cost over the membership
    polynomial match a random subset of G and the interval base of the same size within pre-registered bands. (Q4)
    STRUCTURED POSITIVE CONTROL. On a curve with CM by O_K (j = 0 for D = -3, j = 1728 for D = -4, with 6 | p -
    1 or 4 | p - 1), a unit u in O_K^* acts on the box by alpha |-> u alpha AND on the curve by the automorphism
    [u] with x([u]P) = u'' x(P) for the corresponding root of unity, so F_box is a union of Aut(E)-orbits: the relation
    stage gains the known factor |Aut| (FGHR, KN-LIT-004) and rho gains sqrt(|Aut|) (KN-TECH-018). This is the only
    predicted effect and it is the known one. TWO EXPLANATIONS DISCRIMINATED. E-A: two-dimensional smallness is
    a new lever for prime-field factor bases (brief class (4)). E-B: it is the interval base in different coordinates;
    every statistic ties. The toy battery decides.'
  mechanism: 'OBJECT FRAME. The PAIR is (representation: x(P) as the reduced representative in the fundamental domain
    of (pi) in O_K, with the box predicate and the relation vector over F_box; operation set Sigma: translation
    by factor-base elements only, and on CM curves additionally multiplication by the unit group Gamma = image of
    O_K^* in (Z/N)^*, |Gamma| <= 6). TRICHOTOMY CLASS: Class I, partial-action, reason: the relation vector propagates
    deterministically only under translation by members of F_box (index calculus, F2 as component), and on CM curves
    the orbit partition of F_box under Gamma is a block system of <Gamma> (IDEA-20260901-863e36 (C3), the multiplication
    slice); Sigma is never the full translation action. WHAT IS DISCARDED: the box PREDICATE discards everything
    about P except membership (1 bit, lossy in the representation used), and the reduced representative itself discards
    nothing (a bijection F_p -> fundamental domain, i.e. a change of coordinates, which is why the record''s only
    claim is about the predicate geometry). Compatibility: with translation by F_box through the relation vector,
    and with Gamma through the orbit block system, whose canonicalisation cost is O(1) because Gamma is morphism-induced
    (863e36 (C5)). Smallness is archimedean; O_K carries the complex absolute value and the norm is multiplicative,
    so height bookkeeping transfers with p replaced by |pi| = sqrt p and B by sqrt B in each of two coordinates.
    Nothing in the group law of a generic E sees O_K; only when O_K = End(E) does the ring act on both sides, and
    then only through its unit group.'
  non_generic_operation:
    operation: Factor-base membership by lattice reduction in O_K (field-level, R1); predicted cost-equivalent to
      interval membership.
    attack_stage: factor-base membership and relation decomposition; predicted unchanged on generic curves, |Aut|-structured
      on CM curves
  object_first_candidate:
    tracked_object: The reduced representative of x(P) in the fundamental domain of (pi), and the box predicate
      on it.
    established_families_off_limits: The CM-trace base (701458), the Kummer base and the interval base are neighbours;
      the interval base is the matched control. F2 is the component.
    lossy_projection_test: 'The representative loses nothing; the predicate is lossy (1 bit) and, like every membership
      predicate, propagates under no group operation on its own (Type III of IDEA-20260806-071255); as a factor
      base it is Class I through the relation vector. Meter prediction for the predicate as a projection: image
      size 2, L = log2(N/2) on the complement and b = 2 = |S| (no propagation, matching a random label of image
      size 2).'
    survival: Survives every split p and O_K as a definition; predicted to die as a lever on every non-CM curve
      and to reduce to FGHR/KN-TECH-018 on CM curves.
