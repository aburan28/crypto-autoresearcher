    nearest_internal_records:
    - record: IDEA-20260815-3dc025
      exact_difference: '3dc025 uses Lenstra''s CM structure theorem E(F_p) = O/(pi - 1)O, a lattice presentation
        of the GROUP E(F_p) as an O-module with a norm and a smoothness notion, and locates the barrier in the DLP-equivalence
        of the coordinate that exposes a point''s residue class. This record''s box is a lattice presentation of
        the FIELD F_p = O_K/(pi) applied to the x-coordinate, not of E(F_p); its coordinate (x(P) reduced mod pi)
        is free to compute, so 3dc025''s obstruction does NOT apply to it - and its consequence is the opposite
        one: because the presentation is of the field and not of the group, the box carries no group information
        at all on a generic curve, which is why (Q3) predicts a null. The two presentations are related only on
        a CM curve, where the unit group of O_K acts on both, and there this record predicts exactly the known |Aut|
        structure. 3dc025''s smoothness-in-the-module notion is not used.'
    - record: H-FBG-001 (rejected_scoped, DEC-20260724-007, EV-FBG-001)
      exact_difference: H-FBG-001 tested six structured factor-base geometries (high-bit interval, small canonical
        height, mixed two-base, multiplicative coset union, greedy-optimised, asymmetric sizing) at m = 3 and found
        no N-growing advantage over a matched random base; it is the prior scoped negative for every archimedean-smallness
        base including this one. What the box predicate adds beyond that tested set is (i) a two-dimensional archimedean
        geometry in a lattice presentation of F_p rather than of Z, (ii) a ring symmetry (the unit group of O_K)
        that becomes a curve symmetry on the CM arm, giving a positive control H-FBG-001 did not have, and (iii)
        the height-ratio derivation (Q2) predicting the null rather than measuring it. The record predicts landing
        inside H-FBG-001's negative on generic curves.
    - record: IDEA-20260904-8dccc9
      exact_difference: 8dccc9 re-parametrises the SAME interval factor base (the same set of points) by r bounded
        digits, proves demand-neutrality by volume preservation, and changes the Newton polytope the small-root
        solver sees. This record's box is a DIFFERENT set of points (a two-dimensional box in O_K, not an interval
        in Z), and its "reparametrisation" claim is statistical (Q3) plus a height-ratio tie (Q2), not a set identity;
        and the lifted relation S_3(alpha) keeps the same per-variable degree and support in the alpha-coordinates,
        so unlike 8dccc9 no polytope change is claimed or expected. 8dccc9's demand-neutrality lemma applies to
        the box as well (equal volume B), which is consistent with (Q2).
    - record: IDEA-20260902-701458
      exact_difference: 701458 defines a base by a predicate on an AUXILIARY curve's trace; this record defines
        one by an archimedean box in a lattice presentation of F_p itself. Different predicate, same battery (reused).
