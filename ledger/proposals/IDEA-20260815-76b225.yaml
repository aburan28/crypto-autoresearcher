idea:
  id: IDEA-20260815-76b225
  question_id: RQ-SIG-001
  added: '2026-08-15'
  title: >-
    THE D>=6 NULL THE SIG LANE OWES, BUILT AS A MATCHED-SHAPE RANDOM SYSTEM
    RATHER THAN A RESCALED D<=5 BASELINE: the cascade's apparent persistence
    is currently confounded with the null's own degree dependence, and no
    cascade claim can survive until the two are separated
  class: control

  claim: >-
    GOAL-SIG-001 is blocked on exactly one thing: a correctly calibrated
    D>=6 null baseline, without which the degree-born syzygy cascade cannot
    be called exploitable or bounded. The trap the lane must avoid is
    calibrating the D>=6 null by EXTRAPOLATING the D<=5 baseline, because
    the null's own behaviour is degree-dependent and an extrapolated null
    would bake the very trend under test into the reference. This record
    specifies the null as an independently generated matched-shape random
    system at each D, generated and measured at D>=6 directly, so that the
    cascade statistic is compared against a reference that was never fitted
    to the cascade's own degrees.

  mechanism: >-
    Generate random systems matched to the Semaev system at each D on shape
    alone -- variable count, degree sequence, sparsity, and field -- with no
    curve structure. Measure the cascade statistic on both at D in
    {4,5,6,7}, overlapping the admissible D<=5 range so the two calibrations
    can be cross-checked where both exist. Report the cascade excess over
    the null per D, and the null's own D-dependence separately, which is the
    quantity an extrapolated baseline would have hidden.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Read of GOAL-SIG-001's next_action (SIG-D6-NULL-RECAL-v2, deferred)
      and H-SIG-001; grep for 'null recalibration', 'D>=6', 'matched
      shape', 'degree-dependent null'.
    results: >-
      The lane names D>=6 null recalibration as its blocking next action
      and marks it deferred, so the NEED is established program state. No
      record specifies the null's construction as matched-shape-random-at-
      each-D, and none measures the null's own degree dependence as a
      separate reported quantity.
    verdict: >-
      ADAPTATION. The lane already owes this null; the contribution is the
      construction that avoids the extrapolation trap and the separate
      reporting of the null's degree dependence.

  object_first_candidate:
    tracked_object: >-
      THE SYZYGY CASCADE STATISTIC, with the NULL'S CONSTRUCTION promoted
      to the audited variable rather than treated as a background choice.
    lossiness: >-
      Not a propagation object; this is a baseline-calibration control
      inside an existing lane.
    propagation: >-
      Not applicable.
    survival_score: >-
      Survives as far as matched-shape random systems are generable and
      solvable at D>=6, which is the binding compute constraint and may
      cap the reachable D.

  null_object_control: >-
    THE RECORD IS ITSELF A NULL SPECIFICATION, so its own controls are
    second order and are stated to prevent circularity. CONTROL 1 -- overlap
    at D<=5, where the new null must agree with the lane's admitted
    baseline; disagreement means one of the two is wrong and the lane must
    resolve it before proceeding. CONTROL 2 -- a PLANTED CASCADE in a random
    system, which the statistic must detect, proving the measurement can see
    the structure it is looking for. CONTROL 3 -- two independently seeded
    null generations at the same D, bounding generation variance.

  discriminated_from:
    - >-
        The lane's existing D<=5 baseline. NOT A REPLACEMENT: that
        baseline stays admissible and is the overlap check. This record
        extends the calibration to D>=6 by independent generation rather
        than by extrapolating it.
    - >-
        IDEA-20260815-05c761 (the three-degree gap record in this batch).
        DIFFERENT QUANTITY: that measures which degree is being reported;
        this measures a cascade statistic against a null. They share the
        SDEG/SIG instrumentation and should reuse one frozen system
        generator.

  assumptions:
    - >-
        Matched-shape random systems are solvable at D>=6 within budget.
        IF NOT, the lane's blocking question is unanswerable by this route
        and the record must say so rather than substitute an extrapolated
        null.
    - >-
        'Matched shape' is fully specifiable -- variable count, degree
        sequence, sparsity, field. Any unmatched dimension is a confound
        and must be enumerated in the run record.

  predictions:
    - metric: >-
        new null versus admitted baseline at D<=5
      direction: different
      minimum_effect: >-
        FORCED AGREEMENT within generation variance. Disagreement blocks
        the lane until resolved and is itself an important finding about
        the existing baseline.
    - metric: >-
        planted cascade detection in a random system
      direction: different
      minimum_effect: >-
        FORCED DETECTED. A statistic that cannot see a planted cascade
        cannot report its absence.
    - metric: >-
        null's own cascade statistic as D grows
      direction: different
      minimum_effect: >-
        No direction pre-committed; this is the quantity an extrapolated
        baseline would have hidden and reporting it is the record's
        point.
    - metric: >-
        cascade excess over the matched null at D>=6
      direction: different
      minimum_effect: >-
        Decides the lane: an excess surviving the null keeps the cascade
        admissible, and no excess bounds it at the tested scope.

  minimal_test:
    design: >-
      D = 5 and D = 6 only, one curve, with the overlap check at D = 5 and
      the planted-cascade control. That is the minimum that separates the
      cascade from a degree-dependent null and it directly discharges the
      lane's blocking obligation.
    controls:
      - >-
          Overlap agreement at D<=5 with the admitted baseline.
      - >-
          Planted cascade in a random system, which must be detected.
      - >-
          Two independent null seeds at each D, bounding generation
          variance.
      - >-
          Every unmatched shape dimension enumerated explicitly.
    required_metrics:
      - >-
          Cascade statistic on Semaev and on null, per D, paired.
      - >-
          Null's own D-dependence, reported separately.
      - >-
          Overlap agreement at D<=5 with interval.
      - >-
          Planted-cascade detection outcome.
      - >-
          Artifact manifest with hashes and rebuild receipt.

  falsification_conditions:
    - >-
        The new null disagrees with the admitted D<=5 baseline. One is
        wrong; the lane is blocked until resolved.
    - >-
        The planted cascade is not detected. The statistic is not fit for
        purpose and no negative from it is admissible.
    - >-
        D>=6 systems are not solvable in budget. The route is unavailable;
        report rather than extrapolate.
    - >-
        Cascade excess vanishes at D>=6 against the matched null. The
        cascade is bounded at the tested scope -- the lane's decision,
        reached honestly.

  confounders:
    - >-
        EXTRAPOLATION CONTAMINATION, the exact failure this record exists
        to prevent: any null parameter fitted using D<=5 data reintroduces
        the confound. Null generation must be independent at each D and
        that independence must be auditable from the run record.
    - >-
        SHAPE MISMATCH: an unmatched sparsity or degree-sequence dimension
        makes the null easier or harder for reasons unrelated to curve
        structure.
    - >-
        SOLVER TIMEOUT ASYMMETRY: if the null solves and the Semaev system
        times out at D = 6, the comparison is between a measurement and a
        non-measurement, and per AGENTS.md rule 3 the timeout is not
        negative evidence.

  interpretation_limits:
    - >-
        Calibrates a baseline; decides the cascade question only within
        the tested D range and curve.
    - >-
        No exponent and no attack; the cascade's exploitability, if it
        survives, needs its own cost table.
    - >-
        A bounded verdict is scoped to the tested D and does not close the
        lane at higher degrees.

  heuristic_assumptions:
    - id: HEUR-SIG-NULL-1
      statement: >-
        A random system matched on variable count, degree sequence,
        sparsity and field is an admissible null for the Semaev cascade
        statistic at every tested D.
      rigorous_support: >-
        The rigorous ingredient is that the cascade statistic is defined
        from the ideal's syzygy structure, which for a generic system of
        matched shape is governed by the Koszul complex and is therefore
        predictable independently of any curve. THE GAP: matched shape
        does not imply matched syzygy behaviour, because the Semaev
        system's structure is not generic -- that non-genericity is the
        lane's whole subject -- so admissibility of the null is assumed,
        not proved.
      falsification_condition: >-
        The planted-cascade control failing, or the null exhibiting
        cascade structure that shape alone cannot explain.
      validation_plan: >-
        SAMPLE: >= 20 independently seeded nulls per D, D in {4,5,6}.
        COMPARISON: null statistic distribution against the Koszul
        prediction where computable. TAIL CHECK: the nulls with the
        largest cascade statistic, checked for accidental structure from
        the generator's randomness. TRANSFER ASSUMPTION: none beyond the
        tested D.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Stated explicitly rather than omitted, as the
      ideation contract requires. Cost is dominated by solving matched-
      shape random systems at D>=6, which is the lane's existing binding
      constraint and the reason the work was deferred.
    memory_exponent: >-
      Groebner-dominated, same profile as the lane's existing runs.
    best_known: >-
      The incumbent is the lane's admitted D<=5 baseline, which this
      record extends rather than improves.
    hidden_overhead: >-
      Null generation at D>=6 may cost as much as the Semaev measurement
      itself, doubling the lane's compute for the blocking step.
    tradeoff_note: >-
      An independently generated null costs compute and buys freedom from
      the extrapolation confound. An extrapolated null is nearly free and
      cannot answer the question.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed). As a
    baseline: extends the lane's own D<=5 baseline, which dominates it
    wherever both apply. As methodology: matched-shape nulls are standard
    practice and dominated by the general experimental-design literature.
    Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a construction for the D>=6
    null the lane names as its blocking obligation, built to avoid the
    extrapolation trap; the null's own degree dependence reported as a
    separate quantity for the first time; and an overlap check that would
    detect an error in the lane's existing baseline.

  estimated_cost:
    implementation: medium
    compute: high
  recommended_priority: high

  honest_prior_of_survival: >-
    0.5 that D=6 matched-shape systems solve within a reasonable budget,
    which is the binding risk and the reason the lane deferred this. 0.85
    that the overlap check at D<=5 agrees. 0.9 that a planted cascade is
    detectable. 0.4 that a cascade excess survives at D=6, which would keep
    the lane open.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
