idea:
  id: IDEA-20260809-aaf81c
  question_id: RQ-XEDN-004
  added: '2026-08-09'
  title: The XEDN lane was completed three times on one statistic at one fixed set of four primes,
    each goal a single-parameter degree raise closing on one batch, and its own post-closure work
    -- six hypotheses and six contracts filed 2026-08-05 -- has no owning goal because all three
    questions are closed
  class: control
  claim: 'The three completed goals measure the SAME primary metric -- max_|coeff|(p) over verified
    Mordell-Weil relations, at the SAME four primes {7, 13, 19, 31} -- and each returns 1 with
    slope 0, differing only in one degree parameter per goal (XEDN-001 non-isotrivial a != 0 with
    mu_3 absent; XEDN-002 deg a <= 4; XEDN-003 joint deg x <= 3 with deg b = 10). Each was budgeted
    maximum_batches = 2 and XEDN-001 and XEDN-002 completed on BATCH-001, i.e. one experiment
    each. The completion bar also MOVED between them: XEDN-001 carried two criteria including
    ''Every structural claim ... separated from the numerical coefficient measurement, with independent
    review and red-team objections archived''; XEDN-002 carries ONE criterion and drops the separation
    and red-team-archival clause; XEDN-003 restores both and adds the quorum. All three next_actions
    end the lane -- XEDN-003''s is ''None.'' TWO ABSENCES FOLLOW. (1) No record asks what the
    three completions JOINTLY license: each decision''s claim_boundary is scrupulously narrow
    (''Not B2; not crypto-scale''), so the transfer question the lane was created for -- how far
    past the isotrivial window the coefficient bound actually goes, and what would falsify it
    -- is stated in no record; each goal only says the previous window''s bound survived one more
    parameter step. (2) No owner for the post-closure work: six H-XEDN-* hypotheses sit at status
    proposed on RQ-XEDN-002/003/004 and six EXP-XEDN-* contracts at review_required with no runs,
    none appearing in any goal record. This is not execution debt in the dispatch sense -- there
    is no dispatcher, because the lane has no live goal.'
  mechanism: 'STATE THE LANE''S JOINT CLAIM ONCE, AS AN OBJECT -- across the three completed windows,
    what is the largest degree region in which inf-norm-1 relations are established, exactly which
    region the mu_3-free evidence covers, and what a SINGLE falsifying observation would be. Then
    check the one thing three goals never varied. Every completion used the same four primes {7,
    13, 19, 31}, and DEC-20260730-002 already records n_rel = 2 at p = 31 as sparse; so the cheapest
    control is NOT another degree raise but a fifth and sixth prime with the degree window held
    FIXED, which separates ''the bound is a property of the degree shape'' from ''the bound is
    a property of small p''. Do that before any further degree raise, with an explicit prediction
    registered first. Alongside it, one Coordinator act reported and not taken: either open a
    successor goal to own the six pending hypotheses and six contracts, or record explicitly that
    the lane is retired and they are withdrawn -- the current state asserts neither.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - 'The chain was self-propagating in a way that hid the absence: XEDN-001''s next_action named
      RT-XEDN-004 and GOAL-XEDN-002 became it; XEDN-002 named RT-XEDN-005 and GOAL-XEDN-003 became
      it; when XEDN-003 named no follow-up the mechanism that had been creating successors simply
      stopped, and the 2026-08-05 ideation batch filed proposals against questions closed ten
      days earlier without anything checking that their owning goals were still open. DEC-20260730-002''s
      next_actions field is an empty list, and the two XEDN closing-decision bodies parked in
      ledger/corrections/ each end with next_actions: [] as well. Verified: no goal record and
      no proposal among 459 frames the lane''s cumulative claim, and a title scan for a joint
      claim or a prime-axis control returns zero.'
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: another degree raise, which
      is what all three completions did. The object is the LANE''S JOINT CLAIM and the parameter
      it never varied.'
    tracked_object: The largest degree region in which infinity-norm-1 Mordell-Weil relations
      are established, together with the prime set over which that region was measured.
    one_step_propagation_rule: Each completed window extends the degree region; the prime set
      has not moved across any of them, so the joint claim's dependence on p is untested by construction.
    newness_score: Nil as mathematics. The content is that three completions raised one parameter
      and held another fixed at four values, and no record states what the three jointly establish.
  lossy_projection_identifiability_audit:
    projection: three completed goals -> one joint claim with its true parameter region.
    what_is_discarded: The per-goal narratives; only the joint region is retained.
    is_it_only_a_change_of_coordinates: 'NO -- the joint statement does not exist in any record.
      Honest caveat: stating a joint claim creates no new evidence; it makes the existing evidence
      auditable and falsifiable as one object.'
    mirror_failure_check: CHECKED. The joint claim must admit a single falsifying observation,
      and the record's whole point is to name it. A claim with no such observation would be the
      failure mode.
  null_object_control:
    primary_null: A FIFTH AND SIXTH PRIME WITH THE DEGREE WINDOW HELD FIXED is the control, and
      it is the one thing three goals never varied. This separates 'the bound is a property of
      the degree shape' from 'the bound is a property of small p'. Register the prediction before
      running.
    secondary_nulls:
    - DEC-20260730-002 already records rank_rel = 2 at p = 31 as sparse, which is the signal that
      p may be doing work the degree window is being credited with.
    - Do the prime extension BEFORE any further degree raise.
  assumptions: []
  predictions:
  - metric: infinity-norm-1 relation existence at two new primes with the degree window fixed
    direction: different
    minimum_effect: Absence at a larger prime would show the bound is a small-p property, not
      a degree-shape property, and would rescope three completed goals at once.
  minimal_test:
    design: State the lane's joint claim as one object with its exact region and its single falsifier;
      then run the fifth and sixth primes at fixed degree window with the prediction registered
      first.
    controls:
    - two new primes at fixed degree window
    - pre-registered prediction
    - DEC-20260730-002's p = 31 sparsity observation as the motivating signal
    required_metrics:
    - joint claim statement with exact region
    - relation existence at the new primes
    - whether the mu_3-free evidence covers the stated region
  falsification_conditions:
  - 'Relations persist at the new primes: the bound is a degree-shape property, the joint claim
    holds over a wider prime set, and three completions are strengthened rather than rescoped.'
  - 'Relations vanish at a larger prime: the bound is a small-p property and the joint claim must
    be rescoped -- the outcome that would matter most.'
  - 'The joint claim cannot be stated because the three goals'' regions do not overlap coherently:
    that is itself the finding about the lane.'
  confounders:
  - Density effects at larger p may block enumeration for reasons unrelated to the mathematics;
    the corpus already records a p = 31 density block, so a null at a larger prime must be distinguished
    from a search failure.
  - Four primes is a small base for any claim about p-dependence.
  - The mu_3-free evidence covers a narrower region than the mu_3 evidence and the joint statement
    must say which region each covers.
  interpretation_limits:
  - Toy scale. No cryptographic claim.
  - Retiring or retargeting the lane, and any change to the three completion records, are Coordinator
    acts and are reported, not taken.
  heuristic_assumptions:
  - id: HEUR-XJNT-1
    statement: Relation existence at two further primes is informative about p-dependence generally.
    rigorous_support: None; two primes is a weak base, and the record says so rather than implying
      otherwise.
    validation_plan: Report the result as a two-point extension, never as a p-independence claim.
  target_complexity:
    time_exponent: n/a -- structural existence question, not a cost claim
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: The xedni lifting route carries no cost claim in this program.
  dominated_by: n/a (no attack claimed; joint-claim statement plus a prime-set control)
  sota_delta: ZERO on every attack axis; no attack is proposed. Turns three narrow scoped supports
    into one statement a reader can evaluate, and tests the single axis the lane held constant
    through all three completions. Either the bound survives at larger p, materially strengthening
    the transfer reading, or it does not, which would scope all three completions at once -- and
    either outcome is cheap and toy-scale with no attack claim.
  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 0.85 that the joint claim is statable from the three completed goals.
    0.6 that relations persist at the new primes, strengthening the lane. 0.25 that a larger prime
    blocks on density rather than mathematics, making the test inconclusive. 0.15 that relations
    genuinely vanish, which would rescope three completions.
