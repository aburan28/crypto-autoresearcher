  discriminated_from: H-FBG-001 was rejected_scoped for structured factor-base GEOMETRIES
    chosen to raise YIELD - refuted on sight by KN-FIND-007. This record does not claim any
    yield advantage and predicts exactly the conservation mean as a forced check; its axis
