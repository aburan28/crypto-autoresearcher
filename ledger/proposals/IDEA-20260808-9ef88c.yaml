idea:
  id: IDEA-20260808-9ef88c
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-RELN-001
  goal_id: GOAL-RELN-001
  title: A multiplicative-coset factor base makes the decomposition Macaulay operator an exact
    multilevel twisted circulant, giving the lane its first NON-semi-regular calibration point
    with a derivable solving degree of exactly B-1 and cost O~(B^m) - which still loses to
    meet-in-the-middle, and that gap is the honest finding
  class: representation
  claim: 'Take B | p-1 and V = c * mu_B, the coset of the order-B multiplicative subgroup.
    Then f_V(x) = x^B - c^B is a BINOMIAL, the quotient ring R = F_p[x_1..x_m] / (x_i^B -
    c^B) is the group algebra of (Z/B)^m twisted by a character, and reduction of any polynomial
    modulo the membership ideal is exponent reduction mod B. CONSEQUENCES, ALL DERIVABLE:
    (i) the Groebner basis of the membership ideal is the generating set itself (a lattice
    ideal), so the solving degree of I_R is at most B-1 in each variable, i.e. exactly the
    top degree of R and NOT the semi-regular ceil((m(B-1)+D_S)/2); (ii) multiplication by
    the reduced Semaev polynomial S~ is a multilevel twisted circulant on R, diagonalised
    by an m-dimensional DFT of size B^m, so the entire solution set is obtained by evaluating
    S~ at all B^m grid points in O~(B^m) operations; (iii) S~ has at most 2^{m(m-1)} nonzero
    terms, a CONSTANT in B, so the evaluation is genuinely O~(B^m) and not O(#terms * B^m).
    CLAIM: this exhibits a factor base whose algebraic solving degree collapses from Theta(mB/2)
    to B-1 and whose cost collapses from B^{m omega} to O~(B^m) - a genuine exponent movement
    WITHIN the algebraic oracle, theta_alg from m*omega to m - and it is still worse than
    MITM at theta = ceil(m/2), so it does not reach E2-02''s threshold theta < (m-1)/2. FILING
    IT ANYWAY IS THE POINT: the lane has no example of a factor base that violates the semi-regular
    null in a computable way, and without one every measured deficit is uncalibrated.'
  mechanism: 'KN-FIND-007 kills mean yield as a design lever and names the surviving axes:
    coverage, relation rank, recognizability and SOLVE COST. Nobody in this corpus has proposed
    a factor base designed to minimise solve cost. The multiplicative coset is the natural
    candidate because its vanishing ideal is binomial, and binomial ideals are the one family
    where the Groebner basis is free and the quotient carries a group structure that turns
    elimination into a Fourier transform. The mechanism is not a heuristic: it is the standard
    fact that a lattice ideal has itself as a Groebner basis and that the group algebra of
    an abelian group is diagonalised by its character table.'
  why_not_a_renamed_known_approach: 'Nearest in-corpus item: catalogue entry A2-10, "designed
    factor-base polynomial - does compositional structure in V(x) lower the solving degree",
    which proposes COMPOSITIONAL structure f_V = g o h. This record uses MULTIPLICATIVE structure,
    which is not a composition, and derives an exact diagonalisation rather than asking whether
    the degree drops. Nearest external: sparse/toric elimination and the BKK line already
    measured in this corpus (KN-FIND-8f2c90 / 2a8b7e / c7d31e), which gives constant factors
    on the Semaev polytope; this is not a polytope refinement but a change of the MEMBERSHIP
    ideal to one whose quotient has a group structure, and it is offered as a building block
    for an exponent claim rather than as a constant factor, exactly as the slice brief requires.'
  predictions:
  - observable: measured solving degree of I_R with V a multiplicative coset
    metric: d_solve
    predicted: '<= B-1 at every cell and, in the graded sense, equal to the top degree of
      the reduced representation. Contrast: with V random of the same size, d_solve tracks
      E2-01''s ceil((m(B-1)+D_S)/2) ~ mB/2. THE RATIO OF THE TWO IS THE DELIVERABLE and is
      predicted to be about m/2, growing in m.'
  - observable: operation count of the FFT solve versus a graded solve
    metric: counted field operations at B in {8,16,32}, m in {2,3}, B | p-1
    predicted: FFT arm scales as B^m log B; graded arm as B^{m omega}. Log-log slopes m versus
      m*omega, separable at these sizes.
  - observable: relations per unit cost against a random base of the same size
    metric: relations / field operations
    predicted: 'IDENTICAL MEAN YIELD by KN-FIND-007 (this is a forced check, not a hope: any
      implementation reporting a yield advantage for the coset base has a bug). The advantage,
      if any, is entirely in cost per solve, and the record predicts it is a factor B^{m(omega-1)}
      - large, and still insufficient.'
  minimal_test: 'Stage 0 (derivation, zero compute): write the twisted-circulant structure
    explicitly for m = 2 and verify by hand on a tiny cell (p = 1009, B = 8 or 16 dividing
    p-1 = 1008 = 16*63; B = 16 works). Stage 1: implement both arms - multipoint evaluation
    of S~ over the grid, and a graded exact-rank solve - at B in {8,16}, m in {2,3}, and compare
    d_solve and operation counts. Stage 2: place the resulting theta_alg = m into E2-02''s
    table and report the IC exponent it implies (N^{m/(m-1)} at theta = m > 2), which is worse
    than enumeration - state that plainly.'
  controls:
  - YIELD CONTROL (forced by KN-FIND-007): mean decompositions per target must equal C(B+m-1,m)/N
      for the coset base exactly as for a random base. A measured advantage is an implementation
      error, and this is the cheapest bug detector available.
  - COVERAGE CONTROL: multiplicative structure creates repeated sums, and KN-FIND-007 records
      that additive structure LOWERS coverage at matched size (the small-multiples base collapsed
      to a coverage ratio of 0.0021). Coverage must be measured, not assumed, and a coverage
      collapse can wipe out the solve-cost gain.
  - RANDOM-BASE ARM at the same B for the degree comparison.
  - DL-CIRCULARITY GATE: the character transform must be over the MULTIPLICATIVE group of
      F_p and must never require the discrete logarithm in E(F_p). Any step that does is circular
      (KN-FIND-c93d45) and voids the arm.
  confounders:
  - B must divide p-1, so the B-ladder is constrained by the prime; cells must be chosen so
    that B ranges over divisors, and the ladder is coarser than for a random base.
  - A coset of a multiplicative subgroup is a highly structured additive set; relation RANK
    may collapse even where yield does not, and rank is not captured by conservation.
  - The 2^{m(m-1)} term bound is an upper bound on the term count of S_{m+1}; the actual reduced
    term count must be measured, and if it grows with B the O~(B^m) claim fails.
  - m-dimensional DFT over F_p requires suitable roots of unity; the implementation must record
    which transform it used and its actual cost.
  falsification_conditions:
  - Measured d_solve for the coset base is not below the random-base value at matched B. The
    diagonalisation argument is wrong or the implementation is not exploiting it.
  - The reduced Semaev polynomial's term count grows with B. The O~(B^m) claim fails and the
    record's headline collapses to "no better than enumeration".
  - Coverage for the coset base collapses so far that relations per solve drop below the random
    base by more than the cost saving. The design lever is net negative, which is a legitimate
    and useful negative.
  interpretation_limits: This is a CALIBRATION POINT, not an attack. It does not beat MITM,
    does not beat rho, and its author says so in the claim rather than in a footnote. Toy
    tier for the measured arm. It closes nothing; it supplies the lane with one factor base
    whose algebraic behaviour is known exactly, so that measured deficits elsewhere have a
    non-semi-regular reference.
  assumptions:
  - B | p-1 and c chosen so V has exactly B elements, none of them roots of f.
  - Exact arithmetic; DFT over F_p with an available B-th root of unity.
  heuristic_assumptions:
  - id: HA-1
    statement: The number of nonzero terms of the reduced Semaev polynomial S~ in the quotient
      ring is bounded by a constant depending only on m, uniformly in B, so the multipoint
      evaluation costs O~(B^m).
    rigorous_ingredient: 'Rigorous: deg_{x_i} S_{m+1} = 2^{m-1}, so before reduction the term
      count is at most (2^{m-1}+1)^m, independent of B. Reduction mod x_i^B - c^B cannot increase
      the term count when B > 2^{m-1}.'
    distribution_imitated: None; a degree bound, not a distribution.
    validation_route: Count terms directly at m in {2,3,4} and B in {8,16,32} and confirm
      no growth in B. Cheap, exact, and decisive. TOY SCALE but the quantity is B-independent
      by the rigorous half, so the toy check is a plumbing check rather than an extrapolation.
    tail_checks: Report the maximum term count observed across cells against (2^{m-1}+1)^m.
  - id: HA-2
    statement: Mean decomposition yield for the coset base equals the conservation mean, and
      coverage does not collapse by more than a factor that the solve-cost saving covers.
    rigorous_ingredient: KN-FIND-007 - the mean is exact for every base; only coverage is
      free, and it is bounded above by min(1, mean).
    distribution_imitated: The balls-in-bins allocation whose coverage is 1 - e^{-mu} in the
      unstructured case.
    validation_route: Exhaustive enumeration of V^m at B <= 32, m <= 3 on toy curves, reporting
      mean (must match exactly) and coverage (free). Compare coverage against 1 - e^{-mu}
      and against a matched random base. TOY SCALE.
    tail_checks: Report the concentration statistic (max targets-per-target count over mean);
      KN-FIND-007 measured 1224x for a structured base, so a large value here is the expected
      failure mode and must be reported even if it kills the idea.
  target_complexity:
    time_exponent: theta_alg drops from m*omega (E2-01 null) to m for this base. Fed into
      E2-02 with theta = m > 2, the IC exponent is N^{m/(m-1)} > N^1 - WORSE than enumeration's
      N^1 and far from rho's N^{1/2}. Stated as a negative.
    memory_exponent: B^m for the grid, i.e. N^{m/(m-1)} at the feasible B; prohibitive and
      disclosed.
    best_known_baseline: MITM at theta = ceil(m/2) dominates this on both time and memory
      at every m >= 2.
    hidden_overhead_disclosure: The log factor in O~(B^m) is an m-dimensional FFT with its
      own constants; the term-count bound (2^{m-1}+1)^m is exponential in m^2 and is a real
      cost at m >= 5.
    time_memory_tradeoff: The grid evaluation can be blocked to trade memory for recomputation
      (evaluate on B^{m-1} slices), giving time B^m and memory B^{m-1}; that variant is stated
      but not costed.
  sota_delta: Zero on attack axes, and explicitly negative against enumeration. The deliverable
    is a factor of B^{m(omega-1)} in the ALGEBRAIC oracle - the first computable violation
    of the semi-regular null in this lane - plus the honest placement showing it is still
    two families away from mattering.
  dominated_by: Dominated on time and memory by target-keyed MITM (B^{ceil(m/2)}, B^{floor(m/2)}),
    by plain enumeration (B^{m-1}, O(B)), by Pollard rho (sqrt(N), O(1)) and by BSGS. Not
    dominated on the narrow axis "known exact solving degree for a nontrivial factor base",
    where the corpus currently has nothing. Every frontier row was checked; the domination
    is total on the attack axes and is stated rather than hidden.
  estimated_cost: Implementation medium (multipoint evaluation over a multiplicative grid);
    compute low.
  recommended_priority: medium
  honest_prior_of_survival: 0.85 that the exact solving-degree collapse is confirmed (it follows
    from the binomial ideal being its own Groebner basis). 0.6 that coverage does not collapse
    enough to make the base useless in practice. 0.02 that anything here approaches an attack
    - and the record is written so that outcome is not needed for it to be worth filing.
  novelty_status: screened
  novelty_class: adaptation
  novelty_screen: CATALOGUE_TITLES A2-10 (compositional f_V) read and discriminated; KN-FIND-007
    in full; KN-FIND-c93d45 (DL circularity) at summary level; KN-FIND-8f2c90 / 2a8b7e / c7d31e
