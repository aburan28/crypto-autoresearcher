idea:
  id: IDEA-20260809-b9e9cc
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ARGON-141710
  goal_id: GOAL-ARGON-001
  title: >-
    Parallelism splits the graph into lanes with limited cross-lane dependency —
    measure what that does to depth robustness at deployed p
  class: mechanism
  claim: >-
    The parallelism parameter partitions memory into lanes that synchronize only
    at segment boundaries, which changes the graph's connectivity in a way the
    single-lane analysis does not describe. The claim is that depth-reducing sets
    become cheaper as p grows, that the effect is measurable on the actual graph,
    and that it is a distinct mechanism from the pure memory reduction that p
    already implies per lane.
  mechanism: >-
    Build the DAG at several p with total memory held fixed, measure the
    depth-reducing set curve at each, and separate the connectivity effect from
    the per-lane memory effect by also measuring at fixed per-lane memory.
  why_not_a_renamed_known_approach: >-
    The lane structure is specified and its synchronization points are documented.
    Measuring its effect on the graph quantity that the security argument depends
    on — with the two confounded effects separated by design — is what does not
    exist and what a deployment choosing p should have.
  predictions:
  - observable: depth-reducing set size versus p at fixed total memory
    metric: curve
    predicted: Decreasing in p. A flat curve would mean lane structure does not weaken the graph and would simplify parameter choice considerably.
  - observable: separation of connectivity and memory effects
    metric: comparison of fixed-total and fixed-per-lane sweeps
    predicted: Both effects present and distinguishable; if they cannot be separated, the record reports the confound rather than attributing the effect.
  minimal_test: >-
    Build and measure the DAG at three values of p under both normalizations, at
    parameters small enough for exact computation, and extend with the declared
    approximation to one deployed setting.
  controls:
  - 'CONSTRUCTION VALIDATION against the instrumented access pattern at every p, since lane synchronization is the most likely place for a symbolic model to diverge from the implementation.'
  - 'SINGLE-LANE ANCHOR: at p equal to one the measurements must match those of IDEA-20260809-a915ea exactly.'
  falsification_conditions:
  - The symbolic model diverges from the instrumented pattern at p greater than one.
  - The two effects cannot be separated under either normalization.
  interpretation_limits: >-
    Graph structure at measurable parameters, extended by a declared
    approximation. No claim about the safety of any p is made.
  sota_delta: 'Delta: a parameter-specific structural effect measured and separated from its confound, where the design literature treats lanes as a performance feature.'
  dominated_by: Downstream of IDEA-20260809-a915ea; not dominated by any corpus record.
  estimated_cost: Implementation small on top of the DAG builder; compute moderate.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for lanes / parallelism in memory-hard functions: no records. WEB NOT CHECKED.'
  source_refs:
  - RFC 9106 -- REQUIRED READ.
