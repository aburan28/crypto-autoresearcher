idea:
  id: IDEA-20260805-2d2c41
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  added: '2026-08-05'
  title: >-
    Heuristic 1 is stated for a uniformly random curve, and every route that
    lowers the degree threshold conditions on a rare event: a smoothness
    conditioning audit on values of a ternary quadratic form, with Remark 1's
    multiplicity bounded to exactly B^{3/2} along the way
  class: control

  claim: >-
    TWO ASSUMPTIONS SIT UNDER THIS CAMPAIGN'S ARITHMETIC AND NEITHER HAS BEEN
    STATED AS A HEURISTIC ANYWHERE IN THE LEDGER.
    (A) CONDITIONING. Heuristic 1 of the frozen source (line 69) asserts that
    the degree of the smallest isogeny E -> E^{(p)} is B-smooth with the
    probability a uniformly random integer of its size would have, for E
    UNIFORMLY RANDOM. Every route that lowers the admitted degree threshold to
    T = p^theta with theta < 1/3 -- which is what IDEA-20260805-250e50 prices
    and what lever L4 aims at -- works on curves CONDITIONED on the rare event
    delta_E <= T, of probability p^{3theta/2 - 1/2}. Conditioning changes the
    object twice over: delta_E is no longer a random integer of size T but the
    minimum of a ternary quadratic form, and integers represented by a fixed
    ternary form satisfy local conditions at the primes dividing its
    discriminant. THE SMOOTHNESS OF SUCH INTEGERS IS NOT THE SMOOTHNESS OF
    RANDOM INTEGERS, AND THE BIAS COULD GO EITHER WAY. If the bias is a bounded
    factor it is an o(1) and everything stands. If it grows with p it is an
    exponent, and it must be added to every cost this campaign has written.
    (B) MULTIPLICITY, BOUNDED. Remark 1 of the frozen source (line 191) observes
    that there are generally multiple small isogenies E -> E^{(p)} and that it
    suffices for any one to be smooth, calling this practically relevant and
    absorbed in the asymptotics. The count is derivable and this record derives
    it: the number of vectors of degree <= T in a rank-3 lattice of determinant
    asymptotic to p is ~ c T^{3/2} p^{-1/2}, so at the algorithm's operating
    scale T = X^2 = B(p/2)^{1/3} the multiplicity is
    ~ c B^{3/2} (p/2)^{1/2} p^{-1/2} = O(B^{3/2}). AT THE SOURCE'S OWN
    PARAMETER B = e^{(1/3) sqrt(log(p/2))} THAT IS EXACTLY
    exp((1/2) sqrt(log(p/2))) = p^{o(1)}. Remark 1's phenomenon therefore
    cannot carry an exponent -- confirming F4's consequence from a second and
    independent direction -- and its practical size is a computable number
    rather than an unquantified caveat.
    BOTH HALVES ARE MEASURABLE ON DATA THIS CAMPAIGN HAS ALREADY COMMITTED and
    neither has been measured.

  object_first_candidate:
    tracked_object: >-
      THE INTEGER delta_E, followed not as a size but as a VALUE OF A TERNARY
      QUADRATIC FORM -- i.e. carrying its factorisation type and its local
      conditions. Every prior record in this campaign has tracked delta_E's
      magnitude (the counting function N(T,p), the descent label, the degree
      bound). Nobody has tracked its ARITHMETIC. The distinction is the whole
      proposal: a smoothness heuristic is a statement about factorisation, and
      the campaign has only ever measured size.
    established_families_off_limits: >-
      OFF-LIMITS AS THE PRIMARY LENS: (a) claw finding and list construction;
      (b) degree bounds (L1, closed in scope); (c) descent geometry (L4) -- this
      proposal touches the same delta_E values but asks a different question of
      them; (d) memory tradeoffs (L5); (e) improving the success probability,
      which is the family this proposal partly CLOSES rather than joins.
    newness_score: >-
      Heuristic 1 itself is the frozen source's and its validation at
      cryptographic scale is the source's own Section 4.2. What is absent
      everywhere in this campaign is the CONDITIONED version: no ledger record
      states a heuristic about smoothness after conditioning on delta_E <= T,
      and the session's angle brief records that this corpus has no heuristic
      record type at all, so the two-record rule is unenforced. The
      multiplicity bound B^{3/2} likewise does not appear -- the BATCH-001
      audit notes only that D1 counts CURVES rather than ISOGENIES, so
      multiplicity does not weaken D1, which is a different (and correct)
      observation.
    testability_score: >-
      High and cheap. The committed runs contain real in-session delta_E labels
      at four primes; factoring integers of that size is instantaneous in pure
      Python; the matched null is a draw of uniform integers on the same range.
      What is NOT reachable is cryptographic scale, and the source's own
      Section 4.2 experiments (100,000 samples at log2 p ~ 250 via the Deuring
      correspondence) are the template this campaign cannot currently execute
      because it has no quaternion arithmetic.
    survival_score: >-
      The multiplicity bound survives as arithmetic. The conditioning question
      survives as a numbered heuristic whatever the measurement says; what is
      at risk is only the DIRECTION of the bias.

  mechanism: >-
    DERIVED HERE FROM THE FROZEN SOURCE AND THIS CAMPAIGN'S COMMITTED
    DERIVATION D1.

    (1) THE LATTICE-POINT COUNT. The governing object is the rank-3 trace-zero
    sublattice R of Hom(E, E^{(p)}) with the degree form, of discriminant p/4
    (EV-SSIQ-e43afd O-6, from AOV section 5.1; the trace-vanishing mechanism is
    re-derived in IDEA-20260805-e7ee4a). The number of vectors with degree <= T
    is the number of lattice points in a ternary ellipsoid of volume
    (4 pi/3) T^{3/2} / sqrt(det), i.e.
      M(T) = (8 pi/3) T^{3/2} p^{-1/2} (1 + o(1)),
    valid while the error term O(T) of the ellipsoid count is dominated, i.e.
    for T^{1/2} >> p^{1/2} / T ... equivalently T >> p^{1/3}, and by the
    first-moment bound above it in the opposite regime. AT T = (p/2)^{1/3} this
    gives M = (8 pi/3) 2^{-1/2} = 5.92..., i.e. O(1) vectors: consistent with
    delta_E ~ p^{1/3} and with the two-sided pinch p/4 <= N_1 N_2 N_3 <= p/2.
    THE CONSTANT IS OFFERED AS A FORCED VALUE TO BE CHECKED, not asserted: the
    normalisation of "discriminant p/4" is a convention (the BATCH-001 audit
    records p/16 or p/4 "according to a projection index of 1 or 2"), and a
    factor of 2 in the determinant moves the constant by sqrt(2). The EXPONENT
    3/2 does not move and is the load-bearing part.

    (2) REMARK 1, BOUNDED. Algorithm 2 at parameter B lists isogenies of degree
    up to X = B^{1/2}(p/2)^{1/6}, and succeeds if ANY isogeny E -> E^{(p)} of
    degree at most X^2 = B(p/2)^{1/3} is B-smooth and cyclic. By (1) the number
    of candidates is
      M(X^2) = (8 pi/3) B^{3/2} (p/2)^{1/2} p^{-1/2} = (8 pi/3) 2^{-1/2} B^{3/2}.
    With the source's B = e^{(1/3) sqrt(log(p/2))} (line 200) this is
    exp((1/2) sqrt(log(p/2))) up to a constant -- SUPERPOLYNOMIAL IN log p AND
    p^{o(1)}. So Remark 1's phenomenon multiplies the per-attempt success
    probability by at most B^{3/2} = p^{o(1)} and CANNOT MOVE AN EXPONENT. That
    reproduces, from a second direction, the goal record's F4 consequence and
    its recorded NARROWING (that the whiteboard refutation is correct about the
    exponent and would overstate if carried to practical impact, because
    Remark 1 calls the phenomenon practically relevant). THE NUMBER B^{3/2} IS
    EXACTLY THE PRACTICAL SIZE, and it is computable at the source's own
    parameter sets: at log2 p = 256, sqrt(log(p/2)) = sqrt(177.4) = 13.32, so
    B ~ e^{4.44} = 85 and B^{3/2} ~ 785 -- a factor of a few hundred, not a
    power of p. THAT COMPUTATION IS A PREDICTION OF THIS RECORD, TO BE
    RECHECKED, not a measurement.
    ONE SUBTLETY THAT MUST NOT BE DROPPED: Remark 1 says "multiple small
    (NON-CYCLIC) isogenies", while Lemma 3.4 needs cyclic ones (its proof
    derives cyclicity from minimality). A non-cyclic isogeny factors as
    phi' o [m] with phi' cyclic of degree deg/m^2, so it is smooth only if the
    smaller cyclic phi' is -- the non-cyclic candidates are therefore NOT
    independent extra chances, and the count that matters is of PRIMITIVE
    lattice vectors. The primitive count differs from M(T) by the factor
    1/zeta(3) = 0.8319 asymptotically. Getting this wrong inflates the
    multiplicity, which is the direction that would overstate the algorithm.

    (3) THE CONDITIONING QUESTION, STATED PROPERLY. A route with threshold
    theta < 1/3 samples E' until delta_{E'} <= T = p^theta, then needs
    delta_{E'} to be B-smooth. The relevant probability is
      Pr[delta_E is B-smooth | delta_E <= T],
    which Heuristic 1 does not address. Three distinct effects, none of which
    this campaign has separated:
      (i) SIZE. Conditioning on delta_E <= T concentrates delta_E near the top
      of [1, T]: by (1) the conditional density is proportional to t^{1/2}, so
      E[delta | delta <= T] = (3/5) T and the conditional distribution of
      log delta is concentrated within O(1) of log T. Smoothness at u = log T /
      log B is therefore the right u, and this effect alone is benign.
      (ii) LOCAL CONDITIONS. delta_E is a value of a ternary form of
      discriminant p/4. Values of such a form satisfy congruence conditions at
      the primes dividing the discriminant -- here only p, which is far larger
      than any relevant prime factor, so the naive expectation is that the
      conditions are vacuous at the smoothness scale. THAT IS AN EXPECTATION,
      NOT AN ARGUMENT, and it is exactly the kind of expectation that fails
      when the form's genus theory bites.
      (iii) SELECTION BY MINIMALITY. delta_E is not a random VALUE of the form;
      it is the MINIMUM. Minima of random lattices are not distributed like
      random values, and the smallest value in a set is systematically the one
      most constrained by the lattice's shape. Whether that correlates with
      factorisation type is unknown to this record.
    THE HEURISTIC TO BE NUMBERED IS: Pr[delta_E B-smooth | delta_E <= p^theta]
    = v^{-v(1+o(1))} with v = theta log p / log B, uniformly in theta over a
    stated range. This is HEUR-SS-2 of IDEA-20260805-250e50 and this proposal
    is its validation plan.

    (4) WHY THE DIRECTION MATTERS ASYMMETRICALLY. If the conditioned smoothness
    is HIGHER than the uniform-integer prediction, every threshold-lowering
    route gets cheaper by a p^{o(1)} factor and nothing structural changes. If
    it is LOWER by a factor growing in p, the deficit is an exponent that must
    be ADDED to IDEA-20260805-250e50's identity, and the 1/5 ceiling and the
    1/4 conditions there both move upward. The measurement is therefore a
    prerequisite for quoting any number from that identity, and this record
    exists so that the prerequisite is scheduled rather than discovered.

  novelty_status: unverified

