  lossy_projection_identifiability_audit:
    projection: >-
      The full instance (curve, lattice, all small isogenies) --> the pair
      (delta_E, largest prime factor of delta_E), and beneath it the smoothness
      bit [delta_E is B-smooth].
    what_is_discarded: >-
      The lattice, the curve, the isogeny, the other prime factors, and all
      other lattice vectors. A magnitude and one auxiliary integer are retained.
    why_genuinely_lossy: >-
      Extremely: the fibre over a given (delta, largest prime factor) contains
      p^{1-o(1)} curves for typical values.
    why_compatible_with_the_operations: >-
      The retained pair is precisely what Lemma 3.4 and Lemma 3.5 consume: the
      degree bound decides whether the split works, the smoothness decides
      whether the attempt succeeds. Nothing discarded is used downstream, so
      the retained part propagates deterministically to the algorithm's success
      bit.
    is_it_only_a_change_of_coordinates: >-
      NO, and both failures were checked explicitly. Not the (Delta, Pi)
      failure: neither the curve nor the isogeny is recoverable from a degree
      and a largest prime factor. NOT THE MIRROR FAILURE, AND THE CHECK IS THE
      DATA ITSELF: the source's own Figure 1 reports a CUMULATIVE DISTRIBUTION
      of log(largest prime factor) over 100,000 samples that is manifestly
      non-degenerate, and this campaign's committed delta_E labels at four
      primes take many distinct values. Comparator spread is present and
      measured, not assumed. THE ONE PLACE THE MIRROR FAILURE WOULD FIRE is the
      smoothness BIT at the source's own parameters, where the success
      probability is p^{-o(1)} and hence tends to a degenerate 1 on the log
      scale -- which is exactly why this proposal measures the DISTRIBUTION of
      the largest prime factor rather than the bit, and why the same care is
      needed in any conditioned restatement.

  assumptions:
    - >-
      That the committed delta_E labels are the minimal degree of an isogeny
      E -> E^{(p)} in the same normalisation the frozen source uses. The
      BATCH-003 lineage already recorded one normalisation failure of exactly
      this kind (GD-6: WISDE indexes by abstract order type, not j-invariant),
      so this must be re-verified against compute_delta_e_v2.py before any
      factorisation is compared to any prediction. A normalisation mismatch is
      an INVALIDATION, not a negative result.
    - >-
      That the toy range reaches far enough for a smoothness statement to mean
      anything. At the committed primes 2437 to 7333, delta_E is at most a few
      tens, and EVERY integer below 100 is 100-smooth. THE SMOOTHNESS QUESTION
      IS VACUOUS AT THIS SCALE, and this is the proposal's central limitation:
      what CAN be measured at toy scale is the factorisation TYPE (number of
      prime factors, distribution of the largest one relative to the value)
      against a matched null, not smoothness at a cryptographic u. Saying so
      before the run is the difference between a scoped instrument observation
      and an overclaim.
    - >-
      That the frozen source's Section 4.2 correspondence trick (sample random
      maximal orders, compute the two-sided ideal P, find its shortest vector)
      is the only known route to cryptographic-scale samples. It is, and this
      environment cannot run it: no Sage, no Pari, sympy absent (numpy 2.4.6
      present, measured this session). That gap is an infrastructure fact and
      bounds this proposal's reachable tier.

  heuristic_assumptions:
    - id: HEUR-SS-2
      statement: >-
        CONDITIONED SMOOTHNESS (the same heuristic numbered in
        IDEA-20260805-250e50, restated here as its owner). For E uniform
        supersingular over F_{p^2} conditioned on delta_E <= p^theta with
        0 < theta < 1/3, Pr[delta_E is B-smooth | delta_E <= p^theta] >=
        v^{-v(1+o(1))} with v = theta log p / log B, uniformly as p -> infinity
        for (log p)^eps < v < (log p)^{1-eps}.
      rigorous_support: >-
        NONE. Heuristic 1 covers theta = 1/3 only (where the conditioning is
        vacuous by Theorem 1.5) and is itself heuristic. Two of the three
        effects in mechanism (3) -- local conditions and selection by
        minimality -- have no argument in either direction, and the third
        (size) is benign and derived.
      validation_plan: >-
        Stage 2 and Stage 3 of the paired experiment: factor the committed
        delta_E values, stratify by magnitude decile, and compare the
        distribution of log(largest prime factor)/log(delta) against a MATCHED
        NULL of uniform integers on the same range, at all four primes, with
        the comparison reported as a ratio and with the null's own spread as
        the reference. At toy scale this tests the factorisation type, not
        smoothness at a cryptographic u, and the report must say so.
      falsification_condition: >-
        The conditioned stratum's mean log(largest prime factor)/log(delta)
        exceeds the matched null's by an amount that GROWS across the four
        primes, with the growth exceeding the null's own spread. A bounded
        excess is an o(1) and does not falsify.
    - id: HEUR-SS-8
      statement: >-
        MULTIPLICITY IS EXACTLY THE PRIMITIVE LATTICE-POINT COUNT. The number
        of distinct cyclic isogenies E -> E^{(p)} of degree at most T, for
        T below p/4, equals the number of primitive vectors of the rank-3
        trace-zero lattice with degree at most T, which is
        (8 pi/3) zeta(3)^{-1} T^{3/2} p^{-1/2} (1 + o(1)) on average over E.
      rigorous_support: >-
        The correspondence between isogenies and lattice vectors is the frozen
        source's Section 4.2 isometry; the ellipsoid count is standard; the
        zeta(3)^{-1} primitivity density is standard for rank 3; the
        cyclic-iff-primitive step is derived from Lemma 3.4's own argument
        (minimality forces cyclic kernel; a non-primitive vector is m times a
        smaller one and gives phi' o [m]). THE AVERAGING OVER E IS THE WEAK
        STEP -- the count is a per-curve quantity and its average is not its
        typical value.
      validation_plan: >-
        Directly countable at toy scale IF the committed pipeline can enumerate
        all isogenies E -> E^{(p)} of degree <= T rather than only the minimum.
        If it cannot, the check is recorded as NOT RUN with the reason, never
        as passed. A partial substitute that IS available: the empirical
        distribution of delta_E over all curves at each toy prime must match
        the derived counting law's implied distribution, which is a weaker but
        real test of the same constant.
      falsification_condition: >-
        Measured multiplicity at toy T exceeding the predicted count by a
        factor that grows in p, or the empirical delta_E distribution deviating
        from the counting law's shape beyond the fit's own uncertainty.

  predictions:
    - metric: >-
        multiplicity_at_operating_scale: the derived number of cyclic isogenies
        E -> E^{(p)} of degree <= X^2 = B(p/2)^{1/3}, as a function of B
      direction: different
      minimum_effect: >-
        FORCED VALUE (8 pi/3) 2^{-1/2} zeta(3)^{-1} B^{3/2} = 4.93 B^{3/2},
        derived before any run, with the constant flagged as convention-
        dependent by a factor of at most 2 and the EXPONENT 3/2 in B as the
        load-bearing part. Consequence, forced: p^{o(1)}, so Remark 1 carries
        no exponent.
    - metric: >-
        multiplicity_at_SQIsign_I: the same quantity evaluated at
        log2 p = 256 with the source's B = e^{(1/3) sqrt(log(p/2))}
      direction: different
      minimum_effect: >-
        PREDICTED ~10^3 (this record computes B ~ 85 and B^{3/2} ~ 785, times
        the constant, giving a few thousand). Stated as a PREDICTION TO
        RECHECK, not a measurement, and explicitly NOT propagated to any
        concrete security figure -- goal standing condition SC-3 forbids
        carrying a concrete cost across the reduction cascade, and this number
        is an input to a per-attempt probability, not a cost.
    - metric: >-
        conditioned_vs_null smoothness ratio: mean
        log(largest prime factor of delta_E)/log(delta_E) over the committed
        labels, divided by the same statistic on a matched uniform-integer null
        on the identical range
      direction: different
      minimum_effect: >-
        FORCED NULL VALUE 1.000. A ratio within the null's own bootstrap spread
        at all four primes means no measurable conditioning effect at toy scale
        and HEUR-SS-2 is unrefuted (not confirmed) at that scale. A ratio
        differing by more than 0.05 AND moving monotonically across the four
        primes is the falsification signal.
    - metric: >-
        empirical exponent of the delta_E distribution: the exponent alpha in
        #{E : delta_E <= T} proportional to T^alpha, fitted per prime with an
        anchored estimator
      direction: different
      minimum_effect: >-
        FORCED VALUE 3/2. THE ESTIMATOR MUST FIRST RECOVER A KNOWN EXPONENT ON
        A SYNTHETIC OBJECT (this goal's instrument_calibration standing
        practice, adopted precisely because a frozen window returned 1.14 on an
        object whose exponent is 3/2 by construction). Any alpha reported
        without its anchor residual is uninterpretable and must not be recorded.
    - metric: >-
        tail check, in the shape the frozen source uses at Section 4.2: the
        smoothest observed delta_E against its predicted extreme-value
        probability
      direction: different
      minimum_effect: >-
        The source reports 12589-smooth out of 100,000 against a predicted
        1/69232, and e^23-smooth out of 10,000 against 1/3312. At toy scale the
        analogous check is the SMALLEST observed delta_E against the counting
        law's predicted probability of a value that small. Pre-registered:
        agreement within a factor of 3 at three of four primes. This is the one
        check that probes the rare tail, which is where every threshold-lowering
        route lives.

  minimal_test:
    design: >-
      Cheapest gate first. STAGE 0 (zero compute, ~1 hour): re-derive the
      lattice-point count and the B^{3/2} multiplicity; evaluate at the
      source's five parameter sets; DECIDE, before anything runs, whether
      Remark 1 can carry an exponent. If the derivation says it can, that alone
      contradicts the committed F4 verdict and the batch stops to route the
      contradiction. STAGE 1 (zero compute): re-verify the delta_E
      normalisation against compute_delta_e_v2.py, per GD-6's standing repair
      that a pre-freeze review re-reads every cited prior artefact in full.
      STAGE 2 (seconds): factor every committed delta_E value at all four
      primes; build the matched uniform-integer null on the identical range;
      compute the ratio statistic with bootstrap CIs. STAGE 3 (minutes): the
      anchored exponent fit and the small-value tail check. STAGE 4: report,
      with the vacuousness caveat of assumption 2 stated in the headline rather
      than the footnotes.
    controls:
      - >-
        MATCHED NULL, SAME SHAPE, CAN FAIL: uniform integers drawn on exactly
        the observed delta_E range, same count, same stratification by decile.
        FORCED VALUE OF THE RATIO STATISTIC: 1.000. This null can fail in the
        informative direction -- if the real labels' factorisation type differs
        from uniform integers of the same size, the ratio moves and HEUR-SS-2
        is in question.
      - >-
        SECOND NULL, DIFFERENT SHAPE: values of a RANDOM ternary quadratic form
        of the same determinant, rather than uniform integers. This separates
        "being a form value" from "being a lattice minimum": if the real labels
        match the form-value null but not the uniform-integer null, effect (ii)
        of mechanism (3) is the cause; if they match neither, effect (iii) is.
        A single null cannot make that distinction and two can, which is why
        both are specified.
      - >-
        POSITIVE CONTROL, THE EFFECT MUST APPEAR: a PLANTED stratum of integers
        constructed to be measurably smoother than uniform (products of primes
        below a fixed bound, same size distribution). The pipeline must detect
        the planted difference at the pre-registered threshold. IF IT DOES NOT,
        THE INSTRUMENT CANNOT SEE A SMOOTHNESS DIFFERENCE AND NO NULL RESULT
        MAY BE REPORTED.
      - >-
        GRADED CONTROL, >= 3 interior points, monotonicity reported: planted
        strata at smoothness bounds {p^{1/8}, p^{1/4}, p^{1/2}} relative to the
        value size. The detected effect must increase monotonically as the
        planted smoothness increases. A non-monotone response localises the
        instrument's failure to a magnitude regime instead of leaving "no
        effect found".
      - >-
        ORDERING CONTROL: both nulls and all planted strata are generated,
        analysed, committed and hashed BEFORE the real labels are factored.
      - >-
        ARCHIVE CHECK (zero compute): every prior measurement in this corpus of
        the factorisation of delta_E. NONE EXISTS -- EXP-SSIQ-4de240 measured
        the counting function's exponent, not the arithmetic of the values.
        Recorded as an absence.
    required_metrics:
      - the derived multiplicity formula, its constant, and its evaluation at the source's five parameter sets
      - factorisation of every committed delta_E value, with the normalisation check that preceded it
      - ratio statistic against BOTH nulls, with bootstrap CIs, per prime
      - planted-control detection at each of >= 3 graded levels, with monotonicity
      - anchored exponent fit with its residual against the forced 3/2
      - the explicit statement of what toy scale can and cannot test about smoothness

  falsification_conditions:
    - >-
      The derived multiplicity turns out to carry a power of p rather than
      B^{3/2}. F4's committed consequence is then contradicted and the batch
      routes the contradiction rather than absorbing it -- this would be the
      most consequential possible outcome and the least likely.
    - >-
      The positive control fails to detect a planted smoothness difference. No
      null result may be reported.
    - >-
      The delta_E normalisation check fails. INVALIDATION, not a negative
      result (GD-6's standing repair, and rule 5).
    - >-
      The ratio statistic differs from 1 by more than 0.05 with a monotone
      trend across the four primes. HEUR-SS-2 is in question and every number
      in IDEA-20260805-250e50's identity must carry that caveat until the
      effect is bounded.
    - >-
      The anchored estimator fails to recover the known exponent on the
      synthetic object. No exponent may be reported from this data at all --
      the same failure this campaign already recorded once
      (instrument_calibration, ~-0.36 bias).

  confounders:
    - >-
      VACUOUSNESS AT TOY SCALE, THE DOMINANT ONE. delta_E values at the
      committed primes are small integers; smoothness at a cryptographic u
      simply cannot be tested there. What is testable is factorisation type
      against a matched null. Any report that blurs the two would be an
      overclaim, and the distinction is written into the required metrics.
    - >-
      THE CONSTANT IS CONVENTION-DEPENDENT. The BATCH-001 audit records the
      trace-zero lattice's determinant as p/16 or p/4 "according to a
      projection index of 1 or 2", which moves the multiplicity constant by
      sqrt(2). The exponent does not move. Every reported constant carries its
      convention.
    - >-
      SELECTION IN THE COMMITTED DATA. The delta_E labels come from a run whose
      terminal label is CONTROL-FAILURE-VOID and whose prime set was truncated
      by a budget-allocation rule (GD-7). Whether the four surviving primes are
      a biased sample for THIS question is a different question from whether
      they were biased for the descent question, and it must be checked rather
      than inherited.
    - >-
      MULTIPLE NULLS INVITE SELECTION. Two nulls and four graded planted
      strata are specified; the analysis must report all of them, and the
      decision rule is frozen before any real label is factored.

  interpretation_limits:
    - >-
      NO EXPONENT IS CLAIMED OR MOVED. The multiplicity result is a bound
      showing a phenomenon CANNOT move an exponent, which is a negative and is
      recorded as one. The conditioning result, whichever way it falls, changes
      an o(1) unless the effect grows.
    - >-
      NOTHING HERE VALIDATES OR REFUTES HEURISTIC 1 AS THE SOURCE STATES IT.
      The source validated it at cryptographic scale by a correspondence this
      environment cannot execute. This proposal addresses a DIFFERENT,
      CONDITIONED statement, at toy scale, and may not be cited as bearing on
      the source's own heuristic.
    - >-
      Toy tier, four primes, log2 p <= 13. Rule 7 applies with full force: no
      smoothness statement here transfers to cryptographic parameters.
    - >-
      The number computed for SQIsign level I is an input to a per-attempt
      success probability and is NOT a concrete security figure. SC-3 forbids
      carrying concrete cost across the reduction cascade and nothing here does.

  proof_search_map_note: >-
    Partly proof-oriented (the multiplicity bound is a derived negative). The
    paired hypothesis H-SSIQ-2efc5c carries the filled proof_search_map for the
    instrument side; the multiplicity derivation's method ceiling is stated in
    interpretation_limits above -- it can certify that Remark 1 carries no
    exponent, and nothing about the phenomenon's practical value beyond the
    number B^{3/2}.

  target_complexity:
    time_exponent: >-
      n/a -- this proposal moves no exponent and says so plainly. Its role is to
      determine whether a p^{o(1)} factor assumed by IDEA-20260805-250e50's
      identity is genuinely p^{o(1)}, and to bound a phenomenon the frozen
      source left unquantified.
    memory_exponent: n/a.
    best_known: >-
      p^{1/3+o(1)} time and memory conditional on Heuristic 1 (and GRH for
      Isogeny, SC-1); p^{1/2}(log p)^{O(1)} unconditional.
    hidden_overhead: >-
      This proposal is ABOUT the hidden overhead: it bounds one contributor
      (Remark 1's multiplicity, at B^{3/2}) and tests whether a second
      (conditioned smoothness) is bounded at all.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no result claimed). Rows checked before writing: (i) the frozen
    source's Section 4.1 table, time and memory, five sizes, and its Section
    4.2 heuristic validation with both tail checks; (ii) the goal record's
    incumbent_baselines and its two corrections; (iii) all five EV-SSIQ-*
    records and EXP-SSIQ-4de240's contract, for a prior measurement of delta_E's
    ARITHMETIC as opposed to its magnitude -- none exists; (iv) the
    F_p-restricted row, out of scope by this question's constraint;
    (v) data/queries -- not applicable, recorded rather than left blank.
  sota_delta: >-
    ZERO on every attack axis; this proposal proposes no attack. Quantitatively
    it delivers: a closed-form multiplicity 4.93 B^{3/2} with its convention
    stated, evaluated at the source's own five parameter sets, which converts
    Remark 1 from an unquantified caveat into a number and confirms F4's
    exponent-free verdict from a second direction; and a two-null, four-level
    graded measurement of whether the conditioned smoothness assumption that
    every threshold-lowering route inherits is bounded, with a forced null
    value of 1.000 and a pre-registered 0.05 threshold.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.90 that the multiplicity derivation stands. It is an ellipsoid count over
    a lattice this campaign has already committed, and its exponent 3/2 is the
    same one D1 derives by an entirely different route (optimal embeddings and
    class numbers). Not higher because the primitivity and cyclicity step is
    this record's own and because the constant is convention-dependent.
    0.20 that the conditioning measurement shows any effect at toy scale. Not
    lower, because nobody has looked and because values of quadratic forms are
    a known place for arithmetic bias. Not higher, because the toy range is so
    small that the statistic being measured is factorisation type rather than
    smoothness, and because the local conditions at the only ramified prime p
    are almost certainly vacuous at the scale of the observable prime factors.
    0.95 that the batch reaches a decisive reading on the multiplicity half,
    which is pen-and-paper; 0.60 on the conditioning half, which depends on the
    normalisation check passing and on the committed labels being usable.
