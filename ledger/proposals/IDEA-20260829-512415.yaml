  proof_search_map:
    bottleneck: >-
      Establishing any relation between a curve's cofactor and its twist's
      without point counting. IDEA-20260829-d052e6 removes it for p = 1 mod 4
      at the cost of a symbol chain; IDEA-20260829-b41d39 removes it for
      p = 3 mod 4 at the cost of one symbol plus the hypothesis
      v_2(#E) less than s. On this row the hypothesis itself is the last
      remaining cost, and the Mersenne shape removes it, leaving a theorem
      with no computational content at all. The bottleneck removed is not a
      computation but a HYPOTHESIS.
    baseline_embedding:
      parameter_slice: >-
        C1 must be exactly the s greater than Hasse-bound boundary case of
        IDEA-20260829-b41d39's C3 - substituting s = 522 into that record's
        trichotomy must yield C1 with no additional argument. C3 must be
        exactly IDEA-20260829-e37b52's identity I1 with p = 2^521 - 1
        substituted, and must reproduce I1's arithmetic bit for bit on this
        row.
      reproduction_check: >-
        A frozen fixture asserting that b41d39's forcing routine, given
        s = 522 and any v_2 below 522, returns equality; and that e37b52's I1
        evaluated on E-521's five quantities returns residue zero, identically
        to this record's l + l' = 2^520 check. Both run before any claim is
        made.
    observation_collision:
      observable: >-
        The residue l + l' - 2^520, predicted identically zero, which is the
        certificate carrying C3.
      distinct_preimage_search: >-
        REQUIRED, AND THE ANSWER IS KNOWN IN ADVANCE AND MUST BE STATED RATHER
        THAN DISCOVERED. Collisions PROVABLY EXIST - any compensating pair,
        l increased by delta and l' decreased by delta, leaves the residue
        zero. So a zero residue does NOT certify either value; it certifies
        the absence of any error outside a codimension-one subvariety, exactly
        as IDEA-20260829-e37b52 records for its own I1 and as the archived
        audit plan's null control Z3 records for its arithmetic step. THE
        SEPARATING CONDITION that must be added is that l is independently
        bound - by its primality certificate on the prime-proofs page, by
        [l]G being the identity for the published base point, and by
        l exceeding 4 sqrt(p) so that the Hasse interval contains exactly one
        multiple of it. The record must state that C3's force comes from the
        CONJUNCTION and never from the subtraction alone. A SECOND COLLISION,
        SPECIFIC TO THIS ROW - because the right-hand side is a pure power of
        two, a transcription error that shifts a digit position in BOTH l and
        l' symmetrically is invisible, and symmetric errors are more likely
        here than for a general p precisely because the two numbers are so
        nearly equal.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Push the general forcing theorem to the boundary case where
          s exceeds the Hasse bound on the valuation, turning a conditional
          statement into an unconditional one by making the condition
          arithmetically vacuous rather than by verifying it.
        predicted_gain: >-
          The matched-cofactor conclusion at zero field operations and with no
          hypothesis on the curve, where every other row in the family needs
          at least one modular exponentiation and a completeness hypothesis.
          This is a hypothesis removal, not a speed-up, and is worth stating
          in those terms.
      - transform: stronger_invariant
        proposed_object: >-
          Retain the residue l + l' - 2^520 as an exact integer rather than a
          pass-or-fail bit, so that a nonzero value's MAGNITUDE and 2-adic
          valuation localise which digit of which page is wrong.
        predicted_gain: >-
          A transcription defect is localised to a page and a digit position
          rather than reported as a bare mismatch, which is the difference
          between an actionable finding and a fatigue report.
    quantifier_order: >-
      C1 IS CLAIMED UNIFORMLY AND WITH NO CURVE HYPOTHESIS. FOR ALL elliptic
      curves E over F_p with p = 2^521 - 1, v_2(#E) = v_2(#E^t). No witness
      depends on the curve, on the model, on completeness, or on anything but
      the modulus.
      C2 IS CLAIMED UNIFORMLY AND QUANTITATIVELY. FOR ALL such E, the
      difference of log-2 rho costs, once the cofactors are equal, is below
      2^-259 in absolute value.
      C3 IS CLAIMED EXISTENTIALLY AND CONDITIONALLY. GIVEN the mirror's
      cofactor cells, THERE EXISTS an integer l satisfying l + l' = 2^520,
      exhibited by one subtraction. NOT CLAIMED - that this l is the true
      curve subgroup order, which additionally requires the primality and
      base-point conditions named above.
      C4 IS CLAIMED UNIVERSALLY OVER A FINITE SET. FOR ALL eleven complete
      rows, the published rho gap is 0.5 exactly when p is 1 mod 4 and 0.0
      exactly when p is 3 mod 4. NOT CLAIMED - for any curve outside the
      eleven.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For p = 2^521 - 1 the curve and twist cofactors have equal 2-parts,
        unconditionally; their rho costs differ by less than 2^-259 once the
        cofactors are equal; and 2^520 minus the published twist subgroup
        order equals the published curve subgroup order." It certifies NOTHING
        about either valuation's VALUE, nothing about the odd parts, nothing
        about primality, and nothing about the ECDLP. In particular C1 is
        equally true of a completely broken curve over the same field, and the
        record must never be cited as evidence of E-521's safety.
      nearby_object_control: >-
        THE OTHER TEN COMPLETE ROWS ARE THE CONTROL AND THEY SPLIT CLEANLY.
        The five p = 1 mod 4 rows must show a 0.5-bit gap and mismatched
        cofactors; the five other p = 3 mod 4 rows must show a 0.0-bit gap and
        matched cofactors but must reach that conclusion CONDITIONALLY,
        through a symbol, because their s is small. An implementation that
        reports E-521's conclusion as unconditional AND reports the same for
        Ed448-Goldilocks has not understood which hypothesis the Mersenne
        shape discharges - Ed448's s is 225 while its Hasse bound on the
        valuation is 449, so the hypothesis is NOT vacuous there. THAT IS THE
        SHARPEST NEARBY OBJECT IN THIS RECORD and it is one row away.
        A SECOND NEARBY OBJECT - a hypothetical curve over 2^521 - 1 with
        cofactor 8, which C1 says would force twist cofactor 2-part 8 as
        well; no such row exists in the family, so the conclusion is
        untestable against data and must be labelled a prediction rather than
        a confirmed pattern.
    proof_obligations:
      - claim: '#E + #E^t = 2p + 2 exactly for a quadratic twist over F_p.'
        responsibility: correctness
      - claim: >-
          p + 1 = 2^521 for p = 2^521 - 1, hence 2p + 2 = 2^522 and
          v_2(2p + 2) = 522.
        responsibility: correctness
      - claim: >-
          #E is at most p + 1 + 2 sqrt(p) which is below 2^522, hence
          v_2(#E) is at most 521.
        responsibility: size
      - claim: >-
          The trichotomy forces v_2(#E) = v_2(#E^t) when both valuations are
          below v_2 of the sum.
        responsibility: strictness
      - claim: >-
          The rho-gap bound one half times log2((2^521 + t)/(2^521 - t)) is
          below 2^-259 for |t| at most 2 sqrt(p), by the elementary
          inequality log(1 + x) at most x.
        responsibility: size
      - claim: >-
          l + l' = 2^520 follows from cofactors both exactly 4, and a zero
          residue is blind to compensating errors.
        responsibility: strictness
      - claim: >-
          2^521 - 1 is prime, established by Lucas-Lehmer rather than assumed.
        responsibility: baseline
      - claim: >-
          C1 holds at small Mersenne primes against brute-force point
          counting, on every curve tested.
        responsibility: baseline
    not_applicable_reason: null

  predictions:
    - metric: >-
        fraction of curves over small Mersenne primes for which brute-force
        point counting gives v_2(#E) equal to v_2(#E^t)
      direction: higher
      minimum_effect: >-
        PREDICTED EXACTLY 1.000 - 100 percent, exhaustive census over every
        curve at p equal to 31, 127 and 8191, with no restriction to Edwards
        curves and no completeness hypothesis, since C1 applies to all curves.
        Anything below 1.000 falsifies C1, which is presented as a theorem, so
        either the derivation or the point counter is wrong.
    - metric: >-
        the same fraction over small NON-Mersenne primes of both residue
        classes, run through the identical code path
      direction: lower
      minimum_effect: >-
        PREDICTED STRICTLY BELOW 1.000, with explicit counterexamples
        exhibited, since for small s the matched conclusion genuinely fails
        for some curves. THIS IS THE CONTROL THAT MAKES C1 NON-VACUOUS. A
        value of 1.000 here would mean the equality holds for reasons having
        nothing to do with the Mersenne shape, and C1's entire justification
        would have to be redone.
    - metric: 'the residue 2^520 - l'' minus the published l, as an exact integer'
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY 0. A tuple of two independently transcribed 519-bit
        integers satisfies this with probability about 2^-520, so a pass is a
        roughly 520-bit consistency signal between two different SafeCurves
        pages. A nonzero residue localises a transcription defect to one of
        the two pages and is a material process finding; report its magnitude
        and its 2-adic valuation, which together indicate which digit position
        is wrong.
    - metric: >-
        v_2 of the published cofactor and twist cofactor for E-521, compared
        against IDEA-20260829-b41d39's symbol chi(1 - d) = chi(376015)
      direction: different
      minimum_effect: >-
        PREDICTED chi(376015) = -1, hence v_2(#E) = 2, hence by C1
        v_2(#E^t) = 2, both matching the mirror's published 2^2 and 2^2. A
        value of +1 would predict v_2 at least 3 and contradict a published
        cofactor; halt and escalate.
    - metric: >-
        number of the eleven complete rows where the published twist rho cost
        minus the published curve rho cost equals 0.5, and whether those rows
        are exactly the p = 1 mod 4 rows
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY 5 rows at 0.5 - M-221, Curve25519, M-383,
        Curve383187 and M-511 - and exactly 6 rows at 0.0 - E-222, Curve1174,
        E-382, Curve41417, Ed448-Goldilocks and E-521 - with the partition
        coinciding exactly with p mod 4. A single row on the wrong side means
        either a published number is mis-transcribed or the forcing theorem is
        wrong, and since the theorem is elementary the transcription is the
        likelier and must be excluded first.
    - metric: >-
        the derived rho-gap bound for E-521, compared against
        IDEA-20260829-e37b52's generic bound
      direction: lower
      minimum_effect: >-
        PREDICTED below 2^-259, against e37b52's 2^-124 stated at 255 bits.
        Since e37b52's bound scales as 2^-(bits/2 - 3) roughly, the
        improvement here comes half from the larger field and half from the
        cofactor term vanishing exactly rather than being estimated; the
        record must report both contributions separately or the comparison is
        not meaningful.
    - metric: 'primality tier reached for 2^521 - 1'
      direction: higher
      minimum_effect: >-
        PREDICTED a DETERMINISTIC Lucas-Lehmer verdict rather than a
        probable-prime one, which is available for Mersenne numbers and for
        almost nothing else in this family. This is worth doing precisely
        because it is one of the very few places where the campaign can write
        "prime" rather than "probable prime" without qualification.
    - metric: >-
        whether Ed448-Goldilocks's conclusion is correctly reported as
        CONDITIONAL while E-521's is reported as UNCONDITIONAL
      direction: different
      minimum_effect: >-
        PREDICTED that the implementation distinguishes them, since Ed448's
        s = 225 is below its Hasse valuation bound of 449 while E-521's
        s = 522 is above its bound of 521. An implementation that reports both
        as unconditional has not understood which hypothesis the Mersenne
        shape discharges, and every unconditional claim it makes is void.

  minimal_test:
    design: >-
      STAGE 0, ZERO COMPUTE, AND IT IS THE ENTIRE RIGOROUS CONTENT OF THE
      RECORD. Write out C1 and C2. If p + 1 is not 2^521, or the Hasse bound
      does not put v_2 below 522, the record dies at no machine cost. This is
      the cheapest valid discriminator in this whole batch and it needs no
      shell.
      STAGE 1, ONE SUBTRACTION, seconds. Read l' from tables/twist.tsv and l
      from tables/primeproofs.tsv - NEITHER of which may be taken from this
      record - compute 2^520 minus l' minus l, and report it as an exact
      integer.
      STAGE 2, seconds. C4's eleven-row sweep - p mod 4, the published rho
      gap, and the published cofactor pair, tabulated and compared.
      STAGE 3, minutes. THE TOY VALIDATION OF C1 at the small Mersenne primes
      31, 127 and 8191, exhaustively over every curve, by brute-force point
      counting; and the CONTRAST census at small non-Mersenne primes of both
      residue classes, which must produce counterexamples.
      STAGE 4, seconds. IDEA-20260829-b41d39's symbol for E-521 to fix the
      actual values, and the Lucas-Lehmer verdict for the modulus.
    controls:
      - >-
        BLOCKING CONTRAST CONTROL - the non-Mersenne census, which must
        produce explicit counterexamples to the matched-valuation conclusion.
        A census that finds none has not shown the Mersenne shape is doing any
        work and C1's justification collapses to a coincidence.
      - >-
        POSITIVE, AND UNUSUALLY STRONG - the small-Mersenne census covers
        EVERY curve over those fields, not only Edwards curves, because C1
        makes no curve hypothesis. An instrument tested only on complete
        Edwards curves would not have tested C1's actual claim.
      - >-
        NEARBY-OBJECT CONTROL, BLOCKING - Ed448-Goldilocks, whose s = 225 is
        large but below its Hasse valuation bound. The implementation must
        report its conclusion as CONDITIONAL on the symbol and E-521's as
        UNCONDITIONAL. Conflating them is the specific error this record is
        most likely to induce in a reader.
      - >-
        NULL, SAME SHAPE - 10^3 synthetic pairs of 519-bit integers drawn
        independently at random and fed to the identical subtraction check.
        PREDICTED zero passes, since the null rate is about 2^-520. A single
        spurious pass means the comparison is truncating or is being done
        modulo something, and voids C3.
      - >-
        COMPENSATING-ERROR PROBE - deliberately construct pairs with
        compensating errors and confirm the check does NOT detect them, so
        that the published claim is bounded by what was demonstrated. Because
        the two numbers here are nearly equal, also probe SYMMETRIC digit
        shifts, which are the specific blind spot this row has and a general p
        does not.
      - >-
        MIRROR-INTEGRITY CONTROL - recompute the sha256 of tables/twist.tsv
        and tables/primeproofs.tsv and compare against
        source_record_addendum_01.yaml; and re-read both values from
        pages/*.html as well as from tables/*.tsv, per MIRROR-DEF-1.
      - >-
        CROSS-PAGE INDEPENDENCE CHECK - confirm that l and l' genuinely come
        from two different source pages rather than from one page reproduced
        twice. If they come from the same page, C3's 520-bit signal is a
        self-consistency check of one transcription and is worth far less, and
        the deliverable must say so.
    required_metrics:
      - 'the C1 and C2 derivation note, as a frozen artifact'
      - 'the exact residue 2^520 - l - l'' as an integer, with the source file and line of each input'
      - 'the sha256 of every mirror file read, against the addendum'
      - 'per complete row, p mod 4, s, published cofactor pair, published rho gap'
      - 'the small-Mersenne exhaustive census agreement fraction, over all curves'
      - 'the non-Mersenne contrast census fraction and at least three exhibited counterexamples'
      - 'chi(376015) for p = 2^521 - 1 and the derived valuation pair'
      - 'the Lucas-Lehmer verdict for 2^521 - 1'
      - 'the derived rho-gap bound with its two contributions reported separately'
      - 'the null pass rate over 10^3 synthetic pairs, with seeds'

  falsification_conditions:
    - >-
      p + 1 is not 2^521, or 2^521 - 1 fails Lucas-Lehmer. The modulus is
      mis-transcribed or is not prime; every claim in this record and in every
      sibling record about this row is withdrawn.
    - >-
      Any curve over a small Mersenne prime with v_2(#E) not equal to
      v_2(#E^t). C1 is refuted as a theorem, so either the derivation or the
      point counter is wrong; halt and find which.
    - >-
      The non-Mersenne contrast census produces no counterexamples. The
      matched conclusion is not specific to the Mersenne shape and C1's
      justification must be redone before anything is claimed.
    - >-
      The residue 2^520 - l - l' is nonzero. A transcription defect exists on
      one of two SafeCurves pages or in this program's reading of them - halt
      that row, re-read both from the raw HTML, and record whether the defect
      is in the mirror, in the extraction, or in the source. If in the source,
      that is a material finding about a published specification and must not
      leave the repository before independent review.
    - >-
      chi(376015) = +1 at p = 2^521 - 1, contradicting the mirror's published
      cofactor 2^2. A transcription or algebra error is far likelier than a
      finding and must be excluded first.
    - >-
      Any of the eleven complete rows falls on the wrong side of C4's
      partition. Since the forcing theorem is elementary, this proves a
      mis-transcription and the row and field must be localised.
    - >-
      A nonzero pass rate on the synthetic null. Implementation failure;
      nothing is reported.
    - >-
      l and l' turn out to come from the same source page. C3's signal is a
      self-consistency check rather than a cross-page one; the claim is
      reduced accordingly and the reduction is stated in the deliverable, not
      in a footnote.

  confounders:
    - >-
      C1 SAYS NOTHING ABOUT THE VALUE. It relates the two valuations and never
      determines either. Every appearance of the number 4 in this record comes
      from a transcription or from IDEA-20260829-b41d39's symbol, never from
      C1, and a deliverable that writes "cofactor 4 derived unconditionally"
      has conflated the two.
    - >-
      2-PART IS NOT COFACTOR. C3's premise is that the cofactors are exactly
      4, which asserts both that the 2-part is 4 and that the odd part is 1.
      No instrument in this batch derives the second, so C3 remains
      conditional on a transcription however well the 2-part is certified.
    - >-
      COMPENSATING AND SYMMETRIC ERRORS. A zero residue is blind to any
      compensating pair, and this row is unusually exposed to SYMMETRIC digit
      errors because l and l' agree in their leading 259 bits. The published
      claim must be "no single-field defect", never "no defect".
    - >-
      THE PRINTED PRECISION OF THE RHO COSTS IS ONE DECIMAL. A published gap
      of 0.0 means the true gap is below about 0.05, not below 2^-259. C2's
      bound is far tighter than the data can confirm, so the eleven-row sweep
      CONFIRMS C2 only to one decimal place and cannot distinguish 2^-259 from
      2^-10. That asymmetry between what is proved and what is observed must
      be stated, and it is the most likely place for this record to look
      better-confirmed than it is.
    - >-
      THE MERSENNE PROPERTY IS ABOUT p + 1 AND NOT ABOUT p. What C1 needs is
      v_2(p + 1) exceeding the Hasse valuation bound; that p is Mersenne is
      the reason it holds, not the statement itself. A generalisation to any
      prime with v_2(p + 1) above about log_2(p) would be identical, and no
      such prime other than a Mersenne exists in the relevant range, but the
      record should state the hypothesis in its true form.
    - >-
      THE MIRROR IS NOT THE SITE. inputs/SAFECURVES-20260825/ is a dated
      snapshot with recorded hashes whose own addendum documents a defect in
      one derived view. Agreement with it is agreement with that snapshot.

  interpretation_limits:
    - >-
      NOTHING HERE IS A SECURITY STATEMENT. C1 is equally true of a
      deliberately broken curve over the same field, and a matched cofactor is
      not a safety property. The question record's claim boundaries state that
      no safety or vulnerability conclusion is authorised, and this record
      claims none.
    - >-
      C1 and C2 are proved and require no compute; C3 is one subtraction whose
      premise is transcribed; C4 is an empirical claim about eleven published
      rows at one decimal place of precision.
    - >-
      TRANSFER TO THE OTHER 19 CURVES, STATED EXACTLY. (a) C1's THEOREM
      transfers to NO other row, because no other modulus in the family has
      v_2(p + 1) above its Hasse valuation bound. Ed448-Goldilocks is the
      nearest at s = 225 against a bound of 449 and does NOT qualify. This is
      the sharpest example in the batch of a result that is genuinely
      curve-specific, and it should be recorded as such rather than
      generalised. (b) THE GENERAL FORCING THEOREM of which C1 is a boundary
      case transfers to all twenty rows and is IDEA-20260829-b41d39's C3, not
      this record's. (c) C3's METHOD - one exact integer identity binding two
      independently transcribed orders - transfers to all twenty rows as
      IDEA-20260829-e37b52's I1, with 2p + 2 in place of 2^522; the
      SHARPNESS, that the right-hand side is a pure power of two, transfers to
      none. (d) C4 is family-wide by construction and its result binds every
      complete row.
    - >-
      C3 is a CONSISTENCY check between two transcriptions. If they agree
      neither is thereby proved; if they disagree at least one is wrong, which
      is the informative case. It is not a derivation of either order from
      first principles and must never be cited as one.
    - >-
      The record's most valuable output may be procedural rather than
      mathematical - it demonstrates that the SafeCurves mirror already in
      this repository supplies the inputs that IDEA-20260829-e37b52 declares
      missing, which unblocks that record's Step 1 for all twenty rows at zero
      retrieval cost.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The integers l and l' as printed in the repository mirror are the
        integers SafeCurves publishes, and the two are transcribed from
        genuinely different source pages rather than from one page reproduced
        twice; formally, the residue 2^520 - l - l' is a test of two
        independent transcriptions and not of one.
      rigorous_support: >-
        The RIGOROUS half is the identity itself - l + l' = 2^520 holds
        exactly for correctly transcribed values given cofactors 4 and 4, with
        no error term, so a NONZERO residue is unconditional proof of an
        error. The heuristic is used ONLY in the reverse direction, to read a
        zero residue as evidence of correctness, and it imitates the standard
        random-oracle model of a checksum in which a corrupted message
        collides with a valid one with probability 2^-b, here with b about
        520. The INDEPENDENCE half has no rigorous support at all and is a
        claim about how the mirror was produced, which the cross-page check
        addresses directly rather than by assumption.
      validation_plan: >-
        SAMPLING - 10^3 synthetic pairs of 519-bit integers at matched bit
        length with recorded seeds, plus deliberate single-digit mutations of
        the real values at every digit position, which is an exhaustive
        mutation census over about 320 positions rather than a sample.
        COMPARISON DISTRIBUTION - the observed false-negative rate against the
        predicted 2^-520; at that exponent the prediction is exactly zero
        observed in any feasible sample, so the test has NO POWER TO CONFIRM
        the exponent and CAN ONLY REFUTE IT, which is stated rather than
        glossed. TAIL CHECK - mutations restricted to the LOW-ORDER digits,
        where a naive implementation using floating point or a truncated
        comparison would fail first, and to SYMMETRIC digit pairs, which are
        this row's specific blind spot; predicted 100 percent detection for
        the former and 0 percent for the latter, and both numbers must be
        published. TRANSFER - none, since every check runs at the real bit
        lengths on the real values.
    - id: H2
      statement: >-
        The published one-decimal rho costs are computed by SafeCurves as
        0.886 times the square root of the subgroup order, so that a printed
        difference of 0.0 between curve and twist reflects a true difference
        below about 0.05 bits and is consistent with C2's bound of 2^-259.
      rigorous_support: >-
        NONE as to what formula SafeCurves used; the 0.886 constant is
        recalled from KN-TECH-001 and KN-TECH-006 as this program's own rho
        baseline and is NOT read from the mirror in this session. The rigorous
        half is that WHATEVER monotone function of the subgroup order is used,
        the ratio of the two orders is within 2^-258 of 1 by Hasse, so any
        reasonable cost function gives a gap below the printed precision. That
        argument is robust to the formula and is what the record actually
        relies on.
      validation_plan: >-
        PARTIAL AND CHEAP. (i) Recompute 0.886 times the square root of the
        published l and of the published l' for all eleven complete rows,
        round to one decimal, and compare against the published costs. Exact
        agreement on all eleven would establish the formula empirically at
        11 independent points and would settle H2 for practical purposes;
        disagreement on any row means the formula is different and the record
        must say what was assumed. (ii) Read pages/rho.html prose, which was
        NOT read in this session, for a stated formula. (iii) Report the
        recomputed gaps at full precision beside the published one-decimal
        ones, so that the difference between what is proved and what is
        printed is visible rather than implied.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED, AND FOR C1 AND C2 NO COST IS CLAIMED
      EITHER because there is none - they are theorems with zero field
      operations. C3 is ONE big-integer subtraction on 520-bit values, that is
      O(log p) bit operations, nanoseconds. C4 is eleven residues and eleven
      subtractions. The Lucas-Lehmer test for 2^521 - 1 is 519 squarings
      modulo a 521-bit number, that is O(log^3 p) bit operations, milliseconds
      - and it is DETERMINISTIC, which no other primality claim in this family
      can be. The toy Mersenne census is O(p) per curve and O(p^2) per prime;
      at p = 8191 that is about 10^8 elementary steps, seconds across 14
      cores. Verification of C3's certificate by a second implementation is
      one subtraction - the most succinct certificate in this batch by a wide
      margin.
    memory_exponent: >-
      O(log p), that is a few hundred bytes for the full-size claims and a few
      kilobytes for the eleven-row table. The toy census needs O(p) time and
      O(1) memory per curve. Neither the 48 GB envelope nor the 14 cores is a
      binding constraint anywhere.
    best_known: >-
      For the RELATION between the two cofactors, no incumbent exists inside
      this program other than IDEA-20260829-b41d39's conditional forcing
      theorem, which this record's C1 strictly improves on this row by
      removing the hypothesis; outside the program, any specialist would write
      C1 down immediately, so no advance over the literature is claimed. For
      the VALUES, the mirror publishes them at zero cost and dominates
      absolutely. For the rho-gap bound, IDEA-20260829-e37b52's 2^-124 at 255
      bits is the incumbent inside this program and C2 improves it to 2^-259
      on this row. Against the ECDLP attack frontier - KN-TECH-001,
      KN-TECH-006, KN-TECH-018, KN-TECH-031, KN-TECH-032, KN-TECH-033,
      KN-TECH-035 - this record is dominated by every row because it is not an
      attack.
    hidden_overhead: >-
      No o(1), nothing superpolynomial, and unusually for this batch no
      size-transfer heuristic either, because C1 and C2 are proved at the real
      size rather than validated at toy size and extrapolated - the toy census
      tests the DERIVATION, not the implementation's behaviour at 521 bits.
      That makes this the epistemically cheapest record in the batch. The
      honest hidden costs are two and both are about data - C3's premise is a
      transcription that no instrument here derives in full, and C4's
      confirmation is limited to one decimal place of published precision
      while the claim is at 2^-259.
    tradeoff_note: >-
      The tradeoff is RIGOUR against REACH and it is unusually stark. C1 is
      the strongest statement in this batch - unconditional, hypothesis-free,
      zero compute - and it is also the weakest in content, since it
      determines no value. Every record that determines a value pays for it
      with a heuristic or a transcription. There is no time-memory tradeoff
      and parallelisation matters only for the toy census.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW; `null` is not asserted. AS AN ATTACK
    it is dominated by rho (KN-TECH-001, KN-TECH-006), automorphism-discounted
    rho (KN-TECH-018), BSGS (KN-TECH-031, KN-TECH-035), MOV and Frey-Ruck
    (KN-TECH-032) and the trace-one transfer (KN-TECH-033) simultaneously on
    time, memory and data, because it is not an attack. AS A SOURCE OF THE
    COFACTOR VALUES it is dominated absolutely by the SafeCurves mirror, which
    publishes them for free, and by SEA on information. AS A STATEMENT ABOUT
    THE RELATION between the two cofactors it is NOT dominated by anything
    located - IDEA-20260829-b41d39's forcing theorem reaches the same
    conclusion on this row only under a hypothesis that must be checked, and
    IDEA-20260829-d052e6's forcing theorem does not apply to p = 3 mod 4 at
    all; on this row C1 strictly dominates both, on cost (zero versus one
    exponentiation) and on hypothesis (none versus completeness plus a symbol)
    simultaneously. AS A RHO-GAP BOUND it strictly dominates
    IDEA-20260829-e37b52's I3 on this row, 2^-259 against 2^-124, and is
    dominated by it everywhere else in the sense that I3 applies to twenty
    rows and C2 to one. AS A CHECKSUM C3 is IDEA-20260829-e37b52's I1
    specialised, so it is dominated by I1 on coverage and dominates it on
    sharpness for this row only.
  sota_delta: >-
    ZERO speedup against any attack baseline on every axis. AS RIGOUR, WHICH
    IS THE PRINCIPAL DELTA - the matched-cofactor conclusion for this row
    moves from "conditional on completeness and on one modular exponentiation"
    to "unconditional, zero compute, no curve hypothesis", which is a removal
    of hypotheses rather than a speed-up and is the strongest epistemic
    position anything in this batch reaches. AS PRECISION - the
    curve-versus-twist rho gap for this row moves from
    IDEA-20260829-e37b52's rigorous 2^-124 at 255 bits to a rigorous 2^-259 at
    521 bits with the cofactor term vanishing exactly, a tightening of about
    135 binary orders of magnitude on this row. AS EXPLANATION - e37b52
    concludes that the 0.5-bit gap is cofactor bookkeeping given the
    cofactors; C4 explains the COFACTORS by the residue class of p, so the
    eleven-row pattern of 0.5 and 0.0 gaps becomes a consequence of the
    moduli, and the program currently holds zero statements of that kind. AS
    DATA - the curve subgroup order l for E-521 becomes derivable from the
    published twist order by one subtraction, so a quantity this program did
    not hold this morning is obtainable at the cost of one big-integer
    operation and is simultaneously bound to a second published page by a
    roughly 520-bit identity. AS PROCESS - IDEA-20260829-e37b52 declares
    retrieval its binding constraint and states the repository holds no order
    data; the mirror contradicts that, and this record is the cheapest
    possible demonstration of what the mirror makes available.
  estimated_cost:
    implementation: low
    compute: low
    basis: >-
      Implementation is under a hundred lines - a subtraction, an eleven-row
      table, a Lucas-Lehmer routine, and a brute-force point counter for the
      toy Mersenne census that IDEA-20260829-b41d39 already needs. Compute is
      nanoseconds for the full-size claims and seconds for the toy census. No
      network access is required, since every input is in the repository.
  recommended_priority: high

