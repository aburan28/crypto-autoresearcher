idea:
  id: IDEA-20260829-512415
  question_id: RQ-SCURVE-3f11a5
  goal_id: GOAL-SCURVE-8ba49a
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    THE MERSENNE TWO'S-COMPLEMENT IDENTITY - because p = 2^521 - 1 gives
    p + 1 = 2^521 exactly, E-521's curve and twist orders sum to 2^522 and are
    therefore symmetric about a power of two; derive from this, with NO
    computation, NO heuristic and NO completeness hypothesis, that the two
    cofactors have equal 2-parts, that the twist subgroup order determines the
    curve subgroup order by ONE SUBTRACTION, and that the curve-versus-twist
    rho gap is below 2^-259 rather than the 2^-124 bound the family's
    consistency lattice currently asserts
  class: mechanism

  claim: >-
    E-521 is x^2 + y^2 = 1 - 376014 x^2 y^2 over p = 2^521 - 1. Four
    separable sub-claims. C1 and C2 are unconditional theorems requiring no
    computation at all; C3 and C4 are conditional on retrieved data and are
    one big-integer operation each.

    (C1) THE UNCONDITIONAL EQUALITY. RIGOROUS, ZERO COMPUTE, NO HYPOTHESIS ON
    THE CURVE WHATSOEVER. For any elliptic curve E over F_p with p = 2^521 - 1,
    the exact identity #E + #E^t = 2p + 2 becomes #E + #E^t = 2^522. By Hasse,
    #E is at most p + 1 + 2 sqrt(p), which is below 2^522, so
    v_2(#E) is at most 521; the same holds for the twist. If v_2(#E) were less
    than v_2(#E^t) then the 2-adic valuation of the sum would equal v_2(#E),
    forcing v_2(#E) = 522, which is impossible; symmetrically for the reverse.
    THEREFORE v_2(#E) = v_2(#E^t), UNCONDITIONALLY. E-521 IS THE ONLY ROW IN
    THE TWENTY-CURVE FAMILY WHERE THIS CONCLUSION NEEDS NO INPUT BEYOND THE
    MODULUS - every other matched row reaches it through
    IDEA-20260829-b41d39's forcing theorem, which requires knowing that
    v_2(#E) is less than s and hence requires at least one Legendre symbol.
    Here s = 522 exceeds the Hasse bound on the valuation, so the hypothesis
    is discharged by arithmetic rather than measured. The reason is entirely
    that 2^521 - 1 is a MERSENNE PRIME, which no other row's modulus is.

    (C2) THE SYMMETRY. #E = 2^521 - t and #E^t = 2^521 + t where t is the
    trace of Frobenius, so the two orders are placed symmetrically about a
    power of two, with |t| at most 2 sqrt(p) which is below 2^261.5. The
    curve and its twist therefore agree in their top 259 bits, and every
    quantity that depends on the orders only through their ratio - the rho
    cost above all - differs between them by an amount RIGOROUSLY BOUNDED by
    the trace. Explicitly, once both cofactors are h, the difference of
    log-base-2 rho costs is one half times log2((2^521 + t)/(2^521 - t)),
    whose absolute value is at most (1/(2 ln 2)) times 2|t|/2^521, that is
    BELOW 2^-259. IDEA-20260829-e37b52's instrument I3 asserts a Hasse
    residual below 2^-124 at 255 bits; at 521 bits with a Mersenne prime the
    same argument gives below 2^-259, and the cofactor term vanishes exactly
    rather than being computed, so the whole gap is below 2^-259. THE MIRROR
    PUBLISHES CURVE RHO COST 2^259.3 AND TWIST RHO COST 2^259.3 FOR E-521 -
    identical to the printed precision - which is the prediction target.

    (C3) THE 520-BIT CHECKSUM, AND THE DERIVATION OF ONE PUBLISHED INTEGER
    FROM ANOTHER. The mirror's twist table publishes E-521's cofactor as 2^2,
    its twist cofactor as 2^2, and its twist subgroup order l' as
    2^519 + 337554763258501705789107630418782636071904961214051226618635150085779108655765.
    IF both cofactors are exactly 4, then 4 l + 4 l' = 2^522, hence
    l + l' = 2^520 EXACTLY, hence l = 2^520 - l' - A ONE-SUBTRACTION
    DERIVATION OF THE CURVE'S PRIME SUBGROUP ORDER FROM THE TWIST'S,
    predicted to equal 2^519 minus that same 78-digit integer. This is
    IDEA-20260829-e37b52's identity I1 at its sharpest possible form, because
    the right-hand side is a pure power of two rather than 2p + 2 for a
    general p. It binds two independently transcribed integers on two
    different SafeCurves pages - the twist page and the prime-proofs page -
    by an identity that a random pair satisfies with probability about
    2^-520. A PASS IS THEREFORE A ROUGHLY 520-BIT CONSISTENCY SIGNAL BETWEEN
    TWO PAGES, and a failure localises a transcription defect to one of them.

    (C4) WHY THE WHOLE COMPLETE BLOCK OF THE TABLE LOOKS THE WAY IT DOES. The
    mirror's rho and twist tables give, for the eleven rows marked complete,
    curve and twist rho costs that are IDENTICAL to the printed precision for
    E-222, Curve1174, E-382, Curve41417, Ed448-Goldilocks and E-521, and that
    differ by EXACTLY 0.5 for M-221, Curve25519, M-383, Curve383187 and
    M-511. IDEA-20260829-e37b52 observes that a 0.5-bit gap is exactly one
    half times log2(8/4) and concludes the gap is cofactor bookkeeping rather
    than curve structure. THIS RECORD GOES ONE STEP FURTHER AND EXPLAINS THE
    COFACTORS THEMSELVES - by IDEA-20260829-b41d39's forcing theorem the
    cofactor ratio is determined by the residue class of p, so the 0.5-bit gap
    appears exactly on the p = 1 mod 4 rows and vanishes exactly on the
    p = 3 mod 4 rows. PREDICTED - the five rows with a 0.5-bit gap are exactly
    the five with p = 1 mod 4. That is a prediction about eleven published
    rows, falsifiable at zero compute cost against data already in the
    repository, and it converts e37b52's per-row observation into a family
    law.

  mechanism: >-
    THE TRACKED OBJECT is the PAIR SUM #E + #E^t, read 2-adically, together
    with the Hasse bound on the valuation of each summand. Two integers
    collapse to one, and that one is a pure power of two for exactly one
    modulus in the family.

    LOSSY-PROJECTION TEST (docs/inventor-protocol.md section 2), applied
    BEFORE any compute, which is the whole point of the test.
    WHAT IS DISCARDED. The curve entirely - its parameter d, its model, its
    base point, its completeness, its j-invariant, its discriminant, its whole
    group structure, and the trace itself. What is retained is the sum of two
    orders, which by the twist identity is a function of p alone. This is the
    most lossy projection in this batch by a wide margin.
    IS IT A CHANGE OF COORDINATES? Emphatically not. The fibre over the value
    2^522 is EVERY elliptic curve over F_p, a set of size Theta(p), and
    nothing whatever about any curve is recoverable from it. The object is
    informative precisely because its value is a constant - the same
    inversion of the usual logic that IDEA-20260829-e37b52 records for its
    residue vector, and it is worth noting that the two records arrive at it
    independently.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS THE AUDIT USES? Three
    operations, three answers, all deterministic. (i) QUADRATIC TWISTING acts
    on the pair by swapping its members and therefore leaves the sum EXACTLY
    invariant - the strongest possible compatibility, and the reason the
    object carries a twist conclusion at all. (ii) 2-ADIC VALUATION of the sum
    is v_2(2p + 2), computable from p alone, and the trichotomy on
    (v_2(#E), v_2(#E^t), v_2(sum)) is exactly the propagation rule. (iii)
    ISOGENY within the F_p-isogeny class preserves both orders and hence the
    sum; isogeny to a curve outside the class changes both and is out of
    scope. The retained part propagates deterministically under all three.
    WHERE THE STRUCTURE DISSOLVES, MEASURED AND STATED. The object determines
    the RELATION between the two valuations and NEVER either valuation - it
    cannot tell 4 from 8 for either curve or twist, and on E-521 it says only
    that whatever v_2(#E) is, v_2(#E^t) equals it. Getting the value requires
    IDEA-20260829-b41d39's symbol, and this record depends on that one for
    every claim in which the number 4 appears. Stated up front rather than
    discovered.

    WHY THE MERSENNE PRIME IS LOAD-BEARING AND NOT DECORATION. For a general
    p the forcing conclusion needs the hypothesis v_2(#E) less than
    s = 1 + v_2(p + 1), and s is small - 3 for E-222, 4 for Curve1174 and
    E-382, 5 for Curve41417, 2 for every p = 1 mod 4 row - so the hypothesis
    is a real constraint that must be checked by computing a symbol. For
    p = 2^521 - 1 one has s = 522, which EXCEEDS the Hasse bound
    log_2(p + 1 + 2 sqrt(p)) on the valuation of either order, so the
    hypothesis is vacuously true and the conclusion becomes unconditional.
    Ed448-Goldilocks is the nearest analogue with s = 225, which is large but
    NOT large enough - v_2(#E) could in principle be as large as 449 there,
    so that row still needs the symbol. E-521 is therefore the unique row
    where the theorem is free, and that is a property of the Mersenne shape
    and of nothing else.

    WHY THIS IS NOT IDEA-20260829-e37b52. That record proposes a family
    consistency lattice whose identity I1 is exactly this sum, and it is the
    honest nearest prior art inside this program. Three differences, all
    substantive. FIRST, e37b52 states that the repository holds no group
    order, cofactor or twist order for any of the twenty curves and that
    retrieval, not compute, is its binding constraint; that statement is now
    FALSE, because the repository contains a SafeCurves mirror with cofactors
    and twist subgroup orders for all twenty rows, which this record uses and
    which unblocks e37b52 as a side effect. SECOND, e37b52 treats I1 as a
    checksum with a modelled null; this record extracts an unconditional
    THEOREM from it on one row, which a checksum framing does not produce.
    THIRD, e37b52's I3 bounds the rho-gap residual by 2^-124 at 255 bits and
    attributes the gap to cofactor bookkeeping; this record sharpens the bound
    to 2^-259 at this row and explains the cofactors themselves by the residue
    class, which is a strictly stronger statement about the same eleven rows.

    EXECUTION. Step 1, zero compute - write out C1 and C2 as a derivation
    note. Step 2, one subtraction - compute 2^520 minus the published l' and
    compare against the l published on the mirror's prime-proofs page. Step 3,
    seconds - compute p mod 4 and the rho gap for all eleven complete rows and
    test C4's partition. Step 4, minutes - the toy validation of C1 at small
    Mersenne primes, where the whole identity can be checked against
    brute-force point counting. Step 5, seconds - combine with
    IDEA-20260829-b41d39's symbol for E-521 to certify the actual values 2
    and 2.

