idea:
  id: IDEA-20260920-204828
  question_id: RQ-GFPN-c01af8
  added: '2026-09-20'
  status: proposed
  approved_by: null
  title: >-
    Inversion through the field norm with the true inversion batched at
    base-field level (Itoh-Tsujii in the z^5 - 3 basis, diagonal Frobenius as
    arithmetic): a word-product tie or small loss bought for a 5x reduction in
    per-walk batch scratch, decided by whether the rho kernel is state-bound
  class: algorithm
  claim: >-
    In the affine rho step the denominator d = x_R - x_T in F_{p^5} can be
    inverted as d^{-1} = c / N(d), with c = d^(p + p^2 + p^3 + p^4) computed by
    two extension multiplications and three diagonal Frobenius maps (V1, V4)
    and N(d) = (d c)_0 in F_p (five word products plus one constant
    multiplication). The only true inversion is then of N(d) in F_p and can be
    Montgomery-batched across walks with ONE-word prefix products; the cofactor
    c overwrites the denominator slot in place, so the per-walk scratch beyond
    the point state is one word instead of the five words an extension-level
    prefix product needs. Derived per element at batch B, with M the extension
    multiplication cost, F = 4 the diagonal Frobenius cost and I_p the F_p
    inversion: norm path 2M + 25 + I_p/B word products; extension-level
    Montgomery path 3M + (2M + 17 + I_p)/B. At B = 16 that is a WIN of about 3
    word products with the schoolbook multiplier (76 versus 79) and a LOSS of
    about 8 with Karatsuba (56 versus 48). The claim, stated so it can fail: on
    the same kernel at the same register budget, (i) the two paths are within
    15% of each other in word products per step, in the direction derived
    above per multiplier; and (ii) steps per second under the norm path exceed
    the extension path by at least 10% at B >= 16 if and only if the kernel is
    state-bound, which the batch-size ladder decides. Both outcomes are
    reportable; the record is a measurement of where this kernel sits, not a
    speedup claim. Representation class R1 (RQ-ECDLP-623a32); stage whose
    charged cost moves: the inversion sub-stage of step arithmetic.
  mechanism: >-
    OBJECT FRAME (card C-4). Representation: affine F_{p^5} coordinates in the
    polynomial basis, with the batch inversion's prefix products held in F_p
    rather than F_{p^5}. Operation set Sigma: the full translation action of
    the r-adding walk. The tracked object is the lossless F1 walk-collision
    object; nothing is discarded, the lossy-projection test is passed
    trivially, and only the charged cost of the inversion sub-stage moves.
    Trichotomy: coordinate-dependent (Class III) for the cost, as in
    IDEA-20260920-0d218c.
    THE ARITHMETIC. In F_p[z]/(z^5 - 3) with p = 1 mod 5, the Frobenius
    a -> a^p multiplies the coefficient of z^i by zeta^i, zeta = 3^((p-1)/5)
    (V1): four constant base-field multiplications. Itoh-Tsujii: c = d^(p+p^2)
    . (d^(p+p^2))^(p^2) = d^(p+p^2+p^3+p^4), two extension multiplications and
    three Frobenius maps; N(d) = d c lies in F_p and is the constant
    coefficient of the product, so only that coefficient is computed (5 word
    products, plus the multiplication by 3 that folds the wrapped terms). Then
    d^{-1} = c . N(d)^{-1}, five word products once N(d)^{-1} is known.
    Batching: the forward pass stores the one-word prefix P_i = P_{i-1} N_i
    and overwrites d_i with c_i in place; one F_p inversion of P_B; the
    backward pass recovers N_i^{-1} with two word products each and scales c_i
    by it. Zero handling is identical to the extension path: N(d) = 0 iff
    d = 0, because the norm is multiplicative on a field.
    WHY THE COUNT IS A TIE AND THE STATE IS NOT. The extension path pays 3M
    per element for the prefix and backward products, all in F_{p^5}, and
    stores one F_{p^5} prefix per element (five words). The norm path pays
    2M + 3F + 5 to reach the norm, then one-word prefix and backward products,
    then a 5-word scale, and stores one word. The multiplication count nets to
    about zero at schoolbook M = 25 and to about +8 at Karatsuba M = 15; the
    scratch nets to one fifth. Whether one fifth of the scratch is worth
    anything is a property of the kernel: the sibling ECC2K-130 client
    measured +52% throughput from halving hot state at a HIGHER product count
    (batch 32 -> 16, products per update 5.156 -> 5.3125, hot state 244.91 ->
    121.54 MiB; BATCH-TUNING.md), and +14.76% from caching a denominator
    (DENOMINATOR-CACHE.md), which is why this record predicts a sign change in
    the steps-per-second delta with kernel regime rather than a fixed gain.
    FIELD FROBENIUS. The Frobenius here acts on FIELD ELEMENTS inside the
    inversion formula. It is never applied to a point, defines no equivalence
    class on E, and changes neither the walk nor the collision structure; per
    card C-2 it is arithmetic, and the record labels it so.
  novelty_status: unverified
  origin:
    kind: user_supplied_idea
    date: '2026-09-20'
    seeded_from_sketch: S2
    scope: >-
      Sketch S2 seeded in the 2026-09-20 conversation and handed over in
      TASK-20260920-0eace8 with the V4 arithmetic; the generator added the
      per-batch term, the in-place cofactor accounting that produces the 5x,
      the schoolbook win / Karatsuba loss split, and the state-bound
      discriminator.
    overlap_review: >-
      No record in ledger/ or knowledge/ proposes norm-based batched inversion
      for rho on any field (grep: Itoh, Tsujii, norm-based inversion, batched
      inversion, Montgomery trick; hits are CSIDH batch inversion
      IDEA-20260906-c9f6e0, the negation-walk records IDEA-20260807-6355c6 /
      IDEA-20260807-59fed3 which charge simultaneous inversion per step on
      prime fields, and H-PFDR-e0988d's sieve). RQ-ICPERF-94c86e owns matched
      rho on toy F_{p^n} cells; this record is an inversion-path variant on
      the deployed field and feeds ICPERF nothing until IDEA-20260920-0d218c's
      exchange rate exists. RQ-GRUMPY-964876, IDEA-20260731-010, H-GFPN-ee4d45
      and the GOAL-GFPN-380702 scope_exclusions are untouched. The sibling
      repository notes (/home/user/crypto/ecc2k130/BATCH-TUNING.md,
      DENOMINATOR-CACHE.md) are the precedent for "state is a lever"; they
      measure a binary-field GPU kernel and say nothing about F_{p^5}. Nearest
      owned record: IDEA-20260920-0d218c (this session), of which this is the
      inversion-path arm; what is added at deployed parameters: the
      base-field batching and its state accounting.
  citations:
    - ref: ledger/handoffs/TASK-20260920-0eace8.yaml
      provenance: internal
      claim: >-
        V1 (diagonal Frobenius by zeta^i), V4 (Itoh-Tsujii two extension
        multiplications plus three Frobenius maps; norm as constant coefficient;
        per-element 2M + 26 versus 3M; tie at schoolbook, about 10 loss at
