    lossy_projection_test: >-
      A, M-with-multiplicities and S are changes of coordinates: L2 and L3 recover one from
      another, so their ratios carry combinatorial weights and no new information about yield.
      The all-target mean is a lossy projection (it forgets the target) and is exact under every
