  claim: >-
    ANCHOR. CS-D2 of DEC-20261017-435b01, carried by KN-OPEN-62c870 Q3: the F_p-to-F_{q^n}
    transfer of the clause is "an untested extrapolation and no exponent statement is made".
    The clause itself, quoted only as superseded text (KN-FIND-c41ea9 via ff7415): "a per-fibre
    factor of 2 applied once per summation fibre in a Gaudry/Diem-style decomposition over
    F_{q^n} with n growing compounds as 2^{n-1} = q^{Theta(1)} and WOULD move an exponent".
    INDEX MAP [D]. A decomposition R = +-P_1 +- ... +- P_n into n factor-base points is
    S_{n+1}(x_1..x_n, x_R) = 0 (KN-LIT-673219 lines 249-274 [R]; KR-IC-5a43e5). So m = n + 1, and
    m - 1 is the number k of summed points in ANY field. The fibre has 2^{m-2} = 2^{n-1} sign
    classes with eps_1 = +1 (KN-FIND-4f0d84 Statement). In F_p a k-point decomposition has the
    same fibre, so the "2^{n-1}" is a function of the point count, not of the field degree.
    THREE READINGS. Y (yield): the exact relation rate at factor-base size B exceeds the
    Gaudry-Diem baseline 1/n! (the conservation mean) by a factor growing as 2^{n-1}. P (proxy):
    2^{n-1} is the ratio between the exact count and a quasirandom model carrying a Chebotarev
    complete-split factor. C (cost): 2^{n-1} as fibre degree or sign-finding cost.
    CLAIMS. (1) [D] Y is false for every n >= 2, every B, every finite abelian group: relation
    rate = coverage <= min(1, C(B+n-1,n)/N). At B = q, N = q^n this equals (1/n!)Prod_{i<n}(1+i/q),
    the Gaudry-Diem 1/n! that KN-LIT-673219 lines 329-349 [R] and KN-FIND-007 state. (2) [D with
    transfer T1 proposed] P is true: on generic x-tuples the complete-split frequency is
    phi_n = 2^{1-n} = 1/|G| for G = (Z/2)^{m-2} regular (KN-FIND-bdcd60 (1),(3), F_p), and on the
    factor-base locus it is 1 (KN-FIND-4f0d84); so exact/proxy = 2^{n-1}, which lifts the proxy
    exactly to the cap and not past it. (3) [D] No counted event differs by 2^{n-1}:
    A/M = n!/Prod(1+i/B), S/A = 1, X/M = 1 up to double roots. The only places 2^{n-1} or 2^n
    appear are universe-size bookkeeping (half base vs signed base, sign classes, R vs -R)
    that cancels. (4) C is not decided by this record. The disposition on Y and on the mean is
    reachable by derivation alone; measurement corroborates premises (report.md section 5).
  mechanism: >-
    The mechanism is a double count plus a monodromy count. Every ordered tuple of base points
    has exactly one sum, so each convention's all-target mean is its universe size over N
    (KN-FIND-007; ordered form: H-MONO-663fb4 (I1), same proof). Conventions differ only by
    universe-size ratios. The fibre of S_{n+1} has 2^{n-1} roots per ordered x-tuple, but there
    are ~(B/2)^n x-tuples (half as many per coordinate as points) and ~N/2 target x-classes
    (R and -R share x), so the factors cancel: mean root-hits per target = (B+t2)^n/N, equal to
    the ordered mean up to the 2-torsion term t2. The 2^{n-1} is real in one place: the regular
    action of (Z/2)^{m-2} (KN-FIND-bdcd60) makes |G| = deg = number of sign classes, so a model
    that multiplies a generic Chebotarev split factor 2^{1-n} underestimates the factor-base
    locus, where the split probability is 1, by exactly 2^{n-1}. The coincidence ff7415 noticed
    (sign classes = compounding factor) is therefore explained by regularity, and the
    correction repairs a proxy. At n = 2 it is the committed 1/freq_split ~ 2 (EV-MONO-a0a89c
    OBS-4, as EV-MONO-1ef611 R2 records it).
