      statement: >-
        sign-class count: for 2R != O, T_S(R) = sum over ordered point tuples with sum R of 2^j,
        j = number of 2-torsion entries; so T_S = T_A when no such entry. Proof is the bijection
        (x-tuple, eps) <-> point tuple with s(-eps) = -s(eps).
      responsibility: correctness
    - id: L4
      label: derived
      statement: >-
        X versus M: T_M(R) - T_X(R) = sum over x-multisets of (number of point multisets with
        sum R, minus 1), supported on x-multisets with a double root at x(R). Exact known
        answer at n = 2: T_M(O) = (B+t2)/2 and T_A(O) = B.
      responsibility: correctness
    - id: L5
      label: derived
      statement: >-
        cap: coverage c = P(T_M >= 1) <= min(1, mu_M); and c >= mu^2/E[T^2] by Cauchy-Schwarz.
        Hence no base of size B can exceed relation rate C(B+n-1,n)/N, at B = q the 1/n! limit.
      responsibility: size
    - id: L6
      label: "derived given T1"
      statement: >-
        origin of 2^{n-1}: P(Frobenius trivial on the 2^{m-2} roots) = P(all chi(f(x_i)) equal) =
        2^{1-n}(1+O(n/sqrt Q)) for uniform x_i in F_Q (bdcd60 (3) and Weil); equals 1/|G|. On
        the locus it is 1. Exact/proxy = 2^{n-1}.
      responsibility: interface
    - id: L7
      label: proposed
      statement: >-
        general-m form of the a51c82 factor: 2^{m-2} Prod_{i=1}^{m-2}(1 - i/W_eff), reducing to
        2(1-1/W_eff) at m = 3. Not derived here; stated so the design can check it against the F_p fixture.
      responsibility: scope
    - id: L8
      label: derived
      statement: >-
        quantifier: 2^{n-1} = q^{Theta(1)} forces n = Theta(log q). Even a genuine gain 2^{n-1}
        in the rate 1/n! would leave q^{-Theta(log log q)}: log_q(1/rate) changes by the
        relative amount ln2/(ln n - 1) -> 0. Not an exponent-class change.
      responsibility: scope
  proof_search_map:
    bottleneck: >-
      The identification of the rate the clause modifies with a quantity bounded by the exact
