  assumptions:
    - >-
      The counted event is frozen before execution as: ordered point tuples (A), point
      multisets (M), ordered x-tuples with sign classes hitting x(R) (S), x-multisets hitting
      x(R) (X), all reported per cell. A record reporting one convention is inadmissible.
    - >-
      Conservation denominators are exact rationals: A has B^n/N; M has C(B+n-1,n)/N; the
      generic-target mean is N_cf/(N-|S|) with N_cf the coefficient of z^n in
      ((1+z)/(1-z))^{(B-t2)/2} (1+z)^{t2} [D]. No null-model estimation step exists.
    - >-
      Curves are defined over F_Q with generic coefficients and j(E) not in F_q. A curve
      defined over F_q makes the subfield-line base equal to E(F_q) and degenerate.
    - >-
      The exhaustive grid is exhaustive over ALL N targets; sampling enters only in arm B and arm
      C, each marked sampled with its error.
  object_frame:
    off_limits_as_primary_lens: >-
