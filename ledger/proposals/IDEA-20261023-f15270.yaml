      indicator) is a lossy projection that separates bases. Cost: algebra only, no compute.
    operation_set_and_class: >-
      Operation set: translation by factor-base elements, partial action, Class I
      (IDEA-20260806-c5d183, index calculus). No non-translation operation set is proposed; the
