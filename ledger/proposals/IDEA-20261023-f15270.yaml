      reproduction_check: >-
        symbolic, report.md section 4.2: C(q+n-1,n)/q^n = (1/n!)Prod_{i<n}(1+i/q). Frozen
        fixtures to reuse, not re-measure: KN-FIND-007's 144-cell maximum absolute deviation 0
        [M]; the n = 2 exact known answer T_M(O) = (B+t2)/2.
    observation_collision:
      observable: >-
        the per-target count under a convention, or its mean over targets, and the trend of its
        ratio to a reference with n.
      distinct_preimage_search: >-
        Objects with the same ratio trend (2^{n-1} or 2^n): (i) a true yield gain; (ii)
        half-base versus signed base, |D^n|/|X^n| = (2B/(B+t2))^n; (iii) fixing eps_1 = +;
        (iv) R versus -R folding; (v) raw fibre degree per x-tuple; (vi) proxy versus exact,
        1/phi_n. All of (ii)-(vi) leave every all-target mean unchanged. They separate from (i)
        only by the per-target distribution: (i) would have to break coverage <= min(1, mu_M).
        n! and 2^{n-1} coincide at n = 2 and separate from n = 3 (6/Prod(1+i/B) vs 4).
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          hold the observable (all-target mean) fixed; vary the forgotten structure (base
          geometry). KN-FIND-007 supplies the fibre; coverage is the intrinsic invariant that
          separates its points (Sidon base 1.1071 [M] versus random 1).
        predicted_gain: none on any attack axis; the question is decided, not advanced
      - transform: representation_reduction
        proposed_object: >-
          conventions A, M, S, X as representations of one event with exact encoding maps
          (L2-L4); the hypothesis becomes an exact equality per target
        predicted_gain: removes the possibility of convention-fitting after the fact
    quantifier_order: >-
      Clause: for the family {E/F_{q^n}} with n -> infinity along some q(n), exists f > 1 with
      rate(E,n) >= f^{n-1} rate_QR(E,n). Refuted-by-derivation form (all n >= 2, all q, all
      E, all bases D of size B, all N): coverage(D) <= min(1, C(B+n-1,n)/N). The measurement is
      an existence statement over the tested cells. q depends on n in the only regime where
      2^{n-1} = q^{Theta(1)} (n = Theta(log q)); a fixed q ladder with n <= 5 never enters
      that regime and decides only the premises, never the asymptotic.
    method_ceiling:
      strongest_certifiable_claim: >-
        [D, pending independent re-derivation] for all n >= 2 the exact relation rate at base
        size B is at most C(B+n-1,n)/N, so no per-fibre factor lifts it above 1/n! (times
        Prod(1+i/q)). [measured, if run] no compounding detected at n <= 5 (and the n = 6, 7
        arm) at the tested q, never "does not compound". Reading C undecided.
      nearby_object_control: >-
        (a) n = 1 (and the prime-field window arm at k = 2..4 points): factor 2^0, all ratios 1.
        (b) the proxy object, where the clause is TRUE with slope 1 (PR-5). A method returning
        slope near 0 on both (b) and the yield has no power and may not claim a null.
    proof_obligations:
      - claim: A/M ratio equals n!/Prod(1+i/B) per cell with actual B
        responsibility: baseline
      - claim: every exhaustive cell is enumerable and its enumeration size is the declared count
        responsibility: feasibility
      - claim: no counted convention ratio tracks 2^{n-1} for n >= 3
        responsibility: strictness
      - claim: coverage <= min(1, mu_M) with c >= mu^2/E[T^2]
        responsibility: size
      - claim: T_S = T_A and T_M(O) = (B+t2)/2 hold in every exhaustive cell
        responsibility: correctness
      - claim: per-target law on generic targets is Poisson(lambda) within the tested tolerance
        responsibility: success_probability
      - claim: T1 transfer of 4f0d84 and bdcd60 (3) from F_p to F_Q
        responsibility: interface
      - claim: toy tier, n <= 7, no exponent, reading C undecided
        responsibility: scope
    not_applicable_reason: none
  predictions:
    - metric: PR-1 conservation_agreement_ratio
      direction: same
      vacuous_by_KN_FIND_007: "yes, as a test of the clause (identity over all targets)"
      minimum_effect: >-
        exhaustive cells: mean_all(T_M measured) / (C(B+n-1,n)/N) = 1 exactly (deviation 0, as
        KN-FIND-007's 144 cells [M]). Sampled cells: inside [1/1.582, 1.582] AND within 3
        binomial SE of 1. Outside: correction record, never absorbed. Power: counter and
        convention mix-ups only (a factor n! or 2^{n-1} >= 2 lies outside the band; a 40 percent
        defect passes it).
    - metric: PR-2a compounding_trend_all_target_mean
      direction: same
      vacuous_by_KN_FIND_007: "yes (slope identically 0)"
      minimum_effect: >-
        slope of log2(PR-1 ratio) against (n-1) is exactly 0, in [-0.15, 0.15]; compounding
        predicts 1.0. Kept so that its inability to fire is on the record.
    - metric: PR-2b compounding_trend_coverage_ratio
      direction: same
      vacuous_by_KN_FIND_007: "no, but it cannot fire except through a failed premise"
      minimum_effect: >-
        kappa_rel = coverage(line base)/coverage(matched random base) on generic targets; slope
        of log2 kappa_rel against (n-1) in [-0.15, 0.15]; compounding predicts 1.0. Derived
        ceilings log2 kappa_rel <= 0.346, 0.119, 0.030, 0.006 at n = 2..5 (B = q, Poisson null),
        so a fitted slope >= 0.5 is unreachable unless the cap, the Poisson null or the counter
        fails. Per-n values averaged over 3 curves; interval by bootstrap over curves.
    - metric: PR-3 convention_ratios
      direction: different
      vacuous_by_KN_FIND_007: "partly (means are identities; per-target identities L2-L4 are not)"
      minimum_effect: >-
        exact per cell: A/M mean = n!/Prod(1+i/B); T_A = sum n!/Prod(m_j!) per target; T_S = T_A
        for 2R != O and t2 = 0, else sum 2^j; T_X = T_M up to double roots. None tracks 2^{n-1}
        for n >= 3. At n = 2 the n!-versus-2^{n-1} pair is not separable (both 2). Artifact label
        needs a ratio that tracks 2^{n-1} or 2^n and is separable from n!.
    - metric: PR-4 split_completeness_transfer
      direction: same
      vacuous_by_KN_FIND_007: "not applicable (not a yield metric)"
      minimum_effect: >-
        on the factor-base locus S_{n+1}(x_1..x_n,T) = c Prod over classes with s != O of
        (T - x(s)) at 100 percent of tested squarefree full-degree tuples, n = 2..5, over F_Q.
        Historical only: "193/193 at m = 4" from the superseded entry.
    - metric: PR-5 split_factor_compounding
      direction: higher
      vacuous_by_KN_FIND_007: "no (not a mean)"
      minimum_effect: >-
        measured generic complete-split frequency phi_n within 3 binomial SE of 2^{1-n}; slope
        of log2(1/phi_n) against (n-1) in [0.85, 1.15], predicted 1.0. This is the one real
        2^{n-1}; it is the positive control PC-B and the proxy half of the two-part shape.
    - metric: PR-6 per_target_law
      direction: same
      vacuous_by_KN_FIND_007: "no (distribution metric)"
      minimum_effect: >-
        on generic targets the empirical CDF of T_M is within the stated tolerance of Poisson
        (lambda tied to N_cf) and coverage within 3 SE of 1 - e^{-lambda} (arm C, section 6).
  dispositions:
    - id: CLAUSE_REFUTED_AT_TOY
      meaning: >-
        readings Y and the mean are refuted at the tested cells: PR-1, PR-2b, PR-3, L5 agree,
        controls detect. Emitted with CONVENTION_ARTIFACT_DIAGNOSED when PR-5 agrees (compatible,
        not exclusive: one concerns yield, the other origin).
    - id: CONVENTION_ARTIFACT_DIAGNOSED
      meaning: >-
        2^{n-1} is exhibited as a ratio between bookkeeping conventions or model versus exact
        (proxy form via PR-5; or counting form via a ratio that tracks 2^{n-1} and is not n!).
    - id: CLAUSE_SUPPORTED
      meaning: >-
        F1 fires (slope >= 0.5 on PR-2b) or the cap is exceeded at a cell. Mandatory
        deliverable then: event identification, because the measured event is not the counted
        event, or a premise is false. No exponent claim until identified.
    - derivation_alone: >-
        Readings Y and the mean are decided by L1-L5 without a run [D]. The three names above
        need the measurement and are assigned by the Coordinator, not by this record. The
        cheapest artifact that makes the derivation official is a blind re-derivation review of
        L1-L6 (zero runs, as for KN-FIND-4f0d84), then a knowledge entry for KN-OPEN-62c870 Q3.
        The grid corroborates premises T1 and HEUR-F-1, F-2.
    - prior: >-
        subjective, recorded before any work: at least 0.90 that the measurement agrees with the
        derivation. Disagreement paths: derivation error, failed transfer T1, counter defect,
        or the clause meaning reading C. DEC-20261023-19c53b recorded 0.85 for artifact or
        refuted.
  minimal_test:
    design: >-
      Derivation first (review). Arm A exhaustive grid n = 2..5 over all targets (section 6).
      Arm B generic split frequency phi_n, 10^6 uniform x-tuples in F_Q^n per curve per n. Arm
      C sampled validation at Q between 2^30 and 2^32 (toy tier) for n = 2..7, with an optional
      extension to 2^36 (medium tier by the mechanical rule). Optional arm D prime-field window
      base, k = 2..4 points, same convention table. Contract frozen with hash before any run;
      both conventions and all predictions in it.
    grid:
      curves: >-
        per (n, q): 3 curves from seed policy; coefficients (a,b) uniform over F_Q, reject
        singular and reject j in F_q (also removes j = 0, 1728); F_Q = F_q[t]/(least monic
        irreducible of degree n). Identity fields frozen by the design step: q, n, modulus,
        a, b, N by exhaustive count, t2, B, |X|, seed. Group: E(F_Q), order N.
      factor_base: "D = {P in E(F_Q) minus O : x(P) in F_q}; B ~ q (expected q + O(sqrt q))"
      target_set: >-
        all N points (identity); generic targets = all minus E[2], O and the sums of n-2l base
        points (cancelling pairs), size N - |S| with |S| ~ q^{n-2}/(n-2)!
      n1: {q: [61, 251], note: "D = E(F_q) minus O, all ratios must be 1"}
      n2: {q: [61, 251, 1021, 4093], Q: [3721, 63001, 1042441, 16752649], multisets_at_B_eq_q: [1891, 31626, 521731, 8378371]}
      n3: {q: [17, 41, 101, 251], Q: [4913, 68921, 1030301, 15813251], multisets_at_B_eq_q: [969, 12341, 176851, 2667126]}
      n4: {q: [11, 23, 53, 101], Q: [14641, 279841, 7890481, 104060401], multisets_at_B_eq_q: [1001, 14950, 367290, 4598126]}
      n5: {q: [7, 11, 17, 29], Q: [16807, 161051, 1419857, 20511149], multisets_at_B_eq_q: [462, 3003, 20349, 237336]}
      enumeration_note: >-
        multisets at B = q are C(q+n-1,n), derived counts; ordered x-tuple incidences are
        (B+t2)^n/2. Actual B differs from q by O(sqrt q). Cells with B < n^2 are flagged
        repeat-dominated and fits are reported with and without them. All 48 grid cells
        (4 n x 4 q x 3 curves) plus 6 anchors are exhaustive; none is sampled. The largest
        Q = 104,060,401 is below 2^27, toy tier by the mechanical rule.
      bases_per_curve: "line base; matched random symmetric base (null); half-size random base (failing twin)"
    controls:
      - >-
        (a) NULL BASE: uniformly random symmetric base of size B (t2 matched where available).
        All-target mean ratio 1 by KN-FIND-007: exact equality in exhaustive cells, 3 SE in
        sampled ones. A defect is an instrument fault. Pairs with a failing twin (OI-1 repair 3).
      - >-
        (a2) FAILING TWIN: random symmetric base of size ceil(B/2). Predicted mean ratio to the
        full base = C(B/2+n-1,n)/C(B+n-1,n), about 2^{-n}. The counter must show it; a counter
        that does not has no power and voids the family.
      - >-
        (b) NEARBY OBJECT n = 1: all conventions equal, factor 2^0. Any other value is a defect.
        Prime-field window arm D (k = 2..4 points) carries the same convention table.
      - >-
        (c) POSITIVE CONTROLS, detection required before any null is claimed. PC-A: slope of
        log2(A/M) against (n-1), derived 1.97 at B -> infinity (log2 n! = 1, 2.585, 4.585,
        6.907 at n = 2..5; actual-B value from L2), required within 0.15 of the L2 value. PC-B:
        slope of log2(1/phi_n) = 1.0 (PR-5). PC-C: the failing twin ratio. Failure of any: F6.
      - >-
        (d) KNOWN ANSWERS: n = 2 cells T_M(O) = (B+t2)/2, T_A(O) = B exactly; split completeness
        on the locus (KN-FIND-4f0d84, F_p scope; the F_p fixture is its committed corroboration
        [M, CS-QB: m = 3, 4 exhaustive, m = 5 random, zero exceptions]).
      - >-
        (e) EXACT DENOMINATOR: every ratio is against an exact rational; no certifying gate.
    required_metrics:
      - per cell and convention (A, M, S, X) the mean over all targets, and the generic-target mean
      - exact A/M, S/A, X/M ratios against L2-L4 per cell
      - coverage on generic targets for line, null and twin bases; kappa_rel; slope with interval
      - split-completeness fraction on the locus (n = 2..5) and phi_n with SE
      - T_M(O) and T_A(O) at n = 2
      - per-cell B, t2, |X|, N, |S|, repeat fraction
  validation_arm:
    purpose: >-
      heuristic-validation arm of DEC-20261017-12e0f4 successor_after_this_lane and
      docs/target-result-profile.md C12. Design specification only.
    method: >-
      target-sampled, base-exhaustive: enumerate all C(B+n-1,n) multisets once, sum each, and
      look the sum up in a hash set of s sampled target classes (R and -R share a class); no
      table of size N. Counts per sampled target are exact. N by an SEA/Schoof point counter.
    scale: >-
      Q between 2^30 and 2^32 (toy tier by the mechanical rule, docs/claims-and-verification.md):
      n = 2: q about 2^15..2^16; n = 3: q about 2^10; n = 4: q about 2^8; n = 5: q about 2^6;
      n = 6: q = 37; n = 7: q = 23. Multisets per cell about Q/n! (at Q = 2^32: 2.1e9, 7.2e8,
      1.8e8, 3.6e7 for n = 2..5; C(42,6) = 5,245,786 for n = 6, q = 37; C(29,7) = 1,560,780 for
      n = 7, q = 23), derived counts, not timings. An optional extension to Q about 2^36
      (n = 6, q = 61; n = 7, q = 31) is MEDIUM tier by the mechanical rule (32 < bits <= 96),
      still far from cryptographic scale. n = 6, 7 sit at B/n^2 about 1.0 and 0.47:
      repeat-dominated, handled exactly by L2.
    instance_and_seed_policy: >-
      curve seed = SHA-256 of the string f15270|n|q|index; PRNG named by the design step; 3
      curves per (n, q); targets by uniform x in F_Q with chi = +1 and a uniform sign; one
      representative per +-class; a null base and a twin base per curve; all seeds in the contract.
    random_model: >-
      T_M(R) for generic R is Poisson(lambda), lambda = (N_cf - m_S)/(N - |S|), N_cf the
      coefficient of z^n in ((1+z)/(1-z))^{(B-t2)/2}(1+z)^{t2} and m_S the exact count of
      cancellation-free multisets summing into S (relative size about q^-2). lambda is tied to
      the conservation mean through L1-L2. The count at R and -R is identical, so classes are
      the independent units.
    sample_sizes: >-
      s >= (1-c)/(c eps^2) with c = 1 - e^{-lambda}, eps = 0.03 relative SE on coverage
      (binomial). At nominal lambda = 1/n! (an upper bound on s, since the actual lambda is larger
      at small B): n = 2: 1.7e3; n = 3: 6.1e3; n = 4: 2.6e4; n = 5: 1.3e5; n = 6: 8.0e5; n = 7:
      5.6e6 (derived). Power: a coverage ratio of 1.10 against 1 is detected at 3.3 SE; the
      clause's 2^{n-1} and the cap 1.582 are many SE away.
    machine_readable_output: >-
      one JSON file per cell, results/<cell_id>.cdf.json, keys: cell_id, n, q, curve_id, seed,
      B, t2, N, lambda, s, hist (count -> number of targets), cdf_empirical, cdf_poisson,
      ks_stat, chi2_stat, chi2_df, zero_fraction, coverage, dispersion_index, max_count,
      p_max_pred, exceptional_targets (list of count at targets in S).
    tail_consistency_checks: >-
      (T1) observed maximum count versus the Poisson order statistic, P_pred(max >= observed)
      >= 0.001; (T2) the fraction of targets with count >= 3 versus Poisson; (T3) zero fraction
      versus e^-lambda; (T4) structural tail: counts at R in S exceed Poisson by construction
      (n = 3, R in D: T_M(R) >= |X|); report separately as a counter-sensitivity check.
  falsification_conditions:
    - >-
      F1 slope of log2 kappa_rel >= 0.5 (ff7415 F1, threshold kept). Cannot fire on the
      all-target mean. On PR-2b it fires only if the cap, the Poisson null or the counter
      fails; then identify the event before any exponent claim.
    - >-
      F2 null-base control does not return exactly 1 (exhaustive) or within 3 SE (sampled):
      counter defective, every cell void.
    - >-
      F3 split completeness not reproduced on the locus over F_Q: a failed transfer T1, a
      scoped negative on T1 only. It contradicts KN-FIND-4f0d84 only if the F_p fixture also fails.
    - >-
      F4 phi_n outside 3 SE of 2^{1-n} at n = 2, or the slope outside [0.85, 1.15]: the proxy
      reading P, or DEC-20260802-a51c82's formula at its m = 3 slice, is wrong.
    - >-
      F5 PR-1 ratio outside [1/1.582, 1.582], or not exactly 1 in an exhaustive cell:
      correction record, never absorbed.
    - >-
      F6 any positive control PC-A, PC-B, PC-C not detected: no null may be claimed and the
      family is void as a refutation (the derivation is unaffected).
    - >-
      F7 any exact identity L2-L4 fails in an exhaustive cell: derivation error, correction record.
    - >-
      F8 Poisson dispersion or coverage outside tolerance: HEUR-F-1 refuted at the tested scale
      only. The cap L5 stands and the clause is not revived.
  confounders:
    - >-
      Toy scale cannot see an asymptotic. The honest reading of a null is "no compounding
      detected at n <= 5 (and n = 6, 7 at small q) at the tested q". The derivation, not the
      grid, covers all n.
    - >-
      B versus n^2. At small q repeated points dominate, so A/M falls well below n! (n = 5,
      B = 7 gives 36.4, not 120). The exact L2 value is the comparator, never n!.
    - >-
      2-torsion and cancelling pairs. t2 <= 3 perturbs L3 at relative order n t2/B; targets in S
      and E[2] carry outlier counts (T_M(O) = (B+t2)/2 at n = 2) and are reported separately.
    - >-
      n and q are separate knobs, and the clause mixes them (2^{n-1} = q^{Theta(1)} needs n =
      Theta(log q)). The ladder varies them independently; a result that cannot separate them is
      reported as unseparated.
    - >-
      The clause may refer to per-attempt success inside one algorithm or to cost (reading C).
      The cap bounds relations per target, hence attempts times success, not cost.
  interpretation_limits:
    - >-
      Toy tier. THIS MOVES NO EXPONENT IN EITHER DIRECTION. A refutation removes an overstated
      clause; it does not make prime-field ECDLP harder or easier. Confirmation would not be an
      attack: a relation-rate factor is one term of a cost model and KN-FIND-007 caps the gain
      at 1.582 under one-relation-per-target. The grid and arm C at Q up to 2^32 are toy tier;
      the optional 2^36 extension would be medium tier by the mechanical rule, a transfer-record
      point and not a cryptographic-scale claim.
    - >-
      CS-D2 of DEC-20261017-435b01 and CS-R7 of DEC-20261022-a0f165 bind every citation, by
      reference through KN-OPEN-62c870: the transfer from F_p to F_{q^n} is an untested
      extrapolation; nothing concerns cryptographic scale or security estimates.
    - >-
      Reading C (fibre degree, Groebner cost, solve cost) and the relation-rank half of
      KN-OPEN-62c870 Q1 are untouched. Larger factor bases (B above q) and target-dependent
      bases (KN-OPEN-020) are untouched.
    - >-
      Conditional parts (L6 given T1; coverage statements given HEUR-F-1, F-2) are recorded
      under the two-record rule of docs/claims-and-verification.md by the review step; a
      derivation here is level 2 ("derivation", never "proved").
  heuristic_assumptions:
    - id: HEUR-F-1
      statement: >-
        For generic targets R uniform in E(F_Q), T_M(R) is distributed as Poisson(lambda) up to
        total variation O(1/B) at B >> n^2, lambda = (N_cf - m_S)/(N - |S|).
      rigorous_support: >-
        exact first moment (L1-L2); exact ordered second moment Var = N^-2 Sum_{chi != 1}
        |S^(chi)|^{2n} (H-MONO-663fb4 (I2), Parseval, valid on any finite abelian group); the
        classical Poisson approximation for sums of weakly dependent indicators (recalled
        pointer only: Chen-Stein; no agent has read a source here).
      validation_plan: >-
        arm C at Q between 2^30 and 2^32 (optional 2^36), n = 2..7, 3 curves, s from the
        sample_sizes rule; empirical CDF against Poisson; dispersion index, coverage, T1-T4
        tails; output as in validation_arm. Tested parameters recorded per cell; transfer
        assumption: Poisson at the tested (q, n) is indicative at larger q for the same n
        (B/n^2 grows).
    - id: HEUR-F-2
      statement: >-
        A matched uniformly random symmetric base has coverage 1 - e^{-lambda} (the null of
        PR-2b and of KN-FIND-007's 1.582 bound).
      rigorous_support: >-
        c <= min(1, mu) exactly and c >= mu^2/E[T^2] (L5); the Poisson form is the HEUR-F-1 limit.
      validation_plan: >-
        null and twin bases per curve in arms A and C; coverage against 1 - e^{-lambda}, with the
        Cauchy-Schwarz bracket reported per cell; the bracket is rigorous, the Poisson point is not.
    - id: HEUR-F-3
      statement: >-
        T1: KN-FIND-4f0d84 (root multiset, split completeness on the locus) and KN-FIND-bdcd60
        (3) (Frobenius rule, 2^{1-n} generic split) hold verbatim over F_Q, q odd prime > 3.
      rigorous_support: >-
        both derivations use only the group law, Semaev's defining property and the Kummer
        group (Z/2)^{m-1}; nothing is specific to F_p. Committed scope is F_p, toy tier.
      validation_plan: >-
        arm A exhaustive known answers at n = 2, 3 and sampled at n = 4, 5; arm B phi_n with 10^6
        tuples per curve per n; tail: smallest observed frequency against 2^{1-n}. S_{n+1}
        evaluated numerically by the resultant recursion, cross-checked by the group-law method.
    - id: HEUR-F-4
      statement: >-
        Behaviour at n <= 7 and the tested q is indicative of the n-growing regime.
      rigorous_support: >-
        NOT SUPPORTED for the measurement. The derivation L1-L5 is closed form in n and needs no
        extrapolation; only HEUR-F-1 does.
      validation_plan: >-
        report the slope with its interval and the scale limit in every citation; a null is
        reported only as "no compounding detected at n <= 7".
  target_complexity:
    time_exponent: >-
      No attack proposed. The object is a dimensionless ratio against an exactly known
      denominator. Time and memory exponent not applicable.
    memory_exponent: not applicable
    best_known: >-
      Over E(F_{q^n}), n fixed: Gaudry-Diem O~(q^{2-2/n}) with hidden constant growing like
      n! 2^{n(n-1)} (KR-IC-46d822, heuristic, abstract_read; KN-LIT-673219 lines 63-66 [R] states
      it over-exponential in n); rho q^{n/2}. Prime fields: no attack better than rho for
      general curves (KR-IC-9e610d).
    hidden_overhead: >-
      None charged; no algorithm runs and no cost is compared. The clause's 2^{n-1} is a lower
      order term against the published 2^{O(n^2)} constant (L8); this reads relative to an
      upper bound and says nothing about the true cost.
    tradeoff_note: not applicable
  dominated_by: "n/a (no result claimed)"
  sota_delta: >-
    No attack; measurement/correction contribution only. Quantitatively: the clause would put
    the relation rate 2^{n-1} above the published 1/n! baseline (2, 4, 8, 16 times at n = 2..5);
    L5 caps the rate at (1/n!)Prod(1+i/q), a ratio of 1 to the baseline. Frontier rows checked:
    KR-IC-46d822, KR-IC-64659b, KR-IC-5a43e5, KR-IC-081a58, KR-IC-955fd6, KR-IC-5931ee,
