idea:
  id: IDEA-20260816-d7d873
  question_id: RQ-POLYMAC-7c89e4
  added: '2026-08-16'
  title: 'Authentication-key persistence is the structural difference the deployed pair confounds
    with the field: build the two-by-two of field crossed with per-nonce key refresh, measure how
    the multi-query forgery optimum grows in q in each cell, and report the interaction'
  class: control
  claim: '(A) The two deployed constructions differ in a way that is not about the field at all: in
    one, the authentication key is fixed for the lifetime of the encryption key and every nonce reuses
    it; in the other, the authentication key is derived per nonce from the keystream and therefore
    changes with every message. This is a difference in the OBJECT the adversary is accumulating information
    about, and it is confounded with the field difference in every comparison anyone can make using
    only the deployed pair. (B) The claim is that the confound is removable by construction, with
    a two-by-two: binary field with persistent key, binary field with per-nonce refresh, prime field
    with persistent key, prime field with per-nonce refresh. Two of these cells exist in deployment
    and two do not, and the two that do not are what identify persistence as an operator. (C) The
    measured quantity is the growth of the optimal q-query forgery probability in q: with a persistent
    key the accepted-key sets across queries live in one key space and their union grows sublinearly
    once root sets overlap, while with a per-nonce refresh each query concerns an independent key
    and the optimum should grow linearly in q with no overlap saving. The claim is that this qualitative
    difference is measurable exactly at toy widths, that its magnitude is the interaction term of
    the two-by-two, and that it is LARGER than the field main effect. (D) A secondary product is a
    direct check of whether the union-of-root-sets model - which every other contract in this batch
    uses for multi-query optima - actually describes the persistent case, since the refresh cells
    provide the no-overlap baseline against which overlap savings are read. (E) WHAT IS NOT CLAIMED:
    nothing about which deployed construction is better, which is a comparison this bucket forbids;
    no attack; no claim that per-nonce refresh is a mitigation or that persistence is a weakness;
    and no statement about deployed key derivation, which is modelled here as an idealised fresh draw
    and is not the real derivation.'
  mechanism: 'STAGE 1 defines the refresh operator narrowly: in a refresh cell, each query is answered
    under an independently drawn authentication key, with everything else - field, encoding, mask
    model, message space, forger strategy family - held identical to the persistent cell. Exactly
    one thing changes. STAGE 2 computes, in each of the four cells, the optimal probability that at
    least one of q queries is accepted, exhaustively: in a persistent cell this is the maximum union
    popcount of q root sets over the declared strategy family; in a refresh cell it is the probability
    that at least one of q independent keys falls in its own query''s root set, which is computed
    exactly from the per-query root-set cardinalities without any union. STAGE 3 sweeps q and fits
    the growth in each cell as a rate, reporting the exact per-step increment rather than a fitted
    slope, since the numbers are exact. STAGE 4 forms the two-by-two: persistence main effect, field
    main effect, interaction. STAGE 5 runs the null: a random-function digest in all four cells, where
    persistence should still matter (union savings exist for any function) but the degree ceiling
    does not, separating the part of the persistence effect that is generic from the part that is
    polynomial-specific. Refutation: if the persistent and refresh cells show identical growth in
    q, the union-of-root-sets model contributes nothing at these parameters and every multi-query
    number elsewhere in this batch is a single-query number in disguise.'
  novelty_status: unverified
  novelty_screen:
    method: Greps for POLYMAC, GHASH, Poly1305 as recorded for this batch; targeted greps for per-nonce,
      rekey, rekeying, subkey derivation, key derivation and persistence across ledger/proposals and
      ledger/questions; read the anchor question's paired-construction target paragraph and GOAL-POLYMAC-001's
      objective; read IDEA-20260809-3a39bc for its treatment of the keystream-derived mask.
    results: RQ-POLYMAC-7c89e4 frames the pairing as one construction over two fields and names the
      field as the structural difference; it does not name authentication-key persistence as a second,
      separately varying axis, and neither does GOAL-POLYMAC-001. IDEA-20260809-3a39bc mentions a
      keystream-derived mask as a feature distinguishing the two constructions, in the context of
      commitment-certificate cost, and does not treat key persistence across nonces or measure anything
      in q. No ledger record contains a two-by-two over field crossed with key persistence, and no
      record measures multi-query growth for a MAC. The nine RQ-AEADC-8db132 proposals are single-predicate
      commitment records.
    verdict: 'UNVERIFIED. No claim about external literature is made. What is claimed new WITHIN THIS
      REPOSITORY: naming authentication-key persistence as a second structural axis that the deployed
      pair confounds with the field, and constructing the two non-deployed cells that separate them.
      What is assembled from known parts: the union-of-root-sets model is this batch''s shared machinery
      and is here put under test rather than used; the two-by-two design mirrors the clamping-ablation
      entry deliberately, because the two entries remove the two independent confounds of the pairing
      and neither is complete without the other.'
  object_first_candidate:
    tracked_object: The SEQUENCE OF ACCEPTED-KEY SETS across a query schedule, together with the identity
      of the key space each one lives in. In a persistent cell all q sets live in one key space and
      the object is their union; in a refresh cell each set lives in its own independent copy and
      the object is a tuple of unrelated sets. The tracked object is the whole sequence plus its ambient-space
      bookkeeping.
    lossiness: 'Lossy. It discards the messages, the nonces, the masks, and which specific keys are
      accepted, retaining the cardinalities and - crucially - the identification or non-identification
      of the ambient spaces. That last piece of bookkeeping is what makes the projection informative
      rather than cosmetic: two cells with identical per-query cardinalities behave completely differently
      depending on whether the spaces are identified, and the projection retains exactly that bit.
      It is not a change of coordinates, since a persistent schedule and a refresh schedule with the
      same per-query cardinalities are indistinguishable under any projection that forgets the ambient
      identification.'
    propagation: One additional query acts differently in the two persistence regimes, and that difference
      is the whole experiment. In a persistent cell the new root set is unioned into the existing
      accepted-key set, so the increment is the new set's cardinality minus its overlap with what
      is already there, and the increment shrinks as the union grows. In a refresh cell there is no
      overlap to subtract and the increment is the full per-query probability every time. So the propagation
      rule differs in its second term, and the interaction the contract measures is exactly the size
      of that second term in each field.
    survival_score: 'The object survives across the full q sweep in every cell at the tested widths,
      exactly. It DISSOLVES at three named points. First, when q grows large enough that the persistent
      union saturates the key space, after which the increment is zero and the two regimes are maximally
      separated but the measurement is no longer informative about rates. Second, when the forger
      is adaptive, since then the strategy family is not fixed and the union is over a schedule-dependent
      family. Third, at the modelling boundary: the refresh cell draws a fresh key independently,
      whereas a real per-nonce derivation is a function of a fixed key and the nonce, so the refresh
      arm is an idealisation and the record states this rather than treating the two as equivalent.'
  null_object_control: 'The random-function null runs in all four cells in the same invocation, and
    it is the control that separates generic union savings from polynomial-specific ones: for any
    function, persistent queries share a key space and their accepted-key sets can overlap, so a persistence
    effect exists in the null too and its size is computable analytically. For the signal cells to
    mean anything, their persistence effect must EXCEED the null''s by more than the resolution floor;
    if it does not, the union savings are generic and the polynomial structure contributes nothing
    at these parameters. A second control is a NO-OP refresh: a cell in which a fresh key is drawn
    per query but from the same distribution and then discarded in favour of the persistent key, which
    must reproduce the persistent cell exactly - confirming that the refresh plumbing itself does
    not change the measurement.'
  discriminated_from:
  - 'The clamping-ablation entry in this batch: that varies a KEY CONSTRAINT at fixed persistence.
    This varies PERSISTENCE at fixed constraint. They are the two independent confounds of the deployed
    pairing and together with the encoding entry make three; none subsumes another.'
  - 'The ratio-surface entry in this batch: that uses the union-of-root-sets model to compute multi-query
    optima. This record puts that model under test by supplying the no-overlap baseline it lacks.'
  - 'The nonce-misuse entry in this batch: that measures what repeated nonces reveal about a key.
    This measures how forgery success accumulates across DISTINCT nonces, with the key either persisting
    or not; the misuse model there is absent here entirely.'
  - 'IDEA-20260809-3a39bc: names the keystream-derived mask as a feature affecting certificate cost.
    It does not vary persistence, does not measure anything in q, and is about commitment.'
  - 'Any comparison of the two deployed constructions directly: that comparison confounds field, encoding,
    constraint and persistence at once, which is why this bucket needs the constructed cells rather
    than the deployed pair alone.'
  assumptions:
  - An independently drawn fresh key per query is an acceptable idealisation of per-nonce key derivation
    for the purpose of isolating persistence. This is a declared idealisation and is the record's
    largest modelling gap.
  - Exactly one variable changes between a persistent cell and its refresh counterpart, verified by
    the no-op refresh control.
  - The declared non-adaptive strategy family is adequate in both regimes, or all optima are lower
    bounds and are labelled so.
  - The resolution floor from the ladder contract is available, so that the persistence effect can
    be compared against the null's generic effect meaningfully.
  predictions:
  - metric: no-op refresh cell optimum versus persistent cell optimum
    direction: different
    minimum_effect: exactly equal at every q; any difference means the refresh plumbing itself perturbs
      the measurement and halts interpretation
  - metric: per-query increment in the refresh cells as q grows
    direction: different
    minimum_effect: constant in q to within the resolution floor, since independent keys give no overlap
      savings; drift indicates a bug
  - metric: persistence effect (persistent minus refresh optimum at q = 4) in the signal cells, minus
      the same quantity in the null cells
    direction: higher
    minimum_effect: the contract pre-commits to calling the polynomial structure contributory only
      if this difference exceeds one resolution-floor unit; no magnitude is pre-committed, because
      it depends on the achievable root structure that the encoding entry is separately measuring
  - metric: interaction term (persistence effect in the binary field minus persistence effect in the
      prime field)
    direction: different
    minimum_effect: reported with its exact value and its prime-sweep spread; declared uninformative
      if smaller than that spread
  minimal_test:
    design: 'Fix n = 12 and n = 16, L = 4, and q in {1, 2, 4, 8}. Build eight cells: four signal (two
      fields crossed with persistent and refresh) and four null (the same with a random-function digest),
      plus the no-op refresh check. In each cell compute the exact optimal probability that at least
      one of q queries is accepted - by maximum union popcount over the declared strategy family in
      persistent cells, and by the exact independent-key formula from per-query root-set cardinalities
      in refresh cells. Emit the four-cell two-by-two of persistence effect at q = 4, its interaction,
      and the corresponding null two-by-two. This is minutes of pure-Python work reusing the shared
      enumeration. The discrimination is one comparison and it is decisive. If the persistence effect
      in the signal cells exceeds the null''s by more than a floor unit, the union savings are polynomial-specific
      and the interaction says whether the two fields save equally. If it does not exceed the null''s,
      persistence acts generically and the entire multi-query apparatus in this batch is measuring
      an effect that any function would show - which is exactly the kind of controlled null the inventor
      protocol section 3 demands before belief.'
    controls:
    - No-op refresh cell, which must reproduce the persistent cell exactly.
    - Random-function null in all four cells, giving the generic persistence effect analytically and
      by measurement.
    - Five-prime sweep per width for the prime cells.
    - 'Single-variable assertion: the refresh cells differ from their persistent counterparts in exactly
      one code parameter, checked by diffing the recorded configuration blocks.'
    - Per-query root-set cardinalities recorded in both regimes so that the refresh formula and the
      persistent union use the same inputs.
    required_metrics:
    - optimal q-query acceptance probability per (cell, q)
    - per-query increment per (cell, q)
    - persistence effect per field at each q
    - interaction term across the two-by-two
    - null-cell persistence effect
    - no-op refresh discrepancy (required zero)
  falsification_conditions:
  - The no-op refresh cell does not reproduce the persistent cell exactly.
  - The refresh cells' per-query increment drifts with q beyond the floor, indicating overlap where
    independence was constructed.
  - The persistent cells' union popcount ever exceeds the sum of the individual root-set cardinalities,
    an impossibility and therefore a code fault.
  - The configuration diff shows more than one variable differing between a persistent cell and its
    refresh counterpart.
  - The signal cells' persistence effect does not exceed the null's, which refutes the polynomial-specific
    reading and stands as the controlled-null result.
  - The interaction term is smaller than the prime-sweep spread, so field and persistence cannot be
    separated at these parameters.
  confounders:
  - 'The refresh idealisation: an independently drawn key is not a nonce-derived key, and any effect
    measured is an effect of independence, not of any real derivation.'
  - Encoding differences between the fields restrict achievable root sets before persistence enters,
    so the interaction term inherits the encoding entry's unresolved correction.
  - 'Saturation: at large q in a small key space the persistent union fills the space and the effect
    is bounded by the space rather than by the structure.'
  - Strategy-family choice can favour union savings in one field if the family's members have more
    overlapping root sets there.
  - The null's generic persistence effect must be computed at matched per-query cardinalities, or
    the comparison is between different things.
  interpretation_limits:
  - Two of the four cells correspond to no deployed construction and describe an operator in isolation.
  - Nothing here compares the security of the two deployed constructions, and no such comparison may
    be read out of the interaction term.
  - The refresh arm models independence, not any real per-nonce derivation, so no statement about
    derived subkeys follows.
  - All numbers are at n at most 16 with an idealised mask; the q-growth at deployed widths is not
    modelled and is not projected.
  target_complexity:
    time_exponent: No attack exponent is claimed. Cost is O(cells * A * 2^n * q) bit operations, dominated
      by the union search over the declared strategy family; bounded desktop compute at the tested
      widths.
    memory_exponent: No attack memory exponent is claimed. O(2^n) bits per root-set bitmap with at
      most q resident per cell; single-digit megabytes.
    best_known: The incumbent is the deployed pair itself, used as though it isolated the field. Within
      this repository no record separates persistence from field, and IDEA-20260809-3a39bc is the
      nearest, naming the keystream-derived mask without varying it in q.
    hidden_overhead: 'The single-variable discipline is the expensive part: it is easy to change the
      mask model or the strategy family alongside the key when building a refresh cell, and the configuration
      diff plus the no-op control are the only defences. Compute is small; the review burden is the
      cost.'
  dominated_by: 'n/a (no result claimed). Pareto check performed against every polymac-relevant row
    this repository holds - KN-LIT-4060, KN-LIT-5652, KN-LIT-7035, KN-LIT-1337, KN-LIT-4188, KN-LIT-1445
    - and the nine RQ-AEADC-8db132 proposals: none states a multi-query growth rate or a persistence
    effect, none is an algorithm this competes with on time, memory or queries, and no attack is claimed
    here at any parameters.'
  sota_delta: No attack; control-design contribution only. Delta is from a pairing in which field,
    encoding, key constraint and key persistence are all confounded, to a two-by-two that isolates
    persistence exactly, with a generic null and a no-op plumbing check, and an exact interaction
    term.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'By part. That the four signal cells and four null cells can be built
    with exactly one variable differing, verified by the no-op control: about 0.8, and the failure
    mode is a second variable slipping in. That the refresh cells show a constant per-query increment
    as constructed: about 0.95, since it follows from independence. That the signal cells'' persistence
    effect exceeds the null''s generic effect by more than a floor unit: about 0.55 - the degree ceiling
    is a real constraint that should make polynomial root sets overlap differently from random ones,
    but at small q the union savings may be too small to clear the floor. That the field-by-persistence
    interaction survives the prime sweep and the encoding correction: about 0.25. Recommended high
    because the persistence axis is currently invisible in the anchor question''s own framing, and
    naming it changes how every other record in the bucket must be read regardless of which way the
    numbers fall.'
