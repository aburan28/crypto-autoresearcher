      IDEA-20260731-012 (nearest, combinatorial large prime): precomputes
      the (m-1)-sumset table and harvests near-misses by hash lookup, with
      no polynomial system. Operation-level difference: here the near-miss
      is produced by solving a digit system with one more variable, and
      the derivation shows that this charges the near-miss in full, which
      is why the classical gain does not port; 731-012's combining
      semantics and Poisson model are reused, not re-proposed.
    - >-
      IDEA-20260726-005 (multi-level descent tree): a larger medium base
      decomposed recursively, with a medium-base log table. Here there is
      no recursion, no table, and the 'medium base' V_{s+1} is used only
      through pairwise elimination of one unknown per relation.
    - >-
      IDEA-20260830-84cdb7: the flat digit ladder and its d_ff slope. This
      record adds the profile axis and proves it inert under the null,
      then reduces the ladder's fate to 84cdb7's own branch; it proposes at
      most four added cells on 84cdb7's instrument.
    - >-
      IDEA-20260808-093497 / IDEA-20260808-812554: the oracle-versus-
      enumeration ratio and the sigma threshold; this record restates the
      former per digit and shows the ladder cannot touch the latter.

