idea:
  id: IDEA-20260903-fc1355
  question_id: RQ-PFDR-ae2fba
  handoff_id: TASK-20260903-22c36b
  added: '2026-09-03'
  title: >-
    THE NESTED DIGIT LADDER IS PROFILE-BLIND UNDER THE SEMI-REGULAR NULL: for
    any ladder profile (s_1, ..., s_m) the null solving degree
    ceil((S(d-1) + 2m)/2) and the KN-FIND-007-forced yield d^S / N both
    depend on the profile only through S = sum s_k, so the algebraic
    large-prime variation (m-1 leaves in V_s, one in V_{s+1}) interpolates
    the flat ladder in S and then pays a pair-combining tax; the marginal
    digit buys yield d against a Macaulay cost factor that tends to
    ((d+1)/2)^omega, which beats d only when omega < ln d / ln((d+1)/2)
    (1.709 at d = 2, 1.51 at d = 4), never at omega >= 2 -- so the ladder
    wins iff the MEASURED marginal-digit cost ratio r(S) on 84cdb7's own
    instrument sits below d, which is exactly the sublinear-d_ff branch of
    84cdb7 restated as a per-digit cost-versus-yield coupling
  class: composition

  claim: >-
    Setting as in IDEA-20260830-84cdb7: base d >= 2, nested windows
    V_s = {x in [0, d^s) : f(x) a square}, |V_s| = d^s / 2 (1 + o(1)),
    V_s subset V_{s+1} with |V_{s+1}| = d |V_s|. A LADDER PROFILE is
    (s_1, ..., s_m): leaf k carries s_k digits and its membership generators
    are the s_k equations prod_{j<d}(a_{k,i} - j) = 0 of degree d; the
    summation generator S_{m+1}(x_1, ..., x_m, x_R) has total degree 2m after
    the linear digit substitution. Write S = sum_k s_k for the total digit
    count. The large-prime relation of the handoff is the profile
    (s, ..., s, s + 1).
    (C1) PROFILE-BLINDNESS OF THE NULL, DERIVED. The membership generators
    have top forms a_{k,i}^d, a regular sequence in S variables, so the
    quotient by them has Hilbert series (1 + z + ... + z^{d-1})^S exactly;
    the single summation generator perturbs it by (1 - z^{2m}); the
    semi-regular degree of regularity is therefore
    D(S) = ceil((S(d-1) + 2m)/2), a function of S alone. The Macaulay
    column count in 84cdb7's convention is binom(S + D(S), D(S)), again a
    function of S alone. Hence the null solve cost T(S) = binom(S + D(S),
    D(S))^omega does not see how the S digits are distributed over the m
    leaves.
    (C2) PROFILE-BLINDNESS OF THE YIELD, FORCED. KN-FIND-007 (typed
    consequence 4, sub-bases of sizes B_1..B_m): the total number of ordered
    typed tuples with x_k in V_{s_k} summing to a target, summed over all N
    targets, is prod_k |V_{s_k}| exactly, so the mean per-target count is
    prod_k |V_{s_k}| / N = d^S / (2^m N) (1 + o(1)); with the 2^m sign
    multiplicity of cb8e46's convention this is d^S / N. QUOTED AS FORCED,
    NOT MEASURED: the yield depends on the profile only through S.
    (C3) MATCHED EFFECTIVE B. Define B_eff = (prod_k |V_{s_k}|)^{1/m} =
    d^{S/m} / 2. Matched B_eff is matched S. At matched S the flat profile
    (S/m, ..., S/m) exists only when m divides S; otherwise the ladder is the
    only realisation, and by (C1)-(C2) its cost per RAW relation
    C_raw(S) = T(S) N / d^S is the interpolation of the flat ladder's cost
    to a non-multiple of m. So under the null the ladder profile is neither
    better nor worse than 'a flat base at that S' -- it IS that base for
    every purpose the null can see.
    (C4) THE COMBINING TAX, WHICH MAKES IT STRICTLY WORSE PER USABLE
    RELATION. A raw relation from profile (s, ..., s, s+1) has its last
    point in V_{s+1}; with probability 1/d it lies in V_s and the relation
    is full; otherwise it carries one of B' = (d - 1)|V_s| large primes with
    unknown logarithm and is usable only after pairing with another relation
    sharing that prime (IDEA-20260731-012's combining semantics). Under the
    Poisson pairing model with R raw large-prime relations and lambda =
    R / B', the usable fraction is eta(lambda) = 1 - (1 - e^{-lambda}) /
    lambda (0.368 at lambda = 1, 0.568 at lambda = 2, 0.865 at lambda = 8),
    so usable relations per raw relation are 1/d + (1 - 1/d) eta(lambda) <
    1, and C_usable(S) = C_raw(S) / (1/d + (1 - 1/d) eta(lambda)). The flat
    base at the same S has usable fraction 1. Therefore, under the null, NO
    ladder profile beats the flat base at matched effective B, and the
    honest prior of the handoff is confirmed with its exact form.
    (C5) THE MARGINAL DIGIT, WHICH IS THE ONLY QUESTION LEFT. Going from S
    to S + 1 (any leaf) multiplies the forced yield by d and the null cost
    by r_null(S) = T(S+1)/T(S). When D(S+1) = D(S) the column ratio is
    binom(S + 1 + D, D) / binom(S + D, D) = 1 + D/(S + 1); when D increases
    by one it is larger. Since D(S)/(S+1) tends to (d - 1)/2, the per-digit
    cost factor tends to ((d + 1)/2)^omega while the yield factor is d. The
    ladder (or the flat base) gains from one more digit iff
    ((d+1)/2)^omega < d, i.e. omega < ln d / ln((d+1)/2): 1.709 at d = 2,
    1.585 at d = 3, 1.510 at d = 4, tending to 1 as d grows. At omega = 2
    the inequality (d+1)^2 >= 4d holds for every d by AM-GM with equality
    only at d = 1, so NO base and NO profile gains from a marginal digit
    under the null. EXACT TABLE at d = 2, m = 3: S = 9, D = 8, binom(17,8)
    = 24310; S = 10, D = 8, binom(18,8) = 43758, ratio 1.800; S = 11, D = 9,
    binom(20,9) = 167960, ratio 3.839; S = 12, D = 9, binom(21,9) = 293930,
    ratio 1.750; S = 13, D = 10, binom(23,10) = 1144066, ratio 3.892. The
    one-digit ratios alternate near 1.78 and 3.87; at omega = 2 they are
    3.2 and 15.0 against a yield gain of 2; the three-digit flat step S = 9
    to 12 has column ratio 12.09 and cost ratio 146 at omega = 2 against a
    yield gain of 8. This is 093497's 'algebraic oracle loses to enumeration'
    read per digit.
    (C6) THE CELL THAT WOULD SHOW OTHERWISE. The ladder is worth anything
    only if the MEASURED marginal cost ratio r(S) = T_meas(S+1)/T_meas(S) on
    the real digit system falls below d while r_null(S) stays above d. That
    is a per-digit restatement of 84cdb7's Outcomes 2 and 3: a bounded or
    sublinear d_ff makes T_meas polynomial in S and r(S) -> 1 < d. So the
    ladder is not a new lever; it is the same lever as the flat digit
    ladder, with a combining tax attached, and it becomes live in exactly
    the branch where 84cdb7 is live. What the ladder adds in that branch is
    the ability to realise non-multiple-of-m values of S, a constant-factor
    refinement, and the large-prime bookkeeping, a constant-factor loss.

  mechanism: >-
    WHY THE CLASSICAL LARGE-PRIME GAIN DOES NOT PORT. In NFS and in
    hyperelliptic index calculus (KN-LIT-164 via 731-012), the near-miss
    test is nearly free: one has already factored or decomposed the object
    and merely relaxes the acceptance predicate, so a relation with one
    large prime costs the same search as a full relation and the pool
    raises the hit rate by |L| at zero solve cost. In the ALGEBRAIC
    realisation the near-miss is not a relaxed acceptance test on an
    already-found decomposition; it is a DIFFERENT system with one more
    digit variable, and the solver must be run on that system. The extra
    digit is charged in full through T(S+1). The only free large-prime
    route would be to leave the m-th leaf unconstrained and hash-test its
    value against V_{s+1} -- but a system with m - 1 digit-constrained
    leaves and one free variable has 2^{m-1} B^{m-1} solutions by Theorem C
    of KN-FIND-a8990a (as used in cb8e46 part D), so any solver returning
    them all costs at least B^{m-1}, which is the enumerative oracle at
    sigma = 1 and not an algebraic gain at all. So the algebraic large-prime
    variation has exactly two realisations: charge the digit (this record,
    profile-blind under the null) or free the leaf (enumeration). Neither
    moves sigma.
    TRACKED OBJECT AND LOSSY-PROJECTION TEST. The object is the pair
    (S, lambda) -- the total digit count and the pool load -- as the
    projection of a ladder profile plus a relation stream. It is lossy: it
    forgets the distribution of digits over leaves and which leaf carries
    the large prime. It is compatible with the two operations that matter:
    the null cost and the forced yield are functions of S alone (C1-C2), and
    the combining step is a function of lambda alone (C4). That the
    profile is discarded COMPATIBLY is the content of the record: the
    projection loses information that neither the null nor the yield uses,
    which is why the ladder is not a new object under the null. It becomes
    a genuine object only if T_meas depends on the profile at fixed S -- a
    checkable prediction added below as the profile-dependence arm.
    THE BASELINE EMBEDDING. Profile (s, ..., s) reproduces 84cdb7's flat
    ladder at S = ms exactly, null and all; profile (s, ..., s, s+1) at s = 0
    reproduces the direct presentation with m - 1 leaves fixed at 0 -- a
    degenerate boundary that must return the univariate root count.
    STAGES. STAGE 0 (zero compute, hard gate): derive (C1) by the same
    Hilbert-series argument as 84cdb7 with S in place of ms; tabulate D(S)
    and binom(S + D(S), D(S)) for d in {2, 4}, m in {3, 4}, S in
    {6..16}; verify the five entries above by hand; derive eta(lambda).
    STAGE 1 (zero new compute, reads 84cdb7's ladder): if and when 84cdb7's
    Stage 2 is run, its per-cell graded ranks at (m, d, s) give T_meas(ms)
    for s in {1..5}; add the single extra profile (s, s, s+1) at m = 3,
    d = 2, s in {2, 3} to obtain T_meas(3s + 1) and hence r(S) at S in
    {6, 7, 9, 10}. The added cells cost binom(S + D, D) columns with S <=
    10, D <= 8: at most binom(18, 8) = 43758, inside 84cdb7's contract.
    STAGE 2 (profile-dependence arm, same instrument): at fixed S = 9,
    m = 3, d = 2, compare profiles (3,3,3), (2,3,4), (1,4,4) on the same
    curve and target; under the null all three have identical d_reg and
    column count; a measured difference in graded ranks is the only way
    the profile can matter and is reported as the record's positive branch.
    STAGE 3 (zero compute): fill the marginal-digit table with r(S) beside
    r_null(S) and declare the branch.

