  heuristic_assumptions:
    - id: H1
      statement: >-
        SEMI-REGULARITY OF THE PROFILED DIGIT SYSTEM: for generic E, planted
        R and any profile with digit sum S, the sequence (S_{m+1} with the
        digit substitution, the S membership generators) is semi-regular,
        so its Hilbert series is [(1 + ... + z^{d-1})^S (1 - z^{2m})]_+ and
        its solving degree is D(S), uniformly for d in {2, 4}, m in {3, 4},
        S <= 16.
      rigorous_support: >-
        RIGOROUS: the membership top forms a_{k,i}^d form a regular sequence
        and the complete-intersection series (1 + ... + z^{d-1})^S is exact
        for any grouping of the S variables. CLASSICAL STATEMENT IMITATED:
        Froberg / Bardet-Faugere-Salvy -- one extra generic generator
        perturbs by a single shifted subtraction. This is 84cdb7's H1 with
        the sign reversed: 84cdb7 hopes it FAILS; this record's closure
        holds if it holds, and the live branch is its failure.
      validation_plan: >-
        SAMPLE: 84cdb7's Stage 2 ladder plus the four added cells, graded
        ranks degree by degree. COMPARISON: the predicted coefficient
        a_D - a_{D-2m} of the convolution series per degree, with the
        per-degree residual reported. TAIL CHECK: the two degrees before
        D(S), where the predicted coefficient is smallest; and the S = 9
        profile triple, where any residual difference across profiles is
        the sharpest possible failure of H1's profile-blindness. SAMPLED
        PARAMETERS RECORDED: p, curve, m, d, profile, S, seed, D_max.
        TRANSFER: none; toy scale.
    - id: H2
      statement: >-
        POISSON PAIRING: with B' = (d - 1)|V_s| large primes and R raw
        large-prime relations from uniformly random planted targets, the
        multiplicities of the large primes are Poisson(lambda = R/B') so
        the usable fraction is eta(lambda) = 1 - (1 - e^{-lambda})/lambda.
      rigorous_support: >-
        RIGOROUS: the forced typed yield of (C2) fixes the mean number of
        relations per large prime at R/B'. CLASSICAL STATEMENT IMITATED:
        the occupancy / Poissonisation limit for balls in bins, the same
        model as 731-012's HEUR-LP-1.
      validation_plan: >-
        SAMPLE: at toy p <= 2^16, enumerate all decompositions of 2000
        random targets over the profile (s, s, s+1) at m = 3 by the
        signed-sum sweep (no solver needed), tabulate large-prime
        multiplicities. COMPARISON: Poisson(lambda) by chi-square at the
        1 percent level. TAIL CHECK: the most-repeated large prime against
        the Poisson upper tail. TRANSFER: none.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES. Under the null the per-usable-relation cost of the
      ladder is C_raw(S) / (1/d + (1 - 1/d) eta(lambda)) with C_raw(S) =
      binom(S + D(S), D(S))^omega N / d^S, strictly above the flat base's
      C_raw(S); the assembled exponent stays at 812554's sigma = 1 value
      (total m! N) because neither realisation of the algebraic large prime
      lowers T_solve below B^{m-1}. In the live branch (r(S) < d) the
      exponent is whatever 84cdb7's collapse licenses, and the ladder adds a
      constant factor.
    memory_exponent: >-
      The ladder adds the large-prime pool B' = (d - 1)|V_s| = N^{beta}
      times (d - 1) to the factor-base memory N^{beta}; a constant factor.
      Macaulay memory per solve is binom(S + D(S), D(S))^2 dense, as in
      84cdb7, one digit larger.
    best_known: >-
      Parallel Pollard rho with negation at 0.886 sqrt(N) and O(1) memory;
      BSGS; kangaroo; automorphism-discounted rho; Pohlig-Hellman; generic
      preprocessing S T^2 = N; algebra-free MITM index calculus at
      N^{1/2 + 1/m}. For the decomposition subtask, enumeration at
      2^{m-1} B^{m-1} and MITM at B^{ceil(m/2)}.
    hidden_overhead: >-
      The o(1) in |V_s| = d^s / 2 hides the filtering fraction of 84cdb7
      H2; omega = 2 is not achievable on these matrices, which only
      strengthens the closure; the Poisson model hides pool collisions that
      are conservative for the ladder side.
    tradeoff_note: >-
      lambda is the ladder's one tunable: larger lambda raises the usable
      fraction toward 1 at the cost of more raw relations per usable one,
      and never above the flat base. Relation collection is embarrassingly
      parallel; combining is a hash pass.

