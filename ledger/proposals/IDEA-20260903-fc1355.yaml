  assumptions:
    - >-
      84cdb7's null convention (membership generators counted in the
      Hilbert series, column count binom(S + D, D)) is adopted unchanged so
      that the flat profile reproduces 84cdb7 exactly; the multilinear
      quotient convention of the A1 twin would change constants, not (C1).
    - >-
      The typed yield of (C2) counts ordered tuples with leaf k in
      V_{s_k}; the nested inclusion V_s subset V_{s+1} means the
      large-prime profile's count includes the flat count as the 1/d slice.
    - >-
      Combining follows 731-012's pairwise semantics with the Poisson model
      HEUR-LP-1; eta(lambda) is its usable fraction.
    - >-
      omega is reported at 2 and 2.807 and the marginal-digit inequality is
      evaluated at both; no single-omega number is emitted.

  proof_search_map:
    bottleneck: >-
      The per-digit exchange rate between solve cost and forced yield --
      the RQ's degree-versus-yield coupling in its purest form. Under the
      null it is ((d+1)/2)^omega against d, and the ladder cannot change it.
    baseline_embedding:
      parameter_slice: >-
        Profile (s, ..., s): S = ms, reproducing 84cdb7's null
        ceil((ms(d-1) + 2m)/2) and its column count exactly; further,
        s = 1, d = B reproduces 093497's ceil((m(B-1) + D_S)/2) with
        D_S = 2m through 84cdb7's own embedding.
      reproduction_check: >-
        Symbolic: substitute s_k = s in (C1) and compare term by term with
        84cdb7 claim D; hand-check the five binomial entries in (C5).
        Frozen: 84cdb7's Stage 2 ranks at (3, 2, s) must be reused
        unchanged as the T_meas(3s) column.
    observation_collision:
      observable: >-
        The pair (r_null(S), r(S)) per S and the profile-dependence residual
        at fixed S.
      distinct_preimage_search: >-
        DESIGNED IN: three profiles at S = 9 with identical null values are
        three distinct ground truths with the same null observable; the
        collision is expected and is the record's null. The collision that
        would matter is r(S) < d with r_null(S) > d, which is 84cdb7's
        sublinear branch and is not a collision but a separation.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The resource measure (S, lambda) with charges T(S) and
          1/(1/d + (1-1/d) eta(lambda)), realised by specialising the
          profile to (s, ..., s, s+1) and adding charges over the disjoint
          blocks 'full relation' and 'large-prime relation'.
        predicted_gain: >-
          Reduces the profile space to one integer and one load parameter,
          and makes the flat base's dominance a two-line inequality.
    quantifier_order: >-
      CLAIMED: FOR ALL d >= 2, FOR ALL m >= 2, FOR ALL profiles with digit
      sum S, under the semi-regular null of 84cdb7, T(S) and the forced
      yield depend on the profile only through S, and FOR ALL lambda the
      usable fraction is at most 1 with equality only for the flat profile.
      FOR ALL omega >= 2 and FOR ALL d >= 2, ((d+1)/2)^omega >= d. NOT
      CLAIMED: anything about T_meas; the branch r(S) < d is an EXISTS
      statement over measured cells that 84cdb7's ladder decides.
    method_ceiling:
      strongest_certifiable_claim: >-
        'Under the semi-regular null, the algebraic large-prime variation of
        the digit base is dominated by the flat base at matched S by the
        factor 1/(1/d + (1-1/d) eta(lambda)), and the marginal digit is
        worth taking iff omega < ln d / ln((d+1)/2)'; plus, if 84cdb7's
        ladder runs, a measured r(S) table. It cannot certify anything about
        the real system beyond the measured cells, and nothing about sigma.
      nearby_object_control: >-
        The extension-field subfield base, where the marginal 'digit' is a
        coordinate of F_{q^n} over F_q and Weil restriction multiplies the
        equation count with it, so the per-coordinate cost ratio is bounded
        while the yield factor is q: there the inequality is reversed and
        index calculus works. The derivation must NOT conclude a loss there;
        it does not, because (C1)'s single-equation Hilbert series is the
        prime-field disanalogy of A1-11 and 84cdb7 claim C.
    proof_obligations:
      - claim: >-
          D(S) = ceil((S(d-1) + 2m)/2) and binom(S + D(S), D(S)) depend on
          the profile only through S.
        responsibility: correctness
      - claim: >-
          The typed yield prod_k |V_{s_k}| / N depends only on S.
        responsibility: success_probability
      - claim: >-
          eta(lambda) = 1 - (1 - e^{-lambda})/lambda under Poisson pairing,
          and the usable fraction is below 1 for every large-prime profile.
        responsibility: strictness
      - claim: >-
          ((d+1)/2)^omega >= d for omega >= 2, d >= 1, with equality only at
          d = 1.
        responsibility: correctness
      - claim: >-
          The flat profile reproduces 84cdb7's null and column counts
          exactly.
        responsibility: baseline
      - claim: >-
          Added cells stay under 84cdb7's 50,000-column contract.
        responsibility: memory
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The pair (S, lambda): total digit count and large-prime pool load.
    lossiness: >-
      Forgets the profile and the large-prime leaf; compatible with the
      null cost, the forced yield and the combining step, which are
      functions of S and lambda only.
    propagation: >-
      Adding a digit maps S to S + 1 and multiplies the null cost by
      r_null(S) and the yield by d; adding a raw relation moves lambda by
      1/B'. Both deterministic.
    survival_score: >-
      Survives every profile under the null; dissolves exactly where
      T_meas depends on the profile at fixed S, which is the record's
      positive branch.

  null_object_control: >-
    THE FLAT PROFILE AT MATCHED S is the null object: identical null cost,
    identical forced yield, usable fraction 1. THE PROFILE-DEPENDENCE ARM
    (blocking for any positive branch): three profiles at S = 9 on the same
    instance must give identical graded ranks under the null; a difference
    is the only Semaev-specific signal this record can carry. THE
    RANDOM-GENERATOR NULL of 84cdb7 (support-matched random summation
    generator) is inherited unchanged on every added cell. STRUCTURAL
    TELL: r(S) must be evaluated at consecutive S; a ratio below d at one S
    and above at the next is ceil-alternation of the null, not a
    collapse, and the record pre-registers that the two-digit ratio
    r(S) r(S+1) against d^2 is the smoothed statistic.

  discriminated_from:
