idea:
  id: IDEA-20260816-fbc1d3
  question_id: RQ-PMA-001
  added: '2026-08-16'
  title: 'Replace the characteristic-2 refusal with a measured analogue: in char 2 the orientation
    quadratic has no discriminant, but it has an Artin-Schreier class, so build the class in F modulo
    the image of x squared plus x, measure whether it obstructs, and report the boundary as a computed
    invariant rather than a scope exclusion'
  class: representation
  claim: '(A) RQ-PMA-001 excludes characteristic 2 as a separate Artin-Schreier or linearized-quadratic
    problem and requires the predicate to refuse or flag char-2 inputs, and EXP-PMA-001 implements
    that as CTRL-PMA4-CHAR2, a refusal control. That is correct scoping and it is also a hole: the
    excluded case is named after a specific alternative invariant that nobody has computed. (B) In
    char 2 the quadratic X squared plus b X plus c with b nonzero is not solved by a discriminant;
    substituting X = b Y turns it into Y squared plus Y equals c divided by b squared, so solvability
    in F is governed by whether c/b squared lies in the image of the additive map x maps to x squared
    plus x on F. The obstruction, if there is one, is a class in the additive group F modulo that
    image -- an F_2-vector space -- not a class in a multiplicative square-class group. (C) The proposal
    is to build that invariant explicitly for the same anchored orientation quadratics over F = k(t)
    with k of characteristic 2, measure how often it is nontrivial on a prescribed grid, and compare
    against the same two nulls used elsewhere in this bucket: tables pulled back from actual matrices
    over F, where the gate must never fire, and degree-matched sampled tables for background. The
    deliverable is the boundary stated as a computed invariant plus its firing rate, replacing a scope
    sentence. (D) What is NOT claimed: that the char-2 analogue is the same obstruction, that it behaves
    like divisor parity, or that a nontrivial class implies anything about char-not-2. The two invariants
    live in different groups, one multiplicative and one additive, and the entry explicitly refuses
    to transfer any conclusion between them. (E) Also NOT claimed: that b is nonzero in general. Where
    b vanishes the quadratic is inseparable, X squared equals c, and solvability is governed by whether
    c is a square, which in char 2 is automatic over a perfect field and is not over k(t); that branch
    is separated and measured on its own. (F) No attack, speedup or security consequence is claimed,
    and no direction is declared impossible.'
  mechanism: 'Stage 1 fixes the representation: for each anchored triple, write the orientation quadratic
    in char 2 explicitly, identify the coefficient b that plays the role of the linear term, and split
    into the separable branch (b nonzero) and the inseparable branch (b zero). Stage 2 implements
    the Artin-Schreier class for the separable branch over F = k(t): reduce c/b squared modulo the
    image of the additive map, which for a rational function field means a partial-fraction reduction
    where each pole part and the polynomial part is reduced against the image, leaving a canonical
    representative whose triviality decides solvability. Stage 3 implements the inseparable branch:
    in char 2 over k(t), the squares are exactly the rational functions in t squared with coefficients
    that are squares in k, so squareness is decided by an explicit test on the partial-fraction data
    rather than by valuation parity, and the entry measures which branch dominates on the grid. Stage
    4 validates both branches in both directions on constructed solvable and constructed unsolvable
    instances, requiring zero misclassifications. Stage 5 runs the pulled-back matrix null and the
    degree-matched sampled null. Stage 6 reports the firing rate per branch against both nulls. The
    mechanism is refuted as an instrument if any constructed solvable instance is declared obstructed,
    since realizability is guaranteed there by construction.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read ledger/questions/RQ-PMA-001.yaml constraints in full, ledger/hypotheses/H-PMA-001.yaml
      assumptions and falsification_conditions in full, ledger/proposals/IDEA-20260726-012.yaml assumptions
      and minimal_test.controls in full, experiments/EXP-PMA-001/specification.yaml controls block
      in full. Grepped ledger/proposals/ and ledger/hypotheses/ for: Artin.Schreier, characteristic
      2, char 2, linearized, additive polynomial, inseparab.'
    results: 'Artin.Schreier returns exactly three hits: IDEA-20260726-012, H-PMA-001, and IDEA-20260807-070d03.
      The first two use the phrase only to NAME the excluded case -- IDEA-20260726-012 says characteristic
      2 is a separate Artin-Schreier or linearized-quadratic problem and is outside this proposal''s
      prediction, and RQ-PMA-001''s constraints repeat it -- and neither computes anything. IDEA-20260807-070d03
      is in a different area entirely and shares no object with PMA. EXP-PMA-001''s CTRL-PMA4-CHAR2
      feeds F_2 and F_4 inputs and requires the predicate to refuse or flag them and never return
      an obstruction verdict; that is the entire char-2 content of the frozen contract. No record
      anywhere in the repository constructs an Artin-Schreier class, an additive-image reduction,
      or an inseparable-branch square test over a char-2 rational function field.'
    verdict: 'UNVERIFIED. Nothing is asserted about literature outside this repository -- the Artin-Schreier
      description of separable quadratics in characteristic 2 is standard mathematics, and no claim
      is made here about what any external source contains or does not. Claimed new inside this repository:
      the computed char-2 invariant and its measured firing rate, where the corpus currently has only
      a scope-exclusion sentence and a refusal control. Assembled from known parts: the exclusion
      and its name come verbatim from RQ-PMA-001 and IDEA-20260726-012; the null designs are the same
      two nulls used elsewhere in this bucket; the branch split follows from the coefficient structure
      of the frozen orientation quadratics.'
  object_first_candidate:
    tracked_object: 'The ARTIN-SCHREIER CLASS of the reduced orientation quadratic: the class of c
      divided by b squared in the additive quotient F modulo the image of x maps to x squared plus
      x, carried as a canonical partial-fraction representative. On the inseparable branch the tracked
      object is instead the square class of c in the char-2 sense, and the two are tracked as distinct
      objects with a branch label, never merged.'
    lossiness: 'Genuinely lossy, and lossy in a completely different way from the char-not-2 case,
      which is the point of the entry. The quadratic has two coefficients in F, each a rational function
      of unbounded degree; the tracked object is a class in an F_2-vector space, so it discards all
      multiplicative structure and retains only an additive residue. Crucially it discards a DIFFERENT
      part of the data than the square class does: the square class is invariant under multiplication
      by squares, the Artin-Schreier class is invariant under addition of elements of the form x squared
      plus x. Neither refines the other, and the entry does not pretend they are comparable. The retained
      part propagates because the additive quotient is a group under addition and the reduction is
      a homomorphism, which stage 2 checks directly.'
    propagation: One step of the target operation is adding an element to c. On the separable branch
      that translates the Artin-Schreier class by the class of the added element divided by b squared,
      which is a group translation and is therefore deterministic and computable. Scaling b changes
      the reduction nontrivially and is handled by recomputing rather than by transport, and that
      asymmetry -- additive in c, not in b -- is recorded explicitly because it is where a naive implementation
      would introduce an error.
    survival_score: 'The invariant survives as long as the partial-fraction reduction is exact, which
      over k(t) with k finite of characteristic 2 holds at every degree the implementation can factor.
      It dissolves in two identifiable places, both measured: at the inseparable branch, where b vanishes
      and the whole Artin-Schreier framework does not apply and a different test takes over; and over
      an imperfect constant field, where the char-2 square test itself becomes nontrivial in a way
      that a perfect finite k hides. The run reports the fraction of grid instances landing in each
      branch, which is the concrete survival statement.'
  null_object_control: 'Two nulls, both run in the same invocation through the identical code path,
    mirroring the design used elsewhere in this bucket. NULL A, soundness: prescribed tables obtained
    by computing the exact principal minors of explicitly sampled 4x4 matrices over F = k(t) with
    k of characteristic 2, so realizability holds by construction with the matrix as witness. The
    char-2 gate must fire at rate exactly zero on NULL A; any firing is a false obstruction with its
    counterexample attached, and this is the only control that can detect unsoundness of a brand-new
    invariant without an existence decider. NULL B, background: degree-matched uniformly sampled tables
    of the same shape, giving the rate at which the invariant is nontrivial on structureless input.
    For the signal arm to mean anything, NULL A must be exactly zero and NULL B must be strictly inside
    0.05 to 0.95; a saturated NULL B means the invariant is nontrivial on nearly everything and its
    firing carries no information.'
  discriminated_from:
  - 'EXP-PMA-001''s CTRL-PMA4-CHAR2: a refusal control that feeds F_2 and F_4 and requires the predicate
    to decline. This entry accepts those inputs deliberately and computes a different invariant on
    them; the two are opposite responses to the same input class, and the refusal control remains
    correct for the char-not-2 predicate.'
  - 'IDEA-20260726-012 and RQ-PMA-001''s char-2 exclusion: scope sentences naming the excluded case.
    This entry computes the object those sentences name; a name is not a measurement.'
  - 'Entry 5 of this bucket (square-class component attribution): that decomposes a MULTIPLICATIVE
    square class over char-not-2 fields. This works in an ADDITIVE quotient over char-2 fields, and
    neither invariant specialises to the other.'
  - 'Entry 6 of this bucket (density against two nulls): shares the null design deliberately, but
    applies it to a different invariant on a different characteristic; the shared design is the point
    of comparability and is stated rather than hidden.'
  - 'IDEA-20260807-070d03, the only other Artin-Schreier record: a different area with no matrix,
    no minor table and no PMA content; the shared term is the mathematics, not the object.'
  assumptions:
  - In characteristic 2, X squared plus b X plus c with b nonzero has a root in F if and only if c
    divided by b squared lies in the image of x maps to x squared plus x on F. This is standard and
    is CHECKED in both directions on constructed instances rather than assumed.
  - The image of the additive map on k(t) admits a canonical partial-fraction reduction, so that triviality
    of the class is decidable exactly; where the reduction routine cannot certify a representative,
    the instance is recorded UNDECIDED and excluded.
  - The frozen orientation quadratics retain a well-defined linear coefficient b in characteristic
    2 after the char-not-2 formulas are rewritten; whether they do is part of what stage 1 must establish,
    and if they do not the entry reports that as its finding rather than forcing an analogue.
  - The constant field k is finite of characteristic 2, hence perfect, so every element of k is a
    square; over an imperfect k the inseparable branch behaves differently and that case is out of
    scope and stated as such.
  predictions:
  - metric: null_A_char2_firing_rate
    direction: lower
    minimum_effect: exactly 0 across at least 300 pulled-back tables; a single firing is a false obstruction
      with a witness matrix attached and is the most consequential possible outcome
  - metric: constructed_solvable_misclassification_count
    direction: lower
    minimum_effect: exactly 0 across at least 200 constructed solvable and 200 constructed unsolvable
      Artin-Schreier instances
  - metric: inseparable_branch_fraction
    direction: different
    minimum_effect: 'I refuse to pre-commit a value. Reason: how often b vanishes on the prescribed
      family in characteristic 2 depends on the rewritten formulas, which stage 1 must derive; guessing
      would be a fabricated statistic under AGENTS.md rule 5.'
  - metric: null_B_char2_firing_rate
    direction: different
    minimum_effect: strictly inside 0.05 to 0.95 for the background to be informative; outside that
      band the invariant's firing carries no discriminating information and that is reported as the
      finding
  - metric: additive_reduction_homomorphism_violations
    direction: lower
    minimum_effect: exactly 0 -- the reduction must be additive on a sample of at least 10^4 pairs,
      or the class is not well defined
  minimal_test:
    design: 'Stage 1 is symbolic and costs no compute: rewrite the frozen orientation quadratics in
      characteristic 2 and determine whether a linear coefficient b survives. That single derivation
      decides whether the entry has an object at all, and it is a legitimate terminal outcome -- if
      the char-2 rewrite has no separable branch on the prescribed family, the finding is that the
      excluded case is inseparable rather than Artin-Schreier, which contradicts the name the scope
      sentences use and is worth recording on its own. If b does survive, the cheapest compute-bearing
      discriminator is the pair of constructed-instance controls plus NULL A at 100 samples over k
      = F_2, which is a few hundred exact partial-fraction reductions over a tiny field and costs
      seconds. Those two together establish whether the new invariant is implemented correctly and
      whether it is sound on tables with witnesses attached. The signal arm and NULL B are extensions
      that give the invariant a firing rate, and neither is needed to reach the first decision.'
    controls:
    - 'Constructed-solvable control: at least 200 instances built as c equal to (r squared plus r)
      times b squared for explicit r in F must be certified trivial, i.e. not obstructed.'
    - 'Constructed-unsolvable control: at least 200 instances built with a designed nontrivial class
      must be certified nontrivial, with the canonical representative printed.'
    - 'Additivity control: the reduction map must satisfy reduce(u plus v) equals reduce(u) plus reduce(v)
      in the quotient, on at least 10^4 sampled pairs.'
    - 'NULL A: prescribed tables pulled back from explicitly sampled matrices over k(t) in characteristic
      2, each with witness reverification by an independent minor implementation.'
    - 'NULL B: degree-matched uniformly sampled tables for the background rate.'
    - 'Branch-separation control: every instance is labelled separable or inseparable before the invariant
      is computed, and the two branches are never aggregated into one rate.; also Char-not-2 non-interference
      control: the existing char-not-2 gate must be unchanged and must still refuse char-2 inputs;
      this entry adds a separate code path and does not modify the frozen predicate.'
    required_metrics:
    - whether a linear coefficient b survives the char-2 rewrite, per anchored triple, with the derivation
      printed
    - 'per instance: branch label, canonical Artin-Schreier representative on the separable branch,
      square-test result on the inseparable branch'
    - firing rate per branch, per arm (signal, NULL A, NULL B), with denominators printed
    - NULL A firing count and, per firing, the invariant plus the witness matrix plus reverification
    - constructed-solvable and constructed-unsolvable misclassification counts
    - additive_reduction_homomorphism_violations
    - inseparable branch fraction on the signal arm
    - UNDECIDED counts from reduction failures, per arm
  falsification_conditions:
  - 'Any constructed solvable instance is certified obstructed, or any constructed unsolvable instance
    certified unobstructed: the invariant implementation is void.'
  - 'The reduction fails additivity on any sampled pair: the class is not well defined as computed.'
  - 'NULL A fires on any table that passes witness reverification: the char-2 invariant is unsound
    on the constructed ensemble, with an explicit counterexample matrix.'
  - 'The char-2 rewrite of the frozen quadratics has no surviving linear coefficient on the prescribed
    family: there is no separable branch and the excluded case is inseparable, not Artin-Schreier,
    which contradicts the naming in RQ-PMA-001''s constraints and is itself the finding.'
  - 'NULL B fires at rate above 0.95 or below 0.05: the invariant is saturated or dead on structureless
    input and its signal-arm rate carries no information.'
  - 'Modifying nothing else, the existing char-not-2 gate changes behaviour on any char-not-2 input:
    this entry has contaminated the frozen predicate and must be reverted.'
  confounders:
  - 'Characteristic 2 changes the formulas themselves, not just the field: the frozen q_ij, c_ijk
    and Delta_ijk expressions contain a factor 4 and a factor 2 that vanish identically, so a naive
    port produces a degenerate object. The rewrite must be derived from the underlying reconstruction
    equations, not obtained by evaluating the frozen formulas at characteristic 2, and confusing the
    two is the most likely way this entry produces nonsense.'
  - Over a finite constant field of characteristic 2 every constant is a square, so the inseparable
    branch can look trivially solvable while being governed by the t-dependence; the square test must
    operate on the full rational function and not on the constant part.
  - The additive quotient has no canonical representative without a fixed reduction convention; two
    implementations can disagree on the representative while agreeing on triviality, so only triviality
    is compared across implementations.
  - Small char-2 fields (F_2, F_4) have very few elements, so sampled nulls are thin and rates are
    noisy; the record must report sample sizes and consider F_8 and F_16 where affordable.
  - Adding a char-2 code path to a predicate contracted to refuse char-2 inputs risks changing that
    predicate's behaviour; the non-interference control exists for exactly this and the new path must
    be a separate module.
  interpretation_limits:
  - The char-2 invariant is not the char-not-2 invariant and no conclusion transfers between them
    in either direction. They live in different groups, one additive and one multiplicative.
  - A nontrivial class is an obstruction certificate for the orientation quadratic only; as in the
    char-not-2 case, triviality is never a compatibility claim, and the full four-minor gate and shared
    orientation constraints remain independent requirements.
  - Results are scoped to finite perfect constant fields of characteristic 2; imperfect constant fields
    are out of scope and behave differently on the inseparable branch.
  - Nothing here revises RQ-PMA-001's scope, which correctly excludes characteristic 2 from the question
    it asks. This entry measures the excluded region without importing it.
  - A zero firing rate on the signal arm would mean the invariant is vacuous on the tested family,
    not that characteristic 2 is unobstructed.
  target_complexity:
    time_exponent: No attack exponent is claimed. Cost per instance is one partial-fraction reduction
      plus one additive-image test over k(t) in characteristic 2, at the degrees the prescribed family
      produces.
    memory_exponent: No attack exponent is claimed. Memory is the partial-fraction data of a few hundred
      rational functions.
    best_known: 'The incumbent for characteristic 2 in this repository is CTRL-PMA4-CHAR2, a refusal:
      the frozen predicate must decline F_2 and F_4 inputs and never return an obstruction verdict
      for them. This entry is not faster than a refusal; it computes something where the incumbent
      computes nothing, which is a coverage difference and is stated as such.'
    hidden_overhead: 'The whole cost is in stage 1, and it is human: deriving the correct characteristic-2
      form of the orientation quadratics from the underlying reconstruction equations rather than
      by naively reading the frozen formulas, which contain terms that vanish identically in characteristic
      2. Getting this wrong produces a well-implemented invariant of the wrong object, which no downstream
      control catches except NULL A, and NULL A only catches it if the wrong object happens to be
      unsound. Second hidden cost: the reduction convention for the additive quotient is a design
      decision with no canonical answer.'
  dominated_by: 'n/a (no result claimed). Checked across time, memory and data/query axes: no cryptanalytic
    quantity, no algorithm and no source-to-scalar candidate is produced, so no frontier row applies.
    Within this repository the incumbent is a refusal control, which computes nothing and therefore
    cannot dominate a measurement on any axis.'
  sota_delta: 'no attack; conceptual/measurement contribution only. The internal comparison is a coverage
    one: the frozen contract''s characteristic-2 output is a refusal flag, i.e. zero bits about the
    mathematics; this contract''s output is a branch label, a canonical class representative, a firing
    rate against two nulls, and a soundness measurement with witnesses. No timing or complexity comparison
    with any method is made or implied.'
  estimated_cost:
    implementation: high
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Part A-B (a correct characteristic-2 rewrite of the orientation quadratics
    with a surviving linear coefficient on at least some of the prescribed family): 0.5. This is the
    entry''s single largest risk and I will not dress it up: the frozen formulas contain terms that
    vanish in characteristic 2, so whether a genuine separable branch exists must be derived and could
    come out either way. The 0.5 outcome where it does not is still a reportable finding that contradicts
    the naming in the scope sentences. Part C (the Artin-Schreier invariant is implemented correctly,
    i.e. constructed controls pass and additivity holds): 0.8 conditional on part A, since the mathematics
    is standard and the controls are decisive. Part D (NULL A construction over a characteristic-2
    rational function field works and every table reverifies): 0.8. Part E (NULL A firing rate is
    exactly zero, i.e. the new invariant is sound): 0.7 -- lower than the char-not-2 analogue because
    a freshly derived invariant has had no prior scrutiny at all. Part F (NULL B is informative rather
    than saturated): 0.45, and small char-2 fields make this worse rather than better.'
