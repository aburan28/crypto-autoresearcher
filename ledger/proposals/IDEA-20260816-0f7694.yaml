idea:
  id: IDEA-20260816-0f7694
  question_id: RQ-QRUOV-001
  added: '2026-08-16'
  title: 'Structure as a dose, not a switch: build keys in which only a controlled fraction of the
    blocks are quotient-ring linear, then measure solving degree and solver cost as a function of
    that fraction, so the zero-dose arm is the null and the full-dose arm is QR-UOV, in one continuous
    curve.'
  class: control
  claim: '(A) Every in-repo treatment of structured key compression compares two points: a structured
    key and a matched unstructured key. Two points cannot distinguish a threshold from a gradient,
    and the distinction is the whole practical question, because a scheme that loses security only
    at full structure is in a different position from one that loses it as soon as any structure appears.
    This proposal makes structure a continuous dose. Fix the quotient ring A = F_q[t]/(f); build a
    public key in which a chosen number j of the block rows are genuine A-linear blocks and the remaining
    ones are free F_q blocks of the same shape. j = 0 is a plain UOV key of the flattened dimensions;
    j = maximum is a QR-UOV-shaped key; every intermediate j is a partially structured object of the
    same size. (B) The claim under test is that the measured solving degree of the derived key-recovery
    system, and the measured solver cost, are monotone nonincreasing in j, and that the dependence
    is a step rather than a gradient: no change until j exceeds a threshold determined by the number
    of independent A-multiplication relations the attacker can form, and then a drop. (C) The deliverable
    either way is a curve with error bars whose left endpoint is a genuine null arm produced by the
    identical code, so the comparison is internal and the null is not a separately built object that
    could differ for irrelevant reasons. (D) NOT CLAIMED: no attack on QR-UOV, no exponent, no statement
    about deployed parameters, and no claim that a measured drop at toy scale transfers. A flat curve
    is not evidence that compression is safe; it is a measured absence of a dose effect at the tested
    parameters, with its own interval, and that is exactly what it will be reported as.'
  mechanism: 'STAGE 1, construction. Fix A = F_q[t]/(f) with deg f = ell, and the associated pairing
    matrix W with W_{ij} = coeff_{ell-1}(t^{i+j} mod f), whose invertibility and rank law are already
    derived in H-QRUOV-e8ae3e Part P1. Build a key as a block matrix with V by V blocks of size ell
    by ell; for j of the blocks use W times phi(a) for a in A, and for the rest use an unconstrained
    symmetric ell by ell matrix over F_q. STAGE 2, planting. Plant one oil module of fixed F_q-dimension
    in every arm, identical across j, so that the only thing varying is the structure of the blocks.
    STAGE 3, system derivation. For each key, derive the same key-recovery system by the same code,
    and compute its Macaulay rank profile degree by degree until the first fall. STAGE 4, dose curve.
    Plot first-fall degree and solver cost against j, with 30 keys per j. STAGE 5, the decay check.
    Per inventor-protocol section 3, ask what should happen as j decreases: if structure is what the
    attack consumes, the advantage must decay to zero at j = 0 by construction. An advantage that
    persists at j = 0 is proof that the measurement is picking up something other than structure -
    a planting artifact or a solver-side asymmetry - and forbids reading the rest of the curve.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-QRUOV-001 in full and H-QRUOV-e8ae3e's statement. Read IDEA-20260813-5988b7 in
      full (the closest record). Read titles of IDEA-20260805-8d9ac0, IDEA-20260808-c959c7, IDEA-20260805-bb9f73,
      IDEA-20260808-d07cd4, IDEA-20260805-bd8339, IDEA-20260801-015 via the family grep. Ran greps
      for 'dose' (hits IDEA-20260814-92f825, IDEA-20260807-a127ab, IDEA-20260807-cbbcfd, IDEA-20260807-0e8977,
      all outside this bucket) and for 'rank spectrum' (hits IDEA-20260808-d07cd4, IDEA-20260805-bd8339).
    results: IDEA-20260801-015 is a two-point compression-neutrality control (compressed versus matched
      uncompressed). IDEA-20260813-5988b7 conditions compressed and uncompressed ensembles on an identical
      planted oil space and compares fibre statistics - also two points, and in plain UOV rather than
      the quotient ring. IDEA-20260805-8d9ac0 argues the exponents cancel between QR-UOV and the extension-field
      baseline; IDEA-20260808-c959c7 computes the F_q-rank of the derived algebra-polar equations
      as m*ell; IDEA-20260805-bd8339 and IDEA-20260808-d07cd4 vary the quotient polynomial's factorization
      type, which is a different axis (which structure) rather than this one (how much structure).
      No in-repo record varies the AMOUNT of structure continuously inside one key, and no record
      has a built-in zero-dose arm produced by the same generator.
    verdict: 'UNVERIFIED. Nothing is asserted about published literature. Assembled from known parts:
      the W-pairing and its rank law are H-QRUOV-e8ae3e''s; Macaulay rank profiling is the program''s
      existing d_reg instrumentation lineage; dose-response designs are standard experimental methodology
      used elsewhere in this repository outside this bucket. Claimed new relative to the in-repo corpus
      only: making the structure fraction j an independent variable inside a single key, so that the
      null arm is the j = 0 endpoint of the same curve rather than a separately constructed object.'
  object_first_candidate:
    tracked_object: The partially structured key, parameterised by the integer dose j = number of
      A-linear blocks, together with the pair (first-fall degree, solver cost) measured on the key-recovery
      system derived from it.
    lossiness: Lossy. From a key with hundreds of F_q coefficients we retain one integer dose and
      two measured numbers, discarding the specific ring elements, the specific unconstrained blocks,
      and the planted oil module's coordinates. This is compatible with the operation being tracked
      because the attack's derivation uses A-multiplication relations, and the NUMBER of independent
      such relations available is a function of j alone, not of which elements were chosen; so the
      retained integer determines the quantity that is supposed to drive the effect. The discarded
      detail is what the error bars are for.
    propagation: One step is incrementing the dose by one block. The propagation rule is that each
      additional A-linear block adds at most ell - 1 new derived equations of the form P-polar(x,
      t^i x) = 0 available to the attacker, so the count of usable derived equations should grow linearly
      in j with slope at most ell - 1. That predicted slope is measurable directly, independently
      of any solving degree, and is the cheapest falsifiable consequence of the propagation rule.
    survival_score: The structure survives across the whole dose range by construction; what is at
      issue is where the measurable consequence appears. Concretely, the object is well defined for
      every j in 0..V(V+1)/2 and the experiment reports the smallest j at which the first-fall degree
      drops below the j = 0 value by more than its interval, or reports that no such j exists in the
      tested range.
  null_object_control: 'The null object is the j = 0 key: same field, same flattened dimensions, same
    planted oil module, same generator, same derivation code, differing only in that no block is A-linear.
    It is executed in the same invocation as every other dose, in interleaved order. For the signal
    arm to mean anything, the j = 0 arm must reproduce the plain-UOV first-fall degree already characterised
    by H-UOV-4d1377''s semi-regularity prediction to within its interval; if the zero-dose arm does
    not match the independently derived plain-UOV expectation, the instrument is measuring something
    else and no dose effect may be read. A second null replaces the A-linear blocks with random symmetric
    blocks that merely SHARE entries in the same pattern, giving a structure-shaped but algebra-free
    arm.'
  discriminated_from:
  - 'IDEA-20260801-015 (quotient-ring compression neutrality test): a two-point comparison of compressed
    versus matched uncompressed keys; it cannot separate a threshold from a gradient, which is the
    entire content here.'
  - 'IDEA-20260813-5988b7 (same-oil conditional fibre diagnostics): conditions on an identical oil
    space and compares two compression states in plain UOV, measuring fibre statistics rather than
    solving degree, and has no continuous structure axis.'
  - 'IDEA-20260805-bd8339 and IDEA-20260808-d07cd4 (quotient polynomial factorization type, radical
    lifting): vary WHICH algebra is used at full structure; this varies HOW MUCH of the key uses the
    algebra at a fixed algebra, an orthogonal axis that could be crossed with theirs later.'
  - 'IDEA-20260808-c959c7 (rank of derived algebra-polar equations equals m*ell): computes the equation
    count at full dose; this proposal measures the same count as a function of dose and uses their
    forced value as its full-dose anchor.'
  - 'H-UOV-4d1377 (semi-regularity of the intersection system): supplies the expected zero-dose behaviour
    used as the instrument check, and is a hypothesis about plain UOV rather than about compression.'
  assumptions:
  - The W-pairing construction of H-QRUOV-e8ae3e P1 is correct, since the A-linear blocks are built
    from it.
  - A key with mixed block types is still a valid UOV-shaped object with a genuine oil module, which
    the planting stage enforces and the certificate verifies.
  - First-fall degree measured on a truncated Macaulay matrix is a usable proxy for solving difficulty
    at these sizes; this is an instrument assumption, not a mathematical one, and it is why solver
    cost is measured alongside it.
  - Exact F_q linear algebra throughout, with rank computed by one frozen routine shared by all arms.
  - Toy sizes admit the full Macaulay matrix at the degrees needed.
  predictions:
  - metric: count of independent derived equations of the form P-polar(x, t^i x) = 0 as a function
      of dose j
    direction: higher
    minimum_effect: predicted exactly linear in j with slope at most ell - 1; the measured slope is
      reported with its fit residual
  - metric: first-fall degree of the derived key-recovery system at full dose versus at zero dose
    direction: lower
    minimum_effect: 1
  - metric: dose j at which the first-fall degree first drops below its zero-dose value by more than
      one interval
    direction: different
    minimum_effect: no pre-commitment to a value; the point of the experiment is to locate it, and
      a refusal to guess here is more honest than a made-up threshold. If no such j exists in range,
      that is reported as the result
  - metric: solver cost at zero dose compared with the independently predicted plain-UOV cost
    direction: different
    minimum_effect: 'forced: must agree within one interval, else the instrument is void'
  minimal_test:
    design: One field, one algebra, one sweep. Take q = 7, ell = 2, V = 4, M = 2, so the flattened
      key has 8 variables and 4 equations over F_7 - small enough that a planted oil module can be
      verified exhaustively and that the Macaulay matrix at degrees up to 4 fits in memory trivially.
      Sweep the dose j over 0, 1, 2, ..., 10 (the number of upper-triangular blocks), with 30 independently
      generated keys per dose, all sharing one planted oil module dimension and generated by the same
      code path with interleaved seeds. For each key, count the independent derived A-multiplication
      equations, compute the Macaulay rank profile up to degree 4, record the first-fall degree, and
      run the same bounded solver. Report first-fall degree and solver cost against j with 30-key
      intervals. This single sweep discriminates a step from a gradient from a flat line, and its
      left endpoint is a fully executable null produced by the identical generator.
    controls:
    - Zero-dose arm (j = 0) as the built-in null, interleaved with every other dose in the same invocation.
    - 'Pattern-only control: blocks that share entries in the A-linear pattern but with entries drawn
      at random rather than from A, isolating sparsity and repetition from algebra.'
    - 'Fixed-oil-module control: identical planted oil module dimension across all doses, so the planting
      cannot vary with j.'
    - 'Seed-interleaving control: doses are run in randomized order with paired seeds so that machine
      state cannot correlate with j.'
    - 'Full-dose anchor: the j = maximum arm''s derived equation count must match the m*ell forced
      value recorded in IDEA-20260808-c959c7, or the construction is wrong.'
    required_metrics:
    - first-fall degree per key, per dose
    - Macaulay rank profile by degree, per key
    - count of independent derived A-multiplication equations, per key
    - solver cost (field operations, not seconds) per key
    - per-dose mean and interval for each of the above
    - annihilation certificate result for every planted oil module
  falsification_conditions:
  - The zero-dose arm does not reproduce the independently expected plain-UOV first-fall behaviour
    within its interval, which voids the instrument entirely.
  - The derived-equation count is not linear in j, which refutes the stated propagation rule.
  - First-fall degree is flat across the entire dose range including full dose, which falsifies the
    claim of a measurable dose effect at the tested parameters and is recorded as a measured absence
    with its interval.
  - The pattern-only control reproduces the full-dose effect, which shows the effect is repetition
    rather than algebra.
  - An annihilation certificate fails at any dose, meaning some arm has no genuine oil module and
    is not comparable.
  confounders:
  - 'Solver-side asymmetries: a solver whose pivoting happens to favour block structure would produce
    a cost effect with no degree effect; mitigated by reporting both and by counting field operations
    rather than seconds.'
  - Planting artifacts, where the oil module is easier to find in structured keys because of how it
    was planted rather than because of the structure; mitigated by planting identically at every dose
    and by the pattern-only control.
  - Tiny q and ell exaggerating algebraic coincidences; mitigated by sweeping q in {7, 11, 13} and
    ell in {2, 3}.
  - Confusing the number of blocks with the number of independent relations, which is why the relation
    count is measured directly rather than assumed from j.
  - Reading a threshold located at toy parameters as a threshold anywhere else, which the interpretation
    limits forbid.
  interpretation_limits:
  - A measured dose curve is a statement about toy (q, ell, V, M) with one solver lineage and does
    not transfer to deployed QR-UOV parameters.
  - A flat curve is a measured absence of effect, not evidence that structured compression is security-neutral.
  - First-fall degree is an instrument proxy; a degree drop is not a cost claim and no exponent is
    derived from it here.
  target_complexity:
    time_exponent: No attack exponent is claimed. The experiment's own cost is dominated by Macaulay
      rank computations of size at most a few thousand rows per key.
    memory_exponent: No attack memory exponent is claimed. Peak memory is one Macaulay matrix at the
      largest tested degree, bounded well under a gigabyte at the stated sizes.
    best_known: The incumbent for the question 'does quotient-ring structure change key-recovery difficulty'
      is the in-repo pair IDEA-20260805-8d9ac0 (exponents cancel) and IDEA-20260801-015 (two-point
      neutrality control); on the attack side the named baseline in RQ-QRUOV-001 is the reduction
      to plain UOV over the extension field, and this proposal does not compete with it because it
      claims no attack.
    hidden_overhead: The human cost is building one generator that produces every dose including the
      null, rather than two generators that look alike; two generators is the cheap path and it is
      exactly what makes a null arm untrustworthy. Lower-order compute cost is dominated by rank computations
      at the highest degree tested, which grow fast enough that the degree cap must be fixed in advance
      rather than raised when results are disappointing.
  dominated_by: n/a (no result claimed). Checked against each attack frontier row named in RQ-QRUOV-001
    - the extension-field UOV reduction, rectangular MinRank, and its structure-aware refinements
    - on time, memory and data axes; none is comparable because this produces a degree curve on partially
    structured toy objects, not a cost for any real key.
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverable is
    a first-fall-degree curve over eleven dose values with 30-key intervals, a measured slope for
    the derived-equation count, and a located threshold or an explicit statement that none exists
    in range.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Part A (partially structured keys are constructible with genuine oil
    modules at every dose): 0.85, the construction is straightforward and the certificate makes failure
    loud. Part B, first half (monotone nonincreasing first-fall degree in dose): 0.7, since more derived
    equations should not raise the degree, but measurement noise at toy sizes can easily produce non-monotone
    points. Part B, second half (a step rather than a gradient): 0.35, honestly low - a gradient is
    at least as plausible, and I expect this half to be the one that fails, which is fine because
    the curve is the deliverable and the shape is the finding. Part C (the zero-dose arm reproduces
    the independently expected plain-UOV behaviour): 0.75, and if it fails the whole run is void rather
    than negative.'
