# =============================================================================
# IDEA-20261001-d53638 -- Normal-basis HW filter vs polynomial-basis
# low-weight filter: does the BASIS choice alone change Semaev m=2 yield
# at matched density on toy Koblitz?
# Zero scientific ECDLP attack runs. No break / rho / exponent / n=131.
# =============================================================================
idea:
  id: IDEA-20261001-d53638
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    BASIS, NOT WALK: at matched Hamming-weight density, does a normal-basis
    HW≤c pool (Bailey filter representation) enrich or deplete Semaev m=2
    yield versus a polynomial-basis low-weight pool of equal size — isolating
    R1 representation from the Frobenius walk?

  class: composition

  claim: >-
    KN-LIT-661e97's DP predicate is HW(x)≤34 in a TYPE-2 NORMAL BASIS, not
    in the polynomial basis used by most F2 factor-base constructions
    (KR-IC-73db3f). EXP-BINSTD-a3cfee compared walk-sourced DP pools to
    HW-filter-only pools in ONE basis; it did not ask whether the BASIS
    alone correlates with Semaev decomposability.
    CLAIM (measurement). At toy Koblitz n∈{17,23}, freeze two cutoffs
    (c_nb, c_pb) so binomial (or exact) densities match within 10%, build
    equal-size pools by rejection sampling: (A) normal-basis HW≤c_nb;
    (B) polynomial-basis HW≤c_pb; (C) uniform size-matched control. Run
    identical mitt Semaev m=2 search (≥200 attempts/arm). Pre-registered
    null: all pairwise yield ratios in [0.7,1.4]. Out-of-band ratio
    replicated at a second n is the surprising H_alt (basis-dependent
    enrichment/depletion). CLAIM TIER: observational. NO walk in this
    idea (walk isolated by EXP-BINSTD-a3cfee's HW-filter-only arm). NO
    exponent. NO break. NO n=131 transfer.

  mechanism: >-
    OBJECT FRAME. Representation R1: the SAME curve point's x-coordinate
    expressed in two bases (normal vs polynomial) — a coordinate change
    that CHANGES which points satisfy a low-HW predicate. Operation set
    Sigma: F2 mitt translation by pool elements (Class I partial-action).
    Trichotomy: Class I for the relation search; the filter itself is
    coordinate-dependent (Class III of IDEA-20260806-c5d183) — named
    explicitly. Lossy-projection test: the HW predicate discards
    high-weight coordinates; Sigma-compatibility is not claimed for the
    filter (filter is sampling, not propagation). OFF-LIMITS: F2 as
    relation search; F1 unused; F6 unused. What is added: a controlled
    R1 bake-off of two published bases at matched density, with uniform
    control, without the Bailey walk confounder.

  novelty_status: unverified
