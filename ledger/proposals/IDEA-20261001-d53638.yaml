  heuristic_assumptions:
    - id: HEUR-BINSTD-d53638-H1
      formal_statement: >-
        FORALL tested toy cells: pairwise yield ratios among
        {normal-HW, poly-HW, uniform} lie in [0.7,1.4] at m=2 when densities
        match within 10% and pool sizes are equal.
      random_model_justification: >-
        Rigorous ingredient: Hamming weight in any fixed F_2-basis of an
        n-bit string is Binomial(n,1/2) under the uniform measure on
        field elements. Classical: basis change is an F_2-linear
        automorphism, so weight distributions agree in law for uniform
        field elements. Heuristic transfer: Semaev decomposability is a
        statement about curve arithmetic, conjectured independent of the
        bit-level weight predicate once density is matched.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        A pairwise ratio outside [0.7,1.4] replicated at two independently
        seeded cells (second n or second matched-density cutoff pair),
        with certificates intact and uniform baseline OK.

  predictions:
