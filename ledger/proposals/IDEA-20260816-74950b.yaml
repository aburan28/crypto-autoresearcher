idea:
  id: IDEA-20260816-74950b
  question_id: RQ-SIMSPK-f6a6c0
  added: '2026-08-16'
  title: 'The same literal integers recur across every block and key size, so ask whether their RANK
    recurs too: compute the rank trajectory of each literal rotation triple as word size grows through
    the family''s own sizes, and measure the transfer coefficient every toy-scale conclusion here
    silently assumes when extrapolating from word size 8 to 16 and beyond.'
  class: measurement
  claim: '(A) The SIMON family reuses the same literal rotation triple across all its word sizes;
    that reuse is the family''s own structural claim and is what makes a cross-size question well
    posed at all, because a triple of small integers is meaningful modulo 8, 16, 24, 32 and 64 alike.
    The claim is therefore that the natural object is not a constant at one word size but a constant''s
    RANK TRAJECTORY across word sizes, the vector of its percentile ranks at n = 8, 12, 16 and 24
    under a fixed measure. (B) The claim is that this trajectory measures something the whole campaign
    needs and currently assumes: every contract in this goal that runs at word size 8 for budget reasons
    implicitly assumes its ranking says something about word size 16 or larger. That assumption is
    named in each contract''s scale justification and is nowhere tested. The transfer coefficient,
    defined as Kendall tau between the ranking at word size n and at word size n'', is directly computable
    and is the number that licenses or forbids the extrapolation. (C) The claim predicts decay with
    a specific structure rather than a specific value: tau(n, n'') should be higher for adjacent word
    sizes than distant ones, and should be higher between word sizes sharing arithmetic structure,
    for instance both powers of two, than between structurally dissimilar ones, because the rotation
    amounts'' behaviour depends on greatest-common-divisor relations with n. If tau instead shows
    no dependence on the arithmetic relationship between n and n'', the mechanism is wrong even if
    some transfer exists. (D) The claim identifies the specific consequence: if tau between word sizes
    8 and 16 is low, then every toy-scale conclusion in this goal is scoped to toy and may not be
    extrapolated, which is a measured obstruction of high value that would redirect the campaign''s
    budget toward larger word sizes before it is spent. (E) NOT CLAIMED: that transfer is or is not
    present; that any measure''s transfer behaviour predicts another''s; that the standardized triple''s
    trajectory is special; that a stable rank implies anything about design; and no attack, distinguisher
    or security consequence.'
  mechanism: 'STAGE A, define the cross-size map explicitly: a literal integer triple (a,b,c) is interpreted
    at word size n by reduction modulo n, so the same literal triple names a different function at
    each n. State the degenerate cases, for instance a triple whose entries collide modulo a small
    n, and handle them as a declared stratum rather than dropping them. STAGE B, score at each word
    size: for each literal triple in the shared domain, compute the chosen measure''s value at word
    sizes 8, 12, 16 and 24, at round counts chosen per word size by a frozen rule that keeps the round
    count comparable, for instance a fixed fraction of the variant''s full round count, since comparing
    round 6 at word size 8 with round 6 at word size 24 would confound word size with relative depth.
    STAGE C, rank trajectories: convert values to percentile ranks within each word size separately,
    which removes the measure''s scale dependence on n, and assemble a trajectory per triple. STAGE
    D, transfer coefficients: compute Kendall tau-b between every pair of word sizes, producing a
    transfer matrix, with bootstrap intervals over triples and with censored cells excluded symmetrically
    and their count reported. STAGE E, structure test: regress or tabulate tau against the arithmetic
    relationship between the word-size pair, testing the prediction that structurally similar sizes
    transfer better. STAGE F, nulls in the same invocation: a label-shuffle null giving the tau band
    under independence; and a random-trajectory null in which each triple''s rank at each word size
    is drawn independently, giving the tau expected when trajectories carry nothing. STAGE G, the
    standardized triple''s own trajectory reported explicitly with its rank at each word size and
    its largest inter-size rank jump.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril SIMSPK over ledger/proposals, ledger/hypotheses and experiments, returning nothing;
      grep -ril 'transfer' over ledger/proposals sampled by area; grep -ril 'extrapolat' over ledger/proposals;
      grep -ril 'scale_justification|toy scale' over experiments/*/specification.yaml to see how the
      program currently states transfer assumptions, reading experiments/EXP-AES-1b80e0/specification.yaml
      as the exemplar; read RQ-SIMSPK-f6a6c0's third target on the per-variant margin curve across
      twenty variants and its scope statement that the families span all block and key size variants;
      read GOAL-SIMSPK-001's completion criteria including the per-variant margin curve requirement.
    results: No prior proposal under this question. The program states transfer assumptions routinely
      in experiment scale_justification fields, and AGENTS.md rule 4 as summarized in CLAUDE.md requires
      tested scale and any transfer or extrapolation assumption to be explicit, but stating an assumption
      is not measuring it and no record found measures a transfer coefficient between scales for any
      quantity. RQ-SIMSPK-f6a6c0's third target asks for a per-variant margin curve across twenty
      variants, which is the closest existing requirement and is about margins per variant rather
      than about whether a RANKING recurs across variants; GOAL-SIMSPK-001 repeats it. The bucket's
      own opening on block and key size variants as a family where the same constants recur and the
      same ranking should recur states the question this entry operationalizes, and no record in the
      corpus computes it.
    verdict: 'UNVERIFIED. No claim is made about what any external publication contains. Assembled
      from known parts: Kendall tau between rankings is standard, bootstrap intervals are standard,
      label-shuffle nulls are standard, and the reduction of a literal integer modulo different word
      sizes is arithmetic. Claimed new only in combination and only locally: treating a literal rotation
      triple''s rank trajectory across the family''s own word sizes as the tracked object, computing
      a transfer matrix as the licence for every toy-scale extrapolation this goal makes, and predicting
      that transfer depends on the arithmetic relationship between word sizes rather than merely on
      their distance.'
  object_first_candidate:
    tracked_object: 'The rank trajectory of a literal integer rotation triple: the vector of its percentile
      ranks under a fixed measure at word sizes 8, 12, 16 and 24, where the same literal triple is
      interpreted at each size by reduction modulo n. What is followed through the computation is
      that trajectory, and the derived object of interest is the transfer matrix of pairwise rank
      correlations between word sizes over the whole set of trajectories.'
    lossiness: 'Genuinely lossy at two steps. Converting a measure value to a within-word-size percentile
      rank discards the value and its units, which is necessary and compatible because measure values
      at different word sizes are not on a common scale at all: a trail weight at word size 24 and
      one at word size 8 are not comparable numbers, and only their positions within their own populations
      are. Assembling ranks into a trajectory then discards nothing further. The projection is compatible
      with the target operation, incrementing word size, precisely because rank is defined within
      each word size, so the operation acts on the trajectory coordinatewise without needing a cross-size
      scale that does not exist. What is irrecoverably lost, and stated plainly: any statement about
      how much better a constant is at one size than another, which this object cannot support and
      which no record derived from it may assert.'
    propagation: The target operation is moving from word size n to the next size in the family's
      own list. Under it, a triple's rank moves by an amount determined by how the measure's dependence
      on the greatest-common-divisor relations between a, b, c and n changes; a triple whose advantage
      at word size 8 comes from a coincidence modulo 8 loses it at 12, while a triple whose advantage
      comes from a relation holding for all n retains it. One step of the operation therefore acts
      on the trajectory as a permutation of ranks whose deviation from the identity is exactly the
      transfer coefficient's complement, and the mechanism generating the deviation is arithmetic
      rather than statistical, which is why the structure test in STAGE E is a real test rather than
      a fishing expedition.
    survival_score: 'The concrete survival number is the transfer horizon: the largest word size n_max
      such that Kendall tau between the ranking at word size 8 and at word size n_max exceeds a declared
      threshold of 0.7. Below that horizon, toy-scale conclusions in this goal may be extrapolated
      with the tau stated; above it they may not, and the campaign must run at the larger size directly.
      A second number is the per-triple trajectory stability, the largest inter-size rank jump for
      each triple, which identifies triples whose rank is entirely size-specific and which are therefore
      poor candidates for any cross-size claim. Both are reported per measure, since transfer is a
      property of the measure as much as of the constants.'
  null_object_control: Two nulls, both in the same invocation. The primary null object is a set of
    trajectories in which each triple's rank at each word size is drawn independently and uniformly,
    matching the observed rank distribution but carrying no cross-size structure; the identical transfer
    matrix is computed on it, giving the tau expected when trajectories mean nothing, which is centred
    on zero with a spread set by the number of triples. The secondary null is a label shuffle within
    one word size, permuting which triple holds which rank at word size 16 while leaving word size
    8 intact, over 1000 permutations, giving the independence band directly from the real marginals.
    For the signal arm to mean anything, the observed tau between adjacent word sizes must lie outside
    the label-shuffle band; if it lies inside, the ranking does not transfer at all between those
    sizes and every toy-scale conclusion in this goal is scoped to its own word size, which is a decisive
    and highly usable measured obstruction. A third calibration arm computes tau between a word size
    and itself under a rerun, which must be exactly 1.0 and detects any nondeterminism in the scoring
    pipeline.
  discriminated_from:
  - RQ-SIMSPK-f6a6c0's third target, the per-variant margin curve, which asks for exact trail bounds
    per round count per variant. That produces margins per variant; this entry produces a correlation
    between rankings across variants, and the margin curve does not answer whether a ranking recurs
    even when it is fully computed.
  - The rank-correlation contract between differential and linear measures, which holds word size
    fixed and varies the measure. This entry holds the measure fixed and varies the word size, so
    the two are orthogonal and their statistics are not comparable even though both are Kendall tau.
  - The scale_justification fields that every experiment contract in this program carries, including
    experiments/EXP-AES-1b80e0/specification.yaml, which state a transfer assumption as required by
    AGENTS.md rule 4. Stating an assumption and measuring it are different acts, and this entry converts
    one standing assumption in this goal into a number.
  - A study of one variant at several round counts, which measures depth rather than width. Here round
    count is held at a frozen comparable fraction precisely so that word size is the varying factor
    and depth is not confounded with it.
  - The resolution-profiling contract, which asks whether a measure can rank at a given word size.
    A measure can have excellent resolution at both word size 8 and 16 and still show zero transfer
    between them; resolution is a precondition for this measurement and not a substitute for it.
  assumptions:
  - The same literal integer triple is a meaningful object across word sizes because the family itself
    reuses its constants across sizes; this is the entry's framing assumption and it is stated rather
    than defended, since a reader who rejects it rejects the question.
  - Reduction modulo n is the right cross-size interpretation of a literal triple. Alternative interpretations,
    for instance scaling the rotation amounts proportionally to n, are a different question and are
    run as a declared robustness arm at word sizes 8 and 16 only.
  - Round counts are chosen per word size by a frozen comparable rule, a fixed fraction of each variant's
    full round count, so that word size rather than relative depth is the varying factor. This rule
    is a modelling choice and is frozen before scoring.
  - The chosen measure has adequate resolution at every word size in the sweep, established by the
    resolution-profiling contract; without that, tau is computed over mass ties and means nothing.
  - Censoring is handled symmetrically across word sizes and its rate is reported per size, since
    larger word sizes censor more and differential censoring would masquerade as poor transfer.
  predictions:
  - metric: Kendall tau-b between rankings at adjacent word sizes, for example 8 and 12
    direction: higher
    minimum_effect: 'explicit refusal to pre-commit a value: the campaign has never computed a ranking
      at two word sizes, so any number named now would be invented. What is pre-committed is that
      the full transfer matrix is reported with bootstrap intervals, that the label-shuffle band is
      reported alongside, and that no toy-scale extrapolation elsewhere in this goal is made without
      quoting the relevant tau.'
  - metric: Kendall tau-b between distant word sizes, for example 8 and 24, relative to adjacent ones
    direction: lower
    minimum_effect: 0
  - metric: dependence of tau on the arithmetic relationship between the word-size pair, for example
      both powers of two versus not
    direction: different
    minimum_effect: 'forced structural prediction rather than a magnitude: tau is predicted to depend
      on the arithmetic relationship and not merely on the numeric distance between sizes. A transfer
      matrix whose entries are explained by distance alone falsifies the mechanism in claim (C) while
      leaving the measurement itself intact and useful.'
  - metric: self-transfer tau between a word size and a rerun of itself
    direction: higher
    minimum_effect: 1.0
  - metric: largest inter-size rank jump of the standardized triple across the swept word sizes
    direction: different
    minimum_effect: 'forced reporting rule: the standardized triple''s full trajectory and its largest
      jump are reported whatever they are, with no threshold for notability chosen after the values
      are seen, and with the same statistics reported for the median triple as a reference.'
  minimal_test:
    design: 'Two word sizes are enough to answer the campaign''s most urgent question, and the cheapest
      pair is the one the campaign actually uses. Fix word sizes 8 and 16 and one measure with established
      resolution at both, preferring impossible-differential reach because it costs O(n) per round
      and needs no trail search, which makes both sizes affordable exhaustively. Enumerate the literal
      triples in the shared domain, that is entries in 0 through 7 so reduction is the identity at
      both sizes for a clean first pass, giving 512 literal triples, and score all of them at both
      word sizes at round counts set by the frozen comparable-fraction rule. Convert to within-size
      percentile ranks, compute Kendall tau-b with a 1000-resample bootstrap, and run the 1000-permutation
      label-shuffle null and the independent-trajectory null in the same invocation. Add the self-transfer
      calibration arm by rescoring word size 8 and requiring tau exactly 1.0. Total cost is minutes,
      since the measure is cheap at both sizes. The single discriminating number is tau between 8
      and 16 against the label-shuffle band: inside the band means toy-scale rankings in this goal
      say nothing about word size 16, which redirects the campaign''s budget immediately and is worth
      far more than the run costs.'
    controls:
    - 'Self-transfer calibration: rescore one word size and require tau exactly 1.0, detecting any
      nondeterminism in the scoring pipeline.'
    - Label-shuffle null within one word size, 1000 permutations, giving the independence band directly
      from the real marginals.
    - Independent-trajectory null with ranks drawn independently per word size, giving the tau expected
      when trajectories carry no structure.
    - 'Censoring symmetry check: censoring rates reported per word size, with a rerun excluding all
      censored triples from every size symmetrically to confirm the transfer conclusion is not censoring-driven.'
    - 'Alternative cross-size interpretation: rotation amounts scaled proportionally to n rather than
      reduced modulo n, run at word sizes 8 and 16, so the conclusion does not rest on one interpretation
      of what the same constant means across sizes.'
    required_metrics:
    - transfer matrix of Kendall tau-b between every pair of swept word sizes, with bootstrap intervals
    - label-shuffle independence band per word-size pair
    - independent-trajectory null tau per word-size pair
    - self-transfer tau, required exactly 1.0
    - transfer horizon n_max at the declared threshold of 0.7
    - per-triple largest inter-size rank jump, with the standardized triple and the median triple
      reported explicitly
    - censoring rate per word size and the transfer matrix recomputed on the censoring-symmetric subset
    - wall-clock seconds and peak resident memory per word size
  falsification_conditions:
  - Self-transfer tau below 1.0, which means the scoring pipeline is nondeterministic and no transfer
    number computed from it is meaningful.
  - Observed tau between every pair of word sizes lying inside the label-shuffle band, meaning rankings
    do not transfer at all; this refutes any cross-size framing and is simultaneously the most valuable
    outcome for the campaign's budget allocation.
  - Transfer matrix entries fully explained by numeric distance between word sizes with no dependence
    on arithmetic relationship, falsifying the structural prediction in claim (C).
  - Transfer conclusions reversing when recomputed on the censoring-symmetric subset, which means
    the measured transfer is a censoring artifact.
  - The chosen measure failing its resolution gate at any swept word size, which makes tau at that
    size a correlation over mass ties and voids that row and column of the matrix.
  - Transfer conclusions reversing under the proportional-scaling cross-size interpretation, which
    would mean the result is an artifact of reduction modulo n rather than a property of the family's
    constant reuse.
  confounders:
  - 'Round count is the dominant confounder: comparing a fixed absolute round count across word sizes
    confounds size with relative depth, since larger variants have more rounds. The frozen comparable-fraction
    rule addresses this and is itself a modelling choice whose sensitivity is tested at two alternative
    fractions.'
  - Larger word sizes censor more, so poor transfer could be a censoring artifact rather than a property
    of the constants; the censoring-symmetric recomputation exists solely to separate these and its
    omission would be seriously misleading.
  - Restricting literal triples to entries 0 through 7 for a clean first pass excludes triples that
    only exist at larger word sizes, so the measured transfer is scoped to the shared domain and does
    not describe the full space at word size 16 or 24.
  - Degenerate reductions, for instance a literal triple whose entries collide modulo a small word
    size, create artificial ties at that size and inflate or deflate tau; they are reported as a declared
    stratum and the matrix is recomputed with them excluded.
  - Transfer measured for one portfolio measure says nothing about another, and quoting a single transfer
    coefficient as if it licensed all toy-scale extrapolation in the goal would be the characteristic
    misuse; the matrix is reported per measure.
  interpretation_limits:
  - A transfer coefficient licenses extrapolating a RANKING, not a value. No margin, weight or reach
    measured at word size 8 may be quoted for word size 16 under any tau.
  - Transfer is a property of the measure and of the word-size pair, so a single number never licenses
    the goal's toy-scale conclusions generally; each conclusion must quote the tau for its own measure
    and its own pair.
  - A high transfer coefficient says a ranking recurs; it says nothing about why, and in particular
    nothing about design, intent or provenance in either direction.
  - Results are scoped to the shared literal-triple domain, the frozen round-count rule, the cross-size
    interpretation used, and the word sizes actually swept, and none of them extends to word sizes
    32, 48 or 64, which are not run.
  - A low transfer coefficient is not evidence that a constant behaves badly at larger sizes; it is
    evidence that toy-scale ranking cannot tell you how it behaves, which is a statement about the
    campaign's instruments.
  target_complexity:
    time_exponent: No attack exponent is claimed. Instrument cost is the chosen measure's cost summed
      over word sizes; with impossible-differential reach at O(n) per round the whole sweep across
      four word sizes is seconds to minutes, and with trail-search-based measures it is dominated
      by word size 24 and bounded by the declared stage budget. This contract's own arithmetic is
      O(N log N) per pair for tau, milliseconds.
    memory_exponent: No attack memory exponent is claimed. Storage is one rank per triple per word
      size, 512 by 4 numbers in the minimal design, kilobytes, plus the bootstrap resample buffers.
    best_known: 'The incumbent is the standing practice this program already follows under AGENTS.md
      rule 4 and visible in every experiment''s scale_justification field, including experiments/EXP-AES-1b80e0/specification.yaml:
      state the tested scale and name the transfer assumption. That incumbent is honest and unquantified.
      No algorithmic frontier is contested; the contribution is converting a named assumption in this
      goal into a measured coefficient.'
    hidden_overhead: 'Hidden in the lower-order terms: the frozen comparable round-count rule is doing
      enormous work and a poor choice would silently produce either spurious transfer or spurious
      decay, so its sensitivity arms are not optional garnish. Hidden in the human cost: restricting
      to the shared literal-triple domain is a real scoping decision that makes the first pass cheap
      and makes the result narrower than it sounds, and saying so in every conclusion is the discipline
      this entry stands or falls on.'
  dominated_by: 'n/a (no result claimed). A real Pareto check was performed across time, memory and
    data/queries: no attack, distinguisher or query-bounded procedure is produced, so no frontier
    row exists on any axis. There is no competing method in this corpus for measuring cross-scale
    ranking transfer, so nothing dominates it; the only cost comparison is against running every contract
    directly at word size 16 or 24, which this measurement is designed to tell the campaign whether
    it must do.'
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverables are
    the transfer matrix of Kendall tau-b between word sizes 8, 12, 16 and 24 with bootstrap intervals,
    the label-shuffle independence band, the transfer horizon n_max at the declared 0.7 threshold,
    and the standardized triple's full rank trajectory with its largest inter-size jump. No time,
    memory or data complexity is compared against any cryptanalytic frontier because none is produced.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Part (A), that a literal integer triple is a meaningful cross-size object
    because the family reuses its constants: 0.9, this is the family''s own structure rather than
    a hypothesis of this proposal. Part (B), that the transfer coefficient is computable at reachable
    cost for at least one portfolio measure: 0.85, because impossible-differential reach costs O(n)
    per round and makes the whole sweep affordable even if trail-based measures do not. Part (C),
    that transfer depends on arithmetic relationship rather than numeric distance: 0.4, this is the
    most speculative part and its failure leaves the measurement fully intact and useful. Part (D),
    that transfer between word sizes 8 and 16 turns out low enough to forbid toy-scale extrapolation:
    0.5, and this is deliberately the outcome with the highest value to the campaign, since it would
    redirect budget before it is spent rather than after a toy-scale conclusion has been written up
    and quoted.'
