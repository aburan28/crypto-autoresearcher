idea:
  id: IDEA-20260805-a102ec
  question_id: RQ-MLKEM-003
  goal_id: GOAL-MLKEM-004
  added: '2026-08-05'
  title: >-
    Three load-bearing constants inside MATZOV.Nf that two campaigns argued over
    and nobody read: the single-representative-length model (sign forced by
    monotonicity), the mixed bits/nats union-bound term, and the unchecked
    N-versus-sieve-database consistency condition

  class: control

  claim: >-
    MATZOV.Nf assigns EVERY one of its N dual vectors the same length lsigma_s,
    which is the OUTER radius of the sieve ball -- sqrt(4/3) times the Gaussian
    heuristic length. Since the per-vector advantage exp(-2 pi^2 r^2/q^2) is
    strictly decreasing in r and every database vector satisfies r <= R by the
    definition of the sieve, the per-vector advantage is POINTWISE at least the
    modelled one, so the model's aggregate advantage is a strict lower bound and
    Nf's N is a strict OVERESTIMATE, unconditionally and with no distributional
    assumption whatsoever. The magnitude is a closed form,
    rho = sum_{k>=0} kappa^k / prod_{j=1..k}(beta_sieve/2 + j), with
    kappa = (1/2) ln(N_Nf / L) recoverable from Nf's own output and L its own
    log-term; the correction to the sample count is exactly N/rho^2, i.e.
    -2 log2(rho) bits on Nf's T_table term. Two further defects of the same file
    are audited alongside: (2) the union-bound term
    (k_enum*Hf + k_fft*log(p) + log(1/mu)) adds a quantity in BITS to two
    quantities in NATS, since Hf divides by log(2) and is used elsewhere as
    2^(k_enum*Hf); (3) Nf returns an N that is consumed by
    red_cost_model.short_vectors without any check that N is at most the number
    of vectors a sieve of dimension beta_sieve can hold, approximately
    (4/3)^(beta_sieve/2), even though the single-length model is exactly the
    statement that all N come from inside one such ball. THE PROPOSAL CLAIMS NO
    ML-KEM RESULT. It claims that three checkable statements about a pinned file
    can be settled at zero compute, that each has a derived sign, and that this
    program has cited that file across two campaigns without settling any of
    them.

  object_first_candidate:
    tracked_object: >-
      The LENGTH DISTRIBUTION of the sieve database, projected to the single
      scalar the cost model consumes. Followed through: sieve output pool ->
      empirical distribution of ||v||^2 -> mean per-vector advantage
      E[exp(-2 pi^2 ||v||^2 sigma^2 / q^2)] -> the aggregate distinguishing
      statistic -> N. The model replaces the whole distribution by its supremum;
      the object tracked here is the discarded spread and what it is worth in
      bits.
    established_families_off_limits: >-
      Off-limits as the primary lens: estimator differencing (GOAL-MLKEM-003's
      closed lane); new score statistics on candidate groups (GOAL-MLKEM-004's
      six refuted observables); primal/BDD attacks; decryption-failure and FO
      attacks; implementation side channels; and -- specific to this proposal --
      ANY inference about the independence heuristic. That question belongs to
      IDEA-20260805-5a4409 and mixing the two would let a length-model result be
      read as an independence result, which is the conflation
      DEC-20260805-0b3e11 spent six batches disentangling.
    newness_score: >-
      The Jensen-type observation is elementary; auditing a published cost
      function is a standard move. What this corpus does not contain is any
      record that anyone read estimator/lwe_dual.py's MATZOV.Nf line by line.
      EV-MLKEM-015 ran it, EV-MLKEM-011/012/013/016/018 audited Carrier's tables
      and code, GOAL-MLKEM-003 differenced its outputs for twelve batches and
      GOAL-MLKEM-004 tried to measure its input for six, and the one artifact
      that quotes its source (BATCH-f75059's wellposedness.md) quotes line 540
      only. The newness is that the file was opened.
    testability_score: >-
      Maximal for items (2) and (3): both are decided by reading and by arithmetic
      on numbers the estimator already prints, at zero compute and in minutes.
      High for item (1): the sign is decided on paper; the magnitude needs only
      the empirical length distribution of a sieve database, and one such database
      is ALREADY ARCHIVED in this repository
      (BATCH-f75059/.../vectors.json, 17,919 certified vectors at d = 60,
      q = 127, with x and y emitted per vector).
    survival_score: >-
      Item (1)'s sign survives to cryptographic parameters unchanged, because it
      needs only that database vectors lie inside the sieve ball. Its MAGNITUDE
      does not survive automatically: rho depends on beta_sieve and kappa, both of
      which are crypto-scale quantities, so the crypto-scale number is a model
      evaluation and not a measurement, and is labelled as such. The magnitude's
      MODEL -- the Gaussian-heuristic ball law for database lengths -- is what the
      toy measurement tests, and it may well fail, which is a stated outcome
      rather than a risk to be managed.

  mechanism: >-
    SOURCE READ THIS SESSION. github.com/malb/lattice-estimator at commit
    3e48ef421ec256afddb3e7d2249a77eab6e9ba12 -- the pin
    tools/sage_free_estimator/README.md records as the commit EXP-MLKEM-015 used.
    estimator/lwe_dual.py, class MATZOV, lines 526-564. The three expressions
    below are transcribed from that file, not recalled:

      k_lat = params.n - k_fft - k_enum                                    # 540
      lsigma_s = ( Xe.stddev**(m/(m+k_lat))
                 * (Xs.stddev*q)**(k_lat/(m+k_lat))
                 * sqrt(4/3)
                 * sqrt(beta_sieve/2/pi/e)
                 * deltaf(beta_bkz)**(m+k_lat-beta_sieve) )                # 543-549
      N = ( exp(4*(lsigma_s*pi/q)**2)
          * exp(k_fft/3.0*(Xs.stddev*pi/p)**2)
          * (k_enum*Hf(Xs) + k_fft*log(p) + log(1/mu)) )                   # 552-556
      Hf(Xs) = RR(1/2 + log(sqrt(2*pi)*Xs.stddev)
                  + log(coth(pi**2 * Xs.stddev**2))) / log(2.0)            # 560-564

    ITEM 1 -- THE SINGLE REPRESENTATIVE LENGTH, AND A SIGN THAT NEEDS NO
    DISTRIBUTION. sqrt(beta_sieve/(2 pi e)) is the Gaussian-heuristic length of a
    shortest vector in a unit-determinant lattice of dimension beta_sieve, and
    sqrt(4/3) is the sieve's saturation radius, so lsigma_s is the length of a
    vector at the OUTER EDGE of the sieve ball, rescaled by the determinant
    factors and by deltaf(beta_bkz)^(m+k_lat-beta_sieve). Write R := lsigma_s and
    kappa := 2 (R pi / q)^2, so that the per-vector advantage the model uses is
    abar = exp(-kappa) and Nf's first factor is exp(4(R pi/q)^2) = exp(2 kappa) =
    abar^{-2}. Now: a(r) := exp(-2 (r pi/q)^2) is strictly decreasing, and every
    vector in a sieve database of radius R satisfies ||v|| <= R BY THE DEFINITION
    OF THE DATABASE. Hence a(||v_i||) >= a(R) for every i, POINTWISE. Therefore
        (1/N) sum_i a(||v_i||) = rho * a(R)  with rho >= 1,
    unconditionally, for every pool, with no Gaussian heuristic, no convexity
    argument and no distributional model. The aggregate signal is N * rho * abar
    rather than N * abar, so the distinguishing condition N rho abar >=
    sqrt(N ln D) gives
        N_true = N_Nf / rho^2,   correction = -2 log2(rho) bits.            (A)
    THE SIGN IS FORCED AND THE DIRECTION IS THAT Nf IS CONSERVATIVE: the dual
    attack needs strictly fewer samples than Nf says, on this ingredient alone.
    That direction is the uncomfortable one -- it moves toward the MATZOV/Carrier
    claims rather than away from them -- and it is stated first for that reason.

    THE MAGNITUDE NEEDS A MODEL, AND THE MODEL IS NAMED. Under the Gaussian
    heuristic the number of lattice points of norm at most r in dimension
    beta = beta_sieve grows as (r/gh)^beta, so the database's length CDF is
    F(r) = (r/R)^beta on [0, R]. Then
        rho = E[a]/a(R) = beta * integral_0^1 t^{beta-1} e^{-kappa t^2} dt * e^{kappa}
            = sum_{k>=0} kappa^k / prod_{j=1}^{k} (beta/2 + j),             (B)
    an everywhere-convergent series with the two-sided bound
        1 + kappa/(beta/2+1)  <=  rho  <=  1 / (1 - kappa/(beta/2+1))
    valid for kappa < beta/2 + 1. Both kappa and beta are recoverable from Nf's
    own output with no new computation: beta_sieve is an argument, and
    kappa = (1/2) * ln( N_Nf / L ) where L = k_enum*Hf + k_fft*log(p) +
    log(1/mu) is Nf's own third factor. So the correction (A) is computable for
    every parameter set this program has ever cited, at zero compute, from
    numbers already printed. NO VALUE OF rho IS ASSERTED IN THIS PROPOSAL; it is
    a stage-1 output.
    SCOPE OF THE CLEAN SIGN: the pointwise bound needs the vectors to lie inside
    the ball, which is exactly true when beta_sieve = m + k_lat (the
    deltaf exponent is then 0 and there is one sieve on the whole lattice). When
    beta_sieve < m + k_lat the vectors are lifted from a projected sublattice and
    R becomes a model output rather than a hard bound; the sign is then
    CONDITIONAL and the record must say so. The toy measurement is run at
    beta_sieve = m + k_lat, where it is unconditional.

    ITEM 2 -- MIXED UNITS IN THE UNION-BOUND TERM. Hf divides by log(2.0), so it
    returns bits; that reading is confirmed by its other use, 2**(k_enum*H) in
    MATZOV.cost line 610, which is only dimensionally sensible for bits. In Nf
    the same Hf is ADDED to k_fft*log(p) and to log(1/mu), both natural
    logarithms. A union bound over 2^(k_enum*H) * p^(k_fft) / mu candidates has
    natural logarithm k_enum*H*ln(2) + k_fft*ln(p) + ln(1/mu); the code omits the
    ln(2) on the first summand only. FORCED CONSEQUENCE, if the reading is right:
    the term is inflated by at most a factor 1/ln 2 = 1.4427, hence N and the
    T_table cost by at most log2(1.4427) = 0.529 bits, and by exactly 0 when
    k_enum = 0. The estimator's own docstring (estimator/lwe.py, READ) reports
    zeta = 0 at the Kyber512 optimum under RC.ADPS16, so the most likely finding
    is INERT AT THE OPTIMUM AND LIVE OFF IT -- which still matters, because the
    optimiser explores k_enum > 0 and because hybrid variants live there. WHETHER
    THE MATZOV PAPER'S FORMULA HAS THE SAME MIXING IS UNKNOWN: the paper has NOT
    BEEN READ, and settling that is the audit's first obligation. Until it is
    settled this is an observation about a file, not a claim about a result.

    ITEM 3 -- AN UNCHECKED SELF-CONSISTENCY CONDITION. MATZOV.cost passes Nf's N
    straight into red_cost_model.short_vectors(beta, N=N, d=k_lat+m,
    sieve_dim=beta_sieve). The length model that produced that N is the statement
    that all N vectors sit inside ONE sieve ball of dimension beta_sieve, which
    holds at most (4/3)^(beta_sieve/2) lattice points under the Gaussian
    heuristic. Nf never checks N <= (4/3)^(beta_sieve/2), and neither does cost.
    If the inequality fails at a reported optimum, then the additional vectors
    come from re-randomised sieves or from the dimensions-for-free construction,
    whose length distributions are not the one modelled, and the single-length
    model is being applied to vectors that do not exist in the ball it describes.
    THE CHECK IS ONE COMPARISON OF TWO NUMBERS THE ESTIMATOR ALREADY RETURNS
    (cost["N"] and cost["beta_"]), for every parameter set, and it has two
    outcomes both of which are useful: the condition holds everywhere, and item 1
    is clean; or it fails somewhere, and the length model has a stated domain of
    validity that no record in this corpus has ever stated.

    COST BOOKKEEPING. Items 2 and 3: reading plus arithmetic on printed numbers;
    minutes, no sieve, no new instrument, and the pinned estimator already runs
    Sage-free in this repository under tools/sage_free_estimator with an existing
    exact-equality known-answer control. Item 1's magnitude at crypto scale:
    evaluation of series (B); item 1's MODEL check: one pass over an archived
    17,919-vector file with numpy, which is installed here (verified this session:
    numpy 2.4.6 imports; fpylll, g6k and estimator do NOT, so any stage needing a
    sieve is an infrastructure request under AGENTS.md rule 3 and must rebuild
    per KN-TECH-14efa5).

  novelty_status: unverified

