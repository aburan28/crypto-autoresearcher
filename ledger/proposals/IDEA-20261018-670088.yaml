idea:
  id: IDEA-20261018-670088
  title: 'Genus-3 after cubic GHS: sparse linear algebra past q = 2^23'
  class: algorithm
  question_id: RQ-ICPERF-94c86e
  area: ICPERF
  goal_ids:
  - GOAL-ICPERF-e6b6a4
  status: proposed
  proposed_by: idea-generator (Sonnet subagent logging the missed items of the 2026-10-18 index-calculus
    review)
  added: '2026-10-18'
  claim: Adding block Wiedemann with filtering to the genus-3 double-large-prime pipeline lowers the local
    linear-algebra exponent below q^1.52 and moves the whole-solve exponent from 1.368 toward the 4/3
    target, and removes the memory block that stops the ladder at 2^23.
  mechanism: Double large primes already moved the relation exponent q^1.650 -> q^1.300 [1.292, 1.308],
    and after tuning the whole solve fell to 0.62-0.65x of its earlier cost; linear algebra (local q^1.52)
    is the next lever and memory blocks 2^23. A sparse LA engine with filtering and replay is the missing
    stage.
  novelty_status: adaptation
  regime: binary, cubic GHS to genus-3 Jacobian; weak class; HPC-pipeline validation
  citations:
  - ref: crypto:research/ic_leads_review_20261018/README.md 3.4 bullet 2, 2.2 row (cubic GHS), 4
    provenance: internal
    claim: Source of the opportunity, the measured figures quoted here and the cost estimate; desk review,
      no new measurement, costs are the reviewer's estimates.
    verified_by: idea-generator
  - ref: crypto:research/ic_next10_20261014/07-cubic-ghs-genus3/README.md; crypto:research/ic_improve4_20261015/README.md
    provenance: internal
    claim: 'Genus-3 rounds 2-4: q^1.300 relation exponent, 1.368 whole-solve vs 4/3, LA q^1.52, memory
      blocks 2^23.'
    verified_by: idea-generator
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-IC-a4dd54
    - KR-IC-5ea2f8
    - KR-IC-791cb7
    nearest:
    - ref: KR-IC-a4dd54
      provenance: internal
      relation: special_case
      delta: Gaudry-Thomé-Thériault-Diem genus-g double large primes with the sparse LA the row presumes;
        applied to the repository's cubic-GHS genus-3 pipeline.
    searched:
      note: Positioned against the cited review and the records it names. The frontier map was not rendered
        or matched in this logging pass; the Coordinator should run tools/build_frontier_map.py --match
        before ranking. A missing row is not evidence of novelty.
  assumptions:
  - The relation set at 2^23 fits on disk even if the matrix does not fit dense.
  - Filtering and block Wiedemann from the relation-matrix item are reused.
  predictions:
  - metric: local_LA_exponent
    direction: lower
    minimum_effect: Below 1.52 with interval, over at least four sizes up to and beyond 2^23.
  - metric: whole_solve_exponent
    direction: lower
    minimum_effect: Below 1.368 toward 4/3.
  - metric: largest_q_solved
    direction: higher
    minimum_effect: At least 2^23, every answer verified.
  minimal_test:
    design: Wire the sparse engine into the genus-3 pipeline, run the ladder 2^11..2^23+ with the existing
      tuned parameters, dense vs sparse arms interleaved, verified logs and replays, and fit exponents.
    controls:
    - dense LA arm up to the size it fits
    - A/A repeat
    - known-answer instances at every size
    - matched rho at the same sizes
    required_metrics:
    - LA counted cost and exponent
    - whole-solve S and exponent
    - peak memory
    - verification status
  falsification_conditions:
  - Local LA exponent not below 1.52 (interval), or the whole-solve exponent not below 1.368, refutes
    the lever.
  - Memory still blocking at 2^23 refutes the memory claim.
  confounders:
  - large-prime bound tuning
  - GHS cover choice
  - filter parameters
  interpretation_limits:
  - 'Weak class: the cubic GHS cover exists only for special fields; no claim about generic binary curves.'
  - Value is building and validating an HPC-grade IC pipeline.
  heuristic_assumptions:
  - id: H1
    statement: The genus-3 relation matrix is as sparse as the k=4 matrix and filtering reduces it comparably.
    rigorous_support: Relation weights from tuned runs.
    validation_plan: Measure density and post-filter size at 2^15 before scaling.
  target_complexity:
    time_exponent: 'Targets the LA term: local q^1.52 toward the 4/3 whole-solve target (current 1.368
      over 2^11-2^15).'
    memory_exponent: No exponent claimed; memory is the measured constraint, reported as peak RSS.
    best_known: Matched generic rho, r^0.5 group operations; the index-calculus baseline is Table A/B
      of crypto:docs/ic/LEADERBOARD.md (5.23x to 21x matched rho on Koblitz, 5.47x to 13.5x on prime fields).
      Report this row's gap to matched rho (and to Bernstein-Lange where setup is excluded) as distance
      remaining.
    hidden_overhead: Every phase, cold, is charged; unpriced native work is priced at 0, 0.1 and 1 GAE
      per operation (AGENTS.md 5a) wherever two arms are ranked.
    tradeoff_note: Not applicable beyond the stated resource envelope.
  estimated_cost:
    implementation: medium
    compute: medium-high
  recommended_priority: medium
  dominated_by: No attack result; the item is an unrun measurement or an unpaid baseline debt.
  sota_delta: 'Component: double large primes gave -0.35 in the relation exponent; this item would be
    the next measured step.'
