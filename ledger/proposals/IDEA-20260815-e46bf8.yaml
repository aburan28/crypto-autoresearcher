idea:
  id: IDEA-20260815-e46bf8
  question_id: RQ-SIG-001
  added: '2026-08-15'
  title: >-
    THE CASCADE IS MEASURED ON ONE CURVE FAMILY AND ITS CURVE-TO-CURVE
    VARIANCE IS UNKNOWN: measure the statistic across many curves before any
    D>=6 conclusion is drawn from a handful
  class: measurement

  claim: >-
    The lane's cascade verdict will rest on comparing a statistic against a
    null. If the statistic varies more across curves than between the Semaev
    and null conditions, the comparison is underpowered regardless of how
    good the null is. Curve-to-curve variance is cheap to measure at low
    degree and determines how many curves any D>=6 conclusion needs.

  mechanism: >-
    Measure the cascade statistic on many curves at D=3 and D=4, decompose
    the variance into within-curve and between-curve components, and compute
    the number of curves needed for a stated effect size at D>=6.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-SIG-001 and H-SIG-001; grep 'curve-to-curve variance',
      'between-curve', 'sample size'.
    results: >-
      The lane specifies a null recalibration; no record measures curve-
      to-curve variance or derives the curve count a conclusion would
      need.
    verdict: >-
      ADAPTATION. Variance decomposition is elementary; applying it to
      size the lane's expensive D>=6 work is what is missing.

  object_first_candidate:
    tracked_object: >-
      THE CASCADE STATISTIC'S VARIANCE, decomposed into within-curve and
      between-curve components.
    lossiness: >-
      Reporting a mean statistic projects away the variance that decides
      whether any comparison is powered.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives at low degree where many curves are affordable; the
      extrapolation to D>=6 variance is the record's stated weak point.

  null_object_control: >-
    NULL 1 -- repeated measurement on ONE curve, isolating within-curve
    variance from genuine between-curve spread. NULL 2 -- random systems
    across the same curve count, giving the null condition's own between-
    curve variance, which may itself be large.

  discriminated_from:
    - >-
        The D>=6 null record in this series, which builds the null; this
        one sizes the experiment that will use it. They should be
        sequenced this-then-that.
    - >-
        The presentation-invariance record in this series, which asks
        whether the statistic is well defined; that question is upstream
        of this one and should be settled first.

  assumptions:
    - >-
        Curve-to-curve variance at low degree predicts variance at higher
        degree, at least in order of magnitude. THIS IS THE RECORD'S
        CENTRAL EXTRAPOLATION and it is stated rather than buried.
    - >-
        Enough curves are affordable at D=3 and D=4 for the variance
        components to be separated.

  predictions:
    - metric: >-
        within-curve repeated measurement
      direction: different
      minimum_effect: >-
        Establishes the measurement's own noise floor; between-curve
        spread is only interpretable above it.
    - metric: >-
        between-curve variance of the cascade statistic
      direction: different
      minimum_effect: >-
        The measurement; reported as a component, not as a total.
    - metric: >-
        curves needed for a stated effect size at D>=6
      direction: different
      minimum_effect: >-
        The deliverable, compared against what the lane can afford.

  minimal_test:
    design: >-
      Twenty curves at D=3 and D=4, five repeats each, both nulls.
    controls:
      - >-
          Within-curve repeated-measurement null.
      - >-
          Random-system between-curve variance null.
      - >-
          Variance components reported separately, never as a single
          total.
    required_metrics:
      - >-
          Within-curve and between-curve variance components with
          intervals.
      - >-
          Required curve count per effect size at D>=6.
      - >-
          Comparison against the lane's affordable curve count.

  falsification_conditions:
    - >-
        Within-curve variance dominates. The statistic is too noisy per
        curve for any between-curve comparison and must be improved before
        the lane proceeds.
    - >-
        The required curve count exceeds what the lane can afford at D>=6.
        The planned conclusion is unreachable and the lane should restate
        its target rather than run an underpowered study.
    - >-
        Between-curve variance is small. Few curves suffice and the lane's
        D>=6 work is cheaper than feared.
    - >-
        The null's between-curve variance is as large as the Semaev
        condition's. The comparison has little room and the effect size
        must be restated.

  confounders:
    - >-
        LOW-DEGREE EXTRAPOLATION: variance at D=3 may not predict variance
        at D=6, and this is the record's main weakness rather than an
        aside.
    - >-
        CURVE-FAMILY BIAS: sampling curves from one family understates
        between-curve variance relative to a broader family.

  interpretation_limits:
    - >-
        Sizes an experiment; produces no cascade verdict.
    - >-
        Scoped to the tested degrees and curve family, with the degree
        extrapolation explicitly unjustified.
    - >-
        A sufficient-curve-count result is about power, not about what the
        experiment will find.

  heuristic_assumptions:
    - id: HEUR-SIG-VAR-1
      statement: >-
        Between-curve variance of the cascade statistic at D=3 and D=4
        predicts its order of magnitude at D>=6.
      rigorous_support: >-
        Rigorous ingredient: the statistic is defined identically at
        every degree, so its curve dependence has the same source. THE
        GAP: higher-degree systems involve more of the curve's structure
        and their variance could grow with degree, in which case low-
        degree sizing systematically under-powers the D>=6 study -- the
        direction that would let an inadequate experiment proceed.
      falsification_condition: >-
        Measured D=4 between-curve variance materially exceeding D=3,
        indicating growth with degree.
      validation_plan: >-
        SAMPLE: >= 20 curves x >= 5 repeats at D=3 and D=4, so the
        degree trend in variance is itself observable. TAIL CHECK: the
        curves with the most extreme statistics at each degree, checked
        for shared invariants. TRANSFER ASSUMPTION: stated and
        unjustified.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is many low-degree Groebner runs, far cheaper
      than one D>=6 run.
    memory_exponent: >-
      Groebner-dominated at low degree; modest.
    best_known: >-
      No incumbent variance decomposition exists for this statistic; the
      lane's protocol specifies conditions without sizing them.
    hidden_overhead: >-
      If variance grows with degree, low-degree sizing understates the
      requirement in exactly the dangerous direction.
    tradeoff_note: >-
      Measuring variance cheaply at low degree buys correct sizing for
      expensive high-degree work; skipping it risks an underpowered
      conclusion nobody can interpret.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As cryptanalysis: nothing. As experiment
    sizing for this lane: none exists. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: within-curve and between-
    curve variance components for the lane's central statistic, and the
    curve count its D>=6 conclusion would require, compared against what the
    lane can afford.

  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that twenty curves are affordable at D=3 and D=4. 0.8 that the
    variance components separate cleanly. 0.45 that the required curve count
    exceeds the lane's budget at D>=6, which would mean the planned
    conclusion is currently unreachable.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
