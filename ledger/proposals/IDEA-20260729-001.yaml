idea:
  id: IDEA-20260729-001
  title: >-
    CSIDH-COLLIMATION-FC0 typed resource-vector gate for the binary
    collimation sieve
  class: control
  claim: >-
    For a fixed CSIDH instance and the final Peikert binary collimation-sieve
    row, a zero-curve-compute source-reconciliation gate can decide whether a
    complete query/memory/circuit resource vector is instantiable without
    borrowing a distribution-specific action cost or silently omitting
    preprocessing, retries, memory, tail search, or error composition. A
    numerical security comparison is admissible only if every required field
    is filled under a revised CSIDH-COLLIMATION-FC0.
  mechanism: >-
    Freeze instance, binary c-sieve revision, complete labeled-state query unit,
    QRACM formula, sequential schedule, logical Clifford+T metrics, and
    full-cost equation before selecting a numerical point; expose uniform-oracle
    versus distribution-specific action boundary.
  novelty_status: adaptation
  question_id: RQ-SSI-001
  source_refs:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-013/tasks/TASK-20260730-017/analyzer_results.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-013/tasks/TASK-20260730-019/red_team_report.yaml
    - ledger/evidence/EV-SSI-012.yaml
    - ledger/evidence/EV-SSI-013.yaml
    - ledger/decisions/DEC-20260730-004.yaml
    - ledger/decisions/DEC-20260730-005.yaml
    - knowledge/open-problems/KN-OPEN-014.md
    - knowledge/techniques/KN-TECH-051.md
  disposition: confirm_zero_progress_witness_query_memory_open
  interpretation_limits:
    - Control/accounting gate only; not a CSIDH break or security-bit estimate.
    - Finite-model zero-progress witnesses confirmed inside a bounded idealized analyzer.
    - Non-extrapolation: finite coverage is not a global heavy-tail proof.
    - FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED remains supported under FC0-R2
      with blockers QM-STOPPING, QM-MEMORY-MAP, and QM-ERROR; C2 remains live.
    - C3 remains lexical simulator PhaseVector rejection only.
    - Next gate is actual-schedule recursive-history reachability.
    - Must not reopen IDEA-20260725-001/002/003.
