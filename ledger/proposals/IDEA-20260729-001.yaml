    - knowledge/open-problems/KN-OPEN-014.md
    - knowledge/techniques/KN-TECH-051.md
  disposition: revise_ttm_v2_return_modulus_then_rerun
  interpretation_limits:
    - Control/accounting gate only; not a CSIDH break or security-bit estimate.
    - Durable preregistration of the two-row panel and ttm-v1 succeeded.
    - ttm-v1 is type-incomplete at base-return modulus; S=2 metrics not_computable.
