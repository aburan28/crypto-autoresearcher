idea:
  id: IDEA-20260729-001
  title: >-
    CSIDH-COLLIMATION-FC0 typed resource-vector gate for the binary
    collimation sieve
  class: control
  claim: >-
    For a fixed CSIDH instance and the final Peikert binary collimation-sieve
    row, a zero-curve-compute source-reconciliation gate can decide whether a
    complete query/memory/circuit resource vector is instantiable without
    borrowing a distribution-specific action cost or silently omitting
    preprocessing, retries, memory, tail search, or error composition. A
    numerical security comparison is admissible only if every required field
    is filled under a revised CSIDH-COLLIMATION-FC0.
  mechanism: >-
    Freeze instance, binary c-sieve revision, complete labeled-state query unit,
    QRACM formula, sequential schedule, logical Clifford+T metrics, and
    full-cost equation before selecting a numerical point; expose uniform-oracle
    versus distribution-specific action boundary.
  novelty_status: adaptation
