idea:
  id: IDEA-20261005-e7ad98
  question_id: RQ-ECTD-001
  added: '2026-10-05'
  status: proposed
  approved_by: null
  title: >-
    Conductor 3 of Z[pi] on the non-CM reduction at p=13 while full
    rational 5-torsion is absent
  class: measurement
  claim: >-
    Let E be y^2 = x^3 + x + 1 over Q. Its j-invariant is 6912/31, which
    is not an integer. The reduction at p=13 is ordinary and good.
    Independent re-enumeration of E(F_13) equals 18, so the trace is -4
    and the trace residue modulo 5 is 1. The discriminant t^2 - 4p equals
    -36 = 3^2 * (-4), so the conductor of Z[pi] is 3. The integer 25 does
    not divide 18, so the full 5-torsion is not F_13-rational. The same
    reduction has j congruent to 7 modulo 13, while 1728 is congruent to
    12 modulo 13. R2 is the short-Weierstrass equation and R1 is the
    affine x-coordinate used only to count points. No attack stage changes
    its charged cost. Toy scope. The discrete-log time exponent is unchanged.
  mechanism: >-
    OBJECT FRAME. The representation is the pair (R2 model y^2 = x^3 + x + 1
    over F_13, R1 affine x-coordinates of its rational points). The operation
    set Sigma is the action of the form class group of the order of
    discriminant -36 on the j-invariants with Frobenius discriminant -36.
    Sigma is not the translation action of E(F_13). Partial-action: the
    conductor of Z[pi] is constant on that class-group action, and the
    action is horizontal on the j-line rather than translation in the
    elliptic group. LOSSY-PROJECTION TEST. Discarded: which primitive
    reduced form represents the endpoint, and every affine x-coordinate
    after the point count. Two primitive reduced forms of discriminant
    -36 were written down in this session, (1, 0, 9) and (2, 2, 5); the
    imprimitive form (3, 0, 3) is not in that set. Compatible with Sigma:
    every class in that set has the same order and the same conductor.
    Lossy: those two forms are sent to the one integer 3, and the 18
    rational points are not recoverable from 3. This is not a coordinate
    change. The priced open number is 2, the number of those primitive
    forms that must be compared to name the class. The reported remainder
    is the conductor 3. It is defined from t and p alone, including at
    primes where pi does not act as the identity on the 5-torsion. The
    bit "25 divides the group order" is recorded only as the side value 0.
    The predicate of the claim is the conductor, not that bit. F1 through
    F7 are not the lens. F6 is not used: there is no orbit representative
    of a point and no shorter rho walk. No factor base. The hand
    enumeration in this session is the pre-registered prediction. An
    independent recount that disagrees falsifies it.
  novelty_status: unverified
  citations:
    - ref: RQ-ECTD-001
      provenance: internal
      claim: >-
        The ordinary-curve trapdoor question. Class-invariant weaknesses
        may appear only as negative controls. This proposal is that
        control for one conductor, not a trapdoor.
      verified_by: idea-generator, this session, read ledger/questions/RQ-ECTD-001.yaml
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Over a finite field, curves are isogenous if and only if they
        have the same number of points, so the trace and the conductor
        of Z[pi] are public isogeny-class data.
      verified_by: idea-generator, this session, read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic-group discrete logarithm in a prime-order group needs
        Omega(sqrt(p)) group operations. This measurement does not beat that.
      verified_by: idea-generator, this session, read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-53c89f
      provenance: internal
      claim: >-
        Anomalous curves are the trace-one case. The trace here is -4,
        not 1.
      verified_by: idea-generator, this session, read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-53c89f.yaml
    - ref: IDEA-20261003-e3ce5b
      provenance: internal
      claim: >-
        Problem B prices a descending N-isogeny when (pi - a)/N lies in
        the endomorphism ring of a class-number-one crater. This proposal
        does not construct that isogeny.
      verified_by: idea-generator, this session, read ledger/proposals/IDEA-20261003-e3ce5b.yaml
    - ref: Silverman, The Arithmetic of Elliptic Curves, CM j-invariants are algebraic integers
      provenance: recalled
      claim: >-
        Recalled pointer, not opened. Used only to read j = 6912/31, which
        is not an integer, as non-CM. Not support until a later agent opens
        the source.
      verified_by: null
  assumptions:
    - >-
      Good reduction at p=13: the cubic discriminant -16*(4+27) = -496 is
      not divisible by 13.
    - >-
      The conductor of Z[pi] is the largest positive integer f such that
      f^2 divides t^2-4p and (t^2-4p)/f^2 is a fundamental discriminant.
    - >-
      The point at infinity is counted once. A quadratic twist is a
      different curve and is not substituted.
  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
      - transform: null
        proposed_object: null
        predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
      - claim: null
        responsibility: null
    not_applicable_reason: >-
      Measurement of one pre-registered integer on one prime. No proof
      is attempted, and no exponent is assembled from per-attempt cost
      times inverse success probability.
  predictions:
    - metric: enumerated_point_count_over_F_13
      direction: different
      minimum_effect: 18
    - metric: conductor_of_Z_pi
      direction: different
      minimum_effect: 3
    - metric: full_rational_5_torsion_bit
      direction: lower
      minimum_effect: 0
    - metric: j_residue_mod_13
      direction: different
      minimum_effect: 7
  minimal_test:
    design: >-
      Enumerate x in F_13, test whether x^3+x+1 is a square, add the
      point at infinity, and record the count. Set t = 14 minus that
      count. Set Delta = t^2 - 52. Extract the conductor. Record whether
      25 divides the count. Reduce 6912 * inverse(31) modulo 13 and
      compare with 1728 modulo 13. Do not build a class polynomial, an
      isogeny, or a discrete-log walk.
    controls:
      - >-
        The singular check: 13 does not divide 496. If a recount says
        the cubic is singular, the prime was wrong and the run stops.
      - >-
        The twist y^2 = 2(x^3+x+1), if counted, must not be reported as
        this curve. Its trace is not required to be -4.
      - >-
        Two independent enumerations must agree before the conductor is
        accepted.
    required_metrics:
      - enumerated_point_count_over_F_13
      - conductor_of_Z_pi
      - full_rational_5_torsion_bit
      - j_residue_mod_13
  falsification_conditions:
    - The independent enumeration of E(F_13) is not 18.
    - t^2 - 4*13 is not -36, or the extracted conductor is not 3.
    - 25 divides the enumerated group order.
    - The residue of j modulo 13 is not 7.
    - A timeout, a crash, or an unavailable arithmetic library is infrastructure and is not one of the four mathematical failures above.
  confounders:
    - Forgetting the point at infinity shifts the count by 1 and the trace by 1.
    - A quadratic twist has the negated trace and a different discriminant.
    - Reading the conductor of End rather than of Z[pi] answers a different integer. This claim is only Z[pi].
  interpretation_limits:
    - >-
      The conductor of Z[pi] is determined by the trace. By the opened
      row KR-RHO-755e35 it is public inside the isogeny class. It is a
      negative control, not a secret endpoint behind an F_p-isogeny.
    - >-
      The residue j congruent to 7 modulo 13 is the endpoint label. This
      proposal does not compute the class polynomial, its degree, its
      coefficient sizes, or a wrong-trace rate.
    - >-
      RQ-ECTD-001 withholds experiment design until the Teske source is
      filed. This record is a proposal, not that experiment.
    - >-
      No ECDLP exponent move. The time-exponent delta versus Pollard rho
      is 0.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        For this single ordinary reduction, the conductor of Z[(t + sqrt(t^2-4p))/2]
        equals the largest f with f^2 dividing t^2-4p and (t^2-4p)/f^2
        fundamental. The sample is one prime, p=13. No distribution over
        primes is claimed, and there is no transfer to cryptographic size.
      rigorous_support: >-
        This is the definition of the conductor of the quadratic order
        attached to the Frobenius polynomial X^2 - t X + p. It imitates
        no random model. The Hasse bound |t| <= 2*sqrt(13) is the only
        size constraint used, and t=-4 satisfies it.
      validation_plan: >-
        Re-enumerate E(F_13) independently. Recompute Delta and f from
        that count. Accept the prediction only if the count is 18 and
        f is 3. One prime. No larger sample.
  target_complexity:
    time_exponent: >-
      O(p) field operations at the single prime p=13. The discrete-log
      time exponent stays 1/2. Delta versus Pollard rho is 0.
    memory_exponent: O(1) field elements
    best_known: >-
      Pollard rho, square-root group operations in the prime-order
      subgroup, as in the opened row KR-RHO-13bf67. KR-RHO-0528e7 is a
      constant-factor automorphism discount. KR-RHO-fbd7b1 is an
      average-case ordering at square-root memory. None is claimed.
    hidden_overhead: >-
      No o(1) term. The whole computation is the enumeration of one
      prime field of 13 elements.
    tradeoff_note: >-
      No time-memory tradeoff and no parallel collision search. One
      field enumeration.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    KR-RHO-13bf67. The discrete-log time-exponent delta versus Pollard
    rho is 0. Baselines opened: KR-RHO-13bf67, KR-RHO-0528e7, KR-RHO-fbd7b1.
  sota_delta: >-
    Discrete-log time exponent minus the Pollard rho exponent 1/2 equals
    0. Memory exponent unchanged. KR-RHO-13bf67 gives Omega(sqrt(p))
    group operations. KR-RHO-0528e7 multiplies iterations by 1/sqrt(m)
    for an automorphism group of order m and does not change the
    exponent. KR-RHO-fbd7b1 raises average-case success inside
    square-root time at square-root memory. This proposal adds the
    integer 3 at p=13, not an exponent.
