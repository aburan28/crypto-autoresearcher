idea:
  id: IDEA-20260807-bb03d3
  question_id: RQ-VOLC-f6253b
  added: '2026-08-07'
  title: >-
    B-ROUGH-CONDUCTOR ASCENT AS A CANONICAL NORMAL FORM FOR AN ISOGENY CLASS:
    ascending every small-ell volcano simultaneously is polynomial and needs no
    factorization of t^2-4p, but it lands on a Cl(O)-TORSOR of size h(O), not on
    a point -- so the algorithm exists and is cheap while the multi-target
    amortization it would enable requires the target functional to be constant on
    the crater, which is precisely lane L1's open question
  class: algorithm

  claim: >-
    (A) THE ALGORITHM. Given an ECDLP instance (E, P, Q) with E ordinary over
    F_p, and a smoothness bound B:
      1. Compute t by point counting; set D = t^2 - 4p.
      2. For each prime ell <= B, compute v_ell(D) by trial division ONLY --
         no factorization of D is attempted. Set h_ell = floor(v_ell(D)/2) for
         odd ell (the correction at ell = 2 is stated in the assumptions). By
         Kohel, h_ell is the height of the ell-volcano, hence an upper bound on
         E's level in it.
      3. For each such ell with h_ell >= 1, ASCEND: identify the ascending
         ell-isogeny by Fouquet-Morain walking (try each of the at most ell+1
         rational ell-neighbours, walk down h_ell steps, the unique neighbour
         that does not dead-end is the ascent), apply Velu, transport (P, Q)
         through it. Repeat until the vertex has ell+1 rational ell-neighbours
         and none of them ascends -- i.e. until the ell-crater is reached.
      4. Output E*, its transported instance (P*, Q*) with the SAME k, and a
         certificate: the list of j-invariants along the path, each step
         re-verifiable by kernel-polynomial factorization plus a trace check.
    The output E* has End(E*) of conductor free of every prime <= B: a
    B-ROUGH-CONDUCTOR NORMAL FORM. When B exceeds the largest prime factor of c,
    E* has the MAXIMAL order O_K and is simultaneously at the crater of every
    ell-volcano.

    (B) THE COST, AND WHY IT MATTERS THAT IT NEEDS NO FACTORING. Step 2 is
    O(B) integer divisions. Step 3 costs O(ell * h_ell) Velu computations per
    ascent level and at most h_ell levels, so O(ell * h_ell^2) per ell, and
    h_ell <= log_ell(2 sqrt(p)). Summing over ell <= B gives
    O(B^2 * log^2 p) field operations up to logarithmic factors. THE POINT: this
    is POLYNOMIAL in log p for fixed B, and it never factors D. The classical
    route to End(E) is subexponential (KN-LIT-251 Bisson-Sutherland,
    KN-LIT-309 Bisson; both present in this corpus, abstracts read, full papers
    NOT READ) precisely because it must handle ALL primes dividing c. Ascending
    only in the small-ell volcanoes buys a partial normal form at polynomial
    cost. That dichotomy -- cheap per small ell, subexponential in aggregate --
    is the same one IDEA-20260807-3c6bd8 audits from the cost side.

    (C) THE HONEST OBSTRUCTION, WHICH IS THE REAL DELIVERABLE. Ascending is
    cheap, but the ell-crater is not a point. The crater of the ell-volcano is a
    torsor under Cl(O) acting by horizontal isogenies, of size h(O) which is
    Theta(sqrt(|disc O|)) up to log factors. The ascent lands SOMEWHERE on that
    torsor, determined by where it started, and reaching a SPECIFIED crater
    vertex is the vectorization problem underlying CSIDH, classically about
    p^{1/4} (DECOMPOSITION T5, KN-TECH-027). THEREFORE:
      - "Move to the crater" is CHEAP and is a legitimate algorithmic primitive.
      - "Move to THE BEST curve on the crater" is NOT, unless goodness is
        locally detectable, and the crater is homogeneous under Cl(O) so no
        local test distinguishes crater vertices by any Cl(O)-equivariant
        quantity.
    THE NORMAL FORM IS A SET, NOT A POINT. This is the sharpest available
    statement of T5 for lane L2 and it is stated here so that no downstream
    proposal may assume otherwise.

    (D) WHAT THE MEASUREMENT DISCRIMINATES. Run any frozen cost functional C on
    (i) the starting curve E, (ii) the normal form E*, (iii) a random OTHER
    vertex of the same crater reached by a horizontal walk of the same length.
    Three outcomes, all informative and mutually exclusive:
      (O1) C(E*) systematically better than C(E), and C constant across the
        crater. Then the normal form is a genuine free improvement, it is
        reachable in polynomial time, and multi-target preprocessing on the
        crater amortizes over the whole class (lane L13).
      (O2) C varies as much ACROSS the crater as it does between levels. Then
        the crater is not special, the normal form buys nothing, and the
        variance belongs to lane L1 rather than to depth at all.
      (O3) C constant everywhere. Then the whole functional is an isogeny-class
        invariant and lane L1's predicted negative is confirmed for it, with the
        ascent algorithm surviving as a certified transport tool.
    O2 is the predicted outcome and it is the one that would REDIRECT the
    campaign from depth to horizontal position, which is a substantive change of
    target rather than a null.

  resource_label: R4 (isogeny graph / class-group action), with R3 (End(E) as a ring) consumed only through the conductor valuations
  admissibility: admissible
  admissibility_argument: >-
    The algorithm operates on CURVES, not on points of G: the isogeny graph and
    the ascending-edge identification are pure R4, and the conductor valuations
    are read from the integer t^2 - 4p (R3 through arithmetic, never through an
    action on G). The instance is transported by T1, and the transport is an
    ISOMORPHISM on G, so nothing about the transport itself yields any advantage
    -- IDEA-20260807-5cabfc says exactly that. Admissibility therefore rests
    entirely on the functional C measured at the endpoint: if C factors through
    the abstract triple, the whole exercise is provably a no-op and this proposal
    would be inadmissible_generic_group. It is admitted only for C in R1/R2
    (Semaev/Groebner meters, factor-base yield, curve-equation shape). That
    restriction is binding and appears in the required_metrics.

  discriminated_from:
    - >-
      IDEA-20260807-5cabfc (vertical transport closure). That record proves the
      transport changes nothing for triple-factoring functionals. This record
      takes that as given and asks a different question: among the NON-factoring
      functionals, is the crater distinguished? The two are complementary and the
      closure is a precondition for this proposal being well posed at all.
    - >-
      IDEA-20260805-38aebb (h x rho conservation). That record shows descending
      trades class number against short-endomorphism density at rate one, closing
      "descend to buy structure". This record goes the OPPOSITE direction --
      ASCENDING -- and its question is not about endomorphism supply but about
      whether the maximal-order vertex is a useful canonical form for an R1
      functional. 38aebb's identity actually SUPPORTS ascending as the sensible
      direction (short endomorphisms are densest at f = 1) without saying whether
      any R1 functional cares.
    - >-
      DECOMPOSITION lane L13 / RQ-MTGT-2cabee (multi-target and preprocessing).
      This record supplies the transport primitive that L13 would need and states
      exactly why L13's amortization is blocked: the crater is a torsor, so
      "everyone ascends to the same curve" is FALSE. That negative is this
      record's contribution to L13 and it is cheap to establish.
    - >-
      CSIDH / class-group action (KN-TECH-027). Nothing here proposes to solve
      vectorization; the record uses the hardness of vectorization as the
      OBSTRUCTION that makes the normal form a set.

  object_first_candidate:
    tracked_object: >-
      THE LEVEL VECTOR v(E) = (v_ell(f_E))_{ell <= B}, tracked as it is driven
      coordinate-by-coordinate to zero by the ascent, together with the transported
      instance (P, Q) riding along.
    lossiness: >-
      LOSSY. The vector discards j, (a, b), the horizontal position on each
      crater (which is the entire Cl(O)-torsor coordinate), and everything about
      G. It is not a change of coordinates: from v(E) one cannot recover E, and
      indeed h(O) different curves share the same v(E). THAT COLLAPSE IS THE
      POINT -- it is exactly the fibre the algorithm cannot navigate, and naming
      it is how the record identifies its own obstruction rather than discovering
      it later.
    propagation: >-
      One ascending ell-step decrements the ell-coordinate by one and leaves
      every other coordinate FIXED (an ell-isogeny changes only the ell-part of
      the conductor). Deterministic and, crucially, INDEPENDENT ACROSS ell --
      which is why a curve can be at the crater for ell_1 and at the floor for
      ell_2 and why the ascent can be run per-ell in any order.
    survival_score: >-
      Survives until every coordinate below B is zero, i.e. at most
      sum_{ell <= B} h_ell <= log_2(2 sqrt(p)) steps in total. Dies as a useful
      object at the crater, where the remaining freedom is entirely horizontal
      and the vector is constantly zero.

  mechanism: >-
    STEP 1 -- ASCENDING-EDGE IDENTIFICATION, MADE CONCRETE. At a vertex with
    ell+1 rational ell-neighbours and level i with 0 < i <= h, exactly one
    neighbour is ascending; the rest are descending (or, at i = 0, horizontal).
    Fouquet-Morain: from each neighbour take a descending walk of length h; a
    descending walk from a descending neighbour dead-ends after h - i - 1 further
    steps (the floor has out-degree 1, back up), while the walk through the
    ascending neighbour does not dead-end within h steps. Cost O(ell * h) per
    identification. At the floor (exactly one rational ell-neighbour) the ascent
    is immediate with no search.
    STEP 2 -- VELU AND TRANSPORT. For ell in {2, 3} the kernel polynomial is a
    root of x^3 + a x + b (ell = 2) or of psi_3 = 3x^4 + 6 a x^2 + 12 b x - a^2
    (ell = 3), so kernel construction needs only root-finding, not modular
    polynomials -- which matters because no modular polynomial is available in
    this harness. Velu gives (a', b') and the image of any point. Transport P
    and Q through every step.
    STEP 3 -- CERTIFICATE. Emit the path as a list
    ((a_0,b_0), ..., (a_L,b_L)) with, per step, the kernel polynomial, the
    claimed direction (ascend/descend/horizontal), the codomain's trace, and the
    images of P and Q. An independent verifier recomputes each Velu step, checks
    each trace equals t, checks each transported point lies on the codomain, and
    checks order(P_L) = N. This is the docs/claims-and-verification.md
    certificate discipline applied to an isogeny path.
    STEP 4 -- THE CRATER-HOMOGENEITY MEASUREMENT. At E*, take a horizontal random
    walk of L steps (using the horizontal ell-neighbours at the crater, which
    exist when (D_K/ell) = 1) to reach an independent crater vertex E**. Measure
    C at E, E*, and E** with all controls. The comparison C(E*) versus C(E**) is
    the crater-homogeneity test and it is what distinguishes O1 from O2.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep tool (ripgrep) on 2026-08-07 over ledger/, knowledge/, docs/,
      analysis/ for "crater" (9 hits, 4 files), "volcano" (case-insensitive),
      "ascend|descend", "normal form", "Fouquet", "Velu". Read in full:
      DECOMPOSITION.md, RQ-VOLC-f6253b, IDEA-20260805-38aebb, H-ECTD-19017a,
      KN-TECH-018, KN-TECH-027 (abstract), KN-LIT-251, KN-LIT-309, KN-LIT-360,
      KN-LIT-1210 (title-level only), harness/toycurve.py.
    results: >-
      "crater" appears in exactly 4 ledger files, two of which (H-ALISO-028/029)
      are historical Autolab artifact ports unrelated to this mechanism.
      "Fouquet" and "Velu": ZERO hits in ledger/ and knowledge/. No isogeny
      construction exists anywhere in harness/ (grep over harness/ for
      "velu|modular polynomial|Phi_" returns only endomorphism_la.py's phi-orbit
      code, which is a CM endomorphism, not an isogeny between curves).
      KN-LIT-1210 "CLIMBING AND DESCENDING TALL ISOGENY VOLCANOS" (eprint
      2024/924) is in the corpus at title level only, abstract NOT extracted, and
      is the most likely place a better ascent algorithm already exists.
    verdict: >-
      ADAPTATION. Fouquet-Morain style volcano navigation and Velu's formulas are
      classical and certainly known; KN-LIT-1210's title suggests published work
      on exactly the climbing cost. What is not in this corpus is (a) any
      implementation, (b) the B-rough normal-form framing with the explicit "no
      factoring required" cost claim, and (c) the crater-homogeneity measurement
      that discriminates O1/O2/O3. Reading KN-LIT-1210 is Stage 0 and a hit there
      is an ingredient.

  null_object_control: >-
    (N1) THE HORIZONTAL-WALK NULL, which is the matched object of the same shape
      and the one that makes this proposal falsifiable: a walk of the SAME LENGTH
      L at the crater, using only horizontal edges, so End(E) never changes. Any
      functional difference attributable to "ascending" must EXCEED the
      difference produced by a horizontal walk of equal length. If it does not,
      the measurement is reading "we moved L isogeny steps", not "we changed the
      endomorphism ring". This is the blocking control.
    (N2) THE HEIGHT-ZERO NULL: a class with v_ell(c) = 0 for every ell <= B, so
      the ascent is the identity. Any measured "ascent effect" there is pure
      artifact.
    (N3) THE DESCENDING NULL: the same length walk DOWNWARD. If ascending and
      descending produce the same functional change, the direction carries no
      information and only the distance does.
    DECAY PARAMETER: the walk length L, and separately the total volcano height
    H = sum_{ell <= B} h_ell. A genuine normal-form effect must SATURATE once
    every coordinate reaches zero -- extra steps beyond the crater must add
    nothing, because there is nowhere further to ascend. A measured effect that
    keeps growing with L past the crater is the canonical artifact tell.

  assumptions:
    - >-
      Kohel's stratification and the ell-volcano height v_ell(c). RECALLED,
      UNVERIFIED (KN-LIT-360, not read). Verified empirically by isogeny counting
      in the minimal test.
    - >-
      v_ell(c) = floor(v_ell(t^2 - 4p)/2) for ODD ell, because a fundamental
      discriminant has v_ell(D_K) in {0, 1} for odd ell. AT ell = 2 THIS IS NOT
      VALID AS STATED: D_K is either squarefree and 1 mod 4, or 4 times a
      squarefree number, so v_2(D_K) can be 0, 2 or 3, and the 2-adic case needs
      an explicit case split. Marked [open] and handled by direct 2-volcano
      construction at toy scale rather than by the formula.
    - >-
      Fouquet-Morain ascending-edge identification is correct as described.
      RECALLED, UNVERIFIED; verified in the minimal test by checking that the
      claimed ascent lands on a vertex with strictly smaller v_ell(f).
    - >-
      Horizontal ell-edges exist at the crater only when (D_K/ell) = 1. Classes
      must be selected for this before the crater-homogeneity test, or N1 is
      unavailable and the whole comparison collapses.
    - >-
      Toy scale, p up to ~2^16, ell in {2, 3, 5}, pure Python.

  proof_search_map:
    bottleneck: >-
      The ascending-edge identification, which is the only super-constant step:
      O(ell * h) Velu computations per level. If a cheaper identification exists
      (for instance via a pairing-based level test, see IDEA-20260807-b1b604) the
      total cost drops from O(B^2 log^2 p) to O(B log p) and the normal form
      becomes essentially free. That is the exact step whose improvement would
      change the cost statement.
    baseline_embedding:
      parameter_slice: >-
        B = 1: no ascent, the algorithm is the identity and its output must equal
        its input exactly. B >= largest prime factor of c: the output has the
        maximal order, and its conductor must be verifiably 1.
      reproduction_check: >-
        Frozen fixture at B = 1 (identity, exact equality of (a, b, P, Q)) and a
        hand-built class with c a small prime, where the maximal-order endpoint
        can be identified independently by counting rational ell-isogenies.
    observation_collision:
      observable: >-
        The pair (level vector v(E), the transported instance).
      distinct_preimage_search: >-
        GUARANTEED TO SUCCEED AND CENTRAL: h(O) distinct crater curves all have
        v = 0 and all carry equivalent instances. That collision is the
        obstruction in claim (C), it is why the normal form is a set, and it is
        found by construction rather than by search. Any downstream proposal that
        assumes a unique normal form is refuted by this collision.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "which curve in the class do we attack" by the exact condition
          "v_ell(f_E) = 0 for all ell <= B", a computable predicate on integers
          rather than a vague notion of canonical position.
        predicted_gain: >-
          Makes the class's attack surface a well-defined finite set (the crater
          torsor) of size h(O) ~ sqrt(|D|), and prices reaching a specified
          element of it at the vectorization cost ~ p^{1/4}.
      - transform: boundary_lift
        proposed_object: >-
          Extend the certificate family from single isogeny steps to whole ascent
          paths, and require a strict inward improvement: the verifier must
          reject a path with a mislabelled direction, not merely accept a correct
          one.
        predicted_gain: >-
          Turns "we walked up" from an assertion into a re-verifiable artifact,
          which is what docs/claims-and-verification.md requires of any claimed
          structural move.
    quantifier_order: >-
      CLAIMED: FORALL ordinary classes and FORALL bounds B, THERE EXISTS an
      algorithm running in O(B^2 log^2 p) field operations, using no
      factorization of t^2 - 4p, that outputs a curve E* in the class with
      v_ell(f_{E*}) = 0 for all ell <= B, together with a transported instance
      and a re-verifiable certificate.
      NOT CLAIMED: FORALL classes THERE EXISTS a UNIQUE such E*. That is false --
      the crater is a torsor of size h(O) -- and the failure of uniqueness is
      claim (C).
      ALSO NOT CLAIMED: that any cost functional is better at E*. That is the
      measured question, with three pre-registered outcomes.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Every ordinary F_p-isogeny class admits a polynomial-time, factoring-free
        reduction of its ECDLP instance to a curve with B-rough conductor, with a
        re-verifiable certificate." That is an algorithmic statement about
        NORMALIZATION and can never by itself certify a speedup, because the
        transport is an isomorphism on G.
      nearby_object_control: >-
        A SPECIFIED crater vertex (say, the one with the smallest j as an
        integer). The method cannot reach it, and the gap between "any crater
        vertex" and "that crater vertex" is exactly the p^{1/4} vectorization
        cost. A version of this algorithm that appeared to reach a specified
        vertex would have solved vectorization and is certainly wrong.
    proof_obligations:
      - claim: v_ell(c) = floor(v_ell(t^2-4p)/2) for odd ell.
        responsibility: correctness
      - claim: The ell = 2 case needs a separate argument.
        responsibility: scope
      - claim: Ascending-edge identification is correct and costs O(ell*h).
        responsibility: runtime
      - claim: Each ascent step strictly decreases v_ell(f_E).
        responsibility: strictness
      - claim: Total cost is O(B^2 log^2 p) with no factorization of D.
        responsibility: runtime
      - claim: The crater is a Cl(O)-torsor, so the output is not unique.
        responsibility: feasibility
      - claim: The certificate verifier rejects a mislabelled direction.
        responsibility: soundness
      - claim: Transport preserves k exactly.
        responsibility: correctness

  predictions:
    - metric: >-
        number of Velu steps and wall time to reach the B-rough normal form, as a
        function of log p and B, over >= 50 toy classes
      direction: different
      minimum_effect: >-
        Measured step count within a factor 3 of sum_{ell <= B} O(ell * h_ell^2),
        with no dependence on the factorization of D beyond the primes <= B. A
        measured cost that grows with the LARGEST prime factor of c would falsify
        the "no factoring required" claim.
    - metric: >-
        C(E*) minus C(E) for the frozen Semaev meter vector, versus the same
        difference produced by a horizontal walk of the same length (N1)
      direction: different
      minimum_effect: >-
        THE THREE-WAY PRE-REGISTRATION. O1 requires |C(E*) - C(E)| to exceed the
        horizontal-walk band by at least a factor 2 AND C to be constant across
        the crater within the instance-noise band. O2 requires the crater spread
        to be at least as large as the level spread. O3 requires both to sit
        inside the noise band. Anything else is INCONCLUSIVE by prior agreement.
      # predicted outcome: O2
    - metric: >-
        spread of C across >= 8 independent crater vertices reached by horizontal
        walks of increasing length
      direction: different
      minimum_effect: >-
        The spread must SATURATE as walk length grows (rapid mixing of the
        Cl(O)-Cayley graph, GRH-conditional, DECOMPOSITION T5). A spread that
        keeps growing with walk length means the walk has not mixed and every
        crater comparison is underpowered; that is an instrument finding, not a
        mathematical one.
    - metric: >-
        certificate verification time versus path construction time
      direction: lower
      minimum_effect: >-
        Verification at least 5x cheaper than construction at every tested size.
        If verification is not materially cheaper the certificate has no value as
        a certificate and should be reported as such.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): read KN-LIT-1210 and KN-LIT-360; write KN-LIT
      records. A published ascent-cost result changes the cost claim's novelty,
      not its truth.
      STAGE 1 (days of implementation, hours of compute): implement Velu for
      ell in {2, 3} plus kernel-polynomial root finding, on top of
      harness/toycurve.py. Validate: every codomain has trace t; every ell-step
      composed with its dual is multiplication by ell on a test point.
      STAGE 2 (hours): implement ascending-edge identification; verify on a
      hand-built volcano of height >= 2 that each claimed ascent strictly reduces
      v_ell(f_E), measured independently by rational-isogeny counting.
      STAGE 3 (hours): run the full ascent over >= 50 classes; record cost curves.
      STAGE 4 (hours to days): the C-measurement at E, E*, E** with N1, N2, N3.
      STAGE 5 (zero compute): O1/O2/O3 verdict plus the crater-torsor statement.
    controls:
      - horizontal walk of equal length at the crater (N1, blocking)
      - height-zero class where the ascent is the identity (N2)
      - descending walk of equal length (N3)
      - dual-isogeny check: phi-hat composed with phi equals [ell] on test points
      - trace check on every codomain
      - matched rho and BSGS on E and on E*, which must agree by
        IDEA-20260807-5cabfc and therefore serve as an instrument check
    required_metrics:
      - Velu step count, wall time, and per-step direction label
      - v_ell(f_E) at every vertex, measured by isogeny counting not by assumption
      - C (Semaev meter vector) at E, E*, and >= 8 crater vertices
      - crater spread versus level spread
      - certificate size and verification time
      - matched rho and BSGS counts
      - pass/fail of every control
      - EXPLICIT LABEL on every measured C stating its resource class (R1/R2), so
        that a triple-factoring functional cannot be reported as a result

  falsification_conditions:
    - >-
      A claimed ascent step that does not strictly decrease v_ell(f_E), verified
      independently. The edge identification is wrong and every level label
      downstream is void.
    - >-
      Measured total cost depending on the large prime factors of c. The
      "no factoring required" claim is false as stated.
    - >-
      Outcome O2 (crater spread >= level spread). The normal form buys nothing
      and the campaign's target moves from depth to horizontal position. This is
      the predicted outcome and it is a redirection, not a null.
    - >-
      Matched rho counts differing between E and E*. Either
      IDEA-20260807-5cabfc's theorem is false or the transport implementation is
      broken; the second must be excluded before the first is entertained.
    - >-
      Any transported instance whose k differs from the original. Implementation
      failure; halts the line.

  confounders:
    - >-
      WALK LENGTH IS THE OBVIOUS CONFOUND. Ascending L steps and walking
      horizontally L steps both change j completely. Only N1 separates them, and
      without N1 any reported ascent effect is uninterpretable.
    - >-
      Classes with (D_K/ell) = -1 have NO horizontal edges at the ell-crater, so
      N1 is unavailable for that ell. Class selection must ensure at least one
      ell with (D_K/ell) = 1, and classes where it fails are reported separately.
    - >-
      At toy p the crater may have h(O) as small as 1, in which case the crater
      is a single vertex, the torsor obstruction is invisible, and O1 and O2
      cannot be distinguished. Classes must be selected for h(O) >= 8 before the
      homogeneity test.
    - >-
      Velu at ell = 2 has well-known degenerate cases (2-torsion points with
      y = 0 are their own negatives). Explicit handling required and tested.

  interpretation_limits:
    - >-
      The algorithm is a NORMALIZATION, not an attack. By
      IDEA-20260807-5cabfc it cannot help any triple-factoring functional, and
      the record does not claim it does.
    - >-
      Toy scale, ell in {2, 3, 5}, p <= 2^16. The cost model is asymptotic and
      argued; the measurement only checks that the implementation matches the
      model at small sizes.
    - >-
      The crater-torsor obstruction is asserted from the classical simply
      transitive Cl(O)-action, cited not proved here, and the p^{1/4}
      vectorization figure is quoted from DECOMPOSITION T5 and KN-TECH-027, not
      independently verified.
    - >-
      O1, if it occurred, would still need the fully charged cost of the ascent
      added to the attack, and would still be dominated by rho unless C's
      improvement were exponential, which nothing here predicts.

  reachability_gate: >-
    THIS PROPOSAL IS THE REACHABILITY GATE, ANSWERED IN BOTH DIRECTIONS.
    POSITIVE: any B-rough-conductor vertex is reachable from any starting curve
    in O(B^2 log^2 p) field operations with no factorization, with a
    re-verifiable certificate, and the DL instance rides along unchanged. So
    "goodness that is a property of the LEVEL" is cheaply reachable and lane L2
    can never be dismissed on reachability grounds.
    NEGATIVE: any goodness that is a property of the HORIZONTAL POSITION on the
    crater is NOT reachable, because the crater is a Cl(O)-torsor of size
    ~ sqrt(|D|) and selecting a specified element is vectorization at ~ p^{1/4}
    classically. So a lane that needs a specific j is dead on cost even if the
    variance is large -- the exact dichotomy DECOMPOSITION T5 states, here
    instantiated with the constants filled in.

  target_complexity:
    time_exponent: >-
      The ALGORITHM: O(B^2 log^2 p) field operations up to log factors,
      polynomial in log p for fixed B, and independent of the factorization of
      t^2 - 4p. Against the classical route to the full endomorphism ring, which
      is subexponential -- L(1/2) under heuristics, and subexponential under GRH
      alone per KN-LIT-309's abstract -- this is a genuine complexity separation
      FOR THE PARTIAL PROBLEM. It changes no ECDLP exponent: the ECDLP after
      transport is the same instance.
    memory_exponent: >-
      O(B * log p) field elements for the path and certificate. Negligible.
    best_known: >-
      For the ECDLP: parallel rho at 0.886 sqrt(N), O(1) memory (KN-TECH-001,
      KN-TECH-006). For endomorphism-ring computation: subexponential
      (KN-LIT-251, KN-LIT-309, abstracts only). For reaching a SPECIFIED curve in
      the class: vectorization at ~ p^{1/4} classically (DECOMPOSITION T5,
      KN-TECH-027).
    hidden_overhead: >-
      Disclosed: (i) the ell = 2 valuation formula is invalid as stated and needs
      a case split; (ii) the B^2 in the cost is a crude bound -- the true cost is
      sum_{ell<=B} ell * h_ell^2, which is much smaller when few small primes
      divide c, and the measurement reports the actual sum, not the bound;
      (iii) point counting to get t is itself O(sqrt(p)) in this harness (SEA is
      not implemented), which DOMINATES everything else at toy scale and must be
      charged separately and honestly.
    tradeoff_note: >-
      No cryptanalytic tradeoff is created. The normalization is a one-off
      preprocessing per instance; in a multi-target setting (lane L13) it would
      amortize if and only if all targets could be brought to the SAME curve,
      which claim (C) shows they cannot.

  dominated_by: >-
    AS AN ATTACK: mounts none, so dominated on every axis by parallel rho at
    0.886 sqrt(N) time and O(1) memory (KN-TECH-001, KN-TECH-006), by the
    automorphism-discounted variant (KN-TECH-018), by BSGS at 2 sqrt(N) time and
    sqrt(N) memory (KN-TECH-031), and by toy Semaev index calculus
    (KN-FIND-f8c290). Checked across time, memory and data/queries.
    AS AN ENDOMORPHISM-RING TOOL: it is NOT dominated for the partial problem it
    solves -- computing the B-part of the conductor and normalizing to it in
    polynomial time -- because the incumbents (KN-LIT-251, KN-LIT-309) solve the
    FULL problem subexponentially. It IS dominated by them on completeness: they
    return the whole ring, this returns only the B-rough normalization. That is a
    genuine Pareto tradeoff and it is stated as one rather than as a win.
  sota_delta: >-
    Zero against every attack baseline; the transported instance has identical
    rho and BSGS cost by IDEA-20260807-5cabfc, and that identity is used here as
    an instrument check. For the normalization subproblem: polynomial
    O(B^2 log^2 p) versus subexponential for the full endomorphism ring, at the
    cost of solving only the B-rough part -- a completeness-for-time trade, not a
    speedup at equal output. For multi-target amortization: delta is NEGATIVE
    relative to what L13 might have hoped, because the crater is a torsor of size
    ~ sqrt(|D|) and no shared endpoint exists.

  estimated_cost:
    implementation: high
