  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that the algorithm works and meets its cost model at toy scale -- the
    components are classical and the only real risk is Velu edge cases at ell = 2.
    0.95 that the crater-torsor obstruction in claim (C) stands; it follows from
    the simply transitive Cl(O)-action, which is textbook. 0.65 for outcome O2
    (crater spread >= level spread, the normal form buys nothing), 0.25 for O3
    (everything flat), 0.10 for O1 (the interesting one). The reason to build it
    anyway is that Velu-based volcano navigation is the SHARED INSTRUMENT every
    other proposal in this lane needs, so its cost is amortized across the batch
    rather than charged to this record alone.

