idea:
  id: IDEA-20260809-47a08e
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-AEADC-8db132
  goal_id: GOAL-AEADC-001
  title: >-
    The committing-by-construction null object: a construction whose commitment
    reduces to collision resistance must yield zero certificates, and the harness
    must be able to prove it can still find them
  class: control
  claim: >-
    Encrypt-then-MAC with a collision-resistant hash over the key and full context
    commits by reduction: a certificate would imply a hash collision. The claim is
    that running the full certificate machinery against such a construction must
    return EMPTY, and that pairing this negative with a positive control — the
    same construction with the hash truncated to a small output — demonstrates the
    machinery would have found a certificate if one existed. Without both, an
    empty result from any repair in this goal is uninformative.
  mechanism: >-
    Instantiate the reduction-based construction; run the harness; expect empty.
    Then truncate the hash to a length where collisions are findable by birthday
    search within the declared budget, rerun, and expect a certificate. The pair
    calibrates the machinery's detection power.
  why_not_a_renamed_known_approach: >-
    Using a construction with a security reduction as a null object, and a
    deliberately weakened variant as a positive control, is the inventor-protocol
    discipline applied here. The specific pairing — reduction-based null plus
    truncated-hash positive — is what makes every other empty cell in the goal's
    table interpretable.
  predictions:
  - observable: certificate count against the reduction-based construction
    metric: integer
    predicted: Zero. A nonzero count means either the implementation is broken or the reduction does not apply as stated, and both must be resolved before any other result stands.
  - observable: certificate count against the truncated variant
    metric: integer and the birthday-search cost
    predicted: Nonzero within the declared budget, at a cost matching the birthday bound for the truncation length.
  minimal_test: >-
    Implement the construction, run the harness, then repeat at three truncation
    lengths recording cost and certificate counts, and compare the cost against
    the birthday prediction.
  controls:
  - 'BIRTHDAY-COST CHECK: measured search cost at each truncation must match the birthday bound within a factor; a large mismatch means the search is not doing what it claims and neither is the null.'
  - 'IMPLEMENTATION VALIDATION: encryption-decryption round trip and MAC verification tested before the run.'
  falsification_conditions:
  - A certificate is found against the reduction-based construction.
  - The truncated positive control yields no certificate within the declared budget, which would mean the machinery lacks power and every empty cell in the goal is uninformative.
  interpretation_limits: >-
    An empty result here is a statement about this construction under this
    machinery, and it is a control rather than a recommendation. The truncated
    variant is a laboratory object.
  sota_delta: 'No attack. Delta: the calibration that turns every empty cell in the goal''s repair table from silence into a bounded statement.'
  dominated_by: Not dominated by any corpus record; a precondition for interpreting IDEA-20260809-3a5c29 and 439aa8.
  estimated_cost: Implementation small; compute moderate at the largest truncation.
  recommended_priority: high
  novelty_status: unverified
