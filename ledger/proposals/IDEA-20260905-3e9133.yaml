idea:
  id: IDEA-20260905-3e9133
  title: Audit the hypotheses and coordinate dependence of torsion-section deformation jets
  class: control
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  added: '2026-09-05'
  proposed_at: '2026-09-05'
  proposed_by: idea-generator
  claim: >-
    For first-order ordinary elliptic deformations with A a unit and n invertible
    on the base, the proposed prediction is that the first jet of F=x^2/A is
    invariant under short-Weierstrass model scaling and transforms covariantly
    under deformation-parameter rescaling. It should vanish on a constant family
    changed only by such model scaling. These predictions concern transformation
    laws, not vanishing on every nonconstant deformation or scalar linearization.
  mechanism: >-
    Fix a field k of characteristic p>3 and the dual-number base
    k[epsilon]/(epsilon^2). Study the class y^2=x^3+(A0+epsilon*A1)x+
    (B0+epsilon*B1), with ordinary nonsingular special fibre and A0 nonzero.
    For a uniquely lifted prime-to-p n-torsion section, write F=x^2/A=F0+
    epsilon*F1. Derive the transformation of F1 under unit model scalings
    and epsilon mapped to c*epsilon for c in k^*. The class F1 with its
    tangent-direction transformation law is the object, not a parameter-free
    scalar. Reconcile this calculation with the etale-translation lemma in
    IDEA-109, separating variation of the family from displacement along the
    finite etale torsion group. No connection or path oracle is introduced.
  novelty_status: unverified
  citations:
    - ref: ideas/rejected/ECDLP-IDEA-109_serre_tate_torsion_section_jet_coordinate_hypothesis.md
      provenance: internal
      claim: >-
        Parent read the rejected or merged torsion-section jet proposal: etale
        N-torsion, uniquely lifted sections, and absent infinitesimal torsion
        translation are its obstruction. Forward guidance requests an independently
        checked etale-translation lemma before compute. This proposal follows that
        guidance and does not reopen the original mechanism by assertion.
      verified_by: '/root direct source read 2026-09-05; author received parent summary'
    - ref: knowledge/open-problems/KN-OPEN-3417fc.md
      provenance: internal
      claim: Parent identifies an open coordinate-functional question; it is not evidence of a surviving jet invariant.
      verified_by: '/root direct source read 2026-09-05; author received parent summary'
  assumptions:
    - Ordinary good-reduction family with n invertible in its base ring.
    - A fixed finite jet order, base ring and class of admissible coordinate changes.
    - A connection or differential is auxiliary data unless its canonical nature is proved.
    - No inference from absence of torsion-translation tangent to vanishing of all coordinate derivatives.
  proof_search_map:
    bottleneck: Distinguish etale group-theoretic rigidity from variation of coordinate expressions across a family.
    baseline_embedding:
      parameter_slice: Constant ordinary family and order-zero jets with n invertible on the base.
      reproduction_check: >-
        Reproduce unique etale section lifting and zero tangent along discrete
        torsion translation before considering higher finite jets.
    observation_collision:
      observable: >-
        The coefficient F1 of epsilon in x^2/A over k[epsilon]/(epsilon^2),
        together with its explicit model-scaling and parameter-rescaling laws.
      distinct_preimage_search: >-
        Compare the same section under two parameterizations and different
        sections with the same proposed invariant; identify which information
        survives the quotient without presuming injectivity.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Finite jet class with auxiliary-coordinate dependence explicitly removed.
        predicted_gain: A precise obstruction lemma or scoped exception; zero claimed solver improvement.
    quantifier_order: >-
      Fix the family, finite jet order, transformation class and observable first.
      Prove invariance for every admissible transformation, or give one exact
      counterexample. A counterexample outside n-invertible hypotheses says
      nothing against the prime-to-p lemma.
    method_ceiling:
      strongest_certifiable_claim: >-
        A lemma or counterexample about the declared finite-jet construction;
        no theorem covering all deformation observables.
      nearby_object_control: >-
        A constant curve expressed in a varying coordinate system has nonzero
        coordinate derivatives but no intrinsic curve deformation. Any argument
        assigning intrinsic deformation to that control proves too much.
    proof_obligations:
      - claim: State and prove the etale-translation lemma with its base and invertibility hypotheses.
        responsibility: baseline
      - claim: Distinguish horizontal family variation from tangent displacement along torsion translation.
        responsibility: correctness
      - claim: Derive transformation laws for the chosen finite jets and auxiliary connection.
        responsibility: interface
      - claim: Bound jet representation growth and any global level-n object introduced by invariance.
        responsibility: size
      - claim: State exactly which rejected mechanism is covered and which alternatives remain untested.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: discrepancy from the proposed model-scaling and parameter-covariance laws
      direction: lower
      minimum_effect: Predicted exact zero discrepancy; one valid symbolic counterexample falsifies the stated law.
    - metric: F1 on the constant-family model-scaling control
      direction: lower
      minimum_effect: Predicted exact zero; a certified nonzero value falsifies the claimed control behavior.
  minimal_test:
    design: >-
      Design a symbolic first-order audit over k[epsilon]/(epsilon^2), using
      F=x^2/A, unit short-model scalings and invertible linear parameter changes.
      A future contract must freeze k, the special fibre, n and any representative
      deformation directions before evaluating examples. First prove or refute
      the two transformation laws and the constant-family null. Then state which
      hypotheses of the existing etale-translation argument these calculations
      address. No numerical computation or experiment is approved here.
    controls:
      - Constant family in a varying coordinate system, where intrinsic deformation is known absent.
      - Same family under invertible reparameterization.
      - Order-zero reduction to the prior torsion-section setup.
      - Explicit boundary statement excluding noninvertible n; no extrapolation across that boundary.
    required_metrics:
      - Exact lemma hypotheses and proof gaps.
      - Coordinate and parameter transformation laws.
      - Jet order, base precision, extension degree and symbolic coefficient count.
      - Auxiliary data needed and whether removing it introduces a global level-n object.
  falsification_conditions:
    - F changes under an admissible short-model scaling, or F1 violates its declared parameter-covariance law.
    - The claimed intrinsic effect persists on the constant-family coordinate-artifact control.
    - A purported exception violates the base or n-invertibility hypotheses rather than the lemma.
  confounders:
    - Confusing etale torsion rigidity with constancy of its coordinate functions in a varying family.
    - Treating a selected connection, parameter or trivialization as canonical without proof.
    - Hiding global level structure or increasing jet order in constant-cost notation.
  interpretation_limits:
    - This is near overlap with IDEA-109 and an audit of its forward guidance, not a new scalar-linearization mechanism.
    - Failure of one invariant is not evidence that all deformation methods are impossible.
    - An incomplete lemma or unresolved transformation is inconclusive and supports no mathematical rejection.
    - Any surviving invariant still needs a separate information and cost analysis before computational relevance is claimed.
  heuristic_assumptions: []
  heuristic_assumptions_note: Exact invariance and lemma audit; no statistical or distribution assumption is used.
  target_complexity:
    time_exponent: 'No solver proposed; claimed exponent improvement = 0.'
    memory_exponent: 'No solver proposed; claimed exponent improvement = 0.'
    best_known: 'Baseline generic square-root group-work exponent 1/2; not a full frontier certification.'
    hidden_overhead: Jet order, precision, base extensions, coordinate normalization and possible global level structure.
    tradeoff_note: No solver tradeoff claimed; symbolic size and storage must accompany future cost estimates.
  dominated_by: 'not established: structural audit only, no solver candidate compared; full frontier screen not performed'
  sota_delta:
    time_exponent_improvement_claimed: 0
    memory_exponent_improvement_claimed: 0
    data_query_improvement_claimed: 0
    scope: Prerequisite mathematical audit; no measured or asymptotic solver advantage.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
