idea:
  id: IDEA-20260816-86a78d
  question_id: RQ-PMA-001
  added: '2026-08-16'
  title: Measure the obstruction density of the divisor-parity gate against two nulls of the same
    shape -- tables pulled back from actual matrices over k(t), on which the gate must never fire,
    and uniformly sampled tables of matched degree profile, on which its firing rate is the background
    -- so that any claimed obstruction has a denominator
  class: control
  claim: '(A) H-PMA-001 predicts nonvacuous_obstruction_count at least 1 and false_obstruction_count
    exactly 0, which are two counts with no denominator between them. A gate that fires on 1 instance
    in 60 and a gate that fires on 55 in 60 both satisfy the frozen prediction, and they are completely
    different objects: the first is a rare and possibly fixture-specific event, the second is a near-universal
    condition that would say more about the prescribed family than about principal-minor assignment.
    (B) The missing quantity is a DENSITY with a stated denominator, measured against two nulls that
    bracket it. NULL A, the soundness null: tables constructed by taking an explicit matrix over k(t)
    and computing its principal minors, so realizability is guaranteed by construction. The gate must
    fire at rate EXACTLY ZERO on NULL A -- every firing is a false obstruction, and this null is the
    only control in this bucket that can detect unsoundness without an existence decider, because
    the witness is the matrix you started from. NULL B, the background null: tables sampled uniformly
    from the same shape and degree profile as the prescribed family, with no realizability guarantee,
    giving the rate at which the gate fires on structureless input. (C) The signal arm is the prescribed
    family p_S = (t+1)/(t+d_S) itself, and the deliverable is its firing rate positioned between the
    two nulls, with confidence intervals from the stated sample sizes. (D) What is NOT claimed: that
    a high firing rate on the signal arm would be evidence of a real obstruction. If the signal rate
    matches NULL B, the gate is detecting the degree profile and not the prescribed structure. Nor
    is a zero rate on NULL A evidence that the gate is sound in general; it is evidence over the constructed
    matrices only. (E) No matrix existence question is decided for the signal arm at all, and no attack,
    speedup or security consequence is claimed.'
  mechanism: 'Stage 1 constructs NULL A properly, which is the whole difficulty: sample a 4x4 matrix
    over k(t) whose entries are random rational functions with degree profiles chosen so that the
    resulting fifteen principal minors have degree profiles comparable to the prescribed family, compute
    all fifteen minors exactly, and feed the resulting table to the gate. Realizability holds by construction
    with the sampled matrix as an explicit witness, so any OBSTRUCTED verdict is definitionally a
    false obstruction and comes with its own counterexample attached. Stage 2 constructs NULL B by
    sampling fifteen rational functions directly, matched to the signal arm''s per-subset numerator
    and denominator degrees, ignoring all consistency conditions a genuine minor table must satisfy.
    Stage 3 runs the gate on all three arms through one code path in one invocation. Stage 4 computes
    firing rates with Wilson confidence intervals and the two pairwise differences. Stage 5 reports,
    for every NULL A firing, the full certificate together with the witness matrix and a direct reverification
    that the matrix''s minors equal the table, so a false obstruction cannot be dismissed as a construction
    bug. The mechanism is refuted as an instrument if any NULL A table fails its own minor reverification,
    since then the null is not a null.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read ledger/hypotheses/H-PMA-001.yaml predictions and test_boundary blocks in full, ledger/proposals/IDEA-20260726-012.yaml
      predictions and minimal_test.controls blocks in full, experiments/EXP-PMA-001/specification.yaml
      controls block in full. Grepped ledger/proposals/ and ledger/hypotheses/ for: null object, matched
      null, density, base rate, false positive rate, positive control, realizab. Checked the blacklist
      entry concerning the program''s own false-positive-rate audits.'
    results: IDEA-20260726-012's first control is a POSITIVE ORDINARY-MATRIX CONTROL using a frozen
      supplied dense 4x4 F_211(t) matrix from TASK-20260726-756, whose table must yield no false obstruction.
      That is the same idea as NULL A but with N equal to 1 and with a specific fixture, and critically
      H-PMA-001's interpretation_limits record that the fixture controls depend on EV-ECDLP-023 and
      TASK-20260726-756, which DO NOT EXIST in this repository -- so the single positive control is
      not pinned and the frozen design has, in practice, no soundness control at all. No record anywhere
      computes a density, a base rate, or a confidence interval for this gate. EXP-PMA-001's four
      controls contain no sampled null of any kind. The blacklist bars re-proposing an audit of THIS
      PROGRAM's own false-positive rate (IDEA-20260815-bc26a3); that is a meta-audit of the research
      process, whereas this is the false-positive rate of one mathematical predicate measured against
      constructed witnesses, which is an ordinary statistical control and is a different object.
    verdict: 'UNVERIFIED. Nothing is asserted about literature outside this repository. Claimed new
      inside it: the two-null bracketing design with a sampled soundness null of stated size and confidence
      intervals, replacing a single unpinned fixture; and the observation that H-PMA-001''s frozen
      predictions are counts without a denominator. Assembled from known parts: the positive-matrix-control
      idea is IDEA-20260726-012''s own first control, scaled from one fixture to a sample; the null-object-before-belief
      discipline is docs/inventor-protocol.md section 3 applied literally.'
  object_first_candidate:
    tracked_object: The PRESCRIBED MINOR TABLE as a sampled object, followed together with its provenance
      label in {pulled back from an explicit matrix, sampled uniformly, drawn from the frozen structured
      family}. What propagates through the computation is the pair (table, provenance) and, at the
      end, the firing rate conditional on provenance.
    lossiness: 'Genuinely lossy on NULL A and the signal arm, and NOT lossy on NULL B, and that asymmetry
      is the point. A NULL A table is a projection of a 4x4 matrix over k(t) -- sixteen rational functions
      -- down to fifteen minors, discarding the diagonal-conjugation gauge and more, so it is a lossy
      projection whose fibers are exactly what entries 1 and 2 of this bucket measure over finite
      fields. A NULL B table is not a projection of anything: it is sampled directly in the target
      space, so nothing is discarded because nothing upstream exists. Saying this plainly matters,
      because it is the reason the two nulls answer different questions -- NULL A can detect unsoundness,
      NULL B cannot, and NULL B can measure a background rate, NULL A cannot.'
    propagation: 'One step of the target operation is perturbing the underlying matrix by one entry,
      for NULL A, or perturbing one table coordinate, for NULL B. In the NULL A case the perturbation
      propagates to a determined set of minors and realizability is preserved by construction, so
      the gate''s verdict must be unchanged in the OBSTRUCTED direction (it must remain non-firing)
      for every perturbation. In the NULL B case a perturbation moves the table arbitrarily and the
      verdict may change freely. That difference is itself a cheap secondary measurement: the NULL
      A arm supports a perturbation-stability check that the NULL B arm cannot.'
    survival_score: 'The structure survives as long as exact rational-function arithmetic over k(t)
      stays affordable at the sampled degrees, which the contract bounds explicitly by capping entry
      degrees. It dissolves in a specific and measurable way as the sampled matrix entry degrees rise:
      minor degrees grow roughly multiplicatively, coefficient heights over Q grow faster, and at
      some entry degree the gate''s factorisation stage exceeds its cap. That dissolution degree is
      recorded as a measured boundary of the whole PMA instrumentation over k(t), and is one of the
      deliverables.'
  null_object_control: 'This entry IS a null-object control, so the requirement is turned inward:
    the nulls themselves must be validated. Every NULL A table is reverified by recomputing the fifteen
    principal minors of its witness matrix independently, in a separate code path, and requiring exact
    equality with the table; a table failing this is not a valid null and is discarded with its count
    reported. Every NULL B table is checked to have the intended per-subset degree profile. For the
    signal arm to mean anything: NULL A must show a firing rate of exactly zero (any firing is a false
    obstruction with an attached counterexample and is the most important possible outcome of this
    contract), and NULL B must show a firing rate strictly between 0 and 1 so that it is an informative
    background rather than a saturated or dead comparator. If NULL B fires at rate 1, the gate fires
    on essentially everything of this shape and the signal arm''s rate carries no information.'
  discriminated_from:
  - 'IDEA-20260726-012''s positive ordinary-matrix control: a single frozen fixture whose supporting
    records (TASK-20260726-756, EV-ECDLP-023) H-PMA-001 states do not exist in this repository. This
    entry replaces one unpinned fixture with a sampled null of stated size, confidence intervals,
    and per-table witness reverification, so it is executable in this repository whereas the frozen
    control is not.'
  - 'EXP-PMA-001''s CTRL-PMA4-GROUND-TRUTH: an existence decider that branches and solves per instance
    at real cost. NULL A needs no decider at all, because realizability is guaranteed by the construction
    and the witness is in hand before the gate runs; this is what makes a sampled soundness control
    affordable.'
  - 'The blacklisted program-level false-positive-rate audit (IDEA-20260815-bc26a3): that examines
    this research program''s own claim process. This measures the false-positive rate of one mathematical
    predicate against constructed mathematical witnesses, and shares neither object nor method.'
  - 'Entry 5 of this bucket (component attribution): that decomposes what fires. This measures how
    often it fires and against what denominator; the two are independent and could be run in either
    order.'
  - 'Entry 1 of this bucket (finite-field census): that works over finite constant fields where exhaustion
    is possible. This works over k(t) where the gate actually lives and where sampling is the only
    option.'
  assumptions:
  - Principal minors of an explicitly sampled matrix over k(t) are computable exactly, and the resulting
    table is realizable by that matrix by definition; this is checked per table by independent recomputation
    rather than assumed.
  - The sampled matrix ensemble can be tuned so that NULL A minor degree profiles are comparable to
    the signal arm's; if it cannot, the comparison is confounded by degree and the record must say
    the nulls are not matched.
  - Wilson confidence intervals are appropriate for the firing-rate proportions at the stated sample
    sizes; the interval method is fixed in advance and reported.
  - The gate implementation used for all three arms is byte-identical, invoked in one process, with
    provenance labels hidden from it, so no arm can be treated differently by construction.
  predictions:
  - metric: null_A_firing_rate
    direction: lower
    minimum_effect: exactly 0 across at least 300 pulled-back tables per field; any single firing
      is a false obstruction with an attached witness matrix and is the most consequential possible
      outcome of this contract
  - metric: null_B_firing_rate
    direction: different
    minimum_effect: strictly between 0.05 and 0.95, so that the background is informative rather than
      saturated or dead; a value outside that interval makes the signal-arm comparison uninformative
      and must be reported as such
  - metric: signal_minus_null_B_firing_rate
    direction: different
    minimum_effect: an absolute difference of at least 0.15 is required to say the prescribed family
      differs from degree-matched background; below that, the gate is detecting shape and the record
      says so
  - metric: null_A_witness_reverification_failures
    direction: lower
    minimum_effect: exactly 0 -- every pulled-back table must reproduce exactly from its witness matrix
      in an independent code path, or it is not a valid null
  minimal_test:
    design: Run NULL A alone, at k = F_q, with 100 sampled matrices. That is 100 exact 4x4 minor computations
      over F_q(t) plus 300 gate evaluations, and it costs minutes. It is the single most valuable
      measurement in this whole bucket per unit compute, because it can detect UNSOUNDNESS -- the
      gate declaring OBSTRUCTED on a table that provably has a matrix, with the matrix in hand --
      which is falsification direction 1 of H-PMA-001 and which the frozen contract currently has
      no executable control for, its only positive control depending on records that do not exist
      here. If NULL A fires even once, the finding is complete and decisive at that cost, and no signal
      arm, no NULL B, and no existence decider is needed. Only if NULL A is clean at 100 does the
      sample extend to 300 and do NULL B and the signal arm run. This ordering also means the cheapest
      run cannot produce a false positive about the prescribed family, because it does not look at
      the prescribed family at all.
    controls:
    - 'Witness reverification: every NULL A table recomputed from its witness matrix in an independent
      minor implementation and required to match exactly.'
    - 'Degree-profile control: NULL B tables checked to carry the intended per-subset numerator and
      denominator degrees, and NULL A minor degree profiles reported alongside the signal arm''s so
      the reader can judge matching.'
    - 'Provenance blinding: the gate receives tables with no provenance label and is invoked identically
      for all three arms in one process.'
    - 'Perturbation-stability control on NULL A: perturb one matrix entry, recompute the table, and
      require the gate still not to fire, across a sample; a firing after perturbation is still a
      false obstruction.'
    - 'Degenerate-branch control: tables where a required q_ij vanishes or a discriminant is zero
      are branched and excluded from rate denominators, with counts reported, per RQ-PMA-001''s constraint.'
    - 'Saturation control: if NULL B fires at rate above 0.95 or below 0.05, that fact is reported
      as the primary finding about the gate''s discrimination and the signal comparison is withheld.'
    required_metrics:
    - firing rate with Wilson confidence interval, per arm and per field
    - NULL A firing count, and for each firing the full certificate plus the witness matrix plus its
      reverification
    - NULL A witness reverification failure count
    - signal minus NULL B firing-rate difference with its interval
    - per-arm degree profile summary (per-subset numerator and denominator degrees, minor degree distribution)
    - degenerate and excluded counts per arm, with the denominators used for every rate stated explicitly
    - perturbation-stability firing count on NULL A
    - per-arm wall clock and UNDECIDED counts
  falsification_conditions:
  - 'Any NULL A table fails its witness reverification: the null is invalid and no rate may be reported.'
  - 'NULL A fires on any table: the gate is unsound on the constructed ensemble, with an explicit
    counterexample matrix. This is falsification direction 1 of H-PMA-001 reached without any existence
    decider, and it is the outcome this contract most wants to be able to detect.'
  - 'NULL B fires at rate above 0.95 or below 0.05: the background is saturated or dead and the signal
    comparison is uninformative; reported as a property of the gate.'
  - 'Signal and NULL B rates within 0.15 of each other: the prescribed family is indistinguishable
    from degree-matched background and the gate is detecting shape, recorded as a controlled null.'
  - 'The NULL A minor degree profiles cannot be brought within a stated factor of the signal arm''s:
    the nulls are unmatched and every cross-arm comparison is confounded, which must be stated rather
    than papered over.'
  - 'The gate behaves differently across arms under provenance blinding, detected by a shuffled-label
    replay: the implementation is arm-sensitive.'
  confounders:
  - 'Degree mismatch between arms is the dominant confounder: minors of a random matrix have degrees
    governed by the entry degrees, while the prescribed family''s p_S are fixed low-degree rational
    functions, so an unmatched NULL A could fire at a different rate purely because its discriminants
    are bigger.'
  - NULL A tables inherit all the consistency conditions a genuine minor table satisfies, while NULL
    B tables satisfy none; the two nulls therefore differ in more than realizability and neither alone
    brackets the signal cleanly. Reporting both is the mitigation, not a fix.
  - Sampling matrices over k(t) uniformly is not well defined; any ensemble is a choice, and the firing
    rate is a property of that choice. The ensemble must be stated in full and its parameters reported
    with every rate.
  - Over Q, coefficient height growth in the minors can push instances past the factorisation cap
    unevenly across arms, biasing which tables are decided; UNDECIDED accounting per arm is required.
  - A rate computed over a denominator that silently excludes degenerate tables can be inflated arbitrarily;
    every denominator must be printed next to its numerator.
  interpretation_limits:
  - A zero firing rate on NULL A is evidence of soundness on the sampled ensemble only, at the stated
    sample size and confidence interval. It is not a proof of soundness and cannot become one.
  - Firing rates are properties of the sampling ensembles chosen, which are choices and not canonical.
    A different ensemble gives different rates and the record must present the ensemble as part of
    the result.
  - No statement about matrix existence is made for the signal arm; the signal arm's rate is a gate
    statistic, and NOT_OBSTRUCTED_BY_THIS_GATE is never a compatibility claim per RQ-PMA-001's constraints.
  - Nothing here transfers to characteristic 2, which is out of scope, nor to sizes other than 4.
  - The two nulls differ from the signal arm in more than one respect each, so the design brackets
    rather than isolates.
  target_complexity:
    time_exponent: No attack exponent is claimed. Cost is one exact 4x4 minor table computation plus
      three gate evaluations per sampled object, at the bounded entry degrees stated in the parameters.
    memory_exponent: No attack exponent is claimed. Memory is the size of a few hundred rational-function
      tables plus per-arm counters.
    best_known: The incumbent soundness control is IDEA-20260726-012's single frozen positive ordinary-matrix
      fixture, which H-PMA-001 itself records as depending on TASK-20260726-756 and EV-ECDLP-023,
      records that do not exist in this repository. Against that incumbent this entry's contribution
      is executability plus a denominator; there is no other comparator in the repository.
    hidden_overhead: 'Hidden cost sits entirely in ensemble design: making NULL A''s minor degree
      profiles comparable to the signal arm''s requires tuning entry degrees against an output degree
      distribution, which is iterative and is where an honest run either spends real time or quietly
      gives up and reports unmatched nulls as matched. Second hidden cost: over Q the coefficient
      heights of minors of random rational-function matrices grow fast enough that the affordable
      ensemble may be much smaller than the affordable ensemble over F_q, making the two fields incomparable.'
  dominated_by: 'n/a (no result claimed). Checked across time, memory and data/query axes: no cryptanalytic
    quantity, no algorithm, and no source-to-scalar candidate is produced, so no frontier row applies.
    Within this repository, this entry is not dominated by CTRL-PMA4-GROUND-TRUTH because it detects
    unsoundness without an existence decider, which the ground-truth control cannot do more cheaply.'
  sota_delta: 'no attack; conceptual/measurement contribution only. The internal quantitative comparison:
    the frozen design''s soundness evidence is one fixture that cannot currently be loaded, i.e. sample
    size effectively 0; this contract''s is at least 300 sampled tables per field with a Wilson interval
    and a witness matrix attached to every table. That is a change in sample size and executability,
    not a speedup against any method.'
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Part B NULL A construction (sampling matrices over k(t) and computing
    exact minor tables with witness reverification): 0.85 over F_q, 0.65 over Q where coefficient
    height is the real threat. Part B NULL A result (firing rate exactly zero, i.e. the gate is sound
    on the ensemble): 0.75 -- I lean toward the gate being sound, because the one-directional square-class
    argument is elementary and hard to get wrong in the unsound direction, but 0.25 is a substantial
    chance and it is exactly the chance worth 100 samples of compute. Part B NULL B being informative
    (rate strictly inside 0.05 to 0.95): 0.5 -- genuinely uncertain; a random rational function has
    odd valuation somewhere with high probability, so I think saturation near 1 is a real risk and
    that outcome would itself be worth recording. Part C (signal arm separates from NULL B by at least
    0.15): 0.35, low, because if NULL B saturates there is nothing to separate from. Part D (the degree
    profiles can actually be matched across arms): 0.5, and this is the design risk I am least able
    to reduce by thinking.'
