idea:
  id: IDEA-20260816-8ee479
  question_id: RQ-SHATWO-f196c7
  added: '2026-08-16'
  title: 'Hold the budget fixed and vary the word width instead: measure the gap between the solver-free
    predicted crossing and the measured reachable step count across SHA-256/w for w in 8, 12, 16 and
    24, because a model that predicts a frontier must track it as the object is scaled'
  class: measurement
  claim: '(A) A deficit model earns the right to be called predictive only if the integer it computes
    moves with the frontier when the object is scaled. Define, for each word width w, two numbers:
    s_pred(w), the least step count at which the solver-free surviving-freedom integer of the carry-fixed
    expanded schedule reaches zero for a preregistered condition-support family; and s_meas(w), the
    largest step count at which a frozen instrument, at a normalized fixed budget, returns a certificate-verified
    satisfying assignment. The tracked object is the signed gap Delta(w) = s_meas(w) - s_pred(w) as
    w ranges over 8, 12, 16 and 24. (B) The discrimination is in the behaviour of Delta, not in its
    value. If Delta is approximately constant across the four widths, the solver-free integer tracks
    the frontier up to an offset and is a candidate predictor whose offset can be reported. If Delta
    grows or shrinks systematically with w, the integer does not track the frontier and the model
    is falsified as a predictor at the tested widths - which is a usable measured obstruction, because
    it tells the next agent that the crossing is not the bottleneck. If Delta is erratic, the measurement
    is too noisy at this budget and the run reports its own resolution limit. (C) NOT CLAIMED: that
    a constant Delta at w = 8..24 extrapolates to w = 32; that s_pred is meaningful outside the carry
    class it was computed in; that s_meas is anything but a solver-and-budget statement, since every
    non-solution is a budget outcome under AGENTS.md rule 3; that a tracking model would constitute
    an attack, a speedup, or a security consequence of any kind. Extrapolating Delta to w = 32 and
    thence to any statement about deployed SHA-256 is explicitly forbidden here and would be admissible,
    if at all, only as a clearly labelled conditional projection.'
  mechanism: 'STAGE A. Instantiate SHA-256/w for w in 8, 12, 16, 24 with a single declared rotation-scaling
    rule frozen in advance, and validate each against an independently written second implementation
    on 10^6 random inputs. STAGE B. Compute s_pred(w) with the solver-free rank pipeline: build the
    carry-fixed GF(2) expansion matrix, impose the preregistered condition-support family, and read
    the least s at which surviving freedom hits zero. Costs seconds per width. STAGE C. Normalize
    the budget across widths by a declared rule - equal wall-clock per CNF variable, frozen before
    any run - so that s_meas(w) is not trivially a function of instance size. STAGE D. Measure s_meas(w)
    with the frozen encoder and solver at that normalized budget, five seeds per cell, verifying every
    returned assignment against the independent implementation. STAGE E. Emit Delta(w) with replicate
    spread and fit nothing; report the four points and their errors. STAGE F. Refutation route: run
    the identical pipeline on random-tap variants at each width, where s_pred is computed the same
    way; if Delta is equally constant on the random-tap arm, constancy is a property of the normalization
    rule rather than of SHA-256, and the run reports a controlled null.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-SHATWO-f196c7 in full and ledger/goals/GOAL-SHA2-001.yaml; read docs/inventor-protocol.md
      section 6 (the validation ladder, whose step 2 is the scaled-down-instance requirement this
      instantiates). Ran grep -rl 'RQ-SHATWO' over ledger/ experiments/ knowledge/ coordination/;
      grep -ril 'toy word size|scaled-down word' and grep -ril 'word size' over ledger/proposals/
      ledger/hypotheses/ knowledge/techniques/ knowledge/findings/; grep -ril 'degrees of freedom'
      over ledger/proposals/ knowledge/.
    results: '''toy word size|scaled-down word'' returned ZERO hits anywhere in proposals, hypotheses,
      techniques or findings. ''word size'' matched exactly one proposal, ledger/proposals/IDEA-20260801-006,
      a grep-level hit whose body I did not read and which does not reference RQ-SHATWO, since the
      RQ-SHATWO grep returned only the question, GOAL-SHA2-001 and RQ-SHATHREE-cd2cb2. ''degrees of
      freedom'' matched twelve proposals plus KN-TECH-066 and KN-TECH-080; of these I read only KN-TECH-080,
      whose audit 4 (method ceiling and nearby-object control) is the doctrinal source for scaling
      a method until it fails. docs/inventor-protocol.md section 6 step 2 explicitly names running
      the pipeline on a scaled-down instance and checking the predicted improvement as a measured
      ratio, and names it as the step this program most often skips; no record I found instantiates
      it for a hash.'
    verdict: 'UNVERIFIED. No external literature is readable here and nothing is asserted about it.
      Claimed new: nothing in the construction of reduced-word hash variants, which is an obvious
      and widely used device, and nothing in rank computation. The contribution claimed is the pairing:
      computing a solver-free predicted crossing and a solver-measured frontier for the SAME object
      at four widths under one frozen normalization, and reading the GAP''s behaviour rather than
      either number, which converts a predictive claim into a falsifiable one at toy cost. Assembled
      from known parts throughout. Within this repository the verifiable fact is that no record uses
      a toy word size at all and no record binds to RQ-SHATWO, and inventor-protocol section 6 step
      2 names this exact move as the program''s most-skipped step.'
  object_first_candidate:
    tracked_object: The signed gap Delta(w) = s_meas(w) - s_pred(w) between the solver-measured reachable
      step count and the solver-free predicted crossing, for the same SHA-256/w object, followed as
      w takes the values 8, 12, 16 and 24 under one frozen budget-normalization rule.
    lossiness: 'Lossy and deliberately so. Discarded: both underlying numbers'' internal structure
      - the rank profile behind s_pred, the search history behind s_meas, the assignments, the condition
      supports, and the entire compression function - keeping only one signed integer per width. Many
      distinct pairs (s_meas, s_pred) give the same Delta, so this is a projection and not a change
      of coordinates, and the record reports the constituents alongside the gap precisely because
      the projection is lossy. Why the remainder propagates: Delta is defined identically at each
      width by a frozen rule, so its value at w+1 is computable from the same two pipelines with no
      reference to the discarded material, and the sequence over w is well-defined.'
    propagation: 'The operation iterated here is not a cipher step but a scaling of the object''s
      word width, which is the only sense in which this bucket has a scaling operation at all. One
      step of that operation - w to the next width - reinstantiates the primitive, recomputes s_pred
      by rank elimination, and remeasures s_meas at the normalized budget. Under the hypothesis that
      the crossing is the bottleneck, Delta is transported unchanged: both numbers move together and
      their difference is invariant. Under the hypothesis that the frontier is instrument-set, s_meas
      moves with encoding cost while s_pred moves with the algebra, and Delta drifts monotonically.
      The two propagation laws differ in the first difference of Delta, which four widths suffice
      to see if the replicate spread is below the drift.'
    survival_score: 'Survives exactly across the four tested widths and dissolves at two named boundaries.
      First at w = 32: the measurement is not run there because the budget ladder does not fit, so
      no statement about w = 32 survives, and extrapolating Delta there is explicitly forbidden by
      this record. Second at the normalization rule: Delta''s constancy is only defined relative to
      one budget-normalization convention, and changing the convention can manufacture or destroy
      constancy, which is why the random-tap arm at every width is run under the same convention as
      the control that catches it.'
  null_object_control: 'Random-tap arm at every width, executed in the same invocation through both
    pipelines: sigma0 and sigma1 replaced by uniformly sampled GF(2) linear maps of matched fan-in,
    with s_pred recomputed by the identical rank code and s_meas remeasured by the identical encoder
    and solver at the identical normalized budget, 20 draws per width. For the signal arm to mean
    anything, the null must show a DIFFERENT Delta behaviour - if random-tap variants also yield a
    constant Delta across widths, then constancy is a property of the budget-normalization rule and
    of generic instance scaling, not of SHA-256''s design, and the result is recorded as a controlled
    null with the measured agreement. Additionally a structural-tell check per inventor-protocol section
    3: Delta should degrade in quality as w grows and the search gets harder; a Delta whose replicate
    spread does not grow with w is suspicious of the measurement rather than reassuring.'
  discriminated_from:
  - The rank-ledger entry in this bucket, which computes s_pred alone and explicitly declines any
    predictive claim; this entry is the one that tests the prediction, and it cannot run before that
    one supplies the integer.
  - The budget-response entry in this bucket, which varies budget at fixed width; here budget is frozen
    by a normalization rule and width is the sole variable, so the two are orthogonal axes and neither
    subsumes the other.
  - docs/inventor-protocol.md section 6 step 2 in general, which prescribes scaled-down validation
    for any claimed improvement; this instantiates it for a specific object and adds the null arm
    that section 6 does not itself require.
  - IDEA-20260801-006, the single grep hit for 'word size' in ledger/proposals, matched at grep level
    only, in a lane that does not reference RQ-SHATWO; I did not read its body.
  - Ordinary asymptotic-fit practice, which would fit a curve through the four points and extrapolate;
    this refuses to fit anything and reports four points with error bars, because a four-point fit
    extrapolated to w = 32 is exactly the move this record forbids.
  assumptions:
  - One rotation-scaling rule carries SHA-256's design across widths in a way that keeps the family
    a family; this is declared, not justified, and the constant-perturbation entry in this bucket
    is what would probe its fragility.
  - The budget-normalization rule (equal wall-clock per CNF variable) is a fair comparison across
    widths; it is frozen in advance and the null arm is what exposes it if it is not.
  - s_pred is computed in a fixed carry class at every width by the same code, so any width-dependence
    of Delta is not a width-dependence of the carry model.
  - Certificate verification of every returned assignment holds at every width, so s_meas never rests
    on an unverified SAT answer.
  - Four widths suffice to see a monotone drift if the drift per width exceeds the replicate spread;
    if it does not, the run reports its resolution limit rather than a verdict.
  predictions:
  - metric: first difference of Delta(w) across w = 8, 12, 16, 24 in the signal arm
    direction: different
    minimum_effect: 'explicit refusal to pre-commit a sign, because the design''s whole value is that
      constancy and drift are the two hypotheses'' opposite predictions. Preregistered decision rule
      instead: max over consecutive widths of |Delta(w_next) - Delta(w)| below 1.0 step is scored
      TRACKING; above 2.0 steps and monotone in w is scored DRIFT; anything else is scored UNRESOLVED'
  - metric: Delta behaviour in the random-tap null arm versus signal arm
    direction: different
    minimum_effect: the null must NOT be scored TRACKING at the same threshold; if it is, constancy
      is an artifact of normalization and the signal arm carries no information
  - metric: certificate verification rate of returned assignments at every width
    direction: higher
    minimum_effect: 1.0 exactly; any unverified SAT voids the width
  - metric: replicate spread of s_meas at fixed w
    direction: higher
    minimum_effect: must be strictly increasing in w or the measurement is suspected of not tracking
      difficulty at all, per the inventor-protocol section 3 structural tell that a quantity which
      should degrade and does not is the signature of an artifact
  minimal_test:
    design: 'Cheapest discriminating version: two widths, not four. Run w = 8 and w = 16 only, compute
      s_pred at both by the solver-free rank pipeline in seconds, and measure s_meas at both under
      the frozen normalization with five seeds. A single first difference of Delta between two widths
      already fires the TRACKING versus DRIFT rule if the difference exceeds the replicate spread,
      and the two widths are chosen a factor of two apart so any drift is maximally visible per unit
      cost. Add the random-tap null at both widths with five draws each, since the rank half is free
      and only the solver half costs anything. If the two-width pass returns UNRESOLVED because the
      spread swamps the difference, the four-width ladder will not rescue it and the honest deliverable
      is the measured spread as a resolution limit. If it returns DRIFT, the deficit model is falsified
      as a predictor at the tested widths and the expensive ladder is unnecessary.'
    controls:
    - Random-tap null arm at every width through both pipelines in the same invocation.
    - Certificate verification of every returned assignment against an independently written SHA-256/w
      implementation.
    - Two independent implementations of SHA-256/w cross-validated on 10^6 random inputs before any
      measurement at that width.
    - Replicate seeds at every (w, s) cell with spread reported and required to grow with w.
    - A liveness planted instance at every width and budget, so a silently failing harness is not
      read as a low s_meas.
    required_metrics:
    - s_pred(w) per width, per condition-support family, per carry class
    - s_meas(w, seed) per width at the normalized budget
    - Delta(w) and its first differences with replicate spread
    - certificate verification rate per width
    - CNF variable and clause counts per width, which the normalization rule consumes
    - per-cell SAT / UNSAT / TIMEOUT counts with TIMEOUT recorded as a budget outcome
  falsification_conditions:
  - The random-tap null arm is scored TRACKING at the same threshold as the signal arm, showing constancy
    is an artifact of the normalization rule.
  - Any returned assignment fails independent verification at any width.
  - Replicate spread of s_meas does not grow with w, triggering the section 3 structural-tell suspicion
    that the measurement is not tracking difficulty.
  - Delta drifts monotonically by more than 2 steps per width step, falsifying the solver-free integer
    as a predictor at the tested widths.
  - s_pred is not reproducible bitwise between two independent rank implementations at any width.
  - The two SHA-256/w implementations disagree on any of the 10^6 cross-validation inputs at any width.
  confounders:
  - The budget-normalization rule is a free choice that can manufacture either outcome; the null arm
    is the only defence and its result must be read before the signal arm's.
  - The rotation-scaling rule may interact with width - some widths may accidentally receive degenerate
    rotation amounts - and the per-width rotation triple must be reported explicitly so a degenerate
    width is visible.
  - CNF encoding cost does not scale linearly in w, so equal-wall-clock-per-variable may still favour
    some widths; variable and clause counts are reported to make this auditable.
  - Small widths may admit solutions by exhaustive search rather than by structure, making s_meas
    at w = 8 uninformative about anything; the run reports the exhaustive-search cost at each width
    alongside s_meas.
  - Carry-class choice for s_pred may itself be width-dependent in effect; the same fixed class rule
    is applied at every width and the spread across sampled classes is reported per width.
  interpretation_limits:
  - No value here transfers to w = 32, and fitting the four points to extrapolate there is forbidden
    by this record rather than merely discouraged.
  - s_meas is a solver-and-budget statement at every width; a low value is never evidence that no
    characteristic exists.
  - TRACKING at four toy widths would make the solver-free integer a candidate predictor with a measured
    offset, and nothing more - not a bottleneck, not a mechanism, not an attack.
  - Nothing here is a statement about full 64-step SHA-256, HMAC-SHA-256, or any deployed system.
  target_complexity:
    time_exponent: No attack exponent is claimed. The solver-free half is seconds per width; the measured
      half is four widths x the step ladder x five seeds at the normalized budget, bounded in advance
      by the declared campaign wall clock.
    memory_exponent: No attack memory exponent is claimed. The rank half holds matrices under a megabyte;
      the solver half runs under a declared per-run memory cap that is recorded and enforced.
    best_known: No incumbent attack. The incumbent this displaces is the practice, named in docs/inventor-protocol.md
      section 6 as the step this program most often skips, of asserting that a model predicts a frontier
      without ever running the model and the frontier on the same scaled-down object. There is no
      prior row in this repository, since no record uses a toy word size at all.
    hidden_overhead: 'Two hidden costs. The first is human and large: implementing SHA-256/w correctly
      at four widths, twice each, with a rotation-scaling rule that does not silently degenerate,
      is the bulk of the work and no part of it is interesting. The second is epistemic and hides
      in the normalization rule - all the freedom in this design is concentrated there, and the null
      arm is the only thing that charges it. A third, smaller: at w = 8 the object may be exhaustively
      searchable, so its s_meas is nearly free and nearly meaningless, and reporting the exhaustive
      cost per width is what keeps that visible.'
  dominated_by: 'n/a (no attack result claimed). Pareto check across time, memory and data: I checked
    every frontier row present in this repository and there are none - no experiment directory, evidence
    record, proposal or hypothesis measures either a predicted crossing or a reachable step count
    for any hash at any word width, ''toy word size'' returns zero hits, and RQ-SHATWO carries no
    proposals. This repository cannot adjudicate against external work in either direction and does
    not attempt to.'
  sota_delta: no attack; conceptual/measurement contribution only. The delta is from zero measured
    (s_pred, s_meas) pairs in this program to eight of them - four widths in the signal arm and four
    in the null arm - each with replicate spread, plus three first differences of Delta scored against
    a preregistered rule.
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'Separated by part. (1) That s_pred and s_meas can both be produced at
    all four widths with certificate verification passing: ~0.75; the risk is entirely implementation,
    concentrated in four correct reduced-width hash implementations and one honest normalization rule.
    (2) That the TRACKING versus DRIFT rule fires rather than returning UNRESOLVED: ~0.4, because
    the replicate spread of solver wall-clock at small widths is plausibly of the same order as the
    drift being read, and at w = 8 the object may be too small to behave like the family at all. (3)
    That the outcome is TRACKING rather than DRIFT: ~0.25, and I state that low deliberately - the
    observation-collision audit proposed separately in this bucket exhibits an invertible message-basis
    change leaving every rank invariant while changing the primitive, which is a standing structural
    reason to expect the solver-free integer NOT to identify the frontier. A DRIFT outcome is the
    more likely one and is also the more useful one, because it closes the predictive reading of the
    deficit at the tested widths with a measured number rather than an opinion.'
