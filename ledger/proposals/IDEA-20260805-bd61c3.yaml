idea:
  id: IDEA-20260805-bd61c3
  question_id: RQ-XEDN-002
  added: '2026-08-05'
  title: >-
    max_|coeff| = 1 is a theorem about norm-2 lattice vectors at support 3, not a
    measurement about non-isotriviality: the forced value that makes GOAL-XEDN-001's
    headline metric constant across every instance it could ever be applied to
  class: control

  claim: >-
    The primary metric of EXP-XEDN-004 -- the infinity-norm of the shortest
    group-law-verified Mordell-Weil relation among free-x integral sections -- is
    FORCED to the value 1 whenever it is defined, by two facts that have nothing to
    do with a(t) != 0, with the absence of mu_3, or with p. FACT ONE (algebra, proved
    below): in any lattice, a relation of support exactly 3 among three pairwise
    non-proportional vectors of EQUAL norm has infinity-norm 1. Free-x integral
    sections of a rational elliptic surface have equal Shioda height 2 whenever no
    reducible fibre contributes, so the hypothesis applies to exactly the population
    the census admits. FACT TWO (implementation, read from the frozen artifact):
    experiments/EXP-XEDN-004/implementation/run_census.sage line 205 declares
    shortest_relation_group_law(E, pts, coeff_bound=3, max_support=3) and line 237
    returns immediately on inf == 1, so the primary search examines support 2 and 3
    with |c| <= 3 and then support 4 with coefficients restricted to +-1 only. The
    two facts compose: every relation the primary instrument can find at support <= 3
    is forced to infinity-norm 1 by FACT ONE, and the only regime FACT ONE does not
    cover -- support 4 with a coefficient of absolute value >= 2 -- is excluded from
    the search by FACT TWO. CONSEQUENCE, checkable against the committed artifact
    before any new run: EVERY relation reported by RUN-XEDN-004-MAIN has support
    exactly 3, max_abs_coeff exactly 1, and relation_source "group_law_brute". The
    measurement had one reachable value and returned it. This proposal does not
    assert that coefficient boundedness is false; it asserts that the executed census
    could not have observed its negation, and it names the sub-population where the
    question is still live: section sets of UNEQUAL Shioda height, which arise exactly
    on surfaces with reducible fibres and which the census never separated because it
    used a naive degree height (h_naive, line 114) rather than Shioda's.

  object_first_candidate:
    tracked_object: >-
      The GRAM FORM of the free-x integral section set under the Shioda height
      pairing -- the multiset of self-heights h(S_i) together with the pairwise
      <S_i, S_j> -- followed through the Mordell-Weil group law. Everything the
      coefficient question depends on is a function of this object: a relation
      sum c_i S_i = O is a kernel vector of the Gram form, and its infinity-norm is
      determined by the form alone. The surface, the prime, the polynomials a(t) and
      b(t), and the automorphism group of the generic fibre are all downstream of it
      and none of them re-enters.
    established_families_off_limits: >-
      Off-limits as the primary lens for this proposal: (i) xedni / lifting attacks
      as an attack family -- no attack is proposed and none is analysed here;
      (ii) index calculus and summation polynomials; (iii) descent and Selmer-group
      computation; (iv) the mu_3 / CM-automorphism lens that produced KN-FIND-003,
      which is precisely the explanation this proposal claims was never needed;
      (v) the isotrivial-versus-non-isotrivial dichotomy itself, which is the axis
      GOAL-XEDN-001 varied and which the derivation below shows is orthogonal to the
      measured quantity. The lattice-theoretic lens (Shioda height, Mordell-Weil
      lattice, root systems) is deliberately NOT off-limits: this proposal audits an
      existing measurement from inside the structure that produced it, which is the
      one move the off-limits rule does not forbid.
    newness_score: >-
      The norm inequality in the mechanism is elementary and certainly known to
      anyone who has handled root lattices; Shioda's height theory is thirty-five
      years old. What is not in this corpus is the composition: nobody has asked
      whether the quantity four XEDN experiments measured is a free parameter of the
      surface or a constant of the section shape. The corpus contains four goals
      (GOAL-XEDN-001, -002, -003 plus the GOAL-ICLIFT-001 predecessor), five
      hypotheses, six experiments and six evidence records built on the assumption
      that it varies.
    testability_score: >-
      Maximal, and most of it is free. Stage 0 is reading a committed JSON file and
      confirming that every reported relation has support 3 -- already done in
      ideation and reported below, to be re-verified in-harness. Stage 1 is a
      thirty-line pure-Python matched null that needs no Sage, no numpy, and no
      elliptic curve. Stage 2 is one page of algebra. Nothing here needs the solver
      stack that this container does not have.
    survival_score: >-
      The object survives the entire computation, which is exactly the complaint.
      Its being invariant under the axis the campaign varied is what makes the
      campaign's headline number uninformative. It stops being invariant precisely
      when the self-heights become unequal, and that is the forward guidance.

  mechanism: >-
    DERIVED HERE. Every recalled external result is labelled and is a candidate to
    check, never an authority.

    SETTING. Let S be a rational elliptic surface over F_p(t) given by
    y^2 = x^3 + a(t) x + b(t) with deg a <= 4, deg b <= 6, minimal, so its Euler
    characteristic is chi = 1. RECALLED, UNVERIFIED (Shioda, "On the Mordell-Weil
    lattices", Comment. Math. Univ. St. Pauli 39 (1990)) -- TO BE CHECKED AS STAGE 2
    OF THE EXPERIMENT, NOT ASSUMED: the Mordell-Weil group modulo torsion carries a
    positive-definite pairing with
      h(P) = 2*chi + 2*(P . O) - sum_v contr_v(P),
    and for chi = 1 the narrow Mordell-Weil lattice embeds in E_8. An INTEGRAL
    section is one with (P . O) = 0, equivalently x(P) a polynomial; for chi = 1 that
    means deg x <= 2, which is exactly the "free-x, deg x <= 2, deg y <= 3" slot
    shape frozen by EXP-XEDN-001 and inherited unchanged by EXP-XEDN-004. Hence every
    section the census admits satisfies
      h(P) = 2 - sum_v contr_v(P) <= 2,
    with equality iff no reducible fibre contributes.

    STEP 1 -- THE SUPPORT-3 NORM IDENTITY (proved here, no citation needed).
    Let L be any lattice with a positive-definite symmetric bilinear form <,>. Let
    alpha, beta, gamma in L be pairwise non-proportional with equal norm
    <alpha,alpha> = <beta,beta> = <gamma,gamma> = h > 0. Suppose
      c1*alpha + c2*beta + c3*gamma = 0
    with integers c_i, all nonzero (support exactly 3) and gcd(c1,c2,c3) = 1. Then
      c1^2 h = |c2 beta + c3 gamma|^2 = c2^2 h + c3^2 h + 2 c2 c3 <beta,gamma>.
    Cauchy-Schwarz gives |<beta,gamma>| <= h with equality iff beta, gamma are
    proportional; they are not, so |<beta,gamma>| <= h - epsilon for some epsilon > 0
    (over an integral lattice with h = 2, <beta,gamma> is an integer in {-1,0,1}).
    Therefore
      c1^2 < c2^2 + c3^2 + 2|c2 c3| = (|c2| + |c3|)^2,  so  |c1| < |c2| + |c3|,
    and by symmetry the same holds for each index. Now suppose max|c_i| >= 2 and
    take the maximum at index 1, so |c1| >= 2 >= |c2|, |c3| >= 1. Specialise to the
    integral case h = 2, <beta,gamma> in {-1,0,1}: 2 c1^2 = 2 c2^2 + 2 c3^2 +
    2 c2 c3 <beta,gamma>, i.e. c1^2 = c2^2 + c3^2 + c2 c3 <beta,gamma>. With
    |c1| >= |c2|, |c3| this forces c1^2 <= 2 c1^2 /2 ... written out directly: if
    (|c1|,|c2|,|c3|) = (2,1,1) then 4 = 1 + 1 + c2 c3 <beta,gamma> requires
    c2 c3 <beta,gamma> = 2, hence |<beta,gamma>| = 2 = h, hence gamma = +-beta,
    contradicting non-proportionality. If |c2| or |c3| >= 2 as well, divide out and
    reapply. THEREFORE: for pairwise non-proportional norm-2 vectors, every
    support-3 relation has infinity-norm 1. Support 2 is immediate: c1 alpha =
    -c2 beta with alpha, beta non-proportional is impossible, and with beta = +-alpha
    the primitive relation is alpha -+ beta = 0, again infinity-norm 1.

    STEP 2 -- WHAT THE INSTRUMENT CAN SEE. Read from the frozen artifact
    experiments/EXP-XEDN-004/implementation/run_census.sage:
      line 205  def shortest_relation_group_law(E, pts, coeff_bound=3, max_support=3)
      line 218  for supp in range(2, max_support + 1)
      line 222  for coeffs in product([c for c in range(-coeff_bound, coeff_bound+1)
                                       if c != 0], repeat=supp)
      line 237  if inf == 1: return best[0], best[1]
      line 240  for ix in combinations(range(n), 4):  for coeffs in product([-1,1],...)
    So the primary search covers support 2 and 3 with |c| <= 3, then support 4 with
    coefficients in {-1,+1} only, and exits on the first infinity-norm-1 hit. By
    STEP 1 every support-2 and support-3 relation among equal-norm sections already
    has infinity-norm 1. The support-4 pass admits only +-1 by construction. Hence
    the reachable value set of the primary metric on this population is exactly
    {1, undefined}. The experiment's own falsification_criterion reads "any verified
    shortest relation has infinity-norm >= 4"; the primary instrument's coefficient
    alphabet stops at 3, so that criterion is unreachable through the primary path
    and can be reached only through the height_gram_lll fallback at line 404, which
    the same contract and VAL-XEDN-004-01 declare diagnostic and not primary.

    STEP 3 -- THE COMMITTED DATA AGREE, WHICH IS THE POINT. Reading
    experiments/EXP-XEDN-004/runs/RUN-XEDN-004-MAIN/raw-result.json in this ideation
    session (pure Python json, no harness): every surface record carrying a relation
    has relation_source = "group_law_brute", max_abs_coeff = 1, and shortest_relation
    of support exactly 3; the h_naive_set field is [2] or [1,2] throughout. Not one
    reported relation has support 4, and not one has a coefficient of absolute value
    2 or 3 -- although the search alphabet permits both at support 2 and 3. That is
    the signature STEP 1 predicts and it is what a constant-of-the-apparatus looks
    like from the inside.

    STEP 4 -- WHERE THE QUESTION IS STILL LIVE, AND IT IS NOT NOWHERE. STEP 1 needs
    EQUAL norms. Drop that and the inequality becomes
      |c1| sqrt(h1) <= |c2| sqrt(h2) + |c3| sqrt(h3),
    which permits |c1| >= 2 as soon as h1 is materially smaller than h2 and h3. On a
    rational elliptic surface h(P) = 2 - sum_v contr_v(P), and contr_v takes values
    such as 1/2, 2/3, 3/2, 4/3, 5/6 depending on the Kodaira fibre type -- so
    UNEQUAL heights are not exotic, they are what happens on every surface with a
    reducible fibre. The census could not separate that sub-population because
    h_naive (line 114) is max(deg num x, deg den x), a naive degree, not the Shioda
    height: it returns 2 for a huge family of sections whose true heights differ.
    THE INFORMATIVE EXPERIMENT IS THEREFORE NOT A BIGGER CENSUS BUT A SORTED ONE --
    compute genuine Shioda heights, partition the section sets by whether the
    self-heights are equal, and measure the coefficient distribution separately on
    each side, with the coefficient alphabet raised past 3 and the support cap raised
    past 3. That is one page of fibre-type bookkeeping plus the search the executor
    already wrote, and it is the successor this proposal exists to name.

  novelty_status: unverified

  literature_context:
    - >-
      Shioda, "On the Mordell-Weil lattices", Comment. Math. Univ. St. Pauli 39
      (1990): the height formula h(P) = 2 chi + 2 (P.O) - sum_v contr_v(P) and the
      E_8 structure for rational elliptic surfaces. NOT READ -- RECALLED,
      UNVERIFIED. No page, theorem number, or statement is quoted here because none
      was checked. Verifying the height formula against a primary source, or
      re-deriving it, is stage 2 of the paired experiment; the derivation in STEP 1
      does not depend on it, only the identification of "which sections have equal
      norm" does.
    - >-
      Oguiso and Shioda are recalled as having classified the 74 possible
      Mordell-Weil lattices of rational elliptic surfaces. NOT READ -- RECALLED,
      UNVERIFIED. It is cited here only to say that the equal-height sub-population
      is one stratum among many and that the stratification is known to exist;
      nothing in the mechanism rests on the number 74.
    - >-
      Internal, READ: experiments/EXP-XEDN-004/specification.yaml,
      .../implementation/run_census.sage, .../runs/RUN-XEDN-004-MAIN/raw-result.json,
      ledger/evidence/EV-XEDN-003.yaml. Line numbers and field values quoted above
      were read from those files in this session.
    - >-
      Internal, READ: ANGLE-BRIEF section 5.2 records that DEC-20260724-021 "self
      declares that the package has no in-population planted positive control,
      because the inherited planted surface has deg b = 5 and lies outside the census
      family". The present proposal reports the same gap one generation later in
      EXP-XEDN-004 and gives it a mechanism rather than a note.

  lossy_projection_identifiability_audit:
    projection: >-
      (surface over F_p(t), its free-x integral sections) --> the Gram form of those
      sections under the height pairing --> the infinity-norm of the shortest kernel
      vector of that form at support <= 3.
    what_is_discarded: >-
      The prime p, the polynomials a(t) and b(t), the j-invariant, the automorphism
      group of the generic fibre, the identity of the sections, and the entire
      isotrivial / non-isotrivial distinction that GOAL-XEDN-001 was built to vary.
    why_genuinely_lossy: >-
      Extremely lossy: the fibre over the observed value is every surface in the
      family, on both sides of the axis the goal varied. That is not a defect of the
      projection as a projection -- it is the diagnosis.
    why_compatible_with_the_operations: >-
      Fully compatible, and that is what makes the failure hard to see. The height
      pairing is a quadratic form on the Mordell-Weil group, so it propagates
      deterministically through the group law: a relation among sections is exactly a
      kernel vector of the Gram form, with no information lost in translation. The
      projection passes the propagation half of the lossy-projection test cleanly.
    is_it_only_a_change_of_coordinates: >-
      NO -- and that is why the (Delta, Pi) = (x XOR y, x*y) characteristic-2 failure
      is NOT the failure mode here. Genuine information is discarded. The failure
      checked for and FOUND is the MIRROR one named in docs/inventor-protocol.md
      section 2 and in the generation contract: the projection discards so much that
      the retained statistic is CONSTANT across instances, giving zero comparator
      spread. The check performed: draw r vectors uniformly from the 240 norm-2
      vectors of E_8 -- an object with no prime, no surface, no a(t) and no mu_3 --
      and run a faithful re-implementation of shortest_relation_group_law on them.
      Result of that check, computed in this ideation session in pure Python (seed
      20260805, 400 trials per r, r = 2..11, roots realised as integer vectors
      +-2e_i +-2e_j and (+-1)^8 with an even number of minus signs, pairing = dot/4):
      the fraction of trials in which a relation was found rises from 0.005 at r = 2
      to 0.840 at r = 11, and IN EVERY SINGLE ONE OF THOSE ~1500 RELATION-FINDING
      TRIALS the shortest relation had infinity-norm exactly 1 -- 0.0000 of trials
      returned 2 or 3. LABELLED: computed outside the harness during ideation, not
      an experimental result, to be re-run in-harness as stage 1 before any citation.
      The null object reproduces EXP-XEDN-004's headline exactly, at every r, with no
      elliptic surface anywhere in it.

  assumptions:
    - >-
      That the free-x integral sections admitted by the frozen predicate are, on the
      surfaces where all self-heights agree, vectors of equal norm in the Mordell-Weil
      lattice. This is where the recalled Shioda height formula enters and it is the
      single load-bearing external input; the experiment verifies it rather than
      assuming it, and STEP 1 stands on its own for any equal-norm population however
      that population is certified.
    - >-
      That run_census.sage as committed is the code that produced
      RUN-XEDN-004-MAIN. The manifest and command.txt in the run directory are to be
      checked against the file hash in stage 0; if they disagree, FACT TWO is
      withdrawn and only FACT ONE survives.
    - >-
      That "support" in the reported shortest_relation vectors means what it appears
      to mean (count of nonzero entries). Confirmed by direct inspection this session.

  proof_search_map:
    bottleneck: >-
      The step at which instance-specific information about the surface could enter
      the reported metric. If the metric is determined by the Gram form, and the Gram
      form's relevant invariant (all self-heights equal) is constant across the
      admitted population, then no property of a(t), of p, or of mu_3 can move the
      number, and no larger census, no additional prime, and no further degree raise
      can either.
    baseline_embedding:
      parameter_slice: >-
        The exact baseline to reproduce is EXP-XEDN-003's isotrivial a(t) = 0 census,
        which returned max_|coeff| = 1 and was explained by mu_3 orbit sums
        S + wS + w^2 S = O (KN-FIND-003, RT-XEDN-003-02). That explanation is a
        support-3, infinity-norm-1 relation -- i.e. an INSTANCE of STEP 1, not an
        alternative to it. The reproduction check is therefore whether STEP 1 alone
        predicts the isotrivial result without invoking mu_3 at all.
      reproduction_check: >-
        Symbolic. Confirm that the mu_3 orbit relation is support 3 with coefficients
        (1,1,1), hence already covered by STEP 1; then confirm that STEP 1 predicts
        infinity-norm 1 on the a(t) = 0 population WITHOUT using the automorphism.
        If it does, KN-FIND-003's mechanism was sufficient but not necessary, and the
        entire "does the bound survive the removal of mu_3" framing of RQ-XEDN-002
        was answerable at zero compute.
    observation_collision:
      observable: >-
        max_abs_coeff of the shortest group-law-verified relation at support <= 3.
      distinct_preimage_search: >-
        DECISIVE AND ALREADY PARTIALLY EXECUTED. Two ground-truth objects on opposite
        sides of RQ-XEDN-002's dichotomy must be exhibited with the same observable:
        (i) an isotrivial a(t) = 0 surface WITH mu_3, and (ii) a non-isotrivial
        a(t) != 0 surface WITHOUT mu_3. EXP-XEDN-003 and EXP-XEDN-004 have already
        supplied both and both returned 1. A third, structureless preimage was added
        in this session: r uniformly random norm-2 vectors of E_8, which is neither
        an elliptic surface nor defined over any prime, and which returns 1 at a rate
        of 1.0000. Three preimages, one observable, spanning the entire axis under
        study. This is a direct falsifier of identifiability and there is no
        additional condition in the census that separates them.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable fixed at 1 and vary the forgotten structure: the
          Kodaira fibre configuration, hence the contr_v terms, hence the self-height
          multiset. The intrinsic invariant that distinguishes the resulting objects
          is the height multiset {h(S_i)}; STEP 4 shows the observable stops being
          forced exactly when that multiset is non-constant.
        predicted_gain: >-
          No gain to any attacker; the gain is a correctly stratified successor
          measurement and a boundary statement that four goals currently lack.
      - transform: stronger_invariant
        proposed_object: >-
          Replace the scalar max_|coeff| with the pair (height multiset, kernel
          lattice of the Gram form) and report the kernel's full successive minima in
          the infinity norm rather than only the shortest. The stronger state is what
          survives the raise to support 4 and beyond; the scalar does not.
        predicted_gain: >-
          Turns a metric with one reachable value into one with a distribution. The
          predicted gain is measurable spread, not a smaller exponent.
    quantifier_order: >-
      What EV-XEDN-003 supports, written with explicit quantifiers: FOR ALL p in
      {7,13,19,31} and FOR ALL eligible non-isotrivial surfaces sampled, THERE EXISTS
      a verified relation with infinity-norm 1. What a coefficient-BOUNDEDNESS claim
      needs: FOR ALL surfaces in the family, FOR ALL primitive relations among the
      admitted sections, the infinity-norm is bounded. These are different
      statements and the executed census establishes only the first. The gap is
      exactly the existential-versus-universal one: the search returns on the FIRST
      infinity-norm-1 hit (line 237), so it certifies existence of a short relation
      and says nothing about the other kernel vectors, which are the ones a
      boundedness claim quantifies over. The witness is also allowed to depend on the
      surface, which the uniform "coefficients are absolutely bounded" reading
      forbids.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that on the equal-self-height sub-population, the executed metric is
        constant by algebra, so the executed census carries no information about
        a(t) != 0 or about mu_3. It CANNOT certify that Mordell-Weil relation
        coefficients are unbounded, cannot certify that they are bounded, and must
        not be written up as though a re-reading of an old measurement were a new
        measurement. Nor does it license any statement about the lifting relation
        source as an attack, which is a separate question addressed in
        IDEA-20260805-97670d.
      nearby_object_control: >-
        The nearby object on which the hoped-for conclusion FAILS is a section set of
        unequal Shioda height (a surface with a reducible fibre contributing
        contr_v > 0 to some but not all sections). STEP 1's inequality does not apply
        there and infinity-norm >= 2 becomes possible. A method that reports 1 on
        BOTH the equal-height and the unequal-height strata has not identified the
        load-bearing structure and its output should be discarded; running both is a
        required arm, not an optional extra.
    proof_obligations:
      - claim: >-
          Support-3 relations among pairwise non-proportional equal-norm-2 lattice
          vectors have infinity-norm 1.
        responsibility: correctness
      - claim: >-
          Free-x integral sections with no reducible-fibre contribution have Shioda
          height exactly 2 on a chi = 1 surface.
        responsibility: baseline
      - claim: >-
          The committed primary search alphabet is {-3..3} \ {0} at support <= 3 plus
          {-1,1} at support 4.
        responsibility: interface
      - claim: >-
          Every relation in RUN-XEDN-004-MAIN has support 3 and coefficient 1.
        responsibility: correctness
      - claim: >-
          The re-reading closes the executed measurement's informativeness only, not
          the coefficient question.
        responsibility: scope

  predictions:
    - metric: >-
        support_histogram_of_reported_relations: distribution of the number of
        nonzero entries in shortest_relation over every surface record in
        RUN-XEDN-004-MAIN and RUN-XEDN-004-CTRL that carries one
      direction: different
      minimum_effect: >-
        FORCED VALUE: 100% at support exactly 3, 0% at support 2 and 0% at support 4.
        Derived before the run from STEP 1 plus the line-237 early return. Any record
        at support 4, or any at support 2, weakens the reading. Any record with
        max_abs_coeff in {2,3} FALSIFIES STEP 1 outright and is the single most
        valuable outcome available, because it would exhibit a support-3 relation
        among equal-norm vectors with infinity-norm >= 2, which the algebra forbids.
    - metric: >-
        e8_null_maxcoeff_rate: fraction of relation-finding trials with
        infinity-norm 1, over r vectors drawn uniformly from the 240 norm-2 vectors
        of E_8, r = 2..12, >= 400 trials per r, using a faithful re-implementation of
        shortest_relation_group_law
      direction: different
      minimum_effect: >-
        FORCED VALUE 1.0000 at every r, derived from STEP 1 before any run. The
        ideation-session computation returned exactly 1.0000 at every r from 2 to 11
        over ~1500 relation-finding trials; the in-harness re-run must reproduce it.
        Any trial returning 2 or 3 falsifies STEP 1.
    - metric: >-
        comparator_spread: standard deviation of max_abs_coeff across ALL arms --
        isotrivial (EXP-XEDN-003), non-isotrivial (EXP-XEDN-004), and the E_8 null
      direction: lower
      minimum_effect: >-
        FORCED VALUE 0. A statistic whose spread is zero across the axis a campaign
        varied is a constant of the apparatus, by the criterion in
        docs/inventor-protocol.md section 3. Nonzero spread anywhere weakens the
        reading and is reported as such.
    - metric: >-
        maxcoeff_on_unequal_height_stratum: max_abs_coeff with the alphabet raised to
        |c| <= 8 and support raised to <= 5, restricted to section sets whose Shioda
        self-heights are NOT all equal
      direction: higher
      minimum_effect: >-
        >= 2 on at least one surface. THIS PREDICTION CAN FAIL AND IS MEANT TO. If
        the unequal-height stratum also returns 1 everywhere under a raised alphabet,
        then coefficient boundedness is a substantive fact about these surfaces after
        all, STEP 4's forward guidance is wrong, and EV-XEDN-003's reading is
        strengthened rather than narrowed. Either outcome is a real deliverable;
        the current record supports neither.
    - metric: >-
        instrument_sensitivity: recovery rate of a SYNTHETICALLY PLANTED relation of
        known infinity-norm k, for k = 1,2,3,4,5, injected into the section list
      direction: higher
      minimum_effect: >-
        Predicted 100% at k = 1 and 0% at k >= 4 under the committed alphabet, purely
        from the alphabet bound. If the measured k = 4 recovery is nonzero the code
        read is wrong; if the measured k = 1 recovery is below 100% the instrument is
        broken and no negative may be reported from any arm.

  minimal_test:
    design: >-
      Four stages, cheapest first, each able to terminate the line. STAGE 0 (zero
      compute, minutes): re-read the committed artifact and tabulate the support and
      coefficient histogram of every reported relation, plus the hash check of
      run_census.sage against the run manifest. If the histogram is not concentrated
      at support 3 / coefficient 1, the reading is wrong and the line stops here.
      STAGE 1 (pure Python, seconds, NO Sage and NO numpy required -- verified this
      session that this container has numpy 2.4.6 but neither sympy nor Sage nor gp,
      so any stage needing Sage is an INFRASTRUCTURE REQUEST and not an experiment):
      the E_8 matched null above. STAGE 2 (pen and paper, one page): write out STEP 1
      in full and check the Shioda height formula against a primary source or
      re-derive it. STAGE 3 (implementation, the only expensive stage): recompute
      genuine Shioda heights for the committed surfaces, stratify by height equality,
      and re-run the search with alphabet |c| <= 8 and support <= 5 on both strata.
    controls:
      - >-
        NULL OBJECT (structureless, same shape, CAN FAIL). r vectors drawn uniformly
        from the 240 norm-2 vectors of E_8, matched to the observed slot counts
        (r = 2..12 covers every value in RUN-XEDN-004-MAIN). No prime, no surface,
        no a(t), no mu_3. FORCED VALUE DERIVED BEFORE THE RUN: max_|coeff| = 1 in
        100% of relation-finding trials. This null can fail -- a single trial
        returning 2 or 3 refutes STEP 1 and the whole proposal with it.
      - >-
        POSITIVE CONTROL / INSTRUMENT SENSITIVITY (the effect MUST appear). Plant a
        relation of known infinity-norm k = 1..5 among constructed sections and
        measure recovery. Threshold declared before the run: k = 1 recovered in
        100% of injections. IF IT IS NOT, THE INSTRUMENT IS BROKEN AND NO NEGATIVE
        RESULT MAY BE REPORTED FROM ANY ARM. This control is required because the
        committed one does not discharge it: planted_control at line 606 of
        run_census.sage constructs a surface with two sections and passes on the
        single test rec["n_slots"] >= 2, and the committed
        runs/RUN-XEDN-004-MAIN/raw-result.json records that control as
        {"max_abs_coeff": null, "specialisation": null, "pass": true} -- a control
        that passed while measuring nothing, which is the pattern KN-TECH-1a5b7e
        catalogues as a control that cannot fail. The specification's own text asked
        for more: "a known short relation among constructed sections must be
        recovered with correct coefficients".
      - >-
        GRADED CONTROL, 5 interior points, monotonicity reported. Sweep the search
        alphabet bound C = 1,2,3,5,8 at fixed support cap 4, and separately sweep the
        support cap 2,3,4,5 at fixed C = 8, on the same section sets. Report
        max_|coeff| as a function of each. PREDICTED SHAPE, stated before the run:
        flat at 1 in C on the equal-height stratum (STEP 1 makes C irrelevant there),
        and non-decreasing in the support cap. A quantity that fails to move when the
        parameter meant to move it increases is the canonical artifact tell; here the
        prediction is that it provably should NOT move in C, which converts the tell
        into a positive check.
      - >-
        ORDERING CONTROL. The support / coefficient histogram of stage 0 is committed
        to the run directory before the E_8 null of stage 1 is looked at, and the
        forced value 1.0000 is written into the record before stage 1 executes.
      - >-
        ARCHIVE CHECK (zero compute). Every prior measurement of this observable is
        listed: EV-XEDN-002 (a = 0), EV-XEDN-003 (a != 0, deg a <= 2), EV-XEDN-004
        (deg a <= 4), EV-XEDN-005 and EV-XEDN-006 (deg b = 10). All five report
        max_|coeff| = 1. None reports a support histogram and none reports a
        matched null. That is recorded as a gap, not as a passed check.
    required_metrics:
      - support and coefficient histogram per arm, with the artifact path and hash
      - E_8 null infinity-norm distribution per r, with seed and trial count
      - Shioda height multiset per surface, with the fibre-type computation shown
      - planted-relation recovery rate per planted infinity-norm k
      - max_|coeff| as a function of alphabet bound and support cap, per stratum

  falsification_conditions:
    - >-
      Any surface record in the committed runs with a reported relation of support 2
      or 4, or with max_abs_coeff in {2,3}. STEP 1 or the code reading is then wrong
      and this proposal is withdrawn as a superseding record.
    - >-
      Any E_8 null trial in which the shortest relation has infinity-norm >= 2. STEP
      1 is then false as stated and must be re-derived.
    - >-
      run_census.sage as committed failing its hash check against the run manifest,
      so that FACT TWO does not describe the code that produced the data.
    - >-
      The planted positive control failing to recover an infinity-norm-1 relation.
      Nothing negative may then be reported at all.
    - >-
      The unequal-height stratum returning max_|coeff| = 1 under a raised alphabet
      and raised support cap. STEP 4's forward guidance is then wrong and the
      coefficient-boundedness reading is stronger than this proposal allows.

  confounders:
    - >-
      RE-READING IS NOT RE-MEASURING. Stages 0 and 2 produce no new data; they
      reinterpret committed data. The temptation to present a re-reading as a
      refutation must be resisted, and the record must say plainly that EV-XEDN-003's
      numbers are not disputed -- only their informativeness about a(t) != 0 is.
    - >-
      THE H_NAIVE / SHIODA CONFLATION CUTS BOTH WAYS. This proposal uses the recalled
      Shioda formula to argue that h_naive is the wrong height. If the recalled
      formula is misremembered, STEP 4 is wrong and only STEPS 1-3 survive. Stage 2
      exists to remove this confounder and the line must not proceed to stage 3 on
      the recollection.
    - >-
      SELECTION BY ELIGIBILITY. eligible_gram at line 431 requires a specialisation
      that passes; surfaces whose relation failed specialisation are excluded. If
      exclusion correlates with coefficient size the population is censored in the
      direction that produces the observed constant. The stage-0 tabulation must
      report the excluded records too.
    - >-
      SMALL n. n_eligible_by_p is {7:10, 13:10, 19:8, 31:2}; at p = 31 the trend rests
      on two surfaces. The "slope 0 vs log p" in EV-XEDN-003 is a slope through four
      points whose y-values are all identically 1, which is not evidence of a flat
      trend so much as an absence of any trend to fit.
    - >-
      AUTHORSHIP ASYMMETRY. Auditing a completed goal is cheap to produce and reads
      as rigour. The falsification conditions above are written so that a negative
      outcome for this proposal costs something to reach.

  interpretation_limits:
    - >-
      A confirming outcome closes the INFORMATIVENESS OF THE EXECUTED MEASUREMENT on
      the equal-height stratum. It does not show that Mordell-Weil relation
      coefficients are unbounded, does not withdraw EV-XEDN-003's numbers, does not
      close the coefficient question, and above all does not close the lifting
      relation-source route -- DEC-20260724-021 already publishes "the multi-section
      or Mordell-Weil relation-source route is closed" as a FORBIDDEN sentence and
      nothing here licenses it.
    - >-
      NO STATUS CHANGE to GOAL-XEDN-001, EV-XEDN-003, DEC-20260725-001, KN-FIND-004,
      or any sibling record is proposed or implied. Those are Coordinator decisions.
      If a correction is warranted it is a superseding record under a new id, never
      an edit (AGENTS.md rule 4).
    - >-
      Toy scale throughout, p in {7,13,19,31}. Nothing here is crypto-scale evidence
      and no attack claim is made or implied.

  heuristic_assumptions:
    - id: HEUR-BD-1
      statement: >-
        NOT LOAD-BEARING FOR STEP 1. The support-3 norm identity is a proved
        inequality about positive-definite lattices, not a distributional claim. It
        holds for every equal-norm triple of pairwise non-proportional vectors in
        every positive-definite lattice, with no genericity, no randomness and no
        asymptotics. This entry exists to record that the proposal's core is
        unconditional.
      rigorous_support: >-
        Cauchy-Schwarz plus integrality of the pairing on an even lattice; written
        out in full in the mechanism.
      validation_plan: >-
        Exhaustive check over all triples of the 240 norm-2 vectors of E_8 that admit
        a relation -- a finite, complete verification, not a sample.
    - id: HEUR-BD-2
      statement: >-
        LOAD-BEARING FOR STEP 4 ONLY. On a chi = 1 rational elliptic surface, an
        integral section has Shioda height 2 - sum_v contr_v(P), so the admitted
        sections have equal norm exactly when no reducible fibre contributes
        differentially among them.
      rigorous_support: >-
        RECALLED from Shioda's height theory, NOT VERIFIED HERE. Stated as a
        heuristic assumption rather than a fact precisely because it was not checked
        against a primary source in this session.
      validation_plan: >-
        Stage 2: verify or re-derive the height formula, then compute contr_v
        directly from the Kodaira fibre types of the committed surfaces and confirm
        that the computed heights are consistent with the observed relation supports.
        If the formula is misremembered, STEP 4 is withdrawn and STEPS 1-3 stand
        unchanged.

  target_complexity:
    time_exponent: >-
      n/a for this audit. NO EXPONENT IS MOVED AND THIS PROPOSAL DOES NOT PRETEND
      OTHERWISE. It is a measurement audit: it decides what four goals' worth of
      committed numbers mean, and it does so at effectively zero compute. Its
      exponent relevance is indirect and is stated honestly -- the coefficient bound
      was being carried as an input to the question of whether a lifting-based
      relation source can exist, and that downstream question, which DOES carry an
      exponent, is taken up separately in IDEA-20260805-97670d.
    memory_exponent: n/a; the audit's peak working set is a list of 240 integer 8-vectors.
    best_known: >-
      For ECDLP over F_p the incumbent remains generic square-root, roughly
      0.886 sqrt(p) group operations with negligible memory under van
      Oorschot-Wiener distinguished points. Nothing in this proposal approaches it
      and nothing here should be read as a step toward it.
    hidden_overhead: >-
      None to disclose; there is no algorithm. The only cost hidden anywhere is the
      Sage dependency of stage 3, which this container cannot satisfy and which is
      therefore declared an infrastructure request in the paired contract.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no result claimed; no attack, no algorithm, no complexity improvement).
    Rows checked before writing this, for a prior statement that the XEDN
    coefficient metric is forced: the five XEDN evidence records (EV-XEDN-002 through
    -006), the four XEDN hypotheses H-XEDN-001..005, the six XEDN experiment
    contracts and both committed run directories of EXP-XEDN-004, the goal records
    GOAL-XEDN-001/-002/-003, KN-FIND-003 and KN-FIND-004 as cited by those records,
    and the ANGLE-BRIEF's F1 table and section 5.2 standing-negatives list. None
    contains a support histogram, a matched null for this observable, an equal-norm
    argument, or any statement that the metric has one reachable value. Cost axes
    considered for domination: time (this audit is seconds), memory (kilobytes),
    and data/queries (it consumes only already-committed artifacts and generates no
    new instances) -- on all three it is dominated by nothing because it competes
    with nothing. Absence of a search result is not evidence that no such statement
    exists somewhere in the corpus (AGENTS.md knowledge-retrieval policy).
  sota_delta: >-
    No attack and no exponent. Quantitatively: the audit converts a metric with one
    reachable value into a stratified metric with a measurable distribution, and it
    does so at a cost of roughly one CPU-second for the decisive stages against the
    2 CPU-hours budgeted for EXP-XEDN-004 alone -- a ratio of about 7000:1 in favour
    of the audit for a question the census could not answer. Against the standing
    reading, the concrete delta is a number: EV-XEDN-003 reports max_|coeff| = 1 at
    4 of 4 primes and a slope of 0.0 with jackknife CI [0.0, 0.0]; the E_8 null
    reproduces 1 at 10 of 10 values of r with the identical zero spread, using no
    elliptic surface. Same number, no arithmetic input.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.80 that the core reading survives -- that is, that the executed metric is shown
    to be forced on the equal-height stratum and the E_8 null reproduces it in
    harness. It is not higher because the whole argument is one page of algebra
    written in a single session with no reviewer, because HEUR-BD-2 rests on a
    recalled height formula that was not checked, because run_census.sage's hash has
    not yet been verified against the run manifest, and because the equal-norm
    hypothesis may fail on more of the committed surfaces than the h_naive_set values
    suggest -- in which case STEP 1 covers less of the population than claimed and the
    reading weakens to a partial one. It is not lower because the two load-bearing
    facts are checkable rather than probabilistic: the code was read at named line
    numbers, the committed relations were tabulated and are uniformly support 3 with
    coefficient 1, and the E_8 null returned 1.0000 in every one of ~1500
    relation-finding trials in ideation. Separately, 0.25 that the informative
    successor -- the unequal-height stratum under a raised alphabet -- returns any
    max_|coeff| >= 2; that number is low because reducible fibres may be rare in the
    frozen degree window, and it is not lower because nothing in the corpus has ever
    looked.
