        Any mismatch against a primary-source re-derivation is exhibited and
        the census corrected.
    - metric: normal_basis_leaf_ratio = constrained leaf count / unconstrained leaf count, toy Koblitz-shaped curves, m in {2,3}, mu = n
      direction: lower
      minimum_effect: within [0.85,1.15] of 1/mu.
    - metric: polynomial_basis_leaf_ratio, same cells, same constraint construction
      direction: different
      minimum_effect: >-
        PRE-REGISTERED PRIOR -- strictly above the normal-basis ratio and
        plausibly within [0.8,1.2] of 1 (no gain). A ratio matching or
        beating the normal-basis result is the surprising outcome and is the
        record's headline if it occurs.
    - metric: null_curve_leaf_ratio (mu=1 control, same constraint construction)
      direction: flat
      minimum_effect: within [0.9,1.1] of 1 (no-op), in EITHER basis.
    - metric: certificate_set_equality between constrained and unconstrained arms
      direction: flat
      minimum_effect: exact multiset equality at every brute-forceable cell; any miss withdraws the record.
  minimal_test:
    design: >-
      STAGE 0 -- ZERO COMPUTE. Re-derive the six Koblitz A,B values and the
      five composite-row A,B subfields from FIPS 186-4 / ANSI X9.62 primary
      text (not OpenSSL alone), and commit the corrected reachability-table
      cells for this seam across the named population before any run.
      STAGE 1 -- STRUCTURAL FIXTURE. At n in {13,17} (prime, mu=n admissible)
      and n=16*k for a small k (e.g. k=3, giving a toy composite-degree
      analogue), verify the cyclic-shift identity and the endomorphism-
      commutation identity by direct arithmetic, both in a constructed normal
      basis and against the program's existing polynomial-basis tooling.
      STAGE 2 -- THE CONSTRAINT. Build the mu-orbit canonical-representative
      constraint in each basis, at m in {2,3}, l in {4,...,7}, and run the
      constrained vs. unconstrained CNF-XOR solve on: (a) the Koblitz-shaped
      toy curve (mu=n); (b) the composite-shaped toy curve (mu=k); (c) the
      mu=1 null curve. Certificate-verify every SAT answer.
      STAGE 3 -- THE SEPARATION. Compare normal_basis_leaf_ratio against
      polynomial_basis_leaf_ratio on the SAME instances, same solver, same
      session.
      STAGE 4 -- DEPLOYED ROWS, ZERO COMPUTE. Fill the RQ-BINSTD cells: the
      corrected mu per row, the predicted normal-basis constant mu (not
      realized without a constructed normal basis for that m, flagged
      open), and the polynomial-basis constant as measured at toy scale
      with its extrapolation distance stated.
    controls:
      - NULL-CURVE (mu=1) CONTROL -- the constraint must be a no-op there, in both bases.
      - BRUTE-FORCE ORACLE -- exact certificate-set equality at small cells.
      - PERTURBED-COEFFICIENT CONTROL -- (a,b) shifted by one bit off the fixed subfield forces mu=1 by construction; the predicted gain must vanish.
      - MATCHED RHO with negation and, on Koblitz cells, the sqrt(n) Frobenius-class gain already charged to the baseline by RQ-BINSTD-b6f698's own constraints.
      - REGRESSION FIXTURE on the six Koblitz A,B values against a fresh grep, to catch silent corpus drift.
    required_metrics:
      - frobenius_stabilizer_mu per curve, per row, with the primary-source re-derivation flag
      - unconstrained and constrained leaf counts, both bases
      - certificate_multiset_equality per cell
      - null_curve leaf-count ratio
      - matched rho group operations on the same curve
      - termination_reason (completed | timeout | memory_abort | crash)
  falsification_conditions:
    - >-
      The cyclic-shift identity fails on any sampled normal-basis element.
      The one-line derivation is wrong and the record is withdrawn.
    - >-
      sigma^d(P+Q) != sigma^d(P)+sigma^d(Q) on any sampled pair where
      a^{2^d}=a, b^{2^d}=b hold. The endomorphism claim is false and (A)-(D)
      collapse.
    - >-
      Primary-source re-derivation of any Koblitz or composite-row A,B
      contradicts the census in `citations`. The census is corrected and
      superseded.
    - >-
      The constrained arm's certificate set differs from the unconstrained
      arm's at any brute-forceable cell. The constraint is unsound.
    - >-
      normal_basis_leaf_ratio outside [0.85,1.15]/mu with a passing counter.
      The predicted realization of the symmetry is wrong at the solver layer.
    - >-
      The null_curve (mu=1) control shows a leaf-count change beyond noise.
      The constraint is doing something other than exploiting Frobenius, and
      no positive result may be reported until diagnosed.
    - >-
      polynomial_basis_leaf_ratio matches or beats normal_basis_leaf_ratio.
      The basis-dependence claim is false in the favourable direction --
      a POSITIVE result for the solver layer, reported as the headline.
  confounders:
    - >-
      Constructing an affordable NORMAL basis for a given m is itself
      nontrivial (Gaussian normal basis existence and "type" depend on m in
      a way not checked here); a failure to construct one at a given m is an
      infrastructure gap, not a negative result about mu.
    - >-
      The extra symmetry composes with WDSat's existing m! arity symmetry;
      the two must be measured together and separately, since the
      combination is not assumed additive in log2 without a check (the same
      caution IDEA-20260904-7fd218 applies to F2 x F6).
    - >-
      A toy curve constructed to have mu=n (Koblitz-shaped) or mu=k
      (composite-shaped) is a DELIBERATE construction, not a random draw;
      results characterise that construction, not a random member of either
      class.
    - >-
      The parser-bug diagnosis is about ONE script in this repository; it
      says nothing about whether any other tool in this program or
      elsewhere shares the same gap, and no such claim is made.
  interpretation_limits:
    - Proposal only; no experiment, run, approval or result exists here.
    - >-
      The mu census for rows beyond the six Koblitz curves and five
      composite curves directly verified this session (i.e. every c2tnb*,
      sect*r1/r2 pseudorandom row) rests on the audit's OWN unaffected
      scan, not on an independent re-derivation from primary text; Stage 0
      of the minimal test is exactly that re-derivation and is not yet done.
    - >-
      Nothing here asserts which m admit a low-complexity (Gaussian) normal
      basis; the normal-basis arm's realizability is an open verification,
      named as such, not assumed.
    - >-
      The predicted gain is a CONSTANT (mu, at most a few hundred at
      deployed m), never an exponent; matched rho's advantage in the
      exponent is unaffected by anything in this record.
    - >-
      Nothing here is a security statement about any deployed curve. Deployed
      rows are arithmetic under numbered assumptions with the extrapolation
      distance (n<=41 measured, up to 571 computed) stated.
  heuristic_assumptions:
    - id: H1
      statement: >-
        NORMAL-BASIS CONSTRAINT REALIZATION. For a toy curve with mu>1, a
        canonical-representative constraint encoding the mu-orbit in a
        constructed normal basis reduces the measured UNSAT leaf count by a
        factor within [0.85,1.15] of mu, uniformly over m in {2,3} and l in
        [4,7].
      rigorous_support: >-
        RIGOROUS INGREDIENT: the endomorphism-commutation identity (proved
        exactly, not estimated) guarantees the orbit structure is exact, so
        the mu-fold quotient is exact in the SOLUTION SET; what is assumed is
        that the SEARCH TREE realizes the quotient as cleanly as WDSat's own
        m! constraint does, which 3c7a91's law makes plausible (constraints
        touching a SPARSE, coordinate-local set of variables -- as a
        cyclic-shift relabelling is -- fire early, unlike the F-set parity
        clauses). CLASSICAL DISTRIBUTION IMITATED: the same
        strong-backdoor / early-unit-propagation argument 3c7a91 already
        validates for the m! symmetry, transplanted to a second group acting
        by coordinate permutation rather than by point relabelling.
      validation_plan: >-
        SAMPLE: leaf counts under the constrained and unconstrained arms at
        every Stage-2 cell, >=5 seeds. SHORTCUT FOR LARGER PARAMETERS: the
        mu-orbit structure itself (which field elements collapse to which
        representative) is checkable by pure field arithmetic without
        building the curve, at any m up to the toy ceiling, so H1's
        GEOMETRIC half (orbit sizes) is verifiable far beyond where a full
        solve completes. COMPARISON: measured ratio against 1/mu, with a
        binomial-style tolerance band. TAIL CHECKS: the single worst-case
        cell's ratio reported alongside the median, not averaged away.
        TRANSFER: none claimed beyond tested m; every deployed-row number in
        this record uses the CENSUS mu, never an assumed realization
        fraction.
    - id: H2
      statement: >-
        POLYNOMIAL-BASIS NON-REALIZATION. In the polynomial basis the
        program's tooling uses, the SAME constraint construction realizes a
        leaf-count reduction strictly below mu and, at the tested toy scale,
        within [0.8,1.2] of 1 (no measurable gain).
      rigorous_support: >-
        RIGOROUS INGREDIENT: none proved; the Frobenius matrix in an
        arbitrary polynomial basis is generically dense (no sparsity
        theorem is invoked). CLASSICAL DISTRIBUTION IMITATED: the same
        late-propagation mechanism 3c7a91 measures for the F-set clauses,
        applied here to the DENSE substitution clauses a polynomial-basis
        encoding of the shift would require -- a constraint whose every
        literal spans the whole block is exactly the shape 3c7a91 already
        showed fires only near the leaf.
      validation_plan: >-
        SAMPLE: the SAME Stage-2 cells, polynomial-basis arm. SHORTCUT: the
        Frobenius matrix's density (fraction of nonzero entries) is
        computable directly from the field's minimal polynomial at any m,
        without a curve at all, and is reported per m as a zero-compute
        proxy for how bad the encoding will be. COMPARISON: measured ratio
        against 1/mu (H1's prediction) and against 1 (H2's prediction).
        TAIL CHECKS: whether ANY tested cell approaches 1/mu despite the
        density prediction, which would be the informative surprise.
        TRANSFER: none beyond tested m and l.
  heuristic_note: >-
    The endomorphism-commutation identity and the cyclic-shift fact are
    UNCONDITIONAL. H1 and H2 bear only on whether the SEARCH realizes the
    quotient they guarantee exists, i.e. on constants inside a constant-
    factor claim; the record's a-priori expectation is stated so neither
    outcome reads as merely interesting: normal basis is expected to realize
    mu, polynomial basis is expected to realize close to nothing, and a
    polynomial-basis arm that DOES realize mu is the surprising, headline
    outcome that would mean the pipeline's existing multiplication-table
    structure already carries the sparsity this record assumed absent.
  target_complexity:
    time_exponent: >-
      Unchanged. Per-target decomposition: leaf count divided by up to mu
      (a constant depending only on m, at most a few hundred at deployed
      field sizes) on top of the existing 1/m! from WDSat's own symmetry
      breaking, realized only in normal basis; no exponent moves.
    memory_exponent: >-
      Unchanged; the constraint is a small number of additional clauses per
      block, poly in l and log2(mu).
    best_known: >-
      Matched rho with negation and the curve's own Frobenius classes,
      already charged the sqrt(m) gain by RQ-BINSTD-b6f698's baseline
      convention on every Koblitz and subfield row; within the decomposition
      family, IDEA-20260904-96c4f3's four-row frontier and
      IDEA-20260904-3c7a91's leaf-count ceiling.
    hidden_overhead: >-
      Constructing a normal basis (if one exists at affordable "type" for
      the given m) and re-deriving the Weil descent in it is a real
      implementation cost, not charged here as anything beyond "medium" in
      estimated_cost; nothing superpolynomial hides in any o(1) since none
      appears in this record's claims.
    tradeoff_note: >-
      No memory traded; time only, and only on the solver's search-tree
      size. Parallelisation position unchanged: the core cube still splits
      into independent subcubes under the fixed variable order, with the
      canonical-representative constraint reducing the number of subcubes
      needing to be visited rather than changing how they parallelise.
  estimated_cost:
    implementation: medium
    compute: low
    qualification: >-
      Stage 0 needs no code. Stage 1 needs a normal-basis field
      constructor and the cyclic-shift/endomorphism checks -- new, since
      src/semaev_tree.py uses a polynomial basis only. Stages 2-3 need the
      CNF-XOR encoder and instrumentation this lane already shares with
      3c7a91/b40e6d/7fd218 plus the new constraint generator. Single core,
      hours to low tens of hours depending on normal-basis constructibility.
  asymptotic_claim:
    problem: ECDLP on standardized binary curves via x-coordinate point decomposition
    prior_best: Matched rho with negation and Frobenius classes; within the family, IDEA-20260904-3c7a91's leaf-count ceiling and IDEA-20260904-96c4f3's four-row frontier
    time_exponent: Unchanged (constant factor mu on the solver's leaf count, realized only in normal basis)
    memory_exponent: Unchanged
    hidden_cofactor: None; the normal-basis construction cost is charged in estimated_cost, not hidden
    claim_kind: structural_census_plus_constant_factor
  dominated_by: >-
    CHECKED ROW BY ROW. Matched rho with the curve's own symmetries dominates
    on time and memory on every named row and is unaffected by anything here.
    Within the decomposition family the frontier rows checked are:
    IDEA-20260904-3c7a91's leaf-count ceiling (this record proposes a
    further division by mu on top of it, at best, in normal basis only --
    Pareto-IMPROVING on that ceiling's constant, not dominating it, since the
    ceiling's exponent is unchanged); IDEA-20260904-96c4f3's four-row
    frontier (unaffected, since it is about the enumeration oracle, not the
    CNF-XOR arm); IDEA-20260922-29b1c5 (a disjoint symmetry group on a
    disjoint part of the population, neither dominates the other);
    RQ-FROB-7d8dd4's toy-scale invariant-ring rewriting (a different, more
    expensive lever on the same underlying mechanism, not measured here and
    not dominated or dominating without a direct comparison this record does
    not run). GHS / Weil descent on the composite rows is a different column
    of the same table, owned elsewhere. Net: at best Pareto-improving inside
    a family itself dominated by rho on every standardized row.
  sota_delta:
    time: >-
      At most a further constant factor mu (up to several hundred at
      deployed m) on the per-target CNF-XOR leaf count, realized only in
      normal basis per this record's own prediction; zero on attack
      capability, and zero in polynomial basis by the same prediction.
    memory: Unchanged (poly).
    data_queries: Not applicable.
  frontier_check:
    status: pending
    note: >-
      Whether Frobenius-stabilizer symmetry breaking has been applied as a
      SAT/DPLL search-order constraint (as opposed to invariant-ring
      rewriting of the polynomial system) for elliptic-curve point
      decomposition was not checked against external literature this
      session; no source was opened beyond the recalled Lidl-Niederreiter
      citation for the normal-basis fact itself, which is textbook and not
      claimed as new. The population census and the parser-bug finding are
      internal to this repository and are not literature claims.
  recommended_priority: high
  priority_rationale: >-
    Its best case is a constant factor mu, which is not target-class on its
    own under docs/target-result-profile.md rule A1, and the record says so.
    Ranked high for three reasons, each independently contestable: (1) the
    parser-bug correction is a genuine, zero-compute fix to the reachability
    table's own evidentiary basis, currently understating which standardized
    rows carry ANY extra symmetry at all -- leaving it uncorrected would let
    a future session wrongly treat every Koblitz row as symmetry-empty for
    this seam; (2) it decides several reachability-table cells at zero
    compute once Stage 0 runs; (3) the basis-dependence prediction is a
    reusable, falsifiable statement about which representation can absorb
    which symmetry, directly parallel to IDEA-20260922-29b1c5's enumeration-
    versus-algebraic separation but for a disjoint group, strengthening a
    pattern this lane has now observed twice. If the coordinator judges (1)
    alone sufficient the honest ranking of the remainder is medium.
  first_deliverable: >-
    The zero-compute package: the corrected six-curve Koblitz A,B census
    with its primary-source re-derivation obligation named, the
    endomorphism-commutation derivation, the parser-bug writeup with the
    exact regex diagnosis, and the per-row mu verdict table for every named
    curve in RQ-BINSTD-b6f698 -- all before any code runs.
  next_gate: >-
    Coordinator decision on whether the Stage-0 census package alone is the
    deliverable (a corrected input to the reachability table) or whether
    Stages 1-4 are designed into an EXP-BINSTD-* contract, and whether the
    primary-source (FIPS 186-4 / ANSI X9.62) re-derivation of the census is a
    prerequisite gate before either.
