idea:
  id: IDEA-20260922-7ab503
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    THE ABSOLUTE FROBENIUS x -> x^2 IS A GENUINE COORDINATE-SHIFT SYMMETRY OF
    THE DESCENDED POINT-DECOMPOSITION BOOLEAN SYSTEM ON EVERY STANDARDIZED
    CURVE WHOSE (a,b) IT FIXES, IT EXISTS AS A CHEAP SOLVER CONSTRAINT ONLY IN
    A NORMAL BASIS, AND A PARSER BUG IN THIS SESSION'S OWN AUDIT SCRIPT WAS
    HIDING THE VERY ROWS WHERE IT FIRES: a per-curve stabilizer census
    (corrected against a bug I isolated and verified directly against the raw
    OpenSSL dump), a solver-layer symmetry-breaking proposal distinct from
    RQ-FROB-7d8dd4's invariant-ring rewriting, and a basis-dependence claim
    that the WDSat/CaDiCaL pipeline as currently built cannot realize it.
  class: representation
  claim: >-
    SETTING. For E: y^2+xy=x^3+ax^2+b over F_{2^m} in a NORMAL basis
    {alpha,alpha^2,...,alpha^{2^{m-1}}}, write x = sum_j x_j alpha^{2^j}.
    Because Frobenius is additive in characteristic two, x^2 = sum_j x_j
    alpha^{2^{j+1}} = sum_j x_{j-1 mod m} alpha^{2^j}: THE ABSOLUTE FROBENIUS
    x -> x^2 IS EXACTLY THE CYCLIC LEFT SHIFT OF THE m-COORDINATE VECTOR. This
    is a one-line, unconditional, basis-specific fact (folklore; cited as
    recalled below) and it is NOT the q-power Frobenius ENDOMORPHISM
    RQ-FROB-7d8dd4 studies (there q may be a proper subfield's size and E is
    required to be defined over it as a genuine descent object). Here q=2
    always and no subfield is required: x -> x^2 is a coordinate permutation
    of THE FIELD ITSELF, independent of any curve.

    (A) WHEN IT IS A SYMMETRY OF THE DESCENDED SYSTEM, NOT JUST OF THE FIELD.
    Since Frobenius is a ring homomorphism, S_{m+1}(x_1,...,x_m,x_R)=0 implies
    S_{m+1}^sigma(x_1^2,...,x_R^2)=0 where S_{m+1}^sigma has a, b replaced by
    a^2, b^2 -- the descended equations of the DIFFERENT curve E^sigma. The
    shift maps solutions of E's descended system to solutions of E^sigma's
    IFF sigma fixes (a,b), i.e. IFF (a,b) lie in the fixed field of some power
    of Frobenius. Write mu = |Stab_{Gal(F_{2^m}/F_2)}(a,b)|: for m prime,
    mu in {1, m} (mu=m iff a,b in F_2); for m=16k, mu divides k (mu=k iff
    a,b in F_{2^16}, which the audit already certifies for the five composite
    ANSI curves). WHEN mu>1 this is a genuine EXTRA search-tree symmetry, of
    the same kind as WDSat's existing m!-fold arity symmetry breaking, not a
    re-derivation of it and not RQ-FROB-7d8dd4's invariant-ring rewriting
    (which changes the IDEAL itself; this changes only which representative
    of an orbit the SEARCH visits first, exactly the role WDSat's Prop.-1
    lexicographic order already plays for the m! symmetry).

    (B) THE PER-ROW CENSUS, WITH A BUG FOUND AND CORRECTED THIS SESSION. I
    read analysis/binstd-curve-audit/subfield_scan.py's hexblob() parser in
    full. Its third fallback regex, r'label:\s*(\d+)\s*\n', requires ONLY
    whitespace between the decimal digits and the newline. OpenSSL prints a
    zero coefficient as a bare "A:    0\n" (matches) but prints ANY OTHER
    single-byte coefficient as "A:    1 (0x1)\n" -- the literal text
    " (0x1)" sits between the digit and the newline, so the regex does NOT
    match, hexblob() returns None, and the coefficient is silently reported
    as "in no subfield" (the audit table's "-"), INDISTINGUISHABLE from a
    genuine negative. I verified this is not a hypothetical by grepping
    analysis/binstd-curve-audit/binary-curve-params.txt directly (this
    session, independent of the audit script) for every FIPS/SECG Koblitz
    row: sect163k1 A=1(0x1), B=1(0x1); sect233k1 A=0, B=1(0x1); sect283k1
    A=0, B=1(0x1); sect409k1 A=0, B=1(0x1); sect571k1 A=0, B=1(0x1);
    sect239k1 A=0, B=1(0x1). EVERY ONE has a,b in {0,1} subset F_2 -- the
    opposite of what the audit table's blanket "-" for A_in/B_in on these
    rows implies. The bug does NOT affect the audit's headline
    prime-vs-composite split or the five c2pnb* rows' F_{2^16} certification,
    because those coefficients are large (multi-hundred-bit) values that
    print in OpenSSL's multi-line colon-hex blob format and are parsed by the
    hexblob() FIRST regex, which the bug does not touch; and it does not
    affect the "-" reported for the pseudorandom rows (B-163..B-571,
    c2tnb*), whose a,b are also large blob-format values, so those negatives
    stand on the audit's own (unaffected) evidence. CENSUS, using the
    corrected Koblitz values and the audit's unaffected values elsewhere:
      - FIPS/SECG KOBLITZ (K-163,K-233,K-283,K-409,K-571,sect239k1): a,b in
        F_2 (verified above for all six), m prime, so mu = m: the FULL
        cyclic group of order m (163..571) is available as extra symmetry.
      - FIVE COMPOSITE ANSI ROWS (c2pnb176v1/208w1/272w1/304w1/368w1): a,b in
        F_{2^16} (audit-certified, unaffected by the bug), m=16k, so mu
        divides k in {11,13,17,19,23}. A DIFFERENT, smaller cyclic group.
      - PSEUDORANDOM ROWS (B-163..B-571, every c2tnb*, sect*r1/r2): the
        audit reports no proper subfield contains a or b, on inputs the bug
        does not touch, so mu=1 -- NO EXTRA SYMMETRY, a STRUCTURALLY EMPTY
        cell for this seam, with the audit's own certificate.

    (C) THE BASIS-DEPENDENCE, WHICH IS THE SECOND HALF OF THE CLAIM. The
    shift is a sparse, zero-cost coordinate PERMUTATION only in a NORMAL
    basis. In the polynomial basis src/semaev_tree.py and this program's
    Weil-descent tooling use (Sage's default; cited by IDEA-20260922-29b1c5
    from the same file), Frobenius is a DENSE F_2-linear map (generically no
    sparsity at all) -- so encoding "canonical representative of the
    mu-orbit" as a WDSat-style search-order or blocking-clause constraint
    costs a dense O(m)-literal XOR substitution per bit in polynomial basis,
    against O(1) (a pure relabelling of which wire is which) in normal basis.
    THE SAME SYMMETRY EXISTS ABSTRACTLY IN EITHER BASIS; WHETHER IT IS FREE
    TO EXPLOIT AT THE SOLVER LAYER IS A BASIS CHOICE, not a mathematical fact
    about the curve.

    (D) THE PREDICTION, PRE-REGISTERED. Adding a mu-orbit canonical-
    representative constraint (analogous to WDSat's existing m! lexicographic
    pruning, composed with it) to the descended CNF-XOR system: in NORMAL
    basis, predicted UNSAT leaf-count reduction close to the full factor mu
    (extending 3c7a91's law to N_conf = 2^{ml}/(m! mu), within the same 5%
    band that law already carries); in POLYNOMIAL basis, predicted STRICTLY
    LESS than mu and plausibly close to 1, because the dense substitution
    variables the constraint introduces are themselves undetermined until
    late in the search under 3c7a91's own no-above-leaf-pruning law -- the
    identical mechanism, applied to a different symmetry group, that made
    IDEA-20260922-29b1c5's V_W construction fail to realize its 2^{m-1} on
    the CNF-XOR arm.
  mechanism: >-
    OBJECT FRAME. Representation: the x-coordinate of a point in a fixed
    F_2-basis (R1 of RQ-ECDLP-623a32), together with the CHOICE of basis
    itself (normal vs the program's polynomial basis) as the thing whose
    charged cost this record claims to change -- the point-decomposition
    SOLVING stage specifically (not membership, not relation-collection,
    which RQ-FROB-7d8dd4 and RQ-ICPERF-94c86e already charge). Operation set
    Sigma: translation by factor-base points (index calculus's own Class I
    partial action) UNION the cyclic group generated by x -> x^{2^d} for the
    smallest d with a^{2^d}=a, b^{2^d}=b -- EXPLICITLY NOT the full
    translation action. Trichotomy: PARTIAL-ACTION (Class I of
    IDEA-20260806-c5d183), because Frobenius composed with the factor-base
    translation action is still a proper sub-action of the full translation
    group, and because on rows where mu=1 the extra generator is trivial and
    the class collapses to plain index calculus.
    LOSSY-PROJECTION TEST AGAINST THAT SIGMA. The projection P -> {mu-orbit
    of P under x -> x^{2^d}} discards which of the mu Frobenius-conjugate
    points was meant. The discard is Sigma-compatible because Frobenius is a
    RING homomorphism, so it commutes with the elliptic-curve group law
    exactly (not merely modulo a cofactor, unlike IDEA-20260922-29b1c5's
    2-torsion case): sigma^d(P_1+...+P_m) = sigma^d(P_1)+...+sigma^d(P_m),
    so the orbit of a sum is determined exactly by the orbits of the
    summands, for every curve on which sigma^d is an endomorphism of E at
    all -- which per (B) is precisely the rows with mu>1. It is genuinely
    lossy because from the orbit representative one cannot recover which of
    the mu conjugates was the actual point (mu>1 distinct field elements
    collapse to one orbit), and it is not a change of coordinates because
    |E(F_{2^m})| does not divide by mu evenly in general (the orbit sizes
    vary; only points with a,b-independent stabilizer get orbit size exactly
    mu, the generic case).
    WHY THIS IS NOT RQ-FROB-7d8dd4. That question studies the q-power
    Frobenius as a CURVE ENDOMORPHISM of a subfield curve E/F_q over F_{q^n},
    with q possibly greater than 2, explicitly EXCLUDING deployed/
    standardized curves from its own scope ("Deployed curves ... are never
    instances; toy subfield curves are self-generated"), and its decomposition-
    system lever is INVARIANT-RING REWRITING -- changing the polynomial
    system itself into a smaller quotient ideal. This record takes that
    mechanism as KNOWN (cited, not re-derived), fixes q=2 always (the
    absolute Frobenius, which needs no subfield and applies even to a curve
    with a,b not in any proper subfield, where it is simply trivial), and
    adds three things RQ-FROB does not: (i) the CENSUS across the actual
    named standardized population, corrected against a documented parser
    bug; (ii) a SOLVER-LAYER symmetry-BREAKING CONSTRAINT (a search-order
    device layered on the unchanged CNF-XOR system, in the spirit of WDSat's
    own m! pruning) as an alternative, cheaper-to-implement lever than
    invariant-ring rewriting; (iii) the basis-dependence claim, which
    RQ-FROB's text does not discuss at all.
    WHY THIS IS NOT IDEA-20260922-29b1c5. That record's group is the ORDER-2
    translation by the rational 2-torsion point T, acting on the x-line as
    x -> sqrt(b)/x, propagating only modulo the cofactor (an inversion-type
    involution). This record's group is the Galois stabilizer of (a,b) under
    the ABSOLUTE FROBENIUS, acting by FIELD-AUTOMORPHISM (a permutation of
    bit-coordinates, not an inversion), propagating EXACTLY (not modulo a
    cofactor) whenever it exists at all, and existing on the FIPS/SECG
    Koblitz rows where 29b1c5's cell was STRUCTURALLY EMPTY (prime m, only
    subfields F_2 and F_{2^m}) -- the two records' emptiness verdicts land on
    OPPOSITE parts of the population for related but distinct reasons, and
    together they are a fuller reachability-table pass than either alone.
