idea:
  id: IDEA-20260803-ff7415
  question_id: RQ-MONO-001
  title: >-
    Decide KN-FIND-c41ea9's own untaken clause - is the 2^(n-1) split-compounding over
    F_{q^n} an exponent lever, or a double count against an exact conservation identity the
    programme already owns?
  class: measurement
  claim: >-
    KN-FIND-c41ea9 CLOSES WITH A CLAUSE IT FLAGS AND DOES NOT DECIDE, AND THE CLAUSE IS THE
    ONLY EXPONENT-MOVING STATEMENT ANYWHERE IN THE ECDLP CORPUS:
      "A per-fibre factor of 2 applied once per summation fibre in a Gaudry/Diem-style
       decomposition over F_{q^n} with n growing compounds as 2^{n-1} = q^{Theta(1)} and
       WOULD move an exponent. Never quote the phrase without this scope."
    IT IS ALSO, ON THE PROGRAMME'S OWN COMMITTED ARITHMETIC, VERY LIKELY A DOUBLE COUNT -
    AND WHICH OF THE TWO IT IS, IS DECIDABLE CHEAPLY.
    THE TENSION, STATED EXACTLY. KN-FIND-007 gives the EXACT, geometry-independent mean
    number of size-m multisets from a base of size B summing to a given target:
    C(B+m-1,m)/N. That is a double count, not an estimate, and it was measured at maximum
    absolute deviation exactly 0 across 144 cells. KN-FIND-007 further records that the
    Gaudry-Diem 1/n! decomposition probability IS this conservation mean - at B = q,
    N = q^n, m = n it returns 1/n! identically. THE MEAN IS THEREFORE NOT CORRECTABLE
    UPWARD BY ANY FACTOR WHATSOEVER. A correction of 2 per fibre compounding to 2^(n-1)
    would place the relation rate 2^(n-1) above a quantity that is exact.
    THE RESOLUTION MUST THEREFORE BE THAT THE 2(1 - 1/W_eff) FACTOR CORRECTS A PROXY, NOT
    THE YIELD - it is the measured discrepancy between the quasirandom product form
    freq_split*(W_eff/p)^2 and the true joint law, and the true joint law is already pinned
    by conservation. IF SO, THE COMPOUNDING CLAUSE IS VACUOUS: applying a proxy-repair once
    per level does not compound, because the thing it repairs was never the quantity that
    multiplies across levels.
    PRE-REGISTERED PREDICTION, WHICH CAN FAIL: over F_{q^n} at n = 2,3,4,5, the MEASURED
    per-target decomposition count agrees with the conservation mean C(B+n-1,n)/N to within
    the coverage correction bounded at 1.582 by KN-FIND-007, and does NOT exceed it by any
    factor growing in n - in particular the ratio (measured / conservation mean) shows NO
    2^(n-1) trend, with a fitted trend exponent in [-0.15, 0.15] against a compounding
    prediction of 1.0.
    IF THE PREDICTION HOLDS, KN-FIND-c41ea9's compounding clause is REFUTED AT TOY SCALE and
    must be superseded by a corrected entry (never overwritten - AGENTS.md rule 2). IF IT
    FAILS - if the measured rate really does grow against an exact identity - then the two
    quantities are not measuring the same event, identifying WHICH event is the finding, and
    a genuine relation-rate lever may exist.
  mechanism: >-
    WHY THIS IS WORTH A BATCH AND IS NOT PEDANTRY. THREE LIVE CONSUMERS DEPEND ON THE ANSWER.
    (1) DEC-20260802-a51c82 makes reading the corrected relation-rate factor MANDATORY before
    consuming any MONO feed into GOAL-ICEX-001, and instructs "USE THE FORMULA, NOT THE
    NUMBER - the 1.5 measured at W_eff = 4 is not the limit, which is 2." That instruction is
    correct about the limit and silent about whether the factor compounds. ICEX is an
    EXPONENT goal; a factor that compounds changes its answer and a factor that does not,
    does not. (2) GOAL-RELN-001's entire protocol is a relation-rate audit. (3) Any future
    prime-field-to-extension-field transfer argument inherits the clause.
    WHY THE ANSWER IS PROBABLY "DOUBLE COUNT" AND WHY THAT IS STILL WORTH MEASURING. The
    conservation identity is a one-line double count over multisets and admits no correction
    factor; the quasirandom product form is a model of a JOINT LAW on fibre invariants and
    admits every correction factor. These are different objects and the corpus currently has
    one sentence that reads as though a correction to the second could compound into a
    statement about the first. A NULL RESULT HERE IS A CORRECTION TO A LIVE KNOWLEDGE ENTRY
    THAT THREE GOALS ARE INSTRUCTED TO CONSULT, which is exactly the class of result
    KN-FIND-007 itself was recorded for - it converted a recurring empirical null into a
    screening rule after 24 CPU hours had been budgeted for a battery whose primary metric it
    made vacuous.
    WHAT MAKES IT CHEAP. The conservation arm is arithmetic - no curve is needed to evaluate
    C(B+n-1,n)/N. The measured arm needs only toy q and n <= 5 with the subfield-line factor
    base, which is the standard Gaudry-Diem construction and is small at toy scale. The
    discriminating comparison is a ratio against an exactly known denominator, so there is no
    null-model estimation step and therefore no place for the estimation defects that voided
    EXP-YIELD-001's first run set (EV-ECDLP-008: the pre-registered gate that had to certify
    P_pred before any efficiency could be read did not certify it).
    THE ONE DESIGN DECISION THAT MATTERS. The measurement MUST count the same event the
    identity counts - size-n MULTISETS from the base summing to the target - and not ordered
    tuples, not roots of the summation fibre, and not distinct decompositions up to sign. The
    factor 2^(n-1) is suspiciously exactly the number of sign patterns
    x(+-P_1 +- ... +- P_{n-1}) that KN-FIND-c41ea9 itself identifies as the complete split of
    the fibre on the factor-base locus. IF THE COMPOUNDING FACTOR AND THE SIGN-PATTERN COUNT
    ARE THE SAME 2^(n-1), THE CLAUSE IS AN ORDERED-VERSUS-UNORDERED ACCOUNTING ARTIFACT AND
    THE MEASUREMENT WILL SHOW IT DIRECTLY. That coincidence is the single most likely
    explanation and the design tests it explicitly by counting both conventions.
  novelty_status: adaptation
  novelty_screen:
    screened_on: '2026-08-03'
    corpus_paths_grepped:
    - knowledge/findings/KN-FIND-c41ea9.md
    - knowledge/findings/KN-FIND-007.md
    - ledger/decisions/DEC-20260802-a51c82.yaml
    - ledger/goals/GOAL-ICEX-001.yaml
    - ledger/goals/GOAL-RELN-001.yaml
    - ledger/evidence/EV-MONO-a0a89c.yaml
    grep_results:
    - >-
      KN-FIND-c41ea9 states the clause and explicitly flags it ("Never quote the phrase
      without this scope"). IT DOES NOT DECIDE IT and records no measurement of compounding
      at any n > 1. This record decides it. The finding's authors are not being contradicted
      - they marked the boundary and this is the work beyond it.
    - >-
      DEC-20260802-a51c82 mandates the corrected formula 2(1 - 1/W_eff) for ICEX feeds and
      is silent on compounding. That silence is what makes the question live rather than
      academic.
    - >-
      KN-FIND-007 supplies the exact conservation mean and explicitly identifies the
      Gaudry-Diem 1/n! as that mean. The two findings have never been read against each
      other in any committed record; doing so is this record's entire premise.
    - >-
      EXP-SUBRES / EV-SUBRES-001 measured the m = 5 backward 3-sum state and found it
      GENERIC at (4/3)L^3, beta = 0.5985 against 3/5. That is a different statistic (state
      size, not relation rate) on a related object and is the closest prior measurement; it
      is a useful precedent for the toy-scale machinery and is not duplicated.
    literature_verified: []
    literature_unverified:
    - >-
      Gaudry-Diem-style decomposition over F_{q^n} with the subfield-line factor base is
      named in KN-FIND-007 and KN-FIND-c41ea9 and its 1/n! probability is cross-checkable
      INTERNALLY against the conservation identity with no external source. No external
      claim is needed for this record and none is made.
    conclusion: >-
      Adaptation. Measuring a decomposition rate against a combinatorial prediction is this
      programme's most-repeated experiment shape. The contribution is the specific
      confrontation - an exact identity against a compounding clause that would violate it -
      and the ordered-versus-unordered diagnosis that the 2^(n-1) coincidence suggests.
  assumptions:
  - >-
    The measured event is FROZEN IN THE CONTRACT BEFORE EXECUTION as size-n multisets from
    the declared base summing to the declared target, and BOTH the multiset and the ordered
    conventions are counted and reported separately in every cell. A record that reports one
    convention is inadmissible, because the entire hypothesis under test is that the clause
    is a convention artifact.
  - >-
    The conservation arm is computed as exact rational arithmetic from C(B+n-1,n)/N with no
    sampling, so the denominator of every reported ratio is exact and no null-model
    estimation is required.
  - >-
    Toy scale throughout - q small enough for exhaustive enumeration at n <= 5, so the
    measured count is EXHAUSTIVE rather than sampled wherever the parameters permit, and any
    cell that must be sampled is marked as sampled with its sampling error.
  predictions:
  - metric: conservation_agreement_ratio
    direction: same
    minimum_effect: >-
      'measured multiset count / (C(B+n-1,n)/N) lies in [1/1.582, 1.582] at every tested
      (q, n) cell - the coverage-correction band KN-FIND-007 derives. A cell outside that
      band contradicts an exact identity and must be routed to a correction record rather
      than absorbed.'
  - metric: compounding_trend_exponent
    direction: same
    minimum_effect: >-
      'Fitting log2(measured / conservation mean) against (n-1) gives a slope in
      [-0.15, 0.15]. THE COMPOUNDING CLAUSE PREDICTS SLOPE 1.0. These are separated by more
      than six times the band, so the test discriminates rather than merely failing to
      reject.'
  - metric: ordered_versus_multiset_ratio
    direction: same
    minimum_effect: >-
      'The ratio of the ordered count to the multiset count is reported at every cell. IF IT
      TRACKS 2^(n-1) OR n! THE CLAUSE IS DIAGNOSED AS A CONVENTION ARTIFACT AND THE
      DIAGNOSIS IS THE DELIVERABLE - this is the pre-registered explanation and naming it in
      advance is what stops it being fitted after the fact.'
  - metric: split_completeness_confirmation
    direction: same
    minimum_effect: >-
      'On the factor-base locus, S_n splits completely with root set exactly
      {x(+-P_1 +- ... +- P_{n-1})} at 100 per cent of tested specializations, replicating
      KN-FIND-c41ea9''s 193/193 result at m = 4 and extending it to n = 5. A failure here
      contradicts a committed derivation and blocks everything else.'
  - metric: quasirandom_proxy_discrepancy
    direction: same
    minimum_effect: >-
      'The measured discrepancy between the quasirandom product form and the true joint law
      is reported separately from the yield ratio, and must reproduce 2(1 - 1/W_eff) as
      W_eff grows - recovering 1.5 at W_eff = 4 and approaching 2. This confirms the proxy
      correction is real WHILE the yield ratio shows it does not compound, which is the
      two-part shape the whole record turns on.'
  minimal_test:
    design: >-
      (1) Freeze the counted event, both conventions, the cell grid, and all five predictions
      in a hash-bound contract before any run. (2) Compute the conservation arm exactly.
      (3) For q in a declared toy ladder and n in {2,3,4,5}, build the subfield-line factor
      base and EXHAUSTIVELY count size-n multisets summing to each of a declared target set,
      reporting both conventions. (4) Replicate the split-completeness check at n = 4
      (193/193 known answer) and extend to n = 5. (5) Measure the quasirandom-proxy
      discrepancy separately across a W_eff ladder and confirm it approaches 2. (6) Fit the
      compounding trend and report against the pre-registered band. (7) Emit the disposition:
      CLAUSE_REFUTED_AT_TOY, CLAUSE_SUPPORTED (with the event-identity question named), or
      CONVENTION_ARTIFACT_DIAGNOSED.
    controls:
    - >-
      EXACT-DENOMINATOR CONTROL. The conservation arm is exact arithmetic, so the ratio has
      no estimated denominator. This is the specific structural repair of the EV-ECDLP-008
      failure, in which every efficiency was voided because the prediction certifying gate
      never certified.
    - >-
      KNOWN-ANSWER CONTROL at n = 4 split completeness, reproducing 193/193 from
      KN-FIND-c41ea9 before any new cell is believed.
    - >-
      DUAL-CONVENTION CONTROL - both ordered and multiset counts at every cell, which is what
      makes the convention-artifact diagnosis available rather than speculative.
    - >-
      NULL-BASE CONTROL. Repeat at a RANDOM base of matched size. By KN-FIND-007 the mean
      yield must be IDENTICAL, so any difference between the subfield-line and random arms in
      the yield ratio is an instrument defect and not a structure effect. This control is
      guaranteed by arithmetic to return 1 and therefore has real power against a defective
      counter.
    required_metrics:
    - conservation agreement ratio per cell, both conventions
    - compounding trend slope with its interval
    - ordered/multiset ratio per cell against 2^(n-1) and n!
    - split-completeness fraction at n = 4 (known answer) and n = 5
    - quasirandom-proxy discrepancy across the W_eff ladder against 2(1 - 1/W_eff)
    - null-base yield ratio, which must be 1
  falsification_conditions:
  - >-
    'F1 - the compounding trend slope is at or above 0.5: the clause is SUPPORTED at toy
    scale, which contradicts an exact identity and therefore means the measured event is not
    the counted event. Identifying the discrepancy is then the mandatory deliverable and no
    exponent claim may be made until it is identified.'
  - >-
    'F2 - the null-base control does not return 1: the counter is defective and every cell is
    void. Guaranteed by arithmetic to be a true known-answer test.'
  - >-
    'F3 - the n = 4 split-completeness known answer is not reproduced: contradicts a
    committed derivation, blocks the batch, routes to a correction record.'
  - >-
    'F4 - the quasirandom-proxy discrepancy does not approach 2: DEC-20260802-a51c82''s
    mandated formula is wrong and that is decision-relevant for ICEX independently of the
    compounding question.'
  - >-
    'F5 - the conservation agreement ratio falls outside [1/1.582, 1.582] at any cell: either
    KN-FIND-007 or this instantiation is wrong. Correction record, never absorbed.'
  confounders:
  - >-
    TOY SCALE CANNOT SEE AN ASYMPTOTIC. n <= 5 at small q bounds what a trend fit means, and
    a slope measured over four points is weak evidence for any asymptotic statement. The
    honest reading of a null result is "no compounding at n <= 5 at these q", and the record
    must say exactly that rather than "no compounding".
  - >-
    W_eff and n are separate knobs and the clause mixes them. The design varies them
    independently for exactly that reason, and a result that cannot separate them is reported
    as unseparated.
  - >-
    The subfield-line base at toy q may be too small for the asymptotic regime the clause
    describes, so a null could be a scale artifact. The null-base control does not detect
    this and nothing in the design does; it is a named limit.
  interpretation_limits:
  - >-
    THIS MOVES NO EXPONENT IN EITHER DIRECTION. A refutation removes an overstated clause; it
    does not make prime-field ECDLP harder. A confirmation would not by itself constitute an
    attack, because a relation-rate factor is one term of a cost model and KN-FIND-007 caps
    the achievable yield gain at 1.582 under one-relation-per-target regardless.
  - >-
    Claim tier `toy`. KN-OPEN-009's imprimitivity half is untouched; KN-OPEN-001 is untouched.
  - >-
    Any correction to KN-FIND-c41ea9 SUPERSEDES rather than overwrites, per AGENTS.md rule 2,
    and must preserve the entry's correct and independently re-derived content - the
    discriminant identity, the S_2 monodromy statement, the 4/p density law, and the
    factor-base split-completeness observation - all of which stand regardless of this
    record's outcome.
  heuristic_assumptions:
  - id: HEUR-SC-1
    statement: >-
      The counted multiset event at toy q is the same event the conservation identity counts,
      so a ratio outside the coverage band indicates a measurement defect rather than a
      failure of the identity.
    rigorous_support: >-
      The identity is a double count and is not in question. THE EVENT IDENTIFICATION IS
      EXACTLY WHAT IS IN QUESTION, which is why both conventions are counted and why F1
      routes a positive result to event-identification rather than to an exponent claim.
    validation_plan: >-
      The null-base control is guaranteed by arithmetic to return 1 and therefore tests the
      counter directly. A counter that passes it is counting SOME event correctly; the dual
      convention report then identifies which.
  - id: HEUR-SC-2
    statement: >-
      Behaviour at n <= 5 and toy q is indicative of the n-growing regime the clause
      describes.
    rigorous_support: >-
      NOT SUPPORTED, AND THIS IS THE RECORD'S WEAKEST POINT. The clause is explicitly about n
      growing; four points cannot establish an asymptotic.
    validation_plan: >-
      Report the slope with its interval and state the scale limit in every citation. A null
      is reported as "no compounding detected at n <= 5", never as "does not compound". A
      positive at n <= 5 is worth escalating and a null is worth only the correction it
      licenses.
  target_complexity:
    time_exponent: >-
      No attack proposed. The object measured is a dimensionless ratio against an exactly
      known denominator.
    memory_exponent: n/a
    best_known: >-
      Pollard rho for prime fields (KN-OPEN-001); over F_{q^n} the Gaudry-Diem construction,
      whose 1/n! decomposition probability is the conservation mean per KN-FIND-007.
    hidden_overhead: >-
      None charged - no algorithm is run and no cost comparison is made.
    tradeoff_note: n/a
  dominated_by: >-
    Not applicable - no attack and no Pareto point. Written explicitly rather than left null.
  sota_delta: >-
    Zero on every attack axis. The knowledge delta is from a flagged, undecided,
    exponent-implying clause that three goals are instructed to consult, to a measured
    disposition with a named diagnosis - most likely an ordered-versus-multiset convention
    artifact, which the design tests directly rather than infers.
  instrument_failure_guards:
    decision_variable: >-
      The compounding trend slope and the ordered/multiset ratio.
    what_would_make_it_vary: >-
      n, an externally imposed knob whose predicted effect is explicit and opposite under the
      two hypotheses - slope 1.0 under compounding, slope 0 under double count. The
      hypotheses are separated by more than six times the pre-registered band, so a null is a
      REJECTION rather than a failure to detect.
    power_against: >-
      A genuine multiplicative relation-rate gain growing in n; a defective decomposition
      counter (null-base control); a wrong proxy-correction formula (W_eff ladder).
    no_power_against: >-
      The asymptotic regime beyond n = 5. The imprimitivity half of KN-OPEN-009. Any question
      about prime fields, which have no subfield line and to which the extension-field
      construction does not transfer. Whether the Gaudry-Diem construction beats rho, which
      is a cost question this record does not charge.
    demonstrated_movement: >-
      By the n = 4 split-completeness known-answer replication (193/193 committed) and by the
      null-base control, which arithmetic guarantees must return 1 and which therefore fires
      on a defective counter with certainty rather than with probability.
    lessons_addressed: >-
      Addresses EV-ECDLP-008's lesson - an efficiency read against a prediction that was
      never certified - by making the denominator EXACT rather than estimated, so there is no
      certifying gate to fail. Addresses EV-FBG-001's lesson - a primary metric vacuous by
      conservation - by putting the conservation identity on the denominator where it belongs
      instead of in the hypothesis.
  estimated_cost:
    implementation: low
    compute: low
  compute_budget_note: >-
    Exhaustive enumeration at toy q for n <= 5 over a small target set, plus exact rational
    arithmetic. Hours, not days. The n = 5 cells dominate and their size is declared in the
    contract with a fallback to sampling that is marked as sampled.
  recommended_priority: medium
  dependencies:
  - >-
    KN-FIND-007 and KN-FIND-c41ea9 must remain unsuperseded at execution time; both are read,
    neither is written.
  - >-
    Feeds DEC-20260802-a51c82's mandated ICEX read directly - it decides whether the mandated
    formula compounds, which that decision does not address.
  - >-
    Independent of IDEA-20260803-fa9839 and IDEA-20260803-e2f5bd, though a compounding
    positive would change fa9839's relation-search term and the two would then need
    reconciling.
  status: proposed
  proposed_by: analysis-session
  proposed_at: '2026-08-03'
  source_refs:
  - knowledge/findings/KN-FIND-c41ea9.md
  - knowledge/findings/KN-FIND-007.md
  - ledger/decisions/DEC-20260802-a51c82.yaml
  - ledger/evidence/EV-MONO-a0a89c.yaml
  - ledger/evidence/EV-ECDLP-008.yaml
  - analysis/SSI-ECDLP-SYNTHESIS-20260803.md
  inference:
    requested_policy: idea-generation
    resolved_model_id: claude-opus-5
    reasoning_effort: null
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the policy aliases in
