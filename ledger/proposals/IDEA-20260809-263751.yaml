idea:
  id: IDEA-20260809-263751
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-NTRU-9015ee
  goal_id: GOAL-NTRU-001
  title: >-
    Does the fatigue exponent transfer across ring shapes? Measure it on the
    deployed inert-prime-degree ring, not only on the cyclotomic one it was
    fitted on
  class: mechanism
  claim: >-
    The published fatigue point is a fitted constant obtained for one family of
    rings. The deployed NTRU Prime variant uses a deliberately different ring —
    prime degree, large Galois group, inert modulus — chosen to avoid structure.
    The claim is that the dense sublattice event's location is measurably
    different for that ring at matched (n, q), because the event depends on the
    module structure of the secret's ideal and the two rings differ exactly there.
  mechanism: >-
    Construct NTRU instances over both rings at matched dimension and modulus,
    run the identical reduction and the profile detector, and compare transition
    locations. Any difference is attributable to the ring because everything else
    is held fixed by construction.
  why_not_a_renamed_known_approach: >-
    The fatigue literature is aware that ring choice could matter and generally
    works in one setting. This record's content is the matched-pair experiment
    and a pre-declared effect-size threshold below which the two rings are
    reported as indistinguishable.
  predictions:
  - observable: transition location on the deployed ring minus that on the cyclotomic ring
    metric: difference in log q at fixed n, with confidence interval
    predicted: >-
      Non-zero but small. A large difference in either direction is the more
      valuable outcome: it would mean the published law was measured on an object
      the deployment does not use.
  - observable: whether the profile detector behaves identically on both rings
    metric: detector statistic distributions compared
    predicted: Same qualitative behaviour. Detector behaviour that differs by ring would confound the transition comparison and must be resolved before the comparison is recorded.
  minimal_test: >-
    Matched sweeps over both rings at two dimensions, twenty instances per cell,
    with the transition located by the detector and by recovery separately, and
    the difference reported with its interval.
  controls:
  - 'MATCHED-PARAMETER CONTROL: identical n, q, secret distribution, reduction implementation and block-size ladder across rings, or the comparison measures the harness.'
  - 'ARITHMETIC VALIDATION: ring arithmetic for both rings validated against known test values before any instance is generated; an incorrect inert-modulus implementation would produce a spurious ring effect.'
  falsification_conditions:
  - The measured difference is within the pre-declared indistinguishability threshold at every dimension.
  - Detector behaviour differs by ring in a way that cannot be corrected, making the transition comparison uninterpretable.
  interpretation_limits: >-
    Toy dimension. A measured ring effect is a statement about the event at those
    dimensions, not a statement about deployed parameter safety in either
    direction.
  sota_delta: 'No attack. Delta: a matched-pair measurement of a constant that deployment margins depend on and that has been fitted for one ring only.'
  dominated_by: Not dominated by any corpus record; depends on IDEA-20260809-24eec3 for the detector.
  estimated_cost: Implementation medium (two ring arithmetics); compute moderate.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for NTRU Prime / inert modulus: no records. WEB NOT CHECKED.'
  source_refs:
  - NTRU and NTRU Prime submission specifications -- REQUIRED READS, NOT YET READ.
