  assumptions:
    - Odd prime p, ordinary short-Weierstrass curve, prime group order n.
    - >-
      lambda is invertible modulo n and its multiplicative order exceeds B,
      so the window has B distinct elements. Verified on the frozen cells.
    - >-
      F2 (factor-base decomposition) is used as a COMPONENT and is named as
      such; F6 supplies the orbit and F1 the membership strategies. None is
      the lens.
    - >-
      No secret scalar is targeted; both frozen cells are public toys.
    - >-
      Descent is not part of the design and is therefore not charged. A
      successor that adds descent must re-charge the whole path.
  predictions:
    - metric: window_sumset_hold
      direction: different
      minimum_effect: >-
        REAL cells must reproduce |F + F| = 36 for lambda = 5 and
        |F + F| = 28 for lambda = 23 at n = 167, B = 8, P = (1,55) on
        y^2 = x^3 + x + 3 over F_151. Known-false control: |F + F| = 36 for
        lambda = 23. A matched random 8-subset of the group is not credited
        with either value.
    - metric: certified_membership_cost_mu
      direction: higher
      minimum_effect: >-
        mu(B), the number of group operations any declared strategy needs
        to CERTIFY the window index of a given point (or certify
        non-membership), fitted as mu ~ B^alpha over a declared B-ladder
        spanning at least a 16x range. Pre-registered branches:
        alpha >= 0.45 on every field size records the CLOSURE branch;
        alpha <= 0.30 reproduced on all field sizes AND absent from the
        matched random-subset null records the LEAD branch; anything
        strictly between is declared INCONCLUSIVE in advance. These are
        untested pre-registered tolerances chosen around the two anchors
        alpha = 0.5 (the box-DLP generic floor) and alpha = 0 (a free
        predicate), not measurements.
    - metric: L_and_b
      direction: different
      minimum_effect: >-
        L = log2(n/(B+1)) and b = 1 on the window sub-domain with escape
        rate exactly 1/B per Sigma-step, measured against the identity
        projection (L = 0, b = 1), a random B-symbol label (b at the
        balls-in-bins expectation), and the relabelled Z/nZ generic group
        (same L and b, since the construction never reads coordinates).
        A measured b > 1 on the sub-domain means the implementation is
        wrong, not that the object branches.
    - metric: charged_total_versus_rho
      direction: higher
      minimum_effect: >-
        The end-to-end charge max(n*mu(B), B^2) group-operation equivalents
        against 0.886*sqrt(n) for rho on the same curve, reported as a
        ratio at every B on the ladder. Predicted ratio >= sqrt(n) at every
        B. A measured ratio below 1 at any B is the LEAD branch and
        triggers mandatory independent review before interpretation.
  minimal_test:
    execution_status: design_only
    design: >-
      STAGE 0 (zero compute beyond exact integer arithmetic, HARD GATE).
      Recompute the two frozen cells. Verify #E = 167 and [167]P = O on
      y^2 = x^3 + x + 3 over F_151; verify the eight exponents and the
      eight points for lambda = 5 and lambda = 23; verify |F + F| = 36 and
      28 respectively. Verify the known-false claim |F + F| = 36 for
      lambda = 23 FAILS. Verify the invalid input: a point not in F must be
      classified bottom, and the point at infinity must reject.
      STAGE 1 (minutes). Measure mu(B) for the declared strategy family --
      (a) sequential [lambda^{-1}] stepping (upper bound B), (b) BSGS over
      the window, (c) kangaroo over the window, (d) any strategy the
      executor declares BEFORE running it -- on a B-ladder
      B in {4, 8, 16, 32, 64} at n = 167 and on two larger frozen toys with
      n near 2^20 and 2^26. Report CERTIFIED cost, never a guess: a
      strategy that returns the right index without certifying it has not
      solved membership, because a factor base that occasionally
      mis-classifies produces false relations.
      STAGE 2 (minutes). The nulls and controls below, on the identical
      pipeline.
      STAGE 3 (only if the LEAD branch fires). Repeat across three field
      sizes and at least four values of B, then stop and route to
      independent review. NO ECDLP INSTANCE IS SOLVED under this record.
    matched_null: >-
      A uniformly random B-subset of the group, with the same declared
      strategy family. This is the load-bearing null: if certified
      membership costs the same on a lambda-progression as on a random
      subset, the multiplicative structure contributes nothing to
      membership and the closure branch is recorded as a controlled null.
      DECAY PARAMETER: B. A genuine structural advantage must GROW with B;
      an advantage flat in B is an artifact under
      docs/inventor-protocol.md section 3.
    known_false: >-
      |F + F| = 36 for lambda = 23 at B = 8, n = 167 (the true value is
      28).
    controls:
      - kind: matched_null
        design: >-
          Uniformly random B-subsets of the group at the same B; membership
          strategies unchanged.
      - kind: known_false
        design: >-
          The invariance claim |F + F| = 36 asserted for lambda = 23.
      - kind: invalid_input
        design: >-
          A point outside F must be certified bottom; the point at infinity
          must reject; a lambda whose multiplicative order is below B must
          be refused before the cell runs.
      - kind: baseline
        design: >-
          Pollard rho with distinguished points and BSGS on the same curve,
          measured in the same group-operation unit, as the mandatory
          matched attack-cost controls.
      - kind: generic_group
        design: >-
          Relabelled Z/nZ with the same lambda. The whole construction is
          generic, so every measured quantity must agree with the elliptic
          run; disagreement means the implementation is reading coordinates
          somewhere it should not.
      - kind: positive_control
        design: >-
          A PLANTED cheap window: replace the orbit by a set whose index is
          readable from a public tag, so mu = O(1). The strategy family
          must find it. If it does not, every negative in Stage 1 is
          inadmissible and the cell is reported UNTESTED rather than
          closed.
    required_metrics:
      - window_sumset_hold
      - certified_membership_cost_mu
      - L_and_b
      - charged_total_versus_rho
    decision_threshold: >-
      The two REAL sumset values must match independent recomputation, and
      the known-false control must fail. mu(B)'s fitted alpha decides the
      closure or lead branch on the pre-registered tolerances above. The
      charged total is reported as a ratio to rho at every B and no
      exponent claim is made from it.
    stopping_rules:
      - >-
        Stop at the first failed exact identity, failed known-false
        control, or failed positive control and classify it as a procedure
        defect rather than as evidence about the object.
      - >-
        No run is authorized by this record; authorized_runs is 0.
    required_artifacts:
      - >-
        frozen manifest (p, A, B_curve, n, P, lambda, B, exponent list,
        point list, |F + F|) for both cells
      - REAL, known-false, matched-null, invalid-input and positive-control
        outcomes
      - per-(B, strategy, field size) certified mu with bootstrap interval
      - fitted alpha per field size with residuals
      - charged-total table against rho and BSGS in one unit
    budget:
      authorized_runs_in_this_task: 0
      future_experiment_status: >-
        requires a new approved frozen handoff; the strategy family must be
        declared and hash-bound before any measurement
  falsification_conditions:
    - >-
      Independent recomputation disagrees with #E = 167, with either
      exponent list, or with either |F + F| value. The designed REAL values
      are then a procedure defect and this record is superseded, not
      amended.
    - >-
      The matched random-subset null reproduces mu(B) at every B. The
      predicted closure is CONFIRMED and the honest headline is a cost law
      plus a controlled null, not a finding about elliptic curves.
    - >-
      A declared strategy achieves mu(B) = o(sqrt(B)) on lambda-windows and
      not on the null, reproduced across field sizes. The closure branch is
      false; this is the LEAD branch and it is membership-cost relevant. It
      does NOT contradict KN-TECH-005, which is scoped to generic
      procedures, and any report must say so.
    - >-
      The positive control fails. The instrument has no power and no
      negative may be read from it.
    - >-
      A measured advantage flat in B. Artifact, recorded as a controlled
      null.
    - >-
      Budget exhaustion before the B-ladder resolves. Infrastructure
      outcome under AGENTS.md rule 5, never evidence about mu.
  confounders:
    - >-
      lambda with hidden structure. A lambda that is a small power of 2
      makes the window points related by cheap doublings and could produce
      a membership shortcut that is about that lambda rather than about the
      construction. The ladder must draw lambda uniformly from the elements
      of the required order and report small-power-of-2 lambdas separately.
    - >-
      Toy-scale window-to-group ratio. At n = 167 a window of 8 is 4.8 per
      cent of the group, which is far larger than any cryptographic
      analogue and biases the measurement TOWARD apparent structure.
      Disclosed; the field-size ladder is the only available defence and it
      is a weak one.
    - >-
      Certified versus guessed index. A strategy that returns the true
      index without certifying it has not solved membership. The metric is
      defined as certification cost for exactly this reason.
    - >-
      Confusing |F + F| with relation yield. |F + F| bounds the TARGETS an
      arity-2 decomposition can reach; it is not a relation count and does
      not by itself price the algorithm.
    - >-
      Accidental smoothness of n and the anomalous case #E = p at toy
      scale, excluded per KN-TECH-034 before a curve enters the run set.
      The p = 151 cell has n = 167 prime and n != p.
  interpretation_limits:
    - >-
      KN-OPEN-020 CLASS, DECLARED: implicit-membership description. The
      record does not claim to escape the bounded-degree obstruction by
      being high-degree or target-dependent, and it does not claim the
      universal theorem KN-OPEN-020 asks for.
    - >-
      REPRESENTATION-CLASS CAVEAT, DECLARED. "Index relative to an
      auxiliary orbit" is not one of the R3 examples enumerated in
      RQ-ECDLP-623a32. It is placed at R3 because it is not a function of
      the coordinates and not a curve model; a reviewer who rejects that
      placement should read the record as an unclassified representation
      with the obstruction named, per docs/object-frame-ideation.md
      section 3, and not as an R1 candidate.
    - >-
      Not F1: no walk is the lens, though kangaroo appears inside the
      membership strategies. Not F6: lambda need not be an endomorphism.
      Not the Kummer line and not a degree-d function on E.
    - >-
      Stage 0 is a calibrator over two frozen cells. established_exponent
      _gain = 0, and the predicted charged total is WORSE than rho by a
      factor of at least sqrt(n).
    - >-
      The generic lower bound applied to mu(B) is inherited from
      KN-TECH-005 at second hand and carries that record's own caveat: it
      is a barrier in the opaque-label model, not a proof that no
      non-generic membership procedure is cheap. That is precisely the gap
      the LEAD branch probes.
  heuristic_assumptions:
    - id: H1-IDEA-20260913-04fb8c
      statement: >-
        For lambda drawn uniformly from the elements of multiplicative
        order r > B in (Z/n)^*, the window exponent set
        {lambda^i mod n : i < B} behaves with respect to ADDITIVE
        statistics like a uniformly random B-subset of Z/n; in particular
        E|F + F| = n*(1 - (1 - 1/n)^{B(B+1)/2}) + O(B^2 * n^{-1/2}).
      rigorous_support: >-
        The rigorous ingredient is the exact mean-yield identity of
        KN-FIND-007, which fixes the MEAN number of length-m words hitting
        a given target at C(B+m-1, m)/n independently of how the base is
        chosen, so no heuristic is needed for the first moment. The
        heuristic half is the second moment -- that a geometric progression
        has no additive structure beyond the random model -- and it imitates
        the classical statement that a multiplicative subgroup or coset of
        size B in Z/n has near-maximal sumset, the analogue of
        square-root cancellation in multiplicative character sums.
      random_model_justification: >-
        Comparison law: the balls-in-bins distribution of |F + F| for a
        uniformly random B-subset of Z/n. No smoothness law and no
        Dickman-de Bruijn statement is involved. At n = 167, B = 8 the
        closed-form mean is 167*(1 - (166/167)^36) = 32.47 and the maximum
        is C(9,2) = 36.
      validation_plan: >-
        SAMPLE: all primitive-root lambdas modulo n = 167 at B = 8 (82 of
        them), exact |F + F| per lambda, then 2000 uniformly random
        8-subsets at the same n. SHORTCUT MAKING SAMPLING FEASIBLE: none
        needed; the exponent arithmetic is modular and the group is
        enumerable, which is why the ladder can be swept exhaustively at
        small n. COMPARISON DISTRIBUTION: the empirical |F + F|
        distribution over lambdas against the empirical distribution over
        random subsets, compared by a two-sample Kolmogorov-Smirnov test,
        with the closed-form mean 32.47 as the anchor. TAIL CHECK: the
        smallest observed |F + F| over all lambdas against the smallest
        over an equal number of random subsets -- a real effect must move
        the whole distribution, not one lucky lambda. SAMPLED PARAMETERS
        RECORDED: p, n, P, lambda, B, seed per cell. TRANSFER ASSUMPTION,
        STATED: H1 is validated only at n = 167 and B <= 64 and its use at
        cryptographic n with B = n^{1/2} is an EXTRAPOLATION, labelled as
        one wherever it appears.
      falsification_condition: >-
        A family of lambdas whose |F + F| distribution is separated from
        the random-subset distribution at the 1 per cent level and whose
        separation GROWS with B. That would be additive structure in a
        geometric progression, would matter for coverage, and would be
        reported as such.
    - id: H2-IDEA-20260913-04fb8c
      statement: >-
        Certified window membership costs mu(B) = Theta(sqrt(B)) group
        operations for every declared strategy that does not read
        coordinates, and the constant is within a factor 4 of the kangaroo
        constant 2.
      rigorous_support: >-
        The rigorous ingredient is that window membership IS an instance of
        the discrete logarithm in an interval for the cyclic <lambda>-action
        -- given R, find i < B with [lambda^i]P = R -- so the generic lower
        bound quoted from KN-TECH-005 applies verbatim to any procedure
        that manipulates handles only, and the kangaroo upper bound
        2*sqrt(B) (recalled) matches it. The heuristic half is only that
        the declared strategy family contains a near-optimal member.
      random_model_justification: >-
        Comparison law: the measured certification cost on the matched
        random B-subset, where no index structure exists at all and
        certification necessarily costs Theta(B) by exhaustion -- so the
        elliptic cell is PREDICTED to be cheaper than the null here, and
        that is the one place the construction is allowed to beat its null
        without being an artifact. The artifact tell is instead a cell
        cheaper than sqrt(B).
      validation_plan: >-
        SAMPLE: 10^4 random points per (B, field size) cell, half of them
        planted inside the window and half outside, recording certified
        cost and correctness per strategy. COMPARISON DISTRIBUTION: the
        kangaroo prediction 2*sqrt(B) for the in-window half and the
        exhaustion bound B for the out-of-window half. TAIL CHECK: the
        minimum certified cost observed over all draws against the same
        minimum on the planted positive control. TRANSFER ASSUMPTION: the
        Theta(sqrt(B)) reading is validated for B <= 64 and n <= 2^26 only.
      falsification_condition: >-
        A declared non-coordinate-reading strategy certifying membership in
        o(sqrt(B)) on the elliptic cells. Either H2 is false or
        KN-TECH-005's bound is being misapplied, and separating those two
        is a further cheap check (re-run the identical strategy on the
        relabelled Z/nZ control).
  target_complexity:
    time_exponent: >-
      Predicted n^{1 + 1/(2*log_n B)} group operations, i.e. n*sqrt(B),
      which is at best Theta(n) at B = O(1) and grows with B. NO
      IMPROVEMENT IS CLAIMED. The conditional LEAD branch, uninhabited:
      if a declared strategy achieved mu(B) = polylog(n) then the total
      would be max(n/1 * polylog, B^2) minimised at B = n^{1/2} giving
      n^{1 + o(1)}, which is STILL worse than n^{1/2} -- so even the lead
      branch on mu alone does not move the exponent, and a genuine exponent
      move would additionally require SOLVED rather than searched
      decomposition. That is stated here rather than hidden.
    memory_exponent: >-
      O(B) group elements for the factor base plus the sparse relation
      matrix at O(B) rows of m nonzeros, i.e. O(B) = O(n^{1/2}) at the
      degenerate optimum -- the same memory as BSGS with none of its time.
      Kangaroo membership keeps per-test memory O(1); BSGS membership costs
      O(sqrt(B)) extra.
    best_known: >-
      Pollard rho with distinguished points at about 0.886*sqrt(n) group
      operations and O(1) memory per processor; BSGS at 2*sqrt(n) time and
      sqrt(n) memory; van Oorschot-Wiener parallel rho at sqrt(n)/m wall
      clock on m processors. Prime-field index calculus has no known
      advantage (KN-OPEN-001).
    best_known_comparator: >-
      Pollard rho; BSGS; van Oorschot-Wiener; IDEA-20260901-863e36's
      c_can cost law for the orbit-quotient family; KN-OPEN-020's
      bounded-degree scoped negative.
    hidden_overhead: >-
      No o(1) is claimed because no asymptotic improvement is claimed.
      What hides instead and is disclosed: (i) the constant in mu(B) and
      the kangaroo fruitless-step behaviour at small B; (ii) the
      requirement that lambda of the prescribed order exists, which depends
      on the factorisation of n-1 and is an instance-dependent
      precondition, not a free parameter; (iii) the sparse linear algebra
      constant, which at m = 2 nonzeros per row is small but is charged.
    tradeoff_note: >-
      The only tradeoff opened is inside membership: kangaroo at
      2*sqrt(B) time and O(1) memory versus BSGS at sqrt(B) time and
      sqrt(B) memory. The van Oorschot-Wiener interpolation applies to the
      baseline rho unchanged and is not improved here. Parallelisation:
      relation trials are embarrassingly parallel and the linear algebra is
      not, which is the usual index-calculus position and is recorded
      rather than claimed as an advantage.
    cost_model: >-
      One unit = one group operation on the frozen curve. Stage 0 is a few
      hundred F_151 operations plus exact modular arithmetic on 8-element
      exponent lists. established_exponent_gain = 0.
    data_query_cost: >-
      Every membership test and every relation trial is charged. No oracle
      queries and no preprocessing advice.
    established_exponent_gain: 0
  estimated_cost:
    implementation: medium
    compute: low
    proposal_task:
      maximum_runs: 0
      wall_clock_cap_seconds: 3600
      memory_cap_gb: 4
    future_test: >-
      Exact arithmetic on two frozen cells, then a B-ladder of certified
      membership measurements at three field sizes; hours, not days, of a
      single core.
    dominant_cost: >-
      The 10^4-draw certification sweeps at the largest field size.
  recommended_priority: medium
  proof_search_map:
    bottleneck: >-
      mu(B), the certified cost of deciding window membership and
      recovering the index from ONE point. Every cost statement in this
      record is a function of that one quantity, and a measurement that
      reports a guessed index rather than a certified one measures nothing.
    baseline_embedding:
      parameter_slice: >-
        B = n-1 with lambda a primitive root: the window becomes the whole
        group, membership is vacuous, and the construction degenerates to
        exhaustive enumeration at cost n. B = 1: the factor base is {P},
        the decomposition is the ECDLP itself, and the total charge is n.
        Both ends must be reproduced exactly by the cost formula
        max(n*mu(B), B^2).
      reproduction_check: >-
        Symbolic plus a frozen fixture: the implementation must return
        mu(n-1) = 0 certified operations (every point is in the window, and
        the index is what the box-DLP returns) and must return total = n at
        B = 1 without special-casing either end. A formula that does not
        reproduce both ends is not a cost model.
    observation_collision:
      observable: >-
        The pair (|F + F|, mu(B)) at given B.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, which is why the two frozen cells
        share everything but lambda. lambda = 5 and lambda = 23 have the
        same n, P, B and the same multiplicative order 166, and they
        differ in |F + F| (36 versus 28). Conversely a random 8-subset can
        achieve |F + F| = 36 while having mu = Theta(B), so |F + F| alone
        never identifies the object. The separating condition is the
        certified mu, and the code must assert it rather than infer it from
        the sumset.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "is there a small factor base" by "for which
          (description, membership) pair is there one, and at what charged
          membership cost". Encoding: exact, since the window index is a
          bijection onto {0..B-1} on F. Completeness: exact. Soundness:
          spent on the assumption that the declared strategy family
          contains a near-optimal member. Cost loss: the whole question is
          moved onto mu(B), which is measurable.
        predicted_gain: >-
          Converts KN-OPEN-020's implicit-membership class from a named
          open class into one measured number per B, and yields the
          box-DLP lower bound at zero compute.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable |F + F| fixed and vary the forgotten
          structure (the multiplier lambda versus a random subset). The
          intrinsic invariant distinguishing them is mu: the progression
          has an index and the random subset does not.
        predicted_gain: >-
          Identifies membership, not coverage, as the load-bearing
          quantity; the collision above is the falsifier of any claim based
          on coverage alone.
    quantifier_order: >-
      FOR ALL prime n, FOR ALL lambda in (Z/n)^* of order > B, FOR ALL
      B >= 1: THERE EXISTS a projection pi with image size B+1 such that
      FOR ALL R with pi(R) = i < B-1 we have pi([lambda]R) = i+1. The
      existential on pi is constructive and the universal on R is
      restricted to the sub-domain -- that restriction IS the partial
      action and writing the order down is what exposes it. The cost claim
      is weaker and is stated separately: FOR ALL generic certification
      procedures, mu(B) = Omega(sqrt(B)). THE READING NOT CLAIMED: "for all
      certification procedures", which the LEAD branch is allowed to
      refute.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "for the declared curves, window lengths B, multipliers
        lambda and strategy family, certified window membership costs
        [these numbers] against [these nulls], and no declared strategy
        achieved o(sqrt(B))". It can NEVER certify that no implicit
        membership procedure is cheap, because that is a statement about
        all procedures and the search is over a declared family; and it
        certifies nothing about the ECDLP.
      nearby_object_control: >-
        The object where the hoped-for conclusion FAILS is the window with
        lambda = 2 and P chosen so the window points are related by
        doublings: there the index is readable from a public doubling
        chain and membership is cheap for a reason that has nothing to do
        with factor bases. A pipeline that cannot see that case as cheap
        has not identified the load-bearing structure. The matched random
        B-subset is the control in the other direction, where membership
        must cost Theta(B).
    proof_obligations:
      - claim: >-
          #E = 167 on y^2 = x^3 + x + 3 over F_151, [167]P = O at
          P = (1,55), and the two exponent lists and point lists are
          correct.
        responsibility: baseline
      - claim: >-
          |F + F| = 36 for lambda = 5 and 28 for lambda = 23 at B = 8.
        responsibility: baseline
      - claim: >-
          pi propagates as i -> i+1 on i < B-1 with b = 1 and escapes at
          i = B-1, so the object is Class I and not a block system of
          <lambda>.
        responsibility: correctness
      - claim: >-
          Window membership is an interval discrete logarithm for the
          <lambda>-action, hence Omega(sqrt(B)) for generic procedures.
        responsibility: runtime
      - claim: >-
          Description, membership, relation, linear-algebra time and memory
          are all charged, and descent is excluded by design rather than by
          omission.
        responsibility: interface
      - claim: >-
          No transfer off the frozen cells and the declared ladder.
        responsibility: scope
    not_applicable_reason: null
