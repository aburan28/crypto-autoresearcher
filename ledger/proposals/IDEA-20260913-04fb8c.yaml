idea:
  id: IDEA-20260913-04fb8c
  title: >-
    Implicit-membership window factor base: the index inside a length-B
    lambda-orbit WINDOW as a partial-action object, priced by CERTIFIED
    INDEX RECOVERY rather than by orbit canonicalisation
  class: algorithm
  claim: >-
    Let E/F_p be ordinary with prime group order n, P a generator, and
    lambda in (Z/n)^* of large multiplicative order. Define the factor base
    F = {[lambda^i]P : 0 <= i < B} and the projection
    pi(R) = i if R = [lambda^i]P for some i < B, else the symbol bottom.
    Paired with Sigma = {[lambda]}, pi propagates deterministically as
    i -> i+1 on the sub-domain i < B-1 and LEAVES the window at i = B-1:
    a PARTIAL ACTION (Class I of IDEA-20260806-c5d183), not a block system
    of <lambda>, which is what separates this record from
    IDEA-20260901-863e36 and IDEA-20260826-506ba2. F has an O(log n)-BIT
    DESCRIPTION (the triple (P, lambda, B)) and therefore escapes the
    bounded-degree algebraic class of KN-OPEN-020 by being an
    IMPLICIT-MEMBERSHIP description. The claim is a charged cost law with
    two branches. (A) CLOSURE BRANCH, predicted: certified membership --
    given R, decide R in F and return i -- costs mu(B) = Theta(sqrt(B))
    group operations, because it is exactly a discrete logarithm in a box
    of size B for the cyclic action of <lambda>, so the generic lower bound
    of KN-TECH-005 applies to it as stated; arity-2 relation collection
    then costs (n/B) trials x mu(B) per relation x B relations = n*sqrt(B)
    group operations, which is >= n for every B >= 1 and therefore loses
    the exponent 1/2 against Pollard rho at 0.886*sqrt(n). (B) LEAD BRANCH,
    falsifiable: a declared membership strategy achieving mu(B) = o(sqrt(B))
    on lambda-progressions but NOT on a matched random B-subset, which is
    not forbidden by KN-TECH-005 because such a strategy reads coordinates
    and is non-generic. R3 class (a non-function representation: the point
    carried by its index in an auxiliary orbit rather than by a function of
    its coordinates); attack stage claimed changed: FACTOR-BASE MEMBERSHIP.
    No exponent improvement is claimed and none is established.
  mechanism: >-
    PAIR (representation, Sigma). Representation: the point R is carried by
    its WINDOW INDEX i relative to the auxiliary orbit {[lambda^i]P}. This
    is not a function of the affine coordinates of R and is not a curve
    model; in the R1/R2/R3 taxonomy of RQ-ECDLP-623a32 it is nearest to R3
    (non-function representations), and the honest caveat is recorded in
    interpretation_limits: R3's enumerated list does not contain
    "index relative to an auxiliary orbit", which is one instance of the
    gap KN-OPEN-019 and KN-OPEN-003 leave open. Operation set
    Sigma = {[lambda]}, multiplication by a fixed scalar of large order.
    TRICHOTOMY: CLASS I, PARTIAL ACTION. One-line reason: determinism is
    required only on the proper sub-domain {i : i < B-1} of a proper subset
    F of the group, and the object leaves its own domain at the top of the
    window; it is not deterministic on all of G under any h.

    LOSSY-PROJECTION TEST AGAINST Sigma = {[lambda]}. What is discarded:
    everything about R except its window index, including its coordinates,
    its model, and (for R outside F) its identity altogether. Lossy: the
    image has B+1 symbols, so the mean fibre size is n/(B+1) and
    L = log2(n/(B+1)) bits are discarded; at the frozen toy n = 167, B = 8
    this is L = log2(167/9) = 4.21 bits, and for cryptographic n with
    B = n^{1/2} it is (1/2)log2 n bits. Sigma-compatibility: the discard is
    compatible with [lambda] on the sub-domain -- [lambda] maps the fibre
    of i onto the fibre of i+1 exactly, with b = 1 -- and the compatibility
    FAILS at i = B-1, where the image is bottom. That failure is the
    partial-action defect and is the stated branching bound: b = 1
    everywhere on the domain, with an escape rate of exactly 1/B per
    Sigma-step. The window is deliberately NOT a block system of <lambda>:
    the block systems are the orbit partitions (IDEA-20260901-863e36 C1),
    and pricing those is that record's c_can. Here the priced number is
    different and the difference is computational, not cosmetic:
    canonicalising an orbit starts with the whole orbit IN HAND and
    minimises over it; certifying window membership starts with ONE point
    and must SEARCH for an unknown index. Those are different problems and
    only the second is a discrete logarithm.

    WHY THIS IS NOT A NINTH AFFINE-COORDINATE CALIBRATOR. The lens is not a
    function of (x, y) at all, Sigma is not {[2]}, and the object is Class I
    rather than coordinate-dependent. The eight Stage-0 calibrators of
    2026-09-13 (768066, 904d99, fa01b7, 1eb65c, 4efec0, 1c047d, d76b38,
    6011b8) all paired an R1 affine invariant with Sigma = {[2]} and all
    failed their key-free surrogate; none of them touched factor-base
    membership, and none of them had a cost law.

    OFF-LIMITS FAMILIES USED AS COMPONENTS, NAMED. F2 (factor-base
    decomposition) is the frame and is used as a component, not as the
    lens: what is added is the DESCRIPTION axis -- an O(log n)-bit implicit
    description in place of an algebraic locus -- together with the charge
    for membership, which the bounded-degree analysis of KN-OPEN-020 never
    has to pay because an algebraic predicate is evaluated rather than
    searched. F6 (endomorphism or automorphism orbit) supplies the orbit
    but is not the lens: lambda need not come from an endomorphism
    (IDEA-20260901-863e36 Stage 2), and the record deliberately uses a
    lambda of arbitrary provenance so that B is a free parameter instead of
    being pinned to |Aut(E)|. F1 is used only inside the membership
    strategies (kangaroo in a box) and inside the matched controls.

    FACTOR-BASE ESCAPE, DECLARED. F belongs to the IMPLICIT-MEMBERSHIP open
    class of KN-OPEN-020. Charges, end to end, for arity m and window B:
    description O(log n) bits; membership mu(B) group operations per test;
    relation trial cost (m-1) scalar multiplications plus one membership
    test; decomposition success probability per trial B/n by the
    conservation identity KN-FIND-007 in its mean form; relations needed
    B + O(1); sparse linear algebra O(B^2) field operations at m nonzeros
    per row; descent NOT USED and therefore not charged. Total for m = 2:
    max(B * (n/B) * mu(B), B^2) = max(n*mu(B), B^2). With the predicted
    mu(B) = Theta(sqrt(B)) the first term is n*sqrt(B) >= n at every B, so
    the optimum is the degenerate B = 1 and the family is closed by cost,
    not by taste.

    STAGE-0 IDENTITIES (independently computed by this session with exact
    integer arithmetic; recomputable by hand). Frozen toy: p = 151, A = 1,
    B_curve = 3, curve y^2 = x^3 + x + 3 over F_151, #E = n = 167 prime
    (verified [167]P = O), P = (1, 55), j = 72 which is neither 0 nor
    1728 mod 151 = 67. Multiplier lambda = 5 has multiplicative order 166
    = n-1 modulo 167; exponents (5^i mod 167, i = 0..7) =
    (1, 5, 25, 125, 124, 119, 94, 136); the eight factor-base points are
    (1,55), (57,60), (35,123), (82,150), (102,38), (30,149), (122,54),
    (47,102). REAL VALUE: |F + F| = 36 = C(9, 2) EXACTLY, i.e. the
    pair-sum set is as large as the arity-2 count allows and the
    progression has no additive coincidence at B = 8. SECOND FROZEN CELL:
    lambda = 23, also of order 166, exponents
    (1, 23, 28, 143, 116, 163, 75, 55), points (1,55), (107,111),
    (142,110), (40,87), (133,93), (125,81), (22,42), (84,95), REAL VALUE
    |F + F| = 28, i.e. eight coincidences. The two cells share n, P and B
    and differ only in lambda, which is what makes the pair a
    discriminating calibrator rather than a single number.
