idea:
  id: IDEA-20260811-df6c0f
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  title: >-
    "SPECIAL j" HAS TWO INEQUIVALENT MEANINGS IN THIS LANE AND THEY ARE DISJOINT
    - five of the six Semaev degeneration j-values are NON-INTEGRAL RATIONALS
    (55296/5, 55296/59, 27648/25, 221184/47, 110592/19), hence not algebraic
    integers, hence NOT CM j-invariants, and the sixth (-13824) is an integer
    absent from the thirteen rational CM j-invariants; therefore the ALGEBRAIC
    divisor of RQ-JINV-8fc13a and its ARITHMETIC divisor meet only at j = 0 and
    j = 1728, the lane's question splits in two, and every proposal in it must
    say which half it is about
  class: mechanism

  object: >-
    OBJ-DIVPAIR, the pair of divisors on the j-line that this research question
    has been silently treating as one. DIV-A (arithmetic): the CM locus - the j
    that are roots of a Hilbert class polynomial of small |D_0|, a set of
    algebraic integers, finite over Q at each discriminant, thirteen rational
    members in total. DIV-S (algebraic): the Semaev degeneration divisor
    catalogued in IDEA-20260811-a7c1df, a set of rational numbers determined by
    the weight-12 coefficient factors of S_m. The tracked object is the
    INTERSECTION, and the claim is that it is exactly {0, 1728}.

  resource: >-
    R2 (curve equation) versus R3 (End(E) as a ring). The point of the record is
    that RQ-JINV-8fc13a's own scope line names BOTH resources - "R2 curve
    equation and model, R3 End(E) as a ring" - and the lane has been treating
    them as one axis. The record separates them. H-ENDO-001 admissibility: no
    endomorphism is applied to any point of G; indeed the conclusion is that the
    algebraic half of the lane has nothing to do with End(E) at all.

  claim: >-
    (A) THE RIGOROUS HALF, WHICH NEEDS NO COMPUTE. A CM j-invariant is an
    algebraic integer. This is classical: for an elliptic curve over C with
    complex multiplication by an order O in an imaginary quadratic field, j(E) is
    an algebraic integer of degree h(O) over Q, and the rational ones are exactly
    the thirteen values arising from the thirteen class-number-one orders. From
    IDEA-20260811-a7c1df the six weight-12 loci carry the char-0 j-values
        55296/5, 55296/59, 27648/25, 221184/47, -13824, 110592/19.
    FIVE OF THESE ARE NON-INTEGRAL RATIONALS - their denominators 5, 59, 25, 47,
    19 do not divide their numerators, which is one exact division each to
    verify - so they are rational numbers that are not rational integers, hence
    not algebraic integers, hence NOT CM j-invariants. NO COMPUTATION BEYOND FIVE
    DIVISIBILITY TESTS IS REQUIRED, and the conclusion is a theorem, not a
    measurement.
    (B) THE SIXTH, WHICH NEEDS A TABLE LOOKUP AND NOTHING MORE. -13824 is an
    integer, so the integrality argument does not apply. It must be compared
    against the thirteen rational CM j-invariants, which are a fixed published
    list. PREDICTION, PRE-REGISTERED: -13824 is NOT on that list, so all six
    degeneration j are non-CM in characteristic zero. The check is a lookup
    against a cited table and must be performed rather than asserted from memory;
    this record does not reproduce the list, because reproducing a numeric table
    from memory is exactly the fabrication risk AGENTS.md rule 9 forbids.
    (C) THE STRUCTURAL CONSEQUENCE. DIV-S and DIV-A intersect only in
    {0, 1728} - the two points where the coefficient factor is a or b rather than
    a weight-12 form, and which are also the only two CM points with extra
    automorphisms. So the lane's title question, "do special j-invariants confer
    any advantage", is TWO questions:
      Q-ARITH: does small |D_0| / CM structure confer an advantage? Answer so far:
        only the automorphism discount, a constant at most sqrt(6) (KN-TECH-018),
        with H-ENDO-001 explaining why nothing more is available on a
        prime-order subgroup.
      Q-ALG: does a degeneration of the summation polynomials confer an
        advantage? UNTOUCHED by every existing record in this lane, because every
        existing record is about Q-ARITH or about j = 0 / j = 1728, which is the
        intersection.
    (D) THE PRACTICAL BITE, IN CHARACTERISTIC p. Over F_p, a non-CM char-0 j
    still reduces to a curve with SOME endomorphism order - every ordinary curve
    over a finite field has CM by an order in an imaginary quadratic field. So
    (A) does not say the reduced curves lack CM; it says their CM order is NOT
    FORCED by the degeneration condition and should look arithmetically generic.
    That is a prediction with a distribution attached and it is tested at scale
    in IDEA-20260811-6c893b. THE TWO OUTCOMES DISCRIMINATE CLEANLY: if the
    reductions look arithmetically generic, DIV-S carries no arithmetic content
    and the two halves of the lane are genuinely independent; if they do not -
    if, say, the special-j curves systematically have unusually small |D_0| at
    many p - then the two divisors are secretly coupled and the lane has a real
    structural finding.

  mechanism: >-
    Two entirely different mechanisms produce the two divisors, and that is why
    they are disjoint. DIV-A is produced by the ARITHMETIC of the endomorphism
    ring: j lies on it because the curve has extra endomorphisms, a condition on
    End(E) that is invisible to the equation's coefficient pattern. DIV-S is
    produced by the COMBINATORICS of a resultant tower: j lies on it because a
    block of coefficients of an iterated resultant of the curve's addition law
    happens to share a weighted-homogeneous factor, a condition on QQ[a,b] that
    never mentions the endomorphism ring, the trace, or any isogeny -
    DEC-20260810-d70ece states exactly this for the a^3 + 8b^2 case ("THE
    CONDITION NEVER MENTIONS THE TRACE OR ANY ISOGENY"). Nothing forces the two
    to interact, and the integrality obstruction shows they do not, except at the
    two points where the group of automorphisms enlarges and both mechanisms fire
    for the same reason.

  novelty_status: adaptation
  novelty_note: >-
    Integrality of CM j-invariants and the thirteen rational values are classical
    and are not claimed as new. The ADAPTATION is using them as a disjointness
    obstruction between two divisors this program has been conflating, and the
    input - the six char-0 values - is derived in IDEA-20260811-a7c1df from a
    committed but unreplicated stratification (VAL-20260810-dc8bd8). Corpus grep:
    no record in ledger/ or knowledge/ discusses the CM status of the S_4
    degeneration loci; the six values appear only as F_4001 residues in
    EV-ICINV-6b6264, DEC-20260810-d70ece, GOAL-ENDO-001/goal.yaml and the
    validation report, where their char-0 lifts are not computed. External
    literature NOT checked for prior discussion of summation-polynomial
    degeneration loci.
  not_a_duplicate_of: >-
    NOT IDEA-20260807-778375 (what small |D_0| makes cheap) and NOT
    IDEA-20260807-51675e (the nine-square-test audit): both are entirely inside
    Q-ARITH and neither knows DIV-S exists. NOT IDEA-20260807-94f953 (h(D_0) = 1
    craters), same. NOT IDEA-20260811-a7c1df, which catalogues DIV-S and says
    nothing about CM.

  assumptions:
  - >-
    The six char-0 values are as derived in IDEA-20260811-a7c1df. Five of them
    were cross-checked by hand there against the committed F_4001 residues and
    all five matched; the minimal test re-derives all six symbolically before
    the CM argument is applied.
  - >-
    The classical theorem that CM j-invariants are algebraic integers, and the
    standard list of thirteen rational CM j-invariants, are used as cited
    external results. Both must be cited to a specific source in the run record;
    neither may be reproduced from memory.
  - >-
    Nothing here asserts that the REDUCTIONS mod p are non-CM. Every ordinary
    curve over F_p has CM by an order; the claim is about characteristic zero.

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the theorem is the integrality obstruction.
      Without it there is no cheap way to decide whether an arbitrary rational j
      is a CM j-invariant, and the disjointness claim would need class-polynomial
      computations at every discriminant.
    baseline_embedding:
      parameter_slice: >-
        j = 0 and j = 1728 are the exact boundary of the claim: they lie in BOTH
        divisors, and the method must place them there rather than exclude them.
        0 and 1728 are integers and are the first two entries of the rational CM
        list, so the method returns "CM" for both, as required.
      reproduction_check: >-
        Symbolic: apply the same integrality test to the thirteen rational CM
        j-invariants and confirm it returns "possibly CM" for all thirteen
        (necessary condition satisfied), and to a list of random non-integral
        rationals and confirm it returns "not CM" for all of them.
    observation_collision:
      observable: >-
        The rational number j, taken as an element of Q.
      distinct_preimage_search: >-
        PERFORMED. The observable j has infinitely many preimages over F_p for
        each p (the whole weighted orbit and its twist) but exactly one over Q up
        to isomorphism, so there is no collision that threatens the char-0
        argument. THE COLLISION THAT DOES THREATEN IT IS REDUCTION: distinct
        char-0 j can reduce to the same F_p value, and a non-CM char-0 curve
        reduces to an ordinary curve WITH CM. That collision is exactly why (D)
        is stated as a separate, weaker, distributional claim and is delegated to
        IDEA-20260811-6c893b instead of being asserted here.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Move the question "is this j special in the CM sense" into the exact
        equality condition "is this rational number an algebraic integer", where
        it becomes a single divisibility test rather than a class-polynomial
        computation.
      predicted_gain: >-
        Reduces an apparently open comparison to five exact divisions and one
        table lookup, i.e. from unbounded to O(1). The encoding obligation
        (integrality is necessary for CM) is classical; the soundness obligation
        (it is not sufficient) is discharged by handling -13824 separately.
    quantifier_order: >-
      FOR ALL j in DIV-S with j not in {0, 1728}, j is not a CM j-invariant over
      Q. There is no existential witness the attacker may choose: the six values
      are fixed by the polynomial recursion before any curve, prime, or instance
      is named. That total absence of an adversary-chosen quantifier is what
      makes the statement a clean structural fact rather than a design constraint.
    method_ceiling:
      strongest_certifiable_claim: >-
        That DIV-S and DIV-A are disjoint outside {0, 1728} IN CHARACTERISTIC
        ZERO, for m <= 4. It CANNOT certify anything about the reductions mod p,
        which is the case that actually matters for ECDLP, and it cannot extend
        to m = 5 until Div(S_5) is computed.
      nearby_object_control: >-
        The closest object where the desired conclusion fails is j = 0: it is in
        both divisors, it has non-trivial automorphisms, and it IS a
        class-number-one CM point. A method that returned "non-CM" for j = 0
        would be broken, and the baseline embedding checks exactly that.
    proof_obligations:
    - claim: Five of six degeneration j are non-integral rationals
      responsibility: correctness
    - claim: -13824 is not a rational CM j-invariant
      responsibility: correctness
    - claim: CM j-invariants are algebraic integers
      responsibility: baseline
    - claim: The conclusion does not extend to reductions mod p
      responsibility: scope

  predictions:
  - metric: integrality_of_the_six_char0_j
    direction: different
    minimum_effect: >-
      EXACTLY FIVE of the six are non-integral: denominators 5, 59, 25, 47, 19
      each fail to divide the corresponding numerator. Six of six integral, or
      four of six, falsifies either this record or the char-0 dictionary.
  - metric: cm_membership_of_minus_13824
    direction: different
    minimum_effect: >-
      NOT a member of the thirteen rational CM j-invariants. Membership would
      make DIV-S meet DIV-A at a third point and would be a genuinely surprising
      structural coincidence deserving its own record.
  - metric: intersection_size_of_DIVS_and_DIVA_over_Q
    direction: different
    minimum_effect: >-
      EXACTLY 2, namely {0, 1728}, for m <= 4.
  - metric: baseline_integrality_of_the_thirteen_rational_CM_j
    direction: different
    minimum_effect: >-
      THIRTEEN of thirteen integral. A failure here means the cited list or the
      test is wrong and blocks the whole record.

  minimal_test:
    design: >-
      THE CHEAPEST PROPOSAL IN THIS BATCH BY AN ORDER OF MAGNITUDE. (1) Re-derive
      the six char-0 j symbolically from the weight-12 factors, over QQ, in two
      independent computer-algebra systems. (2) Test integrality: exact rational
      arithmetic, report numerator and denominator in lowest terms for each. (3)
      Cite a specific published source for the classical theorem that CM
      j-invariants are algebraic integers and for the list of thirteen rational
      CM j-invariants; record the citation with page or theorem number and mark
      it verified or unverified honestly. (4) Look up -13824 in that list. (5)
      Run the baseline and null checks below. Total compute: seconds. Total
      implementation: a few dozen lines.
    controls:
    - >-
      C-BASELINE-CM. Apply the integrality test to the thirteen rational CM
      j-invariants and to j = 0, 1728; all must pass the necessary condition. A
      test that rejects a known CM value is broken.
    - >-
      C-NULL-RATIONAL. The null object of the same shape: twenty rationals of the
      form 1728*(-4b)/(27a - 4b) for random small integer (a,b) - i.e. values
      that WOULD be degeneration j if the corresponding weight-12 form appeared
      in some S_m. Predicted: essentially all non-integral, and none in the CM
      list. This establishes that non-CM-ness is the GENERIC property of a
      weight-12 locus, so the finding is "the six are generic in this respect",
      not "the six are special in this respect" - a distinction that would
      otherwise be over-read.
    - >-
      C-SOURCE. Every external fact is bound to a citation with an identifier;
      the run record must state for each whether the source was actually opened
      and read in the run, or taken from a secondary reference. An unverified
      citation is recorded as unverified.
    required_metrics:
    - numerator_and_denominator_in_lowest_terms_per_char0_j
    - integrality_boolean_per_char0_j
    - cm_list_membership_boolean_per_char0_j
    - baseline_thirteen_integrality_pass_count
    - null_rational_integrality_and_cm_counts
    - citation_verification_status_per_external_fact

  lossy_projection_answer: >-
    The projection is curve-over-Q -> j in Q, then j -> "is an algebraic
    integer". The first arrow is the classical moduli map and is lossy (it
    forgets the twist and the model) yet compatible, since isomorphism over the
    algebraic closure preserves j exactly. The SECOND arrow is where the record
    earns its keep: integrality is a lossy Boolean shadow of j that is
    nonetheless a complete obstruction in one direction - non-integral implies
    non-CM, always, with no exceptions and no heuristic. That is the rare case of
    a projection that loses almost everything and still decides the question,
    which is the opposite of the lane's committed failure mode where a 30.8%
    support drop decided nothing. Stated bluntly: this record is cheap BECAUSE
    its projection is drastic, and it works only because the implication runs the
    safe way.

  t5_reachability_answer: >-
    NOT ENGAGED. This record names no cost minimiser and proposes no walk. Its
    output is a partition of the lane's question into two independent halves. The
    reachability of DIV-S is answered in IDEA-20260811-3e08e0; the reachability
    of DIV-A is already answered by T4 (you cannot walk to j = 0 unless
    D_0 = -3).

  null_object: >-
    C-NULL-RATIONAL above: twenty random weight-12 j-values of the same shape,
    put through the identical integrality and CM-lookup pipeline. This is the
    control that prevents the record from over-reading a generic property as a
    special one.

  falsification_conditions:
  - >-
    Any of the five predicted non-integral values turns out to be an integer.
    Either the char-0 dictionary or this record's arithmetic is wrong; both are
    re-derived and the record is superseded.
  - >-
    -13824 IS a rational CM j-invariant. DIV-S meets DIV-A at a third point, the
    disjointness claim is false as stated, and the coincidence needs its own
    investigation - a genuinely interesting outcome that this record would
    welcome and must not suppress.
  - >-
    The baseline test rejects any of the thirteen known rational CM j-invariants.
    The instrument or the cited list is wrong and nothing is admissible.
  - >-
    A second weight-12 factor is found at m = 4 that was missed by the committed
    stratification and whose j IS a CM value. The intersection is larger and the
    record's scope statement is wrong.

  confounders:
  - >-
    Reduction mod p is NOT covered. Over F_p every ordinary curve has CM, and a
    non-CM char-0 curve can reduce to a curve with small |D_0| at particular p.
    Reading (A) as "special-j curves over F_p have no CM" would be a serious
    misreading and the record states the boundary explicitly.
  - >-
    Sufficiency. Integrality is necessary but not sufficient for CM; that is why
    -13824 needs the list rather than the test, and why the record does not claim
    a general algorithm for deciding CM-ness of a rational.
  - >-
    Higher m. Div(S_5) may contain integral values; the disjointness claim is
    scoped to m <= 4 and must be re-run when Div(S_5) is known.

  interpretation_limits:
  - >-
    This is a characteristic-zero statement about two sets of numbers. It changes
    no cost, moves no exponent, and bears on no isogeny class.
  - >-
    It does NOT say that the algebraic half of the lane is more promising than
    the arithmetic half. It says they are different questions. The algebraic half
    is currently closed on reachability by IDEA-20260811-3e08e0 and on cost by
    the predicted outcome of IDEA-20260811-97e244; the arithmetic half is closed
    at sqrt(6) by KN-TECH-018 and H-ENDO-001.
  - >-
    claim_tier toy, and in fact this record produces no experimental claim at
    all - its content is a derivation plus two citations.

  heuristic_assumptions:
  - id: H1
    statement: >-
      NO HEURISTIC IS LOAD-BEARING. Both limbs are theorems plus exact rational
      arithmetic. This record is included in the batch specifically because it is
      the one proposal whose conclusion does not depend on any distributional
      assumption.
    rigorous_support: >-
      Integrality of CM j-invariants (classical, to be cited precisely) and exact
      rational arithmetic.
    validation_plan: >-
      Validation is by independent recomputation in two computer-algebra systems
      and by the C-BASELINE-CM check on the thirteen known values. No sampling,
      no distribution comparison, no tail check applies, and the record says so
      rather than inventing one.
  - id: H2
    statement: >-
      The reductions mod p of the six non-CM char-0 curves have Frobenius
      discriminants distributed as for a generic non-CM curve.
    rigorous_support: >-
      The Sato-Tate theorem for non-CM elliptic curves over Q, whose hypothesis
      is exactly the non-CM conclusion of limb (A) - so H2 is a CONSEQUENCE of
      this record's own result plus a cited theorem, not an independent guess.
    validation_plan: >-
      Delegated in full to IDEA-20260811-6c893b: sample the twelve special-j
      traces over all primes in a stated range, compare the normalised traces
      against the Sato-Tate semicircle by Kolmogorov-Smirnov, and check the tail
      (extreme normalised traces near +-1) against the semicircle's own extreme
      probabilities. Sampled parameters and transfer assumptions are recorded
      there, not here.

  target_complexity:
    time_exponent: NONE CLAIMED.
    memory_exponent: NONE CLAIMED.
    best_known: >-
      0.886*sqrt(N) group operations, O(1) memory (KN-TECH-001, KN-TECH-006);
      automorphism-discounted on CM curves (KN-TECH-018).
    hidden_overhead: Not applicable.
    tradeoff_note: Not applicable.

  dominated_by: >-
    n/a as an attack (no result claimed on the attack frontier); as a
    contribution it is dominated by nothing because it competes with nothing -
    it is a classification. On the cost frontier every row (rho, BSGS, kangaroo,
    index calculus) dominates trivially, as this record produces no solver.
  sota_delta: >-
    ZERO. No attack; conceptual and taxonomic contribution only.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  expected_value: >-
    HIGHEST INFORMATION PER UNIT COST IN THE BATCH, AND THE ONLY ONE WHOSE
    CONCLUSION IS A THEOREM. It costs minutes and it reorganises the lane: after
    it, no proposal in RQ-JINV-8fc13a can say "special j" without saying which
    divisor it means, and the campaign stops silently importing CM intuitions
    into an algebraic question. Its risk is that it is TOO cheap to feel like a
    result; the honest framing is that it is a taxonomy repair with a rigorous
    core, not a discovery. If only one proposal from this batch is run, run
    IDEA-20260811-a7c1df; if two, run this one second, because it is nearly free
    and it changes how everything else is read.
