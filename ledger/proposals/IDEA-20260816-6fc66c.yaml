idea:
  id: IDEA-20260816-6fc66c
  question_id: RQ-ALR-001
  added: '2026-08-16'
  title: Compute the monomial support and total degree of the compact target-divisor resultant symbolically
    at toy sizes before any solve, and compare its Newton polytope vertex set against the generic
    Minkowski-sum prediction that a random pair of the same bidegrees produces in the same invocation
  class: measurement
  claim: '(A) H-ALR-001 asserts an exact gcd-equivalent subresultant interface, with Norm(R_P) = Res(W,
    R_P) = 0 detecting nonunits. The resultant is therefore the object the whole compact route is
    built on, yet no ALR record states its degree in the target interpolant coefficients or how many
    monomials it actually carries. Those two numbers are computable symbolically, cost essentially
    nothing, and bound every downstream cost, so computing them before any solve is the cheapest available
    discipline. (B) The measurable is the support of Res_v(W, K_P) regarded as a polynomial in the
    coefficients of the target interpolant V_T: its total degree, its number of monomials, and the
    vertex set of its Newton polytope. (C) For a generic pair of polynomials of the same bidegrees,
    the resultant''s Newton polytope is predicted by the mixed-fiber construction and its support
    is essentially full. The claim under test is that the elliptic pair, whose K_P = A_P + v*B_P is
    affine in v and whose W is squarefree with the chart structure H-ALR-001 records, produces a strictly
    smaller vertex set at matched degrees. (D) Sparsity here is a compactness statement with teeth:
    if the resultant has s monomials rather than the generic count, then the represented object needed
    to build it is s field elements, not the full coefficient array, and s becomes the second size
    formula the lane needs. (E) NOT CLAIMED: no attack, no speedup, no assertion that a sparse resultant
    can be evaluated quickly, no claim about what the published literature says about resultant polytopes,
    and no claim that sparsity transfers beyond the tested degrees. A vertex count is a description
    of a polynomial, and a sparse polynomial can still be expensive to construct; the entry measures
    the object and explicitly declines to price its construction.'
  mechanism: 'STAGE 1, build the pair symbolically. On one x-injective chart, form W as a squarefree
    monic of degree N with symbolic coefficients and K_P = A_P + v*B_P with symbolic A_P and B_P of
    the stated degrees, using the R181 signed chart conventions H-ALR-001 names. STAGE 2, compute
    Res_v(W, K_P) exactly over a toy prime field with sympy, at N = 2, 3, 4, 5, 6, 7, 8 and at both
    chart counts. STAGE 3, extract the support as an exponent-vector set, count monomials, compute
    total degree, and compute the Newton polytope vertex set by convex hull over the exponent vectors.
    STAGE 4, in the same invocation, build the null pair: two polynomials of identical bidegrees with
    independent uniformly random coefficients over the same field, compute their resultant, and extract
    the identical three quantities. STAGE 5, compare vertex sets and monomial counts arm to arm at
    each N and report the ratio s_elliptic over s_null as a curve in N. STAGE 6, check the structural
    tell required by the protocol: sparsity that does not decay as N grows is the signature to look
    for, and sparsity that vanishes at N = 3 but reappears at N = 7 is the signature of a cancellation
    artifact rather than structure, so the curve is read for monotonicity and not only for its endpoint.
    The claim is established by a persistent gap and refuted by arms that coincide.'
  novelty_status: unverified
  novelty_screen:
    method: 'Greps run: grep -ril ''Newton polytope'' ledger/proposals/ (6 hits, titles resolved for
      IDEA-20260811-97e244 and IDEA-20260811-34f29d); grep -ril ''resultant'' ledger/proposals/ (30
      hits, titles listed); grep -ril ''subresultant'' ledger/proposals/ (1 hit, IDEA-20260808-da1428,
      resolved). Read in full ledger/questions/RQ-ALR-001.yaml, ledger/hypotheses/H-ALR-001.yaml,
      ledger/evidence/EV-ALR-001.yaml, knowledge/open-problems/KN-OPEN-007.md, and docs/inventor-protocol.md
      sections 1 to 5.'
    results: 'IDEA-20260811-97e244 under RQ-JINV-8fc13a is the closest record found: it argues for
      measuring the Newton polytope rather than the support, on the grounds that a support drop moves
      a cost functional only if it removes a polytope vertex. That record''s object is the Semaev
      polynomial on the j-line degeneration loci. IDEA-20260811-34f29d, same question, measures the
      singular locus of the Semaev hypersurface. IDEA-20260808-da1428 is the only subresultant hit
      and concerns hybrid guess-and-determine optima under RQ-SDEG-001. No record under ledger/proposals/
      mentions the target-divisor resultant Res(W, R_P) of H-ALR-001, and RQ-ALR-001 carries zero
      proposals.'
    verdict: 'UNVERIFIED. Nothing is asserted about external literature. Assembled from known parts:
      the vertex-versus-support distinction is taken directly from IDEA-20260811-97e244 and is named
      as such; exact symbolic resultants over toy prime fields are ordinary sympy work. Claimed new
      only as the object: the polytope of the ALR target-divisor resultant in the target interpolant
      coefficients, with a matched random-pair null in the same invocation, which no record in this
      repository measures.'
  object_first_candidate:
    tracked_object: The exponent-vector set of Res_v(W, K_P) viewed as a polynomial in the coefficients
      of the target interpolant V_T, and specifically the vertex set of its convex hull. The object
      followed through the computation is which monomials occur, never their coefficient values.
    lossiness: 'The projection discards every coefficient value and keeps only the exponent vectors
      that occur, and then discards all non-vertex exponent vectors as well. It is doubly lossy: the
      resultant cannot be evaluated, factored, or set to zero from its polytope, and two resultants
      with the same polytope can have entirely different zero sets. It still propagates because the
      support of a product is contained in the Minkowski sum of supports and the support of a resultant
      is governed combinatorially by the input supports, so a support bound moves forward through
      the construction deterministically even though the values do not.'
    propagation: 'One step of the target operation, eliminating v between W and K_P on a chart, acts
      on exponent-vector sets by the mixed-fiber rule: the Newton polytope of the resultant of the
      pair is the mixed fiber polytope of their individual polytopes, so a step maps a pair of polytopes
      to a single polytope by a deterministic combinatorial construction. Cancellation over F_p can
      only shrink the support relative to that prediction, never grow it, so the propagation is one-sided
      and the gap between prediction and measurement is exactly the quantity of interest.'
    survival_score: Sparsity survives as long as cancellation keeps pace with the mixed-fiber growth.
      Concretely the entry reports the largest N at which the measured vertex count is strictly below
      the null arm's vertex count by more than the reported tolerance, and states the N at which the
      two curves meet. If the arms coincide already at N = 3 the structure never existed; if the gap
      is still open at N = 8 the entry reports survival to the edge of the tested range and refuses
      to extrapolate past it.
  null_object_control: 'In the same invocation, compute the resultant of a pair of polynomials with
    independent uniformly random coefficients over the same F_p and identical bidegrees to the elliptic
    pair, extract the identical support, degree and vertex-set quantities, and compare. Here the null
    must DIFFER: it must exhibit the generic, essentially full vertex set predicted by the mixed-fiber
    construction. If the random arm is also sparse, the sparsity is an artifact of the small toy field,
    of the resultant routine, or of the bidegrees, not of the elliptic object, and no signal may be
    recorded. A second null at a larger toy prime separates small-field cancellation from structure.'
  discriminated_from:
  - IDEA-20260811-97e244 measures the Newton polytope of Semaev polynomials at j-line degeneration
    loci under RQ-JINV-8fc13a; this entry measures a different polynomial, the target-divisor resultant
    of H-ALR-001, in different variables, the target interpolant coefficients, and the shared idea
    is only the vertex-versus-support methodology, which is cited rather than reinvented.
  - IDEA-20260811-34f29d measures a singular locus rather than a polytope and concerns the Semaev
    hypersurface, not a resultant in interpolant coefficients.
  - 'The blacklisted Semaev degree-growth re-derivations: nothing here computes a summation-polynomial
    degree or a degree of regularity, and the polynomial studied is not a Semaev polynomial.'
  - KN-OPEN-007, which asks about bond ranks of the recursive Semaev resultant tree; this entry asks
    about the support of a single non-Semaev resultant, and does not measure any rank.
  - EV-ALR-001, which records that all 2,962 ordinary remainder coefficient slots are nonzero; that
    is a density statement about the remainder, not about the resultant, and the two can disagree,
    which is itself part of what the run reports.
  assumptions:
  - K_P is affine in the eliminated variable v, as the R181 signed kernel form A_P + v*B_P states.
  - W is squarefree on each chart and the chart count is at most two, as H-ALR-001 records for elliptic
    x-fibers.
  - Exact symbolic computation over a toy prime field is faithful, so a monomial reported absent is
    absent rather than lost to a coefficient-domain shortcut.
  - The toy prime is large enough relative to the degrees that accidental cancellation mod p is rare,
    which the second-prime null control tests rather than assumes.
  - Convex hull over exponent vectors is computed exactly in integer arithmetic.
  predictions:
  - metric: vertex_count_ratio_elliptic_over_random_at_matched_bidegree
    direction: lower
    minimum_effect: 0.6
  - metric: monomial_count_ratio_elliptic_over_random
    direction: lower
    minimum_effect: 0.8
  - metric: total_degree_of_resultant_in_target_interpolant_coefficients
    direction: different
    minimum_effect: 'refuse to pre-commit: the total degree is forced by the bidegrees through the
      standard resultant degree bound and is therefore a check on the implementation rather than a
      prediction about the object'
  - metric: largest_N_at_which_vertex_gap_persists
    direction: different
    minimum_effect: 5
  minimal_test:
    design: A single sympy script under three hundred lines. For each N in 2 to 8 it builds W as a
      symbolic squarefree monic of degree N over a toy prime, builds K_P = A_P + v*B_P with symbolic
      coefficients, computes the resultant in v exactly, collects the exponent vectors of the result
      in the target interpolant coefficient variables, and reports monomial count, total degree, and
      convex hull vertex count. In the same run it builds a random pair of identical bidegrees and
      repeats every step verbatim, then prints the two rows adjacently per N. Thirty random draws
      per cell give a null distribution rather than a single null value. The whole sweep is minutes
      of CPU at N up to 6 and is expected to become the binding cost near N = 8, which is why the
      sweep is monotone in N with a wall-clock stop. It discriminates because the two arms are computed
      by the same code path on the same day, so any sparsity common to both is instrument, not object.
    controls:
    - Random-coefficient pair of identical bidegrees, same invocation, thirty draws per cell.
    - Second toy prime at every cell, separating cancellation mod p from structural sparsity.
    - 'Degree-bound check: the measured total degree must match the standard resultant degree bound,
      or the implementation is wrong before anything is interpreted.'
    - 'Chart-count control: run at one chart and at two charts, since H-ALR-001 records that opposite
      points force a second x-injective chart.'
    - 'Permutation control: randomly permute the roots of W and confirm the support is invariant,
      since the object should not depend on root ordering.'
    required_metrics:
    - resultant_monomial_count
    - resultant_total_degree
    - newton_polytope_vertex_count
    - null_arm_vertex_count_distribution
    - vertex_count_ratio_elliptic_over_random
    - largest_N_with_persistent_gap
    - second_prime_agreement_rate
  falsification_conditions:
  - The random arm shows the same vertex count as the elliptic arm at every N, so there is no object-specific
    sparsity.
  - The measured total degree disagrees with the standard resultant degree bound, indicating an implementation
    fault that voids all support numbers.
  - The gap between arms closes at N = 3 or 4, so any sparsity is confined to degenerately small cases.
  - The support changes when the roots of W are permuted, showing the measurement depends on presentation
    rather than object.
  - The two toy primes disagree on which monomials are absent, showing the sparsity is characteristic-dependent
    cancellation.
  - The sweep cannot reach N = 5 within the wall-clock budget, in which case the run reports an instrument
    limit and not a mathematical result.
  confounders:
  - Small-field cancellation producing apparent sparsity that would vanish over a larger field, addressed
    but not eliminated by the second-prime control.
  - The symbolic routine's internal normalisation dropping terms that are structurally present, which
    the degree-bound check bounds but does not fully exclude.
  - Choosing symbolic coefficients with hidden algebraic relations, for example reusing one symbol
    across A_P and B_P, which would manufacture cancellation.
  - Bidegree matching between arms being only nominal if the random pair is not also affine in v,
    which would compare different constructions.
  - Vertex counting being sensitive to degenerate hulls in low dimension, where many exponent vectors
    are collinear.
  interpretation_limits:
  - A sparse resultant is not a fast resultant; nothing here prices construction or evaluation.
  - All numbers are scoped to N <= 8 on toy primes and to the chart conventions H-ALR-001 records.
  - A persistent gap is a description of an object, not evidence that any solver exploits it.
  - No claim is made about resultant polytopes in general, only about the measured pair at the measured
    degrees.
  target_complexity:
    time_exponent: No attack exponent is claimed. The entry reports the symbolic cost of computing
      the resultant at each N as an observed wall-clock and monomial count, explicitly labelled an
      implementation-bound proxy in the same spirit as the honesty note in harness/semaev.py.
    memory_exponent: No memory exponent is claimed. The measured quantity that bears on memory is
      the monomial count s, reported as an absolute number per N, which bounds the storage of the
      resultant itself and nothing else.
    best_known: The incumbent for the same job is the dense composed-resultant route already used
      in this lane, whose coefficient array carries the full generic support; the entry measures how
      far the elliptic instance falls below it and claims no improvement over it.
    hidden_overhead: Hidden in the lower-order terms is the cost of converting between the chart representation
      and the symbolic coefficient variables, which is invisible in a monomial count but real in any
      implementation. The human cost hides in choosing symbolic coefficients that are genuinely independent;
      a single accidental symbol reuse manufactures the very sparsity the run is looking for.
  dominated_by: n/a (no result claimed). Every frontier row this lane records was checked, namely
    the B^(5/2) rho proxy and the five B^(7/2) represented routes of EV-ALR-001, and a support measurement
    places no point on any of them.
  sota_delta: no attack; conceptual/measurement contribution only. Quantitatively the deliverable
    is the pair of curves, elliptic vertex count and random vertex count against N, with their ratio
    and the N at which they meet.
  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'That the run completes to N = 6 with exact arithmetic: 0.85. That the
    elliptic arm is measurably sparser than the random arm at N = 4: 0.55, since affineness in v alone
    already forces some structure but the random arm is not affine unless matched, and matching it
    is what the bidegree control does. That the gap persists to N = 7 or 8: 0.3, because generic growth
    is fast and cancellation rarely keeps pace. That any sparsity found is characteristic-independent
    across both toy primes: 0.45, this being the most likely place the measurement dies. That the
    result is useful to a downstream constructor even if the gap persists: 0.2, stated separately
    because a sparse object is not a cheap object.'
