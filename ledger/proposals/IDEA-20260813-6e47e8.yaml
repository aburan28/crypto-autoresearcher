idea:
  id: IDEA-20260813-6e47e8
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-UOV-001
  goal_id: GOAL-UOV-001
  title: Certificate-localized degree-fall decomposition
  class: algorithm
  claim: >-
    For the preregistered toy plain-UOV slice, saturating each same-instance attack
    ideal by the complement of the verifier-accepted oil-space component separates
    certificate-localized degree falls from bulk or extraneous-component degree
    falls; falsify the claim if localized and residual solving profiles cannot be
    distinguished from matched nearby random-public-map controls.
  mechanism: >-
    Decompose an attack ideal into the component supported at accepted recovery
    certificates and its residual via saturation/colon ideals. Compute degree of
    regularity, graded ranks, and certificate recovery separately. This tests
    whether an early degree fall is causally attached to recoverable UOV structure
    or merely to an irrelevant component, instead of treating aggregate d_reg as
    a security proxy.
  why_not_a_renamed_known_approach: >-
    IDEA-20260801-014 calibrates toy MinRank/oil-space costs, IDEA-20260805-ca92fd
    derives an intersection system, and IDEA-20260808-ec2128 proposes an
    intersection Hilbert series. None of those preregister certificate-localized
    versus residual solving profiles across the three same-instance formulations.
  predictions:
    - observable: Localized versus residual degree of regularity
      metric: Exact d_reg gap and Macaulay-rank trajectory
      predicted: A recovery-relevant fall appears in the localized component and precedes certificate production; a residual-only fall is nonexploitable evidence
    - observable: Cross-formulation localization consistency
      metric: Agreement of localized certificates and mapped degree-fall witnesses
      predicted: A semantic structural effect follows the same certificate across formulations, unlike monomial-order artifacts
    - observable: Nearby-control gap
      metric: Difference from random public maps conditioned on the same planted subspace and dimensions
      predicted: No claimed UOV-specific mechanism survives if the nearby control has the same localized profile
  minimal_test:
    parameter_slice: Exhaustively solvable regular and singular toy instances over two small fields, all built from one public map per case.
    procedure:
      - Reproduce baseline ideals and independently verify all recovery certificates.
      - Form certificate-localized and residual ideals with saturation identities checked by recombination.
      - Run identical degree-by-degree linear algebra with frozen orders on baselines and controls.
      - Record the first fall, first accepted certificate, time, memory, preprocessing, and verification.
    discriminating_outcomes:
      - Localized-only early fall supports a certificate-attached mechanism.
      - Residual-only early fall explains low aggregate d_reg without recovery benefit.
      - Equal control profiles support generic planted-subspace geometry rather than UOV-specific structure.
  controls:
    - Exact null: a uniformly random public quadratic map with identical dimensions and the same planted subspace, with certificate labels hidden until analysis.
    - Planted positive: append a declared low-degree relation that vanishes only on the accepted certificate component; localization must expose its known fall.
    - Order control: repeat a preregistered small set of monomial orders without selecting the best after observation.
    - Residual control: add a known extraneous component with an early degree fall but no accepted certificate.
  confounders:
    - Incorrect saturation can remove or duplicate certificate components.
    - Solver heuristics and monomial order can shift observed d_reg.
    - Certificate discovery used to define localization can leak the answer into cost accounting.
    - Tiny-field singularities may not transfer.
  falsification_conditions:
    - Recombination does not recover the original ideal or accepted roots.
    - The planted positive or residual control is misclassified.
    - Localized profiles match exact nulls throughout the complete toy census.
    - Any claimed early fall occurs only after the certificate is already supplied at uncharged cost.
  interpretation_limits:
    - This is a diagnostic decomposition, not a deployed-parameter attack.
    - Failure closes only the tested localization and parameter slice.
    - A localized fall still requires an end-to-end recovery algorithm and full cost comparison.
    - No sibling-scheme claim is made.
  assumptions:
    - Primary attack ideals and recovery verifier are reconstructed correctly.
    - Saturation identities and multiplicities can be certified at toy scale.
    - Any certificate information used by an attacker is explicitly charged.
  heuristic_assumptions:
    - id: H1
      statement: Toy localized d_reg trends predict larger-instance recovery ordering.
      validation: Census increasing slices and reject extrapolation unless localized first-fall degree and certificate timing follow a stable model with residuals separated.
    - id: H2
      statement: Random maps with the same planted subspace are an adequate nearby control.
      validation: Add progressively more UOV key-generation constraints and test which constraint first separates profiles; nondecay under destroyed structure is an artifact signal.
  proof_search_map:
    bottleneck: Prove the localization is certificate-correct and that its degree fall precedes rather than presupposes recovery.
    baseline_embedding:
      parameter_slice: Fixed regular and singular exhaustive toy instances.
      reproduction_check: Exact baseline generators, known toy d_reg, solution set, and verifier output must reproduce before decomposition.
    observation_collision:
      audit: Search for ideals with identical aggregate Hilbert/d_reg profiles but opposite localized/residual allocations and recovery behavior.
      failure_response: Use the collision to reject aggregate d_reg as an identifying observable.
    constructive_transforms: [Certified saturation by the certificate ideal, residual colon-ideal construction, mapped localized witness across same-instance formulations]
    quantifier_order: Fix instance family, certificate verifier, localization ideal, monomial orders, and stop degree before inspecting falls; quantify only over the tested toy slice.
    method_ceiling:
      statement: Localization with a supplied certificate may diagnose a mechanism but cannot by itself be an attack because finding that certificate may dominate.
      nearby_counterobject: Random public maps with the same planted subspace and an engineered extraneous low-degree component.
    proof_obligations: [Baseline reproduction, localization and recombination correctness, certificate-free discoverability or fully charged advice, localized degree-fall witness, end-to-end recovery and complexity if promoted]
    not_applicable_reason: null
  target_complexity:
    time_exponent: null
    memory_exponent: null
    best_known_baseline: Independently reimplemented same-instance intersection, Kipnis-Shamir, and reconciliation costs; numeric Round-3 baselines are unverified.
    hidden_overhead_disclosure: Saturation, certificate advice, Macaulay matrices, order repeats, preprocessing, memory, recovery, and verification are fully charged.
    time_memory_tradeoff: Cached matrices and decomposition bases trade high memory for fewer reductions; streamed degree blocks repeat preprocessing.
