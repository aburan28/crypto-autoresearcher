idea:
  id: IDEA-20260809-bcf891
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ARGON-141710
  goal_id: GOAL-ARGON-001
  title: >-
    Calibrate the graph measurement against constructions whose depth robustness is
    known, in both directions
  class: control
  claim: >-
    A depth-reducing set computation is an approximation algorithm whose output on
    an unknown graph cannot be checked. The claim is that it CAN be checked
    against constructions with known properties: a graph family with a proven
    depth-robustness guarantee, and a deliberately shallow family with a known
    small depth-reducing set. Running the measurement on both bounds its error in
    each direction, and without that bound none of the goal's graph numbers are
    interpretable.
  mechanism: >-
    Instantiate both families at sizes matching the Argon2 graphs, run the same
    measurement pipeline, and compare against the known values, reporting the
    error in each direction.
  why_not_a_renamed_known_approach: >-
    Benchmarking an approximation algorithm on instances with known answers is
    standard. Doing it as a REQUIRED control before reporting any measurement on
    the deployed graph is the discipline, and it directly implements the
    program's rule that a negative or a bound must be scoped.
  predictions:
  - observable: measurement error on the depth-robust family
    metric: ratio of measured to known value
    predicted: Within the approximation algorithm's stated guarantee. Outside it means the implementation is wrong, not the theory.
  - observable: measurement error on the shallow family
    metric: ratio
    predicted: Tight, since shallow structure should be easy to find; a loose result here means the pipeline systematically overestimates and every Argon2 number inherits that bias.
  minimal_test: >-
    Both families at three sizes each, measurement pipeline run unchanged, errors
    reported per family per size.
  controls:
  - 'PIPELINE IDENTITY: exactly the same code path as the Argon2 measurement, since a control run through a different path controls nothing.'
  - 'KNOWN-VALUE PROVENANCE: the known values are derived in the record or cited to filed text.'
  falsification_conditions:
  - Errors exceed the stated guarantee on the depth-robust family.
  - Systematic overestimation on the shallow family, which biases every reported Argon2 value in a known direction and must be corrected or disclosed.
  interpretation_limits: >-
    Calibration bounds the pipeline's error on these families; transfer to the
    Argon2 graph is an assumption and is stated as one.
  sota_delta: 'No attack. Delta: bounded error on the goal''s central measurement instrument.'
  dominated_by: Not dominated by any corpus record; a precondition for IDEA-20260809-a915ea's numbers being usable.
  estimated_cost: Implementation medium; compute moderate.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for approximation calibration: no records. WEB NOT CHECKED.'
  source_refs:
  - Depth-robust graph construction references -- RECALLED, REQUIRED READS.
