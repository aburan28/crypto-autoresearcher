idea:
  id: IDEA-20260816-ddc377
  question_id: RQ-SNFS-005666
  added: '2026-08-16'
  title: 'Test a lattice-free detector for special-form primes: the minimum over a base grid of the
    largest centred digit of p written in base m, whose null distribution over random primes is available
    in closed form and therefore predicts its own false-positive rate'
  class: representation
  claim: '(A) A REPRESENTATION, NOT A REDUCTION. Write p in base m as p = sum c_i m^i with centred
    digits c_i in (-m/2, m/2]. If p lies in C(d,H) with witness (f,m) and every coefficient of f is
    smaller than m/2 in absolute value, then the centred digits of p in base m ARE the coefficients
    of f, exactly, with no lattice and no reduction. The detector statistic is therefore E(p) = min
    over m in a declared grid of max_i |c_i| divided by m, a number in (0, 1/2] computable with d+1
    divisions per base. (B) THE NULL IS CLOSED FORM. For a random p and fixed m the centred digits
    are very close to uniform, so P(max_i |c_i| <= t m) is approximately (2t)^(d+1) for t in (0,1/2],
    and over a grid of M bases the expected minimum of E is approximately ((1/M))^(1/(d+1)) up to
    the factor two. The false-positive rate of any threshold is therefore predicted before a single
    prime is generated, and the experiment tests the prediction rather than discovering the null empirically.
    This is a property almost no detector in this program has. (C) THE SUBCLASS IT SEES, AND THE ONE
    IT MISSES. This detector finds exactly those witnesses whose coefficients fit inside the digit
    window, so it is complete for the subclass H < m/2 and blind above it. The lattice detector has
    no such restriction but pays for it in reduction cost and reduction error. Measuring the symmetric
    difference between what the two catch on the same planted sample is a concrete deliverable and
    is the honest way to state what each instrument covers. (D) THE COMPARISON THAT MATTERS. Because
    both detectors sweep the same base grid, their per-base costs are directly comparable: d+1 divisions
    against one lattice reduction at rank d+1. If the digit detector catches most of the same class
    at a small fraction of the cost, then the cost exponent for detection is unchanged but its constant
    falls sharply, and the constant is the whole content of a feasibility claim. (E) WHAT IS NOT CLAIMED.
    No attack, no factorization, no security consequence, and no assertion that the digit detector
    or any other detector is or is not adequate at any size beyond those tested. Detecting a prime
    this program itself planted is a statement about this program''s planting. Nothing here is said
    about any published or deployed parameter set.'
  mechanism: 'STAGE ONE, zero compute: derive the closed-form null, P(E <= t at fixed m) approximately
    (2t)^(d+1), and the grid-minimum extreme-value form over M nearly independent bases, and record
    both before generating anything. STAGE TWO: implement E with exact integer division and centred
    digit extraction, and unit-test it by reconstructing p from its digits. STAGE THREE: generate
    the planted arm from C(d,H) with recorded witnesses and the null arm as uniform primes of identical
    length. STAGE FOUR: score both arms over an identical base grid and compare the measured null
    distribution of E against the closed-form prediction, which is the instrument-validity gate: if
    the measured null does not match the derived null, the derivation is wrong or the digits are not
    behaving as modelled, and every false-positive number that follows would be unfounded. STAGE FIVE:
    compute the ROC and read the false-positive rate at the operating point, then compare it against
    the closed-form prediction at the same threshold. STAGE SIX: run the same planted sample through
    the power-lattice detector and report the symmetric difference in what the two catch, together
    with the per-base cost ratio. The claim is established if the measured null matches the derived
    null and the planted arm separates; it is refuted if the null deviates from the closed form, if
    the arms do not separate even when H is far below m/2, or if the digit detector catches nothing
    the lattice detector misses and costs no less.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read in full: RQ-SNFS-005666 and GOAL-SNFS-001. Greps: grep -ril ''digit'' ledger/proposals/,
      which returned ten-plus files, headers inspected; grep -ril -E ''base-m|power lattice|f\(m\)
      = p'' ledger/proposals/; grep -ril -E ''special.form|SNFS'' ledger/hypotheses/, empty; grep
      -ril -E ''trapdoor|SNFS|special number field'' ledger/proposals/.'
    results: 'Every hit from the digit grep is an unrelated use of the word: IDEA-20260808-0cdd09
      and IDEA-20260805-1775f2 use 240-digit and similar phrases when discussing record computations
      under RQ-RSA-afe33c, and the remaining hits are in ECDLP and isogeny lanes. No record in ledger/proposals
      computes a digit-magnitude statistic of an integer, and no hypothesis mentions special form
      at all. The closest object in this batch is the power-lattice detector proposal, which is deliberately
      named in discriminated_from because the two instruments cover overlapping but unequal subclasses
      and the difference is a deliverable here.'
    verdict: 'UNVERIFIED. Nothing is asserted about external literature. Claimed new relative to this
      repository: the centred-digit magnitude statistic as a lattice-free detector for C(d,H), together
      with its closed-form null and the resulting pre-computed false-positive prediction, and the
      symmetric-difference comparison against the lattice detector on one planted sample. Assembled
      from known parts: base-m representation is elementary, the observation that small coefficients
      are digits is immediate, and extreme-value reasoning over a grid is standard. The value offered
      is that this particular detector predicts its own null, which is what makes its false-positive
      number checkable rather than merely measured.'
  object_first_candidate:
    tracked_object: The centred digit vector of p in base m, projected to its maximum magnitude normalised
      by m, and then minimised over the base grid. The object followed is that scalar profile over
      bases, and its distribution under each arm.
    lossiness: 'Genuinely lossy, and in a very specific way worth stating. The projection from p to
      its digit vector loses nothing, since the representation is a bijection for fixed m. The loss
      happens at the next step: taking the maximum magnitude discards d of the d+1 digits and all
      sign information, so the map from digit vector to statistic has large fibres. What survives
      propagates because changing the base changes all digits simultaneously through the division
      algorithm, and the maximum is a continuous enough function of that change for the profile to
      be meaningful. The honest statement is that step one is a change of coordinates and step two
      is where the genuine lossiness lives, and any claim of novelty rests entirely on step two.'
    propagation: 'One step of the target operation is m maps to m+1. The digit vector recomputes entirely,
      since the division algorithm is not continuous in the base, but the leading digit moves smoothly:
      c_d is approximately p/m^d, so it decreases by a factor (1 + 1/m)^d per step, and the lower
      digits are effectively re-randomised. The consequence is a sharply different propagation from
      the lattice case: the digit statistic has a detection window of essentially ONE base, since
      a witness at m produces no anomaly at m+1, whereas the lattice profile is Lipschitz with constant
      d. That contrast is the reason to run both, and it is a prediction the experiment can check
      directly.'
    survival_score: The anomaly survives exactly one base, the true m, and dissolves immediately on
      either side; the predicted window half-width is zero, against the lattice detector's (log2(GH)
      - log2(sqrt(d+1)H))/d. Consequently the digit detector requires a complete base sweep with stride
      one and cannot be run on a coarse grid at all, whereas the lattice detector tolerates stride
      up to its window. Concretely at n = 64, d = 3, H = 64 the digit detector must visit every one
      of about 2^21 bases while the lattice detector may skip in twos; that is the exact tradeoff
      being measured.
  null_object_control: 'Uniform random primes of identical bit length scored by the identical statistic
    over the identical grid in the same invocation, PLUS the closed-form null derived at STAGE ONE.
    Having both is the point: the measured null must match the derived null, which is a far stronger
    control than either alone. For the signal arm to mean anything the null must show, first, that
    the distribution of max centred digit over m matches (2t)^(d+1) within a stated tolerance, and
    second, that the grid minimum over M bases follows the derived extreme-value form. If the measured
    null is systematically below the derived one, some primes are accidentally special and the census
    base rate, not the derivation, is the operative floor.'
  discriminated_from:
  - 'The power-lattice detector proposal in this batch: same class, same grid, different instrument.
    The digit detector is complete only for H below m/2 and has a one-base window; the lattice detector
    covers all H below the heuristic and has a window of width (log2(GH) - log2(sqrt(d+1)H))/d. The
    two are compared, not restated.'
  - 'IDEA-20260808-0cdd09 and IDEA-20260805-1775f2 under RQ-RSA-afe33c: the digit grep surfaced them
    because they discuss 240-digit records; neither computes any digit statistic and neither concerns
    detection.'
  - 'RQ-RSA-d46f02 Coppersmith lane: that setting recovers structure from assumed leaked bits of a
    factor. Here nothing is leaked, nothing is recovered, and the digits of the modulus itself are
    the observable.'
  - 'Generic entropy or randomness testing of integers: a statistic like Hamming weight tests p against
    uniform bits, which is base-two only and has no relation to the class C(d,H); this statistic is
    indexed by the base and is complete for a named subclass, which a generic randomness test is not.'
  assumptions:
  - Centred digits of a random prime in base m are close enough to uniform for the closed-form null
    to hold at the tested sizes; this is exactly what STAGE FOUR tests and it may fail.
  - Bases in the grid produce approximately independent digit vectors, which underlies the extreme-value
    form for the grid minimum; correlation between neighbouring bases would inflate the true false-positive
    rate.
  - The subclass condition H below m/2 is the correct completeness boundary, which follows from the
    centred-digit definition and is checked by construction on the planted arm.
  - Exact integer division is used throughout, so no floating point enters the statistic.
  predictions:
  - metric: measured null cumulative distribution of max centred digit over m at t = 0.25, against
      the derived (2t)^(d+1)
    direction: different
    minimum_effect: measured within a factor of 1.5 of the derived value for d in {2,3,4}
  - metric: true-positive rate on planted primes with H below m/2 and the true base in the grid
    direction: higher
    minimum_effect: 0.99
  - metric: detection window half-width in base steps for the digit statistic
    direction: lower
    minimum_effect: 0 steps, that is no anomaly at any base other than the witness base
  - metric: per-base cost ratio, digit detector against lattice detector at rank d+1
    direction: lower
    minimum_effect: at least 20 times cheaper per base in wall-clock terms
  minimal_test:
    design: 'Generate 200 planted primes at n = 48 with d = 3 and H = 8, chosen so that H is far below
      m/2 and the detector is provably complete for the class, and 200 uniform 48-bit primes. Sweep
      every base m in a window of 4001 consecutive integers centred on the integer nearest p^(1/3),
      computing max centred digit divided by m with d+1 exact divisions per base. Emit the grid minimum
      for each prime in both arms, plus the full per-base distribution for the first ten null primes
      so the closed-form comparison has data. The discrimination requires no threshold tuning: planted
      primes must score at most H/m, which is under 2^-18 at these parameters, while the derived null
      says the best of 4001 bases should land near (1/4001)^(1/4), about 0.13. Those are separated
      by many orders of magnitude, so either the detector fires on essentially every planted prime
      or the implementation is wrong. Cost is 400 times 4001 times 4 integer divisions, seconds in
      pure Python.'
    controls:
    - The uniform-prime null arm in the same invocation.
    - The closed-form derived null, compared against the measured null as an instrument-validity gate.
    - A witness-excluded control on the planted arm, which must return the null distribution exactly,
      confirming the one-base window.
    - An out-of-subclass control with H above m/2, where the detector is expected to fail by construction,
      confirming the completeness boundary is real.
    - A base-correlation check comparing statistics at adjacent bases, testing the independence assumption
      behind the extreme-value form.
    required_metrics:
    - grid-minimum normalised max-digit statistic per prime, both arms
    - measured null cumulative distribution at fixed t against the derived closed form
    - true-positive and false-positive rates at the derived threshold
    - detection window half-width in base steps
    - per-base wall-clock cost for the digit statistic and for a rank-(d+1) reduction
    - symmetric difference of primes caught by digit and by lattice detectors
  falsification_conditions:
  - The measured null deviates from (2t)^(d+1) by more than the stated tolerance, invalidating every
    pre-computed false-positive number.
  - Planted primes with H below m/2 are not caught when the true base is in the grid, which would
    mean the digit identity is misimplemented.
  - The witness-excluded control still shows separation, meaning the statistic sees something other
    than the digit identity.
  - Adjacent-base statistics are strongly correlated, invalidating the extreme-value form for the
    grid minimum and therefore the false-positive prediction.
  - The out-of-subclass control succeeds, which would mean the completeness boundary is not where
    the derivation puts it and the derivation is wrong.
  - The per-base cost advantage over lattice reduction fails to materialise, removing the only practical
    argument for the instrument.
  confounders:
  - Bases sharing small factors with p produce degenerate digit vectors and cluster the statistic,
    mimicking structure.
  - Restricting to exactly n-bit primes correlates the leading digit with the base across the whole
    grid.
  - The grid is centred using p^(1/d), which is a hint; the blind-shift variant exists to quantify
    how much that matters.
  - Neighbouring bases are not independent, so the grid minimum has a heavier lower tail than the
    extreme-value form suggests.
  - At very small m the digit vector is long and the fixed-degree assumption breaks, contaminating
    the low end of the grid.
  interpretation_limits:
  - Completeness holds only for the subclass H below m/2; nothing follows about witnesses with larger
    coefficients, and the contract requires that boundary to be restated wherever the detector is
    cited.
  - A one-base window means the detector cannot be run on a coarse grid, so its measured power does
    not transfer to any setting where a complete sweep is unaffordable.
  - All results are scoped to the tested sizes, degrees and bounds and to primes this program generated.
  - No statement follows about any published or deployed parameter set, and none may be written.
  target_complexity:
    time_exponent: No attack exponent is claimed. Detection cost is d+1 exact divisions per base and
      a complete sweep at fixed d has about p^(1/d) bases, so the cost exponent is 1/d in log p, the
      same exponent as the lattice detector with a much smaller constant; the constant is measured
      and reported.
    memory_exponent: No attack memory exponent is claimed. The statistic is streaming and holds d+1
      digits, so memory is O(d log p) bits, kilobytes at every size tested, and no per-base state
      is retained.
    best_known: The incumbent is the power-lattice detector proposed in this same batch, which this
      instrument is measured against directly on the same planted sample, and beyond it the unquantified
      phrase carried in RQ-SNFS-005666. There is no other detector in this repository, and no external
      baseline is asserted.
    hidden_overhead: 'The one-base window is the hidden cost and it is severe: the detector demands
      a complete stride-one sweep, so its low per-base cost buys nothing if the sweep itself is unaffordable,
      and any feasibility statement must multiply the two. The closed-form null hides an independence
      assumption between adjacent bases that the control tests but that could fail quietly at other
      parameters.'
  dominated_by: 'Dominated on coverage by the power-lattice detector, which handles witnesses with
    coefficients above m/2 that this instrument provably cannot see; that row was checked directly
    by construction rather than assumed. Not dominated on cost: the per-base cost is d+1 divisions
    against a full rank-(d+1) reduction, and the experiment measures the ratio. On memory the two
    are comparable at kilobytes. Against the alternative of factoring outright at the tested sizes,
    both detectors are dominated on informativeness, and that row is stated rather than omitted. No
    attack claim is made, so no attack frontier applies.'
  sota_delta: 'No attack; measurement and instrument contribution only. Quantitatively: same detection
    cost exponent 1/d as the lattice detector, with a per-base constant predicted to be at least twenty
    times smaller, at the price of a detection window of zero base steps instead of (log2(GH) - log2(sqrt(d+1)H))/d,
    and a coverage restriction to H below m/2. Those three numbers are the whole comparison and none
    of them is a speedup against any attack.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Part A, that planted primes with H below m/2 are caught essentially always
    when the true base is swept: about 0.97, since it is an identity rather than a discovery and failure
    means a bug. Part B, that the measured null matches the closed-form (2t)^(d+1) within a factor
    of 1.5: about 0.6, because the independence and uniformity assumptions are the parts most likely
    to fail at small m and short digit vectors. Part C, the symmetric-difference comparison producing
    a clean coverage statement against the lattice detector: about 0.8. That any of this makes detection
    feasible at sizes where it currently is not: essentially zero, because the sweep length is unchanged
    and the contract says so.'
