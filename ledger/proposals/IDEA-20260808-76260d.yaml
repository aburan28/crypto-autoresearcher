    (IDEA-20260805-947f67 concerns a bounded-index subgroup repair route - different object);
    KNOWLEDGE_BARRIERS.txt (no KN-FIND on bound certification; KN-TECH-013 is the nearest
    technique and is primal). EXTERNAL LITERATURE NOT SCREENED - whether the integrality gap
    of the active-S-box program has been published is UNKNOWN to this session.
  discriminated_from: A1-10 - primal value by a different algorithm, no certificate; this
    produces a dual vector checkable in O(r) arithmetic and measures the primal-dual gap.
    The classical wide trail argument - this record's claim is that it IS a dual, which reframes
    it as an instrument rather than a theorem, and then asks the question the theorem does
    not answer (the gap under key-schedule coupling).
  source_refs:
  - ref: MILP/CP-based automatic search for active S-box bounds in AES-like ciphers
    status: recalled_unverified
    use: named as the method this record certifies rather than replaces.
  - ref: catalogue A1-10 - tensor-factorised truncated-pattern operator
    status: internal_catalogue_unvalidated
  proof_search_map:
    bottleneck: The absence of a solver, which currently makes every bound in this family
      either hand-proved or uncomputable here.
    baseline_embedding:
      parameter_slice: r = 4, single-key, byte-oriented - the classical 25.
      reproduction_check: the dual must certify exactly 25; frozen as a fixture.
    observation_collision:
      observable: the certified bound value.
      distinct_preimage_search: A branch-2 SPN certifying the same value would mean the dual
        is not reading the MDS property - the mandatory null.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: the LP dual vector on column constraints
      predicted_gain: O(16r)-time verification of a bound that otherwise needs a solver.
    - transform: boundary_lift
      proposed_object: extension of the dual to key-schedule-coupled constraints
      predicted_gain: either a certified related-round bound or a measured integrality gap.
    quantifier_order: FOR ALL r, THERE EXISTS a dual-feasible vector y_r with objective value
      v_r such that FOR ALL activity patterns p feasible for the r-round program, weight(p)
      is at least v_r. Note - existence of the dual is claimed, not its optimality; optimality
      is the separate integrality-gap claim.
    method_ceiling:
      strongest_certifiable_claim: '"no feasible activity pattern has fewer than v_r active
        S-boxes" - it can never certify anything about trails outside the truncated model,
        nor about actual differential probabilities without the per-S-box step.'
      nearby_object_control: An SPN whose linear layer is MDS but whose S-box is affine has
        the identical activity program and identical certificate, yet is trivially broken
        - printed beside every certified value.
    proof_obligations:
    - claim: dual feasibility at r=4 gives 25
      responsibility: baseline
    - claim: dual feasibility for general r
      responsibility: correctness
    - claim: LP optimum equals integer optimum, or the gap is reported
      responsibility: strictness
    - claim: certificate size and verification cost are O(16r)
      responsibility: size
    - claim: activity-pattern realisability
      responsibility: feasibility
    - claim: truncated-model boundary stated wherever a bound is quoted
      responsibility: scope
    not_applicable_reason: null
