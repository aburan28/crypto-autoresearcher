idea:
  id: IDEA-20260816-5c040d
  question_id: RQ-PMA-001
  added: '2026-08-16'
  title: Decompose the square-class gate into its two independent halves, the divisor-parity vector
    over finite places plus infinity and the residual constant class in k-star modulo squares, and
    measure which half actually fires and how often, since the question names divisor parity but the
    gate as frozen is a conjunction of two different obstructions
  class: measurement
  claim: '(A) The frozen gate declares OBSTRUCTED when a reduced Delta has an odd valuation at a finite
    irreducible divisor or at infinity, OR when its residual constant class in k-star modulo k-star-squared
    is nonsquare. These are two structurally different obstructions: the first is a statement about
    the divisor of Delta and is insensitive to the constant field beyond its characteristic; the second
    is a statement about the constant field''s square-class group and vanishes entirely when that
    group is trivial. (B) Over k = Q the constant class group is infinite; over k = F_q with q odd
    it has order exactly 2; over an algebraically closed k it is trivial. So the SAME predicate is
    a strictly weaker gate over an algebraically closed constant field than over F_q, and RQ-PMA-001''s
    title asks specifically about DIVISOR PARITY, which is only the first half. (C) The proposal is
    to instrument the predicate to emit, per discriminant, a structured square-class certificate with
    three separated components -- the odd-valuation places among the finite irreducibles, the valuation
    at infinity, and the residual constant class -- and to measure the firing rate of each component
    independently and their overlap, over k = Q, k = F_q, and the algebraic closure. The deliverable
    is an attribution table, not a verdict. (D) What is NOT claimed: that either half is the correct
    or the interesting obstruction. The measurement is agnostic and both outcomes are informative
    -- if the constant class fires alone on most obstructed instances, then the phenomenon is a constant-field
    artifact and RQ-PMA-001''s divisor-parity framing is measuring something else; if the finite-place
    parity fires alone, the framing is vindicated at the tested scale. (E) Also NOT claimed: any statement
    about existence of matrices. A component firing is an obstruction certificate under the one-directional
    reading only, and no component NOT firing is a compatibility claim. (F) No attack, speedup or
    security consequence is claimed.'
  mechanism: 'Stage 1 defines the certificate type precisely: for a nonzero Delta in k(t), write Delta
    = c times product over irreducible monic f of f^{e_f}, and record the vector of e_f modulo 2 over
    the finite irreducibles, the valuation at infinity (which is minus the degree of Delta as a rational
    function and is determined by the finite valuations only up to the total-degree relation), and
    the class of c in k-star modulo squares. Stage 2 verifies the certificate is complete and consistent:
    the sum over all places, finite and infinite, of the valuation must be zero for a principal divisor,
    which is an exact accounting identity the implementation must satisfy; and Delta must be a square
    in k(t) if and only if all valuations are even AND c is a square in k. Both directions are checked
    on constructed squares and constructed nonsquares. Stage 3 runs the instrumented predicate over
    the grid at three constant fields and tabulates, per instance and per discriminant, which of the
    three components is nontrivial, producing a two-by-two-by-two attribution histogram. Stage 4 runs
    the null. Stage 5 computes the marginal firing rate of each component and the conditional rate
    of the constant class given even divisor parity, which is the number that decides whether the
    divisor-parity framing is measuring what its name says. Refutation: if the accounting identity
    fails, or if a constructed square is not certified as such, the instrument is void.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read ledger/proposals/IDEA-20260726-012.yaml assumptions and required_metrics blocks
      in full, ledger/hypotheses/H-PMA-001.yaml statement and assumptions in full, ledger/questions/RQ-PMA-001.yaml
      scope block in full, experiments/EXP-PMA-001/specification.yaml metrics block. Grepped ledger/proposals/
      and ledger/hypotheses/ for: square.class, residual constant, valuation at infinity, divisor.parity,
      squarefree, class group.'
    results: 'square.class returns hits in IDEA-20260805-d426f9, IDEA-20260807-4d7e8e, IDEA-20260805-cf2d5a,
      H-MONO-45183a, plus the two PMA records; the non-PMA hits are in unrelated areas and none concerns
      a rational function field discriminant. IDEA-20260726-012''s required_metrics block ALREADY
      lists as separate items the canonical numerator, denominator, gcd, degree and valuation at infinity;
      the squarefree divisor with every odd-valuation component and its multiplicity; and the residual
      constant class after all divisor valuations are even. So the components are named there as things
      to record. What is NOT there, and what no record contains: any measurement of which component
      fires, any firing-rate or overlap statistic, any comparison across constant fields, and any
      recognition that the gate''s strength varies with the constant field''s square-class group.
      H-PMA-001''s assumptions state that divisor parity is supplemented by the residual constant
      square class over finite k, which is the closest statement in the repository and is a scoping
      remark, not a measurement.'
    verdict: 'UNVERIFIED. Nothing is asserted about literature outside this repository. Claimed new
      inside it: the attribution measurement -- firing rates and overlap of the three certificate
      components across constant fields -- and the framing that the frozen gate is a conjunction whose
      two halves have different dependence on the constant field. Assembled from known parts: the
      three components are enumerated verbatim in IDEA-20260726-012''s required_metrics; the square-criterion
      over k(t) is standard and is stated in that proposal''s mechanism; the constant-field dependence
      is implied by H-PMA-001''s own assumption. The new content is turning three recorded fields
      into a measured attribution.'
  object_first_candidate:
    tracked_object: 'The SQUARE CLASS of a discriminant, followed not as a bit but as a structured
      triple: (odd-valuation support among finite irreducibles, valuation parity at infinity, residual
      constant class in k-star modulo squares). What propagates through the computation is that triple
      and, across a grid, the joint distribution of which coordinates are nontrivial.'
    lossiness: Genuinely lossy. Delta is a rational function with a full factorisation, coefficients
      of unbounded height over Q, and a degree; the tracked triple retains only a parity support set,
      one parity bit, and one class in a group of order 2 over F_q. Everything about the magnitude,
      the multiplicity beyond parity, and the actual factors is discarded. This is compatible with
      the target operation because the property the gate tests -- being a square in k(t) -- is exactly
      a function of that triple and of nothing else, so the retained part propagates deterministically
      under multiplication of discriminants and under multiplication by squares. Multiplying Delta
      by any square changes the rational function completely and changes the triple not at all, which
      is precisely the lossiness that makes the object worth tracking.
    propagation: One step of the target operation is multiplying a discriminant by another rational
      function, which acts on the triple by symmetric difference on the odd-valuation support, XOR
      on the infinity parity, and group multiplication on the residual constant class. That is a deterministic
      and closed action on an F_2-vector-space-plus-group object, which is why the whole gate is computable
      from the triple alone and why a component-wise attribution is well defined rather than an arbitrary
      decomposition.
    survival_score: 'The triple survives completely as long as exact factorisation over the constant
      field is available: over F_q it survives at every degree the factorisation routine handles;
      over Q it survives until coefficient heights make factorisation the binding cost, which for
      discriminants of degree around 10 arising from the frozen family is well within reach but is
      measured rather than assumed. It DISSOLVES over an algebraically closed constant field in a
      specific and informative way: the residual constant component becomes trivial identically, so
      the triple degenerates to a pair, and that degeneration is itself one of the measurements this
      entry makes.'
  null_object_control: 'The identical certificate computation runs against a null: uniformly random
    rational functions over the same constant field with the SAME degree profile as the observed discriminants
    (numerator and denominator degrees matched instance by instance to the signal arm), drawn from
    a declared seed. Because a random rational function of positive degree has odd valuation somewhere
    with high probability, the null establishes the BASELINE firing rate of each component under no
    structure at all. For the signal arm to mean anything, the signal must differ from the null in
    at least one of: the marginal firing rate of finite-place parity, the marginal rate of the constant
    class, or their overlap. If all three match the null within tolerance, the record states a controlled
    null -- the observed square classes are what a degree-matched random function gives, and the discriminant
    structure contributes nothing detectable.'
  discriminated_from:
  - 'IDEA-20260726-012''s required_metrics: that record lists the three certificate components as
    things to RECORD per instance. This entry measures their joint distribution across a grid and
    across constant fields, which is a different output type -- a histogram rather than a per-instance
    field -- and answers a question (which half fires) that the proposal does not ask.'
  - 'H-PMA-001''s assumption that divisor parity is supplemented by the residual constant square class
    over finite k: a scoping remark establishing that both are needed. This entry asks how often each
    is the operative one, which the remark does not address.'
  - 'Entry 4 of this bucket (anchor equivariance): that entry treats the verdict as an opaque ternary
    label and varies the gauge. This entry holds the gauge fixed and opens the verdict up, so the
    two are complementary and neither subsumes the other.'
  - 'EXP-PMA-001''s CTRL-PMA4-GROEBNER: a third-party consistency cross-check on verdicts. This entry
    never cross-checks a verdict; it decomposes one.'
  - 'The unrelated square-class records IDEA-20260805-d426f9, IDEA-20260807-4d7e8e, IDEA-20260805-cf2d5a
    and H-MONO-45183a: those concern square classes in other areas of the program and share no object,
    no field and no question with a discriminant of an anchored PMA4 orientation quadratic.'
  assumptions:
  - A nonzero element of k(t) with k of characteristic not 2 is a square if and only if every valuation
    in its principal divisor, finite and at infinity, is even and its residual constant class is a
    square in k. This is standard and is CHECKED in both directions on constructed squares and nonsquares
    rather than assumed.
  - Exact factorisation over the constant field is available for the degrees actually arising; where
    it is not, the instance is recorded as UNDECIDED and excluded, never assigned a component.
  - The sum of valuations over all places of a principal divisor is zero, which the implementation
    must satisfy exactly as an accounting identity.
  - The algebraically closed arm is realised by working over a sufficiently large finite extension
    in which every constant is a square for the instances at hand, and the record must state that
    this is a proxy for the closure and not the closure itself.
  predictions:
  - metric: constant_class_firing_rate_over_F_q_given_even_divisor_parity
    direction: different
    minimum_effect: 'I refuse to pre-commit a value. Reason: this conditional rate is the primary
      unknown the entry exists to measure, and the only honest prior I have is that over F_q the class
      group has order 2, so a structureless argument would suggest something near one half -- but
      asserting one half as a prediction would smuggle in the null hypothesis as a result. The null
      arm measures it instead.'
  - metric: finite_place_parity_firing_rate_signal_minus_null
    direction: different
    minimum_effect: an absolute difference of at least 0.15 in firing rate is required to call the
      signal distinguishable from the degree-matched null; below that the result is recorded as a
      controlled null
  - metric: divisor_accounting_identity_violations
    direction: lower
    minimum_effect: exactly 0 -- the sum of all valuations must be zero for every certificate
  - metric: constructed_square_misclassification_count
    direction: lower
    minimum_effect: exactly 0 across at least 200 constructed squares and 200 constructed nonsquares
      per field
  - metric: gate_strength_drop_from_F_q_to_the_closure_proxy
    direction: lower
    minimum_effect: the OBSTRUCTED rate over the closure proxy must be less than or equal to the rate
      over F_q on the same instances, with equality only if the constant class never fires alone;
      a strict increase would mean the implementation is wrong
  minimal_test:
    design: 'Instrument the predicate to emit the three-component certificate, then run it over a
      single small grid of prescribed tables at k = F_q only, plus the constructed-square and constructed-nonsquare
      validation sets. That is a few hundred exact factorisations over a finite field, seconds of
      compute, and it already yields the two numbers that matter: the marginal firing rate of finite-place
      parity and the conditional firing rate of the constant class given even divisor parity. If the
      constant class fires alone on a large share of obstructed instances, the divisor-parity framing
      of RQ-PMA-001 is measuring something other than what it names, and that is the finding -- reached
      without touching k = Q, without any existence decider, and without the closure proxy. The Q
      arm and the closure proxy arm are extensions that sharpen attribution but are not needed to
      discriminate. The degree-matched null must run in the same invocation, since without it a firing
      rate is an uncontrolled number.'
    controls:
    - 'Constructed-square control: at least 200 rational functions built as explicit squares per field
      must be certified with all-even valuations and square constant class.'
    - 'Constructed-nonsquare control: at least 200 built with exactly one designed odd valuation,
      or with a designed nonsquare constant, must be certified with exactly that component nontrivial
      and no other.'
    - 'Divisor accounting control: the sum of valuations over all places, including infinity, is exactly
      zero for every certificate.'
    - 'Degree-matched random null: uniformly random rational functions with numerator and denominator
      degrees matched instance by instance to the signal discriminants, run in the same invocation
      through the identical certificate code.'
    - 'Closure-proxy control: the same instances over a finite extension large enough that the constant
      class is trivial for them; the OBSTRUCTED rate must not increase.'
    - 'Independent factorisation cross-check: a second factorisation path (different algorithm or
      different library entry point) must produce the same odd-valuation support on a sample.'
    required_metrics:
    - 'per discriminant: the odd-valuation support among finite irreducibles, with each place and
      its multiplicity'
    - 'per discriminant: the valuation parity at infinity'
    - 'per discriminant: the residual constant class after all even valuations are removed'
    - marginal firing rate of each of the three components, per constant field
    - joint attribution histogram over the eight component patterns, per constant field
    - conditional firing rate of the constant class given even divisor parity, per constant field
    - null-arm marginal and joint rates, degree-matched
    - divisor accounting violations, constructed-square and constructed-nonsquare misclassifications,
      factorisation cross-check disagreements; also count of UNDECIDED instances from factorisation
      failures, reported separately
  falsification_conditions:
  - 'Any constructed square is certified as nonsquare, or any constructed nonsquare as square: the
    certificate implementation is void and no attribution may be reported.'
  - Any nonzero divisor accounting residual.
  - The independent factorisation cross-check disagrees on the odd-valuation support of any sampled
    discriminant.
  - 'The OBSTRUCTED rate over the closure proxy strictly exceeds the rate over F_q on the same instances:
    the constant-class component is being computed with the wrong field and the attribution is inverted.'
  - 'All three component firing rates and the joint histogram match the degree-matched null within
    tolerance: a controlled null, meaning the observed square classes are explained by the degree
    profile alone and the discriminant structure contributes nothing measurable.'
  - 'The finite-place parity component never fires on any instance in any field while the constant
    class fires: RQ-PMA-001''s divisor-parity framing has no non-vacuous instance at the tested scale,
    which is a decisive scoped result and must be reported as such rather than as a null.'
  confounders:
  - Degree matching in the null must match numerator and denominator degrees SEPARATELY, since the
    valuation at infinity depends on their difference; matching only total degree would make the null
    incomparable at exactly the component under study.
  - Over Q, coefficient height rather than degree governs factorisation cost and can silently bias
    which instances complete, so completion must be tracked and UNDECIDED instances reported rather
    than dropped.
  - The three anchored discriminants within one instance share entries and are not independent, so
    firing rates must be reported both per discriminant and per instance, and the per-instance rate
    is the one that can be compared across the grid.
  - A common square factor left uncancelled inflates even multiplicities and can hide an odd valuation;
    canonical reduction must precede certification and its correctness is what the constructed-square
    control tests.
  - The closure proxy is a finite extension, not the closure; a constant that is a nonsquare in the
    proxy but a square in the closure would make the proxy arm overstate the gate's strength, and
    the extension degree must be chosen and reported per instance.
  interpretation_limits:
  - A component firing is an obstruction certificate under the one-directional reading only. No component
    failing to fire is a compatibility claim, per RQ-PMA-001's explicit constraint that NOT_OBSTRUCTED_BY_THIS_GATE
    is never a compatibility claim.
  - Firing rates are properties of the tested prescribed family and the tested parameter assignments;
    the family p_S = (t+1)/(t+d_S) is highly structured and no generic-family statement follows.
  - The closure arm is a proxy realised by a finite extension and is reported as such.
  - An attribution histogram says which half of a conjunction was operative on the tested instances.
    It says nothing about which half would be operative on a different family, at a different size,
    or over a different constant field.
  target_complexity:
    time_exponent: No attack exponent is claimed. Cost per discriminant is one canonical reduction
      plus one factorisation over the constant field, at the degrees the frozen family produces.
    memory_exponent: No attack exponent is claimed. Memory is the size of the factored discriminants
      plus an eight-bin joint histogram per field.
    best_known: The incumbent is the frozen gate as specified in IDEA-20260726-012 and H-PMA-001,
      which computes exactly the same quantities but reports a single ternary verdict. There is nothing
      else in this repository that certifies square classes over a rational function field, so there
      is no other comparator.
    hidden_overhead: 'The hidden cost is the closure proxy: choosing an extension per instance in
      which the relevant constants become squares is fiddly, and getting it wrong inverts the attribution
      in a way that looks like a result. Second hidden cost is over Q, where factorisation of degree-10
      discriminants with large height is cheap in principle and occasionally not in practice, and
      the temptation to drop the slow instances silently is exactly the failure this contract''s UNDECIDED
      accounting exists to prevent.'
  dominated_by: 'n/a (no result claimed). Checked across time, memory and data/query axes: this entry
    produces no cryptanalytic quantity, no algorithm and no source-to-scalar candidate, so no frontier
    row applies. Within this repository it is not dominated by the frozen gate, because it computes
    strictly more output (a certificate rather than a verdict) at essentially the same cost.'
  sota_delta: 'no attack; conceptual/measurement contribution only. The quantitative comparison is
    internal and modest: the instrumented gate emits an eight-way attribution per discriminant instead
    of one ternary label, at the cost of retaining the factorisation it already computed. That is
    an output-richness difference of three bits per discriminant, not a performance comparison with
    any method.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part A (the decomposition is well posed and the certificate implementable):
    0.9 -- the square criterion over k(t) is standard and the constructed-square controls will catch
    implementation errors. Part B (the constant-field dependence claim, that the gate is strictly
    weaker over an algebraically closed constant field): 0.9, since the residual class component is
    identically trivial there by definition; the residual risk is entirely in the proxy realisation.
    Part C (the attribution measurement runs and produces a populated histogram): 0.8, with factorisation
    over Q the main threat and UNDECIDED accounting the mitigation. Part D (the attribution turns
    out to be INFORMATIVE, i.e. the signal arm separates from the degree-matched null by at least
    0.15): 0.45 -- genuinely uncertain, and I would not bet on it; a highly structured family may
    well produce discriminants whose square-class statistics are indistinguishable from degree-matched
    random ones, and that outcome is a legitimate controlled null. Part E (the finite-place parity
    component fires at all on some instance, i.e. non-vacuity of the divisor-parity half): 0.55, which
    is the single most consequential unknown here because H-PMA-001''s own non-vacuity prediction
    depends on it.'
