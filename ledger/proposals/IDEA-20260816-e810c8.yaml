idea:
  id: IDEA-20260816-e810c8
  question_id: RQ-SNOVA-001
  added: '2026-08-16'
  title: 'Count the targets, not the haystack: measure the fibre of the key-generation map by exhaustively
    enumerating, at tiny parameters, how many distinct secret oil modules produce the identical public
    key in each of the four schemes, and compare that multiplicity against a matched plain UOV of
    the same flattened dimensions.'
  class: theory
  claim: '(A) Every structure-versus-entropy argument in this bucket counts how many secret objects
    exist. None counts how many of them work for a GIVEN public key. Those are different numbers and
    only the second one describes an attacker''s situation: if a public key admits t distinct valid
    oil modules, a search that stops at the first success is t times likelier to stop early than a
    count of the whole secret space suggests. The fibre size t of the key-generation map is therefore
    a first-class object, it has never been measured in this repository, and at tiny parameters it
    can be measured exactly by enumeration rather than estimated. (B) The claim under test is that
    t is strictly greater than 1 for the structured schemes and that its excess over the plain-UOV
    value is exactly accounted for by the algebra''s unit group: for a coefficient algebra A, the
    oil module is determined only up to the action of the automorphisms of A that fix the public map,
    so t should equal the plain-UOV fibre size times the order of that stabiliser, which is computable
    in closed form per algebra. (C) The deliverable is a table of exactly enumerated fibre sizes per
    scheme per tiny parameter set, alongside the closed-form prediction, with the discrepancy reported
    per cell. Its use is as the missing multiplicity factor in any counting argument in this bucket,
    including the ones already committed. (D) NOT CLAIMED: this is not an attack and gives no attacker
    a method for finding any of the t solutions. A large fibre is not a weakness; it is a counting
    fact whose consequences depend entirely on a search procedure that this proposal does not supply
    and does not evaluate. Nothing is claimed about deployed parameter sets, where enumeration is
    impossible and where no extrapolation is offered.'
  mechanism: STAGE 1, fix the enumeration. At parameters small enough that the entire space of candidate
    oil modules is enumerable - for a plain UOV over F_q with n variables and oil dimension o, that
    is the Gaussian binomial [n choose o]_q - iterate over every candidate subspace or submodule and
    test annihilation of the public map. STAGE 2, exact fibre. The number that pass is t, exactly,
    with no sampling and no estimate. STAGE 3, four schemes plus null. Repeat for a QR-UOV-shaped
    key over F_q[t]/(f), a SNOVA-shaped key over an ell-dimensional algebra, a whipped MAYO-shaped
    key, and a plain UOV at each composite's flattened dimensions. The plain UOV arm is the null and
    is enumerated by the identical routine. STAGE 4, closed-form prediction. For each algebra, compute
    the order of the stabiliser subgroup - the units of A acting on the module, intersected with the
    maps fixing the public form - and predict t as the null value times that order. STAGE 5, discrepancy.
    Report the measured t, the predicted t, and their ratio per cell. A ratio of 1 confirms the stabiliser
    account; anything else is an unexplained multiplicity and is the more interesting outcome, since
    it means valid oil modules exist that are not related to each other by any symmetry the construction
    knows about.
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-SNOVA-001 and H-SNOVA-ec84c2's statement in full, since the latter is the closest
      record. Read H-QRUOV-e8ae3e for the module framing. Read titles of IDEA-20260805-70aa6e, IDEA-20260805-54723a,
      IDEA-20260808-348896, IDEA-20260808-040db9, IDEA-20260805-2f2863, IDEA-20260801-016 from the
      family grep. Grepped ledger/proposals/ for 'fibre' and 'fiber' (hits IDEA-20260808-e7ba81, IDEA-20260806-c5d183,
      IDEA-20260811-97e244, IDEA-20260805-59fa23, IDEA-20260813-5988b7 and others, none counting a
      key-generation fibre in this bucket).
    results: 'IDEA-20260805-70aa6e and H-SNOVA-ec84c2 Part A count the free rank-k left A-submodules
      of A^N in closed form per algebra class - that is the SIZE OF THE HAYSTACK, an a priori count
      independent of any public key, and it is explicitly framed there as fixing the matched-UOV baseline
      exponent. The present proposal counts a different thing: how many of those submodules annihilate
      one GIVEN public map. IDEA-20260805-54723a computes the multiplier algebra of a public key as
      an invariant with a matched null, which is about symmetries of the public key rather than about
      the number of valid secrets. IDEA-20260813-5988b7 measures solution fibres of an ATTACK SYSTEM,
      not of the key-generation map. No in-repo record enumerates the key-generation fibre.'
    verdict: 'UNVERIFIED. No claim is made about published literature. Assembled from known parts:
      the submodule counting formulas are H-SNOVA-ec84c2''s Part A and are used here only to size
      the enumeration; the annihilation certificate is the program''s standard rule. Claimed new relative
      to the in-repo corpus only: measuring the fibre of key generation by exhaustive enumeration
      and predicting it as the null fibre times a computable stabiliser order, so that haystack size
      and target multiplicity are separated and reported as two different numbers.'
  object_first_candidate:
    tracked_object: 'The fibre of the key-generation map: the set of secret oil modules consistent
      with one fixed public key, tracked through its exact cardinality t and through the group generated
      by the transformations relating its elements.'
    lossiness: 'Lossy. From the full fibre - a set of subspaces with their mutual geometry - we retain
      one integer per key, discarding which modules they are and how they sit relative to each other.
      That is compatible with the operation being tracked because the quantity that matters for any
      first-success search is the cardinality alone. The honest caveat, stated: the stabiliser prediction
      in Part B is a claim about the fibre''s GROUP structure, which the integer t does not carry,
      so Stage 4 must record the relating transformations too for that part; for Part B the projection
      to t alone would be too lossy, and the record says so rather than pretending one integer settles
      it.'
    propagation: 'The target operation is key generation followed by a search that stops at the first
      valid module. One step of the search tests one candidate. Propagation rule on the tracked object:
      the expected number of candidates tested before success is the haystack size divided by t, so
      the fibre size enters multiplicatively and directly. That gives a falsifiable consequence measurable
      in the same run - a first-success search over a randomly permuted enumeration should terminate
      after haystack/t tests on average - which is checked as an internal consistency test rather
      than presented as an attack.'
    survival_score: The object is defined for one key and does not iterate, so it survives one step.
      Its range of validity is instead the parameter range where enumeration is possible, which is
      concretely a Gaussian binomial below about 10^7, i.e. roughly q^{o(n-o)} <= 10^7; the experiment
      states exactly which cells that admits and does not guess beyond them.
  null_object_control: The null object is a plain UOV public key over F_q at the flattened dimensions
    of the structured key, with the identical oil dimension, enumerated by the identical routine in
    the same invocation. Its fibre size is the baseline t_0 against which the structured t is read.
    For the structured measurement to mean anything, the null must yield t_0 equal to the value forced
    by the plain-UOV symmetry group at those dimensions - a number computable in closed form - and
    if the null does not reproduce its own forced value, the enumeration or the annihilation test
    is wrong and no structured number may be read. A second null uses a uniformly random quadratic
    map with no planted oil module, whose fibre must be exactly 0.
  discriminated_from:
  - 'IDEA-20260805-70aa6e and H-SNOVA-ec84c2 Part A (counting free rank-k A-submodules): counts all
    candidate secrets independent of any key; this counts those consistent with one key, and the ratio
    of the two is exactly what neither record supplies.'
  - 'IDEA-20260805-54723a (multiplier algebra of the public key as a computable invariant): studies
    the symmetries of the PUBLIC object; the fibre is a set of SECRET objects, and a key can have
    a trivial multiplier algebra with a large fibre or the reverse.'
  - 'IDEA-20260813-5988b7 (certificate-fibre statistics of an attack system): fibres of a solving
    system''s solution set, not of the key-generation map; different map, different domain.'
  - 'IDEA-20260805-74349c (entropy of the oil space through the seed-expansion map): tracks entropy
    of the secret generation process; the fibre is a property of the resulting public key and is unchanged
    by how the secret was sampled.'
  - 'Standard equivalent-key arguments for multivariate schemes: those are structural statements about
    transformations that preserve a key''s form; here the fibre is measured by enumeration first and
    only then compared with a stabiliser prediction, so the measurement does not presuppose the structural
    account.'
  assumptions:
  - Enumeration is exhaustive at the tested cells, which is checked by comparing the enumerated candidate
    count against the closed-form Gaussian binomial or submodule count.
  - The annihilation test is a complete and sound criterion for a candidate module being a valid secret
    for the public key.
  - The recalled forms of the four transforms are correct in shape; a wrong form makes the structured
    arms measure the wrong fibre.
  - Tiny parameters admit at least one nonzero oil module in every arm, which the construction verifies
    before enumeration.
  - Exact F_q and A arithmetic throughout.
  predictions:
  - metric: fibre size of a random quadratic map with no planted module
    direction: different
    minimum_effect: 'forced value: exactly 0; a nonzero fibre here means the annihilation test is
      wrong and voids the run'
  - metric: fibre size of the structured arms relative to the flattened plain-UOV null
    direction: higher
    minimum_effect: 2
  - metric: ratio of measured fibre size to the closed-form stabiliser prediction
    direction: different
    minimum_effect: forced value 1; the reportable quantity is the deviation, and a deviation is the
      interesting outcome because it means valid secrets exist that no known symmetry relates
  - metric: mean candidates tested before first success in a randomly permuted enumeration, versus
      haystack size divided by measured fibre size
    direction: different
    minimum_effect: 'forced: must agree within a 100-trial interval, as an internal consistency check
      on both numbers'
  minimal_test:
    design: 'One arm pair, fully enumerated. Take q = 2, flattened n = 8, oil dimension o = 3, so
      the plain-UOV haystack is the Gaussian binomial [8 choose 3]_2 = 97155 subspaces - enumerable
      in seconds. Build a SNOVA-shaped key with ell = 2 over F_2 whose flattened dimensions are exactly
      (8, m, 3), and a plain UOV with the same flattened dimensions, both with a planted valid oil
      object. Enumerate every 3-dimensional F_2-subspace of F_2^8 for both keys and count how many
      annihilate the public map. Report the two integers, the closed-form stabiliser prediction for
      each, and the ratio. In the same invocation, enumerate against a uniformly random quadratic
      map of the same shape and confirm the fibre is exactly 0. Three integers and one forced zero
      already discriminate: equal fibres mean the structure adds no multiplicity, a larger structured
      fibre matching the stabiliser order confirms the account, and a larger fibre NOT matching it
      is an unexplained multiplicity worth its own record.'
    controls:
    - Flattened plain-UOV null at identical dimensions, enumerated by the identical routine in the
      same invocation.
    - Random-map control with no planted module, whose fibre must be exactly 0.
    - 'Enumeration completeness control: the number of candidates visited must equal the closed-form
      Gaussian binomial or submodule count exactly, catching an incomplete iterator.'
    - 'Change-of-basis invariance control: apply a random invertible transformation to both key and
      module and confirm the fibre size is unchanged.'
    - 'Planted-module positive control: the planted module must appear among the enumerated fibre
      members in every arm, or the enumeration is skipping valid candidates.'
    required_metrics:
    - exact fibre size t per key per arm
    - closed-form stabiliser prediction per arm
    - ratio of measured to predicted t
    - candidate count visited versus closed-form haystack size
    - mean candidates before first success over 100 permuted enumerations
    - list of transformations relating fibre members, for the group-structure half of the claim
  falsification_conditions:
  - The random-map control has nonzero fibre, voiding the annihilation test.
  - The enumeration visits a number of candidates different from the closed-form haystack size, meaning
    it is not exhaustive.
  - The planted module is absent from the enumerated fibre.
  - Structured and null fibres are equal at every cell, falsifying the excess-multiplicity claim at
    the tested scope and recording a controlled null.
  - The measured-to-predicted ratio differs from 1 at some cell, falsifying the stabiliser account,
    which is the outcome most worth having.
  confounders:
  - Enumerating subspaces rather than submodules in the structured arms, which would count objects
    the scheme cannot use; mitigated by enumerating both and reporting both counts separately.
  - Degenerate tiny parameters where almost every subspace is isotropic, inflating every fibre uniformly;
    mitigated by reporting the fibre as a fraction of the haystack alongside the raw count and by
    sweeping q.
  - A wrong recalled transform making a structured arm not the scheme it claims to be; unmitigable
    by measurement and recorded as a standing caveat.
  - Reading a large fibre as a security consequence, which requires a search procedure this proposal
    does not supply and which the claim ceiling forbids.
  - Characteristic 2 collapsing the distinction between symmetric and alternating forms and thereby
    changing what isotropy means; mitigated by including an odd-characteristic cell.
  interpretation_limits:
  - A fibre size is a counting fact; it becomes a cost statement only in combination with a search
    procedure, which is not part of this proposal.
  - Enumeration is possible only at cells with haystack below about 10^7, and nothing is claimed for
    larger parameters, where the fibre is not measured.
  - An unexplained multiplicity is a gap in the stabiliser account, not evidence of a weakness in
    any scheme.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement costs one annihilation test per
      candidate, so O(q^{o(n-o)}) tests per key, bounded by the 10^7 enumeration ceiling.
    memory_exponent: No attack memory exponent is claimed; the enumeration is streaming and stores
      only a counter and the fibre members found, which is O(t).
    best_known: 'The incumbent is the haystack count itself: H-SNOVA-ec84c2 Part A''s closed-form
      submodule counts and the Gaussian binomial for plain UOV. This proposal does not compete with
      those; it measures the second factor that turns a haystack into a target count, and no attack
      incumbent applies because no attack is proposed.'
    hidden_overhead: The hidden cost is the distinction between enumerating F_q-subspaces and enumerating
      A-submodules, which is easy to elide and which changes the answer by exactly the factor the
      experiment is trying to measure. A second overhead is that the group-structure half of the claim
      needs the fibre members retained, not just counted, which raises memory from O(1) to O(t) and
      is the only place the design is not free.
  dominated_by: n/a (no result claimed). Checked against each attack frontier row named in RQ-SNOVA-001
    - wedge-product, group-action stability, and the weak-key family - across time, memory and query
    axes; none is comparable because a fibre cardinality is not a cost on any axis and this proposal
    supplies no search.
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverable is
    an exactly enumerated integer fibre size per scheme per cell, its ratio to a closed-form stabiliser
    prediction, and the corresponding plain-UOV baseline at identical flattened dimensions.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'Part A (the fibre is exactly enumerable at some cells and is a well-defined
    integer): 0.9, since it is a finite computation with a completeness check. Part B (structured
    fibres strictly exceed the flattened plain-UOV fibre): 0.65, because the algebra''s unit group
    plausibly acts nontrivially but may already be quotiented out by how the module is defined, in
    which case the fibres coincide and that is a clean negative. Part C (the excess equals the closed-form
    stabiliser order exactly): 0.35, the weakest, because computing the right stabiliser - units of
    A intersected with the maps fixing the public form - is subtle and I expect the first prediction
    to be wrong by a factor whose identification would be the actual finding.'
