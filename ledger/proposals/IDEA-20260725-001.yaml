idea:
  id: IDEA-20260725-001
  title: Full-cost re-baselining of classical supersingular path-finding
  class: cost-model
  claim: >-
    Wiener-style full-cost accounting applied to classical supersingular
    path-finding (MITM vs low-memory collision search vs Delfs-Galbraith)
    may change which algorithm is the honest matched baseline for GOAL-SSI-001.
    No sub-p^{1/4} endomorphism-ring break is claimed.
  mechanism: >-
    Charge MITM table memory under KN-LIT-094 / KN-TECH-035, compare to a
    defined low-memory isogeny-graph collision-search analogue, and compare both
    to Delfs-Galbraith on F_p-rational instances, emitting a single matched-
    baseline recommendation.
  novelty_status: methodological
  question_id: RQ-SSI-001
