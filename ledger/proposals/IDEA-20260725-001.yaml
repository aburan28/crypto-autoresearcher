idea:
  id: IDEA-20260725-001   # placeholder: coordinator confirms/renumbers (no 20260725 IDs existed at 989e1cca)
  title: >-
    Two-arm degree ladder: which law bounds the admissible semi-regular window
    (freeze degree, 2*d_max Koszul onset, or support constraint)?
  class: measurement
  question_id: RQ-ECDLP-002
  claim: >-
    For the program's boolean chained-Semaev Macaulay instrument (degree
    histogram {2: n, 3: n} in nb = 2n boolean variables), the largest degree D
    at which a random system with that histogram attains rank_D = sr_pred(n, D)
    exactly (extra_D = 0) is D = 5 for every on-lattice n in {9, 12} AND for an
    UNCONSTRAINED full-support random system at n = 12 -- i.e. the admissible
    window boundary is D_max = 2*max(d_i) - 1 = 5, independent of n, and NOT
    D_max = freeze - 1 = n/3 + 2 as asserted in DEC-20260724-003 line 9.
    Concretely: the full-support arm at n = 12 D6 must return extra_6 >= 1
    (predicted within 20% of the 7,110 measured on the support-matched arm in
    RUN-EXP-SIG-008-n), while returning extra_5 = 0 exactly at n = 12 and
    extra_D = 0 exactly for D <= 4 at n = 6, 9, 12.
  mechanism: >-
    sr_pred is the truncated-positive coefficient sum of
    H(z) = (1+z)^nb / PROD_i (1+z^{d_i}); a system matches it at degree D iff
    every syzygy in degree <= D is a Koszul (trivial) syzygy of the generators.
    The Koszul syzygies of two generators of degrees d_i, d_j first live in
    degree d_i + d_j, so the first degree at which CUBIC-CUBIC pairs can
    interact is 2*3 = 6, independent of n. The recorded K6 family decomposition
    (EV-SIG-008: quad-quad 19,866 = C(12,2)*301, quad-cubic 3,600 = 144*25,
    cubic-cubic 66 = C(12,2)) confirms that degree 6 is exactly the birth degree
    of the cubic-cubic block at n = 12. The competing structural hypothesis
    (DEC-20260724-003) is that the boundary is the Hilbert-series freeze degree
    (first HF = 0), where the model's frozen quotient becomes unrealizable and
    a real quotient collapses to |V|. A third competing hypothesis is that no
    degree law is involved at all and the observed extra_6 = 7,110 is produced
    by the support-matching constraint that defines the N1 null (a random system
    on a PRESCRIBED sparse monomial support is not expected to be semi-regular).
    The three hypotheses make different predictions at cells that cost minutes,
    so a two-arm (full-support vs support-matched) ladder over
    D = 3..6 at n = 6, 9 plus one full-support confirmation cell at n = 12 D6
    separates them.
  why_not_renamed_known_approach: >-
    That structured Weil-descent / Semaev systems deviate from semi-regular
    Hilbert-series predictions is KNOWN (KN-TECH-011 "Applicability limits";
    Petit-Quisquater eprint 2012/146; Huang-Kosters-Yeo arXiv:1505.02532), and
    this proposal does not claim that deviation as a finding. What is proposed
    is a discriminating measurement of WHICH boundary law governs THIS
    instrument, using an arm the program has never run (a full-support random
    system with the same degree histogram). Every prior null in the SIG series
    (N0, N1, N2 in EV-SIG-006; N1 in EV-SIG-008) is support-constrained, so the
    support-constraint explanation has never been tested and is currently
    confounded with the degree law in every recorded number.
  novelty_status: adaptation
  assumptions:
    - "The pinned semireg_rank_pred implements the truncated-positive series
       exactly as documented in EV-SIG-006 (the textbook Bardet series does NOT
       match measured nulls -- using the wrong series silently changes every
       extra_D)."
    - "The instrument can build a full-support random boolean system with a
       prescribed degree histogram, and the existing rank staircase accepts it.
       This arm does not exist yet and must be written."
    - "n = 6 (GF(2^6), k = 2, t = 3) is constructible by src/semaev_tree.py. If
       the builder rejects n = 6 or the cell is degenerate (|V| pathological),
       the n = 6 rung is dropped and the ladder runs at n = 9, 12 only, which
       still discriminates support-constraint from degree but not
       2*d_max-1 from min(freeze-1, 2*d_max-1)."
    - "Hand-computed values requiring machine reproduction BEFORE use (computed
       by the idea generator with a method that exactly reproduces the recorded
       n = 9 HF [1, 18, 144, 645, 1566, 738, 0] and sr_pred(9,6) = 28,068):
       at n = 6, HF = [1, 12, 60, 142, 48, <=0] so freeze(6) = 5;
       sr_pred(6,5) = 1,586 - 263 = 1,323; sr_pred(6,4) = 794 - 263 = 531;
       sr_pred(6,6) = 2,510 - 263 = 2,247. These are NOT receipts."
    - "The rank6 code path is unaffected by the sems1 closure-path anchor
       mismatch recorded in RUN-EXP-SIG-008-o (see IDEA-20260725-003); if that
       control fails toward E2, this ladder's use of pinned anchors must be
       re-scoped."
  predictions:
    - metric: "extra_6 (full-support random arm, n = 12, D = 6)"
      direction: higher
      minimum_effect: ">= 1 (any non-Koszul syzygy); the 2*d_max law additionally requires |extra_6 - 7,110| <= 1,422 (20% of the support-matched value in RUN-EXP-SIG-008-n)"
    - metric: "extra_5 (full-support random arm, n = 12, D = 5)"
      direction: lower
      minimum_effect: "exactly 0; any extra_5 >= 1 falsifies the claim that the window reaches D = 5"
    - metric: "extra_D for D <= 4, both arms, all n in the ladder"
      direction: lower
      minimum_effect: "exactly 0; any nonzero value is a control failure, not a law"
    - metric: "extra_5 (n = 6, both arms) -- the three-way discriminator"
      direction: different
      minimum_effect: "0 under the pure 2*d_max-1 law; >= 1 under both the pure freeze law and the composite min(freeze-1, 2*d_max-1) law"
    - metric: "between-seed coefficient of variation of extra_6 within the full-support arm (3 seeds, n = 12)"
      direction: lower
      minimum_effect: "<= 20%; a CV above 50% means no stable law exists at D6 and no baseline is recoverable there"
  minimal_test:
    design: >-
      Two arms x degree ladder. Arm A (NEW): full-support random boolean system
      with histogram {2: n, 3: n} in nb = 2n variables, dense coefficients, no
      support constraint -- its degree-D Macaulay matrix has the COMPLETE
      monomial column set. Arm B (existing): the recorded column-matched null
      construction. Cells: n = 6 and n = 9 at D = 3, 4, 5, 6 (both arms, 3 seeds
      each; every cell is under ~35k columns and runs in minutes), then ONE
      confirmation cell, n = 12 D6 arm A only (183,312 x 190,051 over GF(2),
      run with the existing resume-safe checkpointed staircase). For every cell
      record rank_D, ncols_D, nrows_D, sr_pred(n,D), deficit_D, kernel_dim_D,
      rankK_D, extra_D = kernel_dim - rankK, freeze(n) recomputed from the
      pinned series, and |V| by full 2^nb enumeration where nb <= 18.
      Interpretation map fixed BEFORE execution:
      (i) arm A extra_6 = 0 at n = 12 -> the 7,110 is a support-matching
      artifact; the freeze theory survives and EV-SIG-008's censored gate 1 is a
      statement about the null construction, not the model;
      (ii) arm A extra_6 >= 1 at n = 12 AND arm A extra_5 = 0 at n = 6 -> the
      2*d_max-1 law; sr_pred is invalid at every D >= 6 on this lattice and
      EXP-SIG-008 gate 2 can never be admissible as specified;
      (iii) arm A extra_6 >= 1 at n = 12 AND arm A extra_5 >= 1 at n = 6 ->
      the composite min(freeze-1, 2*d_max-1) law;
      (iv) arm A extra_D >= 1 at any D <= 4 -> instrument/control failure, no
      law is inferred.
    controls:
      - "sr_pred(n, D) recomputed from the pinned semireg_rank_pred for every cell before any comparison; freeze(n) reported as measured, never assumed to be n/3+3."
      - "Instrument identity: reproduce the recorded n = 9 seed 1 anchors (N0 D6 rank 31,179, extra 4,986; D3/D4/D5 extra 0) and the n = 12 seed 2 D5 null anchors (rank 29,418, extra 0) before any new cell is admitted (EV-SIG-006, EV-SIG-008 gate 3)."
      - "Structural row-count assertion: nrows_D == n*|deg <= D-2| + n*|deg <= D-3| (at n = 12 D6 this is 12*12,951 + 12*2,325 = 183,312, matching RUN-EXP-SIG-008-d/n)."
      - "Independent recount of extra_D from kernel_dim_D - rankK_D and, separately, from sr_pred - rank; the two must agree."
      - "Determinism rebuild of at least one cell per (n, arm)."
      - "Column-set completeness assertion for arm A: ncols_D == total squarefree monomials of degree <= D in nb variables (e.g. 190,051 at n = 12, D = 6)."
      - "Matched-control note: this measures a baseline instrument, so Pollard rho / BSGS matched controls are not applicable; the record must say so explicitly rather than omit them."
    required_metrics:
      - rank_D
      - ncols_D
      - nrows_D
      - sr_pred_n_D
      - deficit_D
      - kernel_dim_D
      - rankK_D
      - extra_D
      - freeze_n_measured
      - variety_size_V
      - per_seed_cv_extra_6
      - wall_seconds_per_cell
      - peak_rss_gb
    budget: >-
      <= 4 h total wall clock and <= 16 GB RSS. The n = 6 and n = 9 rungs are
      expected in minutes (largest is n = 9 D6 at 31,180 columns). The single
      n = 12 D6 arm-A cell is the cost driver: budget it as <= 2 h across
      resumable units of <= 240 s each, by analogy with the recorded
      RUN-EXP-SIG-008-f..n chain (secs_total 1,182 over 11 units, peak RSS
      7.5 GB at 174,033 columns; arm A has 9.2% more columns). A censored
      staircase is NOT a negative result (AGENTS rule 5).
  falsification_conditions:
    - "Arm A at n = 12 D6 returns extra_6 = 0 (rank exactly 156,520) -> the claim is FALSE; the boundary is not 2*d_max-1 and the support-matching constraint is the operative variable."
    - "Arm A returns extra_D >= 1 at any D <= 4 for any n -> control failure; the run yields no law and the claim is untested, not confirmed."
    - "Arm A at n = 12 D6 returns extra_6 >= 1 but |extra_6 - 7,110| > 3,555 (50%) -> the 'same mechanism on both arms' reading is falsified; support constraint contributes materially and the law claim as stated fails."
    - "Between-seed CV of extra_6 in arm A exceeds 50% -> no deterministic degree law; the claim of a fixed D_max is falsified."
    - "Arm A extra_5 >= 1 at n = 12 -> the window does not even reach D = 5 and the claim is falsified in the direction of a stricter bound."
    - "The n = 12 D6 arm-A staircase does not complete within budget -> INCONCLUSIVE, not negative (AGENTS rule 5); the n = 6 / n = 9 rungs still stand on their own."
  confounders:
    - "Support constraint vs degree law -- the whole point of the two-arm design; a single-arm result cannot separate them."
    - "Instrument drift: RUN-EXP-SIG-008-o records pass: false on the D5 closure anchor (A4_5 = 242 vs expected 444, A3_5 = 242 == expected, rankK5 = 2,093 == expected) with halt reason 'D5 closure anchor mismatch -- method/instrument drift', despite instrument_sha256_matches_pinned: true. Closure-engine quantities must not be used by this ladder until IDEA-20260725-003 resolves that."
    - "Series semantics: EV-SIG-006 records that the textbook Bardet series (1,683/9,675/28,239 at n = 9) does NOT match measured nulls while the pinned in-place loop does. Silently swapping series changes every extra_D."
    - "n = 6 degeneracy: on GF(2^6) with a 2-dimensional subspace the factor base is tiny and |V| may be pathological; a degenerate cell is an infrastructure outcome, not evidence about any law."
    - "Column-prefix ordering changes intermediate staircase yields but not the final rank; only completed staircases (done: true, cols_fraction 1) may be read."
    - "The reference value extra_6 = 7,110 currently rests on ONE seed and ONE construction (RUN-EXP-SIG-008-n) and has never been replicated."
    - "Dense arm-A polynomials change memory locality and echelon cost; a timing difference between arms is not evidence about syzygies."
  interpretation_limits:
    - "claim_tier: toy. Binary-field GF(2^n) Weil-descent proxy at n <= 12; nothing here is a prime-field ECDLP statement and nothing is crypto-scale (AGENTS rule 7)."
    - "This bounds the validity of the BASELINE only. It says nothing about the sem arm's residual/cascade law and does not by itself admit or inadmit any sem D6 quantity."
    - "A confirmed 2*d_max-1 law would be a statement about this generator-degree histogram on this lattice, not a general theorem about semi-regularity."
    - "Deviation of Semaev/Weil-descent systems from semi-regular predictions is prior art; only the boundary-law discrimination is new here."
