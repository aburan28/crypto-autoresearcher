idea:
  id: IDEA-20260818-e0ce51
  question_id: RQ-QALG-122b59
  added: '2026-08-18'
  proposed_by: idea-generator
  title: >-
    "2^{66}" IS NOT A COST, IT IS AN ITERATION COUNT: charge the reversible
    Gaussian-elimination oracle, the MAXDEPTH limit and the logical-qubit
    width, and decide whether Grover-Prange still beats classical ISD on HQC at
    all -- the answer moves by 54 bits across NIST's three depth budgets and
    flips sign at MAXDEPTH 2^{40}
  class: measurement

  claim: >-
    This RQ's declared comparison baseline, "Grover/quantum-walk-accelerated
    ISD", is universally quoted as an ITERATION COUNT of 2^{w(1+o(1))} --
    2^{66} at HQC-128. Under matched accounting it is not a cost. Charging
    (a) the reversible Gaussian-elimination oracle at about 2^{43} Toffoli-
    equivalents and about 2^{28} layers of depth per iteration, (b) NIST's
    MAXDEPTH constraint, and (c) logical-qubit width, the total gate cost of
    Grover-Prange against HQC-128 is N * d * g / MAXDEPTH, giving
    2^{109.3} at MAXDEPTH 2^{96} (unconstrained, since serial depth 2^{94}
    fits), 2^{139.3} at MAXDEPTH 2^{64}, and 2^{163.3} at MAXDEPTH 2^{40} --
    a 54-bit spread. The classical ISD+DOOM row under the same accounting is
    about 2^{153} gate-equivalents. THE ORDERING THEREFORE FLIPS: at MAXDEPTH
    2^{96} quantum wins by about 44 bits, at 2^{64} by about 14 bits, and at
    2^{40} classical ISD WINS BY ABOUT 10 BITS. Separately, the width charge is
    about 2^{29} logical qubits if the permuted parity-check matrix is
    materialized coherently, which is a resource no record in this corpus has
    ever stated for this target. The claim is falsifiable in a specific and
    likely direction: if the quasi-cyclic structure admits a Prange oracle
    costing O~(n) ring operations instead of O(n^3) bit operations, then
    g drops to about 2^{28}, d to about 2^{15}, the MAXDEPTH-2^{40} cost drops
    to about 2^{135}, and quantum wins at every depth budget. Which of those
    two worlds we are in is currently unknown in this corpus and is decidable
    on paper. THE (g, d, width) ESTIMATES ARE THIS RECORD'S WEAKEST COMPONENT
    AND ARE NOW KNOWN TO BE POSSIBLY SUPERSEDED: see citations KN-LIT-aa3372,
    KN-LIT-072f64 and KN-LIT-37562e.
  mechanism: >-
    Grover-Prange amplifies over information sets with marked fraction
    p = C(n,2w)/C(2n,2w) ~ 2^{-2w}, so the ITERATION COUNT is
    N_it = p^{-1/2} = 2^{w}. Each iteration must, coherently and reversibly:
    apply a superposed column permutation to the known parity-check matrix,
    run Gaussian elimination to systematic form, and test whether the syndrome
    reduces to weight 0 on the redundancy part. On an n x 2n binary matrix that
    is about 2 n^3 = 2^{43.3} controlled row-XOR operations at HQC-128, with
    depth about n^2 = 2^{28} because eliminations against a single pivot
    parallelize across columns but pivots are sequential. Three charges then
    apply and each is a standard, uncontroversial accounting step that is
    nevertheless absent from the quoted baseline.
    (1) GATE COUNT: serial total = N_it * g = 2^{66} * 2^{43.3} = 2^{109.3}.
    (2) DEPTH: serial total = N_it * d = 2^{66} * 2^{28} = 2^{94}. Under a
    depth budget D < that, Grover must be parallelized, and parallel Grover
    buys only sqrt(P): with P machines the depth is d * sqrt(N_full/P) where
    N_full = p^{-1} = 2^{2w}, so P = N_full d^2 / D^2 and the total gate cost
    becomes N_full * d * g / D -- LINEAR in the search space, not square root,
    once the depth limit binds. That linearity is the whole phenomenon: below
    the serial-depth point, Grover's quadratic advantage degrades continuously
    toward none.
    (3) WIDTH: materializing the permuted matrix costs about 2 n^2 = 2^{29.2}
    logical qubits; recomputing it from a compact O(n) representation trades
    width for depth and moves d, which moves the MAXDEPTH answer. This is a
    genuine tradeoff curve, not a footnote.
    The measurement is to build that curve, under one stated cost model, for
    HQC-128/192/256, for Grover-Prange and for quantum-walk BJMM/MMT (whose
    additional QRACM charge is separate and larger), against the classical
    ISD+DOOM row computed under the SAME unit, and to report where the
    ordering flips.
  novelty_status: unverified

