  assumptions:
    - >-
      The unit of account is the logical Toffoli-equivalent gate and the
      logical circuit layer; no physical-qubit or error-correction overhead is
      modelled, and every conclusion is therefore about LOGICAL cost only.
    - >-
      Classical ISD is charged in bit operations converted to the same unit at
      1 bit-op = 1 gate, which FAVOURS THE CLASSICAL SIDE if anything and is
      stated so the bias direction is known.
    - >-
      Grover-Prange, not quantum-walk BJMM, is the primary row, because it is
      QRAM-free; the walk row is reported separately with its QRACM charge
      shown, never merged into a single "quantum" number.

  object_first_framing:
    established_families_declared_off_limits_as_primary_lens:
      - All attack families. This record proposes no attack and no new tracked
        object in the attack sense; its object is the COST FUNCTIONAL.
    tracked_object: >-
      THE COST FUNCTIONAL of an attack, projected onto the 4-tuple
      (gate count, circuit depth, logical width, QRAM cells) under one fixed
      unit -- rather than onto the single scalar "iteration count" that the
      baseline is currently quoted in.
    lossy_projection_test: >-
      PASSES, and this is one of the rare cases where the currently-used object
      FAILS it in the opposite direction: "iteration count" is not too lossy,
      it is lossy INCOMPATIBLY. It discards the per-iteration cost, but the
      discarded part does not stay discarded under the operation that matters
      (imposing a depth limit), because MAXDEPTH acts on d and g and then feeds
      back into the total. So the projection to a scalar does not propagate
      deterministically under the target's own accounting operations -- which
      is precisely the failure mode section 2 of the inventor protocol
      describes, and it is why 2^{66} cannot be compared to 2^{125} at all.
      The 4-tuple does propagate: parallelization, depth limiting and
      recompute-vs-store transformations each act on it by explicit closed-form
      maps.
    survival: >-
      The 4-tuple survives every accounting transformation considered
      (serial/parallel, depth-limited, recompute-vs-store, QRAM-charged), which
      is unusually far, and it dissolves only when physical-layer error
      correction is introduced, where the mapping from logical to physical is
      architecture-dependent. That boundary is stated, not crossed.

  proof_search_map:
    bottleneck: >-
      The per-iteration reversible oracle cost (g, d) for coherent Gaussian
      elimination on the permuted parity-check matrix. Every column of the
      table is a function of it, and the sign of the quantum-vs-classical
      comparison at MAXDEPTH 2^{40} turns on it alone. KN-LIT-aa3372 may
      already supply it as a measured rather than estimated quantity.
    baseline_embedding:
      parameter_slice: >-
        MAXDEPTH -> infinity and g = d = 1. The table must then reproduce
        exactly the currently quoted numbers: 2^{66} quantum, 2^{125} classical
        (with DOOM) at HQC-128. This is the old-method boundary and the
        reproduction is an identity, not an approximation.
      reproduction_check: >-
        Symbolic substitution into the cost expression, plus a frozen fixture
        asserting the two numbers to the bit. Any implementation that cannot
        reproduce the naive numbers in the naive limit is discarded.
    observation_collision:
      observable: 'the 4-tuple (gates, depth, width, QRAM cells)'
      distinct_preimage_search: >-
        A real collision exists and must be reported rather than resolved: two
        oracle implementations with the same GATE COUNT can have depths
        differing by orders of magnitude (a fully sequential elimination versus
        one parallelized across columns), and under a binding MAXDEPTH they
        give different total costs. Therefore gate count alone is NOT an
        identifying observable and the table must carry depth as a first-class
        column, never as a derived one. The separating condition is the
        parallelization structure of the elimination, which must be stated per
        row. This is also why KN-LIT-072f64's qubit-reduced oracle cannot be
        adopted on its width figure alone: its depth must be carried with it.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A cost measure charging gates, depth, width and QRAM over
          provably disjoint blocks (oracle / diffusion / state preparation),
          realized by a specific circuit decomposition rather than an
          asymptotic.
        predicted_gain: >-
          A concrete-cost table meeting docs/target-result-profile.md C13-C15,
          which no record for this target currently has.
      - transform: observable_fiber
        proposed_object: >-
          Hold the iteration count 2^{66} fixed and vary the oracle
          implementation (dense O(n^3) elimination versus a quasi-cyclic
          O~(n)-ring-operation variant, versus KN-LIT-072f64's qubit-reduced
          variant); the intrinsic invariant distinguishing them is the total
          cost under a binding MAXDEPTH.
        predicted_gain: >-
          Isolates the single open technical question -- does a cheap
          quasi-cyclic Prange oracle exist -- as the thing that decides a 28-bit
          swing, rather than leaving it inside an unexamined constant.
    quantifier_order: >-
      FOR ALL depth budgets D in {2^{40}, 2^{64}, 2^{96}, infinity} and FOR ALL
      standardized parameter sets P, THERE EXISTS a stated cost model M and a
      computed 4-tuple T(D, P, algorithm) such that the ordering of the quantum
      and classical rows under M is determined. The model M is EXISTENTIALLY
      quantified and chosen once, before the numbers -- if M is chosen after
      seeing which ordering it produces, the record is worthless, and freezing
      M in the experiment contract before execution is therefore mandatory.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under cost model M, at HQC-128/192/256, the logical gate cost of
        Grover-Prange and of quantum-walk BJMM/MMT versus classical ISD+DOOM is
        as tabulated, and the ordering flips between MAXDEPTH 2^{64} and
        2^{40}." It can NEVER certify anything about physical-qubit cost, about
        the existence of a better oracle, or about the mathematical hardness of
        QC-SD.
      nearby_object_control: >-
        Apply the identical pipeline to AES-128 key search, where
        MAXDEPTH-charged Grover costs are published and independently known. If
        the pipeline does not reproduce the known AES numbers, it is
        mis-calibrated and the HQC numbers are void. THIS IS THE SINGLE MOST
        IMPORTANT CONTROL IN THE RECORD and it costs almost nothing.
    proof_obligations:
      - claim: 'oracle gate count g and depth d for coherent GE on an n x 2n matrix'
        responsibility: runtime
      - claim: 'logical width for materialized vs recomputed matrix'
        responsibility: memory
      - claim: 'total cost = N_full * d * g / D once the depth limit binds'
        responsibility: runtime
      - claim: 'the table reduces to 2^{66} / 2^{125} in the naive limit'
        responsibility: baseline
      - claim: 'classical ISD charged in the same unit'
        responsibility: interface
      - claim: 'AES-128 calibration reproduces published MAXDEPTH-charged costs'
        responsibility: correctness
      - claim: 'conclusions are logical-cost only, not physical'
        responsibility: scope
      - claim: '(g, d, width) are taken from KN-LIT-aa3372/072f64/37562e where those supersede the estimates'
        responsibility: baseline

  predictions:
    - metric: 'Grover-Prange total logical gate cost at HQC-128, MAXDEPTH = 2^{96}'
      direction: higher
      minimum_effect: 'predicted about 2^{109} (vs the quoted 2^{66}); at least 2^{100}'
    - metric: 'Grover-Prange total logical gate cost at HQC-128, MAXDEPTH = 2^{40}'
      direction: higher
      minimum_effect: 'predicted about 2^{163}'
    - metric: 'classical ISD + DOOM total gate-equivalent cost at HQC-128'
      direction: higher
      minimum_effect: 'predicted about 2^{153} (vs the quoted 2^{125})'
    - metric: 'sign of (classical cost - quantum cost) at MAXDEPTH = 2^{40}'
      direction: different
      minimum_effect: >-
        PREDICTED NEGATIVE, i.e. classical ISD cheaper than Grover-Prange by
        about 10 bits at HQC-128. This is the headline prediction and the one
        most likely to be wrong; a positive sign means Grover-Prange survives
        the most conservative depth budget and the RQ's baseline stands as
        quoted. NOTE that adopting KN-LIT-aa3372's measured (g,d) could move
        this either way, and adopting KN-LIT-072f64's qubit-reduced oracle
        would likely make it MORE negative via higher d.
    - metric: 'logical qubit width for the materialized-matrix oracle at HQC-128'
      direction: higher
      minimum_effect: >-
        predicted about 2^{29}; any value below 2^{20} contradicts the estimate
        and must be explained -- and KN-LIT-072f64 is the first place to look,
        since reducing exactly this number is its stated purpose.
    - metric: >-
        existence and cost of a quasi-cyclic Prange oracle using O~(n) ring
        operations rather than O(n^3) bit operations
      direction: different
      minimum_effect: >-
        If it exists with g about 2^{28}, d about 2^{15}, the MAXDEPTH-2^{40}
        quantum cost falls to about 2^{135} and the sign prediction above
        REVERSES. This is the record's genuine open question and its most
        valuable possible finding -- and the one least likely to be already
        answered by the three cited records, since none is described as
        exploiting quasi-cyclic structure.

  minimal_test:
    design: >-
      Paper-and-code accounting, zero cryptographic-scale execution.
      (0) RETRIEVAL PRE-STEP, GATING: read KN-LIT-aa3372, KN-LIT-072f64 and
      KN-LIT-37562e and record, per record, whether it supplies (g, d, width)
      under a unit comparable to model M. For each of the three columns, write
      down explicitly whether this record's estimate is CONSISTENT WITH,
      SUPERSEDED BY, or INDEPENDENT OF the published value, and adopt the
      published value wherever it supersedes. If all three columns are
      superseded, that is the correct outcome and the record proceeds with
      measured inputs rather than estimated ones.
      (1) FREEZE the cost model M in the experiment contract BEFORE any number
      is computed: unit, what counts as a gate, depth definition, width
      definition, QRAM charge, classical unit conversion.
      (2) CALIBRATE on AES-128 Grover key search: reproduce published
      MAXDEPTH-charged costs within 3 bits. If this fails, stop.
      (3) Derive or adopt g, d, width for the coherent Prange oracle at
      HQC-128/192/256 under the implementations available after step (0):
      dense O(n^3) elimination (materialized), a recompute-from-O(n)
      representation variant, KN-LIT-072f64's qubit-reduced variant, and, as a
      further row, a quasi-cyclic ring-arithmetic variant IF one can be written
      down -- if it cannot, record that as an explicit open item rather than
      assuming either answer.
      (4) Evaluate the total-cost formula across MAXDEPTH in
      {2^{40}, 2^{64}, 2^{96}, infinity} for Grover-Prange, for quantum-walk
      BJMM/MMT (with its QRACM column shown, never merged), and for classical
      ISD+DOOM in the same unit.
      (5) Emit the table plus the crossover MAXDEPTH at which the ordering
      flips, per parameter set.
    controls:
      - >-
        AES-128 CALIBRATION (mandatory, first after the retrieval pre-step):
        the pipeline must reproduce published MAXDEPTH-charged Grover costs for
        AES-128 within 3 bits. Without this the HQC numbers are unfalsifiable
        arithmetic.
      - >-
        NAIVE-LIMIT CONTROL: setting g = d = 1 and MAXDEPTH = infinity must
        reproduce 2^{66} and 2^{125} exactly. This is the null object for the
        accounting: it shows the machinery adds cost only where cost exists.
      - >-
        UNIT-SWAP CONTROL: recompute the whole table with the classical unit
        changed by a factor 64 (word operations instead of bit operations). The
        ORDERING conclusions must be robust to this; if a sign flip depends on
        the classical unit convention, the record must report the conclusion as
        convention-dependent rather than as a finding.
      - >-
        PUBLISHED-ORACLE CROSS-CHECK: where KN-LIT-aa3372 supplies (g, d),
        compare against this record's first-principles estimate and report the
        ratio. A large discrepancy is a finding about the estimate, not about
        HQC, and must be reported rather than quietly resolved in favour of
        either side.
      - >-
        STRUCTURAL TELL: the quantum advantage must DECAY MONOTONICALLY as
        MAXDEPTH decreases. An advantage that is flat across depth budgets means
        the depth charge is not wired into the computation at all -- the most
        likely implementation bug in this record and the easiest to miss,
        because the numbers still look plausible.
    required_metrics:
      - per-record consistency verdict from the retrieval pre-step (consistent / superseded / independent), per column
      - frozen cost model M, recorded before the numbers
      - AES-128 calibration deviation in bits
      - (g, d, width, QRAM) per algorithm per parameter set per oracle implementation, with source (estimated here vs adopted from a KN record)
      - total cost per MAXDEPTH per algorithm per parameter set
      - crossover MAXDEPTH at which classical and quantum orderings flip
      - sensitivity of every conclusion to the classical unit convention

  null_object_control: >-
    The NAIVE-LIMIT CONTROL is the null object: with g = d = 1 and no depth
    budget the pipeline must return exactly the currently quoted 2^{66} and
    2^{125}. This is what distinguishes "the accounting revealed a real cost"
    from "the accounting added a cost". The AES-128 calibration is the second,
    external null: a pipeline that cannot reproduce a known answer on a known
    target is measuring its own assumptions.

  falsification_conditions:
    - >-
      AES-128 calibration deviates by more than 3 bits from published
      MAXDEPTH-charged costs. The pipeline is wrong and no HQC number may be
      reported.
    - >-
      The naive limit does not reproduce 2^{66} / 2^{125} exactly. Falsifies
      the implementation.
    - >-
      The quantum advantage does not decay monotonically as MAXDEPTH decreases.
      Falsifies the implementation (the depth charge is not wired in).
    - >-
      The sign of (classical - quantum) at MAXDEPTH 2^{40} is POSITIVE at
      HQC-128, i.e. Grover-Prange still wins. Falsifies this record's headline
      prediction and CONFIRMS the RQ's baseline as quoted -- a completely
      satisfactory outcome that costs the same to obtain.
    - >-
      A quasi-cyclic Prange oracle with g about 2^{28} is exhibited. Falsifies
      the g estimate, reverses the sign prediction, and is a genuine positive
      finding about the baseline's strength.
    - >-
      KN-LIT-aa3372's measured (g, d) differ from this record's estimates by
      more than a factor 2^{5} in either column. Falsifies heuristic H1 and, if
      the difference is large enough, may falsify the headline sign prediction
      -- in which case the correct action is to supersede this record with one
      built on the measured values, not to defend the estimates.
    - >-
      Any ordering conclusion that flips under the unit-swap control. Falsifies
      that conclusion specifically; it is reported as convention-dependent.

  confounders:
    - >-
      CHOOSING THE COST MODEL AFTER SEEING THE ANSWER. The single largest risk,
      and the reason M must be frozen in the experiment contract. A cost model
      picked to produce a flip is not a measurement.
    - >-
      MIXING UNITS ACROSS ADOPTED SOURCES: adopting g from one published
      circuit and d from another, under different gate sets or depth
      definitions, silently produces a number belonging to no cost model. Every
      adopted value must carry its source's unit definition, and cross-source
      composition must be refused rather than approximated.
    - >-
      Toffoli-vs-CNOT accounting: Gaussian elimination is mostly CNOTs, which
      are nearly free in some fault-tolerant cost models and not in others.
      Report both a Toffoli-only and an all-gate column.
    - >-
      Classical ISD constants: the 2^{125} figure already includes DOOM's
      sqrt(n) and an assumed incremental-elimination cost. Different published
      estimators disagree by several bits; use at least two and report the
      spread rather than a point value.
    - >-
      Recalled MAXDEPTH values and recalled HQC parameters. Both must be
      re-read before publication.
    - >-
      Depth and width trade against each other continuously; reporting one
      point on that curve as "the" cost is itself the error this record exists
      to correct, so the deliverable must be a curve, not a scalar.

  interpretation_limits:
    - >-
      Every conclusion is about LOGICAL gate cost under one stated model. No
      claim about physical qubits, error-correction overhead, or wall-clock
      time is made or implied.
    - >-
      A finding that Grover-Prange loses to classical ISD at MAXDEPTH 2^{40} is
      NOT a statement that HQC is more secure than believed; it is a statement
      about how the quantum baseline should be quoted. HQC's security category
      claims are set by NIST's own methodology and are not adjudicated here.
    - >-
      This record produces no attack and no mathematical result. Its output is
      an accounting artifact that other records must cite.
    - >-
      The (g, d, width) estimates are this session's first-principles numbers
      and are NOT measurements. Where KN-LIT-aa3372, KN-LIT-072f64 or
      KN-LIT-37562e supply measured values, those supersede and this record's
      estimates must be discarded rather than averaged with them.
    - >-
      RQ-CSIDH-64343f is cited for METHOD ONLY. No CSIDH number, mechanism or
      conclusion transfers to quasi-cyclic syndrome decoding, and this RQ's
      isolation constraint forbids any such transfer.
    - >-
      The three sibling proposals in this wave (IDEA-20260818-f8dc30,
      -45b8ea, -d5668d) all quote 2^{66} as a baseline. Once this table exists,
      each of their sota_delta fields should be restated against the
      depth-charged row, and until it exists their deltas are stated against an
      iteration count -- which is disclosed in each of them and here.

  heuristic_assumptions:
    - id: H1
      statement: >-
        Coherent Gaussian elimination on an n x 2n binary matrix costs
        g = (1 + o(1)) * 2 n^3 controlled row-operations and has depth
        d = (1 + o(1)) * n^2 layers, when eliminations against a fixed pivot
        are parallelized across columns and pivots are processed sequentially.
      rigorous_support: >-
        The operation count is the exact classical count for Gauss-Jordan on an
        n x 2n matrix; reversibility adds ancillas and controlled operations but
        not asymptotic order. The classical statement this imitates is the
        standard O(n^3) elimination bound with its exact leading constant; the
        heuristic is only that the reversible implementation preserves the
        constant to within o(1). THIS ASSUMPTION MAY BE UNNECESSARY: if
        KN-LIT-aa3372 supplies measured (g, d) for a complete circuit, H1 is
        superseded by measurement and the validation plan below is replaced by
        the published figures.
      validation_plan: >-
        FIRST check whether KN-LIT-aa3372 / KN-LIT-37562e already report these
        quantities; if so, adopt and skip what follows. Otherwise: synthesize
        the reversible circuit explicitly at n in {64, 128, 256, 512} with a
        circuit-synthesis toolchain, count Toffolis, CNOTs and depth exactly,
        and fit against 2 n^3 and n^2. Compare the fitted constants against the
        asymptotic prediction; report the ratio at the largest n and state the
        extrapolation to n = 17669 as an extrapolation, with the fitted
        residual as its error bar. TAIL CHECK: the fit must be stable across
        the last two doublings; if the fitted exponent drifts, the
        extrapolation is invalid and the record reports a range, not a number.
      falsification_condition: >-
        Fitted exponent outside [2.8, 3.2] for gates or [1.8, 2.2] for depth at
        the largest synthesized n, or a constant more than 4x from the
        prediction, or disagreement with KN-LIT-aa3372's measured values by
        more than a factor 2^{5}.
    - id: H2
      statement: >-
        Under a binding depth budget D, the minimum total gate cost of parallel
        amplitude amplification over a search space of size N_full with
        per-iteration cost (g, d) is Theta(N_full * d * g / D), attained at
        P = N_full d^2 / D^2 machines.
      rigorous_support: >-
        Follows from the sqrt(P) parallel-Grover speedup and its matching lower
        bound (Zalka), which is the rigorous ingredient; the heuristic is only
        that partitioning the search space across machines incurs no additional
        per-machine overhead, which imitates the standard idealization used in
        every published MAXDEPTH analysis.
      validation_plan: >-
        Verify the formula symbolically, then verify numerically that it agrees
        with published MAXDEPTH-charged AES-128 Grover costs (the AES-128
        calibration control doubles as this assumption's validation). No
        sampling is involved; this assumption is validated by external
        agreement, not by measurement.
      falsification_condition: >-
        Disagreement with published AES-128 MAXDEPTH costs by more than 3 bits.
    - id: H3
      statement: >-
        Classical ISD + DOOM at HQC-128 costs about 2^{2w} / sqrt(n) iterations
        with about n^2 bit operations each under incremental elimination, i.e.
        about 2^{153} bit operations, uniformly across published estimators to
        within about 5 bits.
      rigorous_support: >-
        The iteration count is the standard Prange success probability with
        Sendrier's DOOM factor; the per-iteration incremental-elimination cost
        is the standard amortization. The heuristic is the 5-bit agreement
        across estimators, which imitates nothing and is simply an empirical
        expectation about the literature.
      validation_plan: >-
        Run at least two independent public syndrome-decoding cost estimators
        at HQC-128/192/256 and report the spread. Comparison target: the spread
        must be below 5 bits for the classical row to be quoted as a point
        value; otherwise it is quoted as an interval and every ordering
        conclusion is restated against the interval.
      falsification_condition: >-
        Estimator spread above 5 bits, in which case all sign conclusions must
        be restated as interval comparisons and any conclusion whose sign is not
        determined by the whole interval is withdrawn.

  target_complexity:
    time_exponent: >-
      No new algorithm; the record RESTATES the baseline's exponent under
      matched accounting. Grover-Prange at HQC-128: 2^{109.3} logical gates
      unconstrained, 2^{139.3} at MAXDEPTH 2^{64}, 2^{163.3} at MAXDEPTH
      2^{40}, versus the quoted 2^{66} iterations. Classical ISD+DOOM about
      2^{153} gate-equivalents versus the quoted 2^{125} iterations. All of
      these move if KN-LIT-aa3372's measured (g, d) supersede the estimates.
    memory_exponent: >-
      Grover-Prange: about 2^{29.2} logical qubits for a materialized permuted
      matrix, or O(n) = 2^{15.1} qubits with recomputation at higher depth --
      and KN-LIT-072f64 is specifically about improving this number, so the
      figure quoted here should be treated as an upper bound pending that read.
      NO QRAM. Quantum-walk BJMM/MMT: additionally QRACM proportional to the
      representation-list size, reported in its own column and never merged.
      Classical Prange: polynomial memory; classical BJMM: exponential memory,
      reported separately.
    qubit_and_depth_exponent: >-
      Depth is the record's subject: serial Grover-Prange depth 2^{94} at
      HQC-128, which fits MAXDEPTH 2^{96} and does not fit 2^{64} or 2^{40}.
      ERROR-CORRECTED HARDWARE IS ASSUMED THROUGHOUT AND NISQ IS EXCLUDED BY
      INSPECTION: a 2^{94}-depth circuit is not a NISQ object under any
      reading, and no proposal against this RQ should claim otherwise.
    best_known: >-
      The quoted baseline this record corrects: 2^{w(1+o(1))} = 2^{66}
      iterations (Grover-Prange), with quantum-walk BJMM/MMT claimed no better
      in the sublinear-weight regime up to o(1). The corpus records for the
      circuit-level realization of these algorithms are KN-LIT-aa3372,
      KN-LIT-072f64 and KN-LIT-37562e.
    hidden_overhead: >-
      THIS RECORD IS ABOUT THE HIDDEN OVERHEAD. The o(1) and the "poly" of the
      quoted baseline hide, at HQC-128: a factor 2^{43.3} in gates, a factor
      2^{28} in depth per iteration, about 2^{29} logical qubits, and -- once
      MAXDEPTH binds -- a change in the SCALING LAW from sqrt(N_full) to
      N_full/D, which is not an overhead at all but a different asymptotic.
    tradeoff_note: >-
      The deliverable is exactly the tradeoff surface: gates against depth
      against width, with MAXDEPTH as the constraint that selects a point on
      it, and with the recompute-versus-materialize choice moving along it.
      Parallelization is the mechanism by which the depth constraint converts
      into gate count, at sqrt(P), which is why the quantum advantage degrades
      continuously rather than discontinuously.

  dominated_by: >-
    'n/a (no attack claimed)' -- but the Pareto check was performed rather than
    asserted, because this record produces cost numbers that other records will
    cite, AND ITS ONE LIVE DOMINATION RISK IS NOW NAMED RATHER THAN
    HYPOTHETICAL. As a MEASUREMENT the record is not dominated by any PROPOSAL
    row: no record in this corpus contains a matched-accounting concrete-cost
    table for QC-SD at HQC's standardized parameters. Proposal rows checked for
    duplication rather than domination: (1) IDEA-20260815-eaa615 (QRAM charge)
    -- orthogonal axis, would pass Grover-Prange without comment;
    (2) IDEA-20260815-6ed3c9 (classical baseline attribution) -- chooses a row,
    does not price it; (3) IDEA-20260813-fe3c5e (sparse-regime baseline
    reproduction) -- fixes the leading exponent, not the multipliers.
    LITERATURE ROWS THAT MAY DOMINATE PARTS OF THIS RECORD, located by the
    coordinator's semantic screen after this record was written:
    (4) KN-LIT-aa3372, a COMPLETE quantum ISD circuit with no abstract oracle
    -- LIKELY DOMINATES THE (g, d) COLUMNS, since it measures what this record
    estimates; (5) KN-LIT-072f64, on reducing qubit count in quantum ISD --
    LIKELY DOMINATES THE WIDTH COLUMN for the same reason; (6) KN-LIT-37562e,
    circuit-resource efficiency without an exponent change -- likely dominates
    the constant factors. NONE OF THESE THREE HAS BEEN READ BY THIS SESSION, so
    "likely" is the strongest word the evidence supports and the retrieval
    pre-step of the minimal test exists to settle it. What survives domination
    in every case is the part none of the three is described as containing:
    the MAXDEPTH sweep, the matched-unit classical comparison, and the crossover
    depth D*. If reading them shows they contain those too, this record should
    be superseded, and that is a satisfactory outcome.
  sota_delta: >-
    'no attack; cost-model and measurement contribution only'. Quantitatively,
    the contribution is a predicted 43-bit correction to the quoted quantum
    baseline at MAXDEPTH 2^{96}, a 54-bit spread across NIST's three depth
    budgets, a 28-bit correction to the quoted classical baseline, and a
    predicted SIGN CHANGE in the quantum-versus-classical ordering between
    MAXDEPTH 2^{64} and 2^{40} at HQC-128. HONEST DISCOUNT: if KN-LIT-aa3372
    already supplies (g, d) and KN-LIT-072f64 the width, the ORIGINAL
    contribution reduces to the MAXDEPTH sweep and the matched-unit comparison,
    and the corrections above become restatements of published figures rather
    than new ones.

  obstruction:
    statement: >-
      Amplitude amplification's quadratic advantage is a property of ITERATION
      COUNT, not of cost, and it does not survive a binding circuit-depth
      budget: once depth is limited to D, the optimal parallel arrangement
      costs Theta(N_full * d * g / D) total gates, which is LINEAR in the
      search space. Any attack on QC-SD whose only quantum lever is amplitude
      amplification therefore has an advantage that is a function of the depth
      budget and can be zero. This is a claim about the OBJECT (the cost
      structure of amplitude amplification under a depth constraint), not about
      any attempt.
    quantity: >-
      (q1) the crossover MAXDEPTH D* at which classical ISD+DOOM and
      Grover-Prange have equal logical gate cost, per parameter set;
      (q2) the per-iteration oracle pair (g, d) for coherent Prange at each n;
      (q3) the logical width of the materialized-matrix oracle.
    value: >-
      NOT MEASURED BY THIS SESSION. No run exists. PREDICTED at HQC-128: D*
      between 2^{40} and 2^{64}, closer to 2^{50} on the stated estimates; g
      about 2^{43.3} Toffoli-equivalents, d about 2^{28} layers, width about
      2^{29.2} logical qubits. Units: gates, layers, logical qubits, all under
      a cost model that does not yet exist and must be frozen first.
      Predictions, not measurements (AGENTS rule 5). NOTE that q2 and q3 may
      ALREADY BE MEASURED IN THE LITERATURE (KN-LIT-aa3372, KN-LIT-072f64,
      KN-LIT-37562e); where they are, the published values supersede these
      predictions and this block must be rewritten around them rather than
      recording both.
    measured_by: []
    scope: >-
      Would be claimed only for HQC-128/192/256, logical-cost accounting under
      the frozen model M, Grover-Prange and quantum-walk BJMM/MMT, and the
      classical ISD+DOOM row as computed by the named estimators. Not claimed
      for physical cost, other algorithms, other targets, or other units.
    resource_check:
      examined: true
      reading: >-
        THE OBSTRUCTION IS THE HYPOTHESIS OF A PORTFOLIO-WIDE RESCORING, and
        the theory that wants it is this program's own ranking function. If the
        quantum advantage against QC-SD is a function of MAXDEPTH that can
        reach zero, then EVERY proposal in this RQ -- including the three
        siblings filed in this same wave -- is currently scored against a
        quantity that is not a cost, and the correct unit for
        recommended_priority is "bits gained at a stated depth budget", not
        "bits gained". That is a change to how the ledger ranks, obtainable
        from one table. A second reading: D* is a DEPLOYMENT-POLICY number --
        it is the depth budget below which HQC's quantum security equals its
        classical security, which is exactly the quantity a migration timeline
        needs and which no security-category statement provides. A third
        reading, now available because the coordinator's screen supplied
        RQ-CSIDH-64343f as method precedent: the pattern "one parameter set,
        many published quantum security levels, isolate the quantity the
        disagreement reduces to" has been posed in this program for a different
        primitive, so D* is an instance of a REUSABLE QUESTION SHAPE rather
        than a one-off -- and the shape, not the number, is what transfers. A
        fourth reading FAILED and is recorded: the 2^{29} width figure was
        checked as a possible resource for a time-memory-width tradeoff theory
        and none was found that turns a width requirement into an advantage; it
        is simply a cost.
      spawned_ids: []

  estimated_cost:
    implementation: medium
    compute: low
    detail: >-
      No cryptographic-scale execution. The retrieval pre-step is literature
      work. Circuit synthesis at n <= 512 for the H1 validation is core-hours
      AND MAY BE UNNECESSARY if KN-LIT-aa3372 supplies the figures. The
      cost-model evaluation is arithmetic. The AES-128 calibration requires
      locating and reproducing published numbers, which is literature work
      rather than compute. Implementation is medium because freezing a
      defensible cost model and calibrating it externally is the hard part, and
      doing it sloppily produces a table that looks authoritative and is not.

  recommended_priority: high
