idea:
  id: IDEA-20261017-bbc53e
  question_id: RQ-PFDR-ae2fba
  added: '2026-10-17'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Break-even excess for coincidence-harvested relations: kappa must reach the
    unknown count U, the delta-to-exponent translation, and weighted-base plants
    that calibrate it
  class: control
  claim: >-
    Stage: relation decomposition by coincidence harvest. Relations needed are
    c*U (c in 0.92..1.0; U = base points with unknown logarithm). S stored sums
    give kappa*S^2/(2N) independent relations, kappa the excess over a matched
    random base, so T = sqrt(2cUN/kappa). (i) T < sqrt(pi N/2) iff kappa >
    ~1.27*c*U. (ii) kappa(N)=N^delta at fixed (h,U) moves the time exponent by
    exactly -delta/2. (iii) Break-even delta*(h) = 1/(2h-1): 1/3, 1/5, 1/7 at
    h=2,3,4, against Part C's planned resolution ~0.003, so a Part C G+ is
    sub-break-even structure unless delta >= delta*. (iv) Plant: the base
    F' = {cP : P in F_0, 1<=|c|<=c_0}, c_0 = N^gamma, shares one unknown among
    2*c_0 members. At h=2 the TT S3-solve exponent falls from 2/3 to
    (2/3)(1-gamma) with base size re-optimised, and never below 1/2.
  mechanism: >-
    Pair (R1 labels with integer weights, Sigma = translation by base elements
    and scaling of a base element by a known integer). Trichotomy: partial-action,
    Class I of IDEA-20260806-c5d183. Tracked object: the relation lattice of the
    base projected to the number U of unknowns it must determine. Lossy-projection
    test: U discards which logs are unknown; translation and scaling by c send a
    relation to a relation with column c*e_i, so the discard is Sigma-compatible,
    and it is lossy (S sums collapse to one integer). The shared-unknown base is
    a log-domain GAP, the generic weighted-BSGS member of the family: a plant for
    kappa growth, not an attack. Per-attempt dual: IDEA-20260808-812554 (sigma
    threshold); this is the coincidence-harvest threshold. Generic anchor:
    n-instance DL is Omega(sqrt(nN)) in a generic group (Yun 2015, abstract
    retrieved), a heuristic anchor only. Not a new factor base; KN-OPEN-020
    class: none. F2 is the lens, nothing else added.
  novelty_status: unverified
  citations:
    - ref: eprint 2014/637 (Yun, EUROCRYPT 2015)
      provenance: retrieved
      claim: generic lower bound Omega(sqrt(nN)) for n discrete logs in a group of order N
      verified_by: idea-generator 2026-10-17, abstract in search result; full text not read
    - ref: IDEA-20260808-812554
      provenance: internal
      claim: C_rel = m! N B^((m-1)(sigma-1)); beating rho needs sigma < 1 - 2/(m-1)
      verified_by: idea-generator 2026-10-17, claim opened
  assumptions:
    - The engine accepts a base-size override and a weighted base (extension, medium).
    - Executor maps each Part C cell (TT3, TT4, SS3, SS5) to (h, U) from the source.
    - Plant valid while U = N^((1-2h*gamma)/(2h-1)) >= 4.
  predictions:
    - metric: tau = fitted slope of log2(S3 solves) on log2 N, bits 20..32
      direction: lower
      minimum_effect: >-
        0.67, 0.63, 0.60, 0.57 at gamma 0, 0.05, 0.10, 0.15, each within 0.04;
        tau(0) - tau(0.10) >= 0.04 with CI excluding 0
    - metric: tau for an unshared random base of the same enlarged size
      direction: different
      minimum_effect: stays within 0.04 of 0.67 (no saving without sharing)
  minimal_test:
    design: >-
      Phase 0, no compute: derive T(kappa,U,h), delta*(h), and the table of
      delta* for TT3, TT4, SS3, SS5. Phase 1: 5 curves x bits 20,22,...,32 x
      gamma in {0,0.05,0.10,0.15}, TT engine m=3, counts as in the README
      (S3 solves, la_ops, table entries, rank at stop).
    controls:
      - gamma=0 reproduces 0.66 [0.65,0.68] on the same curves.
      - Unshared random base of equal size isolates sharing from size.
      - Rho on the same curves.
    required_metrics: [tau with CI, U, base size, relations at stop, rank, c = relations/U]
  falsification_conditions:
    - tau(gamma=0.10) >= 0.65 refutes (iv) at this scope; report duplicates and rank deficit.
    - Any tau < 0.50 contradicts the generic floor; audit for a counting bug before any reading.
    - The unshared control also saving means a size effect, not sharing.
  confounders:
    - Trivial coincidences c*P_i + c'*P_i; restrict to distinct indices.
    - The exponent fit over 12 bits of N mixes constants with exponents.
  interpretation_limits:
    - Generic model; says nothing about whether any real base has kappa > 1.
    - delta* is a threshold for crossing rho in time only; memory is not priced.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Coincidences among sums of distinct-index weighted base points yield
        independent relations at rate kappa*S^2/(2N), kappa=1 for random logs.
      rigorous_support: >-
        For fixed nonzero v, sum v_i u_i = 0 mod N has probability 1/N for
        uniform logs; pair counting gives the rate. Generic multi-DL bound (Yun).
      validation_plan: >-
        Measure independent rows against prediction at 6 sizes and 4 gamma;
        multiplicity histogram of difference vectors; flag rank deficit.
    - id: H2
      statement: The stopping constant c stays in 0.9 to 1.1 under weights.
      rigorous_support: 0.92 at m=3 measured (README); 2-core threshold 0.818 for 3-uniform.
      validation_plan: relations at stop divided by U, per cell, 5 curves x 6 sizes.
  target_complexity:
    time_exponent: h/(2h-1) -> (h/(2h-1))(1-gamma), floor 1/2 at U=1
    memory_exponent: same as time (table)
    best_known: rho N^(1/2); measured TT3 0.67
    hidden_overhead: 2c_0, m!, stopping constant; fit window is 12 bits
    tradeoff_note: weights trade table size for unknown count; no point crosses rho
  estimated_cost: {implementation: medium, compute: low}
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked: [KR-IC-5931ee, KR-IC-5a43e5, KR-IC-955fd6, KR-IC-f3da82, KR-IC-5765d2, KR-RHO-7d93f6, KR-RHO-13bf67, KR-RHO-cd0049, KR-IC-791cb7]
    nearest:
