  dominated_by: n/a for the control; the calibrated family is dominated by rho (T >= sqrt(UN/kappa), U>=1; KR-RHO-7d93f6, Yun)
  sota_delta: no attack; plant exponent (2/3)(1-gamma) against measured 0.66, floor 1/2
