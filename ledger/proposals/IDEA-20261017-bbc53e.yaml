        relation: adjacent
        delta: generic C-collision tradeoff, applied to rows over U unknowns, giving kappa >= U
      - ref: KR-IC-955fd6
        provenance: internal
        relation: adjacent
        delta: symmetry gives kappa_eff = |Aut|, a constant; here kappa_eff = N^gamma is planted
      - ref: KR-RHO-cd0049
        provenance: internal
        relation: adjacent
        delta: measured negation BSGS at 1.160 x floor is the U=1 endpoint (gamma = 1/(2h)) the plant tends to
      - ref: KR-IC-5931ee
        provenance: internal
        relation: adjacent
        delta: naive Semaev cannot beat generic there; this gives the excess a base would need
      - ref: KR-IC-f3da82
        provenance: internal
