        find_integer_2(s) with v = floor((L-1)/160), w = L - 160*v - 1, h = SHA-1(s),
        h0 the w rightmost bits of h, z_i = (z+i) mod 2^160, h_i = SHA-1(s_i), and
        h = h_0||...||h_v concatenated left to right with the first bit of the string
