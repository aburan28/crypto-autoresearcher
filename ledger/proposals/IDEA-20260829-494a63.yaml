  novelty_rationale: >-
    The L = 256 instance of the overlap is publicly documented and attributed to
    Bernstein and Lange 2013 by the SafeCurves-hosted page read this session, so
    that row is `known`. The general formula, the seven-row table, and the derived
    explanation of the exception at L = 160 I could not check: the BADA55 paper's
    Section 5 is named by that same page as containing "a detailed analysis" of the
    mechanism, AND I DID NOT OPEN THE PAPER. No web search was performed this
    session. Per agents/idea-generator.md the honest label is `unverified`, and a
    reviewer with retrieval must read BADA55 Section 5 before crediting C1, C2 or C3
    with anything. My own expectation is that C1 and C2 are already there in some
    form and that C3's v = 0 explanation may not be.
