idea:
  id: IDEA-20260829-494a63
  question_id: RQ-SCURVE-826a9f
  goal_id: GOAL-SCURVE-28e491
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    THE OVERLAP IS A FAMILY OF EXACT INTEGER IDENTITIES INDEXED BY L, AND 384 IS
    THE FIRST TWO-BLOCK, MID-STRING CASE - derive the general relation
    160(v-1) + w shared bits, evaluate it on all seven published Brainpool
    coefficient pairs with ZERO hashing, and let the one derived exception explain
    the published word "most" instead of leaving it as an anecdote.
  class: control

  claim: >-
    A publicly noted oddity in the Brainpool parameters - the repeated hex string
    26DC5C6CE94A4B44F330B5D9 shared between brainpoolP256r1's A and B - is
    reported in the literature as an observation about "most of the Brainpool
    curves". It is not an oddity and it is not about most; it is an EXACT INTEGER
    IDENTITY derivable in three lines from RFC 5639 Appendix A.2, it has a
    determined number of shared bits at every size, and its one exception is
    forced by the same formula. Five separable claims.

    (C1) THE GENERAL IDENTITY, PROVED, NO HASHING NEEDED TO CHECK IT. RFC 5639 A.2
    produces A = find_integer_2(s0) and, after ONE update_seed, B =
    find_integer_2(s0 + 1). With v = floor((L-1)/160) and w = L - 160v - 1, write
      A = h0(s0)*2^{160v} + H(s0+1)*2^{160(v-1)} + ... + H(s0+v),
      B = h0(s0+1)*2^{160v} + H(s0+2)*2^{160(v-1)} + ... + H(s0+v+1),
    where H is SHA-1 as an integer and h0(s) = H(s) mod 2^w. Then FOR EVERY SEED
    AND EVERY HASH FUNCTION:
      (i) for j = 1, ..., v-1:  floor(B / 2^{160j}) mod 2^160
                              = floor(A / 2^{160(j-1)}) mod 2^160;
      (ii) floor(B / 2^{160v}) = (floor(A / 2^{160(v-1)}) mod 2^160) mod 2^w.
    The number of shared bits at determined positions is therefore EXACTLY
    160(v-1) + w for v >= 1, and EXACTLY ZERO for v = 0.

    (C2) THE SEVEN-ROW TABLE, PREDICTED BEFORE ANY COMPUTATION.
      L = 160: v = 0, w = 159 -> 0 shared bits. THE IDENTITY IS VACUOUS.
      L = 192: v = 1, w =  31 ->  31 shared bits, one relation.
      L = 224: v = 1, w =  63 ->  63 shared bits, one relation.
      L = 256: v = 1, w =  95 ->  95 shared bits, one relation. This is the
               publicly quoted case.
      L = 320: v = 1, w = 159 -> 159 shared bits, one relation. THE LARGEST
               SINGLE-RELATION OVERLAP IN THE FAMILY, and nearly half of a
               319-bit coefficient.
      L = 384: v = 2, w =  63 -> 223 shared bits, TWO relations. THIS RECORD'S
               ROW.
      L = 512: v = 3, w =  31 -> 351 shared bits, THREE relations.

    (C3) THE DERIVED EXPLANATION OF "MOST". The literature reports the overlap for
    "most of the Brainpool curves". C1 says exactly which one is exempt and why:
    brainpoolP160r1, alone among the seven, has v = 0, so find_integer_2 emits a
    single truncated block and consecutive seeds share NOTHING. The exception is
    not an accident of that curve, it is forced by floor((L-1)/160) crossing from 0
    to 1 between L = 160 and L = 192. A qualitative "most" becomes a derived
    six-of-seven with a named mechanism, and that conversion is the record's
    cheapest contribution.

    (C4) WHY 384 IS NOT A RESTATEMENT OF 256, AND WHY IT IS THE ROW WORTH RUNNING.
    At L = 256 the single relation puts B's TOP block against A's BOTTOM block -
    head against tail - so the shared string appears as the last hex digits of A
    and the first hex digits of B, which is why a human noticed it. At L = 384 the
    dominant relation (i) with j = 1 puts B's MIDDLE 160-bit block against A's
    BOTTOM 160-bit block. The shared string therefore appears at hex offset 16 to
    56 of B against hex offset 56 to 96 of A - INTERIOR TO B, NOT AT ITS HEAD - and
    end-inspection of the published values does not reveal it. THE 384 CASE IS
    STRUCTURALLY THE SAME IDENTITY AND OPERATIONALLY INVISIBLE, which is the
    concrete reason this row has not been checked and is worth checking.

    (C5) THE VISIBILITY CORRECTION, WHICH SEPARATES AN EXACT CLAIM FROM AN EYEBALL
    ONE. Relation (ii) guarantees w shared bits; the VISIBLE hex repeat needs
    alignment to a multiple of four, and since A and B are L-1 bit integers printed
    in L/4 hex digits there is a leading pad bit. At L = 256, w = 95 and the visible
    repeat is 96 bits = 24 hex digits, so the eyeball version requires the extra
    coincidence that bit 95 of H(s0+1) is zero - which for brainpoolP256r1 it is,
    B's leading hex digit being 2. At L = 320, w = 159 and the same argument
    predicts a VISIBLE 40-hex-digit repeat WITH PROBABILITY ONE HALF, so
    brainpoolP320r1 either shows the largest visible repeat in the family or shows
    none at all, and which it is a coin flip that has already been decided and can
    be looked up in three lines. PREDICTING A COIN FLIP THAT HAS ALREADY LANDED IS
    NOT A PREDICTION, so the record registers this as an OBSERVATION TO BE MADE and
    not as a test; what IS a test is that the ARITHMETIC identity holds regardless
    of how the coin landed.

  mechanism: >-
    THE TRACKED OBJECT is the BLOCK-ALIGNMENT SIGNATURE of a coefficient pair: for
    each published (A, B) at size L, the vector of Booleans
      S(L) = ( [relation (i) holds at j] for j = 1..v-1 , [relation (ii) holds] ),
    together with the integer 160(v-1) + w it predicts. Everything about the curve
    is discarded - the prime, the base point, the order, the twist - and everything
    about the hash is discarded too, since no hash is ever evaluated.

    LOSSY-PROJECTION TEST, applied BEFORE any experiment, and it is unusually clean
    here.
    WHAT IS DISCARDED. Two coefficients of up to 511 bits each, at seven sizes, so
    roughly 4700 bits, collapse to at most 1 + 1 + 1 + 1 + 1 + 2 + 3 = 10 Booleans.
    Nothing about any coefficient survives.
    IS IT A CHANGE OF COORDINATES? No, and the argument is exact. The fibre over
    the all-true signature is the entire set of coefficient pairs produced at
    consecutive seed offsets, which for each size is a set of size about 2^160
    parameterised by the seed - so from S(L) one recovers no bit of A, no bit of B,
    and no seed. The projection is maximally many-to-one and the predicted value is
    a constant, which is the same unusual situation as
    IDEA-20260829-e37b52's residue vector: THE OBJECT IS INFORMATIVE PRECISELY
    BECAUSE ITS PREDICTED VALUE CARRIES NO CONTENT, so any deviation is a localised
    defect rather than noise.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS? Two operations matter and the
    answers differ, which is the interesting part. (i) SEED INCREMENT s0 -> s0 + 1,
    the operation the procedure itself performs: the signature is INVARIANT, since
    the identity holds for every seed. That invariance is what makes it a check on
    the RULE rather than on the instance. (ii) THE TWIST MAP r1 -> t1, that is
    A -> Z^4*A and B -> Z^6*B modulo p: THE SIGNATURE IS DESTROYED, because
    multiplication by Z^4 and Z^6 modulo a 256- or 384-bit prime does not respect
    160-bit block boundaries in any way. THE RETAINED PART THEREFORE PROPAGATES
    DETERMINISTICALLY UNDER THE FIRST OPERATION AND NOT AT ALL UNDER THE SECOND,
    and that asymmetry is a load-bearing scope limit, not a defect: THE TEST MUST BE
    RUN ON THE r1 COEFFICIENTS AND CANNOT BE RUN ON THE t1 ONES. Since this RQ names
    brainpoolP384t1, the record is explicit that auditing t1 means auditing the r1
    curve it is defined from, plus the Z map that links them.
    WHERE IT DISSOLVES. At v = 0, where there is nothing to share, and at the twist
    map, where the block structure is destroyed. Both boundaries are derived rather
    than discovered, and the first of them IS claim C3.

    WHY A SEVEN-ROW LATTICE AND NOT ONE CHECK. A single row's identity holding is
    consistent with coincidence at 2^{-w}, which at L = 384 is 2^{-223} and is
    already overwhelming - so why seven rows? Because THE SEVEN ROWS TEST DIFFERENT
    THINGS. Six of them test the identity; the seventh (L = 160) tests that the
    instrument correctly reports VACUITY rather than failure, which is the refusal
    control. The v = 1, 2, 3 rows test the general formula at three distinct block
    counts, so a formula that is right only for v = 1 - which is what one would
    write after looking at the 256 case alone - fails at 384 and 512. And the seven
    rows share ONE code path, so a per-size discrepancy localises to a size rather
    than being a global pass or fail. Twenty separate audits give twenty unverified
    numbers; one lattice gives a table in which every row checks the formula the
    others use.

    WHY THIS IS NOT IDEA-20260829-b70376. That record measures the REJECTION COUNT
    at L = 256 by a forward hash search bounded by a declared K_max, and proves the
    Z-uniqueness lemma. It touches the overlap only as its cheapest premise check at
    one size. THIS record never searches, never hashes, and never needs a seed: it
    is a pure integer-identity lattice over published data, it is the only test in
    this six-record batch that requires no hash evaluation at all, and it produces a
    general formula the other record uses as a special case. The two must AGREE on
    the L = 256 row and a disagreement halts both.

    WHY THIS IS NOT IDEA-20260829-ff7823. That record derives the same
    160(v-1) + w shared-bit count for the NIST chain, but there it relates c(s) to
    c(s+1) - TWO VALUES OF THE SAME QUANTITY AT DIFFERENT SEEDS, which is invisible
    in the published data because only one seed is published. Here it relates A to
    B - TWO DIFFERENT PUBLISHED QUANTITIES AT ONE SEED - which is directly checkable
    against the standard's own tables. Same formula, opposite observability, and
    that difference is exactly why the Brainpool overlap was noticed publicly and no
    NIST analogue was.

    EXECUTION. Step 1, derive C1 symbolically and freeze it as a unit test over
    stub-hash block contents at v = 0, 1, 2, 3. Step 2, transcribe the seven
    published r1 coefficient pairs from RFC 5639 Sections 3.1 to 3.7 with per-field
    provenance. Step 3, evaluate the identity on all seven, with no hashing. Step 4,
    the visibility computation of C5. Step 5, the synthetic null and the
    twist-destruction control. Step 6, the 384-specific extras - the seed-index
    check at substring position 6, and the Z reconstruction.

