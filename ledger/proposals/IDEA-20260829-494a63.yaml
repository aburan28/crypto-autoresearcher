  assumptions:
    - >-
      Executor has a shell and Python 3 with arbitrary-precision integers. NO HASH
      LIBRARY IS NEEDED FOR THE CORE TEST, which is the record's distinguishing
      operational property: C1 through C5 are pure integer arithmetic on published
      values and run in microseconds.
    - >-
      No point-counting backend is assumed and none is used anywhere.
    - >-
      THE SIX ROWS I DID NOT READ MUST BE TRANSCRIBED BY THE EXECUTOR FROM
      inputs/SAFECURVES-20260825/specs/rfc5639.txt WITH LINE NUMBERS RECORDED PER
      FIELD. Every entry in the C2 table is a formula prediction, not a reading, and
      a row that cannot be transcribed is UNRESOLVED and excluded from the lattice
      rather than guessed.
    - >-
      The test runs on the r1 coefficients. The t1 coefficients are the images under
      A -> Z^4*A and B -> Z^6*B mod p and the block structure does not survive that
      map, as the lossy-projection analysis shows. An audit of brainpoolP384t1 that
      does not go through brainpoolP384r1 is auditing an output whose input it never
      checked, and this must be stated in the deliverable because the RQ names only
      t1.
    - >-
      The bit-order convention of A.0 is taken as stated - first bit of the string is
      the most significant bit of the integer - and is CROSS-CHECKED by the L = 256
      row, where the answer is publicly known. An implementation with the opposite
      convention fails at 256 and the check is therefore self-diagnosing.
    - >-
      No live keys; every object is a published parameter.

  proof_search_map:
    bottleneck: >-
      That the brainpoolP384t1 rigidity row is adjudicated in the incumbent source by
      the words "See brainpoolP256t1", so nothing about 384 has been independently
      checked, and that the one publicly noted structural fact about the Brainpool
      coefficients is stated qualitatively ("most of the curves") with no formula,
      no per-size count and no account of the exception. Removing this bottleneck
      changes no cost and no theorem; it converts an anecdote into a table.
    baseline_embedding:
      parameter_slice: >-
        At v = 1 the general identity collapses to the single relation
        floor(B / 2^160) = A mod 2^w, which at L = 256 with w = 95 is EXACTLY the
        publicly documented Bernstein-Lange observation. THAT IS THE BASELINE AND IT
        MUST BE REPRODUCED EXACTLY: the general code, run at L = 256, must reproduce
        the known 24-hex-digit repeat and must do so without any size-specific
        branch. A general formula that has to be special-cased to recover the known
        instance has not embedded the baseline.
      reproduction_check: >-
        A frozen fixture asserting (a) that the general routine at L = 256 on the
        published brainpoolP256r1 A and B returns TRUE with 95 shared bits, and (b)
        that extracting those bits as hex reproduces the literal string
        26DC5C6CE94A4B44F330B5D9 modulo the one-bit pad discussed in C5. The literal
        string is a published fixture and is the strongest available check on the bit
        convention, the shift arithmetic and the transcription simultaneously.
    observation_collision:
      observable: >-
        The block-alignment signature S(L). The conclusion that the published
        coefficients were produced at consecutive seed offsets by find_integer_2 rests
        entirely on it.
      distinct_preimage_search: >-
        REQUIRED, AND THE ANSWER HAS TWO PARTS THAT MUST BOTH BE STATED. (i) THE
        FIBRE IS ENORMOUS - every coefficient pair produced at consecutive offsets
        gives the same all-true signature, so the observable identifies the RULE and
        not the instance. It cannot distinguish brainpoolP384r1 from any other curve
        the same procedure would produce, and the record must never present a pass as
        a fact about this curve. (ii) A COLLISION ACROSS RULES IS POSSIBLE AND MUST BE
        BOUNDED - a different procedure that happened to emit overlapping blocks would
        also pass. The separating condition is the SHARED-BIT COUNT: an alternative
        rule would have to reproduce 31, 63, 95, 159, 223 and 351 shared bits at the
        six sizes AND produce zero at 160, which is a six-dimensional agreement, and
        the record's force comes from the whole table rather than from any row. THIS
        IS THE SAME STRUCTURAL POINT AS IDEA-20260829-e37b52's null control Z3 and it
        is inherited deliberately.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Preserve the full block-alignment vector S(L) and the predicted shared-bit
          count per size, rather than the single Boolean "the overlap is present".
          The stronger state is what survives the change of v across the family; the
          Boolean does not, because at v = 0 it is neither true nor false.
        predicted_gain: >-
          A per-size table in which a deviation localises to a size AND to a relation
          index j, instead of a family-level pass or fail. That is the difference
          between an actionable finding and a fatigue report.
      - transform: observable_fiber
        proposed_object: >-
          Hold the signature fixed at all-true and vary the forgotten structure - the
          seed, the hash function, the prime - to exhibit that the identity is a
          property of the assembly rule alone and depends on nothing else.
        predicted_gain: >-
          Forecloses the misreading in which a passing lattice is cited as evidence
          about the curves rather than about the procedure, which is the single most
          likely misuse of this record.
    quantifier_order: >-
      C1 IS CLAIMED UNIFORMLY AND UNCONDITIONALLY. FOR ALL hash functions H, FOR ALL
      L with v = floor((L-1)/160) >= 1, and FOR ALL seeds s0, if A and B are the
      find_integer_2 outputs at s0 and s0 + 1 then relations (i) and (ii) hold. No
      witness depends on the instance and no cryptographic property of SHA-1 is used.
      C2 IS AN ARITHMETIC CONSEQUENCE, claimed uniformly over the seven values of L.
      C3 IS CLAIMED AS A DERIVED EXCEPTION - FOR L = 160, v = 0, hence there is no
      relation to state; this is a statement about the formula and not about
      brainpoolP160r1.
      THE LATTICE'S EMPIRICAL CLAIM IS EXISTENTIAL AND PER ROW. FOR EACH size whose r1
      coefficients could be transcribed, THERE EXISTS agreement between the published
      pair and the predicted shared-bit count. NOT CLAIMED - that all seven rows
      resolve, since transcription may fail, and the coverage count is part of the
      result.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The published brainpoolP{L}r1 coefficients A and B agree in exactly
        160(v-1) + w bits at the positions predicted by RFC 5639 A.2, for each of the
        R sizes transcribed, with zero shared bits at L = 160 as the formula requires."
        IT CERTIFIES NOTHING about whether the seed was chosen freely, nothing about
        the six other unexplained decisions SafeCurves lists, nothing about the
        rejection count - which is IDEA-20260829-b70376's business and needs hashing -
        and nothing whatsoever about brainpoolP384t1's security. It also certifies
        nothing about t1, whose coefficients do not carry the structure.
      nearby_object_control: >-
        THE NEAREST OBJECT ON WHICH THE CONCLUSION FAILS IS THE t1 COEFFICIENT PAIR
        ITSELF, AND IT IS AVAILABLE FOR FREE AT EVERY SIZE. Run the identical
        identity check on the published (A_t1, B_t1) pairs. PREDICTED FAILURE AT EVERY
        SIZE, because A_t1 = p - 3 is a fixed value carrying no block structure at all
        and B_t1 = Z^6*B_r1 mod p destroys it. A lattice that passes on t1 as well as
        r1 is not testing block structure and every result is void. THIS IS THE
        SHARPEST POSSIBLE CONTROL because the two pairs describe ISOMORPHIC CURVES
        with the SAME order and the SAME security, differing only by the coordinate
        change - so a test that cannot separate them is measuring the curve rather
        than the derivation. SECOND NEARBY OBJECT - the three NIST curves' published
        (a, b) pairs, where a = -3 always and b is a single hash-derived value with no
        sibling; the identity is undefined and the instrument must REFUSE, not fail.
    proof_obligations:
      - claim: >-
          Relations (i) and (ii) follow from A.2's concatenation rule and the single
          update_seed between A and B.
        responsibility: correctness
      - claim: >-
          The shared-bit count is exactly 160(v-1) + w for v >= 1 and exactly 0 for
          v = 0.
        responsibility: size
      - claim: >-
          The seven-row table of (v, w, shared bits) is arithmetically correct for
          L = 160, 192, 224, 256, 320, 384, 512.
        responsibility: baseline
      - claim: >-
          At L = 256 the general routine reproduces the literal published repeat
          26DC5C6CE94A4B44F330B5D9 with no size-specific branch.
        responsibility: baseline
      - claim: >-
          The visible hex repeat requires w rounded up to a multiple of 4 and hence one
          extra bit of coincidence when w is not a multiple of 4.
        responsibility: strictness
      - claim: >-
          The identity FAILS on the t1 coefficient pairs at every size.
        responsibility: strictness
      - claim: >-
          The synthetic null passes at rate 0 against a per-row prediction of 2^{-w}
          or 2^{-(160(v-1)+w)}.
        responsibility: strictness
      - claim: >-
          The number of INDEPENDENT transcription sources is reported beside the number
          of rows; seven rows from one RFC is one source, not seven.
        responsibility: scope
      - claim: >-
          Seed_p_384 and Seed_ab_384 are the SIXTH 160-bit substrings of Pi*2^1120 and
          floor(e*2^1120) respectively.
        responsibility: interface
    not_applicable_reason: null

  predictions:
    - metric: >-
        the two block relations of C1 evaluated on the published brainpoolP384r1
        coefficient pair, as exact integer comparisons with no hashing
      direction: different
      minimum_effect: >-
        PREDICTED BOTH TRUE EXACTLY, with 160 + 63 = 223 shared bits. This is the
        record's headline row. Null probability for a coincidental pass is 2^{-223},
        so a pass is a 223-bit signal that the published pair was produced at
        consecutive seed offsets by find_integer_2, and a FAILURE at 384 while 256
        passes is a localised defect at one size, which per the BADA55 mirror's
        "below 512 bits" carve-out is a live possibility and would be far more
        interesting than the predicted pass.
    - metric: 'the seven-row shared-bit table (0, 31, 63, 95, 159, 223, 351)'
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY THOSE SEVEN VALUES, derived from v = floor((L-1)/160) and
        w = L - 160v - 1 before any data is touched. Any single deviation falsifies my
        reading of A.2 and voids the general formula, which would also invalidate
        IDEA-20260829-ff7823's identical count for the NIST chain - so this one table
        is load-bearing for two records.
    - metric: >-
        the identity's status at L = 160
      direction: different
      minimum_effect: >-
        PREDICTED VACUOUS, not true and not false, because v = 0 leaves no relation to
        state. The instrument must report VACUOUS explicitly. Reporting "true" here is
        an instrument failure (a conjunction over an empty index set is vacuously
        true and would be misleading), and reporting "false" is equally wrong. THIS IS
        THE RECORD'S DERIVED EXPLANATION OF THE PUBLISHED WORD "MOST" and it is
        checkable in one line.
    - metric: >-
        number of the seven r1 rows on which the identity holds, out of the number
        transcribed
      direction: higher
      minimum_effect: >-
        PREDICTED 6 OF 6 NON-VACUOUS ROWS. A per-row failure LOCALISES a deviation to
        a size, and TWO READINGS MUST BOTH BE OFFERED - either the transcription of
        that row is wrong, or that size's parameters were not produced by A.2's loop
        at consecutive offsets. The BADA55 mirror's claim that the sub-512-bit curves
        were not produced by the 2005 STANDARD procedure (while the RFC procedure does
        produce them) means the expected pattern is uniform across sizes; a 512-only
        deviation, or a below-512 deviation, would each point at a different one of the
        two documents and the record must say which rather than merely reporting a
        mismatch.
    - metric: >-
        the identity evaluated on the published t1 coefficient pairs
      direction: lower
      minimum_effect: >-
        PREDICTED FALSE AT ALL SEVEN SIZES, that is 0 of 7. This is the blocking
        nearby-object control and it is unusually sharp: r1 and t1 are isomorphic
        curves with identical order and identical security, so a test passing on both
        is measuring the curve rather than the derivation and every result is void.
    - metric: >-
        pass rate of the identity on 10^4 synthetic coefficient pairs drawn
        independently at each size's bit length
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 0 out of 70000, against per-row null probabilities of
        2^{-31} at L = 192 down to 2^{-351} at L = 512. THE 192 ROW IS THE ONLY ONE
        WHERE THE NULL IS NOT ASTRONOMICAL - 2^{-31} is about 5 * 10^{-10}, so at
        10^4 trials it is still zero expected, but it is the row where a truncating or
        masking implementation defect would first produce a spurious pass, and it must
        therefore be given the largest synthetic sample.
    - metric: >-
        whether the L = 320 row exhibits a VISIBLE 40-hex-digit repeat, in addition to
        the arithmetic identity
      direction: different
      minimum_effect: >-
        NO PREDICTION IS OFFERED AND THAT IS DELIBERATE - it depends on one bit of a
        SHA-1 output that has already been fixed, so predicting it would be inventing a
        coin flip. REPORTED AS AN OBSERVATION with the derivation of why it is a coin
        flip. If it IS visible, brainpoolP320r1 carries the largest visible repeat in
        the family, at 159 bits versus the 95 that got noticed at 256, and the fact
        that this has not been remarked on publicly would itself be worth recording.
    - metric: >-
        equality of Seed_p_384 and Seed_ab_384 with the SIXTH 160-bit substrings of
        Pi*2^1120 and floor(e*2^1120)
      direction: different
      minimum_effect: >-
        PREDICTED EXACT EQUALITY. This is the 384-specific half of the seed check and
        it tests the "first seven substrings" convention at a DIFFERENT OFFSET from
        IDEA-20260829-b70376's fourth-substring check. A convention is pinned down only
        by checking it at more than one index, and if the two records disagree about
        which alignment works, the convention is not unique and both must report that.
    - metric: >-
        count of INDEPENDENT source documents behind the lattice, versus the row count
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 1 INDEPENDENT SOURCE FOR SEVEN ROWS, since all seven come
        from RFC 5639. THIS MUST BE PUBLISHED BESIDE THE ROW COUNT. A seven-row lattice
        from one document is one check of that document's internal consistency, not
        seven independent confirmations, and reporting only the row count would
        overstate the audit's power by a factor of seven. Cross-body corroboration
        would require a second authority - the 2005 standard, or an independent
        implementation's test vectors - and neither is in the frozen package.

  minimal_test:
    design: >-
      STAGE 0, ZERO COMPUTE, MINUTES, AND IT CAN KILL OR CONFIRM THE FORMULA FOR
      FREE. Derive C1 from A.2's concatenation rule, compute the seven (v, w,
      shared-bit) triples by hand, and record them BEFORE touching any data. A wrong
      triple is the cheapest possible negative.
      STAGE 1, THE CHEAPEST VALID DISCRIMINATOR, UNDER ONE SECOND, AND IT IS THE
      CHEAPEST VALID TEST IN THIS ENTIRE SIX-RECORD BATCH. Transcribe the
      brainpoolP256r1 and brainpoolP384r1 A and B values - two rows, four numbers -
      and evaluate the identity. Three big-integer operations per relation, no
      hashing, no seeds, no primes, no curves. The 256 row is the baseline embedding
      whose answer is publicly known, so it validates the bit convention and the shift
      arithmetic; the 384 row is the headline and has never been checked. TWO ROWS ARE
      ENOUGH TO FALSIFY THE DESIGN; SEVEN ARE NEEDED ONLY TO DELIVER IT.
      STAGE 2, SECONDS. The symbolic unit test over stub-hash block contents at
      v = 0, 1, 2, 3, which isolates the assembly rule from SHA-1 entirely and catches
      the block-order and endianness defects that are the likeliest errors here.
      STAGE 3, MINUTES, TRANSCRIPTION-BOUND. The remaining five r1 rows, with line
      numbers recorded per field; unresolved rows excluded with a reason.
      STAGE 4, SECONDS. The blocking t1 control at all seven sizes, and the NIST
      refusal.
      STAGE 5, SECONDS. The synthetic null, weighted toward L = 192.
      STAGE 6, MINUTES. The 384-specific extras - the sixth-substring seed check
      against Pi and e, and the Z reconstruction from Z^4 = -3/A_384r1 compared against
      the RFC's published Z for brainpoolP384t1.
      STAGE 7, SECONDS. The visibility computation of C5 at all sizes.
    controls:
      - >-
        BLOCKING NEARBY-OBJECT NEGATIVE - the identical identity on the t1 coefficient
        pairs at all seven sizes. Predicted 0 of 7. r1 and t1 are isomorphic curves, so
        this control separates the derivation from the curve and nothing else can.
      - >-
        BLOCKING BASELINE POSITIVE - the L = 256 row, whose answer is publicly
        documented, evaluated by the GENERAL code with no size-specific branch, and
        required to reproduce the literal string 26DC5C6CE94A4B44F330B5D9.
      - >-
        REFUSAL CONTROL - the three NIST (a, b) pairs, where a = -3 is fixed and there
        is no sibling coefficient from an adjacent seed. The identity is UNDEFINED and
        the instrument must refuse rather than return false.
      - >-
        VACUITY CONTROL - the L = 160 row. The instrument must report VACUOUS, not
        true and not false. An implementation that returns true here has an empty
        conjunction and is silently wrong at exactly the size that explains the
        published word "most".
      - >-
        SYMBOLIC NULL - the identity checked against stub-hash block contents at
        v = 0, 1, 2, 3, isolating the assembly rule from the hash.
      - >-
        SYNTHETIC NULL, SAME SHAPE - 10^4 independently drawn coefficient pairs per
        size at matched bit lengths, with seeds recorded. Predicted zero passes;
        weight the sample toward L = 192 where the null is only 2^{-31}.
      - >-
        MUTATION CONTROL - flip one hex digit of one published A or B and confirm the
        identity fails and names the relation index j that broke. Run at least five
        mutations per row. Predicted 100 percent detection for mutations inside a
        shared block and 0 percent for mutations outside one - AND THE SECOND HALF OF
        THAT PREDICTION IS THE IMPORTANT ONE, because it bounds the lattice's reach:
        the identity constrains 160(v-1) + w of the 2(L-1) published coefficient bits
        and NOTHING ELSE, which at L = 384 is 223 of 766, or 29 percent.
      - >-
        CROSS-RECORD CONSISTENCY - IDEA-20260829-b70376 evaluates the L = 256 row
        independently. The two must agree exactly; a disagreement is an implementation
        finding and both halt.
    required_metrics:
      - 'the seven predicted (v, w, shared-bit) triples, recorded before any data'
      - 'per row, the relation results as exact integer comparisons, with j indexed'
      - 'per row, the observed shared-bit count against the predicted one'
      - 'per row, resolved or unresolved with the RFC line numbers used'
      - 'the L = 160 vacuity verdict'
      - 'the t1 control results, 0 of 7 expected'
      - 'the NIST refusal verdicts'
      - 'the synthetic null pass rate per size, with sample sizes'
      - 'the mutation detection rate split by inside-block and outside-block mutations'
      - 'the fraction of published coefficient bits the lattice constrains, per size'
      - 'the L=320 visibility observation with its derivation'
      - 'the sixth-substring seed check for Pi and e, and the alignment convention used'
      - 'the reconstructed Z against the RFC published Z for brainpoolP384t1'
      - 'count of INDEPENDENT source documents (predicted 1) beside the row count'

  falsification_conditions:
    - >-
      The identity fails on the published brainpoolP384r1 pair while holding at 256.
      A localised deviation at one size. Report BOTH readings - a transcription error
      or a genuine deviation - and re-transcribe from the RFC line by line before
      preferring either. Do not report a deviation from a standard until transcription
      error is excluded.
    - >-
      Any of the seven predicted (v, w, shared-bit) triples is arithmetically wrong.
      My reading of A.2 is wrong, the general formula is void, and
      IDEA-20260829-ff7823's identical count for the NIST chain must be withdrawn
      simultaneously.
    - >-
      The symbolic stub-hash test fails at any v. The assembly rule is implemented
      differently from the specification; halt.
    - >-
      The identity PASSES on any t1 coefficient pair. The lattice is not testing block
      structure - most likely it is testing something trivially true, such as an
      accidentally masked comparison - and every result is void.
    - >-
      The instrument returns true or false rather than VACUOUS at L = 160. The empty-
      conjunction defect; the explanation of "most" is not being tested at all.
    - >-
      Any pass in the synthetic null. Implementation failure; nothing is reported.
    - >-
      The general code needs a size-specific branch to reproduce the L = 256 baseline.
      The formula has not embedded the known instance and is a family of special cases
      rather than a general statement.
    - >-
      Fewer than two r1 rows can be transcribed. The lattice has no cross-size
      redundancy and the record returns a transcription-coverage measurement instead of
      a result - a legitimate outcome, recorded as such and not dressed up.

  confounders:
    - >-
      SEVEN ROWS, ONE DOCUMENT. All seven pairs come from RFC 5639. That is one check
      of one document's internal consistency, not seven independent confirmations, and
      the deliverable must publish the independent-source count beside the row count.
      This is the single most likely way for the lattice to look stronger than it is
      and it is inherited directly from IDEA-20260829-e37b52's confounder list.
    - >-
      THE LATTICE CONSTRAINS 29 PERCENT OF THE BITS AT L = 384 AND LESS ELSEWHERE.
      223 of the 766 published coefficient bits at 384; 95 of 510 at 256, that is 19
      percent; 31 of 382 at 192, that is 8 percent. A pass says nothing about the
      unconstrained bits, and the outside-block half of the mutation control exists to
      demonstrate that rather than assert it.
    - >-
      A PASS IDENTIFIES THE RULE, NOT THE CURVE. Every pair produced at consecutive
      offsets passes. A write-up saying "brainpoolP384r1's coefficients are verified"
      has overread a statement about find_integer_2 into a statement about a curve.
    - >-
      THE 2005 STANDARD IS NOT RFC 5639, AND THE BADA55 CARVE-OUT CUTS ACROSS THE
      SAME SEVEN SIZES. The mirror page says the sub-512-bit curves were not generated
      by the 2005 procedure while the RFC procedure does generate them. So there are
      already TWO known non-uniformities across these seven rows - the v = 0 exception
      at 160 and the 512 carve-out - and a per-size deviation found by this lattice
      could belong to either or to neither. The deliverable must not attribute a
      deviation to one explanation without ruling out the other, and ruling out the
      2005 explanation requires a document that is not in the package.
    - >-
      t1 IS THE CURVE THE RQ NAMES AND r1 IS THE CURVE THE TEST RUNS ON. Every sentence
      of the deliverable must say which. The two are isomorphic and have identical
      security, and the identity distinguishes them completely - which is a feature of
      the test and a trap for the write-up.
    - >-
      THE VISIBLE REPEAT AND THE ARITHMETIC IDENTITY ARE DIFFERENT CLAIMS. The
      arithmetic identity is exact and unconditional; the visible hex repeat needs w
      rounded to a multiple of four and hence up to three extra bits of coincidence.
      Conflating them - as any write-up quoting the hex string without the derivation
      necessarily does - overstates what is proved.

  interpretation_limits:
    - >-
      RIGIDITY'S COUNTERFACTUAL IS NOT A COMPUTABLE OBJECT AND THIS RECORD DOES NOT
      TOUCH IT. The lattice shows that the published coefficient pairs are CONSISTENT
      with having been produced by RFC 5639 A.2 at consecutive seed offsets. It cannot
      show the procedure was written before the parameters, it cannot show the seed
      was not chosen after the fact - the Pi and e derivations checked by
      IDEA-20260829-b70376 are the partial rebuttal to that and they are partial -
      and no computation can. The archived audit plan's closure stands verbatim.
    - >-
      NO NUMBER HERE IS A SECURITY STATEMENT ABOUT brainpoolP384t1. Shared bits between
      two published coefficients say nothing about the ECDLP, the group order, the
      twist or the base point. The goal's own claim boundary already says a rigidity
      failure is not by itself an ECDLP break, and this record adds that a rigidity
      PASS is not by itself anything either.
    - >-
      C1, C2 AND C3 ARE PROVED; THE LATTICE IS A DIRECT VERIFICATION ON PUBLISHED DATA
      WITH NO SAMPLING AND NO HEURISTIC IN THE TEST ITSELF. The only heuristic in the
      record is H1 below, which concerns how to interpret a PASS as evidence.
    - >-
      SEVEN OF THE EIGHT UNEXPLAINED DECISIONS SafeCurves LISTS REMAIN UNEXPLAINED.
      C1 explains the MECHANISM producing the repeated digits - overlapping counters,
      which is SafeCurves' own sixth bullet - and explains no DECISION: not the hash
      choice, not the fixed 160-bit input width, not Pi and e over other constants, not
      the per-size digit scheme, not counter mode over OFB, and not the shared seed for
      A and B. Explaining a mechanism is not answering a "why", and the deliverable
      must keep that line.
    - >-
      TRANSFER TO THE OTHER 19 CURVES, STATED EXACTLY. (a) FULL TRANSFER WITHIN THE
      BRAINPOOL FAMILY - the formula covers all seven RFC 5639 sizes and the lattice IS
      the transfer; brainpoolP256t1 (GOAL-SCURVE-f7b5a3) may cite the L = 256 row
      directly and IDEA-20260829-b70376 uses it as its Stage 1 premise check. Five of
      the seven sizes are NOT in the twenty-row manifest and serve as free controls,
      which is an unusually strong position for a family audit.
      (b) TRANSFER OF THE FORMULA, NOT OF THE TEST, TO THE NIST ROWS - the same
      160(v-1) + w count governs the NIST seed chain, but there it relates c(s) to
      c(s+1), and only one seed is published, so the identity is not checkable against
      published data and must be tested by recomputation instead. That is
      IDEA-20260829-ff7823. The instrument here must REFUSE the NIST rows.
      (c) NO TRANSFER - ANSSI FRP256v1 publishes no procedure and has no sibling
      coefficient; see IDEA-20260829-85768f. (d) NO TRANSFER - the thirteen fully rigid
      rows have minimality rules rather than hash concatenation and no block structure
      exists.
      (e) NO TRANSFER TO ANY t1 CURVE, INCLUDING THE ONE THIS RQ NAMES, and that is
      proved rather than assumed: the Z^4 and Z^6 multiplications destroy the block
      alignment, which is why the t1 pairs are the blocking control rather than a
      second data set.

  heuristic_assumptions:
    - id: H1
      statement: >-
        A pass of the block identity is evidence that the published pair was produced
        by consecutive applications of find_integer_2; formally, for a coefficient pair
        (A, B) of the published bit lengths NOT produced by that rule, the probability
        that relations (i) and (ii) hold is 2^{-(160(v-1)+w)}, modelling the pair as
        two independent uniform draws of their bit lengths.
      rigorous_support: >-
        The RIGOROUS half is the identity itself and it runs in the FORWARD direction
        with no assumption at all: a pair produced by the rule satisfies the relations
        exactly, so a FAILURE is unconditional proof that the pair was NOT so produced.
        The heuristic is used ONLY in the reverse direction, to read a pass as evidence
        of the rule, and it imitates the standard random-oracle model of a checksum in
        which a wrong message collides with a valid one with probability 2^{-b}. This
        is exactly the "behaves like a uniformly random integer of its size" family and
        the same shape as IDEA-20260829-e37b52's H1. NO CHARACTER-SUM OR
        EQUIDISTRIBUTION BOUND APPLIES, because the alternative hypothesis is
        unspecified - "some other procedure" is not a distribution - so the 2^{-b} is
        a modelling choice and is labelled as one.
      validation_plan: >-
        SAMPLING - 10^4 independently drawn coefficient pairs per size at matched bit
        lengths, with RNG seeds recorded, weighted toward L = 192 where the null is
        only 2^{-31} and a defect would surface first. COMPARISON DISTRIBUTION - the
        observed false-pass rate against the exact per-size prediction 2^{-(160(v-1)+w)};
        at every size above 192 the prediction is "zero observed in any feasible
        sample", SO THE TEST HAS NO POWER TO CONFIRM THE EXPONENT AND CAN ONLY REFUTE
        IT, which is stated rather than glossed: a single false pass refutes decisively
        and zero passes confirms only the absence of a gross defect. TAIL CHECK -
        mutations restricted to the LOW-ORDER bits of a shared block and to the bits
        immediately outside a block boundary, where an off-by-one shift would fail
        first; predicted 100 percent detection inside and 0 percent outside, and the
        boundary bits are the diagnostic ones. TRANSFER - none. Everything runs at the
        real published bit lengths on the real published values and nothing is
        extrapolated.
    - id: H2
      statement: >-
        The frozen package's specs/rfc5639.txt faithfully reproduces RFC 5639's
        published coefficient tables for all seven sizes.
      rigorous_support: >-
        NONE for the general statement. Two structural points in its favour and one
        against, all stated. IN FAVOUR: the file is a plain-text RFC with intact line
        numbering, page breaks and author block, so it does not suffer the symbol
        mangling that afflicts the PDF extractions elsewhere in the package; and the
        L = 256 row's answer is independently known from the SafeCurves mirror page, so
        one row has external corroboration. AGAINST: I read only two of the seven
        parameter sections, so five rows enter the lattice on transcription I have not
        personally checked at any depth.
      validation_plan: >-
        THREE CHECKS. (i) EXTERNAL CORROBORATION AT ONE ROW - the L = 256 shared string
        26DC5C6CE94A4B44F330B5D9 appears in the SafeCurves mirror page, a DIFFERENT
        file with a different origin, and must match. (ii) INTERNAL ARITHMETIC BINDING
        - for each size, check Z^4 * A_r1 congruent -3 mod p and B_t1 congruent
        Z^6 * B_r1 mod p using the RFC's own published Z, which binds A_r1, B_r1, A_t1,
        B_t1, Z and p together in two equations per size. A mis-transcription in any of
        six fields breaks them. THIS IS A STRONG CHECK AND IT COSTS FOUR MODULAR
        EXPONENTIATIONS PER SIZE. (iii) CROSS-LAYER - the L = 256 and L = 384 moduli and
        t1 coefficients compared as integers against the RQ intake tuples, which came
        from a different supply chain. H2 remains open after all three, since they pass
        together if the file is a faithful copy of a corrupted original.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND THIS RECORD MOVES NO EXPONENT. Under
      docs/target-result-profile.md it ranks low as research direction and is
      dispatched measurement work under a declared goal; it is labelled that way rather
      than dressed up. AUDIT COST: per row, v shifts, v masks and v integer
      comparisons on numbers of at most 511 bits - that is O(v * L) bit operations,
      microseconds, AND NO HASH EVALUATIONS AT ALL. The whole seven-row lattice plus
      the t1 control plus the 70000-pair synthetic null is well under one second on one
      core. H2's arithmetic binding adds four modular exponentiations per size,
      milliseconds. The certificate is (L, v, w, the relation results) and verification
      by a second implementation costs the same handful of shifts - genuinely succinct,
      and unlike IDEA-20260829-b70376's certificate its verification cost does not grow
      with the answer.
    memory_exponent: >-
      O(L) working memory per row, that is bytes; the whole lattice is a few kilobytes.
      The 48 GB envelope is irrelevant and the 14 cores buy nothing, since the entire
      computation is serial and sub-second. THIS RECORD IS THE CHEAPEST IN THE BATCH BY
      SEVERAL ORDERS OF MAGNITUDE.
    best_known: >-
      For the L = 256 instance the incumbent is Bernstein and Lange 2013, who observed
      the repeat, and BADA55 Section 5, which per the mirror analyses the mechanism -
      I did not read either, so I cannot say whether the general formula is theirs.
      This record claims no algorithmic advance of any kind; the identity follows from
      the standard's own text in three lines. Inside this program no incumbent exists,
      since the corpus holds no Brainpool computation. Against the ECDLP attack
      frontier (KN-TECH-001, KN-TECH-006, KN-TECH-018, KN-TECH-031, KN-TECH-032,
      KN-TECH-035) this record is dominated by every row because it is not an attack.
    hidden_overhead: >-
      No o(1) and nothing superpolynomial; the audit cost is exactly countable. FOUR
      honest hidden costs, ALL EPISTEMIC AND NONE COMPUTATIONAL. (i) Five of the seven
      rows rest on transcription I did not check at any depth, which is the record's
      dominant risk and is disclosed in the citation's read depth. (ii) The lattice
      constrains 8 to 46 percent of the published coefficient bits depending on size,
      and nothing outside those bits. (iii) Seven rows come from one document; the
      independence is 1, not 7. (iv) The general formula is very likely already
      published in BADA55 Section 5, unread, so the novelty claim is thin and is
      labelled `unverified` accordingly.
    tradeoff_note: >-
      There is no time-memory tradeoff, no parallelisation benefit and no parameter to
      tune - the test is exact, complete and instantaneous. The only tradeoff in the
      record is TRANSCRIPTION EFFORT VERSUS COVERAGE, and it is linear: each additional
      row costs one careful read of an RFC section and buys one more check of a formula
      that the other rows already test at different v. Because the marginal value falls
      once v = 1, 2 and 3 are each covered - which needs only 256, 384 and 512 - THE
      HONEST MINIMUM IS FOUR ROWS (160 for vacuity, 256 for the baseline, 384 for the
      headline, 512 for v = 3) AND THE OTHER THREE ARE REDUNDANCY. That is said here so
      an executor short of time knows exactly what to drop.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW BEFORE WRITING THIS FIELD; `null` IS NOT
    ASSERTED. AS AN ATTACK it is dominated by every row simultaneously on time, memory
    and data - rho (KN-TECH-001, KN-TECH-006), automorphism-discounted rho
    (KN-TECH-018), BSGS (KN-TECH-031, KN-TECH-035), MOV and Frey-Ruck (KN-TECH-032) -
    because it is not an attack and produces no discrete logarithm.
    AS THE L = 256 OBSERVATION it is DOMINATED BY Bernstein and Lange 2013, who
    reported the repeated digit string, and very likely by BADA55 Section 5 for the
    mechanism. I DID NOT READ EITHER, and the BADA55 paper is NOT in this repository -
    only two HTML mirror pages of the BADA55 web site are, and they point to Section 5
    without containing it. The honest reading is "probably dominated on C1 and C2,
    extent unmeasured, and obtaining and reading the paper settles it - do that first."
    AS THE SEVEN-ROW TABLE AND THE v = 0 EXCEPTION (C2, C3) I could not identify a
    dominating incumbent inside this repository and did not search outside it.
    AS AN AUDIT INSTRUMENT it is dominated on authority by SafeCurves' own tables and on
    convenience by any computer-algebra system - but note that SafeCurves' own rigid
    row for brainpoolP384t1 reads, in its entirety, "See brainpoolP256t1", so on THIS
    PARTICULAR ROW the incumbent has published a cross-reference rather than a check,
    and a cross-reference does not dominate a computation.
    IT IS NOT DOMINATED, within the checked scope of this repository, on one narrow
    axis: no incumbent here evaluates a cross-coefficient structural identity across a
    curve family with a blocking isomorphic-twin control and a published constrained-bit
    fraction. Narrow, and stated narrowly.
  sota_delta: >-
    ZERO speedup against any attack baseline on every axis and zero algorithmic
    improvement over RFC 5639's own text. THE NONZERO DELTAS ARE FOUR AND THEY ARE ALL
    SMALL AND ALL CHEAP.
    AS DATA - the corpus screen of 2026-08-29 finds no Brainpool coefficient analysis,
    no shared-bit count and no structural check anywhere in knowledge/ or ledger/. This
    would produce a seven-row table of predicted and observed shared-bit counts, seven
    t1 control results, a per-size synthetic null rate, a mutation detection rate split
    inside and outside the constrained blocks, and the constrained-bit fraction per
    size - where there are currently none.
    AS PRECISION - the incumbent statement is qualitative: "a highly nonrandom overlap
    of digits ... in most of the Brainpool curves". This record replaces it with an
    exact per-size integer (0, 31, 63, 95, 159, 223, 351), a named mechanism, and a
    derived account of which curve is the exception and why. QUANTITATIVELY, at
    L = 384 this is a 223-bit exact agreement where the incumbent source for that row
    says only "See brainpoolP256t1"; the tightening is from a cross-reference to a
    theorem plus three integer operations.
    AS SCOPE - the constrained-bit fraction (29 percent at 384, 19 percent at 256, 8
    percent at 192) is published, so no reader can take a pass as verification of the
    coefficients. That number bounds the record downward and is part of the delivery.
    AS COST - this is the cheapest valid test in the six-record batch by orders of
    magnitude: no hashing, no primes, no curves, no point counting, no network, and
    sub-second total runtime. If exactly one thing from this batch is run first, the
    argument for it being this one is entirely about cost per bit of information and
    not about importance.
  estimated_cost:
    implementation: low
    compute: low
    basis: >-
      Implementation is one general shift-and-mask routine of about 30 lines plus a
      stub-hash unit test and a synthetic null loop. Compute is sub-second in total for
      the lattice, the controls and the null. The binding cost is the CAREFUL
      TRANSCRIPTION of five RFC parameter sections I did not read, which is human
      attention measured in tens of minutes, and it is the record's dominant risk as
      well as its dominant cost.
  recommended_priority: high

