    "title": "Chordal compilation of Semaev residual fibres into a shared decision graph",
    "class": "algorithm",
    "claim": "R3 representation at the decomposition/relation stage. On standalone binary pdp instances, a continuation-set DAG can reduce total certified decomposition work by at least 2x over a block-ordered search when its charged node-and-edge size is at most half the search tree size. The conjectural structural signal is a subexponential number K(l) of distinct residual classes at the middle separator, absent from the shape-matched null.",
    "mechanism": "Object: a DAG of exact residual continuation sets at chain separators. Operation set Sigma: restrict one core block, eliminate an internal chain variable, and join two certified continuation sets. Trichotomy: coordinate-dependent; this is a solver/representation object, not a lossy quotient under the full group translation action. Discarded information: different assignment prefixes with identical remaining solution sets are merged; witness pointers retain recovery and their full size is charged. Keep the auxiliary coordinates in a chained S_3 presentation. At each separator, triangularize the local ideal together with field/base constraints and store the exact continuation set as a regular-chain node. Canonical equality is certified by mutual ideal containment plus field-point equivalence where needed. Reuse a node only after that check. The object can be exponentially smaller than a tree only if many prefixes share the same residual; chordal sparsity alone is insufficient.",
