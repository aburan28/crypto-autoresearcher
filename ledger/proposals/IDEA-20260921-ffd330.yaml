      verified_by: "coordinator session, read of the statement and conditional-obstruction section on 2026-09-21"
    - ref: IDEA-20260806-c5d183
      provenance: internal
      claim: >-
        The I/II/III trichotomy of lossy tracked objects on a prime-order
        group; index calculus is Class I partial-action (the relation vector
        propagates under translation by factor-base elements only).
      verified_by: "coordinator session, cited via docs/object-frame-ideation.md section 1 and agents/idea-generator.md heuristic 6, both read in full on 2026-09-21"
    - ref: KN-FIND-ffe1df
      provenance: internal
      claim: >-
        Theorem C: an exactly sum-compatible bucket index on a prime-order
        subgroup is a surjective homomorphism, impossible for prime n and
        1 < M < n.
      verified_by: "coordinator session, cited via docs/object-frame-ideation.md section 1 on 2026-09-21"
    - ref: EV-FBG-001
      provenance: internal
      claim: >-
        A prior factor-base-geometry negative in the ledger (contradicts /
        replicated tier), the standing evidence that base geometry alone has
        not moved yield.
      verified_by: "coordinator session, obstruction-registry --debt listing on 2026-09-21; record head not re-opened"
    - ref: arXiv:math/0508243
      provenance: recalled
      claim: >-
        Nearest recalled external line on power-residue / multiplicative
        structure interacting with elliptic-curve point counts and
        character sums (Birch-type sums over curves with multiplicative
        characters): the density of points with x in a multiplicative coset
        is governed by twisted trace sums, which is the mechanism this idea
        tests for m-fold decomposition systems. RECALLED, NOT OPENED: this
        citation is a pointer for the reviewer, not support.
    - ref: Semaev summation polynomials (original paper)
      provenance: internal
      claim: >-
        The relation mechanism this idea re-targets: S_m decompositions of
        group elements via summation polynomials over the factor base, as
        established in the program's SEMBIN/ICEX lanes.
      verified_by: "coordinator session, standing corpus knowledge used by the whole lane; no new extraction this session"
  assumptions:
    - >-
      OFF-LIMITS COMPONENT, NAMED: family F2 (factor-base decomposition) is
      the frame of this proposal, used as a component -- what is added is a
      membership predicate in the KN-OPEN-020 high-degree open class and the
      cover-lift mechanism, not a new decomposition method.
    - >-
      The Gröbner/SAT solving engine's cost on the lifted (degree-inflated)
      system is charged per solve-second, and the yield anomaly, if any,
      must survive division by that cost. This is assumed to be measurable,
      not assumed to be favourable.
  proof_search_map:
    bottleneck: >-
      Relation supply: the |FB|^m/N combinatorial yield that
      EV-FB-001 found invariant across low-degree structures is the exact
      quantity whose high-degree algebraic structure could break the
      invariance -- the bottleneck every index-calculus cost model in the
      lane multiplies.
    baseline_embedding:
      parameter_slice: >-
        The exact EV-FB-001 slice: p ~ 2^14-class primes, m = 3, matched
        |FB|, random-subset baseline. The coset rows extend that experiment's
        factor-base axis at identical p, m, and engine, so the comparison is
        a literal same-harness extension, not a re-implementation.
      reproduction_check: >-
        Re-run the random-subset baseline rows in the same harness and
        reproduce yield within EV-FB-001's 1.1x band before any coset row is
        read.
    observation_collision:
      observable: >-
        Decomposition yield Y(structure) = solved S_3 systems per charged
        second at matched |FB| and matched engine settings.
      distinct_preimage_search: >-
        Two structures with equal yield are not thereby equal: the census
        must log the LIFTED system's solving degree and the cover's trace
        beside the yield, so that 'same yield, different degree' and 'same
        yield, same degree' are distinguishable rows -- the collision that
        would make the cover mechanism invisible.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The coset-restricted decomposition problem reduced to the
          summation system on the cover curve C_g, making the supply
          question an intersection-theoretic question on C_g^m rather than a
          sampling question on F_p^m.
        predicted_gain: >-
          Conditional and measured-only: a yield anomaly factor
          rho_ell = Y(coset)/Y(random) bounded away from 1, with the cover
          trace predicting its sign. No exponent gain is claimed before the
          measurement.
    quantifier_order: >-
      EXISTS a structure class (power-residue cosets) such that FOR ALL
      matched-size random-subset controls in the harness, the yield ratio
      rho_ell deviates beyond measured error -- tested as: for each tested
      (p, ell, g), the null hypothesis 'rho_ell = 1' against the measured
      alternative, with the direction pre-registered by the cover trace
      before the run.
    method_ceiling:
      strongest_certifiable_claim: >-
        At the toy sizes tested: 'power-residue coset bases do / do not
        break EV-FB-001's structure-invariance at matched charged cost',
        with the deviation factor and its sign on record. Even the positive
        outcome certifies NO attack and NO exponent move without the
        follow-up scaling design; even the negative closes only the tested
        (p, ell, m) scope.
      nearby_object_control: >-
        The interval base of matched size (degree-1 structure, already known
        invariant) run in the same harness: the coset rows must deviate from
        the random baseline by MORE than the interval rows' spread if the
        cover mechanism, not harness noise, is to be credited. A second
        control: the coset of the TRIVIAL subgroup structure (ell = 1,
        i.e. all of F_p^*), which must read identical to the unrestricted
        baseline.
    proof_obligations:
      - claim: membership x in g*H_ell iff x = g*u^ell has a solution u
        responsibility: feasibility
      - claim: >-
          the restricted decomposition count equals the pulled-back
          system's solution count on C_g
        responsibility: correctness
      - claim: >-
          the membership predicate is degree (p-1)/ell and is NOT in
          KN-OPEN-020's scoped-out bounded-degree class
        responsibility: scope
      - claim: >-
          membership cost (one exponentiation, O(log p) mults) and the
          lifted system's inflated solving cost are both charged
        responsibility: runtime
      - claim: >-
          the toy measurement's power (sample count) suffices to detect the
          pre-registered deviation
        responsibility: success_probability
      - claim: negative outcome closes only the tested (p, ell, m) scope
        responsibility: scope
      - claim: >-
          composes with the bounded-degree no-go toward a partial universal
          factor-base statement
        responsibility: interface
  predictions:
    - metric: yield ratio rho_ell = Y(coset)/Y(random) at matched |FB|
      direction: different
      minimum_effect: >-
        |rho_ell - 1| beyond the random-control spread (EV-FB-001's 1.1x
        band) at 95% confidence; the SIGN is pre-registered from
        #C_g(F_p) vs the uniform-density prediction before the run.
    - metric: solving degree of the lifted system vs the unlifted
      direction: higher
      minimum_effect: >-
        Degree inflation by a factor tracking ell (the pullback multiplies
        the x-degrees by ell); the yield anomaly must survive division by
        the inflated per-solve cost to count as a supply lever at all.
    - metric: >-
        coset point-count deviation delta_ell = #lifted points minus the
        uniform density prediction
      direction: different
      minimum_effect: >-
        Hasse-Weil-consistent deviation of the cover trace, measured
        exactly; this is the mechanism's independent handle and must
        co-vary with the yield sign.
  minimal_test:
    design: >-
      Same-harness extension of the EV-FB-001 slice: toy prime-order curves
      at p ~ 2^16-2^20, m = 3, factor bases F_ell,g for ell in {3, 5, 7} and
      at least 2 cosets g per ell, |FB| matched to the random-subset
      baseline; count solved S_3 decompositions per charged second (engine,
      degree, and wall-time logged per solve) over N >= 10^3 trials per row;
      pre-register the predicted sign from the exact cover point count
      #C_g(F_p) before the first coset row runs.
    controls:
      - matched-size random-subset baseline (reproduction of EV-FB-001)
      - interval base of matched size (known-invariant structure control)
      - ell = 1 trivial coset (must read as the unrestricted baseline)
      - identity control: full F_p base at the same engine settings
      - generic relabelled-Z/nZ control for the yield meter itself
    required_metrics:
      - yield per charged second, per row, with engine and degree logged
      - exact #C_g(F_p) and the uniform-density prediction, per (ell, g)
      - solving degree and per-solve cost of the lifted vs unlifted system
      - 95% intervals on rho_ell from the N-trial spread
  falsification_conditions:
    - >-
      All coset rows read within the random-control spread after division by
      charged solve cost: structure-invariance extends to the high-degree
      coset class at the tested scope, recorded as the negative with the
      cover mechanism as the named obstruction and the (p, ell, m) scope
      explicit; the implicit/oracle classes (IDEA-20260921-7822a4's target)
      remain the only untested KN-OPEN-020 classes.
    - >-
      The cover point-count prediction fails to pre-register the yield sign
      on any row where rho_ell deviates: the anomaly is unexplained by the
      cover mechanism and is recorded as an unexpected observation (rule 8),
      not as support.
    - >-
      The lifted system's cost inflation eats the anomaly at every tested
      ell: the supply lever is real but dominated at toy scale; dominated_by
      is then set against the rho baseline with the measured crossover
      equation on record.
  confounders:
    - >-
      The size |F_ell,g| is curve-dependent (governed by #C_g(F_p)), so
      matching |FB| to the random baseline requires subsampling the coset;
      the subsample's geometry must be logged or the match is silent
      stratification
    - >-
      small-ell cosets at small p have very few liftable points -- the exact
      regime EV-FB-001 excluded for subgroup bases; ell and p must be chosen
      so |F_ell,g| >= the baseline's |FB| or the row is void
    - engine artifacts (DPLL restarts, Gröbner term-order effects) can mimic
      yield anomalies; the interval control at matched size exists to absorb
      exactly this
    - multiple-testing across (ell, g) rows; the pre-registered sign is the
      guard, with Bonferroni over the exploratory rows
  interpretation_limits:
    - >-
      KN-OPEN-020 CLASS, DECLARED: high-degree (membership predicate degree
      (p-1)/ell), with the target-dependent variant (coset g anchored to the
      instance) explicitly NOT claimed here -- g is fixed per curve, not per
      target, in this proposal.
    - >-
      Toy scope only; a yield anomaly at p ~ 2^20 authorizes exactly one
      thing: a scaling design at the next size class, with all costs
      charged. It claims no crypto-scale advantage.
    - >-
      Even a positive outcome is a constant-or-polylog supply lever unless
      the anomaly GROWS with p; the growth question is the first follow-up
      gate, and this record claims no exponent movement before it.
  heuristic_assumptions:
    - id: H1
      statement: >-
        COVER-DENSITY HYPOTHESIS. The density of S_3-decompositions with all
        three x-coordinates in the coset g*H_ell equals the density of
        solutions of the summation system pulled back to C_g^3, up to the
        uniform-density baseline multiplied by a correction factor
        computable from the cover's trace -- formally:
        rho_ell = 1 + Theta(delta_ell / p) where delta_ell is the deviation
        of #C_g(F_p) from the uniform prediction.
      rigorous_support: >-
        The reduction to C_g is exact (membership iff lift exists, an
        algebraic equivalence, not an approximation). The distributional
        half is the classical uniform-density heuristic the whole
        index-calculus lane already carries (Semaev's Assumption 1 lineage,
        CE-P-type), imitated here on the COVER: the rigorous bound it
        imitates is Hasse-Weil for the single-point count, which is exact
        and computable, so the single-point part of H1 is not heuristic at
        all; the heuristic part is only that the m-fold decomposition
        density inherits the single-point correction multiplicatively.
      validation_plan: >-
        Sampling at toy scale IS the minimal test: measure rho_ell and
        delta_ell per (ell, g) row and test the linear relation
        rho_ell - 1 ~ c * delta_ell / p across rows (the correspondence that
        makes the sign pre-registrable). Comparison distribution: the
        random-subset baseline's spread. Tail checks: the ell = 1 control
        sits at rho = 1 exactly; rows where |F_ell,g| falls below baseline
        are voided rather than scaled. Transfer assumption, stated: toy-to-
        medium transfer of the correction factor is asserted ONLY through
        the growth gate, never by this record alone.
    - id: H2
      statement: >-
        CHARGED-SOLVE DOMINANCE. The per-solve cost of the lifted system
        grows by at most a poly(ell) factor (degree inflation ell on the
        x-variables), so the yield anomaly, if it grows with p, is not
        silently eaten at larger sizes.
      rigorous_support: >-
        Not assumed blindly: the degree inflation is a syntactic fact of the
        pullback (x_i -> g*u_i^ell raises each x-degree by ell), and the
        solving-degree growth law under variable substitution is the exact
        quantity the SEMBIN lane's d_F4 separation work measures. The
        rigorous anchor is the bounded-degree solving-degree theory; the
        classical statement imitated is that substitution-inflated systems
        solve at the inflated degree of regularity.
      validation_plan: >-
        Measure per-solve cost of lifted vs unlifted systems across
        ell in {3,5,7} at fixed p and fit the inflation exponent against
        poly(ell); compare with the SEMBIN lane's existing degree-scaling
        laws. Falsified if inflation is superpolynomial in ell at toy scale,
        in which case the coset class is dominated and the record says so.
  target_complexity:
    time_exponent: >-
      CONDITIONAL, MEASURED-ONLY: if the anomaly factor rho_ell(p) grows as
      p^{gamma} with gamma > 0 (the growth gate), the charged relation cost
      of the F2 frame improves by p^{gamma} against the same-frame baseline
      -- an exponent move in the SUPPLY term only, never claimed as an
      end-to-end attack exponent before the growth gate and the descent
      charge. As proposed: no exponent claim; the testable quantity is
      rho_ell at toy scale.
    memory_exponent: unchanged from the F2 frame (factor base and relation
      storage), plus O(1) per membership test.
    best_known: >-
      Pollard rho n^{1/2} (generic), and the F2-frame baseline the lane
      already prices: EV-FB-001's structure-invariant yield at
      |FB|^m/N with d-scaling. This idea claims only a possible deviation
      of the supply constant in that frame.
    hidden_overhead: >-
      The membership exponentiation (O(log p) per test) and the lifted
      solving degree (poly(ell)) are the entire added overhead, both charged
      in the metric; the o(1) language of asymptotic claims is not used
      because no asymptotic claim is made.
    tradeoff_note: >-
      Larger ell: richer cover structure, fewer coset points (|F_ell,g| ~
      p/ell), higher degree inflation -- an explicit three-way tradeoff the
      (ell, g) grid measures; parallelisation is per-row and flat.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
