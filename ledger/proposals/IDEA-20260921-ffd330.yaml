  proposed_by: idea-generator
  proposed_at: '2026-09-21'
  question_id: RQ-CRYPTO-001
  goal_id: GOAL-CRYPTO-001
  added: '2026-09-21'
  status: proposed
  title: >-
    POWER-RESIDUE COSET FACTOR BASES ARE THE UNTESTED STRUCTURE CLASS, AND
    THEY LIFT: a factor base of points whose x-coordinates lie in a fixed
    multiplicative coset g*H of F_p^* (H the ell-th powers) has a
    membership predicate of degree (p-1)/ell -- squarely in the HIGH-DEGREE
    open class of KN-OPEN-020 that EV-FB-001's structure-invariance negative
    never touched (it tested random/interval/AP, all degree <= 2) -- and the
    coset condition is EXACTLY a degree-ell cover C_g -> E on the
    x-coordinate (x = g*u^ell), so the restricted decomposition system is
    the summation system PULLED BACK to C_g, whose solution density is a
    different algebraic question from a random same-size slice, with a
    cheap, fully controlled toy test that either finds a measurable supply
    anomaly or extends the structure-invariance negative to the last
    testable class before the implicit/oracle classes.
  class: representation
  claim: >-
    REPRESENTATION CLASS AND ATTACK STAGE (one clause, per
    docs/object-frame-ideation.md section 4): the representation is class R1
    of RQ-ECDLP-623a32 (the x-coordinate in F_p, factored through the
    degree-(p-1)/ell power-residue partition of F_p^*), and the attack stage
    whose charged cost it claims to change is RELATION DECOMPOSITION SUPPLY
    (the yield of m-fold summation-polynomial solutions per charged solving
    second). CLAIM: for a factor base F_ell,g = {R in G \\ {O} : x(R) in
    g*H_ell}, the density of S_m-decompositions with all x-coordinates in
    the coset equals the density of solutions of the summation system pulled
    back along the degree-ell cover C_g -> E, and is therefore NOT constrained
    by EV-FB-001's structure-invariance result (which measured only degree
    <= 2 base structures); the density is measurable on toy curves against a
    matched-size random-subset control, and deviates from it by a factor
    bounded away from 1 in a direction predicted by the cover's genus and
    point count -- or the negative result extends structure-invariance to
    the high-degree class with the cover mechanism recorded as the
    obstruction.
  mechanism: >-
    PAIR AND OPERATION SET: the tracked object is the relation vector over
    the factor base F_ell,g -- Class I, PARTIAL-ACTION, exactly as all index
    calculus is (IDEA-20260806-c5d183): the relation vector propagates
    deterministically under translation by factor-base elements only, never
    under the full translation action (closed for lossy objects by
    KN-FIND-ffe1df Theorem C). The representation side of the pair is the
    R1 statistic chi_ell(x(R)) in {0,...,ell-1} (the power-residue coset
    label, computable as x(R)^{(p-1)/ell} in one exponentiation); what the
    projection discards is the point's coset label, and the discard is
    Sigma-compatible precisely in the partial-action sense above: a sum of
    points is IN F_ell,g-mixed relation only through the solved
    decomposition, which is why the supply question is the load-bearing one.

    WHY THE COSET CLASS IS GENUINELY DIFFERENT FROM WHAT WAS MEASURED.
    EV-FB-001 tested random, interval, and arithmetic-progression factor
    bases at p ~ 2^14, m = 3: yield, solving degree, and solve cost were
    structure-invariant (combinatorial |FB|^3/N with d-scaling). Those
    structures are all degree-1 or degree-2 conditions on x -- they change
    WHICH x-values are sampled but not the algebra of the system. A
    power-residue coset is different in kind: x in g*H_ell is equivalent to
    the EXISTENCE of u with x = g*u^ell, so the restricted system is the
    summation system on the pulled-back curve
    C_g : y^2 = (g*u^ell)^3 + a*(g*u^ell) + b, a degree-ell cover of E on
    the x-line, and the count of E-points with x in the coset is the point
    count of C_g(F_p) in the fibre -- a Hasse-Weil quantity of a DIFFERENT
    curve, governed by the cover's genus ~ (ell-1)/2 * ... and trace, not by
    a uniform-density heuristic over F_p. The density of m-fold
    decompositions with all x_i in the coset is correspondingly a period /
    intersection-theoretic quantity on C_g^m, for which the random-slice
    heuristic is exactly the hypothesis under test. This is the first
    factor-base structure in the program whose membership predicate is
    algebraic of DEGREE (p-1)/ell -- KN-OPEN-020's HIGH-DEGREE open class --
    so neither its scoped-out bounded-degree theorem nor EV-FB-001's
    measured structures say anything about it.
  novelty_status: unverified
  citations:
    - ref: EV-FB-001
      provenance: internal
      claim: >-
        At toy scale (p ~ 2^14, m = 3, d <= 12), factor-base structure is
        not a scaling lever for prime-field PDP: yield, solving degree, and
        solve cost are structure-invariant across random/interval/AP bases
        (within 1.1x of random); subgroup bases were excluded as too small
        to test.
      verified_by: "coordinator session, full read of the record on 2026-09-21"
    - ref: KN-OPEN-020
      provenance: internal
      claim: >-
        Every bounded-degree algebraic factor base over a generic
        prime-field subgroup is scoped out with charged costs; the open
        classes are high-degree, implicit-membership, and target-dependent
