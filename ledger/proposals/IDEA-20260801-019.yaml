idea:
  id: IDEA-20260801-019
  question_id: RQ-HAWK-001
  title: >-
    Module-LIP key-recovery break re-verification: independent implementation
    of the reported HAWK key-recovery attack at reduced parameters
  class: verification
  claim: >-
    The reported HAWK key-recovery break — module-LIP (module
    lattice-isomorphism problem) key recovery — can be independently
    re-implemented at reduced parameters: an independent implementation
    either reproduces the reported break at reduced size, confirming the
    literature claim and its parameter implications, or fails to reproduce
    it, indicating the reported break needs scrutiny. This is the
    independent verification step the HAWK goal requires before any
    parameter-level conclusion.
  mechanism: >-
    The reported break reduces HAWK key recovery to module-LIP in dimension
    n/2 + 1; at reduced parameters the module-LIP solver is feasible to
    implement independently. The verification re-implements the reduction
    and the solver from the report's specification (not its code), runs it
    at reduced parameters, and compares the recovered-key success rate and
    cost to the report's claims.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/literature
      - ledger/proposals
    grep_results:
      - No existing proposal re-implements the module-LIP key-recovery
        break in this program.
    conclusion: >-
      Verification proposal; novelty unverified against full literature, but
      the deliverable is an independent re-implementation, not a new claim.
  assumptions:
    - The report's specification of the reduction and solver is sufficient
      for independent implementation.
    - Reduced parameters make the solver feasible.
  predictions:
    - metric: recovered_key_success_rate_and_cost
      direction: higher
      minimum_effect: >-
        Matching the report's success rate within 20% at the same reduced
        parameters constitutes confirmation.
  minimal_test:
    design: >-
      Re-implement the reduction and solver from the report; run at the
      report's reduced parameters (and one lower set); measure success rate,
      time, and memory; compare to the report's claimed figures.
    controls:
      - Independent implementation from the specification (no shared code).
      - Sanity solver on random (non-key) module-LIP instances.
    required_metrics:
      - success rate at the report's parameters
      - time and memory
      - comparison table vs report claims
  falsification_conditions:
    - Success rate matches within 20% (break confirmed; parameter
      implications stand).
    - Success rate materially below the report's claim (break not
      reproduced; scrutiny required).
  confounders:
    - Implementation bugs in the reduction.
    - Parameter-reporting ambiguity in the literature.
  interpretation_limits:
    - Verification at reduced parameters only; no claim about full-size HAWK
      parameters.
    - Reproduction does not upgrade the break's crypto-scale status.
  heuristic_assumptions:
    - id: HEUR-HAWK-VER-1
      statement: >-
        The module-LIP solver's success behavior at reduced parameters is
        representative of its behavior at the report's tested range.
      rigorous_support: None; heuristic, checked by the two parameter sets.
      validation_plan: Run at the report's parameters and one lower set; the
        trend validates the assumption.
  target_complexity:
    time_exponent: n/a (verification)
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: null
  sota_delta: >-
    Deliverable is an independent reproduction of a reported break: either
    confirmation (with a measured success/cost table) or non-reproduction
    (with a scrutiny note).
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: high
