idea:
  id: IDEA-20260808-c5f9a2
  date: '2026-08-08'
  question_id: RQ-ECDLP-002
  batch_id: BATCH-b84625
  title: >-
    Endomorphism-image oracle for structural decomposition: use oracle to test
    if point lies in image of known endomorphism φ
  mechanism: >-
    Use an oracle that tests whether a point P lies in the image of a known
    endomorphism φ: E → E. The oracle answers: "is P ∈ φ(E)?" If yes, the
    oracle also returns Q such that φ(Q) = P. This partitions the search space
    by algebraic structure (cosets of φ(E)). The search becomes: enumerate
    (m-1)-tuples, query oracle to check if the partial sum lies in φ(E), if yes
    retrieve Q and check if Q completes a relation. This exploits curve symmetry
    (endomorphism structure) rather than coordinate structure. The prediction is
    Y_φ / Y_exhaust = m/d where d = deg(φ), because the endomorphism reduces the
    effective search space by a factor of d. This avoids the MITM obstruction
    because the oracle is used to exploit algebraic structure, not to filter
    coordinates.
  predictions:
    - metric: Y_φ / Y_exhaust
      direction: higher
      minimum_effect: >-
        Constant factor m/d where d = deg(φ). For φ of degree 2 (e.g.,
        negation map), d=2 and the advantage is m/2. For φ of degree 4, d=4
        and the advantage is m/4. The advantage grows with the degree ladder
        {1, 2, 4, 9}.
  test_boundary:
    instances:
      - m=3, primes {101, 103, 107, 211}, b in {0.4, 0.5}, seeds 1-5
      - curves with known endomorphisms: j=0 (CM discriminant -3, φ of degree 3),
        j=1728 (CM discriminant -4, φ of degree 2)
    parameters:
      claim_tier: toy
      field_bits: 7-8
    implementation: >-
      Modify experiments/EXP-SEMAEV-f48dd1/implementation/full_grid.py to add
      Arm E: endomorphism-image oracle. Test degree ladder {1, 2, 3, 4, 9}.
      Compare against Arm A (exhaustive) and Arm B (x-oracle MITM).
    budget:
      wall_clock_seconds_per_run: 120
      total_wall_clock_seconds: 3600
  falsification_conditions:
    - >-
      Y_φ / Y_exhaust <= 1.0: the endomorphism-image oracle provides no
      construction advantage.
    - >-
      Y_φ / Y_exhaust < m/d - epsilon: the advantage is sub-linear in m/d,
      suggesting the oracle's algebraic structure is not effective.
    - >-
      Null control (random endomorphism, not a curve endomorphism) yields same
      ratio: the advantage comes from the oracle's algebraic correctness, not
      from the construction pattern itself.
  interpretation_limits:
    - >-
      Toy-scale only (7-8 bit prime fields); no claim about cryptographic-scale
      parameters (AGENTS.md rule 7).
    - >-
      Constant factor only; no asymptotic exponent change. Both guided and
      exhaustive search have the same asymptotic complexity O(|F|^m).
    - >-
      Dominated by Pollard rho at any reasonable parameter choice. This is a
      measurement of endomorphism-guided construction efficiency, not a
      crypto-scale attack.
    - >-
      Applies only to curves with known endomorphisms (j=0, j=1728). Generic
      curves have no efficiently computable endomorphisms.
  dominated_by:
    - IDEA-20260808-3f8a2b (x-oracle MITM, now closed with obstruction)
    - IDEA-20260808-7c4e9d (true-null control analysis, now closed)
    - H-STR-002 (endomorphism-based linear algebra, weakened)
  sota_delta: >-
    No asymptotic improvement over Pollard rho. Constant-factor measurement at
    toy scale. Structurally distinct from MITM: exploits curve symmetry, not
    coordinate structure. Avoids the x-oracle MITM obstruction by using the
    oracle to exploit algebraic structure rather than filtering coordinates.
    Applies only to curves with known endomorphisms.
  novelty_status: novel
  proposed_by: idea-generator
  status: proposed
