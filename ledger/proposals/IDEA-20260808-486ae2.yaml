idea:
  id: IDEA-20260808-486ae2
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  title: 'Windowed-tree point decomposition: the only factor-base family the algebraic no-go
    leaves open is the lattice-describable one, and its solver is a multivariate small-root
    method whose reachable-box exponent eps(m) must exceed m/(2(m-1)) to beat rho.'
  class: algorithm
  claim: '(A) CLASSIFICATION. IDEA-20260801-021 / IDEA-20260803-e2f5bd bound any factor base
    cut out by a target-independent proper algebraic locus Z of degree d by |F_p-points used|
    <= 3d, so an algebraic factor base of size B costs description degree >= B/3 and its membership
    polynomial is the trivial product prod(x - v). Subsets of F_p that are describable at
    cost o(B) therefore fall into exactly one further family: LATTICE- DESCRIBABLE sets (intervals,
    arithmetic progressions, rank-r generalized APs), whose membership is an archimedean inequality,
    not a polynomial identity. This record is the claim that this family is nonempty, unclosed,
    and has a computable exponent. (B) THE OBJECT. Fix a degree-2 map u : E -> P^1 (u = x
    in short Weierstrass) and a window W = [0,B) subset F_p. Factor base V = { R in E(F_p)
    : u(R) in W }, |V| ~ B. (C) THE SOLVER FAMILY. A decomposition R = P_1 + ... + P_m is
    a root of a system built from a BINARY ADDITION TREE on m leaves with a chosen subset
    S of internal nodes kept as explicit variables (each windowed to size B'') and the rest
    eliminated by resultants. S = {} gives one equation S_{m+1}(x_1..x_m, x_R) = 0 of per-variable
    degree 2^{m-1}; S = all internal nodes gives m-1 equations S_3(.,.,.) = 0 of bidegree
    (2,2). Every member is a system of modular equations mod p in bounded unknowns, i.e. exactly
    the input of a Coppersmith / Howgrave-Graham / Jochemsz-May small-root solver. (D) THE
    FALSIFIABLE NUMBER. Define eps(m, tree) as the largest e such that the small-root solver
    certifiably returns all roots whenever the product of the variable bounds is at most p^{e
    * (#equations)}. Then windowed index calculus beats Pollard rho iff eps > m/(2(m-1)) (and
    eps < m/4 for the linear algebra to stay under N^{1/2}). Concretely: m = 3 has an empty
    admissible band; m = 4 requires eps > 2/3; m = 5 requires eps > 5/8; m -> infinity requires
    eps > 1/2. The claim is that eps(m, tree) is computable in closed form from the Newton
    polytope of the system by the Jochemsz-May extended strategy, with zero compute, for every
    m and every tree.'
  mechanism: 'Index calculus over F_{q^n} works because the factor base {x in F_q} is cut
    out by LINEAR conditions after Weil restriction, so the decomposition test is a fixed-degree
    polynomial system whose cost is independent of q. Over F_p there is no subfield, so the
    classical substitute for "linear condition" is "archimedean smallness", and the classical
    substitute for Groebner elimination is lattice reduction: Howgrave-Graham''s lemma turns
    a short vector in the shift lattice of the modular system into an identity over Z, whose
    integer roots are read off exactly. The method is complete inside its bound (KN-TECH-015),
    which is what makes eps a genuine algorithm parameter rather than a heuristic. The tree
    parameter exists because eliminating an internal node doubles per-variable degree (S_{m+1}
    has degree 2^{m-1}) while keeping it as a windowed variable multiplies the yield by B''/p;
    the small-root reach degrades roughly like 1/degree, so the optimum is interior. Grouping
    the m leaves into g groups of c = m/g balances the two degrees at 2^{sqrt(m)-1} instead
    of 2^{m-1}, which is the only known way to keep the degree subexponential in m while retaining
    any yield at all.'
  why_not_a_renamed_known_approach: 'Nearest known method 1: EXP-COPP-001 / KN-TECH-015 "program
    usage" — a Howgrave-Graham shift lattice on S_3 in a window [0,X]x[0,Y], whose declared
    win condition is that "windowed relation density rho_W must exceed the equidistribution
    baseline XY/p^2". That framing is wrong for the exponent and is the reason the lane stalled:
    at m = 2 the exhaustive solver already costs only B (enumerate x_1, solve the quadratic
    for x_2, test the window), so no lattice method can win, and density is irrelevant. The
    present record moves the target to m >= 4, where exhaustive search costs B^{m-1} and a
    poly-time solver is worth an exponent, and replaces "density beats equidistribution" with
    the correct criterion eps > m/(2(m-1)) at conserved (equidistributed) density. KN-FIND-007
    is not violated: mean yield stays exactly C(B+m-1,m)/N, and every gain claimed here is
    in the SOLVE stage, which KN-FIND-007 explicitly declines to cover. Nearest known method
    2: Semaev''s original prime-field proposal (interval factor base) — external, unverified
    in this session; the differentiator is the arity-indexed threshold and the tree/degree-yield
    optimization, not the interval itself. Nearest known method 3: Gaudry-Diem extension-field
    index calculus — inapplicable, no subfield; this record supplies the archimedean substitute
    for the missing subfield.'
  predictions:
  - observable: closed-form Jochemsz-May reach for the m = 3 system {S_4(x1,x2,x3,xR)=0}
    metric: eps(3, empty tree), derived symbolically from the Newton polytope of S_4
    predicted: eps(3) <= 1/4, i.e. far below the 3/4 the threshold demands; degree 4 per variable
      is predicted to cap the reach near 1/deg
  - observable: closed-form reach for the fully windowed caterpillar at m = 4
    metric: eps(4, all internal nodes windowed)
    predicted: 'system is underdetermined (2m-2 unknowns, m-1 equations); the yield constraint
      forces window size >= p^{1/2}, hence B^2 >= p and the linear algebra exceeds N^{1/2}:
      the fully windowed extreme is dead by arithmetic, before compute'
  - observable: interior optimum over group size c
    metric: total cost exponent 2/(2 + (m-1)(1-sigma_eff)) evaluated along the grouping
    predicted: the optimum sits at c ~ sqrt(m); if the resulting eps still fails eps > m/(2(m-1))
      for all m <= 12, the windowed family is closed at the level of currently known small-root
      technology
  - observable: toy-scale planted-root recovery threshold
    metric: empirical eps-hat = log_p(B^m) at which the implemented solver stops returning
      a planted windowed decomposition, at p in [2^20, 2^28], m = 3
    predicted: eps-hat within 0.05 of the derived eps(3); a large gap in either direction
      means the derivation or the implementation is wrong and must be reconciled first
  minimal_test: 'Zero-compute stage first: write the Newton polytope of S_4 and S_5 (they
    are known in closed form; harness/semaev.py already carries s3_expr), run the Jochemsz-May
    extended strategy symbolically, and emit eps(m, tree) for m in {3,4,5} and the three trees
    (empty / grouped c=2 / full). Compare against the threshold table eps* = m/(2(m-1)) =
    {0.75, 0.667, 0.625}. This costs an afternoon of algebra and no CPU. Only if some cell
    clears eps* does the compute stage open: implement the shift lattice at p ~ 2^24, plant
    a windowed m-decomposition by construction (pick m windowed points, set R = their sum),
    and measure the recovery threshold with a scrambled-window null.'
  controls:
  - 'Scrambled-window null: replace W by a uniformly random size-B subset of F_p with the
    same cardinality; the lattice solver must FAIL there. If it succeeds equally, the measured
    effect is lattice-reduction luck on a random system, not window structure.'
  - 'Null curve: same degrees and same window, but the polynomial replaced by a random polynomial
    with the identical Newton polytope and no group-law meaning; reach must be indistinguishable
    (this isolates polytope effects from curve effects).'
  - 'Exhaustive cross-check at small B: enumerate all windowed m-tuples and confirm the solver
    returns exactly the same solution set (completeness inside the bound is the method''s
    selling point and must be verified, not assumed).'
  - Matched-cost rho control on the same instances, charged in the shared unit of IDEA-20260802-007,
    so the comparison is not solver-time-vs-group-operations.
  confounders:
  - Jochemsz-May bounds are asymptotic in the shift parameter; at small p the achieved reach
    is smaller than the asymptotic eps, so a toy failure does not falsify eps.
  - 'The algebraic-independence heuristic: the method returns polynomials, and the final root
    extraction can fail even inside the bound. This must be logged separately from a bound
    failure or the two get conflated.'
  - '|V| ~ B counts points, not x-values: each windowed x gives 0 or 2 points, so the effective
    base is ~B with a factor-2 wobble that must not be read as a yield effect.'
  - 'Sign/monodromy: solving in u-coordinates gives an unordered sign pattern; the C_2^{m-2}
    ambiguity (KN-FIND-a1f3c2) costs 2^{m-2} per candidate. Negligible in the exponent but
    must be charged, or the solver looks cheaper than it is.'
  falsification_conditions:
  - eps(m, tree) <= m/(2(m-1)) for every tree and every m <= 12 under the Jochemsz-May strategy
    => the windowed family is closed at current small-root technology, and the record converts
    into a scoped closure naming that technology as the obstruction.
  - The grouped-tree yield constraint forces B >= p^{1/4} for every admissible cell => the
    linear algebra alone exceeds N^{1/2} and the family is dead independently of eps.
  - Toy-scale eps-hat matches the derivation AND the derivation is below threshold => the
    family is closed with a validated instrument, which is the strongest negative available.
  - Toy-scale eps-hat exceeds the derived eps by more than 0.05 with the scrambled-window
    null failing => the derivation is wrong, not the idea, and the derivation is redone.
  interpretation_limits: 'Everything here is conditional on Jochemsz-May-style lattice reach
    being the best available small-root technology; a better small-root method changes eps
    and reopens cells this record would close. Toy-scale reach measurements are toy: they
    calibrate the instrument and cannot validate a crypto-scale exponent. No claim is made
    that a windowed decomposition exists for any particular target: yield is exactly the KN-FIND-007
    mean.'
  assumptions:
  - E/F_p ordinary, <P> of prime order N with N ~ p and cofactor O(1).
  - Semaev polynomials S_{m+1} exist and are computable for the m considered (m <= 6 is routine;
    m = 7 is already large).
  - Sparse linear algebra over Z/N at cost m*B^2 (Wiedemann), no structured speedup assumed
    (H-STR-002 was weakened, so none is claimed).
  heuristic_assumptions:
  - id: HA-1
    statement: For a uniformly random target R in <P>, the number of m-multisets from V summing
      to R is distributed as Poisson with parameter mu = C(B+m-1,m)/N, uniformly for B = N^beta
      with beta in (0, 1/4] and m fixed.
    rigorous_ingredient: 'The mean is EXACT and geometry-independent (KN-FIND-007 double count:
      sum_r c_V(r) = C(B+m-1,m)). Only the distribution is assumed.'
    distribution_imitated: The Poisson limit for the number of representations in a random
      sumset (Erdos-Renyi representation-function heuristic), the same assumption Gaudry-Diem
      make implicitly when they use the 1/n! decomposition rate.
    validation_route: At toy p (2^18-2^26) with a windowed V, compute the exact histogram
      of c_V(r) over all r by one FFT-free pass over all m-multisets (feasible for B^m <=
      2^30), and compare against Poisson(mu) by chi-square and by the upper tail. Sample the
      same statistic for a random-subset V of equal size as the null. Label toy.
    tail_checks: Coverage ratio (fraction of r with c_V(r) >= 1) must satisfy the KN-FIND-007
      inequality coverage <= min(1, mu) and must not exceed the Sidon ceiling 1.107 x the
      random base; the maximum of c_V over r must not exceed the Poisson prediction by more
      than a factor of log N (a large excess indicates additive structure in the window and
      would itself be a finding).
  - id: HA-2
    statement: The Jochemsz-May asymptotic reach eps(m, tree) is attained by shift lattices
      of dimension poly(log p), i.e. the asymptotic bound is not an artifact of unbounded
      lattice dimension at the operating point.
    rigorous_ingredient: 'Howgrave-Graham''s lemma is unconditional: any lattice vector of
      norm below the stated threshold yields an identity over Z. Only the CONVERGENCE rate
      is assumed.'
    distribution_imitated: The standard convergence behaviour of Coppersmith lattices in the
      univariate case, where dimension O(d/eps) suffices to approach the asymptotic bound.
    validation_route: Measure the achieved reach as a function of shift dimension D at fixed
      toy p and fit reach(D); check that reach(D) plateaus below poly(log p) rather than creeping.
      This same curve is the input to E1-05 and must be produced once, not twice.
    tail_checks: If reach(D) is still increasing at the largest feasible D, HA-2 fails and
      the honest statement is that eps is unknown, not that eps is small.
  - id: HA-3
    statement: For the grouped tree, the small-root solver's failures are independent across
      targets, so the expected number of targets per relation is P_dec^{-1} and not larger.
    rigorous_ingredient: Targets R = aP + bQ are uniform in <P> for uniform (a,b), a fact
      about the group.
    distribution_imitated: Independence of solver success across independent instances of
      a fixed system shape.
    validation_route: At toy scale, measure the empirical number of targets consumed per recovered
      relation against P_dec^{-1}; a systematic excess signals correlated solver failure,
      which would be a genuine (and reportable) obstruction.
    tail_checks: The distribution of targets-per-relation must be geometric; a heavy tail
      means some targets are structurally unsolvable and the cost model is wrong.
  target_complexity:
    time_exponent: 'Conditional on eps(m) > m/(2(m-1)): total N^{2 eps/m} with beta = eps/m,
      i.e. N^{1/2 - delta} with delta = (eps(m-1)/m - 1/2). At the boundary values this is
      N^{0.40} for (m=5, eps=0.8) and N^{0.33} for (m=6, eps=1). If the reach could be pushed
      to eps -> 1 for all m (the information-theoretic ceiling), the same accounting with
      the m! factor restored gives exp((2+o(1)) sqrt(log N log log N)) = L_N(1/2, 2), i.e.
      SUBEXPONENTIAL prime-field ECDLP. That is the prize; it is not claimed.'
    memory_exponent: 'N^{eps/m} = N^{beta} <= N^{1/4}: strictly less memory than time, unlike
      the Wesolowski exemplar where memory equals time. Relation collection is memory-free;
      the B x B sparse matrix is the only large object.'
    best_known_baseline: 'Pollard rho / vOW: 0.886*N^{1/2} group operations, O(1) memory,
      perfect parallel speedup (KN-TECH-006). BSGS: N^{1/2} time and memory. No published
      prime-field index calculus beats either.'
    hidden_overhead_disclosure: The m! factor is superpolynomial once m grows with N and is
      the entire reason the subexponential corner sits at L(1/2) rather than lower. The poly(log
      p) in T_solve hides LLL/BKZ cost O~(D^6 B_bits^3) (KN-TECH-015) with D the shift dimension,
      which is a large polynomial and dominates at any realistic p. The 2^{m-2} sign-pattern
      factor is charged but small. No claim of a concrete-cost table is made here; per AGENTS
      target-profile A8 one is required before any promotion.
    time_memory_tradeoff: Memory is the factor-base size and is a free parameter beta; lowering
      beta lowers memory and raises relation cost as N^{1 - beta(m-1)(1-sigma)}. Against vOW
      at matched memory w, rho gives N^{1/2} at w = O(1), so this family must beat N^{1/2}
      outright, not merely at large memory. Relation collection is embarrassingly parallel;
      block Wiedemann parallelizes the linear algebra with communication cost B per block.
  sota_delta: 'If eps clears the threshold at m = 5, the exponent moves from 0.500 to 0.400
    (a factor N^{0.1}: ~2^{25} at N ~ 2^{256}) at memory N^{0.16}. If eps -> 1 is reachable,
    the move is from N^{0.5} to L_N(1/2, 2), which would be the first subexponential prime-field
    ECDLP. If eps is capped near 1/deg = 2^{1-m}, the delta is negative for every m and the
    honest sota_delta is zero with a closure attached.'
  dominated_by: 'Pollard rho / vOW at N^{1/2} with O(1) memory dominates every currently derivable
    instance of this family, because no eps clearing m/(2(m-1)) is known. Checked against
    each frontier row: (i) rho/vOW N^{1/2}, memory O(1); (ii) BSGS N^{1/2}/N^{1/2}; (iii)
    preprocessing frontier S*T^2 = N (Mihalcik / Bernstein-Lange) — not comparable, it assumes
    free preprocessing and this record claims none; (iv) multi-target Kuhn-Struik sqrt(T*N)
    — see E1-12; (v) special-curve attacks (anomalous, small embedding degree, extension fields)
    — out of scope, generic prime-field curves only.'
  estimated_cost: 'Zero-compute derivation stage: 1 analyst-day, no CPU. Compute stage (only
    if a cell clears): implementation medium (shift-lattice generator + fpylll/flint + planted-root
    harness, ~1-2 weeks), compute low-to-medium (single machine, hours per cell at p <= 2^28);
    no crypto-scale compute is proposed or possible.'
  recommended_priority: high
  honest_prior_of_survival: 'P(some cell clears eps > m/(2(m-1))) ~ 0.05. Small-root reach
    for a degree-d modular equation is empirically near 1/d and the threshold demands near
    1/1; the grouped tree helps but the yield price is severe. P(the derivation itself is
    decision-relevant, i.e. closes or opens the family cleanly) ~ 0.8, which is why the priority
    is high despite the low success prior: this is the cheapest remaining question with a
    two-sided answer.'
