  discriminated_from: 'KN-TECH-015 program usage / EXP-COPP-001: same tool, different arity
    (m>=4 not m=2) and different win condition (solver exponent, not windowed relation density).
    KN-FIND-007: disjoint — that finding fixes mean yield and explicitly excludes solve cost.
    IDEA-20260801-021 / IDEA-20260803-e2f5bd: this record USES their algebraic no-go as the
    classification step and claims the lattice-describable complement they do not cover. IDEA-20260727-003
    (free-oracle cost floor F(beta,m)): that computes the floor at T_solve = 0; this parameterizes
