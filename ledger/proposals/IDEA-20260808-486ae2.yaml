  proof_search_map:
    bottleneck: T_solve, the cost of deciding and witnessing whether a given target decomposes
      over a size-B factor base. Every other stage of prime-field index calculus is already
      at its floor (yield exactly conserved, linear algebra already sparse-optimal).
    baseline_embedding:
      parameter_slice: sigma = 1 (exhaustive) reproduces the known statement that prime-field
        index calculus costs m!*N for every m and every B <= N^{1/2}, i.e. strictly worse
        than BSGS. The new method must contain that slice as its eps -> 0 boundary.
      reproduction_check: 'Symbolic: substitute T_solve = B^{m-1} into C_rel and verify the
        B-dependence cancels identically. Freeze as a regression fixture in the cost-model
        module.'
    observation_collision:
      observable: eps, the reachable-box exponent, is the certificate carrying the conclusion.
      distinct_preimage_search: 'Two distinct systems with the same eps: the true Semaev system
        and a random polynomial with the identical Newton polytope. If both have the same
        eps, eps is a polytope invariant and carries no curve information — which is the expected
        outcome and is exactly why the null-curve control is mandatory. A curve-dependent
        eps would be a much stronger and more surprising result.'
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: The windowed-tree system, replacing the single high-degree Semaev equation
        by a tree-indexed family of lower-degree systems with windowed internal nodes.
      predicted_gain: per-variable degree 2^{m-1} -> 2^{sqrt(m)-1} at a yield cost of (B'/p)
        per retained internal node; the optimum over trees is the object of the derivation.
    - transform: boundary_lift
      proposed_object: Lift the modular identity S = 0 mod p to an identity over Z with a
        bounded auxiliary integer, the standard Howgrave-Graham step.
      predicted_gain: converts a search over F_p into a lattice problem in dimension poly(log
        p).
    quantifier_order: 'EXISTS m >= 4, EXISTS a binary addition tree with windowing pattern
      S, EXISTS eps > m/(2(m-1)) such that FOR ALL primes p (outside a density-zero set) and
      FOR ALL ordinary E/F_p with |<P>| = N ~ p prime, the small-root solver returns every
      windowed m-decomposition of every target whenever B^m <= p^{eps}. The negation this
      record can also establish is: FOR ALL m <= 12 and FOR ALL trees, the Jochemsz-May reach
      satisfies eps <= m/(2(m-1)).'
    method_ceiling:
      strongest_certifiable_claim: A conditional exponent N^{2eps/m} with eps a derived, instrument-validated
        constant; never an unconditional bound, because Howgrave-Graham completeness is inside
        the bound only and the root-extraction step is heuristic.
      nearby_object_control: The same window and the same solver applied to a random size-B
        subset of F_p (no archimedean structure). The conclusion must FAIL there. If it does
        not, the method proves nothing about windows.
    proof_obligations:
    - claim: '|V| = B(1 + o(1)) for a window of length B'
      responsibility: size
    - claim: T_solve = poly(log p) inside the reach, with the LLL dimension stated
      responsibility: runtime
    - claim: the solver returns ALL windowed decompositions inside the reach
      responsibility: correctness
    - claim: P_dec = C(B+m-1,m)/N exactly (KN-FIND-007) and targets are uniform
      responsibility: success_probability
    - claim: C_LA = m B^2 with the relation matrix of full rank B - 1
      responsibility: baseline
    - claim: generic ordinary prime-field curves only; anomalous / small-k excluded
      responsibility: scope
