idea:
  id: IDEA-20260828-25fae7
  title: >-
    The 960/1216/1248-bit key-schedule annihilator that two already-filed
    proposals (the key-guessing floor and the active-S-box LP dual) treat as
    "catalogue-level, unvalidated, to be re-derived" but neither actually
    files as a standalone, independently checked record -- filing it, with a
    completeness check the catalogue entry itself never ran.
  class: measurement
  claim: >-
    Formalizes catalogue entry A2-1 (ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/A2.md,
    lines 165-236), INDEPENDENTLY RE-DERIVED rather than transcribed, and adds
    a check A2-1 itself never performed. Setup: relax SubBytes inside the AES
    key schedule to a FREE symbol sigma (an unconstrained 8-bit map), leaving
    RotWord, Rcon and the XOR recurrence fixed; the expanded key RK(K,sigma)
    is then exactly GF(2)-affine jointly in the master key K (128/192/256
    bits) and in the vector of sigma-evaluations (320/384/416 bits, one
    8-bit block per SubWord invocation). Define the ANNIHILATOR
    Ann = { L in (GF(2)^{1408})^* : L(RK(K,sigma)) is constant over every
    (K,sigma) }, i.e. the space of GF(2)-linear functionals of the full
    round-key bit string that are forced to a fixed value regardless of what
    the S-box does. CLAIM (i): dim(Ann) = 1408 - rank([A_K | A_sigma]) is
    EXACTLY 960 for AES-128, 1216 for AES-192, 1248 for AES-256 -- an exact
    integer, not a sampled estimate. CLAIM (ii), THE PART A2-1 DID NOT DO:
    the explicit 30/38/39-relation-per-word basis (one relation
    W[i] xor W[i-1] xor W[i-Nk] = 0 per key-schedule word whose recurrence
    carries no SubWord term) does not merely MATCH this dimension -- it
    SPANS the full computed annihilator, with zero residual dimension. TWO
    DISCRIMINATED OUTCOMES: if both claims hold exactly, this record converts
    a number IDEA-20260808-4c309d's key-guessing floor and
    IDEA-20260808-76260d's LP dual both currently import as "unvalidated"
    into an independently verified, load-bearing building block for both; if
    the explicit basis has a nonzero residual (spans a strict subspace of the
    true annihilator), there EXIST additional key-schedule relations beyond
    the recurrence-based ones this program has ever written down, and
    4c309d's floor is CURRENTLY OVERSTATED by up to that residual dimension
    in bits -- a concrete, quantified, immediately actionable correction to
    an already-high-priority filed record.
  mechanism: >-
    SubBytes is the only nonlinear operation in the key schedule; relaxing it
    to a free symbol sigma makes every word W_i an explicit GF(2)-linear
    combination of the 128/192/256 master-key bits and the (so-far)
    320/384/416 sigma-output bits introduced along the way (one 32-bit sigma
    block per SubWord call: Nr-1 calls for the mod-Nk boundary plus,
    for Nk=8 only, one extra call per two words at the mod-8-offset-4
    boundary). Concatenating all round keys' bits and all sigma bits gives a
    linear map (K,sigma) -> RK of the form A_K K xor A_sigma sigma xor c for
    a constant c from Rcon (which only shifts the affine offset, never the
    rank). dim(Ann) is the dimension of the LEFT NULL SPACE of [A_K | A_sigma]
    stacked as a 1408 x (128+320) (etc.) matrix over GF(2), computable by
    exact bitset Gaussian elimination -- a rank computation, not a search.
    THE TRACKED OBJECT is Ann itself, a projection of the full key-schedule
    map to "which linear functionals of the round-key bits are forced
    regardless of the S-box" -- genuinely lossy (the fibre over one Ann
    contains every one of the 256! possible substitutions for sigma, since
    Ann is by construction invariant under replacing SubWord by ANY 8-bit
    map) and compatible with the schedule's own operations because Ann is
    computed directly from the fixed linear structure (A_K, A_sigma) that
    every choice of S-box shares -- passing the lossy-projection test of
    docs/inventor-protocol.md section 2. This record does not merely recompute
    A2-1's headline number; its distinct contribution is CLAIM (ii), a basis-
    CONTAINMENT check (does the explicit 30/38/39-relation family span the
    full null space, or only match its dimension by coincidence with a
    residual the catalogue entry never checked for) -- exactly the gap
    IDEA-20260808-4c309d and IDEA-20260808-76260d both flag by calling A2-1
    "catalogue-level, internal_catalogue_unvalidated" and each re-deriving it
    ONLY as an inline aside within their own scope, never as a standalone,
    independently filed and checked record.
  novelty_status: adaptation
  citations:
    - ref: "ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/A2.md (entry A2-1, lines 165-236)"
      provenance: internal
      claim: >-
        dim(Ann) = 960/1216/1248 for AES-128/192/256's sigma-relaxed key
        schedule, with an explicit 30/38/39-relation basis, computed by rank
        elimination on a 1408 x (128+320-or-so) GF(2) matrix.
      verified_by: "idea-generator subagent (read A2.md lines 1-54 and 165-236 in full during idea generation)"
    - ref: "ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/REDTEAM.md (line 268, item on A2-1)"
      provenance: internal
      claim: >-
        Independent red-team review of A2-1 within this program judged
        "dim Ann = 960 is a THEOREM, not a prediction: (K,sigma) -> RK is
        injective, so rank = 448 exactly" -- i.e. reclassified the entry's
        ceiling from `medium` to `control`, raising confidence but not
        performing the basis-containment check this record adds.
      verified_by: "idea-generator subagent (read REDTEAM.md in full during idea generation)"
    - ref: IDEA-20260808-4c309d
      provenance: internal
      claim: >-
        Uses A2-1's relation count as the subtrahend `rel` in its certified
        key-guessing floor F = rank(M) - rel, explicitly stating "A2-1
        counts are re-derived, not cited" as an assumption, but performs
        that re-derivation only inline, within its own shape enumeration,
        never as a standalone checked record.
      verified_by: "idea-generator subagent (read ledger/proposals/IDEA-20260808-4c309d.yaml in full during idea generation)"
    - ref: IDEA-20260808-76260d
      provenance: internal
      claim: >-
        Names catalogue A2-1's count as an ingredient for extending its LP
        dual to key-schedule-coupled constraints, without independently
        filing a verification of the count itself.
      verified_by: "idea-generator subagent (read ledger/proposals/IDEA-20260808-76260d.yaml in full during idea generation)"
  assumptions:
    - "The pinned FIPS-197 harness's key-schedule recurrence (RotWord, SubWord placement, Rcon sequence, and the AES-256 extra SubWord at i = 4 mod 8) matches the real FIPS-197 specification; checked by a known-answer-vector gate (W[4], W[43] for AES-128, and the analogous AES-192/256 vectors) under two independent implementations before any rank is trusted."
    - "GF(2) bitset elimination on a matrix of this size (at most 1408 rows) is exact and reproducible independent of pivot order; checked by re-running with a second, differently ordered elimination."
    - "The sigma-relaxation model (SubBytes as a free unconstrained symbol) is the correct formalization of 'annihilator regardless of S-box choice'; an alternative formalization fixing SubBytes but varying only Rcon or RotWord is a different, narrower object and is not what this record computes."
  proof_search_map:
    bottleneck: >-
      Whether the explicit recurrence-based 30/38/39-relation basis SPANS
      the full computed annihilator or merely matches its dimension by
      coincidence -- the exact gap neither the catalogue entry A2-1 nor
      either of the two dependent filed proposals (4c309d, 76260d) checked,
      despite both resting a load-bearing number on it.
    baseline_embedding:
      parameter_slice: >-
        The FULLY LINEARIZED degenerate case (SubWord deleted entirely from
        the recurrence, |sigma| = 0), whose annihilator dimension is known
        in advance by elementary rank-nullity for each key size.
      reproduction_check: >-
        This degenerate fixture must return its hand-known dimension exactly
        before the real sigma-relaxed (SubWord present) count is trusted.
    observation_collision:
      observable: "dim(Ann), an integer, plus whether the explicit basis spans it."
      distinct_preimage_search: >-
        The dangerous collision is TWO DIFFERENT SPANNING SETS of the same
        dimension: an explicit basis could match dim(Ann) numerically while
        actually spanning a DIFFERENT subspace of the 1408-bit dual space
        than the true annihilator, if elimination pivoting silently drops a
        recurrence-based relation and picks up a spurious one of the same
        count. This is checked by verifying EVERY explicit basis vector
        actually lies in the null space (evaluates to a constant on sampled
        real schedules), not merely that the counts agree.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          replace "SubBytes is a fixed 8-bit bijection" with "SubBytes is an
          unconstrained free symbol sigma", turning a bijectivity/injectivity
          argument about the key schedule into a rank computation on an
          explicit GF(2)-linear map.
        predicted_gain: >-
          converts an assumption two other filed records currently import
          unchecked into an independently verified building block, or
          identifies a concrete, quantified correction to one of them.
    quantifier_order: >-
      FOR the fixed sigma-relaxed AES-{128,192,256} key-schedule linear map
      (a single, fully determined object per key size, with no key or S-box
      argument remaining after relaxation), COMPUTE dim(Ann) exactly and
      DECIDE whether the stated explicit basis spans it. This is a
      completeness question about ONE fixed linear map per key size, not a
      claim quantified over keys or over S-box choices.
    method_ceiling:
      strongest_certifiable_claim: >-
        "the sigma-relaxed AES-{128,192,256} key schedule's annihilator has
        dimension exactly D, spanned by the stated explicit basis" -- an
        algebraic fact about the RELAXED schedule that holds for every choice
        of S-box (hence for the real one too), and says nothing about
        whether the REAL, FIXED S-box supports additional relations beyond
        this relaxed floor.
      nearby_object_control: >-
        A schedule with NO nonlinear layer at all removed (i.e. sigma fully
        deleted, the degenerate baseline fixture) versus a hypothetical
        schedule where every single word passes through its own independent
        sigma call (the opposite extreme, annihilator forced to the
        bijectivity-only trivial space) -- both computed as sanity bounds the
        real count must sit between.
    proof_obligations:
      - claim: "degenerate fully-linearized fixture returns its hand-known dimension exactly"
        responsibility: baseline
      - claim: "dim(Ann) for the real sigma-relaxed schedule equals 960/1216/1248"
        responsibility: correctness
      - claim: "the explicit 30/38/39-relation basis spans the full computed annihilator, not merely matches its dimension"
        responsibility: strictness
      - claim: "all functionals in the basis are constant on >= 10^5 sampled real schedules per key size, zero exceptions"
        responsibility: success_probability
      - claim: "FIPS-197 known-answer vectors reproduce under the harness before any rank is trusted"
        responsibility: interface
    not_applicable_reason: null
  predictions:
    - metric: "dim(Ann) for the sigma-relaxed AES-128 key schedule"
      direction: different
      minimum_effect: "exactly 960, zero tolerance (an integer identity, not a fit)"
    - metric: "dim(Ann) for AES-192 and AES-256"
      direction: different
      minimum_effect: "exactly 1216 and 1248 respectively, zero tolerance"
    - metric: "residual dimension of (computed annihilator minus span of the explicit 30/38/39-relation basis)"
      direction: lower
      minimum_effect: "exactly 0; any nonzero residual is independently reportable as a new relation family and feeds back into 4c309d's floor"
    - metric: "dim(Ann) on the degenerate fully-linearized (SubWord deleted) fixture"
      direction: different
      minimum_effect: "exact match to the hand-computed rank-nullity value for that fixture, per key size"
    - metric: "count of exceptions among >= 10^5 sampled real schedules per key size where any one of the 960/1216/1248 functionals is non-constant"
      direction: lower
      minimum_effect: "exactly 0 exceptions"
  minimal_test:
    design: >-
      (1) Reproduce FIPS-197 known-answer key-expansion vectors under two
      independent implementations (openssl CLI and one from-scratch
      reference, since pycryptodome's availability is unresolved per
      IDEA-20260805-78d9bd) before any rank computation. (2) Build A_K, A_sigma
      symbolically for AES-128/192/256 by evaluating the recurrence with
      SubWord replaced by a formal free symbol per invocation; compute
      rank([A_K | A_sigma]) by exact GF(2) bitset elimination, twice, with two
      different pivoting orders, and require agreement. (3) Run the degenerate
      fully-linearized fixture as a pre-registered known-answer gate. (4)
      Extract the explicit 30/38/39-relation basis from the recurrence
      directly (one relation per word lacking a SubWord term) and check both
      that it has the predicted rank AND that every basis vector lies in the
      computed null space by direct symbolic substitution -- the containment
      check A2-1 itself never performed. (5) Evaluate all 960/1216/1248
      functionals on >= 10^5 independently sampled real schedules per key
      size and report the exception count.
    controls:
      - "Degenerate fully-linearized fixture (SubWord deleted), hand-known dimension, run first."
      - "Two independent GF(2) elimination pivot orders, required to agree exactly."
      - "FIPS-197 known-answer key-expansion vectors under two independent implementations, run before any rank is trusted."
      - "Basis-containment check (not dimension-matching alone) as the discriminating instrument for claim (ii)."
    required_metrics: [dim(Ann) per key size, degenerate-fixture dim(Ann), explicit-basis rank, basis-containment residual dimension, functional-evaluation exception count over the sampled schedules, elimination-order agreement]
  falsification_conditions:
    - "The degenerate fully-linearized fixture does not return its hand-known dimension -- instrument bug, stop before trusting anything else."
    - "dim(Ann) for any key size differs from 960/1216/1248 -- the sigma-relaxation model, the harness recurrence, or the elimination is wrong; both 4c309d and 76260d's use of this constant must be flagged for re-examination."
    - "The two independent elimination pivot orders disagree on dim(Ann) -- the elimination implementation is unreliable and no count from it may be reported."
    - "The explicit basis has a nonzero residual (does not span the full computed annihilator) -- a stronger, more interesting outcome: additional key-schedule relations exist beyond every one this program has written down, and 4c309d's floor is understated by up to the residual dimension in bits, rounded down."
    - "Any one of the 960/1216/1248 functionals is non-constant on any sampled real schedule -- the relations are not identities and everything downstream (4c309d's subtraction term, 76260d's key-schedule-coupled dual) that uses them is void until re-derived."
  confounders:
    - "The sigma-relaxation computes the annihilator that holds for EVERY choice of S-box, which is a valid (but possibly not maximal) annihilator for the real fixed AES S-box; a larger, S-box-specific annihilator could in principle exist and is explicitly out of scope here, named as an open successor question rather than assumed absent."
    - "GF(2) elimination bugs can silently produce a numerically matching dimension while computing a wrong basis; this is exactly why the containment check (not dimension-matching alone) is the load-bearing instrument, per the proof_search_map's observation_collision."
    - "AES-256's extra SubWord call at i = 4 mod 8 is a specific, easily misremembered detail of the recurrence; getting it wrong changes |sigma| and hence the predicted dimension for AES-256 specifically, which is why the KAT gate runs before any AES-256 rank is trusted."
  interpretation_limits: >-
    Purely an algebraic property of the sigma-relaxed key-schedule linear
    map; not a cryptanalytic claim, not a round-count claim, and not a
    statement about full-round or deployed AES security. Its entire value is
    as a LOAD-BEARING BUILDING BLOCK: it directly underwrites (not merely
    cites) IDEA-20260808-4c309d's certified key-guessing floor and
    IDEA-20260808-76260d's LP-dual integrality-gap program, both of which
    currently import this count as "catalogue-level, unvalidated." A
    positive result strengthens both; a residual finding requires both to be
    revisited before either is cited further.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        NONE LOAD-BEARING AS A DISTRIBUTIONAL HEURISTIC. Every claim here is
        an exact GF(2) linear-algebra identity (a rank computation and a
        basis-containment check on a fixed, finite linear map), not a
        statistical or asymptotic assumption. This entry exists to record
        that fact explicitly rather than leave the required field
        implying a heuristic that does not exist.
      rigorous_support: >-
        rank-nullity over a field, and the fact that a GF(2)-affine map's
        annihilator is exactly the left null space of its linear part --
        both elementary and exact once the harness's recurrence is confirmed
        to match FIPS-197.
      validation_plan: >-
        The one genuinely empirical step is confirming the pinned harness's
        recurrence IS FIPS-197's: validated by known-answer-vector
        reproduction under two independent implementations (stage 1 of the
        minimal test) before any algebraic claim is trusted, and by sampling
        >= 10^5 real schedules per key size to confirm the derived
        functionals are exactly constant (zero exceptions, not a rate).
  target_complexity:
    time_exponent: >-
      NOT APPLICABLE IN THE ASYMPTOTIC SENSE. AES has fixed key sizes
      (128/192/256); no exponent in a growing parameter is claimed or
      claimable here. This record's relevance to any exponent is entirely
      indirect, as a byte-count correction term feeding IDEA-20260808-4c309d's
      floor, which is itself explicitly named there as a search-pruning
      building block rather than an exponent-moving result.
    memory_exponent: "negligible -- matrices at most 1408 x ~1408 bits (well under 1 MB)."
    best_known: >-
      Catalogue entry A2-1's own count (960/1216/1248) is the only existing
      figure in this program, and it is exactly what this record
      independently verifies and extends with the containment check.
    hidden_overhead: "none; exact integer/rank arithmetic throughout, no o(1) terms."
    tradeoff_note: "not applicable; no attack, no time-memory tradeoff proposed."
  dominated_by: >-
    Checked all 16 filed RQ-AES-001 proposals: none formalizes A2-1
    standalone. IDEA-20260808-4c309d and IDEA-20260808-76260d each USE A2-1's
    count but explicitly label it unvalidated and re-derive it only inline
    within their own narrower scope -- this record is a PREREQUISITE neither
    of them discharges as a first-class, independently checkable artifact,
    so it is not dominated by either. External literature comparison is not
    applicable: this is an internal algebraic identity used purely as a
    building block, with no claim about the published state of the art in
    either direction.
  sota_delta: >-
    Zero attack delta. The delta is methodological and quantified: it
    converts a number TWO already-filed, high-priority proposals import as
    "catalogue-level, unvalidated" into either (a) an independently checked,
    load-bearing constant strengthening both, or (b) a concrete, quantified
    correction (the residual dimension, in bits) to IDEA-20260808-4c309d's
    certified floor -- the difference between a floor resting on an
    unverified subroutine and one resting on a checked one.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
