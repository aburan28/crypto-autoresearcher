idea:
  id: IDEA-20261007-7892fa
  question_id: RQ-EWALK-8fa147
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Nonzero multiples of one odd-order point on y^2 = x^3 + 9x + 2
    over F_43 have (n-1)/2 distinct x-coordinates
  class: control
  claim: >-
    Let E be y^2 = x^3 + 9x + 2 over F_43. If the discriminant is 0
    the model is singular and the run is an invalid setup. Otherwise
    let n be the largest odd order of an affine point, and let P be
    the affine point of order n with least x-coordinate, then least
    y in {0, 1, ..., 42}. If n is at most 1, the setup is invalid.
    Let X be the number of distinct x-coordinates among
    {kP : k = 1, ..., n-1}. The prediction is X = (n-1)/2. A
    different positive integer is a negative. This is the quotient
    by negation on one cyclic subgroup. It is not a count of
    preimages under doubling, it is not a census of |Aut|, and it
    does not run a walk. No discrete logarithm is computed, and the
    generic-group exponent 1/2 is unchanged.
  mechanism: >-
    PAIR (representation, Sigma): the representation is the
    x-coordinate and Sigma is repeated addition of P. Explanation A:
    kP and (n-k)P share x and no further collision occurs, so the
    negation quotient on this subgroup has size 2. Explanation B: X
    is not (n-1)/2, so an extra collision is present or negation
    failed. KR-RHO-0528e7, opened, prices that discount as a
    constant. This check does not time a walk.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        Automorphisms give rho a constant factor sqrt(m). Negation
        is the order-2 case. The exponent stays 1/2.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs a square-root number of group
        operations. An x-coordinate count does not beat that bound.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: RQ-EWALK-8fa147
      provenance: internal
      claim: >-
        The question asks whether an endomorphism or automorphism
        speedup exceeds sqrt(|Aut|) in practice.
      verified_by: ledger/questions/RQ-EWALK-8fa147.yaml
  assumptions:
    - n is odd and at least 3. An even order is not substituted.
    - P is one point. The count is not taken over the whole group.
    - A singular model is not scored.
  proof_search_map:
    bottleneck: >-
      Whether the nonzero multiples of P have exactly (n-1)/2
      distinct x-coordinates.
    baseline_embedding:
      parameter_slice: one ordinary-or-checked model at p = 43 and one point of odd order
      reproduction_check: >-
        nP = O and kP is not O for 0 < k < n. A failure of that order
        check voids X.
    observation_collision:
      observable: X - (n-1)/2
      distinct_preimage_search: >-
        Two multiples can share an x-coordinate beyond the pair
        {k, n-k}. That extra collision makes the difference nonzero
        and kills explanation A.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the set of x-coordinates of the subgroup generated by P
        predicted_gain: equality with (n-1)/2. No walk length.
    quantifier_order: >-
      For this one point on this one model, X equals (n-1)/2. This
      is not every curve and not a measured rho step count.
    method_ceiling:
      strongest_certifiable_claim: >-
        The negation quotient on this subgroup has size 2, or X
        disagrees with (n-1)/2.
      nearby_object_control: >-
        The point -P is included in the set and must share x(P). If
        it does not, the order check has failed and X is refused.
    proof_obligations:
      - claim: P has order n and n is odd and at least 3
        responsibility: correctness
      - claim: X equals (n-1)/2
        responsibility: strictness
    not_applicable_reason: >-
      No exponent is claimed. The map is still filled for this point.
  predictions:
    - metric: X - (n-1)/2
      direction: lower
      minimum_effect: exactly 0
    - metric: n
      direction: higher
      minimum_effect: at least 3
  minimal_test:
    design: >-
      Enumerate the affine points. For each point compute its order
      by repeated addition and keep the largest odd order. Break
      ties by least x then least y. List kP for k = 1 through n-1
      and count distinct x-coordinates. Compare with (n-1)/2. Do
      not run Pollard rho.
    controls:
      - The discriminant is nonzero.
      - nP = O and no smaller positive multiple is O.
      - n is odd and at least 3. Otherwise the setup is invalid.
      - x(-P) equals x(P). A mismatch voids X.
    required_metrics:
      - X
      - n
      - x_of_P
      - discriminant
  falsification_conditions:
    - The model is nonsingular, n is an odd integer at least 3, the order check passes, x(-P) = x(P), and X is not (n-1)/2.
    - No affine point has odd order greater than 1, or the model is singular. That run is an invalid setup and is not the negative.
  confounders:
    - Two different subgroups can have different X. The claim names one point, the least of largest odd order.
    - A point of even order can have x(kP) = x((n-k)P) fail when n-k wraps through 2-torsion. Even orders are excluded.
  interpretation_limits:
    - Equality says the negation quotient on this subgroup has size 2. It does not say a walk is faster than sqrt(2) times generic.
    - No discrete logarithm is computed. The exponent 1/2 is unchanged.
    - The scope is this one point at p = 43.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On a nonsingular short-Weierstrass model, the nonzero
        multiples of a point of odd order n have exactly (n-1)/2
        distinct x-coordinates, because k and n-k share x and no
        further collision occurs. This imitates negation. It is not
        a rho mixing time.
      rigorous_support: >-
        KR-RHO-0528e7, opened, prices negation as a constant factor
        inside sqrt(m) and does not count x-coordinates at p = 43.
      validation_plan: >-
        At this one point, record X and n. If X is not (n-1)/2, H1
        is false here. If no eligible point exists, refuse the
        comparison. No second prime and no timed walk.
  target_complexity:
    time_exponent: >-
      One enumeration of a group of size at most 44. The
      generic-group exponent 1/2 is unchanged.
    memory_exponent: O(1) field elements
    best_known: >-
      KR-RHO-0528e7, opened, gives only a constant automorphism
      factor. KR-RHO-13bf67, opened, gives the square-root generic
      bound. This count beats neither.
    hidden_overhead: >-
      The count is not a walk. That gap is stated in the claim and
      is not hidden in an o(1) term.
    tradeoff_note: >-
      No time-memory tradeoff. No distinguished-point storage.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-0528e7
      - KR-RHO-13bf67
      - KR-RHO-825bca
    nearest:
      - ref: KR-RHO-0528e7
        provenance: internal
        relation: adjacent
        delta: >-
          The opened row prices negation inside a constant factor.
          This idea adds one integer, X - (n-1)/2, predicted equal
          to 0, for one odd-order point on y^2 = x^3 + 9x + 2 over
          F_43. It does not time a walk, and the square-root
          exponent is unchanged.
  dominated_by: >-
    KR-RHO-0528e7 dominates any reading of this quotient as a
    speedup, because the opened row already prices negation as a
    constant. Pollard rho, at the square-root exponent in
    KR-RHO-13bf67, dominates the same reading. The x-coordinate
    count does not beat either baseline.
  sota_delta: >-
    No exponent is derived. The quantitative delta is the integer
    X - (n-1)/2, predicted equal to 0, at the prime 43. The
    generic-group exponent stays 1/2.
