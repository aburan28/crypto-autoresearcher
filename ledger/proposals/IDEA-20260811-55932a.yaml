idea:
  id: IDEA-20260811-55932a
  question_id: RQ-MSI-f760b2
  added: '2026-08-11'
  title: >-
    THE TWO-DIRECTION REDUCTION AND THE COST CEILING IT ASSEMBLES FROM PUBLISHED
    WORK: if the attaching map from O-oriented supersingular curves to modular
    symbols is Cl(O)-equivariant and Hecke-compatible in the sense its abstract
    claims, then MSI is bounded above by min(vectorization on Cl(O), EndRing,
    lattice decoding) -- giving MSI <= |disc O|^{1/4+o(1)} classically,
    2^{O(sqrt(log |disc O|))} quantumly, and p^{1/3+o(1)} conditional on
    Wesolowski's Heuristic 1 -- and the ONLY thing that can survive as new is the
    word SHORT, because class recovery does not imply short-representative
    recovery and the gap between them is a CVP in the relation lattice
  class: composition

  claim: >-
    (A) THE REDUCTION TARGET, AND WHY A CEILING IS THE RIGHT DELIVERABLE. A new
    assumption is worth analysing only if it is not bounded above by an old one.
    The abstract of arXiv:2603.29789 supplies, in its own words, two pieces of
    structure that are exactly the hypotheses a reduction needs: the attaching
    map is "compatible with the Hecke action", and MSI is stated to have a
    "relation to path problems on isogeny graphs and Bruhat-Tits trees". This
    record proposes to write that relation down as two explicit reductions with
    their cost losses charged, and to assemble the resulting CEILING from
    reductions already published, per the cascade discipline of
    docs/target-result-profile.md item A6.

    (B) DIRECTION R1, MSI SOLVES PATHS (THE DEFENDER'S DIRECTION). Let
    Att : {O-oriented supersingular E over F_{p^2}} -> M = H_1(X_0(N), C, Z) be
    the attaching map. Suppose (R1a) Att is computable forward in
    poly(log p, N), and (R1b) a SHORT representative of Att(E) determines, in
    poly time, a path in the l-isogeny graph from a fixed base curve E_0 to E.
    Then an MSI oracle solves the l-isogeny path problem for oriented curves,
    and MSI is AT LEAST AS HARD as that path problem. R1 is what an MSI-based
    construction would need to cite in a security proof, and this record's job
    is to determine whether (R1b) is true or whether "short representative" and
    "isogeny path" are merely analogous.

    (C) DIRECTION R2, PATHS AND CLASS-GROUP VECTORIZATION SOLVE MSI (THE
    ATTACKER'S DIRECTION, AND THE ONE THAT PRODUCES A CEILING). Suppose (R2a)
    Att is Cl(O)-equivariant, i.e. Att([a] * E) = rho([a]) . Att(E) for a
    computable action rho of Cl(O) on M; and (R2b) Att is injective on the
    O-oriented set. Then from the published period vector v = Per_m(Att(E)) an
    adversary who can solve vectorization on Cl(O) -- recover [a] from E_0 and
    [a] * E_0 -- recovers the instance, hence the class, hence (modulo the gap
    in (D)) the representative. The cost is then bounded by the BEST KNOWN
    VECTORIZATION COST AND NOT BY ANYTHING NEW.

    (D) THE GAP, NAMED AND NOT PAPERED OVER, AND IT IS THE WHOLE SCIENTIFIC
    CONTENT. RECOVERING THE CLASS IS NOT RECOVERING A SHORT REPRESENTATIVE. A
    homology class has many representatives; MSI asks for a short one. So R2 as
    stated reduces MSI to
      (vectorization) FOLLOWED BY (find a short representative of a KNOWN class),
    and the second step is a closest-vector problem in the lattice of relations
    -- the same lattice IDEA-20260811-4a55dd builds. Therefore:
      MSI <= vectorization + CVP(relation lattice).
    Two outcomes, and they are the (B)-versus-(C) discrimination the research
    question asks for:
      OUTCOME B: the second step is cheap at the relevant parameters -- because
      the class determines the short representative uniquely and Babai finds it
      -- in which case MSI IS a relabelling of vectorization/path-finding, it
      contributes an encoding and no new assumption, and decision-target state
      (B) holds with the ceiling of (E) attached.
      OUTCOME C-NARROW: the second step is NOT cheap, in which case the new
      content of MSI is EXACTLY AND ONLY the shortness requirement, and the
      program should say so in those words -- MSI = "known problem" + "a lattice
      problem on top", with the lattice problem carrying all the novelty. That
      is a far sharper statement than "MSI may be a distinct assumption" and it
      names precisely which of its two halves is new.

    (E) THE CEILING, ASSEMBLED FROM PUBLISHED REDUCTIONS AND WITH EVERY TIER
    NAMED. Conditional on (R2a) and (R2b) and on the cheapness of step two:
      (E1) CLASSICAL, ORIENTED ROUTE. Vectorization for a commutative class-group
      action is solved by meet-in-the-middle in time and memory
      sqrt(#Cl(O)) = |disc O|^{1/4 + o(1)} under Siegel's class number asymptotic
      (HEUR-MSI-R1); KN-TECH-027 records the classical cost as subexponential in
      log p via the class group and O(sqrt(#Cl)) by meet-in-the-middle.
      (E2) QUANTUM, ORIENTED ROUTE. Kuperberg's abelian hidden-shift sieve gives
      2^{O(sqrt(log p))} (KN-TECH-027, with the contested concrete constants
      recorded in KN-OPEN-014). MSI would inherit this in full, which matters:
      an isogeny assumption whose selling point is post-quantum security cannot
      be built on a commutative group action without inheriting Kuperberg.
      (E3) UNORIENTED ROUTE VIA EndRing. If instead the recovery goes through the
      endomorphism ring, the ceiling is p^{1/2} (log p)^{O(1)} unconditional
      (Delfs-Galbraith, as recorded in docs/target-result-profile.md) and
      p^{1/3+o(1)} in time AND memory conditional on Wesolowski's Heuristic 1
      (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, Theorem 1.1 and Corollary
      1.2, which cascades to EndRing and Isogeny by the reductions it cites).
      THE CASCADE IS THE POINT: nothing new has to be proved for (E3); it is
      obtained by citing a reduction, exactly as profile item A6 prescribes.
      (E4) LATTICE ROUTE. IDEA-20260811-4a55dd's BKZ cost at dimension
      n = rank M ~ N/6, with no p in it.
      COMBINED: MSI <= min(E1, E2 quantum, E3, E4). THE SMALLEST OF THESE IS THE
      SECURITY OF ANY MSI CONSTRUCTION, AND A DESIGNER MUST COST ALL FOUR.
      NOTE THE FIGURE THIS RECORD REFUSES TO USE: the Otilde(p^{1/4}) path-finding
      cost carried in KN-OPEN-013 is NOT cited as a ceiling, because
      RQ-SSIQ-9702af constraint 2 records it as an F_p-restricted figure at
      confidence relayed_from_abstract and contested across retrievals. The
      inconsistency between the two records is flagged, not resolved.

    (F) THE STRUCTURAL INGREDIENT THIS RECORD IS BETTING ON, NAMED AS PROFILE
    ITEM A4 REQUIRES. The classical Deuring-Eichler correspondence identifies the
    supersingular points of X_0(N) in characteristic p with ideal classes of an
    Eichler order of level N in B_{p,infinity}, with the Hecke action realised by
    Brandt matrices, and Jacquet-Langlands relates the resulting quaternionic
    Hecke module to the p-new subspace of S_2(Gamma_0(Np)). RECALLED, NOT READ IN
    THIS SESSION; this is a Stage 0 obligation, not an asserted theorem. IF the
    attaching map is a version of that correspondence, then (R2a) is close to
    automatic and the ceiling (E) follows; IF it is something else, the record's
    own Stage 1 equivariance test detects the difference immediately. Two corpus
    entries already carry the graph-side half of this bridge and were read:
    KN-LIT-865 (Amoros-Iezzi-Lauter, explicit connections between supersingular
    isogeny graphs, quaternion ideal graphs and Bruhat-Tits trees, with an
    orientation and a depth on the tree translated to the isogeny graph) and
    KN-LIT-1214 (recovering a path to End(E) tensor Z_q in the Bruhat-Tits tree).
    BOTH ARE confidence "reported" FROM A BULK SEEDING PASS AND NEITHER WAS READ
    BEYOND ITS CORPUS ENTRY.

  mechanism: >-
    STAGE 0 (ZERO COMPUTE, HARD GATE, NOT PERFORMED IN THIS SESSION). From the
    paper body extract: the definition of Att; whether the abstract's
    "compatible with the Hecke action" means Att(T_q E) = T_q Att(E) for a Hecke
    action defined on the oriented side, or the weaker statement that the IMAGE
    is a Hecke submodule; whether a Cl(O)-action on the image is stated; and
    whether the paper states a reduction to path problems or only a relation.
    ALSO: retrieve and read KN-LIT-865 and KN-LIT-1214 properly rather than from
    their bulk-seeded entries, and record what the Bruhat-Tits path actually is.
    THIS SESSION COULD DO NONE OF THIS -- both web tools failed with a backend
    model error and neither the source PDF nor the two downloads/ files named in
    KN-LIT-1662 exist in this worktree.

    STAGE 1 (THE EQUIVARIANCE TEST -- THE CHEAP FALSIFIER OF THE WHOLE RECORD).
    At toy (p, N, O) with h(O) small: enumerate the O-oriented supersingular
    curves, compute Att for each, and check, for every small prime q not
    dividing N l p, whether the matrix of T_q on M carries Att(E) to the sum of
    Att over the q-isogeny neighbours of E. THIS IS AN EXACT MATRIX IDENTITY,
    CHECKABLE OVER Z, WITH NO STATISTICS IN IT. If it holds, (R2a) has empirical
    support and the ceiling is live. If it fails, the abstract's Hecke
    compatibility means something narrower and the reduction must be rebuilt
    around whatever it does mean -- which is itself the finding.

    STAGE 2 (THE INJECTIVITY AND EQUIVARIANCE OF THE Cl(O)-ACTION). Compute the
    Cl(O)-action on the oriented set by the standard ideal-class action and
    check whether Att intertwines it with a computable action on M. Measure: the
    number of distinct images |Att(oriented set)| against #Cl(O). Equality is
    (R2b); a deficit measures exactly how much the attaching map forgets, and a
    LARGE deficit is the most interesting outcome, because it means Att is lossy
    in a way that could make MSI genuinely different -- see the lossy-projection
    discussion below.

    STAGE 3 (BUILD THE REDUCTION AND CHARGE IT). Implement R2 end to end at toy
    scale: given v, run a toy vectorization solver (exhaustive over Cl(O) at
    h(O) <= 200), obtain the class, then run Babai in the relation lattice to
    obtain a short representative, and verify the answer satisfies MSI. RECORD
    THE COST SPLIT BETWEEN THE TWO STEPS, because that split is the (B) versus
    (C-narrow) discrimination and nothing else in this record decides it.

    STAGE 4 (DIRECTION R1). Given a short representative, attempt to read off an
    l-isogeny path and verify it by composing the isogenies and comparing
    j-invariants. Exact verification, no statistics. Success establishes (R1b) at
    toy scale and makes the defender's direction real; failure names the step
    where representative and path part company.

    STAGE 5 (ZERO COMPUTE). Write the ceiling table of (E) at standardised
    parameters, with each row carrying the reduction it depends on by name and
    its heuristic dependencies by name, and with the tier of each figure --
    unconditional, conditional on Heuristic 1, quantum, contested -- stated on
    the row.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Same corpus screen as IDEA-20260811-4a55dd, plus targeted reads of
      KN-LIT-865, KN-LIT-1214, KN-LIT-192, KN-TECH-027, KN-OPEN-013,
      KN-OPEN-014, RQ-CLGP-b99df5 and RQ-SSIQ-9702af.
    results: >-
      The corpus contains the graph-to-tree half of the bridge (KN-LIT-865,
      KN-LIT-1214) and the class-group action with its quantum cost
      (KN-TECH-027, KN-OPEN-014), but contains nothing connecting either to
      modular symbols or to MSI. RQ-CLGP-b99df5 asks precisely the reduction
      question this record asks, but between Cl(O)-vectorization and the ECDLP on
      prime-field curves -- a DIFFERENT pair of problems on different objects.
      OVERLAP WITH RQ-CLGP-b99df5, DECLARED: the Cl(O)-vectorization side of the
      reduction is shared, and any bridge-map machinery built here should be
      offered to that question. THE OTHER SIDE IS DISJOINT: that question's other
      endpoint is the point group of a prime-field curve, this one's is a
      homology module of a modular curve, and no statement here bears on
      prime-field ECDLP in either direction.
    verdict: >-
      UNVERIFIED. The corpus is empty on the specific bridge; the external
      literature was NOT checked, because this session's web tools failed. The
      Deuring-Eichler correspondence and Jacquet-Langlands are classical and are
      claimed as ingredients, never as novelty. What is unchecked is whether the
      source paper, or any follow-up in the four months since it appeared,
      already states the reduction.

  object_first_candidate:
    tracked_object: >-
      The Cl(O)-torsor coordinate of the instance -- the ideal class [a] with
      E = [a] * E_0 -- together with its image under the attaching map.
    lossiness: >-
      THE LOSSY-PROJECTION TEST GIVES A TWO-PART ANSWER HERE AND THE HONEST HALF
      IS THE UNFAVOURABLE ONE. Relative to a FIXED O and a fixed base point, the
      primitively O-oriented set is a Cl(O)-torsor and the class is a
      COORDINATE: the projection loses nothing, so by docs/inventor-protocol.md
      section 2 it is a change of coordinates and NOT a new tracked object.
      THAT IS NOT A DEFECT OF THIS RECORD, IT IS ITS THESIS -- a reduction is
      precisely a change of coordinates with its cost charged, and the record
      claims a reduction, not an attack. Relative to the FULL supersingular set,
      by contrast, remembering only the class of an O-orientation discards which
      O and which primitive orientation, which is genuinely lossy; that discard
      is compatible with the l-isogeny action only when l splits in O, which is
      the standard orientation-preserving condition and is where the Bruhat-Tits
      tree picture of KN-LIT-865 lives. THE MEASURABLE VERSION OF THIS DISTINCTION
      IS STAGE 2's DEFICIT |Att(oriented set)| VERSUS #Cl(O), and a large deficit
      is the one route by which MSI could be genuinely more than a relabelling.
    propagation: >-
      One step = the action of a prime ideal class, i.e. an l-isogeny step
      preserving the orientation. The class propagates by multiplication in
      Cl(O), exactly. On the modular-symbol side one step is the corresponding
      Hecke or Atkin-Lehner operator, and whether the two agree is exactly
      Stage 1's exact matrix identity.
    survival_score: >-
      SURVIVES as long as the orientation survives, i.e. through any composition
      of orientation-preserving isogenies. DIES at (i) an isogeny of degree
      inert or ramified in O, which destroys the primitive orientation, (ii) a
      change of O, and (iii) the passage from class to SHORT representative,
      which the class does not determine. Death point (iii) is claim (D) and is
      the record's central quantity.

  null_object_control: >-
    NULL 1 (RANDOM HECKE SURROGATE): replace the Hecke matrix T_q in Stage 1 by a
    random integer matrix with the same dimensions, sparsity and row sums. The
    equivariance identity must FAIL on it. If the identity holds for a random
    matrix of matched shape, the test is measuring an accident of dimensions and
    not the arithmetic, and Stage 1 proves nothing.
    NULL 2 (SHUFFLED ORIENTATION): permute which oriented curve is paired with
    which modular symbol class before running Stage 2. The measured injectivity
    and the equivariance must both collapse.
    NULL 3 (WRONG ORDER): repeat Stage 2 with an order O' whose discriminant is
    NOT compatible with p, so that no O'-orientation exists. The pipeline must
    report no instances rather than silently producing them; a pipeline that
    produces instances there is fabricating them.
    DECAY CONTROL: the parameter that should destroy equivariance is q. The
    identity is exact and must hold for EVERY tested q; a version that holds for
    small q and degrades for larger q is an implementation artifact, since
    nothing in the mathematics distinguishes them.

  discriminated_from:
    - >-
      H-MOD-e9d87e (zero-bit closure). NOT CAUGHT, for the same three reasons
      given in IDEA-20260811-4a55dd and one more specific to this record: the
      closure's F2 turns on the diamond action of (Z/N)^*/{+-1} being free and
      transitive ON A SINGLE FIBRE of X_1(N) -> X_0(N), whereas the group acting
      here is Cl(O) acting on a set of ORIENTED SUPERSINGULAR CURVES over
      F_{p^2}, and the fibre in question does not exist in this record. There is
      no rational ECDLP instance, no scalar k, and no point P.
    - >-
      DEC-20260810-2c7e3c (closed CM canonical-lift lane). NOT THAT LANE. The
      lane is closed by the canonical height of lifted points of an ECDLP
      instance curve; this record lifts no point and computes no height. The CM
      structure appearing here is an ORIENTATION of a supersingular curve in
      characteristic p -- an embedding O -> End(E) -- not a complex multiplication
      on a characteristic-zero lift, and no Mordell-Weil group of any curve is
      involved. Coleman integration enters only through
      IDEA-20260811-4a55dd's encoder, on the modular curve, and the record states
      the distinction because the decision requires it stated.
    - >-
      KN-TECH-3b593f (genus-1 boundary). No prime-field ECDLP claim; no Smith
      tractable subgroup; no Kani embedding; no published torsion images of any
      secret map. The record's endpoints are both isogeny-side.
    - >-
      RQ-CLGP-b99df5. Shares the Cl(O)-vectorization endpoint and NOTHING ELSE.
      Overlap declared above and machinery offered; no conclusion of this record
      transfers to that question and vice versa.
    - >-
      IDEA-20260811-4a55dd. Complementary and deliberately coupled: that record
      bounds MSI from above by lattice decoding, this one by vectorization and
      EndRing, and claim (D) here shows the two bounds compose rather than
      compete -- the ceiling is a minimum over both and the second half of R2 IS
      that record's lattice.

  assumptions:
    - >-
      Att is Cl(O)-equivariant for a computable action. NOT VERIFIED; Stage 1 and
      Stage 2 test it directly and their failure is a live outcome.
    - >-
      Att is computable forward in poly(log p, N). NOT VERIFIED. If the forward
      map itself is expensive, no construction can use the encoding regardless of
      MSI's hardness, which is why IDEA-20260811-626f00 measures encoder cost.
    - >-
      The Deuring-Eichler correspondence identifies supersingular points on
      X_0(N) in characteristic p with Eichler ideal classes and realises Hecke by
      Brandt matrices. CLASSICAL, RECALLED, NOT READ IN THIS SESSION. It is the
      record's principal structural ingredient and a Stage 0 obligation.
    - >-
      Wesolowski's Theorem 1.1 and Corollary 1.2 cascade to EndRing and Isogeny
      by the reductions cited there. TAKEN FROM docs/target-result-profile.md's
      summary of the archived full text, which this session read; the archived
      paper itself was not re-read here and the cited reductions were not checked.
    - >-
      Siegel's class number asymptotic h(O) = |disc O|^{1/2 + o(1)}. CLASSICAL,
      INEFFECTIVE, RECALLED NOT READ. It converts the sqrt(#Cl(O)) meet-in-the-
      middle cost into the exponent 1/4 in |disc O| and is stated as HEUR-MSI-R1
      for that reason.

  proof_search_map:
    bottleneck: >-
      STEP TWO OF R2 -- passing from a recovered CLASS to a recovered SHORT
      REPRESENTATIVE. Everything else in the reduction is bookkeeping over
      published results. If step two is polynomial, MSI is a relabelling and the
      ceiling of (E) is the whole story; if it is not, the ceiling still holds
      for class recovery but MSI itself is strictly harder and the excess is
      exactly a lattice problem. NO OTHER STEP CARRIES THE VERDICT.
    baseline_embedding:
      parameter_slice: >-
        h(O) = 1 -- a single oriented curve up to isomorphism. There the
        vectorization is trivial and R2 degenerates to step two alone, so the
        pipeline must return the short representative by lattice work only. This
        is the exact boundary slice where the reduction has zero content, and the
        pipeline must reproduce it without special-casing.
      reproduction_check: >-
        Frozen fixture at h(O) = 1: named p, named O, named N, named l, named m,
        the enumerated oriented curve, the computed class, and the returned short
        representative, compared by exact equality of Manin-symbol coordinate
        vectors. A pipeline that cannot do the h(O) = 1 case correctly may report
        nothing about larger h(O).
    observation_collision:
      observable: >-
        The image Att(E) in M, and the period vector derived from it.
      distinct_preimage_search: >-
        SEARCH FOR TWO DISTINCT ORIENTED CURVES WITH THE SAME Att IMAGE, ONE ON
        EACH SIDE OF THE CLAIMED CONCLUSION -- ideally one pair related by the
        Cl(O)-action and one pair not. A collision falsifies (R2b) and therefore
        falsifies the reduction's injectivity hypothesis, and it is exactly what
        the Stage 2 deficit |Att(oriented set)| < #Cl(O) would exhibit
        constructively. A collision is NOT fatal to the record: it converts the
        ceiling into a ceiling for the quotient and identifies the forgotten
        structure, which is the more interesting result.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          MSI expressed as (vectorization on Cl(O)) composed with (CVP in the
          relation lattice). ENCODING: the ideal class plus a relation-lattice
          coset. COMPLETENESS: every instance factors this way if (R2a) and (R2b)
          hold. SOUNDNESS: the recomposed representative is verified against the
          encoder before being accepted, so a wrong class cannot pass.
          TRANSFER: exact at toy h(O); untested beyond. COST LOSS: the sum of the
          two steps' costs, both measured and reported separately, never merged.
        predicted_gain: >-
          A ceiling assembled entirely from published reductions -- profile item
          A6 -- plus the isolation of the single new ingredient (shortness).
      - transform: boundary_lift
        proposed_object: >-
          Enlarge from "the class determines the answer" to "the class plus a
          bounded-size list of candidate short representatives determines the
          answer", and measure the list size. A strict inward improvement means
          the list is short; a list that is exponential in n is the C-narrow
          outcome stated quantitatively.
        predicted_gain: >-
          Converts the (B) versus (C) question from a verbal dispute into one
          measured integer, namely the candidate list size per class.
    quantifier_order: >-
      THE CEILING CLAIM, EXPLICITLY: THERE EXISTS an algorithm A such that FOR
      ALL (p, O, N, l, m) satisfying the stated compatibility conditions and FOR
      ALL instances E in the O-oriented set, A recovers a short representative in
      time bounded by min(E1, E3, E4) plus the cost of step two. THE TRAP, NAMED:
      the quantifiers must not be inverted to "for all instances there exists an
      algorithm", which is vacuous, nor may the algorithm be allowed to depend on
      the instance's class. The toy pipeline must therefore be built once per
      (p, O, N, l, m) cell and then run on all instances in that cell without
      recompilation, and the run record must show that it was.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "at the tested toy parameters, Att is Hecke-equivariant and
        Cl(O)-equivariant to the measured extent, the two-step reduction runs end
        to end, and the measured cost split is such-and-such." It can NEVER
        certify the ceiling at cryptographic parameters -- that is an argument,
        not a run -- and it can never certify that MSI is HARD, since a ceiling
        is an upper bound only.
      nearby_object_control: >-
        THE NEARBY OBJECT WHERE THE CONCLUSION MUST FAIL: an order O' in which l
        is INERT, so that no orientation-preserving l-isogeny step exists. The
        Cl(O')-action then does not move along the l-graph, the reduction's
        second hypothesis is unavailable, and the pipeline must visibly fail
        rather than return an answer. A pipeline returning answers in both cases
        has not used the splitting condition and its verdict is void. THIS COSTS
        ALMOST NOTHING AND IS THE SHARPEST CHECK IN THE RECORD.
    proof_obligations:
      - claim: Att intertwines T_q with the q-isogeny neighbour sum.
        responsibility: correctness
      - claim: Att is injective on the O-oriented set.
        responsibility: correctness
      - claim: "vectorization at #Cl(O) costs sqrt(#Cl(O)) by meet-in-the-middle."
        responsibility: baseline
      - claim: h(O) equals |disc O|^{1/2+o(1)}.
        responsibility: size
      - claim: step two is a CVP in the relation lattice, with measured candidate list size.
        responsibility: feasibility
      - claim: the recomposed representative verifies against the encoder.
        responsibility: correctness
      - claim: Wesolowski's result cascades to EndRing and Isogeny by cited reductions.
        responsibility: interface
      - claim: all figures are scoped to the tested toy cells.
        responsibility: scope

  predictions:
    - metric: >-
        Hecke equivariance residual -- number of (E, q) pairs at which the exact
        matrix identity between T_q on M and the q-isogeny neighbour sum fails
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 0 across all tested (E, q), against a random-matrix
        surrogate at which failures must be universal. A nonzero residual on
        genuine data that is not a bug means the abstract's "compatible with the
        Hecke action" is narrower than assumed, and identifying what it does mean
        is then the deliverable.
    - metric: >-
        image size |Att(O-oriented set)| against #Cl(O)
      direction: different
      minimum_effect: >-
        Predicted EQUAL, i.e. deficit 0. A deficit exceeding 5 percent of #Cl(O)
        falsifies (R2b), converts the ceiling into a ceiling for a quotient, and
        identifies forgotten structure -- the single most interesting negative
        this record can produce.
    - metric: >-
        cost split -- fraction of end-to-end R2 wall clock spent in
        vectorization versus in step two, at h(O) from 1 to 200
      direction: different
      minimum_effect: >-
        This is the (B) versus (C-narrow) discriminator and no direction is
        predicted a priori. The decision rule is pre-registered: step two above
        50 percent of the total AND growing in n means the shortness half is the
        binding one and C-narrow holds; step two below 10 percent and flat in n
        means (B) holds.
    - metric: >-
        candidate short representatives per recovered class
      direction: different
      minimum_effect: >-
        Predicted exactly 1 if the class determines the answer. A count growing
        exponentially in n is the C-narrow outcome quantified; a count growing
        polynomially is still (B) with a polynomial loss and must be reported as
        such rather than rounded to either verdict.
    - metric: >-
        R1 path verification -- fraction of short representatives from which a
        valid l-isogeny path is reconstructed and verified by composing
        isogenies and comparing j-invariants
      direction: higher
      minimum_effect: >-
        Predicted 1.0 if (R1b) holds. Any value strictly between 0 and 1
        indicates that only some representatives carry paths, and the
        characterisation of which ones is then the finding.
    - metric: >-
        inert-order control -- pipeline outputs on an order in which l is inert
      direction: lower
      minimum_effect: >-
        PREDICTED 0 successful recoveries. Any success voids the run.

  minimal_test:
    design: >-
      STAGE 0 (hard gate, zero compute): paper body, plus proper reads of
      KN-LIT-865 and KN-LIT-1214.
      STAGE 1 (hours): the exact Hecke equivariance identity at toy
      (p, N, O, q), with the random-matrix surrogate null.
      STAGE 2 (hours): Cl(O)-equivariance and the injectivity deficit, with the
      shuffled null and the wrong-order null.
      STAGE 3 (a day): end-to-end R2 with exhaustive vectorization at
      h(O) <= 200 and Babai for step two, reporting the cost split and the
      candidate list size.
      STAGE 4 (hours): direction R1, with exact isogeny-composition verification.
      STAGE 5 (zero compute): the ceiling table with tiers and named reductions.
    controls:
      - Random Hecke-shaped matrix surrogate (equivariance must fail).
      - Shuffled orientation-to-symbol pairing (everything must collapse).
      - Order with no valid orientation (pipeline must report nothing).
      - Order in which l is inert (pipeline must fail visibly).
      - h(O) = 1 frozen fixture before any larger h(O) is reported.
      - Independent verification of every claimed path by isogeny composition.
    required_metrics:
      - Equivariance residual per (E, q), with the exact failing pair if any.
      - Cardinality of Att(oriented set), cardinality of Cl(O), and the deficit.
      - Wall clock of each of the two R2 steps, separately, per h(O).
      - Candidate short representatives per class, full distribution.
      - R1 path verification rate and the failing cases.
      - All four control outcomes, each reported even when uninteresting.

  falsification_conditions:
    - >-
      Hecke equivariance fails on genuine data and is not a bug. The reduction's
      first hypothesis is false; the record is superseded by one built on
      whatever compatibility actually holds.
    - >-
      The random-matrix surrogate also passes the equivariance test. The test has
      no discriminating power and Stage 1 must be redesigned before anything is
      reported from it.
    - >-
      The injectivity deficit is large. (R2b) fails, the ceiling degrades to a
      quotient, and the forgotten structure must be identified before the ceiling
      is quoted.
    - >-
      The inert-order control succeeds. The pipeline is not using the splitting
      condition; every number in the run is void.
    - >-
      Step two dominates and grows exponentially in n. Verdict (B) is refuted at
      the tested parameters and C-narrow holds; the record then explicitly hands
      the live question to IDEA-20260811-4a55dd and IDEA-20260811-0f89a9.
    - >-
      Stage 0 finds that the paper's Hecke compatibility is a statement about the
      image being a submodule rather than about Att intertwining operators. The
      reduction as drafted does not follow and must be rebuilt; the ceiling
      claims of (E) may not be quoted until it is.

  confounders:
    - >-
      "COMPATIBLE WITH THE HECKE ACTION" IS AMBIGUOUS IN THE ABSTRACT and the two
      readings -- Att intertwines operators, versus the image is a Hecke
      submodule -- support very different reductions. This is the single largest
      interpretive risk in the record and Stage 0 exists for it.
    - >-
      ORIENTATION PRIMITIVITY AND SPLITTING. The Cl(O)-action is free and
      transitive only on the primitively O-oriented set, and orientation-
      preserving l-isogenies exist only when l splits in O. A toy grid that
      quietly mixes primitive and imprimitive orientations, or splitting and
      inert l, will produce incoherent equivariance data; both must be recorded
      per instance.
    - >-
      TOY h(O). At h(O) <= 200 exhaustive vectorization is trivial, so the cost
      split is measured in a regime where the first step is artificially cheap.
      The reported quantity must therefore be the SCALING of step two in n, not
      the raw split at one h(O).
    - >-
      BASELINE TIERS. The four ceiling rows are of different logical types --
      unconditional, conditional on Heuristic 1, quantum, and contested. Quoting
      the minimum without its tier would be an evidence-integrity failure, and
      the table format is specified to prevent it.
    - >-
      RELAYED LITERATURE. KN-LIT-865 and KN-LIT-1214 are bulk-seeded entries at
      confidence "reported" whose author fields are visibly mis-parsed
      (KN-LIT-865 lists authors who do not match its own title line; KN-LIT-1214
      lists "ENDOMORPHISM RINGS" as an author). They may be used as pointers, not
      as verified statements, and Stage 0 must re-verify anything load-bearing.

  interpretation_limits:
    - >-
      A CEILING IS AN UPPER BOUND AND NOTHING ELSE. Nothing here is evidence that
      MSI is hard, and RQ-MSI-f760b2 constraint 1 forbids that reading in
      advance.
    - >-
      Every reduction claim is conditional on Stage 0 confirming the paper's
      definitions. This session read only the abstract and could not read more.
    - >-
      Toy scale: h(O) <= 200, small p, small N. The ceiling exponents are an
      ARGUMENT about cryptographic scale, not a measurement at it, and the record
      must not present the toy runs as validating the exponents.
    - >-
      No prime-field ECDLP claim of any kind, in either direction.
    - >-
      The Wesolowski cascade is quoted from the archived paper's summary in
      docs/target-result-profile.md; this program has never checked the
      reductions that cascade Theorem 1.1 to EndRing and Isogeny, and
      RQ-SSIQ-9702af records the same caveat.

  heuristic_assumptions:
    - id: HEUR-MSI-R1
      statement: >-
        FOR ALL imaginary quadratic orders O in the tested range,
        h(O) = |disc O|^{1/2 + o(1)}, uniformly in |disc O|, so that a
        meet-in-the-middle vectorization at cost sqrt(h(O)) equals
        |disc O|^{1/4 + o(1)}.
      rigorous_support: >-
        The rigorous ingredient is the class number formula together with
        Siegel's theorem h(O) |disc O|^{-1/2+eps} -> infinity, which is
        INEFFECTIVE -- there is no computable constant. The classical distribution
        statement imitated is the standard Brauer-Siegel behaviour of class
        numbers. RECALLED, NOT READ IN THIS SESSION.
      falsification_condition: >-
        A fitted exponent differing from 1/2 by more than 0.05 across the sampled
        discriminant range, with the deviation not shrinking as the range grows.
      validation_plan: >-
        SAMPLE: h(O) for all fundamental discriminants with |disc| up to 10^6
        (about 3 by 10^5 values), computed directly. COMPARISON: fit
        log h against log |disc| and compare the slope to 1/2; also compare the
        empirical distribution of h / sqrt(|disc|) against the
        Cohen-Lenstra prediction where applicable. TAIL CHECK: report the 50
        smallest values of h / sqrt(|disc|), since SMALL class numbers are the
        attacker-favourable tail and are what a meet-in-the-middle would exploit.
        TRANSFER ASSUMPTION, STATED: that the exponent fitted below 10^6 persists
        at cryptographic |disc| ~ p. Siegel's ineffectivity means this is an
        extrapolation and not a bound, and it is recorded as such.
    - id: HEUR-MSI-R2
      statement: >-
        FOR ALL tested (p, O), the distribution of classes [a] induced by the
        instance generator on the O-oriented set is within total variation
        distance o(1) of uniform on Cl(O), so that the average-case cost of
        vectorization equals its worst case up to a constant.
      rigorous_support: >-
        The rigorous ingredient is that Cl(O) acts freely and transitively on the
        primitively O-oriented set, so uniform class sampling is EQUIVALENT to
        uniform instance sampling BY CONSTRUCTION when the generator samples
        classes uniformly. The heuristic is needed only when instances arrive
        from the attaching map rather than from a class sampler, and the
        classical statement it imitates is the rapid mixing of random walks in
        the isogeny graph used for re-randomisation throughout this literature.
      falsification_condition: >-
        A chi-squared test rejecting uniformity at the 1 percent level over
        10^4 sampled instances at h(O) <= 200.
      validation_plan: >-
        SAMPLE: 10^4 instances per (p, O) cell for at least 10 cells with
        20 <= h(O) <= 200, recording the class of each. COMPARISON: chi-squared
        against uniform on Cl(O), plus the empirical distribution of the maximum
        cell count against its binomial prediction. TAIL CHECK: report the three
        most and three least frequently hit classes, since a systematically
        favoured class is how a re-randomisation failure would show up. TRANSFER:
        toy p only; no claim at cryptographic p, where the enumeration that makes
        this measurable is unavailable.
    - id: HEUR-MSI-R3
      statement: >-
        Step two of R2 -- passing from a recovered class to a short representative
        -- costs at most exp(o(n)) at the tested parameters, i.e. the number of
        candidate short representatives per class is subexponential in n.
      rigorous_support: >-
        NONE. This is the record's genuinely speculative assumption and the one
        the whole (B)-versus-(C) verdict turns on. The classical statement it
        imitates is the uniqueness of a bounded-distance decoding solution when
        the error is below the covering radius -- which is a THEOREM in the
        lattice, but whose applicability here depends entirely on where S sits
        relative to lambda_1, i.e. on IDEA-20260811-4a55dd's measurement.
      falsification_condition: >-
        Candidate counts growing exponentially in n across the tested grid.
      validation_plan: >-
        SAMPLE: for every recovered class at every toy cell, enumerate ALL short
        representatives by lattice enumeration at n <= 30 and count them
        exactly -- no sampling, no estimate. COMPARISON: the Gaussian-heuristic
        ball count in the relation lattice. TAIL CHECK: report the classes with
        the largest candidate counts, since the security of any construction
        would be set by them. TRANSFER: none offered; n <= 30 is far below any
        regime of interest and the record says so.

  target_complexity:
    time_exponent: >-
      THIS RECORD CLAIMS A CEILING, NOT AN ALGORITHM, AND STATES IT AS SUCH.
      Conditional on (R2a), (R2b) and HEUR-MSI-R1 through R3:
      MSI <= min of
        |disc O|^{1/4 + o(1)} classical (meet-in-the-middle vectorization,
          KN-TECH-027, with HEUR-MSI-R1 converting the class number to |disc|);
        2^{O(sqrt(log p))} quantum (Kuperberg sieve, KN-TECH-027, concrete
          constants contested per KN-OPEN-014);
        p^{1/2} (log p)^{O(1)} classical unconditional via EndRing
          (Delfs-Galbraith tier, per docs/target-result-profile.md);
        p^{1/3 + o(1)} time and memory, CONDITIONAL ON WESOLOWSKI'S HEURISTIC 1,
          via the cascade to EndRing and Isogeny;
        2^{Theta(n / log n)} lattice, n ~ N/6 (IDEA-20260811-4a55dd);
      plus, in every case, the step-two cost governed by HEUR-MSI-R3.
    memory_exponent: >-
      |disc O|^{1/4+o(1)} for the meet-in-the-middle row -- memory equal to time,
      the standard claw-finding position; p^{1/3+o(1)} for the Wesolowski row,
      whose own author names memory as a serious deployment obstacle;
      polynomial for the Delfs-Galbraith row; and poly-to-2^{0.208 beta} for the
      lattice row. THE ROWS ARE NOT INTERCHANGEABLE AND THE TABLE MUST NOT BE
      COLLAPSED TO ITS MINIMUM WITHOUT ITS MEMORY COLUMN.
    best_known: >-
      For MSI: none published, as recorded in RQ-MSI-f760b2. For each ceiling
      row: the algorithm named on that row is itself the best known for its own
      problem, which is what makes the ceiling meaningful -- MSI cannot be harder
      than the easiest problem it reduces to.
    hidden_overhead: >-
      The o(1) in |disc O|^{1/4+o(1)} hides Siegel's ineffective constant and is
      therefore NOT a computable bound at any finite discriminant -- disclosed
      because the row would otherwise read as a concrete cost. The o(1) in
      p^{1/3+o(1)} hides a superpolynomial overhead disclosed by its own author
      (RQ-SSIQ-9702af constraint 5), which this record may not silently assume
      smaller. The quantum row's constants are contested (KN-OPEN-014). And the
      whole ceiling hides the cost of computing Att itself, which is unknown
      until Stage 0.
    tradeoff_note: >-
      The vectorization row sits at memory equal to time and interpolates by van
      Oorschot-Wiener to sqrt(h^3/w) at memory w, i.e. h^{1/2+o(1)}/w^{1/2}
      with n parallel processors dividing further. The lattice row is
      memory-cheap. A CONSTRUCTION DESIGNER FACING THIS CEILING MUST COST BOTH
      SURFACES, because an adversary picks the cheaper one and the two are
      minimised by opposite parameter choices -- large N defeats the lattice row
      and does nothing to the vectorization row, and large |disc O| does the
      reverse.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA. As an attack this record is
    dominated by every algorithm it cites, because it introduces none: the
    vectorization row is dominated by meet-in-the-middle itself, the EndRing rows
    by Delfs-Galbraith and by Wesolowski respectively, the lattice row by BKZ,
    and the whole by whichever is smallest at given parameters. As a REDUCTION,
    the incumbent to be compared against is RQ-CLGP-b99df5's attempted bridge
    between Cl(O)-vectorization and prime-field ECDLP, which is on a different
    problem pair and neither dominates nor is dominated by this one. NOT null,
    and no row was left unchecked.
  sota_delta: >-
    Zero speedup on every axis against every cited baseline; no new algorithm.
    QUANTITATIVE CONTENT DELIVERED, CONDITIONAL ON THE STAGE 1 AND STAGE 2 TESTS
    PASSING: a four-row cost ceiling for a previously unanalysed assumption, with
    each row's tier and memory stated; the isolation of shortness as the sole
    candidate new ingredient; a pre-registered numerical decision rule (step-two
    cost fraction and its scaling in n) separating decision-target state (B) from
    a narrowed state (C); and the observation that the lattice row and the
    vectorization row are minimised by OPPOSITE parameter choices, so no single
    parameter direction secures both.

  constraint_compliance:
    hardness_unverified: >-
      Constraint 1 honoured: this record produces only upper bounds and states
      that an upper bound is not a hardness claim; no failure of any toy attack
      may be reported as evidence of hardness.
    not_ecdlp_route: >-
      Constraint 2 honoured: both endpoints are isogeny-side, no prime-field
      ECDLP claim is made, and neither closed mechanism of KN-TECH-3b593f
      appears.
    not_canonical_lift: >-
      Constraint 3 honoured explicitly in discriminated_from item 2: the CM here
      is an orientation in characteristic p, not a characteristic-zero lift; no
      point is lifted and no canonical height exists in the record for CM to act
      on.
    not_h_mod_closure: >-
      Constraint 4 honoured in discriminated_from item 1, with the specific
      additional separation that the acting group here is Cl(O) on oriented
      supersingular curves, not the diamond group on an X_1(N) fibre.
    lit_entry_corrected: >-
      Constraint 5 honoured: the published abstract as quoted in RQ-MSI-f760b2 is
      used; KN-LIT-1662's summary line is not. The record additionally flags that
      KN-LIT-865 and KN-LIT-1214 carry visibly mis-parsed author fields and may
      be used only as pointers.

  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.7 that some form of Hecke equivariance holds, since the abstract asserts
    compatibility and the Deuring-Eichler picture makes it natural; 0.45 that it
    holds in the strong intertwining form the reduction needs. 0.5 that Att is
    injective on the oriented set. 0.35 that step two turns out cheap, which is
    the (B) verdict -- the honest expectation is that shortness is where the
    content is, which is why IDEA-20260811-4a55dd and IDEA-20260811-0f89a9 are
    ranked above this record. 0.9 that the ceiling table is worth having
    regardless of which way the tests go, because a construction designer needs
    all four rows and nobody has written them down.

