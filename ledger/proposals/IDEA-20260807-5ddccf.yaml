idea:
  id: IDEA-20260807-5ddccf
  question_id: RQ-EQIC-8cb959
  added: '2026-08-07'
  title: >-
    THE |Aut| SCALING LAW, MEASURED ACROSS THREE CURVE FAMILIES: the invariant
    reformulation deflates the candidate count by exactly r^m and inflates the
    per-variable degree by exactly r^{m-1}, so deg_u T_m = (2r)^{m-1} against
    deg_x S_{m+1} = 2^{m-1}; run r = 3 (j = 0, weight-1 semi-invariant),
    r = 2 (j = 1728, weight-0 invariant) and r = 1 (generic, no action) to
    discriminate an |Aut|-DRIVEN effect from a j = 0 ACCIDENT
  class: measurement

  claim: >-
    (A) THE TWO SEMI-INVARIANCE FACTS, WITH THEIR BICONDITIONALS. For
      S_3(x1,x2,x3) = (x1-x2)^2 x3^2 - 2((x1+x2)(x1 x2 + a) + 2b) x3
                      + ((x1 x2 - a)^2 - 4 b (x1+x2)):
      j = 0 CASE (a = 0). Every monomial has total degree congruent to 1 mod 3,
        so S_3(zeta x1, zeta x2, zeta x3) = zeta S_3(x1,x2,x3): a WEIGHT-1
        relative invariant for the diagonal mu_3-action. Holds iff a = 0, since
        the terms -2a(x1+x2)x3, -2a x1 x2 and a^2 have total degrees 3, 2, 0.
      j = 1728 CASE (b = 0). Every monomial has EVEN total degree, so
        S_3(-x1,-x2,-x3) = S_3(x1,x2,x3): a WEIGHT-0 invariant for the diagonal
        (Z/2)-action. Holds iff b = 0, since the terms -4b x3 and -4b(x1+x2)
        have odd total degrees 1 and 1.
    These are two DIFFERENT algebraic situations, not two instances of one, and
    that difference is the reason the comparison in this record is informative
    rather than decorative.

    (B) THE SCALING LAW, DERIVED. Let r be the order of the automorphism's
    action on the x-line: r = 3 for j = 0 with p = 1 mod 3 (phi: x -> zeta x);
    r = 2 for j = 1728 with p = 1 mod 4 (phi: x -> -x, since (x,y) -> (-x, iy)
    needs i in F_p); r = 1 for a generic ordinary curve, where |Aut| = 2 and
    negation acts TRIVIALLY on x. Let u = x^r be the invariant coordinate and
      T_m(u_1, ..., u_m) = prod_{(c_1,...,c_m) in (Z/r)^m}
                            S_{m+1}(zeta_r^{c_1} x_1, ..., zeta_r^{c_m} x_m, x_R).
    Then, since deg_{x_i} S_{m+1} = 2^{m-1} (KN-TECH-002) and the product has
    r^m factors:
      deg_{x_i} T_m = 2^{m-1} r^m,  hence  deg_{u_i} T_m = 2^{m-1} r^{m-1}
                                                        = (2r)^{m-1}.
    Simultaneously the factor-base membership degree falls from r m to m and the
    candidate count falls from (r m)^m to m^m, a deflation of exactly r^m.
    CHECKS: at m = 2, r = 3 this gives deg_u T = 6 (matching the bidegree (6,6)
    computed independently in IDEA-20260807-1ea327); at m = 2, r = 2 it gives 4;
    at r = 1 it gives 2^{m-1} = deg_x S_{m+1}, i.e. the construction degenerates
    to the incumbent exactly, which is the baseline embedding.

    (C) THE TWO COMPETING EXPLANATIONS THIS RECORD DISCRIMINATES.
      H-SCALE: the measured cost ratio ENC-X / ENC-SYM is a function of r and m
        alone, following the bookkeeping in (B). Then the invariant
        reformulation is an |Aut|-driven, predictable, and therefore
        EXTRAPOLABLE phenomenon, and the r = 2 and r = 3 points determine its
        behaviour without further measurement.
      H-ACCIDENT: the j = 0 behaviour departs from the r = 2 point in a way the
        law does not predict. Then something specific to the CUBIC case is
        acting -- the weight-1 semi-invariance rather than weight-0 invariance,
        or the fact that mu_3 has no fixed points on X_E other than 0 while
        mu_2's fixed points on the x-line (x = 0) are the 2-torsion -- and the
        j = 0 result cannot be extrapolated in r.
    Both outcomes are deliverables and the pre-registered decision rule is in
    predictions.

    (D) THE CROSSOVER PREDICTION, WHICH IS WHERE THE MECHANISM DIES. Groebner
    cost grows roughly as (n + D choose D)^omega in the reached degree D
    (KN-TECH-011), and D is bounded below by the input degree. The candidate
    deflation r^m is a saving on the SOLUTION COUNT, which enters roughly
    linearly, while the degree inflation r^{m-1} enters through D. At m = 2 the
    two are r^2 = 9 against r = 3 for j = 0 and 4 against 2 for j = 1728, so the
    deflation is nominally ahead. At m = 3 they are r^3 = 27 against r^2 = 9,
    with degrees deg_u T_3 = 36 for r = 3 (against deg_x S_4 = 4) -- a degree of
    36 in each of three variables, which is very likely infeasible in this
    harness. THE PRE-REGISTERED PREDICTION IS A CROSSOVER AT OR BEFORE m = 3:
    the invariant encoding is at best competitive at m = 2 and is worse at
    m = 3, and identifying the crossover exactly is the record's main
    quantitative deliverable.

    (E) RELATION-COUNT ARITHMETIC, STATED FOR EVERY FAMILY. On any of the three
    families a factor base of cardinality r m built from m orbits has m
    unknowns, because the automorphism acts on G as a scalar lambda_r (for
    r = 3, lambda^2 + lambda + 1 = 0 mod N; for r = 2, phi is the order-4
    automorphism so its square is negation and lambda^2 = -1 mod N; for r = 1,
    lambda = 1 and there is no reduction). One successful decomposition yields
    exactly ONE independent equation over those m unknowns with coefficients in
    the powers of lambda_r; the automorphism images of that relation are
    lambda_r-multiples and contribute rank 0 (IDEA-20260807-5dfe4a). SO THE
    RELATION SUPPLY IS IDENTICAL ACROSS THE THREE FAMILIES AT MATCHED
    CARDINALITY AND THE ONLY VARYING QUANTITY IS THE ALGEBRAIC COST OF FINDING
    A RELATION. That is what makes the cross-family comparison a controlled one.

  resource_label: R1, R2, R3
  admissibility: admissible
  admissibility_argument: >-
    R1: the measured quantity is the Groebner behaviour of a polynomial system
    in x-coordinates as FIELD ELEMENTS, which a generic-group simulator cannot
    produce. R2: the family selection is by curve EQUATION (a = 0, b = 0, or
    neither) and both semi-invariance facts are biconditionals on those
    coefficients. R3: |Aut(E)| and hence r is determined by End(E) as a ring and
    by the CM discriminant -- j = 0 requires D_0 = -3 and j = 1728 requires
    D_0 = -4 (T4 of DECOMPOSITION.md) -- so the parameter being swept is a
    property of the endomorphism ring, not of the group. The automorphism is
    never applied to a point of G to gain information; claim (E) states
    positively that doing so contributes rank 0.

  discriminated_from:
    - >-
      H-STR-002 (weakened, DEC-20260727-009; DEFER-BATCH009-001 OPEN). Nothing
      asserted about it in either direction. H-STR-002 is confined to j = 0
      curves and to displacement rank; this record sweeps a curve-family
      parameter H-STR-002 never varies (r) and measures a quantity it never
      mentions (Groebner solving-degree proxies of an invariant encoding). No
      arm here constructs a relation matrix.
    - >-
      IDEA-20260807-1ea327. That record measures the three encodings at r = 3,
      m = 2 on one family. This record sweeps r across three families and m
      across two arities, and its deliverable is a LAW plus a crossover point
      rather than a single comparison. The two overlap at exactly one cell
      (r = 3, m = 2, ENC-SYM against ENC-X), and that overlap is deliberate: it
      is the consistency check between the records and must agree.
    - >-
      IDEA-20260807-4d7e8e. That record proves the availability theorem for
      r = 3 and predicts, in its observation_collision audit, that j = 1728 with
      p = 1 mod 4 is a NEAR-COLLISION where an analogous conclusion holds for a
      different algebraic reason. This record is where that prediction is
      tested, and the reason it must be tested rather than assumed is claim (A):
      the r = 2 invariance is weight 0 while the r = 3 one is weight 1.
    - >-
      KN-TECH-018 (rho automorphism discount sqrt(|Aut|)). That is the SAME
      parameter |Aut| driving a DIFFERENT algorithm, and the contrast is worth
      recording explicitly: rho gains sqrt(|Aut|) = sqrt(6), sqrt(4), sqrt(2) on
      a method that costs sqrt(N), while index calculus gains r = |Aut|/2 =
      3, 2, 1 in the unknown count on a method that costs N. Any cross-family
      comparison must charge the rho baseline family by family, or the
      comparison is against the wrong number.
    - >-
      L3 / RQ-JINV-8fc13a, the campaign's j-invariant lane. That lane asks
      whether special j values change cost functionals in general. This record
      asks a narrow, mechanistic question inside L4: whether ONE specific
      reformulation scales with r as its own bookkeeping predicts. A result here
      is an input to L3, not a substitute for it.

  object_first_candidate:
    tracked_object: >-
      THE PAIR (r, m) -> (deg_u T_m, candidate count, measured solving cost):
      the automorphism order acting on the x-line, tracked as the family
      parameter, together with the degree and cost functions it induces.
    lossiness: >-
      LOSSY: r forgets everything about the curve except the order of its
      x-line automorphism group. Two curves with the same r -- different b at
      j = 0, different p, different N -- are identified. That is a severe
      projection and it is exactly the hypothesis under test: H-SCALE says the
      projection is sufficient to predict the cost, H-ACCIDENT says it is not.
    propagation: >-
      Deterministic through the DEGREE bookkeeping, which is a closed formula in
      (r, m) and requires no measurement. Whether it propagates through the COST
      is the measured question, and cost is where the projection may fail
      because the reached degree D depends on the structure of T_m and not only
      on its degree.
    survival_score: >-
      Survives r = 1, 2, 3 by construction (those are the only values available
      over prime fields with F_p-rational automorphisms: |Aut| is 2, 4 or 6, so
      r = |Aut|/2 is 1, 2 or 3, and there is no fourth point to measure). Dies
      at m = 3 by the crossover prediction. THE SEVERE LIMIT, STATED UP FRONT:
      three points, one of which is the trivial baseline, is a very thin basis
      for a "law", and this record's honest ceiling is a consistency check
      between two nontrivial points plus a baseline, never a fitted exponent.

  mechanism: >-
    STEP 1 -- VERIFY BOTH SEMI-INVARIANCES SYMBOLICALLY, ZERO COMPUTE, HARD
    GATE. Confirm S_3(z x1, z x2, z x3) = z S_3 for a = 0 modulo z^3 - 1, and
    S_3(-x1,-x2,-x3) = S_3 for b = 0, and confirm both fail for generic (a, b).
    Confirm the total-degree congruences that explain them (all degrees 1 mod 3;
    all degrees even).

    STEP 2 -- VERIFY THE DEGREE FORMULA AT EVERY AVAILABLE CELL. Construct
    T_m by iterated resultants for (r, m) in {(3,2), (2,2), (1,2), (3,3),
    (2,3), (1,3)} and check deg_{u_i} T_m = (2r)^{m-1} exactly: expected 6, 4,
    2, 36, 16, 4. The (3,3) cell has degree 36 in three variables and may be
    infeasible to construct at all; a construction failure there IS the
    crossover evidence and is recorded as a measured infeasibility with its
    memory number, not as an absence.

    STEP 3 -- BUILD MATCHED INSTANCES ACROSS THE THREE FAMILIES. For each field
    size, generate: a j = 0 curve (a = 0) with p = 1 mod 3; a j = 1728 curve
    (b = 0) with p = 1 mod 4; and a generic ordinary curve with a b != 0. THE
    MATCHING PROBLEM IS THE HARD PART OF THIS DESIGN AND IS STATED RATHER THAN
    GLOSSED: p can be matched exactly only if p = 1 mod 12, so the design fixes
    p = 1 mod 12 and generates all three families over the SAME p. N cannot be
    matched (it is determined by the curve) and is therefore carried as a
    COVARIATE: every cost is reported against its own N, and any cross-family
    ratio is reported with the N ratio beside it. A design that silently
    compares curves with different N has confounded the family with the group
    order.

    STEP 4 -- MEASURE AT MATCHED CARDINALITY. On each family build a factor base
    of the SAME cardinality (a common multiple of 1, 2 and 3, i.e. 6m'), as a
    union of complete orbits where orbits exist. Run ENC-X and ENC-SYM at
    m = 2, and at m = 3 as far as feasibility allows, on an identical number of
    targets per family. Record wall time, basis size, max reduced-basis total
    degree, solutions, certified solutions, peak memory.

    STEP 5 -- THE LAW TEST. Compare the measured ENC-X / ENC-SYM ratio at r = 2
    and r = 3 against the ratio the bookkeeping in (B) predicts, using the r = 1
    cell to calibrate the fixed overhead (at r = 1 the two encodings are
    identical, so their measured ratio is 1.00 by construction and any deviation
    is pure instrument noise -- which is what makes r = 1 the noise floor rather
    than a data point).

    STEP 6 -- THE NULLS. For each family, the size-matched random (non-orbit)
    base under ENC-X, and the formal cube/square substitution on a curve WITHOUT
    the corresponding automorphism (NULL-1 of IDEA-20260807-1ea327), so that
    every family carries its own controlled null.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Repository greps run 2026-08-07 in this session:
      (1) 'Veronese|norm of the summation|cube substitution|u = x\^3|
      x\^3 invariant|mu_3' over the repository, content mode;
      (2) 'x\^3|cube root|zeta_3|zeta3' over ledger/, files_with_matches;
      (3) 'invariant ring|Molien|symmetric summation|elementary symmetric' over
      the repository, content mode.
      Records read: KN-TECH-002 (degree 2^{n-2} in each variable), KN-TECH-004,
      KN-TECH-011, KN-TECH-012, KN-TECH-018, KN-LIT-004, KN-LIT-006,
      DECOMPOSITION.md T4 (which fixes that j = 0 requires D_0 = -3 and j = 1728
      requires D_0 = -4), DEC-20260727-009, H-STR-002. External web searches as
      recorded in IDEA-20260807-1ea327.
    results: >-
      No record in this repository contains a degree formula for an
      automorphism-norm of a summation polynomial, nor any cross-family sweep of
      |Aut| for an index-calculus quantity. KN-TECH-018 records the
      sqrt(|Aut|) rho discount and explicitly labels it a constant and a
      baseline calibration; L3 (RQ-JINV-8fc13a) opens the general j-invariant
      question but proposes no mechanism. The degree fact deg_{x_i} S_{n} =
      2^{n-2} is KN-TECH-002 and is used, not claimed.
    verdict: >-
      ADAPTATION. Taking a norm down a quotient by a finite group and counting
      degrees is textbook invariant theory; the arithmetic in claim (B) is
      elementary bookkeeping over it. What is absent from this repository is the
      formula itself, the (r, m) sweep, and the H-SCALE / H-ACCIDENT
      discrimination. NO EXTERNAL NOVELTY IS CLAIMED; KN-LIT-004 is the obvious
      place a comparable degree count would live for the symmetric-group action
      and a full read is a Stage-0 obligation.

  null_object_control: >-
    MANDATORY AND BLOCKING, WITH A NOISE FLOOR AND A DECAY PARAMETER.
    NOISE FLOOR (r = 1): on a generic curve the invariant coordinate is u = x,
    T = S_3 and ENC-SYM is literally ENC-X. Their measured ratio must therefore
    be 1.00, and the spread around 1.00 measured over the full target stream IS
    the instrument's noise band. Every cross-family claim must exceed that
    measured band, not an assumed one. This is the cheapest and most important
    control in the record.
    MATCHED NULL PER FAMILY: for r = 3 the a != 0 curve with the formal cube
    substitution; for r = 2 the b != 0 curve with the formal square
    substitution. If the invariant encoding shows the same behaviour there, the
    effect belongs to the substitution and not to the automorphism, in that
    family.
    SIZE NULL: at every family, ENC-X on a size-matched random base of the same
    cardinality.
    DECAY PARAMETER: r itself, run DOWNWARD. The effect must be monotone in r
    and must vanish at r = 1 by construction. A measured effect that does NOT
    vanish at r = 1 is definitionally an artifact, because at r = 1 the two
    encodings are the same program. This is the strongest form of a decay test
    available anywhere in this lane, since the null is not merely matched but
    identical.

  assumptions:
    - >-
      p = 1 mod 12, so that zeta_3 and i both exist in F_p and all three
      families can be generated over the SAME prime. Checked per instance.
    - >-
      For j = 1728 the automorphism (x,y) -> (-x, i y) is F_p-rational, which
      requires p = 1 mod 4; implied by p = 1 mod 12.
    - >-
      N is prime in each family, so the scalar-action arithmetic of claim (E)
      applies. Checked per instance; instances failing it are excluded and
      recorded.
    - >-
      N CANNOT BE MATCHED ACROSS FAMILIES and is carried as a covariate. This is
      a design limitation, not an oversight, and every reported ratio names the
      two N values it spans.
    - >-
      Toy scale, pure Python, sympy. Solving-degree numbers are
      implementation-bound proxies (KN-TECH-004) and only within-solver trends
      are interpreted.
    - >-
      Three values of r, one of which is trivial, cannot establish a law. The
      record's claim is a CONSISTENCY CHECK between two nontrivial points and a
      baseline, and it must never be reported as a fitted exponent in r.

  proof_search_map:
    bottleneck: >-
      Construction and solving of T_m at (r, m) = (3, 3), where the degree is 36
      in each of three variables. That cell determines whether the crossover
      prediction can be observed directly or only inferred, and it is the single
      most expensive object in the record.
    baseline_embedding:
      parameter_slice: >-
        r = 1. There u = x, T_m = S_{m+1}, the membership degree r m equals m,
        and ENC-SYM is bit-for-bit ENC-X. The family therefore contains the
        incumbent as an exact slice, and not approximately.
      reproduction_check: >-
        Frozen fixture: at r = 1 the constructed T_m must be EQUAL as a
        polynomial to S_{m+1} (exact coefficient comparison, not equality of
        varieties), and the two Groebner runs must return identical bases on a
        fixed target. Any deviation is an implementation defect in the norm
        construction and blocks the whole sweep.
    observation_collision:
      observable: >-
        The measured ENC-X / ENC-SYM cost ratio as a function of (r, m).
      distinct_preimage_search: >-
        REQUIRED. Two distinct preimages worth hunting explicitly. (1) A j = 0
        curve and a j = 1728 curve, over the same p, with the same measured
        ratio -- which would support H-SCALE. (2) Two j = 0 curves over the same
        p with DIFFERENT b and materially different ratios -- which would
        falsify the claim that r is the controlling parameter and would be the
        sharpest possible refutation of H-SCALE, since it exhibits variation
        WITHIN a fixed r. Search (2) is cheap (vary b) and is mandatory before
        any law is reported.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Build a resource measure in (r, m) -- degree (2r)^{m-1} and candidate
          count m^m against (rm)^m -- and realise it by specialisation to the
          three available families, adding charges only over the disjoint blocks
          (r, m) that are actually measured.
        predicted_gain: >-
          Turns a per-family anecdote into a two-parameter table with a
          pre-registered predicted shape, and makes the crossover a located
          point rather than an impression.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (cost ratio) fixed and vary the forgotten
          structure: weight-1 semi-invariance (r = 3) against weight-0
          invariance (r = 2). The intrinsic invariant distinguishing them is the
          total-degree congruence class of S_3's monomials, which is symbolic
          and free.
        predicted_gain: >-
          Directly separates H-SCALE from H-ACCIDENT: if the two weights behave
          identically once r is accounted for, the weight is not load-bearing;
          if not, it is, and the j = 0 result cannot be extrapolated.
    quantifier_order: >-
      Intended (H-SCALE): THERE EXISTS a function F(r, m) such that FOR ALL
      curves in the declared families and FOR ALL targets in the declared
      streams, the measured ENC-X / ENC-SYM cost ratio equals F(r, m) within the
      r = 1 noise band.
      The dangerous weaker reading, NOT claimed: FOR ALL curves THERE EXISTS
      F -- letting F depend on the curve, which is exactly what H-ACCIDENT says
      and would make the r-sweep uninformative. The audit obligation is
      collision search (2) above: vary b within a fixed r and check that F does
      not move.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At arity 2, on these toy curves, with this solver, the invariant
        encoding's cost ratio is consistent with the (r, m) bookkeeping at
        r = 2 and r = 3 within the r = 1 noise band" -- or its negation. It can
        NEVER certify a law in r (three points, one trivial), an exponent, a
        statement about arity above the feasible cells, or anything about the
        ECDLP. It also cannot certify anything about r > 3, which does not exist
        over prime fields with rational automorphisms.
      nearby_object_control: >-
        The r = 1 generic curve, where the desired conclusion (a nontrivial cost
        ratio) must fail identically, since the two encodings are the same
        program. A method reporting a nontrivial ratio there is measuring noise
        or a bug, and the size of that spurious ratio is the noise floor for
        everything else.
    proof_obligations:
      - claim: S_3 is weight-1 mu_3-semi-invariant iff a = 0.
        responsibility: correctness
      - claim: S_3 is weight-0 (Z/2)-invariant iff b = 0.
        responsibility: correctness
      - claim: deg_{u_i} T_m = (2r)^{m-1}.
        responsibility: size
      - claim: candidate count falls from (r m)^m to m^m.
        responsibility: size
      - claim: T_m at r = 1 equals S_{m+1} as a polynomial.
        responsibility: baseline
      - claim: one solved system yields one independent relation in every family.
        responsibility: scope
      - claim: >-
          all three families are generatable over a common p = 1 mod 12 with
          prime N
        responsibility: feasibility

  predictions:
    - metric: >-
        deg_{u_i} T_m as constructed, at (r, m) in {(3,2),(2,2),(1,2),(2,3),
        (1,3)} and at (3,3) if feasible
      direction: different
      minimum_effect: >-
        Exactly 6, 4, 2, 16, 4 and 36 respectively. Zero tolerance: these are
        arithmetic predictions of claim (B) and a single deviation falsifies the
        formula cheaply and immediately.
    - metric: >-
        ENC-X / ENC-SYM cost ratio at r = 1
      direction: different
      minimum_effect: >-
        Exactly 1.00, with the measured spread defining the noise band. A
        systematic deviation from 1.00 at r = 1 is an instrument defect and
        blocks every other comparison in the record.
    - metric: >-
        ENC-X / ENC-SYM cost ratio, r = 3 against r = 2, at m = 2, matched p and
        matched cardinality
      direction: different
      minimum_effect: >-
        H-SCALE is recorded if the two ratios are ordered as the bookkeeping
        predicts (the r = 3 ratio further from 1.00 than the r = 2 ratio, in the
        same direction) AND both exceed the r = 1 noise band. H-ACCIDENT is
        recorded if they are ordered oppositely, or if one exceeds the band and
        the other does not. If neither exceeds the band, the outcome is
        NO EFFECT IN EITHER FAMILY, which is a third pre-registered branch and
        is the most likely one.
    - metric: >-
        within-family variation: cost ratio across at least 5 different b values
        at fixed r = 3 and fixed p
      direction: different
      minimum_effect: >-
        Predicted CONSTANT within the noise band. A spread exceeding the
        between-family difference falsifies r as the controlling parameter and
        is the sharpest refutation available, so it is measured BEFORE any
        cross-family claim is made.
    - metric: >-
        crossover arity: the smallest m at which the invariant encoding's
        measured cost exceeds ENC-X's
      direction: lower
      minimum_effect: >-
        Predicted m = 3 or earlier at r = 3. A construction or solving failure
        at (3,3) within the memory budget is recorded as a MEASURED
        INFEASIBILITY with its peak-memory number and counts as evidence for the
        crossover, distinctly labelled from a mathematical result per
        AGENTS.md rule 5.

  minimal_test:
    design: >-
      CHEAPEST VALID DISCRIMINATOR, MINUTES, NO CURVES NEEDED: STEP 1 and STEP 2
      -- the two symbolic semi-invariance checks and the degree table at the six
      (r, m) cells. Six integers, each predicted exactly. This alone tests
      claim (A) and claim (B) completely and can falsify the record before a
      single curve is generated.
      THEN, an hour: generate the three families over a common p = 1 mod 12 at
      12 and 16 field bits and confirm prime N, the automorphism rationality,
      and matched factor-base cardinality.
      THEN, hours: the m = 2 sweep with 20 targets per family, including the
      r = 1 noise-floor cell and the within-family b-variation cells.
      THEN, as budget allows: the m = 3 cells, expecting infeasibility at r = 3
      and recording the memory number when it occurs.
    controls:
      - r = 1 noise floor, where the two encodings are the same program
        (blocking)
      - within-family b-variation at fixed r (blocking before any law is stated)
      - per-family matched null (a != 0 for r = 3, b != 0 for r = 2)
      - size-matched random base under ENC-X in every family
      - r = 1 degeneration fixture: T_m must equal S_{m+1} coefficientwise
      - independent certificate re-verification of every decomposition
      - N reported as a covariate beside every cross-family ratio
    required_metrics:
      - deg_{u_i} T_m as constructed, per (r, m)
      - Groebner wall time, basis size, max total degree, per family per target
      - peak memory per cell, especially at (3,3)
      - N, p, |V|, m and orbit count per family
      - r = 1 noise band as a measured spread
      - within-family b-variation spread
      - certified solutions per family

  falsification_conditions:
    - >-
      Either semi-invariance check in STEP 1 fails, or holds for the wrong
      coefficient condition. Claim (A) is wrong; the record is superseded.
    - >-
      A constructed deg_{u_i} T_m differs from (2r)^{m-1}. Claim (B) is wrong;
      every cost prediction resting on it is void.
    - >-
      T_m at r = 1 is not equal to S_{m+1}. The norm construction is wrong and
      no comparative number may be reported.
    - >-
      The r = 1 ratio is systematically different from 1.00. Instrument defect;
      the sweep is blocked.
    - >-
      Within-family variation over b exceeds between-family variation. r is not
      the controlling parameter, H-SCALE is refuted, and the record's headline
      becomes that the effect is curve-specific rather than |Aut|-driven.
    - >-
      The three families cannot be generated over a common p with prime N. A
      FEASIBILITY outcome; the design falls back to matched field size with p
      as an additional covariate, and the weakening is recorded rather than
      hidden.
    - >-
      (3,3) cannot be constructed or solved in budget. An INFRASTRUCTURE outcome
      under AGENTS.md rule 5, recorded with its memory number, and admissible as
      support for the crossover only under that label.

  confounders:
    - >-
      N MISMATCH. Different families over the same p have different N, and cost
      depends on N through the number of targets needed and through the modulus
      arithmetic. N must be reported with every ratio and cross-family ratios
      must never be presented without it.
    - >-
      p = 1 mod 12 RESTRICTION. Requiring both zeta_3 and i restricts the prime
      set and could correlate with something else. The mitigation is to also run
      each family over primes satisfying only its own condition and check that
      the within-family numbers do not move.
    - >-
      2-TORSION AT r = 2. For j = 1728 the fixed point of x -> -x is x = 0,
      which is a 2-torsion x-coordinate when a is such that 0 is on the curve
      (b = 0 gives y^2 = x^3 + a x, so x = 0 gives y = 0 always). So the r = 2
      family ALWAYS has a degenerate orbit at x = 0 and it is always a 2-torsion
      point; excluding it is mandatory and its exclusion changes the orbit count
      by one in a way the r = 3 family does not experience.
    - >-
      DIFFERENT |Aut| VERSUS DIFFERENT r. |Aut| is 6, 4, 2 while r is 3, 2, 1.
      Any statement must name which of the two it is about; the rho baseline
      scales with sqrt(|Aut|) and the index-calculus unknown count with r, and
      conflating them produces a factor-of-2 error in every comparison.
    - >-
      SOLVER IDIOSYNCRASY, as in IDEA-20260807-1ea327: within-solver only.
    - >-
      THREE POINTS. The temptation to fit a curve through r = 1, 2, 3 and report
      an exponent is the main interpretive risk here and is forbidden in
      advance.

  interpretation_limits:
    - >-
      NO EVIDENCE ABOUT H-STR-002 IN EITHER DIRECTION; DEFER-BATCH009-001 is
      untouched and remains open.
    - >-
      Toy tier, claim_tier toy. Three values of r, one trivial. This is a
      consistency check, never a law, and never a fitted exponent.
    - >-
      Scoped to prime fields with F_p-rational automorphisms, where r is
      confined to {1, 2, 3}. Nothing here extends to extension fields, where the
      published endomorphism-index-calculus results live and where larger
      effective r is available.
    - >-
      j = 0 and j = 1728 are measure-zero families fixed by the isogeny class
      (T4). No standardized curve in this program's target set is in either, and
      no curve can be moved into them.
    - >-
      Even a maximal positive result is a constant-factor statement about one
      step of a method already dominated by rho over prime fields (KN-LIT-006).

  reachability_gate: >-
    REQUIRED AND BINDING, BECAUSE THIS RECORD MOVES BETWEEN CURVE FAMILIES.
    (1) IS A GOOD OBJECT REACHABLE? For the EXPERIMENT, yes and for free: j = 0
    and j = 1728 curves are constructed directly by setting a = 0 or b = 0, at
    O(1) cost per instance, with no isogeny walking. So the experimental design
    incurs no reachability cost at all.
    (2) FOR AN ATTACK, NO, AND THE COST IS INFINITE RATHER THAN LARGE. By T4 of
    DECOMPOSITION.md, j = 0 requires the isogeny class to have D_0 = -3 and
    j = 1728 requires D_0 = -4; the class fixes the trace t and hence D, so a
    curve whose class lacks the discriminant CANNOT be walked to one that has
    it -- not at cost p^{1/4}, not at any cost. The reachability gate therefore
    closes hard for a target curve chosen adversarially or at random, and this
    record's results apply only to curves already known to be CM by -3 or -4.
    (3) IS GOODNESS LOCALLY DETECTABLE? Trivially yes -- j is computed from
    (a, b) in O(1) -- but that is irrelevant given (2): detectability does not
    help when the target is unreachable.
    This gate is stated at full strength because it is the single most important
    scope limit on the entire L4 lane, and it is a structural limit rather than
    a budgetary one.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES. Relation supply is identical across families at matched
      cardinality (claim (E)), and the arity-2 prime-field total remains about
      2 c N / r -- linear in N with r in {1, 2, 3}. What this record measures is
      c, the per-search algebraic cost, as a function of r and m. The degree
      bookkeeping says c's input degree scales as (2r)^{m-1} while the candidate
      count scales as m^m against (rm)^m; neither is an exponent in N.
    memory_exponent: >-
      Groebner memory at (r, m) is the Macaulay dimension in the reached degree,
      which by claim (B) grows as (2r)^{m-1} in the input degree -- the reason
      (3,3) is expected to be infeasible. Peak memory is a primary reported
      metric here rather than bookkeeping, because it is the quantity that
      locates the crossover.
    best_known: >-
      Parallel rho with distinguished points at 0.886 sqrt(N) and O(1) memory
      (KN-TECH-001, KN-TECH-006), CHARGED FAMILY BY FAMILY with the KN-TECH-018
      discount: 0.886 sqrt(N)/sqrt(6) at j = 0, /sqrt(4) at j = 1728, /sqrt(2)
      generic. BSGS at sqrt(N) time and memory. For the decomposition step, the
      incumbent is ENC-X at every r.
    hidden_overhead: >-
      The norm construction cost grows with r^m factors and must be charged per
      target; at (3,3) that is 27 resultant factors and it may dominate
      everything else. Disclosed here because a table that reports only Groebner
      time would credit the invariant encoding with a saving it pays for in
      construction.
    tradeoff_note: >-
      The (r, m) sweep is itself a time-memory frontier for the SOLVER, not for
      an attack: higher r buys fewer candidates and costs degree, and degree
      costs memory superlinearly. Parallelization position is unchanged in every
      cell, since targets are independent.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES, AND FAMILY BY
    FAMILY BECAUSE THE BASELINE ITSELF MOVES WITH |Aut|. As an attack: dominated
    at j = 0 by automorphism-discounted parallel rho at 0.886 sqrt(N)/sqrt(6)
    with O(1) memory (KN-TECH-018 over KN-TECH-001/006); at j = 1728 by the same
    at /sqrt(4); at generic curves by the same at /sqrt(2); and in every family
    by BSGS on time (sqrt(N)) though not on memory. Prime-field
    point-decomposition index calculus, the method whose step this measures, is
    itself dominated by all of those (KN-TECH-003, KN-LIT-006). On data/queries
    every family consumes O(N/r) decomposition attempts against rho's
    O(sqrt(N)) group operations. AS A MEASUREMENT there is no incumbent
    cross-family sweep in this repository, so nothing dominates it on that axis
    -- a coverage fact, not a value claim.
  sota_delta: >-
    Zero speedup against any attack baseline in any family. Quantitatively, the
    quantities the record puts numbers on: per-variable degree (2r)^{m-1}
    against 2^{m-1}, i.e. inflation factors 1, 2, 3 at m = 2 and 1, 4, 9 at
    m = 3; candidate deflation r^m, i.e. 1, 4, 9 at m = 2 and 1, 8, 27 at m = 3;
    membership degree r m -> m; and a measured cost ratio per family against a
    measured r = 1 noise floor. Against the rho baseline the delta is negative
    in every family, since index calculus at arity 2 costs about N/r against
    0.886 sqrt(N)/sqrt(2r).

