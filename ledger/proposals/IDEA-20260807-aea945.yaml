idea:
  id: IDEA-20260807-aea945
  question_id: RQ-MLKEM-003
  added: '2026-08-07'
  title: GOAL-MLKEM-004 closed at budget explicitly saying 'THIS IS BUDGET EXHAUSTION, NOT A METHOD
    CEILING ... A successor should open', named that successor's first batch concretely (RC-5,
    RC-G, RC-A plus the coupling-preserving ablation), and no successor was ever opened
  class: control
  claim: 'DEC-20260805-0b3e11 closed GOAL-MLKEM-004 at budget with C2 unmet and stated the closure
    is deliberately NOT of the GOAL-MLKEM-003 kind: ''THIS IS BUDGET EXHAUSTION, NOT A METHOD
    CEILING ... THIS instrument works, its measurements reproduce, and its question remains answerable.
    A successor should open.'' NA-1 names the successor''s first batch: RC-5 (the m-sweep at fixed
    (N, K), pre-registered against the producer''s own falsifiable prediction that the uniform
    floor tracks 1 - O(K/m)), RC-G (at least four real databases), RC-A (an arbitrary non-dual
    coupling), plus the validator''s coupling-preserving ablation -- and records why it is not
    the same campaign renamed: six batches varied the OBJECT at fixed parameters; the successor
    varies the PARAMETER and the REPLICATE. The surviving quantity is real: EV-MLKEM-d777f0 and
    EV-MLKEM-2cd08b record a 4-9% object-specific residual, ''the only quantity in five batches''
    to survive every ablation either reviewer could construct, replicated across 16 draws with
    pooled exact-exchangeability p = 0.0303. No goal record names GOAL-MLKEM-004 as its predecessor
    and the string ''RC-5'' appears in only three live ledger records, none of them a plan.'
  mechanism: Open the successor as scoped, and no wider. (a) Sweep m at fixed (N, K) against the
    PRE-REGISTERED 1 - O(K/m) prediction -- pre-registration is what makes this a test rather
    than a fit. (b) Run the real arm at FOUR OR MORE independently sieved databases rather than
    n = 1, which is the replication the residual has never had. (c) Add the ablation that PRESERVES
    the coupling y = A^T x mod q while DESTROYING the sieve geometry -- the one control that separates
    'the residual is about the dual coupling' from 'the residual is about the sieve', and the
    one neither reviewer could construct inside the old budget.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    grep_results:
    - GOAL-MLKEM-005 is bound to RQ-MLKEM-001 and states in its own objective that it exists precisely
      because both prior campaigns 'bound themselves to RQ-MLKEM-003'. Its tracked object is (shared
      BKZ-reduced basis; per-target projected-error ratio R) under best-of-M ciphertext selection
      -- a different object, a different question, and a self-declared ceiling that it cannot
      move an exponent. It does not inherit NA-1 and does not mention RC-5, RC-G or RC-A.
    - The m-sweep, the four-database arm, the arbitrary non-dual coupling and the coupling-preserving
      ablation have none of them been run or proposed.
    conclusion: Screened against ledger/proposals, ledger/hypotheses and knowledge/; external
      novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: new dual-attack variants.
      The successor varies PARAMETERS and REPLICATES on a fixed object, by design.'
    tracked_object: The object-specific residual in the dual-vector score distribution, tracked
      as a function of m at fixed (N, K) and across independent databases.
    one_step_propagation_rule: Each additional m value extends the sweep by one point against
      the pre-registered curve; each additional database adds one independent replicate.
    newness_score: Nil as mechanism. The content is that a replicated 4-9% residual with a named
      successor plan was left unopened.
  lossy_projection_identifiability_audit:
    projection: the sieve database -> the residual in its score distribution.
    what_is_discarded: The vectors themselves.
    is_it_only_a_change_of_coordinates: 'NO. Honest caveat: this is a WEAK object -- it produces
      a residual percentage, never a mathematical statement about any hard problem -- and the
      record''s class reflects that.'
    mirror_failure_check: CHECKED. The residual already survived every ablation two reviewers
      constructed and is bounded away from zero at p = 0.0303, so it is not a quantity that is
      trivially nonzero; and the m-sweep's pre-registered curve can be wrong, which is the point
      of pre-registering it.
  null_object_control:
    primary_null: THE COUPLING-PRESERVING ABLATION. Keep y = A^T x mod q exactly; destroy the
      sieve geometry. If the residual survives, it is about the coupling; if it vanishes, it is
      about the sieve. No other control separates these and neither reviewer could build it in
      budget.
    secondary_nulls:
    - 'RC-A: an arbitrary non-dual coupling, which must NOT show the residual.'
    - 'REGRESSION: reproduce the committed 4-9% residual at the original (N, K, m) before sweeping.'
  assumptions: []
  predictions:
  - metric: residual as a function of m against the pre-registered 1 - O(K/m) curve
    direction: different
    minimum_effect: Departure from the pre-registered curve outside its stated tolerance at two
      or more m values.
  - metric: residual under the coupling-preserving ablation
    direction: different
    minimum_effect: Survival or disappearance; both are decisive and the two readings are opposite.
  minimal_test:
    design: m-sweep at fixed (N, K) with the prediction pre-registered before any run; four or
      more independently sieved databases for the real arm; RC-A and the coupling-preserving ablation;
      report against the committed regression.
    controls:
    - coupling-preserving ablation
    - RC-A arbitrary non-dual coupling
    - committed-residual regression
    required_metrics:
    - residual per m per database with CIs
    - agreement with the pre-registered curve
    - residual under each ablation
  falsification_conditions:
  - 'The residual vanishes under the coupling-preserving ablation: it is a sieve artifact, and
    eighteen batches of dual-attack work get their first named obstruction on KN-OPEN-016''s actual
    question.'
  - 'It survives and tracks the pre-registered curve: a measured effect about the dual coupling,
    which is a first-class positive and demands red-teaming.'
  - 'The residual does not reproduce across four independent databases: it was an n = 1 artifact,
    which is itself the answer the replication was for.'
  confounders:
  - Four databases is a small replicate count for a 4-9% effect; report CIs and refuse to pool
    across m.
  - Pre-registration is only meaningful if the prediction is filed before the first run; the record
    must be committed first.
  - Sieve databases at different seeds are not fully independent if the basis generator is shared;
    state the independence claim precisely.
  interpretation_limits:
  - Toy dimensions. No FIPS 203 claim.
  - Neither outcome moves an exponent; GOAL-MLKEM-004's own closure says the campaign cannot.
  heuristic_assumptions:
  - id: HEUR-MLKEM4-1
    statement: The 1 - O(K/m) floor prediction is the right functional form.
    rigorous_support: It is the producer's own derivation, unvalidated.
    validation_plan: Pre-register it and report the departure, which is the test.
  target_complexity:
    time_exponent: n/a -- control
    memory_exponent: n/a
    best_known: Classical dual and primal attacks under MATZOV costing
    hidden_overhead: n/a
    tradeoff_note: No exponent claim.
  dominated_by: n/a (no attack claimed)
  sota_delta: ZERO. Either produces this program's first named obstruction on the dual-sieve independence
    question (KN-OPEN-016's actual question, which eighteen batches have failed to reach), or
    converts the 4-9% residual from an unexplained survivor into a measured effect. Leaving it
    unopened is the shape of premature closure the inventor protocol warns about, and the closing
    decision says so itself.
  estimated_cost:
    implementation: medium
    compute: high
  recommended_priority: high
  honest_prior_of_survival: 0.85 that the successor is runnable on the existing instrument. 0.5
    that the residual survives the coupling-preserving ablation. 0.4 that it reproduces across
    four independent databases. 0.15 that it tracks the pre-registered curve, which would be the
    strongest outcome.
