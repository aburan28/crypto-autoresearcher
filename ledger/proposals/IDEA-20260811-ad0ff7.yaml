idea:
  id: IDEA-20260811-ad0ff7
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-GGMB-6eaabc
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  task_id: TASK-20260811-c439c2
  axis: A4
  claim_tier: toy
  title: >-
    THE WEAKEST NON-SIMULABLE ORACLE RETURNS ONE BIT AND KEEPS ITS WITNESS: an
    arity-graded family of single-bit DECISION oracles DECIDE_B^{(j)}(h) = "is h
    a sum of j elements of the fixed base B?", j <= m, breaks the generic bound
    with at most m*L adaptive queries and L = (m! N)^{1/m} group operations, by a
    search-to-decision reduction that peels one summand per round. So the
    campaign's non-closed oracle (arity-m DECOMPOSITION, which returns a witness
    of binom(L,m) branches) can be weakened to ONE BIT PER QUERY without changing
    its verdict -- and, in the other direction, ONE BIT TOTAL on a fixed target
    provably cannot: the load-bearing feature is ADAPTIVITY IN THE TARGET, not
    the width of the answer
  class: algorithm

  claim: >-
    (A) THE ORACLE FAMILY, FROZEN BEFORE ANY VERDICT. Fix a base
    B = {B_1, ..., B_L} of elements of G (the adversary may build them itself, so
    it may know their discrete logarithms). For 1 <= j <= m define the SINGLE-BIT
    oracle
      DECIDE_B^{(j)}(h) = 1 iff there exist indices i_1 <= ... <= i_j, repetition
      allowed, with B_{i_1} + ... + B_{i_j} = h; else 0.
    Each query returns exactly one bit. NO WITNESS IS RETURNED. The base B is
    FIXED across the whole execution; only the target h and the arity j vary.

    (B) THEOREM D-1, THE SEARCH-TO-DECISION REDUCTION. Given the oracle family
    {DECIDE_B^{(j)}}_{j<=m} and a target R known to satisfy
    DECIDE_B^{(m)}(R) = 1, the m indices can be recovered with at most m*L
    oracle queries and m*L group operations. PROOF, COMPLETE AND SHORT. Set
    R_0 = R. At round r = 1, ..., m: for i = 1, 2, ..., L query
    DECIDE_B^{(m-r)}(R_{r-1} - B_i) and take the first i with answer 1 (for
    r = m the test is instead the equality R_{m-1} = B_i, which costs no oracle
    query). Correctness: if R_{r-1} is a sum of m-r+1 base elements then some
    summand B_i satisfies "R_{r-1} - B_i is a sum of m-r", so a 1 is found; and
    conversely a 1 at index i certifies that B_i extends to a full decomposition,
    so there are NO false positives and no backtracking. Set R_r = R_{r-1} - B_i
    and continue. Each round costs at most L queries and L subtractions; there
    are m rounds. QED.

    (C) COROLLARY D-2, THE SEPARATION. Let the adversary choose a_1, ..., a_L
    uniformly in Z/N, form B_i = [a_i]P (L group operations, logarithms known),
    with L = ceil((m! N)^{1/m}) so a uniformly random target decomposes with
    constant probability. Form R = [a]P + [b]Q with b invertible. Query
    DECIDE_B^{(m)}(R); on 1, run D-1 to obtain the indices; then
    a + b*k = a_{i_1} + ... + a_{i_m} (mod N) gives k. TOTAL COST: at most
    (m+1)*L single-bit queries and O(L) group operations, i.e. O(m N^{1/m})
    everything, which is below the birthday bound for every m >= 3.
    HENCE: A ONE-BIT-PER-QUERY, WITNESS-FREE, FIXED-BASE ORACLE BREAKS THE
    GENERIC BOUND. The witness that IDEA-20260807-7270d1 charges at existential
    width Z = binom(L, m) is NOT NEEDED; the campaign's single non-closed oracle
    can be weakened to its decision form and stays non-closed.

    (D) THEOREM D-3, THE OTHER SIDE OF THE BOUNDARY, WHICH IS WHAT MAKES THIS A
    CHARACTERISATION RATHER THAN AN ATTACK STORY. Weaken the oracle in the OTHER
    direction: allow one bit per query but FIX the target to a single value
    chosen before the execution (equivalently, allow the adversary a total of c
    bits of answer, non-adaptively). Then by the answer-branching floor of
    IDEA-20260811-a343de the adversary succeeds with probability at most
    binom(g+2,2)/N + 2^c/(N - binom(g+2,2)), so c = o(log_2 N) bits are
    provably useless no matter what they are bits OF. Combining:
      ONE BIT PER ADAPTIVELY CHOSEN TARGET, m*L times   -> BREAKS the bound;
      o(log_2 N) BITS TOTAL, however chosen             -> CANNOT break it.
    THE LOAD-BEARING FEATURE IS ADAPTIVITY IN THE TARGET AND THE NUMBER OF
    QUERIES, NOT THE WIDTH OF THE ANSWER. That is a sharp statement about where
    the boundary runs, it has both directions, and neither direction is a
    restatement of the other.

    (E) THE GAP, STATED HONESTLY AND OFFERED AS THE OPEN DIRECTION. D-2 uses
    about m*N^{1/m} single-bit queries; the floor of IDEA-20260811-a343de says
    log_2 N bits suffice in principle. The gap is a factor
    m*N^{1/m}/log_2 N and IT IS NOT CLOSED HERE. The obvious attempt --
    binary-searching on k directly by asking DECIDE_B^{(m)}(Q - [c]P) for varying
    c, each answer being roughly one unbiased bit when binom(L,m)/N is about
    ln 2 -- FAILS for a named reason: the adversary cannot PREDICT the answer
    without deciding decomposability itself, so the bits it receives are not bits
    it can invert. That is an information-versus-computation gap, it is the
    correct forward question for this lane, and it is recorded as open rather
    than papered over.

    (F) THE ARITY-COLLAPSE QUESTION, ALSO OPEN AND ALSO NAMED. D-1 needs the
    ARITY-GRADED family {DECIDE^{(j)}}_{j<=m}, i.e. m distinct single-bit
    oracles, or equivalently one oracle taking the arity as an argument. A single
    FIXED-ARITY oracle with padding (adjoin the identity to B, so the oracle
    decides "sum of AT MOST m") does not support the peeling step, because
    "R - B_i is a sum of at most m" does not certify that R is a sum of at most m.
    WHETHER ONE FIXED-ARITY SINGLE-BIT ORACLE SUFFICES IS OPEN, and the named
    obstruction is that the "at most" relation is not closed under the peeling
    subtraction. This is exactly the kind of one-line obstruction that should be
    recorded so the next agent does not re-derive it.

  resource_label: >-
    R1 (x-coordinates as field elements). The decomposition predicate is a
    statement about whether a point lies in the subset-sum set of a declared
    finite set of points; over F_p the only known way to decide it below
    binom(L,m) work is to solve a Semaev system in the x-coordinates, which is
    the R1 consumption. The oracle is otherwise entirely group-theoretic in its
    statement, which is the point: R1 appears only in its IMPLEMENTATION cost, and
    that cost is IDEA-20260807-070d03's open C.
  admissibility: admissible
  admissibility_argument: >-
    Admissible. No endomorphism is applied to any point of G; H-ENDO-001 is not
    used, not needed and not tested. KN-FIND-b7e091 is EXTENDED, not revisited:
    its Oracle C (incidence, VERIFY form, Z = 1) remains closed exactly as
    written, and the object here is a strictly different oracle -- a DECISION
    over an existential, with the witness withheld -- which sits between Oracle C
    and the search-form decomposition oracle and which no record on the books
    adjudicates.

  object_first_candidate:
    tracked_object: >-
      THE DECOMPOSABILITY INDICATOR d_B^{(j)}: G -> {0,1}, d(h) = 1 iff h is a
      sum of j elements of B, followed through the adversary's adaptive sequence
      of targets R_0, R_1, ..., R_m.
    lossiness: >-
      GENUINELY AND EXTREMELY LOSSY. The full object is the SET of decompositions
      of h, of size up to binom(L,m); the projection keeps one bit -- whether the
      set is empty. log_2 binom(L,m) bits about N of them, in the
      index-calculus regime, are thrown away per query. It is not invertible:
      exponentially many targets share the value 1. This is strictly more lossy
      than IDEA-20260807-070d03's membership bit b(R), which projects one point's
      coordinate onto one bit; here an entire solution SET is projected onto one
      bit.
    propagation: >-
      IT DOES NOT PROPAGATE UNDER THE GROUP LAW, AND THAT IS WHY IT ESCAPES.
      d(h_1 + h_2) is not a function of d(h_1) and d(h_2) -- decomposability is
      not additive. BUT -- and this is the content of Theorem D-1, and it is what
      distinguishes this object from a useless one -- IT PROPAGATES UNDER A
      DIFFERENT, ADVERSARY-CHOSEN OPERATION: the peeling map
      (h, j) |-> (h - B_i, j-1). Under that operation the retained bit determines
      the next state deterministically and without error, and the recursion
      terminates in m steps. So the projection is lossy, and what it discards is
      discarded COMPATIBLY with the peeling operation even though it is
      incompatible with the group law. The inventor-protocol section 2 test is
      passed with respect to peeling and failed with respect to addition, and the
      GENERAL LESSON worth recording once is: a tracked object need not propagate
      under the target's native operation, provided the algorithm is allowed to
      choose the operation it propagates under -- which is exactly the freedom a
      non-generic adversary has and a generic one does not.
    survival_score: >-
      Survives exactly m peeling steps and then the structure is gone, because
      the arity budget is exhausted. It survives change of curve, prime and
      factor-base construction, because the reduction uses no property of B
      beyond its being a finite set. It does NOT survive removal of the arity
      grading (see (F)), and it does NOT survive making the target non-adaptive
      (see (D)) -- two sharp death conditions, both located.

  mechanism: >-
    STEP 1 (zero compute) -- FREEZE THE SIGNATURE: base fixed, arity an argument,
    answer one bit, no witness, target adaptive. Per IDEA-20260807-63056d Q0,
    nothing may be claimed before the signature is frozen, because the whole
    result depends on which arguments are variable.
    STEP 2 (zero compute) -- PROVE D-1 as written, and audit the no-false-positive
    step, which is the only place the argument can break.
    STEP 3 (zero compute) -- ASSEMBLE D-2 with its exact query and operation
    counts, and check the m >= 3 sub-birthday threshold arithmetically.
    STEP 4 (zero compute) -- STATE D-3 by citing the answer-branching floor of
    IDEA-20260811-a343de, and check the two directions are not vacuously
    compatible (they are not: the breaking side uses m*L >> log_2 N bits, so
    there is no contradiction, and confirming that is a required consistency
    check rather than a formality).
    STEP 5 (zero compute) -- WRITE THE TWO OPEN QUESTIONS (E) and (F) with their
    named obstructions, as forward guidance under the inventor protocol's closure
    standard.
    STEP 6 (toy compute, instrument check only) -- implement DECIDE by exhaustive
    search at toy scale, run the reduction, and check the measured query count
    against m*L. The oracle's exhaustive implementation is charged SEPARATELY and
    reported beside the query count so that nothing reads as a sub-rho attack.

  why_not_a_renamed_known_approach: >-
    Search-to-decision self-reducibility is a standard technique in complexity
    theory and NOTHING about the technique is claimed as new. What is claimed is
    its consequence HERE, which no record on the books states: the campaign's one
    surviving non-closed oracle -- arity-m decomposition -- has been discussed
    exclusively in its WITNESS-RETURNING form, and its existential width
    Z = binom(L,m) has been the quantity carrying the verdict
    (IDEA-20260807-7270d1). This record shows the witness is superfluous, so the
    verdict does not depend on Z being large; a one-bit answer suffices. That
    matters operationally, because it means an implementation effort aimed at
    producing decomposition WITNESSES cheaply is aiming at more than is needed,
    and because it moves the minimal breaking oracle to a strictly weaker point
    in the lattice. It also matters for the axis question, since "weakest
    non-simulable oracle" is a question about the lattice and this record lowers
    the known ceiling of that lattice by a factor log_2 binom(L,m) in answer
    width. EXTERNAL NOVELTY IS NOT CLAIMED and web search was unavailable this
    session.

  predictions:
  - observable: query count of the reduction, measured
    metric: number of DECIDE queries used by D-1 to recover a witness, at
      p in {2^16, 2^18, 2^20}, m = 3, L on the ladder {N^{1/4}, N^{1/3}}, over
      100 successful targets
    direction: different
    predicted: at most m*L, with an empirical MEAN near m*L/2 (the first success
      index is roughly uniform in [1, L] per round). A measured count exceeding
      m*L at any trial falsifies the no-false-positive step and the reduction is
      wrong.
  - observable: correctness of the recovered witness
    metric: fraction of runs in which the recovered indices actually sum to the
      target, verified independently of the oracle
    direction: different
    predicted: exactly 1.000. This is a certificate check per
      docs/claims-and-verification.md and a single failure means the reduction has
      a false positive and D-1 is false.
  - observable: end-to-end key recovery
    metric: fraction of instances on which the D-2 pipeline outputs the true k,
      verified by recomputing [k]P and comparing to Q
    direction: different
    predicted: equal to the decomposition probability
      1 - exp(-binom(L,m)/N) within 15 percent, over at least 200 instances. A
      lower rate means the base construction or the target randomisation is
      broken; a higher rate means the harness is leaking k.
  - observable: the non-adaptive control
    metric: success rate of the same pipeline when the oracle may be queried only
      on targets fixed BEFORE the execution, with the same total query budget
    direction: lower
    predicted: the guessing rate 1/N. This is the D-3 direction and it is the
      measurement that distinguishes "adaptivity matters" from "bits matter"; a
      success here would falsify the record's central claim about which feature
      is load-bearing.
  - observable: the fixed-arity collapse question (F)
    metric: whether a padded fixed-arity oracle ("sum of at most m", identity in
      B) permits any reduction recovering a witness in fewer than binom(L,m)
      queries, tested exhaustively at N <= 2^12 by brute-force search over
      adaptive strategies of depth <= 4
    direction: different
    predicted: NO such strategy is found at the tested depth. A strategy that IS
      found would close open question (F) affirmatively and would be the more
      interesting outcome.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, about one hour, HARD GATE, AND IT IS THE CHEAPEST
      DISCRIMINATOR). Audit the no-false-positive step of D-1 on paper. The claim
      is that DECIDE^{(m-r)}(R_{r-1} - B_i) = 1 CERTIFIES that B_i extends to a
      decomposition of R_{r-1} of arity m-r+1. Check it, and check the boundary
      round r = m where the oracle is replaced by an equality test. If it fails,
      the record dies for an hour of work with no curve and no solver.
      STAGE 1 (zero compute, 20 minutes). Arithmetic check that
      (m+1)*L + O(L) < 0.886*sqrt(N) exactly for m >= 3 at N in
      {2^32, 2^160, 2^256}, and NOT for m = 2. Confirms the separation is
      non-vacuous exactly where IDEA-20260811-a343de says it should be.
      STAGE 2 (toy compute, <= 30 minutes). Implement DECIDE by exhaustive
      subset-sum search at p <= 2^20 with m = 3, run D-1 and D-2 end to end on
      200 instances, and report BOTH the query count AND the separately charged
      exhaustive-search cost, side by side, so nothing reads as sub-rho.
      STAGE 3 (toy compute, <= 30 minutes). The two controls below.
      STAGE 4 (zero compute). Write (E) and (F) as open questions with their
      obstructions.
    controls:
    - >-
      NULL OBJECT (matched, blocking): DECIDE_B'^{(j)} where B' is a base of the
      SAME size L drawn uniformly at random from G with logarithms NOT known to
      the adversary. The reduction must recover a witness at the same query cost
      -- because it uses no property of B -- but the final linear step must FAIL
      to yield k, since without the a_i the relation is one equation in L+1
      unknowns. This null separates "the reduction works" from "the attack works"
      and is the control that prevents the record from over-reading D-1 as D-2.
    - >-
      SECOND NULL (matched, blocking): a DECIDE oracle whose answer is an
      independent fair coin, ignoring the query. The reduction must fail to
      produce a verifying witness at a rate near 1. If it produces verifying
      witnesses against a coin, the harness is verifying against the oracle
      rather than independently, which voids every positive result.
    - >-
      NON-ADAPTIVE CONTROL (blocking, this is the D-3 direction): the same query
      budget with targets fixed in advance. Success must fall to the guessing
      rate.
    - >-
      DECAY PARAMETER: binom(L,m)/N on the ladder {2^-8, 2^-4, 2^-1, 1, 2}. The
      end-to-end success rate must follow 1 - exp(-binom(L,m)/N) and must DECAY
      to zero as the ratio shrinks. A success rate that stays flat as the ratio
      shrinks is the canonical artifact tell and means base and targets are not
      independent.
    - >-
      Hygiene: N prime, factored group order and largest prime factor per curve
      (KN-TECH-030), #E != p (KN-TECH-033), and an independent certificate check
      of every claimed k.
    required_metrics:
    - queries used per round and in total, against the m*L bound
    - independently verified witness-correctness rate
    - end-to-end k-recovery rate against 1 - exp(-binom(L,m)/N)
    - success rate of both nulls and of the non-adaptive control
    - the separately charged exhaustive-search cost of implementing DECIDE, quoted
      beside every query count

  controls:
  - >-
    NULL OBJECT: unknown-log base B' of matched size -- reduction must still
    recover a witness, attack must still fail. Blocking.
  - >-
    SECOND NULL: coin-flip oracle -- must produce no verifying witness. Blocking.
  - >-
    NON-ADAPTIVE CONTROL: fixed targets at matched budget -- must fall to the
    guessing rate. This is the control that carries claim (D).
  - >-
    DECAY LADDER in binom(L,m)/N as the artifact test.

  confounders:
  - >-
    THE ORACLE IS FREE BY ASSUMPTION AND ITS IMPLEMENTATION IS NOT. Every query
    count in this record is a QUERY count. Implementing DECIDE over F_p is the
    campaign's open quantity C (IDEA-20260807-070d03) and the crossover
    inequality is IDEA-20260811-ae0f6f. QUOTING THE QUERY COUNT WITHOUT C IS THE
    CHARACTERISTIC OVERCLAIM OF THIS AREA and this record refuses it: both
    numbers appear side by side in required_metrics for exactly this reason.
  - >-
    KNOWN VERSUS UNKNOWN LOGARITHMS. D-2 needs a KNOWN-log base, which is why one
    relation suffices. With an unknown-log base the adversary needs L+1 relations
    and the accounting changes completely. A reviewer may object that the
    index-calculus setting has an unknown-log base; the honest answer is that
    both settings exist, this record analyses the known-log one, and the
    unknown-log one is strictly harder and is priced in IDEA-20260811-ae0f6f.
  - >-
    ARITY GRADING IS AN ASSUMPTION, NOT A CONVENIENCE. The reduction needs
    arity-(m-r) oracles. Presenting the result as "one fixed oracle suffices"
    would be false; see open question (F).
  - >-
    SMALL-N ARTIFACTS. At p <= 2^20 with m = 3, L is small and binom(L,3)/N is
    coarse-grained, so the ladder rungs may not be attainable exactly. Report the
    ACHIEVED ratio, never the target ratio.
  - >-
    VERIFICATION CIRCULARITY. The witness must be verified by recomputing the sum
    with group operations, NOT by re-querying the oracle. A harness that verifies
    with the oracle proves nothing, and the coin-flip null exists to catch it.

  falsification_conditions:
  - >-
    The no-false-positive step of D-1 fails on paper. The reduction is wrong and
    the record dies at zero compute. INTENDED CHEAP DEATH.
  - >-
    A measured run uses more than m*L queries, or produces an independently
    unverifiable witness. D-1 is false as stated.
  - >-
    (m+1)*L is NOT below 0.886*sqrt(N) at m = 3 for the tested N. The separation
    is vacuous and D-2 is withdrawn.
  - >-
    The non-adaptive control succeeds above the guessing rate. Claim (D) is false
    and the record's identification of adaptivity as the load-bearing feature is
    wrong -- which would be the more interesting outcome and would need
    independent review before any record states it.
  - >-
    The coin-flip null produces verifying witnesses. The harness verifies against
    the oracle; every positive result from it is void, not confirming (AGENTS.md
    rule 5).
  - >-
    The unknown-log null recovers k. The record's accounting of what the known
    logarithms buy is wrong.
  - >-
    A reviewer establishes that KN-FIND-b7e091's Oracle C was intended to include
    the decision form. Then this oracle is already adjudicated and the record's
    separation is a restatement; that is a COORDINATOR adjudication and this
    record does not make it. (IDEA-20260807-7270d1 raised the same reading
    question and recommended the verify-form reading; this record adopts that
    recommendation and inherits its risk.)

  interpretation_limits:
  - >-
    THIS IS NOT AN ATTACK ON ANY CURVE. The oracle is free by assumption. Its
    real implementation over F_p costs C, which is unmeasured, and the record
    makes no claim about C.
  - >-
    The separation is a statement in the generic model with a free oracle. It
    says the DECISION form is not closed by the generic argument; it does NOT say
    the decision form is useful, cheap, or realisable below rho.
  - >-
    KN-FIND-b7e091 is binding and is not revisited; its verify-form incidence
    verdict stands and is the boundary this record's object sits on the far side
    of.
  - >-
    Nothing here concerns phi-stable factor bases, equivariance, or H-STR-002.
    The base B is arbitrary and no structural property of it is used anywhere in
    D-1 or D-2 -- the unknown-log null exists partly to make that visible. NOT
    P2-adjacent.
  - >-
    P3: this record states no cost below the automorphism-discounted rho
    baseline, because its costs are QUERY counts against a free oracle and are
    never compared to rho as attack costs. If a Stage-2 measurement ever produces
    a CHARGED total below the baseline, it must be flagged and stopped rather
    than stated.
  - >-
    Stage-2 measurements are toy scale, m = 3, p <= 2^20, one harness. D-1 and
    D-2 are combinatorial arguments and are scale-independent; the measurements
    are instrument checks on them, not their support.

  assumptions:
  - N prime; G = <P> of order N; Q = [k]P with k uniform.
  - >-
    The adversary may build B itself and therefore may know a_i with
    B_i = [a_i]P. This is what makes one relation sufficient.
  - >-
    b is invertible mod N in R = [a]P + [b]Q, which holds for all but one value
    of b since N is prime.
  - >-
    Repetition is allowed in the decomposition (i_1 <= ... <= i_j). Without
    repetition the peeling step must delete the used index and the counts change
    by O(1) per round, which does not affect any conclusion.
  - >-
    Theorem D-3 is imported from IDEA-20260811-a343de and is not reproved here.
    If that record's E-1 is wrong, D-3 falls and only the (C) direction survives.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      DECOMPOSITION OCCUPANCY. For a base of L elements whose discrete logarithms
      are uniform and independent in Z/N, a uniformly random target admits an
      m-subset decomposition with probability 1 - exp(-binom(L,m)/N); at
      L = ceil((m! N)^{1/m}) this is a constant bounded away from 0 and 1.
    rigorous_ingredient: >-
      Rigorous part: the EXPECTED number of decompositions of a fixed target is
      exactly binom(L,m)/N by linearity of expectation, with no independence
      assumption at all, because for uniform independent a_i each fixed m-subset
      sums to the target with probability exactly 1/N. Only the CONCENTRATION
      around that expectation -- and hence the constant success probability of a
      single query -- needs the heuristic. If HA-1 fails, D-1 is untouched (it is
      a deterministic reduction conditioned on decomposability) and only D-2's
      parameter choice must be redone empirically.
    distribution_imitated: >-
      The classical occupancy / balls-in-bins limit for uniform independent
      placements, the same object the index-calculus literature uses for
      smoothness-analogue counting, and the analogue of Dickman-de Bruijn rho in
      the exemplar profile.
    validation_route: >-
      Direct sampling at toy scale where logarithms are computable: at
      p in {2^16, 2^18, 2^20}, N prime, m = 3, choose L to hit each rung of
      binom(L,m)/N in {2^-8, 2^-4, 2^-1, 1, 2, 8}, measure the fraction of 200
      uniform targets that decompose, and compare the empirical CDF against
      1 - exp(-binom(L,m)/N). TAIL CHECK: the 2^-8 rung, predicted rate about 0.4
      percent, where a systematic EXCESS would indicate dependence between base
      and targets -- which would be prime-field structure the program has not
      identified and would be escalated, not absorbed. SAMPLED PARAMETERS AND
      TRANSFER: p <= 2^20 only, known-log bases from uniform a_i; no transfer to
      cryptographic size is claimed or supported.
  - id: HA-2
    statement: >-
      FIRST-HIT UNIFORMITY. Within a peeling round, the index i of the first base
      element passing the DECIDE test is approximately uniform on [1, L], so the
      expected query count is about m*L/2 rather than m*L.
    rigorous_ingredient: >-
      None; m*L is the RIGOROUS worst-case bound and is what Theorem D-1 asserts.
      HA-2 is used only to predict the measured MEAN, i.e. only for the
      instrument check, and no conclusion depends on it.
    validation_route: >-
      Record the per-round first-hit index over 100 successful runs at each toy
      prime and compare against the uniform distribution by a Kolmogorov-Smirnov
      test. A strong deviation would indicate the base ordering correlates with
      the target, which would be an artifact of the base construction and is
      worth knowing but changes no claim.

  proof_search_map:
    bottleneck: >-
      The no-false-positive step of Theorem D-1: that a 1 answer at
      DECIDE^{(m-r)}(R_{r-1} - B_i) certifies B_i extends to a decomposition,
      so no backtracking is ever needed. Everything else -- the counting, the
      final linear solve, the parameter choice -- is bookkeeping. If
      backtracking were needed the query count could blow up to binom(L,m) and
      the separation would evaporate. Zero compute, and it is the whole risk.
    baseline_embedding:
      parameter_slice: >-
        m = 1. At arity 1 the oracle is exactly the factor-base MEMBERSHIP oracle
        of IDEA-20260807-070d03, the reduction is trivial (one round), and the
        resulting algorithm must degenerate to that record's arity-1 analysis --
        optimum sqrt(N)/2 draws at L = N, i.e. exactly rho with no gain. Second
        slice: m = 2, where L is about sqrt(2N) and the base construction alone
        already costs the birthday bound, so the separation must VANISH.
      reproduction_check: >-
        SYMBOLIC at both slices: substitute m = 1 and check the cost formula
        collapses to IDEA-20260807-070d03's N/(2 sqrt(L)); substitute m = 2 and
        check (m+1)*L exceeds 0.886*sqrt(N). FROZEN FIXTURE: record the exact
        integer (m+1)*ceil((m! N)^{1/m}) against 0.886*sqrt(N) for
        m in {1,...,6} and N in {2^32, 2^160, 2^256} once, and re-check on every
        later use.
    observation_collision:
      observable: >-
        The single bit d_B^{(j)}(h), and the adaptive query sequence it induces.
      distinct_preimage_search: >-
        REQUIRED AND IT SUCCEEDS, AND IT IS THE CONTROL DESIGN. The KNOWN-log
        base and the UNKNOWN-log base produce IDENTICAL observables -- the same
        bits, the same query sequence, the same recovered witness -- and
        completely different conclusions: k falls out in one case and not in the
        other. So the observable does not identify the attack; the separating
        condition is possession of the a_i, and stating that collision is what
        keeps D-1 from being over-read as D-2. A SECOND collision, the other way:
        the coin-flip oracle produces bit sequences statistically similar to the
        real one at binom(L,m)/N about 1/2, while carrying no information; that
        is why witness verification must be independent of the oracle.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Move the decomposition SEARCH problem into the DECISION model, where the
        hypothesis "h is decomposable" is an exact boolean rather than a witness
        set, and discharge the encoding, completeness, soundness and cost-loss
        obligations separately: encoding is the identity on targets; completeness
        is "a decomposable target is found"; soundness is the no-false-positive
        step; cost loss is the factor m*L in queries.
      predicted_gain: >-
        Lowers the minimal known bound-breaking oracle from answer width
        log_2 binom(L,m) about log_2 N to answer width 1, at a cost of m*L
        queries instead of 1. No attack speedup; the gain is a strictly weaker
        oracle at the boundary.
    - transform: boundary_lift
      proposed_object: >-
        Treat the witness-returning decomposition oracle as one end of a family
        indexed by ANSWER WIDTH w in [1, log_2 binom(L,m)], and locate the whole
        family relative to the bound. This record establishes the w = 1 end
        breaks; IDEA-20260811-a343de establishes the total-entropy end cannot.
      predicted_gain: >-
        A one-parameter family in place of two isolated points, with both
        endpoints determined -- which is what a characterisation requires.
    quantifier_order: >-
      D-1: FORALL bases B of size L, FORALL arities m, FORALL targets R with
        DECIDE_B^{(m)}(R) = 1, EXISTS a deterministic algorithm making at most
        m*L queries that outputs a valid witness. The universal over B comes
        FIRST, so no property of B is used and the reduction cannot be an
        artifact of a lucky base -- that ordering is the content, and the
        unknown-log null is its experimental expression.
      D-2: EXISTS a base construction and EXISTS an adversary making at most
        (m+1)*L single-bit queries and O(L) group operations that outputs k with
        probability 1 - exp(-binom(L,m)/N) - o(1). An EXISTENTIAL, and it is
        realised, which is what makes it a separation rather than a hope.
      D-3: FORALL adversaries receiving c = o(log_2 N) bits total on
        non-adaptively chosen targets, success is o(1). A universal, imported
        from IDEA-20260811-a343de.
      NOT CLAIMED: that a one-bit oracle is USEFUL. It is claimed only that the
      GENERIC ARGUMENT does not close it. Reading a failed closure as an attack
      is the inverse error and is guarded against in interpretation_limits.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For prime N, with a free arity-graded single-bit decomposition oracle
        over a base the adversary built, k is recoverable with at most (m+1)*L
        queries and O(L) group operations, L = ceil((m! N)^{1/m}), for every
        m >= 3." It can NEVER certify that such an oracle is implementable below
        rho, that prime-field index calculus works, that fewer than m*L queries
        suffice, or anything about a fixed-arity oracle (open question (F)).
      nearby_object_control: >-
        THE UNKNOWN-LOG BASE is the nearest object on which the desired
        conclusion FAILS while every observable is identical -- the reduction
        still works, the attack does not. The method distinguishes the pair only
        by an ingredient (possession of the a_i) that lives outside the
        observable, which is precisely the honest statement of what the method
        does not see. A SECOND nearby object: the NON-ADAPTIVE oracle, on which
        the conclusion fails for a different reason (entropy, not logarithms),
        included so that a single explanation is not stretched over two distinct
        failure modes.
    proof_obligations:
    - claim: A 1 answer certifies extendability; no backtracking is needed.
      responsibility: correctness
    - claim: The reduction terminates in m rounds using at most m*L queries.
      responsibility: runtime
    - claim: >-
        At L = ceil((m! N)^{1/m}) a uniform target decomposes with constant
        probability.
      responsibility: success_probability
    - claim: >-
        (m+1)*L + O(L) is below 0.886*sqrt(N) exactly for m >= 3.
      responsibility: size
    - claim: The m = 1 slice reproduces IDEA-20260807-070d03's arity-1 analysis.
      responsibility: baseline
    - claim: >-
        The non-adaptive, o(log_2 N)-bit variant cannot break the bound
        (imported from IDEA-20260811-a343de).
      responsibility: scope
    - claim: >-
        Every claimed k is verified by recomputing [k]P independently of the
        oracle.
      responsibility: interface
    - claim: >-
        Query counts are never quoted without the separately charged cost of
        implementing DECIDE.
      responsibility: scope
    not_applicable_reason: null

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. In the FREE-ORACLE query model the D-2
      adversary uses O(m N^{1/m}) queries and O(N^{1/m}) group operations, i.e.
      query exponent 1/m, which is sub-birthday for m >= 3 -- and this is a
      statement about a model with a free oracle, not about any algorithm that
      exists. THE CHARGED EXPONENT IS 1/m + log_N(C) where C is the cost of one
      DECIDE evaluation over F_p, and C is UNMEASURED. Quoting 1/m without C is
      the overclaim this record exists partly to prevent.
    memory_exponent: >-
      O(L) = O(N^{1/m}) labels for the base, plus O(1) working state for the
      reduction (it stores one running target and one index). Below BSGS's
      sqrt(N) and above rho's O(1), so the method is not Pareto-comparable to
      either without C.
    best_known_baseline: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); automorphism-
      discounted on CM curves by a constant at most sqrt(6) (KN-TECH-018), which
      is baseline calibration and never an exponent; BSGS at sqrt(N) time and
      sqrt(N) memory (KN-TECH-031). For the decomposition step itself the
      program's standing results are KN-FIND-f8c290 and the DREG-lane
      measurements.
    hidden_overhead_disclosure: >-
      THREE DISCLOSURES. First and largest, C is hidden entirely by the query
      model and is the whole question. Second, the m*L query count is a
      WORST-CASE bound whose measured mean is about half, and reporting the mean
      as if it were the bound would understate the cost. Third, the base
      construction's L group operations are charged, but the L stored labels'
      memory is a cost the query model does not price and it is stated here
      rather than omitted.
    time_memory_tradeoff: >-
      The method sits at (query N^{1/m}, group-operation N^{1/m}, memory
      N^{1/m}), a single point rather than a curve, because the base size is
      pinned by the decomposition probability. Lowering L raises the number of
      targets needed as N/binom(L,m), which is the tradeoff priced in
      IDEA-20260811-ae0f6f. Parallelisation: the base construction and the
      per-round scan over i in [1, L] are both embarrassingly parallel; the m
      rounds are strictly sequential, so the depth is m even with unbounded
      width, which is worth stating because it is the one place this method is
      structurally better than rho's long walks.

  sota_delta: >-
    ZERO against every attack baseline: 0 time, 0 memory, 0 queries, 0 data. No
    attack is mounted and none is claimed. QUANTITATIVE CONTENT: the minimal
    known bound-breaking oracle's ANSWER WIDTH drops from log_2 binom(L,m), which
    is about log_2 N, to exactly 1 bit -- a factor log_2 N reduction in answer
    width -- at a cost of a factor m*L increase in query count, from 1 to
    (m+1)*ceil((m! N)^{1/m}). Both numbers are exact and both are stated because
    the trade is the result. Against the campaign's state of knowledge: it shows
    the verdict on the campaign's one non-closed oracle does not depend on the
    existential width Z that IDEA-20260807-7270d1 identified as carrying it.
  dominated_by: >-
    AS AN ATTACK: dominated by every row of the prime-field frontier, checked
    individually, because it is not an attack -- its oracle is free by
    assumption. Parallel Pollard rho with distinguished points at 0.886*sqrt(N)
    group operations and O(1) memory (KN-TECH-001, KN-TECH-006) dominates on time
    and memory once C is charged at any value above N^{1/2 - 1/m}; the
    automorphism-discounted variant (KN-TECH-018) dominates by a further constant
    at most sqrt(6); BSGS (KN-TECH-031) at sqrt(N) time and sqrt(N) memory
    dominates on time. In the FREE-ORACLE query model alone the method is
    dominated by nothing, and saying so without immediately restating that the
    model is free would be dishonest, which is why both sentences are here.
    `null` is not available.
    AS A SEPARATION RESULT: the incumbent is IDEA-20260807-7270d1's witness-form
    (D) attack, which dominates this on query count (1 versus m*L) and is
    dominated by this on answer width (log_2 N bits versus 1 bit). Neither
    dominates the other in the Pareto sense across (queries, answer width), and
    that is exactly why both are worth having.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.85 that D-1 is correct -- it is a short deterministic argument and the
    no-false-positive step is the only joint, but it is a real joint and I have
    seen search-to-decision reductions fail exactly there. 0.9 that D-2's
    arithmetic holds at m >= 3. 0.7 that a reviewer agrees the decision form is a
    genuinely new oracle class rather than a variant of the search form already
    filed by IDEA-20260807-7270d1 -- that is the record's main novelty risk and I
    rate it honestly rather than optimistically. 0.15 that open question (F)
    resolves affirmatively (one fixed-arity oracle suffices). 0.01 that anything
    here contributes to an exponent, because the oracle is free by assumption.
    MEDIUM priority rather than high: the information gain is real but the record
    changes no lane's work plan on its own, and its main consequence is to
    sharpen a boundary that IDEA-20260811-a343de locates more decisively.

  novelty_status: adaptation
  novelty_screen: >-
    PERFORMED 2026-08-11 against ledger/proposals/ (146 committed records) with
    the harness Grep tool. (1) `^  question_id: RQ-GGMB-6eaabc` -> 9 lane
    records; IDEA-20260807-070d03 and IDEA-20260807-7270d1 read in full, the
    other seven inspected by title and claim head. (2) `search-to-decision|search
    to decision|decision-to-search` case-insensitive over ledger/proposals/ ->
    no record uses the term as a technique; the 73 files returned by the broader
    pattern match on `entropy` and `information-theoretic` only, and were
    screened as recorded in IDEA-20260811-a343de's novelty_screen. (3) The
    decomposition oracle appears in the corpus ONLY in its witness-returning
    form: IDEA-20260807-7270d1 defines INC_search returning m indices,
    IDEA-20260807-070d03 defines the arity-m decomposition oracle as "RETURN m
    factor-base elements summing to it", and KN-FIND-b7e091's Oracle C is the
    verify form. NO record defines or adjudicates a witness-free decision form,
    and no record contains a reduction from one to the other. (4) The verify /
    search distinction is IDEA-20260807-7270d1's; the DECIDE form is a third
    point between them and is credited as such rather than presented as
    displacing it.
    EXTERNAL NOVELTY IS NOT ESTABLISHED: WebSearch and WebFetch both failed this
    session with a backend model error. Search-to-decision self-reducibility is a
    textbook technique and is NOT claimed as new; the claim is the consequence
    for this lane's oracle lattice. novelty_status: `adaptation`.
  discriminated_from: >-
    IDEA-20260807-7270d1 is the nearest record and the difference is the object,
    not the framing. -7270d1's INC_search RETURNS m indices, has existential
    width Z = binom(L,m), and its verdict is carried BY that width -- the record
    concludes the closure is vacuous because Z is about N. This record's oracle
    returns NO indices and has answer width 1, so Z-based grading assigns it
    Z = 2 and would predict it CLOSED at q*Z = o(N) for q = m*L = o(N/2); the
    reduction shows it is NOT closed. That is a direct, checkable disagreement
    between the two records' criteria on a concrete oracle, and resolving it is
    exactly the kind of thing the lane exists for: the resolution is that
    -7270d1's Z bounds the FORMAL simulator's error and says nothing about an
    adversary that queries adaptively many times, which is the same
    incomparability IDEA-20260811-a343de states from the entropy side. This
    record therefore SHARPENS -7270d1 rather than repeating it, and flags the
    disagreement rather than hiding it.
    IDEA-20260807-070d03 analyses the arity-1 MEMBERSHIP oracle and the arity-m
    DECOMPOSITION oracle in the cost model, and its arity-1 analysis is used here
    as the m = 1 baseline slice that this record's cost formula must reproduce.
    It does not contain a search-to-decision reduction and does not consider a
    witness-free oracle.
    IDEA-20260807-5876b8's cell taxonomy places the decision oracle in cell (c)
    (not self-computable, realisable at cost C), the same cell as the search
    form; this record does not move the cell, it moves the object WITHIN the cell
    to a strictly weaker point, which the cell taxonomy does not resolve.
    IDEA-20260807-413fcc's zero-information class covers oracles taking no group
    handle; DECIDE takes a group handle as its target and is outside it.
    IDEA-20260811-a343de (this batch) supplies Theorem D-3 and is cited, not
    duplicated: that record proves the floor, this one probes the lattice above
    it. IDEA-20260811-ae0f6f (this batch) prices C and is the record that decides
    whether any of this matters. KN-FIND-b7e091 is binding and is not revisited.
