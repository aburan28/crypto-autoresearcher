idea:
  id: IDEA-20260905-dacf4f
  added: '2026-09-05'
  recorded_at: '2026-09-05'
  title: >-
    ONE p-ADIC INSTRUMENT FOR FIVE WAITING RECORDS: the ledger holds cost models of
    the anomalous attack but no implementation of Hensel lifting, the Teichmuller
    lift, the torsion section, the formal logarithm or the [p]-into-the-formal-group
    step, and five records' minimal tests (ECDLP-IDEA-436, the two August 7
    canonical-lift closures' constructive steps, the prime-to-p jet lane's positive
    control, and the Fermat-quotient digit census) all wait on the same never-built
    module -- build it once in pure Python with five blocking self-checks, the
    anomalous recovery certified by [m]P = Q among them
  class: tooling
  question_id: RQ-ECDLP-c1b7b1
  question_ids: [RQ-ECDLP-c1b7b1, RQ-CANL-63098f, RQ-ECDLP-4fcbd3]
  goal_ids: [GOAL-ECDLP-001, GOAL-CRYPTO-001]
  goal_applicability:
    GOAL-ECDLP-001: >-
      Removes the shared infrastructure blocker of the whole local-lifting lane;
      every F1/F2 record that names a torsion section, a defect, a formal
      logarithm or an anomalous control currently has no code to run.
    GOAL-CRYPTO-001: >-
      Gives the program a certified reproduction of the one lifting attack that
      works, as a calibration object rather than a result.
  status: proposed
  proposed_by: claude-code-session
  claim: >-
    (A) THE GAP. harness/toycurve.py provides exact F_p arithmetic and point
    counting only. The only anomalous-attack code in the tree is a COST MODEL
    (experiments/EXP-IT-001/implementation/it001_pure.py, C_special_anomalous) and
    a family LABEL (experiments/EXP-FALSIFY-d770c1/falsify/run_families.py); no
    file implements a Hensel lift of points, the Teichmuller lift, the unique
    homomorphic section, the formal parameter t = -x/y on E_1, the formal
    logarithm, or the Smart / Satoh-Araki / Semaev recovery. Records that need
    exactly this: ECDLP-IDEA-436 (profile evaluation on the torsion lift),
    IDEA-20260807-cfe576 Steps 3-4 (torsion-section homomorphism check, defect
    non-additivity), IDEA-20260807-dbb250 Steps 2-3 (p-adic height vanishing with
    anomalous control), ECDLP-IDEA-004's positive control, and
    IDEA-20260905-3a30d5 (this batch). None has run; each would rebuild the same
    module.
    (B) THE DELIVERABLE. A pure-Python module under harness/ (name chosen by the
    executor) exposing: lift_point(E, R, k) (Hensel lift to Z/p^k with the naive
    curve lift, plus an optional curve perturbation by p), teichmuller_lift(E, R,
    k), scalar multiplication in E^(Z/p^k) with affine formulas away from E_1 and a
    (t, w)-chart end step into E_1, formal_parameter(P) for P in E_1, formal_log
    and formal_exp to precision k <= 4 (truncated series with the p-adic
    valuation of each term checked), torsion_section(E, R, k) = lift minus
    [n]^(-1)[n] lift, defect(E, R, k) = formal_log(teichmuller_lift - torsion
    section), and anomalous_log(E, P, Q) returning m with a certificate. Every
    function records the precision it used.
    (C) FIVE BLOCKING SELF-CHECKS, each of which can fail. (1) torsion_section is a
    homomorphism on 10^4 random pairs and exhaustively at 10 bits (P1543 / cfe576
    Step 3). (2) The naive section's defect is non-additive: exhibit pairs with
    u(R1 + R2) != u(R1) + u(R2), at a rate near 1 (cfe576 Step 4). (3) Precision
    consistency: every output at precision k + 1, truncated, equals the output at
    precision k, for k = 2, 3. (4) The first-order identity x(P + X) - x(P) =
    2y(P) formal_log(X) mod p^2 on random pairs (P, X). (5) anomalous_log recovers
    the scalar on 20 anomalous toy curves at 10 to 16 bits with the certificate
    [m]P = Q, and refuses (raises) on a non-anomalous curve at the [n]^(-1) step
    when n = p, which is the correct break point of IDEA-20260905-848b77.
    (D) WHAT A FAILURE MEANS. Checks (1), (2) and (4) test theorems already
    recorded (P1543-R0/R1, standard formal-group facts). A persistent failure
    after debugging is an implementation defect, never a mathematical finding;
    the record says so up front so that no one reads a broken instrument as a
    counterexample.
  mechanism: >-
    A tooling record has no mechanism to defend; its content is the shared
    dependency graph in (A) and the acceptance tests in (C). The design choice
    worth stating is the (t, w)-chart end step: multiples [j] s(R) for j < n never
    lie in E_1, so affine arithmetic mod p^(k+2) is safe, and only the last
    addition (a point and its reduction-negative) enters E_1, where the formal
    parameter t = -x/y of the sum is read off at precision k from the addition
    formula with the valuations tracked explicitly. This avoids projective
    coordinates and keeps every step auditable at toy scale.
  novelty_status: unverified
  novelty_screen:
    method: >-
      grep -rli over harness/, src/, experiments/ for hensel, teichm, formal
      group, p-adic, anomalous, smart, satoh; only cost models and labels were
      found. Not a novelty claim of any kind; a tooling gap statement.
    nearest_internal_record: experiments/EXP-IT-001/implementation/it001_pure.py
    precise_difference: >-
      That file models the anomalous attack's cost as one group-operation
      equivalent per p-adic digit; it does not perform the attack or any p-adic
      arithmetic.
    scope: No novelty claim.
