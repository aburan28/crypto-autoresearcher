    minimum_effect: '0.001 - the share must be AT OR BELOW 1e-3, because real ML-DSA-44 sits at 7.34e-9 per signature and ML-DSA-65/-87 sit at exactly 0 (IDEA-20260805-bb52fa). A share at or above 0.05 means the surrogate has been tuned into a regime no approved parameter set occupies.'
