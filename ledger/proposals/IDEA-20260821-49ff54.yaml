  minimal_test:
    design: >-
      One reduced parameter set, six arms, one invocation, no ladder in the minimal version. Choose
      n = 64, (k, l) = (2, 2), a small NTT-friendly q, d and gamma2 chosen so that tau*2^(d-1) <
      gamma2 (the ct0 gate DEAD, as at ML-DSA-65/-87) and omega chosen so the wt(h) gate fires at a
      measurable rate, with beta = tau*eta held exactly. Generate K = 512 keys; per key, Q_S = 2000
      signatures on a single fixed message in hedged mode, 2000 on a single fixed message in
      deterministic mode, and 2000 on distinct messages in deterministic mode. Record T and the
      per-gate abort counts. Compute the bias-corrected mutual information per arm, then the
      NORM-GATES-ONLY arm, then 8 label permutations, then the structural null. Report six numbers
      with intervals. THIS DISCRIMINATES because the NORM-GATES-ONLY arm's true value is derived to
      be exactly zero, so it pins the instrument; because the permutation floor pins the estimator;
      because the per-gate shares show whether the surrogate's gate mix resembles ML-DSA's; and
      because the hedged-versus-deterministic ratio at m = 1 is the quantity the standard guidance's
      unconditional sentence implicitly sets to at most 1. Cost: order of one CPU-hour in a compiled
      inner loop, more in pure Python.
    controls:
    - 'NORM-GATES-ONLY derived-zero arm (ct0 and wt(h) gates disabled); true value exactly zero by the stage-0 algebra.'
    - 'Label-permutation null, >= 8 independent draws, reported as an interval not a point.'
    - 'Structural key-independent geometric null matched to the measured per-gate rates.'
    - 'Deterministic m = 1 arm, whose distinct-sample count is exactly 1 per key by construction.'
    - 't0-inflation sensitivity ladder at g = 1, 1.5, 2, 3 with a monotonicity verdict reported; the driven gate is wt(h).'
    - 'Pre-registration of G, the alphabet, the estimator and every threshold, with the design document predating data generation.'
    - 'A FIPS-FIDELITY arm that verifies, at the reduced parameters, both beta = tau*eta and tau*2^(d-1) < gamma2 - i.e. that the surrogate reproduces the ct0-dead regime of ML-DSA-65/-87 rather than an invented ct0-active one.'
    - 'A separately reported CT0-INFLATED arm reusing EXP-MLDSA-462ea2''s synthetic reachable cell, never merged into the headline.'
    required_metrics:
    - 'bias-corrected I(G ; T-vector) per arm, with confidence interval'
    - 'permutation-null interval over >= 8 draws'
    - 'structural-null interval'
    - 'NORM-GATES-ONLY arm value and its distance from the null floor'
    - 'per-gate abort shares, with the ct0 share and the wt(h) share reported separately'
    - 'I(G ; 1{T > 0}) and the ratio to the count-based value'
    - 'hedged/deterministic accumulated-bits ratio at m = 1 and at m = Q_S'
    - 'distinct-sample counts actually achieved per arm'
    - 'monotonicity verdict across the g-ladder'
    - 'the surrogate''s tau*2^(d-1) versus gamma2, reported as an integer comparison beside the FIPS values'
  falsification_conditions:
  - 'STAGE 0 falsifier, before any compute: if the fixed-width argument goes through for the wt(h) > omega gate at the reduced parameters, then after claim (C) no gate carries the key, the channel is empty by algebra, and the proposal is withdrawn.'
