      every existing RQ-MLDSA-001 proposal, docs/inventor-protocol.md,
      docs/target-result-profile.md, knowledge/techniques/KN-TECH-1a5b7e.md, and the worked
      exemplar IDEA-20260816-b336a3. WEB, 8 searches and 8 fetches this session; the ones
      bearing on this record: search "Dilithium rejection sampling repetition count timing
      side channel leakage secret key"; search '"number of repetitions" OR "rejection rate"
      Dilithium leaks secret key norm per-key acceptance probability distribution'; search
      "Dilithium hint vector h leakage t0 low-order bits signature MakeHint UseHint attack";
      search '"Uncompressing Dilithium''s Public Key" CRYPTO 2025 recover t0 from signatures
      hints abstract'. FETCHED AND READ: https://eprint.iacr.org/2025/214 (abstract and
      attacker model), https://eprint.iacr.org/2024/1373 (abstract verbatim),
      https://eprint.iacr.org/2024/1660 (abstract verbatim),
      https://www.ietf.org/archive/id/draft-connolly-cfrg-ml-dsa-security-considerations-02.html
      (Sections 2.2.1, 3.2.1 quoted), https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.204.ipd.pdf
      (parameter table). FETCH FAILURES, recorded because they bound the screen:
      https://eprint.iacr.org/2024/1660.pdf and https://eprint.iacr.org/2024/2046.pdf both
      returned binary PDF the fetch tool could not render.
    results: >-
      The nearest external prior art is ePrint 2025/214 (Zhou, Wang, Sun, Yu, "Rejected
      Signatures' Challenges Pose New Challenges"), which does attack the rejection-sampling
      procedure, but its observable is the rejected signature's CHALLENGE AND RESPONSE
      recovered by single-trace NTT leakage on Cortex-M4, and it reports 100% key recovery
      in seconds to minutes at Dilithium-2/3/5. That is a strictly richer observable than one
      integer per signature and a strictly stronger adversary; it does not measure the
      information content of the restart count, and it does not compare hedged against
      deterministic mode. ePrint 2024/1373 (Azevedo Oliveira, Calle Viera, Cogliati, Goubin,
      CRYPTO 2025) recovers t0 from 200,000-500,000 ordinary signatures with no side channel
      at all - the same secret this proposal's channel points at, via a completely different
      and much richer observable (the signature bytes). It therefore DOMINATES this proposal
      on the t0-recovery axis and is recorded as such below. What neither addresses, and what
      no repository record addresses, is (a) the per-gate decomposition of which rejection
      conditions can carry key information at all, with the fixed-width derivation making two
      of them exactly zero, and (b) the hedged-versus-deterministic sample-count inversion for
      a repeated-message observer. Inside the repository: none of the seven existing
      RQ-MLDSA-001 proposals tracks the abort count, the trial count, or the mode distinction;
      IDEA-20260805-818196 mentions hedged mode only in classifying the Jendral glitch attack's
      injection site.
    verdict: >-
      UNVERIFIED. Novelty relative to the corpus is checked and clean; novelty relative to the
      full external literature is NOT established - four searches and five successful fetches
      are a screen, not a survey, and two relevant PDFs could not be rendered. Claimed NEW here:
      the per-gate fixed-width derivation applied to the TRIAL COUNT rather than the accepted
      output, and the repeated-message hedged/deterministic sample-count inversion.
      ASSEMBLED FROM KNOWN PARTS: the rejection-sampling fixed-width argument is Lyubashevsky's
      and is standard; Miller-Madow correction, permutation nulls and structural nulls are
      estimator hygiene from KN-TECH-1a5b7e; the estimator design is directly downstream of
      IDEA-20260816-b336a3 in the HQC lane and this record does not claim that method as its own.
  object_first_candidate:
    tracked_object: >-
      The restart count T of the FIPS 204 signing loop, decomposed by which of the four
      rejection conditions fired, followed from the sampling of (s1, s2, t0) at key
      generation through each signing iteration to the observable latency. What is tracked
      is the divergence, in bits, of the posterior over a declared t0 functional G given the
      observed T-sequence, from its prior.
    lossiness: >-
      LOSSY THREE TIMES OVER, deliberately, and each discard is compatible with the
      operation that follows it. First, the whole signing state (y, w, c, z, r0, h) of an
      aborted iteration is projected to a single bit "accepted or not" - everything the
      published single-trace attacks consume is thrown away. Second, the sequence of those
      bits is projected to its length T. Third, the key is projected onto G, a coarsened
      per-polynomial ||t0||_2 profile over a four-symbol alphabet, discarding position and
      sign information entirely. Mutual information is monotone under all three
      projections, so the measured value is a LOWER bound on I(sk ; full transcript) and an
      upper bound on nothing - the honest direction, and it is exactly why a small value is
      informative about the CHANNEL and not about the scheme. Critically, the projection to
      T is not a change of coordinates: from T alone the aborted iterations are
      unrecoverable, and the fixed-width derivation shows that two of the four gates
      contribute nothing to T at all, so the retained part is strictly smaller than the
      state.
    propagation: >-
      One signing iteration is one step, and it writes exactly one increment of T. The
      propagation law of interest is the per-iteration acceptance probability p(sk) =
      p_z * p_r0 * p_ct0(t0) * p_h(t0, s2), which factorises because the gates are evaluated
      in sequence on the same iteration. Stage 0 derives p_z and p_r0 to be constants of the
      parameter set. The measurement decomposes the total information into per-gate terms
      plus a residual, and reports both: if the total equals the sum of the two t0-gate terms
      within error, the decomposition is confirmed; if the z-gate term is non-zero, the
      stage-0 algebra is wrong and that, not the bit count, is the finding.
    survival_score: >-
      One iteration, then a hard collapse. Key information enters T only through the two t0
      gates of a single iteration and then survives only as an increment to an integer. The
      proposal reports the ratio I(G ; T-vector) / I(G ; 1{T > 0}) at the executed
      parameters, a concrete number expressing how much is lost by observing only "did it
      restart at all". A ratio near 1 means the count adds nothing beyond the restart
      indicator and the object dissolves immediately; a ratio well above 1 means it survives
      the step meaningfully. Either value is the deliverable.
  null_object_control: >-
    FOUR controls, all on the identical estimator code path and all in the same invocation
    as the signal arm. NULL-A, DERIVED-ZERO ARM (this is the load-bearing one and it can
    fail): run with the two t0 gates disabled, so that by the stage-0 fixed-width derivation
    the true mutual information is EXACTLY zero for every key. If this arm returns a value
    above the permutation floor, either the derivation or the implementation is wrong and
    NO signal-arm number is reportable. NULL-B, LABEL PERMUTATION: recompute after
    permuting which key produced which T-vector, preserving both marginals; its true value
    is zero by construction, so it is the estimator's bias-plus-noise floor at this sample
    size, drawn at least 8 times so that it is reported as an interval and not a point
    (KN-TECH-1a5b7e mode 5). NULL-C, STRUCTURAL: generate T from a key-independent geometric
    process matched to the measured per-gate rates; it must agree with NULL-B within
    intervals, or the estimator responds to something other than key dependence.
    SENSITIVITY DEMONSTRATION, declared with a numeric threshold before the run: an
    artificially inflated-t0 family, in which t0 coefficients are scaled by a factor g, must
    show the estimate rising monotonically over at least three interior values of g (g = 1,
    1.5, 2, 3), because the c*t0 gate's firing rate is monotone in ||t0||. Two endpoints are
    not a direction; three interior points and a reported monotonicity verdict are required,
    and a non-monotone statistic forfeits any directional reading of the headline.
  discriminated_from:
  - >-
    ePrint 2025/214 (Zhou et al.) attacks rejection sampling using single-trace NTT leakage
    of the REJECTED challenge and response and achieves full key recovery. This record
    consumes one integer per ACCEPTED signature and claims no recovery of anything. If the
    measured bit rate here is tiny and 2025/214's attack succeeds, that is consistent and
    informative: it localises the value in the trace content rather than in the count.
  - >-
    ePrint 2024/1373 recovers t0 from the signature bytes of 200k-500k ordinary signatures.
    Same secret, richer observable, and a working attack; this is the dominating result on
    that axis and is recorded in dominated_by. The question here is what the COUNT alone is
    worth and whether the two modes differ - neither of which 2024/1373 asks.
  - >-
    IDEA-20260805-818196 (fault-proof boundary as the rank of an affine constraint system)
    concerns what a FAULTING adversary forces; this record's adversary injects nothing and
    observes only latency.
  - >-
    IDEA-20260808-5a748c prices t0 as a core-SVP gap between the t1-only and full-t MLWE
    instances. That is the VALUE of t0 in bits; this record measures a RATE at which one
    coarse channel emits information about it. Neither implies the other, and the two
    compose only through IDEA-20260821-4d4e5f's ledger.
  - >-
    IDEA-20260816-b336a3 (HQC lane) counts bits per observed decoding failure. Same
    estimator discipline, different scheme, different object, different lane; this record
    cites it as method provenance rather than claiming the method.
  - >-
    IDEA-20260805-031ce2 (RQ-MLDSA-ffa0f5) shares this record's underlying object: the same
    four FIPS 204 Algorithm 7 rejection predicates, classified predicate-by-predicate into a
    table as the primary deliverable, with ||c t0||_inf >= gamma2 singled out as the special
    gate and the same envelope tau*2^(d-1) = 159744 < 2*gamma2 = 190464 at ML-DSA-44 carried
    in both. The two censuses CROSS-CUT and are not the same partition: 031ce2 sorts by
    verifier-observability and consequence-of-omission ({z, wt(h)} verifier-enforced, {r0}
    self-enforcing, {c t0} unobservable), while this record sorts by key-dependence of the
    per-iteration ACCEPTANCE PROBABILITY ({z, r0} exactly key-independent by the fixed-width
    argument, {c t0, wt(h)} not) - so r0 and wt(h) fall on opposite sides of each other in the
    two records. The discriminating tests are disjoint: 031ce2 observes whether a signature
    emitted by a signer that OMITS a predicate still verifies, via 10^5 (r, s) hint-fibre
    samples and 500 emissions per variant against an independently written verifier, against
    the forced value 0.991; this record observes the restart count T of a fully CONFORMING
    signer and measures bias-corrected I(G(t0) ; T-vector) against a permutation floor and a
    derived-zero arm. Neither quantity is recoverable from the other, and 031ce2 carries no
    hedged/deterministic contrast at all. WHAT THIS RECORD OWES IT: 031ce2 mechanism (5)
    derives the c t0 gate's firing rate as 7.34e-9 per signature at ML-DSA-44 and EXACTLY 0 at
    -65 and -87, which bears directly on this record's prediction that the two t0 gates carry
    >= 5 per cent of abort events - a share reachable only under the reduced parameters this
    record already declares as an undischarged transfer assumption.
