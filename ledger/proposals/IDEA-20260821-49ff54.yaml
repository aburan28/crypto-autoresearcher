    results: >-
      THE FIRST SCREEN'S HEADLINE WAS WRONG AND IS WITHDRAWN. Two committed RQ-MLDSA-ffa0f5
      records own material this proposal previously presented as its own. (1) IDEA-20260808-4f83f6
      partitions the same four Algorithm 7 rejections into public and secret ones, identifies the
