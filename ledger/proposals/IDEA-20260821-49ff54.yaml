      w - c s2 = A z - c t that this record's earlier "fixed-width" reasoning only approximated,
      names "measure the bias" as its deliverable, and carries a t0-resampled-independently-of-the-key
      null. Its OBSERVABLE, however, is the accepted CHALLENGE law read off public signature bytes;
      this record's observable is the restart count read off latency, and 4f83f6 has no
