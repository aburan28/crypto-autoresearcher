idea:
  id: IDEA-20260821-49ff54
  question_id: RQ-MLDSA-001
  added: '2026-08-21'
  title: >-
    THE HINT-WEIGHT GATE IS THE ONLY LIVE KEY-DEPENDENT ABORT GATE IN ML-DSA. The ||c t0||_inf
    >= gamma2 disjunct is DEAD CODE at ML-DSA-65 and ML-DSA-87 (49*4096 = 200704 < 261888 and
    60*4096 = 245760 < 261888) and fires at 7.34e-9 per signature at ML-DSA-44, so at every
    approved parameter set the abort COUNT can carry secret information through wt(h) > omega
    and essentially nowhere else. Measure the bit rate of that single-gate count channel, and
    measure it separately in hedged and deterministic mode, where the prediction runs OPPOSITE
    to the standard guidance - against a repeated-message observer, hedged mode delivers Q_S
    independent draws of a per-key statistic where deterministic mode delivers at most one per
    distinct message.
  class: control
  claim: >-
    (A) THE OBSERVABLE. The tracked observable is a single non-negative integer per produced
    signature: T, the number of times the signing loop restarted. It is not a signature byte,
    not a power trace and not a fault; it is what a passive observer of signing LATENCY on a
    device with data-independent per-iteration cost can read, and it is strictly coarser than
    anything any published ML-DSA side-channel attack consumes.
    (B) THE PARTITION, WHICH THIS RECORD DOES NOT CLAIM AND MUST CITE. FIPS 204 signing
    restarts on the disjunction of four conditions. IDEA-20260808-4f83f6 (RQ-MLDSA-ffa0f5)
    already establishes the correct exact argument for the second of them: w - c s2 =
    A(z - c s1) - c s2 = A z - c t, so ||LowBits(w - c s2)||_inf >= gamma2 - beta is a PUBLIC
    predicate of (z, c, pk), and 4f83f6 also identifies ||c t0||_inf >= gamma2 and wt(h) > omega
    as the two that are not public. THAT PARTITION IS 4f83f6's RESULT, NOT THIS RECORD'S. What
    this record adds is (C) below, which changes which of the two survives, and (D), which is
    a different observable from 4f83f6's entirely: 4f83f6 measures the accepted CHALLENGE law
    from public signature bytes; this record measures the RESTART COUNT from latency.
    (C) THE ARITHMETIC THAT LEAVES ONE GATE STANDING, AND IT IS ALSO NOT THIS RECORD'S.
    IDEA-20260805-bb52fa (RQ-MLDSA-ffa0f5, committed) proves ||c t0||_inf <= tau * 2^(d-1)
    exactly and evaluates it on FIPS 204 Table 1: 39*4096 = 159744 against gamma2 = (q-1)/88 =
    95232 at ML-DSA-44 (REACHABLE); 49*4096 = 200704 against gamma2 = (q-1)/32 = 261888 at
    ML-DSA-65 (UNREACHABLE, slack 61184); 60*4096 = 245760 against 261888 at ML-DSA-87
    (UNREACHABLE, slack 16128). The ct0 disjunct therefore CANNOT FIRE at two of the three
    approved parameter sets, and at ML-DSA-44 bb52fa's tail computation puts it at 7.34e-9 per
    signature - one signature in 1.36e8 - conditional on that record's named heuristic on t0.
    CONSEQUENCE, AND IT IS THE CORRECTED PREMISE OF THIS RECORD: the abort-count channel is
    SINGLE-GATE at all three approved parameter sets. Whatever key information T carries at
    ML-DSA-65 or ML-DSA-87 must come through wt(h) > omega, and at ML-DSA-44 the ct0
    contribution is smaller than the wt(h) contribution by however many orders of magnitude the
    measurement reports, with 7.34e-9 as its ceiling. An earlier version of this record asserted
    the opposite - that both t0 gates carry the channel at all three sets - and that assertion
    was false by two integer multiplications; the correction is recorded here rather than hidden,
    and it MAKES THE RECORD SHARPER, because a single-gate channel has one mechanism to test
    rather than a disjunction of two.
    (D) THE HEDGED / DETERMINISTIC CONTRAST, AND WHY ITS DIRECTION IS THE INTERESTING PART. In
    deterministic mode rnd is all-zero, so T is a deterministic function T(sk, M); an observer
    confined to a message set of size m can collect at most m distinct values however many
    signatures it sees. In hedged mode T is redrawn per signature, so Q_S signatures on the SAME
    message give Q_S independent draws from the per-key law. CLAIM: for an observer with
    m << Q_S, the accumulated information about the declared key functional is bounded by a
    constant in deterministic mode and grows with Q_S in hedged mode, so the retrieved, quoted
    guidance "There is no reason to prefer deterministic signing over hedged signing; hedged
    signing is the safer default in all environments"
    (draft-connolly-cfrg-ml-dsa-security-considerations-02, Section 2.2.1) is unconditional
    where a scoped statement is what the evidence supports.
    (E) WHAT IS NOT CLAIMED. No attack, no key recovery, no forgery, no break of MLWE, MSIS or
    SelfTargetMSIS, and no claim about FIPS 204 parameters - the measurement runs at reduced
    parameters only. A positive mutual information is an information-theoretic upper bound on
    what any procedure could extract; it names no procedure and no query count. A NEAR-ZERO
    RESULT IS THE OUTCOME THE DESIGN IS BUILT TO REPORT HONESTLY and is a measured upper bound
    on the abort-count channel, which converts an argued folk claim ("the restart count leaks
    only statistical information") into a number with an error bar. Deterministic mode is NOT
    recommended by this record under any outcome: it is already documented as fault-vulnerable,
    and this proposal measures one channel, not a net.
  mechanism: >-
    STAGE 0, ALGEBRA BEFORE COMPUTE, AND IT IS NOW A GATE WITH TWO WAYS TO FIRE. (i) Re-evaluate
    bb52fa's envelope tau*2^(d-1) against gamma2 at the surrogate parameters and record which
    of the four gates can fire at all there; a surrogate in which the ct0 gate is ACTIVE at a
    non-negligible rate is a surrogate unlike every approved ML-DSA parameter set, and that is
    recorded as a fidelity defect rather than as a feature. (ii) For the two norm gates, settle
    whether their PER-KEY FIRING RATE is a constant of the parameter set. For ||z||_inf this is
    the standard fixed-width rejection-sampling argument: the acceptance interval has width
    2(gamma1-beta)-1 and lies inside the shifted support because beta = tau*eta bounds
    ||c s1||_inf. For the r0 gate the exact statement available in this program is 4f83f6's
    identity, which shows the predicate is a PUBLIC function of (z, c, pk) - that makes
    conditioning on it non-leaking given c, but it does NOT by itself force the per-key rate to
    be constant, and this record does not pretend otherwise. Stage 0 must either produce the
    fixed-width derivation for r0 or record that it does not go through, and the second outcome
    is a first-class finding that changes which arm is the derived-zero null.
    STAGE 1, INSTRUMENT. Implement a reduced-parameter ML-DSA with all four gates individually
    switchable, emitting (key id, message id, mode, T, per-gate abort counts) per signature.
    Declare, before data exists, a low-dimensional key functional G - the coarsened
    per-polynomial ||t0||_2 profile over a four-symbol alphabet, reported jointly with the same
    coarsening of ||s2||_2 because the hint depends on both through w - <<c s2>> + <<c t0>> -
    and the Miller-Madow-corrected plug-in mutual-information estimator, with its bias computed
    as a function of alphabet size and sample count.
    STAGE 2, ARMS. (i) HEDGED, m = 1: one fixed message, Q_S signatures per key, K keys.
    (ii) DETERMINISTIC, m = 1: same, where T is constant per key by construction - a
    derived-value check, since its per-key sample count is exactly 1 regardless of Q_S.
    (iii) DETERMINISTIC, m = Q_S: distinct messages, the fair comparison at equal
    distinct-observation count. (iv) NORM-GATES-ONLY derived-zero control, with the ct0 gate and
    the wt(h) gate both disabled: its true information is zero by the stage-0 derivation, so it
    is a null that CAN fail and whose failure voids the instrument. (v) LABEL-PERMUTATION null on
    the identical estimator. (vi) KEY-INDEPENDENT BERNOULLI null matched to the measured per-gate
    rates. (vii) CT0-INFLATED FIDELITY ARM, run separately and never merged with the headline:
    the ct0 gate forced active in the manner EXP-MLDSA-462ea2 already specifies for its synthetic
    reachable cell (real tau and d with gamma2 lowered below the tau*2^(d-1) envelope), reported
    only as the answer to "how much would the channel change if ML-DSA had an active ct0 gate,
    which it does not".
    STAGE 3, READOUT. Report bits per observed signature for each arm with intervals; the
    permutation null pins the estimator floor; nulls (v) and (vi) must agree with each other or
    nothing is reportable; arm (iv) must sit on the floor. Report the per-gate abort shares
    alongside every bit rate, so a reader can see at a glance whether the surrogate's gate mix
    resembles ML-DSA's.
    STAGE 4, LADDER in Q_S and in K, with convergence a precondition for reporting any value.
  novelty_status: unverified
  novelty_screen:
    method: >-
      RE-SCREENED 2026-08-21 after a red-team finding that the first screen read proposal TITLES
      and a FILE COUNT of hypotheses and never opened the sibling ML-DSA question. The crypto-kb
