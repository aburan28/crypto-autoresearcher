    minimum_effect: '0.0 - this arm MUST NOT exceed the null floor; any excess voids the instrument and no headline is reported'
  - metric: 'share of total abort events attributable to the ||c t0||_inf >= gamma2 gate and the wt(h) > omega gate'
    direction: higher
    minimum_effect: 0.05
  - metric: 'ratio I(G ; T-vector) / I(G ; 1{T > 0})'
    direction: higher
    minimum_effect: 1.0
  - metric: 'monotonicity of the estimate across the four-point t0-inflation ladder g = 1, 1.5, 2, 3'
    direction: different
    minimum_effect: 'monotone increasing at all three interior steps, or the directional reading of the headline is forfeited'
  minimal_test:
    design: >-
      One reduced parameter set, six arms, one invocation, no ladder in the minimal version.
      Choose n = 64, (k, l) = (2, 2), a small NTT-friendly q, d chosen so the t0 range is a
      meaningful fraction of gamma2, tau and eta with beta = tau*eta held exactly. Generate
      K = 512 keys; per key, Q_S = 2000 signatures on a single fixed message in hedged mode,
      2000 on a single fixed message in deterministic mode, and 2000 on distinct messages in
      deterministic mode. Record T and the per-gate abort counts. Compute the bias-corrected
      mutual information per arm, then the Z-GATE-ONLY arm, then 8 label permutations, then
      the structural null. Report six numbers with intervals. THIS DISCRIMINATES because the
      Z-GATE-ONLY arm's true value is derived to be exactly zero, so it pins the instrument;
      because the permutation floor pins the estimator; and because the hedged-versus-
      deterministic ratio at m = 1 is the quantity the standard guidance's unconditional
      sentence implicitly sets to <= 1. Cost: order of one CPU-hour in a compiled inner loop,
      more in pure Python.
    controls:
    - 'Z-GATE-ONLY derived-zero arm (two t0 gates disabled); true value exactly zero by the stage-0 algebra.'
    - 'Label-permutation null, >= 8 independent draws, reported as an interval not a point.'
    - 'Structural key-independent geometric null matched to the measured per-gate rates.'
    - 'Deterministic m = 1 arm, whose distinct-sample count is exactly 1 per key by construction.'
    - 't0-inflation sensitivity ladder at g = 1, 1.5, 2, 3 with a monotonicity verdict reported.'
    - 'Pre-registration of G, the alphabet, the estimator and every threshold, with the design document predating data generation.'
    - 'A FIPS-parameter sanity arm that verifies beta = tau*eta holds at the reduced parameters exactly as at ML-DSA-44/65/87, so the fixed-width derivation is transferable to the surrogate.'
    required_metrics:
    - 'bias-corrected I(G ; T-vector) per arm, with confidence interval'
    - 'permutation-null interval over >= 8 draws'
    - 'structural-null interval'
    - 'Z-GATE-ONLY arm value and its distance from the null floor'
    - 'per-gate abort shares'
    - 'I(G ; 1{T > 0}) and the ratio to the count-based value'
    - 'hedged/deterministic accumulated-bits ratio at m = 1 and at m = Q_S'
    - 'distinct-sample counts actually achieved per arm'
    - 'monotonicity verdict across the g-ladder'
  falsification_conditions:
  - 'STAGE 0 falsifier, before any compute: if a fixed-width argument also goes through for the ||c t0||_inf >= gamma2 gate at the reduced parameters, the channel is empty by algebra and the proposal is withdrawn.'
  - 'The hedged arm does not exceed the permutation-null interval by the pre-declared 0.005 bits: the recorded result is a measured upper bound on the abort-count channel at this sample size, which is a usable obstruction and is the honest headline.'
  - 'The Z-GATE-ONLY arm exceeds the null floor: the instrument is measuring something other than key dependence and no number is reportable.'
  - 'The permutation and structural nulls disagree beyond their intervals: same consequence.'
  - 'The hedged/deterministic ratio at m = 1 comes out at or below 1.0: the sample-count inversion does not occur, the standard guidance survives this test unqualified on this channel, and that is the finding.'
  - 'The estimate is non-monotone across the g-ladder: no directional reading is attached to any label, per KN-TECH-1a5b7e''s refinement.'
  - 'The t0 gates account for under 5 per cent of abort events at reduced parameters: the surrogate has been tuned into a regime unlike ML-DSA and the number is about the surrogate.'
  confounders:
  - 'Small-sample positive bias in mutual-information estimation, which is why the permutation null is mandatory rather than advisory and why it is drawn at least 8 times.'
  - 'Reduced-parameter tuning may push the c*t0 gate rate far from its FIPS value in either direction, making the bit rate a property of the surrogate; the per-gate shares are reported precisely so a reader can see this.'
  - 'The deterministic m = 1 arm has exactly one distinct sample per key, so its estimator is in a different small-sample regime from the hedged arm; the fair comparison is the m = Q_S arm and both are reported.'
  - 'Correlated seeds across arms shrinking apparent variance in arm differences.'
  - 'Alphabet-size dependence of G: a finer G raises both the true value and the bias, so the run repeats at two coarsening levels.'
  - 'On a real device, per-iteration cost is not exactly data-independent, so a latency observer sees more than T. That makes the measured value a lower bound, and any statement in the other direction is out of scope.'
  interpretation_limits:
  - 'A positive value bounds what any procedure could extract; it names no procedure, no query count and no attack.'
  - 'The value is a lower bound on I(sk ; transcript) because of three projections, so it cannot be used to argue that little information is present - only that at least this much is.'
  - 'Nothing here recommends deterministic mode. Deterministic mode is separately documented as fault-vulnerable (retrieved IETF draft Section 3.2.1); this record measures one channel and computes no net.'
  - 'The measurement is confined to reduced parameters. FIPS 204 t0-gate rates are not measured and are not extrapolated to.'
  - 'The result is scoped to the declared functional G and to the executed sample sizes.'
  heuristic_assumptions:
  - id: H1
    statement: >-
      For the reduced parameter set, over uniformly random keys, the per-iteration
      probability that the gate ||c t0||_inf >= gamma2 fires is a non-degenerate function of
      t0 with strictly positive variance across keys; formally, Var_{t0}( P_c[ ||c t0||_inf
      >= gamma2 ] ) > 0, with c uniform on B_tau.
    rigorous_support: >-
      The rigorous part is the negative half, which is proved rather than assumed: for the
      two norm gates the acceptance interval has fixed width 2(gamma1-beta)-1 (resp.
      2(gamma2-beta)-1) and lies inside the shifted support because beta = tau*eta bounds
      ||c s1||_inf and ||c s2||_inf, so those two gates have EXACTLY key-independent
      acceptance probability. The classical statement H1 imitates is the ordinary
      concentration of ||c t0||_inf for c a tau-sparse ternary multiplier and t0 uniform on
      (-2^(d-1), 2^(d-1)]: the maximum over 256 coefficients of a sum of tau signed
      near-uniform terms behaves like the maximum of a Gaussian-ish family whose scale is
      set by ||t0||_2, so the gate rate is a monotone function of a per-key scale parameter
      rather than a constant.
    validation_plan: >-
      Sample 10^4 keys at the reduced parameters and, for each, estimate P_c[||c t0||_inf >=
      gamma2] over 10^3 fresh challenges; plot the empirical distribution of that per-key
      probability and test Var > 0 against the label-permuted null. Compare the empirical
      per-key gate rate against the prediction from a Gaussian model of (c t0)_i with scale
      sqrt(tau)*sd(t0), including a TAIL CHECK on the 100 keys with the largest ||t0||_2,
      whose predicted gate rate must be the highest observed. Record the sampled parameters
      (n, k, l, q, d, tau, gamma2) explicitly. TRANSFER ASSUMPTION, stated and NOT
      discharged: that the sign of Var > 0 persists at ML-DSA-44/65/87, where tau*2^12
      (159744 at tau = 39) exceeds gamma2 = q/88 = 95232 so the gate is known to be active,
      but where nothing here measures its dispersion.
  - id: H2
    statement: >-
      Conditioned on the key, the restart counts of distinct hedged signatures on the same
      message are i.i.d. geometric with the per-key acceptance probability p(sk), so Q_S
      hedged signatures on one message deliver Q_S independent draws of a p(sk)-estimator.
    rigorous_support: >-
      Imitates the standard geometric-trials model for rejection sampling. Its rigorous
      support is that in hedged mode rho' = H(K || rnd || mu) with fresh rnd per signature,
      so distinct signatures use independent mask streams; the only coupling is the shared
      key and the shared message, both of which are conditioned on.
    validation_plan: >-
      Test the geometric fit per key by a chi-squared goodness-of-fit on the observed T
      histogram at K = 512 keys and Q_S = 2000, and test independence by the lag-1
      autocorrelation of the T-sequence against its permutation null. The deterministic m = 1
      arm is the forced-value counterpart: its T is constant per key, so its autocorrelation
      is degenerate by construction and its distinct-sample count is exactly 1 - a derived
      value checked mechanically. Sampled parameters recorded; no transfer to FIPS
      parameters is asserted.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. The measurement costs O(K * Q_S * E[T] * C_sign) where
      C_sign is one reduced-parameter signing iteration, plus O(K * Q_S) for the estimator;
      each permutation null adds O(K * Q_S).
    memory_exponent: >-
      No attack memory exponent is claimed. Storage is the (G, T, per-gate counts) table,
      O(K * Q_S) small integers - well under a gigabyte at K = 512, Q_S = 6000.
    best_known: >-
      On the axis this record's channel points at (learning about t0 from ordinary signing
      behaviour) the incumbent is ePrint 2024/1373: full t0 recovery from 200,000-500,000
      signatures on a desktop, with no side channel. On the axis of measuring the
      information content of the abort count, no incumbent value, bound or null floor exists
      in this repository or was found in the four searches run.
    hidden_overhead: >-
      The hidden cost is the reduced-parameter regime itself: forcing the c*t0 gate to fire
      often enough to estimate a distribution may require a d/gamma2 relation unlike FIPS
      204's, and defending that choice as ML-DSA-shaped is human argument, not compute.
      Second, Miller-Madow is a first-order correction; at moderate alphabet size the
      residual bias can exceed the effect, which is why the permutation null and not the
      correction is load-bearing.
    tradeoff_note: >-
      Not applicable in the attack sense. The one operational tradeoff is observer-side: the
      claimed hedged/deterministic inversion holds only for an observer confined to a small
      message set, and it vanishes as m approaches Q_S. That boundary - the message-set size
      at which the two modes deliver equal information - is itself a reported quantity.
  dominated_by: >-
    ePrint 2024/1373 (Azevedo Oliveira, Calle Viera, Cogliati, Goubin, CRYPTO 2025) DOMINATES
    this proposal in the Pareto sense on the t0-learning axis: it uses a strictly richer
    observable already present in the signature bytes, needs no side channel, and recovers t0
    outright from 2*10^5-5*10^5 signatures. ePrint 2025/214 dominates on key recovery given a
    single trace. Frontier rows checked: those two, plus KN-LIT-4f3b80 (Jendral single-trace
    voltage glitch, 0.582 success, requires physical fault injection - not comparable on the
    passive axis but checked), plus every RQ-MLDSA-001 proposal in the repository (none
    produces a cost triple for any attack). What is NOT dominated, because no checked row
    addresses it: the per-gate decomposition of the abort count, the measured bit rate of the
    count-only channel, and the hedged-versus-deterministic sample-count comparison.
  sota_delta: >-
    No attack; conceptual and measurement contribution only. Quantitatively: this record
    produces no cost triple and moves no exponent. Against the nearest attack, ePrint
    2024/1373's 2*10^5-5*10^5 signatures for full t0, this record's channel is coarser by the
    entire signature payload and would at best yield a bit rate in the 10^-3 to 10^-1
    bits/signature range - i.e. it is expected to be WORSE as an attack by orders of magnitude
    and is not offered as one. The delta is the creation of a first number with its null floor
    for the abort-count channel, plus the first quantitative statement of the
    hedged/deterministic inversion, where the repository and the four searches run found no
    value, bound or floor at all.
