    verdict: >-
      UNVERIFIED, and the corpus half of the earlier verdict is RETRACTED: the sentence "corpus
      novelty is checked and clean" was written from proposal titles plus a file count and was
      false. After the re-screen described in `method`, the honest classification is:
      ADAPTATION for the gate partition (IDEA-20260808-4f83f6 owns it) and for the reachability
      arithmetic (IDEA-20260805-bb52fa owns it, and EXP-MLDSA-462ea2 already specifies its
      measurement). What remains CLAIMED AS NEW, and what a reviewer should attack, is narrower
      than before and is stated as three items: (i) the OBSERVABLE - the restart count T and its
      per-gate decomposition, which no RQ-MLDSA-001 or RQ-MLDSA-ffa0f5 record tracks; (ii) the
      consequence of bb52fa's arithmetic for THIS observable, namely that the abort-count channel
      is single-gate (wt(h)) at all three approved parameter sets, which bb52fa states for the
      predicate and not for the count; (iii) the repeated-message hedged/deterministic
      sample-count inversion, which appears nowhere in either question. External novelty is NOT
      established: four searches and four abstract-level fetches are a screen, not a survey, and
      no PDF could be rendered this session. ASSEMBLED FROM KNOWN PARTS: the rejection-sampling
      fixed-width argument is Lyubashevsky's; Miller-Madow correction, permutation nulls and
      structural nulls are estimator hygiene from KN-TECH-1a5b7e; the estimator design is
      downstream of IDEA-20260816-b336a3 in the HQC lane and this record does not claim that
      method as its own.
  object_first_candidate:
    tracked_object: >-
      The restart count T of the FIPS 204 signing loop, decomposed by which of the four rejection
      conditions fired, followed from the sampling of (s1, s2, t0) at key generation through each
      signing iteration to the observable latency. What is tracked is the divergence, in bits, of
      the posterior over a declared key functional G given the observed T-sequence, from its
      prior. After the correction in claim (C) the live carrier inside T is the hint-weight gate
      wt(h) > omega, whose firing depends on t0 and s2 jointly through
      w'_Approx = A z - c t1 2^d = w - <<c s2>> + <<c t0>>.
    lossiness: >-
      LOSSY THREE TIMES OVER, deliberately, and each discard is compatible with the operation that
      follows it. First, the whole signing state (y, w, c, z, r0, h) of an aborted iteration is
      projected to a single bit "accepted or not" - everything the published single-trace attacks
      consume is thrown away. Second, the sequence of those bits is projected to its length T.
      Third, the key is projected onto G, a coarsened per-polynomial ||t0||_2 and ||s2||_2 profile
      over a four-symbol alphabet, discarding position and sign information entirely. Mutual
      information is monotone under all three projections, so the measured value is a LOWER bound
      on I(sk ; full transcript) and an upper bound on nothing - the honest direction, and it is
      exactly why a small value is informative about the CHANNEL and not about the scheme.
      Critically, the projection to T is not a change of coordinates: from T alone the aborted
      iterations are unrecoverable, and after claim (C) at most one of the four gates contributes
      anything key-dependent to T at all, so the retained part is strictly smaller than the state.
    propagation: >-
      One signing iteration is one step, and it writes exactly one increment of T. The propagation
      law of interest is the per-iteration acceptance probability p(sk) = p_z * p_r0 * p_ct0(t0) *
      p_h(t0, s2), which factorises because the gates are evaluated in sequence on the same
      iteration. Stage 0 settles p_z as a constant of the parameter set and decides whether p_r0
      is one too. Claim (C) fixes p_ct0 = 1 identically at ML-DSA-65/-87 and at 1 - 7.34e-9 at
      ML-DSA-44, so p_h is the only factor left to carry the key. The measurement decomposes the
      total information into per-gate terms plus a residual, and reports both: if the total equals
      the wt(h) term within error, the decomposition is confirmed; if the z-gate or r0-gate term
      is non-zero, the stage-0 algebra is wrong and that, not the bit count, is the finding.
    survival_score: >-
      One iteration, then a hard collapse. Key information enters T only through the hint-weight
      gate of a single iteration and then survives only as an increment to an integer. The proposal
      reports the ratio I(G ; T-vector) / I(G ; 1{T > 0}) at the executed parameters, a concrete
      number expressing how much is lost by observing only "did it restart at all". A ratio near 1
      means the count adds nothing beyond the restart indicator and the object dissolves
      immediately; a ratio well above 1 means it survives the step meaningfully. Either value is
      the deliverable.
  null_object_control: >-
    FOUR controls, all on the identical estimator code path and all in the same invocation as the
    signal arm. NULL-A, DERIVED-ZERO ARM (this is the load-bearing one and it can fail): run with
    the ct0 gate and the wt(h) gate both disabled, so that by the stage-0 derivation the true
    mutual information is EXACTLY zero for every key. If this arm returns a value above the
    permutation floor, either the derivation or the implementation is wrong and NO signal-arm
    number is reportable. NULL-B, LABEL PERMUTATION: recompute after permuting which key produced
    which T-vector, preserving both marginals; its true value is zero by construction, so it is the
    estimator's bias-plus-noise floor at this sample size, drawn at least 8 times so that it is
    reported as an interval and not a point (KN-TECH-1a5b7e mode 5). NULL-C, STRUCTURAL: generate T
    from a key-independent geometric process matched to the measured per-gate rates; it must agree
    with NULL-B within intervals, or the estimator responds to something other than key dependence.
    SENSITIVITY DEMONSTRATION, declared with a numeric threshold before the run: an artificially
    inflated-t0 family, in which t0 coefficients are scaled by a factor g, must show the estimate
    rising monotonically over at least three interior values of g (g = 1, 1.5, 2, 3). THE MECHANISM
    IS NOW THE HINT AND NOT THE CT0 GATE: larger ||c t0||_inf pushes more coefficients of
    w - <<c s2>> + <<c t0>> across a HighBits boundary, so MakeHint sets more bits and the wt(h)
    gate's firing rate rises monotonically in ||t0||. Two endpoints are not a direction; three
    interior points and a reported monotonicity verdict are required, and a non-monotone statistic
    forfeits any directional reading of the headline.
  discriminated_from:
  - >-
    IDEA-20260808-4f83f6 (RQ-MLDSA-ffa0f5) IS THE NEAREST RECORD IN THE PROGRAM and the earlier
    version of this proposal failed to screen it. It partitions the same four rejections into
    public and secret, identifies the SAME two non-public gates, and measures a bias. THE
    PARTITION IS ITS RESULT AND IS CITED, NOT CLAIMED, in claim (B); its exact identity
    w - c s2 = A z - c t supersedes the fixed-width hand-wave this record previously used for the
    r0 gate. WHAT IS LEFT THAT DIFFERS, at two points both texts state: (i) OBSERVABLE - 4f83f6
    reads the accepted CHALLENGE law (per-position and per-sign frequencies of supp(c)) off public
    signature bytes, requiring no timing and no device; this record reads the RESTART COUNT off
    latency and never inspects a signature byte. Neither quantity is computable from the other:
    a transcript of accepted signatures does not reveal how many iterations produced each, and a
    sequence of restart counts contains no challenge. (ii) MODE - 4f83f6 carries no
    hedged/deterministic contrast, and the sample-count inversion of claim (D) has no counterpart
    there. A reviewer who judges (i) and (ii) insufficient should say so: the honest position is
    that this record is now a narrow addition to 4f83f6's object rather than an independent one.
  - >-
    IDEA-20260805-bb52fa (RQ-MLDSA-ffa0f5) owns the reachability arithmetic that claim (C) rests
    on: ||c t0||_inf <= tau*2^(d-1) exactly, hence UNREACHABLE at ML-DSA-65 (slack 61184) and
    ML-DSA-87 (slack 16128), and 7.34e-9 per signature at ML-DSA-44 under its own named heuristic
    on t0. This record IMPORTS that result, produces no independent derivation of it, and would be
    void without it. bb52fa is about the PREDICATE's reachability at real parameters and computes
    no information quantity; this record is about the COUNT at reduced parameters and computes
    nothing at real parameters.
  - >-
    IDEA-20260821-6d1b97 (RQ-MLDSA-ffa0f5) measures the ML-DSA-44 ct0 rejection rate DIRECTLY, by
    exponentially tilting the challenge distribution around a real key's t0, returning a per-key
    rate at 1e-9 from about 1e5 tilted samples. That is the correct instrument for the quantity
    this record only imports as a ceiling. If 6d1b97 runs and returns a per-key rate materially
    above 7.34e-9, claim (C)'s ML-DSA-44 half must be restated; the -65/-87 half is a theorem and
    is unaffected.
  - >-
    EXP-MLDSA-462ea2 (committed specification, H-MLDSA-2d4123, GOAL-MLDSA-002) already implements
    the per-predicate census AND a synthetic reachable cell - ML-DSA-87's tau and d with gamma2
    replaced by 200000, below the 245760 envelope - as a positive control in which the ct0
    predicate MUST fire, with a five-point graded threshold sweep. This record's stage-2 arm (vii)
    must reuse that cell rather than invent a second one, and must not re-report its firing rates
    as its own. Nothing in 462ea2 measures an abort COUNT or a mutual information.
  - >-
    ePrint 2025/214 (Zhou et al.) attacks rejection sampling using single-trace NTT leakage of the
    REJECTED challenge and response and achieves full key recovery. This record consumes one
    integer per ACCEPTED signature and claims no recovery of anything. If the measured bit rate
    here is tiny and 2025/214's attack succeeds, that is consistent and informative: it localises
    the value in the trace content rather than in the count.
  - >-
    ePrint 2024/1373 recovers t0 from the signature bytes of 200k-500k ordinary signatures. Same
    secret, richer observable, and a working attack; this is the dominating result on that axis and
    is recorded in dominated_by. The question here is what the COUNT alone is worth and whether the
    two modes differ - neither of which 2024/1373 asks.
  - >-
    IDEA-20260805-818196 (fault-proof boundary as the rank of an affine constraint system) concerns
    what a FAULTING adversary forces; this record's adversary injects nothing and observes only
    latency.
  - >-
    IDEA-20260808-5a748c prices t0 as a core-SVP gap between the t1-only and full-t MLWE instances.
    That is the VALUE of t0 in bits; this record measures a RATE at which one coarse channel emits
    information about it. Neither implies the other, and the two compose only through
    IDEA-20260821-4d4e5f's ledger.
  - >-
    IDEA-20260816-b336a3 (HQC lane) counts bits per observed decoding failure. Same estimator
    discipline, different scheme, different object, different lane; this record cites it as method
    provenance rather than claiming the method.
  - >-
    IDEA-20260805-031ce2 (RQ-MLDSA-ffa0f5) censuses the same four Algorithm 7 predicates but sorts
    them by verifier-observability and consequence-of-omission ({z, wt(h)} verifier-enforced, {r0}
    self-enforcing, {c t0} unobservable), where this record sorts by key-dependence of the
    per-iteration ACCEPTANCE PROBABILITY. The discriminating tests are disjoint: 031ce2 observes
    whether a signature emitted by a signer that OMITS a predicate still verifies, via 10^5 (r, s)
    hint-fibre samples and 500 emissions per variant against an independently written verifier and
    the forced value 0.991; this record observes the restart count T of a fully CONFORMING signer.
    031ce2 also carries the 7.34e-9 rate and the exactly-zero verdicts at -65/-87, which is a second
    place the earlier screen should have caught the error corrected in claim (C).
