  assumptions:
  - >-
    Per-iteration signing cost is data-independent on the modelled device, so T is
    recoverable from latency. If it is not, the observable is richer than modelled and the
    measured value is a lower bound on what a real latency observer gets - stated in that
    direction, never the other.
  - >-
    Reduced parameters can be chosen so that the c*t0 gate fires at a rate high enough to
    estimate a distribution over T, while the four-gate structure and the beta = tau*eta
    relation are preserved. If they cannot, the measurement is not affordable and the record
    says so rather than substituting a differently-shaped surrogate.
  - >-
    The key functional G is fixed before any data exists and never revised; a G chosen after
    seeing T-vectors would inflate the estimate arbitrarily.
  - >-
    Keys are sampled independently across trials, so the estimator's variance formula applies.
  - >-
    No conclusion transfers to FIPS 204 parameters. The rate at which the c*t0 gate fires is
    a function of gamma2, tau and d and is not preserved by the reduction; the transfer
    assumption is named and NOT discharged by any run under this record.
