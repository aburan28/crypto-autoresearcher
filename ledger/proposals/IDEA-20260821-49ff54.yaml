  heuristic_assumptions:
  - id: H1
    statement: >-
      For the reduced parameter set, over uniformly random keys, the per-iteration probability that
      the gate wt(h) > omega fires is a non-degenerate function of (t0, s2) with strictly positive
      variance across keys; formally, Var_{(t0,s2)}( P_{y,c}[ wt(h) > omega ] ) > 0.
    rigorous_support: >-
      The rigorous part is the negative half. For the z gate the acceptance interval has fixed width
      2(gamma1-beta)-1 and lies inside the shifted support because beta = tau*eta bounds
      ||c s1||_inf, so its acceptance probability is EXACTLY key-independent. For the ct0 gate the
      rigorous part is stronger still and is imported: ||c t0||_inf <= tau*2^(d-1) exactly
      (IDEA-20260805-bb52fa), which at ML-DSA-65 and -87 is strictly below gamma2 and makes the gate
      fire with probability exactly 0. The classical statement H1 imitates is the ordinary
      concentration of the number of HighBits carries induced by a perturbation: h has a one in
      coordinate i exactly when <<c t0>>_i - <<c s2>>_i pushes w_i across a HighBits boundary, so
      wt(h) is a sum of 256k weakly dependent indicators whose common rate is a monotone function of
      the per-key scales ||t0||_2 and ||s2||_2, rather than a constant.
    validation_plan: >-
      Sample 10^4 keys at the reduced parameters and, for each, estimate P_{y,c}[wt(h) > omega] over
      10^3 fresh (y, c) pairs; plot the empirical distribution of that per-key probability and test
      Var > 0 against the label-permuted null. Compare the empirical per-key gate rate against a
      binomial-carry model for wt(h) with per-coordinate rate set by ||<<c t0>> - <<c s2>>||
      relative to 2*gamma2, including a TAIL CHECK on the 100 keys with the largest ||t0||_2 and the
      100 with the largest ||s2||_2, whose predicted gate rate must be the highest observed. Record
      the sampled parameters (n, k, l, q, d, tau, eta, gamma2, omega) explicitly. TRANSFER
      ASSUMPTION, stated and NOT discharged: that the sign of Var > 0 persists at ML-DSA-44/65/87.
      Note explicitly what is NOT assumed and what an earlier version of this record wrongly
      asserted: the ct0 gate is NOT active at ML-DSA-65 or ML-DSA-87 (200704 < 261888 and
      245760 < 261888) and fires at 7.34e-9 at ML-DSA-44, so no transfer statement in this record
      may rest on that gate being live at any approved parameter set.
  - id: H2
    statement: >-
      Conditioned on the key, the restart counts of distinct hedged signatures on the same message
      are i.i.d. geometric with the per-key acceptance probability p(sk), so Q_S hedged signatures
      on one message deliver Q_S independent draws of a p(sk)-estimator.
    rigorous_support: >-
      Imitates the standard geometric-trials model for rejection sampling. Its rigorous support is
      that in hedged mode the per-signature seed rho-prime = H(K || rnd || mu) is drawn with fresh
      rnd per signature, so distinct signatures use independent mask streams; the only coupling is
      the shared key and the shared message, both of which are conditioned on.
    validation_plan: >-
      Test the geometric fit per key by a chi-squared goodness-of-fit on the observed T histogram at
      K = 512 keys and Q_S = 2000, and test independence by the lag-1 autocorrelation of the
      T-sequence against its permutation null. The deterministic m = 1 arm is the forced-value
      counterpart: its T is constant per key, so its autocorrelation is degenerate by construction
      and its distinct-sample count is exactly 1 - a derived value checked mechanically. Sampled
      parameters recorded; no transfer to FIPS parameters is asserted.
  - id: H3
    statement: >-
      IMPORTED, NOT ORIGINATED HERE. At ML-DSA-44 the per-signature rate at which the
      ||c t0||_inf >= gamma2 disjunct fires is 7.34e-9, conditional on IDEA-20260805-bb52fa's named
      heuristic that the coefficients of a skDecode-accepted t0 behave like independent uniform
      draws on (-2^(d-1), 2^(d-1)] for the purpose of the convolution tail at gamma2. At ML-DSA-65
      and ML-DSA-87 the corresponding rate is 0 unconditionally, by the exact envelope, and no
      heuristic is involved there.
    rigorous_support: >-
      The unconditional half is an integer inequality: tau*2^(d-1) = 200704 and 245760 against
      gamma2 = 261888. The conditional half imitates the classical local-limit and convolution-tail
      estimate for a signed sum of tau bounded independent terms, and its rigorous ingredient is the
      exact support constraint on t0 guaranteed by skEncode.
    validation_plan: >-
      NOT VALIDATED BY THIS RECORD, AND THAT IS STATED RATHER THAN CONCEALED. The direct validation
      route already exists in the program and belongs to its owners: IDEA-20260821-6d1b97 measures
      the per-key ML-DSA-44 rate at 1e-9 by exponential tilting of the challenge distribution from
      about 1e5 tilted samples, and EXP-MLDSA-462ea2's committed specification prices direct
      observation at 1.36e8 signing attempts and declares it out of budget. This record consumes
      H3 only as a CEILING on a quantity it wants to be negligible, so a measured rate anywhere below
      1e-3 leaves every conclusion here intact; a measured rate above 1e-3 would falsify claim (C)'s
      ML-DSA-44 half and is recorded as the condition under which this record must be restated.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. The measurement costs O(K * Q_S * E[T] * C_sign) where C_sign is
      one reduced-parameter signing iteration, plus O(K * Q_S) for the estimator; each permutation
      null adds O(K * Q_S).
    memory_exponent: >-
      No attack memory exponent is claimed. Storage is the (G, T, per-gate counts) table, O(K * Q_S)
      small integers - well under a gigabyte at K = 512, Q_S = 6000.
    best_known: >-
      On the axis this record's channel points at (learning about t0 from ordinary signing
      behaviour) the incumbent is ePrint 2024/1373: full t0 recovery from 200,000-500,000 signatures
      on a desktop, with no side channel; the program's own information-theoretic floor for that
      task is IDEA-20260805-630606's 34 / 60 / 58 signatures, computed by EXP-MLDSA-8c8fa2. On the
      axis of measuring the information content of the abort COUNT, no incumbent value, bound or null
      floor exists in this repository or was found in the searches run.
    hidden_overhead: >-
      The hidden cost is the reduced-parameter regime itself: forcing the wt(h) gate to fire often
      enough to estimate a distribution over T may require an omega, gamma2 and (k, l) relation
      unlike FIPS 204's, and defending that choice as ML-DSA-shaped is human argument, not compute.
      Second, Miller-Madow is a first-order correction; at moderate alphabet size the residual bias
      can exceed the effect, which is why the permutation null and not the correction is
      load-bearing.
    tradeoff_note: >-
      Not applicable in the attack sense. The one operational tradeoff is observer-side: the claimed
      hedged/deterministic inversion holds only for an observer confined to a small message set, and
      it vanishes as m approaches Q_S. That boundary - the message-set size at which the two modes
      deliver equal information - is itself a reported quantity.
  dominated_by: >-
    ePrint 2024/1373 (Azevedo Oliveira, Calle Viera, Cogliati, Goubin, CRYPTO 2025) DOMINATES this
    proposal in the Pareto sense on the t0-learning axis: it uses a strictly richer observable already
    present in the signature bytes, needs no side channel, and recovers t0 outright from 2*10^5-5*10^5
    signatures. ePrint 2025/214 dominates on key recovery given a single trace. INSIDE THE PROGRAM,
    rows the earlier version of this record failed to check and which are now checked: (i)
    IDEA-20260808-4f83f6 DOMINATES on the gate-partition deliverable - it has the exact algebraic
    argument this record previously approximated - and is not dominated by anything here; (ii)
    IDEA-20260805-bb52fa DOMINATES on the reachability question at zero compute and this record
    imports rather than competes; (iii) IDEA-20260821-6d1b97 DOMINATES on measuring the ML-DSA-44 ct0
    rate, at about 1e5 tilted samples against the 1.36e8 signatures EXP-MLDSA-462ea2 prices for direct
    observation; (iv) IDEA-20260805-630606 and EXP-MLDSA-8c8fa2 DOMINATE on bounding t0 recovery by
    signature count (34 / 60 / 58 floors). Other rows checked: KN-LIT-4f3b80 (Jendral single-trace
    voltage glitch, 0.582 success, requires physical fault injection - not comparable on the passive
    axis but checked), IDEA-20260805-031ce2, H-MLDSA-2d4123, H-MLDSA-2ae88d, and the remaining five
    committed EXP-MLDSA-* specifications (1c66ac, 15866e, 2b6f17, 3f7ab2, a8d531), none of which
    produces an attack cost triple or an abort-count measurement. What is NOT dominated, because no
    checked row addresses it: the measured bit rate of the count-only channel and the
    hedged-versus-deterministic sample-count comparison.
  sota_delta: >-
    No attack; conceptual and measurement contribution only. Quantitatively: this record produces no
    cost triple and moves no exponent. Against the nearest attack, ePrint 2024/1373's 2*10^5-5*10^5
    signatures for full t0, this record's channel is coarser by the entire signature payload and is
    expected to be WORSE as an attack by orders of magnitude; it is not offered as one. Against the
    nearest INTERNAL rows the delta is now smaller than the earlier version claimed and is stated
    honestly: the gate partition contributes 0 (4f83f6 owns it), the reachability arithmetic
    contributes 0 (bb52fa owns it, and it FALSIFIED this record's earlier premise), and what remains
    is the first number with a null floor for the abort-count channel plus the first quantitative
    statement of the hedged/deterministic inversion, for which the repository and the searches run
    found no value, bound or floor at all.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: >-
    By part, and the headline priority is LOWERED from high to medium because the re-screen showed the
    partition and the arithmetic both belong to other records. (i) That the stage-0 fixed-width
