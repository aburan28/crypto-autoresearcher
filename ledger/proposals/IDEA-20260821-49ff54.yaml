    direction: higher
    minimum_effect: 0.005
  - metric: 'accumulated bits at fixed Q_S with message-set size m = 1, hedged arm divided by deterministic arm'
    direction: higher
    minimum_effect: 2.0
  - metric: 'Z-GATE-ONLY derived-zero arm, estimate minus permutation-null interval'
