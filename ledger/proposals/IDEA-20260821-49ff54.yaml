  assumptions:
  - >-
    Per-iteration signing cost is data-independent on the modelled device, so T is recoverable from
    latency. If it is not, the observable is richer than modelled and the measured value is a lower
    bound on what a real latency observer gets - stated in that direction, never the other.
  - >-
    Reduced parameters can be chosen so that the wt(h) > omega gate fires at a rate high enough to
    estimate a distribution over T, while the four-gate structure and the beta = tau*eta relation
    are preserved. The ct0 gate is NOT required to be active and SHOULD NOT be: at every approved
    ML-DSA parameter set it is dead or fires at 7.34e-9, and a surrogate that makes it active is a
    surrogate unlike ML-DSA. If no such parameter set exists the measurement is not affordable and
    the record says so rather than substituting a differently-shaped surrogate.
  - >-
    The key functional G is fixed before any data exists and never revised; a G chosen after seeing
    T-vectors would inflate the estimate arbitrarily.
  - >-
    Keys are sampled independently across trials, so the estimator's variance formula applies.
  - >-
    No conclusion transfers to FIPS 204 parameters. The rate at which the wt(h) gate fires is a
    function of omega, gamma2, tau, d and (k, l) and is not preserved by the reduction; the transfer
    assumption is named and NOT discharged by any run under this record.
