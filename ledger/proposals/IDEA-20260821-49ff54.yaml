idea:
  id: IDEA-20260821-49ff54
  question_id: RQ-MLDSA-001
  added: '2026-08-21'
  title: >-
    Exactly two of ML-DSA's four rejection conditions can carry key information in the
    ABORT COUNT, and both are the t0 conditions: the two norm gates have a fixed-width
    acceptance interval and are therefore EXACTLY key-independent by algebra, while the
    ||c t0||_inf >= gamma2 gate and the wt(h) > omega gate have no such argument. Measure
    the bit rate of the abort-count channel, and measure it separately in hedged and
    deterministic mode, where the prediction runs OPPOSITE to the standard guidance -
    against a repeated-message observer, hedged mode delivers Q_S independent draws of a
    per-key statistic where deterministic mode delivers at most one per distinct message.
  class: control
  claim: >-
    (A) THE OBSERVABLE. The tracked observable is a single non-negative integer per
    produced signature: T, the number of times the signing loop restarted. It is not a
    signature byte, not a power trace and not a fault; it is what a passive observer of
    signing LATENCY on a device with data-independent per-iteration cost can read, and it
    is strictly coarser than anything any published ML-DSA side-channel attack consumes.
    (B) THE DERIVED PART, WHICH COSTS NO COMPUTE AND IS THE POINT OF THE PROPOSAL. FIPS 204
    signing restarts on the disjunction of four conditions. For the two norm gates -
    ||z||_inf >= gamma1 - beta with z = y + c*s1, and ||r0||_inf >= gamma2 - beta with
    r0 = LowBits(A y - c s2) - the acceptance interval has FIXED WIDTH (2(gamma1-beta)-1,
    resp. 2(gamma2-beta)-1) and, because beta = tau*eta is a worst-case bound on
    ||c s1||_inf and ||c s2||_inf, that interval lies entirely inside the support of the
    shifted uniform variable for EVERY admissible key. The per-iteration acceptance
    probability of those two gates is therefore a constant of the parameter set, EXACTLY
    independent of (s1, s2). This is the same fixed-width argument the rejection-sampling
    lemma uses for the accepted z; here it is applied to the TRIAL COUNT, which the lemma
    does not cover. (C) WHERE THE CHANNEL MUST THEREFORE LIVE. The remaining two gates are
    ||c t0||_inf >= gamma2 and wt(h) > omega. Neither has a fixed-width argument: t0 has
    coefficients in (-2^12, 2^12], so ||c t0||_inf ranges up to tau*2^12 (159744 at
    ML-DSA-44) against gamma2 = q/88 = 95232, and the gate genuinely fires at a rate that
    is a function of the actual t0. PREDICTION, STATED BEFORE ANY RUN: essentially all
    key-dependent information in T is carried by these two gates, and an arm in which they
    are disabled must return a bit rate indistinguishable from zero. (D) THE HEDGED /
    DETERMINISTIC CONTRAST, AND WHY ITS DIRECTION IS THE INTERESTING PART. In deterministic
    mode rnd is all-zero, so T is a deterministic function T(sk, M); an observer confined
    to a message set of size m can collect at most m distinct values however many
    signatures it sees. In hedged mode T is redrawn per signature, so Q_S signatures on the
    SAME message give Q_S independent draws from the per-key law. CLAIM: for an observer
    with m << Q_S, the accumulated information about a t0 functional is bounded by a
    constant in deterministic mode and grows with Q_S in hedged mode, so the retrieved,
    quoted guidance "There is no reason to prefer deterministic signing over hedged
    signing; hedged signing is the safer default in all environments"
    (draft-connolly-cfrg-ml-dsa-security-considerations-02, Section 2.2.1) is
    unconditional where a scoped statement is what the evidence supports. (E) WHAT IS NOT
    CLAIMED. No attack, no key recovery, no forgery, no break of MLWE, MSIS or
    SelfTargetMSIS, and no claim about FIPS 204 parameters - the measurement runs at
    reduced parameters only. A positive mutual information is an information-theoretic
    upper bound on what any procedure could extract; it names no procedure and no query
    count. A NEAR-ZERO RESULT IS THE OUTCOME THE DESIGN IS BUILT TO REPORT HONESTLY and is
    a measured upper bound on the abort-count channel, which converts an argued folk claim
    ("the restart count leaks only statistical information") into a number with an error
    bar. Deterministic mode is NOT recommended by this record under any outcome: it is
    already documented as fault-vulnerable, and this proposal measures one channel, not a
    net.
  mechanism: >-
    STAGE 0, ALGEBRA BEFORE COMPUTE. Write out the four rejection conditions from FIPS 204
    signing and derive, symbolically, the per-iteration acceptance probability of each as a
    function of the key. Record the two fixed-width derivations in full (they are the
    forced-value derivations of KN-TECH-1a5b7e obligation 4) and record that no such
    derivation exists for the two t0 gates. This stage can already falsify the proposal: if
    a fixed-width argument also goes through for the c*t0 gate, the channel is empty by
    algebra and no run happens. STAGE 1, INSTRUMENT. Implement a reduced-parameter ML-DSA
    with all four gates individually switchable, emitting (key id, message id, mode, T,
    per-gate abort counts) per signature. Declare, before data exists, a low-dimensional
    key functional G(t0) - the coarsened per-polynomial profile of ||t0||_2 over a
    four-symbol alphabet - and the Miller-Madow-corrected plug-in mutual-information
    estimator, with its bias computed as a function of alphabet size and sample count.
    STAGE 2, ARMS. (i) HEDGED, m = 1: one fixed message, Q_S signatures per key, K keys.
    (ii) DETERMINISTIC, m = 1: same, where T is constant per key by construction - this arm
    is a derived-value check, since its per-key sample count is exactly 1 regardless of
    Q_S. (iii) DETERMINISTIC, m = Q_S: distinct messages, the fair comparison at equal
    distinct-observation count. (iv) Z-GATE-ONLY control, with the two t0 gates disabled:
    its true information is zero by the stage-0 derivation, so it is a null that CAN fail
    and whose failure voids the instrument. (v) LABEL-PERMUTATION null on the identical
    estimator. (vi) KEY-INDEPENDENT BERNOULLI null matched to the measured per-gate rates.
    STAGE 3, READOUT. Report bits per observed signature for each arm with intervals; the
    permutation null pins the estimator floor; nulls (v) and (vi) must agree with each
    other or nothing is reportable; arm (iv) must sit on the floor. STAGE 4, LADDER in Q_S
    and in K, with convergence a precondition for reporting any value.
  novelty_status: unverified
  novelty_screen:
    method: >-
      The crypto-kb MCP retrieval index is UNAVAILABLE this session - it is configured with
      an in-memory Qdrant and answers nothing - so no kb-provenance citation appears in this
      record. Retrieval instrument was ripgrep over the repository plus WebSearch/WebFetch.
      RIPGREP, from /home/user/crypto-autoresearcher, using the Grep tool (ripgrep, -i,
