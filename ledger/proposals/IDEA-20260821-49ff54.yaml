    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: >-
    By part. (i) That the stage-0 fixed-width derivation holds for both norm gates and fails
    for both t0 gates: ~0.85 - the fixed-width argument is standard, but beta = tau*eta is a
    bound and an edge case at the reduced parameters could break it, which is why stage 0 is a
    gate. (ii) That reduced parameters exist with an active c*t0 gate and ML-DSA-shaped
    structure: ~0.8. (iii) That the Z-GATE-ONLY arm sits on the null floor, licensing the
    instrument: ~0.75. (iv) That the hedged arm exceeds the floor by 0.005 bits: ~0.6 - some
    key dependence is near-certain in principle, but at these sample sizes the floor may sit
    above it. (v) That the hedged/deterministic ratio at m = 1 exceeds 2.0: ~0.7, and this is
    the part most worth betting on, because it is close to forced by the sample-count argument
    once (iv) is non-zero. (vi) That the run yields a defensible number or a defensible upper
    bound either way: ~0.9.
