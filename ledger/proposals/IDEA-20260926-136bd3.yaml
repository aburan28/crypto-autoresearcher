idea:
  id: IDEA-20260926-136bd3
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    THE k-TREE ROUTE ON ECC2K-130 IS A FILTER-CAPACITY QUESTION: exact
    sum-compatible filters on E(F_{2^131}) carry exactly 2 bits (the cofactor),
    an ideal 16-list tree over an orbit-union base would beat matched rho by
    about 13 bits, and the approximate capacity of Koblitz-specific filters is
    measurable on toy cells against exact positive controls at 2 and 4

  class: control

  claim: >-
    SEAM. The brief asks what replaces the additive low-bits coordinate that
    Wagner's k-tree needs and that Theorem C (KN-FIND-ffe1df) forbids on a
    prime-order group. This record answers in three priced parts, each
    falsifiable, and then names the ONE measurement that decides whether the
    route has any live cell on ECC2K-130.

    (A) THE STAKES, RE-DERIVED. Wagner's k-tree with k = 2^j lists of size L
    over a group of order N finds a k-sum equal to a target with constant
    probability when L is about N^{1/(j+1)}, in about k*L group operations,
    PROVIDED a filter h: E -> [M] with alphabet M about L exists at every
    internal level such that h(P+Q) is determined by (h(P), h(Q)) (recalled,
    Wagner 2002; the k-tree accounting is standard). On ECC2K-130 (N = l =
    2^129.00 in the target subgroup): k = 8 needs L = 2^32.25, per-attempt cost
    8L = 2^35.25; k = 16 needs L = 2^25.8, per-attempt cost 2^29.8. The
    factor base must contain the lists, so B >= L; with an ORBIT-UNION base
    (131 Frobenius conjugates and negation, unknowns B/262, KN-FIND-47da4e's
    object) the relation count is B/262 and the linear algebra is m*(B/262)^2.
    MY ARITHMETIC, zero compute: k = 8 gives 2^24.7 relations x 2^35.25 =
    2^59.95 plus LA 2^52.4, a tie with matched rho at 2^60.81 (KN-FIND-aa2efc's
    2^60.8090) within 1 bit; k = 16 gives 2^17.8 x 2^29.8 = 2^47.6, about 13
    bits BELOW rho. Without orbit unknowns (relations = B) k = 16 still lands at
    2^55.6, 5 bits below rho, and k = 8 at 2^68.5, above. So an IDEAL 16-list
    tree would break the challenge, and the ENTIRE question is whether a filter
    with about 26 bits of sum-compatible alphabet exists at three internal
    levels. Everything below prices that filter.

    (B) THE EXACT CAPACITY IS 2 BITS, BY THEOREM C APPLIED TO THE COMPOSITE
    AMBIENT GROUP. Theorem C's argument (a tree must invert its combining rule
    in each argument, so exact sum-compatibility forces h to be a surjective
    homomorphism onto a group of order M dividing #E) is stated in KN-FIND-ffe1df
    for prime N and validator-confirmed there; the same four lines run on ANY
    finite abelian group. On ECC2K-130, #E = 4l with l prime, so M divides 4l
    and every alphabet below l is in {1, 2, 4}. The two nontrivial exact filters
    are the E/2E map, which on y^2 + xy = x^3 + 1 is P -> Tr(x(P)) (the
    halving criterion Tr(x) = Tr(a) with a = 0; IDEA-20260922-1b16d7, relaying
    Fong-Hankerson-Lopez-Menezes Lemma 4.1), and the E/4E map (Tr(x(P)),
    Tr(x(P/2))) for P in 2E, well defined because the 2-torsion point (0,1)
    lies in 2E. This is EXACTLY IDEA-20260922-153a90's block-system statement
    read on the legs and intermediate sums, which live in the composite-order
    full group; on the target subgroup both maps are identically zero. So the
    brief's first candidate, the composite order-4l ambient group, is priced
    EXACTLY: it replaces Wagner's n-bit low-bits coordinate with a 2-bit one,
    and a k-tree filtering 2 bits per level gains a factor at most 4 per merge
    against a required 2^26. Closed with a named, exact obstruction: the
    subgroup lattice of E(F_{2^131}) has no proper quotient of order between 4
    and l.

    (C) THE OTHER NAMED CANDIDATES, PRICED. (C1) Frobenius-class canonical
    representatives. Frobenius commutes with addition, so the class of P + Q is
    NOT a function of the classes of P and Q; it depends on the relative shift
    between the chosen representatives. Storing half-sums modulo the diagonal
    Frobenius action shrinks a two-list table by 131 and lets one probe check
    131 conjugates at once: a constant 2^7, not a filter. (C2) The x-coordinate.
    x(P+Q) is one of the two roots of S_3(x_P, x_Q, .), a branching object with
    L = 1 bit and b = 2 (the Kummer-line paradigm, closed at model lever 1 by
    RQ-ECDLP-623a32); it filters nothing. (C3) Subspace-constrained
    intermediate sums, the honest analogue of "low bits zero": demand that
    every partial sum u_k = P_1 + ... + P_k have x(u_k) in a subspace V_k. Then
    the tree is the chained-S_3 system of Semaev with the intermediates cut
    down, and each level is an RC-1-shaped S_3 solve with blocks (d, d_k). MY
    DERIVATION: because V_k + V_k is not structured (no subgroup), the
    constraint at level k costs its density 2^{d_k - 131} in success probability
    while the list at that level costs its size in solves, and the total over
    all B and all d_k is at least l * C_3 / (2B) group-op equivalents, i.e.
    2^101 * C_3 at B = 2^27. The constraints do not COMPOSE the way Wagner's
    subgroup constraints do; Theorem C says precisely that they cannot.
    (C4) No filter at all: a plain two-list join over the group. With L_1
    stored half-sums, L_2 probes, sign and 131 conjugates matched for free,
    the expected number of matches is L_1 L_2 * 262 / 2^131 (uniform-sum
    heuristic H1), so one relation costs at least 2 * sqrt(2^131 / 262) =
    2^62.5 group operations at EVERY arity and EVERY base size, above rho
    before a single relation is counted. This is the sharp form of
    IDEA-20260808-2ef5c8's theta_MITM > (m-1)/2, and it is why (A)'s ideal
    tree is the only k-list object worth pricing.

    (D) THE ONE OPEN NUMBER: APPROXIMATE CAPACITY. What survives (B)-(C) is a
    cheap NON-homomorphic filter with level-1 bucket gain G(h) = M * max over
    (a, b, c) of Pr[h(P+Q) = c | h(P) = a, h(Q) = b] materially above 1 at
    alphabet M = N^{1/(j+1)}. KN-FIND-ffe1df measured this on E(F_p) (RT-EXP-1,
    8 toy primes, M = N^{1/3}): every cheap filter decayed with the SHA null,
    and its own red team recorded that the bucket-averaged theorems bound the
    wrong quantity and that the P2 control never demonstrated sensitivity at
    the M*T = 1 boundary. Nothing of the kind has been measured on a binary
    Koblitz curve, and the Koblitz-specific filter families are DIFFERENT:
    normal-basis Hamming weight of x (Frobenius-INVARIANT, hence a class
    function of the rho classes, and the distinguished-point predicate of
    Bailey et al., KN-LIT-661e97, whose parity is exactly Tr(x)); windows of x
    in normal basis and in polynomial basis; the Frobenius-canonical
    representative's leading window; the E/4E map composed with any of these.
    THE CLAIM STATED SO IT CAN FAIL: on toy Koblitz cells, the exact filters
    Tr(x) and the E/4E map read G = 2 and G = 4 to within sampling error (the
    positive controls that ffe1df lacked), every other named filter reads
    G - 1 within the random-label null's spread at M = N^{1/3} and N^{1/4}, and
    the excess DECAYS with n across the ladder. A filter with G - 1 growing
    with n, absent from the random-label null, and surviving the relabelled
    Z/lZ control (where the log-interval filter must read G about M/2 as the
    far-end positive control) is the LEAD branch, and it is exponent-relevant
    by (A).

    REPRESENTATION CLASS (RQ-ECDLP-623a32): R1, x-coordinates in normal and
    polynomial bases; the attack stage whose charged cost changes is the
    RELATION-DECOMPOSITION join, not membership or linear algebra.

  mechanism: >-
    OBJECT FRAME. Representation: R1, the x-coordinate of a point of the FULL
    group E(F_{2^131}) (order 4l), read in the type-II optimal normal basis of
    KN-LIT-661e97 where Frobenius is a cyclic shift, and in the polynomial
    basis F_2[z]/(z^131 + z^13 + z^2 + z + 1). Operation set Sigma: pairwise
    ADDITION OF LIST ELEMENTS at one merge level of a k-tree, i.e. translation
    by elements of one list, never by an arbitrary group element; together with
    Frobenius (cyclic shift on x in normal basis) and negation, under which
    every filter considered is required to be either invariant or equivariant.
    Sigma is not the full translation action on the target subgroup: the legs
    and intermediate sums live in E, whose block systems under translation are
    the cosets of 2E and 4E = G (IDEA-20260922-153a90).

    TRICHOTOMY. Two objects, placed separately. The EXACT filters (Tr(x), the
    E/4E map) are Class I partial-action objects: they propagate
    deterministically under all of Sigma because they are homomorphisms of E,
    and their whole content is the 2-bit block system of (B). Every
    NON-homomorphic candidate (normal-basis Hamming weight, coordinate windows,
    canonical-representative windows) is Class II BRANCHING: h(P+Q) is not a
    function of (h(P), h(Q)), and the measured quantity G(h) is exactly
    IDEA-20260802-002's branching meter read at one level, b = M / G.

    LOSSY-PROJECTION TEST AGAINST THE NAMED SIGMA. Every filter discards all of
    x but log2(M) bits, so it is lossy in the representation used (fibres of
    size about 4l/M). For the exact filters the discard is Sigma-compatible by
    homomorphism and the test PASSES with L = log2(M) in {1, 2}, b = 1. For the
    branching filters the discard is compatible only to the extent G(h) > 1,
    which is what the minimal test measures rather than assumes; a filter with
    G = 1 has b = M and carries nothing forward, exactly the "no propagation"
    end of the meter. The projection is not a change of coordinates in either
    case.

    THE PRICED OPEN NUMBER. For the branching object, (L, b) = (log2 M,
    M / G(h)) per filter, per level, measured on toy curves against the
    identity (G = M, trivially), the random-label null (G about 1), and the
    relabelled Z/lZ control (log-interval filter, G about M/2). The k-tree's
    per-attempt cost with a filter of gain G at each of j - 1 internal levels
    is, to first order, k * L * (M / G)^{(j-1)} for the same success
    probability, so the cost of (A)'s ideal tree scales as (M/G)^{j-1}; at
    k = 16, M = 2^25.8 and the exact capacity G = 4 the per-attempt cost is
    2^29.8 * 2^{3 * 23.8} = 2^101, which is the closure number.

    OFF-LIMITS COMPONENTS USED, NAMED. F2 (factor-base decomposition) is the
    family; the k-tree is a JOIN STRATEGY for its decomposition step, not a new
    factor base, so KN-OPEN-020 is engaged only through the orbit-union base
    inherited from KN-FIND-47da4e (implicit-membership class, charged there).
    F1 is not used. Theorem C is used as a component and extended from prime N
    to the composite ambient group in (B).

    WHY THIS IS NOT IDEA-20260922-faa8d2 (D). That record derives, for the
    top-k-bit truncation of x in a fixed basis, that b is near 2^k, and
    proposes to measure it on the pdp bottleneck. This record (i) states the
    EXACT capacity as a certificate, which no record in this corpus does for a
    binary curve; (ii) prices what a filter would be WORTH via (A), which
    converts "b near 2^k" from a defect report into a 26-bit gap with a stake;
    (iii) measures Koblitz-specific families (Frobenius-invariant weight,
    normal-basis windows) that faa8d2 does not name; and (iv) supplies the two
    exact positive controls at G = 2 and 4 that make a null reading
    admissible.

