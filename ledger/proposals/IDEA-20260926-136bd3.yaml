      proof obligation, not assumed.
    - Arithmetic only at deployed parameters; executable cells at n <= 31.

  proof_search_map:
    bottleneck: >-
      The level-1 bucket gain G(h) at alphabet M = N^{1/(j+1)} for cheap
      filters on E(F_{2^n}) for a Koblitz curve; every other quantity in the
      k-tree route is fixed by (A) and (B).
    baseline_embedding:
      parameter_slice: >-
        Z/2^n with h = the low log2(M) bits, and the relabelled Z/lZ control
        with h = top log2(M) bits of the discrete logarithm: both must read
        G near M (exactly M for Z/2^n, about M/2 for the log-interval key by
        the carry) -- Wagner's own setting reproduced. The composite-order
        Koblitz cell n = 17 (a = 0, #E = 4 * 137 * 239, my Lucas-sequence
        arithmetic t_17 = 101) must exhibit exact filters of alphabet 548 and
        956 reading G = M, the nearby object where the capacity is NOT 2 bits.
      reproduction_check: >-
        Symbolic: Theorem C on Z/2^n returns the subgroup 2^k Z/2^n filters,
        on Z/(4 * 137 * 239) returns alphabets {2, 4, 137, 239, 274, 478, 548,
        956, ...}, and on Z/4l returns {2, 4}. Frozen fixture: the instrument
        must report G = M on the exact filters of every cell and G = 1 + O(1/
        sqrt(M)) on the random label of every cell BEFORE any Koblitz-specific
        arm is read.
    observation_collision:
      observable: >-
        The pair (M, G(h)) per filter per cell, together with the decay of
        G - 1 along the n-ladder.
      distinct_preimage_search: >-
        Two objects share a high G reading: a genuine approximate homomorphism,
        and a filter whose MARGINAL is skewed (a heavy bucket makes max_c pi_c
        large with no propagation content -- exactly the popcount false
        positive of RT-EXP-1, reproduced by the matched-marginal shuffle).
        Separated by the matched-marginal shuffle control: shuffling h's
        values among points with the same marginal must destroy a genuine
        signal and preserve a marginal artifact. Reported for every arm.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The k-tree's filter requirement rewritten as a subgroup-index
          condition on the ambient group (B); encoding exact (Theorem C's
          argument is an equivalence for exact filters); completeness and
          soundness inherit from KN-FIND-ffe1df's validator-confirmed proof;
          transfer to any abelian group; cost loss none.
        predicted_gain: >-
          The exact-capacity column of the reachability table for ECC2K-130
          reads "2 bits, cofactor", with the ideal-tree stake of (A) as the
          column's ceiling; zero compute.
      - transform: observable_fiber
        proposed_object: >-
          Hold G(h) fixed and vary the forgotten structure: prime-order target
          (G <= 1 + o(1) for every cheap h, predicted), composite ambient E
          (G = 2, 4 exactly for the homomorphic h), composite toy n = 17
          (G = 548, 956 available). The intrinsic invariant is the subgroup
          lattice.
        predicted_gain: >-
          Makes the null reading on the prime-l cells admissible, because the
          same instrument reads the forced nonzero values on the nearby
          objects.
    quantifier_order: >-
      (B) FOR ALL finite abelian groups E and FOR ALL h: E -> [M] with a
      combining rule f such that h(P+Q) = f(h(P), h(Q)) for all P, Q and f
      invertible in each argument, M divides #E and h is a homomorphism; hence
      on ECC2K-130, M in {1, 2, 4} or M >= l. (D) FOR THE TESTED cells and the
      DECLARED filter families only: G(h) - 1 is within the random-label spread
      and decays in n. NOT CLAIMED: anything about undeclared filters, about
      target-dependent filters (uncovered in ffe1df too), or about levels
      >= 2 conditioned on level-1 survival.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On ECC2K-130 every exactly sum-compatible filter has alphabet at most
        4, and on toy Koblitz cells n in {19, 23, 29, 31} the declared
        Koblitz-specific filter families read level-1 bucket gain within
        [stated interval] of the random-label null at M = N^{1/3} and
        N^{1/4}, with the exact filters reading 2 and 4." It can NEVER
        certify that no cheap filter exists (the family is declared, hence
        incomplete), and it certifies nothing about the algebraic route.
      nearby_object_control: >-
        The composite-order n = 17 Koblitz cell (capacity above 2 bits) and the
        relabelled Z/lZ log-interval key (approximate filter with G about
        M/2): both must read high, or the instrument cannot see the object it
        is asserting the absence of on the prime-l cells.
    proof_obligations:
      - claim: Theorem C's quasigroup argument holds verbatim on a composite-order abelian group, giving M | #E.
        responsibility: correctness
      - claim: The E/4E map on y^2 + xy = x^3 + 1 is (Tr(x(P)), Tr(x(P/2))) and is well defined on 2E.
        responsibility: correctness
      - claim: The ideal-tree arithmetic of (A) at k in {8, 16} with and without orbit unknowns.
        responsibility: baseline
      - claim: The subspace-constrained-intermediate bound l * C_3 / (2B) of (C3).
        responsibility: runtime
      - claim: G(h) is estimated with a stated sample size and a bootstrap interval, and the matched-marginal shuffle is run for every arm.
        responsibility: correctness
      - claim: Nothing here bounds undeclared filters or the algebraic oracle.
        responsibility: scope

