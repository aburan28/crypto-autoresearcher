      minimum_effect: EXACTLY M within sampling error; the capacity theorem's positive control.
    - metric: G_for_the_log_interval_key_on_the_relabelled_ZlZ_control (dimensionless)
      direction: higher
      minimum_effect: about M/2 (top-bits additivity up to one carry); the approximate-filter positive control.
    - metric: ideal_tree_total_cost_at_k16_with_orbit_unknowns (log2 group operations, zero compute)
      direction: lower
      minimum_effect: >-
        2^47.6 versus rho 2^60.81, recomputed by a reviewer; a recomputation
        disagreeing by more than 1 bit localises an arithmetic error in this
        record.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): the capacity certificate (B), the ideal-tree
      table (A) at k in {4, 8, 16, 32} with and without orbit unknowns, and the
      (C3)/(C4) floors, all as exact expressions committed before any run.
      STAGE 1 (instrument gate): on every cell compute G(h) for h = identity
      (must read M), random label (must read 1 + O(M^{-1/2})), Tr(x) (2),
      E/4E (4), and on the composite n = 17 cell the alphabet-548 and -956
      homomorphisms (M). STAGE 2 (the measurement): for each declared
      Koblitz-specific family and each M in {N^{1/3}, N^{1/4}} rounded to a
      power of two, estimate G(h) from S sampled pairs (P, Q) uniform in E,
      report the bootstrap interval, run the matched-marginal shuffle, repeat
      on the ordinary-curve control cell and on the relabelled Z/lZ control.
      STAGE 3 (decay): fit G - 1 against N across n in {19, 23, 29, 31} per
      family; any family whose interval excludes the null at every n with a
      non-negative fitted slope goes to independent review before
      interpretation. No attack is run.
    cell:
      curve: >-
        PRIMARY: Koblitz y^2 + xy = x^3 + 1 (a = 0, b = 1) over
        F_2[t]/(t^19 + t^5 + t^2 + t + 1), the same field as the n = 19
        CERTBIN cell; my hand arithmetic gives #E = 2^19 + 1 - t_19 with
        t_19 = 797 (Lucas sequence t_{k+1} = -t_k - 2 t_{k-1}, t_0 = 2,
        t_1 = -1), i.e. 523492 = 4 * 130873, and 130873 passed trial division
        to 359 by hand -- the instrument MUST recompute the order and prove
        primality before use. LADDER: a = 0 Koblitz curves at n in {23, 29,
        31} with #E/4 prime, verified at setup (cells failing are reported and
        dropped). COMPOSITE CONTROL: a = 0 Koblitz at n = 17 (t_17 = 101,
        #E = 130972 = 4 * 137 * 239, my arithmetic). ORDINARY CONTROL: the
        n = 19 CERTBIN cell, A = 46693, B = 306147, h = 2 (DEC-20260926-901ea1
        as relayed by the brief). GENERIC CONTROL: Z/lZ with l = 130873,
        elements relabelled by a random bijection, plus the unrelabelled
        integer representation for the log-interval key.
      m: >-
        The join is priced at k = m in {8, 16} on ECC2K-130 (stake); the toy
        measurement is level-1 (two lists) and is arity-free.
      l: not applicable (no subspace factor base; lists are uniform samples of E)
      factor_base: >-
        none for the measurement; for the stake, an orbit-union base of size
        L = 2^25.8 (k = 16) or 2^32.25 (k = 8).
      targets: >-
        S = 2^20 uniform pairs (P, Q) in E per cell per filter per M (bootstrap
        over 1000 resamples); on n = 31, S = 2^18.
      seeds: enumerated 0..9 per cell, recorded; no random 64-bit seeds.
      alphabet: M in {2^6, 2^5} at n = 19 (N^{1/3}, N^{1/4}), scaled per cell.
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py (binary group law; reused pattern)
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py (fixed at n = 17; a general-n variant of about 150 lines is NEW, pure Python)
      - 'NEW: normal-basis conversion for the a = 0 Koblitz cells (type-II ONB existence at each n verified at setup; if absent at some n, use a random normal basis), point halving, the E/4E map, the filter families, the bucket-gain estimator with bootstrap and the matched-marginal shuffle (about 400 lines, pure Python)'
      - 'missing: none (no solver is needed); a Z/lZ arithmetic module is trivial'
    procedure:
      - 1. Build each cell; recompute #E, verify 4 * prime (or the declared composite), verify the 2-Sylow is cyclic by finding a point of order 4.
      - 2. Stage 1 gate on every cell; stop if any exact filter misreads.
      - 3. Stage 2 estimation for each (cell, family, M), with the shuffle.
      - 4. Ordinary and Z/lZ controls with the same code paths.
      - 5. Stage 3 decay fit; write the outcome table.
    metrics:
      - name: G(h)
        unit: dimensionless (ratio of max conditional bucket probability to 1/M)
        definition: M * max over (a, b, c) of the empirical Pr[h(P+Q) = c | h(P) = a, h(Q) = b], with cells (a, b) of fewer than 100 samples excluded and the exclusion count reported
      - name: G_shuffle(h)
        unit: dimensionless
        definition: the same statistic after permuting h's values among points with equal marginal bucket probability
      - name: slope_G
        unit: dimensionless (fitted exponent of G - 1 in N)
        definition: least-squares fit of log(G - 1) against log N across the ladder, with interval
      - name: cost
        unit: group operations and wall-clock seconds
        definition: additions performed per cell, reported
    controls:
      - IDENTITY and RANDOM-LABEL calibration on every cell (blocking).
      - EXACT POSITIVE CONTROLS Tr(x) at G = 2 and E/4E at G = 4 on every prime-l cell (blocking).
      - COMPOSITE-ORDER POSITIVE CONTROL n = 17 with alphabets 548 and 956 (blocking for the capacity theorem).
      - ORDINARY-CURVE CONTROL (n = 19 CERTBIN curve, no Frobenius); Frobenius-invariant families are undefined there and the coordinate families must read the same null.
      - RELABELLED Z/lZ GENERIC CONTROL, with the log-interval key as the far-end positive control (G about M/2) and the relabelled coordinate windows as a null.
      - MATCHED-MARGINAL SHUFFLE on every arm (the artifact tell of RT-EXP-1).
      - DECAY LADDER across four n (the structural tell of docs/inventor-protocol.md section 3).
    outcomes:
      positive: >-
        Some declared family has G - 1 with interval excluding the null at
        every n, non-negative slope, and survives the shuffle: an approximate
        sum-compatible filter on a Koblitz curve; by (A) it is
        exponent-relevant; route to independent review, no further claim.
      negative: >-
        Every declared family reads within the null and decays; the exact
        filters read 2 and 4; the composite control reads its alphabet: the
        k-tree column on ECC2K-130 is closed for these families with the
        mechanism "exact capacity 2 bits, approximate capacity indistinguishable
        from a random label at toy scale", and the ideal-tree stake stays as
        the column's ceiling.
      artifact: >-
        A high G that the shuffle reproduces, or that does not decay, or a
        misread exact control: reported as a controlled null or an instrument
        defect, never as structure.
    falsification_threshold: >-
      Stated before any run: LEAD requires G - 1 >= 3 times the random-label
      bootstrap width at M = N^{1/3} on every prime-l cell AND fitted slope
      >= 0 with interval excluding negative values AND G_shuffle - 1 below
      the null width. Anything else is the negative or artifact row.
    estimated_cost:
      implementation: medium
      compute: >-
        ESTIMATE, order of magnitude: about 2^20 additions per (cell, family,
        M) times about 12 families times 2 alphabets times 5 cells, roughly
        2^27 binary-curve additions in pure Python, hours on one core; the
        shuffle doubles it.
    controls_summary_for_schema:
      - see controls above
    required_metrics:
      - G(h), G_shuffle(h), bootstrap intervals, per cell, family, M
      - exact-control readings (2, 4, 548, 956) per cell
      - slope_G per family with interval
      - sample sizes and excluded-cell counts
      - termination_reason (completed | timeout | crash)

  falsification_conditions:
    - >-
      An exactly sum-compatible filter on a prime-l Koblitz cell with alphabet
      strictly between 4 and l, exhibited with a combining rule verified
      exhaustively: (B) is false and this record is withdrawn.
    - >-
      Tr(x) or the E/4E map fails to read G = 2 or 4 on any prime-l cell:
      instrument defect; nothing else is read.
    - >-
      The composite n = 17 control fails to read G = M on its alphabet-548 or
      -956 homomorphism: the instrument cannot see capacity and no null is
      admissible.
    - >-
      A declared family meets the LEAD threshold: the predicted null is
      falsified and the route is live; this is the most valuable outcome.
    - >-
      Recomputation of the ideal-tree table disagrees with (A) by more than
      1 bit: arithmetic error in this record, corrected before use.

  confounders:
    - >-
      MARGINAL SKEW. Weight-based filters have highly non-uniform marginals
      (binomial in the weight), which inflates max_c pi_c with no propagation
      content; the matched-marginal shuffle is the only defence and is
      mandatory, following RT-EXP-1's popcount false positive.
    - >-
      SMALL-CELL STATISTICS. At M = N^{1/3} and S = 2^20 pairs, each (a, b)
      cell of the conditional table has about S/M^2 samples (2^8 at n = 19,
      M = 2^6); cells below 100 samples are excluded and the count reported;
      the bootstrap interval is the reported uncertainty.
    - >-
      NORMAL-BASIS AVAILABILITY. A type-II optimal normal basis exists only
      for some n; where absent, a random normal basis is used and the
      Frobenius-as-shift property still holds, but the specific Bailey
      predicate is not reproduced; recorded per cell.
    - >-
      TOY-TO-131 TRANSFER. A null at n <= 31 is not a null at n = 131; the
      decay ladder is the only transfer evidence and it is heuristic H2.

  interpretation_limits:
    - >-
      NO ATTACK. The record certifies a capacity, prices a stake, and measures
      a control. Its predicted outcome is a closure of the k-tree column for
      the declared families with a named exact obstruction.
    - >-
      KN-OPEN-020 CLASS: the orbit-union base used in the stake is
      implicit-membership (KN-FIND-47da4e); the filter measurement uses no
      factor base.
    - >-
      Levels >= 2 of a tree are not measured (inputs conditioned on level-1
      survival); a level-1 null is strong evidence, not a proof, exactly as
      KN-FIND-ffe1df records for the prime field.
    - >-
      Target-dependent filters (h depending on R) are declared out of the
      family and named as the widest open class, following ffe1df item 9.
    - >-
      FORWARD GUIDANCE regardless of outcome: the only k-list objects not
      priced here are (i) filters that read the DISCRETE LOG (closed by
      definition), (ii) target-dependent filters, (iii) algebraic joins that
      are not rectangle covers (390ccc's item (d)), the last being the chained
      Semaev system, which is SEMBIN's.

  heuristic_assumptions:
    - id: H1
      statement: >-
        UNIFORM SUMS. For lists L_1, L_2 of distinct group elements drawn
        without structure from E(F_{2^131}), the number of pairs with
        S + T in a fixed set of 262 targets is Binomial(L_1 L_2, 262/2^131)
        to first order; this is the classical birthday/occupancy law and
        underlies (C4)'s floor and (A)'s list sizes.
      rigorous_support: >-
        The mean is exact by double counting (KN-FIND-007's identity applied
        to pair sums); the Binomial shape is the heuristic, as in every
        van Oorschot-Wiener analysis this program uses.
      validation_plan: >-
        SAMPLE: on the n = 19 cell, 200 independent list pairs at L_1 = L_2 =
        2^8, exact match counts against 262 targets. COMPARISON: chi-squared
        against Binomial. TAIL: maximum count against the Binomial tail.
        TRANSFER: none claimed beyond toy n; the floor at n = 131 is arithmetic
        on the mean only.
    - id: H2
      statement: >-
        DECAY TRANSFER. A filter family whose G - 1 is within the random-label
        spread and non-increasing in N over n in {19, 23, 29, 31} has
        G - 1 = O(N^{-c}) for some c > 0 at n = 131, i.e. no usable gain.
      rigorous_support: >-
        For x-based interval and bit-window filters on prime-field curves,
        KN-FIND-ffe1df's Theorem A-prime bounds the agreement by 1/M plus a
        Weil-type term O(p^{-1/2}) at level 1 (conditional on H1-prime there,
        largely untraced); no binary-field analogue is cited here. The
        classical statement imitated is square-root cancellation of character
        sums along the curve. H2 is the weakest link and is measured, not
        assumed.
      validation_plan: >-
        SAMPLE: the four-cell ladder itself, per family. COMPARISON: fitted
        slope of log(G - 1) in log N with interval; the SHA-style random label
        as the reference decay. TAIL: the largest single-cell excess against
        the null's maximum over 1000 resamples. TRANSFER ASSUMPTION, stated: a
        slope measured over 12 bits of N (19 to 31) is extrapolated 100 bits
        only as a heuristic and never as a bound.

  heuristic_note: >-
    (B) is unconditional. (A) is arithmetic under H1's mean, which is exact.
    (D)'s null prediction is the record's falsifiable content and rests on H2,
    which the ladder measures. The a-priori expectation, stated so it cannot
    be chosen after the fact: exact controls read 2 and 4, every declared
    family reads the null, and the column closes with the 26-bit gap as its
    obstruction.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED. CONDITIONAL STAKE ONLY: an ideal 16-list tree
      with a 2^25.8-alphabet filter at three internal levels would give total
      cost 2^47.6 with orbit unknowns (2^55.6 without) against rho's 2^60.81;
      the exact capacity is 4, at which the same tree costs about 2^101 per
      attempt. The record's predicted outcome moves no exponent.
    memory_exponent: >-
      The stake's memory is k lists of L points, about 2^30 points at k = 16
      (about 16 GB), disclosed; the measurement stores 2^20 pairs per cell.
    best_known: >-
      Matched rho with negation and the 131-fold Frobenius class, 2^60.81
      iterations (KN-FIND-aa2efc; KN-LIT-661e97 quotes 2^60.9).
    hidden_overhead: >-
      The k-tree accounting hides sort/hash polylogs and the m! symmetry of
      multisets; at k = 16 that is at most a few bits and is inside the 13-bit
      margin of the stake, disclosed rather than absorbed.
    tradeoff_note: >-
      A filtered tree trades memory (k lists) for time and parallelises across
      lists; the closure number (2^101 per attempt at capacity 4) is
      insensitive to any memory choice. Van Oorschot-Wiener applies to rho, not
      to the tree.

  estimated_cost:
    implementation: medium
    compute: low
    qualification: >-
      Stage 0 is arithmetic. Stages 1-3 need a general-n binary field module,
      normal-basis conversion, point halving and the estimator, all pure
      Python, a few hundred lines; hours of compute on one core at the sample
      sizes declared; no solver.

  asymptotic_claim:
    problem: ECDLP on ECC2K-130 by a filtered k-list decomposition oracle
    prior_best: matched rho 2^60.81 (KN-FIND-aa2efc); plain two-list join floor 2^62.5 per relation (this record, C4)
    time_exponent: 'conditional on a filter that does not exist by (B): 2^47.6 at k = 16; unconditionally, no change'
    memory_exponent: k lists of N^{1/(j+1)} points for the conditional stake; O(1) for rho
    hidden_cofactor: sort/hash polylogs and m!, a few bits
    claim_kind: capacity_certificate_plus_control_measurement

  dominated_by: >-
    n/a (no attack claimed), checked row by row: matched rho with negation and
    Frobenius classes (2^60.81, O(1) memory per walk) dominates every k-list
    construction priced here on time at every memory budget, because the
    plain join floor is 2^62.5 per relation (C4) and the filtered tree at the
    exact capacity costs 2^101 per attempt; BSGS (2^64.5, 2^64.5) is dominated
    by rho; multi-target and preprocessing rows are untouched (single target,
    no advice). The conditional stake in (A) would dominate rho on time only if
    a 26-bit filter existed, which (B) excludes exactly and (D) tests
    approximately. No row was left unchecked.

  sota_delta:
    time: >-
      Zero. Two new numbers for the corpus: the exact filter capacity of
      ECC2K-130 (2 bits) and the ideal-tree stake (2^47.6 at k = 16 with orbit
      unknowns, 13 bits below rho), which together state the k-tree column's
      gap as 26 bits per level, replacing "closed by Theorem C" with a
      quantity.
    memory: none.
    data_queries: none; single target, no advice.

  frontier_check:
    status: pending
    note: >-
      Whether approximate sum-compatible filters have been measured on binary
      or Koblitz curves in the published literature was not checked (no web
      search). Wagner 2002 is recalled. A coordinator literature check on
      k-tree applications to ECDLP over binary fields is recommended before
      any part is called novel.

  recommended_priority: medium
  priority_rationale: >-
    The predicted outcome is a closure with a named, exact obstruction and a
    quantified gap, which is what the k-tree column of the reachability table
    needs; the LEAD branch, though low-prior, is exponent-relevant by (A) and
    would break the challenge, which is why the measurement carries exact
    positive controls at both ends. Medium rather than high because
    KN-FIND-ffe1df's prime-field null makes the null here the strong
    expectation, and because the record moves no exponent in its expected
    branch.

  first_deliverable: >-
    Stage 0: the capacity certificate (B) and the ideal-tree table (A) as a
    committed analysis note with the arithmetic re-run in Python; then Stage 1
    on the n = 19 Koblitz cell (order and primality recomputed, exact
    controls read).

  next_gate: >-
    Coordinator decision on whether Stages 1-3 are designed into an
    EXP-BINSTD-* contract, and whether the capacity certificate is filed as a
    table column now.

  discriminated_from: >-
    KN-FIND-ffe1df measures cheap filters on E(F_p) and proves Theorem C for
    prime N; this record transplants the question to binary Koblitz curves,
    extends the theorem's argument to the composite ambient group to get an
    EXACT 2-bit capacity, prices what a filter would be worth at ECC2K-130's
    size with orbit unknowns (the 13-bit stake), and adds exact positive
    controls ffe1df's red team said its P2 control lacked. IDEA-20260922-faa8d2
    predicts near-maximal branching for one truncation filter on the pdp;
    this record measures named Koblitz families with controls and states the
    stake. H-ICEX-ce1915 / IDEA-20260808-2ef5c8 compare 2-way and 4-way
    splits end to end on prime-order groups; this record measures the
    per-level filter gain, which is the quantity the split comparison
    integrates. IDEA-20260922-153a90 states the block-system fact on legs
    versus targets; this record is its consequence for k-tree intermediates,
    with the number 2 bits attached. IDEA-20260922-845a77 is the plain
    two-list join; its per-relation floor is (C4) here.

