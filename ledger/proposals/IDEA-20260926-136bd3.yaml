      needs only that the proper subgroups have index in {2, 4, l, 2l, 4l}.
    - >-
      The k-tree accounting of (A) assumes independent uniformly random lists
      and a filter with G = M at every internal level; it is the IDEAL bound
      and is used only to state the stake.
    - >-
      OFF-LIMITS COMPONENT DECLARED: F2 is the family. Theorem C
      (KN-FIND-ffe1df) is used as a component and its argument re-run on a
