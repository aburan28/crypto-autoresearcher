  batch: EC-STRUCTURE-20260825
  cluster: 'C3-factor-base: what ''algebraically described'' actually bounds'
  title: 'THE BEZOUT NO-GO BOUNDS DESCRIPTION DEGREE, NOT ''ALGEBRAIC FACTOR BASES'': the preimage of
    a bounded-degree base under a degree-l isogeny is algebraic of degree O(l d) on E, so the no-go''s
    constant is NOT isogeny-invariant -- price l against the gain and find out whether description degree
    and yield are the same currency'
  class: mechanism
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: That pullback multiplies degree is elementary and recalled. The proposed contribution
    is the observation that the ledger's no-go is stated as a bound on a CLASS of factor bases when it
    is really a bound in a PARAMETER, and the experiment that separates the two.
  claim:
    semantic_part: 'For an l-isogeny phi: E -> E'' and a factor base S'' on E'' described by a polynomial
      of degree d, the preimage phi^(-1)(S'') is described on E by a polynomial of degree O(l d) and is
      a legitimate algebraic factor base, so the no-go bounds the description degree rather than excluding
      an entire family.'
    evaluator_part: 'Unestablished: whether description degree and decomposition yield move together one-for-one.
      If they do, the isogeny buys nothing and the no-go is robust; if they do not, the isogeny is a cheap
      dial the program has never turned.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - Construct S' of degree d on an l-isogenous curve, pull it back, and measure the resulting base's size,
    description degree, membership-test cost, and decomposition yield on E.
  - Compare against a DEGREE-MATCHED algebraic base constructed directly on E (same O(l d) description
    degree, no isogeny), which is the control that decides whether the isogeny contributes anything beyond
    degree.
  - 'Charge everything: constructing phi, evaluating it or its dual on each candidate, and the membership
    test at the higher degree.'
  - Report the two-variable surface (description degree, yield) rather than a single ratio, because the
    whole question is whether the two variables are independent.
  lossy_projection_test:
    tracked_object: membership in an algebraically described subset of E
    what_is_discarded: the point's identity beyond the membership bit
    propagation: 'one-sided: membership propagates through the group law only via the summation relation,
      which is what index calculus exploits'
    verdict: PASSES, and is the standard index-calculus object; the record's content is a new way of PARAMETERIZING
      it, not a new object.
  predictions:
  - id: P1
    status: established_formula
    statement: The preimage of a degree-d locus under a degree-l isogeny is described by a polynomial
      of degree O(l d).
  - id: P2
    status: unestablished
    statement: Decomposition yield of the pullback matches that of a degree-matched base built directly
      on E, to within the measured null band.
  - id: P3
    status: unestablished
    statement: Total charged cost of the pullback route strictly exceeds the direct route by the cost
      of evaluating phi.
  minimal_discriminating_test:
    status: specified_not_run
    test: Toy curves; small l in {3, 5, 7}; measure |S|, description degree, yield and full charged cost
      for pullback versus degree-matched direct bases, with several isogenies per l.
    pass: 'Yield is a function of description degree alone: P2 holds and the isogeny dial is confirmed
      to be redundant.'
    fail: 'Yield differs at matched description degree: the isogeny contributes structure beyond degree,
      which is a positive and would need independent replication.'
  controls:
  - Degree-matched direct base on E (the decisive control).
  - Random subset of E of matched size, as the yield baseline.
  - The dual isogeny direction, to check the effect is not an artifact of one isogeny's kernel.
  confounders:
  - Not charging the evaluation of phi is the obvious way to manufacture a false positive.
  - Different isogenies of the same degree can give different bases; l alone does not determine the base.
  - Toy-scale yields are dominated by small-number effects; the null band must be measured, not assumed.
  falsification:
    semantic: Equal yield at matched description degree across all tested l closes the pullback family
      for those l.
    evaluator: A charging error scopes out the affected cells only.
    not_falsification: Failure to construct an isogeny of a requested degree.
  why_this_is_not_a_variant: IDEA-20260801-021 and KN-OPEN-020 state the bounded-degree obstruction and
    its algebraic-degree generalization. Neither varies the description degree against the yield as an
    experimental variable, and neither notices that the bound's constant moves under pullback. This record
    makes description degree an independent variable, which is what would turn a stated bound into a measured
    one.
  limits:
