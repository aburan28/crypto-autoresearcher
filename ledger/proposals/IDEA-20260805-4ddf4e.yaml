idea:
  id: IDEA-20260805-4ddf4e
  question_id: RQ-XEDN-003
  added: '2026-08-05'
  title: >-
    The XEDN coefficient observable is pinned at the floor of its own range:
    a lattice-forcing audit showing max_|coeff| can take only the two values
    1 and undefined, and that the declared falsifier (inf-norm >= 4) is
    unreachable by the instrument that was run
  class: control

  claim: >-
    On the surface family the XEDN lane censused -- y^2 = x^3 + a(t)x + b(t)
    over F_p(t) with deg a <= 4 and deg b = 6 -- the associated elliptic surface
    over P^1 has arithmetic genus chi = 1 (a RATIONAL elliptic surface), and for
    squarefree b every fibre is irreducible, so the Shioda height of a section
    with polynomial x of degree <= 2 and polynomial y of degree <= 3 is exactly
    2. Those sections are therefore the NORM-2 VECTORS (roots) of the
    Mordell-Weil lattice, which for this chi is a sublattice of E8. The census
    enumerates every such section exhaustively, so the observed set is SATURATED
    (closed under "if r and s are observed roots with <r,s> = -1 then r+s is an
    observed root"). Two consequences follow by elementary root-system algebra,
    with no arithmetic input and no dependence on p, on deg a, or on the surface:
    (i) if the observed set is not pairwise orthogonal, an inf-norm-1 relation
    EXISTS; (ii) if it is pairwise orthogonal it is A1^r, its relation lattice is
    zero, and NO relation exists. Hence the primary metric of
    EXP-XEDN-003/004/005 -- min over relations of the infinity norm -- takes the
    value 1 or the value "undefined", and no third value, on every surface in the
    tested window. The reported "max_|coeff|(p) = 1 at p in {7,13,19,31}, slope
    vs log p = 0.0, CI [0,0]" is that structural dichotomy, not a measurement of
    p. Separately and independently, the instrument as implemented CANNOT emit
    the value that H-XEDN-004 nominates as its falsifier: the primary search
    experiments/EXP-XEDN-005/implementation/run_census.sage,
    shortest_relation_group_law(E, pts), runs with coeff_bound = 3 and
    max_support = 3 plus a support-4 arm restricted to coefficients in {-1,+1},
    and returns immediately on the first inf-norm-1 hit. A verified shortest
    relation of infinity norm >= 4 is outside its search space by construction.
    THIS PROPOSAL CLAIMS NO RESULT. It proposes the audit that decides whether
    the above derivation is right, and it is designed so that being wrong is the
    most interesting outcome.

  object_first_candidate:
    tracked_object: >-
      NOT the integer relation vector, and not its infinity norm. The tracked
      object is the ROOT SUBSYSTEM Phi_p(S) generated by the F_p-rational free-x
      sections of the surface S: a finite subset of the 240 roots of E8, closed
      under negation, carrying a Dynkin type (a multiset of ADE components), a
      rank r, a positive-root count N, and a marking. This object is followed
      through the computation section-enumeration -> Shioda Gram -> relation
      lattice -> reported scalar. The lane's metric is the LAST projection of
      this object, and the audit's thesis is that the information dies at that
      last step and not before: Phi_p(S) genuinely varies across surfaces
      (candidate types A1^k, A2, A2+A1, A3, A4, D4, A2^3 appear among the
      committed slot counts), while its image under "infinity norm of the
      shortest relation" is constant.
    established_families_off_limits: >-
      Declared off-limits as the primary lens for this proposal, so that the
      candidate cannot regress into a renamed variant of them: (1) index
      calculus / factor-base relation collection over E(F_p); (2) Semaev
      summation polynomials and Groebner solving-degree instrumentation;
      (3) Silverman's original xedni calculus as a lift to Q, together with the
      Jacobson-Koblitz-Silverman-Stein-Teske refutation route; (4) descent,
      Selmer and Cassels-Tate machinery; (5) isogeny-graph, CM and class-group
      structure transfers; (6) generic-group / Shoup lower-bound arguments;
      (7) Pollard rho, kangaroo and any birthday-family collision search. The
      Mordell-Weil-lattice family is NOT off-limits, deliberately: this proposal
      does not propose an attack inside it, it audits a measurement this program
      already made inside it, which is the one move the off-limits rule does not
      forbid.
    newness_score: >-
      LOW as an observation, HIGH as an unconsumed one, and this record states
      that plainly rather than dressing it up. The identification is ALREADY IN
      THE CORPUS: ledger/decisions/DEC-20260724-021.yaml, limitations, third
      bullet, states verbatim -- "The counted sections are in fact height-2 roots
      of the E_8 Mordell-Weil lattice, so their relation coefficients are
      absolutely bounded -- meaning the census measured a different obstruction
      from the one the literature says is binding." That sentence was written on
      2026-07-24. Three goals (GOAL-XEDN-001, -002, -003) then measured exactly
      the quantity it says is absolutely bounded, and none of the resulting
      records -- EV-XEDN-002/003/004/005/006, KN-FIND-005, KN-FIND-010,
      KN-FIND-011 -- cites it, derives the bound, or states the constant. What is
      new here is therefore not the observation but four things it was never
      turned into: the exact two-valued DICHOTOMY (1 or undefined, no third
      value); the identification of "undefined" with the A1^r case, which makes
      the silently-dropped surfaces informative rather than missing; the
      demonstration that the declared falsifier is outside the implemented search
      space; and the replacement observable (the Dynkin type of Phi_p(S)), which
      is not constant.
    testability_score: >-
      Very high and nearly free. Stage 1 is pen-and-paper plus a pure-Python E8
      construction (240 roots from the standard coordinate model, integer
      arithmetic, seconds). Stage 2 re-analyses ARCHIVED, COMMITTED slot data
      from EXP-XEDN-005 and EXP-XEDN-007 with no new curve generation. The
      environment supports it: numpy 2.4.6 imports, sympy and sage do NOT (both
      measured in this session), and the frozen predicate module
      experiments/EXP-XEDN-001/xedni_sections.py (sha256
      76f0cfe2f32362ff1110fc7c7b42db40d293099ae7718927c46223a42450b34f) is pure
      Python and imports cleanly, so the enumeration side needs no CAS.
    survival_score: >-
      The root-system dichotomy survives exactly as far as its three premises:
      chi = 1, all fibres irreducible, and every observed section of height 2.
      It dies the moment any of them fails -- which is why the null arm is a
      chi = 2 family and why the archived planted control (which reported
      max_|coeff| = 2, a value the dichotomy forbids) is promoted to a primary
      falsifier rather than a footnote.

  mechanism: >-
    DERIVED HERE. Every step is labelled either DERIVED (re-derived in this
    record from definitions) or RECALLED, UNVERIFIED (model memory, a candidate
    to check, never an authority), and every RECALLED step is a stage of the
    experiment.

    STEP 1 -- THE SURFACE IS RATIONAL ELLIPTIC. [DERIVED, modulo the standard
    classification, RECALLED] For y^2 = x^3 + a(t)x + b(t) with a, b polynomials,
    the minimal Weierstrass model over P^1 has arithmetic genus
    chi = ceil(max(3 deg a, 2 deg b) / 12). With deg b = 6 and deg a <= 4 this is
    ceil(12/12) = 1, so the surface is a RATIONAL elliptic surface. The entire
    XEDN window (GOAL-XEDN-001: deg a = 0; -002: deg a <= 4; both at deg b = 6)
    sits at chi = 1 and only there.

    STEP 2 -- THE HEIGHT OF A FREE-X SECTION IS 2. [DERIVED from the Shioda
    formula, which is itself RECALLED, UNVERIFIED but is ALSO STATED IN THIS
    CORPUS by DEC-20260724-021's own next_actions: "<P,P> = 2, <P,Q> = 1 - (P.Q),
    with chi = 1, (P.O) = 0, all fibres irreducible for squarefree b".] Shioda's
    height is hhat(P) = 2 chi + 2 (P.O) - sum_v contr_v(P). For an INTEGRAL
    section (x and y polynomial) the section meets the zero section nowhere in
    the affine chart, so (P.O) = 0; when the discriminant 4a^3 + 27b^2 is
    squarefree every fibre is irreducible (type I1), every contr_v vanishes, and
    hhat(P) = 2 chi = 2 exactly. So every free-x slot the lane enumerates is a
    NORM-2 vector of the Mordell-Weil lattice, i.e. a ROOT. For chi = 1 with
    irreducible fibres that lattice is E8 (rank 8, 240 roots) over the algebraic
    closure; the F_p-rational part is the Frobenius-fixed sublattice.

    STEP 3 -- THE OBSERVED SET IS SATURATED. [DERIVED from the code, read.]
    enumerate_slots_frozen_mod in EXP-XEDN-005 loops x0, x1, x2 over ALL of F_p^3
    and keeps every (x, y) passing the frozen square predicate. It is therefore
    an exhaustive enumeration of the F_p-rational sections of that shape, and the
    resulting set Phi_p(S) (after restoring the +/- pairs the code canonicalises
    away) is closed under every operation that produces another section of the
    same shape. In particular, if r and s are observed roots with <r,s> = -1 then
    r + s is a root of the same lattice, is again an integral section with
    deg x <= 2, and is therefore ALSO observed. Saturation is a property of the
    enumeration, not an assumption about the surface.

    STEP 4 -- THE DICHOTOMY. [DERIVED, elementary, and this is the whole
    mechanism.] Let Phi be a finite saturated set of roots in a positive-definite
    lattice, closed under negation, with rank r and N positive roots. Phi is a
    root system; being inside E8 it is simply laced, so its irreducible
    components are of type A, D or E. For each irreducible type the pair
    (rank, number of positive roots) is (1,1) for A1, (k, k(k+1)/2) for Ak,
    (k, k(k-1)) for Dk, (6,36) for E6, (7,63) for E7, (8,120) for E8. Every
    irreducible type OTHER THAN A1 has strictly more positive roots than its
    rank. Hence N = r if and only if every component is A1, i.e. Phi = A1^r is
    pairwise orthogonal. Two cases, exhaustive:
      CASE O (N = r): the positive roots are pairwise orthogonal, hence linearly
      independent, hence the relation lattice is {0} and NO nonzero relation
      exists. The instrument reports max_abs_coeff = null.
      CASE R (N > r): some component is not A1; being simply laced and connected
      it has two simple roots alpha, beta with <alpha, beta> = -1, so
      gamma = alpha + beta has norm 2 + 2 - 2 = 2 and is a root of the same
      component, hence (Step 3) is observed. Then alpha + beta - gamma = 0 is a
      verified relation of support 3 with coefficient vector (1, 1, -1) and
      infinity norm 1. Since 1 is the minimum possible infinity norm of a nonzero
      integer vector, the reported minimum IS 1.
    THEREFORE max_|coeff| in {1, undefined}, identically, for every p, every
    deg a <= 4, every deg b <= 6 surface with squarefree discriminant, and every
    section-rich stratum. The metric sits at the FLOOR of its range wherever it
    is defined. A quantity pinned at the boundary of its own range across every
    condition is the canonical control-that-cannot-fail; the slope-vs-log-p of
    such a quantity is 0 by arithmetic, not by measurement, and the reported
    CI [0,0] is the tell.

    STEP 5 -- WHERE THE ELIGIBILITY FILTER PUTS ITS THUMB. [DERIVED from the
    code, read.] EXP-XEDN-005 does not sample surfaces from the family. Its
    sampler fiber_find_rich_surfaces draws two candidate sections (x1,y1),
    (x2,y2) and SOLVES a = ((y1^2 - x1^3) - (y2^2 - x2^3)) / (x1 - x2),
    b = y1^2 - x1^3 - a x1, keeping the pair when a is a polynomial of degree
    <= 4 and deg b = 6. Every surface in the census is therefore a
    two-section-PLANTED surface: conditioned on Phi_p(S) containing at least two
    roots. Eligibility then requires >= 2 slots, and the protocol thickens p = 31
    to 10 eligible surfaces. Conditioning on a large Frobenius-fixed root
    subsystem is conditioning on CASE R, which is where the metric is forced to
    1. This is not an accusation of error -- the conditioning is disclosed as
    "source: fiber_over_sections" in the raw results -- it is the observation
    that the design and the metric select the same stratum, so the measurement
    cannot separate them.

    STEP 6 -- THE FALSIFIER IS OUTSIDE THE SEARCH SPACE. [DERIVED from the code,
    read.] H-XEDN-004's falsification condition is "any eligible surface has a
    verified shortest relation with infinity-norm >= 4". The primary instrument
    is shortest_relation_group_law(E, pts, coeff_bound=3, max_support=3): it
    enumerates supports of size 2 and 3 with nonzero coefficients in [-3, 3],
    returns at the first infinity-norm-1 hit, and then tries supports of size 4
    with coefficients in {-1, +1} only. No path through that function can return
    a value >= 4. The only route to a value >= 4 is the height-Gram LLL fallback,
    which fires only when the group-law search returns None, and which
    EXP-XEDN-005's own specification designates "Gram diagnostic only". So the
    declared falsifier is unreachable through the declared primary metric. This
    is a statement about the instrument, provable by reading it, and it is
    independent of Steps 1-4: even if the root-lattice derivation is wrong, this
    one stands.

    STEP 7 -- THE PAIRING THAT WAS BUILT IS NOT THE PAIRING THAT WAS ORDERED.
    [DERIVED from the code, read.] DEC-20260724-021's next_actions specify the
    SHIODA height Gram, <P,P> = 2 and <P,Q> = 1 - (P.Q). The implemented
    height_gram builds G from h_naive(P) = max(deg num x_P, deg den x_P) with
    off-diagonal (h(P+Q) - h(P) - h(Q))/2. The naive degree height is not the
    canonical height and its polarisation is not bilinear, so the rank and kernel
    of that matrix are not the rank and relation lattice of the Mordell-Weil
    span. The committed data shows the two disagreeing: surfaces are recorded
    with corank 0 (empty kernel) and a group-law-verified relation nonetheless,
    and with max_abs_coeff_gram of 2 or 4 while the group-law value is 1. The
    audit's Stage 2 replaces the naive Gram with the Shioda pairing the decision
    actually prescribed.

    WHAT COULD BE WRONG, STATED BEFORE THE RUN. The dichotomy needs all three
    premises. If b (equivalently the discriminant) is not squarefree, fibres can
    be reducible, contr_v > 0, and hhat < 2: the section is then a NON-root
    vector of E8 or of a smaller Mordell-Weil lattice, and the dichotomy does not
    apply. The committed data records b_squarefree = false on at least one
    censused surface and records h_naive sets {0,1,2} and {1,2} on others, so the
    pure-root stratum is NOT all of the census. Most sharply: the archived
    planted control in EXP-XEDN-005 reports max_abs_coeff = 2 with 3 slots and a
    passing 20/20 specialisation check -- a value the dichotomy says cannot occur
    among saturated roots with support <= 3, since 2 r1 = r2 + r3 with all three
    of norm 2 forces <r2,r3> = 2, i.e. r2 = r3. Either that control violates a
    premise (reducible fibre, or a section of height /= 2), or the derivation
    above is wrong. Resolving that single archived number is the audit's sharpest
    stage and it costs no new curve compute.

  novelty_status: unverified

  literature_context:
    - >-
      Shioda, "On the Mordell-Weil lattices" (Comment. Math. Univ. St. Pauli,
      circa 1990) and Oguiso-Shioda on the Mordell-Weil lattices of rational
      elliptic surfaces. NOT READ -- relayed claim from model memory. What is
      RECALLED, UNVERIFIED: that a rational elliptic surface with no reducible
      fibres has Mordell-Weil lattice E8 under the height pairing; that
      hhat(P) = 2 chi + 2(P.O) - sum_v contr_v(P); and that the 240 minimal
      sections are exactly those with x a polynomial of degree <= 2 chi. None of
      these is cited as an authority here. Stage 1 of the experiment must either
      obtain a primary source or replace the recalled statements by an in-repo
      derivation and say which was done; a recalled theorem that cannot be
      sourced is carried as a heuristic with its own falsification condition, not
      as a fact.
    - >-
      ledger/decisions/DEC-20260724-021.yaml. READ IN FULL IN THIS SESSION. Two
      of its clauses are load-bearing here and both are quoted verbatim in this
      record: the limitations clause naming the sections as height-2 E8 roots
      with absolutely bounded relation coefficients, and the next_actions clause
      prescribing the Shioda Gram with <P,P> = 2, <P,Q> = 1 - (P.Q). Its
      published FORBIDDEN-SENTENCE list is binding on this record and on anything
      downstream of it; in particular this proposal does not state and must not be
      read as stating "the multi-section or Mordell-Weil relation-source route is
      closed" or "no lifting-based relation source exists over F_p(t)".
    - >-
      Jacobson, Koblitz, Silverman, Stein, Teske on the failure of xedni calculus
      (recorded in this corpus as KN-LIT-021). NOT READ -- relayed claim. What
      DEC-20260724-021 says about it, and what this proposal relies on only as
      motivation: the binding obstruction the literature names is
      RELATION-COEFFICIENT GROWTH, which is the quantity the XEDN lane chose to
      measure. Whether the function-field analogue of that obstruction is the
      same obstruction is exactly what the E8 structure puts in doubt.
    - >-
      experiments/EXP-XEDN-005/implementation/run_census.sage and
      .../xedn5_lib.py, and
      experiments/EXP-XEDN-005/runs/RUN-XEDN-005-MAIN/raw-result.json. READ IN
      FULL IN THIS SESSION from the committed tree. Every statement in this
      record about coeff_bound, max_support, the early return on inf-norm 1, the
      naive-height Gram, the fiber_over_sections sampler, and the archived
      planted control's max_abs_coeff = 2 comes from those files and can be
      checked by opening them.

  lossy_projection_identifiability_audit:
    projection: >-
      Surface S over F_p(t) --> its F_p-rational free-x section set --> the root
      subsystem Phi_p(S) inside E8 --> the relation lattice of Phi_p(S) -->
      min over nonzero relations of the infinity norm --> one integer per surface
      --> one integer per prime --> the slope of that integer against log p.
    what_is_discarded: >-
      At the third arrow, everything except a lattice-theoretic type. At the
      fourth and fifth arrows, everything: the Dynkin type, the rank, the root
      count, the marking, the Frobenius action and the surface itself all map to
      the single symbol 1 (or to "undefined").
    why_genuinely_lossy: >-
      Genuinely and catastrophically lossy at the last two arrows, which is the
      problem rather than the merit. The fibre over the observed value 1 is
      every surface whose root system has any non-A1 component -- which the
      sampler is built to produce.
    why_compatible_with_the_operations: >-
      Perfectly compatible: the relation lattice and its minimum are invariants
      of the Mordell-Weil group and propagate deterministically. Compatibility is
      not the discriminating test here, and this record says so: a projection can
      be lossy, compatible, and worthless because it is CONSTANT.
    is_it_only_a_change_of_coordinates: >-
      NO -- and the failure checked for is the MIRROR of the change-of-coordinates
      failure, not that failure. The canonical (Delta, Pi) = (x XOR y, x*y)
      failure in characteristic 2 is "nothing discarded, nothing gained"; the
      check run here was for the opposite mode, "so much discarded that the
      retained scalar is constant across instances, zero comparator spread". WHAT
      THE CHECK RETURNED: the mirror failure is present at the last arrow and
      ABSENT at the third. Phi_p(S) itself is not constant -- the committed
      EXP-XEDN-005 records show (rank, slot-count) pairs including (2,2), (2,3),
      (3,3), (3,4), (3,6), (4,10), (4,12), (6,9), (7,7), (8,10), which is real
      spread and, read as (rank, positive-root count), is candidate evidence of
      varying Dynkin type. The information therefore exists and is destroyed at a
      single identified step. That is the difference between "this lane measured
      nothing" and "this lane threw away what it measured", and it is why the
      proposal has a constructive half.

  assumptions:
    - >-
      chi = 1 for deg a <= 4, deg b = 6. If the genus formula is misremembered
      the whole derivation moves to a different lattice and the dichotomy must be
      rederived. Checked in Stage 1 against a source or by in-repo derivation.
    - >-
      Squarefree discriminant implies all fibres irreducible implies contr_v = 0.
      The committed census records b_squarefree, not disc-squarefree, and records
      at least one surface with b_squarefree = false; the audit recomputes the
      discriminant's squarefree-ness per surface rather than inheriting the
      recorded flag.
    - >-
      "Verified relation" means verified in the group law over F_p(t), not merely
      by specialisation at 20 fibres. Specialisation is necessary and not
      sufficient; the audit reports both and never substitutes one for the other.
    - >-
      Reading committed artifacts is not running an experiment. Every number in
      this record that came from the archived JSON is labelled as read from it
      during design; Stage 2 re-derives them in-harness before any of them may be
      cited in an evidence record.

  predictions:
    - metric: >-
        forced_dichotomy_violation_count: number of censused surfaces, over the
        archived EXP-XEDN-005 and EXP-XEDN-007 slot data recomputed under the
        SHIODA pairing, on which (a) the discriminant is squarefree, (b) every
        observed section has hhat = 2, and (c) the group-law shortest relation
        has infinity norm not in {1} and is not absent
      direction: lower
      minimum_effect: >-
        EXACTLY 0. Forced value derived above before any run. Any single
        violation falsifies the dichotomy and is the most valuable outcome
        available in this audit, because it means a height-2 saturated root set
        on a chi = 1 surface admits a minimal relation of norm >= 2, which
        contradicts elementary root-system algebra and therefore locates an error
        in one of the three premises.
    - metric: >-
        case_O_identification_rate: fraction of surfaces reporting
        max_abs_coeff = null whose recomputed root system is exactly A1^r
        (pairwise orthogonal, N = r)
      direction: higher
      minimum_effect: >-
        1.00 -- all of them. Three such surfaces are already visible in the
        archived MAIN run (two with 2 slots and rank 2, one with 3 slots and
        rank 3, all reporting max_abs_coeff null). The dichotomy says every
        "undefined" is an A1^r, which converts silently-dropped surfaces into a
        reported category. If any null surface is NOT A1^r, the search bound
        (coeff_bound = 3) missed a relation, which is Step 6's separate defect
        and must be reported as such.
    - metric: >-
        ade_admissibility_rate: fraction of censused surfaces whose recomputed
        (rank r, positive-root count N) pair is realisable by SOME rank-r ADE
        root system, from the exhaustive table of root subsystems of E8
      direction: higher
      minimum_effect: >-
        1.00 under the pure-root premises. This is a forced value with real
        teeth, because most integer pairs are NOT admissible: at rank 3 the only
        admissible counts are 3 (A1^3), 4 (A2+A1) and 6 (A3), so an observed
        (3, 5) is impossible. Read from the archived JSON during design, at least
        one recorded pair -- (span_rank 3, n_slots 5) at p = 19 -- is NOT
        admissible, which under the derivation must mean the NAIVE Gram's rank is
        not the true rank (Step 7), not that the root theory fails. Stage 2
        decides which.
    - metric: >-
        instrument_reachability: the maximum value that
        shortest_relation_group_law can return, established by reading the
        function and by a driver that feeds it a synthetic point set whose only
        relation has infinity norm 4
      direction: different
      minimum_effect: >-
        The synthetic set must return None (or fall through to the Gram path),
        never 4. Forced by coeff_bound = 3 and max_support = 3. If it returns 4,
        this record's Step 6 is wrong and must be withdrawn.
    - metric: >-
        planted_control_explanation: the recomputed Shioda heights and fibre
        types of the archived EXP-XEDN-005 planted control surface
        a = [2,4,0,3,3], b = [1,2,3,3,6,5,2] at p = 7, which reported
        max_abs_coeff = 2
      direction: different
      minimum_effect: >-
        At least one of: a non-squarefree discriminant, a reducible fibre with
        contr_v > 0, or an observed section with hhat /= 2. Exactly one of these
        must hold, or the dichotomy is refuted by an already-committed number.
        Predicted before the run; the prediction can fail.
    - metric: >-
        dynkin_type_spread: number of DISTINCT Dynkin types of Phi_p(S) observed
        across the recomputed census
      direction: higher
      minimum_effect: >-
        At least 4 distinct types. This is the constructive half: the replacement
        observable must have comparator spread where the discarded one has none.
        Fewer than 4 distinct types would mean the sampler produces one stratum
        and the replacement observable is no better than the one it replaces.

  minimal_test:
    design: >-
      Four stages, ordered cheapest-first, each able to terminate the audit;
      Stage 0 and Stage 1 together can end the whole line before any curve is
      touched. STAGE 0 (pen and paper plus pure Python, minutes, ZERO curve
      compute): build the 240 roots of E8 in the standard coordinate model with
      exact integer arithmetic; enumerate every root subsystem type by rank and
      positive-root count; tabulate the admissible (r, N) pairs; and prove the
      Case-O / Case-R dichotomy mechanically on random saturated subsets. If the
      dichotomy fails on any synthetic saturated subset, STOP -- the derivation
      is wrong and that is the deliverable. STAGE 1 (code reading plus a driver,
      minutes): establish the reachable range of shortest_relation_group_law by
      reading it and by feeding it a synthetic configuration whose only relation
      has infinity norm 4. STAGE 2 (pure Python over ARCHIVED slot data, under a
      CPU-minute): recompute, for every surface in the committed EXP-XEDN-005 and
      EXP-XEDN-007 raw results, the discriminant and its squarefree-ness, the
      fibre types, the Shioda height of every listed slot, the true Shioda Gram
      with <P,P> = 2 and <P,Q> = 1 - (P.O)(Q.O)-corrected intersection, the rank,
      the Dynkin type, and the relation lattice; compare against the recorded
      naive-Gram rank and the recorded metric. STAGE 3 (fresh enumeration, still
      pure Python, bounded): run the matched null and the graded control below.
    controls:
      - >-
        NULL OBJECT, SAME SHAPE, FORCED VALUE DERIVED PRE-RUN, CAN FAIL. Surfaces
        with deg b = 10 and deg a <= 2 -- the GOAL-XEDN-003 family, whose slot
        data is already committed in EXP-XEDN-006/007. There chi = 2, the minimal
        integral-section height is 2 chi = 4, and deg-x <= 2 sections are not the
        minimal ones, so the E8 root argument DOES NOT APPLY. FORCED VALUE: on
        that family the recomputed Shioda diagonal must be 4 (not 2) and the
        (rank, count) pairs must NOT be constrained to the ADE table. If the null
        family behaves identically to the chi = 1 family, the audit is detecting
        a property of the code rather than of the surfaces and NO conclusion may
        be drawn about either. This null can fail and its failure is decisive.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR. The
        archived EXP-XEDN-005 planted control (a = [2,4,0,3,3],
        b = [1,2,3,3,6,5,2], p = 7, 3 slots, max_abs_coeff = 2, specialisation
        20/20). The dichotomy forbids the value 2 among saturated height-2 roots,
        so this surface MUST be shown to violate a premise. If the recomputation
        finds squarefree discriminant, all fibres irreducible, and all three
        slots at height 2, then the instrument is not broken and the DERIVATION
        is, and no negative statement about the lane's metric may be reported at
        all.
      - >-
        GRADED CONTROL, >= 3 INTERIOR POINTS, MONOTONICITY REPORTED. Sweep
        deg b in {6, 7, 8, 9, 10, 11, 12} at fixed deg a <= 4, giving chi = 1 at
        deg b = 6 and chi = 2 at deg b in {7..12}. The quantity that must DECAY
        as the parameter meant to destroy the effect increases is the fraction of
        surfaces on which the dichotomy holds: it must be 1.00 at deg b = 6 and
        must fall away above it. A fraction that stays at 1.00 across the whole
        sweep is the canonical artifact tell -- it would mean the recomputation
        is reporting a property of the enumeration bound, not of the lattice --
        and in that case the audit reports an artifact and stops.
      - >-
        ORDERING CONTROL. The Stage-0 admissible-(r, N) table and the Stage-1
        instrument-range result are committed with their hashes BEFORE any
        archived surface record is opened in Stage 2. The dichotomy's predicted
        violation count (0) and the Case-O identification rate (1.00) are frozen
        at the same moment.
      - >-
        ARCHIVE CHECK, ZERO COMPUTE. Enumerate every prior measurement of this
        observable in the corpus and state what each did with it: EV-XEDN-002,
        -003, -004, -005, -006, KN-FIND-005, -010, -011, and DEC-20260724-021.
        The check is that NONE of them derives the bound its own decision record
        asserts. That absence is reported as an absence, not claimed as a passed
        check.
    required_metrics:
      - the 240-root E8 construction with its integer Gram, and the admissible (rank, positive-root count) table, both hashed
      - per-surface recomputed discriminant, squarefree flag, fibre type multiset, per-slot Shioda height, Shioda Gram, rank, Dynkin type, relation-lattice basis
      - the recorded naive-Gram rank and recorded metric beside the recomputed ones, per surface, so disagreements are visible rather than reconciled
      - the reachable range of shortest_relation_group_law, established by driver, with the synthetic configuration recorded
      - the chi = 2 null arm's Shioda diagonal and its (rank, count) admissibility rate
      - the graded deg-b sweep with the dichotomy-holding fraction per cell and its monotonicity

  falsification_conditions:
    - >-
      Any censused surface with squarefree discriminant, all slots at height 2,
      and a group-law-verified shortest relation of infinity norm >= 2. The
      dichotomy is then wrong and this proposal is withdrawn by a superseding
      record.
    - >-
      shortest_relation_group_law returns a value >= 4 on the synthetic driver.
      Step 6 is then wrong and the "declared falsifier unreachable" claim must be
      withdrawn independently of everything else.
    - >-
      The planted control turns out to satisfy every premise while reporting 2.
      Nothing negative may be reported about the lane's metric.
    - >-
      The chi = 2 null arm reproduces the chi = 1 behaviour exactly. The
      recomputation is then measuring the pipeline, not the surfaces.
    - >-
      The Stage-0 synthetic test finds a saturated root set with N > r and no
      inf-norm-1 relation. The elementary argument in Step 4 is then wrong, which
      would be a genuine surprise and must be recorded as one.

  confounders:
    - >-
      RECALLED THEOREMS. Steps 1 and 2 rest on Shioda's theory as remembered, not
      read. The corpus's own DEC-20260724-021 states the same identification, but
      a second unsourced statement is not a source. Stage 1 must either obtain a
      primary text or replace the recalled statements with an in-repo derivation,
      and must say which it did.
    - >-
      NAIVE-VERSUS-CANONICAL HEIGHT. Every rank and corank in the archived data
      comes from the naive-degree Gram. Comparing a recomputed canonical rank
      against a recorded naive rank and calling the difference a finding would be
      an error; both are reported, and only the recomputed one enters any
      conclusion.
    - >-
      SELECTION BY THE SAMPLER. The census surfaces are two-section-planted. Any
      statement about "the family" from this data would be a statement about the
      planted stratum. This audit makes no claim about the uniform-measure family
      and says so.
    - >-
      AUDITOR'S ASYMMETRY. Refuting an in-house measurement is cheap to produce
      and reads as rigour. The positive control and the null arm exist precisely
      so that a negative outcome costs something to reach, and the audit is
      barred from reporting any negative if the positive control fails.
    - >-
      RE-USING COMMITTED ARTIFACTS. Stage 2 reads run outputs the lane produced.
      If those outputs are themselves wrong, the audit inherits the error; that
      is why Stage 3 re-enumerates a subset from the frozen predicate rather than
      trusting the recorded slot lists.

  interpretation_limits:
    - >-
      A confirmed dichotomy closes the OBSERVABLE, not the route. Its honest
      statement is: on chi = 1 surfaces with irreducible fibres, the infinity
      norm of the shortest Mordell-Weil relation among exhaustively enumerated
      free-x sections carries no information about p, deg a, or the surface,
      because it is determined by whether the realised root system has a non-A1
      component. It says nothing about whether a lifting-based relation source
      exists, and DEC-20260724-021's forbidden-sentence list remains binding
      word for word.
    - >-
      Nothing here re-opens, re-scopes or amends GOAL-XEDN-001/002/003, their
      decisions, their evidence, or KN-FIND-005/010/011. Those are Coordinator
      records. This proposal supplies a derivation and an audit; any status
      consequence is a Coordinator decision and is not implied here.
    - >-
      Claim tier toy throughout, and it may not be raised by any downstream
      citation. No exponent moves, no attack exists, no cryptographic-scale
      statement is available from any outcome.
    - >-
      A confirmed dichotomy does NOT show the XEDN campaigns were worthless. It
      shows the surviving deliverable is the object (the realised root system and
      its Frobenius structure) rather than the scalar, which is exactly the
      pattern the inventor protocol records for the Mobius session.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NOT LOAD-BEARING AS A DISTRIBUTIONAL ASSUMPTION. The headline is a
        deterministic algebraic dichotomy, proved from the classification of
        simply-laced root systems, not a statement about a distribution. This
        entry exists to record that the proposal is unconditional where its
        predecessors in this question were empirical, and that its risk is
        entirely in the three PREMISES (chi = 1, irreducible fibres, height 2),
        each of which is checked per surface rather than assumed.
      rigorous_support: >-
        For simply-laced irreducible root systems the pair (rank, number of
        positive roots) is (k, k(k+1)/2) for Ak, (k, k(k-1)) for Dk (k >= 4),
        (6,36), (7,63), (8,120) for E6/E7/E8; only A1 has equality of rank and
        positive-root count. In any connected simply-laced diagram two adjacent
        simple roots have inner product -1 and their sum is a root. Both are
        standard and both are re-derived mechanically in Stage 0 rather than
        cited.
      validation_plan: >-
        Stage 0 enumerates E8's roots and all root subsystems in exact integer
        arithmetic and verifies the dichotomy on every saturated subset it can
        construct, including adversarial ones. No sampling, no statistics.
    - id: H2
      statement: >-
        Squarefree discriminant of a chi = 1 Weierstrass model implies every
        fibre is of type I1, hence every local contribution contr_v(P) is 0,
        hence every integral section has hhat = 2 chi.
      rigorous_support: >-
        Standard Kodaira/Tate reasoning: a simple root of the discriminant gives
        a nodal (I1) fibre, whose component group is trivial. RECALLED,
        UNVERIFIED at the level of the precise statement over F_p for small p,
        where wild behaviour at p = 2, 3 is excluded by the family (all tested
        p >= 7) but where quadratic-twist and additive-reduction edge cases must
        still be checked.
      validation_plan: >-
        Per-surface recomputation of the discriminant, its factorisation over
        F_p[t], and the fibre type at every root, reported beside the height. Any
        surface whose fibre types are not all I1 is reported separately and never
        pooled with the pure stratum.
    - id: H3
      statement: >-
        Exhaustive enumeration over x-coefficients in F_p^3 yields a set closed
        under root addition (saturation), because a sum of two observed roots
        that is again a root is again an integral section with deg x <= 2.
      rigorous_support: >-
        The addition is the Mordell-Weil group law; the claim that the sum's
        x-coordinate is again a polynomial of degree <= 2 follows from its height
        being 2 together with the height-2 <-> deg x <= 2 correspondence, which
        is itself the RECALLED part of Step 2. So H3 is not independent of H2 and
        this record does not present it as extra support.
      validation_plan: >-
        Directly testable at zero risk: for every observed pair with recomputed
        Shioda inner product -1, form the sum in the group law over F_p(t) and
        check membership in the observed slot list. A single failure refutes
        saturation and localises the error to the correspondence.

  proof_search_map_note: >-
    The paired hypothesis H-XEDN-906489 carries the filled proof_search_map with
    all four audits (baseline reproduction, observation collision, quantifier
    order, method ceiling with nearby-object control). It is not duplicated here.

  target_complexity:
    exponent_moved: >-
      NONE, and this record states that plainly rather than dressing a
      measurement audit as an exponent result. No algorithm is proposed, no
      relation source is built, no discrete logarithm is computed. What the audit
      moves is the STATUS of an observable that three completed goals rest on.
    memory_exponent: n/a -- no algorithm.
    best_known: >-
      Pollard rho at O(sqrt(N)) group operations with negligible memory remains
      the ECDLP baseline for every curve in scope, and nothing in this proposal
      approaches it.
    hidden_overhead: >-
      n/a. The audit's own cost is under a CPU-minute for Stages 0-2 and bounded
      minutes for Stage 3.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no result claimed, no Pareto point offered). Rows actually checked
    before writing that, across time, memory and data/queries: Pollard rho
    (time sqrt(N), memory O(1), data 0); parallel rho with distinguished points
    (time sqrt(N)/w, memory w, data 0); baby-step giant-step (time sqrt(N),
    memory sqrt(N)); index calculus over F_p-curves as recorded in this corpus's
    ECDLP lane (no subexponential prime-field variant recorded as working);
    Semaev/Gaudry-Diem index calculus for extension fields (out of scope, the
    XEDN family is prime-field); and the xedni family itself, which this corpus
    records as refuted in its classical form. The audit proposes no point on any
    of those axes, so domination is not the right frame; the honest entry is that
    it competes with nothing.
  sota_delta: >-
    Zero on every attack axis: time, memory, data, queries, preprocessing and
    advice are all unchanged, because no algorithm is proposed. Quantitatively,
    the deliverable is measured in records rather than in exponents: the audit
    determines the status of one observable that carries 5 evidence records
    (EV-XEDN-002 through -006), 3 knowledge findings (KN-FIND-005, -010, -011)
    and 3 goal closures, at a cost of under a CPU-minute for the decisive stages.
    Its most likely single-number outcome is the replacement of a reported
    "slope = 0.0, CI [0,0]" by the statement that the slope is 0 by construction.

  estimated_cost:
    implementation: low
    compute: very low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.75 that the dichotomy holds on the pure-root stratum (squarefree
    discriminant, all slots at height 2). It is not higher because three
    premises must all hold, because the archived planted control already reports
    a value (2) that the dichotomy forbids and no premise-violation for it has
    been checked, because at least one recorded (rank, count) pair is not
    ADE-admissible, and because Steps 1-2 rest on recalled theory rather than a
    read source. It is not lower because the argument in Step 4 is elementary and
    checkable without any curve, because the corpus's own DEC-20260724-021
    independently asserts the same identification, and because the observed
    metric being pinned at 1-or-undefined across 41 archived surfaces at four
    primes and two deg-a windows is exactly what the dichotomy predicts and is
    hard to explain otherwise. Separately, 0.95 that Step 6 (the falsifier is
    outside the implemented search space) survives, since it is a property of
    twelve lines of committed code and needs no mathematics at all.
