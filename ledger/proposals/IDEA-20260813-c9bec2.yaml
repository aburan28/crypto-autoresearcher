idea:
  id: IDEA-20260813-c9bec2
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MQOM-001
  goal_id: GOAL-MQOM-001
  title: >-
    Actual-map polar and Jacobian-pencil audit: test whether TCitH's public MQ
    instance has rank defects or common invariant subspaces absent from a
    parameter-matched random quadratic system
  class: measurement
  claim: >-
    Once the primary TCitH/MQOM public-map generator and exact parameters are
    filed, the span of its polar bilinear forms and its Jacobian pencils can be
    compared with a coefficient-, field-, variable-, equation- and conditioning-
    matched random-MQ ensemble using exact linear-algebraic invariants.  A
    statistically and algebraically reproducible excess of low pencil rank,
    radical intersection, commutant dimension or common invariant-subspace
    certificates would falsify the modelling step that treats this public map
    as an unstructured random MQ instance.  Matching the null would only bound
    this declared invariant family.  No actual public map was parsed, no rank
    was measured and no hardness or attack claim is made here.
  mechanism: >-
    Write the quadratic coordinate maps as Q_i and polarize them to symmetric
    or characteristic-appropriate bilinear forms B_i.  For coefficient vectors
    lambda, study pencils B(lambda)=sum_i lambda_i B_i, their rank distribution,
    radicals, and the algebra A generated by products or adjoint-compatible
    operators derived from the span.  A nontrivial common invariant subspace W
    is a public certificate if every declared generator maps W into W; a large
    commutant or persistent radical intersection can expose a block decomposition
    and reduce the effective variable dimension before generic solving.  The
    Jacobian J_F(x) supplies a second observable whose rank-defect locus must be
    compared on identical x and lambda sampling rules.  Exact certificates, not
    retrieval scores or solver time, carry any structural observation.
  why_not_a_renamed_known_approach: >-
    IDEA-20260805-7d97be is the nearest neighbor: it requires a matched random-
    MQ null and compares Macaulay rank/solving behaviour.  This proposal never
    infers structure from solving degree; it audits the degree-two polar span,
    Jacobian pencil, commutant and explicit invariant-subspace certificates
    before Gröbner computation.  IDEA-20260801-018 measures toy TCitH tightness;
    7abf04 studies a Fiat-Shamir/grinding inequality; be7738 recosts memory;
    cec9b6 tracks correlated proof dependencies; 51e40f is characteristic-two
    Weil descent; 721f2b is an optimal-forger DP; aa551f is global challenge-
    space combinatorics.  None is this actual-map structural quotient audit.
  predictions:
    - observable: polar-pencil rank distribution
      metric: lower_tail_excess_against_matched_random
      predicted: >-
        Exact-null calibration gives the preregistered tail rate; a planted
        block-structured positive control produces a monotone excess as the
        planted common-block dimension increases.
    - observable: common invariant-subspace certificate
      metric: certified_dimension_and_residual
      predicted: >-
        Null certificates are absent above the frozen dimension threshold at
        the toy calibration scale, while the planted control returns its exact
        block with zero residual.
    - observable: generated-algebra commutant
      metric: commutant_dimension
      predicted: >-
        A fully generic matched-random span has the frozen baseline dimension;
        planted block symmetry increases it by an exactly computed amount.
    - observable: Jacobian rank-defect locus
      metric: defect_frequency_by_public_point_stratum
      predicted: >-
        Matched random and actual-map arms are compared within identical public
        strata; the planted control has a forced defect on its declared subspace.
  minimal_test:
    design: >-
      Stage 0 files primary map-generation pseudocode, field, equation and
      variable counts, affine terms and conditioning.  Construct the actual
      coefficient tensors without secret information.  Freeze a matched-random
      generator, key/point/pencil seeds, invariant list, multiple-testing rule
      and toy-to-exact parameter boundary.  Run the random null and planted
      block controls before the actual map.  Report full rank histograms and
      machine-checkable bases for every radical, commutant or invariant space.
      Do not run a solving-degree experiment; a separate fresh DREG backend
      check is mandatory before any later Macaulay or Gröbner extension.
    test_boundary:
      instances: public map generated from filed specification plus independently generated matched-random maps
      parameters: exact declared MQOM field, variables, equations, affine conditioning and public-map representation
      oracle_model: public-key/map generation only; no signing, private or deployed oracle
      preprocessing: tensor extraction and exact basis conversion are charged
      backend_gate: >-
        Polar/Jacobian exact linear algebra may be designed here, but no
        solving-degree run is approved until a fresh calibrated backend check
        supersedes the in-progress and incomplete EV-DREG-004 state.
      stopping_rule: >-
        Stop interpretation if the random-null rank law or planted certificate
        is not reproduced exactly at the enumerated toy slice.
    required_metrics:
      - complete polar-form and Jacobian construction hashes and dimensions
      - rank distribution with exact counts or declared sampling intervals
      - radical-intersection and commutant dimensions
      - invariant-subspace bases with zero-residual verification
      - multiplicity correction, seeds, time, memory and preprocessing
  controls:
    - name: parameter-matched random MQ ensemble
      kind: exact_null
      construction: >-
        Uniform random quadratic systems matched on field, variables,
        equations, affine terms, coefficient representation and every public
        conditioning imposed by the scheme.
      forced_value: exact toy rank distribution and calibrated finite-sample null for each invariant
      gate: a miscalibrated random null invalidates actual-map comparison
    - name: planted common block
      kind: biased_positive
      construction: >-
        Conjugate a random MQ system by a public invertible change of basis and
        plant a k-dimensional subspace invariant under every polar generator,
        over a frozen ladder of k.
      forced_value: exact k-dimensional certificate, increased commutant and predictable pencil-rank tail
      gate: smallest planted k must be recovered with preregistered power before a null result is admissible
    - name: representation-conjugacy control
      kind: structural_control
      construction: apply random public invertible domain and codomain changes to every arm
      forced_value: certificate existence and invariant dimensions are unchanged
      gate: a change shows the observable depends on coordinates rather than map structure
  confounders:
    - Characteristic-dependent polarization can discard square terms unless the full quadratic representation is retained.
    - A matched null that ignores scheme conditioning fabricates rank differences.
    - Sampling lambda or public points adaptively after seeing the actual map invalidates tail calibration.
    - A low-rank pencil can be common in random MQ at the exact aspect ratio and is not by itself an attack.
    - Public map and parameter details remain unverified until primary sources are filed.
  falsification_conditions:
    - Planted invariant spaces are not recovered with zero certificate residual.
    - Null invariants change under public invertible coordinate conjugacy.
    - Exact toy random rank counts disagree with the implemented null generator.
    - The alleged actual-map certificate fails independent exact verification.
    - The primary map is distributed exactly as the matched null by construction and no additional conditioning remains; only the declared finite audit continues.
  interpretation_limits:
    - This is an unexecuted structural audit, not evidence that TCitH public maps are nonrandom.
    - A detected invariant is a candidate decomposition, not a solve, forgery or security-bit estimate.
    - A null result covers only the frozen invariant family, ranks, parameter slice and sample budget.
    - Any end-to-end cost must later charge decomposition, solving, memory, preprocessing, success probability and verification against a matched baseline.
  assumptions:
    - The actual public MQ map is deterministically reconstructible from filed public data.
    - The matched-random ensemble can reproduce every public restriction except the structure being tested.
    - Exact finite-field linear algebra is available after backend calibration without using DREG solving claims.
  heuristic_assumptions:
    - id: HEUR-C9BEC2-1
      formal_statement: >-
        For matched random MQ at the declared aspect ratio, the frozen pencil
        sample and commutant basis estimate every preregistered lower-tail
        probability to absolute error at most 0.01.
      rigorous_support: finite-sample concentration applies, but rare rank tails and dependent pencil samples affect constants
      validation_plan: compare exact enumeration at toy dimensions with repeated seeded sampling and simultaneous intervals
      falsification_condition: any frozen tail estimate misses exact toy probability by more than 0.01
    - id: HEUR-C9BEC2-2
      formal_statement: >-
        A common invariant subspace of dimension k at exact parameters yields
        a decomposition whose generic-solving exponent is governed by the
        largest block rather than the full variable count.
      rigorous_support: exact block diagonalization reduces independent systems, but coupling through affine and output terms may prevent factorization
      validation_plan: on planted toy systems compare certified decomposition with exact exhaustive solve counts, not wall-clock alone
      falsification_condition: planted invariant certificate leaves cross-block equations that preserve full search dimension
  proof_search_map:
    bottleneck: whether the actual public quadratic span is structurally equivalent to an unstructured matched-random span
    baseline_embedding:
      parameter_slice: uniformly random quadratic coefficients with identical public conditioning
      reproduction_check: exact toy enumeration of pencil ranks, radicals and commutant dimensions
    observation_collision:
      observable: pencil-rank histogram alone
      distinct_preimage_search: >-
        Construct one block-structured and one unstructured system with the
        same rank histogram; require commutant and invariant certificates to distinguish them.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: generated-algebra commutant plus common invariant-subspace certificate
        predicted_gain: separates rank-histogram collisions
      - transform: representation_reduction
        proposed_object: public change of basis exposing certified blocks
        predicted_gain: possible reduction to smaller coupled MQ systems
    quantifier_order: >-
      For every public key in the frozen key sample, all invariants and null
      strata are fixed first; there exists a certificate basis only if exact
      residual verification passes independently.
    method_ceiling:
      strongest_certifiable_claim: scoped structural deviation or bound for the declared invariant family
      nearby_object_control: a random system conditioned to share the same pencil-rank histogram but no common invariant space
    proof_obligations:
      - claim: actual and null maps are parameter- and conditioning-matched
        responsibility: interface
      - claim: invariant bases verify under every declared generator
        responsibility: correctness
      - claim: sampling and multiplicity control cover all reported ranks
        responsibility: success_probability
      - claim: any decomposition preserves the original public solving problem
        responsibility: scope
      - claim: extraction, null generation and certificate checking are charged
        responsibility: runtime
    not_applicable_reason: null
  target_complexity:
    time_exponent: >-
      No attack exponent is claimed.  Audit cost is polynomial finite-field
      linear algebra in variables n, equations m and sampled pencils L; a later
      decomposition claim must state the resulting exact solver exponent separately.
    memory_exponent: polynomial storage for m polar matrices, Jacobian samples and generated-algebra bases
    best_known_baseline: >-
      IDEA-20260805-7d97be's matched-random Macaulay-rank/solving control.  The
      present baseline is cheaper degree-two structure before any solving-degree run.
    hidden_overhead_disclosure: tensor extraction, field extensions, pencil sampling, algebra closure, null multiplicity and certificate verification
    time_memory_tradeoff: stream pencil ranks for low memory or retain matrices for algebra closure and certificate recovery
    data_queries: public maps/keys only; frozen key sample size is explicit
    preprocessing: all tensor and generated-algebra work is charged per key unless a later multi-key argument justifies amortization
    oracle_model: public information only
    retry_success_accounting: no solve retries; structural detection power is calibrated on planted and null ensembles
  sota_delta: >-
    Quantitative target is an exact invariant dimension, rank-tail effect and
    possible block-size delta n-max_block.  Until observed and converted into
    an end-to-end solver, attack-time and security delta are exactly zero.
  dominated_by: >-
