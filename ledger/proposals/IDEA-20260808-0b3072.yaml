idea:
  id: IDEA-20260808-0b3072
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MCEQ-fcb504
  goal_id: GOAL-MCE-001
  title: The hull is not an invariant of matrix code equivalence, so support splitting is
    structurally blocked - but the determinantal hypersurface IS invariant, which reduces
    MCE to projective equivalence of a degree-min(m,n) form in k variables
  class: representation
  claim: 'For permutation equivalence of linear codes, Sendrier''s support-splitting algorithm
    works because the hull C intersect C-perp is preserved by the group and is small generically
    (KN-LIT-0f43ad). CLAIM (A), a CLOSURE WITH A NAMED OBSTRUCTION: for matrix code equivalence
    - given C, D subset of F_q^{m x n} of dimension k, find A in GL_m and B in GL_n with D
    = A C B - the hull under the trace form <X, Y> = Tr(X Y^T) is NOT invariant, because A
    X B is not an isometry of that form unless A and B are orthogonal. Hence the entire hull-based
    support-splitting route does not transfer, and any proposal that assumes it does is mis-specified.
    CLAIM (B), THE REPLACEMENT: the determinantal form Delta_C(x) = det(x_1 M_1 + ... + x_k
    M_k), for a basis M_1..M_k of C with m = n, satisfies Delta_{ACB}(x) = det(A) det(B) Delta_C(x)
    EXACTLY, with the SAME variables. So Delta is invariant up to scalar under the whole group
    GL_m x GL_n and transforms by a linear substitution under change of code basis (GL_k).
    Therefore MCE reduces to: (i) find the GL_k substitution matching two degree-n forms in
    k variables, then (ii) recover (A, B) by linear algebra. CLAIM (C): the fibre of the map
    "code to determinantal form" is finite modulo the group for generic codes, by the classical
    theory of determinantal representations, so the reduction loses only a finite ambiguity.'
  mechanism: 'The lossy-projection test, applied before any compute. Delta_C is a genuinely
    LOSSY projection of C - it retains only the locus where a codeword drops rank, discarding
    all information about which codeword, its kernel, and the code''s metric structure - and
    what it discards is discarded COMPATIBLY with the target''s operations, because left and
    right multiplication by invertible matrices scale the determinant without touching the
    variables. That is exactly the compatibility the protocol requires: the retained part
    propagates deterministically under the group. By contrast the hull is a projection that
    is NOT compatible with GL_m x GL_n, which is claim (A) restated in the protocol''s own
    vocabulary. Claim (C) rests on the classical fact that a smooth hypersurface admits only
    finitely many inequivalent determinantal representations (for plane curves these correspond
    to line bundles of the right degree) - RECALLED FROM MEMORY, UNVERIFIED, and the finiteness
    statement for higher-dimensional determinantal hypersurfaces is the exact point that must
    be checked before (C) is used.'
  why_not_a_renamed_known_approach: 'It is not support splitting: the entire content of (A)
    is that support splitting does not transfer, with the reason named. It is not the low-rank
    codeword / birthday approach that I believe the published MCE algorithms use (Reijnders-Samardjiska-Trimoska
    style, RECALLED FROM MEMORY, UNVERIFIED) - that approach tracks individual low-rank codewords,
    this tracks the whole degeneracy locus as a single algebraic object and never enumerates
    codewords. It is not MinRank: MinRank asks for a point on the locus, this asks for the
    locus''s equation.'
  predictions:
  - observable: Whether the trace-form hull is preserved by a random (A, B) in GL_m x GL_n.
    metric: dim(C cap C-perp) before and after, over random group elements.
    predicted: Changes, with probability approaching 1 in q. Zero change would falsify (A)
      and would resurrect support splitting for MCE, which would be the more consequential
      outcome.
  - observable: Delta_{ACB} versus det(A) det(B) Delta_C as polynomials.
    metric: Exact coefficient-wise equality over F_q at toy (m, n, k, q).
    predicted: Exact equality. This is a theorem and serves as the instrument's null - any
      discrepancy is an implementation bug.
  - observable: Number of GL_k substitutions matching two determinantal forms of equivalent
      codes.
    metric: Size of the solution set at toy (m = n = k = 3, 4, 5) over small q.
    predicted: 'Finite and small (my prior: bounded by a function of m and k alone, not growing
      with q). Growth with q falsifies (C) and makes the reduction lossy in a way that matters.'
  minimal_test: Toy scale, exact arithmetic, no cryptographic sizes. (1) At m = n = k = 3,
    4, 5 over q = 7, 11, 13, generate random matrix codes, apply random (A, B), and check
    (A) by measuring hull dimension before and after, and (B) by verifying the determinantal
    identity coefficient-wise. (2) For each equivalent pair, solve for the GL_k substitution
    by Groebner basis and count solutions, testing (C). (3) Measure how the count scales with
    q and with k. Budget order 10^2 to 10^3 core-seconds.
  controls:
  - INEQUIVALENT-PAIR NULL - run the substitution search on random INEQUIVALENT codes with
    matching rank distribution; the solution set must be empty. A non-empty result means the
    invariant is too coarse and the reduction is not sound.
  - ORTHOGONAL-SUBGROUP CONTROL - restrict (A, B) to the subgroup where B = A^{-T}; the hull
    SHOULD then be preserved, confirming that the hull-failure in (A) is caused by the group
    and not by the measurement.
  - SCALAR CONTROL - verify that det(A) det(B) is recovered as the observed scalar rather
    than being fitted, so the identity is checked and not assumed.
  confounders:
  - Delta_C is identically zero for codes contained in the singular locus (e.g. codes of matrices
    with a common kernel vector); those codes must be excluded and their density reported.
  - For m not equal to n the determinant is undefined and the invariant must be replaced by
    maximal minors, changing the whole analysis; state which case is being handled.
  - Over small q a degree-n form in k variables has few points and Groebner behaviour is atypical;
    sweep q.
  falsification_conditions:
  - The hull turns out to be preserved (falsifies (A)), which would be a strictly more useful
    finding than (B).
  - The determinantal identity fails, which would mean the invariant is mis-stated and the
    whole idea dies at zero cost.
  - The GL_k substitution solution set grows with q, falsifying (C) and making the reduction
    lose exponentially much information.
  - Solving the form-equivalence problem is empirically no easier than solving MCE directly,
    so the reduction is correct but useless - the most likely honest outcome and still worth
    recording as a named closure.
  interpretation_limits: 'A reduction to hypersurface equivalence is not an attack: polynomial
    equivalence is itself a hard problem family, and nothing here claims it is easier. The
    honest positive outcome is a correctly-scoped structural statement plus a toy-scale measurement
    of the fibre size. No claim about MEDS or any deployed matrix-code scheme follows, and
    none may be reported.'
  assumptions:
  - m = n for the determinantal form; the m not equal to n case is out of scope for this record.
  - The code contains a full-rank element, so Delta is not identically zero.
  heuristic_assumptions:
  - id: HA-1
    statement: For a uniformly random k-dimensional matrix code in F_q^{n x n} with k >= 3,
      the determinantal hypersurface Delta_C = 0 is reduced and irreducible with singular
      locus of the expected codimension, so the classical finiteness of determinantal representations
      applies.
    rigorous_ingredient: The rank-at-most-r locus of a generic linear system of matrices has
      the expected codimension (n - r)^2 by the classical determinantal-variety dimension
      formula.
    distribution_imitated: Genericity in the sense of algebraic geometry - a random linear
      system behaves as the generic one, the standard Bertini-type statement.
    validation_route: TOY SCALE, LABELLED AS SUCH - at n = k = 3, 4, 5 and q = 7..31, compute
      the singular locus dimension and the number of irreducible factors of Delta_C for 10^3
      random codes and report the empirical fraction meeting the expected-codimension prediction.
    tail_checks: Report the codes that fail the prediction and check whether they are exactly
      the degenerate families (common kernel, common image); an unexplained failure class
      falsifies the genericity assumption.
  target_complexity:
    time_exponent: 'No attack exponent is claimed. What the idea changes is the SEARCH SPACE:
      MCE''s naive group search is |GL_m| |GL_n| about q^{m^2 + n^2}; the reduction replaces
      it by a GL_k substitution search, about q^{k^2}, plus linear algebra. Whether that is
      progress depends entirely on whether k is smaller than m^2 + n^2 at the parameters in
      question, and on the cost of form equivalence - which is NOT claimed to be small.'
    memory_exponent: Polynomial; the form has C(k + n - 1, n) coefficients, which is the real
      storage cost and must be reported.
    best_known_baseline: The published MCE algorithms based on low-rank codewords and algebraic
      modelling (RECALLED FROM MEMORY, UNVERIFIED; no corpus record states their complexity
      - KN-LIT-b777d1 and KN-LIT-0f43ad cover permutation and monomial equivalence only).
    hidden_overhead_disclosure: The finite fibre in (C) is finite but its SIZE is unbounded
      by anything stated here; if it grows with n the reduction hides an exponential factor.
      Stated as the leading risk rather than buried.
    time_memory_tradeoff: Not applicable at this stage; the reduction is a structural statement,
      not an algorithm with a tunable.
  sota_delta: 'Supplies a named obstruction (hull not invariant) that closes a whole family
    of transfers from permutation-equivalence cryptanalysis to matrix codes, and a replacement
    invariant with an exact transformation law. Quantitatively: nothing is beaten, and the
    record says so. Its value is a correct object enumeration where this program currently
    has none.'
  dominated_by: 'Plausibly dominated by the matrix-code-equivalence literature, which I believe
    includes both a birthday/low-rank algorithm and algebraic modelling work, and by the tensor-isomorphism
    literature (Grochow-Qiao), where the 3-tensor view of matrix codes and their invariants
    is standard - ALL RECALLED FROM MEMORY AND UNVERIFIED. Inside this corpus nothing dominates:
    the code -equivalence cluster is KN-LIT-0f43ad, KN-LIT-b777d1 and KN-LIT-d1a453, all permutation
    or monomial equivalence, all unread, none matrix-code. Setting this to null would be an
    unchecked null.'
  estimated_cost: Implementation MEDIUM (determinantal forms, Groebner over small fields).
    Compute LOW.
  recommended_priority: medium
  honest_prior_of_survival: About 0.9 that (A) and (B) are correct as stated (both are short
    algebraic checks); about 0.4 that (C) holds with a small fibre; about 0.1 that the reduction
    leads anywhere computationally useful.
