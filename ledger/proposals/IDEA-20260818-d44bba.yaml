      verified_by: 'this session read ledger/proposals/IDEA-20260818-1fb37d.yaml in full on 2026-08-18'
    - ref: 'Barbulescu, Duquesne, "Updating Key Size Estimations for Pairings" (ePrint 2017/334, J. Cryptology 2019)'
      provenance: recalled
      claim: >-
        RECALLED, NOT READ BY THIS SESSION: the standard post-exTNFS
        re-estimation of pairing key sizes, and the most likely single ROOT of
        the BLS12-381 and BN254 labels. Named here so a reviewer with
        retrieval can start the extraction at the right node. Its actual status
        as a root -- versus as a node quoting Kim-Barbulescu -- is exactly what
        this record measures and must not be assumed.
      verified_by: null
    - ref: 'Guillevic, survey and estimation tooling for pairing-friendly curves; CFRG/IETF pairing-friendly-curves draft'
      provenance: recalled
      claim: >-
        RECALLED, NOT READ: named in RQ-PAIR-f2e31f's own research-targets list
        as further candidate roots and as the standards-side node set. Pointers
        for the reviewer, not support.
      verified_by: null
    - ref: KN-LIT-2223
      provenance: internal
      claim: >-
        Cited by IDEA-20260818-1fb37d as a TITLE-ONLY corpus record for
        Guillevic's STNFS-resistant short-list. Relevant here only as evidence
        about this program's own corpus state: a title-only record is a node
        this program cannot yet place in the DAG.
      verified_by: 'not opened by this session; taken from IDEA-20260818-1fb37d citations, which this session read in full. Reviewer must open knowledge/literature/KN-LIT-2223.md before this reference is relied on.'

  object_first_candidate:
    tracked_object: >-
      THE (VALUE, QUALIFIER-SET, ATTRIBUTION) TRIPLE CARRIED BY A DOCUMENT --
      the number as it propagates through citation, not the number as computed.
      Chosen because RQ-PAIR-f2e31f's decision_target has two halves and the
      other twelve proposals under it all address the computational half. This
      is the only object under this RQ whose measurement can conclude that the
      RQ's premise is FALSE.
    established_families_off_limits: >-
      Declared off-limits as the primary lens: (F1) recomputing the cost model
      in any form (that is 1fb37d, 1a5cb2, 237e4e, 240828); (F2) polynomial
      selection (172a9e, 1d1734); (F3) executing or calibrating against a DL
      computation (15e1cd, 22a00c); (F4) frontier construction across attack
      surfaces (228021, 0676d4); (F5) library/implementation behaviour
      (481392). This record may consume any of their outputs as node
      attributes; it may not use one as its lens.
    lossiness: >-
      LOSSY-PROJECTION TEST, applied honestly and with its analogy declared.
      The protocol's test is written for objects propagating through a
      computation; here the "computation" is a citation chain and the
      "operation" is quotation. The projection is (document) -> (curve, value
      in bits, sieve variant named or not, machine model named or not, memory
      figure present or not, qualifier set, list of attributions). It discards
      the document: its argument, its parameters, its tables, its correctness.
      The discard is COMPATIBLE with quotation because quotation acts on
      exactly the retained tuple -- a quoting document reproduces value and
      (some subset of) qualifiers and adds an attribution edge, and does so
      without access to anything discarded. That compatibility is the whole
      content of the object: it is precisely BECAUSE quotation cannot see the
      discarded part that qualifier loss is possible and measurable.
      The projection is genuinely lossy -- many documents share a tuple -- and
      is not a change of coordinates, because no part of the document is
      recoverable from the tuple. Contrast the (Delta, Pi) failure of
      docs/inventor-protocol.md section 2, where the discarded pair was
      recoverable as roots of a quadratic; here nothing is.
      HONEST LIMIT OF THE ANALOGY: quotation is not an algebraic operation and
      "deterministic propagation" is an idealisation -- a human author may
      restate a number with a qualifier the source did not carry. That is not a
      defect of the object; it is measured as drift and is claim L3.
    propagation: >-
      One-step propagation is defined and measurable: traversing one edge maps
      the parent's tuple to the child's, and the DIFFERENCE (value delta in
      bits, qualifiers dropped, attributes gained) is the per-edge observable.
      Two edge statistics are reported: mean absolute value drift per edge, and
      qualifier survival rate per edge per qualifier class.
    survival_score: >-
      The object survives as long as attributions are explicit. It DISSOLVES
      at nodes that state the number with no attribution at all -- at which
      point there is no edge, propagation is undefined, and the DAG becomes a
      forest of orphans. That dissolution is not a failure: the fraction of
      deployment-facing nodes that are orphans is a stronger version of L2 and
      is recorded in the obstruction block below.
    newness_score: >-
      Genuinely-new-vs-repackaging: citation analysis is an old and mature
      external methodology, so the METHOD is certainly not new. What this
      program does not hold is any application of it to a deployed
      cryptographic parameter, with a matched control quantity. Score:
      ADAPTATION, and claimed as new only relative to this repository, pending
      the reviewer's semantic screen and any external check.

  null_object_control: >-
    NULL A -- EXECUTED-ROOT CONTROL (forced, blocking). Run the identical
    extraction, with the identical node-admission rule and the identical
    extractor, on a quantity whose root is an EXECUTED computation with
    published resource consumption: a published record discrete-logarithm or
    factoring computation's reported cost. Predicted: one or two roots, but
    roots that report measurements rather than model evaluations, and a high
    rate of memory figures. This calibrates what "few roots" means when the
    root is nonetheless anchored.
    NULL B -- MANY-ROOT CONTROL (forced, blocking). Same extraction on the
    generic-group level of a prime-order subgroup (the ~r^{1/2} figure), which
    competent authors re-derive rather than quote. Predicted: many roots, low
    depth. If the BLS12-381 DAG is statistically indistinguishable from NULL B,
    claims L1 and L2 are false and the label is a folk-recomputable quantity.
    NULL C -- EXTRACTOR-ARTIFACT CONTROL. Two independent extraction passes
    over the SAME frozen node list, by different agents or by the same agent
    with the node order shuffled and the hypotheses withheld. Report the
    per-field disagreement rate. If disagreement on the ROOT/NOT-ROOT judgment
    exceeds 15%, the root count is an extractor artifact and no L1 claim may be
    recorded.
    NULL D -- REACHABILITY CONTROL. Independently of the snowball, sample a
    declared list of deployment repositories and specifications and check what
    fraction of their security-level statements the snowball reached. This
    tests H1 below and bounds the selection bias directly rather than
    disclaiming it.

  discriminated_from:
    - >-
        IDEA-20260809-237e4e: sweeps the modelling choices of the cost model
        and ranks them. It measures the SENSITIVITY of the number to
        conventions. This record measures where the number came from and never
        evaluates the model. The two compose: 237e4e's top-ranked convention is
        the qualifier whose survival this record should track first.
    - >-
        IDEA-20260809-22a00c: scores the cost model against a published record
        computation. It uses the literature as ground truth for a model. This
        record treats the literature as the object of study and asserts nothing
        about any model's accuracy.
    - >-
        IDEA-20260818-1fb37d: re-solves the balancing step under a charged
        objective and declares itself BLOCKED on the KN-LIT filing. This record
        performs that filing as a by-product and makes no cost claim of any
        kind.
    - >-
        IDEA-20260809-240828: bounds the o(1) numerically. Orthogonal: it
        measures a formula's error, this measures a number's lineage.

  assumptions:
    - >-
        The session executing this record has working primary-source retrieval.
        THIS IS NOT CURRENTLY TRUE OF EVERY SESSION: IDEA-20260818-1fb37d
        records eprint.iacr.org and hal.science returning block pages on
        2026-08-18. A retrieval failure is an infrastructure outcome under
        AGENTS.md rule 3 and is NEVER recorded as evidence about the labels;
        the record halts and reports coverage instead.
    - >-
        The node-admission rule, the qualifier classes, the independence
        criterion for roots, and the seed node list are FROZEN in the
        experiment contract BEFORE any extraction begins. An audit whose
        inclusion rule moves during extraction measures the extractor.
    - >-
        Bit-level figures across nodes are comparable. Checked, not assumed:
        nodes quoting incomparable units are recorded in a separate class and
        counted (heuristic H3).

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the conclusion is the ROOT JUDGMENT: does
      this document derive the number or attribute it? Every claim in this
      record is a function of that judgment, and it is the only step where a
      human-style inference enters.
    baseline_embedding:
      parameter_slice: >-
        NULL B (generic-group level) is the parameter slice on which the
        method must reproduce the known answer: a quantity everyone re-derives
        must come out with many roots and low depth. NULL A is the opposite
        slice. A method that returns "few roots, high depth" for both has not
        measured anything about the pairing label.
      reproduction_check: >-
        FROZEN FIXTURE, not impression: the two control DAGs are extracted
        first, their root counts and depth distributions are written into the
        contract as the calibration brackets, and the pairing DAG is extracted
        afterwards by the same rule. Reporting the pairing statistics without
        both brackets is not admissible output.
    observation_collision:
      observable: >-
        The scalar "number of independent roots".
      distinct_preimage_search: >-
        DIRECTLY SEARCHED AND EXPECTED TO SUCCEED: a DAG with one root and
        forty faithful quoting nodes, and a DAG with one root and forty nodes
        that each silently changed the qualifier set, have the SAME root count
        and completely different meanings. The collision is real, and the
        additional condition that separates the preimages is the drift and
        qualifier-survival statistics -- which is why L3 is a claim and not a
        footnote. Reporting a root count alone would be unidentifiable.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Separate resource measures for the two distinct failure modes --
          "few independent derivations" (root count) and "faithful
          transmission" (per-edge drift) -- reported over disjoint node classes
          (research vs deployment-facing) and never summed into one score.
        predicted_gain: >-
          Prevents the standard error of collapsing a structural property and a
          transmission property into a single "provenance quality" number that
          no reader can act on.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the quoted bit level) fixed and vary the
          forgotten structure (the machine model, the sieve variant, the
          parameter set assumed). The intrinsic invariant distinguishing the
          resulting documents is the qualifier set.
        predicted_gain: >-
          Turns "the label is ambiguous" from an opinion into a count of
          documents whose numbers agree and whose assumptions do not.
    quantifier_order: >-
      The deployment reading of a label is: THERE EXISTS an analysis A such
      that FOR ALL deployments quoting the number, the number is the output of
      A. The honest statement after this audit is: FOR EACH node v there EXISTS
      a path to some root r(v), and r may depend on v, and the qualifier set
      may shrink along the path. Whether r is constant across v is claim L1 and
      is exactly what a quoted scalar presumes without checking.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest certifiable claim is: within the frozen node set
        reachable by the declared search on the declared date, the label traces
        to R independent roots at maximum depth D with drift statistics X. It
        CANNOT certify that no other independent derivation exists (absence in
        an unreachable literature is not absence), cannot certify that any
        number is correct or incorrect, and cannot say anything whatever about
        whether BLS12-381 or BN254 is secure.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion must FAIL is NULL B:
        a quantity with genuinely many independent derivations. If the method
        reports few roots for the generic-group level too, it is measuring
        citation habits, not provenance, and its pairing output is
        uninterpretable.
    proof_obligations:
      - claim: 'The extraction rule is frozen before extraction and is applied identically to the two controls.'
        responsibility: baseline
      - claim: 'Root/not-root disagreement between independent extraction passes is below 15%.'
        responsibility: correctness
      - claim: 'Root count for the pairing label is <= 3 and strictly below NULL B''s.'
        responsibility: strictness
      - claim: 'Snowball coverage of the sampled deployment document list is >= 70%.'
        responsibility: scope
      - claim: 'No statement about deployed-curve security is derivable from the output.'
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: 'number of independent roots for the BLS12-381 target-field level'
      direction: lower
      minimum_effect: >-
        <= 3, and strictly fewer than NULL B''s root count. >= 5 independent
        roots agreeing within 4 bits falsifies L1 and is a substantive
        reassurance that must be reported as one.
    - metric: 'fraction of deployment-facing nodes at depth >= 2 stating no machine model and no memory figure'
      direction: higher
      minimum_effect: '>= 70%; below 50% falsifies L2.'
    - metric: 'maximum absolute value drift across a single citation edge, in bits'
      direction: higher
      minimum_effect: '>= 4 bits on at least one edge; < 2 bits everywhere falsifies the value half of L3.'
    - metric: 'qualifier survival rate per edge, per qualifier class (heuristic conditionality, sieve variant, parameter set, the word "estimate")'
      direction: lower
      minimum_effect: >-
        At least one class surviving on < 50% of edges; all classes above 80%
        falsifies the qualifier half of L3.
    - metric: 'root/not-root disagreement rate between the two independent extraction passes (NULL C)'
      direction: lower
      minimum_effect: >-
        < 15%. At or above 15% the root count is an extractor artifact and L1
        may not be recorded at all -- this is a blocking gate, not a caveat.
    - metric: 'snowball coverage of the independently sampled deployment document list (NULL D)'
      direction: higher
      minimum_effect: '>= 70%; below that, every fraction reported is scoped to the reached set only and L2 is downgraded to a coverage statement.'

  minimal_test:
    design: >-
      NO COMPUTATION OF ANY COST MODEL. Four stages with stop gates.
      (T1) FREEZE, before any extraction: the seed node list (the two curves'
      originating documents, the exTNFS reference, the pairing key-size
      estimation reference, the CFRG/IETF pairing-friendly-curves draft, and
      the documentation of a declared list of pairing libraries and deployed
      protocols); the snowball depth (3); the node-admission rule; the
      qualifier classes; the root-independence criterion. Written into the
      experiment contract as an immutable artifact.
      (T2) CONTROLS FIRST, both blocking: extract NULL A and NULL B DAGs by
      the identical rule and record their root counts and depth distributions
      as the calibration brackets. STOP GATE: if NULL B does not show more
      roots than NULL A, the method does not separate the two regimes and the
      record halts and reports that.
      (T3) PAIRING EXTRACTION: snowball from the seeds to depth 3; extract the
      tuple per node; build the DAG; run NULL C's second pass; run NULL D's
      coverage sample. File every primary source opened as a KN-LIT entry with
      honest `citation_verified` and `confidence` fields, which discharges
      RQ-PAIR-f2e31f constraint 1.
      (T4) REPORT: root count, depth distribution, per-edge drift, qualifier
      survival by class, orphan fraction, coverage, extractor disagreement --
      each stated for the pairing DAG and for both controls, side by side.
      BUDGET: agent-hours, no compute. A retrieval failure halts at T3 and is
      reported as an infrastructure outcome under AGENTS.md rule 3, never as
      evidence about the labels.
    controls:
      - 'NULL A executed-root control (forced, blocking).'
      - 'NULL B many-root control (forced, blocking).'
      - 'NULL C two independent extraction passes over the frozen node list.'
      - 'NULL D independent deployment-document coverage sample.'
      - 'Frozen pre-registration of the admission rule and qualifier classes.'
    required_metrics:
      - 'independent root count, for the pairing DAG and both controls.'
      - 'depth distribution of deployment-facing nodes.'
      - 'per-edge absolute value drift in bits, distribution and maximum.'
      - 'qualifier survival rate per class per edge.'
      - 'orphan fraction: deployment-facing nodes with no outgoing attribution.'
      - 'extractor disagreement rate per extracted field.'
      - 'snowball coverage of the independent deployment sample.'
      - 'count of KN-LIT entries filed, with their citation_verified values.'

  falsification_conditions:
    - >-
        >= 5 independent roots for the BLS12-381 level, agreeing within 4 bits.
        L1 false. The label is a re-derived, cross-checked quantity and
        RQ-PAIR-f2e31f's central premise is weakened; this must be recorded
        prominently, not buried.
    - >-
        Deployment-facing nodes at depth >= 2 without machine model below 50%.
        L2 false; deployment documents carry their assumptions better than this
        record predicts.
    - >-
        Value drift < 2 bits on every edge AND every qualifier class surviving
        above 80%. L3 false; transmission is faithful.
    - >-
        NULL B indistinguishable from the pairing DAG. The statistics measure
        citation habits, not provenance; controlled null, no finding.
    - >-
        NULL C disagreement >= 15%. The root judgment is not reproducible; no
        root count may be recorded and the method must be re-specified.
    - >-
        NULL D coverage < 70%. Every fraction is scoped to the reached set and
        L2 becomes a coverage statement rather than a claim about deployment.

  confounders:
    - >-
        SEARCH-SURFACE BIAS: what a session can reach is not what exists.
        Paywalled, non-indexed, and non-English sources are systematically
        missing, and their absence would bias the root count DOWNWARD --
        i.e. toward this record's own hypothesis. NULL D bounds it; it does not
        remove it, and the direction of the residual bias is stated in every
        report of L1.
    - >-
        JUDGMENT LOAD IN "INDEPENDENT": two analyses using the same published
        polynomial selection with different code are a boundary case. The
        criterion is frozen in T1 and every boundary call is recorded
        individually so a reviewer can re-adjudicate without re-extracting.
    - >-
        HINDSIGHT ON QUALIFIERS: a qualifier "dropped" may have been stated
        elsewhere in the citing document. Extraction is per-document, not
        per-sentence, and this is stated as the resolution limit.
    - >-
        THE AUDITOR IS A NODE: this program's own records quote levels. The
        extraction must include them and must not treat this repository as
        privileged; internal records are marked as such and reported
        separately.

  interpretation_limits:
    - >-
        NO ATTACK IS MOUNTED, NO COST MODEL IS EVALUATED, and no statement that
        any deployed curve is broken or safe may be derived from this record.
        A label with one root may be entirely correct.
    - >-
        Every statistic is scoped to the frozen node set, the declared search
        surface, and the extraction date. It is not a claim about the
        literature.
    - >-
        "Drift" is a property of documents, not of mathematics. A downstream
        number differing from its parent may be a correction, and the record
        must report the direction and the stated reason, never an implication
        of error.
    - >-
        The KN-LIT entries produced are filed at the confidence the reading
        actually supports; an abstract-level read is filed as such, exactly as
        KN-LIT-2663's own "Not verified here" section requires.

  heuristic_assumptions:
    - id: H1
      statement: >-
        FOR the deployment-facing document population, the depth-3 snowball
        from the frozen seed list reaches a fraction >= 0.7 of the nodes that
        state a security level for BLS12-381 or BN254, and the reached subset
        does not differ from the unreached subset in root-distance by more than
        1 in mean depth.
      rigorous_support: >-
        Rigorous ingredient: capture-recapture estimation gives an unbiased
        population estimate when two independent samples are available, and
        the coverage of a snowball is bounded below by the fraction of an
        independently drawn sample it recovers. THE GAP, stated rather than
        hidden: the second sample (a declared list of deployment repositories)
        is not independent of the first, since popular repositories are also
        well cited, so the coverage estimate is itself biased upward. This
        assumption imitates the standard systematic-review coverage
        convention, and it is the weakest assumption in the record.
      validation_plan: >-
        SAMPLE: a pre-declared list of >= 30 deployment artifacts (pairing
        library repositories, protocol specifications, audit reports) chosen
        without reference to the snowball; extract their security-level
        statements independently; count how many are nodes the snowball
        reached. COMPARE: recovered fraction against the 0.7 threshold, and the
        mean root-distance of recovered vs unrecovered nodes. TAIL CHECK: the
        unrecovered node furthest from any root. TRANSFER ASSUMPTION, STATED:
        nothing is claimed about documents outside the declared search surface,
        in any language or venue the session could not reach.
      falsification_condition: >-
        Recovered fraction < 0.7, or mean root-distance differing by > 1
        between recovered and unrecovered nodes. Either falsifies H1, and L2 is
        then reported as a statement about the reached set only.
    - id: H2
      statement: >-
        FOR two roots judged INDEPENDENT by the frozen criterion (no shared
        implementation lineage, no shared polynomial selection, no shared
        fitted constants), their numerical outputs are not deterministically
        tied, so agreement between them is evidence of correctness rather than
        of common origin.
      rigorous_support: >-
        Rigorous ingredient: none available; this is a meta-analytic
        independence assumption of exactly the kind that fails silently in
        every field that makes it. It imitates the standard convention that
        replications with disjoint code and disjoint parameter choices have
        weakly dependent errors. STATED AS THE RECORD'S PRIMARY EPISTEMIC RISK.
      validation_plan: >-
        SAMPLE: for every pair of roots, record shared authors, shared
        institutions, shared software artifacts, shared parameter tables, and
        whether one cites the other for anything at all. COMPARE: the claimed
        independence against those five indicators. TAIL CHECK: the pair with
        the most shared indicators that is still judged independent -- that
        pair is reported explicitly in the deliverable so a reviewer can
        overrule the judgment without re-running anything. TRANSFER ASSUMPTION,
        STATED: independence is asserted only over the five recorded
        indicators, never in a statistical sense.
      falsification_condition: >-
        Any root pair judged independent that shares a software artifact or a
        parameter table; the criterion is then wrong and the root count must be
        recomputed with that pair merged.
    - id: H3
      statement: >-
        FOR the extracted node set, at least 80% of stated levels are in
        directly comparable units (log2 of an operation count for the same
        problem), so per-edge drift measured in bits is well defined.
      rigorous_support: >-
        Rigorous ingredient: none; this is a measurement-commensurability
        assumption, and it imitates the convention that "bits of security" is a
        single scale. It is known to be false in general -- an operation count
        and an AES-equivalent level are different quantities -- which is why
        the fraction is measured rather than assumed.
      validation_plan: >-
        SAMPLE: classify every extracted level into unit classes (operations,
        AES-equivalent, "bits" unqualified, symmetric-equivalent) during
        extraction. COMPARE: the fraction in the dominant class against 0.8.
        TAIL CHECK: the largest drift observed on an edge that crosses a unit
        boundary. TRANSFER ASSUMPTION, STATED: drift is reported per unit class
        and never across classes.
      falsification_condition: >-
        Dominant unit class below 80%; the drift metric is then redefined per
        class and the cross-class edges are reported as an incommensurability
        count, which is itself a finding about how the label travels.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED OR MOVED. This record proposes no algorithm, and
      "faster" is not among its claims. Its cost is agent-hours: order 10-30
      hours of retrieval and extraction for the pairing DAG plus both controls,
      dominated by primary-source reading. This is stated plainly because
      agents/idea-generator.md ranks non-exponent-moving records low by
      default, and this record accepts that ranking on the exponent axis.
    memory_exponent: >-
      Negligible: the DAG is at most a few hundred nodes and fits in a single
      YAML artifact. No memory-time tradeoff exists. Communication cost is the
      retrieval traffic and is likewise negligible. STATED so the record is not
      credited with a memory-honesty it did not have to earn.
    best_known: >-
      Frontier rows checked, on the axis this record actually occupies (what
      this program knows about the provenance of the two labels): (i)
      RQ-PAIR-f2e31f's own provenance block -- RECALLED, unverified, zero
      KN-LIT filings; (ii) IDEA-20260818-1fb37d's novelty_screen -- two web
      searches, three blocked primary fetches, zero filings; (iii) KN-LIT-3742
      and KN-LIT-3743 -- title-level records; (iv) KN-LIT-2223 -- title-level;
      (v) KN-LIT-2663 -- an abstract-level bulk-seeded record with an explicit
      "Not verified here" section. The incumbent state of this program's
      knowledge of the labels' provenance is: nothing verified. On the
      COMPUTATIONAL axis this record is dominated by every sibling proposal,
      trivially, because it computes nothing.
    hidden_overhead: >-
      The o(1) here is human judgment. Two extractors will not agree perfectly
      on ROOT vs NOT-ROOT nor on qualifier classes; NULL C measures that
      disagreement and gates the claim on it. The other hidden overhead is
      search-surface bias, whose direction (downward on root count, i.e. toward
      this record's hypothesis) is known and stated, but whose magnitude is
      not bounded by anything in the design.
    tradeoff_note: >-
      The only tradeoff is depth versus coverage: a depth-3 snowball over a
      wider seed set costs linearly more agent-hours and raises coverage. The
      design fixes depth 3 and measures coverage rather than assuming it. The
      work is embarrassingly parallel across nodes and has no sequential depth
      beyond the snowball's three rounds.

  obstruction:
    statement: >-
      ANTICIPATED, TO BE MEASURED, NOT ASSERTED. The likely obstruction is
      ORPHANING: deployment-facing documents that state a level with no
      attribution at all. Where that happens the DAG has no edge, drift is
      undefined, and the object dissolves -- and the dissolution is a stronger
      finding than the drift it replaces, because a number transmitted without
      any citation cannot be audited by any method that follows citations.
    quantity: >-
      The orphan fraction: deployment-facing nodes stating a level for
      BLS12-381 or BN254 with zero outgoing attribution edges, over all
      deployment-facing nodes in the frozen set.
    value: >-
      NOT YET MEASURED. Recording a value before the extraction would be
      fabrication under AGENTS.md rule 5.
    measured_by: []
    scope: >-
      To be claimed only over the frozen node set, the declared search surface,
      and the extraction date. Not a claim about the literature or about any
      document not in the set.
    resource_check:
      examined: true
      reading: >-
        READ AS A RESOURCE. A high orphan fraction is the quantity a
        STANDARDS-INHERITANCE analysis wants: it measures how much of a
        deployment's security argument is carried by unattributed constants,
        and it is the natural input to any policy about what a specification
        must restate. It is also directly actionable inside this program: a
        high orphan fraction raises the marginal value of filing the roots as
        KN-LIT entries, because the corpus then holds the only auditable copy
        of the chain. Conversely a LOW orphan fraction is the precondition any
        future automated provenance tooling needs, and its absence would close
        that tooling direction cheaply. If neither reading is taken up, that is
        recorded honestly and is not a closure.
      spawned_ids: []

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES.
    AS AN ATTACK: n/a -- no attack is proposed. Every frontier row (exTNFS,
    SexTNFS, the Kim-Jeong composite-degree extension, the published pairing
    key-size re-estimates, the Galois linear-algebra speedup of KN-LIT-7643,
    the lattice-sieving of KN-LIT-4634) dominates this record trivially,
    because this record computes nothing an attacker could run.
    AS A COST MODEL: dominated by every one of those rows and by all twelve
    sibling proposals under this RQ; it states no cost.
    AS A PROVENANCE STUDY OF THESE TWO LABELS: the published re-estimation
    papers contain their own literature reviews and therefore partially do
    this work for the research-facing half of the graph, and they dominate on
    coverage of the estimation literature -- BUT the citation supporting that
