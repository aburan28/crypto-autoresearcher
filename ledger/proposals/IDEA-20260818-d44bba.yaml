  recommended_priority: high

  honest_prior_of_survival: >-
    0.8 that the pairing label has <= 3 independent roots (L1) CONDITIONAL on
    retrieval working. 0.75 that L2's 70% threshold is met. 0.6 that L3 finds a
    >= 4-bit drift; higher, about 0.85, that it finds a qualifier class
    surviving below 50%, since dropping the conditionality of an estimate is
    the commonest transmission loss. 0.5 that NULL A and NULL B separate
    cleanly enough to calibrate. 0.4 that the executing session has working
    primary-source retrieval at all, which is the dominant risk and is an
    infrastructure risk, not a scientific one.

