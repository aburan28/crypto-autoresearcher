idea:
  id: IDEA-20260818-d44bba
  question_id: RQ-PAIR-f2e31f
  goal_id: GOAL-PAIR-001
  added: '2026-08-18'
  title: >-
    THE LABEL IS AN EDGE IN A CITATION GRAPH BEFORE IT IS A NUMBER: build the
    provenance DAG of every quoted security level for BLS12-381 and BN254,
    count its ROOTS, and measure the value-drift and qualifier-loss along its
    paths, against a control quantity whose provenance is an executed
    computation
  class: measurement

  claim: >-
    A deployed security label is a proposition with a measurable provenance
    structure, and this program can measure it without touching a sieve.
    DEFINITIONS, fixed before extraction. A NODE is a document that states a
    numeric security level (in bits) for BLS12-381 or BN254 -- research paper,
    standards draft, library documentation, protocol specification, audit
    report, curve-selection note. An EDGE u -> v exists when u attributes its
    number to v. A node is a ROOT when it derives the number from a cost model
    it states, rather than attributing it. Two roots are INDEPENDENT when they
    share neither implementation lineage, nor polynomial selection, nor the
    fitted constants of the cost model; sharing only the underlying algorithm
    (exTNFS) does not make two roots dependent, and sharing a code artifact
    does.
    (L1) The BLS12-381 target-field level has at most 3 independent roots.
    (L2) At least 70% of DEPLOYMENT-FACING nodes (library docs, protocol
    specifications, audit reports, standards drafts) sit at depth >= 2 from any
    root, and state neither a machine model nor a memory figure alongside the
    number.
    (L3) There is measurable DRIFT on at least one edge: a node states a value
    differing from its cited parent's by >= 4 bits, OR drops a qualifier the
    parent carried (the heuristic conditionality, the sieve variant assumed,
    the parameter set, the word "estimate").
    THE NEGATIVE OUTCOME IS FULLY MEANINGFUL AND IS NOT A NULL RESULT: >= 5
    independent roots agreeing within 4 bits would establish that the label IS
    a cross-checked, re-derived quantity, which would deprioritise the whole
    of RQ-PAIR-f2e31f's premise and should be recorded as doing so.
    NOTHING HERE ASSERTS THAT ANY LABEL IS WRONG, that any curve is broken, or
    that any curve is safe. A number with exactly one root may be perfectly
    correct. What is claimed is a property of the CITATION STRUCTURE, and the
    only admissible output is of the form "the BLS12-381 level as quoted by
    deployment-facing documents traces to R independent roots at maximum depth
    D, with drift statistics X".

  mechanism: >-
    The RQ's decision_target contains a factual sub-question that no
    computation can answer and that a bounded literature audit can: is the
    deployed label a measured quantity or one model output inherited by
    citation? That is a question about a graph, and the graph is finite,
    enumerable, and frozen at extraction time.
    The mechanism that makes it discriminating rather than descriptive is the
    CONTROL. Citation graphs in cryptography are shallow and repetitive for
    every quantity, including quantities of unimpeachable provenance, so the
    raw statistics of the BLS12-381 DAG mean nothing on their own. Running the
    identical extraction on (a) a quantity whose root is an EXECUTED
    computation with published resource consumption -- a record DL/factoring
    computation -- and (b) a quantity with many genuinely independent
    derivations -- a generic-group bound such as the sqrt(r) level of a
    prime-order subgroup, which any competent author re-derives in one line --
    gives two calibration points bracketing the space. The pairing label's
    position between those brackets is the measurement. If the pairing DAG
    looks like the generic-group DAG, the label is a folk-recomputable
    quantity; if it looks like the record-computation DAG, it is anchored to
    something executed; if it looks like neither and has one root at depth 4,
    that is the RQ's premise confirmed with a number attached.
    This record also DISCHARGES RQ-PAIR-f2e31f constraint 1 as a by-product:
    the extraction requires opening and filing the exTNFS reference and at
    least one pairing key-size estimation paper as KN-LIT entries, which is
    precisely the filing that IDEA-20260818-1fb37d records itself as blocked
    on. That is the reason to run it first rather than last.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Corpus greps in this worktree on 2026-08-18, bounded to four queries by
      MECHANISM keyword rather than by exhaustive sweep, per the dispatching
      Coordinator's instruction to bound effort: 'question_id: RQ-PAIR-f2e31f'
      over ledger/proposals with 12 lines of context (13 sibling proposals
      recovered with title, class and claim head); 'RQ-PAIR-f2e31f' over
      ledger/ (18 files); 'descent|individual logarithm|amortiz|precomputation'
      over ledger/proposals (hit the 40-file cap, so treated as INCONCLUSIVE
      and not used to support any absence claim); plus targeted title reads of
      IDEA-20260816-dd425d, IDEA-20260816-9cfbac and IDEA-20260815-f4deca.
      Read in full: RQ-PAIR-f2e31f, IDEA-20260818-1fb37d,
      knowledge/literature/KN-LIT-2663.md, agents/idea-generator.md,
      docs/inventor-protocol.md, docs/target-result-profile.md.
      NO WEB SEARCH AND NO PRIMARY-TEXT FETCH WAS PERFORMED BY THIS SESSION.
      Every external reference below is therefore `recalled` and the honest
      novelty label is `unverified`.
    results: >-
      SIBLING PROPOSALS UNDER THIS RQ, and how each differs. 15e1cd runs a
      certified small-field DL as a calibration anchor. 217be0 measures the
      descent as a per-target cost against amortised precomputation. 240828
      bounds the o(1) against observed cost. 172a9e measures the distribution
      over polynomial selections. 0676d4 measures the three-group security
      imbalance. 1a5cb2 states matrix dimension and weight and charges memory.
      237e4e sweeps modelling choices into a ranked sensitivity table. 22a00c
      demands the cost model retrodict a published record. 1d1734 quantifies
      what the polynomial-family special form gives the sieve. 228021 builds
      the joint subgroup/target-field frontier. 481392 audits library subgroup
      checks. 1fb37d re-solves the balancing step under a charged objective.
      EVERY ONE OF THESE TAKES THE LITERATURE'S NUMBERS AS INPUTS AND
      RECOMPUTES SOMETHING. NONE of them measures where the numbers came from.
      NOT FOUND in the screened set: any record that treats the quoted level
      as an object with provenance, any root count, any drift or
      qualifier-loss statistic, any control quantity for citation-structure
      statistics.
    verdict: >-
      UNVERIFIED. The screen was bounded and one query saturated its cap, so
      this is not an exhaustive corpus check; and no external search was run at
      all, so nothing is claimed about whether such an audit exists in the
      literature (systematic-review and citation-analysis methodology is a
      mature field outside cryptography, and a pairing-specific instance may
      well exist). What is claimed: among the thirteen sibling proposals this
      session actually read, none has this object. The reviewer's semantic
      index over 48,428 points is the real duplicate check and must be run
      before this record is acted on.

  citations:
    - ref: RQ-PAIR-f2e31f
      provenance: internal
      claim: >-
        The RQ's own provenance block states that its bit figures are RECALLED
        FROM MODEL MEMORY ON 2026-08-09, NOT WEB-SEARCHED, NOT READ IN PRIMARY
        TEXT, NOT FILED AS KN-LIT, and its constraint 1 forbids recording any
        cost figure before the exTNFS reference and at least one pairing
        key-size estimation paper are filed. This record is the instrument that
        discharges that constraint.
      verified_by: 'this session read ledger/questions/RQ-PAIR-f2e31f.yaml in full on 2026-08-18'
    - ref: IDEA-20260818-1fb37d
      provenance: internal
      claim: >-
        Its `blocked_on` field records that eprint.iacr.org and hal.science
        both returned block pages to the 2026-08-18 session, so the KN-LIT
