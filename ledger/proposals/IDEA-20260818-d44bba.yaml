    control-calibrated drift statistics, no dominating row was identified in
    the screened corpus, and the honest label for those two axes is UNKNOWN
    rather than absent. NOT NULL ON ANY AXIS.
  sota_delta: >-
    QUANTITATIVE, AND A PREDICTION RATHER THAN A RESULT. No exponent moves; no
    cost figure is produced. Deliverable versus incumbent: a DAG over an
    expected 60-200 nodes with a stated independent-root count R, a depth
    distribution, per-edge drift in bits, qualifier survival per class, and an
    orphan fraction -- against an incumbent state in which this program holds
    ZERO verified statements about these labels' provenance (five corpus
