idea:
  id: IDEA-20260815-5f2a58
  question_id: RQ-ECDLP-002
  added: '2026-08-15'
  title: >-
    A HUNDRED PROPOSALS IS A PORTFOLIO AND A PORTFOLIO HAS AN EXPECTED
    YIELD: state this batch's own prior of survival explicitly and check it
    against the program's historical base rate
  class: theory

  claim: >-
    Every record in this batch carries an honest prior of survival.
    Aggregated, those priors predict how many will produce a usable result.
    The program has a history of executed batches whose outcomes are
    recorded, giving a base rate. Comparing the batch's aggregate prediction
    against that base rate is the cheapest available test of whether this
    batch's priors are calibrated or optimistic.

  mechanism: >-
    Aggregate the batch's stated priors into an expected yield. Extract the
    historical outcome rate from executed ECC batches. Compare, and report
    the batch's implied calibration.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Applies to the 2026-08-15 batch and the program's executed-batch
      history; grep 'honest_prior_of_survival' across the corpus and the
      recorded outcomes of past batches.
    results: >-
      Priors are required on every proposal and are recorded; no record
      aggregates them or compares against the historical base rate.
    verdict: >-
      ADAPTATION. Calibration checking is standard forecasting practice;
      the contribution is applying it to this program's own stated priors,
      which are required but never scored.

  object_first_candidate:
    tracked_object: >-
      THE BATCH'S AGGREGATE PRIOR, checked against the program's
      historical outcome rate.
    lossiness: >-
      Aggregating priors discards per-record detail, which is what makes a
      portfolio-level calibration statement possible.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while past batches' outcomes are extractable; the base rate
      is only as good as that extraction and past batches are few.

  null_object_control: >-
    NULL 1 -- a past batch whose priors and outcomes are both recorded, used
    to measure that batch's calibration directly rather than inferring it.
    NULL 2 -- priors drawn at random, which must show no calibration; a
    method finding calibration in noise is wrong.

  discriminated_from:
    - >-
        The result-class spectrum record in this batch, which defines what
        counts as a usable result; this record's yield count depends on
        that definition and the two must use the same one.
    - >-
        The batch self-screen record in this batch, which deduplicates;
        duplicates would inflate the aggregate yield and the screen should
        run first.

  assumptions:
    - >-
        Past batches' outcomes are extractable and comparable to what this
        batch's priors predict, which requires a shared definition of a
        usable result.
    - >-
        The stated priors are genuine forecasts rather than conventional
        numbers; if they cluster at round values that is itself evidence
        they are conventional.

  predictions:
    - metric: >-
        random-prior null
      direction: different
      minimum_effect: >-
        FORCED no calibration; finding it in noise means the method is
        wrong.
    - metric: >-
        past-batch calibration
      direction: different
      minimum_effect: >-
        The base rate against which this batch's aggregate is read,
        measured rather than assumed.
    - metric: >-
        this batch's aggregate expected yield
      direction: different
      minimum_effect: >-
        The prediction, stated before execution so it can be scored
        later.
    - metric: >-
        distribution of stated priors
      direction: different
      minimum_effect: >-
        Reported explicitly; clustering at round values would indicate
        the priors are conventional rather than considered.

  minimal_test:
    design: >-
      Aggregate the batch's priors, extract the base rate from past
      batches, run both nulls.
    controls:
      - >-
          Random-prior null.
      - >-
          Past-batch direct calibration measurement.
      - >-
          One definition of a usable result shared with the result-class
          record.
      - >-
          Prior distribution reported so conventional numbers are
          visible.
    required_metrics:
      - >-
          Aggregate expected yield with its distribution.
      - >-
          Historical base rate from executed batches.
      - >-
          Prior distribution across the batch.
      - >-
          Both null outcomes.

  falsification_conditions:
    - >-
        The random-prior null shows calibration. Method wrong.
    - >-
        The aggregate substantially exceeds the historical base rate. This
        batch's priors are optimistic and its expected yield should be
        discounted, which is worth knowing before scheduling.
    - >-
        The aggregate matches the base rate. The priors are calibrated
        against history, which is the most that can be claimed for
        forecasts of this kind.
    - >-
        Priors cluster at round values. They are conventional rather than
        considered, which undermines the whole prior-of-survival
        requirement and is a process finding.

  confounders:
    - >-
        SMALL HISTORY: few executed batches means the base rate has a wide
        interval, so a calibration verdict may not be supportable at all
        and that must be stated rather than glossed.
    - >-
        DEFINITION DRIFT: what counted as a usable result in past batches
        may differ from what this batch means, which would make the
        comparison invalid.

  interpretation_limits:
    - >-
        A calibration check on forecasts; establishes nothing about any
        record's content.
    - >-
        Scoped to the batch's stated priors and the extractable history.
    - >-
        A calibration verdict is only as good as the base rate's interval,
        which few past batches will make wide.

  heuristic_assumptions:
    - id: HEUR-CALIB-1
      statement: >-
        The program's executed ECC batches provide a base rate against
        which a new batch's aggregate prior can be scored.
      rigorous_support: >-
        Rigorous ingredient: for repeated forecasts with recorded
        outcomes, calibration is measurable by standard scoring rules,
        which is exact given the data. THE GAP: the batches differ
        enormously in kind -- some were measurement batches and some
        were protocol design -- so pooling them into one base rate
        assumes an exchangeability that almost certainly does not hold,
        and stratifying would leave strata too small to estimate.
      falsification_condition: >-
        Past batches whose outcome rates differ so much by kind that no
        single base rate is defensible.
      validation_plan: >-
        SAMPLE: every executed ECC batch with recorded priors and
        outcomes. COMPARISON: outcome rate per batch, checked for
        heterogeneity before pooling. TAIL CHECK: the batches most
        unlike this one in kind, reported separately. TRANSFER: stated
        and unjustified if heterogeneity is large.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic aggregation and extraction from records.
    memory_exponent: >-
      Negligible.
    best_known: >-
      No incumbent calibration measurement exists; priors are required on
      every proposal and never scored against outcomes.
    hidden_overhead: >-
      Batch heterogeneity may make a single base rate indefensible, which
      would leave the comparison unavailable rather than merely imprecise.
    tradeoff_note: >-
      Scoring a batch's priors before execution costs nothing and makes
      the batch's own expected yield falsifiable later, which is the only
      way the prior requirement becomes more than a formality.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As forecasting: entirely standard and
    dominated by the calibration literature. As a check on this program's
    own stated priors: none exists. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: this batch's aggregate
    expected yield stated before execution so it can be scored afterwards,
    the program's historical base rate where the batches are homogeneous
    enough to pool, and the distribution of stated priors showing whether
    they are considered forecasts or conventional numbers.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that the batch's priors aggregate cleanly. 0.4 that past batches are
    homogeneous enough for a defensible base rate, which is the binding
    difficulty. 0.5 that this batch's aggregate exceeds the historical rate,
    since single-pass ideation batches tend toward optimism and this one is
    no exception.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-ECDLP-002
    - KN-TECH-056
    - GOAL-ECDLP-001
    - docs/inventor-protocol.md
    - KN-TECH-056
    - KN-TECH-080
    - docs/inventor-protocol.md
