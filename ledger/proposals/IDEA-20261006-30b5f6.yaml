idea:
  id: IDEA-20261006-30b5f6
  title: >-
    Square bias of x(P+Q) x(P-Q) - x(P) x(Q) for one frozen public point
  class: measurement
  claim: >-
    Let E be y^2 = x^3 + 6x + 2. Let p be the smallest prime with
    23 ≤ p ≤ 120 such that E over F_p is nonsingular and has at least
    24 affine points with nonzero y. Let Q be the first such point in
    lexicographic x then least nonnegative y. Let S be the affine
    points P with nonzero y, P different from Q and from -Q, x(P)
    different from x(Q), and both P+Q and P-Q affine. Let f be the
    fraction of P in S for which the field element
    x(P+Q) x(P-Q) - x(P) x(Q) is a nonzero square in F_p. The claim
    is that |f - 1/2| is strictly above the 95th percentile of the
    same absolute deviation on 300 shuffles of the x-coordinates of
    the points that appear, with the addition graph held fixed. No
    exponent improvement is claimed.
  mechanism: >-
    OBJECT FRAME. Representation R1: one field element built from four
    x-coordinates, P, Q, P+Q, and P-Q. Operation set Sigma is
    translation by the single frozen point Q and by -Q, not the full
    translation action. Trichotomy: branching. The square bit of that
    element is a lossy function of the pair (P, Q). The lossy-projection
    test asks whether the bit's bias against 1/2 survives an x-shuffle
    that keeps the same addition graph. Off-limits families F1–F7 are
    not the lens. No factor base, no Edwards denominator, no
    integer-carry bit, and no chord-slope fibre is the observable.
  novelty_status: unverified
  status: proposed
  added: '2026-10-06'
  proposed_by: idea-generator
  approved_by: null
  question_id: RQ-ECDLP-623a32
  citations:
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic discrete log remains Omega(sqrt(N)). A square bias on
        one toy prime does not change that exponent.
      verified_by: >-
        design session opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        Summation polynomials are the index-calculus lens. This idea
        does not form a factor base or a summation system.
      verified_by: >-
        design session opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
        on 2026-10-06
    - ref: KN-FIND-ffe1df
      provenance: internal
      claim: >-
        Theorem C says an exactly sum-compatible bucket index on a
        prime-order group is a homomorphism. The square bit here is
        not asserted to be sum-compatible.
      verified_by: >-
        design session opened knowledge/findings/KN-FIND-ffe1df.md
        on 2026-10-06
    - ref: KR-IC-5ea2f8
      provenance: internal
      claim: >-
        Weil descent applies to curves over extension fields. This
        measurement stays on a prime field.
      verified_by: >-
        design session opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-5ea2f8.yaml
        on 2026-10-06
    - ref: chord-and-tangent identity for x(P+Q) + x(P) + x(Q)
      provenance: recalled
      claim: >-
        Pointer only. A reviewer may compare the product in this claim
        with the slope-square identity for a sum of three x-coordinates.
        This proposal does not treat that identity as a proof that the
        product residue is biased, and the test measures the residue.
      verified_by: null
  assumptions:
    - >-
      A nonzero square is a value s in F_p, s ≠ 0, with s^{(p-1)/2} = 1.
      Zero is not counted as a nonzero square. A nonsquare has the
      power equal to p-1, reduced as -1.
    - >-
      Q is frozen before f is computed. The scan stops at the first
      eligible prime. Later primes are not scored.
    - >-
      Shuffles permute x-coordinates among the points that appear in
      the expression and do not redraw the curve.
  proof_search_map:
    bottleneck: >-
      Whether the nonzero-square rate of this four-term element sits
      above a shuffle percentile. A rate inside the percentile is a
      fair bit on this curve, not a faster discrete log.
    baseline_embedding:
      parameter_slice: >-
        Generic exponent 1/2 from KR-RHO-13bf67. This measurement does
        not run rho.
      reproduction_check: >-
        For every scored P, check that P, Q, P+Q, and P-Q lie on the
        curve, and recompute the Legendre symbol by the field power.
    observation_collision:
      observable: the nonzero-square bit of x(P+Q) x(P-Q) - x(P) x(Q)
      distinct_preimage_search: >-
        Two points in S with the same bit and different values of the
        field element show the bit is not injective. The claim does
        not need injectivity. The claim fails when |f - 1/2| does not
        beat the shuffle percentile.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fibre of one square bit built from a frozen public point Q.
        predicted_gain: >-
          A numerical gap against 300 x-shuffles. No exponent change.
    quantifier_order: >-
      There exists a smallest prime p with 23 ≤ p ≤ 120 such that E
      has at least 24 affine points of nonzero y, and for the
      lex-first such Q the absolute deviation |f - 1/2| strictly
      exceeds the 95th percentile of 300 x-shuffles.
    method_ceiling:
      strongest_certifiable_claim: >-
        One toy frequency gap on one curve and one prime. Nothing
        about collision time.
      nearby_object_control: >-
        The 300 shuffles are the null. A second frozen point, the
        lex-second affine point of nonzero y, is scored with the same
        rule and does not enter the primary percentile.
    proof_obligations:
      - claim: >-
          The absolute deviation |f - 1/2| either exceeds the stated
          percentile or it does not.
        responsibility: feasibility
      - claim: The exponent 1/2 is unchanged by one square bit.
        responsibility: scope
    not_applicable_reason: >-
      This is a measurement of one residue bias, not a theorem, bound,
      certificate, reduction, or closure.
  predictions:
    - metric: >-
        |f - 1/2|, f the fraction of P in S whose four-term element is
        a nonzero square
      direction: higher
      minimum_effect: >-
        Strictly above the 95th percentile of the same absolute
        deviation on 300 x-shuffles. A finished value at most that
        percentile is the concrete negative.
    - metric: size of S
      direction: different
      minimum_effect: S is nonempty; an empty S is a failed premise, not a percentile miss
  minimal_test:
    design: >-
      Scan primes from 23 through 120. Skip singular models. On each
      prime count affine points with nonzero y. At the first prime
      with at least 24 such points, freeze Q, build S, compute f, and
      draw 300 shuffles. Stop. If no prime qualifies, record a failed
      premise and do not change the equation.
    controls:
      - On-curve control for P, Q, P+Q, and P-Q.
      - Legendre symbol by the field power, not by a floating square-root.
      - 300 Fisher-Yates shuffles of the x-coordinates used in the element, addition graph fixed.
      - The lex-second point is a side score and does not set the percentile.
    required_metrics:
      - p and the coordinates of Q
      - "|S| and f"
      - the 95th percentile absolute deviation of the 300 shuffles
      - the side score for the lex-second point
  falsification_conditions:
    - >-
      The curve is fully scored, the on-curve control passes, S is
      nonempty, and |f - 1/2| is at most the 95th percentile of the
      300 shuffles.
    - No prime with 23 ≤ p ≤ 120 has 24 affine points of nonzero y.
    - S is empty on the selected prime.
  confounders:
    - >-
      An algebraic identity could force the element to be a square.
      That would push f near 1 and can beat the shuffle. The shuffle
      is what separates an identity from a sampling accident. This
      proposal does not assert that such an identity holds.
    - The first eligible prime can be small. The scope is that one p.
    - Q depends on lexicographic order. The test does not switch Q after seeing f.
  interpretation_limits:
    - A gap on one prime at most 120 is claim_tier toy.
    - Passing the percentile test does not say the bit is useful in a walk.
    - The bit is not claimed to be sum-compatible. Theorem C is a fence.
    - >-
      This is not an integer-carry agreement, not a chord-slope fibre
      census, and not an Edwards denominator.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On the fixed set S, a uniform shuffle of the x-coordinates
        that the element reads produces absolute deviations |f - 1/2|
        whose 95th percentile among 300 draws is the null cutoff. No
        transfer to a larger prime is assumed. The rate 1/2 is the
        nonzero-square density (p-1)/(2p), and the comparison is the
        shuffle percentile rather than a normal approximation.
      rigorous_support: >-
        Finite uniform model on a fixed set. No character-sum bound is
        used. KR-IC-5a43e5, opened in this session, is not a
        distribution for this element.
      validation_plan: >-
        Draw 300 x-shuffles with a frozen SHA-256 Fisher-Yates seed
        string that names this idea id. Compare f with rank 285 of the
        300 absolute deviations, one-based, after sorting
        nondecreasing, so the cutoff is the 15th value from the top.
        Equality does not exceed. A floating-point percentile voids
        the comparison.
  target_complexity:
    time_exponent: unchanged p^{1/2}
    memory_exponent: unchanged O(1) for rho; the measurement stores O(p) points with p at most 120
    best_known: Pollard rho Theta(sqrt(N)), KR-RHO-13bf67
    hidden_overhead: none; no new algorithm
    tradeoff_note: >-
      No tradeoff. Each element costs two additions and one Legendre
      symbol.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    No opened row dominates this square bias. Rows opened and not
