idea:
  id: IDEA-20260805-d66193
  question_id: RQ-SSI-001
  added: '2026-08-05'
  goal_id: GOAL-SSI-001
  title: >-
    Two 2026 claims about End(E) differ by an exponential factor and cannot both be about
    the same input: a quantifier-order and observation-collision adjudication that either
    relocates this goal's baseline or exhibits the hidden "given"
  class: control

  claim: >-
    This goal's entire matched baseline is the cost of recovering a supersingular
    endomorphism ring. One 2026 result, FROZEN AND READ IN FULL IN THIS REPOSITORY
    (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md = ePrint 2026/1486), puts that cost at
    p^{1/3+o(1)} time and memory. A second 2026 preprint, ePrint 2026/1586, is reported --
    ABSTRACT ONLY, BODY NOT READ, RELAYED FROM THE 2026-08-05 SCOUTING BRIEF AND NOT
    VERIFIED HERE -- to obtain a Z-basis of End(E) together with its exact Gram matrix in
    poly(log p). THOSE TWO NUMBERS DIFFER BY AN EXPONENTIAL FACTOR AND AT MOST ONE OF THEM
    CAN BE A STATEMENT ABOUT A UNIFORMLY RANDOM SUPERSINGULAR CURVE PRESENTED BY ITS
    j-INVARIANT ALONE.
    The adjudication is a quantifier-order audit and it is decidable, in its decisive part,
    WITHOUT THE SECOND PAPER AT ALL. Write both claims with explicit forall/exists order over
    (p, E, the input encoding). Then apply the standard consequence chain: if End(E1) and
    End(E2) are both available as explicit maximal orders, the connecting-ideal plus
    KLPT route yields a smooth-degree isogeny E1 -> E2 in polynomial time (RECALLED,
    UNVERIFIED -- verifying it against a corpus record is a stage). Hence a poly(log p)
    algorithm taking only j(E) as input would make the supersingular isogeny problem
    polynomial, which contradicts not merely the p^{1/3+o(1)} result but every parameter
    choice of CGL, the SQIsign family, GPS, PRISM and (x)-MIKE. THE FORK IS THEREFORE
    EXHAUSTIVE AND BOTH BRANCHES ARE DELIVERABLES:
      BRANCH A -- the second claim's INPUT includes data that is itself hard to produce for
      a random supersingular curve (a maximal order presentation, an orientation, a known
      endomorphism, a special j). Then the claims are compatible, the reconciliation is
      LOCATED IN THE INPUT QUANTIFIER, and this goal has a precisely stated new open
      problem: produce that input cheaply, or prove it cannot be produced.
      BRANCH B -- the input really is j(E) for a uniformly random supersingular E. Then the
      claim is a total break of the surviving supersingular assumption, GOAL-SSI-001's
      completion criterion 1 is already met by external work, and the only correct action is
      to route it to independent review at the non-degradable tier under AGENTS.md rule 12.
    Nothing here asserts that the second paper is wrong. It asserts that the pair is
    adjudicable and that nobody has adjudicated it.

  object_first_candidate:
    tracked_object: >-
      The INPUT ENCODING of the endomorphism-ring problem -- the finite string actually
      handed to the algorithm -- followed through the claimed reduction chain: encoding ->
      what the algorithm may read -> what a witness may depend on -> what the conclusion
      quantifies over. The observable is the (forall/exists) prefix of each theorem
      statement, and the "collision" being searched for is two distinct ground-truth input
      encodings that a claim's statement fails to distinguish.
    established_families_off_limits: >-
      OFF-LIMITS AS THE PRIMARY LENS: every attack family. This record proposes no algorithm.
      Specifically off-limits: MITM/claw/vOW, KLPT as an attack (it enters only as the
      reduction whose existence is being used), orientation/CM as a mechanism (closed for
      this goal by DEC-20260804-3677f1 / EV-SSI-8aaad0 -- although the ORIENTATION-AS-INPUT
      question reappears here as a candidate for the hidden given, which is a different use
      and is flagged), torsion-image / Kani (out of RQ-SSI-001 scope), quantum hidden shift,
      SQIsign transcript statistics.
    newness_score: >-
      Quantifier auditing is elementary and the section-8 protocol mandates it. What is not
      in this corpus is the audit itself: KN-OPEN-013's framing ("no sub-p^{1/4} attack is
      known") is a 2026-07-23 snapshot that is already stale against the frozen 2026/1486
      input, and no record in this goal mentions 2026/1586 at all. The corpus's baseline for
      the central problem is therefore known to be out of date in one direction and
      unexamined in the other.
    testability_score: >-
      The decisive stage is zero-compute and zero-network: it is a derivation from the
      frozen in-repo text plus a standard reduction. The confirming stage needs one ePrint
      ABSTRACT page, which the 2026-08-05 sweep measured as returning 200 while the PDF
      endpoint returns 403 -- so the record is designed to be decisive without it.
    survival_score: >-
      An input encoding survives every step of any correct reduction, which is exactly why
      it is the right thing to track: a reduction that silently upgrades its input is the
      failure mode being hunted, and it is visible only at the encoding level.

  mechanism: >-
    PROVENANCE, STATED FIRST AND BINDING ON EVERY SENTENCE BELOW.
    READ IN FULL IN THIS SESSION: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md. Its
    section 1 states (verbatim): the endomorphism / isogeny problems "constitute the first
    entry in The Isogeny Problems [12]", "The previous best algorithms to solve them had
    complexity p^{1/2} * (log p)^{O(1)}", and this "complexity had stayed remarkably stable,
    with subsequent improvements only impacting the logarithmic cofactor". Its affected list
    is "the CGL hash function [14], the SQIsign digital signature family [7, 19, 20, 22, 34]
    ... GPS signatures [28] and PRISM [5], and the (x)-MIKE key exchange [39]".
    NOT READ, NOT VERIFIED, RELAYED AT SECOND HAND: everything about ePrint 2026/1586,
    including its existence, its author attribution, its theorem statement, and the words
    "rank-4 CVP" and "exact Gram matrix in poly(log p)". THE SOURCE OF THAT RELAY IS THE
    2026-08-05 SCOUTING BRIEF, WHICH ITSELF LABELS IT "ABSTRACT ONLY" AND STATES THAT THE
    BODY WAS NOT READ. If the paper does not exist or says something else, STAGE 1 REPORTS
    THAT AND THE AUDIT'S BRANCH A/B FORK IS APPLIED TO WHATEVER IT ACTUALLY SAYS.

    STEP 1 -- WRITE BOTH CLAIMS WITH EXPLICIT QUANTIFIERS. This is the whole method and it
    costs nothing.
      CLAIM-1 (2026/1486, READ): THERE EXISTS an algorithm A1 such that FOR ALL primes p and
      FOR ALL supersingular E/F_{p^2} GIVEN BY ITS j-INVARIANT, A1 outputs a non-scalar
      endomorphism (and thence End(E)) in expected time and memory p^{1/3+o(1)}, ASSUMING
      Heuristic 1. Las Vegas; the o(1) is superpolynomial; the input is j(E) and nothing else.
      CLAIM-2 (2026/1586, RELAYED, TO BE REWRITTEN FROM THE SOURCE IN STAGE 1): THERE EXISTS
      an algorithm A2 such that FOR ALL ... GIVEN ??? ... A2 outputs a Z-basis of End(E) and
      its Gram matrix in poly(log p). THE ENTIRE ADJUDICATION LIVES IN THE "???".
    THE QUANTIFIER TRAP BEING HUNTED, STATED IN ADVANCE: a witness (here, the basis) that is
    allowed to depend on the instance cannot be produced by a procedure whose INPUT does not
    determine it. If A2's input is an abstract maximal order O in B_{p, infinity} together
    with a curve, then A2 solves a LATTICE problem in a rank-4 quadratic space -- genuinely
    poly(log p), genuinely useful, and NOT the endomorphism-ring problem, because producing
    a maximal order matching a given j is exactly the hard step. If A2's input is j(E) alone,
    it is the endomorphism-ring problem.

    STEP 2 -- THE CONSEQUENCE CHAIN, WHICH MAKES THE FORK EXHAUSTIVE. RECALLED, UNVERIFIED,
    AND ITS VERIFICATION IS A DECLARED STAGE: given explicit maximal orders O1 = End(E1) and
    O2 = End(E2), one computes a connecting ideal I with O1 = O_L(I), O2 = O_R(I), applies
    KLPT to replace I by an equivalent ideal of smooth norm, and translates that ideal into
    an isogeny E1 -> E2 -- all in polynomial time under standard heuristics. THEREFORE:
      IF A2 takes j(E) alone, THEN the supersingular isogeny problem is poly(log p),
      THEREFORE the p^{1/2}(log p)^{O(1)} history quoted verbatim above, the p^{1/3+o(1)}
      result, and every parameter set of CGL / SQIsign / GPS / PRISM / (x)-MIKE are all
      simultaneously wrong.
    That is an extremely strong consequence, and a strong consequence is exactly what makes
    a cheap audit worth running: it converts "read a preprint" into a decidable fork.

    STEP 3 -- THE OBSERVATION COLLISION, STATED AS AN EXPERIMENT RATHER THAN AN OPINION.
    The observable carrying CLAIM-2 is the phrase "given E". Search for two ground-truth
    objects that this observable fails to separate, one on each side of the conclusion:
      OBJECT-X: a uniformly random supersingular j in F_{p^2}, presented as a j-invariant.
      OBJECT-Y: the SAME curve presented together with a known small-degree endomorphism, or
      with an orientation by a small-discriminant order, or as j = 1728 / a curve of known
      CM. For OBJECT-Y the endomorphism ring is computable cheaply and NOBODY DISPUTES IT --
      the paper's own section 1.4 (READ) exhibits the mechanism, and this goal's own closed
      orientation lane (DEC-20260804-3677f1) is about precisely such inputs.
    IF CLAIM-2'S STATEMENT DOES NOT DISTINGUISH X FROM Y, IDENTIFIABILITY FAILS AT THE
    STATEMENT LEVEL and the collision is the deliverable, independent of whether the paper's
    mathematics is correct. THIS IS A DIRECT FALSIFIER OF THE UNIFORM READING and it costs
    one careful reading.

    STEP 4 -- THE GRADED LADDER OF "GIVENS", WHICH IS WHAT MAKES THIS LOCALISE. Five input
    encodings, ordered by how much is handed over, with the pre-registered expectation of
    where poly(log p) stops being contentious:
      G1: j(E) only.                                     -- contentious; branch B.
      G2: j(E) + one non-scalar endomorphism in efficient representation.  -- the standard
          reduction makes End(E) computable; NOT contentious.
      G3: j(E) + an orientation by an order of small discriminant.         -- not contentious.
      G4: an abstract maximal order O, plus the promise that O = End(E) for some E.
          -- a rank-4 lattice problem; poly(log p) is plausible and uninteresting for
          cryptanalysis.
      G5: E of special CM / j = 1728 / a curve in the F_p-rational subfield set.
          -- not contentious.
    REPORT THE LOWEST LEVEL AT WHICH CLAIM-2'S STATED HYPOTHESES ARE SATISFIED. That level
    IS the answer, and it is a mechanism rather than a verdict: it names exactly what would
    have to be produced cheaply for the claim to bear on this goal.

    STEP 5 -- WHY THIS IS THE RIGHT USE OF THIS GOAL'S BUDGET NOW. GOAL-SSI-001's
    next_action says further progress "requires either a genuinely new mechanism or a model
    upgrade". A THIRD OPTION IS AVAILABLE AND IS CHEAPER THAN BOTH: the goal's baseline may
    already have moved, in either direction, and the goal has not checked. KN-OPEN-013's
    "no sub-p^{1/4} attack is known" is a 2026-07-23 snapshot; the frozen 2026/1486 input is
    dated later; 2026/1586 is not in the corpus at all. Auditing the baseline is the one
    action that is decisive regardless of which way it resolves.

