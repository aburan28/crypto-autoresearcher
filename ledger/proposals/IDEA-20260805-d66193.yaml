  lossy_projection_identifiability_audit:
    projection: >-
      A complete computational problem (its instance distribution, its input encoding, its
      promise, its output specification) --> the quantifier prefix of an English theorem
      statement plus one complexity expression.
    what_is_discarded: >-
      The instance distribution and, crucially, the input encoding -- which is exactly the
      information the audit is designed to recover, and exactly the information that
      complexity statements routinely omit.
    why_genuinely_lossy: >-
      Demonstrably: the ladder of step 4 exhibits five distinct problems (G1..G5) that all
      project to the same English sentence "compute End(E) given E", while their true
      complexities are believed to span p^{1/3+o(1)} down to poly(log p). Five preimages,
      one image.
    why_compatible_with_the_operations: >-
      Quantifier prefixes compose deterministically under reduction: composing two claims'
      prefixes yields the composite's prefix by a mechanical rule, which is what makes the
      step-2 consequence chain a derivation rather than an analogy.
    is_it_only_a_change_of_coordinates: >-
      NO, and the five-to-one map of step 4 is the proof. A change of coordinates would be
      invertible; here the fibre over "compute End(E) given E" is at least five-element and
      spans the entire complexity question.
    mirror_failure_check: >-
      CHECKED. The mirror failure would be a projection so lossy it is constant across
      instances -- here, an audit that returns "the input is under-specified" for every
      claim ever written, which would carry zero information. THE INSTRUMENT IS THEREFORE
      REQUIRED TO PASS A NULL: applied to a pair of statements FROM THE SAME PAPER that are
      known to be compatible (Theorem 1.1 and Theorem 1.5 of 2026/1486), it must return
      COMPATIBLE. If it manufactures a contradiction there, its verdicts elsewhere are
      worthless. That control is specified below and it can fail.

  assumptions:
    - >-
      That the relayed description of 2026/1586 is close enough to reality that the audit's
      fork is the right fork. STAGE 1 EXISTS SOLELY TO REMOVE THIS ASSUMPTION and the audit
      may not proceed past it on the relay. If the paper cannot be obtained, the audit
      reports the STRUCTURAL result (the ladder, the collision, the consequence chain) and
      records the specific claim as UNADJUDICATED, not as refuted.
    - >-
      That "recovering End(E)" means producing a maximal order together with an explicit
      correspondence to E, not producing some order or some lattice.
    - >-
      Academic / defensive cryptanalysis only. Branch B, if it ever arrived, is a claimed
      break of schemes in an active NIST process and is automatically rule-12 routed; this
      record neither performs nor authorises any such assessment.

  proof_search_map_note: >-
    The paired hypothesis H-SSI-bdc41f carries the filled four-audit proof_search_map. This
    is a proof-oriented proposal (it reasons about theorem statements and a reduction), so
    the map is mandatory and is not nulled.

  predictions:
    - metric: >-
        given_level: the lowest rung G1..G5 of the input-encoding ladder at which the
        stated hypotheses of CLAIM-2 are satisfied, after reading the source
      direction: different
      minimum_effect: >-
        PRE-REGISTERED PRIOR, FIXED BEFORE ANY FETCH: G4 (an abstract maximal order is
        given) is the single most likely rung. G1 is the branch-B outcome. THE PREDICTION IS
        NOT THAT G4 IS RIGHT; IT IS THAT THE LADDER IS DECIDABLE AND THAT A RUNG CAN BE
        NAMED. An audit that cannot name a rung has failed to produce its deliverable.
    - metric: >-
        consequence_chain_verified: whether the connecting-ideal + KLPT polynomial-time
        reduction is confirmed against a source or a corpus record
      direction: different
      minimum_effect: >-
        Binary, and REPORTED BEFORE the fork is applied. If it cannot be confirmed, step 2's
        exhaustiveness is not established and the fork must be weakened to "the two claims
        are in tension" rather than "at most one can hold".
    - metric: >-
        null_control_verdict: the audit procedure's verdict on Theorem 1.1 versus
        Theorem 1.5 of 2026/1486 (same paper, known compatible)
      direction: different
      minimum_effect: >-
        COMPATIBLE, with the reason stated (1.5 is an existence bound on a degree, 1.1 is a
        complexity statement; they quantify over different objects). Any other verdict means
        the procedure manufactures contradictions and NOTHING ELSE MAY BE REPORTED.
    - metric: >-
        positive_control_verdict: the procedure's verdict on a deliberately constructed
        inconsistent pair -- "End(E) is computable in poly(log p) for all supersingular
        E/F_{p^2} given j(E)" versus "the supersingular isogeny problem requires
        p^{1/3-o(1)}"
      direction: different
      minimum_effect: >-
        INCONSISTENT, flagged, with the connecting reduction named as the reason. If the
        procedure returns COMPATIBLE here it cannot detect a real contradiction and no
        negative may be reported.
    - metric: >-
        baseline_delta: the change, if any, to this goal's stated matched baseline for the
        supersingular endomorphism problem
      direction: different
      minimum_effect: >-
        At minimum, KN-OPEN-013's "no sub-p^{1/4} attack is known" must be confirmed or
        recorded as stale against the frozen 2026/1486 input, by a NEW record. The audit's
        floor deliverable is a dated, sourced baseline statement, which this goal currently
        does not have.

  minimal_test:
    design: >-
      Full contract at experiments/EXP-SSI-3980e3/specification.yaml. Four stages, cheapest
      and most decisive first, and stage 0 alone can produce the structural deliverable.
      STAGE 0 (zero compute, ZERO NETWORK): write CLAIM-1 with explicit quantifiers from the
      frozen in-repo text; build the G1..G5 ladder; state the observation collision X vs Y;
      derive the step-2 consequence chain and label the KLPT step RECALLED. Run the null and
      positive controls, which are both internal to this stage.
      STAGE 1 (network, ~1 hour, MAY REPORT UNRUN): fetch the ePrint ABSTRACT page for
      2026/1586 (abstracts measured at HTTP 200, PDF bodies at 403). Transcribe the theorem
      statement verbatim with its "given". If unreachable, record UNRUN under AGENTS.md
      rule 5 -- an infrastructure outcome, never mathematical evidence -- and stage 0 stands.
      STAGE 2 (zero compute): place CLAIM-2 on the ladder, apply the fork, write the result.
      STAGE 3 (zero compute): confirm or refute the KLPT reduction against KN-TECH-025 /
      KN-TECH-028 or a primary source, and adjust step 2's strength accordingly.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, forced verdict derived pre-run, CAN FAIL: Theorem 1.1
        against Theorem 1.5 of the same, read paper. Forced verdict COMPATIBLE. This is a
        genuine null because the two statements superficially concern the same objects and a
        careless procedure WILL flag them (one says p^{1/3+o(1)} time, the other says
        degree <= (p/2)^{1/3}, and conflating a degree with a running time is exactly the
        error the audit must not make).
      - >-
        POSITIVE CONTROL, the effect MUST appear: the synthetic inconsistent pair in
        predictions. If the procedure does not flag it, the instrument is blind.
      - >-
        GRADED CONTROL with 5 rungs, 3 interior: the G1..G5 input ladder. Report the verdict
        at every rung, not only at the rung finally assigned, and report whether the verdict
        sequence is monotone in "amount given" (it must be: more given cannot make a claim
        more contentious).
      - >-
        ORDERING CONTROL: stage 0's ladder, collision and consequence chain are written and
        hash-committed BEFORE any fetch, so the fork cannot be tuned to the abstract.
      - >-
        PROVENANCE CONTROL: every sentence in the output carries one of READ /
        ABSTRACT ONLY / RELAYED / RECALLED-UNVERIFIED / NOT OBTAINED, and a sentence with no
        label is an integrity failure of the package.
    required_metrics:
      - CLAIM-1 and CLAIM-2 written with explicit quantifier prefixes, each with a provenance label
      - the G1..G5 ladder with a verdict at every rung and the assigned rung for CLAIM-2
      - the null and positive control verdicts with their pre-derived forced values
      - the consequence chain with the KLPT step's verification status
      - a dated, sourced baseline statement for the supersingular endomorphism problem
      - an UNRUN record for stage 1 if the abstract cannot be obtained

  falsification_conditions:
    - >-
      The null control returns INCONSISTENT on the same-paper pair. The procedure
      manufactures contradictions; nothing is reported.
    - >-
      The positive control returns COMPATIBLE. The procedure is blind; nothing is reported.
    - >-
      The KLPT consequence chain cannot be verified. Step 2's exhaustiveness fails and the
      fork is weakened from "at most one can hold" to "in tension", explicitly and in the
      output.
    - >-
      2026/1586 does not exist, or its abstract says something structurally different. The
      relayed premise is wrong; the record says so and the ladder is applied to what is
      actually there.
    - >-
      The verdict sequence across G1..G5 is non-monotone. The procedure is not responding to
      the amount given, and its rung assignment is uninterpretable.

  confounders:
    - >-
      SECOND-HAND SOURCE, AND IT IS THE DOMINANT CONFOUNDER. The entire CLAIM-2 side rests
      on a relay of an abstract. Stage 0 is designed so that the structural deliverable does
      not depend on it, and stage 1 exists solely to remove it.
    - >-
      REFUTATION IS CHEAP AND READS AS RIGOUR. Adjudicating against an external preprint
      costs almost nothing to produce. The null control (which can fire) and the requirement
      to name a rung rather than a verdict are the guards, and they are the reason a
      "the paper is wrong" output is not an admissible deliverable of this design -- only a
      rung assignment is.
    - >-
      DEFINITIONAL DRIFT IN "GIVEN E". Between j-invariant, Weierstrass coefficients, a
      curve with marked torsion basis, and an abstract order, the phrase covers objects of
      radically different computational content. All are enumerated in the ladder rather than
      collapsed.
    - >-
      SELECTION OF THE LADDER. Five rungs were chosen; the true encoding may be off-ladder
      (for instance a curve sampled by a non-uniform procedure that leaks its walk). An
      off-ladder outcome must be recorded as a SIXTH rung rather than forced onto one of the
      five.

  interpretation_limits:
    - >-
      NOTHING HERE ESTABLISHES ANY FACT ABOUT ePrint 2026/1586. If stage 1 does not run, the
      record's only claim is structural: the ladder exists, the collision exists, and the
      consequence chain has the stated strength.
    - >-
      A branch-B outcome would be a claimed break of schemes in an active standardisation
      process. It is automatically routed to independent review at the non-degradable
      `review-breakthrough` tier (AGENTS.md rule 12), which this session cannot provide and
      does not claim.
    - >-
      NO STATUS CHANGE to KN-OPEN-013, KN-TECH-024/029/050, or any existing record is
      proposed or implied. Those are Coordinator decisions.
    - >-
      Claim tier: derivation / theory. No run, no measurement, no cost claim, no scale.
    - >-
      Forward guidance whichever branch fires: branch A converts the audit's output into a
      NEW, precisely stated open problem (produce the G-level input cheaply, or prove it
      cannot be produced for random j), which is a better open problem than the one this
      goal currently has, and is stated here so that a branch-A outcome is not read as "the
      lane is closed".

  heuristic_assumptions:
    - id: HEUR-QUANT-1
      statement: >-
        NOT LOAD-BEARING FOR THE STRUCTURAL RESULT. The ladder, the collision, and the
        quantifier rewriting are definitional and depend on no distributional assumption.
      rigorous_support: >-
        Quantifier prefixes are syntax; the five ladder rungs are five different input
        alphabets. Neither requires a probabilistic model.
      validation_plan: >-
        The null and positive controls, both internal to stage 0.
    - id: HEUR-QUANT-2
      statement: >-
        LOAD-BEARING FOR THE FORK'S EXHAUSTIVENESS: given explicit maximal orders
        O1 = End(E1) and O2 = End(E2), a connecting isogeny E1 -> E2 of smooth degree is
        computable in time polynomial in log p, under the standard heuristics of the KLPT
        line.
      rigorous_support: >-
        RECALLED, UNVERIFIED. NO SOURCE FOR THIS WAS READ IN THIS SESSION. It is the single
        step that turns "two numbers disagree" into "at most one can be about j-only input",
        and it is therefore the first thing a reviewer should attack.
      validation_plan: >-
        Stage 3 confirms it against KN-TECH-025 / KN-TECH-028 or a primary source. If it
        cannot be confirmed, the fork is weakened in the output rather than defended.
    - id: HEUR-QUANT-3
      statement: >-
        The 2026/1486 result's own conditionality (Heuristic 1: the degree of the smallest
        isogeny E -> E^{(p)} is B-smooth with probability at least u^{-u(1+o(1))},
        u = log(p/2)/(3 log B)) is inherited by any baseline statement that cites it.
      rigorous_support: >-
        Quoted verbatim from the READ text. It is a condition, not a support.
      validation_plan: >-
        The audit's baseline statement must carry the condition on its face. A baseline that
        drops it would be presenting a heuristic-conditional result as unconditional, which
        the target-result profile forbids.

  target_complexity:
    time_exponent: >-
