idea:
  archive_retry_note: >-
    This design package was re-snapshotted after the first unadmitted archive
    attempt omitted required task identifiers from its commit message.
  id: IDEA-20260808-4f3ef4
  question_id: RQ-ECDLP-002
  added: '2026-08-08'
  title: >-
    Random-from-F_p right-table null for separating x-oracle correlation from
    MITM table-distribution effects
  class: experiment
  claim: >-
    In the existing toy m=3 Semaev/MITM setup, replacing the right-half
    x(P2+P3) keys with deterministic independent uniform F_p keys while keeping
    the actual right-half pairs should remove the relation-finding correlation
    attributed to the x-oracle. This isolates the oracle/table-key association
    from the generic cost of building and probing a MITM table.
  mechanism: >-
    Arm B uses the true key x(P2+P3) for each right-half pair and probes with
    x(P1). Arm D keeps the same pair list, table size, left queries, candidate
    verification, and charged field-operation accounting, but assigns each
    right-half pair an independent deterministic uniform key u_i in F_p. Keys
    are sampled with replacement; collisions are retained and measured rather
    than removed. Any B-vs-D difference is therefore attributable only to the
    association between the left true x-coordinate and the right true sum key,
    subject to the declared toy boundary and controls.
  novelty_status: structurally_distinct_control
  novelty_screen:
    method: >-
      Searched the existing ECDLP ledger, knowledge corpus, BATCH-b3f591
      red-team reports, and EXP-SEMAEV-f48dd1 artifacts. The prior three-arm
      experiment used a random predictor on the left query side (Arm C); it did
      not randomize the right-table key while preserving the actual right-pair
      objects. The proposed Arm D is a new control object, not a claim that the
      x-oracle itself is new.
    prior_records:
      - DEC-20260808-6a7ac4
      - H-XOR-d1a480
      - EXP-SEMAEV-f48dd1
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-b3f591/reviews/TASK-20260806-a6ebe1/report.md
    verdict: >-
      Admissible as a bounded control-design successor, pending independent
      design review and Coordinator approval. It does not supersede the
      rejected yield claim and does not assert a cryptanalytic advantage.
  assumptions:
    - >-
      The deterministic key generator is independent of the curve, factor-base
      tuple, and true right-half sum, except for the declared seed and cell
      identifiers.
    - >-
      Field-operation counts and candidate-verification counts are charged
      separately; key generation and hash operations are reported as secondary
      overhead rather than silently folded into field-operation totals.
    - >-
      The toy curve and factor-base construction are unchanged from the frozen
      EXP-SEMAEV-f48dd1 corpus so that B and D differ by one declared control.
  predictions:
    - metric: yield_B_minus_yield_D
      direction: higher
      minimum_effect: >-
        If the true x(P2+P3) association matters at toy scale, the group-level
        B-D difference is positive and materially larger than the pre-registered
        null tolerance; otherwise the result is inconclusive or weakens this
        interpretation.
    - metric: relation_set_recall_B_vs_A
      direction: different
      minimum_effect: >-
        Arm B must reproduce Arm A's exact relation set on every valid cell;
        any mismatch is an implementation/control failure, not evidence for D.
    - metric: D_key_occupancy_vs_uniform_Fp
      direction: different
      minimum_effect: >-
        The exact occupancy histogram of D keys is recorded and compared with
        the deterministic uniform-with-replacement expectation; anomalous key
        generation invalidates the cell.
  minimal_test:
    design: >-
      Freeze the Arm D implementation and run only the existing 40 toy cells
      (m=3, p in {101,103,107,211}, b in {0.4,0.5}, seeds 1..5) after an
      independent design review. Compare A/B/D with the same relation-set,
      query-count, right-pair-cardinality, memory, and charged-cost controls.
    stopping_rule: >-
      Stop before execution if any required artifact, source hash, curve rule,
      factor-base rule, or null-key independence condition is underspecified.
    falsification: >-
      A valid run with B-D indistinguishable at the pre-registered group unit,
      while all controls pass, weakens the claim that the true right-table
      association is responsible for the observed toy behavior. It does not
      rule out other oracle algorithms or crypto-scale effects.
  confounders:
    - >-
      Random-from-F_p keys have a different support distribution from
      x-coordinates of curve points; occupancy and support are therefore
      measured explicitly, and a future permutation-preserving control remains
      admissible if this confound dominates.
    - >-
      The experiment does not establish an asymptotic speedup, a sub-rho
      algorithm, or a practical attack. Pollard rho and BSGS remain mandatory
      matched generic controls for any broader claim.
    - >-
      A toy positive result is only evidence about this exact MITM strategy and
      null object; it cannot be generalized to other curves, fields, m, or
      oracle interfaces.
  dominated_by: >-
    Pollard rho at O(sqrt(N)) time and O(1) memory dominates this toy MITM
    control on the actual ECDLP objective. Arm D is a diagnostic null, not a
    competing attack.
  sota_delta: >-
    Zero exponent improvement and zero claimed cryptographic advantage. The
    only decision-changing quantity is whether the observed B-vs-C contrast
    survives a right-table null control.
