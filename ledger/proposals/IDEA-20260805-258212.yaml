idea:
  id: IDEA-20260805-258212
  question_id: RQ-MAYO-001
  added: '2026-08-05'
  title: >-
    Whipping is a k-fold dilation: five exact identities that fix which
    UOV attack families whipping cannot touch and the single one it moves,
    derived before any run and before the matched baseline is quoted
  class: theory

  claim: >-
    MAYO's whipped map is a DILATION of its underlying UOV map by the integer
    k, and the dilation acts on the parameter triple in a completely
    asymmetric way that can be written down in five lines and checked at zero
    compute. If the whipped map is P*(x_1,...,x_k) = sum_i E_ii P(x_i) +
    sum_{i<j} E_ij P'(x_i, x_j) with P: F_q^n -> F_q^m the underlying UOV map
    of oil dimension o and P' its polar form, then the whipped instance has
    n* = k n variables, o* = k o oil dimension, and m* = m equations -- the
    variable and oil counts scale, the EQUATION COUNT DOES NOT. Consequently
    (i) the oil ratio n*/o* = n/o is EXACTLY invariant, so every attack whose
    applicability is a function of n/o alone -- the intersection attack in
    particular -- applies to the whipped map if and only if it applies to the
    underlying map; (ii) the intersection attack's linear solution space
    dimension d_{k'} = k' o - (k'-1) n satisfies d*_{k'} = k * d_{k'}, i.e. it
    is dilated but never changes sign; (iii) the Kipnis-Shamir exponent
    n* - 2 o* = k (n - 2 o) is multiplied by k, strictly AGAINST the attacker
    for n > 2o; and (iv) the underdetermination ratio alpha = n/m becomes
    alpha* = k n / m, multiplied by k, strictly FOR the attacker. The whole
    security cost or benefit of whipping, as far as the linear-algebraic
    invariants of the map are concerned, is therefore concentrated in ONE
    scalar, alpha* / alpha = k, and the honest matched-baseline statement is
    a TRADE, not a verdict: whipping buys a large n/o (which retires the
    intersection attack) by paying a large n/m (which is exactly the
    underdetermined-MQ exposure that KN-LIT-1818 reports as an 8-bit loss at
    MAYO Level I). This proposal derives the identities, states the two
    numbers per parameter set, and is the KN-TECH-shaped matched baseline
    that GOAL-MAYO-001's next_action makes a prerequisite for everything else
    in this goal.

  object_first_candidate:
    tracked_object: >-
      The parameter triple (variables, equations, oil dimension) =
      (n, m, o) followed through the whipping construction as a single
      object, together with the derived ratios n/o, n/m and the
      Kipnis-Shamir gap n - 2o. The point of tracking the TRIPLE rather than a
      cost figure is that whipping acts on it as a diagonal linear map with
      eigenvalues (k, 1, k): two coordinates dilate and one does not, and
      every downstream cost statement about MAYO is a function of the ratios
      that asymmetry produces.
    established_families_off_limits: >-
      Off-limits as the primary lens for this proposal: Kipnis-Shamir
      rank/eigenvalue recovery, reconciliation, the intersection attack,
      MinRank and rectangular MinRank, direct Groebner attack on the public
      key, quantum MQ speedups, and every implementation, fault, or
      side-channel route (which GOAL-MAYO-001's next_action requires to be
      filed as a separate class and which IDEA-20260805-19990a carries). This
      proposal does not propose a member of any of those families. It computes
      the ARGUMENT those families take, which is the one move the off-limits
      rule does not forbid, and it is the move the goal's next_action asks for
      first.
    newness_score: >-
      The identities are elementary and, taken one at a time, certainly known
      to the MAYO designers -- a scheme is not designed without knowing what
      its parameters do to the standard attacks. What is not in this corpus,
      and what has value here, is (a) the identities WRITTEN DOWN TOGETHER as
      a statement about the dilation map, which makes the asymmetry visible
      and makes 'does whipping cost security' answerable rather than
      rhetorical, and (b) their use to PREDICT, before reading any
      cryptanalysis, which attack family should be the one that moved. The
      corpus already contains the confirming datum (KN-LIT-1818), so this is a
      retrodiction, and it is labelled one.
    testability_score: >-
      Maximal for the identities: they are integer arithmetic on five numbers
      per parameter set and can be checked by hand. The testable content that
      can FAIL is the premise -- that the whipped map has the stated bilinear
      form and that its oil space is exactly O^k -- and that is a reading task
      against the Round-3 specification, not a computation.
    survival_score: >-
      The identities survive to cryptographic scale by construction, because
      they are exact identities on the parameters and not measurements. What
      does NOT survive is any cost conclusion drawn from them: converting
      'alpha is dilated by k' into a bit figure requires a cost model for
      underdetermined MQ, which this proposal deliberately does not supply and
      IDEA-20260805-977e16 treats as its own object.

  mechanism: >-
    DERIVED HERE. Every structural statement about MAYO below is marked either
    DERIVED (follows from the stated form of the whipped map by algebra done in
    this record) or RECALLED, UNVERIFIED (model memory of the MAYO
    specification, a candidate to check, never an authority). No MAYO document
    has been read by this session.

    THE OBJECT (RECALLED, UNVERIFIED -- Stage 0 of any experiment must replace
    this paragraph with quotations from the Round-3 specification). MAYO starts
    from a UOV-shaped multivariate quadratic map P : F_q^n -> F_q^m whose oil
    space O has dimension o STRICTLY LESS THAN m, so P alone cannot be used to
    sign: solving P(v + x) = t for x in O is a linear system with o unknowns and
    m equations and is unsatisfiable for a generic target. MAYO repairs this by
    'whipping': fix public matrices E_ij in F_q^{m x m} for 1 <= i <= j <= k and
    define the whipped map
      P*(x_1, ..., x_k) = sum_{i} E_ii P(x_i) + sum_{i<j} E_ij P'(x_i, x_j),
    where P'(u, v) = P(u + v) - P(u) - P(v) is the polar (differential) form of
    P, which is bilinear and symmetric. RECALLED, UNVERIFIED: q = 16 for every
    MAYO parameter set (KN-LIT-1205 states GF(16) for the Round-2 reference
    implementation and is itself a bulk-seeded entry), and the E_ij are drawn
    from a commutative matrix algebra F_q[A] isomorphic to F_{q^m} so that every
    nonzero F_q-linear combination of them is invertible.

    DERIVED, IDENTITY 0 (the whipped oil space). P vanishes on O and O is
    totally isotropic for P', i.e. P'(u, v) = 0 for u, v in O -- both are
    definitional for a UOV oil space. Hence for (x_1,...,x_k) in O^k every term
    of P* vanishes and P*(O^k) = 0. So O^k, of dimension k o, is an oil space
    for P*. MAYO's whole design premise is that k o >= m, which restores
    signing: P*(v + x) = t is linear in x in O^k with k o unknowns and m
    equations. THE CONVERSE IS NOT DERIVED AND IS NOT ASSUMED: whether O^k is
    the LARGEST subspace on which P* vanishes is an open question this record
    does not settle, and IDEA-20260805-74e78c makes it a measurement rather
    than an assumption.

    DERIVED, THE DILATION. Reading the whipped instance as a UOV instance in
    its own right gives
      n* = k n,    m* = m,    o* = k o.
    The eigenvalues of the dilation on (n, m, o) are (k, 1, k). Everything
    below is a corollary of that single asymmetry.

    DERIVED, IDENTITY 1 (oil ratio is invariant).
      n*/o* = (k n)/(k o) = n/o.
    Any attack whose APPLICABILITY CONDITION is an inequality in n/o alone is
    therefore neutral under whipping: it applies to the whipped map exactly when
    it applies to the underlying map, at every k.

    DERIVED, IDENTITY 2 (intersection dimension is dilated, never re-signed).
    The intersection attack in the UOV literature works with the subspaces
    M_1 O, ..., M_{k'} O for invertible M_i built from the public polar forms,
    and its usable object is the intersection of those k' subspaces, whose
    generic dimension is
      d_{k'} = k' o - (k'-1) n.
    RECALLED, UNVERIFIED: this generic-dimension formula, and the fact that the
    attack needs d_{k'} to be positive (equivalently n < (k'/(k'-1)) o, so
    n < 2o at k' = 2 and n < 1.5 o at k' = 3), are recalled from the UOV
    cryptanalysis literature and MUST be re-derived or re-read before use. What
    is DERIVED here, given the formula, is
      d*_{k'} = k' (k o) - (k'-1)(k n) = k * d_{k'},
    so the whipped value is k times the underlying value and, in particular, has
    the SAME SIGN at every k. Whipping cannot switch the intersection attack on
    or off. If d_{k'} > 0 it does multiply the linear solution space by k, which
    is the quantity the relayed 2026/298 clause ('MAYO and QR-UOV parameter sets
    do not yield a large enough linear solution space for the intersection
    attack', ANGLE-BRIEF section F7, NOT READ -- relayed) names; the clause is
    thus a statement about the UNDERLYING map's n/o, and the whipping is
    irrelevant to it up to the factor k. That is a falsifiable reading of a
    relayed sentence, and it is the reason this proposal exists.

    DERIVED, IDENTITY 3 (Kipnis-Shamir exponent scales, against the attacker).
    RECALLED, UNVERIFIED: the Kipnis-Shamir-style oil-space recovery for UOV
    costs on the order of q^{n - 2o} times polynomial factors. Given that form,
      n* - 2 o* = k (n - 2 o),
    so for the MAYO-shaped regime n > 2o the whipped exponent is k times larger.
    On this axis whipping is not merely neutral, it is strongly protective, and
    any honest matched-baseline table must say so rather than reporting only the
    axis where whipping loses.

    DERIVED, IDENTITY 4 (underdetermination is dilated, for the attacker).
      alpha  = n/m   for the underlying map,
      alpha* = n*/m* = k n / m = k * alpha.
    This is the ONE ratio the dilation moves in the attacker's favour, and it
    moves by exactly k. It is not a small effect: k is between 4 and 12 for the
    RECALLED parameter sets. Every known technique for underdetermined MQ --
    Kipnis-Patarin-Goubin, Thomae-Wolf, Hashimoto, and the pseudo-oil
    reinterpretation of KN-LIT-1818 -- trades a larger alpha for a smaller
    effective system, so a k-fold dilation of alpha is precisely the shape of
    exposure those methods consume.

    THE RETRODICTION, AND WHY IT IS NOT EVIDENCE. Identities 1-4 predict, at
    zero compute and without reading any cryptanalysis, that if MAYO ever loses
    bits to a general MQ advance it will be to the UNDERDETERMINED family and
    not to intersection or Kipnis-Shamir. The corpus already holds a claim of
    exactly that shape: KN-LIT-1818 (Ostuzzi, 'Pseudo-Oil Subspaces and the
    Geometry of Underdetermined MQ Problems', iacr:2026/1122, ADDED BY THE
    2026-07-24 BULK SEEDING PASS, ITS OWN BODY SAYS THE CLAIMS ARE RELAYED FROM
    THE ABSTRACT WITHOUT INDEPENDENT VERIFICATION, AND ITS 'Relevance to this
    program' SECTION IS BOILERPLATE ABOUT MOV/Frey-Ruck AND GLV/GLS THAT HAS
    NOTHING TO DO WITH THE PAPER) reports that 'the security of MAYO and QR-UOV
    relies on the hardness of the underdetermined MQ problem' and that the
    approach 'lowers the cost of the direct attack against Security Level I
    parameter sets of MAYO and QR-UOV by 8 and 10 bits'. A retrodiction of a
    fact already in the corpus is worth exactly one thing -- a consistency check
    on the derivation -- and it is recorded as that and not as support.

    THE MATCHED BASELINE, STATED AS A TRADE. A matched comparison must be at
    matched CLAIMED SECURITY LEVEL, not at matched dimension. IDEA-20260801-013,
    the only prior proposal on this question, specifies 'matched dimension',
    which is not well defined here: the whipped map has k n variables against
    plain UOV's n, and equating those equates nothing meaningful. At NIST
    Level I the comparison is (all figures RECALLED, UNVERIFIED, and every one
    of them is a Stage-0 reading task):
      plain UOV Level I, roughly q = 256, n = 112, m = 44, o = m = 44:
        n/o = 2.55 (BELOW 3, so the intersection attack is in range and is the
        binding attack), alpha = n/m = 2.55;
      MAYO Level I, roughly q = 16, n = 66, m = 64, o = 8, k = 9:
        underlying n/o = 8.25 (FAR ABOVE 3, intersection attack out of range),
        whipped alpha* = 9 * 66 / 64 = 9.28.
    So the honest one-sentence answer to the goal's title question, conditional
    on those parameters being right, is: WHIPPING DOES NOT COST SECURITY ON THE
    OIL-GEOMETRY AXIS, IT BUYS SAFETY THERE, AND IT PAYS FOR IT ON THE
    UNDERDETERMINATION AXIS, WHERE THE RATIO IS ROUGHLY 3.6 TIMES PLAIN UOV'S AT
    THE SAME CLAIMED LEVEL. Turning '3.6 times' into bits requires a cost model
    and is deliberately NOT done here.

  novelty_status: unverified

  literature_context:
    - >-
      KN-LIT-1818 (Ostuzzi, iacr:2026/1122, 'Pseudo-Oil Subspaces and the
      Geometry of Underdetermined MQ Problems'). NOT READ -- the corpus entry
      was read, the paper was not. The entry is a 2026-07-24 bulk-seeded record
      whose own 'Not verified here' block states the claims are relayed from the
      abstract, and whose 'Relevance to this program' section is unrelated
      boilerplate. Relayed claims used above: MAYO and QR-UOV security rests on
      underdetermined MQ; the direct attack against Level I parameter sets is
      lowered by 8 bits (MAYO) and 10 bits (QR-UOV). USED ONLY AS A CONSISTENCY
      CHECK ON A DERIVATION, NEVER AS A NUMBER THIS PROGRAM ASSERTS.
    - >-
      KN-LIT-1205 (Samyuktha M et al., iacr:2024/1893, bitsliced Jasmin MAYO2).
      NOT READ; corpus entry read. Relayed: MAYO 'overcomes the disadvantage of
      UOV by whipping the UOV map', and the Round-2 C reference implementation
      uses a nibblesliced GF(16) representation. This is the only in-corpus
      support for q = 16 and it is an implementation paper, not the spec.
    - >-
      ePrint 2026/298 (Furue-Ikematsu, CRYPTO 2026) on p^l-truncated polynomial
      rings for UOV, and the clause that the framework does not improve on MAYO
      and QR-UOV 'because their parameter sets do not yield a large enough
      linear solution space for the intersection attack'. NOT READ -- relayed
      through the session ANGLE-BRIEF section F7, which itself marks the item
      ABSTRACT ONLY. Identity 2 above is a proposed reading of that clause and
      must not be cited as agreement with it.
    - >-
      NO MAYO SPECIFICATION HAS BEEN READ. Round 3 tweaks are recorded as due
      2026-08-14 (GOAL-MAYO-001 scheme_context). Every parameter figure in this
      record is RECALLED, UNVERIFIED and is a candidate to check.
    - >-
      GOAL-UOV-001 owns the plain-UOV concrete-security calibration and its
      next_action states that MAYO, QR-UOV and SNOVA all consume that baseline.
      This proposal deliberately does NOT re-derive a UOV solving-degree law or
      a UOV cost model; it derives only the MAYO-specific dilation map and
      states the comparison in ratios, so that whatever UOV cost convention
      GOAL-UOV-001 fixes can be substituted without changing anything here.

  lossy_projection_identifiability_audit:
    projection: >-
      Full whipped public map P* (all k(k+1)/2 matrices E_ij and all m
      quadratic forms of P) --> the integer triple (n*, m*, o*) and the three
      derived ratios (n/o, n/m, n - 2o).
    what_is_discarded: >-
      Everything except six integers: the field, the actual coefficients of P,
      the emulsifier matrices, the oil space itself, and every structural
      property that is not a dimension count.
    why_genuinely_lossy: >-
      Extremely lossy -- the fibre over a given triple is the whole space of
      UOV maps with those parameters, which is astronomically large. It is
      genuinely lossy and not a change of coordinates: the parameters cannot
      be used to reconstruct any part of the map.
    why_compatible_with_the_operations: >-
      Compatible in the exact sense the inventor protocol requires: the
      retained part propagates DETERMINISTICALLY through the target's
      operation. Whipping acts on the retained triple by the diagonal map
      (k, 1, k) regardless of which P and which E_ij were used, so the
      projection commutes with the construction. That is the whole content of
      Identities 1-4 and it is why they are identities rather than estimates.
    is_it_only_a_change_of_coordinates: >-
      No -- and the failure mode this projection is genuinely exposed to is the
      MIRROR one (the ML-KEM determinant-ideal failure recorded in
      IDEA-20260805-e805b6): a projection so lossy that it is CONSTANT across
      instances and therefore says nothing. CHECKED, AND IT IS NOT CONSTANT
      HERE, for a stated reason: the projected value VARIES ACROSS THE OBJECTS
      BEING COMPARED, which is the only variation this proposal needs. Plain
      UOV Level I and MAYO Level I have different n/o (2.55 vs 8.25) and
      different n/m (2.55 vs 9.28), and the comparator spread is exactly the
      quantity of interest. What the projection CANNOT do is distinguish two
      maps with the same parameters, and it is therefore useless for detecting
      a whipping-induced structural weakness at fixed parameters -- which is
      precisely the gap IDEA-20260805-74e78c is written to fill, and it is
      recorded here as this proposal's boundary rather than left implicit.

  assumptions:
    - >-
      That the whipped map has the stated form P* = sum E_ii P(x_i) + sum_{i<j}
      E_ij P'(x_i, x_j). If the Round-3 specification whips differently -- for
      instance with per-copy linear maps applied to the arguments, or with a
      non-symmetric polar convention -- Identity 0 may still hold while
      Identities 2-4 need restating. This is the single most likely way the
      record is wrong and Stage 0 exists to settle it.
    - >-
      That the whipped instance's oil dimension is k o and not more. Identities
      1-3 use o* = k o. If a larger oil space exists, the whipped map is WEAKER
      than these identities say, not stronger, so the identities are
      conservative in the direction that matters for a security claim -- but
      the claim 'whipping is neutral on the oil-geometry axis' would then be
      unsupported.
    - >-
      That the intersection attack's generic intersection dimension is
      k' o - (k'-1) n. RECALLED, UNVERIFIED. Identity 2's k-fold dilation
      follows from the FORM of that expression (it is homogeneous of degree 1
      in (n, o)) and would survive any replacement formula that is also
      homogeneous of degree 1 in (n, o) -- which is a robustness property worth
      stating and worth checking.

  predictions:
    - metric: >-
        ratio_of_whipped_to_underlying_oil_ratio: (n*/o*) / (n/o), computed from
        the Round-3 parameters of every MAYO parameter set
      direction: different
      minimum_effect: >-
        EXACTLY 1.000, at every parameter set, with no tolerance. This is an
        identity, not a measurement. Any value other than 1 means the whipped
        oil dimension is not k o and the whole record must be redone.
    - metric: >-
        ratio_of_whipped_to_underlying_intersection_dimension: d*_2 / d_2 =
        (2 o* - n*) / (2 o - n)
      direction: different
      minimum_effect: >-
        EXACTLY k, at every parameter set (9, 4, 11, 12 for the RECALLED MAYO
        1/2/3/5 values of k). Derived before any reading.
    - metric: >-
        sign(d_2) for the underlying map at every MAYO parameter set
      direction: different
      minimum_effect: >-
        NEGATIVE at every set, i.e. 2o < n. Under the RECALLED parameters
        (n, o) = (66, 8), (78, 18), (99, 10), (133, 12) the values of 2o - n are
        -50, -42, -79, -109. If ANY set has 2o - n >= 0 the intersection attack
        is in range for that set and this proposal has found the single most
        important fact in the goal. The prediction is therefore a real risk and
        not a formality.
    - metric: >-
        alpha* / alpha = (n*/m) / (n/m), the underdetermination dilation
      direction: different
      minimum_effect: >-
        EXACTLY k. And the cross-scheme number: alpha*(MAYO Level I) /
        alpha(plain UOV Level I) predicted at 9.28 / 2.55 = 3.64 +/- whatever
        the true parameters make it. A value below 1.5 would mean whipping does
        not materially move the underdetermination axis and would remove this
        proposal's main claim.
    - metric: >-
        Kipnis-Shamir exponent dilation (n* - 2o*) / (n - 2o)
      direction: different
      minimum_effect: >-
        EXACTLY k, in the protective direction. Reported in the same table as
        the adverse alpha dilation; a table that reports only one of them is
        incomplete by this record's own standard.

  minimal_test:
    design: >-
      Three stages, cheapest first; stage 1 can terminate the line.
      STAGE 0 (reading, no compute): obtain the MAYO Round-3 specification
      (source-preference order: the NIST submission package; the MAYO team's
      site; ePrint abstract pages, which the ANGLE-BRIEF measured at HTTP 200
      while ePrint PDF bodies return 403; the reference implementation's
      parameter header). Quote the whipped map's definition and the parameter
      table verbatim, or record precisely which sources were tried and failed.
      STAGE 1 (algebra, no compute, DECISIVE): re-derive Identities 0-4 against
      the quoted definition and evaluate the five predicted numbers per
      parameter set with exact integer arithmetic. If the definition does not
      match, STOP and re-derive; the identities as written are then void and
      saying so is the deliverable.
      STAGE 2 (toy confirmation, seconds, pure Python over F_16 with log
      tables -- numpy 2.4.6 is present in this container and no computer-algebra
      system is): build a toy whipped instance, compute the dimension of the
      whipped oil space by exact linear algebra, and confirm it equals k o.
    controls:
      - >-
        NULL OBJECT, FORCED VALUE DERIVED PRE-RUN: k = 1. Whipping with k = 1
        is the identity dilation, so every predicted ratio must come out
        EXACTLY 1 and the whipped map must equal E_11 P. This null CAN FAIL --
        if the derivation has smuggled in a k-dependence that does not vanish at
        k = 1, it shows here at zero cost -- and it is the cheapest available
        check that the dilation map is written correctly.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR: plain UOV
        at Level I, where o = m and n/o is BELOW the recalled intersection
        threshold of 3. The identities must classify it as intersection-attack
        IN RANGE. If the instrument classifies plain UOV as out of range, the
        applicability rule is wrong or the recalled threshold is wrong, and NO
        conclusion about MAYO may be reported. A second positive control, from
        the same relayed source: Rainbow, whose parameters the intersection
        attack is reported to have devastated -- it must also come out in range.
      - >-
        GRADED CONTROL, >= 3 INTERIOR POINTS, MONOTONICITY REPORTED: hold the
        underlying (n, m, o) fixed and sweep k in {1, 2, 3, 4, 6, 9, 12}.
        Report n*/o*, d*_2, n* - 2o*, alpha* at each. Predicted: n*/o* flat at
        n/o (a horizontal line -- and a quantity that FAILS to stay flat is the
        canonical artifact tell in reverse), d*_2 and n* - 2o* and alpha* all
        exactly linear in k with the derived slopes. A sweep that is flat where
        linearity is predicted, or linear where flatness is predicted,
        falsifies the dilation reading immediately.
      - >-
        ARCHIVE CHECK, zero compute: the only prior record on this question is
        IDEA-20260801-013, which proposes a matched whip-vs-plain-UOV toy
        control at 'matched dimension'. NO RUN, NO HYPOTHESIS AND NO EXPERIMENT
        EXISTS for it (GOAL-MAYO-001 brief: no prior hypotheses, experiments or
        evidence in area MAYO). There is therefore no archived measurement of
        this observable, and that absence is recorded rather than presented as
        a passed check.
    required_metrics:
      - verbatim quotation of the whipped-map definition with its source, or a
        recorded statement of which sources were tried and what they returned
      - the parameter table (q, n, m, o, k) per MAYO parameter set, with source
      - the five identity values per parameter set, as exact integers
      - the k-sweep table for the graded control
      - the plain-UOV and Rainbow positive-control classifications

  falsification_conditions:
    - >-
      The Round-3 whipped map is not of the stated form. Identities 2-4 are then
      void as written and must be re-derived; this is the most likely single
      failure of the record.
    - >-
      The whipped oil dimension is measurably larger than k o at toy parameters.
      Identity 1 fails, and the failure is far more interesting than the record:
      it would mean whipping creates oil structure, which is the goal's primary
      target.
    - >-
      Any MAYO parameter set with 2o >= n, i.e. the intersection attack in range
      for the underlying map. The 'whipping buys oil-geometry safety' reading is
      then wrong for that set.
    - >-
      alpha*/alpha measured different from k. Arithmetic error or a whipped map
      with an equation count that is not m.

  confounders:
    - >-
      PARAMETERS FROM MEMORY. Every (q, n, m, o, k) value here is RECALLED,
      UNVERIFIED. The predictions are stated as functions of the parameters
      precisely so that the record survives a correction to them, but the
      cross-scheme number 3.64 does not, and it must never be quoted before
      Stage 0.
    - >-
      RATIO IS NOT COST. alpha* = k alpha is a statement about a ratio. Whether
      a k-fold larger alpha costs 1 bit or 30 depends entirely on the
      underdetermined-MQ cost model, which this record does not supply. Reading
      this proposal as 'MAYO is weaker than UOV by a factor k' would be exactly
      the partial-cost error AGENTS.md rule 4 forbids.
    - >-
      RETRODICTION BIAS. KN-LIT-1818's 8-bit figure was in the corpus before
      this derivation was written. The derivation was not fitted to it -- the
      identities are forced -- but a reader cannot verify that from the record,
      so the agreement is recorded as a consistency check and given no
      evidential weight.
    - >-
      DIMENSION COUNTING IS NOT STRUCTURE. Two whipped maps with identical
      parameters can have very different emulsifiers. This projection cannot
      see that difference at all; see the identifiability audit.

  interpretation_limits:
    - >-
      NO ATTACK IS PROPOSED AND NO COST IS CLAIMED. This is a parameter-level
      derivation, claim tier theory/derivation, and it may not be cited as
      evidence about any MAYO parameter set's security.
    - >-
      A confirmed set of identities does NOT establish that whipping is
      security-neutral. It establishes that whipping is neutral for attacks
      that read only the parameter triple. A whipping-induced structural
      weakness at fixed parameters is invisible to this object by construction,
      and forward guidance is mandatory: IDEA-20260805-74e78c (emulsifier
      defect) and IDEA-20260805-19990a (randomness discipline) name the two
      channels this record cannot see.
    - >-
      Nothing here bears on the intersection attack's CORRECTNESS or on
      GOAL-UOV-001's calibration of it. The identities are relative statements
      that hold under whatever cost convention that goal fixes.

  heuristic_assumptions:
    - id: HEUR-MAYO-DIL-1
      statement: >-
        NONE OF THE FOUR IDENTITIES IS HEURISTIC. Identities 0-4 are exact
        consequences of the stated form of P* and of the definitions of n, m, o,
        and they are unconditional given that form. This entry exists to record
        that the record is UNCONDITIONAL where its predecessor
        IDEA-20260801-013 was heuristic (its HEUR-MAYO-WHIP-1 assumes toy-size
        cost ratios are directionally representative of large sizes, which is a
        real heuristic and is not needed here).
      rigorous_support: >-
        Substitution into the definitions, plus bilinearity of P' and
        homogeneity P(c x) = c^2 P(x). Both elementary and written out in the
        mechanism.
      validation_plan: >-
        Stage 1 re-derivation against the quoted specification, plus the k = 1
        null and the k-sweep graded control. Not a distributional validation and
        not presented as one.
    - id: HEUR-MAYO-DIL-2
      statement: >-
        LOAD-BEARING AND HEURISTIC: that the intersection attack's applicability
        is governed by the generic intersection dimension d_{k'} = k' o -
        (k'-1) n being positive, and that the relevant cost quantities are
        homogeneous of degree 1 in (n, o).
      rigorous_support: >-
        NONE OFFERED HERE. This is recalled from the UOV cryptanalysis
        literature and has not been read in this session. It is a candidate to
        check, and Identity 2's k-fold dilation is stated CONDITIONALLY on it.
        The conditional structure is deliberate: if the true applicability rule
        is any other degree-1-homogeneous function of (n, o), the dilation
        conclusion survives unchanged, and that robustness is the reason the
        identity is worth stating before the literature is read.
      validation_plan: >-
        Stage 0 reading, with the positive controls (plain UOV Level I,
        Rainbow) as the sensitivity check on whatever rule is recovered.

  target_complexity:
    time_exponent: >-
      n/a for this audit -- no algorithm is proposed and no exponent is moved.
      What the record DOES is fix which exponent is the right one to argue
      about: it predicts that MAYO's binding exponent is the underdetermined-MQ
      one at alpha* = k n / m, not the oil-geometry one. Making that exponent
      move is IDEA-20260805-977e16's business, not this record's.
    memory_exponent: >-
      Not addressed. Flagged as a gap: none of the recalled UOV attack cost
