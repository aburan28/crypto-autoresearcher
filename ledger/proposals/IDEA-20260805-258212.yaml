      produces must carry a memory column or it repeats the corpus-wide failure
      the session ANGLE-BRIEF measures at 82 of 229 evidence records charging
      wall clock only.
    best_known: >-
      For MAYO Level I, the best-known direct attack cost as reported by
      KN-LIT-1818 is 8 bits below the published figure. BOTH THE PUBLISHED
      FIGURE AND THE 8 BITS ARE RELAYED AND UNVERIFIED. This program holds no
      independently derived MAYO cost.
    hidden_overhead: >-
      Not assessed. The identities are exact and hide nothing; every cost
      statement built on them inherits the overheads of whatever MQ cost model
      is substituted.
    tradeoff_note: >-
      The record IS a tradeoff statement: whipping moves the oil-geometry axis
      protectively by a factor k in the exponent and the underdetermination axis
      adversely by a factor k in the ratio. Reporting either alone is
      incomplete.

  dominated_by: >-
    n/a (no result claimed, no Pareto point offered). On the QUESTION this
