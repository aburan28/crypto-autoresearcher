idea:
  id: IDEA-20260807-5ed21f
  question_id: RQ-AES-001
  added: '2026-08-07'
  title: >-
    Predicting MEAS-RT-D's 3584-cell permanent-zero incidence set of the
    AES-128 key schedule from S-box-free, Rcon-free GF(2) algebra on the
    sigma-relaxed round-key variety, with random-S-box and Rcon-zeroed
    substitution arms
  class: measurement

  claim: >-
    FORMALIZATION OF CATALOGUE ENTRY A2-2 (ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/A2.md,
    lines 238-307). MEAS-RT-D measured a permanent-zero DENSITY in the AES key
    schedule's bit-influence structure (0.78125 = 25/32 for AES-128 from
    r = 5, i.e. 3584 of 16384 cells permanently zero over 200000 keys; 0.8750
    for AES-192, 0.78125 for AES-256) and retracted its own symbolic
    derivation because an OR-based dependency closure cannot represent XOR
    cancellation. A2-2 predicts the exact permanent-zero incidence SET (not
    just its density): |Z_pred| = 3584 exactly for AES-128 at r >= 5, computed
    from a certified subset Z_pred subset-of Z_true via GF(2) algebra on the
    sigma-relaxed round-key variety (ΔRK = A_K e_b XOR A_sigma Δsigma) alone,
    with no S-box and no Rcon anywhere in the computation. Consequences stated
    as separately measurable: replacing the S-box by a uniformly random 8-bit
    bijection (real wiring, real Rcon) leaves the measured density at 0.78125
    within the binomial band at 200000 keys; replacing Rcon by all-zeros, or a
    shuffled sequence, does the same; AES-192's 0.8750 and AES-256's 0.78125
    are reproduced by the same predictor with no per-key-size tuning. No
    break, no key recovery, no relation to any baseline mechanism or published
    result is claimed; ceiling toy (scoped to the exact instrument, key sizes,
    sample count and seeds -- an empirical zero over 200000 keys is not a
    proof of exact independence), sota_delta 0.

  mechanism: >-
    The permanent-zero incidence set Z_r = {(b,b') : flipping master bit b
    never flips round-key bit b' of RK_r} is a set of cells, discarding the
    magnitude of every non-zero cell, the key, all round-key values, and the
    direction of every flip; it is structural because Z_r is a property of the
    schedule as a family of functions and 2^128 keys map to one Z_r, with
    nothing about any key or round key recoverable from it. In the
    sigma-relaxed model the flip is ΔRK = A_K e_b XOR A_sigma Δsigma, so a
    cell is certifiably permanently zero when (A_K)_{b',b} = 0 AND row b' of
    A_sigma is zero on every sigma-coordinate that b can reach; this yields
    Z_pred subset-of Z_true by construction (a conservative reachability
    relation makes the containment direction, and hence the informativeness of
    equality, explicit rather than assumed). The A_K/A_sigma matrices are the
    SAME linear-algebra build catalogue entry A2-1 constructs (dedup ⚑21:
    A2-1 sequenced first, A2-2 builds Z_pred FROM A2-1's A_K, A_sigma; one
    elimination on [A_K | A_sigma] emits both A2-1's annihilator dimension and
    A2-2's incidence set). At r = 0 the map is the identity, so Z_0 is known
    in advance -- exactly the 16256 off-diagonal cells of a 128x128 identity
    pattern, zero diagonal cells -- giving a hard known-answer gate; the r = 1
    zero set is hand-computable for the bits of W[0], W[1], W[2] and must
    match.

  novelty_status: unverified

