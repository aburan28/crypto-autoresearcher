  disposition: proposed
  interpretation_limits:
    - No entry here claims, predicts or implies a break, a key recovery
      against a fielded parameter set, an asymptotic exponent improvement, or
      any relation to the published state of the art in either direction
      (A2.md frame section lines 10-15). Claim ceiling toy, scoped to the
      exact instrument, key sizes, sample count and seeds.
    - This is a statement about the AES key schedule at its FULL length (all
      round keys of the schedule, sampled over 200000 keys), which is a
      different object from the cipher at full round count; OL-2 in A2.md
      states this explicitly and it is not a full-round single-key statement
      and is not owned by GOAL-AES-002.
    - An empirical zero (no residual cells found) over 200000 keys is not a
      proof of exact independence and must never be reported as one; the
      falsifier F2-a names the concrete residual-cell outcome that would
      overturn the S-box-independence reading.
    - The dedup sequencing note (A2-1 before A2-2) is not discharged by a
      standalone A2-1 ledger record in this batch; the downstream experiment
      specification must construct A_K/A_sigma itself as an internal,
      re-derivable prerequisite stage, and this substitution for a missing
      upstream record is disclosed rather than silently assumed.
