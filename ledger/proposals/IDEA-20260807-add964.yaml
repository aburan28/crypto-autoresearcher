idea:
  id: IDEA-20260807-add964
  question_id: RQ-EQLA-0d3f40
  added: '2026-08-07'
  title: >-
    THE SIGN COCYCLE: an x-coordinate factor base only determines its points up
    to negation, so the phi-action on relation rows is a SIGNED permutation, and
    its sign class is a 1-cocycle - trivialisable for j=0 because H^1(C_3, {+-1})
    vanishes, but FORCED to -1 around every orbit for j=1728 because phi^2 =
    [-1] - which means the plain 0/1 permutation operator the committed harness
    uses is right for one CM discriminant, wrong for the other, and the rows it
    builds drop the sign information entirely in both

  class: representation

  claim: >-
    (A) THE OBJECT EVERY x-COORDINATE FACTOR BASE ACTUALLY HAS. A factor base
    given by x-coordinates x_1, ..., x_B determines each point only up to
    negation: lift_x(x_i) returns one of the two points (x_i, +-y_i). Fix a lift
    P_i for each i. Let phi_x be the induced map on x-coordinates and sigma the
    index permutation with x_{sigma(i)} = phi_x(x_i). Then phi(P_i) has
    x-coordinate x_{sigma(i)}, so
      phi(P_i) = epsilon_i * P_{sigma(i)},   epsilon_i in {+1, -1},
    and the equivariance operator on relation rows is the SIGNED permutation
    Sigma with entries epsilon_i, not the 0/1 permutation matrix. The family
    (epsilon_i) is a 1-cochain and its class under re-choosing lifts
    (epsilon_i -> epsilon_i * delta_{sigma(i)} / delta_i for signs delta) is a
    cohomology class in H^1(C_g, {+-1}).

    (B) THE DICHOTOMY, WHICH IS EXACT AND DECIDES THE INSTRUMENT.
      j = 0 (D_0 = -3), phi(x, y) = (zeta x, y), g = 3 on x-coordinates.
        H^1(C_3, Z/2) = 0 because gcd(3, 2) = 1, so EVERY sign cochain is a
        coboundary: lifts can always be re-chosen to make all epsilon_i = +1.
        Constructively, and this is the whole fix: pick one lift per orbit and
        DEFINE the other two as phi(P) and phi^2(P). Consistency needs
        phi^3 = 1, which holds. Note the natural shortcut - phi preserves y, so
        "same y" is exactly that convention. The unsigned operator is therefore
        CORRECT for j = 0, provided the lifts are chosen along orbits.
      j = 1728 (D_0 = -4), phi(x, y) = (-x, i y) with i^2 = -1, g = 2 on
        x-coordinates, and phi^2 = [-1] on points. Then for any choice of lifts,
          phi^2(P_i) = epsilon_i epsilon_{sigma(i)} P_i  and  phi^2(P_i) = -P_i,
        so epsilon_i * epsilon_{sigma(i)} = -1 ALWAYS. The product around every
        orbit is -1; the class is the nontrivial element of H^1(C_2, Z/2) = Z/2
        and CANNOT be trivialised by any lift choice. The correct operator
        satisfies Sigma^2 = -I, not Sigma^2 = +I: it is a complex structure, not
        an involution.
    CONSEQUENCE FOR EVERY MEASUREMENT IN THE LANE'S HISTORY: the committed
    instrument builds Z as a 0/1 permutation with Z[base][base+1] = 1 and
    cyclically (harness/endomorphism_la.py, the phi branch of
    `_measure_displacement_rank`). That is the g = 3 unsigned operator. On a
    j = 1728 curve it is the WRONG operator - it commutes with nothing the curve
    provides - and any structure statistic measured with it there is measuring
    the wrong group.

    (C) THE SECOND, INDEPENDENT SIGN PROBLEM, WHICH AFFECTS j = 0 TOO. The
    relation itself carries signs. A Semaev decomposition asserts that there
    EXIST signs with (+-)P_{i_1} + ... + (+-)P_{i_m} + (+-)R = O; the summation
    polynomial vanishes for the x-coordinates and the signs must be recovered
    separately. So a relation ROW over an x-coordinate factor base has entries in
    {+1, -1}, not in {0, 1}. EV-STR-003 O-9 records that the committed harness
    builds "bare 0/1 incidence vectors" and that no linear system with a
    right-hand side was ever assembled. An unsigned row is not a linear equation
    about logarithms; it is an incidence indicator. Every rank, displacement rank
    and deficiency in the lane's history was computed on incidence indicators.
    That does not make those numbers wrong as measurements of what they measured;
    it means they are not measurements of the linear system, and this record
    supplies the object that is.

    (D) THE MEASURABLE PREDICTIONS, WHICH ARE SHARP AND CHEAP.
      P-1. On j = 0 with lifts chosen by an ARBITRARY convention (whatever
        lift_x returns), the measured sign cochain has epsilon_i = -1 on about
        half of all indices. With lifts chosen ALONG ORBITS, it is +1
        identically. The difference is a single line of factor-base construction
        and it is currently absent.
      P-2. On j = 1728, no lift convention makes the cochain trivial: the
        product around every orbit is exactly -1, at 100% of orbits, at every
        instance. A measured product of +1 at any orbit falsifies (B) or
        indicates phi was implemented as something other than (-x, i y).
      P-3. Using the unsigned operator where the signed one is correct changes
        the measured structure statistic. Quantitatively: for a genuinely
        Sigma-equivariant matrix with Sigma^2 = -I, measuring displacement rank
        against the unsigned Z gives a value near its generic maximum, while
        measuring against the signed Sigma gives a value near 0. The gap is the
        full range of the statistic, which makes this the largest single
        instrument effect available in the lane and the cheapest to check.
      P-4. Folding signed rows and unsigned rows gives DIFFERENT informative
        ranks. Predicted: the unsigned fold destroys the exact cancellation
        1 + lambda + lambda^2 = 0 that produces the free relations of
        IDEA-20260807-61049d wherever a sign is wrong, so the measured
        free-relation count on an arbitrarily-lifted base is about (1/2)^{g-1} of
        B/g rather than B/g - a factor 4 at g = 3 - and that discrepancy is a
        direct, quantitative detector of lift inconsistency.

    (E) WHY THIS IS NOT A BUG REPORT. It is a statement about which OBJECT the
    lane should be tracking. The Z[phi]-module structure of a relation matrix is
    a module over Z[zeta_3] or Z[i], and those rings act on POINTS, not on
    x-coordinates; the passage to x-coordinates is a quotient by {+-1} and the
    module structure descends only up to that quotient, which is precisely what
    the cocycle measures. Getting the operator right is a precondition for every
    other proposal in this lane, and getting it wrong is a way to measure zero
    where there is structure and to measure structure where there is none.

  resource_label: >-
    R1 + R3. R1: the whole question is about x-coordinates as field elements and
    the two-to-one map from points to x-coordinates. R3: the sign is forced by
    the relation phi^2 = [-1] in End(E), which is a ring fact about the CM order
    (Z[i] has an element of order 4; Z[zeta_3] has one of order 3 and the
    difference in parity is the entire content of the dichotomy).

  admissibility: admissible

  admissibility_argument: >-
    Admissible, and it is one of the few places in the lane where the resource is
    doing unambiguous work that a generic algorithm cannot do. The sign cocycle
    is computed from the CURVE EQUATION and the explicit formula for phi - it
    asks whether lift_x(zeta x) has the same y as lift_x(x), which is a field
    comparison, not a group operation. A generic algorithm holding opaque
    encodings would need a group operation per element to learn the same bit.
    The saving is one field comparison against one group operation per
    factor-base element: real, non-generic, and a constant factor on a
    preprocessing step. No exponent is claimed and none could come from here.

  discriminated_from:
    - >-
      Every prior record in the STR lane, all of which use the unsigned
      permutation. H-STR-002's mechanism paragraph says "the relation matrix M
      therefore satisfies M * Phi = Phi * M where Phi is the phi-shift
      permutation"; IDEA-20260726-002 says the same; the committed harness
      implements a 0/1 permutation. None mentions signs, lifts, or the two-to-one
      x-coordinate map. This record's claim is not that they are wrong for j = 0 -
      (B) shows they are right there, for a reason none of them states - but that
      their correctness is CONDITIONAL on a lift convention none of them
      enforces, and that it fails outright at j = 1728.
    - >-
      IDEA-20260727-001's negation control ("verify that the negation map does
      not break the block-circulant structure. If negation maps phi-orbits to
      distinct phi-orbits, the block structure is preserved; if it maps within
      orbits, it may halve the block size" - from IDEA-20260726-002's control
      list). That is a question about ORBIT SIZE. This record is about the SIGN
      CARRIED ALONG the orbit, which is a different object: the orbits are the
      same size either way, and the cocycle is what distinguishes an unsigned
      permutation of that size from a signed one.
    - >-
      IDEA-20260807-0e4d83, which proves the row-redundancy identity assuming
      sigma matches phi on the chosen lifts. That assumption is listed there as an
      assumption and is DISCHARGED here. The two records are complementary: 0e4d83
      needs the sign to be +1 and says so; this record establishes when it can be.
    - >-
      IDEA-20260807-61049d, whose free relations P + phi(P) + phi^2(P) = O are
      stated for points. On x-coordinates the corresponding row is (1, 1, 1) only
      if the lifts are orbit-consistent; otherwise it is (1, -1, 1) or similar and
      does NOT fold to zero. This record supplies the correction and predicts the
      exact size of the discrepancy (P-4).

  object_first_candidate:
    tracked_object: >-
      THE SIGN COCYCLE epsilon in {+-1}^B, defined by
      phi(P_i) = epsilon_i * P_{sigma(i)}, tracked modulo coboundaries - i.e. its
      class in H^1(C_g, {+-1}), which is one bit per orbit when g is even and
      nothing when g is odd.
    lossiness: >-
      GENUINELY AND SEVERELY LOSSY. The cochain forgets the points, the
      x-coordinates and the curve, retaining one bit per index; the class forgets
      even the choice of lifts, retaining one bit per orbit for even g and zero
      bits for odd g. Nothing about the factor base is recoverable from it. It
      passes the section-2 test decisively, and it passes the harder half of that
      test too: what it discards is discarded COMPATIBLY with the operations,
      because the coboundary relation is exactly the ambiguity that changing
      lifts introduces, so the class is well defined under every operation the
      construction performs. This is a textbook instance of the right kind of
      projection - the retained bit propagates deterministically and the
      discarded structure is exactly a gauge freedom.
    propagation: >-
      One step, exactly: composing phi twice multiplies the signs,
      epsilon_i * epsilon_{sigma(i)} is the sign of phi^2 at i. Going around a
      full orbit gives the sign of phi^g, which is +1 for j = 0 (phi^3 = 1) and
      -1 for j = 1728 (phi^2 = -1). The propagation rule is a product along the
      orbit and its value at closure is an invariant of the endomorphism ring -
      which is why the dichotomy is forced rather than incidental.
    survival_score: >-
      Survives: every change of lift convention (by construction, since it is a
      cohomology class), every factor-base rule, every arity, every solver.
      Dies at: a factor base indexed by full points rather than by x-coordinates,
      where there is no quotient and no cocycle - which is itself informative,
      because it says the entire phenomenon is a cost of the x-coordinate
      representation and could be avoided by paying twice the storage. That
      tradeoff is stated in target_complexity and is a real design choice nobody
      in the lane has articulated.

  mechanism: >-
    STEP 1 (zero compute, derivation, archived first). Write out (A) and (B):
    the definition of the cochain, the coboundary action, the vanishing of
    H^1(C_3, Z/2), and the forced -1 for j = 1728 from phi^2 = [-1]. Four
    paragraphs, no compute.

    STEP 2 (seconds, the decisive measurement, and it needs no relations at
    all). For each toy instance: build the x-coordinate factor base by the
    committed rule; lift each x with the committed lift_x; compute
    epsilon_i by testing whether phi(P_i) equals P_{sigma(i)} or its negation.
    Report the fraction of epsilon_i = -1 and the product around every orbit.
    PREDICTED: about 1/2 negative on an arbitrarily-lifted j = 0 base, and
    product +1 around every orbit; about 1/2 negative on j = 1728 and product -1
    around every orbit, at 100% of orbits. This measurement is a few lines of
    code, needs no decomposition search, and settles (B) outright.

    STEP 3 (seconds). Implement the orbit-consistent lift for j = 0: choose one
    lift per orbit and DEFINE the others as phi and phi^2 of it. Re-measure:
    predicted all epsilon_i = +1. Then attempt the same for j = 1728 and confirm
    it is impossible - the second element's sign is forced opposite whatever the
    first is chosen to be. This is the constructive half of the cohomology
    statement and it is verified rather than asserted.

    STEP 4. Build BOTH operators and compare every structure statistic under
    each: the unsigned 0/1 permutation Z (the committed one) and the signed
    Sigma. On j = 0 with orbit-consistent lifts they coincide, which is a
    consistency check. On j = 1728 they differ, and the prediction P-3 says the
    difference is the full range of the statistic.

    STEP 5. Signed rows. Modify the decomposition recorder to store the RESOLVED
    SIGNS of each summand and the right-hand side, so that a relation row is a
    genuine linear equation. Recompute the folded matrix, the informative rank
    and the free-relation count with signed rows and with the committed unsigned
    rows, and report both. Prediction P-4 gives the expected discrepancy in the
    free-relation count, which is the cheapest detector of the problem.

    STEP 6. The j = 1728 arm end to end. Everything the lane has done for
    D_0 = -3 with g = 3, done for D_0 = -4 with g = 2 and the signed operator:
    orbit-closed base, signed rows, fold with lambda satisfying lambda^2 = -1,
    informative rank, block split into 2. This is the first time the lane would
    have a second CM discriminant, and it is the natural replication that
    distinguishes a mechanism from a coincidence.

    STEP 7. The null: the entire STEP 4 comparison on synthetic matrices with a
    PLANTED signed structure of declared class, from the generator of
    IDEA-20260807-1e673d extended with a sign parameter. The instrument must
    recover the planted class exactly.

  novelty_status: novel

  novelty_screen:
    method: >-
      Ripgrep over the whole repository on 2026-08-07:
      "signed permutation"; "sign cocycle|cocycle"; "H\\^1\\("; "lift_x";
      "negation"; "up to sign|sign ambiguity"; "j=1728|j = 1728|1728". Full
      reads of harness/endomorphism_la.py (all of `_measure_displacement_rank`,
      `_build_phi_invariant_factor_base` and `_collect_relations`), H-STR-002,
      IDEA-20260726-002, IDEA-20260727-001, EV-STR-002, EV-STR-003, EV-STR-004,
      H-ENDO-001.
    results: >-
      "cocycle" returns hits only in unrelated lanes (MLKEM, HAWK, SCR) and in
      literature notes; ZERO ECDLP-relevant hits. "signed permutation" returns
      ZERO hits anywhere. "1728" appears in H-ENDO-001 (as a curve family with
      |Aut| = 4), in IDEA-20260726-002 (as a proposed second family, never run)
      and in DECOMPOSITION.md L3; no record analyses the phi^2 = [-1] relation or
      its consequence for the operator, and every committed measurement is on
      j = 0. "negation" appears throughout as a rho speedup (KN-TECH-018) and, in
      IDEA-20260726-002's control list, as an orbit-size question - never as a
      sign carried along an orbit. The committed harness's Z is unambiguously a
      0/1 permutation and its rows are unambiguously 0/1, which EV-STR-003 O-9
      independently confirms.
    verdict: >-
      NOVEL WITHIN THIS CORPUS. The cohomological framing is elementary and is
      very likely folklore wherever GLV factor bases have been implemented
      carefully, so no novelty is claimed against the external literature and a
      Stage-0 check is part of the design. What is asserted is that this corpus
      contains no record of the sign structure, that its committed instrument
      does not implement it, and that the j = 1728 consequence has never been
      stated anywhere in the program.

  null_object_control: >-
    MANDATORY AND BLOCKING.
    NULL 1 - MATCHED SYNTHETIC WITH PLANTED SIGN CLASS: matrices of identical
    shape, density and column-orbit partition, made equivariant under a signed
    permutation whose class is DECLARED (trivial or nontrivial). The instrument
    must recover the declared class at 100% of instances. This is the
    planted-positive requirement and it is what makes a measured class
    meaningful.
    NULL 2 - RANDOM SIGN COCHAIN: assign epsilon_i uniformly at random,
    unrelated to any curve. On an odd-order orbit its class must still be
    trivial (H^1 vanishes), so the instrument must report "trivialisable" - and
    then the constructive trivialisation must actually succeed. On an even-order
    orbit a random cochain is nontrivial with probability 1/2, which is the
    measured false-positive rate for "the curve forces the sign" and must be
    reported alongside any j = 1728 conclusion.
    DECAY PARAMETER: the fraction f of factor-base elements whose lift is chosen
    orbit-consistently, swept from 0 to 1. On j = 0 the count of epsilon_i = -1
    must fall linearly from about B/2 at f = 0 to exactly 0 at f = 1; the
    free-relation count must rise from about (1/2)^{g-1} B/g to exactly B/g over
    the same sweep; and every statistic measured with the unsigned operator must
    converge to its signed value. A statistic that does not move as f goes from 0
    to 1 is insensitive to the lift convention and cannot be affected by the
    sign, which is itself a useful negative and must be reported.
    ON j = 1728 THE DECAY MUST NOT HAPPEN: the orbit products must stay at -1 for
    every f. That asymmetry between the two discriminants, measured on the same
    pipeline, is the record's central control.

  assumptions:
    - >-
      phi is implemented as (zeta x, y) for j = 0 and as (-x, i y) for j = 1728,
      with zeta^3 = 1, zeta != 1 and i^2 = -1 in F_p. Verified per instance by
      checking phi^3 = identity and phi^2 = negation respectively on random
      points, before any cocycle is computed.
    - >-
      The factor base excludes the fixed points of the x-action: x = 0 for j = 0
      (the unique 3-torsion x fixed by x -> zeta x) and x = 0 for j = 1728 (fixed
      by x -> -x). At a fixed point the orbit has length 1, the cocycle condition
      degenerates, and for j = 1728 the point is 2-torsion so P = -P and the sign
      is meaningless. Both exclusions are recorded per instance.
    - >-
      N is prime and the relevant root of unity exists in Z/N: lambda^2 + lambda
      + 1 = 0 for j = 0 (so 3 | N - 1), lambda^2 + 1 = 0 for j = 1728 (so
      4 | N - 1). Both verified.
    - >-
      Signed relation rows require the decomposition recorder to resolve and
      store the summand signs. That is a driver change relative to everything
      committed in the lane, and it is declared here rather than discovered.
    - Toy scale; claim tier `toy`.

  proof_search_map:
    bottleneck: >-
      There is no computational bottleneck. The load-bearing step is the identity
      epsilon_i * epsilon_{sigma(i)} = sign of phi^2 at i, evaluated at orbit
      closure. The lane's practical bottleneck that this record removes is the
      risk of measuring a structure statistic against the wrong operator.
    baseline_embedding:
      parameter_slice: >-
        j = 0 with orbit-consistent lifts. There the signed and unsigned
        operators must coincide EXACTLY, so every committed j = 0 measurement in
        the lane's history must be reproduced bit for bit. That is the embedding:
        the new machinery must not change any existing correct number.
      reproduction_check: >-
        Frozen fixture: the four EXP-STR-003 arm-A cells (B = 27, 55, 204, 397
        with phi_alpha = 9, 2, 4, 1). With orbit-consistent lifts and the signed
        operator, these must reproduce exactly. If they do not, either the
        committed lifts were already orbit-consistent by accident (checkable) or
        the signed operator has been built wrong.
    observation_collision:
      observable: >-
        The cohomology class of the sign cocycle: one bit per orbit for even g,
        nothing for odd g.
      distinct_preimage_search: >-
        REQUIRED AND SUCCEEDS BY CONSTRUCTION: every cochain in a coboundary
        class has the same class, so the fibre over each observable is the full
        set of lift choices - of size 2^{B} / 2^{B/g} for odd g. That is a
        massive, deliberate collision and it is exactly what makes the class the
        right object: it is invariant under precisely the ambiguity that has no
        mathematical content. The claim this bounds: the class cannot detect
        WHICH lifts were chosen, only whether a consistent choice exists.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the permutation operator with the signed permutation, i.e.
          replace the group C_g acting on indices by its extension by {+-1}
          acting on lifted points. The extension preserves more state than the
          quotient - it remembers the sign - and it is that stronger state that
          survives the passage from x-coordinates to points, which is exactly
          where the lane's rows live.
        predicted_gain: >-
          Correctness of every downstream statistic at j = 1728, where the
          quotient operator commutes with nothing; and a stated precondition
          (orbit-consistent lifts) that makes the j = 0 statistics well defined
          rather than accidentally right.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the class) fixed and vary the forgotten structure
          (the lift choice); check that no downstream statistic depends on the
          lift choice once the class is fixed. Any statistic that DOES depend on
          it is gauge-dependent and is not a property of the curve.
        predicted_gain: >-
          A gauge-invariance audit of the whole battery, which is a cheap and
          previously unavailable check on whether the lane's statistics are
          properties of the mathematics or of the bookkeeping.
    quantifier_order: >-
      Intended: FOR ALL j = 0 curves and FOR ALL x-coordinate factor bases,
      THERE EXISTS a choice of lifts making all epsilon_i = +1 - and the witness
      is constructed uniformly (choose one lift per orbit, define the rest by
      phi). FOR ALL j = 1728 curves and FOR ALL choices of lifts, the product
      around every orbit is -1 - no witness exists and the quantifier order is
      the reverse. The contrast in quantifier order between the two
      discriminants is the mathematical content, and stating it this way makes
      visible that the j = 0 claim is constructive while the j = 1728 claim is an
      obstruction.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The equivariance operator on an x-coordinate relation matrix is a signed
        permutation whose class is trivial for D_0 = -3 and nontrivial for
        D_0 = -4; measurements made with the unsigned operator are correct in the
        first case given orbit-consistent lifts and incorrect in the second." It
        can NEVER certify anything about relation yield, about cost, about
        crypto scale, or about the ECDLP. It is a correctness statement about an
        instrument.
      nearby_object_control: >-
        The nearby object where the conclusion fails: a curve with |Aut| = 2
        (generic j), where the only automorphism is negation, the x-action is
        trivial, sigma is the identity, and the cocycle is vacuous. The method
        must report "no structure" there. A method that reported a nontrivial
        class on a generic curve would be detecting its own bookkeeping.
    proof_obligations:
      - claim: epsilon is well defined given lifts and sigma.
        responsibility: correctness
      - claim: H^1(C_3, {+-1}) = 0, with the explicit trivialisation exhibited.
        responsibility: correctness
      - claim: >-
          epsilon_i epsilon_{sigma(i)} = -1 for j = 1728, for every lift choice.
        responsibility: correctness
      - claim: >-
          Signed and unsigned operators coincide on j = 0 with orbit-consistent
          lifts.
        responsibility: baseline
      - claim: The planted sign class is recovered at 100% of instances.
        responsibility: soundness
      - claim: >-
          Signed rows, not incidence vectors, are what the fold and the rank
          statements of IDEA-20260807-0e4d83 apply to.
        responsibility: interface
      - claim: Fixed points of the x-action are excluded and recorded.
        responsibility: scope

  heuristic_assumptions:
    - id: HEUR-L5-15
      statement: >-
        NO HEURISTIC IS LOAD-BEARING. The cohomological dichotomy is exact:
        it follows from gcd(3, 2) = 1 in one case and from phi^2 = [-1] in the
        other, both of which are ring facts about Z[zeta_3] and Z[i]. Recorded
        explicitly rather than by omission.
      rigorous_support: >-
        H^1(G, M) = 0 whenever |G| and |M| are coprime (the standard
        restriction-corestriction / averaging argument). The j = 1728 obstruction
        is a one-line computation from phi^2 = [-1].
      validation_plan: >-
        The STEP 2 and STEP 3 measurements are known-answer tests of the
        implementation against these theorems and are reported as such, never as
        evidence for them.
    - id: HEUR-L5-16
      statement: >-
        Under an arbitrary lift convention (whatever lift_x returns), the signs
        epsilon_i behave as independent fair coin flips, so about half of them
        are -1 and the free-relation count on an unsigned base is about
        (1/2)^{g-1} times B/g.
      rigorous_support: >-
        Imitates the standard expectation that the two square roots of
        x^3 + a x + b are ordered pseudo-randomly by any convention not designed
        to respect phi - which is a statement about the distribution of quadratic
        residues, and is the same class of heuristic as the equidistribution
        assumptions elsewhere in this lane. It is NOT a theorem: a convention
        such as "choose the y whose least non-negative representative is even"
        could in principle correlate with the zeta-multiplication, and measuring
        it is exactly STEP 2.
      validation_plan: >-
        Measure the empirical fraction of epsilon_i = -1 across many instances
        and many B, and test it against the binomial(B, 1/2) prediction. Tail
        check: the most extreme per-instance fraction. A systematic deviation
        would be a genuine and slightly surprising fact about lift conventions
        and quadratic residues, and would be reported as an observation under
        AGENTS.md rule 8 rather than discarded. TOY SCALE ONLY.

  predictions:
    - metric: fraction of epsilon_i = -1 on an arbitrarily-lifted j = 0 base
      direction: different
      minimum_effect: >-
        Near 1/2, within binomial noise for B trials. Near 0 would mean lift_x
        already respects phi (which would be worth knowing and would explain why
        the lane's j = 0 numbers behaved); near 1 would mean it anti-respects it.
    - metric: product of epsilon around each orbit, j = 0
      direction: different
      minimum_effect: >-
        EXACTLY +1 at 100% of orbits, at every instance, under every lift
        convention. A single -1 falsifies phi^3 = 1 as implemented.
    - metric: product of epsilon around each orbit, j = 1728
      direction: different
      minimum_effect: >-
        EXACTLY -1 at 100% of orbits, at every instance, under every lift
        convention including the orbit-consistent attempt. A single +1 falsifies
        the phi^2 = [-1] relation as implemented.
    - metric: >-
        displacement rank of a signed-equivariant matrix measured against the
        unsigned operator, minus the same measured against the signed operator
      direction: higher
      minimum_effect: >-
        The full range of the statistic: near min(R, B) unsigned against near 0
        signed, at every j = 1728 cell. This is the largest single instrument
        effect in the lane and it is predicted with no free parameters.
    - metric: free-relation count on a j = 0 base, arbitrary lifts versus orbit lifts
      direction: higher
      minimum_effect: >-
        About (1/2)^{g-1} B/g against exactly B/g, i.e. about a factor 4 at
        g = 3. A ratio near 1 means the lifts were already consistent; a ratio
        near 0 means the free relations were never being found at all.
    - metric: >-
        informative rank computed from signed rows minus that from unsigned 0/1
        rows, same harvest
      direction: different
      minimum_effect: >-
        Nonzero at a majority of cells. Predicted: the unsigned rows overstate
        rank, because dropping signs turns proportional rows into independent
        ones. This quantifies exactly how much of the lane's committed rank data
        is an artifact of the incidence-vector representation.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): archive the derivation of (A) and (B).
      STAGE 1 (seconds, HARD GATE): verify phi^3 = identity on j = 0 and
      phi^2 = negation on j = 1728, on random points.
      STAGE 2 (seconds): measure the cocycle on arbitrarily-lifted bases, both
      discriminants. THIS IS THE WHOLE DECISIVE MEASUREMENT and it needs no
      relations, no ranks and no decomposition search. It is the single cheapest
      test in the entire L5 set.
      STAGE 3 (seconds): construct orbit-consistent lifts for j = 0, confirm
      all +1; attempt for j = 1728, confirm impossible.
      STAGE 4 (minutes): both operators against both lift conventions, all
      structure statistics, both discriminants.
      STAGE 5 (minutes): the frozen EXP-STR-003 arm-A reproduction check.
      STAGE 6 (hours): signed rows end to end, and the j = 1728 arm.
      STAGE 7 (minutes): NULL 1 planted class, NULL 2 random cochain, and the
      f-sweep decay test.
      STAGES 0-3 cost under a minute of compute and already settle the
      dichotomy; everything after is consequence management.
    controls:
      - NULL 1 - synthetic matrices with planted sign class, must be recovered
      - NULL 2 - random sign cochain, giving the false-positive rate at even g
      - >-
        f-sweep over the fraction of orbit-consistent lifts, as the decay test on
        j = 0, with the explicit prediction that no decay occurs on j = 1728
      - generic-j curve (|Aut| = 2), where the cocycle must be vacuous
      - >-
        frozen EXP-STR-003 arm-A cells, which must reproduce exactly under the
        signed operator with orbit-consistent lifts
      - >-
        matched Pollard rho with negation and BSGS in group operations for the
        Pareto row, even though nothing is attacked
    required_metrics:
      - epsilon_i per index, per instance, per lift convention
      - orbit product of epsilon, per orbit, both discriminants
      - fraction of epsilon = -1, against the binomial(B, 1/2) prediction
      - all structure statistics under both operators and both conventions
      - free-relation count under both conventions
      - informative rank from signed rows and from unsigned rows, same harvest
      - planted-class recovery rate
      - f-sweep curves for every affected statistic
      - excluded fixed points, counted and recorded
      - EXP-STR-003 arm-A reproduction result, exact integers

  falsification_conditions:
    - >-
      Any j = 0 orbit has epsilon product -1. phi^3 = 1 fails as implemented;
      halt, because it invalidates the curve arithmetic used by the whole lane.
    - >-
      Any j = 1728 orbit has epsilon product +1. phi^2 = [-1] fails as
      implemented, or phi was built as something other than (-x, i y); halt and
      reconcile.
    - >-
      The orbit-consistent lift construction fails to make all j = 0 signs +1.
      The trivialisation argument is wrong or the construction is misimplemented;
      the record is superseded rather than amended.
    - >-
      The planted sign class is not recovered. The instrument cannot see the
      object and every class it reports is void.
    - >-
      The EXP-STR-003 arm-A cells do not reproduce under the signed operator
      with orbit-consistent lifts. Either the committed lifts were already
      orbit-consistent - which is checkable and would be a benign explanation -
      or the new operator is wrong. Until reconciled, no comparison with
      committed numbers is permitted.
    - >-
      Every structure statistic is insensitive to the lift convention on j = 0
      (flat f-sweep). Then the signs do not matter for those statistics, which is
      a legitimate and useful negative: it would mean the lane's committed j = 0
      numbers are unaffected, and the record's scope narrows to j = 1728.

  confounders:
    - >-
      lift_x MAY ALREADY BE CONSISTENT. If the harness's lift_x picks y by a rule
      that happens to commute with x -> zeta x (for instance because zeta x and x
      have square roots chosen by the same deterministic square-root algorithm
      with no dependence on x's representative), then all signs are already +1
      and the j = 0 half of this record is vacuous. That is a benign outcome and
      STAGE 2 detects it in seconds; it must be checked before any claim that
      committed numbers are affected.
    - >-
      2-TORSION AND 3-TORSION FIXED POINTS. x = 0 is fixed by both actions. For
      j = 1728 the point (0, 0) is 2-torsion and equals its own negative, so the
      sign is undefined there. Excluded and recorded.
    - >-
      SIGNS IN THE RELATION VERSUS SIGNS IN THE OPERATOR are two different
      problems (sections (B) and (C)) and they interact. A test that changes both
      at once cannot attribute the effect; STAGE 4 and STAGE 6 vary them
      separately for exactly this reason.
    - >-
      j = 1728 CURVES HAVE 4 AUTOMORPHISMS BUT ONLY 2 ORBIT ELEMENTS ON x. The
      quotient by negation is already spent, so g = 2 on x-coordinates and the
      maximum block split is 2, not 4. Any accounting that uses |Aut| = 4 as the
      block count is wrong by a factor 2 and would inflate the claimed saving.
    - >-
      p = 1 mod 4 IS REQUIRED for i to exist in F_p, and 4 | N - 1 for lambda to
      exist mod N. Instances failing either are skipped and the skip recorded, or
      the j = 1728 arm silently loses power.

  interpretation_limits:
    - >-
      THE LINEAR-ALGEBRA STAGE IS NOT THE DOMINANT COST OF PRIME-FIELD INDEX
      CALCULUS - RELATION COLLECTION IS (EV-STR-001: 0.4% to 3% of the charged
      total). This record claims no linear-algebra gain at all; it is a
      correctness statement about the operator that other records' gains are
      measured against, and its value is entirely in preventing wrong
      measurements rather than in producing a saving.
    - >-
      Toy tier only, claim tier `toy`. The cohomological statements are
      scale-free but they are statements about instruments, not about hardness.
    - >-
      A finding that committed j = 0 numbers are unaffected (the benign
      confounder above) would NARROW this record to j = 1728 and would be
      reported as such. It would not vindicate or refute any prior measurement,
      and this record has no authority to move any hypothesis status.
    - >-
      The j = 1728 arm, if run, produces the lane's first second-discriminant
      data. That is a replication, not an extension: it can corroborate or
      undermine the j = 0 picture and it cannot by itself establish anything at
      crypto scale.

  reachability_gate: >-
    T5's isogeny-walk form does not apply: one curve at a time, no movement. T4
    binds and gives this record its sharpest scope statement, because the
    dichotomy is EXACTLY a statement about which isogeny class one is in:
    D_0 = -3 gives a trivialisable cocycle, D_0 = -4 gives a forced one, and
    D_0 anything else gives no cocycle at all because |Aut| = 2 and the x-action
    is trivial. None of these can be reached from another by any isogeny walk at
    any cost - the CM discriminant is a class invariant. So the record's content
    is a partition of the prime-field curve universe into three permanently
    separated regimes, and a generic curve is in the third, where the lane is
    empty. Within the first two the good object is free: computing the cocycle
    costs one field comparison per factor-base element. SCOPE NOTE, not an attack
    claim: secp256k1 has a = 0 and is in the first regime.

  target_complexity:
    time_exponent: >-
      NO EXPONENT AND NO ATTACK. This record claims strictly less than a constant
      factor: it claims a correctness precondition. Its own cost is one field
      comparison per factor-base element, i.e. B operations once. The relevant
      constants it protects are the g = 3 and g^2 = 9 of
      IDEA-20260807-9ecc6f, which are bounded and are not improved here.
    memory_exponent: >-
      Unchanged, with one genuine design tradeoff exposed: indexing the factor
      base by full POINTS instead of x-coordinates eliminates the cocycle
      entirely at the cost of doubling factor-base storage (and doubling B, hence
      raising the relation matrix from B to 2B columns while halving the number
      of independent unknowns per column - a net wash on unknowns and a factor 2
      on storage). Nobody in the lane has stated this choice; it is a real
      alternative and it is recorded so the next agent can price it.
    best_known: >-
      For the instrument: the committed 0/1 permutation operator of
      harness/endomorphism_la.py, which this record shows is correct for j = 0
      under a condition it does not enforce and incorrect for j = 1728. For the
      ECDLP: parallel rho at 0.886 sqrt(N) and O(1) memory (KN-TECH-001,
      KN-TECH-006), automorphism-discounted rho at about 0.36 sqrt(N) on j = 0
      and about 0.44 sqrt(N) on j = 1728 where |Aut| = 4 (KN-TECH-018), BSGS at
      2 sqrt(N) time and sqrt(N) memory (KN-TECH-031). None moves.
    hidden_overhead: >-
      No o(1). Disclosed instead: the entire phenomenon is an artifact of the
      x-coordinate representation, so it can be made to vanish by paying a factor
      2 in factor-base storage. Whether that is worth doing is a design question
      this record poses and does not answer.
    tradeoff_note: >-
      x-coordinates versus points: half the storage against a nontrivial sign
      cocycle at D_0 = -4 and a lift-consistency obligation at D_0 = -3. That is
      the only tradeoff in the record and it is an implementation one.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES, and not null. As an
    attack: none is mounted, so dominated on every axis by parallel rho
    (0.886 sqrt(N) time, O(1) memory, KN-TECH-001/KN-TECH-006), by the
    automorphism-discounted variant on both CM families this record concerns
    (about 0.36 sqrt(N) at |Aut| = 6, about 0.44 sqrt(N) at |Aut| = 4,
    KN-TECH-018), and by BSGS (2 sqrt(N) time, sqrt(N) memory, KN-TECH-031). As
    an INSTRUMENT-CORRECTNESS statement: nothing in this repository currently
    addresses the sign structure at all, so on that axis it is dominated by
    nothing; it is dominated by the committed instrument on maturity, since that
    has 48 committed run records and this has none.
  sota_delta: >-
    Zero speedup against any attack baseline. Instrument delta, quantitatively:
    identifies one operator error that would be total at D_0 = -4 (predicted
    displacement rank near min(R, B) with the wrong operator against near 0 with
    the right one - the full range of the statistic); identifies one
    representation error affecting both discriminants (0/1 incidence rows in
    place of signed linear equations, confirmed present by EV-STR-003 O-9);
    predicts a factor of about 4 discrepancy in the free-relation count at g = 3
    under inconsistent lifts; and costs B field comparisons to detect, which is
    the cheapest check in the entire L5 set.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.97 that the cohomological dichotomy is correct as stated - it is a
    one-line consequence of phi^3 = 1 against phi^2 = [-1] and of coprimality.
    0.6 that the committed j = 0 lifts are NOT orbit-consistent, in which case
    the sign issue is live for existing measurements; 0.4 that lift_x happens to
    respect phi and the j = 0 half is benign, which STAGE 2 settles in seconds.
    0.9 that the unsigned operator gives a full-range wrong answer on j = 1728.
    0.85 that unsigned incidence rows overstate informative rank relative to
    signed rows. The record is priced at medium priority because its decisive
    measurement costs under a minute and its consequences, while real, are
    corrections to an instrument rather than progress on the lane's question -
    but it is a precondition for IDEA-20260807-0e4d83 and IDEA-20260807-61049d
    being measured correctly, and should be run before, not after, them.

