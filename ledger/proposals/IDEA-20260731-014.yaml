idea:
  id: IDEA-20260731-014
  question_id: RQ-ECDLP-002
  title: >-
    Solving-path re-randomization for Semaev membership — is the min-over-
    randomized-presentations Groebner cost Semaev-structure or generic
    distributional artifact?
  class: mechanism
  claim: >-
    For the SAME fixed Semaev membership system (frozen target R, factor base F,
    arity m — the system whose solution decides whether R decomposes over F),
    the cost of a Groebner solve varies across PRESENTATIONS of that system:
    monomial order, variable ordering, and random unimodular linear
    combinations of the generator set all preserve the ideal and its zero set
    but change the computation trajectory. Define R_rerand(k) = E[min of k
    independent re-randomized presentations of the solve cost] / E[single fixed
    presentation cost], and R_rerand_null(k) the identical min-of-k statistic on
    random same-shape systems (the shape catalog of IDEA-20260731-009). CLAIM:
    at toy scale, R_rerand(8) < 0.9 on Semaev systems at m in {3, 4} at >= 2 bit
    sizes, while R_rerand_null(8) >= 0.95 — i.e. the cheap left tail of the
    solving-cost distribution under presentation re-randomization is
    Semaev-structure-specific, not the generic min-of-k artifact (which the null
    calibrates). If R_rerand(8) >= 0.95 everywhere, presentation re-randomization
    adds no charged saving and the lane closes at tested scope. If
    R_rerand_null(8) < 0.9 whenever R_rerand(8) < 0.9, the apparent gain is a
    generic distributional effect and the structural claim is void under the
    null gate of IDEA-20260731-011 (inventor-protocol controls-before-belief).
  mechanism: >-
    ATTACK OBJECT: the membership-query solve path — the presentation of the
    fixed Semaev system (generator set, monomial order, variable order) as a
    charged random variable. Groebner computation is presentation-sensitive in
    general (lex vs grevlex can differ superpolynomially on known families; the
    Buchberger trajectory depends on the generating set), but the DISTRIBUTION
    of solve cost over presentations of one system is unmeasured anywhere in
    this corpus. The implementable strategy is randomized retry: draw a
    presentation from a pre-registered knob distribution, solve; on timeout,
    redraw. Expected cost is governed by the cheap tail of the presentation
    cost distribution: E[min over retries] < E[single] whenever the tail is
    heavy — a generic order-statistics effect. The null (random same-shape
    systems) calibrates that generic gain; the EXCESS gain on Semaev systems is
    the structural signal, i.e. the claim is about the Semaev system's solving
    cost being unusually presentation-sensitive in the favourable direction.
    Relevance: (i) the query-cost exponent alpha of IDEA-20260727-007 is
    amortized over a fixed-presentation backend; a presentation-aware backend
    lowers the CONSTANT under alpha (never the exponent — this is a constant
    and distributional claim, stated as such); (ii) it complements
    IDEA-20260731-009, which licenses CROSS-family d_ff sampling (Semaev vs
    random shapes) but says nothing about WITHIN-system presentation variance;
    (iii) it does NOT touch the blocked STR/phi_alpha displacement-rank
    instrument (DEC-20260730-001): this is Groebner solving-cost distribution
    under presentation choice, no displacement rank anywhere. Knobs (frozen
    before execution): (1) monomial order in {grevlex, grevlex with random
    weight vector, graded lex, a pre-registered block order}; (2) variable
    permutation (the indicator factors break the Semaev symmetry, so
    permutations are legitimate distinct presentations); (3) random unimodular
    F_p-linear combinations of the generator set (ideal-preserving); (4) random
    scalar re-scaling (no-op, harmless control knob). Each presentation sample
    is one independent draw from this frozen distribution.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-07-31'
    corpus_paths_grepped:
    - ledger/proposals
    - ledger/hypotheses
    - knowledge/INDEX.md
    - knowledge/techniques
    - knowledge/open-problems
    - knowledge/literature
    grep_results:
    - >-
      IDEA-20260731-009 measures d_ff distributions ACROSS families (toy Semaev
      vs random same-shape) to license crypto-size sampling; it never varies the
      presentation of a fixed system and never studies min-of-k strategies —
      different object (cross-family system property vs within-system
      presentation variance).
    - >-
      IDEA-20260727-007 measures the query-cost exponent alpha amortized over
      yield on a fixed backend; presentation choice is a constant-level knob
      inside a query and is not modeled there — complementary, not duplicate.
    - >-
      IDEA-20260726-003 predicts per-target difficulty from fiber geometry
      (passive predictor, target selection); this record RANDOMIZES the
      presentation of a fixed system (active re-randomization, min-of-k
      strategy) — different action and different metric (min-of-k distribution
      vs Spearman correlation).
    - >-
      IDEA-20260727-006 and IDEA-20260731-009 define random same-shape / random
      multihomogeneous nulls; reused here as the null object per
      IDEA-20260731-011's template, not duplicated as a claim.
    - >-
      DEC-20260730-001 blocked reopening the phi_alpha / displacement-rank
      instrument (EXP-STR-004 inconclusive); this record does not involve
      displacement rank, phi_alpha, or STR in any form — the blocked scope is
      untouched.
    - >-
      KN-OPEN-002 (Groebner solving-degree growth) and KN-OPEN-004 (BKK/mixed
      volume) concern system-level degree bounds, not presentation variance of
      a fixed system; no corpus record contains "min over presentations",
      "re-randomization", or "monomial-order distribution".
    literature_verified: []
    conclusion: >-
      The mechanism (presentation-sensitive Groebner cost) is known in the
      general GB literature; the measurement object (presentation cost
      distribution of fixed Semaev systems with a min-of-k strategy and a
      same-shape null) is unoccupied in this corpus. novelty_status unverified;
      the contribution is the distributional measurement with the null gate, not
      the presentation-sensitivity fact itself.
  assumptions:
  - >-
      The Semaev membership system is built exactly as in the ledger's IC practice
      (KN-TECH-003): S_{m+1}(x_1..x_m; x_R) plus the factor-base indicator
      polynomials I(x_j); the engine, its version, and the cost unit are pinned.
  - The knob distribution (order set, permutation rule, unimodular-combination
    rule, re-scaling) is frozen and seeded before execution; a presentation
    sample is reproducible from its seed.
  - >-
      A solve that times out (budget pre-registered) is charged the budget and
      counted as a failure for the retry statistic; no outcome-selected exclusion
      (the DEC-20260727-008 lesson: criteria written before execution).
  - All m in {3, 4} and toy sizes only; crypto-scale extrapolation is out of
    scope of the minimal test.
  predictions:
  - metric: min_of_k_cost_ratio_R_rerand_8
    direction: lower
    minimum_effect: >-
      R_rerand(8) = E[min of 8 presentations of solve cost] / E[single fixed
      presentation] < 0.9 on Semaev systems at m in {3, 4}, at >= 2 toy bit
      sizes, with the ratio's bootstrap interval excluding 0.9.
  - metric: null_ratio_R_rerand_null_8
    direction: higher
    minimum_effect: >-
      The identical min-of-k statistic on random same-shape systems satisfies
      R_rerand_null(8) >= 0.95; the excess gain Delta = R_rerand_null(8) -
      R_rerand(8) >= 0.05 is the structural signal.
  - metric: presentation_variance_ratio
    direction: higher
    minimum_effect: >-
      Var(cost over presentations) / Var(cost over solver seeds at fixed
      presentation) >= 2 at each tested cell — the power check that the
      measurement can actually see presentation variance above solver noise; a
      ratio below 1 voids the run as under-powered, not negative.
  - metric: knob_decomposition
    direction: different
    minimum_effect: >-
      The min-of-k gain is decomposed per knob family (order / permutation /
      unimodular combination); at least one knob family alone achieves
      R_rerand(8) < 0.95 on Semaev systems — the gain must not be an artifact
      of one exotic knob, and the decomposition is reported rather than pooled.
  minimal_test:
    design: >-
      (1) SYSTEM BATCH: on toy prime-field curves at 12, 16, and 20 bits with
      prime-order subgroups, build Semaev membership systems for >= 30 targets
      per (curve, m) cell at m in {3, 4} with B = ceil(N^{1/m}) (yield-tight),
      using the ledger's S_{m+1} construction (KN-TECH-003) plus indicator
      factors. (2) RANDOM SAME-SHAPE BATCH: for each Semaev system, draw >= 100
      random multihomogeneous systems with the identical degree vector and
      variable counts (the IDEA-20260731-009 shape catalog). (3) PRESENTATION
      SAMPLING: per system, draw k = 8 presentation samples from the frozen knob
      distribution (seeded); solve each with the pinned engine; record cost in
      group-operation equivalents and wall time (infra-only). (4) STATISTICS:
      per cell, E[single], E[min of 8], R_rerand(8), R_rerand_null(8), the
      variance ratio, and the per-knob decomposition; bootstrap intervals. (5)
      STRATEGY EVALUATION: from the fitted distributions, compute the expected
      cost of the randomized-retry strategy (retry budget pre-registered) and
      report it against E[single] — the strategy is the implementable output,
      the distribution is the measured object. (6) Pre-registration: thresholds,
      knob distribution, k, timeout budget, and the fit-quality rule are frozen
      in the protocol before any solve runs.
    controls:
    - >-
      Random same-shape null (IDEA-20260731-011 template / 031-009 catalog):
      the min-of-k statistic on random systems calibrates the generic
      order-statistics gain; the structural claim requires R_rerand_null(8) >=
      0.95 while R_rerand(8) < 0.9.
    - >-
      Shuffled-degree null: same variables, wrong degree vector — must NOT show
      the Semaev gain (the gain is shape-specific).
    - >-
      Planted-cheap-presentation positive control: a system with a known cheap
      presentation (e.g., a planted diagonal structure where lex order is
      trivially cheap) must be found by the min-of-k procedure; failure voids
      the harness.
    - >-
      Engine-version sensitivity: the R_rerand(8) sign must not flip when the
      pinned engine version changes by one minor version; a flip voids the run
      as engine-artifact, not negative.
    - >-
      Calibration-invariance control: perturb the solver-to-group-operation
      calibration by 10x in each direction; R_rerand(8) must not move by more
      than 0.03 (a constant cannot change a ratio of expectations of the same
      unit).
    - >-
      Matched Pollard rho (negation) and BSGS on the same instances, in the
      same group-operation unit — the standing RQ-ECDLP-002 baselines, reported
      so that no solving-cost figure is read as an attack result.
    required_metrics:
    - per-system solve cost per presentation sample (seeded), Semaev and null
    - E[single], E[min of 8], R_rerand(8), R_rerand_null(8) per cell, with
      bootstrap intervals
    - variance ratio per cell (power check)
    - per-knob min-of-k decomposition
    - randomized-retry strategy cost vs E[single], per cell
    - engine-version and calibration-perturbation sensitivity results
    - planted-bug control outcome; matched rho/BSGS op counts and BSGS memory
  falsification_conditions:
  - 'TOY-TIER FALSIFIER: R_rerand(8) >= 0.95 at all tested cells with a fitted
    trend — presentation re-randomization adds no charged saving; the lane
    closes at tested scope (toy-scope statement, not a claim about other
    solvers or sizes).'
  - 'TOY-TIER FALSIFIER: R_rerand_null(8) < 0.9 whenever R_rerand(8) < 0.9 —
    the gain is the generic min-of-k distributional artifact; the structural
    claim is void under the IDEA-20260731-011 null gate.'
  - 'Scale gate: a positive R_rerand(8) < 0.9 at toy cells is a charged
    toy-cost finding only; any statement about crypto-scale Groebner cost must
    route through the IDEA-20260731-009 correspondence (normalized d_ff) and be
    labeled extrapolation, never validation (AGENTS.md rule 7).'
  - 'Infrastructure: variance ratio < 1, engine-version flip, or planted-
    cheap-presentation control failure — the run is void, not negative.'
  confounders:
  - Solver noise at toy scale can swamp presentation variance; the variance
    ratio is the pre-registered power gate, and an under-powered cell is
    reported as such rather than pooled.
  - Unimodular generator combinations can blow up coefficient size and change
    the cost unit's meaning; the knob distribution must bound coefficient
    growth (pre-registered bound) or the knob family is dropped and reported.
  - The indicator polynomials I(x_j) have degree B; mixing them into other
    generators is the most likely knob to make things WORSE, which is fine for
    the measurement but must be reported per-knob, never pooled away.
  - >-
      Timeout charging interacts with the min-of-k statistic: a generous timeout
      inflates E[single] relative to E[min], biasing R_rerand downward; the
      timeout must be fixed by a pre-registered rule (e.g., 10x the median single
      solve on a pilot set) before execution.
  interpretation_limits:
  - A confirmed excess gain is a toy-scale statement about Semaev membership
    solving-cost distribution under presentation re-randomization; it lowers
    the constant under alpha (IDEA-20260727-007), never an exponent, and moves
    no assembled ECDLP exponent by itself.
  - >-
      The null gate of IDEA-20260731-011 is decisive: a gain that survives on the
      null is a generic distributional effect and the structural reading is void;
      passing the gate is necessary, not sufficient, for any further claim.
  - Nothing here is evidence about ECDLP at cryptographic scale, and the record
    does not reopen the STR/phi_alpha instrument closed by DEC-20260730-001.
  - The randomized-retry strategy cost is the implementable deliverable; the
    distribution is the measurement; neither is an attack.
  heuristic_assumptions:
  - id: HEUR-RR-1
    statement: >-
      For Semaev membership systems at arity m in {3, 4} over toy prime fields,
      the Groebner solve cost over the frozen presentation distribution has a
      cheaper left tail than over the identical distribution applied to random
      same-shape systems: the excess min-of-k gain Delta = R_rerand_null(k) -
      R_rerand(k) is positive and material (>= 0.05 at k = 8).
    rigorous_support: >-
      The rigorous anchor is that Groebner complexity is presentation-dependent
      in general (the lex-vs-grevlex gap on known families is a classical
      textbook fact; the Buchberger trajectory depends on the generating set),
      so nonzero presentation variance is guaranteed, not assumed. What is
      heuristic is the DIRECTION for Semaev-shaped systems: that the Semaev
      system's presentation distribution has an unusually cheap tail relative
      to the random same-shape model (the Bardet-Faugere-Salvy semi-regular
      random model as the classical null distribution being imitated). The
      min-of-k order-statistics reduction is rigorous given the distribution;
      the distributional claim is the heuristic.
    validation_plan: >-
      Sampled quantity: solve cost per presentation sample on Semaev and on
      random same-shape systems. Shortcut: toy B makes the systems small enough
      for >= 100 presentation samples per system within budget; no Groebner call
      at crypto size anywhere. Comparison distribution: R_rerand(8) vs
      R_rerand_null(8) with bootstrap intervals; the null must sit at >= 0.95
      while the Semaev ratio sits below 0.9 — the distribution-level comparison
      that separates structure from artifact. Tail consistency check: the
      empirical min-of-k decay as k grows (k in {1, 2, 4, 8, 16}) against the
      order-statistics prediction from the fitted single-presentation
      distribution; a mismatch voids the fit. LABEL: TOY-SCALE.
  target_complexity:
    time_exponent: >-
      No exponent move claimed. The quantity under test is the constant/tail of
      the per-query solve cost inside alpha (IDEA-20260727-007): the ratio
      R_rerand(8) < 0.9 is a constant-factor statement about the membership
      backend, feeding the alpha measurement but not the exponent.
    memory_exponent: >-
      The measurement needs the systems and their presentation samples only;
      memory is trivial at toy scale and reported in bits as part of the
      baseline convention.
    best_known: >-
      Pollard rho ~0.886 sqrt(N) (KN-TECH-001); BSGS 2^{n/2} x n*2^{n/2} bits
      (KN-TECH-031/035); no archived measurement of Semaev membership
      presentation variance anywhere in the corpus.
    hidden_overhead: >-
      The retry strategy's expected cost includes timeout waste (charged per
      the pre-registered timeout rule); the per-knob decomposition discloses
      which knobs carry the gain; engine constants are disclosed per run.
    tradeoff_note: >-
      k (number of retries) trades expected solve cost against worst-case
      latency: the strategy is latency-heavy by construction, which matters for
      wall-clock pipelines but is charged identically on both sides of the
      comparison.
  matched_baseline: >-
    SAME COST CONVENTION ON BOTH SIDES, serial classical: costs in
    group-operation equivalents (1 point addition = 1 op; scalar multiplications
    charged by their operation count); memory charged separately in bits (table
    entries x bit-width); preprocessing and query data charged (factor base,
    sumset tables, pool, walk data). Baselines written down: Pollard rho ~ 0.886
    * 2^(n/2) group ops serial constant memory (KN-TECH-001, archived); BSGS ~
    2^(n/2) time x n * 2^(n/2) bits memory (KN-TECH-031/035, archived); multi-
    target rho: independent runs T * 0.886 * 2^(n/2); shared distinguished-point
    table ~ sqrt(T * N) total ops — UNVERIFIED (measured by IDEA-20260731-013);
    preprocessing frontier S*T^2 = Omega~(eps*N) (KN-LIT-013, archived); generic
    GGM Omega(sqrt(N)) (KN-TECH-005, archived). Quantum: stated separately
    under MAXDEPTH; none claimed here. On the measured side the same convention
    charges every presentation solve identically on Semaev and null systems,
    and the retry strategy is evaluated from the same cost unit.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  dominated_by: >-
    As a constant/tail-level backend technique it is dominated in the exponent
    sense by any exponent-level mechanism (none claimed); it is not dominated
    within its own row (membership-backend constant) by any corpus record, since
    no record measures presentation variance. The null gate (IDEA-20260731-011)
    dominates its interpretation: a null-surviving gain is the only admissible
    structural reading. Every row of the frontier (time, memory, data/queries)
    checked as documented.
  sota_delta: >-
    Quantitative: target R_rerand(8) < 0.9 (>= 10% expected solve-cost saving
    at 8 retries) on Semaev systems with R_rerand_null(8) >= 0.95, i.e. an
    excess structural gain Delta >= 0.05; constant-level (feeds alpha in
    IDEA-20260727-007), no exponent delta, no ECDLP claim.
  source_refs:
  - ledger/proposals/IDEA-20260731-009.yaml
  - ledger/proposals/IDEA-20260727-007.yaml
  - ledger/proposals/IDEA-20260726-003.yaml
  - ledger/proposals/IDEA-20260727-006.yaml
  - ledger/proposals/IDEA-20260731-011.yaml
  - ledger/decisions/DEC-20260730-001.yaml
  - knowledge/techniques/KN-TECH-003.md
