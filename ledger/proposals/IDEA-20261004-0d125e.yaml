# IDEA-20261004-0d125e
# Wider window-table count. Proposal only. Not approved.
idea:
  id: IDEA-20261004-0d125e
  question_id: RQ-ECDLP-002
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    A width-26 window table stores 33554432 entries and a width-25 table stores 16777216
  class: representation
  claim: >-
    A window of width 26 stores 33554432 precomputed entries. A window of
    width 25 stores 16777216. Thirty-three million five hundred fifty-four
    thousand four hundred thirty-two exceeds sixteen million seven hundred
    seventy-seven thousand two hundred sixteen by 16777216. The product of
    the two table sizes is 562949953421312. Their sum is 50331648. The gap
    is a table size, not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the precomputed table. The operation
    set is reading one entry during a recoding. Two to the power
    25 is 33554432. Two to the power 24 is 16777216. Two width-25 tables both
    store 16777216, so that gap is 0 and their product is 281474976710656. No
    curve point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-RHO-ea34b8
      provenance: internal
      claim: >-
        Precomputation-table bounds are a different scale from these two sizes.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The two widths are frozen before the powers are taken.
    - No curve point is added.
  proof_search_map:
    bottleneck: The table-size gap 16777216.
    baseline_embedding:
      parameter_slice: The widths 26 and 25 and the sizes 33554432 and 16777216.
      reproduction_check: >-
        Two readers must agree that 2 to the power 25 is 33554432 and that
        2 to the power 24 is 16777216.
    observation_collision:
      observable: The table-size gap and the product.
      distinct_preimage_search: >-
        Reporting both tables as size 16777216 drops the gap. Two width-25
        tables make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The width-25 table.
        predicted_gain: Sixteen million seven hundred seventy-seven thousand two hundred sixteen fewer stored entries. No exponent.
    quantifier_order: >-
      The widths are fixed before the sizes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table sizes 33554432 and 16777216. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-25 tables. Both store 16777216, and the gap is 0.
    proof_obligations:
      - claim: The width-26 table stores 33554432 entries.
        responsibility: size
      - claim: The width-25 table stores 16777216 entries.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: table_gap
      direction: different
      minimum_effect: Thirty-three million five hundred fifty-four thousand four hundred thirty-two exceeds sixteen million seven hundred seventy-seven thousand two hundred sixteen by 16777216.
  minimal_test:
    design: >-
      Compute 2 to the power 25 and 2 to the power 24. Do not add a
      curve point.
    controls:
      - Two width-25 tables, whose size gap is 0.
      - An independent count.
    required_metrics:
      - both table sizes
      - the gap
      - the product
  falsification_conditions:
    - The width-26 table size is not 33554432.
    - The product of the two sizes is not 562949953421312.
  confounders:
    - A width-25 table of size 16777216 is a different window from a width-24 table of size 8388608.
  interpretation_limits:
    - A table size is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the table-size pair 16777216 and 8388608.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen width-26 table has size 2 to the power 25, and the
        frozen width-25 table has size 2 to the power 24.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of two powers of 2.
      validation_plan: >-
        Two independent powers. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Thirty-three million five hundred fifty-four thousand four hundred thirty-two stored entries versus sixteen million seven hundred seventy-seven thousand two hundred sixteen, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Recoding cost is not counted.
    tradeoff_note: A larger table can shorten digits and does not by itself shorten a walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-ea34b8
      - KR-RHO-53c89f
      - KR-RHO-13bf67
      - KR-RHO-38be82
    nearest:
      - ref: KR-RHO-ea34b8
        provenance: internal
        relation: adjacent
        delta: >-
          That row bounds precomputation tables at cryptographic
          size. This record counts table sizes 33554432 and 16777216 and claims
          no precomputation attack.
  dominated_by: >-
    No attack is claimed. Rho dominates any attack reading of a table size.
  sota_delta:
    time: zero attack delta
    memory: a constant factor of 33554432 versus 16777216
    data_queries: Two frozen widths.
