idea:
  id: IDEA-20261018-5f37a1
  question_id: RQ-KIC-7502b9
  added: '2026-10-18'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Log-blind golden bases: coverage gained without discrete logarithms is an
    order statistic of the orbit-class occupancy null
  class: measurement
  claim: >-
    Koblitz toy, n prime, G of prime order r, tau = scalar lambda of order n,
    base = K signed orbit columns (2n points each), m-sums. N_c = (r-1)/(2n)
    target classes, M_c m-sum classes, lam = M_c/N_c. (A) Null: coverage is the
    occupancy of M_c throws into N_c bins, variance about
    N_c e^-lam (1-(1+lam)e^-lam), so the coverage fraction fluctuates sqrt(2n)
    times more than an element-level null that counts the 2n images of a class
    as independent. (B) A log-blind pool search over K_pool candidates reaches
    mean + z(K_eff) sd, z(K) = sqrt(2 ln K) - (ln ln K + ln 4pi)/(2 sqrt(2 ln K));
    the log-aware headroom min(1,lam) of KN-FIND-007 needs logs. (C) On the
    frozen N19 pool (66045 four-orbit bases, RUN-KIC-234d11) the score sd is 0.8
    to 1.25 times the null sd and the pool and plane winners lie within 1 sd of
    the selection-matched expected maximum; sd of at least 1.5 times null means
    real structure, whose source is then the finding.
  mechanism: >-
    OBJECT FRAME. Pair (R1 explicit orbit-column base; Sigma = <tau,-1> on
    columns plus translation by base elements). Class I partial-action; the
    branching event priced is existence of a decomposition. Lossy test against
    Sigma: sum -> target class discards the producing tuple and the 2n images;
    compatible since the sum map is equivariant and <tau,-1>-orbits are a free
    block system of G; lossy when lam > 1. Priced number: coverage excess in
    null-sd units, plus design charge C_design and break-even curve count
    L* = C_design/(relative gain x C_attack). KN-OPEN-020 class: explicit list
    (scoped out), no escape claimed. Stage: base design / relation yield.
  novelty_status: unverified
  citations:
    - ref: EXP-KIC-3df18c
      provenance: internal
      claim: >-
        RUN-KIC-234d11 scored all 66045 four-orbit bases of the N19 pool: winner
        6224/6909, best plane 6189, frozen null 5950, threshold 5913.
      verified_by: idea-generator, REPORT.md read
    - ref: IDEA-20260930-4ebd85
      provenance: internal
      claim: Relabelled cyclic null; valid for non-stable B only (equivariance lost).
      verified_by: idea-generator, record read
    - ref: Kolchin-Sevastyanov-Chistyakov, Random Allocations (1978)
      provenance: recalled
      claim: exact moments and limit laws of bin occupancy.
      verified_by: null
  predictions:
    - metric: score sd over null sd (66045 N19 scores)
      direction: different
      minimum_effect: "0.8 to 1.25 under null; at least 1.5 flags structure"
    - metric: winner z minus E[max of K_eff], pool and plane winners
      direction: lower
      minimum_effect: "absolute value at most 1"
    - metric: share of log-aware headroom reached by log-blind winners
      direction: lower
      minimum_effect: "at most 0.1; log-aware control at least 5 null sd up"
  minimal_test:
    design: >-
      Stage 0 (no new curve arithmetic): read base_scores.json of RUN-KIC-234d11
      and the frozen counting convention; compute mean, sd, skew, max, min; the
      exact occupancy null in both conventions; z of winner, plane winner, frozen
      null base and threshold 5913. Stage 1: 200 random 37-column pools in the
      relabelled group (Z/r, scalar lambda) with the same exhaustive 4-of-37
      search. Stage 2: dlog-guided greedy base (positive control). Stage 3:
      repeat at n=17 (r=65587) and n=11 (r=991).
    controls: [random 4-of-6909 bases, selection-matched pool, log-aware greedy, element-level null]
  falsification_conditions:
    - Score sd outside 0.5 to 2 times null sd in both conventions after the IDEA-20261018-d4cef4 floor.
    - Log-aware greedy not 5 null sd above mean (instrument blind; nothing read).
    - Pool winner outside the 1st to 99th percentile of the selection-matched winner law.
  confounders: [counting convention moves the null mean by about 25 classes, candidates share triple-type supports so K_eff < K_pool, lam above 1 at toy scale but below 1 at design scale]
  interpretation_limits: [coverage only since mean yield is conserved (KN-FIND-007), toy cells, no attack or exponent claim]
  heuristic_assumptions:
    - id: H1
      statement: >-
        After removing universal coincidences (IDEA-20261018-d4cef4), class-sums
        of a log-blind explicit stable base behave as M_c iid uniform draws on N_c
        classes.
      rigorous_support: >-
        Free action of the order-2n group on distinct m-subsets (m odd, n prime)
        plus the exact occupancy law (Kolchin et al.).
      validation_plan: >-
        66045 N19 scores: mean, sd, skew, KS vs the occupancy law, both tails;
        repeat n=17, n=11; no transfer beyond tested cells.
    - id: H2
      statement: K_eff of the pool search is at least K_pool over the triple-type sharing factor.
      rigorous_support: Winners of correlated normals do not exceed the independent-case maximum.
      validation_plan: Winner-z law over 200 random pools; observed winner against its percentiles.
  target_complexity:
    time_exponent: >-
      None moves (rho r^(1/2)). Attempt reduction from log-blind selection is at
      most z sqrt(f(lam)/N_c)/(1-e^-lam), f = e^-lam(1-(1+lam)e^-lam): about 1.5
      percent at N19, below 2^-60 once N_c >= 2^120.
    memory_exponent: unchanged
    best_known: matched signed-Frobenius rho, sqrt(pi r/(4n)) operations, O(1) memory (KR-RHO-482ed3)
    hidden_overhead: design cache about 2/3 P^3 n^2 additions for pool P (N19 1.3e7), charged against one matched attack
    tradeoff_note: log-aware headroom (up to 1.58x) needs per-curve discrete-log advice
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked: [KR-IC-b0fcda, KR-IC-73db3f, KR-IC-5765d2, KR-IC-f5c584, KR-IC-1fcdbc, KR-IC-889857, KR-RHO-482ed3, KR-RHO-13bf67, KR-IC-791cb7, KR-RHO-cd0049, KR-RHO-1c2928, KR-RHO-755e35, KR-IC-f3da82, KR-IC-e847d1]
