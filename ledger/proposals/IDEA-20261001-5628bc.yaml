  title: >-
    THE COFACTOR OF ECC2K-130 IS A FACTOR-BASE-SIZE PARAMETER, NOT A LEVER: the
    group is S x C with S = E(F_2) cyclic of order 4, its six subgroups give a
    leg-side quotient chain E -> E/C = Z/4 -> E/2E = Z/2 -> 1 that is constant
    on every target, a base's mean yield over targets is exactly its
    label-sum-zero multiset count over r, and so the restricted (subgroup)
    and unrestricted (full-curve) base conventions differ only by a
    reparametrisation of (|F|, ambient, dim V) whose sign at equal |F| is set
    by the oracle's cost growth per V-dimension (threshold 1 bit per
    dimension per nonlinear label bit); a zero-compute code read classifies
    which convention each of this program's builders uses, and so which
    floor its rows are read against

  class: control

  claim: >-
    SCOPE. ECC2K-130: E: y^2 + xy = x^3 + 1 (a = 0, b = 1) over
    F_2[z]/(z^131 + z^13 + z^2 + z + 1), #E = 4r with r the prime
    680564733841876926932320129493409985129 (quoted from the frozen source,
    inputs/BAILEY-2009-541-ECC2K130/talk-35minutes_text.md page 9, and
    recorded as confirmed by the validator's J3 in CORR-20260928-4cb669; the
    point count and primality are not re-verified here). C is the order-r
    subgroup holding the challenge points (Certicom's P and Q are 4 times
    random points, same source). No sentence below states an ECDLP speedup,
    an exponent move, a security verdict on ECC2K-130, or a closure as an
    outcome.

    PART A, THE CHAIN (structural certificate, zero compute; this part is
    the same subgroup lattice that IDEA-20260926-136bd3 claim (B) states and
    that the S2 lineage's Stage 0 certifies, see non_duplication; it is
    re-derived here because this record's part B consumes it, and it is not
    a separate deliverable of this record).
    (L1) On EVERY ordinary binary curve E_ab: y^2 + xy = x^3 + a x^2 + b
    (b != 0) over F_{2^n}, the point T = (0, b^{1/2}) is the only point of
    order 2 over the algebraic closure and it is F_{2^n}-rational. Hence
    2 divides #E_ab(F_{2^n}) (no cofactor-1 curve exists in this family) and
    the 2-Sylow subgroup of E_ab(F_{2^n}) is cyclic (no Z/2 x Z/2 2-part
    exists in this family).
    (L2) On ECC2K-130 the 2-Sylow subgroup S is E(F_2) = {O, (0,1), (1,0),
    (1,1)}, cyclic of order 4 and generated by G1 = (1,0), with 2 G1 =
    T = (0,1). Frobenius fixes S pointwise.
    (L3) E = S x C is cyclic of order 4r and has exactly six subgroups,
    O < 2S = <T> < S, C < 2E = 2S x C < E, one per divisor of 4r; every
    subgroup H equals (H cap S) x (H cap C). Every lossy quotient E -> E/H
    (H != O) is, on the target subgroup C, EITHER injective (H in {2S, S}:
    the reduction to C that rho and every index-calculus line already
    perform) OR constant (H in {C, 2E, E}: the leg-side chain). The leg-side
    chain is E -> E/C = Z/4 (the label pi_4) -> E/2E = Z/2 (the label
    pi_2 = pi_4 mod 2) -> E/E = 1. The superseded record's statement that
    the quotients of S are "trivial or all of S" is false: S = Z/4 has the
    proper quotient Z/2, the E/2E map (DEC-20260924-99ce20 HOLD-O). The
    nontrivial cofactor quotient other than E/2E on ECC2K-130 is exactly
    E/C = E/4E = Z/4; there is no other.
    (L4) Labels in coordinates. For P = (x, y) on E_ab(F_{2^n}) with x != 0,
    P lies in 2E iff Tr(x) = Tr(a). So pi_2 is F_2-AFFINE in x (on ECC2K-130
    pi_2(P) = Tr(x(P))). For P in 2E \ {O, T} on ECC2K-130, P lies in 4E iff
    Tr(w) = 0 for either root w of w^2 + x(P) w + 1 = 0 (the two roots w and
    1/w have equal trace); this second bit is NOT affine in x. The
    x-coordinate determines pi_4(P) up to sign, that is its class in
    Z/4 / {+-1} = {0}, {2}, {1, 3}.

    PART B, RELABELLED AS FACTOR-BASE SIZE (DEC-20260928-63addc
    na3_disposition). The superseded record framed the question "do this
    program's builders keep or discard the up-to-three extra cofactor-coset
    representatives" as a cofactor lever worth at most 4x. It is not a lever.
    (I1, exact) For ANY base D in E \ {O} and any arity m, the number of
    size-m multisets of D summing into C equals M_0(D), the number of size-m
    multisets whose pi_4 labels sum to 0 in Z/4; each such multiset sums to
    exactly one target. So the mean decomposition yield over targets in C
    is M_0(D) / r (for signed decompositions, signed multisets with labels
    negated). For D inside C, M_0(D) = binomial(|D| + m - 1, m) exactly
    (KN-FIND-007 applied to the group C).
    (C1, under H1) At a FIXED subspace V, the restricted base
    D_r = x^{-1}(V) cap C against the unrestricted D_u = x^{-1}(V) (V not
    inside ker Tr) has |D_r| / |D_u| = 1/4, mean yield per attempt in ratio
    4^{1-m}, relations needed in ratio 1/4, attempts in ratio 4^{m-2}, and
    linear algebra in ratio 1/16. If V lies inside ker Tr (on ECC2K-130,
    a = 0), D_u already lies in 2E by L4 and the same ratios hold with 4
    replaced by 2: the level-1 bit is imposed linearly, at no V-dimension
    cost (that lever is IDEA-20260922-1b16d7's and is cited, not claimed).
    (C2, under H1) At EQUAL measured base size |D|, imposing one NONLINEAR
    label bit halves the effective ambient (doubling the mean yield per
    attempt) and costs one V-dimension, so the attempt-cost ratio
    (restricted over unrestricted) is c(l+1) / (2 c(l)) = 2^{g-1}, with c(l)
    the oracle's cost per attempt at V-dimension l and g the oracle's cost
    growth in bits per V-dimension; for k nonlinear bits it is 2^{k(g-1)}.
    The restricted convention is cheaper iff g < 1, equal at g = 1 (the
    enumeration oracle at m = 2, whose cost per attempt is about |V|), and
    dearer iff g > 1. A LINEAR label bit (the level-1 bit, when V can be
    taken inside ker Tr) costs no V-dimension, so imposing it gives the
    factor 2 with no oracle-cost change. With a FREE oracle (g = 0) and |D|
    re-optimised, imposing k label bits, linear or not, lowers the floor by
    2k/(m+1) bits: at full restriction from an unconfined base (k = 2) that
    is 4/(m+1) bits, reproducing CORR-20260928-4cb669's subgroup-ambient
    shift (1.3333, 1.0000, 0.8000, 0.6667, 0.5714, 0.4444 bits at
    m = 2, 3, 4, 5, 6, 8).
    (B-AUDIT) Which convention each builder in this program uses is an
    unchecked fact about code, not a group-theory question, and it decides
    which floor (ambient N = 4r, 2r or r) each measured row must be read
    against. It is the record's falsifiable content at zero compute.

    THE DISCRIMINATING TEST, STATED SO EACH OUTCOME MEANS SOMETHING. Stage 0
    classifies each decomposition builder whose rows this program reads
    against KN-FIND-aa2efc or CORR-20260928-4cb669 as U (legs from
    x^{-1}(V), V not inside ker Tr; ambient 4r), U1 (V inside ker Tr, legs
    in 2E on a Tr(a) = 0 curve; ambient 2r), R (legs filtered to C, or drawn
    as multiples of the cofactor; ambient r) or OTHER, with a code pointer
    and the reason the code gives, and records which floor its rows were
    compared against. E-U (every builder is U or U1 and was compared against
    the matching ambient): the comparator of every measured row is correct
    as filed, and CORR-20260928-4cb669's toy Koblitz rows that sit below the
    N = #E floor need a non-convention explanation (H1 failing on that base,
    or optimisation at integer l), which routes to the CERTBIN label census
    of IDEA-20260926-ae8f0a. E-R (some builder is R or U1 but its rows were
    read against N = 4r): those rows' comparator is restated against the
    matching ambient floor by a later Coordinator act, and the sub-floor
    rows are explained by convention to the extent the classification
    covers them. E-MIX (rows of one builder under more than one convention):
    the row-level convention is recorded and each row's comparator follows
    it.

  mechanism: >-
    OBJECT FRAME. Representation R1 (the x-coordinate of a point, in the
    type-II normal basis of the Bailey et al. computation or the polynomial
    basis above). The tracked object of part A is the S-label pi_4, the
    projection E -> E/C = S = Z/4, together with its reduction pi_2. Part B
    introduces NO new tracked object: it is an accounting identity (I1) for
    the factor-base size that the label already carries, and an audit.

    OPERATION SETS AND TRICHOTOMY (IDEA-20260806-c5d183's classes, used as a
    vocabulary only; nothing here depends on that record). Under
    Sigma = full translation by E, pi_4 is a block system of a regular
    action (the cosets of C); it propagates deterministically because it is
    a homomorphism. Restricted to targets it is constant, so on the target
    subgroup it carries nothing; on legs it is a Class I partial-action
    object under Sigma = translation by factor-base elements, the operation
    set index calculus actually uses. Under Frobenius sigma the label is
    invariant (L2: sigma fixes S pointwise and preserves C), and under
    negation it is negated, so on <sigma, -1> classes (the rho classes of
    Bailey et al.) the label is defined modulo sign. The coordinate-level
    question of part B (which x in V are kept) is Class III,
    coordinate-dependent: the level-1 bit is the linear functional Tr
    restricted to V, so a coordinate choice of V decides it outright; the
    level-2 bit is not affine in x and no subspace choice decides it.

    LOSSY-PROJECTION TEST, AGAINST THE NAMED SIGMA (translation by
    factor-base elements). pi_4 discards everything but the S-component
    (fibres of size r); the discard is Sigma-compatible because
    pi_4(P + Q) = pi_4(P) + pi_4(Q); it is genuinely lossy and not a change
    of coordinates. It passes, and its whole content is two bits. The
    multiset count M_0(D) is a function of D's label histogram only; it
    propagates under Sigma because labels add. It is not a new object: it
    is the same homomorphism read as a size. This record says so rather than
    presenting part B as a new mechanism.

    WHY THE COFACTOR IS A SIZE PARAMETER. By I1 the mean yield over targets
    is the label-sum-zero count over r, so a base's cofactor content enters
    the cost only through (|D|, M_0(D)), the V-dimension needed to realise
    |D|, and the oracle cost at that dimension. Filtering a nonlinear label
    bit trades a factor 2 in effective ambient against one V-dimension; a
    linear label bit (Tr, when V can be taken inside ker Tr) costs no
    dimension because the filtered base is itself a subspace base. Nothing
    else about the cofactor enters, which is the content of "factor-base
    size, not a cofactor lever" (the review README of
    analysis/binstd-idea-review-20260926, section 3, row e3048d, the finding
    this revision answers).

    DERIVATIONS (each re-derived here, each a proof obligation below).
    L1: -(x, y) = (x, x + y), so a point of order 2 has x = 0; x = 0 forces
    y^2 = b, whose unique root b^{1/2} = b^{2^{n-1}} lies in F_{2^n}. A finite
    abelian 2-group with exactly one element of order 2 is cyclic (a product
    of k nontrivial cyclic 2-groups has 2^k - 1 elements of order 2).
    L2: enumerating x, y in F_2 on y^2 + xy = x^3 + 1 gives the four points
    listed; the tangent slope at (x, y) is x + y/x, so at (1, 0) it is 1 and
    x(2 G1) = slope^2 + slope + a = 0, so 2 G1 = T and G1 has order 4. E(F_2)
    is a subgroup of order 4 of E(F_{2^131}), whose 2-part is 4 (r odd), so
    it is the 2-Sylow subgroup. Points with coordinates in F_2 are fixed by
    squaring, so sigma fixes S pointwise.
    L3: gcd(4, r) = 1, so pick integers u, v with 4u + rv = 1; for h in H,
    (rv) h is the S-component of h and (4u) h its C-component, both in H.
    S = {P : 4P = O} and C = {P : rP = O} are preserved by every
    endomorphism. Subgroups of the cyclic group of order 4r correspond to
    divisors {1, 2, 4, r, 2r, 4r}. H cap C is O or C because r is prime.
    Since r is congruent to 1 mod 4 (its last two decimal digits are 29),
    the S-component of P is [r]P.
    L4: on y^2 + xy = x^3 + a x^2 + b, x(2Q) = u^2 + b/u^2 for Q = (u, v)
    (tangent slope u + v/u; expand slope^2 + slope + a with the curve
    equation). A point P = (x, y), x != 0, has a rational half Q iff
    w^2 + x w + b = 0 has a root w = u^2 (solvable iff Tr(b/x^2) = 0) and
    the half has a rational y-coordinate (iff Tr(u + a + b/u^2) = 0, which
    equals Tr(w + b/w) + Tr(a) = Tr(x) + Tr(a), using Tr(u) = Tr(u^2)). P on
    the curve forces Tr(b/x^2) = Tr(x) + Tr(a) (divide the curve equation by
    x^2). So a rational half exists iff Tr(x) = Tr(a); a half of -P negated
    is a half of P. On ECC2K-130 the halves of P in 2E are Q and Q + T;
    both lie in 2E or neither because T lies in 2E (L2), and the two roots
    w, 1/w of w^2 + x w + 1 = 0 satisfy w + 1/w = x with Tr(x) = 0, so
    Tr(w) = Tr(1/w) and the level-2 bit Tr(w) = Tr(u) is well defined.
    Writing w = x z with z^2 + z = 1/x^2, z is the half-trace of 1/x^2
    (n odd), so Tr(w) = Tr(x H(1/x^2)) passes through an inversion and a
    product and is not an affine function of the coordinates of x; no choice
    of subspace V fixes it by linearity. Consistency check against the
    published DP rule: Bailey et al. state that Hamming weights of
    x-coordinates in the order-r subgroup are even (KN-LIT-661e97); in a
    normal basis the Hamming-weight parity of x is Tr(x) (recalled
    identity), and L4 gives Tr(x) = 0 on 2E, which contains C.
    I1: a size-m multiset sums into C iff its image under E -> E/C is 0 iff
    its label sum is 0; each such multiset has exactly one sum. KN-FIND-007's
    double count restricted to the coset C.
    C1: under H1, labels on D_u are equidistributed on Z/4, so
    |D_r| = |D_u|/4 and M_0(D_u) = binomial(|D_u| + m - 1, m)/4 to first
    order; M_0(D_r)/M_0(D_u) = 4 (1/4)^m = 4^{1-m} for |D_u| much larger
    than m. Relations needed scale with |D|; attempts per relation with
    r / M_0; linear algebra with |D|^2.
    C2: at equal |D|, M_0 for the base confined to a subgroup of index 2 in
    its previous ambient doubles (I1 with ambient halved), relations and
    linear algebra are equal, and the V-dimension needed rises by one per
    nonlinear bit and by none per linear bit. With c the oracle cost per
    attempt, the attempt-cost ratio for one nonlinear bit is
    c(l + 1)/(2 c(l)). With a free oracle the product law's attempts term
    m! N / |D|^{m-1} plus linear algebra m |D|^2 is minimised at |D|
    proportional to N^{1/(m+1)}, giving a floor proportional to
    N^{2/(m+1)}; halving N k times lowers it by 2k/(m+1) bits.

    F2 DECLARATION. F2 (factor-base decomposition) is the family. No new
    factor base, relation mechanism or oracle is proposed; KN-OPEN-020 is
    not engaged. F6 is touched only in that sigma and -1 act on the label.

