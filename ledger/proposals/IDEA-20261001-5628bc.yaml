      sqrt(pi r / (4 * 131)) = 2^60.8090 iterations (CORR-20260922-81aeab
      convention; worksheet AC-1 hand check), O(1) memory per walk plus the
      distinguished-point store (about 850 GB in Bailey et al.'s design,
      KN-LIT-661e97).
    hidden_overhead: >-
      Label computation: one trace per leg for pi_2 and one quadratic solve
      (half-trace, n odd) per leg for the level-2 bit, O(1) field operations,
      negligible against any oracle call. Nothing is hidden in an o(1).
    tradeoff_note: >-
      At fixed V the restricted convention trades 4^{m-2} more attempts for
      16 times less linear-algebra time and memory; at equal |D| there is no
      memory trade, only the g-dependent attempt-cost ratio. Both conventions
      parallelise identically across attempts.

