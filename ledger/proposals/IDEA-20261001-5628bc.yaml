  citation_note: >-
    Not re-opened and not relied on: IDEA-20260806-c5d183 and
    IDEA-20260901-863e36 (their vocabulary is used; L3 is proved directly),
    docs/object-frame-ideation.md, KN-LIT-096, IDEA-20260913-cedd2f and the
    Fong-Hankerson-Lopez-Menezes halving lemma (L4 is re-derived instead).
    No hypothesis or experiment record was read (outside the card's read
    scope); the non-duplication statement relies on the decisions that
    describe those lineages.

  assumptions:
    - >-
      #E(F_{2^131}) = 4r with r prime, as stated by the frozen source and
      recorded as validator-confirmed in CORR-20260928-4cb669; not
      re-verified here (no shell). L2 needs only that r is odd; L3 needs r
      prime.
    - >-
      The oracle cost per attempt c(l) is a function of the V-dimension for a
      fixed family of V; where it depends on V's structure (KR-IC-73db3f),
      g is defined per family and the comparison in C2 is made inside one
      family.
    - >-
      Equal-size comparisons in C2 are made at equal MEASURED |D|; the
      abscissa density of a subspace (IDEA-20260926-cafcf1's scalar) is not
      assumed to be 1/2.
    - >-
      OFF-LIMITS COMPONENTS DECLARED. F2 is the family; no new factor base;
      F6 only as the action of sigma and -1 on the label; no orbit
      representative is tracked as an attack object.

  proof_search_map:
    bottleneck: >-
      Which base convention (U, U1, R, OTHER) each of this program's
      decomposition builders uses, which decides which ambient floor each
      measured row must be read against; and, for any future convention
      choice, the sign of C2, which is decided by the oracle's cost growth g
      per V-dimension (a CERTBIN-measured quantity, not measured here).
    baseline_embedding:
      parameter_slice: >-
        (i) D inside C: I1 reduces to KN-FIND-007 in the group C verbatim.
        (ii) The unrestricted convention with labels equidistributed is
        KN-FIND-aa2efc's product law at ambient N = #E = 4r. (iii) The
        restricted convention with a free oracle is CORR-20260928-4cb669's
        subgroup ambient N = r, 4/(m+1) bits lower.
      reproduction_check: >-
        SYMBOLIC, ZERO COMPUTE. The floor scales as N^{2/(m+1)}, so N -> N/4
        lowers it by 4/(m+1) bits: 1.3333, 1.0000, 0.8000, 0.6667, 0.5714,
        0.4444 at m = 2, 3, 4, 5, 6, 8, equal to CORR-20260928-4cb669's
        values (worksheet AC-3). L3 on Z/12 = Z/4 x Z/3 and I1 on a
        hand-sized base in Z/12 (worksheet AC-5, AC-6). L2 by enumeration of
        E(F_2) (worksheet AC-4).
    observation_collision:
      observable: >-
        A builder's measured yield per attempt (or its total cost against a
        floor) at a toy Koblitz cell.
      distinct_preimage_search: >-
        Two distinct causes give the same yield excess over the N = #E
        prediction: (a) the builder uses a subgroup or level-1-confined
        convention (smaller effective ambient), and (b) the builder is
        unrestricted but its base's labels are not equidistributed (H1
        fails), concentrating label sums at 0. A third, (c), is optimisation
        at integer l against a continuous floor. Yields cannot separate (a)
        from (b); the convention is a property of code, which is why Stage 0
        reads code rather than inferring the convention from yields, and why
        (b) is routed to the label census of IDEA-20260926-ae8f0a.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The cofactor convention rewritten as a factor-base-size statement:
          mean yield over targets = M_0(D)/r (I1), so every convention is a
          point (|D|, M_0(D), dim V, c(dim V)). Encoding exact (I1);
          completeness and soundness exact (each multiset with label sum 0
          sums to exactly one target); transfer to any curve with cofactor
          group S coprime to r (labels in S, not necessarily cyclic for odd
          cofactor parts); cost loss none.
        predicted_gain: >-
          Replaces "a cofactor lever worth at most 4x" by the three exact
          ratios of C1, the threshold of C2, and the floor shift; no ECDLP
          cost moves.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (mean yield over C) fixed and vary the
          forgotten structure: U at dimension l, U1 at dimension l, R at
          dimension l + 1 from a confined V. I1 shows the yields differ only
          through M_0, and C2 shows which one is cheaper depends only on g.
        predicted_gain: Identifies g as the intrinsic invariant that ranks conventions.
    quantifier_order: >-
      L1: FOR ALL n and ALL ordinary E_ab over F_{2^n}: E_ab(F_{2^n}) has a
      unique element of order 2 and a cyclic 2-Sylow. L3: FOR ALL finite
      abelian G = S x C with gcd(|S|, |C|) = 1 and |C| prime, FOR ALL
      subgroups H: H = (H cap S) x (H cap C), and E -> E/H is injective or
      constant on C. I1: FOR ALL bases D and ALL m: sum over R in C of
      c_D(R) = M_0(D). C1, C2: FOR the stated conventions, UNDER H1, as
      expectations. Stage 0: FOR EACH builder in the enumerated set, a
      classification read from its code; no claim is made about builders
      outside the set, and no witness may be chosen per row after the fact.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On ECC2K-130 the cofactor quotients are exactly E/C = Z/4 and
        E/2E = Z/2, both constant on targets; every base's mean yield over
        targets is M_0(D)/r; under H1 the conventions differ by the ratios of
        C1 and the threshold of C2; and the builders B_1 ... B_k use
        conventions X_1 ... X_k (code pointers)." It cannot certify any
        oracle's cost, any yield at n = 131, H1 itself, or anything about
        non-homomorphic (branching) leg filters.
      nearby_object_control: >-
        (i) The abstract group Z/2 x Z/2 x Z/q (q an odd prime): its 2-part
        has three subgroups of order 2, so the quotient lattice of the 2-part
        is not a chain and L3's chain statement must FAIL there; L1 shows no
        ordinary binary curve realises it, so cyclicity is load-bearing and
        is proved, not assumed. (ii) An h = 2 curve (2-Sylow Z/2): the chain
        is E -> E/2E -> 1 and has no level-2 bit, so C1 and C2 must hold
        with k = 1 only. (iii) A base inside ker Tr on a Tr(a) = 1 curve:
        every leg has level-1 bit 1, so M_0 = 0 at odd m by I1, a known
        emptiness the identity must reproduce.
    proof_obligations:
      - claim: L1, the unique 2-torsion point and the cyclic 2-Sylow on every ordinary binary curve.
        responsibility: correctness
      - claim: L2, S = E(F_2) cyclic of order 4 on ECC2K-130, fixed pointwise by Frobenius (given #E = 4r, r odd).
        responsibility: baseline
      - claim: L3, the six subgroups, the product decomposition, and injective-or-constant on C.
        responsibility: correctness
      - claim: L4, P in 2E iff Tr(x) = Tr(a); the level-2 bit is Tr(w) and is well defined; it is not affine in x.
        responsibility: correctness
      - claim: I1, sum over R in C of c_D(R) = M_0(D), including the signed convention.
        responsibility: correctness
      - claim: C1 and C2 as expectations under H1, at fixed V and at equal measured |D|.
        responsibility: success_probability
      - claim: The g = 0, k = 2 case of C2 reproduces CORR-20260928-4cb669's 4/(m+1) shift.
        responsibility: baseline
      - claim: Stage 0 classifies only the enumerated builders and reads code, not yields.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: number of subgroups of E(F_2^131) and the orders of its quotients (structural, zero compute)
      direction: same
      minimum_effect: >-
        Exactly 6 subgroups; quotient orders {4r, 2r, r, 4, 2, 1}; the two
        quotients nontrivial on legs and constant on targets have orders 4
        and 2. Any disagreement on a toy Z/4 x Z/q group voids L3.
    - metric: 2-Sylow structure and parity of the point count of any ordinary binary toy curve (structural)
      direction: same
      minimum_effect: >-
        Always cyclic and of order at least 2 (L1); a single ordinary binary
        curve with odd order or a non-cyclic 2-part falsifies L1.
    - metric: per-builder base convention classification U, U1, R or OTHER, with code pointer and comparator floor (categorical, Stage 0)
      direction: different
      minimum_effect: >-
        Reported per builder. Prior, stated so it can be wrong: builders that
        solve Semaev systems over x in V and lift the solutions are U or U1.
        The at-risk observation is CORR-20260928-4cb669's toy Koblitz rows
        below the N = #E floor: if their producing builder is classified U
        with an unconfined V, the prior survives only with a non-convention
        explanation of those rows.
    - metric: ratio of mean yield per attempt, restricted over unrestricted base at fixed V (derived, CERTBIN-measurable)
      direction: lower
      minimum_effect: >-
        4^{1-m} under H1 (2^-2, 2^-4, 2^-6, 2^-8, 2^-10, 2^-14 at m = 2, 3, 4,
        5, 6, 8); 2^{1-m} for a level-1-confined base. Measured by CERTBIN
        if at all, not by this record.
    - metric: attempt-cost ratio, restricted over unrestricted at equal measured |D| (derived)
      direction: different
      minimum_effect: >-
        2^{k(g-1)} for k nonlinear label bits; below 1 iff g < 1, above 1
        iff g > 1. Read only against a measured g.
    - metric: free-oracle floor shift for the subgroup-restricted convention (derived, reproduction)
      direction: lower
      minimum_effect: >-
        Exactly 4/(m+1) bits at m = 2 to 8 (1.3333 to 0.4444), matching
        CORR-20260928-4cb669; a mismatch localises an error in this record's
        C2.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, a code read; the cheapest discriminator).
      Enumerate the decomposition builders whose rows this program reads
      against KN-FIND-aa2efc or CORR-20260928-4cb669 (the design card
      enumerates them from the experiment records; at minimum the CERTBIN
      cell instruments and, where its code is reachable through its bound
      artifacts, the producer of EV-ICPERF-10c5fc). For each, record: how
      targets are drawn (in C by construction, for example as 4 times a
      random point, or not); how legs are kept (all lifts of x in V, lifts
      in 2E only, lifts in C only); whether V lies inside ker Tr; the class
      U, U1, R or OTHER; the code pointer and any reason the code states;
      and the floor (ambient 4r, 2r or r) the builder's rows were compared
      against. A builder whose code is unreachable is recorded as an
      impediment, never classified by inference from its yields. Optional
      Stage 0b, arithmetic over archived artifacts with no new run: where a
      builder archived the legs of its relations, compute pi_2 by one trace
      per leg and report the fraction of legs outside 2E, to be compared with
      the fraction of the base's abscissae outside 2E; a builder classified U
      on an unconfined V whose archived legs show none outside 2E, over at
      least 40 relations from a base whose abscissae are not concentrated in
      2E, is a classification to be localised before it is used.
      STAGE 1 (zero compute, symbolic note). L1 to L4, I1, C1, C2 as
      written here, with the hand checks of the worksheet (Z/12 lattice, I1
      on a toy base, E(F_2) enumeration, the 4/(m+1) reproduction). L3 is
      consumed from the S2 lineage's Stage 0 certificate if that is archived
      when this record is designed; otherwise it is reproduced as a
      dependency and not as a separate deliverable.
      NOT DESIGNED HERE. Every measured part on ECC2K-130 or its toy
      Koblitz siblings (the label census that validates H1, the fixed-V
      yield ratio, and the measurement of g) belongs to CERTBIN (HOLD-O
      revisit note) and enters through IDEA-20260926-ae8f0a (HOLD-X11) and
      the CERTBIN theta(m) ladder (HOLD-X1). This record designs none of
      them.
      OUTCOME TABLE. E-U, E-R and E-MIX as stated in the claim. ARTIFACT:
      a builder whose code admits more than one reading is recorded as
      ambiguous with both readings, and nothing is read from it.
    controls:
      - >-
        Proves-too-much: the chain argument run on Z/2 x Z/2 x Z/q must fail
        (three subgroups of order 2), showing cyclicity is load-bearing.
      - >-
        Known-emptiness reproduction: on a Tr(a) = 1 curve with V inside
        ker Tr, I1 must give M_0 = 0 at every odd m.
      - >-
        Reproduction of CORR-20260928-4cb669's subgroup-ambient shift by C2
        at g = 0, k = 2.
      - >-
        Stage 0 is blind to yields: the classifier reads code before reading
        any row's cost, so a classification cannot be fitted to an
        observation.
    required_metrics:
      - Stage 0 table (builder, target rule, leg rule, V inside ker Tr yes or no, class, code pointer, stated reason, comparator floor)
      - Stage 0b fraction of archived legs outside 2E per builder, beside the base's abscissa fraction outside 2E, where artifacts exist
      - Stage 1 note with each lemma and each hand check
    estimated_cost:
      implementation: low
      compute: >-
        Zero for Stages 0 and 1; Stage 0b is one field trace per archived
        leg. Estimate, not a measurement.

  falsification_conditions:
    - 'An ordinary binary curve over F_{2^n} with odd order or with a non-cyclic 2-Sylow subgroup, exhibited with a verified group structure: L1 is false and part A is withdrawn.'
    - 'A point P on a toy ordinary binary curve with P in 2E and Tr(x(P)) != Tr(a), or the converse, checked by exhaustive halving: L4 is false.'
    - 'An exhaustive toy count with sum over R in C of c_D(R) != M_0(D): I1 is false and part B is withdrawn.'
    - 'C2 at g = 0, k = 2 fails to reproduce 4/(m+1) bits: an error in C2, localised before any use.'
    - >-
      A CERTBIN measurement (not this record's) of the fixed-V yield ratio
      whose interval excludes 4^{1-m} by more than a factor 2: H1 fails on
      that base family, which falsifies C1 and C2 for it and not I1.
    - >-
      Stage 0b shows no archived leg outside 2E for a builder Stage 0
      classified U on an unconfined V, over at least 40 relations from a
      base whose abscissae are not concentrated in 2E: the classification
      is wrong or the base description is, and it is localised before use.

  confounders:
    - >-
      Implicit conventions: a builder may draw targets in C and legs from
      all lifts without saying so; the target rule and the leg rule are
      recorded separately.
    - >-
      Level-1 confinement: whether V lies inside ker Tr changes the effective
      ambient by a factor 2 and must be recorded per builder.
    - >-
      Abscissa density (IDEA-20260926-cafcf1's scalar) confounds any
      comparison made by V-dimension; C2 is stated at equal measured |D|,
      and Stage 0b compares leg fractions with the base's own abscissa
      fractions, not with 1/2.
    - >-
      Signs: x(P) determines pi_4(P) only up to sign; signed decompositions
      choose labels 1 or 3 for legs outside 2E, so M_0 is counted over
      signed multisets.
    - >-
      Oracle structure: c(l) can depend on V's structure (KR-IC-73db3f), so
      g is defined per family of V.

  interpretation_limits:
    - >-
      No attack, no cost movement, no security statement about ECC2K-130.
      Part A is a structural statement about one group; part B is an
      accounting identity plus an audit of conventions.
    - >-
      Constant factors only: at h = 4 the fixed-V ratios are at most
      4^{m-1} in yield and 16 in linear algebra, and the free-oracle floor
      shift is below 1.34 bits for every m >= 2; nothing here is
      exponent-moving or target-class under docs/target-result-profile.md
      C1-C2.
    - >-
      Stage 0 classifies only the enumerated builders and says nothing about
      unenumerated or unreachable ones.
    - >-
      This record states no per-attempt budget; any design that reads a
      convention effect at m >= 4 against a budget uses D3 of
      CORR-20260928-4cb669 (2^+11.01 at m = 4), never D1, and must first
      establish which ambient D3 was computed in, which the correction does
      not state.
    - No per-orbit framing is used (CORR-20260925-649e25).

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Nonlinear-label equidistribution on subspace bases.) For an
        F_2-subspace V of dimension l at n in {17, ..., 41} or n = 131, and
        D = x^{-1}(V) taken up to sign, (a) the level-1 classes of D have
        sizes fixed exactly by Tr restricted to V and by the abscissa
        condition (no heuristic beyond the abscissa count itself), and (b)
        conditional on lying in 2E, the level-2 bit of a point of D is 0 for
        a fraction 1/2 + o(1) of D, independently across points, so that
        M_0(D) equals its value under uniform labels on the attainable label
        set up to a factor 1 + o(1).
      rigorous_support: >-
        Rigorous ingredient: pi_4 is a surjective homomorphism, so on all of
        E each label class has exactly r points; the level-1 bit is the
        affine functional Tr(x) + Tr(a) (L4), so its balance on V as a set of
        x is exact. For the level-2 bit, Tr(w) with w a root of
        w^2 + x w + 1 = 0 passes through an inversion and is not affine in
        the coordinates of x, and no bound on its bias over a subspace is
        cited; the Weil-type character-sum bounds that would control such
        sums are vacuous at l <= n/2 + 1 (IDEA-20260926-cafcf1 (B)), which
        covers every index-calculus dimension at n = 131. Classical
        statement imitated: a nonlinear Boolean function restricted to a
        large affine subspace is balanced up to o(1), as for a uniformly
        random function.
      validation_plan: >-
        Owned by CERTBIN, not designed here (HOLD-O revisit note). Route:
        SAMPLE x uniformly from V at the deployed n = 131 for each
        index-calculus dimension (l about 33 at m = 4, about 44 at m = 3),
        keep abscissae (one trace test), and compute the level-2 bit (one
        quadratic solve, O(1) field operations), 10^6 samples per V; and on
        the RC-1 toy cell label all of V exactly (IDEA-20260926-ae8f0a's
        census). COMPARE the level-2 fraction with 1/2 by a binomial
        interval. TAIL: the largest deviation over the 2^4 cosets of a
        codimension-4 subspace of V. TRANSFER: none is needed at n = 131,
        where sampling is direct; the toy census transfers nothing to
        n = 131 and is a check of the instrument.

  heuristic_note: >-
    L1 to L4 and I1 are unconditional. H1 enters only C1 and C2, which this
    record states as expectations and does not measure; Stage 0 does not
    depend on H1.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED. The only cost statements are constant factors
      inside the index-calculus family: at h = 4 and fixed V, attempts in
      ratio 4^{m-2} and linear algebra 1/16 between conventions; at equal
      |D|, attempt cost in ratio 2^{k(g-1)}; with a free oracle, floors
      lower by 4/(m+1) bits under full restriction.
    memory_exponent: >-
