idea:
  id: IDEA-20260808-56e892
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-RSA-afe33c
  goal_id: GOAL-RSA-001
  title: 'Charging memory moves RSA and ECC by different amounts, so cross-primitive parameter
    equivalences are convention-dependent in a computable direction: at the program''s own
    theta = 1/3 the charged NFS exponent rises 1.38 per cent — about 92 bits of RSA modulus
    at the 3072 level — while Pollard rho moves by exactly zero, and the deliverable is the
    theta-stability classification saying which comparisons this program may quote without
    declaring a convention'
  class: composition
  claim: 'SCOPE: cross-primitive equivalences under a declared charging convention. Cost model
    only. Under KN-TECH-035''s own caution every result here is defender-conservative and
    licenses no relaxation of any recommendation. CLAIM: (a) Pollard rho with vOW parallelization
    has O(1) per-processor storage, so its exponent is theta-INDEPENDENT (stated explicitly
    in both KN-TECH-035 and KN-TECH-057); (b) GNFS''s exponent depends on theta (H-RSA-68884a''s
    family, or the symmetric alternative under X1-05''s outcome O-B); therefore (c) every
    RSA-versus-ECC equivalence is a function of theta computable in closed form. DERIVED BY
    HAND at theta = 1/3 under the asymmetric family: c(1/3)/c(0) = 1.949616/1.922999 = 1.013840;
    solving c(1/3) f(b'') = c(0) f(3072) with f(b) = (b ln2)^(1/3)(ln(b ln2))^(2/3) and f(3072)
    = 12.867*3.8875 = 50.02, target 49.34, bracketed by f(2960) = 49.21 and f(3000) = 49.48,
    gives b'' about 2980 — A SHIFT OF ABOUT 92 BITS. Under the symmetric alternative the ratio
    is 1.166676 and the shift is far larger (Stage 1 output, not asserted). E1: there exists
    theta* in [0,1] at which at least one equivalence in the program''s working set inverts,
    computable in closed form. E2: the theta-STABLE equivalences are a strict subset, and
    only those may be quoted without naming theta. E3: the direction is uniform — charging
    always moves comparisons toward primitives attacked by low-memory algorithms. Given (a)
    and (b), E3 is a theorem, not an empirical finding.'
  mechanism: 'DERIVED IN-REPO; every number reproducible with a calculator. KN-TECH-057 states
    the dichotomy in one sentence: O(1) per-processor storage gives tau = O(1) and full cost
    equal to step count; a shared table of S entries pays tau = S^(1/3). Every primitive this
    program compares sits on one side of that line — RSA and finite-field DLP by NFS (charged),
    prime-field ECDLP by rho/vOW (exempt), supersingular path-finding by vOW (exempt, per
    KN-TECH-057''s own matched-baseline table), BSGS/MITM (charged). SO THE CHARGE IS NOT
    DISTRIBUTED EVENLY ACROSS THE COMPARISON, and a convention invisible in absolute terms
    is visible in relative ones. THE TABLE: for GNFS, NFS-DL, prime-field ECDLP, supersingular
    vOW and DG, BSGS/MITM, and lattice sieving (KN-TECH-044, KN-OPEN-017), record the step-count
    exponent, the shared-object size, the charged exponent as a function of theta, and the
    side of the line; then compute all pairwise crossovers. The lattice row is the most interesting,
    because KN-OPEN-017 already asks where the enumeration/sieving crossover moves under a
    full memory charge, and this table makes that one cell rather than a separate investigation.
    WHY THIS IS THE ARTEFACT BOTH GOALS ASKED FOR: GOAL-ECDSA-001 and GOAL-RSA-001 each require
    whichever runs second to bind to the other''s charging convention or record why it cannot.
    Neither has run. One declared theta with a per-primitive consequence table is that binding
    artefact.'
  why_not_a_renamed_known_approach: 'NEAREST KNOWN: standard key-size equivalence tables,
    plus KN-TECH-035''s own remark that full cost "settles exponent-level comparisons and
    identifies which side of a trade-off is being undercharged". That sentence is the seed;
    the execution — a per-primitive theta-dependence table with crossover values and a stability
    classification — is missing. KN-TECH-057 executes it inside one primitive and explicitly
    reports that the hardness exponent does NOT change there; this asks the between-primitive
    question, where the ordering can change. Against IDEA-20260805-1775f2: that treats theta
    as one free parameter WITHIN factoring; this asks what that parameter does BETWEEN primitives,
    a different deliverable (a stability classification, not a value).'
  predictions:
  - observable: equivalent RSA modulus at theta = 1/3 (asymmetric), holding charged cost equal
      to the uncharged cost of RSA-3072
    metric: bits
    predicted: 2980 DERIVED (shift about 92 bits); pass band [2940, 3020].
  - observable: shift in the ECDLP exponent under the same charge
    metric: bits of group order
    predicted: EXACTLY ZERO per KN-TECH-035 and KN-TECH-057. A nonzero value means the evaluator
      is wrong.
  - observable: number of pairwise comparisons in the working set that invert for some theta
      in [0,1]
    metric: count, plus theta* for each
    predicted: At least one, with theta* in (0, 1/2). Zero inversions across the range refutes
      E1 and is reported as such.
  - observable: direction of every shift
    metric: sign
    predicted: Uniformly toward "memory-heavy attacks cost more", hence uniformly defender-conservative.
      A shift in the other direction anywhere means the charge is mis-signed.
  minimal_test: 'STAGE 1 (zero compute): build the per-primitive table from records already
    in this corpus (KN-TECH-035, -036, -044, -057, H-RSA-68884a, KN-OPEN-017); compute each
    charged exponent as a function of theta; compute all pairwise crossovers. STAGE 2: classify
    each equivalence theta-stable or theta-unstable across [0,1] and across the narrower [0,1/2]
    the program actually contemplates; emit the mandatory-declaration list. STAGE 3: re-run
    the whole table under BOTH X1-05 branches and report how the classification changes —
    the sensitivity analysis that keeps the deliverable honest while X1-05 is unresolved.'
  controls:
  - NULL — two primitives both attacked by exempt low-memory algorithms (prime-field ECDLP
    vs supersingular path-finding under vOW) must be theta-stable exactly, by construction.
    An inversion there means the evaluator is broken.
  - POSITIVE CONTROL — BSGS versus rho at the same group order: equal step counts, n^(2/3)
      versus n^(1/2) full cost. This inversion is ALREADY ARCHIVED in KN-TECH-035, so the
      evaluator must reproduce it with a crossover at theta = 0+. Free archived-ground-truth
      calibration.
  - MONOTONICITY — every charged exponent must be non-decreasing in theta; a non-monotone
    row indicts the evaluator, not the primitive.
  - CONVENTION-SHOPPING GUARD — the theta grid is declared before any crossover is computed
    and the deliverable is the STABILITY classification, not a preferred theta. Same anti-abuse
    design as H-ECDSA-a23475's ordering statistic, adopted deliberately so the two lanes share
    it.
  confounders:
  - Uncharged anchors come from outside sources whose derivations are not in this corpus,
    so a shift measures the shift plus whatever the source assumed; every row must state its
    anchor's origin.
  - A 92-bit shift at 3072 is well inside what an uncontrolled o(1) could move, AND THIS MUST
    APPEAR IN THE SAME SENTENCE AS THE 92. The robust content is the DIRECTION and the STABILITY
    CLASSIFICATION, not the bit count.
  - Quantum cost models are absent and would reorder the table completely; it is classical-only
    and says so.
  - H-RSA-68884a is `proposed`, so every NFS row is conditional on gates that have not been
    run.
  falsification_conditions:
  - The BSGS-versus-rho positive control is not reproduced, or the low-memory null pair inverts
    — evaluator broken, no comparison reportable.
  - No pairwise comparison inverts for any theta — E1 refuted; comparisons are convention-robust
    and may be quoted without declaring theta. A clean useful negative that simplifies future
    work.
  - Any charged exponent is non-monotone in theta — evaluator wrong.
  - The derived 2980 is not reproduced within its band by an independent implementation —
    my hand arithmetic is wrong and the record is corrected by a superseding record, not edited.
  interpretation_limits: A convention-sensitivity result about COMPARISONS. It claims no parameter
    set is unsafe, recommends no key size, solves nothing, moves no exponent. Under KN-TECH-035's
    caution, step counting is conservative from the defender's side, so nothing here licenses
    reducing any parameter. The 92-bit figure is an accounting artefact at a stated theta
    under a `proposed` hypothesis; quoting it without theta, without that status and without
    the o(1) caveat is exactly the category error this record exists to prevent. Classical
    only.
  assumptions:
  - The S^theta convention on the grid {0, 1/6, 1/4, 1/3, 5/12, 1/2, 1}, matching H-RSA-68884a's
    ladder so the records are commensurable.
  - rho/vOW is exempt (KN-TECH-035, KN-TECH-057, both read).
  - H-RSA-68884a's closed forms, inheriting its `proposed` status; both its branch and X1-05's
    symmetric alternative carried in parallel.
  heuristic_assumptions:
  - id: HA-12
    statement: (Comparability of L-exponents and power exponents.) For all pairs of one subexponential
      primitive L[1/3, c] and one exponential primitive n^(1/2), the equivalence is computed
      by equating costs at a stated pair of sizes, and is meaningful despite an uncontrolled
      o(1) in one expression and an unextracted constant in the other.
    rigorous_ingredient: None, and this is the weakest item. It is exactly what every published
      key-size equivalence does; numbering it is part of the contribution rather than a defence
      of it.
    distribution_imitated: none
    validation_route: Report every equivalence TWICE — once with the o(1) set to zero and
      once with it set to the value X1-06's residual measures over the record gap. The spread
      IS the honest error bar and is obtainable only because X1-06 exists. If the spread exceeds
      the shift being reported, the shift is reported as unresolvable rather than as a number.
      THIS MAKES X1-06 A PREREQUISITE, NOT A PARALLEL TRACK.
    tail_checks: Check the equivalence at 1024, 2048 and 3072 and confirm the shift grows
      smoothly; a jump indicates unstable root-finding, not changed cryptography.
  target_complexity:
    time_exponent: 'NO EXPONENT OF ANY HARD PROBLEM MOVES. Rows: GNFS L[1/3, c(theta)] with
      c(0) = 1.922999, c(1/3) = 1.949616 (asymmetric) or 2.243510 (symmetric); prime-field
      ECDLP n^(1/2) for all theta; BSGS n^(1/2 + theta/2); supersingular vOW p^(1/2) for all
      theta; DG p^(1/4) charged to p^(1/4 + theta/12) per KN-TECH-057''s own derivation.'
    memory_exponent: 'Per row beside the time exponent: GNFS beta(theta) (0.961500 at theta
      = 0, 0.835550 at 1/3 asymmetric); rho/vOW O(1) per processor; BSGS n^(1/2); DG p^(1/4).
      A row quoted without its memory exponent is inadmissible.'
    best_known_baseline: The uncharged equivalences the program currently inherits. This does
      not beat them; it prices the convention they were computed under.
    hidden_overhead_disclosure: NFS's uncontrolled o(1) (only X1-06 can bound it); the superpolynomial
      early-abort ECM factor named in X1-07 which lives inside it; the wiring model's unextracted
      constants; H-RSA-68884a's unrun gates. THE 92-BIT FIGURE IS SMALLER THAN SEVERAL OF
      THESE AND THE RECORD SAYS SO PROMINENTLY, NOT IN A FOOTNOTE.
    time_memory_tradeoff: The table IS the cross-primitive tradeoff statement. The lattice
      row makes KN-OPEN-017's enumeration/sieving crossover question one cell rather than
      a separate investigation.
  sota_delta: 'Zero on attack cost. Quantitatively: a 92-bit shift in the RSA-vs-ECC equivalence
    at 3072 at theta = 1/3 (asymmetric branch, DERIVED), substantially larger under the symmetric
    branch, against exactly zero on the ECC side — plus a stability classification telling
    the program which comparisons it may quote without declaring a convention.'
  dominated_by: 'CHECKED against every in-corpus row that could dominate: KN-TECH-035 (states
    the principle, executes no cross-primitive table), KN-TECH-057 (executes it within isogenies
    and reports the complementary finding that full cost changes the baseline without changing
    the hardness exponent), KN-TECH-036, KN-TECH-044 (nearest for the lattice row, no cross-primitive
    comparison), H-RSA-68884a and IDEA-20260805-1775f2 (within factoring), KN-OPEN-017 (asks
    the lattice sub-question, unanswered). Not dominated in-corpus. EXTERNALLY UNCHECKED (web
    unavailable); published memory-charged key-size comparison work would dominate and is
    the named prior-art risk.'
  estimated_cost: Implementation low (a table plus one root-find per equivalence; exact rationals
    for exponent algebra, floating point only for final bit counts with stated precision).
    Compute negligible. An afternoon.
  recommended_priority: medium
  honest_prior_of_survival: 0.7 that E3 and the zero-shift-for-ECC prediction hold (close
    to theorems given the two technique records). 0.45 that E1 holds with theta* inside (0,1/2)
    on the program's actual working set. 0.5 that the 2980 figure survives independent recomputation
    within its band — my hand arithmetic on f(b) is the fragile part and is flagged rather
    than presented as checked.
  novelty_status: screened
  novelty_screen: SCREENED against KN-TECH-035 and KN-TECH-057 (full), H-RSA-68884a (full),
    the six /tmp/ideas-ctx/*.txt files (KN-TECH-036/040/044/052/057 and KN-OPEN-017 inspected
    in the index), and my own X1.yaml. No in-corpus record computes cross-primitive theta
    crossovers. `screened` for in-corpus scope only.
  discriminated_from: 'KN-TECH-057: applies the charge inside one primitive and explicitly
    reports the hardness exponent unchanged; this is about comparisons BETWEEN primitives
    where the theta-dependence differs by row and the ordering can change. IDEA-20260805-1775f2:
    one free parameter within factoring, no cross-primitive content. X1-03 (in X1.yaml): instantiates
    the same theta on the ECDSA leakage attack; complementary, and both must use one theta
    or the program has two conventions.'
  source_refs:
  - knowledge/techniques/KN-TECH-035.md
  - knowledge/techniques/KN-TECH-057.md
  - ledger/hypotheses/H-RSA-68884a.yaml
  - ledger/questions/RQ-RSA-afe33c.yaml
  - ledger/goals/GOAL-RSA-001.yaml
  - ledger/goals/GOAL-ECDSA-001.yaml
  proof_search_map:
    bottleneck: The differential theta-dependence between charged and exempt primitives. If
      every primitive were on the same side of KN-TECH-057's line, theta would rescale everything
      equally and no comparison would move.
    baseline_embedding:
      parameter_slice: 'theta = 0: every charged exponent equals its step count, the table
        reduces to the standard uncharged comparison, and every equivalence returns its inherited
        value.'
      reproduction_check: 'Symbolic (S^0 = 1). Fixture: at theta = 0 the table must return
        c = (64/9)^(1/3), ECDLP n^(1/2), BSGS n^(1/2), DG p^(1/4), each matching its in-corpus
        record exactly.'
    observation_collision:
      observable: the equivalent-modulus bit count.
      distinct_preimage_search: 'COLLISION EXHIBITED: a shift can be produced either by charging
        memory or by changing the assumed o(1), and the two are indistinguishable in the observable.
        SEPARATING CONDITION: a memory charge moves only the charged rows, while an o(1) change
        moves the NFS row in a way that also perturbs X1-06''s measured ratios. X1-06''s residual
        is therefore the separator, and this record cannot be interpreted without it — stated
        as a dependency rather than discovered later.'
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: Track theta-STABILITY of each comparison rather than its value at any
        theta; stability survives every monotone rescaling of the charge.
      predicted_gain: A statement that cannot be manufactured by choosing a convention.
    - transform: observable_fiber
      proposed_object: Hold the equivalence fixed and vary theta; the intrinsic invariant
        is theta*, defined exactly for pairs that can invert.
      predicted_gain: Turns "the comparison might depend on the convention" into one number
        per pair, or an explicit "cannot invert".
    quantifier_order: THERE EXISTS one theta grid and one per-primitive charging rule, both
      fixed before any crossover is computed, SUCH THAT FOR ALL pairs in the working set the
      stability verdict is well defined. The rule may not be chosen per pair. The weaker order
      — for all pairs there exists a charge that inverts them — is trivially satisfiable,
      is the obvious abuse of this method, and is explicitly not claimed.
    method_ceiling:
      strongest_certifiable_claim: At most that under a declared convention and a declared
        set of in-corpus exponent rows, certain equivalences do or do not invert, with crossover
        values. Cannot certify absolute costs, key sizes, or the o(1); cannot speak to quantum
        adversaries; cannot be quoted as a security recommendation in either direction.
      nearby_object_control: 'NO INVERSION MAY OCCUR: two exempt primitives (prime-field ECDLP
        vs supersingular vOW). ONE MUST OCCUR: BSGS vs rho, already archived in KN-TECH-035.
        A machinery that cannot separate these two pairs has not identified the load-bearing
        structure.'
    proof_obligations:
    - claim: At theta = 0 every row reproduces its in-corpus uncharged exponent.
      responsibility: baseline
    - claim: rho/vOW is exempt and exactly theta-independent.
      responsibility: correctness
    - claim: Every charged exponent is non-decreasing in theta.
      responsibility: strictness
    - claim: The equivalent-modulus computation is reproducible within the declared band.
      responsibility: size
    - claim: Every quoted equivalence carries theta, the memory exponent and the o(1) caveat.
      responsibility: memory
    - claim: No sentence recommends or relaxes any parameter.
      responsibility: scope
    not_applicable_reason: null
