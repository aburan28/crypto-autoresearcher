    provenance: internal
    verified_by: coordinator, this session (2026-10-09), read the row/entry on disk
    claim: The canonical prime-to-p torsion lift exists and is closed for every group-theoretic invariant; the formal
      logarithm route degenerates to O = mO.
  predictions:
  - metric: agreement of v_p(q-1) with the proxy rule
    direction: different
    minimum_effect: agreement 1.0
  minimal_test:
    design: p-adic computation of the Frobenius lift on the canonical and perturbed models (Satoh-style iteration)
      at precision 8
    required_metrics:
    - agreement of v_p(q-1) with the proxy rule
  falsification_conditions:
