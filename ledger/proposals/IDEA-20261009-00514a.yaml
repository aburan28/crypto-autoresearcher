    the coordinator under the standing authorization.
  title: Compute the Serre-Tate parameter q(E^) directly and compare with the j-distance rule
  class: measurement
  claim: For the lifts of EXP-CZLIFT-17b7eb, v_p(q(E^) - 1) computed from the unit-root splitting (Katz) equals
    v_p(j(E^) - j_can)/e for v_p(j-distance) < 2e and the degeneracy of Smart's attack is exactly v_p(q - 1) >=
    2.
  mechanism: EXP-CZLIFT-17b7eb tested the rule through the j-distance proxy on 14616 samples with no disagreement;
    computing q itself would make the splitting criterion the measured quantity rather than its proxy.
  novelty_status: speculative
