idea:
  id: IDEA-20260811-626f00
  question_id: RQ-MSI-f760b2
  added: '2026-08-11'
  title: >-
    THE MSI WORKBENCH, WITH A DECISION-RELEVANT FAILURE MODE BUILT IN: an
    explicit modular-symbol and truncated-period encoder at toy N, l and m, in
    two arms -- a SURROGATE arm that runs the whole pipeline on a
    Hecke-equivariant integral pairing matrix that is available today, and an
    ACTUAL arm that implements the paper's map once its body is read -- whose
    headline metric is not throughput but ENCODER COST AGAINST ATTACK COST, since
    an encoding that costs more to compute than to invert cannot support any
    construction, and whose honest negative outcome is "MSI is not currently a
    specifiable computational problem", which blocks decision-target state (C)
    without any attack at all
  class: tooling

  claim: >-
    (A) WHAT THIS BUILDS AND WHY NOTHING ELSE IN THE PORTFOLIO RUNS WITHOUT IT.
    IDEA-20260811-4a55dd, IDEA-20260811-531f0b and IDEA-20260811-0f89a9 all
    presuppose the ability to (i) construct M = H_1(X_0(N), C, Z) with an
    integral basis and the Manin symbol presentation, (ii) construct the Hecke
    matrices T_q on M, (iii) construct a basis of S_2(Gamma_0(N)), (iv) evaluate
    the truncated l-adic period map on any class to precision l^m, and (v)
    generate O-oriented supersingular instances over F_{p^2} and apply the
    attaching map to them. Items (i) to (iii) are standard and available in
    existing modular-symbols software. ITEMS (iv) AND (v) ARE THE ENTIRE
    DIFFICULTY AND BOTH DEPEND ON THE PAPER BODY, WHICH THIS SESSION COULD NOT
    READ.

    (B) THE TWO-ARM DESIGN, AND WHY THE SURROGATE ARM IS NOT A CHEAT. It would be
    dishonest to claim measurements of "the MSI map" from a substitute. It would
    be equally wasteful to leave the entire portfolio blocked on one PDF. The
    resolution is an explicit two-arm build with a hard labelling rule:
      SURROGATE ARM. Take any Hecke-equivariant integral pairing
      P : M -> Z^d whose construction is fully specified in the run record -- the
      natural candidate being the integral pairing of modular symbols against an
      integral basis of the Hecke module, reduced mod l^m -- and run every
      downstream measurement on it. EVERY NUMBER FROM THIS ARM IS LABELLED
      `surrogate` AND MAY NEVER BE REPORTED AS A MEASUREMENT OF MSI. What the
      arm legitimately measures is THE LATTICE GEOMETRY OF HECKE MODULES AT
      LEVEL N -- the deviation of ker(P mod l^m) from a random q-ary lattice of
      matched determinant, the elementary-divisor structure, the eigencomponent
      splitting and the congruence numbers. Those are facts about X_0(N), not
      about the paper, and they are exactly the inputs
      IDEA-20260811-0f89a9 needs.
      ACTUAL ARM. Implement the paper's map after Stage 0. Every number labelled
      `actual`. The FIRST thing the actual arm does is re-run the surrogate arm's
      measurements and report the difference; if the two agree, the surrogate was
      a good calibration and the record says so with numbers; if they disagree,
      the disagreement localises what the paper's l-adic normalisation does that
      the naive integral pairing does not, which is worth more than either arm
      alone.

    (C) THE HEADLINE METRIC, WHICH IS NOT THROUGHPUT. ENCODER COST AGAINST ATTACK
    COST. Measure T_enc(N, l, m) = wall clock to evaluate the truncated period
    map on one class, and T_att(N, l, m, S) = wall clock of the best attack in
    the portfolio on the resulting instance. Report the ratio. THE REASON THIS
    IS THE HEADLINE: a one-way function must be cheap forward and expensive
    backward, and l-adic Coleman integration to precision l^m is a
    high-precision analytic computation whose cost grows with m while, by
    IDEA-20260811-4a55dd's geometry, the ATTACK gets EASIER as m grows. IF BOTH
    ARE TRUE THEN THE ENCODER AND THE ATTACKER ARE PUSHED IN THE SAME DIRECTION
    BY m AND THE CONSTRUCTION HAS NO GOOD OPERATING POINT. That would be a
    complete, cheap, and entirely non-obvious verdict on MSI's usability,
    obtainable before any hardness question is settled, and no other record in
    this portfolio measures it.

    (D) THE HONEST NEGATIVE OUTCOME, WHICH IS DECISION-RELEVANT AND IS NOT A
    FATIGUE REPORT. If, after reading the body, the attaching map or the period
    map cannot be implemented -- because a definition is non-effective, because
    the Coleman precision required for well-definedness is not stated, because
    the instance generator requires data the paper does not say how to compute,
    or because the shortness measure is not pinned down -- THEN MSI IS NOT YET A
    SPECIFIED COMPUTATIONAL PROBLEM, and decision-target state (C) ("MSI is a
    distinct assumption worth analysing") CANNOT BE REACHED, because there is
    nothing definite to analyse. This is a closure at the docs/inventor-protocol
    section 4 standard only if it names the specific missing definition, gives
    the argument that it is missing rather than merely unread, and says what
    would supply it -- and the record commits in advance to meeting that standard
    or to reporting `unverified` instead.

    (E) THE INSTANCE GENERATOR IS THE HARD PART AND IS SPECIFIED SEPARATELY.
    Generating O-oriented supersingular curves over F_{p^2} at toy p is standard
    in outline -- pick p and a small imaginary quadratic order O with disc
    satisfying the embedding condition, construct a supersingular curve with an
    O-orientation via CM by O reduced mod p, then walk the Cl(O)-action -- but
    every step must be verified rather than assumed: the orientation must be
    checked primitive, the walk must be checked to preserve it, and the
    enumerated set size must equal h(O) exactly. THAT LAST EQUALITY IS A FREE,
    EXACT, TOTAL CORRECTNESS CHECK ON THE ENTIRE GENERATOR and the workbench must
    refuse to emit instances until it passes.

  mechanism: >-
    STAGE 0 (ZERO COMPUTE, HARD GATE, NOT PERFORMED IN THIS SESSION): read
    arXiv:2603.29789 in full and produce a written implementation specification
    covering the attaching map, the shortness measure and its norm, the l-adic
    period definition and its normalisation, the required Coleman precision as a
    function of m, and d. If any of these cannot be extracted, that is
    outcome (D) and it is recorded with the specific missing item named.

    STAGE 1 (MODULAR SYMBOLS CORE, low risk): construct M at N in {11, 14, 15,
    17, 19, 23, 37, 43, 67, 89, 101}, with the Manin presentation, an integral
    basis, the boundary map to the cusps, and T_q for q up to 50. VERIFICATION,
    ALL EXACT AND ALL FREE: rank(M) must equal 2g + c - 1 with g and c computed
    independently from the standard genus and cusp-count formulas; the
    characteristic polynomial of T_q on the cuspidal part must factor according
    to the newform decomposition; and the Eichler-Shimura relation must hold on
    T_p where applicable. A failure at this stage is an implementation bug and
    the workbench must not proceed.

    STAGE 2 (SURROGATE ENCODER): build the integral Hecke pairing matrix, reduce
    mod l^m, and expose the same interface the actual encoder will expose.
    Measure and record for every (N, l, m): the matrix, its rank mod l, its
    elementary divisors, det of the kernel lattice, the Gaussian prediction, the
    exact lambda_1 where n <= 40, the eigencomponent decomposition, the
    congruence numbers, and the wall clock. THESE ARE FACTS ABOUT X_0(N) AND ARE
    THE PERMANENT DELIVERABLE OF THIS RECORD EVEN IF THE ACTUAL ARM NEVER RUNS.

    STAGE 3 (INSTANCE GENERATOR): as in claim (E), with the equality between the
    enumerated set size and h(O) as a blocking gate, plus the wrong-order and
    inert-l negative controls of IDEA-20260811-55932a. Record p, O, disc, h(O),
    the base curve, and the class of every emitted instance.

    STAGE 4 (ACTUAL ENCODER, conditional on Stage 0): implement the paper's map;
    re-run every Stage 2 measurement; report the surrogate-to-actual difference
    per cell as the calibration result.

    STAGE 5 (COST SURFACE): T_enc and T_att over the grid, and the ratio surface
    of claim (C), with the operating-point analysis.

    STAGE 6 (FREEZE AND PUBLISH THE CORPUS): emit a frozen, seeded toy corpus --
    instances, encodings, matrices, null objects, and a matched random-lattice
    and random-encoder generator -- so that every downstream record measures the
    same objects. REBUILD EVERY ARTIFACT FROM SCRATCH BEFORE DECLARING IT
    AVAILABLE, per docs/inventor-protocol.md section 6 step 4; an unrebuilt
    reproducibility pointer is treated as a lie.

  novelty_status: known

  novelty_screen:
    method: >-
      Corpus screen as in IDEA-20260811-4a55dd. Modular symbols computation was
      checked against knowledge/ and ledger/ for any existing implementation or
      technique record.
    results: >-
      No implementation, technique record or run record in this repository
      touches modular symbols, Hecke matrices at level N, or l-adic periods. The
      ALGORITHMS involved -- Manin symbols, the 2-term and 3-term relations,
      Hecke matrices via Heilbronn or modular-symbol action, newform
      decomposition -- are entirely classical and are implemented in existing
      open-source computer algebra systems.
    verdict: >-
      KNOWN, and deliberately so. NOTHING IN STAGES 1 TO 3 IS NEW MATHEMATICS AND
      NONE IS CLAIMED. What is new to this program is the ASSEMBLY, the two-arm
      labelling discipline, the encoder-cost-against-attack-cost metric of claim
      (C), and the pre-registered specifiability failure mode of claim (D). A
      tooling record that claimed novelty would be overclaiming and this one does
      not.

  object_first_candidate:
    tracked_object: >-
      NONE. This record introduces no tracked object and proposes no attack
      family; it builds the instrument that lets other records track theirs.
      Recorded explicitly rather than left blank, per
      docs/inventor-protocol.md section 5.
    lossiness: >-
      Not applicable. The lossy-projection test applies to the objects the
      workbench measures, and is answered in the records that own them --
      IDEA-20260811-4a55dd for the period residue, IDEA-20260811-0f89a9 for the
      eigencomponent projection.
    propagation: not_applicable
    survival_score: not_applicable

  null_object_control: >-
    THE WORKBENCH DOES NOT MERELY SUPPORT NULLS, IT SHIPS THEM AS FIRST-CLASS
    OUTPUTS, because a null generated ad hoc by each downstream record would not
    be comparable across records.
    NULL GENERATOR 1: random q-ary lattices at matched rank and determinant.
    NULL GENERATOR 2: random linear encoders at matched shape.
    NULL GENERATOR 3: random unstructured encoders, for the pure birthday
    reference.
    NULL GENERATOR 4: a deliberately NON-ADDITIVE encoder, which
    IDEA-20260811-4a55dd requires as its blocking control.
    NULL GENERATOR 5: random Hecke-shaped integer matrices with matched sparsity
    and row sums, which IDEA-20260811-55932a requires.
    SELF-TEST: the workbench must demonstrate, on a frozen seed, that its own
    downstream pipeline SUCCEEDS on a planted instance and FAILS on each null,
    before any research measurement is accepted from it. A workbench that has not
    passed its own two-directional self-test emits no numbers.

  discriminated_from:
    - >-
      H-MOD-e9d87e. NOT CAUGHT: this record builds no fibre of X_1(N), computes
      no diamond operator, and handles no rational ECDLP instance. Its objects
      are H_1(X_0(N), cusps; Z), the Hecke algebra, and O-oriented supersingular
      curves over F_{p^2}. The one point of contact worth naming is that
      H-MOD-e9d87e's own test boundary calls for constructing X_1(N)(F_p) and
      X_0(N)(F_p) as finite sets at N in {5, 7, 11, 13}; IF that code exists or
      is written, the modular-curve plumbing may be shareable, and this record
      flags the opportunity rather than duplicating it.
    - >-
      DEC-20260810-2c7e3c. NOT THAT LANE: no point is lifted, no canonical height
      is computed, no Mordell-Weil group appears, and the p-adic machinery here
      integrates a weight-2 form on the modular curve rather than evaluating a
      height on a lifted ECDLP point. Stated because the decision requires it.
      Note also the practical inheritance: DEC-20260810-2c7e3c's limitations
      record that its own lane's cheap Stage 0 and Stage 1 checks were never run,
      which is exactly the failure this record's blocking self-test is designed
      to prevent.
    - >-
      KN-TECH-3b593f: no prime-field ECDLP route, no Smith subgroup, no Kani
      embedding, no torsion advice.
    - >-
      Existing computer algebra systems. This record does not propose
      reimplementing modular symbols from scratch where a verified implementation
      exists; it proposes the assembly, the verification gates, the instance
      generator, the null generators, and the cost surface. The build plan must
      state which components are taken from an existing library and which are
      written here, because the two carry different error risks.

  assumptions:
    - >-
      A verified modular-symbols implementation is available in the execution
      environment, or Stage 1 must be written and verified against the exact
      rank, characteristic-polynomial and Eichler-Shimura checks listed there.
    - >-
      The paper's definitions are effective. NOT VERIFIED; claim (D) is the
      branch where they are not.
    - >-
      Toy p can be chosen so that a small O embeds and h(O) is enumerable
      (h(O) <= 200). Standard, and checked by the enumerated-set-size gate rather
      than assumed.
    - >-
      The required Coleman precision as a function of m is stated or derivable
      from the paper. NOT VERIFIED, and it is the single most likely place for
      the actual arm to become expensive without anyone noticing -- which is why
      claim (C) measures it rather than estimating it.

  proof_search_map:
    bottleneck: >-
      THE PAPER'S DEFINITIONS OF THE ATTACHING MAP AND THE l-ADIC PERIOD. Every
      other component of the workbench is classical and low-risk. The record's
      whole schedule is arranged so that the two-arm split absorbs this
      bottleneck rather than being blocked by it.
    baseline_embedding:
      parameter_slice: >-
        N = 11, l = 5, m = 1. X_0(11) has genus 1, two cusps, so d = 1 and
        n = 3, the smallest non-degenerate cell; and l = 5 is the Eisenstein
        prime for N = 11 (the numerator of (11 - 1)/12 is 5), so this cell is
        also IDEA-20260811-0f89a9's smallest congruence test. Everything in the
        workbench must be verifiable by hand at this cell.
      reproduction_check: >-
        Frozen fixture at N = 11: the rank of M equals 3; the cuspidal Hecke
        eigenvalues match the known newform of level 11; the mod-5 eigenvalue
        congruence a_q = q + 1 holds or is recorded as failing; and every one of
        these is checked by exact integer comparison against values computed by
        an independent route. HAND-CHECKABILITY IS THE POINT: a workbench whose
        smallest cell cannot be verified by a human is not a workbench.
    observation_collision:
      observable: >-
        The workbench's own emitted artifacts -- matrices, instances, encodings,
        and timings.
      distinct_preimage_search: >-
        The relevant collision for an instrument is TWO DIFFERENT PIPELINE
        CONFIGURATIONS PRODUCING IDENTICAL OUTPUT, which would mean a
        configuration flag is not wired through. The workbench must therefore
        emit a configuration hash with every artifact and assert that distinct
        configurations produce distinct hashes AND distinct outputs. A silent
        collision here would make every downstream comparison meaningless and is
        the instrument-specific failure this audit exists to catch.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "the MSI encoder" by "a Hecke-equivariant integral pairing
          reduced mod l^m" for measurement purposes only. ENCODING: the pairing
          matrix. COMPLETENESS: none claimed -- the surrogate is not asserted to
          equal the paper's map. SOUNDNESS: none claimed. TRANSFER: EXPLICITLY
          NOT CLAIMED, which is why every surrogate number carries a label.
          COST LOSS: unmeasured until the actual arm runs, and reported as the
          surrogate-to-actual difference at that point.
        predicted_gain: >-
          Unblocks the portfolio, and yields a permanent, paper-independent
          dataset on the lattice geometry of Hecke modules at level N.
    quantifier_order: >-
      THE INSTRUMENT CLAIM: FOR ALL cells in the declared grid, THERE EXISTS a
      reproducible artifact set such that FOR ALL downstream records the same
      artifacts are consumed. THE TRAP, NAMED: allowing the artifact to depend on
      the consuming record would let each record tune its own instance
      distribution, and any cross-record comparison would then be void. The
      corpus is therefore frozen once and versioned, never regenerated per
      consumer.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "these artifacts were produced by this specified pipeline, the
        listed exact verification gates passed, the self-test succeeded on
        planted instances and failed on all five nulls, and the measured costs
        are these." AN INSTRUMENT CERTIFIES NOTHING MATHEMATICAL. In particular
        the surrogate arm certifies nothing about MSI at all, and no combination
        of workbench outputs can establish hardness.
      nearby_object_control: >-
        The nearby object where the workbench's conclusions must fail is a level
        N at which the intended structure is absent -- N = 1 to 10, where
        X_0(N) has genus 0, S_2 is zero-dimensional, and d = 0. The workbench
        must report an empty encoding there rather than a degenerate one. A
        pipeline that emits a nonzero period vector at genus 0 is fabricating,
        and this check costs one line.
    proof_obligations:
      - claim: rank(M) equals 2g + c - 1 at every tested N.
        responsibility: correctness
      - claim: Hecke characteristic polynomials factor per the newform decomposition.
        responsibility: correctness
      - claim: the enumerated oriented set has size exactly h(O).
        responsibility: correctness
      - claim: the self-test succeeds on planted instances and fails on all five nulls.
        responsibility: interface
      - claim: surrogate and actual numbers are never mixed in a single report.
        responsibility: scope
      - claim: T_enc and T_att are measured under one stated cost model.
        responsibility: runtime
      - claim: every artifact rebuilds from scratch.
        responsibility: interface
    not_applicable_reason: null

  predictions:
    - metric: >-
        exact verification gates at Stage 1 -- rank, Hecke factorisation,
        Eichler-Shimura
      direction: different
      minimum_effect: >-
        FORCED: all pass, zero exceptions, at every tested N. A single failure is
        an implementation bug and blocks the workbench; no downstream number may
        be reported until it is fixed.
    - metric: >-
        size of the enumerated O-oriented set, against h(O)
      direction: different
      minimum_effect: >-
        FORCED EQUALITY. A deficit means the generator misses instances; an
        excess means it emits invalid ones. Either blocks Stage 3.
    - metric: >-
        encoder wall clock T_enc as a function of m, at fixed (N, l)
      direction: higher
      minimum_effect: >-
        Predicted to GROW with m -- at least linearly, plausibly worse if the
        required Coleman precision grows superlinearly. The exact growth exponent
        is the measurement and it has never been recorded for this map.
    - metric: >-
        the ratio T_att / T_enc as a function of m
      direction: lower
      minimum_effect: >-
        PREDICTED TO FALL WITH m -- attack easier, encoder more expensive -- and
        if it falls below 1 anywhere in the grid, the encoding is cheaper to
        invert than to compute at those parameters and MSI cannot support a
        construction there. THAT CROSSING, IF IT EXISTS, IS THE RECORD'S MOST
        VALUABLE SINGLE OUTPUT. A ratio that RISES with m refutes the joint
        prediction and means the encoder's cost model is not what claim (C)
        assumes, which is equally worth knowing.
    - metric: >-
        surrogate-to-actual difference in kernel determinant, rank mod l,
        eigencomponent structure and congruence numbers
      direction: different
      minimum_effect: >-
        No direction predicted. Agreement validates the surrogate as a
        calibration and permits its earlier numbers to be reinterpreted;
        disagreement localises the paper's normalisation and is the more
        informative outcome.
    - metric: >-
        genus-0 control at N <= 10
      direction: lower
      minimum_effect: >-
        FORCED: empty encoding, d = 0. Any nonzero output is fabrication and
        halts everything.

  minimal_test:
    design: >-
      The minimal useful build is Stage 1 plus Stage 2 plus the self-test, at the
      single cell N = 11, l = 5, m in 1..4, hand-verifiable end to end. That
      alone delivers the frozen fixture, the five null generators, and the first
      surrogate lattice measurements, and it is a day of work with no dependence
      on the unread paper. Stage 3 doubles the cost; Stages 4 and 5 are gated on
      Stage 0.
    controls:
      - Exact rank, Hecke-factorisation and Eichler-Shimura gates.
      - Enumerated-set-size equals h(O), as a gate on the instance generator.
      - Genus-0 control at N <= 10, which must produce nothing.
      - >-
        Two-directional self-test -- planted instance succeeds, all five nulls
        fail.
      - Configuration-hash distinctness assertion.
      - Full rebuild-from-scratch of every artifact before it is declared available.
    required_metrics:
      - Pass or fail of every exact gate, per cell, recorded individually.
      - T_enc and T_att per cell under one stated cost model, with peak memory.
      - The full surrogate measurement set of Stage 2 per cell.
      - Surrogate-to-actual difference per cell, once Stage 4 runs.
      - Self-test outcomes on the planted instance and on each of the five nulls.
      - An artifact manifest with hashes and a rebuild receipt.

  falsification_conditions:
    - >-
      Any Stage 1 exact gate fails. Implementation bug; the workbench emits
      nothing until repaired, and no downstream record may cite it.
    - >-
      The instance count differs from h(O). The generator is wrong; Stage 3 is
      blocked.
    - >-
      The self-test succeeds on a null. The pipeline is not discriminating and
      every measurement it has produced is void.
    - >-
      The genus-0 control produces a nonzero encoding. Fabrication; halt
      everything and diagnose before any further run.
    - >-
      Stage 0 cannot extract an effective definition of the attaching map, the
      shortness measure, or the required Coleman precision. Outcome (D): MSI is
      not yet a specified computational problem at the missing item, decision
      state (C) is unreachable, and the record must name the item and what would
      supply it or downgrade its own status to `unverified` per
      docs/inventor-protocol.md section 4.
    - >-
      Artifacts do not rebuild from scratch. The reproducibility pointer is a
      lie and the corpus may not be published.

  confounders:
    - >-
      SURROGATE CONTAMINATION. The single largest risk in this record is a
      surrogate number being read later as an MSI measurement. The labelling
      rule is therefore mechanical -- an arm field on every artifact and a
      refusal to emit reports mixing arms -- rather than editorial.
    - >-
      LIBRARY TRUST. Components taken from an existing computer algebra system
      carry that system's bugs, and the exact gates of Stage 1 are the only
      defence; they must be run against the library rather than assumed to hold
      because the library is well known.
    - >-
      COST MODEL. T_enc and T_att are wall clocks on one machine and are not
      portable. The reported quantity must be the RATIO and its trend in m, not
      the absolute seconds, and the cost model must state what is counted.
    - >-
      PRECISION CONVENTIONS. m as a truncation exponent, the working precision of
      the l-adic arithmetic, and the precision at which the period is
      well-defined are three different numbers that are easy to conflate. Each
      must be recorded separately per run.
    - >-
      GRID BIAS. N in the first grid is chosen partly for hand-verifiability and
      includes small-genus levels where d is 1 or 2; conclusions about
      eigencomponent structure drawn from such levels do not transfer, and the
      grid must be extended before IDEA-20260811-0f89a9 quotes them.

  interpretation_limits:
    - >-
      An instrument establishes nothing mathematical. No workbench output is
      evidence about MSI's hardness in either direction, and RQ-MSI-f760b2
      constraint 1 is honoured by construction.
    - >-
      Surrogate-arm numbers are measurements of Hecke modules at level N, not of
      the paper's map, and are labelled so permanently.
    - >-
      Toy scale throughout: N <= 101, h(O) <= 200, n <= 40 or so.
    - >-
      No prime-field ECDLP claim is made or reachable.
    - >-
      Outcome (D), if it occurs, is a statement about the paper as written and
      about this session's reading of it, not about MSI's mathematical content;
      a later, fuller version of the paper would supersede it immediately.

  heuristic_assumptions:
    - id: HEUR-MSI-W1
      statement: >-
        The surrogate integral Hecke pairing and the paper's actual truncated
        period map induce kernel lattices whose measured geometry -- rank mod l,
        elementary divisors, determinant exponent, eigencomponent dimensions and
        congruence numbers -- agree to within a constant factor at every tested
        cell.
      rigorous_support: >-
        The rigorous ingredient is that both maps are Hecke-equivariant
        homomorphisms out of the same module M, so both kernels are Hecke
        submodules of M and their eigencomponent structure is constrained by the
        SAME Hecke algebra decomposition. The classical statement being imitated
        is the standard comparison of integral structures on a Hecke module,
        which differ by the congruence number and not by more. THIS IS AN
        ASSUMPTION AND NOT A THEOREM, because the paper's l-adic normalisation is
        unread and could differ by more than a congruence-number factor.
      falsification_condition: >-
        Any measured geometric quantity differing between arms by more than a
        factor equal to the congruence number at that level.
      validation_plan: >-
        SAMPLE: every cell in the grid, both arms, once the actual arm exists --
        of order 10^2 to 10^3 cells. COMPARISON: paired per-cell differences, with
        the congruence number as the predicted scale of disagreement. TAIL
        CHECK: report the 10 cells with the largest disagreement and state
        whether they share a level, a prime, or an eigencomponent. TRANSFER
        ASSUMPTION, STATED AND UNJUSTIFIED: that agreement at toy N implies
        agreement at larger N. NOTHING SUPPORTS THIS and it is recorded as an
        open extrapolation; until the actual arm runs, HEUR-MSI-W1 is the reason
        surrogate numbers are labelled rather than trusted.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE COULD BE, BECAUSE THIS RECORD
      PROPOSES NO ALGORITHM FOR ANY HARD PROBLEM. Stated explicitly rather than
      omitted, as the handoff requires. The costs it does carry are instrument
      costs: modular symbols at level N cost poly(N) time and O(N) space for the
      Manin presentation and O(n^2) to O(n^3) for the Hecke and linear algebra,
      with n ~ N/6; the instance generator costs poly(log p) per step and h(O)
      steps to enumerate; and the l-adic encoder's cost in m is UNKNOWN and is
      the measurement of claim (C).
    memory_exponent: >-
      O(n^2) machine words for the dense Hecke and pairing matrices, so
      megabytes at the toy grid and quadratic in N thereafter. The frozen corpus
      is expected to be gigabytes at most.
    best_known: >-
      The best known implementations of the CLASSICAL components are the modular
      symbols routines in existing open-source computer algebra systems, and this
      record does not improve them by any factor; where they are available they
      should be used rather than reimplemented. For the l-adic encoder and the
      attaching map there is no known implementation at all, because the paper is
      four months old and this program has found no follow-up. NO EXPONENT IS
      CLAIMED AGAINST EITHER BASELINE: the first because the record does not
      compete with it, the second because it does not exist.
    hidden_overhead: >-
      The dominant hidden cost is the l-adic precision required for the period to
      be well defined, which the abstract does not state and which could grow
      with the genus. If it does, T_enc grows superlinearly in N as well as in m
      and the cost surface of claim (C) looks materially worse than a naive
      estimate -- which is exactly why the surface is measured rather than
      estimated.
    tradeoff_note: >-
      The tradeoff this instrument exposes is between ENCODER PRECISION and
      ATTACK DIFFICULTY, both driven by m in the same direction under
      IDEA-20260811-4a55dd's geometry. That is a tradeoff with no good operating
      point if both trends hold, and the workbench is the only record in the
      portfolio that can see both curves at once.

