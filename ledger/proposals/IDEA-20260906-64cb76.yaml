  sota_delta: >-
    Zero attack improvement, stated unconditionally in advance. The
    quantitative delta is a pair of numbers this lane does not have: the swap
    margin in bits per cell, and the evaluable fraction. One is already
    computable from committed numbers - at Kyber-512 under RC.MATZOV the
    primal_bdd-to-primal_usvp swap margin is 143.771733 - 140.199473 =
