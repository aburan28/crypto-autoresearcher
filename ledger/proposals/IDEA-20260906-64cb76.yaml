idea:
  id: IDEA-20260906-64cb76
  question_id: RQ-MLKEM-003
  added: '2026-09-06'
  title: >-
    A security level is an ARGMIN over attacks, and this lane has audited the
    argument of that minimum in every way except one - whether the argmin itself
    is model-stable. Every proposal here perturbs a COST; none has ever asked
    whether a cost-model change can swap WHICH ATTACK gets quoted. Track the
    RANKING PERMUTATION as the object, measure it first on the eighteen cells
    EV-MLKEM-020 already committed at zero compute, and report the evaluable
    fraction of the attack set alongside it - because the same record shows two
    of the estimator's attack modules crash rather than return a number
  class: measurement

  claim: >-
    (A) THE STRUCTURAL POINT. The quantity "ML-KEM's security level" is
    min over attacks a of Cost(a, model). This lane has thirty-three proposals
    and they all move Cost - the sieve constant, the memory charge, the memory
    access, the schedule term, the dimensions-for-free discount, the structure
    discount, the reference cutoff, the estimator version. Not one asks whether
    the MIN is taken at the same a when the model changes. That is a different
    property with a different failure mode: a cost model can be uniformly
    conservative and still report the wrong ATTACK, and once it reports the
    wrong attack, every downstream sensitivity computed against that attack -
    including EV-MLKEM-020's committed c* and every margin in the lane - is a
    sensitivity of a quantity that is not the minimum.
    (B) THE CLAIM, TWO-SIDED AND MEASURABLE TODAY. Define the RANKING
    PERMUTATION pi(model, parameter set) as the ordering of the priced attacks
    by cost. The claim is that at least one pair of named cost models in
    EV-MLKEM-020's own committed set disagrees on pi at at least one FIPS 203
    parameter set - equivalently, that Kendall's tau between two committed
    columns is below 1. EXPLANATION A, STABLE ARGMIN - tau is 1 everywhere; then
    "the best known attack" is a model-robust designation, the lane's numerator
    work is well posed, cross-model comparison of a FIXED attack remains
    forbidden by KN-TECH-040 but cross-model comparison of the RANKING is
    licensed, and this record's claim is refuted with a number. EXPLANATION B,
    UNSTABLE ARGMIN - some pair disagrees; then the reported security level is
    the minimum of a model-dependent ordering, a cost-model revision can change
    which attack is quoted without any cryptanalytic advance, and every margin
    in this lane must name its argmin as part of its scope.
    (C) THE SECOND HALF, WHICH IS NOT A RANKING QUESTION AT ALL AND IS ALREADY
    MEASURED. A minimum over a set is only as good as the set. EV-MLKEM-020's
    H12 records, from validator D4, that the estimator's `dual` module raises
    AttributeError at estimator/prob.py:213 and `primal_hybrid` raises
    ZeroDivisionError at ML-KEM parameters - so the committed minimum is taken
    over the attacks the instrument HAPPENS TO SERVE, and the lane has never
    reported that fraction. The deliverable is the EVALUABLE FRACTION: of the
    attack families named in RQ-MLKEM-001's own scope (primal, dual, hybrid,
    decoding, algebraic, combinatorial) and of the estimator's own module list,
    how many return a number at FIPS 203 parameters, how many crash, and how
    many are absent entirely. A minimum over three of nine is a different object
    from a minimum over nine, and the difference has never been written down.
    (D) WHAT IS NOT CLAIMED. No attack. No claim that any estimator module is
    wrong. No claim that the argmin IS unstable - that is what the measurement
    decides. No status change to any committed record.

  mechanism: >-
    STAGE 1, ZERO COMPUTE, FROM COMMITTED NUMBERS ONLY. EV-MLKEM-020 commits
    eighteen cells of {RC.CheNgu12, RC.ABFKSW20, RC.ABLR21} x {primal_bdd,
    primal_usvp} x {512, 768, 1024}, plus a RC.MATZOV triple at Kyber-512 from
    VAL-CTRL-A (primal_bdd 140.199473, primal_usvp 143.771733, dual_hybrid
    145.528285). Extract every cell, form pi per (model, parameter set), and
    compute pairwise Kendall's tau across models. This is arithmetic on numbers
    already in the ledger and it either exhibits a disagreement or does not.
    STAGE 2, WIDEN THE ATTACK SET AT FIXED MODELS. Run the pinned estimator
    commit 3e48ef421ec256afddb3e7d2249a77eab6e9ba12 over every attack module it
    exposes, at all three parameter sets, under each named cost model, recording
    for each cell one of {value, exception with its type and line, unsupported}.
    Do not repair the crashing modules - the crash IS a datum and repairing it
    inside this record would destroy the measurement. Report the evaluable
    fraction per (model, parameter set).
    STAGE 3, ADD THE ROWS THE INSTRUMENT CANNOT SERVE. Three attack families
    named in RQ-MLKEM-001's scope have no estimator module at these parameters:
    the algebraic family (which IDEA-20260828-faca4f is opening), the
    combinatorial family, and - proposed this session - the symmetric
    seed-search family (IDEA-20260906-c5bfc2, IDEA-20260906-e5e51c), whose cost
    255 + g gate-bits is model-INDEPENDENT and therefore acts as a FIXED
    REFERENCE LINE against which every model's ranking can be tested. That last
    point is the sharpest instrument in the record: an attack whose cost does
    not move with the lattice cost model is a ruler, and the lane has never had
    one.
    STAGE 4, THE RANK-SENSITIVITY MAP. For each pair (model, parameter set),
    compute the SWAP MARGIN - the smallest perturbation in bits that would
    change the argmin - and report it beside EV-MLKEM-020's committed margins
    2.800527 / 6.041285 / 1.276377. A swap margin smaller than the reported
    margin means the identity of the quoted attack is less robust than the
    verdict that rests on it.

  novelty_status: unverified

  novelty_screen:
    method: >-
      THE crypto-kb MCP RETRIEVAL INDEX WAS UNAVAILABLE (CRYPTO_KB_QDRANT_URL is
      ':memory:'; search_knowledge errors), so THE SEMANTIC NOVELTY SCREEN COULD
      NOT BE RUN and no citation carries `kb` provenance. Substitute screen,
      this session: read the full 90-row proposal inventory for
      RQ-MLKEM-001/002/003; RQ-MLKEM-001 and RQ-MLKEM-003 in full; KN-OPEN-016
      and KN-OPEN-026 in full; IDEA-20260829-bc9cc5 in full;
      IDEA-20260829-cca84c lines 1-45, IDEA-20260828-5b7795 lines 1-45,
      IDEA-20260814-10e5e1 lines 1-70, IDEA-20260805-690de8 lines 1-60;
      EV-MLKEM-020 lines 440-519 plus a targeted grep of the whole file for
      `primal_usvp|dual_hybrid|arora|ABLR21|argmin|cheapest attack`, which
      returned the eighteen-cell block at lines 325-341, the VAL-CTRL-A triple
      at line 463 and the enumeration summary at line 500. Enumerated all 32
      H-MLKEM hypotheses and all 34 staged EXP-MLKEM specifications.
      Web: three WebSearch queries this session; no WebFetch for this record.
    results: >-
      The grep for `argmin` and `cheapest attack` over EV-MLKEM-020 returns one
      hit, at line 500, and it is about the cheapest FALSIFICATION ROUTE, not
      about the argmin over attacks. H12 explicitly disclaims a best-attack
      claim ("Scope is primal_bdd under RC.MATZOV; no best-attack claim"), so
      the program's own strongest record declares the argmin OUT OF SCOPE - the
      gap is pre-declared rather than merely unfilled, exactly as
      IDEA-20260829-bc9cc5 found for the denominator.
      Nearest records. IDEA-20260829-cca84c varies instrument version and cost
      model at a FIXED attack (primal_bdd) and measures cost dispersion; its
      design holds the attack constant, so it cannot see a ranking swap.
      IDEA-20260805-522b48 shows the instrument maps many objects to one number
      - an identifiability claim about inputs, not about the ordering of
      outputs. IDEA-20260828-faca4f adds one family (Arora-Ge) to the priced
      set, which changes the set the min is taken over but does not measure the
      ordering's stability. IDEA-20260731-001 reconciles dual against primal
      under MATZOV costing - a single pairwise comparison in a single model,
      which is one cell of this record's table.
    verdict: >-
      UNVERIFIED. No external literature was retrievable and the estimator
      source has not been inspected. Claimed new RELATIVE TO THIS REPOSITORY:
      (i) the ranking permutation as a tracked object, (ii) the swap margin as a
      reported quantity beside the cost margin, (iii) the evaluable fraction of
      the attack set as a first-class number, and (iv) the use of a
      model-independent attack row as a ruler for ranking stability. The
      statistical machinery (Kendall's tau) is standard and no novelty is
      claimed for it.

  object_first_candidate:
    established_families_off_limits: >-
      Off-limits as the primary lens, because this record must not become
      another cost perturbation: sieve cost constants (IDEA-20260807-8fbc86,
      -20260805-f7c912, -fc6361); memory and memory-access pricing
      (IDEA-20260816-70e41d, -7bc28c, IDEA-20260821-46c09f); dual score geometry
      (IDEA-20260805-5a4409, -a102ec, -bb7668, IDEA-20260808-0eb075,
      IDEA-20260816-ba5bd8, -725f05, IDEA-20260901-2f778b); the structure
      discount (IDEA-20260816-b824af, -f4ce0b, -fdc8e8, -bd7f26);
      dimensions-for-free (IDEA-20260821-374af4); the schedule term
      (IDEA-20260821-41cd67); the reference computation (IDEA-20260829-bc9cc5);
      the instrument's version dispersion (IDEA-20260829-cca84c). Each of those
      moves a NUMBER; this record refuses to move any number and looks only at
      the ORDER.
    tracked_object: >-
      THE RANKING PERMUTATION pi over the priced attack set, one per (cost
      model, parameter set) cell, together with the SWAP MARGIN - the smallest
      cost perturbation that changes pi's first element. Not a cost, not a
      security level, not an instrument reading: a permutation and a distance to
      the nearest different permutation.
    lossiness: >-
      LOSSY, and violently so, which is the entire design. The underlying state
      is a vector of real costs, one per attack, with all their digits. The
      projection retains only the ORDER - it discards every magnitude, so a cell
      where the top two attacks differ by 0.001 bits and a cell where they
      differ by 100 bits map to the SAME permutation. NOT A CHANGE OF
      COORDINATES: the permutation cannot reconstruct a single cost, cannot
      reconstruct a margin, and cannot even reconstruct whether the numbers are
      close. That is a many-to-one map of infinite fibre.
      THE COMPATIBILITY CONDITION, which is what makes this a legitimate object
      rather than a discarded statistic. The operation the object must survive
      is A CHANGE OF COST MODEL. A cost model that is a MONOTONE transformation
      of another - and several of this lane's charges are exactly that, for
      instance the multiplicative memory charge T x M^c applied uniformly -
      leaves pi INVARIANT by construction, so the retained order propagates
      deterministically under that whole class of operations while the discarded
      magnitudes do not. The object is therefore precisely blind to the
      perturbations this lane has spent thirty-three proposals on, and sensitive
      exactly to the ones that are not uniform across attacks. The swap margin
      is carried alongside because the permutation alone cannot say how close it
      came to changing, and a null-object control needs that.
    propagation: >-
      One step is one change of cost model, one added attack, or one increment
      of a charge exponent c. Under a uniform monotone charge, pi is invariant -
      a forced value, declared here so it cannot be reported later as a finding.
      Under a non-uniform charge (memory charged against attacks with different
      memory footprints, which is EV-MLKEM-020's own T x M^c with per-attack M)
      pi moves at computable thresholds, and those thresholds ARE the swap
      margins. CHEAP INTERNAL FALSIFIER: at c = 0 the pipeline must reproduce
      the committed ordering primal_bdd 140.199473 < primal_usvp 143.771733 <
      dual_hybrid 145.528285 at Kyber-512 under RC.MATZOV. If it does not, the
      extraction is wrong and nothing downstream is reportable.
    survival_score: >-
      Survives every model in the lane's committed set and every attack the
      instrument serves, at full FIPS 203 parameters, with no extrapolation. It
      dissolves at the boundary of the attack set - a permutation says nothing
      about attacks nobody priced, and the record's own Stage 3 exists to make
      that boundary visible rather than to pretend it is closed. It also
      dissolves under a cost model that returns intervals rather than points,
      where the order is only partial.

  null_object_control: >-
    NULL-MONO, THE MONOTONE-CHARGE NULL, AND IT IS THE ONE THAT MATTERS.
    Apply a uniform monotone transformation to every cost in a cell - multiply
    every rop count by 2^{10}. pi MUST be unchanged. If the pipeline reports a
    ranking change, it is reading noise or a bug, not a model effect, and every
    reported swap is suspect.
    NULL-PERM, THE SHUFFLED-LABEL NULL. Randomly permute the attack labels
    across models before computing tau, 10^4 times, and build the null
    distribution of tau. An observed tau must be compared against that
    distribution rather than against 1, because with three attacks and three
    models a disagreement can arise by construction from a two-cell table.
    NULL-C0, THE ZERO-CHARGE ANCHOR. At c = 0 the pipeline must return
    EV-MLKEM-020's committed numbers and its committed ordering exactly, to all
    printed digits.
    NULL-RULER, THE MODEL-INDEPENDENT ROW. Insert a synthetic attack whose cost
    is a constant independent of the cost model. Its rank must move whenever any
    other attack's cost crosses it and must be stable otherwise - a
    deterministic behaviour the pipeline must reproduce, and the reason the
    symmetric row proposed in IDEA-20260906-c5bfc2 is useful here.
    FORCED VALUES DECLARED BEFORE MEASUREMENT: (1) a uniform monotone charge
    cannot change pi, so any ranking movement must be attributed to a
    non-uniform effect or to a bug; (2) with only two attacks per model in the
    committed eighteen-cell block, the maximum observable tau deviation is
    bounded and the record must not overclaim significance from it; (3) the
    evaluable fraction is a count and carries no statistical uncertainty at all.

  discriminated_from:
    - >-
      IDEA-20260829-cca84c fixes the attack (primal_bdd) and varies instrument
      version and cost-model name to measure cost DISPERSION. Its design cannot
      observe a ranking swap, since it never prices a second attack in the same
      cell. This record fixes the instrument and measures the ORDER across
      attacks. The two are complementary and their conclusions are independent:
      a stable cost can hide an unstable ranking and vice versa.
    - >-
      IDEA-20260805-522b48's identifiability audit shows the instrument maps
      MANY OBJECTS to ONE number - a statement about the fibres of the input
      map. This record is about the fibres of the OUTPUT ordering, which the
      identifiability framing does not reach.
    - >-
      IDEA-20260828-faca4f adds the Arora-Ge/Groebner family to the priced set,
      changing the set the minimum ranges over. That is a contribution to the
      SET; this record measures a property of the ORDERING on whatever set
      exists, and explicitly consumes faca4f's row when it lands rather than
      duplicating its pricing work.
    - >-
      IDEA-20260731-001 reconciles dual against primal under MATZOV costing.
      That is exactly one cell of this record's table - one model, one pair -
      and it is cited as the seed rather than as a competitor.

