  assumptions:
    - >-
      A cost model that transforms every attack's cost monotonically and
      uniformly cannot change the ranking. This is the forced value the whole
      design rests on and it is checked by NULL-MONO rather than assumed.
    - >-
      EV-MLKEM-020's committed cells are taken as given and are not recomputed
      in Stage 1. Any Stage 2 recomputation that disagrees with them is reported
      as a discrepancy rather than silently replacing them.
    - >-
      A crash is an instrument outcome and never mathematical evidence
      (AGENTS.md rule 3). The evaluable fraction counts crashes as UNSERVED, not
      as expensive attacks, and no crash is ever read as evidence that an attack
      is costly.
    - >-
      The attack set is open. Every conclusion is scoped to the priced set of
      the day, and the record reports that set explicitly rather than saying
      "the best known attack".

  predictions:
    - metric: >-
        minimum pairwise Kendall's tau of the ranking permutation across the
        cost models present in EV-MLKEM-020's committed cells, per parameter set
      direction: lower
      minimum_effect: >-
        Below 1.0 at any parameter set is the claim. Exactly 1.0 everywhere
        refutes it and closes the question with a number.
    - metric: >-
        swap margin in bits, the smallest uniform perturbation of one attack's
        cost that changes the argmin, per (model, parameter set)
      direction: lower
      minimum_effect: >-
        Decision-relevant if below the committed margin at the same parameter
        set - 2.800527 / 6.041285 / 1.276377 bits. At Kyber-512 under RC.MATZOV
        the committed triple already gives a swap margin of 3.572260 bits
        between primal_bdd and primal_usvp, which is LARGER than the 2.800527
        margin to the cutoff, and that comparison is computable today.
    - metric: >-
        evaluable fraction - number of attack modules returning a value divided
        by number attempted, at FIPS 203 parameters, per cost model
      direction: lower
      minimum_effect: >-
        Anything below 1.0 is reportable and is already known to be below 1.0
        from H12's two recorded exceptions; the deliverable is the exact value,
        which is currently unrecorded.
    - metric: >-
        number of RQ-MLKEM-001 scope families (primal, dual, hybrid, decoding,
        algebraic, combinatorial) with no priced row at FIPS 203 parameters
      direction: higher
      minimum_effect: >-
        1. Each unpriced family is an explicit hole in the minimum, and naming
        them is the record's cheapest durable output.

  minimal_test:
    design: >-
      STAGE 1 ALONE IS THE MINIMAL DISCRIMINATOR AND IT NEEDS NO COMPUTE AT ALL.
      Extract the eighteen committed cells and the VAL-CTRL-A triple from
      EV-MLKEM-020, form the ranking permutation per cell, compute pairwise
      Kendall's tau and the swap margins, and compare each swap margin against
      the committed cost margin at the same parameter set. This is spreadsheet
      arithmetic on numbers already in the ledger; it takes minutes, requires no
      estimator run, no BKZ run and no dimension-512 measurement - which matters
      because this program has measured that a d=512 / beta=55 / mpfr=100 cell
      ran at least 14448 s without completing and that the tour count to
      completion is not derivable from what the instrument records. Stage 2's
      module sweep is the follow-on and is the only part needing execution.
    controls:
      - NULL-MONO, the monotone-charge null - a uniform rescaling must leave the ranking fixed.
      - NULL-PERM, the shuffled-label null - tau compared against a permutation null, not against 1.
      - NULL-C0, the zero-charge anchor - committed numbers and ordering reproduced exactly.
      - NULL-RULER, the model-independent row - rank must move only when crossed.
      - Forced-value declaration filed before any number is produced.
    required_metrics:
      - ranking permutation per (cost model, parameter set), with the extracted costs beside it
      - pairwise Kendall's tau, with the permutation-null distribution
      - swap margin in bits per cell, reported beside the committed cost margin
      - evaluable fraction per cost model, with each exception recorded by type and source line
      - list of RQ-MLKEM-001 scope families with no priced row, named
      - explicit statement of the attack set every conclusion is scoped to

  falsification_conditions:
    - >-
      If pairwise Kendall's tau is exactly 1 across every committed cost model
      at every parameter set, the argmin is model-stable over the tested set,
      the claim is REFUTED, and the lane gains a validated licence to speak of
      "the best known attack" within that model family. That is a clean and
      useful negative.
    - >-
      If NULL-MONO shows a ranking change under a uniform rescaling, the
      pipeline is broken and no result is reported at all.
    - >-
      If every swap margin exceeds the corresponding committed cost margin, then
      the identity of the quoted attack is MORE robust than the verdict resting
      on it, which weakens the record's decision-relevance to zero even if some
      tau is below 1, and the record must say so rather than lead with the tau.
    - >-
      If the evaluable fraction turns out to be 1.0 - if every module serves at
      FIPS 203 parameters and H12's recorded exceptions were transient - then
      part (C) is refuted and the minimum is over the full instrument set.

  confounders:
    - >-
      TINY TABLES. Two attacks and three models give a table where a single cell
      determines tau, and a permutation null is mandatory rather than optional.
      Reporting tau without it would manufacture significance.
    - >-
      A crashing module is not an expensive attack. Reading an exception as a
      high cost would invert the finding, and AGENTS.md rule 3 forbids it; the
      evaluable fraction exists precisely so the crash is visible instead of
      absorbed.
    - >-
      Cost models are not independent: RC.CheNgu12, RC.ABFKSW20 and RC.ABLR21
      are enumeration-flavoured and share lineage, so agreement among them is
      weaker evidence of stability than agreement between one of them and
      RC.MATZOV. The report must carry the lineage structure, not just the count
      of agreements.
    - >-
      Different attacks have different memory footprints, so EV-MLKEM-020's own
      T x M^c charge is exactly a NON-uniform transformation and will move
      rankings by construction as c grows. That is a real effect and not a bug,
      but it must be reported as "the ranking is charge-dependent" rather than
      as "the models disagree", which is a different claim.
    - >-
      The estimator's optimiser may return a local optimum per attack, so a
      ranking difference could reflect optimiser behaviour rather than cost-model
      structure. Re-running with perturbed starting points is the check, and it
      belongs in Stage 2.

  interpretation_limits:
    - >-
      A ranking instability is a statement about the INSTRUMENT AND THE MODEL
      SET, not about ML-KEM. It cannot make any attack cheaper and must never be
      quoted as a security result.
    - >-
      Every conclusion is scoped to the priced attack set of the day. The record
      does not and cannot say anything about attacks nobody has priced, and
      Stage 3 exists to keep that boundary visible.
    - >-
      Claim tier: derivation for Stage 1 (exact arithmetic on committed
      numbers), instrument-measurement for Stage 2. Neither is evidence about
      lattice hardness.
    - >-
      The committed cells inherit every defect EV-MLKEM-020 records for
      themselves - H6's unstated rop-unit purpose, H11's unverifiable cutoffs,
      and the four surviving defects listed in its observations - and a ranking
      computed from them inherits all of it.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a fixed parameter set, the cost of attack a under cost model M
        factorises as Cost(a, M) = f_M(Work(a)) + g_M(Memory(a)) where f_M is
        strictly increasing; consequently the ranking permutation is invariant
        under any change of M that alters only f_M, and can change only through
        the memory term or through a model that changes Work(a) itself
        non-uniformly across attacks.
      rigorous_support: >-
        The invariance of an ordering under a strictly increasing transformation
        is elementary and rigorous. The heuristic is the FACTORISATION - that a
        cost model's dependence on the attack enters only through a work count
        and a memory count. That imitates the standard structure of the
        estimator's cost models (a gate count per operation, times an operation
        count, plus a memory charge), and it is exactly what NULL-MONO tests. It
        is expected to FAIL for models that re-optimise beta and eta internally,
        which EV-MLKEM-020 records the red team doing in 26 s within RC.MATZOV,
        and that expected failure is stated here so it cannot be reported later
        as a discovery.
      validation_plan: >-
        Sample: for each of the named cost models at the pinned estimator commit,
        evaluate Cost(a, M) for every servable attack a at all three parameter
        sets and additionally at a grid of synthetic parameter sets varying only
        q and eta, at least 40 cells per model. Fit f_M by isotonic regression
        against a reference model's work counts and test monotonicity; where the
        fit's residual exceeds 0.5 bits the factorisation is rejected for that
        model and the model is reported as re-optimising rather than
        transforming. Tail check: two attacks with identical work and memory
        counts must receive identical costs under every model, a forced value
        the fit must hit. Transfer assumption, explicit: the factorisation is
        claimed only for the models tested and only at the parameter grid used.
    - id: H2
      statement: >-
        Under the charge family Cost -> Cost x Memory^c with per-attack memory,
        the ranking permutation changes at finitely many critical exponents
        c_1 < c_2 < ... determined by pairwise crossings, each given in closed
        form by c_ij = (Cost_i - Cost_j) / (log2 Memory_j - log2 Memory_i) in
        bits; and the smallest such crossing in the range [0, 1/3] is the
        record's swap-margin statistic on the memory axis.
      rigorous_support: >-
        Exact algebra, not a heuristic, GIVEN per-attack memory figures - two
        log-linear functions of c cross at most once. The heuristic content is
        entirely in the AVAILABILITY of per-attack memory figures, and
        EV-MLKEM-020 records that the attack's own estimator module supplies no
        memory figure at all (H4/H5), with the memory model assembled from a
        literal in an uncalled function. So this assumption is expected to be
        BLOCKED on the instrument side for some attacks, and the record reports
        which ones rather than substituting a guess.
      validation_plan: >-
        Sample: extract, per attack module and parameter set, whatever memory
        quantity the instrument exposes, recording "absent" where it exposes
        none; compute c_ij for every servable pair; check that at c = 0 the
        ordering matches the committed one and that each crossing is a single
        sign change. Tail check: setting all memory equal must send every c_ij
        to infinity and freeze the ranking, a forced value the arithmetic must
        hit. Transfer: none - this is exact arithmetic on committed and
        extracted numbers, and its only exposure is the provenance of the memory
        figures, which is carried forward from EV-MLKEM-020's H4/H5 unrepaired.

  target_complexity:
    time_exponent: >-
      No attack is proposed and no attack exponent is claimed. The quantity this
      record measures is a PERMUTATION and a distance, and the closest thing to
      an exponent it produces is the critical charge exponent c_ij at which two
      attacks swap - directly comparable with EV-MLKEM-020's committed
      c* = 0.03164649 / 0.04588645 / 0.00705473, which is the exponent at which
      the quoted attack crosses the cutoff. Reporting both says whether the
      quoted attack changes before or after the verdict does.
    memory_exponent: >-
      None claimed. Per-attack memory is an INPUT here, taken from the
      instrument where it exists and recorded as absent where it does not
      (EV-MLKEM-020 H4/H5 records that the attack module supplies none).
    best_known: >-
      The lane's best-known figure is EV-MLKEM-020's primal_bdd under RC.MATZOV
      at 140.1994731076207 / 200.9587149140538 / 270.7236234535225 log2 rop -
      and this record's entire subject is that the phrase "best known" in that
      sentence is an argmin whose stability has never been measured, over a set
      whose completeness has never been reported.
    hidden_overhead: >-
      A permutation hides every magnitude by construction, which is why the swap
      margin is carried beside it; reporting the permutation alone would be the
      record's own characteristic failure mode. Inherited without repair:
      RC.MATZOV's rop-unit semantics (H6), the unverifiable cutoffs (H11), the
      unsourced memory model (H4/H5), and the o(n) in the sieve's memory
      exponent recorded as unbounded.
    tradeoff_note: >-
      The ranking is charge-dependent by construction, since attacks differ in
      memory footprint; the deliverable is therefore a ranking as a FUNCTION of
      the charge exponent c on [0, 1/3], not a single ranking. The model-
      independent symmetric row of IDEA-20260906-c5bfc2, with O(1) memory,
      occupies the c-axis differently from every lattice row and is the natural
      ruler for the whole family.

  dominated_by: >-
    n/a (no attack, algorithm, or complexity result is claimed). Pareto check
    performed against every row this program holds on the relevant frontier:
    EV-MLKEM-020's eighteen enumeration-costed cells (219.04 to 745.26 bits,
