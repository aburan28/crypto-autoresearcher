idea:
  id: IDEA-20260807-d73e83
  question_id: RQ-GGMB-6eaabc
  added: '2026-08-07'
  title: >-
    THE ISOGENY-TRANSPORT ORACLE IS A RELABELING: an explicit generic-group
    simulator answers phi(P), phi(Q) queries at O(1) amortized cost per query by
    issuing fresh labels from a second table indexed by the SAME linear form,
    Shoup's bound is undegraded because label tables are independent, and
    therefore no isogeny walk can itself be the source of an advantage -- from
    which the campaign's own prediction of ZERO within-class variance in every
    group-level cost functional follows as a theorem rather than an expectation
  class: mechanism

  claim: >-
    (A) THE ORACLE. TRANSPORT(phi, h) where phi : E -> E' is an F_p-isogeny of
    degree d with gcd(d, N) = 1 and h is a handle for a point of G: return a
    handle for phi(h) in G' = phi(G) subset E'(F_p). This is the oracle form of
    DECOMPOSITION.md's transport theorem T1, and it is the oracle every lane that
    proposes to "walk to a better curve" implicitly assumes.

    (B) THE SIMULATOR, EXHIBITED. The generic simulator S maintains, per curve it
    has been asked about, a separate label table; every handle carries its formal
    linear form lambda(h) = (alpha, beta) in (Z/N)^2 with h = [alpha]P + [beta]Q.
    On TRANSPORT(phi, h):
      1. Look up lambda(h) = (alpha, beta).
      2. Because phi restricted to G is an injective group homomorphism onto G'
         with phi(P) generating G' and phi(Q) = [k]phi(P) (T1), the transported
         point has the SAME linear form in the basis (phi(P), phi(Q)).
      3. Look up (alpha, beta) in the table for E'. If present, return the stored
         label. If absent, draw a fresh uniform unused label, store it, return it.
    COST: one dictionary lookup and at most one label draw, i.e. O(1) amortized
    per query and ZERO group-oracle calls. T_sim = 0 group operations. The
    simulator never needs the degree d, never computes an isogeny, and never
    learns k.

    (C) THE BOUND IS NOT DEGRADED, AND THIS IS THE NON-OBVIOUS PART. One might
    expect that giving the adversary r independent encodings of the same group
    weakens Shoup's bound by a factor in r. It does not. Shoup's argument bounds
    the probability that any two of the q formal linear forms the adversary has
    constructed become equal when evaluated at the true k: that probability is at
    most binomial(q,2)/N, and it depends only on the NUMBER of distinct linear
    forms the adversary has built, not on how many label tables they are
    distributed across. Labels in different tables are independent uniform draws
    and a collision across tables conveys nothing, because equality of labels is
    only meaningful within a table. So r encodings cost the adversary q queries
    and buy zero extra collision opportunities, and the bound remains
    Omega(sqrt(N)). Transport across an entire isogeny class of h curves gives
    the adversary h label tables and NO reduction in the bound.
    THE PRECISE STATEMENT AND ITS RISK: this is a claim about the standard
    counting argument in Shoup 1997 (KN-LIT-011, KN-TECH-005) extended to
    multiple independent encodings of one group. I have not located a written
    multi-encoding statement in this corpus, and the extension is asserted here
    with its argument, not quoted. IF THE MULTI-ENCODING EXTENSION FAILS, the
    correct fallback claim is the weaker and still decisive one that the bound
    degrades by at most a factor polynomial in h -- and since h <= p^{1/2+o(1)}
    by the Brauer-Siegel-type bound on class numbers, even a catastrophic
    factor-h degradation would leave the exponent unchanged for h = poly(log p).
    Both the claim and the fallback are recorded so a reviewer can reject the
    strong form without collapsing the record.

    (D) THE CONSEQUENCE FOR THE WHOLE CAMPAIGN, WHICH IS WHY THIS IS FILED IN
    L12 AND NOT IN L1. GOAL-ENDO-001's organising idea is that ECDLP difficulty
    is an isogeny-class invariant and that a cost-minimising curve in the class
    would be a target. This record sharpens that:
      THE WALK IS FREE AND WORTHLESS. Moving to another curve in the class is,
      in the generic model, exactly a change of labels. Therefore ANY advantage
      found on a different curve in the class must come ENTIRELY from the
      resource consumed AFTER arrival -- R1 (coordinates as field elements) or
      R2 (the curve equation) -- and NEVER from the transport.
    Two corollaries, both testable and both cheap:
      COROLLARY 1. Every cost functional that is a function of the group
      operations alone -- rho step count, relation YIELD given a factor base of
      fixed size, BSGS table size, the meet-in-the-middle exponent -- is EXACTLY
      constant across the isogeny class, with zero variance, not small variance.
      DECOMPOSITION.md section 5 prediction 1 records "zero variance in relation
      yield" as an [open] expectation; this record DERIVES it, which converts a
      prediction into a control: if L1's instrument measures nonzero within-class
      variance in a group-level functional, the instrument is broken, and that is
      a far more useful reading than "we found variance".
      COROLLARY 2. Any within-class variance L1 does find MUST be located in an
      R1/R2 quantity -- solving degree, first-fall degree, Macaulay rank profile,
      factor-base decomposition probability. L1's measurement should therefore be
      stratified by resource, and a variance report that does not say which
      resource the varying functional consumes is uninterpretable.

    (E) WHAT ESCAPES, STATED SO THE CLOSURE IS NOT OVERSOLD. TRANSPORT as
    specified returns a HANDLE. The moment a lane asks for the COORDINATES of
    phi(h) on E', it is no longer using the transport oracle -- it is using the
    coordinate oracle on E', which is resource R1 and is adjudicated separately
    (IDEA-20260807-070d03). The composite "transport then read coordinates" is
    exactly as strong as "read coordinates on E'" and no stronger, so the value
    of an isogeny walk is precisely the value of the R1 resource at the
    destination minus its value at the origin. That difference is L1's actual
    question, correctly posed, and this record's contribution is to have removed
    the walk from it.

    (F) WHAT WOULD REFUTE IT. Exhibit a generic adversary that, given the
    transport oracle for a class of h curves, solves ECDLP in fewer than
    c*sqrt(N) group operations. By (B) and (C) that adversary can be run against
    the simulator, contradicting Shoup. So a refutation is either an error in the
    simulator (most likely: the claim that lambda is preserved) or a genuine
    multi-encoding weakness in Shoup's counting, and either would be a
    significant finding about the generic model itself.

  resource_label: >-
    R4 (isogeny graph / class-group action) as CLAIMED by the lanes that would
    use this oracle; VERDICT: the resource is nominal -- the transport oracle
    delivers R4 in a form containing no non-generic information, so the effective
    resource consumed is none. The audit itself consumes no resource.
  admissibility: inadmissible_generic_group
  admissibility_argument: >-
    INADMISSIBLE, and this is the deliverable rather than a defect, filed under
    the IDEATION-BRIEF non-negotiable 1 which asks that inadmissible proposals be
    filed as recorded closures with their obstruction named. The transport oracle
    applies phi to points of G and returns points of a group of the same prime
    order N; by H-ENDO-001's argument every such map is determined on G by its
    action on the linear form, and here that action is the identity. So the
    oracle does exactly what the admissibility filter forbids: its only use of
    phi is to apply it to points of G. THE OBSTRUCTION IS NAMED: transport
    preserves the linear form exactly, so the projection lambda -- the object the
    generic model tracks -- is unchanged, and an oracle that leaves the tracked
    object unchanged is a change of coordinates rather than a new object
    (docs/inventor-protocol.md section 2). The verdict is filed here so that
    every lane proposing an isogeny walk inherits it instead of re-deriving it.

  discriminated_from:
    - >-
      DECOMPOSITION.md T1/T2, which state that the ECDLP transports along
      isogenies and that difficulty is a class invariant "up to transport cost".
      Those are facts about the PROBLEM. This record is a statement about the
      MODEL: it says the transport is invisible to a generic adversary, hence the
      transport cost is not merely a cost to be paid but a cost that can never be
      worth paying for a group-level advantage. T1 leaves open that a cheaper
      attack exists on another curve; this record locates where such an attack
      would have to live (R1/R2 only) and removes the walk from the accounting.
    - >-
      KN-FIND-b7e091's Oracle D (endomorphism images). That is the ENDO-morphism
      case, E -> E, closed because End acts as a scalar. This is the ISO-geny
      case, E -> E', where there is no scalar at all and the linear form is
      preserved on the nose. Adjacent arguments, different objects; and the
      isogeny case is the one the campaign's organising idea depends on, so it
      needs its own record.
    - >-
      H-ENDO-001, whose P1-P3 concern the witness lattice built from several
      endomorphisms on ONE curve. Nothing here builds a lattice or a
      meet-in-the-middle, and no claim of this record depends on that hypothesis'
      status, which stays `approved` and untouched.
    - >-
      IDEA-20260807-413fcc, which closes the class-group-action oracle in its
      CURVE-VALUED form (return the curve c*E) by a zero-information argument.
      This record closes the POINT-VALUED form (return phi_c(h)) by a relabeling
      argument. The two forms of the same map need two different arguments, and
      the pair is what closes the class-group-action lane's oracle framing
      completely.

  object_first_candidate:
    tracked_object: >-
      lambda(h) = (alpha, beta) in (Z/N)^2, the formal linear form of a handle in
      the basis (P, Q) -- followed ACROSS CURVES, which is the new part. On E'
      the same pair is read in the basis (phi(P), phi(Q)).
    lossiness: >-
      GENUINELY LOSSY, and the transport setting is where the lossiness is most
      visible: lambda discards the curve itself. Two points on two different
      curves with different j-invariants, different coordinate fields worth of
      data, and different endomorphism-ring levels have the SAME lambda. The
      projection throws away 2*log_2(p) bits of coordinate data per point PLUS
      the entire identity of the curve, retaining 2*log_2(N) bits. It is not a
      change of coordinates: nothing about E' can be recovered from lambda.
    propagation: >-
      DETERMINISTIC AND EXACT, and this is the content of the record.
      lambda(phi(h)) = lambda(h) for every F_p-isogeny phi of degree coprime to
      N, because phi|_G is an injective homomorphism carrying the basis (P, Q) to
      the basis (phi(P), phi(Q)). It also propagates exactly under +, -, [n], and
      under every endomorphism (as multiplication by a scalar, H-ENDO-001). So
      lambda survives the ENTIRE isogeny class and the entire endomorphism ring.
      That is an unusually long survival for a tracked object and it is precisely
      why the object is useless as an attack lens: nothing an attacker can do to
      it changes it.
    survival_score: >-
      Survives: every group operation, every endomorphism, every F_p-isogeny with
      gcd(deg, N) = 1, every change of curve model, the whole isogeny class.
      Dies: at an isogeny whose degree shares a factor with N (which cannot
      happen for prime N unless deg is a multiple of N, i.e. phi kills G -- a
      degenerate case that must be excluded explicitly and is, in the assumption
      gcd(d, N) = 1); at any coordinate-valued map (R1); at a map into a
      different group (R6, R7). The survival is so complete that the object's
      HONEST SCORE IS NEGATIVE for attack purposes: an object that nothing
      destroys is an object that carries no distinguishing information, which is
      the correct reading of section 2 of the inventor protocol and is the
      opposite of the usual "long survival is good" heuristic. Recording that
      inversion is part of this proposal's contribution.

  mechanism: >-
    STEP 1 (zero compute) -- PROVE lambda-PRESERVATION. phi : E -> E' an
    F_p-isogeny, d = deg phi, gcd(d, N) = 1. Then ker(phi) intersect G is a
    subgroup of G of order dividing both d and N, hence trivial, so phi|_G is
    injective; it is a homomorphism; its image G' = phi(G) has order N and is
    generated by phi(P). And phi([alpha]P + [beta]Q) = [alpha]phi(P) +
    [beta]phi(Q). Therefore lambda is preserved on the nose. Four lines,
    elementary, and it is the whole simulator-correctness proof.

    STEP 2 (zero compute) -- WRITE THE SIMULATOR of (B) with its data structure
    (one hash table per curve, keyed by (alpha, beta), valued by label) and count
    its cost: O(1) amortized lookups, 0 group-oracle calls, memory linear in the
    number of distinct (curve, linear form) pairs the adversary has touched --
    which is at most q, so memory is O(q) and is charged.

    STEP 3 (zero compute, THE STEP THAT COULD FAIL) -- THE MULTI-ENCODING
    COUNTING ARGUMENT of (C). Write out Shoup's collision count with r label
    tables and verify that the failure probability is still bounded by
    binomial(q,2)/N. Check specifically whether an adversary can extract anything
    from an equality test ACROSS tables; the answer should be that cross-table
    equality is not a defined operation, and if the model as this campaign uses
    it DOES define it, the argument must be redone. This is where a reviewer
    should look.

    STEP 4 (bounded toy compute, <= 20 minutes) -- THE COROLLARY-1 CONTROL, which
    is the only part that touches a machine and is an INSTRUMENT test, not a
    mathematical one. Enumerate a small F_p-isogeny class at p <= 2^20 using the
    existing harness (harness/toycurve.py), and measure, on every curve in the
    class with instances transported by T1 so that k is identical: (i) Pollard
    rho step count with a fixed seed and a transported walk, (ii) relation yield
    for a factor base of fixed SIZE (not fixed content), (iii) BSGS table size.
    Corollary 1 predicts these are EXACTLY equal across the class up to the
    walk's own randomisation. A nonzero within-class variance in (i)-(iii), with
    seeds matched, means the instrument or the transport implementation is
    faulty; it is not a discovery. THIS IS THE CHEAPEST AVAILABLE TWO-DIRECTIONAL
    CHECK ON L1's INSTRUMENT and it is available before L1 spends anything.

    STEP 5 (zero compute) -- PUBLISH THE REDIRECTION: L1, L2, L3, L10 and L13
    must state, for any within-class variance they report, which resource the
    varying functional consumes. Group-level functionals may not vary.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      ripgrep via the harness Grep tool (semantics of `grep -ril`), 2026-08-07,
      over ledger/, knowledge/, docs/, analysis/ and the wider tree. Patterns:
      "isogeny.transport|transport oracle|relabel|re-encoding|second encoding|
      multi-encoding"; "simulab|simulator|generic-group"; "Oracle A|Oracle B|
      Oracle C|Oracle D".
    results: >-
      122 occurrences of the transport/relabel pattern across 82 files, but
      inspection shows almost all are unrelated senses ("relabel" in AES records,
      "transport" in dispatch and archive language). The transport THEOREM is
      stated in analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md as
      T1/T2 and in ledger/goals/GOAL-ENDO-001/goal.yaml. No record in the corpus
      states a generic-group SIMULATOR for isogeny transport, states the
      multi-encoding invariance of Shoup's bound, or derives zero within-class
      variance of group-level functionals as a consequence. KN-FIND-b7e091
      handles the endomorphism case only.
    verdict: adaptation
  novelty_screen_note: >-
    ADAPTATION. T1 is the campaign's own frozen fact and the simulator is a short
    exercise on top of it; the multi-encoding invariance of the generic bound is
    an extension of a standard counting argument. What is proposed as new to this
    program is the combination and its consequence (Corollary 1 as a control on
    L1's instrument). No external-literature novelty is claimed and none was
    checked beyond the corpus; a published multi-encoding generic-group statement
    would be an ingredient and should be logged if found.

  null_object_control: >-
    MANDATORY AND BLOCKING, matched in shape to the transported comparison.
    NULL OBJECT: a MATCHED RANDOM CURVE E'' at the same p with the same
    prime-order subgroup size N but in a DIFFERENT isogeny class (different
    trace), carrying an INDEPENDENTLY DRAWN k''. Corollary 1's group-level
    functionals must be equal across the transport class AND must show their
    ordinary instance-to-instance spread on the null. If the null shows zero
    spread too, the measurement is insensitive and proves nothing about
    transport; if the transport class shows the same spread as the null, either
    transport is not being implemented correctly or Corollary 1 is false.
    DECAY PARAMETER: the isogeny degree d, taken over an increasing ladder
    d in {2, 3, 5, 7, 11, ...} and over composite walks of increasing length
    L in {1, 2, 4, 8} steps. Corollary 1 predicts NO decay -- exact equality at
    every d and every L -- which is the unusual case where INVARIANCE is the
    prediction and any drift with d or L is the artifact tell. This inverts the
    usual decay test and the inversion is stated explicitly so it is not
    misapplied: here a quantity that DOES change with the parameter meant to be
    irrelevant is the signature of a broken instrument.
    THIRD CONTROL: a deliberately BROKEN transport (apply a map that is not an
    isogeny, e.g. a random bijection of point sets). The measurement must show
    the group-level functionals differing, confirming the instrument can see a
    transport failure at all.

  assumptions:
    - >-
      phi is an F_p-rational isogeny with gcd(deg phi, N) = 1, so phi|_G is
      injective. For prime N this fails only if N | deg phi, which is excluded
      explicitly and must be checked by any implementation.
    - >-
      The adversary is generic: it manipulates handles and does not read
      coordinates. The moment it reads coordinates on E' it is outside this
      record's scope, by design, and is in IDEA-20260807-070d03's scope.
    - >-
      The simulator knowledge set is the frozen one: {handles, group oracle,
      p, a, b, N, lambda}, excluding coordinates and k.
    - >-
      The multi-encoding extension of Shoup's counting argument holds, OR the
      weaker fallback in (C) holds. This is the load-bearing external assumption
      and it is flagged as asserted-with-argument rather than quoted.
    - >-
      Transport cost is not charged to the simulator because the simulator does
      not perform it. A real adversary computing phi pays d-dependent cost; that
      cost is real and is charged in any concrete algorithm, but it cannot buy an
      advantage since the destination is generically identical.

  proof_search_map:
    bottleneck: >-
      Step 3, the multi-encoding counting argument. lambda-preservation (Step 1)
      is elementary and the simulator (Step 2) is mechanical; the entire risk
      sits in whether r independent label tables leave Shoup's collision bound
      untouched. That is the exact step whose failure changes the theorem, and it
      costs zero compute to audit.
    baseline_embedding:
      parameter_slice: >-
        d = 1, i.e. phi = identity, E' = E, one label table. At this slice the
        simulator degenerates to the ordinary generic-group simulator and the
        bound must be exactly Shoup's Omega(sqrt(N)) with no multi-encoding term.
        Second slice: phi an ENDOMORPHISM (E' = E), where the record must
        reproduce KN-FIND-b7e091's Oracle D verdict -- SIMULABLE -- as a special
        case, with lambda multiplied by the public scalar instead of preserved.
      reproduction_check: >-
        SYMBOLIC at both slices, plus a frozen fixture: run the simulator
        specification at d = 1 and check it is literally the standard simulator;
        run it at phi = an endomorphism of a j = 0 toy curve and check the
        verdict matches Oracle D's recorded SIMULABLE. A mismatch at either slice
        means the construction is not a generalization of what the corpus already
        holds, and halts the line.
    observation_collision:
      observable: >-
        lambda(h) in (Z/N)^2, and derivatively the verdict SIMULABLE with
        T_sim = 0.
      distinct_preimage_search: >-
        REQUIRED AND IT SUCCEEDS MASSIVELY, WHICH IS THE POINT. Every curve in
        the isogeny class -- all h of them -- gives a distinct object with the
        SAME observable: same lambda, same verdict, same T_sim. The collision
        class is the entire class. Ordinarily a collision falsifies
        identifiability; here it IS the theorem, because the claim being made is
        precisely that the observable cannot distinguish the curves. The
        additional condition that separates the colliding objects is R1/R2 data
        -- coordinates and the curve equation -- which is exactly what
        paragraph (E) says a lane must consume to get anything. So the collision
        search does not falsify this proposal; it locates where the campaign's
        remaining hope must live, and a reviewer should check that this reading
        is not being used to immunize the record against falsification: the
        genuine falsifier is (F), a sub-sqrt(N) generic adversary using
        transport.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move "does walking the isogeny class help?" into the generic model,
          where it becomes the exact question "does lambda change?", with a
          one-line answer. Encoding obligation: handles and label tables.
          Completeness: every class member is reachable in the model at zero
          cost, which is MORE generous than reality and therefore safe for a
          negative result. Soundness: the simulator must be indistinguishable.
          Transfer: the conclusion transfers to any adversary that does not read
          coordinates, and to no other. Cost-loss: the model gives the walk away
          for free, so a real adversary is strictly worse off, which strengthens
          the negative.
        predicted_gain: >-
          Removes an entire axis (which curve in the class) from the campaign's
          search space at zero compute, and converts one of the campaign's
          pre-registered [open] predictions into a derived control. No attack
          speedup; the gain is in eliminated work.
      - transform: stronger_invariant
        proposed_object: >-
          Carry (lambda, curve identity) rather than lambda alone. The pair is
          what a coordinate-reading adversary actually holds, and tracking it
          makes explicit that ALL cross-curve information lives in the second
          component -- which is R2 -- and none in the first.
        predicted_gain: >-
          Gives L1 a resource-stratified measurement design for free: any
          functional it measures is classified by which component it reads, and
          only second-component functionals may vary.
    quantifier_order: >-
      CLAIMED, SIMULABLE branch, and the order is load-bearing:
        EXISTS one simulator S (the label-table construction, fixed once and
        independent of everything below),
        FORALL primes p, FORALL curves E/F_p with a prime-order subgroup G of
        order N, FORALL F_p-isogenies phi with gcd(deg phi, N) = 1, FORALL
        generic adversaries A, FORALL k,
        A's view with the real transport oracle is identically distributed to its
        view with S, and S makes 0 group-oracle calls per query.
      The simulator is quantified BEFORE the isogeny and before k. This matters
      concretely: a simulator allowed to depend on phi could be given phi's
      kernel or its degree, and a simulator allowed to depend on k proves
      nothing. Neither is needed -- the construction uses only lambda -- and the
      fact that it does not need them is what makes the strong quantifier order
      achievable.
      THE WEAKER READING NOT CLAIMED: FORALL phi EXISTS S_phi. Satisfiable but
      uninteresting, and it would not support the campaign-wide corollary.
      COROLLARY 1's ORDER: FORALL group-level cost functionals C (functions of
      the group-operation transcript alone), FORALL pairs E, E' in one class,
      FORALL transported instances, C(E) = C(E'). The universal over C comes
      first, which is why the corollary is a control on the instrument rather
      than a prediction about a particular measurement.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For adversaries that do not read coordinates, moving within an
        F_p-isogeny class is free and worthless, and every group-level cost
        functional is exactly class-constant." It can NEVER certify that a
        cost-minimising curve does not exist -- only that finding one requires an
        R1/R2 functional; nor that transport is cheap in reality (it is not,
        for a specified target: T5's vectorization is ~p^{1/4}); nor anything
        about supersingular curves over F_{p^2}, where End has rank 4 and the
        whole analysis differs.
      nearby_object_control: >-
        THE COORDINATE-READING ADVERSARY ON THE SAME WALK. Take the identical
        transport and let the adversary read x(phi(h)) on E'. The desired
        conclusion ("the walk is worthless") FAILS for it in principle, because
        the factor-base decomposition probability on E' is an R1 quantity that
        the model deliberately discards. A method that could not tell these two
        adversaries apart would not have identified the load-bearing structure;
        this one distinguishes them exactly, and the boundary is the coordinate
        read. That is the honest ceiling and it is where L1's real question
        begins.
        A SECOND nearby object: an isogeny of degree divisible by N, which is not
        injective on G and for which lambda-preservation is false. Excluded by
        assumption, named here so the exclusion is visible.
    proof_obligations:
      - claim: >-
          phi|_G is injective and lambda(phi(h)) = lambda(h) when
          gcd(deg phi, N) = 1.
        responsibility: correctness
      - claim: >-
          The label-table simulator is perfectly indistinguishable and makes 0
          group-oracle calls per query, with O(q) memory.
        responsibility: correctness
      - claim: >-
          Shoup's collision bound is unchanged under r independent encodings of
          the same group; or, failing that, degrades by at most poly(r).
        responsibility: strictness
      - claim: >-
          The d = 1 slice reproduces the standard generic simulator and the
          endomorphism slice reproduces KN-FIND-b7e091's Oracle D verdict.
        responsibility: baseline
      - claim: >-
          Corollary 1 (zero within-class variance of group-level functionals)
          follows from lambda-preservation.
        responsibility: correctness
      - claim: >-
          The toy Step-4 measurement is reported as an instrument check and never
          as evidence for the corollary.
        responsibility: scope

  predictions:
    - metric: >-
        within-class variance of Pollard rho step count, with seeds and walk
        function transported so the walks correspond exactly, over every curve in
        an enumerated toy isogeny class
      direction: different
      minimum_effect: >-
        EXACTLY ZERO -- bitwise identical step counts, not merely statistically
        indistinguishable, because the transported walk visits corresponding
        points. Any nonzero variance under matched seeds is an implementation
        fault in the transport, not a mathematical result, and the run is
        INVALID rather than negative (AGENTS.md rule 5). Pre-registered.
    - metric: >-
        within-class variance of relation yield at fixed factor-base SIZE and of
        BSGS table size
      direction: different
      minimum_effect: >-
        Exactly zero for BSGS table size (it is ceil(sqrt(N)) and N is class
        constant). For relation yield at fixed factor-base SIZE with the factor
        base drawn by the same rule on each curve, zero up to the sampling
        randomness of the draw, which must be quantified by repeating the draw
        20 times per curve. A yield difference exceeding the within-curve draw
        spread would contradict Corollary 1 and must be escalated.
    - metric: >-
        drift of any group-level functional with isogeny degree d over the ladder
        {2,3,5,7,11} and walk length L over {1,2,4,8}
      direction: different
      minimum_effect: >-
        ZERO drift. This is the inverted decay test: invariance is predicted and
        drift is the artifact tell. Any monotone trend in d or L indicates the
        transport implementation is losing correspondence, most likely by
        renormalising the generator, and the fix is in the implementation.
    - metric: >-
        simulator group-oracle calls per transport query
      direction: lower
      minimum_effect: >-
        0, with O(1) amortized dictionary operations and O(q) memory. If a
        correct simulator requires any group-oracle call, T_sim > 0 and the
        closure acquires a caveat it currently does not have.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, 1 hour, HARD GATE): prove lambda-preservation; write
      the simulator; count its cost; audit the multi-encoding counting argument.
      If lambda-preservation fails the record ends here.
      STAGE 1 (zero compute): check both baseline slices (d = 1 and phi an
      endomorphism) against the standard simulator and against Oracle D.
      STAGE 2 (toy compute, <= 20 min): enumerate one small F_p-isogeny class at
      p <= 2^20 with harness/toycurve.py; implement T1 transport for each edge;
      verify the transport certificate independently (check phi(P) has order N
      and phi(Q) = [k]phi(P) for the KNOWN toy k, which is available at toy scale
      and is the cheapest possible correctness certificate).
      STAGE 3 (toy compute, included in the 20 min): measure the three
      group-level functionals across the class with matched seeds; run the
      matched-random-curve null; run the broken-transport control; run the d and
      L ladders.
      STAGE 4 (zero compute): publish Corollary 1 as a blocking control for L1
      and the resource-stratification requirement for L1/L2/L3/L10/L13.
    controls:
      - >-
        matched random curve at the same p and same N in a different isogeny
        class with independent k (null direction)
      - >-
        deliberately broken transport, a non-isogeny bijection (planted-failure
        direction: the instrument must see it)
      - >-
        degree ladder d in {2,3,5,7,11} and walk-length ladder L in {1,2,4,8}
        (inverted decay test: invariance predicted)
      - >-
        d = 1 identity slice and endomorphism slice (baseline reproduction)
      - >-
        transport certificate: phi(P) has order N and phi(Q) = [k]phi(P),
        verified independently of the transport code
    required_metrics:
      - simulator group-oracle calls per query and memory in entries
      - within-class variance of rho step count, relation yield, BSGS table size,
        with matched seeds
      - the same three on the matched-random-curve null
      - transport certificate pass/fail per edge
      - drift of each functional across the d and L ladders
      - result of the broken-transport control

  falsification_conditions:
    - >-
      lambda-preservation fails: an F_p-isogeny with gcd(deg, N) = 1 for which
      phi([alpha]P + [beta]Q) is not [alpha]phi(P) + [beta]phi(Q). This would
      contradict phi being a homomorphism and would indicate an error in the
      record or the implementation; it is the cleanest possible falsifier and it
      costs nothing to check.
    - >-
      The multi-encoding counting argument fails and the degradation is worse
      than poly(h). The strong claim in (C) is withdrawn and the fallback is
      re-examined; the corollaries survive because they follow from
      lambda-preservation alone, not from the bound.
    - >-
      Nonzero within-class variance in a group-level functional under matched
      seeds and a passing transport certificate. Corollary 1 is false, which
      would contradict an elementary argument and must be replicated
      independently before being reported as anything other than a suspected
      implementation fault.
    - >-
      The broken-transport control is NOT detected. The instrument cannot see a
      transport failure, so every zero-variance result it produced is void and
      the run set is INVALID rather than confirming.
    - >-
      A generic adversary is exhibited that uses the transport oracle to solve
      ECDLP in fewer than c*sqrt(N) group operations. This contradicts Shoup via
      the simulator and would be a finding about the generic model itself,
      requiring the review escalation of AGENTS.md rule 12.

  confounders:
    - >-
      GENERATOR RENORMALISATION. If the implementation picks a fresh generator on
      E' rather than using phi(P), the linear forms are rescaled by a unit and
      the measured correspondence breaks even though the mathematics is fine.
      This is the single most likely cause of a spurious nonzero variance and the
      transport certificate is designed to catch it.
    - >-
      WALK-FUNCTION MISMATCH. Pollard rho partitions by a function of the point's
      coordinates. Transporting the walk requires transporting the PARTITION, not
      just the points; if the partition is recomputed from E' coordinates the
      walks diverge and step counts differ for a purely R1 reason. That
      divergence is REAL and INTERESTING -- it is R1 variance, exactly what
      Corollary 2 predicts is the only place variance can live -- and it must not
      be mistaken for a violation of Corollary 1. The measurement must report
      both the transported-partition and recomputed-partition step counts.
    - >-
      COFACTOR AND SMOOTHNESS at toy scale. At p <= 2^20 the group order can be
      smooth and Pohlig-Hellman (KN-TECH-030) can dominate, making step counts
      meaningless. Every curve in the class must have its order factored and its
      largest prime factor recorded before any count is used.
    - >-
      CLASS ENUMERATION COMPLETENESS. A "class" that is actually a partial walk
      gives a biased sample. The enumeration must be certified complete by
      matching the class size against the class number of the order, or reported
      as partial.

  interpretation_limits:
    - >-
      Scoped to F_p-rational isogenies of degree coprime to N, prime-order
      subgroups, ordinary prime-field curves, and adversaries that do not read
      coordinates. Nothing transfers to supersingular curves over F_{p^2}.
    - >-
      Closes the transport ORACLE, not the isogeny-class axis. Paragraph (E) is
      the boundary: R1/R2 differences between curves are entirely untouched and
      remain L1's question.
    - >-
      Corollary 1 is a CONTROL on L1's instrument, not a result about ECDLP. Its
      value is that it makes a class of L1 measurements uninterpretable-if-nonzero
      and therefore protects L1 from reporting an artifact as a finding.
    - >-
      The Stage 2-3 measurements are toy scale (p <= 2^20) and are instrument
      checks. The mathematical claims are scale-independent arguments and their
      support is Stage 0, not Stage 3.
    - >-
      Transport being free IN THE MODEL does not make it free in reality. A real
      walk to a SPECIFIED curve costs the vectorization problem, roughly p^{1/4}
      classically (DECOMPOSITION.md T5). The model's generosity strengthens the
      negative and must not be quoted as a statement about real cost.

  reachability_gate: >-
    DISCHARGED, AND IN THE STRONGEST POSSIBLE WAY. T5 asks whether a good curve
    in the class is reachable and at what cost. This record answers a prior
    question: FOR A GENERIC ADVERSARY THERE IS NO GOOD CURVE, because every curve
    in the class presents the identical tracked object. Reachability therefore
    does not bind at all in the generic model -- the cost of reaching a specified
    curve (vectorization, ~p^{1/4} classically, versus O(log p) steps to a random
    one under GRH) is a cost for a benefit that is provably zero. The gate binds
    again, unchanged, the moment a lane consumes R1 or R2 at the destination, and
    at that point the lane owes the full T5 analysis: is the good destination
    common enough to hit by random walking, or locally detectable at each step?
    This record does not answer that and does not claim to.

  heuristic_assumptions:
    - id: H1
      statement: >-
        MULTI-ENCODING GENERICITY. For a cyclic group of prime order N presented
        to a generic adversary through r independent uniformly random label
        tables (one per curve in an isogeny class), with the same underlying
        element identified across tables by its linear form, the probability that
        an adversary making q oracle calls finds a nontrivial collision is at
        most binomial(q,2)/N -- the same bound as for r = 1.
      rigorous_support: >-
        The r = 1 case is Shoup's theorem (KN-LIT-011, KN-TECH-005), rigorous and
        cited. The extension to r > 1 is argued in (C) from the independence of
        the label tables and the fact that cross-table equality is not a defined
        operation; it is NOT quoted from a source, and I did not locate a written
        multi-encoding statement in this corpus. The classical statement it
        imitates is the standard birthday/collision-counting bound, which is
        insensitive to how the range is partitioned when the draws are
        independent. If the extension fails, the fallback of (C) applies: any
        degradation polynomial in r leaves the exponent 1/2 intact whenever
        r = poly(log p), and the class number satisfies h = p^{1/2 + o(1)} in the
        worst case, so even a linear-in-h degradation would cost at most a
        quarter of the exponent -- which would be a serious weakening and is
        exactly why the audit in Step 3 is the bottleneck.
      validation_plan: >-
        NOT VALIDATED BY SAMPLING -- it is a proof obligation, and the validation
        route is an independent review of the counting argument by a
        review-adversarial session, plus a literature scout for a written
        multi-encoding generic-group bound (log any hit to knowledge/literature/
        whether or not it supports the claim). A toy-scale experiment cannot
        validate a generic-model bound and none is proposed; simulating r label
        tables at p <= 2^20 would measure the harness, not the theorem. This is
        recorded so that no one later presents a toy simulation as support for
        H1.
    - id: H2
      statement: >-
        TOY CLASS REPRESENTATIVENESS. An enumerated F_p-isogeny class at
        p <= 2^20 exhibits the same lambda-preservation behaviour as one at
        cryptographic size.
      rigorous_support: >-
        lambda-preservation is a theorem with no size dependence, so H2 is not
        load-bearing for any claim -- it matters only for whether the Stage 3
        instrument check is informative about instruments that will later be run
        at larger sizes. It is listed so that the toy/crypto boundary is explicit
        rather than assumed.
      validation_plan: >-
        Report the class size, the class number of the order, the factored group
        order and the largest prime factor for every curve used, so a reader can
        judge representativeness directly. No extrapolation to cryptographic
        scale is performed and none is licensed by this record.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. The claim about exponents is a preservation
      claim: with the transport oracle available for an entire isogeny class of
      any size h, the generic exponent remains 1/2, i.e. Omega(sqrt(N)) group
      operations, with T_sim = 0 so there is not even a charged-work caveat.
      Under the fallback in (C) the worst admitted degradation is polynomial in
      h, which leaves the exponent unchanged for h = poly(log p).
    memory_exponent: >-
      Simulator memory is O(q) entries -- one per distinct (curve, linear form)
      pair touched -- which is charged and is not free. For an adversary making
      sqrt(N) queries across h curves this is sqrt(N) entries, i.e. the same
      memory as BSGS, and it is worth stating that the SIMULATOR is memory-hungry
      even though the closure it supports is about time.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); automorphism-
      discounted variant on CM curves (KN-TECH-018); BSGS at sqrt(N) time and
      memory (KN-TECH-031).
    hidden_overhead: >-
      Two disclosures. First, the O(1) amortized simulator cost hides O(q)
      memory, stated above. Second, and larger: "the walk is free" is true only
      IN THE MODEL. A real adversary pays for phi -- Velu's formulas at cost
      linear in the degree, or a chain of small-degree steps -- and pays the
      vectorization cost for a specified destination. The model gives this away
      to strengthen a negative result; quoting it as a statement about real
      transport cost would be a serious misreading.
    tradeoff_note: >-
      No cryptanalytic tradeoff is introduced. The one tradeoff visible here is
      the simulator's own: O(q) memory buys O(1) amortized time per transport
      query, and a memory-free simulator would have to recompute labels, which is
      impossible since labels are random. That is a fact about the proof
      technique, not about any attack.

  dominated_by: >-
    AS AN ATTACK: none mounted; the record's content is that a proposed attack
    axis is empty. Dominated by every row of the prime-field frontier, checked
    individually across time, memory and data/queries: parallel rho with
    distinguished points (0.886*sqrt(N) time, O(1) memory, 0 queries) dominates
    on all three; automorphism-discounted rho on CM curves (KN-TECH-018)
    dominates by up to sqrt(6) further on time at equal memory; BSGS
    (KN-TECH-031, sqrt(N) time and memory) dominates as well, this record having
    no frontier point. `null` would be a fabrication.
    AS A CLOSURE: the incumbents are DECOMPOSITION.md T1/T2 (which establish
    transport but leave the walk's value open) and KN-FIND-b7e091's Oracle D
    (which closes the endomorphism case only). This record dominates both on
    SCOPE for the isogeny case and is dominated by both on VALIDATION STATUS,
    T1/T2 being frozen campaign facts and Oracle D having an archived evidence
    record and Coordinator decision.
  sota_delta: >-
    Zero speedup against any attack baseline: 0 time, 0 memory, 0 queries.
    Closure delta in numbers: T_sim = 0 group operations per transport query
    versus the O(m) and O(log N) of the two classes KN-FIND-b7e091 closed, so
    this is the tightest simulability verdict in the campaign alongside
    IDEA-20260807-413fcc; it removes h - 1 curves from the campaign's search
    space per isogeny class at zero compute cost, where h is the class number
    (up to p^{1/2+o(1)}); and it converts one of DECOMPOSITION.md section 5's
    four pre-registered [open] predictions into a derived control, reducing L1's
    interpretive burden by one degree of freedom.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.97 that lambda-preservation holds -- it is four lines of elementary group
    theory and I have written them out. 0.75 that the multi-encoding counting
    argument survives an adversarial review in its strong form; the fallback
    covers the rest and the corollaries do not depend on it. 0.8 that the toy
    instrument check shows exactly zero within-class variance under matched
    seeds, with the residual risk concentrated in the walk-function-partition
    confounder, which I expect to bite at least once and which is itself
    informative when it does. Overall 0.9 that the record's central verdict
    (transport is a relabeling, inadmissible, closed) survives, and that verdict
    subtracts an axis from the campaign rather than adding one -- which is the
    honest description of its value.

