idea:
  id: IDEA-20260823-69a3a0
  title: Supplied-term sensitivity barrier for the P1553 target-local locator
  class: control
  claim: >-
    In the declared ST-EVR family, where the fresh-target table
    e_(a,v)=kappa(R-a-v) for a in I_5 and v in D_34 is available only by
    individual scalar queries and correctness is required for every formal
    table, an exact algorithm returning z_R must query every one of the
    Theta(B^3) entries in the worst case. This is a scoped oracle-family
    counterexample, not a lower bound for elliptic-net, division-polynomial,
    circuit, data-structure, or generic ECDLP algorithms.
  mechanism: >-
    Fix any root c of H_12. Answer every fresh-target term query with a value
    outside the root set of H_12. If an entry (a0,v0) remains unqueried, two
    formal tables have the identical transcript: the all-off-root table has
    z_R=1, while the table changing only e_(a0,v0) to c has
    (T-t_(a0)) dividing z_R. Exact output therefore forces B times |D_34|
    queries. The proof deliberately enlarges actual elliptic tables to
    independent formal tables and consequently says nothing about an
    operation exploiting their elliptic dependence.
  novelty_status: unverified
  citations:
    - ref: internal:P1553-R4
      provenance: internal
      claim: Supplies the exact g_I, H_12, H_34^R, r_R, z_R interface and the open nonlinear variable-coefficient exception.
      verified_by: Coordinator read bundle 3 of 2026-08-23
    - ref: internal:IDEA-121-KU-and-translated-product-V3
      provenance: internal
      claim: Supplies the neighboring compact-product, source-jet, and represented-route boundaries.
      verified_by: Coordinator read bundle 4 of 2026-08-23
    - ref: https://arxiv.org/abs/0710.1316v4
      provenance: retrieved
      claim: The primary page states that elliptic nets are multidimensional arrays attached to curves and specified points and satisfy nonlinear recurrences.
      verified_by: Idea Generator direct web retrieval on 2026-08-23
    - ref: https://arxiv.org/abs/0803.0728v2
      provenance: retrieved
      claim: The primary page states equivalences between named EDS hard problems and ECDLP at subexponential granularity; it does not itself instantiate this locator.
      verified_by: Idea Generator direct web retrieval on 2026-08-23
    - ref: https://arxiv.org/abs/2512.09601v2
      provenance: retrieved
      claim: The primary page states valuation formulas and recurrences for CM elliptic nets; this record does not infer a generic-prime target-label locator from that scope.
      verified_by: Idea Generator direct web retrieval on 2026-08-23
    - ref: https://eprint.iacr.org/2025/608
      provenance: retrieved
      claim: The primary page concerns nonlinear recurrences linked to supersingular isogeny graphs and endomorphism rings, a different interface from this ordinary prime-order target locator.
      verified_by: Idea Generator direct web retrieval on 2026-08-23
  assumptions:
    - A1: p is greater than 3 and G equals the prime-order subgroup generated by P, with N=p^(1+o(1)) and B=N^(1/5).
    - A2: I_5 has Theta(B) distinct public occurrence labels and D_34 has Theta(B^2) labelled occurrences.
    - A3: H_12 is nonconstant, so its root multiset in K is nonempty.
    - A4: ST-EVR algorithms receive each e_(a,v) only through an individual query and must be correct on every formal table over a field with at least one off-root value.
    - A5: The formal-table enlargement is not asserted to preserve the algebraic dependence of e_(a,v)=kappa(R-a-v) for actual elliptic inputs.
  proof_search_map:
    bottleneck: Obtain exact target support without materializing the B by B^2 fresh-target table or losing labelled-source replay.
    baseline_embedding:
      parameter_slice: Formal independent supplied-term tables with fixed nonconstant H_12 and distinct fifth labels.
      reproduction_check: The all-off-root table gives z=1; changing exactly one entry to a root c gives the one-hit factor T-t_a0.
    observation_collision:
      observable: The complete adaptive query transcript and returned monic support polynomial.
      distinct_preimage_search: Pair two tables differing only at one unqueried entry; they have one transcript but distinct exact outputs.
    constructive_transforms:
      - transform: Replace supplied independent scalars by a gauge-invariant variable-coefficient elliptic-net operation on the structured orbit.
        proposed_object: Exact dyadic subinterval unit products or z_R directly, with no B^3 endpoint vector.
        predicted_gain: Could evade the adversary because one recurrence operation may depend on many formally coupled entries; no such transform is supplied here.
    quantifier_order: For every deterministic exact ST-EVR algorithm correct on every formal table, there exists a fresh-target table forcing Theta(B^3) scalar queries; randomized zero-error algorithms are fixed coin-by-coin. No statement is made for bounded-error or actual-elliptic-only algorithms.
    method_ceiling:
      strongest_certifiable_claim: Worst-case query lower bound for the explicitly declared formal supplied-independent-term family.
      nearby_object_control: A compressed recurrence oracle returning a whole subinterval product in one operation is outside ST-EVR and defeats the per-entry sensitivity premise.
    proof_obligations:
      - claim: The two adversarial tables yield identical transcripts.
        responsibility: Formal decision-tree induction.
      - claim: Their z support differs by T-t_a0.
        responsibility: P1553 evaluation identity and the one-hit/no-relation construction.
      - claim: The conclusion does not transfer to actual elliptic tables.
        responsibility: Explicit quantifier and representation audit.
    not_applicable_reason: null
  predictions:
    - Any ST-EVR algorithm claiming o(B^3) exact queries has a pair of transcript-colliding formal inputs with different z.
    - A genuine successful constructor must expose and exploit algebraic dependence before the table is represented as independent terms.
  minimal_test:
    design: No experiment is authorized; an independent reviewer checks the adaptive adversary and its output distinction symbolically.
    controls:
      - One-hit table with exactly one on-root entry.
      - No-relation table with all entries off the H_12 root set.
      - Compressed recurrence oracle outside ST-EVR as a proves-too-much control.
      - Actual elliptic table as a representation control where independent mutation is forbidden.
    required_metrics:
      - Number of independent fresh-target term queries.
      - Output support difference under a one-entry mutation.
      - Whether the mutation stays inside the claimed input family.
  falsification_conditions:
    - An exact ST-EVR decision tree returns correct z on all formal tables after leaving an entry unqueried.
    - The one-entry on-root mutation does not change z under the frozen P1553 definitions.
    - The family definition implicitly grants a bulk operation depending on unqueried entries.
  confounders:
    - Actual elliptic term tables are highly dependent and do not permit arbitrary one-entry mutation.
    - A bounded-error algorithm needs a distributional argument not present here.
    - If H_12 is empty or the field has no off-root value, the chosen adversary slice is unavailable.
    - z_R records fifth-label support, not row multiplicity or the compatible source pair.
  interpretation_limits:
    - No generic lower bound, lane closure, novelty, speedup, implementation, experiment, or ECDLP result.
    - No positive constructor for r_R modulo g_I or for exact dyadic unit products.
    - No source replay within B^(5/4+o(1)) and no success, factor-log, or descent argument.
  heuristic_assumptions: []
  target_complexity:
    time_exponent: "conditional target N^0.45 campaign and N^0.25 per fresh target; not achieved"
    memory_exponent: "conditional target N^0.40; not achieved"
    best_known: "generic rho N^0.50 time with low memory; comparison only, no realized route"
    hidden_overhead: "field and bit operations, all strata, advice, replay, misses, retries, communication, and parallelism remain charged"
    tradeoff_note: "ST-EVR alone needs B^3=N^0.60 fresh-target scalar queries, already above both the B^1.25 online cap and the conditional N^0.45 campaign budget."
  estimated_cost:
    implementation: none; theorem-only zero-run control
    compute: zero runs
  recommended_priority: >-
    REVISE/select-none for a positive route. Preserve the sole exception and next
    seek an explicit oracle-free gauge-invariant structured recurrence operation
    whose bulk semantics invalidate the independent-term premise.
