  minimal_test:
    design: >-
      STAGE 0 (ZERO COMPUTE, HARD GATE). Independently re-derive (D1), (D2) and
      step 3/step 4 of the mechanism from the group law; check the two symbolic
      reductions of P1 and the parity consequence n_+ even at Z = 3. Halt on
      failure. Cost: minutes, no machine.
      STAGE 1 (THE CHEAPEST MEASUREMENT THAT CAN FAIL INFORMATIVELY). At
      p = 101, exhaustively enumerate the C(n_+ + n_-, 3) distinct-split base
      points on the TWO ARCHIVED WITNESS CURVES (A,B) = (2,12) and (4,1), plus
      the odd-order curve (A,B) = (1,35) as the Z = 0 boundary, and compute
      R_1 and R_2 (P2, P3, P7). 152,096 base points per curve; seconds to
      minutes with the arithmetic already in
      EXP-MONO-0e6e8f/implementation/run_uncond_census.py. THIS STAGE ALONE
      decides whether the closed form survives contact with a machine.
      STAGE 2 (THE DISCRIMINATOR, P4). Exhaustively scan all non-singular
      (A,B) in F_p^2 at p = 101 and at two further primes p = 1 mod 4 and one
      p = 3 mod 4, computing (t, Z, #E[4], #E^d[4], h_+, h_-) for every curve;
      report the satisfiability of the cell {Z=3, #E(F_p)[4]=4, #E^d(F_p)[4]>4}
      as a FACT before running anything on it. Census every curve found in that
      cell and read the 1^4 excess against the two competing predictions.
      STAGE 3 (NULL SEPARATION, P5). Run the identical measurement on the E6
      curve-free random-sign-function object and on uniformly random monic
      quartics.
      STAGE 4 (EXTENSION, REPORTED SEPARATELY AND NOT PART OF THE CLAIM).
      Measure the two non-split strata's degeneracy counts against the
      conjectured F_{p^2} / F_{p^3} analogues of H2, including the Red Team's
      identified 2,459-instance "1+2 | 1^4" residual on C1 and 101-instance
      "3 | 1^4" residual on C2.
    controls:
      - >-
        NULL OBJECT (mandatory, and the reason this record exists as more than
        a curve fit): the E6 curve-free random-sign-function object of
        EXP-MONO-0e6e8f's Red Team, which reproduces the entire five-class
        census at the frequency level. It must show split-stratum 2+1+1 = 0
        exactly. A null that also produces degeneracies voids the mechanism.
      - >-
        KNOWN-TRUE BOUNDARY: the odd-order curve (p=101, A=1, B=35, #E=121,
        Z=0), whose split-stratum 2+1+1 the Red Team already measured as
        exactly 0. Any implementation that emits a nonzero count there has a
        bug and every other number it produced is void.
      - >-
        DUAL INDEPENDENT CLASSIFICATION PATHS, mirroring IDEA-20260904-ad63fe's
        own control: PATH 1 factors Q_e over F_p with no knowledge of the
        mechanism; PATH 2 evaluates the mu-incidence rule. Disagreement on any
        base point voids the affected cell as an integrity failure, never a
        result.
      - >-
        MUTATION-TESTED POWER, measured not assumed: perturb one coefficient of
        S_4 by +1 and record the PATH1/PATH2 disagreement rate, and separately
        perturb h_+ by +1 and confirm the predicted counts move by exactly
        n_- and 3 n_-. A control not demonstrated capable of failing is
        recorded as "not evaluated", never as "passed".
      - >-
        EXHAUSTIVE, NOT SAMPLED. Every count in P2, P3, P4 is over the complete
        stratum, so there is no sampling error, no tolerance, and no power
        calculation to lose -- the failure mode H-MONO-1d50ac's history records
        for this lane.
      - >-
        j = 0 and j = 1728 are excluded from the generic arms and appear only
        as deliberately-studied members, per KN-OPEN-009's own requirement; any
        effect observed on them is checked against the extra-automorphism
        explanation before being attributed to anything else.
      - >-
        The h_+ / h_- computation is cross-checked two ways: by the 2-descent
        criterion (chi(x_T - x_{T'}) for the other two roots) and by directly
        counting points of exact order 4 on E and on E^d. Disagreement is an
        implementation failure.
    required_metrics:
      - R_1 and R_2 per curve, as exact integers, on the exhaustive split stratum
      - (t, Z, #E[4], #E^d[4], h_+, h_-, n_+, n_-) per curve, dual-computed
      - the Stage 2 cell-satisfiability scan result, reported whether or not the cell is populated
      - 1^4 excess on every h_- > 0 curve found, against both competing predictions
      - E6 null and random-quartic split-stratum degeneracy counts
      - PATH1/PATH2 agreement rate and the mutation-test disagreement rate
      - the two non-split strata's residuals, reported separately and outside the claim

  falsification_conditions:
    - >-
      F1 (ZERO COMPUTE, PRIMARY) -- P1 fails: (D3) does not reduce to (C4) at
      D = 0, or predicts a nonzero split-stratum 2+1+1 at Z = 0. The derivation
      is wrong; the record is withdrawn by supersession and no compute is spent.
    - >-
      F2 -- R_1 or R_2 is nonzero on ANY tested curve with Z = 3 and the dual
      path agreeing. The closed form is false. Note this is decidable exactly:
      the stratum is enumerated exhaustively and the residual is an integer.
    - >-
      F3 (THE INVARIANT QUESTION, AND THE MOST INFORMATIVE OUTCOME EITHER WAY)
      -- on a curve with h_+ = 0 and h_- > 0 the 1^4 excess is 0 rather than
      h_- n_+. The twist half of (D1) is wrong, #E(F_p)[4] IS the operative
      invariant, and the Red Team's naming stands unamended. This record must
      report that as the headline, not absorb it.
    - >-
      F4 -- the E6 curve-free null shows a nonzero split-stratum degeneracy
      count. The mechanism is not attributable to the group law; NOTHING is
      concluded in either direction and the outcome is an instrument result.
    - >-
      F5 -- h_+ != (#E(F_p)[4] - tau)/4 on any curve, or the parity law P6
      fails anywhere. An arithmetic error upstream; every h-dependent number is
      void until it is fixed.
    - >-
      F6 -- an independently coded exhaustive census does NOT reproduce the
      archived witness integers {38180, 107184, 6732} / {38092, 107008, 6996}.
      Then (D4) is a fit to numbers that do not survive replication and the
      whole record rests on nothing; the review-side probe's own
      not-evidence-eligible status is thereby vindicated.
    - >-
      F7 (THE PLANNED NEGATIVE, PRE-REGISTERED) -- if the closed form holds
      everywhere tested and the batch does NOT emit a statement of what remains
      open, the work is unfinished. The required forward guidance, fixed here
      before any run: (i) the two non-split strata, whose F_{p^2}/F_{p^3}
      analogues are conjectural (H2); (ii) Z in {0,1}, where the special-pair
      argument does not apply; (iii) m >= 5, where the sign group is larger and
      the incidence combinatorics is not this one; (iv) the relation-rate half
      of KN-OPEN-009, untouched here. A closure without these four is a fatigue
      report under docs/inventor-protocol.md section 4.

