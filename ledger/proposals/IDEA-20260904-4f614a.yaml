idea:
  id: IDEA-20260904-4f614a
  id_allocation_provenance: >-
    Minted by the Coordinator via `python3 tools/allocate_id.py --next idea
    --date 20260904`, checked free via `--check` before use (0 occurrences
    across 148021 identifier-bearing paths). No identifier was minted by the
    drafting subagent, per its own note (it has no Bash/shell tool).
  question_id: RQ-MONO-001
  added: '2026-09-04'
  status: proposed
  proposed_by: idea-generator
  class: mechanism

  title: >-
    THE m=4 SYMMETRIC-BASE CENSUS'S #E[4] DEPENDENCE IS THE FIXED-POINT COUNT OF
    THE 2-TORSION TRANSLATION INVOLUTIONS ON THE x-LINE, AND THE OPERATIVE
    INVARIANT IS THE PAIR (#E(F_p)[4], #E^d(F_p)[4]), NOT #E(F_p)[4]. An exact,
    zero-free-parameter closed form for the distinct-split stratum's three class
    counts, which reproduces both of the Red Team's matched-(t,Z) witness curves
    integer-for-integer (6 of 6 integers) and predicts a curve family on which
    "#E[4] is the invariant" must fail.

  claim: >-
    SCOPE FIRST. m = 4 only. Prime fields F_p, p > 3, toy range. E : y^2 = f(x)
    = x^3 + Ax + B non-singular. The object is the SYMMETRIC-BASE Semaev quartic
    Q_e(T) of IDEA-20260904-ad63fe (C1), censused over base points
    (e1,e2,e3) in F_p^3. NO ECDLP, relation-rate, cost, or exponent claim is
    made anywhere in this record, and none is implied by any part of it. Claim
    tier: DERIVATION for the closed form, TOY for every measurement proposed to
    test it.

    NOTATION, FIXED ONCE.
      g(X) = X^3 - e1 X^2 + e2 X - e3, roots t_1,t_2,t_3.
      chi = the quadratic character of F_p (chi(0) = 0).
      Z = #{x in F_p : f(x) = 0} in {0,1,3};  tau = #E(F_p)[2] = Z + 1.
      t = p + 1 - #E(F_p);  n_+ = #{x : chi(f(x)) = +1};
      n_- = #{x : chi(f(x)) = -1};  n_+ + n_- = p - Z,  n_+ - n_- = -t.
      E^d = the quadratic twist of E by a non-residue (E and E^d share E[2]).
      For each T = (x_T, 0) in E[2](F_p)\{O}, define the TRANSLATION-BY-T MAP
      ON THE x-LINE
            mu_T(x) := x_T + f'(x_T) / (x - x_T),
      an involution of P^1 over F_p satisfying x(P + T) = mu_T(x(P)).
      h_+ := #{T in E[2](F_p)\{O} : T in 2E(F_p)}   = (#E(F_p)[4]   - tau)/4
      h_- := #{T in E[2](F_p)\{O} : T in 2E^d(F_p)} = (#E^d(F_p)[4] - tau)/4
      h   := h_+ + h_-   = #{T : chi(f'(x_T)) = +1}.

    (D1) THE INVOLUTION LEMMA. mu_T is an F_p-involution of P^1; its two fixed
    points are the roots of (x - x_T)^2 = f'(x_T), i.e. exactly the
    x-coordinates of the four points Q with 2Q = T. They are F_p-rational iff
    chi(f'(x_T)) = +1, in which case both carry the SAME value of chi(f(.)):
    +1 iff T in 2E(F_p), -1 iff T in 2E^d(F_p). The two cases are mutually
    exclusive, so h = h_+ + h_- and the number of F_p-rational fixed points of
    the family {mu_T} is exactly 2h = (#E[4] + #E^d[4] - 2tau)/2.

    (D2) THE DEGENERACY CRITERION. On the admissible stratum (g separable,
    Res(g,f) != 0) two of the four fibre points r_eps = x(eps_1 P_1 + eps_2 P_2
    + eps_3 P_3) coincide iff P_i + s P_j lies in E[2]\{O} for some i<j and some
    sign s, which -- because mu_T is sign-blind -- is EQUIVALENT to the purely
    x-coordinate condition  t_i = mu_T(t_j) for some T in E[2](F_p)\{O}.
    THIS IS THE SAME CRITERION EXP-MONO-005b49's own red-team-breakthrough
    review derived for the m=4 ROOT-MULTIPLICITY COLLISION RATE; that review's
    F = (#E[4] - tau)/2 is exactly the count of mu_T-fixed x-coordinates
    restricted to x-coordinates of E(F_p)-points. The two lanes are one
    mechanism read on two different ambient x-sets: the factor base
    x(E(F_p)) there, all of F_p here. Because the symmetric-base census draws
    x-coordinates from ALL of F_p, it sees the twist's order-4 points too, and
    that -- not #E[4] -- is the invariant it measures.

    (D3) THE EXACT CLOSED FORM, DISTINCT-SPLIT STRATUM, Z = 3. Let the base
    point range over the C(n_+ + n_-, 3) monic cubics g that split into three
    DISTINCT roots, none of them a root of f (the stratum EXP-MONO-0e6e8f's
    Red Team enumerated exhaustively, 152,096 points at p=101). Put
            D := h_+ * n_-  +  h_- * n_+ .
    Then, EXACTLY, with no error term and no free parameter:
            #1^4    = C(n_+,3) + C(n_-,3) + D
            #2+1+1  = 3 n_+ n_-  -  3 D
            #2+2    = C(n_+ + n_-, 3) - C(n_+,3) - C(n_-,3) - 3 n_+ n_- + 2 D
    The D-free part is exactly IDEA-20260904-ad63fe (C4) restricted to this
    stratum; D is the entire correction, and D depends on E only through
    (n_+, n_-, h_+, h_-), i.e. through (p, t, Z, #E(F_p)[4], #E^d(F_p)[4]).

    (D4) THE RETRODICTION, STATED AS A FIT AND NOT AS A PREDICTION. On the two
    curves of the Red Team's matched-(t,Z) witness (p=101, t=-10, Z=3, #E=112,
    so n_+ = 54, n_- = 44, C(54,3)+C(44,3) = 38048, C(98,3) = 152096):
      j=24, #E[4]=16  =>  h_+ = 3, h_- = 0, D = 132
         closed form  =>  {1^4: 38180, 2+2: 107184, 2+1+1: 6732}
      j=41, #E[4]= 8  =>  h_+ = 1, h_- = 0, D =  44
         closed form  =>  {1^4: 38092, 2+2: 107008, 2+1+1: 6996}
    These are the archived observed integers, all six, exactly. THIS IS A
    POST-HOC FIT WITH ZERO FREE PARAMETERS TO SIX INTEGERS, PERFORMED BY HAND
    IN THIS SESSION AND NOT MACHINE-VERIFIED; it is disclosed as such and is
    NOT evidence. The record's evidential content is (D5), which is a
    prediction on curves nobody has censused.

    (D5) THE DISCRIMINATING PREDICTION -- WHY "#E[4]" IS THE WRONG NAME FOR THE
    INVARIANT. At p = 1 mod 4 with Z = 3, #E[4] >= 8 forces #E^d[4] = tau, so
    h_- = 0 and D = h_+ n_- is a function of #E[4] alone: the Red Team's witness
    lives entirely in the regime where the two candidate invariants agree, which
    is why #E[4] was the invariant it named. They MUST disagree on curves with
        #E(F_p)[4] = tau = 4   AND   #E^d(F_p)[4] > 4,
    for which h_+ = 0, h_- > 0, and the closed form predicts
        #1^4 excess = h_- * n_+ > 0   while   #E(F_p)[4] takes its minimum.
    "The invariant is #E(F_p)[4]" predicts excess 0 there. Both are exact
    integer statements on an exhaustively enumerable stratum, so ONE curve
    decides between them.

    THE THREE OUTCOMES, DEFINED BEFORE ANY RUN.
    (I) The closed form is exact on every tested Z=3 curve, including the
    h_-> 0 cell: the m=4 symmetric-base census's curve dependence is completely
    explained, the invariant is named correctly as (#E[4], #E^d[4]), and
    (C4)'s "(t,Z) and nothing else" is repaired rather than merely refuted.
    (II) The closed form is exact on the h_- = 0 curves but WRONG on the
    h_- > 0 cell: the twist half of (D1) is wrong, #E(F_p)[4] is the correct
    invariant after all, and the mechanism needs the E-rational restriction
    that the collision-rate lane already uses.
    (III) The closed form fails on some Z=3 curve with h_- = 0: (D2) or (D3)
    is wrong outright, the mechanism is not the mu_T fixed-point structure, and
    the retrodiction in (D4) is a coincidence -- which would itself be a
    reportable finding given six exact integers.

  mechanism: >-
    THE LOAD-BEARING DERIVATION, IN FIVE STEPS. It uses nothing beyond the group
    law, the quadratic character, and counting.

    STEP 1 (why an involution appears at all). Translation by a rational
    2-torsion point T commutes with x-coordinate inversion, so it descends to
    the x-line as a Moebius map; writing f(x) = (x-e1)(x-e2)(x-e3) and
    T = (e1,0), the classical addition law gives
    x(P+T) = e1 + (e1-e2)(e1-e3)/(x(P)-e1) = e1 + f'(e1)/(x(P)-e1) =: mu_T(x(P)).
    mu_T is an involution because 2T = O. It swaps e1 <-> infinity and swaps the
    other two roots of f, so it preserves S := F_p \ Z(f) setwise. It also
    PRESERVES chi(f(.)): y(P+T)^2 = f'(e1)^2 y(P)^2 / (x-e1)^4, so
    chi(f(mu_T(x))) = chi(f(x)) for x in S.

    STEP 2 (the fibre degeneracy is a mu-incidence). The four roots of Q_e are
    the sign-class sums r_eps, indexed by V = F_2^3/<(1,1,1)> (H-MONO-45183a
    A-1, used not reproved). Two classes differing by the coset of e_i coincide
    iff 2(P_j +- P_k) = O for {j,k} the complementary index pair, i.e. iff
    P_j +- P_k lies in E[2]\{O}. Since x(T +- P) = mu_T(x(P)) for T in E[2],
    that is exactly t_j = mu_T(t_k). So the degenerate locus of the cover, cut
    out on the base, is the locus where g's root multiset meets one mu_T-orbit
    twice. THE PROJECTION IS SIGN-BLIND: this is why the collision does not
    depend on which square root of f(t_i) is chosen, and it is the same
    sign-blindness EXP-MONO-005b49's review used to explain why that
    experiment's fixed-sign and random-sign arms were byte-identical.

    STEP 3 (what a single collision does to the class label). Suppose exactly
    one relation holds, t_1 = mu_T(t_2), so P_1 = T +- P_2 and P_1 -+ P_2 = T.
    Then two of the four sign classes collapse onto the single rational value
    mu_T(t_3), and the remaining two roots are x(Q +- P_3) with Q = P_1 + P_2 =
    T + 2P_2. Those two are F_p-rational iff chi(f(x_Q)) = chi(f(t_3)). Because
    Frobenius acts on P_2 by +-1 and T is rational, Q lies on E(F_p) iff P_2
    does, so chi(f(x_Q)) = chi(f(t_2)) = chi(f(t_1)) EXCEPT when 2P_2 lies in
    E[2] (step 4). Hence, generically, a single collision maps
       (all three chi equal)  -> class 1^4  [the same label the collision-free
                                             character rule of (C3) predicts]
       (chi_3 differs)        -> class 2+1+1 [where the character rule said 2+2].
    So an ORDINARY collision moves mass 2+2 -> 2+1+1 and leaves 1^4 alone.

    STEP 4 (the 1^4 excess is a FIXED-POINT effect, and this is the whole
    #E[4] story). The exceptional case of step 3 is 2P_2 in E[2]\{O}, i.e. t_2
    is a fixed point of mu_{T'} for some T' != T -- i.e. t_2 is the
    x-coordinate of a point of order 4. Then x_Q is a root of f, both remaining
    roots collapse as well, and the fibre is (T - r_1)^2 (T - r_2)^2 with r_1,
    r_2 both rational: class 1^4 REGARDLESS of chi_3, where the character rule
    predicted 2+2 whenever chi_3 differs. The two rational fixed points of
    mu_{T'} are exchanged by the other two involutions and by nothing else, so
    they form exactly ONE such pair per halvable T'. Counting: h_+ pairs sitting
    in the chi=+1 half (their third-root excess is n_-) and h_- pairs sitting in
    the chi=-1 half (excess n_+). Total 1^4 excess = h_+ n_- + h_- n_+ = D.
    THIS IS THE ANSWER TO "WHY #E[4] AND NOT SOME OTHER FINER INVARIANT": the
    census's curve dependence is a count of RATIONAL HALVINGS OF RATIONAL
    2-TORSION, and #E[4] is precisely the invariant that counts them -- but on
    the x-line the halving only has to be x-rational, so the twist's order-4
    points count identically, and the true invariant is (#E[4], #E^d[4]).

    STEP 5 (the ordinary-pair count, and why there is no double counting).
    Within the chi = +1 half S_+ (size n_+), mu_T has (n_+ - F_T^+)/2 two-cycles
    with F_T^+ in {0,2}; summing over the Z = 3 involutions and removing the
    special pairs (each of which is a two-cycle of TWO of the three
    involutions, hence counted twice) gives A_+ = 3n_+/2 - 3h_+ ordinary pairs
    in S_+, and A_- = 3n_-/2 - 3h_- in S_-. Each ordinary pair contributes
    class 2+1+1 for exactly the n_-+ (resp. n_+) third roots of the OPPOSITE
    character, so #2+1+1 = A_+ n_- + A_- n_+ = 3 n_+ n_- - 3D. No triple is
    counted twice: chi is mu-invariant, so a second collision inside a triple
    forces all three characters equal, and such triples are excluded from the
    2+1+1 sum by the character condition and are class 1^4 under both the
    character rule and the true fibre, contributing no excess. INTERNAL PARITY
    CHECK, PASSED: Z = 3 forces 4 | #E, hence t = p+1 mod 4, hence n_+ =
    (p-3-t)/2 is EVEN, which is exactly the parity the two-cycle count requires;
    a formula that needed n_+ odd would have been inconsistent on its face.

    THE LOSSY-PROJECTION TEST, RUN BEFORE ANY COMPUTE (docs/inventor-protocol.md
    section 2). TRACKED OBJECT: the mu-INCIDENCE TYPE of a base point -- the
    partition of g's root multiset induced by the groupoid generated by
    {mu_T : T in E[2](F_p)\{O}} acting on P^1(F_p), decorated with each block's
    common value of chi(f(.)) and with a flag for blocks that are mu-fixed. It
    is GENUINELY LOSSY: p^3 base points collapse to a handful of incidence
    types; it discards the roots themselves, their order, e1/e2/e3, the
    j-invariant, and the endomorphism ring. What it discards is discarded
    COMPATIBLY with the cover's operation: mu_T is exactly the action of
    translation by T on the fibre's index set V, so the retained data determines
    the fibre's collision pattern -- and hence its factorization type --
    deterministically, by step 2 and step 3. It is NOT a change of coordinates
    relative to what this lane already tracks: the tracked object of
    IDEA-20260904-ad63fe is the Frobenius cycle type, whose per-point law (C3)
    is a function of the factorization type of g and two Legendre symbols and
    is therefore blind, in principle, to any incidence between the roots. The
    new object retains exactly the incidence bit and nothing else, which is why
    it sees a curve invariant that (C3)/(C4) provably cannot.

    WHY THIS IS WORTH HAVING EVEN THOUGH IT MOVES NO EXPONENT. The Red Team's
    own E5/E6 null objects (a uniformly random monic quartic; the (C3) recipe
    driven by an i.i.d. random +-1 function with NO curve, NO group law and NO
    cover) reproduce the entire five-class census including its finite-p bias,
    which bounds the census's information content to "the recipe holds". The
    degenerate stratum is the FIRST observable in this lane that those nulls
    cannot reproduce: a random sign function has no mu_T structure, so it has
    NO collisions, and its split-stratum 2+1+1 count is EXACTLY ZERO against a
    predicted 6,732. That is a controls-before-belief separation, in the exact
    place the previous round had none.

  novelty_status: unverified
  novelty_status_note: >-
    THE INGREDIENTS ARE CLASSICAL AND ARE CLAIMED AS SUCH. That translation by
    a 2-torsion point descends to a Moebius involution of the x-line, that its
    fixed points are the x-coordinates of the halvings of T, that a rational
    point is halvable iff x - e_i is a square for all three i (2-descent), and
    the identity (u - x_T)^2 = f'(x_T) for 2Q = T are textbook; the record
    DERIVES each of them inline rather than leaning on the pointers, so no
    citation is load-bearing.
    THE COMPOSITE IS AN IN-PROGRAM EXTENSION, and its two motivating precedents
    are both internal and both from this same session: EXP-MONO-005b49's
    red-team-breakthrough review, which found that the m=4 root-multiplicity
    collision rate is an exact function of (N, tau, #E(F_p)[4]) via the same
    "P_i +- P_j in E[2]" criterion; and EXP-MONO-0e6e8f's red-team review,
    which ran the deferred matched-(t,Z) control and found it FAILS, separated
    by #E(F_p)[4] = 16 vs 8. This record's contribution is (a) the closed form,
    (b) the identification of the mechanism as a fixed-point count, and (c) the
    correction of the named invariant from #E[4] to (#E[4], #E^d[4]).
    LITERATURE NOT VERIFIED. Two web searches were run in this session
    ("elliptic curve 2-torsion point is divisible by 2 criterion ... halving";
    "translation by 2-torsion acts on x-line as Moebius involution fixed points
    x-coordinates of order 4 points"). Their result summaries state exactly the
    classical criteria above, but NO SOURCE WAS OPENED AND READ: one fetch was
