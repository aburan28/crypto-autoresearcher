    bottleneck: >-
      ONE STEP DECIDES THE RECORD: whether the count of F_p-rational fixed
      points of the involutions mu_T, SPLIT BY THE QUADRATIC CHARACTER OF THE
      FIXED POINTS, is the complete curve dependence of the split stratum. All
      of (D3) is bookkeeping on top of it. Everything upstream (the involution
      formula, the degeneracy criterion) is elementary and checkable
      symbolically at zero cost; everything downstream (the extension to the
      other two strata) is explicitly excluded from the claim.
    baseline_embedding:
      parameter_slice: >-
        EXACT SLICE, ALREADY COMMITTED: setting h_+ = h_- = 0 (equivalently
        D = 0, equivalently a curve with no rational or twist-rational halving
        of any 2-torsion point) reduces (D3) to
        #1^4 = C(n_+,3) + C(n_-,3), #2+1+1 = 3 n_+ n_-, which is
        IDEA-20260904-ad63fe (C4) plus the ordinary-collision term the Red Team
        already isolated. Setting additionally Z = 0 (no rational 2-torsion at
        all) removes every collision and returns (C4) verbatim, which is the
        Red Team's own C2 measurement: "#E(C2) = 121 is odd, so C2 has no
        2-torsion ... ZERO degenerate", i.e. 2+1+1 = 0 in its split block.
      reproduction_check: >-
        SYMBOLIC AND FREE, run before any compute: (i) substitute h_+=h_-=0 and
        check the identity against (C4); (ii) substitute the C2 parameters
        (odd order, Z=0) and check the predicted split-stratum 2+1+1 count is
        exactly 0 against the archived 0; (iii) check the parity consequence
        n_+ even whenever Z=3. Any failure halts the record at zero compute.
    observation_collision:
      observable: >-
        The three-integer vector (#1^4, #2+2, #2+1+1) on the distinct-split
        stratum.
      distinct_preimage_search: >-
        SEARCHED, AND THE COLLISION IS THE RECORD'S OWN PREDICTION: by (D3) any
        two curves over the same p sharing (t, Z=3, h_+, h_-) have BITWISE
        IDENTICAL vectors, whatever their j-invariant, endomorphism ring, CM
        discriminant or automorphism group. That is a large declared collision
        and the matched arm of the companion experiment tests it as an exact
        integer identity. The genuinely dangerous collision is the OTHER
        direction and is named in (D5): #E(F_p)[4] alone has a strictly coarser
        fibre than (h_+, h_-), so a curve with h_+=0 < h_- is an
        observation-collision counterexample TO THE PREVIOUSLY NAMED INVARIANT,
        and finding one is the record's primary evidential act.
      residual_collision_risk: >-
        (D3) is a function of four integers, so it cannot see anything finer
        than (p, t, Z, #E[4], #E^d[4]) even in principle. If curve structure
        beyond that enters the m=4 cover, THIS observable will not carry it, and
        a matched-quadruple agreement must never be read as evidence that no
        finer structure exists -- only that this observable does not see it.
        This is the exact error the prior round made with (t,Z) and the reason
        that error was findable.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the tracked invariant (t, Z) by (t, Z, h_+, h_-), i.e. adjoin
          the character-split rational fixed-point count of the 2-torsion
          translation involutions on P^1(F_p).
        predicted_gain: >-
          Converts a refuted "(t,Z) and nothing else" law into an exact law with
          zero residual on the split stratum, and simultaneously CORRECTS the
          invariant the previous round named (#E[4]) to a strictly finer one
          that is testable against it on a single curve.
      - transform: observable_fiber
        proposed_object: >-
          Hold (t, Z, #E(F_p)[4]) fixed and vary #E^d(F_p)[4]; and separately
          hold (t, Z, h_+, h_-) fixed and vary everything else.
        predicted_gain: >-
          The first is THE FALSIFIER between the two candidate invariants, in
          constructive form; the second is the null-invariant control. Both are
          exact-integer, exhaustive, and affordable at p = 101.
      - transform: representation_reduction
        proposed_object: >-
          Read the base point through the E[2]-translation groupoid on P^1
          rather than through the factorization type of g, i.e. change what is
          tracked, not what is sampled.
        predicted_gain: >-
          The degenerate stratum becomes a deterministic, curve-distinguishing
          observable that the Red Team's own curve-free null (E6) provably
          cannot reproduce -- supplying this lane's first null-separating
          measurement.
    quantifier_order: >-
      CLAIMED IN THIS ORDER, AND THE ORDER IS LOAD-BEARING:
        FOR ALL p > 3, FOR ALL non-singular E/F_p with Z = 3, FOR ALL monic
        cubics g splitting into three distinct roots none of which is a root of
        f, the class of Q_e is determined by the mu-incidence type of {t_1,t_2,
        t_3} together with the characters chi(f(t_i)); and CONSEQUENTLY the
        three split-stratum counts equal the closed form (D3) exactly.
      The witness is UNIFORM in the curve and the base point: mu_T is written
      down from f alone. NO existential over curves is claimed anywhere, and
      the weaker order "there exists an invariant explaining the discrepancy"
      is not claimed and would not be admissible as a result.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that on prime fields at toy scale, for curves with full
        rational 2-torsion, the DISTINCT-SPLIT stratum of the m=4
        symmetric-base Semaev census has exactly the class counts (D3), whose
        entire curve dependence is (n_+, n_-, h_+, h_-). IT CANNOT certify the
        two non-split strata (their F_{p^2} / F_{p^3} analogues are conjectured
        in H2, not derived); it CANNOT certify Z in {0,1}; it CANNOT certify
        anything about m != 4; it CANNOT bound any relation rate, solver cost,
        or exponent; it CANNOT close KN-OPEN-009, whose relation-rate half is
        untouched; and it CANNOT be quoted as a statement about cryptographic
        scale, where D/total is O(1/p) and vanishes.
      nearby_object_control: >-
        THREE OBJECTS ON WHICH THE CONCLUSION IS KNOWN FALSE OR KNOWN TRIVIAL,
        all cheap and all satisfiable.
        (i) THE RED TEAM'S OWN E6 NULL: the (C3) recipe driven by an i.i.d.
        random +-1 function, with no curve, no group law and no cover. It has
        no mu_T structure, hence NO collisions, hence split-stratum 2+1+1
        EXACTLY 0 and 1^4 excess EXACTLY 0. The law must fail there, in that
        specific way. If the null shows degeneracies, the mechanism attribution
        is wrong.
        (ii) A CURVE OF ODD ORDER (Z = 0, tau = 1): D is not defined, there are
        no rational 2-torsion translations, and the predicted split-stratum
        2+1+1 is 0 -- which the Red Team ALREADY measured as 0 on C2
        (p=101, A=1, B=35, #E=121). This is a known-true boundary the law must
        reproduce and a known-false boundary for any theory that attributes the
        degeneracy to something other than 2-torsion.
        (iii) A UNIFORMLY RANDOM MONIC QUARTIC over the same F_p: no repeated
        roots at density 1 - O(1/p) and no curve dependence at all. Its
        split-stratum analogue must show no h-dependence.
    proof_obligations:
      - claim: >-
          mu_T(x) = x_T + f'(x_T)/(x - x_T) satisfies x(P+T) = mu_T(x(P)), is an
          involution over F_p, preserves S = F_p \ Z(f), and preserves
          chi(f(.)) on S.
        responsibility: correctness
      - claim: >-
          Two sign classes collide iff t_i = mu_T(t_j) for some T in
          E[2](F_p)\{O}; and the fixed points of mu_T are the x-coordinates of
          the halvings of T, rational iff chi(f'(x_T)) = +1, with a common
          chi(f(.)) equal to +1 iff T in 2E(F_p) and -1 iff T in 2E^d(F_p).
        responsibility: correctness
      - claim: >-
          THE STEP MOST LIKELY TO BE WRONG AND THE ONE A REVIEWER SHOULD OWN:
          step 3's identity chi(f(x(P_1+P_2))) = chi(f(t_1)) whenever
          2P_2 is not in E[2], and the claim that its ONLY exception is the
          special (double-double) configuration of step 4. If there is a second
          exceptional configuration the ordinary/special split is wrong and the
          coefficient 3 in #2+1+1 = 3 n_+ n_- - 3D is wrong with it. The
          retrodiction in (D4) is consistent with there being no second
          exception but does not prove it: two curves cannot separate a missing
          term that happens to vanish on both.
        responsibility: strictness
      - claim: >-
          No triple is double-counted: a second collision inside a triple forces
          all three characters equal, and such triples carry no excess.
        responsibility: correctness
      - claim: >-
          h_+ = (#E(F_p)[4] - tau)/4 and h_- = (#E^d(F_p)[4] - tau)/4, and at
          p = 1 mod 4 with Z = 3 the constraint #E[4] >= 8 forces h_- = 0
          (which is why the archived witness pair cannot separate the two
          candidate invariants).
        responsibility: baseline
      - claim: >-
          The (D4) retrodiction is a HAND-COMPUTED POST-HOC FIT, not evidence,
          and must be re-derived by machine under an approved contract before
          any citation.
        responsibility: scope
      - claim: >-
          Nothing here transfers to relation rates, cost, exponents, m != 4, or
          cryptographic scale; the effect is O(1/p) relative and vanishes there.
        responsibility: scope
    not_applicable_reason: null

  predictions:
