      the DISTINCT-SPLIT stratum only. Z in {0,1} and the two non-split strata
      are NOT covered by (D3) and are named as work in H2 below. This boundary
      is deliberate: the special-pair argument of step 4 needs two 2-torsion
      points besides T', which exists only at Z = 3.
    - >-
      The archived integers this record retrodicts come from a REVIEW-SIDE
      PROBE that its own author declares not evidence-eligible. They are used
      here as a consistency target for a derivation, never as evidence, and the
      minimal test re-derives them from an approved contract before anything is
