    INTERNAL DUPLICATE CHECK PERFORMED: read DEC-20260904-dd58c3, EV-MONO-e9dc3b,
    H-MONO-93bc4d, H-MONO-1d50ac (head), IDEA-20260904-ad63fe (full),
