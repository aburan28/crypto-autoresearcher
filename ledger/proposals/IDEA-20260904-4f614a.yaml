  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE LOAD-BEARING FOR (D1)-(D3). This record does not introduce a
        distributional heuristic; (D3) is an exact enumeration over a finite,
        exhaustively enumerable stratum, and every step is an identity in the
        group law and the quadratic character. The single non-mechanical step
        is step 3's claim that the ONLY exception to
        chi(f(x(P_1+P_2))) = chi(f(t_1)) is the special configuration of step 4
        -- offered as a derivation to be independently checked, NOT as a
        heuristic. THIS IS THE HONEST GAP: the retrodiction is consistent with
        there being no second exception but cannot prove it, since a second
        exceptional term that vanishes on both archived witnesses is exactly
        what the fit cannot see.
      rigorous_support: >-
        The Frobenius argument: for P not in E[2] with chi(f(x(P))) = -1,
        phi(P) = -P, so phi(T + 2P) = T - 2P = -(T + 2P), hence
        chi(f(x(T+2P))) = -1 unless T + 2P lies in E[2], i.e. unless
        2P lies in E[2]. This is a complete case analysis of when the
        implication fails, and step 4 is that case. What is not yet
        machine-checked is that the case analysis is exhaustive.
      validation_plan: >-
        SAMPLE: all C(n_+ + n_-, 3) distinct-split base points on every tested
        curve -- exhaustive, so no sampling assumption is made at all. COMPARE
        AGAINST: the exact integers of (D3), residual R_1 and R_2. TAIL CHECK:
        not applicable to an exact enumeration; the analogue is the per-cell
        joint table (g-factor-type x class), which must also match term by term,
        since a compensating pair of errors is the only way R_1 = R_2 = 0 could
        hide a wrong mechanism. TRANSFER ASSUMPTION, STATED: exactness at
        p = 101 establishes nothing about any other prime except by re-running;
        the p-ladder is run for that reason and is not an extrapolation.
      falsification_condition: >-
        R_1 or R_2 nonzero anywhere with Z = 3 and the dual classification path
        agreeing, or a joint-table cell that matches in total but not term by
        term.
    - id: H2
      statement: >-
        HEUR-MU-2 (CONJECTURAL, EXPLICITLY OUTSIDE THE CLAIM). On the two
        non-split strata the same mechanism holds with mu_T composed with
        Frobenius: for g = (linear)(irreducible quadratic) the degeneracy
        condition is t_3 = t_2^p = mu_T(t_2), and for g irreducible it is
        t_j = mu_T(t_i) among F_{p^3}-conjugates. The corresponding fixed-point
        counts are then twisted counts of order-4 points over F_{p^2} and
        F_{p^3}, so the full-census invariant is the 4-torsion data of E and
        E^d over F_p, F_{p^2} and F_{p^3}.
      rigorous_support: >-
        Rigorous half: mu_T is defined over F_p, so it commutes with Frobenius,
        and a twisted fixed-point count is the standard object. Distribution
        half: NONE IS CLAIMED -- this is a conjecture about an exact count, not
        a distributional heuristic, and it is stated so that a failure is
        attributable.
      validation_plan: >-
        SAMPLE: the archived residuals themselves -- C1's 2,459-instance
        "1+2 | 1^4" joint cell and C2's 101-instance "3 | 1^4" joint cell,
        both already localized by the Red Team -- plus exhaustive enumeration
        of both non-split strata at p = 101 on the same curve panel. COMPARE
        AGAINST: the twisted-fixed-point predictions, as exact integers. TAIL
        CHECK: the totals must match AND the joint (g-type x class) cells must
        match individually. TRANSFER ASSUMPTION: none; this is measured at the
        same primes.
      falsification_condition: >-
        The twisted count does not reproduce the 2,459 and 101 residuals
        exactly. H2 is then wrong and the full-census law remains open, WITHOUT
        affecting (D3), which is stated on the split stratum only.
    - id: H3
      statement: >-
        HEUR-MU-3 (SEARCH SATISFIABILITY, AN EMPIRICAL FACT TO BE ESTABLISHED
        BEFORE COMPUTE, NOT ASSUMED). At least one prime in the declared toy
        range carries two curves with identical (t, Z=3) and identical
        #E(F_p)[4] = 4 but different #E^d(F_p)[4], and at least one prime
        carries two curves with identical (t, Z=3, #E[4], #E^d[4]) and distinct
        j-invariants.
      rigorous_support: >-
        Structural half: at p = 1 mod 4 with Z = 3 and #E(F_p)[4] = 4 one has
        #E = 4 mod 8, hence #E^d = 0 mod 8, hence #E^d[4] is in {8, 16} and
        both values are a priori available; whether both occur at one (p,t) is
        a counting question about the isogeny class, answered by an exhaustive
        (A,B) scan costing O(p^3) at p ~ 101.
      validation_plan: >-
        SAMPLE: every non-singular (A,B) in F_p^2 at p in a declared list
        spanning both residues mod 4. COMPARE AGAINST: nothing -- this is a
        census of cell occupancy, reported as a fact. TAIL CHECK: report cell
        counts for every (t, Z, #E[4], #E^d[4]) quadruple so a reader can see
        which cells were available and which were empty. TRANSFER ASSUMPTION:
        none.
      falsification_condition: >-
        The discriminating cell is empty at every declared prime. Then P4 is
        NOT TESTED -- reported as a bounded negative with the exact search
        range, never as support for either invariant, and the search range is
        extended in a successor rather than the cell being quietly swapped for
        an easier one.

  target_complexity:
    time_exponent: >-
      NOT APPLICABLE. No algorithm and no attack is proposed and no exponent is
      claimed or moved. The measurement itself: O(p^3) field operations for the
      curve scan and O(n_+ + n_-)^3 = O(p^3) for one exhaustive split-stratum
      census, i.e. ~1.5 x 10^5 base points per curve at p = 101 and ~1.7 x 10^8
      at p = 1009 (which is why p = 1009 is sampled, not exhausted).
    memory_exponent: >-
      O(p) for the character table plus a constant-size counter vector; well
      under 1 GB at every declared parameter.
    best_known: >-
      Not applicable; no ECDLP complexity claim of any kind. The prime-field
      baseline this program works against is Pollard rho at O(sqrt N) time and
      O(1) memory (KN-OPEN-001), and nothing here moves it in either direction.
      Against the nearest COMPUTATIONAL alternative for the same quantity --
      exhaustive census, which is what the archived probe did -- the closed form
      replaces O(p^3) work with O(p) work (compute n_+, n_-, h_+, h_-), which is
      a genuine but small and entirely internal speedup of a measurement.
    hidden_overhead: >-
      None hidden. The O(1/p) relative size of the whole effect is stated in
      the claim, not buried: D / C(p-3,3) is Theta(1/p^2), and the class-level
      correction 3D / (3 n_+ n_-) is Theta(1/p). At cryptographic p the
      correction is unobservable, and this record says so rather than implying
      otherwise.
    tradeoff_note: >-
      Not applicable -- no time-memory tradeoff and no parallelization position
      is claimed. The census is embarrassingly parallel over base points, which
      is a convenience, not a result.

  dominated_by:
    value: not_applicable
    reason: >-
      No Pareto point is claimed on any cryptanalytic axis, so there is no
      time, memory, or data/query coordinate on which this could dominate or be
      dominated. The relevant frontier row -- Pollard rho, O(sqrt N) time and
      O(1) memory over prime fields (KN-OPEN-001) -- was checked and is
      untouched: no solver, no relation search, and no cost model is proposed.
      ON THE NARROW AXIS OF "COMPUTING THIS PARTICULAR OBSERVABLE" the frontier
      row is the archived exhaustive census (EXP-MONO-0e6e8f, 283 CPU-seconds
      for two curves at p=101); the closed form dominates it in time (O(p) vs
      O(p^3)) and ties in memory, and that is the only domination claimed
      anywhere in this record.
  sota_delta: >-
    0, exactly, on every attack axis: no security estimate for any curve at any
    size moves in either direction. On the measurement axis: the closed form
    computes in O(p) what the census computes in O(p^3), i.e. ~10^4 fewer
    operations per curve at p = 101 and ~10^6 fewer at p = 1009, with zero
    uncertainty instead of exhaustive-but-expensive exactness. Against
    IDEA-20260904-ad63fe (C4), the delta is the term D: 132 and 44 instances
    out of 152,096 on the two archived witnesses (relative 8.7e-4 and 2.9e-4),
    which is the entire quantitative content of the "matched-(t,Z) control
    fails" finding.

  estimated_cost:
    implementation: low
    compute: low
  estimated_cost_detail: >-
    Stage 0 is symbolic and free. Stage 1 reuses EXP-MONO-0e6e8f's own field
    arithmetic and censuses 3 curves x 152,096 base points -- minutes on one
    core. Stage 2's curve scan is O(p^3) ~ 10^6 point-counts at p = 101, plus
    one census per cell member. Stage 3 is a few minutes. Total well under one
    CPU-hour; the entire record is affordable inside a single small batch.

  recommended_priority: high

  priority_rationale: >-
    Ranked HIGH despite carrying sota_delta 0 and no exponent, for three
    reasons that are specific rather than enthusiastic. FIRST, it converts a
    named lead into a mechanism: DEC-20260904-dd58c3's next_action (1) asks for
    exactly this follow-up, and the answer offered is not "#E[4] matters" but
    a closed form with zero free parameters that reproduces all six archived
    integers and says WHY -- the census counts rational halvings of rational
    2-torsion. SECOND, it CORRECTS the invariant the previous round named,
    and the correction is decidable on one curve: #E(F_p)[4] and
    (#E(F_p)[4], #E^d(F_p)[4]) have provably different fibres, they agree
    exactly in the regime the archived witness occupies, and the cell where
    they disagree is enumerable at p = 101. A cheap test that can refute the
    program's own newest finding is the highest-information object available in
    this lane. THIRD, it supplies the null separation this lane has never had:
    the Red Team's E5/E6 nulls reproduce the entire five-class census, which
    bounds that census to "the recipe holds"; the degenerate stratum is the
    first observable those nulls cannot reproduce, because they have no group
    law and hence no mu_T. That is controls-before-belief satisfied
    constructively rather than asserted.

