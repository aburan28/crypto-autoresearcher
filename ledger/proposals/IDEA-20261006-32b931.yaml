  dominated_by: >-
    Generic rho at exponent 1/2 dominates any reading of this point
    count as an attack. The count does not reduce the number of group
    operations, the memory, or the number of queries below that baseline.
  sota_delta: >-
    The separator is the absolute gap 17 between the twist sum 1504
    and the control sum 1487. The gap to a sub-square-root discrete
    logarithm is the full exponent 1/2, and this idea moves that
    exponent by 0.
  proof_search_map:
    bottleneck: >-
      Whether the twist sum equals 1504 while the different-j sum
      equals 1487.
    baseline_embedding:
      parameter_slice: p=751, c=3, the three named curves
      reproduction_check: >-
        Two counters agree on 727, 777, and 760.
    observation_collision:
      observable: the absolute gap of the two sums
      distinct_preimage_search: >-
        Recounting E twice must give gap 0. A nonzero gap there means
        the counter, not the twist, moved.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the pair of sums 1504 and 1487
        predicted_gain: an integer gap of 17, or an explicit other pair
    quantifier_order: >-
      These three named curves at p=751, not every twist over every prime.
    method_ceiling:
      strongest_certifiable_claim: >-
        The two sums at this pin. No exponent change.
      nearby_object_control: >-
        The B=2 curve is the different-j object. A supersingular
        count of 752 was computed and excluded.
    proof_obligations:
      - claim: The twist sum is 1504.
