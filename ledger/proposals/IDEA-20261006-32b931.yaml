# IDEA-20261006-32b931
# Twist point-count complement. Proposal only. Not a hypothesis.
idea:
  id: IDEA-20261006-32b931
  question_id: RQ-JINV-8fc13a
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Twist pair over F_751 sums to 1504 points, and a different-j pair sums to 1487
  class: measurement
  claim: >-
    Over F_751, E is y^2 = x^3 + x + 1 and its quadratic twist by the
    nonsquare 3 is Et: y^2 = x^3 + 9x + 27. Both are nonsingular. This
    session counted #E = 727 and #Et = 777 by a Legendre sum and by
    enumeration, so the sum is 1504, which equals 2*(751+1). Both
    curves have j-invariant 297. The ordinary control y^2 = x^3 + x + 2
    has j-invariant 451 and 760 points, so its sum with #E is 1487.
    The absolute gap between the two sums is 17. A recount in which
    the twist sum is not 1504, or the control sum is not 1487, with
    both counters agreeing, is a negative. The shared j does not fix
    the group order.
  mechanism: >-
    The tracked objects are the two rational-point counts and the two
    j-invariants. The twist scales the short-Weierstrass coefficients
    by c^2 and c^3 for c=3, which preserves j and replaces the trace
    t by -t, so the counts sum to 2(p+1). The control changes B from
    1 to 2 and changes j, so it is not that twist. IDEA-20261003-681212
    counted curve labels and j labels and explicitly did not count
    points. This idea counts points. No discrete logarithm is solved.
    The non-generic resource is the quadratic twist of one ordinary
    curve, not an automorphism walk.
  assumptions:
    - c=3 is a quadratic nonresidue modulo 751, checked by the Euler criterion in this session.
    - Both point counters, the Legendre sum and the enumeration, are run on each of the three curves.
    - j is 1728 times (4A)^3 times the inverse of 4A^3+27B^2 in F_751.
  predictions:
    - metric: twist_point_sum
      direction: different
      minimum_effect: >-
        #E + #Et equals 1504, and #E + #E_control equals 1487, so the
        absolute gap of the two sums is 17.
    - metric: shared_j
      direction: different
      minimum_effect: >-
        E and Et have the same j-invariant 297, and the control has
        j-invariant 451.
  minimal_test:
    design: >-
      Recount all three curves by enumeration and by the Legendre sum.
      Recompute the three j-invariants. Compare the twist sum with
      1504 and the control sum with 1487. Run distinguished-point rho
      and BSGS on ten planted scalars on the prime-order subgroup of
      E, order 727 with generator (0, 1), and record the operation
      counts. Those counts are not the primary metric.
    controls:
      - The control curve y^2 = x^3 + x + 2, whose sum with #E is 1487 rather than 1504. If that sum is also 1504, the twist is not separated from a B-change.
      - A second enumeration of E alone. The gap between the two enumerations of E must be 0.
      - Distinguished-point rho and BSGS on ten planted logs of E, recorded as attack-cost controls and not as predictors of the point-count sum.
    required_metrics:
      - the three point counts from each counter
      - the two sums and their absolute gap
      - the three j-invariants
      - rho step counts and BSGS operation counts on the ten shared logs
  falsification_conditions:
    - Both counters agree and the twist sum is not 1504.
    - Both counters agree and the control sum is 1504, so the B-change is not separated from the twist.
    - E and Et have different j-invariants, or the control has j-invariant 297.
  confounders:
    - A singular curve makes the point count undefined as an elliptic-curve count. Each discriminant 4A^3+27B^2 is checked nonzero. This session recorded 31, 69, and 112.
    - The curve y^2 = x^3 + x over the same prime has 752 points, which is p+1. It was not used as the control because it is supersingular.
    - Counting labels, as in IDEA-20261003-681212, is a different quantity. A label sum of 3 is not this point-count sum.
  interpretation_limits:
    - A sum of 1504 on this one twist pair does not prove the twist formula for every prime.
    - Equal j and unequal order is not an ECDLP speedup. The exponent 1/2 is unchanged.
    - The ten rho and BSGS counts do not move a frontier.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a nonsquare c, the quadratic twist of a short-Weierstrass
        curve over F_p has point count 2(p+1) minus the original count,
        and a curve with a different j-invariant is not forced to the
        same complement.
      rigorous_support: >-
        The trace sign flip under quadratic twist is standard. This
        session did not open a textbook proof of that identity. The
        comparison used here is the integer 1504 against the counted
        sum, and the integer 1487 against the control sum.
      validation_plan: >-
        Recount E, Et, and the control by two counters. The
        pre-registered sums are 1504 and 1487. Repeat the twist
        construction at one other nonsquare, c=5 if it is a nonresidue,
        only as a second cell if the first cell matches. A mismatch on
        the first cell is already a negative and does not license
        retuning 1504.
  target_complexity:
    time_exponent: >-
      Unchanged at 1/2. Point counting at p=751 is not an algorithm
      for the subgroup discrete logarithm.
    memory_exponent: >-
      Unchanged. The counts store O(p) temporary field elements and
      do not improve the BSGS memory of order sqrt(N).
    best_known: >-
      Generic rho at exponent 1/2 (KR-RHO-13bf67). An automorphism
      group discounts iterations by about sqrt(m) and does not fix
      the point count (KR-RHO-0528e7). This measurement does not beat
      rho.
    hidden_overhead: >-
      None. The sums 1504 and 1487 are explicit. No o(1) saving is claimed.
    tradeoff_note: >-
      There is no time-memory tradeoff in the point count. Recording
      rho and BSGS on ten logs only prices the matched controls.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  novelty_status: unverified
