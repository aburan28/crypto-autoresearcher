idea:
  id: IDEA-20261007-9711d4
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Quadratic character of x(P) - x(P)^3 on the first ordinary curve over F_3
  class: measurement
  claim: >-
    Let E be the lexicographically first nonsingular ordinary short-Weierstrass
    curve y^2 = x^3 + a x + b over F_3, with (a, b) in {0, 1, 2} ordered by
    (a, b), skipping any singular model. Let S be the affine points of
    E(F_{3^5}) whose x-coordinate is not in F_3. Let chi be the quadratic
    character of F_{3^5}. Let r be the share of P in S with
    chi(x(P) - x(P)^3) = 1. Let r0 be the share of ordered pairs of distinct
    affine points of the same E(F_{3^5}) with chi(x(P) - x(Q)) = 1. The claim
    is that the absolute difference |r - r0| is at least 1/sqrt(|S|). The
    curve y^2 = x^3 + x + 1 is not used. The rho exponent stays 1/2 and the
    factor 1/n stays in place. The delta versus both is 0.
  mechanism: >-
    The map x |-> x^3 - x on F_{3^5} is F_3-linear with kernel F_3, so its
    image on elements outside F_3 is a hyperplane. A random chord denominator
    x(P) - x(Q) is not confined to that hyperplane. The quadratic character
    is the observable. It is not the cardinality of the image of x^3 - x, and
    it is not a chord-slope census. Representation class R1, an x-coordinate.
    No factor base is built and no summation polynomial is solved.
  novelty_status: unverified
  citations:
    - ref: KR-IC-b0fcda
      provenance: internal
      claim: >-
        Frobenius-invariant factor bases reduce the number of systems by at
        most 1/n. This character share is not that factor.
      verified_by: >-
        coordinator, 2026-10-07, opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
    - ref: KR-RHO-037e22
      provenance: internal
      claim: >-
        Frobenius-class rho keeps exponent 1/2 with a sqrt(2m) constant.
        This share does not change that exponent.
      verified_by: >-
        coordinator, 2026-10-07, opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-037e22.yaml
  assumptions:
    - A singular curve is instrument_failure, not a character share.
    - Infinity is excluded. A vertical difference is excluded from both shares.
  predictions:
    - metric: absolute difference of the two quadratic-character shares
      direction: higher
      minimum_effect: ">= 1/sqrt(|S|)"
  minimal_test:
    design: >-
      Enumerate E(F_{3^5}) for the frozen curve. Compute r on S and r0 on
      all ordered pairs of distinct affine points. Do not sample. Do not
      build a factor base. Do not use y^2 = x^3 + x + 1.
    controls:
      - A zero discriminant voids the run.
      - The character of a fixed nonsquare must be -1 before any share is scored.
      - Repeating the enumeration must return the same shares.
    required_metrics:
      - r
      - r0
      - the size of S
      - the curve coefficients a and b
  falsification_conditions:
    - The absolute difference |r - r0| is strictly less than 1/sqrt(|S|) after the instrument checks pass.
  confounders:
    - Dropping the pairs where x(P) = x(Q) changes r0. Those pairs are excluded in both the claim and the test.
    - A character computed in a different basis is the same value. A Hamming weight is not this metric.
  interpretation_limits:
    - Toy scope: q = 3 and n = 5 on one curve.
    - The exponent 1/2 and the factor 1/n are unchanged whether or not the shares differ.
    - This is not a statement about the image size of x^q - x.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The quadratic character, restricted to the image of x |-> x^q - x,
        deviates from the character on random differences by at least the
        reciprocal square root of the sample. This is not a theorem.
      rigorous_support: >-
        Rank-nullity gives that x |-> x^q - x has kernel F_q. Nothing opened
        in this session forces a character bias of size 1/sqrt(|S|).
      validation_plan: >-
        Compute the two shares on this curve and on the same curve over
        F_{3^7}. If the second extension has absolute difference below
        1/sqrt(|S|), H1 fails. The reading of n = 5 is still recorded.
  target_complexity:
    time_exponent: unchanged at 1/2
    memory_exponent: >-
      Unchanged. The test stores one curve over F_{3^5}.
    best_known: >-
      KR-RHO-037e22 at exponent 1/2 with a sqrt(2m) constant, and
      KR-IC-b0fcda at a factor 1/n on the number of systems.
    hidden_overhead: No o(1) term is claimed. The output is two shares.
    tradeoff_note: >-
      No time-memory tradeoff. The discrete-log exponent stays 1/2.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Checked KR-RHO-037e22 and KR-IC-b0fcda, both opened 2026-10-07.
    KR-RHO-037e22 dominates the generic side at exponent 1/2. A character
    share is not an exponent. The distance from 1/2 stays in place.
  sota_delta: >-
    Zero change to the exponent 1/2 and zero change to the factor 1/n.
    The quantity measured is one absolute difference of shares. Relative
    to KR-RHO-037e22 the leading term is unchanged, so the delta is 0.
  prior_art:
