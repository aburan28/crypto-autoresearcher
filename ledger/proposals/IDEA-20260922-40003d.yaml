idea:
  id: IDEA-20260922-40003d
  question_id: RQ-NISTBIN-06157b
  added: '2026-09-22'
  proposed_by: idea-generator
  status: proposed
  title: >-
    ON FOUR OF THE FIVE NIST KOBLITZ CURVES THE INDEX-CALCULUS FROBENIUS SAVING IS
    NOT A CONSTANT BUT EXACTLY ONE, BECAUSE A SUBSPACE FACTOR BASE CANNOT BE
    FROBENIUS-CLOSED AT AN INDEX-CALCULUS-USEFUL DIMENSION: extend the closed-form
    stable-subspace count of IDEA-20260918-9abf42 from the ECC2K-130 toy n to the
    exact FIPS binary degrees. The available Frobenius-stable dimensions are the
    subset sums of the factor degrees of T^m - 1, which at m = 163 are {0, 1, 162,
    163}, at m = 283 are {0, 1, 94, 95, 188, 189, 282, 283}, at m = 409 are {0, 1,
    204, 205, 408, 409}, and at m = 571 are {0, 1, 114, ...} -- so for K-163,
    K-283, K-409, K-571 NO stable subspace sits near the index-calculus-useful band
    l ~ m/t, and the standard Koblitz factor-base-symmetry saving (the m-fold
    relation multiply and m-fold linear-algebra shrink) is structurally
    UNAVAILABLE. m = 233 is the lone exception, with a stable subspace of dimension
    exactly 29 sitting at the useful band for t = 9. The two Koblitz savings named
    by the RQ therefore separate cleanly: rho keeps its sqrt(m) on all five
    K-curves; the index-calculus side gets an orbit saving on at most ONE of them,
    and even there IDEA-20260906-a77711's equivariance argument predicts it does
    not reach the solving step.
  class: mechanism

  mechanism: >-
    OBJECT FRAME. Representation of the point: the x-coordinate x(P) in F_(2^m)
    written in a fixed F_2-basis, with the factor base B_V = {P on E : x(P) in V}
    for a chosen F_2-subspace V of dimension l -- this is the Weil-restriction
    membership representation, R3 of RQ-ECDLP-623a32 (Weil restriction / local-ring
    representations), the only admissible factor-base shape at prime m because no
    proper subfield exists (SRC-FIPS186-4-BINARY-CURVES, every degree prime).
    Operation set Sigma the tracked object must survive: the 2-power Frobenius
    sigma : (x, y) -> (x^2, y^2) (an endomorphism of every Koblitz curve, since
    b = a in F_2), COMPOSED WITH the partial translation action by factor-base
    elements that index calculus already uses (Class I). The tracked object is the
    Frobenius orbit of a factor-base point, {P, sigma P, ..., sigma^(m-1) P}.
    TRICHOTOMY PLACEMENT (IDEA-20260806-c5d183): BRANCHING. Sigma contains sigma,
    a bijective automorphism, on top of the partial translation action; it is NOT
    contained in the partial-action closure, and a lossy quotient by the full
    translation action is closed (KN-FIND-ffe1df Theorem C). So the candidate is a
    branching object -- following the orbit through decomposition either keeps all
    m conjugates (no loss, a change of coordinates) or picks a canonical
    representative and branches on which conjugate a decomposition step produced.
    The one-line reason: the orbit map is a group action that moves the target,
    not a lossy projection of one target's state.
    LOSSY-PROJECTION TEST against Sigma = {sigma} composed with partial
    translation. The candidate projection is (a factor-base point P) -> (its
    Frobenius orbit as an unordered set). For this to discard information AND
    propagate under sigma the factor base must be sigma-CLOSED: sigma(B_V) = B_V,
    i.e. V must be Frobenius-stable (x in V => x^2 in V). IDEA-20260918-9abf42's
    correspondence (Frobenius-stable F_2-subspaces <-> monic divisors of T^m - 1)
    then forces the available dimensions to the subset sums of the factor degrees.
    WHERE THE TEST FAILS, AND THIS IS THE RESULT. At m in {163, 283, 409, 571} no
    stable V of dimension in the useful band l ~ m/t exists, so no sigma-closed
    factor base of index-calculus dimension exists, so the projection cannot be
    formed at all -- the orbit map sends B_V outside itself and the "quotient" is
    not a quotient. The escape (a factor base that is a union of Frobenius orbits
    but NOT an F_2-subspace) is priced under FACTOR-BASE ESCAPE below and loses the
    linear membership test that made the subspace attractive.
    FACTOR-BASE ESCAPE (KN-OPEN-020). B_V is the implicit-membership-cheap case:
    membership x(P) in V is one F_2-linear (l-by-m Boolean matrix) test, cost
    O(m^2) bit-ops, and it is exactly the linearity that Weil descent exploits. A
    sigma-orbit-union factor base that is not a subspace has membership predicate
    "x lies in a union of orbits" which is NOT F_2-linear; it lands in the
    HIGH-DEGREE / implicit class of KN-OPEN-020, its descent system is no longer
    the affine Weil system, and the m^2 membership test is replaced by an orbit
    lookup of description size m * |orbits|. The candidate charges this and stops:
    at prime m the ONLY sigma-closed subspaces are the four/eight/... of the
    divisor lattice, and at four of the five NIST degrees none is useful.
    TWO SAVINGS, TWO MEASUREMENTS (binding on this record). Saving A, rho-side:
    the sqrt(m) speedup from walking on Frobenius classes, present on all five
    K-curves, charged as the matched baseline. Saving B, index-calculus-side: the
    m-fold relation multiplication and m-fold linear-algebra shrink that a
    sigma-closed factor base would give. This record's claim is that Saving B is
    exactly 1 (absent) at m in {163, 283, 409, 571} and available only at m = 233,
    and that even at m = 233 IDEA-20260906-a77711 predicts it does not reach the
    solving step. The two savings are never multiplied into one factor.

  claim: >-
    (A) EXACT TABLE, computed this session by ord_m(2) and the subset-sum rule of
    IDEA-20260918-9abf42(B). For each FIPS binary degree m the Frobenius-stable
    F_2-subspace dimensions are:
      m = 163: ord = 162, f = 2, dims {0, 1, 162, 163}
      m = 233: ord =  29, f = 9, dims {0, 1, 29, 30, 58, 59, 87, 88, 116, 117,
               145, 146, 174, 175, 203, 204, 232, 233}
      m = 283: ord =  94, f = 4, dims {0, 1, 94, 95, 188, 189, 282, 283}
      m = 409: ord = 204, f = 3, dims {0, 1, 204, 205, 408, 409}
      m = 571: ord = 114, f = 6, dims {0, 1, 114, 115, 228, 229, ..., 570, 571}
    (B) THE USEFUL BAND. A summation-polynomial index calculus with t-point
    decomposition wants l ~ m/t; the RQ-relevant t are 7..12 at these degrees
    (EXP-SEMBIN-992e73: m* = 7 at 163, 9 at 233/283, 11 at 409, 12 at 571), so the
    useful l is roughly 163/7 ~ 23, 233/9 ~ 26, 283/9 ~ 31, 409/11 ~ 37, 571/12
    ~ 48. The ONLY stable dimension inside a factor of two of its band is m = 233,
    dimension 29 (band 26). At 163, 283, 409, 571 the nearest nontrivial stable
    dimension is either 1 (the subfield F_2, |B| = 2, useless) or a co-large block
    (94, 204, 114+, giving |B| ~ 2^94 and up, far above any relation budget).
    (C) CONSEQUENCE FOR SAVING B. At m in {163, 283, 409, 571} there is no
    sigma-closed subspace factor base of index-calculus dimension, so the standard
    Koblitz index-calculus symmetry (one solved decomposition yields m relations;
    the relation matrix quotients by the size-m orbits) cannot be instantiated on a
    subspace factor base: Saving B = 1. On these curves the RQ's "Koblitz-structure
    savings beyond the rho-side" reduce to the constant-factor endomorphism speedup
    already inside rho, plus whatever a non-subspace orbit-union base buys after
    paying the KN-OPEN-020 high-degree membership cost -- which this record
    predicts is a net loss.
    (D) THE ONE LIVE CELL AND ITS PRIOR. m = 233 alone admits a sigma-closed
    subspace at the useful band (dim 29). Whether Saving B there reaches the
    SOLVING stage (first-fall / solving degree of the descended system) is the open
    question; IDEA-20260906-a77711's equivariance argument is the standing negative
    prior -- sigma carries a decomposition of R to a decomposition of sigma(R), so
    for a fixed target the descended system is not sigma-equivariant and the orbit
    quotient acts on the collection of conjugate targets, not on one target's
    solution set. The honest expectation is that m = 233 also yields only the known
    m-fold relation multiply (a constant), not a solving-stage change.

  novelty_status: unverified

  citations:
    - ref: IDEA-20260918-9abf42
      provenance: internal
      claim: >-
        Frobenius-stable F_2-subspaces of F_(2^m) correspond to monic divisors of
        T^m - 1; for m prime there are 2^(1 + (m-1)/ord_m(2)) of them and their
        dimensions are the subset sums of the factor degrees. This record applies
        that count to the five FIPS degrees; the count itself is not claimed here.
      verified_by: >-
        Read in full this session. The five-degree table in claim (A) was recomputed
        independently this session by ord_m(2) (2 has order 162, 29, 94, 204, 114
        at 163, 233, 283, 409, 571) and the subset-sum rule; a reviewer should redo
        the ord_m(2) computation, which is one modular-exponentiation ladder each.
    - ref: IDEA-20260906-a77711
      provenance: internal
      claim: >-
        Frobenius is an equivariance between conjugate systems, not a symmetry of
        one fixed target's descended system, so invariant rewriting yields no
        solving-degree drop for a fixed target. This is the standing negative prior
        for whether Saving B reaches the solving step at m = 233.
      verified_by: >-
        Characterised from the session summary and IDEA-20260918-9abf42's own
        honest_limit block, which quotes it; NOT read directly this session. A
        contract built on this record must re-read IDEA-20260906-a77711 before
        writing the negative prediction into a preregistration.
    - ref: KN-FIND-ffe1df
      provenance: internal
      claim: >-
        Theorem C: on a prime-order subgroup no lossy projection propagates
        deterministically under the full translation action; the lossy objects
        under an operation set are the block systems of the generated group. Used
        to place the Frobenius-orbit object as branching, not partial-action.
      verified_by: >-
        Cited from the object-frame block of docs/object-frame-ideation.md and the
        session summary; NOT read directly this session. Provenance internal,
        treated as a pointer.
    - ref: EXP-SEMBIN-992e73
      provenance: internal
      claim: >-
        Semaev-2015 cost model at the FIPS/Certicom degrees with m* the optimal
        decomposition size (7 at 163, 9 at 233/283, 11 at 409, 12 at 571); source
        of the useful-band estimate l ~ m/m*.
      verified_by: RESULTS.md read in full this session.
    - ref: SRC-FIPS186-4-BINARY-CURVES
      provenance: internal
      claim: >-
        Every FIPS binary degree (163, 233, 283, 409, 571) is prime; K-curves are
        y^2 + xy = x^3 + a x^2 + 1 with a in {0, 1}, so Frobenius is an
        endomorphism. Establishes that the factor base must be a chosen subspace and
        that Saving A (rho-side Frobenius) exists on every K-curve.
      verified_by: source_record.yaml read in full this session.
    - ref: GOAL-FROB-6333a9
      provenance: internal
      claim: >-
        The program's Frobenius-vs-random factor-base measurement (EXP-FROB-30006a,
        HEUR-FROB-WDSAT-NULL) is set at n = 41/43. This record explains why 41/43
        are the right toy n (both rich, stable subspaces at dims 20/21 and
        14/15/28/29) and why the NIST family cannot be probed the same way at four
        of five degrees.
      verified_by: >-
        goal.yaml read this session (per session summary); the n = 41/43 rich
        status is cross-checked against IDEA-20260918-9abf42's verified table.

  assumptions:
    - >-
      m is an odd prime (all five FIPS binary degrees are; verified in
      SRC-FIPS186-4-BINARY-CURVES). The subset-sum dimension rule is the
      prime-m case of IDEA-20260918-9abf42.
    - >-
      "Frobenius-stable" means closed under the F_2-linear map x -> x^2. A factor
      base closed under a proper power of Frobenius only would be a different and
      larger lattice and is out of scope.
    - >-
      The index calculus wants a factor base of dimension l ~ m/t. This is the
      standard sizing (a design heuristic, not a theorem); a method wanting a
      markedly different l would read the table differently, and the claim is
      scoped to the l ~ m/t band with t as in EXP-SEMBIN-992e73.
    - >-
      Saving B (the m-fold index-calculus symmetry) is defined for a factor base
      that is a UNION OF FULL FROBENIUS ORBITS. On a subspace factor base this
      requires sigma-stability; the claim is about subspace factor bases, the only
      shape with a linear (cheap) membership test at prime m.

  proof_search_map:
    bottleneck: >-
      Whether the Koblitz index-calculus saving (Saving B) can be instantiated at
      all on a NIST binary curve reduces to whether a Frobenius-stable subspace of
      index-calculus dimension EXISTS at that degree. That existence question has
      never been separated from the "does it help" question for the FIPS family;
      answering it in closed form, before any solver, is the bottleneck this map
      removes.
    baseline_embedding:
      parameter_slice: >-
        IDEA-20260918-9abf42 at m = 131 (ECC2K-130), where the stable dimensions
        are {0, 1, 130, 131}. The FIPS table must reproduce the same POOR shape at
        m = 163 (also 2-primitive-root: dims {0,1,162,163}) and the RICH shape at
        m = 233 (dim-29 stable subspace present).
      reproduction_check: >-
        ARITHMETIC, ZERO COMPUTE. Recompute ord_m(2) at each of 163, 233, 283, 409,
        571 by a modular-exponentiation ladder (this session got 162, 29, 94, 204,
        114) and form the subset sums; the dimension sets in claim (A) must match. A
        reviewer redoing m = 233 and m = 571 (the two whose ord is neither m-1 nor
        maximal-collapsing) is the informative check.
    observation_collision:
      observable: >-
        The pair (is a stable subspace present in the band l ~ m/t; if so at what
        dimension) at each FIPS degree.
      distinct_preimage_search: >-
        Many degrees share the POOR observable (163 with 131, both
        2-primitive-root, both giving no useful stable subspace) -- that collision
        is real and is why 163 behaves like ECC2K-130. The dangerous collision
        would be a degree whose useful-band stable subspace is ALSO a subfield; at
        prime m there are no proper subfields, so this cannot occur, which is what
        makes the subspace the only structure in play.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The five-degree table plus the single live cell m = 233, dim 29, versus a
          size-matched non-stable dim-29 subspace at m = 233 as the null object.
        predicted_gain: >-
          Converts "does Frobenius help the FIPS index calculus" from an
          unanswerable blanket question into one measurement at the one degree where
          the treatment can even be built, with the other four degrees closed by
          existence.
    quantifier_order: >-
      FORALL FIPS binary degrees m in {163, 283, 409, 571} and FORALL t in the
      RQ band 7..12: there is NO Frobenius-stable F_2-subspace of dimension in
      [m/(2t), 2m/t], hence no sigma-closed subspace factor base of
      index-calculus dimension -- an equality-grade statement from the divisor
      lattice, no instance or seed enters. SEPARATELY, EXISTS a cell (m = 233,
      dim 29 vs a random dim-29 subspace) at which a solving-stage difference WOULD
      be visible if Saving B reached the solving step, and the record PREDICTS none
      (the equivariance prior). The first is a theorem; the second is a design.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At m in {163, 283, 409, 571} the index-calculus Frobenius saving on a
        subspace factor base is exactly 1 at every index-calculus-useful dimension,
        because no Frobenius-stable subspace of that dimension exists; m = 233 is
        the unique FIPS degree admitting one, at dimension 29." Certifies nothing
        about whether that dim-29 base lowers any solving cost, nothing about
        non-subspace factor bases, nothing about rho's Saving A (which is
        untouched), and nothing about any group order or specific curve.
    nearby_object_control: >-
        PROVES-TOO-MUCH at m = 233: if the argument were read as "Frobenius-stable
        useful factor bases never exist at prime m" it is FALSE at 233 (dim 29
        exists) and must fail there loudly; any phrasing that survives m = 233 has
        overreached. NULL OBJECT for the live cell: a size-matched non-stable dim-29
        subspace at m = 233; a solving-stage difference that does not vanish when
        stability is destroyed is an instrument artifact.
    proof_obligations:
      - claim: >-
          ord_m(2) = 162, 29, 94, 204, 114 at m = 163, 233, 283, 409, 571, and the
          stable-subspace dimension sets are as in claim (A).
        responsibility: correctness
      - claim: >-
          The useful band l ~ m/t at t from EXP-SEMBIN-992e73 excludes every
          nontrivial stable dimension at 163, 283, 409, 571 and includes dim 29 at
          233.
        responsibility: size
      - claim: >-
          A non-subspace orbit-union factor base has a non-F_2-linear membership
          predicate and lands in the KN-OPEN-020 high-degree/implicit class.
        responsibility: interface
      - claim: >-
          Saving A (rho sqrt(m)) and Saving B (index-calculus m-fold) are distinct
          quantities with distinct controls and are not multiplied.
        responsibility: scope
      - claim: >-
          At m = 233 the equivariance prior predicts no solving-stage difference
          between the dim-29 stable base and a random dim-29 base.
        responsibility: success_probability

  predictions:
    - metric: >-
        existence of a Frobenius-stable F_2-subspace of dimension in the band
        [m/(2t), 2m/t] at m in {163, 283, 409, 571}, by independent factorisation
        of T^m - 1
      direction: lower
      minimum_effect: >-
        ZERO -- none exists at any of the four degrees. Exhibiting one refutes claim
        (A)/(C) and, through IDEA-20260918-9abf42's correspondence, its count.
    - metric: >-
        dimension of the unique nontrivial stable subspace in the useful band at
        m = 233
      direction: different
      minimum_effect: >-
        EXACTLY 29. A different value refutes the ord_233(2) = 29 computation.
    - metric: >-
        first-fall / solving degree (per-instance, U-4-discharged per KN-FIND-936151)
        of the m = 233, t = 9 descended summation system on the dim-29 stable
        subspace versus a size-matched random dim-29 subspace
      direction: different
      minimum_effect: >-
        PREREGISTERED NEGATIVE: no difference beyond the known 9-fold relation
        multiply, by the equivariance prior. A difference surviving the null object
        is the surprise this cell exists to detect and would be the first FIPS-scale
        evidence that Saving B reaches the solving step.

  minimal_test:
    design: >-
      TWO PARTS, NO SOLVER. PART 1 (this machine, seconds): recompute ord_m(2) and
      the stable-subspace dimension sets at all five FIPS degrees by
      distinct-degree factorisation of T^m - 1 over F_2; confirm the table in claim
      (A) and that only m = 233 has a useful-band stable dimension. PART 2 (toy
      scale, m = 7 rich and m = 11/13 poor, reusing the object-existence lattice of
      IDEA-20260918-9abf42 and NOT reusing the ECC2K-130 QSP lane): at m = 7 build
      the dim-4 stable subspace and a size-matched random dim-4 subspace, generate
      the t = 2 Weil-descent summation systems for both, and count the descended
      system's monomial support and (if a small Groebner engine is available
      elsewhere) the first-fall/solving degree of each -- the arm-A-vs-arm-B design
      of IDEA-20260918-9abf42, here framed as the two-savings separation. This
      machine (4 core, 6 GB) runs PART 1 immediately and PART 2's system generation
      and monomial counts; the solving-degree read at m = 7 needs a Groebner engine
      over F_2 this machine lacks, so PART 2's degree metric is deferred to an
      engine-equipped executor.
    controls:
      - >-
        Null object: size-matched random (non-stable) subspace of the same
        dimension, same m, same t -- the "controls before belief" requirement.
      - >-
        Structural control: m = 11 and m = 13, where no stable subspace of
        useful dimension exists, so the treatment arm cannot be built -- shows the
        rich/poor split is structural, not a relabelling.
      - >-
        Saving-A separation control: rho on Frobenius classes is priced separately
        as the baseline and never folded into any index-calculus number.
    required_metrics:
      - ord_m(2) and the exact stable-subspace dimension set at each FIPS degree
      - >-
        presence/absence of a stable subspace in [m/(2t), 2m/t] at each degree
      - >-
        descended-system monomial support, stable vs random subspace, at m = 7,
        t = 2
      - >-
        (deferred) first-fall / solving degree, per-instance U-4-discharged, stable
        vs random, at m = 7, t = 2

  falsification_conditions:
    - >-
      A stable subspace of useful-band dimension is exhibited at any of m in
      {163, 283, 409, 571}: claim (A)/(C) is false and the record is withdrawn.
    - >-
      ord_233(2) is not 29, or m = 233 has no useful-band stable dimension: claim
      (D)'s "one live cell" is false.
    - >-
      At m = 7 the stable and random dim-4 subspaces differ in first-fall/solving
      degree beyond the known relation multiply: the equivariance-based negative
      prior in claim (D) is wrong -- the outcome worth the most, requiring
      independent review before it is stated anywhere.
    - >-
      A non-subspace orbit-union factor base is shown to give Saving B at NET cost
      below the subspace base after charging KN-OPEN-020 high-degree membership:
      the escape's dismissal in the mechanism is wrong.

  confounders:
    - >-
      Reading Saving A (rho sqrt(m)) and Saving B (index-calculus m-fold) as one
      factor. They are separate; the record forbids their multiplication and prices
      A as the baseline.
    - >-
      Mistaking the known m-fold relation multiply (a linear-algebra constant, real
      wherever a stable base exists) for a solving-stage gain. At m = 233 the
      former may hold and the latter is predicted absent.
    - >-
      Toy-n leakage: at m = 7 a stable subspace could coincide with some other
      structure; there are no proper subfields at prime m, which removes the main
      such coincidence.
    - >-
      Basis dependence of the descended-system monomial count -- the reduction
      polynomial must be held fixed across arm A and arm B (see
      IDEA-20260922-cdca3a), else a basis effect is misread as a stability effect.

  interpretation_limits:
    - >-
      A derivation plus a measurement design, unreviewed. Not a run, not evidence.
      No record may cite it as support until an independent review and a Coordinator
      decision compose it.
    - >-
      It does NOT say Frobenius helps the FIPS index calculus. At four degrees it
      says the saving is absent; at m = 233 it predicts (equivariance prior) that
      the available saving does not reach the solving step.
    - >-
      No attack exponent moves. rho with the Frobenius-class sqrt(m) speedup is the
      matched baseline at every K-curve and is untouched. No deployed parameter is
      broken anywhere in this record.
    - >-
      The m = 7 cell is toy scale; any transfer to m = 233 is an explicit
      extrapolation the contract must state. The five-degree TABLE, by contrast, is
      exact arithmetic at the real degrees and carries no extrapolation.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a summation-polynomial index calculus with t-point decomposition, the
        index-calculus-useful factor-base dimension lies in the band
        l in [m/(2t), 2m/t]; a factor base outside this band is either too small to
        yield relations or too large to store/solve within a rho-competitive
        budget.
      rigorous_support: >-
        The relation-yield accounting of Gaudry-Diem/Semaev index calculus, in
        which the number of t-point decompositions of a random target scales as
        2^(t l - m) and must exceed |B| = 2^l to close the linear system; this pins
        l near m/t up to the constant absorbed in the band. Matches the m* column
        of EXP-SEMBIN-992e73.
      validation_plan: >-
        At m = 7..17 (toy, this session's arithmetic plus an engine elsewhere),
        tabulate relation yield versus l for each t and confirm the productive l
        sits in [m/(2t), 2m/t]; compare against the 2^(t l - m) prediction and check
        the tail where l leaves the band (yield collapses below |B|). No solver
        needed for the counting form; a solver confirms the productive window.
    - id: H2
      statement: >-
        A factor base that is a union of full Frobenius orbits but not an
        F_2-subspace has membership description size Theta(m * (l/ m)) orbit
        representatives and a non-linear membership predicate, so its Weil-descent
        system is not the affine summation system and its per-membership cost is an
        orbit lookup, not an O(m^2) linear test.
      rigorous_support: >-
        A union of orbits closed under x -> x^2 is F_2-linear iff it is a subspace
        (an F_2-subspace closed under squaring is exactly a Frobenius-stable
        subspace); a non-subspace orbit union therefore fails linearity by
        definition, placing it in the KN-OPEN-020 high-degree/implicit class.
      validation_plan: >-
        At m = 7 exhibit a specific non-subspace orbit union of size ~2^4, write its
        membership predicate as a Boolean function, and measure its ANF degree and
        support against the dim-4 subspace's linear predicate; confirm the degree
        exceeds 1 and the descent system gains monomials. Pure arithmetic, this
        machine.

  target_complexity:
    time_exponent: >-
      No exponent claimed or moved. Best known at every K-curve is parallel Pollard
      rho with the Frobenius-class saving, ~ 2^(m/2) / sqrt(m) group operations
      (Saving A). This record asserts that on subspace-factor-base index calculus
      Saving B contributes a factor of exactly 1 at m in {163, 283, 409, 571} and
      at most a linear-algebra constant m at m = 233.
    memory_exponent: >-
      Not changed. rho is low-memory; a subspace-factor-base index calculus stores
      |B| = 2^l ~ 2^(m/t) relations, and a sigma-closed base at m = 233 would
      shrink the stored matrix by the constant factor 29's orbit size, not an
      exponent.
    best_known: >-
      Parallel rho with Frobenius saving: 2^(m/2 - (1/2)log2 m) at m = 163..571,
