idea:
  id: IDEA-20260905-d0fee4
  title: 'THE KUMMER LINE IS BEZOUT-OPTIMAL AMONG ALL COORDINATES E -> P^1, NOT ONLY AMONG DEGREE-2 ONES - for every
    F_p-rational f of degree n the window factor base f^{-1}(W) has |W|(1+o(1)) points regardless of n (average
    rational fibre size is #E(F_p)/#P^1(F_p)), and deg_t S_m^f >= n^{m-2}, so the d-fold free lunch of IDEA-20260808-2e14f7
    (HA-1, |V| = d*B) is predicted FALSE and the degree-d lane closes by argument; the y-coordinate is the universally
    available witness'
  class: mechanism
  claim: 'REPRESENTATION CLASS AND STAGE (RQ-ECDLP-623a32): class R2 (a coordinate function E -> P^1 of any degree
    n, generalising curve models); attack stages whose charged cost is addressed are factor-base membership (window
    size versus base size) and relation decomposition (Bezout number of the arity-m system); the claimed change
    to both is a BOUND, i.e. no coordinate lowers either below the Kummer line. Let E/F_p (p > 3) have prime order
    N and generic j, f : E -> P^1 any non-constant F_p-rational map of degree n >= 2, F_W = { P in E(F_p) : f(P)
    in W } for a window W of size B, and S_m^f the reduced summation polynomial in the coordinate f (as defined
    in IDEA-20260807-dadcd2 (A)). (C1) SIZE LAW. Summing #f^{-1}(t)(F_p) over t in P^1(F_p) gives #E(F_p) = p+1-a_p,
    so the AVERAGE rational fibre size is (p+1-a_p)/(p+1) = 1 + O(p^{-1/2}) for every n. Hence for a window chosen
    without knowledge of the fibre structure, E|F_W| = B(1 + O(p^{-1/2})) for EVERY n: fibre multiplicity n and
    rationality rate 1/n cancel exactly. (C2) DEGREE LAW. deg_t S_m^f >= n^{m-2}: for generic t_1..t_{m-1} the n^{m-1}
    preimage choices give pairwise distinct sums (KN-FIND-a8990a Theorem A step 3), and each f-value has at most
    n preimages, so at least n^{m-1}/n distinct values occur. Equality with the Kummer value 2^{m-2} requires n
    = 2. (C3) COROLLARY. At fixed base size B the Bezout number of the arity-m decomposition system in coordinate
    f is >= n^{m-2} B^{m-1}, minimised over ALL F_p-rational coordinates on a prime-order generic-j curve by the
    degree-2 coordinates, at 2^{m-2} B^{m-1}. This extends the lever-1 closure of dadcd2, 8027a2 and e6d79e from
    degree-2 models to all coordinate functions, by argument. (C4) WITNESS. The short-Weierstrass y-coordinate is
    a degree-3 non-Galois coordinate available on EVERY curve (the Hessian x of IDEA-20260807-5f5ace needs rational
    3-torsion): its fibres are the collinear triples on horizontal lines, summing to O. Predictions: |F_W^y| = B(1+o(1)),
    not 3B; deg_{y_i} S_3^y = 9; Bezout ratio y-system to x-system 9/2 at m = 3 and 3^{m-1}/2^{m-2} in general.
    TWO EXPLANATIONS DISCRIMINATED. E-A (2e14f7 HA-1): a degree-d window buys d*B points, so higher d is a solve-stage
    lever. E-B (this record): it buys B points for every d at a strictly larger degree, so d = 2 is optimal. One
    fibre count at toy p decides.'
  mechanism: 'OBJECT FRAME (docs/object-frame-ideation.md). The PAIR is (representation: the coordinate value f(P)
    in P^1(F_p) for a degree-n F_p-rational f, with the factor-base relation vector over F_W built from it; operation
    set Sigma: translation by factor-base elements only, i.e. the m-fold relation P_1 + ... + P_{m-1} = -R with
    all P_i in F_W). TRICHOTOMY CLASS: Class I, partial-action (IDEA-20260806-c5d183), one-line reason: the relation
    vector propagates deterministically only under translation by members of F_W, exactly as index calculus does;
    Sigma is not the full translation action. WHAT IS DISCARDED: the position of P within its f-fibre (up to n points),
    i.e. f is lossy in the representation actually used (|f^{-1}(t)| = n > 1 geometrically, and the y-coordinate
    has rational fibres of size 3 on a positive fraction of values). WHY THE DISCARD IS SIGMA-COMPATIBLE: under
    the m-fold relation the f-value of the sum is determined by the f-values of the summands up to a STATED BRANCHING
    BOUND of at most n^{m-2} (the count in (C2)); the deck-group quotient (dadcd2) reduces it to n^{m-2}/1 only
    when the fibre is a block of a group of automorphisms, which on prime-order generic-j curves means n = g = 2.
    So the compatibility is a branching bound, not a block system, and the bound is the quantity the record prices.
    (C1) is a double count: partition E(F_p) by f-value. Its content is that "rational fibres are rational at the
    generic rate" forces the rate 1/n, because Chebotarev over the Galois closure of f gives an expected number
    of rational points per fibre equal to 1 (average fixed-point count of a transitive permutation group, Burnside).
    (C2) is dadcd2''s fibre count without the deck-group quotient, hence a lower bound. Kummer optimality is arithmetic
    (rational deck group of order at most 2) plus counting, with no Groebner input.'
  non_generic_operation:
    operation: Factor-base construction by a coordinate window and the elimination degree of the decomposition polynomial
      - field-level (R1/R2) operations a generic-group simulator cannot perform; the record shows neither can be
      made cheaper than the Kummer line by any choice of coordinate function.
    attack_stage: factor-base membership and relation decomposition (Bezout count)
  object_first_candidate:
    tracked_object: 'The rational fibre-size distribution of a coordinate map f, i.e. the multiset { #f^{-1}(t)(F_p)
      : t in P^1(F_p) }, and the induced elimination degree deg_t S_m^f, tracked as f ranges over all F_p-rational
      maps of degree n.'
    established_families_off_limits: Degree-2 coordinates are the closed baseline and enter only as the n = 2 row;
      F1-F7 are not the lens. F2 is used as a COMPONENT (see assumptions).
    lossy_projection_test: 'Passes clause one (fibres of size n); fails clause two by the QUANTIFIED branching n^{m-2}.
      Meter values of IDEA-20260802-002 predicted for the rational-point meter under Sigma = the pair addition:
      x: (L, b) = (1.000, 2.000); y: (0.585, 2.25) under the Chebotarev fibre distribution (rational fibre sizes
      1 and 3 with conditional probabilities 3/4 and 1/4 given non-empty); a degree-4 coordinate r o x with deg
      r = 2: (1.415, 3.56). Derived numbers; they can fail.'
    survival: (C1) survives every coordinate and curve (double count). (C2) survives every coordinate whose rational
      deck group has order at most 2; it is escaped only where g > 2 is rational (j = 0, 1728 with the congruence
      conditions), the exception set dadcd2 already names.
