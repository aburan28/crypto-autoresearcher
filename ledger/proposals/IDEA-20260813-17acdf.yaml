  enumerated_closures:
    - >-
      Failure to reproduce the sparse primary row closes adaptation from the
      abstract; it is an evidence/specification stop, not evidence against the
      mathematical mechanism.
    - >-
      Reproduced sparse gain plus <2-bit CBD gain identifies secret sparsity as
      the load-bearing boundary and closes only this CBD composition.
  open_directions:
    - Non-type-class interfaces if coefficient order, not counts, carries the sparse gain.
    - Exact proofs of the 8-bit online ceiling under orbit overlap.
    - Other standardized small-secret laws, kept separate from ML-KEM.
