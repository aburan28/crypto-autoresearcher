idea:
  id: IDEA-20260808-8a6cb5
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  title: 'delta_E is Lipschitz along isogeny edges but the SUCCESS indicator need not be:
    measure the autocorrelation of 1{delta_E is B-smooth} along non-backtracking walks against
    the Ramanujan decay rate, which decides whether cross-attempt table amortisation (lever
    A7) has any yield at all.'
  class: measurement
  claim: 'For ell-isogenous E, E'' one has delta_{E''} <= ell^2 delta_E and delta_E <= ell^2
    delta_{E''} (composition with the edge and its dual), so log delta is Lipschitz with constant
    2 log ell and its sub-level sets are NECESSARILY clustered. CLAIM: the algorithm''s success
    indicator S_B(E) := 1{delta_E is B-smooth} inherits NO such clustering, because multiplying
    a degree by ell^2 changes its smoothness only through the single prime ell, and for ell
    <= B it does not change it at all. Formally: if ell <= B then delta_E B-smooth implies
    the neighbour''s minimum is at most ell^2 delta_E which is B-smooth -- so there IS a forced
    one-sided correlation, and the record''s precise claim is that the two-sided correlation
    of S_B decays at the Ramanujan rate (2 sqrt(ell)/(ell+1))^k in the walk length k, whereas
    that of log delta_E decays no faster than the Lipschitz floor allows. THE DISCRIMINATION:
    if S_B decays at the Ramanujan rate, lever A7 (cross-attempt amortisation) has no yield
    and can be closed; if it decays materially more slowly, A7 is live and successive attempts
    should reuse tables, which is a genuine cofactor saving in the regime GOAL-SSIQ-001 calls
    "the lowered-threshold regime".'
  mechanism: 'Two fields on the same graph with different regularity: log delta_E is 2 log
    ell-Lipschitz by composition, S_B is a smoothness indicator of a Lipschitz-varying integer.
    Composition multiplies by ell^2, which for ell <= B preserves B-smoothness in one direction
    and can destroy it in the other only when the MINIMUM changes identity (the neighbour''s
    minimum need not be the composed vector). So the correlation structure of S_B is governed
    by how often the minimising vector changes along an edge -- a measurable combinatorial
    quantity that this corpus has never measured.'
  why_not_a_renamed_known_approach: 'Catalogue B1-7 ("The Frobenius displacement field delta(E)
    -- marginal law, autocorrelation, and whether it can be steered") measures the autocorrelation
    of delta itself, whose Lipschitz clustering is FORCED and therefore uninformative about
    the algorithm. This record measures the autocorrelation of the SUCCESS INDICATOR, which
    is the variable the runtime actually depends on and whose clustering is not forced. Catalogue
    Q3-5 ("A7 closed at the source''s parameters: cross-attempt matches are valid, their yield
    is exactly the birthday rate") closes A7 at the source''s parameters by a yield argument;
    this decides it by a correlation measurement, and the two can disagree.'
  predictions:
  - observable: lag-k autocorrelation of S_B along non-backtracking 2-isogeny walks
    metric: Pearson correlation of S_B(E_0) and S_B(E_k)
    predicted: 'Decay like (2 sqrt(2)/3)^k = 0.9428^k, the Ramanujan rate at ell = 2, so below
      0.05 by k ~ 50. Pre-registered threshold: consistent with the Ramanujan envelope at
      all k <= 30.'
  - observable: lag-k autocorrelation of log delta_E
    metric: same
    predicted: Materially SLOWER decay, bounded below by the Lipschitz constraint. The CONTRAST
      between the two fields is the deliverable, not either value alone.
  - observable: minimiser-change rate
    metric: fraction of edges along which the minimising vector of the trace-zero lattice
      changes identity
    predicted: Theta(1) per edge. If it is o(1), S_B inherits delta's clustering and A7 is
      live.
  minimal_test: 'On the four committed graphs (p = 2437, 3889, 5737, 7333, |V| = 203-611)
    with their committed delta_E labels: compute S_B for B on a small grid, then estimate
    lag-k autocorrelations by averaging over all vertices and all non-backtracking walks up
    to k = 30. Compare to (i) the Ramanujan envelope and (ii) a label-permutation null. Costs
    minutes.'
  controls:
  - 'PERMUTATION NULL (must be flat): permute the S_B labels across vertices and recompute;
    autocorrelation must vanish at every lag. This corpus already has a delta_E label-permutation
    null archived (EV-SSIQ-a64d92), and this record uses the same instrument.'
  - 'POSITIVE CONTROL (must fire): a synthetic field constructed to be Lipschitz by design
    (e.g. graph distance to a fixed vertex, thresholded). Its autocorrelation must decay slower
    than Ramanujan, confirming the estimator can detect clustering.'
  - 'FORCED-VALUE CONTROL: at lag k = 0 the autocorrelation is exactly 1; at k above the graph
    diameter it must equal the permutation null within its spread.'
  - 'SPECTRAL CONTROL: compute the second eigenvalue of the actual toy graph and check it
    is within the Ramanujan bound 2 sqrt(2); if not, the envelope being compared against is
    wrong.'
  confounders:
  - '|V| <= 611 means the diameter is ~2 log_2 611 ~ 18, so lags beyond ~20 are saturated
    and carry no information. The usable lag range must be stated before the run.'
  - At toy p, B-smoothness of delta_E is nearly automatic (delta_E is small), so S_B may be
    nearly constant and the correlation undefined. The B grid must be chosen so that S_B has
    non-degenerate variance, and that choice must be pre-registered.
  - 'GOAL-SSIQ-001''s instrument_calibration standing practice: run the estimator on an object
    of known autocorrelation before freezing.'
  falsification_conditions:
  - The permutation null is not flat -- pipeline artifact, stop.
  - The positive control does not show slower-than-Ramanujan decay -- estimator has no power.
  - S_B's autocorrelation is materially slower than Ramanujan across all four primes, which
    reopens A7 and contradicts catalogue Q3-5's birthday-rate closure. That disagreement would
    be the most valuable outcome.
  interpretation_limits: Toy tier, at |V| <= 611, on graphs already committed. The result
    speaks to the correlation structure of those graphs and, by the stated mechanism, to what
    one should expect at scale -- but the extrapolation is labelled as such. It changes no
    exponent; its value is to decide a named lever (A7) cheaply and in a direction the corpus's
    existing closure of A7 did not test.
  assumptions:
  - The four graphs and their delta_E labels are as archived under EXP-SSIQ-a85692, including
    the BATCH-013 finding that budget-truncated delta_E search biases values upward, which
    must be applied when reading the labels.
  - Pizer's Ramanujan property for the supersingular 2-isogeny graph.
  heuristic_assumptions:
  - id: HB-7
    statement: SMOOTHNESS DECORRELATION. Along a non-backtracking walk, the events {delta_{E_0}
      is B-smooth} and {delta_{E_k} is B-smooth} decorrelate at the graph's spectral rate,
      i.e. their correlation is O((2 sqrt(ell)/(ell+1))^k).
    rigorous_ingredient: Pizer's theorem (the graph is Ramanujan) plus the expander mixing
      lemma, which bounds the correlation of ANY two bounded functions at exactly that rate
      -- so the heuristic is only that S_B is not adversarially aligned with the top non-trivial
      eigenspaces.
    distribution_imitated: The uniform product measure, i.e. independence, which is what mixing
      delivers for well-spread indicator functions.
    validation_route: Toy, on the four committed graphs, against the permutation null and
      the Lipschitz positive control. LABELLED TOY. A crypto-scale route does NOT exist for
      this quantity, because it needs adjacency, which the Deuring sampler does not provide
      -- and that limitation is stated rather than finessed.
    tail_checks: At k = 0 and at k > diameter, the forced values 1 and (null) respectively.
  target_complexity:
    time_exponent: n/a for the measurement. Its consequence is for lever A7, whose best case
      is a cofactor saving in the number of table rebuilds -- explicitly NOT an exponent,
      and the record says so up front.
    memory_exponent: O(|V|) at toy scale.
    best_known_baseline: p^{1/3+o(1)} time and memory conditional on Heuristic 1; A7 currently
      closed at the source's parameters by catalogue Q3-5's birthday-rate argument.
    hidden_overhead_disclosure: None added.
    time_memory_tradeoff: If A7 is live, successive attempts share a table and the effective
      memory per attempt falls without a time penalty -- which is a movement along the vOW
      curve and must be reported as such.
  sota_delta: Zero. A cheap decision on a named lever, using an already-archived instrument
    and already-archived data, with a contrast (two fields on one graph) that makes the null
    interpretable.
  dominated_by: n/a (no result claimed). Rows checked as in S1b-06; A7's own prior closure
    (catalogue Q3-5) is the nearest competing statement and this record is designed to be
    able to contradict it.
  estimated_cost: Implementation low (reuses the archived label-permutation null). Compute
    low (minutes).
  recommended_priority: medium
  honest_prior_of_survival: 0.85 that the measurement runs cleanly on archived data. 0.3 that
    S_B shows materially slower-than-Ramanujan decay; the mechanism argues both ways (composition
    preserves smoothness one-sidedly, minimiser changes destroy it) and that genuine ambivalence
    is why the measurement is worth making.
  novelty_status: screened
  novelty_screen: 'Screened against all six dedup files and S1.yaml. Nearest: catalogue B1-7
    (autocorrelation of delta itself), Q3-5 (A7 closed at the source''s parameters), Q3-6
    (forced trapping, Siegel exponent and the Lipschitz constant ell^2), and GOAL-SSIQ-001''s
