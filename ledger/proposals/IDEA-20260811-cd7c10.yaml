idea:
  id: IDEA-20260811-cd7c10
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE FRACTIONAL PART OF THE HURWITZ MASS IS A FREE, EXACT DETECTOR FOR
    SPECIAL-|Aut| VERTICES - since the Deuring mass is the sum of 2/|Aut| over
    the class, it is an INTEGER unless the class contains j = 0 (contributing
    1/3) or j = 1728 (contributing 1/2), so H(4p - t^2) mod 1 lies in
    {0, 1/3, 1/2, 5/6} and tells you which, from p and t alone, with no
    enumeration; pre-registered at p = 4001: ZERO traces with D_0 = -3 because
    4001 = 2 mod 3, and EXACTLY FOUR traces (+-80, +-98) with D_0 = -4 and
    fractional mass 1/2, each containing exactly one j = 1728 vertex
  class: tooling

  object: >-
    OBJ-MASS, the Hurwitz-Kronecker mass H(4p - t^2) = sum over the class of
    2/|Aut(E)|, viewed not as a class SIZE but as a WEIGHTED count whose
    fractional part is a fingerprint of the class's automorphism content. The
    tracked object is the discrepancy between the mass and the vertex count -
    a quantity that is identically zero for almost every class and non-zero
    exactly at the classes this lane exists to study.

  resource: >-
    R3 and R4 - the endomorphism ring and the class-group/isogeny-graph
    structure - used purely as an enumeration control. H-ENDO-001 admissibility:
    no endomorphism acts on any point of G; this record touches no group at all.

  claim: >-
    (A) THE IDENTITY AND ITS FRACTIONAL PART. By Deuring, for an ordinary trace t
    with gcd(t, p) = 1 the number of F_p-isomorphism classes in the isogeny class
    of trace t is counted with weight 2/|Aut(E)|, and the weighted total is the
    Hurwitz-Kronecker class number H(4p - t^2). Since |Aut| = 2 for every j
    outside {0, 1728}, |Aut| = 6 at j = 0 (p = 1 mod 3) and |Aut| = 4 at
    j = 1728 (p = 1 mod 4), the mass decomposes as
        H(4p - t^2) = (#vertices with |Aut| = 2)
                      + (1/3 if the class contains j = 0)
                      + (1/2 if the class contains j = 1728),
    so its fractional part lies in {0, 1/3, 1/2, 5/6} and IDENTIFIES which
    special vertices the class contains, without enumerating a single curve.
    [Derived in this record from the standard mass formula; elementary.]
    (B) WHY THE CAMPAIGN NEEDS THIS AS A BLOCKING CONTROL. MATCHED-ORDER-DESIGN.md
    carries the caveat forward explicitly: "isogeny-class sizes above are class
    numbers of orders. For D_0 in {-3, -4} the Deuring correspondence weights
    j = 0 and j = 1728 by 1/3 and 1/2; the campaign already enumerates against
    the Hurwitz-Kronecker mass formula and that enumeration, not this note, is
    the authority on the exact vertex count." Any per-vertex statistic computed
    on a D_0 in {-3, -4} class with the wrong denominator is silently wrong, and
    the error is largest precisely at the crater, which is the single vertex
    IDEA-20260811-99cc67 depends on. This record turns that caveat into an
    executable check.
    (C) THE PRE-REGISTERED PREDICTIONS AT p = 4001, DERIVED BY HAND HERE AND TO
    BE MACHINE-VERIFIED. 4001 = 2 mod 3, so the norm form 4p = t^2 + 3f^2 has NO
    solution and NO ordinary class at p = 4001 has D_0 = -3; equivalently, j = 0
    is SUPERSINGULAR at p = 4001 and appears in no ordinary class. Therefore ZERO
    traces at p = 4001 have fractional mass 1/3 or 5/6. Meanwhile 4001 = 1 mod 4,
    so j = 1728 is ordinary, and D = t^2 - 4p = -4f^2 requires t = 2s with
    s^2 + f^2 = 4001; the representation 4001 = 40^2 + 49^2 gives exactly the
    trace pairs t = +-80 (f = 49) and t = +-98 (f = 40). PREDICTION: EXACTLY FOUR
    traces at p = 4001 have D_0 = -4, namely +-80 and +-98; each of the four
    classes contains EXACTLY ONE j = 1728 vertex; and each has H(4p - t^2) with
    fractional part exactly 1/2. Every other admissible trace has integer mass.
    THIS IS FULLY CHECKABLE AGAINST DATA THE CAMPAIGN ALREADY HAS: EV-ICINV-6b6264
    records that all 253 traces at p = 4001 were checked against the mass formula
    with zero disagreements, so the four fractional masses are either already in
    that output or the output rounded them - and finding out which is the point.
    (D) THE SECOND, SHARPER USE. The fractional part gives a POLYNOMIAL-TIME test,
    from (p, t) alone, for whether an isogeny class contains a curve with extra
    automorphisms - which is exactly T4's statement ("j = 0 requires D_0 = -3,
    j = 1728 requires D_0 = -4") arrived at by a completely independent route. The
    two must agree on all 253 traces at p = 4001 and on all admissible traces at
    two further primes. Agreement is a strong cross-check of both; disagreement
    would locate a defect in one of them, and either outcome is worth the minutes
    it costs.

  mechanism: >-
    The Deuring correspondence counts curves with multiplicity 2/|Aut| because
    the mass formula is a statement about a groupoid rather than a set. Almost
    all vertices have |Aut| = 2 and weight 1, so the mass usually equals the
    count and nobody notices. The two exceptional automorphism groups have orders
    4 and 6, contributing weights 1/2 and 1/3 - and since 1/2 and 1/3 are the only
    non-integral weights available, and each special j occurs at most once per
    class, the fractional part is an injective fingerprint of the special
    content. The mechanism is arithmetic bookkeeping, which is exactly why it is
    free and exactly why it is the right control.

  novelty_status: known
  novelty_note: >-
    The mass formula and the automorphism weights are classical and are already
    used by this campaign (EV-ICINV-6b6264, all 253 traces at p = 4001 verified
    against H(15104) = 138 with zero disagreements). The fractional-part reading
    is an immediate corollary and this record does not claim it as new
    mathematics; `known` is the honest status. What is NEW here is only the
    OPERATIONAL use as a blocking enumeration control and the specific p = 4001
    predictions in (C), which corpus grep does not find anywhere. External
    literature NOT checked and not needed - the mathematics is textbook.
  not_a_duplicate_of: >-
    NOT the census in EV-ICINV-6b6264, which verified the mass formula on a class
    whose |Aut| multiset is {2: 138} and where the fractional part is
    identically zero, so the check this record proposes was not exercised. NOT
    IDEA-20260811-3e08e0, which censuses the degeneration divisor against traces
    and is about a different (non-CM, non-automorphism) notion of special j. NOT
    IDEA-20260811-99cc67, which measures on a D_0 = -3 class; this record is the
    enumeration control that class's denominators depend on.

  assumptions:
  - >-
    gcd(t, p) = 1 (ordinary), t^2 < 4p, and p > 3. Supersingular traces are
    excluded and reported as excluded; the mass formula there is a different
    statement.
  - >-
    The campaign's committed 253-trace verification at p = 4001 is correct. It is
    used as a fixture, and part of this record's purpose is to determine whether
    that verification exercised the fractional case at all.
  - >-
    Each isogeny class contains at most one curve with j = 0 and at most one with
    j = 1728 - true because a class contains at most one curve per j-invariant
    (the committed t = 30 class has 138 members with 138 DISTINCT j-invariants,
    EV-ICINV-6b6264) and j = 0, j = 1728 are single j-values.

  proof_search_map:
    bottleneck: >-
      The bottleneck is silent denominator error: a per-vertex statistic on a
      D_0 in {-3, -4} class divides by the wrong count, and the error is
      concentrated at the one vertex the design cares about. Nothing downstream
      can detect it.
    baseline_embedding:
      parameter_slice: >-
        The t = 30 class at p = 4001 is the baseline slice: |Aut| multiset
        {2: 138}, mass 138, count 138, fractional part 0. The check must return
        "no special vertex" there, exactly as committed.
      reproduction_check: >-
        Recompute H(15104) = 138 and confirm the fractional part is 0, then
        confirm the same code returns 1/2 on the predicted t = 80 class. A
        checker that returns 0 everywhere is not a checker.
    observation_collision:
      observable: The fractional part of H(4p - t^2).
      distinct_preimage_search: >-
        PERFORMED. The fractional part 1/2 has exactly one preimage among the
        possible automorphism contents (j = 1728 present, j = 0 absent), and
        likewise 1/3 and 5/6 - so the observable is INJECTIVE on the four
        possible states, which is unusual and is what makes it a detector rather
        than a statistic. The only collision is that fractional part 0 is
        consistent with "no special vertex" and with an implementation that
        rounds; the C-FRACTION control below separates those.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Move the question "does this class contain a curve with extra
        automorphisms" from an enumeration over up to sqrt(p) curves to an exact
        rational equality on a single class number.
      predicted_gain: >-
        From O(class size) curve constructions to O(1) arithmetic, with an exact
        rather than probabilistic answer.
    quantifier_order: >-
      FOR ALL admissible ordinary traces t at a prime p, frac(H(4p - t^2)) is 0,
      1/3, 1/2 or 5/6, and the value determines the special-automorphism content
      of the class. No witness is chosen by anyone; the statement is uniform in p
      and t.
    method_ceiling:
      strongest_certifiable_claim: >-
        The exact special-automorphism content of every isogeny class at a given
        p, in time polynomial in log p per class. It CANNOT locate WHICH vertex
        is special, only that one exists, and it says nothing about any cost
        functional.
      nearby_object_control: >-
        The nearby object where the desired conclusion fails is a class with
        D_0 = -3 at a prime where j = 0 is supersingular - i.e. p = 2 mod 3, as
        at p = 4001. The method must report ZERO such classes there, and a method
        that reports one has confused the supersingular and ordinary cases.
    proof_obligations:
    - claim: frac(H) lies in {0, 1/3, 1/2, 5/6}
      responsibility: correctness
    - claim: At p = 4001 exactly four traces have D_0 = -4 and none has D_0 = -3
      responsibility: correctness
    - claim: The baseline t = 30 class returns fractional part 0
      responsibility: baseline
    - claim: Vertex counts used as denominators elsewhere are corrected accordingly
      responsibility: interface

  predictions:
  - metric: count_of_traces_at_p4001_with_D0_minus3
    direction: different
    minimum_effect: >-
      EXACTLY 0, because 4001 = 2 mod 3 so 4p = t^2 + 3f^2 is unsolvable. A
      non-zero count refutes this record or the primality/residue arithmetic.
  - metric: traces_at_p4001_with_D0_minus4
    direction: different
    minimum_effect: >-
      EXACTLY the four values +-80 and +-98, from 4001 = 40^2 + 49^2. Any other
      trace with D_0 = -4, or a missing one, is a falsification.
  - metric: fractional_part_of_mass_at_those_four_traces
    direction: different
    minimum_effect: >-
      EXACTLY 1/2 at all four. Not approximately - exactly, in rational
      arithmetic. A floating-point implementation that reports 0.5000000001 has
      not verified the claim and the contract requires exact rationals.
  - metric: fractional_part_of_mass_at_all_other_traces
    direction: different
    minimum_effect: EXACTLY 0 at all remaining admissible traces at p = 4001.
  - metric: agreement_with_t4_route
    direction: different
    minimum_effect: >-
      100% agreement between the fractional-part detector and the direct T4 test
      (is D/(-3) or D/(-4) a perfect square) on all admissible traces at three
      primes. A single disagreement locates a defect in one route and must be
      resolved before either is used.
  - metric: vertex_count_versus_mass_discrepancy_at_a_D0_minus3_class
    direction: different
    minimum_effect: >-
      At the N = 19507, t = 211 class of IDEA-20260811-99cc67: vertex count 37,
      mass 36 + 1/3, discrepancy exactly 2/3. This is the number that a
      class-number-based denominator would get wrong, and it is stated here so
      that record's design can be checked against it.

  minimal_test:
    design: >-
      MINUTES OF EXACT RATIONAL ARITHMETIC. (1) Implement H(D) in exact rationals
      (never floating point) via the Hurwitz-Kronecker definition, cross-checked
      against a second implementation. (2) For every admissible ordinary trace at
      p in {2003, 4001, 6007} compute H(4p - t^2), its fractional part, D_0 and
      the conductor, and the direct T4 test. (3) Confirm the four predicted
      D_0 = -4 traces at p = 4001 and the absence of D_0 = -3. (4) For at least
      one class of each fractional type, ENUMERATE the class explicitly and
      confirm the vertex count equals mass + 2/3 (j = 0 present), mass + 1/2
      (j = 1728 present) or mass (neither), and that the special vertex is where
      the detector says. (5) Do the same at N = 19507, t = 211, p = 19717 for the
      D_0 = -3 case, which is the case p = 4001 cannot exercise. (6) Emit a
      reusable checker other contracts can call.
    controls:
    - >-
      C-BASELINE. The t = 30 class at p = 4001 returns fractional part 0 and
      count 138 = mass 138, reproducing committed data.
    - >-
      C-FRACTION (BLOCKING). At least one class of EACH non-zero fractional type
      must be exercised - 1/2 at p = 4001 and 1/3 at p = 19717 - or the checker
      has never been shown able to return anything but 0, and every zero it
      reports is uninformative. This is the control the committed 253-trace
      verification could not have run, since p = 4001 has no D_0 = -3 class.
    - >-
      C-EXACT. Rational arithmetic throughout; a floating-point mass is not an
      admissible verification of a fractional-part claim.
    - >-
      C-ENUMERATE. For each exercised class, the explicit enumeration must find
      the special vertex the detector predicts, at the predicted j.
    - >-
      C-SUPERSINGULAR. Supersingular traces are identified and excluded, and the
      exclusion count is reported; silently including them would corrupt the
      fractional-part statistics.
    required_metrics:
    - exact_rational_mass_per_trace_per_prime
    - fractional_part_per_trace
    - D0_and_conductor_per_trace
    - t4_direct_test_agreement_rate
    - enumerated_vertex_count_versus_mass_per_exercised_class
    - special_vertex_j_invariant_per_exercised_class
    - supersingular_exclusion_count

  lossy_projection_answer: >-
    The projection is class -> H(4p - t^2) -> frac(H), which discards everything
    except a single rational's fractional part. It is compatible with the
    campaign's operations in the strongest possible sense: the mass is an isogeny
    class invariant by construction, so the retained quantity is constant on the
    object it labels and propagates trivially. Unusually for this lane, the
    projection loses almost everything and still answers the question exactly -
    the same pattern as IDEA-20260811-df6c0f - and it does so because the
    surviving information is a discrete fingerprint rather than a continuous
    shadow. THE HONEST LIMIT: it answers a question about AUTOMORPHISMS, and the
    lane's committed automorphism ceiling is sqrt(6), so this record cannot
    produce anything above baseline calibration and does not try.

  t5_reachability_answer: >-
    NOT ENGAGED - no cost functional and no walk. It does contribute to T5
    indirectly and usefully: because the detector runs from (p, t) alone, an
    attacker or auditor can decide in polynomial time whether an instance's class
    contains a special-automorphism vertex, without touching the isogeny graph.
    That is a genuine LOCAL test in T5's sense, but the thing it detects is worth
    at most sqrt(6), so passing the gate buys nothing - the same pattern
    IDEA-20260811-3e08e0 finds for the degeneration divisor, arrived at
    independently.

  null_object: >-
    C-BASELINE (a class with fractional part 0, where the detector must report
    nothing) is the null; C-FRACTION (classes with fractional parts 1/2 and 1/3,
    where it must report something) is the planted positive. Both directions are
    required, per DECOMPOSITION.md L14.

  falsification_conditions:
  - >-
    Any admissible ordinary trace has a mass with fractional part outside
    {0, 1/3, 1/2, 5/6}. The identity in (A) is wrong.
  - >-
    p = 4001 has a trace with D_0 = -3, or the D_0 = -4 traces are not exactly
    {+-80, +-98}. The hand arithmetic in (C) is wrong and must be redone.
  - >-
    The fractional-part detector disagrees with the direct T4 test on any trace.
    One route is defective and neither may be used until resolved.
  - >-
    An enumerated class's vertex count does not match mass plus the predicted
    correction. The Deuring weighting is being applied incorrectly somewhere and
    every per-vertex denominator in the campaign is suspect.
  - >-
    C-FRACTION cannot be exercised - no class of non-zero fractional type is
    reachable within budget. The checker is unvalidated and must be labelled as
    such rather than shipped.

  confounders:
  - >-
    Floating point. A mass computed in floating point cannot verify a claim about
    exact fractional parts, and the failure would be silent. Exact rationals are
    a blocking requirement.
  - >-
    Supersingular traces, where the counting is a different statement; excluded
    and counted.
  - >-
    Small p. For p = 2 and p = 3 the automorphism groups are larger still and the
    weight set changes; excluded by the p > 3 assumption.
  - >-
    j = 0 and j = 1728 coinciding, which happens only in small characteristic;
    excluded.

  interpretation_limits:
  - >-
    This is a control, not a finding. It produces no statement about ECDLP cost,
    and its status is `known` mathematics operationalised.
  - >-
    It detects PRESENCE of a special vertex, not its usefulness. The lane's
    ceiling for automorphism-derived advantage remains sqrt(6) (KN-TECH-018) and
    nothing here moves it.
  - >-
    claim_tier toy, and in fact the primary limb is a derivation with no
    experimental tier.

  heuristic_assumptions:
  - id: H1
    statement: >-
      NO HEURISTIC IS LOAD-BEARING. The mass formula is a theorem, the
      automorphism orders are classical, and the arithmetic is exact.
    rigorous_support: >-
      Deuring's correspondence and the Hurwitz-Kronecker class number formula,
      already verified by this campaign on all 253 traces at p = 4001 with zero
      disagreements (EV-ICINV-6b6264, re-verified independently by
      VAL-20260810-dc8bd8).
    validation_plan: >-
      Exact rational recomputation in two independent implementations across
      three primes, with the C-FRACTION positive control exercising both non-zero
      fractional types. No sampling distribution applies. Tail check: the largest
      and smallest class at each prime, where an off-by-one in the enumeration
      would show first.

  target_complexity:
    time_exponent: >-
      NONE CLAIMED as an attack. As a checker, the detector is polynomial in
      log p per class - a class-number computation - versus O(class size) curve
      constructions for the enumeration route, i.e. roughly a p^{1/2} saving on
      an auditing task that is not an attack.
    memory_exponent: O(1) per class.
    best_known: >-
      For the ECDLP itself, 0.886*sqrt(N) group operations and O(1) memory
      (KN-TECH-001, KN-TECH-006), automorphism-discounted on CM curves
      (KN-TECH-018). This record does not compete with that and does not try.
    hidden_overhead: >-
      Class-number computation for H(D) is subexponential in |D| by naive methods
      and quasi-polynomial by better ones; at toy |D| this is irrelevant and at
      cryptographic |D| it would dominate, which is an honest limit on the
      "polynomial-time detector" description and is stated rather than glossed.
    tradeoff_note: Not applicable.

  dominated_by: >-
    n/a as an attack (no attack result claimed); every row of the ECDLP frontier
    trivially dominates. As an auditing tool it is dominated by nothing in the
    corpus, because the corpus contains no equivalent check - but the T4 direct
    test (is D/(-3) or D/(-4) a perfect square, as in IDEA-20260807-51675e) is a
    CHEAPER route to the same yes/no answer and DOMINATES this record for that
    specific question. This record's non-dominated contribution is the exact
    VERTEX-COUNT correction, which the square test does not give.
  sota_delta: >-
    ZERO on every attack axis. On the auditing axis, the honest statement is that
    the nine-square-test route of IDEA-20260807-51675e already answers the
    presence question more cheaply, and this record adds only the count
    correction.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  expected_value: >-
    MEDIUM AS A BUILDING BLOCK, LOW AS A DISCOVERY, AND I SAY SO PLAINLY. Its
    mathematics is `known` and IDEA-20260807-51675e already dominates its
    presence-detection use. It earns its slot for two reasons: it is a BLOCKING
    PREREQUISITE for IDEA-20260811-99cc67, whose entire design rests on the
    vertex count of a D_0 = -3 class where mass and count differ by 2/3; and its
    p = 4001 predictions are exactly checkable against data the campaign already
    committed, so it costs minutes and either confirms the existing enumeration
    or finds a rounding defect in it. If the coordinator runs
    IDEA-20260811-99cc67, this must run first; otherwise it is optional.
