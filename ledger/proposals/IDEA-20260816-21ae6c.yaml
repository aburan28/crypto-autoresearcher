idea:
  id: IDEA-20260816-21ae6c
  question_id: RQ-ALR-001
  added: '2026-08-16'
  title: 'Check whether the ALR lane''s central comparison is a comparison at all: resolve the base
    of the B in the represented-route exponent 7/2 and the base of the B in the 5/2 rho proxy back
    to primitive parameters, and report whether one substitution makes them commensurable'
  class: control
  claim: '(A) EV-ALR-001 and EV-ALR-002 both close their observation lists with the same sentence:
    the standard represented routes retain nN = B^(7/2), above the B^(5/2) rho proxy. That single
    comparison is the lane''s entire cost verdict and it is repeated in H-ALR-001, H-ALR-002 and both
    evidence records. It is a comparison of two exponents in a symbol B whose definition is never
    given in either record. (B) The audit is elementary and costs nothing to run: resolve B back to
    primitive parameters on each side. On the represented side B must be defined so that nN = B^(7/2),
    which fixes B as a function of the divisor degrees. On the rho side B must be defined so that
    a generic square-root search costs B^(5/2), which fixes B as a function of the group order and
    of whatever per-step charge is being applied. The deliverable is those two substitution maps written
    out and compared. (C) There are exactly three possible outcomes and all three are useful. The
    maps agree, in which case the comparison stands and the lane gains a written definition it currently
    lacks. The maps differ by a stated reparameterisation, in which case the entry supplies the correction
    and the corrected exponents. The maps cannot be reconciled at the recorded parameters, in which
    case the comparison is a category error and the lane''s cost verdict must be restated in commensurable
    units before it is cited again. (D) Whichever outcome occurs, the deliverable is a units table:
    each exponent with its base defined in primitive parameters, its per-operation charge, and its
    memory charge, so that a later reader can check the comparison instead of inheriting it. (E) NOT
    CLAIMED: no attack, no speedup, no assertion that either exponent is wrong, and no claim that
    Pollard rho is faster or slower than anything. This is an internal units audit of two committed
    sentences. It is not an audit of this program''s timing instrument, its machine variance, or its
    single-machine measurement discipline, and it produces no timing at all.'
  mechanism: 'STAGE 1, extract the two sentences verbatim from EV-ALR-001 and EV-ALR-002 and record
    their exact wording in the contract, since a paraphrase would defeat the whole exercise. STAGE
    2, for the represented side, solve nN = B^(7/2) for B in terms of n and N and record the resulting
    definition, then check whether that definition is stable across the five named represented routes
    or whether different routes force different B. STAGE 3, for the rho side, write the standard generic
    square-root cost as a function of the group order and identify what additional factor turns it
    into B^(5/2), recording that factor explicitly as a per-step or memory charge rather than absorbing
    it. STAGE 4, compare dimensions: each exponent''s base must be a count of the same kind of thing
    for the comparison to be meaningful, and the audit reports whether it is. STAGE 5, attempt one
    substitution that reconciles the two, at the recorded toy parameters, and report the residual.
    STAGE 6, run the discriminating control below. STAGE 7, emit the units table and, if the maps
    do not reconcile, a restatement of the lane''s cost verdict in whichever units both sides can
    support, without claiming either side is wrong.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read ledger/evidence/EV-ALR-001.yaml and EV-ALR-002.yaml in full, including the exact
      observation sentences; read ledger/hypotheses/H-ALR-001.yaml and H-ALR-002.yaml predictions
      blocks, both of which contain the metric represented_route_exponent_B with minimum_effect stated
      as 7/2 versus the 5/2 rho proxy. Greps run: grep -ril ''commensurab'' ledger/proposals/ (6 hits,
      including IDEA-20260809-bf5139, IDEA-20260805-3a855d, IDEA-20260811-7a44a5); grep -ril ''represented
      nN|nN body|memory exponent'' ledger/proposals/ (10 hits). Read the blacklist item naming RQ-INSTR-f8faa0
      as owning cost-model and machine-variance audits.'
    results: The metric name represented_route_exponent_B appears in H-ALR-001, H-ALR-002 and both
      ALR evidence records and nowhere under ledger/proposals/. Six proposals use commensurability
      language; they are spread across other lanes and none resolves an exponent base back to primitive
      parameters. The blacklist names fifteen or more proposals under RQ-INSTR-f8faa0 auditing this
      program's cost model, machine variance and single-machine timing; this entry produces no timing
      and audits no instrument, which is the distinction that keeps it outside that saturated space.
      IDEA-20260805-72bcb5 makes the closest adjacent argument, that a core-year is not a unit for
      the linear-algebra stage, under RQ-RSA-afe33c; its object is a published record on a different
      problem.
    verdict: 'UNVERIFIED. No claim about external literature. Assembled from known parts: dimensional
      analysis of a cost statement is ordinary practice and IDEA-20260805-72bcb5 already applies exactly
      that move to core-years in the RSA lane, which is named here rather than reinvented. Claimed
      new only as a target: applying it to the one sentence the ALR lane repeats four times, whose
      symbol B has never been defined in any committed ALR record, and which every downstream reading
      of the lane depends on.'
  object_first_candidate:
    tracked_object: The substitution map from primitive parameters to the symbol B, tracked separately
      along each of the two cost statements. The object followed through the computation is a pair
      of maps, and the measured quantity is whether they agree.
    lossiness: 'The projection discards all constant factors, all polylog factors, all machine detail
      and the entire content of both algorithms, retaining only an exponent and the definition of
      its base. It is severely lossy: no running time and no correctness property can be recovered,
      and two entirely different algorithms with the same exponent become the same object. The retained
      pair still propagates because substitutions compose: if B is a function of primitive parameters
      and a cost is a function of B, the composite is a function of primitive parameters, deterministically
      and without approximation. That composition is the only thing the audit needs.'
    propagation: One step of the target operation, in this case one reparameterisation of a cost statement,
      acts on the tracked object by composing a new substitution onto the map. Composition is associative
      and exact, so a chain of reparameterisations from a primitive parameter to B and from B to a
      stated exponent yields a single closed-form cost in primitive parameters. The comparison of
      two such chains is well defined exactly when both terminate in the same primitive parameters,
      and that termination check is the measurement.
    survival_score: The map survives as long as each reparameterisation is stated. It dissolves at
      the first step where a record states a cost without stating its base, which in the ALR lane
      is the very first step, and that is the entire finding the audit would produce if the maps cannot
      be reconstructed. The entry therefore reports concretely how many of the five named represented
      routes admit a reconstructible B and how many do not, rather than treating reconstructibility
      as given.
  null_object_control: 'Apply the IDENTICAL dimensional procedure, in the same invocation, to two
    cost statements that are known to be commensurable inside this repository: two of the five represented
    routes that EV-ALR-001 charges at the same B^(7/2). The procedure must return commensurable for
    that pair. If it flags two statements the lane already treats as directly comparable as incommensurable,
    the procedure is broken and no verdict about the 7/2 versus 5/2 pair may be recorded. A second
    null runs the procedure on a deliberately incommensurable pair constructed by the experimenter,
    a cost in bits against a cost in group operations, where the procedure must return incommensurable.
    Both nulls are required, because a procedure that says everything is commensurable and one that
    says nothing is fail in opposite directions.'
  discriminated_from:
  - The blacklisted RQ-INSTR-f8faa0 cost-model and machine-variance audits, which measure this program's
    timing instrument on hardware; this entry runs no timing, touches no machine, and audits two written
    symbols in committed evidence records.
  - IDEA-20260805-72bcb5, which argues a core-year is not a unit for number-field-sieve linear algebra
    and derives byte and sequential-depth quantities from published matrix dimensions; the shared
    move is dimensional analysis of a cost statement, cited here, but its object is a different problem,
    a different stage, and published records rather than internal ones.
  - The size ledger entry in this same batch, which prices two objects in bits and deliberately defers
    the exponent question; the two compose, and the ledger explicitly names this deferral as a derivation
    gap.
  - 'The blacklisted generic Pollard rho variants with no new tracked object: nothing here proposes
    a rho variant, measures rho, or claims anything about rho''s cost; rho appears only as the second
    of two sentences whose units are being checked.'
  - H-ALR-001 and H-ALR-002's own prediction blocks, which state the 7/2 versus 5/2 comparison as
    a prediction with a minimum effect; this entry checks whether that prediction is well posed, which
    is a different question from whether it holds.
  assumptions:
  - The two sentences in EV-ALR-001 and EV-ALR-002 are intended as a single comparison rather than
    as two independent remarks, which the shared metric name represented_route_exponent_B in both
    hypotheses supports.
  - Exponents are stated with respect to a single base symbol B on both sides, rather than one being
    a base-2 exponent and the other a polynomial degree.
  - Primitive parameters are the divisor degrees n and N, the characteristic p, and the group order,
    and no other hidden parameter enters either statement.
  - Polylog and constant factors may be discarded on both sides without changing commensurability,
    which is what an exponent comparison already assumes.
  - The five represented routes are intended to share one B, which stage 2 tests rather than assumes.
  predictions:
  - metric: number_of_five_represented_routes_admitting_a_reconstructible_base_B
    direction: different
    minimum_effect: 'refuse to pre-commit: the records do not define B at all, so any number between
      zero and five is possible and predicting one would be inventing the audit''s result'
  - metric: residual_of_the_single_reconciling_substitution_at_recorded_toy_parameters
    direction: different
    minimum_effect: 0.0
  - metric: null_arm_one_verdict_commensurable_for_two_same_exponent_routes
    direction: different
    minimum_effect: 'forced value: must return commensurable, or the procedure is void'
  - metric: null_arm_two_verdict_incommensurable_for_bits_versus_group_operations
    direction: different
    minimum_effect: 'forced value: must return incommensurable, or the procedure is void'
  minimal_test:
    design: 'Zero compute beyond a short sympy script. The script encodes each cost statement as a
      symbolic expression in declared primitive parameters together with a declared base substitution,
      then checks three things: that the base substitution is derivable from the statement itself
      rather than supplied by the experimenter, that both statements terminate in the same primitive
      parameter set, and that one substitution reduces both to a common parameterisation with a residual
      reported. It then runs the two null arms verbatim through the same three checks. The substantive
      work is reading committed text carefully, which is a few hours of human effort and no machine
      time. It discriminates because the two nulls bracket the procedure from both sides: a procedure
      that passes the same-exponent pair and fails the bits-versus-group-operations pair is doing
      dimensional analysis, and one that does not is doing nothing, and either verdict is visible
      in the same invocation as the signal arm.'
    controls:
    - 'Null arm one: two represented routes that EV-ALR-001 charges at the same exponent, which the
      procedure must return commensurable.'
    - 'Null arm two: a deliberately incommensurable pair, a bit count against a group-operation count,
      which the procedure must return incommensurable.'
    - 'Verbatim-quotation control: the audited sentences are quoted from the committed records, not
      paraphrased, and the quotes are included in the run artifacts.'
    - 'Per-route stability check: the base B is reconstructed independently for each of the five represented
      routes and reported per route rather than assumed shared.'
    - 'Experimenter-blindness on substitutions: any substitution supplied by the experimenter rather
      than derived from the statement is flagged as such in the output.'
    required_metrics:
    - reconstructed_base_definition_per_represented_route
    - reconstructed_base_definition_rho_proxy
    - primitive_parameter_set_agreement_flag
    - reconciling_substitution_residual
    - null_arm_one_verdict
    - null_arm_two_verdict
    - count_of_experimenter_supplied_substitutions
  falsification_conditions:
  - Null arm one returns incommensurable for two routes the lane charges at the same exponent, voiding
    the procedure.
  - Null arm two returns commensurable for the bits-versus-group-operations pair, voiding the procedure
    in the other direction.
  - The base B cannot be reconstructed for any of the five represented routes without an experimenter-supplied
    substitution, in which case the audit reports that the comparison is not checkable from committed
    records and stops.
  - The two sides terminate in disjoint primitive parameter sets, so no substitution can reconcile
    them and the comparison must be restated rather than corrected.
  - The five represented routes are found to require five different bases, so a single symbol B was
    never well defined and the shared exponent is a coincidence of notation.
  confounders:
  - The audited sentences may be shorthand for a fuller derivation held in the imported source artifacts,
    so an apparent incommensurability could be a summarisation artifact; the entry must check the
    committed source references before concluding anything and says so.
  - Experimenter-supplied substitutions silently rescuing the comparison, which the blindness metric
    exposes by counting them.
  - Discarding constants may itself hide a parameter, for example if one side's constant depends on
    p; the audit reports any discarded factor that carries a primitive parameter.
  - The rho proxy may be a placeholder rather than a claim, in which case the comparison was never
    intended as one and the finding is about wording, not about cost.
  - Reading two records written by the same import as independent confirmations of one another, when
    they share provenance.
  interpretation_limits:
  - An incommensurability verdict is a statement about how a comparison is written, not about which
    algorithm is faster, and must never be cited as evidence about either.
  - Nothing here establishes that any exponent is incorrect; the audit checks well-posedness only.
  - The audit is scoped to the sentences committed in EV-ALR-001 and EV-ALR-002 and to the recorded
    toy parameters.
  - No timing, no instrument validity and no machine behaviour is measured, so no conclusion of this
    entry bears on the program's measurement apparatus.
  target_complexity:
    time_exponent: No attack exponent is claimed. The entry examines two exponents already recorded,
      7/2 and 5/2, and reports whether their bases are commensurable; it neither endorses nor disputes
      either value.
    memory_exponent: No memory exponent is claimed. If the audit finds that one side charges memory
      and the other does not, that asymmetry is reported as part of the units table, which is the
      closest the entry comes to a memory statement.
    best_known: The incumbent is the comparison as currently written in EV-ALR-001 and EV-ALR-002,
      namely represented routes at B^(7/2) against a B^(5/2) rho proxy; the entry checks that comparison
      and proposes no replacement cost model.
    hidden_overhead: 'The hidden cost here is entirely human and entirely in citation: an unchecked
      comparison propagates into every downstream record that cites the lane, and the cost of unwinding
      it grows with each citation. The lower-order terms hide any per-step charge that was folded
      into the rho proxy, which is exactly what stage 3 is required to expose rather than absorb.'
  dominated_by: n/a (no result claimed). Every frontier row this lane records was checked, the B^(5/2)
    rho proxy and the five B^(7/2) represented routes, and a units audit places no point on any frontier
    since it produces no algorithm and no cost.
  sota_delta: 'no attack; conceptual/measurement contribution only. The quantitative deliverable is
    the units table: two base definitions in primitive parameters, the residual of the single reconciling
    substitution at the recorded toy parameters, and a per-route count of how many of the five admit
    a reconstructible base.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'That the two nulls bracket correctly and the procedure is shown to be
    doing dimensional analysis: 0.85, since both nulls are constructed and easy to check. That a base
    B can be reconstructed for the rho side from committed records alone: 0.5, because the records
    state the proxy without defining it. That a base B can be reconstructed for all five represented
    routes: 0.35, and this is the most likely place the audit returns its finding. That the two sides
    turn out commensurable under a single substitution: 0.4, deliberately not high, since the two
    sides parameterise different things, divisor degrees on one side and a group order on the other.
    That the audit changes how the lane states its cost verdict: 0.55, higher than the reconciliation
    probability because both outcomes, agreement with a written definition or a restatement, are improvements
    on the current text.'
