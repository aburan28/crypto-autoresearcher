    - >-
      F2 (PROVES-TOO-MUCH). The keyed bridge or the fixture arm deviates from the exact
      law - a nontrivial trial with W != 4-|A|, a hit in the structure-destroyed cell, a
      nontrivial trial in a rho=0 cell, or the fixture arm below its band. The pipeline
