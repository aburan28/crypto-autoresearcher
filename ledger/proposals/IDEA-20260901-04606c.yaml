    recomputes exactly flat with the pre-registered rho table AND the keyed bridge is 100%
    AND the fixture arm lies inside its band -> record the toy-tier conclusion "the pinned
    instrument's affine-limit trial map is the identity (flat census); the skeleton is
    alive at every r <= 10 including r=6 where AES is measured dead; the death round is not
    carried by the linear skeleton and is nonlinearity-driven", citing this record's
    artifacts plus EV-AES-048545, EV-AES-64750e, and EV-AES-d33b1c; the residual question
    (magnitude ~15x, nine-order gap) routes to IDEA-20260901-bcb117 with the carrier e =
    (q0^q1)^(p0^p1) named, and IDEA-20260901-69912d consumes the flat census (with the
    disclosed consequence below). (GATE FAIL) any Gate 0 component fails -> halt, all
    prospective census readings VOID, invalid_measurement, repair dispatched, no mechanism
    conclusion (F1). (CENSUS FAIL) census recomputation disagrees with the pre-registered
    table -> table void, halt, convention/port defect (F3). (PIPELINE FAIL) keyed bridge or
    fixture arm deviates -> instrument indicted (F2), escalate to 02f7c4 battery +
    independent review, no mechanism conclusion. A budget halt is resource_exhaustion,
    never a reading.

  test_boundary: >-
    The census and all arms are statements about the pinned reduced-round AES-shaped SPN
    with SBOX = id (or the committed nonlinear arms cited as inputs), r <= 10, one probe
    family, one machine, toy tier. The frozen cell set C (ten cells) was CLOSED before any
    data in ec54fe and is re-inherited unchanged and re-closed at the filing of this
    record: any cell added after data is seen is post-hoc and VOID, and no cell outside C
    may be measured against an absent prediction. NOTHING transfers to nonlinear S-boxes
    (the residual is a separate object), to substitute cipher families (Feistel, ideal
    table), to other probe geometries, to full-round AES, or to any deployed cipher. The
    death-round comparison is between two toy-tier measurements of the same probe and
    asserts nothing about any published death round in either direction (R3).
    DISCLOSED CONSEQUENCE FOR A DOWNSTREAM CONSUMER: because the identity law holds for ANY
    invertible linear layer (it uses only D E = id and swap invariance, not the AES layer
    specifically), every invertible-layer mutation in IDEA-20260901-69912d's stage 0
    predicts the SAME flat pair-difference law under SBOX = id; layer discrimination under
    this statistic must come from the trivial-rate table rho (which does depend on the
    layer), from the one-sided statistic M^-1 Z_keep M (which this record declines but
    names), or from the nonlinear side. Stated as forward guidance, not a status change.

