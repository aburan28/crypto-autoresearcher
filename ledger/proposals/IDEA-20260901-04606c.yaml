      indicted; escalate to IDEA-20260901-02f7c4's battery and to independent review before
      any further mechanism reading.
    - >-
      F3 (CENSUS INTERNAL). The fresh census recomputation disagrees with the pre-registered
      table (any D_r M_r != I, any rank pattern, any rho). Convention/port defect; table
      void pending repair; recorded as a derivation defect.
    - >-
      F4 (VERDICT FALSIFIER, FORWARD-LOOKING). The MISMATCH-ALIVE verdict rests on the
      committed measurement that AES is dead at r=6 (EV-AES-d33b1c OBS-B2-5, one-sided
      bound 1.72x pooled). Any future committed r=6 excess under the frozen probe would
      contradict the verdict; this record cannot rule it out and does not claim to. The
      verdict also asserts nothing about the residual MAGNITUDE - bcb117's question.
    - >-
      NOT A FALSIFICATION - any budget halt, crash, or implementation failure (rule 5); and
      a deviation confirmed under a nonlinear S-box is residual physics (bcb117), not a
      defect of the affine census.

