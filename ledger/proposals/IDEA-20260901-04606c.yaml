    - id: H1
      statement: >-
        CENSUS-INSTRUMENT ALIGNMENT. The pinned probe binary realizes exactly the identity
        trial map of P1 under SBOX = id, including the trivial-trial exclusion's effect on
        counts.
      rigorous_support: >-
        RIGOROUS PART - the exclusion acts only THROUGH the exactly computed trivial map
        tau: a trial is trivial iff (M_r d)|CW[S] = 0, probability exactly 2^-rho per the
        census; and W = 4-|A| holds on EVERY trial, trivial or not, so the exclusion cannot
