  proof_search_map:
    bottleneck: >-
      Whether the repaired object passes Gate 0 in the executor's fresh code and the census
      recomputes exactly flat. The derivation is settled on paper and in three independent
      code lineages (archived, producer, this agent's throwaway port); the only remaining
      uncertainty is implementation alignment, and it is decidable in seconds.
    baseline_embedding:
      parameter_slice: >-
        The anchor cell (r=5, A={0}, S={0}) under SBOX = id, where the committed
        measurement lives (ranks 32,0,0,0, probability 1 per trial). The repaired object
        must reproduce it exactly; reproducing the known point is the baseline and Gate 0.
      reproduction_check: >-
        GATE 0, BLOCKING, FIRES BEFORE ANY OTHER CENSUS CELL IS READ. Fresh implementation:
        (a) D_5 M_5 = I_128 and M_5 D_5 = I_128 via byte-level basis-vector simulation
        independent of the census matrix-product code (anchor_check.py pattern); (b) ranks
        of A_{5,{0},j} exactly (32,0,0,0); (c) exact P(W>=1 | nontrivial) = 1.0 derived
        from the word maps (word-0 map identity on nonzero inputs, words 1..3 zero maps);
        (d) 1000 keyed trials: q0^q1 = p0^p1 on 1000/1000 and W=3 on 100% of nontrivial
        trials. Any failure halts: invalid_measurement, never negative evidence (rule 5).
        This is exactly the check that voided ec54fe's object.
    observation_collision:
      observable: >-
        The per-cell predicted law (rank pattern, W, P(W>=1), rho).
      distinct_preimage_search: >-
        REQUIRED, and sharpened by the flat law: ALL |A|=1 cells have IDENTICAL W laws
        (W=3, P=1), so agreement on W alone cannot validate the census - the discriminating
        observable is rho, which separates cells with identical W laws (e.g. (A={0},S={0})
        has rho=32 at r=2 while (A={0},S={1}) has rho=0 there), and the rank pattern,
        which separates cells with identical rho (e.g. the three (A={i},S={i}) cells all
        have rho=32 at r=5 but ranks concentrated on different words). The extreme pair is
        the anchor (P=1) vs the structure-destroyed cell (P=0): an instrument that reports
        excess in the latter while confirming the former is not measuring the skeleton.
        The keyed bridge (PR-2) pre-registers both a rho=32 cell and the rho=0 degenerate
        cell for exactly this reason.
    quantifier_order: >-
      CLAIMED IN THIS ORDER FOR P1. FOR ALL round counts r >= 1 under the pinned convention,
      FOR ALL cells (A, S) with S neither empty nor full, FOR ALL keys and seeds: q0^q1 =
      p0^p1 and W = 4-|A|. The universal quantifier over keys/seeds is testable because the
      affine arms cost seconds-to-minutes; the universal quantifier over r beyond 10 is NOT
      tested by measurement here, though the derivation is r-free (disclosed).
    method_ceiling:
      strongest_certifiable_claim: >-
        "The affine limit of the pinned yoyo instrument is exactly the flat census (identity
        trial map + exact trivial-rate table), the skeleton is alive at every r <= 10, and
        the campaign's measured death round (alive@5, dead@6) is therefore not carried by
        the linear skeleton." IT CAN NEVER CERTIFY - the mechanism of the NONLINEAR residual
        (why a bijective nonlinear S-box suppresses probability 1.0 to ~15 x 2^-30 at r=5),
        anything about substitute cipher families that are not SPNs of this geometry,
        anything about full-round or deployed AES, and - newly disclosed - nothing about
        self-consistent convention drift (see confounders: the identity law holds for ANY
        affine cipher whose decryption inverts its encryption, so these arms cannot
        distinguish a consistent-but-unpinned convention; KAT pins and source-diff audit are
        the controls).
      nearby_object_control: >-
        TWO nearby objects on which the hoped-for conclusion (excess) is KNOWN FALSE by
        derivation: (1) the structure-destroyed cell (A={0,1,2,3},S={0}) on the AFFINE
        cipher - maximally structured object, zero predicted hits, checked in the keyed
        bridge; (2) the rho=0 degenerate cells - the instrument is predicted to see ZERO
        nontrivial trials there, so any reported hit is manufactured. Both are run (PR-2);
        the fixture arm at r=6 is the complementary known-TRUE control (alive exactly where
        AES is dead).
    proof_obligations:
      - claim: 'P1 identity law: q0^q1 = p0^p1 for all r, S, keys under SBOX = id.'
        responsibility: correctness
      - claim: 'Anchor reduction: A_{5,{0},j} = P_j (D_5 M_5) P_0^T ranks 32,0,0,0, P = 1.0.'
        responsibility: baseline
      - claim: 'Key- and seed-independence of every affine cell.'
        responsibility: strictness
      - claim: 'The rho table: trivial-map ranks recomputed fresh and equal to the pre-registered values.'
        responsibility: feasibility
      - claim: 'No sentence transfers an affine-limit statement to a nonlinear S-box.'
        responsibility: scope
    not_applicable_reason: null

