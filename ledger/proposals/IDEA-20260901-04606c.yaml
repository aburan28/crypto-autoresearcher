  title: >-
    THE VOIDED CENSUS WAS BUILT ON THE WRONG VECTOR - THE INSTRUMENT'S AFFINE-LIMIT
    PAIR-DIFFERENCE MAP IS THE IDENTITY. Repair of IDEA-20260901-ec54fe on the producer's
    own localization (EV-AES-64750e OBS-B803-1): swap preserves XOR difference and D E = id
    on differences, so the harness trial map in the affine limit is the identity for every
    r, S, key, and the correct census object is the archived anchor object itself,
    P_j (D_r M_r) Pi_A, generalized from the anchor cell to the frozen cell set. Its law is
    exactly computable and FLAT - ranks 32 on the active words, 0 elsewhere, W = 4-|A|
    deterministic, P(W>=1) = 1 for |A|<=3 and 0 for |A|=4 at every r in 1..10 - so the
    affine skeleton is ALIVE at every round count, in particular at r=6 where AES is
    measured dead, and the voided record's dichotomy resolves pre-registered as
    MISMATCH-ALIVE (the death round is nonlinearity-driven). The only genuine per-cell
    structure left in the affine limit is the trivial-swap map rank rho, and it is also
    exactly computable (pre-registered table, rho in {0, 8, 16, 32}). Gate 0 - the exact
    anchor check that caught the voided object - fires before any census cell is read.

  object: >-
    TRACKED OBJECT - THE IDENTITY-MAP CENSUS (producer repair route (i)). Under SBOX = id
    the pinned cipher convention reduces to E(p) = M_r p + k_E, D(c) = M_r^-1 c + k_D with
    M_r, D_r the 128x128 GF(2) linear parts and D_r M_r = M_r D_r = I_128 (the archived
    algebra_rank.py verification generalized; ARK contributes identity to the linear part).
    A probe trial draws p1 from p0 by re-randomizing the active plaintext words PW[A]
    (zero word-diff rejected), encrypts both, swaps the ciphertext bytes of CW[S] between
    c0 and c1, decrypts to q0, q1, and counts W = the number of PW[j] on which q0^q1
    vanishes. Two facts, both validated on keyed trials by the F1 producer and the
    independent validator (EV-AES-64750e OBS-B803-1/OBS-B803-4): (a) a byte swap between
    c0 and c1 leaves their XOR difference unchanged on every coordinate, so c0'^c1' = c0^c1
    for ANY S; (b) with D affine, q0^q1 = M_r^-1 (c0'^c1') = M_r^-1 (c0^c1) = p0^p1. Hence
    the instrument's pair-difference trial map is the IDENTITY for every r, S, key, and the
    census object per cell is the word map A_{r,S,j} = P_j . (D_r M_r) . Pi_A from active-
    word differences to PW[j], where Pi_A embeds PW[A] and P_j projects PW[j]. This is the
    archived anchor object P_j (D.M) P_0^T of BATCH-b41ba9 algebra_rank.py generalized from
    (r=5, A={0}) to arbitrary (r, A); S drops out of the object by swap invariance. Since
    D_r M_r = I_128, A_{r,S,j} = P_j Pi_A: rank 32 for j in A, rank 0 for j not in A; W =
    4-|A| on EVERY trial (trivial or not); P(W>=1 | nontrivial) = 1 for |A|<=3; P(W>=1) = 0
    for |A|=4. The census is FLAT over r by construction. The only per-cell structure the
    affine limit retains is the trivial-swap map tau_{r,A,S} : d|PW[A] -> (M_r d)|CW[S],
    whose rank rho gives the trivial-trial probability 2^-rho; rho depends on the linear
    layer and is computed cell by cell (pre-registered table in predictions PR-1).
    RETAINED PER CELL: one rank pattern (32 x [j in A]), the deterministic W = 4-|A|, the
    exact per-trial law, and rho - exact, key-free, seed-free quantities.
    ROUTE (ii) REJECTED FOR THIS RECORD: the one-sided perturbation q0^p0 = M_r^-1 Z_keep
    M_r d is the other object the producer localized (it holds 1000/1000 on keyed trials),
    but at the anchor it ranks 32,32,32,32 - it does NOT reduce to the archived anchor
    object (32,0,0,0) under the anchor's own statistic, and the pinned instrument does not
    measure it; adopting it would require a new instrument, a new null, and a new anchor.
    It is named here as a future statistic candidate (the linear layer genuinely enters it,
    and it may carry a death round), not as this census's object.
    ESTABLISHED FAMILIES DECLARED AS INPUTS RATHER THAN LENSES: the five substitute
    exclusions (EV-AES-e4c091, EV-AES-dec938 + EV-AES-5478a0, EV-AES-4ba350, EV-AES-048545)
    and the BATCH-b41ba9 affine reproduction are the measurements this record must
    accommodate; IDEA-20260901-ec54fe is the voided predecessor whose frozen cell set,
    decision-rule shape, and F1 gate this record inherits and whose census object it
    replaces.

  lossy_projection_test: >-
    The projection (cipher, key, seed, trial stream) -> (rank pattern of A_{r,S,j}, rho of
    tau_{r,S,A}) discards everything nonlinear and everything key-dependent; under SBOX = id
    nothing of probe relevance is discarded, because the composed trial map on differences
    IS the identity and the only remaining per-cell quantity (the trivial-trial rate) is a
    rank of M_r alone. The fibres are enormous (all keys and seeds of the affine cipher map
    to the same table), so the projection is maximally lossy and is not a change of
    coordinates. COMPATIBILITY WITH THE OPERATION THE RECORD USES IT UNDER: the operation is
    the yoyo trial on differences, and under it the retained part propagates DETERMINISTICALLY
    and exactly (content of claim P1) - the archived anchor measured exactly this
    (ratio 1.0000000000002 at 2^32, EV-AES-048545 O-7) and the F1 producer re-verified it on
    fresh code across 6 cells (EV-AES-64750e OBS-B803-1). The projection is NOT compatible
    with any nonlinear S-box: with nonlinear D the step q0^q1 = M^-1(c0'^c1') fails, and the
    deviation vector e = (q0^q1)^(p0^p1), identically zero in the affine limit, becomes the
    residual's carrier. THE TEST'S SHARP EDGE: the projection is exact in the affine limit
    precisely because the identity law is a theorem of the pinned affine cipher (swap
    invariance + D E = id); if any census-predicted affine check fails to reproduce its
    prediction, the instrument or the port is defective - that is F1/F2/F3, stated rather
    than hidden.

