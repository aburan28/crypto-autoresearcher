        construction. The committed B4 audit (EV-AES-64750e OBS-B803-2) verified the
        exclusion arithmetic in the zero regime at 2^30 (delta 0 = 0, field-exact receipt
        reproduction).
      validation_plan: >-
        Gate 0 (d), the PR-2 keyed bridge (including the rho=0 cell where the exclusion
        eats every trial), and the PR-4 fixture arm. IDEA-20260901-02f7c4 arm B4's
        nonzero-delta path remains untested at 2^30 by construction (disclosed in
        EV-AES-64750e).
      falsification_condition: >-
        Any affine check deviating from its exact prediction (F1/F2/F3).
    - id: H2
      statement: >-
        RESIDUAL-CARRIER COUPLING. For a bijective nonlinear S-box, the residual excess at
        r=5 rides on trials whose deviation vector e = (q0^q1)^(p0^p1) is small - the
        nonlinear trial map shadows the identity law on the trials that hit.
      rigorous_support: >-
        RIGOROUS PART - e is identically zero in the affine limit (P1), so e is a
        well-defined interpolation parameter between the affine law (e = 0 always) and the
        nonlinear instrument. What is heuristic is that the r=5 residual (~15x) concentrates
        on small-e trials; nothing committed yet measures e's distribution under a
        nonlinear S-box.
      validation_plan: >-
        Not validated in THIS record - the census is affine-only by design. The plan lives
        in IDEA-20260901-bcb117 (weight distribution of e across its nonlinearity ramp,
        against the affine prediction e = 0).
      falsification_condition: >-
        Owned by IDEA-20260901-bcb117: an isotropic-large-e residual would refute the
        coupling and leave the flat census intact as an account of the affine limit only.

