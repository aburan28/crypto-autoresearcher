  claim: >-
    Four statements. P1 is a derivation, P2 is a pre-registered zero-compute computation
    whose answer is stated in advance, P3 is the death-round consequence the computation
    decides, P4 is the measurement that binds the derivation to the instrument at scale.

    (P1) IDENTITY LAW (DERIVATION). Under SBOX = id, in any cell (r, A, S), for any key:
    the swap leaves c0^c1 unchanged (coordinate-wise, any S), and D affine gives q0^q1 =
    M_r^-1 (c0'^c1') = M_r^-1 (c0^c1) = M_r^-1 M_r (p0^p1) = p0^p1. Hence the word map
    A_{r,S,j} = P_j (D_r M_r) Pi_A equals P_j Pi_A, with rank 32 for j in A and 0 for j not
    in A; W = 4-|A| on every trial; P(W>=1 | nontrivial) = 1 for |A|<=3 and P(W>=1) = 0 for
    |A|=4; the law is independent of r, S, key, seed. The key and seed do not appear. This
    is a one-paragraph linear-algebra derivation under docs/claims-and-verification.md, not
    a theorem of record; its committed instances are the archived anchor cell (EV-AES-048545
    O-7) and the F1 producer's 6-cell keyed verification (EV-AES-64750e OBS-B803-1).
    ANCHOR REDUCTION (DERIVED, NOT ASSERTED): at the anchor cell (r=5, A={0}, S={0}),
    A_{5,{0},j} = P_j (D_5 M_5) P_0^T, symbol-for-symbol the archived algebra_rank.py
    object. With D_5 M_5 = I_128 (archived-verified, fresh-code re-verified by producer and
    validator), A_j = P_j P_0^T: the 32-bit identity for j=0, the zero map for j=1,2,3.
    Ranks 32,0,0,0. The per-trial law follows: the word-0 input is conditioned nonzero by
    the rejection rule, the word-0 map is the identity so its output never vanishes, and
    words 1..3 vanish identically: W = 3 and P(W>=1) = 1.0 exactly on every nontrivial
    trial - the archived anchor reading (EV-AES-048545 O-7: ranks 32,0,0,0, E[W>=1] = 1.0,
    measured ratio 1.0000000000002). The reduction is an equality of expressions, not a
    numerical coincidence: the repaired object IS the archived object at the anchor.

    (P2) THE CENSUS (ANSWER STATED IN ADVANCE). Compute with zero cipher evaluations
    (sparse 128x128 GF(2) products under the pinned convention) over the frozen set C
    inherited UNCHANGED from ec54fe - (A={0},S={0}), (A={0},S={1}), (A={0},S={2}),
    (A={0},S={3}), (A={i},S={i}) for i=1,2,3, (A={0,1},S={0}), (A={0},S={0,1}),
    (A={0,1,2,3},S={0}) - ten cells, at every r in 1..10 (100 cell-instances; ec54fe's
    prose said eight, its set lists ten; this record counts the set). The pre-registered
    answer, stated now and recomputed fresh by the executor: for every cell-instance the
    rank pattern is 32 x [j in A], W = 4-|A| deterministic, P(W>=1 | nontrivial) = 1 for
    |A|<=3 and P(W>=1) = 0 for |A|=4, and rho equals the PR-1 table (values in {0,8,16,32},
    including the degenerate cells (A={0}, S in {1,2,3}) at r in {2,10} with rho = 0 where
    EVERY trial is trivial and the instrument sees zero nontrivial trials). The table, its
    code, and its digest are committed BEFORE the fixture arm runs (committed digest, not
    file mtime - V-804-2 discipline). The census additionally re-verifies D_r M_r = I_128
    in both directions for every r in 1..10 as a per-r port guard.

    (P3) THE DEATH-ROUND CONSEQUENCE (PRE-REGISTERED READING). The affine death round
    r*_aff (ec54fe's definition: first r >= 2 where the census-predicted per-trial
    P(W>=1) for (A={0},S={0}) falls to or below the analytic null 2^-30) DOES NOT EXIST
    within r <= 10: the identity law predicts P = 1 at every r. AES's death round is
    measured by this campaign: alive at r=5, dead at r=6 (EV-AES-d33b1c OBS-B2-5;
    one-sided bound 1.72x pooled on any r=6 excess). Pre-registered reading, total:
      (MISMATCH-ALIVE, the derived branch) r*_aff undefined / skeleton alive at all r <= 10
      while AES is dead at r=6. Then the round-count LOCATION of the excess (the death
      round) is NOT carried by the linear skeleton; it is driven by the interaction of
      nonlinearity with the geometry, and the residual question relocates to what the
      S-box does to the identity law - measured by the deviation vector e = (q0^q1)^(p0^p1),
      identically zero in the affine limit (IDEA-20260901-bcb117's ramp is the follow-on
      instrument, now with a named carrier).
      (DEFEAT BRANCHES, for totality) Any gate, census, keyed-check, or fixture-arm
      deviation is a defect verdict (F1/F2/F3), never a mechanism reading: the identity law
      is a theorem of the pinned affine cipher and cannot be refuted by these arms; only
      the instrument-to-derivation alignment can fail. A future committed r=6 excess under
      the frozen probe would contradict the verdict (F4).

    (P4) VERIFICATION ARMS. (i) GATE 0 (BLOCKING, BEFORE ANY OTHER CENSUS CELL IS READ):
    fresh-code anchor reproduction - ranks 32,0,0,0 of the repaired object at (r=5,A={0},
    S={0}), D_5 M_5 = I_128 both directions, exact P(W>=1 | nontrivial) = 1.0 derived from
    the word maps, and 1000 fresh keyed trials with q0^q1 = p0^p1 on 1000/1000 and W = 3 on
    100% of nontrivial trials. Any failure halts the task; this is exactly the check that
    caught the voided object (which returned 32,32,32,32 and P = 2^-32 here). (ii) KEYED
    BRIDGE (seconds, pre-registered cells): five frozen cells - (r=5,A={0},S={1}),
    (r=6,A={0},S={0}), (r=2,A={0},S={0}), (r=5,A={0,1,2,3},S={0}), and the degenerate cell
    (r=2,A={0},S={1}) - at 500 fresh keyed trials each: q0^q1 = p0^p1 and W = 4-|A| on 100%
    of trials; the degenerate cell must additionally show 500/500 trivial swaps (the rho=0
    prediction). (iii) FIXTURE ARM (ONE ARM, 2^30, AFTER GATE 0 AND CENSUS COMMIT): the
    affine cipher in cell (r=6, A={0}, S={0}) - the census-predicted-ALIVE cell at AES's
    measured death round - under a fresh implementation: known-answer prediction W = 3 on
    100% of nontrivial trials, hit count 2^30 - T with T the realized trivial count
    (E[T] = 2^30 x 2^-32 = 0.25, rho = 32), excess ratio 1.0 against frozen excess_E = 2^30.
    A mismatch is F2 (pipeline indicted), never negative evidence against the skeleton.
    (iv) STRUCTURE-DESTROYED ACCOMMODATION: the census predicts P(W>=1) = 0 exactly for
    (A={0,1,2,3},S={0}) at every r; the committed AES amask=15 readings (1.00x BATCH-002 A4;
    4 at N=2^32, EV-AES-048545 O-4 R3-A5) are ~null there - consistent; a census that
    predicted excess there would be misaligned with the instrument's mask semantics (this
    check is inherited from ec54fe F4 and now passes by construction, checked in PR-2).

    (WHAT IS NOT CLAIMED) No statement about AES with any nonlinear S-box beyond citing the
    committed measurements; no statement about full-round or deployed AES at any scale; no
    comparison to published cryptanalysis in either direction (RQ-AES-003 R3); no claim that
    the skeleton EXPLAINS the r=5 residual magnitude (~15x, nine orders below the affine
    law - that gap is bcb117's); nothing about the Feistel substitute families except that
    the census does not apply to them (not SPNs of this geometry).

  mechanism: >-
    The excess needs AES's round geometry operating on AES-like round content (standing
    campaign conclusion), BATCH-b41ba9 showed the excess is maximal and deterministic with
    the identity S-box (EV-AES-048545 O-7), and the F1 localization then showed WHY the
    voided census could not see it: the probe's swap is a no-op on pair differences and
    decryption inverts encryption on differences, so the instrument's affine-limit trial
    map is the identity - the skeleton is not a delicate r-specific composition, it is the
    trivial law q0^q1 = p0^p1 holding at EVERY r and S. The mechanism candidate this record
    resolves is therefore sharpened: the linear skeleton of the probe is the identity law,
    it is alive at every round count by construction, and it CANNOT carry the death round;
    the measured fact that AES is alive at r=5 and dead at r=6 must be driven by what
    nonlinearity does to the identity law - the deviation e = (q0^q1)^(p0^p1), zero in the
    affine limit, is the residual's carrier, and its suppression from P = 1.0 to ~1.4e-8 at
    r=5 and to the null at r=6 is the dose-response the ramp (IDEA-20260901-bcb117)
    measures. This record's deliverable is the pre-registered repaired census, the
    verification chain (gate, fresh-code census, keyed bridge, one 2^30 fixture arm at the
    death-round cell), and the MISMATCH-ALIVE verdict recorded under its own decision rule -
    the verdict the voided record's dichotomy was built to decide, now derivable in
    advance and confirmed rather than discovered.

