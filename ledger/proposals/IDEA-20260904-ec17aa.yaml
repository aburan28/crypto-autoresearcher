  assumptions:
    - >-
      The re-randomising walk of Algorithm 3 mixes in O(log p) steps, so the
      curve reached is indistinguishable from uniform and r(D) applies to it.
      This is the frozen source's own assumption (following [37], [6, Lemma 14]).
    - >-
      r(D) = Theta(D^{3/2} p^{-1/2}) uniformly for 1 <= D <= p^{1/3}. Taken from
      IDEA-20260829-056e9d and consistent with Theorem 1.5; it is restated as
      heuristic H1 below rather than assumed silently.
    - >-
      Detection cost is a pure power D^{alpha} with no additive setup term. This
      is the single crudest step in (A) and it is exactly what P1 tests: a
      genuine setup term D^{gamma} independent of the number of curves probed
      would change the optimisation and is disclosed as confounder C1.
    - >-
      d < p/4 and p does not divide d throughout, matching Theorem 1.5's range.

  proof_search_map:
    bottleneck: >-
      The per-curve cost of deciding "delta_{E'} <= D" and producing the witness.
      Its exponent alpha is the ONLY quantity in the two-phase shape that any of
      the four algorithms differ in; removing the D^{1} floor on it is what would
      change the theorem.
