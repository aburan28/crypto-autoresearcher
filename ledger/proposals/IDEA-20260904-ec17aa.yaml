        check that p^{1/2} D^{-3/2} D^{alpha} evaluated at (alpha, D) = (1,
        p^{1/3}) and (2, 1) returns p^{1/3} and p^{1/2}, together with the
        substitution B = e^{(1/3) sqrt(log(p/2))}, u = sqrt(log(p/2)) from the
        proof of Theorem 1.1. If either slice fails, (A) is wrong and the record
        is superseded before any paper is read.
    observation_collision:
      observable: >-
        The single real number alpha, read off an algorithm's published total
        exponent by inverting total = p^{alpha/3}.
      distinct_preimage_search: >-
        COLLISIONS ARE GUARANTEED AND ARE THE HAZARD OF THE WHOLE RECORD. Two
        algorithms with the same alpha are indistinguishable in this projection
        even when they differ in memory, conditionality and parallelism. One
        collision is already known and is instructive: the naive full listing
        (alpha = 2, memory poly, unconditional) and Delfs-Galbraith (alpha = 2 in
        the D = 1 corner, memory poly, unconditional) both land on p^{1/2} by
        different routes. The DANGEROUS collision is between an algorithm whose
        total exponent equals p^{alpha/3} because it has the two-phase shape and
        one whose exponent coincides for an unrelated reason -- and Udovenko's
        row is exactly that risk. The separating condition, which P1 tests, is
        that the paper's own cost decomposition must exhibit the factor
        p^{1/2} D^{-3/2}. If it does not, the row is a numerical coincidence and
        must be struck from the table.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move "detect delta <= D over the smooth degrees only" into the
          multipoint-evaluation model, where the hypothesis is an exact
          evaluation of a fixed bivariate family at a fixed point set. Encoding:
          the degree set becomes S(D,B) instead of {1..D}. Completeness: exact,
          since the split lemma only ever uses smooth degrees. Soundness: exact.
          Transfer: the cost exponent a on the degree-count factor. Cost loss:
          the rho^{-1} smoothness retry, charged in full.
        predicted_gain: >-
          Total exponent multiplied by rho^{a-1}: a strict gain iff a > 1, a
          strict loss iff a < 1, exactly neutral at a = 1. Since rho^{-1} is
          superpolynomial (p^{o(1)} but much larger than any polylog), the
          concrete effect at NIST sizes is large in EITHER direction, which is
          why the sign of a - 1 is worth a paper read on its own.
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family from "one smooth conjugate isogeny of
          degree <= D" to "any conjugate isogeny of degree <= D detected by an
          aggregated evaluation", and ask for a STRICT inward improvement over
          the alpha = 1 boundary rather than mere feasibility. The boundary is
          Wesolowski's table; the lift is admissible only if it returns a witness
          without materialising Theta(D) objects.
        predicted_gain: >-
          None asserted. The record's own prediction is that every member of the
          enlarged family still materialises Theta(D) objects, which is barrier
          (E), and the deliverable is that barrier stated with the family named.
    quantifier_order: >-
      THE CLAIMED IDENTITY: FOR ALL p, FOR ALL alpha in (0, 3/2), IF there EXISTS
      a detector family {Det_D} with per-curve cost D^{alpha+o(1)} valid for all
      supersingular E/F_{p^2}, THEN OneEnd is solvable in p^{alpha/3+o(1)}. The
      detector is allowed to depend on p and D but NOT on the instance E -- a
      detector allowed to depend on E is trivial (take the answer) and is
      excluded by the order. THE OPEN TARGET: THERE EXISTS alpha < 1 and a
      detector family in that quantifier order. NOT CLAIMED IN EITHER DIRECTION.
      Note the asymmetry that makes the record honest: the forward implication is
      a derivation this session can write; the existence statement is not.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: the two-phase identity (A) as a derivation with its two exact
        baseline slices; a four-row table one of whose rows is a falsifiable
        prediction about an unread paper; the sign of a - 1 once that paper is
        read; and a closure of the composition route at the inventor-protocol
        section 4 standard if a <= 1. The method can NEVER certify that no
        alpha < 1 detector exists -- that is an algebraic-complexity lower bound
        and is outside anything proposed here -- and it certifies nothing about
        memory, since alpha is blind to it.
      nearby_object_control: >-
        THE OBJECT WHERE THE DESIRED CONCLUSION IS KNOWN FALSE: the unrelated
        fixed target j_0 in place of j^p. There r'(D) = Theta(D^2/p), so no
        conjugate-style isogeny of degree far below p^{1/2} exists at all, the
        two-phase optimisation has no interior optimum, and the correct total is
        p^{1/2} for every detector. Any version of the argument that produces an
        interior optimum or an exponent below 1/2 for the unrelated target proves
        too much and is wrong somewhere. This is the identical null 22428d used
        and reusing it deliberately keeps the two records comparable.
    proof_obligations:
      - claim: >-
