idea:
  id: IDEA-20260904-ec17aa
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  handoff_id: TASK-20260904-9a7471
  added: '2026-09-04'

  title: >-
    THE "THIRD AGGREGATION STRUCTURE" THAT IDEA-20260901-22428d DECLARED MISSING
    AND UNEXHIBITED EXISTS IN THE LITERATURE AND WAS VERIFIED THIS SESSION:
    Udovenko's bivariate multipoint evaluation (eprint 2026/1575, p^{2/5+o(1)}
    UNCONDITIONAL) instantiates the alpha lever at a value this record predicts
    is alpha = 6/5 -- so the standing closure of that lane is refuted in its own
    escape clause, the four known algorithms line up on one axis (alpha = 2
    Delfs-Galbraith, 6/5 Udovenko unconditional, 1 Wesolowski heuristic, < 1
    open), and the one constructive route left is a SMOOTHNESS-RESTRICTED
    multipoint detector whose exponent this record derives and prices

  class: composition

  claim: >-
    STATED FIRST, SO NOTHING IS OVERSOLD. No attack is mounted here, no exponent
    below 1/3 is claimed to exist, and the alpha value assigned to Udovenko's
    algorithm is an INFERENCE from its published exponent under a cost model
    stated below -- not a report of what that paper says. The paper itself was
    NOT read (the eprint fetch was blocked; see citations).

    (A) THE AXIS. Every published algorithm for OneEnd / EndRing / Isogeny since
    Kohel has the same two-phase shape: (i) re-randomise to a curve E' by a short
    walk, (ii) decide-and-solve at E' by looking for an isogeny E' -> E'^{(p)} of
    degree at most D. Write r(D) for the expected number of such isogenies. The
    corpus already carries r(D) = Theta(D^{3/2} p^{-1/2}) as the ternary-form
    count (IDEA-20260829-056e9d, read this session), so a curve with a
    degree-<= D conjugate isogeny is hit after p^{1/2} D^{-3/2} attempts, and
    r(D) = 1 at D = Theta(p^{1/3}), which is Theorem 1.5 of the frozen source.
    Let the per-curve cost of the decide-and-solve step at radius D be D^{alpha}.
    Then

        total cost = p^{1/2} D^{-3/2} * D^{alpha},

    which is DECREASING in D when alpha < 3/2 -- so D is pushed to p^{1/3},
    where the walk factor is 1 -- and INCREASING when alpha > 3/2, so D collapses
    to 1. This yields, with no new mathematics,

        alpha < 3/2  =>  total = p^{alpha/3},
        alpha > 3/2  =>  total = p^{1/2}  (Delfs-Galbraith, D = 1).

    The identity total = p^{alpha/3} is NOT new here: IDEA-20260821-e99afd
    carries it (relayed through IDEA-20260901-22428d, which this session read in
    full; e99afd itself was NOT opened). What is new is what goes in the table.

    (B) THE TABLE, WITH ONE ROW THIS PROGRAM DID NOT HAVE.
      * alpha = 2, UNCONDITIONAL. Listing every cyclic isogeny of degree <= D out
        of E' costs sum_{d<=D} psi(d) = Theta(D^2) just to write the candidates.
        alpha = 2 > 3/2, so D collapses to 1 and the total is p^{1/2}: this row
        IS Delfs-Galbraith, and the alpha frame reproduces it exactly.
      * alpha = 1, HEURISTIC. Wesolowski's Algorithm 2 replaces the D^2 listing
        by a meet-in-the-middle over the B-smooth ball, whose table has size
        Psi(X,B) X^{1+o(1)} = D^{1+o(1)} with X = (BD)^{1/2}. alpha = 1 gives
        p^{1/3}, and the price is that it only works when the degree is B-smooth,
        which is the ONLY thing Heuristic 1 buys.
      * alpha = 6/5, UNCONDITIONAL -- THE NEW ROW. Udovenko, eprint 2026/1575,
        "Solving the supersingular isogeny problem in time p^{2/5+o(1)} using
        bivariate multipoint evaluation" (03 August 2026), verified this session
        at abstract level only: time AND memory p^{2/5+o(1)}, UNCONDITIONAL, same
        Galois-conjugate strategy, built on multivariate multipoint evaluation
        (Kedlaya-Umans 2008/2011; Bhargava-Ghosh-Guo-Kumar-Umans 2022;
        Ghosh-Harsha-Herdade-Kumar-Saptharishi 2023). Under (A), p^{2/5} =
        p^{alpha/3} forces alpha = 6/5. THIS IS A PREDICTION ABOUT THE PAPER'S
        INTERNALS AND IT IS FALSIFIABLE BY READING IT.

    (C) WHY THIS REFUTES A STANDING CLOSURE IN THIS PROGRAM.
    IDEA-20260901-22428d closes the algebraic detection lane at the
    inventor-protocol section 4 standard with the named obstruction
    "aggregation": it identifies exactly two aggregation structures on the family
    {Phi_d(x, x^p)} -- the multiplicative prefix-sharing the incumbent already
    spends (alpha = 1) and the Galois structure x^p - x that exists only at d = 1
    -- and its REDIRECTION says that alpha < 1 "needs a THIRD structure ... None
    is exhibited and none is claimed." A third structure DOES exist and is
    published: fast multipoint evaluation is an aggregation across evaluation
    points and degrees that is neither multiplicative-prefix nor Galois. It does
    not reach alpha < 1, so 22428d's numeric target survives -- but its
    completeness argument does not, and the correct standing status of that lane
    is OPEN WITH A THIRD FAMILY IN IT, not closed with an unexhibited escape.
    Recording that is the cheapest deliverable in this record.

    (D) THE CONSTRUCTIVE PROPOSAL, WHICH IS WHERE AN EXPONENT COULD MOVE.
    Wesolowski's alpha = 1 and Udovenko's alpha = 6/5 attack the same detection
    problem with orthogonal savings: Wesolowski restricts the DEGREE SET (only
    Psi(D,B) = D*rho smooth degrees survive) and pays rho^{-1} retries;
    Udovenko keeps ALL D degrees and pays nothing in retries but pays an
    algebraic-complexity overhead. THEY HAVE NEVER BEEN COMPOSED. The proposal is
    the smoothness-restricted multipoint detector: run the multipoint evaluation
    only over the B-smooth d <= D. If the multipoint cost decomposes as
    (number of degrees)^{a} * (number of points)^{b} * D^{c} with a > 0, then
    replacing D by D*rho in the first factor multiplies the per-curve cost by
    rho^{a} and the total by rho^{a - 1} (the rho^{-1} being the smoothness
    retry). The composition WINS iff a > 1, is neutral at a = 1, and LOSES for
    a < 1. So the whole proposal reduces to reading one exponent out of one
    paper, and both outcomes are informative:
      a > 1  -> a strictly better unconditional-plus-heuristic hybrid exists and
                its exponent is (6/5 - something)/3; route to review.
      a <= 1 -> the composition is dead, and the record closes it with the
                measured a, which is a reusable number.

    (E) THE BARRIER, STATED AS A PROPERTY OF THE KNOWN FAMILY AND NOT AS A
    THEOREM. Every constructive detector on the table materialises an object of
    size Theta(D): Wesolowski's smooth table, Udovenko's evaluation set,
    the naive listing's D^2 candidates. alpha < 1 therefore requires a detector
    that never materialises one object per degree. This is NOT an information
    bound -- the output phi is only O(log p) bits -- so it does not exclude a
    DECISION-ONLY detector. Converting a decision oracle into the isogeny is a
    separate problem and is the subject of the sibling record
    IDEA-20260904-9b58ab, which gates this lane and should run first.

    (F) NOT CLAIMED. No claim that alpha < 1 exists. No claim about deployed
    parameters. No claim that Udovenko's algorithm has the two-phase shape (A)
    assumes -- that is prediction P1 and it may fail, in which case the alpha
    frame does not cover his row and the table has three entries, not four.

  mechanism: >-
    TRACKED OBJECT: the per-curve detection cost exponent alpha of the predicate
    "delta_{E'} <= D", carried as a single real number attached to each published
    algorithm, together with the conditionality tag (unconditional / smoothness-
    heuristic) that says what the number was bought with.

    LOSSY-PROJECTION TEST (algebraic, zero compute). alpha is a projection of an
    entire algorithm onto one real number. It is genuinely lossy: it discards the
    algorithm's memory profile, its constants, its parallelism, its correctness
    argument, and the identity of the object it materialises. What it retains
    propagates deterministically under the operation this analysis applies --
    composition of the detection phase with the outer walk -- because the outer
    walk multiplies costs and the counting law r(D) = Theta(D^{3/2} p^{-1/2}) is
    a property of the lattice, not of the detector. Two algorithms with the same
    alpha and the same conditionality have the same total exponent, and that
    collapse is exactly the point: it is what lets a paper this session could not
    open be placed on the axis from its headline exponent alone. It is NOT a
    change of coordinates, because alpha does not determine the algorithm --
    Delfs-Galbraith and the naive full listing are different algorithms with the
    same alpha = 2 row, and a memory-free detector and a memory-heavy one at the
    same alpha are indistinguishable in this projection. That last loss is
    disclosed in target_complexity and is the projection's known blind spot.

    STAGE 0, ZERO COMPUTE. Write (A) as a derivation, check the two endpoints
    symbolically (alpha = 2 must return p^{1/2} at D = 1; alpha = 1 must return
    p^{1/3} at D = p^{1/3}), and check that the frozen source's own parameters
    X = B^{1/2}(p/2)^{1/6}, Psi(X,B) X^{1+o(1)} instantiate alpha = 1 exactly.

    STAGE 1, THE READ. Obtain eprint 2026/1575 and answer four questions with
    citations: does the algorithm have the two-phase shape of (A)? what is its
    per-curve detection cost as a function of D? does p^{2/5} arise as
    p^{1/2} D^{-3/2} D^{6/5} at D = p^{1/3}, or from a different balance? and
    what is the multipoint cost decomposition (a, b, c) of (D)?

    STAGE 2, THE COMPOSITION. With (a, b, c) in hand, instantiate the
    smoothness-restricted variant symbolically and report the resulting total
    exponent as an exact function of a. No compute.

    STAGE 3, THE CONTROL. Apply the identical machinery to a fixed unrelated
    supersingular target j_0 in place of j^p (22428d's Stage-3 null): there the
    conclusion is KNOWN FALSE, because r'(D) = Theta(D^2/p) for an unrelated
    target, so no isogeny of degree << p^{1/2} exists and the detector must
    return nothing at every D tested. A machinery that reports a hit there is
    measuring itself.

