        responsibility: baseline
      - claim: alpha = 2, D = 1 reproduces p^{1/2} at polynomial memory.
        responsibility: baseline
      - claim: r(D) = Theta(D^{3/2} p^{-1/2}) uniformly on 1 <= D <= p^{1/3}.
