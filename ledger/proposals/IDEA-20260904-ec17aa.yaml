      056e9d is also the record that first brought eprint 2026/1575 into the
      corpus, at abstract level, without connecting it to 22428d.
    - >-
      IDEA-20260901-1f5a62. Replaces the smooth split by a DIVISOR split, keeping
      alpha = 1 and attacking the smoothness condition itself. EXACT DELTA:
      1f5a62 changes what the detector accepts; this record changes what the
      detector costs. Both target Heuristic 1's price and they are complementary,
