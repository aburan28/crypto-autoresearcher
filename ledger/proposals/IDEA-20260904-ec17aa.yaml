  minimal_test:
    design: >-
      THE CHEAPEST DECISIVE DISCRIMINATOR IS A PAPER READ PLUS FIVE LINES OF
      ALGEBRA, AND IT COSTS NO COMPUTE. Stage 0 (hours, zero compute): write (A),
      freeze the two-slice symbolic fixture, and record P3. Stage 1 (hours, zero
      compute): obtain eprint 2026/1575 by any route the environment allows --
      arXiv mirror, an author copy, a library proxy, or a human -- and answer P1
      and P2 with page and line citations. Stage 2 (hours, zero compute):
      instantiate the smoothness-restricted composition symbolically as a
      function of a and report the exponent with the rho^{-1} retry charged
      explicitly. Stage 3 (hours, small compute): run 22428d's Stage-1 and
      Stage-3 root-finding at the four committed toy primes for d <= 7 to record
      P4, reusing that record's fixtures so the two are directly comparable. NO
      ATTACK IS IMPLEMENTED AND NO SEARCH IS RUN AT ANY CRYPTOGRAPHIC SIZE.
    controls:
      - >-
        UNRELATED-TARGET NULL (blocking). j_0 fixed and unrelated in place of
        j^p, at the same primes and the same d. The conclusion is known false
        there; a machinery that still produces an interior optimum or a hit is
        proving too much and every downstream number is void.
      - >-
        TWO-SLICE BASELINE FIXTURE (blocking). (alpha, D) = (1, p^{1/3}) and
        (2, 1) must reproduce p^{1/3} and p^{1/2} symbolically before Stage 1.
      - >-
        NEGATIVE PAPER-READ ARM. If Stage 1 shows the two-phase shape is absent
        from eprint 2026/1575, Stage 2 must still run and report the composition
        exponent conditionally, with the fourth table row struck. The record must
        not be quietly rewritten to fit the paper.
      - >-
        RELAY CONTROL. The alpha/3 identity is credited to IDEA-20260821-e99afd
        on a relay through IDEA-20260901-22428d. Before any priority statement is
        made, e99afd must be opened and the identity confirmed to be its own; if
        it is not, this record's attribution is wrong and must be corrected by a
        superseding record.
    required_metrics:
      - >-
        P1 as a yes/no with citations to the exact section and equation of eprint
        2026/1575
      - >-
        P2 as a rational number a with the source of each factor named
      - the symbolic reproduction residual at both baseline slices (must be 0)
      - >-
        the composition exponent as an explicit function of a, with the rho^{-1}
        retry shown as a separate factor
      - unrelated-target hit counts per (p, d), with the automorphism-weight convention fixed in advance

  falsification_conditions:
    - >-
      F1. The two-slice symbolic fixture fails. Identity (A) is wrong; the record
      is superseded immediately and nothing downstream is quotable.
    - >-
      F2. eprint 2026/1575 does not have the two-phase shape. The alpha = 6/5 row
      is struck, claim (B) drops to three rows, and the refutation of 22428d's
      completeness argument SURVIVES anyway -- multipoint evaluation is still a
      third aggregation structure whether or not it fits this axis. The record
      distinguishes these two consequences on purpose.
    - >-
      F3. a <= 1. The smoothness-restricted composition is dead. The record then
      closes that route at the section 4 standard with the named obstruction
      "the degree-count factor in multipoint evaluation is sublinear, so
      restricting the degree set cannot pay for the smoothness retry", the
      measured a as the obstruction quantity, and forward guidance naming the
      decision-only detector route (IDEA-20260904-9b58ab) as what remains.
    - >-
      F4. a > 1 AND the composition exponent falls below 1/3. This is a claimed
      improvement to a central hard problem and under AGENTS.md rule 12 it goes
      to independent review-breakthrough at max effort BEFORE it is written
      anywhere outside this ledger. No parameter recommendation may be issued
      from this record under any circumstances.
    - >-
      F5. The unrelated-target null produces hits at D far below p^{1/2}. The
      instrument is not seeing the Frobenius structure and Stage 3 is a
      controlled null, not a finding.
    - >-
      F6. eprint 2026/1575 cannot be obtained at all. That is an INFRASTRUCTURE
      outcome under AGENTS.md rule 5 and rule 3 of the runtime binding -- it is
      never evidence that the paper does not say what P1 predicts, and the record
      stays at status proposed with P1 unresolved.

  confounders:
    - >-
      C1, THE BIG ONE. An additive setup term. If detection costs
      D^{alpha} + D^{gamma} where the second term is paid ONCE rather than per
      curve, the optimisation in (A) changes shape and total = p^{alpha/3} is
      wrong. This is precisely how a multipoint-evaluation algorithm would most
      naturally be structured -- build a data structure once, query it many
      times -- so C1 is not a remote possibility, it is the expected reading, and
      P1 is written to catch it.
    - >-
      C2. alpha is blind to memory. Udovenko's row costs p^{2/5} MEMORY as well
      as time; Delfs-Galbraith's costs polynomial memory. Two rows with the same
      alpha can sit on opposite ends of the memory axis, so no memory conclusion
      may be drawn from the table, and dominated_by below is computed on all
      three axes separately for exactly this reason.
    - >-
      C3. Conditionality is a tag, not a number. Comparing alpha = 1 (heuristic)
      with alpha = 6/5 (unconditional) as if they were the same currency is a
      category error; the table carries the tag on every row and the composition
      in (D) inherits BOTH conditionalities, which makes it strictly more
      assumption-laden than either parent.
    - >-
      C4. r(D) is asserted for a UNIFORMLY RANDOM curve. The outer walk is what
      makes that legitimate, and its mixing bound is cited but not re-derived
      here. A curve reached by a short or structured walk is not covered.
    - >-
      C5. The alpha assignment inverts a published headline exponent. Headline
      exponents absorb o(1) terms differently between papers; an author who
      states p^{2/5+o(1)} where a competitor states p^{1/3+o(1)} may be hiding
      different amounts. Nothing in this record distinguishes o(1) budgets.

  interpretation_limits:
    - >-
      NO ATTACK IS PROPOSED, NO EXPONENT BELOW 1/3 IS CLAIMED TO EXIST, AND NO
      DEPLOYED PARAMETER SET IS COMMENTED ON. The conditional exponent
      p^{alpha/3} with alpha < 1 is uninhabited.
    - >-
      The alpha = 6/5 row is an inference from a headline exponent in an abstract
      this session read at second hand through an IACR news item. It is a
      prediction about a paper, not a report of one, and it must be quoted with
      that qualification or not at all.
    - >-
      This record does not touch, cite, or depend on the frozen EXP-WESOVOW-001
      charging-law defect, the fitted_opt / PAPER_PAIRS anchor reconciliation,
      the P = 512 crossover, or the w = 2^80 sign, all of which are under an
      explicit prohibition in TASK-20260904-9a7471. The only concrete numbers
      used anywhere are the frozen source's own section 4.1 figures, and they are
      used for nothing except illustration.
    - >-
      SURVIVOR SCOPE. The problem attacked publishes NO torsion images. Nothing
      here uses, assumes, or needs torsion-point images under a secret isogeny,
      so the SIDH/SIKE break plays no role and no Kani-style ingredient is
      invoked.
    - Academic and defensive cryptanalysis only, per RQ-SSI-001's constraints.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a uniformly random supersingular E/F_{p^2}, the number of isogenies
        E -> E^{(p)} of degree at most D, counted up to sign and post-composition
        by an isomorphism, is r(D) = c D^{3/2} p^{-1/2} (1 + o(1)) uniformly for
        1 <= D <= (p/2)^{1/3}, with an absolute constant c. Equivalently: the
        degree form on Hom(E, E^{(p)}) behaves as a positive definite TERNARY
        form of determinant Theta(p) rather than as the quaternary form its
        ambient rank would suggest.
      rigorous_support: >-
        RIGOROUS SIDE. The trace-vanishing rule (IDEA-20260805-e7ee4a as relayed
        by IDEA-20260901-22428d) forces alpha = Frob o phi to have reduced trace
        0 and reduced norm p*d whenever d < p/4, so the relevant vectors lie in a
        RANK-3 trace-zero sublattice, not in the rank-4 ambient; and
        sum_{d<=D} H(4pd) = Theta(p^{1/2} D^{3/2}) is a rigorous Deuring-Eichler
        class-number first moment (attributed to IDEA-20260821-e99afd, relayed).
        CLASSICAL DISTRIBUTION STATEMENT IMITATED. The Gauss circle / Gaussian
        heuristic for a positive definite ternary form of determinant Det:
        #{x : Q(x) <= T} = (4 pi/3) T^{3/2} Det^{-1/2} (1 + o(1)). H1 asks only
        that the specific form deg on the trace-zero part of the two-sided ideal
        P behave like a random ternary form of its determinant.
        CONSISTENCY ANCHOR. r(D) = 1 at D = Theta(p^{1/3}) is exactly Theorem
        1.5's bound (p/2)^{1/3}, which a quaternary reading (r(D) = Theta(D^2/p),
        smallest degree Theta(p^{1/2})) would contradict.
      validation_plan: >-
        WHAT TO SAMPLE. The multiset of reduced norms in the two-sided ideal P of
        reduced norm p inside a random maximal order of B_{p,infinity}, divided
        by p, i.e. exactly the degree multiset of Hom(E, E^{(p)}).
        SHORTCUT THAT REACHES CRYPTOGRAPHIC SCALE. The Deuring correspondence, as
        used in section 4.2 of the frozen source: sample maximal orders uniformly
        up to conjugation, form P, and enumerate ALL lattice vectors of norm at
        most p*D rather than only the shortest one. This is the same sampler the
        frozen source already validated Heuristic 1 with, so the instrument is
        not new.
        SCALE AND PARAMETERS TO RECORD. p = 5*2^248 - 1 (SQIsign NIST-I) with at
        least 10,000 orders and D up to 32 * p^{1/3}; p = 27*2^500 - 1 (NIST-V)
        with at least 1,000 orders; plus the four toy primes 2437, 3889, 5737,
        7333 where the committed graphs give exact ground truth. Record p, the
        order-sampling method, the enumeration radius, and the treatment of
        j = 0 and j = 1728 automorphism weights.
        COMPARISON DISTRIBUTION. Empirical r(D) against c D^{3/2} p^{-1/2} on a
        log-log plot; fit the exponent in D at fixed p and in p at fixed
        D/p^{1/3}. Predicted 3/2 and -1/2.
        TAIL CHECKS. (i) The smallest observed degree across the sample against
        the predicted median of the first minimum; (ii) the largest D at which
        r(D) = 0 on the toy primes against (p/2)^{1/3}; (iii) the count at
        D = p^{1/3} against 1, which is the anchor Theorem 1.5 forces.
        TRANSFER ASSUMPTION, STATED. The quaternion-side sample is a sample of
        MAXIMAL ORDERS, and its transfer to curves rests on the Deuring
        correspondence being a bijection up to conjugation and on uniform
        sampling of orders being uniform sampling of curves up to the
        automorphism weights. That assumption is the frozen source's and is
        inherited, not established, here.
    - id: H2
      statement: >-
        The multipoint-evaluation cost of the detection step factors as
        (number of degrees)^{a} (number of evaluation points)^{b} D^{c} up to
        p^{o(1)}, with a, b, c >= 0 constants independent of p and D in the range
        1 <= D <= p^{1/3}.
      rigorous_support: >-
        NONE ESTABLISHED HERE, AND THIS IS THE WEAKEST ITEM IN THE RECORD. It is
        isolated as its own heuristic so a reviewer can reject it without
        touching H1 or identity (A). The only support is the general shape of
        multipoint-evaluation complexity bounds, which are near-linear in
        (input size + number of points) -- a form consistent with such a
        factorisation but not implying it. Kedlaya-Umans and its successors were
        NOT opened.
      validation_plan: >-
        WHAT TO SAMPLE. Nothing statistical: this is validated by READING, which
        is why it is cheap. Extract from eprint 2026/1575 and its cited
        multipoint-evaluation sources the explicit cost bound, and check whether
        it admits the factorisation with constant a, b, c or whether the
        dependence is genuinely non-power (for instance, an epsilon-dependent
        exponent, a term that is near-linear only above a threshold, or a
        d-dependent field-size condition).
        FALLBACK IF THE READ IS BLOCKED. Implement the smallest honest surrogate:
        multipoint evaluation of Phi_d(x, x^p) at Q points for d <= 7 at the four
        toy primes, using whatever library routine the environment has, and FIT
        a, b, c from measured operation counts. This surrogate measures an
        implementation, not the theoretical algorithm, and must be reported as
        such: it can falsify a power-law shape but cannot confirm the asymptotic
        exponents.
        TAIL CHECK. Whatever a is measured, it must reproduce the alpha = 6/5
        row when the degree set is the full {1..D}; a fitted a that does not is
        evidence the factorisation is wrong rather than evidence about a.

  target_complexity:
    time_exponent: >-
      AS FILED: none claimed; the record proposes no algorithm and its own
      predicted outcome is a closure. CONDITIONAL AND CURRENTLY UNINHABITED:
      p^{alpha/3+o(1)} for a detector of per-curve cost D^{alpha}, which is
      p^{1/3+o(1)} at alpha = 1 (the incumbent), p^{2/5+o(1)} at alpha = 6/5
      (the predicted Udovenko row), and below 1/3 only for alpha < 1. The
      composition of (D), if a > 1, gives
      p^{(6/5)/3 + o(1)} * rho^{a-1} = p^{2/5+o(1)} * rho^{a-1}; note this is a
      gain over p^{2/5} but NOT automatically over p^{1/3}, and the record does
      not claim it is.
    memory_exponent: >-
      NOT IMPROVED AND NOT ADDRESSED. alpha is blind to memory (confounder C2).
      For reference on the frontier this record compares against: the incumbent
      is p^{1/3+o(1)} memory; Udovenko's row is p^{2/5+o(1)} memory;
      Delfs-Galbraith is polynomial memory. A smoothness-restricted multipoint
      detector would plausibly retain the p^{2/5}-scale memory of its parent, and
      nothing here reduces it. Any memory claim from this record is unsupported.
    best_known: >-
      p^{1/3+o(1)} time and memory conditional on Heuristic 1 (frozen source,
      Theorem 1.1); p^{2/5+o(1)} time and memory unconditional (eprint 2026/1575,
      abstract level); p^{1/2}(log p)^{O(1)} time at negligible memory
      unconditional (Delfs-Galbraith); vOW interpolation p^{1/2+o(1)}/w^{1/2}
      with memory w, and p^{1/2+o(1)}/(w^{1/2} n) with n processors (frozen
      source section 1.1). Quantum: eprint 2026/1821 (abstract level) reports
      that Grover removes the memory requirement with little time improvement
      while Tani's algorithm gives a stronger gate-memory tradeoff at substantial
      coherent quantum memory cost.
    hidden_overhead: >-
      DISCLOSED IN FULL. The incumbent's o(1) hides a SUPERPOLYNOMIAL factor
      rho^{-1} = u^{u(1+o(1))} with u = sqrt(log(p/2)), which the frozen source
      itself calls much larger than the previous (log p)^{O(1)} cofactor. The
      composition in (D) MULTIPLIES this by rho^{a}, so it inherits the entire
      superpolynomial overhead and modifies it rather than removing it. Udovenko's
      row carries its own o(1), described by its author as highly theoretical,
      and this session cannot size it. The alpha frame absorbs all of these into
      o(1) and therefore CANNOT be used to compare concrete costs -- only
      exponents.
    tradeoff_note: >-
      The incumbent sits at the full-memory end of the van Oorschot-Wiener curve
      time sqrt(N^3/w) = p^{1/2+o(1)}/w^{1/2} with N = p^{1/3+o(1)}, and
      parallelises perfectly (frozen source section 1.1). Nothing in this record
      moves that curve; a lower alpha would move the whole curve's left endpoint
      down but the record establishes no such alpha. Parallelisation of a
      multipoint-evaluation detector is not analysed here and must not be assumed
      to be perfect.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY, AND DATA/QUERIES; NOT SET TO NULL.
    As filed this record claims no algorithm, so EVERY row of the frontier
    dominates it, and the comparison is recorded for the conditional object of
    claim (D) rather than for the record.
    (i) Wesolowski p^{1/3+o(1)} time, p^{1/3+o(1)} memory, no data/queries,
    heuristic. DOMINATES the composition of (D) on TIME whenever the composition
    lands above p^{1/3}, which is the expected case, and dominates it on MEMORY
    outright since p^{1/3} < p^{2/5}. It does NOT dominate on assumptions --
    the composition would inherit BOTH Heuristic 1 and the unconditional
    machinery, so it is strictly more assumption-laden, which is worse still.
    (ii) Udovenko p^{2/5+o(1)} time and memory, unconditional. NOT dominated by
    (i) on the assumption axis, which is why both stay on the frontier. It
    DOMINATES the composition of (D) whenever a <= 1, i.e. in the record's own
    predicted case.
    (iii) Delfs-Galbraith p^{1/2}(log p)^{O(1)} time, POLYNOMIAL memory,
    unconditional. DOMINATES every row above on the memory axis by a full
    exponent, and dominates all of them at any realistic memory budget --
    eprint 2026/1821's abstract-level finding that neither the optimised
    full-list attack nor its vOW variants outperform the previous low-memory
    algorithm over practical memory ranges is exactly this row asserting itself.
    (iv) van Oorschot-Wiener interpolation, time p^{1/2+o(1)}/w^{1/2} at memory
    w. Dominates the p^{1/3} point for every w below p^{1/3} and is the correct
    comparison at any bounded memory.
    (v) Quantum rows (eprint 2026/1821, abstract level): Grover with negligible
    memory, and Tani with a stronger gate-memory tradeoff at large coherent
    quantum memory. These dominate on the time axis in their own cost model and
    are NOT comparable classically; they are listed rather than ignored, and this
    record makes no quantum claim.
    (vi) Data/queries axis: every row above uses zero data and zero oracle
    queries, so no row is dominated there and the axis is not discriminating for
    this problem. Stated explicitly so the null is not mistaken for an omission.
  sota_delta: >-
    ON TIME: +0. ON MEMORY: +0. ON DATA/QUERIES: +0. No algorithm is proposed and
    no exponent is claimed to be beaten.
    QUANTIFIED DELIVERABLES INSTEAD, each a number or a binary:
    (1) A four-row alpha table, of which one row (alpha = 6/5) is a falsifiable
    prediction about a specific unread paper and two rows are exact
    reproductions of published results.
    (2) The exact threshold alpha < 1 for beating p^{1/3} and alpha <= 3/4 for
    reaching p^{1/4}, restated in a form that now has a THIRD occupied family on
    the axis rather than two.
    (3) The sign of a - 1, which decides the composition, obtainable from one
    paper read at zero compute.
    (4) The status correction to IDEA-20260901-22428d's closure: its escape
    clause is filled, so its lane's honest status is open-with-a-third-family
    rather than closed. Under docs/inventor-protocol.md section 4 that is a
    first-class deliverable and it is the one this session is most confident of.
    (5) If a <= 1, a closure with the measured a as the obstruction quantity.

