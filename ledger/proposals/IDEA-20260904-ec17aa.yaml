  object_first_candidate:
    established_families_off_limits: >-
      Declared off-limits as the PRIMARY lens for this record: the smooth ball
      and its parameter variants (the incumbent, IDEA-20260901-1f5a62's divisor
      split, IDEA-20260829-056e9d's radius enlargement); van Oorschot-Wiener and
      distinguished points; quantum claw finding (Grover and Tani), which eprint
      2026/1821 already covers and which this session screened OUT for that
      reason; the quaternion-side relation architecture (IDEA-20260805-c60813);
      SQIsign transcript statistics, which occupy roughly forty records already.
    tracked_object: >-
      alpha, the per-curve detection cost exponent, tagged with conditionality.
    lossiness: >-
      Severe and deliberate: discards memory, constants, parallelism, and the
      identity of the materialised object. See mechanism for why what remains
      still propagates.
    propagation: >-
      One-step propagation is defined and measurable: composing the detector with
      one outer walk step multiplies the cost by 1 and multiplies the success
      probability by r(D)/r(D) = 1 -- i.e. alpha is invariant under the outer
      loop, which is what makes total = p^{alpha/3} a closed form rather than a
      recursion. The propagation is broken exactly when the detector has an
      additive setup term, which is confounder C1.
    newness_score: >-
      The axis is NOT new (e99afd, relayed). The fourth row, the identification
      of the published third aggregation structure, and the composition are new
      in this corpus as far as this session can determine without retrieval.
    testability_score: >-
      High and unusually cheap: Stage 0 and Stage 2 are zero compute, Stage 1 is
      one paper read, Stage 3 is a small root-finding job at toy primes that
      IDEA-20260901-22428d already specifies.
    survival_score: >-
      The axis survives as long as the two-phase shape does. It dissolves the
      moment an algorithm does not re-randomise -- e.g. any algorithm exploiting
      a special starting curve -- and that boundary is stated in
      interpretation_limits.

