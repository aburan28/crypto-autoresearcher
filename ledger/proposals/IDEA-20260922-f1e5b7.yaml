idea:
  id: IDEA-20260922-f1e5b7
  question_id: RQ-DREG-d7b6d6
  added: '2026-09-22'
  status: proposed
  proposed_by: idea-generator
  title: >-
    Slope census of last-fall degree and grevlex solving degree for the
    chained t=4 Weil-descent system on one toy F_4-isogeny class
  class: measurement
  claim: >-
    Representation class R3 of RQ-ECDLP-623a32 (Weil restriction to F_2 of
    the affine x-coordinates and chained auxiliary variables), attack stage
    relation-decomposition Gröbner degree. On frozen ladder LADDER-W (ordinary
    E/F_4, F_4-rational Vélu edges of degree in {2, 3}, chained summation
    length t=4, subspace factor-base dimension k=1, extension rungs n=1 and
    n=2, grevlex), every certified F_4-isomorphism class in the F_4-isogeny
    class of the base has the same increment, from n=1 to n=2, of certified
    last-fall degree and of grevlex solving degree as the base, whenever both
    rungs finished. The equality prediction is range 0. A finished pair whose
    increment differs by at least 1 falsifies equality for that named
    quantity. First-fall degree is a control, not the growth metric. No ECDLP
    exponent is claimed.
  mechanism: >-
    PAIR AND OPERATION SET. The representation is the boolean coordinate
    vector of the Weil restriction of the chained S_3 system at t=4 (R3).
    Sigma is the set of F_4-rational Vélu isogenies of degree 2 or 3, acting
    on short-Weierstrass models. Sigma is not the translation action of the
    group of rational points. TRICHOTOMY: coordinate-dependent
    (IDEA-20260806-c5d183 Class III). The degree profile is a function of the
    model coefficients inside the ideal, not of a group element, so it is not
    a propagating function on the prime-order subgroup. F2 of IDEA-20260802-002
    (Semaev / Gaudry / Diem / descent) is the component system being measured.
    What is added beyond F2 is the within-class comparison of growth
    increments of two named degrees along an extension ladder that is not the
    m=3 prime-field screen. LOSSY PROJECTION. The tracked object is the pair
    (certified last-fall degree, grevlex solving degree) at each rung, together
    with the full-column Macaulay rank vector r(d) for d <= 4 when that matrix
    finishes. The pair discards the generators, the grevlex leading-term ideal
    below its maximum degree, and the rational points. Distinct ideals can
    share a pair. The discard is not claimed to be a block system of
    translation (IDEA-20260901-863e36). It is compatible with Sigma only in
    the weak sense that Sigma acts on models and the pair is recomputed on
    each model. F_4-isomorphic models are one vertex. A projection that kept
    the whole ideal would be a change of coordinates. This projection keeps
    only the named degrees. WHY THESE DEGREES. KN-TECH-004 and KN-TECH-011
    separate first-fall degree, solving degree, and the Bardet-Faugère-Salvy
    degree of regularity. IDEA-20260807-f6137c closure 1 forbids a single
    "true degree of regularity" meter off the semi-regular locus. KN-TECH-b18366
    records that the chained boolean system has proved first-fall degree 4
    while the degree of regularity stays the contested, possibly growing,
    quantity. Kousidis-Wiemers (ePrint 2015/1121, introduction read here)
    produce the first fall from the highest-degree homogeneous part. The
    in-tree leading-form note (harness/rl_isogeny/leading_forms.py) states the
    same split for a prime-field grid presentation: curve coefficients sit
    below the top degree, so the first fall is predicted curve-independent,
    and a within-class effect needs a quantity the leading forms do not pin.
    Last-fall degree (Caminata-Gorla, as recorded in KN-LIT-4e8513) and
    grevlex solving degree are those quantities. They are not identified with
    each other. KN-LIT-7605 reports, at abstract level, that last-fall degree
    of certain Weil-descent systems is bounded independently of the extension
    degree. A flat last-fall increment is consistent with that report. It is
    not a new boundedness theorem, and it does not decide the grevlex solving
    degree (KN-LIT-4e8513 records sd_sigma = max(last-fall, maximum reduced
    Gröbner-basis degree) for a degree-compatible order). GROWING-REGIME GATE.
    Equality of increments is a statement about slower growth only when the
    base curve's certified last-fall degree or grevlex solving degree strictly
    increases from n=1 to n=2, or is strictly greater than its first-fall
    degree at n=2. Otherwise the outcome is "LADDER-W did not enter the
    growing regime" and is not evidence about an outlier. DEC-20260716-003
    and EV-ISO-001 already closed neighbor-versus-control separation for
    prime-field m=3 solving degree. This census does not rerun that system.
    tools/isogeny_dreg_search.py measures first-fall degree of a prime-field
    {S_3, x^h-1} system. That functional is not the growth metric here.
  novelty_status: unverified
  citations:
    - ref: RQ-DREG-d7b6d6
      provenance: internal
      claim: >-
        The question this measurement serves, including the ban on another
        m=3 prime-field neighbor census and the requirement that unfinished
        Gröbner runs are unmeasured cells.
      verified_by: idea-generator
    - ref: DEC-20260716-003
      provenance: internal
      claim: >-
        H-ISO-001 is rejected_scoped. Neighbor solving-degree variation at
        the tested m=3 scope matched coefficient controls.
      verified_by: idea-generator
    - ref: EV-ISO-001
      provenance: internal
      claim: >-
        Toy p about 2^13, m=3, l in {2, 3, 5}. No neighbor d_reg below 2.
        d_reg 3 occurs in both an isogenous neighbor and the controls.
      verified_by: idea-generator
    - ref: KN-TECH-004
      provenance: internal
      claim: >-
        First-fall degree and solving degree are different program metrics.
        Whether first-fall tracks the degree of regularity is open over
        prime fields.
      verified_by: idea-generator
    - ref: KN-TECH-011
      provenance: internal
      claim: >-
        Semaev systems are structured and may not be semi-regular, so a
        measured solving degree may deviate from a Hilbert-series prediction.
      verified_by: idea-generator
    - ref: KN-TECH-b18366
      provenance: internal
      claim: >-
        The chained S_3 boolean system has proved first-fall degree 4. The
        degree of regularity is the contested quantity and can exceed 4.
      verified_by: idea-generator
    - ref: KN-LIT-4e8513
      provenance: internal
      claim: >-
        Corpus note of Caminata-Gorla, ePrint 2021/1611. Records Def 1.5 and
        Thm 2.8 (last-fall degree is the largest degree at which a degree
        fall occurs), Thm 3.1 (grevlex solving degree equals the max of
        last-fall degree and the maximum reduced Gröbner-basis degree for a
        degree-compatible order), and the warning that first-fall degree may
        sit arbitrarily far from either. The PDF was not opened in this
        session. The note says a prior agent read the PDF on 2026-09-16.
      verified_by: idea-generator
    - ref: KN-LIT-7605
      provenance: internal
      claim: >-
        Corpus note reporting that a Weil-descent last-fall degree is bounded
        independently of the extension degree for summation-polynomial systems
