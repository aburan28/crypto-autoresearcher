      verified_by: idea-generator
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        R3 includes Weil restriction. Kummer-line and degree-d-function-on-E
        representations are outside this proposal.
      verified_by: idea-generator
    - ref: KN-OPEN-020
      provenance: internal
      claim: >-
        Bounded-degree algebraic factor bases over a generic prime-field
        subgroup are a scoped negative. This proposal reuses the subspace
