      verified_by: idea-generator
    - ref: "eprint:2024/924"
      provenance: recalled
      claim: >-
        Galbraith, ordinary isogeny navigation. Recalled, not read. The
        internal note inputs/refs/research/ISO_GOAL_isogenous_weak_curve.md
        quotes a bridge cost of soft-O(q^{1/4}). No attack is claimed here, so
        that cost is not charged. A later attack claim would have to add it.
      verified_by: null
  assumptions:
    - >-
      Identifier assigned by handoff TASK-20260922-d7b6d6. This file is a
      proposal only.
    - >-
      OFF-LIMITS COMPONENT. F2 is the summation system being measured. F1 and
      F3 are not the lens. Rho is not run. The m=3 prime-field neighbor screen
      is not rerun. A true degree-of-regularity meter is not built.
    - >-
      Only F_4-rational isogenies are edges. A geometric kernel that does not
      map rational points is labeled geometric_not_transferred and is excluded
      from the range.
    - >-
      Group order, trace, and extension point counts are class invariants
      (Tate). They are recorded as checks. A vertex whose order differs from
      the base is an invalid edge, not a degree outlier.
    - >-
      The subspace factor base of dimension k=1 is the existing shape from
      KN-TECH-b18366 at a toy parameter. It is not a new factor base.
    - >-
      Certified last-fall degree and grevlex solving degree are read only from
      a finished grevlex Gröbner basis, using the identities recorded in
      KN-LIT-4e8513. A timeout, an out-of-memory abort, or a matrix that does
      not finish is an unmeasured cell.
  proof_search_map:
    bottleneck: >-
      Whether the integer increments of certified last-fall degree and of
      grevlex solving degree, from n=1 to n=2, can differ between F_4-isogenous
      models once first-fall degree is allowed to stay flat.
    baseline_embedding:
      parameter_slice: >-
        EV-ISO-001 / DEC-20260716-003. Prime-field m=3 neighbor solving degree
        does not separate isogenous curves from coefficient controls. That
        slice is the old boundary this ladder must not be confused with.
      reproduction_check: >-
        Before any t=4 cell is interpreted, the same rank-profile code on a
        frozen prime-field m=3 system of the EV-ISO-001 shape must reproduce
        the recorded pattern. No neighbor sits below degree 2, and a degree-3
        cell, if it appears, also appears in a coefficient control. A new
        m=3 separation is an instrument failure, not a finding.
    observation_collision:
      observable: >-
        The pair of increments (last-fall increment, grevlex solving-degree
        increment), plus the rank vector r(d) for d <= 4 at each finished
        rung. The pair discards the ideal.
      distinct_preimage_search: >-
        Log j-invariant, walk length, and a hash of the generator coefficient
        vector beside every pair. The support-matched null of the base system
        is a required second preimage. If it shares the base increment, the
        increment does not identify the isogeny class.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Two rungs, n=1 and n=2, packed as integer increments of two named
          degrees, rather than a single-degree census at m=3.
        predicted_gain: >-
          Converts "does the degree explode" into a comparison of two
          integers. No ECDLP-exponent gain is claimed. A gap of size g >= 1
          changes only the binomial width of one Macaulay matrix.
    quantifier_order: >-
      FOR ALL certified vertices E' in the enumerated F_4-isogeny class, and
      FOR ALL named quantities D in {last-fall degree, grevlex solving
      degree}, IF both rungs finished, THEN the increment of D at E' equals
      the increment of D at the base. The quantifiers range over the finished
      cells of LADDER-W only. There is no existence claim at cryptographic
      size.
    method_ceiling:
      strongest_certifiable_claim: >-
        On LADDER-W, either every finished vertex matches the base increments,
        or at least one finished vertex differs by at least 1 in a named
        quantity. Toy scope only. Neither outcome is an ECDLP algorithm.
      nearby_object_control: >-
        The m=3 prime-field system of the baseline slice, on which a
        "strictly slower neighbor" conclusion is already false in the recorded
        evidence. The census code must not report one there.
    proof_obligations:
      - claim: >-
          The m=3 baseline slice is reproduced before t=4 cells are read.
        responsibility: baseline
      - claim: >-
          Last-fall degree and grevlex solving degree are computed only from
          a finished grevlex basis, and are not equated to each other or to
          a degree of regularity.
        responsibility: correctness
      - claim: >-
          A difference of at least 1 is the margin. A difference of 0 is
          equality. Unfinished cells are neither.
        responsibility: strictness
      - claim: >-
          The statement covers only LADDER-W's finished cells.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: >-
        Within-class range of the n=1 to n=2 increment of certified last-fall
        degree, over finished vertices
      direction: lower
      minimum_effect: >-
        Range 0. Range at least 1 falsifies equality for last-fall degree.
    - metric: >-
        Within-class range of the n=1 to n=2 increment of grevlex solving
        degree, over finished vertices
      direction: lower
      minimum_effect: >-
        Range 0. Range at least 1 falsifies equality for grevlex solving
        degree even if last-fall degree matches.
    - metric: >-
        Within-class range of certified first-fall degree at each rung
      direction: lower
      minimum_effect: >-
        Range 0. This is the leading-form control. A range of at least 1
        means this presentation escaped the curve-independent leading-form
        prediction, which is a separate outcome and is not by itself a
        slower-growth result.
  minimal_test:
    design: >-
      Freeze LADDER-W. Field F_4 = F_2[z]/(z^2+z+1). Draw an ordinary
      short-Weierstrass curve Y^2+XY = X^3+aX^2+b over F_4 from a frozen
      seed, singular and supersingular draws rejected. Enumerate F_4-rational
      2-isogenies and 3-isogenies by Vélu. Certify each edge by the image of
      a sampled rational point, the homomorphism check on a frozen sample,
      and equality of the trace. Compare the weighted vertex count to the
      Hurwitz class number of the Frobenius discriminant, as
      tools/isogeny_dreg_search.py does, and set certified true or false
      accordingly. An uncertified walk is a coverage fraction, not a class.
      On every certified vertex, and on four ordinary curves over F_4 from
      the same seed, each a distinct isomorphism class with a trace different
      from the base, one model per class, build the chained
      t=4 system, Weil-restrict from F_{4^n} to F_2 for n=1 and n=2, with
      subspace factor base dimension k=1. Also build one support-matched
      non-elliptic system at the base by rerandomizing coefficients on the
      same monomial support. Row-reduce the full-column Macaulay matrix in
      degree at most 4 over F_2. Run grevlex. Subset-column coranks are not
      read. Degenerate cells (unit ideal in degree 1, or a factor base with
      fewer than 2 points) are excluded and reported.
    controls:
      - >-
        Four ordinary curves over F_4, one model per isomorphism class, each
        with a trace different from the base. They cannot match the order.
        Tate makes same order the same class. Do not repeat a class. This is
        the arm B sample shared with IDEA-20260922-881df9.
      - >-
        One support-matched non-elliptic system on the base monomial support.
      - >-
        Trace and #E(F_{4^n}) recorded on every vertex. A mismatch voids the
        edge.
      - >-
        First-fall degree recorded beside last-fall degree and grevlex
        solving degree, and not substituted for them.
      - >-
        m=3 prime-field reproduction slice, run first, as in
        baseline_embedding.
    required_metrics:
      - >-
        For each finished vertex and each rung, first-fall witness from the
        Macaulay row-span, certified last-fall degree, grevlex solving degree,
        and r(d) for d <= 4.
      - >-
        Increments from n=1 to n=2, and the within-class range of each
        increment. Unfinished cells listed as unmeasured, not as large degrees.
      - >-
        Base increment, so the growing-regime gate is a number.
      - >-
        Leading-form agreement bit across vertices (heuristic H2).
  falsification_conditions:
    - >-
      Some finished vertex has last-fall increment or grevlex solving-degree
      increment at least 1 away from the base. Equality is false on LADDER-W
      for that quantity. This does not yet say the gap is an isogeny effect.
      That attribution is IDEA-20260922-881df9.
    - >-
      Every finished vertex matches the base, and the base itself left the
      floor (increment at least 1, or the degree at n=2 strictly above
      first-fall degree). Equality holds on this ladder. The scoped negative
      is this system shape, this field, these degrees, and this walk.
    - >-
      The base never leaves the floor. The ladder is not in the growing
      regime. Equality is not evidence about slower growth, and it is not
      evidence that a degree exploded.
    - >-
      The m=3 reproduction slice reports a neighbor separation the recorded
      EV-ISO-001 pattern does not have. The run is an instrument failure.
    - >-
      A timeout or an incomplete matrix is an unmeasured cell. It neither
      falsifies equality nor supports a gap.
  confounders:
    - >-
      An incomplete walk (certified false) can hide the only outlier. Report
      the coverage fraction and do not call the range a class range.
    - >-
      Grevlex solving degree depends on the frozen variable order. A gap that
      disappears under one other degree-compatible order, while the Macaulay
      rank vector agrees, is an order artifact. IDEA-20260922-9d808c is the
      test that separates these.
    - >-
      D_max = 4 censors falls above 4. A basis that does not finish leaves
      the named degree unmeasured. Do not impute it from the last finished
      matrix degree.
    - >-
      k=1 is a tiny factor base. A unit ideal or a linear system is
      degeneracy, not a low solving degree.
    - >-
      Non-isogenous controls change the trace. A gap that appears only across
      traces is not a within-class gap.
    - >-
      j in {0} and the characteristic-2 analogues with extra endomorphisms
      are labeled if they occur. They are not silent members of a generic
      class.
  interpretation_limits:
    - >-
      Toy scale only. No cryptographic curve. No transfer of a slope from
      LADDER-W to a larger extension without a separately named heuristic.
      This proposal states none.
    - >-
      No ECDLP exponent is claimed. Pollard rho remains about p^{1/2} group
      operations. A degree gap of size g is not an exponent improvement.
      Galbraith ePrint 2024/924 is recalled and unread. The walk is not
      charged because no attack is claimed. A later attack claim that ignores
      the walk is out of scope.
    - >-
      No new factor base. The k=1 subspace base sits inside the shape already
      used by the chained system. It does not claim a KN-OPEN-020 escape.
      KN-OPEN-020's open classes (high-degree, implicit, target-dependent)
      are not entered.
    - >-
      First-fall degree, last-fall degree, and grevlex solving degree are
      reported separately. None is called the degree of regularity.
    - >-
      Subset-column coranks are not evidence.
    - >-
      A flat last-fall increment does not confirm KN-LIT-7605. That note's
      PDF was not read, and a two-rung toy equality is not an all-n bound.
    - >-
      What this adds beyond RQ-DREG-001. That question varies n on a boolean
      chained system and does not vary the curve inside an isogeny class.
      What this adds beyond RQ-VOLC-f6253b. Nothing about volcano depth.
      Depth is IDEA-20260922-881df9's stratum, not this census.
    - >-
      IDEA-20260812-68e87f already proposes an end-to-end rho census. Rho is
      not measured here.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The claim is a finite comparison of integer degrees on the finished
        cells of LADDER-W. It does not extrapolate to a larger extension, a
        larger class, or a cryptographic curve. No distributional model of
        the increments is assumed. The classical distribution imitated is
        none.
      rigorous_support: >-
        Last-fall degree and grevlex solving degree, when a grevlex basis has
        finished, are integers defined by the identities recorded in
        KN-LIT-4e8513. No tail bound is used.
      validation_plan: >-
        The minimal test itself. Report finished and unmeasured cells
        separately. Do not fill an unmeasured cell by a fitted slope.
    - id: H2
      statement: >-
        On this boolean chained presentation, the highest-degree homogeneous
        parts of the generators agree across the isogeny class, so certified
        first-fall degree is predicted constant on the class. This imitates no
        distribution. It is an identity prediction. The growth claim about
        last-fall degree and grevlex solving degree does not depend on H2.
      rigorous_support: >-
        Kousidis-Wiemers (introduction, ePrint 2015/1121, read here) derive a
        first fall from the top homogeneous part of a Weil descent of one
        summation polynomial. The in-tree leading-form note states the
        curve-independence consequence for a different, prime-field, grid
        presentation. Neither source is a proof for the t=4 boolean chain.
      validation_plan: >-
        Compute the top homogeneous part of each generator on every certified
        vertex and on the four different-trace controls. If any two class
        members differ, H2 is false on LADDER-W and the first-fall control is
        released. Sample size is the vertex set of this one class, not a
        cryptographic-scale sample. No Deuring-correspondence shortcut is
        claimed.
  target_complexity:
    time_exponent: >-
      Measurement cost only. Per cell, one full-column Macaulay rank at
      degree at most 4 on at most about 12 boolean variables, plus a grevlex
      basis if it finishes. That is polynomial in the binomial coefficient
      C(N+4, 4) with N <= 12, times a handful of vertices. Not a p-power
      attack exponent.
    memory_exponent: >-
      One dense or sparse Macaulay matrix with C(N+4, 4) columns, N <= 12.
      No p^{1/2} table.
    best_known: >-
      Pollard rho, about p^{1/2} group operations on the group order. The
      algebraic baseline at prime-field m=3 is the per-PDP exponent recorded
      in FINDING-PF-IC-001, whose confidence interval lies above 1/2. This
      proposal does not improve either.
    hidden_overhead: >-
      Grevlex basis time can exceed the degree-4 matrix if the solver climbs
      past D_max. That climb is an unmeasured cell, not a hidden o(1) saving.
    tradeoff_note: >-
      No ECDLP exponent is claimed. There is no van Oorschot-Wiener tradeoff
      because this is not a collision search. Parallelism is across vertices
      and is irrelevant to an exponent.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  dominated_by: "n/a (no result claimed)"
  sota_delta: >-
    No change to the Pollard rho exponent p^{1/2}. The m=3 prime-field
    neighbor screen (DEC-20260716-003) already shows solving degree does not
    separate neighbors at that floor. The largest delta this measurement can
    report is an integer gap of size at least 1 in last-fall degree or
    grevlex solving degree on LADDER-W. A gap of size 1 changes the Macaulay
    column count by the ratio of two binomial coefficients in a fixed number
    of variables, a polynomial factor in that matrix, not an ECDLP exponent.
    Frontier checked against rho, against DEC-20260716-003, against
    FINDING-PF-IC-001, and against the semi-regular null as a comparison
    object rather than as a claimed attack. None of those is an attack this
    idea claims to beat.
