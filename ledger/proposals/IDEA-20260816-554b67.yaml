idea:
  id: IDEA-20260816-554b67
  question_id: RQ-MCE-e65b3c
  added: '2026-08-16'
  title: 'Execute rather than tabulate: run Prange and Stern on the toy Goppa fixture and on matched
    random codes with planted errors at n = 16..64, count iterations, peak list memory and collisions
    per iteration, and report the measured ratio between the two arms, because structure-blindness
    of generic decoding has never been measured here.'
  class: measurement
  claim: '(A) Every ISD-related record in this repository -- IDEA-20260805-554b9d, IDEA-20260808-baf8bc,
    IDEA-20260808-a3bcf0, and the draft contract EXP-MCE-350abf -- is arithmetic on transcribed exponents.
    Not one executes a decoder. An executed measurement at toy scale answers a question arithmetic
    cannot: whether a real implementation''s iteration count and peak memory track the closed-form
    prediction, and by what factor. (B) The scientifically interesting arm is the comparison, not
    the absolute number. Generic decoding is assumed to be blind to the code''s structure: an ISD
    run against a Goppa code and against a random code of identical (n, k) with a planted weight-t
    error should take statistically indistinguishable numbers of iterations. That assumption is load-bearing
    everywhere in code-based cryptography and is measurable here directly. If the ratio of median
    iteration counts departs from 1, that is a measured structural leak at toy scale and a first-class
    result; if it does not, it is a controlled null that locally validates a universally used assumption
    with an interval attached. (C) NOT CLAIMED: solving a syndrome-decoding instance at n <= 64 is
    not an attack, not a break, not a key recovery, and not a security consequence for anything. No
    exponent is claimed, improved, or asserted; no cost model is adopted; and in particular this contract
    does NOT bind to ISD-FC-2026, which DEC-20260802-344883 and DEC-20260803-a5b9b1 are recorded as
    establishing is not adopted. No number measured at n <= 64 is quoted about any deployed parameter
    set. (D) The memory and parallelism charge is measured, not modelled: peak list size, number of
    list entries touched, and collisions per iteration are counted by the implementation itself, so
    a later cost-model discussion has execution data instead of an accounting convention argued in
    the abstract.'
  mechanism: 'STAGE 1: implement Prange exactly -- pick a random information set of size k, Gaussian-eliminate
    the parity check on the complementary columns, read off the candidate error, check its weight,
    repeat. Count iterations to success, elimination operations per iteration, and nothing else, so
    the measurement is unambiguous. STAGE 2: implement Stern with parameters (p, l) -- split the information
    set, build two lists of partial sums of weight p, collide them on l coordinates, complete. Count
    iterations, peak list size in entries, and collisions per iteration. Both implementations are
    pure Python over bitmask rows and are slow in wall-clock terms, which is irrelevant: the reported
    quantities are counted operations and counted memory, not seconds. STAGE 3: build the two arms
    at matched (n, k). GOPPA arm: take the certified fixture, plant a uniformly random weight-t error,
    compute its syndrome, and hand only the public parity check and the syndrome to the solver. RANDOM
    arm: take a matched random binary code of identical (n, k), plant a uniformly random weight-t
    error, same interface. The solver receives no information distinguishing the arms. STAGE 4: solve
    200 instances per arm per cell, recording the full iteration-count vector rather than a mean,
    because ISD iteration counts are geometrically distributed and a mean is a poor summary. STAGE
    5: compare arms by the ratio of medians and by a distribution-free two-sample test on the raw
    vectors, with the pre-registered null being ratio 1. STAGE 6: compare each arm''s measured median
    against the closed-form Prange expectation for its (n, k, t) and report the measured/predicted
    ratio, which is the honest content of the phrase ''a cost model fitted to executions''.'
  novelty_status: unverified
  novelty_screen:
    method: Ran grep -ril 'information.set decoding|Prange|Stern' over ledger/proposals/ (20 files).
      Read the titles and classes of IDEA-20260805-554b9d, IDEA-20260808-baf8bc, IDEA-20260808-a3bcf0,
      IDEA-20260808-b6ba7a and IDEA-20260807-c3267e. Read the objective, what_this_is_not and claim_ceiling
      blocks of EXP-MCE-350abf in full. Read RQ-MCE-e65b3c's constraints, in particular the matched-baseline
      discipline clause and the prohibition on deriving a competing costing convention. Read docs/inventor-protocol.md
      section 6 on the validation ladder, whose step 2 -- run the pipeline on a scaled-down instance
      and check the predicted ratio as a measured ratio rather than an extrapolation -- is exactly
      the step this proposal implements.
    results: Four proposals and one draft contract occupy the ISD lane, and all five are arithmetic.
      IDEA-20260805-554b9d re-costs the ISD family under five accounting bases from published exponents.
      IDEA-20260808-baf8bc computes a memory-capped constrained frontier from published exponents.
      IDEA-20260808-a3bcf0 computes an exhaustive exact-arithmetic optimum at the standardized parameter
      sets. EXP-MCE-350abf, at status review_required, computes an exact Prange cost at five parameter
      sets in arbitrary-precision integer arithmetic and states in what_this_is_not that it is 'not
      a decoding computation, a syndrome-decoding solve, a key recovery, or a distinguisher'. IDEA-20260807-c3267e
      concerns adoption of a costing convention. No record anywhere in the repository executes an
      ISD algorithm on any instance, and no record measures whether ISD behaves identically on structured
      and unstructured codes. docs/inventor-protocol.md section 6 explicitly names step 2 as the step
      this program most often skips.
    verdict: 'UNVERIFIED. Implementing Prange and Stern is textbook work and this record asserts nothing
      about what the published literature contains or has measured. What is claimed new is entirely
      local and is a gap the repository states about itself: five committed ISD records, zero executions,
      and an explicit protocol clause naming scaled-down execution as the routinely skipped step.
      The structure-blindness comparison -- running the identical solver on a Goppa arm and a matched
      random arm and reporting the ratio of median iteration counts -- is the one part that is a design
      choice rather than an implementation, and it is a straightforward application of the null-object
      discipline in section 3 to an algorithm rather than to a statistic.'
  object_first_candidate:
    tracked_object: The triple (iterations to success, peak list size in entries, collisions per iteration),
      recorded per solved instance and held as a full sample vector per arm per cell rather than as
      a summary. The object followed through the computation is that per-instance cost triple, and
      every comparison this proposal makes is a comparison of its distribution across arms.
    lossiness: 'Lossy, and honestly so. The entire execution trace -- which information sets were
      drawn, which eliminations were performed, which partial sums collided -- is discarded and only
      three counters survive per instance. That discard is compatible with the operation being studied
      because the question is about cost, and cost is exactly what the counters retain; the discarded
      trace would distinguish runs that cost the same, which is precisely the distinction the question
      does not care about. The projection would be non-lossy, and therefore useless, if the counters
      were sufficient to reconstruct the trace, which they plainly are not: many traces map to the
      same triple.'
    propagation: 'One step of the target operation -- a single ISD iteration -- acts on the tracked
      object by incrementing the iteration counter, updating the running peak of the list size, and
      adding that iteration''s collision count. The propagation is therefore additive and monotone
      in two coordinates and a max in the third, which is what makes the distribution across instances
      tractable: iteration counts are geometric with a success probability determined by (n, k, t,
      p, l), so the predicted distribution is known in closed form up to that probability, and the
      measured distribution can be compared to it directly rather than only through its mean. The
      structure-blindness question is exactly the question of whether the geometric parameter differs
      between the two arms.'
    survival_score: The object survives as long as the instances are solvable inside the iteration
      cap. At n = 16, k = 8, t = 2 a random information set avoids all error positions with high probability
      and Prange succeeds in a handful of iterations; at n = 64, k = 40, t = 4 the expected iteration
      count is still modest, in the low hundreds. The structure dissolves once the iteration cap binds,
      because a censored geometric distribution is no longer comparable across arms without a survival-analysis
      correction. The experiment reports the censoring fraction per cell explicitly and refuses to
      compare arms in any cell where it exceeds 0.05, which is where the object stops being usable.
  null_object_control: 'The null object is a matched random binary [n, k] code with a planted uniformly
    random weight-t error, generated in the same invocation from a domain-separated seed and handed
    to the IDENTICAL solver through the identical interface, so the solver cannot tell the arms apart.
    For the Goppa arm''s numbers to mean anything the null must show: (a) a median iteration count
    within the pre-registered interval of the Goppa arm''s, since generic decoding is assumed structure-blind,
    and (b) a measured/predicted ratio against the closed-form Prange expectation that is itself close
    to 1, since the random arm is the case the closed form was derived for. Part (b) is what makes
    the null a calibration rather than merely a comparison: if the random arm does not match the closed
    form, the implementation is wrong and the Goppa arm''s number means nothing. A second null runs
    the solver on a code with a planted error of weight t+2, where success is not expected, to confirm
    the iteration cap behaves as censoring and not as a silent wrong answer.'
  discriminated_from:
  - 'EXP-MCE-350abf (draft, review_required): computes an exact Prange cost at five parameter sets
    by arbitrary-precision arithmetic and states explicitly that it is not a decoding computation
    or a syndrome-decoding solve. This proposal executes a solver on instances and measures; the two
    are complementary and this one claims nothing about the five parameter sets.'
  - 'IDEA-20260805-554b9d: basis-parametric re-costing of the ISD family from published exponents
    under five accounting bases. No execution, no instance, no measured counter.'
  - 'IDEA-20260808-baf8bc: memory-capped constrained frontier T_V(mu) from published exponents. A
    closed-form optimisation, not a measurement.'
  - 'IDEA-20260808-a3bcf0: exhaustive exact-arithmetic memory-charged optimum at the standardized
    sets, at parameters no run can touch. This proposal deliberately runs at parameters where execution
    is possible and refuses to speak about the others.'
  - 'IDEA-20260807-c3267e: concerns whether a costing convention is adopted. This contract adopts
    none and explicitly does not bind to ISD-FC-2026, per the constraint recorded in RQ-MCE-e65b3c
    and the decisions it cites.'
  assumptions:
  - The certified fixture from proposal 1 of this set exists; without a Goppa arm this contract degenerates
    to measuring an ISD implementation against itself, which is still a valid but much weaker deliverable.
  - Iteration counts are approximately geometric at these sizes, so medians and distribution-free
    tests are appropriate and means are not; this is checked by a goodness-of-fit report rather than
    assumed silently.
  - 'The solver''s interface genuinely hides the arm: it receives only a parity-check matrix and a
    syndrome, with no metadata, and this is enforced by construction rather than by discipline.'
  - Counted operations rather than wall-clock are the right cost currency in pure Python; wall-clock
    is recorded as secondary and is explicitly not used for any comparison, since single-machine timing
    audits are already saturated elsewhere in this program.
  predictions:
  - metric: ratio of median Prange iteration counts, Goppa arm over matched random arm, at n=32, k=17,
      t=3
    direction: different
    minimum_effect: 'forced value: pre-registered at 1.00, with a two-sided rejection band of [0.85,
      1.18]. A ratio inside the band is a controlled null supporting structure-blindness locally;
      outside it is a measured anomaly requiring a replication before any reading.'
  - metric: measured median iterations of the random arm divided by the closed-form Prange expectation
      for its (n,k,t)
    direction: different
    minimum_effect: 'forced value: within a factor of 2. Outside that, the implementation is not computing
      what the closed form describes and the run is void.'
  - metric: peak list size of Stern at (p,l) = (1,2) relative to the predicted binomial list length
    direction: different
    minimum_effect: 'forced value: exactly equal, since the list length is combinatorially determined;
      any discrepancy is an implementation bug.'
  - metric: censoring fraction (instances hitting the iteration cap) per cell
    direction: lower
    minimum_effect: 0.05
  minimal_test:
    design: 'One cell decides whether the comparison has any resolution: n = 32, k = 17, t = 3, using
      the m = 5 fixture. Generate 200 Goppa instances by planting a uniformly random weight-3 error
      in a fixture key and computing its syndrome, and 200 matched random-code instances at identical
      (n, k) the same way. Hand each of the 400 instances to the same Prange implementation through
      an interface carrying only a parity-check matrix and a syndrome. Record iterations to success
      for each, with a cap of 10^5 iterations. Report both raw vectors, the two medians, their ratio
      with a bootstrap interval, the censoring fraction, and each arm''s measured/predicted ratio
      against the closed-form Prange expectation. Cost is on the order of an hour in pure Python and
      needs no dependency. The discrimination: if the random arm''s measured/predicted ratio is not
      within a factor of 2, the implementation is wrong and nothing else in the run can be read; if
      it is, the arm ratio is a real measurement of a universally assumed property at a scale where
      it has, in this repository, never been measured at all.'
    controls:
    - Matched random binary code with planted weight-t error, identical solver interface, same invocation.
    - 'Closed-form calibration: each arm''s measured median against the analytic Prange expectation
      for its own (n,k,t).'
    - 'Over-weight null: planted error of weight t+2, where the cap should bind, confirming censoring
      is visible and not a silent wrong answer.'
    - 'Solved-instance verification: every returned error vector is checked to have weight <= t and
      to reproduce the syndrome, so a ''success'' is verified rather than reported.'
    - 'Seed replication: the entire cell re-run under a second seed family, with the arm ratio required
      to replicate inside its interval.'
    required_metrics:
    - raw per-instance iteration counts per arm
    - median iteration count and bootstrap interval per arm
    - arm ratio of medians
    - peak list size and collisions per iteration for Stern
    - censoring fraction per cell
    - measured/predicted ratio against the closed form per arm
    - count of unverified successes, required zero
  falsification_conditions:
  - Any returned error vector failing weight or syndrome verification falsifies the solver.
  - Random arm measured/predicted ratio outside a factor of 2 falsifies the implementation and voids
    the cell.
  - Stern peak list size differing from the combinatorially predicted length falsifies the list construction.
  - Censoring fraction above 0.05 in a cell makes that cell's arm comparison invalid and it must be
    reported as uncomparable rather than compared.
  - An arm ratio outside [0.85, 1.18] that does NOT replicate under the second seed family is an artefact,
    and reporting it as a structural leak would be the error this design exists to prevent.
  - The over-weight null succeeding at a nontrivial rate falsifies the weight check.
  confounders:
  - Toy (n, k, t) are small enough that a single unlucky information-set draw shifts a median; sample
    size and bootstrap intervals are the only defence and they are reported, not assumed adequate.
  - The Goppa arm's realised k is determined by measured rank and may differ from the random arm's
    unless matching is enforced by resampling; a dimension mismatch would produce an arm ratio entirely
    for structural-dimension reasons.
  - Pure-Python constant factors differ across code shapes, which is why wall-clock is excluded from
    every comparison and only counted operations are used.
  - The planted-error distribution (uniform over weight-t vectors) is a modelling choice, and a different
    choice could change both arms equally or unequally; it is frozen and stated.
  - 'Dependence on the fixture: a construction bug in proposal 1 would appear here as a spurious arm
    ratio.'
  interpretation_limits:
  - An arm ratio measured at n <= 64 says nothing about any deployed parameter set and no exponent
    is claimed from it.
  - Solving a toy syndrome-decoding instance is not an attack and must never be reported as one.
  - A controlled null (ratio 1) validates structure-blindness locally at the tested sizes only; it
    is not a proof of the assumption at any scale.
  - No costing convention is adopted, and these measurements must not be used to derive one; RQ-MCE-e65b3c's
    constraint against deriving a competing convention is binding here.
  target_complexity:
    time_exponent: No attack exponent is claimed or improved. The measured quantity is an iteration
      count at toy parameters and its relation to the closed-form Prange expectation; the closed form
      itself is transcribed background, not a result of this contract, and no asymptotic statement
      is made.
    memory_exponent: 'No attack memory exponent is claimed. Peak memory is measured, not modelled:
      Stern''s list length at (p, l) with k <= 40 is at most a few thousand entries and is counted
      directly.'
    best_known: The incumbent is the published ISD lineage, which this program has recorded but not
      read and about which it asserts nothing. Within this repository the incumbent for an ISD cost
      figure is EXP-MCE-350abf's arithmetic, at status review_required and not executed; the incumbent
      for an ISD MEASUREMENT is nothing.
    hidden_overhead: 'Hidden in the currency: counted operations in pure Python hide a constant factor
      of perhaps two orders of magnitude against a compiled implementation, which is exactly why no
      wall-clock comparison is permitted here. Hidden in the human cost: the temptation to read an
      arm ratio of 1.2 as a structural leak, which is why replication under a second seed family is
      a falsification condition rather than a nicety.'
  dominated_by: 'n/a (no result claimed). Pareto check performed in the applicable sense: this contract
    constructs no adversary and claims no exponent, so it occupies no row on any time/memory/data
    frontier. Its measured iteration counts at n <= 64 are not comparable to any published cost and
    are not offered as such. Declaring a dominating attack here would be a fabrication.'
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitative delta: zero executed
    ISD runs in this repository before, several thousand verified solved instances with counted iterations,
    counted peak memory and counted collisions after, plus a first measured value for the ratio between
    structured and unstructured arms with a stated interval.'
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: P(Prange is implemented correctly and the random arm calibrates within
    a factor of 2 of the closed form) = 0.8; this is the gate and it is the most likely single point
    of failure. P(Stern is implemented correctly with the predicted exact list length) = 0.7; the
    (p, l) bookkeeping is where such implementations usually break. P(the arm ratio lands inside [0.85,
    1.18], i.e. a controlled null supporting structure-blindness) = 0.75; that is the expected and
    boring outcome and it is worth measuring precisely because it has never been measured here. P(a
    departure, if seen, replicates under a second seed family) = 0.15 conditional on being seen, which
    is the honest statement that most apparent anomalies at n <= 64 will be sampling noise. P(the
    cells at n = 64 complete inside budget in pure Python) = 0.5.
