# =============================================================================
# IDEA-20261001-febbe1 -- dim(V·V) as predictor of XOR-SAT variable count.
# Calibrates KR-IC-73db3f product-space heuristic; distinct from usable_dim.
# =============================================================================
idea:
  id: IDEA-20261001-febbe1
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    AT FIXED dim(V), DOES SMALLER dim(V·V) PREDICT FEWER XOR-SAT VARIABLES?
    On binary toys n∈{17,19,23} with frozen dim(V)=ℓ∈{3,4}, sweep ≥12 distinct
    F_2-subspaces V and test whether dim(V·V) rank-correlates with the
    descended S_3 XOR-SAT variable count within a pre-registered band.

  class: heuristic_validation

  claim: >-
    KR-IC-73db3f recommends choosing V so that product spaces V^{(i)} have
    small dimension to lower degree and variable count after Weil descent.
    CLAIM: at each toy cell (n,ℓ)∈{17,19,23}×{3,4}, across a frozen catalog
    of ≥12 distinct dim-ℓ subspaces, Spearman's ρ between dim(V·V) and the
    XOR-SAT variable count N_var of the descended S_3 instance satisfies
    ρ ≥ 0.70 — OR the correlation fails and is recorded as
    product-dim-not-predictive at this scale. CLAIM TIER:
    heuristic_validation. NO break. NO exponent. NO n≥131 transfer.
    Distinct from IDEA-20261001-fbee3f (predicts usable_dimensions=∅, not
    N_var) and 880180 (poly vs normal basis on usable_dimensions).

  mechanism: >-
    OBJECT FRAME. Representation: FB {P : x(P)∈V} with V an F_2-subspace;
    measure dim(V·V) in the polynomial (or admitted) basis, then encode the
    descended S_3 system as XOR-SAT and read N_var (KR-IC-73db3f /
    KR-IC-5765d2 / KR-IC-5a43e5). Operation set: sweep a frozen catalog of
    V shapes at fixed ℓ (span{1..z^{ℓ−1}}, geometric progression, random,
    and any already-admitted structured families). Trichotomy: Class I
    instrument (predictor of encoding size). Lossy-projection: N_var
    discards which clauses dominate; null is a matched catalog of random
    Boolean systems whose N_var is independent of dim(V·V) by construction.
    OFF-LIMITS: usable_dimensions emptiness (fbee3f); basis-only census
    (880180); τ-closed yield (0fcbe2); solver races. WHAT IS NEW: a
    pre-registered Spearman ≥0.70 band linking dim(V·V) to XOR-SAT N_var
    at RQ-BINSTD toys.

  novelty_status: unverified
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    frontier_map_commit: '7c2b1bb2156137049ed6b7fceb82924163f73b46'
    rows_checked:
      - KR-IC-73db3f
      - KR-IC-5765d2
      - KR-IC-5a43e5
      - KR-IC-fbdb61
