        relation: adjacent
        delta: >-
          Recommends small product spaces to lower degree/variable count;
          novelty must never be 'choose V with small V·V'. This idea fixes
          that heuristic and measures a Spearman ≥0.70 band between
          dim(V·V) and XOR-SAT N_var at toys, without claiming any ECDLP
          exponent move.
    searched:
      corpus_grep:
        - factor base V product space dim Weil descent SAT variables
        - dim V·V predict XOR-SAT variable count toys
        - KR-IC-73db3f Spearman product-space encoding size
      web: []
      blocked: []

  origin:
    kind: portfolio_ideation
    date: '2026-10-01'
    scope: >-
      FB-shape instrument for RQ-BINSTD: whether the product-space heuristic
      predicts encoding size (N_var) before any yield or solve claim.
    overlap_review: >-
      Distinct from IDEA-20261001-fbee3f / 880180 (usable_dimensions
      census), 0fcbe2 (τ-closed yield), and solver-engine races. Observable
      is Spearman(dim(V·V), N_var), not emptiness or success rate.

  citations:
