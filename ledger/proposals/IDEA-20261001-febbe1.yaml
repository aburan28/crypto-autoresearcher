      verified_by: build_frontier_map.py --area index-calculus this session.

  assumptions:
    - Frozen V catalog (≥12 shapes), seeds, XOR-SAT encoder, Spearman band 0.70.
    - Encoder already admitted or cell is failed_infrastructure.
    - Predictor of N_var ≠ predictor of usable_dimensions or of success rate.
    - Encoding-size correlation ≠ practical binary IC (KR-IC-1fcdbc).

  heuristic_assumptions:
    - id: HEUR-BINSTD-febbe1-H1
      formal_statement: >-
        FORALL (n,ℓ)∈{17,19,23}×{3,4}: across the frozen ≥12-shape V catalog,
        Spearman ρ(dim(V·V), N_var) ≥ 0.70 where N_var is the XOR-SAT
        variable count of the descended S_3 instance.
      random_model_justification: >-
        Rigorous: KR-IC-73db3f argues that smaller product spaces reduce the
        number of descended variables after Weil restriction. Classical: if
        that channel dominates encoding size, dim(V·V) and N_var should
        correlate strongly; if trace/linear constraints (KR-IC-f5c584)
        dominate instead, correlation may fall below 0.70. The ≥0.70 band
        is the pre-registered transfer hypothesis at toys — not a claim
        that small V·V beats rho.
      supporting_results:
        - KR-IC-73db3f
        - KR-IC-5765d2
        - KR-IC-f5c584
      validation_experiment_ids: []
      falsification_condition: >-
        Spearman ρ < 0.70 at a completed cell (product-dim-not-predictive),
        OR encoder absent (infrastructure stop), OR catalog collapses to
        <12 distinct dim(V·V) values (inconclusive; expand catalog or stop).

  predictions:
    - metric: spearman_dimVV_vs_Nvar
      direction: lower_bounded
      minimum_effect: '≥ 0.70 at each (n,ℓ) cell'
    - metric: catalog_size
      direction: lower_bounded
      minimum_effect: '≥ 12 distinct V shapes per cell'
    - metric: distinct_dimVV_values
      direction: lower_bounded
      minimum_effect: '≥ 3 distinct dim(V·V) values, else inconclusive'

  minimal_test: >-
    Stage 0: freeze V catalog (≥12), seeds, XOR-SAT pin, Spearman band 0.70.
    Stage 1: n=17, ℓ∈{3,4} — encode each V; report ρ ± bootstrap CI.
    Stage 2: n=19,23 + random-Boolean null catalog. Budget: ≤6 CPU-hours.
    Stop if encoder absent (IMP, never evidence).

  controls:
    - ctl_fixed_dim_V
    - ctl_frozen_V_catalog
    - null_random_boolean_matched_catalog
    - ctl_bootstrap_ci_reported
    - ctl_no_posthoc_band_edit
    - ctl_shared_xorsat_pin

  falsification_conditions:
    - Claiming practical binary IC from a toy encoding correlation (KR-IC-1fcdbc).
    - Treating 'choose small V·V' as novelty (KR-IC-73db3f forbids).
    - Equating N_var prediction with usable_dimensions prediction (fbee3f).
    - Transferring the 0.70 band to n≥131 without a new contract.
    - Editing the band after seeing encodings.

  target_complexity:
    time_exponent: >-
      No exponent claimed. Encoding-size instrument only; a high Spearman
      does not move binary ECDLP vs rho (KR-IC-1fcdbc / KR-IC-9e610d).
    memory_exponent: Negligible — store per-V dim(V·V) and N_var.
    best_known: >-
      KR-IC-73db3f (product-space V choice); KR-IC-5765d2 (XOR-SAT PDP path).
    hidden_overhead: Catalog construction; encoder constants independent of V·V.
    tradeoff_note: >-
      Small V·V may cut N_var but worsen relation density — this meter
      measures only the encoding side.

  estimated_cost:
    implementation: low
    compute: low
    qualification: >-
      Estimate. Requires admitted S_3 XOR-SAT encoder; do not provision
      mid-tick. Under six CPU-hours at n≤23 (encode-only; no solve required).

  asymptotic_claim: null

  dominated_by: >-
    CHECKED KR-IC-73db3f dominates as the product-space heuristic; this
