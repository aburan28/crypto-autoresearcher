  assumptions:
    - Public short-Weierstrass E/F_p, prime-order subgroup of order N, public G and Q.
    - No secret scalar labels, free orientation, or uncharged oracles.
    - Representation and Sigma are exactly the affine chart and {[2]} named above; retained point information is charged.
    - Affine doubling Jacobian is undefined or singular at 2-torsion (y=0); those inputs must reject.
    - F1 walk-collision is a possible later consumer of a closed predicate, not the primary lens.
    - Passing the Stage-0 identity does not solve ECDLP and does not move an exponent.
  predictions:
    - metric: chain_rule_hold
      direction: different
      minimum_effect: >-
        REAL cell equals 1 (exact field equality det D[4]_P = det D[2]_{[2]P} * det D[2]_P).
        Known-false cell equals 0. Invalid y=0 cell rejects.
    - metric: unary_closure
      direction: different
      minimum_effect: >-
        Fraction of tested P for which det D[2]_{[2]P} is a rational function of
        det D[2]_P alone, on a frozen toy where the function field is enumerable.
        Outcome A if a unary F of degree O(1) fits every non-singular sample;
        outcome B if residual stays Omega(1) after all degree <= 4 candidates.
    - metric: L_and_b
      direction: different
      minimum_effect: >-
        If unary closure fails, measure L(pi) and b(pi) of IDEA-20260802-002 on
        the toy against identity, random-label, and relabelled Z/NZ controls.
  minimal_test:
    execution_status: design_only
    design: >-
      STAGE-0 FINITE EXACT IDENTITY (named). Freeze one toy ordinary
      short-Weierstrass curve over a tiny prime (p in {19, 23, 31}), one
      non-2-torsion point P with y(P) != 0 and y([2]P) != 0, and the two 2x2
      affine Jacobians J1 = D[2]_P and J2 = D[2]_{[2]P} together with
      J4 = D[4]_P. REAL claim: det(J4) = det(J2) * det(J1) in F_p.
      Known-false claim: det(J4) = 1 for this P (wrong-value constant).
      Null object: two independent uniform 2x2 matrices over F_p, whose
      det-product is not required to equal det of any third structured matrix.
      Invalid-input reject: y=0 (2-torsion) must raise, not emit a det.
      Optional unary-closure cell (still finite): on the same curve, tabulate
      (det D[2]_P, det D[2]_{[2]P}) for every non-singular affine point and
      test whether the second coordinate is a function of the first.
    matched_null: >-
      Independent uniform 2x2 matrices over F_p (no group law). Their
      det-product must not be credited as the chain-rule identity.
    known_false: >-
      Constant claim det D[4]_P = 1 (or det D[2]_{[2]P} = det D[2]_P) on the
      frozen REAL point.
    controls:
      - kind: matched_null
        design: Random 2x2 matrices over F_p with no doubling structure.
      - kind: known_false
        design: Constant/wrong-value claim det D[4]_P = 1 on the frozen REAL point.
      - kind: invalid_input
        design: y=0 must reject; do not define D[2] at 2-torsion.
      - kind: baseline
        design: Pollard rho and BSGS are matched cost controls only if a later walk consumes the predicate; Stage 0 itself compares to the exact chain rule and the random-matrix null.
      - kind: pgl2_reparametrisation
        design: Repeat the REAL identity after one public PGL_2 change of the affine x-chart. If the numerical det changes but the product identity persists, that is chart dependence (predicted), not a group-element invariant.
    required_metrics:
      - chain_rule_hold
      - unary_closure
      - L_and_b
    decision_threshold: >-
      Accept the identity cell iff REAL equality holds, known-false fails, null
      is not credited, and invalid input rejects. Unary closure is a separate
      bit: A if a unary F exists on the frozen curve, B if not. Only the frozen
      (p, curve, P) cell is in scope. No exponent claim.
    stopping_rules:
      - Stop at the first failed exact identity or known-false control and classify it as a procedure defect, not mathematical falsification.
      - A future Executor must freeze instance/seed lists and caps before running; no run is authorized here.
    required_artifacts:
      - frozen instance and parameter manifest
      - exact 2x2 matrices and determinants
      - REAL / known-false / null / invalid outcomes
      - independently checkable field-arithmetic certificates
    budget:
      authorized_runs_in_this_task: 0
      future_experiment_status: requires a new approved frozen handoff
  falsification_conditions:
    - REAL chain-rule equality fails on a correctly implemented affine doubling Jacobian at a non-singular P (procedure or formula defect; supersede the record).
    - A unary F of det D[2] under [2] exists AND the PGL_2 null reproduces it (then the object is a chart artifact, not a new group object).
    - A claimed walk gain that survives the random-label and relabelled Z/NZ controls without a named structural distinction is an artifact.
    - Only the exact frozen family in minimal_test is in scope.
  confounders:
    - Using projective or Jacobian coordinates silently (those Jacobians differ by a chart factor).
    - Evaluating at 2-torsion or at points with y([2]P)=0 and treating a rejected input as a mathematical miss.
    - Hidden scalar labels used to build D[2] rather than affine coordinates alone.
    - Confusing this 2x2 product with ENDFOLD's Sherman-Morrison identity.
  interpretation_limits:
    - No factor base; KN-OPEN-020 does not apply.
    - Kummer-line and degree-d-function-on-E are not used.
    - A passed Stage-0 identity is a calibrator, not an attack and not a campaign completion.
    - Chart dependence is expected; a PGL_2 change that preserves the product identity does not upgrade the object to a group-element invariant.
    - established_exponent_gain remains 0.
  heuristic_assumptions:
    - id: H1-IDEA-20260913-768066
      statement: >-
        For a uniform random non-2-torsion P in E(F_p)(F_p-rational points of
        the prime-order subgroup), det D[2]_P is equidistributed in F_p^* up to
        a O(p^{-1/2}) discrepancy. Imitates Weil equidistribution of a
        non-constant rational function on an elliptic curve.
      rigorous_support: >-
        Weil bound on character sums of a non-constant rational function on a
        genus-1 curve (recalled pointer to Weil 1948 / standard form in
        Iwaniec-Kowalski-style exponential-sum texts; not opened here). The
        rigorous ingredient is that a non-constant rational f: E -> P^1 of
        degree d satisfies |sum_P chi(f(P))| = O(d sqrt(p)) for nontrivial
        multiplicative chi.
      random_model_justification: >-
        Pair the Weil bound (rigorous) with the classical statement that a
        degree-d rational function on E behaves like a uniform random F_p
        element with respect to multiplicative characters, in the same way
        Canfield-Erdos-Pomerance is paired with a size bound in the target
        profile. No smoothness theorem is used.
      validation_plan: >-
        Sample all non-singular affine points on one frozen p~31 curve (exact
        census, no transfer) and compare the empirical distribution of
        det D[2]_P on F_p^* to uniform, including the tail count of any single
        value. On a second 16-bit curve, sample 10^4 random subgroup points via
        known-scalar construction (public scalars only) and repeat the
        chi-squared / KS comparison. Transfer assumption: the p~31 census does
        not automatically certify 256-bit curves; any later claim must say so.
      falsification_condition: >-
        On the frozen p~31 census, a single F_p^* value occurs with frequency
        differing from 1/(p-1) by more than 4 d / sqrt(p) after the degree of
        det D[2] as a function on E is accounted for, with the degree itself
        computed from the same census (not assumed).
    - id: H2-IDEA-20260913-768066
      statement: >-
        There is no degree <= 4 rational F in one variable such that
        det D[2]_{[2]P} = F(det D[2]_P) for all non-singular P on a generic
        ordinary prime-order curve (unary non-closure). This is the predicted
        Outcome B.
      rigorous_support: >-
        Dimension count: det D[2] is one rational function; the doubling map
        has degree 4 on x, and the chain rule introduces det D[4]_P as an
        independent function unless a relation in the function field collapses
        it. No theorem is claimed; this is the alternative the Stage-0 table
        decides.
      random_model_justification: >-
        Comparison law is the exact finite table on the frozen curve, not a
        classical distribution. No Dickman-de Bruijn or CEP statement is used.
      validation_plan: >-
        Exhaustive table on the frozen p in {19,23,31} curve: interpolate all
        rational F of degree <= 4 on the observed (det D[2]_P, det D[2]_{[2]P})
        pairs; report exact residual. Tail check: any exception set of size
        O(1) is listed, not absorbed into an average.
      falsification_condition: >-
        A degree <= 4 unary F fits every non-singular point on the frozen
        curve (Outcome A). That is a positive finding about closure, not a
        procedure defect, and it does not by itself move an exponent.
  target_complexity:
    time_exponent: >-
      Conditional only, and only if Outcome A and a later walk uses the det as
