idea:
  id: IDEA-20260913-768066
  title: Affine doubling-Jacobian determinant as a two-step chain-rule identity
  class: mechanism
  claim: >-
    On a prime-order short-Weierstrass subgroup, the determinant det D[2]_P of
    the affine doubling map's Jacobian at P is a lossy R1 coordinate-dependent
    projection. Either (A) it is a unary function of itself under Sigma={[2]},
    giving a closed partial-action object of <[2]>, or (B) the only exact
    identity is the two-step chain rule det D[4]_P = det D[2]_{[2]P} * det D[2]_P
    and the unary update fails, so the object is branching and is priced by the
    (L, b) meter of IDEA-20260802-002. The cheapest discriminator is that 2x2
    product identity on a frozen toy. No end-to-end exponent gain is claimed.
    Attack stage targeted: collision structure (a multiplicative predicate),
    not factor-base membership, relation decomposition, or linear algebra.
  mechanism: >-
    Representation: affine short-Weierstrass coordinates (x, y) in F_p x F_p
    (R1 field representation of coordinates). Operation set Sigma = {[2]}, the
    affine doubling map, not the full translation action. Trichotomy class:
    coordinate-dependent -- the Jacobian lives in a chosen affine chart and
    changes under PGL_2 reparametrisation, so it is a function of the
    representation, not of the group element alone. One-line reason: D[2]_P is
    the differential of a chart-dependent rational map. R1 class. Attack stage
    whose cost is targeted: collision structure (whether det D[2] can serve as
    a closed multiplicative distinguished-point weight under doubling).

    LOSSY-PROJECTION TEST against Sigma={[2]}. The projection pi(P) = det D[2]_P
    discards the point (x, y) and the individual Jacobian entries, retaining one
    field element. It is lossy: a non-constant rational function on E has finite
    fibres of size governed by its degree, so 1 < |fibre| << N for generic
    values. Discard compatibility: the chain rule supplies the exact 2x2
    identity det D[4]_P = det D[2]_{[2]P} * det D[2]_P whenever y(P)*y([2]P) != 0.
    That identity is a relation among three scalars, not a proof that
    det D[2]_{[2]P} is a rational function of det D[2]_P alone. If a unary F
    exists, the fibres of pi are a block system of <[2]> and the open number is
    the cost of canonicalising a <[2]>-orbit from the det label. If no unary F
    exists, the object is branching and the open number is (L(pi), b(pi))
    measured against identity, random-label, and relabelled Z/NZ controls.

    Not F1 as primary lens: a later walk could consume the det as a predicate;
    what is added is the differential cocycle identity, not a new walk. Not
    ENDFOLD (IDEA-20260906-8d9926): that 2x2 identity is Sherman-Morrison on a
    folded relation matrix, not the Jacobian of the group law. No factor base
    (KN-OPEN-020 does not apply). No Semaev, Velu, Gaudry, Coppersmith, Miller,
    Tate, P1553, CRT, half-gcd, nested LHW, Gamma-orbit materialization,
    division polynomials, product trees, or cubical/biextension lifts.
