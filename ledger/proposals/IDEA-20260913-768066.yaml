      rho; that walk is not proposed here.
    cost_model: >-
      Stage 0 is a constant number of field operations on a frozen toy.
      Conditional online cost if Outcome A and a walk is later designed:
      T = C_det * sqrt(N) with C_det the extra arithmetic beyond one doubling.
      established_exponent_gain = 0.
