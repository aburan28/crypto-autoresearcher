  minimal_test:
    design: >-
      STAGE 0 (ZERO COMPUTE, HARD GATE, ONE AFTERNOON). Prove the split inequality
      and derive (B). Run the exemplar reproduction P2 symbolically and the
      row R1 fixture. Run NULL-1, the shuffled tuple, at zero compute. If P2 fails or
      NULL-1 also returns 1/2 everywhere, the record stops and that IS the
      deliverable.
      STAGE 1 (ZERO COMPUTE). Fill the six-row table with every counting function
      derived, and run P1 against the corpus's committed exponents for the same
      families. Mark heuristic Y_min entries.
      STAGE 2 (HOURS, THE ONLY NUMERIC STAGE). P3 - sample curve-defined and random
      coset minima by Lagrange-Gauss reduction, 10^4 per cell, six prime orders from
      2^17 to 2^27, d in {1, 7, 101, n^{1/3}, n^{2/3}}. NO ECDLP IS SOLVED at this
      stage; the sampler uses known k to CONSTRUCT the coset and the reduction code
      path is statically checked not to read k. Run NULL-2 and NULL-3 on the
      identical estimator. Run the P4 planted-gain positive control.
      STAGE 3 (ZERO COMPUTE). The forward-guidance table, P5.
      MATCHED CONTROLS THROUGHOUT - parallel Pollard rho and BSGS are run on the same
      toy instances in the same charged units at Stage 2 so that every reported
      exponent has both incumbents beside it.
      NO LIVE KEY, WALLET OR DEPLOYED SYSTEM. All instances self-generated at toy
      scale.
    controls:
      - Parallel Pollard rho with distinguished points and negation on the same instances, same charged units (blocking matched control)
      - BSGS on the same instances, same charged units, memory reported (blocking matched control)
      - NULL-1 shuffled tuple, the artifact tell (blocking, zero compute)
      - NULL-2 random coset of the same lattice (blocking)
      - NULL-3 sham composition structure with no curve behind it (blocking)
      - POSITIVE CONTROL with a planted Y_min gain of known size n^{-1/4} (blocking)
      - Exemplar reproduction fixture returning exactly 1/3 and 1/2 (blocking)
      - Row R1 fixture returning exactly 1/2 (blocking)
      - Static check that the coset-reduction code path never reads k (blocking)
    required_metrics:
      - The six-row table with A, Omega, Y_gen, Y_min, predicted exponent, and the status (theorem or heuristic) of each Y_min
      - Exemplar reproduction exponents, time and memory, stated to three digits
      - Median and full empirical CDF of Y_min ratios per (n, d) cell, with sample sizes and seeds
      - Two-sample Kolmogorov-Smirnov statistics against NULL-2, per cell
      - Recovered exponent of the planted-gain control with its confidence interval
      - Measured exponents of the rho and BSGS comparators on the identical instances
      - The forward-guidance table naming every class outside the law's scope
      - Pass or fail of every blocking control

  falsification_conditions:
    - >-
      F1. The exemplar slice does not return 1/3, or the pigeonhole slice does not
      return 1/2. The law is not the exemplar's law. The record stops at zero
      compute; the derivation is archived as the refutation artifact.
    - >-
      F2. NULL-1 returns 1/2 for shuffled tuples as well. The law is insensitive to
      its inputs and the row agreement is an artifact of its own arithmetic. No
      closure may be filed and the record is reported as a controlled null.
    - >-
      F3. P1 finds a corpus family whose committed exponent differs from the law's
      prediction. The law is wrong or the family is outside its class; either way the
      discrepancy is the deliverable and it is archived verbatim.
    - >-
      F4. P3 shows curve-defined coset minima systematically below random ones by a
      factor n^{c} with c > 0.05, reproduced at three cells and growing with n. THE
      LEAD - a rigorous-bound-beats-pigeonhole phenomenon on an ECDLP-attached
      lattice, which by (A) moves the exponent to 1/2 - c/2. It routes to independent
      review, and it would still be no attack until a bound is PROVED rather than
      measured, because the law needs Y_min as a theorem and not as a sample median.
    - >-
      F5. P3 returns ratio 1 and P1 returns agreement. THE PREDICTED OUTCOME. The
      smoothness-splitting meet-in-the-middle class is closed for prime-field ECDLP
      in the tested scope with a NAMED obstruction (Minkowski tightness on
      curve-defined cosets, i.e. the absence of any analogue of Aubry-Oyono-Vincent),
      a MEASURED quantity (the coset-minimum ratio with its CDF and error bars), and
      FORWARD GUIDANCE naming index calculus, transfers, preprocessing and quantum as
      the classes that remain open. It closes a class, not the problem.
    - >-
      F6. The planted-gain control is not recovered. Instrument failure; nothing is
      reported (AGENTS.md rule 3).

  confounders:
    - >-
      The law is a cost accounting, not a theorem about ECDLP, and an agreement
      across six rows can be produced by the accounting rather than by the
      mathematics. NULL-1 exists precisely to catch that and is blocking.
    - >-
      Y_gen is defined by an equality between smooth functions and is therefore only
      determined up to constants; every "ratio 1" claim in the table is a claim about
      EXPONENTS and must not be read as a claim about constants.
    - >-
      Toy-scale coset minima at n below 2^27 have a wide relative spread, so P3's
      medians need the stated sample sizes; an underpowered P3 will return
      INCONCLUSIVE, which is a budget outcome and not evidence of tightness.
    - >-
      Second-hand exemplar parameters. Every number in the reproduction check comes
      from docs/target-result-profile.md, not from the paper. If that document
      misquotes the paper the reproduction check is checking the wrong thing, and
      opening the frozen full text is listed as a Stage 0 obligation.
    - >-
      Row R3's Omega mixes curves and points and is the row most likely to be
      mis-derived; it is flagged for independent re-derivation before use.

  interpretation_limits:
    - >-
      NOTHING HERE IS A LOWER BOUND ON THE ECDLP. The law covers one algorithm class
      and the record states the boundary in Stage 3 rather than leaving it implicit.
    - >-
      The ECDLP rows are only as strong as their Y_min entries. Row R2's entry is a
      HEURISTIC until P3 measures it, and even then it is measured at toy scale and
      the transfer to cryptographic n is an explicit unjustified extrapolation.
    - >-
      The exemplar reproduction is a check that this record's arithmetic matches a
      published result as transcribed in an internal document. It is not an
      independent verification of that result and must not be cited as one.
    - >-
      A closure filed from F5 closes the DECLARED class over the SIX TABULATED
      STRUCTURES. It does not close KN-OPEN-019, and it does not license the
      statement that prime-field ECDLP is saturated.
    - >-
      No disposition, status change, or approval is made or implied.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For every ECDLP-attached composition structure in the table, the minimal norm
        of the solution arrow equals the pigeonhole value up to a factor n^{o(1)} -
        Y_min = Y_gen * n^{o(1)}, uniformly over the tested ladder of n and of
        structure parameters.
      rigorous_support: >-
        The rigorous half is Minkowski's convex body theorem, which gives the UPPER
        bound Y_min = O(Y_gen) unconditionally in every lattice row. What is assumed
        is the matching LOWER bound, i.e. that the instance-defined coset is not
        atypically close to the lattice. The classical distribution statement it
        imitates is the Gaussian heuristic for the minimum of a uniformly random
        coset, whose limiting distribution is explicit in rank 2. THE GAP IS NAMED -
        Minkowski gives no lower bound at all, and the exemplar's whole gain is a
        case where the analogous lower bound FAILS, so H1 is exactly the assumption
        the exemplar violates in its own setting. That is the reason to measure it
        rather than assert it.
      validation_plan: >-
        SAMPLE - 10^4 curve-defined cosets and 10^4 uniformly random cosets per cell,
        six prime orders 2^17 to 2^27, five values of d; minima computed exactly by
        Lagrange-Gauss reduction in polylog time per sample, so no ECDLP is solved
        and the sampling scale is far above the scale at which the attack could be
        run - that gap is the shortcut. COMPARISON DISTRIBUTION - the empirical CDF
        of Y_min/(n sqrt d) against the random-coset CDF, by two-sample
        Kolmogorov-Smirnov, and against the closed-form Gaussian-heuristic
        prediction where available. TAIL CHECK - the smallest curve-defined minimum
        over all cells against the smallest random minimum over equally many
        replicates; a real effect shifts the distribution rather than producing one
        outlier. SAMPLED PARAMETERS RECORDED - n, curve coefficients, d, delta, k,
        seed. TRANSFER ASSUMPTION, STATED - validated at n at most 2^27 only; nothing
        is claimed at cryptographic n.
    - id: H2
      statement: >-
        The counting functions A(X) of the six tabulated structures are regularly
        varying with the stated exponents over the ranges used, so that the identity
        of (B) applies with the stated theta.
      rigorous_support: >-
        The rigorous half is exact lattice-point counting (rows R1, R2, R4), the
        Dirichlet ideal-counting theorem (row R3) and the exemplar's Lemma 3.2 (the
        supersingular slice). The assumption is only that no row is used outside the
        range where its counting asymptotic is valid - which is a real risk, because
        row R2's asymptotic FAILS below X = d, and that failure is exactly the
        skewness obstruction IDEA-20260904-982159 records.
      validation_plan: >-
        SAMPLE - direct enumeration of A(X) at 20 values of X spanning four decades
        for each row, at three parameter settings each, compared against the claimed
        asymptotic; the fitted exponent must match the derived theta within 0.02.
        TAIL CHECK - the smallest X at which each asymptotic is within 10 percent,
        reported explicitly as the row's validity floor. TRANSFER ASSUMPTION - the
        floors are measured, not extrapolated, and any row used below its measured
        floor is void.

  target_complexity:
    time_exponent: >-
      The record's OUTPUT is an exponent formula rather than an algorithm -
      T/P = A((B Y_min)^{1/2}) / P, which specialises to Omega^{1/2} n^{o(1)} on
      every ECDLP row of the table and to p^{1/3+o(1)} on the exemplar's row. It
      claims no new algorithm and therefore claims no new time exponent for the
      ECDLP; what it claims is that the exponent of an entire class is DETERMINED by
      four numbers, and that all six ECDLP values of those numbers are on file.
    memory_exponent: >-
      Equal to the time exponent for every member of the class, because
      meet-in-the-middle stores its tables; that is a property of the class and it is
      the axis on which every member is dominated by parallel rho.
    best_known: >-
      Parallel Pollard rho at about 0.886 sqrt(n) group operations with small memory;
      BSGS at 2 sqrt(n) time and sqrt(n) memory; batch rho at Theta(sqrt(Mn)) for M
      targets; generic preprocessing at S T^2 = Theta(n). For the SUPERSINGULAR
      comparison row, Delfs-Galbraith at p^{1/2} polylog and the exemplar at
      p^{1/3+o(1)}.
    hidden_overhead: >-
      Every n^{o(1)} in the law is SUPERPOLYNOMIAL - it carries rho(u)^{-1}, the
      number of prime factors, and in row R2 the ineffective constant of Siegel's
      bound. The law therefore cannot produce a concrete-cost table at cryptographic
      n for any ECDLP row, and does not pretend to; the exemplar's row can, because
      the paper computes one, and the difference is disclosed.
    tradeoff_note: >-
      Within the class there is no useful time-memory tradeoff, by (A) - shrinking
      the table shrinks X, which shrinks the reachable Y faster than it shrinks the
      cost. The van Oorschot-Wiener interpolation applies to the JOIN only and moves
      no exponent. Parallelisation of table construction is perfect; the join is the
      limit. This is stated as a property of the class, which is itself part of the
      deliverable.

  dominated_by: >-
    n/a as an attack (no algorithm is proposed here), and the frontier was
    nevertheless walked row by row for the ATTACK CLASS the record characterises.
    (1) Parallel rho with distinguished points and negation - dominates every member
    of the class on memory and on the constant, ties on the time exponent. (2) BSGS -
    ties on both exponents, wins on the constant. (3) Automorphism-discounted rho -
    dominates by sqrt(|Aut|). (4) Batch rho at Theta(sqrt(Mn)) - dominates for M > 1
    since no member of the class amortises over targets. (5) Generic preprocessing at
    S T^2 = Theta(n) - wins on online time, ties or loses on total charged cost, see
    IDEA-20260904-ca8865. (6) Pohlig-Hellman - not comparable, n prime. (7) Small
    embedding degree and anomalous transfers - dominate where applicable and are
    excluded here by the curve exclusion rule. (8) Prime-field index calculus - at or
    above n^{1/2} in this corpus, so it neither dominates nor is dominated. DATA AND
    QUERY AXIS - no oracle queries, no auxiliary inputs, so nothing is gained or lost
    there. AS A CONCEPTUAL CONTRIBUTION the nearest incumbents are IDEA-20260802-003
    and IDEA-20260805-44bc0b, each of which dominates on the specificity of its own
    family and is dominated here on generality.
  sota_delta: >-
    +0 on time, +0 on memory, +0 on data or queries - no attack is claimed. The
    quantitative deltas actually claimed are (i) ONE formula replacing at least four
    separately derived "pinned at 1/2" results in this corpus, with the exemplar's
