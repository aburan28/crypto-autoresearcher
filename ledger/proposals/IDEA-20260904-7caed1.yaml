idea:
  id: IDEA-20260904-7caed1
  question_id: RQ-ECDLP-002
  handoff_id: TASK-20260904-300a32
  goal_id: null
  added: '2026-09-04'

  title: >-
    THE Y_min VERSUS Y_gen CRITERION - every smoothness-splitting
    meet-in-the-middle attack, in every setting, costs A((B*Y_min)^{1/2}) divided
    by its success probability, where A is the arrow-counting function and Y_min is
    a RIGOROUS bound on the true object's norm; the birthday bound is the slice
    Y_min = Y_gen defined by A(Y_gen) = Omega, so an exponent gain requires exactly
    one thing - a THEOREM saying the true object is smaller than pigeonhole
    predicts. The exemplar's p^{1/3} is the slice Y_min = p^{1/3} << Y_gen = p^{1/2},
    prime-field ECDLP is the slice where Minkowski is tight, and WHETHER IT IS TIGHT
    ON CURVE-DEFINED COSETS IS A MEASUREMENT NOBODY HAS MADE

  class: mechanism

  claim: >-
    (A) THE LAW, STATED ONCE AND THEN APPLIED. Let a search problem be presented as
    a composition structure - a set of ARROWS with an associative composition, a
    MULTIPLICATIVE norm N taking positive integer values, a counting function
    A(X) = #{arrows of norm at most X out of a fixed source}, and a MEETING SPACE of
    size Omega in which the two halves of a meet-in-the-middle are compared. Let the
    solution be an arrow phi with N(phi) = Y. Then the smoothness-splitting
    meet-in-the-middle of the exemplar has, verbatim,
      per-attempt table size and time   T = A( (B*Y)^{1/2} ) * (1 + o(1)),
      per-attempt success probability   P = Pr[N(phi) is B-smooth AND the balanced
                                              prefix is a legal arrow],
      total expected cost               T / P,
    because the largest prefix of a B-smooth factorisation of Y that stays below
    X = (B Y)^{1/2} leaves a cofactor of norm at most B*Y/X = X. That inequality is
    the entire mechanical content of the method and it is setting-independent.

    (B) THE PIGEONHOLE VALUE, WHICH IS WHAT RHO IS. Define Y_gen by A(Y_gen) = Omega
    - the norm budget at which the arrows out of one source first fill the meeting
    space, so that a solution is guaranteed to exist by counting alone. Substituting
    Y = Y_gen into (A) gives T = A((B Y_gen)^{1/2}), and whenever A is a power
    A(X) = c X^{theta} this equals c^{1/2} B^{theta/2} Omega^{1/2} - THE BIRTHDAY
    BOUND, for every theta and every c. **Smoothness splitting reproduces the square
    root of the meeting space exactly, and never improves on it, when the only bound
    available on the true object is the counting bound.**

    (C) THEREFORE THE ENTIRE GAIN OF THE EXEMPLAR IS ONE EXTERNAL THEOREM. Wesolowski
    takes Omega = the number of supersingular curves, of order p, and A(X) =
    Theta(X^2) for cyclic isogenies of degree at most X, so Y_gen = p^{1/2} and the
    pigeonhole cost is p^{1/2} - the Delfs-Galbraith exponent. The gain comes from
    Theorem 1.5, the Aubry-Oyono-Vincent bound that an isogeny E -> E^{(p)} of degree
    at most (p/2)^{1/3} ALWAYS EXISTS, i.e. Y_min = p^{1/3} which is p^{-1/6} times
    the pigeonhole value; substituting Y_min for Y_gen in (A) gives
    T = A((B p^{1/3})^{1/2}) = B p^{1/3}, and the published exponent falls out with
    no further idea. THE GAIN FACTOR IS EXACTLY (Y_gen/Y_min)^{theta/2} = p^{1/6}.
    This record asserts that identity as the correct reading of the exemplar and
    submits it to the reproduction check below.

    (D) THE APPLICATION TO PRIME-FIELD ECDLP, WHICH IS THE POINT. For every
    composition structure this corpus has attached to a prime-field ECDLP instance,
    compute (A, Omega, Y_gen, Y_min) and read off the exponent. Six rows, derived at
    zero compute -
      R1 rational integers under multiplication - A(X) = 2 X^{1/2}, Omega = n,
         Y_gen = n^2/4, Y_min = n^2/4 (the coset of k in Z modulo n has minimum
         about n/2, norm about n^2/4). Ratio 1. Cost n^{1/2}.
      R2 auxiliary imaginary quadratic order R_d - A(X) = (pi/sqrt d) X, Omega = n,
         Y_gen = n sqrt(d), Y_min = n sqrt(d) by Minkowski AND by the Gaussian
         heuristic. Ratio 1. Cost n^{1/2}, and then the class-number charge of
         IDEA-20260904-982159 on top.
      R3 ideals of the curve's own CM order acting on the isogeny class - A(X) =
         Theta(X), Omega = h(O) = p^{1/2+o(1)} curves times n points, Y_gen and
         Y_min both of order n sqrt(|D|). Ratio 1. Cost n^{3/4}.
      R4 endomorphisms of E acting on G as scalars - the same lattice as R2 with d
         forced to |D|/4 of order p. Ratio 1. Cost n^{1/2}.
      R5 isogenies within the F_p-isogeny class as arrows on POINTS - the norm is
         the degree, but the meeting space is the pair (curve, point) and the ECDLP
         is invariant along every arrow by Tate's theorem, so the solution arrow has
         Y = 1 and the structure is degenerate - no search at all, and no
         information. Ratio undefined; the row is EMPTY and the reason is named.
      R6 additive splittings k = a + b (the plain meet-in-the-middle) - the norm is
         not multiplicative, so the method does not apply at all; this is the row
         that explains why every additive record in this corpus is
         counting-blocked.
    EVERY NON-EMPTY ROW HAS RATIO EXACTLY 1, AND THAT IS THE FINDING - for prime-field
    ECDLP the pigeonhole bound is the ONLY bound anyone has, and Minkowski is tight
    for a generic coset. The corpus has no theorem of the Aubry-Oyono-Vincent kind
    and, before this record, had no statement of what such a theorem would have to
    say.

    (E) THE ONE PLACE THE RATIO COULD FAIL TO BE 1, AND IT IS MEASURABLE. The
    ECDLP-defined coset of R2 is NOT a random coset - it is cut out by delta, a
    square root of -d modulo the order of a specific elliptic curve. If, for reasons
    nobody has looked for, curve-defined cosets have systematically SMALLER minima
    than random cosets - Y_min = Y_gen * n^{-c} for some c > 0 - then by (A) the cost
    falls to n^{1/2 - c/2} and the exponent moves. That is a one-line consequence of
    the law and it turns an unbounded search for "a new structural ingredient" into a
    single, cheap, well-posed measurement over a two-parameter family. THE
    MEASUREMENT HAS BOTH OUTCOMES - ratio 1 closes the family with a named
    obstruction and a number; ratio below 1 is a rigorous-bound-beats-pigeonhole
    result of exactly the shape the exemplar needed.

    (F) WHAT THIS RECORD IS NOT. It is NOT a proof that no ECDLP algorithm beats
    n^{1/2}. The law quantifies over SMOOTHNESS-SPLITTING MEET-IN-THE-MIDDLE
    algorithms over a multiplicative composition structure, and says nothing about
    index calculus, transfers, preprocessing, quantum algorithms, or any method
    outside that class. The forward guidance names those classes explicitly.

  mechanism: >-
    THE TRACKED OBJECT of this record is not an ECDLP object at all - it is the
    four-tuple (A, Omega, Y_gen, Y_min) of an attack family, i.e. the record tracks
    ATTACK FAMILIES through a map that forgets everything except the counting
    function, the meeting space and the two norm bounds. That map is LOSSY in the
    strong sense - two attacks with the same tuple can differ in every algorithmic
    detail - and it is COMPATIBLE with the operation that matters, namely
    specialising a family to a parameter slice, because each of the four coordinates
    specialises independently. So the tuple propagates deterministically along
    specialisation, which is exactly what makes the baseline reproduction check of
    (C) a real check rather than a curve-fit.

    WHY THE LAW HAS THE FORM IT HAS. Two independent facts multiply. First, the
    SPLIT INEQUALITY - a B-smooth integer Y factors as a prefix at most X times a
    cofactor at most B Y / X, and setting X = (B Y)^{1/2} balances them; this is the
    exemplar's Lemma 3.4 argument with the letters changed, and it is the only place
    B enters. Second, the TABLE COUNT - the number of arrows of norm at most X is
    A(X) by definition, and each costs O(1) evaluations plus one stored entry. The
    assembly is per-attempt cost times inverse success probability with no third
    ingredient, which is why the law is short and why any attack claiming a gain must
    point at exactly one of the four coordinates.

    THE DERIVATION OF (B) IN FULL, BECAUSE IT IS THE LOAD-BEARING LINE. With
    A(X) = c X^{theta} and Y = Y_gen defined by c Y_gen^{theta} = Omega, we get
    T = c ((B Y_gen)^{1/2})^{theta} = c B^{theta/2} Y_gen^{theta/2}
      = c B^{theta/2} (Omega/c)^{1/2} = c^{1/2} B^{theta/2} Omega^{1/2}.
    The exponent of Omega is 1/2 identically in theta, in c and in B. That is the
    birthday bound, and it is why the method cannot be improved by choosing a
    "better" composition structure - only by shrinking Y.

    STAGE 0 (ZERO COMPUTE, HARD GATE, AND THE RECORD'S PRIMARY DELIVERABLE). Write
    (A) and (B) with the split inequality proved rather than asserted, and run the
    baseline reproduction of (C) SYMBOLICALLY against the exemplar's own published
    numbers - if substituting (A(X) = X^2, Omega = p, Y_min = (p/2)^{1/3}) does not
    return p^{1/3+o(1)} for the time and p^{1/3+o(1)} for the memory, the law is
    wrong and the record stops.
    STAGE 1 (ZERO COMPUTE). Fill the six rows of (D), each with its counting
    function derived and its Y_min justified by a NAMED bound, and mark every row
    whose Y_min rests on a heuristic rather than a theorem.
    STAGE 2 (CHEAP NUMERIC). The measurement of (E) - see minimal_test.
    STAGE 3 (ZERO COMPUTE). The forward-guidance table - for each class of ECDLP
    algorithm outside the law's scope, state in one line why the law does not reach
    it, so the closure is bounded rather than global.

  novelty_status: unverified

  novelty_screen:
    method: >-
      crypto-kb retrieval is EMPTY in this environment and was not called; its
      silence is not read as novelty. Screening by (i) the 255-title ECDLP dedup
      digest read in full, (ii) PD-1 greps over ledger/proposals for 'Wesolowski',
      'smoothness split', 'meet-in-the-middle', 'Brauer-Siegel', 'class number',
      'birthday', (iii) full reads of IDEA-20260901-b4e6eb and H-ECDLP-a4be60,
      (iv) partial read of IDEA-20260829-056e9d, (v) full read of
      docs/target-result-profile.md Part A, from which the exemplar's parameters are
      taken.
    results: >-
      The corpus contains many statements of the form "this family is pinned at
      1/2" - IDEA-20260802-003 for enumerate-and-join, IDEA-20260807-0afbab and
      IDEA-ISO-f9b2d3 for within-class isogeny transfer, IDEA-20260829-b5a2c8 for
      the m=2 Semaev floor, IDEA-20260808-24c61b for the representation technique.
      Each is derived separately, in its own notation, for its own family. NO record
      states a SINGLE criterion generating all of them, none reproduces the
      exemplar's exponent as a parameter slice of its own law, and none names
      "a rigorous bound beating the pigeonhole bound" as the one missing ingredient.
      IDEA-20260805-44bc0b is the nearest in spirit - it reduces a bounded-degree
      no-go to a single scalar chi and notes that NFS and Gaudry-Diem both sit at
      chi = 1 exactly - but its scalar is a coverage exponent for factor bases, not
      a norm-bound ratio, and it does not touch meet-in-the-middle.
    verdict: >-
      UNVERIFIED. The law is derived in-repo this session from the exemplar's own
      lemma structure as transcribed in docs/target-result-profile.md, and the
      exemplar's numerical parameters are second-hand from that document rather than
      read from the paper. The two external facts the row table leans on
      (Aubry-Oyono-Vincent, Brauer-Siegel) are `recalled`. Under AGENTS.md rule 9 no
      recalled citation may support `known` or `adaptation`, so `unverified` is the
      only honest label even though the author's own reading is that this is a
      REORGANISATION of known material rather than a new theorem, and that its value
      is generative rather than mathematical. THE ACT THAT WOULD LICENSE A HIGHER
      LABEL - open the exemplar's frozen full text and the Aubry-Oyono-Vincent
      source, and record the verification.

