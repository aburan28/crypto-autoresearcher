  assumptions:
    - >-
      The law is stated for composition structures with an ASSOCIATIVE composition
      and a MULTIPLICATIVE positive-integer norm. Structures without a multiplicative
      norm (row R6) are outside it and the record says so rather than forcing them in.
    - >-
      A(X) is assumed to be regularly varying (a power times a slowly varying factor)
      over the range used. Every row in the table satisfies this by direct
      computation; a structure whose counting function is not regularly varying needs
      the law restated and that is disclosed.
    - >-
      B = n^{o(1)} throughout, so that smoothness probabilities and the number of
      prime factors are both n^{o(1)}. All hidden overheads are superpolynomial and
      are disclosed rather than absorbed.
    - >-
      Public constructions and self-generated toy instances only. No live key,
      wallet, or deployed system is involved.

  proof_search_map:
    bottleneck: >-
      Not the law, which is two lines, but the value of Y_min in row R2 - whether
      the minimum of a CURVE-DEFINED coset matches the minimum of a random coset.
      Every exponent in the table is a corollary of that one number, and it is the
      only number in the record that is neither proved nor cited.
    baseline_embedding:
      parameter_slice: >-
        The exemplar itself, at (A(X) = Theta(X^2), Omega = Theta(p),
        Y_min = (p/2)^{1/3}, B = exp((1/3) sqrt(log(p/2)))). The law must return
        T = p^{1/3+o(1)} for BOTH time and memory, and must return T = p^{1/2+o(1)}
        when Y_min is replaced by the pigeonhole value Y_gen = p^{1/2}, reproducing
        Delfs-Galbraith.
      reproduction_check: >-
        SYMBOLIC, and frozen as a fixture - substitute the slice into
        T = A((B Y)^{1/2}) and check the two exponents by hand and by a five-line
        symbolic script, then check that the ratio of the two answers is exactly
        p^{1/6}, which is the paper's own gain. A law that only "looks like" the
        exemplar's curve is not an embedding; the check is an identity or it fails.
        SECOND FIXTURE - the plain multiplicative meet-in-the-middle over Z/n
        (row R1) must return n^{1/2} exactly.
    observation_collision:
      observable: >-
        The four-tuple (A, Omega, Y_gen, Y_min) and the exponent it predicts.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED - rows R2 and R4 have DIFFERENT lattices
        (an auxiliary order with free d, and the curve's own CM order with d of order
        p) and identical predicted exponent n^{1/2}. Two structurally distinct
        objects with the same observable. The collision is not a falsifier here
        because the observable is a COST and the two really do cost the same, but it
        pins what the law can and cannot see - it cannot distinguish attacks that
        differ only in constants or in implementation, and the record must not be
        used to argue that two such attacks are the same attack. THE COLLISION THAT
        WOULD BE FATAL - a published attack whose true exponent differs from the one
        the law predicts for its tuple. The record's own Stage 1 must hunt for one
        among the corpus's recorded families, and finding one falsifies the law.
    constructive_transforms:
      - transform: baseline_lift
        proposed_object: >-
          Enlarge the certificate family from "one attack, one exponent" to "one
          four-tuple, one exponent", so that the exemplar's result and the birthday
          bound become two points of a single curve rather than two unrelated facts,
          and prove the strict inward improvement (the gain factor
          (Y_gen/Y_min)^{theta/2}) rather than mere feasibility.
        predicted_gain: >-
          Zero attack gain. The gain is that the search for an ECDLP exponent
          reduces to the search for ONE inequality, Y_min << Y_gen, over a finite,
          writable list of composition structures.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the predicted exponent 1/2) fixed and vary the
          forgotten structure (the lattice rank, the covolume, the class number, the
          object count). If the exponent is genuinely independent of all of them,
          the pigeonhole identity of (B) is the load-bearing fact; if some structure
          moves it, that structure is the escape and the law has located it.
        predicted_gain: >-
          Turns "is prime-field ECDLP saturated" into a one-dimensional question with
          a computable answer per row.
    quantifier_order: >-
      FOR ALL composition structures satisfying the assumptions, FOR ALL B, IF the
      solution arrow has norm at most Y and its norm is B-smooth with a legal
      balanced prefix, THEN the meet-in-the-middle of Algorithm (A) succeeds at cost
      A((BY)^{1/2}). The witness (the split point X) depends on (B, Y) and NOT on the
      instance. THE CONVERSE IS NOT CLAIMED - the law does not say that no algorithm
      outside this class beats A((B Y_gen)^{1/2}), and every use of it must carry the
      restriction to the class.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most - "within the class of smoothness-splitting meet-in-the-middle
        algorithms over a multiplicative composition structure, the exponent is
        determined by the tuple, equals 1/2 in the meeting-space size whenever
        Y_min = Y_gen, and every composition structure this corpus has attached to a
        prime-field ECDLP instance has Y_min = Y_gen up to constants". It can NEVER
        certify a lower bound on the ECDLP, it says nothing about index calculus or
        transfers, and its ECDLP rows are only as strong as the Y_min entries, one
        of which (R2) is a heuristic until measured.
      nearby_object_control: >-
        The nearby object where the desired conclusion (exponent 1/2) FAILS is the
        exemplar's own setting, which the law must and does predict at 1/3. A
        criterion that returned 1/2 there would be worthless, and the reproduction
        check is precisely the test that it does not. The second nearby object is
        the DLP in F_p^*, where index calculus reaches L(1/3) - a method OUTSIDE the
        law's class, included in Stage 3's forward-guidance table specifically to
        mark the boundary of what the law covers.
    proof_obligations:
      - claim: >-
          The split inequality - a B-smooth Y has a prefix at most X = (BY)^{1/2} with
          cofactor at most X.
        responsibility: correctness
      - claim: >-
          T = A((BY)^{1/2}) counts exactly the table entries built and probed.
        responsibility: size
      - claim: >-
          With A(X) = c X^{theta} and A(Y_gen) = Omega, T = c^{1/2} B^{theta/2} Omega^{1/2}.
        responsibility: strictness
      - claim: >-
          The exemplar's slice returns p^{1/3+o(1)} and the pigeonhole slice returns
          p^{1/2+o(1)}.
        responsibility: baseline
      - claim: >-
          Each of the six ECDLP rows has the stated A, Omega and Y_gen by direct
          computation.
        responsibility: size
      - claim: >-
          Row R5 is empty because the ECDLP is invariant along F_p-isogenies
          (Tate), so the solution arrow carries no information.
        responsibility: scope
      - claim: >-
          Every row whose Y_min rests on a heuristic rather than a theorem is marked
          as such in the delivered table.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The four-tuple (arrow-counting function, meeting-space size, pigeonhole norm
      bound, rigorous norm bound) of an attack family, followed through
      specialisation to parameter slices.
    lossiness: >-
      Strongly lossy - the fibre over one tuple contains attacks that differ in every
      implementation detail, in the field, in the algebra and in the certificate. The
      discard is compatible with the operation the record uses (specialisation),
      because each coordinate specialises independently, so the tuple propagates
      deterministically. It is NOT a change of coordinates - one cannot reconstruct
      an attack from its tuple, which is exactly why the reproduction check is
      informative and why the observation collision between rows R2 and R4 is real.
    propagation: >-
      Deterministic under specialisation and under composition of the underlying
      structure. It does NOT propagate under any operation on ECDLP instances, and
      the record makes no claim there - this object lives one level up, on attack
      families rather than on group elements, which is why the rigidity theorem of
      IDEA-20260807-df906f does not apply to it and must not be cited against it.
    survival_score: >-
      Survives to the exemplar and back - the same tuple predicts p^{1/3} in the
      supersingular setting and n^{1/2} in the prime-field setting. The structure
      dissolves at the boundary of the class - the moment the norm stops being
      multiplicative (row R6) or the composition stops being associative, the tuple
      is undefined, and that boundary is where the forward guidance points.

  null_object_control: >-
    NULL-1, THE SHUFFLED TUPLE (blocking). Apply the law to a tuple assembled by
    randomly permuting the four coordinates across the six ECDLP rows. If the
    resulting exponents are still all 1/2, the law is not sensitive to its inputs and
    the agreement across rows carries no information - it would mean the record has
    discovered only that 1/2 is what the arithmetic of its own denominators produces.
    THIS IS THE CANONICAL ARTIFACT TELL of docs/inventor-protocol.md section 3 and it
    is BLOCKING.
    NULL-2, THE RANDOM-COSET NULL for the (E) measurement (blocking). Minima of
    uniformly random cosets of the same lattices, on the identical estimator; the
    curve-defined minima are claimed to be indistinguishable from these.
    NULL-3, THE SHAM STRUCTURE (blocking). A composition structure with no curve and
    no arithmetic behind it - the free multiplicative monoid on the primes up to B,
    with a random surjection onto Z/n. The law predicts n^{1/2} there too; if the
    measured behaviour of the ECDLP rows differs from the sham, the record's own
    claim that "the curve enters nowhere" is false and must be revisited.
    COMPARATOR 1 (blocking) - parallel Pollard rho with distinguished points and the
    negation map, run on the same instances and charged in the same units, whose
    measured exponent must be 1/2 or the instrument is not measuring an exponent.
    COMPARATOR 2 (blocking) - BSGS on the same instances, memory reported.
    POSITIVE CONTROL (blocking) - a synthetic composition structure with a PLANTED
    Y_min = Y_gen * n^{-1/4}, built by construction so that the true object is
    artificially small. The measured cost must fall to n^{3/8} exactly as the law
    predicts. A pipeline that cannot see a planted exponent gain of known size cannot
    be trusted to report its absence.

  predictions:
    - metric: >-
        P1 - the ratio, per ECDLP row, of the exponent predicted by the law to the
        exponent recorded in the corpus for that family
      direction: different
      minimum_effect: >-
        Exact agreement (ratio 1.00) on at least four of the six rows records the law
        as validated against the corpus. A single row where the law predicts an
        exponent DIFFERENT from a committed measured or derived exponent in the
        ledger falsifies the law and is reported as such - that is a decision, not an
        estimate.
    - metric: >-
        P2 - the exemplar reproduction, i.e. the exponent the law returns on the
        supersingular slice
      direction: different
      minimum_effect: >-
        Exactly 1/3 for time and 1/3 for memory, and exactly 1/2 when Y_min is
        replaced by Y_gen. Any other value means the law is not the exemplar's law
        and the record stops at zero compute.
    - metric: >-
        P3 - the measured ratio Y_min(curve-defined coset) / Y_min(random coset),
        median over 10^4 samples per cell, on a ladder of six prime orders spanning a
        100x range and five values of d
      direction: different
      minimum_effect: >-
        PRE-REGISTERED TWO-BRANCH RULE. A median ratio in [0.8, 1.25] at every cell,
        with a two-sample Kolmogorov-Smirnov p-value above 0.01, records the CLOSURE
        branch - Minkowski is tight on curve-defined cosets in the tested scope and
        every ECDLP row of the table stands. A median ratio below 0.5, reproduced at
        three or more cells AND decreasing with n, records the LEAD branch and routes
        to independent review before any interpretation. Between is INCONCLUSIVE in
        advance. BASIS - pre-registered tolerances from the sample size and the
        expected spread of the Gaussian-heuristic minimum; NOT measurements.
    - metric: >-
        P4 - the planted-gain positive control's recovered exponent
      direction: lower
      minimum_effect: >-
        3/8 within 0.03. If the planted gain is not recovered the instrument cannot
        see an exponent move of the size the whole record is about and no closure may
        be reported from it.
    - metric: >-
        P5 - the number of composition structures found in the Stage 3 sweep that lie
        OUTSIDE the law's class
      direction: higher
      minimum_effect: >-
        At least three must be named with the reason (index calculus, transfers,
        preprocessing/advice, quantum). A forward-guidance table with fewer than
        three named open classes does not meet the closure standard of
        docs/inventor-protocol.md section 4 and the record may not be filed as a
