  axis: A3
  claim_tier: toy

  title: >-
    WHERE THE CLASS'S ADVICE VALUE ACTUALLY IS, STATED SO IT CAN BE ATTACKED --
    the landmark set extracted from IDEA-20260811-61ecae is, on its own, a
    PREPROCESSING ALGORITHM FOR VECTORIZATION on the Cl(O)-torsor with
    S*T = Otilde(h) unconditionally given rapid mixing (so S = h^{2/3} advice
    buys online h^{1/3} = p^{1/6} against the sqrt(h) = p^{1/4} meet-in-the-middle
    baseline), and the CGK construction transplants to the torsor because the
    group action has exactly the random self-reducibility CGK's algorithm needs,
    predicting S*T^2 = Otilde(h) -- which would put ADVICE-ASSISTED vectorization
    at p^{1/6} online with p^{1/6} advice; the record's ECDLP content is the
    negative half and it is the load-bearing half: a class-level resource yields
    a class-level result and NOTHING transfers to k, because every member of the
    class carries the SAME k by T1, so the class carries zero mutual information
    about it

  class: algorithm

  claim: >-
    (A) THE PROBLEM, WHICH IS NOT ECDLP AND IS LABELLED AS SUCH ON EVERY LINE.
    VECTORIZATION WITH PREPROCESSING, VEC-P(p, t): the offline phase sees (p, t),
    hence the whole class C (a Cl(O)-torsor of size h, D fundamental) and emits S
    bits of advice; the online phase is given a uniformly random E in C and must
    output the ideal class a with E = [a] E_0 for a fixed public E_0. This is the
    group-action discrete-logarithm problem (the CSIDH-style problem) with
    non-uniform advice. It is a CLASS-LEVEL problem: its instance is a curve, and
    its answer is an element of Cl(O).

    (B) THE UNCONDITIONAL CONSTRUCTION, WHICH IS ELEMENTARY AND IS THE HALF THIS
    RECORD IS WILLING TO DEFEND. [open], but the argument is three lines.
      OFFLINE: perform L independent random walks of length O(log p) from E_0 in
        the Cayley graph on the small split primes, storing
        { (j(E_i), w_i) : i = 1..L } where w_i is the walk word, hence
        the address of E_i. Cost L*Otilde(log p) bits of advice.
      ONLINE: on challenge E, walk forward, testing the hash set at each step.
        On a hit at E_i via walk word u, output a = address(E_i) * u^{-1}.
      COST: expected T = Theta(h/L) steps by the hitting-time law (HA-1 of
      IDEA-20260811-61ecae, reused verbatim), so
          S * T = Otilde(h).
      OPERATING POINTS: L = h^{2/3} gives T = h^{1/3}; with h = p^{1/2+o(1)} that
      is S = p^{1/3+o(1)} advice and T = p^{1/6+o(1)} online steps, against the
      no-advice baseline of sqrt(h) = p^{1/4+o(1)} by meet-in-the-middle /
      claw-finding (T5, and a127ab's H1). ANY L > sqrt(h) beats the baseline in
      online time; L = sqrt(h) reproduces it exactly, which is the baseline
      embedding.

    (C) THE CONDITIONAL EXTENSION, LABELLED [open] AND NOT USED ANYWHERE ELSE IN
    THIS BATCH. Corrigan-Gibbs--Kogan's matching algorithm for DL-with-advice
    needs, of the group, only (i) RANDOM SELF-REDUCIBILITY of the instance and
    (ii) a membership test against a stored set. A group action supplies both:
    given challenge E, the shifted instance [b]E for a known b is a fresh instance
    whose answer determines the original's (a = answer * b^{-1}), which is exactly
    the k -> k + r self-reduction CGK uses. IF the CGK algorithm transplants under
    that correspondence, the achievable tradeoff for VEC-P is
        S * T^2 = Otilde(h),
    i.e. S = T = h^{1/3} = p^{1/6+o(1)}. THIS IS A CONJECTURE ABOUT A TRANSPLANT,
    NOT A THEOREM, and the record's first deliverable is to determine whether it
    is (i) already published, (ii) provable, or (iii) blocked by a specific
    feature of actions that groups do not have -- the obvious candidate blocker
    being that a torsor has no distinguished element and no notion of "small
    exponent", so any step of CGK's algorithm that uses the INTEGER structure of
    Z_N rather than the group structure will not transfer. Naming that candidate
    blocker in advance is what makes this a proposal rather than a wish.

    (D) THE ECDLP CONSEQUENCE, WHICH IS EXACTLY ZERO, AND WHY THAT IS THE POINT.
    Suppose VEC-P is solved at any (S, T). Feed it a challenge curve E; obtain its
    address a. What does a tell you about k in Q = [k]P on E? NOTHING, and this is
    not a heuristic: by T1 every member of the class carries the SAME k under
    transport, so the map (instance -> class position) is constant on the fibres
    that k varies over. Formally, for a fixed class C the random variables
    "position of E in the torsor" and "k" are independent by construction, because
    the transported instance on [a]E_0 has the same k for every a. THE MUTUAL
    INFORMATION IS ZERO. Class-level advice answers class-level questions. The
    campaign's L13 lane has been asking whether a class-level resource can pay for
    a point-level answer, and this record is the sharpest statement of why it
    cannot: the resource and the answer live on different fibres of the same
    fibration, and advice does not move between them.

    (E) THE HONEST STATUS OF (B) AS A CRYPTOGRAPHIC CLAIM. (B) is a statement
    about the security of group-action cryptography with non-uniform adversaries.
    It is not an attack on any deployed ECC curve and this batch may not and does
    not make an attack claim. It IS a candidate that appears to beat a standard
    baseline for a DIFFERENT problem, so it is flagged to the Coordinator for
    independent review before any promotion (see pause_flags). The most likely
    outcome, stated in advance, is that it is known: preprocessing/advice
    tradeoffs for group actions are an obvious question and the construction is
    the first thing anyone would try. If it is known, the record's value is the
    citation plus part (D); if it is not, part (B) is a small but genuine result
    about a central post-quantum assumption and belongs in a different goal.

  resource_label: >-
    R4 (the isogeny graph / class-group action) and R8 (preprocessing structure).
    NO NEW TAXONOMY ENTRY NEEDED, but the record forces a clarification the
    taxonomy does not currently make: R4 is listed as escaping the GGM because it
    "acts on curves, not on points", and this record shows that sentence has a
    second edge -- a resource that acts on curves can only be cashed out in a
    problem whose ANSWER is a curve-level object. That is a strengthening of the
    taxonomy's own justification, offered as forward guidance rather than as an
    edit.

  admissibility: >-
    admissible_as_a_class_level_result_and_inadmissible_as_an_ecdlp_mechanism

  admissibility_argument: >-
    Part (D) is the admissibility argument, and it is stronger than the standing
    filter. The filter closes a lane whose only use of phi is to apply it to
    points of G. This record does not apply phi to points of G AT ALL in the
    construction of (B) -- the walk moves curves and stores j-invariants, and no
    point is transported anywhere. That is precisely why it escapes the filter,
    and precisely why it produces nothing about k: the whole computation is
    orthogonal to the ECDLP instance. The record is filed under GOAL-ENDO-001
    because the lane's question is "does the class as one object buy anything",
    and the honest answer -- "yes, for questions about the class; provably nothing
    for questions about k" -- is a deliverable of that lane, not of another.

  object_first_candidate:
    tracked_object: >-
      THE TORSOR ADDRESS, as in IDEA-20260811-61ecae, but here it is the OUTPUT
      rather than an intermediate: the object being tracked is the thing being
      solved for.
    lossiness: >-
      Same projection as 61ecae and it passes the same test: the address discards
      the curve equation, the points, the models, and retains one element of a
      group of size h. Genuinely lossy, propagates deterministically under
      ell-isogeny steps.
    propagation: >-
      Forward-cheap, inverse-hard -- and THIS RECORD IS ABOUT THE INVERSE, which
      is the one place in this batch where the hard direction is the deliverable
      rather than an obstacle. The lossy-projection test is satisfied for the same
      reason as in 61ecae; what differs is that the projection's fibre (all curves
      with a given address -- a single curve) is trivial here, so the address
      determines the curve within the class and inverting it is the whole problem.
    survival_score: >-
      Survives every horizontal isogeny; dies at non-fundamental D (volcano
      levels), at a change of base field, and at any question about points.

  mechanism: >-
    A torsor of size h with a cheap forward action and an expensive inverse is
    exactly the shape for which stored landmarks are the natural advice: advice
    buys a set of known-address points, and online time buys a walk long enough to
    hit one. The tradeoff S*T = h is the covering identity for a rapid mixer and
    nothing more. The question of whether S*T^2 = h is reachable is the question
    of whether the action's random self-reducibility can be used to make each
    online step count twice, which is what CGK's construction does for DL. The
    mechanism for the ECDLP null result is a fibration argument: transport is a
    bijection on instances that fixes k, so k is a function on the base and the
    class is the fibre; advice about the fibre is orthogonal to the base.

  why_not_a_renamed_known_approach: >-
    (1) Meet-in-the-middle / claw-finding for vectorization at sqrt(h) (T5,
      a127ab H1) is the no-advice baseline and is reproduced exactly at
      L = sqrt(h); the record is a strict extension of it into the advice
      dimension, with the baseline as a boundary case.
    (2) Kuperberg / Regev quantum subexponential vectorization is a different
      model and is not compared; nothing here is quantum and nothing here claims
      anything about quantum adversaries.
    (3) Hellman/Oechslin tables invert a random function; here the object is a
      transitive group action with a mixing guarantee, and the online phase is a
      walk with a hitting-time bound rather than a chain reconstruction. The
      analogy is close enough that prior art is likely and is declared so.
    (4) IDEA-20260801-007 (GOAL-SSI-001) measures the vOW collision surface for
      the CSIDH action at toy scale. That is a measurement of the NO-ADVICE
      baseline's concrete constant; this is a construction in the ADVICE model.
      They are complementary and 007's measurement is the right calibration for
      this record's baseline arm.

  predictions:
    - observable: online steps to vectorize with L landmarks
      metric: >-
        measured mean number of ell-isogeny steps to recover the address of a
        uniformly random challenge, in a fully enumerated toy class, as L sweeps
        over {1, h^{1/3}, h^{1/2}, h^{2/3}, h}
      direction: lower
      minimum_effect: >-
        Predicted Theta(h/L), so the measured curve must have slope -1 in
        log-log against L over at least a decade. Slope materially above -1 (say
        > -0.8) falsifies the covering identity at that scale and kills the
        S*T = h claim as stated.
    - observable: baseline embedding
      metric: >-
        measured online cost at L = sqrt(h) against the measured no-advice
        claw-finding cost on the same class and the same code path
      direction: different
      minimum_effect: >-
        The two must agree within a small constant. If landmarks at L = sqrt(h)
        are materially CHEAPER than claw-finding, the claw-finding arm is
        implemented badly and every comparison is void; if materially more
        expensive, the walk is not mixing and HA-1 fails here as well.
    - observable: transfer of the address to k
      metric: >-
        mutual information between the recovered address and the planted k,
        estimated over many random instances at fixed class
      direction: different
      minimum_effect: >-
        EXACTLY ZERO, and this is a derivation rather than a measurement: any
        nonzero estimate is estimator bias and must be reported as the instrument's
        noise floor, which is precisely what makes it a useful calibration of every
        other information-theoretic estimate in this campaign.
    - observable: the CGK transplant
      metric: >-
        whether a written-out transplant of the CGK algorithm to a torsor uses any
        step requiring the integer structure of Z_N
      direction: different
      minimum_effect: >-
        Binary and decisive on paper. If it does, S*T^2 = h is blocked and the
        record's conditional half is withdrawn, leaving (B) and (D). If it does
        not, the transplant is a theorem to write.

  minimal_test:
    design: >-
      STAGE 0 -- ZERO COMPUTE, AND IT IS THE CHEAPEST KILLER. Write out the CGK
      algorithm step by step and mark every step that uses the integer structure
      of the exponent group rather than the group structure. One marked step that
      cannot be re-expressed for a torsor withdraws claim (C) immediately. This is
      an afternoon with a paper and no machine.
      STAGE 0b -- ZERO COMPUTE, EQUALLY CHEAP AND HIGHER VALUE. A literature
      check for "time-space tradeoff / preprocessing / non-uniform security for
      cryptographic group actions". If part (B) is published, the record collapses
      to a citation plus part (D), which is still worth having and is the expected
      outcome.
      STAGE 1 -- MINUTES. On one fully enumerated toy class with D fundamental at
      p ~ 2^16 and again at 2^20: measure the L-sweep of prediction 1, with the
      claw-finding baseline arm on the same graph and the same step counter.
      STAGE 2 -- ZERO COMPUTE. The crypto-scale table for CSIDH-512-like
      parameters, reporting S in bits and T in isogeny steps at
      L in {h^{1/3}, h^{1/2}, h^{2/3}}, with the per-step constant taken from the
      Stage 1 counter and the extrapolation stated.
    controls:
      - >-
        NULL OBJECT: the same L-sweep on a random 2k-regular graph on h vertices
        (must agree, since the claim is a covering identity that does not depend
        on arithmetic) and on a cycle of length h (must disagree, since a cycle
        has no gap). Same two-arm structure as IDEA-20260811-61ecae, deliberately
        so that one instrument serves both records.
      - >-
        BASELINE ARM: no-advice claw-finding on the identical graph, identical
        counter. Without it, "beats sqrt(h)" is a comparison between a measured
        number and a remembered one, which is not a comparison.
      - >-
        PLANTED ARM: a landmark placed at a known distance d from the challenge;
        measured cost must be <= d.
      - >-
        NULL FOR PART (D): resample k with the curve and the class fixed -- the
        canonical artifact control from lane L7 -- and confirm that every
        address-derived statistic is unchanged. Any statistic that moves is
        reading the instance, not the class, and is an implementation leak.
    required_metrics:
      - mean online steps vs L, log-log slope with CI, per graph arm
      - claw-finding baseline cost on the same graph
      - measured h and the empirical hitting-time CDF
      - the marked-step list from Stage 0
      - field operations per isogeny step from an explicit counter

  controls:
    - Random-regular-graph null and cycle negative control (shared instrument with IDEA-20260811-61ecae).
    - No-advice claw-finding baseline arm on the identical graph and counter.
    - Planted-landmark positive control.
    - Resample-k-with-curve-fixed null for the part (D) independence statement.

  confounders:
    - >-
      THE BASELINE IS EASY TO UNDERSTATE. sqrt(h) claw-finding has a well-known
      constant and a memory requirement of its own; comparing an advice scheme
      against a naive sqrt(h) implementation manufactures a win. The baseline arm
      must be the best available implementation on the same graph, and its memory
      must be reported next to S.
    - >-
      ADVICE VERSUS PRECOMPUTED-TABLE CONFLATION. In the vOW world a "table" is
      built and used within one attack and is charged; in the advice world it is
      free and unbounded. A reader who reads S as attack-time work will conclude
      the scheme is worse than the baseline; a reader who reads the baseline's
      memory as free will conclude the opposite. Both conventions must be printed
      side by side, exactly as a127ab's H2 requires for the ECDLP side.
    - >-
      TOY h IS TINY, so an L-sweep at p = 2^16 spans little and the log-log slope
      has few degrees of freedom. The claim is asymptotic; the measurement tests
      the covering law only.
    - >-
      MEMORY ACCESS IS NOT CHARGED HERE. h/L probes into an L-entry table are free
      in the RAM model only; see IDEA-20260811-735c6b.
    - >-
      NON-FUNDAMENTAL D fragments the torsor and the whole construction is scoped
      away from it.

  falsification_conditions:
    - >-
      The Stage 0 marking finds a CGK step that requires integer structure -- part
      (C) is withdrawn. Expected with probability around 0.5 and it costs nothing
      to find out.
    - >-
      Part (B) is published -- the record becomes a citation plus part (D). This
      is the single most likely outcome and it is not a failure.
    - >-
      The L-sweep does not show slope -1 while the random-regular null does. HA-1
      fails on class graphs at the tested scale and the construction's cost model
      is wrong.
    - >-
      Someone exhibits a class-level statistic with nonzero mutual information
      with k at fixed class. Then part (D) is false, which would be the most
      important event in this campaign and would have to be replicated
      independently before any interpretation. The record predicts it will not
      happen and says why (T1 fixes k across the fibre).
    - >-
      The claw-finding baseline arm beats the L = h^{2/3} landmark arm at equal
      charged memory. Then the advice model's accounting is doing all the work and
      the record's "beats the baseline" is a convention artifact, which must be
      reported as such.

  interpretation_limits:
    - >-
      NOT AN ECDLP RESULT, AND PART (D) PROVES IT CANNOT BECOME ONE. Nothing here
      changes any ECDLP cost by any amount. sota_delta against ECDLP is exactly
      zero.
    - >-
      Part (B) is a statement in the NON-UNIFORM / advice model. It says nothing
      about a uniform attacker and does not by itself change any parameter
      recommendation for any deployed group-action scheme; that would require the
      advice to be producible, which is a bounded-preprocessing question this
      record does not answer (see IDEA-20260811-735c6b).
    - >-
      Part (C) is a conjecture about a transplant and is labelled [open]
      throughout. It must not be cited as a result.
    - >-
      Scope: ordinary F_p classes with D fundamental, classical adversaries,
      RAM model, toy-scale measurement only.
    - >-
      P2: not adjacent (no factor base anywhere).
    - >-
      P3: DOES NOT FIRE AS WRITTEN -- P3 is defined against the
      automorphism-discounted rho baseline for ECDLP, and this record makes no
      ECDLP claim of any kind. But its part (B) DOES appear to beat a standard
      baseline for a different problem, so it is flagged under pause_flags below
      for the same reason P3 exists.

  pause_flags:
    p2_adjacent: false
    p3_fires: false
    coordinator_flag: >-
      FLAGGED FOR INDEPENDENT REVIEW BEFORE ANY PROMOTION, BY ANALOGY WITH P3 AND
      NOT UNDER IT. Part (B) appears to beat the sqrt(h) meet-in-the-middle
      baseline for the group-action DLP in the advice model. That is a different
      problem with a different baseline, so P3's letter does not apply, but its
      spirit does: a candidate that appears to beat a standard baseline should be
      read by a session that did not write it before it is repeated anywhere. The
      record deliberately states the construction and its exponents (which P3
      would forbid for the rho baseline) because without them there is no claim to
      review; it states no ECDLP excess anywhere. If the Coordinator judges this
      the wrong call, the correct remedy is to supersede this record, not to amend
      it.

  assumptions:
    - Ordinary E/F_p, D = t^2 - 4p fundamental, C a Cl(O)-torsor of size h.
    - HA-1 of IDEA-20260811-61ecae (mixing and the Theta(1/d) hitting law), reused verbatim and not re-derived.
    - HA-2 of IDEA-20260811-61ecae (h = N^{1/2+o(1)}, with Siegel's ineffectivity disclosed).
    - >-
      T5's statement that specified-curve transport is the vectorization problem
      at ~sqrt(h) classically, taken as the baseline to be compared against
      (DECOMPOSITION.md section 3; cited there, not proved).
    - >-
      CGK's algorithm structure as relayed by KN-LIT-013 and KN-TECH-005. The
      corpus entry records that the full paper was NOT read, so part (C)'s premise
      about which primitives that algorithm needs is itself unverified and is the
      first thing Stage 0 must check.
    - >-
      WEB VERIFICATION UNAVAILABLE THIS SESSION (backend model error on every
      WebSearch and WebFetch call). No external source was checked. For THIS
      record that limitation is maximal, because part (B) is exactly the kind of
      construction most likely to be published already.

  heuristic_assumptions:
    - id: HB-1
      statement: >-
        The expected number of ell-isogeny steps for a walk started at a
        uniformly random member of C to first meet a uniformly chosen landmark set
        of size L is Theta(h/L), uniformly for 1 <= L <= h.
      rigorous_support: >-
        Identical to HA-1 of IDEA-20260811-61ecae: rigorous given a spectral gap
        bounded away from zero, with the gap itself GRH-conditional via T5.
        Restated here rather than cross-referenced only, because this record's
        central cost is exactly this quantity and a reader must not have to
        reconstruct it.
      distribution_imitated: >-
        Geometric first-entry law for i.i.d. uniform sampling into a density-d
        set -- the same idealisation the campaign's birthday and claw bounds use.
      validation_plan: >-
        SAMPLE: fully enumerated ordinary classes at p in {2^16, 2^20, 2^24},
        L swept over five values spanning h^{1/3} to h. SHORTCUT: exact mean
        hitting times by a linear solve on the transition matrix, reported
        alongside the sampled means, so the check is a comparison of two computed
        numbers and not a fit. COMPARISON: geometric(L/h) empirical CDF, KS
        statistic. TAIL CHECK: 99th percentile against (h/L)*ln(100). MATCHED
        NULLS: random regular graph (agree) and cycle (disagree). TRANSFER: none
        claimed to CSIDH-sized parameters; the Stage 2 table is an extrapolation
        and is labelled one.
    - id: HB-2
      statement: >-
        The Corrigan-Gibbs--Kogan matching algorithm for DL with preprocessing
        uses, of the underlying group, only random self-reducibility of the
        instance and membership testing against a stored set, and therefore
        transplants to any transitive group action with the same two properties,
        yielding S*T^2 = Otilde(h) for VEC-P.
      rigorous_support: >-
        NONE YET, AND THIS IS THE RECORD'S WEAKEST LINK, DECLARED. The premise
        about which primitives CGK's algorithm needs is relayed from a corpus
        entry that states the full paper was not read. The classical pattern it
        imitates is the standard transfer of Hellman-style tradeoffs across
        problems that share a self-reduction. A named candidate blocker is
        recorded in claim (C): a torsor has no distinguished element and no
        "small exponent" notion, so any CGK step using the integer structure of
        Z_N will not transfer.
      distribution_imitated: >-
        Not a distributional assumption; it is a structural transfer assumption
        and is listed as a numbered heuristic because it carries an exponent.
      validation_plan: >-
        NO SAMPLING. The validation route is a READ: obtain the CGK paper, mark
        every step of its algorithm as group-structural or integer-structural, and
        decide the transplant on paper. Cost: one reading session, zero compute.
        This is a case where the honest validation plan is not an experiment, and
        saying so is better than inventing a measurement that could not settle it.

  proof_search_map:
    bottleneck: >-
      For part (B): nothing -- it is a covering identity and its only content is
      the hitting-time law. For part (C): the single step of CGK's algorithm (if
      any) that uses the integer structure of the exponent group. Locating that
      step is the whole proof-search problem and it is a paper exercise.
    baseline_embedding:
      parameter_slice: >-
        L = sqrt(h). The scheme must reproduce the classical meet-in-the-middle /
        claw-finding cost sqrt(h) exactly, since T = h/L = sqrt(h).
      reproduction_check: >-
        Symbolic (immediate) plus the measured baseline arm of the minimal test.
        A measured landmark cost at L = sqrt(h) that differs materially from the
        measured claw-finding cost on the same graph indicts one of the two
        implementations, and until that is resolved no L-sweep number means
        anything.
    observation_collision:
      observable: >-
        "Online cost scales as h/L", used as the certificate that the tradeoff is
        S*T = h.
      distinct_preimage_search: >-
        SUCCEEDS, AND THE COLLISION IS INFORMATIVE RATHER THAN FATAL: any
        transitive rapid mixer on h states gives the same observable, so the
        observable certifies the COVERING structure and not anything about
        elliptic curves. That is the correct reading -- part (B) is a statement
        about torsors with cheap forward action, of which the isogeny class is one
        instance. The record must therefore never present the measurement as
        evidence about isogenies specifically, and the random-regular null is what
        keeps that honest.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Re-express "advice for ECDLP over a class" as "advice for the class
          itself", separating the class-level problem (where advice helps) from
          the point-level problem (where it provably cannot).
        predicted_gain: >-
          Moves an exponent for VEC-P (p^{1/4} -> p^{1/6} online at p^{1/3}
          advice, unconditionally; p^{1/6} at p^{1/6} conditionally), and moves
          nothing at all for ECDLP -- which is the separation the whole lane has
          been looking for, found in the place where it is useless for the
          campaign's target and is therefore reported as such.
      - transform: observable_fiber
        proposed_object: >-
          Hold k fixed and vary the class position; hold the class position fixed
          and vary k. The first family is the transport orbit and every member has
          the same k; the second is an ECDLP instance family on one curve. No
          intrinsic invariant separates the first family's members with respect to
          k, which is part (D).
        predicted_gain: >-
          Converts "the class tells you nothing about k" from a slogan into a
          fibration statement with an explicit control (resample k with the curve
          fixed).
    quantifier_order: >-
      PART (B): FORALL p, t with D fundamental, FORALL L, EXISTS advice of
      Otilde(L*log p) bits (depending on (p,t) only) such that FORALL E in C the
      online algorithm returns the address of E in expected Otilde(h/L) steps.
      Note the expectation is over the algorithm's coins only, and holds from
      every start -- not merely for most E.
      PART (C): the same shape with T^2 in place of T, and it is CONJECTURED, so
      the quantifier is written but not asserted.
      PART (D): FORALL classes C, FORALL a in Cl(O), the instance transported to
      [a]E_0 has the same k -- hence the address and k are independent as random
      variables under any distribution that draws them from this construction.
      THE SLIP NOT CLAIMED: "no class-level statistic tells you anything about k"
      in general. What is proved is the statement for statistics of the TRANSPORT
      ORBIT. A statistic that reads the curve equation is outside this argument
      and belongs to lane L1.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Vectorization on a rapidly mixing Cl(O)-torsor of size h admits an
        advice/online tradeoff S*T = Otilde(h), tight against the sqrt(h) baseline
        at S = sqrt(h)"; and "no advice about the class changes any ECDLP cost".
        It can never certify anything about quantum adversaries, about
        non-fundamental discriminants, about supersingular graphs over F_{p^2}
        (whose class structure is different), or about ECDLP.
      nearby_object_control: >-
        THE OBJECT WHERE THE METHOD MUST FAIL: the same-order-different-field
        ensemble of IDEA-20260811-73e9a5. There is no action, no walk, no torsor,
        and the landmark construction has nothing to store. If part (B)'s argument
        appears to apply there, it is not using the action and is void.
    proof_obligations:
      - claim: The recovered word composes to the correct address.
        responsibility: correctness
      - claim: Expected online cost is Theta(h/L).
        responsibility: runtime
      - claim: Advice is Otilde(L log p) bits.
        responsibility: size
      - claim: The scheme reproduces claw-finding at L = sqrt(h).
        responsibility: baseline
      - claim: CGK's algorithm needs only self-reducibility and membership testing.
        responsibility: feasibility
      - claim: Address and k are independent for transport-orbit statistics.
        responsibility: scope
      - claim: The construction fails on the no-action ensemble.
        responsibility: strictness

  reachability_gate: >-
    THIS RECORD IS THE GATE, TURNED INTO THE PROBLEM. T5 says specified-curve
    transport is hard at ~sqrt(h); part (B) says advice makes it easier, at a
    stated price. So the record does not pass or fail the gate -- it PRICES it,
    which is the one thing the campaign has not done. The consequence for every
    other L13 record is worth stating: any lane result whose cost model contains
    a vectorization term (a127ab's H1 above all) can now buy that term down with
    advice, and the correct term is min(sqrt(h), h/L) rather than sqrt(h). For
    IDEA-20260811-61ecae this changes nothing, because that record avoids
    vectorization entirely; for a127ab's adaptive case it is an improvement over
    its own H1 and should be recorded as one.

  target_complexity:
    time_exponent: >-
      VEC-P online T = Otilde(h/S) unconditionally, i.e. p^{1/6+o(1)} at
      S = p^{1/3+o(1)}; conditionally on HB-2, T = Otilde(sqrt(h/S)), i.e.
      p^{1/6+o(1)} at S = p^{1/6+o(1)}. Baseline sqrt(h) = p^{1/4+o(1)}
      (T5). ECDLP time exponent: UNCHANGED AT 1/2, and nothing in this record
      touches it.
    memory_exponent: >-
      Advice S = Otilde(L log p) bits. The unconditional operating point
      L = h^{2/3} is p^{1/3+o(1)} bits, which for CSIDH-512-like parameters is a
      very large table and must be reported as such rather than as an abstract S.
      Online working memory is O(log p) beyond the advice.
    best_known: >-
      Vectorization without advice: sqrt(h) = p^{1/4+o(1)} classically by
      meet-in-the-middle (T5; a127ab H1). With advice: NOTHING KNOWN TO THIS
      SESSION, which is a statement about this session's blocked literature
      access and not about the literature.
      ECDLP: unchanged (rho 0.886*sqrt(N), CGK frontier S*T^2 = N).
    hidden_overhead: >-
      The o(1) hides the GRH mixing constant (found VACUOUS at 2^{256} by this
      program's own JMV004 scouting for small statistical distance), the per-step
      isogeny constant, and Siegel's ineffectivity in h = p^{1/2+o(1)}. Part (C)
      hides, in addition, an entire unverified premise about CGK's algorithm.
    tradeoff_note: >-
      S*T = h is a hyperbola and every point on it is achievable by choosing L;
      the endpoints are L = 1 (T = h, worse than baseline) and L = h (T = O(1),
      advice = the whole class). The baseline sits exactly at the geometric mean.
      Parallelisation is perfect and communication-free for the walk phase.
      Under full cost the h/L probes are charged and the hyperbola bends -- see
      IDEA-20260811-735c6b, which must be applied before any of these numbers is
      quoted as a security statement.

  sota_delta: >-
    AGAINST ECDLP: exactly zero, by part (D), which is a derivation rather than a
    measurement. AGAINST THE NO-ADVICE VECTORIZATION BASELINE: online exponent
    1/4 -> 1/6 in p at advice p^{1/3} (unconditional), and 1/4 -> 1/6 at advice
    p^{1/6} (conditional on HB-2). Stated as exponents because the batch requires
    it, and stated as UNVERIFIED-NOVELTY because the literature could not be
    checked; if the construction is published these deltas are zero as well and
    the record's residue is part (D).
  dominated_by: >-
    AS AN ECDLP ATTACK: dominated by every row of the frontier, since it is not
    one -- parallel rho at 0.886*sqrt(N) with O(1) memory (KN-TECH-001,
    KN-TECH-006); automorphism-discounted rho (KN-TECH-018); BSGS
    sqrt(N)/sqrt(N), full cost N^{2/3+o(1)} (KN-TECH-031, KN-TECH-035);
    Bernstein-Lange/CGK preprocessing on the frontier S*T^2 = N (KN-LIT-013);
    Kuhn-Struik sqrt(M*N) for M targets. Checked across time, memory and
    data/queries; dominated on all three.
    AS A VECTORIZATION RESULT: dominated in the quantum column by Kuperberg-style
    subexponential algorithms, which beat every operating point here; dominated at
    S <= sqrt(h) by plain claw-finding; and possibly dominated by published work
    this session could not reach, which is the honest reason novelty_status is
    unverified rather than speculative.

  estimated_cost:
