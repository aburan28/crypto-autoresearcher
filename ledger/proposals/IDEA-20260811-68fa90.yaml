      medium, and SHARED with IDEA-20260811-61ecae -- the same class enumerator,
      the same Cayley graph, the same landmark machinery, the same counter. The
      only additional component is the claw-finding baseline arm.
    compute: low. Stages 0, 0b and 2 are zero compute; Stage 1 is minutes to an hour.
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.95 that part (B) is mathematically correct as stated (it is a covering
    identity plus a mixing assumption already used in this corpus). 0.25 that
    part (B) is NOT already published in some form -- landmark/advice tradeoffs
    for group actions are the obvious first question and the session could not
    check. 0.45 that part (C)'s transplant survives the Stage 0 marking. 0.98 that
    part (D) survives review, since it is a two-line consequence of T1. 0.00 that
    anything here changes an ECDLP cost, which the record asserts rather than
    hopes. Ranked MEDIUM rather than high: the ECDLP half is a clean negative that
    the campaign should have written down long ago, and the vectorization half is
    probably known and belongs, if it is not, under a different goal.

