      with B for the ideal-theoretic interface: with d_solve >= B the Macaulay column count
      is at least C(B+m,m) ~ B^m/m!, so theta_alg >= m and, at omega > 1, theta_alg >= m omega
      - far above E2-02''s threshold (m-1)/2 at every m.'
    memory_exponent: At least the column count, i.e. B^m, for any dense graded solve.
    best_known_baseline: Enumeration at B^{m-1} 2^{m-1} and MITM at B^{ceil(m/2)} both DOMINATE
      the ideal-theoretic interface under this floor, at every m >= 2.
    hidden_overhead_disclosure: The floor is a statement about degrees, not about the constant
      in front; a solver could still be practically better at small B, and nothing here contradicts
      that.
    time_memory_tradeoff: Not applicable - the record removes a family from contention rather
      than positioning it.
