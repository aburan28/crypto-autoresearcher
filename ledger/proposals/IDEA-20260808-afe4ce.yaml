  question_id: RQ-SDEG-001
  goal_id: GOAL-SDEG-001
  title: The prime-field mirror of the last-fall-degree theorem is a FLOOR, not a ceiling
    - for any factor base described set-theoretically, d_lf is bounded BELOW by the minimal
    degree of a nonzero polynomial vanishing on V, so the binary/prime contrast is a statement
    about description degree and can be written as a theorem instead of an intuition
  class: mechanism
  claim: 'Let V subset F_p, |V| = B, and let J = I(V) subset F_p[x] be its vanishing ideal,
    generated by f_V of degree exactly B. Consider I_R = < S_{m+1}(x_1..x_m, x_R) > + sum_i
    J(x_i). CLAIM (floor): every element of I_R of degree < B in the variable x_i is a multiple
    of the Semaev generator alone, because J contributes nothing below degree B - so no degree
    fall involving membership can occur below degree B, and the last fall degree satisfies
    d_lf(I_R) >= B whenever the decomposition condition is not implied by S_{m+1} alone (which
    it is not, since S_{m+1} = 0 has p^{m-1} solutions and only about B^m/p of them are decompositions).
    CONSEQUENCE: the published Weil-descent result "last fall degree bounded independently
    of n" (KN-LIT-7605/7607) has NO prime-field analogue for a set-theoretically described
    factor base, and the reason is exactly one number - membership degree 2 over GF(2) after
    descent versus degree B over F_p. The contrast is therefore not "prime fields are mysteriously
    harder"; it is a degree floor, and its escapes are enumerable: (E1) descriptions that
    are not principal in F_p[x] - i.e. V realised as a projection from a higher-dimensional
    variety of low degree, which is precisely what Weil descent achieves and what F_p lacks
    a mechanism for; (E2) target-dependent descriptions; (E3) solvers that do not build the
    ideal at all.'
  mechanism: 'Bezout on the x-line already gives IDEA-20260801-021''s B_p <= 3 d_p: a degree-d
    predicate cuts the projective cubic in at most 3d points, so a base of size B needs description
    degree >= B/3. That bounds the DESCRIPTION. The floor above bounds the SOLVING degree,
    which is strictly stronger and closes the escape the Bezout record leaves open - namely
    that degree falls might let a solver reach the answer far below the description degree.
    They cannot, because the membership generators are literally absent from every graded
    piece below their own degree. The whole prime-field algebraic obstruction is that one
    sentence, and it explains, without any new mathematics, why the entire binary-field last-fall-degree
    literature fails to transfer, and why E2-01''s semi-regular slope m/2 in B is not a pathology
    of the null but a shadow of the same floor.'
  why_not_a_renamed_known_approach: Nearest in-corpus record is IDEA-20260801-021's Bezout
    bound (description degree) and KN-OPEN-020 (universal algebraic-factor-base no-go). This
    record is about a different quantity - the last fall degree / solving degree, not the
    description degree - and it makes the binary/prime contrast a corollary rather than an
    observation. Nearest external is the Huang-Kosters-Yeo last-fall-degree machinery, which
    is stated as an UPPER bound for descended systems; a lower bound in the opposite field
    is not a renaming of it.
  predictions:
  - observable: minimal degree of a nonzero element of I_R that is not a multiple of S_{m+1}
    metric: degree, computed by exact graded linear algebra
    predicted: Exactly B at every cell (p in {1009, 4099}, B in {5,6,8,10}, m in {2,3}). A
      value below B falsifies the floor and would be the single most important negative in
      this slice.
  - observable: measured d_solve versus B
    metric: ratio d_solve / B
    predicted: Bounded away from 0 - specifically >= 1 if the floor holds and the decomposition
      condition is not implied by Semaev alone. Compare against the boolean Weil-descent arm
      where the same ratio (d_solve / membership degree) grows without bound because the membership
      degree is 2.
  - observable: the same measurement with V chosen as a MULTIPLICATIVE COSET
    metric: minimal non-Semaev element degree
    predicted: Still exactly B (the binomial x^B - c is still degree B), which shows the floor
      is insensitive to how nice f_V is and is a property of |V| alone. This is the control
      that separates "degree floor" from "generic f_V is nasty".
  minimal_test: 'Exact graded linear algebra at small cells. For each (p, B, m): construct
    the graded pieces of I_R degree by degree, quotient by the ideal generated by S_{m+1}
    alone, and record the first degree at which the quotient is nonzero. Cells: p in {1009,
    4099}, B in {5,6,8,10}, m in {2,3}, V random and V a multiplicative coset, >= 3 seeds.
    Everything is exact GF(p) rank on matrices of a few thousand columns.'
  controls:
  - SEMAEV-ONLY ARM (the quotient's denominator) must be computed and reported; if the decomposition
    condition WERE implied by S_{m+1} alone the whole claim is vacuous and this arm detects
    it.
  - MULTIPLICATIVE-COSET ARM as above, separating |V| from the shape of f_V.
  - BOOLEAN CONTRAST ARM at membership degree 2, where the floor must be 2 and therefore invisible
    - the positive control showing the instrument can see a low floor when one exists.
  - DEGENERATE-V ARM: V containing a root of f (so a factor-base point is 2-torsion) must
      be flagged and excluded, not silently averaged.
  confounders:
  - The floor argument assumes J is generated in degree B, true for a set-theoretic V but
    false if V is defined by additional structure in an extension ring; escape (E1) is exactly
    this and is not refuted here.
  - Elements of I_R of low degree can exist that are multiples of S_{m+1} times low-degree
    cofactors; the quotient handles this and the implementation must be checked against a
    planted example.
  - Small B makes B comparable to deg S_{m+1} = 2^{m-1}, where the floor is masked; the ladder
    must reach B > 2^{m-1}.
  falsification_conditions:
  - A nonzero non-Semaev element of degree < B is found at any cell. The floor is false as
    stated and must be restated with whatever hypothesis it needs.
  - The boolean contrast arm also shows a floor at B rather than at 2. The instrument is measuring
    something other than membership degree.
  - The decomposition condition turns out to be implied by S_{m+1} alone at some cell (impossible
    for B < p but worth the check at tiny p).
  interpretation_limits: Scoped to set-theoretically described factor bases over prime fields
    and to ideal-theoretic solvers. It is a lower bound on ONE interface and closes nothing
    universally; KN-OPEN-020's universal statement stays open, and the three escapes are named
    rather than dismissed. Toy tier for the measured arm; the argument itself is field-size
    independent but is a derivation, not a reviewed theorem.
  assumptions:
  - V squarefree, 0 not in V, char p > 3, E non-singular.
  - Exact arithmetic; no CAS termination heuristics.
  heuristic_assumptions:
  - id: HA-1
    statement: The decomposition condition on V^m is not implied by S_{m+1} = 0 alone; equivalently
      the Zariski closure of the decomposition locus is a proper subvariety of {S_{m+1} =
      0}.
    rigorous_ingredient: 'Rigorous by counting for B < p: {S_{m+1}=0} has about p^{m-1} points
      and the decomposition locus has about B^m/p; these differ for any B with B^m < p^m,
      i.e. always.'
    distribution_imitated: None; a counting statement, listed because it is the hypothesis
      the floor needs.
    validation_route: Direct point counts at tiny p (p <= 101) by exhaustive enumeration.
      TOY SCALE.
    tail_checks: Report the cell with the smallest gap between the two counts; if any cell
      has them equal the hypothesis fails there.
  target_complexity:
