idea:
  id: IDEA-20260807-6eb96b
  question_id: RQ-ICINV-475b5e
  added: '2026-08-07'
  title: >-
    THE CONTROL THIS LANE CANNOT BE RUN WITHOUT: the matched null for a
    within-class variance measurement is the GAUGE ORBIT of one curve -- the
    (p-1)/2 Weierstrass equations of a single fixed j -- not a random curve at
    the same p, because a coordinate-defined factor base is not an isomorphism
    invariant, and every candidate functional in L1 therefore already varies
    with p, N, t, j and End(E) ALL held fixed
  class: control

  claim: >-
    (A) THE DEFECT IN THE OBVIOUS DESIGN. RQ-ICINV-475b5e and DECOMPOSITION.md
    L1 prescribe comparing within-class variance against between-class variance
    and against "a matched random-curve null of the same p". That null differs
    from the real arm in THREE ways at once -- it changes the trace t, it
    changes j, and it changes the Weierstrass equation -- so a difference
    between the arms cannot be attributed to any one of them. The within-class
    arm itself changes TWO things: j, and the equation, because a class member
    is delivered as a pair (a, b) and there are (p-1)/2 pairs per isomorphism
    class.

    (B) THE FACT THAT MAKES THIS BINDING, NOT PEDANTIC. Let
    E: y^2 = x^3 + a x + b and E_u: y^2 = x^3 + u^4 a x + u^6 b for u in F_p^*.
    E and E_u are F_p-isomorphic via (x, y) -> (u^2 x, u^3 y). They have
    IDENTICAL p, t, N, #E(F_p), group structure, j, End(E), volcano level,
    embedding degree, class number, automorphism group -- every invariant that
    T4 of DECOMPOSITION.md lists as fixed by the class AND every invariant T4
    lists as varying within it, except the equation itself. And yet:
        X_{E_u} = u^2 . X_E,   where X_E = {x in F_p : x^3 + a x + b is a square}
    is the set of x-coordinates of rational points. So a factor base defined by
    a COORDINATE window (x < W, the definition used by H-PSEUDO-83817b and by
    the program's index-calculus records) has a different membership on E_u than
    on E. The gauge action is a DILATION of the factor-base geometry by a
    square. Every functional in L1 that reads coordinates -- yield at a window,
    solving degree with a window factor base, factor-base geometry, first-fall
    degree, decomposition probability -- therefore has NON-ZERO variance with
    the entire class-level structure held fixed.

    (C) THE CONSEQUENCE, WHICH IS THE PROPOSAL. Within-class variance is
    INTERPRETABLE ONLY AS AN EXCESS OVER GAUGE VARIANCE. The correct design is a
    three-arm variance decomposition at matched B and matched target:
      ARM G (gauge): one fixed class member, >= 8 gauge representatives u.
        Varies: the equation. Fixed: everything else.
      ARM C (class): one gauge representative per class member, all members of
        one complete class. Varies: j and the equation. Fixed: p, t, N.
      ARM R (random): random curves at the same p. Varies: t, j, equation.
    The class signal is Var(C) - Var(G), not Var(C). If Var(C) <= Var(G) the
    isogeny-class axis carries no information for that functional AT THE
    MEASURED RESOLUTION, whatever Var(R) says.

    (D) WHY ARM G IS A VALID NULL AND NOT A MODE-1 NULL FOR THE FUNCTIONALS
    THAT MATTER. Per KN-TECH-1a5b7e obligation 3, a null must be able to fail.
    Arm G can: dilating X_E by u^2 genuinely changes |X_E cap [0, W)| and
    genuinely changes which factor-base points exist. THE ONE EXCEPTION IS
    NAMED HERE RATHER THAN DISCOVERED LATER: any functional invariant under
    dilation of F_p -- additive energy of X_E, the multiset of Fourier
    magnitudes {|1_hat_{X_E}(c)| : c != 0}, the number of roots of f in F_p --
    has EXACTLY ZERO gauge variance by algebra, so arm G is a mode-1 null for
    those and must be replaced (see IDEA-20260807-692e9b, which owns that case).
    The instrument therefore ships with a per-functional admissibility table,
    computed by algebra before any run, saying whether arm G can fail for it.

    (E) TWO-DIRECTIONAL INSTRUMENT CONTROL, per completion criterion C4 of
    GOAL-ENDO-001. The instrument must (i) REJECT a matched null -- report no
    class signal when the "class" is a set of gauge representatives of one
    curve, mislabelled as a class -- and (ii) DETECT A PLANTED SIGNAL -- report
    a class signal when one arm's factor base is deliberately corrupted by a
    known amount. Both directions run before any real measurement.

  resource_label: >-
    audit: consumes no resource. This is an instrument and a null-object
    specification; it mounts nothing and reads no oracle. It CONSTRAINS the
    interpretation of R1/R2/R4 measurements made by every other proposal in L1.
  admissibility: admissible
  admissibility_argument: >-
    Vacuously admissible: an instrument that performs no attack cannot fail the
    resource filter. It is nevertheless subject to the filter's logic in one
    direction -- if a functional turns out to be computable from group
    operations alone, its measurement is GGM-simulable and closed at exponent
    1/2 by KN-FIND-b7e091 regardless of what this instrument reports, and the
    per-functional table in (D) records that check alongside the dilation check.

  discriminated_from:
    - >-
      RQ-INSTR-f8faa0 / L14, which owns instrumentation, null objects and
      certificates for the whole campaign. This record does not restate that
      lane: it supplies the ONE null object that is specific to L1's question
      and that a generic instrument lane would not invent, because it depends on
      the algebraic fact in (B) about the (p-1)/2 equations of a fixed curve.
      L14 owns planting and certificate machinery; this record owns the gauge
      orbit and the three-arm decomposition.
    - >-
      KN-TECH-1a5b7e (null sufficiency). That entry is the METHOD this record
      applies; the record adds the domain-specific content the method demands --
      the named object removed (the equation), the derived forced values, and
      the per-functional table of which nulls are mode-1 for which statistics.
    - >-
      The quadratic twist. E and its twist share j but have traces t and -t, so
      the twist is in a DIFFERENT class. That makes the twist an excellent
      BETWEEN-class control at fixed j -- it is the only way to change t while
      holding j and the equation shape fixed -- and this record includes it as
      arm T, but it is NOT the gauge null and must not be substituted for it.

  object_first_candidate:
    tracked_object: >-
      THE GAUGE ORBIT of a curve: the set {(u^4 a, u^6 b) : u in F_p^*} of
      Weierstrass equations presenting one fixed F_p-isomorphism class, followed
      through the identical measurement pipeline used for the real arm.
    lossiness: >-
      The orbit forgets nothing about the curve -- that is precisely its value
      as a null. Read as a projection of "the data available to an algorithm",
      it is LOSSY in the other direction: it retains the equation and discards
      the isomorphism, i.e. it is the fibre of the forgetful map
      {equations} -> {curves up to isomorphism}. LOSSY-PROJECTION TEST APPLIED:
      the tracked object here is deliberately NOT a new attack object; it is the
      fibre of an existing projection, and the record says so rather than
      dressing a change of coordinates as a new invariant. Its novelty is
      methodological, not algebraic.
    propagation: >-
      Deterministic and exact: the orbit is a torsor under F_p^*/{+-1} and every
      coordinate quantity propagates by dilation by u^2. This is what makes the
      forced values in (D) DERIVABLE rather than measurable.
    survival_score: >-
      Survives every change of functional, every p, every class. Dies for any
      functional that is dilation-invariant (named in (D)), and dies for any
      functional defined intrinsically rather than through coordinates -- for
      those the gauge variance is zero and a different null is required.

  mechanism: >-
    STEP 1 -- THE ADMISSIBILITY TABLE, ZERO COMPUTE, RUN FIRST. For each of the
    lane's candidate functionals, decide by algebra whether the gauge orbit can
    move it: does the functional depend on X_E only through a dilation-invariant
    quantity? Produce a table with three columns: functional; gauge-variance
    forced value (zero / non-zero); admissible null if gauge is forced to zero.
    Predicted entries: window yield -- non-zero, gauge admissible; window
    solving degree -- non-zero, gauge admissible; additive energy of X_E -- ZERO,
    gauge INADMISSIBLE; Fourier ell-infinity of X_E -- ZERO, gauge INADMISSIBLE;
    number of roots of f -- ZERO, gauge INADMISSIBLE; H-PSEUDO constant at a
    window -- non-zero, gauge admissible.

    STEP 2 -- FORCED VALUES BEFORE MEASUREMENT (KN-TECH-1a5b7e obligation 4).
    For window yield: the gauge arm resamples |X_E cap [0,W)| by dilating a
    fixed set of density about 1/2; modelling the dilated intersection as a
    binomial(W, 1/2) gives a forced gauge standard deviation of sqrt(W)/2, and
    the derivation is recorded BEFORE the run so that observing sqrt(W)/2 is a
    passed control rather than a discovery. The class arm's forced value under
    the no-class-structure hypothesis is the SAME sqrt(W)/2. The measurement is
    therefore about the DIFFERENCE, and the design states in advance that the
    difference is what is read.

    STEP 3 -- COMPARATOR REPLICATION (KN-TECH-1a5b7e mode 5). The gauge arm is a
    GENERATED comparator, so it needs a sample size: >= 8 draws of u per class
    member, and the arm is reported as an INTERVAL, never as a point. The rule's
    own false-positive rate is derived before the run: with an n-draw min/max
    tolerance interval, leave-one-out application to the arm's own members
    returns OUTSIDE for exactly 2 of n, i.e. 2/n, and that number is quoted
    beside every OUTSIDE verdict.

    STEP 4 -- THE FOUR ARMS, one pipeline, one seed discipline. Arm G (gauge,
    >= 8 u per member); arm C (class, every member of a complete toy class at
    one gauge representative each); arm T (quadratic twist of every member --
    a complete DIFFERENT class at matched j-set); arm R (random curves at the
    same p, >= 30). Every arm uses the identical measurement code path, the
    identical B, and a TRANSPORTED target with a re-verified certificate.

    STEP 5 -- THE TWO-DIRECTIONAL CONTROL, blocking.
      (5a) REJECT A MATCHED NULL: feed the pipeline a fake "class" consisting of
        8 gauge representatives of one curve, labelled as class members. The
        decision rule must return NO CLASS SIGNAL. If it returns a signal, the
        rule fires on its own null and discriminates nothing (KN-TECH-1a5b7e
        mode 4); measurement stops under GOAL-ENDO-001 pause condition P1.
      (5b) DETECT A PLANTED SIGNAL, GRADED. Corrupt one arm's factor base by
        deleting a fraction s of its elements, for s in {0, 0.02, 0.05, 0.10,
        0.20}. The rule must return NULL at s = 0 and a signal at s = 0.20, AND
        the statistic must be checked for MONOTONICITY across the three interior
        points -- exhibiting two ends does not exhibit a direction, which is the
        refinement KN-TECH-1a5b7e adds. The smallest s the instrument resolves
        is its stated detection floor and every negative result in L1 is scoped
        by it.

    STEP 6 -- THE DECISION RULE, frozen before the run, with an explicit
    NEITHER branch. Outcomes: (i) CLASS-INVARIANT: Var(C) <= Var(G) within the
    gauge interval; (ii) CLASS-STRUCTURED: Var(C) exceeds the gauge interval's
    upper end by more than the detection floor; (iii) INSTRUMENT-LIMITED: the
    gauge interval is wider than |Var(C) - Var(G)|, i.e. mode 5 -- the honest
    reading is that the residual is unresolved in either direction, and the
    declared action is to increase the number of u draws before reading
    anything. Branch (iii) is the one a two-branch rule would silently
    misreport, and it is expected to fire at small class sizes.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep tool, 2026-08-07, over ledger/: pattern
      "isomorphism class|quadratic twist|u\\^4|weighted.homogeneous|gauge"
      (case-insensitive). Grep over the repository for "isogeny class". Targeted
      reads of DECOMPOSITION.md T4, RQ-ICINV-475b5e, RQ-INSTR-f8faa0,
      KN-TECH-1a5b7e, H-PSEUDO-83817b.
    results: >-
      24 occurrences over 13 ledger files. Every hit is either "quadratic twist"
      in a curve-hygiene or twist-security context (KN-TECH-034 lineage) or
      "isomorphism class" used descriptively. ZERO records use the gauge orbit
      as a NULL OBJECT; zero records state that a coordinate-defined factor base
      fails to be an isomorphism invariant; DECOMPOSITION.md T4's list of what
      varies within a class does not include the equation-choice fibre, and
      RQ-ICINV-475b5e prescribes the random-curve null this record argues is
      insufficient.
    verdict: >-
      ADAPTATION. The algebra in (B) is elementary and standard. The application
      -- as the MANDATORY matched null for this campaign's gating measurement,
      with derived forced values and a per-functional mode-1 admissibility table
      -- is new to this program and, on the corpus evidence above, is not
      recorded anywhere in it. No external novelty is claimed.

  null_object_control: >-
    THIS RECORD IS THE NULL OBJECT CONTROL FOR THE LANE, so its own null is the
    two-directional control in Step 5. MATCHED NULL FOR THE INSTRUMENT ITSELF:
    a fake class built from gauge representatives of one curve (5a) -- the
    instrument must find nothing there. DECAY PARAMETER: the number of gauge
    draws n. As n grows the gauge comparator interval must NARROW like n^{-1/2}
    in its standard error while its min/max tolerance interval WIDENS; a
    reported class excess that does not shrink relative to a narrowing gauge
    interval as n grows is the artifact tell. SECOND DECAY PARAMETER: B. Both
    the gauge and class relative spreads must decay as B^{-1/2} or faster for a
    density-type functional; a spread that is flat in B is measuring the
    apparatus.

  assumptions:
    - >-
      [fact] E and E_u are F_p-isomorphic and X_{E_u} = u^2 X_E. Immediate from
      the isomorphism (x, y) -> (u^2 x, u^3 y). Re-verified in Step 1 by direct
      computation on >= 100 curves.
    - >-
      [fact] For j not in {0, 1728} the map u -> (u^4 a, u^6 b) has kernel
      {+-1}, so the gauge orbit has (p-1)/2 elements; at j = 0 and j = 1728 the
      larger automorphism group shrinks the orbit, so those curves need a
      separate orbit-size computation and must not be pooled.
    - >-
      [scope] Toy scale, p <= 2^16, claim_tier toy. The instrument's detection
      floor is measured, not assumed, and every L1 negative inherits it.
    - >-
      [open] Whether the binomial(W, 1/2) model for |X_E cap [0,W)| under
      dilation is accurate enough to serve as the forced value, or whether the
      Weil correlation between dilates inflates it. Step 2 measures this rather
      than assuming it, and a measured inflation factor is itself reportable.

  proof_search_map:
    not_applicable_reason: >-
      Purely an instrument and null-object specification. It proves no theorem,
      claims no bound, and constructs no certificate family. Its two derived
      quantities -- the forced gauge standard deviation sqrt(W)/2 and the 2/n
      false-positive rate of a min/max tolerance rule -- are pre-registration
      arithmetic, not proof obligations, and both are stated in Steps 2 and 3
      with their assumptions attached. The one algebraic fact it relies on
      (X_{E_u} = u^2 X_E) is one line and is re-verified computationally.

  predictions:
    - metric: >-
        relative standard deviation of window-factor-base yield across the gauge
        arm (arm G), at fixed class member, fixed W, fixed transported target
      direction: higher
      minimum_effect: >-
        STRICTLY POSITIVE and consistent with the forced value sqrt(W)/2 within
        a factor of 2. A gauge spread of ZERO would falsify (B) and invalidate
        every gauge-null design in this lane. This is the sensitivity
        demonstration: the null provably moves.
    - metric: >-
        Var(arm C) - Var(arm G) at matched B, matched target, matched functional
      direction: different
      minimum_effect: >-
        PRE-REGISTERED PREDICTION: the difference is consistent with zero within
        the replicated gauge interval, i.e. the class axis carries no signal
        above equation choice. Declaring this prediction now means a match is a
        confirmed control rather than a disappointment, and a mismatch above the
        measured detection floor is a genuine target for the campaign.
    - metric: >-
        instrument detection floor: the smallest planted corruption fraction s
        at which the frozen rule returns a signal, and the monotonicity of the
        statistic across s in {0, 0.02, 0.05, 0.10, 0.20}
      direction: lower
      minimum_effect: >-
        The floor must be <= 0.10 for the instrument to be useful at class sizes
        of a few tens, and the statistic must be monotone across the interior
        points. A non-monotone statistic means the rule's label cannot be read
        directionally, and that must be printed beside every verdict.
    - metric: >-
        Var(arm T, quadratic twists) versus Var(arm C)
      direction: different
      minimum_effect: >-
        Arm T changes t and is a genuinely different class at the same j-set; if
        Var(T within its own class) matches Var(C) and the two class MEANS
        differ by the amount predicted from the t-dependence of the functional,
        the instrument is calibrated on the one axis where a real difference is
        known to exist.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): the admissibility table of Step 1 and the forced
      values of Step 2, both written down before any code runs.
      STAGE 1 (minutes, HARD GATE): verify X_{E_u} = u^2 X_E computationally on
      >= 100 curves at p = 4001, and verify the gauge orbit size is (p-1)/2 for
      j not in {0, 1728}.
      STAGE 2 (minutes, HARD GATE, run BEFORE the real arm): the fake-class
      rejection control (5a). The rule must return NO SIGNAL on 8 gauge
      representatives mislabelled as a class.
      STAGE 3 (~1 hour): the graded planted-signal control (5b) with >= 3
      interior points and an explicit monotonicity report.
      STAGE 4 (hours): the four-arm decomposition on >= 3 complete toy classes
      at p in [2^12, 2^14], for at least the window-yield functional, with >= 8
      gauge draws per member and the gauge arm reported as an interval.
      STAGE 5 (zero compute): apply the frozen rule; report branch (i), (ii) or
      (iii) with the derived 2/n false-positive rate beside it.
      Stages 0-2 cost under an hour and can already invalidate the instrument.
    controls:
      - fake class of gauge representatives (must return no signal) -- BLOCKING
      - graded planted corruption with >= 3 interior points and a monotonicity check
      - quadratic-twist arm (a real between-class difference at matched j)
      - random-curve arm at the same p
      - transport certificate on every transported target
      - '>= 8 draws of the generated comparator, reported as an interval'
    required_metrics:
      - per-arm mean, standard deviation, min and max of every functional
      - the gauge comparator interval and its number of draws n
      - the derived 2/n false-positive rate of the min/max rule
      - the measured detection floor s and the monotonicity verdict
      - the frozen rule's branch, and its verdict ON THE NULL ARM, reported first
      - the per-functional gauge-admissibility table with its forced values

  falsification_conditions:
    - >-
      Gauge variance measures ZERO for window yield. Then (B) is wrong, the
      isomorphism does not act on the factor base as claimed, and this record is
      superseded -- and so is the gauge-null design in IDEA-20260807-0ff796.
    - >-
      The rule fires on the fake-class null (5a). The instrument discriminates
      nothing; measurement halts under P1 and no L1 negative may cite it.
    - >-
      The planted-signal control fails at s = 0.20, or the statistic is
      non-monotone across the interior points. In the first case the instrument
      is blind and every L1 negative is uninterpretable; in the second, verdicts
      may not be read directionally and that limitation is printed with them.
    - >-
      The gauge comparator interval, drawn 8 times, is WIDER than the
      class-versus-gauge difference. That is mode 5: the residual is unresolved
      in either direction, and reporting it as a class effect would be the
      error this record exists to prevent.
    - >-
      Class sizes at the reachable p are too small (< 10 members) for any
      variance comparison to have power. That is a SCOPE limitation, recorded as
      such, and it bounds every L1 conclusion; it is not evidence of invariance.

  confounders:
    - >-
      j = 0 and j = 1728 have larger automorphism groups and smaller gauge
      orbits. Pooling them with generic curves silently mixes orbit sizes. They
      are stratified, never pooled.
    - >-
      SEED REUSE. If the gauge arm and the class arm share a factor-base seed,
      their variances are correlated and the difference is biased. Seeds are
      declared per arm.
    - >-
      TARGET DRIFT. Comparing arms at non-transported targets compares different
      problems; the certificate is mandatory.
    - >-
      SMALL CLASS SIZE. h ~ sqrt(p): at p = 2^12 a class has a few tens of
      members, so Var(C) itself has large relative error. The number of class
      members must be reported beside every variance, and variance ratios must
      carry an F-type interval, not a point.
    - >-
      MULTIPLE FUNCTIONALS. Running the rule on 6 functionals and reporting the
      one that fires is a garden of forking paths. All functionals are declared
      in advance and all verdicts are reported, and per-functional rates are NOT
      multiplied into a joint p-value (KN-TECH-1a5b7e).

  interpretation_limits:
    - >-
      This record establishes nothing about the ECDLP and nothing about any
      functional. It establishes what a measurement of a functional is allowed
      to conclude.
    - >-
      A passed instrument control asserts nothing beyond fitness at the measured
      detection floor and the tested p range.
    - >-
      "No class signal" from this instrument means "no class signal above gauge
      variance at this B, this p, this class size, and this detection floor" --
      five qualifiers, all required in any downstream sentence.
    - >-
      The gauge orbit is a null for COORDINATE functionals only. For
      dilation-invariant functionals it is a mode-1 null and the table in Step 1
      says so; using it there would be exactly the failure this record catches.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a fixed curve E and W in [p^{1/2}, p/2], the counts
        |X_E cap u^{-2}[0, W)| over u in F_p^* behave, as u varies, like
        independent binomial(W, 1/2) draws; in particular their standard
        deviation is (1 + o(1)) sqrt(W)/2 and their maximum over the (p-1)/2
        dilates is W/2 + (1 + o(1)) sqrt(W log p / 2).
      rigorous_support: >-
        The rigorous half is the Weil bound: for c != 0 the mixed character sum
        sum_x chi(f(x)) e_p(cx) is O(sqrt(p)), so every dilate's count is
        W/2 + O(sqrt(p) log p) -- no dilate can be far from the mean. The
        heuristic half is INDEPENDENCE across dilates, which imitates the
        classical model that incomplete character sums over distinct dilations
        behave like independent centred sums of their own scale. Neither half is
        assumed silently: the first is cited, the second is what is tested.
      validation_plan: >-
        For >= 30 curves at p in {2003, 4001, 8191, 16381} and W over a decade,
        compute the full distribution of |X_E cap u^{-2}[0,W)| over ALL u by one
        multiplicative-convolution FFT pass per curve (O(p log p)), compare the
        empirical distribution against binomial(W, 1/2) by a quantile-quantile
        plot, and check the tail explicitly: the observed maximum against the
        predicted W/2 + sqrt(W log p / 2). A maximum materially above the
        prediction is STRUCTURE in the dilation orbit and is the interesting
        outcome; it is also exactly the quantity IDEA-20260807-c36472 needs.
        TOY SCALE ONLY and labelled as such.
    - id: H2
      statement: >-
        The frozen decision rule's per-group false-positive rate for an OUTSIDE
        verdict against an n-draw min/max gauge interval is exactly 2/n when the
        draws are pairwise distinct.
      rigorous_support: >-
        Not a heuristic at all in the probabilistic sense: it is the definition
        of a min/max tolerance interval applied leave-one-out, and it is
        derivable in one line. It is listed here because KN-TECH-1a5b7e requires
        the rate to be DERIVED before the run and CHECKED after it, and because
        the interval is a tolerance interval whose coverage depends on n alone.
      validation_plan: >-
        Mechanically apply the rule leave-one-out to the gauge arm's own n
        members and confirm exactly one LOW and one HIGH. Report 2/n beside
        every OUTSIDE verdict. Do not multiply per-functional rates together.

  reachability_gate: >-
    NOT APPLICABLE AS AN ATTACK GATE -- this record moves between curves only to
    build a null, never to mount anything, so T5 imposes no cost on it. It does,
    however, supply the ONE piece of reachability information that costs nothing:
    the gauge direction is FREE. Applying an isomorphism costs O(log p) field
    operations and requires no isogeny computation, no class-group action and no
    vectorization. Therefore any variance this instrument attributes to gauge
    rather than to class is variance an attacker could exploit WITHOUT paying
    T5 at all -- which is why separating the two is not bookkeeping but the
    substance of the reachability question. The follow-through is
    IDEA-20260807-c36472.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. Instrument cost: O(p) per curve
      for X_E, O(p log p) per curve for the full dilation distribution via FFT,
      times (class size ~ p^{1/2}) times (gauge draws) -- i.e. about
      p^{3/2 + o(1)} for one complete class sweep, which is far above the
      0.886 sqrt(N) baseline and affordable only because p is toy.
    memory_exponent: >-
      O(p) for the character table and the FFT buffer. 16 KB at p = 2^14,
      64 KB at p = 2^16 for the byte table, a few MB for complex FFT buffers.
      Not binding.
    best_known: >-
      There is no incumbent instrument for this question in the corpus: the
      prescribed null in RQ-ICINV-475b5e is the random-curve arm, which this
      record argues is confounded. The incumbent METHODOLOGY is KN-TECH-1a5b7e,
      which this record instantiates rather than replaces.
    hidden_overhead: >-
      Everything hides in the DETECTION FLOOR. An instrument that resolves only
      a 10% planted corruption cannot support a claim that within-class variance
      is zero -- only that it is below 10% of the planted scale. Every L1
      negative inherits that number and must quote it.
    tradeoff_note: >-
      The only tradeoff is statistical: gauge draws n versus wall time. n >= 8
      is a floor from KN-TECH-1a5b7e mode 5, not an optimum; the marginal cost
      of n = 32 is one more FFT pass per curve and is recommended.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES. As an ATTACK this record
    mounts none, so it is dominated on every axis by every row of the frontier:
    parallel rho at 0.886 sqrt(N) time and O(1) memory (KN-TECH-001,
    KN-TECH-006), the automorphism-discounted variant at the same exponent with
    a constant at most sqrt(6) (KN-TECH-018), and BSGS at sqrt(N) time and
    memory (KN-TECH-031). As an INSTRUMENT the incumbent is the random-curve
