idea:
  id: IDEA-20260815-ab40e9
  question_id: RQ-TECDSA-8d340d
  added: '2026-08-15'
  title: >-
    IDENTIFIABLE ABORT IS THE PROPERTY THRESHOLD PROTOCOLS ADVERTISE AND THE
    ONE MOST OFTEN CLAIMED WITHOUT A WITNESS: construct a misbehaving party
    for each protocol and check the honest parties actually identify it
  class: control

  claim: >-
    Identifiable abort means that when a protocol fails, honest parties
    agree on which party misbehaved. It is claimed in specifications and
    rarely demonstrated. A misbehaving party per deviation class, run
    against the protocol, either produces correct identification or shows
    the property does not hold for that class.

  mechanism: >-
    Enumerate deviation classes: wrong share, replayed message, inconsistent
    broadcast, aborted midway, and malformed proof. Implement a misbehaving
    party for each and record whether honest parties agree on the culprit's
    identity.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-TECDSA-001; grep 'identifiable abort' (8),
      'accountability', 'culprit identification'.
    results: >-
      Identifiable abort appears in the corpus as a protocol property; no
      record constructs misbehaving parties and checks identification.
    verdict: >-
      ADAPTATION. Identifiable abort is a standard property with published
      constructions; the contribution is per-deviation-class witnesses in
      this program's evidence format.

  object_first_candidate:
    tracked_object: >-
      THE IDENTIFICATION OUTCOME per deviation class, as a witness rather
      than a claim.
    lossiness: >-
      Reducing an outcome to identified-or-not discards partial
      identification, so cases where honest parties disagree among
      themselves are recorded as a distinct third state.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while the protocol is implementable with a misbehaving
      party; deviation classes the harness cannot express are reported
      rather than assumed handled.

  null_object_control: >-
    NULL 1 -- all-honest execution, where no abort occurs and nobody is
    identified. NULL 2 -- a network failure rather than misbehaviour, where
    the protocol must NOT identify anyone as a culprit; identifying an
    honest party on a network fault is worse than failing to identify a
    dishonest one.

  discriminated_from:
    - >-
        The countermeasure-harness record in this series, which tests key-
        extraction mitigations; this tests an availability and
        accountability property instead.
    - >-
        Published identifiable-abort constructions, which prove the
        property for their protocols; this checks the implemented
        protocol.

  assumptions:
    - >-
        A misbehaving party is implementable for each deviation class.
    - >-
        Honest parties' identification outputs are comparable, so
        agreement is checkable rather than assumed.

  predictions:
    - metric: >-
        all-honest null
      direction: different
      minimum_effect: >-
        FORCED: no abort, nobody identified.
    - metric: >-
        network-fault null
      direction: different
      minimum_effect: >-
        FORCED: nobody identified as a culprit. Identifying an honest
        party here is a serious defect in the opposite direction.
    - metric: >-
        identification per deviation class
      direction: different
      minimum_effect: >-
        The measurement; each class either yields correct unanimous
        identification or shows the property fails for it.
    - metric: >-
        honest parties disagreeing among themselves
      direction: different
      minimum_effect: >-
        Recorded as a distinct outcome, since disagreement is a
        different and worse failure than non-identification.

  minimal_test:
    design: >-
      One protocol, all five deviation classes, both nulls.
    controls:
      - >-
          All-honest and network-fault nulls.
      - >-
          Honest-party disagreement recorded as a distinct state.
      - >-
          Deviation classes the harness cannot express listed rather
          than skipped.
    required_metrics:
      - >-
          Identification outcome per deviation class per honest party.
      - >-
          Agreement or disagreement among honest parties.
      - >-
          List of inexpressible deviation classes.

  falsification_conditions:
    - >-
        The network-fault null identifies an honest party. A serious
        defect requiring immediate review.
    - >-
        A deviation class yields no identification. The property does not
        hold for that class, which contradicts the specification's claim.
    - >-
        Honest parties disagree on the culprit. Worse than non-
        identification and needs review before disclosure.
    - >-
        All classes identify correctly and unanimously. The property holds
        for the implemented protocol against the tested classes, which is
        worth establishing with witnesses.

  confounders:
    - >-
        DEVIATION-CLASS COVERAGE: a class nobody enumerated is exactly
        what an adversary would use, so a clean result binds the
        enumerated set only.
    - >-
        IMPLEMENTATION VERSUS PROTOCOL: a failure may be an implementation
        bug rather than a protocol property failure, and distinguishing
        them requires reading the specification's proof.

  interpretation_limits:
    - >-
        Tests one implemented protocol against enumerated deviations;
        makes no general claim.
    - >-
        Scoped to the implemented protocol and enumerated classes.
    - >-
        A failure requires distinguishing implementation bug from protocol
        property before it is characterised.

  heuristic_assumptions:
    - id: HEUR-TECDSA-IA-1
      statement: >-
        The enumerated deviation classes cover the ways a party can
        misbehave such that identifiable abort is supposed to trigger.
      rigorous_support: >-
        Rigorous ingredient: the classes are read off the protocol's
        message flow, so every message a party sends can be deviated in
        a listed way. THE GAP: adversaries can also deviate by timing,
        by colluding across parties, or by selectively deviating against
        a subset of honest parties, and none of those is a message-
        content deviation.
      falsification_condition: >-
        A misbehaviour that defeats identification and is not a message-
        content deviation.
      validation_plan: >-
        SAMPLE: all enumerated classes plus an adversarial attempt to
        defeat identification outside them. TAIL CHECK: any successful
        evasion, which measures the coverage gap directly. TRANSFER:
        none beyond the implemented protocol.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is one protocol execution per deviation
      class.
    memory_exponent: >-
      Negligible.
    best_known: >-
      Incumbents are the published identifiable-abort constructions and
      their proofs, tested here against an implementation rather than
      improved.
    hidden_overhead: >-
      Colluding and timing deviations are outside a message-content
      enumeration and are the coverage gap.
    tradeoff_note: >-
      Witnesses per class are concrete and protocol-bound; the published
      proofs are general and untested against implementations.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As theory: dominated by the published
    identifiable-abort constructions. As per-class witnesses against an
    implementation: none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: per-deviation-class
    identification witnesses for an implemented threshold protocol, with
    honest-party disagreement recorded as a distinct failure mode and a
    network-fault null testing the opposite error of blaming an honest
    party.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.75 that a misbehaving party is implementable for each class. 0.9 that
    the all-honest null behaves. 0.2 that some class fails identification,
    and 0.1 that the network-fault null wrongly identifies someone, which
    would be the more serious of the two.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-TECDSA-8d340d
    - GOAL-TECDSA-001
    - KN-TECH-056
    - KN-TECH-080
    - docs/inventor-protocol.md
  id_allocation_provenance: >-
    Minted with `python3 tools/allocate_id.py --next idea --date 20260815`
