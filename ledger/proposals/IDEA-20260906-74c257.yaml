    "claim": "A publicly evaluable approximate hitting potential for the low-degree Frobenius stratum can improve a fully charged search only if its drift produces an expected hitting-time reduction exceeding evaluation and importance-correction costs. A marked-set density or second-moment bound alone is insufficient.",
    "mechanism": "For a fixed reversible nonbacktracking-lifted graph chain K and target set S_D={E:delta_E<=D}, solve the killed-chain Poisson equation (I-K)h=1 off S_D, h=0 on S_D, on tiny exact graphs. Seek a local surrogate hhat built from bounded neighborhoods and certified public invariants. A proposal walk biases toward lower hhat with explicit Radon-Nikodym weights or a proved hitting bound; exact path certificates pull back the discovered map. This is coordinate-dependent public information under a named graph operation, not a translation quotient of a prime-order point group. Computing true h at scale is not free; its O(V^3) dense solve and target membership oracle are diagnostic only.",
