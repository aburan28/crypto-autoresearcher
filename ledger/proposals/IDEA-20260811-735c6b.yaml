  status: proposed
  question_id: RQ-MTGT-2cabee
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  task_id: TASK-20260811-f58f22
  axis: A3
  claim_tier: toy

  title: >-
    THE TWO ZERO-PRICED RESOURCES, CHARGED -- the Corrigan-Gibbs--Kogan model
    prices offline TIME at zero and every memory probe at O(1), and both prices
    are load-bearing for every amortisation claim this lane has made: under
    Wiener full cost the quantity minimised on the frontier S*T^2 = N is S*T =
    N/T, so THE FULL-COST-OPTIMAL POINT OF THE PREPROCESSING FRONTIER IS THE
    NO-ADVICE CORNER T = sqrt(N) and single-target preprocessing NEVER beats rho
    once storage is charged for the time it is occupied; and the class's
    advice-bit saving (a127ab's M*N^{1/3} -> N^{1/3}) is real exactly when the M
    tables would have had to be SIMULTANEOUSLY RESIDENT and exactly zero
    otherwise, because sequential reuse already gets it without any isogeny --
    plus the one arithmetic surprise the audit turns up, that
    IDEA-20260811-61ecae's landmark budget survives the wiring charge in 3D and
    lands EXACTLY on the DL advice budget in 2D, at every point of the frontier

  class: mechanism

  claim: >-
    (A) THE AUDIT'S PREMISE, WHICH IS NOT NOVEL AND IS CITED. KN-TECH-035 records
    Wiener's full-cost accounting (KN-LIT-094): price an attack by hardware
    multiplied by the time it is occupied. It changes exponents, not constants --
    BSGS is sqrt(N) processor steps and N^{2/3+o(1)} full cost, while parallel
    collision search keeps its advantage because per-processor storage stays
    small. KN-TECH-035 states explicitly that preprocessing and advice
    (KN-LIT-013) "are the same issue in another guise", and that this program's
    rule that preprocessing must be charged follows from it -- and it also records
    that the quantitative application to any specific proposed mechanism "has not
    been carried out". THIS RECORD CARRIES IT OUT FOR LANE L13. That is its entire
    contribution and the framing is deliberately unglamorous.

    (B) CLAIM 1 -- THE FULL-COST-OPTIMAL POINT OF THE PREPROCESSING FRONTIER IS
    THE NO-ADVICE CORNER. [fact, elementary, one line]
      An online phase running T steps against S cells of advice occupies those S
      cells for time T, so its full cost is at least S*T (plus the processor's own
      Theta(T)). On the CGK frontier S*T^2 = N we have
          full cost >= S*T = N / T,
      which is DECREASING in T. It is therefore minimised at the largest
      admissible T, namely T = Theta(sqrt(N)) with S = Theta(1) -- the no-advice
      corner, which is exactly parallel rho at 0.886*sqrt(N) with O(1) memory
      (KN-TECH-001, KN-TECH-006). At the celebrated operating point
      S = T = N^{1/3} the full cost is N^{2/3}, matching BSGS's N^{2/3+o(1)}
      (KN-TECH-031) and losing to rho by N^{1/6}.
      CONSEQUENCE, STATED PLAINLY: for a single target, ADVICE NEVER HELPS UNDER
      FULL COST, whatever the group and whatever the structure. Every L13 result
      that lives on or near the CGK frontier -- IDEA-20260807-a127ab,
      IDEA-20260807-a2fb45, IDEA-20260807-ea3915, IDEA-20260811-61ecae -- is
      therefore dominated by rho in full cost BEFORE any isogeny argument is made,
      and their zero attack deltas are not merely zero but robustly zero.
      HONEST LIMIT OF CLAIM 1: it says preprocessing does not lower FULL COST. It
      does not say advice is useless -- an attacker who has already paid for the
      table and is charged only for online wall-clock genuinely gets T = N^{1/3},
      and that is a real threat model, just not one in which full cost is the
      figure of merit. Naming which figure of merit a claim lives in is the
      audit's job and this record refuses to collapse the two.

    (C) CLAIM 2 -- THE CLASS'S ADVICE SAVING IS A SIMULTANEITY SAVING, NOT A
    STORAGE SAVING. [fact, elementary]
      a127ab establishes that one table serves the whole class, so total advice
      for M curves falls from M*S to S. Charge it two ways.
        SEQUENTIAL ATTACKS. Without the class, build table for curve 1, attack,
        DISCARD, build table for curve 2, ... Peak area S, total time M*(T + build).
        With the class, build once, attack M times. Peak area S, total online time
        M*T. The AREA IS THE SAME. What changed is the total BUILD time, i.e. the
        preprocessing-time axis P, by a factor M. Under CGK's convention P is
        priced at zero, so the saving is invisible; under a charged-P convention
        it is a factor M; under full cost with sequential attacks it is again
        zero in the online term.
        SIMULTANEOUS ATTACKS. If M attacks must run at once, the non-class world
        needs M tables resident, area M*S; the class world needs one, area S.
        HERE THE SAVING IS REAL AND IS A FACTOR M IN AREA.
      THE RULE THIS YIELDS, WHICH IS THE RECORD'S USABLE OUTPUT: an L13 advice
      saving is real if and only if the tables it merges would have had to be
      simultaneously resident. Any record claiming a class advice saving must
      state its residency assumption. None currently does.

    (D) CLAIM 3 -- THE PREPROCESSING-TIME AXIS IS WHERE THE CLASS'S ONLY NONZERO,
    HONESTLY-CHARGED GAIN LIVES, AND IT IS EXACTLY h. [fact, given a127ab]
      Define the (P, S, T) model: P = offline time, S = advice bits, T = online
      time. In this model the class gives: one table build instead of h, so
      P_class = P_one and P_generic = h * P_one, a factor h = N^{1/2+o(1)}. For
      the ADAPTIVE scheme of IDEA-20260811-61ecae the same factor h applies with
      the advice valid for a random unseen member. THAT IS THE CAMPAIGN'S ONLY
      NONZERO CLASS GAIN THAT SURVIVES AN HONEST CHARGE, and it is in the one
      resource that no attack metric in this program charges. Stating its exact
      size (h, i.e. exponent 1/2) is more useful than repeating that the attack
      delta is zero, because it tells the next session where to look and where not
      to.
      FORWARD GUIDANCE: a bounded-preprocessing lower bound -- "what is the
      achievable (P, S, T) region" -- is a genuinely open model question that
      neither CGK nor anything in this corpus answers, and it is the only frame in
      which the class's factor-h is a theorem rather than an accounting note.

    (E) CLAIM 4 -- THE WIRING CHARGE ON THE LANDMARK SCHEME, AND THE COINCIDENCE
    IT PRODUCES. [fact, elementary, conditional on using the RAM-model frontier
    for the DL half, which is stated and not hidden]
      IDEA-20260811-61ecae's online addressing performs Theta(h/L) probes into an
      L-entry landmark table. Charge each probe at the wiring latency of an
      L-cell memory: O(1) in the RAM model, L^{1/2} in a 2-D layout, L^{1/3} in a
      3-D layout (KN-LIT-094's model). Requiring the addressing time to stay
      within the online budget T gives, with h = N^{1/2+o(1)} and T = N^tau:
        RAM  : (h/L) <= T          =>  L >= N^{1/2 - tau}
        3-D  : (h/L)*L^{1/3} <= T  =>  L >= N^{3/4 - 3*tau/2}
        2-D  : (h/L)*L^{1/2} <= T  =>  L >= N^{1 - 2*tau}
      against the DL advice budget S_DL = N^{1 - 2*tau}. Comparing exponents:
        RAM  : 1/2 - tau      <= 1 - 2*tau   for tau <= 1/2, strict below 1/2
        3-D  : 3/4 - 3*tau/2  <= 1 - 2*tau   for tau <= 1/2, strict below 1/2
        2-D  : 1 - 2*tau      =  1 - 2*tau   FOR EVERY tau -- EXACT EQUALITY
      So the landmark budget survives the wiring charge in every layout, and in
      two dimensions it lands EXACTLY on the DL budget at every point of the
      frontier, costing a factor 2 in advice and not one bit of exponent. That
      the margin shrinks monotonically from strict, to strict, to exactly
      marginal as the layout gets flatter is the kind of coincidence that is
      either structural or a sign that the model has been fitted, and the record
      says so rather than celebrating it.
      HONEST QUALIFIER: this comparison holds the DL half at its RAM-model
      frontier. Charging the DL half's own probes moves S_DL too, and by Claim 1
      the whole frontier is dominated by rho anyway. The three-row table is
      therefore an INTERNAL consistency statement about 61ecae, not a security
      statement about anything.

  resource_label: >-
    NONE -- this record audits cost models rather than consuming a resource, in
    the same sense as lanes L12 and L14. NO NEW TAXONOMY ENTRY IS NEEDED, and the
    record argues that none should be added: a cost model is not a resource, and
    the R1-R8 taxonomy would be weakened by admitting one.

  admissibility: not_applicable_audit

  admissibility_argument: >-
    The admissibility filter asks what a lane does with phi. This record does
    nothing with phi; it charges other records' arithmetic. It cannot be
    inadmissible because it proposes no mechanism, and it cannot be admissible in
    the filter's sense because it claims no non-generic resource. Filed as an
    audit, with the same standing as lane L14's instrumentation records.

  object_first_candidate:
    tracked_object: >-
      THE COST FUNCTIONAL ITSELF -- the map from an algorithm to the tuple
      (P, S, T, area x time), tracked as the accounting convention changes rather
      than as the curve changes.
    lossiness: >-
      LOSSY AND THE LOSS IS THE POINT: the functional forgets the algorithm, the
      curve, and the mathematics, retaining four numbers. What it must NOT forget
      is which resources were priced at zero, and the record's thesis is that the
      lane has been losing exactly that.
    propagation: >-
      LOSSY-PROJECTION TEST: passed, but in the audit sense. The operation here is
      "change the accounting convention", and the tuple propagates deterministically
      under it by explicit rules (occupancy, wiring latency, amortisation
      convention). What is discarded -- the algorithm's internals -- is discarded
      compatibly, since the re-pricing rules act on the tuple alone. A convention
      under which the tuple did not determine the re-priced tuple would be a
      convention this record could not audit, and none of the three used here is.
    survival_score: >-
      Survives every record in lane L13 and most of lanes L1-L11 that store
      anything. Dies where the stored object's access pattern is not random
      (streaming linear algebra, for instance), where the wiring model's three
      dimensions are the wrong abstraction, and at any question about constants,
      since KN-TECH-035 itself warns full cost settles exponents and not constants.

  mechanism: >-
    A tradeoff frontier is a statement inside a cost model. The CGK frontier is
    stated in a model that prices offline time at zero and memory probes at O(1).
    Two of this lane's four load-bearing claims (a127ab's advice saving, ea3915's
    factor-M separation) are statements about a resource that one of those two
    zero prices makes visible, and one of them (61ecae's addressing) is a
    statement about a resource the other zero price makes free. Re-pricing is
    therefore not a stylistic preference here; it is the difference between a
    result and an artifact of a convention, and the re-pricing rules are
    published (KN-LIT-094 via KN-TECH-035) rather than invented.

  why_not_a_renamed_known_approach: >-
    (1) KN-TECH-035 and KN-TECH-031 already state that BSGS costs N^{2/3+o(1)} in
      full cost and that preprocessing is "the same issue in another guise". This
      record does not rediscover that; it CITES it and then does the arithmetic
      those entries explicitly record as not yet done -- KN-TECH-035's own
      "Verified vs reported" section says the application "has not been carried
      out quantitatively for any specific proposed mechanism".
    (2) a2fb45 states the preprocessing frontier is class-invariant. That is a
      statement WITHIN the RAM model about which curve to use. This record is a
      statement ACROSS models about whether the frontier is the right object.
      They do not overlap and neither implies the other.
    (3) a127ab already reports both the CGK zero-cost-offline convention and the
      Bernstein-Lange charged convention, and warns against mixing them. This
      record extends that discipline from the offline axis to the memory-access
      axis and turns it into a rule (Claim 2's residency test) that a reviewer can
      apply mechanically.

  predictions:
    - observable: full cost along the CGK frontier
      metric: >-
        symbolic minimisation of S*T subject to S*T^2 = N over tau in (0, 1/2],
        reported as the minimising tau
      direction: different
      minimum_effect: >-
        The minimiser must be tau = 1/2 (the no-advice corner). Any other
        minimiser means the occupancy model "S cells occupied for time T" is
        wrong, which would be a genuine and interesting correction to
        KN-TECH-035's application here.
    - observable: residency dependence of the class advice saving
      metric: >-
        peak area and area-time integral for M sequential and M simultaneous
        attacks, with and without class amortisation, computed symbolically and
        then measured on a toy harness that records peak resident bytes
      direction: different
      minimum_effect: >-
        Sequential: identical peak area with and without the class, to within the
        harness's allocator noise. Simultaneous: a factor M in peak area. If the
        sequential arms differ, the implementation is not discarding tables and
        the comparison is measuring the implementation.
    - observable: the three-row wiring table for the landmark budget
      metric: >-
        the exponent gap log_N(S_DL) - log_N(L) under RAM, 3-D and 2-D latency
        models, as a function of tau
      direction: lower
      minimum_effect: >-
        Non-negative for every tau in all three rows, and exactly zero for every
        tau in the 2-D row. A negative entry anywhere means the landmark scheme
        does not survive that layout and IDEA-20260811-61ecae must be rescoped to
        the layouts where it does.
    - observable: measured probe latency scaling
      metric: >-
        wall-clock per random probe into an L-entry hash table as L sweeps over
        four orders of magnitude on the actual machine
      direction: higher
      minimum_effect: >-
        Must grow with L, and the fitted exponent must be reported. A flat
        measured latency means the sweep never left cache and the measurement
        cannot distinguish the three models -- which is the expected outcome at
        toy sizes and must be reported as a scale limitation rather than as
        support for the RAM row.

  minimal_test:
    design: >-
      STAGE 0 -- ZERO COMPUTE, AND IT IS THE ENTIRE RESULT. Claims 1 to 4 are four
      short symbolic computations. Each is independently checkable in minutes with
      pencil and paper, and each can be independently wrong. A reviewer who
      disagrees with Claim 1 need only exhibit a point on the frontier with
      smaller S*T; a reviewer who disagrees with Claim 4 need only redo three
      exponent comparisons.
      STAGE 1 -- MINUTES, AND IT IS A CONTROL ON THE AUDIT RATHER THAN ON THE
      MATHEMATICS. Instrument a toy preprocessing attack (build a small table,
      run online lookups) with a peak-resident-bytes counter and an operation
      counter, in the four arms of prediction 2. This does not test Claim 1, which
      is a theorem; it tests whether the harness's accounting can even SEE the
      distinction the claim turns on, which is a prerequisite for any future L13
      run to be believable.
      STAGE 2 -- MINUTES. The probe-latency sweep of prediction 4, reported with
      the cache hierarchy of the machine, so that the three-row table is annotated
      with which row the available hardware can actually discriminate (expected
      answer: none of them, at toy sizes; that answer is worth having in writing).
    controls:
      - >-
        NULL OBJECT for the residency measurement: run the four arms with the
        isogeny transport REPLACED by an identity map, i.e. all M "curves" are the
        same curve. Peak area and area-time must be identical to the class arm. If
        they differ, the harness is charging the transport rather than the
        storage and every residency number is contaminated. This is the matched
        null the claim requires and it costs nothing.
      - >-
        NEGATIVE CONTROL for the probe sweep: a SEQUENTIAL scan of the same table
        instead of random probes. Its latency must NOT grow the same way; if it
        does, the sweep is measuring allocation rather than access pattern.
      - >-
        BASELINE ARM: rho with O(1) memory instrumented by the same counters, so
        that "dominated by rho in full cost" is a comparison between two measured
        tuples rather than between a measured one and a cited one.
    required_metrics:
      - the four symbolic derivations, written out
      - peak resident bytes and area-time integral, per arm, per residency mode
      - probe latency vs table size, with the machine's cache parameters recorded
      - rho baseline tuple from the same counters
      - an explicit statement, per number reported anywhere in lane L13, of which cost model it lives in

  controls:
    - Identity-transport null for the residency measurement (blocking).
    - Sequential-scan negative control for the probe sweep.
    - rho baseline arm under identical counters.
    - The L = h identity arm inherited from IDEA-20260811-61ecae for overhead subtraction.

  confounders:
    - >-
      TOY SIZES CANNOT SEE WIRING. Every table in a toy experiment fits in cache,
      so no measurement at this scale can discriminate the RAM, 2-D and 3-D rows.
      The three-row table is SYMBOLIC and must never be presented as measured.
      This is the dominant confounder and it is why Stage 2's expected result is a
      negative.
    - >-
      FULL COST SETTLES EXPONENTS, NOT CONSTANTS. KN-TECH-035 states this
      explicitly. Claim 1's N^{1/6} gap at the N^{1/3} operating point is an
      exponent statement; no constant-factor conclusion may be drawn from it.
    - >-
      THE THREE-DIMENSION ABSTRACTION is a modelling choice. Real machines add
      bandwidth, energy and latency structure the model does not itemise. The
      record uses the model this program has already adopted and does not defend
      it further.
    - >-
      CONVENTION MIXING IS THE FAILURE MODE THE RECORD EXISTS TO PREVENT AND IS
      THEREFORE ALSO ITS OWN LARGEST RISK: quoting a CGK-convention S next to a
      Wiener-convention T produces a number that is wrong in a direction nobody
      can predict. Every table this record produces must carry its convention in
      the caption.
    - >-
      WIENER'S DEFENDER-SIDE CAUTION, PRESERVED: counting only processor steps is
      CONSERVATIVE for choosing key sizes. Nothing here licenses a smaller key
      size, and Claim 1 must not be read as saying preprocessing attacks are
      harmless.

  falsification_conditions:
    - >-
      A point on the CGK frontier with S*T smaller than the no-advice corner's --
      Claim 1 is false and the occupancy model is wrong.
    - >-
      A regime in which the class's advice saving survives even for strictly
      sequential attacks -- Claim 2's residency rule is wrong, and the rule must
      be withdrawn rather than qualified.
    - >-
      A layout model in which the landmark budget exceeds the DL budget at some
      tau <= 1/2 -- Claim 4's table has a negative entry, and
      IDEA-20260811-61ecae must be rescoped.
    - >-
      The identity-transport null shows different peak area from the class arm --
      the harness accounting is broken and no residency number from it may be used.
    - >-
      KN-LIT-094's model is misread -- e.g. if Wiener's full cost is not "hardware
      x time occupied" in the sense used here. The corpus entry KN-TECH-035 is a
      relay ("read directly from KN-LIT-094... the wiring derivation was not
      re-checked"), so this failure mode is live and its resolution is a read of
      the source, not a computation.

  interpretation_limits:
    - >-
      THIS RECORD PRODUCES NO ATTACK AND WEAKENS NO PARAMETER RECOMMENDATION. Its
      direction of effect is to make preprocessing look WORSE, which is the
      conservative direction and is therefore the direction in which a reader
      should be least willing to accept it without checking.
    - >-
      Symbolic throughout; the only measurements are instrument checks on the
      harness's accounting, at toy scale, claim_tier toy.
    - >-
      It does not close lane L13 and does not adjudicate any other record. It
      re-prices them, and a re-pricing is an input to a decision, not a decision.
    - >-
      P2: not adjacent. Index-calculus relation matrices are mentioned only as
      KN-TECH-035's own example of where full cost bites; no claim about
      phi-stable factor bases is made, implied, or needed, and H-STR-002 is not
      touched in either direction.
    - >-
      P3: does not fire. Every number here moves a cost UP, not down; nothing
      approaches the automorphism-discounted rho baseline from below.

  assumptions:
    - >-
      Wiener full cost as relayed by KN-TECH-035 from KN-LIT-094: hardware
      multiplied by time occupied; BSGS N^{2/3+o(1)}; parallel collision search
      retains its advantage. The corpus entry states the wiring derivation was not
      re-checked and the o(1) constants were not extracted.
    - >-
      Random probes into an M-cell memory cost Theta(M^{1/d}) latency in a
      d-dimensional layout. [recall-confident, standard in this model, NOT
      re-verified this session.]
    - >-
      The CGK frontier S*T^2 = N as relayed by KN-LIT-013 and KN-TECH-005.
    - >-
      a127ab's establishment that one table serves the class, taken as given for
      Claims 2 and 3 rather than re-derived.
    - >-
      WEB VERIFICATION UNAVAILABLE THIS SESSION (backend model error on every
      WebSearch and WebFetch call). KN-LIT-094 (Wiener) was not re-read and the
      Bernstein AT-metric literature was not consulted. Both are named in the
      screen as the reads a reviewer should do first.

  heuristic_assumptions:
    - id: HC-1
      statement: >-
        The online phase of an advice-based algorithm occupies its full S cells of
        advice for the whole of its T steps, so its full cost is Theta(S*T) and not
        o(S*T).
      rigorous_support: >-
        Immediate if the advice is random-access and the access pattern is not
        known in advance, which is the case for a DL table indexed by a group
        element. It FAILS if the advice can be streamed, paged, or reconstructed
        on demand -- and that exception is the honest attack on Claim 1: an
        algorithm that touches its table in a predictable order can keep only a
        working set resident. Whether the CGK-frontier algorithm has such an order
        is not known to this session and is listed as an open check.
      distribution_imitated: >-
        None; this is an occupancy model, and it imitates the standard assumption
        behind every AT lower bound that a random-access table must be present.
      validation_plan: >-
        NO SAMPLING AT TOY SCALE CAN SETTLE IT (the table fits in cache). The
        validation route is a READ of the CGK matching algorithm to determine
        whether its table accesses are predictable, plus an audit of whether any
        L13 record's table admits a streaming order. Zero compute; the answer is
        binary; a "yes" weakens Claim 1 substantially and must be reported if
        found.
    - id: HC-2
      statement: >-
        h = N^{1/2+o(1)} for the classes considered, so the factor-h
        preprocessing-time saving of Claim 3 has exponent exactly 1/2.
      rigorous_support: >-
        Identical to HA-2 of IDEA-20260811-61ecae, including the disclosure that
        Siegel's lower bound is ineffective.
      distribution_imitated: none.
      validation_plan: >-
        Shared with HA-2: compute h(D) for 10^4 toy (p, t) pairs and regress
        log h on log|D|, reporting the empirical size of the o(1). No separate
        sampling is needed and none is proposed, so as not to double-count one
        measurement as two validations.

  proof_search_map:
    bottleneck: >-
      HC-1. Every claim in the record rests on "the advice is resident during the
      online phase". If a streaming access order exists for the frontier
      algorithm, Claim 1's exponent gap shrinks and the audit's headline weakens.
      This is the one step whose removal changes the conclusion.
    baseline_embedding:
      parameter_slice: >-
        S = O(1). The full-cost expression must degenerate to Theta(T) = rho's
        cost, reproducing KN-TECH-006's baseline exactly.
      reproduction_check: >-
        Symbolic and immediate; plus the rho baseline arm of the minimal test must
        produce a tuple matching the analytic one to within the counter's
        overhead. A harness whose rho arm does not reproduce 0.886*sqrt(N) group
        operations is not calibrated and its other arms mean nothing.
    observation_collision:
      observable: >-
        "Full cost N^{2/3} at the N^{1/3} operating point", used as the
        certificate that preprocessing loses.
      distinct_preimage_search: >-
        SUCCEEDS: BSGS also has full cost N^{2/3+o(1)} (KN-TECH-031) by a
        completely different route -- sqrt(N) storage touched sqrt(N) times rather
        than N^{1/3} storage touched N^{1/3} times. Two distinct algorithms, one
        observable. So the observable certifies "memory-heavy" and NOT anything
        specific to preprocessing, and the record must not present the coincidence
        as a discovery. It is, however, a useful sanity check: two independent
        memory-heavy methods landing on the same exponent is what the model
        predicts.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Build a per-record resource measure (P, S, T, AT) and charge each L13
          record on proved-disjoint axes, so that a saving on one axis cannot be
          silently re-spent on another.
        predicted_gain: >-
          Converts "zero attack delta" from an assertion repeated in each record
          into a per-axis table in which the class's only nonzero entry is P, of
          size exactly h.
      - transform: observable_fiber
        proposed_object: >-
          Hold the RAM-model tuple (S, T) fixed and vary the residency assumption;
          the full-cost tuple varies. The intrinsic invariant distinguishing the
          resulting objects is the residency mode, which is exactly what Claim 2
          isolates.
        predicted_gain: >-
          A mechanical test a reviewer can apply to any future amortisation claim
          in one line.
    quantifier_order: >-
      CLAIM 1: FORALL groups of prime order N, FORALL advice-based algorithms with
      (S, T) on or above the frontier, full cost >= N/T, hence >= sqrt(N) with
      equality only at T = Theta(sqrt(N)). Note it is a FORALL over algorithms
      given their (S, T), not over algorithms given their internals -- an
      algorithm with a streaming access order is outside the quantifier and HC-1
      is where that exclusion is recorded.
      CLAIM 2: EXISTS a residency mode (simultaneous) in which the saving is a
      factor M, and FORALL sequential modes the saving is zero. Both halves are
      needed; asserting only the first would be the overclaim and asserting only
      the second the underclaim.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under Wiener full cost, no point of the CGK preprocessing frontier has
        lower cost than the no-advice corner, and the isogeny class's amortisation
        gains are confined to the preprocessing-time axis and to the simultaneous-
        residency case." It can never certify anything about constants, about
        streaming algorithms, about energy, or about whether full cost is the
        right figure of merit for a given adversary.
      nearby_object_control: >-
        THE OBJECT WHERE THE ARGUMENT MUST FAIL: parallel collision search itself.
        KN-TECH-035 records that vOW RETAINS its advantage under full cost because
        per-processor storage stays small. If this record's accounting appeared to
        penalise vOW the same way it penalises BSGS and preprocessing, it would be
        charging parallelism rather than storage and would be void. Checking that
        it does not is the blocking control and it costs nothing.
    proof_obligations:
      - claim: full cost >= S*T for a resident random-access table.
        responsibility: correctness
      - claim: N/T is minimised on the frontier at T = sqrt(N).
        responsibility: correctness
      - claim: sequential reuse already achieves the class's peak-area saving.
        responsibility: strictness
      - claim: the class's P-axis saving is exactly a factor h.
        responsibility: size
      - claim: the three-row wiring table has no negative entry.
        responsibility: size
      - claim: the accounting does not penalise vOW.
        responsibility: baseline

  reachability_gate: >-
    NOT APPLICABLE IN THE USUAL SENSE -- this record moves no instance between
    curves and needs no path. It bears on the gate indirectly and usefully: any
    transport cost quoted in this lane must itself be charged in the same cost
    model as the thing it is being compared against. a127ab's 2^{112} concrete
    path-finding figure and its 2^{89} online figure are both processor-step
    figures, so that comparison is internally consistent; but neither may be
    compared against a full-cost figure from this record without re-derivation.
    Saying so is the point of the audit.

  target_complexity:
    time_exponent: >-
      No algorithm is proposed and no time exponent is claimed. The record's
      output is that the preprocessing frontier's FULL-COST exponent is
      1 - tau at online exponent tau, minimised at 1/2 (the rho corner), and that
      the N^{1/3} operating point sits at 2/3.
    memory_exponent: >-
      Not applicable to the record; the record is about how memory exponents are
      charged. For the audited schemes: S = N^{1-2tau} bits, occupied for T
      steps.
    best_known: >-
      Full cost: parallel rho at Theta(sqrt(N)) (KN-TECH-006, KN-TECH-035); BSGS
      at N^{2/3+o(1)} (KN-TECH-031). Processor steps: rho 0.886*sqrt(N);
      CGK/Bernstein-Lange N^{1/3} online with N^{1/3} advice (KN-LIT-013).
      Multi-target: Kuhn-Struik sqrt(M*N) (IDEA-20260807-406fef).
    hidden_overhead: >-
      The o(1) in N^{2/3+o(1)} is Wiener's and is not extracted here. HC-1 hides
      the streaming exception. The three-row table hides the assumption that the
      DL half stays at its RAM-model frontier.
    tradeoff_note: >-
      The record's central content IS a tradeoff statement: on the CGK hyperbola
      the full cost N/T is monotone, so there is no interior optimum and the
      tradeoff has a corner solution. That is unusual enough to be worth stating
      as such -- a frontier whose full-cost optimum is an endpoint is a frontier
      whose interior exists only in a convention.

  sota_delta: >-
    ZERO, and in the conservative direction: the record lowers no cost and raises
    several. Quantitatively: it reprices the lane's best advice operating point
    from N^{1/3} online (processor steps) to N^{2/3} full cost, a relative
    worsening of N^{1/3} against itself and of N^{1/6} against rho's N^{1/2}; and
    it reprices the class's headline advice saving from "factor M in bits" to
    "factor M in bits only under simultaneous residency, factor M in offline time
    always, factor 1 in online area-time".
  dominated_by: >-
    AS AN ATTACK: n/a -- no result is claimed and none is possible from an audit.
    The frontier rows were nonetheless checked so that the audit's own comparisons
    are honest: parallel rho 0.886*sqrt(N) time / O(1) memory / Theta(sqrt(N))
    full cost (KN-TECH-001, KN-TECH-006, KN-TECH-035); automorphism-discounted rho
    (KN-TECH-018); BSGS sqrt(N)/sqrt(N)/N^{2/3+o(1)} (KN-TECH-031); CGK-frontier
    preprocessing (KN-LIT-013); Kuhn-Struik sqrt(M*N). Every L13 record is
    dominated by row 1 on full cost, which is this record's Claim 1.
    AS AN AUDIT: dominated by KN-TECH-035 itself on generality -- that entry
    states the principle and this record only instantiates it. The instantiation
    is what the entry asks for and does not supersede it.

  estimated_cost:
    implementation: >-
      low. Stage 0 is paper. Stages 1 and 2 need a peak-resident-bytes counter and
      a probe-latency microbenchmark, both small.
    compute: low. Minutes.
  recommended_priority: >-
    high as a GATE rather than as a discovery: it is cheap, it is prerequisite to
    believing any number this lane produces, and its most likely outcome (all four
    claims stand) removes an entire class of future overclaim at the cost of an
    afternoon.

  honest_prior_of_survival: >-
    0.92 that Claim 1 survives review, the residual risk being HC-1's streaming
    exception. 0.88 that Claim 2's residency rule survives as stated. 0.95 that
    Claim 3's factor-h is right (it is arithmetic). 0.85 that Claim 4's three-row
    table has no sign error, and this is the number a reviewer should check first
    because the 2-D exact equality is the sort of coincidence that is usually an
    algebra slip. 0.00 that any of this produces an attack, by construction.

