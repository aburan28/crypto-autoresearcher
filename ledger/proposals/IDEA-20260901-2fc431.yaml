idea:
  id: IDEA-20260901-2fc431
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  added: '2026-09-01'
  status: proposed
  proposed_by: idea-generator

  title: >-
    THE RE-RANDOMISATION LOOP IS A PURCHASE AT A KNOWN EXCHANGE RATE, AND THE
    RATE IS THE SUCCESSIVE-MINIMA COUNT. Buy the P0 inverse with table instead of
    with attempts: a single table covering degree p^{1/3} times k^{2/3} contains
    k conjugate targets rather than one, which trades about 9.3 bits of memory for
    about 4.7 bits of time at SQIsign NIST-I, moves the algorithm OFF the
    published time-memory curve, and requires a successive-minima generalisation
    of Heuristic 1 that the source's own SageMath experiment already computes and
    discards

  class: algorithm

  claim: >-
    STATED FIRST AND PLAINLY. THIS RECORD MOVES NO EXPONENT AND CLAIMS NONE. Time
    and memory remain p^{1/3+o(1)}. Its content lives entirely inside the o(1),
    and per the search heuristics of agents/idea-generator.md it is filed as a
    cofactor-level proposal and asks to be ranked as one. It is offered because
    it is a BUILDING BLOCK: the successive-minima law it needs is an input to
    IDEA-20260901-65c009, IDEA-20260901-1ddfd4 and IDEA-20260901-deaf80, its
    validation arm is a two-line change to an experiment the frozen source has
    already run, and the quantity it moves is the memory figure that
    DEC-20260805-596d71 records as the load-bearing reason the attack is called
    theoretical rather than practical.

    (A) A DERIVATION, ZERO COMPUTE, THAT ANSWERS A FILED MEASUREMENT PROPOSAL.
    The table of Algorithm 2 is keyed by codomain. Two distinct entries with the
    same key would be isogenies psi_1, psi_2 from E of degrees d_1, d_2 at most
    X, and psi_2-hat composed with psi_1 is then an endomorphism of E of degree
    d_1 d_2 at most X^2, which is non-scalar unless the two isogenies agree. So a
    key collision forces a non-scalar endomorphism of degree at most X^2, which is
    about p^{1/3}. Under the Gross-lattice count (H2 below) the fraction of
    supersingular curves admitting a non-scalar endomorphism of degree at most M
    is about M^{3/2}/p, which at M = p^{1/3} is p^{-1/2}. CONCLUSION: THE TABLE IS
    KEY-COLLISION-FREE FOR ALL BUT A p^{-1/2} FRACTION OF CURVES, DETERMINISTICALLY
    AND NOT PROBABILISTICALLY, and modelling it as a uniform hash is wrong in the
    conservative direction. This answers IDEA-20260815-86b09c's measurement by
    derivation, and it is also the assumption H1 of IDEA-20260901-1ddfd4 at g = 1.

    (B) THE EXCHANGE RATE. Wesolowski's Lemma 3.5 lower-bounds the per-attempt
    success probability using ONLY the smallest isogeny E -> E^{(p)}, and Remark 1
    (READ) records that there are generally several small ones, that Panny observed
    it, and that the effect is absorbed into the hidden term. That absorption is a
    choice, not a fact, and it can be priced. Under the successive-minima law H1,
    the number of isogenies E -> E^{(p)} of degree at most Y is about
    Y^{3/2} p^{-1/2}, so raising the covered degree from Y_0 = (p/2)^{1/3} to
    Y = Y_0 k^{2/3} puts k targets in the table instead of one and multiplies the
    per-attempt success probability by k, while multiplying the table size -- and
    therefore the memory and the per-attempt time -- by k^{2/3}. Choosing
    k = P0^{-1} removes the re-randomisation loop entirely:
        TIME goes from M times P0^{-1} to M times P0^{-2/3},
        MEMORY goes from M to M times P0^{2/3} inverse,
    i.e. TIME improves by P0^{-1/3} and MEMORY worsens by P0^{-2/3}.

    (C) THE NUMBER, PRE-REGISTERED AGAINST THE SOURCE'S OWN TABLE. Section 4.1 of
    the frozen source (READ) gives, at log2 p about 256, time at least 2^{106.5}
    and memory at least 2^{92.5}. Their ratio is exactly the factor P0^{-1}, so
    P0^{-1} = 2^{14} at NIST-I on the source's own accounting. Then
    k = 2^{14}, k^{2/3} = 2^{9.33}, and the variant predicts
        MEMORY about 2^{101.8} (up 9.3 bits), TIME about 2^{101.8} (down 4.7 bits),
    with time and memory equal rather than separated by 14 bits. THE SAME
    ARITHMETIC AT NIST-III AND NIST-V IS PART OF THE DELIVERABLE and the ratios
    there are 2^{18.9} and 2^{22.9} from the published rows, giving different
    trade sizes, which is itself a check: the predicted shift must scale with the
    published ratio row by row, and if it does not, the model is wrong.

    (D) WHAT THIS DOES TO THE COMPARISON, HONESTLY AND IN BOTH DIRECTIONS. Under
    a TIME-ONLY functional the variant is better by 4.7 bits at NIST-I. Under the
    area-time functional AT it is WORSE, because memory rises by more than time
    falls (9.3 against 4.7). Under AT^2 it is worse still. The sign of the result
    is therefore convention-indexed, exactly as H-SSI-8ff06b and
    IDEA-20260805-bc8246 found for the published van Oorschot-Wiener curve, and
    this record inherits that finding rather than contesting it. What is new is
    that the variant produces a point that is NOT ON that curve: at memory
    2^{101.8} the published interpolation offers no better than 2^{106.5}, since
    memory beyond the claw-set size N buys nothing, while the variant offers
    2^{101.8}. So the deliverable is a new frontier point, with the honest note
    that it is on the wrong side of every memory-charging convention.

    (E) THE OBLIGATION THAT DECIDES IT, AND IT IS NOT THE ARITHMETIC. The extra
    targets have LARGER degree, so each is less likely to be B-smooth than the
    minimum was. The first-order calculation above ignores that degradation. The
    whole record therefore rests on measuring how the smoothness probability of
    the j-th successive minimum degrades with j, and the frozen source's own
    Section 4.2 experiment ALREADY COMPUTES THE LATTICE IT WOULD BE MEASURED IN
    and records only the shortest vector. Extending it to the first k vectors is
    a small change to a published SageMath pipeline at SQIsign NIST-I and NIST-V
    primes. If the degradation is subdominant the predicted shift holds; if it is
    not, the shift shrinks by a measured amount and the record says so.

  mechanism: >-
    TRACKED OBJECT. The SUCCESSIVE MINIMA SEQUENCE of the lattice Hom(E, E^{(p)})
    under the degree form -- not its first minimum, which is what the frozen
    source, IDEA-20260805-062bee and IDEA-20260815-ee8f82 all follow, but the
    vector (delta_1 <= delta_2 <= ... <= delta_k) together with the smoothness
    indicator of each. The object is followed as the table radius grows, and its
    observable is the pair (count of targets below the radius, fraction of them
    that are B-smooth).

    WHY THE OBJECT IS THE RIGHT ONE. Algorithm 3 is a rejection sampler whose
    acceptance probability is the probability that ONE integer is smooth. Every
    rejection sampler with a family of independent acceptance chances can trade
    attempts for chances, and the exchange rate is fixed by how the chances
    accumulate. Here the chances are the successive minima and the rate is a
    lattice-point count, so the trade is computable in closed form rather than
    tuned. Remark 1 of the frozen source states the phenomenon and declines to
    price it; this record prices it.

    LOSSY-PROJECTION TEST (algebraic, zero compute). The projection sends a curve
    to the multiset of the first k values of the degree form on its conjugate Hom
    lattice, discarding the lattice, the isogenies and the curve. It is lossy: the
    fibre is large because a degree multiset does not determine a lattice, let
    alone a curve. It is compatible with the operation applied -- enlarging the
    table radius -- because enlarging the radius extends the multiset by exactly
    the vectors in the annulus, so the retained data propagates deterministically
    and monotonically under the algorithm's own parameter change. It is not a
    change of coordinates because it forgets the isogeny that realises each
    degree, and recovering that isogeny is precisely the work the table does.

    THE VARIANT, STATED SO IT CAN BE PRICED. Replace Algorithm 3 by a single
    invocation of Algorithm 2 at split bound X' = X k^{1/3}, and accept a match
    against ANY of the conjugate keys rather than only the one realising the
    minimum -- which requires no code change at all, because Algorithm 2 already
    scans the whole table and returns on the first match found; the change is
    purely in the choice of X and in the analysis. The re-randomisation walk, its
    mixing assumption and the pullback composition all disappear. The returned
    endomorphism is of E itself rather than of a walked curve, which also removes
    the deg(omega)^2 inflation of the output.

