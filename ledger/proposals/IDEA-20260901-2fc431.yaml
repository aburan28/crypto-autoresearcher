  assumptions:
    - Algorithm 2 already returns on the first match found, so accepting any
      conjugate target is an analysis change and not an implementation change.
    - Enlarging X changes only B-dependent polynomial factors in the per-entry
      cost, so table size remains proportional to the covered degree.
    - The published Section 4.1 rows are internally consistent, so their
      time-to-memory ratios may be read as P0 inverse.

  object_first_candidate:
    established_families_off_limits: >-
      Off-limits as the primary lens: the first-minimum smoothness heuristic read
      as the only success channel, Delfs-Galbraith subfield descent, orientation
      and class-group vectorisation, Kani and torsion-image embeddings, CSIDH
      hidden shift, and higher-dimensional ascent.
    tracked_object: >-
      The successive minima sequence of Hom(E, E^{(p)}) under the degree form,
      with a smoothness indicator attached to each minimum.
    newness_score: >-
      A repackaging of Remark 1 as an OBJECT, which the record says plainly. What
      is new is the exchange rate, the collision derivation, and the concrete
      rebalanced point; the underlying phenomenon is the source's own.
    testability_score: >-
      Very high, and at cryptographic scale rather than toy scale, because the
      source's Deuring sampler already builds the lattice and reports only its
      shortest vector.
    survival_score: >-
      The object survives as long as the lattice-point count is in its linear
      regime, which is k up to about p^{o(1)} for the parameters of interest, and
      dissolves when the covered degree approaches p^{1/2} where the count law
      changes and the whole cost model breaks.

  proof_search_map:
    bottleneck: >-
      The factor P0 inverse multiplies the time and not the memory, so the
      algorithm's time and memory are separated by exactly that factor. Removing
      the separation is the step whose removal changes the concrete cost, and it
      is the only step in the whole analysis whose cost is paid in attempts
      rather than in storage.
    baseline_embedding:
      parameter_slice: >-
        k = 1. The exchange rate returns X' = X, memory M, time M times P0
        inverse, and the five Section 4.1 rows exactly. Every predicted shift is
        a multiplicative correction to that slice and must vanish at k = 1.
      reproduction_check: >-
        Frozen fixture. A short script recomputing M and M/P0 from the stated
        cost model must reproduce all five published rows to their stated
        precision before any k > 1 number is emitted. If it cannot, the
        time-to-memory ratio may not be read as P0 inverse and claim (C) is
        withdrawn.
    observation_collision:
      observable: >-
        The table key, i.e. the codomain curve, and downstream the pair
        (target count, smooth fraction).
      distinct_preimage_search: >-
        Searched and RESOLVED NEGATIVELY, which is result (A): two distinct table
        entries with the same key force a non-scalar endomorphism of degree at
        most X^2, which exists for only a p^{-1/2} fraction of curves. So the
        observable is injective on the table for almost every instance, and the
        implicit uniform-hash model in any collision-based analysis is wrong in
        the conservative direction. This is the rare case where the collision
        audit terminates with a proof of non-collision rather than with a
        counterexample, and it is recorded as such.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family from the single minimal conjugate
          isogeny to the first k minima, with k = 1 as the boundary case, and
          prove a STRICT inward improvement in time at a stated memory rather
          than merely that the larger family is nonempty.
        predicted_gain: >-
          Time down by P0^{-1/3}, memory up by P0^{-2/3}; at NIST-I, 4.7 bits and
          9.3 bits respectively. Strictness is testable because the boundary case
          is the published table.
      - transform: stronger_invariant
        proposed_object: >-
          Carry the whole successive-minima vector with its smoothness indicators
          rather than the single bit is-the-minimum-smooth, because the vector is
          what survives the parameter change while the bit does not.
        predicted_gain: >-
          Makes the degradation obligation of claim (E) a measured quantity
          instead of an unstated approximation.
    quantifier_order: >-
      for all p, for all k = p^{o(1)}, for a uniformly random supersingular E over
      F_{p^2}, the number of isogenies E -> E^{(p)} of degree at most
      (p/2)^{1/3} k^{2/3} is k^{1+o(1)} and at least one of them is B-smooth with
      probability k rho(u_k), where u_k depends on the enlarged degree. NOTE THE
      ORDER: k is chosen before E, so the variant is a uniform algorithm and not
      an instance-tuned one, and the smoothness parameter u_k must be recomputed
      at the enlarged degree rather than reused from the k = 1 analysis -- reusing
      it is precisely the error claim (E) warns against.
    method_ceiling:
      strongest_certifiable_claim: >-
        A constant-factor, convention-indexed rebalancing of the concrete cost of
        OneEnd over F_{p^2} at named parameter sets, conditional on H1 and H2.
        The method CANNOT certify any exponent change: the covered degree rises by
        k^{2/3} with k = p^{o(1)}, so the exponent is untouched by construction,
        and any presentation suggesting otherwise is a misreading.
      nearby_object_control: >-
        Apply the identical exchange-rate reasoning to a target for which the
        conclusion is known false, namely a uniformly random supersingular target
        E'' rather than E^{(p)}. There the relevant count law has a different
        exponent and the trade must come out different; if the same arithmetic
        returned the same 4.7-bit gain against a random target, it would be
        proving something the p^{1/2} baseline forbids and would be wrong.
    proof_obligations:
      - claim: k = 1 reproduces all five published Section 4.1 rows.
        responsibility: baseline
      - claim: Table size is proportional to covered degree at fixed B.
        responsibility: size
      - claim: Number of conjugate isogenies of degree at most Y is Y^{3/2} p^{-1/2+o(1)}.
        responsibility: success_probability
      - claim: >-
          Smoothness probability of the j-th minimum degrades slowly enough in j
          that k targets give success probability k rho(1+o(1)).
        responsibility: success_probability
      - claim: Time equals table size when k = P0 inverse, i.e. one attempt suffices.
        responsibility: runtime
      - claim: Memory equals table size, up by k^{2/3}.
        responsibility: memory
      - claim: >-
          Table keys are collision-free for all but a p^{-1/2} fraction of curves,
          so no hash-collision correction is needed.
        responsibility: correctness
      - claim: >-
          Removing the walk removes the mixing assumption but also removes the
          uniform-random-E hypothesis of Heuristic 1, so a per-curve heuristic is
          REQUIRED and is supplied as H1.
        responsibility: scope
      - claim: The exponent is unchanged; no exponent claim is made.
        responsibility: strictness
    not_applicable_reason: null

  predictions:
    - metric: >-
        number of vectors of the conjugate Hom lattice with degree at most
        Y, as a function of Y, measured over Deuring-sampled maximal orders
      direction: higher
      minimum_effect: >-
        Predicted to follow Y^{3/2} p^{-1/2} with a fitted slope in [1.35, 1.65].
        Outside that band the exchange rate is wrong and claim (B) fails
    - metric: >-
        probability that the j-th smallest conjugate isogeny degree is B-smooth,
        as a function of j, at fixed B and p
      direction: lower
      minimum_effect: >-
        Predicted to decrease slowly, with the k-target success probability
        staying within a factor 2 of k times the single-target probability for
        k up to 2^{14}. If it falls faster, the predicted time gain shrinks by the
        measured amount and the record reports the reduced figure
    - metric: >-
        predicted time and memory at log2 p of 256, 384 and 512, from the k
        chosen as the published time-to-memory ratio in each row
      direction: different
      minimum_effect: >-
        Predicted (time down, memory up) by (4.7, 9.3), (6.3, 12.6) and
        (7.6, 15.3) bits respectively, i.e. the shift must scale with the row's
        own ratio. A shift that does not scale row by row falsifies the model
    - metric: >-
        measured key collision rate in the table at toy primes
      direction: lower
      minimum_effect: >-
        Predicted ZERO collisions at every toy prime outside the p^{-1/2}
        exceptional set. A single unexplained collision falsifies derivation (A)
    - metric: >-
        area-time product AT of the variant divided by AT of the published point
      direction: higher
      minimum_effect: >-
        Predicted about 2^{4.6}, i.e. the variant is WORSE under AT. This
        prediction is stated because it is unflattering and because a model that
        only made favourable predictions would not be discriminating

  minimal_test:
    design: >-
      Stage 0, zero compute, hours. Recheck derivation (A); recompute the five
      Section 4.1 rows from the stated cost model as a frozen fixture; read the
      time-to-memory ratio off each row; compute the predicted shift per row.
      If the fixture fails, stop and file that as the result. Stage 1, the
      exchange rate at cryptographic scale. Modify the Section 4.2 Deuring
      pipeline to record, for each sampled maximal order, the first k vectors of
      the two-sided ideal of reduced norm p under Nrd/p rather than only the
      shortest, together with the largest prime factor of each. Run at
      p = 5*2^248 - 1 with 10^5 samples and p = 27*2^500 - 1 with 10^4 samples,
      the source's own parameters. Fit the count law and the per-index smoothness
      degradation. Stage 2, end-to-end at toy scale. Run the variant and the
      published algorithm on the same toy primes with the same seeds and measure
      the ratio of operations and of peak table size directly, rather than
      extrapolating. Stage 3, controls.
    controls:
      - >-
        NULL OBJECT, random target. Repeat stage 1 with the two-sided ideal
        replaced by a random rank-4 lattice of the same determinant, and with the
        conjugate target replaced by a uniformly random supersingular target in
        stage 2. The count law must shift to the random-target exponent and the
        predicted gain must NOT reproduce. This is also the nearby-object control.
      - >-
        NULL OBJECT TWO, shuffled minima. Permute the smoothness indicators
        across indices j while keeping the degrees. The k-target success
        probability must then equal k times the mean single-target probability
        exactly, which isolates how much of the measured effect is the
        degradation and how much is the count.
      - >-
        BASELINE ARM, k = 1. Stage 2 must reproduce the published algorithm's
        measured operation count at k = 1 before any k > 1 ratio is quoted.
      - >-
        DECAY CHECK. The measured time gain must GROW with k as k^{1/3} and the
        memory cost must grow as k^{2/3}. A gain that is flat in k is the
        artifact tell of docs/inventor-protocol.md section 3 and the run is
        rejected.
      - >-
        CONVENTION ARM. Report the verdict under time-only, AT and AT^2 side by
        side, using the charging register of H-SSI-8ff06b, so that the
        convention-indexed sign is visible in the result rather than chosen by
        the reader.
    required_metrics:
      - fitted exponent of the conjugate-lattice count law with interval, per prime
      - smoothness probability by minimum index j, with interval, per prime
      - measured k-target success probability against k times single-target
      - measured operations and peak table size, variant against baseline, per toy prime
      - measured key collision count in every table built
      - predicted and, where measurable, measured (time, memory) at the three published rows
      - verdict under each of the three cost functionals

  falsification_conditions:
    - >-
      The stage-0 fixture fails to reproduce the five published rows. The
      time-to-memory ratio may not be read as P0 inverse, claim (C) is withdrawn,
      and the record reports the fixture failure as its result.
    - >-
      The fitted count-law exponent lies outside [1.35, 1.65]. The exchange rate
      is wrong, and since three sibling records consume the same law, that
      failure is the most valuable single outcome available in this batch.
    - >-
      The per-index smoothness degradation is steep enough that the k-target
      success probability is below k/4 times the single-target probability at
      k = 2^{14}. The predicted time gain then shrinks to a measured smaller
      value, which is reported rather than suppressed; if it shrinks below one
      bit the variant is not worth implementing and the record says so.
    - >-
      Any unexplained key collision appears in a toy table outside the predicted
      exceptional set. Derivation (A) is false as stated and must be superseded.
    - >-
      The gain does not scale as k^{1/3} against memory k^{2/3}. Artifact tell;
      the measurement is rejected before any reading.
    - >-
      The random-target null reproduces the predicted gain. The arithmetic is
      proving too much and the model is wrong.

  confounders:
    - >-
      The published Section 4.1 numbers are, in the source's own words, a rough
      underestimation of the table size and cost while simultaneously possibly
      overestimating P0 inverse. Reading their ratio as P0 inverse therefore
      inherits BOTH biases, in opposite directions. The record must report the
      ratio as a derived quantity with that caveat attached, and the campaign's
      own corrected estimate (EV-SSI-59f7a2, 2^{118.5} to 2^{121.5}) gives a
      second, different ratio which must be reported alongside rather than
      instead.
    - >-
      Enlarging the covered degree changes the optimal B, so the comparison must
      re-optimise B for the variant rather than reuse the baseline's B. Failing to
      re-optimise would understate the variant.
    - >-
      Successive minima of a lattice are not independent, so treating the k
      smoothness events as independent overstates the success probability. The
      shuffled-minima null exists to bound that error.
    - >-
      At toy primes p^{1/3} and O(1) are not separated and P0 is close to 1, so
      k = P0 inverse is close to 1 and the stage-2 arm may have no dynamic range.
      The design must report the achievable k at each toy prime and discard arms
      where k is below 4.

  interpretation_limits:
    - >-
      NO EXPONENT IS MOVED. Time and memory remain p^{1/3+o(1)}. Any quotation of
      this record that omits that sentence is a misquotation.
    - >-
      The variant is WORSE under area-time and area-time-squared charging and
      better only under a time-only functional. The sign is convention-indexed
      and the convention is not settled by this record.
    - >-
      Removing the re-randomisation walk removes the uniform-random-curve
      hypothesis that Heuristic 1 of the frozen source quantifies over. The
      variant therefore depends on a strictly stronger per-curve assumption (H1),
      and it is NOT a free simplification.
    - >-
      The concrete figures are conditional on reading the published row ratios as
      P0 inverse, which the confounders section qualifies.
    - >-
      Scope is OneEnd over F_{p^2} at the three named SQIsign parameter sizes.
      Academic and defensive analysis only, per RQ-SSI-001 constraints.

  heuristic_assumptions:
    - id: H1
      statement: >-
        Let E be supersingular over F_{p^2} and let delta_1 <= delta_2 <= ... be
        the degrees of the isogenies E -> E^{(p)} in increasing order. Then
        (i) for Y in the range (p/2)^{1/3} <= Y <= p^{1/3+o(1)}, the number of
        such isogenies of degree at most Y is Y^{3/2} p^{-1/2+o(1)}; and
        (ii) for k = p^{o(1)}, the events that delta_1, ..., delta_k are B-smooth
        behave, with respect to their marginal probabilities, like the smoothness
        events of k independent uniformly random integers of the respective sizes
        delta_j, so that the probability that at least one is B-smooth is
        k rho(u_k)^{1+o(1)} with u_k computed at the enlarged degree.
      rigorous_support: >-
        Rigorous side. Hom(E, E^{(p)}) with the degree form is isometric to the
        two-sided ideal P of reduced norm p under Nrd/p (frozen source Section
        4.2, READ), and Theorem 1.5 (READ) pins its first minimum at p^{1/3},
        hence the determinant of the relevant traceless rank-3 sublattice at
        p^{1+o(1)}. Classical side. Part (i) imitates the Gauss-circle count for
        a positive rank-3 quadratic lattice, #{v : Q(v) <= Y} = Y^{3/2}
        det^{-1/2} + O(Y); part (ii) imitates Canfield-Erdos-Pomerance exactly as
        Heuristic 1 of the frozen source does, applied to k integers instead of
        one. H1 is therefore Heuristic 1 with the quantifier over one integer
        replaced by a quantifier over the first k, which is the smallest possible
        strengthening that supports the claim.
      validation_plan: >-
        Sampling. The frozen source's own Section 4.2 route, extended by two
        lines. Sample random maximal orders in B_{p,infinity} uniformly up to
        conjugation, compute the two-sided ideal P of reduced norm p, and instead
        of taking only the shortest vector, enumerate ALL vectors of norm at most
        (p/2)^{1/3} k^{2/3} using a standard short-vector enumeration, factor each
        norm, and record each largest prime factor. Scale. p = 5*2^248 - 1 with
        10^5 samples and p = 27*2^500 - 1 with 10^4 samples -- the source's own
        parameters, so part (i) at j = 1 must reproduce the source's own published
        figures exactly and that reproduction is the calibration. Comparison.
        Part (i) against Y^{3/2} p^{-1/2} on log-log axes with a fitted slope and
        interval. Part (ii) as an empirical CDF of the largest prime factor per
        index j against the Dickman-de Bruijn rho(u) with u = log(delta_j)/(3x),
        one curve per j, so the degradation with j is visible rather than
        averaged. Tail checks. For each j, the smoothest observed sample must be
        consistent with the predicted rho(u) at that value, the same check the
        source performs at j = 1 (12589-smooth against rho(u) about 1/69232 at
        NIST-I, and e^23-smooth against about 1/3312 at NIST-V). Transfer
        assumptions recorded. The sampler produces maximal orders rather than
        curves and identifies them up to conjugation; short-vector enumeration in
        a rank-4 lattice at these sizes is exact, so no additional approximation
        enters. Sampled parameters, sample counts and the enumeration radius are
        all recorded in the run artifact.
    - id: H2
      statement: >-
        For a uniformly random supersingular E over F_{p^2}, the fraction
        admitting a non-scalar endomorphism of degree at most M is
        M^{3/2} p^{-1+o(1)} for M up to p^{2/3}.
      rigorous_support: >-
        Rigorous side, RECALLED AND NOT VERIFIED THIS SESSION: the trace-zero
        part of End(E) is a rank-3 lattice of discriminant governed by p^2, whose
        first minimum is therefore about p^{2/3}. Classical side: the same
        Gauss-circle count as H1. H2 is used ONLY in derivation (A), to bound the
        exceptional set, and the derivation's qualitative conclusion (no
        collisions) survives any determinant within a polynomial factor of p^2.
      validation_plan: >-
        Direct, at toy scale and cheaply. Enumerate the supersingular graph at
        three toy primes, compute for every vertex the minimal non-scalar
        endomorphism degree by short-vector reduction of its Gross lattice via the
        Deuring correspondence, and fit the fraction below M against
        M^{3/2} p^{-1}. Separately and independently, build the actual Algorithm 2
        table at those primes and COUNT key collisions, which is a direct test of
        derivation (A) that does not go through H2 at all. The two arms must
        agree; if the count says collisions occur where H2 says they should not,
        H2 is refuted and the fitted exponent is reported.
    - id: H3
      statement: >-
        The time-to-memory ratio of each published Section 4.1 row equals P0
        inverse at that parameter size.
      rigorous_support: >-
        Read directly off the source's own cost model in Section 4.1, which
        states memory about M and time about M/P0. It is therefore not an
        assumption about mathematics but about the internal consistency of a
        published table, which is exactly why it is checkable.
      validation_plan: >-
        The stage-0 frozen fixture: recompute M and M/P0 from the stated model at
        each of the five sizes and check both against the published values. If
        they reproduce, H3 holds and the ratios may be used. If they do not, H3
        fails and every concrete figure in claim (C) is withdrawn while the
        exchange rate in (B) survives untouched -- the two are deliberately
        separated so that one can fail without the other.

  target_complexity:
    time_exponent: >-
      p^{1/3+o(1)}, UNCHANGED. The covered degree rises by k^{2/3} with
      k = p^{o(1)}, so the exponent is untouched by construction. The change is a
      reduction of the hidden factor from P0 inverse to P0^{-2/3}.
    memory_exponent: >-
      p^{1/3+o(1)}, UNCHANGED in exponent, increased in the hidden factor by
      P0^{-2/3}. Time and memory become equal rather than separated by P0 inverse.
    best_known: >-
      p^{1/3+o(1)} time and memory (frozen source Theorem 1.1), with the concrete
      points at least 2^{106.5} time and 2^{92.5} memory at log2 p about 256, and
      p^{1/2}(log p)^{O(1)} time at polynomial memory (Delfs-Galbraith).
    hidden_overhead: >-
      This record is ENTIRELY about the hidden overhead and says so. The o(1)
      contains the superpolynomial smoothness factor, and the proposal converts
      one power of it into two thirds of a power paid in memory. Nothing is
      hidden that is not the subject: the residual unknown is the per-index
      smoothness degradation of claim (E), which is measured rather than
      estimated.
    tradeoff_note: >-
      The variant produces a point at time equal to memory equal to about
      2^{101.8} at NIST-I, which is not on the published van Oorschot-Wiener
      interpolation, since that curve offers nothing better than 2^{106.5} once
      memory exceeds the claw-set size. Below that memory the vOW curve remains
      the frontier and the variant offers nothing. Parallelisation is unchanged
      and perfect. Under area-time and area-time-squared the variant is worse,
      by a predicted 2^{4.6} and 2^{-0.1} respectively, and those numbers are part
      of the deliverable.

  estimated_cost:
    implementation: low
    compute: medium
    detail: >-
      Stage 0 is a spreadsheet. Stage 1 is a two-line extension of a published
      SageMath pipeline plus a short-vector enumeration, and its compute is
      dominated by the 10^5 NIST-I samples, which the source already ran once, so
      the cost is known to be feasible on ordinary hardware. Stage 2 reuses
      existing toy tooling and the referenced proof-of-concept implementation.
      This is the cheapest of the five records filed this session and the only
      one whose main validation runs at cryptographic scale.

  deduplication:
    closest_existing:
      - id: IDEA-20260815-ee8f82
        difference: >-
          ee8f82 resamples Heuristic 1 concentrating on the SMOOTH TAIL of the
          first-minimum distribution rather than the bulk CDF. Its object is still
          delta_1 and its deliverable is a better-resolved tail for the SAME
          probability. This record changes which probability is being computed, by
          quantifying over the first k minima, and its deliverable is an algorithm
          variant with a predicted (time, memory) point. If ee8f82 runs first, its
          tail resolution improves this record's j = 1 curve and nothing else.
      - id: IDEA-20260808-8a6cb5
        difference: >-
          8a6cb5 asks whether tables can be AMORTISED ACROSS ATTEMPTS by measuring
          the autocorrelation of the smoothness success indicator along a walk,
          and its lever is called A7. This record REMOVES the attempts rather than
          amortising across them, and its lever is the lattice-point count within
          a single instance. The two are alternatives, not versions of each other,
          and they fail differently: 8a6cb5 fails if the indicator decays at the
          Ramanujan rate, this record fails if the per-index smoothness degrades
          steeply. Neither failure implies the other.
      - id: IDEA-20260815-86b09c
        difference: >-
          86b09c proposes MEASURING the table key collision rate against a
          uniform-hashing assumption. This record DERIVES the answer at zero
          compute in (A) -- collision-free outside a p^{-1/2} exceptional set --
          and folds the measurement in only as a check on that derivation. Where
          86b09c would report a rate, this record reports a reason.
      - id: IDEA-20260805-bc8246 and H-SSI-8ff06b
        difference: >-
          bc8246 applies three cost functionals to the ONE PUBLISHED time-memory
          curve and finds the sign convention-indexed. This record produces a NEW
          POINT that is not on that curve and then evaluates it under bc8246's own
          register. It consumes bc8246's finding and does not restate it; the
          convention arm of the minimal test is explicitly bc8246's instrument.
      - id: IDEA-20260803-48e258 and H-SSI-cd6f34
        difference: >-
          48e258 emits the crossover locus p*(w) of the published method against
          Delfs-Galbraith from already-committed numbers. That is a
          re-presentation of one algorithm's cost. This record changes the
          algorithm and would, if it holds, require p*(w) to be recomputed for the
          variant -- which is a downstream consequence and not an overlap.
      - id: IDEA-20260806-b60c35
        difference: >-
          b60c35 supplies the missing null arm for Heuristic 1 by sampling matched
          random primes rather than the two deployed SQIsign primes. Its object is
          the PRIME, and its concern is that the heuristic's only evidence sits at
          two special primes. This record's object is the MINIMUM INDEX at fixed
          prime. The two are orthogonal and should ideally run in one campaign,
          since both modify the same Section 4.2 pipeline.
      - id: IDEA-20260806-62ba9d
        difference: >-
          62ba9d charges the OneEnd to EndRing to Isogeny reductions and asks what
          the campaign's headline number is a number about. Cost-model work on the
          reduction network. This record does not touch the network and its output
          is a OneEnd figure that would feed 62ba9d's ledger as a new input.
    not_a_restatement_of: >-
      Not a restatement of Remark 1 of the frozen source, although Remark 1 is its
      nearest prior art and the record says so first rather than last. Remark 1
      states that multiple small isogenies exist and that only one need be smooth,
      and then declines to price the effect on the ground that it is absorbed in
      the asymptotic. What is added here is the exchange rate k^{2/3} against k,
      the observation that setting k = P0 inverse eliminates the re-randomisation
      loop entirely, the resulting concrete point, the collision-freeness
      derivation, and the successive-minima heuristic with a crypto-scale
      validation route. None of that is in the remark and none of it is in the
      corpus.

  dominated_by: >-
    Not dominated on the time axis at its own memory point, and dominated
    everywhere else. Checked against every frontier row this program records:
    (i) the published p^{1/3+o(1)} point, at least 2^{106.5} time and 2^{92.5}
    memory at NIST-I -- the variant is BETTER in time by a predicted 4.7 bits and
    WORSE in memory by 9.3 bits, so neither dominates the other and both are on
    the frontier under a time-only functional; under AT and AT^2 the published
    point dominates; (ii) Delfs-Galbraith p^{1/2}(log p)^{O(1)} at polynomial
    memory -- dominates the variant on memory by a far larger margin than it
    dominates the incumbent, so the variant moves AWAY from the deployable
    region; (iii) van Oorschot-Wiener p^{1/2+o(1)}/w^{1/2} at memory w --
    dominates the variant at every w below the claw-set size and is dominated by
    it above; (iv) the campaign's own corrected concrete estimate EV-SSI-59f7a2 at
    2^{118.5} to 2^{121.5} -- the variant's shift applies to it multiplicatively
    and the corrected row must be recomputed rather than reused. No data or query
    axis applies. dominated_by is therefore NOT null and is qualified per axis.
  sota_delta: >-
    Exponent delta +0, stated plainly and unconditionally. Concrete delta,
    conditional on H1, H2, H3 and on the per-index degradation being subdominant:
    at log2 p about 256, time from at least 2^{106.5} to about 2^{101.8}, a gain
    of about 4.7 bits, against memory from at least 2^{92.5} to about 2^{101.8},
    a loss of about 9.3 bits; at 384 the predicted pair is 6.3 bits gained and
    12.6 lost; at 512 it is 7.6 gained and 15.3 lost. Under area-time the delta is
    NEGATIVE by about 4.6 bits at NIST-I. The record's honest summary is that it
    buys time with memory at a fixed and now-computable rate, in a lane where this
    program's own decision record names memory as the binding constraint -- so its
    principal value is the successive-minima law and the collision derivation,
    both of which three sibling records consume, rather than the trade itself.

  recommended_priority: medium
