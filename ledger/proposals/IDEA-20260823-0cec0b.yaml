idea:
  id: IDEA-20260823-0cec0b
  title: Finite-subgroup orbit membership through a typed Lattes orbit product
  class: algorithm
  claim: >-
    For an odd prime-order subgroup generated by P, the orbit product
    V_(P,H) gives an exact Boolean test for membership in the signed
    multiplicative orbit +/-H P after identity and quotient branches are
    separated. A shift-search plus a charged H-restricted discrete logarithm
    would beat generic square-root time only if a public-input evaluator has
    online exponent beta < 1/2 and its construction, storage, traffic,
    amortization, recovery, and verification costs also fit below the same
    end-to-end bound. This batch does not establish such an evaluator. It
    establishes only that explicitly materialized root, dense-coefficient,
    leaf-explicit product-tree, and per-coset table representations require
    Omega(D) field-word output, construction writes, and artifact traffic,
    up to the signed-quotient factor, so that representation class alone
    cannot yield a strict single-target sub-rho result.
  mechanism:
    instance: >-
      Let E be an ordinary elliptic curve over F_q, let P have exact odd
      prime order ell, let Q=[u]P, and let H=<m> be the public subgroup of
      F_ell^* of order D. Put S=H intersect {+1,-1}, s=|S|, N=D/s, and use
      the canonical quotient coordinate x:E/{+/-1}->P^1.
    predicate: >-
      The monic squarefree polynomial V_(P,H)(Z)=product_(h in H/S)
      (Z-x([h]P)) vanishes at x(R) exactly when a nonidentity R in <P>
      lies in +/-H P. The identity is handled before x is evaluated.
    recovery: >-
      For public shifts a, test R_a=Q-[a]P. A hit is followed by a fully
      charged H-restricted discrete logarithm, sign disambiguation, candidates
      u=a+/-h, and direct verification [u]P=Q.
    proposed_escape: >-
      Seek a public-input implicit or transposed Lattes, Cauchy, cyclic
      resolvent, modular-composition, or elliptic-net evaluator that does not
      emit or read one field-word record per signed coset. No such constructor
      is supplied or inferred here.
  nonduplication: >-
    The prior B68 lane bounded generic scalar rational-circuit degree after
    typing repairs. This proposal instead asks about a finite public torsion
    orbit and explicitly couples a Boolean membership predicate to recovery
    and total target accounting. Its retained negative statement is limited
    to representations whose syntax materializes every root, coefficient,
    leaf, or coset record.
  novelty_status: unverified
  citations:
    - ref: ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-e2540b.yaml
      provenance: internal
      verified_by: coordinator:/root
      supports: Coordinator-supplied boundary between the B68 generic rational-map lane and this finite-orbit lane
    - ref: ledger/evidence/EV-ECDLP-0c0f51.yaml
      provenance: internal
      verified_by: coordinator:/root
      supports: Coordinator-supplied statement that B68 retained only a conditional degree envelope after typing repairs
    - ref: ledger/decisions/DEC-20260823-a090bf.yaml
      provenance: internal
      verified_by: coordinator:/root
      supports: Coordinator-supplied B68 revise and select-none disposition
    - ref: ledger/FINDING-PF-IC-001.md
      provenance: internal
      verified_by: coordinator:/root
      supports: Coordinator-supplied requirement to charge preprocessing and representation costs
    - ref: standard elliptic-curve quotient fact x(R)=x(-R) for nonidentity points
      provenance: recalled
      supports: pointer for independent source retrieval; not used as retrieved novelty support
  assumptions:
    - ell is an odd prime and P has exact order ell.
    - P, Q, m, D, the base field, required extension field, and coordinate normalization are public and validated.
    - H=<m> has certified order D dividing ell-1.
    - Preprocessing is independent of the fresh target Q and of later shifts.
    - A uniform shift makes u-a uniform in F_ell; deterministic shift schedules require a separate coverage statement.
    - Field operations, field-word reads and writes, memory, and artifact traffic are all charged.
  proof_search_map:
    exact_baseline: >-
      Construct all N signed-coset roots, multiply them into V, evaluate V
      directly, sample or enumerate shifts, and run a square-root restricted
      DLP on a hit.
    observation_collision_search: >-
      Prove x([h]P)=x([k]P) iff h=+/-k mod ell under the stated branches;
      audit collisions caused by sign, identity, 2-torsion, extension fields,
      repeated roots, and coordinate normalization.
    quantifier_order: >-
      Declare an infinite or otherwise nonempty family of tuples
      (E/F_q,ell,P,m,H), construct preprocessing before fresh Q and shifts,
      and quantify target count and randomness before claiming an exponent.
    constructive_transform: >-
      A positive result must give an explicit public-input algorithm producing
      the evaluator state and its query algorithm without an undeclared root,
      coefficient, oracle, or per-coset table.
    method_ceiling: >-
      Count output words and memory traffic for explicit representations and
      test the same claimed compression on a random D-subset and a generic
      rational-map orbit where no subgroup structure is available.
    nearby_object_control: >-
      Roots of unity and degree-one sparse maps are positive controls; a
      random same-size subset and generic rational map are proves-too-much
      controls.
  predictions:
    - The typed V predicate agrees exactly with signed-orbit membership on nonidentity points.
    - A root list, dense coefficient vector, leaf-explicit product tree, or per-coset table contains Omega(N) field-word records by definition.
    - For one target, Omega(D) setup plus Omega(ell/D) constant-cost membership attempts has minimum Omega(sqrt(ell)) over 1<=D<=ell-1, ignoring only fixed signed-quotient constants.
    - A strict improvement can survive only through an implicit representation with beta<1/2 and acceptable preprocessing amortization, or through a different recovery mechanism; neither is currently established.
  minimal_test:
    boundary: zero-run symbolic and representation audit
    steps:
      - Type the quotient predicate and all exceptional branches.
      - Supply a public-input constructor and query algorithm for one declared implicit representation family.
      - Count field operations, word writes, word reads, memory, traffic, targets, retries, restricted recovery, sign handling, and verification.
      - Compare roots-of-unity, random-subset, generic-map, supplied-table, and quotient-boundary controls.
    required_artifacts:
      - constructor pseudocode or a formal scoped impossibility statement
      - exact cost table with target amortization
      - collision and boundary audit
      - blind cost statement packet
  falsification_conditions:
    - A valid in-scope counterexample to the typed membership equivalence falsifies the predicate claim.
    - An explicit representation meeting the declared materialized syntax while using o(N) distinguishable field-word records falsifies the scoped output-size statement.
    - Any charged preprocessing, query, recovery, memory, or traffic term with exponent at least 1/2 in ell falsifies a strict sub-rho end-to-end claim for that parameter family.
    - Failure to exhibit a nonempty admissible family with D dividing ell-1 falsifies an asymptotic instantiation, not the algebraic predicate.
  confounders:
    - Treating supplied roots or coefficients as free input
    - Amortizing preprocessing over an undeclared number of targets
    - Reporting a Boolean membership oracle without charging scalar recovery
    - Counting H rather than +/-H or mishandling -1 in H
    - Evaluating x at the identity or ignoring field-extension traffic
    - Inferring an implicit-evaluator lower bound from an explicit-output lower bound
  interpretation_limits:
    - No generic-group or algebraic-circuit lower bound is claimed.
    - No public-input beta<1/2 evaluator is constructed.
    - No practical attack, supported speedup, novelty, closure, or breakthrough is claimed.
    - The negative result applies only to the four explicitly materialized representation families defined in the task artifacts.
    - Multi-target amortization remains open and must disclose target count and shared state.
  heuristic_assumptions:
    - Uniform-shift hit counts use the random-shift model; exact deterministic coverage is not inferred.
    - The restricted-DLP square-root cost is a baseline, not a proved lower bound.
  target_complexity:
    query: C_query(D)=D^beta times polylogarithmic factors, with required beta<1/2
    recovery: C_recover(D)=D^(1/2) times polylogarithmic factors under the baseline
    expected_attempts: ell/|+/-H|=ell/(sD) under uniform independent shifts
    balanced_exponent: 1/(3-2*beta) when query and recovery dominate
    preprocessing: C_pre(D)/T for T explicitly declared targets
    memory: must be reported separately and remain within the claimed profile
    current_certified_delta: no strict improvement over the generic square-root exponent
  estimated_cost:
    current_batch:
      experiments: 0
      implementations: 0
      evidence_type: symbolic_and_representation_audit_only
    future_gate: no implementation or experiment until an explicit constructor and complete cost contract exist
  recommended_priority: retain_only_if_a_succinct_public_input_constructor_or_new_recovery_argument_is_supplied
