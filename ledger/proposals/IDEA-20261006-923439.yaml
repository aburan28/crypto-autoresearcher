idea:
  id: IDEA-20261006-923439
  question_id: RQ-TORS-8c7b79
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Irreducible-factor count of the 7-division polynomial on y^2=x^3+x+1 over F_23 versus its quadratic twist
  class: measurement
  claim: >-
    REPRESENTATION AND STAGE. The variable of the 7-division polynomial
    is the affine x-coordinate, R1 as read in RQ-ECDLP-623a32. This is
    not a degree-d function used as a point representation, and it is
    not a Kummer line. No attack-stage cost is claimed to change. The
    discrete-log exponent delta versus Pollard rho is 0. Let p=23 and
    let E be y^2=x^3+x+1 over F_p. Let c be the smallest nonsquare in
    F_p, found by squaring every field element. Let E^c be
    y^2=x^3+c^2 x+c^3. Let I(C) be the number of irreducible factors,
    counted with multiplicity, of the monic 7-division polynomial of C
    in F_p[x]. The claim is that |I(E)-I(E^c)| is at least 1, after
    both discriminants are checked nonzero and the c=1 control is
    checked equal. Two explanations are discriminated. E-orbit:
    negating the trace changes the orbit sizes of Frobenius on the
    x-coordinates of the 7-torsion, so the factor counts differ.
    E-scale: an F_p-rational change of the x-coordinate identifies the
    two factorizations, so the counts agree. Agreement is the negative.
    This is not a Legendre symbol of a division polynomial, not a
    torsion-field comparison of j=0 with this cubic, and not a
    discrete logarithm.
  mechanism: >-
    OBJECT FRAME. The representation is the monic 7-division polynomial
    in the x-line (R1 as the coordinate, packaged as one polynomial).
    The operation set Sigma is the Frobenius x |-> x^p acting on the
    roots, not translation on E(F_p). Trichotomy: partial-action. The
    irreducible-factor degrees are the orbit lengths of the subgroup
    generated by Frobenius on the roots, which is a block system of
    that action. Translation by a generic point does not preserve the
    7-torsion. LOSSY PROJECTION. The projection discards the roots and
    the coefficients and keeps one integer, the factor count. Many
    polynomials share a count, so it is lossy. The discard is
    compatible with Frobenius because orbit lengths are constant on
    Frobenius orbits. It is not compatible with the full translation
    action, which is not Sigma. F2, a factor base, is not the lens.
    The division polynomial is not a summation polynomial and is not a
    relation. F4, a pairing transfer, is not used. PRICED OPEN NUMBER.
    |I(E)-I(E^c)|. No KN-OPEN-020 factor base is proposed.
  novelty_status: unverified
  citations:
    - ref: RQ-TORS-8c7b79
      provenance: internal
      claim: >-
        The question asks whether ell-torsion as a Galois module, read
        through division-polynomial factorization, carries publicly
        computable information about a discrete log. A curve-only
        statistic is k-independent. Toy evidence is capped.
      verified_by: idea-generator 2026-10-06 read ledger/questions/RQ-TORS-8c7b79.yaml
    - ref: KR-IC-955fd6
      provenance: internal
      claim: >-
        Small-order torsion and S_m symmetry are used to shrink
        point-decomposition systems on extension-field curves. The row
        is a PDP cost claim, not a factor count of psi_7 over a prime
        field.
      verified_by: idea-generator 2026-10-06 read knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        Semaev's S_m vanishes on x-coordinates of points that sum to
        the identity, with degree 2^{m-2} in each variable. Using S_m
        as a decomposition engine is the index-calculus framework.
      verified_by: idea-generator 2026-10-06 read knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Naive Semaev index calculus over prime fields is proved, under
        stated statistical assumptions, not to beat generic algorithms.
      verified_by: idea-generator 2026-10-06 read knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
    - ref: Silverman, division polynomials psi_n
      provenance: recalled
      claim: >-
        For odd n the monic polynomial whose roots are the
        x-coordinates of the nonzero n-torsion has degree (n^2-1)/2.
        For n=7 that degree is 24. The book was not opened here.
      verified_by: null
  assumptions:
    - >-
      p=23. For A=1 and B=1, 4A^3+27B^2=31 and 31 mod 23 is 8, not 0,
      so E is nonsingular. The twist discriminant is checked in the
      test and is not precomputed here.
    - >-
      The quadratic twist model is y^2=x^3+A c^2 x+B c^3 with A=1 and
      B=1. If c is a square this model is F_p-isomorphic to E. The
      claim uses a nonsquare c.
    - >-
      I(C) counts irreducible factors with multiplicity. A square-free
      factorization that drops multiplicity is a different integer and
      does not score the claim.
    - >-
      The 7-division polynomial is separable of degree 24 on these
      models. A different degree means the instrument built the wrong
      polynomial, and the claim is not scored.
  proof_search_map:
    not_applicable_reason: >-
      This is a comparison of two factor counts at one prime. It is
      not a proof that torsion data reveals a discrete logarithm, and
      the question's own decision target says a curve-only statistic
      is k-independent.
    bottleneck: >-
      The gap |I(E)-I(E^c)|. The trace a_p is a different integer and
      is recorded only as a twist check.
    baseline_embedding:
      parameter_slice: "p=23, E: y^2=x^3+x+1, twist by the smallest nonsquare, ell=7"
      reproduction_check: >-
        Degree of each polynomial is 24, each root's corresponding
        point satisfies [7]P=O when a y-coordinate exists in an
        extension, and the c=1 model returns the same factor count as E.
    observation_collision:
      observable: I(C)
      distinct_preimage_search: >-
        E and E^c are two models. If their factor counts agree, the
        observable collides and E-scale holds for this pair.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the Frobenius orbits on the roots of psi_7
        predicted_gain: the two factor counts differ by at least 1, or they do not
    quantifier_order: >-
      Exists one nonsquare c in F_23, the smallest one, such that the
      factor counts differ by at least 1. Not for every curve and not
      for every ell.
    method_ceiling:
      strongest_certifiable_claim: >-
        At p=23 and ell=7 the two factor counts differ, or they agree.
        No discrete log is certifiable. The statistic does not depend
        on a secret scalar.
      nearby_object_control: >-
        For c=1, which is a square, the twisted model is the original
        equation and the factor counts must agree. A disagreement
        falsifies the instrument. That control is the known-equal
        object. It is not the claim.
    proof_obligations:
      - claim: I(C) is the multiplicity-weighted irreducible-factor count of the monic 7-division polynomial.
        responsibility: correctness
  predictions:
    - metric: absolute difference of I(E) and I(E^c) for c the smallest nonsquare in F_23
      direction: different
      minimum_effect: at least 1
  minimal_test:
    design: >-
      Build the monic 7-division polynomial of E and of E^c over F_23.
      Factor both in F_23[x]. Also build the c=1 model and factor it.
      Compute both traces from the point counts and check that the
      twist trace is the negative of the original trace.
    controls:
      - >-
        Square control: c=1 must give I equal to I(E). Inequality
        invalidates the instrument.
      - >-
        Degree control: both claim polynomials have degree 24.
        Otherwise the polynomial is wrong and the claim is not scored.
      - >-
        Twist-trace control: a_p(E^c)=-a_p(E). A different relation
        means the model is not the quadratic twist, and the claim is
        not scored.
      - >-
        Nonsquare control: c is the smallest field element that is not
        a square, found by enumerating squares. Using a square here
        repeats the c=1 control and does not score the claim.
    required_metrics:
      - I(E), I(E^c), and I of the c=1 model
      - the degree of each polynomial
      - a_p(E) and a_p(E^c)
      - the integer c
  falsification_conditions:
    - I(E) equals I(E^c). That equality is the negative.
    - The c=1 factor count differs from I(E), so the instrument is invalid and the claim is not established.
    - Either polynomial has degree different from 24.
    - a_p(E^c) is not equal to -a_p(E), so the second curve is not the twist and the claim is not established.
    - Either discriminant is 0.
  confounders:
    - >-
      A repeated factor changes the multiplicity-weighted count
      relative to a square-free count. The definition fixes
      multiplicity, and a writeup that drops it is a different
      measurement.
    - >-
      The factor count can differ because the polynomials were built
      from different recurrence conventions. The degree and the c=1
      control are the checks.
    - >-
      Matching traces of opposite sign do not by themselves force the
      factor counts to differ. That implication is the claim under
      test, not an assumption.
  interpretation_limits:
    - >-
      The statistic is computed from the curve equation alone. It does
      not depend on a secret scalar k. RQ-TORS-8c7b79 says a curve-only
      statistic is k-independent, and this record does not contradict
      that sentence.
    - >-
      KR-IC-5931ee and KR-IC-9e610d say prime-field index calculus, as
      surveyed, does not beat rho. A factor-count gap is not a
      summation-polynomial attack and does not move that conclusion.
      The discrete-log exponent delta is 0.
    - >-
      No factor base, relation, or descent is defined. KN-OPEN-020 is
      not entered.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The multiplicity-weighted factor count of psi_7 for this twist
        pair differs by at least 1, while a uniform random pair of
        monic degree-24 polynomials over F_23 has a factor-count gap
        whose distribution is the one being imitated only as a null,
        not as a model of Frobenius.
      rigorous_support: >-
        Frobenius on the 7-torsion satisfies its characteristic
        polynomial X^2-tX+p. Orbit lengths on x-coordinates are
        constrained by that matrix together with the identification of
        P and -P. A random polynomial is not constrained by a 2-by-2
        matrix. The matrix constraint is the proved structure; the
        random polynomial is the null distribution.
      validation_plan: >-
        Factor psi_7 for E and for E^c at p=23. Draw 30 uniform random
        monic degree-24 polynomials over F_23, record their
        multiplicity-weighted factor counts, and place I(E) and I(E^c)
        against that sample's minimum and maximum. Then repeat the
        twist comparison at p=29 for the same coefficient pair, ell=7
        still, and record whether the gap stays nonzero. A gap that is
        inside the random sample at both primes and is zero at p=29
        fails the claim's transfer off p=23. No cryptographic prime is
        used.
  target_complexity:
    time_exponent: >-
      Factoring one degree-24 polynomial over F_23 is polynomial in
      that fixed degree. The discrete-log exponent stays 1/2. Delta
      versus Pollard rho is 0.
    memory_exponent: O(1) relative to p; the polynomial has 25 coefficients.
    best_known: >-
      Pollard rho at Theta(N^{1/2}) group operations on E(F_23)
      (KR-RHO-13bf67, read for the exponent). Prime-field Semaev
      index calculus does not beat that generic cost under the
      assumptions of KR-IC-5931ee.
    hidden_overhead: >-
      No o(1) attack term. The division polynomial is not a relation
      collector.
    tradeoff_note: >-
      No time-memory tradeoff. The output is one integer gap.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: low
  dominated_by: >-
    As a discrete-log method this factor count is dominated by Pollard
    rho and, on the index-calculus side, by the negative result that
    naive prime-field Semaev does not beat generic algorithms. The rows
    read were KR-IC-955fd6, KR-IC-5a43e5, KR-IC-5931ee, and
    KR-IC-9e610d. Torsion symmetry there is a PDP reduction on
    extension fields; S_m is a different polynomial; the survey
    consensus is that prime-field ECDLP has no known attack better than
    rho. None of those rows states I(psi_7) for a curve and its twist,
    so they do not dominate the integer comparison. They dominate any
    reading of the gap as an attack.
  sota_delta: >-
    Discrete-log time-exponent delta versus Pollard rho is 0. Rho on
    this 5-bit field is Theta(N^{1/2}) group operations. The factor
    count costs one degree-24 factorization and does not multiply or
    divide that rho cost. The numerical gap claimed is an integer of
    absolute value at least 1, not a speedup factor.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/index-calculus
    rows_checked:
      - KR-IC-955fd6
      - KR-IC-5a43e5
      - KR-IC-5931ee
      - KR-IC-9e610d
    nearest:
      - ref: KR-IC-955fd6
        provenance: internal
        relation: adjacent
        delta: >-
          That row's torsion symmetry is a factor about 2^{omega(n-1)}
          on extension-field point decomposition. The PDP exponent
          delta claimed here is 0. The new integer is a factor count
          of psi_7 over F_23.
      - ref: KR-IC-5a43e5
        provenance: internal
        relation: orthogonal
        delta: >-
          S_m has degree 2^{m-2} in each variable. psi_7 has degree
          (49-1)/2=24 and is not S_m. No decomposition-cost delta is
          claimed; the delta is 0.
      - ref: KR-IC-5931ee
        provenance: internal
        relation: orthogonal
        delta: >-
          Naive prime-field Semaev does not beat generic algorithms
          under the row's statistical assumptions. This record does
          not run Semaev. The discrete-log exponent delta is 0. The
          frontier match ranked this row first.
    searched:
      corpus_grep:
        - >-
          ledger/proposals IDEA-*.yaml for 7-division polynomial,
          psi_7, and twist division polynomial: no matches of this
          factor-count comparison
