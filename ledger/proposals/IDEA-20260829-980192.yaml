  assumptions:
  - The supersingular set over F_{p^2} has cardinality p/12 + O(1) and the
    subfield locus S_p has cardinality Theta(sqrt p). Recalled from
    Delfs-Galbraith; verified in the experiment by direct enumeration at every
    tested p before any exponent is fitted.
  - The number of distinct codomains of cyclic isogenies of degree at most a from
    a fixed supersingular curve is Theta(a^2) with constants bounded independently
    of p. Measured, not assumed, at every tested p.
  - Exhaustive construction of the full supersingular ell-isogeny graph is
    feasible for p up to about 10^6 (roughly 10^5 vertices) in SageMath within
    the stated budget.

  proof_search_map:
    bottleneck: >-
      In Wesolowski's Algorithm 2 the memory cost is the keyed table L, of size
      Psi(X,B) X^{1+o(1)} = p^{1/3+o(1)}. The bottleneck removed by the midpoint
      structure is the table itself: when the split midpoint is Frobenius-fixed,
      the collision test "is (E')^{(p)} a key of L" degenerates to the per-node
      predicate "is j(E') in F_p", which needs no table. The cost that replaces
      it is the degree budget required to reach a Frobenius-fixed midpoint, and
      that is exactly a_min^2.
    baseline_embedding:
      parameter_slice: >-
        beta = 1/2 reproduces plain Delfs-Galbraith exactly: a_min = p^{1/2} means
        the "midpoint" is reached only by walking onto S_p itself, degree budget
        p, table-free, time p^{1/2}. beta = 1/4 reproduces the equidistribution
        prediction and also lands at p^{1/2} time. The Wesolowski baseline is NOT
        a parameter slice of this family - it is a different algorithm (tabled
        claw), and the two are compared on the (time, memory) plane, not by
        embedding.
      reproduction_check: >-
        Frozen regression fixture: re-derive delta_E for the three Autolab sharp
        primes (211,4), (1811,9), (9623,16) by independent exhaustive enumeration
        and require exact agreement with the published AOV table values quoted in
        the EXP-ALISO-003 contract. Disagreement on any of the three halts the
        experiment as an implementation error, not as evidence.
    observation_collision:
      observable: >-
        a_min(E), the least cyclic-isogeny degree from E to a curve with
        F_p-rational j-invariant.
      distinct_preimage_search: >-
        Two curves with equal a_min can sit on opposite sides of the conclusion:
        one whose least conjugate degree delta_E equals a_min^2 (midpoint
        structure is optimal for it) and one whose delta_E is far below a_min^2
        (midpoint structure is strictly wasteful for it). Both are expected to
        exist, so a_min alone does NOT identify the least conjugate degree. The
        additional condition that separates them is delta_E itself, which must be
        computed alongside a_min at every tested vertex. This collision is why
        the experiment measures the JOINT distribution of (a_min, delta_E) and
        not a_min alone; reporting a_min without delta_E would be an
        identifiability failure.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        The fibre of the map E -> a_min(E), with the forgotten structure being
        the position of E relative to the Frobenius fixed locus. The intrinsic
        invariant separating fibre members is delta_E / a_min^2.
      predicted_gain: >-
        Identifies the sub-population, if any, on which the midpoint route is
        optimal, and measures its density. A density of p^{-c} with c > 0 turns
        the positive branch back into a negative one by rerandomization cost.
    - transform: representation_reduction
      proposed_object: >-
        Replace "find a smooth isogeny E -> E^{(p)}" by "find a short path to the
        Frobenius fixed locus", moving the hypothesis to an exact graph-distance
        condition with a per-node decision predicate.
      predicted_gain: >-
        Memory drops from p^{1/3+o(1)} to poly(log p) unconditionally; the entire
        question becomes the single exponent beta.
    quantifier_order: >-
      For all epsilon > 0 there exists p_0 such that for all primes p > p_0, for
      a uniformly random supersingular E/F_{p^2}, with probability 1 - o(1) we
      have p^{beta - epsilon} <= a_min(E) <= p^{beta + epsilon} for a single
      constant beta independent of p and of E. Note the order: beta may NOT
      depend on the instance. A per-instance beta - i.e. a heavy-tailed a_min
      whose median and mean scale differently - falsifies the uniform claim even
      if the median exponent is small, and the experiment therefore reports
      median, mean and the 1st-percentile of a_min separately.
    method_ceiling:
      strongest_certifiable_claim: >-
        An exhaustive toy-scale enumeration can certify the joint empirical
        distribution of (a_min, delta_E) over the FULL supersingular set at each
        tested p, and a fitted exponent with a confidence interval across the
        ladder. It cannot certify the asymptotic value of beta, and it cannot by
        itself certify any complexity statement at cryptographic p.
      nearby_object_control: >-
        The CM-terminal enlargement of eprint 2026/1516 is the nearby object on
        which the hoped-for conclusion fails: enlarging the terminal set from
        Theta(sqrt p) to Theta(M^{3/2}) is reported there NOT to change the
        Delfs-Galbraith exponent. So a small beta cannot arise from making the
        target set bigger; it can only arise from correlation between the graph
        metric and the Frobenius fixed locus. Any measured beta below 1/4 that
        also appears in the RANDOM-SUBSET control is therefore an artifact of the
        ball-size model, not a property of S_p, and must be reported as such.
    proof_obligations:
    - claim: 'a_min balls have size Theta(a^2) at the tested p, with the constant measured.'
      responsibility: size
    - claim: 'The equivalence in (A) holds as stated for Frobenius-doubled isogenies, including the cyclicity side condition.'
      responsibility: correctness
    - claim: 'beta is uniform across the supersingular set at each tested p (median, mean and tail agree in exponent).'
      responsibility: success_probability
    - claim: 'Time of the midpoint-restricted algorithm is p^{2 beta + o(1)} with memory poly(log p).'
      responsibility: runtime
    - claim: 'The random-subset null reproduces beta = 1/4; any deviation of the real S_p from the null is the whole finding.'
      responsibility: baseline

  predictions:
  - metric: >-
      beta, the fitted exponent of the median of a_min(E) against log p, over a
      ladder of at least five primes p with 10^3 < p < 10^6
    direction: different
    minimum_effect: >-
      The 95% confidence interval for beta must exclude at least one of the two
      decision values 1/4 and 1/6. A CI of half-width above 0.04 is an
      inconclusive run, not a negative one.
  - metric: >-
      beta_null, the same exponent computed with S_p replaced by a uniformly
      random subset of the supersingular set of identical cardinality, same seeds
    direction: higher
    minimum_effect: >-
      beta_null - beta >= 0.03 is the threshold for calling the Frobenius fixed
      locus atypically close; |beta_null - beta| < 0.01 across the ladder is a
      controlled null and closes the positive branch.
  - metric: >-
      the ratio delta_E / a_min(E)^2 over the full supersingular set, reported as
      a distribution
    direction: lower
    minimum_effect: >-
      Median ratio below 0.5 at every tested p confirms that the midpoint route
      is strictly wasteful for the typical curve. A median at or above 1.0 would
      mean the Frobenius-doubled isogeny is typically the minimal one, which
      would be a surprise and would reopen the family.
  - metric: >-
      fraction of the supersingular set for which the Frobenius-doubled composite
      has NON-cyclic kernel at the witnessing a_min
    direction: lower
    minimum_effect: >-
      Above 0.5 the identification in (A) is operationally void even where it is
      formally true, and the whole family closes on cyclicity rather than on
      density. This is the Autolab contract's own stated null hypothesis and must
      be measured, not assumed.

  minimal_test:
    design: >-
      For each prime p in a ladder of at least five values spanning 10^3 to 10^6
      (chosen so the supersingular set is fully enumerable), build the complete
      supersingular 2-isogeny and 3-isogeny graph over F_{p^2} in SageMath from
      the supersingular polynomial. Identify S_p exactly by testing j in F_p.
      For EVERY supersingular vertex E compute (i) a_min(E) by breadth-first
      search in cyclic-isogeny degree until a vertex of S_p is met, (ii)
      delta_E, the least degree of any isogeny E -> E^{(p)}, by the same
      enumeration against the conjugate vertex, and (iii) whether the
      Frobenius-doubled composite at a_min has cyclic kernel. Fit beta from the
      medians across the ladder. Repeat the whole computation with S_p replaced
      by 20 independent uniformly random subsets of equal cardinality to obtain
      beta_null and its spread. Report the joint (a_min, delta_E) distribution,
      not summaries alone.
    controls:
    - 'Null object: uniformly random subset of the supersingular set of the same cardinality as S_p, 20 independent draws per prime, identical enumeration code path.'
    - 'Structural tell: beta must drift monotonically toward its asymptote across the ladder. A beta identical to three decimals at every p is the artifact signature of docs/inventor-protocol.md section 3 and halts interpretation.'
    - 'Regression fixture: exact reproduction of delta_E for (211,4), (1811,9), (9623,16) against the values quoted in the EXP-ALISO-003 contract.'
    - 'Exclusion parity: the Autolab selection excluded j in F_p, j=0 and j=1728. This experiment does NOT exclude them; it reports both the excluded-set and full-set statistics so the comparison to the Autolab packages is like-for-like.'
    - 'Degree-metric control: recompute a_min under 2-power degrees only, and under all cyclic degrees, to confirm the exponent does not depend on the walk generator.'
    required_metrics:
    - supersingular_set_cardinality_measured
    - subfield_locus_cardinality_measured
    - a_min_median_mean_p01_per_prime
    - delta_E_median_per_prime
    - joint_a_min_delta_E_distribution
    - beta_fit_and_ci
    - beta_null_fit_and_spread
    - cyclic_kernel_fraction_at_a_min
    - ball_size_constant_measured
    - wall_clock_and_peak_rss_per_prime

  falsification_conditions:
  - >-
      The equivalence (A) fails: an exhaustively found curve with a cyclic
      a-isogeny to a subfield curve whose Frobenius-doubled composite is not a
      degree-a^2 isogeny to the conjugate. One counterexample voids (A) as
      stated and the record must be superseded, not amended.
  - >-
      beta_null does not converge to 1/4 across the ladder. That falsifies the
      ball-size and equidistribution model underlying (B), and the predicted
      p^{1/2} negative branch loses its derivation regardless of what the real
      S_p does.
  - >-
      beta measured at or above 1/4 with the CI excluding 1/6: the positive
      branch is closed, and the ALISO frobenius_midpoint family is recorded as a
      scoped negative against the Wesolowski baseline with the density mechanism
      named.
  - >-
      beta measured at or below 1/6 with the CI excluding 1/4 AND beta_null - beta
      >= 0.03: the negative branch is closed and a memory-free p^{2 beta}
      candidate exists, which under AGENTS rule 12 routes to independent
      adversarial review before any promotion.
  - >-
      The cyclic-kernel fraction at a_min falls below 0.5, in which case the
      family closes on cyclicity and both density branches become moot.

  confounders:
  - >-
      Small-p arithmetic dominates. Below p ~ 10^4 the supersingular set has
      fewer than 10^3 vertices and every exponent fit is dominated by boundary
      effects; the ladder must therefore span at least two decades and the fit
      must be reported both with and without the smallest prime.
  - >-
      j = 0 and j = 1728 carry extra automorphisms and distort ball sizes.
      Handled by reporting with and without them, per the exclusion-parity
      control.
  - >-
      p mod 12 changes |S_p| and the number of ramified vertices by O(1). At toy
      p that O(1) is a visible fraction, so the ladder must include primes in
      every residue class mod 12 and the fit must be checked for a class-dependent
      offset.
  - >-
      Choice of degree metric. "Cyclic isogeny degree at most a" and "ell-isogeny
      path length at most r" are different metrics with different ball growth;
      mixing them silently would change the derived exponent from 1/4 to
      something else. The degree-metric control exists for this.
  - >-
      Enumeration asymmetry. delta_E computed by walking from E toward E^{(p)}
      and a_min computed by walking from E toward S_p use different termination
      predicates; a bug in one and not the other produces a spurious ratio. The
      shared-code-path requirement in the controls covers this.

  interpretation_limits:
  - >-
      Everything here is at toy p. Under AGENTS rule 4 and the RQ-ALISO-001
      constraint "No deployment or crypto-scale promotion from toy Autolab runs",
      a fitted beta is a statement about the tested primes and an extrapolation
      hypothesis about larger ones - never a complexity claim at cryptographic p.
  - >-
      Even the positive branch (beta < 1/4) yields only a CANDIDATE algorithm; it
      does not yield a running one. The success probability of a table-free
      midpoint search additionally requires the Frobenius-doubled composite to be
      cyclic and, in the smooth variant, its degree to be smooth. Neither is
      supplied by beta.
  - >-
      The identification (A) does not license reading the imported Autolab
      packages EXP-ALISO-003/004/005/034/035 as evidence for anything. Per
      DEC-20260801-010 those remain claim_tier toy archival imports with no
      recomputed baseline; this proposal is a NEW measurement that happens to
      adjudicate them.
  - >-
      Wesolowski's algorithm is not a special case of this one and this one is
      not a special case of Wesolowski's. They are two points on a (time, memory)
      plane and the comparison is Pareto, not ordinal.

  heuristic_assumptions:
  - id: H1
    statement: >-
      Ball equidistribution. Fix a prime p and let V be the supersingular set
      over F_{p^2}, |V| = p/12 + O(1). For a uniformly random E in V and any a
      with 1 <= a <= p^{1/2}, the set B(E,a) of codomains of cyclic isogenies of
      degree at most a from E satisfies |B(E,a)| = c_1 a^2 (1 + o(1)) with c_1
      absolute, and B(E,a) meets the subfield locus S_p with probability
      1 - exp(-c_2 |S_p| a^2 / |V|) (1 + o(1)) with c_2 absolute - that is,
      B(E,a) hits S_p as if it were a uniformly random subset of V of its own
      size. Consequently the median of a_min(E) is Theta(p^{1/4}).
    rigorous_support: >-
      The rigorous ingredient is the Ramanujan property of the supersingular
      ell-isogeny graph (Pizer), cited in the in-repo Wesolowski text as [37] and
      used there for exactly this purpose - Algorithm 3 relies on it, via [37] or
      [6, Lemma 14], to make a walk of length O(log p) indistinguishable from
      uniform. The classical distribution statement being imitated is the
      Poisson/occupancy law for random subsets: a set of size m meets a fixed set
      of size s in a universe of size n with probability 1 - exp(-ms/n) + o(1).
      H1 asks only that the isogeny ball behaves like a uniformly random set of
      its own cardinality with respect to hitting S_p. NOTE the honest weak
      point: expansion gives mixing for RANDOM WALKS of logarithmic length, not
      for degree-bounded balls of polynomial size, and S_p is not an arbitrary
      fixed set but the Frobenius fixed locus. H1 is therefore an imitation, not
      a corollary, and the experiment is designed to break it if it is false.
    validation_plan: >-
      Sample: every supersingular vertex at each prime in the ladder (full
      enumeration, no sampling error at the vertex level). Scale: at least five
      primes with 10^3 < p < 10^6, giving supersingular sets from about 10^2 to
      about 10^5 vertices. Shortcut: none needed - at this scale the graph is
      built directly from the supersingular polynomial in SageMath, so no
      correspondence-based transfer assumption enters at all, which is exactly
      why the toy scale is the right scale for THIS heuristic. Comparison
      distribution: the occupancy law P(a_min > a) = exp(-c_2 |S_p| a^2 / |V|),
      fitted for c_2, plus the induced median exponent 1/4. Tail checks: the 1st
      percentile of a_min must obey the same law with the same c_2; a tail that
      is fatter than the occupancy prediction while the median matches is the
      signature of a clustered S_p and is the strongest available evidence for
      the positive branch. Transfer assumption, stated: extrapolating beta from
      p < 10^6 to cryptographic p assumes no crossover in the ball-growth
      constant c_1, which this experiment cannot test and which is recorded as an
      open extrapolation, not a result.
  - id: H2
    statement: >-
      Cyclicity of the Frobenius double. For a uniformly random supersingular E
      and psi the witnessing cyclic a_min-isogeny to S_p, the composite
      conj(psi)^{(p)} after psi has cyclic kernel with probability bounded below
      by an absolute constant c_3 > 0, uniformly in p.
    rigorous_support: >-
      The rigorous fact being leaned on is that a composite of two cyclic
      isogenies of coprime degree is cyclic, so H2 is automatic when a_min is
      squarefree and the two halves share no prime. The classical statement being
      imitated is the density of squarefree integers, 6/pi^2, applied to a_min.
      Where a_min has repeated prime factors the composite can backtrack, which
      is precisely the "all doubled kernels are noncyclic" branch of the Autolab
      null hypothesis in the EXP-ALISO-003 contract.
    validation_plan: >-
      Sample: the same full enumeration, recording for each vertex whether the
      doubled kernel is cyclic and the factorization type of a_min. Comparison
      distribution: the measured cyclic fraction against 6/pi^2 = 0.6079 as the
      squarefree-driven prediction. Tail check: conditional cyclic fraction
      restricted to vertices whose a_min is a prime power, where the prediction
      is that cyclicity fails. Transfer assumption: none beyond the ladder; c_3
      is read off directly.

  target_complexity:
    time_exponent: >-
      p^{2 beta + o(1)} for the midpoint-restricted, table-free algorithm, where
      beta is the quantity this proposal measures. Predicted branch (H1 holds,
      beta = 1/4): p^{1/2+o(1)}, i.e. NO improvement - this is the expected
      outcome and it is a scoped negative. Positive branch (beta = 1/6):
      p^{1/3+o(1)}.
    memory_exponent: >-
      poly(log p) in both branches. This is the entire point of the proposal:
      the midpoint predicate is per-node, so no table is stored. Contrast with
      Wesolowski's p^{1/3+o(1)} memory.
    best_known: >-
      Wesolowski (in-repo full text, eprint 2026/1486): time p^{1/3+o(1)},
      memory p^{1/3+o(1)}, heuristic. Udovenko (eprint 2026/1575, abstract
      retrieved): time and memory p^{2/5+o(1)}, unconditional. Delfs-Galbraith
      ([21] in the in-repo reference list): time p^{1/2}(log p)^{O(1)}, memory
      negligible. van Oorschot-Wiener interpolation as reported in the in-repo
      text section 1.1: time p^{1/2+o(1)}/w^{1/2} with memory w, and with n
      processors p^{1/2+o(1)}/(w^{1/2} n).
    hidden_overhead: >-
      No superpolynomial term is claimed or needed in the predicted branch: the
      p^{1/2} figure is the plain Delfs-Galbraith cost and the o(1) covers only
      the per-node subfield predicate, which is (log p)^{O(1)} and is further
      reduced by SuperSolver-style root detection (recalled, not verified). In
      the positive branch a smoothness requirement would re-enter if the
      midpoint search were combined with smooth-degree listing, and THAT variant
      would inherit Wesolowski's superpolynomial u^{u} overhead in full. The
      proposal does not claim the positive branch avoids it.
    tradeoff_note: >-
      This proposal sits at the extreme low-memory end of the frontier and
      therefore needs no van Oorschot-Wiener interpolation; the interpolation is
      what one uses to get FROM Wesolowski's point TOWARD this one. It
      parallelizes trivially and linearly (independent starting vertices, no
      shared state), unlike a tabled claw. If beta = 1/4 the resulting point
      p^{1/2} time at poly memory is exactly the Delfs-Galbraith endpoint of the
      van Oorschot-Wiener curve, which is why the negative branch is a genuine
      Pareto statement and not merely a null.

  dominated_by: >-
    In the predicted branch (beta = 1/4): dominated by Delfs-Galbraith
    p^{1/2}(log p)^{O(1)} time at negligible memory, which it exactly
    reproduces, and by every accelerated variant of it. Checked against each row
    of the frontier as recorded in the in-repo Wesolowski text section 1.1 plus
    the two 2026 eprints retrieved this session: (i) Wesolowski p^{1/3+o(1)}
    time / p^{1/3+o(1)} memory - dominates on time, dominated on memory; (ii)
    Udovenko p^{2/5+o(1)} time and memory, unconditional - dominates on time,
    dominated on memory; (iii) Delfs-Galbraith p^{1/2} polylog time, poly memory
    - equal on time, equal on memory, therefore strictly dominating this
    proposal in the beta = 1/4 branch since it needs no extra machinery; (iv)
    van Oorschot-Wiener interpolation p^{1/2+o(1)}/w^{1/2} - dominates for every
    w > polylog. In the positive branch (beta < 1/6) the point (p^{1/3+o(1)}
    time, poly memory) is NOT dominated by any row above and would be a new
    frontier point. NOT CHECKED: eprint 2026/1821 (Mamah, concrete assessment of
    the Wesolowski algorithm, 2026-08-28) beyond its abstract; it analyses
    time-memory tradeoffs and low-memory comparisons directly and could contain
    this point already.
  sota_delta: >-
    Predicted branch: sota_delta = 0 on both axes against Delfs-Galbraith
    (identical exponents), and +1/6 in the time exponent against Wesolowski
    (worse) in exchange for -1/3 in the memory exponent (better). Positive
    branch at beta = 1/6: time exponent equal to Wesolowski's 1/3, memory
    exponent 0 versus 1/3, i.e. a memory saving of a factor p^{1/3} - at
    p = 2^256 that is 2^{85} words of storage removed, against the 2^{92.5}
    memory figure the in-repo text gives in section 4.1 for SQIsign NIST-I. The
    experiment itself claims neither; it measures beta.

  estimated_cost:
    implementation: medium
    compute: low

  recommended_priority: high
