idea:
  id: IDEA-20260829-980192
  question_id: RQ-ALISO-001
  status: proposed
  proposed_by: idea-generator
  added: '2026-08-29'

  title: >-
    The Autolab "Frobenius midpoint" family is the Delfs-Galbraith subfield locus
    in different notation, and one measured exponent decides whether that is a
    scoped negative or the memory-free variant of Wesolowski that the p^{1/3}
    paper says it does not know how to build

  class: control

  claim: >-
    (A) IDENTIFICATION. For a supersingular E/F_{p^2} and an integer a, the
    following are equivalent: (i) there is a cyclic a-isogeny psi from E to a
    curve E' with j(E') in F_p; (ii) the composite conj(psi)^{(p)} after psi is a
    degree-a^2 isogeny from E to E^{(p)} whose splitting midpoint is fixed by
    Frobenius. Direction (i) implies (ii) because j(E') in F_p gives
    E'^{(p)} isomorphic to E', so psi^{(p)} maps E^{(p)} to E' and its dual
    composes with psi; direction (ii) implies (i) by reading off the midpoint.
    The equivalence is stated only for Frobenius-doubled isogenies of that exact
    shape, which is precisely the object the Autolab contract
    experiments/EXP-ALISO-003/source/p1486_frobenius_midpoint_sweep_contract_20260728.md
    constructs ("at least one cyclic degree-a quotient has F_p-rational j. Its
    Frobenius-dual double is a cyclic degree-a^2 isogeny to the conjugate
    curve"). It is NOT claimed for a general degree-a^2 isogeny to the conjugate,
    whose midpoint need not be Frobenius-fixed.

    (B) THE CONSEQUENCE THAT MAKES IT DECIDABLE. Define a_min(E) as the least a
    such that E admits a cyclic a-isogeny to a curve with j in F_p, and define
    beta by a_min ~ p^beta on average over the supersingular set. Then the least
    Frobenius-doubled conjugate degree is a_min^2 ~ p^{2 beta}, and any algorithm
    restricted to the midpoint structure runs Wesolowski's Algorithm 2 with
    degree budget D = p^{2 beta}, hence X = (B D)^{1/2} and per-attempt cost
    D^{1+o(1)} = p^{2 beta + o(1)} - but with NO table, because the midpoint test
    "is j in F_p" is a per-node predicate, so memory is polynomial in log p.

    (C) THE TWO OUTCOMES, BOTH REAL. If beta = 1/4 the restricted algorithm costs
    p^{1/2+o(1)} time at polynomial memory, which is exactly Delfs-Galbraith and
    is a SCOPED NEGATIVE with a mechanism: the midpoint structure buys memory by
    paying the same exponent back in degree. If beta is measurably below 1/4 -
    beta = 1/6 being the threshold value - the restricted algorithm costs
    p^{1/3+o(1)} time at POLYNOMIAL memory, which is strictly better on the
    memory axis than Wesolowski's p^{1/3+o(1)} memory and is precisely the object
    the paper says is unclear how to build ("It is currently unclear how to
    reduce the memory cost without increasing the time", section 1.1). The
    proposal is the measurement of beta, not the assertion of either branch.

  mechanism: >-
    The subfield locus S_p is the fixed-point set of the Frobenius involution
    sigma on the supersingular vertex set, and sigma commutes with every
    ell-isogeny adjacency operator. Delfs-Galbraith walks until it lands ON S_p;
    the midpoint structure asks only to land within cyclic-isogeny degree a OF
    S_p. The number of curves reachable from a fixed vertex by a cyclic isogeny
    of degree at most a is sum over d <= a of Theta(d) = Theta(a^2). If those
    balls were equidistributed over the roughly p/12 supersingular vertices, then
    covering the whole set with balls centred on the Theta(sqrt p) subfield
    curves needs sqrt(p) * a^2 of order p, i.e. a of order p^{1/4}. So beta =
    1/4 is the equidistribution prediction, and the only route to a smaller beta
    is that distance to S_p is NOT distributed like distance to a random set of
    the same size - which is a live possibility precisely because S_p is not a
    random set but the fixed locus of an operator-commuting involution. That is a
    measurable statement about the graph, and the null object that decides it is
    a uniformly random subset of the same cardinality.

