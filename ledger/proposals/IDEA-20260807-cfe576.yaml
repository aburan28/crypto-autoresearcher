  reachability_gate: >-
    T5 EVALUATED, AND THIS RECORD REFRAMES IT. The move L9 wants is not
    curve-to-curve but point-to-point: from Q in E(F_p) to a global point
    above it. Cost of that move: for the canonical routes L1-L4 it is
    p^{o(1)} and it lands on the WRONG POINT with probability 1 - p^{-1+o(1)}
    -- the object is cheap and useless. For route L5 the move is
    target-correct by construction and costs Theta(N^{2/r}) bits
    (IDEA-20260807-6533fd) plus an undecoded defect syndrome. So the T5
    dichotomy resolves as: goodness (a global point above the prescribed Q) is
    NEITHER common enough to hit by random construction (density p^{-1+o(1)})
    NOR locally detectable, because detecting that a global point reduces to Q
    requires having constructed it. Separately, the curve-side gate is priced
    in IDEA-20260807-ee6ef7 at p^{1+o(1)} for the generic curve and polylog(p)
    for h(disc End) = O(1); this record's conclusion is unchanged in both
    regimes, because it never uses the curve's cheapness.

