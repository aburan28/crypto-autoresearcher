  target_complexity:
    time_exponent: >-
      NO ALGORITHM IS PROPOSED. The record's quantitative content is a success
      probability: p^{-1+o(1)} per target-independent construction, hence
      N^{1-o(1)} re-randomisations, exponent 1 against rho's 1/2.
    memory_exponent: >-
      O(1) for the audit; the constructive arms store O(n log p) bits per
      lifted point at precision n.
    best_known: >-
      Parallel rho at 0.886 sqrt(N) time, O(1) memory (KN-TECH-001,
      KN-TECH-006); automorphism-discounted variant on CM curves
      (KN-TECH-018); BSGS at sqrt(N) time and memory (KN-TECH-031).
    hidden_overhead: >-
      The p^{o(1)} in "output size p^{o(1)}" is doing real work: a
      construction with output size p^{1/2} would give success probability
      p^{-1/2}, matching rho -- and would cost p^{1/2} to write down, so it
      ties rather than wins. That boundary case is stated so the argument's
      edge is visible rather than hidden in an exponent.
    tradeoff_note: >-
      There is a genuine tradeoff at the boundary: |S| = N^{c} gives success
      N^{c-1} at cost N^{c}, so total N^{1-c} * N^{c} = N, INDEPENDENT OF c.
      The construction's size buys nothing anywhere on the curve -- the
      product is invariant -- which is the sharpest form of the counting
      obstruction and is why no tradeoff position competes with rho's N^{1/2}.
