idea:
  id: IDEA-20260807-cfe576
  question_id: RQ-CANL-63098f
  added: '2026-08-07'
  title: >-
    CLOSURE PROPOSAL WITH THE OBSTRUCTION NAMED: only the CURVE lifts
    canonically, never the point -- and every canonical or CM-canonical source
    of global points (Teichmuller torsion section, O-multiples, Heegner points,
    a fixed Mordell-Weil basis) is a function of (E, O, K) ALONE, so its output
    set S has |S| independent of the target and hits a uniformly random Q with
    probability |S|/N; while every target-DEPENDENT lift is non-homomorphic and
    reinstates the formal-group defect syndrome of ECFG-P1543
  class: mechanism

  claim: >-
    (A) THE HONEST STARTING POINT THE LANE MUST STATE. Serre-Tate lifts the
    CURVE canonically. IT DOES NOT LIFT POINTS. Any L9 proposal that speaks of
    "the lifted points" owes an account of how the point was lifted and what
    freedom that left. This record supplies the account, and it is a dichotomy.

    (B) THE ENUMERATION OF POINT-LIFTING ROUTES ON A CANONICAL LIFT. Five, and
    the record claims the list is complete for constructions definable from
    (E, O, K, Q) by the operations this program has catalogued -- a claim made
    explicitly so it can be refuted by exhibiting a sixth.
      (L1) TEICHMULLER / FINITE-ETALE TORSION SECTION. For N != p, Hensel
        lifting of the prime-to-p torsion gives a UNIQUE lift t: G -> Ẽ[N]
        that is a group homomorphism and preserves the scalar. Recorded at
        ECFG-P1543-R0/R1: "it is torsion, has zero canonical height, is killed
        by characteristic-zero logarithms, and retains the original order-N
        relation problem." Canonical, and useless: hhat = 0, so it carries no
        lattice information at all.
      (L2) O-MULTIPLES OF A LIFTED POINT. alpha P~ for alpha in O. By
        IDEA-20260807-fd5a24 Lemma 2, hhat(alpha P~) = N(alpha) hhat(P~), so
        every CM-generated companion is LONGER, never shorter. The O-action
        inflates heights and cannot produce a short witness.
      (L3) HEEGNER POINTS. The one genuinely CM-specific supply of global
        points of controlled height, defined over the ring class field of the
        SAME order O, with a height formula (Gross-Zagier) tying them to an
        L-derivative. RECALLED, NOT READ, AND FLAGGED [open] AS TO WHETHER THE
        CONSTRUCTION APPLIES TO THE CANONICAL LIFT ITSELF RATHER THAN TO A
        MODULAR CURVE'S IMAGE. Whatever the answer, the construction's inputs
        are a modular curve, the field K and a level -- NOT the target Q. It
        produces ONE point (or an O(1) orbit), not a point above a prescribed
        residue.
      (L4) A FIXED MORDELL-WEIL BASIS. Express the target's lift in a known
        free basis. ECFG-P1543-R1's "Mordell-Weil coordinate gate": doing so
        "returns a coefficient vector whose reduction is already a
        multigenerator preimage of R" -- i.e. computing the coordinates IS the
        discrete log. Circular.
      (L5) AN ARBITRARY SET-SECTION (what Xedni actually does). Lift the
        x-coordinate to a small integer and solve for y over a chosen global
        curve. Target-dependent, and by ECFG-P1543-R1's homomorphism gate NOT a
        group homomorphism: the formal kernel is pro-p and has no nontrivial
        N-torsion, so any homomorphism from the order-N group into it is zero,
        and every non-torsion section carries the defect u(R) = s(R) - t(R)
        which must be decoded jointly with the finite relation.

    (C) THE OBSTRUCTION, NAMED. TARGET-INDEPENDENCE. Routes L1-L4 are all
    functions of (E, O, K) and of construction parameters, but not of Q. Let S
    be the set of global points such a construction can output using
    p^{o(1)} work. Then S is fixed before Q is seen, red(S) is a fixed subset
    of E(F_p), and for a uniformly random target
        Pr[Q in red(S)] = |red(S)|/N <= |S|/N = p^{-1+o(1)}.
    THAT IS THE WHOLE ARGUMENT AND IT IS TWO LINES. It does not depend on
    heights, on the coefficient bound C_0, on the rank, or on CM; it depends
    only on counting. Route L5 escapes it -- it IS target-dependent -- and
    pays instead with the pro-p homomorphism gate and the height budget of
    IDEA-20260807-6533fd.
    SO THE DICHOTOMY IS: canonical implies target-independent implies
    success probability p^{-1+o(1)}; target-dependent implies non-homomorphic
    implies the defect syndrome plus a height budget of Theta(N^{2/r}).
    CM CHANGES NEITHER BRANCH, because CM is a property of the curve and the
    branch condition is about the point.

    (D) WHAT THE CLOSURE DOES AND DOES NOT COVER -- the forward guidance the
    inventor protocol section 4 requires. STILL OPEN, and named concretely:
      (i) A TARGET-DEPENDENT NON-TORSION SECTION WHOSE DEFECT VALUES LIE IN A
        COMPACT FAMILY WITH A JOINT DECODER. This is verbatim the "live
        exception" ECFG-P1543-R0 left open and R1 left "unclassified". It is
        not closed here and this record does not claim to close it.
      (ii) A CONSTRUCTION USING A SECOND PRIME. Every route above is local at
        p. A global object constrained simultaneously at p and at an auxiliary
        prime q has a target-dependent input at q and might evade the counting
        argument; nothing in this record bounds it.
      (iii) A COMPRESSED REPRESENTATION of high-height points (straight-line
        programs, elliptic divisibility sequence indices, theta coordinates),
        which would break the height-to-bit-size step that the L5 branch
        relies on. Named in IDEA-20260807-6533fd's proof_search_map as the
        most valuable thing to attack.
      (iv) THE HEEGNER-POINT ROUTE AT ITS PROPER GENERALITY, which this record
        flags [open] rather than resolves, because the applicability of the
        Gross-Zagier machinery to the canonical lift is a literature question
        this session did not verify.
    A CLOSURE THAT NAMES FOUR SURVIVING CLASSES IS NOT A CLAIM THAT THE LANE
    IS DEAD. It is a claim that one specific hope -- that CM makes the point
    lift canonical -- is refuted, with the reason stated.

  resource_label: >-
    R6 (characteristic-zero lifts and the reduction map) and R3 (End as a ring:
    the O-multiples of L2 and the ring class field of L3).
  admissibility: admissible
  admissibility_argument: >-
    The argument is a counting argument about the image of a reduction map
    together with a structural statement about which constructions can depend
    on the target. No endomorphism is applied to a point of G. The record does
    however establish something adjacent to the admissibility filter and worth
    stating: the pro-p homomorphism gate (ECFG-P1543-R1) is the
    characteristic-zero ANALOGUE of H-ENDO-001's scalar collapse -- in both
    cases the structure one hoped to import collapses because the target
    module has no N-torsion or only scalar N-torsion. The two obstructions are
    formally different and empirically consilient, and the record says so
    without conflating them.

  discriminated_from:
    - >-
      ECFG-P1543-R0/R1 in ledger/FINDING-PF-IC-001.md, whose disposition is
      "INDEPENDENTLY_VERIFIED_SCOPED_NO_GO ... STRUCTURED_DEFECT_DECODER_
      UNCLASSIFIED ... INCONCLUSIVE". THIS RECORD PARTIALLY DUPLICATES IT AND
      SAYS SO. What P1543 establishes: the torsion-or-defect dichotomy and the
      pro-p homomorphism gate, for a general good-reduction lift. What this
      record ADDS: (a) the CM/canonical-lift case specifically, which P1543
      mentions only in passing ("on the canonical ordinary curve, the elliptic
      Teichmuller lift is this same group section"); (b) the Heegner-point
      route, which P1543 does not enumerate; (c) the TARGET-INDEPENDENCE
      counting argument, which is a different and simpler obstruction than the
      defect syndrome and which covers L1-L4 uniformly. Any Coordinator
      reading this must treat the overlap as overlap, not as independent
      corroboration.
    - >-
      IDEA-20260807-fd5a24 / 11b93d: those grant a point lift for free and
      price the coefficient set. This record asks whether the free grant is
      legitimate and answers no. It is logically upstream of both.
    - >-
      IDEA-20260807-44ba75: that measures how many points there are to lift
      TO. This one asks how one would select the right one. Complementary and
      not double-counted.
    - >-
      GOAL-ICLIFT-001 / RQ-XEDN-001 lineage: function-field surfaces and
      section densities. No section of a surface appears here.

  object_first_candidate:
    tracked_object: >-
      THE TARGET-DEPENDENCE OF A LIFTING CONSTRUCTION: for each construction
      C, the function Q |-> C(E, O, K, Q) and specifically whether it is
      constant in Q. The tracked quantity is the pair (|image of C|,
      is-C-constant-in-Q).
    lossiness: >-
      LOSSY IN AN UNUSUAL AND USEFUL WAY: it forgets everything about the
      construction except its input signature and output cardinality. It
      discards the mathematics -- Hensel lifting, Gross-Zagier, descent -- and
      keeps only "does Q enter". The discard is compatible with the operation
      that matters (composing constructions) because target-independence is
      closed under composition: a function of target-independent things is
      target-independent. THAT CLOSURE PROPERTY IS WHAT MAKES THIS A GENUINE
      TRACKED OBJECT RATHER THAN A LABEL, and it is what lets the argument
      cover an infinite family of constructions at once. It is not a change of
      coordinates: L1 and L3 are wildly different mathematics with the same
      object value, and the argument treats them identically and correctly.
    propagation: >-
      One step = one composition of constructions. Target-independence
      propagates by the closure property above; |image| propagates
      multiplicatively at worst. Both are decidable by inspecting a
      construction's inputs, at zero compute -- which is exactly the property
      docs/inventor-protocol.md wants from a cheap pre-compute audit.
    survival_score: >-
      SURVIVES: any amount of CM structure, any field, any height bound, any
      rank. DIES: as soon as a construction takes Q as an input, which is
      precisely route L5 and precisely the open class (i) in part (D). The
      death point is sharp and is the forward guidance.

  mechanism: >-
    STEP 1 -- FORMALISE THE COUNTING ARGUMENT. Let C be a construction with
    signature (E, O, K, params) -> finite subset of Ẽ(H), computable in
    p^{o(1)} time, so |C(...)| = p^{o(1)}. red(C(...)) is a fixed subset of
    E(F_p). For Q uniform in G, Pr[Q in red(C(...))] <= p^{o(1)}/N. Conclude:
    the expected number of independent (E-preserving) re-randomisations needed
    is N^{1-o(1)}. Note the ONE loophole and close it explicitly: params could
    be searched, but searching params to hit Q is target-dependence smuggled
    in through the parameter, and the search itself costs |image|^{-1} tries
    -- so the argument is stable under parameter search.
    STEP 2 -- AUDIT EACH ROUTE AGAINST THE SIGNATURE. For L1-L5, write the
    input signature explicitly and mark target-dependence. This is a table,
    costs nothing, and is the deliverable's core.
    STEP 3 -- VERIFY L1 CONSTRUCTIVELY AT TOY SCALE. Build the finite-etale
    torsion lift by Hensel lifting a point of E[N] to Z/p^n, confirm it is a
    group homomorphism (check t(P+Q) = t(P)+t(Q) on random pairs), and confirm
    its canonical height is zero by exhibiting its finite order. This turns
    P1543's theorem into a checked fact in this campaign's own harness.
    STEP 4 -- VERIFY THE PRO-p GATE CONSTRUCTIVELY. Take an arbitrary
    set-section s (naive x-lift), compute u(R) = s(R) - t(R) in the formal
    group, and confirm that u is NOT additive: exhibit R1, R2 with
    u(R1+R2) != u(R1) + u(R2). Then confirm the first-jet statement: [N] acts
    invertibly on E_1/E_2 for N != p, i.e. multiplication by N mod p is a unit.
    Both are short computations and both can fail.
    STEP 5 -- THE HEEGNER [open] ITEM. A literature check only, written to
    knowledge/literature/ with verification status: does any construction
    produce a global point on a CM curve whose reduction is a PRESCRIBED point
    of E(F_p)? If yes, this record is superseded. If no source says so either
    way, the item stays [open] and is reported as open.
    STEP 6 -- STATE THE CLOSURE TO THE PROTOCOL'S STANDARD: named obstruction
    (target-independence, plus the pro-p gate for the complementary branch),
    argument (Step 1), forward guidance (part D's four classes).

  novelty_status: adaptation
  novelty_screen:
    method: >-
      2026-08-07 shared L9 screen (IDEA-20260807-fd5a24) plus a full read of
      ledger/FINDING-PF-IC-001.md lines 2016-2106 (ECFG-P1543-R0 and R1) and
      greps for "Heegner|target-independent|set-section|formal group defect".
    results: >-
      ECFG-P1543-R0/R1 already contains the torsion-or-defect dichotomy, the
      pro-p homomorphism gate, the first-jet statement, the Mordell-Weil
      coordinate gate, and the phrase "a target-independent non-torsion
      section could conceivably place all defect values in a compact family
      with a joint finite-and-local decoder" -- which is the live exception
      this record also leaves open. "Heegner" returns no substantive hit.
      The COUNTING form of the target-independence obstruction is not stated
      there.
    verdict: >-
      ADAPTATION, WITH SUBSTANTIAL OVERLAP DECLARED. The core dichotomy
      duplicates ECFG-P1543 and is filed with that id. The CM instantiation,
      the Heegner enumeration item, and the counting form of the obstruction
      are the increment. Under docs/inventor-protocol.md this is a legitimate
      deliverable -- it maps the corpus -- and it must not be presented as an
      independent confirmation of P1543.

  null_object_control: >-
    MANDATORY. For the constructive arms: the NULL OBJECT for Step 3 is a
    RANDOM map G -> Ẽ(Z/p^n) with the same domain and codomain, subjected to
    the identical homomorphism test; it must FAIL the test, or the test cannot
    distinguish a homomorphism from noise. For Step 4 the null is the TORSION
    section itself, whose defect u is identically zero; the additivity test
    must PASS there and FAIL on the arbitrary section, or the instrument
    cannot see the defect.
    DECAY PARAMETER: n, the p-adic precision. The defect's non-additivity must
    become MORE visible as n grows (it lives in higher jets); a non-additivity
    signal that does not grow with n is a rounding artifact of low precision
    and is the canonical artifact tell.
    POSITIVE CONTROL for the counting argument: plant a target inside red(S)
    by choosing Q := red(P~) for a P~ produced by construction C. Then the
    "attack" must succeed with probability 1, confirming that the counting
    argument's failure mode is target selection and not implementation.

  assumptions:
    - >-
      The ECFG-P1543 statements are as recorded in ledger/FINDING-PF-IC-001.md
      (finite-etale torsion lift unique and homomorphic; formal kernel pro-p;
      no nontrivial N-torsion for N != p; first jet has [a] acting as a mod p).
      READ IN THIS REPOSITORY, but their own status is an internal audit with
      recorded SHA-256s, not an external citation. Steps 3-4 re-verify the two
      load-bearing ones constructively rather than relying on the record.
    - >-
      Serre-Tate canonical lift exists with End = O. Standard; recalled.
    - >-
      Heegner-point applicability to the canonical lift is [open] and NOT
      assumed in either direction. Nothing in the closure depends on it: the
      counting argument covers L3 regardless of whether the construction
      exists, because its signature does not contain Q.
    - >-
      "Computable in p^{o(1)} time implies |output| = p^{o(1)}" -- true for any
      construction that writes its output down, and the record's argument
      applies only to such constructions. A construction with an implicitly
      represented exponentially large output is outside scope and is named as
      open class (iii).

  proof_search_map:
    bottleneck: >-
      The single step is the signature audit: "route X does not take Q as an
      input". If any of L1-L4 secretly does -- for instance if a Heegner-style
      construction could be parameterised by data determined by Q at
      p^{o(1)} cost -- the counting argument does not apply to it and the
      closure has a hole exactly there. Step 2's table is therefore the
      falsifiable heart of the record, and it is free to check.
    baseline_embedding:
      parameter_slice: >-
        The exact baseline is the Xedni construction itself (route L5) at
        arity 2 on a toy curve: lift x(P) and x(Q) naively, fit a global curve
        through both, and confirm the construction is target-dependent by
        showing the output curve changes when Q changes. Trivial, and it
        anchors the audit's notion of dependence in a concrete case.
      reproduction_check: >-
        Frozen fixture: named p, named P and two different Q, the two distinct
        global curves produced, compared as exact coefficient tuples. If the
        curve does NOT change with Q the implementation is not doing Xedni and
        the audit's calibration is void.
    observation_collision:
      observable: >-
        The pair (|red(S)|, success probability of hitting a random target).
      distinct_preimage_search: >-
        SUCCEEDS TRIVIALLY AND THAT IS THE ARGUMENT: L1 (torsion section,
        height 0), L2 (O-multiples, height inflated), L3 (Heegner, height
        controlled) and L4 (fixed basis) all give the SAME observable --
        success probability p^{-1+o(1)} -- despite entirely different
        mathematics. A closure argument whose observable collides across all
        the objects it covers is exactly the right shape: it means the
        conclusion does not depend on which construction is used, which is
        the uniformity that makes it a closure rather than four separate
        negatives. THE COLLISION CAN FAIL: a construction with
        |red(S)| = Omega(N) would separate, and exhibiting one refutes the
        record.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "does this lifting attack work" by "is the construction's
          input signature target-dependent". Encoding: a construction's type.
          Completeness: every construction has a signature. Soundness: a
          target-independent construction cannot hit a random target better
          than |S|/N. Transfer: exact. Cost loss: the reduction discards the
          construction's efficiency entirely, so it says nothing about how
          expensive a target-DEPENDENT construction is -- that is the L5
          branch and is priced elsewhere.
        predicted_gain: >-
          A zero-compute audit that disposes of an infinite family of
          candidate constructions at once, which is precisely what
          docs/inventor-protocol.md means by a closure that is an argument
          rather than a tally.
      - transform: stronger_invariant
        proposed_object: >-
          Track not just target-dependence but the NUMBER OF BITS OF Q the
          construction consumes. A construction consuming b bits of Q can hit
          at most 2^b targets from a fixed S, giving the refined bound
          min(1, |S| 2^b / N) and turning a binary audit into a quantitative
          one.
        predicted_gain: >-
          Makes the audit continuous rather than binary, and gives a concrete
          target for open class (i): a decoder consuming Omega(log N) bits of
          Q at p^{o(1)} cost.
    quantifier_order: >-
      THE CLAIM: FOR ALL constructions C with signature not containing Q and
      output size p^{o(1)}, FOR ALL E, THERE IS NO Q-uniform success
      probability above p^{-1+o(1)}. THE TRAP BEING HUNTED, and it is the
      classic one for closures: the inverted "for all Q there exists a
      construction hitting it", which is TRUE and vacuous (define C to output
      the answer). The record's quantifier order puts the construction first
      and the target second, which is the only order in which the statement
      has content, and any downstream summary that reverses it is wrong.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "no target-independent construction of p^{o(1)} output size
        hits a uniformly random target with probability above p^{-1+o(1)}; and
        the canonical CM constructions L1-L4 are target-independent." It
        CANNOT certify that no lifting attack exists, cannot cover open
        classes (i)-(iv), cannot cover implicitly-represented outputs, and
        cannot bear on crypto scale beyond the counting argument's own
        generality -- which is, unusually for this campaign, scale-free, and
        that must be stated carefully rather than exploited.
      nearby_object_control: >-
        The nearby object where the conclusion FAILS is route L5 itself: a
        target-dependent construction, for which the counting argument says
        nothing at all. A method that concluded "all lifting fails" would be
        refuted by the mere existence of L5 as a well-defined construction.
        Running the audit on L5 and having it correctly return "not covered"
        is the control that shows the audit discriminates.
    proof_obligations:
      - claim: "Target-independent C with |S| = p^{o(1)} gives Pr <= p^{-1+o(1)}."
        responsibility: correctness
      - claim: "Target-independence is closed under composition."
        responsibility: correctness
      - claim: "L1 is a homomorphism, is torsion, and has hhat = 0."
        responsibility: baseline
      - claim: "The formal kernel is pro-p, so Hom(Z/N, kernel) = 0 for N != p."
        responsibility: baseline
      - claim: "L2 inflates height by N(alpha) >= 1."
        responsibility: correctness
      - claim: "L4 is circular (coordinates in a known basis = the DLP)."
        responsibility: correctness
      - claim: "The enumeration L1-L5 is complete for constructions definable from (E,O,K,Q); refutable by a sixth."
        responsibility: scope
      - claim: "Four surviving open classes are named; the lane is not declared dead."
        responsibility: scope

  predictions:
    - metric: >-
        homomorphism test on the finite-etale torsion lift: fraction of random
        pairs (R1,R2) with t(R1+R2) = t(R1)+t(R2) in Z/p^n
      direction: higher
      minimum_effect: >-
        FORCED VALUE 1.000 exactly, at every precision n = 1..8. A single
        failure means the lift as implemented is not the finite-etale section.
    - metric: >-
        additivity test on an arbitrary set-section: fraction of random pairs
        with u(R1+R2) = u(R1)+u(R2)
      direction: lower
      minimum_effect: >-
        Predicted to fall well below 1 and to fall FURTHER as n grows. A value
        of 1 at every n would mean the defect vanishes, contradicting the
        pro-p gate as implemented, and would be the surprising outcome.
    - metric: >-
        order of the Teichmuller-lifted point in Ẽ(Z/p^n)
      direction: different
      minimum_effect: >-
        FORCED VALUE: exactly N, for every n. An order divisible by p means
        the lift left the prime-to-p torsion and the construction is wrong.
    - metric: >-
        |red(S)|/N for each of L1, L2, L4 at toy p, with S the p^{o(1)}-sized
        output of a bounded-cost run
      direction: lower
      minimum_effect: >-
        Predicted below (log p)^{O(1)}/N. A value of Omega(1) for any route
        refutes the counting argument for that route and reopens it.
    - metric: >-
        signature audit table: number of routes taking Q as an input
      direction: different
      minimum_effect: >-
        Predicted exactly 1 of 5 (route L5). A second route found to be
        target-dependent is a hole in the closure and is the pre-registered
        reopening condition.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, and it IS the main deliverable): write the
      signature table for L1-L5 and the two-line counting argument; audit each
      entry; record which are covered and which are not.
      STAGE 1 (hours): construct the finite-etale torsion lift at toy scale,
      run the homomorphism and order tests against the random-map null.
      STAGE 2 (hours): construct an arbitrary set-section, compute the defect,
      run the additivity test at increasing precision against the torsion-
      section null.
      STAGE 3 (minutes): measure |red(S)|/N for the bounded-cost outputs of
      L1, L2, L4.
      STAGE 4 (zero compute): the Heegner literature item, written to
      knowledge/literature/ with verification status; [open] is an acceptable
      terminal state and must be reported as such.
      STAGE 5 (zero compute): write the closure to the section-4 standard.
    controls:
      - Random-map null for the homomorphism test (must fail).
      - Torsion-section null for the defect test (must pass additivity).
      - Xedni L5 calibration fixture (target-dependence must be detected).
      - Planted-target positive control (success probability must be 1).
    required_metrics:
      - Signature table with a covered/not-covered verdict per route
      - Homomorphism-test pass rate per n, both arms
      - Additivity-test pass rate per n, both arms
      - Order of the lifted point per n
      - "|red(S)|/N per route"
      - Literature verdict for the Heegner item with verification status

  falsification_conditions:
    - >-
      The torsion lift fails the homomorphism test. The construction as
      implemented is not the finite-etale section; instrument failure under
      AGENTS.md rule 5.
    - >-
      The arbitrary set-section passes additivity at every precision. The
      pro-p gate as implemented does not bite and part (B)(L5) is wrong.
    - >-
      Any of L1-L4 is found to take Q as an input at p^{o(1)} cost. The
      closure has a hole at that route; it is reopened and this record is
      superseded.
    - >-
      A sixth route is exhibited. The enumeration is incomplete; same
      disposition, and the record explicitly invites this.
    - >-
      |red(S)| = Omega(N) for a p^{o(1)}-cost construction. The counting
      argument is wrong.
    - >-
      The random-map null passes the homomorphism test. The test does not
      discriminate and no conclusion may be drawn from any arm.

  confounders:
    - >-
      Precision. The defect lives in higher jets; at n = 1 it can vanish
      spuriously. The n-ladder and the decay-parameter control address this.
    - >-
      Parameter search smuggling target-dependence. A construction with a
      searchable parameter is target-dependent in disguise; Step 1 closes this
      explicitly and the audit must apply the same test to parameters.
    - >-
      Overlap with ECFG-P1543. Re-verifying its statements in this harness is
      a check on THIS implementation, not independent confirmation of the
      mathematics; presenting it as the latter would be double counting.
    - >-
      The Heegner [open] item. Leaving it open is honest; quietly treating it
      as closed in a summary would misstate the closure's coverage.

  interpretation_limits:
    - >-
      Toy scale for every constructive arm. The counting argument itself is
      scale-free but its premise ("output size p^{o(1)}") is a modelling
      choice, and it is a closure of a construction CLASS, not of a problem.
    - >-
      This does NOT close lifting, does NOT close Xedni, does NOT close L9,
      and explicitly names four surviving classes. Any summary reading it as
      "lifting is dead" is wrong and is the premature-closure failure mode.
    - >-
      Substantial overlap with ECFG-P1543-R0/R1 is declared in
      novelty_screen and must be carried into any downstream citation.
    - >-
      Nothing here bears on any deployed curve.

  heuristic_assumptions:
    - id: HEUR-CANL-T1
      statement: >-
        FOR ALL constructions in the audited class, "computable in p^{o(1)}
