idea:
  id: IDEA-20260813-878855
  date: '2026-08-13'
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SQISIGN-001
  goal_id: GOAL-SQISIGN-001
  title: Public-stratum leakage surviving transcript projection across signatures
  class: composition
  claim: >-
    After primary sources fix the real signer and genuine simulator, test
    whether their unconditional single-signature transcript laws can agree
    while a public, source-defined transcript stratum has a key-persistent
    conditional bias that compounds across multiple signatures. This is a
    falsifiable candidate mechanism, not evidence that such a stratum exists.
  mechanism: >-
    Mixture cancellation can hide conditional differences: for public stratum
    S, real and simulated laws may have opposite deviations across S values so
    the one-signature marginal nearly cancels. Repeated signatures under one
    public key share the key-indexed mixture weights, so a preregistered vector
    of conditional frequencies can act as a fingerprint even when endpoint
    marginals and raw collision rates agree. The security-relevant quantity is
    fully charged information accumulated per signature, not a constant
    classifier accuracy.
  why_not_a_renamed_known_approach: >-
    IDEA-20260801-020 is an endpoint transcript-independence probe;
    IDEA-20260808-287361 measures exact posterior entropy at toy scale; and
    IDEA-20260808-ee5d81 studies commitment-curve collision or birthday entropy.
    This proposal requires a public stratum fixed before sampling, tests
    cancellation between conditional and marginal laws, and composes the same
    stratum vector across signatures with explicit data cost. It does not reuse
    the verifier accept-fibre of IDEA-20260807-ba5eda.
  predictions:
    - metric: conditional-versus-marginal real-and-genuine-simulator distance gap
      direction: higher
      minimum_effect: >-
        At least one preregistered public stratum has a corrected conditional
        separation while the pooled marginal remains within its null tolerance.
    - metric: held-out same-key versus cross-key multi-signature log-likelihood gap
      direction: higher
      minimum_effect: >-
        The same-key score grows with signature count beyond both the genuine
        simulator null and a key-permuted control; no rate is set before sources.
    - metric: planted conditional-mixture positive-control recovery
      direction: higher
      minimum_effect: >-
        The analysis recovers a synthetic stratum bias with zero designed
        marginal difference before interpreting any SQIsign observation.
  minimal_test:
    design: >-
      Blocked pre-design gate: first file the primary Round-3 signing
      distribution, genuine simulator, transcript fields, and permitted
      multi-signature query model. Only afterward may the Coordinator authorize
      a toy held-out comparison of preregistered public strata across repeated
      signatures under the same key. No stratum, sample count, or execution is
      approved by this proposal.
    controls:
      - Genuine-simulator multi-signature null with the same public keys, messages, query schedule, and transcript projection.
      - Key-permutation null that preserves each transcript and public stratum but destroys same-key persistence.
      - Marginal-matched planted positive control with a known conditional mixture bias.
      - Cross-key control with one signature per key at the same total data volume.
      - Collision-rate and posterior-entropy baselines to separate the mechanism from prior observables.
    required_metrics:
      - Conditional and pooled distribution distances with simultaneous uncertainty.
      - Held-out log-likelihood or mutual-information interval by signature count.
      - Same-key, cross-key, key-permuted, genuine-simulator, and planted-control curves.
      - Candidate-set shrinkage bound and all time, memory, data, preprocessing, oracle, and verification costs.
  controls:
    - true_simulator_multisignature_null_mandatory
    - marginal_matched_conditional_bias_positive_control
    - key_permutation_same_shape_null
    - cross_key_equal_data_control
  confounders:
    - Message or nonce schedules correlated with keys rather than secret-ideal information.
    - Adaptive selection of strata after viewing real transcripts.
    - Retry or abort conditioning already targeted by IDEA-20260805-2a669e.
    - Reusing samples between training and held-out evaluation.
    - A simulator that is valid only for one transcript but not the filed multi-signature experiment.
    - Toy strata whose probabilities vanish or merge at production parameters.
  falsification_conditions:
    - >-
      After source gating, every preregistered public stratum matches the genuine
      simulator within corrected tolerance and the same-key curve is reproduced
      by key permutation, while the planted conditional mixture is detected.
    - >-
      Any conditional separation disappears on held-out messages or is fully
      explained by retry history, serialization, or public scheduling.
    - >-
      Accumulated information remains bounded independently of parameter size
      or requires data whose charged cost cannot improve on the matched baseline.
  interpretation_limits:
    - status proposed and novelty unverified; this record has no scientific effect.
    - A constant distinguisher or a finite toy entropy loss is not an exponent improvement.
    - Production relevance requires a source-defined adaptive multi-signature simulator and an explicit transfer argument.
    - >-
      Even a confirmed protocol leak does not solve EndRing or OneEnd; a
      positive-power candidate-space reduction, decoder, success probability,
      retries, memory, preprocessing, verification, and query data would all
      have to be charged against KN-TECH-057.
    - >-
      GOAL-SSI-001 exclusively owns hard-problem EndRing/OneEnd algorithms,
      reductions, and status. This proposal only measures protocol-level
      transcript composition and cannot change or imply a GOAL-SSI-001 result.
  assumptions:
    - Primary sources define a genuine simulator for the relevant multi-signature or adaptive transcript distribution.
    - A public stratum can be fixed without secret-derived labels.
    - Repeated signatures are permitted and their complete query cost is charged.
  heuristic_assumptions:
    - id: H-STRATUM-1
      statement: >-
        Conditional on a fixed public key, declared message schedule, and public
        stratum, later source-gated signatures are independent draws from one
        stationary signer or genuine-simulator kernel, except for state that the
        filed scheme explicitly exposes and the model includes.
      rigorous_support: >-
        Product-distribution likelihood and information accumulation laws are
        exact for conditionally independent kernels; stationarity and absence of
        hidden signer state are the scheme-specific assumptions.
      validation_plan: >-
        After primary-source filing, test serial dependence and schedule effects
        on split streams, compare complete likelihood tails under key
        permutation and the genuine simulator, and report toy-to-production
        transfer as unvalidated.
    - id: H-STRATUM-2
      statement: >-
        Any extrapolated positive-power candidate shrinkage would require total
        held-out information at least alpha log(p) bits for an explicitly stated
        alpha greater than zero, after finite-sample correction and query cost.
      rigorous_support: >-
        Identifying one candidate among p^alpha alternatives requires order
        alpha log(p) information under standard counting bounds; this is a
        necessary benchmark, not proof that the transcript supplies it.
      validation_plan: >-
        Fit no exponent from a fixed toy point. If later source-gated parameter
        families exist, preregister scaling points, confidence bands, and tail
        comparisons; reject exponent relevance when information is bounded or
        data cost dominates the matched baseline.
  proof_search_map:
    bottleneck: >-
      Determine whether source-defined public conditioning can reveal a
      key-persistent difference that unconditional transcript projection cancels.
    baseline_embedding:
      parameter_slice: >-
        Reproduce the exact single- and multi-signature real and genuine-
        simulator laws on the smallest source-valid toy family before conditioning.
      reproduction_check: >-
        Confirm pooled marginals, query scheduling, retry semantics, and
        simulator quantifiers match the primary statement.
    observation_collision:
      observable: Pooled single-signature transcript law and raw collision count.
      distinct_preimage_search: >-
        Construct or enumerate distinct public-stratum mixtures with the same
        pooled marginal and collision rate but different same-key conditional vectors.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: Preregistered vector of public-stratum conditional frequencies.
        predicted_gain: Reveals mixture cancellation invisible to the pooled marginal.
      - transform: telescoping_potential
        proposed_object: Charged cumulative held-out information as signatures are added.
        predicted_gain: Converts a classifier signal into an auditable data-versus-candidate-shrinkage bound.
    quantifier_order: >-
      Choose the finite public stratum family, messages, key set, simulator, and
      scoring rule before sampling; then require one simulator to cover all
      keys and all allowed signature counts. Do not select a stratum per key
      after viewing transcripts.
    method_ceiling:
      strongest_certifiable_claim: >-
        A source-gated toy statement about conditional multi-signature
        distinguishability and fully charged information at specified query counts.
      nearby_object_control: >-
        A marginal-matched synthetic mixture whose labels are independently
        permuted across signatures; conditional one-shot bias remains but
        same-key accumulation must vanish.
    proof_obligations:
      - claim: Reproduce the primary multi-signature simulator and query model.
        responsibility: baseline
      - claim: Fix public strata without secret-dependent selection.
        responsibility: interface
      - claim: Bound conditional, marginal, and held-out estimation error jointly.
        responsibility: success_probability
      - claim: Relate measured information to a candidate-set bound without assuming a decoder.
        responsibility: correctness
      - claim: Charge every signature, retry, preprocessing step, byte of memory, and verification.
        responsibility: runtime
      - claim: Keep any hard-problem relevance conditional and owned by GOAL-SSI-001.
        responsibility: scope
    not_applicable_reason: null
  target_complexity:
    time_exponent: >-
      n/a now; no exponent claim. Any future relevance requires a positive-power
      candidate shrinker after total query and decoding cost.
    memory_exponent: n/a now; all transcript storage and model state must be charged
    best_known: >-
      KN-TECH-057 matched baseline is van Oorschot-Wiener p^(1/2) over Fp2,
      or conditional p^(1/4) over Fp with the specified mixing assumption.
    hidden_overhead: >-
      Signature queries, retry costs, stratum sparsity, model fitting,
      cross-validation, decoder construction, preprocessing, and verification
      are explicit; fixed-parameter toy curves cannot hide them in o(1).
    tradeoff_note: >-
      More signatures may increase information but also increase data, storage,
      and verification linearly or worse. Parallel queries reduce wall time only
      when the security model permits them and do not erase total work.
  sota_delta:
    claim: No current speedup; exponent delta is 0 unless a later positive-power fully charged shrinker is proved.
    baseline_time_exponent_fp2: 0.5
    conditional_baseline_time_exponent_fp: 0.25
    proposed_time_exponent_delta: 0.0
    proposed_memory_exponent_delta: 0.0
    pareto_rows:
      time: Adds multi-signature scoring and any eventual decoding cost.
      memory: Stores transcripts, stratum counts, and held-out model state.
      data: Signature count is a first-class cost and may dominate.
      preprocessing: Stratum definition and model fitting are charged per public family.
      oracle: Only protocol signing queries allowed by the filed model; no secret, EndRing, or OneEnd oracle.
      verification: Held-out scoring, null controls, and candidate verification are charged.
    frontier_check: >-
      Checked all rows against endpoint independence, posterior entropy,
      commitment collisions, verifier fibres, abort conditioning, and the
      disclosed true-simulator experiment. None combines marginal cancellation,
      same-key composition, and an explicit information-to-data cost boundary.
