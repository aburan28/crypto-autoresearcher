idea:
  id: IDEA-20260809-022eb5
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-EDDSA-9b8473
  goal_id: GOAL-EDDSA-001
  title: >-
    The Ed25519 verification-divergence candidate space is finite and its exact
    cardinality is computable before any specification is read
  class: measurement
  claim: >-
    Every object that can separate two admissible Ed25519 verification readings
    is built from a small finite set: the torsion subgroup of order 8, the
    finitely many byte strings that decode to a point under a non-canonical
    y-coordinate or sign convention, and the finitely many S values in the gap
    between the group order and 2^256 modulo the check being applied. The claim
    is that the product of these gives an exactly computable candidate space
    whose size can be stated as an integer today, and that a complete pass over
    it costs seconds. If true, this goal's matrix is an ENUMERATION rather than
    a search, which changes the evidence tier of every later record in it.
  mechanism: >-
    Enumerate the torsion points explicitly, enumerate the encoding classes by
    direct construction over the finitely many field elements admitting a
    non-canonical serialization, and take the product with the S-range classes.
    Each candidate is evaluated under each admissible verification equation by
    direct computation; the equations differ only in whether both sides are
    multiplied by the cofactor and in which rejection predicates are applied.
  why_not_a_renamed_known_approach: >-
    Published taxonomies of Ed25519 verification behaviour test a chosen set of
    interesting vectors against a chosen set of libraries. This record does the
    complementary thing: it computes the SIZE AND STRUCTURE of the candidate
    space first, so that a later claim of completeness is a theorem about a
    finite set rather than a statement about how many cases were tried.
  predictions:
  - observable: cardinality of the candidate separating space
    metric: exact integer, factored into torsion x encoding x S-range components
    predicted: >-
      Small enough to enumerate exhaustively in seconds on one core. A space
      that turns out to be intractably large falsifies the premise that this
      goal's matrix can be complete, and that outcome is worth knowing in
      batch one.
  - observable: number of distinct behaviour vectors realized over the space
    metric: count of distinct (accept/reject) tuples across admissible readings
    predicted: >-
      Strictly fewer than the number of candidates, since many candidates are
      equivalent; the quotient by behaviour is the object the matrix actually
      needs.
  minimal_test: >-
    Implement curve arithmetic and point decoding from first principles, verify
    against the official test vectors, enumerate the three components, and emit
    the candidate list with its behaviour vector under each of the admissible
    readings implemented as separate predicates. Record the exact counts.
  controls:
  - >-
    ARITHMETIC CONTROL: the implementation must reproduce the official test
    vectors bit-exactly before any enumeration output is recorded. An
    enumeration produced by a subtly wrong decoder is the single most likely way
    to manufacture a false result here.
  - >-
    INDEPENDENT RECOUNT: the cardinality is recomputed by a second
    implementation written without reference to the first; the two integers must
    agree exactly.
  falsification_conditions:
  - The candidate space is not finite under some admissible reading, or is too large to enumerate within the batch budget.
  - The two independent counts disagree, in which case nothing is recorded until the discrepancy is resolved.
  interpretation_limits: >-
    A candidate is not a certificate. This record produces the space and its
    structure only; whether any candidate actually separates two readings of a
    real specification is decided after the specifications are filed.
  sota_delta: >-
    No attack and no security claim. The contribution is a completeness
    foundation: it converts every later divergence statement in this goal from
    "we tested these vectors" to "we enumerated the space".
  dominated_by: >-
    Not dominated by any corpus record: no ledger entry touches EdDSA
    verification semantics at all. Externally, published verification taxonomies
    dominate on breadth of libraries tested and are dominated here on
    completeness of the object space.
  estimated_cost: >-
    Implementation small (curve arithmetic plus decoders, twice). Compute
    negligible: seconds.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: >-
    Grepped ledger/, knowledge/ and ideas/ for Ed25519, EdDSA, cofactor and
    torsion: no records. WEB NOT CHECKED, and the published taxonomy line is
    RECALLED rather than read.
  source_refs:
  - RFC 8032 -- REQUIRED READ, NOT YET READ.
  - Published Ed25519 verification taxonomies -- RECALLED, not located, must be acquired before completeness is claimed against them.
