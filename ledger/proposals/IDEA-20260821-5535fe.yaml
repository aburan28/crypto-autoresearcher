  assumptions:
  - >-
    q = 1 mod 2n for ML-DSA (verified by arithmetic here: 8380416 = 512 * 16368), so X^256 + 1
    splits completely and pi_S exists for every S. At reduced parameters the surrogate q must
    be chosen with the same property or the object does not exist there.
  - >-
    The Gaussian heuristic applies to the ideals I_{S-complement}. These are structured
    lattices and the heuristic is known to be less reliable for structured objects, which is
    exactly why stage 1 MEASURES the count rather than assuming it, and why NULL-3's two forced
    ends are the admissibility gate.
  - >-
    The lift cost is dominated by BDD in I_{S-complement} under a fixed reduction backend at a
    fixed block size; other lift strategies exist and are not covered. Any negative result is
    scoped to the strategy class actually implemented.
  - >-
    Reduced n (32, 64, 128) preserves the qualitative fibre behaviour of n = 256. This is a
    TRANSFER ASSUMPTION and is not discharged by any run under this record.
  - >-
    Memory is charged in the MITM cost model. An uncharged table is not a cost model, and a
    MITM whose gain vanishes once memory is charged is reported as having no gain.
  proof_search_map:
    bottleneck: >-
      The LIFT: recovering a B-bounded preimage of pi_S(x) from the coset x + I_{S-complement}.
      This is the single step whose cost decides whether the coordinate split is worth
      anything; the projection direction is free and the enumeration on S is algebraic.
    baseline_embedding:
      parameter_slice: >-
        s = |S| = 256 reproduces the direct problem exactly (pi_S is then the identity up to
        the NTT bijection), and s = 0 reproduces "no information" exactly. Both are exact
        boundaries, not approximations.
      reproduction_check: >-
        Frozen fixture: at s = 256 the MITM pipeline's reported cost must equal the direct
        MSIS cost measured by the same backend on the same instances, to within the run-to-run
        spread of that backend. At s = 0 the lift must succeed with probability equal to the
        density of B-bounded elements in R_q, which is (2B+1)^256 / q^256 and is computable in
        advance. A curve that merely resembles the baseline is not an embedding.
    observation_collision:
      observable: >-
        The measured lift-success threshold in s, and the MITM cost curve over s relative to
        the direct cost.
      distinct_preimage_search: >-
        A collision exists and is exhibited by NULL-1 and NULL-2: an object with FULL
        information (s = 256, a mere coordinate change) and an object with NO ring structure
        (a random unstructured lattice) can both produce a cost curve whose minimum sits below
        the naive direct estimate if the enumeration accounting is sloppy, because both admit
        the same table-keyed bookkeeping. Both are therefore run, and both must return gain
        exactly 1.0. Two ground-truth objects on opposite sides of the claimed conclusion
        (structure helps / structure is irrelevant) with the same observable would falsify
        identifiability; the additional condition that separates them is that the ring
        homomorphism property is checkable symbolically and holds for exactly one of them.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        pi_S : R_q -> F_q^S, moving the verification equation into a model where the algebraic
        hypothesis is an exact equality in a product of fields and the only remaining content
        is a bounded-preimage condition.
      predicted_gain: >-
        Encoding is free and exact (ring homomorphism); completeness is exact; SOUNDNESS IS
        WHERE THE COST LIVES and is quantified by L(s, B). The predicted net gain against
        core-SVP is ZERO or negative, and the predicted deliverable is the obstruction
        s*(B) = 200.35 out of 256 at the z-bound.
    - transform: boundary_lift
      proposed_object: >-
        Enlarge the certificate family from "a full forgery" to "an S-partial forgery plus a
        bounded lift certificate", and ask for a STRICT inward improvement over the direct
        cost rather than mere feasibility.
      predicted_gain: >-
        None expected. The transform is included because the §8 discipline requires naming
        which transform is being attempted, and because a strict-improvement framing is what
        prevents "the projected problem is easier" from being mistaken for progress.
    - transform: observable_fiber
      proposed_object: >-
        Hold pi_S(x) fixed and vary the forgotten structure across the fibre, looking for an
        intrinsic invariant (beyond the norm) that distinguishes lifts arising from genuine
        signatures from arbitrary coset members.
      predicted_gain: >-
        If such an invariant exists and is computable from pi_S(x) alone, the lift's search
        space shrinks and the split point moves; this is the one route by which the record
        could produce a positive, and it is stage 4's scale audit in disguise.
    quantifier_order: >-
      FOR ALL S contained in {0,...,255} and FOR ALL bounds B in the declared ladder, THERE
      EXISTS a lift procedure in the declared strategy class whose cost is C(s, B); and the
      MITM claim is: THERE EXISTS s such that FOR ALL instances in the declared family the
      total cost is below the direct cost. Note that the existential on s is allowed to depend
      on B and on the parameter set but NOT on the instance - an s chosen per instance after
      seeing it would be a different and much weaker claim, and the sweep is therefore reported
      as a single curve over s and not as a per-instance minimum.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At the reduced parameters and within the declared lift strategy class, the minimum
        over s of the modelled MITM cost is R times the directly measured cost, with memory
        charged; and the measured lift threshold agrees with s*(B) to within X per cent." The
        method can NEVER certify that no coordinate split helps at FIPS 204 parameters, and can
        never certify a lower bound on any adversary.
      nearby_object_control: >-
        A ring R_q' = Z_q'[X]/(X^n + 1) with q' NOT congruent to 1 mod 2n, so that X^n + 1 does
        not split completely and pi_S exists only for unions of the larger CRT factors. There
        the hoped-for conclusion (a fine-grained coordinate split) FAILS by construction. If the
        pipeline reports the same cost curve for both, it has not identified the load-bearing
        structure and its result is about the accounting, not about the splitting.
    proof_obligations:
    - claim: 'pi_S is a surjective ring homomorphism with kernel of size q^{256-|S|}, and it commutes with exactly the listed ML-DSA steps.'
      responsibility: correctness
    - claim: 'The number of B-bounded elements in a fibre is (2B+1)^256 / q^s up to a measured correction factor.'
      responsibility: size
    - claim: 'The lift cost at (s, B) under the declared backend and block size.'
      responsibility: runtime
    - claim: 'The lift returns a correct preimage whenever one exists and s is above the measured threshold.'
      responsibility: correctness
    - claim: 'The probability that a random projected candidate has a B-bounded lift, under the fibre law.'
      responsibility: success_probability
    - claim: 'Table memory is charged in the total, and the reported gain is recomputed with memory free and memory charged.'
      responsibility: memory
    - claim: 's = 256 reproduces the direct cost and s = 0 reproduces the trivial density.'
      responsibility: baseline
    - claim: 'The nearby object with a non-splitting q gives a different cost curve.'
      responsibility: strictness
    - claim: 'No result at reduced n is stated as a result about n = 256 or about FIPS 204.'
      responsibility: scope
    not_applicable_reason: null
  predictions:
  - metric: 'measured lift-success threshold in s, versus the derived s*(B) = 256 * log2(2B+1) / log2(q)'
    direction: different
    minimum_effect: 'agreement within 25 per cent at every B on the ladder; a larger deviation falsifies the fibre law for these ideals and voids the cost model'
  - metric: 'derived s* at B = eta = 2, against the 32 coefficients ePrint 2023/1866 reports as sufficient for Dilithium2'
    direction: different
    minimum_effect: 'derived 25.85; agreement within 25 per cent is the external calibration and is already satisfied at 24 per cent, subject to that paper''s full text being re-checked'
  - metric: 'minimum over s of modelled MITM cost, divided by the directly measured MSIS cost at the same reduced parameters, memory charged'
    direction: different
    minimum_effect: 'predicted at or above 1.0 (no gain); a ratio below 0.5 would be the positive finding and would require attribution to a named mechanism before any interpretation'
  - metric: 'split lopsidedness s*/256 at the z-bound'
    direction: higher
    minimum_effect: 'predicted 0.78 at ML-DSA-44 (200.35/256) and 0.87 at ML-DSA-65/87 (222.6/256); a value near 0.5 would mean a balanced split exists and would change the prediction above'
  - metric: 'MITM gain on NULL-1 (s = 256) and NULL-2 (unstructured lattice)'
    direction: different
    minimum_effect: 'exactly 1.0 within backend spread; any gain there voids every other number'
  - metric: 'cost curve on the nearby non-splitting-q object versus the splitting-q object'
    direction: different
    minimum_effect: 'the two curves must differ; identical curves mean the pipeline is not reading the ring structure'
  minimal_test:
    design: >-
      The CHEAP GATE FIRST, and it is most of the value. Stage 0 plus stage 1 at n = 64 with a
      small NTT-friendly q: enumerate I_{S-complement} for s from 0 to 64 over 20 random S per
      s, count B-bounded points by direct enumeration for B in {1, 2, 4, 16, 64}, and compare
      against (2B+1)^64 / q^s. Include NULL-3's two forced ends. This is minutes of compute and
      it either confirms the fibre law or kills the cost model outright. ONLY IF IT PASSES: the
      expensive part, stage 2's lift-threshold measurement at n = 64 and n = 128 over >= 30
      instances per (s, B) with a fixed reduction backend, plus stage 3's sweep and the two
      nulls, plus the nearby non-splitting-q control. THIS DISCRIMINATES because the fibre law
      makes a numeric prediction that can be wrong; because the two nulls have forced values of
      exactly 1.0; because the nearby object must produce a different curve; and because the
      headline ratio has a pre-declared predicted side (no gain) so a positive cannot be
      manufactured by choosing the comparison after the fact.
    controls:
    - 'NULL-1: s = 256 (full NTT), a pure change of coordinates, forced gain exactly 1.0.'
    - 'NULL-2: random unstructured lattice of matched dimension and determinant, forced gain exactly 1.0.'
    - 'NULL-3: the two derived ends of the fibre law (s far above and far below s*), both forced.'
    - 'Nearby-object control: q not congruent to 1 mod 2n, so fine-grained splits do not exist.'
    - 'Sensitivity ladder over B at five values with a monotonicity verdict reported.'
    - 'Direct MSIS cost measured with the SAME backend and block size on the SAME instances, so the ratio is not a comparison across cost models.'
    - 'Memory charged and uncharged, both reported.'
    required_metrics:
    - 'measured versus predicted B-bounded fibre counts, as a ratio, over the (s, B) grid'
    - 'lift-success rate and cost per (s, B), with >= 30 instances each'
    - 'measured lift threshold in s versus derived s*(B)'
    - 'modelled MITM cost curve over s, memory charged and uncharged'
    - 'minimum of that curve divided by the directly measured MSIS cost'
    - 'gain on NULL-1 and NULL-2'
    - 'cost curves for the splitting-q and non-splitting-q objects'
    - 'monotonicity verdict across the B ladder'
    - 'the reduction backend, block size and core-SVP convention actually used'
  falsification_conditions:
  - 'Stage 0 finds that some coefficient-domain operation does commute with pi_S: the projection is less lossy than claimed at that step and the object is revised or withdrawn.'
  - 'The measured fibre count deviates from (2B+1)^n / q^s by more than 25 per cent at any interior point: the Gaussian heuristic fails for these ideals, the cost model is void, and THAT is the finding - a measured obstruction about structured lattices, reusable well outside this lane.'
  - 'The measured lift threshold does not track s*(B) monotonically across the B ladder: no directional reading is attached and the split sweep is not run.'
  - 'NULL-1 or NULL-2 reports a gain: the accounting credits the coordinate change or the bookkeeping, and every other number is void.'
  - 'The non-splitting-q nearby object produces the same cost curve: the pipeline is not reading ring structure.'
  - 'The MITM minimum is at or above the direct cost, as predicted: recorded as a §4-standard CLOSURE - named obstruction (the l-infinity predicate is not diagonal in the CRT basis, forcing s*(B) = 200.35/256 at the z-bound so the split is 200 against 56), an argument (the fibre law and the measured threshold), and forward guidance naming what remains open (per-predicate effective scales from stage 4; invariants on the fibre beyond the norm; partially splitting rings where the CRT factors are larger).'
  - 'The MITM minimum is below the direct cost: the POSITIVE outcome, and it is not reportable until attributed to a named mechanism and reproduced on independent instances, because the prior stated below is low and an unexplained positive is an accounting bug until shown otherwise.'
  confounders:
  - 'Reduction-backend variance: BKZ success is instance-dependent and block-size-dependent; mitigated by >= 30 instances per cell and by measuring the direct cost with the same backend.'
  - 'Enumeration accounting can silently credit work that a real attacker must redo per instance; the two nulls exist to catch exactly this.'
  - 'Structured lattices are the known weak point of the Gaussian heuristic; stage 1 measures rather than assumes, and a failure there is a first-class result rather than a nuisance.'
  - 'Reduced n changes the ratio log2(2B+1)/log2(q) unless B and q are scaled together; the surrogate must hold that ratio, or s*/n is not comparable to the FIPS value and the lopsidedness claim does not transfer.'
  - 'Choosing the core-SVP convention after seeing the ratio would let the headline be selected; the convention is declared before the run and results are reported under two conventions.'
  interpretation_limits:
  - 'Toy-tier only. Every measurement is at n in {32, 64, 128}; ML-DSA is n = 256 with (k, l) up to (8, 7), and nothing here transfers by default.'
  - 'A negative closes exactly the declared lift strategy class at the declared reduced parameters and closes nothing else. It does NOT declare the direction impossible - partially splitting rings, per-predicate scales, and fibre invariants are all named as remaining open.'
  - 'The fibre law''s agreement with ePrint 2023/1866''s measured 32 is a calibration of a heuristic, not a validation of this record''s attack model, and that paper''s full text was not read.'
  - 'No claim about FIPS 204 security at any tier. No forgery is produced or attempted at standardised parameters.'
  heuristic_assumptions:
  - id: H1
    statement: >-
      For S drawn uniformly at random from the subsets of {0,...,255} of size s, the ideal
      lattice I_{S-complement} = {x in R_q : NTT(x)_j = 0 for all j in S}, which has
      determinant exactly q^s and rank 256, contains a number of points of infinity-norm at
      most B equal to (2B + 1)^256 / q^s * (1 + o(1)), uniformly for s in a range around
      s*(B) = 256 * log2(2B+1) / log2(q).
    rigorous_support: >-
      The rigorous ingredients are exact: I_{S-complement} is a full-rank lattice in Z^256 with
      determinant exactly q^s (it is the kernel of a surjection onto F_q^s), and the volume of
      the infinity-ball of radius B is exactly (2B+1)^256 as a point count in Z^256. The
      classical distribution statement being imitated is the Gaussian heuristic: the number of
      points of a "random" full-rank lattice in a convex body is vol(body)/det(lattice). H1
      asks only that these specific structured ideals behave like random lattices of their
      determinant with respect to infinity-ball point counts.
    validation_plan: >-
      At n = 32 and n = 64 with a small NTT-friendly q, compute the exact B-bounded point count
      of I_{S-complement} by direct enumeration (feasible at these n for small B) for 20 random
      S at each s from 0 to n, and for B in {1, 2, 4, 16, 64}. Compare the empirical count
      against (2B+1)^n / q^s and report the ratio's distribution across S. TAIL CHECKS: (a) at
      the largest s where the predicted count exceeds 1, the observed count must exceed 1 for
      the majority of S; (b) at the smallest s where the predicted count is below 1, the
      observed count must be 0 for the majority of S; (c) report the S achieving the extreme
      counts and check whether they are structurally special (e.g. S a union of Galois orbits),
      because a dependence on the ARITHMETIC of S rather than only on |S| would be a finding in
      its own right. Sampled parameters (n, q, s-range, B-ladder, 20 S per cell) recorded.
      TRANSFER ASSUMPTION, stated and NOT discharged: that behaviour at n = 32, 64 predicts
      behaviour at n = 256 with q = 8380417, where direct enumeration is impossible.
  - id: H2
    statement: >-
      The cost of recovering a B-bounded preimage from a coset of I_{S-complement}, by lattice
      reduction at a fixed block size, is a function of s and B alone (not of the arithmetic of
      S), and exhibits a sharp threshold in s located within 25 per cent of s*(B).
    rigorous_support: >-
      Imitates the standard BDD-success-versus-root-Hermite-factor picture: success is governed
      by the ratio of the target distance to the lattice's Gaussian-heuristic-expected shortest
      vector, which for I_{S-complement} is determined by det = q^s and rank 256. The rigorous
      part is the determinant; the heuristic part is the sharpness and the location.
    validation_plan: >-
      Measure the success rate at 30 instances per (s, B) cell across the s-ladder at n = 64
      and n = 128, and fit the threshold location and width. Compare the location to s*(B).
      TAIL CHECK: at the two s values bracketing the fitted threshold, report the raw
      success counts rather than only the rate, since a 30-instance rate near 0.5 has a wide
      interval. Additionally test the "function of s alone" clause by grouping S into Galois
      orbits versus generic subsets and comparing thresholds; a difference falsifies H2's
      independence clause and is itself a structural finding. Sampled parameters recorded.
      TRANSFER ASSUMPTION: none of these thresholds is extrapolated to n = 256.
  target_complexity:
    time_exponent: >-
      The candidate MITM cost is modelled as T(s) = T_enum(s) + N_table(s) * T_lift(s), where
      T_lift(s) is the measured BDD cost in a 256-dimensional lattice of determinant q^s and
      N_table(s) is the number of table entries. NO IMPROVED EXPONENT IS CLAIMED. The predicted
      outcome is that min_s T(s) is at or above the direct cost, and the reason is derived in
      advance: at the z-bound s*(B) = 200.35 out of 256, so the split is 200 against 56 and the
      "small" half is 56 coordinates carrying q^56 = 2^1287.9 of the algebra - a
      meet-in-the-middle gains only when the halves are comparable.
    memory_exponent: >-
      The table holds N_table(s) entries, each an element of F_q^s, i.e. s * log2(q) bits =
      4599.7 bits at s = 200. Memory is charged in every reported total and the gain is
      reported both memory-charged and memory-free, because a MITM whose gain survives only
      with free memory has no gain.
    best_known: >-
      For MSIS at ML-DSA parameters the incumbent is the published core-SVP estimate obtained
      by BKZ with a sieving SVP oracle (exponent 0.292 beta classical, 0.265 beta quantum,
      RECALLED convention - to be cited precisely by any derived experiment). This record's
      candidate is not expected to beat it and says so.
    hidden_overhead: >-
      Three honest disclosures. (i) T_lift is itself a lattice-reduction cost in dimension 256,
      so the analysis is CIRCULAR unless the small half is genuinely enumerable - and the
      derived s*(B) says it is not at the z-bound. That circularity is the central weakness of
      the proposal and is stated, not hidden. (ii) The Gaussian heuristic is applied to
      STRUCTURED ideals, where it is least reliable; H1 measures it rather than assuming it.
      (iii) Any o(1) in a scaled-up statement would hide the n = 64/128 to n = 256 transfer,
      which no run under this record discharges.
    tradeoff_note: >-
      The sweep over s IS a time-memory tradeoff curve: larger s means a larger table and a
      cheaper lift, smaller s the reverse. The curve is the deliverable and it should be
      reported alongside the van Oorschot-Wiener interpolation for the direct claw formulation,
      so a reader can see whether the coordinate split offers anything the generic tradeoff does
      not. Parallelisation is trivial in the table-build phase and is not the bottleneck.
  dominated_by: >-
    The published core-SVP MSIS estimate at ML-DSA parameters DOMINATES the candidate MITM in
    the Pareto sense on every axis, by prediction: it is expected to be faster (min_s T(s) at or
    above the direct cost), it uses less memory (the MITM's table is charged and the direct
    sieve's memory is already counted in core-SVP), and it needs no data or queries. That
    domination is the PREDICTED outcome, stated before the run, and it is what makes the
    positive branch interesting rather than expected. Other frontier rows checked: ePrint
    2023/1866, which is not comparable because it requires side-channel leakage and this record
    assumes none - but which dominates on the specific task of completing a secret from partial
    NTT coordinates; ePrint 2024/1373 and 2025/214, both requiring signatures or traces this
    record does not use; the seven existing RQ-MLDSA-001 proposals, none of which produces an
    attack cost triple; arXiv 2604.22900, whose claim is asymptotic, unrefereed and carries no
    concrete figures, so it cannot be placed on the frontier at all and is not used as one.
  sota_delta: >-
    Predicted delta against the best known MSIS attack: ZERO OR NEGATIVE, i.e. this is expected
    to be slower, and the record is proposed for the measured obstruction and the object, not
    for a speedup. Quantitatively, the pre-run prediction is min_s T(s) / T_direct at or above
    1.0 and the deliverable is (i) the closed-form s*(B) with values 25.85 / 200.35 / 222.6 and
    its 24-per-cent agreement with an independently reported 32, (ii) the measured lopsidedness
    0.78 and 0.87 at the three categories, and (iii) a measured fibre-count law for structured
    ideals that is reusable outside this lane. The smallest movement that would count as a
    positive is min_s T(s) / T_direct below 0.5 - a one-bit gain - and even that would be
    reported as an accounting bug until attributed to a named mechanism and reproduced.
  estimated_cost:
    implementation: high
    compute: high
  recommended_priority: high
  honest_prior_of_survival: >-
    By part, and the headline prior is deliberately low. (i) That pi_S is a ring homomorphism
    commuting with exactly the listed steps and with none of the coefficient-domain ones: ~0.97
    - this is algebra and stage 0 will confirm or refute it in an afternoon. (ii) That the
    fibre law holds within 25 per cent at reduced n: ~0.7 - the Gaussian heuristic on structured
    ideals is the real risk, and a failure here is a genuinely valuable finding. (iii) That the
    measured lift threshold tracks s*(B): ~0.65. (iv) That the two nulls return gain exactly
    1.0: ~0.8. (v) THAT ANY SPLIT BEATS THE DIRECT COST: ~0.05, and I would bet heavily against
    it; the lopsidedness argument is strong and derived in advance. (vi) That stage 4's
    per-predicate scale audit finds a genuinely smaller effective B on some coordinates: ~0.2 -
    this is the only route to a positive and it is a long shot. (vii) That the record yields a
    §4-standard closure with a measured obstruction if negative: ~0.85. THE PROPOSAL IS
    RECOMMENDED AT HIGH PRIORITY DESPITE (v) BEING 0.05 because the deliverable that is likely -
    a measured fibre law for structured ideals, a derived critical split point calibrated
    against an external measurement, and a named obstruction with forward guidance - is worth
    more than the expected value of the long shot, and because docs/inventor-protocol.md is
    explicit that a well-characterised object plus an honest map of where it fails is a durable
    deliverable.
