idea:
  id: IDEA-20260821-5535fe
  question_id: RQ-MLDSA-001
  added: '2026-08-21'
  title: >-
    Track the ML-DSA verification equation through a PARTIAL NTT: for S a subset of the 256
    CRT coordinates, pi_S from R_q to F_q^S is a surjective RING HOMOMORPHISM (q - 1 =
    8380416 = 512 * 16368, so X^256 + 1 splits completely), so it commutes with every
    algebraic step and with NO coefficient-domain predicate. That asymmetry is the object.
    Derive the fibre law s*(B) = 256 * log2(2B+1) / log2(q) BEFORE running - 25.85 for
    eta = 2 secrets against the 32 coordinates ePrint 2023/1866 reports as sufficient, and
    200.35 for the z-bound at ML-DSA-44 - then measure whether any split point makes a
    meet-in-the-middle over CRT coordinates beat the direct MSIS cost, or exhibit the
    lopsidedness as a named obstruction.
  class: representation
  claim: >-
    (A) THE PROJECTION, AND WHY IT PASSES THE LOSSY-PROJECTION TEST IN ITS STRONGEST FORM.
    ML-DSA works in R_q = Z_q[X]/(X^256 + 1) with q = 8380417. Since q - 1 = 8380416 =
    512 * 16368, q is 1 mod 2n and X^256 + 1 factors into 256 distinct linear factors mod q,
    so R_q is isomorphic as a ring to F_q^256. For any S contained in {0,...,255}, the
    coordinate projection pi_S : R_q -> F_q^S is a SURJECTIVE RING HOMOMORPHISM with kernel
    of size q^{256 - |S|}. It therefore (i) genuinely discards information when |S| < 256 -
    the fibre is a full coset of an ideal - and (ii) discards it COMPATIBLY with every
    operation ML-DSA performs algebraically: matrix-vector products A z, the products c*t1,
    c*s1, c*s2, c*t0, and all additions commute with pi_S exactly. A projection that is a
    ring homomorphism is not a change of coordinates; it is the canonical example of one that
    is not.
    (B) WHAT IT DOES NOT COMMUTE WITH, WHICH IS THE ENTIRE RESEARCH CONTENT. Decompose,
    HighBits, LowBits, MakeHint, UseHint, the infinity norms ||z||_inf < gamma1 - beta and
    ||h||_1 <= omega, and SampleInBall are all COEFFICIENT-DOMAIN operations and none of them
    is diagonal in the CRT basis. Over F_q there is no norm at all, so knowing pi_S(z) places
    no direct constraint on ||z||_inf. The projected forgery problem is therefore purely
    algebraic and enormously easier; all the difficulty has been pushed into the LIFT.
    (C) THE FIBRE LAW, DERIVED BEFORE ANY RUN. The fibre pi_S^{-1}(v) is a coset of the ideal
    I_{S-complement} = {x in R_q : NTT(x)_j = 0 for all j in S}, which as a lattice in Z^256
    has determinant q^{|S|}. By the Gaussian heuristic the expected number of lifts with
    ||x||_inf <= B is L(s, B) = (2B + 1)^256 / q^s with s = |S|, so the CRITICAL SPLIT POINT
    at which a projected solution has on average one B-bounded lift is
    s*(B) = 256 * log2(2B + 1) / log2(q). With log2(q) = 22.9986: for B = eta = 2 (secret-key
    coefficients) s* = 256 * 2.3219 / 22.9986 = 25.85; for B = gamma1 - beta - 1 = 130993 at
    ML-DSA-44, s* = 256 * 17.9991 / 22.9986 = 200.35; at ML-DSA-65 and -87 (gamma1 = 2^19),
    s* = 222.6.
    (D) THE INDEPENDENT CALIBRATION THAT MAKES THIS A PREDICTION AND NOT A FIT. ePnt 2023/1866
    ("When NTT Meets SIS", retrieved) reports that for Dilithium2 the minimum number of
    recovered NTT-domain coefficients needed to reconstruct the secret via a SIS-assisted
    method was reduced to 32, and that from half the NTT-domain coefficients the rest follow.
    The law above predicts 25.85 for exactly that object (eta = 2 secrets, n = 256, q =
    8380417). Agreement to within 24 per cent, on a number derived here from a determinant and
    a volume with no tuning, is a real external check on the fibre law.
    (E) THE MEET-IN-THE-MIDDLE QUESTION, AND ITS HONEST PREDICTION. Split {0,...,255} into S
    and its complement. Enumerate candidate projections on S; key a table by them; join. The
    cost of the S-half is governed by the algebra and the cost of the complement-half by a
    bounded-distance-decoding problem in the 256-dimensional ideal lattice I_{S-complement} of
    determinant q^s. PREDICTED OUTCOME, STATED BEFORE THE RUN: no split beats the direct
    core-SVP cost, and the reason is a NAMED OBSTRUCTION - s*(B) at the z-bound is 200.35 out
    of 256, so the split is 200 against 56 and is hopelessly lopsided, whereas a
    meet-in-the-middle gains only when the two halves are comparable. THE MEASUREMENT DECIDES,
    and the alternative it discriminates against is concrete: the verification equation
    contains predicates at SEVERAL different scales - ||z||_inf < gamma1 - beta at 2^17, the
    hint constraint at scale gamma2 = q/88, the ||c*t0||_inf < gamma2 gate - so if the
    effective B on the part of the equation that carries the constraint is gamma2-scale rather
    than gamma1-scale, s* drops to 256 * log2(2*q/88 + 1) / 22.9986 = 256 * 17.539 / 22.9986 =
    195.2 - still lopsided - while for a hypothetical constraint at scale sqrt(q) it would be
    128, i.e. exactly balanced. The experiment measures which scale actually binds each
    coordinate of the projected system.
    (F) WHAT IS NOT CLAIMED. No forgery, no break, no exponent improvement is claimed. The
    honest prior that this beats core-SVP is low and is stated as such below. What IS claimed
    is that the object is genuinely new as a tracked object for this lane, that it is exactly
    testable, that its one-step propagation is defined and computable, and that a negative
    result is a §4-standard closure with a measured quantity (the fibre law and the measured
    split lopsidedness) rather than a fatigue report.
  mechanism: >-
    STAGE 0, ALGEBRA (no compute, and it can kill the proposal). Verify q = 1 mod 512 by
    arithmetic; verify that pi_S is a ring homomorphism and exhibit the idempotent generating
    its kernel; write out, line by line for FIPS 204 verification, which steps commute with
    pi_S and which do not. If it turns out that some coefficient-domain step does commute -
    which would be surprising - the projection loses nothing at that step and the object
    weakens accordingly.
    STAGE 1, THE FIBRE LAW, MEASURED. At reduced n (n = 32, 64, 128) and a small NTT-friendly
    q, enumerate or sample the ideal I_{S-complement} for many s and many random S, compute its
    shortest vector and its Gaussian-heuristic count of B-bounded points for a ladder of B, and
    compare against L(s, B) = (2B+1)^n / q^s. Report the ratio measured/predicted as a function
    of s and B. This is the size-bound lemma of the eventual decomposition and it is measured,
    not assumed.
    STAGE 2, THE LIFT COST. For a ladder of s around s*(B), measure the cost of recovering a
    B-bounded x from pi_S(x) by lattice reduction on the coset (BDD in I_{S-complement}), using
    a fixed reduction backend at a fixed block size, over >= 30 instances per (s, B). Report
    the success rate and the cost, and locate the threshold s at which success rises from 0 to
    1. Compare that threshold to s*(B). THIS IS THE STEP WHERE THE PREDICTION CAN FAIL
    CLEANLY: if the measured threshold is far from s*(B), the Gaussian heuristic does not hold
    for these ideals and the whole cost model is void.
    STAGE 3, THE SPLIT SWEEP. For each s, compute the modelled total MITM cost = (enumeration
    or algebraic solve cost on S) * (table cost) + (number of table entries) * (lift cost from
    stage 2), under a declared cost model with memory charged. Plot against s and against the
    direct MSIS core-SVP cost at the same reduced parameters, measured with the same backend.
    Report the minimum over s and its ratio to the direct cost.
    STAGE 4, THE SCALE AUDIT. For each of the verification predicates (z-norm, hint weight,
    c*t0 gate) determine the effective B it imposes on each CRT coordinate, and re-run stage 3
    with the per-predicate B rather than the global one. This is the arm that could produce a
    balanced split, and it is the only route by which this record could produce a positive.
  novelty_status: unverified
  novelty_screen:
    method: >-
      The crypto-kb MCP retrieval index is UNAVAILABLE this session (in-memory Qdrant), so no
      kb-provenance citation appears here. RIPGREP over /home/user/crypto-autoresearcher with
      the Grep tool (ripgrep, -i): "SampleInBall" over the repository root returned 8 files
      (four RQ-MLDSA-001 proposals, three MLDSA hypotheses, one BATCH-66b482 artefact);
      "ML-DSA|Dilithium" over knowledge/ returned 40 files, and I listed them; a combined
      count-mode pass over ledger/proposals/ for "hedged|deterministic mode|SampleInBall|
      ExpandMask|multi-target|multi-user|QROM|abort rate|rejection sampling" returned 611
      occurrences across 174 files and is recorded as too coarse to screen with; glob
      ledger/hypotheses/H-MLDSA-* returned 7. READ IN FULL: the pre-extracted inventory of all
      seven RQ-MLDSA-001 proposal titles, RQ-MLDSA-001, GOAL-MLDSA-001, KN-FIND-720727,
      KN-LIT-4f3b80, KN-TECH-1a5b7e, docs/inventor-protocol.md (all eight sections, the
      lossy-projection test in §2 applied literally here), docs/target-result-profile.md
      (Parts A-D). WEB SEARCHES bearing on this record: "module-SIS NTT CRT coordinate
      projection partial solution meet-in-the-middle lattice forgery fully splitting ring";
      "attack Module-SIS projecting onto subset of NTT coordinates ideal lattice coset short
      vectors Dilithium ring homomorphism cryptanalysis". FETCHED AND READ:
      https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.204.ipd.pdf (q, gamma1, beta, eta per
      category), https://arxiv.org/abs/2604.22900 (checked as a possible structural
      ingredient; see results).
    results: >-
      THE NEAREST EXTERNAL PRIOR ART IS ePrint 2023/1866, "When NTT Meets SIS: Efficient
      Side-channel Attacks on Dilithium and Kyber", surfaced by the second search. It embeds
      the NTT transformation matrix into a SIS search problem and performs dimensionality
      reduction using NTT properties; it reports that when half the NTT-domain coefficients
      are recovered the remainder follow by the SIS-assisted method, that the minimum number
      of required coefficients for Dilithium2 falls from 65 to 32, and that BKZ-60 recovery
      time drops from 82 hours to 1 minute. THIS IS GENUINELY ADJACENT AND MUST NOT BE
      MINIMISED: it establishes that CRT-coordinate partial knowledge plus shortness
      determines the rest, which is the same fibre phenomenon this record derives. THE
      DIFFERENCE IS THE SOURCE OF THE PARTIAL KNOWLEDGE AND THE TARGET OBJECT: 2023/1866
      obtains its NTT coordinates from a POWER SIDE CHANNEL on a Cortex-M4 and applies the
      lift to the SECRET s1 (coefficients bounded by eta); this record obtains nothing from a
      side channel, applies the projection to the FORGERY EQUATION whose vectors are bounded
      by gamma1 - beta rather than eta, and asks whether the projection supports a
      meet-in-the-middle SPLIT in a pure-cryptanalysis setting. Their measured 32 is used here
      as an independent calibration of a law derived here, which is a legitimate and
      disclosed use of a retrieved result. The first search also returned ePrint 2020/1257
      (reductions between structured SIS problems) and ePrint 2023/1935 (splitting fields and
      two-variable NTT), neither fetched. arXiv 2604.22900 (Luo, "Module Lattice Security
      (Part II)") was fetched: it claims a Hermite factor exp(Otilde(sqrt(n))) for module
      lattices via orthogonal rank-1 decomposition and sign selection; it is single-author,
      unrefereed, states no concrete figures at ML-DSA or Kyber parameters, and NOTHING IN
      THIS RECORD DEPENDS ON IT - it is logged here only because the search surfaced it and a
      later reader should know it was seen and not used. INSIDE THE REPOSITORY: no
      RQ-MLDSA-001 proposal mentions the NTT, CRT coordinates, ring homomorphisms, or a
      coordinate split. IDEA-20260808-c1abd1's claw is between lattice decodings and hash
      queries in one fixed lattice; this record's split is between coordinate subsets of one
      ring.
    verdict: >-
      UNVERIFIED, and deliberately cautious. Corpus novelty is clean. External novelty is NOT
      established and the nearest neighbour (ePrint 2023/1866) is close enough that the honest
      classification of the fibre law itself is ADAPTATION, not discovery: the phenomenon is
      demonstrably known in the side-channel setting and this record re-derives it in closed
      form and applies it elsewhere. What is claimed as new here is (a) the explicit statement
      of pi_S as a ring homomorphism satisfying the inventor-protocol §2 lossy-projection test
      in its strongest form, with the exact list of ML-DSA steps it does and does not commute
      with; (b) the closed-form critical split s*(B) with its numeric values 25.85 / 200.35 /
      222.6 and its independent calibration against 2023/1866's measured 32; and (c) the
      meet-in-the-middle split sweep with a pre-declared negative prediction and a named
      obstruction. Two of the three searches' top results were not fetched, so a paper doing
      exactly (c) may exist and would not have been seen.
  object_first_candidate:
    tracked_object: >-
      The image pi_S(state) of the ML-DSA verification state under projection onto a subset S
      of the 256 CRT (NTT) coordinates of R_q, followed from the public key (A, t1) and the
      candidate signature (c-tilde, z, h) through every algebraic step of verification to the
      point where a coefficient-domain predicate is applied.
    lossiness: >-
      GENUINELY LOSSY, provably and quantifiably: ker(pi_S) has exactly q^{256 - |S|} elements,
      so at |S| = 128 the projection discards 128 * log2(q) = 2943.8 bits per ring element. It
      is emphatically not a change of coordinates: the full NTT (|S| = 256) IS a change of
      coordinates and is explicitly excluded, and the whole design lives at |S| < 256. The
      discard is compatible with the target's operations because pi_S is a ring homomorphism:
      pi_S(x + y) = pi_S(x) + pi_S(y) and pi_S(x * y) = pi_S(x) * pi_S(y) coordinatewise, so
      the retained part propagates deterministically through A z, c t1, c s1, c s2, c t0 and
      every addition in the scheme. The compatibility FAILS - by design, and this is the
      research content - at Decompose, HighBits, LowBits, MakeHint, UseHint, both infinity
      norms, the hint weight, and SampleInBall, none of which is diagonal in the CRT basis.
    propagation: >-
      One step is one ring operation. The one-step propagation law is exactly the
      homomorphism property, so it is not merely definable and measurable but EXACT and free
      of error. The measurable content is in the inverse direction: the one-step law for the
      LIFT is the fibre law L(s, B) = (2B+1)^256 / q^s, which is a Gaussian-heuristic count on
      a lattice of determinant q^s, and it is measurable at reduced n by direct enumeration.
      Stage 1 measures it; stage 2 measures the cost of realising it.
    survival_score: >-
      Survives every algebraic step of verification and dissolves at the FIRST coefficient-
      domain predicate. In FIPS 204 verification that is Decompose/UseHint, which is one step
      after the module multiplication - so the survival depth is exactly one algebraic layer.
      The proposal reports this as a number: the fraction of verification's operation count
      that lies before the first non-commuting operation, and the s at which the lift becomes
      unique (measured against the predicted s*). A survival depth of one layer is short, and
      the record says so rather than dressing it up; the reason it is still worth measuring is
      that ONE layer is exactly where a meet-in-the-middle table would be keyed.
  null_object_control: >-
    THREE controls. NULL-1, THE FULL-NTT ARM, DERIVED TO SHOW NO GAIN: run the identical
    pipeline at |S| = 256, where pi_S is a bijection and by construction nothing is discarded.
    Its measured MITM gain must be exactly 1.0 (no gain), because a change of coordinates
    cannot help; if the pipeline reports a gain there, the cost model is crediting the
    coordinate change itself and every other number it produces is void. This is a null that
    CAN fail and its forced value is derived before the run.
    NULL-2, THE UNSTRUCTURED-LATTICE ARM: run the identical split sweep on a random
    unstructured lattice of the same dimension and determinant, where no ring homomorphism
    exists and therefore no coordinate split is available. Its MITM gain must be 1.0 as well.
    If the sweep reports a gain on an object with no ring structure, the gain is an artefact
    of the enumeration accounting rather than of the algebra.
    NULL-3, THE FIBRE-LAW FORCED VALUE: for s far above s*(B) the number of B-bounded lifts is
    below 1 and the lift must FAIL almost always; for s far below s*(B) it is astronomically
    above 1 and the lift must SUCCEED but be non-unique. Both ends are derived before the run.
    The measurement is admissible only if both ends come out as derived, and the reported
    quantity is the location of the transition, not its existence.
    SENSITIVITY DEMONSTRATION with a numeric threshold declared before the run and at least
    three interior points: sweep B over 2, 2^4, 2^8, 2^12, 2^16 at fixed n and q; the measured
    lift-success threshold must move monotonically with log B and must track
    256 * log2(2B+1) / log2(q) within 25 per cent at every interior point. Monotonicity is
    reported explicitly; two endpoints do not give a direction.
  discriminated_from:
  - >-
    ePrint 2023/1866 ("When NTT Meets SIS") recovers NTT-domain coefficients of the SECRET by
    power side channel on a Cortex-M4 and then lifts. This record injects no leakage, has no
    device, targets the FORGERY equation rather than the secret, and asks a splitting question
    rather than a completion question. Their measured 32-coefficient threshold is used here as
    a calibration of a law derived independently, with attribution.
  - >-
    IDEA-20260808-c1abd1 splits SelfTargetMSIS into lattice decodings and hash queries within
    one fixed lattice. This record splits within the COORDINATE SET of one ring. The two splits
    are along different axes and could in principle be composed; neither assumes the other.
  - >-
    IDEA-20260808-63427b concerns the l-infinity verification predicate versus l-2 cost
    estimation over the sieve's returned pool. It is about the NORM used in the cost model at
    fixed representation. This record is about the REPRESENTATION at fixed norm, and its
    central obstruction is precisely that the norm does not follow the representation - a
    statement 63427b never needs to make.
  - >-
    Subfield and norm-map attacks on ideal lattices (Cramer-Ducas-Wesolowski and successors)
    descend through SUBFIELDS using norm maps. pi_S is not a subfield map: it is a quotient by
    an ideal generated by an idempotent, its image is not a field but a product of fields, and
    it exists for every subset S rather than for the subgroup lattice of the Galois group.
  - >-
    arXiv 2604.22900 claims an asymptotic module-lattice reduction improvement. NOTHING HERE
    DEPENDS ON IT; it is recorded as seen and unused.
  - >-
    H-MLDSA-acac6d (RQ-MLDSA-001, status proposed) SHARES the exact structural ingredient and
    the exact counting quantity this record derives. Its STEP 2 derives the same complete
    splitting of X^256 + 1 modulo q = 8380417 (512 | q - 1, R_q isomorphic to F_q^256,
    multiplication by c diagonal in that basis, restriction to w NTT coordinates having rank
    exactly w), and its information-theoretic floor N_IT = ceil(256*l*log2(2*eta+1)/(w*log2 q))
    carries the forced invariant N_LA/N_IT = log2 q / log2(2*eta+1) = 9.9050 at eta = 2, which
    is ARITHMETICALLY THE SAME NUMBER as part (C) here: 256/9.9050 = 25.85 = s*(eta = 2), and
    acac6d's w = 1 entry N_IT = 104 is the ceiling of l = 4 times it (103.38). The fibre law at
    B = eta is therefore already in this ledger as a derived floor, so part (D)'s calibration
    against ePrint 2023/1866's measured 32 is an EXTERNAL check only, and this record's
    novelty_screen was wrong to call corpus novelty clean on the strength of proposal titles
    while seven H-MLDSA-* hypothesis bodies went unread.
    WHAT DIFFERS, at three points both texts state explicitly. (i) SOURCE OF THE PARTIAL
    COORDINATES: acac6d's scope is published FAULT attacks and its w known coefficients of y
    come from an injected fault on the signer; this record injects nothing, has no fault and no
    leakage, and its S is a coordinate subset the attacker chooses and enumerates over.
    (ii) EQUATION AND BOUND: acac6d tracks the SIGNING relation z = y + c*s1 toward recovery of
    s1 with ||s1||_inf <= eta; this record tracks the VERIFICATION equation toward a forgery
    split with the bound gamma1 - beta - 1 = 130993, which is exactly why s* here is 200.35 out
    of 256 rather than 25.85, and why the lopsidedness obstruction exists here and has no
    counterpart there. (iii) DISCRIMINATING TEST: acac6d is exact counting - "Pen and paper ...
    NO solver, NO lattice library" - and its HEUR-FLT-2 explicitly declines to claim any
    algorithm attaining N_IT; this record MEASURES attainability, via the empirical B-bounded
    fibre count against the Gaussian heuristic (stage 1) and the BDD lift-success threshold
    under a fixed reduction backend over >= 30 instances per cell (stage 2). The two are
    complementary and neither assumes the other: acac6d measures the room between N_IT and N_LA
    and names KN-TECH-047 as what could occupy it without claiming it does, and nothing here
    fills that bracket, because the object here is the verification equation and not a faulted
    signer.
