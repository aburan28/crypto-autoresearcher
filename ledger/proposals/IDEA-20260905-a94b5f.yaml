  assumptions:
  - The detector is run on the exact CNF the solver receives, before preprocessing.
  - A torsion-invariant V can be constructed at toy scale (an explicit construction is a Stage-0 obligation, not
    assumed).
  proof_search_map:
    bottleneck: The order of the group a search can quotient by for free; every bit of |G| is a bit off the ceiling.
    baseline_embedding:
      parameter_slice: 'Generic V at l = 6, m = 3: predicted |Aut| = 6, reproducing the source''s m! and 3c7a91''s
        |G|.'
      reproduction_check: 'Frozen fixture: the detector returns a group of order m! whose generators are block transpositions;
        checked by applying each generator to the clause set and verifying invariance.'
    observation_collision:
      observable: The automorphism group order and generators.
      distinct_preimage_search: Two encodings of the same system (CNF versus CNF-XOR) must yield groups of equal
        order; a mismatch means the group is an encoding artifact. Real versus N0 must differ (m! versus 1).
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: The full group rather than the m! count.
      predicted_gain: Any extra generator is a free bit; predicted none.
    quantifier_order: 'CLAIMED: FORALL cells and encodings, |Aut| = m! on generic and torsion-invariant V, and 1
      on N0. The quantifier at risk is over V: special subspaces (e.g. Frobenius-stable ones, impossible for prime
      n except trivial cases) could carry more.'
    method_ceiling:
      strongest_certifiable_claim: The syntactic group of the tested encodings at the tested cells; it cannot bound
        semantic symmetries.
      nearby_object_control: 'KNOWN-FALSE OBJECT: the CNF with an explicit extra symmetry planted (duplicate a block''s
        variables with a relabelling), where the detector must return order 2 m!; and N0 where it must return 1.'
    proof_obligations:
    - claim: S_m is a literal permutation of the encoded system.
      responsibility: correctness
    - claim: The torsion-induced permutation of V is not hyperoctahedral (checked by brute force at l <= 8).
      responsibility: correctness
    - claim: The detector recovers the planted symmetry on the known-false object.
      responsibility: feasibility
    - claim: Nothing transfers beyond tested V families and encodings.
      responsibility: scope
    not_applicable_reason: null
  predictions:
  - metric: aut_order on generic V, m in {3,4}, l in {4..9}, CNF and CNF-XOR
    direction: different
    minimum_effect: Exactly m! at every cell; any other value is the finding.
  - metric: aut_order on torsion-invariant V
    direction: different
    minimum_effect: Exactly m!; a value >= 2 m! falsifies (B) and is worth log2 extra bits.
  - metric: aut_order on N0 null
    direction: lower
    minimum_effect: Exactly 1.
  - metric: UNSAT leaf ratio with detector-generated symmetry-breaking clauses versus without, same instances
    direction: different
    minimum_effect: Within [0.95, 1.05] of 1/m! (the detector's breaking reproduces the source's factor); SAT instances
      reported separately with their position variance.
  - metric: hyperoctahedral_test = is the torsion permutation of V a signed coordinate permutation
    direction: different
    minimum_effect: FALSE at every tested V (brute force at l <= 8).
  minimal_test:
    design: STAGE 0. Construct a torsion-invariant V at l in {4..6} (or record that none exists at that l); build
      the known-false object; commit m!. STAGE 1. Run the detector on generic V, torsion-invariant V, N0, and the
      known-false object at every cell; verify every returned generator by clause-set invariance. STAGE 2. Add the
      detector's breaking clauses and run cadical/kissat on 10 UNSAT and 10 planted instances per cell; compare
      leaf counts with and without (SAT/UNSAT separately). STAGE 3. Brute-force hyperoctahedral test of the torsion
      permutation.
    controls:
    - SHAPE-MATCHED RANDOM NULL N0 (predicted trivial group).
    - PLANTED-SATISFIABLE INSTANCES for the breaking-clause arm.
    - KNOWN-FALSE OBJECT with a planted extra symmetry the detector must find.
    - ENCODING CONTROL (CNF versus CNF-XOR groups equal).
    required_metrics:
    - aut_order, generators (cycle structure), detector name and version, detection seconds
    - instrumented_leaf_count with and without breaking clauses, solver_conflicts
    - hyperoctahedral_test result
    - certificate_verified, termination_reason, cell parameters
  falsification_conditions:
  - 'F1. aut_order != m! on generic V: extra bits or an encoder defect; the generators are exhibited.'
  - 'F2. aut_order > m! on torsion-invariant V: (B) is false and the torsion bits are free; reopen the source''s
    open problem.'
  - 'F3. The detector misses the planted symmetry: instrument failure; no result.'
  - 'F4. Breaking clauses do not reproduce 1/m!: the detector''s breaking is weaker than the source''s tree pruning;
    reported as a constant.'
  - 'F5 (pre-registered negative). All predictions holding: the lever is priced at exactly log2 m! bits syntactically
    and the torsion bits are routed to re-modelling.'
  confounders:
  - Preprocessing can destroy or create syntactic symmetries; the detector runs on the raw CNF.
  - Symmetry-breaking clauses interact with the block order; the source's tree pruning and clause-based breaking
    are compared, not pooled.
  - Detector timeouts on large CNFs are infrastructure outcomes.
  interpretation_limits:
  - CLAIM TIER toy; syntactic symmetries only.
  - No exponent is moved; bits of |G| are a constant factor.
  heuristic_assumptions:
  - id: H1
    statement: SYNTACTIC ASYMMETRY. Beyond S_m, the encoded pdp system has trivial automorphism group at every tested
      cell.
    rigorous_support: 'RIGOROUS HALF: S_m is an automorphism by construction. IMITATED LAW: random graphs are asymmetric
      (Erdos-Renyi, recalled); the descended coefficients are treated as generic.'
    validation_plan: 'Detector runs at every cell; TAIL: any nontrivial generator exhibited with its cycle structure;
      no scale shortcut needed - detection is polynomial.'
  - id: H2
    statement: TORSION NON-LINEARITY. The permutation of V induced by translation by a rational 2-torsion point
      is not a signed coordinate permutation for any tested V.
    rigorous_support: 'RIGOROUS HALF: x(P + T) is a non-linear rational function of x(P). The assumption is that
      no special basis makes it coordinate-wise; checked exhaustively at l <= 8.'
    validation_plan: Brute-force membership test in the hyperoctahedral group at every tested V.
  target_complexity:
    time_exponent: NO EXPONENT. The ceiling stays ml - log2|G| with |G| = m! predicted; the torsion re-modelling
      could add up to m - 1 bits (conditional, not claimed); enumeration bound (m-1)l bits and rho 0.886 N^{1/2}
      unchanged.
    memory_exponent: Poly; detection is polynomial in the CNF size.
    best_known: The source's m! quotient; FHJRV torsion symmetrization (recalled).
    hidden_overhead: Detector time and the breaking-clause overhead per node.
    tradeoff_note: None.
  estimated_cost:
    implementation: low
    compute: low
    basis: BreakID or saucy must be built (small C++); CNF from the shared encoder; torsion-invariant V construction
      in Sage. Minutes per cell.
  recommended_priority: medium
  dominated_by: 'CHECKED ROW BY ROW: as an algorithm dominated by enumeration, MITM and rho; the source''s own m!
    quotient is the row this record reproduces; FHJRV symmetrization (recalled) may dominate on bits but is not
    a SAT detection result. As a measurement: n/a (no result claimed).'
  sota_delta: 'Zero on attack axes; deliverable: the syntactic symmetry budget of the encoding (predicted exactly
    log2 m! bits) and the exhibited reason the torsion bits are not detectable.'
