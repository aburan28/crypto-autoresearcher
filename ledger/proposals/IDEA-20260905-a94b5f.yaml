idea:
  id: IDEA-20260905-a94b5f
  title: An automorphism census of the encoded system - graph-automorphism detection on the pdp CNF is predicted
    to return exactly the S_m block interchange (log2 m! bits) and nothing else, even on a torsion-invariant factor
    base, because the torsion translation is a non-linear permutation of V that is not a literal permutation; any
    extra generator is a free pruning bit and any missing one is an encoder defect
  class: measurement
  pipeline_stage: factor-base design and decomposition
  target_kind: amortised constant (bits of |G| beyond log2 m!); the record prices what symmetry detection can and
    cannot recover
  claim: 'SCOPE: binary pdp CNF and CNF-XOR models at m in {3,4}, l in 4..9, three factor-base families - generic
    V = span(1, t, .., t^{l-1}); a V chosen invariant under translation by a rational 2-torsion point T (the Galbraith-Gebregiyorgis
    simplification named as an open problem in the frozen source); and the null ladder; plus the digit-presented
    prime-field system. Tools: BreakID (embedding saucy) or a direct graph-automorphism call on the clause-variable
    incidence graph, run before any solving. CLAIM TIER toy. NO ATTACK. (A) |Aut| = m! ON GENERIC V. The syntactic
    automorphism group of the encoded system (literal permutations preserving the clause set) is exactly the block
    interchange S_m, detected as row interchangeability; the pruning it licenses is log2 m! bits and is the source''s
    factor. (B) |Aut| = m! ON A TORSION-INVARIANT V. The map P -> P + T induces a permutation of V''s x-coordinates
    that is not F_2-linear in the coordinates (x(P + T) is a rational function of x(P)), hence not a permutation
    of the c_{i,j} literals; so BreakID finds no additional generator, and the (Z/2)^{m-1} torsion symmetry (translate
    an even number of the m points) worth m - 1 bits is INVISIBLE syntactically. Recovering it requires re-modelling
    in torsion-invariant coordinates (the Faugere-Huot-Joux-Renault-Vitse symmetrized polynomials, reference [10]
    of the source), not detection. (C) THE NULL. On N0 (random coefficients per block) |Aut| = 1. (D) WHAT EACH
    OUTCOME MEANS. |Aut| > m! on generic V: a syntactic symmetry nobody has priced, worth log2(|Aut|/m!) bits at
    zero solver cost - the positive outcome. |Aut| < m!: the encoder broke S_m (asymmetric E-X relations), an instrument
    defect that would also bias every SATIC-lane leaf count. (B) failing (extra generators on the torsion-invariant
    V): the translation IS a literal permutation for that V, which is a structural fact worth m - 1 bits and reopens
    the source''s open problem at zero cost.'
  mechanism: 'TRACKED OBJECT AND LOSSY-PROJECTION TEST. The object is the automorphism group of the clause-variable
    incidence graph, i.e. the set of literal permutations fixing the formula. It is lossy: it discards the formula
    and keeps a group; the fibre over S_m is every block-symmetric formula of that shape. It is compatible with
    the solver''s operations because a symmetry maps partial assignments to partial assignments and conflicts to
    conflicts, so the quotient search propagates deterministically. The projection that fails the test: the semantic
    symmetry group of the solution set, which is not computable without solving. WHY S_m IS VISIBLE. The E-X relations
    (equation (6)) are symmetric in the block index and the F set involves only d variables; permuting blocks permutes
    c and c'' variables and fixes d and d'' variables - a literal permutation. WHY TORSION IS NOT. The GG action
    is a permutation of V induced by a rational map on x; a permutation pi of {0,1}^l is a literal permutation only
    if it is a coordinate permutation composed with negations (an element of the hyperoctahedral group), which a
    rational map on field elements is not in general; the record checks this directly by brute force at l <= 8 (H2).
    WHY THIS MATTERS. The frozen source names testing SAT solvers on the torsion-simplified system as an open problem;
    the record predicts that symmetry detection cannot do it and that the bits must come from re-modelling, which
    fixes the cost of the open problem before it is attempted. DIFFERENCE FROM 3c7a91: that record names |G| enlargement
    as a lever without a detection method or a prediction of its syntactic visibility.'
