# IDEA-20261004-b2eb42
# Addition count for the integer 1023. Proposal only. Not approved.
idea:
  id: IDEA-20261004-b2eb42
  question_id: RQ-ECDLP-002
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    The integer 1023 has bit length 10, 9 doublings, and 9 additions
  class: measurement
  claim: >-
    The integer 1023 has bit length 10. Reaching it by doubling and
    adding uses 9 doublings and 9 additions. Ten exceeds nine by 1.
    The product of 10, 9, and 9 is 810. Their sum is 28. The gap is a
    digit count, not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the binary expansion of the integer
    1023, which is coordinate-dependent and is not a group element.
    The bits are 1, 1, 1, 1, 1, 1, 1, 1, 1, and 1. The operation set is
    reading one bit and either doubling or doubling and adding. Two
    readings of the addition count both give 9, so that gap is 0.
    No curve point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-IC-889857
      provenance: internal
      claim: >-
        A first-fall-degree dispute is a different object from these
        digit counts of the integer 1023.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The integer 1023 is frozen before the bits are read.
    - No curve point is added.
  proof_search_map:
    bottleneck: The digit-count gap between 10 and 9.
    baseline_embedding:
      parameter_slice: The integer 1023 and the counts 10, 9, and 9.
      reproduction_check: >-
        Two readers must agree that the bit length is 10, the
        doubling count is 9, and the addition count is 9.
    observation_collision:
      observable: The addition count and the product.
      distinct_preimage_search: >-
        Reporting the addition count as 9 on both readings drops
        their gap. Two readings make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The integer 1023.
        predicted_gain: Nine additions. No exponent.
    quantifier_order: >-
      The integer is fixed before the bits are read.
    method_ceiling:
      strongest_certifiable_claim: >-
        The counts 10, 9, and 9. Not a scalar multiplication.
      nearby_object_control: >-
        Two readings of the addition count. Both give 9, and the gap is 0.
    proof_obligations:
      - claim: The bit length of 1023 is 10.
        responsibility: size
      - claim: The addition count is 9.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: digit_gap
      direction: different
      minimum_effect: Ten exceeds nine by 1.
  minimal_test:
    design: >-
      Read the bits of 1023 and count doublings and additions. Do not
      add a curve point.
    controls:
      - Two readings of the addition count, whose gap is 0.
      - An independent count.
    required_metrics:
      - the bit length
      - the doubling count
      - the addition count
      - the product
  falsification_conditions:
    - The addition count is not 9.
    - The product of 10, 9, and 9 is not 810.
  confounders:
    - The integer 511 has bit length 9 and eight additions.
  interpretation_limits:
    - A digit count is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the count triple 9, 8, and 8 of the integer 511.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen integer 1023 has bit length 10, 9 doublings, and
        9 additions.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of one integer.
      validation_plan: >-
        Two independent readings. A mismatch voids the product.
