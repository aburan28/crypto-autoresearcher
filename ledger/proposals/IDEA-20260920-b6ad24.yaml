  assumptions:
    - >-
      A1. n is prime and G = <P> is the full prime-order subgroup. Primality is
      load-bearing only for the ABSENCE of a subgroup fibre system; Lemma (A1)
      itself holds in any finite abelian group and that generality is used by
      IDEA-20260920-6f7416.
    - >-
      A2. Cost model M1 is imported unchanged from IDEA-20260920-a5757d,
      including its charge of one group operation per candidate and per list
      element and O(1) per sort step. Its per-evaluation cost c of sigma is
      carried explicitly in (A4) and in H2.
    - >-
      A3. Equal fibre sizes in the displayed constants. The unequal case is
      handled in IDEA-20260920-6f7416 (C3) and does not change the exponent.
    - >-
      A4. The key is PREDECLARED, fixed before the lists and independent of Q.
      Target-dependent keys are IDEA-20260829-7169d6's territory and are
      outside this record.
    - >-
      A5. Off-limits components used: F1 only as M1's level-2 birthday, F7 only
      as the charge in H2. No factor base, so KN-OPEN-020 is not engaged.

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the theorem is the passage from a
      COMBINATORIAL structure conclusion (fibres are APs) to an ANALYTIC one
      (fibres have a heavy Fourier coefficient). The combinatorial passage
      needs Freiman/Green-Ruzsa and therefore a density threshold and bounded
      doubling; the analytic passage needs only Cauchy-Schwarz and Parseval and
      has neither. Removing the analytic step returns the lane to
      IDEA-20260829-390ccc's window and the floor evaporates.
    baseline_embedding:
      parameter_slice: >-
        SLICE 1, b = 1. Lemma (A1) gives max |Ahat_i| >= |A_i| sqrt(1 - 1/M),
        i.e. the fibre indicator is essentially a pure character, which for a
        partition means the fibres are cosets of a subgroup of index M. On
        prime n no such subgroup exists, so the b = 1 cell is empty, recovering
        KN-FIND-ffe1df Theorem C. A derivation that does not recover this at
        b = 1 has mis-stated the lemma.
        SLICE 2, composite n = a*a' with sigma = reduction mod a. Here b = 1,
        M = a, |A_i| = a', and max over xi != 0 of |Ahat_i(xi)| = |A_i| exactly
        (the indicator of a subgroup coset of Z/n is maximally biased at the
        annihilator frequencies). Lemma (A1) predicts >= |A_i|/sqrt(2); the
        truth is |A_i|. The lemma is TIGHT UP TO sqrt(2) on the one object that
        provably exists.
        SLICE 3, F_2^{3m} with the m-bit prefix key. Fibres are cosets of a
        subspace, b = 1, max |Ahat| = |A| exactly. The chain must go SILENT
        here, and it does, because there is no Weil bound in (A2) for a group
        that is not a prime-order curve subgroup. A version of the argument
        that closed XOR would be refuted on the spot.
      reproduction_check: >-
        SYMBOLIC, and each value is a forced integer or closed form with its
        group named. (i) sigma = identity on Z/n: M = n, |A| = 1, b = 1,
        max |Ahat| = 1, lemma bound 1/sqrt(2); PASS, not tight. (ii) sigma =
        constant: M = 1, the lemma is vacuous by its own hypothesis M >= 2 and
        must be reported as inapplicable, not as satisfied. (iii) Z/(a*a') with
        sigma = reduction mod a: b = 1 EXACTLY, max |Ahat|/|A| = 1 EXACTLY,
        computed over the additive characters of Z/(a*a'). (iv) interval
        partition of Z/N into M equal parts on integer representatives in
        [0, N), N prime: b = 2 EXACTLY when M divides N and b <= 3 otherwise
        (an interval of length 2N/M - 1 starting at a fibre boundary meets
        exactly two fibres; an off-boundary start meets at most three), and
        max |Ahat(1)|/|A| = |sin(pi/M)| / (pi/M) + O(1/N), which tends to 1.
        (v) Wagner's low-bits key a -> a mod 2^k on integer representatives in
        [0, N), N prime: b = 2 EXACTLY, the two branch values being
        low(a) + low(b) and low(a) + low(b) - N, both reduced mod 2^k. Values
        (iv) and (v) are DIFFERENT partitions of Z/N with the same b and must
        not be conflated.
    observation_collision:
      observable: >-
        The triple (M, b, eps_max), i.e. image size, one-step additive
        branching, and the largest normalised nontrivial DL-Fourier coefficient
        of a fibre indicator, all computed in the character group of <P> and
        never in F_p^*.
      distinct_preimage_search: >-
        THE COLLISION IS REAL AND IS STATED. The DL-interval partition of Z/n
        and its rescaling by any unit d share (M, b, eps_max) exactly, and so
        does any partition Freiman-isomorphic to an interval partition. The
        observable cannot separate members of that class -- harmless, because
        (A1) is a statement about the whole class. A SECOND collision, which is
        NOT harmless and is the one a reviewer must check: a coordinate-bucket
        key at the Weil level and a random balanced partition both return
        eps_max far below 1/(M sqrt(2b)) for any b < M/2, hence both return
        b = Theta(M) through the lemma; they are distinguished only by the
        VALUE of eps_max (n^{-1/2} versus n^{-1/2} times sqrt(M/n) up to logs),
        and reporting "b = Theta(M)" without eps_max would lose that.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the hypothesis "sigma has branching b" into the exact inequality
          "every fibre has |A + A| <= b|A|", then into the exact identity
          sum over xi of |Ahat|^4 = n*E(A). ENCODING: partition -> family of
          small-doubling sets -> fourth moment of a transform; exact at every
          step. COMPLETENESS: every branching projection yields such a family.
          SOUNDNESS: the converse fails and is not used. TRANSFER: to E(F_p) by
          the group isomorphism to Z/n, which is non-constructive but need only
          exist. COST LOSS: none.
        predicted_gain: >-
          Removes the rectification threshold entirely, which is the single
          reason IDEA-20260920-a5757d's window omega(1) <= b < sqrt(M) was
          open, and replaces "open window" with a numeric floor n^{4/11}.
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family from "b bounded by an absolute
          constant" to "b bounded by M/2", and prove a STRICT inward
          improvement: the admissible region shrinks from mu + beta/2 free to
          mu + beta/2 >= 1/2 - lambda.
        predicted_gain: >-
          A quantitative frontier rather than a feasibility statement; the
          boundary point (n^{1/11}, n^{5/11}) is a construction target for any
          successor, which "the window is open" was not.
      - transform: observable_fiber
        proposed_object: >-
          Hold (M, b) = (M, 1) fixed and vary the ambient group: Z/n with n
          prime, Z/(a*a'), F_2^{3m}. The distinguishing intrinsic invariant is
          the subgroup lattice. This is the nearby-object control and is why
          the closure is a statement about prime order.
        predicted_gain: "Shows the chain is not vacuous and must go silent on the two non-prime objects, which it does."
    quantifier_order: >-
      (A1): FOR ALL finite abelian H, FOR ALL M with 2 <= M <= |H|, FOR ALL
      equal-fibre partitions sigma of H into M fibres, FOR ALL b <= M/2: IF for
      all (i,j) the sumset A_i + A_j meets at most b fibres, THEN FOR ALL i
      THERE EXISTS a nontrivial character xi of H with |Ahat_i(xi)| >=
      |A_i|/sqrt(2b). The witness xi may depend on H, sigma, b and i; it is NOT
      required to be uniform in i -- that stronger statement is
      IDEA-20260920-a58be0 and is NOT claimed here.
      (A2)-(A3): FOR ALL prime n, FOR ALL sigma computed from coordinates with
      per-fibre F_p additive spectral norm at most n^lambda, FOR ALL (b, M)
      admissible: T >= n^{(4-2lambda)/11 - o(1)} under cost model M1. The o(1)
      absorbs the log powers of the character-sum bound and is NOT allowed to
      absorb the per-evaluation cost c, which is charged separately in (A4).
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "for prime n, under cost model M1 and conditional on H1, no
        coordinate-computable equal-fibre projection whose fibre indicators
        have F_p additive spectral norm n^lambda with lambda < 1/6 yields a
        four-list route below n^{(4-2lambda)/11}, and none at all yields
        n^{1/3}". IT CANNOT CERTIFY: that any (b, M) is achievable; that no
        projection with lambda >= 1/6 exists; that the ECDLP is hard; that
        RQ-ECDLP-160d89 is closed; anything about keys carrying auxiliary
        state or defined on tuples (that is IDEA-20260920-6f7416); anything about
        joins that are not rectangle-or-branch merges; or any statement whose
        cost model is not M1.
      nearby_object_control: >-
        Z/(a*a') with sigma = reduction mod a: b = 1, sigma lossy,
        coordinate-computable once the factorisation is known, eps = 1/a, and
        the desired conclusion FAILS -- there is no floor, because there is no
        Weil bound and Pohlig-Hellman already applies. A derivation that cannot
        distinguish Z/(a*a') from Z/n has not identified primality as the
        load-bearing structure. SECOND CONTROL: F_2^{3m} with the prefix key,
        where (A1) is TIGHT and correct and the chain must simply stop at (A2).
    proof_obligations:
      - claim: "branching b implies |A_i + A_i| <= b|A_i| for every i"
        responsibility: correctness
      - claim: "E(A) >= |A|^4/|A+A| by Cauchy-Schwarz on the representation function"
        responsibility: correctness
      - claim: "sum over xi of |Ahat(xi)|^4 = n E(A) and the resulting max bound |A|^2(1/b - 1/M)"
        responsibility: correctness
      - claim: "the b = 1 slice recovers KN-FIND-ffe1df Theorem C"
        responsibility: baseline
      - claim: "the composite and F_2^{3m} slices are reproduced with eps = 1 exactly and the chain goes silent at (A2)"
        responsibility: scope
      - claim: "eps_i <= ||vhat||_1 n^{-1/2+o(1)} in the MIXED form needed here (H1)"
        responsibility: feasibility
      - claim: "the constrained optimum of M1 is T = n^{(4-2lambda)/11} at beta = (1-6lambda)/11"
        responsibility: runtime
      - claim: "charging the per-evaluation cost c = Theta(d) makes total cost monotone increasing in d (A4)"
        responsibility: runtime
      - claim: "min over t of #{(i,j) : t in B(i,j)} <= bM, so M1's level-1 charge l^2 b/M is attained at the best target fibre"
        responsibility: runtime
    not_applicable_reason: null

  predictions:
    - metric: >-
        eps_i = max over nontrivial characters of <P> of the normalised
        DL-Fourier coefficient of a fibre indicator, for any coordinate-derived
        sigma with one-step additive branching b and image size M
      direction: higher
      minimum_effect: >-
        FORCED eps_i >= 1/(M sqrt(2b)) for EVERY fibre, at every prime n and
        every b <= M/2. Any exhibited (sigma, M, b) with a fibre whose eps_i is
        below 1/(M sqrt(2b)) refutes Lemma (A1) outright.
    - metric: "M * sqrt(b) for a coordinate-derived sigma with ||vhat||_1 = n^{o(1)}"
      direction: higher
      minimum_effect: >-
        FORCED M sqrt(b) >= n^{1/2 - o(1)}, computed in Z/n with the fibres
        taken as subsets of <P>. Since b < sqrt(M) is required to beat rho at
        all, this forces M >= n^{2/5 - o(1)} and hence T >= n^{7/20} even
        before the joint optimisation; the joint optimisation sharpens it to
        n^{4/11}.
    - metric: "eps for sigma = reduction mod a on Z/(a*a'), computed over the additive characters of Z/(a*a')"
      direction: different
      minimum_effect: "FORCED EXACTLY 1/a with b EXACTLY 1. A reading otherwise is an instrument or derivation bug and voids the record."
    - metric: "eps for the m-bit prefix key on F_2^{3m}, computed over the characters of F_2^{3m}"
      direction: different
      minimum_effect: "FORCED EXACTLY 2^{-m} with b EXACTLY 1; the chain must go silent at step (A2) and produce NO floor for this object."
    - metric: "b for the interval partition of Z/N into M equal parts, integer representatives in [0, N), N prime"
      direction: lower
      minimum_effect: "FORCED EXACTLY 2 when M divides N and AT MOST 3 otherwise. This is a different partition from the low-bits key of the same N and M and must be pinned separately."
    - metric: "b for Wagner's low-bits key a -> a mod 2^k on Z/N, integer representatives in [0, N), N prime"
      direction: lower
      minimum_effect: "FORCED EXACTLY 2, the branch set being {low(a)+low(b), low(a)+low(b)-N} reduced mod 2^k."
    - metric: "the lambda threshold above which the n^{1/3} corner is not excluded by the floor"
      direction: different
      minimum_effect: "EXACTLY 1/6. A derivation returning any other value has mis-solved the optimisation and every downstream number is void."

  minimal_test:
    design: >-
      PAPER-LEVEL DISCRIMINATOR, ZERO COMPUTE, INSIDE THE RQ CLAIM BOUNDARY. No
      curve generation, no run, no ECDLP result.
      STEP 1 (half an hour of algebra, and it is the whole discriminator).
      Write Lemma (A1) with explicit constants: the doubling step, the
      Cauchy-Schwarz energy step, the fourth-moment identity, and the max
      bound. Then evaluate it EXACTLY on the five forced fixtures of
      reproduction_check, by hand, in exact arithmetic, with the group and
      character codomain named in each line. Lemma (A1) is refuted on the spot
      if any fixture disagrees; it is confirmed as an identity if all five
      agree, and (A1) is then rigorous with no further work.
      STEP 2 (literature extraction, no compute). Obtain the exact statement of
      the mixed character-sum bound in the Lange-Shparlinski / Kohel-
      Shparlinski lineage: precisely which sums over <P> are bounded, at what
      size, and with what dependence on the degree or genus of the defining
      condition. Record verbatim. If only the PURE (untwisted) form exists,
      (A2) is downgraded to a heuristic with the pure form as its rigorous half
      and the record SAYS SO; the floor then becomes conditional on H1 alone
      and (A1) survives untouched.
      STEP 3 (symbolic optimisation, exact). Solve
      min max((1+mu)/4, beta + (1-mu)/2) s.t. mu + beta/2 >= 1/2 - lambda in
      exact rationals; pin beta* = (1-6lambda)/11, mu*, and
      T = n^{(4-2lambda)/11}; verify the two endpoints lambda = 0 -> 4/11 and
      lambda = 1/6 -> 1/3 by substitution.
      STEP 4 (table, exact). Tabulate lambda = log_n ||vhat||_1 for the corpus
      key panel and read off which families are excluded by lambda < 1/6.
      STEP 5 (archive check, zero compute). Record the exact sentences of
      IDEA-20260920-a5757d (C) and (E), IDEA-20260904-f68c7f (E), and
      IDEA-20260901-d77aa8 (E2) that this record composes, and the sentence of
      RQ-ECDLP-160d89's decision_target it answers. No status change to any of
      them is proposed.
      EXPLICITLY REQUIRING A SCOPE EXTENSION AND NOT PROPOSED HERE: any
      measurement of b or eps on a curve. d77aa8 STAGE 4 notes that eps is
      computable exactly at toy scale by one FFT over the log coordinate; that
      is compute and the Coordinator would have to grant it.
    controls:
      - "IDENTITY AND CONSTANT EDGE, answer known free: identity on Z/n gives (M, b, eps) = (n, 1, 1/n); constant gives M = 1 and the lemma must report itself INAPPLICABLE rather than satisfied."
      - "COMPOSITE-ORDER POSITIVE CONTROL: Z/(a*a') with sigma = reduction mod a, forced (b, eps) = (1, 1/a) over the additive characters of Z/(a*a'). The one branching object that provably exists; a derivation that cannot exhibit it has no power to bound anything."
      - "XOR POSITIVE CONTROL / PROVES-TOO-MUCH GATE: F_2^{3m} prefix key, forced (b, eps) = (1, 2^{-m}). (A1) must hold and be tight; (A2) must be SILENT. A derivation that produces a floor for F_2^{3m} is void."
      - "RANDOM-PARTITION NULL (symbolic): for a uniformly random balanced partition of Z/n, eps = O(sqrt(M log n / n)), which is below 1/(M sqrt(2b)) for every b < M/2, so the lemma forces b = Theta(M). The model degrades correctly to the information-free case, matching IDEA-20260920-a5757d's own b = M sanity check."
      - "PLANTED DL-INTERVAL POSITIVE: interval partition of Z/n, forced b <= 3 and eps -> 1. Detection is a gate, not a result."
      - "MANDATORY PARETO ROWS: Pollard rho at 0.886 sqrt(n) time and O(1) memory, and BSGS at (n^{1/2}, n^{1/2}), reported alongside n^{4/11} at memory n^{5/11}... (the floor point's memory is n^{4/11}, equal to its time, and is strictly worse than rho on memory at every operating point)."
      - "SAME-ADVICE CONTROL (IDEA-20260901-a31b94): the floor must be compared against rho with the SAME preprocessing budget, namely P = 0, since no advice is used anywhere in this record."
    required_metrics:
      - "Lemma (A1) with explicit constants and its exact value on each of the five forced fixtures"
      - "the verbatim extracted mixed character-sum statement, with its size and its degree/genus dependence, or an explicit record that only the pure form was found"
      - "the exact rational solution (beta*, mu*, T) of the constrained optimisation, with both endpoints verified by substitution"
      - "the lambda table for the corpus key panel with the source of each entry and its provenance"
      - "PASS/FAIL of each control, with the two silence gates (Z/(a*a'), F_2^{3m}) reported as silence and not as absence of signal"
      - "an explicit statement of which of IDEA-20260920-a5757d's four named escapes this record does and does not cover"

  falsification_conditions:
    - >-
      Any of the five forced fixtures disagrees with Lemma (A1). The lemma is
      wrong, the floor is void, and the record reduces to nothing.
    - >-
      The derivation, as written, produces a nonvacuous floor for F_2^{3m} with
      the prefix key, or for Z/(a*a') with reduction mod a. It proves too much
      and is void until repaired.
    - >-
      Step 2 finds that no mixed-form character-sum bound exists in the
      literature, only pure sums over subgroups. (A2) is downgraded to a
      heuristic; the floor becomes conditional on H1 and must be reported at
      that reduced strength. (A1) survives unchanged and is still a strictly
      larger statement than anything committed.
    - >-
      A coordinate-computable sigma on a prime-order subgroup is exhibited with
      ||vhat||_1 = n^{o(1)} and M sqrt(b) < n^{1/2 - delta} for some delta > 0.
      Then either the extracted bound is false for that condition or (A1) is
      wrong; either way the floor collapses and the finding routes to
      review-breakthrough.
    - >-
      Cost model M1 is shown to be wrong -- for instance if
      min over t of #{(i,j) : t in B(i,j)} can exceed bM, making the level-1
      charge l^2 rather than l^2 b/M. Then the exponent (4-2lambda)/11 is wrong
      and the whole quantitative frame must be restated; Lemma (A1) survives.
    - >-
      A projection with lambda >= 1/6, branching b < sqrt(M) at M = n^{1/3},
      and an O(1)-computable branch rule is exhibited. THE FLOOR IS SILENT
      THERE BY CONSTRUCTION -- this is not a falsification of the record, it is
      the record's own forward guidance and the subject of IDEA-20260920-dd041a;
      it would route to review-breakthrough at max effort.

  confounders:
    - >-
      NORMALISATION. eps is the coefficient DIVIDED BY n, tau is the raw
      coefficient, and the two differ by a factor n. IDEA-20260901-d77aa8 uses
      tau, IDEA-20260904-f68c7f uses eps. Every inequality in this record is in
      eps and every comparison to d77aa8 must be renormalised. Getting this
      wrong turns the guaranteed bias n^{-1/2} into 1 and manufactures a
      spurious sub-rho learner route.
    - >-
      WHICH FOURIER TRANSFORM. lambda is the F_p ADDITIVE spectral norm of the
      fibre-defining condition as a function on F_p; eps is a coefficient of
      the fibre indicator as a function on <P> along the DL characters. These
      are transforms over different groups and the whole composition (A2) is
      the bridge between them. Conflating them is the single most likely error.
    - >-
      MAX VERSUS TYPICAL BRANCHING. b is a MAXIMUM over fibre pairs and is what
      M1 charges; the mean is much smaller. The lemma uses only the diagonal
      pairs (i,i), so it is driven by the WORST self-sumset, which is the right
      quantity for M1 but not the same as the mean.
    - >-
      SIGN CLOSURE. x(-R) = x(R) makes every x-derived fibre symmetric, so
      A_i = -A_i and Ahat_i is real. This does not change any bound but it does
      force 0 into every A_i + A_i, so the fibre containing 0 is met by every
      diagonal sumset and b >= 2 is automatic for symmetric partitions.
    - >-
      INDEXABILITY. A sigma whose branch set is small but not O(1)-computable
      must be charged an enumerated table of size M^2 b, which is
      Bernstein-Lange precomputation and must appear as P. The lemma is blind
      to indexability; the cost model is not.
    - >-
      p VERSUS n. Fibre sizes are counted in the GROUP; the character-sum
      bounds are in p^{1/2}. With a cofactor h these differ and every exponent
      translated from field-side counting must be flagged.

  interpretation_limits:
    - >-
      Zero runs, no implementation, no curve generation, no ECDLP result.
      claim_tier is derivation per docs/claims-and-verification.md; (A1) is
      proved, (A2)-(A3) are conditional on H1.
    - >-
      NO ATTACK EXPONENT IS CLAIMED AND NO ALGORITHM IS PROPOSED. The floor is
      a necessary condition on a family, not a lower bound on the ECDLP and not
      an achievability statement.
    - >-
      NO FACTOR BASE IS INTRODUCED, so KN-OPEN-020's three open classes are not
      engaged. A successor that turns the fibre structure into a relation
      mechanism owes the full declaration and charge.
    - >-
      The floor covers EQUAL-FIBRE, PREDECLARED, SINGLE-ELEMENT projections
      under cost model M1. Unequal fibres, tuples, auxiliary state and
      non-partitions are IDEA-20260920-6f7416; lambda >= 1/6 is
      IDEA-20260920-dd041a; target-dependent keys are IDEA-20260829-7169d6.
    - >-
      Even a fully populated boundary point leaves P-256 standing: n^{4/11} at
      n = 2^256 is 2^93, and n^{1/3} is 2^85. Any deliverable is a
      security-margin statement, never a break.

  heuristic_assumptions:
    - id: H1
      statement: >-
        MIXED CHARACTER-SUM BOUND AT THE WEIL LEVEL. For every prime p, every
        elliptic curve E/F_p with a prime-order subgroup G = <P> of order n,
        every nontrivial additive character psi_xi of F_p, and every nontrivial
        character e_n(a * log_P(.)) of G,
          | sum over R in G of psi_xi(x(R)) e_n(-a log_P R) | <= C n^{1/2}
          (log n)^{C'}
        with C, C' absolute. Consequently, for any v on F_p with additive
        spectral norm ||vhat||_1, the induced function on G has
        eps(v) <= ||vhat||_1 n^{-1/2+o(1)}.
      rigorous_support: >-
        NOT A DISTRIBUTIONAL HEURISTIC. It is the elliptic analogue of Weil's
        square-root cancellation for character sums along a curve twisted by a
        group character, and it is the bound IDEA-20260904-f68c7f (E) already
        relies on, attributed there to the Kohel-Shparlinski and
        Lange-Winterhof lineage and labelled RECALLED in that record too. The
        classical statement it imitates is Polya-Vinogradov / Burgess for
        intervals in F_p. IT IS LISTED AS A HEURISTIC HERE BECAUSE THE EXACT
        MIXED FORM HAS NOT BEEN EXTRACTED BY THIS SESSION: the WebSearch of
        2026-09-20 confirmed the Lange-Shparlinski paper's existence, journal
        and pagination, and the Ahmadi-Shparlinski bilinear paper's existence;
        the Shparlinski open-problems PDF was fetched and returned unparseable
        binary. No body was read. THIS IS THE RECORD'S SINGLE BLOCKING
        EXTRACTION and (A3) is vacuous without it.
      validation_plan: >-
        EXTRACTION, NOT SAMPLING, AND IT IS STEP 2 OF minimal_test. Obtain
        Lange-Shparlinski (Canad. J. Math. 57(2) 2005, 338-350) and
        Kohel-Shparlinski (ANTS-IV 2000) and record VERBATIM: (i) whether the
        mixed form above appears or only pure sums over a subgroup; (ii) the
        exact constant and log power; (iii) the dependence on the degree or
        genus of the defining condition, which is what IDEA-20260920-dd041a
        consumes. COMPARISON: the predicted size n^{1/2+o(1)} against the
        trivial bound n and against the random-set level sqrt(n|A|). TAIL
        CHECK: the statement's behaviour as the multiplicative order or degree
        grows, since that is where (A4) and D's escape live. TRANSFER
        ASSUMPTION, STATED: none is needed, because the bound is asymptotic and
        uniform in the cited form; if the extracted form carries a restriction
        on |G| relative to p, that restriction transfers verbatim to the floor
        and must be carried. SAMPLING ROUTE IF EXTRACTION FAILS, FLAGGED AS
        REQUIRING A SCOPE EXTENSION THE COORDINATOR WOULD HAVE TO GRANT: exact
        FFT of the fibre indicators over the log coordinate at 24 to 34 bits,
        at least 8 curves per size, comparing max |Ahat| against n^{1/2} log n
        and against the random null sqrt(n|A|). NOT PROPOSED HERE.
    - id: H2
      statement: >-
        COST-MODEL FIDELITY. Under cost model M1, the level-1 candidate scan
        costs Theta(l^2 b / M) group operations at the best choice of target
        fibre t, i.e. the b compatible source-fibre pairs for that t are
        enumerable in O(1) each with no enumerated table.
      rigorous_support: >-
        THE COUNTING HALF IS RIGOROUS AND IS SUPPLIED HERE. Writing B(i,j) for
        the branch index set, sum over t of #{(i,j) : t in B(i,j)} =
        sum over (i,j) of |B(i,j)| <= b M^2, so
        min over t of #{(i,j) : t in B(i,j)} <= b M, and since the algorithm
        CHOOSES t the charge l^2 b/M is attained at the best t. This closes the
        "runtime" obligation IDEA-20260920-a5757d left open and is the reason
        M1 is the max-over-pairs quantity rather than a per-target one. THE
        INDEXABILITY HALF IS HEURISTIC: exact for Wagner's low-bits rule on
        Z/N, where the branch set is {t, t - N mod 2^k} computed in O(1) with
        no table; unproved for a general coordinate sigma, where the table may
        be as large as M^2 b and ITS CONSTRUCTION IS BERNSTEIN-LANGE
        PRECOMPUTATION and must be charged as P.
      validation_plan: >-
        SYMBOLIC, zero compute. For each key in the panel of minimal_test step
        4, attempt to WRITE DOWN a closed-form branch rule and record whether
        one exists; where it does not, compute the table size M^2 b required
        and place it in a separate P column of the cost table, never folded
        into T. COMPARISON: the low-bits rule on Z/N as the forced-PASS case
        and a random balanced partition as the forced-FAIL case with table size
        exactly M^2 b. TAIL CHECK: any key that would pass the floor must be
        re-audited for a hidden table BEFORE a single exponent is quoted.
        TRANSFER ASSUMPTION: none; this is a per-key symbolic check.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. The exponent this record PRODUCES is a
      FLOOR on a family: under cost model M1 and conditional on H1, any
      coordinate-computable equal-fibre projection with F_p additive spectral
      norm n^lambda, lambda <= 1/6, gives
        T >= n^{(4 - 2 lambda)/11 - o(1)},
      attained only at b = n^{(1-6lambda)/11} and M = n^{(1/2-lambda) -
      (1-6lambda)/22}. At lambda = 0 this is n^{4/11} = n^{0.36363...} at
      (b, M) = (n^{1/11}, n^{5/11}). The n^{1/3} corner requires
      lambda >= 1/6. Prior to this record the family's floor was n^{1/3} by
      IDEA-20260920-a5757d's own arithmetic at b = O(1), i.e. this record moves
      the floor up by 4/11 - 1/3 = 1/33 in the exponent.
    memory_exponent: >-
      Memory equals time throughout M1, so the floor point sits at
      (T, S) = (n^{4/11}, n^{4/11}) with P = 0. This is the claw-finding
      signature: strictly WORSE than Pollard rho on the memory axis at every
      operating point, and the family is therefore incomparable to rho rather
      than dominating it even in its best case.
    best_known: >-
      Pollard rho, 0.886 sqrt(n) group operations at O(1) memory; with negation
      and automorphisms sqrt(n/|Aut|). BSGS at (n^{1/2}, n^{1/2}). van
      Oorschot-Wiener parallel rho, total work n^{1/2}. Shoup's generic bound
      T = Omega(sqrt n), which any such sigma would violate, confirming it must
      be non-generic. Preprocessing frontier S T^2 = Omegatilde(n)
      (KN-LIT-013) and the P T = n family (KN-LIT-5230), not applicable here
      because P = 0. Prime-field index calculus: no known advantage
      (KN-OPEN-001). THIS RECORD OCCUPIES NO POINT ON ANY OF THESE AXES.
    hidden_overhead: >-
      Four disclosures. (i) The o(1) absorbs the log powers of H1's bound and
      nothing else; it does NOT absorb the per-evaluation cost c of sigma,
      which multiplies T and is charged separately in (A4) -- a sigma costing
      n^{eps} eats the entire window. (ii) The floor is conditional on H1,
      which is RECALLED and unextracted; without it (A3) is vacuous and only
      (A1) survives. (iii) The floor is a necessary condition, so the true
      achievable exponent may be anywhere in [4/11, 1/2] or the family may be
      empty. (iv) M1's indexability assumption (H2) can hide an M^2 b table
      that is precomputation.
    tradeoff_note: >-
      The floor point (S, T) = (n^{4/11}, n^{4/11}) with P = 0 gives
      S T^2 = n^{12/11} > n, so it sits ABOVE the Corrigan-Gibbs-Kogan
      preprocessing curve -- which does not apply anyway, since there is no
      advice. The applicable generic bound is Shoup's T = Omega(sqrt n), which
      the point violates; that is consistent precisely because key evaluation
      on coordinates is non-generic. van Oorschot-Wiener interpolates between
      the point and rho at reduced memory w. Parallelisation: list build and
      level-1 scan are embarrassingly parallel; the level-2 birthday is the
      standard distinguished-point communication bottleneck.

  dominated_by: >-
    AS AN ATTACK: none is mounted, so every frontier row dominates. Rows
    checked one by one for prime-field ECDLP, single target, classical, no
    advice. (1) Pollard rho, 0.886 sqrt(n) time, O(1) memory -- dominates this
    record on both axes trivially, and would dominate the floor POINT on memory
    even if that point were occupied. (2) BSGS (n^{1/2}, n^{1/2}) -- dominates
    this record; the floor point would dominate BSGS on both axes if occupied.
    (3) van Oorschot-Wiener parallel rho, total work n^{1/2} -- dominates; the
    floor point would beat it on total work at n^{4/11}. (4) Automorphism- and
    negation-discounted rho sqrt(n/|Aut|) -- dominates. (5) Pohlig-Hellman --
    NOT APPLICABLE, n prime. (6) MOV / Frey-Ruck -- NOT APPLICABLE, large
    embedding degree. (7) SSSA anomalous lift -- NOT APPLICABLE, n != p.
    (8) GHS / Weil descent / Gaudry -- NOT APPLICABLE over a prime field.
    (9) Semaev summation polynomials over F_p -- no proven advantage
    (KN-OPEN-001), not a dominating row. (10) Preprocessing S T^2 = n
    (KN-LIT-013) and P T = n (KN-LIT-5230) -- NOT APPLICABLE, P = 0 throughout;
    the correct comparison is the same-advice control of IDEA-20260901-a31b94.
    (11) Kuhn-Struik multi-target sqrt(un) -- NOT APPLICABLE, single instance.
    (12) Shor -- out of scope. VERDICT: NOT NULL. Every applicable row
    dominates this record on every axis, because it claims no attack. AS A
    STATIC CONTRIBUTION the nearest incumbents are IDEA-20260920-a5757d (which
    dominates on introducing b and M1, and is dominated here on the window it
    leaves open), IDEA-20260829-390ccc (dominates on structural strength inside
    the rectification window, dominated here on parameter range), and
    IDEA-20260904-f68c7f (dominates on supplying the upper bound, dominated
    here on having no lower bound to meet it).
  sota_delta:
    time: >-
      '0 realized. Static delta: the family floor moves from n^{1/3} (the value
      IDEA-20260920-a5757d''s M1 gives at b = O(1), with nothing forbidding it)
      to n^{4/11} for every key with lambda < 1/6, i.e. +1/33 in the exponent,
      and the admissible region collapses from the two-dimensional strip
      omega(1) <= b < sqrt(M) to the one-dimensional curve
      mu + beta/2 = 1/2 - lambda with a single optimal point.'
    memory: >-
      '0 realized. The floor point carries memory n^{4/11}, disclosed as equal
      to time and strictly worse than rho on that axis at every operating
      point; no memory improvement is claimed or implied anywhere.'
    data_queries: >-
      '0. No ECDLP solve, no relation, no certificate, no oracle query, no
      advice. P = 0 is charged explicitly rather than assumed.'

  estimated_cost:
