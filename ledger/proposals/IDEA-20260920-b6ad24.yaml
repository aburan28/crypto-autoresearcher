  proposed_at: '2026-09-20'
  question_id: RQ-ECDLP-160d89
  goal_id: null
  added: '2026-09-20'
  status: proposed
  proposed_by: idea-generator
  proposed_at: '2026-09-20'
  title: >-
    THE SPECTRAL FLOOR OF THE BRANCHING WINDOW. One-step additive branching b
    forces every fibre to have DOUBLING at most b, hence additive energy at
    least |A|^3/b, hence -- by Parseval alone, with NO density threshold and NO
    rectification -- a nontrivial DL-Fourier coefficient of relative size at
    least 1/sqrt(2b). Composed with IDEA-20260904-f68c7f's Weil-level UPPER
    bound eps <= ||vhat||_1 * n^{-1/2+o(1)} for any coordinate statistic, this
    gives the constraint M*sqrt(b) >= n^{1/2-o(1)}/||vhat||_1, and optimising
    IDEA-20260920-a5757d's cost model M1 under it yields a hard floor
    T >= n^{(4-2*lambda)/11} for a key of F_p spectral norm n^lambda -- at
    lambda = 0 that is T >= n^{4/11} = n^{0.3636...}, attained only at the
    single point (b, M) = (n^{1/11}, n^{5/11}); the n^{1/3} corner therefore
    requires lambda >= 1/6, which is the first condition on a coordinate
    projection this lane has stated as a NUMBER
  class: mechanism

  claim: >-
    REPRESENTATION CLASS AND ATTACK STAGE (one clause, per
    docs/object-frame-ideation.md section 4): the representation is class R1 of
    RQ-ECDLP-623a32 (the affine coordinate x(R) in F_p together with O(1)
    F_p-arithmetic postprocessing, plus the y-sign bit), and the attack stage
    whose charged cost it claims to bound is COLLISION STRUCTURE (the cost of a
    level-1 four-list merge on a partial key), not factor-base membership and
    not linear algebra.

    (A1) THE LEMMA, RIGOROUS AND THRESHOLD-FREE. Let H be a finite abelian
    group of order n, sigma a map from H onto an index set of size M with
    fibres A_1..A_M all of size |A| = n/M, and suppose sigma has ONE-STEP
    ADDITIVE BRANCHING b in the sense of IDEA-20260920-a5757d, i.e. A_i + A_j
    meets at most b fibres for every (i,j). Then taking i = j gives
    |A_i + A_i| <= b|A_i| (doubling at most b), whence by Cauchy-Schwarz the
    additive energy satisfies E(A_i) >= |A_i|^4/|A_i + A_i| >= |A_i|^3/b, and
    by the fourth-moment Parseval identity sum over all characters xi of
    |Ahat_i(xi)|^4 = n*E(A_i) together with sum over xi != 0 of |Ahat_i(xi)|^2
    = n|A_i| - |A_i|^2,
        max over xi != 0 of |Ahat_i(xi)|^2 >= |A_i|^2 * (1/b - 1/M),
    so for b <= M/2, max over xi != 0 of |Ahat_i(xi)| >= |A_i|/sqrt(2b).
    In the NORMALISED observable of IDEA-20260904-f68c7f -- eps_i = max over
    xi != 0 of |(1/n) sum_{g in H} 1_{A_i}(g) e_n(-xi log g)| , i.e. the
    DL-Fourier coefficient of the fibre indicator, computed in the character
    group of H and NOT in F_p^* -- this reads
        eps_i >= 1 / (M * sqrt(2b))   for every fibre i.
    NOTHING is assumed about density, about b being constant, or about
    rectification. This is the step Freiman/Green-Ruzsa cannot supply and is
    the exact gap IDEA-20260920-a5757d (E) names.

    (A2) THE COMPOSITION. Let sigma be computed from coordinates, so each fibre
    indicator is v(x(R)) for a function v on F_p, and write ||vhat||_1 =
    n^lambda for its F_p-ADDITIVE spectral norm (the L1 norm of its Fourier
    transform over the additive characters of F_p -- codomain named, this is
    NOT the multiplicative-character L1 norm). IDEA-20260904-f68c7f (E) gives,
    on the recalled Kohel-Shparlinski / Lange-Winterhof / Lange-Shparlinski
    lineage, eps_i <= ||vhat||_1 * n^{-1/2+o(1)}. Combining with (A1):
        M * sqrt(2b) >= n^{1/2 - o(1)} / n^lambda.
    A LOWER bound on the bias, supplied here, meets an UPPER bound on the bias,
    already on file. Neither record has the other half.

    (A3) THE FLOOR. Write M = n^mu, b = n^beta, and take cost model M1 of
    IDEA-20260920-a5757d verbatim: T = max( (nM)^{1/4}, b*(n/M)^{1/2} ), memory
    equal to T. Minimising max( (1+mu)/4, beta + (1-mu)/2 ) subject to
    mu + beta/2 >= 1/2 - lambda gives, for lambda <= 1/6,
        beta* = (1 - 6*lambda)/11,  mu* = (1/2 - lambda) - (1 - 6*lambda)/22,
        T >= n^{(4 - 2*lambda)/11 - o(1)}.
    At lambda = 0: T >= n^{4/11} = n^{0.36363...} at the UNIQUE point
    (b, M) = (n^{1/11}, n^{5/11}). For lambda >= 1/6 the constraint is inactive
    and M1's unconstrained optimum n^{1/3} at b = O(1) is restored. Hence
        THE n^{1/3} CORNER REQUIRES ||vhat||_1 >= n^{1/6 - o(1)}.
    This narrows the open window of IDEA-20260920-a5757d (E) from
    [n^{1/3}, n^{1/2}) to [n^{4/11}, n^{1/2}) for every key of polylogarithmic
    spectral norm, and replaces "omega(1) <= b < sqrt(M)" by a two-parameter
    admissible region with a named boundary point.

    (A4) THE DEGREE COROLLARY, WHICH CLOSES THE OBVIOUS ESCAPE. If the fibre
    condition is algebraic on x of degree d then ||vhat||_1 = O(d log p) and
    the per-evaluation cost is c = Theta(d) field operations, which multiplies
    T. Substituting lambda = log_n d and multiplying: total cost
    = max( n^{3/8} d^{3/4} b^{-1/8}, n^{1/4} d^{3/2} b^{5/4} ), strictly
    increasing in d. So raising the DEGREE of the condition never buys the
    spectral norm: any escape must DECOUPLE spectral norm from evaluation cost,
    which is the hand-off to IDEA-20260920-dd041a.

    (A5) NOT CLAIMED. No algorithm, no achievability, no ECDLP result. (A3) is
    a NECESSARY condition; it does not assert that (n^{1/11}, n^{5/11}) is
    occupied, and the floor is not a lower bound on the ECDLP.

  mechanism: >-
    OBJECT FRAME. REPRESENTATION: R1, the affine x-coordinate in F_p plus O(1)
    F_p-arithmetic postprocessing and the y-sign bit. Neither the Kummer line
    nor a degree-d function on E is used as the model, so the model-lever-1
    closure of RQ-ECDLP-623a32 is untouched; (A4) prices the degree-d variant
    and rejects it on cost, which is a charge, not a model change.
    OPERATION SET SIGMA: pair addition on <P>, used at depth EXACTLY 2 (two
    merge levels), as in IDEA-20260920-a5757d. Sigma contains the full
    translation action, therefore per the constraint block THIS IS A BRANCHING
    OBJECT and is declared as such.
    TRICHOTOMY (IDEA-20260806-c5d183): CLASS II, BRANCHING. Reason: the
    propagation rule is set-valued of size b > 1; the b = 1 cell is empty by
    KN-FIND-ffe1df Theorem C and is not disputed.
    LOSSY-PROJECTION TEST AGAINST SIGMA. DISCARDED: log(n/M) bits, everything
    about R except its fibre. COMPATIBLE WITH SIGMA: only up to the stated
    branching bound b, which is the only compatibility available on a
    prime-order group. LOSSY IN THE REPRESENTATION USED: yes -- x(R) does not
    determine R (y-sign lost) and sigma(R) does not determine x(R) for M < p.
    Not a change of coordinates.
    PRICED OPEN NUMBER: the (L, b) pair of IDEA-20260802-002, with L =
    log_2(n/M) bits discarded. This record's content is that (L, b) is not free
    -- it is pinned to a THIRD number, the F_p spectral norm lambda, by an
    inequality that holds for every coordinate-computable sigma.

    WHAT IS NEW AGAINST THE TWO NEAREST RECORDS, EXPLICITLY.
    Against IDEA-20260829-390ccc: 390ccc's hypothesis is SOUNDNESS of a
    predeclared fibre system against an accepted set D (a rectangle-cover
    condition), and its tool is Cauchy-Davenport plus Vosper plus
    Freiman/Green-Ruzsa, which requires small doubling AND a density threshold
    and therefore dies at b = n^eps. This record's hypothesis is BRANCHING (a
    partition-closure condition, no accepted set, no soundness), and its tool
    is one Cauchy-Schwarz and one Parseval, which have no threshold at all and
    survive to b = M/2. The two are not the same theorem in two vocabularies:
    390ccc concludes AP CONTAINMENT for all fibres inside its window, this
    record concludes a FOURIER LOWER BOUND for every fibre at every b. Neither
    implies the other; the relationship is settled in IDEA-20260920-a58be0.
    Against IDEA-20260901-d77aa8: d77aa8 derives a tau_max threshold from the
    CONCENTRATION of emitted sums (the Renyi-2 exponent s) of a key-MATCHING
    leaf join, by Parseval over the whole fibre system. This record derives a
    tau_max threshold from BRANCHING, per single fibre, by the fourth-moment
    identity -- a different hypothesis, a different inequality, and a
    per-fibre rather than a system-wide conclusion. d77aa8 predates the
    branching notion entirely (it is introduced by IDEA-20260920-a5757d,
    2026-09-20) and contains no b. What is added is the composition of the two
    sides into a numeric floor, which neither record can state alone.
    OFF-LIMITS COMPONENTS USED, NAMED: F1 (walk-collision) appears only as the
    level-2 birthday step inside cost model M1, which is imported, not
    proposed. F7 (preprocessing table) appears only as the charge levied in
    heuristic H2 on a non-O(1) branch rule. No factor base appears.

