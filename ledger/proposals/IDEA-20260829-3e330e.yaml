    derivation, and it establishes nothing about who first stated the BN
    parametrisation or whether the u-recovery framing is novel. Per
    agents/idea-generator.md a proposal whose external literature is
    substantially recalled is `unverified`. NO NOVELTY IS CLAIMED FOR ANY
    MATHEMATICS HERE.
