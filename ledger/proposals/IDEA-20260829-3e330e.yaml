  assumptions:
    - >-
      The executor session has a shell and Python 3 with arbitrary-precision
      integers. This is the assumption the archived batch could NOT make - its
      producer had no shell and performed no arithmetic - and it is the declared
      blocker of all twenty goals. The handoff must state it in its inputs.
    - >-
      No Sage, no PARI and no SEA point-counting backend is required, and NO
      NETWORK EGRESS is required: every source this record uses is already in the
      repository under inputs/SAFECURVES-20260825/.
    - >-
      MIRROR READING DISCIPLINE IS BINDING. Per defect MIRROR-DEF-1 the
      pages/*.txt renderings collapse empty table cells and may attach a comment
      to the wrong row. Values are taken from tables/*.tsv for screening and
      RE-READ from pages/*.html before any claim is filed on them; no value is
      ever taken from a .txt rendering. The executor records, per value, which
      tier of the authority order it came from.
    - >-
      The intake modulus and equation are used exactly as recorded in
      RQ-SCURVE-965391 and are NOT re-typed from memory. Their agreement with the
      mirror's index table is a consistency check, not a discharge of the goal's
      first completion criterion, which asks for primary or authoritative sources
      - the mirror is SafeCurves, and SafeCurves is itself a secondary compilation
      for most rows.
    - >-
      No live keys. Every toy instance is generated in-session by drawing k
      uniformly, forming Q equal to k times P, and discarding k before the solver
      runs, exactly as the scope block requires.
    - >-
      Scope is prime fields and odd characteristic. The F_p^12 arithmetic of
      Stage 3b, if attempted, is built as an explicit tower and is in scope only
      at toy size; no F_p^12 arithmetic is attempted at 254 bits.

  proof_search_map:
    bottleneck: >-
      Converting the BN row's published quantities into re-verified ones. The
      order, trace, cofactor and embedding degree are all STATED in the
      in-repository mirror; NONE of them is accompanied by a witness this program
      can re-check, no record in ledger/ or knowledge/ carries any of them, and
      the goal's own next_action records that every stated numeric relation in
      the dossier is a transcription plus a pending check. The bottleneck is
      therefore verification capability, not access: removing it changes no cost
      and no theorem, but it changes whether any downstream lane may cite these
      integers as evidence rather than as intake.
    baseline_embedding:
      parameter_slice: >-
        Restricted to a curve whose n IS supplied externally - which, for this
        row, the mirror now does - this record reduces exactly to
        IDEA-20260807-98a970's Step 2 and Step 3, the three degenerate checks and
        the order of p modulo n. The instrument must reproduce 98a970's
        LOWER-BOUND behaviour bit-for-bit on a curve with large k, and must
        reproduce its degenerate flags, or it has not embedded the internal
        baseline it claims to specialize.
      reproduction_check: >-
        A frozen fixture with three rows - 98a970's toy BN-shaped k equal to 12
        planted positive, its toy supersingular t equal to 0 curve which must
        return k equal to 2, and its toy p congruent to 1 modulo N curve which
        must return k equal to 1 and be flagged AFFECTED. All three must pass by
        exact integer comparison BEFORE the 254-bit row is processed. Note that
        98a970 declared these blocking and, per the grep above, they have never
        been run. A SECOND FIXTURE IS NOW AVAILABLE AND IS ADDED - the mirror's
        rho column, which the instrument must reproduce from l under a stated
        cost model, per prediction 9.
    observation_collision:
      observable: >-
        The certified tuple (u, t, n, cofactor, k) together with the toy-scale
        discrete_log certificate, and its agreement with the mirror's published
        cells.
      distinct_preimage_search: >-
        REQUIRED, AND THERE ARE FOUR ANSWERS, THREE BENIGN AND ONE MALIGN.
        BENIGN 1 - the SIX SEXTIC TWISTS of a BN curve over the same p all share
        the same u, so u does NOT identify the curve. Exhibitable at toy size by
        constructing y^2 = x^3 + b for six b in distinct sextic classes.
        CONSEQUENCE - the order certificate is valid only because C2 verifies
        [n]G equal to the identity ON THE INTAKE CURVE; the derivation from u
        alone would be unsound.
        BENIGN 2 - k equal to 12 does not identify a curve either; every curve in
        the family shares it.
        BENIGN 3, AND IT IS THE ONE THE MIRROR INTRODUCES - agreement between
        Route A and Route B does NOT identify a correct value, only a consistent
        pair. If the mirror's trace and this program's recalled parametrisation
        both descend from the same upstream source, agreement is weaker evidence
        than it looks. The mitigation is that Route A's premise is checked
        against the CURVE by [n]G, which is an arithmetic fact no upstream
        document can corrupt, and the record must state that the [n]G check, not
        the agreement, is what carries the claim.
        MALIGN, AND PREDICTED ABSENT - a curve with k certified as 12 by the
        six-exponentiation route for which ord_n(p) is not actually 12. Excluded
        by construction, since the six checks over the divisor lattice of 12 are
        exhaustive for any k dividing 12; but the certificate is UNSOUND if n does
        not divide p^12 - 1 at all, and the first check is exactly that.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the question "what is the order of this 254-bit curve", which
          as posed requires SEA or a table read, by the question "what integer u
          satisfies a quartic", which is one integer fourth root and a windowed
          scan and which reads no table at all.
        predicted_gain: >-
          A SECOND, INDEPENDENT ROUTE to the order, trace, cofactor and CM
          discriminant, in milliseconds, whose only shared input with the mirror
          is p. Encoding is the quartic; completeness is that every BN curve has
          such a u by definition; soundness is delivered NOT by the derivation
          but by the [n]G check plus Hasse uniqueness, which is the honest
          division of labour and is why C2 does not rest on the recalled
          parametrisation OR on the mirror.
      - transform: boundary_lift
        proposed_object: >-
          Enlarge IDEA-20260807-98a970's certificate family from two forms
          (exact-via-factorisation, bound-via-K-multiplications) to three by
          adding exact-via-divisor-lattice, available whenever a candidate k is
          known a priori from a construction or from a published table.
        predicted_gain: >-
          A STRICT inward improvement, not merely feasibility - the exact
          embedding degree of BN(2,254) at a verification cost of six modular
          exponentiations, against 98a970's alternatives of factoring a 254-bit
          n - 1 or a non-succinct 10^6-multiplication bound that would in any case
          only prove a LOWER bound and would therefore be the wrong statement for
          a small-k curve. It also converts the mirror's asserted 12 into a
          re-verifiable 12, which is the specific move the goal's completion
          criteria ask for.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable "k equals 12" fixed and vary the forgotten
          structure - the sextic twist class, the size of u, the sign of u -
          across the toy ladder, to confirm the certificate depends on the family
          and not on an accident of the particular parameters.
        predicted_gain: >-
          Distinguishes "the instrument measures the embedding degree" from "the
          instrument returns 12 whenever it is handed a curve we told it is BN",
          which a single row cannot separate and which is the most likely silent
          defect here - and which is now MORE pressing, not less, because a
          published 12 sitting in the repository is an invitation to confirmation
          bias.
    quantifier_order: >-
      C1 and C2 are claimed PER INSTANCE, EXISTENTIALLY. FOR THIS modulus THERE
      EXISTS an integer u with p equal to the quartic, and FOR THIS curve and
      that u THERE EXISTS n with [n]G equal to the identity, n prime and n
      greater than 4 sqrt(p), whence #E equals n. C3 is claimed UNIVERSALLY OVER
      A FINITE SET - FOR ALL d in the five proper divisors of 12, n does not
      divide p^d - 1, AND n divides p^12 - 1; the universal quantifier ranges
      over five elements and is discharged by exhaustion, which is why the
      certificate is exact rather than a bound. NOT CLAIMED - FOR ALL BN curves
      the recovery succeeds, which is untested outside the constructed ladder.
      NOT CLAIMED - anything at all about curves outside the family beyond the
      recorded refusal of this instrument on them. NOT CLAIMED - that agreement
      with the mirror establishes either value; agreement is a consistency
      statement over two routes, and its quantifier is over the values compared,
      not over correctness.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For the stated 254-bit modulus and curve, #E equals n exactly with
        cofactor 1, the trace is t, the CM discriminant of the Frobenius order is
        t^2 - 4p, and ord_n(p) equals 12 exactly - each certified by an attached
        witness re-verifiable in at most six modular exponentiations plus one
        scalar multiplication - and each agrees with the corresponding cell of
        the in-repository SafeCurves mirror." It certifies NOTHING about the cost
        of the transferred discrete logarithm in F_p^12, NOTHING about whether
        the transfer beats rho on this curve, and NOTHING about any other curve.
        A SUCCESS here is not evidence that any other lane's instrument works.
      nearby_object_control: >-
        A curve at the SAME 254-bit prime p in a DIFFERENT sextic twist class -
        y^2 = x^3 + b for b not a sextic residue. It has the same p, the same u,
        the same j-invariant 0 and the same CM discriminant, and a DIFFERENT
        order and therefore a different n and a different k. The instrument must
        return a DIFFERENT n for it and must FAIL the [n]G check when handed the
        intake n. A pipeline that cannot distinguish the intake curve from its
        own sextic twist at matched everything-else has not identified the
        load-bearing structure, and this is a far sharper control than any
        cross-curve comparison. SECOND NEARBY OBJECT - a random 254-bit prime,
        for which u recovery must FAIL.
    proof_obligations:
      - claim: >-
          The polynomial identity n(u) = p(u) + 1 - t(u) holds identically, so
          the three recalled polynomials are mutually consistent.
        responsibility: baseline
      - claim: >-
          The integer fourth root of p/36 locates |u| to within a window that the
          scan covers, for both signs of u.
        responsibility: correctness
      - claim: >-
          n prime, [n]G equal to the identity with G not the identity, and n
          greater than 4 sqrt(p) together force #E equal to n and cofactor 1.
        responsibility: correctness
      - claim: >-
          Checking n divides p^12 - 1 and n does not divide p^d - 1 for d in
          {1, 2, 3, 4, 6} establishes ord_n(p) equal to 12 exactly, because every
          divisor of 12 other than 12 is in that list.
        responsibility: strictness
      - claim: >-
          The derived t and n equal the values recovered from the mirror's disc
          and transfer cells, by exact integer comparison.
        responsibility: interface
      - claim: 'Stage 0 to Stage 2 cost O(log p) big-integer operations in total.'
        responsibility: runtime
      - claim: >-
          The toy pairing satisfies bilinearity and non-degeneracy on the tested
          instances, and the recovered k satisfies k times P equal to Q under
          independent recomputation.
        responsibility: correctness
      - claim: >-
          The toy instances are genuinely unknown to the solver, k being drawn,
          used to form Q, and discarded before the solver is invoked.
        responsibility: interface
      - claim: >-
          Every mirror value used is read from tables/*.tsv or pages/*.html and
          never from pages/*.txt, and its authority tier is recorded per value.
        responsibility: scope
      - claim: >-
          The full-size cost comparison is labelled as an EVALUATED COST MODEL
          with a relayed literature constant, never as a measurement.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        whether an integer u exists with p equal to 36u^4 + 36u^3 + 24u^2 + 6u + 1
        for the intake modulus, and its value and sign
      direction: different
      minimum_effect: >-
        PREDICTED YES, with |u| near 2^62, found within a scan window of at most
        10^4 around the integer fourth root of p/36 and with the sign reported. A
        YES is a roughly 192-bit consistency signal on the modulus, since BN
        primes have density about 2^62 over 2^254 among 254-bit integers. A NO
        means either the recalled parametrisation is wrong or the intake modulus
        is mis-transcribed, and the record must report which by re-testing the
        quartic against the mirror's index-table modulus for this row; either way
        it is a material finding about the family's designated
        multiplicative-transfer positive control.
    - metric: >-
        exact integer agreement between the derived trace 6u^2 + 1 and the trace
        published in the mirror's tables/disc.tsv for this row
      direction: different
      minimum_effect: >-
        PREDICTED EXACT EQUALITY WITH 129607518034317099905336561907183648775.
        THIS IS THE RECORD'S PRINCIPAL CROSS-CHECK and the two outcomes mean
        different things. AGREEMENT means an offline derivation from p alone and
        a published table concur on a 128-bit integer with no shared input beyond
        p, which is a genuine consistency result and is the pending check the
        goal's next_action asks for. DISAGREEMENT means at least one is wrong,
        and the record must then determine WHICH by re-reading pages/disc.html
        per the MIRROR-DEF-1 authority order and by re-deriving u, never by
        preferring the more convenient.
    - metric: >-
        number of independent random points G on the intake curve for which [n]G
        equals the identity, out of 10
      direction: higher
      minimum_effect: >-
        PREDICTED 10 out of 10 with n derived from u. THIS, NOT THE TABLE
        AGREEMENT, IS WHAT CARRIES THE ORDER CLAIM, because it is an arithmetic
        fact about the curve that no upstream document can corrupt. A result of 0
        out of 10 with a successful u recovery would mean the modulus is a BN
        prime but the coefficient b equal to 2 selects a different sextic twist
        than assumed - a specific, diagnosable outcome.
    - metric: >-
        the certified cofactor, compared against the mirror's tables/twist.tsv
        cofactor cell
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY 1 by Hasse uniqueness, MATCHING the mirror's published
        cofactor of 1. Any other derived value contradicts both the BN family
        definition and the mirror and halts the record.
    - metric: >-
        the certified exact embedding degree ord_n(p), compared against the
        mirror's transfer cell
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY 12, certified by six modular exponentiations and
        matching the mirror's published 12. ADDITIONALLY, the mirror states the
        cell as "12= (l-1)/1399842394251319357078400345185977825813298300283729
        395752364905347130851329", so twelve times that cofactor plus one must
        equal the derived n EXACTLY - a second, independent arithmetic check on n
        that costs one multiplication. A value of 1, 2, 3, 4 or 6 would be a more
        severe transfer exposure than either the intake row or the mirror
        anticipates and requires immediate independent review-breakthrough
        scrutiny before any statement leaves the repository.
    - metric: >-
        the derived CM discriminant, compared against the mirror's disc cell
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY -3, matching the mirror's "-3= -1 * 3, approx -2^1.6",
        and cross-validating against IDEA-20260829-9e38bc's square-part
        instrument run on the derived trace. Three routes, one answer; any
        disagreement localises to whichever route is unique in producing it.
    - metric: >-
        number of planted positives from IDEA-20260807-98a970 returned correctly
        by the identical code path - toy BN k equal to 12, toy supersingular k
        equal to 2, toy p congruent to 1 mod N k equal to 1
      direction: higher
      minimum_effect: >-
        PREDICTED 3 out of 3. THIS IS BLOCKING AND IT IS THE ONE THING THE MIRROR
        CANNOT SUPPLY - a table cannot fire an instrument. Anything less voids
        every k value in the deliverable and, by 98a970's own rule, voids every
        SAFE verdict the multiplicative lane would ever emit. These controls were
        declared mandatory on 2026-08-07 and have never been run.
    - metric: >-
        number of successful u recoveries over 10^4 uniformly random 254-bit
        primes, null control, identical code path
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 0. Derivation stated so it is checkable - the quartic
        takes about 2^62 values below 2^254, so the density of BN primes among
        254-bit integers is about 2^-192 and the expected count over 10^4 samples
        is about 2^-179. A SINGLE spurious recovery means the scan window or the
        equality test is wrong and voids the instrument.
    - metric: >-
        the residual between the mirror's published rho cost 2^126.4 and
        log2(0.886 sqrt(l)) evaluated on the derived l, in bits
      direction: different
      minimum_effect: >-
        REPORTED WITH ITS SIGN AND ITS COST MODEL. This is a reproduction check
        on the mirror itself, made possible only once l is derived. PREDICTED
        within 0.5 bits under the negation-only convention KN-TECH-018 records as
        the program's baseline. A residual far larger, or one that differs
        systematically from the residual computed the same way for the secp256k1
        and Curve25519 rows, would indicate the mirror's rho column uses a
        different convention - for instance including or excluding the
        j equal to 0 automorphism discount - which is a genuine and reportable
        finding about how the published column must be read, and which
        IDEA-20260829-3af6ec pursues directly.
    - metric: >-
        number of independently verified toy discrete_log certificates obtained
        THROUGH the pairing transfer, out of 25, at 30 to 40 bits
      direction: higher
      minimum_effect: >-
        PREDICTED 25 out of 25, each re-verified by recomputing k times P with
        harness/toycurve.py. THIS IS THE FIRING. The program currently holds zero
        certificates of any kind obtained through a transfer.
    - metric: >-
        number of successful transfer solves when the identical toy pipeline is
        pointed at a curve with LARGE embedding degree at matched field size
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 0 over 25 attempts, failing at the representability
        wall rather than returning a wrong answer. A verified success here would
        mean the pipeline is not using the pairing at all and every transfer
        certificate is void.
    - metric: >-
        log2 of the evaluated rho cost on the derived l versus log2 of the
        transferred field size 12 times log2(p)
      direction: different
      minimum_effect: >-
        REPORTED AS TWO EVALUATED FORMULAE, NOT AS MEASUREMENTS. The mirror
        publishes the curve-side figure 2^126.4 and publishes NO transferred-field
        cost, so the comparison cannot be settled from it. The record must state
        that whether the transfer BEATS rho depends entirely on the exTNFS cost
        model, that the approximately 100-bit figure is relayed from a
        search-engine summary and was NOT verified here, and that this program
        measured neither number.

  minimal_test:
    design: >-
      STAGE 0, THE CHEAPEST VALID DISCRIMINATOR, milliseconds of compute and
      under an hour of implementation. Verify the polynomial identity
      n(u) = p(u) + 1 - t(u) symbolically; compute the integer fourth root of
      p/36 for the intake modulus; scan a window of at most 10^4 around it in
      both signs; test the quartic by exact integer equality; THEN compare
      6u^2 + 1 against the mirror's published trace. This settles whether the row
      is a BN curve AND whether an offline derivation reproduces the published
      table, and it costs essentially nothing. IF THE QUARTIC FAILS, EVERYTHING
      BELOW IS WITHDRAWN AND THAT IS THE RESULT.
      STAGE 1, seconds. Derive t and n; test n for primality at a stated tier and
      record the tier; draw 10 random points G on the intake curve and check
      [n]G equals the identity; check n greater than 4 sqrt(p); check n against
      twelve times the mirror's transfer-cell cofactor plus one; emit the order
      and cofactor certificate with both routes recorded.
      STAGE 2, milliseconds. The exact embedding-degree certificate - six modular
      exponentiations over the divisor lattice of 12 - and the rho-column
      reproduction residual. Run the three IDEA-20260807-98a970 planted positives
      FIRST as a blocking gate.
      STAGE 3a, hours of implementation, seconds of compute. FIRE THE TRANSFER at
      toy scale on a k equal to 2 curve, which needs only F_p^2 arithmetic -
      build a supersingular curve y^2 = x^3 + ax over a 30 to 40 bit prime p
      congruent to 3 mod 4, so the trace is 0 and n divides p + 1 and the
      embedding degree is 2; implement Miller's algorithm for the Tate pairing
      with the distortion map (x, y) to (-x, i y) where i^2 equals -1 in F_p^2;
      transfer 25 instances; solve each resulting discrete logarithm in mu_n by
      baby-step giant-step; emit a discrete_log certificate per instance and
      re-verify each with harness/toycurve.py.
      STAGE 3b, OPTIONAL, higher implementation cost. Repeat 3a on a TOY BN curve
      with small u, requiring an explicit F_p^12 tower. This is the rung that
      exercises the actual k equal to 12 geometry rather than a k equal to 2
      stand-in, and the record must say plainly whether it was reached.
      STAGE 4, OPTIONAL AND EXPLICITLY DEFERRABLE, high implementation cost. The
      only rung that would measure a SPEEDUP rather than correctness - construct
      a k equal to 1 curve by Cocks-Pinch with discriminant -3 at a subgroup
      order near 2^50, run rho on the curve and index calculus in the
      corresponding prime field, and report the MEASURED RATIO. This is rung 2 of
      the validation ladder of docs/inventor-protocol.md section 6, the rung that
      section names as the one this program most often skips. IT IS NOT PART OF
      THE MINIMAL TEST and the deliverable must not imply it was run if it was
      not.
    controls:
      - >-
        BLOCKING PLANTED POSITIVES, inherited verbatim from IDEA-20260807-98a970
        and never yet run - toy BN-shaped curve returning k equal to 12, toy
        supersingular t equal to 0 curve returning k equal to 2, toy curve with p
        congruent to 1 mod N returning k equal to 1 and flagged AFFECTED. All
        three must pass before any 254-bit arithmetic.
      - >-
        NEARBY-OBJECT NEGATIVE, THE SHARP ONE - the intake curve's own sextic
        twists at the SAME p, same u, same j-invariant, same CM discriminant. The
        [n]G check must FAIL on them with the intake n, and the instrument must
        derive a different n for each. This isolates the twist class as the one
        thing u cannot see.
      - >-
        NEGATIVE, FULL SIZE, CROSS-CURVE - run the u recovery on the Curve25519,
        secp256k1 and Anomalous moduli. All must FAIL. These match on nothing
        except being 200-to-256-bit primes, so they are weaker controls than the
        sextic twins and are labelled as such.
      - >-
        NULL, SAME SHAPE, QUANTIFIED - 10^4 uniformly random 254-bit primes
        through the identical u-recovery code path, seeds recorded. Predicted
        zero recoveries against a density of about 2^-192.
      - >-
        MIRROR-READING CONTROL, ADDED IN RESPONSE TO MIRROR-DEF-1 - for every
        mirror cell used, read the value from tables/*.tsv AND from the
        corresponding pages/*.html, and require exact agreement. A disagreement
        is a defect in the derived table and must be reported to the source
        record rather than silently resolved. Additionally, read the SAME cells
        from pages/*.txt and record whether the known row-boundary collapse
        actually corrupts them for these rows - a cheap, direct measurement of
        MIRROR-DEF-1's blast radius that no record currently holds.
      - >-
        NULL FOR THE TRANSFER - run the toy pairing pipeline on a curve of the
        same size with LARGE embedding degree. It must refuse at the
        representability wall, not return a wrong k.
      - >-
        RANDOM-Q CONTROL for the toy solves - draw Q as a uniformly random point
        of the order-n subgroup with no k ever computed. Predicted the same
        success rate as instances built as k times P; a gap is direct evidence
        the harness is leaking the answer and voids every solve.
      - >-
        DEGENERATE-INPUT CONTROL - P the identity, Q the identity, Q equal to P,
        and Q not in the order-n subgroup, each handled explicitly rather than by
        accident.
    required_metrics:
      - 'the recovered u with its sign, and the exact quartic evaluation as an integer'
      - 'the derived t and n, and their exact-integer comparison against the mirror cells'
      - 'per mirror value used, the file and the authority tier it was read from'
      - 'the primality tier reached for n, and the 10 [n]G witnesses'
      - 'the certified cofactor and the Hasse-uniqueness inequality as exact integers'
      - 'the six divisor-lattice exponentiation results establishing ord_n(p)'
      - 'the rho-column reproduction residual in bits, with the cost model stated'
      - 'pass or fail of each of the three inherited planted positives'
      - 'per toy instance, the discrete_log certificate, the verification outcome, and the order of P'
      - 'the toy transfer success rate, and the failure MODE per attempt on the large-k null'
      - 'the u-recovery success count over the 10^4 random-prime null, with seeds'
      - 'the sextic-twist control results at the real p'
      - 'the tsv-versus-html agreement outcome for every mirror cell used'
      - 'wall clock per stage, and an explicit statement of which optional stages were NOT run'
      - 'verifier_commit and the exact harness/toycurve.py revision used'

  falsification_conditions:
    - >-
      No integer u reproduces the intake modulus within the scanned window. The
      row is not a BN curve as parametrised here, C1 through C4 are withdrawn,
      and the record reports whether the defect is in the recalled
      parametrisation or in the transcription by re-testing against the mirror's
      index-table modulus for this row.
    - >-
      The derived trace 6u^2 + 1 differs from the mirror's published trace. At
      least one is wrong; halt, re-read pages/disc.html per the MIRROR-DEF-1
      authority order, re-derive u, and report which route failed. DO NOT prefer
      the more convenient value.
    - >-
      [n]G is not the identity for the derived n on the intake curve. The
      derivation and the intake equation are inconsistent; report the sextic
      twist diagnosis and halt the order certificate.
    - >-
      n is composite, or n is not greater than 4 sqrt(p). Hasse uniqueness does
      not apply and the cofactor claim is withdrawn - the archived plan's own
      null control Z3 makes exactly this point, that the arithmetic certifies
      nothing without the order premise.
    - >-
      Twelve times the mirror's transfer-cell cofactor plus one does not equal
      the derived n. The two mirror cells disagree with each other or with the
      derivation; localise before proceeding.
    - >-
      n does not divide p^12 - 1. The embedding degree is not 12, contradicting
      the mirror, and every transfer statement about this row is withdrawn
      pending re-reading of pages/transfer.html.
    - >-
      Any of the three inherited planted positives returns the wrong k. Under
      IDEA-20260807-98a970's own blocking rule the instrument is void and no k
      value is reported for any curve.
    - >-
      Any toy transfer solve whose certificate fails independent verification.
      Per docs/claims-and-verification.md this is invalid_measurement, NOT a
      negative observation; the run is void and the implementation is wrong.
    - >-
      A verified transfer solve on the large-k null control. The pipeline is not
      using the pairing; halt and exclude implementation error first.
    - >-
      Any successful u recovery on a random 254-bit prime. The equality test or
      the window logic is wrong and the 192-bit null signal is not real.
    - >-
      Any tsv-versus-html disagreement on a mirror cell used here. The derived
      table is defective beyond MIRROR-DEF-1's recorded scope; report it against
      the source record and use pages/*.html.

  confounders:
    - >-
      CONFIRMATION BIAS AGAINST A PUBLISHED ANSWER, AND IT IS NOW THE LEADING
      RISK IN THIS RECORD. The mirror states the trace, k, the cofactor and D
      before the executor computes anything, so an implementation that is subtly
      wrong is far likelier to be tuned until it matches than to be caught. Two
      mitigations, both mandatory - Stage 0 records the derived trace BEFORE the
      mirror cell is opened in the run log, and the [n]G check, which no table can
      corrupt, is what the order claim cites, with the table agreement reported
      separately as corroboration.
    - >-
      MIRROR-DEF-1. The pages/*.txt renderings collapse empty table cells and can
      attach a row's comment to a neighbouring row. Every value here came from
      tables/*.tsv, which is the SECOND tier of the recorded authority order, and
      load-bearing cells must be re-read from pages/*.html. A claim resting on a
      .txt reading would be exactly the defect the addendum records.
    - >-
      SIGN AND CONVENTION ON u. Several BN parameter sets in the literature use a
      NEGATIVE u, and some sources write the family with u replaced by -u or with
      a different constant term. A scan that tests only positive u would return a
      spurious NO and would be recorded as a finding about the intake when it is
      a finding about the scan. Both signs must be scanned and the record must
      say so.
    - >-
      WHICH n. The mirror gives the BN cofactor as 1, so the group order and the
      prime subgroup order coincide - but the instrument must state which
      quantity it used, and the embedding degree must be computed with respect to
      the PRIME subgroup order, exactly as IDEA-20260807-98a970's first
      confounder requires.
    - >-
      SELF-CONSISTENT WRONGNESS. If the code that derives n from u and the code
      that checks [n]G share a wrong constant, they can agree. The [n]G check uses
      harness/toycurve.py, which knows nothing about the BN family and only about
      F_p arithmetic, and that independence is what makes the check meaningful.
    - >-
      k EQUAL TO 2 IS NOT k EQUAL TO 12. Stage 3a fires the transfer on a k equal
      to 2 supersingular curve because F_p^2 arithmetic is cheap. That
      demonstrates the transfer MECHANISM, not the BN geometry, and the record
      must not describe a k equal to 2 firing as having exercised the BN row.
      Only Stage 3b does that.
    - >-
      CORRECTNESS IS NOT SPEEDUP. A toy transfer followed by baby-step
      giant-step in mu_n is not faster than rho on the curve, because both cost
      the square root of n. The transfer becomes an ATTACK only through index
      calculus in the target field, which is Stage 4 and is optional. Reporting a
      toy firing as a demonstrated speedup would be the central dishonesty
      available in this record and it is pre-committed against.
    - >-
      THE 100-BIT FIGURE IS NOT OURS AND IS NOT IN THE MIRROR. Any statement that
      BN254 offers about 100 bits rather than about 128 must carry its provenance
      - a search-engine summary of Barbulescu and Duquesne, with the paper unread
      here - every time it appears. The mirror's 2^126.4 is a CURVE-side rho cost
      and is not a transferred-field cost.

  interpretation_limits:
    - >-
      NO DISCRETE LOGARITHM IS SOLVED ON BN(2,254) AND NONE CAN BE IN THIS
      ENVIRONMENT. The transferred instance lives in a roughly 3048-bit field.
      This record certifies that the transfer APPLIES and demonstrates that the
      transfer WORKS at toy scale; it does not attack the curve and claims no
      cryptographically relevant break.
    - >-
      AGREEMENT WITH THE MIRROR IS CONSISTENCY, NOT CORRECTNESS, AND NOT
      SOURCING. Two routes agreeing on an integer raises confidence in both; it
      proves neither, and a shared upstream error would be invisible. Moreover
      the mirror is SafeCurves, which is itself a compilation - the goal's first
      completion criterion asks for reconciliation to PRIMARY or authoritative
      sources with citation provenance, and inputs/SAFECURVES-20260825/specs/
      carries thirteen specification documents that this session did NOT open.
      This record does not satisfy that criterion and must not be cited as doing
      so.
    - >-
      A CERTIFIED k EQUAL TO 12 IS NOT A VERDICT. Converting a value of k into
      AFFECTED or SAFE requires the crossover threshold k* of
      IDEA-20260807-5f24d7, which this program does not hold. Until it does,
      every verdict column is provisional and must be labelled so - the same
      partial-cost error KN-TECH-035 warns about.
    - >-
      BN(2,254) IS A PAIRING-FRIENDLY CURVE, BUILT ON PURPOSE. Its small
      embedding degree is a DESIGN FEATURE required by the protocols it serves,
      not a defect discovered here, and the goal's own claim boundaries designate
      this row a positive-control candidate rather than a newly discovered
      attack. Reproducing its transfer exposure is instrument validation.
    - >-
      TRANSFER TO THE OTHER 19 CURVES, STATED EXACTLY. (a) THE u-RECOVERY OBJECT
      TRANSFERS TO ZERO other rows in the family - the tracked object is defined
      only for BN curves and simply does not exist elsewhere, which is why the
      other nineteen are the null control rather than candidate targets. That is
      the sharpest possible non-transfer and it is the object's strength, not its
      weakness. (b) THE EXACT-k-BY-DIVISOR-LATTICE CERTIFICATE FORM TRANSFERS TO
      EVERY curve for which a candidate k is known a priori - from a construction,
      or now from the mirror's transfer column, which publishes an embedding
      degree for eighteen of the twenty rows and "Unverified" for Anomalous - so
      it is a reusable certificate form, filed once and citable by all twenty
      goals and by IDEA-20260807-98a970's table. (c) THE FIRED TRANSFER INSTRUMENT
      TRANSFERS FULLY AS A CONTROL - once it exists and has fired, every one of
      the twenty goals' transfer lanes can cite a fired multiplicative instrument,
      exactly as IDEA-20260829-f89a3a's certified solve is intended to license the
      additive sub-lane. Together the two records cover both halves of the
      transfer criterion for the whole family. (d) THE DERIVE-THEN-CROSS-CHECK
      PATTERN transfers to every row for which an independent derivation route
      exists, which is three - Anomalous, where #E equal to p forces t equal to 1
      (IDEA-20260829-9e38bc); this row; and secp256k1, where the j equal to 0 CM
      structure supplies six candidate traces (IDEA-20260829-3af6ec). For the
      other seventeen rows the mirror's values can be re-verified only by [n]G
      checks against a transcribed n, which is a weaker but still real check, and
      the deliverable must not present the three exceptional rows as
      representative.
    - >-
      Nothing here adjudicates any SafeCurves criterion cell. The criterion
      DEFINITIONS and thresholds live in the mirror's pages/*.html, which this
      session did not open; IDEA-20260829-f5bcff's threshold-inversion argument
      was written before the mirror was known to this author and its premise that
      the definitions are unreachable is superseded - the definitions should now
      simply be read.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For u drawn as an integer near 2^62, the probability that the value
        36u^4 + 36u^3 + 24u^2 + 6u + 1 is prime is comparable to the probability
        that a uniformly random integer of the same size, subject to the same
        small-prime congruence restrictions, is prime; equivalently, the set of
        BN primes below X has counting function of order X^{1/4} up to
        logarithmic factors, so the density of BN primes among 254-bit integers
        is about 2^{62 - 254}, which is 2^-192.
      rigorous_support: >-
        The RIGOROUS half is a counting bound requiring no heuristic at all - the
        quartic is strictly monotone in |u| beyond a small window, so it takes at
        most 2 times 2^62 values below 2^254 regardless of how many are prime.
        That upper bound alone is what the null control needs, because the null
        asks only that a random prime is UNLIKELY to be BN-shaped. The HEURISTIC
        half is only needed for the converse statement that BN primes exist in
        abundance, which imitates the Bateman-Horn conjecture on prime values of
        irreducible polynomials - notoriously easier to state than to prove, and
        that difficulty is recorded here rather than hidden. NOTHING IN THIS
        RECORD DEPENDS ON THE HEURISTIC HALF.
      validation_plan: >-
        SAMPLING - 10^4 uniformly random 254-bit primes and, separately, 10^4
        uniformly random 254-bit odd integers, seeds recorded, through the
        identical u-recovery code path. COMPARISON DISTRIBUTION - the observed
        recovery rate against the EXACT combinatorial upper bound of 2^-192; this
        is an exact null, not an asymptotic one, so the test can only REFUTE the
        exponent and never confirm it, which is stated rather than glossed. TAIL
        CHECK - the distribution of |quartic(u_est) - p| over the random samples,
        where u_est is the integer fourth root; this should be spread over the
        full 2^192 range and a suspicious clustering near zero would indicate a
        truncation defect in the fourth root. TRANSFER - none, since the null runs
        at the real bit length on real primes; nothing is extrapolated.
    - id: H2
      statement: >-
        An instrument validated against exhaustive toy controls at 30 to 40 bits
        and against three planted positives is correct at 254 bits; formally, the
        map from (p, curve, n) to the certified tuple has no size-dependent
        failure mode - word size, overflow, modular reduction, exponent range -
        first appearing above 40 bits.
      rigorous_support: >-
        NONE, and the record says so plainly. This is the same shape as heuristic
        H2 of IDEA-20260829-d052e6 and of IDEA-20260829-f89a3a and as the
        archived audit plan's H4. THREE mitigations, stated as mitigations and NOT
        as support. (i) EVERY claim this record makes at 254 bits is checked at
        254 bits by an independent recomputation ([n]G on harness/toycurve.py, six
        exponentiations for k), so a wrong answer at full size is CAUGHT even
        though it cannot be prevented. (ii) The mirror supplies FULL-SIZE EXPECTED
        VALUES for t, n, the cofactor, k and D, so a size-dependent defect that
        survives the toy ladder has five independent full-size chances to be
        caught - which is materially better than the position d052e6 and f89a3a
        were in, and it is the concrete benefit of the mirror to this record.
        (iii) The arithmetic is Python arbitrary-precision integers, where the
        relevant bug classes are largely absent by construction - an argument
        about the implementation, not a proof about the mathematics.
      validation_plan: >-
        SAMPLING - the three inherited planted positives at toy size, 25 toy
        transfer instances at 30 to 40 bits, plus the sextic-twist controls and
        the five mirror comparisons at the REAL 254-bit prime. COMPARISON - exact
        integer equality throughout; for the toy solves, agreement between the
        transfer route and baby-step giant-step directly on the curve, which is
        the one rung with an independent SOLVER rather than only an independent
        verifier. TAIL CHECK - instances with k near 0, k near n - 1, and
        low-Hamming-weight k, where off-by-one and truncation defects surface
        first. TRANSFER - correctness is assumed to transfer and cost is measured
        at every size. THE RECORD STATES AT WHICH SIZE INDEPENDENT-SOLVER CHECKING
        STOPPED rather than implying it continued.
    - id: H3
      statement: >-
        The cost of the transferred discrete logarithm in F_p^12 for a 254-bit BN
        prime is governed by the extended tower number field sieve and is
        materially below the roughly 2^126.4 curve-side rho cost the mirror
        publishes for this row; the specific figure relayed in the literature is
        approximately 100 bits.
      rigorous_support: >-
        NONE OBTAINED IN THIS PROGRAM. This is not a mathematical heuristic but a
        relayed empirical estimate, and it is the ONLY place this record depends
        on an external number. Its provenance is a search-engine summary of
        Barbulescu and Duquesne; the paper itself failed to parse when fetched on
        2026-08-29. THE MIRROR DOES NOT HELP HERE - it publishes a curve-side rho
        cost and no transferred-field cost for any row. The rigorous statement
        this record CAN make without it is the representability wall of
        IDEA-20260807-98a970 read in the opposite direction - one element of
        F_p^12 at a 254-bit p occupies about 3048 bits, small enough to be
        representable, which is exactly why small k is dangerous and large k is
        not.
      validation_plan: >-
        PARTIAL AND INDIRECT ONLY. (i) RE-RETRIEVAL - a targeted fetch of the
        paper through an alternative route, and a check of whether
        inputs/SAFECURVES-20260825/specs/ contains anything bearing on pairing
        cost, recorded as attempted with its outcome, before any record cites the
        figure. (ii) A cost-model recomputation from the exTNFS complexity formula
        with the field size 12 times log2(p) substituted, done symbolically in
        this program and reported as OUR EVALUATION of a formula we did not
        verify, alongside the relayed figure, with any discrepancy published
        rather than reconciled. (iii) NO EXPERIMENT DISCHARGES THIS, and none is
        proposed; Stage 4 would measure a ratio at 50-bit scale, which bears on
        the mechanism and not on the 254-bit constant. H3 remains open and every
        downstream statement must carry it.

  target_complexity:
    time_exponent: >-
      NO NEW ATTACK EXPONENT IS CLAIMED. As an audit instrument - Stage 0 is one
      integer fourth root plus O(1) big-integer polynomial evaluations; Stage 1
      is one primality test plus 10 scalar multiplications, that is O(log p) group
      operations; Stage 2 is six modular exponentiations. Total O(log^3 p) bit
      operations with schoolbook arithmetic - milliseconds to seconds at 254 bits.
      Certificate verification is six exponentiations plus one scalar
      multiplication, genuinely succinct, in contrast to IDEA-20260807-98a970's
      lower-bound certificate which costs K equal to 10^6 multiplications to
      verify. AS AN ATTACK ON THE TARGET CURVE, the exponent statement is textbook
      and is a TIE, not an advance - MOV and Frey-Ruck move the ECDLP on a curve
      with embedding degree k from 0.886 sqrt(n) group operations, exponential in
      log n, to a finite-field discrete logarithm in F_p^k of subexponential cost
      L[1/3] under exTNFS. On BN(2,254) that is a move from the mirror's published
      2^126.4 to a 3048-bit field DLP whose cost this program has not measured.
    memory_exponent: >-
      O(log p) working memory and O(log p) certificate size for the audit; a few
      kilobytes for the whole row. The toy transfer needs O(sqrt(n)) memory for
      the baby-step giant-step table at 30 to 40 bits, that is at most 2^20
      entries, trivially inside the 48 GB envelope. The relevant memory statement
      about the TARGET is the representability wall - one F_p^12 element is about
      3048 bits, which is small, and that smallness is precisely the exposure.
      The full exTNFS attack's memory at BN size is NOT estimated here.
    best_known: >-
      For a curve with small embedding degree, the MOV and Frey-Ruck transfer
      itself (KN-TECH-032) IS the best known route, so this record TIES that
      frontier row and does not advance it. For general curves - rho at 0.886
      sqrt(n) with O(1) memory (KN-TECH-001, KN-TECH-006), which the mirror
      evaluates as 2^126.4 for this row, automorphism-discounted rho
      (KN-TECH-018), which applies here too since BN curves have j equal to 0,
      BSGS at square-root time and memory (KN-TECH-031) with its n^{2/3+o(1)} full
      cost (KN-TECH-035), and the trace-one additive transfer (KN-TECH-033), which
      does not apply here. AS AN AUDIT INSTRUMENT the incumbent is now the
      in-repository mirror itself, which supplies the VALUES; this record supplies
      the WITNESSES, and those are different goods.
    hidden_overhead: >-
      No o(1) and nothing superpolynomial in the audit. Four genuine hidden costs,
      all epistemic. (i) SCOPE - the u object exists for BN curves only, a set of
      density about 2^-192 at this size, so the instrument is spectacular and
      almost never applicable. (ii) CORRECTNESS at 254 bits is carried by
      heuristic H2 with no rigorous support, mitigated but not removed by
      full-size independent recomputation and by five full-size mirror
      comparisons. (iii) The ATTACK cost hides entirely inside heuristic H3, which
      this program has not verified and which the mirror does not address. (iv)
      The toy firing demonstrates correctness and NOT speedup; the speedup rung is
      optional and may not be run.
    tradeoff_note: >-
      Two real tradeoffs. FIRST, CERTIFICATE FORM - exact k via factorisation
      costs a 254-bit factorisation to produce and a few dozen exponentiations to
      verify; a lower bound costs K multiplications both to produce and to verify;
      the divisor-lattice form proposed here costs six exponentiations both ways
      but is available ONLY when a candidate k is known a priori, which for this
      row the mirror now supplies. The row must report which form it used. SECOND,
      THE ONE THIS RECORD IS REALLY ABOUT - reading a table costs nothing and
      yields intake; deriving and certifying costs a few hundred lines and yields
      evidence, and the goal's completion criteria ask for the second.
      Parallelisation is irrelevant at 254 bits; the 14 cores buy something only
      in the optional Stage 4 and in the 10^4-sample null, both embarrassingly
      parallel.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW BEFORE WRITING THIS FIELD; `null` is not
    asserted. ON A SMALL-EMBEDDING-DEGREE CURVE nothing dominates the MOV and
    Frey-Ruck route this record instruments - KN-TECH-032 IS the frontier row
    there, and this record REPRODUCES it rather than advancing it, which is stated
    as a tie. Rho (KN-TECH-001, KN-TECH-006), automorphism-discounted rho
    (KN-TECH-018), BSGS (KN-TECH-031, KN-TECH-035) and the trace-one additive
    transfer (KN-TECH-033) are all dominated BY that route on BN(2,254) IF and
    only if heuristic H3 holds, and this record does not establish H3, so the
    honest statement is that the domination is CONDITIONAL and unverified here.
    AS A SOLVE this record is dominated by IDEA-20260829-f89a3a on every axis -
    that record produces a genuine crypto-tier discrete logarithm at 204 bits and
    this one produces only toy-tier solves at 30 to 40 bits, because the additive
    transfer's target group is F_p and the multiplicative transfer's target group
    is a 3048-bit field. That asymmetry is intrinsic to the two transfers.
    AS A SOURCE OF THE VALUES the in-repository SafeCurves mirror
    (inputs/SAFECURVES-20260825/) STRICTLY DOMINATES this record on cost - it
    supplies t, n, the cofactor, k, D, the twist cofactor and the twist subgroup
    order for zero compute, and this record does not dispute that. This record is
    NOT dominated on the one axis the goal's completion criteria actually measure,
    namely whether a value is accompanied by a witness this program can
    independently re-verify: the mirror supplies no witnesses, no instrument
    firing, and no parameter u. That is a narrow non-domination and it is stated
    narrowly. AGAINST IDEA-20260807-98a970 it is neither dominated nor dominating -
    98a970 covers about fifteen curves from transcribed standards; this covers one
    curve with a derived order and an exact small-k certificate form 98a970 lacks.
    Pareto-incomparable on the coverage-versus-verifiability plane.
  sota_delta: >-
    ZERO against the small-k frontier - this TIES MOV and Frey-Ruck and claims no
    improvement. QUANTITATIVELY AGAINST THE GENERIC BASELINE ON THE TARGET CURVE,
    CONDITIONAL ON H3 AND STATED AS SUCH - the mirror's published rho cost of
    2^126.4 against a transferred discrete logarithm in a 3048-bit field which the
    relayed literature figure puts near 2^100. That is a CONDITIONAL delta of
    about 26 bits resting on a number obtained from a search-engine summary,
    reported as published-figure versus relayed-estimate, never as a measurement.
    AS ARTIFACT, WHICH IS THE UNCONDITIONAL DELTA, AND STATED AT ITS TRUE AND
    SMALLER SIZE NOW THAT THE MIRROR IS ACCOUNTED FOR - the VALUES for this row
    are not new to the repository; inputs/SAFECURVES-20260825/ has carried them
    since 2026-08-25. What does not exist anywhere in ledger/ or knowledge/ is any
    of the following, and this record would produce all of them - an order and
    cofactor DERIVED from the modulus by a route sharing no input with the
    published table; an EXACT embedding degree accompanied by a six-exponentiation
    witness rather than an assertion; the three planted positives
    IDEA-20260807-98a970 declared blocking on 2026-08-07 and that have never been
    run; about 25 toy-tier discrete_log certificates obtained through a pairing,
    against zero today; a reproduction residual for the mirror's own rho column;
    and a direct measurement of MIRROR-DEF-1's blast radius on this row's cells.
    AS EPISTEMIC STATUS - KN-TECH-032 moves from a technique described at
    confidence `established` on papers none of which was read in full, and
    asserted about no named curve, to a technique this program has executed,
    certified and controlled on one named curve. AS PROCESS - the BN row moves
    from "every stated numeric relation is a transcription plus a pending check"
    to a row whose five principal integers have had the pending check performed.
  estimated_cost:
    implementation: medium
    compute: low
    basis: >-
      Stages 0 to 2 are under 200 lines of elementary integer arithmetic and run
      in seconds. Stage 3a adds Miller's algorithm and F_p^2 arithmetic, roughly
      300 more lines, and runs in seconds at 30 to 40 bits. Stage 3b adds an
      F_p^12 tower and is the reason the label is medium rather than low. Stage 4
      would add an index-calculus implementation and is explicitly OPTIONAL and
      outside the minimal test; if it is attempted the implementation label for
      that stage alone is high and the compute label is medium.
  recommended_priority: high

