  id: IDEA-20260829-3e330e
  question_id: RQ-SCURVE-965391
  goal_id: GOAL-SCURVE-e33f7d
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    THE BN FAMILY PARAMETER u AS THE TRACKED OBJECT - recover the single ~62-bit
    integer u from the 254-bit intake modulus by one integer fourth root, and
    from u alone DERIVE the group order, the trace, the cofactor and the CM
    discriminant of BN(2,254) independently of any table, then CROSS-CHECK every
    derived integer against the SafeCurves mirror already in this repository at
    inputs/SAFECURVES-20260825/; certify the embedding degree as EXACTLY 12 with
    six modular exponentiations rather than by factoring N-1; and FIRE the
    MOV/Frey-Ruck multiplicative transfer at toy scale with a discrete_log
    certificate that harness/toycurve.py re-verifies
  class: composition

  claim: >-
    THE CAMPAIGN'S RECORDED DEFICIENCY IS NOT MISSING DATA, IT IS UNCHECKED DATA.
    All twenty SafeCurves goals closed their first batch with the same recorded
    state - the producer had no shell and performed no arithmetic, so every
    stated numeric relation is a transcription plus A PENDING CHECK. The source
    values themselves are PRESENT in this repository: inputs/SAFECURVES-20260825/
    carries the SafeCurves pages as raw HTML, fifteen derived per-page TSV
    tables, and thirteen specification documents, and I read the BN row of
    tables/transfer.tsv, tables/disc.tsv, tables/rho.tsv, tables/twist.tsv and
    tables/index.tsv directly on 2026-08-29. So the work this record proposes is
    not a workaround for unavailable data - it is the pending check itself,
    performed with a shell, against a source that is now readable. Five separable
    sub-claims of decreasing rigour, each independently falsifiable.

    (C1) THE PARAMETER IS RECOVERABLE IN O(1) FROM THE MODULUS ALONE, WITH NO
    TABLE READ. Barreto-Naehrig curves form a one-parameter polynomial family -
    p(u) = 36u^4 + 36u^3 + 24u^2 + 6u + 1,
    n(u) = 36u^4 + 36u^3 + 18u^2 + 6u + 1, t(u) = 6u^2 + 1, with the internal
    consistency n = p + 1 - t holding identically as polynomials, which the
    executor checks symbolically BEFORE touching any curve. Since p ~ 36u^4, the
    magnitude of u is fixed by an integer fourth root of p/36 - at a 254-bit p
    this predicts |u| near 2^62 - and the exact value is found by scanning a
    small window around that estimate for BOTH SIGNS of u and testing the quartic
    by exact integer equality. Cost - one integer fourth root and a few thousand
    big-integer polynomial evaluations, milliseconds. THE CERTIFICATE IS THE
    INTEGER u ITSELF, verified by one polynomial evaluation.

    (C2) THE ORDER IS DERIVED, THEN CHECKED AGAINST THE MIRROR - TWO INDEPENDENT
    ROUTES THAT SHARE NO INPUT BUT p. ROUTE A, derivation: from u compute
    t = 6u^2 + 1 and n = p + 1 - t; certify n prime at a stated tier; certify
    that a random point G on the intake curve y^2 = x^3 + 2 satisfies [n]G equal
    to the identity; observe n greater than 4 sqrt(p), so the Hasse interval
    contains at most one multiple of n and #E equals n EXACTLY with cofactor
    EXACTLY 1. ROUTE B, the mirror: tables/disc.tsv states the BN trace as
    129607518034317099905336561907183648775, and tables/transfer.tsv states the
    embedding degree cell as "12= (l-1)/1399842394251319357078400345185977825813
    298300283729395752364905347130851329", from which l is recovered as twelve
    times that cofactor plus one; tables/twist.tsv states the cofactor as 1. THE
    TWO ROUTES MUST AGREE ON t, ON n AND ON THE COFACTOR. Agreement is a genuine
    consistency result, because Route A reads no table and Route B does no curve
    arithmetic. DISAGREEMENT IS A FINDING and the record must then say WHICH
    route is wrong by re-reading pages/transfer.html and pages/disc.html rather
    than preferring the more convenient.

    (C3) THE EMBEDDING DEGREE IS CERTIFIED EXACTLY, AND CHEAPLY, BY A ROUTE THE
    PROGRAM DOES NOT CURRENTLY HAVE. The mirror STATES k equal to 12; it does not
    supply a witness this program can re-verify, and the goal's completion
    criteria ask for certificates or explicit reproducible bounds rather than for
    transcriptions. IDEA-20260807-98a970 defines two certificate forms - an
    EXACT-k certificate requiring the full factorisation of N-1, and a
    LOWER-BOUND certificate costing K modular multiplications to produce AND K to
    verify. For BN both are the wrong instrument. Because k is small and known a
    priori, exactness is certified by SIX modular exponentiations - verify n
    divides p^12 - 1, and verify n does NOT divide p^d - 1 for each of the five
    proper divisors d in the list 1, 2, 3, 4, 6. That establishes ord_n(p) equal
    to 12 exactly, with no factorisation anywhere. THIS IS A THIRD CERTIFICATE
    FORM, available precisely when a candidate k is known a priori, and it
    converts the mirror's asserted 12 into a re-verifiable one.

    (C4) THE INSTRUMENT MUST BE SHOWN TO FIRE, AND IT NEVER HAS BEEN.
    IDEA-20260807-98a970 states the governing rule - a measurement instrument
    never shown to fire cannot certify a negative - and lists a toy BN-shaped
    curve with k equal to 12 as a MANDATORY BLOCKING planted positive. That
    record was filed on 2026-08-07 and, per the greps recorded below, no
    implementation, no run and no re-verified k value for any named curve exists
    in this repository. THIS IS ORTHOGONAL TO THE MIRROR - a published table
    cannot fire an instrument, and every SAFE verdict this program's
    multiplicative lane will ever emit still rests on code that has never
    produced a positive. This record supplies the positive TWICE - as an exact k
    equal to 12 on a real 254-bit curve, and as an actual SOLVED discrete
    logarithm transferred through a pairing at toy scale, with a discrete_log
    certificate re-verified by independent recomputation.

    (C5) WHAT IS NOT CLAIMED, STATED FIRST RATHER THAN LAST. No discrete
    logarithm is solved on BN(2,254) and none can be here. The transfer lands in
    F_p^12, a field of about 3048 bits, and the index calculus that makes the
    transfer an ATTACK rather than a mere homomorphism is far outside this
    environment. So this record demonstrates the transfer's CORRECTNESS at toy
    scale and its APPLICABILITY at full scale, and delegates the SPEEDUP to a
    stated cost model whose headline literature figure is relayed from a search
    engine summary and is explicitly not verified here. A record that reported
    the transferred cost as measured would be fabricating.

  mechanism: >-
    OBJECT-FIRST GENERATION, per docs/inventor-protocol.md sections 1 and 2. This
    program has no written object enumeration for the ECDLP - that is
    KN-OPEN-019 - so what follows is a sketch and is labelled as one, not a
    taxonomy.

    ESTABLISHED FAMILIES FOR A PAIRING-FRIENDLY CURVE, NAMED AND DECLARED
    OFF-LIMITS AS THE PRIMARY LENS - (F1) the point itself, walked by rho;
    (F2) the pairing image in mu_n inside F_p^k, which is MOV and Frey-Ruck;
    (F3) Weil-descent and cover objects; (F4) summation-polynomial /
    index-calculus objects over a factor base. F2 is the family this row exists
    to illustrate and it is used here as a VALIDATED SUBROUTINE, not as the
    tracked object.

    CANDIDATE OBJECTS ENUMERATED AND SCORED ON THE THREE AXES.
    (O1) THE FAMILY PARAMETER u. Genuinely new as a tracked object in this
    program - nothing in the corpus tracks a curve's polynomial-family parameter,
    and the SafeCurves mirror does not publish u for any row, so this is a
    quantity the source itself does not carry. Concretely testable - its one-step
    propagation is exactly the polynomial map u to (p, n, t) and is measured by
    exact integer equality, now against TWO references, the intake modulus and
    the mirror's trace. Survives until the curve leaves the BN family, at which
    point the object does not degrade, it ceases to exist - the sharpest possible
    survival boundary and therefore the sharpest possible negative control.
    CHOSEN.
    (O2) The multiplicative order ord_n(p). Already IDEA-20260807-98a970's
    object; reused as a downstream consumer of O1, not re-minted.
    (O3) The pairing image. Family F2, off-limits as primary lens.
    (O4) The sextic-twist tower over F_p^2. Concretely testable but requires
    extension-field machinery this environment does not have; recorded as an open
    direction, not proposed.

    LOSSY-PROJECTION TEST ON O1, applied before any experiment, costing no
    compute.
    WHAT IS DISCARDED - a 254-bit modulus collapses to a roughly 62-bit integer,
    and with it the curve coefficient b equal to 2, the base point, the field
    representation and the model. Roughly 192 bits are destroyed.
    IS IT A CHANGE OF COORDINATES? NO. The fibre of the map u to p is a single
    point in the forward direction but the object being projected is the whole
    curve tuple, and NOTHING about b, about the base point, or about the choice
    among the six sextic twists is recoverable from u. Two different BN curves
    over the SAME p - and there are six, by sextic twisting - have the SAME u.
    That is a genuine, exhibitable, non-trivial fibre and it is the direct
    contrast with the (Delta, Pi) example of KN-LIT-7595, from which the
    unordered pair is fully recoverable.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS? Three operations, three
    answers. (i) SEXTIC TWISTING - u is INVARIANT while the order changes, so the
    projection propagates deterministically and the discarded twist choice is
    exactly what the object cannot see; this is disclosed, and it is why C2 must
    verify [n]G equal to the identity ON THE INTAKE CURVE rather than assume the
    twist. (ii) F_p-ISOGENY - p, n and t are isogeny-class invariants, so u is
    constant along the class. (iii) MODEL CHANGE - u depends only on p, so it is
    model-independent. PASSES, with the twist-blindness stated as its measured
    limitation rather than glossed.
    WHERE THE STRUCTURE DISSOLVES - at the first curve not of BN shape. For a
    random 254-bit prime there is no u at all, and that is the null control.

    WHAT THE MIRROR CHANGES AND WHAT IT DOES NOT. The SafeCurves mirror supplies
    the trace, the embedding degree, the CM discriminant, the cofactor, the twist
    cofactor and the twist subgroup order for this row, so nothing here is
    motivated by those quantities being unavailable. What the mirror does NOT
    supply is (a) any witness this program can independently re-verify, (b) any
    firing of this program's own instruments, (c) the parameter u, which appears
    nowhere in it, and (d) any protection against a transcription defect in
    either direction, which is exactly what an independent derivation detects.
    The record's value therefore moves from ACCESS to VERIFICATION, and that is a
    smaller claim honestly stated, not a larger one.
    READING DISCIPLINE, BINDING. The mirror carries a documented defect,
    MIRROR-DEF-1 in source_record_addendum_01.yaml - the pages/*.txt renderings
    are produced by stripping tags, which COLLAPSES EMPTY TABLE CELLS and blurs
    row boundaries, so a comment belonging to one row can appear attached to
    another. The recorded authority order is pages/*.html and specs/* FIRST,
    tables/*.tsv NEXT, pages/*.txt LAST and prose only. Every mirror value in
    this record was read from tables/*.tsv; any value that becomes load-bearing
    for a claim must be re-read from pages/*.html before the claim is filed, and
    NO value in this record may be sourced from a .txt rendering.

    WHY THIS IS NOT IDEA-20260807-98a970 AND NOT IDEA-20260829-f89a3a. Against
    98a970 - that record's object is ord_n(p), its inputs are TRANSCRIBED from
    primary standards documents, its exact certificate route requires factoring
    N-1, and its expected finding is that every audited curve is SAFE. This
    record DERIVES n from the modulus, certifies k exactly without any
    factorisation, and delivers the AFFECTED row that 98a970 predicts must exist
    and never produced. Per the question record's nonduplication rule this
    SPECIALIZES 98a970's lane and does not re-mint its mechanism. Against
    IDEA-20260829-f89a3a - that record fires the ADDITIVE transfer on the
    trace-one row and explicitly names the multiplicative transfer on BN(2,254)
    as the obvious successor it does NOT attempt. This is that successor, and it
    differs in more than the curve - f89a3a's object is the formal-group
    logarithm coordinate, its solve is at full cryptographic size, and its
    exponent claim is unconditional; here the object is the family parameter, the
    solve is at toy size only, and the full-size claim is applicability rather
    than a solve.

    EXECUTION, FIVE STAGES, SMALLEST FIRST, EACH WITH A DISTINCT FALSIFIER. See
    minimal_test for the design; the ladder follows docs/inventor-protocol.md
    section 6, and the record states plainly that rung 2 of that ladder - a
    measured ratio against the baseline - is reached only in the OPTIONAL stage
    and is not claimed by the minimal test.

