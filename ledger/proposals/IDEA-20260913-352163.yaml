idea:
  id: IDEA-20260913-352163
  title: >-
    Nagao's polynomial-time ECDLP claim rests entirely on one proposition whose
    proof he omits -- that the first-fall-degree bound d_F <= 4 is invariant under
    the affine coset shift -- and affine invariance of a degree bound is decidable
    on matched (v = 0, v != 0) pairs by degree-4 Macaulay rank alone, without a
    Groebner engine.
  class: falsification_of_published_claim
  claim: >-
    Proposition 5 of Nagao ePrint 2015/984 asserts that the Weil-descended
    chained-S_3 system built over DISJOINT COSETS V + v_i (his EQS4) has the same
    first-fall-degree bound as the one built over the linear subspace V (his EQS2):
    <= 4 at p = 2, <= 3p+1 at p >= 3. It is stated with the proof omitted --
    footnote 6, verbatim, "The situation is the same as the Semaev's case. So, we
    omit the proof." Theorem 1's O(n^{8w+1}) polynomial-time conclusion follows from
    that proposition and nothing else load-bearing.

    The claim of this proposal is that the assertion is TESTABLE NOW, at the scale
    this program can already reach, and that it is the highest-value single question
    in the Semaev/Nagao area: the shift from x = sum_j x_j alpha_j to
    x = v_i + sum_j x_j alpha_j is an affine change of variables, first-fall degree
    is not in general invariant under one, and Nagao's own footnote 1 concedes the
    shift enters the descent definition ("the values v_1, ..., v_N must be needed").
    Either the bound is invariant on matched pairs, which is the first positive
    evidence anyone has offered for Proposition 5 and makes the coset route the
    ranked successor lane; or it is not, which localises the defect in a published
    polynomial-time claim against ECDLP to a named proposition and yields the
    measured obstruction the mechanism lane needs.
  mechanism: >-
    THE OBJECT. Fix p = 2, small n, and m = t. Build two Boolean systems that differ
    in exactly one respect.

      EQS2(m, R): S_3(X_1, X_2, U_1) = 0, S_3(U_1, X_3, U_2) = 0, ...,
                  S_3(U_{m-2}, X_m, x(R)) = 0, with X_i = sum_{j<=k} X_ij alpha_j,
                  i.e. every X_i ranging over the SAME k-dimensional F_2-subspace V.
      EQS4(m, R): the same m-1 equations, with X_i = v_i + sum_{j<=k} X_ij alpha_j,
                  i.e. X_i ranging over the coset V + v_i, the v_i chosen so the m
                  cosets are disjoint.

    Weil-descend both to F_2 (Nagao Definitions 3, 4 and 8), adjoin the field
    equations X^2 - X, and compute the first fall degree of each. The systems have
    IDENTICAL SHAPE -- same equation count n(m-1), same variable count n(m-1), same
    monomial support, same everything except the m constants v_i. Proposition 5 says
    they have the same bound. That is a matched-pair prediction of exactly the kind
    this program tests.

    WHY IT NEEDS NO GROEBNER ENGINE. First fall degree is a statement about degree
    falls in the ideal's low-degree strata, and at a degree bound of 4 it is read off
    the rank of a Macaulay matrix: assemble all products (monomial of degree <= 4 -
    deg f) * f for f in the system, reduce modulo the field equations, and look for a
    combination of degree-4 products whose sum has degree < 4 and is nonzero. That is
    a GF(2) rank computation, and DEC-20260913-47bbb7 established -- from the exact
    combinatorial sizing under BATCH-9d649f -- that these blocks fit in the declared
    memory and XOR budgets at the reachable cells. So this proposal is NOT blocked by
    IMP-SEMBIN-ENGINE as narrowed; it needs the pure-Python Weil descent that
    TASK-20260913-701b50 is already approved to build.

    WHICH DEGREE, EXACTLY. Nagao Definitions 5 and 6 are DIFFERENT quantities: the
    true first fall degree d_F, and a "Fake first fall degree" d'_F taken modulo the
    field equations, with Lemma 4 giving d_F <= d'_F. This program has never drawn
    that distinction -- GOAL-DREG-001 measures "a" first-fall-degree quantity and
    GOAL-SEMBIN-5078bc cites Semaev's Assumption 1 without saying which. Every
    measurement here reports d'_F (computable by the Macaulay construction above) and
    states that it is the fake one and hence an upper bound on d_F. A reported degree
    that does not say which quantity it is has not measured anything.

    THE MECHANISM BY WHICH THE SHIFT COULD BREAK THE BOUND. Semaev's degree-4 fall at
    p = 2 comes from considering x*u*S_3(x, u, R_X): the fall is produced by a
    specific low-degree syzygy of the descended S_3 block, and it exists because the
    descent of a product of subspace-valued variables has a controlled degree
    profile. Under the coset shift each X_i carries a constant, so the descended
    polynomial acquires all the lower-order terms the linear case does not have. The
    syzygy that produced the fall is a statement about the top-degree part; the shift
    does not change the top-degree part, which is why Nagao could reasonably believe
    the situation is the same. What it changes is which lower-degree combinations are
    available, and that is what determines whether the fall is still the FIRST one.
    So the honest prior is that the bound probably survives and the interesting
    outcome is either an n at which it demonstrably does not, or an exact statement of
    why it must.
  question_id: RQ-SEMBIN-9e8f82
  question_ids: [RQ-SEMBIN-9e8f82, RQ-SEMBIN-9fa4ba]
  goal_ids: [GOAL-SEMBIN-5078bc]
  goal_applicability:
    - >-
      GOAL-SEMBIN-5078bc mechanism lane. This is the successor to the lane closed
      by KN-FIND-9643e7: chain length t is not a free cost parameter under Semaev's
      eq. (11) yield law, and Nagao changes the yield law, which is the only thing
      that could have made it free.
  status: proposed
  proposed_by: coordinator
  recorded_at: '2026-09-13'
  task_id: null
  batch_id: BATCH-SEMBIN-20260913-9d649f
  area_tags: [SEMBIN, DREG, ECDLP2M]
  novelty_status: known
  novelty_screen:
    what_is_not_new: >-
      THE CONSTRUCTION IS NOT NEW AND THIS PROGRAM SHOULD STOP TREATING IT AS SUCH.
      Applying disjoint/coset factor bases to Semaev's chained S_3 system, and doing
      so specifically to remove the 1/m! decomposition-yield factor, is Nagao 2015/984
      Section 7 in full. Its opening sentence goes further and credits the disjoint
      factor base to the author's own ePrint 2013/548, saying Galbraith-Gebregiyorgis
      2014/806 "recently re-discovered" it. This program's own mechanism-lane
      hypothesis, built on 2014/806, is therefore a rediscovery of a rediscovery, and
      any novelty language in that lane has to be restated against this record.
    what_is_new: >-
      The TEST is new, and so is the observation that Proposition 5 is unproven. No
      evidence for or against affine invariance of the bound exists in the corpus:
      Nagao asserts it and omits the proof; Semaev 2015/310 never considers a shifted
      factor base; KN-LIT-e77232's dispute is about memory and about Kosters reaching
      degree 5 at n = 45, not about invariance; and GOAL-DREG-001 measures the
      unshifted system only. A matched-pair degree measurement across the shift has
      not been done here or, so far as this program's corpus records, anywhere.
    searched: >-
      grep across knowledge/, ledger/, inputs/ and docs/ for nagao (318 files, all
      but five of them the Mestre-Nagao rank heuristic in GOAL-ECQ-*, an unrelated
      Nagao result); knowledge/literature/KN-LIT-456 (title-only, superseded by
      KN-LIT-71b758); the frozen Semaev text and its tables. The kb MCP index is not
      populated in this worktree, so absence of a retrieval hit is not evidence here
      and is not offered as such.
  citations:
    - source: >-
        inputs/NAGAO-2015-984/paper_fulltext.md -- Proposition 5 and footnote 6 (the
        omitted proof); Definitions 3, 4, 7, 8 (the descent, with and without v);
        Definitions 5 and 6 (true versus fake first fall degree); Lemma 4 (d_F <=
        d'_F); Section 7 (disjoint factor base and the priority sentence); Theorem 1
      provenance: retrieved
      verified_by: >-
        coordinator this session -- fetched from eprint.iacr.org, frozen at
        inputs/NAGAO-2015-984/ with a sha256-pinned retrieval receipt, and read in
        full
    - source: >-
        inputs/SEMAEV-2015-310/paper_fulltext.md -- the chained S_3 system (eq. 5),
        Assumption 1, and Section 4.4's statement that d_F4 generally exceeds 4 once
        k > ceil(n/m)
      provenance: internal
      verified_by: >-
        validator TASK-20260913-da3982 and red team TASK-20260913-cf9d98, which read
        the frozen text for REVIEW-SEMBIN-20260913-9d649f
    - source: KN-LIT-e77232 -- Kosters reaching degree 5 at n = 45
      provenance: internal
      verified_by: coordinator, DEC-20260913-74e208
  unread_pointers:
    note: >-
      NOT CITATIONS, AND DELIBERATELY NOT IN THE CITATIONS BLOCK. Each is named only
      because Nagao 2015/984 cites it; no agent in this program has opened any of them.
      Under AGENTS.md rule 9 a recalled reference is a pointer telling a reviewer where
      to look and never support, and this record's novelty_status rests solely on the
      Nagao text that WAS read. Listing them here rather than as `recalled` citations
      keeps the warning visible while stating plainly that nothing here bears weight.
      Reading any of them is a task, and it is ranked in RQ-SEMBIN-9e8f82.
    pointers:
      - >-
        Nagao, ePrint 2013/548 -- cited by 2015/984 as [10] and credited there with the
        disjoint factor base. THE PRIORITY QUESTION between it and
        Galbraith-Gebregiyorgis 2014/806 is NOT settled by 2015/984 asserting it, and
        this record does not treat it as settled.
      - >-
        Nagao, ePrint 2013/549 -- cited as [11], and the source of Lemma 3 (whose proof
        2015/984 declines to give: "Proof of this Lemma is complicated and not
        constructive") and Lemma 5. Lemma 3 is what licenses using the fake first fall
        degree in place of the true one, so the instrument this proposal builds rests on
        a lemma proved in an unread paper. That is a disclosed limitation, not a
        blocker: Lemma 4's inequality d_F <= d'_F is the only direction needed, and it
        is derived in the text that was read.
      - >-
        Galbraith and Gebregiyorgis, ePrint 2014/806 -- cited as [5]. This program's
        mechanism-lane hypothesis was built on it, and it is not frozen here either.
  assumptions:
    - >-
      A degree-4 Macaulay rank over GF(2) on the descended system is a faithful
      instrument for the FAKE first fall degree d'_F. It bounds the true d_F from
      above by Nagao Lemma 4 and does not measure it directly.
    - >-
      The m coset representatives v_i can be chosen so V + v_i are pairwise disjoint
      at the tested (n, k, m). At k m ~ n this is a counting condition, and Nagao's
      own note that "if one takes k = 1, it sometimes happens #Fb_i = empty" warns
      that suitable representatives are a real constraint rather than free.
    - >-
      An invariance observed at reachable n transfers to cryptographic n only under a
      stated assumption, and this proposal makes none. A degree bound holding at
      n <= 24 is evidence about n <= 24.
  predictions:
    - >-
      P1. On matched pairs at equal (n, m, k), d'_F(EQS4) = d'_F(EQS2) for the
      overwhelming majority of cells, because the shift does not change the
      top-degree part that produces Semaev's fall. Recorded as the honest prior, not
      as the hoped-for result.
    - >-
      P2. If P1 fails anywhere, it fails by d'_F(EQS4) > d'_F(EQS2) rather than <,
      because the shift adds lower-order terms and cannot remove the syzygy that
      already exists in the unshifted case. A cell with d'_F(EQS4) < d'_F(EQS2) is
      more likely an implementation defect than a mathematical fact and must be
      treated as one until a second implementation agrees.
    - >-
      P3. The choice of coset representatives does NOT move d'_F: two different
      disjoint families {v_i} at the same (n, m, k) give the same degree. If they do
      not, then Proposition 5 is not merely unproven but false as stated, since it
      quantifies over no particular choice.
    - >-
      P4. Independently of the shift, d'_F exceeds 4 at some reachable n even for
      EQS2 -- Semaev Section 4.4 and Kosters at n = 45 both point this way. If so,
      the matched-pair comparison is still valid and still answers the invariance
      question; only the absolute value 4 is refuted, and that refutation belongs to
      Semaev's Assumption 1 rather than to Nagao's Proposition 5.
  minimal_test:
    what: >-
      Three cells, matched pairs, p = 2: (n, m, k) with m = t and k m ~ n at the
      largest n a pure-Python degree-4 GF(2) Macaulay rank reaches. For each, build
      EQS2 and EQS4 from the same seed and the same monomial order, compute d'_F for
      both, and report the pair.
    controls:
      - >-
        NULL OBJECT: the SAME system with v_i chosen NON-disjoint (all v_i equal, so
        EQS4 degenerates to EQS2 up to a global shift). Its degree must match EQS2's
        exactly. A discrepancy there is an implementation defect and invalidates the
        cell rather than reporting a finding.
      - >-
        A second disjoint family {v_i'} at the same (n, m, k), to test P3.
      - >-
        A random-system control of the same shape and support, whose first fall degree
        should NOT be 4, to confirm the instrument can distinguish a structured system
        from an unstructured one of identical size. Without this a measurement of 4 is
        uninterpretable.
    stopping: >-
      The largest n at which a cell completes inside the declared memory budget. An n
      not reached is a recorded scope limit and is never reported as a degree.
  falsification_conditions:
    - >-
      A single matched pair with d'_F(EQS4) > d'_F(EQS2), reproduced by a second
      independent implementation and surviving the non-disjoint null, falsifies
      Proposition 5 as stated at that cell and scopes the failure to it.
    - >-
      Two disjoint representative families giving different d'_F at one cell
      falsifies Proposition 5 as an unquantified statement, independently of any
      comparison with EQS2.
    - >-
      Invariance holding at every reachable cell falsifies NOTHING about Nagao and
      must not be reported as support for Theorem 1: the cells are at n <= 24 and the
      claim is asymptotic. It supports only the narrower statement that no
      counterexample exists in the tested window.
  confounders:
    - >-
      MONOMIAL ORDER. The Macaulay construction's rank is order-independent but the
      degree at which a fall is DETECTED can depend on how the block is assembled.
      Both members of a pair must use the same assembly, and the assembly must be
      recorded.
    - >-
      THE FIELD EQUATIONS. d'_F is defined modulo them; a build that reduces at a
      different point in the pipeline measures a different quantity. Nagao's Example 1
      (X, Y, Z over F_2) is a three-variable worked case and must be reproduced
      exactly as a regression fixture before any cell is trusted.
    - >-
      COSET REPRESENTATIVES THAT ARE NOT ACTUALLY DISJOINT. Disjointness must be
      checked, not assumed, and a family that fails the check invalidates its cells.
    - >-
      SMALL-n DEGENERACY. At small n the number of degree-4 monomials is comparable to
      the number of equations, so falls can appear for counting reasons rather than
      structural ones. The random-system control is what separates these.
  interpretation_limits:
    - >-
      Measures d'_F (fake), reports it as such, and bounds d_F only from above.
    - >-
      Says nothing about Theorem 1's truth. Proposition 5 is necessary for Theorem 1,
      not sufficient: Theorem 1 additionally needs Assumption 1 to hold at N ~ n^2
      variables, and this proposal does not test that.
    - >-
      Says nothing about any curve's security at any outcome.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For p = 2 and all sufficiently large n, and for every family of pairwise
        disjoint cosets {V + v_i} with dim V = k and k m ~ n, the fake first fall
        degree of EQS4(m, R) equals that of EQS2(m, R). (This is Nagao Proposition 5
        stated with its quantifiers made explicit, which the source does not do.)
      random_model_justification: >-
        The shift is an affine change of variables that fixes the top-degree part of
        each descended equation. If the degree-4 fall is generated by a syzygy of the
        top-degree part alone, it is shift-invariant; the lower-order terms the shift
        introduces can only create additional falls at degree <= 4, not destroy the
        existing one. That argument is why the proposition is plausible; it is NOT a
        proof, because "generated by a syzygy of the top-degree part alone" is exactly
        what is unverified.
      supporting_results: []
      supporting_results_note: >-
        DELIBERATELY EMPTY. Nagao offers no proof, Semaev never considers the shifted
        system, and no measurement exists. Filling this list is the point of the
        experiment; a citation here before then would be the fabrication core rule 9
        forbids.
      validation_experiment_ids: [EXP-SEMBIN-db9bc3]
      falsification_condition: >-
        One reproduced matched pair with unequal d'_F, or two disjoint families with
        unequal d'_F at one cell.
  proof_search_map:
    bottleneck: >-
      Proposition 5 of Nagao 2015/984. Every step of Theorem 1 other than this one is
      arithmetic on quantities the paper defines: given d_F(EQS4) <= 4, Lemma 2's
      O(N^{d_F w}) charge, Section 7's #Fb = O(n), and the O(1) yield compose
      mechanically into O(n^{8w+1}). Remove Proposition 5 and the theorem has no
      support at all; establish it and the theorem's remaining exposure is Assumption 1
      itself.
    baseline_embedding:
      parameter_slice: >-
        v_1 = ... = v_m = 0. At that slice EQS4 IS EQS2 by construction, so the
        unshifted Semaev system is an exact boundary case of the shifted one rather
        than a different object, and Semaev's own d_F <= 4 (his Section 4.5, Nagao's
        Proposition 2) is the value the shifted computation must return there.
      reproduction_check: >-
        Two frozen regression fixtures before any cell is reported: (i) Nagao's
        Example 1 -- F = (X^2+X)(Y^2+Y) + (X^2+X)(Y^2+Z) over F_2[X,Y,Z], which the
        paper works out to deg F = 3 and rewrites as a sum of field-equation multiples
        -- reproduced exactly; (ii) the v = 0 slice returning the same degree as an
        independently built EQS2 at the same (n, m, k). A build that fails either does
        not proceed.
    observation_collision:
      observable: >-
        d'_F, the fake first fall degree of the descended system modulo the field
        equations -- the degree at which the Macaulay block first admits a nonzero
        combination of top-degree products whose sum drops below the bound.
      distinct_preimage_search: >-
        Search for two systems with the SAME d'_F that differ in what Theorem 1
        needs: a shifted system and an unshifted one at equal (n, m, k) collide on
        d'_F by hypothesis, and the search is for a pair that collides on d'_F while
        differing in the number of degree-4 falls or in the dimension of the fall
        space. Such a pair would show d'_F is too coarse an observable to carry
        Proposition 5's weight even where the proposition is true -- because Lemma 2
        charges N^{d_F w} on the degree alone, and two systems with equal degree but
        different fall structure do not have equal solving cost.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The matched pair itself: a family of (EQS2, EQS4) instances at equal
          (n, m, k) differing only in the m constants, with the non-disjoint
          degeneration as an interior boundary of the family.
        predicted_gain: >-
          Converts an unproven quantified proposition into a finite set of decidable
          rank computations, each of which can falsify it and none of which can prove
          it.
      - transform: stronger_invariant
        proposed_object: >-
          The DIMENSION of the degree-4 fall space, not merely the degree at which the
          first fall occurs. It refines d'_F, is computed by the same rank, and would
          distinguish the colliding pairs the observation-collision search looks for.
        predicted_gain: >-
          If the dimension differs across the shift while the degree does not,
          Proposition 5 is true and Theorem 1 still loses its cost model, which is a
          strictly more informative outcome than either verdict on the degree alone.
    quantifier_order: >-
      Nagao states Proposition 5 with no quantifiers at all. Made explicit, the
      version Theorem 1 needs is: FOR ALL sufficiently large n, FOR ALL m, k with
      k m ~ n, FOR ALL pairwise-disjoint coset families {v_i}, THERE EXISTS a
      degree-<= 4 fall. The order matters and is the crux: the ORDER Nagao's omitted
      proof would most naturally establish is the weaker "for all n, THERE EXISTS a
      family {v_i} with a fall", since a proof by analogy with the unshifted case
      inherits whatever choice makes the analogy work. Theorem 1 needs the strong
      form, because the algorithm does not get to choose cosets that make the algebra
      convenient -- it needs cosets that partition the factor base. P3 is exactly the
      test that separates the two orders.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At every (n, m, k) tested, with n <= the reached bound, the fake first fall
        degrees of the shifted and unshifted descended systems are equal, and two
        distinct disjoint coset families give the same value." That is the ceiling: a
        finite window, one characteristic, one degree bound, an upper-bound proxy for
        the true degree. It does not reach Proposition 5, cannot reach Theorem 1, and
        asserts nothing about any curve.
      nearby_object_control: >-
        The p = 3 and p = 5 cases, where Nagao's Proposition 2 predicts a DIFFERENT
        bound, 3p+1 rather than 4. Running the identical pipeline at odd
        characteristic must return 10 and 16 rather than 4. This is the control that
        separates "the instrument measures first fall degree" from "the instrument
        returns 4"; a pipeline that reports 4 at p = 3 has measured its own bound and
        every characteristic-2 cell it produced is void.
    proof_obligations:
      - claim: The v = 0 slice reproduces Semaev's unshifted system exactly.
        responsibility: baseline
      - claim: The tested coset families are genuinely pairwise disjoint.
        responsibility: feasibility
      - claim: >-
          The measured quantity is Nagao Definition 6's fake first fall degree and
          bounds Definition 5's true one from above.
        responsibility: correctness
      - claim: >-
          A degree-4 Macaulay block at the tested cells fits the declared memory and
          time budget, and an unreached cell is reported as unreached.
        responsibility: memory
      - claim: >-
          The instrument distinguishes a structured system from a random one of equal
          shape, and returns 3p+1 rather than 4 at odd characteristic.
        responsibility: strictness
      - claim: >-
          Every conclusion is scoped to the tested n, m, k, characteristic and degree
          bound, with no transfer to cryptographic scale.
        responsibility: scope
    not_applicable_reason: null
  target_complexity:
    problem: ECDLP over F_{2^n}
    prior_best: >-
      2^{1.6986 sqrt(n ln n)} heuristic (Semaev 2015/310 Section 4.5.2), against
      0.886 * 2^{n/2} for van Oorschot-Wiener parallel rho
    this_proposal_claims: >-
      NOTHING about the exponent. This proposal audits someone else's exponent claim.
      Its own output is a degree measurement on a finite window.
    claim_kind: audit
  dominated_by:
    checked: true
    result: null
    basis: >-
      There is no competing method to be dominated BY, because this is not a method:
      it is a matched-pair measurement answering an open question about a published
      proposition, and no other route to that answer exists in this program. The
      Pareto question that DOES apply is to the coset construction Nagao proposes, and
      that is IDEA-20260913-41c4f0's subject, where the frontier rows (vOW rho at
      0.886*2^{n/2}, Semaev's 2^{1.6986 sqrt(n ln n)}, and the memory-charged
      variants of both from COST-SEMBIN-8d123b as superseded by CORR-20260913-53739b)
      are enumerated and checked.
  sota_delta:
    quantity: >-
      Evidence for or against Proposition 5 of Nagao 2015/984, measured in matched
      pairs at reachable n.
    current_value: >-
      Zero. The proposition is asserted with its proof omitted, and no measurement of
      it exists in this program's corpus or, so far as the corpus records, elsewhere.
    delta_if_successful: >-
      From zero to a finite window of matched pairs, plus a p >= 3 nearby-object
      control that Nagao's own Proposition 2 predicts differently. Quantitatively:
      the first datum either way.
  recommended_priority: high
  estimated_cost:
    wall_clock_seconds: null
    memory_gb: 2
    note: >-
      Advisory and unbudgeted per the standing research-budget instruction. The
      binding constraint is not time but the largest n at which a degree-4 GF(2)
      Macaulay block fits in 2 GB, which the sizing under BATCH-9d649f already
      characterises.
  dependencies:
    - >-
      TASK-20260913-701b50, the pure-Python Weil descent approved by
      DEC-20260913-47bbb7. This proposal is the first consumer of it and should be
      designed now and dispatched when that lands, rather than the reverse.
  authorized_runs: 0
  inference:
    policy: research-deep
    reasoning_effort: null
