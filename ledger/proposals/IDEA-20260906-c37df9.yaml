    "claim": "A target-blind mixture of fixed-weight carry transducers may flatten the lower tail of the number R(x) of useful additive representations over W(m,w), improving low-memory collision success beyond the same mixture's mean-only prediction. R1 integer digit representation changes representation acquisition, not generic group arithmetic.",
    "mechanism": "Representation: a digit transducer state (carry, remaining weights, run-type counters) for x=a+b, paired with Sigma={append a digit pair, conditioned weight update}. Partial-action: all prefixes with the same transducer state have the same continuation-count recurrence, while exponentially many digit histories are discarded. F1/F2 are downstream collision components. The transducer never receives the unknown target digits.\n\nEsser–May already exploit carries; the new uncertainty is their IID replacement of fixed-weight digit dependence and the subsequent uniformity assumption over weight-w outputs. Count R_s(x) exactly for each frozen source stratum s using weighted transfer matrices, with output x used only by an offline analyst at toy size. Choose mixture weights lambda_s independent of x to maximize min_{x in W} sum_s lambda_s R_s(x)/C_s, where C_s includes source sampling and generation. For attack deployment the solver samples s and its two summands using only public m,w and hash output. The necessary gain is in the worst-target or declared lower-quantile representation rate, not in the average sum weight. A compact run-type description is useful only if the number of strata and unranking time stay polynomial.",
