idea:
  id: IDEA-20260802-006
  question_id: RQ-ECDLP-002
  title: >-
    The scalar index set as a tracked object - does multiplicative structure in the
    INDEX survive the map k -> x(kP), or is square-root cancellation the whole story
  class: mechanism
  claim: >-
    THE TRACKED OBJECT IS THE INDEX SET, NOT THE POINT. For n prime and K a subset of
    (Z/n)*, define pi(K) = the multiset {x(kP) : k in K} and the normalized additive-
    character bias Bias(K) = max over a in F_p* of |sum_{k in K} e_p(a * x(kP))| / |K|.
    CLAIM - at toy sizes, and for K a coset of the multiplicative subgroup H of (Z/n)*
    of order r, Bias(cH) does NOT exceed the matched unstructured null Bias(K_rand) - a
    uniformly random subset of (Z/n)* of the same cardinality r - by more than a factor
    1.5, at every r >= 64 tested, and BOTH decay as r**(-1/2) to within 15 percent
    across a sweep of r spanning at least three doublings. That is the closure branch and
    it says the multiplicative structure of the index set induces no exploitable additive
    bias in the x-coordinate at these sizes, consistent with square-root cancellation.
    FALSIFIED IF Bias(cH) / Bias(K_rand) >= 2 at any r >= 64 AND that ratio grows with r
    or with p across the sweep, in which case an excess bias epsilon is a distinguisher
    at cost epsilon**(-2) and the object is a live family requiring independent review.
    EQUALLY FALSIFIED AS AN APPARATUS if Bias(K_rand) fails to decay as r**(-1/2) - a
    bias that does not shrink when the averaging set grows is the canonical artifact
    signature and voids every reading.
  mechanism: >-
    LOSSY-PROJECTION TEST, APPLIED BEFORE ANY EXPERIMENT AND AT ZERO COMPUTE COST. The
    projection pi sends the labelled family (k, x(kP))_{k in K} to the unlabelled
    multiset {x(kP)}. It DISCARDS the labelling entirely - log2(|K|!) bits - so it is
    genuinely lossy and is not a change of coordinates. It PROPAGATES COMPATIBLY WITH THE
    OPERATION THE TARGET ACTUALLY EXPOSES - the scalar action k -> t*k carries K to tK
    and hence pi(K) to pi(tK) deterministically, and if K is a coset cH of a multiplicative
    subgroup then tK = (tc)H is a coset of the SAME subgroup, so the structure being
    tracked is preserved by the action rather than destroyed by it. That is exactly the
    property the inventor protocol demands and it is exactly what the (Delta, Pi) failure
    lacked - here something real is thrown away and what remains still moves.
    WHY THE OBJECT IS NOT A REPACKAGING OF THE ESTABLISHED FAMILIES. The index-calculus
    family tracks structure in the COORDINATE (a box in x, a factor base); this object
    tracks structure in the INDEX (a multiplicative subgroup of Z/n). IDEA-20260727-006
    is the corpus's coordinate-box analysis - it computes the Weil/Deligne certification
    threshold beta_cert(m) = (m+1)/(2m) for counting summation solutions inside a
    coordinate box - and it is ADJACENT TECHNOLOGY ON A DIFFERENT OBJECT. The rho family
    tracks a walk; this object has no walk. The endomorphism family tracks an orbit under
    a group action on POINTS; this tracks a set in the INDEX group, and the two coincide
    only in the degenerate case where H is generated by an eigenvalue lambda of an
    endomorphism - which is a distinguished special case the design includes deliberately
    as a bridge to IDEA-20260802-005.
    WHY A BIAS WOULD MATTER, STATED HONESTLY AND WITHOUT OVERREACH. A measured excess
    bias epsilon over a structured index set gives a DISTINGUISHER at cost about
    epsilon**(-2). Converting a distinguisher into a discrete-logarithm SOLVER requires a
    self-reducibility or search-to-decision argument that THIS RECORD DOES NOT SUPPLY AND
    MUST NOT PRETEND TO. The honest position is that a structured-versus-unstructured
    excess growing in r would be the first non-generic prime-field signal this program has
    produced and would justify a follow-on whose job is to build the solver; no exponent
    is claimed on the strength of a bias.
    THE MEASUREMENT DISCRIMINATES THREE EXPLANATIONS.
    (a) STRUCTURED MATCHES UNSTRUCTURED, BOTH DECAYING AS r**(-1/2) - closure over this
    object at the tested sizes, with the named obstruction being square-root cancellation
    for exponential sums on the curve, and forward guidance naming what remains open.
    (b) STRUCTURED EXCEEDS UNSTRUCTURED AND THE EXCESS GROWS - the object is live.
    (c) NEITHER DECAYS - the meter is broken and nothing is read.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-02'
    corpus_paths_grepped:
    - ledger/proposals
    - ledger/evidence
    - knowledge/techniques
    - knowledge/open-problems
    grep_results:
    - >-
      IDEA-20260727-006 is the densest adjacent record - it uses Weil-Deligne bounds and
      additive-character completion, but on the COORDINATE BOX inside the summation
      variety. Its novelty screen also records 228 corpus occurrences of
      'sum-product|Heath-Brown|Shkredov|Konyagin|additive energy|multiplicative subgroup'
      across 75 files in an external report corpus, which means the multiplicative-
      subgroup direction has been TOUCHED somewhere in this program's history and this
      record must not claim virgin ground. Those files are not in this repository and
      could not be read here.
    - >-
      No ledger proposal defines a bias statistic over a scalar index set, and no
      hypothesis in ledger/hypotheses concerns index-set structure.
    - >-
      CITATION CORRECTION MADE BEFORE FILING. An earlier draft of this record cited
      EV-STR-001 directly for an arithmetic-progression yield penalty. GREPPED AND
      CORRECTED - the id EV-STR-001 appears in ledger/goals/GOAL-ECDLP-001.yaml, in the
      EXP-STR-004 specifications, in a BATCH-014 task report and review, and in
      tools/legacy_ledger_inventory.yaml, but THERE IS NO FILE
      ledger/evidence/EV-STR-001.yaml in this tree. The numeric figures quoted below are
      taken from the PROSE OF IDEA-20260727-006 and are attributed to that record, not
      re-verified against any evidence file, and are labelled UNVERIFIED IN THIS SESSION.
    literature_verified: []
    conclusion: >-
      `unverified`, and deliberately so. Exponential sums over elliptic curves with the
      index restricted to a multiplicative subgroup of (Z/n)* is a studied topic in
      analytic number theory (the Kohel-Shparlinski line and the wider Shparlinski school
      are the attribution this record would expect, ATTRIBUTED FROM MEMORY AND NOT
      VERIFIED IN THIS SESSION), and the literature deep-read is a PRECONDITION of
      running anything. If a square-root bound covering exactly this sum already exists,
      branch (a) is a THEOREM and the experiment reduces to a confirmation with a much
      lower priority - which would be a fine outcome to discover before spending compute.
  assumptions:
  - >-
    Toy prime fields with p about 2**16 to 2**22 and prime subgroup order n such that
    n - 1 has divisors of the required sizes, so that multiplicative subgroups H of order
    r exist across the sweep. Curve and subgroup selection must be recorded and is a
    confounder in its own right.
  - >-
    Public parameters, no live keys, and NO DISCRETE LOGARITHM IS SOLVED - the experiment
    computes x(kP) for all k, which presupposes the index, and therefore constitutes no
    attack on anything.
  - >-
    The maximum over a is computed EXACTLY by a discrete Fourier transform of the
    histogram of x-values over F_p, so there is no sampling error in the max and no
    multiple-testing correction is needed for the a-sweep - the max is the statistic.
  predictions:
  - metric: structured_to_unstructured_bias_ratio
    direction: same
    minimum_effect: >-
      '<= 1.5 at every r >= 64 in the sweep, on at least three curves. A ratio >= 2 that
      also GROWS across the r sweep falsifies the closure branch.'
  - metric: unstructured_bias_decay_exponent
    direction: same
    minimum_effect: >-
      'The fitted exponent in Bias(K_rand) proportional to r**(-gamma) satisfies
      |gamma - 0.5| <= 0.075 over a sweep of at least four r values. THIS IS THE ARTIFACT
      TELL and it is blocking - a bias that does not decay at the square-root rate when
      the averaging set grows means the meter is measuring something other than
      cancellation, and no comparison is read.'
  - metric: structured_bias_decay_exponent
    direction: same
    minimum_effect: >-
      'Reported alongside the unstructured one. The DIFFERENCE of the two fitted
      exponents is the sharpest single number this experiment produces - a difference
      above 0.05 in favour of the structured arm is the growth signal, and it is a
      cleaner statistic than any single ratio because it is insensitive to the overall
      normalization.'
  - metric: endomorphism_eigenvalue_special_case
    direction: different
    minimum_effect: >-
      'When H = <lambda> for lambda an endomorphism eigenvalue, the orbit x(kP) over
      k in cH is the orbit of a point under the endomorphism, so the multiset has AT MOST
      r divided by the orbit-collapse factor distinct values and the bias is structurally
      elevated. This is a KNOWN-ANSWER CALIBRATOR - the design must reproduce the elevated
      bias here or the meter cannot detect elevation at all. It is a point prediction that
      can fail and it is run BEFORE the unknown cases.'
  - metric: shuffled_index_null
    direction: same
    minimum_effect: >-
      'Applying a random permutation to the index set before evaluating x(kP) - i.e.
      destroying the multiplicative structure while preserving the cardinality - must
      return the unstructured bias to within its interval. If it does not, the structured
      and unstructured arms differ in something other than structure.'
  minimal_test:
    design: >-
      For each of at least three curves with suitable n - (1) compute x(kP) for all
      k in [1, n-1], one pass, n point additions; (2) for each r in a pre-registered
      ladder spanning at least four doublings from 64 upward with r dividing n-1, build
      the subgroup H of order r and a coset cH, form the histogram of {x(kP) : k in cH}
      over F_p, take an exact FFT of length p, and record Bias(cH) as the max modulus
      over nonzero frequencies divided by r; (3) repeat for 200 uniformly random index
      subsets of size r, recording the distribution of Bias(K_rand); (4) repeat for the
      shuffled null and for the endomorphism-eigenvalue calibrator; (5) fit both decay
      exponents and report the difference with a bootstrap interval.
    controls:
    - >-
      MATCHED UNSTRUCTURED NULL - 200 random index subsets of identical cardinality. This
      is the same-shape null object the inventor protocol requires and it is the
      comparison, not a calibration.
    - >-
      SHUFFLED-INDEX NULL - structure destroyed, cardinality preserved, everything else
      identical.
    - >-
      ENDOMORPHISM-EIGENVALUE CALIBRATOR - a case where elevation is structurally
      guaranteed, run first and blocking, so that the meter is demonstrated capable of
      detecting elevation before any unknown case is read.
    - >-
      DECAY LADDER over r, which is the artifact tell.
    - >-
      GENERIC-GROUP TRANSPORT - the identical statistic computed on Z/nZ with x replaced
      by a random bijection to F_p. Any bias that survives this transport is generic and
      carries no elliptic content, which is the attribution failure DEC-20260801-003 and
      EV-DS-003 recorded for the degree-split lane.
    required_metrics:
    - Bias(cH), Bias(K_rand) distribution, Bias(shuffled), per r per curve
    - both fitted decay exponents with bootstrap intervals, and their difference
    - the endomorphism calibrator elevation factor
    - generic-group transported bias, paired per cell
    - the argmax frequency a for every reported bias, so that a bias driven by a single
      structured frequency is distinguishable from a broadband one
  falsification_conditions:
  - >-
    'P1 - structured/unstructured >= 2 at some r >= 64 with a growing trend across the
    sweep AND surviving the generic-group transport: the object is live and the result
    requires independent review-adversarial handling before it is described anywhere.'
  - >-
    'P2 - unstructured bias does not decay at r**(-1/2) within tolerance: METER VOID.
    Nothing is read in either direction.'
  - >-
    'P3 - the endomorphism calibrator shows no elevation: the meter cannot detect
    elevation and nothing is read.'
  - >-
    'P4 - the expected outcome, both arms at r**(-1/2) with a ratio at or below 1.5: a
    CLOSURE over this object at the tested sizes, with the obstruction named as
    square-root cancellation for these character sums, and this forward guidance - what
    remains open is (i) ADDITIVELY structured index sets such as arithmetic progressions,
    which are a different class and which IDEA-20260727-006 reports as already touched
    from the YIELD side, quoting penalties spanning 17.5x to 4128.6x and attributing them
    to EV-STR-001 (that id has no file under ledger/evidence/ in this tree and the
    figures are UNVERIFIED IN THIS SESSION; they are cited as a pointer, not as a
    result); (ii) MULTIPLICATIVE-character (Legendre-symbol) statistics rather than
    additive ones; (iii) higher-order correlations across several frequencies
    simultaneously; and (iv) index sets of size below the range where square-root
    cancellation is meaningful, which is exactly where Weil-type bounds say nothing.'
  confounders:
  - >-
    Curve and subgroup selection is not free - n - 1 must factor suitably, which selects a
    non-generic family of n. At least three independently chosen curves are required and
    the selection procedure must be recorded, because a bias attributable to the
    selection is not a bias attributable to the structure.
  - >-
    The FFT is over F_p while the index set lives in Z/n; p and n are different moduli and
    the interaction is not a symmetry of anything. This is a genuine subtlety and the
    contract must state exactly which group each transform is taken over.
  - >-
    A coset cH depends on c; the reported statistic must be averaged or maximized over
    a stated set of cosets, declared in advance, and not chosen after seeing values.
  - >-
    Small r makes Bias(K_rand) noisy by construction; r >= 64 is the floor and results
    below it are recorded as underpowered rather than read.
  interpretation_limits:
  - >-
    A DISTINGUISHER IS NOT A SOLVER AND THIS RECORD DOES NOT CLAIM ONE. No exponent is
    claimed on either branch. The positive branch's deliverable is a measured bias with a
    cost epsilon**(-2) for distinguishing, plus an explicit statement that the
    search-to-decision step does not exist yet.
  - >-
    Toy sizes only, at p up to about 2**22 where an exact length-p FFT is cheap. Nothing
    transfers to cryptographic p, and the direction of the transfer is not even signed -
    square-root cancellation typically improves with p, which would make the closure
    branch stronger and the positive branch weaker at scale.
  - >-
    The design sees ONE additive character at a time (via the max over a). It is blind to
    biases visible only in JOINT correlations across several frequencies and to
    multiplicative-character biases. That declaration is made in advance, in the same form
    RT049-B1 taught this campaign to make it, and not discovered afterwards.
  heuristic_assumptions:
  - id: HEUR-CS-1
    statement: >-
      For a uniformly random index subset K of (Z/n)* of size r, the normalized bias
      Bias(K) concentrates around a constant times r**(-1/2), uniformly over the tested
      r range and the tested curves.
    rigorous_support: >-
      For a random subset this is the standard square-root-cancellation heuristic for a
      sum of r pseudo-random unit-modulus terms, and it is what a Weil-type bound would
      give for a complete sum. The uniformity over the tested range is NOT a theorem here
      and is what the decay-ladder measurement tests.
    validation_plan: >-
      MEASURED IN THE EXPERIMENT ITSELF as the decay ladder, which is simultaneously the
      artifact tell and the validation of this assumption. Fitted exponent with bootstrap
      interval over at least four r values on at least three curves. TOY SCALE, LABELLED
      AS SUCH.
  - id: HEUR-CS-2
    statement: >-
      No published bound already settles branch (a) as a theorem for exponential sums over
      an elliptic curve with the index restricted to a multiplicative subgroup of (Z/n)*.
    rigorous_support: >-
      NONE. This is an assumption ABOUT THE LITERATURE and it is stated as one rather than
      assumed silently. The Kohel-Shparlinski line and the wider Shparlinski school are
      the expected location of such a bound; the attribution is from memory and is
      UNVERIFIED IN THIS SESSION.
    validation_plan: >-
      A LITERATURE DEEP-READ IS A BLOCKING PRECONDITION, not a validation route. If the
      bound exists, this experiment's priority collapses to confirmatory and its honest
      novelty_status becomes `known`. Finding that out costs a reading session and is
      cheaper than the experiment.
  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED ON EITHER BRANCH. On the positive branch the derived object
      is a DISTINGUISHER at cost epsilon**(-2) evaluations, which is not a discrete-log
      algorithm; the missing search-to-decision reduction is named as missing.
    memory_exponent: n/a
    best_known: >-
      Pollard rho at 0.886*sqrt(N) with O(1) memory for the solve. For DISTINGUISHING,
      the relevant incumbent is that no non-generic prime-field distinguisher is known,
      which is the reason the positive branch would matter.
    hidden_overhead: >-
      The measurement costs one full enumeration of the subgroup (n point additions) plus
      an FFT of length p per cell; it is measurement cost and no part of any complexity
      claim.
    tradeoff_note: n/a
  dominated_by: >-
    n/a on the closure branch (no result claimed beyond a scoped negative). On the
    positive branch a distinguisher does not occupy a point on the solve frontier at all,
    so the honest statement would be that it is NOT COMPARABLE to rho, BSGS, the
    Corrigan-Gibbs/Kogan preprocessing frontier or the Kuhn-Struik multi-target frontier
    rather than that it dominates or is dominated by them - and that non-comparability
    must be written explicitly rather than reported as `null`.
  sota_delta: >-
    Zero on every solve axis under both branches. The closure branch's delta is a named
    obstruction over a NEW object, which is what KN-OPEN-019 says this program cannot
    currently produce. The positive branch's delta would be a measured bias epsilon and a
    distinguishing cost epsilon**(-2), stated as a distinguisher and never as a solve.
  instrument_failure_guards:
    decision_variable: >-
      The ratio Bias(cH) over median Bias(K_rand), and more sharply the DIFFERENCE of the
      two fitted decay exponents.
    what_would_make_it_vary: >-
      The MULTIPLICATIVE STRUCTURE OF K, isolated by the shuffled-index null which
      preserves cardinality and destroys structure. Secondarily r, whose effect on the
      unstructured arm is predicted at exactly -1/2 and is measured.
    power_against: >-
      Elevation of a single-frequency additive bias induced by multiplicative index
      structure, at the tested r and p, on the tested curves.
    no_power_against: >-
      Joint multi-frequency correlations; multiplicative-character statistics; additively
      structured index sets; index sets below r = 64; cryptographic p; anything requiring
      more than the one-step scalar action.
    demonstrated_movement: >-
      BY MEASUREMENT, THROUGH THE ENDOMORPHISM-EIGENVALUE CALIBRATOR, which is a case
      where elevation is structurally forced and which is run first and blocking. That
      calibrator is the answer to 'can this statistic be moved at all by the kind of
      structure it is looking for' and it is measured, not argued.
    lessons_addressed: >-
      Lesson 1 - the statistic is an exact FFT maximum over measured data, not a closed
      form in the protocol's parameters. Lesson 3 - the alternative class is declared
      (single-frequency additive elevation) and the classes with no power are enumerated
      in advance. Lesson 4 - the endomorphism calibrator is a perturbation that provably
      creates the deviation it certifies against. Standing limit U1 - the decay ladder
      supplies an ABSOLUTE reference (the r**(-1/2) law) rather than relying only on the
      second sample.
  estimated_cost:
    implementation: medium
    compute: low
  compute_budget_note: >-
    n point additions per curve (at most 2**22), plus 200 and a few more FFTs of length p
    per (r, curve) cell. Single-core hours. No factorization, no lattice, no solve.
  recommended_priority: medium
  dependencies:
  - >-
    BLOCKING - a literature deep-read on exponential sums over elliptic curves with
    multiplicatively structured index sets. HEUR-CS-2 is an assumption about the
    literature and must be discharged before compute is allocated.
