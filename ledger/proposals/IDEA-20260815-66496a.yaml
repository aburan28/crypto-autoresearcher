idea:
  id: IDEA-20260815-66496a
  question_id: RQ-SDEG-001
  added: '2026-08-15'
  title: >-
    EVERY SEMAEV COST NUMBER IN THIS PROGRAM IS A WALL CLOCK ON ONE MACHINE:
    report operation counts alongside, because a cost model built from wall
    clocks cannot be compared against anything measured elsewhere
  class: control

  claim: >-
    The lane's C_decomp is destined for an exponent comparison against rho.
    Wall clocks are machine-, compiler- and load-dependent, and an exponent
    fitted from them inherits all three. Field-operation counts are portable
    and are what every published complexity statement uses. Recording both
    costs almost nothing and makes the lane's output comparable outside this
    machine.

  mechanism: >-
    Instrument the Semaev pipeline to count field operations by type
    alongside wall clock. Report both per instance. Fit the cost model
    against each and report how much the fitted exponent differs.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Grep 'wall clock', 'operation count', 'field operations'; read of
      the SDEG protocol's declared metrics.
    results: >-
      Wall-clock reporting is pervasive; no record fits the lane's cost
      model against operation counts or compares the two fits.
    verdict: >-
      ADAPTATION. Operation counting is standard practice in complexity
      measurement; the contribution is applying it to a lane whose output
      is destined for an exponent comparison.

  object_first_candidate:
    tracked_object: >-
      THE COST OF A DECOMPOSITION measured in portable field operations
      rather than machine-bound seconds.
    lossiness: >-
      Wall clock projects a computation onto one machine's behaviour,
      discarding exactly the portability an exponent claim needs.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives wherever the pipeline can be instrumented; library-internal
      operations that cannot be counted are the instrumentation's boundary
      and must be reported.

  null_object_control: >-
    NULL 1 -- a computation with an analytically known operation count,
    which the counter must reproduce exactly. NULL 2 -- the same instance
    run under artificial machine load, where wall clock must move and
    operation count must not; this directly demonstrates why the second
    metric is needed.

  discriminated_from:
    - >-
        The lane's existing wall-clock metrics, which this record
        supplements rather than replaces.
    - >-
        The three-degree gap record in this series, which concerns which
        degree is measured; this concerns which cost unit is measured.

  assumptions:
    - >-
        The pipeline is instrumentable for operation counting, including
        inside any algebra library it calls; uncountable library internals
        are the boundary and are reported.
    - >-
        Operation counts are a defensible cost proxy at the tested sizes,
        which holds when one operation type dominates and must be checked
        rather than assumed.

  predictions:
    - metric: >-
        known-count calibration
      direction: different
      minimum_effect: >-
        FORCED exact reproduction.
    - metric: >-
        wall clock and operation count under artificial load
      direction: different
      minimum_effect: >-
        FORCED: wall clock moves, operation count does not. This is the
        record's whole argument in one measurement.
    - metric: >-
        fitted exponent under each cost unit
      direction: different
      minimum_effect: >-
        If the two fits differ beyond their intervals, the lane's
        exponent depends on the machine and must be reported in
        operations.

  minimal_test:
    design: >-
      One instance set, both metrics, both nulls, both fits.
    controls:
      - >-
          Known-operation-count calibration.
      - >-
          Artificial-load discrimination null.
      - >-
          Uncountable library internals reported as the instrumentation
          boundary.
    required_metrics:
      - >-
          Operation counts by type and wall clock per instance.
      - >-
          Fitted exponent under each unit, with intervals.
      - >-
          Instrumentation boundary statement.

  falsification_conditions:
    - >-
        The counter does not reproduce a known count. Instrumentation
        wrong.
    - >-
        Operation count moves under artificial load. The counter is
        measuring something machine-dependent.
    - >-
        The two fits agree. Wall clock was adequate at these sizes, which
        is a clean result that costs almost nothing to establish.
    - >-
        The two fits differ. The lane's exponent is machine-dependent and
        every downstream comparison must use operation counts.

  confounders:
    - >-
        OPERATION-TYPE MIXING: counting multiplications and inversions as
        one unit misprices the computation when their ratio changes with
        size, so counts must be reported by type.
    - >-
        UNCOUNTABLE INTERNALS: if a called library dominates and cannot be
        instrumented, the operation count is incomplete and may be less
        trustworthy than wall clock.

  interpretation_limits:
    - >-
        Changes the lane's cost unit; produces no new cost model and no
        exponent.
    - >-
        Scoped to the instrumented pipeline and the tested sizes.
    - >-
        Operation counts are portable only to the extent the
        instrumentation is complete.

  heuristic_assumptions:
    - id: HEUR-SDEG-OPS-1
      statement: >-
        Field-operation counts by type are a machine-independent cost
        proxy for Semaev decomposition at the tested sizes.
      rigorous_support: >-
        Rigorous ingredient: the algorithm's cost is a sum over field
        operations whose individual costs are fixed for a fixed field
        size. THE GAP: memory-access patterns and cache behaviour are
        not captured by operation counts and can dominate at larger
        sizes, so the proxy's fidelity degrades exactly where the lane
        wants to extrapolate.
      falsification_condition: >-
        Wall-clock and operation-count fits diverging with size in a way
        that grows.
      validation_plan: >-
        SAMPLE: >= 4 sizes x >= 20 instances, both metrics. COMPARISON:
        ratio of wall clock to weighted operation count as a function of
        size. TAIL CHECK: the largest size, where cache effects are
        strongest. TRANSFER: stated and unjustified beyond the tested
        range.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is instrumentation overhead on existing runs.
    memory_exponent: >-
      Unchanged from the lane's existing profile.
    best_known: >-
      The incumbent is the lane's wall-clock metric, which this
      supplements; published Semaev complexity statements use operation
      counts, which is the comparability this record restores.
    hidden_overhead: >-
      Instrumentation overhead itself distorts wall clock, so the two
      metrics should be collected in separate runs or the overhead
      measured and reported.
    tradeoff_note: >-
      Operation counts are portable and blind to memory effects; wall
      clock captures everything and travels nowhere. Reporting both is the
      only honest option.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As a cost model: the lane's own protocol
    owns that and this record only changes its unit. As portable
    measurement: absent here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: portable field-operation
    counts alongside wall clock for the lane whose output is destined for an
    exponent comparison, plus a direct demonstration under artificial load
    of why the second unit is required.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.8 that the pipeline is instrumentable to a useful boundary. 0.95 that
    the artificial-load null demonstrates the point. 0.4 that the two fitted
    exponents differ beyond their intervals, which would make operation
    counting mandatory rather than merely better.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
