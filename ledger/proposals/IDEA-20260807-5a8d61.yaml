idea:
  id: IDEA-20260807-5a8d61
  question_id: RQ-ECDLP-002
  added: '2026-08-07'
  title: 'Seven headline prime-field ECDLP barrier claims exist ONLY as unreviewed decision prose:
    the 2026-08-04 closure series has no reviews/ directory in any of its batches, its owed KN-FIND
    promotions were never made, and KN-OPEN-005 and KN-OPEN-009 still read status: open -- audit
    all seven against the inventor protocol''s section 4 standard'
  class: control
  claim: 'On 2026-08-04 GOAL-ECDLP-001 recorded a series of closure decisions: KN-OPEN-009 CLOSED
    and KN-OPEN-005 PARTIALLY_ADDRESSED (DEC-20260804-4f37d5); ''H-PSEUDO is the ONLY live path
    to sub-rho classical prime-field ECDLP. Comprehensive barrier confirmed'' (DEC-20260804-46784b);
    close_hybrid_confirm_complete_classical_barrier (DEC-20260804-662f26); close_magcs_for_generic_curves
    (DEC-20260804-6ee18a); close_weyl_record_hpseudo_frontier, ''all five standard analytic methods
    are closed'' (DEC-20260804-73287b); confirm_structural_gap_promote_findings (DEC-20260804-bfbb09);
    plus DEC-20260804-4f7da7 and DEC-20260804-578f75. THE BATCH DIRECTORIES FOR THIS SERIES (BATCH-055
    through BATCH-066) CONTAIN A tasks/ DIRECTORY AND NO reviews/ DIRECTORY AT ALL -- BATCH-061,
    which closed KN-OPEN-009, holds exactly two producer artifacts and no validator or red-team
    task. DEC-20260805-7b3e91 later converted each decision''s `promoted` list into `owed_promotions`,
    recording that the placeholder KN-FIND ids named promotions that ''were OWED but never made,
    which made the record assert the opposite of the truth''. Neither KN-OPEN-005 nor KN-OPEN-009
    was updated; both still read status: open. Separately, DEC-20260804-139a86 calls NCP, TTN
    and TRA ''theorem-backed obstructions'' while DEC-20260718-007/008/009 each state on the record
    that the theorem in question remains unproven and name a theory note that was never written.'
  mechanism: One independent adversarial pass over the series. For each of the seven claims, check
    it against the three things docs/inventor-protocol.md section 4 requires -- a NAMED OBSTRUCTION,
    an ARGUMENT, and FORWARD GUIDANCE naming what remains open -- and record which survive at
    what claim tier. Then either file the owed KN-FIND entries with superseding KN-OPEN-005 and
    KN-OPEN-009 entries, or downgrade the claims to `unverified` where the argument does not carry.
    Section 4 is explicit that 'we screened N mechanisms and all were rejected' is a fatigue report
    whose honest status is `unverified`, and it names this program's own saturation reports as
    in-scope for that judgement.
  novelty_screen:
    screened_on: '2026-08-07'
    corpus_paths_grepped:
    - ledger/decisions
    - coordination/goals/GOAL-ECDLP-001
    - knowledge/open-problems
    - knowledge/findings
    grep_results:
    - 'DEC-20260805-7b3e91 is explicitly a ledger-INTEGRITY decision: ''This is a ledger-integrity
      decision. It reviews no evidence, produces no measurement, and asserts no durable claim.''
      It fixed the misleading `promoted` fields, discharged none of the owed promotions, and reviewed
      none of the closures on the merits.'
    - 'knowledge/findings contains no entry for EV-TTN-001, EV-TTN-002 or EV-TRA-001; KN-FIND-020
      and KN-FIND-022 are scope-restatement stubs with proof_status: empirical_only.'
    conclusion: No record reviews these closures on the merits.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS: proposing any new attack. This record proposes
      an AUDIT and nothing else.'
    tracked_object: Per claim, the triple (named obstruction present?, argument present?, forward
      guidance present?) with a claim tier.
    one_step_propagation_rule: Each claim is scored independently; the aggregate 'complete classical
      barrier' statement is the conjunction, so it inherits the weakest component.
    newness_score: Nil as mathematics. It is the review AGENTS.md rule 12 requires for a closure
      result and that these batches did not receive.
  lossy_projection_identifiability_audit:
    projection: each closure decision -> a three-bit compliance vector plus a claim tier.
    what_is_discarded: The mathematics of each argument, retained by reference rather than re-derived.
    is_it_only_a_change_of_coordinates: 'NO. Honest caveat: this is a WEAK object -- an audit
      produces compliance bits, never mathematics -- and the record''s class is control for that
      reason. Its value is that the aggregate claim currently steering all downstream ideation
      has never been checked at all.'
    mirror_failure_check: 'CHECKED. The failure would be an audit that passes everything. It cannot:
      DEC-20260718-009''s own limitations field says ''the commutator-generation theorem itself
      remains unproven'', so at least one claim is forced to score FAIL on the argument bit before
      the audit begins.'
  null_object_control:
    primary_null: Score two closures the program already treats as GENUINE (for instance the GGM
      simulability closures behind KN-FIND-b7e091, which carry an argument and a named obstruction)
      and two it treats as weak. If the audit gives every closure the same score, it is a control
      that cannot discriminate and must be rewritten.
    secondary_nulls:
    - 'FORCED FAIL: DEC-20260718-009''s unproven commutator theorem must score FAIL on the argument
      bit.'
    - 'FORCED PASS: a closure whose obstruction is a cited theorem with a reproduction check must
      score PASS.'
  assumptions:
  - The BATCH-055..066 task artifacts remain readable in the tree.
  - Scoring against section 4 can be done by reading, without re-deriving the mathematics.
  predictions:
  - metric: number of the seven claims passing all three section-4 bits
    direction: lower
    minimum_effect: Fewer than seven. Any number below seven changes what GOAL-ECDLP-001 is entitled
      to assert.
  minimal_test:
    design: Read each of the eight decisions and the BATCH-055..066 producer artifacts; score
      the three bits and a claim tier per claim; run the discriminating null on four already-classified
      closures; emit the scored table plus, for each failure, the specific missing element.
    controls:
    - four already-classified closures as a discrimination null
    - forced-FAIL and forced-PASS gates
    required_metrics:
    - per-claim three-bit score and claim tier
    - list of owed KN-FIND promotions still undischarged
    - reconciliation status of KN-OPEN-005 and KN-OPEN-009
  falsification_conditions:
  - 'All seven pass: the program legitimately owns the strongest set of barrier statements it
    has produced, and the audit says so.'
  - 'The discrimination null gives every closure the same score: the audit instrument is useless
    and no verdict is admissible.'
  - 'The producer artifacts contain arguments the decisions omitted: the defect is in the decision
    records'' prose, not in the research, and the repair is a superseding record.'
  confounders:
  - An auditor who also proposes replacements has an incentive to fail claims; the audit and any
    successor proposals must be separate records.
  - Section 4's standard is qualitative; two auditors may score differently, so the scoring rubric
    must be written before reading.
  interpretation_limits:
  - An audit changes no hypothesis status and closes no mathematics. Only the Coordinator may
    transition anything (AGENTS.md rule 1).
  - A FAIL means `unverified`, which is NOT 'the direction is open and promising'; the inventor
    protocol forbids declaring a direction impossible and equally forbids inflating an unverified
    closure.
  heuristic_assumptions:
  - id: HEUR-AUDIT-1
    statement: Section 4 compliance is a usable proxy for whether a closure is reusable by a later
      session.
    rigorous_support: None; the protocol itself carries a provenance caveat (section 7) and may
      not be cited as evidence that following it produces results.
    validation_plan: Record the rubric and invite disagreement with it as a first-class outcome.
