idea:
  id: IDEA-20260816-b4e5b7
  question_id: RQ-RSA-d46f02
  added: '2026-08-16'
  title: The achievability ratio R(n, D) = (largest unknown-prime-bit fraction actually recovered
    inside a declared lattice and reduction budget) divided by (the same construction's own asymptotic
    reach), measured as a curve in modulus bit-length from 64 to 1024 bits on known-answer instances.
  class: measurement
  claim: '(A) The quantity this program actually needs from Coppersmith-style partial-information
    recovery is not the asymptotic reach but the ratio between what a declared budget achieves and
    what the asymptotic statement promises, and that ratio is a measurable function of modulus size,
    lattice dimension and reduction budget. Define, for a fixed construction C, a fixed modulus bit-length
    n, a fixed shift-lattice dimension D and a fixed reduction budget, the quantity r_hat(C, n, D)
    = the largest unknown fraction u of the target prime for which recovery succeeds on at least 90
    percent of a fixed sample of known-answer instances. Define R(n, D) = r_hat / u_asym, where u_asym
    is the reach the reproduced construction states for itself. (B) The claim is that R(n, D) is strictly
    below 1 at every finite n and D reachable here, that it is monotone non-decreasing in both n and
    D over the tested grid, and that the shortfall 1 - R is large enough at small n to be visible
    without statistical strain, so the curve carries information rather than noise. (C) The claim
    is that this curve is decidable rather than inferred: instances are generated with p and q known
    in advance, so a success is verified by exact multiplication and a failure is a failure of the
    budget, and below 96 bits the entire unknown window is additionally exhaustible, so a lattice
    failure can be separated from an instance that has no recoverable structure at all. (D) WHAT IS
    NOT CLAIMED: no attack on any RSA modulus, deployed or otherwise, is claimed; no assertion is
    made that any published bound is wrong, because a shortfall measured inside a declared budget
    is a statement about that budget and that implementation and nothing else (AGENTS.md rule 3);
    no extrapolation of R beyond 1024 bits is claimed; and no claim is made that R is the same function
    for a different construction, a different shift set, or a different reduction algorithm, since
    those are exactly the free variables the later entries in this bucket vary.'
  mechanism: 'Stage 1 reproduces one small-root construction from in-repo description (KN-TECH-015)
    as an explicit lattice builder: given a monic univariate polynomial in the unknown low or high
    bits of the target prime, emit the shift set, the scaled basis matrix, and the exact determinant
    as an integer, with the shift set declared before any run rather than tuned. Stage 2 generates
    known-answer instances: sample p and q of the target size from a recorded seed, form N = p q,
    choose a leakage fraction, and reveal the corresponding bits, so ground truth is fixed by construction.
    Stage 3 runs the reduction at the declared budget and applies the Howgrave-Graham read-off, then
    verifies any candidate by exact division of N. Stage 4 finds r_hat by bisection on the unknown
    fraction u at fixed n and D, using a fixed sample of instances per cell and a fixed success threshold.
    Stage 5 computes R = r_hat / u_asym where u_asym is the reach the reproduced construction declares
    for itself, and reports the curve in n and D with lattice dimension, wall time and peak resident
    memory beside every point. Refutation route: if r_hat is not stable under re-seeding, or if the
    bisection does not converge because success probability is not monotone in u, the claim that a
    single ratio summarises the behaviour is false and the correct object is the whole success surface,
    which entry six of this bucket treats.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read ledger/questions/RQ-RSA-d46f02.yaml and RQ-RSA-afe33c.yaml in full and ledger/hypotheses/H-RSA-68884a.yaml.
      Ran: grep -rl RQ-RSA-d46f02 ledger/proposals/ (empty); grep -rlie ''coppersmith|howgrave|small-root|partial
      key exposure|boneh-durfee|shift polynomial'' over ledger/proposals/ and ledger/hypotheses/ (21
      proposal files, 2 hypothesis files); grep -rih ''coppersmith'' over ledger/proposals/ and read
      every distinct matching line; grep -rih ''LLL|BKZ|root-hermite|lattice dimension'' over ledger/proposals/.
      Read knowledge/techniques/KN-TECH-015.md and knowledge/techniques/KN-TECH-14efa5.md, and docs/inventor-protocol.md
      sections 1 through 4.'
    results: 'RQ-RSA-d46f02 carries ZERO proposals; RQ-RSA-afe33c carries 8, all of them about NFS
      cost modelling rather than partial information. Coppersmith appears in the proposal corpus almost
      entirely in an unrelated sense: Coppersmith block Wiedemann as a linear-algebra stage, in several
      proposals under the TNFS and index-calculus lanes. The only proposal that uses the small-root
      sense is IDEA-20260808-e2315e, which treats the shift-lattice dimension as a cost-bearing exponent
      D = N^delta for a Semaev windowed-decomposition system over a prime field, not for RSA partial
      key exposure, and asks about the asymptotic derivative rather than the finite-size ratio. IDEA-20260807-0f49b6
      mentions Coppersmith only as a boundary remark. KN-TECH-015 records the method and its cost
      model but records no measurement of achievable reach, and refers to a planned EXP-COPP-001 for
      which no directory exists under experiments/.'
    verdict: 'UNVERIFIED. No agent here can read external literature, so nothing is asserted about
      what is published. What is claimed new relative to THIS REPOSITORY is the object R(n, D) as
      a measured finite-size ratio for the RSA partial-information setting, and the use of construction-time
      ground truth plus sub-96-bit exhaustion to make each cell decidable. Assembled from known parts:
      the lattice construction itself (KN-TECH-015), the known-answer instance discipline named in
      RQ-RSA-d46f02''s own constraints, the fpylll instrument route (KN-TECH-14efa5), and the memory-beside-time
      charging convention of docs/target-result-profile.md. The idea that finite dimension costs reach
      is present in IDEA-20260808-e2315e in a different setting; the contribution here is the ratio
      as a reported curve rather than a derivative as an asymptotic argument.'
  object_first_candidate:
    tracked_object: 'The achievability ratio R(n, D) itself, carried as a triple (n, D, r_hat) with
      its budget attached: a scalar summary of the whole success surface, followed through the grid
      of modulus sizes and lattice dimensions rather than through a single computation.'
    lossiness: 'Genuinely lossy. The full state is the success indicator for every (instance, unknown
      fraction, shift set, reduction seed) tuple. R discards the identity of the instance, the shape
      of the reduced basis, the wall time distribution and the entire per-instance variance, retaining
      only the 90-percent quantile threshold in u. That discard is compatible with the target operation
      because the operation the object must survive is CHANGING n and D, and the threshold in u is
      defined identically at every (n, D), so the retained scalar propagates without needing the discarded
      per-instance detail. The discard is not free and is the exact reason entry six exists: if the
      success curve in u is not sharp, the quantile hides the transition width, and R is then a lossy
      projection that has thrown away the thing that mattered.'
    propagation: One step of the target operation is incrementing n at fixed D, or incrementing D
      at fixed n. Under an increment of D at fixed n, the shift set gains rows, log determinant grows,
      and the Howgrave-Graham slack changes sign at a computable point; r_hat is expected to move
      up until the reduction budget rather than the determinant condition binds. Under an increment
      of n at fixed D, the entries grow in bit-length, reduction quality at fixed budget degrades,
      and r_hat is expected to move down before recovering as the asymptotic regime is approached.
    survival_score: 'The object should survive the whole tested grid as long as the success curve
      in u is monotone and reasonably sharp. It dissolves at exactly two places, both of which are
      reportable outcomes: where success probability stops being monotone in u, so no single threshold
      exists, and where the reduction budget rather than the lattice binds, at which point R measures
      the reducer and not the construction. Concretely, survival is expected to n = 1024 at D up to
      about 60, and to fail first at large D and large n where reduction time exceeds the per-cell
      cap.'
  null_object_control: 'The identical measurement runs against a null instance in which the revealed
    bits are drawn uniformly at random and are NOT the true bits of p, with everything else identical:
    same n, same u, same shift set, same reduction budget, same seeds, same verification by exact
    division. The null must show r_hat_null undefined because recovery succeeds at a rate indistinguishable
    from zero at every u tested, with an exact binomial upper bound on the null success rate recorded.
    If the null arm ever recovers a factor, the signal arm is measuring the instance generator or
    the verification step, not the construction, and the whole measurement is void. A second null
    holds the revealed bits true but scrambles their POSITIONS, which must also fail, separating knowing-the-bits
    from knowing-where-they-go.'
  discriminated_from:
  - 'IDEA-20260808-e2315e (superpolynomial-dimension small-root solving): that proposal varies shift-lattice
    dimension as an exponent D = N^delta for a Semaev windowed decomposition over a prime field and
    asks whether the reach derivative pays for the reduction cost. This entry fixes a modest polynomial
    dimension, works in the RSA partial-information setting where ground truth is available by construction,
    and reports a finite-size RATIO against the construction''s declared reach rather than an asymptotic
    derivative.'
  - 'KN-TECH-015 (Coppersmith small-root lattice methods): a technique note recording the method,
    its cost model and its applicability limits. It records no measured reach and no ratio, and its
    named use is windowed Semaev relation finding, not RSA partial key exposure.'
  - 'The eight proposals under RQ-RSA-afe33c and H-RSA-68884a: those model NFS cost with no leakage
    at all, and their tracked object is a cost exponent theta for shared matrix storage. Disjoint
    object, disjoint operation.'
  - 'Coppersmith block Wiedemann proposals in the TNFS and index-calculus lanes: same surname, different
    algorithm; those track a sparse-matrix linear-algebra stage and never build a shift lattice.'
  - 'A generic benchmark of an LLL implementation: this measures reach in an application-defined unit
    u, not reduction quality, and its null arm makes the difference operational.'
  assumptions:
  - One small-root construction can be reproduced faithfully enough from in-repo description that
    its declared reach u_asym is well defined; if it cannot, the ratio has no denominator and the
    Coordinator must supply the KN-LIT entry first.
  - Instances generated with recorded seeds are representative of the instance class the construction
    addresses; no claim is made about instances from any other source.
  - Success probability at fixed (n, D) is monotone in the unknown fraction u, so a threshold exists.
    This is tested, not assumed silently.
  - Peak resident memory as measured by the harness is an adequate proxy for the memory term the charging
    convention requires.
  - Exhaustion below 96 bits terminates within the declared per-cell cap, which requires the unknown
    window to be at most 24 bits in the exhaustion arm.
  predictions:
  - metric: R(n, D) = r_hat / u_asym at the largest tested dimension, at n = 256
    direction: lower
    minimum_effect: 0.9
  - metric: R(n, D) at fixed D as n increases from 64 to 1024 bits
    direction: different
    minimum_effect: No pre-committed effect size. The direction of the finite-size correction in n
      at FIXED dimension is exactly what is unknown here, and forcing a number would be inventing
      the result the run is for.
  - metric: null-arm recovery rate over all cells (random revealed bits)
    direction: lower
    minimum_effect: 0.0
  - metric: r_hat at n <= 96 compared against the exhaustion-certified recoverable fraction
    direction: lower
    minimum_effect: 0.0
  minimal_test:
    design: Fix one construction and one shift set. Fix n = 128 only. Generate 40 known-answer instances
      per cell from recorded seeds. Sweep the unknown fraction u over 9 values spanning a range that
      brackets the construction's declared reach, at two lattice dimensions. For each cell run the
      reduction at a fixed budget, read off candidate roots, verify by exact division of N, and record
      success, dimension, log determinant, wall time and peak resident memory. Run the random-revealed-bits
      null and the scrambled-positions null over the identical grid in the same invocation, sharing
      the instance generator and the verifier. Report r_hat by the 90-percent threshold, R against
      the declared reach, and both null success rates with exact binomial bounds. This is one dimension
      of the full grid and is expected to cost a few CPU-hours; it discriminates because a shortfall
      that is not visible at n = 128 with 40 instances per cell is too small for the full grid to
      resolve either, and because a null arm that succeeds voids the design before any grid is paid
      for.
    controls:
    - Random-revealed-bits null at identical n, u, dimension, budget and seeds, executed in the same
      invocation as the signal arm.
    - 'Scrambled-position control: true bits, wrong positions, must fail.'
    - 'Exhaustion cross-check at n <= 96 with unknown window at most 24 bits: the exhaustive search
      decides recoverability independently of any lattice.'
    - 'Re-seed replication: every reported r_hat recomputed on a disjoint instance sample with a different
      seed.'
    - 'Verification control: every claimed recovery is confirmed by exact integer multiplication p
      q == N, so no success is ever inferred from a norm bound alone.'
    required_metrics:
    - 'r_hat: largest unknown fraction u with success rate at least 0.90, by bisection'
    - R = r_hat / u_asym with u_asym stated and its source named
    - per-cell success count and exact binomial confidence interval
    - lattice dimension D and exact log determinant per cell
    - reduction wall time per cell, median and maximum
    - peak resident memory per cell
    - null-arm success rate with exact binomial upper bound
    - exhaustion-arm certified recoverable fraction at n <= 96
  falsification_conditions:
  - 'The null arm recovers a factor in any cell: the measurement is voided and reported as an instrument
    failure, not as a result.'
  - Success probability is non-monotone in u in more than one cell, so no threshold r_hat exists and
    the scalar object dissolves.
  - r_hat varies by more than 0.05 in u between disjoint re-seeded samples at the same cell, so the
    object is not stable enough to carry a curve.
  - At n <= 96 the exhaustion arm certifies a cell as unrecoverable while the lattice arm reports
    success there, indicating a bug in instance generation or verification.
  - Reduction time exceeds the per-cell cap in more than half the cells, so the reported curve is
    a curve of the budget and not of the construction. This is a budget outcome and is reported as
    such.
  confounders:
  - Reduction implementation and floating-point precision silently set achieved basis quality; entry
    seven of this bucket is the dedicated control for this, and this entry pins one implementation
    and records its version.
  - 'Instance generator bias: primes sampled with structure, for example fixed high bits from a bad
    sampler, would inflate r_hat. Mitigated by the scrambled-position control and by recording the
    generator.'
  - The declared reach u_asym is itself a reproduction and may be misread from in-repo description,
    which would shift every R by a constant factor. The ratio is therefore reported alongside the
    raw r_hat.
  - Root read-off can succeed for reasons unrelated to the lattice at very small n, where the unknown
    window is small enough that a lucky candidate appears. Mitigated by the exhaustion arm.
  - 'Per-cell caps interact with n: a fixed wall-clock cap is a tighter constraint at 1024 bits than
    at 128, which can masquerade as a size effect.'
  interpretation_limits:
  - A measured shortfall is a statement about one construction, one shift set, one reducer and one
    budget. It is not evidence that any published bound is wrong.
  - Nothing here transfers to any deployed RSA key, and no leakage observed in the world is claimed
    to match the leakage this campaign supplies to itself.
  - The curve is measured only on the tested grid; behaviour beyond 1024 bits is not claimed and no
    extrapolation law is asserted by this entry.
  - R is a quantile summary. Where the success transition is wide, R understates the uncertainty and
    entry six of this bucket is the correct reference.
  target_complexity:
    time_exponent: 'No attack exponent is claimed. The instrument''s cost is recorded, not asserted:
      reduction wall time per cell is measured and reported, and the cost model of record for the
      reduction remains the one in KN-TECH-015 rather than anything derived here.'
    memory_exponent: No attack memory exponent is claimed. Peak resident memory per cell is measured
      and reported beside time in the convention of docs/target-result-profile.md.
    best_known: The incumbent is the construction's own asymptotic reach as reproduced in this repository
      from KN-TECH-015, together with the fact that RQ-RSA-d46f02 currently holds zero proposals,
      zero experiments and zero evidence records, so the incumbent MEASUREMENT is that none exists
      here.
    hidden_overhead: 'The human cost of faithfully reproducing a construction from description dominates:
      shift-set choice, scaling, and the read-off step each admit variants that change reach, and
      getting them wrong silently lowers r_hat. Machine-side, the lower-order term that bites is the
      exact integer arithmetic in determinant computation and verification, which is negligible at
      128 bits and not negligible at 1024.'
  dominated_by: 'n/a (no result claimed). No time, memory or data frontier row is asserted, because
    the deliverable is a measured property of an existing construction rather than a solver. Stated
    plainly rather than written as null: I did not check frontier rows, because there is no claimed
    point to place on a frontier.'
  sota_delta: No attack; conceptual and measurement contribution only. Quantitatively the deliverable
    is a table of R(n, D) values with dimension, time and memory attached, where the current repository
    state has no such value at any (n, D). The comparison is therefore between a number and the absence
    of one, and that is stated rather than dressed as an improvement.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Faithful reproduction of one construction with a well-defined declared
    reach: 0.7, because the method is described in-repo but the constants are not, and RQ-RSA-d46f02
    explicitly forbids inheriting numbers. r_hat being well defined and stable under re-seeding at
    n = 128: 0.85, because threshold behaviour in this family is the ordinary expectation. R being
    strictly below 1 at every tested cell: 0.9, since finite dimension cannot exceed an infinite-dimension
    limit under the same construction. The curve being MONOTONE in both n and D as claimed: 0.45,
    because the interaction between growing entry bit-length and fixed reduction budget could easily
    be non-monotone, and that is the part most likely to be the interesting result rather than the
    predicted one. Null arms behaving: 0.95.'
