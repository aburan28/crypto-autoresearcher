idea:
  id: IDEA-20261002-00199c
  question_id: RQ-NGCC-f52138
  goal_id: GOAL-NGCC-6c8a52
  added: '2026-10-02'
  title: >-
    Measure whether BiT parameter sets cap security below the claimed level
    by seed or prehash length (sign-02-1)
  class: mechanism
  claim: >-
    Saarinen, ePrint 2026/2266, cites sign-02-1 as a case where a 384-bit
    or 512-bit parameter set expands the key from a 256-bit seed, or signs
    a 512-bit unsalted digest, and so caps security at 2^256. This idea
    asks whether that length shortfall is present in the official ICCS
    round-1 BiT package. It does not test finding sign-02-2, which the
    same paper leaves Probable.
  mechanism: >-
    For each declared parameter set, read the claimed classical security
    level, the seed length in bits, and the unsalted message-digest length
    in bits from the specification, and check the same constants in the
    reference source. The generic bound is the minimum of the seed length
    and half the unsalted digest length, when that input is what the scheme
    expands or signs. A shortfall is that bound being strictly below the
    claimed level. No key is recovered and no signature is forged.
  novelty_status: unverified
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      BiT is an NGCC round-1 signature candidate, not an elliptic-curve
      discrete-log instance. knowledge/frontiers/ecdlp does not contain
      this scheme. The corpus entry that names it is a round-1 listing and
      states that it includes no third-party analysis. KN-LIT-2718 is a
      different primitive, BiTR, and is not prior art for this candidate.
    nearest:
      - ref: KN-LIT-bc233d
        provenance: kb
        relation: adjacent
        delta: >-
          KN-LIT-bc233d records that BIT is signature candidate 2 and
          states that the specification, reference code, and any
          third-party analysis were not read. This idea adds a length
          audit of published finding sign-02-1. It adds no new attack.
    searched:
      corpus_grep:
        - "knowledge/literature/KN-LIT-bc233d.md read 2026-10-02"
        - "knowledge/literature/KN-LIT-2718.md is BiTR, not this candidate"
      web: []
      blocked: []
  test_boundary: >-
    Official BiT zip from the round-1 roster (sign-02), every parameter
    set the package declares. Finding sign-02-2 is out of scope. No claim
    about a repaired or later submission.
  falsification: >-
    Every declared parameter set has seed length and unsalted-digest
    collision bound at least its claimed classical level, with the
    specification and the reference source in agreement.
  status: proposed
  proposed_by: coordinator
