idea:
  id: IDEA-20260805-c4f675
  question_id: RQ-ECDLP-002
  added: '2026-08-05'
  title: >-
    The H-PSEUDO character-sum constant has never been divided by its own null:
    all four published exponents for C(p) are reproduced by the extreme-value
    law of a matched random subset, and the residual growth after normalisation
    is 0.004, not 0.079
  class: control

  claim: >-
    This goal's H-PSEUDO lane measures
    C(p) = max_{k=1..N-1} |sum_{P in F} e(2 pi i k DL_G(P)/N)| / sqrt(B)
    for the small-x factor base F, and reports it as growing like p^{alpha}.
    Four incompatible values of alpha are live and unsuperseded
    (0.055 in KN-FIND-d4f820; 0.079 in KN-FIND-4c9e71; 0.0620 and 0.0624 from
    two refits recorded in this session's ANGLE-BRIEF), and
    DEC-20260804-7af513 concludes from them that
    "C_EC ~ p^{0.079} >> sqrt(log p) = C_random_prediction ... EC sequences
    become increasingly worse than random bijections as p grows. This is a
    genuine structural difference".
    THAT CONCLUSION IS NOT SUPPORTED BY THE FOUR COMMITTED DATA POINTS, and the
    demonstration is arithmetic on those points alone.
    For a UNIFORMLY RANDOM subset F' of Z_N with |F'| = B, the normalised
    Fourier coefficients |hat{1_{F'}}(k)|^2 / B are asymptotically i.i.d.
    Exponential(1) over the (N-1)/2 conjugate-pair frequencies, so their maximum
    is Gumbel with location ln((N-1)/2) + gamma_E, giving the FORCED NULL VALUE
      C_null(p) = sqrt( ln((N-1)/2) + gamma_E ),   gamma_E = 0.5772156649.
    At p = 1009 this predicts 2.6076 against the 2.57 that
    DEC-20260804-7af513 actually measured for random bijections -- a 1.5 per
    cent agreement that no record notices. Dividing the committed mean-C table
    (3.00, 3.50, 3.70, 3.84 at p = 1009, 4001, 9001, 50021) by that forced null
    gives the ratios 1.1505, 1.2239, 1.2341, 1.1737: a CONSTANT of about 1.20
    with 7 per cent scatter and a log-log slope of +0.0041.
    In other words the entire measured growth of C(p) is the growth of the NULL,
    and the EC-specific residual exponent is +0.004 for the mean and +0.017 for
    the adversarial max -- between 5 and 19 times smaller than the exponents on
    record, and for the mean statistically indistinguishable from zero at four
    points. The published alpha = 0.055 is, to three digits, exactly the power
    law that mimics sqrt(log p) over the measured range: the value of alpha
    matching sqrt(log p)'s growth from p = 1009 to p = 100003 is 0.0554.
    THE PROPOSAL IS TO RUN THE MEASUREMENT THE LANE NEVER RAN -- C_EC/C_null at
    matched B on the same curve, over a p-range wide enough for the models to
    separate -- and to report the RATIO, which is the only quantity carrying
    EC-specific information.

  object_first_candidate:
    tracked_object: >-
      The RATIO R(p) = C_EC(p) / C_null(p), where both numerator and denominator
      are the same statistic (maximum normalised Fourier coefficient of an
      indicator over Z_N) computed on objects of IDENTICAL SHAPE: same N, same
      B, same DFT range, one drawn as {DL_G(P) : P in E(F_p), x(P) < t} and one
      as a uniform random B-subset of Z_N. The tracked object is the ratio, not
      C -- and that substitution is the whole content, because C is dominated by
      an extreme-value effect that has nothing to do with elliptic curves.
    established_families_off_limits: >-
      Off-limits as the PRIMARY lens: Pollard rho and BSGS; Semaev summation
      polynomials and every algebraic factor-base construction; Weil descent;
      isogeny and CM structure; pairing transfer; linear-complexity and
      sequence-theoretic proxies (this proposal is about what
      DEC-20260804-7af513 concluded when it blocked one, not a revival of it);
      Groebner/solving-degree instrumentation. The proposal is deliberately NOT
      an attack proposal in any family. It is inventor-protocol move 1 --
      attack the MEASUREMENT, not the target -- applied to this goal's own
      most-cited standing conclusion.
    newness_score: >-
      The extreme-value law for maxima of Fourier coefficients of a random set
      is textbook (RECALLED, UNVERIFIED as to any specific source; derived here
      from first principles instead). What is not in this corpus is its use as a
      DERIVED FORCED VALUE for the null of this exact statistic, and the
      consequent finding that the ratio is flat. The ANGLE-BRIEF ranks the
      matched null for this constant as the single highest-value unattacked
      angle in the program and records that the null was measured at exactly one
      prime; this proposal supplies both the derivation and the design that
      extends it.
    testability_score: >-
      Very high and mostly free. The arithmetic that produces the headline was
      done on committed table values before this record was filed. The confirming
      measurement needs a full-range DFT at four bit sizes; numpy 2.4.6 IS
      present in this container (verified by import this session, resolving the
      environment disagreement recorded in the ANGLE-BRIEF section 5.3: numpy is
      present, sympy and Sage are NOT), so numpy.fft.rfft at length 2^26 is a
      few seconds and about 0.5 GB.
    survival_score: >-
      The ratio survives as a well-defined statistic at every p; what may not
      survive is the claim that it is flat. It is flat over the four committed
      points; a genuinely EC-specific effect could emerge over a wider range,
      and the experiment is designed so that outcome is as visible as the
      opposite one.

  mechanism: >-
    DERIVED IN-REPO THIS SESSION. All arithmetic below was performed on the
    values committed in KN-FIND-d4f820, KN-FIND-4c9e71 and DEC-20260804-7af513;
    no new measurement was made and none is claimed.

    STEP 1 -- THE NULL'S FORCED VALUE. Let F' subset Z_N be uniform of size B
    and S(k) = sum_{j in F'} e(2 pi i k j / N). For fixed k != 0, S(k) is a sum
    of B unit vectors at nearly independent uniform phases, so
    E|S(k)|^2 = B(1 - (B-1)/(N-1)) and, by the central limit theorem in the
    plane, |S(k)|^2/B converges to Exponential(1):
      Pr[ |S(k)|^2 / B > u ] -> e^{-u}.
    Since |S(k)| = |S(N-k)| there are M = (N-1)/2 distinct magnitudes. Treating
    them as independent (the standard and stated approximation), the maximum of
    M i.i.d. Exponential(1) has mean ln M + gamma_E. Hence
      C_null(p) = max_k |S(k)| / sqrt(B) = sqrt( ln((N-1)/2) + gamma_E )
                                            (1 + o(1)),
    a quantity depending ONLY on N -- not on B, not on the curve, not on
    anything elliptic. Note immediately that C_null grows like sqrt(log p): THE
    NULL ITSELF HAS THE GROWTH THE LANE ATTRIBUTES TO EC STRUCTURE.

    STEP 2 -- THE NULL'S FORCED VALUE IS ALREADY CONFIRMED, UNNOTICED.
    DEC-20260804-7af513 records a measured random-bijection value of 2.57 at
    p = 1009. The forced value is sqrt(ln 504 + 0.5772) = 2.6076. Relative
    error 1.46 per cent. The null instrument in this lane is therefore already
    demonstrated to be calibrated, at one prime -- which is a positive control
    that passed and was never used as one.

    STEP 3 -- DIVIDE THE COMMITTED TABLE BY THE NULL. From KN-FIND-d4f820's
    mean-C table and KN-FIND-4c9e71's adversarial-max table:
      p       C_null    C_mean   R_mean    C_max   R_max
      1009    2.6076    3.00     1.1505    3.90    1.4956
      4001    2.8597    3.50     1.2239    3.87    1.3533
      9001    2.9982    3.70     1.2341    4.11    1.3708
      50021   3.2717    3.84     1.1737    5.18    1.5833
    Least squares of ln R against ln p gives
      alpha_resid(mean) = +0.00413,  relative spread 7.0 per cent,
      alpha_resid(max)  = +0.01717,  relative spread 15.9 per cent.
    Against alpha = 0.055 and alpha = 0.079 on record. The mean's residual
    exponent is thirteen times smaller than the published one and its sign is
    not resolvable at four points; the max retains a genuine but much smaller
    residual, alpha about 0.017.

    STEP 4 -- WHY THE PUBLISHED EXPONENTS ARE WHAT THEY ARE. Over the measured
    range, a power law and sqrt(log p) are numerically indistinguishable. The
    power law reproducing sqrt(log p)'s growth exactly between two primes
    p_lo < p_hi is
      alpha_equiv = ln( sqrt( ln p_hi / ln p_lo ) ) / ln( p_hi / p_lo ),
    which evaluates to 0.05543 over [1009, 100003], 0.05732 over [1009, 50021]
    and 0.06281 over [1009, 9001). The four live values are 0.055, 0.0620,
    0.0624 and 0.079. THREE OF THE FOUR SIT INSIDE THE INTERVAL FORCED BY A
    PURE sqrt(log p) MODEL WITH NO EC-SPECIFIC GROWTH AT ALL. Model comparison
    on the same four points confirms it: fitting ln C against ln p gives
    R^2 = 0.865; against ln sqrt(ln p) gives R^2 = 0.911; against ln ln ln p
    gives R^2 = 0.930. The power law is not merely indistinguishable, it is the
    WORST of the three fits, and it is the only one that was extrapolated.

    STEP 5 -- WHY THE MODEL CHOICE IS NOT COSMETIC. At p = 2^256,
      sqrt(ln(N/2) + gamma_E) = 13.32,   p^{0.079} = 1.22 x 10^6,
    a ratio of 9.2 x 10^4. KN-FIND-4c9e71's own conclusion carries C to the
    m-th power in the Semaev yield error term; at m = 4 the two models differ by
    a factor 7.2 x 10^{19}. The lane's statement that the crypto-scale error is
    "negligible" is therefore not a conclusion the data licenses in either
    direction -- it may well be true, but the four points do not establish
    which model is being extrapolated, and the difference between the models is
    twenty orders of magnitude in the quantity of interest.

    STEP 6 -- WHAT WOULD SEPARATE THEM, AND WHAT IT COSTS. The model ratio
    p^{0.079}/sqrt(ln p), normalised to 1 at p = 1009, reaches 1.25 at
    p = 1.74 x 10^6 (2^{20.7}), 1.5 at p = 7.7 x 10^7 (2^{26.2}) and 2.0 at
    p = 1.5 x 10^{10} (2^{33.8}). A ladder at bits in {20, 22, 24, 26} therefore
    buys a separation factor of about 1.5 against a residual scatter measured at
    7 per cent -- comfortably decisive for the mean, marginal for the max, and
    both facts are stated in advance. The cost is bounded by the DFT: build the
    full DL table by iterating G once through the group (2^{26} point additions
    at the top rung), form the indicator over Z_N, take one real FFT of length
    N, and take the max. With numpy present this is seconds of FFT and minutes
    of group arithmetic per rung.

    STEP 7 -- WHAT THE RATIO WOULD MEAN IF IT IS FLAT. R(p) constant at about
    1.20 says the small-x factor base is 20 per cent LESS Fourier-flat than a
    random subset of the same size, uniformly in p. That is a real, EC-specific,
    quantitatively stated structural difference -- exactly the one
    DEC-20260804-7af513 was reaching for -- but it is a CONSTANT OFFSET, not a
    growing one, and an offset does not degrade with scale. The lane's
    substantive conclusion may therefore SURVIVE in a stronger and cleaner form
    while its quantitative form is withdrawn. Both halves are deliverables.

  novelty_status: unverified

  literature_context:
    - >-
      KN-FIND-d4f820 (C ~ p^{0.055}, four points, toy scale, confidence
      preliminary_empirical) and KN-FIND-4c9e71 (max C ~ O(1) approximately 4,
      then CORRECTED in-body at BATCH-107 to p^{0.079} for both mean and max).
      BOTH READ IN FULL THIS SESSION. Both have superseded_by: null, so neither
      supersedes the other, and their alpha values differ by 44 per cent.
    - >-
      DEC-20260804-7af513 (BATCH-102), READ THIS SESSION. It is the record that
      states "EC C = 3.13 > random C = 2.57 at p = 1009" and draws the
      large-scale conclusion audited here. Its random-bijection measurement is
      the one this proposal shows to be within 1.5 per cent of a derived forced
      value.
    - >-
      The extreme-value law for the maximum of |hat{1_F}(k)| over a random set
      is standard (the Salem-Zygmund / Gumbel circle of results). NOT READ --
      no source was opened for this record; the law was derived here from the
      complex CLT and the exponential maximum, and its numerical consequence was
      checked against the one committed measurement. It is a CANDIDATE TO CHECK
      and the experiment checks it directly by measuring the null rather than
      assuming it.
    - >-
      ANGLE-BRIEF section 4 item 1 (this session's scouting output) records a
      SCOUT-COMPUTED matched random-subset null giving alpha = 0.0624, and
      explicitly labels it "over Z_N, not E(F_p), so re-run in-harness before
      citing". This proposal does not cite that number as a measurement; it
      notes only that a fourth incompatible alpha exists and that the scout's
      own caveat is the design requirement the experiment adopts.

  lossy_projection_identifiability_audit:
    projection: >-
      (curve E, generator G, factor base F) --> the single real number
      C = max_k |hat{1_F}(k)| / sqrt(B), and then --> the ratio R = C/C_null.
    what_is_discarded: >-
      Everything except one order statistic of N-1 Fourier magnitudes: the
      curve, the factor base's membership, the identity of the maximising
      frequency k*, and the whole shape of the spectrum below the maximum.
    why_genuinely_lossy: >-
      Extremely lossy -- the fibre over a given C is enormous. But the audit's
      finding is that it is lossy in the WRONG PLACE: what it discards includes
      everything EC-specific, while what it retains is dominated by an
      extreme-value effect common to all sets of size B in Z_N.
    why_compatible_with_the_operations: >-
      C is compatible with the operation the lane cares about (enlarging p) only
      through the null's own N-dependence. That is the defect: the statistic
      propagates deterministically in p for reasons that have nothing to do with
      the elliptic curve, so a measured p-trend in C is not evidence of a
      p-trend in EC structure. R = C/C_null is the corrected projection, and it
      IS compatible: its p-dependence is exactly the EC-specific part.
    is_it_only_a_change_of_coordinates: >-
      CHECKED FOR BOTH FAILURE MODES. It is not the (Delta, Pi) = (x xor y, x*y)
      failure -- C genuinely discards information and is not invertible. It is
      not quite the mirror failure either (C is not constant across instances;
      DEC-20260804-7af513 measures a real 3.13-versus-2.57 gap). It is a THIRD
      and less-discussed failure that this record names: the projection retains
      a real signal, but that signal is dominated by an
      INSTANCE-INDEPENDENT component with a strong p-trend, so the p-trend of
      the projection is an artifact of the apparatus while its OFFSET is real.
      The repair is division by the null, and the reason the repair was never
      applied is that the null was measured at one prime and the comparison was
      then made against a THEORETICAL sqrt(log p) rather than against the
      measured curve.

  assumptions:
    - >-
      The normalised Fourier magnitudes at distinct frequencies are treated as
      independent when taking the maximum. This is standard and is the
      approximation the whole forced value rests on; it is checked empirically
      by the experiment's own null arm rather than assumed.
    - >-
      N = #E(F_p) is used in place of p in ln((N-1)/2). The difference is
      O(sqrt p / p) inside a logarithm and is numerically irrelevant at every
      scale considered, but the experiment must use the actual N.
    - >-
      The committed table values (3.00, 3.50, 3.70, 3.84; 3.90, 3.87, 4.11,
      5.18) are read AS COMMITTED and are not re-derived to make them agree.
      They carry the toy-scale and partial-k-range caveats their own records
      state (KN-FIND-d4f820 notes partial k-range at p = 2003 and 4001), and
      the experiment re-measures rather than reuses them.

  predictions:
    - metric: >-
        R(p) = C_EC(p)/C_null(p) with C_null MEASURED (not derived) on matched
        random B-subsets, at bits in {20, 22, 24, 26}, mean over >= 8 curves per
        rung
      direction: different
      minimum_effect: >-
        FORCED VALUE STATED BEFORE THE RUN: R in [1.10, 1.32] at every rung,
        centred near 1.20. Derived from the four committed points
        (1.1505, 1.2239, 1.2341, 1.1737) plus their 7 per cent scatter. An
        R outside [1.05, 1.40] at any rung falsifies the flat-offset reading.
    - metric: >-
        alpha_resid = least-squares slope of ln R against ln p over the four new
        rungs
      direction: lower
      minimum_effect: >-
        |alpha_resid| < 0.020, with the 95 per cent interval containing 0.
        Derived value on the committed points: +0.00413. If the new measurement
        returns alpha_resid >= 0.040 the EC-specific growth is real at the
        measured scale, this proposal's headline is FALSIFIED, and the lane's
        original conclusion is vindicated in a form it never had -- which is
        the single most useful outcome available here.
    - metric: >-
        C_null measured on matched random B-subsets, versus the derived
        sqrt(ln((N-1)/2) + gamma_E)
      direction: different
      minimum_effect: >-
        Relative error below 0.05 at every rung. Derived-versus-measured at the
        one existing point: 2.6076 versus 2.57, error 0.0146. IF THIS FAILS,
        THE INSTRUMENT IS BROKEN AND NO NEGATIVE MAY BE REPORTED.
    - metric: >-
        Model comparison on the new C_EC ladder: R^2 of ln C against ln p versus
        against ln sqrt(ln p)
      direction: different
      minimum_effect: >-
        Report both, and report the p at which they separate. On the committed
        four points the power law is the WORSE fit (0.865 versus 0.911), and any
        record that continues to extrapolate the power law must first show it
        wins on the extended ladder.
    - metric: >-
        Adversarial-max residual exponent alpha_resid(max) over the same rungs,
        with >= 20 curves per rung
      direction: lower
      minimum_effect: >-
        Below 0.030. Derived value on the committed points: +0.01717. This one
        is genuinely nonzero and is the quantity most likely to survive; it
        would replace 0.079 by about 0.017, a factor 4.6 reduction, and at
        p = 2^256 that is the difference between C^4 = 2 x 10^{24} and
        C^4 = 6 x 10^{9}.

  minimal_test:
    design: >-
      Three stages, cheapest first; stage 0 alone can terminate the line.
      STAGE 0 (zero compute, already performed for this record and to be
      independently reproduced): divide the four committed C values by the
      derived null and report the ratios, the residual slope, the alpha_equiv
      interval and the three model R^2 values. If an independent reproduction of
      this arithmetic does NOT show a flat ratio, the proposal is dead before
      any run and nothing further is executed.
      STAGE 1 (pure Python + numpy, minutes): the null arm ALONE, at all four
      bit sizes -- uniform random B-subsets of Z_N, full-range rfft, measured
      C_null against the derived value. Committed and hashed BEFORE any EC arm
      is generated.
      STAGE 2 (minutes to an hour): the EC arm at the same four bit sizes with
      matched B, then the ratio.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE (CAN FAIL). Uniform random B-subset of
        Z_N, same N, same B, same DFT range, same max statistic. FORCED VALUE
        DERIVED BEFORE THE RUN: C_null = sqrt(ln((N-1)/2) + gamma_E), e.g.
        2.6076 at p = 1009 and 3.2717 at p = 50021. It can fail in two visible
        ways -- the exponential approximation could break at small B/N, or the
        frequency-independence approximation could break -- and either failure
        invalidates the whole comparison rather than the EC arm.
      - >-
        POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR (PLANTED STRUCTURE). A
        factor base built as an arithmetic progression in the DL domain,
        F_plant = {DL = a + j d : j < B}. Its Fourier transform is a Dirichlet
        kernel with a spike of magnitude B at k = d^{-1} mod N, giving
        C_plant = sqrt(B) EXACTLY -- at B = 512 that is 22.6, versus a null of
        about 3.3. THE INSTRUMENT MUST RETURN sqrt(B) TO WITHIN 1 PER CENT ON
        THIS ARM. If it does not, the DFT, the normalisation or the max is
        wrong, and NO NEGATIVE RESULT MAY BE REPORTED from any other arm. This
        is the sensitivity demonstration the lane has never had.
      - >-
        GRADED CONTROL, >= 3 INTERIOR POINTS, MONOTONICITY REQUIRED. Interpolate
        between the planted AP and the random null by replacing a fraction
        theta in {0, 0.25, 0.5, 0.75, 1.0} of the AP's elements with uniform
        random ones. FORCED PREDICTION: C should decay monotonically from
        sqrt(B) toward C_null, approximately as
        sqrt( ((1-theta) B)^2/B + ln M ) -- i.e. essentially linearly in
        (1-theta) while the spike dominates. A QUANTITY THAT FAILS TO DECAY AS
        THE PARAMETER MEANT TO DESTROY IT INCREASES IS THE CANONICAL ARTIFACT
        TELL (inventor protocol section 3), and this graded arm is what makes
        that tell visible. A non-monotone response localises the fault to the
        maximisation or the normalisation rather than leaving "it did not work".
      - >-
        ORDERING CONTROL. The complete null arm at all four bit sizes is
        generated, measured, hashed and committed BEFORE the EC arm is
        generated. The decision rule (flat versus growing) is executed on the
        null arm first; if it labels the null "growing", the rule is measuring
        the extreme-value law rather than EC structure and must be rewritten
        before the EC arm is read.
      - >-
        ARCHIVE CHECK (zero compute). Prior measurements of the same observable
        in this corpus: KN-FIND-d4f820 (4 points, mean), KN-FIND-4c9e71 (190+
        measurements, adversarial max, plus the BATCH-107 correction),
        DEC-20260804-7af513 (one random-bijection null at p = 1009). The
        adversarial-max data are the RICHEST prior arm and must be reported
        alongside, not replaced.
    required_metrics:
      - measured C_null per rung with its derived forced value beside it
      - measured C_EC per rung, per curve, with B and the DFT range stated
      - the ratio R per rung and its least-squares slope with an interval
      - C on the planted-AP positive control against the forced sqrt(B)
      - the graded theta-sweep with monotonicity reported explicitly
      - the identity of the maximising frequency k* on both arms

  falsification_conditions:
    - >-
      alpha_resid(mean) >= 0.040 on the extended ladder. The EC-specific growth
      is real at measured scale, this proposal is wrong, and
      DEC-20260804-7af513's conclusion is vindicated with a proper null behind
      it.
    - >-
      Measured C_null departs from the derived forced value by more than 5 per
      cent at any rung. The extreme-value derivation is wrong; the headline
      arithmetic in this record rests on it and must be withdrawn.
    - >-
      The planted-AP positive control does not return sqrt(B) within 1 per cent.
      The instrument is broken; nothing may be reported.
    - >-
      The graded theta-sweep is non-monotone. The measurement is an artifact and
      the entire ladder is uninterpretable.
    - >-
      R(p) drifts outside [1.05, 1.40] at any rung. The flat-offset reading is
      wrong even if the growth conclusion is also wrong, and the honest
      deliverable becomes "neither model describes it".

  confounders:
    - >-
      B IS NOT HELD FIXED ACROSS RUNGS in the committed data, and C's null
      depends on N while its EC part may depend on B/N. The contract must fix
      the ratio B/sqrt(N) (or report C at several B per rung) and say which,
      because a B-trend masquerading as a p-trend is the most likely way this
      whole comparison is wrong -- IN EITHER DIRECTION.
    - >-
      PARTIAL k-RANGE. KN-FIND-d4f820 states that p = 2003 and 4001 used
      k = 1..300 rather than the full range. A partial max is biased DOWNWARD
      and by an amount that grows with N, which by itself could manufacture or
      destroy a p-trend. Every rung here must use the full range and say so.
    - >-
      FOUR POINTS, TWO PARAMETERS. Every fit discussed -- including this
      record's own residual slope -- has two degrees of freedom against four
      observations. No fit here is presented as an estimate with an error bar;
      the argument is that the models are INDISTINGUISHABLE, and that argument
      is robust to the fitting precisely because it is a statement about
      non-identifiability.
    - >-
      CURVE-TO-CURVE VARIATION. KN-FIND-4c9e71's max is over 152 curves at
      p = 1009 but only 6 at p = 50021. An adversarial maximum over a shrinking
      sample is biased downward at the top of the ladder, which flattens the max
      curve and works AGAINST this proposal's own reading of the max arm. It is
      recorded because it cuts against the author.
    - >-
      AUTHORSHIP ASYMMETRY. Refuting a standing internal conclusion is cheap and
      reads as rigour. The positive control (planted AP, forced sqrt(B)) is
      included specifically so that a null result costs something to reach.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT MOVED, NO SPEEDUP. This is a measurement audit.
      Pollard rho remains the baseline; sota_delta is zero on every attack axis.
    - >-
      TOY TIER, and it may not be raised. bits <= 26 is toy. The finding, if it
      holds, is that a toy-scale extrapolation to 2^256 was not licensed by its
      data -- which is itself a statement about toy data and does not establish
      anything at crypto scale in EITHER direction.
    - >-
      IT DOES NOT REFUTE H-PSEUDO, and must never be cited as doing so. H-PSEUDO
      is the assumption that C is small; this record argues that the measured
      GROWTH RATE of C is mostly the null's, which if anything makes H-PSEUDO
      MORE plausible, not less. The lane's substantive claim -- that EC
      x-coordinate sequences are measurably less Fourier-flat than random
      subsets -- may survive intact as a constant offset of about 1.20.
    - >-
      NO STATUS CHANGE to KN-FIND-d4f820, KN-FIND-4c9e71, DEC-20260804-7af513,
      DEC-20260804-0a4bc2, DEC-20260804-4f3a3b or DEC-20260804-53c89f is
      proposed or implied. Under AGENTS.md retrieval policy item 7 the
      contradictions among them are REPORTED, not adjudicated, and this record
      reports a fourth reading rather than picking among the existing three.
    - >-
      Forward guidance, mandatory: what remains open is (a) the identity of the
      maximising frequency k* and whether it is EC-structured (which is exactly
      what DEC-20260804-7af513's own exact_next_action asked for and which no
      record answers); (b) whether the 1.20 offset is a function of B/N; (c) the
      behaviour above 2^{26}, which no toy ladder reaches.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For F' a uniform random B-subset of Z_N with 1 << B << N, the values
        |hat{1_{F'}}(k)|^2/B over the (N-1)/2 conjugate-pair frequencies behave
        as i.i.d. Exponential(1), so
        E[max_k |hat{1_{F'}}(k)|]/sqrt(B) = sqrt(ln((N-1)/2) + gamma_E)(1+o(1)).
      rigorous_support: >-
        Marginal: complex CLT for a sum of B unit vectors at
        equidistributed phases gives the Exponential(1) limit for each fixed
        k != 0 with E|S(k)|^2 = B(1 - (B-1)/(N-1)). Joint independence across k
        is NOT proved and is the approximation; the covariance between
        frequencies k and k' is O(B/N) and vanishes in the stated regime, but
        that is a heuristic for the MAXIMUM, not a theorem about it.
      validation_plan: >-
        Directly measured by the experiment's own null arm at four bit sizes and
        many draws, against the derived value; already agrees at the one
        committed point (2.6076 derived versus 2.57 measured, 1.5 per cent).
        The falsification threshold is 5 per cent at any rung.
    - id: H2
      statement: >-
        The EC-specific content of the statistic is the ratio R = C_EC/C_null
        and not C itself; equivalently, C_EC(p) factors as
        C_null(p) * R(p) with R varying slowly.
      rigorous_support: >-
        NOT PROVED, AND THIS IS THE WEAKEST LINK. It is a modelling choice
        supported by the observation that dividing by the null removes 92 per
        cent of the fitted exponent for the mean and 78 per cent for the max. A
        multiplicative decomposition is the natural one for an extreme-value
        statistic but is not forced; an additive decomposition
        C_EC = C_null + delta would give a different residual, and the
        experiment must report BOTH decompositions rather than choosing.
      validation_plan: >-
        Report R = C_EC/C_null and delta = C_EC - C_null side by side at every
        rung, with the slope of each. If the two decompositions disagree about
        whether the residual grows, say so and do not pick.

  target_complexity:
    time_exponent: >-
      n/a for this audit; NO EXPONENT IS MOVED and no algorithm is proposed.
      The exponent this bears on is the constant c in the conditional Semaev
      ceiling exp(c sqrt(log N log log N)) that KN-FIND-d4f820 derives assuming
      H-PSEUDO: C enters that derivation to the m-th power in the yield error
      term, so the model choice for C(p) is upstream of a stated conditional
      complexity ceiling for this goal's main lane. The audit does not change
      the ceiling; it changes how much of it the data supports.
    memory_exponent: >-
      n/a for the claim. For the audit itself: one real FFT of length N, i.e.
      about N/2 complex128 words, about 0.5 GB at bits = 26 -- which is the
      binding constraint and is why the ladder stops there.
    best_known: >-
      Pollard rho at O(sqrt N) remains the best known prime-field ECDLP
      algorithm; the Semaev/Gaudry index-calculus line has no measured
      advantage at any scale in this corpus.
    hidden_overhead: >-
      The DL table construction is N point additions per rung, which is the real
      cost driver (2^{26} at the top rung) and is stated rather than hidden in
      an o(1).
    tradeoff_note: n/a -- no cost point is claimed.

  dominated_by: >-
    n/a (no result claimed). No attack, no cost point, so no Pareto row to
    dominate. Rows checked before writing n/a, across all three axes:
    TIME -- Pollard rho O(sqrt N) group ops, BSGS O(sqrt N); MEMORY -- rho with
    distinguished points at negligible memory, BSGS at O(sqrt N) memory, van
    Oorschot-Wiener at w memory; DATA/QUERIES -- all are query-free on public
    parameters, and the preprocessing row (Bernstein-Lange, NOT READ --
    relayed) charges O(N^{2/3}) preprocessing for an O(N^{1/3}) online phase.
    This record computes no DLP and appears on none of these rows.
  sota_delta: >-
    ZERO on every attack axis. Quantitatively the deliverable is: a reduction of
    the reported EC-specific growth exponent from 0.055-0.079 to +0.0041 (mean)
    and +0.0172 (max) once the derived null is divided out; a 1.5 per cent
    match between a derived forced value and the lane's single existing null
    measurement, previously unnoticed; the observation that the published
    alpha = 0.055 equals to three digits the 0.0554 forced by a pure
    sqrt(log p) model over the measured range; and a quantified consequence of
    the model choice at crypto scale of 7.2 x 10^{19} in the C^4 term. Against
    the four incompatible alphas currently on record, the delta is the removal
    of the disagreement's cause rather than a fifth value.

  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: >-
    0.80 that R(p) is flat within [1.05, 1.40] over bits 20-26 with
    |alpha_resid| < 0.02 for the mean. It is not higher because the committed
    four points span only a 50x range in p, because B was not held to a fixed
    ratio across them, because two of the four used a partial k-range that
    biases the max downward by an unknown p-dependent amount, and because the
    adversarial max genuinely does retain a residual (+0.017) whose behaviour at
    larger p is unknown. It is not lower because the null's forced value already
    matches the one measurement in the corpus to 1.5 per cent, because the
    residual for the mean is thirteen times smaller than the published exponent
    and of ambiguous sign, and because the published alpha = 0.055 coincides to
    three digits with the value forced by a no-EC-growth model, which is very
    hard to explain any other way.
    Separately: 0.95 that the experiment reaches a decisive reading, because
    stage 0 is arithmetic already done and stage 1 is minutes of numpy.
