idea:
  id: IDEA-20260905-0cc259
  title: Saturation defect measures the price of a favorable curve chart
  class: representation
  claim: 'For two rationally equivalent curve presentations, a favorable low-degree profile may come from omitted
    chart boundaries. Conjecture: the graded saturation defect of the graph ideal predicts which finite-parameter
    degree savings survive conversion to a common valid presentation.'
  mechanism: A rational model change has denominators; adjoining its graph creates an ideal with possible components
    on the denominator-zero locus. Saturation removes these components but may require higher degree. Track the
    graded module of elements killed by a power of the denominator. Its last occupied degree is a candidate explanation
    for a degree gap between the easy chart and the common model. The mechanism is chart-local algebra, distinct
    from the degree of the reduced output basis. The proposal deliberately targets constants and small arity, as
    required by the question; it supplies no new asymptotic ECDLP exponent.
