idea:
  id: IDEA-20260816-6bce56
  question_id: RQ-ECDSA-87625f
  added: '2026-08-16'
  title: 'Treat the exceptional-case trigger of an incomplete addition formula as an observable in
    its own right: enumerate, over every scalar on a toy curve, the exact rate at which a doubling-detection
    or zero-coordinate special case fires during scalar multiplication, and the exact information
    that trigger vector carries about the scalar.'
  class: representation
  claim: '(A) A REPRESENTATION CHOICE CREATES AN OBSERVABLE. Incomplete addition formulas -- Jacobian
    addition with an explicit doubling-detection test, or any formula with a zero-denominator special
    case -- resolve their exceptional cases by a branch. That branch is a per-operation bit, and across
    a scalar multiplication it forms an exception-trigger vector. Complete formulas have no such branch:
    for them the vector is identically empty. The observable is therefore created or destroyed by
    the choice of coordinate representation, which is exactly what makes it a representation-class
    object rather than an algorithmic one. (B) THE CLAIM. Both the exception RATE and the information
    the trigger vector carries about the scalar are exactly computable by exhaustive enumeration on
    a toy curve, because the group is small enough to walk every scalar and every intermediate point.
    The deliverable is: exception rate per scalar multiplication, its distribution over scalars, and
    I(k ; trigger vector) in bits, for each of several formula choices, at several toy curve sizes,
    with the rate''s scaling in the group order fitted and reported with residuals. (C) THE SELF-CALIBRATING
    PART. For a genuinely complete formula the exception rate is exactly 0 and the information exactly
    0 over the ENTIRE enumerated scalar space -- not approximately, not with high probability. That
    makes the experiment its own positive control for correctness: a nonzero value on the complete-formula
    arm is a proof that the implementation is not the formula it claims to be, which is a useful outcome
    in itself and costs nothing extra to obtain. (D) WHAT IS NOT CLAIMED. No attack. The observation
    is ASSUMED -- this environment has no physical measurement capability and cannot show that a branch
    on an exceptional case is visible to anyone. No claim about any deployed implementation''s formula
    choice. No claim that a nonzero exception rate is a vulnerability: a rate of 2^-13 with the trigger
    carrying a fraction of a bit is a measured obstruction, and reporting it as such is the point.
    (E) THE NEGATIVE IS THE LIKELY AND USEFUL OUTCOME. If exceptions fire at the birthday-scale rate
    and carry almost nothing, that is a number a later record can cite instead of an intuition.'
  mechanism: 'STAGE 1: implement, over a small prime field, several addition-formula variants: affine
    with explicit identity and inverse-point tests, Jacobian addition with a doubling-detection test,
    and a complete formula variant, each emitting an exception-trigger bit per group operation by
    direct instrumentation. STAGE 2: for each toy curve, enumerate all scalars k in [1, N-1] and run
    the scalar multiplication, recording the trigger vector. This is O(N log N) group operations and
    is cheap for N up to about 2^17. STAGE 3: compute the exception rate -- fraction of scalars with
    at least one trigger, and mean triggers per scalar multiplication -- exactly. STAGE 4: compute
    I(k ; trigger vector) exactly from the fibre sizes of the trigger-vector map, using the same exact-entropy
    machinery as the companion operation-word proposal in this batch, so the two share and cross-check
    an instrument. STAGE 5: run the complete-formula arm, whose values must be exactly zero, and the
    shuffled-trigger null. STAGE 6: fit the rate''s scaling against the group order across several
    curves and report the fit with residuals, labelled as a fit.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-ECDSA-87625f and RQ-INSTR-f8faa0. Grepped ledger/proposals/ and knowledge/ for
      'exceptional' (IDEA-20260811-97e244, IDEA-20260808-c4b462, IDEA-20260811-3e08e0, IDEA-20260807-464ff8,
      IDEA-20260804-84328c, IDEA-20260816-fd8f23), 'complete addition' (IDEA-20260816-e93eb8 plus
      KN-LIT-2011, KN-LIT-2709, KN-LIT-958, KN-LIT-3013), 'Jacobian', 'doubling detection', 'operation
      sequence'. Read titles of the closest hits and of IDEA-20260811-34f29d, which uses 'singular
      locus' language in the Semaev lane.
    results: '''exceptional'' hits six proposals; reading them showed the word used in the algebraic-geometry
      sense -- exceptional divisors, exceptional loci, singular loci of Semaev hypersurfaces, as in
      IDEA-20260811-34f29d''s singular-locus measurement at j-line degeneration loci -- and not in
      the implementation sense of a formula''s special case. ''complete addition'' hits one proposal
      and four knowledge/literature entries, which record complete formulas as technique. No record
      was found that instruments an addition formula''s exceptional-case branch, computes its firing
      rate by enumeration, or measures the information the trigger vector carries. The blacklist for
      RQ-ECDSA-87625f covers nonce-generator substitution and nonce-bias window shape; neither touches
      formula-level exceptions.'
    verdict: 'UNVERIFIED. Nothing is asserted about external literature. Assembled from known parts:
      complete versus incomplete addition formulas are recorded in this corpus as technique (KN-LIT-2011,
      KN-LIT-2709, KN-LIT-958, KN-LIT-3013), and exhaustive enumeration on toy curves is routine here.
      Claimed new only within this repository: treating the exceptional-case trigger vector as an
      observable with a measured firing rate and an exactly computed information content, and using
      the complete-formula arm''s forced zero as a correctness proof of the implementation.'
  object_first_candidate:
    tracked_object: The exception-trigger vector t = (t_1..t_L) in {0,1}^L, one bit per group operation
      in a scalar multiplication, recording whether that operation's formula took its exceptional
      branch. Followed across the whole scalar multiplication, for every scalar.
    lossiness: 'Genuinely lossy and extremely so. All coordinates, all field elements and the entire
      point sequence are discarded; a single bit per operation survives, and for most scalars that
      bit is zero at every position, so the vector collapses to the all-zero word for the overwhelming
      majority of the scalar space. That collapse is precisely what makes the measurement interesting
      rather than trivial: the fibre over the all-zero vector is nearly the whole group, and the information
      content lives entirely in the rare non-zero fibres. The retained part propagates because the
      exceptional condition at operation i is a predicate on the two input points at that step, and
      the point sequence is generated deterministically by the scalar, so t is a deterministic function
      of k with no auxiliary randomness anywhere.'
    propagation: 'One group operation acts on the tracked object by appending one bit: the value of
      the formula''s exceptional predicate on its two inputs -- for Jacobian addition, whether the
      two inputs are equal projectively; for affine, whether one input is the identity or the inverse
      of the other. Since the point sequence is determined by the scalar and the base point, the propagation
      is a deterministic map from the recoded scalar to a bit string, and for a complete formula the
      predicate is identically false so the map is constant, which is the forced-zero arm.'
    survival_score: Stated as the largest group order at which at least one scalar in the enumerated
      space still triggers an exception -- past which the object dissolves because exceptions become
      too rare to appear in a full enumeration -- and, more usefully, as the fitted scaling of the
      exception rate against the group order with residuals, so the dissolution point is a curve rather
      than a threshold. Reported alongside the fraction of the scalar space in non-zero fibres at
      each curve size.
  null_object_control: 'Two nulls, both in the same invocation. (i) COMPLETE-FORMULA ARM: the identical
    enumeration and the identical entropy machinery run against a complete addition formula, for which
    the exception rate and I(k ; t) are exactly 0 over the entire enumerated space by construction.
    This is simultaneously a null and a proof-of-correctness: a nonzero value here means the implementation
    is not the formula it claims to be. (ii) SHUFFLED-TRIGGER NULL: the observed trigger vectors are
    randomly permuted across scalars, breaking the association while preserving the marginal trigger-rate
    distribution exactly, and I(k ; t) recomputed by the identical code; this must return exactly
    0, since a permuted assignment is independent of the scalar. For the signal arm''s information
    to mean anything both nulls must return exactly zero to numerical tolerance. The shuffled null
    is essential because a highly skewed fibre distribution is where plug-in entropy computations
    most easily manufacture a value.'
  discriminated_from:
  - 'IDEA-20260811-34f29d and the other five proposals containing ''exceptional'': all use the word
    in the algebraic-geometry sense -- singular loci, exceptional divisors, degeneration loci of Semaev
    hypersurfaces -- and none instruments an implementation''s special-case branch. The vocabulary
    collides; the objects do not.'
  - 'IDEA-20260816-e93eb8 and the complete-addition knowledge entries KN-LIT-2011, KN-LIT-2709, KN-LIT-958,
    KN-LIT-3013: those record complete formulas as a technique and as a design choice; this measures
    the firing rate and information content of the branch that incomplete formulas have and complete
    ones do not, which the technique notes do not supply.'
  - 'The operation-word conditional-entropy proposal elsewhere in this batch: that object is the double-and-add
    pattern determined by the scalar''s recoding, present for every formula; this object is the exceptional-case
    predicate determined by the formula''s algebra, present only for incomplete ones. They are computed
    by the same entropy machinery on purpose, so the two can be cross-checked, but a routine can have
    a fully informative operation word and an identically zero trigger vector or vice versa.'
  - 'The execution-trace mutual-information estimator elsewhere in this batch: that samples and estimates
    with a floor; this enumerates and computes exactly, and the trigger vector is a specific semantic
    predicate rather than every branch in the program.'
  - 'Any real side-channel measurement: none is made, the observation is assumed, and the record grades
    its claim accordingly.'
  assumptions:
  - An observer of the exceptional-branch outcome is ASSUMED; this environment has no physical measurement
    capability and demonstrates none.
  - The implemented formulas are the formulas they are named as, which the complete-formula forced-zero
    arm partially verifies and which is otherwise checked against a reference scalar multiplication.
  - Scalars are uniform over the full range; a different scalar distribution changes the rate and
    the information.
  - A single fixed base point is used per curve, and the rate is base-point dependent, so several
    base points must be run or the number is not a property of the curve.
  - Exhaustive enumeration at group orders up to about 2^17 is affordable, which caps the reach of
    the exact computation.
  predictions:
  - metric: exception rate and I(k ; t) on the complete-formula arm
    direction: lower
    minimum_effect: forced value exactly 0 for both, over the entire enumerated scalar space; any
      nonzero value proves the implementation is not the claimed formula
  - metric: I(k ; t) on the shuffled-trigger null
    direction: lower
    minimum_effect: forced value exactly 0
  - metric: mean exception triggers per scalar multiplication for Jacobian addition with doubling
      detection, as the group order grows
    direction: lower
    minimum_effect: predicted to decrease roughly inversely with the group order, since the exceptional
      condition requires a coincidence among points; the run fits the exponent and reports residuals
      rather than pre-committing a value
  - metric: fraction of the enumerated scalar space with at least one trigger, at the largest tested
      curve
    direction: different
    minimum_effect: 'no pre-commitment: this is the quantity the enumeration exists to produce'
  minimal_test:
    design: 'Take one toy curve with group order near 2^13 and one fixed base point. Enumerate all
      scalars, run scalar multiplication under three formula variants -- affine with identity and
      inverse tests, Jacobian with doubling detection, and a complete formula -- recording trigger
      vectors. Compute exception rates and exact I(k ; t) via fibre counting in Fraction arithmetic,
      and run the shuffled-trigger null. This is a few core-minutes and settles everything that decides
      whether the multi-curve sweep is worth running: whether the complete-formula arm is exactly
      zero, whether the shuffled null is exactly zero, and whether the incomplete arms have a nonzero
      rate at all at this size. If the incomplete arms also fire zero times over the whole enumerated
      space, that is itself a clean measured result about how rare these cases are, obtained at trivial
      cost and reportable as an obstruction with a mechanism.'
    controls:
    - Complete-formula arm with forced zero rate and zero information, doubling as a correctness proof
      of the implementation.
    - Shuffled-trigger null preserving the marginal trigger distribution.
    - 'Reference-agreement control: every scalar multiplication''s RESULT is checked against an independent
      reference implementation, so a formula that silently computes the wrong point cannot be scored.'
    - 'Base-point control: the enumeration is repeated for at least three distinct base points per
      curve, since the rate is base-point dependent.'
    - 'Exact-arithmetic control: information computed in Fraction and in float, agreement to 1e-12.'
    - 'Cross-instrument control: the entropy machinery is the one used by the companion operation-word
      proposal, and both are run on a shared synthetic fibre distribution with a known answer.'
    required_metrics:
    - 'exception rate: fraction of scalars with at least one trigger, per (formula, curve, base point)'
    - mean triggers per scalar multiplication
    - I(k ; t) in bits, exactly
    - trigger-vector fibre-size distribution
    - complete-formula arm values
    - shuffled-null value
    - reference-agreement mismatch count
  falsification_conditions:
  - 'The complete-formula arm returns a nonzero exception rate or nonzero information: the implementation
    is not the claimed formula and no other arm is interpretable.'
  - The shuffled-trigger null returns nonzero information.
  - Reference agreement finds any scalar multiplication computing a wrong point.
  - I(k ; t) exceeds the entropy of the trigger vector's own marginal, which is impossible and would
    indicate a fibre-counting fault.
  - The exception rate is independent of group order across the whole sweep, contradicting the coincidence
    reasoning and requiring the mechanism to be restated.
  - Rates differ by orders of magnitude across base points without explanation, meaning the reported
    number is a property of a base point rather than of a formula.
  confounders:
  - The exception rate depends on the base point and on the curve's group structure, so a single curve
    and a single base point give a number that is not about the formula.
  - Implementations often handle the identity by a wrapper rather than by the formula, so where the
    exceptional test lives is an implementation choice that changes what the trigger vector records.
  - A highly skewed fibre distribution -- one enormous all-zero fibre -- makes information computations
    delicate, which is exactly why the shuffled null is mandatory.
  - 'Scalar recoding interacts with exceptional cases: a windowed method''s precomputation table can
    itself trigger exceptions, and whether those are counted must be fixed in advance.'
  - Small curves may have atypical group structure, so the fitted scaling across a handful of small
    orders is a fit over a range where structure varies.
  interpretation_limits:
  - The observation is assumed; nothing here demonstrates that an exceptional branch is visible on
    any device.
  - A measured rate at orders up to 2^17 is not a rate at 256 bits; only a fitted scaling with residuals
    is offered and it is labelled a fit.
  - A nonzero rate is not a vulnerability, and the record must not be cited as if it were.
  - Results describe these formula implementations at these conventions and do not characterise complete
    or incomplete formulas as classes.
  target_complexity:
    time_exponent: No attack exponent is claimed. The enumeration costs O(N log N) group operations
      at group order N, which is the measurement's cost and caps N near 2^17.
    memory_exponent: No attack exponent is claimed. Memory is the trigger-vector fibre dictionary,
      bounded by the number of distinct vectors observed, which is small because nearly all scalars
      share the all-zero vector.
    best_known: 'Within this repository the incumbent is nothing: no record measures an exceptional-case
      firing rate or its information content. The nearest recorded material is the complete-addition
      technique layer, KN-LIT-2011, KN-LIT-2709, KN-LIT-958 and KN-LIT-3013, which records the formulas
      without attaching an observation model or a rate.'
    hidden_overhead: 'The hidden cost is base-point dependence: the honest version of this measurement
      is a distribution over base points, not a single number, and that multiplies the enumeration
      cost by the number of base points sampled. A second hidden cost is that where the identity check
      lives -- inside the formula or in a wrapper -- silently changes the object, and keeping that
      convention stable across formula variants is fiddly and easy to get wrong without noticing.'
  dominated_by: 'n/a (no result claimed). No attack cost is produced and no time/memory/data frontier
    row applies; all three axes were considered and none is populated. Explicitly not null: the frontier
    question does not arise rather than being won. The nearest cost-bearing object in this lane is
    IDEA-20260815-1ac849''s memory-charged nonce-leakage frontier, which this neither joins nor competes
    with.'
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitatively: produces an exception
    rate per formula per curve per base point, together with an exactly computed I(k ; t) in bits
    and a fitted scaling in the group order with residuals, where the current corpus state records
    complete versus incomplete formulas as a design choice with no rate and no information content
    attached. No attack time, memory or query count is claimed to change.'
  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'That the complete-formula arm returns exactly zero, confirming the implementation:
    0.85, with the residual risk in wrapper-level identity handling rather than in the formula. That
    the shuffled null returns exactly zero: 0.95, since it is structurally forced and a failure indicates
    a fibre-counting bug that is easy to find. That the incomplete arms show a nonzero exception rate
    at enumerable curve sizes at all: 0.6, because the exceptional conditions require coincidences
    whose probability falls with the group order and may already be below one over the enumerated
    space at 2^13. That I(k ; t) is large enough to be worth citing rather than a vanishing fraction
    of a bit: 0.25 -- this is the part most likely to come back as a measured obstruction, which the
    proposal treats as a usable outcome rather than a failure.'
