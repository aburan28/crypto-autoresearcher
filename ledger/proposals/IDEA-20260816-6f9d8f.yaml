idea:
  id: IDEA-20260816-6f9d8f
  question_id: RQ-HQC-001
  added: '2026-08-16'
  title: 'Take the cyclic autocorrelation profile of a secret support - the multiset of differences
    j minus i over ordered pairs of support positions - as the tracked object of HQC''s quasi-cyclic
    ring, apply the lossy-projection test to it honestly, and measure at which step of the encryption
    pipeline it stops propagating: the integer convolution, the mod-2 reduction, or the truncation'
  class: representation
  claim: '(A) THE OBJECT. For a support S contained in Z_n define its cyclic autocorrelation A_S(d)
    = #{(i,j) in S x S : j - i = d mod n}. This is the canonical shift-invariant summary of a quasi-cyclic
    secret and it is the object this proposal follows through HQC''s pipeline, rather than the support
    itself. (B) THE LOSSY-PROJECTION VERDICT, STATED BEFORE ANY RUN. A_S is genuinely many-to-one:
    it forgets the rotation phase entirely, and beyond rotation there exist distinct supports sharing
    an autocorrelation (the classical turnpike/homometry phenomenon). So this is a real projection
    and not a change of coordinates - and the claim specifies how much is lost, by counting collision
    classes exhaustively at small n. (C) THE PROPAGATION LAW, AND EXACTLY WHERE IT BREAKS. Over the
    INTEGER lift, the product x*y in Z[X]/(X^n - 1) has coefficient counts given by the convolution
    of indicator vectors, and autocorrelations compose deterministically: A_{x*y} is a fixed bilinear
    function of A_x, A_y and the cross-correlation. Passing to F_2 replaces each count by its parity,
    and THAT is where determinism dies - cancellation is exactly the information the projection cannot
    carry. Truncation to the first N coordinates then destroys shift-equivariance outright. The claim
    is that the object propagates deterministically for exactly one step, in distribution for two,
    and not at all after truncation, and that each of those three statements is separately checkable.
    (D) WHAT IS NOT CLAIMED. No attack, no key recovery, no distinguisher with a stated advantage,
    no speedup, no security consequence, and nothing about deployed parameters. In particular it is
    NOT claimed that the autocorrelation profile is recoverable from anything an adversary sees; the
    pipeline runs with the secret known, as an instrumented measurement of propagation, not as an
    attack simulation. No attack, break, speedup or security consequence is claimed here or would
    follow from a run. No statement is made about what the published literature does or does not contain;
    this environment cannot reach external literature. No direction is declared impossible.'
  mechanism: 'STAGE 1 (exhaustive, zero risk): at n in {11, 13, 19, 29} and weights w in {3, 4, 5},
    enumerate every support, compute every autocorrelation profile, and count the collision classes
    - how many distinct supports share a profile, and how many of those coincidences are explained
    by rotation alone. This measures the lossiness as an integer, which is what section 2 asks for
    and what prose usually substitutes for. STAGE 2 (exact): verify the integer-lift composition law
    symbolically on random pairs at small n by computing both sides, so that ''propagates deterministically
    for one step'' is a checked identity and not an assertion. STAGE 3 (measurement): define the parity-survival
    ratio rho(n, w) = (fraction of coefficients of the integer product whose parity is predictable
    from the autocorrelation data alone), estimate it by direct sampling, and watch it fall as w grows
    - the structural tell of section 3 is that a quantity which SHOULD decay does decay. STAGE 4:
    apply truncation and measure how much of the block-level statistic is still a function of the
    profile. Refutation at any stage is informative: if STAGE 1 finds that collisions are essentially
    only rotations, the projection loses almost nothing beyond phase and the object is close to a
    change of coordinates - which under the protocol is a reason to abandon it, recorded with its
    number.'
  novelty_status: unverified
  novelty_screen:
