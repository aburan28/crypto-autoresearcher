      it is the nearest neighbour: it uses the ADDITIVE ENERGY of the secret support, which is the
      scalar sum over d of A_S(d)^2 - one number derived from the object proposed here.'
    results: '`grep -ril "autocorrelation" ledger/proposals/` returns 8 files, none under RQ-HQC-001:
      the matches are IDEA-20260807-c36472, IDEA-20260811-c72830, IDEA-20260811-7734c5 and five others
      in unrelated areas. IDEA-20260805-15258a is the nearest HQC record and uses additive energy
      - a scalar contraction of this object - to argue that the decoding failure rate is a PER-KEY
      quantity while the analytic model forces it to be constant. IDEA-20260805-db5afa uses the ring''s
      evaluation character and its two CRT factors, a different invariant entirely. `grep -ril "necklace"`
      returns exactly one file, IDEA-20260805-f58517, unrelated to HQC. `grep -ril "circulant"` returns
      14 files, of which the HQC ones are the ISD-side records. No record in ledger/proposals/ treats
      the autocorrelation as a FUNCTION of d and asks where it stops propagating.'
    verdict: 'UNVERIFIED. No agent here can read external literature, so no claim is made about what
      is published; the turnpike/homometry phenomenon is named as elementary combinatorics, not as
      a citation. Claimed NEW relative to this repository: treating the autocorrelation as the tracked
      object rather than as a scalar summary, and making the location of propagation failure - integer
      step, parity step, or truncation step - the measured deliverable. ASSEMBLED FROM KNOWN PARTS:
      the additive-energy contraction is IDEA-20260805-15258a''s; the shift-invariance of the fixed-weight
      law is elementary; the exhaustive small-n enumeration technique is the same pattern EXP-HQC-bd30c0
      uses for its n = 7 parity gate.'
  object_first_candidate:
    tracked_object: 'The cyclic autocorrelation profile A_S : Z_n -> Z_{>=0} of a fixed-weight support
      S, followed through the integer convolution, the mod-2 reduction, and the truncation to N coordinates.
      Where the pipeline handles pairs of secrets the tracked object is the triple (A_x, A_y, C_{x,y})
      with C the cross-correlation.'
    lossiness: 'LOSSY, and the loss is measured rather than asserted. A_S determines S only up to
      rotation at best, and at small n exhaustive enumeration shows strictly more collapse than rotation:
      the STAGE 1 deliverable is the integer count of profile classes versus support classes, i.e.
      how far the projection is from injective. What it discards - the phase and the homometric partner
      - is discarded compatibly with the ring, because ring multiplication commutes with rotation,
      so the discarded part is exactly a symmetry of the target operation. That is why the retained
      part still propagates at the integer level. The mod-2 reduction is where compatibility ends,
      and saying so is the honest content of this field.'
    propagation: 'One step of the target operation is one ring multiplication. On the integer lift
      it acts on the tracked object deterministically: the coefficient-count vector of x*y is the
      cyclic convolution of the indicator vectors, and its autocorrelation is a fixed bilinear expression
      in (A_x, A_y, C_{x,y}), which STAGE 2 checks as an identity. Reduction mod 2 then applies a
      coordinatewise parity that the profile does not determine, so propagation degrades from deterministic
      to distributional, and the parity-survival ratio rho(n, w) quantifies the degradation. Truncation
      to the first N coordinates is not shift-equivariant and therefore does not act on shift-invariants
      at all.'
    survival_score: 'Exactly one deterministic step, two distributional steps, zero after truncation
      - and each of the three is given a number rather than a word: the STAGE 1 collision count, the
      STAGE 3 parity-survival ratio rho(n, w) with its decay in w, and the STAGE 4 fraction of block-level
      failure variance still explained by the profile. The prediction that makes this falsifiable
      is that rho DECAYS in w; a rho that stays flat as w grows is, by docs/inventor-protocol.md section
      3''s structural tell, the signature of an artefact in the measurement rather than of surviving
      structure.'
  null_object_control: 'The null object is a uniformly random support of the same size w in the same
    Z_n, run through the IDENTICAL STAGE 1 to STAGE 4 pipeline in the same invocation. For a random
    support the autocorrelation is flat in expectation with mean w(w-1)/(n-1) off zero and a known
    variance, so the null fixes what ''no structure'' looks like for every statistic reported. FOR
    THE SIGNAL ARM TO MEAN ANYTHING THE NULL MUST SHOW: (i) collision counts at STAGE 1 consistent
    with rotation-only collapse plus the chance rate, so that any excess collapse measured on HQC-sampled
    supports is an excess and not the baseline; (ii) a parity-survival ratio rho that also decays
    in w, at the same rate - if the null''s rho decays identically then the decay is generic and carries
    no information about HQC; (iii) STAGE 4 explained-variance consistent with zero. Note honestly
    that HQC''s own secrets ARE uniform fixed-weight supports, so the null and signal arms coincide
    at STAGE 1 by construction; the arms separate only from STAGE 2 onward, where the signal arm''s
    supports are coupled through the shared public h and the null arm''s are not. That coincidence
    is stated rather than hidden, and it is why STAGE 1 is reported as a lossiness measurement rather
    than as a signal.'
  discriminated_from:
  - IDEA-20260805-15258a tracks the additive energy of the secret support - the single number sum_d
    A_S(d)^2 - and predicts per-key DFR dispersion. This proposal tracks the whole function A_S(d)
    and asks about PROPAGATION rather than dispersion; its deliverable is the location at which the
    object stops propagating, which 15258a's scalar cannot express. Their measurements share no estimator.
  - IDEA-20260805-db5afa tracks the evaluation character of F_2[X]/(X^n - 1) and derives the exact
    parity identity w(e') = w_e mod 2. That is a homomorphism to F_2; the autocorrelation is not a
    homomorphism and carries n numbers rather than one.
  - IDEA-20260813-c34e09 and IDEA-20260813-a46301 quotient an ISD search graph by the shift orbit.
    They use the same symmetry group but on the solver side, and never form an autocorrelation.
  - A plain distinguisher on the public key would compute a statistic of h and test it. Nothing here
    is computed from public data; the pipeline runs with the secret known, which is why no distinguisher
    and no advantage is claimed.
  - H-HQC-18d1b4's mubar_k tracks the block-failure vector, an object downstream of everything measured
    here; the autocorrelation dies at truncation, which is upstream of where mubar_k begins.
  assumptions:
  - n is prime with 2 primitive mod n; verified at run time by computing ord_n(2), fail-closed.
  - 'Exhaustive enumeration at n <= 29 and w <= 5 is affordable: C(29,5) = 118755 supports, so STAGE
    1 is seconds of CPU and its result is a ground truth rather than an estimate.'
  - The integer-lift composition identity is checkable symbolically at small n and, once checked,
    holds at every n by the same elementary argument; the check is a guard against implementation
    error, not against the mathematics.
  - Fixed-weight sampling is shift-invariant, so the law of A_S is a well-defined object of the ring
    and not an artefact of a sampler convention.
  - No conclusion transfers to deployed parameters; none is offered.
  predictions:
  - metric: number of autocorrelation-profile classes divided by number of rotation classes of supports,
      at n = 29, w = 5
    direction: lower
    minimum_effect: 1.0
  - metric: parity-survival ratio rho(n, w) as w increases from 3 to 8 at fixed n = 227
    direction: lower
    minimum_effect: a monotone decrease across the w ladder, with the last value at most half the
      first; if rho is flat in w the measurement is treated as an artefact per inventor-protocol section
      3 and no structural conclusion is drawn.
  - metric: fraction of block-level failure variance explained by the autocorrelation profile after
      truncation
    direction: lower
    minimum_effect: 'no pre-commitment to a magnitude, with reason: this is the quantity the proposal
      exists to measure for the first time in this repository, and inventing a threshold for it would
      be fabricating a prior.'
  minimal_test:
    design: 'STAGE 1 alone discriminates the cheapest and most important claim, and costs seconds.
      Enumerate all C(29,5) = 118755 supports of weight 5 in Z_29, compute each autocorrelation profile
      as a length-29 integer vector, hash the profiles, and count: distinct profiles, distinct rotation
      classes, and the number of profile classes containing supports from more than one rotation class.
      If that last count is zero, the projection loses only the phase and the object is close to a
      change of coordinates - the protocol''s own reason to drop it, recorded with the number that
      justified dropping it. If it is non-zero, the projection is genuinely lossy and the remaining
      stages are worth their cost. The same code run on random supports of the same weight gives the
      null, in the same invocation, at no extra cost.'
    controls:
    - Random-support null arm run through the identical STAGE 1 to STAGE 4 code path in the same invocation.
    - 'Rotation-only baseline: report collisions attributable to rotation separately from the excess,
      so the excess is a difference and not a total.'
    - Symbolic identity check on the integer-lift composition law before any sampling.
    - Decay-in-w structural tell on rho, with a flat rho treated as an instrument artefact rather
      than a finding.
    - Exhaustive ground truth at n <= 29 used to calibrate the sampled estimates at larger n.
    required_metrics:
    - count of distinct autocorrelation profiles and of rotation classes at each (n, w)
    - excess collision count beyond rotation, with its chance-rate baseline
    - maximum and mean deviation in the symbolic composition-law check
    - parity-survival ratio rho(n, w) across the w ladder, with confidence intervals
    - fraction of post-truncation block-failure variance explained by the profile
    - identical values of all of the above on the random-support null arm
  falsification_conditions:
  - 'STAGE 1 finds excess collisions equal to zero at every tested (n, w): the projection loses only
    the phase, the object is a change of coordinates, and the proposal is closed with that integer
    as its obstruction.'
  - 'The symbolic composition identity fails: the implementation is wrong, and no measurement is reportable
    until it passes.'
  - 'rho does not decay in w: per inventor-protocol section 3 the measurement is an artefact and the
    structural reading is withdrawn.'
  - 'The random-support null reproduces every signal-arm number: the profile carries nothing specific
    to HQC''s pipeline and the null is recorded as controlled.'
  - 'Post-truncation explained variance is indistinguishable from zero: the object dies at truncation,
    which is the predicted outcome, and the recorded obstruction is the measured upper bound on what
    survives.'
  confounders:
  - 'Small-n effects: at n <= 29 the profile has few degrees of freedom, so collision counts may be
    dominated by pigeonhole rather than by structure - controlled by reporting the chance-rate baseline
    explicitly.'
  - 'Weight scaling: rho depends on w and n jointly, so a decay in w at fixed n could be a density
    effect rather than a structural one; the ladder therefore varies w/n and w separately.'
  - Hash collisions in the profile-classing step masquerading as autocorrelation collisions; controlled
    by exact vector comparison on every hash collision.
  - The coupling between x and y through the shared h, which exists in the signal arm and not in the
    null, could produce STAGE 2 differences that have nothing to do with autocorrelation.
  - Truncation position interacting with n and n_2 arithmetically rather than structurally.
  interpretation_limits:
  - Every number here is computed with the secret known; nothing is computed from data an adversary
    would see, so no distinguisher and no advantage is claimed or implied.
  - The measured lossiness is a property of (n, w) at the enumerated sizes and does not extrapolate
    to deployed n without a numbered heuristic, which is not offered.
  - A surviving profile after truncation would be a statement about the law of e-tilde, not about
    exploitability.
  - The turnpike/homometry phenomenon is invoked as elementary combinatorics verified here by enumeration,
    not as an appeal to literature.
  target_complexity:
    time_exponent: No attack exponent is claimed. STAGE 1 costs C(n, w) * n integer operations, exhaustive
      and exact; STAGE 3 costs O(T * n log n) for T samples.
    memory_exponent: No attack memory exponent is claimed. STAGE 1 holds one hash table of at most
      C(n, w) entries - under 10^6 at the declared sizes - and STAGE 3 holds O(n) accumulators.
    best_known: The incumbent within this repository is IDEA-20260805-15258a's additive-energy framing,
      which is the scalar contraction of the same object and is a proposal rather than a measured
      result, so there is no measured incumbent for the propagation question at all.
    hidden_overhead: 'The lower-order term that bites is the definition of ''predictable parity''
      in rho: making that precise enough to compute without smuggling in the answer is genuine human
      design work, and a sloppy definition would produce a number that decays for definitional reasons.
      The second overhead is that STAGE 4''s explained-variance regression needs enough failure events
      to be stable, which pushes its trial count far above STAGE 1''s cost even though STAGE 1 is
      what the proposal is really about.'
  dominated_by: n/a (no result claimed). There is no attack cost triple to place on a frontier, so
    there is no frontier row to check; recording 'null' here would be a fabrication under AGENTS.md
    rule 5. On the measurement axis, IDEA-20260805-15258a is not a competitor because it is unexecuted,
    and EV-HQC-b71230 measures a downstream object at a scale this proposal does not attempt.
  sota_delta: no attack; conceptual/measurement contribution only. Quantitatively the delta is that
    the repository currently holds zero values for the profile-collision count, for rho, and for post-truncation
    explained variance; this produces the first values for all three, so the comparison is against
    absence rather than against a number.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'By part. (i) That STAGE 1 finds strictly more collapse than rotation
    alone at n = 29, w = 5: ~0.75 - homometric pairs are common in small cyclic groups, but at this
    size the count could be tiny. (ii) That the integer-lift composition identity checks out: ~0.97,
    it is elementary and the check is a guard on the code. (iii) That rho decays in w rather than
    staying flat: ~0.8. (iv) That anything survives truncation with measurable explained variance:
    ~0.15 - truncation destroys shift-equivariance and this is the step I expect to kill the object,
    which is precisely why locating the death is the deliverable. (v) That the whole thing yields
    a recorded, reusable obstruction: ~0.9.'
