idea:
  id: IDEA-20261007-424b6f
  question_id: RQ-OAKLEY-264353
  status: proposed
  added: '2026-10-07'
  approved_by: null
  title: >-
    Chained-S_3 versus S_6 head-to-head on identical instance bytes at n equal 5
  class: control
  claim: >-
    On identical instance bytes (same sibling curve E over F_{2^{5p}}, same
    recorded tower basis, same V equal F_{2^p}, same target R) at p in {4, 5},
    the chained-S_3 formulation and the direct S_6 Weil-restriction
    formulation agree on decomposability for every tested target, and the
    per-attempt charged-cost ratio (WDSat conflicts on the chain versus F4
    F_q-operations on S_6 where an engine exists, else WDSat on both Boolean
    presentations) is measured with a factor-2 resolution; any disagreement on
    decomposability, or a ratio outside the pre-registered band, is reported
    as the instrument finding, not averaged away.
  mechanism: >-
    OBJECT FRAME. Representation pair, both arms: R1 x-coordinates in the same
    recorded tower basis, membership x in F_{2^p} as sigma^p(x) equal x; arm A
    keeps three auxiliary field elements (chain), arm B eliminates them
    (resultant S_6) then quotients by S_5. Operation set Sigma: translation by
    factor-base elements only, both arms. TRICHOTOMY: Class I, partial-action
    on both sides; the branching event (R decomposes) is formulation
    independent, which is exactly what the identity control checks.
    LOSSY-PROJECTION TEST against Sigma: tracked object the relation vector,
    lossy and Sigma-compatible in both arms; passes twice, once per arm, so
    any measured difference is formulation cost, never a different object.
    KN-OPEN-020: linear subfield factor base in both arms, scoped-out class,
    no escape claimed. THE MECHANISM. Semaev chaining trades one degree-16
    equation for four low-degree equations plus auxiliaries; the test isolates
    that trade from every confounder (curve, target, V, solver luck) by
    holding the bytes fixed and varying only the presentation. WHAT IS ADDED
    beyond the siblings: IDEA-20260922-af7396 prices the SAT chain and
    IDEA-20260922-70a67c prices the Groebner S_6, but neither runs them on the
    same bytes; this is the control that lets the two prices be compared
    without formulation-confusion laundering.
  novelty_status: speculative
  citations:
    - ref: IDEA-20260922-af7396
      provenance: internal
      claim: >-
        The chained-S_3 affine-propagation structure, the k equal 4 versus 5
        branch, and the t equal 3 bridge measurement this head-to-head extends
        to t equal 5 on both presentations.
      verified_by: 'Pasted task context of RQ-OAKLEY-264353 brief; not independently retrieved in this session'
    - ref: IDEA-20260922-70a67c
      provenance: internal
      claim: >-
        The symmetrised S_6 ideal-degree target D equal 2^{20} and the K_5
        decomposition into F4, FGLM and root steps that arm B must report
        separately.
      verified_by: 'Pasted task context of RQ-OAKLEY-264353 brief; not independently retrieved in this session'
    - ref: Semaev summation-polynomial framework (recalled pointer, unopened)
      provenance: recalled
      claim: >-
        Recalled only: S_m recursion by resultants with degree 2^{m-2} per
        variable; the chain-versus-direct equivalence is textbook content.
      verified_by: null
  assumptions:
    - >-
      Cells p in {4, 5} with fully recorded objects (modulus, tower basis,
      a equal 0, b outside F_{2^p}, subgroup order); targets drawn from the
      prime-order subgroup, 20 per cell, mixed SAT and certified-UNSAT at
      p equal 4 via the exhaustive 4-loop.
    - >-
      Unconditional audit: solution-set identity is exact mathematics and the
      cost ratio is a charged measurement; no distribution heuristic is
      invoked, so heuristic_assumptions is empty by design, not by omission.
    - >-
      Where no F_{2^p} Groebner engine is available, arm B runs as WDSat on
      the Booleanised S_6 presentation and the record is labelled
      formulation-only, never solver-versus-solver.
  proof_search_map:
    bottleneck: >-
      Formulation-confusion: every existing tower number mixes presentation
      effects with solver and instance effects. The bottleneck is experimental
      hygiene, not a theorem step.
    baseline_embedding:
      parameter_slice: >-
        The t equal 3 bridge (chained t equal 3 versus direct S_4 on
        Trimoska cells) runs first; the t equal 5 comparison is trusted only
        if the t equal 3 identity holds exactly there.
      reproduction_check: >-
        At p equal 4, the exhaustive 4-loop certificate must agree with both
        arms on SAT versus UNSAT for all 20 targets before any ratio is
        quoted.
    observation_collision:
      observable: >-
        Per-target outcome pair plus per-arm charged cost, so identity and
        ratio are never collapsed into one statistic.
      distinct_preimage_search: >-
        A large chain advantage comes both from genuine affine propagation and
        from WDSat order luck favouring the chain encoding; discriminate with
        forced x_5-first versus x_1..x_4-first orders on identical bytes, and
        an advantage that vanishes under order swap is luck, not structure.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fiber over one fixed (curve, R, V) triple under change of
          presentation, with cost and outcome as the fiber coordinates.
        predicted_gain: >-
          Separates presentation cost from instance hardness with no modelling,
          the cheapest valid discriminator on the RQ.
    quantifier_order: >-
      FORALL tested targets: outcome(chain) equal outcome(S_6) after
      projection; the cost ratio is an EXISTENTIAL measurement per target,
      reported as a distribution, never a single mean.
    method_ceiling:
      strongest_certifiable_claim: >-
        'On these bytes the formulations agree (or disagree at named targets)
        and the charged-cost ratio distribution is R.' Nothing about other
        solvers, other V, or larger p.
      nearby_object_control: >-
        PROVES-TOO-MUCH: the same harness at t equal 3 must show exact
        identity; a t equal 3 disagreement invalidates the harness, and no
        t equal 5 number is reported.
    proof_obligations:
      - claim: Chain solutions project exactly onto S_6 solutions per instance.
        responsibility: correctness
      - claim: Both arms read byte-identical instances.
        responsibility: correctness
      - claim: Cost-ratio distribution with failure-inclusive charging.
        responsibility: runtime
    not_applicable_reason: null
  predictions:
    - metric: outcome agreement rate across 40 targets
      direction: different
      minimum_effect: >-
        Exactly 40/40 agreement predicted; any single disagreement is the
        headline finding and triggers instrument quarantine.
    - metric: per-target charged-cost ratio chain versus S_6
      direction: different
      minimum_effect: >-
        Distribution reported with quartiles; a median ratio outside [0.25, 4]
        in either direction is a formulation effect worth naming.
    - metric: order-swap sensitivity of the ratio on identical bytes
      direction: different
      minimum_effect: >-
        Median ratio shift under order swap below a factor 2, or the ratio is
        published as order-dependent with both numbers.
  minimal_test:
    design: >-
      Build p equal 4 and 5 sibling cells with recorded objects. Emit both
      presentations from one builder run per target so the bytes are identical
      by construction. Run WDSat default, XG-off, and both forced orders on
      the chain, and the available Groebner or Boolean-S_6 arm on the same
      bytes. Certify p equal 4 outcomes with the exhaustive 4-loop. Report
      agreement table plus ratio distributions; quarantine and diagnose before
      any pricing use on disagreement.
    controls:
      - identity control: exhaustive 4-loop certificate versus both arms at p equal 4
      - shape-matched random Boolean null per presentation shape (agreement must be vacuous there by construction check)
      - size-matched random V at p equal 4 on both arms (presentation effect must persist off the subfield)
      - order controls x_5-first versus x_1..x_4-first within the chain arm
      - propagation control XG on versus off within the chain arm
    required_metrics:
      - per-target outcome pairs and agreement rate
      - per-target charged costs per arm per configuration with failures included
      - ratio distribution quartiles per cell
      - wall-clock and peak RSS per run
  falsification_conditions:
    - Any outcome disagreement on identical bytes: the identity claim is false as implemented and the builders are quarantined, which is itself the result.
    - Ratio median inside [0.5, 2] under all orders: the formulations are cost-equivalent here and the RQ prices only solvers, not presentations.
    - Order swap moves the median ratio by more than a factor 4: the ratio is a solver-order artifact and no formulation number transfers.
  confounders:
    - Booleanisation choices (tower basis, ANF encoding) differ legitimately between arms; record both encodings byte-exactly and rerun any outlier target with swapped encodings.
    - Groebner engine heuristics versus WDSat search luck are solver effects, not formulation effects; the formulation-only label applies unless both solvers run both arms.
    - p equal 5 tower-degree coincidence flagged as in the siblings.
  interpretation_limits:
    - A ratio at p in {4, 5} is a ratio at those cells; endpoint transfer rides on IDEA-20261007-ece173 heuristics, not this record.
    - Agreement here does not certify either builder beyond the tested cells.
    - Nothing about deployed-system security.
  heuristic_assumptions: []
  target_complexity:
    time_exponent: >-
      Moves no exponent: both arms attack the same O~(q^{1.6}) Gaudry stage;
      the measured object is the constant ratio between presentations.
    memory_exponent: >-
      Working memory per arm reported as measured; no cross-arm memory claim.
    best_known: >-
      Parallel rho 2^{75.8} and 2^{91.3} as the background comparator; this
      control selects which presentation price the RQ trusts, beating neither.
    hidden_overhead: >-
      Encoding and preprocessing times charged per arm explicitly; no hidden
      setup cost on either side.
    tradeoff_note: >-
      None claimed; parallel over targets.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  dominated_by: >-
    n/a (no result claimed): this is a control, not an attack or a bound; it
    is dominated as an attack by rho and GHS like every PDP step, and
    dominated by nothing as an instrument after checking every
    index-calculus row of the pasted map, since no row runs both
    presentations on identical tower bytes.
  sota_delta: >-
    Zero on every ECDLP cost axis. Against program state: removes the
    formulation confounder from the two sibling prices, the cheapest
    uncertainty reduction on the RQ.
