idea:
  id: IDEA-20260809-5a78e7
  question_id: RQ-FRODO-3260cc
  added: '2026-08-09'
  title: FrodoKEM's sampling table is treated as a given object by every design in the lane; its
    design space is finite, exactly enumerable at the standardized parameters, and the machinery
    to place the published table on its own (divergence, DFR) Pareto frontier has already been
    derived and pointed the other way
  class: algorithm
  claim: 'GOAL-FRODO-001 selects FrodoKEM on reachability in its own words: ''This is the rare
    target whose load-bearing quantities can be checked AT the standardized parameters instead
    of at toy scale, because the error distribution has support |z| <= 12 and the failure rate
    is a convolution over it. The claim tier available here is therefore higher than this program
    usually gets.'' Both designs then take the published table as the given object and ask only
    whether its printed consequences reproduce -- H-FRODO-8ea540 audits the divergence-to-bit-security
    conversion, H-FRODO-e0c651 checks the 13 integers against internal identities (C1 normalisation
    p_0 + 2*sum p_k = M exactly with M a power of two, returning 2^16 on the Frodo-640 excerpt;
    C2 second moment; C4 unimodality; C5 kurtosis). Neither asks whether the table is the right
    point in its own design space. That space is finite and exactly enumerable at exactly the
    reachability the goal claims for itself: 13 non-negative integers summing (with the doubling)
    to M = 2^16, and H-FRODO-e0c651 has ALREADY DERIVED that the failure rate''s dependence on
    the table factors through the single scalar v = Var(chi), with d log2 DFR / dv in closed form.
    That is precisely the machinery needed to trace the (Renyi divergence, DFR) trade-off over
    admissible tables and place the published one on it, and no record does or proposes to. The
    goal''s completion criteria are met by reproduction plus an audit; whether a strictly better
    table exists at the same precision budget is never asked.'
  mechanism: 'Reuse e0c651''s own derived chain in the other direction. Because DFR depends on
    the table only through v = Var(chi), and the Renyi divergence against the rounded Gaussian
    is a second exact functional of the same 13 integers, the admissible set at fixed M = 2^16
    and fixed support can be searched (or bounded by convexity in v) to produce the EXACT (divergence,
    DFR) Pareto frontier at Frodo-640/976/1344, with the published table plotted on it. Controls
    come free and are already specified: e0c651''s C1 and C4 are hard feasibility constraints
    on any candidate table, and its Rademacher null (chi_null(+-1) = 1/2, collapsing the convolution
    to an exact binomial the pipeline must return bit for bit) is the null object, satisfying
    the inventor protocol''s null-before-belief rule without new work. Outcome is a real object
    measurement at cryptographic parameters either way: either the published table is Pareto-optimal
    in its own space -- a clean supporting result with a quantitative sota_delta of exactly zero
    -- or it is dominated, with the dominating table exhibited and the margin stated in bits.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - All five FRODO proposals sit on the same side of the object. IDEA-20260805-390957 derives
      'five exact identities the FrodoKEM sampling distribution must satisfy' -- transcription
      and consistency, and e0c651's Part 1 says so ('WHAT IS NOT ASSERTED. Whether the published
      failure rates reproduce. That is the question.'). IDEA-20260805-411b60 is the mutation control
      with a derived magnitude ('p_12 -= 1, p_0 += 2', dv = -2*144/M exactly, predicted -0.167
      bits at Frodo-640, band [-0.33, -0.08]); the perturbed table there is INSTRUMENTATION, deliberately
      one unit off to test the pipeline, not a candidate in a search. IDEA-20260805-57fc49 solves
      backwards from the published Renyi order for the sample budget. IDEA-20260805-f16b44 distinguishes
      scale from tail-shape errors in a DFR. Not one varies the table as a design variable, and
      the title scan over all 459 proposals for a table Pareto frontier returns nothing.
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: auditing the published table''s
      printed consequences, which both existing designs already do. The object is the TABLE AS
      A DESIGN VARIABLE.'
    tracked_object: The 13 non-negative integers of the sampling table, tracked through the pair
      (Renyi divergence against the rounded Gaussian, decryption failure rate).
    one_step_propagation_rule: Perturbing one integer changes v = Var(chi) by an exact amount
      and moves both functionals deterministically; H-FRODO-e0c651 already derives d log2 DFR
      / dv in closed form.
    newness_score: The object is standard; what is new here is treating a standardized table as
      a point in a finite, exactly enumerable design space rather than as a given.
  lossy_projection_identifiability_audit:
    projection: the sampling table -> its (divergence, DFR) coordinates.
    what_is_discarded: 'The table''s identity: distinct tables can share coordinates.'
    is_it_only_a_change_of_coordinates: 'NO -- the map is many-to-one and the fibre is exactly
      what a Pareto search explores. Honest caveat: DFR depends on the table only through the
      scalar v, so the DFR axis is one-dimensional and the frontier may be trivially characterised,
      which would itself be the answer.'
    mirror_failure_check: CHECKED. The frontier must be able to contain the published table. If
      it does, the result is a clean supporting negative with sota_delta exactly zero -- a legitimate
      outcome the design must be willing to return.
  null_object_control:
    primary_null: 'H-FRODO-e0c651''s RADEMACHER NULL: chi_null(+-1) = 1/2 collapses the convolution
      to an exact binomial the pipeline must return bit for bit. It is already specified and comes
      free.'
    secondary_nulls:
    - C1 (normalisation p_0 + 2*sum p_k = M exactly, M a power of two) and C4 (unimodality) are
      hard FEASIBILITY constraints every candidate table must satisfy.
    - The published table must reproduce its own printed divergence and DFR before any candidate
      is considered.
  assumptions: []
  predictions:
  - metric: position of the published table on the exact (divergence, DFR) Pareto frontier at
      Frodo-640/976/1344
    direction: different
    minimum_effect: On the frontier (supporting negative, delta zero) or dominated (with the dominating
      table exhibited and the margin in bits). Both are decisive.
  minimal_test:
    design: Enumerate or convexity-bound the admissible tables at fixed M = 2^16 and fixed support;
      compute both exact functionals; plot the published table on the frontier at all three parameter
      sets, with the Rademacher null and the feasibility gates run first.
    controls:
    - Rademacher null (exact binomial)
    - C1 normalisation and C4 unimodality feasibility gates
    - published-table reproduction
    required_metrics:
    - exact (divergence, DFR) frontier per parameter set
    - published table's position and margin
    - dominating table exhibited, if any
  falsification_conditions:
  - 'The published table is Pareto-optimal: a clean supporting result with a quantitative sota_delta
    of exactly zero.'
  - 'The Rademacher null does not return the exact binomial: the pipeline is wrong and nothing
    is admissible.'
  - 'The admissible set is so constrained that only the published table is feasible: the design
    space is a point and the question dissolves.'
  confounders:
  - '''Admissible'' depends on the precision budget and the support bound; state both or the frontier
    is not well defined.'
  - Renyi divergence is order-dependent; fix and state the order.
  - A dominating table is not a recommendation -- changing a standardized table has costs far
    outside this record's scope.
  interpretation_limits:
  - Arithmetic at cryptographic parameters, with no scaling argument -- which is why the goal
    selected FrodoKEM. It is not an attack and claims no security reduction.
  - A dominated published table is an optimality statement, not a vulnerability.
  heuristic_assumptions:
  - id: HEUR-FRTAB-1
    statement: The (divergence, DFR) pair captures the design trade-off the published table was
      chosen to balance.
    rigorous_support: None; the designers may have optimised other criteria (sampling cost, constant-time
      implementability) not represented in either functional.
    validation_plan: State the two-criterion scope explicitly; a table dominated on these two
      axes may be preferred on a third, and the record must say so.
  target_complexity:
    time_exponent: n/a -- no attack; an optimality statement about a published table
    memory_exponent: n/a
    best_known: The published FrodoKEM table and its printed divergence/DFR
    hidden_overhead: Sampling cost and constant-time implementability, which this two-criterion
      frontier does NOT represent
    tradeoff_note: A table dominated on (divergence, DFR) may be preferred on a criterion not
      modelled here.
  dominated_by: The published FrodoKEM parameter sets on every axis this record does not model.
    No attack row is added.
  sota_delta: ZERO on every attack axis; no attack is proposed. This is the one place in the never-launched
    slice where a crypto-tier ARITHMETIC claim about a standardized-track object is reachable
    with no scaling argument at all, and unlike the two existing designs its deliverable is a
    measurement of an object rather than a re-derivation of someone else's number -- the object-first
    shape docs/inventor-protocol.md asks for. FrodoKEM is on a live ISO/CFRG track, so a dominated-table
    result would be actionable and a Pareto-optimal result is a genuine, citable negative.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 0.9 that the exact frontier is computable at all three parameter sets.
    0.65 that the published table sits on it -- designers usually do optimise these two -- which
    is the modal and still citable outcome. 0.2 that it is measurably dominated. 0.05 that any
    dominance is large enough to matter operationally.
