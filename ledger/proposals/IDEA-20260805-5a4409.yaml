idea:
  id: IDEA-20260805-5a4409
  question_id: RQ-MLKEM-003
  goal_id: GOAL-MLKEM-004
  added: '2026-08-05'
  title: >-
    Parseval energy budget of the dual-FFT distinguisher: an exact conservation
    law that forces the across-candidate second moment from the bin-collision
    structure alone, and turns MATZOV.Nf's independence assumption into a single
    signed number

  class: control

  claim: >-
    In the FFT variant of the dual attack the scores of ALL p^{k_fft} candidate
    secrets are, exactly and by construction, the discrete Fourier transform of
    one table T indexed by the rounded dual-vector images
    u_i = round_p(A_fft^T x_i mod q). Plancherel/Parseval on the group Z_p^{k_fft}
    therefore gives an EXACT identity, with no independence assumption anywhere,

        sum_{s' in Z_p^{k_fft}} |That(s')|^2  =  D * sum_{u} |T[u]|^2,
        D = p^{k_fft},   sum_u |T[u]|^2 = N + C,
        C := sum_u sum_{i != j in bin u} cos(2 pi (z_i - z_j)/q).

    The independence structure that MATZOV.Nf embodies -- one correct candidate
    of amplitude N*abar and D-1 wrong candidates that are exchangeable with
    E|That|^2 = N -- therefore FORCES a value for the collision energy,
    C_forced = (N^2 abar^2 - N)/D, before any data are taken. The single number
    delta := (C_measured - C_forced)/N is the entire second-moment content of
    the independence assumption, and it maps to Nf's own output by exactly the
    algebra Nf itself uses: N_required = Nf * (1 + delta). delta > 0 means Nf
    UNDERSTATES the sample requirement (the dual attack is harder than the model
    says); delta < 0 means it overstates it. THE PROPOSAL CLAIMS NO VALUE OF
    delta AND NO ATTACK. It claims that delta is well defined, exactly computable
    in O(N + D) arithmetic from data GOAL-MLKEM-004 has already archived once the
    measurement is placed in MATZOV's own geometry, carries a derived direction,
    and admits a matched null whose forced value is derived before the run and
    which can fail.

  object_first_candidate:
    tracked_object: >-
      The FFT TABLE T: Z_p^{k_fft} -> C of the dual-attack distinguisher --
      equivalently the pair (bin-occupancy histogram of the rounded dual images
      u_i, per-bin coherent phase sum of exp(2 pi i z_i / q)). This is the object
      the attack actually carries: after the sieve, the distinguisher's entire
      remaining computation is a function of T and of nothing else. It is
      followed through: sieve pool (x_i, y_lat,i) -> unconstrained image
      w_i = A_fft^T x_i mod q -> bin u_i = round_p(w_i) -> phase z_i = x_i . b
      mod q -> T[u] -> That(s') -> the max over candidates -> N.
    established_families_off_limits: >-
      Off-limits as the primary lens for this proposal: (a) ESTIMATOR
      DIFFERENCING -- subtracting two cost functions and reading the sign, the
      family whose named obstruction closed GOAL-MLKEM-003 (DEC-20260803-64b55b);
      (b) AD HOC SCORE STATISTICS -- score means, sd_ratio_to_iid, "effective
      independent candidate" counts, near-miss/uniform candidate-group contrasts,
      the family that produced six refuted observables across GOAL-MLKEM-004's
      six batches, five of them shown forced by construction after the fact;
      (c) PRIMAL/BDD lattice attacks; (d) decryption-failure and FO-transform
      attacks; (e) implementation side channels and comparison-conformance work
      (GOAL-MLKEM-001/002's lane); (f) coefficient-isometry and orbit-fusion
      scoring (H-MLKEM-007's lane). The dual-sieve family itself is NOT off
      limits, and that is deliberate and declared: this proposal does not offer a
      new attack in that family, it audits an identity internal to it, which is
      the one move declaring the family off-limits does not forbid.
    newness_score: >-
      Parseval on a finite abelian group is elementary and certainly known; the
      FFT trick's own correctness proof uses it. What is new here, and what this
      corpus does not contain, is its use as a PRE-REGISTERED FORCED VALUE
      separating the part of the across-candidate score distribution that is
      determined by construction from the part that is not. Six batches of
      GOAL-MLKEM-004 discovered the forcing of their observables only in review,
      one batch at a time (EV-MLKEM-b43de0, EV-MLKEM-ba6c25, EV-MLKEM-d777f0,
      EV-MLKEM-2cd08b). The conservation law computes which observables are
      forced BEFORE the batch is dispatched. Additional newness: no batch of this
      campaign ever instantiated a k_fft block at all, so the object did not
      exist in any measured design (see IDEA-20260805-bb7668).
    testability_score: >-
      Very high and nearly free. The measured quantity is
      C = sum_u |T[u]|^2 - N, computable in O(N + D) complex accumulations from
      the bin indices and phases alone -- no pair enumeration, no FFT required
      for the primary metric. The FFT is run anyway as a known-answer control:
      sum_{s'} |That|^2 / D must equal sum_u |T[u]|^2 to floating-point
      precision, and that control CAN fail if the implementation is wrong.
    survival_score: >-
      The identity survives everything: it is exact for any pool, any lattice,
      any modulus, any rounding, and it holds for the null objects as well as the
      real one. That is a strength for bookkeeping and a limit on interpretation:
      an identity cannot by itself say the model is wrong. What it does is fix
      the second moment, leaving exactly one free quantity -- the SHAPE of the
      energy distribution across candidates, which is what the union bound
      actually consumes. The proposal is explicit that Parseval decides the
      energy and does NOT decide the max.

  mechanism: >-
    DERIVED HERE. The MATZOV.Nf source was READ this session at the repository's
    own pin (github.com/malb/lattice-estimator, commit
    3e48ef421ec256afddb3e7d2249a77eab6e9ba12, the pin recorded in
    tools/sage_free_estimator/README.md as the commit EXP-MLKEM-015 used);
    estimator/lwe_dual.py lines 526-558 are quoted in the hypothesis record
    H-MLKEM-0c0a6e. Nothing below is recalled from the MATZOV paper, which has
    NOT been read; every statement attributed to the paper is labelled.

    GEOMETRY (MATZOV's, not the campaign's). LWE in row convention:
    A in Z_q^{m x n}, b = A s + e mod q. Nf line 540 fixes
    k_lat = n - k_fft - k_enum, and its sieved lattice has dimension m + k_lat.
    Split the secret coordinates accordingly, A = [A_lat | A_fft],
    s = (s_lat, s_fft), and take k_enum = 0 for the measurement (enumeration
    multiplies the candidate count and is orthogonal to the identity below).
    The sieved dual lattice is
        L = { (x, y_lat) in Z^m x Z^{k_lat} : y_lat = A_lat^T x mod q },
    of dimension m + k_lat and determinant q^{k_lat}. For each sieve vector put
        w_i := A_fft^T x_i mod q  in Z_q^{k_fft}   (NOT short, NOT constrained)
        z_i := (x_i . b) mod q.
    The exact identity
        x_i . b = (A_lat^T x_i).s_lat + (A_fft^T x_i).s_fft + x_i . e
                = y_lat,i . s_lat + w_i . s_fft + x_i . e   (mod q)
    is what the attack rests on: y_lat,i is short because it was sieved and
    s_lat is small, so the first term is small; x_i . e is small; and the second
    term is the candidate-dependent phase. THIS IS THE GEOMETRY NO BATCH OF
    GOAL-MLKEM-004 MEASURED IN -- every batch sieved the FULL d = m + n dual
    lattice, in which every y coordinate is short, which is exactly why batch 2
    proved the admissible (k_enum, k_fft) set empty (compare.py S2,
    BATCH-f75059).

    THE TABLE AND THE TRANSFORM. Bin u_i := round(p * w_i / q) mod p in
    Z_p^{k_fft} and accumulate
        T[u] := sum_{i : u_i = u} exp(2 pi i z_i / q).
    The distinguisher's score for candidate s' in Z_p^{k_fft} is
        score(s') = Re sum_u T[u] exp(-2 pi i u . s' / p) = Re That(s'),
    computed for all D = p^{k_fft} candidates at once by one FFT. This is the
    whole point of the FFT trick; the substitution of u.s'/p for w.s'/q is the
    modulus-switching approximation that Nf charges through its factor
    exp(k_fft/3 * (sigma_s pi / p)^2).

    THE CONSERVATION LAW. Orthogonality of characters of Z_p^{k_fft} gives, with
    no heuristic and for any T whatsoever,
        sum_{s' in Z_p^{k_fft}} |That(s')|^2 = D * sum_u |T[u]|^2.                (I)
    Expand the right-hand side over the pool:
        sum_u |T[u]|^2 = sum_u | sum_{i in B_u} e^{2 pi i z_i / q} |^2
                       = N + C,
        C := sum_u sum_{i != j in B_u} cos(2 pi (z_i - z_j)/q),                   (II)
    where B_u is the set of pool indices landing in bin u and N = |pool|. C is
    the COLLISION ENERGY. It is a sum over ordered colliding pairs only; vectors
    that share no bin contribute nothing.

    WHAT THE INDEPENDENCE STRUCTURE FORCES. Nf's N is exactly
    abar^{-2} * (k_enum H + k_fft log p + log(1/mu)) with
    abar = exp(-2 (lsigma_s pi / q)^2) the per-vector advantage and mu = 0.5
    (lines 552-556, read). That form is the classical "signal N*abar must beat
    the max of D exchangeable mean-zero scores of variance N/2" bookkeeping and
    nothing else: there is no covariance term. Under that structure the total
    energy is
        sum_{s'} |That|^2 = (N abar)^2 + (D - 1) * N,
    so by (I) and (II) the collision energy is FORCED to
        C_forced = (N^2 abar^2 - N) / D.                                          (III)
    Define the departure
        delta := (C_measured - C_forced) / N.                                     (IV)
    Then the mean wrong-candidate energy is N * (1 + delta * D/(D-1)), i.e.
    N(1 + delta) to leading order, and the distinguishing condition
    N abar >= sqrt(N (1 + delta) ln D) gives
        N_required = N_Nf * (1 + delta).                                          (V)
    (V) is not an analogy: it is Nf's own inequality with its one modelled
    variance replaced by the measured one. The correction in bits is
    log2(1 + delta), signed, monotone, and available with no grid, no
    sensitivity curve, and no interpolation -- which is what DEV-5 denied to
    every observable in six batches of GOAL-MLKEM-004 (EV-MLKEM-2cd08b:
    "NO OPERATIONAL DIRECTION EXISTS, IN EITHER SENSE, ANYWHERE IN THIS
    CAMPAIGN").

    WHY delta IS NOT TRIVIALLY ZERO, AND WHY IT IS NOT TRIVIALLY LARGE. Two
    mechanisms push it in opposite directions and neither is modelled by Nf.
    (a) COLLISION EXCESS. w_i = A_fft^T x_i mod q is a q-ary linear image of a
    SHORT x_i. The sieve pool is pairwise reduced, so its Gram matrix is
    constrained; whether that constraint biases the bin occupancy away from
    multinomial is exactly the unresolved question, and a positive bias raises C
    above (III). This is the same physical quantity that the batch-6 red team's
    ROWPERM decomposition located -- "the ALIGNMENT between the pool's Gram
    matrix and the candidate phase matrix" (EV-MLKEM-2cd08b) -- reached here by a
    closed form rather than by an ablation ladder. The present framework predicts
    that residual rather than discovering it.
    (b) SKIRT LEAKAGE. Candidates adjacent to s_fft in the bin lattice are
    partially coherent; their energy is part of the left side of (I) but is not
    part of the (N abar)^2 term in (III). Nf charges this through
    exp(k_fft/3 (sigma_s pi/p)^2), an inflation of N rather than an energy
    entry, so (III) as written attributes skirt energy to the wrong candidates
    and biases delta UPWARD by a computable amount. The experiment therefore
    reports delta both with and without an explicitly declared coherent
    neighbourhood excised, and the difference is the measured skirt, which is a
    direct test of that never-measured factor.

    COST BOOKKEEPING. Per attempt: one accumulation pass over the pool, O(N)
    complex adds, plus O(D) to square and sum; the FFT control is O(D log D).
    Inverse success probability: none -- the measurement is deterministic given
    the pool; replication is over independent instances and seeds, not over
    retries. Memory: D complex numbers, which is the attack's own table, so the
    measurement is charged no more memory than the object it measures.

    WHAT THE LAW DOES NOT DECIDE, STATED HERE RATHER THAN DISCOVERED IN REVIEW.
    Parseval fixes the SECOND MOMENT of the score distribution across candidates.
    The union bound consumes the MAXIMUM. At fixed second moment, positive
    dependence among the D scores lowers the expected maximum, and the exact
    amount is not determined by (I). So the honest decomposition is: delta is the
    forced part, and D_eff := exp(max_{wrong} score^2 / (N (1 + delta)))
    -- the effective candidate multiplicity -- is the free part. Both are
    reported; only delta is claimed to be forced. That separation is the
    proposal's methodological content and is what six batches of ad hoc
    observables lacked.

  novelty_status: unverified

