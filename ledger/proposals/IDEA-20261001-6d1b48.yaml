  title: >-
    IS BAILEY HW-DP ITERATIONS-TO-HIT GEOMETRIC AT TOY KOBLITZ SCALE?
    Measure the iterations-to-distinguished-point distribution under a
    normal-basis HW≤c walk against Geometric(p) with p = Pr[HW≤c], and
    report whether mean/variance and KS distance stay inside a
    pre-registered band — before any Semaev-yield composition.

  class: heuristic_validation

  claim: >-
    EXP-BINSTD-a3cfee recorded a DP-arm replay-cost histogram (mean≈14.03,
    max=83, N=96 at n=17,c=4) but did not test whether iterations-to-DP
    follow Geometric(p) with p = binomial HW density. CLAIM: on binary
    Koblitz analog Y^2+XY=X^3+1 at n∈{17,23}, for cutoffs c with modeled
    p∈[2^{-6},2^{-3}], the empirical iterations-to-DP distribution
    matches Geometric(p) within a Stage-0-frozen KS / mean-ratio band
    (HEUR-H1), OR systematically overshoots mean by a factor ≥1.5
    (walk-structure artifact). CLAIM TIER: observational / instrument.
    NO exponent. NO break. NO n=131 transfer. Does not revive HEUR-H1
    yield ratios; prices the DP byproduct the composition line needs.

  mechanism: >-
    OBJECT FRAME. Representation R1: normal-basis HW on F_{2^n} abscissae
    of Koblitz analog points. Operation set Sigma: Frobenius-power walk
    + HW cutoff (Bailey-style DP; Class I partial-action on the walk).
    Trichotomy: Class I. Lossy-projection test: HW≤c is a lossy filter on
    the walk state; the geometric law is the null that the filter acts as
    independent Bernoulli each step. OFF-LIMITS: F2 Semaev yield not run
    here (composition deferred). KN-OPEN-020: not a new factor-base class.
    WHAT IS NEW: a pre-registered geometric-law test of Bailey DP
    iterations-to-hit at the exact cells where a3cfee left only a
    histogram without a distributional null.

