  heuristic_assumptions:
    - id: HEUR-BINSTD-6d1b48-H1
      formal_statement: >-
        FORALL tested (n,c) with modeled p=Pr[HW≤c]∈[2^{-6},2^{-3}]: the
        empirical iterations-to-DP sample of size ≥200 has KS distance to
        Geometric(p) ≤ D* (Stage-0 frozen) AND mean / (1/p) ∈ [0.7,1.4].
      random_model_justification: >-
        Rigorous: i.i.d. Bernoulli(p) trials give Geometric(p) waiting
        times with mean 1/p and Var (1-p)/p^2. Classical: elementary
        geometric distribution. Transfer to Frobenius-power walks on
        E(F_{2^n}) is the heuristic under test (dependence / mixing).
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        KS > D* on ≥2 cells, OR mean ratio outside [0.7,1.4] on ≥2 cells,
        OR byte-identical replay failure on any trusted trail.

  predictions:
    - metric: ks_distance_to_geometric
      direction: lower
      minimum_effect: '≤ D* (frozen in Stage 0) on ≥2 cells'
    - metric: mean_over_one_over_p
      direction: different
      minimum_effect: '∈ [0.7,1.4] under H1; ≥1.5 signals walk artifact'

