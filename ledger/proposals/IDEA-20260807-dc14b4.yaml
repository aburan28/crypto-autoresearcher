idea:
  id: IDEA-20260807-dc14b4
  question_id: RQ-ICINV-475b5e
  added: '2026-08-07'
  title: >-
    A ZERO-COMPUTE DECISION PROCEDURE THAT PREDICTS EVERY L1 MEASUREMENT BEFORE
    IT IS RUN: a cost functional is isogeny-class invariant whenever it factors
    through the ISOGENY CATEGORY -- through the characteristic polynomial of
    Frobenius, equivalently through the rational Tate module -- and there are
    exactly two escape hatches, the INTEGRAL structure (group of points, Tate
    lattice, End as an order) and the PLANE EMBEDDING (the Weierstrass
    equation), so every candidate functional in the lane can be assigned a
    falsifiable invariance prediction in advance
  class: mechanism

  claim: >-
    (A) THE TEST, IN THREE QUESTIONS ASKED IN ORDER.
      TEST A -- DOES C FACTOR THROUGH THE ZETA FUNCTION? By Tate's isogeny
        theorem over finite fields, two elliptic curves over F_p are
        F_p-isogenous if and only if they have the same characteristic
        polynomial of Frobenius x^2 - t x + p, equivalently the same #E(F_p),
        equivalently V_ell(E) = T_ell(E) tensor Q_ell are isomorphic as Galois
        modules for one (hence every) ell != p. Therefore ANY functional
        expressible as a function of (p, t) alone -- equivalently of the zeta
        function, equivalently of the rational Tate module with its Frobenius --
        is a class invariant, unconditionally and with no measurement.
        VERDICT: INVARIANT. The axis is closed for it.
      TEST B -- DOES C DEPEND ON THE INTEGRAL STRUCTURE? An isogeny
        phi : E -> E' of degree d induces an injection T_ell(E) -> T_ell(E')
        which is an isomorphism of Z_ell-LATTICES only when ell does not divide
        d. So the isogeny class contains genuinely different integral
        structures, and everything computed from them can vary: the group
        E(F_p) = O/(pi - 1) up to isomorphism [Lenstra, citation to be
        re-verified], hence the rational ell-torsion for small ell, hence the
        factorisation type of the division polynomials, hence End_{F_p}(E) as an
        ORDER (the volcano level) and h(End(E)). VERDICT: MAY VARY, and if it
        varies it varies ALONG THE VOLCANO -- which is the one place where
        variation is locally detectable and the T5 gate can be passed.
      TEST C -- DOES C DEPEND ON THE PLANE EMBEDDING? A Weierstrass equation is
        not even an isomorphism invariant: (a, b) and (u^4 a, u^6 b) present the
        same curve. So any functional reading coordinates varies ALREADY inside
        one isomorphism class. VERDICT: VARIES, BUT NOT BECAUSE OF THE CLASS --
        the isogeny axis is the wrong axis for it, and its correct null is the
        gauge orbit (IDEA-20260807-6eb96b).

    (B) THE ONE-SIDED POWER, STATED BEFORE ANYONE MISREADS IT. Test A is
    SUFFICIENT for invariance and NOT necessary. A functional that does not
    visibly factor through (p, t) may still be invariant for a reason the test
    cannot see -- IDEA-20260807-0ff796 is exactly such a case: the arity-2
    relation count is p - 1 - t, but one learns that only after discovering that
    the relation locus is F_p-isomorphic to E, which no syntactic test predicts.
    So the procedure's verdicts are: TEST A PASSED means PROVED INVARIANT; TEST
    A FAILED means NOT DECIDED, and the functional goes to Tests B and C for a
    prediction that is a HYPOTHESIS, not a theorem. Any write-up that reports a
    Test-A failure as "predicted to vary" without that qualifier is overclaiming.

    (C) THE PRE-REGISTERED PREDICTION TABLE, which is the deliverable. Applying
    the three tests to the lane's declared candidate functionals:
      f1 relation yield at arity 2, random factor base -- TEST A PASSED via
        IDEA-20260807-0ff796's derivation (value B^2(p-1-t)/p^2). INVARIANT.
      f2 relation yield at a COORDINATE WINDOW -- TEST C: the window is not an
        isomorphism invariant. VARIES BY GAUGE, not by class.
      f3 solving degree / first-fall degree of the Semaev system -- TEST A
        fails; TEST B applies through the rational 2-torsion and the
        transversality of the ideal (IDEA-20260807-0a3272, IDEA-20260807-427cf3)
        AND Test C applies through the window. PREDICTION: any genuine class
        component is a two-level stratification by rational 2-torsion, riding on
        top of a larger gauge component.
      f4 summation-polynomial support / nnz -- TEST C in form (it reads (a,b))
        but the reading is only through the VANISHING pattern, which IS an
        isomorphism invariant; so it is gauge-invariant and reduces to
        j in {0, 1728}. PREDICTION: constant on every class with D_0 outside
        {-3, -4}, two-valued otherwise (IDEA-20260807-8b9486).
      f5 field-side factor-base Fourier flatness -- TEST C applies (the set X_E
        is a coordinate set) but the ell-infinity norm is DILATION-INVARIANT, so
        the gauge component is zero; and it is pinned to a factor 3 by
        Parseval/Weil regardless (IDEA-20260807-692e9b). PREDICTION: variation
        of at most a factor 3 across ALL curves, so nothing class-specific can
        be large.
      f6 group-side flatness, the H-PSEUDO constant -- TEST A fails, TEST B does
        not obviously apply (DLs are preserved by transport), TEST C applies
        through the window. PREDICTION: gauge-dominated, but this is the one
        functional where the procedure genuinely cannot predict, because the
        composite window-then-DL map is not covered by any of the three tests.
        That admission is the table's most useful entry.
      f7 Macaulay rank profile / Hilbert function -- TEST A fails; predicted
        forced by (B, degrees) plus the transversality exception of
        IDEA-20260807-427cf3, hence Test B via 2-torsion.
      f8 embedding degree, group order, class number of the ORDER O_K, D, D_0,
        whether j = 0 occurs -- TEST A PASSED for all. INVARIANT, and listed so
        that no lane spends compute measuring them.
    Each row is a falsifiable prediction registered before any run, and the
    table's value is that it converts eight fishing expeditions into eight
    hypothesis tests.

    (D) THE TWO OUTCOMES. OUTCOME T (table holds): every L1 measurement lands
    where the procedure predicts, the campaign gains a reusable decision rule,
    and the lane's negative results acquire a mechanism rather than a shrug.
    OUTCOME X (some row fails): a functional varies within a class in a way none
    of the three tests explains -- which means a fourth escape hatch exists, and
    identifying it would be the single most valuable output of the entire lane.
    OUTCOME X is what the record is fishing for and it is why the table is
    written down in advance where it can be contradicted.

  resource_label: >-
    audit: consumes no resource. This is a classification of OTHER lanes'
    resources. Rows in the table are labelled with the resource their functional
    consumes (R1, R2, R4, R5) but the procedure itself reads nothing and mounts
    nothing.
  admissibility: admissible
  admissibility_argument: >-
    Vacuously admissible as an audit. Its relationship to the admissibility
    filter is the useful one: TEST A doubles as a cheap GGM check in one
    direction. If a functional factors through (p, t), then it is computable
    from the group order, which every algorithm knows for free, so it can carry
    no non-generic information whatsoever -- a strictly stronger statement than
    "it is class-invariant". Any lane proposing to exploit such a functional is
    closed before it costs anything, which is the same service RQ-GGMB-6eaabc
    provides for oracles and should be cross-checked with it.

  discriminated_from:
    - >-
      DECOMPOSITION.md T3, which states that an invariance result closes the
      axis for that functional and a variance result gives a target. That is the
      DISPOSITION rule. This record supplies the DECISION PROCEDURE that says
      which disposition to expect, before measuring, and it makes the
      predictions falsifiable by writing them down.
    - >-
      RQ-GGMB-6eaabc / L12, the campaign's oracle simulability auditor. L12 asks
      whether an ORACLE is generic-group simulable. This record asks whether a
      COST FUNCTIONAL is an isogeny invariant. The two audits are different and
      compose: a functional passing TEST A is both class-invariant and
      GGM-visible, which is the strongest possible closure and the cheapest to
      obtain. The cross-check is mandatory and neither lane may report the
      other's verdict as its own.
    - >-
      RQ-VOLC-f6253b / L2. Test B is exactly the statement that L2's axis is the
      one with a chance of mattering; this record does not measure any volcano
      effect and defers all such measurement to L2 and to
      IDEA-20260807-0a3272.
    - >-
      KN-TECH-061 (Honda-Tate). That entry classifies abelian varieties over
      finite fields up to isogeny. This record uses only the elliptic
      one-dimensional consequence -- same Frobenius polynomial iff isogenous --
      and cites Tate's isogeny theorem for it rather than importing the general
      machinery.

  object_first_candidate:
    tracked_object: >-
      THE FACTORISATION TYPE OF A COST FUNCTIONAL: which of the three data
      layers -- rational Tate module (isogeny-invariant), integral Tate lattice
      and point group (class-varying along the volcano), plane embedding
      (varying already within an isomorphism class) -- the functional actually
      reads.
    lossiness: >-
      EXTREMELY LOSSY: a whole cost functional collapses to a label in a
      three-element set. LOSSY-PROJECTION TEST APPLIED HONESTLY: the projection
      discards the functional's VALUES and retains only which layer it depends
      on. That discarding is compatible with the operation at issue -- transport
      along an isogeny -- because transport acts on the three layers in three
      known ways (trivially on the rational Tate module, by a non-isomorphism of
      lattices on the integral one, unpredictably on the embedding), so the
      retained label determines how the functional behaves under transport
      whenever it is well defined. THE HONEST CAVEAT: the label is a
      SUFFICIENT-CONDITION reading only, per (B), so the projection is lossy in
      a way that costs power, not just information -- a Test-A failure retains
      no predictive content by itself.
    propagation: >-
      Deterministic on the first layer (isogeny acts trivially, by Tate), known
      but non-trivial on the second (the lattice changes by an index dividing
      the degree), undefined on the third (there is no functorial equation).
      That triple is the whole content of the procedure.
    survival_score: >-
      Survives any functional, any p, any class, and any curve model. Dies at
      composite functionals that read two layers at once -- f6 in the table is
      exactly such a case and the record marks it UNDECIDABLE by the procedure
      rather than forcing a label, which is the honest failure and the one most
      likely to be the fourth escape hatch.

  mechanism: >-
    STEP 1 -- STATE THE THREE FACTS PRECISELY, WITH CITATIONS.
      (i) TATE'S ISOGENY THEOREM (finite fields): for E, E' over F_q, E and E'
      are F_q-isogenous iff #E(F_q) = #E'(F_q) iff the characteristic
      polynomials of Frobenius agree iff V_ell(E) ~= V_ell(E') as Galois modules
      for some (equivalently every) ell != char. Cited, not proved.
      (ii) An isogeny of degree d induces T_ell(E) -> T_ell(E') with cokernel of
      order equal to the ell-part of d; so integrally the lattices differ.
      (iii) [Lenstra, citation to be re-verified] for ordinary E with
      End_{F_q}(E) = O, E(F_q) ~= O/(pi - 1) as O-modules, so the group
      structure is determined by the ORDER and therefore varies along the
      volcano while the ORDER of the group does not.
    Each fact is written with its exact statement and its citation status, and
    any that fails re-verification removes exactly one row of the procedure.

    STEP 2 -- APPLY THE TESTS TO EVERY DECLARED FUNCTIONAL AND FREEZE THE TABLE.
    The table in (C) is written, dated, and committed before any L1 measurement
    is read. Each row carries: the functional; the test that decides it; the
    predicted verdict; the record that will test it; and the single observation
    that would refute the row.

    STEP 3 -- THE CHEAP EXHAUSTIVE CHECK OF TEST A'S ROWS. Every row predicted
    INVARIANT by Test A is checked exhaustively at toy scale on complete classes
    -- not because the theorem is in doubt but because a mismatch would reveal
    that the IMPLEMENTED functional is not the one the table analysed, which is
    the realistic failure mode. Cost: one pass over an enumeration another record
    is already paying for.

    STEP 4 -- ADJUDICATION AFTER THE LANE'S MEASUREMENTS. When
    IDEA-20260807-0ff796, -0a3272, -8b9486, -692e9b and -427cf3 report, each
    result is scored against its frozen row. Rows that hold are recorded as
    confirmed predictions; rows that fail are escalated as candidate FOURTH
    ESCAPE HATCHES and each gets a named mechanism hypothesis or an explicit
    "unexplained", which under docs/inventor-protocol.md's closure standard is
    the only honest label for a variance with no mechanism.

    STEP 5 -- FORWARD GUIDANCE, WRITTEN NOW. If the table holds entirely, the
    lane's conclusion is: the only class-varying data available to a cost
    functional is the INTEGRAL layer, i.e. the volcano; therefore the campaign's
    remaining live surface is exactly L2 (RQ-VOLC-f6253b) and L7
    (RQ-TORS-8c7b79, ell-torsion as a Galois module), and every other lane is
    either measuring gauge or measuring a zeta-function invariant. That is a
    concrete, named, forward-looking closure rather than a fatigue report.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep tool, 2026-08-07: "isogeny class" over the repository (60+ files, all
      campaign records or the H-ICI line); "isomorphism class|quadratic twist|
      gauge" over ledger/ (24 hits, 13 files). Targeted reads of
      DECOMPOSITION.md T3/T4, KN-TECH-061 (Honda-Tate), KN-TECH-028 (Deuring,
      endomorphism rings), RQ-GGMB-6eaabc, RQ-VOLC-f6253b, RQ-TORS-8c7b79.
    results: >-
      KN-TECH-061 records Honda-Tate and KN-TECH-028 records the Deuring
      correspondence, so the underlying theory is present in the corpus; NEITHER
      is used anywhere as a criterion for deciding whether an ATTACK-COST
      functional is a class invariant. DECOMPOSITION.md T3 states the
      disposition rule but supplies no procedure for predicting which
      disposition applies. No record in the repository contains a prediction
      table of the kind in (C).
    verdict: >-
      ADAPTATION. Tate's theorem and the lattice-versus-rational-module
      distinction are textbook and no external novelty is claimed. New to this
      program: their use as a PRE-COMPUTE DECISION PROCEDURE for the campaign's
      gating lane, together with the explicit statement of one-sided power in
      (B) and the frozen prediction table in (C).

  null_object_control: >-
    MANDATORY, AND FOR A CLASSIFICATION PROCEDURE THE NULL IS AN OBJECT THE
    PROCEDURE MUST GET WRONG IF IT IS NOT DISCRIMINATING. THE MATCHED NULL: a
    set of DELIBERATELY MISCLASSIFIED functionals -- three quantities constructed
    so that the correct verdicts are known in advance and are not all the same.
      (n1) #E(F_p) itself: must be classified INVARIANT by Test A. If the
        procedure says anything else it is broken.
      (n2) the integer a (the Weierstrass coefficient) as a "functional": must
        be classified VARIES BY GAUGE via Test C, since u^4 a ranges over an
        entire orbit.
      (n3) the number of rational 3-torsion points: must be classified MAY VARY
        via Test B, since it is an integral-layer quantity.
    A procedure that returns the same label on all three discriminates nothing
    (KN-TECH-1a5b7e mode 4) and must be rewritten. THE DECAY PARAMETER: the
    fraction of the lane's functionals the procedure can decide. As more
    composite functionals are added (window-then-DL, model-then-window), the
    decidable fraction must FALL -- a procedure that confidently labels every
    composite is over-fitting its own vocabulary, and f6 in the table is
    labelled UNDECIDABLE precisely to demonstrate that the procedure can abstain.

  assumptions:
    - >-
      [fact, cited] Tate's isogeny theorem over finite fields, stated in Step 1.
      Standard; the record states it precisely and does not prove it.
    - >-
      [fact] An isogeny of degree d induces an injection of Tate modules whose
      cokernel has order the ell-part of d. Standard.
    - >-
      [open, citation] Lenstra's structure theorem E(F_q) ~= O/(pi - 1). Must be
      re-verified before the write-up quotes it. If it fails, Test B loses its
      cleanest instance but survives on the weaker, still-true statement that
      the integral Tate lattice varies within the class.
    - >-
      [scope] The procedure decides SUFFICIENT conditions only; a Test-A failure
      is not a prediction of variance. Stated in (B) and repeated in every
      downstream sentence.
    - >-
      [scope] Everything is for ORDINARY curves over prime fields. Supersingular
      curves (t = 0 over F_p) have a different endomorphism theory and are
      excluded; the record says so rather than silently assuming ordinarity.

  proof_search_map:
    bottleneck: >-
      TEST A's applicability, i.e. deciding whether a given functional can be
      written as a function of (p, t). That is the only step with content: Tests
      B and C are negative observations that merely fail to prove invariance.
      The realistic difficulty is that a functional's dependence on (p, t) can be
      hidden behind a geometric identity -- the arity-2 relation count is the
      worked example, where the dependence is invisible syntactically and
      obvious once the relation locus is identified with E. Every FALSE NEGATIVE
      of the procedure lives in exactly that step.
    baseline_embedding:
      parameter_slice: >-
        The functional C(E) = #E(F_p). At that slice the procedure must return
        INVARIANT by Test A, and the invariance must be independently confirmed
        by exhaustive enumeration (all members of a class have equal order, by
        construction of the class).
      reproduction_check: >-
        Frozen fixture: run the enumeration and assert that every member of
        every enumerated class has the same #E(F_p), t, embedding degree and D.
        If the enumeration produces a class whose members disagree on any of
        these, the class construction is wrong and every L1 result built on it
        is void. This is a cheap and decisive check of the SHARED instrument.
    observation_collision:
      observable: >-
        The three-valued label {INVARIANT, MAY VARY (integral), VARIES (gauge)}.
      distinct_preimage_search: >-
        REQUIRED AND IT SUCCEEDS, which bounds the procedure: two functionals
        with completely different behaviour can receive the same label. f3
        (solving degree) and f6 (H-PSEUDO constant) both fail Test A and both
        read a window, yet one may be stratified by 2-torsion and the other not.
        So the label constrains the EXPLANATION and does not predict the VALUE,
        and no quantitative prediction may be drawn from a label alone.
    constructive_transforms:
      - >-
        transform: representation_reduction
        proposed_object: >-
        Replace "is this functional a class invariant" by "which layer of the
        curve's data does it read", reducing an open empirical question to a
        syntactic classification with a known answer on two of three layers.
        predicted_gain: >-
        Turns eight open measurement questions into eight frozen, falsifiable
        predictions at zero compute. The gain is in EXPERIMENTAL EFFICIENCY
        and in making the lane's negatives mechanistic; no attack cost changes.
      - >-
        transform: observable_fiber
        proposed_object: >-
        The fibre of the classification map over each label: which functionals
        share a label, and does anything distinguish them? Exhibiting a large
        fibre with heterogeneous behaviour is what establishes the ceiling in
        the observation-collision entry.
        predicted_gain: >-
        Bounds the procedure's power explicitly, which is what prevents its
        labels being read as quantitative predictions.
    quantifier_order: >-
      Claimed: FORALL cost functionals C, IF (EXISTS a function g with
      C(E) = g(p, t) for all E) THEN FORALL F_p-isogeny classes, FORALL members
      E, E' of that class, C(E) = C(E'). The converse is explicitly NOT claimed:
      it is NOT asserted that a functional failing to factor through (p, t)
      varies within some class. Stating the implication in only one direction is
      the whole discipline of (B), and a write-up that reverses it turns a
      theorem into a false statement.
    method_ceiling:
      strongest_certifiable_claim: >-
        "This functional is a class invariant because it factors through the
        characteristic polynomial of Frobenius." That is a full closure of one
        axis for one functional. The procedure can NEVER certify that a
        functional VARIES -- only a measurement can do that -- and it can never
        certify anything quantitative.
      nearby_object_control: >-
        THE NEARBY OBJECT ON WHICH THE PROCEDURE FAILS, and it must be exhibited
        rather than hidden: the arity-2 relation count. It reads coordinates, so
        a naive application of Test C labels it VARIES BY GAUGE; it is in fact
        exactly p - 1 - t and is INVARIANT. The procedure gets this wrong unless
        the geometric identity of IDEA-20260807-0ff796 is supplied to it. That
        single counterexample is the honest measure of the procedure's power and
        must appear beside the table wherever the table appears.
    proof_obligations:
      - >-
        claim: Tate's isogeny theorem as stated.
        responsibility: baseline
      - >-
        claim: Factoring through (p, t) implies class invariance.
        responsibility: correctness
      - >-
        claim: The converse is not claimed and is false (relation count).
        responsibility: scope
      - >-
        claim: The integral Tate lattice genuinely differs within a class.
        responsibility: strictness
      - >-
        claim: Every enumerated class has constant order and trace.
        responsibility: interface
      - >-
        claim: The three misclassification nulls receive three different labels.
        responsibility: feasibility

  predictions:
    - >-
      metric: >-
      fraction of the frozen table's rows whose predicted verdict matches the
      measured outcome of the corresponding L1 record
      direction: higher
      minimum_effect: >-
      At least 6 of the 8 rows must hold. Fewer than 6 means the procedure has
      no predictive power and its labels must not be used to plan compute.
      Exactly which rows fail is more informative than the count.
    - >-
      metric: >-
      the three misclassification nulls n1, n2, n3
      direction: different
      minimum_effect: >-
      Must receive THREE DIFFERENT labels. Identical labels mean the procedure
      discriminates nothing and it is rewritten before use.
    - >-
      metric: >-
      constancy of #E(F_p), t, D and embedding degree across every enumerated
      class
      direction: different
      minimum_effect: >-
      EXACT equality on every member of every class. Any deviation invalidates
      the shared class-enumeration instrument and therefore every other L1
      record, which is why this cheap check belongs here and is run first.
    - >-
      metric: >-
      the number of table rows the procedure marks UNDECIDABLE
      direction: higher
      minimum_effect: >-
      At least 1 (f6 is marked so in advance). A procedure that decides
      everything is over-fitted to its own vocabulary; the ability to abstain
      is a required property, not a defect.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, THE DELIVERABLE): write Step 1's three facts with
      citation status, apply the tests, freeze the table of (C) with the
      refuting observation named per row, and write the (B) one-sided-power
      caveat and the nearby-object counterexample beside it.
      STAGE 1 (minutes): the three misclassification nulls must receive three
      different labels.
      STAGE 2 (minutes, shared instrument check): assert constancy of
      #E(F_p), t, D, embedding degree across every enumerated class.
      STAGE 3 (zero compute, deferred): score the table against the L1 records
      when they report; escalate failing rows as candidate fourth escape
      hatches, each with a named mechanism or an explicit "unexplained".
      The entire record costs under an hour and its value is that it must be
      done BEFORE the expensive records, not after.
    controls:
      - three misclassification nulls with known distinct labels
      - the class-enumeration constancy check (shared instrument)
      - the nearby-object counterexample (arity-2 relation count) published
        beside the table as the measure of the procedure's power
      - an explicit UNDECIDABLE row, demonstrating the procedure can abstain
    required_metrics:
      - the frozen table, dated, with predicted verdict and refuting observation per row
      - the labels assigned to n1, n2, n3
      - constancy check results per enumerated class
      - >-
        after Stage 3: rows held, rows failed, and the named mechanism or
        "unexplained" for each failure

  falsification_conditions:
    - >-
      The three misclassification nulls receive the same label. The procedure
      discriminates nothing and must be rewritten before any row is used.
    - >-
      Some enumerated class has members with different #E(F_p) or t. The class
      enumeration is broken; this halts the entire lane, not just this record.
    - >-
      Fewer than 6 of 8 table rows hold. The procedure lacks predictive power;
      the honest report is that the classification is descriptive rather than
      predictive, and it may not be used to allocate compute.
    - >-
      A functional varies within a class in a way no test explains (OUTCOME X).
      This FALSIFIES the completeness of the three-layer decomposition and is
      the record's most valuable possible result: a fourth escape hatch exists
      and finding it becomes the campaign's priority.
    - >-
      Tate's theorem or the Lenstra citation fails re-verification. The
      corresponding test loses its foundation and the affected rows revert to
      undecided.

  confounders:
    - >-
      HIDDEN FACTORISATION. The worked failure: a functional that reads
      coordinates but equals a function of (p, t) by a geometric identity. The
      procedure produces FALSE "not decided" verdicts here, never false
      "invariant" verdicts -- the error is one-directional and that asymmetry
      must be stated, because it means the procedure is safe to use for closure
      and unsafe to use for prediction of variance.
    - >-
      COMPOSITE FUNCTIONALS. Anything reading two layers (window then DL, model
      then window) is outside the vocabulary. Marked UNDECIDABLE, never forced.
    - >-
      SUPERSINGULAR CONTAMINATION. t = 0 classes over F_p have non-commutative
      endomorphism structure and are excluded; if the enumeration includes them
      the labels are wrong.
    - >-
      IMPLEMENTATION DRIFT. The table analyses an idealised functional; the
      executor measures an implemented one (e.g. a Groebner proxy from
      harness/semaev.py rather than a solving degree). A row can fail purely
      because the implemented quantity is not the analysed one, and Step 3's
      exhaustive check of the Test-A rows exists to catch exactly that.

  interpretation_limits:
    - >-
      The procedure proves invariance and never proves variance. Every label
      other than "TEST A PASSED" is a hypothesis.
    - >-
      A confirmed table is a statement about the lane's declared functionals at
      toy scale, not a theorem about all cost functionals.
    - >-
      Nothing here is an attack, a bound, or a security claim, and the record
      moves no hypothesis status.
    - >-
      Test A's double reading as a GGM check (a functional computable from
      (p, t) carries no non-generic information) must be cross-verified with
      RQ-GGMB-6eaabc before it is relied on; this record asserts it as an
      observation, not as a simulability proof.

  heuristic_assumptions:
    - >-
      id: H1
      statement: >-
      The three data layers -- rational Tate module, integral Tate lattice and
      point group, plane embedding -- exhaust the data an attack-cost
      functional on a prime-field curve can read.
      rigorous_support: >-
      There is no theorem here and the record says so plainly. The rigorous
      content is that the first layer is isogeny-invariant (Tate) and the
      third is not even isomorphism-invariant; the completeness of the
      trichotomy is the heuristic, and it imitates the standard organisation
      of arithmetic invariants of a curve into isogeny invariants, integral
      refinements, and choices of model. It is refutable, and OUTCOME X is
      exactly its refutation.
      validation_plan: >-
      Adversarial: for each L1 measurement that shows within-class variance,
      attempt to attribute it to layer 2 or layer 3. An attribution that
      succeeds confirms H1 for that instance; a variance that resists both
      attributions after a documented attempt is a refutation and is recorded
      as such rather than as noise. Sample: every functional in the table, at
      every class enumerated. TOY SCALE, labelled; H1 is a claim about the
      vocabulary of invariants and cannot be validated at any scale by
      measurement alone -- only refuted.
    - >-
      id: H2
      statement: >-
      Within a fixed class, the integral layer genuinely differs on at least
      two members whenever the conductor of Z[pi] in O_K exceeds 1.
      rigorous_support: >-
      Rigorous: distinct volcano levels correspond to distinct orders O, and
      distinct orders give non-isomorphic O-modules O/(pi - 1) in general.
      The heuristic part is only "in general" -- there can be coincidences
      where two levels give isomorphic groups.
      validation_plan: >-
      Exhaustively compute the group structure of E(F_p) for every member of
      every enumerated class (feasible at toy scale by computing the exponent
      of the group) and tabulate how many distinct structures occur per class
      against the number of volcano levels. Report the coincidence rate. This
      also quantifies how much room Test B's escape hatch actually has, which
      no record currently knows.

  reachability_gate: >-
    ADDRESSED AT THE LEVEL OF THE WHOLE LANE, WHICH IS THIS RECORD'S BEST
    CONTRIBUTION TO T5. The procedure's Test B says that the ONLY class-varying
    data a functional can read is the INTEGRAL layer -- the volcano level, the
    group structure, the small-ell torsion. Every one of those is LOCALLY
    COMPUTABLE at a vertex in polylog(p): the level by counting rational
    ell-isogenies, the group structure by computing the group exponent, the
    torsion by factoring a division polynomial. THEREFORE, IF THE THREE-LAYER
    DECOMPOSITION IS COMPLETE (H1), THEN ANY GENUINE WITHIN-CLASS VARIANCE IS
    AUTOMATICALLY LOCALLY DETECTABLE AND THE T5 GATE IS AUTOMATICALLY PASSED --
    route (R-local) of IDEA-20260807-c36472. That is a strong and previously
    unstated structural consequence: under H1, the reachability worry and the
    variance worry are not independent, and the campaign cannot end up in the
    awkward position of finding large variance it cannot reach. Conversely, if
    a variance is found that is NOT locally detectable, H1 is refuted and a
    fourth escape hatch exists. The two possible worlds are distinguished by the
    same measurement, which is why this entry belongs in the record.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. The procedure's own cost is
      reading and writing: zero compute for the classification, and one pass
      over an enumeration another record already pays for, for the checks.
    memory_exponent: >-
      Negligible.
    best_known: >-
      0.886 sqrt(N) group operations at O(1) memory (KN-TECH-001, KN-TECH-006,
      with the negation discount per KN-TECH-018); BSGS at sqrt(N)/sqrt(N)
      (KN-TECH-031). Unchanged and untouched.
    hidden_overhead: >-
      The whole procedure's value hides in H1's completeness, for which there is
      no proof. If a fourth layer exists, every "not decided" verdict is
      uninformative and the reachability consequence in the gate above
      evaporates. That dependency is stated rather than buried.
    tradeoff_note: >-
      Not applicable; no algorithm. The only trade is that freezing predictions
      in advance forfeits the freedom to reinterpret results afterwards, which
      is the intended cost.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES. As an ATTACK: none mounted, so
    dominated on every axis by parallel rho at 0.886 sqrt(N) with O(1) memory
    (KN-TECH-001, KN-TECH-006), by the automorphism-discounted variant
    (KN-TECH-018) and by BSGS at sqrt(N) time and memory (KN-TECH-031). As a
    DECISION PROCEDURE the incumbent is DECOMPOSITION.md T3's disposition rule
    plus per-lane judgement; this record dominates that on ADVANCE PREDICTION
    (frozen falsifiable rows versus post-hoc interpretation) and is dominated by
    it on GENERALITY, since T3 applies to any functional whereas this procedure
    abstains on composites. dominated_by is NOT null.
  sota_delta: >-
    Zero speedup against any attack baseline. Quantitative deltas: it converts 8
    open empirical questions in L1 into 8 frozen falsifiable predictions at zero
    compute; it proves invariance outright for the subset of functionals that
    factor through (p, t) -- including group order, embedding degree, D, D_0,
    class number of O_K and whether j = 0 occurs -- which removes those from
    every lane's measurement budget; and it derives a structural consequence
    that no record currently states: under the three-layer completeness
    assumption H1, any genuine within-class variance is necessarily
    volcano-borne and therefore locally detectable in polylog(p), so the
    variance question and the T5 reachability question have the same answer.

