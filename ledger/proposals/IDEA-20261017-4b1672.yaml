  title: "alpha(m) of DPLL point decomposition at m in {3,4,5}: does 2^(ml)/m! persist on chained S_3 and direct S_(m+1), and does any cell reach alpha < m/2 - 1?"
  class: measurement
  claim: >-
    For WDSat on Weil-descended Semaev systems over F_{2^n} (prime n 13..31, Koblitz and ordinary,
    V = polynomial-basis subspace of dim l) the per-attempt UNSAT conflict median obeys
    log2 c = a + alpha*l with alpha = m (c ~ 2^{ml}/m!) at m = 4 and 5 under every complete
    symmetry-pruned configuration and presentation P in {chained S_3, S_4-split, direct S_(m+1)};
    no cell has a 95% CI upper bound below m-1, none near break-even m/2-1 (1 at m=4, 1.5 at m=5).
  mechanism: >-
    OBJECT FRAME. Representation R1 (x in F_2-subspace V; descent gives ml core bits). Sigma = S_m
    permutations of the factor-base tuple (plus translation by factor-base points: Class I,
    partial-action, IDEA-20260806-c5d183). Tracked object = a DPLL node = partial core assignment mod
    S_m. Lossy-projection test against Sigma: discards tuple order (exactly m!), compatible since
    S_(m+1) is S_m-symmetric. No new object; an existing one is priced. Readings of the tree size:
    H_enum alpha=m (no above-leaf pruning, IDEA-20260904-3c7a91);
    H_ideal alpha->m-1 (XG closes the last block, IDEA-20260926-b11cb1); H_sub alpha<m-1. Presentation is
    an independent variable: the m=3 pilot separates chained (2.26-2.55) from direct (2.98).
