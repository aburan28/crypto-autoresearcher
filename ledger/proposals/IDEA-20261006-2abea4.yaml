      verified_by: idea-generator, 2026-10-06, knowledge/frontiers/ecdlp/index-calculus/KR-IC-5ea2f8.yaml
    - ref: KR-IC-f5c584
      provenance: internal
      claim: >-
        The opened row states that Weil descent to F_2 of S_3 on ordinary
        binary curves has first fall degree 2, because the trace of x is
        a group morphism to F_2. This census computes no first-fall degree
        and no binary descent.
      verified_by: idea-generator, 2026-10-06, knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
    - ref: Aubry-Oyono-Vincent minimal-degree bound, as cited by the opened question
      provenance: recalled
      claim: >-
        Recalled pointer, not opened: a separable isogeny E → E^{(p)} of
        degree at most (p/2)^{1/3} exists for supersingular E/F_{p^2}.
        The census treats that sentence as a finite prediction at p = 101,
        not as a theorem this session verified.
      verified_by: null
  assumptions:
    - p = 101 is prime and the supersingular locus is exactly the roots of the supersingular polynomial in characteristic 101.
    - Degree 1 means j lies in F_p, checked by j^p = j.
    - For degree d from 2 through 8, every cyclic kernel is represented by a root of the corresponding division polynomial, and the codomain j is compared with j^p.
    - An inseparable isogeny is not counted. A kernel defined only over an extension is still counted if the isogeny degree is the integer d.
  proof_search_map:
    bottleneck: >-
      The minimal degree δ(E → E^{(p)}), which is factor F1 of the opened
      question and the input to the later split.
    baseline_embedding:
      parameter_slice: >-
        p = 101 only. Ceiling integer 3, because (101/2)^{1/3} < 4.
        Search cap 8, strictly above that ceiling.
      reproduction_check: >-
        Recompute δ for the lexicographically first supersingular j by an
        independent kernel enumeration. Disagreement voids the census.
    observation_collision:
      observable: the integer δ(j)
      distinct_preimage_search: >-
        Record two kernels of the same degree on one j, or two j-invariants
        with the same δ and distinct kernels. If no collision exists in the
        set, record that the fibres were singletons on this prime.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: the finite supersingular set at p = 101
        predicted_gain: >-
          One histogram of δ. No change to the conditional exponent 1/3.
    quantifier_order: >-
      For every supersingular j in characteristic 101, there exists a
      separable isogeny to the p-conjugate of degree at most 3, and there
      exists at least one j whose least such degree is at least 2. A
      universal quantifier over all primes is not claimed.
    method_ceiling:
      strongest_certifiable_claim: >-
        The histogram of δ on this one prime. It does not prove the degree
        bound for any other prime and does not produce a p^{1/4} algorithm.
      nearby_object_control: >-
        One ordinary j in F_{p^2}, frozen before the search. The ceiling 3
        is not claimed for it. A small δ on that ordinary j does not support
        the supersingular bound.
    proof_obligations:
      - claim: Every enumerated supersingular j has a recorded δ ≤ 3 or a recorded counterexample degree.
        responsibility: size
      - claim: The second enumeration of the first j agrees.
        responsibility: correctness
      - claim: At least one δ is at least 2, or the set is entirely degree 1 and the prediction fails.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: max_delta_over_supersingular_j
      direction: lower
      minimum_effect: >-
        The maximum is an integer ≤ 3. A maximum ≥ 4 falsifies the ceiling
        on this set.
    - metric: count_of_j_with_delta_at_least_2
      direction: higher
      minimum_effect: >-
        At least 1. A count of 0 means every supersingular j at p = 101
        has degree 1, so this prime does not witness a degree above the
        subfield locus.
  minimal_test:
    design: >-
      Build the supersingular polynomial in characteristic 101 and list
      every root in F_{p^2}. For each root, test j^p = j, then enumerate
      cyclic kernels of degrees 2 through 8 and compare codomain j-invariants
      with j^p. Record δ(j) as the least hit, or 9 if none. Repeat the
      first j with a second kernel order. Freeze one ordinary j and record
      its δ without using it in the maximum.
    controls:
      - The repeated enumeration of the first supersingular j.
      - One ordinary j, excluded from the supersingular maximum.
      - The degree-1 test j^p = j, checked against the field membership of j.
    required_metrics:
      - cardinality of the supersingular set
      - the multiset of δ(j)
      - the maximum δ
      - the count of δ ≥ 2
      - the ordinary control's δ, reported separately
      - whether the two enumerations of the first j agree
  falsification_conditions:
    - >-
      Some supersingular j has least found degree ≥ 4 inside the cap 8.
      That is the negative observation for the ceiling.
    - >-
      Every supersingular j has δ = 1. That is the negative observation
      for the claim that this prime witnesses a degree above the subfield
      locus.
    - The two enumerations of the first j disagree. The census is void and is not evidence about the ceiling.
  confounders:
    - A missed kernel at degree 2 or 3 makes a true δ ≤ 3 look like a counterexample.
    - Counting an inseparable map, or equating a non-cyclic kernel's size with the isogeny degree, changes δ.
    - The ordinary control sharing a small δ does not confirm or refute the supersingular ceiling.
    - Smoothness of δ, and any prime past 5500, are different experiments.
  interpretation_limits:
    - p = 101 only. No transfer to cryptographic p and no statement about Heuristic 1.
    - The conditional time and memory remain p^{1/3+o(1)} if the opened question's other factors stand. This histogram does not lower 1/3.
    - A maximum of 3 is compatible with a later 1/4 target failing, because 3 is already above (101/2)^{1/4}, which is less than 3.
    - The recalled degree bound was not opened. Agreement at p = 101 does not verify that source.
    - KR-IC-f5c584 is a binary S_3 first-fall statement. Agreement or failure of δ at p = 101 says nothing about first fall degree 2.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For each supersingular j at p = 101, the least separable degree
        equals the least d in 1..8 for which a cyclic kernel of degree d
        has codomain j-invariant j^p, or else that degree exceeds 8. The
        finite check imitates an exhaustive search over a finite set of
        kernels, not a smoothness model.
      rigorous_support: >-
        For each fixed degree d ≤ 8 there are finitely many cyclic kernels.
        The opened question states a ceiling (p/2)^{1/3} < 4 at this prime,
        so a complete search through degrees ≤ 3 decides the ceiling, and
        the cap 8 only detects a miss. No distribution theorem is used.
      validation_plan:
        sampling: >-
          Every supersingular j at p = 101, not a sample. One ordinary j
          as a side record.
        comparison: >-
          The multiset of δ(j) against the two thresholds 3 and 2. Not
          against a Dickman function.
        tail_check: >-
          Any j with no hit through degree 8 is kept as δ = 9 and falsifies
          the ceiling. It is not dropped.
        parameters: >-
          p = 101, degrees 1 through 8, separable cyclic kernels only.
          No transfer to another prime and no smoothness probability.
  target_complexity:
    time_exponent: >-
      Unchanged. The opened question's conditional exponent stays
      p^{1/3+o(1)} under its stated heuristic. This census does not move it.
    memory_exponent: >-
      Unchanged, the same p^{1/3+o(1)} memory. The census stores one
      integer per supersingular j at p = 101.
    best_known: >-
      KR-RHO-13bf67, opened: generic discrete logarithms need Ω(√N).
      KR-RHO-755e35, opened: isogeny walks do not change group-structure
      weakness. KR-IC-f5c584, opened: binary S_3 first fall degree 2, which
      is not this exponent. The isogeny-problem exponent in the opened
      question is the comparison for this lever, and it stays 1/3.
    hidden_overhead: >-
      The o(1) in p^{1/3+o(1)} is not estimated. Kernel enumeration at
      p = 101 hides no attack term because no attack is run.
    tradeoff_note: >-
      Not a van Oorschot–Wiener schedule. The output is a histogram of
      integers at one prime.
