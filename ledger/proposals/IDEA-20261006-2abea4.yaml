idea:
  id: IDEA-20261006-2abea4
  question_id: RQ-SSIQ-9702af
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Minimal separable degree from E to E^{(p)} on the full supersingular
    set in characteristic 101, against the integer ceiling 3
  class: measurement
  claim: >-
    Let p = 101. Let J be the set of supersingular j-invariants in
    characteristic p, each lifted to a curve E/F_{p^2}. Let δ(j) be the
    least degree of a separable isogeny E → E^{(p)}. Then every δ(j) is
    an integer at most 3, and at least one j has δ(j) ≥ 2. The integer 3
    is the floor of the opened question's factor F1, degree at most
    (p/2)^{1/3}: (101/2)^{1/3} is greater than 3.6 and less than 3.7, so
    an integer degree obeying that ceiling is at most 3. This census does
    not move the conditional p^{1/3+o(1)} exponent, does not test
    B-smoothness, and is not a curve-side versus quaternion-side
    comparison.
  mechanism: >-
    OBJECT FRAME. The tracked object is the j-invariant of a supersingular
    curve, not a point of a prime-order ECDLP subgroup. The operation set
    Sigma is the p-power Frobenius on j, sending E to E^{(p)}. Sigma is
    not translation on a prime-order subgroup.
    TRICHOTOMY. Coordinate-dependent. δ(j) is read off the field of
    definition of j and off cyclic kernels, not off a group element of
    E(F_{p^2}).
    LOSSY-PROJECTION TEST against Sigma. The projection keeps only the
    integer δ(j) and discards the kernel. It is compatible with Sigma
    because Frobenius pulls kernels to kernels and preserves degree. It
    is lossy: distinct cyclic kernels can share one degree, so the
    integer is not a coordinate change on the set of kernels.
    Factor F1 of the opened question RQ-SSIQ-9702af is the only lever
    under test. Factor F4, the smoothness probability, is not computed.
    A hit at degree 1 is j in F_p. A search through cyclic kernels of
    every degree from 2 through 8 either finds a degree in {2, 3} or
    records the least degree actually found. Families F1 through F7 of
    the walk, factor-base, isogeny-path, pairing, p-adic, endomorphism,
    and table lenses are not the lens. The isogeny is used only as the
    witness for an integer degree.
  novelty_status: speculative
  citations:
