    not_applicable_reason: null
  predictions:
    - metric: class_number_gap
      direction: different
      minimum_effect: Four exceeds three by 1.
  minimal_test:
    design: >-
      Count the reduced forms of discriminants -652 and -643. Do not
      enumerate a curve.
    controls:
      - Two copies of class number 3, whose gap is 0.
      - An independent count.
    required_metrics:
      - both class numbers
      - the gap
      - the product
  falsification_conditions:
    - The class number of -652 is not 4.
    - The product of the two class numbers is not 12.
  confounders:
    - The absolute values 652 and 643 are not the class numbers.
  interpretation_limits:
    - A class number is not a walk length.
    - No transfer to a cryptographic discriminant.
    - This is not the class-number pair 4 and 3 of discriminants -520 and -547.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen discriminant -652 has class number 4, and the
        frozen discriminant -643 has class number 3.
      rigorous_support: >-
        No class-number theorem is re-proved here. The count is a
        reading of the reduced forms.
      validation_plan: >-
        Two independent counts of the reduced forms. A mismatch voids the gap.
