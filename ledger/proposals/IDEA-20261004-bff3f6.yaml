# IDEA-20261004-bff3f6
# Class-number count for discriminants -652 and -643. Proposal only. Not approved.
idea:
  id: IDEA-20261004-bff3f6
  question_id: RQ-JINV-8fc13a
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    The class number of discriminant -652 is 4 and of discriminant -643 is 3
  class: measurement
  claim: >-
    Discriminant -652 has 4 reduced binary quadratic forms.
    Discriminant -643 has 3. Four exceeds three by 1. The product of
    the two class numbers is 12. Their sum is 7. The gap is a class
    number, not an ECDLP exponent and not an absolute discriminant.
  mechanism: >-
    OBJECT FRAME. The object is the set of reduced forms. The
    operation set is counting those forms, which is coordinate-dependent
    on the discriminant and is not a translation of a curve point.
    Discriminant -652 has the forms with coefficients 1, 0, 163 and
    2, 2, 82 and 4, -2, 41 and 4, 2, 41. Discriminant -643 has the
    forms with coefficients 1, 1, 161 and 7, -1, 23 and 7, 1, 23.
    Two copies of class number 3 have gap 0. No curve is enumerated.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks whether a small discriminant confers an
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-IC-889857
      provenance: internal
      claim: >-
        A first-fall-degree dispute is a different object from these
        two class numbers.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The two discriminants are frozen before the forms are counted.
    - No curve is enumerated.
  proof_search_map:
    bottleneck: The class-number gap 1.
    baseline_embedding:
      parameter_slice: The discriminants -652 and -643 and the counts 4 and 3.
      reproduction_check: >-
        Two readers must agree that the counts are 4 and 3.
    observation_collision:
      observable: The class-number gap and the product.
      distinct_preimage_search: >-
        Reporting both class numbers as 3 drops the gap. Two copies
        of class number 3 make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The two discriminants.
        predicted_gain: Integer gap. No curve enumeration.
    quantifier_order: >-
      The discriminants are fixed before the forms are counted.
    method_ceiling:
      strongest_certifiable_claim: >-
        The class numbers 4 and 3. Not an absolute discriminant.
      nearby_object_control: >-
        Two copies of class number 3. The gap is 0.
    proof_obligations:
      - claim: Discriminant -652 has 4 reduced forms.
        responsibility: size
      - claim: Discriminant -643 has 3 reduced forms.
        responsibility: size
      - claim: The gap is not an absolute discriminant.
