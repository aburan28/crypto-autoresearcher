idea:
  id: IDEA-20261016-b7235b
  question_id: RQ-XEDN-3bfe2e
  added: '2026-10-16'
  title: >-
    Extended signature for B = +-m^2 and D = d^2: the T-shift families, a
    hand-verified counterexample to dropping hypothesis (i), and which frozen
    primes can host them
  class: representation
  claim: >-
    (T1) T-shift families. B=(st)^2: A=w'^2-s^2-t^2, P=(s^2,s^2w'),
    Q=P+T=(t^2,-t^2w'), D=(w'-s-t)(w'+s+t)(w'-s+t)(w'+s-t). B=-(st)^2:
    A=w'^2-s^2+t^2, P=(s^2,s^2w'), Q=P+T=(-t^2,t^2w'), D=A^2+(2st)^2.
    (T2) Hypothesis (i) of bf8f49 is necessary: E=(7,-4), P=(1,2), Q=(-4,8)=P+T
    is opposite-sign with f_+/f_-=13/5 (D=65), neither a square, yet dependent.
    (T3) B=m^2 (D non-square, E(Q)[2^inf]=<T>): beta is defined on T with
    beta(T)=A+2m, and the silent group grows from {1,D} to <D,A+2m>. In (+,-)
    dependence implies f_+ in <D,A+2m>Q*^2; in (+,+) one of f_P, f_Q, f_Pf_Q is
    in it; T-shift gives f_Q = f_P(A+2m) mod <D> (checked: (11,4), P=(1,4),
    Q=(4,-16), 21*15=9*35). (T4) B=-m^2: Q+T is plus-type, so the opposite-sign
    arm reduces to the typed table of IDEA-20261016-a16fa4 for (P,Q+T). (T5) D=d^2, roots
    e2,e3: with delta=(x,x-e2) into (Q*/Q*^2)^2, if B,e2,e3 not in +-Q*^2 and
    -1 not in <B,e2,e3>, dependence forces s^2-e2=c^2, i.e. (s-c)(s+c)=e2.
    (T6) Frozen primes: D square only at p=43 (e2,e3 = 31,13 mod 43); B=m^2 at
    every p (m=+-4); B=-m^2 only at p=353 (m=+-4*311). All frozen p are 3 mod 4,
    so no frozen cell has B in -Q*^2.
  mechanism: >-
    PAIR: representation = full descent delta:E(Q)->(Q*/Q*^2)^2, or alpha with
    beta extended to T; operation set = group law with translation by T.
    TRICHOTOMY: partial-action. LOSSY-PROJECTION TEST: delta, alpha, beta are
    homomorphisms with kernel 2E(Q); the new content is the image of torsion,
    which enlarges the silent subgroup from <D> to <D,beta(T)> exactly when T
    lies in ker alpha (B a square). T-shift: x(P+T)=B/x, y(P+T)=-B y/x^2.
    4-torsion (A+-2m a square) leaves the hypotheses.
  novelty_status: unverified
