        The opened row records published degree-5 estimates, including
        at least 2^142. This count does not recompute those figures.
      verified_by: design session, 2026-10-06, knowledge/frontiers/ecdlp/index-calculus/KR-IC-e2d81b.yaml
  assumptions:
    - The extension degree and the summand count are both 3. The cell is not an n = 5 system.
    - beta is a nonsquare in F_p, and b is a nonsquare in F_{p^3}. If the first curve fails that test, the search continues inside the prime interval. If none succeeds, the cell is unmeasured.
    - An equation is counted only when the polynomial is not identically zero. A zero polynomial is a dropped equation, not a successful square.
  proof_search_map:
    not_applicable_reason: >-
      A shape count at one small prime. Not a proof of an ideal
      degree and not a security claim about any deployed curve.
  predictions:
    - metric: unknown_count
      direction: different
      minimum_effect: The count equals 4.
    - metric: nonzero_equation_count
      direction: different
      minimum_effect: The count equals 4.
  minimal_test:
    design: >-
      Walk primes from 11 upward. Freeze the first irreducible cubic
      and the first admissible double-odd curve. List the four
      unknowns. Expand the descended relation and the cleared w^2
      relation. Count polynomials that are not identically zero.
      A second expansion with the basis of F_{p^3} reversed must
      reproduce both counts. Do not compute a Gröbner basis.
    controls:
      - The reversed-basis expansion.
      - A check that beta is a nonsquare in F_p and that b is a nonsquare in F_{p^3}.
      - A check that (0, 0) lies on the curve and that the curve is nonsingular.
    required_metrics:
      - the prime p and the cubic
      - (a, b), lam, and beta
      - the unknown count and the nonzero equation count
      - whether the reversed basis agrees
  falsification_conditions:
    - >-
      The instrument checks pass and either count is an integer other
      than 4. That is the negative observation.
    - The reversed basis disagrees. The counts are void.
  confounders:
    - Clearing denominators can introduce a content factor. Content is divided out before the zero test, so a unit multiple is not a new equation.
    - A relation that is a scalar multiple of another still counts as nonzero. Linear dependence is not the claim.
    - The degree-16 table in the opened note is not an input to this count.
  interpretation_limits:
    - One prime, m = n = 3. No transfer to n = 5 and no transfer to p = 2^64 - 2^32 + 1.
    - Equal counts of 4 are not a degree and are not a 128-bit statement.
    - This count does not recompute the opened degree 16 and does not recompute 2^142.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For the first admissible double-odd curve at the smallest
        prime in [11, 40], none of the three descended coefficients
        of the summation relation is the zero polynomial, and the
        cleared w^2 relation is not the zero polynomial, so the
        equation count stays equal to the unknown count 4.
      rigorous_support: >-
        KN-OPEN-9b4a2b, opened, names these unknowns and this
        relation. It does not prove the coefficients are nonzero at
        this prime. KR-IC-5a43e5, opened, supplies the summation
        polynomial and does not count equations.
      validation_plan:
        sampling: The one frozen curve. Every coefficient is expanded.
        comparison: Both counts against the integer 4.
        tail_check: A zero polynomial is kept as a dropped equation. It is not deleted from the report.
        parameters: m = n = 3, one prime in [11, 40], no Gröbner basis.
