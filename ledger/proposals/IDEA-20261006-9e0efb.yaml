idea:
  id: IDEA-20261006-9e0efb
  question_id: RQ-GFPN-c01af8
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Square shape of the m=3 rescaled 2-torsion quotient: four unknowns
    and four nonzero equations on the first admissible prime
  class: measurement
  claim: >-
    Let p be the smallest prime with 11 <= p <= 40 such that F_{p^3}
    is built on the first monic irreducible cubic over F_p in
    lexicographic order of coefficients, and such that the first
    nonsingular double-odd curve y^2 = x(x^2 + a x + b) over that
    field, in lexicographic order of (a, b), has b a nonsquare in
    F_{p^3}. Write b = lam^2 * beta with beta in F_p a nonsquare, as
    in the opened note KN-OPEN-9b4a2b. The unknowns of the rescaled
    quotient at m = 3 are sigma_1, sigma_2, sigma_3 of
    (u_i + beta/u_i) and the auxiliary w. The equations are the three
    F_p-coefficients of the descended summation relation together
    with the cleared w^2 relation. The claim is that both counts
    equal 4: four unknowns, and four equations that are not the zero
    polynomial. The negative observation is that one of those two
    counts is an integer other than 4. If no such prime exists in the
    interval, the cell is unmeasured. No monomial-count ratio is
    claimed. No ideal degree is computed. The opened Gaudry exponent
    at n = 3 stays 4/3, and the n = 5 exponent 8/5 is not measured.
  mechanism: >-
    OBJECT FRAME. Representation: the rescaled factor-base coordinate
    u with x = lam * u, on a double-odd curve, as written in the
    opened note KN-OPEN-9b4a2b. Operation set: permutation of the
    three summands, and the involution u |-> beta/u. The quotient
    keeps the elementary symmetric polynomials in
    (u_i + beta/u_i) and the product w. Weil descent of one relation
    along a degree-3 basis produces three coefficient polynomials.
    The w^2 relation is a fourth polynomial. A coefficient that is
    the zero polynomial drops the equation count below 4. That drop
    is the negative. This record does not expand the elementary
    symmetric generators of a 5-summand system and does not form the
    ratio of two monomial counts.
  novelty_status: unverified
