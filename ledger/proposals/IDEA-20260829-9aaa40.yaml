idea:
  id: IDEA-20260829-9aaa40
  question_id: RQ-SYMF-5ab172
  title: >-
    Test whether the symmetric frontier's dominance machinery has ever fired,
    by measuring comparison-key class multiplicity and running a single-field
    key-coarsening ablation with anti-laundering adjudication
  class: measurement
  claim: >-
    On the committed symmetric frontier ledger, the 14-field dominance domain
    key (3 identity fields plus an 11-field comparison key) partitions rows
    into equivalence classes of which the MAJORITY are singletons.
    Consequently a majority of rows carrying `is_frontier: true` are
    nondominated by ABSENCE OF ANY COMPARABLE PEER, not by any evaluated
    dominance relation, and the committed dominance_rules have been exercised
    on strictly fewer than half of the canonical rows. Specifically - (Q1) the
    singleton fraction among the 21 canonical frontier rows is at least 0.70;
    (Q2) the number of dominance relations actually EVALUATED (ordered pairs
    sharing a full key) in the canonical set is at most 15, and the number
    RESOLVED in favour of one row is at most 5; (Q3) among the 11 single-field
    coarsenings of the comparison key, at least one field's removal creates at
    least 3 new evaluated dominance relations of which ZERO are adjudicated
    violations of the schema's 8 committed anti_laundering_rules - identifying
    a key field that is costing comparability without buying protection.
    STRUCTURAL COROLLARY THAT DOES NOT DEPEND ON THE NUMBERS - the boolean
    `is_frontier` is not identifiable - "nondominated because it won" and
    "nondominated because it was alone" have the same observable, and the
    committed schema has no field that separates them.
  mechanism: >-
    TRACKED OBJECT. The object followed through the computation is the
    EQUIVALENCE CLASS a published result falls into under the dominance domain
    key - concretely, the key tuple and its multiplicity (how many corpus rows
    share it). One-step propagation is defined and cheaply measurable - the
    single admissible operation of the instrument, dropping one comparison-key
    field, is a coarsening that maps each class into a union of classes and
    can only increase multiplicity. The lattice of 2^11 sub-keys is the space
    the object moves in; the minimal test explores depth 1.
    LOSSY-PROJECTION TEST (algebraic, no compute). The projection row -> key
    tuple discards every cost axis, every method field, all provenance, and
    all cryptanalytic content, retaining 14 categorical labels. It is
    strictly, massively lossy - two rows with the same key can differ by 40
    bits of time. The discard is compatible with the operation the instrument
    performs, because the schema DEFINES dominance to fire only within a key
    class - the key IS the operation's precondition, so the retained part
    determines whether the operation is even attempted. This is the cleanest
    possible pass of the test - the projection is not a change of coordinates
    (it is many-to-one and non-invertible), and what it keeps is exactly what
    the target operation consumes. Coarsening is a further projection of the
    same kind and inherits the property.
    WHY THIS IS NOT A REPACKAGING OF THE EXISTING SCHEMA. Schema v2 already
    computes a `target_qualified_key_sha256` per row. What it does not do -
    and what the committed required_row_fields list structurally cannot do -
    is report the multiplicity of that key, the number of dominance
    comparisons evaluated, or the sensitivity of the frontier to key
    granularity. The hash is a label; this proposal measures the fibre.
    WHY THE MEASUREMENT DISCRIMINATES. Three explanations of the committed
    "21 canonical frontier rows" are live and are separated by Q1 and Q2. E1 -
    the frontier is a genuine dominance frontier carrying comparative
    information (predicted signature - singleton fraction below 0.4, resolved
    dominance relations well above 5). E2 - the frontier is a list of
    singleton cells and its is_frontier flags are near-vacuous universals over
    empty sets, which would mean the honest deliverable of GOAL-SYMF-c00fa1 to
    date is a coverage census rather than a frontier and that its completion
    criterion on nondomination is satisfiable without ever comparing anything
    (predicted signature - singleton fraction at or above 0.7, resolved
    relations at or below 5). E3 - the key is exactly calibrated, so that
    every coarsening creates only laundering violations (predicted signature -
    Q3 fails, every ablation's new relations are adjudicated violations),
    which is a STRONG POSITIVE result about the schema and would close this
    lane with an argument rather than with fatigue.
    THE COARSENING ABLATION AS A PARETO CURVE. For each of the 11 comparison
    fields, drop it, recompute, and count (new evaluated relations, new
    resolved relations, adjudicated anti-laundering violations). The
    deliverable is the Pareto curve of comparability gained against laundering
    risk incurred, over the 11 depth-1 ablations - not a recommended key. A
    field on the good corner (many new relations, zero violations) is a
    concrete, actionable schema finding; a field on the bad corner is
    evidence the field is load-bearing and must stay.
  tracked_object: >-
    The comparison-key equivalence class of a published result and its
    multiplicity, propagated by single-field coarsening of the 14-field
    dominance domain key.
  lossy_projection_test: >-
    PASSES. row -> key tuple is many-to-one and non-invertible (all costs and
    all mechanism discarded), and what is retained is exactly the precondition
    the dominance operation consumes, so the retained part propagates
    deterministically under the instrument's only operation (coarsening).
    Not a change of coordinates - the fibre over a key tuple is generically
    large and its contents are unrecoverable from the tuple.
  novelty_status: unverified
  citations:
    - ref: knowledge/frontiers/symmetric-frontier-schema.yaml
      provenance: internal
      claim: >-
        The dominance_domain_key comprises 3 identity fields (primitive,
        primitive_variant, primitive_class) and 11 comparison_key fields
        (security_property, attacker_model, oracle_access, key_relation,
        target_component, round_scope, rounds_attacked, total_rounds,
        round_convention, result_kind, success_probability_convention); the
        frontier_definition states that is_frontier=true means nondominated
        only within the reviewed admitted corpus; the 8 anti_laundering_rules
        and the 8 dominance_rules are as quoted; required_row_fields includes
        target_qualified_key_sha256 but NO field for class multiplicity or for
        the number of dominance comparisons evaluated.
      verified_by: >-
        idea-generator subagent, 2026-08-29, Read tool, full file read
        (137 lines).
    - ref: knowledge/frontiers/symmetric-cryptanalysis.yaml
      provenance: internal
      claim: >-
        counts block reports canonical_frontier_rows 21,
        verified_baseline_rows_frontier_unresolved 9,
        pending_correction_groups 5, pending_addition_rows 3,
        snapshot_rows_not_individually_admitted 30, over a snapshot of 67
        producer rows with 39 logical producer frontier flags. Row
        LEGACY-SHA0-COLLISION-DEMO carries frontier.dominated_by null with
        dominance_reason "No same-target exact-domain peer dominates this row
        inside the reviewed admitted corpus" - a null that is consistent with
        an empty peer set.
      verified_by: >-
        idea-generator subagent, 2026-08-29, Read tool, PARTIAL READ - header
        blocks and the first two canonical rows read in full (lines 1-160);
        the remaining 19 canonical rows and all 9 baseline rows were NOT read
        this session.
    - ref: GOAL-SYMF-c00fa1
      provenance: internal
      claim: >-
        Completion criterion 3 requires that every is_frontier true row be
        nondominated only within an identical comparison key, with dominance
        checked across time, data, memory, preprocessing, queries and success
        probability, and that incomparable rows stay separate. The criterion
        is silent on whether any comparison occurred.
      verified_by: >-
        idea-generator subagent, 2026-08-29, Read tool, full record read
        (189 lines).
    - ref: EV-SYMF-d46055
      provenance: internal
      claim: >-
        Review joint J1 verdict "breaks" with finding that the literal
        eleven-field key omits primitive, variant and class and creates
        artificial cross-target dominance - establishing that key granularity
        has already been shown to change dominance outcomes on this corpus,
        in the direction of too-coarse. This proposal tests the opposite
        direction on the repaired key.
      verified_by: >-
        idea-generator subagent, 2026-08-29, Read tool, full record read
        (149 lines).
    - ref: coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/coverage-manifest.yaml
      provenance: internal
      claim: >-
        42 primitives, 399 required family cells, terminal-state counts
        primary_source_partial 287, routed_to_another_goal 30,
        not_applicable 5, no_result_located_with_search_boundary 77,
        global_completeness false.
      verified_by: >-
        idea-generator subagent, 2026-08-29, Read tool, PARTIAL READ - lines
        1-90 (schema, terminal states, required families, summary, review
        findings, cell semantics, and the MD4 entry) read in full; the
        remaining primitive entries were NOT read this session.
    - ref: docs/inventor-protocol.md
      provenance: internal
      claim: >-
        Section 8 audit 2 (observation collision - search for distinct
        ground-truth objects with the same observable, a collision being a
        direct falsifier of identifiability) and section 3 (run the identical
        measurement against a null object before believing a signal).
      verified_by: >-
        idea-generator subagent, 2026-08-29, Read tool, full file read
        (261 lines).
    - ref: "Chao, A. (1984), 'Nonparametric estimation of the number of classes in a population', Scandinavian Journal of Statistics 11, 265-270 (the Chao1 singleton/doubleton lower-bound estimator)"
      provenance: recalled
      claim: >-
        Relied on for the form of the estimator used in H1's validation route -
        the number of unobserved classes is bounded below by
        f1^2 / (2*f2) where f1 and f2 are the counts of classes observed
        exactly once and exactly twice.
      verified_by: null
      note: >-
        NOT READ THIS SESSION. Cited for the estimator's form from
        recollection; the executing task must verify the formula and its
        assumptions against the source before reporting a Chao1 number, and
        must report it as a LOWER BOUND on unobserved classes, never as an
        estimate of literature completeness.
  assumptions:
    - >-
      The instrument is read-only over committed artifacts. It writes a
      derived overlay and never edits knowledge/frontiers/*.yaml, never
      changes an is_frontier value in place, and never proposes a key change
      as an accepted schema amendment - that is a Coordinator decision on
      reviewed evidence, not an output of this measurement.
    - >-
      No cryptanalytic search, attack execution, or reproduction occurs. Per
      RQ-SYMF-5ab172, this question authorizes none.
    - >-
      Adjudication of a newly created dominance relation against the
      anti_laundering_rules is HUMAN OR REVIEWER JUDGMENT, is performed blind
      to which field was dropped, and is reported with an inter-rater
      agreement statistic. An unadjudicated relation is never counted in Q3.
    - >-
      Rows whose costs are null on an axis are handled by the committed rule
      ("Null, unresolved, qualitative, compound, or incompatible units never
      create a favorable ordering by inference"); the instrument does not
      impute, and it reports separately how many relations were left
      unresolved for that reason.
  proof_search_map:
    bottleneck: >-
      The precondition "Compare rows only when every dominance_domain_key
      field is identical", which gates every dominance comparison the schema
      can perform. Everything the frontier claims comparatively passes through
      this gate; if the gate almost never opens, the frontier's comparative
      content is almost empty regardless of how many rows it contains.
    baseline_embedding:
      parameter_slice: >-
        The unablated 14-field key (drop nothing) is the exact old-method
        boundary and must reproduce the committed compilation.
      reproduction_check: >-
        TWO-PART FROZEN FIXTURE, both parts exact and both able to fail.
        (a) Recompute target_qualified_key_sha256 for each of the 21 canonical
        rows from that row's 14 declared field values and require bit-exact
        equality with the committed hash (for example
        ba4711994a125889cc37dd7ec2bc4457eac1a2b2fd3e3e38b453541add01bb30 on
        LEGACY-SHA0-COLLISION-DEMO); a mismatch means the committed keys are
        not derivable from the declared fields, which is itself a first-order
        finding and halts the ablation. Note that the canonicalisation
        (field order, separators, encoding) is not stated in the committed
        schema, so part (a) may require recovering it; if it cannot be
        recovered, that is reported as a reproducibility defect rather than
        worked around. (b) Recompute is_frontier under the committed
        dominance_rules with the full key and require element-for-element
        equality with the committed 21 admitted_partial_frontier and 9
        admitted_verified_baseline_frontier_unresolved dispositions.
    observation_collision:
      observable: >-
        The boolean `is_frontier` together with `dominated_by: null`.
      distinct_preimage_search: >-
        COLLISION ALREADY PRESENT IN THE COMMITTED LEDGER, and it is the
        proposal's strongest single finding because it costs no compute. Two
        ground-truth-distinct situations produce the identical observable -
        (i) a row that was compared against one or more peers sharing its full
        key and was not dominated by any of them, and (ii) a row whose key
        class is a singleton, so that the universal "for all peers r', not (r'
        dominates r)" is vacuously true over an empty set. Row
        LEGACY-SHA0-COLLISION-DEMO carries is_frontier true, dominated_by
        null, and the reason "No same-target exact-domain peer dominates this
        row inside the reviewed admitted corpus", which is literally
        compatible with both preimages. SEPARATING CONDITION - report, per
        row, the key-class size and the count of dominance comparisons
        actually evaluated and their outcomes. That is a two-integer schema
        addition and it converts a non-identifiable flag into an identifiable
        one. This proposal's minimal test measures those two integers for
        every canonical row, which is exactly the separating evidence.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (is_frontier true, dominated_by null) fixed and
          vary the forgotten structure (key-class size, evaluated-comparison
          count); exhibit two committed rows with identical observable and
          different intrinsic invariant.
        predicted_gain: >-
          MODELED, NOT MEASURED. A counterexample pair from the committed
          corpus establishing non-identifiability of is_frontier, plus the
          two-integer invariant that restores it. If no such pair exists (all
          rows have the same class size), the corpus is uniform and the
          transform yields nothing - a clean negative.
      - transform: specialization_pack
        proposed_object: >-
          The depth-1 coarsening lattice as a resource measure - each of the
          11 ablations is a specialization whose gain (new resolved relations)
          and charge (adjudicated laundering violations) are counted only over
          the disjoint set of relations that ablation newly creates.
        predicted_gain: >-
          MODELED, NOT MEASURED. A Pareto curve over 11 points identifying
          which comparison-key fields carry comparability cost without
          laundering protection. Charges are provably disjoint across
          ablations only within depth 1; the proposal therefore does not
          attempt depth 2 or the full 2^11 lattice, where charges overlap and
          adjudication cost explodes.
    quantifier_order: >-
      The claim under test is the committed schema's own frontier assertion,
      written out - FOR ALL rows r' in the admitted corpus such that
      key(r') = key(r), NOT (r' dominates r). This universal is VACUOUSLY TRUE
      whenever the class of r is a singleton, and the vacuity is invisible in
      the emitted boolean. THIS PROPOSAL CLAIMS - FOR the committed corpus,
      THERE EXISTS a majority subset of canonical rows for which that
      universal is vacuous, and THERE EXISTS at least one comparison-key field
      whose removal creates at least 3 relations, ALL of which survive
      adjudication. NOT CLAIMED - for all corpora, or for the completed
      census, that the singleton fraction is high; H1 states the transfer
      assumption and its validation route, and the claim is scoped to the
      committed snapshot.
    method_ceiling:
      strongest_certifiable_claim: >-
        For the committed corpus at snapshot commit
        5fc23783da8a2e62e2b3ab8728e47c48958ce02f - the exact key-class size
        distribution, the exact count of evaluated and resolved dominance
        relations, and for each depth-1 ablation the exact count of new
        relations together with an adjudicated violation count carrying an
        inter-rater agreement statistic. The method can NEVER certify that a
        coarser key is cryptographically sound (soundness is a judgment about
        cryptanalytic meaning, not a count), NEVER certify anything about rows
        outside the committed corpus, and NEVER convert a high singleton
        fraction into a claim that any published attack is weaker or stronger
        than reported.
      nearby_object_control: >-
        The IDENTITY-FIELD ablation, which is known in advance to be wrong -
        drop `primitive` (or `primitive_variant`, or `primitive_class`) and
        recompute. This creates relations comparing, for example, SHA-1
        against AES, which any competent adjudicator must reject. Required
        outcome - at least 90 percent of the relations created by identity
        ablation are adjudicated laundering violations. If the adjudication
        rubric does NOT flag them, the rubric is broken and every Q3 number
        from that run is void. This is the null-object control demanded by
        inventor-protocol section 3, applied to the adjudicator rather than to
        the data.
    proof_obligations:
      - claim: >-
          The recomputed target_qualified_key_sha256 equals the committed
          value for all 21 canonical rows, or the discrepancy is reported and
          the ablation halted.
        responsibility: baseline
      - claim: >-
          The recomputed is_frontier vector under the full key equals the
          committed vector.
        responsibility: baseline
      - claim: >-
          Key-class size and evaluated-comparison count are computed for every
          row, including rows whose comparisons were all left unresolved by
          the null-handling rule, and unresolved comparisons are counted
          separately from resolved ones.
        responsibility: correctness
      - claim: >-
          Every new relation created by an ablation is adjudicated blind by
          two independent reviewers against the 8 committed
          anti_laundering_rules, with Cohen's kappa reported.
        responsibility: interface
      - claim: >-
          The identity-field control produces at least 90 percent adjudicated
          violations.
        responsibility: correctness
      - claim: >-
          All conclusions are scoped to the committed snapshot and to the 21
          canonical plus 9 baseline rows, with the 30 not-individually-admitted
          snapshot rows analysed only as a held-out sample under H1.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: >-
        singleton fraction Q1 - share of the 21 canonical frontier rows whose
        14-field dominance domain key is shared by no other row in the
        admitted corpus (21 canonical plus 9 verified-baseline rows)
      direction: higher
      minimum_effect: >-
        Q1 at least 0.70 (at least 15 of 21 rows). A value at or below 0.40
        falsifies the claim and supports explanation E1, that the frontier
        carries genuine comparative information.
    - metric: >-
        number of dominance relations RESOLVED (one row dominating another
        under the committed dominance_rules) within the canonical plus
        baseline corpus under the unablated key
      direction: lower
      minimum_effect: >-
        at most 5 resolved relations. More than 15 falsifies. The count of
        EVALUATED-but-unresolved relations (same key, no dominance because a
        charged axis is null or incomparable) is reported alongside and is
        itself a measurement of how much missing data, rather than key
        granularity, is doing the blocking.
    - metric: >-
        best depth-1 ablation yield - over the 11 single-comparison-field
        coarsenings, the maximum number of newly created dominance relations
        that survive blind adjudication against all 8 anti_laundering_rules
      direction: higher
      minimum_effect: >-
        at least 3 surviving relations for at least one field. Zero surviving
        relations across all 11 fields supports explanation E3, that the
        comparison key is exactly calibrated, and would be reported as a
        positive result about the schema with the field-by-field violation
        counts as its argument.
    - metric: >-
        identity-ablation control - share of relations created by dropping an
        identity field that are adjudicated as anti-laundering violations
      direction: higher
      minimum_effect: >-
        at least 0.90. Below 0.90 the adjudication rubric is broken and every
        other ablation number from the same run is withdrawn.
  minimal_test:
    design: >-
      Pure recomputation over committed files; no retrieval, no network, no
      cryptanalysis. STEP 1 - parse knowledge/frontiers/symmetric-cryptanalysis.yaml
      and knowledge/frontiers/symmetric-frontier-schema.yaml at the committed
      snapshot; recover the key canonicalisation and verify the two-part
      frozen fixture (recomputed key hashes equal committed hashes; recomputed
      is_frontier equals committed dispositions). HALT AND REPORT if either
      part fails. STEP 2 - compute the key-class size distribution over the 21
      canonical plus 9 baseline rows, and separately over all 67 snapshot
      rows; emit per-row (class size, evaluated comparisons, resolved
      comparisons, unresolved-due-to-null comparisons). STEP 3 - run the 11
      depth-1 comparison-field ablations plus the 3 identity-field controls,
      recording every newly created relation with both rows' full cost vectors
      and the dropped field HIDDEN from the adjudicator. STEP 4 - two
      independent reviewers adjudicate the pooled, shuffled relation list
      against the 8 anti_laundering_rules; report per-field survival counts
      and Cohen's kappa. STEP 5 - H1 held-out check on the 30
      not-individually-admitted snapshot rows and Chao1 lower bound on
      unobserved key classes. Every step's output is reported whether or not
      the predictions hold.
    controls:
      - >-
        Identity-field ablation (null object for the adjudicator) - dropping
        primitive, primitive_variant, or primitive_class must produce at least
        90 percent adjudicated laundering violations.
      - >-
        Blind adjudication - the adjudicator receives a shuffled pooled list
        of candidate relations and never learns which field was dropped, so
        that survival counts cannot be driven by expectation about a field.
      - >-
        Frozen-fixture baseline (STEP 1), which can fail and which halts the
        run if it does.
      - >-
        Random-key null - assign each row a uniformly random key drawn from
        the observed marginal distribution of each field, recompute the class
        size distribution, and compare to the real one. If the real
        distribution is indistinguishable from the random-marginal null, the
        observed singleton fraction is a consequence of field cardinality
        arithmetic rather than of anything about the literature, and must be
        reported that way.
      - >-
        Held-out sample - repeat Q1 on the 30 snapshot rows not individually
        admitted; a singleton fraction differing by more than 0.15 from the
        canonical set falsifies H1's representativeness.
    required_metrics:
      - "key-class size distribution (histogram) over canonical+baseline rows and over all 67 snapshot rows"
      - "Q1 singleton fraction with exact numerator and denominator"
      - "per-row evaluated / resolved / unresolved-due-to-null comparison counts"
      - "total resolved dominance relations under the unablated key"
      - "per-ablation (field dropped, new relations created, adjudicated survivors, adjudicated violations) for 11 comparison fields and 3 identity controls"
      - "Cohen's kappa between the two blind adjudicators"
      - "identity-control violation share (must be at least 0.90)"
      - "random-marginal null class-size distribution for comparison"
      - "held-out Q1 on the 30 not-individually-admitted rows"
      - "Chao1 lower bound on unobserved key classes, reported as a lower bound only"
      - "instrument wall-clock runtime and the parse failure count, if any"
  falsification_conditions:
    - >-
      STEP 1 fixture fails (recomputed key hashes or is_frontier vector do not
      match the committed values). The ablation is not run; the mismatch is
      reported as a reproducibility defect of the committed compilation and
      this proposal's numeric claims are withdrawn for that snapshot.
    - >-
      Q1 at or below 0.40 - the singleton hypothesis is false, explanation E1
      is supported, and the frontier's is_frontier flags carry genuine
      comparative content.
    - >-
      More than 15 resolved dominance relations under the unablated key - the
      dominance machinery has fired substantially and the claim that it is
      near-vacuous is false.
    - >-
      Zero adjudicated survivors across all 11 comparison-field ablations -
      the comparison key is exactly calibrated (E3); the lane closes with a
      named argument (every coarsening admits only laundering) and forward
      guidance rather than a fatigue report.
    - >-
      Identity-control violation share below 0.90 - the adjudication rubric
      fails its own null object; all ablation results from the run are void.
    - >-
      Random-marginal null reproduces the real class-size distribution - the
      singleton fraction is an arithmetic consequence of the key's field
      cardinalities and carries no information about the literature; Q1 must
      then be reported as a property of the schema's design, not of the
      corpus.
    - >-
      Cohen's kappa below 0.6 - adjudication is not reproducible and Q3's
      survivor counts are uninterpretable.
  confounders:
    - >-
      Small-corpus arithmetic. With only 21 canonical rows spread over 42
      primitives, a high singleton fraction is close to guaranteed by counting
      alone. This is the dominant confounder and it is exactly why the
      random-marginal null control is mandatory and why the result must be
      reported as "the frontier as compiled cannot yet compare", not "the
      literature is incomparable".
    - >-
      Acquisition bias. The 21 canonical rows are what one bounded batch
      retrieved; peers of a given row may exist in the literature and simply
      not be in the corpus. The Chao1 lower bound partially addresses this and
      is reported as a lower bound only.
    - >-
      Key canonicalisation ambiguity. If the committed hashes cannot be
      reproduced because the canonicalisation is unstated, an executor may be
      tempted to invent one that matches. That is forbidden - a
      non-reproducible hash is reported as a defect, not reverse-engineered
      into agreement.
    - >-
      Adjudicator anchoring. A reviewer who knows this proposal's predictions
      may under-flag violations to produce survivors. Mitigated by blinding
      the dropped field, shuffling the pooled list, and mixing in the identity
      control relations which are known-bad.
    - >-
      Field entanglement. Dropping `rounds_attacked` while keeping
      `total_rounds` and `round_scope` is not independent of dropping
      `round_convention`; depth-1 ablations therefore measure marginal, not
      independent, contributions, and the report must say so rather than
      presenting the 11 numbers as an orthogonal decomposition.
  interpretation_limits:
    - >-
      Scoped to knowledge/frontiers/symmetric-cryptanalysis.yaml at snapshot
      commit 5fc23783da8a2e62e2b3ab8728e47c48958ce02f, its 21 canonical plus 9
      verified-baseline rows, and the 67-row producer snapshot. It is a
      statement about this compilation, never about the published literature.
    - >-
      A high singleton fraction is NOT evidence that published symmetric
      results are intrinsically incomparable. It is evidence that this
      compilation, at its current coverage, cannot compare them - two very
      different claims, and only the first would be a research finding about
      cryptanalysis.
    - >-
      A surviving ablation relation is a candidate for schema discussion, not
      an approved key change. Only a Coordinator decision on reviewed evidence
      can amend the schema.
    - >-
      No attack, trail, collision, or key recovery is reproduced, verified, or
      questioned. The instrument never touches a cost's truth.
    - >-
      Chao1 bounds unobserved KEY CLASSES in the corpus, not unpublished
      attacks and not literature completeness; conflating them would be an
      overclaim.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Representativeness of the admitted subcorpus.) The key-class
        multiplicity distribution of the 21 canonical plus 9 baseline rows is
        representative of the distribution the completed census would exhibit,
        in the sense that the singleton fraction estimated on the admitted
        subcorpus differs from the singleton fraction on an independently
        drawn subcorpus of the same census by at most 0.15.
      rigorous_support: >-
        No proof is available and none is claimed. The assumption imitates
        species-abundance modelling in ecology, where the frequencies of
        classes observed exactly once (f1) and exactly twice (f2) in a sample
        bound the number of unobserved classes below by f1^2/(2*f2) - the
        Chao1 estimator (recalled, Chao 1984). The rigorous ingredient
        actually in hand is weaker and is stated as such - the committed
        coverage manifest reports 399 required family cells with 287 in state
        primary_source_partial and global_completeness false, which fixes the
        DENOMINATOR of the census exactly even though its contents are
        unknown.
