  target_complexity:
    time_exponent: >-
      NO CRYPTANALYTIC EXPONENT IS CLAIMED OR MOVED. Instrument cost -
      pairwise dominance over R rows on A = 6 charged axes is O(R^2 * A);
      at R = 30 (canonical plus baseline) that is 30*29/2*6 = 2610 scalar
      comparisons, and at R = 67 (full snapshot) 67*66/2*6 = 13266. The
      depth-1 ablation sweep multiplies this by 14 (11 comparison fields plus
      3 identity controls), giving at most about 1.9e5 scalar comparisons -
      milliseconds. The full 2^11 = 2048-node sub-key lattice would be about
      2.7e7 comparisons, still trivial in compute.
    memory_exponent: >-
      O(R * F) for R rows and F = 14 key fields, plus O(R^2) relation records
      - kilobytes. No memory pressure exists and no time-memory tradeoff is
      relevant to the computation.
    best_known: >-
      There is no incumbent measurement. The committed artifacts report 21
      canonical frontier rows, 39 producer frontier flags, and 67 snapshot
      rows, and report a target_qualified_key_sha256 per row; the complete
      required_row_fields list (read in full this session) contains NO field
      for key-class multiplicity and NO field for the count of dominance
      comparisons evaluated, so the incumbent value on this proposal's metrics
      is UNDEFINED rather than zero. No external comparability instrument for
      symmetric cryptanalysis frontiers was located this session - see
      novelty_status unverified.
    hidden_overhead: >-
      The o(1) is human adjudication and it dominates absolutely. Compute is
      milliseconds; blind two-reviewer adjudication is minutes per relation
      and scales with the number of relations an ablation creates, which is
      why the full lattice is computationally trivial and adjudicatively
      infeasible and why the minimal test is depth-1 only. A second hidden
      cost - recovering the key canonicalisation needed to reproduce the
      committed hashes may be nontrivial or impossible, and that risk is
      carried explicitly as a halt condition rather than absorbed.
    tradeoff_note: >-
      The instrument's analogue of a time-memory tradeoff is a
      COMPARABILITY-LAUNDERING tradeoff, and the deliverable is the curve, not
      a point. Coarsening the key monotonically increases the number of
      evaluable dominance relations and monotonically increases the risk that
      a relation crosses a notion, model, or round-convention boundary. The
      report emits the 11-point Pareto curve of (new adjudicated-surviving
      relations, adjudicated violations) and explicitly declines to recommend
      a key. Parallelization is irrelevant at this scale and is not claimed.
