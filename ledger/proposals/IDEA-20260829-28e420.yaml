  assumptions:
    - >-
      Every known-false instrument is written on purpose, is labelled as such in
      its source, and is never run in a way that could produce a committed
      measurement. The suite writes to a scratch output root and asserts that root
      is not under experiments/ before its first write, which is the same
      contamination guard IDEA-20260807-a4f5c5 requires.
    - >-
      The read-set declaration is DERIVED from source and then CHECKED by the
      one-coordinate-at-a-time ablation. Where source and ablation disagree, the
      ablation wins and the disagreement is reported as an implementation finding,
      because a component reading a coordinate its source does not obviously read
      is precisely the failure this record exists to catch.
    - >-
      O-1's marginal distribution is matched to the honest functional's by
      construction, so that a control detecting it through a marginal mismatch
      would be detecting the wrong thing. If the match cannot be made exact, the
      residual mismatch is reported and every pass rate is qualified by it.
    - >-
      This record changes no status, edits no record, and proposes no repair as
      adopted. A measured blind spot is routed to the Coordinator; whether the
      battery is amended is a Coordinator decision on reviewed evidence.
    - >-
      Toy tier throughout, p of order 2^12. No number produced here is evidence
      about any curve of cryptographic size.

  proof_search_map:
    bottleneck: >-
      The intersection R(component) and V(control). It gates every claim of
      instrument validity this lane can make: if the intersection is empty the
      control's outcome is a constant function of the fault, so no amount of
      repetition, no multiplicity correction and no effect-size reporting can
      recover power. Everything else in the battery is downstream of it.
    baseline_embedding:
      parameter_slice: >-
        The honest functional itself is the exact old-method boundary: run the
        battery on the unmutated pipeline at the frozen slice p = 4001, traces
        {30, -30, 18, -18}, seed 20260807. The honest instrument must PASS every
        arm, and the committed instrument_control must reproduce
        detects_planted_signal true, rejects_matched_null true,
        smallest_detected_spread 0.02 as recorded in RUN-INSTR-p4001-a.
      reproduction_check: >-
        A frozen fixture comparing the battery's verdict vector on the honest
        instrument against the committed run's recorded control block, arm by arm.
        A disagreement means the battery as re-implemented is not the committed
        battery and the run is void until explained. Note that the committed
        numbers are quoted here at second hand from IDEA-20260807-efc8de and must
        be re-read from the run record before the fixture is frozen.
    observation_collision:
      observable: >-
        The battery's verdict vector -- one pass or fail per arm -- for a given
        instrument.
      distinct_preimage_search: >-
        COLLISION PREDICTED ALGEBRAICALLY AND THEN MEASURED. Two ground-truth
        distinct objects, one on each side of the conclusion, are claimed to
        produce the identical verdict vector on every arm that exists today: the
        HONEST functional and the SEED-ONLY impostor O-1. The separating
        condition, if any, is the isomorphism-orbit arm, which is the one arm
        whose varied coordinate (the Weierstrass model u) lies inside the
        functional's read-set. So the search's outcome is one of exactly two
        informative results: either the collision is exhibited and the battery's
        identifiability is falsified except through Family 2, or some arm
        separates them and this record has found which coordinate that arm was
        secretly reading. A SECOND, HARDER COLLISION IS ALSO SEARCHED FOR: the
        honest functional against O-2, the order-only impostor, which is
        isomorphism-invariant and therefore survives Family 2 as well. If nothing
        separates that pair, the battery cannot distinguish "class structure" from
        "a function of the trace", which is the strongest possible statement of
        this record's concern.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Re-type each control from a pass/fail verdict to a pair
          (verdict, varied-coordinate declaration), and each component from a
          function to a pair (function, read-set declaration). Power becomes a
          computable intersection rather than an expectation.
        predicted_gain: >-
          MODELED, NOT MEASURED. Every structural zero in the power matrix becomes
          predictable before compute, so the battery's blind spots are enumerable
          at zero cost and the compute is spent only where power is possible.
      - transform: stronger_invariant
        proposed_object: >-
          Require every control to declare the SHAPE of the alternative it plants,
          not just its magnitude -- a per-class offset, a twist-symmetric offset, a
          model-dependent offset, a seed-dependent offset -- so that a passed
          control certifies power against a named alternative class rather than
          against "a signal".
        predicted_gain: >-
          MODELED, NOT MEASURED. Converts efc8de's single delta* into a delta* per
          alternative shape, and makes visible the case IDEA-20260829-bd9f66
          predicts, where a control passes on an asymmetric planted offset while
          the test has zero power against the symmetric alternative that actually
          lives in the data.
    quantifier_order: >-
      THE BATTERY'S IMPLICIT CLAIM, written out: FOR ALL faults f in the fault
      space, THERE EXISTS an arm K in the battery such that K rejects the
      instrument faulted by f. THIS RECORD CLAIMS THE NEGATION FOR A NAMED
      SUBSET: THERE EXISTS a fault class -- faults confined to the functional --
      such that FOR ALL arms K that exist today except Family 2, K's outcome is
      independent of whether the fault is present. NOT CLAIMED: that no arm could
      ever be built with power there (Family 2 is exactly such an arm, and this
      record recommends it), nor that any committed measurement is faulty. The
      dangerous weaker reading, explicitly NOT claimed: "we tried five broken
      instruments and some passed", which without the read-set algebra would be a
      fatigue report under docs/inventor-protocol.md section 4.
    method_ceiling:
      strongest_certifiable_claim: >-
        For the declared battery, the declared coordinate list and the declared
        five-member known-false population: the exact power matrix with its
        predicted and measured zeros, and a per-arm pass rate with its
        denominator. The method can NEVER certify that the battery catches unseen
        faults (that is the coupling assumption, HA-2, and it has no
        distributional backing), can NEVER certify that any committed measurement
        is correct, and can NEVER convert a measured blind spot into a claim that
        any reported number is wrong.
      nearby_object_control: >-
        THE OBJECT ON WHICH THE HOPED-FOR CONCLUSION MUST FAIL, and it is
        mandatory: an instrument that is HONEST but written differently -- the
        same mathematics computed by a second implementation with a different
        loop structure and different intermediate representations. The battery
        must PASS it on every arm. If the battery rejects an honest
        reimplementation, it is firing on implementation detail rather than on
        mathematics, it cannot support a positive under this question's own
        criterion, and every pass rate in the matrix is void. Symmetrically the
        battery must reject O-4, the constant instrument. A battery that cannot
        separate that pair has identified nothing, and the pair costs an hour.
    proof_obligations:
      - claim: >-
          For each declared component, the ablation-measured read-set equals the
          source-derived one, or the disagreement is reported as a finding.
        responsibility: correctness
      - claim: >-
          Every cell of the matrix predicted zero by the read-set intersection
          measures zero, or the arm is reading a coordinate it did not declare.
        responsibility: correctness
      - claim: >-
          Any instrument whose score on an arm is entailed by its own definition
          is flagged ENTAILED and excluded from every separation margin.
        responsibility: strictness
      - claim: >-
          The honest instrument passes every arm and the honest reimplementation
          passes every arm.
        responsibility: baseline
      - claim: >-
          At least one member of the known-false population is constructed by a
          session with no access to the other four, and the construction path is
          recorded as an artifact.
        responsibility: interface
      - claim: >-
          Every pass rate names its denominator, its arm, its fault class and the
          commit of the harness it was measured against.
        responsibility: scope

  predictions:
    - metric: >-
        number of battery arms existing today whose measured pass rate on the
        seed-only impostor O-1 is identical to its pass rate on the honest
        functional, arm by arm and never averaged
      direction: higher
      minimum_effect: >-
        All arms except the isomorphism-orbit arm, i.e. at least 5 of the 6
        pre-Family-2 arms. Fewer than 4 falsifies claim (A2): some arm has power
        the read-set algebra says it cannot have, and finding which coordinate it
        was reading is then the deliverable.
    - metric: >-
        battery_separation_margin, defined as the honest instrument's pass rate
        minus the maximum pass rate over the non-entailed known-false instruments,
        computed over the arms that exist today
      direction: higher
      minimum_effect: >-
        Predicted at or below 0.0 before Family 2 is added, and at least 0.5 after
        it is added. This single number is what the proposal lives or dies by. A
        pre-Family-2 margin above 0.5 means the existing battery already
        separates the population and this record's concern is unfounded, which is
        a clean and reportable negative.
    - metric: >-
        Family 1 minimum detectable effect delta*, measured on the honest
        functional and on O-1 separately, in units of each one's own within-class
        standard deviation
      direction: different
      minimum_effect: >-
        The two delta*/sigma values agree within 15 percent. That agreement is the
        quantitative statement that Family 1 measures the analysis and not the
        functional. A disagreement above 50 percent falsifies claim (A2) directly
        and is the cheapest single falsifier in this record.
    - metric: >-
        number of predicted structural zeros in the power matrix that measure
        strictly nonzero
      direction: lower
      minimum_effect: >-
        Zero. Any nonzero is an arm reading an undeclared coordinate and must be
        traced to the specific line, reported as an implementation finding, and
        the matrix re-derived before any pass rate is cited.
    - metric: >-
        pass rate of the battery on the honest reimplementation (nearby-object
        control)
      direction: higher
      minimum_effect: >-
        Exactly 1.0 on every arm. Below 1.0 the battery fires on implementation
        detail, cannot support a positive, and every other number in the run is
        withdrawn.
    - metric: >-
        pass rate on O-4, the constant instrument, reported with an ENTAILED flag
      direction: lower
      minimum_effect: >-
        0.0, and it is reported as BY-CONSTRUCTION and excluded from the
        separation margin. Its role is to prove the arms can fail; an arm that
        passes O-4 is broken.

  minimal_test:
    design: >-
      One executor task, five stages, no new curve enumeration beyond the
      isomorphism orbit, no network, no acquisition.
      STAGE 0, ZERO COMPUTE AND IT IS THE CHEAPEST DISCRIMINATOR IN THIS RECORD.
      Declare the nine-coordinate list; derive from source the read-set of each
      pipeline component and the varied coordinate of each battery arm; write the
      predicted power matrix with every structural zero marked. Claims (A1) and
      (A2) are settled here, on paper, before anything runs.
      STAGE 1, minutes. The read-set ABLATION: for each component and each
      coordinate, hold all others fixed, vary that one, and record whether the
      output moves. Compare with the Stage 0 declaration; report every
      disagreement.
      STAGE 2, an hour. Implement the five known-false instruments plus the
      honest reimplementation, each labelled in source, each writing only to a
      scratch output root that is asserted not to be under experiments/.
      STAGE 3, an hour. Run the ENTIRE battery on each instrument separately and
      emit a per-instrument, per-arm pass vector. NEVER an aggregate. Flag every
      entailed cell. Compute the separation margin over non-entailed rows only.
      STAGE 4, an hour. The Family 1 delta* comparison of prediction 3: sweep
      delta on the honest functional's measured vector and on O-1's, over a
      declared geometric grid, and report both delta*/sigma values with their
      detection-probability curves.
      Every stage's output is reported whether or not the predictions hold, and
      unmeasured cells are emitted as null and never as integer 0.
    controls:
      - >-
        POSITIVE CONTROL, WHICH MUST FIRE FIRST: the honest instrument must pass
        every arm and the committed instrument_control block must reproduce. A
        battery that cannot pass its own honest instrument certifies nothing and
        no negative from any other arm may be read from such a run.
      - >-
        NEARBY-OBJECT CONTROL: the honest REIMPLEMENTATION, which must also pass
        every arm. This is what separates "the battery measures mathematics" from
        "the battery measures one implementation".
      - >-
        BY-CONSTRUCTION FLAGGING: O-4's zero score is entailed by its definition
        and is excluded from the separation margin, exactly as required for
        ablation rows whose outcome is entailed.
      - >-
        INDEPENDENT-CONSTRUCTION CONTROL: at least one known-false instrument
        written without access to the other four, with the construction path
        recorded as an artifact, because a population built once by one session
        is a single point.
      - >-
        NULL COORDINATE: an ablation of a coordinate that no component reads (for
        example a comment string in the source), whose output movement must be
        identically zero. An ablation harness that reports movement there is
        broken.
      - >-
        CONTAMINATION GUARD: the suite asserts its output root is a scratch path
        before its first write, so that no fabricated instrument can create an
        immutable record under experiments/.
    required_metrics:
      - "predicted power matrix from Stage 0, with every structural zero marked and its intersection argument"
      - "ablation-measured read-set per component, and every disagreement with the source-derived one"
      - "per-instrument, per-arm pass vector for all six instruments, with an ENTAILED flag per cell"
      - "battery_separation_margin over non-entailed rows, before and after the isomorphism-orbit arm"
      - "delta*/sigma from Family 1 on the honest functional and on O-1, with detection-probability curves"
      - "count of predicted zeros measuring nonzero, with the source line traced for each"
      - "honest-reimplementation pass rate, which must be 1.0"
      - "harness commit sha, scratch output root, and the independent-construction path for O-5"

  falsification_conditions:
    - >-
      The honest instrument fails any arm, or the committed instrument_control
      block does not reproduce. The battery as re-implemented is not the committed
      battery; nothing is concluded and the run is void.
    - >-
      The honest reimplementation fails any arm. The battery fires on
      implementation detail, cannot support a positive under this question's own
      criterion, and every pass rate in the run is withdrawn.
    - >-
      Family 1's delta*/sigma on the honest functional and on O-1 differ by more
      than 50 percent. Claim (A2) is FALSE, Family 1 is sensitive to the
      functional after all, and this record's central algebraic argument is
      withdrawn. This is a real possible negative and it is the outcome the design
      would most like to be wrong about.
    - >-
      battery_separation_margin before Family 2 is above 0.5. The existing battery
      already separates the known-false population, the read-set algebra
      overstated the blind spot, and the record says so.
    - >-
      Any predicted structural zero measures nonzero and cannot be traced to a
      specific undeclared read. The read-set model is wrong in a way that is not
      an implementation finding, and the matrix is uninterpretable.
    - >-
      O-4, the constant instrument, passes any arm. That arm cannot fail and is
      removed from the battery before any other number is reported.
    - >-
      No collision is found between the honest functional and O-1 on any arm
      including Family 2. The battery is fully identifying on this population and
      the concern collapses -- the strongest possible good news, and reportable as
      such.

  confounders:
    - >-
      SEEDED FAULTS ARE NOT REAL FAULTS. The known-false population is written on
      purpose and may be systematically easier or harder to catch than an
      accidental bug. This is the coupling assumption, it has no distributional
      backing, it is stated as HA-2, and the matrix is a floor on the battery's
      power rather than an estimate of it.
    - >-
      A FIVE-MEMBER POPULATION IS FIVE POINTS. Pass rates over five instruments
      have enormous sampling error and must be reported as raw counts with
      denominators, never as percentages that imply precision the design does not
      have.
    - >-
      READ-SET DECLARATION IS JUDGEMENT UNTIL THE ABLATION RUNS. A component may
      read a coordinate through a shared global, a cached table or a seed derived
      upstream, and the source may not show it. The ablation is the only evidence
      and the source-derived declaration is a hypothesis.
    - >-
      O-1's MARGINAL MATCH IS ITSELF AN INSTRUMENT. If the match is imperfect, an
      arm may separate O-1 from the honest functional through the residual
      mismatch and be scored as having power it does not have. The residual is
      measured and reported beside every O-1 cell.
    - >-
      THE BATTERY IS A MOVING TARGET. Several arms are proposals rather than
      committed code (efc8de's three families, 34754f's stratified permutation,
      c015f5's repaired decay test). Measuring an unapproved arm is legitimate and
      is what makes this a pre-compute falsifier, but every such row must be
      labelled PROPOSED-ARM and may not be reported as a property of the campaign
      as it stands.
    - >-
      TESTING THE BATTERY WITH THE BATTERY. The suite runs faults through the real
      arms, which is correct, but a defect in the harness could mask a defect in
      an arm. The escaped-exception column and the null-coordinate ablation are
      what separate them.

  interpretation_limits:
    - >-
      NOTHING HERE SAYS ANY COMMITTED MEASUREMENT IS WRONG. Every known-false
      instrument in this record was written on purpose and none has ever produced
      a committed number. A measured blind spot is a statement about what a future
      wrong measurement would survive.
    - >-
      A PASSED BATTERY LICENSES A NEGATIVE OF BOUNDED SIZE AGAINST A NAMED FAULT
      CLASS. It never licenses "the instrument is correct", and the licence
      expires when the battery, the population or the harness changes.
    - >-
      Scoped to the declared coordinate list, the declared battery arms with each
      arm's committed-or-proposed status, the five-member known-false population
      with its construction paths, the frozen slice at p = 4001, and the harness
      commit. Toy tier under docs/claims-and-verification.md.
    - >-
      This record asserts nothing about H-STR-002, phi_alpha or any verdict in
      DEC-20260727-009, and moves no hypothesis. Any adverse finding about a
      committed record is routed to the Coordinator as a proposed supersession.

  heuristic_assumptions:
    - id: HA-1
      statement: >-
        (Read-set determines power.) Let component I have read-set R(I) and let
        control K vary only coordinate set V(K), holding all others fixed. If
        R(I) and V(K) are disjoint then for every fault f confined to I, the
        distribution of K's outcome under the faulted pipeline equals its
        distribution under the honest pipeline, so K's power against f equals its
        size. Formally: K's outcome is measurable with respect to the sigma-algebra
        generated by the coordinates in V(K) and the components downstream of I,
        and f changes neither.
      rigorous_support: >-
        RIGOROUS AS A STATEMENT ABOUT FUNCTIONS: a function cannot output what its
        input does not determine, and a perturbation confined to coordinates the
        function does not read cannot change its value. That half is a theorem and
        needs no modelling. CLASSICAL RESULT IMITATED: the data-processing
        inequality, under which post-processing cannot increase the information a
        statistic carries about a parameter -- here the control's outcome is a
        post-processing of coordinates the fault does not touch. THE MODELLED HALF,
        AND IT IS DECLARED: real implementations may read coordinates their
        declared interface does not, through globals, caches or derived seeds, so
        HA-1 is rigorous about the mathematics and heuristic about the code. That
        gap is exactly where the differential-paths campaign's surprises lived, and
        the ablation exists to measure it rather than to assume it away.
      validation_plan: >-
        WHAT TO SAMPLE: for each of the nine declared coordinates and each pipeline
        component, at least 50 input pairs differing only in that coordinate, drawn
        under recorded seeds. SCALE: 9 coordinates times about 8 components times
        50 pairs = 3600 component evaluations, seconds to minutes at p = 4001 for
        every component except group_structure, which costs O(p) lift_x calls per
        curve and is sampled at 10 pairs and reported as such. PREDICTED
        DISTRIBUTION: for a coordinate outside the declared read-set, the output
        difference is identically zero across all 50 pairs -- a point mass, not an
        approximate one, since the arithmetic is exact. For a coordinate inside it,
        the fraction of pairs with nonzero difference is reported raw. TAIL CHECK:
        any single pair showing a nonzero difference on a coordinate declared
        outside the read-set is traced to the specific source line and reported as
        an implementation finding before any pass rate is cited; one such pair
        falsifies the declaration and is the most informative observation the
        ablation can produce. TRANSFER ASSUMPTION, STATED: read-sets measured at
        p = 4001 on four classes transfer to other p only insofar as the code is
        the same code, and not at all if the harness changes.
    - id: HA-2
      statement: >-
        (Mutation coupling.) The battery's pass rate against the declared
        five-member known-false population estimates its pass rate against unseen,
        accidental faults of the same classes, to within a factor this record does
        not claim to know.
      rigorous_support: >-
        NO PROVEN BOUND AND NO CLASSICAL DISTRIBUTION THEOREM, AND THIS IS
        DECLARED AS A MISSING HALF RATHER THAN DRESSED UP. Mutation testing has no
        number-theoretic distribution law behind it; the coupling hypothesis is a
        software-engineering convention (recalled: DeMillo, Lipton and Sayward,
        1978, unopened this session). The only rigorous ingredient in hand is the
        contrapositive, and it is the one this record actually uses: a battery that
        FAILS to catch a deliberately broken instrument certainly cannot be relied
        on to catch an accidental one, so a measured blind spot is sound evidence
        while a measured absence of blind spots is not.
      validation_plan: >-
        WHAT TO SAMPLE: the five declared known-false instruments plus, as the
        honest calibration subset embedded in the same run, the honest
        reimplementation and the constant instrument O-4, whose scores are known in
        advance and act as the two endpoints. SCALE: complete enumeration of the
        population; no subsampling, since it is seven instruments. PREDICTED
        DISTRIBUTION: none is claimed and none may be reported. The deliverable is
        a raw pass count with its denominator per arm, plus the explicit list of
        instruments no arm caught. TAIL CHECK: the single instrument that survives
        the most arms is examined directly and its surviving path traced through
        the read-set matrix; if that path is not one of the predicted structural
        zeros, HA-1's declaration is wrong somewhere and that is reported first.
        TRANSFER ASSUMPTION: the count transfers to no other battery, no other
        population and no other harness commit.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. Battery cost per instrument: the
      binomial and exact nulls are O(n) over n <= 138 values; the permutation arms
      are B <= 2000 statistic evaluations each; the decay arm is the existing
      six-window sweep; Family 1 is a delta sweep over already-measured vectors at
      about 8 grid points times 200 draws, with NO new curve work; Family 2 is the
      one arm that costs curve work, at K base curves times M isomorphic models
      times the per-curve functional cost. Six instruments times the whole battery
      is on the order of 10^8 scalar operations, i.e. under an hour in Python.
      The read-set ablation adds about 3600 component evaluations, seconds. NOTHING
      HERE INCURS THE O(p^2) CLASS ENUMERATION, which is the lane's real budget
      item and is paid once, already, by the committed run.
    memory_exponent: >-
      O(n) floats per instrument plus O(B) null draws plus the six-instrument
      verdict matrix -- kilobytes throughout. The dominant memory is whatever the
      honest functional already needs, unchanged. No time-memory tradeoff is
      relevant and none is claimed. Stated beside time because the
      asymptotic-form-honesty rule requires it even when trivial.
    best_known: >-
      For the CERTIFICATE path the incumbent is IDEA-20260807-a4f5c5's proposed
      sixteen-fault suite, which is the right instrument for that path and covers
      none of this one. For the MEASUREMENT path the incumbent is
      harness/run_icinv.py::instrument_control as exercised by RUN-INSTR-p4001-a,
      which reports detects_planted_signal true, rejects_matched_null true and
      smallest_detected_spread 0.02 -- a two-directional control on a synthetic
      Bernoulli model, and, by IDEA-20260807-efc8de's own account, on no curve at
      all. The number of deliberately broken measurement instruments this campaign
      has ever run through its battery is ZERO, so the incumbent value on this
      record's central metric is undefined rather than low. The attack frontier is
      untouched: parallel rho at 0.886*sqrt(N) time with O(1) memory, the
      automorphism-discounted variant on CM curves, and BSGS at sqrt(N) time and
      memory, all unchanged.
    hidden_overhead: >-
      DISCLOSED, four items. (i) HA-2 has no distributional backing at all, so
      every pass rate is a floor and never an estimate. (ii) The known-false
      population is five points and its sampling error swamps any difference below
      about 0.2 in pass rate. (iii) The independent construction of O-5 is a
      PROCESS property that degrades silently -- if its author reads the other
      four, or both are generated in one session from one prompt, independence is
      nominal, and the construction path must be recorded as an artifact rather
      than asserted. (iv) Several arms are proposals, not committed code, so part
      of the matrix measures things that do not yet exist and must be labelled
      PROPOSED-ARM in every cell.
    tradeoff_note: >-
      The tradeoff is COVERAGE AGAINST MAINTENANCE and it is the standard fixture
      trade, stated rather than absorbed: more known-false instruments catch more
      blind spots, and every one is a fixture that must be kept true as the harness
      moves. There is a second and more interesting trade specific to this design:
      arms whose varied coordinate lies DEEP in the pipeline (Family 2, which
      re-models the curve) have power against more fault classes and cost curve
      work, while arms whose varied coordinate is SHALLOW (Family 1, which plants
      on the output) are nearly free and have power against almost nothing. The
      deliverable is that curve -- power against fault classes plotted against
      arm cost -- not a recommended battery. Parallelization is trivial across
      instruments and is not claimed as a contribution.

  dominated_by: >-
    AS AN ATTACK: n/a, no attack is mounted and no cost axis is contested; every
    row of the prime-field frontier dominates trivially.
    AS A CONTROL, checked against the specific records that could contain it
    rather than asserted. (1) IDEA-20260807-efc8de PARTIALLY DOMINATES and the
    domination is acknowledged in its favour: its item B1 already states that the
    committed control never touches a curve, and its FAMILY 2 is exactly the arm
    this record predicts is the only one with power against functional-level
    faults. This record does NOT re-derive Family 2 and must be written as
    composing with efc8de, not replacing it. What efc8de does not contain is the
    read-set algebra, the observation that its OWN Family 1 is blind for the same
    reason as the committed control, or any deliberately broken instrument.
    (2) IDEA-20260807-a4f5c5 DOMINATES on the certificate path outright -- sixteen
    faults, ten must-reject, three must-accept, a frozen regression vector -- and
    is NOT dominated by this record anywhere. It explicitly does not cover the
    measurement path, which is this record's whole object, so the two are
    complementary and neither subsumes the other. (3) IDEA-20260816-2f049b is the
    nearest methodological neighbour, measuring a leak detector's power as a
    surface over planted-signal grades; it is NOT dominated and does not dominate,
    because its object is a detector on side-channel traces, its grading is a
    magnitude lattice rather than a fault-class list, and it plants in the data
    rather than in the instrument. (4) IDEA-20260807-f6137c's constructibility
    bits ask whether a control CAN be built; this asks what an existing control
    CAN CATCH. Different bit, not dominating. (5) IDEA-20260829-bd9f66 is the
    sibling filed the same day and is complementary: it tracks the verdict, this
    tracks the instrument, and a verdict with a singleton attainable set would
    appear in this record's matrix as a row of structural zeros. (6) Against
    general mutation testing and known-false-instrument practice: DOMINATED
    CONCEPTUALLY AND ADMITTEDLY SO -- nothing about seeding faults is new, and
    KN-TECH-6785f2 records another campaign in this same program doing it. What is
    claimed unmeasured is the power matrix for THIS battery on THESE in-scope
    instruments, and that matrix does not exist anywhere.
    DISCLOSED LIMIT: eleven of the eighteen proposals filed under this question
    were not read in full this session and are known only by their one-line titles
    in the prior-art file supplied to this session; the domination argument for
    those rows rests on those titles and a validator should check them rather than
    accept this.
  sota_delta: >-
    No attack, no exponent, zero delta on every attack cost axis at every field
    size. Quantitatively, against this campaign's own measured baselines: the
    number of deliberately broken measurement instruments ever run through this
    campaign's control battery is 0 today, target 5 plus an honest
    reimplementation; the number of battery arms with a DECLARED varied coordinate
    is 0 today, target every arm; the number of pipeline components with a
    DECLARED and ABLATION-CHECKED read-set is 0 today, target about 8;
    battery_separation_margin is undefined today, target a measured number with
    its denominator, predicted at or below 0.0 before the isomorphism-orbit arm
    and at least 0.5 after it. The single sharpest number is prediction 3: two
    delta*/sigma values agreeing within 15 percent would establish, on this
    campaign's own strongest proposed positive control, that the control measures
    the analysis rather than the functional. Against
    docs/target-result-profile.md this is explicitly NON-target-class -- no
    asymptotic exponent moves and none could -- and it is proposed as a BUILDING
    BLOCK under Idea Generator search heuristic 1: it decides which of this lane's
    controls can carry a negative before the lane spends O(p^2) enumerations
    producing one.

  estimated_cost:
    implementation: medium
    compute: low
    basis: >-
      Stage 0 is paper. The compute is one battery pass over six instruments on
      already-enumerated curves plus one isomorphism-orbit measurement; no new
      class enumeration and therefore no O(p^2) cost.

  recommended_priority: high

  discriminated_from:
    - >-
      IDEA-20260807-efc8de, which BUILDS the positive controls. This measures what
      each of them can catch, and predicts that its headline arm catches nothing
      inside the functional while its cheapest-looking arm, Family 2, is the only
      one that does.
    - >-
      IDEA-20260807-a4f5c5, which mutates CERTIFICATES and tracks the verifier's
      decision function. This mutates INSTRUMENTS and tracks the read-set. Same
      technique family, disjoint objects, and a4f5c5 says so itself.
    - >-
      IDEA-20260816-2f049b, which measures a leak detector's power surface over
      planted-signal magnitudes. That grades the SIGNAL; this enumerates the FAULT
      CLASS and predicts the zeros algebraically before measuring.
    - >-
      IDEA-20260807-caf061, which controls the error rate across many tests. A
      battery with a structural zero produces the same wrong answer at every
      multiplicity correction.
    - >-
      IDEA-20260829-bd9f66, the sibling filed the same day: that record asks
      whether a verdict can vary, this asks whether a control can catch. A verdict
      with one attainable outcome and a control with an empty read-set
      intersection are different degeneracies with the same consequence.

