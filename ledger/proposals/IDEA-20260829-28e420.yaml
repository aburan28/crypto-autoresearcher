idea:
  id: IDEA-20260829-28e420
  question_id: RQ-INSTR-f8faa0
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator

  title: >-
    THE CONTROL BATTERY'S POWER MATRIX, MEASURED AGAINST DELIBERATELY BROKEN
    IN-SCOPE INSTRUMENTS: the campaign's committed positive control never touches
    a curve and its strongest PROPOSED successor plants additively on the
    already-measured value vector, so both are provably blind to every fault
    inside the functional -- track the READ-SET of each instrument against the
    COORDINATE each control varies, predict the matrix's structural zeros
    algebraically, and then measure how many known-false instruments pass the
    whole battery

  class: control

  claim: >-
    (A) THE ALGEBRAIC CLAIM, ZERO COMPUTE, AND IT IS A PRE-COMPUTE FALSIFIER OF A
    PROPOSAL THIS LANE HAS ALREADY RANKED `high`. A control has power against a
    fault only if the control VARIES a coordinate of the input that the faulty
    component READS. Write R(I) for the read-set of instrument component I -- the
    coordinates of the input on which its output actually depends -- and V(K) for
    the coordinate a control K varies. If R(I) and V(K) are disjoint, then K's
    outcome is identical for the honest I and for every fault confined to I, so
    K's power against that fault class is EXACTLY ZERO, not small. Apply it:
      A1. harness/run_icinv.py::instrument_control draws synthetic Bernoulli
          count vectors and asks binomial_null_verdict to separate a planted
          spread from a common rate. It constructs no curve. So V(K) contains no
          curve coordinate, R(functional) is entirely curve coordinates, and the
          control's power against ANY fault in factor_base_fixed_size, lift_x,
          the sum set or the target sampler is exactly zero. This much
          IDEA-20260807-efc8de already states, as its item B1.
      A2. WHAT NO RECORD STATES, AND IT IS THE POINT. efc8de's own FAMILY 1 --
          the record's headline positive control and the source of the campaign's
          per-functional minimum detectable effect -- forms
          C~(E) = C(E) + delta*g(class(E)) and pushes C~ through the identical
          analysis, and its own STAGE 2 says this needs "no new curve measurement
          at all, because the planting is additive on the measured values."
          Therefore Family 1 varies a coordinate DOWNSTREAM of the functional. Its
          power against a functional-level fault is exactly zero as well: replace
          C by any C' with a comparable within-class spread and the whole delta
          sweep returns a delta* differing only through sigma_within. The
          campaign's committed positive control and its strongest proposed
          successor are blind to the same fault class, for two different reasons,
          and the only proposed arm with power there is efc8de's FAMILY 2, the
          F_p-isomorphism orbit, which does re-measure the curve.
    (B) THE MEASURABLE CLAIM, AND IT IS WHAT THE EXPERIMENT TESTS. Build a
    population of KNOWN-FALSE in-scope instruments -- instruments whose output is
    wrong by construction -- and run each through the ENTIRE declared control
    battery: the committed instrument_control, NULL-B, NULL-C, the exact null,
    efc8de's three planted families, IDEA-20260807-34754f's stratified
    permutation, and IDEA-20260807-c015f5's decay test. THE CLAIM IS THAT AT
    LEAST ONE KNOWN-FALSE INSTRUMENT PASSES EVERY ARM. Specifically, the battery's
    pass rate on the declared known-false population is at least 1 of 5 on the
    arms that exist today, and the ONLY arm that separates the population is the
    isomorphism-orbit arm. IF INSTEAD every known-false instrument is caught by
    at least one arm, this record's central contention is false, the battery is
    stronger than its read-sets suggest, and that clean negative is worth more
    than the concern.
    (C) THE DECLARED KNOWN-FALSE POPULATION, EACH WRONG FOR A NAMED REASON AND
    EACH IN SCOPE. All five are functionals over toy ordinary prime-field
    short-Weierstrass curves and none touches anything outside this question's
    declared scope.
      O-1  SEED-ONLY. C(E) := a deterministic pseudorandom float seeded by the
           curve coefficients (a, b), with its marginal distribution matched to
           the honest functional's. It reads the curve and computes no
           arithmetic. Predicted to pass instrument_control, NULL-B, Family 1 and
           the decay test; predicted to FAIL Family 2, because an isomorphic
           re-model (u^4 a, u^6 b) changes the seed and therefore the value.
      O-2  ORDER-ONLY. C(E) := a fixed function of #E(F_p) alone. Class-constant
           by Tate, so it passes the exact null as `invariant` with the
           entailment that IDEA-20260829-bd9f66 measures, and it passes Family 2
           trivially since the order is an isomorphism invariant. It is
           known-false as a claim about isogeny structure precisely because it is
           entailed by it.
      O-3  MODEL-ONLY. C(E) := a functional of the Weierstrass MODEL that is not
           an isomorphism invariant, for example a window-restricted count with
           the window fixed in the ambient coordinate. efc8de predicts several
           committed functionals are already of this kind; O-3 makes one
           deliberately, so the battery's response to a known model artifact is
           measured rather than inferred.
      O-4  CONSTANT. C(E) := 1. Fails everything that can fail, and its role is
           to prove the battery can fail at all. Its score on every arm is
           ENTAILED BY ITS OWN DEFINITION and is excluded from the separation
           margin, exactly as the differential-paths campaign requires for
           by-construction rows.
      O-5  INDEPENDENTLY CONSTRUCTED. At least one further known-false instrument
           written by a session that has not read the other four. This is a
           REQUIRED control, not an extra: KN-TECH-6785f2 records that the
           differential-paths campaign's four known-false instruments were built
           once by one session and re-executed from the same file, so a
           separation margin measured against them is a measurement of that one
           construction. This record inherits the lesson rather than the mistake.
    (D) THE DELIVERABLE IS A MATRIX, NOT A VERDICT. Rows are battery arms,
    columns are fault classes (functional-internal, model-level, class-label,
    analysis-level, seed-level), cells are measured pass rates with the
    ALGEBRAICALLY PREDICTED structural zeros marked in advance. A cell predicted
    zero that measures nonzero means an arm is firing on something other than
    what it reads, which is a defect. A cell predicted nonzero that measures zero
    is a measured blind spot with a number attached.
    (E) WHAT THIS DOES NOT CLAIM. It claims nothing about whether any committed
    measurement is wrong; every known-false instrument here is written on purpose
    and none of them has ever been run in this campaign. It moves no hypothesis,
    computes no discrete logarithm, and its ceiling is a statement about a
    battery, not about elliptic curves.

  mechanism: >-
    THE STRUCTURAL DIAGNOSIS. This lane has built controls by asking "what should
    the instrument be able to see" and never by asking "what does this control's
    perturbation actually touch". The two questions have different answers, and
    where they differ the control is ceremonial. The committed instrument_control
    perturbs a Bernoulli rate; the functional never sees a Bernoulli rate.
    Family 1 perturbs an output vector; the functional never sees its own output.
    Both are two-directional and both are honest, and neither can distinguish an
    honest functional from a wrong one, because in each case the perturbed
    coordinate is disjoint from the functional's read-set.
    THE MECHANISM IS TO MAKE THE READ-SET AN EXPLICIT OBJECT AND INTERSECT IT
    WITH THE CONTROL'S VARIED COORDINATE. For each component of the pipeline,
    declare its read-set as a subset of the coordinate list
    (p; a; b; the Weierstrass model choice u; the class label t; the factor-base
    rule and offset; the target seed; the measured value vector; the class-size
    profile). The declaration is derived from source and is checkable by an
    ablation: hold every coordinate fixed but one, vary that one, and record
    whether the output moves. A coordinate that never moves the output is not in
    the read-set, whatever the source suggests. The matrix is then the
    intersection table, and the algebra predicts every zero before a single
    known-false instrument is run.
    WHY THE KNOWN-FALSE POPULATION IS STILL NECESSARY AFTER THE ALGEBRA. The
    read-set argument proves a control CANNOT catch a fault it cannot see. It
    does NOT prove a control catches faults it can see, and it does not bound
    implementation leakage -- an instrument may read a coordinate outside its
    declared read-set, which is exactly the gap the differential-paths campaign
    found between an information-theoretic argument about a key and the
    implementation that computed it. The known-false population measures that
    gap; the algebra tells you where to point it.
    THE ASYMMETRY THAT MAKES THIS CHEAP. Predicting a zero costs no compute and
    can be wrong; measuring a nonzero costs minutes and settles it. So the record
    front-loads the falsifiable algebra and spends compute only where the algebra
    predicts power.

  tracked_object: >-
    THE READ-SET of a pipeline component -- the coarsest partition of the input
    coordinate space on which the component's output is constant, carried as a
    subset of a declared finite coordinate list -- paired with the VARIED
    COORDINATE of each control. The object followed through the computation is
    the intersection of the two.

  lossy_projection_test: >-
    PASSES, and the check is algebraic and free. The projection sends a component
    (a function on curves, seeds, models and value vectors) to a subset of a
    nine-element coordinate list. It discards the component's entire arithmetic:
    two functionals of completely different mathematical content and completely
    different values -- the honest liftable density and the seed-only impostor
    O-1 -- have the SAME read-set, which is precisely why the controls cannot
    tell them apart and is the finding. What it discards is discarded COMPATIBLY
    with the operation the target performs, because the operation here is
    COMPOSITION of components into a pipeline and read-sets compose by union: the
    read-set of a composite is determined by the read-sets of its parts and by
    nothing else that was discarded. That is a genuine deterministic propagation
    rule on the projected state, and it is the same union law that makes
    IDEA-20260829-c7472b's trust surface an object. It is NOT a change of
    coordinates: no functional can be reconstructed from its read-set, the
    projection is many-to-one on every nonempty fibre, and the fibre over
    {a, b, p} contains both the honest functional and O-1.
    HONEST NOTE ON WHERE THE PROJECTION IS TOO LOSSY: the read-set cannot see
    HOW a component depends on a coordinate, only THAT it does. Two components
    with identical read-sets can have very different sensitivities, so a nonzero
    cell in the matrix is a permission for the control to have power and never a
    guarantee of it. That is stated here rather than discovered in review, and it
    is why the measured known-false population is a required half of the design.

  scope_verdict: >-
    IN SCOPE. All five known-false instruments are functionals over toy ordinary
    prime-field short-Weierstrass curves at p = 4001, inside the declared curve
    families, field type and bit size; the battery arms audited are the campaign's
    own instrumentation, null objects and certificates, which is the declared
    method.
    ON THE THREE CROSS-LANE INSTANCES: OUTSIDE this question's declared scope, on
    every scope axis. IDEA-20260829-9e6650's objects are SHA-1 and MD5
    differential paths, IDEA-20260829-9aaa40's is a symmetric-cryptanalysis
    frontier compilation, and IDEA-20260829-c7472b's are elliptic curves over Q
    with coefficients of order 1.4e26 -- none is an ordinary curve over a prime
    field of at most about 32 bits and two involve no curve at all. What this
    record imports from IDEA-20260829-9e6650 is the FAILURE SHAPE ONLY -- that a
    campaign measured a differing-cell count of exactly zero between its honest
    instrument and five known-false ones -- and instantiates it on in-scope
    objects. It files no claim about that lane and asks for no widening of this
    question's scope. The scope gap is real and is a defect of the QUESTION
    RECORD: its title and decision_target are program-general, its scope block is
    bound to GOAL-ENDO-001, and proposals already filed against it are already
    outside the block. Its repair is a clause-scoped correction record on the
    RQ-MCE-3f7c02 / RQ-MCE-f8fca0 pattern, which only the Coordinator may create.
    This record proposes that one is needed and creates none.

  novelty_status: unverified

  novelty_note: >-
    UNVERIFIED, and the reason is stated rather than hedged. The technique --
    mutation testing, that is, measuring a test suite by the fraction of
    deliberately wrong implementations it rejects -- is standard software
    engineering and is recalled, not checked: no paper was opened this session.
    Inside this repository, a corpus grep for "known-false instrument", "read-set"
    and "dependency footprint" over all .yaml and .md files was run this session:
    "known-false instrument" is established terminology in GOAL-DIFFP-84d641 and
    KN-TECH-6785f2 and appears NOWHERE in GOAL-ENDO-001 or in any of the eighteen
    proposals filed under RQ-INSTR-f8faa0; "read-set" and "dependency footprint"
    return zero hits anywhere. IDEA-20260807-a4f5c5 is the nearest in-repo record
    and mutates CERTIFICATES rather than instruments. So the transfer is
    new-to-this-lane and the technique is old, and with no external check the
    honest label is unverified.

