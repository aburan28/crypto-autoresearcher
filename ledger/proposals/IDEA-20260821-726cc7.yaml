idea:
  id: IDEA-20260821-726cc7
  question_id: RQ-HQC-001
  added: '2026-08-21'
  title: >-
    The number of simultaneous decoding instances is a cost axis nobody charges:
    derive the DOOM gain law and the instance-store memory law per ISD variant
    on TWO separate axes - the cyclic-shift orbit and the ciphertext count Q -
    and compute the instance count N* at which the amortised discount stops
    paying, at HQC's own parameters. The record's original mechanism claim, that
    the memory profile separates the elimination-only from the merge-based
    family, is WITHDRAWN as a premise by the repair of 2026-08-24 and is now an
    output of Stage 1 rather than an input to it
  class: algorithm

  claim: >-
    (A) THE DISCOUNT NOBODY HAS PRICED. HQC's quasi-cyclic structure hands an
    attacker n cyclically shifted syndromes of the same code for free, and every
    concrete security estimate for HQC credits some version of Sendrier's
    Decoding-One-Out-of-Many discount for it. This repository's only ISD
    proposal, IDEA-20260805-baa4da, explicitly DEFERS it - "omit the DOOM
    quasi-cyclic factor (at most sqrt(n), i.e. 7.1 / 7.6 / 7.9 bits)" - and
    lists resolving it as a stage rather than an assumption. Its derived
    contract, experiments/EXP-HQC-50ebe9/specification.yaml, is at
    status review_required with no runs and lists the DOOM factor only as a
    stage-3 refinement of Prange. No record in ledger/, experiments/ or
    knowledge/ treats the INSTANCE COUNT as a cost axis. CORRECTED BY REPAIR
    2026-08-24: the original wording of this paragraph, "IDEA-20260805-baa4da is
    the lane's only ISD record", was wrong - EXP-HQC-50ebe9 is a committed
    experiment contract for the memory-charged single-instance ISD baseline, it
    is listed in this record's own source_refs, and its control apparatus is
    this record's near-verbatim. See discriminated_from.

    (B) THE MECHANISM CLAIM, WITHDRAWN AS WRITTEN AND RE-DERIVED. THE ORIGINAL
    CLAIM WAS: "the DOOM gain law is a property of how a given ISD variant
    CONSUMES the extra instances, and that is exactly its memory profile ... the
    instances enlarge exactly the structure whose size the memory charge
    penalises" for the merge-based family and not for the elimination-only one.
    THAT PREMISE IS FALSE AS A STATEMENT ABOUT THE INSTANCE STORE, and the
    repair derives why rather than rewording it.
    THE INSTANCE-STORE MEMORY LAW, DERIVED IN CLOSED FORM, PER AXIS AND PER
    FAMILY (n_len = 2n, k_len = n, syndrome length r = n_len - k_len = n):
      SHIFT AXIS, N <= n cyclic shifts of ONE syndrome s. The N targets are one
      orbit of the cyclic group, so the whole set is stored as one representative
      plus an index and regenerated by rotation:
        M_inst^shift(N) = r + ceil(log2 N) bits,
      N-INDEPENDENT UP TO A LOGARITHM, AND IDENTICAL FOR BOTH FAMILIES.
      Q AXIS, N = n.Q from Q distinct ciphertexts under one key. The Q syndromes
      lie in no common orbit; an iteration that tests all N against ONE Gaussian
      elimination must hold all Q of them concurrently under an H.T_wall charge:
        M_inst^Q(N) = Q.r + O(log N) bits = Theta(N) bits,
      N-PROPORTIONAL, AND AGAIN IDENTICAL FOR BOTH FAMILIES.
    SO THE INSTANCE STORE DOES NOT SEPARATE THE FAMILIES ON EITHER AXIS. The
    headline inequality g(elimination-only) > g(merge-based) does not follow from
    the memory profile of the instance set, and this record no longer asserts
    that it does.
    WHAT SURVIVES, AND IT IS WEAKER AND CONDITIONAL. The merge-based family has a
    CHOICE the elimination-only family does not, and the two options have
    different memory laws:
      MODE S (stream the targets): M_list = Theta(L.(l + ceil(log2 L))),
        A = Theta(N.L) - list memory N-independent, accesses N-proportional.
      MODE M (materialise the N targets into the keyed structure):
        M_list = Theta(N.L.(l + ceil(log2 L))), A = Theta(L) - list memory
        N-proportional, accesses N-independent.
    Under FC >= A.M^{1/3}: mode S gives FC = Theta(N.L^{4/3}) and mode M gives
    FC = Theta(N^{1/3}.L^{4/3}), so THE FULL-COST OPTIMISER PREFERS MODE M BY A
    FACTOR N^{2/3} - i.e. the memory charge, on this derivation, pushes the
    merge-based family TOWARD the N-proportional memory law and AWAY from the
    N-proportional access law, which is the OPPOSITE of the direction the
    original claim assumed. Under unit-cost RAM the two modes cost the same up to
    constants, so the mode choice is invisible to G and visible only to FC. THAT
    ASYMMETRY - a choice that exists for one family and not the other, and that
    only the full-cost basis can see - IS THE ONLY SURVIVING CANDIDATE MECHANISM,
    IT IS NOT DERIVED HERE TO A SIGN, and Stage 1 must derive it jointly with the
    re-optimisation of (p, l) rather than assume it. [DERIVED IN REPAIR
    2026-08-24; every expression above is re-derived and re-checked in Stage 1
    and the package stops at Stage 1 if the derivation does not survive.]

    (C) THE SECOND AXIS, WHICH IS NOT A DESIGN PARAMETER. N is not capped at n.
    Q ciphertexts produced under ONE public key are Q message-recovery instances
    of syndrome decoding in the SAME quasi-cyclic code - the code is fixed by h,
    which is fixed by the public key's seed - and each carries its own n cyclic
    shifts, so N = n.Q. Under a gain law N^g, the message-recovery work factor
    falls like (n.Q)^{-g}. Q is set by deployment, not by the designer: it is
    the number of encapsulations a key ever serves. THE CLAIM IS THEREFORE
    QUANTITATIVE AND FALSIFIABLE: there exists a computable N*(variant, basis)
    beyond which the amortised full cost stops falling, because the merge that
    absorbs the instances costs more than the instances buy; the proposal
    computes it, at HQC-1/3/5, in exact integer arithmetic, AND IT NOW COMPUTES
    IT SEPARATELY ON THE TWO AXES, because the repair shows the two axes have
    different memory laws and an N* quoted without its axis is meaningless.

    (D) THE FORCED SHAPE, WHICH IS THE GRADED CONTROL AND IS DERIVED BEFORE ANY
    RUN. Define FC*(N) as the minimum, over the variant's free parameters AND
    over the number N' <= N of instances actually used, of the full cost of
    solving one out of N. Then FC*(N) is NON-INCREASING in N by construction -
    a larger instance set cannot raise a minimum, because the extra instances
    can be ignored - and it must FLATTEN once the marginal merge cost exceeds the
    marginal discount. Three shapes are pre-declared and each is diagnostic: a
    curve that keeps falling to the largest N tested means the instance axis is
    free at full cost and the DOOM credit survives intact, which is a real and
    reportable negative; a curve that RISES anywhere is an implementation defect,
    since the feasible sets are nested; a curve that flattens at N* < n means
    part of the deployed DOOM credit is an artefact of free memory and the
    full-cost security floor is HIGHER than the published gate-count figure.

    (E) DIRECTION DISCLOSED IN ADVANCE, BECAUSE IT POINTS THE UNFASHIONABLE WAY.
    If the memory charge erases part of the DOOM discount, HQC LOOKS STRONGER
    under full cost, not weaker. That is stated here, before any computation, so
    that a result pointing that way cannot be quietly dropped - the same
    discipline ISD-FC-2026 rule U10 inherits from KN-TECH-050, and the same
    disclosure IDEA-20260805-baa4da made for its own headline. A program that
    only reports re-costings which lower security estimates is running a biased
    instrument. THE REPAIR ADDS THE SYMMETRIC DISCLOSURE: the mode-S/mode-M
    derivation in (B) points the OTHER way - it makes the merge-based family
    cheaper under full cost than a naive streaming accounting would - and it is
    recorded here for the same reason.

    (F) WHAT IS NOT CLAIMED. No attack. No new decoding algorithm. No exponent
    is moved: sqrt(n) at n = 17669 is about 7 bits and n.Q with any operationally
    plausible Q is subexponential in the code length, so this is a CONCRETE-COST
    result and says so. Nothing is executed at HQC's parameters; expressions are
    evaluated at them, which is a model claim under RQ-HQC-001's toy ceiling.
    AND, AFTER THE REPAIR: the headline mechanism of (B) is NOT claimed. It is a
    question Stage 1 answers, with an explicit stop rule if the answer is no.

  mechanism: >-
    STAGE 0 (READING AND FORK RESOLUTION, ZERO COMPUTE). Two forks must be
    declared, not chosen. FORK-W: SPEC section 4.1 says "omega ... denote the
    weight of the vectors (x, y)", which IDEA-20260805-baa4da already carries as
    W = 2w versus W = w; both readings are carried through every table.
    FORK-GAIN: the gain law itself. The statement "Stern gains about sqrt(N)"
    is Sendrier's and is RECALLED here, not read; the statement that the gain
    for merge-free ISD is up to N is DERIVED in stage 1 below rather than cited.
    Whichever way the reading resolves, both laws are computed from first
    principles in stage 1, so the proposal does not depend on the citation.
    Stage 0 also confirms the Q-axis structural assumption against the 2025
    specification, and records whether a published memory-charged multi-instance
    HQC figure exists.

    STAGE 1 (THE MEMORY LAW FIRST, THEN THE GAIN LAW, EXACT INTEGERS, WITH A
    STOP RULE). REORDERED BY REPAIR 2026-08-24: the memory law is derived BEFORE
    any grid is run, because the record's original headline rested on an
    asserted memory asymmetry that the repair's own derivation contradicts.
    STAGE 1a, THE 2x2 MEMORY TABLE. Write M(N) and A(N) in closed form for each
    cell of (axis) x (family), axis in {shift orbit, Q distinct ciphertexts},
    family in {elimination-only, merge-based}, splitting M into an INSTANCE-STORE
    component and a LIST component and reporting them separately:
      shift x elimination-only: M_inst = r + ceil(log2 N); M_list = 0;
        matrix store Theta(n_len.k_len); A = Theta(N.r) per iteration.
      shift x merge-based:      M_inst = r + ceil(log2 N); M_list is mode-
        dependent (mode S: Theta(L.(l + ceil(log2 L))), A = Theta(N.L);
        mode M: Theta(N.L.(l + ceil(log2 L))), A = Theta(L)); the FC-optimal
        mode is selected by the pipeline, not assumed.
      Q x elimination-only:     M_inst = Q.r; M_list = 0; A = Theta(N.r).
      Q x merge-based:          M_inst = Q.r; M_list mode-dependent as above.
    THE STOP RULE, DECLARED BEFORE THE RUN: on any axis where the FC-OPTIMAL
    M(N) and A(N) laws of the two families differ only by N-INDEPENDENT factors,
    the memory-profile mechanism does not separate the families on that axis; the
    headline inequality g(elimination-only) > g(merge-based) is WITHDRAWN for
    that axis at Stage 1, the package reports the derived gain laws and the
    memory table only, and no grid is run for that axis. PRE-REGISTERED
    EXPECTATION FROM THE REPAIR'S OWN DERIVATION: the INSTANCE-STORE components
    coincide across families on BOTH axes, so any separation must come from the
    list component and the mode choice, and the sign of that effect is not
    predicted.
    STAGE 1b, THE GAIN LAW, DERIVED PER VARIANT. For each variant, write its
    per-iteration cost as an explicit sum of phase costs and its per-iteration
    success probability as an explicit binomial expression, then re-derive both
    with N instances present.
    PRANGE WITH N INSTANCES. One iteration picks an information set of size
    k_len and succeeds for instance i iff all W errors of instance i avoid it;
    P = C(n_len - k_len, W)/C(n_len, W) per instance. Testing all N syndromes
    against the SAME elimination costs O(N.(n_len-k_len)) extra bit
    operations and no list memory. So the per-iteration cost is
    (n_len-k_len)^2.n_len + N.(n_len-k_len) and the per-iteration success
    probability is at most N.P and at least N.P.(1 - N.P) by inclusion-exclusion
    truncation. The gain is therefore N exactly while
    N.(n_len-k_len) << (n_len-k_len)^2.n_len, i.e. while N << (n_len-k_len).n_len,
    and it saturates after that. THAT CROSSOVER IS COMPUTABLE IN ONE LINE AT
    HQC'S PARAMETERS AND IS THE FIRST DELIVERABLE.
    STERN WITH N INSTANCES. Stern's lists are C(k_len/2, p) entries keyed on l
    syndrome bits; absorbing N instances means the match must be found against
    any of N shifted targets, under mode S or mode M as in Stage 1a. Both M and
    the access count A are exact binomial expressions in (p, l, N, mode) and are
    optimised over (p, l, mode) SEPARATELY under each accounting basis.
    THE STRUCTURAL QUESTION IS THEN A COMPARISON OF TWO DERIVED LAWS, AND IT IS
    A QUESTION RATHER THAN A CLAIM: does the mode choice available to the
    merge-based family, priced under full cost, produce a strictly smaller gain
    exponent than the elimination-only family's? Stage 1's answer, either way,
    is the deliverable.

    STAGE 2 (THE CHARGE). Adopt ISD-FC-2026's FC = H . T_wall with U4's
    bisection-limited access model T_access >= A/Theta(M^{2/3}) and H >= M, so
    FC >= A . M^{1/3} for any structure holding M bits and making A genuinely
    random accesses. Prange holds the matrix plus the instance store, so
    FC_Prange = G_Prange times M_Prange^{1/3} up to the declared occupancy
    constant - AND THAT FACTOR IS N-DEPENDENT ON THE Q AXIS, which the repair
    makes explicit and which the record's original NULL-1 forbade. Every
    merge-based variant holding M bits and probing each stored element at least
    once has FC = Omega(M^{4/3}/e). Applying this with the M(N) laws from stage
    1a is the whole computation.
    ISD-FC-2026 IS PROPOSED, NOT ADOPTED (DEC-20260802-344883 D-6 left it
    pending); using it here does not adopt it, and every figure is re-derivable
    from the same code by changing U4, which the package must be structured to
    permit.

    STAGE 3 (THE TWO CURVES, ON TWO SEPARATE AXES). Compute FC*(N) and G*(N) -
    the same minimum under unit-cost RAM where memory is free - over a ladder of
    at least 8 values of N, SEPARATELY on the shift axis (N in 1..n, one orbit)
    and on the Q axis (N = n.Q for a declared ladder of Q in {1, 2^16, 2^32,
    2^48, 2^64}). The two axes are never plotted on one curve, because the
    repair shows they have different memory laws and a mixed ladder would
    average two regimes. Report BOTH cost curves side by side per axis. The
    difference between where they flatten is the entire content: if they flatten
    at the same N*, the memory charge does not bind on that instance axis and
    the DOOM credit is basis-independent there; if G* keeps falling while FC*
    flattens, the published credit is partly bought with free memory.

    STAGE 4 (THE Q QUESTION, STATED AS AN OPERATIONAL BOUND). Report, per level
    and per basis, the largest Q for which the amortised full cost per solved
    instance is still falling, and the total discount in bits at Q = 1, 2^16,
    2^32, 2^48, 2^64. This is not a claim that any deployment reaches those Q;
    it is the shape of the curve, and its interpretation is left to a reader who
    knows their own deployment.

    STAGE 5 (POSITIVE CONTROL, MANDATORY AND FIRST). Baby-step giant-step for a
    group of order n, computed by the identical FC pipeline, must place the
    full-cost optimum at table size n^{1/3} and reproduce n^{2/3+o(1)} - the
    published Wiener figure this corpus carries at confidence established
    (KN-TECH-035 via KN-LIT-094) and which TASK-20260728-007 objection F1
    already reproduced once internally on the isogeny side. THIS IS THE SAME
    CONTROL, WITH THE SAME THRESHOLDS, AS CTRL-BSGS IN EXP-HQC-50ebe9, WHICH
    DECLARES THE FITTED FC EXPONENT MUST LIE IN [0.64, 0.69] AND THE OPTIMAL
    TABLE EXPONENT IN [0.31, 0.36]; those windows are inherited verbatim and
    attributed. IF THE PIPELINE DOES NOT REPRODUCE n^{2/3}, IT CANNOT DETECT A
    MEMORY PENALTY THAT IS KNOWN TO EXIST AND NO ISD NUMBER FROM IT MAY BE
    REPORTED, positive or negative.

    STAGE 6 (THE N = 1 SLICE IS A DEPENDENCY, NOT A RE-SPECIFICATION). ADDED BY
    REPAIR 2026-08-24. The single-instance memory-charged baseline - Prange and
    Stern at HQC-1/3/5 on ISD-FC-2026's basis, with the forced inequality
    M < G_Prange^{3/4}, the four accounting bases, the asymmetric-charge audit
    and the two independent reimplementations - is EXP-HQC-50ebe9's contract and
    is not re-specified here. This record consumes it: if EXP-HQC-50ebe9 is
    approved, frozen and executed, its N = 1 outputs are this package's
    baseline-embedding fixture and are cited, not recomputed. If it is not, this
    package computes the N = 1 slice ITSELF but must report it as a
    reproduction of an unexecuted contract, must use that contract's declared
    thresholds unchanged, and must not present it as a new baseline.

