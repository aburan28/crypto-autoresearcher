    results: >-
      IN-CORPUS. The instance count is not a cost axis anywhere - THAT PART
      STANDS. What does not stand, and is corrected by repair 2026-08-24, is the
      original sentence "IDEA-20260805-baa4da is the lane's only ISD record".
      EXP-HQC-50ebe9 IS A COMMITTED ISD CONTRACT IN THIS LANE and its control
      apparatus is this record's, near-verbatim: NULL-PRANGE ("FORCED VALUE
      DERIVED BEFORE THE RUN: FC - G <= 2 log2 N ... if the pipeline returns a
      superpolynomial gap for an algorithm that stores no lists, the memory
      accounting is fabricating occupancy and every number in the package is
      void") is this record's NULL-1; CTRL-BSGS (n^{2/3+o(1)}, table n^{1/3},
