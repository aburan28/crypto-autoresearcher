  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED AND NONE IS CLAIMED, AND THIS RECORD SAYS SO IN ITS
      OWN CLAIM RATHER THAN IN A FOOTNOTE. sqrt(n) at n = 17669 is about 7.05
      bits; n itself is 14.1 bits; and n.Q for any operationally plausible Q is
      subexponential in the code length, so the entire quantity in play is a
      CONCRETE-COST correction of tens of bits against work factors of 128 to
      310 bits. Under docs/target-result-profile.md checklist item C1 this is
      NOT a target-class result and must not be presented as one. Its
      justification as a building block is explicit, per search heuristic 1: it
      is a required input to any honest statement of HQC's ISD security floor,
      GOAL-HQC-001's completion_criteria[0] names such a statement as deliverable
      one, and after eight batches it does not exist.
    memory_exponent: >-
      THE POINT OF THE RECORD, AND NOW WITH A SECOND ARGUMENT. Prange:
      polynomial, and independent of N. Merge-based variants: superpolynomial,
      and GROWING IN N, with the exponent computed in stage 1 rather than
      assumed. Reporting memory beside time is what
      docs/claims-and-verification.md requires always and what the program-wide
      census found 82 of 229 evidence records violating.
    best_known: >-
      For the N = 1 slice: the published gate-count-only figures for advanced ISD
      at HQC's parameters, which this program does not hold in any record -
      GOAL-MCE-001's own checkpoint records TASK-20260803-f3aece reading
      Esser-Bellini Table 1 and DECLINING TO TRANSCRIBE IT. Obtaining them is
      stage 0 and their absence is an infrastructure outcome, never a
      mathematical one. For the N > 1 axis: eprint 2026/1498's snippet-level
      140-bit estimate for HQC Category I is the nearest external figure this
      session found, it is unverified beyond a landing page whose summary
      contained a demonstrable paraphrase error, and it must be re-read before
      any comparison.
    hidden_overhead: >-
      Three disclosures. (i) The polynomial factor in FC_Prange = G_Prange.poly
      is not pinned here and is bounded only by the NULL-1 pass condition
      2 log2 n_len. (ii) The gain law's derivation uses a Bonferroni bracket, so
      the reported gain carries a bracket width that must be printed beside it;
      a single number would be the optimistic end. (iii) KN-OPEN-017 records that
      Wiener's o(1) may be too loose at reachable sizes and that "no source in
      this corpus computes the crossover under full cost" - which is why this
      lane matters beyond HQC and is also why the o(1) here is not decorative.
    tradeoff_note: >-
      The FC*(N) curve IS a time-memory-instances tradeoff surface, computed
      rather than asserted, and its flattening point is the operating point. Note
      the direction that makes this record different from a pure memory audit:
      instances and memory are SUBSTITUTES for a merge-based variant (more
      instances need more list) and COMPLEMENTS for an elimination-only variant
      (more instances need no list), so the surface is not separable and reporting
      the two axes independently would lose exactly the effect being claimed.
      Parallelisation: the N instances are embarrassingly parallel for the
      elimination-only variant and are not for the merge-based one, which is the
      same asymmetry stated in wall-clock terms.

  dominated_by: >-
    n/a for the AUDIT - no attack is proposed, so there is no Pareto point of
    ours to dominate. Rows checked before writing that, across all three axes
    inventor-protocol section 5 names. TIME: the audit costs seconds to minutes
    of integer arithmetic; no cheaper route to a multi-instance full-cost
    baseline exists in this corpus because no route exists at all. MEMORY: a grid
    of a few tens of thousands of (p, l, N) cells, under a gigabyte. DATA /
    QUERIES: zero in the decisive stages; H3's validation draws 10^7 uniform
    information sets at reduced parameters. ON THE QUESTION AUDITED the incumbent
    is the published gate-count-only ISD estimate that sets HQC's claimed
    128/192/256 levels, plus eprint 2026/1498's snippet-level 140-bit Category-I
    figure; THIS PROPOSAL DOES NOT DOMINATE EITHER. It re-expresses them on a
    different and explicitly declared basis and adds an axis they do not carry,
    and whether the bases agree is the experiment.
  sota_delta: >-
    No attack; accounting contribution only. QUANTITATIVELY: multi-instance ISD
    cost records in this repository before, 0; memory-charged ISD baselines
    before, 0 across GOAL-HQC-001, GOAL-MCE-001 and GOAL-SDITH-001, all three of
    which name one as deliverable one. After: a (variant x level x N x basis)
    surface for two variants at three levels. INDICATIVE MAGNITUDE OF THE EFFECT
    BEING MEASURED, from baa4da's own pre-registered indicative figures and
    explicitly NOT a measurement: Prange's gate count at HQC-1 exceeds the
    claimed 128-bit level by about 47.7 bits under W = 2w, so the advanced family
    is currently credited with roughly 47 bits at NIST-1 and DOOM with a further
    7 to 14; how many of those 54-61 bits survive full cost is bounded below by 0
    and above by 61 and is NOT predicted. AGAINST THE EXTERNAL STATE OF THE ART:
    zero delta on every attack axis. No attack, no faster algorithm, no lower
    cost.

  estimated_cost:
    implementation: medium
    compute: low

  recommended_priority: high

  honest_prior_of_survival: >-
    BY PART. (i) That the pipeline produces a defensible (N, G, M, FC) quadruple
    for Prange and Stern at all three levels and passes NULL-1, NULL-2 and the
    BSGS control: ~0.85 - every ingredient is a closed-form binomial expression
    and the positive control has been reproduced once inside this repository; not
    higher because FORK-W can invalidate the transcription and U4b's locality
    exemption gives an implementer room to be wrong while following the rules.
    (ii) That the headline inequality g(elimination-only) > g(merge-based) holds
    as derived: ~0.7. It follows from the absorption-cost asymmetry, which is
    structural, but the merge-based derivation is where I am least confident and
    I have not read Sendrier.
    (iii) That the memory charge MATERIALLY binds on the instance axis at N = n,
    i.e. that N* < n at any level: ~0.25. At N = n = 2^14.1 the shifted-syndrome
    store is a few hundred kilobits, negligible against list sizes that are
    themselves negligible against 2^175 gate-ops, so I expect the charge NOT to
    bind at the single-ciphertext instance count. I am proposing it anyway
    because that expected negative is itself the deliverable - it would say the
    deployed DOOM credit is basis-independent, which nobody here can currently
    assert - and because the Q axis, where the store grows without bound, is
    where the charge must eventually bind and nobody has computed where.
    (iv) That the Q axis survives stage 0's structural check: ~0.85.
    (v) That the package produces a defensible surface in either direction: ~0.9.

