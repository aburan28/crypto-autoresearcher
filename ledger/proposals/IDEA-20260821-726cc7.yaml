  honest_prior_of_survival: >-
    BY PART. REVISED BY REPAIR 2026-08-24.
    (i) That the pipeline produces a defensible (N, G, M, FC) quadruple for
    Prange and Stern at all three levels and passes NULL-1a, NULL-1b, NULL-2 and
    the BSGS control: ~0.8 - every ingredient is a closed-form binomial
    expression and the positive control has been reproduced once inside this
    repository; lowered from 0.85 because the split nulls impose two forced
    profiles instead of one and FORK-W can still invalidate the transcription.
    (ii) That the headline inequality g(elimination-only) > g(merge-based) holds
    as derived: ~0.35, DOWN FROM ~0.7. The repair's own derivation removes the
    argument the 0.7 rested on - the instance-store law is identical across
    families on both axes - and shows that under full cost the merge-based
    family's optimal absorption mode is the one that is CHEAPER, not dearer, by
    N^{2/3}. I still put non-trivial mass on the inequality because I have not
    read Sendrier and because the (p, l) re-optimisation is not derived here, but
    I would no longer bet on it.
    (iii) That Stage 1a's stop rule fires on at least one axis: ~0.6. That is now
    the modal outcome and it is a cheap, paper-only, pre-compute result.
    (iv) That the memory charge MATERIALLY binds on the instance axis at N = n,
    i.e. that N* < n at any level: ~0.2. At N = n = 2^14.1 the shifted-syndrome
    store is a few hundred kilobits and is not even the dominant term in Prange's
    own store, which is the matrix. I am proposing it anyway because that expected
    negative is itself the deliverable - it would say the deployed DOOM credit is
    basis-independent on the shift axis, which nobody here can currently assert -
    and because the Q axis, where the store grows without bound, is where the
    charge must eventually bind and nobody has computed where.
    (v) That the Q axis survives stage 0's structural check: ~0.85.
    (vi) That the package produces a defensible surface in either direction:
    ~0.9.
    (vii) That the package's CONTRIBUTION is material given that the N = 1 slice
    is EXP-HQC-50ebe9's: ~0.6. That, together with (ii), is why this record's
    priority is now medium rather than high.

