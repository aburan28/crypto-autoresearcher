      N = n.Q for message recovery under one key; (iv) the forced
      non-increasing-and-flattening shape of FC*(N) as a graded control, per
      axis. EXPLICITLY NOT CLAIMED NEW ANY MORE: the memory-charged
      single-instance ISD baseline and its five controls, which are
      EXP-HQC-50ebe9's; and the mechanism claim that the memory profile
      separates the ISD families, which the repair's own derivation contradicts
      and which is now an output with a stop rule.
      ASSEMBLED FROM KNOWN PARTS, NONE CLAIMED NOVEL: Prange is 1962, Stern
      1988, Sendrier's DOOM 2011, Wiener full cost is 1990s, and ISD-FC-2026 is
      this program's own convention. EXPOSURE, STATED PLAINLY: the multi-instance
      ISD literature exists (Wu-Zhuang is one paper in it), and it is entirely
      possible that the memory-charged version of exactly this question is
      published. Stage 0 must look, and a positive finding converts this from a
      derivation into a reproduction - which is still the deliverable
      GOAL-HQC-001's completion_criteria[0] names and which still does not exist
      here as an executed result.

  object_first_candidate:
    tracked_object: >-
      The QUADRUPLE (N, G, M, FC) of an ISD execution - the number of
      simultaneous instances consumed, gate-ops under unit-cost RAM, memory
      volume in bits at ISD-FC-2026 section 3(a) occupancy, and full cost under
      U2/U4 - followed through the algorithm's phase decomposition:
      permutation, Gaussian elimination, instance absorption, list construction,
      list query, candidate verification. THE N COORDINATE IS NOW TYPED BY AXIS
      (shift orbit or distinct ciphertexts), because the repair shows the memory
      law differs between them and an untyped N conflates two regimes.
      IDEA-20260805-baa4da tracked the TRIPLE and EXP-HQC-50ebe9 contracts it;
      the content of this record is the fourth coordinate and its axis type.
    established_families_off_limits: >-
      Declared off-limits as the primary lens for this record, per inventor-
      protocol section 1: (i) inventing a decoding algorithm - nothing here is an
      attack, and a proposal that quietly became one would be the failure this
      record exists to avoid; (ii) the DFR / decryption-failure lane, which is
      where eighteen of this goal's twenty proposals already sit; (iii) quantum
      ISD, which is IDEA-20260813-a46301's and IDEA-20260813-c34e09's territory
      and is a different accounting problem; (iv) structural or algebraic attacks
      on quasi-cyclicity, which is IDEA-20260821-9ad4a2's object in this same
      batch; (v) ADDED BY REPAIR: the single-instance memory-charged baseline
      itself, which is EXP-HQC-50ebe9's contract and is consumed here rather than
      re-specified. The instance-count axis of the full-cost accounting family is
      the primary lens.
    lossiness: >-
      SEVERELY LOSSY AND THAT IS THE INTENDED CONDITION OF A COST MODEL. The
      underlying state is an exponentially long execution transcript -
      permutations, matrix states, list contents, every probe. The projection
      keeps four integers plus an axis label and discards which codewords were
      examined, in what order, with what success, and every structural feature of
      the code.
      COMPATIBILITY WITH THE OPERATIONS, WHICH IS THE PART THE TEST IS ABOUT:
      cost is ADDITIVE over the phase decomposition and MULTIPLICATIVE in the U2
      composition, and the instance count enters each phase either additively
      (elimination-only: N extra syndrome tests) or through the list sizes and
      access counts (merge-based, mode-dependent), so the quadruple of a
      composite algorithm is determined by the quadruples of its phases together
      with the declared occupancy intervals and the declared mode. The retained
      part therefore propagates deterministically, which is exactly what
      inventor-protocol section 2 demands. IT IS NOT A CHANGE OF COORDINATES: the
      fibre over a given quadruple contains every algorithm with the same
      resource profile, including ones that decode nothing, so the (Delta, Pi)
      failure of KN-LIT-7595 is structurally impossible here.
    propagation: >-
      One step of the target operation is "increase N by one", AND ITS LAW
      DEPENDS ON WHICH AXIS N LIVES ON - which is the correction the repair
      makes. On the SHIFT axis: both families' success probability rises by P,
      the elimination-only variant's cost rises by (n_len - k_len) and its
      instance store not at all, and the merge-based variant's cost rises either
      in accesses (mode S) or in list memory (mode M) while its instance store
      also does not rise. On the Q axis: both families' instance store rises by
      r bits per new ciphertext, identically. Those are the one-step propagation
      laws, they are written in closed form in stage 1a, and their DIFFERENCE -
      which the repair's derivation says is zero in the instance-store component
      on both axes - is the measurable content. WHETHER THE OBJECT SEPARATES THE
      FAMILY OR MERELY RELABELS IT IS THEREFORE THE QUESTION STAGE 1 ANSWERS,
      not a property this record asserts.
    survival_score: >-
      Survives from N = 1 to N = N*, per axis, and the location of N* on each
      axis IS the deliverable. Beyond N* the object dissolves in a specific and
      reportable way: the minimum stops moving, so the fourth coordinate stops
      carrying information and the quadruple degenerates back to the triple -
      i.e. back to EXP-HQC-50ebe9's object. Naming that dissolution point on each
      axis at HQC's own parameters is the whole result, in either direction. The
      repair adds a second, earlier dissolution mode: if Stage 1a's stop rule
      fires on an axis, the object never separated the families on that axis at
      all, and the honest report is that the fourth coordinate is a bookkeeping
      label there rather than a discriminator.

  null_object_control: >-
    FOUR ARMS, ALL WITH FORCED VALUES DERIVED BEFORE THE RUN, AND THE VERDICT
    EMITTED ON THE NULL ARMS FIRST (KN-TECH-1a5b7e obligations 3-5). NULL-1 IS
    SPLIT BY REPAIR 2026-08-24 BECAUSE ITS ORIGINAL FORCED VALUE WAS FALSE ON
    HALF THE DECLARED LADDER. THE APPARATUS BELOW IS EXP-HQC-50ebe9's,
    EXTENDED ALONG THE INSTANCE AXIS, AND IS ATTRIBUTED THERE.
    NULL-1a, THE MEMORY-FREE OBJECT ON THE SHIFT AXIS: Prange run through the
    identical FC pipeline at every N on the shift ladder (N in 1..n, one cyclic
    orbit). Its instance store is one syndrome plus an index,
    M_inst = r + ceil(log2 N) bits, so the total store is dominated by the
    Theta(n_len.k_len) matrix and is FLAT IN N up to a logarithm. FORCED VALUE:
    log2 FC - log2 G = (1/3) log2 M_Prange + O(1) <= 2 log2 n_len at every N
    (30.22 bits at HQC-1), AND ITS SLOPE IN log2 N ACROSS THE SHIFT LADDER MUST
    BE 0 TO WITHIN 0.05 BITS PER DOUBLING. THIS NULL CAN FAIL: a pipeline that
    charges N.r bits for a rotation orbit returns a gap growing at 1/3 bit per
    doubling of N, which is fabricated occupancy, and every other number in the
    package is void. This is EXP-HQC-50ebe9's NULL-PRANGE restricted to the axis
    on which its forced value is true.
    NULL-1b, THE MEMORY-FREE OBJECT ON THE Q AXIS: the same pipeline at
    N = n.Q for Q on the declared ladder. HERE THE MEMORY IS N-PROPORTIONAL BY
    PHYSICAL NECESSITY AND FOR BOTH FAMILIES: an iteration that tests all Q
    syndromes against ONE elimination must hold Q.r bits concurrently, so
    M_Prange(Q) = Theta(n_len.k_len) + Q.r bits and the gap GROWS. FORCED VALUE,
    DERIVED BEFORE THE RUN at HQC-1 with occupancy constant 1 (n_len = 35338,
    r = n = 17669): the store crosses over from matrix-dominated to
    syndrome-dominated at Q_x = n_len.k_len/r = n_len.k_len/n, i.e. about
    2^16.1, and log2 FC - log2 G = (1/3) log2 M + O(1) takes the values
    approximately 10.07 / 10.39 / 15.37 / 20.70 / 26.04 bits at
    Q = 1 / 2^16 / 2^32 / 2^48 / 2^64, i.e. FLAT to Q_x and then rising at
    exactly 1/3 bit per doubling of Q. THIS NULL CAN FAIL IN BOTH DIRECTIONS,
    WHICH IS WHY IT REPLACES THE BLANKET CONDITION: a gap that is FLAT in Q
    beyond Q_x means the pipeline is NOT charging the syndrome store and is
    UNDER-charging occupancy; a gap that rises faster than 1/3 bit per doubling,
    or that exceeds 2 log2 n_len before Q = 2^76.6, means it is OVER-charging.
    Either voids the package. [FORCED VALUES DERIVED IN REPAIR 2026-08-24 from
    the declared parameters; the pipeline re-derives them and the package halts
    if it cannot.]
    NULL-2, THE INSTANCE-BLIND OBJECT: the identical pipeline with the instance
    absorption DELETED - N instances present but only one used. Its FORCED VALUE
    is FC*(N) = FC*(1) exactly, a flat line, at every N ON BOTH AXES. This is the
    maximal-removal control of KN-TECH-1a5b7e mode 2: total removal of the object
    must be at least as extreme as partial removal and on the same side. If the
    instance-blind arm moves at all, the pipeline is reading something other than
    the instances.
    POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR: baby-step giant-step, whose
    full-cost answer n^{2/3+o(1)} is published, is carried in this corpus at
    confidence established, and has been reproduced once internally. The memory
    charge MUST move its optimum from table size n^{1/2} to n^{1/3}, with the
    fitted exponents inside EXP-HQC-50ebe9's declared windows [0.64, 0.69] and
    [0.31, 0.36]. If it does not, the instrument cannot detect a memory penalty
    known to exist, and no ISD number - positive or negative - is reportable.
    THIS CONTROL AND ITS WINDOWS ARE EXP-HQC-50ebe9's CTRL-BSGS, inherited
    verbatim and attributed.
    COMPARATOR SPREAD: FC separates Prange from any merge-based variant at N = 1
    by construction, since FC_Prange = G_Prange times a polynomial while
    FC_merge = Omega(M^{4/3}/e), and these differ whenever M is superpolynomial -
    THAT IS THE N = 1 SEPARATION AND IT IS EXP-HQC-50ebe9's, NOT THIS RECORD'S.
    WHAT IS AT RISK HERE, AND IS DECLARED AFTER THE REPAIR, IS THE OPPOSITE: the
    instance-store law is IDENTICAL across families on both axes, so the
    N-dependent part of the spread may be zero, and Stage 1a's stop rule exists
    precisely to detect that before any grid is run. What is separately at risk,
    as before, is that the FIRST coordinate G is nearly constant across
    accounting bases up to the word-width factor, which is why ISD-FC-2026 U3
    forbids ranking on G alone.
    GRADED CONTROL WITH AT LEAST 8 POINTS PER AXIS AND MONOTONICITY REPORTED:
    the N ladders themselves. Non-increase is required at every step by nesting
    of the feasible sets; any increase anywhere is an implementation defect and
    never a finding. This is EXP-HQC-50ebe9's CTRL-LADDER extended from the
    memory-cap axis to the instance axis.
    RULE-ON-THE-NULL-FIRST: the three-shape verdict of claim (D) is emitted on
    NULL-1a, NULL-1b and NULL-2 before any real curve is read. NULL-2 must
    receive the "flat / instance axis carries nothing" shape by construction; if
    the rule emits the same shape on NULL-2 and on a real variant, it
    discriminates nothing and is rewritten.

