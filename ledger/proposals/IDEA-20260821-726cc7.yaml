    results: >-
      IN-CORPUS. The instance count is not a cost axis anywhere. IDEA-20260805-
      baa4da is the lane's only ISD record and DEFERS DOOM by name, listing it
      among terms that "LOWER G_Prange and therefore LOWER the ceiling
      G_Prange^{3/4}" and calling it "a stage of the experiment, not an
      assumption of the proposal"; it computes no DOOM figure and does not
      consider multiple ciphertexts at all. Its derived hypothesis H-HQC-1d9b21
      repeats the same deferral verbatim. IDEA-20260813-a46301 is Quantum-DOOM -
      amplitude-amplified folding over the cyclic-shift orbit layered on
      Kachigar-Tillich quantum-walk ISD - which is a QUANTUM proposal in another
      lane, uses N = n only, charges no classical memory, and explicitly takes
      the classical sqrt(n) as a baseline to be beaten rather than as a quantity
      to be re-derived. IDEA-20260813-c34e09 is an orbit-quotient continuous-time
      walk, likewise quantum. The three heavy classical ISD records
      (IDEA-20260805-554b9d at RQ-MCE-e65b3c, IDEA-20260805-43d6df and
      IDEA-20260805-cbd93d at RQ-SDITH-001) concern, respectively, the full-cost
      comparator tau + mu, a re-optimisation error of 6-10 bits when a published
      cost is naively charged, and the d-split admissibility ratio. NONE treats
      the number of instances as a variable, and none is at HQC's parameters.
      EXTERNAL, AT ABSTRACT LEVEL ONLY. Wu and Zhuang, "Syndrome decoding meets
      multiple instances" (arXiv:2209.06656, 14 Sep 2022), state two strategies -
      solve-all-with-precomputation and solve-one-out-of-many - and say for the
      second that they "adapt the analysis for some earlier algorithm" and
      "confirm a related folklore conjecture". A search summary (not the paper)
      reported that the folklore conjecture is that a sqrt(N)-type speedup
      extends from Stern to BJMM and that no analytical result comparable to
      Sendrier's exists for the advanced variants. Carrier, Hatey, Luzzi and
      Tillich, "Multilevel Amortized Gaussian Elimination in Information-Set
      Decoding: Applications to HQC and PCG" (eprint 2026/1498, 25 Jul 2026),
      state per their landing page that the Gaussian-elimination cost is no
      longer negligible, that they reduce memory complexity by about 12 bits,
      and that they estimate the standardized HQC Category I parameter set at
      approximately 140 bits. CAUTION RECORDED DELIBERATELY: the fetch tool's
      summary of that landing page expanded "HQC" as "Hammerquist Quasi-Cyclic",
      which is wrong, so the summary is demonstrably paraphrasing rather than
      quoting and every number above is SNIPPET-LEVEL and must be re-verified
      from the primary PDF before use.
    verdict: >-
      UNVERIFIED. No full text of any external paper was read, and Sendrier's
      DOOM paper - the single most relevant source - was not opened at all.
      CLAIMED NEW RELATIVE TO THIS REPOSITORY: (i) treating N, the instance
      count, as a cost axis alongside time and memory; (ii) the claim that the
      DOOM gain law is determined by a variant's memory profile and therefore
      that full cost penalises the advanced family a SECOND time on the instance
      axis; (iii) the Q axis, i.e. that N = n.Q for message recovery under one
      key; (iv) the forced non-increasing-and-flattening shape of FC*(N) as a
      graded control. ASSEMBLED FROM KNOWN PARTS, NONE CLAIMED NOVEL: Prange is
      1962, Stern 1988, Sendrier's DOOM 2011, Wiener full cost is 1990s, and
      ISD-FC-2026 is this program's own convention. EXPOSURE, STATED PLAINLY:
      the multi-instance ISD literature exists (Wu-Zhuang is one paper in it),
      and it is entirely possible that the memory-charged version of exactly
      this question is published. Stage 0 must look, and a positive finding
      converts this from a derivation into a reproduction - which is still the
      deliverable GOAL-HQC-001's completion_criteria[0] names and which still
      does not exist here.

  object_first_candidate:
    tracked_object: >-
      The QUADRUPLE (N, G, M, FC) of an ISD execution - the number of
      simultaneous instances consumed, gate-ops under unit-cost RAM, memory
      volume in bits at ISD-FC-2026 section 3(a) occupancy, and full cost under
      U2/U4 - followed through the algorithm's phase decomposition:
      permutation, Gaussian elimination, instance absorption, list construction,
      list query, candidate verification. IDEA-20260805-baa4da tracked the
      TRIPLE and the whole content of this record is that adding the fourth
      coordinate reorders the family a second time, in the same direction, by a
      mechanism the triple cannot see.
    established_families_off_limits: >-
      Declared off-limits as the primary lens for this record, per inventor-
      protocol section 1: (i) inventing a decoding algorithm - nothing here is an
      attack, and a proposal that quietly became one would be the failure this
      record exists to avoid; (ii) the DFR / decryption-failure lane, which is
      where eighteen of this goal's twenty proposals already sit; (iii) quantum
      ISD, which is IDEA-20260813-a46301's and IDEA-20260813-c34e09's territory
      and is a different accounting problem; (iv) structural or algebraic attacks
      on quasi-cyclicity, which is IDEA-20260821-9ad4a2's object in this same
      batch. The instance-count axis of the full-cost accounting family is the
      primary lens.
    lossiness: >-
      SEVERELY LOSSY AND THAT IS THE INTENDED CONDITION OF A COST MODEL. The
      underlying state is an exponentially long execution transcript -
      permutations, matrix states, list contents, every probe. The projection
      keeps four integers and discards which codewords were examined, in what
      order, with what success, and every structural feature of the code.
      COMPATIBILITY WITH THE OPERATIONS, WHICH IS THE PART THE TEST IS ABOUT:
      cost is ADDITIVE over the phase decomposition and MULTIPLICATIVE in the U2
      composition, and the instance count enters each phase either additively
      (elimination-only: N extra syndrome tests) or multiplicatively through the
      list sizes (merge-based), so the quadruple of a composite algorithm is
      determined by the quadruples of its phases together with the declared
      occupancy intervals. The retained part therefore propagates
      deterministically, which is exactly what inventor-protocol section 2
      demands. IT IS NOT A CHANGE OF COORDINATES: the fibre over a given
      quadruple contains every algorithm with the same resource profile,
      including ones that decode nothing, so the (Delta, Pi) failure of
      KN-LIT-7595 is structurally impossible here.
    propagation: >-
      One step of the target operation is "increase N by one". Under it, the
      elimination-only variant's success probability rises by P and its cost by
      (n_len - k_len); the merge-based variant's success probability rises by P
      and its list-derived M and A rise too. Those are the two one-step
      propagation laws, they are written in closed form in stage 1, and their
      DIFFERENCE is the measurable content. That the propagation law differs by
      variant is precisely why the object separates the family rather than
      relabelling it.
    survival_score: >-
      Survives from N = 1 to N = N*, and the location of N* IS the deliverable.
      Beyond N* the object dissolves in a specific and reportable way: the
      minimum stops moving, so the fourth coordinate stops carrying information
      and the quadruple degenerates back to the triple. Naming that dissolution
      point at HQC's own parameters is the whole result, in either direction.

  null_object_control: >-
    THREE ARMS, TWO OF THEM WITH FORCED VALUES DERIVED BEFORE THE RUN, AND THE
    VERDICT EMITTED ON THE NULL ARM FIRST (KN-TECH-1a5b7e obligations 3-5).
    NULL-1, THE MEMORY-FREE OBJECT: Prange run through the identical FC
    pipeline at every N on the ladder. Its memory is polynomial in the code
    length and INDEPENDENT OF N, because it stores no list, so the FORCED VALUE
    is log2 FC - log2 G <= 2 log2 n_len at every N. THIS NULL CAN FAIL: if the
    pipeline returns an N-dependent memory gap for an algorithm that holds no
    N-dependent structure, the accounting is fabricating occupancy and every
    other number in the package is void.
    NULL-2, THE INSTANCE-BLIND OBJECT: the identical pipeline with the instance
    absorption DELETED - N instances present but only one used. Its FORCED VALUE
    is FC*(N) = FC*(1) exactly, a flat line, at every N. This is the maximal-
    removal control of KN-TECH-1a5b7e mode 2: total removal of the object must
    be at least as extreme as partial removal and on the same side. If the
    instance-blind arm moves at all, the pipeline is reading something other
    than the instances.
    POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR: baby-step giant-step, whose
    full-cost answer n^{2/3+o(1)} is published, is carried in this corpus at
    confidence established, and has been reproduced once internally. The memory
    charge MUST move its optimum from table size n^{1/2} to n^{1/3}. If it does
    not, the instrument cannot detect a memory penalty known to exist, and no
    ISD number - positive or negative - is reportable.
    COMPARATOR SPREAD IS NONZERO BY THEOREM, NOT BY HOPE: FC separates Prange
    from any merge-based variant by construction, since FC_Prange = G_Prange
    times a polynomial while FC_merge = Omega(M^{4/3}/e), and these differ
    whenever M is superpolynomial. What IS at risk, and is declared, is that the
    FIRST coordinate G is nearly constant across accounting bases up to the
    word-width factor, which is why ISD-FC-2026 U3 forbids ranking on G alone.
    GRADED CONTROL WITH AT LEAST 8 POINTS AND MONOTONICITY REPORTED: the N
    ladder itself. Non-increase is required at every step by nesting of the
    feasible sets; any increase anywhere is an implementation defect and never a
    finding.
    RULE-ON-THE-NULL-FIRST: the three-shape verdict of claim (D) is emitted on
    NULL-1 and NULL-2 before any real curve is read. NULL-2 must receive the
    "flat / instance axis carries nothing" shape by construction; if the rule
    emits the same shape on NULL-2 and on a real variant, it discriminates
    nothing and is rewritten.

  discriminated_from:
    - >-
      IDEA-20260805-baa4da builds the memory-charged ISD baseline for a SINGLE
      instance and derives the forced inequality M < G_Prange^{3/4}. It names
      DOOM only to exclude it from its own figures. This record adds the axis it
      excluded, and the two are complementary rather than overlapping: baa4da's
      inequality is the N = 1 slice of this record's surface, and reproducing it
      exactly at N = 1 is this record's baseline-embedding check.
    - >-
      IDEA-20260813-a46301 (Quantum-DOOM) folds the cyclic-shift orbit into an
      amplitude-amplified quantum walk. It is quantum, it uses N = n only, it
      charges no classical memory, and it treats the classical sqrt(n) as a
      fixed baseline. This record is classical, treats N as free up to n.Q, and
      re-derives the gain law rather than assuming it. A negative here says
      nothing about a46301 and vice versa.
    - >-
      IDEA-20260805-554b9d, IDEA-20260805-43d6df and IDEA-20260805-cbd93d charge
      memory, fix the comparator, and price the d-split constraint at Classic
      McEliece's and SDitH's parameters. All three hold the instance count at
      one. Their machinery is reusable here and is cited as such; their question
      is not this one.
    - >-
      IDEA-20260821-9ad4a2 (this batch) asks how large the instance orbit CAN be
      from symmetry - it bounds N above by the code-preserving subgroup of the
      ring's automorphism group. This record takes N as given and asks what it
      COSTS. 9ad4a2 supplies this record's ceiling on the single-ciphertext axis;
      this record supplies the price. Neither answers the other's question, and
      the two are deliberately kept as separate objects rather than merged.
    - >-
      Every DFR-side record in the lane concerns whether decryption fails. This
      concerns how expensive key and message recovery are. They share only the
      scheme.

  citations:
    - ref: 'Sendrier, "Decoding One Out of Many", PQCrypto 2011'
      provenance: recalled
      claim: >-
        That for N syndrome-decoding instances in one code, an ISD variant of
        Stern's type can be sped up by a factor of roughly sqrt(N), and that the
        n cyclic shifts of a quasi-cyclic syndrome supply N = n such instances
        for free. NOT READ IN THIS SESSION: the search returned a Springer
        landing page and a slide-deck URL and neither was opened. Every use of
        this law in the proposal is as a FORK to be re-derived in stage 1, never
        as an input.
      verified_by: null
    - ref: 'arXiv:2209.06656, Wu and Zhuang, "Syndrome decoding meets multiple
        instances", 14 Sep 2022'
      provenance: retrieved
      claim: >-
        Abstract states two strategies for syndrome decoding with multiple
