        merge-based family's FC-optimal absorption mode is the MATERIALISING one,
        which cuts the other way. WHAT IS PRE-REGISTERED NOW: Stage 1 reports
        g per (variant, axis, basis, mode) with its closed-form derivation, and
        the package states explicitly whether the two families' gain exponents
        differ. Either answer is the deliverable; neither is the headline this
        record originally claimed.
    - metric: >-
        delta_FC(N) = log2 FC*(1) - log2 FC*(N) against
        delta_G(N) = log2 G*(1) - log2 G*(N), over the N ladder, per axis
      direction: lower
      minimum_effect: >-
        delta_FC(N) <= delta_G(N) at EVERY ladder point, strictly wherever the
        FC-optimal memory is superpolynomial, because charging a nonnegative
        penalty cannot increase an advantage. delta_FC > delta_G anywhere is an
        implementation defect and a hard invalidation, never a finding. NO
        MAGNITUDE IS PREDICTED - pre-registering one would be a fit.
    - metric: 'Shape of FC*(N) over a ladder of at least 8 values of N, per axis'
      direction: lower
      minimum_effect: >-
        NON-INCREASING at every one of the >= 8 points, by nesting of the
        feasible sets. Any increase is an implementation defect. The flattening
        point N* must coincide, to within one ladder step, with the analytic
        stationarity prediction obtained by setting the derivative of log FC to
        zero along the variant's parameter family; disagreement by more than one
        step means the grid is too coarse or the derivation is wrong, and the
        package reports which. Reported PER AXIS and never on a mixed ladder.
    - metric: 'NULL-1a (Prange, shift axis): slope of log2 FC - log2 G in log2 N'
      direction: different
      minimum_effect: >-
        0 TO WITHIN 0.05 BITS PER DOUBLING, with the gap itself at most
        2 log2 n_len (30.22 bits at HQC-1). A slope of about 1/3 means the
        pipeline is charging N copies of a rotation orbit and the memory
        accounting is fabricating occupancy; package void.
    - metric: 'NULL-1b (Prange, Q axis): log2 FC - log2 G against log2 Q'
      direction: higher
      minimum_effect: >-
        FLAT to Q_x = n_len.k_len/r (about 2^16.1 at HQC-1) and then RISING AT
        1/3 BIT PER DOUBLING OF Q, taking the derived values approximately
        10.07 / 10.39 / 15.37 / 20.70 / 26.04 bits at Q = 1 / 2^16 / 2^32 /
        2^48 / 2^64. A gap that stays FLAT beyond Q_x means the syndrome store
        is not charged and occupancy is UNDER-counted; a slope materially above
        1/3 means it is OVER-counted. Either voids the package. THE ORIGINAL
        RECORD'S CONDITION - that ANY N-dependence here voids the package - IS
        WITHDRAWN: it would have voided the package on the one axis this record
        claims as novel, for behaviour that is physically necessary and shared by
        both families.
    - metric: 'NULL-2 (instance-blind arm): FC*(N) across the ladder, both axes'
      direction: different
      minimum_effect: >-
        EXACTLY FLAT, to the last bit, at every ladder point. Any movement voids
        the package.
    - metric: 'POSITIVE CONTROL: full cost of baby-step giant-step for a group of order n'
      direction: different
      minimum_effect: >-
        n^{2/3+o(1)}, with the optimum at table size n^{1/3}: fitted FC exponent
        in [0.64, 0.69] and table exponent in [0.31, 0.36], EXP-HQC-50ebe9's
        declared windows. Reported BEFORE any ISD number. If not reproduced, no
        ISD number is reportable in either direction.
    - metric: >-
        asymmetric_charge_audit (ISD-FC-2026 section 6): number of phases where an
        access is charged on read but not on write, or on query but not on build
      direction: lower
      minimum_effect: >-
        EXACTLY 0, verified phase by phase against an enumerated phase list, by a
        reader who is not the producer. ISD-FC-2026 U5 records this exact defect
        being found in this program's own isogeny derivation and forcing a
        withdrawn exponent; "none found" by the producer is explicitly not a
        finding until independently confirmed. This audit is EXP-HQC-50ebe9's and
        is inherited with its independent-confirmation requirement intact.

  minimal_test:
    design: >-
      Pure-Python arbitrary-precision integers and Fractions throughout - no
      solver, no numpy, no scipy, no network in the decisive stages, which
      matters because this container's library inventory has been disputed
      twice. SEVEN STAGES, CHEAPEST DECISIVE FIRST. Stage 0: reading - resolve
      FORK-W and the Q-axis structural assumption from the 2025 specification,
      and look for a published memory-charged multi-instance HQC figure,
      recording whether one exists. Stage 1a (minutes, on paper): the 2x2
      instance-store and list memory table, with the stop rule applied BEFORE any
      grid is run. Stage 1b (seconds): the derived gain laws per variant per
      axis, and the Prange instance crossover. Stage 2 (seconds): NULL-1a,
      NULL-1b, NULL-2 and the BSGS positive control, hash-committed and reported
      BEFORE anything else. Stage 3 (seconds): the N = 1 slice, CONSUMED from
      EXP-HQC-50ebe9 if that contract has been executed and otherwise recomputed
      and labelled a reproduction of an unexecuted contract. Stage 4 (minutes):
      the FC*(N) and G*(N) ladders over at least 8 N values PER AXIS at each of
      three levels, both FORK-W readings, with (p, l, mode) optimised on an
      exhaustive grid under each basis. Stage 5 (minutes): sensitivity rows under
      unit-cost RAM, planar M^{1/2}, and logarithmic access, side by side.
      THE DISCRIMINATION, RESTATED AFTER THE REPAIR: Stage 1a has exactly two
      outcomes and both are informative and both are cheap. Either the FC-optimal
      M(N) and A(N) laws of the two families differ by an N-DEPENDENT factor on
      some axis - in which case the instance axis genuinely reorders the family
      there and the ladders quantify by how much - or they do not, in which case
      the fourth coordinate is a bookkeeping label on that axis, the headline is
      withdrawn for it, and the package reports the derived laws plus that
      closure. The second outcome is what the repair's own derivation expects for
      the instance-store component, and it is reached on paper before any grid is
      run. The whole thing is decidable inside an hour of single-core compute.
    controls:
      - >-
        NULL-1a, Prange on the shift axis, forced value: gap flat in N to within
        0.05 bits per doubling and at most 2 log2 n_len. CAN FAIL.
      - >-
        NULL-1b, Prange on the Q axis, forced value: gap flat to Q_x = 2^16.1
        then rising at exactly 1/3 bit per doubling, with the derived values
        10.07 / 10.39 / 15.37 / 20.70 / 26.04 bits on the declared Q ladder. CAN
        FAIL IN BOTH DIRECTIONS (under-charge and over-charge).
      - >-
        NULL-2, instance-blind arm with absorption deleted, forced value exactly
        flat on both axes, the maximal-removal control.
      - >-
        POSITIVE CONTROL, baby-step giant-step, required to reproduce n^{2/3+o(1)}
        with the optimum at n^{1/3} and fitted exponents inside EXP-HQC-50ebe9's
        windows [0.64, 0.69] and [0.31, 0.36], reported first. Attributed to
        EXP-HQC-50ebe9's CTRL-BSGS.
      - >-
        STAGE 1a STOP RULE as a pre-compute control: if the two families' FC-
        optimal M(N) and A(N) laws differ only by N-independent factors on an
        axis, no grid is run for that axis and the headline is withdrawn there.
      - >-
        GRADED CONTROL with >= 8 ladder points PER AXIS and monotonicity reported
        explicitly, with the flattening point compared against the analytic
        stationarity prediction. Attributed to EXP-HQC-50ebe9's CTRL-LADDER,
        extended from the memory-cap axis to the instance axis.
      - >-
        NEARBY OBJECT WHERE THE CONCLUSION SHOULD DIFFER: the identical pipeline
        at Classic McEliece's parameters, which are NOT quasi-cyclic and where
        the free-shift instance supply is absent (N = 1 unless many ciphertexts
        exist), and at a low-weight regime where Prange is known to be
        competitive. A pipeline that reports the same verdict everywhere is
        reporting the accounting basis rather than the parameters. Attributed to
        EXP-HQC-50ebe9's nearby_object_controls.
      - >-
        ACCOUNTING-BASIS SENSITIVITY ROWS: unit-cost RAM (memory free), planar
        M^{1/2}, logarithmic addressing, all three reported side by side, as
        ISD-FC-2026 U3 requires.
      - >-
        ORDERING CONTROL: nulls and positive control computed, hash-committed and
        reported BEFORE the variant grids are run. Attributed to
        EXP-HQC-50ebe9's ordering_control.
      - >-
        ASYMMETRIC-CHARGE AUDIT, phase by phase, independently confirmed.
        Attributed to EXP-HQC-50ebe9's asymmetric_charge_audit.
      - >-
        FORK CONTROL: every table under both FORK-W readings.
      - >-
        MODE CONTROL: for every merge-based cell, both absorption modes (stream
        and materialise) costed and the FC-optimal one reported with its margin,
        so that a mode chosen for convenience cannot masquerade as a derived law.
    required_metrics:
      - '(N, axis, G, M, FC) per (variant x level x N x basis x mode) cell, never a scalar'
      - 'the 2x2 instance-store and list memory table with its closed-form entries'
      - 'the Stage 1a stop-rule verdict per axis, reported before any grid'
      - 'derived gain exponent g per variant per axis, with its closed-form derivation'
      - 'the Prange instance crossover, as a forced value'
      - 'delta_G(N) and delta_FC(N) over each ladder, with optimal parameters and mode per cell'
      - 'FC*(N) shape verdict, monotonicity, and flattening point N* against the analytic prediction, per axis'
      - 'NULL-1a slope, NULL-1b gap profile, NULL-2 flatness, and the BSGS exponents, all reported first'
      - 'the largest Q for which the amortised full cost is still falling, per level and basis'
      - 'total discount in bits at Q in {1, 2^16, 2^32, 2^48, 2^64}'
      - 'asymmetric_charge_audit phase by phase, with the independent checker named'
      - 'the three sensitivity bases side by side'
      - 'the resolved FORK-W reading, quoted from the primary text'
      - 'the provenance of the N = 1 slice: consumed from EXP-HQC-50ebe9, or recomputed and labelled as a reproduction of an unexecuted contract'

  falsification_conditions:
    - >-
      The BSGS positive control does not reproduce n^{2/3+o(1)} inside
      EXP-HQC-50ebe9's declared windows. Instrument failure; NO ISD figure is
      reported in either direction.
    - >-
      NULL-1a: the Prange FC-minus-G gap on the SHIFT axis varies with N by more
      than 0.05 bits per doubling. The pipeline is charging N copies of a
      rotation orbit; the memory accounting is fabricating occupancy; package
      void.
    - >-
      NULL-1b: the Prange FC-minus-G gap on the Q AXIS is FLAT beyond
      Q_x = n_len.k_len/r, or rises at a rate materially different from 1/3 bit
      per doubling of Q. Flat means the Q.r syndrome store is not being charged
      (under-count); a different slope means the occupancy model is not the
      declared one. Either voids the package.
      THE ORIGINAL BLANKET CONDITION - "NULL-1 returns an N-dependent FC-minus-G
      gap for Prange. The memory accounting is fabricating occupancy; package
      void" - IS DELETED BY REPAIR 2026-08-24. It was false on the Q axis, where
      N-proportional memory is physically necessary for BOTH families, and an
      executor running the declared ladder to N = n.Q would have been required to
      void the package for correct behaviour on the very axis this record claims
      as novel.
    - >-
      NULL-2 is not exactly flat. The pipeline is reading something other than
      the instances; package void.
    - >-
      FC*(N) increases at any ladder step, or delta_FC > delta_G anywhere.
      Feasible sets are nested and the penalty is nonnegative, so both are
      implementation defects and never findings.
    - >-
      STAGE 1a FIRES ITS STOP RULE ON BOTH AXES: the FC-optimal M(N) and A(N)
      laws of the elimination-only and merge-based families differ only by
      N-independent factors everywhere. Then the memory-profile mechanism does
      not separate the families on the instance axis at all, the claim (B)
      headline is withdrawn IN FULL rather than per axis, and the deliverable is
      the derived memory and gain laws plus that closure, recorded with its
      obstruction block (the quantity, its closed form, its scope) so the next
      agent does not re-tread it. THE REPAIR'S OWN DERIVATION EXPECTS THIS FOR
      THE INSTANCE-STORE COMPONENT, which is why the rule is a stop rule and not
      a footnote.
    - >-
      N* exceeds n.Q at every plausible Q and every level, i.e. the memory charge
      never binds on the instance axis. Then the DOOM credit survives full cost
      intact, HQC's published crediting of it is basis-independent, and THE
      HONEST DELIVERABLE IS THAT NEGATIVE, stated with its exact tested boundary
      (these parameters, this access model, these variants, this axis) and with
      the sensitivity rows. Pre-declaring this outcome as usable is deliberate: a
      re-costing exercise that can only "succeed" by finding a problem is not an
      instrument.
    - >-
      Stage 0 finds that the 2025 specification rerandomises h per ciphertext or
      otherwise breaks the same-code property. The Q axis collapses to Q = 1, the
      proposal is halved, and that is reported rather than worked around.

  confounders:
    - >-
      WORD-WIDTH DIVERGENCE. Published ISD figures count vector operations,
      machine-word operations, bit operations or gates, and the conversions
      differ by factors of hundreds. ISD-FC-2026 U1 fixes gate-ops and requires
      the conversion factor to be stated on every quoted comparison.
    - >-
      THE ABSORPTION-MODE CHOICE IS THE NEW LARGEST CONFOUNDER, ADDED BY REPAIR.
      A merge-based variant can stream the N targets (N-proportional accesses,
      N-independent list memory) or materialise them (N-independent accesses,
      N-proportional list memory). Under FC these differ by N^{2/3} in the
      repair's derivation, and under unit-cost RAM they do not differ at all.
      A producer who fixes the mode by habit rather than by optimisation can
      manufacture either sign of the headline. The MODE CONTROL - both modes
      costed, the optimal one reported with its margin - is the guard.
    - >-
      THE U4b LOCALITY EXEMPTION IS THE MOST ABUSABLE RULE IN THE CONVENTION and
      ISD-FC-2026 says so. In the multi-instance setting it is MORE abusable, not
      less, because the N shifted syndromes of a quasi-cyclic code are related by
      a rotation and a producer wanting a low FC can claim their probes are
      sequential. Any such claim must exhibit the concrete addressing order, and
      the default for hash-keyed and nearest-neighbour probes is random.
    - >-
      THE SHIFTS ARE NOT INDEPENDENT INSTANCES. The n cyclic shifts of one
      syndrome have solutions that are shifts of one another, so the events
      "shift j succeeds at this information set" are not independent, and using
      N.P as the success probability is an inclusion-exclusion truncation. The
      package must report BOTH the union bound N.P and the second-order
      Bonferroni lower bound N.P - C(N,2).P_pair, and must state that the gain
      law's derivation uses the bracket rather than the truncation. This is the
      single most likely place for a silently optimistic number.
    - >-
      MY PRANGE FIGURE IS INHERITED AND CRUDE. baa4da's (n_len-k_len)^2.n_len
      per-iteration term ignores the standard Canteaut-Chabaud-style iterative
      update and the very amortisation eprint 2026/1498 is about; refining it
      LOWERS G_Prange, LOWERS the ceiling, and makes the advanced family's task
      harder, so the crude figure is optimistic FOR THE ADVANCED FAMILY and the
      direction of the error is disclosed rather than hoped about.
    - >-
      PARAMETER TRANSCRIPTION. Every number depends on SPEC Table 5, whose
      neighbouring table already contained a documented error worth 50.7 bits at
      NIST-5 (CORR-20260802-3ae664). Stage 0 re-reads Table 5 from the primary
      PDF rather than from the transcription, as EXP-HQC-50ebe9's stage 0 also
      requires.
    - >-
      Q IS NOT A PROPERTY OF HQC. Reporting a discount at Q = 2^64 without saying
      that no deployment is known to reach it would be a misuse of the curve. The
      curve is reported; the interpretation is left to the reader. Note also that
      at Q = 2^64 the derived instance store is about 2^78 bits, which is not a
      physically realisable machine; the curve is a model statement there and
      must be labelled as one.

  interpretation_limits:
    - >-
      A COST-MODEL COMPUTATION AT CRYPTO PARAMETERS IS NOT CRYPTO-TIER EVIDENCE.
      Nothing is executed at HQC's parameters; expressions are evaluated at them.
      RQ-HQC-001's toy ceiling stands and any downstream citation must carry the
      distinction - the exact failure mode KN-FIND-f8c290 and KN-FIND-2a8b7e
      record, where a single solve at p = 1009 was extrapolated to N = 2^256.
    - >-
      NO ATTACK IS PROPOSED AND NO SECURITY LEVEL IS ASSERTED. The output is a
      BASELINE - the number an attack would have to beat - together with a
      statement of which accounting basis it is on.
    - >-
      THE N = 1 SLICE IS NOT THIS RECORD'S RESULT. It is EXP-HQC-50ebe9's
      contract, unexecuted at the time of writing. Any citation of a
      single-instance memory-charged HQC ISD figure must attribute it there.
    - >-
      THE MECHANISM CLAIM OF (B) IS NOT ESTABLISHED AND IS NOT ASSERTED. After
      the repair it is a question with a stop rule. A downstream record that
      cites this proposal as having shown that full cost penalises the advanced
      ISD family a second time on the instance axis is citing something this
      record explicitly withdrew.
    - >-
      The conclusion is scoped to the variants actually costed. Stern is
      derivable in closed form; MMT, BJMM and May-Ozerov are not costed from
      scratch in the decisive stages, and any statement about them rests on the
      family-wide memory-profile argument, which is a NECESSARY-condition
      argument only - and which the repair shows does not by itself separate the
      families on the instance axis.
    - >-
      ISD-FC-2026 is PROPOSED, NOT ADOPTED. Using it does not adopt it; adoption
      is a Coordinator act.
    - >-
      The Q-axis result concerns MESSAGE recovery (one session key per solved
      instance), not long-term key recovery, and conflating the two would
      overstate the consequence by the difference between a session and a key.

  heuristic_assumptions:
    - id: H1
      statement: >-
        FOR ALL list-based ISD variants V and FOR ALL parameter sets in the
        declared boundary, the number of genuinely random accesses satisfies
        A(V) >= M(V)/e(V), with e the stored element width in bits. The
        quantifier order is deliberate: the bound is claimed uniformly over
        variants, not variant by variant.
      rigorous_support: >-
        Not a distributional claim - a counting statement about the algorithms,
        justified by the observation that a stored element never read could be
        omitted without changing the output, so any variant violating it has a
        strictly cheaper variant with the store removed. The argument is given
        rather than cited. Inherited unchanged from IDEA-20260805-baa4da's
        HEUR-HQC-ISD-1 and from EXP-HQC-50ebe9's HEUR-HQC-ISD-2, and it is not
        upgraded by being restated.
      validation_plan: >-
        SAMPLE: the phase list of each costed variant, enumerated exhaustively -
        there are at most six phases per variant, so this is a finite check, not
        a statistical one. FALSIFICATION ROUTE: exhibit a list-based variant
        whose stored elements are provably touched o(M/e) times and whose output
        is unchanged by removing the untouched part; that variant escapes the
        M^{4/3} floor and the family-wide argument must be restated as
        variant-specific. NOTE THE MODE-M CASE, ADDED BY REPAIR: materialising N
        shifted targets into the keyed structure creates M entries of which only
        a fraction may ever be probed at small L, and that is exactly the shape
        of a counterexample; the mode control must report the probe count per
        stored entry so this assumption is checked rather than assumed.
        TAIL CHECK: not applicable - no distribution is assumed.
    - id: H2
      statement: >-
        U4's Theta(M^{2/3}) bisection throughput is ACHIEVABLE, not merely a
        lower-bound obstruction: FOR ALL stores of M cells there EXISTS a mesh
        layout and routing achieving Theta(M^{2/3}) random accesses per unit
        time.
      rigorous_support: >-
        The lower-bound half is a bisection-bandwidth argument and is rigorous.
        The achievability half is a MODELLING ASSUMPTION and ISD-FC-2026 declares
        it as one in its own text; it is inherited here with that status intact
        and is not upgraded.
      validation_plan: >-
        SAMPLE: not applicable. VALIDATION ROUTE: the BSGS positive control,
        whose published full-cost answer n^{2/3+o(1)} the pipeline must reproduce
        under this model, at n over a ladder of at least five sizes (EXP-HQC-50ebe9
        declares 2^64 to 2^128) so that the exponent is fitted rather than
        asserted. TAIL CHECK: the fitted exponent's residual across the ladder; a
        drift means the model is being applied outside its range. This is the only
        internal check available and it is why the control is mandatory rather
        than decorative.
    - id: H3
      statement: >-
        FOR ALL N <= n and FOR ALL information sets I of size k_len drawn
        uniformly, the events {shift j of the error avoids I}, j = 1..N, satisfy
        N.P - C(N,2).P_pair <= P[some shift succeeds] <= N.P, where P_pair is the
        exact pairwise probability computed from the cyclic overlap structure.
        The gain law is derived from the BRACKET, never from the upper bound
        alone.
      rigorous_support: >-
        Bonferroni's inequalities of orders 1 and 2, which hold for any finite
        union with no distributional assumption; P and P_pair are exact ratios of
        binomial coefficients once the overlap structure of a cyclic shift with a
        uniform k_len-subset is written down.
      validation_plan: >-
        SAMPLE: at reduced quasi-cyclic parameters where P is large enough to
        observe - n in {31, 43, 71, 127} with weights scaled so P is of order
        10^-3 - draw 10^7 uniform information sets, count the empirical
        P[some shift succeeds], and check it lies inside the computed bracket.
        COMPARISON DISTRIBUTION: the bracket itself, which is a two-sided
        prediction and not a fitted curve. TAIL CHECK: the ratio
        P[some shift succeeds]/(N.P) as N grows toward n; it must decrease
        monotonically from 1, and a ratio exceeding 1 anywhere invalidates the
        arithmetic. TRANSFER ASSUMPTION, STATED: these reduced n are three orders
        below HQC's, and the bracket's TIGHTNESS at HQC's n is extrapolated from
        its behaviour at these sizes; the extrapolation is exactly what the tail
        check is for and it is not claimed to be validated by it.
    - id: H4
      statement: >-
        ADDED BY REPAIR 2026-08-24. FOR ALL Q >= 1, an ISD iteration that tests Q
        distinct syndromes against ONE Gaussian elimination holds Theta(Q.r) bits
        concurrently, so the instance-store memory is exactly proportional to Q
        under an H.T_wall charge, for BOTH the elimination-only and the
        merge-based family.
      rigorous_support: >-
        Not distributional; a physical-accounting statement about the H.T_wall
        model. The Q syndromes are algebraically unrelated (they come from
        distinct r_1, r_2, e), so no generator regenerates them from o(Q.r) bits,
        which is what distinguishes this axis from the shift orbit where a single
        representative plus an index suffices. The classical statement it imitates
        is the incompressibility of Q independent uniform r-bit strings.
      validation_plan: >-
        SAMPLE: not applicable - this is a counting statement about the model, not
        about a distribution. FALSIFICATION ROUTE, AND IT IS CONCRETE: exhibit an
        accounting in which the Q syndromes are streamed from external storage so
        that the concurrent store is o(Q.r); the package must then price the
        streaming time under the same H.T_wall rule and report BOTH conventions,
        because moving a charge from memory to time is not removing it. TAIL
        CHECK: the crossover Q_x at which the syndrome store overtakes the matrix
        store must equal n_len.k_len/r to within the declared occupancy constant,
        which at HQC-1 is about 2^16.1; a pipeline whose empirical crossover sits
        elsewhere is using a different occupancy convention and must declare it.

  proof_search_map:
    bottleneck: >-
      The exact step whose removal changes the cost is the ABSORPTION PHASE - how
      a variant consumes N instances into one iteration. For an elimination-only
      variant it is N extra syndrome weight-tests against an already-eliminated
      matrix. For a merge-based variant it is N extra targets threaded through
      the keyed structure, in one of two modes. THE REPAIR SHARPENS THIS: the
      bottleneck is NOT the instance store, whose law is identical across
      families on both axes, but the MODE CHOICE and the access count it
      determines. Everything the proposal can still claim lives there.
    baseline_embedding:
      parameter_slice: >-
        N = 1 is the exact old-method boundary: at N = 1 the quadruple
        degenerates to IDEA-20260805-baa4da's triple and to EXP-HQC-50ebe9's
        contracted object, the absorption phase is empty, and every expression
        must collapse to those records'.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE, OWNED BY EXP-HQC-50ebe9 AND CONSUMED HERE: at
        N = 1, the pipeline must return log2 G_Prange = 175.7 / 246.8 / 310.9
        (W = 2w) or 109.4 / 146.5 / 179.6 (W = w) to within 0.1 bits, and the
        ceiling G_Prange^{3/4} = 2^131.8 / 2^185.1 / 2^233.2 under W = 2w. Those
        are baa4da's own pre-registered indicative values, carried into
        EXP-HQC-50ebe9's preregistered_prediction, inherited with their
        [SESSION-COMPUTED] label and NOT treated as measurements.
    observation_collision:
      observable: >-
        The flattening point N* of the FC*(N) curve, per axis, and the shape
        verdict read from it.
      distinct_preimage_search: >-
        THREE COLLISIONS EXIST AND ALL THREE ARE NAMED. (i) The memory charge
        genuinely binds, versus (ii) the (p, l) optimisation grid is too coarse
        to find the better parameter settings at large N, so the minimum stops
        moving for a numerical reason. These are on opposite sides of the claimed
        conclusion. THE SEPARATING CONDITION is the analytic stationarity
        prediction: the flattening point must agree with the closed-form optimum
        to within one ladder step, and grid refinement must not move it. (iii)
        ADDED BY REPAIR: a curve that flattens because the producer fixed the
        absorption MODE, versus one that flattens because the FC-optimal mode
        itself saturates. THE SEPARATING CONDITION is the mode control - both
        modes costed at every cell, with the margin between them reported. A
        package that reports a flattening point without both separating
        conditions has not distinguished the preimages and must say so.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The quadruple (N, G, M, FC) with N typed by axis, instead of the triple
          (G, M, FC) - carrying more state than the final ranking requires,
          because the instance count is what survives when the same algorithm is
          run against a family of related targets, and that is the situation a
          deployed KEM is actually in.
        predicted_gain: >-
          REVISED BY REPAIR. Originally: "a second, independent penalty on the
          advanced family, compounding with baa4da's M < G_Prange^{3/4}; sign
          pre-registered." That gain is WITHDRAWN as a prediction. What the
