      0.69] and [0.31, 0.36], "IF CTRL-BSGS FAILS, NO ISD NUMBER FROM THIS
      PACKAGE MAY BE REPORTED IN EITHER DIRECTION") is this record's positive
      control; CTRL-LADDER (non-increasing by nesting, flattening point against
      analytic stationarity) is this record's graded control;
      nearby_object_controls (Classic McEliece plus a low-weight regime, "a
      pipeline that returns the same verdict ... is reporting its accounting
      basis rather than its input") is this record's nearby object; and the
      ordering control and asymmetric-charge audit are the same two devices. AT
      THE N = 1 SLICE THIS IS OVERLAP IN BOTH TRACKED OBJECT AND DISCRIMINATING
      TEST, and the repair declares that slice a dependency rather than a
      contribution.
      IDEA-20260805-baa4da remains the ISD PROPOSAL this record extends: it
      DEFERS DOOM by name, listing it among terms that "LOWER G_Prange and
      therefore LOWER the ceiling G_Prange^{3/4}" and calling it "a stage of the
      experiment, not an assumption of the proposal"; it computes no DOOM figure
      and does not consider multiple ciphertexts at all. Its derived hypothesis
      H-HQC-1d9b21 repeats the same deferral verbatim. IDEA-20260813-a46301 is
      Quantum-DOOM - amplitude-amplified folding over the cyclic-shift orbit
      layered on Kachigar-Tillich quantum-walk ISD - which is a QUANTUM proposal
      in another lane, uses N = n only, charges no classical memory, and
      explicitly takes the classical sqrt(n) as a baseline to be beaten rather
      than as a quantity to be re-derived. IDEA-20260813-c34e09 is an
      orbit-quotient continuous-time walk, likewise quantum. The three heavy
      classical ISD records (IDEA-20260805-554b9d at RQ-MCE-e65b3c,
      IDEA-20260805-43d6df and IDEA-20260805-cbd93d at RQ-SDITH-001) concern,
      respectively, the full-cost comparator tau + mu, a re-optimisation error of
      6-10 bits when a published cost is naively charged, and the d-split
      admissibility ratio. NONE treats the number of instances as a variable, and
      none is at HQC's parameters.
      EXTERNAL, AT ABSTRACT LEVEL ONLY. Wu and Zhuang, "Syndrome decoding meets
      multiple instances" (arXiv:2209.06656, 14 Sep 2022), state two strategies -
      solve-all-with-precomputation and solve-one-out-of-many - and say for the
      second that they "adapt the analysis for some earlier algorithm" and
      "confirm a related folklore conjecture". A search summary (not the paper)
      reported that the folklore conjecture is that a sqrt(N)-type speedup
      extends from Stern to BJMM and that no analytical result comparable to
      Sendrier's exists for the advanced variants. Carrier, Hatey, Luzzi and
      Tillich, "Multilevel Amortized Gaussian Elimination in Information-Set
      Decoding: Applications to HQC and PCG" (eprint 2026/1498, 25 Jul 2026),
      state per their landing page that the Gaussian-elimination cost is no
      longer negligible, that they reduce memory complexity by about 12 bits,
      and that they estimate the standardized HQC Category I parameter set at
      approximately 140 bits. CAUTION RECORDED DELIBERATELY: the fetch tool's
      summary of that landing page expanded "HQC" as "Hammerquist Quasi-Cyclic",
      which is wrong, so the summary is demonstrably paraphrasing rather than
      quoting and every number above is SNIPPET-LEVEL and must be re-verified
      from the primary PDF before use.
