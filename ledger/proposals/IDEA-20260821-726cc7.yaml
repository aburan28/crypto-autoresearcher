  assumptions:
    - >-
      That HQC key recovery is quasi-cyclic syndrome decoding of a [2n, n] code
      at weight W, with FORK-W (W = 2w versus W = w) carried openly, exactly as
      IDEA-20260805-baa4da carries it; the two proposals share the ambiguity
      because they share the sentence.
    - >-
      That Q ciphertexts under one public key are Q syndrome-decoding instances
      in the SAME code. This follows from u = r_1 + h.r_2 with h fixed by the
      public key's seed, and it is the load-bearing structural claim of the Q
      axis. IT IS FALSIFIABLE: if the deployed KEM rerandomises h per ciphertext,
      or if the salt enters the code rather than only the randomness derivation,
      the Q axis collapses to Q = 1 and half this proposal dies. Stage 0 checks
      it against the 2025 specification text rather than against memory.
    - >-
      That solving ONE of the Q instances is worth something to an attacker.
      For message recovery this is exactly one session key, not the long-term
      key, and the proposal says so rather than letting the reader assume
      otherwise. The key-recovery axis (N = n only, no Q) is reported separately
      and is the one with long-term consequence.
    - >-
      That U4's Theta(M^{2/3}) bisection bandwidth is the right access model.
      ISD-FC-2026 declares the achievability half a modelling assumption; it is
      inherited with that status intact and the planar M^{1/2} and logarithmic
      models are carried as declared sensitivity rows, not hidden.
    - >-
      That each stored list element is written once and probed at least once, so
      A = Omega(M/e). True for every list-based ISD variant this program can
      name and false for an algorithm that writes a table and never reads most
      of it. Stated so a reviewer can attack it.
    - >-
      NO ASSUMPTION IS MADE ABOUT ANY PUBLISHED ISD COST FIGURE. Nothing in the
      decisive stages depends on Esser-Bellini, on eprint 2026/1498's 140-bit
      estimate, or on any number this program has not derived. Published figures
      enter only as an optional comparison stage whose failure to obtain is an
      infrastructure outcome under AGENTS.md rule 3 and never a mathematical one.

  predictions:
    - metric: >-
        N = 1 slice: log2 G_Prange and the ceiling G_Prange^{3/4} at HQC-1/3/5,
        both FORK-W readings
      direction: different
      minimum_effect: >-
        Must reproduce IDEA-20260805-baa4da's session-computed indicative values
        (175.7 / 246.8 / 310.9 under W = 2w; 109.4 / 146.5 / 179.6 under W = w)
        to within 0.1 bits using the identical expression
        (n_len-k_len)^2 . n_len . C(n_len,W)/C(n_len-k_len,W). THOSE ARE NOT
        MEASUREMENTS - they are that record's own pre-registered indicative
        values, labelled [SESSION-COMPUTED] there and inherited with that label
        here. A departure means a parameter transcription defect and the package
        halts.
    - metric: >-
        The Prange instance crossover: the largest N for which the gain is still
        linear, i.e. the N at which N.(n_len - k_len) reaches
        (n_len - k_len)^2 . n_len
      direction: different
      minimum_effect: >-
        A FORCED VALUE, computable in one line from the parameters and admitting
        no tuning: it is (n_len - k_len).n_len up to the constant in the
        elimination cost. Pre-registered as EXCEEDING n = 17669 at HQC-1 by many
        orders, i.e. the n free cyclic shifts are absorbed by Prange at
        negligible marginal cost. If the computation says otherwise, the
        elimination cost model is wrong and stage 1 halts.
    - metric: >-
        The derived gain exponent g in (gain) = N^g, per variant, at HQC's
        parameters
      direction: different
      minimum_effect: >-
        THE PRE-REGISTERED CONTENT IS AN INEQUALITY, NOT A VALUE:
        g(elimination-only) > g(merge-based), strictly, at N = n and at every
        larger N on the ladder. This is the record's headline mechanism claim and
        it is the one a run can refute. If the derivation returns
        g(elimination-only) <= g(merge-based), the mechanism claim is FALSE, the
        headline is withdrawn, and the honest deliverable is that the instance
        axis does not separate the family - which is a clean negative and is
        recorded with its obstruction.
    - metric: >-
        delta_FC(N) = log2 FC*(1) - log2 FC*(N) against
        delta_G(N) = log2 G*(1) - log2 G*(N), over the N ladder
      direction: lower
      minimum_effect: >-
        delta_FC(N) <= delta_G(N) at EVERY ladder point, strictly wherever the
        FC-optimal memory is superpolynomial, because charging a nonnegative
        penalty cannot increase an advantage. delta_FC > delta_G anywhere is an
        implementation defect and a hard invalidation, never a finding. NO
        MAGNITUDE IS PREDICTED - pre-registering one would be a fit.
    - metric: 'Shape of FC*(N) over a ladder of at least 8 values of N'
      direction: lower
      minimum_effect: >-
        NON-INCREASING at every one of the >= 8 points, by nesting of the
        feasible sets. Any increase is an implementation defect. The flattening
        point N* must coincide, to within one ladder step, with the analytic
        stationarity prediction obtained by setting the derivative of log FC to
        zero along the variant's parameter family; disagreement by more than one
        step means the grid is too coarse or the derivation is wrong, and the
        package reports which.
    - metric: 'NULL-2 (instance-blind arm): FC*(N) across the ladder'
      direction: different
      minimum_effect: >-
        EXACTLY FLAT, to the last bit, at every ladder point. Any movement voids
        the package.
    - metric: 'POSITIVE CONTROL: full cost of baby-step giant-step for a group of order n'
      direction: different
      minimum_effect: >-
        n^{2/3+o(1)}, with the optimum at table size n^{1/3}. Reported BEFORE any
        ISD number. If not reproduced, no ISD number is reportable in either
        direction.
    - metric: >-
        asymmetric_charge_audit (ISD-FC-2026 section 6): number of phases where an
        access is charged on read but not on write, or on query but not on build
      direction: lower
      minimum_effect: >-
        EXACTLY 0, verified phase by phase against an enumerated phase list, by a
        reader who is not the producer. ISD-FC-2026 U5 records this exact defect
        being found in this program's own isogeny derivation and forcing a
        withdrawn exponent; "none found" by the producer is explicitly not a
        finding until independently confirmed.

  minimal_test:
    design: >-
      Pure-Python arbitrary-precision integers and Fractions throughout - no
      solver, no numpy, no scipy, no network in the decisive stages, which
      matters because this container's library inventory has been disputed
      twice. SIX STAGES, CHEAPEST DECISIVE FIRST. Stage 0: reading - resolve
      FORK-W and the Q-axis structural assumption from the 2025 specification,
      and look for a published memory-charged multi-instance HQC figure,
      recording whether one exists. Stage 1 (seconds): NULL-1 and NULL-2 and the
      BSGS positive control, hash-committed and reported BEFORE anything else.
      Stage 2 (seconds): the N = 1 slice reproducing baa4da's indicative
      G_Prange and ceiling. Stage 3 (seconds): the derived gain laws per variant,
      and the Prange instance crossover. Stage 4 (minutes): the FC*(N) and G*(N)
      ladders over at least 8 N values at each of three levels, both FORK-W
      readings, with (p, l) optimised on an exhaustive grid under each basis.
      Stage 5 (minutes): sensitivity rows under unit-cost RAM, planar M^{1/2},
      and logarithmic access, side by side.
      THE DISCRIMINATION: the pre-registered inequality
      g(elimination-only) > g(merge-based) has exactly two outcomes and both are
      informative - it holds, in which case full cost penalises the advanced
      family twice and the compounded magnitude is the deliverable; or it fails,
      in which case the instance axis does not separate the family and the
      quadruple degenerates to the triple, which closes a question this corpus
      has never asked. The whole thing is decidable inside an hour of
      single-core compute.
    controls:
      - >-
        NULL-1, Prange through the identical FC pipeline at every N, forced value
        log2 FC - log2 G <= 2 log2 n_len derived before the run, CAN FAIL.
      - >-
        NULL-2, instance-blind arm with absorption deleted, forced value exactly
        flat, the maximal-removal control.
      - >-
        POSITIVE CONTROL, baby-step giant-step, required to reproduce n^{2/3+o(1)}
        with the optimum at n^{1/3}, reported first.
      - >-
        GRADED CONTROL with >= 8 ladder points and monotonicity reported
        explicitly, with the flattening point compared against the analytic
        stationarity prediction.
      - >-
        NEARBY OBJECT WHERE THE CONCLUSION SHOULD DIFFER: the identical pipeline
        at Classic McEliece's parameters, which are NOT quasi-cyclic and where
        the free-shift instance supply is absent (N = 1 unless many ciphertexts
        exist), and at a low-weight regime where Prange is known to be
        competitive. A pipeline that reports the same verdict everywhere is
        reporting the accounting basis rather than the parameters.
      - >-
        ACCOUNTING-BASIS SENSITIVITY ROWS: unit-cost RAM (memory free), planar
        M^{1/2}, logarithmic addressing, all three reported side by side, as
        ISD-FC-2026 U3 requires.
      - >-
        ORDERING CONTROL: nulls and positive control computed, hash-committed and
        reported BEFORE the variant grids are run.
      - >-
        FORK CONTROL: every table under both FORK-W readings.
    required_metrics:
      - '(N, G, M, FC) quadruple per (variant x level x N x basis) cell, never a scalar'
      - 'derived gain exponent g per variant, with its closed-form derivation'
      - 'the Prange instance crossover, as a forced value'
      - 'delta_G(N) and delta_FC(N) over the ladder, with optimal parameters per cell'
      - 'FC*(N) shape verdict, monotonicity, and flattening point N* against the analytic prediction'
      - 'NULL-1 gap, NULL-2 flatness, and the BSGS exponent, all reported first'
      - 'the largest Q for which the amortised full cost is still falling, per level and basis'
      - 'total discount in bits at Q in {1, 2^16, 2^32, 2^48, 2^64}'
      - 'asymmetric_charge_audit phase by phase, with the independent checker named'
      - 'the three sensitivity bases side by side'
      - 'the resolved FORK-W reading, quoted from the primary text'

  falsification_conditions:
    - >-
      The BSGS positive control does not reproduce n^{2/3+o(1)}. Instrument
      failure; NO ISD figure is reported in either direction.
    - >-
      NULL-1 returns an N-dependent FC-minus-G gap for Prange. The memory
      accounting is fabricating occupancy; package void.
    - >-
      NULL-2 is not exactly flat. The pipeline is reading something other than
      the instances; package void.
    - >-
      FC*(N) increases at any ladder step, or delta_FC > delta_G anywhere.
      Feasible sets are nested and the penalty is nonnegative, so both are
      implementation defects and never findings.
    - >-
      THE HEADLINE MECHANISM FAILS: the derivation returns
      g(elimination-only) <= g(merge-based). The claim that the DOOM gain law is
      determined by the memory profile is then FALSE, the headline is withdrawn
      in full, and the deliverable is the derived gain laws plus the statement
      that the instance axis does not reorder the family - recorded with its
      obstruction block (the quantity, its value, its scope) so the next agent
      does not re-tread it.
    - >-
      N* exceeds n.Q at every plausible Q and every level, i.e. the memory charge
      never binds on the instance axis. Then the DOOM credit survives full cost
      intact, HQC's published crediting of it is basis-independent, and THE
      HONEST DELIVERABLE IS THAT NEGATIVE, stated with its exact tested boundary
      (these parameters, this access model, these variants) and with the
      sensitivity rows. Pre-declaring this outcome as usable is deliberate: a
      re-costing exercise that can only "succeed" by finding a problem is not an
      instrument.
    - >-
      Stage 0 finds that the 2025 specification rerandomises h per ciphertext or
      otherwise breaks the same-code property. The Q axis collapses to Q = 1, the
      proposal is halved, and that is reported rather than worked around.

  confounders:
    - >-
      WORD-WIDTH DIVERGENCE. Published ISD figures count vector operations,
      machine-word operations, bit operations or gates, and the conversions
      differ by factors of hundreds. ISD-FC-2026 U1 fixes gate-ops and requires
      the conversion factor to be stated on every quoted comparison.
    - >-
      THE U4b LOCALITY EXEMPTION IS THE MOST ABUSABLE RULE IN THE CONVENTION and
      ISD-FC-2026 says so. In the multi-instance setting it is MORE abusable, not
      less, because the N shifted syndromes of a quasi-cyclic code are related by
      a rotation and a producer wanting a low FC can claim their probes are
      sequential. Any such claim must exhibit the concrete addressing order, and
      the default for hash-keyed and nearest-neighbour probes is random.
    - >-
      THE SHIFTS ARE NOT INDEPENDENT INSTANCES. The n cyclic shifts of one
      syndrome have solutions that are shifts of one another, so the events
      "shift j succeeds at this information set" are not independent, and using
      N.P as the success probability is an inclusion-exclusion truncation. The
      package must report BOTH the union bound N.P and the second-order
      Bonferroni lower bound N.P - C(N,2).P_pair, and must state that the gain
      law's derivation uses the bracket rather than the truncation. This is the
      single most likely place for a silently optimistic number.
    - >-
      MY PRANGE FIGURE IS INHERITED AND CRUDE. baa4da's (n_len-k_len)^2.n_len
      per-iteration term ignores the standard Canteaut-Chabaud-style iterative
      update and the very amortisation eprint 2026/1498 is about; refining it
      LOWERS G_Prange, LOWERS the ceiling, and makes the advanced family's task
      harder, so the crude figure is optimistic FOR THE ADVANCED FAMILY and the
      direction of the error is disclosed rather than hoped about.
    - >-
      PARAMETER TRANSCRIPTION. Every number depends on SPEC Table 5, whose
      neighbouring table already contained a documented error worth 50.7 bits at
      NIST-5 (CORR-20260802-3ae664). Stage 0 re-reads Table 5 from the primary
      PDF rather than from the transcription.
    - >-
      Q IS NOT A PROPERTY OF HQC. Reporting a discount at Q = 2^64 without saying
      that no deployment is known to reach it would be a misuse of the curve. The
      curve is reported; the interpretation is left to the reader.

  interpretation_limits:
    - >-
      A COST-MODEL COMPUTATION AT CRYPTO PARAMETERS IS NOT CRYPTO-TIER EVIDENCE.
      Nothing is executed at HQC's parameters; expressions are evaluated at them.
      RQ-HQC-001's toy ceiling stands and any downstream citation must carry the
      distinction - the exact failure mode KN-FIND-f8c290 and KN-FIND-2a8b7e
      record, where a single solve at p = 1009 was extrapolated to N = 2^256.
    - >-
      NO ATTACK IS PROPOSED AND NO SECURITY LEVEL IS ASSERTED. The output is a
      BASELINE - the number an attack would have to beat - together with a
      statement of which accounting basis it is on.
    - >-
      The conclusion is scoped to the variants actually costed. Stern is
      derivable in closed form; MMT, BJMM and May-Ozerov are not costed from
      scratch in the decisive stages, and any statement about them rests on the
      family-wide memory-profile argument, which is a NECESSARY-condition
      argument only.
    - >-
      ISD-FC-2026 is PROPOSED, NOT ADOPTED. Using it does not adopt it; adoption
      is a Coordinator act.
    - >-
      The Q-axis result concerns MESSAGE recovery (one session key per solved
      instance), not long-term key recovery, and conflating the two would
      overstate the consequence by the difference between a session and a key.

  heuristic_assumptions:
    - id: H1
      statement: >-
        FOR ALL list-based ISD variants V and FOR ALL parameter sets in the
        declared boundary, the number of genuinely random accesses satisfies
        A(V) >= M(V)/e(V), with e the stored element width in bits. The
        quantifier order is deliberate: the bound is claimed uniformly over
        variants, not variant by variant.
      rigorous_support: >-
        Not a distributional claim - a counting statement about the algorithms,
        justified by the observation that a stored element never read could be
        omitted without changing the output, so any variant violating it has a
        strictly cheaper variant with the store removed. The argument is given
        rather than cited. Inherited unchanged from IDEA-20260805-baa4da's
        HEUR-HQC-ISD-1, and it is not upgraded by being restated.
      validation_plan: >-
        SAMPLE: the phase list of each costed variant, enumerated exhaustively -
        there are at most six phases per variant, so this is a finite check, not
        a statistical one. FALSIFICATION ROUTE: exhibit a list-based variant
        whose stored elements are provably touched o(M/e) times and whose output
        is unchanged by removing the untouched part; that variant escapes the
        M^{4/3} floor and the family-wide argument must be restated as
        variant-specific. TAIL CHECK: not applicable - no distribution is
        assumed.
    - id: H2
      statement: >-
        U4's Theta(M^{2/3}) bisection throughput is ACHIEVABLE, not merely a
        lower-bound obstruction: FOR ALL stores of M cells there EXISTS a mesh
        layout and routing achieving Theta(M^{2/3}) random accesses per unit
        time.
      rigorous_support: >-
        The lower-bound half is a bisection-bandwidth argument and is rigorous.
        The achievability half is a MODELLING ASSUMPTION and ISD-FC-2026 declares
        it as one in its own text; it is inherited here with that status intact
        and is not upgraded.
      validation_plan: >-
        SAMPLE: not applicable. VALIDATION ROUTE: the BSGS positive control,
        whose published full-cost answer n^{2/3+o(1)} the pipeline must reproduce
        under this model, at n over a ladder of at least five sizes so that the
        exponent is fitted rather than asserted. TAIL CHECK: the fitted exponent's
        residual across the ladder; a drift means the model is being applied
        outside its range. This is the only internal check available and it is
        why the control is mandatory rather than decorative.
    - id: H3
      statement: >-
        FOR ALL N <= n and FOR ALL information sets I of size k_len drawn
        uniformly, the events {shift j of the error avoids I}, j = 1..N, satisfy
        N.P - C(N,2).P_pair <= P[some shift succeeds] <= N.P, where P_pair is the
        exact pairwise probability computed from the cyclic overlap structure.
        The gain law is derived from the BRACKET, never from the upper bound
        alone.
      rigorous_support: >-
        Bonferroni's inequalities of orders 1 and 2, which hold for any finite
        union with no distributional assumption; P and P_pair are exact ratios of
        binomial coefficients once the overlap structure of a cyclic shift with a
        uniform k_len-subset is written down.
      validation_plan: >-
        SAMPLE: at reduced quasi-cyclic parameters where P is large enough to
        observe - n in {31, 43, 71, 127} with weights scaled so P is of order
        10^-3 - draw 10^7 uniform information sets, count the empirical
        P[some shift succeeds], and check it lies inside the computed bracket.
        COMPARISON DISTRIBUTION: the bracket itself, which is a two-sided
        prediction and not a fitted curve. TAIL CHECK: the ratio
        P[some shift succeeds]/(N.P) as N grows toward n; it must decrease
        monotonically from 1, and a ratio exceeding 1 anywhere invalidates the
        arithmetic. TRANSFER ASSUMPTION, STATED: these reduced n are three orders
        below HQC's, and the bracket's TIGHTNESS at HQC's n is extrapolated from
        its behaviour at these sizes; the extrapolation is exactly what the tail
        check is for and it is not claimed to be validated by it.

  proof_search_map:
    bottleneck: >-
      The exact step whose removal changes the cost is the ABSORPTION PHASE - how
      a variant consumes N instances into one iteration. For an elimination-only
      variant it is N extra syndrome weight-tests against an already-eliminated
      matrix, costing no memory. For a merge-based variant it is N extra entries
      threaded through the keyed structure, costing memory and random accesses.
      Everything the proposal claims lives in the difference between those two
      absorption costs.
    baseline_embedding:
      parameter_slice: >-
        N = 1 is the exact old-method boundary: at N = 1 the quadruple
        degenerates to IDEA-20260805-baa4da's triple, the absorption phase is
        empty, and every expression must collapse to that record's.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE: at N = 1, the pipeline must return
        log2 G_Prange = 175.7 / 246.8 / 310.9 (W = 2w) or 109.4 / 146.5 / 179.6
        (W = w) to within 0.1 bits, and the ceiling G_Prange^{3/4} =
        2^131.8 / 2^185.1 / 2^233.2 under W = 2w. Those are baa4da's own
        pre-registered indicative values, inherited with their [SESSION-COMPUTED]
        label and NOT treated as measurements.
    observation_collision:
      observable: >-
        The flattening point N* of the FC*(N) curve, and the shape verdict read
        from it.
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IS NAMED. Two distinct worlds produce a curve that
        flattens early: (i) the memory charge genuinely binds, and (ii) the
        (p, l) optimisation grid is too coarse to find the better parameter
        settings at large N, so the minimum stops moving for a numerical reason.
        These are on opposite sides of the claimed conclusion. THE ADDITIONAL
        CONDITION THAT SEPARATES THEM is the analytic stationarity prediction:
        the flattening point must agree with the closed-form optimum to within
        one ladder step, and grid refinement must not move it. A package that
        reports a flattening point without that agreement has not distinguished
        the two preimages and must say so.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The quadruple (N, G, M, FC) instead of the triple (G, M, FC) - carrying
          more state than the final ranking requires, because the instance count
          is what survives when the same algorithm is run against a family of
          related targets, and that is the situation a deployed KEM is actually
          in.
        predicted_gain: >-
          A second, independent penalty on the advanced family, compounding with
          baa4da's M < G_Prange^{3/4}; magnitude not predicted, sign
          pre-registered.
      - transform: specialization_pack
        proposed_object: >-
          The (variant x level x N x basis x FORK-W) grid as an explicit product
          of declared disjoint specialisations, every cell reported.
        predicted_gain: >-
          Removes the producer's freedom to choose a cell after seeing the
          numbers, which is the failure mode KN-TECH-1a5b7e's obligation-3
          criterion exists to prevent.
    quantifier_order: >-
      FOR ALL security levels L, FOR ALL FORK-W readings, FOR ALL accounting
      bases b in {FC, unit-cost RAM, planar, logarithmic}, THERE EXISTS a finite
      N*(L, reading, b, variant) such that FC*_b(N) = FC*_b(N*) for all N >= N*.
      THE WITNESS N* IS ALLOWED TO DEPEND ON THE VARIANT AND ON THE BASIS - that
      dependence is the result, not a weakness - BUT IT MAY NOT DEPEND ON THE
      LADDER, and a N* that moves when the ladder is refined is an artefact of
      the grid.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under ISD-FC-2026's accounting basis, at HQC's published parameters,
        variant V's multi-instance discount stops improving at N = N*, and the
        discount actually available at N = n (respectively n.Q) is D bits under
        full cost against D' bits under unit-cost RAM." It can NEVER certify that
        any ISD variant is optimal, that HQC's claimed security levels are right
        or wrong, or that no cheaper attack exists.
      nearby_object_control: >-
        A NON-quasi-cyclic code at similar length and rate - Classic McEliece's
        parameters - where the free-shift instance supply is absent. The
        conclusion "the instance axis reorders the family" must FAIL there for
        the single-ciphertext case, because N = 1. A method that reports the same
        verdict on both has identified the accounting basis rather than the
        structure.
    proof_obligations:
      - claim: 'The absorption phase cost is O(N.(n_len-k_len)) for elimination-only variants'
        responsibility: size
      - claim: 'The absorption phase raises M and A by explicit amounts for merge-based variants'
        responsibility: memory
      - claim: 'P[some shift succeeds] lies in the derived Bonferroni bracket'
        responsibility: correctness
      - claim: 'The derived gain exponents satisfy g(elimination-only) > g(merge-based)'
        responsibility: strictness
      - claim: 'FC*(N) is non-increasing and flattens at the analytic stationarity point'
        responsibility: runtime
      - claim: 'At N = 1 every expression reproduces IDEA-20260805-baa4da exactly'
        responsibility: baseline
      - claim: 'Q ciphertexts under one key are instances in the same code'
        responsibility: interface
      - claim: 'Nothing here is a statement about a standardized parameter set''s security'
        responsibility: scope
