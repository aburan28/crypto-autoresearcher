  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED AND NONE IS CLAIMED, AND THIS RECORD SAYS SO IN ITS
      OWN CLAIM RATHER THAN IN A FOOTNOTE. sqrt(n) at n = 17669 is about 7.05
      bits; n itself is 14.1 bits; and n.Q for any operationally plausible Q is
      subexponential in the code length, so the entire quantity in play is a
      CONCRETE-COST correction of tens of bits against work factors of 128 to
      310 bits. Under docs/target-result-profile.md checklist item C1 this is
      NOT a target-class result and must not be presented as one. Its
      justification as a building block is explicit, per search heuristic 1: it
      is a required input to any honest statement of HQC's ISD security floor,
      GOAL-HQC-001's completion_criteria[0] names such a statement as deliverable
      one, and after eight batches no EXECUTED such statement exists - one
      contract, EXP-HQC-50ebe9, is specified and awaiting review.
    memory_exponent: >-
      THE POINT OF THE RECORD, AND CORRECTED BY REPAIR. Prange: polynomial in the
      code length, PLUS an instance store that is flat on the shift axis and
      Theta(Q.r) on the Q axis. Merge-based variants: superpolynomial list
      memory, plus the SAME instance store, plus an N-proportional list term if
      and only if the FC-optimal absorption mode is the materialising one. The
      exponents are computed in stage 1a rather than assumed, and the original
      claim that instances enlarge the merge-based structure and not the
      elimination-only one is withdrawn. Reporting memory beside time is what
      docs/claims-and-verification.md requires always and what the program-wide
      census found 82 of 229 evidence records violating.
    best_known: >-
      For the N = 1 slice: EXP-HQC-50ebe9 is the in-corpus incumbent CONTRACT
      (status review_required, no runs), and its preregistered values are this
      record's fixture. The published gate-count-only figures for advanced ISD at
      HQC's parameters this program does not hold in any record - GOAL-MCE-001's
      own checkpoint records TASK-20260803-f3aece reading Esser-Bellini Table 1
      and DECLINING TO TRANSCRIBE IT. Obtaining them is stage 0 and their absence
      is an infrastructure outcome, never a mathematical one. For the N > 1 axis:
      eprint 2026/1498's snippet-level 140-bit estimate for HQC Category I is the
      nearest external figure this session found, it is unverified beyond a
      landing page whose summary contained a demonstrable paraphrase error, and it
      must be re-read before any comparison.
    hidden_overhead: >-
      Four disclosures. (i) The polynomial factor in FC_Prange = G_Prange.poly is
      not pinned here and is bounded only by the NULL-1a pass condition
      2 log2 n_len - and on the Q axis it is not a constant at all but grows like
      (1/3) log2(Q.r), which the repair makes explicit. (ii) The gain law's
      derivation uses a Bonferroni bracket, so the reported gain carries a bracket
      width that must be printed beside it; a single number would be the
      optimistic end. (iii) The absorption mode is a free choice under unit-cost
      RAM and a determined one under FC, and a producer who fixes it by habit
      hides an N^{2/3} factor. (iv) KN-OPEN-017 records that Wiener's o(1) may be
      too loose at reachable sizes and that "no source in this corpus computes the
      crossover under full cost" - which is why this lane matters beyond HQC and
      is also why the o(1) here is not decorative.
    tradeoff_note: >-
      The FC*(N) curve IS a time-memory-instances tradeoff surface, computed
      rather than asserted, and its flattening point is the operating point - now
      reported per axis, because the two axes have different memory laws.
      CORRECTED BY REPAIR: the original text asserted that instances and memory
      are SUBSTITUTES for a merge-based variant and COMPLEMENTS for an
      elimination-only one. The derived instance-store law is the same for both,
      so that asymmetry does not hold for the instance store; what does hold is
      that only the merge-based family has an absorption MODE to optimise over,
      and that mode trades list memory against access count. The surface is
      therefore not separable and reporting the axes independently would lose the
      effect, but the effect is the mode choice and not the instance store.
      Parallelisation: the N instances are embarrassingly parallel for the
      elimination-only variant on both axes; for the merge-based variant they are
      parallel in mode S and not in mode M, which is the same asymmetry stated in
      wall-clock terms.

