      UNVERIFIED. No full text of any external paper was read, and Sendrier's
      DOOM paper - the single most relevant source - was not opened at all.
      CLAIMED NEW RELATIVE TO THIS REPOSITORY, RE-SCOPED BY REPAIR 2026-08-24:
      (i) treating N, the instance count, as a cost axis alongside time and
      memory, ON TWO SEPARATELY DERIVED AXES; (ii) the closed-form
      instance-store memory law per axis and per family, INCLUDING the negative
