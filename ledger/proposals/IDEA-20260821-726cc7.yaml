  assumptions:
    - >-
      That HQC key recovery is quasi-cyclic syndrome decoding of a [2n, n] code
      at weight W, with FORK-W (W = 2w versus W = w) carried openly, exactly as
      IDEA-20260805-baa4da and EXP-HQC-50ebe9 carry it; the three share the
      ambiguity because they share the sentence.
    - >-
      That Q ciphertexts under one public key are Q syndrome-decoding instances
      in the SAME code. This follows from u = r_1 + h.r_2 with h fixed by the
      public key's seed, and it is the load-bearing structural claim of the Q
      axis. IT IS FALSIFIABLE: if the deployed KEM rerandomises h per ciphertext,
      or if the salt enters the code rather than only the randomness derivation,
      the Q axis collapses to Q = 1 and half this proposal dies. Stage 0 checks
      it against the 2025 specification text rather than against memory.
    - >-
      That the Q syndromes must be held concurrently to be tested against one
      elimination, so that M_inst^Q = Theta(Q.r) under an H.T_wall charge. THIS
      IS THE LOAD-BEARING ASSUMPTION OF NULL-1b AND IT IS FALSIFIABLE: an
      accounting in which the syndromes are re-derived from externally stored
      ciphertexts on demand moves the charge from memory to time without removing
      it, and the package must report which convention it used and evaluate both.
    - >-
      That solving ONE of the Q instances is worth something to an attacker.
      For message recovery this is exactly one session key, not the long-term
      key, and the proposal says so rather than letting the reader assume
      otherwise. The key-recovery axis (N = n only, no Q) is reported separately
      and is the one with long-term consequence.
    - >-
      That U4's Theta(M^{2/3}) bisection bandwidth is the right access model.
      ISD-FC-2026 declares the achievability half a modelling assumption; it is
      inherited with that status intact and the planar M^{1/2} and logarithmic
      models are carried as declared sensitivity rows, not hidden.
    - >-
      That each stored list element is written once and probed at least once, so
      A = Omega(M/e). True for every list-based ISD variant this program can
      name and false for an algorithm that writes a table and never reads most
      of it. Stated so a reviewer can attack it.
    - >-
      NO ASSUMPTION IS MADE ABOUT ANY PUBLISHED ISD COST FIGURE. Nothing in the
      decisive stages depends on Esser-Bellini, on eprint 2026/1498's 140-bit
      estimate, or on any number this program has not derived. Published figures
      enter only as an optional comparison stage whose failure to obtain is an
      infrastructure outcome under AGENTS.md rule 3 and never a mathematical one.
    - >-
      NO ASSUMPTION IS MADE, AFTER THE REPAIR, THAT THE MEMORY PROFILE SEPARATES
      THE ISD FAMILIES ON THE INSTANCE AXIS. The repair's own derivation says the
      instance-store law is identical across families on both axes. Stage 1a
      decides, with a declared stop rule.

