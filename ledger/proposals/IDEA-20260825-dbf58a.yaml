  batch: EC-STRUCTURE-20260825
  cluster: 'C6-arity: what the rigidity closure leaves open'
  title: 'ENUMERATE ARITY-TWO OBJECTS AND RUN THE LOSSY-PROJECTION TEST ON EVERY ONE BEFORE ANY EXPERIMENT:
    the rigidity closure forbids nontrivial arity-one objects under the full translation action, so build
    the arity-two table -- diagonal, antidiagonal and [-1] equivariance for each candidate -- and report
    which survive at zero compute'
  class: representation
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: Individual arity-two objects (the differential-addition relation, chord slopes, symmetric
    functions of a pair) are standard and recalled. The proposed contribution is the systematic table
    with the test applied uniformly, which the protocol asks for and which this program has not done at
    arity two.
  claim:
    semantic_part: The rigidity closure applies to objects that are functions of one point and propagate
      deterministically under the full translation action; arity-two objects are outside its scope, and
      the space of them is small enough to enumerate and screen exhaustively at zero compute.
    evaluator_part: 'Unestablished: whether any arity-two candidate survives the test. The likely outcome
      is that all natural candidates fail, and a table of FAILURES with reasons is a legitimate deliverable
      under the closure standard.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - 'Fix the candidate list: the ordered pair of x-coordinates with the differential-addition relation;
    the chord slope, which is translation-covariant rather than invariant; elementary symmetric functions
    of the unordered pair; the divisor class (A) + (B) - 2(O), which is the sum A + B; the resultant of
    the two points'' minimal data; the pair''s Weil-pairing value, which is trivial on a cyclic rational
    subgroup; and the pair''s difference A - B.'
  - For each, state precisely what is discarded and whether the discarded part is recoverable -- the criterion
    that killed the worked example in the protocol's section 2.
  - For each surviving candidate, state its equivariance under the diagonal translation (A, B) -> (A +
    R, B + R), the antidiagonal (A + R, B - R), and [-1].
  - Report the table. Expect (A) + (B) - 2(O) and A - B to fail immediately as changes of coordinates;
    expect the chord slope to fail on covariance; the interesting rows are the ones that survive both.
  lossy_projection_test:
    tracked_object: each arity-two candidate in turn; the record is the screen
    what_is_discarded: candidate-specific and tabulated per row
    propagation: tabulated per row under three group actions
    verdict: This record IS the application of the test; per-row verdicts are its output.
  predictions:
  - id: P1
    status: established_formula
    statement: 'The divisor class (A) + (B) - 2(O) equals the point A + B and so discards nothing beyond
      the pair''s ordering: a change of coordinates.'
  - id: P2
    status: established_formula
    statement: The Weil pairing is trivial on a cyclic rational subgroup, so that row is empty for the
      ECDLP's own group.
  - id: P3
    status: unestablished
    statement: At least one candidate survives both the lossiness criterion and deterministic propagation
      under the diagonal action.
  minimal_discriminating_test:
    status: specified_not_run
    test: Zero-compute algebraic screening of each row, with a toy numerical spot-check that each claimed
      recovery formula actually recovers the discarded data.
    pass: Every row's verdict is supported by an explicit recovery formula or an explicit propagation
      rule.
    fail: A row whose verdict cannot be decided algebraically is recorded as undecided, not as passing.
  controls:
  - Include the protocol's own worked symmetric-side example as a row, to confirm the screening reproduces
    a known verdict.
  - Include one arity-one object already closed by the rigidity result, which must come out closed.
  - Include one deliberately trivial object (a constant), which must come out maximally lossy and useless
    -- the reminder that lossiness alone is not merit.
  confounders:
  - Covariance is easy to mistake for invariance and is the commonest error at arity two.
  - Recovering the discarded data may be possible only for some pairs, making lossiness a generic rather
    than universal property; the row must say which.
  - An object can be lossy and propagating and still useless, as the constant row shows.
  falsification:
    semantic: A row's claimed verdict is falsified by an explicit recovery formula the row missed.
    evaluator: A numerical spot-check failure scopes out that row.
    not_falsification: The table being mostly failures.
  why_this_is_not_a_variant: IDEA-20260815-528b6e observes that the rigidity theorem assumes an object
    is a function of one point and asks what happens for pairs. This record supplies the actual enumeration
    and the per-row screening rather than posing the question, and it cites that record as its origin.
  limits:
