idea:
  id: IDEA-20260809-9a76f2
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-TECDSA-8d340d
  goal_id: GOAL-TECDSA-001
  title: >-
    Which attacks need TWO preconditions at once? Fill the interaction cells that
    single-proof reasoning misses
  class: composition
  claim: >-
    Fix maps are usually built one proof at a time: this proof stops that attack.
    The claim is that at least one attack in this family requires two
    preconditions simultaneously — for example a relaxed range bound AND a
    modulus with exploitable structure — so that enabling either proof alone stops
    it while a reviewer checking proofs individually would find both "covered".
    Interaction cells are exactly what a per-proof audit cannot see.
  mechanism: >-
    Run the full attack suite over the lattice of proof-set configurations rather
    than over single omissions, and identify attacks whose success region in that
    lattice is not a union of single-omission regions.
  why_not_a_renamed_known_approach: >-
    Fault-injection and configuration-space testing are standard in engineering.
    Applying the full configuration lattice to a cryptographic protocol's proof
    set, and specifically hunting for non-union success regions, is what surfaces
    interaction cells that per-proof reasoning treats as covered.
  predictions:
  - observable: existence of an attack whose success region is not a union of single-omission regions
    metric: boolean plus the region's description
    predicted: >-
      Exists. If every success region is a union, the per-proof audit is sound
      for this protocol family, which is a genuinely reassuring structural result
      and worth recording plainly.
  - observable: size of the configuration lattice actually explored
    metric: fraction of the lattice
    predicted: Complete for small proof sets; where incomplete, the unexplored region is listed rather than left implicit.
  minimal_test: >-
    Enumerate the configuration lattice for the reference implementation's proof
    set, run each attack in each configuration with declared budgets, and map the
    success regions.
  controls:
  - 'SINGLE-OMISSION ANCHOR: single-omission results must reproduce those recorded in IDEA-20260809-986816 and 98c5ac exactly, or the lattice run is not comparable.'
  - 'BUDGET UNIFORMITY across the lattice, since an attack that fails only because a cell got less budget produces a false interaction.'
  falsification_conditions:
  - All success regions are unions of single-omission regions.
  - Budgets cannot be equalized across the lattice, making interaction claims unsafe.
  interpretation_limits: >-
    Interaction cells are properties of this reference implementation's proof set.
    They are not claims that any published protocol version has a gap.
  sota_delta: 'Delta: interaction cells that a per-proof audit structurally cannot produce.'
  dominated_by: Downstream of IDEA-20260809-986816 and 98c5ac; not dominated by any corpus record.
  estimated_cost: Implementation small on top of the suite; compute moderate because of the lattice size.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for configuration lattice: no records. WEB NOT CHECKED.'
  source_refs:
  - Threshold ECDSA protocol specifications -- REQUIRED READS.
