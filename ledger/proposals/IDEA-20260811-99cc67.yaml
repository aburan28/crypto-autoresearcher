idea:
  id: IDEA-20260811-99cc67
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE ONE PLACE IN THIS PROGRAM WHERE |Aut| SEPARATES FROM |D_0| - the
    depth-1 107-volcano at N = 19507, t = 211, p = 19717, D = -3*107^2, whose
    CRATER is a single j = 0 vertex with |Aut| = 6 and whose FLOOR is 36 vertices
    with |Aut| = 2, all at IDENTICAL N, p, t and D_0, connected by 107-isogenies
    that transport the ECDLP with the same k; measure the automorphism-discounted
    rho ratio, pre-registered at sqrt(3) = 1.732 and recorded as BASELINE
    CALIBRATION not an attack, and measure every other functional with the
    pre-registered prediction of exactly zero difference
  class: measurement

  object: >-
    OBJ-AUTSEP, the automorphism group |Aut(E)| as a variable that is normally
    perfectly confounded with the fundamental discriminant. Across isogeny
    classes, |Aut| = 6 occurs if and only if D_0 = -3, so the two can never be
    separated by any between-class design. Inside this one class they separate
    exactly: D_0 = -3 for every vertex, and |Aut| is 6 at one vertex and 2 at
    thirty-six. The tracked object is the DIFFERENCE OF A FUNCTIONAL ACROSS ONE
    ISOGENY STEP that changes |Aut| and nothing else.

  resource: >-
    R3 (End(E) as a ring, via the volcano level) and R4 (the isogeny graph),
    with R1/R2 supplying the measured functionals. H-ENDO-001 admissibility:
    the automorphisms act on the prime-order subgroup G as scalars - on a j = 0
    curve the available scalars are generated by 1 and lambda with
    lambda^2 + lambda + 1 = 0 mod N - so NOTHING here needs a non-scalar action,
    and the only benefit available is the classical automorphism quotient, a
    constant of at most sqrt(6) and never an exponent (KN-TECH-018). This record
    is designed to MEASURE that constant, not to exceed it.

  claim: >-
    (A) THE OBJECT EXISTS AND IS UNIQUE IN THIS PROGRAM. Write N = #E(F_p) and
    t for the trace, so p = N + t - 1 and D = t^2 - 4p = (t-2)^2 - 4N. FIXING N
    AND VARYING t therefore sweeps D freely at constant group order. At
    N = 19507 with t = 211 one gets p = 19717 and
    D = 211^2 - 4*19717 = 44521 - 78868 = -34347 = -3 * 107^2, so D_0 = -3 and
    the conductor is 107. The class is a depth-1 107-volcano with the maximal
    order Z[zeta_3] at the crater - a SINGLE vertex, j = 0, |Aut| = 6 - and
    h(-3 * 107^2) = 107 * (1 + 1/107) / 3 = 36 vertices at the floor with generic
    j and |Aut| = 2. [ALL OF THIS IS *[derived here]* IN
    analysis/endomorphism-isogeny-decomposition/MATCHED-ORDER-DESIGN.md BY A
    SCRIPT CALIBRATED AGAINST COMMITTED DATA; IT IS NOT A COMMITTED MEASUREMENT
    AND NOT AN EXPERIMENTAL RESULT. Every number above is a gate of the minimal
    test, to be re-derived before anything is measured.]
    (B) WHY IT IS UNIQUE. T4 fixes D, hence D_0, for a whole class, and |Aut| = 6
    requires D_0 = -3. So in every BETWEEN-class comparison, |Aut| and |D_0| move
    together and no design can attribute an effect to one rather than the other.
    Inside this class D_0 is pinned at -3 and |Aut| still varies, because j = 0
    sits alone at the crater. That is the separation, and I am aware of no other
    instance of it in this campaign's records.
    (C) TRANSPORT MAKES IT AN ECDLP STATEMENT AND NOT ONLY A GEOMETRY STATEMENT.
    N = 19507 is prime and gcd(107, N) = 1, so by T1 a 107-isogeny from the
    crater to a floor vertex is injective on G and carries (E, P, Q, k) to
    (E', phi(P), phi(Q), k) WITH THE SAME k. The two arms are therefore literally
    the same discrete-logarithm instance presented on two curves whose only
    structural difference is |Aut|, which is exactly the comparison
    RQ-JINV-8fc13a's decision target asks for.
    (D) THE PRE-REGISTERED PREDICTIONS, ALL OF THEM NUMERIC.
      D1 - rho step count. The crater arm, run with the automorphism quotient,
        costs 0.886*sqrt(N/6) group operations and the floor arm
        0.886*sqrt(N/2); the RATIO is sqrt(3) = 1.732. Predicted within +-20%,
        the same band H-ENDO-001 pre-registers for its own automorphism-quotient
        calibration. THIS IS BASELINE CALIBRATION AND IS RECORDED AS SUCH. A
        factor at or below sqrt(6) = 2.449 is never an attack
        (RQ-JINV-8fc13a decision_target, KN-TECH-018).
      D2 - rho step count WITHOUT the automorphism quotient. Ratio 1.000 within
        +-20%, because plain rho does not know about Aut. If the crater beats the
        floor on PLAIN rho, something is wrong with the instrument or with the
        instance generation, and that is a pre-registered invalidation.
      D3 - decomposition_rate_m2 and _m3, liftable_density,
        decomposition_efficiency. Ratio 1.000, i.e. ZERO difference beyond
        binomial noise, because these depend on N and the factor-base size and N
        is identical by construction. A measured difference is the one
        interesting event in the design and must be replicated before it is
        described.
      D4 - S_3 and S_4 monomial support. The crater has a = 0, so S_3 support is
        9 and S_4 support is 439 - 248 = 191; the floor vertices are generic, so
        13 and 439. THIS DIFFERENCE IS PREDICTED, IS EXACT, AND IS NOT A FINDING:
        it follows from j = 0 alone by the committed derivation, and it is
        included only as an instrument check that the crater vertex really is
        j = 0.
      D5 - the excess. Define the excess as the measured rho ratio divided by
        sqrt(3). Predicted 1.000. An excess above 1.2 sustained across seeds is
        either an instrument artifact or the single interesting event this lane
        could produce, and the record commits in advance to treating it as the
        former until independently replicated.

  mechanism: >-
    The automorphism group acts on the curve, and rho with the automorphism
    quotient walks on E/Aut, whose size is #E/|Aut|, giving the classical
    sqrt(|Aut|) discount. Nothing else in the algorithm sees Aut: the factor base
    is indexed by x-coordinates and already identifies P with -P, so the EXTRA
    structure at j = 0 is A/{+-1} of order 3 (derived in IDEA-20260807-f8a045),
    and the relation-collection consequence is at most linear in that order, not
    exponential. Meanwhile decomposition rates are functions of N and the factor
    base, both identical across the two arms by construction. So the mechanism
    predicts one non-trivial number (sqrt(3)) and zeros everywhere else, which is
    a sharp and easily falsified pattern.

  novelty_status: adaptation
  novelty_note: >-
    The automorphism discount is classical and committed (KN-TECH-018); the
    matched-order construction is *[derived here]* in the campaign's own design
    note MATCHED-ORDER-DESIGN.md, which is a design proposal and NOT an approved
    contract, mints no ledger IDs, and changes no hypothesis status. THE
    ADAPTATION is turning its section 3 observation into a pre-registered,
    numerically specific measurement in this lane. Corpus grep: no proposal
    record cites N = 19507 or t = 211; the design note is cited by no IDEA
    record. External literature NOT checked.
  not_a_duplicate_of: >-
    NOT H-ENDO-001 / EXP-ENDO-001, which calibrates rho against
    0.886*sqrt(N/|Aut|) on j = 0 and j = 1728 curves drawn from DIFFERENT primes
    and different classes - a between-class design in which |Aut| and |D_0| are
    perfectly confounded and p differs. The whole point here is the within-class
    contrast at identical p, N, t and D_0, which H-ENDO-001's test boundary does
    not contain. NOT IDEA-20260807-f8a045, which derives the index-calculus
    accounting for |Aut| and measures no rho. NOT IDEA-20260807-bfa86b, which
    plants a key-side signal.

  assumptions:
  - >-
    Every arithmetic fact in (A) is *[derived here]* in a design note and must be
    RE-DERIVED as gate 1: that 19507 is prime, that 19717 is prime, that
    D = -3 * 107^2, that the class has exactly one j = 0 vertex and 36 floor
    vertices, and that gcd(107, 19507) = 1.
  - >-
    THE VERTEX COUNT FOR D_0 = -3 MUST COME FROM THE HURWITZ-KRONECKER
    ENUMERATION, NOT FROM THE CLASS NUMBER. The Deuring correspondence weights
    j = 0 by 1/3 and j = 1728 by 1/2, so a class-number count and a vertex count
    differ exactly at the curves this design cares about
    (MATCHED-ORDER-DESIGN.md section 3 caveat; the campaign already enumerates
    against the mass formula, EV-ICINV-6b6264). Getting this wrong silently
    changes the denominator of every per-vertex statistic.
  - >-
    THE VOLCANO IS BUILT BY VELU. The committed "volcano level" computed as a
    2-torsion count resolved 2 of 5 levels and is wrong (red_team_notes.md
    section 10); a level variable computed that way is not admissible here.
  - >-
    TARGETS ARE SAMPLED WITH targets_B (harness/exp_icinv_fullgroup.py), NOT
    targets_uniform, which samples only the cyclic subgroup <G> and is disputed
    by H-ICINV-6c7920 (status `specified`, neither presumed true nor false).

  proof_search_map:
    bottleneck: >-
      The bottleneck is confounding: every |Aut| measurement in this program to
      date changes D_0, p, or N at the same time, so no measured difference can
      be attributed. This design removes all three confounds simultaneously and
      is the only known way to do so.
    baseline_embedding:
      parameter_slice: >-
        The floor arm alone, with plain rho and no automorphism quotient, is the
        exact baseline slice and must reproduce 0.886*sqrt(N) group operations
        within the pre-registered band - the classical birthday constant used as
        a KNOWN-ANSWER CALIBRATION, which this campaign has never measured
        (H-ENDO-001 predictions, basis note).
      reproduction_check: >-
        A frozen fixture: plain rho on the floor arm across at least 50 seeds,
        with the mean step count divided by sqrt(N) reported and required to lie
        in [0.71, 1.06] (0.886 +- 20%). Failure blocks all interpretation.
    observation_collision:
      observable: rho step count, decomposition rate, and the support values.
      distinct_preimage_search: >-
        PERFORMED AND POSITIVE FOR THE SUPPORT OBSERVABLE ONLY: support is
        J-measurable (IDEA-20260811-bbcd68), so the crater's 9 and 191 are
        determined by j = 0 alone and collide with every j = 0 curve anywhere.
        That is why D4 is declared an instrument check and NOT a finding. The rho
        and decomposition observables are not J-measurable and do not collide
        this way, which is what makes them the real measurements.
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: >-
        A design in which the nuisance variables are made IDENTICAL by
        construction rather than modelled: N, p, t and D_0 are equal across arms
        by the matched-order identity D = (t-2)^2 - 4N, so no covariate
        adjustment, no matching and no permutation null is needed for them.
      predicted_gain: >-
        Removes the exact confound (#E) that voided the campaign's earlier
        between-class results and that NULL-C is maximally sensitive to
        (power 1.00 at a 0.9% shift), by making it vanish identically.
    quantifier_order: >-
      FOR THIS ONE CLASS, and FOR ALL seeds, the automorphism-discounted rho cost
      ratio between the single crater vertex and the floor vertices is sqrt(3)
      within band. The universal is over SEEDS, not over curves, because the
      crater has exactly one vertex - and that is the design's binding limitation,
      stated in the quantifier rather than buried in a caveat.
    method_ceiling:
      strongest_certifiable_claim: >-
        That at this one class, at this N, the automorphism discount is or is not
        the whole of the |Aut| effect, at the stated detectable effect size. It
        CANNOT certify anything about |Aut| in general from one crater curve, and
        the record requires a second matched-order family before any general
        statement.
      nearby_object_control: >-
        The nearby object where the desired conclusion fails is a floor vertex
        with a randomly permuted label: run the identical pipeline treating a
        floor vertex AS IF it were the crater and confirm the measured ratio is
        1.000. A pipeline that reports sqrt(3) for a sham crater is measuring its
        own configuration, not the curve.
    proof_obligations:
    - claim: The class has exactly one j = 0 vertex and 36 floor vertices
      responsibility: baseline
    - claim: Plain rho reproduces 0.886*sqrt(N) on the floor arm
      responsibility: baseline
    - claim: The discounted ratio is sqrt(3) within band
      responsibility: correctness
    - claim: Decomposition rates are identical across arms
      responsibility: correctness
    - claim: Transport preserves k across the 107-isogeny
      responsibility: correctness

  predictions:
  - metric: discounted_rho_step_ratio_floor_over_crater
    direction: higher
    minimum_effect: >-
      sqrt(3) = 1.732 within +-20%, i.e. in [1.386, 2.078]. Recorded as BASELINE
      CALIBRATION. Below sqrt(6) = 2.449 it is never an attack, by the lane's own
      decision target.
  - metric: plain_rho_step_ratio_floor_over_crater
    direction: different
    minimum_effect: >-
      1.000 within +-20%. A crater advantage on PLAIN rho is a pre-registered
      invalidation, not a discovery.
  - metric: decomposition_rate_m3_difference_crater_minus_floor
    direction: different
    minimum_effect: >-
      ZERO within the binomial band at the declared sample size, at each of at
      least three factor-base densities bracketing 1/m! ~ 0.167. The committed
      over-dispersion decays from 2.04 to 0.93 as density falls, so the saturated
      row must not be run alone.
  - metric: liftable_density_difference
    direction: different
    minimum_effect: ZERO within the binomial band.
  - metric: s3_support_at_crater
    direction: lower
    minimum_effect: >-
      EXACTLY 9 at the crater and EXACTLY 13 at every floor vertex - an
      instrument check confirming the crater is j = 0, explicitly NOT a finding.
  - metric: transport_k_preservation
    direction: different
    minimum_effect: >-
      100% of transported instances recover the SAME k on both arms, verified by
      an independent certificate re-checked outside the solver
      (docs/claims-and-verification.md). A single mismatch invalidates the
      transport arm.
  - metric: excess_over_sqrt3
    direction: different
    minimum_effect: >-
      1.000 within band. An excess above 1.2 sustained across at least 100 seeds
      is escalated to independent review before any description, per the
      campaign's own rule that a claimed excess over the automorphism quotient
      must be explained before any other number is trusted.

  minimal_test:
    design: >-
      (0) Re-derive every arithmetic fact in (A) independently, including
      primality of 19507 and 19717 and the Hurwitz-weighted vertex count. (1)
      Build the class by VELU from the crater, recording the full 107-volcano and
      confirming 1 + 36 vertices and the |Aut| multiset {6: 1, 2: 36}. (2)
      Generate matched ECDLP instances: draw k uniformly, form (P, Q) on the
      crater, transport by a 107-isogeny to each of several floor vertices, and
      verify k is preserved with an independently re-checked certificate. (3) Run
      plain rho and automorphism-discounted rho on both arms across at least 100
      seeds, reporting the FULL step-count DISTRIBUTION per arm, never a point
      estimate (committed failure mode N5). (4) Run the decomposition-rate suite
      with targets_B at three factor-base densities, stratified on
      r = #{x : x^3 + a x + b = 0}. (5) Compute S_3 and S_4 support on all 37
      vertices as an instrument check. (6) Run the controls. (7) REPLICATE the
      whole design at a second matched-order family with a j = 0 class before any
      general statement about |Aut|.
    controls:
    - >-
      C-PLAIN-RHO (BLOCKING). Plain rho on the floor arm must reproduce
      0.886*sqrt(N) within band, and the plain-rho ratio between arms must be
      1.000. This is the known-answer calibration and it blocks interpretation.
    - >-
      C-SHAM-CRATER. Run the pipeline with a floor vertex mislabelled as the
      crater; the measured ratio must be 1.000. Detects configuration-driven
      differences.
    - >-
      C-VELU (BLOCKING). The volcano is built by Velu isogenies and the level
      variable is NOT derived from a 2-torsion count. The committed 2-torsion
      level resolved 2 of 5 levels.
    - >-
      C-TARGETS. targets_B, not targets_uniform, with the r-stratification
      reported. Reusing targets_uniform measures two different estimands on the
      two halves of every class.
    - >-
      NULL-C IS DISQUALIFIED AND MUST NOT BE USED. By its own committed
      characterisation it is a between-class mean detector with power 1.00 at a
      0.9% shift and says nothing about within-class structure; this design is
      entirely within-class. The contract must state the replacement null it uses
      - a paired within-class permutation of the crater label across seeds - and
      characterise its power BEFORE the main run.
    - >-
      C-SIGN. The four committed p = 4001 classes carry an ordered class-mean
      gradient, so an additive planted shift is constructive or destructive BY
      SIGN and a construction's measured power is not portable across sign. This
      design plants no between-class shift, but its within-class null must be
      power-characterised in BOTH directions and the contract must report both.
    required_metrics:
    - volcano_vertex_count_and_aut_multiset
    - plain_and_discounted_rho_step_distributions_per_arm_per_seed
    - rho_ratio_and_excess_over_sqrt3
    - decomposition_rate_m2_m3_per_arm_per_density_per_r_stratum
    - liftable_density_per_arm
    - s3_s4_support_per_vertex
    - transport_certificate_verification_rate
    - sham_crater_ratio
    - within_class_null_power_curve_both_signs

  lossy_projection_answer: >-
    The projection here is curve -> |Aut(E)|, an integer in {2, 4, 6}. It is
    maximally lossy and it is compatible with the operation rho performs, because
    rho's equality test descends to the quotient E/Aut exactly - which is
    precisely why the automorphism discount is real and why it is only sqrt(|Aut|).
    IT IS NOT COMPATIBLE WITH THE GROUP LAW, and that is the committed closure of
    IDEA-20260807-f00729: the orbit of P + Q is not determined by the orbits of P
    and Q, so the projection dies at the first addition and cannot propagate. So
    this record does NOT expect an effect beyond the equality-test discount, and
    it says so in its predictions rather than hoping. The lane's j = 0 support
    anomaly is a DIFFERENT projection (support -> cost) and is deliberately
    reduced here to an instrument check (D4), so this record does not inherit its
    failure.

  t5_reachability_answer: >-
    CLAUSE (ii) PASSES DECISIVELY AND CLAUSE (i) IS IRRELEVANT HERE. The crater is
    LOCALLY DETECTABLE - a vertex is on the crater iff it has more than one
    rational 107-isogeny, testable at each step of a walk - and the crater is 1 of
    37, so a random walk on this class hits it in expected O(37) steps, which is
    cheap. THIS IS THE ONE PLACE IN THE CAMPAIGN WHERE BOTH T5 CLAUSES ARE
    SATISFIED. And the payoff is exactly sqrt(3), a constant below sqrt(6), i.e.
    baseline calibration. That combination - a fully passing reachability gate
    delivering only a calibration constant - is itself the record's most citable
    outcome, because it demonstrates that T5 is not the binding constraint on
    this lane; the size of the available gain is.

  null_object: >-
    C-SHAM-CRATER (a floor vertex mislabelled) is the null of the same shape for
    the ratio; a paired within-class permutation of the crater label across seeds
    is the null for the sampled functionals, replacing the disqualified NULL-C,
    and it must be power-characterised in both signs BEFORE the main run.

  falsification_conditions:
  - >-
    Plain rho on the floor arm does not reproduce 0.886*sqrt(N) within +-20%. The
    instrument is uncalibrated; the run is INVALID rather than negative.
  - >-
    The plain-rho ratio between arms is not 1.000 within band. Instance
    generation or transport differs between arms and no comparison is admissible.
  - >-
    The discounted ratio falls outside [1.386, 2.078]. The automorphism discount
    does not behave as the classical formula predicts on this object, which is
    either an implementation defect or a genuine anomaly and must be resolved
    before anything else in the run is read.
  - >-
    Any decomposition-rate difference exceeds the binomial band at any density.
    A functional that should be N-determined is not; replicate at the second
    family before describing it.
  - >-
    C-SHAM-CRATER shows a non-unit ratio. The pipeline is measuring configuration
    and every result is void.
  - >-
    Transport fails to preserve k on any instance. The T1 arm is invalid.
  - >-
    The volcano does not have exactly 1 + 36 vertices with |Aut| multiset
    {6: 1, 2: 36}. The design note's derivation is wrong and the whole object
    must be re-selected before any measurement.

  confounders:
  - >-
    n = 1 AT THE CRATER, WHICH IS THE DESIGN'S BINDING LIMITATION. There is
    exactly one crater curve, so every idiosyncrasy of that particular curve is
    perfectly confounded with |Aut| = 6. Seed replication increases power against
    seed noise and does NOTHING against this confound. THE ONLY MITIGATION IS
    REPLICATION AT A SECOND MATCHED-ORDER FAMILY, which the contract requires
    before any general statement, and the record refuses to describe a single-
    family result as a fact about |Aut|.
  - >-
    j = 0 brings BOTH |Aut| = 6 and a = 0 (hence the support degeneration and the
    GLV endomorphism) at once. Within this class those three are perfectly
    confounded with each other - they are all consequences of j = 0 - so the
    design separates |Aut| from |D_0| and from N, but NOT from a = 0. That is
    stated as a limit rather than hidden, and it means a measured effect is
    attributable to "being the j = 0 vertex", not specifically to |Aut|.
  - >-
    Host oversubscription. Any timing-based metric is subject to the recorded
    load problem (DEC-20260810-d70ece NA6); step COUNTS are immune and are
    therefore the primary metrics, with wall-clock reported as secondary only.
  - >-
    Transport cost. The 107-isogeny costs something; the comparison is of solve
    cost per instance and the contract must state whether transport is charged.
    T2 says difficulty is constant across a class UP TO TRANSPORT COST, and
    omitting that cost would overstate the crater's advantage.

  interpretation_limits:
  - >-
    sqrt(3) IS BASELINE CALIBRATION, NOT AN ATTACK, and the record commits to
    that description in advance. The lane's decision target puts the threshold at
    sqrt(6).
  - >-
    One class, one crater curve, one N, toy scale. claim_tier toy.
    sota_delta zero.
  - >-
    A confirmed null on the non-rho functionals closes the tested functionals at
    the tested detectable effect only; the minimum detectable effect must be
    reported or the null is not citable.

  heuristic_assumptions:
  - id: H1
    statement: >-
      Pollard rho with distinguished points on a group of order N costs
      0.886*sqrt(N) group operations in expectation, and 0.886*sqrt(N/|Aut|) on
      the automorphism quotient.
    rigorous_support: >-
      0.886 = sqrt(pi/4) is the classical birthday constant from the published rho
      literature (KN-TECH-001, KN-TECH-006; the discounted variant KN-TECH-018).
      THIS CAMPAIGN HAS NEVER MEASURED IT - H-ENDO-001 records the same fact -
      so it is used here as a KNOWN-ANSWER CALIBRATION and its verification is
      the blocking control C-PLAIN-RHO.
    validation_plan: >-
      Sample: at least 100 seeds per arm at N = 19507, and at a second family for
      replication. Comparison distribution: the step count divided by sqrt(N)
      against 0.886, and the full step-count distribution against the geometric/
      birthday shape, reported as an empirical CDF rather than a mean. Tail check:
      the 95th and 99th percentiles of step count against the birthday
      distribution's own tail, since a mean can match while the tail exposes a
      broken walk. Transfer to cryptographic N is NOT claimed.
  - id: H2
    statement: >-
      Decomposition rates for a fixed factor-base density depend only on N and
      the density, not on the curve.
    rigorous_support: >-
      Not a theorem in this campaign; it is the pre-registered expectation of
      DECOMPOSITION.md section 5 item 1 ("zero variance in relation yield, which
      depends on N and factor-base size only"), and it is exactly what this
      design tests at identical N.
    validation_plan: >-
      Sample: at least 10^4 targets per arm per density, drawn with targets_B,
      stratified on r. Comparison: binomial with the pooled rate; report the
      dispersion ratio, which the campaign has already seen decay from 2.04 to
      0.93 with falling density and which must therefore be reported ACROSS the
      density sweep and never at the saturated row alone. Tail check: the most
      extreme per-vertex rate among the 36 floor vertices against the binomial
      extreme-value prediction.

  target_complexity:
    time_exponent: >-
      NONE CLAIMED. The predicted crater advantage is a constant factor sqrt(3),
      which is baseline calibration, not an exponent.
    memory_exponent: >-
      NONE CLAIMED. rho with distinguished points is O(1) memory on both arms.
    best_known: >-
      0.886*sqrt(N) group operations and O(1) memory (KN-TECH-001, KN-TECH-006),
      and 0.886*sqrt(N/|Aut|) on CM curves with extra automorphisms
      (KN-TECH-018). THE CRATER ARM IS EXPECTED TO REPRODUCE THE SECOND EXACTLY,
      i.e. to match the best known, not to beat it.
    hidden_overhead: >-
      Nothing hides in an o(1) because there is no asymptotic claim; the honest
      overheads are the fruitless-cycle handling that the automorphism quotient
      requires and the 107-isogeny transport cost, both of which are charged.
    tradeoff_note: >-
      Both arms are at the O(1)-memory endpoint of the van Oorschot-Wiener
      tradeoff and parallelise linearly in the number of processors with
      distinguished points. The design changes neither the tradeoff nor the
      parallelisation, and a sqrt(3) constant does not move either.

  dominated_by: >-
    The crater arm is dominated by - because it IS - the automorphism-discounted
    parallel rho of KN-TECH-018; the floor arm by plain parallel rho with
    distinguished points (KN-TECH-001, KN-TECH-006). Checked against every row of
    the frontier: BSGS is worse on memory, kangaroo applies to interval DLP,
    index calculus over prime fields is not competitive at these sizes. Nothing
    here is better than a known row on any axis.
  sota_delta: >-
    ZERO. The design's success condition is reproducing a known constant, not
    beating it.

  estimated_cost:
    implementation: high
    compute: medium
  compute_note: >-
    Implementation is the expensive part: a Velu volcano builder, a transport
    routine with certificate verification, an automorphism-quotient rho with
    fruitless-cycle handling, and a within-class null with a characterised power
    curve. N = 19507 is tiny, so the compute is modest and the wall-clock risk is
    the host-load gate rather than the arithmetic.

