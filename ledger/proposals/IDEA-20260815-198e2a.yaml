idea:
  id: IDEA-20260815-198e2a
  question_id: RQ-TORS-8c7b79
  added: '2026-08-15'
  title: >-
    TORSION-DERIVED STATISTICS ARE THE MOST-PROPOSED ECDLP OBSERVABLES IN
    THIS CORPUS AND THEIR JOINT BEHAVIOUR IS UNMEASURED: test whether the
    division-polynomial ladder statistics are mutually independent before
    any is used again
  class: measurement

  claim: >-
    Several records propose statistics built from division polynomials at
    various small primes. Each is measured alone against its own null. If
    they are strongly dependent, the corpus's several independent negative
    results are really one negative result repeated, and the apparent
    breadth of the screening is illusory.

  mechanism: >-
    Compute the declared division-polynomial statistics jointly on one point
    sample. Measure pairwise and joint dependence. Report the effective
    number of independent statistics against the nominal count.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Read of IDEA-20260807-df906f's psi_ell ladder and related torsion
      records; grep 'division polynomial' (40), 'joint', 'mutual
      independence'.
    results: >-
      Several torsion statistics are proposed and measured individually;
      no record measures their joint dependence or the effective
      independent count.
    verdict: >-
      UNVERIFIED. Testing statistics for mutual dependence is elementary;
      that the corpus has accumulated several without doing so is what
      makes this worth running.

  object_first_candidate:
    tracked_object: >-
      THE JOINT DISTRIBUTION of the declared torsion statistics, rather
      than each marginal alone.
    lossiness: >-
      Measuring statistics one at a time projects away their dependence,
      which is exactly what determines whether several negatives are
      several results or one.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives wherever the statistics are computable on a shared point
      sample, which they are by construction since all are evaluated at a
      point's x-coordinate.

  null_object_control: >-
    NULL 1 -- statistics computed on random field elements rather than curve
    points, giving the dependence expected from the algebraic definitions
    alone with no curve structure. NULL 2 -- a deliberately duplicated
    statistic pair, which must show maximal dependence, confirming the
    measure can detect it.

  discriminated_from:
    - >-
        IDEA-20260807-df906f, which declares the psi_ell truncation ladder
        and measures it as an object; this measures whether its rungs are
        independent.
    - >-
        The propagation-ceiling record in this series, which bounds any
        single statistic's advantage; this asks how many distinct
        statistics there actually are.

  assumptions:
    - >-
        The declared statistics are computable on a shared sample, which
        follows from their definitions.
    - >-
        Dependence measured on toy curves reflects dependence at larger
        sizes, which is not obvious since the statistics' ranges are small
        and fixed while the point sample grows.

  predictions:
    - metric: >-
        duplicated-pair null
      direction: different
      minimum_effect: >-
        FORCED maximal dependence; a measure that misses it detects
        nothing.
    - metric: >-
        random-field-element null
      direction: different
      minimum_effect: >-
        Gives the dependence from algebraic definition alone, which any
        curve-point dependence must exceed.
    - metric: >-
        effective independent count against nominal
      direction: lower
      minimum_effect: >-
        The deliverable; an effective count well below the nominal one
        means the corpus's torsion screening is narrower than it
        appears.

  minimal_test:
    design: >-
      One curve, all declared statistics, several thousand points, both
      nulls.
    controls:
      - >-
          Duplicated-pair detection null.
      - >-
          Random-field-element baseline.
      - >-
          Shared point sample across all statistics, so dependence is
          not a sampling artifact.
    required_metrics:
      - >-
          Pairwise and joint dependence measures.
      - >-
          Effective independent count against nominal.
      - >-
          Both null outcomes.
      - >-
          Artifact manifest with hashes and rebuild receipt.

  falsification_conditions:
    - >-
        The duplicated-pair null shows low dependence. The measure is
        broken.
    - >-
        Effective count matches nominal. The statistics are genuinely
        distinct and the corpus's screening breadth is real.
    - >-
        Effective count is far below nominal. Several recorded negatives
        are one negative repeated, and the corpus's coverage claims must
        be adjusted.
    - >-
        Curve-point dependence matches the random-field-element null. The
        dependence is definitional rather than curve-derived, which is a
        different and milder finding.

  confounders:
    - >-
        DEFINITIONAL DEPENDENCE: division polynomials at different primes
        share algebraic structure by construction, so some dependence is
        expected and the random-field-element null is what separates that
        from curve-derived dependence.
    - >-
        SMALL RANGES: several statistics take very few values, which
        inflates apparent dependence measures at small sample sizes.

  interpretation_limits:
    - >-
        Measures relationships among observables; establishes nothing
        about the ECDLP.
    - >-
        Scoped to the declared statistics and the tested curve.
    - >-
        A low effective count adjusts how the corpus's coverage is
        described; it does not invalidate any individual negative.

  heuristic_assumptions:
    - id: HEUR-TORS-IND-1
      statement: >-
        The declared division-polynomial statistics at distinct primes
        are mutually independent on curve points.
      rigorous_support: >-
        Rigorous ingredient: the division polynomials at distinct primes
        have coprime degrees and their root sets are disjoint torsion
        subgroups, which suggests independence. THE GAP: they are all
        polynomial functions of the SAME x-coordinate, so they are
        deterministic functions of one variable and cannot be
        independent in any strict sense -- the real question is whether
        their dependence is strong enough to collapse the effective
        count.
      falsification_condition: >-
        An effective independent count materially below the nominal one,
        beyond the definitional baseline.
      validation_plan: >-
        SAMPLE: >= 5000 points x all declared statistics. COMPARISON:
        effective count against nominal and against the random-field-
        element baseline. TAIL CHECK: the most dependent pair, reported
        with their prime pair. TRANSFER: none beyond the tested curve.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is evaluating each statistic at each sampled
      point.
    memory_exponent: >-
      Negligible.
    best_known: >-
      No incumbent joint measurement exists; the statistics are proposed
      and measured individually across several records.
    hidden_overhead: >-
      All statistics are functions of one x-coordinate, so strict
      independence is impossible and only the degree of dependence is
      measurable.
    tradeoff_note: >-
      Measuring jointly costs almost nothing beyond measuring individually
      and determines whether the corpus's several screens are several
      screens.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As cryptanalysis: nothing. As a joint
    dependence measurement: none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: pairwise and joint dependence
    for the corpus's declared torsion statistics, an effective independent
    count against the nominal one, and a definitional baseline separating
    shared algebraic structure from curve-derived dependence.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.95 that the measurement runs. 0.9 that the duplicated-pair null
    behaves. 0.55 that the effective count falls materially below nominal,
    which would mean the corpus's torsion screening is narrower than its
    record count suggests.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
