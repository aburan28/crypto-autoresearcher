      - ref: KN-TECH-055
        provenance: internal
        relation: adjacent
        delta: >-
          The exemplar prices the meet-in-the-middle by |L|. This
          idea asks whether keying by j makes the stored table
          smaller than |L| by a ratio 9/10 at one toy parameter. It
          does not replace the algorithm.
    searched:
      corpus_grep:
        - L(E, X, B)
        - keyed by the codomain
      web: []
      blocked: []
  dominated_by: >-
    Dominated as an algorithm by the archived Theorem 1.1 at
    p^{1/3+o(1)} time and memory. Compared with KR-RHO-13bf67
    (generic exponent 1/2, different problem), KR-RHO-755e35
    (isogenous curves are not weaker), and KR-RHO-ea34b8
    (preprocessing tradeoff). No row is a measured J/|L| for this
    list at p = 47.
  sota_delta: >-
    Zero change to the 1/3 exponent. The numerical output is a ratio
    of two integers against 9/10 on one curve at one prime.
  proof_search_map:
    not_applicable_reason: >-
      This is a finite count on one curve. It does not propose a
      theorem, a new bound, a certificate family, a reduction, or a
      closure.
