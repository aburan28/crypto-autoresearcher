idea:
  id: IDEA-20261006-065073
  question_id: RQ-SSIQ-9702af
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    Distinct codomains inside one smooth-isogeny list are at most 9/10
    of the kernel count
  class: measurement
  claim: >-
    Let p = 47. Let E be the lexicographically first short-Weierstrass
    model over F_p whose j-invariant is supersingular and outside
    {0, 1728}. Let B = 3 and X = 9. Let L be the set of separable
    isogenies with cyclic kernel and degree in the 3-smooth integers
    at most 9, from E to any codomain, up to post-composition by an
    isomorphism. Let J be the number of distinct codomain
    j-invariants of those isogenies. The claim is J / |L| ≤ 9/10,
    written exactly as 10*J ≤ 9*|L|. A finished ratio strictly above
    9/10 is the concrete negative. This list is one side of
    Algorithm 2 before the claw. It is not the multiset of minimal
    degrees E -> E^{(p)}, and it is not the 5-smooth fraction of
    those degrees. The exponent stays p^{1/3+o(1)} under Heuristic 1.
    This record does not say that a p^{1/4} algorithm exists.
  mechanism: >-
    The tracked object is a pair of integers, |L| and J, for the set
    L(E, X, B) in Definition 3.1 of the archived paper. Algorithm 2
    keys that list by codomain. Two cyclic kernels with the same
    codomain j collapse to one key, so the keyed table can be smaller
    than the isogeny count Lemma 3.2 bounds. The representation is
    the codomain j. The operation set is {compose on the left by an
    isomorphism}. That operation does not change j, and many kernels
    can share a j, so the projection from kernel to j is lossy. The
    priced number is the ratio J/|L|. No walk from a public curve to
    a secret curve is run, and nothing is priced as a path algorithm.
  novelty_status: unverified
  citations:
    - ref: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
      provenance: retrieved
      claim: >-
        Definition 3.1 and Lemma 3.2 count cyclic isogenies of
        B-smooth degree at most X. Algorithm 2 step 3 keys that list
        by codomain. This idea measures the collapse under that key
        at one toy curve. It does not rerun Section 4.
      verified_by: >-
        design session opened
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, including lines
        131-170, on 2026-10-06
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        An isogeny does not reach a curve of a different group order.
        This idea reports a ratio of integers and no group-order change.
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
        on 2026-10-06
    - ref: KN-TECH-055
      provenance: internal
      claim: >-
        The exemplar prices a meet-in-the-middle by the size of the
        list. A codomain collision changes that size only if the
        implementation keys by j. This idea does not change the
        exponent.
      verified_by: >-
        design session opened knowledge/techniques/KN-TECH-055.md
        on 2026-10-06
  assumptions:
    - >-
      p = 47 is rechecked by trial division. 7^2 = 49, so every prime
      factor of a composite below 49 is at most 5. If 47 is not prime,
      the instance is undefined and the claim is not scored.
    - >-
      Supersingularity is a trace-zero or Hasse-invariant test on the
      model. j = 0 and j = 1728 are skipped while choosing the model.
    - >-
      Degree 1, the identity, is one element of L and contributes one
      codomain. Cyclic kernel means the kernel is a cyclic group.
  predictions:
    - metric: the ratio of distinct codomain j-invariants to |L|
      direction: lower
      minimum_effect: at most 9/10, exactly 10*J ≤ 9*|L|
  minimal_test:
    design: >-
      Confirm 47 is prime. Enumerate lex-smallest short-Weierstrass
      models over F_47 until one is nonsingular, supersingular, and
      has j outside {0, 1728}. For each 3-smooth degree d in
      {1, 2, 3, 4, 6, 8, 9}, list cyclic kernels of degree d and their
      codomain j-invariants, using modular polynomials and a cyclic
      kernel test. Count |L| and J. Compare 10*J with 9*|L| in
      integers. If no eligible model exists, do not score the claim.
    controls:
      - >-
        The identity is present, so |L| ≥ 1. A count of 0 is an
        instrument failure and is not a ratio above 9/10.
      - >-
        For the prime degree 2, the number of cyclic kernels is 3,
        matching the archived count ell+1. Any other count at degree
        2 invalidates the enumerator.
      - >-
        The same degree-2 count on the ordinary curve y^2 = x^3 + x + 1
        over F_47, if that model is nonsingular and ordinary, is also
        3. A different count invalidates the enumerator. If that model
        is singular or supersingular, skip this control and say so.
    required_metrics:
      - cardinality of L
      - J
      - whether 10*J is at most 9 times the cardinality of L
      - the degree-2 kernel count
  falsification_conditions:
    - >-
      The finished ratio is strictly above 9/10, that is 10*J > 9*|L|,
      on an eligible model, with the degree-2 count equal to 3. That
      is the concrete negative.
    - No eligible supersingular model exists over F_47.
    - The degree-2 kernel count is not 3.
  confounders:
    - >-
      Counting two kernels that differ by post-composition with an
      isomorphism as two elements of L inflates |L| without a new j.
    - >-
      Dropping the identity makes a collision-free list of positive
      degree look smaller.
    - >-
      Identifying j with j^p before counting distinct codomains
      answers a different question. Codomains are compared as
      elements of F_{p^2}.
  interpretation_limits:
    - >-
      A ratio at or below 9/10 on one curve at p = 47 does not change
      the list-size exponent p^{1/3+o(1)}.
    - >-
      A ratio above 9/10 does not certify that Algorithm 2's keyed
      table has the same cardinality as L at cryptographic size.
    - >-
      This is not a measurement of minimal degrees to the conjugate
      and not a smoothness fraction.
  heuristic_assumptions:
    - id: H1
      statement: >-
        If codomain j-invariants of the kernels in L were independent
        uniform draws from a set much larger than |L|, collisions
        would be rare and the ratio would sit near 1. The threshold
        9/10 is a pre-registered gap from 1, not a birthday-paradox
        calculation, and not Heuristic 1.
      rigorous_support: >-
        Lemma 3.2 bounds |L| from above. It does not bound J/|L|.
        The archived line that there are ell+1 isogenies of prime
        degree ell is the degree-2 control, not a collision law.
      validation_plan: >-
        The quantity is J/|L| on this one model at p = 47, B = 3,
        X = 9. The comparison is the exact inequality 10*J ≤ 9*|L|.
        The tail check is the degree-2 count against 3. Transfer
        assumption: none.
  target_complexity:
    time_exponent: >-
      unchanged at p^{1/3+o(1)} under Heuristic 1, from the archived
      Theorem 1.1. This measurement states no new algorithm.
    memory_exponent: >-
      unchanged at p^{1/3+o(1)} for that algorithm. The toy list
      stores one j per kernel at p = 47.
    best_known: >-
      Archived Theorem 1.1. Generic discrete log stays exponent 1/2
      on a prime-order group (KR-RHO-13bf67) and is a different problem.
    hidden_overhead: >-
      The paper's o(1) in the list-size exponent absorbs log factors
      from Lemma 3.2. A ratio at p = 47 does not estimate that o(1).
    tradeoff_note: >-
      No time-memory tradeoff is proposed. Keying by codomain is a
      representation of the same list, not a van Oorschot-Wiener
      trade.
  estimated_cost:
    implementation: small
    compute: small
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
