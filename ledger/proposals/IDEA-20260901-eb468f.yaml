      k = ord_q(t/2) gating, the holder/attacker route symmetry, or the
      torsor-size monotonicity as a hiding-space statement.
    verdict: >-
      UNVERIFIED. Two primary ABSTRACTS were retrieved this session
      (provenance retrieved, verified_by this task, abstracts only) and they
      support (V1) as a quotation, but the argument of (V2) and (V3) leans on
      RECALLED sources -- Kohel and Fouquet-Morain for the volcano structure,
      Lenstra and the class-number formula for orders for the torsor sizes,
      the route costs for the Stage 1 table -- none of which was opened, and
      under templates/research-records.md a recalled citation supports
      nothing. The mathematics of (V2) and (V3) is classical and is claimed as
      an application, not as new; (V1) is an external published result
      pointed at a lane that has not read it. Until the recalled sources and
      the two PDFs are read the honest label for the record as a whole is
      UNVERIFIED, which is why Stage 0 is a hard gate.

