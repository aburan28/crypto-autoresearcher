      EV-ECDLP-b3e847 (ECDLP lane, grep lines only) quotes a reference note
      that the P-256 FLAT-volcano bridge is cheap by Galbraith 2024 at
      O(q^{1/4}); nothing applies the TALL-volcano statement to the ECTD
      vertical lane, whose every record (017, 801-004, H-ECTD-19017a,
