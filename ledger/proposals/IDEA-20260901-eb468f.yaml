    results: >-
      The corpus holds eprint 2024/924 as KN-LIT-1210 with 'No abstract was
      extractable ... contribution recorded from the title only', and
      IDEA-20260807-bb03d3 (GOAL-ENDO lane) names it as 'the most likely place
