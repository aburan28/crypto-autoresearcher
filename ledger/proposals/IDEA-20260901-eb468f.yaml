idea:
  id: IDEA-20260901-eb468f
  question_id: RQ-ECTD-001
  goal_id: GOAL-ECTD-001
  added: '2026-09-01'
  title: >-
    PRIORITY (2) RESTS ON A SUPERSEDED 1999 BOUND: Galbraith's 2024 paper
    (eprint 2024/924, corpus KN-LIT-1210 at TITLE LEVEL ONLY) computes the
    connecting isogeny between any two curves of a tall ordinary volcano with a
    small crater in RIGOROUS Otilde(p^{1/4}) and heuristically Otilde(p^{0.4})
    in the worst case -- both below matched rho -- so the large-conductor
    vertical barrier is not a path-hiding barrier at the exponent level; and no
    designer-side asymmetry can be recovered, because every route by which a
    holder can build a floor curve q-below a crater is a route by which the
    public ascends it, both being gated by the same public class invariants
    (the orientation K and k = ord_q(t/2)), while every ascent SHRINKS the
    designer's torsor by the conductor factor
  class: mechanism

  claim: >-
    Let E_pub/F_p be ordinary with trace t, D_pi = t^2 - 4p = f^2 D_K, and let
    q be a prime with q | f (a vertical q-step exists in the class). GOAL-ECTD-001
    priority family (2), IDEA-20260731-017, H-ECTD-19017a and H-ECTD-ac8627 all
    motivate the "large-conductor vertical barrier" from KN-LIT-7630 (Galbraith
    1999): computing the connecting isogeny across a large prime conductor step
    "may itself be hard", worst case Otilde(p^{1.5}). Four statements, of
    decreasing certainty, each separately falsifiable.

    (V1) THE PREMISE IS SUPERSEDED, BY A RETRIEVED ABSTRACT. Galbraith,
    "Climbing and descending tall isogeny volcanos" (eprint 2024/924, Research
    in Number Theory 11:7, 2025), abstract retrieved this session: applies the
    Kani construction to relate the ECDLP between ordinary curves with the same
    point count, improving the 1999 worst case from Otilde(q^{1.5}) to
    "heuristically Otilde(q^{0.4})" operations, and for random curves (flat
    volcanoes) and pairing-based crypto (tall volcanoes with crater of constant
    or polynomial size) "a rigorous Otilde(q^{1/4}) algorithm to compute an
    isogeny between any two curves in the isogeny class" (q the field size,
    i.e. p here). Matched rho costs 1.2533 sqrt(N) ~ p^{1/2}. HENCE, for the
    tall-volcano small-crater case -- which IS the vertical trapdoor shape
    (small |D_K|, large prime-power conductor) -- the public connects E_pub to
    ANY curve in the class, including the secret E_s, in p^{1/4 + o(1)}, a
    factor p^{1/4} below rho; and in the worst case (large crater) in
    p^{0.4 + o(1)} conditional on Galbraith's heuristic, a factor p^{0.1} below
    rho. The connecting-isogeny limb of a vertical trapdoor is therefore NOT
    rho-hard at the exponent level. Only the abstract was read; the theorem
    statements, their exact conditions and the content of "heuristically" are
    Stage 0 of the minimal test and are NOT asserted here.

    (V2) NO DESIGNER-SIDE ASYMMETRY EXISTS TO RESTORE THE BARRIER, BY A
    SYMMETRY ARGUMENT ON PUBLIC INVARIANTS. Every quantity that governs the
    cost of a vertical q-step is an isogeny-class invariant, hence public:
    the orientation K = Q(sqrt(D_K)) and D_K itself (from t), the conductor f
    and its prime q (from factoring D_pi, subexponential and far below rho),
    and k = ord_q(t/2 mod q), the multiplicative order of the double Frobenius
    eigenvalue lambda = t/2 on E[q]. On a FLOOR curve the Frobenius is a
    non-scalar Jordan block on E[q] with the single eigenvalue lambda, so
    there is EXACTLY ONE F_p-rational q-subgroup L, it is the ascending
    kernel, and its points are rational over F_{p^k} and over no smaller field;
    for k < q one has E(F_{p^k})[q] = L exactly. On a CRATER curve (q dividing
    [End : Z[pi]]) the Frobenius is the scalar lambda on E[q], all q+1
    subgroups are rational, and their points are again rational over exactly
    F_{p^k}. So the holder's DESCENT (pick any non-horizontal rational
    q-subgroup of the crater, apply Velu) and the public's ASCENT (take the
    unique rational q-subgroup of the floor, apply Velu) require the SAME
    objects -- a point of order q over F_{p^k}, or a rational factor of the
    q-division polynomial, or the evaluation of Phi_q -- and therefore cost the
    same up to a constant, at every k. At k = 2 the kernel points lie on the
    quadratic twist over F_p and BOTH parties pay polynomial time plus one
    Velu step; at large k both parties fall back to the same
    division-polynomial or modular-polynomial routes. The one asymmetry a
    Teske-style construction needs -- a SECRET orientation, which is exactly
    what makes ascent hard for the public in the oriented supersingular
    setting that eprint 2025/1243 addresses -- is impossible over F_p ordinary,
    because the orientation is determined by t. This is the named obstruction.

    (V3) THE VERTICAL STRUCTURE SHRINKS THE HIDING SPACE. For an order O of
    conductor f in O_K, h(O) = h(O_K) * f * prod_{ell | f} (1 - (D_K/ell)/ell)
    / [O_K^* : O^*] (RECALLED, classical). Ascending one q-step divides the
    torsor size by q - (D_K/q), i.e. by q-1, q or q+1. So the FLOOR level
    (End = Z[pi]) carries the largest Cl(O)-torsor, of size h(Z[pi]) =
    p^{1/2 + o(1)} for typical t, and every level above it is smaller by the
    conductor factor. Moreover the ascent from E_pub is UNIQUE at every
    non-crater vertex (one ascending edge, Kohel), so a public attacker reaches
    the crater vertex above E_pub without any search and then faces a torsor
    of size h(O_K) = h(Z[pi]) / (f-factor). A secret endpoint placed q-above
    E_pub is therefore hidden among FEWER curves than a horizontal endpoint
    would be, and the conductor contributes ZERO bits of hiding entropy to the
    designer -- it contributes negative bits. IDEA-20260805-4243e6 counted the
    hiding space as the whole H(4p - t^2) and flagged cross-level traversal as
    its weakest link (HEUR-ECTD-MASS-2); (V3) says the traversal is not only
    cheap in the direction the attacker needs, it is unique.

    (V4) WHAT SURVIVES, STATED SO IT CAN BE PURSUED. Nothing above bears on
    whether Semaev/Groebner meters SEE the endomorphism ring (H-ECTD-ac8627's
    measurement remains a legitimate mechanism question); it bears on whether
    a level-specific weakness could be HIDDEN behind the conductor, and the
    answer is no at the exponent level. The forward guidance is that the only
    hiding space is horizontal position within the floor torsor (h(Z[pi])
    curves), which is GOAL-ECTD-001 priority family (1) and the object of
    IDEA-20260901-80308d, filed alongside this record.

  mechanism: >-
    THE TRACKED OBJECT. The pair (k, level) of a curve in the class, where
    k = ord_q(t/2 mod q) is the field-of-definition degree of the q-torsion
    eigenline and level is the q-adic valuation of [End(E) : Z[pi]]. Followed
    through one vertical q-step: k is INVARIANT (it depends on t, q only),
    level moves by exactly one. The projection discards the curve equation,
    the j-invariant, the torsor position and the connecting chain; what it
    retains is exactly what governs the step cost for both parties, and it
    propagates deterministically under the operation (a q-isogeny) by
    construction. Lossy-projection test PASSED non-vacuously: from (k, level)
    one cannot recover the curve, and two curves at the same level are
    identified -- which is precisely why the projection is a COST meter and
    not an address, and why it cannot serve the designer.

    ESTABLISHED FAMILIES DECLARED OFF-LIMITS AS THE PRIMARY LENS. Semaev and
    Groebner meters (H-ECTD-001/19c623/ac8627 own them); class-mass counting
    (4243e6/3dbda5); entropy and coset accounting (5ee6b4); group-structure
    leakage (ceca08); correspondences (51996a); pairing-shaped DDH (ba4e37);
    descent (c64123). The lens here is the COST OF THE VERTICAL STEP ITSELF
    and its symmetry, which none of those records measures or argues.

    STAGE 0 (READING, ZERO COMPUTE, HARD GATE). Open downloads/2024-924.pdf
    (KN-LIT-1210's local copy) and downloads/2025-1243.pdf (KN-LIT-1400's) and
    record VERBATIM: (a) the theorem giving the rigorous Otilde(q^{1/4})
    algorithm and its exact crater-size condition; (b) the statement covered
    by "heuristically Otilde(q^{0.4})" and the heuristic it depends on; (c)
    whether the tall-volcano ascent needs q-torsion points over F_{p^k}
    (k-gated) or avoids them via self-pairings; (d) whether the 2025 paper's
    ascent for ORDINARY curves is polynomial once the orientation is known.
    If (a) does not cover the ordinary large-prime-conductor case, (V1) is
    downgraded to the heuristic exponent 0.4 and the record says so; if
    neither paper covers ordinary curves at all, (V1) is withdrawn and (V2),
    (V3) stand alone as the record's content. Also open KN-LIT-7630's local
    copy (galbraith-iso.pdf) and record the 1999 statement the lane has been
    citing, so the supersession is documented from both ends.

    STAGE 1 (ARITHMETIC, ZERO COMPUTE). Two tables. (i) The TORSOR-SIZE table:
    h(O_f)/h(O_K) for f in {q, q^2, q^3} at q in {17, 19, 23, 29, 31} and
    D_K in {-3, -4, -7, -8, -11}, by the formula in (V3), and separately by
    exact reduced-form counting at toy discriminants as the fixture. (ii) The
    COST table at cryptographic p: attacker = ascent cost from Stage 0 plus
    crater-torsor walk h(O_K) * c_test, versus rho 1.2533 sqrt(p), versus the
    holder's construction cost by the matched route, for q = p^c at
    c in {1/8, 1/4, 3/8, 1/2}, with every recalled exponent labelled.

    STAGE 2 (TOY, HOURS) -- THE k-SYMMETRY MEASUREMENT. For each
    (q, D_K) cell above, choose t with t^2 - 4p = q^2 * D_K, p prime of
    30-40 bits, and t chosen to realise k = ord_q(t/2) in each of four bands:
    k = 1 (negative control, see below), k = 2 (positive control), k small
    (3 to 12), k large (> 12). Build the crater curve by CM (tiny D_K gives a
    known j: 0, 1728, -3375, 8000, -32768) on the twist with trace t. DESCEND
    by two declared routes: (R-ext) a q-torsion point over F_{p^k}, selected
    to avoid the horizontal subgroups, then Velu; (R-div) the q-division
    polynomial over F_p factored into its (q-1)/2-degree kernel factors, one
    non-horizontal factor chosen, then Velu from the kernel polynomial. From
    each floor curve so obtained, ASCEND by the matched routes: (R-ext) the
    unique eigenline over F_{p^k} (at k = 2, on the twist over F_p) then Velu;
    (R-div) the unique F_p-rational kernel factor of the q-division
    polynomial, then Velu. Record F_p-operation counts per route per party.
    R-ext is run only where k <= 12 (extension arithmetic in pure Python);
    R-div only where q <= 31; cells outside both are reported UNMEASURED.

    STAGE 3 (TOY, CONDITIONAL). Only if Stage 0 finds the 2024/924 or
    2025/1243 ascent implementable with the harness's field arithmetic at
    q <= 31: implement it, verify it returns the same ascending kernel as
    R-ext/R-div, and report its operation count beside them. Otherwise this
    stage is reported as NOT ATTEMPTED and (V1) rests on the retrieved
    abstract plus Stage 0's verbatim theorem statements.

