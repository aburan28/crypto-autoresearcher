  assumptions:
    - >-
      q is an odd prime dividing the conductor f, so that a vertical q-step
      exists; q coprime to N so the DLP transports. q = 2 needs the usual
      2-adic corrections and is excluded from Stage 2.
    - >-
      Only F_p-rational isogenies are available to either party (a non-rational
      isogeny does not transport the F_p-DLP). This is a property of the object.
    - >-
      Cost is counted in F_p operations for Stage 2 and in group-operation
      equivalents for Stage 1's table; the conversion is stated per cell.
    - >-
      Toy scale for every measured number (p of 30-40 bits, q <= 31, k <= 12
      on the extension route). No number here is validated at cryptographic
      scale and the record licenses no extrapolation beyond the two retrieved
      abstracts, which are cited for what they say and not more.

  proof_search_map:
    bottleneck: >-
      The cost of the vertical connecting isogeny between E_pub and a curve
      q-above or q-below it. Every vertical-trapdoor statement in the lane is
      a function of that one cost; if it is p^{1/4} to p^{0.4} the lane's
      path-hiding limb is below rho and no meter measurement can restore it.
    baseline_embedding:
      parameter_slice: >-
        The HORIZONTAL slice: a horizontal ell-step at the crater with ell
        split in O_K, where the kernel is an F_p-rational Frobenius eigenline
        with a distinct eigenvalue and both parties compute it identically in
        polynomial time. The symmetry claim (V2) must reproduce ratio 1 there
        before it is read anywhere else. Second slice: k = 2, where the
        kernel points lie on the quadratic twist over F_p, reproducing the
        classical fact that a floor curve's twist carries the q-torsion of its
        ascending kernel.
      reproduction_check: >-
        Frozen fixture: at one (q, D_K, p) cell with k = 2, the ascent
        computed via the twist must return a curve whose j-invariant equals
        the crater's j (0, 1728, or the CM value) and whose End-level, checked
        by counting rational q-neighbours, is the crater. Exact equality, not
        a plot.
    observation_collision:
      observable: >-
        The pair (k, level) together with the per-route operation count.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, and the collision is the point: two
        designs with identical (p, t, q, k) -- one with E_s at the crater and
        E_pub at the floor, one with the roles reversed -- have identical
        step costs and identical public ascent costs. The observable does not
        distinguish designer from attacker, which is exactly (V2). The
        separating condition that WOULD break the symmetry is a private
        orientation, and it does not exist over F_p ordinary.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold (p, t, q, k) fixed and vary the forgotten structure (which of
          the q+1 crater subgroups the holder descended through, the torsor
          position). Ask whether any intrinsic invariant of the resulting
          floor curve is cheaper for the holder to use than for the public.
          Predicted: none; the unique ascent needs no such invariant.
        predicted_gain: >-
          None to any attacker beyond what Galbraith 2024 already gives; the
          gain is a closure of priority (2)'s path-hiding limb with a named
          obstruction and a redirection to the floor torsor.
      - transform: specialization_pack
        proposed_object: >-
          The resource measure 'bits of hiding entropy contributed by the
          conductor', realised as log2 h(O_f) - log2 h(O_K) and charged
          negatively: ascent removes log2(q - (D_K/q)) bits per q-step and the
          attacker's unique ascent pays no search for it.
        predicted_gain: >-
          A one-line table replacing the lane's qualitative 'the conductor
          hides the endpoint' with a signed bit count that is negative.
    quantifier_order: >-
      (V1): FOR ALL ordinary classes over F_p whose volcano has a crater of
      constant or polynomial size, THERE EXISTS a rigorous algorithm computing
      an isogeny between ANY two class members in Otilde(p^{1/4}) -- as stated
      in the retrieved abstract, quantifiers to be confirmed at Stage 0.
      (V2): FOR ALL (p, t, q) and FOR ALL holder routes in the DECLARED family
      {R-ext, R-div, modular-polynomial}, THERE EXISTS a public ascent route of
      the same asymptotic cost. NOT CLAIMED: 'for all holder routes whatsoever'
      -- that universal is the falsifier, and an undeclared asymmetric route
      is exactly what an adversarial reviewer should hunt.
      (V3): FOR ALL orders Z[pi] subset O subset O_K, h(O) <= h(Z[pi]), with
      strict inequality whenever O is not Z[pi]. Unconditional from the
      class-number formula for orders once that formula is verified.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: 'for the declared route family, at the declared (q, D_K, k)
        cells, ascent and descent cost the same within a stated constant; the
        torsor size decreases by the stated factor per ascent; and the
        retrieved abstracts state the connecting-isogeny costs quoted'. It
        can NEVER certify that no asymmetric holder route exists, cannot
        certify Galbraith's theorems (only re-quote them), and certifies
        nothing about whether any endpoint weakness exists.
      nearby_object_control: >-
        THE ORIENTED SUPERSINGULAR CURVE WITH A SECRET ORIENTATION, the
        closest object where the hoped-for asymmetry HOLDS: there the holder
        knows the orientation and the public does not, ascent 'with respect
        to an orientation' (eprint 2025/1243's setting) is one-sided, and a
        Teske-shaped trapdoor is at least conceivable. A method that reported
        symmetry there too would have proved too much. This control is
        argued, not run: it is the reason isogeny-based trapdoor-DDH lives in
        the supersingular world (KN-LIT-7634), and stating it is the record's
        most useful sentence for a future agent.
    proof_obligations:
      - claim: >-
          The retrieved abstracts state the quoted exponents with the quoted
          conditions; Stage 0 confirms the theorem statements.
        responsibility: baseline
      - claim: >-
          On a floor curve the ascending kernel is the unique F_p-rational
          q-subgroup and its points are rational over exactly F_{p^k}.
        responsibility: correctness
      - claim: >-
          k = ord_q(t/2 mod q) and the orientation K are isogeny-class
          invariants.
        responsibility: correctness
      - claim: >-
          For each declared route, holder descent cost and public ascent cost
          agree within a constant, measured.
        responsibility: runtime
      - claim: >-
          h(O) strictly decreases along every ascent; the torsor-size table
          matches exact reduced-form counting at toy discriminants.
        responsibility: size
      - claim: >-
          The record makes no claim about Semaev-meter continuity, about the
          existence of any weakness, or about any hypothesis status.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The pair (k, level) of a curve in the class: k = ord_q(t/2 mod q), the
      field-of-definition degree of the q-torsion eigenline, and level = the
      q-adic valuation of [End(E) : Z[pi]].
    lossiness: >-
      Genuinely lossy: the curve, its j-invariant, its torsor position and the
      connecting chain are all discarded; only two small integers are kept.
      Discarded COMPATIBLY with the operation (a vertical q-isogeny): k is
      invariant and level moves by exactly one, so the retained part
      propagates deterministically. Not a change of coordinates: all curves
      at one level collide, which is why the object is a cost meter and not
      an address.
    propagation: >-
      Exact under vertical q-steps (level +/- 1, k fixed) and under horizontal
      steps (both fixed). Under the class-group action the object is constant,
      which is the mechanism: it is available to everyone.
    survival_score: >-
      Survives the entire volcano; degrades by nothing. Its uselessness to the
      designer is its survival: a quantity that every party can read at every
      vertex cannot hide anything.

  null_object_control: >-
    NULL-1, HORIZONTAL EDGE (blocking, instrument calibration). A horizontal
    ell-step at the crater with ell split in O_K, computed by both parties
    from the F_p-rational eigenlines. The ascent/descent cost ratio must be
    1 within run-to-run spread; a ratio away from 1 here means the operation
    counter is asymmetric by construction and every Stage 2 ratio is void.
    POSITIVE CONTROL, k = 2 (blocking). The unique rational q-subgroup of the
    floor curve must be recovered from a random point of the quadratic twist
    over F_p in polynomial time, and the resulting ascent must land on the
    crater (j checked exactly). If it does not, the eigenline argument of
    (V2) is wrong as implemented and nothing else is reported.
    NEGATIVE CONTROL, k = 1 (class-invariant weakness cell, as the goal
    mandates). k = 1 forces q | t - 2, hence p = 1 mod q and q^2 | N, so the
    whole class is Pohlig-Hellman-weak at q for everyone; the instrument must
    flag it as class-invariant-weak before any cost is read, and no trapdoor
    reading is admissible there. This is the goal's 'smooth order' control
    appearing where the parameterisation forces it.
    DECAY / ARTIFACT CHECK. The ascent/descent ratio must be FLAT in q and
    in D_K and in k. A ratio that drifts with the parameter meant not to move
    it is an artifact under docs/inventor-protocol.md section 3, and the
    honest tell here is inverted: the artifact is a ratio that moves.
    ARCHIVE CHECK (zero compute). Prior corpus measurements of a vertical
    ascent cost: NONE FOUND (IDEA-20260807-bb03d3 proposes but does not
    report one; EXP-ECTD-9e4248's runs are INVALID per DEC-20260812-06bf94
    and measured meters, not step costs). Recorded as an absence.

  discriminated_from:
    - >-
      IDEA-20260731-017 / H-ECTD-19017a / H-ECTD-ac8627. Those measure whether
      Semaev meters JUMP across a conductor step, motivated by KN-LIT-7630's
      1999 hardness of the connecting isogeny. This record does not touch the
      meters; it shows the MOTIVATION is superseded (V1) and that no
      designer-side asymmetry can restore it (V2). Exact delta: they track a
      meter vector; this tracks the step cost and its symmetry. Their
      measurement remains a legitimate mechanism question and this record
      proposes no status change to it.
    - >-
      IDEA-20260801-004. That control asks whether a heavy tail forced by a
      large conductor transfers to the public curve. This record asks whether
      the conductor hides anything at all, and answers in bits (negative).
    - >-
      IDEA-20260808-ceca08. Same underlying object (the level) but a different
      consequence: ceca08 bounds how many level BITS the group structure
      leaks; this record shows the level is REACHED by a unique ascent at a
      cost that both parties share, so the leak bound is moot for
      path-hiding. Exact delta: leak of an address versus cost of a step.
    - >-
      IDEA-20260805-4243e6 / H-ECTD-3dbda5. Those count the whole class as the
      hiding space and mark cross-level traversal as unproved (HEUR-ECTD-
      MASS-2). This record supplies (V3): the traversal the attacker needs is
      unique and free of search, and each level above the floor is a smaller
      torsor. Exact delta: H(4p - t^2) as hiding space versus h(Z[pi]) as the
      only hiding space, with the conductor contributing negative bits.
    - >-
      IDEA-20260808-5ee6b4. Uses h(O) for the actual End as the entropy
      identity. This record adds the monotonicity of h(O) along ascents and
      its consequence, which 5ee6b4 does not draw.
    - >-
      IDEA-20260808-ba4e37. Points KN-LIT-7489 at priority (4) and predicts
      the self-pairing inputs are public functions of t. (V2) and the retrieved
      2025/1243 abstract (ascent 'with respect to an orientation', applying to
      ordinary curves) are consistent with that prediction and supply the
      priority-(2) consequence ba4e37 does not state.
    - >-
      IDEA-20260807-bb03d3 (GOAL-ENDO lane). Proposes small-ell ascent by
      Fouquet-Morain as a normal form and names KN-LIT-1210 unread. This
      record reads the abstract, applies the TALL-volcano statement, adds the
      large-prime-q k-gating and the symmetry argument, and points it at a
      different goal (ECTD) and question (path hiding rather than
      multi-target amortisation).
    - >-
      IDEA-20260829-920b16 (RQ-ECDLP-912694). Uses eprint 2025/1243 for the
      special-j address problem. This record uses 2024/924 and 2025/1243 for
      the trapdoor path-hiding limb; the shared citation is declared, the
      question is different.
    - >-
      IDEA-20260901-80308d (filed alongside). That record establishes the
      public limb for HORIZONTAL (torsor-position) endpoints and the
      identification census; this record closes the VERTICAL family and
      supplies the 'level-defined weakness is reached without search' entry
      that 80308d's census cites. Neither implies the other.

  predictions:
    - metric: >-
        M1 -- STAGE 0 VERBATIM RECORD: the theorem statement in eprint
        2024/924 giving Otilde(q^{1/4}) and its crater-size condition, and
        the statement covered by 'heuristically Otilde(q^{0.4})'
      direction: different
      minimum_effect: >-
        PRE-REGISTERED THREE-WAY OUTCOME. (a) The rigorous statement covers
        ordinary curves with crater of polynomial size: (V1) stands with
        exponent 1/4. (b) Only the heuristic statement covers the ordinary
        large-crater case: (V1) is restated with exponent 0.4 and the
        heuristic named. (c) Neither covers ordinary curves: (V1) is
        WITHDRAWN and the record stands on (V2)-(V3) alone. The abstract
        supports (a); this is a reading, not a measurement.
    - metric: >-
        M2 -- ascent/descent operation-count ratio per declared route, per
        (q, D_K, k) cell (Stage 2)
      direction: different
      minimum_effect: >-
        Within a factor 5 of 1 at every measured cell, and FLAT in q, D_K and
        k (fitted slopes indistinguishable from 0). A ratio outside [0.2, 5]
        that survives NULL-1 and grows with k in the holder's favour
        falsifies (V2) for that route and is the LEAD outcome for the
        trapdoor lane; a ratio that drifts without a mechanism is an artifact.
    - metric: >-
        M3 -- k-scaling of the R-ext route cost, per party, over k in 2..12
      direction: higher
      minimum_effect: >-
        Fitted exponent in cost ~ k^beta with beta in [1.0, 2.5] for BOTH
        parties and |beta_holder - beta_public| <= 0.3. The R-div route must
        be k-independent (fitted slope 0 within noise) for both parties.
    - metric: >-
        M4 -- torsor-size ratio h(O_f)/h(O_K) by exact reduced-form counting
        at toy discriminants versus the closed formula
      direction: different
      minimum_effect: >-
        EXACT agreement (rational arithmetic) at every tested (f, D_K), and
        strictly greater than 1 at every f > 1. A disagreement means the
        recalled formula is wrong and (V3) is re-derived before use.
    - metric: >-
        M5 -- k = 2 positive control: fraction of floor curves whose ascent
        via a twist point lands on the crater j
      direction: higher
      minimum_effect: >-
        EXACTLY 1.000 over at least 20 floor curves per (q, D_K). Any failure
        voids Stage 2.
    - metric: >-
        M6 -- k = 1 negative control: fraction of k = 1 classes flagged
        class-invariant-weak (q^2 | N) by the instrument before cost is read
      direction: higher
      minimum_effect: >-
        EXACTLY 1.000. A k = 1 class not flagged means the Pohlig-Hellman
        hygiene check is broken and no cell may be reported.
    - metric: >-
        M7 -- Stage 1 cost table at cryptographic p: attacker (ascent + crater
        walk) versus rho, at q = p^c, c in {1/8, 1/4, 3/8, 1/2}
      direction: lower
      minimum_effect: >-
        Pure arithmetic from the Stage 0 exponents; FORCED under outcome (a)
        of M1: attacker exponent max(1/4, 1/2 - c + alpha_test) versus rho
        1/2, i.e. below rho whenever the crater walk's test exponent
        alpha_test < c. No fitted parameter; reported as a table.

  minimal_test:
    design: >-
      STAGE 0 (reading, zero compute, HARD GATE): open the local PDFs of
      KN-LIT-1210 (downloads/2024-924.pdf), KN-LIT-1400
      (downloads/2025-1243.pdf) and KN-LIT-7630
      (inputs/ECTD-TESKE-20260731/sources/galbraith-iso.pdf); record M1
      verbatim; decide outcome (a)/(b)/(c). This is the cheapest decisive
      step and can end the line at (c).
      STAGE 1 (arithmetic, minutes): M4 torsor table by formula and by exact
      reduced-form counting; M7 cost table.
      STAGE 2 (toy, hours): the k-symmetry measurement over
      q in {17, 19, 23, 29, 31}, D_K in {-3, -4, -7, -8, -11}, p of 30-40 bits
      with t^2 - 4p = q^2 D_K, k realised in the four bands; both routes where
      implementable; M2, M3, M5, M6; NULL-1 first, hashed before the treatment
      cells are read.
      STAGE 3 (toy, conditional on Stage 0): implement the published ascent
      if feasible at q <= 31 and report it beside R-ext/R-div; else NOT
      ATTEMPTED.
      NO ATTACK IS RUN and no discrete logarithm is computed beyond the
      matched rho baseline required by RQ-ECTD-001, run once per class as the
      cost yardstick.
    controls:
      - NULL-1 horizontal edge, ratio 1 (blocking calibration)
      - POSITIVE CONTROL k = 2 twist ascent lands on the crater (blocking)
      - NEGATIVE CONTROL k = 1 class-invariant-weak flag (blocking; the goal's mandated class-invariant control)
      - Flatness of the ratio in q, D_K, k (artifact check)
      - Matched Pollard rho on each class's N as the cost yardstick (mandatory per RQ-ECTD-001)
      - End-level certificate on both endpoints of every measured edge by counting rational q-neighbours (instrument check, as in H-ECTD-ac8627)
    required_metrics:
      - Stage 0 verbatim theorem statements and the (a)/(b)/(c) outcome
      - per-cell operation counts per route per party, with the ratio and its spread
      - fitted k-exponents per route per party
      - torsor-size table, formula versus exact counting
      - pass/fail of every control
      - the Stage 1 cost table with every recalled exponent labelled
      - wall-clock per stage and peak memory

  falsification_conditions:
    - >-
      F1. Stage 0 outcome (c): neither paper covers ordinary curves. (V1) is
      withdrawn; the record is superseded with (V2)-(V3) only and says so.
    - >-
      F2. A declared route on which the holder's descent is asymptotically
      cheaper than the public's ascent, reproduced across cells and surviving
      NULL-1. (V2) is false for that route; this is the LEAD branch and the
      first genuine vertical-trapdoor ingredient the lane would have.
    - >-
      F3. A reviewer exhibits an undeclared holder route not gated by (q, k)
      -- for instance one using private algebraic data not determined by
      (p, t, q, k). (V2)'s quantifier is then too narrow and the record is
      superseded with the route added to the family and re-measured.
    - >-
      F4. M4 disagrees with exact counting. The recalled class-number formula
      is wrong; (V3) is re-derived before any use.
    - >-
      F5. NULL-1 returns a ratio away from 1, or M5 or M6 fails. Instrument
      broken; nothing is reported (AGENTS.md rule 5).
    - >-
      F6. Budget exhaustion before the (q, D_K, k) grid resolves.
      INFRASTRUCTURE outcome, never evidence about symmetry.

  confounders:
    - >-
      Operation counting across routes. R-ext works over F_{p^k} and R-div
      over F_p; counts must be converted to F_p-operation equivalents with the
      conversion stated per cell, or the ratio compares unlike units.
    - >-
      Horizontal subgroups at the crater. The holder must AVOID the 0, 1 or 2
      horizontal q-subgroups when descending; the selection cost is small but
      real and must be charged to the holder rather than dropped, which biases
      the ratio slightly BELOW 1 and is disclosed.
    - >-
      Tiny D_K makes the crater a single public curve (h(O_K) = 1), so the
      Stage 2 cells are the most designer-unfavourable case. This is
      deliberate (it is the vertical trapdoor's natural shape) and is
      disclosed; a cell with h(O_K) > 1 (D_K = -15 or -20) is added as a
      graded control if budget permits.
    - >-
      Toy k. At 30-40-bit p and k <= 12 the extension route is cheap for
      everyone; the large-k regime is measured only by R-div at q <= 31, so
      the symmetry claim at large k rests on the route argument plus the
      division-polynomial measurement, not on extension arithmetic. Disclosed.
    - >-
      Abstract-only reading. Every exponent in (V1) is quoted from an abstract
      and could be conditioned in ways the abstract omits; Stage 0 exists for
      exactly this reason and no Stage 1 table may be cited before it runs.
    - >-
      Closure-shaped writing. A closure is cheap to produce and reads as
      rigour; the record carries a LEAD branch (F2), a nearby object where the
      asymmetry genuinely exists (secret orientation), and a Stage 0 that can
      withdraw its headline.

  interpretation_limits:
    - >-
      (V1) is a quotation of a retrieved abstract, conditional on Stage 0. It
      is not this program's result and the exponents are Galbraith's, with his
      stated heuristic where he states one.
    - >-
      (V2) is scoped to the declared route family. It is NOT a proof that no
      asymmetric route exists; that universal is the falsifier F3.
    - >-
      Nothing here bears on whether Semaev/Groebner meters see the End ring
      (H-ECTD-ac8627's question), on whether any endpoint weakness exists
      (H-ECTD-001/19c623), or on any hypothesis status. It bears on the
      PATH-HIDING and HIDING-SPACE limbs of the vertical family only, and it
      is information for the Coordinator, who alone may act on it.
    - >-
      The k = 1 cell is a class-invariant weakness and appears only as the
      goal's mandated negative control; no trapdoor reading is admissible
      there.
    - >-
      Every measured number is toy tier and scoped to the tested (q, D_K, k,
      p) cells, routes and budget. No transfer to cryptographic size is
      claimed for the measurements; the cryptographic-size statements are the
      two abstracts' own.
    - >-
      MANDATORY FORWARD GUIDANCE (inventor protocol section 4). What remains
      open after this record: (i) the horizontal floor torsor as the only
      hiding space, owned by IDEA-20260901-80308d; (ii) whether the published
      ascent is polynomial for ordinary curves once the orientation is known,
      which Stage 0 decides; (iii) the oriented SUPERSINGULAR setting with a
      secret orientation, where the asymmetry genuinely exists and which lies
      outside RQ-ECTD-001's declared scope -- raised as a scope question, not
      smuggled in.

  heuristic_assumptions:
    - id: H1
      statement: >-
        FOR ALL (p, t, q) with q | f and k = ord_q(t/2) <= (log p)^{O(1)}, the
        cost of obtaining a generator of the q-torsion eigenline over F_{p^k}
        behaves like the cost of finding a point of prescribed order in a
        group of known order over F_{p^k}: poly(k, log p) field operations
        with the same constant for the floor curve and the crater curve.
      rigorous_support: >-
        The rigorous ingredient is exact: E(F_{p^k}) has order computable from
        t by the Frobenius recurrence, and for k < q the q-torsion rational
        over F_{p^k} is exactly the eigenline L on the floor (Jordan-block
        argument) and all of E[q] on the crater (scalar Frobenius), so a
        random point times the cofactor lands in the right subgroup with
        probability 1 - 1/q. The distributional half imitates the standard
        random-point-order heuristic used in every cofactor-multiplication
        routine; no smoothness heuristic is involved.
      validation_plan: >-
        SAMPLE: 200 random points per (q, D_K, k) cell at k <= 12, recording
        the number of trials to a generator on each party's curve. COMPARISON:
        geometric law with success probability 1 - 1/q, by chi-square. TAIL
        CHECK: the maximum trial count against the geometric tail. SAMPLED
        PARAMETERS recorded per cell: p, t, q, D_K, k, seed. TRANSFER
        ASSUMPTION: none needed for the symmetry claim, which is about equality
        of the two parties' costs at the same k; the statement 'poly(k)' at
        cryptographic k is a recalled cost model and is labelled one.
    - id: H2
      statement: >-
        FOR ALL ordinary classes with a q-volcano of height h >= 1, the
        Cl(O_f)-torsor at conductor f has size given by the class-number
        formula for orders, so that h(O_f)/h(O_K) = f * prod_{ell | f}
        (1 - (D_K/ell)/ell) / [O_K^* : O_f^*], and in particular exceeds 1 for
        every f > 1.
      rigorous_support: >-
        A theorem (class-number formula for non-maximal orders), RECALLED and
        therefore re-checked by exact reduced-form counting rather than
        trusted. The classical distribution statement it sits beside is the
        Kronecker-Hurwitz mass identity already used by H-ECTD-3dbda5 L2,
        which fixes the SUM over levels; H2 fixes the per-level SPLIT.
      validation_plan: >-
        SAMPLE: all discriminants f^2 D_K with D_K in {-3, -4, -7, -8, -11,
        -15, -20} and f in {q, q^2} for q <= 31, class numbers by exact reduced
        binary quadratic form enumeration with Hurwitz weights (the H-ECTD-
        3dbda5 instrument). COMPARISON: exact rational equality with the
        formula. TAIL CHECK: the smallest and largest ratio observed against
        the formula's q-1 and q+1 extremes. No transfer assumption: the
        identity is size-independent algebra.
    - id: H3
      statement: >-
        The exponents quoted from eprint 2024/924 -- rigorous 1/4 for craters
        of constant or polynomial size, heuristic 0.4 in the worst case --
        apply to ordinary curves over prime fields with a large prime-power
        conductor, i.e. to the vertical-trapdoor shape, with the heuristic
        being one about the Kani construction and not about the trapdoor.
      rigorous_support: >-
        The retrieved abstract states both exponents and the crater condition
        explicitly and names ordinary curves; the rigorous half needs no
        heuristic by its own statement. What is assumed is only that the
        abstract's conditions match the trapdoor shape, which is a READING
        assumption, discharged or refuted at Stage 0.
      validation_plan: >-
        Stage 0 reading, recording the theorem statements verbatim; Stage 3
        toy implementation only if feasible, comparing the published ascent's
        operation count against R-ext/R-div at q <= 31 across three field
        sizes, with the fitted exponent reported against the paper's. TAIL
        CHECK: none applicable to a reading. TRANSFER: the cryptographic-size
        claims are the paper's and are quoted, not extrapolated from toys.

  target_complexity:
    time_exponent: >-
      NO ATTACK ON ECDLP IS CLAIMED AND NO EXPONENT MOVES FOR PLAIN ECDLP.
      Against a VERTICAL TRAPDOOR's path-hiding limb the record quotes the
      external exponent: connecting isogeny in p^{1/4 + o(1)} (rigorous,
      small crater) or p^{0.4 + o(1)} (heuristic, worst case) versus rho's
      p^{1/2}, a gap of p^{1/4} to p^{0.1}; and it derives that the attacker's
      identification step above E_pub is a unique ascent (exponent 0 in search)
      into a torsor smaller than the floor's by the conductor factor. The
      symmetry claim (V2) is an equality of exponents between holder and
      public at every k, i.e. designer margin 0 in the exponent and 0 +/- O(1)
      in bits on the vertical step.
    memory_exponent: >-
      Polynomial for the ascent routes measured here (a kernel polynomial of
      degree (q-1)/2 or a point over F_{p^k}); the published algorithms'
      memory is NOT quoted because the abstracts do not state it and is a
      Stage 0 item. The crater walk is O(log p) memory.
    best_known: >-
      For plain ECDLP: parallel rho at 0.886 sqrt(N) with the negation map,
      O(1) memory per processor (KN-TECH-006); BSGS 2 sqrt(N) time, sqrt(N)
      memory. For the connecting isogeny: Galbraith 1999 worst case
      Otilde(p^{1.5}) (KN-LIT-7630), superseded by Galbraith 2024's
      Otilde(p^{0.4}) heuristic / Otilde(p^{1/4}) rigorous small-crater
      (retrieved abstract). For End(E): Bisson-Sutherland subexponential
      (KN-LIT-251, unread, recalled).
    hidden_overhead: >-
      (i) The o(1) in every quoted exponent hides whatever Galbraith's
      Otilde hides, unread; (ii) the crater walk's c_test is a free symbol
      carried from IDEA-20260805-4243e6; (iii) the factorisation of D_pi to
      find q is subexponential and is charged, not hidden; (iv) Stage 2's
      symmetry is measured at toy k and q, with the large-k regime covered by
      the route argument plus R-div only.
    tradeoff_note: >-
      Not a time-memory trade the record controls. The one tradeoff that
      matters is the designer's: raising the conductor to make the step
      expensive shrinks the torsor by the same factor and makes the ascent
      unique; there is no setting of q that helps the designer on both axes.

  dominated_by: >-
    n/a (no attack, no algorithm, no improvement is claimed; the deliverable
    is a closure with an external ingredient and a symmetric cost
    measurement). ROWS CHECKED across time, memory and data/queries before
    writing that: Pollard rho (1.2533 sqrt N time, O(log N) memory, 0
    queries); BSGS (sqrt N, sqrt N); van Oorschot-Wiener parallel rho; the
    class walk of IDEA-20260805-4243e6 (H * (c_test + c_step), O(log p)
    memory); the coset MITM of IDEA-20260808-5ee6b4 (p^{1/4} actions, for
    coset-structured weak sets only); Galbraith 2024's connecting isogeny
    (p^{0.4} heuristic / p^{1/4} rigorous small crater, memory unstated);
    Bisson-Sutherland End(E) at L(1/2) (recalled); Fouquet-Morain small-ell
    ascent at poly (IDEA-20260807-bb03d3). The record proposes nothing that
    competes with any row; it points one row (Galbraith 2024) at a lane that
    had not read it. Absence of a dominating row in this corpus is not
    evidence that none exists.
  sota_delta: >-
    Zero on every attack axis against plain ECDLP. Against the VERTICAL
    TRAPDOOR family: the lane's path-hiding cost moves from the 1999
    Otilde(p^{1.5}) worst case it cites to the 2024 Otilde(p^{1/4}) rigorous
    small-crater / Otilde(p^{0.4}) heuristic figures -- i.e. from p^{1}
    ABOVE rho to p^{1/4} (or p^{0.1}) BELOW rho, a swing of 1.25 (or 1.1) in
    the exponent, supplied by citation rather than by this program. Derived
    here: the conductor's contribution to hiding entropy is
    -log2(q - (D_K/q)) bits per q-step (negative), and the holder/public cost
    ratio on the vertical step is 1 within a constant on every declared
    route. Internal delta: the corpus's KN-LIT-1210 goes from title-level to
    abstract-level provenance through this record's citations, and a KN-LIT
    upgrade is recommended to the Coordinator (not performed here; outside
    write scope).

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that Stage 0 returns outcome (a) or (b) and (V1) stands with
    exponent 1/4 or 0.4 -- the residual is that the abstract's 'crater of
    constant or polynomial size' is conditioned in the theorem in a way that
    excludes the large-prime-conductor ordinary case. 0.8 that (V2) survives
    review for the declared routes; 0.5 that a reviewer names an undeclared
    holder route worth measuring (F3), which would narrow rather than refute.
