idea:
  id: IDEA-20260805-c8c0d4
  question_id: RQ-AES-003
  goal_id: GOAL-AES-003
  added: '2026-08-05'
  title: >-
    REF-C is not one wall but four instruments of wildly different sharpness:
    a resolution census that shows the key-indexed row is not measured dead but
    unmeasurable by 2^37-2^42 samples, and that ranks C3's surviving routes
  class: measurement

  claim: >-
    Completion criterion C3 treats REF-C as a single bar -- "this campaign's own
    measured death rounds" -- but its four rows were measured by instruments
    whose detection floors differ by more than thirty bits, and RQ-AES-003
    R4(1) already records the worst case in one sentence without drawing the
    consequence: the key-indexed influence probe "resolves to ~2^-8.8 per cell
    while the relevant threshold is 2^-40, so 'at the null' means 'below an
    instrument about 30 bits too blunt'". THIS PROPOSAL DRAWS THE CONSEQUENCE
    AND IT IS ARITHMETIC. A statistical probe of a relative bias epsilon needs
    of order epsilon^-2 samples; the campaign's own committed 5-sigma floor for
    CAND-FR-2 -- 2^-7.18 relative at N = 2^19 -- is reproduced EXACTLY by
    5/sqrt(N) = 5/724.08 = 0.006905 = 2^-7.178, which fixes the convention
    without guessing. Under that same convention a threshold of 2^-40 needs
    N = 25 * 2^80 = 2^84.6 samples, against a MEASURED campaign envelope of
    2^42.6 AES evaluations and 2^38.8 per producer task. THE SHORTFALL IS
    BETWEEN 2^37.4 AND 2^42.0 SAMPLES depending on the sigma convention.
    Therefore the key-indexed row of REF-C is NOT a measured death round at
    r = 4: it is a regime this machine cannot enter, at any round count, by any
    statistic of that resolution class. The same arithmetic gives a general
    floor: inside a 2^42.6 envelope no bias below about 2^-19 is detectable at
    all. And it gives the ranking C3 needs, because the campaign's EXACT
    statistics -- the r=4 bijection (exhaustive, zero detection floor), the r=5
    congruence (null cost 8^-t per trial), the exact-value reading (2^-15.5 per
    2^32 arm) -- have NO such floor. NOTHING HERE IS A CLAIM THAT ANY
    DISTINGUISHER EXISTS OR DOES NOT. It is a claim about what this machine can
    see, offered with its arithmetic exposed.

  object_first_candidate:
    tracked_object: >-
      THE DETECTION FLOOR, in bits, of each instrument this campaign has used --
      followed through from the sample count actually spent to the smallest
      effect that instrument could have distinguished from its own null --
      alongside the effect size the object under test would have to have. The
      campaign tracks round numbers at which objects "die". This proposal tracks
      the instrument's resolution beside them, which is what turns "dead" into
      either "measured dead" or "never looked at".
    established_families_off_limits: >-
      Off-limits as the primary lens: differential and truncated differential;
      linear and multidimensional linear; integral / square / division property;
      impossible differential; meet-in-the-middle and Demirci-Selcuk; boomerang
      and retracing boomerang; biclique; algebraic (XSL-family) and Groebner;
      yoyo; mixture differential / exchange; subspace trail; partial sums as a
      cost reorganisation.
      NO ATTACK FAMILY IS USED AS A LENS HERE AT ALL. The lens is sampling
      arithmetic applied to this campaign's own instruments. That is deliberate:
      the productive move being taken is "attack the measurement, not the
      target", and using an attack family would defeat it.
    newness_score: >-
      The epsilon^-2 law is elementary and is not claimed as new. What is absent
      from this repository is any record that places the four REF-C rows on one
      resolution axis, and any record that derives the campaign-wide detectable
      bias floor from the measured envelope. R4(1) states the 30-bit gap for one
      row and stops; DEC-20260802-9bda5c and DEC-20260802-b226fb do not carry
      the consequence forward.
    testability_score: >-
      Maximal for the derivation: it is arithmetic, checkable by hand, and its
      convention is pinned by an EXACT reproduction of a committed number
      (2^-7.18 at N = 2^19). Maximal for the environment half: five shell
      commands.
    survival_score: >-
      The obstruction survives every round count and every key size, because it
      is a statement about samples and not about AES. That universality is also
      its ceiling: it forecloses a RESOLUTION CLASS, never a question, and the
      record must say so in those words or it becomes the universal
      impossibility claim RQ-AES-003 R6 forbids.

  mechanism: >-
    DERIVED IN-REPO. Sources: RQ-AES-003 claim_tier_ceiling R1 (REF-C's four
    rows), R4(1) (the influence-density correction and the 2^-8.8 / 2^-40
    sentence), R6 (the distinguisher requirements), the constraints block (the
    measured envelope), and GOAL-AES-003 completion criterion C3.

    STEP 1 -- PIN THE CONVENTION BY REPRODUCING A COMMITTED NUMBER RATHER THAN
    ASSUMING ONE. RQ-AES-003 R1 records for CAND-FR-2 "a 5-sigma floor of
    2^-7.18 relative, N = 2^19" (RUN-FRGATES-20260801-001). Under the
    convention floor = 5/sqrt(N):
      5 / sqrt(2^19) = 5 / 724.077 = 0.0069053 = 2^-7.1780.
    The committed figure is 2^-7.18. The convention is therefore
    floor = 5/sqrt(N), reproduced to three significant figures against a number
    nobody chose for this purpose. This is the baseline-reproduction audit and
    it PASSES before anything else is computed.

    STEP 2 -- INVERT IT FOR THE KEY-INDEXED ROW. R4(1) gives the influence
    probe's resolution as about 2^-8.8 per cell. Inverting,
      5/sqrt(N) = 2^-8.8  =>  sqrt(N) = 5 * 2^8.8 = 2228.6  =>  N = 2^22.24.
    To reach the relevant threshold 2^-40 that R4(1) names,
      5/sqrt(N) = 2^-40  =>  sqrt(N) = 5 * 2^40  =>  N = 25 * 2^80 = 2^84.64.
    Under the barer convention 1/sqrt(N) the requirement is N = 2^80.

    STEP 3 -- COMPARE AGAINST THE MEASURED ENVELOPE. RQ-AES-003 constraints:
    2^38.81 AES evaluations per 1600 s producer task; GOAL-AES-003 and
    RQ-AES-003 motivation: 2^42.6 across a whole campaign budget. Then
      shortfall = 2^84.64 / 2^42.6 = 2^42.04   (5-sigma convention)
      shortfall = 2^80    / 2^42.6 = 2^37.40   (1-sigma convention)
    i.e. between 1.8e11 and 4.4e12 whole campaign budgets. THIS IS THE NAMED
    OBSTRUCTION: sample complexity epsilon^-2 against a measured envelope of
    2^42.6, not any property of AES.

    STEP 4 -- THE GENERAL FLOOR THAT FALLS OUT, AND IT BINDS EVERY FUTURE CARD.
    Setting N = 2^42.6 (the entire campaign spent on one statistic) gives
      best achievable floor = 5 / sqrt(2^42.6) = 5 * 2^-21.3 = 2^-18.98.
    NO BIAS BELOW ABOUT 2^-19 IS DETECTABLE IN THIS ENVIRONMENT BY A
    STATISTICAL PROBE, at any round count, with the whole budget spent on it.
    A card proposing to detect a bias below 2^-19 is OUT OF SCOPE FOR EXECUTION
    under RQ-AES-003's own rule and must be recorded as such rather than
    estimated (AGENTS.md rule 9).

    STEP 5 -- THE CONTRAST THAT MAKES THIS A RANKING RATHER THAN A COMPLAINT.
    The other three REF-C rows and the campaign's structural objects are NOT in
    this resolution class:
      * FULL-DIAGONAL 2^32 INTEGRAL, r = 4. Exhaustive over the coset:
        16/16 balanced with an all-zero accumulator. There is no detection floor
        and no p-value is appropriate; EV-AES-005 says so in those words.
      * n_4 = 0, THE BIJECTION. Exhaustive, max occupancy 1 over 2^32 inputs.
        Deterministic.
      * n_5 = 0 mod 8. An exact congruence. The campaign's own frozen decision
        rule prices t agreeing trials at 8^-t under the uniform null, so 20
        trials buy 60 bits of separation for about 20 x 53 s of AES-NI sweep.
        To buy 60 bits from a bias probe you would need a bias above 2^-19 and
        the whole campaign budget.
      * THE EXACT-VALUE READING of n_r (IDEA-20260805-86e431). One 2^32 arm
        resolves 2^-15.50 of a count near 2^31; K arms resolve
        2^-15.50/sqrt(K). Still statistical, but 22 bits sharper per arm than
        the influence probe and inside the envelope.
      * 1-BYTE DELTA-SET INTEGRAL, r = 3, and the key-indexed influence object,
        r = 4. The first is exact-ish per trial; the second is the row this
        census disqualifies.
    THE RANKING FOR C3, WHICH IS THE DELIVERABLE: routes whose signal is
    DETERMINISTIC (a counting identity, a congruence, an exhaustive equality)
    are unaffected by the envelope and are the only ones that can reach the
    r >= 6 data-path bar or the r >= 5 key-indexed bar here. Routes whose signal
    is a probability bias are bounded at 2^-19 and must declare their expected
    effect size against that bound BEFORE dispatch.

    STEP 6 -- FORWARD GUIDANCE, WITHOUT WHICH THIS IS A FATIGUE REPORT AND NOT
    A CLOSURE (docs/inventor-protocol.md section 4). The key-indexed direction is
    NOT closed and this record must never be cited as closing it. What is closed
    is a RESOLUTION CLASS: bias probes below 2^-19 in this environment. What
    remains OPEN AND UNATTEMPTED -- named as open and unattempted, never as
    screened, tried or negative (AGENTS.md rules 5 and 8, GOAL-AES-003 P2) --
    is the class of EXACT key-indexed statistics: quantities that take a forced
    value over a key family by a counting or algebraic identity rather than by
    concentration. The campaign already possesses one worked example of the
    shape on the data-path side (n_5 = 0 mod 8, forced for every key, base and
    j0, and its null cost is exponential in trials rather than in samples), and
    the existence of a key-indexed analogue is UNKNOWN and UNTESTED. Naming that
    class is the redirection this closure owes.

    STEP 7 -- THE SECOND HALF, WHICH IS ALSO A MEASUREMENT AND ALSO LOAD-BEARING.
    Three premises this goal's criteria rest on are environment facts, and
    environment facts are measured, not inherited. MEASURED BY THIS PROPOSING
    SESSION IN THIS CONTAINER ON 2026-08-05, TO BE RE-MEASURED IN-HARNESS AND
    NOT ASSERTED OF ANY OTHER CONTAINER:
      (a) `import numpy` SUCCEEDS, version 2.4.6. RQ-AES-003's local-resource
          envelope states "no numpy". If numpy is available, the constraint
          block's foreclosure of "dense GF(2) linear algebra at large dimension
          without numpy" is looser than written, which OPENS work rather than
          closing it.
      (b) `import Crypto` FAILS under /usr/local/bin/python3 (3.11.15) and under
          /usr/bin/python3.10, 3.11, 3.12 and 3.13; `pip list` shows no
          pycryptodome. C1 REQUIRES the recovered key to be re-verified "under
          pycryptodome and -- where the round count admits it -- the openssl
          CLI". Meanwhile BATCH-001's committed
          count5/pin_result.json records a `pycrypto` column agreeing with the
          FIPS-197 KAT 69c4e0d86a7b0430d8cdb78070b4c55a. BOTH ARE ON THE RECORD.
          If pycryptodome is genuinely absent now, C1's verification clause is
          UNSATISFIABLE and that is pause condition P3 INFRASTRUCTURE SIGNAL,
          NEVER negative mathematical evidence (AGENTS.md rule 5). It is cheap
          to repair (install, or nominate a second independent implementation
          plus openssl) and expensive to discover mid-certification.
      (c) /usr/bin/openssl EXISTS; gcc 13.3.0; 4 cores; about 15 GB RAM. These
          agree with the constraint block.
    AND ONE PREMISE THIS PROPOSAL REPORTS WITHOUT ADJUDICATING: RQ-AES-003
    provenance states that eprint.iacr.org and arxiv.org are unreachable under
    this harness's network policy, and R3's "novelty is unadjudicable in this
    environment" rests on that. The scouting sweep merged into this session's
    ANGLE-BRIEF reports arXiv and ePrint ABSTRACT endpoints returning HTTP 200
    through the proxy, with ePrint PDF bodies still 403. TWO STATEMENTS ARE ON
    THE RECORD ABOUT DIFFERENT ENDPOINTS AND POSSIBLY DIFFERENT TIMES. This
    record ADJUDICATES NEITHER, ASSERTS NO NOVELTY OR NON-NOVELTY, AND PROPOSES
    NO CHANGE TO R3 -- re-scoping a committed constraint is a Coordinator act on
    a superseding record. It is named only because a criterion resting on an
    unremeasured reachability premise is exactly the kind of load-bearing
    constant this census exists to find.

  novelty_status: unverified

  literature_context:
    - >-
      NO EXTERNAL SOURCE READ OR CITED, AND NONE IS NEEDED. Every figure is
      either arithmetic or a value quoted from a named committed record in this
      repository.
    - >-
      NOT READ -- RELAYED: MEAS-GOAL-AES-002-002, -006, -007, -008 and
      RUN-FRGATES-20260801-001 are quoted here exactly as RQ-AES-003 R1 and
      R4 quote them. This session did not open those receipts. Opening them and
      confirming each row's N and its stated floor is Stage 1, and it is the
      stage that could falsify the census's inputs.

  lossy_projection_identifiability_audit:
    projection: >-
      A whole instrument (statistic, sampling design, null model, sample count)
      --> a single number, its detection floor in bits.
    what_is_discarded: >-
      The statistic's identity, its power against structured alternatives, and
      everything about what it is a statistic OF.
    why_genuinely_lossy: >-
      Very lossy: two instruments measuring completely unrelated properties can
      share a floor.
    why_compatible_with_the_operations: >-
      Compatible with the one question being asked -- "could this instrument
      have seen an effect of size epsilon?" -- because the floor propagates
      deterministically from the sample count under the pinned convention, and
      the convention is fixed by an exact reproduction rather than by choice.
    is_it_only_a_change_of_coordinates: >-
      NO to the first failure: the floor is not invertible to the instrument.
      CHECKED FOR THE MIRROR FAILURE AND IT DOES NOT FIRE: the floors are NOT
      constant across instruments -- they span from "no floor at all"
      (exhaustive) through 2^-15.5 (exact-value arm) to 2^-8.8 (influence
      probe). A spread of more than 30 bits across the objects being compared is
      the opposite of a constant comparator, and that spread IS the finding.

  assumptions:
    - >-
      That the floor scales as c/sqrt(N). Standard for a mean-type statistic
      under independent sampling, and PINNED here by reproducing a committed
      number rather than assumed; but it is wrong for statistics with heavier
      tails, for correlated samples, and for statistics whose null variance is
      not the sampling variance. The census must therefore report each row's
      SAMPLING DESIGN alongside its floor, and flag any row where independence
      is not established.
    - >-
      That the "relevant threshold 2^-40" for the key-indexed object is the
      right target. That number is quoted from R4(1) and this session did not
      derive it. If the relevant threshold is much larger, the shortfall
      shrinks and the row is rehabilitated -- which would be a welcome
      falsification and is why Stage 1 re-derives it.
    - >-
      That the environment measurements in step 7 describe the container future
      producer tasks will run in. NOT ASSUMED -- they are labelled as this
      container on this date and are to be re-measured by the executing task.

  proof_search_map:
    bottleneck: >-
      The word "dead" in REF-C. Completion criterion C3 is defined relative to
      it, so every C3 route is ranked, gated or dismissed by a word that means
      two different things across the four rows: "exhaustively shown to take a
      forced value" for the data-path rows and "not seen by a probe 30 bits too
      blunt" for the key-indexed row.
    baseline_embedding:
      parameter_slice: >-
        CAND-FR-2 at N = 2^19, whose committed floor is 2^-7.18. The census's
        formula must return that number.
      reproduction_check: >-
        EXACT AND ALREADY PERFORMED IN THE MECHANISM: 5/sqrt(2^19) = 2^-7.178
        against the committed 2^-7.18. Three significant figures on a number
        the census did not choose. This is an embedding, not a resemblance.
    observation_collision:
      observable: >-
        The verdict string "at the null" / "dead at round r".
      distinct_preimage_search: >-
        A COLLISION IS ALREADY COMMITTED AND R4(1) IS ITS RECORD. Two
        ground-truth objects on opposite sides of the conclusion -- (A) an
        object with no structure at all, and (B) an object whose structure sits
        at 2^-40, far above cryptographic irrelevance -- produce the SAME
        observable "at the null" under the influence probe, because the probe
        cannot separate anything below 2^-8.8. R4(1) additionally records the
        sharper version: a PURE RANDOM FUNCTION measures 0.4995 on the density
        probe against AES's 0.4996, so a controlled null was read as a closure.
        The collision is not hypothetical; it has already caused one withdrawn
        closure in this campaign.
    constructive_transforms:
      - transform: specialize_measure_pack
        proposed_object: >-
          A problem-specific resource measure for this environment: every
          proposed statistic is charged (sample count N, detection floor
          5/sqrt(N), expected effect size epsilon) and admitted only if
          epsilon > floor at an N inside 2^42.6. Charges added only over
          disjoint blocks -- data, time, memory -- so nothing is double-counted.
        predicted_gain: >-
          A pre-dispatch gate costing zero compute that either admits a
          distinguisher card or records it OUT OF SCOPE FOR EXECUTION with a
          number attached, which is what RQ-AES-003 already requires of every
          candidate's element (d) and what no card has yet supplied.
    quantifier_order: >-
      CLAIMED, AND THE ORDER IS THE WHOLE DIFFERENCE BETWEEN A CENSUS AND AN
      OVERCLAIM: FOR ALL statistics S in the mean-type resolution class, and FOR
      ALL sampling designs with N <= 2^42.6 independent samples, THERE IS NO
      epsilon below about 2^-19 that S distinguishes from its null at 5 sigma.
      The quantifier does NOT range over all statistics -- deterministic
      statistics are outside the class by construction, and the record says so
      in the same breath. Writing the claim with the quantifier ranging over all
      statistics would be the universal impossibility claim R6 forbids, and it
      would be false, since the campaign's own r=5 congruence is a
      counterexample.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that a mean-type bias probe in this environment has a floor of
        about 2^-19, that the key-indexed row of REF-C was measured 2^37.4 to
        2^42.0 samples short of its own stated threshold, and that the
        data-path rows were measured exhaustively and are not affected. It
        CANNOT certify that no key-indexed distinguisher exists, that the
        key-indexed object has no structure, or anything about full-round AES.
      nearby_object_control: >-
        THE NEARBY OBJECT WHERE THE CONCLUSION FAILS IS THE CAMPAIGN'S OWN r=5
        CONGRUENCE, and it must be run through the census as a control. It
        reaches 60 bits of separation from 20 trials inside one producer task,
        which is 41 bits BELOW the census's claimed floor. If the census's
        machinery were to report the congruence as unreachable, the census would
        be applying its floor outside its class and would be wrong. A method
        that cannot distinguish the congruence from the influence probe has not
        found the load-bearing structure, which here is "deterministic versus
        concentration".
    proof_obligations:
      - claim: "floor = 5/sqrt(N) reproduces the committed 2^-7.18 at N = 2^19."
        responsibility: baseline
      - claim: "N required for a 2^-40 threshold is 2^84.6 (5-sigma) or 2^80 (1-sigma)."
        responsibility: correctness
      - claim: "The campaign-wide floor at N = 2^42.6 is 2^-18.98."
        responsibility: correctness
      - claim: >-
          The r=5 congruence and the r=4 bijection are outside the class and the
          floor does not apply to them.
        responsibility: scope
      - claim: >-
          The closure names a resolution class, not a direction, and forward
          guidance names the exact-statistic class as open and unattempted.
        responsibility: scope
      - claim: >-
          The environment readings are measurements of one container on one date
          and are re-measured by the executing task.
        responsibility: interface

  predictions:
    - metric: >-
        Reproduction of the committed CAND-FR-2 floor by the census formula
      direction: different
      minimum_effect: >-
        FORCED VALUE 2^-7.178 against the committed 2^-7.18, agreement to three
        significant figures. Already computed in the mechanism; Stage 1
        recomputes it independently. A failure to reproduce means the convention
        is not 5/sqrt(N) and every other row must be recomputed under whatever
        convention does reproduce it.
    - metric: >-
        Sample shortfall of the key-indexed influence row against its own stated
        2^-40 threshold, in bits
      direction: higher
      minimum_effect: >-
        FORCED VALUE between 2^37.4 and 2^42.0 depending on the sigma
        convention. PREDICTION: the shortfall exceeds 2^30 under every
        convention considered. If it is below 2^10 the row is rehabilitated and
        this proposal's headline is withdrawn.
    - metric: >-
        Campaign-wide detectable bias floor at N = 2^42.6
      direction: different
      minimum_effect: >-
        FORCED VALUE 2^-18.98. Predicted to lie in [2^-21, 2^-17] under any
        reasonable sigma convention between 1 and 8.
    - metric: >-
        Number of the four REF-C rows whose committed record states an N and a
        floor sufficient to compute its resolution
      direction: higher
      minimum_effect: >-
        PREDICTED 2 of 4 at most. CAND-FR-2 states both; the full-diagonal
        integral is exhaustive and needs neither; the 1-byte delta-set row
        states 40 trials per round but no floor; the key-indexed row states a
        resolution but its N must be inferred. A count of 4 would mean the
        census has nothing to add and the proposal is redundant -- the cheapest
        possible falsification.
    - metric: >-
        Environment: importability of numpy and of pycryptodome under every
        system interpreter, and presence of the openssl CLI
      direction: different
      minimum_effect: >-
        PRE-REGISTERED FROM THIS SESSION'S OWN READING: numpy imports (2.4.6);
        pycryptodome does NOT import under any of five interpreters; openssl
        exists. If the executing task finds pycryptodome available, C1 is
        satisfiable and the P3 flag is withdrawn -- and the discrepancy between
        containers is itself worth a line in the receipt.

  minimal_test:
    design: >-
      Three stages, all cheap; stage 1 is decisive and costs no compute.
      STAGE 0 (environment, five commands, seconds): re-measure numpy,
      pycryptodome across every interpreter on PATH, the openssl CLI, core count
      and RAM. Record verbatim. A missing pycryptodome is reported as P3
      INFRASTRUCTURE SIGNAL and never as evidence about anything.
      STAGE 1 (census, zero compute, DECISIVE): open each REF-C source receipt
      (MEAS-GOAL-AES-002-002, -006, RUN-FRGATES-20260801-001), extract N, the
      statistic, the null model and the stated floor for each of the four rows,
      recompute each floor under 5/sqrt(N), and tabulate floor against the
      effect size the object would need. Report any row whose committed record
      does not state enough to do this as UNDETERMINED rather than estimating it.
      STAGE 2 (ranking, zero compute): classify every C3 route currently on the
      record, and every route this session's proposals name, as DETERMINISTIC
      (no floor) or MEAN-TYPE (floor 5/sqrt(N)), and for the latter state the
      expected effect size against the 2^-19 bound. Emit the pre-dispatch gate
      as a checklist.
    controls:
      - >-
        NULL OBJECT, FORCED VALUE PRE-DERIVED, CAN FAIL: apply the census
        formula to a statistic whose floor is KNOWN INDEPENDENTLY -- a
        Binomial(N, 1/2) proportion at N = 2^19, whose 5-sigma floor is
        5/(2 sqrt(N)) in absolute terms. The formula must return it. If it does
        not, the census's arithmetic is wrong before any REF-C row is touched.
      - >-
        POSITIVE CONTROL WHERE THE VERDICT MUST COME OUT "REACHABLE": the
        campaign's own r=5 mod-8 congruence, which reaches 60 bits of separation
        in 20 trials. The census MUST classify it as deterministic and MUST NOT
        apply the 2^-19 floor to it. If the machinery declares it unreachable,
        the instrument is broken and NO negative verdict about any other row may
        be reported.
      - >-
        GRADED CONTROL, FOUR INTERIOR POINTS, MONOTONICITY REPORTED: compute the
        floor at N = 2^19, 2^26, 2^33, 2^38.8, 2^42.6 and confirm it falls by
        exactly half per 2 bits of N. A floor that does not fall as N rises is
        an arithmetic error, and the monotonic ladder makes it visible.
      - >-
        SIBLING NULL ISOLATING THE PROPERTY NAMED: apply the census to a
        statistic that is statistical but has a FORCED null variance (the exact
        n_r reading, whose null is Poisson with known variance) versus one whose
        null variance was estimated from the data (the influence probe). The
        floors differ for a reason the census must name, and if it assigns them
        the same floor it is measuring sample size rather than resolution.
      - >-
        ARCHIVE CHECK (zero compute): enumerate every prior statement of an
        instrument resolution in this campaign. AVAILABLE and short:
        RQ-AES-003 R4(1) (2^-8.8 versus 2^-40), R1 (2^-7.18 at N = 2^19),
        EV-AES-005 OBS-1 resolution note ("not statistical"), EV-AES-005
        boundary on the 2^-46.2 false-positive rate. Four statements, no table.
    required_metrics:
      - per-row table (statistic, N, null model, sampling design, floor in bits, required effect size, verdict)
      - the reproduction check against 2^-7.18 with its arithmetic shown
      - the campaign-wide floor at N = 2^42.6
      - the deterministic-versus-mean-type classification of every live C3 route
      - verbatim environment readings with interpreter paths

  falsification_conditions:
    - >-
      5/sqrt(2^19) failing to reproduce 2^-7.18. The pinned convention is wrong
      and every derived number is withdrawn.
    - >-
      The 2^-40 threshold in R4(1) proving, on re-derivation, to be the wrong
      target for the key-indexed object. The shortfall shrinks, possibly to
      nothing, and the headline is withdrawn as a superseding record.
    - >-
      The census classifying the r=5 congruence as unreachable. The class
      boundary is drawn wrongly and nothing negative may be reported.
    - >-
      All four REF-C rows already carrying an N and a floor in their committed
      receipts. The census adds nothing and should be recorded as redundant.

  confounders:
    - >-
      A RESOLUTION CENSUS IS CHEAP AND FLATTERS ITS AUTHOR. Declaring another
      team's instrument blunt costs nothing and reads as rigour. The design
      answers this with a positive control that can fail (the r=5 congruence
      must come out reachable), a null the arithmetic can fail (the Binomial
      floor), and a falsification condition under which the whole headline is
      withdrawn (the 2^-40 target being wrong).
    - >-
      THE epsilon^-2 LAW IS NOT UNIVERSAL. It applies to mean-type statistics
      under independent sampling. Chi-square statistics over many cells, extreme
      order statistics and adaptive procedures scale differently, sometimes much
      better. The census must state its class boundary explicitly and refuse to
      classify statistics outside it rather than guessing.
    - >-
      THE 2^42.6 ENVELOPE IS A THROUGHPUT FIGURE, and IDEA-20260805-72ec9a
      records that the throughput constant behind it has two unreconciled
      committed values a factor 4.43 apart. A factor of 4.43 in N is 1.1 bits in
      the floor -- negligible against a 37-to-42-bit shortfall, which is why the
      conclusion is robust to it, and the robustness must be stated rather than
      the discrepancy ignored.
    - >-
      ENVIRONMENT DRIFT. The pycryptodome reading disagrees with a committed
      BATCH-001 receipt. The honest reading is that containers differ across
      sessions, NOT that the receipt is false. Asserting the receipt false would
      be exactly the fabrication this record exists to guard against.

  interpretation_limits:
    - >-
      THIS IS NOT A CLOSURE OF THE KEY-INDEXED DIRECTION AND MAY NEVER BE CITED
      AS ONE. It closes a RESOLUTION CLASS -- mean-type bias probes below about
      2^-19 in this environment -- and it names the exact-statistic class as
      OPEN AND UNATTEMPTED. Under GOAL-AES-003 P2, constructions considered but
      not built are named open and unattempted and are NEVER recorded as tried,
      screened or negative.
    - >-
      NO UNIVERSAL IMPOSSIBILITY CLAIM IS MADE (RQ-AES-003 R6). The claim is
      bounded by a sampling model, an environment and a class of statistics, all
      three named.
    - >-
      NO STATUS CHANGE to any evidence record, decision or constraint is
      proposed or implied, and in particular NO change to R3 or to RQ-AES-003's
      provenance block. Those are Coordinator acts on superseding records under
      AGENTS.md rules 1 and 4.
    - >-
      Claim tier `toy`, reduced-round only, no statement about full-round or
      deployed AES, no comparison to published cryptanalysis in either direction.

  heuristic_assumptions:
    - id: HEUR-R1
      statement: >-
        For every mean-type statistic used in this campaign, the smallest
        relative effect distinguishable from the null at 5 sigma with N
        independent samples is 5/sqrt(N).
      rigorous_support: >-
        The central limit theorem for a bounded mean-type statistic gives
        sd = O(1/sqrt(N)); the constant is convention. NOT a theorem about any
        particular statistic here, and the constant is pinned empirically rather
        than derived: it reproduces the committed 2^-7.18 at N = 2^19 exactly,
        which is the only support offered and is offered as such.
      validation_plan: >-
        Reproduce 2^-7.18 at N = 2^19; reproduce the Binomial(N,1/2) floor at
        the same N; report both. If either fails the census does not run.
      falsification_condition: >-
        Either reproduction failing by more than 10 per cent.
    - id: HEUR-R2
      statement: >-
        The relevant structural threshold for the key-indexed influence object
        is 2^-40 per cell.
      rigorous_support: >-
        NONE OFFERED HERE. This number is quoted from RQ-AES-003 R4(1) and was
        NOT derived by this session. It is the single most load-bearing input to
        the headline shortfall and it is the most likely thing to be wrong.
      validation_plan: >-
        Re-derive it from the object's own definition in Stage 1, or record that
        it could not be re-derived and report the shortfall as conditional on a
        number this campaign has never justified -- which would itself be the
        more interesting finding.
      falsification_condition: >-
        A re-derived threshold above 2^-19. The key-indexed row becomes
        measurable and the headline is withdrawn.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED. This proposal is a measurement audit and says so.
      The exponent it makes legible is the SAMPLE exponent of a distinguisher:
      log2(N) = 2 log2(1/epsilon) + O(1), against a hard environment ceiling of
      42.6. Stating that ceiling once, in bits, is worth more to this campaign's
      direction than another round of probes below it, and the honest summary is
      that this record redirects search rather than advancing it.
    memory_exponent: >-
      n/a; the census is arithmetic. Memory enters only as the 15 GB envelope
      that bounds any table-based route, which is quoted, not measured here.
    best_known: >-
      Not asserted; see dominated_by.
    hidden_overhead: >-
      The census hides nothing and computes nothing expensive. Its risk is not
      overhead but over-application: applying the mean-type floor outside its
      class, which the positive control exists to catch.
    tradeoff_note: >-
      The trade this record makes visible is between DETERMINISTIC statistics
      (expensive per trial, no detection floor, separation exponential in
      trials) and MEAN-TYPE statistics (cheap per sample, separation only as
      sqrt(N)). In a 2^42.6 envelope the first wins decisively, and no record in
      this campaign has said so.

  dominated_by: >-
    Unresolvable in this environment: no primary source reachable from this
    harness was read for this record, and every recalled frontier row is
    unverified-from-memory (RQ-AES-003 R5). Rows checked INSIDE this repository
    across time, memory and data/queries for an existing resolution census or a
    derived detectable-bias floor: RQ-AES-003 R1, R4 and constraints;
    GOAL-AES-003 what_counts_as_a_breakthrough, what_does_not_count and
    completion criteria; EV-AES-001..005, EV-AES-d33b1c, EV-AES-d8a13e;
    DEC-20260802-9bda5c, DEC-20260802-b226fb; both BATCH-002 review reports; the
    BATCH-001 count5 pre-registration. FOUR isolated resolution statements were
    found (listed under the archive check) and NO table, NO inversion to a
    sample requirement, and NO environment-wide floor. Absence of a search
    result is not evidence that no such census exists (AGENTS.md retrieval
    policy).
  sota_delta: >-
    NO ATTACK, NO DISTINGUISHER, NO MARGIN AGAINST REF-A, REF-B OR REF-C, ZERO
    on every attack axis. Quantitative deltas actually claimed: the key-indexed
    row of REF-C moves from the verdict "at the null from round 4" to the
    verdict "measured 2^37.4 to 2^42.0 samples short of its own stated
    threshold, at every round count"; and the campaign gains a numeric
    pre-dispatch gate, a detectable-bias floor of 2^-18.98 at N = 2^42.6, where
    it currently has none. Published-frontier comparison: UNADJUDICABLE in this
    environment, in both directions.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.90 that the headline holds -- that the key-indexed row is short of its own
    threshold by more than 2^30 samples and that the campaign-wide mean-type
    floor is near 2^-19. It is not higher because the entire shortfall is
    computed against the 2^-40 threshold of HEUR-R2, which this session did NOT
    derive and merely quotes from R4(1); if that number is wrong the headline
    goes with it. It is not lower because the convention is pinned by an exact
    reproduction of an unrelated committed number, because a 37-to-42-bit gap
    survives any plausible factor-of-four adjustment to the envelope, and
    because R4(1) already states the 30-bit version of the same observation and
    merely does not carry it forward.
    0.98 that the audit reaches a decisive reading, since every stage is
    arithmetic or a shell command.
    0.60 that the environment half finds at least one live discrepancy with the
    constraint block; two are already measured in this session (numpy present,
    pycryptodome absent), and the second gates completion criterion C1.
