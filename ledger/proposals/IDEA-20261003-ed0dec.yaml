# IDEA-20261003-ed0dec
# Frobenius-degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-ed0dec
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    Frobenius over a field of size 3 has degree 3 and over size 2 has degree 2
  class: measurement
  claim: >-
    Frobenius over a field of 3 elements has degree 3. Frobenius
    over a field of 2 elements has degree 2. Three exceeds two by 1.
    The product of the two degrees is 6. Their sum is 5. The gap is
    a map degree equal to the field size, not an ECDLP exponent and
    not a square.
  mechanism: >-
    OBJECT FRAME. R3 is the Frobenius endomorphism. The operation
    set is the field Frobenius. The degree is the field size in
    these two frozen cases. Two copies of degree 2 have gap 0.
    No point is mapped.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question treats End(E) as a ring and asks for any
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        The automorphism square-root factor is a different object
        from these two Frobenius degrees.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two field sizes are frozen before the degrees are read.
    - No point is mapped.
  proof_search_map:
    bottleneck: The degree gap 1.
    baseline_embedding:
      parameter_slice: The field sizes 3 and 2 and the degrees 3 and 2.
      reproduction_check: >-
        Two readers subtract and must agree that 3 exceeds 2 by 1.
    observation_collision:
      observable: The degree gap and the product.
      distinct_preimage_search: >-
        Reporting both degrees as 2 drops the gap. Two copies of
        degree 2 make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The degrees 3 and 2.
        predicted_gain: Integer gap. No mapping of a point.
    quantifier_order: >-
      The field sizes are fixed before the degrees.
    method_ceiling:
      strongest_certifiable_claim: >-
        The degree gap 1. Not a square.
      nearby_object_control: >-
        Two copies of degree 2. The gap is 0.
    proof_obligations:
      - claim: The degree over a field of 3 elements is 3.
        responsibility: size
      - claim: The degree over a field of 2 elements is 2.
        responsibility: size
      - claim: The gap is not a square.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: degree_gap
      direction: different
      minimum_effect: Three exceeds two by 1.
  minimal_test:
    design: >-
      Subtract 2 from 3 and multiply 3 by 2. Do not map a curve point.
    controls:
      - Two copies of degree 2, whose gap is 0.
      - An independent count.
    required_metrics:
      - both degrees
      - the gap
      - the product
  falsification_conditions:
    - The gap is not 1.
    - The product of the two degrees is not 6.
  confounders:
    - The square of the field size is a different number from this degree.
  interpretation_limits:
    - A Frobenius degree is not a walk length.
    - No transfer to a cryptographic field.
    - This is not a square of 2 or of 3.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen Frobenius degree equals the frozen field size,
        which is 3 in one case and 2 in the other.
      rigorous_support: >-
        No Frobenius theorem is re-proved here. The count is a
        reading of two field sizes.
      validation_plan: >-
        Two independent readings. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Not a memory bound.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: The inseparable and separable parts are not split here.
    tradeoff_note: A larger field size is not a shorter walk.
