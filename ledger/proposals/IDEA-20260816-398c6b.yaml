idea:
  id: IDEA-20260816-398c6b
  question_id: RQ-PMA-001
  added: '2026-08-16'
  title: 'Turn the obstruction over per inventor-protocol section 4 by measuring it as a resource:
    certificate bits emitted against decider branches avoided, and the yield of a generator of prescribed
    tables that are certifiably non-realizable over k(t) yet realizable over a quadratic extension,
    which is what such an obstruction would be a supply of'
  class: composition
  claim: '(A) Section 4 of docs/inventor-protocol.md requires that a measured obstruction be read
    twice: once as a verdict and once as a resource, asking not whether the obstruction is real but
    which theory wants this measurement as its hypothesis, with examined true and a reading recording
    that no theory takes it up being a complete and honest answer while leaving the field null asserts
    only that nobody looked. No PMA record contains a resource_check of any kind. (B) This entry performs
    that second reading concretely and measurably in two parts. PART 1, the compression reading: a
    divisor-parity certificate is a short rejection proof, so measure its SIZE IN BITS against the
    WORK IT REPLACES -- the number of orientation-root branches and candidate-matrix assemblies the
    independent constructive decider would otherwise expand before concluding non-existence. The ratio
    of decider branches avoided to certificate bits is the obstruction''s value as a compression device,
    and it is a number nobody has. (C) PART 2, the supply reading: the assumption in IDEA-20260726-012
    that roots in a quadratic extension do not satisfy ordinary PMA4 over k(t) says that the obstruction
    is exactly a FIELD-OF-DEFINITION obstruction. A gate that reliably identifies tables realizable
    over a quadratic extension but not over k(t) is a GENERATOR of such instances, and instances with
    a certified field-of-definition gap are the natural test inputs for any tool that claims to decide
    realizability over a base field. Measure the generator''s yield: instances per unit compute, and
    the fraction whose extension-realizability is independently confirmed. (D) What is NOT claimed:
    that either reading finds a taker. Both may come back empty, and under section 4 an examined-and-empty
    reading is a complete answer. Nor is it claimed that a compression ratio has any cryptographic
    meaning; it does not. (E) No attack, speedup or security consequence is claimed, and no direction
    is closed.'
  mechanism: 'Stage 1 defines certificate size precisely and unambiguously: the serialized certificate
    is the list of odd-valuation places with multiplicities, the valuation at infinity, and the residual
    constant class, encoded in a fixed declared format, and its size in bits is measured on that serialization
    rather than estimated. Stage 2 instruments the independent constructive decider to COUNT the branches
    it expands and the candidate matrices it assembles before reaching a non-existence verdict on
    the same instance, without any use of the gate, so the two numbers come from disjoint code paths.
    Stage 3 pairs them per instance and reports the distribution of branches-avoided per certificate
    bit, together with the wall-clock ratio, which is the honest engineering version of the same quantity.
    Stage 4 implements the extension test: for each gate-obstructed instance, attempt realizability
    over the quadratic extension named by the failing square class, by adjoining a square root of
    the offending class and re-running the constructive decider there, so extension-realizability
    is established by a witness matrix over the extension rather than inferred. Stage 5 measures generator
    yield and the confirmation fraction. Stage 6 writes the resource reading in the obstruction-block
    form of templates/research-records.md, with examined set true and the reading recording either
    the theory or tool that takes the measurement up, or an explicit statement that none was found
    at this search size.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read docs/inventor-protocol.md section 4 in full including the resource_check and obstruction-block
      requirements, ledger/proposals/IDEA-20260726-012.yaml assumptions and interpretation_limits
      in full, ledger/hypotheses/H-PMA-001.yaml assumptions and test_boundary.implementation in full,
      experiments/EXP-PMA-001/specification.yaml controls block in full. Grepped ledger/proposals/
      and ledger/hypotheses/ for: resource_check, obstruction registry, certificate size, branches
      avoided, field of definition, quadratic extension.'
    results: 'IDEA-20260726-012''s mechanism already frames the certificate as supplying a short rejection
      certificate without enumerating matrix branches or solving the full four-minor equation -- so
      the compression idea is NAMED there, in one clause, and never quantified anywhere. Its assumptions
      include that allowing roots in a quadratic extension changes the field-of-definition question
      and does not satisfy ordinary PMA4 over k(t), which is the exact premise of the supply reading
      and is likewise never measured. H-PMA-001''s test_boundary.implementation specifies module B
      as a decider that branches over all orientation roots and assembles candidate matrices, so the
      branch count the compression reading needs is a quantity that module would naturally produce
      and that no metric in EXP-PMA-001 asks it to record: the frozen secondary metrics are obstruction_witnesses,
      decided_vs_undecided_counts, degenerate_branch_count, exceptional_locus_count, grobner_crosscheck_outcomes,
      per_field_grid_sizes and per_stage_wall_clock_seconds -- no branch count and no certificate
      size. resource_check returns no hits in ledger/proposals/ or ledger/hypotheses/ in connection
      with PMA.'
    verdict: 'UNVERIFIED. Nothing is asserted about literature outside this repository. Claimed new
      inside it: the quantified compression reading (branches avoided per certificate bit), the extension-realizability
      generator with confirmed witnesses, and the filled obstruction block with examined true, none
      of which exists for any PMA record. Assembled from known parts: the short-rejection-certificate
      framing is one clause of IDEA-20260726-012''s own mechanism; the field-of-definition premise
      is one of its own assumptions; the branching decider is H-PMA-001''s own module B; the second-reading
      requirement is docs/inventor-protocol.md section 4 verbatim. The new content is that all four
      are turned into instrumented counters.'
  object_first_candidate:
    tracked_object: 'The REJECTION CERTIFICATE itself, treated as an object with a size and a purchasing
      power rather than as a verdict: the pair (serialized certificate bits, decider branches and
      assemblies avoided on the same instance), carried per instance and aggregated into a distribution.
      In part 2 the tracked object is the (instance, extension) pair together with a witness matrix
      over the extension.'
    lossiness: 'Genuinely lossy in part 1 and deliberately NOT lossy in part 2, and saying which is
      which matters. The certificate is a lossy projection of the entire branching computation: it
      retains only enough to reject, discarding the branch tree, the candidate matrices and the failure
      reasons, which is precisely why it can be small and why measuring how small is meaningful. In
      part 2 the tracked object is a witness matrix over the extension, and a witness is not a projection
      of anything -- it is a complete object exhibited in full. Recording that part 2 loses nothing
      is the honest answer to the lossy-projection test for that half: it is a change of field, not
      a new object, and it earns its place by being a construction rather than by being an invariant.'
    propagation: 'One step of the target operation is expanding one more branch in the decider. Under
      the certificate, that step is not taken at all, so the propagation statement is a counterfactual
      and must be measured by running the decider WITHOUT the certificate on the same instance and
      counting what it does. This is why the two code paths must be disjoint and why the branch count
      cannot be inferred from the certificate: the whole quantity is the work the certificate makes
      unnecessary, and it exists only if the decider actually does it.'
    survival_score: The compression reading survives exactly as long as the decider can reach a verdict
      on the same instances the gate obstructs, and it DIES the moment the decider times out -- because
      a timed-out decider gives an unbounded branch count that is an infrastructure fact, not a mathematical
      one, and per AGENTS.md rule 3 it may not be counted as a large avoided-work figure. That failure
      mode is the entry's main risk and is handled by reporting the branch count only for instances
      the decider decides within budget, with the timed-out fraction printed beside every ratio. The
      supply reading survives as long as the quadratic extension is small enough for the decider to
      run there, which roughly doubles the field size and is bounded.
  null_object_control: 'Two nulls in the same invocation. NULL 1 (compression baseline): the identical
    branches-avoided-per-bit measurement applied to a TRIVIAL certificate that carries no information
    -- a fixed-length constant string emitted for every instance, paired with the same decider branch
    counts. Since the trivial certificate rejects nothing, its true purchasing power is zero, and
    if the measurement pipeline reports a nonzero ratio for it the pipeline is measuring the decider''s
    cost rather than the certificate''s value. NULL 2 (supply baseline): the extension-realizability
    test applied to tables drawn from the degree-matched uniform null rather than from gate-obstructed
    instances, giving the background rate at which an arbitrary non-realizable table becomes realizable
    over a quadratic extension. For the generator to be a generator, its confirmation fraction must
    exceed NULL 2''s background rate; if it does not, the gate is not selecting field-of-definition
    instances, it is selecting non-realizable instances of any kind.'
  discriminated_from:
  - 'IDEA-20260726-012''s short-rejection-certificate clause: a one-sentence framing with no quantity
    attached. This entry measures the certificate''s size and the work it replaces, which the clause
    does not do and which no metric in the frozen contract records.'
  - 'IDEA-20260726-012''s quadratic-extension assumption: a scoping assumption that extension roots
    do not satisfy ordinary PMA4 over k(t). This entry treats that assumption as the premise of a
    generator and measures the generator''s yield with confirmed witnesses over the extension.'
  - 'EXP-PMA-001''s CTRL-PMA4-GROUND-TRUTH: the decider as a truth source. This entry uses the same
    decider as a COST METER, instrumented to count branches and assemblies, which is a different use
    and requires an instrumentation the frozen metrics do not request.'
  - 'Entry 6 of this bucket (density against nulls): measures how often the gate fires. This measures
    what a firing is worth, which is orthogonal -- a rare certificate that avoids enormous work and
    a common one that avoids none are opposite resources with the same firing statistics.'
  - 'The blacklisted cost-model and machine-variance audits of this program: those audit the program''s
    own timing and cost apparatus across experiments. This counts branches inside one algebraic decider
    on one problem and reports wall clock only as a secondary honesty check beside the branch count,
    which is machine-independent.'
  assumptions:
  - The independent constructive decider can be instrumented to count branches and candidate assemblies
    without changing its verdicts; this is checked by running it instrumented and uninstrumented on
    a sample and requiring identical verdicts.
  - Certificate size is well defined once a serialization format is declared; the format is frozen
    in advance and printed, and no size is reported against an unstated format.
  - A gate-obstructed instance that is realizable over the quadratic extension named by its failing
    square class exhibits a genuine field-of-definition gap, established by a witness matrix over
    the extension whose sixteen principal minors reverify by direct evaluation.
  - Instances on which the decider does not terminate within budget contribute nothing to any ratio;
    their fraction is reported and they are never assigned a large avoided-work value (AGENTS.md rule
    3).
  predictions:
  - metric: null1_trivial_certificate_measured_purchasing_power
    direction: lower
    minimum_effect: exactly 0 -- a constant certificate that rejects nothing must measure as buying
      nothing; any nonzero value proves the pipeline is measuring decider cost rather than certificate
      value
  - metric: instrumented_versus_uninstrumented_verdict_disagreements
    direction: lower
    minimum_effect: exactly 0 across the whole decided sample
  - metric: branches_avoided_per_certificate_bit
    direction: different
    minimum_effect: 'I refuse to pre-commit a value. Reason: this is the entry''s primary unknown,
      it depends on the decider''s branching factor which nobody has measured, and inventing a ratio
      would be a fabricated statistic under AGENTS.md rule 5. The distribution and its interquartile
      range are the deliverable.'
  - metric: extension_confirmation_fraction_minus_null2_background
    direction: higher
    minimum_effect: an absolute difference of at least 0.20 for the gate to count as selecting field-of-definition
      instances rather than merely non-realizable ones
  - metric: extension_witness_reverification_failures
    direction: lower
    minimum_effect: exactly 0 -- every claimed extension realization must reverify all sixteen principal
      minors by direct evaluation
  minimal_test:
    design: 'Instrument the decider with two counters and run it, without the gate, on ten instances
      the gate obstructs and ten it does not, at one small constant field. That is twenty decider
      invocations and it produces the entire compression reading in miniature: the branch and assembly
      counts on obstructed instances, which is the work the certificate would avoid, against the counts
      on unobstructed ones, which is the work it would not. Pair those against the serialized certificate
      sizes and the trivial-certificate null. If the branch counts on obstructed instances are comparable
      to those on unobstructed ones, the certificate buys nothing and the compression reading is complete
      and negative at a cost of minutes. If they differ by orders of magnitude, the ratio is worth
      measuring across a grid. The supply reading is a separate and larger stage requiring extension
      arithmetic, and it is not needed to reach the compression verdict. The instrumented-versus-uninstrumented
      verdict check runs alongside for free.'
    controls:
    - 'NULL 1: trivial constant certificate paired with the same branch counts, which must measure
      as zero purchasing power.'
    - 'NULL 2: extension-realizability test on degree-matched uniform non-realizable tables, giving
      the background rate of quadratic-extension realizability.'
    - 'Instrumentation-invariance control: instrumented and uninstrumented decider must return identical
      verdicts on the whole sample.'
    - 'Extension witness control: every claimed extension realization carries a matrix over the extension
      whose sixteen principal minors reverify by direct evaluation in an independent implementation.'
    - 'Timeout accounting control: instances where the decider does not terminate within budget are
      counted and excluded from every ratio, with their fraction printed beside each ratio.'
    - 'Serialization control: the certificate format is frozen before the run and printed, and sizes
      are recomputed by an independent serializer on a sample.'
    required_metrics:
    - serialized certificate size in bits per obstructed instance, under the declared format
    - decider branch count and candidate-assembly count per instance, obstructed and unobstructed,
      from the uninstrumented-by-the-gate path
    - branches-avoided-per-certificate-bit distribution with median and interquartile range
    - wall-clock ratio per instance, reported beside the branch ratio as a secondary honesty check
    - extension confirmation fraction on gate-obstructed instances, and NULL 2's background fraction
    - extension witness reverification failures
    - decider timeout fraction, per arm
    - the filled obstruction block per templates/research-records.md, with examined true and the reading
      text
  falsification_conditions:
  - 'NULL 1 measures nonzero purchasing power for a trivial certificate: the pipeline measures decider
    cost rather than certificate value and no ratio may be reported.'
  - 'Instrumented and uninstrumented deciders disagree on any verdict: the cost meter changes the
    thing it measures.'
  - 'Any claimed extension realization fails sixteen-minor reverification: the supply reading''s witnesses
    are invalid.'
  - 'Branch counts on gate-obstructed instances are statistically indistinguishable from counts on
    unobstructed instances: the certificate avoids no work and the compression reading is complete
    and negative, which is a usable measured obstruction rather than a null.'
  - 'Extension confirmation fraction within 0.20 of NULL 2''s background: the gate selects non-realizable
    instances generally rather than field-of-definition instances, so it is not the generator the
    supply reading hypothesised.'
  - 'The decider times out on more than a stated fraction of obstructed instances: the compression
    ratio is unmeasurable at this scale and must be reported as unavailable, never as large (AGENTS.md
    rule 3).'
  confounders:
  - Branch count is an implementation property of one decider, not an intrinsic property of the problem;
    a differently written decider gives a different ratio. The record must present the ratio as bound
    to the named decider and its branching order.
  - Wall clock conflates implementation quality with certificate value, which is why the branch count
    is primary and the timing is secondary; reporting only timing would drift into the program's already-saturated
    cost-model territory and would be less informative here.
  - Certificate size depends entirely on the serialization format, so a compressed format can inflate
    the ratio arbitrarily. Freezing and printing the format is the only defence.
  - Instances the gate obstructs may be systematically easier or harder for the decider for reasons
    unrelated to the obstruction, so the obstructed-versus-unobstructed branch comparison is confounded
    by instance difficulty; matching on discriminant degree is a partial mitigation and its residual
    is reported.
  - Quadratic-extension realizability is a different question from realizability over the base field,
    and a witness over the extension confirms only the extension question; inferring anything about
    the base field from it would be exactly backwards.
  - An empty resource reading is a legitimate outcome under section 4, but it is also the easiest
    outcome to reach by not looking hard; the search size and the specific candidates considered must
    be recorded so the emptiness is checkable.
  interpretation_limits:
  - A compression ratio has no cryptographic meaning of any kind and no bearing on any security parameter;
    it is an engineering property of one certificate against one decider.
  - An empty resource reading means no taker was found at this search size, which under docs/inventor-protocol.md
    section 4 is a complete and honest answer and is explicitly NOT a closure of the obstruction.
  - Extension witnesses confirm realizability over the extension only. Nothing is inferred about the
    base field, and RQ-PMA-001's question is about k(t).
  - Branch counts are properties of the named decider implementation and branching order and do not
    transfer to any other decider.
  - Nothing here decides whether divisor parity obstructs PMA4; the entry presupposes gate verdicts
    as inputs and measures what they are worth.
  target_complexity:
    time_exponent: No attack exponent is claimed. Cost is one certificate serialization plus one instrumented
      decider run per instance, plus one decider run over a quadratic extension for the supply reading.
    memory_exponent: No attack exponent is claimed. Memory is the decider's branch frontier plus a
      few hundred certificates.
    best_known: The incumbent is the frozen contract's own accounting, which records per_stage_wall_clock_seconds
      and obstruction_witnesses but no branch count, no assembly count and no certificate size, so
      there is no existing measure of what a certificate is worth anywhere in this repository. On
      the supply side the incumbent is IDEA-20260726-012's quadratic-extension assumption, which is
      an assumption and not a measurement.
    hidden_overhead: 'The compression ratio hides a serialization choice that can move it by an order
      of magnitude, and hides the decider''s branching order, which is a design decision nobody has
      justified. The supply reading hides the extension arithmetic cost, which roughly doubles field
      sizes and can push the decider past its budget precisely on the obstructed instances that are
      most interesting. The largest hidden cost is human: writing a resource reading that is genuinely
      examined rather than perfunctory, since an unexamined empty reading and an examined empty reading
      look identical in the record unless the search is written down.'
  dominated_by: 'n/a (no result claimed). Checked across time, memory and data/query axes: this entry
    produces no cryptanalytic quantity, no algorithm and no source-to-scalar candidate, and the compression
    ratio it measures is an internal engineering property of one certificate against one decider,
    so there is no frontier row it could sit on or under.'
  sota_delta: 'no attack; conceptual/measurement contribution only. The internal quantitative comparison
    is the entry''s own output: certificate bits against decider branches avoided, reported as a distribution
    with median and interquartile range, plus an extension confirmation fraction against a background.
    There is no prior value for either quantity in this repository, so the delta is from unmeasured
    to measured rather than from one number to a better one.'
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'Part 1 instrumentation (branch and assembly counters that do not change
    verdicts): 0.85, straightforward but requires the decider to exist and be instrumentable, and
    EXP-PMA-001''s module B is specified and unbuilt. Part 1 result being informative (obstructed
    and unobstructed branch counts differing by enough to matter): 0.55, genuinely uncertain -- the
    decider might terminate quickly on obstructed instances for reasons unrelated to the obstruction,
    in which case the certificate buys little and that is a real and reportable finding. Part 1 being
    measurable at all (decider terminating within budget on enough obstructed instances): 0.6, and
    this is the entry''s main infrastructure risk. Part 2 extension arithmetic working and witnesses
    reverifying: 0.7. Part 2 confirmation fraction exceeding background by 0.20: 0.35 -- I am not
    confident the gate selects field-of-definition instances specifically rather than non-realizable
    ones generally, and that is exactly what NULL 2 exists to decide. Probability the resource reading
    finds a genuine taker theory or tool rather than recording examined-and-empty: 0.25, stated low
    deliberately, because section 4 makes examined-and-empty a complete answer and pretending otherwise
    would be the failure mode it warns about.'
