idea:
  id: IDEA-20261018-1bc873
  title: Block Wiedemann/Lanczos with filtering reachable from ecbench ic.pipeline; measure the relation
    matrix
  class: tooling
  question_id: RQ-BINSTD-b6f698
  area: BINSTD
  goal_ids:
  - GOAL-ICEX-001
  status: proposed
  proposed_by: idea-generator (Sonnet subagent logging the missed items of the 2026-10-18 index-calculus
    review)
  added: '2026-10-18'
  claim: Wiring the existing block Wiedemann and block Lanczos with CADO-style filtering (koblitz_sparse_la.rs)
    into ic.pipeline yields verified kernels identical to structured Gauss on the same relation matrices
    and a measured counted-cost crossover below which dense wins and above which sparse wins; the relation
    matrix, never measured, has a recorded density, weight distribution and post-filter dimension.
  mechanism: ic.pipeline offers only dense or structured Gauss (linalg.rs:250-279; the test at :379 asserts
    that 'wiedemann' is rejected), while the good engine sits unreachable in koblitz_sparse_la.rs (block
    Wiedemann over Z/r only). LA is 0.495 of the E(F_{p^4}) exponent (0.420 with large primes) and q^1.52
    locally in genus 3, the two regimes where IC has a sub-rho exponent.
  novelty_status: unverified
  regime: E(F_{p^4}) k=4 and genus-3 after cubic GHS; prerequisite; 3-5 days glue work
  citations:
  - ref: crypto:research/ic_leads_review_20261018/README.md 3.3, 2.3 (H-BINSTD, H-ICEX), 4 row 4
    provenance: internal
    claim: Source of the opportunity, the measured figures quoted here and the cost estimate; desk review,
      no new measurement, costs are the reviewer's estimates.
    verified_by: idea-generator
  - ref: crypto:src/cryptanalysis/ic_framework/linalg.rs:250-279,379
    provenance: internal
    claim: Only dense/structured Gauss reachable; wiedemann rejected by test.
    verified_by: idea-generator
  - ref: crypto:src/cryptanalysis/koblitz_sparse_la.rs
    provenance: internal
    claim: Block Wiedemann/Lanczos and filtering over Z/r.
    verified_by: idea-generator
  - ref: H-BINSTD-dcc004
    provenance: internal
    claim: 'Approved, never run: Krylov/Wiedemann vs dense elimination on IC matrices.'
    verified_by: idea-generator
  - ref: H-ICEX-5666b2
    provenance: internal
    claim: 'Proposed: the second half of every IC exponent is cited, not measured.'
    verified_by: idea-generator
  - ref: crypto:REVIEW-UNADDRESSED section 4.1 item 6
    provenance: internal
    claim: The relation matrix has never been measured.
    verified_by: idea-generator
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-IC-a4dd54
    - KR-IC-5ea2f8
    - KR-IC-46d822
    nearest:
    - ref: KN-TECH-008
      provenance: internal
      relation: special_case
      delta: Sparse/structured LA over finite fields is the established technique; this wires the repository's
        existing engine into ic.pipeline and measures the relation matrix (H-BINSTD-dcc004 approved, H-ICEX-5666b2
        proposed).
    - ref: KN-LIT-017
      provenance: internal
      relation: adjacent
      delta: Block Wiedemann over GF(2); the repository engine is over Z/r.
    searched:
      note: Positioned against the cited review and the records it names. The frontier map was not rendered
        or matched in this logging pass; the Coordinator should run tools/build_frontier_map.py --match
        before ranking. A missing row is not evidence of novelty.
  assumptions:
  - The Z/r block Wiedemann is reused unchanged; filtering is the existing CADO-style code.
  - Relation matrices are taken from verified runs on the E(F_{p^4}) ladder and genus-3 rows.
  predictions:
  - metric: kernel_agreement_with_structured_gauss
    direction: higher
    minimum_effect: Identical verified kernels on all test matrices.
  - metric: sparse_vs_structured_counted_cost
    direction: lower
    minimum_effect: Sparse below structured Gauss above a crossover size inside the tested range.
  - metric: relation_matrix_object
    direction: different
    minimum_effect: Density, row/column weight distribution, post-filter dimension reported per size.
  minimal_test:
    design: Replace the rejection at linalg.rs:379 with a sparse backend selector reaching block Wiedemann/Lanczos
      with filtering; run both engines on the same saved relation matrices from the k=4 ladder and genus-3
      rows over at least four sizes; compare kernels and counted cost; record matrix statistics.
    controls:
    - dense Gauss as exact oracle on small sizes
    - synthetic matrix of known rank (positive control)
    - A/A repeat
    - dense/structured arm timed in the same session
    required_metrics:
    - kernel equality
    - counted LA cost per engine
    - crossover size
    - matrix density and weights
    - peak memory
  falsification_conditions:
  - No crossover over four sizes, or any kernel disagreement, refutes the claim that the sparse engine
    is a drop-in improvement at these sizes.
  - A cost gain only in a stage is a stage improvement, not a pipeline one.
  confounders:
  - filtering parameters
  - Z/r vs GF(2) arithmetic
  - matrix source distribution
  interpretation_limits:
  - Over Z/r only; GF(2) is a separate item.
  - Prerequisite, not itself an end-to-end gain.
  heuristic_assumptions:
  - id: H1
    statement: The relation matrix is sparse enough that the sparse engine overtakes dense inside the
      tested sizes.
    rigorous_support: LA exponent 0.495 and q^1.52 measured in situ.
    validation_plan: Measure density; fit the crossover.
  target_complexity:
    time_exponent: Targets the LA term of the k=4 exponent (0.495 plain) and genus-3 q^1.52; no new exponent
      claimed.
    memory_exponent: No exponent claimed; memory is the measured constraint, reported as peak RSS.
    best_known: Matched generic rho, r^0.5 group operations; the index-calculus baseline is Table A/B
      of crypto:docs/ic/LEADERBOARD.md (5.23x to 21x matched rho on Koblitz, 5.47x to 13.5x on prime fields).
      Report this row's gap to matched rho (and to Bernstein-Lange where setup is excluded) as distance
      remaining.
    hidden_overhead: Every phase, cold, is charged; unpriced native work is priced at 0, 0.1 and 1 GAE
      per operation (AGENTS.md 5a) wherever two arms are ranked.
    tradeoff_note: Not applicable beyond the stated resource envelope.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  dominated_by: No attack result; the item is an unrun measurement or an unpaid baseline debt.
  sota_delta: Not yet an improvement; the first admissible IC bound needs this object.
