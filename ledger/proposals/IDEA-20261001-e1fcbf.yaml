idea:
  id: IDEA-20261001-e1fcbf
  title: Structural-width audit of direct scalar-multiplication encodings
  class: measurement
  question_id: RQ-ECDLP-002
  added: '2026-10-01'
  status: proposed
  approved_by: null
  handoff_id: TASK-20261001-1d7296
  novelty_status: unverified
  claim: >-
    A bounded structural audit can test whether apparent sparsity and width in
    direct scalar-multiplication presentations survive specified representation
    controls. No favorable result, novel mechanism, or ECDLP gain is assumed.
  mechanism: >-
    Construct diagnostic equation presentations only from toy public known-scalar
    forward computations, retaining provenance for coordinates, auxiliaries,
    arithmetic model, and exceptional cases. Measure presentation size, degree,
    graph-width bounds and explicitly defined rank statistics. Original motivation
    is understanding global structure of direct equations without a factor base;
    the present scope excludes inverse-solving implementations and scalar recovery.
    The object is a coordinate-dependent presentation, not a new lossy group object.
  citations:
