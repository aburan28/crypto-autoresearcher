    memory_exponent: null
    best_known: Generic rho supplies the square-root reference for prime-order ECDLP; this proposal has no ECDLP algorithm.
    hidden_overhead: Charge equation construction, representations, graphs, width bounds, rank, certificates, replay, failures and storage.
    tradeoff_note: Diagnostic cost and any ECDLP consequence are unknown; smaller width can accompany larger representations.
