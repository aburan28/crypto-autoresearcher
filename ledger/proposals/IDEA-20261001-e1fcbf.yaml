      claim: Internal frontier row concerns Frobenius-invariant factor bases, not direct forward encodings.
      verified_by: '/root parent source read 2026-10-01; excerpt supplied to TASK-20261001-1d7296'
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: Internal generic-bound row is a scope constraint; structural diagnostics are not DL algorithms.
      verified_by: '/root parent source read 2026-10-01; excerpt supplied to TASK-20261001-1d7296'
  assumptions:
    - All inputs, scalars and intermediate forward values are public and synthetic.
    - Arithmetic semantics and exceptional-case handling are documented for each presentation.
    - No mathematical speedup is assumed; all measurements remain unperformed.
  proof_search_map:
    bottleneck: Distinguishing intrinsic arithmetic information from presentation-induced sparsity.
    baseline_embedding:
      parameter_slice: Toy prime-field forward computations with public known scalars only.
      reproduction_check: Independently replay forward outputs and check each recorded equation on the public witness.
    observation_collision:
      observable: Size, degree, primal-graph width bounds and stated matrix-rank statistics.
      distinct_preimage_search: >-
        Compare synthetic systems with identical variable-constraint incidence but
        different coefficients or arithmetic semantics; equal graphs need not
        imply equal algebraic behavior. This is not a group-preimage search.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Documented equivalent forward presentations using named coordinate and auxiliary-variable choices.
        predicted_gain: No gain assumed; quantify diagnostic changes and transformation costs.
    quantifier_order: >-
      Fix input family, arithmetic representation, metrics, budgets and controls
      before observation; report every sampled presentation and failed measurement.
      A favorable sample does not imply a statement for all curves or encodings.
    method_ceiling:
      strongest_certifiable_claim: Reproducible finite presentation statistics and certified graph bounds for the sampled public computations.
      nearby_object_control: Same-incidence different-semantics systems and equivalent presentations of the same forward computation.
    proof_obligations:
      - claim: Public forward outputs and equation witnesses agree under independently replayed arithmetic.
        responsibility: correctness
      - claim: Report all construction, transformation, graph and rank costs including failures.
        responsibility: runtime
      - claim: Count auxiliaries, coefficients, matrix dimensions, bit sizes and peak resident memory.
        responsibility: size
      - claim: Width upper bounds include checkable decompositions; lower bounds identify their certificate or bound method.
        responsibility: interface
      - claim: No observed low degree, width or rank establishes an inversion exponent or asymptotic advantage.
        responsibility: scope
    not_applicable_reason: No strict ECDLP improvement or new group-object construction is proposed; this map governs diagnostic validity only.
  predictions:
    - metric: Presentation size and certified-or-bounded primal-graph width across representations
      direction: different
      minimum_effect: At least one reproducible nonzero difference would support representation sensitivity; zero differences remain reportable.
    - metric: Rank statistics under matched incidence and changed semantics
      direction: different
      minimum_effect: At least one rank-unit difference at fixed matrix dimensions would witness insufficiency of incidence alone; absence is inconclusive.
  minimal_test:
    design: >-
      Future bounded public-known-scalar forward-only diagnostic, contingent on
      ordinary proposal review. Prespecify a small toy parameter ladder and resource
      cap; compare documented equation presentations without inverse solving.
      Use the primal graph: variables are vertices and co-occurrence in a constraint
      gives edges. A decomposition has width max bag size minus one; report an upper
      bound unless matching certified lower bounds prove exact treewidth.
      Define every rank by matrix construction, coefficient field, evaluation
      point if applicable, dimensions and normalization; do not pool unlike ranks.
    controls:
      - Independent public forward arithmetic and witness substitution.
      - Variable permutation must preserve graph invariants and appropriately transformed ranks.
      - Equivalent presentations of the same forward computation, charging added auxiliaries and conversions.
      - Matched graph incidence with different coefficients or semantics.
      - Explicit handling or exclusion disclosure for exceptional arithmetic inputs.
    required_metrics:
      - Input sizes, scalar bit lengths, coordinates, field and public input manifest.
      - Variables, constraints, auxiliaries, degrees and coefficient bit sizes.
      - Graph vertices and edges, width upper and lower bounds, certificates and bound-method names.
      - Matrix definition, field, dimensions, rank and rank-computation cost.
      - Construction, transformation, graph, rank and independent verification time separately and in total.
      - Peak memory, artifact bytes, failed attempts, resource caps and censored measurements.
  falsification_conditions:
    - A representation effect vanishes under replay or cannot be separated from changed input semantics.
    - A purported width certificate fails verification or an uncertified heuristic value is labelled exact treewidth.
    - A rank comparison changes field or matrix definition without disclosure.
    - Construction or measurement cannot finish within the prescribed cap; report censored, not favorable.
    - Any inference from low degree or width to an ECDLP solving exponent lacks a separate proof.
  confounders:
    - Introducing auxiliaries can reduce local degree while increasing total size or graph complexity.
    - Coordinates, equation redundancy, evaluation point and field change rank statistics.
    - Known public witness specialization can remove uncertainty absent in an inverse problem.
    - Equal incidence graphs can encode very different semantics.
    - Small samples, favorable scalar patterns and omitted exceptional cases bias apparent trends.
  interpretation_limits:
    - Diagnostic presentation complexity is not ECDLP complexity or a private-scalar recovery result.
    - Finite width bounds and rank measurements establish no asymptotic law.
    - No exact treewidth claim without a certificate meeting its matching bound.
    - Low first-fall degree, solving degree and regularity are distinct notions.
    - Internal prior-art metadata is not independent verification of historical mathematical claims.
  heuristic_assumptions:
    - id: H1
      statement: A small prespecified parameter ladder can reveal representation sensitivity worth documenting.
      rigorous_support: No asymptotic representativeness or mathematical gain is assumed.
      validation_plan: Report all samples and controls; limit conclusions to observed finite presentations.
    - id: H2
      statement: Chosen diagnostic matrices may distinguish presentations beyond graph incidence.
      rigorous_support: No rank-to-solving-complexity implication is assumed.
      validation_plan: Fix matrix definitions before measurement and compare matched-incidence controls.
  target_complexity:
