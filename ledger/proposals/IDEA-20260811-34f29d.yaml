idea:
  id: IDEA-20260811-34f29d
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  title: >-
    IS THE DEGENERATION GEOMETRIC OR ONLY COMBINATORIAL? Measure the SINGULAR
    LOCUS of the Semaev hypersurface S_m = 0 at each of the eight j-line
    degeneration loci - dimension and degree of Sing(V(S_m)), computed on the
    UN-HOMOGENISED ideal and reported separately from the homogenised one per
    CORR-20260810-eb9062 - with the pre-registered split that j = 0 and j = 1728
    DO acquire extra singularities (the fixed loci of their mu_r actions) while
    the six weight-12 loci do NOT; a contract deliberately built to be
    dispatchable on the current host, because msolve supplies both dimension and
    degree and no minimal free resolution is required
  class: measurement

  object: >-
    OBJ-SING, the singular locus of the Semaev hypersurface as a function on the
    j-line - specifically dim Sing(V(S_m)) and deg Sing(V(S_m)) for the affine
    ideal generated by S_m and all its partial derivatives, with no factor-base
    membership polynomials. This is a GEOMETRIC object: unlike support it is
    invariant under any linear change of coordinates, and unlike factorisation
    type it is defined even when the polynomial is irreducible. It is the third
    and last of the coefficient-value functionals that the Newton polytope cannot
    see.

  resource: >-
    R1 and R2. H-ENDO-001 admissibility: no endomorphism acts on any point of G;
    the object is a property of a hypersurface in affine m-space.

  claim: >-
    (A) THE DISCRIMINATION THIS RECORD PERFORMS. There are two competing
    explanations for the eight degeneration loci and no record in the campaign
    distinguishes them.
      EXPLANATION 1 - COORDINATE ACCIDENT. The loci are artifacts of the short
        Weierstrass coordinates (a, b): whole blocks of coefficients happen to
        share a weighted factor, the polynomial's intrinsic geometry is
        unchanged, and a different model of the same curve would show a different
        (or no) degeneration.
      EXPLANATION 2 - GEOMETRIC DEGENERATION. At those j the Semaev hypersurface
        genuinely becomes more singular, its intrinsic invariants move, and any
        model would see it.
    Singular-locus dimension and degree are model-INDEPENDENT up to the
    isomorphism class of the hypersurface, so they discriminate directly.
    (B) THE PRE-REGISTERED SPLIT PREDICTION, WHICH IS THE CONTENT. j = 0 and
    j = 1728 carry genuine diagonal group actions on the Semaev variables - the
    mu_3 relative invariance at a = 0 and the sign invariance at b = 0, both
    derived with biconditionals in IDEA-20260807-5ddccf claim (A). A variety
    invariant under a finite group action typically acquires singularities along
    the fixed loci of that action. PREDICTION P1: dim Sing(V(S_3)) is strictly
    larger at a = 0 than generically, or the degree strictly larger at equal
    dimension. PREDICTION P2: at the six weight-12 loci, which carry NO known
    group action, both dimension and degree are UNCHANGED from generic. The
    split is the prediction; either half failing is informative and neither is a
    shrug. If P1 fails, the group action is geometrically inert and Explanation 1
    is strengthened for the CM points too. If P2 fails, the weight-12 loci are
    genuinely geometric and the campaign has a real structural object.
    (C) WHY THIS CONTRACT IS DISPATCHABLE AND ITS PREDECESSOR WAS NOT.
    EXP-ICINV-e0cd8f terminated at SR3 because graded Betti numbers have NO
    independent engine on the host (DEC-20260810-d70ece D1), and that single fact
    made its cross-check criterion unmeetable. THIS RECORD ASKS FOR NO BETTI
    TABLE AND NO MINIMAL FREE RESOLUTION. The same decision records the
    correction that msolve 0.9.5 with `-g 2` prints the full reduced grevlex
    Groebner basis, from whose staircase both DIMENSION and DEGREE follow - the
    validator demonstrated exactly that on (a,b) = (441, 294), obtaining affine
    dimension 0 and degree 6 in agreement with Sage's vector_space_dimension with
    no Sage in the path. So the independent cross-check this record needs
    provably exists on the host, and the record is scoped to precisely the
    metrics that survive the D1 stop. That scoping is deliberate and is the
    successor route DEC-20260810-d70ece NA4 named without selecting.
    (D) THE MANDATORY CORRECTION IT CARRIES. CORR-20260810-eb9062 requires the
    singular locus to be computed on the UN-HOMOGENISED ideal and the affine and
    homogenised values reported DISTINCTLY and both labelled. This record adopts
    that as a blocking contract requirement rather than a note, because a
    dimension computed after homogenisation with respect to x0 differs from the
    affine one by construction and a table mixing the two is uninterpretable.

  mechanism: >-
    Sing(V(S_m)) is cut out by S_m together with its m partial derivatives.
    Specialising the coefficients to a locus can enlarge that ideal's zero set in
    two ways: by making a partial derivative vanish identically on a component
    (which is what a group action tends to do along its fixed locus), or by
    creating a coincidence among the derivative equations. Neither is implied by
    coefficient vanishing per se, which is why P2 predicts no change; both are
    implied by a fixed-point locus of a linear action preserving the
    hypersurface, which is why P1 predicts a change at the two CM points. The
    experiment separates a group-theoretic mechanism from a combinatorial one.

  novelty_status: adaptation
  novelty_note: >-
    Singular loci of Semaev varieties are among the four PRIMARY invariant
    families of the already-frozen EXP-ICINV-e0cd8f contract, which never
    computed them - ideals_built 0, resolutions_computed 0 (EV-ICINV-6b6264). The
    ADAPTATION is (i) stratifying by the j-line degeneration divisor rather than
    by the isogeny class, and (ii) restricting the metric set so the contract is
    executable on the current host. Corpus grep: no computed singular-locus value
    exists anywhere in the ledger; the only related datum is the five-curve
    capability probe recorded as NON-EVIDENCE. External literature NOT checked.
  not_a_duplicate_of: >-
    NOT EXP-ICINV-e0cd8f and not a re-run of it: that contract asks whether
    Semaev invariants are constant across an ISOGENY CLASS at fixed p; this asks
    whether they move along the J-LINE at fixed everything else. Those are
    different independent variables and the twist collision (same j, different
    class) shows they cannot substitute for one another. It also asks for a
    strictly smaller metric set and is therefore not a loosened version of a
    frozen contract - it is a different question, which is what NA4 requires of a
    successor. NOT IDEA-20260811-6034d0, which measures factorisation type; a
    variety can be irreducible and singular, or reducible and smooth away from
    the intersection, so the two functionals are independent.

  assumptions:
  - >-
    The degeneration loci are as catalogued in IDEA-20260811-a7c1df; re-derived
    as gate 1.
  - >-
    msolve on the host supplies dimension and degree by staircase
    post-processing, as demonstrated by VAL-20260810-dc8bd8. THE CONTRACT MUST
    RE-PROBE THIS rather than assume it, and record the exact version in a fresh
    backend-provenance file; the previous run's provenance file is known to carry
    an over-broad coverage classification that DEC-20260810-d70ece corrects.
  - >-
    The ideal is built without f_V, so that the object is a functional of the
    curve rather than of |V| (MATCHED-ORDER-DESIGN.md section 2).

  proof_search_map:
    bottleneck: >-
      The bottleneck is the geometric-versus-combinatorial ambiguity: without a
      model-independent invariant, no amount of support data can decide whether
      the degeneration is real. dim and deg of Sing are the cheapest such
      invariants available on this host.
    baseline_embedding:
      parameter_slice: >-
        The generic curve at p = 4001 is the baseline slice, and the specific
        fixture is the validator's own demonstration: for the f_V-free Jacobian
        ideal at (a,b) = (441, 294), msolve returned the reduced grevlex basis
        [x1 + x2 + x3, x2^2 + x2 x3 + x3^2 + 441, x3^3 + 441 x3 + 294], giving
        affine dimension 0 and degree 6.
      reproduction_check: >-
        The pipeline must reproduce dimension 0 and degree 6 on that exact curve,
        in both engines, before any other curve is computed. This is a frozen
        regression fixture drawn from a committed review artifact, not a curve
        chosen by this record.
    observation_collision:
      observable: The pair (dim Sing, deg Sing) of the affine Jacobian ideal.
      distinct_preimage_search: >-
        PERFORMED AND POSITIVE. Twists share j and therefore share the whole
        hypersurface up to the weighted substitution, so (dim, deg) collides
        across classes exactly as support does. THE SEPARATING CONDITION: this
        record makes no class claim. It also collides trivially across all
        generic curves, which is the null prediction and is what makes a
        difference at a locus meaningful.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: >-
        Report the full Hilbert series of the Jacobian ideal rather than only
        (dim, deg). The Hilbert series is determined by the initial ideal, so it
        IS obtainable from a Groebner basis on this host - unlike graded Betti
        numbers, which are not determined by the initial ideal and are exactly
        why the predecessor stopped. This is a strict strengthening at no
        infrastructure cost, and identifying it is the record's main technical
        contribution to executability.
      predicted_gain: >-
        Recovers most of the discriminating power the Betti table would have
        given, on metrics two independent engines on this host can both produce.
    quantifier_order: >-
      FOR ALL of the six weight-12 loci, (dim Sing, deg Sing) equals its generic
      value; THERE EXIST two loci (a = 0 and b = 0) where it differs. Note this
      is an existential in the SAME statement as a universal, which is unusual
      and is deliberate: a prediction that splits the eight loci into two named
      groups is far more falsifiable than a uniform prediction, because it can
      fail in two independent ways.
    method_ceiling:
      strongest_certifiable_claim: >-
        A dimension/degree/Hilbert-series table for the f_V-free Jacobian ideal
        at eight loci and a generic control, at two primes, cross-checked in two
        engines. It CANNOT certify a solving-cost consequence, and it cannot
        certify anything about the deployed f_V-bearing system.
      nearby_object_control: >-
        The nearby object where the desired conclusion fails is a curve with a
        DIFFERENT model of the same j - see IDEA-20260811-d7856a. If the singular
        locus moves at a locus in Weierstrass coordinates but not in Montgomery
        coordinates for the same curve, the effect was a coordinate artifact and
        the method has not identified intrinsic structure. That pairing is the
        method's ceiling test and the two records are designed to be read
        together.
    proof_obligations:
    - claim: The baseline fixture reproduces dimension 0 and degree 6
      responsibility: baseline
    - claim: dim and deg are unchanged at the six weight-12 loci
      responsibility: correctness
    - claim: dim or deg changes at a = 0 and at b = 0
      responsibility: feasibility
    - claim: Affine and homogenised values are reported distinctly
      responsibility: interface
    - claim: An independent engine confirms every value
      responsibility: correctness

  predictions:
  - metric: sing_dim_and_deg_at_the_six_weight12_loci
    direction: different
    minimum_effect: >-
      IDENTICAL to the generic values at all six, on both dimension and degree.
      Any single change is a pre-registered positive.
  - metric: sing_dim_or_deg_at_a_equals_0
    direction: different
    minimum_effect: >-
      STRICTLY different from generic - larger dimension, or equal dimension with
      strictly larger degree. No change here falsifies P1 and strengthens the
      coordinate-accident explanation for the CM points as well.
  - metric: sing_dim_or_deg_at_b_equals_0
    direction: different
    minimum_effect: >-
      STRICTLY different from generic, as for a = 0. The two CM points may differ
      from each other (the actions have orders 3 and 2 and are algebraically
      different situations, per IDEA-20260807-5ddccf) and that difference is
      itself reported.
  - metric: baseline_fixture_dimension_and_degree
    direction: different
    minimum_effect: >-
      EXACTLY 0 and 6 on (a,b) = (441, 294) at p = 4001, in both engines. Any
      other value blocks the run.
  - metric: engine_agreement_rate
    direction: different
    minimum_effect: >-
      100% of computed cells agree between the two engines. This is the criterion
      that the predecessor could not meet for Betti numbers and that this record
      is scoped to meet.

  minimal_test:
    design: >-
      (0) Fresh backend-provenance probe recording exact versions and
      demonstrating that the second engine independently produces dimension and
      degree. (1) Reproduce the frozen fixture (441, 294) -> (0, 6). (2) For
      m = 3 and, if budget allows, m = 4: build the AFFINE, f_V-free Jacobian
      ideal (S_m and its partials) for a generic curve, for a = 0, for b = 0, and
      for one curve on each of the six weight-12 loci, at p = 4001 and at one
      prime above 2^20. (3) Compute dimension, degree and Hilbert series in two
      engines. (4) Report affine and homogenised values in SEPARATE, LABELLED
      columns per CORR-20260810-eb9062. (5) Run the controls. (6) Report the
      eight-row table with the generic control row.
    controls:
    - >-
      C-FIXTURE (BLOCKING). The (441, 294) -> (0, 6) reproduction, from a
      committed review artifact.
    - >-
      C-NULL-LOCUS. Ten random weight-12 loci, identical pipeline. Predicted:
      generic (dim, deg) at all ten. If a random locus moves the singular locus,
      the specialisation procedure is at fault and every positive is void.
    - >-
      C-GAUGE. Recompute at (u^4 a, u^6 b) for seeded random u; the hypersurface
      transforms by the weighted substitution and (dim, deg) must be invariant.
      Implementation check only, per the committed C-GAUGE limit - it discharges
      "the code is right", never "the difference is real".
    - >-
      C-ORDER. Two monomial orders (degrevlex and lex or a second degrevlex with
      permuted variables). Dimension and degree are order-independent
      mathematically, so disagreement is an implementation error - a cheap and
      strong check that the predecessor also specified.
    - >-
      C-ENGINE. Every cell computed twice by engines sharing no code path. The
      contract must record that the Singular bundled inside SAGE_ROOT is a second
      CODE PATH and NOT a second BACKEND for anything Sage itself calls
      (DEC-20260810-d70ece D1), and must name which pair it used.
    required_metrics:
    - affine_sing_dimension_per_locus_per_m
    - affine_sing_degree_per_locus_per_m
    - homogenised_sing_dimension_and_degree_per_locus_labelled_separately
    - hilbert_series_of_the_jacobian_ideal_per_locus
    - fixture_reproduction_boolean
    - engine_and_order_agreement_counts
    - null_locus_values

  lossy_projection_answer: >-
    The projection is polynomial -> (dim Sing, deg Sing). It is severely lossy -
    two integers from a whole hypersurface - and it is compatible with the
    operations that matter: it is invariant under the gauge action (so it
    descends to the j-line) and under linear changes of coordinates (so it is not
    a coordinate artifact), which is exactly the property support LACKS and which
    is why this record can discriminate Explanation 1 from Explanation 2 where
    support cannot. THE COST-SIDE HONESTY: singular-locus dimension is a genuine
    input to solver behaviour - a positive-dimensional singular locus means the
    system is not a regular sequence, which changes the degree of regularity -
    but this record MEASURES NO TIME and claims no speedup. The committed j = 0
    lossy-projection failure is about a functional (support) whose relation to
    cost is combinatorial; the relation of Sing to solving degree is structural,
    but it is still not measured here, and the record refuses to assert it.

  t5_reachability_answer: >-
    Under P2 (the predicted null at the weight-12 loci) T5 is vacuous - there is
    no minimiser. Under a positive at a = 0 or b = 0, T4 answers it: you cannot
    walk to j = 0 unless the class has D_0 = -3, so the property is a
    curve-generation fact and not an attack, and any gain is charged against
    KN-TECH-018 where a factor at or below sqrt(6) is baseline calibration. Under
    a positive at a weight-12 locus, IDEA-20260811-3e08e0's census applies: at
    most twelve classes per p contain such a vertex, density Theta(1/p).

  null_object: >-
    C-NULL-LOCUS - ten random weight-12 loci of the same shape - plus the generic
    control row, plus C-GAUGE and C-ORDER as implementation nulls. NULL-C is not
    used and is not applicable: no permutation, no mean, no p-value appears in
    this design, so its committed disqualification for within-class contrasts
    does not arise.

  falsification_conditions:
  - >-
    C-FIXTURE does not reproduce (0, 6). The pipeline disagrees with a committed
    review computation and nothing is admissible.
  - >-
    P1 fails: neither dimension nor degree moves at a = 0 or b = 0. The group
    action is geometrically inert; the CM points' support drop is combinatorial
    only, which strengthens the coordinate-accident reading of the whole divisor.
    This is a clean, cheap, informative negative.
  - >-
    P2 fails: dimension or degree moves at a weight-12 locus. The six loci are
    geometric, not combinatorial, and the lane has a genuine structural object
    requiring its own contract.
  - >-
    A random locus in C-NULL-LOCUS moves the singular locus. Specialisation
    artifact; every positive is void.
  - >-
    Two engines or two monomial orders disagree on dimension or degree. Nothing
    is established until reconciled; an order-dependent dimension is an
    implementation error, never a result.
  - >-
    The second engine cannot be made to produce degree independently. The run
    terminates as failed_infrastructure and reports so - a repeat of the SR3
    outcome, which under AGENTS.md rule 5 is infrastructure signal and NEVER a
    statement that the invariants are constant.

  confounders:
  - >-
    Homogenisation. Affine and projective singular loci differ by the behaviour
    at infinity; mixing them produced the correction CORR-20260810-eb9062 and is
    a blocking contract requirement here.
  - >-
    Non-radical ideals. If the Jacobian ideal is non-radical, degree computed as
    vector-space dimension counts multiplicity; the contract must state which
    convention it reports and use one.
  - >-
    Characteristic. Partial derivatives behave differently in small
    characteristic (p = 3 kills the derivative of x^3); p = 4001 is safe but the
    contract must exclude p in {2, 3} explicitly.
  - >-
    The m = 4 arm may exceed budget. A budget stop is an infrastructure receipt
    and never a negative; the contract declares the m = 3 arm as the deliverable
    and m = 4 as a stretch.

  interpretation_limits:
  - >-
    A j-line result, colliding on twists, therefore carrying no isogeny-class
    information in either direction.
  - >-
    f_V-free formulation only; non-transferable to the deployed system by the
    same argument that makes it a curve functional at all.
  - >-
    claim_tier toy. No attack, no exponent, no speedup, sota_delta zero.

  heuristic_assumptions:
  - id: H1
    statement: >-
      Dimension and degree of the Jacobian ideal are exactly recoverable from the
      staircase of a reduced Groebner basis in any degrevlex order, so an engine
      that computes a Groebner basis computes both.
    rigorous_support: >-
      Standard: dimension and degree are determined by the initial ideal. The
      campaign has a committed demonstration on a specific curve
      (VAL-20260810-dc8bd8, adopted as a correction in DEC-20260810-d70ece). This
      is a theorem plus a verified instance, not a heuristic, and it is recorded
      here as the reason the contract is executable.
    validation_plan: >-
      Re-demonstrate on the frozen fixture in the fresh probe, then confirm
      agreement between the two engines on all cells. No distribution comparison
      applies; the tail check is the C-ORDER arm, since an order-dependent answer
      would expose a staircase bug.
  - id: H2
    statement: >-
      A finite linear group action preserving a hypersurface produces
      singularities along its fixed locus with high probability for a
      non-degenerate invariant.
    rigorous_support: >-
      The mu_3 and sign invariances at a = 0 and b = 0 are derived with
      biconditionals in IDEA-20260807-5ddccf. The step from invariance to
      singularity is classical intuition about quotient singularities and is NOT
      a theorem in this setting; it is labelled heuristic and it is the basis of
      P1 only, never of P2.
    validation_plan: >-
      Direct exact computation at a = 0 and b = 0. There is no distribution to
      compare; H2 is recorded so that a failure of P1 is read as refuting H2
      rather than as refuting the instrument.

  target_complexity:
    time_exponent: NONE CLAIMED.
    memory_exponent: NONE CLAIMED.
    best_known: >-
      0.886*sqrt(N) group operations, O(1) memory (KN-TECH-001, KN-TECH-006);
      automorphism-discounted variant (KN-TECH-018).
    hidden_overhead: Not applicable.
    tradeoff_note: >-
      Not applicable to a claim. Operationally, the m = 4 Jacobian ideal is the
      memory risk and the contract caps it.

  dominated_by: >-
    Every row of the attack frontier dominates - parallel rho with distinguished
    points, BSGS, kangaroo, index calculus - checked against each; no solver is
    produced.
  sota_delta: ZERO on every axis.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  expected_value: >-
    MEDIUM-HIGH. Its unique value is that it is the ONLY model-independent
    discriminator between the coordinate-accident and geometric readings of the
    whole degeneration divisor, and it is scoped precisely to the metrics that
    the host can actually cross-check - which makes it the concrete form of the
    successor DEC-20260810-d70ece NA4 named but did not select. Its risk is that
    the m = 4 arm is expensive and the m = 3 arm can only see j = 0 and j = 1728,
    since the weight-12 loci first appear at m = 4; the contract therefore
    declares m = 3 as the CM-point deliverable and m = 4 as the weight-12
    deliverable, and a budget stop on the latter loses P2 but not P1.
