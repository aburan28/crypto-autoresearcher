    - metric: >-
        empirical distribution of (chi(d), chi(1 - d)) over 10^4 uniformly
        random d at p = 2^222 - 117, null control, instrument only
      direction: different
      minimum_effect: >-
        PREDICTED approximately uniform over the four sign patterns, each near
        0.25 with 3-sigma half-width about 0.013. THE DISCRIMINATOR AND ITS
