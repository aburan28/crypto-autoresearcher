  proof_search_map:
    bottleneck: >-
      Obtaining v_2(#E) and v_2(#E^t) for an Edwards curve without point
      counting AND without a model conversion whose exceptional set has never
      been audited. IDEA-20260829-d052e6 removes the first half of that
      bottleneck for Montgomery rows and explicitly leaves both the Edwards
      conversion and the p = 3 mod 4 twist statement standing. Removing the
      remainder is what converts six transcribed cofactor pairs into six
      derived ones and, more importantly, converts an eleven-row table into a
      law.
    baseline_embedding:
      parameter_slice: >-
        At the point where chi(d) = -1 and after birational conversion, this
        instrument must AGREE with IDEA-20260829-d052e6's Montgomery
        instrument on the same curve, since C1 shows the two live on the same
        A. The exact boundary is - convert E-222 to (A, B) with
        A = 2(1 + d)/(1 - d) and B = 4/(1 - d), run d052e6's depth-0 stage,
        and require chi(A^2 - 4) to equal chi(d) as an identity in F_p, not
        merely to agree in sign by luck.
      reproduction_check: >-
        A frozen regression fixture asserting bit-identical equality of the
        field elements A^2 - 4 and 16 d (1 - d)^{-2} at 222 bits, and
        agreement of the two instruments' 8-divisibility verdicts, run before
        any deeper claim is trusted. Plus, at toy scale, exact agreement of
        the whole instrument with brute-force point counting on every
        admissible d.
    observation_collision:
      observable: >-
        The symbol pair S(E_d) = (chi(d), chi(1 - d)), which is the
        certificate carrying every conclusion, so its identifiability is what
        must be attacked first.
      distinct_preimage_search: >-
        REQUIRED, AND IT IS A CENTRAL EXPERIMENT, NOT AN AFTERTHOUGHT. Search
        exhaustively at toy p for two parameters d and d' over the SAME p with
        S(E_d) equal to S(E_{d'}) but v_2(#E_d) different from v_2(#E_{d'}).
        PRE-REGISTERED PREDICTION, STATED WITH ITS TWO MEANINGS. Collisions
        are PREDICTED TO EXIST in abundance whenever both members have
        chi(1 - d) = +1, because the pair distinguishes only v_2 = 2 from
        v_2 at least 3 and cannot separate 3 from 4 - that is the object's
        declared reach and finding such pairs CONFIRMS the stated ceiling.
        Collisions are PREDICTED ABSENT between the chi(1 - d) = -1 class and
        any curve with v_2 at least 3. A single counterexample in that
        direction REFUTES C2, which is a theorem, so it would prove instead
        that the derivation above contains an algebra error - and the census
        is designed to find that error cheaply rather than to confirm the
        derivation.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the question "what is the 2-adic valuation of this
          222-bit Edwards curve's group order", which as posed requires point
          counting or an unaudited model conversion, by the question "what is
          the sign of chi(1 - d) for a 20-bit integer d", which is one
          Legendre symbol.
        predicted_gain: >-
          v_2 at 222 bits in one modular exponentiation, microseconds, with no
          model conversion at all, instead of an SEA point count that is
          infeasible in this environment. The encoding, completeness and
          soundness obligations are listed separately below.
      - transform: stronger_invariant
        proposed_object: >-
          Carry s = 1 + v_2(p + 1) alongside the valuation instead of
          discarding the modulus after reduction. s is free, is a property of
          the FIELD rather than the curve, and is what turns a per-curve
          measurement into the family partition of C4.
        predicted_gain: >-
          A prediction about eleven published rows from one integer per row,
          which no per-curve instrument can produce, and which is falsifiable
          against data already in the repository at zero compute cost.
    quantifier_order: >-
      C1 IS CLAIMED UNIFORMLY. FOR ALL odd primes p and FOR ALL d in F_p with
      d not in {0, 1}, chi(A^2 - 4) = chi(d) where A = 2(1 + d)/(1 - d).
      C2 IS CLAIMED UNIFORMLY BUT CONDITIONALLY. FOR ALL odd p and FOR ALL d
      with chi(d) = -1, v_2(#E_d) is at least 3 IF AND ONLY IF
      chi(1 - d) = +1. The restriction to chi(d) = -1 is a genuine restriction
      and is stated up front rather than discovered later; it is exactly the
      completeness hypothesis.
      C3 IS CLAIMED UNIFORMLY. FOR ALL odd p and FOR ALL elliptic curves E
      over F_p, if v_2(#E) is less than v_2(2p + 2) then
      v_2(#E^t) = v_2(#E). No witness depends on the instance and no Edwards
      or Montgomery hypothesis is used at all.
      C4 IS CLAIMED EXISTENTIALLY AND OVER A FINITE SET. FOR THE ELEVEN rows
      the mirror marks complete, the published cofactor pair is consistent
      with C3. NOT CLAIMED - for all curves, for all SafeCurves rows, or for
      any row whose parameters could not be cross-checked.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For this (p, d) the curve is complete or is not, v_2(#E) equals 2 or
        is at least 3, and if it is less than s then v_2(#E^t) equals it -
        certified by two Legendre symbols and one integer valuation." It
        certifies NOTHING about the odd part, nothing about the primality of
        l, nothing about the rho cost, nothing about the ECDLP, and - the
        sharp limit - it CANNOT distinguish v_2 = 3 from v_2 = 4. A curve
        whose published cofactor is 2^3 is therefore only PARTIALLY certified
        by this record and needs IDEA-20260829-b130bb's depth-2 extension.
      nearby_object_control: >-
        THE NON-COMPLETE ROWS ARE THE REFUSAL CONTROL AND THEY ARE SHARP. The
        mirror marks nine rows with zero points of order 2 - Anomalous, NIST
        P-224, BN(2,254), brainpoolP256t1, ANSSI FRP256v1, NIST P-256,
        secp256k1, brainpoolP384t1 and NIST P-384. For these the Edwards model
        does not apply at all and the instrument must REFUSE rather than
        return a number. An instrument that emits "complete" or a valuation
        for NIST P-256 has not identified the load-bearing structure and is
        void. SECOND NEARBY OBJECT, PARAMETER-MATCHED AND MUCH SHARPER -
        d' = 160102 + k over the SAME p = 2^222 - 117, for the smallest k
        making chi(d') = +1. It differs from E-222 in one small integer,
        shares the field, the model and the code path, and the instrument must
        report it NOT complete and must refuse C2 for it. A pair of parameters
        one integer apart with opposite verdicts is the cheapest possible
        demonstration that the instrument is reading d and not reading p.
    proof_obligations:
      - claim: >-
          A^2 - 4 = 16 d (1 - d)^{-2} identically in F_p for
          A = 2(1 + d)/(1 - d), hence chi(A^2 - 4) = chi(d).
        responsibility: correctness
      - claim: >-
          2(1, 0) = (0, -1) and (0, -1) has order 2 under the Edwards addition
          law, so 4 divides the affine order for every d not in {0, 1}.
        responsibility: correctness
      - claim: >-
          The solutions of 2(x, y) = (1, 0) are exactly y = x with
          d x^4 - 2 x^2 + 1 = 0, and the two roots in x^2 have product 1/d.
        responsibility: correctness
      - claim: >-
          Given chi(d) = -1, exactly one root is a square, hence (1, 0) is
          halvable iff chi(1 - d) = +1, hence v_2 at least 3 iff
          chi(1 - d) = +1.
        responsibility: strictness
      - claim: >-
          Halvability of the order-4 point in E(F_p) is equivalent to
          8 dividing #E when the 2-Sylow is cyclic, because the odd part is
          entirely contained in 2 E(F_p).
        responsibility: correctness
      - claim: >-
          The trichotomy on (a, b, s) from #E + #E^t = 2p + 2 is exhaustive
          and the contrapositive "a less than s implies b = a" follows.
        responsibility: strictness
      - claim: >-
          The toy census is EXHAUSTIVE over admissible d, not a sample, at
          each size where exhaustiveness is claimed.
        responsibility: scope
      - claim: >-
          The emitted certificate is verifiable by a second implementation in
          two modular exponentiations using only (p, d).
        responsibility: interface
      - claim: >-
          Correctness of the instrument at 222 bits given validation at 13 to
          20 bits.
        responsibility: success_probability
    not_applicable_reason: null

  predictions:
    - metric: >-
        fraction of admissible d at toy p with chi(d) = -1 for which
        chi(1 - d) = +1 agrees with the brute-force test v_2(#E_d) at least 3
      direction: higher
      minimum_effect: >-
        PREDICTED EXACTLY 1.000 - 100 percent, exhaustive census, zero
        exceptions permitted, both directions of the equivalence. Anything
        below 1.000 falsifies C2, which is presented as a theorem, so the
        derivation above contains an error and the 222-bit application is
        withdrawn until it is found.
    - metric: >-
        fraction of admissible d at toy p, BOTH branches of chi(d), for which
        chi(A^2 - 4) equals chi(d) after birational conversion
      direction: higher
      minimum_effect: >-
        PREDICTED EXACTLY 1.000 as a field identity, not a statistical
        agreement. A single mismatch means the conversion formula A =
        2(1 + d)/(1 - d) as implemented is wrong, which would also void every
        cross-model transfer in this campaign - a valuable negative.
    - metric: >-
        fraction of admissible d at toy p with v_2(#E_d) less than s for which
        the measured v_2(#E_d^t) equals v_2(#E_d)
      direction: higher
      minimum_effect: >-
        PREDICTED EXACTLY 1.000, on BOTH residue classes of p mod 4 and on
        BOTH branches of chi(d), since C3 uses no curve hypothesis at all.
        This is the strongest single prediction in the record because C3 is
        claimed for every elliptic curve over every odd prime field.
    - metric: 'chi(160102) for p = 2^222 - 117'
      direction: different
      minimum_effect: >-
        PREDICTED -1, that is E-222 IS complete, matching the mirror's
        complete cell and its count of exactly one point of order 2. A value
        of +1 would contradict a retrieved SafeCurves table cell and is a
        material discrepancy - halt, re-read the mirror HTML, re-check the
        modulus, and do not report.
    - metric: 'chi(1 - 160102) = chi(-160101) for p = 2^222 - 117'
      direction: different
      minimum_effect: >-
        PREDICTED -1, hence v_2(#E) = 2 EXACTLY, hence cofactor 2-part exactly
        4, matching the mirror's published cofactor 2^2 for E-222. A value of
        +1 would predict v_2 at least 3 and CONTRADICT the published cofactor;
        halt and escalate, treating a transcription or algebra error as
        overwhelmingly the likelier explanation.
    - metric: 's = 1 + v_2(p + 1) for p = 2^222 - 117, and the derived v_2(#E^t)'
      direction: different
      minimum_effect: >-
        PREDICTED s = 3 and hence, since v_2(#E) = 2 is less than 3,
        v_2(#E^t) = 2 EXACTLY - twist cofactor 2-part exactly 4, DERIVED and
        not read. The mirror publishes twist cofactor 2^2 for E-222 and that
        is the prediction target, not the input.
    - metric: >-
        number of the eleven complete SafeCurves rows whose published
        (cofactor, twist cofactor) 2-parts are consistent with C3 given the
        row's own s
      direction: higher
      minimum_effect: >-
        PREDICTED EXACTLY 11 of 11. Derived by hand in this record and to be
        re-derived by the executor - the five mismatched rows M-221,
        Curve25519, M-383, Curve383187 and M-511 are predicted to have
        p = 1 mod 4 and hence s = 2, putting them in the a greater than s
        branch where b = s = 2 is FORCED; the six matched rows are predicted
        to have p = 3 mod 4 and a less than s, where b = a is FORCED. A single
        inconsistent row refutes a theorem and therefore proves a
        mis-transcription in the mirror or in the intake, which must then be
        localised.
    - metric: >-
        number of the nine non-complete SafeCurves rows for which the
        instrument returns a verdict rather than an explicit REFUSAL
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 0. A single verdict on a Weierstrass row means the
