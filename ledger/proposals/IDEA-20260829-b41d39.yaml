  minimal_test:
    design: >-
      STAGE 0, zero compute, hours of thought, AND IT IS THE CHEAPEST POSSIBLE
      FALSIFICATION. Re-derive C1, C2 and C3 symbolically and write them out
      as a derivation note. C1 is a two-line algebraic identity, C2 is a
      quartic solved by hand, C3 is a three-case argument on 2-adic
      valuations. A failure at this stage costs no machine time at all and
      kills the record.
      STAGE 1, THE CHEAPEST VALID DISCRIMINATOR WITH COMPUTE, minutes, and it
      alone settles the instrument. EXHAUSTIVE CENSUS at four primes near 2^13
      to 2^15, at least two congruent to 3 mod 4 and at least one congruent to
      1 mod 4, and at least one with v_2(p + 1) at least 3 so that s varies.
      For EVERY d in F_p with d not in {0, 1}, count the affine points of E_d
      by direct enumeration, count the twist, compute (a, b) and s, and
      compare against (chi(d), chi(1 - d)). Report agreement fractions
      SEPARATELY for the chi(d) = -1 and chi(d) = +1 branches and separately
      per residue class of p mod 4. Exhibit any collision pair found.
      STAGE 2, seconds. Apply the frozen instrument to
      (p = 2^222 - 117, d = 160102) and emit the certificate - the two
      symbols, s, v_2(#E), v_2(#E^t), and the completeness verdict.
      STAGE 3, seconds. THE ELEVEN-ROW FAMILY SWEEP against the mirror's
      cofactor table, plus the nine-row refusal sweep.
      STAGE 4, minutes. The null control - 10^4 random d at the real p.
    controls:
      - >-
        POSITIVE, BLOCKING, AND IT IS THE CONTROL THIS FAMILY HAS NEVER HAD -
        Curve41417 is the ONLY one of the eleven complete rows whose published
        cofactor is 2^3, so it is the ONLY row on which chi(1 - d) must return
        +1. An instrument that returns -1 on all eleven rows would agree with
        ten of them and be undetectably broken from those ten alone. The
        Curve41417 row is therefore a BLOCKING positive control for this
        record even though it belongs to a sibling question, and the sweep
        must run it.
      - >-
        POSITIVE, SAME-p, NEEDING NO POINT COUNT AND NO EXTERNAL DATA -
        d' = k^2 for a random k at p = 2^222 - 117, which makes chi(d') = +1
        BY CONSTRUCTION. The instrument must report NOT complete and must
        refuse C2. This is a genuine parameter-matched positive control at the
        real prime for the completeness branch.
      - >-
        NEGATIVE, PARAMETER-MATCHED - d' = 160102 + k for the smallest k with
        chi(d') = +1, over the same p, same model, identical code path, same
        order of magnitude. Predicted NOT complete.
      - >-
        REFUSAL CONTROL - the nine non-complete SafeCurves rows, which are
        Weierstrass and have no Edwards parameter d. The instrument must
        refuse, and must say why, and must not silently coerce.
      - >-
        NULL, SAME SHAPE - 10^4 uniformly random d at the real p through the
        identical code path for the symbol distribution; and separately 10^4
        random 222-bit odd integers fed to the Legendre routine, whose symbol
        distribution must be 0.5 plus or minus 0.005 at 3 sigma. A symbol
        routine returning all +1 or all -1 is broken and voids everything.
      - >-
        CROSS-IMPLEMENTATION - every Legendre symbol computed twice, once by
        Euler's criterion via pow(x, (p-1)//2, p) and once by the binary
        Jacobi-symbol recursion. Disagreement on any input voids the run.
      - >-
        CROSS-MODEL - for every toy curve, the Montgomery instrument of
        IDEA-20260829-d052e6 run on the converted (A, B) and required to agree
        on v_2. Disagreement localises the defect to the conversion, which is
        exactly the open item IDEA-20260829-a40979 exists to close.
    required_metrics:
      - 'per toy p, agreement fraction for C2, split by the chi(d) branch'
      - 'per toy p, agreement fraction for C1 as a field identity'
      - 'per toy p, agreement fraction for C3, split by p mod 4 and by whether a is less than s'
      - 'the exhibited collision pairs with equal symbol pair and unequal v_2'
      - 'for E-222, chi(d), chi(1 - d), s, v_2(#E), v_2(#E^t), completeness verdict'
      - 'for all eleven complete rows, s and the predicted versus published cofactor 2-parts'
      - 'per non-complete row, explicit REFUSAL with reason'
      - 'the null distribution of the symbol pair over 10^4 random d at the real p'
      - 'wall-clock per stage, and the exact subsample seeds where sampling was used'
      - 'the sha256 of every mirror file read, compared against source_record_addendum_01.yaml'

  falsification_conditions:
    - >-
      Any d in the chi(d) = -1 branch of the exhaustive toy census whose
      chi(1 - d) verdict disagrees with the brute-force test for 8 dividing
      #E_d. C2 is refuted as stated, the 222-bit application is withdrawn, the
      algebra is re-derived, and the counterexample is reported as a
      refutation artifact per docs/claims-and-verification.md.
    - >-
      Any toy curve where chi(A^2 - 4) differs from chi(d). C1 is refuted or
      the conversion is mis-implemented; either way every cross-model claim in
      this campaign is suspended until it is resolved.
    - >-
      Any curve in the census with a less than s and b not equal to a. C3 is
      an unconditional theorem about all elliptic curves, so this outcome
      means the point counter, the twist construction, or the valuation code
      is wrong. Halt and fix; it cannot be a property of a real curve.
    - >-
      chi(160102) = +1 at p = 2^222 - 117. E-222 is NOT complete, which
      contradicts a retrieved SafeCurves table cell. Halt, re-read the raw
      HTML rather than the tsv, re-check the modulus and the sign of d, and
      escalate before anything leaves the repository.
    - >-
      chi(-160101) = +1 at p = 2^222 - 117. This predicts v_2(#E) at least 3
      and CONTRADICTS the mirror's published cofactor 2^2 for E-222; a
      transcription or algebra error is far likelier than a finding and must
      be excluded first.
    - >-
      Any of the eleven complete rows inconsistent with C3 given its own s.
      Since C3 is a theorem, this proves a mis-transcription and the specific
      row and field must be localised before any family-level statement is
      made.
    - >-
      Any disagreement between the two independent Legendre implementations,
      or a null symbol distribution outside 0.5 plus or minus 0.005 at
      3 sigma. Implementation failure; nothing is reported.
    - >-
      The instrument returns a verdict for any of the nine non-complete rows.
      Refusal control failed; the whole family sweep is void.

  confounders:
    - >-
      AFFINE ORDER VERSUS GROUP ORDER. For d a NON-SQUARE the affine Edwards
      points are the whole group and #E_d is the elliptic curve group order.
      For d a SQUARE the projective closure has singular points and the affine
      count differs from the smooth model's order - by 4 in the standard
      analysis. Every count in the chi(d) = +1 branch of the census must state
      which number it is reporting, or the branch comparison is meaningless.
      This is the single most likely way for the census to produce a spurious
      disagreement, and it is the reason IDEA-20260829-a40979 is a sibling and
      not an afterthought.
    - >-
      WHICH CURVE IS THE TWIST. The Montgomery model of E_d has B = 4/(1 - d),
      so E_d is isomorphic to the B = 1 curve when chi(1 - d) = +1 and to its
      quadratic TWIST when chi(1 - d) = -1. Any record that computes on the
      B = 1 Montgomery curve and reports the answer as E_d's has a fifty
      percent chance of reporting the twist's valuation instead. C2 avoids
      this entirely by never leaving the Edwards model, and that is a
      substantive reason to prefer it, not a stylistic one.
    - >-
      WHICH COFACTOR. v_2 is a statement about #E, not about #E divided by the
      prime subgroup order l. "Cofactor 4" means v_2(#E) = 2 AND the odd part
      of #E divided by l equals 1; this instrument certifies only the first
      conjunct. The two coincide only if the odd part of #E is prime, which is
      a separate certificate this record does not supply.
    - >-
      TOY-SCALE ANOMALY RATE. At p near 2^13 to 2^20 a randomly chosen curve
      hits degenerate conditions - anomalous, supersingular, tiny order - far
      more often than at 222 bits, as KN-TECH-033 states explicitly. The
      census must record how many toy curves are supersingular or anomalous
      and must not let those cases silently dominate an agreement statistic.
    - >-
      THE MIRROR IS NOT THE SITE. inputs/SAFECURVES-20260825/ is a repository
      snapshot with recorded hashes taken on an earlier date. Agreement with
      it is agreement with that snapshot. Its own addendum documents a real
      defect in the .txt renderings, which is direct evidence that derived
      views of it can mislead, and is why every table reading here comes from
      tables/*.tsv.
    - >-
      WEIL EQUIDISTRIBUTION MAKES THE SYMBOLS NEARLY UNINFORMATIVE IN
      ISOLATION. Each of the four sign patterns occurs for about a quarter of
      parameters, so a record that reports only "E-222 is complete with
      cofactor 4" has reported about two bits. The information is in the
      LAW - that the pattern is forced by the residue class of p across
      eleven rows - not in any single curve's two bits.

  interpretation_limits:
    - >-
      A 2-adic valuation is not a security statement. It bounds the largest
      power-of-two small-subgroup confinement available in a chosen-input
      oracle model (KN-TECH-034, an ADJACENT-MODEL result), and it says
      nothing whatsoever about the ECDLP in the prime subgroup.
    - >-
      C1, C2 and C3 are proved; C4 is an empirical claim about eleven
      published rows, and the instrument is validated at 13 to 20 bits and
      applied at 222 bits. The transfer assumption is correctness-only and is
      heuristic H2 below; cost does not transfer and no cost claim is made.
    - >-
      THE INSTRUMENT CANNOT SEPARATE v_2 = 3 FROM v_2 = 4 OR HIGHER. On the
      chi(1 - d) = +1 branch it certifies only "at least 3". For Curve41417,
      the one complete row where that branch fires, the exact value requires
      the depth-2 extension of IDEA-20260829-b130bb, and until that exists the
      Curve41417 cofactor remains partially derived.
    - >-
      TRANSFER TO THE OTHER 19 CURVES, STATED EXACTLY. (a) FULL TRANSFER of
      C1 and C2, same instrument, same branch, no change - the five other
      untwisted Edwards rows Curve1174, E-382, Curve41417, Ed448-Goldilocks
      and E-521, whose intake records all give the a = 1 form
      x^2 + y^2 = 1 + d x^2 y^2. Each needs only its own two symbols. (b) FULL
      TRANSFER of C3 to ALL TWENTY rows and indeed to every elliptic curve
      over every odd prime field, since C3 uses no model hypothesis; but its
      USEFULNESS depends on knowing a, which on the Montgomery rows M-221,
      M-383, Curve383187, M-511 and Curve25519 comes from
      IDEA-20260829-d052e6 and not from here. (c) NO TRANSFER of C2 to
      TWISTED Edwards curves with a not 1 - the quartic must be re-derived and
      the "product of roots equals 1/d" step, which is where completeness
      enters, will change. (d) NO TRANSFER AT ALL to the nine Weierstrass
      rows for C1 or C2, where the instrument refuses. (e) NO TRANSFER to any
      claim about the odd part, on any curve.
    - >-
      The instrument REFUSING to answer is a legitimate and informative output
      and must be recorded as a refusal, never as a pass.
    - >-
      Nothing here adjudicates any SafeCurves criterion cell. What it does is
      make the `complete` cell mechanically CHECKABLE for six rows and make
      the `twist` cofactor derivable rather than transcribed for eleven,
      subject to the claim boundaries of the question record.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For p an odd prime and d drawn uniformly from F_p minus {0, 1}, the
        pair (chi(d), chi(1 - d)) is uniformly distributed over its four sign
        patterns up to an error O(p^{-1/2}); consequently, conditioned on the
        rigorous floor v_2 at least 2 established by C2's order-4 point, the
        excess valuation v_2(#E_d) - 2 is geometric with ratio one half up to
        o(1), as it would be for the 2-part of a uniformly random integer in
        the Hasse interval conditioned on divisibility by 4.
      rigorous_support: >-
        Two rigorous halves and one modelled half, separated explicitly.
        (i) The FLOOR v_2 at least 2 is proved unconditionally by C2's
        order-4 point and is not assumed. (ii) The uniformity of the PAIR
        (chi(d), chi(1 - d)) is a THEOREM, not a heuristic - it is Weil's
        bound applied to the character sum over d of chi(d) chi(1 - d), whose
        absolute value is at most 2 sqrt(p), giving each pattern density
        1/4 + O(p^{-1/2}). So the first level of the geometric prediction,
        P(v_2 = 2) near 1/2, is RIGOROUS. (iii) Only the DEEPER levels are
        modelled, and the classical statement being imitated is the
        Cohen-Lenstra and Gekeler-style heuristic that the group structure of
        E(F_p) for varying E behaves like a random abelian group of its order,
        restricted to the 2-part. That heuristic is notoriously easier to
        state than to prove, and that difficulty is recorded here rather than
        hidden.
      validation_plan: >-
        SAMPLING - the exhaustive toy census of Stage 1 gives the EXACT
        distribution of v_2 over all admissible d at four primes near 2^13 to
        2^15, a complete population rather than a sample, plus a 10^4 random
        subsample at p near 2^17 to 2^20 and a 10^4 random subsample at the
        real 222-bit prime for the symbol pair only. SCALE AND PARAMETERS
        RECORDED - the four primes, the population sizes, and every subsample
        seed. COMPARISON DISTRIBUTION - empirical CDF of v_2 - 2 against the
        geometric one-half CDF, by an exact chi-square goodness-of-fit test on
        bins j = 0, 1, 2, 3 and 4-or-more with expected counts stated in
        advance; and, separately, the four-pattern symbol frequencies against
        the RIGOROUS 1/4 plus or minus 2 p^{-1/2} interval, which is a
        two-sided check with a proved bound rather than a modelled one. TAIL
        CHECK - the largest v_2 observed in the census versus the predicted
        count p times 2^{-(j+1)}; a toy population of about 10^4 curves should
        contain roughly one curve with v_2 at least 15 and none with v_2 at
        least 20. TRANSFER - the distribution is validated at 13 to 20 bits
        and reported at 222 bits only as a NULL for interpreting E-222's
        pattern, never as a property of E-222.
    - id: H2
      statement: >-
        A symbol instrument whose output agrees with brute-force point
        counting on 100 percent of an exhaustive toy population at 13 to 20
        bits is CORRECT at 222 bits. Formally, the map from (p, d) to the
        symbol pair and its derived valuation has no size-dependent failure
        mode - word-size, overflow, modular-reduction, or exponent-range -
        that first appears above 20 bits.
      rigorous_support: >-
        NONE, and the record says so plainly. This is IDEA-20260829-d052e6's
        heuristic H2 and the archived audit plan's H4 inherited verbatim, and
        it is the weakest item in this proposal. Its only mitigation is that
        the underlying arithmetic is Python arbitrary-precision integers,
        where the classes of size-dependent bug that motivate the assumption
        are largely absent by construction, which is an argument about the
        implementation and not a proof about the mathematics. A SECOND and
        genuinely stronger mitigation is available HERE that is not available
        to d052e6 - C2's output is a single symbol, so the 222-bit computation
        is one modular exponentiation with no chain and no state, which is the
        smallest surface on which a size-dependent bug could hide anywhere in
        this campaign.
      validation_plan: >-
        Four partial checks, none of which discharges the assumption. (i) The
        SAME-p POSITIVE CONTROL d' = k^2 at the real 222-bit prime gives the
        instrument one 222-bit input whose completeness branch is known by
        construction. (ii) Cross-implementation agreement of every Legendre
        symbol between Euler's criterion and the binary Jacobi recursion, at
        222 bits, on 10^4 inputs. (iii) Agreement of the instrument's outputs
        with the mirror's independently transcribed cofactor cells on ELEVEN
        rows at 221 to 521 bits, which is eleven independent full-size
        consistency checks rather than one - note carefully that this is a
        CONSISTENCY check between a derivation and a transcription, so if they
        agree neither is thereby proved, and if they disagree at least one is
        wrong, which is the informative case. (iv) The field identity
        A^2 - 4 = 16 d (1 - d)^{-2} checked as an exact equality of field
        elements at 222 bits, which is a full-size algebraic self-test needing
        no external data at all.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. As an audit instrument, TWO modular
      exponentiations - O(log p) field multiplications, that is O(log^3 p) bit
      operations with schoolbook arithmetic - to decide completeness and to
      decide whether 8 divides #E; plus O(1) integer operations for s and for
      C3's forcing step. Concretely at 222 bits this is microseconds in
      Python. Verification of the emitted certificate by a second
      implementation is the same two exponentiations, so the certificate is
      genuinely succinct. NOTE that this is strictly cheaper than
      IDEA-20260829-d052e6's chain, which needs about a dozen exponentiations
      plus a model conversion, because the Edwards model exposes the answer at
      depth 1.
    memory_exponent: >-
      O(log p) working memory and O(log p) certificate size. The toy census
      needs O(p) time and O(1) memory per curve and O(p^2) total across all d
      at a given p, which at p near 2^15 is about 10^9 elementary steps -
      minutes across the 14 available cores and the only nontrivial compute in
      the proposal. The 48 GB envelope is not a binding constraint anywhere.
    best_known: >-
      The best known route to v_2(#E) for an arbitrary 222-bit curve is a full
      SEA point count, roughly O(log^8 p) bit operations with large constants,
      unavailable in this environment. The best known route INSIDE THIS
      PROGRAM as of this morning was a transcription; as of this session it is
      a transcription from a repository mirror of SafeCurves, which is faster
      than any computation and is exactly the deficiency this record addresses
      by replacing it with a derivation. Against the ECDLP attack frontier -
      rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006),
      automorphism-discounted rho (KN-TECH-018), BSGS (KN-TECH-031,
      KN-TECH-035), MOV and Frey-Ruck at small k (KN-TECH-032), the trace-one
      additive transfer (KN-TECH-033) - this record is dominated by all of
      them because it is not an attack.
    hidden_overhead: >-
      Nothing superpolynomial hides anywhere and there is no o(1). The honest
      hidden costs are three and all are epistemic. (i) The instrument is
      validated at 13 to 20 bits and applied at 222, carried by heuristic H2
      with no rigorous support. (ii) The soundness at 222 bits rests on a
      symbolic derivation that no machine checks, so an algebra error would
      produce a confidently wrong certificate; the eleven-row sweep is the
      cheapest available guard against exactly that. (iii) The instrument's
      REACH is only "2 versus at least 3", so a record that writes "cofactor
      derived" for Curve41417 on the strength of this instrument alone has
      overstated it.
    tradeoff_note: >-
      One genuine tradeoff, and it is the lossy-projection test read as a
      cost. The instrument buys a factor of roughly log^5 p in time over SEA
      by discarding the odd part of #E entirely - it answers a strictly weaker
      question, and there is NO setting of any parameter that recovers the odd
      part from two Legendre symbols. A second tradeoff is depth versus
      symbols - each additional level of the 2-adic valuation costs at least
      one more symbol and, past level 2, at least one square root, so
      certifying v_2 exactly on the 8-cofactor rows is strictly more expensive
      and is deliberately deferred to a sibling record. Parallelisation is
      irrelevant at 222 bits, where the whole computation is microseconds, and
      embarrassingly parallel for the toy census across the 14 cores.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW BEFORE WRITING THIS FIELD; `null` is
    not asserted. AS AN ATTACK it is dominated by every row, because it is not
    an attack - rho at 0.886 sqrt(l) with O(1) memory (KN-TECH-001,
    KN-TECH-006), automorphism-discounted rho (KN-TECH-018), BSGS at sqrt(N)
    time and memory (KN-TECH-031) and its n^{2/3+o(1)} full cost
    (KN-TECH-035), MOV and Frey-Ruck at small k (KN-TECH-032), and the
    trace-one transfer (KN-TECH-033) all dominate it on time, memory and data
    simultaneously. AS A MEASUREMENT INSTRUMENT the picture is mixed and the
    distinction is this record's quantitative case. (1) A full SEA point count
    DOMINATES it on INFORMATION, returning #E exactly, but does NOT dominate
    it on TIME - two modular exponentiations against O(log^8 p) - and SEA is
    unavailable in the declared environment, so on the time-versus-information
    plane the two are Pareto-incomparable. (2) THE SAFECURVES MIRROR NOW IN
    THIS REPOSITORY DOMINATES IT ON COST AND ON COVERAGE for the VALUES - it
    publishes the cofactor and twist cofactor for all twenty rows at zero
    compute, and this record must say so plainly rather than pretend the
    numbers are unavailable. It does NOT dominate on epistemic status, since
    those cells are a transcription of a transcription, nor on EXPLANATION,
    which is the axis where this record is not dominated by anything located -
    the mirror publishes eleven cofactor pairs and no reason for them, while
    C3 derives the entire partition from p mod 4 and predicts what a
    twenty-first curve's pair would be. (3) IDEA-20260829-d052e6 dominates on
    DEPTH for Montgomery rows, since its chain can in principle reach every
    level of the valuation while this record stops at level 2; this record
    dominates it on the six Edwards rows by needing no model conversion, on
    cost by needing two exponentiations rather than a dozen, and on scope by
    supplying the p = 3 mod 4 branch that d052e6 lacks. Neither dominates the
    other and both are needed.
  sota_delta: >-
    ZERO speedup against any attack baseline on every axis - time, memory,
    data, queries. QUANTITATIVELY AS COST - v_2(#E) for an Edwards row moves
    from "requires SEA, unavailable, therefore DEFERRED" to "two modular
    exponentiations, microseconds", an infeasible-to-feasible transition
    inside this environment rather than a constant-factor improvement; and,
    against IDEA-20260829-d052e6's route for the same six rows, from about
    twelve exponentiations plus an unaudited birational conversion to two
    exponentiations and no conversion, a factor of about six in operations and
    the removal of an entire unaudited step. QUANTITATIVELY AS SCOPE -
    d052e6's forcing corollary covers the p = 1 mod 4 rows only, which is five
    of the eleven complete rows; C3 covers ALL TWENTY rows and every elliptic
    curve over every odd prime field, so the covered fraction of the family
    moves from 5/20 to 20/20 for the forcing statement. QUANTITATIVELY AS
    EXPLANATION, WHICH IS THE REAL DELTA - the repository now holds eleven
    published cofactor pairs and zero derivations of any of them; this record
    would replace an eleven-row table by a one-line law with a stated
    exception branch, and the law is FALSIFIABLE against those eleven rows at
    zero compute cost before any curve is touched. QUANTITATIVELY AS PROCESS -
    the campaign's declared blocker OR-2, that the SafeCurves criterion
    definitions are unretrievable, is contradicted by a repository mirror that
    four proposals filed today did not know existed; recording that is worth
    more to this campaign than any single valuation.
  estimated_cost:
    implementation: medium
    compute: low
    basis: >-
      Implementation is a few hundred lines - Edwards affine arithmetic, a
      direct point counter, a twist constructor, two Legendre routines, and
      the sweep driver. Compute is dominated by the exhaustive census, about
      10^9 elementary steps at p near 2^15 summed over all d, which is minutes
      across 14 cores; every other stage is microseconds to seconds. No
      network access is required because the SafeCurves mirror is in-tree.
  recommended_priority: high

