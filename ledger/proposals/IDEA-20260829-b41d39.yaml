  id: IDEA-20260829-b41d39
  question_id: RQ-SCURVE-45cace
  goal_id: GOAL-SCURVE-4f0635
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    THE EDWARDS-NATIVE 2-ADIC INSTRUMENT AND THE p = 3 MOD 4 FORCING THEOREM -
    prove that the SafeCurves `complete` criterion IS the cyclic-2-Sylow
    condition, via the identity chi(A^2 - 4) = chi(d); decide 8 divides #E by
    the single symbol chi(1 - d) computed in the Edwards model with NO
    conversion to Montgomery form; and supply the p = 3 mod 4 twist-forcing
    theorem that IDEA-20260829-d052e6 explicitly declined to derive, which
    together explain all eleven complete rows of SafeCurves' own cofactor table
    with zero point counting
  class: representation

  claim: >-
    E-222 is x^2 + y^2 = 1 + d x^2 y^2 with d = 160102 over p = 2^222 - 117.
    Four separable sub-claims, of decreasing rigour, each independently
    falsifiable. C1 and C2 are proved here in full; C3 is proved here in full;
    C4 is an empirical claim about an instrument.

    (C1) COMPLETENESS IS CYCLICITY, EXACTLY. RIGOROUS, ZERO COMPUTE. Let
    E_d be x^2 + y^2 = 1 + d x^2 y^2 over F_p, p odd, d not in {0, 1}. The
    standard birational Montgomery model is B v^2 = u^3 + A u^2 + u with
    A = 2(1 + d)/(1 - d) and B = 4/(1 - d). Then
    A^2 - 4 = 4(1 + d)^2/(1 - d)^2 - 4 = 4[(1 + d)^2 - (1 - d)^2]/(1 - d)^2
    = 16 d/(1 - d)^2. Since 16 and (1 - d)^2 are squares,
    chi(A^2 - 4) = chi(d), where chi is the Legendre symbol mod p.
    CONSEQUENCE. SafeCurves' retrieved `complete.html` states verbatim that a
    Montgomery curve has a unique point of order 2 exactly when A^2 - 4 is not
    a square, and its complete-criterion table records EXACTLY ONE point of
    order 2 and EXACTLY TWO points of order 4 for every curve it marks
    complete. The Edwards-side condition that d be a non-square, the
    Montgomery-side condition that A^2 - 4 be a non-square, and the
    group-theoretic condition that the 2-Sylow subgroup be cyclic are
    therefore THE SAME CONDITION, joined by a one-line identity. This is not a
    new theorem in the literature; it is a statement this program does not
    hold anywhere, and it converts a criterion about a FORMULA into a
    criterion about GROUP STRUCTURE, which is what makes the rest of the
    record possible.

    (C2) THE EDWARDS-NATIVE 8-DIVISIBILITY CRITERION. RIGOROUS, ONE LEGENDRE
    SYMBOL, NO MODEL CONVERSION. On E_d the points (0, 1), (0, -1), (1, 0),
    (-1, 0) are always rational; (0, 1) is neutral, (0, -1) has order 2, and
    (1, 0) has order 4, since the Edwards addition law gives
    2(x, y) = (2xy/(1 + d x^2 y^2), (y^2 - x^2)/(1 - d x^2 y^2)) and hence
    2(1, 0) = (0, -1). So 4 divides the affine group order, ALWAYS, with no
    hypothesis on d. Now solve 2(x, y) = (1, 0). Using the curve relation to
    write 1 + d x^2 y^2 = x^2 + y^2 and 1 - d x^2 y^2 = 2 - x^2 - y^2, the
    second coordinate vanishes exactly when y^2 = x^2, and then the first
    coordinate equals 1 exactly when y = x with x nonzero. Substituting y = x
    into the curve gives 2 x^2 = 1 + d x^4, that is d x^4 - 2 x^2 + 1 = 0,
    whose roots in x^2 are (1 + e)/d and (1 - e)/d where e^2 = 1 - d. THE
    PRODUCT OF THE TWO ROOTS IS (1 - e^2)/d^2 = d/d^2 = 1/d. So when d is a
    NON-SQUARE, that is when E_d is complete, exactly one of the two roots is
    a square, and therefore (1, 0) is halvable in E_d(F_p) IF AND ONLY IF
    1 - d is a square in F_p. THEOREM. For a complete Edwards curve,
    v_2(#E_d(F_p)) is at least 3 if and only if chi(1 - d) = +1, and
    v_2(#E_d(F_p)) = 2 exactly when chi(1 - d) = -1. NO POINT COUNT, NO
    MONTGOMERY CONVERSION, NO SQUARE ROOT - one Legendre symbol on an integer
    of at most 20 bits.

    (C3) THE p = 3 MOD 4 FORCING THEOREM. RIGOROUS, ZERO COMPUTE. This is the
    statement IDEA-20260829-d052e6 declined to make and explicitly deferred,
    saying a separate statement must be derived per residue class. Write
    a = v_2(#E), b = v_2(#E^t), and s = v_2(2p + 2) = 1 + v_2(p + 1). From
    #E + #E^t = 2p + 2 exactly, the trichotomy is complete and elementary. If
    a is less than b then v_2 of the sum equals a, so a = s and b is greater
    than s. If b is less than a then b = s and a is greater than s. If a = b
    then the sum is 2^a times an even number, so s is at least a + 1, that is
    a = b is at most s - 1. Hence the clean contrapositive that carries
    everything below - IF a IS LESS THAN s THEN b = a. For p = 1 mod 4 one has
    s = 2 and, since a and b are at least 2 by C2's floor, a is never less
    than s, which is why d052e6's Curve25519 statement takes the OTHER branch
    and forces a mismatch. For p = 3 mod 4 one has s at least 3 and the
    matched branch is the generic one. PREDICTED FOR E-222, derived by hand in
    this record and to be re-derived by the executor - p + 1 = 2^222 - 116 =
    4(2^220 - 29) with 2^220 - 29 odd, so v_2(p + 1) = 2 and s = 3. E-222
    therefore has the SMALLEST s of the six Edwards rows and is the tightest
    instance of the theorem - a = 2 forces b = 2 with no slack at all, and any
    a at least 3 forces min(a, b) = 3 exactly.

    (C4) THE LAW EXPLAINS THE WHOLE TABLE, AND THAT IS THE EXPERIMENT.
    SafeCurves' retrieved twist table publishes, for the eleven curves it
    marks complete, the cofactor and twist-cofactor pairs (2^3, 2^2) for
    M-221, Curve25519, M-383, Curve383187 and M-511; (2^2, 2^2) for E-222,
    Curve1174, E-382, Ed448-Goldilocks and E-521; and (2^3, 2^3) for
    Curve41417. C3 PREDICTS EXACTLY THIS PARTITION, from the residue of p
    alone - every mismatched row is predicted to have p = 1 mod 4 and every
    matched row p = 3 mod 4. The experiment computes s for all eleven rows and
    checks the prediction row by row. A single row where the published pair is
    mismatched while a is less than s REFUTES C3, which is a theorem, and
    therefore proves instead that a published cofactor or the modulus is
    mis-transcribed - which is a material finding about the intake either way.

  mechanism: >-
    THE TRACKED OBJECT is the COMPLETENESS SYMBOL PAIR of an Edwards curve,
    S(E_d) = (chi(d), chi(1 - d)), together with the integer
    s = 1 + v_2(p + 1) derived from the modulus alone. Two bits and one small
    integer, extracted from a 222-bit to 521-bit tuple.

    LOSSY-PROJECTION TEST (docs/inventor-protocol.md section 2), applied
    BEFORE any compute, which is the whole point of the test.
    WHAT IS DISCARDED. The modulus except for its 2-adic behaviour at p + 1,
    the base point, the j-invariant, the CM discriminant, the entire odd part
    of the group order - which is the whole cryptographic group - and every
    isogeny-class datum except the 2-adic one. Everything except two symbols
    and a small integer.
    IS IT A CHANGE OF COORDINATES? No. Nothing about d is recoverable from
    S(E_d). Both symbols are surjective onto their four sign patterns and each
    fibre has size Theta(p) by Weil's bound on character sums. The projection
    identifies enormous families of curves with each other.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS THE AUDIT USES? Four
    operations, four answers, all deterministic and all stated in advance.
    (i) THE COMPLETENESS PREDICATE. It is a function of chi(d) alone, by C1,
    so it propagates exactly. (ii) 8-DIVISIBILITY. A function of chi(1 - d)
    alone, by C2, given chi(d) = -1, so it propagates exactly, and NOTE that
    it propagates ONLY on the completeness branch - the derivation's key step,
    that exactly one of the two roots is a square, uses chi(d) = -1 and fails
    otherwise. (iii) QUADRATIC TWISTING. Handled not by the symbols but by
    C3's forcing theorem, which is a function of s and of a alone; the pair
    (a, b) is therefore determined whenever a is less than s, with no
    additional information about the twist required. (iv) SCALING OF THE
    MODEL. E_d and E_{d'} are isomorphic over F_p only for d' = d, and over an
    extension the symbols change; the object is a strictly F_p-rational one
    and does not claim otherwise.
    WHERE THE STRUCTURE DISSOLVES, MEASURED AND STATED. In three places, all
    disclosed rather than discovered. FIRST, at chi(d) = +1, where the curve
    is not complete, the affine Edwards model acquires singular points at
    infinity, the 2-Sylow is non-cyclic, and C2's derivation collapses because
    both roots can be squares or neither. SECOND, at a = s or a greater than
    s, where C3's matched branch does not apply and the twist valuation is
    NOT equal to the curve's. THIRD, at depth 3 and beyond - the pair
    S(E_d) distinguishes v_2 = 2 from v_2 at least 3 and NOTHING FINER, so it
    cannot separate v_2 = 3 from v_2 = 4. That third boundary is exactly why
    IDEA-20260829-b130bb exists and is named here as forward guidance rather
    than hidden.

    WHY THIS IS NOT IDEA-20260829-d052e6. That record works in the Montgomery
    or short-Weierstrass model and states four times, in its transfer limits,
    that the Edwards rows must FIRST be converted to Montgomery form and that
    its instrument does not transfer through an unaudited birational map. This
    record removes the conversion entirely - C2's derivation is carried out in
    the Edwards addition law itself, on the Edwards parameter d, and touches
    no Montgomery quantity except in C1, where the Montgomery model appears
    only inside a proof and never inside a computation. It also supplies, in
    C3, the p = 3 mod 4 forcing statement that d052e6's transfer note (b)
    identifies as MISSING and as the most likely way to get a wrong answer on
    a sibling curve. Finally, d052e6 predicts a per-curve valuation; C3
    predicts a PARTITION OF THE FAMILY from the modulus alone, which is a
    different and stronger kind of statement and is testable against eleven
    published rows rather than one.

    EXECUTION. Step 1, zero compute - re-derive C1, C2 and C3 symbolically and
    freeze them as code plus a derivation note. Step 2, EXHAUSTIVE TOY CENSUS.
    For each of several small primes, both residue classes mod 4, enumerate
    EVERY d in F_p with d not in {0, 1}, count the affine points of E_d
    directly, count the points of the quadratic twist directly, and compare
    (chi(d), chi(1 - d), s) against the measured (a, b). This is a complete
    census, not a sample, and it tests C1, C2 and C3 simultaneously and
    separately on both the chi(d) = -1 and chi(d) = +1 branches. Step 3, apply
    the frozen instrument to E-222 and emit the certificate. Step 4, the
    ELEVEN-ROW FAMILY SWEEP - compute s and the symbol pair for all eleven
    complete SafeCurves rows and compare against the retrieved cofactor table.
    Step 5, the refusal sweep - run the instrument on the nine non-complete
    rows and confirm it REFUSES rather than returning a number.

