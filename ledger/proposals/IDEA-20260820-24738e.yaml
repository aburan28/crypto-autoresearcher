  novelty_screen:
    method: >-
      Screened the parent-supplied exact 28-record current-tree inventory, including
      state reuse, domain alias, serializer faults, generic transcript independence,
      posterior entropy, commitment collisions, and public-stratum proposals.
    results: >-
      The closest state-reuse record restores one mutable checkpoint within a signer.
      This candidate aliases a deterministic seed label across two distinct keys and
      targets a cross-key joint-law defect that may leave both marginals calibrated.
    verdict: Unverified; no persistent knowledge service or primary literature retrieval was available.
  object_first_candidate:
    tracked_object: Conditional joint law of two distinct-key public transcripts under aliased versus independent deterministic seeds.
    lossiness: Key-specific transforms may erase the seed relation; a null closes only the chosen seed boundary and feature family.
    propagation: Shared seed material may select correlated commitment walks or response strata before key-specific algebra acts.
    survival_score: Held-out conditional HSIC and pair AUC survive key and message permutations while both single-key marginal tests remain calibrated.
  predictions:
    - metric: conditional HSIC between public fields of distinct-key transcript pairs
      direction: higher
      minimum_effect: standardized HSIC z >= 3.5 with family-wise corrected p < 0.01
    - metric: pair classifier AUC for seed-aliased versus independent-seed pairs
      direction: higher
      minimum_effect: AUC >= 0.60 with 95% lower bound above 0.55
    - metric: per-key marginal real-versus-simulator AUC
      direction: different
      minimum_effect: each remain in [0.47,0.53]
  minimal_test:
    design: >-
      At a toy parameter set, freeze two independently generated keys, a public
      message schedule, and one seed-derivation boundary. Compare independent-seed
      signing, O_seed_alias pairs, matched true-simulator pairs, and a planted
      positive that copies one labelled public commitment-class bit across keys
      with probability 0.15. Hold out keys, messages, and seed blocks jointly.
    controls:
      - Genuine true-simulator pair with independent seeds and identical public shape.
      - Real distinct-key signer with independent deterministic seeds.
      - Fifteen-percent copied public-field cross-key positive.
      - Aliased diagnostic seed consumed only by a discarded computation.
      - Key-label and message-pair permutation controls.
    required_metrics: [conditional_HSIC, pair_AUC, marginal_AUC, collision_excess, verification_rate]
  controls:
    - True simulator null matched by key count, messages, domains, parsing, and acceptance.
    - Planted cross-key dependence swept from 0.01 through 0.15.
    - Same seed tuple with independently randomized key-binding suffix as a nearby null.
    - No wall-clock, retry count, signature length, power, cache, or branch trace.
  falsification_conditions:
    - All joint-law metrics remain in preregistered null bands while planted-positive power is >= 0.90.
    - The same effect appears when only a discarded diagnostic seed is aliased or after breaking message pairing.
    - Marginal arm imbalance, simulator miscalibration, or an excluded channel invalidates the test.
  confounders:
    - Reusing identical messages can induce benign cross-key feature similarity.
    - Shared public parameters can create dependence unrelated to the seed.
    - Key-conditioned feature normalization can leak pair labels.
    - Aliasing instrumentation can accidentally skip key binding rather than only change a seed label.
  interpretation_limits:
    - The oracle assumes active access to one deterministic seed-derivation boundary.
    - A joint-law defect does not identify secret-dependent material or imply recovery.
    - Results at toy scale do not transfer without a separately specified experiment.
    - GOAL-SSI-001 retains all hard-problem claims.
  fault_oracle:
    name: O_seed_alias
    intervention: Alias only the key-bound seed label for two distinct keys at one deterministic derivation boundary.
    exposed: Published transcript fields, parse/rejection categories, and verification.
    excluded: [time, retry_count, signature_length, seed_value, secret, power, cache, branch_trace]
  heuristic_assumptions:
    - id: H1
      statement: The chosen deterministic seed component reaches a randomized signing choice before all key-specific transformations decorrelate it.
      rigorous_support: Reachability is exactly checkable for a fixed implementation; retained correlation is not guaranteed.
      validation_plan: Trace declared dataflow at fixed toy inputs, then remove internal labels and test held-out public pairs.
    - id: H2
      statement: The frozen joint statistics detect sparse cross-key dependence without relying on marginal mismatch.
      rigorous_support: Guaranteed only for the planted copied-field model.
      validation_plan: Sweep copy probability 0.01 to 0.15 and require calibrated marginal nulls.
  target_complexity:
    time_exponent: null
    memory_exponent: null
    best_known: Not a solver; KN-TECH-058 records unconditional Fp2 p^(1/2)(log p)^O(1) time with polynomial memory and a p^(1/3+o(1)) time-and-memory tier conditional on Heuristic 1.
    hidden_overhead: Pair analysis is O(N log N) with frozen random features or O(N^2) for exact kernels; the conditional SSI tier hides superpolynomial overhead.
    tradeoff_note: More key pairs raise query and memory cost but do not change a cryptanalytic exponent. Reduction inheritance is unverified and no GRH claim is made.
  cost_model:
    time: O(N log N) joint-law analysis after transcript generation
    memory: O(Nd) pair features or O(d) streaming cross-moments
    data_or_queries: 4N paired two-key invocations across independent, alias, simulator, and planted arms
    preprocessing: Freeze key pairs, messages, seed boundary, parser, public features, and thresholds
    oracle: One deterministic seed-label alias across distinct keys, no secret or side-channel output
    verification: O(N) per-key verification plus independent pair-statistic recomputation
  proof_search_map:
    exact_baseline_reproduction: Show independent-seed real pairs and true-simulator pairs are calibrated jointly and marginally.
    observation_collision_search: Search same-message pairing, shared public parameters, feature normalization, and key-label leakage for the same dependence.
    quantifier_order: For every fixed toy implementation, key pair, seed boundary, public schedule, feature map, and N, probability is over preregistered seed and message blocks.
    method_ceiling: Can certify only a cross-key public joint-law mismatch under the explicit alias oracle.
    nearby_object_control: Alias a diagnostic seed used only by a discarded computation while leaving the signing seed key-bound.
