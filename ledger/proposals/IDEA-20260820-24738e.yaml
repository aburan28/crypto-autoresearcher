idea:
  id: IDEA-20260820-24738e
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Cross-key public-transcript correlation under deterministic seed aliasing
  class: mechanism
  claim: >-
    For a fixed toy implementation, forcing two distinct signing keys to derive
    per-signature randomness from the same deterministic seed tuple can induce
    cross-key dependence in labelled public transcript fields even when each key's
    marginal law remains calibrated. This is an active fault-model proposal, not a
    passive timing, length, key-recovery, forgery, or SSI claim.
  mechanism: >-
    Define O_seed_alias(K0,K1,m,d) to replace only the key-bound component of the
    deterministic signing seed for K1 by K0's alias label, while preserving message
    m, public domain d, public keys, serializer, and output shape. Produce paired
    transcripts for distinct keys on matched or independently permuted messages.
    If the deterministic sampler consumes the aliased seed before key-specific
    randomization fully decorrelates it, cross-key commitment classes, verifier
    strata, or rank features can share a latent seed. Marginal-only tests may miss
    the resulting joint-law defect.
  novelty_status: unverified
  status: proposed
  source_refs:
    - {id: RQ-SQISIGN-001, provenance: internal, verified_by: TASK-20260820-922be8}
    - {id: KN-TECH-057, provenance: internal, verified_by: TASK-20260820-922be8}
