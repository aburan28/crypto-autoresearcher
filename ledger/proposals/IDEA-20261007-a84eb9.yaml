idea:
  id: IDEA-20261007-a84eb9
  question_id: RQ-OAKLEY-264353
  status: proposed
  added: '2026-10-07'
  approved_by: null
  title: >-
    GHS positive-control costing at the same tower cells as the PDP ladder
  class: measurement
  claim: >-
    On the same sibling cells (E over F_{2^{5p}}, a equal 0, b outside
    F_{2^p}, recorded objects) at p in {5, 7} used by the PDP ladder, the GHS
    Weil-descent route through the degree-5 extension is executed as the
    named positive control: cover curve genus, cover-construction cost, and
    the Jacobian discrete-logarithm step cost (hyperelliptic index calculus
    at these toy genera, or a recorded explicit failure mode where the cover
    genus defeats the cell) are measured and charged, giving the comparator
    number the Coordinator decision item (3) requires; whether GHS wins by
    orders of magnitude or fails loudly at a cell, either outcome satisfies.
  mechanism: >-
    OBJECT FRAME. Representation: the GHS cover C over F_{2^p} with the
    transfer map to Jac(C), computed in a recorded basis of the same tower;
    Sigma: the cover-level operations (divisor addition on Jac(C)) that carry
    the ECDLP image, a different operation set from PDP translation, named
    here because the control lives under it. TRICHOTOMY: coordinate-dependent
    transfer followed by Class I partial-action index calculus on the
    hyperelliptic Jacobian; the branching event is cover-genus feasibility at
    the given b. LOSSY-PROJECTION TEST against the PDP Sigma: not applicable
    as identity, and honestly so, because GHS is a transfer to a different
    group, which is why it serves as positive control and comparator rather
    than as the object of study. KN-OPEN-020: GHS is not a factor base at all
    and escapes the classification by construction; the PDP factor bases it
    compares against stay linear and scoped-out. THE MECHANISM. The
    degree-5 tower that makes Gaudry-Diem natural is also the shape where GHS
    descent is historically effective, with the F_{2^{5*31}} precedent as the
    known phenomenon; costing GHS at the same cells turns 'GHS is the real
    threat' from a slogan into the charged number PDP must beat, and a cell
    where the cover genus explodes is a measured scope boundary, not a
    setback. WHAT IS ADDED: same-cell GHS numbers on ordinary (non-GLS)
    quintic-tower siblings with recorded b, where the corpus holds the
    precedent only at GLS-assisted crypto size and the siblings hold no GHS
    number at all.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260922-70a67c
      provenance: internal
      claim: >-
        Endpoint rho comparators 2^{75.8} and 2^{91.3}, the sibling-ladder
        construction, and the explicit non-availability of Frobenius speedups
        on the non-Koblitz Oakley curves.
      verified_by: 'Pasted task context of RQ-OAKLEY-264353 brief; not independently retrieved in this session'
    - ref: IDEA-20260922-af7396
      provenance: internal
      claim: >-
        Exact-arithmetic verification that both Oakley b values lie outside
        the relevant subfields, which is the input the GHS genus computation
        is most sensitive to.
      verified_by: 'Pasted task context of RQ-OAKLEY-264353 brief; not independently retrieved in this session'
    - ref: GHS Weil-descent attack on binary curves (recalled pointer, unopened)
      provenance: recalled
      claim: >-
        Recalled only: descent of E over F_{q^n} to a hyperelliptic Jacobian
        over F_q, effective for special fields and curves only.
      verified_by: null
    - ref: Joux-Vitse and GLS-assisted GHS records near F_{2^{5*31}} (recalled pointer, unopened)
      provenance: recalled
      claim: >-
        Recalled only: cover-and-decomposition at 149 bits and a GLS-GHS
        break over F_{2^{5*31}} in about 1035 CPU-days; calibration precedent,
        not a result.
      verified_by: null
  assumptions:
    - >-
      Same recorded sibling objects as IDEA-20261007-36251a at p in {5, 7}, plus
      the cover equations and genus per (cell, b) recorded as part of the
      datum; subgroup orders from the same BSGS computations.
    - >-
      Unconditional measurement audit at the cells: genus, construction cost
      and Jacobian-step cost are computed, not modelled; extrapolation to
      p equal 31, 37 is labelled extrapolation and borrows IDEA-20261007-ece173
      heuristics explicitly.
    - >-
      GHS is used ONLY as the named positive-control component; the off-limits
      lens rule is respected because no isogeny-path, pairing, p-adic or
      endomorphism mechanism is the object of study here.
  proof_search_map:
    bottleneck: >-
      The missing comparator: the RQ can price PDP ever more finely and still
      not know what GHS costs at the same cells. The bottleneck is a number,
      not a lemma.
    baseline_embedding:
      parameter_slice: >-
        The F_{2^{5*31}} GLS-GHS precedent as the known-phenomenon calibration:
        genus behaviour and cost shape there bound what a same-shape surprise
        at toy cells would have to look like to matter.
      reproduction_check: >-
        Recompute the cover genus formula on a published toy GHS example
        before touching tower siblings; a genus mismatch there invalidates the
        cover builder, never the curve.
    observation_collision:
      observable: >-
        Per-cell triple (genus, construction cost, Jacobian-step cost) with
        the b value attached, so genus-driven and implementation-driven cost
        never merge.
      distinct_preimage_search: >-
        A cheap Jacobian step comes both from a genuinely low genus and from
        a Jacobian solver tuned to the toy genus; discriminate by running two
        independent Jacobian methods (Cantor arithmetic index calculus versus
        generic rho on the Jacobian) and publishing both.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The GHS cost triple measured on the exact cells where PDP yield is
          measured, sharing targets and subgroup data.
        predicted_gain: >-
          Makes decision item (3) a measured comparison instead of an appeal
          to the literature, and surfaces genus-explosion cells as scope
          boundaries.
    quantifier_order: >-
      FORALL cells p in {5, 7} with recorded b: the triple is measured or the
      explicit failure mode is recorded; no existential generalisation over b
      is claimed.
    method_ceiling:
      strongest_certifiable_claim: >-
        'GHS at these cells costs C with genus g, above or below PDP yield
        cost Y by factor Z.' Nothing about p equal 31, 37, nothing about
        curves outside the tower shape.
      nearby_object_control: >-
        PROVES-TOO-MUCH: the same builder on a known GHS-weak toy curve must
        show the expected win; if it does not, the builder is broken and no
        tower number is reported.
    proof_obligations:
      - claim: Cover equations and genus per cell are correct.
        responsibility: correctness
      - claim: Transfer map carries the target faithfully.
        responsibility: correctness
      - claim: Jacobian-step charged cost per cell, both methods.
        responsibility: runtime
    not_applicable_reason: null
  predictions:
    - metric: cover genus g per (cell, b)
      direction: different
      minimum_effect: >-
        Genus published exactly per cell; any g at or below 4 at p equal 7 is
        the GHS-favourable surprise branch.
    - metric: charged GHS total versus charged PDP yield cost at same cell
      direction: different
      minimum_effect: >-
        Ratio reported with factor-2 resolution; a ratio inside [0.5, 2] is
        the contested-cell outcome and is reported as such.
    - metric: Jacobian-step cost, index calculus versus Jacobian rho
      direction: different
      minimum_effect: >-
        Both numbers published; agreement within an order of magnitude, or the
        discrepancy is diagnosed as solver tuning, not curve structure.
  minimal_test:
    design: >-
      On the p equal 5 and 7 sibling cells shared with the PDP ladder, build
      the GHS cover through the degree-5 extension per recorded b, compute
      genus, time the construction, transfer 10 ladder targets, and solve the
      Jacobian images by both hyperelliptic index calculus and Jacobian rho,
      charging all steps including cover failures and memory. Publish the
      per-cell triples against the PDP yield numbers on the same targets.
    controls:
      - known GHS-weak toy curve as positive-control calibrator for the builder
      - shape-matched random Boolean null is not applicable to the transfer step and is replaced by a random-b cover-genus survey per cell
      - size-matched random V PDP arm as the PDP-side anchor at the same cells
      - Groebner-versus-SAT identity inherited from IDEA-20261007-424b6f for the PDP-side numbers compared against
      - genus formula reproduction on a published toy example before tower cells
    required_metrics:
      - cover genus per (cell, b) and construction wall-clock plus peak RSS
      - transfer cost per target and failure count
      - Jacobian-step cost per target per method with failures charged
      - GHS-to-PDP charged ratio per cell with error bars
  falsification_conditions:
    - Builder fails the known-weak calibrator: no tower number is reported until the builder is fixed.
    - Cover genus exceeds the feasible Jacobian threshold at every b tried in a cell: the cell is recorded as GHS-infeasible, which bounds the comparator rather than refuting anything.
    - GHS-to-PDP ratio inside [0.5, 2] at both cells: the comparator is contested and the RQ must keep both routes live.
  confounders:
    - Cover genus is b-sensitive; a single b per cell cannot carry a general claim, so survey at least three b values per cell.
    - Jacobian index-calculus implementations are genus-sensitive in tuning; the two-method rule exists for this.
    - Toy-genus feasibility does not imply endpoint feasibility; the genus-growth extrapolation is flagged wherever the ratio is quoted.
  interpretation_limits:
    - GHS numbers at m equal 25 and 35 are comparator data at those cells; endpoint GHS statements are extrapolations under stated heuristics.
    - A GHS win here decides the comparator, not the RQ: PDP metrology continues regardless because the decision target needs both sides.
    - Nothing about deployed-system security.
  heuristic_assumptions: []
  target_complexity:
    time_exponent: >-
      No exponent claimed: GHS cost at fixed extension degree 5 follows the
      hyperelliptic Jacobian cost at the measured genus; the record publishes
      the measured totals against Gaudry O~(q^{1.6}) PDP and rho.
    memory_exponent: >-
      Cover-construction and Jacobian relation-matrix memory reported as
      measured; no asymptotic memory claim.
    best_known: >-
      The F_{2^{5*31}} GLS-GHS precedent as the phenomenon calibrator and rho
      at the subgroups as the background floor; this record extends neither.
    hidden_overhead: >-
      Cover-construction constants and Jacobian solver tuning charged
      explicitly; nothing in an o(1).
    tradeoff_note: >-
      Parallel over targets and b values; Jacobian linear algebra as measured.
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: medium
  dominated_by: >-
    As an attack: GHS itself is the literature-known route wherever the genus
    cooperates, and rho floors everything elsewhere; this record claims no
    attack and is dominated by both as an attack. As a measurement: dominated
    by nothing at these cells after checking every index-calculus row of the
    pasted map, since no row costs GHS on ordinary quintic-tower siblings
    beside PDP.
  sota_delta: >-
    Zero on every ECDLP cost axis. Against program state: supplies the
    missing comparator column of the decision target, turning a
    literature appeal into a same-cell number.
