    verdict: 'UNVERIFIED. This program cannot read external literature and this record is written
      specifically so that no external bound is needed, cited, or contradicted: the quantity is derived
      internally and is named an internally derived counting expression throughout, never a security
      bound. Claimed NEW relative to this repository: pairing an exact finite-product derivation with
      a direct toy-capacity simulation that must distinguish the exact expression from its own asymptotic,
      so the derivation is instrument-checked rather than asserted. ASSEMBLED FROM KNOWN PARTS: birthday
      counting is elementary and is not claimed as an insight; the exact-versus-asymptotic gap framing
      is the program''s recurring quantity-computed-once-and-inherited pattern named in RQ-ASCON-2dfd8b''s
      motivation; the requirement to report constants rather than asymptotics is RQ-ASCON-2dfd8b''s
      own methods list.'
  object_first_candidate:
    tracked_object: 'The multiset of inner (capacity) states visited during a duplex session: its
      occupancy, tracked as a function of the number of permutation calls, and collapsed to the single
      event has any inner state repeated. The outer rate portion and every state value beyond the
      inner part are not tracked.'
    lossiness: 'Lossy. Discarded: the entire rate portion of the state, the order in which inner states
      were visited, their identities, and everything about the message. Retained: whether the sequence
      of inner states contains a repetition, plus the count of calls. The discard is compatible with
      the target operation because a duplex call maps a full state to a full state, and under the
      stated idealisation the inner part of the successor is independent of the discarded rate part
      -- which is exactly the numbered assumption that makes the retained part propagate as an independent
      draw. That assumption is the load-bearing one and is flagged as such rather than buried, since
      it is also the most likely place the expression parts company with a real permutation. The projection
      is massively non-invertible: a single bit of retained information stands for an entire session.'
    propagation: 'One permutation call acts on the tracked object by drawing one more inner state
      and testing it against all previously visited ones. Under the idealisation the no-collision
      probability after q calls multiplies by (1 - k/2^c) at step k, giving the falling-factorial
      product; the collision event is absorbing. Against a real permutation the propagation differs
      in two named ways: the permutation is a bijection on the FULL state, so inner states are not
      independent draws, and absorption injects attacker-chosen rate data that could correlate successive
      inner states. The simulation arm exists precisely to measure whether either effect is visible
      at toy capacity, since neither can be argued away from the armchair.'
    survival_score: Stated concretely as the capacity range over which the exact expression and the
      measured simulation frequency agree within sampling error while the asymptotic departs by more
      than the declared tolerance. The structure survives across that range and the record reports
      its endpoints; above the largest simulated capacity nothing is measured and the record says
      so, offering the exact expression there as an extrapolation of a derivation rather than as a
      measurement.
  null_object_control: 'TWO nulls, both executable in the same invocation. First, a GENUINE RANDOM
    FUNCTION on the inner state of the same width, replacing the permutation in the simulation: under
    the stated idealisation the exact expression should fit this arm best, so a poor fit here indicts
    the derivation or the simulator rather than the permutation. Second, a DELIBERATELY BIASED inner-state
    generator -- one that repeats a state with a known injected excess probability -- whose measured
    collision frequency must exceed the exact expression by the injected amount, confirming the simulator
    can detect a departure at all. For the signal arm to mean anything, the random-function null must
    fit and the biased null must be caught; if the simulator fits everything, it discriminates nothing.'
