idea:
  id: IDEA-20260816-76f564
  question_id: RQ-ASCON-2dfd8b
  added: '2026-08-16'
  title: Derive from first principles, inside this program and citing no external bound, the EXACT
    finite-sum inner-collision probability for a duplex at a declared rate and capacity, tabulate
    the gap between it and its own birthday asymptotic across device-lifetime data volumes, and validate
    the exact expression by direct enumeration at toy capacities
  class: theory
  claim: '(A) Sponge security statements degrade with data processed per key, and the degradation
    is normally quoted asymptotically. This program cannot cite any published bound and does not attempt
    to; instead it derives, from elementary counting alone, the exact probability that two distinct
    inner (capacity) states coincide over a session of q permutation calls under a declared idealisation,
    as a finite product rather than as an asymptotic expression, and tabulates the RATIO between the
    exact value and its own leading-term birthday approximation across the data volumes a long-lived
    constrained device would actually reach. (B) The deliverable is: the exact expression with its
    idealisation stated as a numbered assumption; a table of exact-versus-asymptotic ratio at capacities
    and data volumes spanning the declared range; and the crossover volume at which the ratio departs
    from 1 by more than a declared tolerance. (C) NOT CLAIMED: that this expression is, matches, improves
    on, or contradicts any published security bound -- this program cannot read published bounds and
    asserts nothing about them, so the record deliberately names its quantity an internally derived
    counting expression and never a security bound. NOT CLAIMED: any attack, any statement about a
    deployed device, any rekeying recommendation. (D) NOT CLAIMED either: that the idealisation holds.
    The expression is about a random-function idealisation of the inner state, and the gap between
    that idealisation and a permutation is a separate, unaddressed question named in the interpretation
    limits. (E) The instrument-validity content is what makes this more than algebra: the exact expression
    is CHECKED by direct enumeration at toy capacities of 12 to 20 bits, where the collision probability
    can be measured by brute-force simulation over many sessions, and the measured frequency must
    match the exact expression within sampling error while DEPARTING measurably from the asymptotic
    at small capacity. A derivation that cannot be distinguished from its own approximation at any
    tested capacity has produced no usable finding, and that is the null this record is built around.'
  mechanism: 'Stage one states the idealisation as numbered assumptions: inner states behave as independent
    uniform draws from a space of size two to the capacity, absorption does not bias them, and the
    session length is the number of permutation calls. Stage two derives the exact no-collision probability
    as a finite falling-factorial product and the collision probability as its complement, and derives
    the leading-term birthday approximation from the same expression by a single stated step, so that
    both quantities come from one derivation rather than from two sources. Stage three evaluates both
    at a grid of capacities and session lengths using exact rational or high-precision arithmetic,
    since the interesting regime is where floating point silently rounds the difference to zero. Stage
    four measures the same probability by direct simulation at toy capacities 12 to 20: run many sessions
    with a real permutation, detect inner-state repetitions exactly, and estimate the frequency. Stage
    five compares three curves -- exact, asymptotic, measured -- and reports the capacity range where
    measured agrees with exact and disagrees with asymptotic. Stage six repeats the simulation with
    the permutation replaced by a genuine random function of the same inner width as the null arm,
    where the exact expression should fit best of all.'
  novelty_status: unverified
