  - A generic birthday-bound calculation. What distinguishes this record is that the birthday approximation
    is DERIVED FROM the exact expression in one stated step and then measured against it and against
    simulation, so the deliverable is the gap and its crossover volume rather than the bound.
  assumptions:
  - Inner states can be idealised as independent uniform draws for the purpose of the derivation;
    this is numbered as assumption 1 and is the one the simulation arm exists to stress.
  - The rate/capacity split can be pinned, or the derivation reported as a function of capacity across
    the plausible splits, which it is in any case since capacity is the expression's free parameter.
  - Toy capacities of 12 to 20 bits are large enough for the exact-versus-asymptotic gap to be measurable
    and small enough for direct simulation to reach the collision regime within budget.
  - High-precision arithmetic is required and available, since at large capacity the exact and asymptotic
    values differ in digits that double-precision floating point discards.
  - The number of permutation calls is a fair proxy for data processed per key at the declared rate;
    the conversion is stated explicitly and is a simple division rather than an assumption about deployment.
  predictions:
  - metric: ratio of exact collision probability to its birthday asymptotic, as a function of session
      length at fixed capacity
    direction: different
    minimum_effect: the ratio departs from 1 by more than 1 percent at some session length within
      the tabulated range; if it never does, the asymptotic is adequate everywhere tested and that
      is a complete and reportable negative result
  - metric: agreement between measured simulation frequency and the exact expression, at toy capacities
      12 to 20, under a genuine random function
    direction: different
    minimum_effect: within 2 standard errors at every tested capacity; a systematic departure indicts
      the derivation or the simulator and halts interpretation
  - metric: measured frequency under the biased-generator null minus the exact expression
    direction: higher
    minimum_effect: equal to the injected excess within 2 standard errors, a forced value confirming
      the simulator detects departures
  - metric: agreement between the real-permutation simulation arm and the random-function arm at matched
      capacity
    direction: different
    minimum_effect: 'no pre-commitment. Refusing is deliberate: a permutation is not a random function
      and whether that difference is visible at toy capacity is exactly what is unknown, so predicting
      either agreement or departure would be invention'
  minimal_test:
    design: 'Two halves, both cheap. Symbolically: implement the exact finite product and its birthday
      asymptotic in exact rational and high-precision arithmetic, evaluate both on a grid of capacities
      from 12 to 256 and session lengths from 2^4 to 2^80, and tabulate the ratio and the crossover
      session length where it leaves a declared tolerance band. Empirically: at toy capacities 12
      to 20, run 100000 independent sessions per capacity under three generators -- the real permutation
      truncated to the toy inner width, a genuine random function, and a biased generator with a known
      injected excess -- detecting inner-state repetition exactly with a hash set, and compare each
      measured frequency against the exact expression and against the asymptotic. Cost: seconds for
      the symbolic half, minutes for the simulation. The discriminating output is whether measured
      tracks exact rather than asymptotic at small capacity, and by how much.'
    controls:
    - Genuine random-function generator arm at matched inner width, same invocation, seed recorded,
      where the exact expression should fit best.
    - Biased-generator arm with a known injected excess collision probability, which the simulator
      must detect at the injected magnitude.
    - Exact-arithmetic versus double-precision evaluation of the same expression, demonstrating where
      floating point erases the gap being measured.
    - Session length 1, where the collision probability must be exactly 0, and session length 2, where
      it must be exactly 2^-c under the idealisation.
    - Capacity sweep at two rate values, confirming the expression depends on capacity alone as derived
      and not on the rate through some implementation path.
    required_metrics:
    - exact collision probability on the (capacity, session length) grid, in high precision
    - birthday asymptotic on the same grid, derived in one stated step from the exact expression
    - ratio exact/asymptotic and the crossover session length per capacity at the declared tolerance
    - measured collision frequency per generator arm per toy capacity, with standard errors
    - absolute deviation of each measured frequency from exact and from asymptotic
    - sessions simulated, seeds and wall-clock
  falsification_conditions:
  - The measured frequency under the genuine random-function arm departs systematically from the exact
    expression, indicting the derivation or the simulator.
  - The biased-generator arm is not detected at its injected magnitude, showing the simulator cannot
    see a departure.
  - Session length 1 or 2 does not produce the forced exact values.
  - The exact/asymptotic ratio never leaves the tolerance band anywhere on the grid, in which case
    the asymptotic is adequate over the whole tabulated range and the record reports that as its complete
    result.
  - The expression is found to depend on the rate as implemented, contradicting the derivation and
    indicating an error in either.
  - Exact and double-precision evaluations agree everywhere, which would mean the grid never reaches
    the regime the record was built to examine.
  confounders:
  - Truncating a real permutation to a toy inner width is not the same object as a real toy-capacity
    sponge, so the permutation arm's behaviour may reflect the truncation rather than the design;
    this is stated and is why the random-function arm carries the validation burden.
  - Detecting inner-state repetition with a hash set costs memory linear in session length, so long
    toy sessions may be memory-bound and silently truncated; the simulator must assert its session
    length rather than accepting a shortened one.
  - Sampling error at 100000 sessions may be comparable to the exact-minus-asymptotic gap at the larger
    toy capacities, making the discrimination impossible exactly where it would be most interesting;
    a power calculation is required before the run rather than after.
  - The idealisation of independent draws is exactly what a permutation violates, so a departure in
    the permutation arm has at least two possible causes -- bijectivity and absorption correlation
    -- that this design cannot separate.
  - Reporting a data volume in bytes requires the rate, so an unpinned rate changes the horizontal
    axis of every table without changing the mathematics.
  interpretation_limits:
  - The derived quantity is an internally derived counting expression under a stated idealisation.
    It is NOT a security bound, is not claimed to match any published bound, and must never be quoted
    as one.
  - Nothing here supports a rekeying recommendation, a deployment statement, or any claim about a
    device.
  - Agreement between the exact expression and a random-function simulation says nothing about a real
    permutation beyond the toy capacities actually simulated.
  - The gap between the idealisation and a permutation is named and left open; this experiment does
    not close it and does not attempt to.
  target_complexity:
    time_exponent: No attack exponent is claimed. The symbolic evaluation is polynomial in the grid
      size; the simulation is linear in sessions times session length.
    memory_exponent: No attack exponent is claimed. Simulation memory is linear in session length
      for the repetition-detection set; the symbolic half is negligible.
    best_known: The incumbent is the asymptotic form of the same counting quantity -- the birthday
      approximation this record derives from its own exact expression and then measures against. That
      is the only competitor this record names, deliberately, because naming a published bound as
      the incumbent would be an assertion about literature this program cannot make.
    hidden_overhead: 'Two hidden costs. First, high-precision arithmetic: at capacities above about
      60 bits, the exact-minus-asymptotic difference lives below double precision, so the whole tabulation
      must be done in exact rationals or extended precision, which is slower and easy to get silently
      wrong. Second, the sampling budget: distinguishing exact from asymptotic empirically at capacity
      20 requires enough sessions that the standard error is below the gap, and that requirement grows
      exactly as the gap shrinks -- a power calculation done after the fact would let the conclusion
      be chosen.'
  dominated_by: 'n/a (no result claimed). Pareto check across all three axes explicitly: time -- no
    attack time is produced, so no frontier row exists; memory -- no attack memory is produced, and
    the instrument''s own memory is linear in session length; data/queries -- the derivation is about
    data volume but produces no query-based attack, so there is no data-axis row to place either.
    Each axis was considered rather than the field defaulted.'
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative delta is an exact
    finite-product expression tabulated against its own asymptotic with a stated crossover volume
    and a simulation validation at toy capacity, where this repository previously held nothing on
    duplex data limits at all -- the rekey and data limit greps over ledger/proposals returned zero
    files.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Separately: that the exact expression is derived correctly and matches
    the random-function simulation, above 0.9, since it is elementary counting and the simulation
    is a direct check. That the biased-generator null is detected at its injected magnitude, above
    0.9, given an adequate sampling budget. That the exact/asymptotic ratio leaves the tolerance band
    somewhere on the tabulated grid, about 0.7, since the two forms are known to diverge at large
    session length relative to capacity and the grid is chosen to reach that regime. That the real-permutation
    arm departs measurably from the random-function arm at toy capacity, about 0.3, because at these
    widths bijectivity effects are small and hard to resolve. That the resulting table is treated
    by a Coordinator as usable rather than as a restatement of textbook counting, about 0.4 -- and
    the honest reason for that low figure is that the mathematics here is genuinely elementary, and
    the record''s value rests entirely on the constants being tabulated at real parameters and on
    the simulation check, not on any novelty in the derivation.'
