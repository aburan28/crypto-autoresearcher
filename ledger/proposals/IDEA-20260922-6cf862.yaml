  minimal_test:
    design: >-
      TWO PARTS, the first with zero compute. PART 1 (arithmetic, no run): an
      independent recomputation of the (C) table -- factor T^k - 1 over F_{2^16}
      for k in {11,13,17,19,23}, list the stable dimensions, and check against the
      hand derivations; recompute h = q + 1 - t against the five published
      cofactors and gcd(h, r) for the five published subgroup orders re-derived
      from ANSI X9.62 rather than from OpenSSL. Deliverable is a certificate file
      and five reachability-table cells, three of which are STRUCTURALLY EMPTY
      verdicts with their emptying fact. PART 2 (toy executable cells, n <= 41):
      subfield cells E/F_{2^d} over F_{2^{dk}} with dk <= 41 and k prime --
      (d,k) in {(4,5), (4,7), (3,11), (2,13), (8,5), (5,7)} subject to dk <= 41 and
      E(F_{2^d}) of order coprime to the target subgroup order. For each cell run
      an EXHAUSTIVE decomposition census at m in {2,3}: (a) factor base =
      E(F_{2^d}), targets in G -- expect zero, every time; (b) same base, targets in
      the cofactor subgroup -- expect the counting rate; (c) factor base = V_W for
      each phi-stable W of each available dimension, targets in G -- measure
      relations per attempt and the rank of the relation matrix in both the raw and
      the orbit-quotient basis; (d) size-matched NON-stable F_{2^d}-subspace, same
      targets. Cell (c) versus (d) is the stability contrast; cell (a) versus (b) is
      the reachability contrast. Every claimed decomposition carries a certificate
      re-verified by recomputing the sum on the curve.
    controls:
      - Positive control (b): the same empty base against targets in the cofactor subgroup, which must produce relations; without it (a)'s zero is uninterpretable.
      - Null object: an ordinary binary curve over F_{2^{dk}} defined over no proper subfield, same field size, same base sizes, where phi is not an endomorphism and no stability lattice exists.
      - Size-matched non-stable subspace (d), which isolates stability from size.
      - Orbit-union base of KN-FIND-47da4e at the same size, as the "is the coarse dimension lattice an artefact of demanding a subspace" control.
      - Solver-free ground truth: at these cell sizes the decomposition census is exhaustive, so no solver verdict is trusted without the enumeration agreeing.
    required_metrics:
      - independent_factor_count_of_T_k_minus_1_over_F_{2^16}_per_k
      - stable_subspace_dimension_set_per_k
      - cofactor_identity_check_per_curve
      - gcd_cofactor_subgroup_order_per_curve
      - relations_per_attempt_base_a_targets_in_G
      - relations_per_attempt_base_a_targets_in_cofactor
      - relations_per_attempt_stable_vs_size_matched_random
      - relation_matrix_rank_raw_basis_and_orbit_quotient_basis
      - orbit_canonicalisation_word_comparisons
      - certificate_pass_rate
  falsification_conditions:
    - Any decomposition of a target in G over the F_q-rational base, on any cell, with a verified certificate. That refutes (A) outright and, with it, IDEA-20260906-a77711's lemma.
    - An independent factorisation of T^k - 1 over F_{2^16} disagreeing with factor counts 3, 5, 17, 3, 3. That refutes (C)'s arithmetic.
    - A phi-stable F_{2^16}-subspace of F_{2^{16.11}} of dimension outside {0,1,5,6,10,11} exhibited explicitly. Same consequence.
    - Zero relations in the positive control (b). That marks the instrument, not the mathematics, and blocks reading (a) at all.
    - Orbit canonicalisation measured superlinear in k, which voids the quotient pricing and moves this record from "priced" to "open number".
  confounders:
    - The audit's parameters are OpenSSL's, a secondary source. A transcription error in one cofactor would move exactly one row's emptiness certificate; Part 1 re-derives from ANSI X9.62 for this reason.
    - Toy cells with small d have E(F_{2^d}) of order NOT coprime to the target subgroup order, in which case (A)'s hypothesis fails and the cell is not a test of it. Cells must be screened for coprimality before use, and screened-out cells reported.
    - A stable subspace and a random subspace of the same dimension differ in more than stability at very small d (the stable one may be forced to contain F_{2^d}); report whether F_{2^d} is contained, per arm.
    - Exhaustive census at m = 3 on the larger cells may exceed budget; a censored census reports a LOWER bound on relations and must never be read as a zero.
  interpretation_limits:
    - Proposal only. No experiment, no run, no approval, no result exists here.
    - >-
      KN-OPEN-020 CLASS DECLARATION. The F_q-rational base (A) is in the HIGH-DEGREE
      open class (membership predicate degree 2^16), and it fails for a reason
      outside that framework entirely. The phi-stable subspace base (C) is ALSO in
      the high-degree open class in the un-descended model (linearised-polynomial
      predicate of degree q^{k - dim W}) and is F_q-LINEAR in the descended model;
      which of the two degrees is cost-relevant is not settled here and is the
      subject of IDEA-20260922-153a90. Charged costs: description O(k) field
      elements (a basis of W); membership one F_q-linear test of rank k - dim W;
      relation, descent, time and memory as in target_complexity below. Neither base
      is target-dependent.
    - Nothing here says any index-calculus line on the five curves is feasible. (A) removes one line; (C) exhibits a lattice; the cost rows say the exhibited lines lose to rho at every design point checked.
    - The five deployed rows are computed, never run. The toy cells reach dk <= 41 against targets at 176-368, and the extrapolation distance is a factor 2^{135} to 2^{327} in group size. Nothing measured at a toy cell transfers without a stated assumption.
    - (C)'s correspondence is over the base field F_{2^16}. Subspaces stable only under a proper power of phi, and F_2-subspaces of F_{2^{16k}} stable under the full 2-power Frobenius (which is NOT an endomorphism of E here, since A, B are not in F_2), are different and larger lattices and are not counted.
  heuristic_assumptions:
    - id: H-6cf862-0
      statement: >-
        NONE FOR (A) OR (C). The emptiness certificate and the subspace census are
        unconditional finite arithmetic. Recorded so the absence is explicit and so
        no reader supplies a heuristic that is not there.
      rigorous_support: >-
        E(F_q) = ker(phi - 1) has order q + 1 - t (Weil); Lagrange plus gcd(h, r) = 1
        gives G n E(F_q) = {O}; normal basis theorem plus the ideal structure of
        F_q[T]/(T^k - 1) gives the subspace correspondence.
      validation_plan: >-
        Part 1 of the minimal test: independent factorisation of T^k - 1 over
        F_{2^16} at all five k, and re-derivation of h and r from ANSI X9.62. Scale:
        five integers and five polynomial factorisations, seconds.
    - id: H-6cf862-1
      statement: >-
        BALANCE HEURISTIC (used only to state the cost rows, never to claim). A
        decomposition index calculus over a factor base of size B ~ q^l with arity m
        on a group of size N ~ q^k succeeds per attempt with probability about
        B^m/(m! N) and needs about B relations, i.e. the design condition is
        ml >= k for the enumerated variant and (m-1)l >= k for the free-last-leg
        (Joux-Vitse) variant. This imitates the classical smooth-decomposition
        heuristic of Gaudry-Diem index calculus, whose prime-field analogue is the
        Dickman-de Bruijn rho(u) smoothness density: in both cases an m-fold sumset
        is assumed to hit a designed set at the rate a uniformly random sumset would.
      rigorous_support: >-
        None as an equality. The counting upper bound B^m/m! on the number of
        reachable targets is exact and is the only rigorous half; the claim that the
        rate is attained rather than merely bounded is the heuristic.
      validation_plan: >-
        Measure relations per attempt in cell (c) of the minimal test against the
        counting prediction B^m/(m! N), for each stable dimension, at every toy cell,
        with the size-matched random base (d) as the reference distribution and the
        non-subfield null as the third arm. Sample: exhaustive at m = 2 on all cells,
        and at least 10^5 sampled targets at m = 3. Check the TAIL as well as the
        mean: the distribution of relations per target against the Poisson law the
        counting model implies, by a chi-squared goodness-of-fit, because a matching
        mean with an over-dispersed tail is the signature of a designed base that
        concentrates its coverage (the failure mode IDEA-20260815-f9e978 names).
        Transfer assumption to the deployed rows, stated and never hidden: that the
        rate measured at dk <= 41 with q = 2^d, d <= 8 persists at q = 2^16 and
        k in {11,...,23}. That is an extrapolation of 2^{135} or more in group size
        and is why the deployed rows are computed under numbered assumptions rather
        than claimed.
    - id: H-6cf862-2
      statement: >-
        RHO BASELINE CONVENTION. The matched baseline is
        0.886 sqrt(r) / sqrt(2k) group operations: Pollard rho with negation
        (factor sqrt 2) and the order-k Frobenius class map (factor sqrt k),
        charged for memory and parallel efficiency under van Oorschot-Wiener.
      rigorous_support: >-
        The 0.886 = sqrt(pi/4) constant and the sqrt(|Aut|) symmetry gain are
        standard (KN-TECH-006 convention in this corpus); the arithmetic below is
        mine.
      validation_plan: >-
        Reproduce the convention against KN-LIT-096's 2^60.9 for ECC2K-130 before
        any of the five rows is quoted; a convention that does not reproduce that
        published number is the wrong convention and the rows are rewritten.
  heuristic_note: >-
    The record's two hard results carry no heuristic at all, and the cost rows carry
    exactly one (H-6cf862-1) plus the baseline convention (H-6cf862-2). The a-priori
    expectation is stated so no outcome can be read as "interesting" after the fact:
    (A) is expected to return zero everywhere and would be a major surprise
    otherwise; (C) is expected to reproduce by independent factorisation; and the
    cost rows are expected to show every exhibited design point LOSING to matched
    rho, because the decomposition subroutine at arity m ~ k/l with k >= 11 is the
    blocker and no lattice fact relieves it.
  target_complexity:
    time_exponent: >-
      No exponent moves. For the phi-stable base at dimension l and arity m, the
      relation-search system count falls by exactly k and the linear-algebra
      dimension by exactly k (cost by k^2), against a matched rho that falls by
      sqrt(2k): net movement of the index-calculus/rho ratio is sqrt(k/2), i.e.
      2^1.16 (k=11) to 2^1.79 (k=23). Charged deployed rows, my arithmetic, matched
      rho at 0.886 sqrt(r)/sqrt(2k) group operations:
      c2pnb176v1 2^78.1, c2pnb208w1 2^94.0, c2pnb272w1 2^125.8,
      c2pnb304w1 2^141.7, c2pnb368w1 2^173.6. Against these, the smallest stable
      base satisfying the free-leg balance (m-1)l >= k at m <= 5 has size q^l with
      l >= ceil(k/4): l = 5 (k=11, available), l = 4 (k=13, available), l = 5
      (k=17, available), l = 9 (k=19, available), l = 11 (k=23, available) -- giving
      base sizes 2^80, 2^64, 2^80, 2^144, 2^176 and linear-algebra dimensions of the
      same order, which are at or above the rho figures on four of the five rows
      before a single decomposition is attempted. c2pnb208w1 at (l,m) = (4,5) is the
      one row where the base size 2^64 sits below rho at 2^94; that row is where the
      decomposition subroutine cost, not the base size, decides, and it is the row a
      cost table should charge first.
    memory_exponent: >-
      Relations stored ~ |V| = q^l, i.e. 2^{16l}; with the orbit quotient, q^l/k.
      Sparse linear algebra over F_r at dimension q^l/k with about m nonzeros per
      row. On the c2pnb208w1 (4,5) row that is 2^64/13 ~ 2^60.3 rows -- beyond any
      real machine and stated as such.
    best_known: >-
      Matched Pollard rho with negation and the order-k Frobenius class map, as
      computed above. No published index-calculus attack on any of these five curves
      is known to this record.
    hidden_overhead: >-
      DISCLOSED AND DOMINANT: the per-attempt decomposition cost at arity m >= 4
      over F_{2^16}. Semaev's S_{m+1} has degree 2^{m-1} in each variable, and the
      Weil-descended system at k = 11..23 has 16.l.(m-1) Boolean unknowns at the
      smallest design points. Gaudry's q^{2 - 2/k} exponent is asymptotic in q at
      FIXED k and hides a constant that is at least m! and at worst doubly
      exponential in k; at k = 11 with q = 2^16 that constant, not the exponent,
      decides. This record does not estimate it and says so.
    tradeoff_note: >-
      The orbit quotient is a pure win in memory (factor k) at O(k) word comparisons
      per insertion, and is therefore the one part of this design that should be
      taken regardless of the rest. Parallelization position: relation search is
      embarrassingly parallel; linear algebra at dimension q^l/k is not, and on
      these rows it is the binding memory constraint, which is the opposite of rho's
      position under van Oorschot-Wiener.
  estimated_cost:
    implementation: low
    compute: low
    qualification: >-
      Part 1 is five polynomial factorisations over F_{2^16} and ten integer checks:
      seconds, and it delivers three reachability-table cells on its own. Part 2
      reuses the subfield-cell machinery the FROB line already has and adds a
      cofactor-target arm and a rank-in-two-bases readout; single machine, hours.
  asymptotic_claim:
    problem: ECDLP in the prime-order subgroup of the five composite-degree ANSI X9.62 binary curves (subfield curves E/F_{2^16} over F_{2^{16k}}, k in {11,13,17,19,23})
    prior_best: Pollard rho with negation and the order-k Frobenius class map, 0.886 sqrt(r)/sqrt(2k) group operations
    time_exponent: 1/2 (unchanged); the Frobenius quotient moves a constant k against rho's sqrt(2k), net sqrt(k/2)
    memory_exponent: unchanged for rho; the index-calculus line proposed here needs q^l/k storage, which is its binding constraint
    hidden_cofactor: the arity-m decomposition constant, at least m!, disclosed and not estimated
    claim_kind: structural_emptiness_plus_constant_factor
  dominated_by: >-
    Matched Pollard rho, per curve: 2^78.1 (c2pnb176v1), 2^94.0 (c2pnb208w1),
    2^125.8 (c2pnb272w1), 2^141.7 (c2pnb304w1), 2^173.6 (c2pnb368w1), my arithmetic
