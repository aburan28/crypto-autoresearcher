    the kangaroo family, dominated by rho here. Stated as "dominated on time by
    matched rho at every deployed row and every design point exhibited" after
    checking those rows.
  sota_delta:
    time: >-
      Zero exponent movement. Constant movement sqrt(k/2) in the index-calculus/rho
      RATIO if the Frobenius quotient is taken: 2^1.16, 2^1.30, 2^1.50, 2^1.62,
      2^1.79 at k = 11, 13, 17, 19, 23. Against the absolute frontier (rho) the
      delta is negative at every design point exhibited.
    memory: >-
      Factor k reduction in relation storage and linear-algebra dimension from the
      orbit quotient; still q^l/k, which exceeds any real machine on all five rows.
    data_queries: Not applicable; single target, no advice, no preprocessing.
  frontier_check:
    status: pending
    note: >-
      The corpus entry for KN-LIT-796 is abstract-level and its "not verified here"
