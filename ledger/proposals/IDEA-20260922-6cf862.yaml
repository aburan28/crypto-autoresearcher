idea:
  id: IDEA-20260922-6cf862
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    On the five composite-degree ANSI curves the SUBFIELD-RATIONAL factor base is
    structurally empty in the prime-order subgroup with a one-line certificate --
    E(F_{2^16}) IS the published cofactor group -- and the surviving object is the
    phi-stable F_{2^16}-subspace lattice, whose deployed census is computed here:
    d = ord_k(2^16) = 5, 3, 1, 9, 11 for k = 11, 13, 17, 19, 23, so c2pnb272w1 alone
    carries a Frobenius-stable factor base of EVERY dimension 0..17
  class: representation
  claim: >-
    SETTING. The five composite-degree ANSI X9.62 binary curves are subfield curves
    E/F_q with q = 2^16, attacked over F_{q^k}, k prime: c2pnb176v1 (k = 11),
    c2pnb208w1 (13), c2pnb272w1 (17), c2pnb304w1 (19), c2pnb368w1 (23)
    (analysis/binstd-curve-audit/, computed in this repository 2026-09-22 from
    OpenSSL 3.0.13 named-curve parameters; secondary source). phi denotes the
    q-power Frobenius, an endomorphism of E because A, B lie in F_q. G is the
    prime-order subgroup of order r (161, 193, 257, 289, 353 bits respectively),
    h the published cofactor.

    (A) THE SUBFIELD-RATIONAL FACTOR BASE IS EMPTY IN G, AT DEPLOYED PARAMETERS,
    WITH A CERTIFICATE AND NO COMPUTE. The most obvious structurally described,
    target-independent factor base on a subfield curve is F_sub = E(F_q) itself:
    description length O(1) ("the F_{2^16}-rational points"), membership decided by
    the single Frobenius fixed-point test x^{2^16} = x and y^{2^16} = y, size
    h ~ 2^16. It decomposes NOTHING in G. E(F_q) = ker(phi - 1) is a subgroup of
    order exactly #E(F_q) = q + 1 - t, and the audit certifies for each of the five
    that this integer IS the published cofactor h -- t was read off h and the Weil
    recursion s_{i+1} = t s_i - q s_{i-1} then reproduced the published group order
    exactly, which is a nontrivial consistency check, not a definition. Since r is
    prime and r > h (161 > 16 bits at the smallest row), gcd(h, r) = 1, so
    G n E(F_q) = {O}. Every F_q-rational combination sum a_i P_i with P_i in E(F_q)
    lies in E(F_q); a target R in G, R != O, is therefore never such a sum. The
    cell (curve = any of the five, line = subfield-rational factor base) is
    STRUCTURALLY EMPTY in the sense RQ-BINSTD-b6f698's decision target defines,
    for all five rows, and the emptying fact is h = #E(F_q) with gcd(h, r) = 1.
    The general lemma is NOT new -- IDEA-20260906-a77711 states it for E/F_q over
    F_{q^n} at toy scale ("because G meets E(F_q) only in O, a target R in G is
    NEVER a sum of F_q-rational points"). What is added here is the deployed
    instantiation with the certificate, and the observation in (B).

    (B) WHAT (A) SAYS ABOUT KN-OPEN-020, AND IT IS NOT A DEGREE STATEMENT. F_sub
    is not a bounded-degree algebraic factor base: its membership predicate
    x^{2^16} - x = 0 has degree 2^16, so it sits squarely in KN-OPEN-020's
    HIGH-DEGREE open class, the class the prime-field no-go does not reach. It
    nevertheless fails completely, and the obstruction has nothing to do with
    description degree, Bezout, or coverage exponent: it is the coprimality of the
    cofactor with the subgroup order. This is a second, independent obstruction
    living inside KN-OPEN-020's open class, and it is worth recording as such
    because the open class has so far been treated in this corpus as an
    unobstructed frontier.

    (C) THE SURVIVING OBJECT AND ITS DEPLOYED CENSUS, COMPUTED HERE. The repair is
    a phi-STABLE base rather than a phi-FIXED one: V_W = {P in E(F_{q^k}) :
    x(P) in W} for W an F_q-subspace of F_{q^k} with W^q = W. By the normal basis
    theorem F_{q^k} is free of rank one over R = F_q[T]/(T^k - 1) with T acting as
    phi, so the phi-stable F_q-subspaces are exactly the ideals of R, i.e. the monic
    divisors of T^k - 1 over F_q, with dim_{F_q}(g) = k - deg g. This is
    IDEA-20260918-9abf42's correspondence with the base field F_2 replaced by
    F_{2^16}; that record explicitly scopes the larger base field OUT ("stability
    over a larger base field is a different lattice"), so the deployed lattice below
    is the complement of its declared scope. For k an odd prime, T^k - 1 =
    (T - 1) Phi_k with Phi_k splitting over F_q into (k - 1)/d distinct irreducibles
    of degree d = ord_k(q) = ord_k(2^16), giving exactly 2^{1 + (k-1)/d} stable
    subspaces with dimension set {0, 1} + d.{0, 1, ..., (k-1)/d}.
    MY ARITHMETIC, derived here by hand from ord_k(2^16) = ord_k(2)/gcd(ord_k(2), 16):
      k = 11: ord_11(2) = 10, gcd(10,16) = 2, d = 5;  2^16 = 9 mod 11, 9^5 = 1 mod 11.
              f = 1 + 10/5 = 3, 8 stable subspaces, dims {0,1,5,6,10,11}.
      k = 13: ord_13(2) = 12, gcd(12,16) = 4, d = 3;  2^16 = 3 mod 13, 3^3 = 27 = 1.
              f = 1 + 12/3 = 5, 32 stable subspaces, dims {0,1,3,4,6,7,9,10,12,13}.
      k = 17: ord_17(2) = 8,  gcd(8,16)  = 8, d = 1;  2^16 = 1 mod 17 (2^8 = 256 = 1).
              f = 1 + 16/1 = 17, 2^17 stable subspaces, dims EVERY j in {0,...,17},
              with C(17, j) subspaces of dimension j.
      k = 19: ord_19(2) = 18, gcd(18,16) = 2, d = 9;  2^16 = 5 mod 19, 5^9 = 1 mod 19.
              f = 1 + 18/9 = 3, 8 stable subspaces, dims {0,1,9,10,18,19}.
      k = 23: ord_23(2) = 11, gcd(11,16) = 1, d = 11; 2^16 = 9 mod 23, ord(9) = 11.
              f = 1 + 22/11 = 3, 8 stable subspaces, dims {0,1,11,12,22,23}.
    CONSEQUENCE, STATED AS THE DELIVERABLE. c2pnb272w1 is the unique row among the
    five on which the phi-stable factor-base dimension is a FREE INTEGER parameter:
    X^17 - 1 splits into 17 distinct linear factors over F_{2^16}, F_{2^272} is a
    direct sum of 17 phi-eigenlines, and a complete flag of phi-stable subspaces
    W_1 subset ... subset W_17 exists. On the other four the dimension lattice is
    coarse (jumps of 5, 3, 9, 11), so the designer cannot tune |V| to the balance
    condition and must round, at a charged cost this record computes.
    Representation class R1 (field representation of the x-coordinate, restricted
    to an F_q-submodule of F_{q^k}); the attack stage whose charged cost it claims
    to change is factor-base MEMBERSHIP and relation-search system count, not the
    solving degree.
  mechanism: >-
    OBJECT FRAME. Representation: the x-coordinate of a point of E(F_{q^k}) as a
    vector in the F_q[T]/(T^k - 1)-module F_{q^k}, coordinates in a normal basis
    theta, theta^q, ..., theta^{q^{k-1}}, in which phi is the cyclic coordinate
    shift. Operation set Sigma: translation by factor-base elements TOGETHER WITH
    the cyclic group <phi> of order k. Sigma is not the full translation action.
    Trichotomy: PARTIAL-ACTION (Class I). The tracked object is the relation vector
    over the orbit-quotient factor base; it propagates only under translation by
    factor-base elements, exactly as index calculus does, with <phi> acting on the
    index set of the base rather than on the relation semantics.

    LOSSY-PROJECTION TEST AGAINST THAT SIGMA. The projection is
    pi : E(F_{q^k}) -> (relation coordinate) sending P in V_W to its <phi>-orbit
    index. It DISCARDS which of the k conjugates of the orbit representative the
    point is -- log_2 k bits per factor-base leg. The discard is Sigma-compatible
    because W is phi-stable, so phi permutes V_W and the orbit partition is a block
    system for <phi> acting on V_W (IDEA-20260901-863e36), and because phi acts on
    G as a scalar lambda, so a relation over orbit representatives determines the
    relation over any conjugate by the factor lambda^j. It IS lossy in the
    representation actually used: two conjugate points have different normal-basis
    coordinate vectors (the shift is fixed-point-free off F_q), so the projection
    is not a change of coordinates. It is NOT lossy for the F_q-rational points --
    and by (A) those are precisely the points that cannot appear in a relation at
    all, so the degenerate fibre of the projection is exactly the empty part of the
    factor base. That coincidence is the structural content of pairing (A) with (C).

    THE PRICED OPEN NUMBER: orbit canonicalisation. A quotient object owes the cost
    of canonicalising a <phi>-orbit. In the normal basis phi is a cyclic shift, so
    the canonical representative of an orbit is the lexicographic minimum of k
    cyclic rotations of a k-word vector over F_q -- Booth's algorithm, O(k) word
    comparisons, no field arithmetic. That is the number this record charges, and
    it is charged per factor-base insertion and per relation leg, not per attempt.

    WHY (A) IS NOT A CURIOSITY. It removes the one factor base a designer would
    reach for first on these curves, and it removes it for a reason that is invisible
    to every cost model in this corpus, all of which charge description, membership,
    relation and descent but none of which charges SUBGROUP REACHABILITY. The
    reachability table RQ-BINSTD-b6f698 wants needs a column for it.

    OFF-LIMITS COMPONENTS USED, NAMED. F2 (factor-base decomposition) is the
    declared component; what is added beyond "index calculus on curve X" is (i) a
    structural-emptiness certificate for a specific named base on five named
    deployed rows, (ii) the deployed phi-stable dimension lattice over F_{2^16},
    which no record in this corpus has computed, and (iii) the observation that the
    emptiness obstruction lives inside KN-OPEN-020's high-degree open class and is
    not a degree obstruction. F6 (endomorphism orbit) is a component of the quotient
    construction and is named as such.
