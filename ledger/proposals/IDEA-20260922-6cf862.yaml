  recommended_priority: high
  priority_rationale: >-
    Highest information per unit cost in this lane. Part 1 costs seconds and fills
    reachability-table cells that RQ-BINSTD-b6f698 names as its decision target,
    including three STRUCTURALLY EMPTY verdicts WITH certificates -- which the
    question explicitly counts as a result rather than a non-result. It is also the
    prerequisite for the other four records in this lane: IDEA-20260922-1b16d7's
    graded large-prime construction exists only because d = ord_17(2^16) = 1 gives
    c2pnb272w1 a complete flag, and IDEA-20260922-261004's rank accounting needs the
    stable lattice to be non-empty. Not "high" because it moves an exponent -- it
    moves none, and says so -- but because it is a cheap building block of the
    population-indexed table the question exists to build, and because (B) records a
    second obstruction inside KN-OPEN-020's open class that this corpus had been
    treating as unobstructed.
  first_deliverable: >-
    A certificate file under analysis/ containing: the independent factorisation of
    T^k - 1 over F_{2^16} for k in {11,13,17,19,23} with factor degrees and counts;
    the stable-dimension set per k; h = q + 1 - t checked against the five published
    cofactors and gcd(h, r) for five subgroup orders re-derived from ANSI X9.62; and
    five reachability-table cells for the column "subfield-rational factor base",
    each reading STRUCTURALLY EMPTY with its emptying fact.
  next_gate: >-
    Coordinator decision on whether Part 1 is filed as an analysis artefact (a
    pre-compute falsification check, not evidence) or designed into an
    EXP-BINSTD-* contract together with Part 2's toy cells.
