    different lane); Gaudry's abelian-variety q^{2-2/g} row; Joux-Vitse small-degree
    extension; the quasi-subfield-polynomial line (RQ-QSP-f9bbdb, whose census is
    over F_2 and does not cover q = 2^16); multi-target and preprocessing S.T^2
