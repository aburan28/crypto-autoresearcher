    rows sit; neither carries a claim here.
  assumptions:
    - k is an odd prime and q = 2^16, so T^k - 1 = (T-1) Phi_k over F_q is squarefree and Phi_k splits into equal-degree factors. All five rows satisfy this.
    - r is prime and r > h. True for all five rows at the published parameters (161-bit r against 16-bit h at the smallest).
    - The normal basis theorem for F_{q^k}/F_q, classical.
    - Uses F2 (factor-base decomposition) and F6 (endomorphism orbit) as declared components; the proposal is not an instance of either alone.
    - Arithmetic only at deployed parameters. Nothing here runs an attack at m >= 131; the five curves appear as computed rows.
  proof_search_map:
    bottleneck: >-
      Before any cost can be charged for an index-calculus line on the five
      composite-degree ANSI curves, someone must say WHAT the factor base is. The
      two structurally described candidates are the F_q-rational points and the
      phi-stable F_q-subspaces. Nothing in this corpus has checked whether either
      exists at a usable size on these specific deployed rows, and the first is
      empty for a reason no cost model charges.
    baseline_embedding:
      parameter_slice: >-
        IDEA-20260918-9abf42's closed form at base field F_2 must be reproduced
        exactly when q is set to 2: f = 1 + (n-1)/ord_n(2), dimension set
        {0,1} + ord_n(2).{0,...,(n-1)/ord_n(2)}, and at n = 131 exactly four
        subspaces of dimensions 0, 1, 130, 131.
      reproduction_check: >-
        SYMBOLIC AND ARITHMETIC, ZERO COMPUTE. (i) Setting q = 2, k = 131 in the
        formula of (C) must return f = 2 and dims {0,1,130,131}; a disagreement
        refutes (C)'s derivation rather than 9abf42's. (ii) The five hand
        derivations must each survive an independent factorisation of T^k - 1 over
        F_{2^16}: the number of irreducible factors must be 3, 5, 17, 3, 3. (iii)
        The cofactor identity h = q + 1 - t must reproduce the audit's five
        cofactors from the audit's five traces: 65536 + 1 - 147 = 65390,
        65536 + 1 - 441 = 65096, 65536 + 1 - 251 = 65286, 65536 + 1 - 467 = 65070,
        65536 + 1 - 145 = 65392. All five check by inspection.
    observation_collision:
      observable: >-
        The pair (number of phi-stable F_q-subspaces, their dimension set) at each
        k, and the boolean "is there a phi-stable subspace of dimension l with
        (m-1)l >= k for some m <= 5".
      distinct_preimage_search: >-
        Two distinct mechanisms could produce a coarse dimension lattice: a genuine
        arithmetic fact about ord_k(2^16), or an artefact of restricting to
        SUBSPACES rather than to stable SETS. The distinguishing preimage is the
        orbit-union family of KN-FIND-47da4e, which is stable at every size; if the
        coarse lattice were an artefact, orbit unions would relieve it at no cost,
        and KN-FIND-47da4e measures that they do not (ratio 1.00-1.47, never below
        one). Reported as the control, not as support.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: The <phi>-orbit class of a factor-base point, canonicalised by cyclic minimisation in a normal basis
        predicted_gain: >-
          Relation-search system count / k, linear-algebra dimension / k, at
          O(k) word comparisons per canonicalisation; matched rho also gains
          sqrt(2k), so the NET gap movement is sqrt(k/2) and no exponent moves.
      - transform: representation_reduction
        proposed_object: The factor base as an F_q[T]/(T^k - 1)-ideal rather than an F_2-subspace of F_{2^{16k}}
        predicted_gain: >-
          Membership becomes an F_q-linear test of rank k - dim W instead of an
          F_2-linear test of rank 16k - 16 dim W; identical predicate, k-times
          fewer rows.
    quantifier_order: >-
      FOR EACH of the five k there EXISTS a computable finite lattice of phi-stable
      F_{2^16}-subspaces, exhibited in closed form; and FOR EACH of the five rows,
      FOR EVERY target R in G and FOR EVERY multiset of points of E(F_{2^16}), the
      sum is not R. The second quantifier order is the strong one and is the
      emptiness certificate; the first is a census.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On each of c2pnb176v1/208w1/272w1/304w1/368w1 the F_{2^16}-rational factor
        base yields zero relations for any target in the prime-order subgroup,
        because E(F_{2^16}) has order exactly the published cofactor and that
        cofactor is coprime to r; and the phi-stable F_{2^16}-subspaces of
        F_{2^{16k}} number 2^{1 + (k-1)/d} with d = ord_k(2^16) = 5, 3, 1, 9, 11,
        so only c2pnb272w1 admits stable subspaces of every dimension." That is the
        ceiling. It certifies NOTHING about whether any phi-stable base yields a
        cost below rho, nothing about solving degree, nothing about any curve of
        prime extension degree, and nothing about factor bases that are not
        F_{2^16}-subspaces.
      nearby_object_control: >-
        TWO, BOTH BLOCKING. (i) PROVES-TOO-MUCH: the same emptiness argument run on
        a toy subfield cell E/F_{2^4} over F_{2^{20}} (k = 5) must also return
        empty for the F_{2^4}-rational base -- and it must NOT return empty for a
        target chosen in the cofactor subgroup, where the base trivially works. An
        argument that cannot see that distinction is proving too much. (ii) NULL
        OBJECT: a curve over F_{2^{16k}} defined over no proper subfield (a c2tnb
        row, or a toy random binary curve at the same field size), where phi is not
        an endomorphism, E(F_q) is not a subgroup of E(F_{q^k}) in the relevant
        sense, and neither (A) nor (C) has content. Any measured effect that
        survives the null is an instrument artefact.
    proof_obligations:
      - claim: E(F_q) = ker(phi - 1) is a subgroup of E(F_{q^k}) of order exactly q + 1 - t.
        responsibility: correctness
      - claim: h = q + 1 - t equals the published cofactor for each of the five rows.
        responsibility: baseline
      - claim: gcd(h, r) = 1 for each of the five rows, hence G n E(F_q) = {O}.
        responsibility: correctness
      - claim: phi-stable F_q-subspaces of F_{q^k} correspond to monic divisors of T^k - 1 over F_q (normal basis + PID).
        responsibility: correctness
      - claim: d = ord_k(2^16) = 5, 3, 1, 9, 11 at k = 11, 13, 17, 19, 23.
        responsibility: correctness
      - claim: The derived rho rows use the curve's own symmetries (negation and the order-k Frobenius class map), per the question's baseline constraint.
        responsibility: baseline
      - claim: Nothing in (A)-(C) bounds any solving-stage cost.
        responsibility: scope
