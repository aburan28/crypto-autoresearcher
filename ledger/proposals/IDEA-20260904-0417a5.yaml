idea:
  id: IDEA-20260904-0417a5
  id_allocation_provenance: >-
    Minted by the Coordinator via `python3 tools/allocate_id.py --next idea
    --date 20260904`, checked free via `--check` before use (0 occurrences
    across 147905 identifier-bearing paths). No identifier was minted by the
    drafting subagent, per its own note (it has no Bash/shell tool).
  question_id: RQ-MONO-001
  added: '2026-09-04'
  status: proposed
  proposed_by: idea-generator
  class: mechanism

  title: >-
    HEUR-KUM-2 IS NOT A HEURISTIC, IT IS A ONE-LINE NONDEGENERACY LEMMA -- AND
    THE SAME LEMMA SIMULTANEOUSLY SETTLES THE SYMMETRIC-BASE EQUALITY. A
    zero-compute proof that the ONLY thing standing between H-MONO-45183a Part
    A's containment and an exact monodromy determination, at every m >= 4 and
    over both the ordered and the symmetric base, is the statement that no
    signed subset sum of GENERIC points is 2-torsion.

  claim: >-
    SCOPE FIRST. Any field k with char k > 3, any non-singular
    E : y^2 = f(x) = x^3 + Ax + B over k, any m >= 3, x_1..x_{m-1}
    INDETERMINATES. No finite-field specialization, no ECDLP claim, no cost
    claim, no exponent claim. Claim tier: derivation.

    THE CLAIM, IN THREE PARTS.

    (D1) THE SINGLE NONDEGENERACY FACT. Over K_ord = k(x_1,..,x_{m-1}), with
    P_i = (x_i, y_i) the generic points and V = F_2^{m-1}/<(1,..,1)>, no
    nontrivial element of V fixes any root R_u = x(sum eps_i P_i): a nonzero
    class [w] fixing R_u would force 2 * (sum_{i in supp w} eps_i P_i) = O, i.e.
    a nonempty signed subset sum of the generic points lying in E[2]. That is
    impossible because the generic points are algebraically independent over k:
    a signed subset sum in E[2] is a nontrivial algebraic relation among the
    x_i, and the x_i are indeterminates. HENCE the translation action of V on
    the 2^{m-2} roots is FREE, hence regular, hence transitive, hence
    S_m(x_1..x_{m-1},T) IS IRREDUCIBLE over K_ord and the monodromy over the
    ordered base is EXACTLY (Z/2)^{m-2}, for every m >= 3, every field of
    characteristic > 3 and every non-singular E.

    (D2) HEUR-KUM-2 IS DISCHARGED. H-MONO-45183a lists as its own weakest link
    HEUR-KUM-2 -- "for all m >= 4, S_m is irreducible over k(x_1..x_{m-1}), so
    the containment of HEUR-KUM-1 is an equality" -- with "NONE, AND THIS IS THE
    RECORD'S WEAKEST MATHEMATICAL LINK" as its random-model justification, and
    EV-MONO-efbd1c records it as "formally unproven at m >= 4", corroborated
    empirically by G8 but not proved. (D1) is a proof of exactly that statement.
    If it survives review, Part A upgrades from a CONTAINMENT plus a measured
    heuristic to an EXACT DETERMINATION, unconditionally, at every m.

    (D3) THE SAME LEMMA SETTLES THE SYMMETRIC BASE, WHERE IT IS NOT VACUOUS.
    Over K_sym = k(e_1,..,e_{m-1}), the monodromy is contained in
    V semidirect S_{m-1} acting on V by affine maps (companion proposal, claim
    C2/C3). (D1) gives the translation part exactly; the descent
    Gal(K_ord/K_sym) = S_{m-1} gives the linear part, and the map
    S_{m-1} -> Aut(V) is INJECTIVE for every m >= 4 (a coordinate permutation
    acting trivially on V would have to send a weight-1 vector to a weight-(m-2)
    vector, impossible for m >= 4). Hence the symmetric-base monodromy is
    EXACTLY V semidirect S_{m-1}, of order 2^{m-2}(m-1)!, and its exceptional
    locus is EMPTY -- the same shape of conclusion H-MONO-0b3def proves at m = 3
    by inertia generation, obtained here uniformly in m by a different route.
    At m = 4 this group is AGL(2,2) = S_4, the FULL symmetric group on the four
    roots; at m >= 5 it is a PROPER, IMPRIMITIVE subgroup of Sym(2^{m-2}).

    THE TWO OUTCOMES. (I) (D1) survives independent re-derivation: KN-OPEN-009's
    exceptional-locus branch is CLOSED for the geometric monodromy of the
    summation cover over both bases at every m, by derivation and not by census,
    and the surviving open content is arithmetic-versus-geometric at finite p
    and the relation-rate half. (II) (D1) fails -- most plausibly because the
    step "a signed subset sum in E[2] is a nontrivial algebraic relation among
    the x_i" is not as immediate as it reads once the sum passes through the
    addition law's denominators, or because the generic points are NOT
    independent in the required sense over a base already containing the y_i.
    Then HEUR-KUM-2 is genuinely a heuristic, the exceptional locus is live, and
    the m >= 4 census the goal deferred becomes necessary for a reason nobody
    currently has.

  mechanism: >-
    DERIVED HERE. The only imported ingredients are H-MONO-45183a A-1 (the fibre
    of S_m is the signed-sum set, deg_T S_m = 2^{m-2}) and A-2 (the splitting
    field lies in the Kummer compositum, so the group embeds in V), both already
    `supported_scoped`, and neither is reproved.

    STEP 1 (WHAT IS MISSING, PRECISELY). A-2 proves CONTAINMENT: Gal embeds in
    V = F_2^{m-1}/<diag> and V acts on the 2^{m-2} roots by translation of the
    index. Containment plus a translation action gives equality as soon as the
    action is FAITHFUL, because a faithful translation action of a group on
    itself is regular and therefore transitive, and transitivity is exactly
    irreducibility. So the whole of HEUR-KUM-2 reduces to faithfulness, i.e. to
    "no nontrivial [w] in V fixes a root". H-MONO-45183a never makes this
    reduction; it treats irreducibility as an independent assumption. THE
    REDUCTION IS THE RECORD'S FIRST CONTRIBUTION AND IT IS FREE.

    STEP 2 (FAITHFULNESS AS A TORSION STATEMENT). Fix a sign vector eps and a
    nonzero class [w] with support S, a proper nonempty subset of {1..m-1}.
    Write Q_S = sum_{i in S} eps_i P_i and Q_S' = sum_{i not in S} eps_i P_i.
    Flipping the signs on S sends the root x(Q_S + Q_S') to
    x(-Q_S + Q_S') = x(Q_S - Q_S'). Since x(A) = x(B) iff A = +-B, the root is
    fixed iff Q_S + Q_S' = +-(Q_S - Q_S'), i.e. iff 2 Q_S = O or 2 Q_S' = O.
    This is the SAME criterion H-MONO-45183a's own Part B step B-1 uses on the
    factor-base sublocus; the observation here is that the identical criterion,
    read over the GENERIC function field instead of over a finite specialization,
    is what decides Part A's equality. PARTS A AND B ARE THEREFORE THE SAME
    COMPUTATION READ AT TWO LOCI -- which is a sharper form of the coupling
    EV-MONO-efbd1c's red team already discovered empirically (Part B's
    E[2]-collisions are literally the filter driving Part A's exclusion
    stratum). This record's second contribution is to name that coupling
    structurally rather than as an artifact.

    STEP 3 (WHY THE TORSION CONDITION FAILS GENERICALLY). 2 Q_S = O with S
    nonempty means Q_S in E[2], hence y(Q_S) = 0. y(Q_S) is a rational function
    of the x_i and y_i, so y(Q_S) = 0 is a nontrivial algebraic condition on
    (x_1,..,x_{m-1}) over k(A,B); since the x_i are indeterminates, it can only
    hold identically, which would force E[2] to absorb the whole image of the
    summation map -- contradicted already at |S| = 1, where Q_S = eps_i P_i and
    P_i in E[2] forces f(x_i) = 0, false for an indeterminate x_i and squarefree
    f. THE HONEST GAP, STATED RATHER THAN GLOSSED: for |S| >= 2 this argument
    needs "the summation map is dominant onto E", or an explicit specialization
    witness. The cheapest repair is a SPECIALIZATION ARGUMENT: it suffices to
    exhibit, for each m, ONE point over some field where all 2^{m-2} roots are
    distinct and the four (resp. 2^{m-2}) sign classes are pairwise
    non-colliding, since faithfulness at one specialization implies faithfulness
    generically. That witness is cheap to produce and is this record's stage 1.

    STEP 4 (THE DESCENT, AND WHY IT IS NOT VACUOUS AT m >= 4). The injectivity
    of S_{m-1} -> Aut(V) is elementary: pi acts trivially on V iff for every i,
    pi(e_i) is congruent to e_i modulo the all-ones vector; pi(e_i) is a
    standard basis vector, and e_i + (1,..,1) has weight m-2, so for m >= 4 the
    two cannot coincide and pi(i) = i. AT m = 3, m - 2 = 1 and the argument
    fails -- correctly, since V there has order 2 and Aut(V) is trivial. That is
    the precise sense in which m = 4 is the first non-degenerate arity, and it
    is a DIFFERENT reason from the one DEC-20260802-a51c82 D-3 gives (deg_T = 2
    forces primitivity at m = 3); the two reasons agree, which is a consistency
    check on both.

    THE LOSSY-PROJECTION TEST. This proposal tracks a GROUP, not a statistic, so
    the test applies to the reduction rather than to a measurement: the map
    "monodromy element |-> its action on the 2^{m-2} roots" is genuinely lossy
    (it forgets which square roots were flipped, retaining only the induced
    permutation), and (D1) is precisely the assertion that on this cover the
    loss is ZERO for the translation part -- i.e. the projection is injective on
    V. Stating that a projection is injective is not a change of coordinates; it
    is the content. The place where information IS lost, and lost compatibly, is
    the passage from the labelled affine element (pi, w) to its conjugacy class,
    which is the companion census's object.

  novelty_status: adaptation
  novelty_status_note: >-
    The mathematics is elementary and is claimed as such: a faithful translation
    action is regular; x(A) = x(B) iff A = +-B (already in this repo as
    H-MONO-45183a B-1); a permutation acting trivially on F_2^n/<diag> is the
    identity for n >= 3. The CONTRIBUTION is the reduction of an assumption this
    program already carries as its named weakest link (HEUR-KUM-2, unproven per
    EV-MONO-efbd1c's own limitations list) to that elementary fact, plus the
    observation that Part A's equality and Part B's collision criterion are one
    computation at two loci. Grepped ledger/ for "HEUR-KUM-2|irreducib"; the
    matches in H-MONO-45183a and EV-MONO-efbd1c state the assumption as
    unproven, and no record offers a proof. NO EXTERNAL SOURCE WAS READ IN THIS
    SESSION; the external arm is therefore UNVERIFIED and a reviewer with
    retrieval should check whether irreducibility of summation polynomials over
    the generic function field is already published (a plausible location is the
    literature following Semaev 2004 and Gaudry/Diem; RECALLED ONLY, not read,
    and not support).

