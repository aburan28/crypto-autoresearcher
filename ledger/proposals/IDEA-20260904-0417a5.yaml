  assumptions:
    - char k > 3; E non-singular; short Weierstrass form; m >= 3.
    - >-
      The x_i are INDETERMINATES. Every statement is about the generic fibre;
      nothing is claimed about any specialization, and in particular nothing is
      claimed about the factor-base locus, where EV-MONO-a0a89c OBS-5 shows the
      cover splits completely and the group's action degenerates.
    - >-
      A-1 and A-2 are used as established (`supported_scoped` via
      EV-MONO-efbd1c) and are not reproved. If either is wrong this proposal
      falls with it.

  proof_search_map:
    bottleneck: >-
      STEP 3 for |S| >= 2: whether "a nonempty signed subset sum of generic
      points lies in E[2]" is genuinely impossible over the generic function
      field, or only obviously impossible for |S| = 1. Everything else in the
      record is elementary. If STEP 3 needs a dominance or specialization
      argument, that argument is the whole cost of the proposal, and it is
      cheap; if it needs something stronger, HEUR-KUM-2 stays a heuristic and
      the record's honest outcome is (II).
    baseline_embedding:
      parameter_slice: >-
        m = 3, where the answer is already committed twice over: EV-MONO-a0a89c
        OBS-2 (monodromy S_2 for every non-singular E, no exceptional locus,
        proved via disc_T S_3 = 16 f(x_1) f(x_2)) over the ordered base, and
        EV-MONO-7c216b / H-MONO-0b3def (D_4, empty exceptional locus) over the
        symmetric base.
      reproduction_check: >-
        SYMBOLIC AND FREE. Setting m = 3 in (D1) gives V of order 2 acting
        freely on 2 roots, i.e. S_2 -- exactly OBS-2, obtained WITHOUT the
        degree-2 discriminant identity, which is the point: EV-MONO-a0a89c
        records "no analogue at m >= 4" as a statement about that DEVICE, and
        (D1) is a device that does have an analogue. Setting m = 3 in (D3) gives
        V semidirect S_2 of order 4 acting on 2 roots -- which is NOT D_4,
        because H-MONO-0b3def's D_4 acts on the FOUR POINTS of E over the
        unordered pair, a different object of a different degree. THAT
        DISTINCTION MUST BE STATED IN ANY REVIEW; conflating the two objects is
        the single easiest error to make in this lane.
      what_would_have_counted_as_failure: >-
        (D1) at m = 3 returning anything other than S_2, or (D3) failing to be
        consistent with the m = 3 symmetric-base result once the two objects are
        correctly distinguished.
    observation_collision:
      observable: >-
        The monodromy group itself, as an abstract permutation group on the
        2^{m-2} roots.
      distinct_preimage_search: >-
        SEARCHED AND FOUND, AND IT IS DECLARED. Every non-singular E over every
        field of characteristic > 3 gives the SAME group. The observable
        therefore collides across the entire moduli space -- CM and ordinary,
        j = 0 and generic j, every trace -- which is precisely the content of
        "the exceptional locus is empty" and is why this record, if it holds,
        removes the group from the list of things a census could ever
        distinguish curves by. Any curve-specific effect must then live in the
        DENSITIES (functions of (p,t,Z)) or in the excluded strata, not in the
        group.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace "the group is contained in V" (A-2) by "the translation action
          of V on the roots is FREE" -- strictly more state than the conclusion
          needs, and the extra state is exactly what converts a containment into
          an equality with no distributional input at all.
        predicted_gain: >-
          Discharges HEUR-KUM-2 at every m simultaneously, converting a
          per-degree empirical corroboration (G8, measured at m = 4 and 5 only)
          into an induction-free uniform statement.
      - transform: representation_reduction
        proposed_object: >-
          Reduce irreducibility of S_m over K_ord (a polynomial-factorization
          question of exponentially growing degree) to a torsion question about
          signed subset sums (a question of size m).
        predicted_gain: >-
          Removes the degree barrier that makes direct irreducibility checks
          infeasible past small m, which is why the program has been measuring
          this rather than proving it.
    quantifier_order: >-
      FOR ALL fields k with char k > 3, FOR ALL non-singular E/k, FOR ALL
      m >= 3, THE monodromy of S_m over k(x_1..x_{m-1}) IS EXACTLY (Z/2)^{m-2},
      and over k(e_1..e_{m-1}) IS EXACTLY (Z/2)^{m-2} semidirect S_{m-1}.
      The witness (the Kummer presentation plus the freeness argument) is
      UNIFORM: it is written from f and the x_i with no dependence on the curve,
      the field, the characteristic beyond > 3, or any choice.
      THE WEAKER ORDER IS NOT CLAIMED: "for all E there exists a group
      containing the monodromy" is trivially true and is not a result.
    method_ceiling:
      strongest_certifiable_claim: >-
        An unconditional determination of the GEOMETRIC monodromy of the
        summation cover over both bases, at every m, in characteristic > 3.
        IT CANNOT certify anything about ARITHMETIC monodromy at a fixed finite
        p beyond the containment (a Frobenius census can realize a proper
        subgroup at small p without contradicting a geometric statement -- that
        gap is H-MONO-59f6a6's object); it CANNOT certify any relation-rate,
        cost, or exponent statement; it CANNOT close KN-OPEN-009, whose
        relation-rate half it does not touch.
      nearby_object_control: >-
        THE OBJECT ON WHICH THE CONCLUSION IS KNOWN FALSE is the FACTOR-BASE
        SUBLOCUS. There, EV-MONO-a0a89c OBS-5 shows the cover splits completely
        and Part B shows the sign-class action is NOT free whenever a signed
        subset sum lands in E[2] -- which happens at rate 6(tau-1)/N at m = 4.
        So the exact statement (D1) proves generically is FALSE on a
        codimension-positive sublocus, and the proof must be checked to see that
        it uses genericity essentially. A proof of (D1) that also went through
        on the factor-base locus would prove too much and is wrong somewhere.
        THIS IS THE PROVES-TOO-MUCH CONTROL AND IT IS MANDATORY.
    proof_obligations:
      - claim: A faithful translation action of V on itself is regular, hence transitive.
        responsibility: correctness
      - claim: >-
          A nonzero class [w] fixes a root iff 2 Q_S = O or 2 Q_S' = O, where S
          is the support of w.
        responsibility: correctness
      - claim: >-
          THE LOAD-BEARING ONE: no nonempty signed subset sum of generic points
          lies in E[2] over K_ord, for |S| >= 2.
        responsibility: strictness
      - claim: >-
          S_{m-1} -> Aut(V) is injective for m >= 4, and the argument correctly
          fails at m = 3.
        responsibility: correctness
      - claim: >-
          The result reproduces OBS-2 at m = 3 over the ordered base, and is
          consistent with (not equal to) H-MONO-0b3def's D_4, which is a
          different object.
        responsibility: baseline
      - claim: >-
          The proof does NOT go through on the factor-base sublocus, where the
          conclusion is known false.
        responsibility: soundness
      - claim: >-
          Nothing transfers to arithmetic monodromy at fixed p, to relation
          rates, to cost, or to any exponent.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        Q1 (ZERO COMPUTE) -- independent re-derivation of the reduction
        "HEUR-KUM-2 <=> the translation action is free"
      direction: same
      minimum_effect: >-
        The reduction holds or it does not; there is no tolerance. A reviewer
        who cannot reproduce it in a page has found a defect.
    - metric: >-
        Q2 (ZERO COMPUTE) -- the proves-too-much control: does the (D1) argument
        still go through when the x_i are restricted to factor-base values,
        where the conclusion is KNOWN FALSE (Part B, rate 6(tau-1)/N at m = 4)?
      direction: different
      minimum_effect: >-
        It MUST fail there, and the failure must be localized to the exact step
        that uses genericity. An argument that survives the restriction is
        wrong; this control is mandatory and costs nothing.
    - metric: >-
        Q3 (NEAR-ZERO COMPUTE) -- explicit freeness witness: for m = 4 and m = 5,
        one specialization over one small F_p at which all 2^{m-2} roots are
        distinct and pairwise non-colliding
      direction: higher
      minimum_effect: >-
        At least one witness per m. Existence is enough: faithfulness at one
        specialization implies faithfulness generically, which is why this
        substitutes for the dominance argument in STEP 3. Cost: a handful of
        curve additions in F_{p^2}.
    - metric: >-
        Q4 -- consistency with the already-measured G8 count of realized
        Frobenius permutations at m = 4 and 5
      direction: same
      minimum_effect: >-
        EXACT: 4 and 8, matching EV-MONO-efbd1c's reported G8 values. A proof
        that predicted anything else would contradict committed measurement.
    - metric: >-
        Q5 -- the m >= 5 corollary, reported explicitly to prevent an overclaim
      direction: different
      minimum_effect: >-
        The symmetric-base group must come out as a PROPER subgroup of
        Sym(2^{m-2}) for every m >= 5 (order 2^{m-2}(m-1)! against (2^{m-2})!,
        e.g. 8*24 = 192 against 8! = 40320 at m = 5), so the "full symmetric
        group" answer is specific to m = 4. If the derivation instead predicted
        full symmetry at m >= 5 it would contradict the containment and is
        wrong.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, the entire substance). Write the proof of (D1),
      (D2), (D3) in full, run the proves-too-much control Q2 against the
      factor-base sublocus, and check the m = 3 baseline Q4 reproduction. This
      is a page of algebra and a reading of two committed records.
      STAGE 1 (minutes). Produce the explicit freeness witnesses Q3 at m = 4 and
      m = 5 over a small prime by direct curve arithmetic in F_{p^2}, and check
      the realized-permutation counts against EV-MONO-efbd1c's G8 values.
      STAGE 2 (independent review, the real cost). Because this is a PROOF and
      not a measurement, its evidential weight comes entirely from independent
      re-derivation. A blind re-derivation from the statement of the reduction
      and the parameters alone -- never reading this record's own argument --
      is required before the result is cited, per AGENTS.md "Review
      architecture".
    controls:
      - >-
        PROVES-TOO-MUCH (MANDATORY, Q2): run the argument against the
        factor-base sublocus where the conclusion is known false. This is the
        argument-level analogue of a null object and is the cheapest way to
        detect a proof that is wrong somewhere nobody has read closely.
      - >-
        BASELINE REPRODUCTION at m = 3 over the ordered base (must give OBS-2's
        S_2) and consistency with, NOT equality to, H-MONO-0b3def's m = 3
        symmetric-base D_4, which is a different object on a different degree.
      - >-
        CONSISTENCY WITH COMMITTED MEASUREMENT: the predicted group orders must
        equal EV-MONO-efbd1c's measured G8 counts at m = 4 and 5.
      - >-
        OI-1(a) REVERIFICATION-DISPOSITION RULE (CORR-20260802-1d8384 defect 3),
        applied to Stage 1: if a freeness-witness computation fails to complete
        or errors, its disposition is recorded and it is NEVER promoted to
        "witness not found", which would be an infrastructure failure read as
        mathematical evidence.
      - >-
        OI-1(b) 2-TORSION GENERATOR GUARD (defect 7): the Stage 1 witness search
        computes and asserts the TRUE order of every point it uses and rejects
        any curve where the chosen reference point is 2-torsion -- which is
        precisely the degeneracy (D1) is about, so using such a point as a
        witness would be circular.
      - >-
        OI-1(c) RELATIVE TOLERANCES ON THE TWO WINDOW CONTROLS (defect 4): not
        applicable to a zero-compute proof and recorded as such rather than
        omitted. If Stage 1 is ever widened into a sampled census, the relative
        tolerance requirement binds and the controls must be demonstrated to
        fail on an emptied window before any pass is read.
      - >-
        OI-1(d) FAMILY_RATE_ALERT: if the Stage 1 witness search fails on more
        than a pre-registered fraction of curves within any declared family
        (CM, j = 0, j = 1728, Z = 3), raise the alert and quarantine rather
        than concluding; a family-correlated failure rate is a bug signature.
      - >-
        OI-1(e) UNIFORM (A,B) DRAW (defect 9): Stage 1 witness curves are drawn
        uniformly from all non-singular (A,B) in F_p^2, never from a
        small-height box, and j = 0 / 1728 are excluded from the generic arm per
        KN-OPEN-009's own requirement and studied separately if at all.
    required_metrics:
      - the written proof of (D1), (D2), (D3), with each proof obligation discharged or explicitly left open
      - the proves-too-much control's outcome and the exact step at which the argument fails on the factor-base sublocus
      - the m = 3 baseline reproduction outcome
      - freeness witnesses at m = 4 and 5, with the curve, prime and points recorded
      - realized-permutation counts compared against EV-MONO-efbd1c's G8

  falsification_conditions:
    - >-
      G1 -- the reduction of HEUR-KUM-2 to freeness is wrong (Q1 fails). The
      record is withdrawn by supersession.
    - >-
      G2 -- the (D1) argument ALSO goes through on the factor-base sublocus
      (Q2 fails). It proves too much and is wrong; the offending step must be
      named.
    - >-
      G3 -- no freeness witness exists at m = 4 or m = 5 over any tested small
      field with the search completing normally. This would be startling and
      would indicate the signed-sum collisions are not the codimension-positive
      phenomenon Part B says they are.
    - >-
      G4 -- the derivation contradicts EV-MONO-efbd1c's measured G8 counts.
      Committed measurement wins; the derivation is wrong.
    - >-
      G5 -- the derivation is found to need an unproved dominance or
      independence statement that is not itself elementary. Then HEUR-KUM-2 IS a
      heuristic, this record's honest outcome is (II), and the correct report is
      "the reduction holds, the remaining step is X", which is still strictly
      more than the program has now.
    - >-
      G6 (THE PLANNED NEGATIVE) -- if (D1) holds and the batch does not state
      what remains open, the work is unfinished. Fixed here before any review:
      arithmetic-versus-geometric monodromy at fixed p (H-MONO-59f6a6's object);
      the relation-rate half of KN-OPEN-009; multiplication-by-l covers for odd
      l, where the sign torsor is replaced by an l-torsion torsor and the
      monodromy is NOT forced to be abelian (H-MONO-45183a's own F7(ii),
      still untouched); and the F_{q^n} Weil-restriction setting, where
      Gal(F_{q^n}/F_q) is a second group this argument never sees.

  confounders:
    - >-
      OBJECT CONFLATION, THE MOST LIKELY ERROR IN THIS LANE. H-MONO-0b3def's
      m = 3 D_4 acts on the FOUR POINTS of E over an unordered pair; (D3) at
      m = 3 gives a group of order 4 acting on TWO roots of the summation
      polynomial. These are different covers of different degrees over the same
      base and must never be compared as if they were the same object.
    - >-
      GENERIC VERSUS SPECIALIZED. (D1) is a statement about indeterminates. Any
      finite-p census bounds the arithmetic monodromy from below and can realize
      a proper subgroup at small p without contradicting (D1). A reviewer must
      not treat a census disagreement as a refutation of a geometric statement.
    - >-
      CIRCULARITY VIA A-1/A-2. This proposal uses A-1 and A-2 as established. If
      a reviewer re-derives (D1) while also re-deriving A-1/A-2 from this
      record's own text, the independence of the check is lost; the blind
      re-derivation must start from the STATEMENT of the reduction and the
      parameters, not from this record's argument.

  interpretation_limits:
    - CLAIM TIER derivation. There is no measurement here to be toy-scoped.
    - >-
      NO ECDLP CLAIM IN EITHER DIRECTION; NO RELATION-RATE CLAIM; NO COST OR
      EXPONENT CLAIM. Determining a Galois group makes no system easier or
      harder.
    - >-
      DOES NOT CLOSE KN-OPEN-009. It would close the GROUP half's exceptional-
      locus question for the geometric monodromy and would leave the
      relation-rate half and the arithmetic-versus-geometric question open.
    - >-
      THE m = 4 "FULL SYMMETRIC" CONSEQUENCE IS SPECIFIC TO m = 4 and must never
      be quoted as an m >= 4 statement; at m >= 5 the same derivation gives a
      proper imprimitive subgroup.
    - >-
      DOES NOT AUTHORIZE A STATUS CHANGE to H-MONO-45183a or to HEUR-KUM-2.
      Only the Coordinator may move a hypothesis (AGENTS.md rule 1), and a proof
      claiming to discharge a named heuristic of an already-`supported_scoped`
      record is a claim about established evidence and should be routed to the
      review tier the Coordinator judges that to require.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE LOAD-BEARING, AND THE ENTRY EXISTS TO SAY SO EXPLICITLY RATHER THAN
        LEAVE THE FIELD EMPTY. The purpose of this proposal is to REMOVE a
        heuristic (HEUR-KUM-2), not to add one. The single step that is not yet
        fully elementary -- "no nonempty signed subset sum of generic points
        lies in E[2]" for |S| >= 2 -- is offered as a THEOREM with a named gap
        and a specialization-witness repair, not as a distributional assumption.
      rigorous_support: >-
        Not applicable: the statement is not distributional. Recorded because
        docs/target-result-profile.md requires every heuristic to carry a
        random-model justification and a non-distributional claim must say why
        it has none.
      validation_plan: >-
        SAMPLE: the explicit freeness witnesses of Q3 at m = 4 and 5 over one
        small prime, plus the already-committed G8 counts at m = 4 and 5 from
        EV-MONO-efbd1c. COMPARE AGAINST: the predicted group orders 4 and 8
        exactly. TAIL CHECK: none applies to an exact-integer prediction; the
        analogue is that the check is EXHAUSTIVE at the witness, not sampled.
        TRANSFER ASSUMPTION, STATED: a witness at one prime establishes
        genericity, not behaviour at any other specific prime; per-prime
        arithmetic monodromy is a separate question.
      falsification_condition: >-
        The gap in STEP 3 turning out to require a non-elementary input, or no
        witness existing. Either outcome is reported as such and leaves
        HEUR-KUM-2 a heuristic, which is exactly the honest result.

  target_complexity:
    time_exponent: >-
      NOT APPLICABLE. No algorithm is proposed. Stage 0 is zero compute; Stage 1
      is a handful of elliptic-curve additions in F_{p^2}.
    memory_exponent: O(1).
    best_known: >-
      Not applicable; no ECDLP complexity claim. The prime-field baseline
      remains Pollard rho at O(sqrt N) time and O(1) memory (KN-OPEN-001),
      untouched.
    hidden_overhead: >-
      None. The only cost that is not trivial is the independent review, which
      is disclosed as the real expense of a proof-oriented proposal.
    tradeoff_note: Not applicable.

  dominated_by:
    value: not_applicable
    reason: >-
      No Pareto point is claimed on any axis. This is a proof that a group is
      what a `supported_scoped` record already says it probably is; there is no
      time, memory or data/query coordinate. The relevant frontier row for this
      program -- Pollard rho, O(sqrt N) time, O(1) memory over prime fields --
      was checked and is untouched.
  sota_delta: >-
    0 on every attack axis. What changes is the CONDITIONALITY of an existing
    internal record, not any cost.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: high

  priority_rationale: >-
    Highest information-per-unit-cost in this batch: it is zero compute, it
    targets a gap that two independent reviewers already named in writing
    ("HEUR-KUM-2 remains formally unproven at m >= 4"), and it either discharges
    that gap outright or localizes exactly what is missing -- both of which are
    strictly more than the program has today. It is also the theory partner of
    the symmetric-base census: if (D3) holds, that census's qualitative arm
    becomes a calibration control and its remaining empirical content is the
    exact matched-(t,Z) integer comparison, which sharpens rather than weakens
    it. Ranked HIGH with the honest caveat that it is a BUILDING BLOCK, not an
    exponent-moving result: per docs/target-result-profile.md's first search
    bias, a proposal whose best case moves no exponent is low priority unless it
    is a required ingredient of something that does, and the justification
    offered here is that it removes the last conditionality from the only
    monodromy statement this lane has, which every downstream census cites.

