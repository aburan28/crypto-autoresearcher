idea:
  id: IDEA-20260823-cab6c6
  title: Canonical x-coordinate interval key for a repaired four-list JPR gate
  class: representation
  claim: >-
    A single predeclared, public, DLP-free key obtained by bucketing the
    canonical x-coordinate of an elliptic-curve pair sum has the right formal
    fibre size for the JPR survivor arithmetic, but no output-sensitive
    enumerator or achieved joint-success law is established here. The proposal
    is therefore a zero-run formula-level candidate and scoped failure
    certificate, not an algorithm or speedup.
  mechanism:
    parameters:
      group: "A prime-order subgroup G=<P> of E(F_p), with |G|=N and Q=xP"
      list_length: "L=ceil(N^(1/3))"
      bucket_width: "w=ceil(p/L)"
      accepted_bucket: 0
    frozen_key: >-
      K_EC(U,V)=0 when U+V=O; otherwise
      K_EC(U,V)=min(L-1,floor(enc_p(x(U+V))/w)), where enc_p is the
      canonical integer representative in {0,...,p-1}.
    bounded_public_state:
      - p
      - L
      - w
      - the canonical field encoding
      - the public curve addition law
      - "the predeclared accepted bucket tau=0"
    dependency_graph:
      - "independent source coefficients generate four labelled leaves R=aP+bQ"
      - "one pair sum and K_EC evaluation produces a bucket decision"
      - "retained coefficients produce (A,B,S=AP+BQ)"
      - "opposite retained sums would yield AP+BQ=O"
    distinction_from_known_work: >-
      This is not the XOR prefix construction: the EC coordinate bucket is not
      a homomorphic leaf prefix and no complement lookup is known. It is not an
      independent pair coin, post-hoc random oracle, full pair table, P1553
      divisor constructor, or P1549--P1551 missing selector oracle. Its purpose
      is to expose the exact algorithmic gap for one fixed native formula.
  novelty_status: unverified
  citations:
    - ref: ledger/hypotheses/H-JPR-3a00f0.yaml
      provenance: internal
      claim: "Defines C1--C7 and the conditional four-list JPR arithmetic."
      verified_by: "Coordinator-provided immutable read bundle at 250a49341e4d64176332acd3e69c31a55a17a3ba"
    - ref: ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-c36939.yaml
      provenance: internal
      claim: "Records the earlier repaired-JPR REVISE boundary and JPR-REV-1--4."
      verified_by: "Coordinator-provided immutable read bundle at 250a49341e4d64176332acd3e69c31a55a17a3ba"
    - ref: ledger/decisions/DEC-20260823-d501ad.yaml
      provenance: internal
      claim: "Preserves the B63 select-none boundary and its unfilled selector/success gaps."
      verified_by: "Coordinator-provided immutable read bundle at 250a49341e4d64176332acd3e69c31a55a17a3ba"
  assumptions:
    - id: A-KEY-1
      statement: "enc_p is fixed before source coefficients and is not trained on Q or outputs."
    - id: A-KEY-2
      statement: "Each list contains independently sampled coefficient-labelled leaves."
    - id: A-KEY-3
      statement: "N and p are comparable only when an exponent translation explicitly says so."
    - id: A-KEY-4
      statement: "Coordinate bucketing alone supplies no enumeration algorithm."
  proof_search_map:
    bottleneck: >-
      Enumerate exactly all (i,j) with K_EC(R_1i,R_2j)=0 in
      O(L polylog N+output) time and O(L polylog N) memory without pair-table
      materialization, then prove conditioned concentration and joint success.
    baseline_embedding:
      parameter_slice: "Prime-order EC subgroup; L=ceil(N^(1/3)); tau=0."
      reproduction_check: >-
        Directly forming all L^2 sums and testing their x-coordinate bucket is
        exact, costs Theta(L^2) group/field work, and is only a baseline.
    observation_collision:
      observable: "K_EC(U,V), with coefficient-labelled source indices retained"
      distinct_preimage_search: >-
        For any public T, (U,V) and (U+T,V-T) have the same complete sum and
        hence the same bucket when all points exist in G. This proves large
        fibres, not output-sensitive access to them.
    constructive_transforms:
      - representation_reduction
      - observable_fiber
    quantifier_order: >-
      Freeze curve, encoding, L, w, tau, list-generation distribution, and key;
      then sample coefficients; then enumerate; then measure survivors; then
      test opposite-sum collisions. No key or bucket is selected after outputs.
    method_ceiling:
      strongest_certifiable_claim: >-
        The formula is public, DLP-free, target-scalar-independent, bounded-state,
        sign-invariant, and has a conditional fibre-size calculation. No
        subquadratic enumerator or ECDLP success theorem follows.
      nearby_object_control: >-
        XOR prefix joins instantiate the common join core, while a prime-order
        exact homomorphic quotient cannot have image size L: its image has size
        1 or N.
    proof_obligations:
      - responsibility: "Construct an exact output-sensitive enumerator or exhibit a scoped failure."
        not_applicable_reason: null
      - responsibility: "Prove survivor tails and conditioned Renyi-2 mass."
        not_applicable_reason: null
      - responsibility: "Bound reused-key, coefficient, sign, and Q correlations."
        not_applicable_reason: null
      - responsibility: "Carry source coefficients through replay and charge all costs."
        not_applicable_reason: null
  predictions:
    - id: P-KEY-1
      statement: >-
        Under an explicit uniform-pair-sum bucket model, a fixed bucket retains
        Theta(L) of L^2 pairs and has effective point support Theta(N/L).
      observable: "survivor count and empirical bucket mass"
    - id: P-KEY-2
      statement: >-
        If conditioned outputs were flat on a common sign-closed support of
        Theta(N/L), opposite-sum probability per survivor cross-pair would be
        Theta(L/N)=Theta(N^(-2/3)).
      observable: "conditioned collision probability and Renyi-2 mass"
    - id: P-KEY-3
      statement: >-
        The direct exact enumerator performs Theta(L^2) key evaluations, so it
        misses the N^(1/3+o(1)) target even if the distribution predictions hold.
      observable: "key evaluations and pair sums inspected"
  minimal_test:
    design: >-
      No experiment is authorized in this task. A future approved protocol
      would compare exact direct enumeration against any proposed index on
      identical coefficient-labelled lists, then measure bucket tails,
      conditioned Renyi-2 mass, opposite-sum collisions, and verified scalars.
    controls:
      - XOR prefix common-core positive control
      - independent pair coin
      - post-hoc point hash
      - full-table oracle
      - exact prime-order homomorphism
      - same-complete-input collision
      - sign-orbit enumeration
      - constant transcript
      - coefficient-free equality
    required_metrics:
      - inspected_pair_fraction
      - emitted_survivors
      - survivor_tail_probability
      - conditioned_renyi2_mass
      - opposite_sum_collisions
      - nonzero_denominator_candidates
      - verified_scalars
      - all_axis_resource_cost
  falsification_conditions:
    - >-
      Falsify the desired key clause if every exact implementation of the
      claimed enumerator materializes or inspects Omega(L^2) pairs on a declared
      input family; this record does not prove that universal lower bound.
    - >-
      Falsify the distribution clause if fixed-bucket counts lack the required
      high-probability Theta(L) tail or conditioned collision mass is not
      Theta(N^(-2/3)) on the preregistered distribution.
    - >-
      Falsify joint success if verified relations decay with N or retry cost
      raises expected work above N^(1/3+o(1)).
  confounders:
    - x-coordinate sign folding
    - infinity assigned to bucket zero
    - nonuniform x-coordinate occupancy on the selected subgroup
    - shared leaves and reused fixed key
    - duplicate source indices
    - p-versus-N exponent translation
    - denominator-zero candidate relations
  interpretation_limits:
    - "No command, implementation, or experiment was run."
    - "The fixed key's missing enumerator is not a generic lower bound."
    - "Conditional fibre arithmetic is not achieved ECDLP success."
    - "Internal records do not establish external novelty."
    - "No hypothesis, experiment, goal, or ledger status is changed."
  heuristic_assumptions:
    - id: H-BUCKET-FLAT
      statement: >-
        Pair sums reaching the fixed x-coordinate interval are distributed with
        bucket mass Theta(1/L) and high-probability survivor count Theta(L).
      rigorous_support: >-
        Counting gives only a target scale: a length-w interval contains at most
        2w affine points before subgroup restriction. It does not prove mixing
        of sums from finite random lists.
      validation_plan: >-
        In a future approved run, compare the full bucket histogram and tails
        with exact direct enumeration over preregistered curves, sizes, and seeds.
    - id: H-COND-FLAT
      statement: >-
        The two filtered pair-sum distributions are flat enough on one common
        sign-closed support of size Theta(N/L) that their cross inner product is
        Theta(L/N).
      rigorous_support: >-
        Cauchy--Schwarz supplies bounds from measured Renyi-2 mass but does not
        establish the required common support or independence.
      validation_plan: >-
        Measure each conditioned distribution, Renyi-2 mass, cross inner
        product, sign mass, and a shuffled-side control before any success claim.
    - id: H-JOINT-RETRY
      statement: >-
        Survivor count, opposite-sum collision, coefficient denominator, and
        verification events jointly yield constant per-attempt success.
      rigorous_support: >-
        Expectation multiplication is invalid under the shared key and shared
        leaves; no rigorous support is presently known.
      validation_plan: >-
        Measure the full joint event and retry distribution with held-out seeds,
        anti-clustering statistics, and exact scalar verification.
  target_complexity:
    time_exponent: "target 1/3+o(1); realized direct enumeration 2/3+o(1) before retries"
    memory_exponent: "target 1/3+o(1); streaming baseline can use 1/3+o(1), full table uses 2/3+o(1)"
    best_known: "generic Pollard rho time 1/2+o(1), negligible-to-small memory"
    hidden_overhead: >-
      Field inversion or batching, canonical encoding, sorting/hashing, output
      skew, coefficient storage, verification, retries, and p/N translation.
    tradeoff_note: >-
      Streaming avoids an L^2 table but not L^2 pair inspections. Parallelism
      divides wall time only after charging total work, communication, and
      duplicate handling. No multi-target amortization is claimed.
  estimated_cost:
    implementation: "None in this task; a future exact baseline is moderate."
    compute: "Zero authorized runs; future direct baseline costs Theta(L^2) key evaluations per attempt."
  recommended_priority: >-
    REVISE/select-none for dispatch as an N^(1/3) algorithm. Revisit only with a
    formula-level exact output-sensitive index and a preregistered conditioned
    concentration proof or discriminating experiment.
