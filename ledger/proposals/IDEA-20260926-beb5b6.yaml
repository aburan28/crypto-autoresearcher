  proof_search_map:
    bottleneck: >-
      Whether any walk-carried pool carries structure that an m-SUM solver
      could read below the two-list bound; the certificate says no for
      generic pools and the census tests the tau-adic walk's pool for a
      Z[tau]-concentration signature.
    baseline_embedding:
      parameter_slice: >-
        m = 2 on the pool is the DP-DP collision; B = 524 with the conjugate
        structure is IDEA-20260926-178821's base (arity about 23); B = 1 with
        Gamma_w multiples is IDEA-20260926-b48c9d. The relabelled Z/(4l) with
        a random known-log pool is the generic slice on which every count must
        equal the Poisson prediction.
      reproduction_check: >-
        Zero compute: the zero-sum arithmetic at B = 2^33; the walk-into-base
        rate 2^-98 = 2^{33 - 131}. Toy fixture: on the n = 19 cell with a
        pool of B = 64 random known-log points, the exhaustive m = 4 zero-sum
        count must sit at C(64, 4)/130873 = 635376 / 130873, about 4.9, within
        Poisson error, on the relabelled control.
    observation_collision:
      observable: >-
        The zero-sum m-subset count per pool per m, the bracket-vanishing
        rate, and the operation count of a two-list m-SUM against rho's on
        the same cell.
      distinct_preimage_search: >-
        An excess in the walk pool could come from (i) genuine Z[tau]
        concentration (H_structured), or (ii) repeated points in the pool
        (a walk that cycled, or DPs reached by two walks), or (iii) sign
        handling. Separated by de-duplicating the pool by point, by the
        relabelled control (which shares the sign code), and by the
        non-walk random known-log pool.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold "a pool of B known-log points with an m-SUM relation
          mechanism" fixed and vary how the pool is produced: the tau-adic
          walk on the Koblitz curve, a walk on the ordinary curve, a random
          draw of known-log points, and the relabelled Z/(4l) walk. The
          intrinsic invariant is the zero-sum count against Poisson.
        predicted_gain: >-
          None on any cost axis (H_generic predicted); the certificate gains
          a measured null instead of an asserted one.
      - transform: representation_reduction
        proposed_object: >-
          The target-dependent class rewritten as instance-dependent bases
          of three kinds (known-log, relabeling, mixture); encoding exact;
          completeness is the lemma in claim (A); soundness trivial;
          transfer to any single-instance ECDLP; cost loss none.
        predicted_gain: >-
          Turns an open class name in KN-OPEN-020 into a three-way case
          split in which two cases are relabelings and the third is priced.
    quantifier_order: >-
      FORALL target-dependent bases F_R used for a random-target descent: the
      unknowns are shared across targets only through the instance-dependent
      part of the description (claim A, elementary). FORALL known-log pools
      of size B: expected zero-sum m-subsets C(B, m)/l and generic m-SUM cost
      B^{ceil(m/2)} (arithmetic). EXISTS the n = 19 cell at which the walk
      pool's zero-sum count is measured against two controls; the record
      PREDICTS agreement (H_generic).
    method_ceiling:
      strongest_certifiable_claim: >-
        "On ECC2K-130 the collected pool of 2^33 DPs is expected to contain
        2^-1.6 zero-sum 4-subsets and 2^29.1 zero-sum 5-subsets; finding one
        costs at least 2^66 by any two-list or filter-capped k-tree method,
        above rho's remaining 2^60.5; and on the n = 19 Koblitz cell the walk
        pool's zero-sum counts at m <= 4 equal the Poisson prediction and both
        controls within [ratios]." It certifies nothing about a structured
        m-SUM solver, which it does not propose.
      nearby_object_control: >-
        BLOCKING. The relabelled Z/(4 * 130873) with the same walk rule
        transported (the j-selection read from the relabelled encoding) and
        the same DP predicate transported through the bijection must
        reproduce the Poisson counts exactly in distribution; the ordinary
        n = 19 curve's walk pool (no tau; the walk step becomes P -> 2P + P
        or a generic r-adding step) is the no-Z[tau] null. If the Koblitz pool
        differs from both, H_structured; if it differs from one only, the
        instrument is inconsistent and nothing is read.
    proof_obligations:
      - claim: The instance-dependence lemma of claim (A) as stated, with the three-way split.
        responsibility: correctness
      - claim: The relabelings of class (ii) are lossless (x_Q + V, x_Q V, F_V - Q, phi^{-1} F_V), each in one line.
        responsibility: correctness
      - claim: The zero-sum counts C(B, m)/l at B = 2^33 and 2^35.5, re-derived.
        responsibility: size
      - claim: The two-list bound B^{ceil(m/2)} and the 2-bit filter cap give at least 2^66 at m in {3, 4}.
        responsibility: runtime
      - claim: The bracket-vanishing rate is about 1/l on the toy cell.
        responsibility: success_probability
      - claim: Every toy zero-sum found is re-verified by curve arithmetic and yields k when the bracket is nonzero.
        responsibility: correctness
      - claim: Nothing here proposes or bounds a structured m-SUM solver.
        responsibility: scope
  predictions:
    - metric: >-
        zero-sum m-subset count in the Koblitz n = 19 walk pool divided by
        the Poisson prediction C(B, m)/l, m in {3, 4}, B in {32, 64, 128}
