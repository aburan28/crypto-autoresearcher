idea:
  id: IDEA-20260926-beb5b6
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    TARGET-DEPENDENT FACTOR BASES ARE INSTANCE-DEPENDENT BASES, AND THE
    WALK-CARRIED ONES ARE KNOWN-LOG POOLS: a relation over F_R shares unknowns
    across targets only if F_R depends on (P, Q) alone, so the class collapses
    to known-log pools, the Gamma-orbit of Q and relabelings; the 2^33
    collected ECC2K-130 distinguished points hold about 2^-1.6 zero-sum
    4-subsets and 2^29 5-subsets, findable only by m-SUM at 2^66 or more; a
    toy zero-sum census against relabelled and non-walk pools is the
    controlled null
  class: control
  claim: >-
    (A) THE INSTANCE-DEPENDENCE LEMMA (elementary, zero compute). Index
    calculus solves the ECDLP by linear algebra over unknowns log(F) shared by
    many relations. Let F_R be a factor base whose description depends on the
    target R. Two targets R, R' yield relations over F_R and F_{R'}; their
    unknowns are shared only on F_R meet F_{R'}. For a random-target descent
    (targets aP + bQ), a base that depends on the target's own coordinates
    varies with (a, b) and the intersections are generically small, so the
    relations do not compose; a base that depends only on the INSTANCE (P, Q)
    is shared by every target and is an ordinary factor base chosen with
    knowledge of Q. Hence "target-dependent" in KN-OPEN-020's sense is, for
    index calculus, "instance-dependent", and the instance enters a base in
    exactly three ways: (i) the base contains points whose logarithms are
    known in terms of the one unknown k (the KNOWN-LOG class: conjugates
    +-sigma^j P, +-sigma^j Q, IDEA-20260926-178821; tau-adic multiples [z]Q,
    IDEA-20260926-b48c9d; rho walk points a_i P + b_i Q, and in particular
    every collected distinguished point); (ii) the base is an ordinary
    unknown-log base whose DESCRIPTION reads x_Q (a Krylov span of the
    conjugates of x_Q, an affine or multiplicative shift of a subspace by
    x_Q, a curve translate F_V - Q, an endomorphism pullback phi^{-1}(F_V));
    (iii) a mixture. Class (ii) is a relabeling: x_Q + V and x_Q V are
    subspaces or cosets, F_V - Q decomposes R' over F_V - Q iff R' + mQ
    decomposes over F_V, and phi acts on the prime-order subgroup as a scalar
    so phi^{-1}(F_V) is F_V with logarithms rescaled; none passes the
    lossy-projection test as a NEW object, and none changes any column of the
    product law. Class (i) is the one that escapes the product law, and it
    escapes it by removing the linear algebra entirely (178821): a
    zero-sum relation among known-log points is an equation in k alone.
    (B) THE WALK-CARRIED BASE IS THE DISTINGUISHED-POINT POOL, AND ITS ONLY
    RELATION MECHANISM IS m-SUM. The seam asks for "bases that move with the
    walk so relation collection and rho become one process". Every walk point
    W_i = a_i P + b_i Q is a known-log point; the collected distinguished
    points are a pool D of B known-log points with x(D_i) in the ball B_34 of
    Bailey et al.'s DP predicate (KN-LIT-661e97, about 2^33 collected). A
    relation is an m-subset with sum zero: sum a_i + k sum b_i = 0 mod l,
    hence k unless sum b_i = 0 (probability about 1/l). Counting with l about
    2^129.0 (the exact prime of KN-FIND-aa2efc): expected zero-sum m-subsets
    C(B, m)/l at B = 2^33 are 2^-64.0 (m = 2, the DP-DP collision that rho
    does not rely on), 2^-32.6 (m = 3), 2^-1.6 (m = 4) and 2^+29.1 (m = 5); at
    the B = 2^35.5 the campaign would hold at its expected completion, the
    m = 4 count is 2^+8.4. So the pool the campaign already holds contains a
    solving 4-subset with probability about 1/3 and a solving 5-subset with
    near certainty. FINDING one is m-SUM over an unstructured pool: the
    two-list bound B^{ceil(m/2)} gives 2^66 (m = 3, 4) and 2^99 (m = 5), and
    rho's own remaining work is 2^60.8 - 2^58.3, about 2^60.5; so the pool is
    never the cheaper route by at least 2^5.5. A sum-compatible filter that
    would let a k-tree beat the two-list bound carries at most 2 bits on the
    order-4l group (Theorem C via IDEA-20260926-136bd3), and the only
    non-generic route is an algebraic m-SUM solver reading the x-coordinates
    of a pool that has no description beyond "in B_34 and visited by a walk",
    which is the random-set arm whose enumeration floor IDEA-20260926-b6cc43
    fixes. The walk-into-base rate for a FIXED implicit base of size 2^33 is
    2^-98 per step, so hybrids that use the walk as a target generator for an
    ordinary base see one hit per 2^98 steps: the product law at arity 1.
    (C) THE SHORT-tau-ADIC-DISTANCE BASE IS THE Gamma-ORBIT. Points at short
    tau-adic distance from R, {R + f(tau) P : wt(f) <= w} or {f(tau) R}, are
    the sets IDEA-20260926-b48c9d already writes as [z]P and [z]R with z in
    Gamma_w and prices as a Gamma-orbit quotient (attempts 2^131 / |Gamma_w|,
    rho reached only at w >= 13 where enumeration costs 2^71); the
    conjugate-only case w = 1 is 178821's base. Nothing new is added here
    beyond placing them in the instance-dependence lemma.
    (D) THE ONE TESTABLE CONTENT, STATED SO IT CAN FAIL. Everything in (B) is
    generic and should reproduce EXACTLY on a relabelled Z/(4l) with the DP
    predicate transported; a Koblitz-specific excess of zero-sum m-subsets in
    a walk-carried pool over (i) the relabelled control and (ii) a pool of
    random known-log points not produced by a walk would mean the tau-adic
    walk (P_{i+1} = sigma^j P_i + P_i is multiplication by 1 + tau^j in
    Z[tau]) concentrates its DPs on a structured sub-lattice, which is the
    coverage-deficit mechanism 178821's part (C) predicts for the conjugate
    base and which would make the pool a non-generic object. TWO
    EXPLANATIONS: (H_generic) zero-sum counts in the walk pool equal the
    Poisson prediction C(B, m)/l and the two controls within sampling error at
    every m <= 4 -- the walk-carried base is a generic known-log pool, and
    the class is closed with the numbers above as the reachability table's
    target-dependent row; (H_structured) the walk pool shows a zero-sum
    excess above 3x the Poisson prediction at m in {3, 4}, replicated across
    seeds and absent on both controls -- the pool carries Z[tau]-structure
    from the walk's own operation set, which is the object 178821's forward
    guidance (iii) names, and the row is reopened for a structured m-SUM
    solver. ARTIFACT: the relabelled control disagrees with the Poisson
    prediction, or the bracket-vanishing rate is not about 1/l.
    REPRESENTATION CLASS (RQ-ECDLP-623a32): R1 (walk points carried with
    their (a, b) representation, the F1 object) used as a factor base; the
    attack stages whose charged cost vanishes are relation collection and
    linear algebra, and the stage that absorbs the whole charge is the m-SUM
    search.
  mechanism: >-
    OBJECT FRAME. Representation: R1, the pool of pairs ((a_i, b_i), W_i)
    with x(W_i) in the DP set, i.e. the F1 walk object carried with its known
    representation. Operation set Sigma = {the walk step W -> sigma^j(W) + W,
    sigma, negation} -- the walk's own operation set, a proper sub-action of
    translation (one adds only sigma^j of the current point, never an
    arbitrary factor-base element). Trichotomy: BRANCHING for the pool as a
    whole (whether a walk point is distinguished is a coordinate predicate,
    HW(x) <= 34 in the type-2 normal basis, that propagates only
    probabilistically under the walk step; loss L about 2^-16 per step at the
    published DP density and branching b = 1 since the walk is deterministic
    given j), and Class I partial-action for the zero-sum relation vector
    over the pool, which propagates under "add one more pool element" only.
    The record places the pool honestly in the branching class and prices
    its (L, b) from KN-LIT-661e97's DP density rather than measuring it.
    LOSSY-PROJECTION TEST AGAINST SIGMA. The projection W -> [x(W) is
    distinguished] discards everything but one bit; it is compatible with
    sigma and negation (both fix HW in the normal basis, IDEA-20260926-b6cc43
    claim (A)) and NOT with the walk step (the next point's weight is not
    determined by the current bit), which is what makes the pool a branching
    object. The pool's SUMSET structure -- the multiset of m-subset sums --
    is the lossy object 178821 tracks, and this record's census measures it
    on the pool rather than on the conjugate base.
    PRICE THE ONE OPEN NUMBER. For a branching object the price is (L, b);
    both are known from the walk design. The number that decides the row is
    the m-SUM cost over the pool, generic at B^{ceil(m/2)} by the two-list
    bound and reducible below it only by a structured solver that the census
    would have to motivate.
    KN-OPEN-020 CLASS: TARGET-DEPENDENT (instance-dependent, known-log).
    Description: the pool itself, B points with their (a, b), about 2^33 x
    (131 + 2 x 129) bits, about 2^39 bits (the campaign's own storage);
    membership: a table lookup; relation: one zero-sum m-subset; descent:
    none; time: the m-SUM search, 2^66 at m in {3, 4}; memory: the pool plus
    the two-list tables, 2^66 entries at m = 4. Every column charged.
    OFF-LIMITS COMPONENTS DECLARED. F1 (the walk) supplies the pool and is
    named as the component; F2 (decomposition) is the family the pool is
    being used as a base for; F7 (preprocessing) is the nearest frontier row
    (KR-RHO-ea34b8, l^{2/3} tables for l^{1/3} online), which applies to MANY
    targets and is dominated for the single challenge instance (precomputing
    the table costs about 1.2 l^{2/3} about 2^86.3, above rho). What is added
    beyond all three: the instance-dependence lemma, the zero-sum arithmetic
    of the collected pool, and the walk-versus-non-walk pool census.
    WHY THE CURVE ENTERS. Only through Z[tau]: the walk step is
    multiplication by 1 + tau^j, so the pool is a sample of a Z[tau]-orbit
    structure that the ordinary curve (no tau) and the relabelled Z/(4l)
    (no coordinates) both lack; those are the two nulls.
