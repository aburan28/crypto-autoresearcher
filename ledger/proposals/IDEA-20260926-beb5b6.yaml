        extrapolated, and a ratio below 1 at this toy scale would only mean
        the pool was large relative to sqrt(l), which the design avoids by
        capping B at 128 < sqrt(l).
    - metric: >-
        expected zero-sum 4-subsets and 5-subsets at B = 2^33, recomputed
      direction: same
      minimum_effect: >-
        2^-1.6 and 2^29.1 within 0.3 bit; a disagreement localises an
        arithmetic error in this record.
  minimal_test:
    design: >-
      CELL. Koblitz E_0 over F_2[t]/(t^19 + t^5 + t^2 + t + 1), order
      4 * 130873 (IDEA-20260926-b48c9d; re-checked at setup), prime subgroup of
      order l = 130873; a random instance (P, Q = kP) with k recorded; the
      ordinary control on the same field (A = 46693, B = 306147, h = 2); the
      relabelled Z/(4l) control with a random bijection to 19-bit encodings.
      Walk: P_{i+1} = sigma^j(P_i) + P_i with j chosen from 3 bits of x(P_i)
      in normal basis (Bailey et al.'s rule at toy scale), start points
      Q + sum c_i sigma^i(P) with recorded (a, b); DP predicate HW(x) <= 7 in
      a general normal basis of F_{2^19} (density chosen so that B = 128 DPs
      arrive within about 2^14 steps); on the ordinary control the walk step
      is a 16-adding walk (no sigma exists) and the DP predicate is the same
      weight bound; on the relabelled control the j-selection and the DP
      predicate are read through the bijection.
      STAGE 0 (zero compute): the lemma, the relabelings, the zero-sum
      arithmetic at B = 2^33 and 2^35.5, the two-list and filter-cap bounds,
      the toy Poisson fixture (C(64, 4)/130873 about 4.9).
      STAGE 1: collect pools of B in {32, 64, 128} DPs per arm, 20 seeds each;
      de-duplicate by point; record (a, b) per DP.
      STAGE 2: exhaustive zero-sum census for m in {2, 3, 4} (C(128, 4) about
      1.07 x 10^7 signed-free subsets, seconds to minutes in Python with a
      hash of pair sums); for every zero-sum verify sum a_i + k sum b_i = 0
      mod l by curve arithmetic and record the bracket.
      STAGE 3: two-list 4-SUM over the B = 128 pool and matched rho with
      negation and Frobenius classes to a certified solve on the same
      instance, 50 seeds; operation counts.
      STAGE 4: three-row reading; the n = 131 row is written from Stage 0
      alone.
      OUTCOME TABLE. NEGATIVE-FOR-THE-OBJECT (H_generic, predicted): counts
      within a factor 2 of Poisson and within 1.5x of both controls on every
      cell -- the target-dependent column of the reachability table gets the
      known-log-pool row with 2^-1.6 / 2^29.1 expected zero-sums and m-SUM
      cost at least 2^66, and the class is closed with the instance-
      dependence lemma as its mechanism. POSITIVE (H_structured): an excess
      above 3x on the Koblitz walk pool only, replicated -- the pool carries
      Z[tau]-structure; independent review, then a structured m-SUM
      proposal owned by RQ-CERTBIN-836ce2 or RQ-FROB-7d8dd4. ARTIFACT: the
      relabelled control is off Poisson, or the bracket rate is off 1/l, or
      any zero-sum fails curve verification -- nothing read.
      FALSIFICATION THRESHOLD, fixed before any run: Koblitz/Poisson ratio
      outside [0.5, 2] or Koblitz/control ratio outside [0.67, 1.5] at m in
      {3, 4}, replicated across seeds.
      COST (estimate, order of magnitude): implementation low to medium (a
      toy walk with DP collection and (a, b) bookkeeping, a zero-sum census
      with pair hashing, a two-list 4-SUM, about 300 lines on gf2n.py /
      curve.py generalised to n = 19); compute low, minutes per arm, under
      one CPU-hour for the grid -- an estimate, not a measurement.
    cell:
      curve: >-
        Koblitz y^2 + xy = x^3 + 1 over F_2[t]/(t^19 + t^5 + t^2 + t + 1),
        order 4 * 130873 (re-checked at setup); ordinary control A = 46693,
        B = 306147, h = 2 on the same field; relabelled Z/(4 * 130873).
      m: 2, 3, 4 (exhaustive zero-sum census); the n = 131 row is stated at m = 4 and 5
      l: not applicable (no subspace; the base is the DP pool)
      factor_base: the pool of B in {32, 64, 128} distinguished points with known (a, b), per arm
      targets: not applicable (zero-sum relations among pool elements; one instance (P, Q) per seed)
      seeds: 2026092601..20 per arm, recorded
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py (generalised to n = 19)
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py (group law)
      - 'NEW: toy tau-adic walk with DP collection and (a, b) bookkeeping, normal-basis constructor, zero-sum census with pair hashing, two-list 4-SUM, toy rho with classes (about 300 lines, pure Python)'
      - 'missing: none'
    procedure:
      - 1. Stage 0 derivations and the Poisson fixture.
      - 2. Stage 1 pools per arm and seed, de-duplicated, (a, b) recorded.
      - 3. Stage 2 exhaustive zero-sum census m <= 4 with curve verification and bracket record.
      - 4. Stage 3 two-list 4-SUM and matched rho operation counts, 50 seeds.
      - 5. Stage 4 three-row reading; the n = 131 row from Stage 0.
    metrics:
      - name: zero_sum_ratio
        unit: dimensionless
        definition: exhaustive zero-sum m-subset count divided by C(B, m)/l, per arm, m, B, seed
      - name: bracket_vanishing_rate
        unit: fraction
        definition: fraction of verified zero-sums with sum b_i = 0 mod l
      - name: ops_4sum, ops_rho
        unit: group operations (table operations for 4-SUM) to a certified solve
        definition: instrumented counters, 50 seeds, mean and 90th percentile
    controls:
      - 'Relabelled Z/(4l) walk with the walk rule and DP predicate transported (blocking; must sit on Poisson).'
      - 'Ordinary curve of the same field with a 16-adding walk and the same DP predicate (the no-Z[tau] null).'
      - 'Random known-log pool not produced by any walk (the non-walk null).'
      - 'De-duplication by point before any count (separates repeated DPs from structure).'
      - 'Curve-arithmetic verification of every zero-sum and of every rho solve.'
    outcomes:
      positive: >-
        H_structured: a replicated Koblitz-only zero-sum excess; the pool is
        non-generic and a structured m-SUM object is handed forward.
      negative: >-
        H_generic (predicted): the class is closed with its mechanism and the
        n = 131 row is entered with the zero-sum and m-SUM numbers.
      artifact: >-
        Control off Poisson, bracket rate off 1/l, or a verification
        failure; nothing read.
    falsification_threshold: >-
      Fixed before any run: Koblitz/Poisson ratio outside [0.5, 2] or
      Koblitz/control ratio outside [0.67, 1.5] at m in {3, 4}, replicated
      across at least 10 of 20 seeds.
    estimated_cost:
      implementation: low
      compute: >-
        ESTIMATE, order of magnitude: about 2^14 walk steps per pool, about
        10^7 subset sums per census at B = 128, minutes per arm; under one
        CPU-hour for the grid.
    required_metrics:
      - 'zero_sum_ratio per arm, m, B, seed'
      - 'bracket_vanishing_rate per arm'
      - 'ops_4sum and ops_rho per seed with certificates'
      - 'termination_reason (completed | timeout | crash)'
  falsification_conditions:
    - 'The relabelled control is off Poisson by more than a factor 2 at any m: instrument defect, nothing read.'
    - 'A verified zero-sum with nonzero bracket that does not yield k: the bookkeeping is wrong; record withdrawn.'
    - 'Koblitz pool excess above 3x Poisson at m in {3, 4}, replicated, absent on both controls: H_generic is false for the tau-adic walk pool; the class is reopened.'
    - 'Re-derivation of the B = 2^33 zero-sum counts disagrees with 2^-1.6 or 2^29.1 by more than 0.5 bit: arithmetic error located and corrected in a superseding record.'
  confounders:
    - 'Repeated DPs (two walks reaching the same point) inflate zero-sums trivially (D - D = 0); the pool is de-duplicated by point and repeats are reported separately.'
    - 'At toy l = 130873 the pools must stay below sqrt(l) about 362 so that m = 2 collisions do not dominate; B <= 128 enforces this.'
    - 'The toy DP density (HW <= 7 at n = 19) differs from the campaign density; only the zero-sum ratio, not the DP rate, is read.'
    - 'The ordinary-curve walk uses a different step rule (no sigma); it is a null for Z[tau] structure, not a matched walk.'
  interpretation_limits:
    - 'A certificate and a controlled null; no attack, no exponent, no run at n = 131; the n = 131 content is arithmetic on published counts.'
    - 'KN-OPEN-020 class declared target-dependent (instance-dependent, known-log); the record closes the walk-carried and relabeling sub-classes with a mechanism and does not touch the universal statement.'
    - 'The lemma of claim (A) is elementary and is recorded as a certificate, not as a theorem about all conceivable relation mechanisms; a mechanism that shares unknowns across targets by other means (a shared implicit structure in the descriptions) is outside it and is the open direction.'
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Generic pool.) The B collected DPs behave, for zero-sum counting, as
        B uniform independent elements of the order-l subgroup, so the number
        of zero-sum m-subsets is Poisson with mean C(B, m)/l.
      rigorous_support: >-
        Rigorous ingredient: the count is exactly C(B, m)/l in expectation for
        uniform independent points (linearity of expectation over subsets);
        classical statement imitated: the Poisson approximation to the number
        of solutions of a random m-SUM instance. The risk is the Z[tau]
        concentration of a tau-adic walk (178821 part C), which the census
        measures.
      validation_plan: >-
        SAMPLE: the n = 19 walk pools at B in {32, 64, 128}, 20 seeds, m <= 4.
        COMPARISON: counts against Poisson(C(B, m)/l) and against the two
        controls. TAIL: the largest excess over all cells. TRANSFER: to
        n = 131 by the same generic argument; a Koblitz excess at toy scale
        would suspend the transfer.
    - id: H2
      statement: >-
        (DP scaling.) The campaign's DP count scales linearly with
        iterations, so at the expected completion 2^60.8 the pool holds about
        2^35.5 DPs.
      rigorous_support: >-
        A constant DP density is the design of parallel collision search
        (KR-RHO-6239aa); the figure enters only the m = 4 count 2^8.4 at
        completion, not the closure.
      validation_plan: >-
        Not sampled; a reading of KN-LIT-661e97's published counts (2^33 at
        2^58.3), stated as the assumption it is.
