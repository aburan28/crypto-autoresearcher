  assumptions:
    - Requires a relation source (Part-2 toys or stubbed fixtures); does not
      itself clear IMP-PART2-CURVE-LIBS-1.
    - certificate.kind vocabulary stays closed; no new claim tier.
    - Toy n≤23 for the first bake-off; no deployed-curve transfer.

  heuristic_assumptions:
    - id: HEUR-BINSTD-2b71e5-H1
      formal_statement: >-
        FORALL planted single-axis fault families F∈{label,quot,bind} and
        FORALL relations in a ≥50-sample at each n∈{17,23}: P(cert_F rejects)
        ≥ 0.99 AND P(cert_G accepts) ≥ 0.99 for each G≠F, under independent
        Bernoulli trials with the contract's verifier.
      random_model_justification: >-
        Rigorous: each certificate verifies a distinct syntactic/semantic
        predicate in the frozen Part-2 surface. Classical: independent
        predicate failures under single-coordinate corruption unless the
        implementation couples the checks. Transfer to live Part-2 ranks is
        exactly what this instrument must validate before O-SUPPORT.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        Cross-talk ≥0.05 on any off-axis certificate under a single-axis
        plant, OR a no-fault arm shows any certificate red rate ≥0.01.

  predictions:
    - metric: on_axis_reject_rate
      direction: higher
      minimum_effect: '≥0.99 per planted axis'
    - metric: off_axis_accept_rate
      direction: higher
      minimum_effect: '≥0.99 for each non-planted certificate'

  minimal_test: >-
    Stage 0: freeze planted-fault API + no-fault / triple-fault controls.
    Stage 1: n=17, ≥50 relations × 3 single-axis plants; 3×3 matrix.
    Stage 2: replicate n=23. Budget: ≤12 runs, ≤2 CPU-hours. Stop if the
    no-fault arm is not all-green.

  controls:
