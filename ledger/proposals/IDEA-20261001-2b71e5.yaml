# =============================================================================
# IDEA-20261001-2b71e5 -- Planted single-axis certificate faults for Part-2
# CERT-LABEL / CERT-QUOT / CERT-BIND independence. Instrument only; no break.
# =============================================================================
idea:
  id: IDEA-20261001-2b71e5
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    DO THE THREE PART-2 CERTIFICATES FAIL INDEPENDENTLY? On toy Koblitz cells,
    plant one defect at a time (label swap, wrong quotient representative,
    broken BIND hash) and measure whether CERT-LABEL, CERT-QUOT, and CERT-BIND
    each reject their own axis while the other two stay green.

  class: instrument

  claim: >-
    EXP-BINSTD-178742 Part 2 loads its O-SUPPORT reading on the triple
    CERT-LABEL/QUOT/BIND seal. CLAIM: for each planted single-axis fault family
    F∈{label,quot,bind} on ≥50 admitted relations at n∈{17,23}, the matching
    certificate rejects with rate ≥0.99 while the other two certificates accept
    with rate ≥0.99 — OR a measured cross-talk rate names a coupled failure
    mode. CLAIM TIER: instrument / observational. NO exponent. NO break.
    NO n≥131 transfer.

  mechanism: >-
    OBJECT FRAME. Representation: the frozen Part-2 certificate objects on
    relations emitted by (or stubbed against) the typed Part-2 surface.
    Operation set: flip exactly one axis per trial; re-verify all three
    certificates; record the 3×3 accept/reject matrix. Trichotomy: Class I
    instrument that makes the Part-2 seal falsifiable before any rank reading
    is trusted. Lossy-projection / null: a no-fault arm must keep all three
    green; a triple-fault arm must keep all three red. OFF-LIMITS: claiming
    O-SUPPORT from certificate rates alone; Magma/Sage provisioning.
    WHAT IS NEW: independence of the three seals as a measured quantity,
    not a prose assumption in the contract.

