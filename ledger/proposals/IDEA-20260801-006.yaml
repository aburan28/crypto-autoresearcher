idea:
  id: IDEA-20260801-006
  question_id: H-WESO-001
  title: >-
    Van Oorschot–Wiener middle-memory recomputation: verify the Wesolowski
    concrete-cost table at p in [512, 1024] bits with charged golden-ratio
    tradeoff
  class: measurement
  claim: >-
    Wesolowski 2026's concrete van Oorschot–Wiener middle-memory cost for the
    supersingular isogeny problem, at cryptographic sizes, can be independently
    recomputed as a charged golden-ratio (S*T = N_expected) tradeoff table over
    p in [512, 1024] bits, and the recomputation either matches the paper's
    published cost table within the charged conventions or exposes a discrepancy
    in the memory/time accounting that changes the crossover against
    Delfs-Galbraith.
  mechanism: >-
    The vOW golden-ratio tradeoff S*T = N_expected fixes the memory-time
    frontier given an expected number of oracle evaluations; the Wesolowski
    p^{1/3+o(1)} claim rests on a concrete parameterization of this tradeoff.
    Recompute the table from the paper's stated equations under strict memory
    charging (bits of stored distinguished points, table structure), then
    compare against Delfs-Galbraith with the same charging rules; report any
    crossover shift.
  novelty_status: adaptation
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/literature
      - ledger/proposals
    grep_results:
      - No existing proposal independently recomputes the Wesolowski concrete
        cost table under matched memory charging.
    conclusion: >-
      Known tradeoff (vOW golden ratio) applied to the specific task of
      verifying the paper's published table; adaptation.
  assumptions:
    - The paper's equations for the tradeoff are complete and self-contained.
    - Memory charging conventions can be matched to those used in the paper.
  predictions:
    - metric: recomputed_vs_published_cost_delta
      direction: different
      minimum_effect: >-
        A delta exceeding the charged-convention uncertainty (target: any
        delta beyond rounding at the stated precision) at any p in range is a
        discrepancy signal.
  minimal_test:
    design: >-
      Reimplement the vOW tradeoff table from the paper's equations; compute
      cost rows for p in [512, 1024] bits at the paper's stated middle-memory
      levels; recompute Delfs-Galbraith under identical charging; emit a
      comparison table and a crossover analysis.
    controls:
      - Recompute the paper's own table as a positive control (must reproduce
        within rounding).
      - Charge memory as stored bits under two conventions (raw vs indexed) and
        report both.
    required_metrics:
      - vOW cost per p and memory level
      - Delfs-Galbraith cost per p under same charging
      - crossover point(s) and sensitivity to conventions
  falsification_conditions:
    - Recomputation matches the published table within rounding (assessment
      of the paper's concrete claim passes).
    - Recomputation diverges under matched charging (discrepancy; the paper's
      concrete table needs correction or a new crossover).
  confounders:
    - Ambiguity in the paper's memory units.
    - Machine-model assumptions (word size, memory latency) in the charged
      cost.
  interpretation_limits:
    - Cost-table verification is not a novel attack.
    - A passing table does not validate Heuristic 1 (separate item under
      H-WESO-001).
  heuristic_assumptions:
    - id: HEUR-P13-VOW-1
      statement: >-
        The golden-ratio tradeoff S*T = N_expected is the correct vOW cost
        model at the sizes in range.
      rigorous_support: Standard van Oorschot–Wiener analysis; also the model
        used by the paper itself.
      validation_plan: Reproduce the paper's own table as validation; any
        residual mismatch is attributed to charging conventions and reported
        separately.
  target_complexity:
    time_exponent: p^{1/3+o(1)} (claimed; this proposal measures its concrete
      realization)
    memory_exponent: p^{1/3+o(1)} (claimed middle-memory level)
    best_known: Delfs-Galbraith p^{1/4} heuristic (memory-unconstrained) /
      vOW-charged variant
    hidden_overhead: constants and o(1) terms in the table rows
    tradeoff_note: S*T golden-ratio frontier; sensitivity to charging
      conventions is a deliverable.
  dominated_by: null
  sota_delta: >-
    No new attack. Deliverable is an independently charged cost table and
    crossover analysis; value is verifying the paper's concrete claim.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
