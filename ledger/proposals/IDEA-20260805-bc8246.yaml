idea:
  id: IDEA-20260805-bc8246
  question_id: RQ-SSI-001
  added: '2026-08-05'
  goal_id: GOAL-SSI-001
  title: >-
    Three conventions, three verdicts: the van Oorschot-Wiener supersingular claw curve is
    exactly AT^2-isocost, and under plain area-time the p^{1/3+o(1)} algorithm is p^{1/6}
    BEHIND the polynomial-memory baseline at every p -- so GOAL-SSI-001's completion
    criterion is convention-indexed and the convention has never been pinned
  class: cost-model

  claim: >-
    GOAL-SSI-001's completion criterion 1 requires a mechanism that "materially improves a
    matched baseline ... while charging memory". THAT SENTENCE HAS NO TRUTH VALUE UNTIL A
    COST FUNCTIONAL IS NAMED, and the field's own headline result is the proof: apply three
    standard functionals to the ONE published time-memory curve of the 2026 p^{1/3+o(1)}
    algorithm and they disagree about its sign.
    The curve is the paper's own (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md section 1.1,
    READ VERBATIM): "The time-memory tradeoff of van Oorschot-Wiener [43] solves a
    claw-finding problem of this size in time essentially sqrt(N^3/w) = p^{1/2+o(1)}/w^{1/2}
    with memory w", interpolating between the new p^{1/3+o(1)} algorithm at w = N = p^{1/3}
    and "the classic p^{1/2+o(1)} algorithms with polynomial memory". Then, with A = area
    (memory cells) and T = time, sequentially (one processor):
      TIME ONLY:  T(w) = p^{1/2}/w^{1/2}   -- strictly DECREASING in w. The p^{1/3} endpoint
                  wins by p^{1/6}.
      A*T^2:      A T^2 = w * p / w = p^{1+o(1)}  -- EXACTLY INVARIANT IN w. Every point of
                  the curve, including both endpoints, costs the same. THE MEMORY AXIS IS
                  FREE UNDER AT^2 AND THE COMPARISON IS A TIE.
      A*T:        A T = w^{1/2} p^{1/2}   -- strictly INCREASING in w. The polynomial-memory
                  Delfs-Galbraith endpoint wins by p^{1/6}, at every p, with no crossover.
    Three functionals, one curve, three different winners, all derived in one line each and
    all checkable against the paper's own five-row concrete cost table. The table supplies a
    KNOWN-ANSWER GATE that is exact: for its "previous methods" column (negligible memory,
    time 2^128 / 2^192 / 2^256 / 2^288 / 2^384 at log2 p = 256 / 384 / 512 / 576 / 768),
    log2(A T^2) = 2 log2 T = 256 / 384 / 512 / 576 / 768 = log2 p IN ALL FIVE ROWS EXACTLY,
    confirming AT^2 = p^{1+o(1)} against the paper's independently computed numbers.
    The deliverable is a pinned CHARGING REGISTER for this goal plus the honest three-row
    verdict, and a falsifiable prediction about a sibling proposal: under AT^2 the crossover
    locus p*(w) of IDEA-20260803-48e258 must be INDEPENDENT of w, because AT^2 has zero slope
    along the entire curve.

  object_first_candidate:
    tracked_object: >-
      The COST FUNCTIONAL itself -- the map M: (A, T, n) -> R applied to a one-parameter
      algorithm family -- followed through the comparison rather than through the
      computation. What is tracked across instances is the sign of
      M(new algorithm) - M(baseline) and the slope d log M / d log w along the published
      tradeoff curve. This is deliberately an instrument-side object: the proposal attacks
      the measurement, not the target.
    established_families_off_limits: >-
      OFF-LIMITS AS THE PRIMARY LENS: meet-in-the-middle / claw / golden-collision as
      algorithms (they enter only as arguments of the functional); KLPT and quaternion-side
      methods; orientation / CM (closed for this goal by DEC-20260804-3677f1); torsion-image
      and higher-dimensional embeddings (out of RQ-SSI-001 scope); quantum cost models
      (KN-OPEN-014's convention dispute is explicitly NOT re-opened here, and the record
      states its classical scope on its face); SQIsign transcript statistics.
      Also declared off-limits: proposing any new algorithm. This record proposes none.
    newness_score: >-
      Area-time and AT^2 are textbook. The AT^2-invariance of a T ~ w^{-1/2} curve is one
      line of algebra. WHAT IS NEW HERE IS NOT THE MATHEMATICS BUT THE APPLICATION: this
      goal has produced 47 EV-SSI-* evidence records (COUNTED IN THIS SESSION), of which 45
      carry BOTH `experiment_ids: []` and `run_ids: []` and 41 are tiered `theory`, while
      the house exemplar they are measured against is memory-Pareto-INCOMPARABLE with its
      own baseline (docs/target-result-profile.md lines 176-182, READ). Nobody has written
      the three-verdict table, and the goal's completion criterion presumes it exists.
      MEASUREMENT CORRECTION, RECORDED RATHER THAN INHERITED: the 2026-08-05 scouting brief
      states "38 of 46 EV-SSI-* never mention memory". A direct count in this session finds
      only 8 of 47 files lacking the string "memory" anywhere, and 47 rather than 46 files.
      THE BRIEF'S FIGURE IS NOT REPRODUCED HERE AND IS NOT USED. Whatever it measured, it was
      not string presence; the defect this record documents is not silence about memory but
      the absence of a named cost functional, which is a different and checkable thing.
    testability_score: >-
      Maximal and free: arithmetic on five published rows plus symbolic differentiation of
      two one-line cost expressions. No solver, no network for the primary stages, no
      dependence on the environment disagreement recorded in the 2026-08-05 scouting brief.
    survival_score: >-
      The functional survives every reparametrisation of the curve, which is precisely the
      point: it is invariant enough to compare incomparable algorithms, and the record's
      content is that DIFFERENT invariant choices give different answers. It does NOT
      survive the introduction of unbounded parallelism, and the record derives exactly
      where it breaks (see mechanism step 4) rather than hiding it.

  mechanism: >-
    NOTATION AND SCOPE, FIXED BEFORE ANY ARITHMETIC. p prime; N = p^{1/3+o(1)} is the claw
    set size named by the paper; w is memory in cells; n is processor count; A is chip area,
    charged as A = w + n with one unit per memory cell and one per processor; T is wall
    clock in unit local operations. All three functionals below are DEFINED HERE and require
    no external source. A fourth, the programme's own
    `wiener_full_cost_plus_isogeny_step_count` (KN-TECH-035, KN-TECH-050, H-SSI-001), is
    NOT derivable from anything read in this session -- KN-TECH-035 states "BSGS needs
    n^{1/2+o(1)} processor steps but has full cost n^{2/3+o(1)}", and that is NOT plain A*T
    for a sqrt(n)-cell table (which gives n), so its functional form involves a wiring model
    this record has not read. IT IS THEREFORE DECLARED UNRESOLVED AND ITS TRANSCRIPTION FROM
    KN-LIT-094 IS A STAGE OF THE EXPERIMENT WITH AN UNRUN DISPOSITION. Nothing below depends
    on it.

    STEP 1 -- THE CURVE, QUOTED NOT RECALLED. Paper section 1.1, READ verbatim: "its memory
    cost is essentially as high as the complexity p^{1/3+o(1)} ... the algorithm essentially
    resolves a claw-finding problem for two sets of size N = p^{1/3+o(1)}. The time-memory
    tradeoff of van Oorschot-Wiener [43] solves a claw-finding problem of this size in time
    essentially sqrt(N^3/w) = p^{1/2+o(1)}/w^{1/2} with memory w. This allows one to
    interpolate between the p^{1/3+o(1)} high-memory algorithm presented here and the classic
    p^{1/2+o(1)} algorithms with polynomial memory like [21]." And: "the van Oorschot-Wiener
    algorithm is also parallelizable, leading to an attack in time
    p^{1/2+o(1)}/(w^{1/2} n) with memory w and n parallel processors."
    Consistency check performed here, not assumed: sqrt(N^3/w) = p^{1/2}/w^{1/2} forces
    N^3 = p, i.e. N = p^{1/3}, exactly the claw set size the same paragraph states. The
    quoted formula is internally consistent and the endpoints land where the paper says:
    w = N = p^{1/3} gives T = p^{1/2}/p^{1/6} = p^{1/3} (Theorem 1.1's point), and
    w = polylog gives T = p^{1/2} (Delfs-Galbraith).

    STEP 2 -- THE THREE SEQUENTIAL VERDICTS (n = 1, A = w). One line each.
      TIME:   T(w) = p^{1/2+o(1)} w^{-1/2};  d log T / d log w = -1/2.  Minimised at w max.
      AT:     A T   = w * p^{1/2} w^{-1/2} = p^{1/2+o(1)} w^{+1/2};
              d log(AT) / d log w = +1/2.  Minimised at w = polylog. At w = p^{1/3} it is
              p^{1/2+1/6} = p^{2/3+o(1)} against p^{1/2+o(1)} for the polynomial-memory
              endpoint: A FIXED p^{1/6} DEFICIT, AT EVERY p, WITH NO CROSSOVER AT ALL.
      AT^2:   A T^2 = w * p^{1+o(1)} w^{-1} = p^{1+o(1)};
              d log(AT^2) / d log w = 0 EXACTLY.  THE ENTIRE CURVE IS ONE ISOCOST POINT.
    A fourth quantity worth reporting because it is what a parallel machine actually pays:
      TOTAL WORK (operations): n*T = p^{1/2+o(1)} w^{-1/2}, decreasing in w with slope -1/2.
    So under total work the high-memory endpoint is genuinely cheaper by p^{1/6}; under AT
    it is genuinely more expensive by p^{1/6}; under AT^2 the two are indistinguishable.
    None of these three statements is controversial, and no record in this goal contains any
    of them.

    STEP 3 -- THE FIVE-ROW KNOWN-ANSWER GATE, EXACT. The paper's section 4.1 table (READ
    verbatim, reproduced in docs/target-result-profile.md lines 176-182) gives, at
    log2 p = 256 / 384 / 512 / 576 / 768:
      new algorithm  log2 T = 106.5 / 157.5 / 204.2 / 230.9 / 302.4,
                     log2 M =  92.5 / 138.6 / 181.3 / 206.0 / 272.2;
      previous       log2 T = 128 / 192 / 256 / 288 / 384, memory "negligible".
    Charging the previous column at A = 1 unit:
      log2(A T^2) = 2 log2 T = 256 / 384 / 512 / 576 / 768 = log2 p, EXACTLY, IN ALL FIVE
      ROWS. The asymptotic identity AT^2 = p^{1+o(1)} is therefore confirmed to the digit
      against numbers computed independently by the paper's author under a different model.
      This is a known-answer gate: any implementation of the register that does not
      reproduce five exact zeros here is wrong before it evaluates anything else.
    For the new algorithm's column the same functional gives log2(A T^2) - log2 p =
      49.5 / 69.6 / 77.7 / 91.8 / 109.0 bits, i.e. as a FRACTION of log2 p:
      0.1934 / 0.1813 / 0.1518 / 0.1594 / 0.1419.
      TWO THINGS TO REPORT HONESTLY AND NOT SMOOTH: the fraction is decreasing overall,
      consistent with AT^2 = p^{1+o(1)} and o(1) -> 0 slowly; and it is NOT MONOTONE -- the
      512-row 0.1518 is below the 576-row 0.1594. That kink is either table rounding or a
      real feature of the underlying optimisation, and the register must flag it rather than
      fit through it. A naive least-squares extrapolation of the five fractions to zero
      places the AT^2 crossover at log2 p ~ 2101, which is reported as WHAT THE NAIVE FIT
      SAYS and explicitly NOT as a prediction, because five points, one of them off-trend,
      and a superpolynomial o(1) do not support extrapolation over eleven binary orders of
      magnitude.
    Under AT the same rows give log2(AT) - log2(AT_prev) = 71.0 / 104.1 / 129.5 / 148.9 /
      190.6 bits, i.e. fractions 0.2773 / 0.2711 / 0.2529 / 0.2585 / 0.2482 of log2 p,
      descending toward the asymptotic 1/6 = 0.1667 and NEVER REACHING ZERO. The AT verdict
      has no crossover to find.

    STEP 4 -- WHERE THE VERDICT FLIPS, DERIVED RATHER THAN HIDDEN. With n processors,
    A = w + n and T = p^{1/2+o(1)}/(w^{1/2} n), subject to T >= 1:
      AT = (w + n) p^{1/2} w^{-1/2} n^{-1} = p^{1/2} w^{1/2} n^{-1} + p^{1/2} w^{-1/2}.
    The first term is the cost of memory sitting idle and vanishes as n grows; the second is
    the total work. Minimising over the admissible region (T >= 1 forces n <= p^{1/2}/w^{1/2}):
    at T = 1, AT = w + p^{1/2} w^{-1/2}, minimised at w^{3/2} = (1/2) p^{1/2}, i.e.
    w ~ p^{1/3}, giving AT ~ 2 p^{1/3}. Delfs-Galbraith parallelised (A = n, T = p^{1/2}/n)
    has AT = p^{1/2} for every n. SO UNDER AT WITH UNBOUNDED PARALLELISM THE ORDERING
    REVERSES AND THE HIGH-MEMORY POINT WINS BY p^{1/6} -- the exact opposite of the
    sequential AT verdict of step 2. The sign of the comparison is therefore a function of
    (functional, parallelism regime), not of the mathematics of either algorithm. That is
    the finding, and it is why a register rather than a number is the right deliverable.

    STEP 5 -- WHAT THIS SAYS ABOUT A SIBLING PROPOSAL, STATED AS A FALSIFIABLE PREDICTION
    RATHER THAN A CRITICISM. IDEA-20260803-48e258 (GOAL-P13-001) proposes emitting the
    crossover locus p*(w) between the corrected p^{1/3} cost and the matched
    Delfs-Galbraith / vOW baseline as a function of memory w. Under AT^2 that locus is
    FORCED TO BE CONSTANT IN w, because both curves have zero AT^2 slope in w. Under AT it
    is forced not to exist at all in the sequential regime, because the AT gap never changes
    sign. Under time-only it is the curve that proposal describes. The two records are
    therefore complementary and this one predicts the shape of that one's output under two
    of the three conventions. NEITHER RECORD DEPENDS ON THE OTHER AND THIS ONE CONSUMES NONE
    OF GOAL-P13-001'S COMMITTED MEASUREMENTS.

