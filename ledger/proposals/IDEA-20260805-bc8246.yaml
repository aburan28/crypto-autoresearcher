  lossy_projection_identifiability_audit:
    projection: >-
      An algorithm's full resource profile (memory w, processors n, wall clock T, access
      pattern, latency, energy) --> a single real number M(A, T, n).
    what_is_discarded: >-
      Everything except one scalar per algorithm. Two algorithms with entirely different
      resource shapes map to the same value whenever A T^k agrees.
    why_genuinely_lossy: >-
      Demonstrably and quantifiably so: under AT^2 the ENTIRE one-parameter vOW family, from
      w = 1 to w = p^{1/3}, collapses to a single value p^{1+o(1)}. A p^{1/3}-fold range of
      memory and a p^{1/6}-fold range of time are discarded.
    why_compatible_with_the_operations: >-
      The functional composes with the operations that matter for comparison: it is
      multiplicative under sequential composition of stages and monotone under adding
      hardware, so it propagates deterministically along the tradeoff curve, which is what
      makes d log M / d log w a well-defined and predictable quantity rather than a fit.
    is_it_only_a_change_of_coordinates: >-
      NO -- and this is checked in the direction that matters. If M were merely a change of
      coordinates on (A, T) it could not change the SIGN of a comparison, and the whole
      record is a demonstration that it does: the same pair of algorithms is ranked in
      opposite orders by AT and by time, and tied by AT^2. A relabelling cannot do that.
    mirror_failure_check: >-
      CHECKED, AND IT PARTIALLY FIRES -- REPORTED RATHER THAN SUPPRESSED. The mirror failure
      is a projection so lossy it is constant across instances. AT^2 IS EXACTLY THAT along
      the vOW curve: zero comparator spread in w. THE PROPOSAL'S RESPONSE IS THAT THE
      CONSTANCY IS THE RESULT, not a defect of the instrument, because the constancy is
      DERIVED IN ADVANCE and is a substantive statement about the algorithm family (its
      memory is free under AT^2). To keep the instrument honest anyway, the contract pairs
      AT^2 with AT and with time-only, both of which have nonzero, opposite-signed slopes on
      the same curve, so the comparator demonstrably CAN move.

  assumptions:
    - >-
      Area is charged as A = w + n with one unit per memory cell and one per processor, and
      T counts unit local operations with no wiring latency. This is a DEFINITION adopted
      here, not a claim about physical machines, and every verdict is scoped to it.
    - >-
      The paper's quoted vOW formula T = p^{1/2+o(1)}/(w^{1/2} n) is used as given. Its
      derivation was not checked against van Oorschot-Wiener 1999, which was not read.
    - >-
      The o(1) is treated as a constant over any range where a fraction is reported, which
      is FALSE (the paper says the overhead is superpolynomial) and is the reason no
      extrapolated crossover is claimed.
    - >-
      Classical costs only. Quantum charging conventions (KN-OPEN-014) are out of scope and
      the record must not be cited on them.

  proof_search_map_note: >-
    The paired hypothesis H-SSI-8ff06b carries the filled four-audit proof_search_map.

  predictions:
    - metric: >-
        known_answer_gate_residual: max over the five table rows of
        | log2(A T^2) - log2 p | for the "previous methods" column charged at A = 1
      direction: lower
      minimum_effect: >-
        EXACTLY 0.0 bits in all five rows (256, 384, 512, 576, 768). Derived and verified in
        this record against the paper's own table. A nonzero residual means the table was
        mis-transcribed or the functional mis-implemented, and NOTHING ELSE may be evaluated
        until it is zero.
    - metric: >-
        at2_slope: d log2(A T^2) / d log2 w along the sequential vOW curve, evaluated
        numerically at w = 2^0, 2^{L/12}, 2^{L/6}, 2^{L/4}, 2^{L/3} with L = log2 p
      direction: different
      minimum_effect: >-
        EXACTLY 0.000, |slope| < 0.02 at every one of the five w values and at every one of
        the five primes. This is an algebraic identity, so any nonzero slope is an
        implementation defect.
    - metric: >-
        at_slope: d log2(A T) / d log2 w on the same grid
      direction: higher
      minimum_effect: >-
        EXACTLY +0.500, within 0.02. Together with the AT^2 slope of 0 and the time slope of
        -0.500, this is the three-verdict result stated as three numbers.
    - metric: >-
        at_gap_sign: sign of log2(AT)_new - log2(AT)_previous across the five table rows,
        sequential regime
      direction: same
      minimum_effect: >-
        POSITIVE (new algorithm more expensive) in all five rows, with magnitudes
        71.0 / 104.1 / 129.5 / 148.9 / 190.6 bits and fractions of log2 p
        0.2773 / 0.2711 / 0.2529 / 0.2585 / 0.2482 descending toward 1/6 = 0.1667. A single
        negative row falsifies the sequential AT verdict.
    - metric: >-
        at2_excess_nonmonotonicity: whether the reported AT^2 excess fraction sequence is
        flagged as non-monotone at the 512 -> 576 step
      direction: different
      minimum_effect: >-
        The kink (0.1518 then 0.1594) MUST be reported explicitly. A register that emits a
        monotone fitted curve through these five points has smoothed away a feature of its
        own input, and that is a pre-registered failure of the deliverable, not of the data.
    - metric: >-
        parallel_flip_locus: the (w, n) region in which argmin_w AT moves from w = polylog
        to w ~ p^{1/3}
      direction: different
      minimum_effect: >-
        The flip MUST be located and reported, with the derived optimum w ~ (p^{1/2}/2)^{2/3}
        at T = 1 giving AT ~ 2 p^{1/3} against Delfs-Galbraith's p^{1/2}. A register that
        emits only the sequential verdict has reported half the answer.

  minimal_test:
    design: >-
      Four stages, cheapest decisive first; full contract at
      experiments/EXP-SSI-eca132/specification.yaml.
      STAGE 0 (pen and paper, zero compute, CAN END THE LINE): re-derive the three slopes
      symbolically. If AT^2's slope is not identically zero, the headline is wrong and the
      record is withdrawn before anything is computed.
      STAGE 1 (seconds): transcribe the five table rows from the frozen in-repo paper text
      with a hash, and run the known-answer gate. A nonzero residual halts everything.
      STAGE 2 (seconds): evaluate all four functionals on the graded w grid at all five
      primes; run the null and positive controls.
      STAGE 3 (zero compute, may report UNRUN): attempt to transcribe the programme's own
      `full cost` functional from KN-LIT-094. If the source cannot be obtained, the fourth
      column is reported UNRUN under AGENTS.md rule 5 and the first three stand.
    controls:
      - >-
        POSITIVE CONTROL (the instrument must fire): the textbook baby-step giant-step
        tradeoff over a space of size N -- T = N/m, A = m. Forced values derived pre-run:
        AT = N EXACTLY INVARIANT in m, AT^2 = N^2/m strictly DECREASING with slope -1, time
        slope -1. The register must reproduce all three. If it cannot recover the
        best-known behaviour of the most standard tradeoff in the subject, it is broken and
        NO verdict about the isogeny curve may be reported.
      - >-
        NULL OBJECT OF THE SAME SHAPE (forced value pre-derived, CAN FAIL): Kohel's
        p*(log p)^{O(1)} algorithm at polynomial memory -- an algorithm family with NO
        time-memory tradeoff, a single point rather than a curve. Forced value: every
        functional returns a w-INDEPENDENT number and the register must emit
        "no tradeoff; slope undefined" rather than a curve. If the machinery manufactures a
        nontrivial curve for a point family, it is fabricating structure and every slope it
        reports elsewhere is suspect. This null can fail: a careless implementation that
        substitutes w into an expression that does not contain it will silently emit a flat
        line and pass; the contract therefore requires the register to detect and DECLARE
        the absence of a w-dependence, not merely to compute a constant.
      - >-
        GRADED CONTROL, 5 points, >= 3 interior, monotonicity reported: evaluate at
        w = 2^0, 2^{L/12}, 2^{L/6}, 2^{L/4}, 2^{L/3} (L = log2 p) and report, per functional,
        whether the sequence is strictly decreasing / flat / strictly increasing. The three
        pre-registered answers are decreasing (time), flat (AT^2), increasing (AT). A
        functional whose measured monotonicity disagrees with its derived slope localises the
        defect to that functional instead of leaving "the register disagreed".
      - >-
        ORDERING CONTROL: the known-answer gate and both controls are computed, recorded and
        hash-committed BEFORE the new algorithm's column is evaluated.
      - >-
        TRANSCRIPTION CONTROL: the five rows are read from the in-repo frozen text
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md and independently from
        docs/target-result-profile.md lines 176-182, and the two must agree digit for digit.
        A mismatch is an integrity failure.
    required_metrics:
      - the four-functional x five-prime x five-w register, machine-readable
      - the known-answer gate residual per row (five exact zeros expected)
      - measured slopes per functional with the derived value beside each
      - positive-control and null-object outputs with their pre-derived forced values
      - the parallel-regime flip locus and its derivation
      - a UNRUN record for the `full cost` column if KN-LIT-094 is not obtained

  falsification_conditions:
    - >-
      Any of the five known-answer residuals is nonzero. The transcription or the functional
      is wrong; nothing is emitted.
    - >-
      The measured AT^2 slope along the vOW curve is not zero. The headline identity is
      false as stated and the record is withdrawn by a superseding record.
    - >-
      The BSGS positive control does not reproduce AT invariant and AT^2 decreasing. The
      instrument is broken and no isogeny verdict may be reported.
    - >-
      The Kohel null emits a nontrivial curve. The machinery fabricates w-dependence.
    - >-
      Any AT gap row comes out negative in the sequential regime. The sequential AT verdict
      is refuted at that prime size and must be restated, not defended.

  confounders:
