idea:
  id: IDEA-20261007-fad964
  question_id: RQ-ECDLP-4fcbd3
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Count of pairs with x(P+Q) equal to x(P)+x(Q) on
    y^2 = x^3 + 3x + 2 over F_67
  class: measurement
  claim: >-
    On the nonsingular curve E: y^2 = x^3 + 3x + 2 over F_67, let U
    be the ordered pairs of affine points (P, Q) with y(P) ≠ 0,
    y(Q) ≠ 0, x(P) ≠ x(Q), and P+Q affine. The number of pairs in U
    with x(P+Q) = x(P) + x(Q) in F_67 is at most 8·67. This counts
    when the x-coordinate of the sum agrees with field addition of
    the x-coordinates. It is not an image size of x(P)+x(2P), not a
    character sum, and not a comparison of integer x with integer y.
  mechanism: >-
    The representation is the triple of field elements
    (x(P), x(Q), x(P+Q)). Sigma is the singleton {chord sum of two
    points with distinct x}. The chord slope is
    (y(Q)-y(P))/(x(Q)-x(P)), and the addition law gives
    x(P+Q) = λ^2 - x(P) - x(Q). Equality with x(P)+x(Q) is the
    condition λ^2 = 2(x(P)+x(Q)). The retained bit is whether that
    equality holds. The bit is lossy: many pairs can share it. The
    priced number is the count of pairs where the bit is true.
    Doubling is not the operation. A factor-base relation is not
    the object. The discrete log is not an input.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-4fcbd3
      provenance: internal
      claim: >-
        The question treats a coordinate bias of addition as
        possible information. This proposal prices one exact
        agreement of the addition law with field addition of x, and
        claims no discrete-log correlation.
      verified_by: ledger/questions/RQ-ECDLP-4fcbd3.yaml
    - ref: KR-RHO-fbd582
      provenance: internal
      claim: >-
        x(P-Q) is nearly free given x(P+Q). This proposal does not
        use that shortcut. It counts a different equality.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fbd582.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A sub-square-root algorithm must exploit the representation.
        This proposal does not claim an algorithm.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
  assumptions:
    - >-
      4·3^3 + 27·2^2 = 216, so the discriminant is -16·216 = -3456
      ≡ 28 (mod 67), which is nonzero. The characteristic is not 2
      or 3.
    - Pairs with x(P) = x(Q) are outside U, because the chord slope is not the tangent slope.
    - The point at infinity is not an x-coordinate in the equality.
  predictions:
    - metric: the number of pairs in U with x(P+Q) = x(P) + x(Q)
      direction: lower
      minimum_effect: the count is at most 8·67
  minimal_test: >-
    Enumerate the affine points of E(F_67). Build U. Count the pairs
    where the two formulas x(P+Q) from the chord and x(P)+x(Q) in
    the field agree. A second pass that scans Q before P must
    produce the same count. A control that replaces x(P+Q) by a
    random field element, one per pair, from a fixed seed, must
    report a count within a factor of two of |U|/67, or the
    equality counter is void. The random control is not entered as
    a curve pair.
  controls:
    - the two scan orders agree on the count and on |U|
    - the random-field control is recorded and is not a curve pair
    - pairs with x(P) = x(Q) are excluded
    - the discrete log is not an input
  falsification_conditions:
    - >-
      The count is strictly greater than 8·67, and the two scan
      orders agree. The upper bound is then false on this curve.
    - >-
      The two scan orders disagree. The counter is then void, and
      the count is not evidence.
  confounders:
    - Counting an unordered pair twice would double the total. The pre-registered set is ordered pairs.
    - Using the tangent formula on a pair with equal x would invent a slope the chord does not have.
  interpretation_limits:
    - A count at most 8·67 does not change the rho exponent 1/2.
    - A count above 8·67 falsifies only this curve.
    - The count is not a charged cost for a sumset or a linear algebra stage.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For each ordered pair with distinct x, the equality
        λ^2 = 2(x(P)+x(Q)) is treated as one field condition. A
        uniform guess would put about |U|/67 pairs on it. The
        pre-registered ceiling 8·67 is eight field-sizes, which is
        the statement under test, not a derived theorem.
      rigorous_support: >-
        The addition formula gives the equality exactly when
        λ^2 = 2(x(P)+x(Q)). No theorem is claimed that the number
        of solutions is at most 8·67. The ceiling is the prediction.
      validation_plan: >-
        Count the agreeing pairs on this curve. H1 fails if the
        count exceeds 8·67 while the two scan orders agree. Sample
        size is the whole set U.
  target_complexity:
    time_exponent: >-
      Unchanged at 1/2. A pair count is not an exponent.
    memory_exponent: >-
      Unchanged. The census stores O(p) points and scans pairs at
      p = 67.
    best_known: >-
      KR-RHO-13bf67, Omega(N^{1/2}) generic-group operations. The
      file was opened for this proposal.
    hidden_overhead: >-
      No new o(1) cofactor is claimed. The scan is one pass over
      the pairs of a 67-element field.
    tradeoff_note: >-
      No time-memory tradeoff. The census is a single pass.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-fb88e6
      - KR-RHO-fbd582
    nearest:
      - ref: KR-RHO-fbd582
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fbd582.yaml
        relation: adjacent
        delta: >-
          The row prices x(P-Q) once x(P+Q) is known. This proposal
