idea:
  id: IDEA-20260816-32c366
  question_id: RQ-FRODO-a2dbe2
  added: '2026-08-16'
  title: 'A per-ciphertext salt is a hash-input partition, so measure it as one: build the target-hit
    multiset of a multi-target hash search over U users and C ciphertexts each, with and without a
    salt of length s, and measure the exponent at which the number of targets hit per hash query stops
    growing.'
  class: measurement
  claim: '(A) OBJECT. In a multi-target setting the attacker performs hash queries and each query
    may match one or more of the U times C live targets. The tracked object is the TARGET-HIT MULTISET:
    for each query, the set of targets it matches, accumulated over the search. Its growth exponent,
    defined as the slope of log expected distinct targets hit against log queries, is the quantity
    that multi-target amortization is made of, and it is measurable directly by simulation at toy
    digest widths without any reference to any scheme. (B) CLAIM. Salting acts on this object as an
    input partition, not as a difficulty increase: with a per-ciphertext salt of length s bits, a
    query is bound to one salt value and can hit only targets sharing it, so the expected distinct
    targets hit per query drops by a factor that is a function of s and of the target count only,
    and the growth exponent changes from the unsalted amortized regime to a per-target regime once
    the number of distinct salts among live targets exceeds a threshold computable in closed form.
    The claim is that this threshold and the transition are OBSERVABLE at toy digest widths of 20
    to 32 bits, where the whole search is enumerable, and that the measured transition location matches
    a closed-form prediction derived in advance. (C) COUNTING CLAIM. The relevant count is the number
    of DISTINCT salt values among live targets, not the salt length: a salt drawn from a small space,
    or reused across ciphertexts by a deployment, degrades toward the unsalted regime continuously,
    and the degradation curve as a function of distinct-salt count is measurable in the same rig.
    (D) WHAT IS NOT CLAIMED. No attack, no break, no statement about FrodoKEM''s salt, and no statement
    about whether any deployed multi-target setting is reachable. This measures a combinatorial object
    at toy digest widths. It does not claim that a hash search is the best multi-target strategy against
    any scheme, does not charge any real adversary, and produces no bit-security figure for anything.
    It also makes no assertion about what the 2025 FrodoKEM proposal revision does, which RQ-FRODO-a2dbe2.provenance
    records as an unverified research target.'
  mechanism: 'STAGE 1. Build a target generator: U users, C ciphertexts each, each target a digest
    of w bits derived from a seeded pseudorandom function, with a salt field of s bits drawn from
    a controlled distribution whose number of DISTINCT values is a directly settable independent variable
    rather than a consequence of s. STAGE 2. Build a query process: the attacker draws inputs, computes
    digests, and looks up matches in a table of live targets. Because w is 20 to 32 bits, the entire
    query space is enumerable and expectations can be computed exactly as well as sampled, which gives
    a built-in analytic cross-check that costs nothing. STAGE 3. Measure the target-hit multiset:
    distinct targets hit versus queries, on log axes, and fit the growth exponent by regression over
    the pre-transition and post-transition regimes separately, with the breakpoint located rather
    than assumed. STAGE 4. Derive the closed-form transition prediction in advance from a balls-in-bins
    argument on salt values, register it, and compare. STAGE 5. Sweep the distinct-salt count independently
    of s, producing the degradation curve of claim (C). STAGE 6. Null arm in the same invocation:
    targets whose salt field is present but IGNORED by the matching rule, which must reproduce the
    unsalted curve exactly, isolating the effect of partitioning from the effect of merely having
    a longer input. STAGE 7. Structural tell per inventor-protocol section 3: sweep w upward and confirm
    the transition location moves as the closed form says it must; a transition location constant
    in w would indicate the rig is measuring its own table size.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-FRODO-a2dbe2 in full including its multi-user and multi-ciphertext amortization
      target and its provenance note that the per-ciphertext salt is an unverified research target.
      Read GOAL-FRODO-002 objective and scheme_context. Ran grep -ril over ledger/proposals/ for salt,
      multi-target, multi_target, and parsed the titles of the twenty-three nearest hits; also grepped
      for tightness and QROM to catch adjacent framings.
    results: 'Multi-target appears in more than twenty proposals but the hits cluster in two places
      that are not this. First, ECDLP and isogeny multi-target framings: IDEA-20260814-c3af09, -92f825,
      -270e03, IDEA-20260809-1b5b15, -dc7006, -c4ecac, IDEA-20260808-917e63, -9d6677, -2fabbc, which
      concern batch discrete-log and volcano walks, and the harness even carries run_mtgt2.py and
      run_volc_mtgt.py for that lane. Second, lattice-KEM multi-ciphertext framings: IDEA-20260805-3d71ca
      (left tail of the projected error norm over many ciphertexts of one static ML-KEM key) and IDEA-20260815-440ebb
      and -284aff. None of these treats a salt as a hash-input partition and none measures a target-hit
      growth exponent. Salt appears in eleven proposals, all incidentally within other framings; the
      only FRODO-adjacent hit is IDEA-20260808-d21021 (HQC), which concerns steerable ciphertext energy
      and worst-case correctness rather than salting. No FRODO proposal mentions salt or multi-target
      at all: the six are entirely about the sampling table, the failure rate, the Renyi order and
      the primal lattice shape.'
    verdict: 'UNVERIFIED. No external literature is reachable here, so nothing is asserted about published
      multi-target or salting analyses. Claimed new inside this repository: measuring salting as a
      partition effect on a target-hit multiset with the number of DISTINCT salt values as an independent
      variable decoupled from salt length, and locating the growth-exponent transition rather than
      assuming it. Assembled from known parts: balls-in-bins and birthday counting are elementary;
      multi-target framings exist in this corpus for other objects, as listed above; the ignore-the-salt
      null arm is the standard matched-null discipline of docs/inventor-protocol.md section 3.'
  object_first_candidate:
    tracked_object: 'The target-hit multiset of a multi-target hash search: for each query, the multiset
      of live targets it matches, accumulated over the search, summarized by the count of distinct
      targets hit as a function of query count and by the slope of that curve on log axes.'
    lossiness: 'The projection discards the identity of every target, the value of every digest, the
      plaintexts and keys behind them, and the order in which hits arrived, keeping only a running
      count and its slope. It is genuinely lossy: any relabelling of targets, and any change of the
      underlying pseudorandom function, leaves the hit-count curve unchanged in distribution. What
      survives propagates because the count is additive over queries and its increment depends only
      on the current live-target table and the query''s salt value, both of which are preserved by
      the projection. That is why one more query moves the object deterministically in distribution
      without needing anything that was discarded.'
    propagation: One step of the target operation is one hash query. It maps the current state (queries
      so far, distinct targets hit so far) to a new state by adding the number of previously unhit
      targets matching this query's digest under its salt. In expectation the increment is the live-unhit
      target count sharing the query's salt divided by two to the digest width, so the object obeys
      an exactly writable one-step recurrence. The transition of claim (B) is precisely the point
      where the number of distinct salts among live targets makes that per-salt count fall to order
      one.
    survival_score: 'The growth exponent survives as a well-defined slope for as long as the hit process
      is far from exhausting the target set, and dissolves in two named places: at saturation, where
      nearly all targets have been hit and the curve flattens for trivial reasons, and at the transition
      itself, where a single slope no longer describes the curve and the object must be read as two
      regimes with a breakpoint. The proposal predicts survival across at least two decades of query
      count below saturation at w = 24 and states that the interesting deliverable is the breakpoint
      LOCATION, not a single exponent.'
  null_object_control: 'Salt-ignoring arm: targets carry a salt field of the identical length and
    identical distribution, but the matching rule ignores it, run through the IDENTICAL query process
    and the IDENTICAL measurement in the same invocation. This null must reproduce the unsalted growth
    curve to within sampling error, which isolates the partition effect from the mere presence of
    a longer hash input. If the salt-ignoring arm shows the transition, then the transition is produced
    by the rig''s input formatting rather than by partitioning, and the signal arm means nothing.
    A second null uses a single target (U times C equal to one), for which the growth exponent must
    be that of a plain preimage search and no transition can exist; a transition there is a rig bug.'
  discriminated_from:
  - 'IDEA-20260805-3d71ca (ML-KEM): cheap-proxy target selection over many ciphertexts of one static
    key, measuring the left tail of a projected error norm. Its object is a continuous norm tail from
    lattice geometry; this object is a discrete hit count from hash collisions, and neither rig can
    produce the other''s quantity.'
  - 'IDEA-20260814-270e03 and the ECDLP multi-target lane served by harness/run_mtgt2.py and run_volc_mtgt.py:
    batch discrete-log amortization over group elements. Those amortize a group computation; this
    measures a hash-input partition and involves no group at all.'
  - 'IDEA-20260808-d21021 (HQC): steerable ciphertext energy and worst-case correctness in the FO/HHK
    bound. That is a correctness-quantifier argument about a bound; this is a simulation of a counting
    process and never evaluates a bound.'
  - Textbook birthday or multi-target preimage counting, which gives an expected-hits formula. The
    content here is that the number of DISTINCT salt values is decoupled from the salt length and
    swept independently, so the degradation curve toward the unsalted regime is measured rather than
    assumed to be a step function.
  - H-FRODO-8ea540 part (C), which observes that an additive Renyi loss scales with total sample count
    across T targets. That is a linear scaling statement inside the sampling argument; this measures
    a nonlinear transition in a search process and shares no quantity with it.
  assumptions:
  - A digest width of 20 to 32 bits is a legitimate scaled-down stand-in for the counting structure
    of a multi-target hash search, with all frequencies rescaled and none transferable.
  - The pseudorandom function used to generate targets and query digests is treated as ideal for the
    purposes of the counting object; a bias in it would be a different experiment and is checked only
    by a uniformity test, not assumed.
  - The number of distinct salt values among live targets is settable independently of salt length;
    this is a rig design choice and is the point of claim (C).
  - Saturation is detected and excluded from any slope fit, since a flattening curve near exhaustion
    would otherwise be mistaken for the transition.
  - No statement is required or made about whether any real deployment reaches any particular U or
    C; those are swept as free parameters.
  predictions:
  - metric: growth exponent of distinct targets hit versus queries, unsalted arm, below saturation
    direction: higher
    minimum_effect: 0.9
  - metric: growth exponent, salted arm with distinct-salt count equal to the target count, below
      saturation
    direction: lower
    minimum_effect: 0.6
  - metric: absolute error between the measured breakpoint location and the pre-registered closed-form
      prediction, in log2 queries
    direction: lower
    minimum_effect: 1.0
  - metric: growth exponent on the salt-ignoring null arm minus growth exponent on the unsalted arm
    direction: different
    minimum_effect: 0.05
  - metric: shape of the degradation curve as distinct-salt count is swept from 1 to the target count
    direction: different
    minimum_effect: 'no pre-commitment on the functional form, with reason: whether the degradation
      is smooth, logarithmic or a sharp step is precisely what has not been measured, and asserting
      a form in advance would let a fit be declared a confirmation'
  minimal_test:
    design: 'One digest width, three arms, one afternoon. Fix w = 24, U times C = 4096 targets. Arm
      one: no salt. Arm two: salt with distinct-salt count equal to the target count. Arm three: salt
      present in the input but ignored by the matching rule. Run each for a query budget spanning
      three decades below saturation, with ten seeds, in a single invocation with disjoint seed streams.
      Measure distinct targets hit versus queries, fit the slope on log axes below saturation, and
      locate the breakpoint by segmented regression with the breakpoint free. The discriminating comparison
      is arm three against arm one: if the salt-ignoring arm differs from the unsalted arm, the rig''s
      input formatting is producing the effect and everything else is void. The second discriminating
      comparison is the measured breakpoint in arm two against the pre-registered closed form. Both
      are decided at this single width, before any sweep of w, U, C or distinct-salt count is worth
      running.'
    controls:
    - Salt-ignoring null arm with identical input length and identical salt distribution, run in the
      same invocation.
    - Single-target control, for which no transition can exist.
    - Digest-uniformity test on the target generator, reported before any growth exponent.
    - Saturation detector, with all slope fits restricted to the pre-saturation region and the excluded
      region reported.
    - 'Digest-width sweep as the structural tell: the breakpoint must move with w as the closed form
      requires.'
    - 'Analytic cross-check: exact expectation computed from the recurrence, compared against the
      sampled curve at every measured point.'
    required_metrics:
    - distinct targets hit as a function of query count, per arm
    - fitted growth exponent below saturation, per arm, with confidence interval
    - breakpoint location in log2 queries, with confidence interval
    - absolute error against the pre-registered closed-form breakpoint
    - degradation curve of the growth exponent versus distinct-salt count
    - digest uniformity statistic for the target generator
    - fraction of the query budget excluded as saturated
  falsification_conditions:
  - The salt-ignoring null arm differs from the unsalted arm beyond sampling error, showing the effect
    is produced by input formatting.
  - The single-target control shows a breakpoint.
  - The measured breakpoint disagrees with the pre-registered closed form by more than the stated
    tolerance, which refutes the closed-form derivation and is itself the result to report.
  - The sampled curve disagrees with the exact expectation computed from the recurrence, which is
    a rig defect.
  - The breakpoint location does not move with digest width, which under inventor-protocol section
    3 is the signature of an artifact.
  - No breakpoint is detectable at any distinct-salt count, meaning the two regimes are not separable
    at toy widths, which is a clean measured obstruction and is reported as such.
  - The digest-uniformity test fails, voiding every downstream number.
  confounders:
  - Saturation masquerading as the transition; both flatten the curve, and only the saturation detector
    separates them.
  - 'Query-budget choice: a budget entirely below or entirely above the breakpoint yields a single
    clean slope and no transition, which would be misread as absence of an effect.'
  - Table-lookup implementation details that make matching cost depend on salt, which would confound
    wall-clock but not the counting object; only the counting object may be reported.
  - Seed sharing between arms, which would correlate the target sets; disjoint seed streams must be
    verified rather than assumed.
  - Distinct-salt count and salt length are naturally coupled; the rig decouples them deliberately,
    and any result quoted in terms of salt length alone would reintroduce the confound.
  interpretation_limits:
  - This is a counting simulation at 20 to 32 bit digest widths. Every frequency is a property of
    those widths and none transfers to any real digest width.
  - Nothing here says whether any deployment reaches any U or C, and nothing here says what FrodoKEM's
    salt is or does; that remains an unverified research target under RQ-FRODO-a2dbe2.provenance.
  - A hash search is one multi-target strategy among many and is not claimed to be the best or the
    relevant one against any scheme.
  - No adversary cost is charged, so no bit-security consequence may be inferred in either direction.
  target_complexity:
    time_exponent: No attack exponent is claimed for any scheme. The simulation itself costs O(Q)
      hash evaluations plus O(1) amortized table lookups for query budget Q, run at Q up to 2^28 at
      w = 24.
    memory_exponent: No attack memory exponent is claimed. The rig stores U times C targets in a hash
      table, at most 2^20 entries, plus a hit bitmap; well under a gigabyte.
    best_known: The incumbent formulation is the qualitative claim, recorded as an unverified target
      in RQ-FRODO-a2dbe2, that a per-ciphertext salt changes multi-target bookkeeping. This proposal
      does not beat it; it replaces a qualitative claim with a measured transition location at toy
      widths, and explicitly does not connect that measurement to any scheme.
    hidden_overhead: The closed-form breakpoint derivation is the load-bearing human work and it is
      easy to get subtly wrong in a way the simulation would then appear to confirm, because the same
      balls-in-bins intuition would be used to interpret both. Registering the closed form before
      the run is the only guard, and it is a discipline cost rather than a compute cost. A second
      hidden cost is that the distinct-salt sweep multiplies the run matrix by its own length.
  dominated_by: 'n/a (no result claimed on any cost frontier). Pareto check actually performed: grep
    -ril frodo across ledger/ returns no evidence record whatsoever, so there is no FrodoKEM cost
    row in this program to be dominated by, in time, memory or queries. The ECDLP multi-target lane
    served by harness/run_mtgt2.py and run_volc_mtgt.py is on a different problem entirely and shares
    no cost axis with a hash-input partition measurement.'
  sota_delta: no attack; conceptual and measurement contribution only. The deliverable is a growth
    exponent per arm, a breakpoint location with a confidence interval, and a degradation curve; no
    cost figure for any scheme is produced and no bit-security number is moved.
  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Claim (B), that a transition is observable at toy widths and that the
    breakpoint matches a pre-registered closed form within one binary order of magnitude: 0.7 for
    observability and 0.5 for the closed form matching, and I separate these deliberately because
    the closed form is my own derivation and the most likely failure is that it is right in shape
    and wrong by a constant. Claim (C), that the degradation curve as distinct-salt count varies is
    smooth and measurable rather than a step: 0.6, with the honest caveat that at 4096 targets the
    interesting region may be only a few distinct-salt values wide and therefore poorly resolved.
    Probability the salt-ignoring null arm is clean: 0.85. Probability the whole thing turns out to
    be a textbook computation with no measurement content, which would make it a poor use of a batch:
    0.3, and that risk is the main reason its priority is high only because it is cheap.'
