idea:
  id: IDEA-20260815-1570fe
  question_id: RQ-QALG-457b41
  added: '2026-08-15'
  title: >-
    SHOR ON ECDLP IS ALWAYS COSTED AS A CIRCUIT AND NEVER AS AN END-TO-END
    ATTACK: charge the classical pre- and post-processing, the repetition
    count from measurement failure, and the error-corrected wall clock
  class: cost-model

  claim: >-
    Quantum resource estimates for ECDLP report logical qubits and Toffoli
    counts for one circuit run. An attack needs successful runs, classical
    post-processing of measurement outcomes, repetition on failure, and a
    wall clock under an error-corrected cycle time. The end-to-end number
    can differ substantially from the circuit number and is what a migration
    timeline actually depends on.

  mechanism: >-
    Take a published circuit estimate. Add the expected repetition count
    from the algorithm's success probability, the classical post-processing
    cost, and convert to wall clock under stated cycle times. Report end-to-
    end against circuit-only.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-QRE-001 and GOAL-QALG-001; grep 'Toffoli' (15),
      'repetition', 'post-processing', 'wall clock'.
    results: >-
      Circuit-level estimates are represented; no record assembles an end-
      to-end attack cost including repetitions, classical processing and
      error-corrected wall clock.
    verdict: >-
      ADAPTATION. Full-path cost accounting is this program's declared
      standard; the contribution is applying it to quantum ECDLP estimates
      as it is applied to classical ones.

  object_first_candidate:
    tracked_object: >-
      THE END-TO-END ATTACK COST, replacing the single-circuit resource
      count.
    lossiness: >-
      A circuit count projects away repetitions and classical work, which
      is the same projection the program forbids in classical charged
      comparisons.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while a published circuit estimate is available and cycle
      times can be stated; unreported terms are marked rather than
      estimated.

  null_object_control: >-
    NULL 1 -- perfect success probability, zero classical cost and zero
    cycle time, which must reproduce the published circuit-only number. NULL
    2 -- a classical baseline (rho) costed in the same wall-clock units,
    since a quantum estimate not comparable to a classical one is not
    decision-relevant.

  discriminated_from:
    - >-
        The QRE reproduction record in this series, which reproduces a
        circuit estimate; this one extends it to an end-to-end attack cost
        and should consume its output.
    - >-
        Published end-to-end factoring estimates, which do this for RSA;
        the contribution here is the ECDLP analogue in this program's
        framework.

  assumptions:
    - >-
        A published circuit estimate with a stated success probability is
        available; without the success probability the repetition count
        cannot be computed and must be marked unknown.
    - >-
        Cycle times can be stated for at least one plausible architecture;
        several are swept since the answer scales directly with them.

  predictions:
    - metric: >-
        degenerate-parameter reproduction
      direction: different
      minimum_effect: >-
        FORCED to reproduce the circuit-only number.
    - metric: >-
        end-to-end cost against circuit-only
      direction: higher
      minimum_effect: >-
        FORCED higher; the question is by how much and which term
        dominates.
    - metric: >-
        dominant end-to-end term
      direction: different
      minimum_effect: >-
        Identifies whether repetitions, classical processing or cycle
        time drives the number, which is what a timeline argument should
        be about.

  minimal_test:
    design: >-
      One published estimate, one architecture's cycle time, both nulls.
    controls:
      - >-
          Degenerate-parameter circuit reproduction.
      - >-
          Classical rho baseline in matched wall-clock units.
      - >-
          Several cycle times swept.
      - >-
          Unreported terms marked, never estimated.
    required_metrics:
      - >-
          End-to-end cost with each term separated.
      - >-
          Ratio of end-to-end to circuit-only.
      - >-
          Dominant term identification.
      - >-
          Classical baseline in the same units.

  falsification_conditions:
    - >-
        The degenerate reproduction fails. Harness differs from the
        published estimate; halt.
    - >-
        End-to-end is close to circuit-only. The circuit number is a good
        proxy, which is a useful and reassuring simplification.
    - >-
        End-to-end is far above circuit-only. Timelines built on circuit
        counts are optimistic and the dominant term says where to argue.
    - >-
        The success probability is unreported. The repetition count is
        unknown and the end-to-end cost cannot be computed, which is
        itself a finding about the estimate's completeness.

  confounders:
    - >-
        CYCLE-TIME DOMINANCE: the wall clock scales directly with an
        assumed cycle time, so a single assumed value would determine the
        answer; several are swept for that reason.
    - >-
        ARCHITECTURE DRIFT: error-correction assumptions age quickly and
        the result is a statement about the assumed architecture.

  interpretation_limits:
    - >-
        Extends a published estimate; makes no independent quantum-
        feasibility claim.
    - >-
        Scoped to the reproduced estimate and swept cycle times.
    - >-
        Inherits every assumption of the source circuit estimate.

  heuristic_assumptions:
    - id: HEUR-QALG-E2E-1
      statement: >-
        End-to-end attack cost is the circuit cost times the expected
        repetition count, plus classical post-processing, converted at a
        fixed cycle time.
      rigorous_support: >-
        Rigorous ingredient: the algorithm's success probability
        determines the expected repetitions by a geometric-trial
        argument, which is exact. THE GAP: repetitions may share setup
        or admit partial reuse, and error-corrected cycle time is not
        constant across circuit depth, so the simple product is an upper
        bound rather than the cost.
      falsification_condition: >-
        A published end-to-end analysis whose cost falls materially
        below the product form.
      validation_plan: >-
        SAMPLE: the product form evaluated across >= 3 cycle times and
        the stated success probability. TAIL CHECK: the assumption
        combination giving the highest cost, reported as the upper bound
        it is. TRANSFER: none beyond the assumed architecture.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is symbolic assembly on top of a published
      estimate.
    memory_exponent: >-
      Negligible.
    best_known: >-
      Incumbents are the published circuit-level ECDLP resource estimates,
      extended here rather than improved; the classical incumbent is rho,
      costed in matched units.
    hidden_overhead: >-
      Error-corrected cycle time is the term the whole wall clock scales
      with and the term most likely to be assumed rather than argued.
    tradeoff_note: >-
      Circuit counts are architecture-neutral and incomplete; end-to-end
      numbers are complete and architecture-bound. Both are reported.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As resource estimates: dominated by the
    published circuit analyses. As an end-to-end assembly for ECDLP in this
    program: none exists. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: an end-to-end quantum ECDLP
    attack cost with repetitions, classical post-processing and error-
    corrected wall clock charged, compared against the circuit-only number
    this program currently cites and against a classical baseline in matched
    units.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.6 that a published estimate reports its success probability, without
    which the repetition term is unavailable. 0.85 that the degenerate
    reproduction works. 0.7 that end-to-end exceeds circuit-only by more
    than an order of magnitude, which would matter for how this program
    describes quantum timelines.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
