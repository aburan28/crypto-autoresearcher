idea:
  id: IDEA-20261005-b4c2bf
  question_id: RQ-ECTD-001
  added: '2026-10-05'
  status: proposed
  approved_by: null
  title: >-
    Least rational root of the 3-division polynomial across one height-2
    volcano, against a coordinate scaling of the crater
  class: control
  claim: >-
    Let p be the least prime in the closed interval from 17 to 199 for which
    an ordinary 2-isogeny volcano of height exactly 2 exists, and let E_floor
    and E_crater be the first such pair, in a fixed enumeration, for which
    the 3-division polynomial of each short-Weierstrass model has at least
    one root in F_p. Let m(E) be the least such root, written as an integer
    in {0, 1, ..., p - 1}. Let u be the least quadratic residue in F_p
    excluding 1, and let E_crater^u be the model (x, y) mapped to
    (u^2 x, u^3 y). Then m(E_floor) and m(E_crater) differ by at most the
    difference between m(E_crater) and m(E_crater^u). A larger volcano gap
    is the endpoint-specific signal. No discrete logarithm is computed.
  mechanism: >-
    Class-invariant weaknesses are shared by isogenous curves, as stated in
    the opened row KR-RHO-755e35. The meter here is not the group order and
    not a Semaev heavy-tail ratio. It is the least F_p-root of ψ_3. Two
    explanations are separated before the search. Explanation A: the volcano
    gap is at most the gap produced by one coordinate scaling of the crater,
    so the meter does not separate level from a change of model.
    Explanation B: the volcano gap is at least one larger than the scaling
    gap, so the level is visible in this coordinate. Visibility is not a
    sub-rho trapdoor. PAIR (representation, Sigma): the representation is
    the affine x-coordinate of rational 3-torsion (class R1). Sigma is the
    action of a rational 2-isogeny up or down the volcano, not translation
    on a prime-order subgroup. Trichotomy class: coordinate-dependent. The
    projection discards every root except the least integer representative,
    and discards y. Many root sets share one minimum, so the projection is
    lossy. It does not propagate under translation, and it is not claimed to
    be a block system of the isogeny. The rigidity citations
    IDEA-20260806-c5d183 and KN-FIND-ffe1df Theorem C are provenance
    recalled; those files were not opened. F3 appears only as the volcano
    already in the question; what is added is the comparison of one root
    minimum with a scaling control. No factor base is built. Kummer-line
    models are not used.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Over a finite field, isogenous curves share the group-structure
        class of weakness, including anomalous curves, small embedding
        degree, and smooth order. Walking the class does not reach a
        different class of those weaknesses.
      verified_by: idea-generator, this session, via knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm on a prime-order group needs on the order of
        sqrt of the group order group operations. A sub-square-root
        algorithm must use the representation.
      verified_by: idea-generator, this session, via knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Naive Semaev index calculus over prime fields does not beat generic
        methods under the statistical assumptions named in that row.
      verified_by: idea-generator, this session, via knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
    - ref: IDEA-20260806-c5d183
      provenance: recalled
      claim: >-
        Recalled pointer, not opened: full translation admits no nontrivial
        deterministic lossy projection of a prime-order subgroup.
      verified_by: null
  assumptions:
    - The 3-division polynomial is verified inside the test by the doubling check: a point with that x-coordinate, doubled, equals its negative. A polynomial that fails this check is not used.
    - Height exactly 2 means one crater level, one intermediate level, and one floor level in the rational 2-isogeny graph. A taller volcano is skipped.
    - The scaling u is an F_p-isomorphism of short-Weierstrass models. It is the coordinate control, not a second volcano.
    - If no pair in the prime range has a rational root of ψ_3 on both levels, the instance search fails and no trapdoor conclusion is drawn.
  proof_search_map:
    bottleneck: >-
      Whether the least rational 3-torsion x-coordinate moves more across a
      height-2 step than across one coordinate scaling.
    baseline_embedding:
      parameter_slice: >-
        One ordinary volcano of height 2, one prime p with 17 ≤ p ≤ 199,
        compared with the scaling (x, y) -> (u^2 x, u^3 y) of the crater.
      reproduction_check: >-
        The scaling is an isomorphism onto its codomain model, checked by
        the transformed curve equation. A failed check invalidates the gap.
    observation_collision:
      observable: >-
        The absolute difference of least roots, an integer in {0, ..., p - 1}.
      distinct_preimage_search: >-
        E_floor and E_crater^u are distinct curves that can share the same
        least root. Equal gaps are the collision that kills the meter.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the least-root function on short-Weierstrass models
          in one isogeny class.
        predicted_gain: >-
          The volcano gap is at most the scaling gap. No discrete-log cost
          changes.
    quantifier_order: >-
      For the least prime p in [17, 199] that admits a height-2 pair with
      both ψ_3 having an F_p-root, the volcano gap is ≤ the scaling gap.
      This is one pair, not every volcano.
    method_ceiling:
      strongest_certifiable_claim: >-
        This meter does not separate volcano level from coordinate scaling
        at that pair, or it does, by an integer gap of at least 1.
      nearby_object_control: >-
        E_crater^u, a curve isomorphic to the crater, where a genuine
        level signal must be absent. If the scaling gap already exceeds
        every volcano gap one could see, the meter is saturated by coordinates.
    proof_obligations:
      - claim: both models have at least one verified rational root of ψ_3
        responsibility: correctness
      - claim: the 2-isogeny chain has height exactly 2
        responsibility: baseline
      - claim: volcano gap ≤ scaling gap
        responsibility: strictness
    not_applicable_reason: not_applicable
  predictions:
    - metric: absolute difference |m(E_floor) - m(E_crater)| minus |m(E_crater) - m(E_crater^u)|
      direction: lower
      minimum_effect: at most 0
    - metric: number of verified F_p-roots of ψ_3 on each of E_floor and E_crater
      direction: higher
      minimum_effect: at least 1 on each curve
  minimal_test:
    design: >-
      Search primes from 17 through 199. Build the rational 2-isogeny graph
      of each ordinary curve until a volcano of height exactly 2 appears.
      Compute ψ_3 and keep a root only after the doubling check. Take the
      first floor and crater that both have a root. Apply the least scaling
      u. Compare the two absolute differences of least roots. Do not run
      Pollard rho and do not build a summation-polynomial system.
    controls:
      - The scaled model must satisfy the transformed Weierstrass equation. Otherwise the control is invalid.
      - A supersingular curve at the same p, trace 0, is not eligible as floor or crater.
      - j = 0 and j = 1728 are excluded from the pair. Extra automorphisms there are a separate coordinate effect.
    required_metrics:
      - prime_p
      - volcano_height
      - least_root_floor
      - least_root_crater
      - least_root_scaled_crater
      - volcano_gap_minus_scaling_gap
      - verified_root_count_floor
      - verified_root_count_crater
  falsification_conditions:
    - volcano_gap_minus_scaling_gap is at least 1.
    - Either curve has no root that survives the doubling check.
    - No height-2 ordinary volcano with both roots exists for any prime from 17 through 199.
    - The scaling fails the transformed equation check.
    - The selected crater or floor has j in {0, 1728}.
  confounders:
    - Writing roots as integers in 0..p-1 depends on the representative. The same set of representatives is used on every model.
    - A quadratic twist can move x-coordinates without changing the isogeny class's order. The scaling control is an isomorphism, not a twist. A twist arm is not substituted.
    - Several floor vertices can exist. The first in the fixed enumeration is the one reported. A different floor is a different experiment.
  interpretation_limits:
    - A gap of one field element is not a discrete logarithm and does not beat rho.
    - Inequality in the predicted direction says only that this meter failed to separate level from scaling at one pair.
    - The opposite inequality nominates the meter for a later detectability test. It is not a Teske trapdoor and it is not a sub-rho solve.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On a random short-Weierstrass model, the least F_p-root of a separable
        degree-4 polynomial with m distinct roots in F_p is distributed as the
        minimum of m uniform draws from {0, ..., p - 1}. The volcano prediction
        is that the floor is not more extreme than one scaling of the crater.
        This imitates uniform order statistics, not a theorem about division
        polynomials.
      rigorous_support: >-
        A separable degree-4 polynomial has at most 4 roots. The minimum of m
        uniform independent draws on {0, ..., p - 1} has expectation
        (p - 1)/(m + 1). Division polynomials are not proved to have uniform
        roots. KR-RHO-755e35, opened, forbids using the group order as a
        hidden endpoint and does not mention this minimum.
      validation_plan: >-
        At the single pair, record m and the scaling gap, and compare the
        scaling gap with (p - 1)/(m + 1). If the scaling gap is 0, the control
        is degenerate and the volcano comparison is refused. No second prime
        and no transfer to conductor steps at 40 bits or more is claimed.
  target_complexity:
    time_exponent: >-
      Enumeration of 2-isogenies and a degree-4 polynomial at one prime
      p ≤ 199. The generic-group exponent 1/2 is unchanged.
    memory_exponent: O(1) roots and one volcano adjacency list at this p
    best_known: >-
      KR-RHO-13bf67, opened, gives a square-root lower bound for generic
      algorithms. KR-RHO-755e35, opened, says isogeny walks do not reach a
      different class-invariant weakness. This meter beats neither.
    hidden_overhead: >-
      No o(1) term. The test is one volcano. A secret path of cryptographic
      length is outside the claim.
    tradeoff_note: >-
      No time-memory tradeoff. The scaling control is one isomorphism.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-755e35
      - KR-RHO-13bf67
      - KR-IC-5931ee
      - KR-RHO-fb88e6
    nearest:
      - ref: KR-RHO-755e35
        provenance: internal
        relation: adjacent
        delta: >-
          The opened row closes class-invariant weaknesses as secret
          endpoints. This idea adds one integer comparison, volcano gap minus
          scaling gap, predicted at most 0, for the least root of ψ_3 on one
          height-2 pair at p ≤ 199. The rho exponent stays 1/2.
      - ref: KR-IC-5931ee
        provenance: internal
        relation: orthogonal
        delta: >-
          The opened row says naive Semaev index calculus does not beat
          generic methods. This idea runs no summation polynomial. The
          numeric distance to that attack is the whole square-root exponent,
          which is not claimed.
  dominated_by: >-
    Pollard rho, at the square-root exponent in KR-RHO-13bf67, dominates any
    reading of this root gap as an attack. KR-RHO-755e35 already rules out
    hiding a class-invariant weakness behind an F_p-isogeny. The least-root
    comparison does not beat either baseline.
  sota_delta: >-
    No exponent is derived. Generic discrete log stays on the order of the
    square root of the group order. The quantitative delta is one integer,
    volcano gap minus scaling gap, predicted ≤ 0, at a prime p ≤ 199.
