idea:
  id: IDEA-20261002-63bdb2
  question_id: RQ-NGCC-f52138
  goal_id: GOAL-NGCC-6c8a52
  added: '2026-10-02'
  title: >-
    Reproduce or refute the published Neulaser state-merger collision
    (hash-21-2) on the official round-1 submission
  class: mechanism
  claim: >-
    Saarinen, ePrint 2026/2266, credits Tsinghua Hash Lab with one Neulaser
    state merger (finding hash-21-2). A separate finding, hash-21-1, cites
    Yuan et al., ePrint 2026/2152, and is not this idea. This idea asks
    whether the published hash-21-2 witness is a pair of distinct messages
    with equal full-round digests on the official ICCS round-1 Neulaser
    package. It proposes no new attack and no new colliding pair.
  mechanism: >-
    The published hash-21-2 witness, once read from that finding, supplies
    the messages and the instances it claims. They count only when the
    messages differ as byte strings and a hasher built separately from the
    witness producer returns equal full-round digests. Reduced-round or
    truncated digests do not count.
  novelty_status: unverified
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      Neulaser is an NGCC round-1 hash candidate, not an elliptic-curve
      discrete-log instance. A walk of knowledge/ on 2026-10-02 found no
      entry naming Neulaser. knowledge/frontiers/ecdlp does not contain it.
    nearest: []
    none_found_after:
      - "walk of knowledge/ for Neulaser on 2026-10-02: no file"
      - "https://eprint.iacr.org/2026/2266 names finding hash-21-2; the paper text was the copy supplied with the target request and was not re-executed"
  test_boundary: >-
    Official Neulaser zip from the round-1 roster (hash-21), only the
    instances the hash-21-2 witness itself names, full rounds only. Finding
    hash-21-1 is out of scope. No claim about a repaired or later submission.
  falsification: >-
    For some instance the witness claims, the published message pair hashes
    to two different full-round digests under the separately compiled
    hasher, and the failure is not a build or infrastructure error.
  status: proposed
  proposed_by: coordinator
