idea:
  id: IDEA-20260816-8bdc64
  question_id: RQ-FNDSA-001
  added: '2026-08-16'
  title: 'Change the representation from secret frame to public dual lattice: measure what fraction
    of the oracle log-likelihood-ratio''s information a statistic built only from public dual vectors
    recovers, because that efficiency ratio is the named open successor of this corpus''s own divergence
    hypothesis and it is estimable at toy scale.'
  class: representation
  claim: '(A) This corpus''s divergence hypothesis derives an optimal distinguishing statistic that
    depends on the leaf centers, hence on the secret Gram-Schmidt frame, and states plainly that the
    statistic is not attacker-computable, leaving open whether any statistic computable from public
    data captures a constant fraction of the same information. (B) A natural public representation
    exists: the lattice itself is public, so its dual is public, and for any dual vector w the character
    sum, meaning the expectation over signatures of the complex exponential of two pi i times the
    inner product of the signature with w, is computable from transcripts alone with no secret. For
    an exact discrete Gaussian over a coset the magnitude of that expectation is a known function
    of the width and the dual vector''s norm, so any deviation is a signal, and the set of dual vectors
    is a public dictionary of test functions. (C) The claim is that the efficiency ratio eta, defined
    as the divergence captured by the best statistic restricted to that public dictionary divided
    by the divergence captured by the oracle statistic, is MEASURABLE at toy dimension by computing
    both sides exactly on an enumerated law, and that eta is the single number the corpus''s own hypothesis
    names as its successor. (D) The claim is further that eta is expected to depend strongly on how
    far the secret frame directions are from the short dual vectors, which is a geometric quantity,
    so eta should correlate with a measurable alignment statistic and that correlation is the mechanism-level
    prediction. (E) WHAT IS NOT CLAIMED: no claim that a public statistic exists that is efficient,
    no claim about any attack, no claim about deployed parameters or signature counts at deployed
    parameters, and no claim that eta measured at toy dimension holds at any other dimension. An eta
    near zero is a strong and useful negative, since it would say the channel is dead to public statistics
    at these parameters and would redirect the lane to the precision channel, which is exactly the
    fork the corpus''s hypothesis names.'
  mechanism: 'STAGE ONE constructs a toy lattice with a known secret basis and enumerates the exact
    output law of the exact-arithmetic sampler, reusing the validated enumeration instrument, so both
    sides of the ratio can be computed without sampling. STAGE TWO computes the oracle divergence
    directly from the enumerated law against the ideal law, in exact rational arithmetic; this is
    the denominator and it needs no statistic at all, being the full Kullback-Leibler divergence.
    STAGE THREE builds the public dictionary: all dual vectors up to a norm bound, computed from the
    public lattice alone. STAGE FOUR computes, for each dual vector, the exact character sum under
    both the enumerated defective law and the ideal law, and forms the per-vector signal. STAGE FIVE
    computes the divergence captured by the best linear combination of dictionary statistics, which
    for small signals is a quadratic form and reduces to summing squared per-vector signals normalized
    by their variances under the ideal law; this is the numerator. STAGE SIX forms eta and reports
    it alongside the alignment statistic between the secret frame directions and the dictionary''s
    short vectors. STAGE SEVEN is the null: run the identical pipeline where the enumerated law is
    replaced by the ideal law, so the numerator must be zero up to enumeration precision and eta must
    be undefined rather than small, which is the check that the dictionary is not manufacturing signal.'
  novelty_status: unverified
  novelty_screen:
    method: Read H-FNDSA-6a9cbb in full, including the residual paragraph that names this exact successor
      question in its own words. Read RQ-FNDSA-001 in full. Extracted all twelve RQ-FNDSA-001 proposal
      titles. Read the framings of IDEA-20260808-e7ba81 and IDEA-20260813-d984ac, the two records
      nearest to a public-observable analysis. Ran grep -ril for dual, character, Fourier, public
      and observable over ledger/proposals/.
    results: 'H-FNDSA-6a9cbb states the successor question explicitly: does there exist a statistic
      computable from public data alone that captures a constant fraction of the divergence, and it
      declines to answer. IDEA-20260808-e7ba81 uses the sample covariance spectrum, which IS computable
      from public transcripts and is therefore a member of the class this record wants to evaluate,
      though it is a second-moment statistic rather than a character sum and the record does not frame
      it as a fraction of an oracle bound. IDEA-20260813-d984ac audits which sampler defects survive
      encoding and compression, that is which lie in an observational nullspace, which is the same
      spirit applied to the encoding layer rather than to the statistic layer. IDEA-20260813-2d839b
      builds a public cross-node interaction statistic, again a member of the class.'
    verdict: UNVERIFIED. No claim about outside literature; dual-lattice character sums are the standard
      Fourier-analytic tool for discrete Gaussians and their use here is not presented as new machinery.
      What is claimed new HERE is the framing as a measured EFFICIENCY RATIO against an exactly computed
      oracle denominator, which is possible only because the enumeration instrument makes the oracle
      divergence computable rather than merely derivable, and the prediction that eta correlates with
      a geometric alignment statistic. The public-statistic question is assembled directly from H-FNDSA-6a9cbb,
      which is credited as the source rather than paraphrased; the covariance and cross-node statistics
      of IDEA-20260808-e7ba81 and IDEA-20260813-2d839b are members of the same class and should be
      evaluated by the same ratio.
  object_first_candidate:
    tracked_object: 'The CHARACTER SUM of the signature distribution at a public dual vector: the
      expectation over signatures of the complex exponential of two pi i times the inner product of
      the signature with a dual vector w. Followed as w ranges over the public dual dictionary, and
      compared against its exactly known value under the ideal law.'
    lossiness: The projection discards the entire joint distribution of the signature and keeps, for
      each dual vector, one complex number. The full law has support of size exponential in the dimension;
      the dictionary has size polynomial in the norm bound, so the loss is enormous and the map is
      very far from invertible. The retained part propagates because the character sum is a linear
      functional of the law and the ideal law's character sums are known exactly in closed form, so
      the difference is a well-defined signal that composes additively across dual vectors and does
      not require the secret frame at any point. What is lost is precisely the information carried
      by frequencies outside the dictionary, and measuring how much that is IS the efficiency ratio.
    propagation: One step is enlarging the dictionary by admitting dual vectors of one greater norm.
      Acting on the tracked object, that adds new character sums whose ideal values are smaller, since
      the ideal character sum decays with the square of the dual vector's norm, so each new vector
      contributes less signal and more variance. The captured divergence therefore increases monotonically
      but with diminishing returns, and eta as a function of the norm bound is a saturating curve
      whose plateau is the quantity of interest.
    survival_score: The object survives while the ideal character sum is large enough to be a usable
      reference, which fails once the dual vector's norm times the width exceeds a small multiple
      of one, since the ideal character sum decays like the exponential of minus two pi squared times
      the width squared times the squared dual norm. Concretely at sigma = 2 the character sums are
      already below 1e-30 for dual vectors of norm above about 0.6, so the usable dictionary is tiny
      and that is a real and reportable limitation. At sigma = 0.5 the usable dictionary is much larger.
      The honest survival score is therefore that this representation is informative at small widths
      and dissolves rapidly as the width grows, which is itself the most important thing the experiment
      would establish.
  null_object_control: The null arm replaces the enumerated defective law with the exactly computed
    IDEAL law and runs the identical dictionary construction, character-sum computation and captured-divergence
    calculation. The numerator must come out zero to the enumeration's precision; any nonzero value
    means the dictionary or the reference values are manufacturing signal and every eta is void. A
    second null uses a random dual dictionary drawn from vectors NOT in the dual lattice, which should
    capture no structured signal and whose captured divergence bounds how much the estimator picks
    up from arbitrary test functions. A positive control injects a known defect concentrated at a
    single known dual frequency and must produce eta near one when that frequency is in the dictionary
    and near zero when it is excluded.
  discriminated_from:
  - H-FNDSA-6a9cbb poses this question and declines to answer it, explicitly naming it as the successor.
    This record answers it at toy scale and credits the framing rather than restating the derivation.
  - IDEA-20260808-e7ba81's covariance spectrum is itself a public statistic and is therefore a candidate
    member of the class evaluated here, not a competitor; the contribution is the ratio against an
    exact oracle denominator, which that record does not compute.
  - 'IDEA-20260813-2d839b builds a specific public cross-node statistic. Same relationship: it is
    a member of the class, and the efficiency ratio is the yardstick that would let it and the covariance
    statistic be compared on one scale.'
  - IDEA-20260813-d984ac asks which defects survive ENCODING, that is which are observable at all
    after compression. This asks which are extractable by a public statistic given full observability,
    which is a later stage of the same pipeline and independent of it.
  - The identifiability entry in this batch asks whether the law determines the key at all. This asks
    how much of the law's information a public statistic sees, which is meaningful even if identifiability
    fails, and vice versa.
  assumptions:
  - The lattice is public and its dual is computable, which is a property of the scheme's public key
    and requires no secret; the toy construction reflects this by deriving the dual from the public
    basis only.
  - The exactly enumerated law from the validated enumeration instrument is available, since both
    numerator and denominator are computed on it.
  - For small signals the captured divergence of a linear statistic dictionary is well approximated
    by the sum of squared normalized per-vector signals, which is the standard small-signal quadratic
    approximation and is checked against a direct computation at one cell.
  - Toy lattices and widths are constructed in-run and are not claimed to be FN-DSA keys; in particular
    the width regime where this representation is informative is far below deployed.
  - The oracle denominator is the full Kullback-Leibler divergence of the enumerated law from the
    ideal, which upper-bounds what any statistic can capture and is therefore the right denominator
    for a ratio meant to be at most one.
  predictions:
  - metric: efficiency ratio eta at sigma = 0.5, d = 4, dictionary of all dual vectors up to the norm
      bound where ideal character sums fall below 1e-12
    direction: different
    minimum_effect: 'no pre-committed value. Refusal reason: eta is the open question named by the
      corpus''s own hypothesis and pre-committing a value would convert the successor question into
      a confirmation.'
  - metric: captured divergence in the ideal-law null arm
    direction: lower
    minimum_effect: exactly 0 to enumeration precision, that is below 1e-30
  - metric: efficiency ratio in the single-frequency positive control with that frequency in the dictionary
    direction: higher
    minimum_effect: at least 0.9, since the injected defect lives entirely in a dictionary direction
  - metric: efficiency ratio as a function of Gaussian width sigma
    direction: lower
    minimum_effect: decreases monotonically with sigma, falling by at least a factor of ten between
      sigma = 0.5 and sigma = 2.0, because the ideal character sums decay with the square of the width
  - metric: correlation between eta and the alignment statistic relating secret frame directions to
      short dual vectors
    direction: higher
    minimum_effect: no pre-committed value; the correlation's existence is the mechanism-level prediction
      and its magnitude is what the measurement returns
  minimal_test:
    design: 'The cheapest discriminating measurement runs at d = 2 and sigma = 0.5, where the enumerated
      support is a few hundred points and the usable dual dictionary has a handful of vectors. Enumerate
      the defective and ideal laws exactly; compute the oracle Kullback-Leibler divergence as the
      denominator; compute the character sums at every dictionary vector under both laws; form the
      numerator by the small-signal quadratic form; report eta. Run the ideal-law null and the single-frequency
      positive control in the same invocation. This is seconds of compute and it discriminates everything
      that matters: an ideal-law null that is nonzero voids the pipeline; a positive control that
      does not reach eta near one at an in-dictionary frequency means the numerator formula is wrong;
      and the signal-arm eta is already the answer at that cell, so the expensive part of the design
      is only about how eta varies with width, dimension and alignment, not about whether it can be
      measured at all.'
    controls:
    - 'Ideal-law null: numerator computed against the ideal law must be zero to enumeration precision.'
    - 'Off-lattice dictionary null: test vectors not in the dual lattice, bounding how much captured
      divergence arbitrary test functions produce.'
    - Single-frequency positive control, in-dictionary, must give eta near one.
    - Single-frequency positive control, out-of-dictionary, must give eta near zero, which together
      with the previous control shows the dictionary is the binding constraint.
    - 'Quadratic-approximation control: at one cell, compute the captured divergence directly rather
      than by the small-signal formula and report the discrepancy.'
    required_metrics:
    - oracle Kullback-Leibler divergence of the enumerated law from the ideal, in exact arithmetic
    - per-dual-vector character sums under both laws, with the ideal values from closed form
    - captured divergence of the public dictionary and the resulting efficiency ratio eta
    - eta as a function of dictionary norm bound, showing the saturation curve
    - alignment statistic between secret frame directions and short dual vectors
    - captured divergence in the off-lattice dictionary null
  falsification_conditions:
  - The ideal-law null returns nonzero captured divergence, voiding the pipeline.
  - The in-dictionary positive control does not reach eta of 0.9, meaning the numerator formula is
    wrong.
  - The out-of-dictionary positive control returns eta above 0.1, meaning the dictionary is not the
    binding constraint and the ratio does not mean what it is defined to mean.
  - The off-lattice dictionary null captures divergence comparable to the signal arm, meaning arbitrary
    test functions do as well as dual vectors.
  - eta exceeds 1.0, which is impossible by construction and indicates an error in the denominator.
  - The quadratic-approximation control disagrees with the direct computation by more than 20 percent,
    invalidating the numerator's small-signal formula.
  confounders:
  - 'The width regime: at large sigma the ideal character sums underflow and eta becomes a ratio of
    two numerically tiny quantities, which is why exact rational arithmetic rather than floats is
    mandatory throughout.'
  - Dictionary size growing with the norm bound, so eta increases partly because more test functions
    are available and partly because they are the right ones; the off-lattice null separates these.
  - Enumeration truncation affecting the numerator and denominator differently, since character sums
    weight the tail differently from the divergence.
  - The alignment statistic being confounded with the lattice's own geometry rather than with the
    secret frame, at toy dimensions where there is little room for the two to differ.
  - Treating eta measured at one lattice as a property of the scheme rather than of that lattice;
    the across-lattice spread must be reported.
  interpretation_limits:
  - eta is measured on specific toy lattices at small widths and is not extrapolated; the width regime
    where this representation is informative is far below deployed and the record says so.
  - A small eta says the public dual dictionary is inefficient, not that no public statistic is efficient,
    since the dictionary is one class of statistics among many.
  - The oracle denominator is the full divergence, which no statistic can exceed; eta is therefore
    a fraction of an information-theoretic bound and not a fraction of any achievable attack.
  - Nothing here is an attack, a signature count at deployed parameters, or a statement about any
    released implementation.
  target_complexity:
    time_exponent: 'No attack exponent is claimed. Instrument cost only: enumeration exponential in
      the toy dimension, plus dictionary size times support size for the character sums, which is
      the dominant term and is polynomial in the norm bound.'
    memory_exponent: No attack memory exponent is claimed. Instrument memory is the enumerated support
      size plus the dictionary size, both held as exact rationals.
    best_known: Inside this repository the incumbents in the public-statistic class are IDEA-20260808-e7ba81's
      covariance spectrum and IDEA-20260813-2d839b's cross-node statistic, neither of which has been
      evaluated against an oracle denominator. The oracle bound itself is H-FNDSA-6a9cbb's. No claim
      is made about anything outside this repository.
    hidden_overhead: 'The hidden cost is numerical: character sums of a discrete Gaussian at moderate
      widths are astronomically small, so the entire computation must stay in exact rational arithmetic
      and every intermediate must carry its own tail bound, which makes a conceptually two-line calculation
      into a careful one. The human cost hides in the numerator''s small-signal formula, which is
      a standard quadratic approximation whose validity at the measured signal sizes must be checked
      rather than assumed, and the check is the fifth control.'
  dominated_by: 'n/a (no attack result claimed). Pareto check across instrument axes: this entry inherits
    the enumeration instrument''s exponential dimension cost and adds the dictionary cost on top,
    so it is dominated on compute by every sampled entry in this batch and dominates all of them on
    what it can conclude, since only an exactly enumerated law makes an oracle denominator available
    at all. Against H-FNDSA-6a9cbb''s derivation it is far more expensive and answers the question
    that derivation leaves open. No attack frontier is engaged and no frontier row is claimed to be
    beaten.'
  sota_delta: 'No attack; conceptual and measurement contribution only. The quantitative delta is
    the ratio itself: the corpus currently holds an oracle divergence bound and no measured statement
    about what fraction of it a public statistic reaches, so eta moves that fraction from unstated
    to measured at toy scale with an interval, and it provides a common yardstick on which the covariance
    and cross-node statistics already proposed in this lane can be compared for the first time.'
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'Separate parts. That the pipeline computes an oracle denominator and
    a dictionary numerator that pass their nulls: about 0.6, with the exact-arithmetic character sums
    being the main risk. That eta is measurable at sigma = 0.5 and d in 2 to 4: about 0.65. That eta
    is large enough to be interesting, say above 0.05: about 0.25, and a very small eta is the outcome
    the record expects and would report as a usable negative. That eta correlates with the alignment
    statistic: about 0.4. That anything here transfers to deployed widths: not claimed, and the width
    dependence measured here points strongly the other way.'
