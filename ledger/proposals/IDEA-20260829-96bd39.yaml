        and C5 supplies an independent reference value for v_2(f) at 383 bits
        from published data. The mirror contains SafeCurves' pages and specs but
        NO mathematical literature, so these references are not among the
        material now available locally.
      verified_by: null

  assumptions:
    - >-
      The executor session has a shell and Python 3 with arbitrary-precision
      integers, an exact integer square root, and an integer factorization
      routine adequate for numbers up to about 2^32 - needed only at toy scale,
      to factor t^2 - 4p and extract f and d_K exactly. NO factorization of any
      383-bit quantity is required; C5 needs only a square root and the mirror's
      published D.
    - >-
      No SEA, Sage or PARI backend. The walk uses only field arithmetic, square
      roots modulo p by Tonelli-Shanks, and root-finding of a quadratic.
    - >-
      IDEA-20260829-d052e6's claim C1 holds. It is proved there and re-validated
      by this record's own toy census as a by-product; if it fails, C1, C1b and
      C2 here are withdrawn.
    - >-
      Curve parameters are taken from the RQ-SCURVE-2552cf intake, CROSS-CHECKED
      against inputs/SAFECURVES-20260825/tables/equation.tsv and
      tables/field.tsv - which agree exactly - and re-checked for
      self-consistency: p prime at a stated tier, p congruent to 5 modulo 8,
      A^2 - 4 nonzero and equal to the mirror's published 4264844522496.
    - >-
      Every mirror value used is a TIER-2 reading from tables/*.tsv. Before any
      claim leaves the repository the corresponding pages/*.html cell must be
      read, per MIRROR-DEF-1's authority order. NO value in this record comes
      from pages/*.txt, and no generation recipe is attributed to M-383.
    - >-
      Scope is ORDINARY curves over prime fields of odd characteristic. C1's Step
      2 establishes ordinarity as a consequence rather than an assumption, which
      is why no supersingular branch appears anywhere.

  proof_search_map:
    bottleneck: >-
      Obtaining an INDEPENDENTLY DERIVED statement about the CM structure of a
      383-bit curve. The mirror removes the retrieval bottleneck - D is published
      with its factorization - and leaves two others. First, the goal's standing
      defect that every stated numeric relation is a transcription plus a pending
      check; C1 supplies the pending check for the 2-adic part at zero cost.
      Second, the DERIVATION bottleneck: the mirror gives values and no
      arguments, so nothing in it explains WHY every Montgomery row has
      v_2(D) = 2 and no other row does. C1 and C2 supply that explanation.
    baseline_embedding:
      parameter_slice: >-
        At walk length 0 the instrument must reproduce IDEA-20260829-d052e6's
        depth-0 output exactly - the value chi(A^2 - 4) and the resulting count
        of rational 2-torsion points - and both are now pinned by the mirror,
        which reports exactly 1 point of order 2 for M-383, hence 2-torsion rank
        1, hence chi(A^2 - 4) = -1. d052e6's depth-0 stage, and behind it the
        archived plan's lane L8b, is the best-known baseline inside this program
        and this record must CONTAIN it as its step-zero.
      reproduction_check: >-
        A frozen fixture asserting agreement between the walk's step-zero
        2-torsion count, d052e6's depth-0 output on (2^383 - 187, 2065150), and
        the mirror's published count of 1 point of order 2, run before any
        isogeny step is trusted; plus, at toy scale, exact agreement of v_2(f)
        computed from the walk with v_2(f) computed by brute-force factorization
        of t^2 - 4p, for EVERY admissible A; plus, at 383 bits, agreement with
        C5's independent square-root route.
    observation_collision:
      observable: >-
        The ascending walk length, together with the sequence of codomain
        coefficients and Montgomery-model flags.
      distinct_preimage_search: >-
        REQUIRED, AND THE ANSWER IS KNOWN IN ADVANCE AND IS SEVERE. Collisions
        are MASSIVE AND PROVABLE - the walk length takes only the values 1 or 2
        by C2, so on any population of more than two curves it collides by
        pigeonhole; every curve in a given volcano at a given level has the same
        walk length, and every curve of any trace with the same v_2(f) has the
        same walk length. THE OBSERVABLE THEREFORE IDENTIFIES v_2(d_K) MODULO
        NOTHING ELSE, and in particular identifies NEITHER d_K, NOR f, NOR t, NOR
        the curve. The mirror makes this concrete and worse - all five Montgomery
        rows share v_2(D) = 2, so the observable cannot distinguish M-383 from
        M-221, Curve25519, Curve383187 or M-511. Every downstream citation must
        say exactly this. A SHARPER COLLISION THAT MATTERS - E and its quadratic
        twist have IDENTICAL t^2 - 4p, hence identical f, d_K and walk length, so
        the observable cannot distinguish a curve from its twist at all.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Read the CM relation t^2 - 4p = f^2 * d_K two-adically, exactly as
          IDEA-20260829-d052e6 reads #E + #E^t = 2p + 2 two-adically, turning a
          quantity that would otherwise need a point count and a 384-bit
          factorization into a congruence that needs neither.
        predicted_gain: >-
          v_2(t^2 - 4p) exactly, and hence a two-way dichotomy on v_2(f) and
          v_2(d_K), for FREE - zero field operations, three congruences - plus,
          against the mirror, an EXPLANATION of an otherwise unexplained
          twenty-row pattern. This is strictly cheaper than d052e6's dozen
          exponentiations and strictly weaker in what it says, and both halves of
          that comparison are stated.
      - transform: representation_reduction
        proposed_object: >-
          Replace the question "what is the conductor valuation of this 383-bit
          curve", which as posed needs t and a factorization, by the question
          "how many ascending rational 2-isogeny steps are available", which is a
          bounded sequence of quadratic root-findings and Legendre symbols.
        predicted_gain: >-
          v_2(f) in at most two isogeny steps at 383 bits, microseconds.
          Encoding, completeness, soundness and transfer obligations are listed
          separately; the soundness obligation rests on the external volcano
          correspondence and is discharged empirically by the toy census and, at
          full size, by agreement with C5's independent route - never by citation
          alone.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable fixed - v_2(D) = 2 - and vary the forgotten
          structure across the mirror's twenty rows, asking which rows share it
          and why. The answer is that exactly the five Montgomery rows do, and C1
          and C2 explain exactly those five.
        predicted_gain: >-
          A published, previously unexplained twenty-row pattern acquires a
          two-line proof for the five rows it covers, and the remaining fifteen
          acquire the companion statement C1b. That is the record's cheapest
          non-obvious output.
    quantifier_order: >-
      C1 is claimed UNIFORMLY AND UNCONDITIONALLY. FOR ALL primes p congruent to
      5 modulo 8 and FOR ALL A in F_p with A^2 - 4 nonzero,
      v_2(t^2 - 4p) = 4 exactly. No witness depends on the instance. C1b is
      claimed UNIFORMLY over all p congruent to 3 modulo 4 and all curves with 4
      dividing #E. C2 is claimed UNIFORMLY over the same ranges. C3 is claimed
      PER ROW AND EXISTENTIALLY - FOR EACH of the twenty published rows, the
      exhibited v_2(D) is consistent with the applicable theorem. C4 is claimed
      UNIFORMLY BUT CONDITIONALLY ON AN EXTERNAL THEOREM - FOR ALL such (p, A),
      IF the volcano-height-equals-v_l-of-conductor correspondence holds as
      recalled, THEN the ascending walk from a floor vertex has length equal to
      v_2(f). C5 is claimed PER CURVE and is exact integer arithmetic.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For this (p, A), v_2(t^2 - 4p) = 4, v_2(f) = 1 and v_2(d_K) = 2,
        certified by the congruence argument, by the exhibited ascending walk,
        and by the exact square root of (t^2 - 4p)/D." It certifies NOTHING about
        the MAGNITUDE of d_K, which is what the disc criterion actually asks
        about, and therefore does NOT adjudicate the disc cell - the 2-adic
        valuation of a discriminant places no lower bound on its absolute value.
        The mirror separately publishes |D| approximately 2^383.0 for M-383 and a
        "True" verdict for |D| above 2^100, but that is a transcription and this
        record neither derives nor checks it. It certifies nothing about the odd
        part of f, nothing about the class number, nothing about the group order
        and nothing about the ECDLP. THE HONEST SIZE OF THE RESULT IS ONE TO TWO
        BITS OF THE CM DATA PLUS AN EXPLANATION OF A PUBLISHED PATTERN.
      nearby_object_control: >-
        FOUR, IN DECREASING SHARPNESS. (i) CURVE383187 OVER THE IDENTICAL PRIME
        2^383 - 187, with A = 229969 - the sharpest control in the family,
        because every prime-dependent quantity is IDENTICAL, so any difference in
        the measured walk is a property of the CURVE. The mirror gives it the
        same cofactor 2^3, the same twist cofactor 2^2, the same 1 point of order
        2 and the same v_2(D) = 2, so C1, C2 and C4 predict THE SAME walk length
        1 for both; equal lengths are predicted and unequal lengths would refute
        C4 for one of them. (ii) A PRIME CONGRUENT TO 1 MODULO 8 at the same bit
        length, where C1's Step 3 gives v_2(u^2 - p) at least 3 instead of
        exactly 2, so v_2(t^2 - 4p) is at least 5 and C2's dichotomy is REPLACED.
        An instrument returning v_2 = 4 there has not identified p modulo 8 as
        the load-bearing structure and is void. THIS IS A BLOCKING REFUSAL
        CONTROL. (iii) THE ANOMALOUS ROW, whose mirror trace is t = 1 and whose
        D is -11: t odd, so C1's Step 2 fails, v_2(t^2 - 4p) = 0, v_2(f) = 0 and
        the volcano has height 0 - the instrument must report a walk of length 0
        and must NOT claim C1. (iv) A' = 2065151 over the same p - one unit away,
        identical code path, same C1 verdict required since C1 is uniform in A,
        and absent from the mirror so no published value can leak into the
        verdict.
    proof_obligations:
      - claim: >-
          p congruent to 5 modulo 8 and 4 dividing #E imply t congruent to 2
          modulo 4, hence t = 2u with u odd and E ordinary.
        responsibility: correctness
      - claim: >-
          u odd implies u^2 congruent to 1 modulo 8; with p congruent to 5 modulo
          8 this gives v_2(u^2 - p) = 2 exactly and v_2(t^2 - 4p) = 4 exactly.
        responsibility: strictness
      - claim: >-
          p congruent to 3 modulo 4 and 4 dividing #E imply t congruent to 0
          modulo 4 and v_2(t^2 - 4p) = 2 exactly.
        responsibility: strictness
      - claim: >-
          A fundamental discriminant has v_2 in {0, 2, 3}, so
          2*v_2(f) + v_2(d_K) = 4 forces v_2(f) in {1, 2} and
          2*v_2(f) + v_2(d_K) = 2 forces v_2(f) in {0, 1}.
        responsibility: strictness
      - claim: >-
          The mirror's published trace for M-383 is congruent to 2 modulo 4, and
          v_2(t^2 - 4p) computed from it equals 4 exactly.
        responsibility: baseline
      - claim: >-
          (t^2 - 4p)/D is a perfect square and its square root f satisfies
          v_2(f) = 1, computed from published values by an exact integer square
          root.
        responsibility: baseline
      - claim: >-
          The number of F_p-rational 2-isogenies from E equals #E[2](F_p) - 1,
          which is 1 when chi(A^2 - 4) = -1 and 3 when chi(A^2 - 4) = +1.
        responsibility: correctness
      - claim: >-
          The volcano height equals v_2 of the conductor of Z[pi], and a vertex
          with exactly one rational 2-isogeny in a volcano of height at least 1
          is on the floor.
        responsibility: baseline
      - claim: >-
          The implemented 2-isogeny step produces a codomain with the same group
          order as the domain, checked at toy scale by brute-force counting.
        responsibility: correctness
      - claim: >-
          The toy census is EXHAUSTIVE over admissible A at each size where
          exhaustiveness is claimed.
        responsibility: scope
      - claim: >-
          Correctness of the walk implementation at 383 bits given exhaustive
          validation at 13 to 15 bits and agreement with C5 at full size.
        responsibility: success_probability
    not_applicable_reason: null

