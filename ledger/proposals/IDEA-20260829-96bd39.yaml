  minimal_test:
    design: >-
      STAGE 0, ZERO COMPUTE BEYOND THREE BIG-INTEGER OPERATIONS, AND IT IS THE
      CHEAPEST VALID DISCRIMINATOR IN THIS SESSION. (a) Write the C1, C1b and C2
      proofs and confirm by hand that 2^383 - 187 is congruent to 5 modulo 8.
      (b) Compute v_2(t^2 - 4p) from the mirror's published M-383 trace - one
      squaring, one subtraction - and require exactly 4. (c) Compute
      (t^2 - 4p)/D from the published D, require a perfect square, take its exact
      integer square root f, and read v_2(f); require 1. (d) Read v_2(D) off
      disc.tsv table 7 for all twenty rows and check the C3 pattern. If any of
      these fails, the record dies before a single line of isogeny code is
      written.
      STAGE 1, minutes of compute. EXHAUSTIVE CENSUS at three toy primes
      congruent to 5 modulo 8 near 2^13 to 2^15 and, as the blocking refusal
      control, three primes congruent to 1 modulo 8 at the same sizes. For EVERY
      admissible A, compute t by direct enumeration of Legendre symbols, an O(p)
      pass; compute v_2(t^2 - 4p) and require exactly 4 in the first group and at
      least 5 in the second; factor t^2 - 4p to get f and d_K exactly and record
      v_2(f). Add a third group at primes congruent to 3 modulo 4 to test C1b.
      STAGE 2, minutes. Implement the rational 2-isogeny step, validate it at toy
      scale by brute-force counting both domain and codomain and requiring equal
      orders, then measure the ascending walk length for every admissible A and
      compare against v_2(f). This is where the external volcano correspondence
      is tested rather than assumed.
      STAGE 3, seconds. Apply the frozen walk to (2^383 - 187, 2065150), check
      its length against Stage 0's reference value of 1, and emit the certificate
      - chi(A^2 - 4), the walk, each codomain coefficient, each Montgomery-model
      flag, and the derived pair (v_2(f), v_2(d_K)).
      STAGE 4, seconds. The matched-pair run on Curve383187 over the same prime;
      the A' = 2065151 nearby control; the Anomalous refusal control against its
      published t = 1 and D = -11.
      STAGE 5, seconds. The twenty-row family sweep of C1, C1b and C3, recording
      per row which theorem applies, the published v_2(D), and whether they are
      consistent.
    controls:
      - >-
        BLOCKING REFUSAL CONTROL - toy primes congruent to 1 modulo 8, where C1
        must give a DIFFERENT answer. An instrument returning v_2 = 4 there has
        not identified p modulo 8 as the load-bearing structure and everything it
        says is void. This is the control that separates a theorem from a
        coincidence.
      - >-
        BLOCKING REFUSAL CONTROL AT CRYPTOGRAPHIC SIZE - the Anomalous row, whose
        published trace is t = 1, odd, so C1's hypothesis 4 divides #E fails and
        v_2(t^2 - 4p) = 0. The instrument must REFUSE C1 for it and must report a
        volcano height of 0, consistent with the published D = -11. This control
        did not exist before the mirror was available.
      - >-
        POSITIVE, BLOCKING - toy curves with KNOWN v_2(f) = 1 and KNOWN
        v_2(f) = 2, identified by brute-force factorization at 13 to 15 bits. The
        walk must return each exactly. A walk that has only ever returned 1 cannot
        certify 1 - and since the mirror predicts 1 for every Montgomery row, this
        control is the only place the value 2 can be exercised at all.
      - >-
        NEGATIVE, SAME PRIME, PARAMETER-MATCHED, AND UNIQUE TO THIS FAMILY -
        Curve383187 at A = 229969 over the identical p = 2^383 - 187.
      - >-
        NEGATIVE, ONE UNIT AWAY, AND ABSENT FROM THE MIRROR - A' = 2065151 over
        the same p, identical code path, so that no published value can leak into
        the verdict.
      - >-
        NULL, SAME SHAPE - 10^3 uniformly random admissible A at the real
        383-bit prime, identical code path, for the empirical distribution of
        walk length. PREDICTED to take only the values allowed by C2. A
        random-A population producing a value outside {0, 1, 2} at the real prime
        falsifies C2 at full size even if the toy census passed.
      - >-
        ISOGENY-STEP INTEGRITY CONTROL - at toy scale, brute-force count the
        group order of every codomain and require exact equality with the domain.
        An isogeny step that changes the order is not an isogeny and every walk
        length it produced is meaningless.
      - >-
        CROSS-IMPLEMENTATION - each square root modulo p computed twice, by
        Tonelli-Shanks and by exponentiation where p's residue class permits a
        closed form; and v_2(f) obtained twice, by the walk and by C5's exact
        integer square root. Disagreement voids the run.
      - >-
        SOURCE-TIER CONTROL - for every mirror value that enters a reported
        result, re-read the corresponding cell from pages/*.html before
        publication, per MIRROR-DEF-1's authority order. No pages/*.txt file is
        read at any point, and no generation recipe is attributed to M-383.
    required_metrics:
      - 'v_2(t^2 - 4p) at 383 bits from the published trace, expected exactly 4'
      - 'whether (t^2 - 4p)/D is a perfect square, and v_2 of its square root'
      - 'per mirror row, the published v_2(D), the applicable theorem, and consistency'
      - 'per toy p and residue class mod 8, the exhaustive v_2(t^2 - 4p) distribution'
      - 'per toy A, brute-force t, f, d_K, v_2(f), walk length, and their agreement'
      - 'for M-383, chi(A^2 - 4), the full walk, and the derived (v_2(f), v_2(d_K))'
      - 'for M-383, per vertex, the codomain coefficient and its Montgomery-model flag'
      - 'for Curve383187 over the same prime, the identical record, side by side'
      - 'the walk-length distribution over 10^3 random A at the real 383-bit prime'
      - 'the isogeny-step order-preservation check result at every toy vertex'
      - 'per mirror value used, the file, the table number, the line, and the tier read'

  falsification_conditions:
    - >-
      v_2(t^2 - 4p) computed from the mirror's published M-383 trace is not 4.
      Either C1 is refuted, or IDEA-20260829-d052e6's C1 is, or the published
      trace is wrong. Separate them by recomputing the trace as 4*l' - p - 1 from
      tables/twist.tsv, an independent published route; if the two published
      routes agree with each other and disagree with the theorem, the theorem is
      the problem and the counterexample is reported as a refutation artifact.
    - >-
      (t^2 - 4p)/D is not a perfect square. Two independent mirror columns are
      mutually inconsistent - halt, re-read pages/disc.html at the authoritative
      tier, and report a mirror defect if tier 1 confirms it. This is a process
      finding, not a mathematical result.
    - >-
      Any admissible A at a toy prime congruent to 5 modulo 8 with
      v_2(t^2 - 4p) different from 4. C1 is REFUTED as a theorem - the strongest
      possible negative here.
    - >-
      Toy primes congruent to 1 modulo 8 giving v_2(t^2 - 4p) = 4. The refusal
      control failed, the argument does not depend on the structure it claims to
      depend on, and the record is void.
    - >-
      Any disagreement at toy scale between the walk length and v_2(f) computed
      by factorization, on the chi(A^2 - 4) = -1 branch. The external volcano
      correspondence as applied here is wrong; C4 is withdrawn while C1, C1b, C2,
      C3 and C5 survive untouched, since they do not depend on it. THE RECORD IS
      DESIGNED SO THAT THIS FAILURE COSTS ONLY PART OF THE DELIVERABLE.
    - >-
      The 383-bit walk length is not 1. Halt, exclude implementation error, then
      the external correspondence, then the mirror's D, then the mirror's trace,
      and only then consider the theorem; make no statement outside the
      repository until the first three are excluded.
    - >-
      A toy isogeny step that does not preserve the group order. Implementation
      failure; nothing is reported.
    - >-
      p = 2^383 - 187 is not congruent to 5 modulo 8, or the mirror's published
      trace is not congruent to 2 modulo 4. C1 does not apply in the stated form
      and the record is withdrawn for this curve.
    - >-
      The Anomalous refusal control is not refused, or returns a volcano height
      other than 0. Instrument failure under AGENTS.md rule 3; the family sweep is
      void.

  confounders:
    - >-
      A 2-ADIC VALUATION IS NOT A MAGNITUDE. v_2(d_K) says nothing about |d_K|,
      which is what the disc criterion asks about and which the mirror separately
      publishes as approximately 2^383.0 for M-383 with a "True" verdict. This
      record neither derives nor checks that magnitude, and citing this output as
      progress on the disc cell would be a category error.
    - >-
      C3 IS A CHECK OF A THEOREM AGAINST A TRANSCRIPTION, NOT A PROOF OF EITHER.
      If the published v_2(D) values match what C1, C1b and C2 permit, neither
      the theorem nor the mirror is thereby proved - a shared upstream error is
      conceivable, though implausible for values derived independently by
      SafeCurves. What agreement excludes is independent error in either.
    - >-
      THE WALK MAY LEAVE THE MONTGOMERY WORLD. The codomain of a rational
      2-isogeny with kernel {O, (0,0)} need not admit a Montgomery model, and the
      retrieved eprint 2017/1198 abstract's efficient formulas are explicitly for
      kernels NOT containing (0,0). The implementation must therefore work in a
      general Weierstrass model and convert opportunistically; a walk that
      silently assumes Montgomery form at every vertex will produce a wrong answer
      that only the toy order-preservation control is likely to catch.
    - >-
      CRATER AMBIGUITY. On the crater the ascending step is not unique. The
      implementation must detect the crater by the local edge structure and STOP,
      rather than continuing into a horizontal edge and reporting an inflated
      height. With C4 predicting height 1, the crater is reached after one step
      and this detection is exercised immediately rather than rarely.
    - >-
      MIRROR-DEF-1 BITES THIS CURVE SPECIFICALLY. M-383's rigid comments cell is
      EMPTY and the adjacent Curve383187 row carries a generation recipe. No
      recipe may be attributed to M-383 anywhere, and no value in this record may
      come from pages/*.txt.
    - >-
      MIRROR TIER. Every mirror value used here is tier 2 (tables/*.tsv). The
      tier-1 pages/*.html remain the authority and a tier-2 reading may not be
      the last word on any externally reported number.
    - >-
      TOY-SCALE DEGENERACY. At 13 to 15 bits, supersingular and near-degenerate
      curves are common, as KN-TECH-033 states. C1's Step 2 excludes
      supersingularity as a consequence, so any toy curve that IS supersingular is
      itself evidence of a bug in the census, not a special case to be skipped.
    - >-
      d052e6 IS A LOAD-BEARING DEPENDENCY. C1 Step 1 is not proved here. If
      d052e6 has not passed its own toy census, this record's theorems are
      conditional on an unverified claim and must be labelled so downstream.

  interpretation_limits:
    - >-
      Nothing here is a security statement. A conductor valuation constrains the
      endomorphism ring two-adically; it bounds no attack cost, adjudicates no
      criterion cell, and says nothing about the ECDLP.
    - >-
      C1, C1b and C2 are proved and are unconditional given d052e6's C1. C3 and
      C5 are exact arithmetic on transcribed values and inherit the
      transcription's status. C4 depends on an external theorem retrieved only as
      a recollection, validated empirically at 13 to 15 bits and cross-checked at
      383 bits against C5.
    - >-
      THE MIRROR IS INTAKE, NOT EVIDENCE. Every criterion cell in it remains
      user_supplied_unverified under the goal's claim boundaries, and this record
      adjudicates no cell. What the mirror changes is that the campaign's numbers
      are now AVAILABLE to be checked and that C1's prediction can be tested at
      383 bits rather than only at 15.
    - >-
      TRANSFER TO THE OTHER 19 CURVES, STATED EXACTLY. (a) FULL TRANSFER of C1
      and C2 to every Montgomery-form row whose prime is congruent to 5 modulo 8.
      By tables/field.tsv those are M-221 over 2^221 - 3, Curve25519 over
      2^255 - 19, M-383 and Curve383187 over 2^383 - 187, and M-511 over
      2^511 - 187 - all five congruent to 5 modulo 8 by the same computation - so
      all five inherit the forcing theorem verbatim, and all five are observed to
      have v_2(D) = 2. IDEA-20260829-d052e6's transfer list names M-221, M-383
      and Curve383187 but OMITS M-511; that omission is CONFIRMED BY DIRECT READ
      of the file and is an omission rather than an exclusion, since M-511's
      prime satisfies the same congruence and its mirror row carries the same
      cofactor 2^3 and twist cofactor 2^2. Curve25519 likewise inherits C1, a
      datum d052e6 does not produce. (b) TRANSFER OF C1b, not C1, to the rows
      whose prime is congruent to 3 modulo 4 with 4 dividing #E - the Edwards
      rows E-222, Curve1174, E-382, Curve41417, Ed448-Goldilocks and E-521 - where
      the conclusion CHANGES to v_2(t^2 - 4p) = 2 and the dichotomy becomes
      (v_2(f), v_2(d_K)) in {(1,0), (0,2)}. An instrument that does not branch on
      p modulo 8 will return a confidently wrong answer, and that is the single
      most likely way to get a wrong result on a sibling curve. (c) NO TRANSFER
      of either theorem to any row where 4 does not divide #E, which includes the
      Anomalous row with #E = p odd and the cofactor-1 Weierstrass rows; for
      those the instrument must REFUSE. (d) The Edwards rows need a birational
      conversion first, and t^2 - 4p is preserved by it. (e) NO TRANSFER at all to
      any claim about |d_K|, about the class number, or about any group order.
    - >-
      The instrument REFUSING is a legitimate and informative output and must be
      recorded as a refusal, never as a pass.
    - >-
      The retrieved eprint 2025/543 and 2017/1198 entries are ABSTRACTS ONLY. No
      theorem, formula or hypothesis from either is asserted; the walk must
      re-derive every formula it uses and validate it by census.
    - >-
      OPERATIONAL OBSERVATION, RETAINED BECAUSE IT IS TRUE AND NOT BECAUSE IT
      BLOCKS ANYTHING. Live fetches of safecurves.cr.yp.to and of cr.yp.to on
      2026-08-29 both failed with "Parse Error - Content-Length can't be present
      with Transfer-Encoding", a different failure from the HTTP 502 recorded in
      the prior session's capsule and now seen on two hosts. THE DATA IS NOT
      UNAVAILABLE - it is in this repository at inputs/SAFECURVES-20260825/ and
      was read here. The observation is recorded only so no future session wastes
      a budget re-attempting the live site.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For p a fixed prime congruent to 5 modulo 8 and A drawn uniformly from
        the admissible Montgomery coefficients over F_p, the two cases
        v_2(f) = 1 and v_2(f) = 2 permitted by C2 occur with probabilities
        approaching 2/3 and 1/3 respectively as p tends to infinity; equivalently,
        conditioned on the rigorous constraint 2*v_2(f) + v_2(d_K) = 4, the
        fundamental discriminant d_K behaves like a uniformly random fundamental
        discriminant of its size with respect to its 2-adic type, for which the
        classes v_2(d_K) = 0, 2 and 3 occur in the natural densities 1/2, 1/4
        and 1/4, renormalised onto the two admissible classes.
      rigorous_support: >-
        Two rigorous halves and one honest gap. (i) The CONSTRAINT
        2*v_2(f) + v_2(d_K) = 4 with v_2(f) in {1, 2} is PROVED by C1 and C2 and
        is not assumed; the heuristic concerns only the SPLIT between the two
        permitted cases. (ii) The natural densities of fundamental discriminants
        by 2-adic type are elementary and exact. THE GAP - the discriminants
        arising as t^2 - 4p over a fixed p are weighted by Hurwitz-Kronecker class
        numbers via the Deuring correspondence, not drawn uniformly, and no proof
        is offered that the weighting is 2-adically neutral. NOTE THE MIRROR'S
        FIVE-ROW SAMPLE IS NOT EVIDENCE FOR OR AGAINST THIS - all five have
        v_2(f) = 1, but they are a designed, not a random, sample, and reading
        five designed curves as a 5-for-5 confirmation of a 2/3 split would be
        exactly the selection error the toy census exists to avoid.
      validation_plan: >-
        SAMPLING - the exhaustive toy census of Stages 1 and 2 gives the EXACT
        joint distribution of (v_2(f), v_2(d_K)) over ALL admissible Montgomery A
        at three primes congruent to 5 modulo 8 near 2^13 to 2^15, a complete
        population, obtained by brute-force t followed by exact factorization of
        the small integer t^2 - 4p; plus a 10^3 random subsample of A at the real
        383-bit prime measured by WALK LENGTH only, since factorization is
        impossible there. SCALE AND PARAMETERS RECORDED - the primes, the
        population sizes and the subsample seeds. COMPARISON DISTRIBUTION - the
        observed split against the predicted (2/3, 1/3) by an exact chi-square
        test with expected counts stated in advance. TAIL CHECK - the observed
        frequency of the FORBIDDEN values 0 and 3 or more, which must be exactly
        zero; any nonzero count is not a tail event but a refutation of C2.
        TRANSFER - validated at 13 to 15 bits and reported at 383 bits only as a
        NULL for interpreting M-383's own walk length.
    - id: H2
      statement: >-
        A 2-isogeny walk implementation whose output agrees with brute-force
        v_2(f) on 100 percent of an exhaustive toy population at 13 to 15 bits is
        correct at 383 bits; formally, the map from (p, A) to the ascending walk
        length has no size-dependent failure mode - overflow, modular reduction,
        square-root branch selection, or exceptional-case handling - that first
        appears above 15 bits.
      rigorous_support: >-
        NONE, and the record says so plainly. Same shape as heuristic H2 of
        IDEA-20260829-d052e6 and the archived plan's H4. TWO STRUCTURAL
        MITIGATIONS, stated as mitigation and not as support. First, the walk's
        OUTPUT RANGE is constrained by a theorem, so an implementation defect
        producing a value outside {0, 1, 2} at 383 bits is CAUGHT by C2 even
        though it cannot be prevented, and the 10^3-sample full-size null gives
        that check a thousand chances to fire. Second, and materially stronger
        than anything available before the mirror, C5 SUPPLIES AN INDEPENDENT
        FULL-SIZE REFERENCE VALUE for v_2(f) computed by an exact integer square
        root from published data, so the 383-bit walk has a right answer to be
        checked against rather than only a range.
      validation_plan: >-
        Five checks, none of which discharges the assumption. (i) Exhaustive toy
        census agreement at 13 to 15 bits, with the isogeny step separately
        validated by brute-force order preservation at every vertex. (ii) THE
        FULL-SIZE REFERENCE CHECK against C5's square-root value of v_2(f). (iii)
        The full-size range check over 10^3 random A, every walk length required
        to lie in {0, 1, 2}. (iv) The step-zero 2-torsion count agreeing with
        d052e6's independently derived depth-0 output AND with the mirror's
        published count of 1 point of order 2. (v) THE MATCHED-PAIR CONSISTENCY
        CHECK - Curve383187 over the identical prime, whose walk must also be 1;
        a violation on exactly one of the two localises the defect to the
        coefficient-dependent code path rather than to the field arithmetic.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. C1, C1b and C2 cost ZERO field operations -
      congruences on integers, evaluated by inspection. C3 costs twenty
      inspections of a printed factorization. C5 costs one squaring, one
      subtraction, one division and one exact integer square root on 384-bit
      quantities - microseconds. The walk costs O(1) square roots modulo p and
      O(1) Legendre symbols per step, with at most 2 steps by C2, that is a
      handful of modular exponentiations, O(log^3 p) bit operations and
      microseconds at 383 bits. Certificate verification by a second
      implementation is the same handful - the certificate IS succinct, in
      contrast to IDEA-20260829-fa8d4e's trace residues, whose verification costs
      what production costs.
    memory_exponent: >-
      O(log p) working memory and O(log p) certificate size. The toy census needs
      O(p) time and O(1) memory per curve for the brute-force order, plus a
      factorization of a number below 2^32; at 2^15 that is trivial, and the
      14-core 48 GB envelope is not binding anywhere. The census parallelises
      perfectly across A.
    best_known: >-
      For the CM structure of an arbitrary 383-bit curve, the best known general
      route is a full SEA point count followed by factorization of the 384-bit
      integer t^2 - 4p - the first unavailable in this environment by declared
      assumption, the second infeasible in general at that size here. INSIDE THIS
      REPOSITORY the best known route to the CM data of these twenty curves is
      now READING inputs/SAFECURVES-20260825/tables/disc.tsv, which publishes the
      trace and the fully factored D at zero cost and STRICTLY DOMINATES this
      record on every cost axis as a way to LEARN the values. This record does not
      compete with it on that axis; it supplies the DERIVATION the mirror does not
      contain, and a check the mirror cannot perform on itself. For the 2-ADIC
      PART the best known route is exactly the argument in C1, which is
      elementary; this record claims no improvement on it and claims only that the
      program does not hold it. Against the ECDLP attack frontier - KN-TECH-001,
      KN-TECH-006, KN-TECH-018, KN-TECH-031, KN-TECH-032, KN-TECH-033,
      KN-TECH-035 - this record is dominated by every row because it is not an
      attack.
    hidden_overhead: >-
      No o(1) and nothing superpolynomial. Three honest hidden costs, all
      epistemic. (i) THE RESULT IS ONE TO TWO BITS OF THE CM DATA plus an
      explanation of a published pattern; C2 narrows v_2(f) to a two-element set
      and the mirror then picks the element, so the walk's marginal content is
      confirmation rather than discovery. (ii) C4 rests on an external theorem
      this session could not open, validated at 13 to 15 bits and cross-checked
      at full size only against another published value. (iii) The 2-isogeny
      formulas must be re-derived, and a silent error in a square-root branch
      would produce a confidently wrong walk that only the toy
      order-preservation control is likely to catch.
    tradeoff_note: >-
      The tradeoff is RIGOUR AGAINST REACH and it is unusually favourable at one
      end. C1, C1b and C2 are theorems costing nothing and delivering one bit
      each; C3 and C5 cost microseconds and convert that bit into a checked value
      at cryptographic size; the walk costs microseconds more and delivers the
      neighbour coefficients and Montgomery-model flags that no published table
      supplies. There is no time-memory tradeoff, and parallelisation is
      irrelevant at 383 bits; the 14 cores matter only for the toy census, which
      is embarrassingly parallel across A.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW BEFORE WRITING THIS FIELD; `null` is not
    asserted. AS AN ATTACK it is dominated by every row simultaneously on time,
    memory and data because it is not an attack - rho (KN-TECH-001, KN-TECH-006),
    automorphism-discounted rho (KN-TECH-018), BSGS (KN-TECH-031, KN-TECH-035),
    MOV and Frey-Ruck (KN-TECH-032), the trace-one transfer (KN-TECH-033). AS A
    WAY TO LEARN THE CM DATA OF THESE TWENTY CURVES it is STRICTLY AND COMPLETELY
    DOMINATED, on every cost axis, BY READING
    inputs/SAFECURVES-20260825/tables/disc.tsv, which is in this repository and
    publishes the trace and the fully factored discriminant for every row; that
    domination is real and operative and is conceded without qualification. It is
    also dominated on information by SEA plus factorization of t^2 - 4p, which
    returns d_K and f for an arbitrary curve; that route is unavailable here.
    AS A DERIVATION it is NOT dominated - the mirror publishes values and no
    arguments, so nothing in it explains why exactly the five Montgomery rows have
    v_2(D) = 2, and no record inside this program derives any CM fact from the
    curve equation. AGAINST IDEA-20260829-d052e6 it is Pareto-INCOMPARABLE and not
    dominated - d052e6 returns v_2(#E) and says nothing about the conductor; this
    returns v_2(f) and says nothing about the group order; neither implies the
    other and the two compose. AS A MEASUREMENT OF THE RATIONAL 2-ISOGENY
    NEIGHBOURHOOD - the codomain coefficients and their Montgomery-model flags -
    no incumbent inside or outside this program was identified producing it for
    these curves, and the mirror does not contain it. Both non-dominations are
    narrow and are stated narrowly.
  sota_delta: >-
    ZERO speedup against any attack baseline on every axis. THE DELTA AS DATA HAS
    SHRUNK AND IS RESTATED HONESTLY - the corpus under knowledge/ and ledger/
    still holds ZERO CM discriminants and ZERO conductors for any of the twenty
    curves, but inputs/ now holds the discriminants and the traces, so this record
    no longer creates those numbers. QUANTITATIVELY AS DERIVATION - C1 and C2
    convert v_2(t^2 - 4p) from "requires a point count and a 384-bit
    factorization" to "three congruences, zero field operations", and they EXPLAIN
    a published twenty-row pattern - v_2(D) = 2 for exactly the five Montgomery
    rows over primes congruent to 5 modulo 8, v_2(D) = 0 for the fifteen others,
    and v_2(D) = 3 nowhere - which the mirror reports without comment and which no
    record in this program had noticed. That explanation costs nothing and is the
    record's principal new content. QUANTITATIVELY AS A CHECK - C1's prediction
    moves from testable only at 15 bits to testable at 383 bits by one squaring,
    and C5 supplies an independent full-size reference for v_2(f) from a second
    published column, so the walk acquires a right answer instead of a range.
    QUANTITATIVELY AS SCOPE - the delta is ONE TO TWO BITS of the CM data per
    curve; the disc criterion, which asks about |d_K|, remains entirely
    unadjudicated. That size is stated here so no downstream record inflates it.
    AS METHOD - the program gains its first empirical test of the isogeny-volcano
    correspondence and its first contact with the retrieved 2025 Kummer-model
    criterion, both currently absent.
  estimated_cost:
    implementation: medium
    compute: low
    basis: >-
      Implementation is a rational 2-isogeny step plus Tonelli-Shanks plus a
      brute-force toy point counter and a small-integer factorization - a few
      hundred lines, no external dependency. Stage 0 is four big-integer
      operations and needs no implementation at all. The risk is in the isogeny
      formula derivation, not in the code volume. Compute is minutes for the toy
      census across 14 cores and microseconds for every 383-bit run.
  recommended_priority: high

