  question_id: RQ-SCURVE-2552cf
  goal_id: GOAL-SCURVE-fdf803
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    THE 2-VOLCANO FORCING THEOREM AND THE ASCENDING 2-ISOGENY WALK - prove, with
    ZERO compute, that v_2(t^2 - 4p) = 4 EXACTLY for M-383 and every Montgomery
    curve over a prime congruent to 5 mod 8, deduce that its rational 2-isogeny
    volcano has height exactly 1 or 2, and check the deduction against the CM
    discriminants published in the in-repository SafeCurves mirror, which give
    v_2(D) = 2 for EXACTLY the five Montgomery rows and 0 for all fifteen others
  class: representation

  claim: >-
    IDEA-20260829-d052e6 reads the identity #E + #E^t = 2p + 2 two-adically and
    forces the twist COFACTOR. This record reads the DISCRIMINANT t^2 - 4p
    two-adically and forces the shape of the ENDOMORPHISM structure. The two
    forcing arguments share a technique and share nothing else - one constrains a
    group order, the other constrains a conductor. Because the SafeCurves mirror
    at inputs/SAFECURVES-20260825/ is present in this repository and publishes
    the trace AND the fully factored CM field discriminant for all twenty rows,
    every step below is now checkable against a reference value at 383 bits
    rather than only at toy scale. Six sub-claims.

    (C1) RIGOROUS, ZERO COMPUTE, AND IT IS THE RECORD'S CORE. Let E_A be a
    Montgomery curve over F_p with p congruent to 5 modulo 8, and let t be its
    trace. Then v_2(t^2 - 4p) = 4 EXACTLY. PROOF, fully checkable and
    self-contained given IDEA-20260829-d052e6's claim C1.
    Step 1. 4 divides #E(F_p) for every Montgomery curve (d052e6 C1, proved
    there from the doubling map and two Legendre symbols, and NOT re-derived
    here).
    Step 2. p congruent to 5 modulo 8 implies p congruent to 1 modulo 4, so
    p + 1 is congruent to 2 modulo 4. With #E congruent to 0 modulo 4 and
    t = p + 1 - #E, we get t congruent to 2 modulo 4. Write t = 2u with u ODD.
    In particular t is nonzero, so E is ORDINARY - no supersingular case need be
    handled.
    Step 3. t^2 - 4p = 4(u^2 - p). Since u is odd, u^2 is congruent to 1 modulo
    8. Since p is congruent to 5 modulo 8, u^2 - p is congruent to
    1 - 5 = -4, that is 4, modulo 8. Hence v_2(u^2 - p) = 2 EXACTLY and
    v_2(t^2 - 4p) = 4 EXACTLY. QED.
    APPLIED TO M-383. p = 2^383 - 187, and 187 = 8*23 + 3, so -187 is congruent
    to -3, that is 5, modulo 8, giving p congruent to 5 modulo 8. THE DESIGNERS
    THEMSELVES STATE THIS CONDITION - the mirror's tables/rigid.tsv records for
    M-511 the recipe "p = 5 (mod 8) is largest prime smaller than 2^511", so the
    congruence C1 needs is a published design constraint of this curve family and
    not an accident this record noticed. THE MIRROR ALSO PUBLISHES THE TRACE,
    t = -1329890207450988128841758359484337226464313875646092906354, whose final
    digits 906354 are congruent to 2 modulo 4 - exactly Step 2's conclusion. C1
    is therefore verifiable at 383 bits by one squaring and one subtraction, and
    the executor must do so rather than rely on the toy census alone.

    (C1b) RIGOROUS COMPANION, SAME TWO LINES, DIFFERENT RESIDUE CLASS, AND IT
    EXTENDS THE FAMILY SWEEP. Let E/F_p be any curve with 4 dividing #E and p
    congruent to 3 modulo 4. Then p + 1 is congruent to 0 modulo 4, so t is
    congruent to 0 modulo 4; write t = 4s. Then t^2 - 4p = 4(4s^2 - p), and
    4s^2 - p is ODD because p is odd, so v_2(t^2 - 4p) = 2 EXACTLY. This covers
    the Edwards rows of the family, whose primes are congruent to 3 modulo 4 and
    whose cofactors are 2^2 or 2^3, and it is stated because it turns the
    instrument's family sweep from a one-branch test into a two-branch one.

    (C2) RIGOROUS COROLLARY, ZERO COMPUTE. Write t^2 - 4p = f^2 * d_K with d_K
    the fundamental discriminant of the CM field K = Q(sqrt(t^2 - 4p)) and f the
    conductor of Z[pi] in the maximal order. A fundamental discriminant has
    v_2(d_K) in {0, 2, 3} and nothing else, since d_K is either congruent to 1
    modulo 4, or 4m with m congruent to 3 modulo 4 giving v_2 = 2, or 4m with m
    congruent to 2 modulo 4 giving v_2 = 3. Combining with C1,
    2*v_2(f) + v_2(d_K) = 4, whose only solutions are
    (v_2(f), v_2(d_K)) = (2, 0) or (1, 2). THEREFORE v_2(f) is EXACTLY 1 OR 2.
    Combining with C1b instead gives 2*v_2(f) + v_2(d_K) = 2, whose only
    solutions are (1, 0) and (0, 2).

    (C3) THE PUBLISHED CHECK, AND IT PASSES - A NONTRIVIAL PREDICTION CONFIRMED
    AT ZERO COST. The mirror's tables/disc.tsv publishes the CM field
    discriminant D with a full factorization for every row. Read on 2026-08-29:
    D carries the factor 2^2 and no higher power of 2 for EXACTLY five rows -
    M-221, Curve25519, M-383, Curve383187 and M-511 - and carries NO factor of 2
    for all fifteen others. THOSE FIVE ARE EXACTLY THE MONTGOMERY-SHAPE ROWS OF
    THE FAMILY, and by tables/field.tsv their primes are 2^221 - 3, 2^255 - 19,
    2^383 - 187, 2^383 - 187 and 2^511 - 187, every one of which is congruent to
    5 modulo 8. C2 PREDICTS v_2(d_K) in {0, 2} for exactly these rows and the
    mirror reports 2 for all five. C1b predicts v_2(d_K) in {0, 2} for the
    p congruent to 3 modulo 4 rows and the mirror reports 0 for all of them.
    NO ROW IN THE MIRROR HAS v_2(D) = 3, WHICH C2 AND C1b BOTH FORBID FOR THE
    ROWS THEY COVER. This is a twenty-row check of a two-line theorem against
    published data, it costs nothing, and it passes.

    (C4) THE SHARPENED, NOW-PINNED PREDICTION FOR THE WALK. Taking the mirror's
    v_2(D) = 2 for M-383 together with C2 forces (v_2(f), v_2(d_K)) = (1, 2),
    hence v_2(f) = 1. The height of the 2-isogeny volcano of an ordinary isogeny
    class over F_p equals v_2(f) - this is the one EXTERNAL ingredient the record
    does not prove. Further, the number of F_p-rational 2-isogenies from a curve
    equals the number of rational order-2 subgroups, which is #E[2](F_p) - 1 and
    is 1 when chi(A^2 - 4) = -1 and 3 when chi(A^2 - 4) = +1; and the mirror's
    tables/complete.tsv reports that M-383 has EXACTLY 1 POINT OF ORDER 2, hence
    2-torsion rank 1, hence chi(A^2 - 4) = -1, hence M-383 IS ON THE FLOOR of its
    volcano. THEREFORE THE ASCENDING 2-ISOGENY WALK FROM M-383 HAS LENGTH
    EXACTLY 1. That is a single-valued, sharp, falsifiable prediction where the
    pre-mirror version of this record could only say "1 or 2". A walk of length
    0, or 2, or more refutes one of - the implementation, the external volcano
    correspondence, the mirror's D, the mirror's trace, or C1 - and the record
    pre-commits to eliminating them in that order.

    (C5) THE INDEPENDENT ROUTE TO f, AVAILABLE AT ZERO COST FROM PUBLISHED
    VALUES. Since t and D are both published exactly and t^2 - 4p = f^2 * d_K,
    the conductor is f = sqrt((t^2 - 4p) / D), an exact integer square root of a
    384-bit quantity - one big-integer operation, no factorization. THE WALK
    LENGTH MUST EQUAL v_2 OF THAT INTEGER. This gives the experiment a reference
    value computed from the mirror by a route entirely independent of the walk,
    and it also tests the mirror internally, since (t^2 - 4p)/D must be a perfect
    square and a non-square would prove one of the two published columns wrong.

  mechanism: >-
    THE TRACKED OBJECT is the VERTEX OF THE RATIONAL 2-ISOGENY GRAPH occupied by
    E_A, represented concretely by the coefficient of the codomain at each
    ascending step together with its rational 2-torsion rank. The object is a
    curve, not a number, and it is followed under a MAP BETWEEN CURVES rather
    than under arithmetic within one curve. That is what makes it a different
    object from anything else in this campaign.

    LOSSY-PROJECTION TEST (docs/inventor-protocol.md section 2), applied BEFORE
    any compute, which is the point of the test.
    WHAT IS DISCARDED. Everything that is not an isogeny-class invariant of the
    2-primary local structure - the base point, the odd part of the group, the
    j-invariant of the original curve once the walk moves, the entire ECDLP
    instance. A 383-bit curve collapses to an integer in {1, 2} plus a short
    list of neighbour coefficients.
    IS IT A CHANGE OF COORDINATES? No, decisively. The walk length is 1 or 2 by
    C2, so the object has at most one bit of content, while the fibre over each
    value contains an enormous number of curves - by Deuring-Hurwitz class-number
    weighting, on the order of sqrt(p) isomorphism classes per admissible trace,
    and many traces per volcano height. Nothing about A is recoverable.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS? Three operations, three
    deterministic answers. (i) F_p-ISOGENY OF ODD DEGREE preserves the trace,
    hence the conductor f, hence the volcano and its height; the vertex moves
    within the same volcano only if the odd isogeny is horizontal, and in all
    cases the HEIGHT propagates as a constant. (ii) QUADRATIC TWISTING sends t to
    -t, leaves t^2 - 4p unchanged, hence leaves f, d_K and the volcano height
    EXACTLY invariant - so C1 and C2 are twist-invariant statements and the twist
    inherits them for free, with no separate argument. This is a strictly
    stronger propagation than d052e6's signature enjoys, where twisting flips two
    of the three depth-0 symbols. (iii) F_p-ISOMORPHISM AND MODEL CHANGE leave
    everything invariant. THE RETAINED PART PROPAGATES DETERMINISTICALLY UNDER
    ALL THREE. PASSES.
    WHERE THE STRUCTURE DISSOLVES, AND IT IS MEASURED RATHER THAN ASSUMED. At
    the crater. The ascending walk is well defined and unique only while the
    current vertex is below the crater; on the crater the horizontal edges are
    not canonically ordered and the walk has no distinguished continuation. C4
    predicts, using the mirror, that this happens after exactly 1 step, so THE
    OBJECT'S SURVIVAL LENGTH IS PREDICTED IN ADVANCE TO A SINGLE VALUE AND IS THE
    PRIMARY MEASURED QUANTITY. A second dissolution is model-theoretic and is the
    reason the external ingredient below matters - the codomain of a rational
    2-isogeny need not admit a Montgomery model, so the walk may leave the
    Montgomery world before it leaves the volcano.

    THE EXTERNAL STRUCTURAL INGREDIENT, RETRIEVED THIS SESSION. Barbulescu,
    Robert and Sarkis, "Models of Kummer lines and Galois representations",
    IACR eprint 2025/543, states in its abstract that when an elliptic curve is
    viewed inside a 2-isogeny volcano, there is a criterion to say whether it has
    a given Kummer model based solely on its position in the volcano, and that
    with one rational 2-torsion point T there are exactly two types of model,
    symmetric and anti-symmetric with respect to T, recovering the Montgomery
    model and theta variants. THE MIRROR MAKES THIS TESTABLE HERE - the five
    Montgomery rows are exactly the five rows the mirror gives one point of order
    2 and two points of order 4, which is the "one rational 2-torsion point T"
    hypothesis of that abstract, and they are exactly the five rows with
    v_2(D) = 2. Whether that coincidence is the criterion's content or an
    artifact of the family's design constraints is a question this record poses
    and does not answer. Renes, IACR eprint 2017/1198, supplies efficient
    2-isogeny formulas between Montgomery curves via the action of (0,0) without
    square roots. Both abstracts were fetched and read in this session; neither
    full text was read, and no formula from either is asserted here.

    MIRROR-DEF-1 BITES THIS EXACT CURVE AND THE RECORD RESPECTS IT. The mirror's
    recorded defect is that the .txt renderings collapse empty table cells, and
    the CONFIRMED INSTANCE IS THE M-383 ROW of pages/rigid.html, whose comments
    cell is EMPTY while the adjacent Curve383187 row carries "p is largest prime
    smaller than 2^383; B=1; A > 2 is as small as possible." I read
    tables/rigid.tsv, which preserves empty cells by construction, and it shows
    M-383 with "fully rigid" and an EMPTY comments field. THIS RECORD THEREFORE
    ATTRIBUTES NO GENERATION RECIPE TO M-383. It is the one row of the four in
    this group with no published recipe, which is itself a finding and is used by
    IDEA-20260829-acd407.

    WHY THIS IS NOT IDEA-20260829-d052e6. d052e6's object is a chain of Legendre
    symbols inside ONE curve and its output is v_2(#E). This record's object is a
    sequence of CURVES and its output is v_2(f), the conductor valuation. The two
    quantities are logically independent - v_2(#E) is 3 for M-383 per the
    mirror's cofactor 2^3 while v_2(f) is 1 per C4, and no value of one
    determines the other - and they answer different diagnostics, the cofactor
    diagnostic and the "CM discriminant and conductor structure" diagnostic
    respectively. The only shared ingredient is d052e6's C1, which this record
    CITES AS A DEPENDENCY and does not re-derive.

    EXECUTION. Step 1, zero compute - write out the C1, C1b and C2 proofs;
    confirm p congruent to 5 modulo 8 by hand and by machine; run C3's twenty-row
    check against tables/disc.tsv; run C5's exact square root and read v_2(f) off
    it. Step 2, derive the rational 2-isogeny step symbolically for both kernel
    types - the kernel generated by (0,0), and the kernels generated by the roots
    of x^2 + Ax + 1 when they are rational - and record for each whether the
    codomain is Montgomery. Step 3, VALIDATE BY EXHAUSTION at toy scale - for
    several primes congruent to 5 modulo 8 near 2^13 to 2^15, enumerate EVERY
    admissible Montgomery A, compute t by brute force, verify v_2(t^2 - 4p) = 4
    for every single one, factor t^2 - 4p to obtain f and d_K exactly, and check
    the walk length against v_2(f). This validates C1 as a theorem, C2 as a
    theorem, and the external volcano correspondence as an empirical fact, in one
    pass. Step 4, apply the frozen walk to (p = 2^383 - 187, A = 2065150) and
    check its length against C5's reference value. Step 5, run the identical walk
    on Curve383187 over the SAME prime, and report the two side by side. Step 6,
    the twenty-row family sweep of C1, C1b and C3.

  novelty_status: unverified
  novelty_rationale: >-
    Isogeny volcanoes and the identity between volcano height and the
    l-adic valuation of the conductor are `known` results, due to Kohel and to
    Fouquet and Morain, and the Kummer-model criterion is a 2025 published
    preprint whose abstract was retrieved here. The C1, C1b and C2 forcing
    arguments are elementary and are almost certainly `known` to specialists as
    folklore, though no source stating them for Montgomery curves over
    p congruent to 5 modulo 8 was located. THE LABEL REMAINS `unverified`, AND
    THE REASON HAS CHANGED. It is no longer that the SafeCurves data could not be
    retrieved - the in-repository mirror was read directly this session and
    supplies the traces and the factored discriminants that make C3 and C5
    possible. It is that only ABSTRACTS of the two relevant preprints were read,
    that no volcano-theory source was opened, and that the mirror contains
    SafeCurves' own pages and specs but no mathematical literature. The novelty
    of the argument against the mathematical literature is therefore still
    unchecked, which is precisely what `unverified` records.
