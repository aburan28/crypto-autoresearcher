# IDEA-20261004-596d0a
# Multiplication-degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261004-596d0a
  question_id: RQ-JINV-8fc13a
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    Multiplication by 20 has degree 400 and multiplication by 19 has degree 361
  class: measurement
  claim: >-
    Multiplication by 20 has degree 400. Multiplication by 19 has
    degree 361. Four hundred exceeds three hundred sixty-one by 39.
    The product of the two degrees is 144400. Their sum is 761. The
    gap is a map degree, not an ECDLP exponent and not the degree
    pair 361 and 324.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Twenty squared is 400. Nineteen squared is 361. Two maps
    of degree 361 have gap 0 and product 130321. No point is mapped.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question treats End(E) as a ring and asks for any
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-IC-889857
