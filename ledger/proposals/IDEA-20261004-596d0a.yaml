      claim: >-
        A first-fall-degree dispute is a different object from these
        two multiplication degrees.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The multipliers 20 and 19 are frozen before the squares are taken.
    - No point is mapped.
  proof_search_map:
    bottleneck: The degree gap 39.
    baseline_embedding:
      parameter_slice: The degrees 400 and 361.
      reproduction_check: >-
        Two readers must agree that 20 squared is 400 and that 19
