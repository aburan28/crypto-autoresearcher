idea:
  id: IDEA-20261006-9475a4
  question_id: RQ-SDEG-001
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: Degree in x2 of a two-target S_3 gcd on y^2 = x^3 + x + 2 at p = 37 versus p = 17
  class: measurement
  claim: >-
    Representation R1, attack stage relation decomposition, as an elimination-degree
    proxy rather than a full Gröbner solving degree. On E_p: y^2 = x^3 + x + 2
    over F_p for p in {17, 37}, let a_p be the x-coordinate of the affine point
    with smallest x and smallest y in {0, ..., (p-1)/2}, and let b_p be the
    x-coordinate of the affine point with the next smallest x and smallest such y.
    Let d(p) be the degree in x2 of the monic gcd, computed in F_p[x1][x2], of
    the two primitive polynomials S_3(x1, x2, a_p) and S_3(x1, x2, b_p). The
    claim is d(37) >= d(17) + 1. The negative outcome is d(37) <= d(17). No
    asymptotic advantage over rho is claimed.
  mechanism: >-
    OBJECT FRAME. Representation R1: the two x-coordinates a_p and b_p.
    Operation set Sigma: the Euclidean algorithm in the variable x2 on the
    pair of specialized summation polynomials. Sigma does not contain
    elliptic translation. Trichotomy: coordinate-dependent. The degree
    changes when a_p or b_p changes, and it is not a block system of a group
    acting on the points. LOSSY-PROJECTION TEST. d(p) discards the
    coefficients of the gcd. The Euclidean algorithm's only cost meter in
    this record is that degree, so the discard is compatible with Sigma.
    The gcd polynomial itself would retain those coefficients and is a
    different object. The projection is lossy because every monic polynomial
    of a given degree maps to the same integer. Branching bound: d(p) is an
    integer in {0, 1, 2}, since KR-IC-5a43e5 gives degree 2 in each variable
    of S_3, so b <= 3 and the retained information is at most log2(3) bits.
    The open number is d(37) - d(17), predicted >= 1. Families F1-F7 are not
    the lens. No factor base is proposed.
  novelty_status: speculative
  citations:
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: S_3 has degree 2 in each variable, so d(p) is an integer in {0, 1, 2} whenever S_3 is not the zero polynomial.
      verified_by: idea-generator, this session, via knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Naive Semaev index calculus over prime fields does not beat generic
        algorithms under the paper's statistical assumptions. A degree gap of
        1 between two primes does not remove that bound.
      verified_by: idea-generator, this session, via knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: Generic discrete logarithms cost Omega(sqrt(N)) group operations.
      verified_by: idea-generator, this session, via knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-6239aa
      provenance: internal
      claim: Parallel rho with distinguished points uses about sqrt(pi N / 2) iterations in total.
      verified_by: idea-generator, this session, via knowledge/frontiers/ecdlp/generic-rho/KR-RHO-6239aa.yaml
    - ref: KR-IC-fbdb61
      provenance: internal
      claim: >-
        Last-fall degree, solving degree, and degree of regularity are
        distinct. This record's gcd degree is none of those three.
      verified_by: idea-generator, this session, via knowledge/frontiers/ecdlp/index-calculus/KR-IC-fbdb61.yaml
  assumptions:
    - Both primes keep the curve nonsingular: 4 + 27*4 = 112, 112 mod 17 = 10, and 112 mod 37 = 1.
    - Each prime has at least two distinct affine x-coordinates. If not, the cell is unmeasured.
    - Neither specialized S_3 is the zero polynomial. A zero polynomial makes the gcd undefined and the cell unmeasured.
    - d(p) is a proxy. It is not the Gröbner solving degree of a multi-polynomial decomposition system.
  predictions:
    - metric: gcd_degree_in_x2
      direction: higher
      minimum_effect: d(37) >= d(17) + 1
  minimal_test:
    design: >-
      For p = 17 and p = 37, enumerate affine points of y^2 = x^3 + x + 2,
      select a_p and b_p, build the two S_3 polynomials in F_p[x1, x2], make
      them primitive in F_p[x1][x2], and run the Euclidean algorithm in x2.
      Record the degree of the monic gcd.
    controls:
      - The repeated-target gcd of S_3(x1, x2, a_p) with itself must have degree equal to the degree of that polynomial in x2. A result of 0 means the Euclidean algorithm is wrong and the cell is unmeasured.
      - Two random degree-at-most-2 polynomials in F_p[x2], coefficients from seed 20261006, one pair at each prime. Their gcd degrees are the HA-1 null, not a second curve.
      - The nearby object where the conclusion that degree grows with p is not expected is the pair of identical polynomials above. Growth is scored only when a_p differs from b_p.
    required_metrics:
      - d(17)
      - d(37)
      - d(37) - d(17)
      - degree in x2 of each of the four specialized polynomials before the gcd
  falsification_conditions:
    - d(37) <= d(17). No increase is the negative outcome. Both zero, both 1, and both 2 all falsify the growth claim.
    - The repeated-target control fails to recover the input degree. That falsifies the implementation.
  confounders:
    - The two x-coordinates are the smallest ones, so a leading coefficient in x2 can vanish for that specialisation and drop the degree for a reason that is not a scaling law.
    - Two primes do not determine a slope against log p. A difference of 1 can be a single specialisation accident.
    - Working in F_p[x1][x2] rather than F_p(x1)[x2] can drop degree by a content polynomial in x1. The protocol requires primitive inputs so that drop is removed before the score.
  interpretation_limits:
    - A positive gap shows only that this univariate elimination degree depends on p for this pair. It does not show that Gröbner solving degree grows with p.
    - A negative result shows this proxy is flat on this pair. It does not show that solving degree is independent of p.
    - Even a degree in {0, 1, 2} that increases by 1 does not change the generic exponent 1/2. Prime-field decomposition cost stays under KR-IC-5931ee's assumptions.
    - No factor base and no escape from KN-OPEN-020.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        For primes p >= 17, the degree d(p) in x2 of the gcd of the two
        primitive specialisations S_3(x1, x2, a) and S_3(x1, x2, b) at two
        distinct rational x-coordinates equals 0 with probability 1 - O(1/p),
        imitating coprimality of two random degree-2 polynomials, and therefore
        d(37) = d(17) = 0 is the null. The claim is the alternative d(37) >= d(17) + 1.
      rigorous_support: >-
        Degree of S_3 in each variable is 2 (KR-IC-5a43e5), so d(p) is in
        {0, 1, 2}. Over a finite field, the proportion of coprime pairs among
        monic polynomials of fixed degree is given by an explicit product
        1 - 1/p + O(1/p^2) for degree 1 and stays 1 - O(1/p) at degree 2.
        That product is the proved comparison. The imitation is that these
        two S_3 specialisations behave like that random pair. They are not
        random: they share the curve coefficients A = 1, B = 2.
      validation_plan: >-
        The scored cell is only p = 17 and p = 37. The validation extension,
        not required to falsify the claim, is the first 10 primes p > 3 at
        which 112 is nonzero mod p and the curve has two distinct affine
        x-coordinates. Compare the fraction with d(p) >= 1 to the coprime-pair
        tail O(1/p). Tail check: at most 2 of those 10 primes have d(p) >= 1,
        which is the O(1/p) prediction at this size, or else the random-pair
        imitation is rejected. Sampled parameters: degree cap 2, two targets
        per prime, primes at least 17. Transfer assumption: the first two
        x-coordinates represent a typical pair of rational x-coordinates.
        They may not.
  target_complexity:
    time_exponent: >-
      Unchanged generic exponent p^{1/2}. A gcd-degree increase of 1 between
      p = 17 and p = 37 is not an exponent. If this proxy grew like log p it
      would still be a polylog factor on an elimination, not a move of 1/2.
    memory_exponent: >-
      O(1) coefficients of two degree-2 polynomials. Memory exponent 0 in p
      for this proxy. Rho with distinguished points remains the memory
      baseline at p^{o(1)} stored points when the density is p^{-o(1)}.
    best_known: >-
      Pollard rho, Omega(sqrt(N)) and about sqrt(pi N / 2) iterations
      (KR-RHO-13bf67, KR-RHO-6239aa). Prime-field Semaev decomposition does
      not beat that under KR-IC-5931ee.
    hidden_overhead: >-
      No o(1) term is improved. The Euclidean algorithm on degree 2 hides
      only a constant number of operations in F_p.
    tradeoff_note: >-
      This proxy does not store a list and has no time-memory curve.
      Parallelism is irrelevant at two primes. The record is a building block
      for a later decomposition-cost slope, and its priority is low because
      the best case here is still a constant in {0, 1, 2}.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
