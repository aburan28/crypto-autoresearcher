idea:
  id: IDEA-20260815-f81c17
  question_id: RQ-ECDLP-002
  added: '2026-08-15'
  title: >-
    BSGS IS THE OTHER INCUMBENT AND IT IS MEMORY-BOUND WHERE RHO IS NOT:
    measure the crossover group size at which BSGS stops being competitive
    under real memory limits
  class: measurement

  claim: >-
    Every comparison in this campaign names rho and BSGS as the baselines.
    BSGS is faster in group operations but needs sqrt(N) storage, so under a
    fixed memory budget it stops being usable at a determinable group size
    while rho continues. That crossover is the honest statement of when
    there are two baselines and when there is one.

  mechanism: >-
    Implement BSGS with a real memory ceiling. Sweep group size until the
    table no longer fits, recording operations and wall clock against rho on
    the same instances. Report the crossover under several memory budgets.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Grep 'BSGS' , 'baby-step', 'memory ceiling'; check whether any
      record measures BSGS's memory-bound crossover.
    results: >-
      BSGS is cited as a baseline throughout; no record measures where its
      memory requirement makes it unusable relative to rho.
    verdict: >-
      ADAPTATION. BSGS's memory requirement is textbook; the contribution
      is locating the crossover under stated budgets on this program's
      baseline.

  object_first_candidate:
    tracked_object: >-
      THE GROUP SIZE at which BSGS ceases to be usable under a fixed
      memory budget.
    lossiness: >-
      Citing BSGS as a baseline without its memory ceiling projects away
      the constraint that decides whether it is a baseline at all.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives at toy sizes; the crossover under realistic budgets sits
      far above the measurable range and is reported as an extrapolation
      with its basis stated.

  null_object_control: >-
    NULL 1 -- unbounded memory, where BSGS must beat rho in operations at
    every size; failure means the implementation is wrong. NULL 2 -- memory
    so tight that BSGS cannot run at all, where only rho remains, bounding
    the sweep.

  discriminated_from:
    - >-
        The measured-rho-baseline record in this series, which supplies
        the comparison side and must share instances.
    - >-
        Time-memory tradeoff literature, which describes the general
        shape; this measures the specific crossover on this program's
        implementations.

  assumptions:
    - >-
        A real memory ceiling is enforceable in the implementation rather
        than simulated by accounting.
    - >-
        The crossover under realistic budgets can be extrapolated from
        measured points, which spans a large gap and is the record's
        stated weakness.

  predictions:
    - metric: >-
        unbounded-memory null
      direction: different
      minimum_effect: >-
        FORCED: BSGS wins on operations at every size.
    - metric: >-
        tight-memory null
      direction: different
      minimum_effect: >-
        FORCED: BSGS cannot run; only rho remains.
    - metric: >-
        crossover group size per memory budget
      direction: different
      minimum_effect: >-
        The measurement at reachable sizes, with the extrapolation to
        realistic budgets stated as such.

  minimal_test:
    design: >-
      Four group sizes, three memory budgets, both nulls, shared instances
      with rho.
    controls:
      - >-
          Unbounded-memory and tight-memory nulls.
      - >-
          Shared instances with the rho baseline.
      - >-
          Memory ceiling enforced, not simulated.
      - >-
          Extrapolation to realistic budgets stated with its basis.
    required_metrics:
      - >-
          Operations, wall clock and peak memory per (size, budget).
      - >-
          Crossover per budget at reachable sizes.
      - >-
          Extrapolation with stated basis and range.

  falsification_conditions:
    - >-
        A null misbehaves. Implementation wrong.
    - >-
        BSGS remains competitive across all reachable sizes and budgets.
        The crossover is beyond the measurable range and the record
        reports a bound rather than a crossover.
    - >-
        The crossover sits within the campaign's working sizes.
        Comparisons at those sizes have effectively one baseline, not two,
        which changes how they should be reported.

  confounders:
    - >-
        EXTRAPOLATION REACH: the crossover under realistic budgets is far
        above measurable sizes, so the extrapolation spans a large gap and
        its form dominates.
    - >-
        IMPLEMENTATION MEMORY OVERHEAD: table representation choices
        change the effective ceiling substantially, so the representation
        must be stated.

  interpretation_limits:
    - >-
        Measures a textbook tradeoff on this program's implementations;
        proposes nothing new.
    - >-
        Scoped to the tested sizes, budgets and table representation.
    - >-
        The extrapolated crossover is explicitly an extrapolation and not
        a measurement.

  heuristic_assumptions:
    - id: HEUR-BSGS-1
      statement: >-
        BSGS's memory requirement grows as sqrt(N) with a
        representation-dependent constant that is stable across the
        tested size range.
      rigorous_support: >-
        Rigorous ingredient: the baby-step table holds sqrt(N) entries
        by construction, which is exact. THE GAP: the per-entry cost
        depends on the representation and on hash-table load factors,
        which can change with size and can be optimised in ways that
        shift the crossover by a constant that matters exactly where the
        crossover sits.
      falsification_condition: >-
        Measured per-entry memory cost varying materially across the
        tested sizes.
      validation_plan: >-
        SAMPLE: >= 4 sizes, peak memory recorded per run. COMPARISON:
        measured memory against sqrt(N) times the fitted per-entry cost.
        TAIL CHECK: the largest size, where load factors bite. TRANSFER:
        stated and unjustified beyond the tested range.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is BSGS and rho solves across sizes and
      budgets.
    memory_exponent: >-
      The baby-step table, which is the quantity under study.
    best_known: >-
      Incumbents are BSGS and rho themselves, measured here under memory
      constraint and not improved.
    hidden_overhead: >-
      Table representation choices can shift the effective ceiling by a
      large constant, which is why the representation is reported.
    tradeoff_note: >-
      More memory keeps BSGS competitive to larger sizes; the crossover is
      where the campaign's second baseline disappears.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As algorithms: dominated by the textbook
    analyses. As a measured memory-bound crossover on this program's
    baseline: none exists. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: the group size at which BSGS
    ceases to be usable under stated memory budgets, measured on shared
    instances against rho, so the campaign knows when it has two baselines
    and when it has one.

  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.95 that BSGS and rho are both implementable and the nulls behave. 0.8
    that a crossover is measurable at toy sizes under tight budgets. 0.3
    that the extrapolation to realistic budgets is defensible enough to
    quote, which is the record's weakest part.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
