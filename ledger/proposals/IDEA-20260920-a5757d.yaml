idea:
  id: IDEA-20260920-a5757d
  id_allocation_provenance: >-
    Minted by the top-level session with `python3 tools/allocate_id.py --next
    idea --date 20260920` and confirmed free with `--check` on 2026-09-20.
    Not derived by scanning state. Authored by the idea-generator subagent
    dispatched against RQ-ECDLP-bc7a54; filed unmodified except for this
    identifier block.
  proposed_by: idea-generator
  proposed_at: '2026-09-20'
  status: proposed
  question_id: RQ-ECDLP-bc7a54
  added: '2026-09-20'
  title: >-
    THE BRANCHING WINDOW b < sqrt(M): the note's Route-3 ceiling is FALSE as
    stated (Wagner's k-tree runs on modular k-SUM in Z_N, so prime order
    forbids nothing), the correct condition on a coordinate projection is a
    one-step additive branching bound b < sqrt(M) rather than a homomorphism,
    and the constant-b end of that window is closed by Freiman/Green-Ruzsa
    rectification, which turns section 7's duality into a THEOREM over the
    bounded-branching class and leaves the window omega(1) <= b < sqrt(M)
    as the named remaining open class
  class: mechanism

  claim: >-
    (A) THE REBUTTAL. docs/n13-ecdlp-hint-family.md section 8 Route 3 argues:
    "Wagner's k-tree attains 2^{b/3} on 4-sums only because b-bit strings admit
    a HOMOMORPHIC projection onto their low b/3 bits... <g> has prime order n,
    so every group homomorphism onto a group of order < n is trivial. There is
    no partial match to merge on." THIS IS FALSE AS AN ARGUMENT. Wagner's
    algorithm is standard for the modular k-SUM problem in Z_N for arbitrary N
    including primes (citations below). The low-k-bits map Z/N -> {0..2^k-1}
    taken on integer representatives in [0,N) is NOT a homomorphism, and that
    is irrelevant: it is a SET-VALUED propagation rule with branching EXACTLY
    2 -- low(a+b mod N) is determined by low(a), low(b) up to the single
    correction of whether a+b >= N (one subtraction of N). A merge needs a
    bounded-branching propagation rule, not a homomorphism. Route 3's ceiling
    therefore does not hold, and the theorem it invokes (prime order kills
    homomorphisms; IDEA-20260806-c5d183, KN-FIND-ffe1df Theorem C) is a
    statement about b = 1 only.

    (B) WHY THE CORPUS'S STANDING CLASS-II DISMISSAL ALSO DOES NOT BIND.
    IDEA-20260806-c5d183 dismisses branching objects by survival depth: a
    b-branching object carries information for at most log(budget)/log(b)
    steps. A 4-list merge tree has depth EXACTLY 2. With b = 2 the fibre after
    the whole computation has size 4. Survival depth is not a constraint on a
    bounded-depth merge; it is a constraint on a long walk. That distinction is
    not drawn anywhere in the committed corpus and it is what reopens the cell.

    (C) THE REPLACEMENT CONDITION, DERIVED, WITH ITS EXPONENT. Let sigma: <g>
    -> S be computable from affine coordinates, |S| = M, fibres A_1..A_M. Say
    sigma has ONE-STEP ADDITIVE BRANCHING b if for every i,j the sumset
    A_i + A_j meets at most b fibres and the index set is computable in O(1)
    from (i,j). Cost model M1 (four lists L_1..L_4 of known-log elements of
    size l each; level-1 merge on a fixed target value of sigma; level-2
    birthday on the residual n/M elements):
        list build          l
        level-1 candidate scan   l^2 b / M      (true survivors l^2/M)
        level-2 sort/lookup      l^2 / M
        success needs (l^2/M)^2 >= n/M, i.e. l = (nM)^{1/4}
        T = max( (nM)^{1/4},  b (n/M)^{1/2} ),  memory = same max
    Optimising over M gives M* = b^{4/3} n^{1/3} and T = b^{1/3} n^{1/3}.
    THE BEAT-RHO CONDITION IS EXACTLY  b < sqrt(M)  (together with M < n):
    (nM)^{1/4} < n^{1/2} iff M < n, and b(n/M)^{1/2} < n^{1/2} iff b < M^{1/2}.
    SANITY CHECK THAT THE MODEL IS NOT VACUOUS: an information-free projection
    has b = M, and substituting b = M gives T = (nM)^{1/2} >= n^{1/2},
    i.e. never better than rho. The model degrades correctly.
    THIS IS THE CONDITION RQ-ECDLP-160d89's decision_target asks for by name
    ("name the first condition not yet supplied by any coordinate projection").
    NO ALGORITHM IS CLAIMED HERE AND THE FOUR-LIST CONSTRUCTION IS NOT
    PROPOSED: RQ-ECDLP-160d89 owns it. M1 is carried only to convert b into an
    exponent so that the obstruction below has a quantitative target.

    (D) THE CLOSURE OF THE CONSTANT-b END, WHICH IS THE ACTUAL DELIVERABLE.
    If sigma has branching b then in particular |A_i + A_i| <= b |A_i| for
    every i: every fibre has doubling constant at most b. For b = O(1) and
    |A_i| = n/M with M -> infinity, Freiman-type structure theory in Z/n
    (n prime) applies through a rectification threshold: a set of small
    doubling and small density in Z/n is contained in an arithmetic
    progression of length O_b(|A_i|). If every fibre is an AP and the fibres
    partition Z/n compatibly with addition up to b classes, the common
    difference is forced to be shared, so after rescaling by that difference
    sigma is -- up to a bounded correction -- the COARSE-INTERVAL-OF-THE-
    DISCRETE-LOG map. That map is not evaluable from coordinates unless the
    ECDLP is easy, and the implication is not a soft one: an oracle returning
    the interval of log_g Q to within n/M, evaluable from coordinates, yields
    log_g Q in ceil(log n / log M) oracle calls by the self-reduction
    Q -> (Q g^{-t n/M})^{M} (Lemma L5 below), i.e. POLYLOG TIME, a total break.
    So over the bounded-branching class the recognizable/invertible duality is
    not folklore: RECOGNIZABLE AT BOUNDED BRANCHING IMPLIES AS HARD AS
    INVERTING. That is the "is the duality itself provable" half of
    RQ-ECDLP-bc7a54, answered affirmatively over a stated class.

    (E) WHAT REMAINS OPEN, STATED AS A CLASS AND NOT AS A RESIDUE. Rectification
    needs the doubling constant bounded; Green-Ruzsa-type rectification in Z/n
    degrades as the doubling constant grows and gives nothing once b = n^{eps}.
    The surviving window is therefore  omega(1) <= b < sqrt(M)  , and it is not
    a sliver: at b = n^{0.05} and M = M* = n^{1/3 + 0.067}, cost model M1 gives
    T = n^{0.35}, comfortably sub-rho. A coordinate projection with polynomially
    growing but sub-sqrt(M) branching is not excluded by anything this program
    or this record holds. THAT IS THE FORWARD GUIDANCE.

  mechanism: >-
    OBJECT FRAME. REPRESENTATION: the affine x-coordinate of Q in F_p together
    with any O(1) F_p-arithmetic postprocessing of it -- class R1 of
    RQ-ECDLP-623a32 (field representations of the coordinates). Neither the
    Kummer line nor a degree-d function on E is used, so the model-lever-1
    closure of RQ-ECDLP-623a32 is not touched. The ATTACK STAGE whose charged
    cost the representation claims to change is COLLISION STRUCTURE: the cost
    of joining two lists on a partial key, not factor-base membership and not
    linear algebra.
    OPERATION SET SIGMA: pair addition on <g>, USED AT BOUNDED DEPTH -- the
    object must survive exactly two merge levels, not an n^{1/2}-step walk.
    Sigma contains the full translation action, so per the constraint block
    THIS IS A BRANCHING OBJECT AND IS DECLARED AS SUCH.
    TRICHOTOMY (IDEA-20260806-c5d183): CLASS II, BRANCHING. One-line reason:
    T_h is set-valued with |T_h| <= b > 1; the b = 1 cell is empty by that
    record's theorem and this record does not dispute it, it relocates the
    question to b > 1 at bounded depth.
    LOSSY-PROJECTION TEST AGAINST SIGMA. DISCARDED: log(n/M) bits -- everything
    about Q except which of M fibres it lies in. COMPATIBLE WITH SIGMA: the
    discard is compatible up to a STATED BRANCHING BOUND b, which is the only
    form of compatibility available on a prime-order group (a block system of
    <Sigma> would require b = 1 and is empty by c5d183 / KN-FIND-ffe1df
    Theorem C). LOSSY IN THE REPRESENTATION ACTUALLY USED: yes -- x(Q) does not
    determine Q (the sign of y is lost) and sigma(Q) does not determine x(Q)
    for M < p; nothing is recoverable, so this is not the (Delta, Pi) failure of
    inventor-protocol section 2.
    PRICED OPEN NUMBER: this is a branching object, so the priced number is the
    PAIR (L, b) of IDEA-20260802-002 -- L = log_2(n/M) bits discarded, b the
    measured one-step additive branching -- and the record's whole content is
    that the decision threshold on b is sqrt(M), a number nobody has written
    down. Measurement protocol against identity, random-label and
    generic-group (relabelled Z/nZ) controls is in minimal_test.
    OFF-LIMITS COMPONENTS USED, NAMED: F1 (walk-collision) is used as the
    level-2 birthday step only; F2 is NOT used and no factor base appears.
    WHAT IS ADDED beyond F1: the join key, which F1 does not have.

  novelty_status: unverified

