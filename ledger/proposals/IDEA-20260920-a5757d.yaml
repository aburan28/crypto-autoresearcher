  assumptions:
    - >-
      n is prime. Load-bearing everywhere: Cauchy-Davenport, the rectification
      tools, and the c5d183 rigidity all fail for composite n, which is the
      built-in nearby-object control.
    - >-
      Cost model M1 charges one group operation per candidate verified and
      per list element, and charges sorting at O(1) per element. It ignores the
      cost of EVALUATING sigma, which is charged separately as c per evaluation
      and multiplies T by c. A sigma costing c = n^{eps} eats the window.
    - >-
      Component used from an off-limits family: F1 walk-collision, as the
      level-2 birthday only. No factor base is introduced, so KN-OPEN-020 is
      not engaged (see interpretation_limits).
    - >-
      The branching definition requires the index set of A_i + A_j to be
      COMPUTABLE in O(1) from (i,j), not merely small. A small-but-unindexable
      branching set is useless and the measurement must separate the two.

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the theorem: passing from "every fibre is
      contained in a short AP" (per-fibre Freiman) to "all fibres are APs with a
      COMMON difference, so sigma is a coarse interval of the log". Vosper
      supplies a common difference only in the equality case b = 1. For b >= 2
      the common-difference step needs a 3k-4-type statement for DISTINCT
      summands (Bilu-Lev-Ruzsa / Grynkiewicz lineage) plus a compatibility
      argument across the M fibres. THIS IS THE RECORD'S REAL MATHEMATICAL DEBT
      AND IT IS NAMED, NOT GLOSSED.
    baseline_embedding:
      parameter_slice: >-
        b = 1. The claim must reduce EXACTLY to KN-FIND-ffe1df Theorem C /
        IDEA-20260806-c5d183: at b = 1 the conclusion must be "sigma is constant
        or injective", strictly stronger than "sigma is a coarse interval",
        because at b = 1 even the interval partition fails (Cauchy-Davenport,
        IDEA-20260815-f558e4 (C)). A derivation that does NOT recover the
        stronger b = 1 conclusion has mis-stated the branching definition.
        Second slice: composite n = ab with sigma = reduction mod a, where
        b = 1 and sigma IS lossy and deterministic -- the derivation must fail
        there and exhibit why.
      reproduction_check: >-
        Frozen symbolic fixture plus a toy fixture: on Z/n with n prime and
        sigma the interval partition into M parts, the measured branching must
        be EXACTLY 2 (an interval plus an interval is an interval of twice the
        length, meeting at most 2 fibres of the interval partition when the
        fibres are the same intervals -- the exact value must be recomputed and
        pinned, not assumed). On Z/(ab) with sigma = reduction mod a the
        measured branching must be EXACTLY 1. Both are exact integers and
        neither may be accepted at floating tolerance.
    observation_collision:
      observable: >-
        The pair (M, b) = (image size, maximum one-step additive branching) of a
        projection, together with the per-pair branching distribution.
      distinct_preimage_search: >-
        THE COLLISION IS REAL AND IS STATED. The DL-interval partition and a
        rescaled DL-interval partition (fibres = intervals of d*log for any
        unit d) share (M, b) exactly, and so does any partition Freiman-
        isomorphic to an interval partition. The observable therefore CANNOT
        distinguish members of the rectified class -- which is harmless,
        because the closure's conclusion is about the whole class. What the
        observable MUST NOT be used for: asserting that two projections with
        equal (M, b) are equally useful. A collision on the LOW-b side between a
        coordinate-computable sigma and an interval partition would be the
        record's positive outcome, not a falsifier.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the scalar propagation rate q_strict of IDEA-20260815-f558e4
          and the correlation q_maj by the LIST-VALUED propagation rule: the
          full map (i,j) -> {m : (A_i + A_j) meets A_m}, retained as a set
          rather than collapsed to a best guess. This is strictly more state
          than either incumbent notion and it is the state a merge consumes.
        predicted_gain: >-
          Converts an unquantified "no partial match exists" into the exact
          threshold b < sqrt(M), and converts the closure from "the extremal
          object is uncomputable" (a statement about extremes) into "every
          bounded-branching object is uncomputable" (a statement about a class).
      - transform: representation_reduction
        proposed_object: >-
          Move from "sigma propagates" to "every fibre of sigma has doubling at
          most b", where the hypothesis becomes an exact inequality on sumset
          cardinality and the whole of Freiman-Ruzsa structure theory applies.
          ENCODING: partition -> family of small-doubling sets, exact.
          COMPLETENESS: every branching projection yields such a family.
          SOUNDNESS: the converse fails (a family of small-doubling sets need
          not be a branching partition) and the closure only needs the forward
          direction. TRANSFER: to E(F_p) by the group isomorphism to Z/n, which
          is non-constructive but needs only to exist. COST LOSS: none.
        predicted_gain: >-
          Closes b = O(1) unconditionally in the asymptotic regime, which is
          the entire small-b end of the window.
      - transform: observable_fiber
        proposed_object: >-
          Hold (M, b) = (M, 1) fixed and vary the group order: prime versus
          composite. The distinguishing intrinsic invariant is the divisor
          lattice of n. This is the nearby-object control and is why the record
          is a statement about prime order.
        predicted_gain: "Shows the closure is not vacuous; the object exists on the composite side."
    quantifier_order: >-
      FOR ALL primes n, FOR ALL M with 1 < M < n, FOR ALL b <= B_0 (an absolute
      constant supplied by the rectification threshold), FOR ALL partitions
      sigma of Z/n into M fibres of equal size: IF for all i,j the sumset
      A_i + A_j meets at most b fibres, THEN THERE EXISTS a unit d in (Z/n)^*
      and a bounded correction such that sigma agrees, off a set of density
      o(1), with the coarse-interval map k -> floor(M * (d k mod n) / n).
      THE WITNESS d IS ALLOWED TO DEPEND ON sigma AND ON n. It is NOT allowed
      to depend on the point being evaluated -- that is the escape the order
      exposes, and a "sigma" whose d varies per point is not a partition of the
      stated shape and is outside the quantifier. B_0 is an absolute constant,
      NOT a function of n; a b growing with n is outside the theorem, and that
      is exactly the open window (E).
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "for prime n, every equal-fibre partition of <g> whose one-step
        additive branching is bounded by an absolute constant is a rescaled
        coarse-interval partition of the discrete log up to a bounded
        correction, hence its evaluation from coordinates would yield a polylog
        ECDLP algorithm". IT CANNOT CERTIFY: that no coordinate projection with
        growing b < sqrt(M) exists; that the ECDLP is hard; that RQ-ECDLP-160d89
        is closed; or any statement about unequal-fibre partitions, about
        projections carrying auxiliary state, or about objects whose propagation
        is defined on pairs rather than on single elements.
      nearby_object_control: >-
        Z/(ab) with sigma = reduction mod a: branching EXACTLY 1, sigma lossy,
        sigma coordinate-computable if the factorisation is known, and the
        desired conclusion FAILS (sigma is not an interval map of the log and
        gives Pohlig-Hellman rather than a break). A derivation that cannot
        distinguish Z/(ab) from Z/n has not identified primality as the
        load-bearing structure. SECOND CONTROL, SHARPER: the subgroup-coset
        partition of Z/n does not exist for prime n, and an instrument that
        reports one is buggy.
    proof_obligations:
      - claim: "branching b implies every fibre has doubling constant <= b"
        responsibility: correctness
      - claim: "rectification threshold: fibres of size n/M with M -> infinity are below the Green-Ruzsa density bound for constant b"
        responsibility: size
      - claim: "all fibres share a common difference (the named bottleneck)"
        responsibility: strictness
      - claim: "L5: an interval-of-log oracle at granularity n/M yields log in ceil(log n / log M) calls via Q -> (Q g^{-t n/M})^M, and the unit d is recovered from O(1) known-log samples"
        responsibility: correctness
      - claim: "cost model M1: T = max((nM)^{1/4}, b(n/M)^{1/2}); beats rho iff b < sqrt(M) and M < n"
        responsibility: runtime
      - claim: "M1 degrades to T >= n^{1/2} at b = M"
        responsibility: baseline
      - claim: "b = 1 slice recovers the strictly stronger constant-or-injective conclusion"
        responsibility: baseline
    not_applicable_reason: null

  predictions:
    - metric: >-
        Measured maximum one-step additive branching b(sigma) = max over (i,j)
        of #{m : (A_i + A_j) meets A_m}, for each pre-registered coordinate
        projection at image size M, on prime-order subgroups
      direction: higher
      minimum_effect: >-
        PREDICTED b = M (total loss) for EVERY coordinate-derived sigma, at
        every tested prime order, i.e. the measured b/sqrt(M) ratio is
        >= sqrt(M) and grows with M. ANY sigma measuring b < sqrt(M) is the
        record's positive outcome and routes immediately to RQ-ECDLP-160d89
        with the exponent b^{1/3} n^{1/3} attached. The minimum effect that
        counts as positive is a single (sigma, M) cell with b < sqrt(M) that
        survives the null and the decay test.
    - metric: b(sigma) for the planted DL-interval partition at the same M
      direction: lower
      minimum_effect: >-
        FORCED SMALL AND M-INDEPENDENT (predicted exactly 2 for the interval
        partition of Z/n into M equal intervals; the exact integer must be
        pinned by the fixture, not assumed). If the instrument reports b = M
        for the interval partition it has no power and every other reading in
        the run is void.
    - metric: b(sigma) for a random balanced partition at matched (n, M)
      direction: higher
      minimum_effect: >-
        FORCED b = M within occupancy fluctuation, since for M < sqrt(n) the
        sumset of two random fibres covers Z/n. This is the null every
        coordinate reading is compared against, and reporting a coordinate
        sigma's b without the matched random-partition distribution at the same
        (n, M) is the single most likely false positive here.
    - metric: >-
        b(sigma) on the composite-order nearby object Z/(ab) with
        sigma = reduction mod a
      direction: lower
      minimum_effect: "FORCED EXACTLY 1. A reading above 1 is an instrument bug and voids the run."
    - metric: >-
        Recovery of the known beta-orbit constant on a j = 0 curve: the density
        gain of the automorphism-quotiented useful set
      direction: higher
      minimum_effect: >-
        FORCED FACTOR 3 (and factor 2 for the x(-Q) = x(Q) folding), recovered
        BEFORE any hint-family claim. Per the RQ constraint block, an instrument
        that does not reproduce this known constant is void as a hint-family
        detector.
    - metric: >-
        Rectification audit: for each pre-registered sigma with measured
        b <= 4, the measured maximum fibre doubling |A_i + A_i| / |A_i| and the
        length of the shortest AP containing A_i
      direction: lower
      minimum_effect: >-
        FORCED CONSISTENT WITH (D): any sigma with small measured doubling must
        have its fibres inside APs of length O(b |A_i|). A sigma with small
        doubling whose fibres are NOT near-APs at prime n refutes the
        rectification step at the tested scale and is the most valuable
        possible outcome of the toy stage.

  minimal_test:
    design: >-
      STAGE 0 (PAPER, ZERO COMPUTE, AND IT IS THE DELIVERABLE). Write (A)-(E)
      with the common-difference bottleneck carried explicitly; state the exact
      rectification threshold from a cited bound rather than gestured at; write
      L5 with the d-recovery lemma; write M1 with every charge itemised
      including the per-evaluation cost c of sigma. IF THE COMMON-DIFFERENCE
      STEP DOES NOT CLOSE, SAY SO AND STOP: the honest deliverable then is the
      rebuttal (A), the depth observation (B), the threshold (C), and the
      per-fibre doubling bound alone, which is still a strictly larger
      statement than anything committed.
      STAGE 1 (PURE PYTHON, MINUTES, NO CURVE ARITHMETIC). Group = Z/n, n prime
      in {101, 401, 1009, 4001, 16001}, M in {4, 8, 16, 32}. For the interval
      partition, >= 200 random balanced partitions, and locally-optimised
      partitions, compute b exactly over all M^2 fibre pairs by exhaustive
      sumset enumeration, plus the per-fibre doubling and the shortest
      containing AP. Repeat on Z/(ab) for (a,b) in {(7,11),(13,17),(31,37)}.
      Exact integer arithmetic throughout.
      STAGE 2 (TOY CURVES, PRIME-ORDER SUBGROUPS ONLY). n prime in a >= 6x
      range up to ~2^22 with exhaustive log tabulation used ONLY to build the
      fibre lists as subsets of Z/n -- NO sigma takes the log as an input.
      Pre-registered sigma family: x-coordinate interval buckets; x mod small
      primes; leading-zero count of x; Hamming weight of x; Legendre symbol
      words; y-parity-folded versions of each; and, as the mandated quotient,
      every one of the above evaluated on the (x(-Q) = x(Q))-folded and (on
      j = 0 / j = 1728 curves) beta-orbit-folded representative. Measure b, the
      per-fibre doubling, and b/sqrt(M), and fit b/M against n.
    controls:
      - >-
        IDENTITY AND CONSTANT CALIBRATION EDGE, RUN FIRST, ANSWER KNOWN FREE:
        sigma = identity must give b = 1 with M = n; sigma = constant must give
        b = 1 with M = 1. An instrument reporting otherwise is broken and no
        other cell may be read.
      - >-
        RANDOM-LABEL NULL at matched (n, M): >= 200 samples, full distribution
        reported, not the maximum alone. Every coordinate reading is an excess
        over this distribution, never over an idealised value.
      - >-
        GENERIC-GROUP NULL (MANDATORY PER THE RQ): a random relabelling of the
        same cyclic group -- literally a generic group -- with sigma applied to
        the label. Separates "sigma is cheap" from "sigma sees the curve".
      - >-
        COMPOSITE-ORDER POSITIVE CONTROL, WHICH IS THE ONE THAT MATTERS:
        Z/(ab), sigma = reduction mod a, forced b = 1 with 1 < M < n. An
        instrument that cannot exhibit the one object that provably exists has
        no power to assert absence at prime order.
      - >-
        PLANTED DL-INTERVAL POSITIVE at every (n, M): forced small,
        M-independent b. Detection is a gate, not a result.
      - >-
        BETA-ORBIT AND SIGN QUOTIENT APPLIED BEFORE ANY CLAIM, with the
        un-quotiented run reported alongside so the factor-3 and factor-2
        artifacts are visibly recovered rather than silently absorbed.
      - >-
        DECAY TEST IN n: b/M for coordinate sigma must be fitted across the
        >= 6x range of n. A ratio that does not move with n is the
        inventor-protocol section 3 artifact tell.
      - >-
        ARCHIVE CHECK, ZERO COMPUTE: record the exact sentences of
        IDEA-20260815-f558e4 (C)(D) and IDEA-20260806-c5d183 (B) Class II that
        this record extends, and the sentence of RQ-ECDLP-160d89's
        decision_target it answers. No status change to any of them is proposed.
    required_metrics:
      - "per (sigma, n, M): exact b, mean branching, full branching distribution over the M^2 fibre pairs"
      - "per (sigma, n, M): max and mean fibre doubling |A_i+A_i|/|A_i|; shortest containing AP length"
      - "b/sqrt(M) with an explicit PASS/FAIL against the < 1 threshold"
      - "matched random-partition distribution and generic-group-null distribution at every cell"
      - "forced values: identity (1, n), constant (1, 1), composite control (1, a), interval positive (small, M-independent)"
      - "fitted decay exponent of b/M against n with a confidence interval"
      - "recovered beta-orbit factor 3 and sign factor 2 on j = 0 / j = 1728 curves"
      - "artifact manifest with hashes and a from-scratch rebuild receipt"

  falsification_conditions:
    - >-
      Stage 1 reports b > 1 for reduction mod a on Z/(ab), or b != 1 for the
      identity or the constant. Instrument broken; all numbers void.
    - >-
      The planted DL-interval partition is not separated from the random null.
      The pipeline has no power as a hint-family detector and emits no numbers.
    - >-
      The beta-orbit factor 3 is not recovered on a j = 0 curve. Per the RQ
      constraint block the instrument is void for this question.
    - >-
      Stage 0 finds that the common-difference step does not close. The
      structure claim (D) is WITHDRAWN before any Stage 1 interpretation and
      the record reports (A), (B), (C) and the per-fibre doubling bound only,
      at that reduced strength, with the duality left unproved.
    - >-
      A coordinate-computable sigma is measured with b < sqrt(M) that survives
      the random-partition null, the generic-group null, the symmetry quotient
      and the decay test. THE CLOSURE IS FALSE, the window is populated, and
      the finding routes to RQ-ECDLP-160d89 with T = b^{1/3} n^{1/3} attached
      and its own cost table. This is the outcome that would matter most.
    - >-
      A partition with small measured doubling whose fibres are not contained
      in short APs at prime n. Rectification fails at the tested scale;
      (D) collapses and the record must say so.
    - >-
      Cost model M1 is shown to be wrong -- e.g. the level-1 scan cannot be
      indexed in O(1) so the true cost is l^2 rather than l^2 b / M. Then the
      threshold sqrt(M) is wrong and the whole quantitative frame must be
      restated; the qualitative rebuttal (A) survives unchanged.

  confounders:
    - >-
      COMPOSITE ORDER LEAKING IN. Toy curves rarely have prime group order;
      using the full group silently reintroduces coset partitions and would
      manufacture a spurious low-b reading that looks exactly like the positive
      outcome. Prime-order subgroups are enforced by the protocol, and
      IDEA-20260815-f558e4's own ideation check made precisely this mistake.
    - >-
      UNQUOTIENTED SYMMETRY. x(-Q) = x(Q) halves every x-derived fibre and the
      beta-orbits third it on special j. Both lower measured b by known
      constant factors and would be reported as structure. Quotient first,
      report both.
    - >-
      MAX VERSUS TYPICAL BRANCHING. b as defined is a MAXIMUM over fibre pairs
      and is what cost model M1 charges; the mean is much smaller and is not
      what the merge pays. An implementation reporting the mean computes a
      different quantity and would produce a false positive by construction.
      Both must be reported, and the PASS/FAIL runs on the maximum.
    - >-
      SMALL-M DEGENERACY. At M = 4 the threshold sqrt(M) = 2 is barely above
      the forced minimum 2 for the interval partition, so the M = 4 column
      carries almost no information. Conclusions come from the trend in M.
    - >-
      INDEXABILITY SMUGGLED IN. A sigma whose branching set is small but
      requires a search to enumerate is useless to a merge and must be
      recorded as b = M for cost purposes. The measurement must report
      indexability separately from cardinality.
    - >-
      TOY-RANGE EXTRAPOLATION. A fitted decay exponent over n <= 2^22 is a
      toy-range fit; the rectification threshold is asymptotic and is vacuous
      at every n this program can enumerate. Neither may be presented as
      evidence about cryptographic n.

  interpretation_limits:
    - >-
      NO ALGORITHM IS PROPOSED AND NO EXPONENT IS MOVED. Cost model M1 is
      carried to give b a price; the four-list construction itself belongs to
      RQ-ECDLP-160d89 and this record neither claims it nor closes it.
    - >-
      NO FACTOR BASE IS INTRODUCED, so KN-OPEN-020's three open classes
      (high-degree, implicit-membership, target-dependent description) are not
      engaged and no class need be declared. If a successor turns sigma's fibre
      structure into a relation mechanism, that successor owes the KN-OPEN-020
      declaration and the full description/membership/relation/descent charge.
    - >-
      The closure covers EQUAL-FIBRE partitions with ABSOLUTE-CONSTANT
      branching. Unequal fibres, growing b, projections carrying auxiliary
      state, and propagation rules defined on pairs rather than elements are
      all outside it and are the forward guidance.
    - >-
      Even a fully populated window leaves P-256 standing: at b = O(1),
      T = n^{1/3} = 2^85 for n = 2^256. This would be a security-margin result,
      never a break, and no deliverable may be phrased otherwise.
    - >-
      Toy scale throughout; claim_tier toy. The asymptotic statements are
      `derivation` artifacts per docs/claims-and-verification.md, never
      "proved".

  heuristic_assumptions:
    - id: H1
      statement: >-
        RECTIFICATION APPLICABILITY. For every absolute constant b there is a
        constant c(b) > 0 such that: for all primes n, for all A contained in
        Z/n with |A + A| <= b|A| and |A| <= c(b) * n, A is contained in an
        arithmetic progression of length at most C(b) * |A|.
      rigorous_support: >-
        NOT A DISTRIBUTIONAL HEURISTIC. It is the rectification principle of
        Green-Ruzsa (Bull. LMS 2006) composed with Freiman's structure theorem;
        for b <= 2.4 it is Freiman's 2.4-theorem in Z/p with the explicit
        density threshold, sharpened by Rodseth, Serra-Zemor and
        Candela-Serra-Spiegel, and the 3k-4 form modulo a prime is Grynkiewicz
        (Mathematika 2025). It is listed here rather than as an assumption
        because THE EXPLICIT THRESHOLD IS THE PART THAT CAN MAKE (D) VACUOUS:
        Freiman's classical form needs |A| < n/10^{35} ~ n/2^{116}, so at
        n = 2^256 and M = n^{1/3} the fibres of size 2^170 are FAR ABOVE the
        classical threshold and the classical form says nothing at P-256 size.
        The statement is asymptotic in n and is honest only as such.
      validation_plan: >-
        SAMPLE: exhaustive at n in {101, 401, 1009, 4001, 16001} and M in
        {4,...,32}: for every partition family in Stage 1, record
        (|A_i + A_i|/|A_i|, shortest containing AP length / |A_i|) for every
        fibre. COMPARISON: the predicted relation "doubling <= b implies AP
        length <= C(b)|A|" with C(b) read off the cited theorem, plotted as a
        scatter with the theorem's boundary drawn. TAIL CHECK: the 20 fibres
        with the smallest doubling and the largest AP-length ratio -- those are
        where a counterexample would sit. TRANSFER ASSUMPTION, STATED AND
        UNJUSTIFIED: that a threshold verified at n <= 2^14 describes behaviour
        at cryptographic n. It does not; the asymptotic statement is carried by
        the cited theorems, not by the sampling, and the sampling is a
        bug-check on the derivation, not evidence for it.
    - id: H2
      statement: >-
        COST-MODEL FIDELITY. In cost model M1 the level-1 candidate scan costs
        Theta(l^2 b / M) group operations, i.e. the b compatible target buckets
        are enumerable in O(1) each after a one-off O(M^2 b) precomputation of
        the propagation table, and that precomputation is either free (b small,
        table implicit) or must be charged as P.
      rigorous_support: >-
        Exact for the low-bits projection on Z/N, where the b = 2 branch set is
        {t, t - N mod 2^k} and is computed in O(1) with no table -- that is the
        rigorous instance the model is calibrated on (Wagner, CRYPTO 2002; the
        modular k-SUM applicability is the retrieved citation above). HEURISTIC
        for a general coordinate sigma, where the table may be as large as
        M^2 b and ITS CONSTRUCTION IS EXACTLY THE BERNSTEIN-LANGE ERROR THIS
        QUESTION EXISTS TO CATCH: a propagation table built by enumeration is
        precomputation and must be charged as P, not reported as a free
        structure. THIS IS THE WEAKEST LINK IN THE QUANTITATIVE FRAME AND IS
        STATED AS SUCH.
      validation_plan: >-
        SAMPLE: for every Stage 2 sigma measured at b < M, attempt to exhibit an
        O(1) closed-form branch-set rule and record whether one exists; where it
        does not, measure the table size actually required and charge it as P in
        a separate column of the cost table. COMPARISON: the low-bits rule on
        Z/N as the known-true O(1) case (forced PASS) and a random partition as
        the known-false case (forced table size M^2 b, forced FAIL). TAIL CHECK:
        any sigma passing with b < sqrt(M) must be re-audited for a hidden
        enumerated table before a single exponent is quoted.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED BY THIS RECORD. The exponent it PRICES, so
      that a measurement can be read as a decision, is: a coordinate-computable
      sigma with image size M and one-step additive branching b yields, under
      cost model M1 and via the four-list construction owned by
      RQ-ECDLP-160d89, T = max((nM)^{1/4}, b (n/M)^{1/2}) group operations,
      optimised at M* = b^{4/3} n^{1/3} to T = b^{1/3} n^{1/3}. Beat-rho
      condition: b < sqrt(M) and M < n. At b = O(1): n^{1/3}. At b = n^{0.05}:
      n^{0.35}. At b = M (information-free): n^{1/2} or worse, i.e. the model
      degrades to the baseline exactly as it must.
    memory_exponent: >-
      max((nM)^{1/4}, (n/M)^{1/2}) = b^{1/3} n^{1/3} at the optimum -- memory is
      as large as time, which is the claw-finding signature and is disclosed
      rather than buried. This is a HIGH-MEMORY point and is strictly worse than
      rho on the memory axis at every operating point.
    best_known: >-
      Pollard rho, 0.886 sqrt(n) group operations at O(1) memory. BSGS
      (n^{1/2}, n^{1/2}). Automorphism-quotient rho sqrt(n/|Aut|). Multi-target
      sqrt(un). Preprocessing frontier S T^2 = Omegatilde(n) (KN-LIT-013) with
      the Mihalcik / Lee-Cheon-Hong / Bernstein-Lange family at P T = n
      (KN-LIT-5230). Prime-field index calculus: no known advantage
      (KN-OPEN-001). This record occupies NO point on any of these axes.
    hidden_overhead: >-
      Three disclosures. (i) The per-evaluation cost c of sigma multiplies T and
      is NOT in the exponent as written; c = n^{eps} destroys the window.
      (ii) The branch-set enumeration may require a table of size M^2 b, which
      is precomputation and must be charged as P -- the exact error this RQ
      exists to correct (H2). (iii) The closure's constant C(b) and the density
      threshold c(b) in H1 are astronomically bad in the classical form
      (n/10^{35}), so (D) is asymptotic and says nothing at P-256 size.
    tradeoff_note: >-
      The priced point is (S, T) = (b^{1/3} n^{1/3}, b^{1/3} n^{1/3}) with
      P = 0, so S T^2 = b n -- ON the Corrigan-Gibbs-Kogan preprocessing
      frontier, but that frontier does not apply, because there is no advice:
      the applicable generic bound is Shoup's T = Omega(sqrt n), which the point
      violates. THAT IS CONSISTENT AND IS THE POINT: any such sigma is
      necessarily NON-GENERIC, exactly as section 6 of the note requires.
      van Oorschot-Wiener interpolates between the point and rho at reduced
      memory w. Parallelisation: the list build and the level-1 scan are
      embarrassingly parallel; the level-2 birthday is the communication
      bottleneck and is the standard distinguished-point problem.

