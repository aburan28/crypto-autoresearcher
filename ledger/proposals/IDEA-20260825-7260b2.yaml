  batch: EC-STRUCTURE-20260825
  cluster: 'C1-frame: what an instance actually reveals'
  title: 'THE RANK-ONE ACTION DEFICIT AS ONE OBSTRUCTION WITH THREE COROLLARIES: an ECDLP instance pins
    the scalar [k] on a single line of E[N], while every sub-rho lever that works elsewhere (non-scalar
    endomorphism action, Cheon auxiliary inputs, Kani/Robert torsion-image recovery) consumes [k] on a
    rank-2 module -- state the deficit once, derive the three closures from it, and price the missing
    rank'
  class: theory
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: The individual algebraic facts (eigenline decomposition of E[N] under Frobenius; a commuting
    endomorphism acting as a scalar on a one-dimensional eigenspace) are almost certainly standard and
    are recalled, not verified. The proposed contribution is the UNIFICATION -- that three separately
    recorded closures in this ledger are the same obstruction measured three ways -- together with an
    explicit price for the missing rank. That unification is what needs screening, not the underlying
    facts.
  claim:
    semantic_part: For E/F_p ordinary with prime-order subgroup G = E(F_p)[N], the pair (P, Q = kP) determines
      the F_N-linear action of [k] on the line <P> of E[N] = (Z/N)^2 and on no other line; the ledger's
      endomorphism, auxiliary-input and higher-dimensional-isogeny closures are all consequences of that
      single rank deficit.
    evaluator_part: 'Unestablished here: that NO efficiently computable instance map supplies the action
      of [k] on a second, independent line, and that the cheapest route to one costs at least matched
      rho. Both are stated as targets, not results.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - E[N] = (Z/N)^2 carries the Frobenius pi with eigenvalues 1 and p mod N; G is the pi = 1 eigenline
    and the second eigenline G' becomes rational only over F_(p^k) with k the embedding degree.
  - An ECDLP instance supplies exactly one input/output pair for the scalar map [k], hence pins [k] on
    <P> = G and imposes no constraint on its action on G'.
  - Corollary A (endomorphisms). End(E) is commutative and commutes with pi, so it preserves each eigenline;
    on the one-dimensional G every endomorphism phi acts as multiplication by a scalar lambda_phi in Z/N,
    and lambda_phi is a root of phi's characteristic polynomial mod N, hence publicly computable. An endomorphism
    therefore supplies a KNOWN scalar and no second action.
  - Corollary B (auxiliary inputs). Every operation available on (P, Q) composes group operations and
    known scalars, so it is affine in k; no nonlinear function of k (k^2, k^d) is obtainable, and Cheon's
    auxiliary-input speedup is unavailable for rank reasons rather than cost reasons.
  - Corollary C (higher-dimensional isogeny toolbox). The Kani/Robert embedding recovers an isogeny from
    its action on a rank-2 torsion module of smooth order coprime to the degree; the instance supplies
    rank 1.
  - 'Price the deficit: enumerate every route to the action of [k] on a second line -- pairing transfer
    at cost k in field size, an added oracle, a curve whose N-torsion action is reducible over F_p --
    and cost each against matched rho.'
  lossy_projection_test:
    tracked_object: the F_N-linear map [k] restricted to a subspace of E[N]
    what_is_discarded: the action on every line other than <P>
    propagation: 'deterministic and exact: restriction commutes with composition, so the object propagates
      through every group operation without loss'
    verdict: 'PASSES as a bookkeeping object -- it is genuinely lossy and genuinely propagates -- but
      it is a barrier object, not an attack object: it measures what an algorithm is missing, not what
      it can use.'
  predictions:
  - id: P1
    status: established_formula
    statement: A commuting endomorphism acts as a scalar on a one-dimensional eigenspace of a commuting
      operator.
  - id: P2
    status: established_formula
    statement: lambda_phi is computable in O(polylog N) field operations from phi's characteristic polynomial.
  - id: P3
    status: unestablished
    statement: No efficiently computable instance map realizes a non-scalar action of [k] on E[N] at cost
      below matched rho.
  minimal_discriminating_test:
    status: specified_not_run
    test: On toy ordinary curves with prime N, construct E[N] explicitly over the smallest field where
      it is rational; verify that every generator of End(E) acts as a scalar on G and non-scalar on E[N];
      tabulate the smallest extension degree at which the second eigenline becomes rational and compare
      with the embedding degree.
    pass: Scalar collapse on G holds for all tested curves and all tested endomorphisms, and the second
      eigenline is rational exactly at the embedding degree.
    fail: Any ordinary curve and endomorphism where the action on G is non-scalar falsifies Corollary
      A and, with it, the framing.
  controls:
  - 'F_p^* as a null: the multiplicative group is rank-one by construction, so a deficit visible there
    is not elliptic-specific.'
  - 'A supersingular curve over F_(p^2), where End is a rank-4 order and the action on the relevant module
    is genuinely non-scalar: the positive control that the measurement can detect non-scalarity at all.'
  - 'A curve with N | p - 1 (embedding degree 1), where the second eigenline is rational over F_p for
    free: the boundary case.'
  confounders:
  - Confusing the action of End(E) on E[N] with its action on G.
  - 'Treating a known scalar lambda as an oracle: it is public data.'
  - Composite N or a nontrivial cofactor, where G is not a single eigenline.
  - 'Reading the deficit as a proof of hardness: it bounds a family of mechanisms, not all algorithms.'
  falsification:
    semantic: An explicit ordinary prime-field curve, prime N, and efficiently computable instance map
      that supplies the action of [k] on a line independent of <P>.
    evaluator: A cost accounting showing some route to the second line is cheaper than matched rho scopes
      out only the pricing claim.
    not_falsification: Failure to enumerate all routes, a timeout, or an unperformed control.
  why_this_is_not_a_variant: 'H-ENDO-001 and KN-FIND-009 study endomorphism-augmented witness LATTICES
    and their minima; KN-FIND-002 and KN-FIND-b7e091 close endomorphism and incidence ORACLES by generic-group
    simulability. Both are outcome-level. This record is upstream of both: it gives the algebraic reason
    the lattice minimum behaves as measured and the reason the oracle is simulable, and it applies to
    mechanisms not yet proposed -- which a per-oracle GGM argument cannot do.'
