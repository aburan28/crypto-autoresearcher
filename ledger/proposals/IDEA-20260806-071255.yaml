idea:
  id: IDEA-20260806-071255
  question_id: RQ-ECDLP-002
  added: '2026-08-06'
  title: >-
    AUTOMATIC INVARIANT DISCOVERY, MADE NON-VACUOUS BY TYPING: the question
    "what quantity is unchanged under scalar multiplication but changes with the
    discrete log" has a ONE-LINE FORCED ANSWER OF NO -- so the searchable object
    is the TYPE of a candidate lens, not the lens, and this record specifies a
    generator that types thousands of candidates automatically and derives a
    forced value for each family before any of them is measured
  class: tooling

  claim: >-
    (A) THE NAIVE SEARCH IS EMPTY, AND THE PROOF IS FIVE LINES ALREADY IN THIS
    LEDGER. IDEA-20260806-c5d183 proves: for G = <P> cyclic of prime order N and
    any map pi: G -> S that propagates deterministically under the FULL
    translation action, pi is constant or injective. A "quantity unchanged under
    scalar multiplication" is a pi with pi(kP) = pi(P) for all k -- constant on
    G. A quantity that "changes with the discrete log" is injective. THE TWO
    REQUESTS ARE THE TWO ENDPOINTS OF THE SAME DICHOTOMY AND THERE IS NOTHING
    BETWEEN THEM. Any automatic-invariant-discovery run that generates
    candidates and tests them for "conserved but informative" will therefore
    return exactly zero hits, forever, at any budget -- and will look like
    diligent negative work while being a theorem restated as a compute bill.

    (B) WHAT IS ACTUALLY SEARCHABLE, AND IT IS A FINITE TYPE SET. By the same
    trichotomy every non-trivial candidate must violate one of the three
    hypotheses, so every candidate lens carries a TYPE:
      TYPE I  -- deterministic only under a PROPER subset H of translations
                 (index calculus is the known inhabitant; the cost is governed
                 by how far H's word metric reaches);
      TYPE II -- set-valued or stochastic propagation, branching factor b > 1
                 (transfer operators, Kummer pseudo-addition, coarse cells;
                 survival depth log(budget)/log b);
      TYPE III -- not a function of the group element at all, but of its
                 REPRESENTATION (coordinates, lifts, curve model).
    The searchable question is therefore NOT "find an invariant" but
    "for each type, what is the best achievable (L, b, H) triple, and does any
    point of that space lie outside the region already occupied". That is a
    well-posed optimisation over a typed space, and it is automatable.

    (C) THE DELIVERABLE. A generator that (i) enumerates candidate lenses from a
    declared grammar, (ii) assigns each a TYPE automatically by testing the three
    hypotheses, (iii) computes the (L, b) meter of IDEA-20260802-002 for the ones
    that survive typing, (iv) refuses to report any candidate whose forced value
    was derivable in advance, and (v) emits a per-family obstruction rather than
    a tally. Point (iv) is the load-bearing one: a generator without forced-value
    pre-checks manufactures fatigue reports at scale, which is worse than not
    running it.

    (D) THE FIRST WORKLOAD, WITH FOUR FORCED VALUES ALREADY DERIVED HERE AT ZERO
    COMPUTE. These are supplied to demonstrate that the pre-check stage has real
    content and is not a formality:
      D1 PERSISTENT HOMOLOGY of rho trajectories / addition-chain complexes.
        Persistence needs a METRIC, and E(F_p) has no canonical one; any metric
        is imposed on coordinates, so every persistent-homology lens is TYPE III
        by construction. FORCED NULL: x-coordinates of group elements are
        equidistributed in F_p to within Hasse/character-sum error, so the
        persistence diagram of a t-point trajectory must match that of a uniform
        random t-subset of the same ambient space. The experiment is legitimate
        only if run against that null, and its predicted outcome is agreement.
      D2 CATEGORY-THEORETIC / FUNCTORIAL EMBEDDINGS. A functor on the category of
        elliptic curves is isomorphism-invariant, so it assigns one value to E
        and cannot see P at all: zero bits about k, immediately. To see the point
        the functor must act on the category of PAIRS (E, P), whose moduli is
        X_1(N) -- so every functorial lens reduces to the modular-curve analysis
        of IDEA-20260806-0c9de1 and inherits its three forced values. The whole
        family collapses into an already-typed one, at zero cost.
      D3 KOLMOGOROV COMPLEXITY / COMPRESSION RATIO of the sequence
        x(P), x(2P), ..., x(tP). That sequence is generated by a program of size
        O(log p) -- the curve, P, and a loop -- so its Kolmogorov complexity is
        O(log p) for EVERY t and every curve. The compression ratio therefore
        measures t, not k. The only non-vacuous version is the CONDITIONAL
        complexity K(k | P, Q), which is the discrete logarithm itself. Family
        closed by definition unfolding.
      D4 APPROXIMATE / INTERVAL ARITHMETIC. Every absolute value on a finite
        field is trivial, so there is no non-trivial notion of "close" on F_p
        compatible with both operations, and interval arithmetic has no meaning
        at the field level. Approximation exists only after a lift to
        characteristic 0 or to Z_p -- which is the xedni / formal-group lane and
        is governed by the obstructions already recorded there. Family reduced,
        not screened.
    Four families, four obstructions, zero compute. That is the pre-check stage
    working, and it is the argument that the generator is worth building.

    (E) WHAT THIS IS NOT. NOT a claim that no new attack family exists -- the
    trichotomy is an index set, and all three cells are non-empty. NOT an
    automated theorem prover. NOT a licence to report a typed candidate as a
    result: typing is triage, and a candidate that survives typing still owes
    every measurement the existing meter demands.

  discriminated_from:
    - >-
      IDEA-20260802-002. That record defines the (L, b) meter and pre-registers
      at least twelve projections chosen by hand. This one supplies the layer
      above it: a grammar, an automatic type assignment, and a forced-value
      pre-check that refuses candidates before they reach the meter. It consumes
      that record's meter rather than replacing it, and if that meter is not
      built this proposal has no measurement stage.
    - >-
      IDEA-20260806-c5d183. That record proves the trichotomy and derives a point
      prediction about IDEA-20260802-002's output. This one uses the trichotomy
      as a TYPE SYSTEM for a search, which is a use the proving record does not
      make. If the trichotomy is refuted, this proposal's typing stage is void
      and the record is superseded with it.
    - >-
      KN-OPEN-019 (what object does each ECDLP attack family track, is the
      enumeration closed). This proposal is an instrument for discharging it at
      scale; it does not itself answer it.
    - >-
      Symbolic regression, program synthesis and equation discovery in the
      general scientific-ML sense. "symbolic regression" returns ZERO hits in
      this repository. The difference from generic symbolic regression is that
      the search space here is typed by a theorem and every family carries a
      derived forced value, which is what stops the search from being a
      curve-fitting exercise over a space where the answer is known to be empty.

  object_first_candidate:
    tracked_object: >-
      THE TYPE-AND-METER TRIPLE of a candidate lens: (type in {I, II, III},
      L = bits discarded, b = branching factor), together with H for type I.
      The tracked object is a property of a projection, not of a group element,
      which is why this record is classed `tooling` rather than `mechanism`.
    lossiness: >-
      Lossy over the space of lenses: infinitely many syntactically distinct
      lenses share a triple. That is the intended compression -- the claim is
      that the triple, not the syntax, determines what a lens can do.
    propagation: >-
      The type is stable under reparametrisation of the lens and under
      composition with injections; it is NOT stable under composition with
      further lossy maps, and the generator must therefore type compositions
      directly rather than inferring them, which is an implementation obligation
      and a likely source of silent error.
    survival_score: >-
      Survives as long as the trichotomy does. Dies with it.

  mechanism: >-
    STEP 1 -- THE GRAMMAR, DECLARED AND FROZEN BEFORE GENERATION. A candidate
    lens is a composition drawn from a declared alphabet: coordinate extractors
    (x, y, bit slices, Legendre symbol, field-trace), arithmetic maps of bounded
    degree, quotients by declared subgroups or automorphisms, partition maps into
    r cells, and small-degree isogeny or endomorphism evaluations. Bounded
    composition depth keeps the space finite and enumerable. Freezing the grammar
    before generation is what makes the resulting count meaningful rather than a
    function of how long anyone kept typing.

    STEP 2 -- AUTOMATIC TYPING, WHICH IS THREE FINITE CHECKS. For each candidate
    pi: (a) is pi(g + h) determined by (pi(g), h) for all h in G -- checked
    exhaustively at toy N; if yes, the trichotomy forces constant or injective
    and the candidate is discarded with that as its recorded obstruction. (b) If
    not, is there a proper subset H for which it holds -- type I, and H is
    reported. (c) Otherwise measure the branching -- type II -- or detect
    dependence on representation -- type III. The checks are exhaustive at toy N,
    so typing is exact rather than statistical, which is the reason the whole
    scheme is trustworthy at small scale.

    STEP 3 -- THE FORCED-VALUE PRE-CHECK, WHICH IS THE STAGE THAT MUST NOT BE
    SKIPPED. Before any candidate is measured, the generator consults a table of
    derived forced values by family (D1-D4 are its first four entries) and
    refuses to spend compute on a candidate whose value is already derivable.
    Every refusal is logged with its derivation. THE NUMBER OF REFUSALS IS A
    PRIMARY REPORTED METRIC, not an internal detail: a run that refuses most of
    its candidates is working as designed, and a run that refuses none has a
    table that is not being maintained.

    STEP 4 -- THE FRONTIER, NOT THE TALLY. Output is the achieved region of
    (type, L, b) space, plotted against the region occupied by the known families
    F1-F7 of IDEA-20260802-002. The question the run answers is whether any
    generated candidate lands OUTSIDE that region. A candidate inside it is a
    rediscovery and must be reported as such, by name.

    STEP 5 -- THE NEGATIVE CONTROL ON THE GENERATOR ITSELF. Seed the grammar with
    a lens whose triple is known -- pi = x-coordinate, whose exact values are
    (type II, L = 1 bit, b = 2) per IDEA-20260802-002's own calibration. The
    generator must rediscover it with those exact values. A generator that cannot
    recover a known answer is not evidence about unknown ones.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      grep -ril over ledger/, knowledge/, docs/ for "symbolic regression",
      "invariant discovery", "persistent homology", "Kolmogorov complexity",
      "interval arithmetic", "functor", "derived category", "automated
      discovery", performed 2026-08-06 against merge-base 0c856274.
    results: >-
      "symbolic regression", "persistent homology": ZERO hits. "Kolmogorov
      complexity": five hits, none ECDLP-facing. "functor": thirteen hits, all in
      literature notes. No record in this repository proposes an automated
      generator over candidate lenses, and no record supplies a type system for
      one. The nearest records are IDEA-20260802-002 (hand-picked candidates plus
      a meter) and IDEA-20260806-c5d183 (the theorem this typing rests on).
    verdict: >-
      ADAPTATION. Automated hypothesis generation is not new as an idea, and the
      trichotomy is not this record's theorem. What is proposed as new is the
      composition: using a proved dichotomy as a type system so that an automated
      search over lenses is not searching a space whose emptiness is already
      known. No claim of novelty against the external literature is made.

  null_object_control: >-
    (1) GENERATOR CONTROL: the x-coordinate lens must be rediscovered with its
    exact known triple. (2) RANDOM-LENS NULL: generate lenses by sampling random
    functions G -> S of each declared image size and measure their (L, b). Every
    reported "interesting" candidate must be compared against the random lens of
    the same image size -- a candidate whose triple matches the random null is a
    random function with extra syntax. (3) STRUCTURE-DESTRUCTION NULL: run the
    entire pipeline on a RANDOM cyclic group with an arbitrary labelling of the
    same order, where no curve structure exists. Any candidate that scores the
    same there was never using the curve, and its apparent structure is an
    artifact of the label encoding.

  assumptions:
    - >-
      The trichotomy of IDEA-20260806-c5d183 is correct. It is elementary and its
      proof is recorded, but it has not been independently validated in this
      session; the typing stage is void without it.
    - >-
      Toy N small enough for exhaustive typing (N up to roughly 2^16), so typing
      is exact. Conclusions about which lenses EXIST are scoped to the declared
      grammar and are not claims about all possible lenses.
    - >-
      The (L, b) meter of IDEA-20260802-002 exists and passes its own four
      calibration checks. This proposal does not rebuild it and is blocked
      without it.

  proof_search_map:
    bottleneck: >-
      The forced-value table. Everything else is engineering. If the table stays
      thin, the generator degenerates into a machine that produces the fatigue
      reports docs/inventor-protocol.md section 4 rejects, at higher throughput
      than a human could.
    baseline_embedding:
      parameter_slice: >-
        The seven established families F1-F7 named in IDEA-20260802-002. The
        generator must place each of them at its correct type and triple.
      reproduction_check: >-
        Frozen fixture: F1-F7 typed by hand once, then reproduced mechanically.
        Exact match on type; triples within the meter's declared tolerance.
    observation_collision:
      observable: >-
        The (type, L, b) triple.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED MASSIVELY: many syntactically distinct
        lenses will share a triple. This does not falsify the scheme, it is the
        scheme -- the triple is a deliberate quotient. What it bounds is the
        conclusion: a NEW triple is a candidate new family, a repeated triple is
        a rediscovery, and the write-up must never present the second as the
        first. The count of distinct triples versus candidates generated is a
        reported metric for exactly this reason.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Type together with the triple, rather than the triple alone --
          preserving the propagation structure that survives composition rather
          than only the scalar summary.
        predicted_gain: >-
          Distinguishes type I candidates with small H from type II candidates
          with small b, which the triple alone conflates and which have entirely
          different cost consequences.
      - transform: specialization_pack
        proposed_object: >-
          Charge the search budget over the proved-disjoint type cells so that
          coverage per cell is reportable, rather than reporting one undifferentiated
          candidate count.
        predicted_gain: >-
          Converts "we screened N candidates" -- a fatigue report -- into
          "cell I was covered to depth d1, cell II to d2, cell III to d3, with
          these obstructions", which is a coverage statement.
    quantifier_order: >-
      The claim the generator can support: FORALL candidates pi in the declared
      grammar at composition depth <= D, EXISTS a type and a triple, and the
      achieved region is R.
      The claim it can NEVER support: FORALL lenses whatsoever, the achieved
      region is R. The grammar and the depth bound are inside the quantifier and
      must appear in every reported conclusion; dropping them turns a coverage
      statement into a false closure.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Within this grammar, at this depth, at this toy scale, no candidate
        lands outside the region occupied by the known families." NEVER "there
        is no new attack family."
      nearby_object_control: >-
        Seed the grammar with a lens from a family the generator is NOT supposed
        to find -- e.g. a pairing transfer on a low-embedding-degree curve, which
        is genuinely powerful. The generator must type it correctly and place it
        outside the generic region. A generator that types a known-powerful lens
        as unremarkable cannot detect power, and its negative results are
        uninformative.
    proof_obligations:
      - claim: Typing is exact at toy N by exhaustive check.
        responsibility: correctness
      - claim: F1-F7 are reproduced at their correct types.
        responsibility: baseline
      - claim: Every refusal carries a recorded derivation.
        responsibility: interface
      - claim: Reported conclusions carry grammar and depth bounds.
        responsibility: scope
      - claim: The known-powerful seed lens is placed outside the generic region.
        responsibility: correctness

  predictions:
    - metric: >-
        number of generated candidates typed as "deterministic under the full
        translation action and non-trivially lossy"
      direction: different
      minimum_effect: >-
        Exactly 0, at any budget. This is forced by the trichotomy and is the
        instrument's self-check: a non-zero count means either the trichotomy is
        false -- a major finding -- or the typing code is wrong. The run halts
        either way and the discrepancy is investigated before anything else is
        reported.
    - metric: >-
        fraction of generated candidates refused by the forced-value pre-check
      direction: different
      minimum_effect: >-
        At least 30 percent once the table carries D1-D4 and the F1-F7 rows. A
        refusal rate near zero means the table is not being maintained and the
        run is manufacturing tallies.
    - metric: >-
        number of candidates landing outside the (type, L, b) region occupied by
        F1-F7
      direction: different
      minimum_effect: >-
        Predicted 0. A single one is a candidate new attack family and triggers a
        full hand analysis before any claim; it is not reported as a finding from
        the generator alone.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): freeze the grammar and depth bound; write the
      forced-value table with D1-D4 and the F1-F7 rows and their derivations.
      STAGE 1 (hours, HARD GATE): implement exhaustive typing at toy N; reproduce
      F1-F7 types and the x-coordinate triple exactly. Failure ends the line.
      STAGE 2 (HARD GATE): run the known-powerful seed control and the
      random-cyclic-group structure-destruction null.
      STAGE 3 (hours): generate and type the full grammar at depth <= D; log
      every refusal with its derivation.
      STAGE 4 (hours): meter the survivors; plot the achieved region against the
      F1-F7 region; report the frontier, the refusal rate, and the count of
      distinct triples.
      STAGE 5 (zero compute): for every family with no inhabitant found, record a
      named obstruction or state explicitly that none was found -- the second is
      permitted and is labelled `unverified`, per the closure standard.
    controls:
      - x-coordinate lens rediscovered with its exact known triple
      - known-powerful seed lens placed outside the generic region
      - random-lens null at each declared image size
      - random cyclic group with arbitrary labelling, no curve structure
    required_metrics:
      - candidates generated, typed, refused, metered, per type cell
      - achieved (type, L, b) region versus the F1-F7 region
      - refusal rate and the derivation cited for each refusal
      - count of distinct triples versus candidates generated
      - wall-clock and memory per stage

  falsification_conditions:
    - >-
      A candidate types as full-translation-deterministic and non-trivially
      lossy. Either the trichotomy is false or the typing code is wrong; the run
      halts and nothing is reported until it is resolved.
    - >-
      F1-F7 are not reproduced at their correct types. Instrument failure.
    - >-
      The known-powerful seed lens is typed as unremarkable. The generator cannot
      detect power; its negatives are uninformative and may not be reported.
    - >-
      The structure-destruction null produces the same achieved region. The
      generator is measuring the label encoding, not the curve.

  confounders:
    - >-
      Grammar-shaped results. The achieved region is a function of the grammar,
      so "nothing new was found" may mean "the grammar cannot express anything
      new". Reporting the grammar alongside every conclusion is not optional and
      is the single most likely way this instrument misleads.
    - >-
      Throughput mistaken for coverage. A large candidate count is not evidence;
      per-cell coverage depth is. The metrics are chosen so that the tempting
      headline number is not available.
    - >-
      Toy-N typing at N <= 2^16 may classify differently from large N when a lens
      depends on bit-length. Lenses with bit-length dependence must be flagged
      and typed at more than one N.

  interpretation_limits:
    - >-
      Everything is scoped to the declared grammar, depth bound and toy N.
    - >-
      Typing is triage. A surviving candidate is a hypothesis for hand analysis,
      never a finding.
    - >-
      An empty frontier is a coverage statement about the grammar, and its honest
      status is `unverified` as a closure unless a per-family obstruction
      accompanies it.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The (type, L, b) triple is a sufficient statistic for whether a lens can
        found a new attack family -- i.e. two lenses with the same triple have
        the same best-achievable cost exponent against the ECDLP.
      rigorous_support: >-
        The rigorous half is the trichotomy, which shows the type determines
        which of three propagation regimes a lens is in, and the survival-depth
        formula log(budget)/log(b) for type II. The heuristic half is
        SUFFICIENCY -- that nothing outside the triple matters -- and it is
        almost certainly false in detail, since two type I lenses with the same
        |H| but different word metrics on H can differ in cost. H1 is stated
        so it can be attacked rather than relied on quietly.
      validation_plan: >-
        Collect all lenses in the grammar sharing a triple and compare their
        measured relation yield on the toy curve. Comparison distribution: the
        spread of yields within a triple class against the spread across
        classes. If within-class spread is comparable to across-class spread,
        H1 is refuted and the triple is not a sufficient statistic -- in which
        case the generator's output must be read as a coarse filter only, which
        is a weaker but still usable instrument. Toy scale only, labelled so.

  target_complexity:
    time_exponent: >-
      NOT AN EXPONENT PROPOSAL. This is tooling. Its output is a typed frontier,
      not an algorithm, and no cost against the ECDLP is claimed or targeted.
    memory_exponent: >-
      Exhaustive typing at toy N is O(N) per candidate for the full-translation
      check and O(N^2) for naive branching measurement, which bounds N to about
      2^16 and is the binding constraint on the whole design.
    best_known: >-
      Unchanged: rho at p^{1/2} with O(1) memory (KN-TECH-001, KN-TECH-006), the
      generic bound (KN-TECH-005).
    hidden_overhead: >-
      The O(N^2) branching measurement is the hidden cost and it is what stops
      this from running at interesting N. Any claim that the generator "covered
      the space" hides the grammar and the depth bound; both are disclosed as
      required reporting fields for exactly that reason.
    tradeoff_note: >-
      Not applicable; no algorithm is produced.

  dominated_by: >-
    As an ATTACK: mounts none; dominated on time, memory and data/query by every
    row of the prime-field frontier -- rho at p^{1/2} time and O(1) memory,
    BSGS at p^{1/2} time and memory, kangaroo on intervals, and every recorded
    index-calculus variant.
    As a DISCOVERY INSTRUMENT: dominated by IDEA-20260802-002 on maturity (that
    record's meter is specified and calibrated; this one consumes it) and
    dominates it on coverage (a grammar and automatic typing versus twelve
    hand-picked candidates). Not dominated by anything on the typing dimension,
    because no other record types candidates at all.
  sota_delta: >-
    Zero speedup. Instrument delta as numbers: extends a 12-candidate hand-picked
    screen to a frozen grammar enumerated to depth D with exact typing at toy N;
    supplies 4 derived forced values covering 4 whole lens families at zero
    compute (persistent homology, functorial embeddings, Kolmogorov/compression,
    approximate arithmetic); and replaces an undifferentiated candidate count
    with per-cell coverage depth across 3 type cells. Stated as counts because
    "explores the space automatically" is not a value.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that the generator is buildable and reproduces F1-F7. 0.02 that any
    candidate lands outside the known region -- and that number is low for a
    reason worth stating: the trichotomy means the interesting cells are type I
    and type II, both of which are heavily occupied. The realistic value is
    almost entirely in the forced-value table and in never again spending compute
    on a family whose answer was derivable, not in a discovery.

  id_allocation_provenance: >-
    python3 tools/allocate_id.py --next idea --date 20260806 (random token, no
    state scanned), then --check IDEA-20260806-071255 confirmed free before use.

