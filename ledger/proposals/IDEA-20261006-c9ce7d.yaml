idea:
  id: IDEA-20261006-c9ce7d
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Vanishing z^2-coefficient of x(P+pi(P)) on y^2 = x^3 + 2x + 1
    over F_{5^3}
  class: measurement
  claim: >-
    On E: y^2 = x^3 + 2x + 1 over F_5, let S be the affine points of
    E(F_{5^3}) whose x-coordinate is not in F_5. Write field elements
    as a0 + a1 z + a2 z^2. Let K_frob be the number of P in S whose
    sum with its coordinate 5-power has an x-coordinate with a2 equal
    to 0. Let Q0 be the least point of S in lexicographic order. Let
    K_fixed be the number of P in S for which x(P+Q0) has a2 equal to
    0. The claim is K_frob >= K_fixed + 5. The representation is affine
    coordinates. The discrete-log time exponent stays 1/2 and the delta
    versus Pollard rho is 0. This is not a slope image, not a division
    polynomial factor count, and not a Hamming weight of an integer
    representative.
  mechanism: >-
    The operation is the coordinate 5-power map. The sum P+pi(P) is
    (1+pi) applied to P. Keeping only the coefficient a2 of x of that
    sum is a linear condition of codimension 1 over F_5. The same
    condition on sums with one frozen point Q0 is the null arm. Two
    readings are separated by the same integers. Endomorphism-sum says
    the Frobenius count exceeds the frozen-point count by at least 5.
    Frozen-translate says it does not. The shortfall is the negative.
    No factor base is built.
  novelty_status: unverified
  citations:
    - ref: KR-IC-b0fcda
      provenance: internal
      claim: >-
        Frobenius-invariant factor bases cut the number of systems by at
        most 1/n. A coefficient of one sum is not that factor base.
      verified_by: coordinator design session, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
    - ref: KR-IC-955fd6
      provenance: internal
      claim: >-
        S_m and small-torsion symmetry shrink point decomposition. This
        proposal never forms S_m.
      verified_by: coordinator design session, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml
    - ref: KR-RHO-037e22
      provenance: internal
      claim: >-
        A class walk changes a square-root-of-degree factor, not the
        exponent 1/2.
      verified_by: coordinator design session, 2026-10-06, opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-037e22.yaml
  assumptions:
    - >-
      The discriminant 4*(2^3) + 27*(1^2) = 59 is 4 mod 5. The run
      recomputes it. A zero discriminant voids the comparison.
    - >-
      The modulus is the least monic cubic over F_5 with no root in
      F_5. A reducible choice voids the run.
    - >-
      Points with a vertical chord to pi(P), or to Q0, are dropped from
      that arm and the drop count is recorded. A drop above one tenth
      voids the run.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a pre-registered count on one toy curve, not a proof.
  predictions:
    - metric: count of sums whose x-coordinate has a2 equal to 0
      direction: higher
      minimum_effect: K_frob is at least K_fixed plus 5
  minimal_test:
    design: >-
      Enumerate E(F_{5^3}). Build S and Q0. Compute K_frob and K_fixed
      with the chord-and-tangent addition law. A second addition
      implementation on 20 sums must agree. Report the drop counts.
      They do not replace the inequality.
    controls:
      - Discriminant recomputed nonzero.
      - Modulus has no root in F_5.
      - Q0 is the least point of S, recomputed from the point list.
      - Two addition implementations agree on 20 points.
    required_metrics:
      - size of S
      - K_frob
      - K_fixed
      - drop counts
  falsification_conditions:
    - K_frob is strictly less than K_fixed + 5, after the checks pass.
    - The size of S is below 20. That case is void.
    - The two addition implementations disagree.
  confounders:
    - A different basis order changes which coefficient is a2. The basis order is frozen before the count.
    - Q0 itself may have a special coefficient. The control is that Q0 is selected by the order, not by its coefficients.
  interpretation_limits:
    - One curve and one extension of cardinality 125. No transfer.
    - The discrete-log exponent stays 1/2 even if the inequality holds.
    - A passed inequality does not define a factor base.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a frozen point Q0, the coefficient a2 of x(P+Q0) is as
        often zero as a uniform nonzero linear form on a 3-dimensional
        space, about one value in 5. The gap of 5 points is the
        pre-registered minimum effect against the Frobenius sum. It is
        not a proved tail.
      rigorous_support: >-
        A nonzero F_5-linear form on F_{5^3} vanishes on a subspace of
        index 5. No opened row proves the coefficient count for
        x((1+pi)P).
      validation_plan: >-
        Repeat K_fixed with Q1, the second point of S, and compare the
        two frozen counts. If they differ by more than 5, H1 is not
        used to interpret K_frob.
  target_complexity:
    time_exponent: "1/2"
    memory_exponent: "O(1) field elements beyond the point list"
    best_known: >-
      Pollard rho, exponent 1/2 (KR-RHO-037e22). Gaudry's
      Õ(q^{2-2/n}) (KR-IC-46d822) is not improved.
    hidden_overhead: >-
      No o(1) term. The comparison is two integers on a field of
      cardinality 125.
    tradeoff_note: >-
      The discrete-log time exponent stays 1/2 and the delta versus
      Pollard rho is 0. No time-memory tradeoff is proposed.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Checked KR-IC-b0fcda, KR-IC-46d822, KR-IC-955fd6, KR-IC-1fcdbc,
    and KR-RHO-037e22. None states a count of vanishing coefficients
    of x(P+pi(P)). The symmetry row prices an S_m factor. This
    proposal does not form S_m.
  sota_delta: >-
    The discrete-log time exponent stays 1/2 and the delta versus
    Pollard rho is 0. The pre-registered gap is an additive 5 between
    two counts on a field of 125 elements.
  prior_art:
