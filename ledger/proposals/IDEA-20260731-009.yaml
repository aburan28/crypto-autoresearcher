idea:
  id: IDEA-20260731-009
  question_id: RQ-ECDLP-002
  title: Crypto-size first-fall-degree correspondence — sample Semaev-shaped systems without solving ECDLP
    to validate Groebner cost heuristics
  class: measurement
  claim: The first-fall degree d_ff and Macaulay-bound degree d_reg of Semaev-shaped multihomogeneous
    systems at parameter sizes corresponding to 64–128-bit N can be estimated by sampling random systems
    with the same degree vector and variable counts as the Semaev membership system, WITHOUT constructing
    an elliptic curve or solving ECDLP. Under HEUR-FF-1 (shape-determined regularity), the sampled d_ff
    distribution matches the toy-Semaev d_ff distribution after normalizing by the theoretical Macaulay
    bound, within KS distance 0.1. If true, Groebner-cost models used in H-IC / H-YIELD style exponent
    bookkeeping may be stress-tested at sizes where direct ECDLP is infeasible; if false, those models
    cannot be extrapolated beyond toy curves already run.
  mechanism: 'Groebner complexity is governed by degree of regularity / first-fall degree. Direct Semaev
    systems at crypto size are infeasible to build from curves, but the algebraic shape (variable count,
    multidegrees from summation polynomials) can be mimicked by random coefficients. This is a correspondence
    measurement in the sense of the target-result profile: validate a distribution heuristic at cryptographically
    relevant parameters via a sampling shortcut that does not require solving the hard problem. Distinct
    from IDEA-20260727-006 (equidistribution-resolution gap on factor-base Weil error), which targets
    yield geometry rather than Groebner degree.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-07-31'
    corpus_paths_grepped:
    - ledger/proposals
    - knowledge/INDEX.md
    grep_results:
    - IDEA-20260727-006 is equidistribution-resolution on factor bases; KN-FIND-006 reports Semaev/Weil-descent
      Macaulay rank deficit on binary-field systems — adjacent but not this prime-field correspondence
      sampler.
    literature_verified: []
    conclusion: Measurement adaptation; novelty unverified.
  assumptions:
  - Random multihomogeneous systems with Semaev degree vectors are an adequate null/correspondence model
    under HEUR-FF-1.
  - d_ff is computed with a fixed, version-pinned Groebner engine.
  predictions:
  - metric: KS_distance_dff_normalized
    direction: lower
    minimum_effect: KS(toy_Semaev || random_shape) <= 0.1 at each matched shape class
  minimal_test:
    design: Build a shape catalog from toy Semaev membership systems at 12–20 bits (m in {3,4,5}). For
      each shape, sample >=100 random systems and >=30 true Semaev systems; compute d_ff. Then sample
      random systems at shape parameters scaled to 64- and 96-bit proxy sizes (variable counts and degrees
      only) and compare normalized d_ff tails to the toy Semaev-normalized distribution.
    controls:
    - Semi-regular random systems of equal size as a second baseline.
    - Engine version pin and seed log.
    - 'Null: shuffled degree vectors (same variables, wrong degrees) must NOT match Semaev d_ff.'
    required_metrics:
    - d_ff empirical CDF per class
    - KS distances
    - wall time per sample (infra only)
  falsification_conditions:
  - 'KS > 0.25 between toy Semaev and random-shape at the same size: HEUR-FF-1 fails; crypto-size random
    sampling is not a valid surrogate.'
  - 'Shuffled-degree null matches Semaev as well as correct-shape: measurement is insensitive and void.'
  confounders:
  - Coefficient distribution (uniform vs structured from curve equations) may dominate degree vector.
  - Engine heuristics may hit artificial d_ff ceilings at large shapes.
  interpretation_limits:
  - Even a tight KS match does not prove Semaev systems are semi-regular at crypto size; it only licenses
    a named heuristic with a validation trail.
  - This measurement alone never claims an ECDLP solve or exponent move.
  heuristic_assumptions:
  - id: HEUR-FF-1
    statement: For Semaev membership systems on prime fields, d_ff / d_Macaulay is governed primarily
      by the multihomogeneous degree vector and variable count, so random systems with the same shape
      have the same normalized d_ff distribution as true Semaev systems.
    rigorous_support: Bardet–Faugère–Salvy style analyses for semi-regular sequences; no theorem for Semaev-shaped
      systems over F_p.
    validation_plan: Toy Semaev vs random-shape KS test as in minimal_test; report failure explicitly
      rather than assuming semi-regularity.
  target_complexity:
    time_exponent: n/a (measurement); informs poly(D)^{O(n)} Groebner models used in IC bookkeeping
    memory_exponent: n/a (measurement)
    best_known: n/a — supports cost models rather than an attack
    hidden_overhead: Sampling cost grows steeply with shape; 128-bit proxy may be infeasible and must
      be reported missing rather than fabricated
    tradeoff_note: Fewer variables / smaller m shapes are cheaper probes; do not silently substitute them
      for m=5 claims
  dominated_by: null
  sota_delta: 'Building-block measurement: no direct SOTA exponent delta; enables or kills extrapolation
    of Groebner exponents used by IC proposals'
  estimated_cost:
    implementation: medium
    compute: high
  recommended_priority: medium
