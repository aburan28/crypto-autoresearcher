idea:
  id: IDEA-20260816-d5d520
  question_id: RQ-PMA-001
  added: '2026-08-16'
  title: 'Audit the frozen EXP-PMA-001 parameter box for arithmetic satisfiability before any compute
    is spent: fifteen pairwise-distinct d_S values excluding zero and one cannot be drawn from F_3,
    F_5 or F_7, so decide by counting whether the frozen finite-field grid can be instantiated at
    all'
  class: control
  claim: '(A) H-PMA-001 and experiments/EXP-PMA-001/specification.yaml prescribe, for each grid instance,
    p_empty = 1 and p_S = (t+1)/(t+d_S) for EVERY nonempty S of a four-element index set -- fifteen
    subsets, hence fifteen values d_S -- drawn from a frozen parameter box described as distinct nonzero
    values not equal to 1, over constant fields k = F_3, F_5, F_7 and k = Q. (B) The number of elements
    of F_q that are nonzero and not equal to 1 is exactly q - 2: one value at q = 3, three at q =
    5, five at q = 7. Fifteen pairwise-distinct such values therefore require q at least 17. If distinctness
    is read as binding across all fifteen subsets, the frozen finite-field grid is arithmetically
    uninstantiable at every one of its three finite fields, and only the k = Q arm can be built. (C)
    The proposal is to run this as a formal, reproducible, zero-compute satisfiability audit -- a
    small program that reads the frozen specification, extracts the parameter-box constraints, and
    emits SATISFIABLE or UNSATISFIABLE with the exact counting witness per field -- and to run the
    same audit against every other frozen experiment specification in the repository as a fleet check,
    since the failure mode is generic. (D) What is NOT claimed: that the mechanism of IDEA-20260726-012
    is wrong. It is not touched. A parameter box that cannot be instantiated says nothing whatever
    about whether divisor parity obstructs PMA4 over k(t); it says the contract as frozen cannot be
    executed at three of its four fields, which is a contract defect and is repaired by a Coordinator
    amendment, not by a mathematical revision. (E) Also NOT claimed: that distinctness is necessarily
    binding across all fifteen subsets rather than within some smaller family. The audit''s primary
    output is precisely to force that ambiguity to be resolved explicitly, and both resolutions are
    reportable outcomes. (F) No attack, speedup, or security consequence is claimed or implied.'
  mechanism: 'Stage 1 parses experiments/EXP-PMA-001/specification.yaml and ledger/hypotheses/H-PMA-001.yaml
    and extracts, verbatim, every constraint that bounds the parameter box: the subset family, the
    exclusions (nonzero, not equal to 1), the distinctness requirement, and the per-field instance
    counts. Stage 2 encodes those as a finite constraint satisfaction problem over the actual field
    and solves it by counting -- for each field, the required number of distinct admissible values
    versus the available number q - 2 -- with no search needed when the count already decides it.
    Stage 3 emits, per field, one of SATISFIABLE with an explicit witness assignment, UNSATISFIABLE
    with the counting certificate, or AMBIGUOUS with the exact sentence in the frozen record whose
    reading changes the verdict. Stage 4 sweeps the same parser over every experiments/*/specification.yaml
    in the repository and reports how many carry a machine-checkable parameter-box constraint at all,
    how many are satisfiable, and how many are ambiguous -- which is the reusable deliverable, because
    the tool outlives this one contract. Stage 5 runs the null control. The audit is refuted, as an
    instrument, if it reports UNSATISFIABLE for a specification that a hand construction actually
    instantiates, which is the failure mode that matters and is checked directly.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read ledger/hypotheses/H-PMA-001.yaml test_boundary block in full, experiments/EXP-PMA-001/specification.yaml
      inputs and grid blocks in full, ledger/questions/RQ-PMA-001.yaml constraints in full, ledger/proposals/IDEA-20260726-012.yaml
      assumptions in full, ledger/decisions/DEC-20260807-5adc24.yaml the_finding block. Grepped ledger/proposals/
      and ledger/hypotheses/ for: parameter box, satisfiab, instantiab, precondition, contract defect,
      specification audit, frozen specification. Checked the blacklist for the program''s own self-audit
      lane.'
    results: 'DEC-20260807-5adc24 is the closest existing record and it is genuinely close in SHAPE:
      it audits frozen contracts for defects and found that TASK-20260727-011 cites DEC-20260727-002
      as authorisation for EXP-PMA-001 when that decision concerns an unrelated goal, and it paused
      EXP-PMA-001 on that basis. But its defect class is CITATION PROVENANCE -- does a cited approval
      record exist and say what it is claimed to say -- and it explicitly checks approval fields,
      not parameter arithmetic. No record anywhere audits whether a frozen parameter box can be instantiated.
      The blacklist bars re-auditing the program''s cost model, machine variance, timing, corpus citation
      markings, false-positive rate, falsification follow-through, findings-promotion gate, goal-status
      inventory and audit crowd-out; a parameter-box satisfiability check is none of those and is
      a property of the mathematics in a contract rather than of the program''s meta-process. H-PMA-001
      itself already discloses one contract defect honestly (the F_211 fixture controls depend on
      EV-ECDLP-023 and TASK-20260726-756, which do not exist in this repository), which is evidence
      the frozen record was not machine-checked for this class of defect.'
    verdict: 'UNVERIFIED. Nothing is asserted about literature outside this repository. Claimed new
      inside it: parameter-box satisfiability as a machine-checkable precondition on frozen experiment
      contracts, and the specific counting observation that q - 2 admissible values cannot supply
      fifteen distinct d_S at q in {3, 5, 7}. Assembled from known parts: the audit-a-frozen-contract-before-dispatch
      move is exactly the move DEC-20260807-5adc24 made, and this entry takes that same move and points
      it at arithmetic instead of at citations; the counting itself is elementary.'
  object_first_candidate:
    tracked_object: 'The PARAMETER BOX of a frozen contract, followed as a finite constraint satisfaction
      instance: a set of variables (the fifteen d_S), a domain (the constant field minus its excluded
      elements), and a constraint set (pairwise distinctness plus any declared exclusions). What propagates
      through the audit is the pair (required distinct count, available domain size) per field.'
    lossiness: 'Genuinely lossy, and the loss is the entire mathematical content of the experiment.
      The projection discards the principal minors, the discriminants, the square classes, the matrices,
      and the whole obstruction mechanism, retaining only variable count, domain cardinality and the
      distinctness relation. That is compatible with the target operation -- instantiating a grid
      -- because instantiation depends on nothing else: no property of the discriminant can make a
      fifteenth distinct element appear in a field with three. The retained part propagates deterministically
      because counting does.'
    propagation: One step of the target operation is adding one more grid instance or one more prescribed
      subset to the box. Adding a subset increases the required distinct count by one and can only
      turn SATISFIABLE into UNSATISFIABLE, never the reverse; adding an instance leaves the per-instance
      count unchanged but multiplies the number of assignments that must exist, and under distinctness
      within an instance it changes nothing about satisfiability. The action on the tracked pair is
      therefore monotone and closed-form, which is why the audit needs no search.
    survival_score: The structure survives all the way to the verdict and then stops, cleanly. It
      is decisive at every finite field, because the counting argument is complete there. It DISSOLVES
      at k = Q and at any infinite field, where q - 2 is infinite and distinctness is trivially satisfiable,
      so the audit correctly returns SATISFIABLE with no information content. It also dissolves for
      any constraint richer than distinctness plus exclusion -- for example a requirement that the
      resulting discriminants be nondegenerate -- which counting cannot decide and which the audit
      must therefore report as out of its scope rather than as satisfiable.
  null_object_control: 'The identical parser and identical solver are run against a null: a set of
    synthetically generated specification files of the same shape, with the same field list and the
    same constraint vocabulary, but with variable counts drawn so that half are satisfiable by construction
    and half are unsatisfiable by construction, generated from a declared seed. The null must show
    the audit recovering the constructed ground truth with zero false UNSATISFIABLE verdicts and zero
    false SATISFIABLE verdicts across at least 200 synthetic specifications. If the audit misclassifies
    any synthetic case, its verdict on the real frozen contract carries no weight and the record says
    so. A false UNSATISFIABLE is the fatal direction, because it would slander a real contract.'
  discriminated_from:
  - 'DEC-20260807-5adc24: audits whether a cited approval decision exists and is about the right experiment.
    That is provenance of authorisation; this is arithmetic of parameters. The two defect classes
    are disjoint, and DEC-20260807-5adc24 dispatched no parameter check of any kind.'
  - 'IDEA-20260726-012 and H-PMA-001: those propose and freeze a mathematical mechanism. This entry
    computes nothing about that mechanism and would return the identical verdict if the mechanism
    were replaced wholesale.'
  - 'The blacklisted self-audit lane (cost model, machine variance, single-machine timing, citation_verified
    markings, false-positive rate, findings-promotion gate): all of those audit the program''s process
    or its measurement apparatus. This audits a mathematical precondition stated inside one contract,
    and its tool applies to any contract in any lane.'
  - 'tools/validate_ledger.py and check_merge_hygiene.py as described in the repository conventions:
    those check record parseability and schema fields. Neither reads a parameter box as a constraint
    problem, and a schema-valid specification can be arithmetically uninstantiable, which is exactly
    the gap.'
  - 'A generic linter: a linter checks form. This checks a satisfiability question whose answer depends
    on the field the experiment declares, which no form check can see.'
  assumptions:
  - The number of elements of F_q that are nonzero and not equal to 1 is exactly q - 2; for q = 3,
    5, 7 that is 1, 3, 5. This is elementary counting and is re-derived in code rather than assumed.
  - There are exactly fifteen nonempty subsets of a four-element index set, hence fifteen d_S per
    instance under the frozen prescription p_S = (t+1)/(t+d_S) for every nonempty S.
  - The frozen phrase distinct nonzero values not equal to 1 binds pairwise across all fifteen d_S
    within one instance. This is the load-bearing reading and the audit must report the alternative
    reading and its verdict rather than silently choosing.
  - The parser reads the frozen YAML as committed; no interpretation beyond the extracted constraint
    vocabulary is applied, and any constraint the vocabulary cannot express is reported as out of
    scope, never as satisfied.
  predictions:
  - metric: satisfiability_verdict_F3_F5_F7_under_pairwise_reading
    direction: different
    minimum_effect: UNSATISFIABLE at all three, with counting witnesses 1 < 15, 3 < 15, 5 < 15
  - metric: satisfiability_verdict_Q
    direction: different
    minimum_effect: SATISFIABLE, with an explicit witness assignment of fifteen distinct rationals
  - metric: null_arm_misclassification_count
    direction: lower
    minimum_effect: exactly 0 across at least 200 synthetic specifications, in both directions
  - metric: fleet_sweep_machine_checkable_fraction
    direction: lower
    minimum_effect: 'I refuse to pre-commit a value. Reason: I have read one specification in full
      and skimmed the directory listing only; predicting what fraction of 540 experiment directories
      carry a machine-extractable parameter box would be a fabricated statistic under AGENTS.md rule
      5.'
  minimal_test:
    design: 'The whole discriminating measurement is a counting check on one file and costs no compute
      at all: read the frozen subset family and the frozen exclusion list out of experiments/EXP-PMA-001/specification.yaml,
      count the variables (fifteen), count the admissible domain per declared field (q - 2), and compare.
      That single comparison decides the primary claim at all four fields and can be done in under
      a second. Everything else in the contract exists to make the verdict trustworthy rather than
      to produce it: the null arm of 200 synthetic specifications establishes that the checker does
      not manufacture UNSATISFIABLE verdicts, and the fleet sweep establishes whether the tool has
      any life beyond this contract. The cheapest honest version is therefore stage 1 plus stage 2
      plus the null arm, all of which run in seconds and none of which touch a matrix, a minor, a
      discriminant or a field extension. If the null arm misclassifies even one synthetic case, the
      primary verdict is withheld entirely.'
    controls:
    - 'Null arm: at least 200 synthetic specification files of the same shape with constructed ground
      truth, half satisfiable and half not, run through the identical parser and solver in the same
      invocation.'
    - 'Hand-construction control: for every field the audit calls SATISFIABLE, it must emit an explicit
      witness assignment, and an independent routine must verify the witness satisfies every extracted
      constraint.'
    - 'Ambiguity control: the audit must report the alternative reading of the distinctness clause
      and its verdict under that reading, so a single reading is never presented as the contract''s
      meaning.'
    - 'Out-of-scope control: constraints the vocabulary cannot express (nondegeneracy of the resulting
      discriminants, pole non-collision) are enumerated and reported as unchecked, never folded into
      a SATISFIABLE verdict.'
    - 'Parser fidelity control: the extracted constraint set is printed verbatim alongside the source
      lines it came from, so a reader can check the extraction rather than trust it.'
    required_metrics:
    - per-field verdict (SATISFIABLE, UNSATISFIABLE, AMBIGUOUS, OUT_OF_SCOPE) for EXP-PMA-001
    - 'per-field counting certificate: required distinct variable count versus available domain size'
    - witness assignment for every SATISFIABLE verdict, plus independent witness verification result
    - verdict under the alternative reading of the distinctness clause
    - null-arm false UNSATISFIABLE count and false SATISFIABLE count
    - 'fleet sweep: number of experiment specifications parsed, number with an extractable parameter
      box, verdict histogram'
    - list of constraints reported OUT_OF_SCOPE, per specification
  falsification_conditions:
  - 'The null arm produces any false UNSATISFIABLE: the checker slanders contracts and its real verdict
    must be withheld.'
  - 'The null arm produces any false SATISFIABLE: the checker is unsound and cannot be used as a gate.'
  - 'A hand construction instantiates fifteen pairwise-distinct admissible d_S over F_3, F_5 or F_7,
    contradicting the counting certificate: the counting is wrong and the entire entry collapses.'
  - 'The parser''s extracted constraint set does not match the verbatim source lines it prints: extraction
    is unreliable.'
  - The verdict is identical under both readings of the distinctness clause at every field, meaning
    the ambiguity the entry claims to force is not actually load-bearing.
  - The fleet sweep finds that no specification other than EXP-PMA-001 carries an extractable parameter
    box, meaning the tool has no reuse value and the deliverable is one verdict rather than an instrument.
  confounders:
  - The frozen text may intend distinctness within a smaller family (say only the four singleton subsets),
    in which case the requirement is four distinct values, satisfiable at q = 5 and q = 7 but still
    not at q = 3. Reporting one reading as the reading would be the central error and the ambiguity
    control exists for it.
  - The parameter box may be intended to draw from a larger set than the constant field -- for example
    from k[t] or from k(t) itself rather than from k -- in which case the domain is infinite and everything
    is satisfiable. The audit must report which domain the frozen text names and refuse to infer one.
  - An UNSATISFIABLE verdict could be read as a criticism of the mechanism rather than of the contract;
    the record must state on its face that the mechanism is untouched.
  - A specification may satisfy the counting check and still be uninstantiable for reasons outside
    the vocabulary (all admissible assignments producing degenerate discriminants), so SATISFIABLE
    here is a necessary condition only.
  - YAML block-scalar folding can silently join or split constraint sentences, changing what the parser
    extracts; the verbatim-source control exists for this.
  interpretation_limits:
  - This audits a contract, not a mathematics. An UNSATISFIABLE verdict is repaired by a Coordinator
    amendment to the parameter box and implies nothing about whether divisor parity obstructs PMA4
    over k(t).
  - SATISFIABLE is a necessary condition for instantiability and never a sufficient one; constraints
    outside the extracted vocabulary are listed as unchecked.
  - The audit is decisive only over finite constant fields; over k = Q and any infinite field it returns
    a trivially satisfiable verdict with no information content, and that must not be read as a positive
    finding.
  - The fleet sweep measures how many contracts expose a machine-checkable parameter box, which is
    a statement about how contracts are written in this repository, not about their correctness.
  target_complexity:
    time_exponent: No attack exponent is claimed. The audit is a counting comparison per specification,
      linear in the number of declared variables and fields.
    memory_exponent: No attack exponent is claimed. Memory is the size of the parsed specification.
    best_known: The incumbent gate is the existing pre-dispatch check described in DEC-20260807-5adc24
      -- verify that an experiment's status, approved_by, and cited authorising decision are real
      and on point -- plus the repository's schema and parseability checks (tools/validate_ledger.py,
      check_merge_hygiene.py as described in the repository conventions). None of those reads parameter
      arithmetic, which is the gap this entry occupies.
    hidden_overhead: 'Almost all the cost is human and sits in the constraint vocabulary: deciding
      what a frozen English sentence in a YAML block scalar actually constrains is the hard part,
      and a vocabulary that is too eager will produce false UNSATISFIABLE verdicts against contracts
      that are fine. The null arm is the entire defence and it must be built before the real verdict
      is reported, which inverts the usual ordering and is easy to skip under time pressure.'
  dominated_by: 'n/a (no result claimed). Checked explicitly across time, memory and data/query axes:
    this entry produces no cryptanalytic quantity, no source-to-scalar candidate, and no algorithm,
    so there is no frontier row for it to sit on or under.'
  sota_delta: 'no attack; conceptual/measurement contribution only. The only quantitative comparison
    available is internal: the existing pre-dispatch gate checks approval provenance and schema validity
    and would pass a specification requiring fifteen distinct elements from a one-element admissible
    set; this audit rejects it in under a second. That is a coverage difference in a contract checker,
    not a performance comparison with any method.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part B (the counting itself -- that q - 2 admissible values cannot supply
    fifteen distinct d_S at q in {3,5,7}): 0.97, because it is arithmetic I can check by hand and
    did; the residual 0.03 is entirely the risk that I have misread which family the distinctness
    clause binds. Part C-i (the ambiguity is real and load-bearing, i.e. the two readings give different
    verdicts at some field): 0.6, because under a singletons-only reading q = 5 and q = 7 become satisfiable
    while q = 3 does not, so the readings separate at two of three fields but agree at one. Part C-ii
    (the checker''s null arm passes with zero misclassifications): 0.8, straightforward but the constraint
    vocabulary is where bugs live. Part C-iii (the fleet sweep finds the tool reusable, i.e. at least
    a handful of other specifications expose an extractable parameter box): 0.35, and I decline to
    guess higher; most contracts in this repository state parameters in prose that a small vocabulary
    will not parse, and the honest likely outcome is a tool that works on few contracts.'
