idea:
  id: IDEA-20260820-6a0104
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Reused-state exchangeability defect in paired public SQIsign transcripts, provenance-corrected
  class: control
  corrects: IDEA-20260820-08e04e
  supersedes: IDEA-20260820-08e04e
  correction_scope: >-
    Preserves the predecessor's checkpoint-restoration mechanism, observables,
    controls, and tested boundary. It corrects citation provenance and removes
    the unsupported GRH wording; it does not report new evidence.
  claim: >-
    For a fixed toy implementation and declared checkpoint, restoring or
    duplicating mutable signing state before a second signature can create a
    conditional exchangeability defect in pairs of otherwise valid public
    transcripts. This is a falsifiable proposal under an explicit oracle, not a
    timing, retry-count, signature-length, key-recovery, forgery, or SSI claim.
  mechanism: >-
    O_state_reuse(k,j) restores the randomness or sampler state at checkpoint k
    before transcript j while messages and public domains are freshly sampled.
    Conditional pair features include repeated labelled public commitments,
    verifier-stratum equality, rank coincidences, conditional HSIC, and a frozen
    pair classifier. Shared hidden sampling branches can break pair
    exchangeability without changing either marginal transcript law.
  novelty_status: unverified
  status: proposed
  source_refs:
    - {id: RQ-SQISIGN-001, provenance: internal, verified_by: TASK-20260820-922be8}
    - {id: KN-TECH-057, provenance: internal, verified_by: TASK-20260820-922be8}
    - {id: KN-TECH-058, provenance: internal, verified_by: TASK-20260820-922be8}
    - {id: IDEA-20260820-08e04e, provenance: internal, verified_by: TASK-20260820-922be8}
    - id: SQIsign specification and implementation literature, exact primary source not retrieved
      provenance: recalled
      verified_by: null
  novelty_screen:
    method: Screened the 28 current direct-tree RQ-SQISIGN-001 proposals; no callable persistent knowledge search was available.
    verdict: Unverified; local differentiation and absence from an unavailable index are not literature novelty evidence.
  predictions:
    - metric: held-out conditional pair-classifier AUC
      direction: higher
      minimum_effect: AUC >= 0.60 with 95% lower bound above 0.55
    - metric: excess repeated-labelled-field probability
      direction: higher
      minimum_effect: absolute excess >= 0.02 with corrected p < 0.01
    - metric: true-simulator-null AUC
      direction: different
      minimum_effect: remain in [0.47,0.53] with no corrected rejection
  minimal_test:
    design: >-
      Generate balanced pairs from O_state_reuse, a fresh-state signer, a true
      simulator, and a positive that copies one labelled public field in 20% of
      pairs. Freeze features and thresholds before held-out messages and seeds.
    controls:
      - Matched fresh-state true-simulator null.
      - Fresh-state real-signer null.
      - Twenty-percent labelled-field-copy planted positive.
      - Semantically inert checkpoint on an unused diagnostic PRNG.
    required_metrics: [conditional_HSIC, pair_AUC, collision_excess, verification_rate]
  controls:
    - Genuine true-simulator null with independent state and matched transcript shape.
    - Planted dependence swept from copy probability 0.02 through 0.20.
    - Message and public-key permutation controls.
    - No wall-clock, retry, raw-length, power, cache, or branch-trace feature.
  falsification_conditions:
    - All primary reuse-arm metrics remain inside preregistered null bands while the planted positive has power >= 0.90.
    - An equal or larger effect appears under the true simulator or inert checkpoint.
    - Missing the planted positive, unequal parsing, or admitting an excluded channel invalidates rather than falsifies the test.
  confounders:
    - Deterministic message hashing can induce benign dependence.
    - Rejection conditioning can unbalance pair populations.
    - Parser normalization can create apparent equality.
    - Checkpoint instrumentation can perturb the random stream.
  interpretation_limits:
    - Toy distributional mismatch would not imply secret recovery or forgery.
    - A null closes only the chosen checkpoint, feature map, and implementation.
    - GOAL-SSI-001 and hard-problem assumptions are outside this proposal.
  fault_oracle:
    name: O_state_reuse
    intervention: Restore one declared mutable-state checkpoint before the second signature.
    exposed: Published transcript fields and ordinary verification/rejection only.
    excluded: [time, retry_count, signature_length, internal_state_value, power, cache, branch_trace]
  heuristic_assumptions:
    - id: H1
      statement: Conditional on fixed public inputs, fresh independent signer state makes the no-fault transcript pair exchangeable.
      rigorous_support: Exact when both states are independent draws from the same conditional distribution.
      validation_plan: Permutation-calibrate fresh-signer and true-simulator pairs before opening the reuse arm.
    - id: H2
      statement: The frozen public features retain at least one dependence introduced at the chosen checkpoint.
      rigorous_support: Guaranteed only for the labelled-field-copy planted generator.
      validation_plan: Sweep planted copy strength and preregister the minimum detectable effect.
  target_complexity:
    time_exponent: null
    memory_exponent: null
    best_known: >-
      Not a solver. KN-TECH-058 records unconditional Fp2 p^(1/2)(log p)^O(1)
      time with polynomial memory and a p^(1/3+o(1)) time-and-memory tier
