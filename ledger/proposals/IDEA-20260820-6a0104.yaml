    hidden_overhead: The audit is O(N log N) with frozen random features; the conditional baseline hides superpolynomial overhead and gives no concrete-performance conclusion.
    tradeoff_note: Feature dimension trades sample power against memory; no cryptanalytic exponent changes. The cited reduction cascade is inherited and unverified here; no GRH claim is made.
  cost_model:
    time: O(N log N) analysis after transcript generation
    memory: O(Nd), reducible to O(d) streaming moments
    data_or_queries: 4N signing or simulation invocations
    preprocessing: Freeze checkpoint, parser, public-field map, strata, splits, and thresholds
    oracle: One declared state restoration; no secret or side-channel output
    verification: O(N) signature verification plus independent statistic recomputation
  proof_search_map:
    exact_baseline_reproduction: Fresh-signer and true-simulator pair metrics agree within preregistered bands.
    observation_collision_search: Search message hashing, parser normalization, and rejection conditioning for the same observation.
    quantifier_order: For every fixed toy implementation, checkpoint, feature map, and sample budget, probability is over preregistered messages and seeds; no universal implementation claim.
    method_ceiling: Can certify only a public pair-law mismatch for the selected oracle.
    nearby_object_control: Restore a checkpoint of a diagnostic PRNG unused by signing.
