idea:
  id: IDEA-20260809-6c4035
  question_id: RQ-FNDSA-001
  added: '2026-08-09'
  title: FN-DSA's finite-precision channel is named by the research question's title, named by
    both hypotheses as the place the 9.5-bit margin is actually consumed, made a mandatory unfulfilled
    successor obligation by one of them, and designed by nobody -- while the discriminator that
    would measure it is already derived and left unused
  class: measurement
  claim: 'RQ-FNDSA-001''s title asks whether FN-DSA''s distribution deviates ''from floating-point
    or integer-reformulated sampler behaviour, not merely from timing'', and its target list names
    ''any integer-only or reformulated sampler in the draft versus the floating-point original''.
    Both hypotheses are strong and both sit entirely on the exact-arithmetic side. H-FNDSA-6a9cbb
    works ''in EXACT ARITHMETIC with EXACT one-dimensional leaf samplers'', derives a 9.5-bit
    shortfall, and states in its interpretation_limits verbatim: ''NOTHING HERE ADDRESSES: finite-precision
    arithmetic, any integer-only reformulation, the base sampler''s table, the recursion''s own
    error, timing, or any implementation. Those are the residual channels and they are where the
    9.5-bit margin can actually be consumed.'' Its clause F8 makes the successor MANDATORY --
    ''The batch has NOT finished unless it also emits the successor statement: the three residual
    channels (finite precision, the recursion, the base sampler''s table) with eps_crit as the
    threshold each must cross ... A negative without that statement is a fatigue report, not a
    closure.'' No hypothesis, proposal or contract targets any of the three. GOAL-FNDSA-001''s
    completion criterion -- a calibrated instrument yielding a measured deviation or an upper
    bound -- is fully satisfiable by the exact arm alone, which is the textbook case of a completion
    criterion satisfiable without answering the question.'
  mechanism: 'H-FNDSA-58b464 HAS ALREADY BUILT THE DISCRIMINATOR AND LEFT IT UNUSED. It derives
    that correlated leaf centers -- ''which a defective or reduced-precision ffSampling would
    produce'' -- drive the anisotropy decay exponent alpha from 2.00 to 1.00 and collapse the
    required signature count from 2^161.98 to about 2^68.98, and it says outright ''A MEASURED
    alpha NEAR 1.00 IS THEREFORE THE MOST VALUABLE OUTCOME AVAILABLE FROM THIS HYPOTHESIS.'' The
    missing design is the one that can produce it: run the same anisotropy instrument on an ffSampling
    recursion with the LEAF MANTISSA SWEPT (53, 40, 32, 24 bits) against the exact-arithmetic
    arm as the null object, and report alpha(precision) as a curve with the pre-registered 2.00
    and 1.00 endpoints as forced values and the existing 0.15 tolerance carried over unchanged.
    Cheap, uses instrumentation already fully specified in a frozen contract, and the negative
    -- alpha stays at 2.00 down to some precision floor -- is itself the eps_crit threshold clause
    F8 demands, so the design cannot return a fatigue report.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - 'I read all five FN-DSA proposals: IDEA-20260805-2bbfb2 is the leaf-normalizer theta defect
      ''even in exact arithmetic''; IDEA-20260805-4a6dc7 moves the exactness test down to the
      leaf where ground truth exists; IDEA-20260805-637a3b is the width homotopy from NTRUSign
      to FN-DSA; IDEA-20260801-010 is a generic distributional exactness probe ''independent of
      timing''. Every one is exact-arithmetic. H-FNDSA-58b464 mentions reduced precision only
      as the counterfactual that would move its decay exponent alpha, and does not vary precision
      anywhere in its protocol. So the exclusion is by written scope on one side and by an explicit,
      unfulfilled successor obligation on the other -- not by omission, and not by any record
      having considered and declined it.'
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: timing side channels, which
      the goal''s title explicitly sets aside (''not just its timing''). The object is the SAMPLER''S
      FINITE-PRECISION OUTPUT.'
    tracked_object: The anisotropy decay exponent alpha of the signature distribution, which H-FNDSA-58b464
      derives as the discriminator between an exact and a reduced-precision ffSampling.
    one_step_propagation_rule: Correlated leaf centers -- what a defective or reduced-precision
      sampler produces -- move alpha from 2.00 toward 1.00 by a derived relation; the exponent
      composes through the recursion.
    newness_score: The discriminator is already derived in a committed hypothesis and left unused.
      The content is that the quantity the question is named for has never been measured.
  lossy_projection_identifiability_audit:
    projection: the signature distribution -> one decay exponent alpha.
    what_is_discarded: The signatures themselves; only the anisotropy scaling is retained.
    is_it_only_a_change_of_coordinates: 'NO -- alpha is a single scalar summarising a distribution.
      Honest caveat: a WEAK object, but it is the one the existing derivation makes decisive,
      since alpha near 1.00 collapses the required signature count from 2^161.98 to about 2^68.98.'
    mirror_failure_check: CHECKED. alpha must be able to come out at 2.00. An exact sampler is
      predicted to give exactly that, so the measurement has a forced value on the null side.
  null_object_control:
    primary_null: AN EXACT-ARITHMETIC REFERENCE SAMPLER must return alpha = 2.00 within its measurement
      band. This is the null the hypothesis's own derivation supplies.
    secondary_nulls:
    - 'BIASED-SAMPLER POSITIVE CONTROL: a deliberately reduced-precision sampler of known precision
      must return alpha measurably below 2.00, or the instrument cannot see the effect it is for.
      GOAL-FNDSA-001''s next_action already requires this control before any detection claim.'
    - Report the measurement band before running, so a null result is interpretable.
  assumptions: []
  predictions:
  - metric: measured anisotropy decay exponent alpha
    direction: lower
    minimum_effect: Any value measurably below 2.00 at the shipped precision; H-FNDSA-58b464 calls
      a measured alpha near 1.00 'THE MOST VALUABLE OUTCOME AVAILABLE'.
  minimal_test:
    design: Measure alpha on signatures from the reference implementation at shipped precision;
      run the exact-arithmetic null and the biased-sampler positive control first; report alpha
      with its band and the implied signature count.
    controls:
    - exact-arithmetic reference sampler (alpha = 2.00)
    - biased-sampler positive control
    - pre-declared measurement band
    required_metrics:
    - alpha with confidence band
    - implied required signature count
    - positive-control detection threshold
  falsification_conditions:
  - 'alpha = 2.00 within band at shipped precision: the finite-precision channel is closed at
    this precision, which is a clean and valuable negative about a standards-track scheme.'
  - 'The biased-sampler control is not detected: the instrument lacks the power to support any
    conclusion.'
  - 'alpha cannot be estimated with a usable band at feasible signature counts: recorded as an
    instrumentation limit, not as evidence about the sampler.'
  confounders:
  - Signature count needed to resolve alpha may itself be large; report the achievable resolution
    before claiming a null.
  - Reference-implementation precision may differ from a deployed one; state which was measured.
  - alpha is a summary statistic; a sampler could be defective in a way alpha does not see.
  interpretation_limits:
  - A measured alpha is a distributional statement, not a key-recovery attack.
  - FIPS 206 is reportedly still in review, so a finding could reach the standard -- which raises
    the bar on the controls, not lowers it.
  heuristic_assumptions:
  - id: HEUR-FPREC-1
    statement: alpha is a faithful discriminator between exact and reduced-precision ffSampling.
    rigorous_support: It is derived in H-FNDSA-58b464 and never measured.
    validation_plan: The biased-sampler positive control tests exactly this assumption and must
      run first.
  target_complexity:
    time_exponent: 'Attack cost scales with the required signature count, which alpha controls:
      2^161.98 at alpha = 2.00 versus about 2^68.98 at alpha = 1.00 per H-FNDSA-58b464.'
    memory_exponent: n/a
    best_known: No published finite-precision key recovery at FN-DSA parameters is claimed here.
    hidden_overhead: Signature-collection cost, charged explicitly.
    tradeoff_note: The exponent moves only if alpha moves; this record measures alpha and claims
      nothing about it in advance.
  dominated_by: The published FN-DSA security analysis. No attack row is added; this measures
    a quantity the analysis assumes.
  sota_delta: ZERO on every attack axis; no attack is proposed. FIPS 206 is recorded in the goal
    as still in review, making this one of the few live standardization windows in the corpus.
    It converts a self-declared unfinished obligation into a measured curve, it targets the exact
    channel both hypotheses agree carries the residual risk, and it is the only FN-DSA design
    that could produce the outcome one of those hypotheses names as the most valuable available
    to it.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 0.85 that alpha is measurable with a usable band. 0.75 that it comes
    out at 2.00 at shipped precision -- the reference implementation is careful and a deviation
    would be surprising. 0.1 that it is measurably below 2.00, which would be a major finding
    on a standards-track scheme and would need immediate independent replication before any statement.
