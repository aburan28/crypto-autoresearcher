idea:
  id: IDEA-20260807-761a8c
  question_id: RQ-CANL-63098f
  added: '2026-08-07'
  title: >-
    THE SMALL-p ARTIFACT NULL FOR EVERY HEIGHT MEASUREMENT IN THIS LANE: at
    p = 101 a naive lift has 7-bit coordinates and a rank-2 curve's low-height
    points already cover ~4.5% of E(F_p), so ANY "CM helps" signal below
    p ~ 10^4 is presumptively the abundance of small integers -- the
    instrument must show the covering fraction decaying like
    (log p)^{r/2} Reg^{-1/2} / p with slope -1 against p, and must detect a
    planted lift, before any L9 number is believed
  class: control

  claim: >-
    (A) THE FAILURE MODE THIS RECORD EXISTS TO PREVENT. Every other L9 record
    measures a height-derived quantity at toy p. The quantity that decides all
    of them is the covering fraction
        rho_lift(B) = |{P in E(F_p) : P = red(P~), hhat(P~) <= B}| / N.
    At the scales this campaign can run, rho_lift is LARGE FOR A REASON THAT
    HAS NOTHING TO DO WITH ARITHMETIC. A naive x-lift takes x in [0, p), which
    is log_2 p bits -- 7 bits at p = 101, 20 bits at p = 10^6. The number of
    global points with naive height at most log p on a rank-r curve is
    ~(log p)^{r/2} Reg^{-1/2}, so
        rho_lift ~ (log p)^{r/2} / (Reg^{1/2} p).
    NUMERICALLY, at r = 2 and Reg ~ 1: p = 101 gives ~4.6/101 = 4.5%;
    p = 10^4 gives ~9.2/10^4 = 0.09%; p = 2^30 gives ~2e-8. THE SIGNAL FALLS
    BY SEVEN ORDERS OF MAGNITUDE OVER THE RANGE A TOY EXPERIMENT SPANS. A
    measurement taken at one small p, or averaged over a narrow ladder, will
    show an apparently substantial lifting success that is pure small-integer
    abundance, and it will look exactly like a CM effect if the CM arm happens
    to sit at smaller p or smaller regulator.

    (B) THE INSTRUMENT, AND ITS TWO REQUIRED DIRECTIONS. Per
    docs/inventor-protocol.md ("controls before belief") and DECOMPOSITION.md
    L14, an instrument must FAIL to detect a signal in a matched null AND must
    DETECT a planted one. This record specifies both for L9:
      NEGATIVE DIRECTION -- the instrument must return no CM excess on a
        matched non-CM curve, and the covering fraction must DECAY with slope
        -1 against p at fixed B. A covering fraction that does not decay is the
        canonical artifact tell.
      POSITIVE DIRECTION -- the instrument must recover a PLANTED lift:
        choose P~ on the global curve with known small height, set the
        "target" to red(P~), and confirm the pipeline finds P~ at the
        corresponding B. An instrument that cannot find a lift that is there
        cannot report that lifts are absent.

    (C) THE NULL OBJECTS, NAMED, EACH WITH THE PARAMETER THAT MUST DESTROY IT.
      N1 MATCHED NON-CM CURVE. Same exhibited rank, minimal discriminant
        within a factor 2, same p, same enumeration box. Destroys: any claim
        attributing a covering fraction to CM. Decay parameter p.
      N2 RANDOM LATTICE WITH MATCHED REGULATOR AND A RANDOM SURJECTION ONTO
        Z/N. Same shape, no arithmetic. Destroys: any claim that a covering
        EXPONENT is arithmetic rather than lattice-shape. Decay parameter:
        rank -- the exponent must move with r and with nothing else.
      N3 SYNTHETIC O-ACTION. A random order-3 or order-4 Z-linear isometry of
        the Mordell-Weil lattice substituted for the genuine zeta action.
        Destroys: any claim that the O-module structure, rather than a
        lattice symmetry, produced an effect. Decay parameter |D_E|: the
        genuine action's companion-height ratio must grow like sqrt(|D_E|)
        and the synthetic one's must not.
      N4 TARGET RESHUFFLE. Resample k with the curve, the lift and P fixed.
        Every curve-only statistic must be unchanged. Destroys: any claim that
        a curve statistic carries information about the discrete log -- which
        is DECOMPOSITION.md L7's canonical control and applies verbatim here.
      N5 TORSION-ONLY ARM. A rank-0 CM curve, where the covering fraction is
        forced to |tors|/N = O(1)/N at every B. Destroys: any pipeline that
        reports non-trivial coverage where none can exist.

    (D) THE DECAY LAW, PRE-REGISTERED SO IT CANNOT BE TUNED. At fixed naive
    height bound H (in bits), across a ladder of p:
        log rho_lift = (r/2) log H - (1/2) log Reg - log p + const,
    so the slope against log p is EXACTLY -1, for every rank, every
    regulator, CM or not. THAT SLOPE IS THE INSTRUMENT'S CALIBRATION AND IT IS
    RANK-INDEPENDENT, which makes it a strong test: a fitted slope materially
    different from -1 on either arm indicts the pipeline before any arithmetic
    conclusion is drawn.

    (E) WHY THIS IS A PROPOSAL AND NOT A FOOTNOTE. Without it, the most likely
    outcome of this lane is a toy-scale measurement showing that CM lifts
    "cover 3% of E(F_p) while random curves cover 1%", reported as a CM
    advantage, when the entire effect is that the CM arm sat at p = 101 with
    a smaller regulator. The campaign has an explicit precedent for a
    formalisation error surviving an exact computation (KN-FIND-008: "an exact
    count removes sampling error. It removes no model error, and in this case
    model error dominated the result"). This record is the model-error control
    for L9 and it is blocking for every other L9 proposal.

  resource_label: >-
    "audit: consumes no resource. The instrument measures other lanes' use of
    R6 and R3; it consumes neither and mounts no attack."
  admissibility: admissible
  admissibility_argument: >-
    A control lane consumes no resource and therefore cannot fail the
    admissibility filter; it also cannot produce an attack, which is stated so
    the record is not mistaken for one. Its admissibility question is
    inverted: the instrument must be able to DETECT resource use, i.e. it must
    separate a genuine R3/R6 effect from a lattice-shape or small-p effect.
    Null N3 is exactly that test, and if N3 reproduces a claimed CM effect
    then that effect never used R3 at all and the proposal it came from is
    retrospectively inadmissible on its own terms.

  discriminated_from:
    - >-
      DECOMPOSITION.md L14 / RQ-INSTR-f8faa0: the campaign's general
      instrumentation lane. This record is the L9-SPECIFIC instantiation: the
      quantity is the covering fraction, the decay law is slope -1 against p,
      and the nulls are five named objects specific to lifts and CM. It does
      not duplicate L14's general mandate; it discharges it for one lane.
    - >-
      IDEA-20260807-44ba75 and IDEA-20260807-6533fd, which MEASURE rho_lift
      and beta. This record specifies the controls those measurements must
      pass and is blocking for both. It must be run first or alongside, never
      after.
    - >-
      KN-FIND-008's methodological finding (exact counting removes sampling
      but not model error). This record operationalises that lesson for L9; it
      cites it and does not restate it as new.
    - >-
      L7 / RQ-TORS-8c7b79's k-resampling control, which this record adopts as
      null N4 with attribution rather than reinventing.

  object_first_candidate:
    tracked_object: >-
      THE DECAY SLOPE of the covering fraction against log p at fixed height
      bound. One number per arm per curve family, whose forced value is -1.
    lossiness: >-
      LOSSY: it discards the curve, the field, the CM structure and the
      absolute magnitude of the covering fraction, keeping only how that
      magnitude responds to p. The discard is compatible with the operation
      that matters because the response to p is governed entirely by the
      denominator N ~ p in rho_lift, which is invariant under everything else
      the lane varies. That invariance is exactly what makes the slope a
      calibration rather than a measurement: it is the same for CM and non-CM,
      every rank, every regulator. It is NOT a change of coordinates -- two
      pipelines with the same absolute covering fraction and different slopes
      are distinguishable, and one of them is broken.
    propagation: >-
      One step = one increment of p along the ladder. The slope propagates as
      the local finite difference of log rho_lift, measurable directly.
    survival_score: >-
      SURVIVES: every arithmetic change the lane makes. DIES: when rho_lift
      saturates (coverage near 1) or hits zero (no points found), i.e. at the
      two ends of the ladder, which is why the ladder must be chosen so that
      the middle decades are informative and the ends are reported as
      censored rather than as data.

  mechanism: >-
    STEP 1 -- FIX THE ENUMERATION BOX AND FREEZE IT. x = u/w^2 with
    |u| <= U, 1 <= w <= W, both declared in bits, identical across every arm.
    Any arm using a different box is not comparable and must not be pooled.
    STEP 2 -- BUILD THE LADDER. At least 5 primes spanning >= 3 decades
    (e.g. 101, 1009, 10007, 100003, 1000003), with the SAME global curves
    reduced at each -- so the global side is held exactly fixed and only p
    varies. THIS IS THE DESIGN CHOICE THAT MAKES THE SLOPE TEST CLEAN: with
    the curve fixed, Reg and r are constants and the only p-dependence is the
    1/N.
    STEP 3 -- MEASURE rho_lift ON EVERY ARM AND FIT THE SLOPE. Report the
    slope with a jackknife interval per arm.
    STEP 4 -- RUN THE FIVE NULLS. N1-N5 as specified in part (C), on the
    identical pipeline, with identical box and ladder.
    STEP 5 -- PLANT AND RECOVER. For each global curve, pick P~ with hhat
    below the smallest ladder bound, set Q := red(P~), and confirm recovery at
    every p. Report recovery rate; anything below 100% is an instrument bug.
    STEP 6 -- PLANT A NEGATIVE. Set Q to a point known NOT to be in red(S)
    (constructible by taking Q outside the subgroup generated by the
    reductions of the exhibited generators, when that subgroup is proper). The
    instrument must report failure. An instrument that "finds" a lift for an
    unliftable target is worse than useless.
    STEP 7 -- ISSUE A CALIBRATION CERTIFICATE. A short machine-readable record
    stating box, ladder, slopes per arm, null outcomes, planted-positive and
    planted-negative results. NO OTHER L9 MEASUREMENT MAY BE REPORTED WITHOUT
    CITING A PASSING CERTIFICATE.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      2026-08-07 shared L9 screen plus reads of DECOMPOSITION.md L14 and L7,
      KN-FIND-008, and docs/inventor-protocol.md section 3 as summarised in
      KN-TECH-056.
    results: >-
      The general "controls before belief" mandate and the k-resampling
      control exist (KN-TECH-056, L7, L14). The specific decay law
      rho_lift ~ (log p)^{r/2} Reg^{-1/2}/p with forced slope -1, the
      four-percent-at-p-101 numeric, and the five named L9 nulls appear
      nowhere.
    verdict: >-
      ADAPTATION. The methodology is the program's own and is cited; the
      instantiation, the forced slope, and the null battery are new to this
      lane. No external novelty is claimed.

  null_object_control: >-
    THIS RECORD IS THE NULL OBJECT CONTROL, and it carries its own: the
    instrument itself must be validated against a case with a CLOSED-FORM
    answer. On a rank-1 curve with generator P0, red(S) is exactly the set of
    multiples [m]red(P0) with m^2 hhat(P0) <= B, so rho_lift has an exact
    closed form. The pipeline must reproduce it as an EXACT INTEGER at every
    ladder point. DECAY PARAMETER for the instrument's own validation: B. The
    closed-form count must grow like sqrt(B) and the measured count must match
    it term by term; a measured count that fails to track sqrt(B) means the
    enumeration box is not covering the height ball and every downstream
    number is biased.

  assumptions:
    - >-
      hhat and the naive height differ by O(log|Delta|), so a naive-height box
      approximates a canonical-height ball up to a curve-dependent shift. The
      shift is MEASURED per curve and reported, not assumed small.
    - >-
      Holding the global curve fixed across the ladder holds r and Reg fixed.
      True by construction and is the design's main strength.
    - >-
      N ~ p for the primes used, i.e. the curves are chosen with near-prime
      order so that log N and log p are interchangeable to within a bit. Any
      curve with a large cofactor is excluded and the exclusion is recorded.
    - >-
      Reduction is defined at every ladder prime for the chosen global curves,
      i.e. p is a prime of good reduction. Checked per (curve, p) and bad
      primes are dropped with a recorded reason, never silently.

  proof_search_map:
    not_applicable_reason: >-
      This is a purely empirical instrumentation proposal. It proves no
      theorem, states no asymptotic bound, constructs no certificate family
      and offers no reduction; its output is a calibration certificate. The
      one derived quantity -- the forced slope -1 -- follows in one line from
      rho_lift's denominator and is stated in part (D) rather than requiring a
      proof architecture. KN-TECH-080's audits are therefore not applicable,
      and this field records that rather than omitting them.

  predictions:
    - metric: >-
        fitted slope of log rho_lift against log p at fixed height box, per
        arm, with the global curve held fixed
      direction: different
      minimum_effect: >-
        FORCED VALUE -1.00, jackknife interval within +-0.15, on EVERY arm
        including every null. A slope outside that band on any arm indicts the
        pipeline and blocks every L9 measurement until it is fixed.
    - metric: >-
        rho_lift at p = 101 on a rank-2 curve with Reg ~ 1
      direction: higher
      minimum_effect: >-
        Predicted a few percent (order 1-10%). THIS PREDICTION IS THE POINT:
        it is the artifact, pre-registered so that when it appears nobody
        mistakes it for a result. Its absence would mean the enumeration box
        is far too small and the ladder must be redesigned.
    - metric: >-
        CM-versus-N1 excess ratio, per ladder point
      direction: different
      minimum_effect: >-
        Predicted 1.0 within a factor 2 at every ladder point AND with the
        same slope. An excess that is large at small p and vanishes at large p
        is the artifact; an excess that is CONSTANT across three decades is
        the only shape that could be arithmetic, and it is the pre-registered
        signal.
    - metric: >-
        companion-height ratio under the genuine O-action versus null N3
      direction: higher
      minimum_effect: >-
        Genuine: must grow like sqrt(|D_E|)/2 (fd5a24's forced value).
        Synthetic N3: must stay O(1). If N3 also grows, the "CM" effect is a
        lattice-symmetry artifact.
    - metric: >-
        planted-positive recovery rate and planted-negative false-positive rate
      direction: different
      minimum_effect: >-
        FORCED: recovery 100%, false positives 0%. Either failure halts the
        lane; these are the two directions the inventor protocol requires.
    - metric: >-
        k-resample invariance (null N4): change in every curve-only statistic
      direction: different
      minimum_effect: >-
        FORCED VALUE: exactly zero change. A nonzero change means a curve
        statistic is leaking target information through the implementation,
        which is a bug and, if unnoticed, would manufacture a spectacular
        false positive.

  minimal_test:
    design: >-
      STAGE 0 (minutes, HARD GATE): rank-1 closed-form validation of the
      enumeration; exact integer match at every B or the line halts.
      STAGE 1 (hours): the ladder measurement on 6 global curves (3 CM with
      h(D_E)=1, 3 matched non-CM) at 5 primes, fixed box.
      STAGE 2 (hours): nulls N1-N5 on the identical pipeline.
      STAGE 3 (minutes): planted positive and planted negative.
      STAGE 4 (minutes): fit all slopes with jackknife intervals.
      STAGE 5 (zero compute): emit the calibration certificate; declare
      pass/fail per arm.
    controls:
      - Rank-1 closed form (instrument self-validation).
      - N1 matched non-CM curve.
      - N2 random lattice with matched regulator.
      - N3 synthetic O-action.
      - N4 k-resample invariance.
      - N5 rank-0 torsion-only arm.
      - Planted positive and planted negative.
    required_metrics:
      - "rho_lift per (curve, p, B), exact counts and denominators"
      - Fitted slope with jackknife interval per arm
      - "Empirical max |hhat - h_x/2| per curve"
      - Excess ratios CM/N1 per ladder point
      - Companion-height ratio, genuine and N3
      - Planted-positive recovery and planted-negative false-positive rates
      - Enumeration box (U, W), ladder, and every dropped (curve, p) with reason

  falsification_conditions:
    - >-
      The rank-1 closed form does not reproduce exactly. The enumeration is
      wrong; nothing in L9 may be reported until it is fixed.
    - >-
      Any arm's slope falls outside -1.00 +- 0.15. The pipeline is not
      measuring what the decay law says it measures.
    - >-
      Null N3 reproduces the genuine O-action's companion-height growth. The
      "CM effect" is a lattice symmetry and every CM attribution in this lane
      must be withdrawn.
    - >-
      Null N4 shows any curve-only statistic moving with k. Implementation
      leak; halt.
    - >-
      Null N5 shows non-trivial coverage on a rank-0 curve. The counter is
      including torsion or twists.
    - >-
      Planted positive recovery below 100% or planted negative false positives
      above 0%. The instrument fails in one of the two required directions and
      no L9 negative may be reported from it (AGENTS.md rule 5; inventor
      protocol section 3).

  confounders:
    - >-
      Cofactor. If #E(F_p) has a large cofactor, N is not ~p and the slope
      test is misapplied. Excluded by curve selection and recorded.
    - >-
      Enumeration box shape. A naive-height box is not a canonical-height
      ball; the distortion is curve-dependent through log|Delta| and is
      reported per curve so cross-arm comparisons are interpretable.
    - >-
      Regulator estimation from exhibited generators can be off by the square
      of a finite index, shifting rho_lift's intercept. Slopes only.
    - >-
      Ladder ends. At the small end coverage saturates; at the large end no
      points are found. Both are censored cells and must be reported as
      censored, never as measurements (AGENTS.md rule 5).
    - >-
      Twist coupling. Reducing one global curve at several p gives curves of
      unrelated group structure; this is intended (it holds the global side
      fixed) but it means the ARITHMETIC of E(F_p) varies uncontrolled across
      the ladder, so only the 1/N dependence may be read from it.

  interpretation_limits:
    - >-
      This record produces no mathematical result about lifting, CM, or ECDLP.
      Its entire output is a calibration certificate.
    - >-
      A passing certificate does NOT validate any L9 conclusion. It only
      removes one class of artifact. A failing certificate DOES block every
      L9 conclusion drawn from the same pipeline.
    - >-
      Toy scale throughout; the ladder tops out where the enumeration does.
      The decay law's extrapolation to crypto p is arithmetic, not measurement,
      and must be labelled as such.
    - >-
      "No CM excess was found" from this instrument means "no CM excess above
      the instrument's sensitivity at the tested ladder", and the sensitivity
      must be quoted with it.

  heuristic_assumptions:
    - id: HEUR-CANL-C1
      statement: >-
        FOR ALL fixed global curves and FOR ALL ladder primes of good
        reduction, rho_lift(p) = c(curve, B) / p * (1 + o(1)), so the slope
        against log p is -1 uniformly.
      rigorous_support: >-
        Rigorous given that the numerator |red(S)| is independent of p (the
        global point set is fixed) and injective into E(F_p) for p large
        enough that distinct global points of bounded height have distinct
        reductions -- which holds once p exceeds the largest difference's
        denominator, a computable bound per curve. The classical distribution
        theorem imitated for the remaining small primes is the birthday bound
        for a uniform map into N residues.
      falsification_condition: A fitted slope outside -1.00 +- 0.15 on any arm.
      validation_plan: >-
        Sample: 6 global curves x 5 primes x 8 height bounds. Predicted
        distribution: slope -1 on every arm, with residuals consistent with
        the injectivity bound at the smallest primes. Tail check: report the
        two ladder points with the largest residual and the computed
        injectivity threshold per curve. TOY SCALE ONLY, and the certificate
        says so on its face.
    - id: HEUR-CANL-C2
      statement: >-
        The naive-height enumeration box captures a constant fraction of the
        canonical-height ball of the corresponding radius, uniformly over the
        tested curves.
      rigorous_support: >-
        The height comparison |hhat - h_x/2| = O(log|Delta|) gives inclusions
        of balls with a shift, hence a constant-fraction capture with the
        constant depending on |Delta|. The heuristic is uniformity over the
        curve set, and it is MEASURED (the empirical max shift per curve is a
        required metric) rather than assumed.
      falsification_condition: >-
        A measured shift differing by more than a factor 2 across arms, which
        would make cross-arm ratios uninterpretable.
      validation_plan: >-
        Report the empirical shift distribution per curve and the implied
        capture fraction; if arms differ materially, re-match the arms on
        |Delta| before any ratio is reported.

  target_complexity:
    time_exponent: >-
      NO ATTACK IS PROPOSED AND NO EXPONENT IS CLAIMED. The instrument's own
      cost is the enumeration: O(U W) trial x-values per curve, independent of
      p, run once and reduced at every ladder point -- which is why the ladder
      design is cheap.
    memory_exponent: >-
      O(|S|) stored global points, a few million entries at the largest box,
      well inside the toy budget.
    best_known: >-
      For the attack baselines this lane is charged against: parallel rho at
      0.886 sqrt(N), O(1) memory (KN-TECH-001, KN-TECH-006); CM-discounted rho
      (KN-TECH-018); BSGS (KN-TECH-031). For instrumentation there is no
      incumbent specific to L9; the general mandate is L14 / RQ-INSTR-f8faa0.
    hidden_overhead: >-
      None hidden. The one honest disclosure is that the instrument's
      sensitivity floor is 1/|S|: an excess smaller than one point out of the
      enumerated set is invisible, and every "no excess" verdict must quote
      that floor.
    tradeoff_note: >-
      Not applicable; no algorithm. The enumeration trades U W against
      sensitivity linearly and that tradeoff is reported with the certificate.

  dominated_by: >-
    "n/a as an attack (no result claimed): this record mounts no attack, so on
    the attack frontier it is trivially dominated by every row -- parallel rho
    at 0.886 sqrt(N) time and O(1) memory (KN-TECH-001/006), CM-discounted rho
    (KN-TECH-018), and BSGS at sqrt(N)/sqrt(N) (KN-TECH-031) -- checked across
    time, memory and data/queries. As an INSTRUMENT the incumbent is the
    general L14 mandate (RQ-INSTR-f8faa0), which dominates this record on
    scope (it covers all fourteen lanes) and is dominated by it on specificity
    (it names no L9 quantity, no decay law and no null). NOT null."
  sota_delta: >-
    Zero attack speedup, by construction. Instrument delta stated as numbers:
    supplies one forced calibration constant (slope -1.00 +- 0.15), five named
    null objects, two required detection directions (planted positive at 100%,
    planted negative at 0%), one closed-form self-validation, and a
    sensitivity floor of 1/|S| that every downstream L9 verdict must quote.
    Before this record, L9 had zero of those.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that the instrument passes its own closed-form validation. 0.8 that
    every arm fits slope -1 within band -- the risk is the smallest ladder
    primes, where injectivity fails and the residual is expected. 0.95 that
    the p = 101 artifact appears at a few percent as predicted, which is the
    record's main didactic point. This proposal is very likely to succeed and
    its value is that it makes every other L9 negative citable; without it the
    lane's most likely output is a confidently reported small-p artifact.

  id_allocation_provenance: >-
    Coordinator pre-allocated in BATCH-cb71b5 via python3 tools/allocate_id.py
    --next idea --date 20260807; block recorded in
    coordination/goals/GOAL-ENDO-001/batches/BATCH-cb71b5/id_allocation.json;
    all 126 verified free with --check.

  reachability_gate: >-
    T5 NOT APPLICABLE AS AN ATTACK GATE -- this record moves between no
    curves and reaches for no object. It is recorded rather than omitted
    because the instrument DOES move between curves in one sense: it reduces
    ONE fixed global curve at MANY primes, which is the reverse of the lane's
    direction and costs O(1) per ladder point (a reduction of integer
    coefficients mod p). That reversal is what makes the ladder affordable,
    and it is precisely why the instrument can be run before the expensive
    canonical-lift construction priced in IDEA-20260807-ee6ef7 at
    p^{1+o(1)}: the calibration does not require any canonical lift at all,
    only global curves with known CM. So the instrument's gate cost is
    polylog(p) per point and it is reachable in every regime, including the
    ones where the lane's own object is not.

