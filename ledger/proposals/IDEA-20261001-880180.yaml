# =============================================================================
# IDEA-20261001-880180 -- Matched-dim(V) poly vs normal basis usable_dimensions
# divergence on toy Koblitz. Orthogonal to dim(V^(2)) co-meter and gate tests.
# =============================================================================
idea:
  id: IDEA-20261001-880180
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    AT FIXED dim(V), DOES POLYNOMIAL vs NORMAL BASIS CHANGE |usable_dimensions|?
    On toy Koblitz n∈{17,23,31}, for matched F_2-subspaces with the same
    dimension ℓ, measure whether the Part-1 usable_dimensions cardinality
    diverges across ambient bases beyond a pre-registered absolute threshold.

  class: heuristic_validation

  claim: >-
    Part-1 emptiness and product-space co-meters (IDEA-20261001-11aa69 /
    IDEA-20261001-fbee3f) hold the ambient basis fixed. CLAIM: at each toy
    n∈{17,23,31}, for ≥20 matched pairs (V_poly, V_normal) with
    dim V_poly = dim V_normal = ℓ∈{⌊n/8⌋..⌊n/4⌋}, the median absolute
    difference | |usable_dimensions(V_poly)| − |usable_dimensions(V_normal)| |
    is ≥ 1 — OR the median is 0 and the bases are recorded as equivalent for
    this predicate at this scale. CLAIM TIER: heuristic_validation.
    NO break. NO exponent. NO n≥131 transfer. NO PDP success claim.

  mechanism: >-
    OBJECT FRAME. Representation: the same abstract F_2-subspace V realized
    once in a polynomial basis and once in a normal basis of F_{2^n}.
    Operation set: evaluate the Part-1 usable_dimensions predicate only
    (no Semaev solve, no walk). Trichotomy: Class II coordinate-dependent —
    the predicate may depend on the coordinate embedding of V, not on a
    group homomorphism. Lossy-projection: comparing two embeddings of the
    same dim discards the concrete span generators; if the predicate is
    basis-invariant the difference is 0 (null). OFF-LIMITS: F2 factor-base
    decomposition as primary lens; choosing V to claim PDP speedup.
    WHAT IS NEW: a matched-dim basis-swap meter for usable_dimensions,
    not a product-space correlation and not an HW-pool Bailey comparison.

  novelty_status: unverified
