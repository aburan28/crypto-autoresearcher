  assumptions:
    - Same usable_dimensions predicate code hash as Part-1 / 11aa69 scope.
    - Toy n only; matched dim pairs required; no basis cherry-picking after score.
    - No PDP / exponent inference from a nonzero median alone.

  heuristic_assumptions:
    - id: HEUR-BINSTD-880180-H1
      formal_statement: >-
        FORALL n∈{17,23,31}, over a pre-registered set P_n of ≥20 matched
        pairs with dim V=ℓ∈[⌊n/8⌋,⌊n/4⌋]: median_abs_diff
        ( |usable_dimensions(V_poly)|, |usable_dimensions(V_normal)| ) ≥ 1.
      random_model_justification: >-
        Rigorous: usable_dimensions is an exact predicate of the coordinate
        realization of V. Classical: KR-IC-73db3f treats polynomial geometric
        spans as the default cheap V; whether the program's predicate is
        invariant under the normal-basis re-embedding is the transfer
        hypothesis under test.
      supporting_results:
        - KR-IC-73db3f
      validation_experiment_ids: []
      falsification_condition: >-
        Median absolute difference = 0 on frozen P_n at every toy n, OR
        re-running with shuffled pair labels yields the same nonzero median
        (artifact tell).

  predictions:
    - metric: median_abs_diff_usable_dimensions_poly_vs_normal
      direction: higher
      minimum_effect: '≥ 1 at each toy n'
    - metric: null_shuffle_median
      direction: lower
      minimum_effect: 'shuffle median < observed median when observed ≥ 1'

  minimal_test: >-
    Stage 0: freeze P_n (poly geometric spans + normal-basis images at matched
    dim), predicate code hash. Stage 1: n=17, ≥20 pairs, report median and
    histogram. Stage 2: n=23,31 + shuffle null. Budget: ≤20 runs, ≤4 CPU-hours.
    Stop if predicate hash drifts.

  controls:
