idea:
  id: IDEA-20260816-62354d
  question_id: RQ-FBG-001
  added: '2026-08-16'
  title: Build one geometry-agnostic factor-base measurement module that takes any geometry as a constructor
    plus a membership predicate and emits a self-verifying certificate - realised sizes, exact coverage,
    matched-null excess and construction charge - with its matched random null executed inside the
    same call
  class: tooling
  claim: '(A) THE RECURRING FAILURE THIS TARGETS. This bucket''s contracts all need the same six things:
    realised nominal and effective size, exact multiset counting over the complete target space, the
    closed-form total check, a matched random null, an excess ratio with intervals, and a construction
    charge. Every contract that rebuilds them rebuilds them slightly differently, and this program
    has already recorded the consequences of exactly that - a null sampling range differing from its
    stated convention, an aggregation rule documented only in a code comment, and manifests recording
    a pre-snapshot revision. The program''s own rule that a control arm must be executable in the
    same invocation as the signal arm is a rule about tooling that no tool currently enforces. (B)
    THE CLAIM. A single module can accept a geometry as a pair - a constructor returning a list of
    curve points and a membership predicate deciding whether a given point belongs - and return a
    record that is self-verifying in a precise sense: it carries the closed-form total binomial(B_eff
    + m - 1, m) alongside the measured total so any reader can check the counter without rerunning
    it; it carries both nominal and effective sizes so the matched-null definition is never implicit;
    it carries the matched null''s own measurements taken in the same call so no signal can be reported
    without its control; and it carries the instrumented construction charge so no achievement is
    reported without its cost. The claim is that this is implementable in a few hundred lines against
    the existing harness, that it reproduces the recorded exact values from the frozen battery to
    the digit, and that the reproduction is the module''s validation rather than its byproduct. (C)
    THE PORT-FIDELITY TEST. The module is worthless unless it reproduces known numbers. It must reproduce,
    exactly, the frozen battery''s recorded yield ratio of 1.000000 for untyped geometries, and reproduce
    within stated tolerance its recorded coverage values. Any digit that does not match is a defect
    of the module and is reported as such. (D) WHAT IS NOT CLAIMED. No attack, no break, no speedup,
    no security consequence. It is NOT claimed that the module produces new mathematical knowledge
    - it produces none, and its entire value is that later contracts stop re-implementing the same
    six things differently. It is NOT claimed that reproducing the frozen battery validates that battery''s
    conclusions; reproduction tests the module against the battery, not the battery against the world.
    It is NOT a re-audit of the program''s cost model, machine variance or timing, and it takes no
    timings at all.'
  mechanism: 'STAGE 1. Define the geometry interface as a small protocol: a constructor taking a curve,
    a target size and a seed and returning points, plus a membership predicate, plus a declared coordinate
    of definition. STAGE 2. Implement the measurement core: negation collapse and deduplication to
    get effective size; exact multiset-sum counting over the complete target space at arity m; the
    closed-form total check; coverage; three matched-null constructions at nominal, effective and
    multiset-count matching, all drawn inside the same call under recorded seeds. STAGE 3. Implement
    the construction charge by wrapping curve and field primitives in counters that are active during
    the constructor call only, plus peak auxiliary memory in words. STAGE 4. Emit a certificate record:
    every input, every seed, both sizes, measured and closed-form totals, coverage for signal and
    all nulls, excess ratios, the charge, and a content hash of the whole record. STAGE 5. Validate
    by port fidelity: re-measure the geometries whose exact values the frozen evidence record reports
    and compare digit by digit, reporting every mismatch. STAGE 6. Refutation route. If the module
    cannot reproduce the recorded exact values, it is not a faithful instrument and the mismatch is
    the deliverable. If the interface cannot express a geometry the program has already measured,
    the interface is under-specified and that geometry names the missing capability.'
  novelty_status: unverified
  novelty_screen:
    method: Read EV-FBG-001 in full, including its validation-finding list - a label carrying a curve-1
      value where the analysis publishes a 16-replicate value, an undocumented Holm aggregation rule
      living only in a code comment, a matched-random draw range of [1, N) against a convention string
      saying [0, N), and manifests recording a pre-snapshot revision with dirty tree true. Read H-FBG-001,
      RQ-FBG-001. Listed harness/ and found run.py, runner.py, toycurve.py, semaev.py, exp_icinv_geometry.py,
      exp_jinv_matched.py, ctrl_valueshuffle.py and others. Greps over ledger/proposals for 'harness',
      'reusable', 'module', 'instrument', 'certificate'.
    results: harness/ already contains a substantial collection of per-experiment modules - run_icinv.py,
      run_jinv_matched.py, exp_icinv_geometry.py, ctrl_valueshuffle.py and others - which is evidence
      that the program builds one module per experiment rather than one reusable measurement core.
      toycurve.py explicitly describes itself as the independent verifier the certificate discipline
      relies on, so the certificate idea is established in this program at the level of curve arithmetic
      and discrete-log claims. What I did not find is a geometry-agnostic factor-base measurement
      module with a declared geometry interface, in-call nulls, and a port-fidelity validation against
      recorded exact values. The blacklist's instrument entries concern the program's cost model and
      machine variance, which this does not touch.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature; this is an engineering contribution
      internal to the repository and makes no publication claim of any kind. What is claimed new here
      is the specific combination: a geometry interface, in-call execution of the matched null so
      a signal cannot be reported without its control, three null definitions computed simultaneously,
      an instrumented construction charge, and port-fidelity validation against digits already recorded
      in this program. Assembled from known parts: exact counting and the closed-form identity from
      the frozen battery; the certificate discipline already stated in harness/toycurve.py; the counting
      and null conventions from the same battery.'
  object_first_candidate:
    tracked_object: THE CERTIFICATE RECORD - the fixed-shape tuple of inputs, seeds, both sizes, measured
      and closed-form totals, signal and null coverages, excess ratios, construction charge and content
      hash - carried from the measurement call to the reader, so that verification does not require
      rerunning anything.
    lossiness: 'Lossy, deliberately and by a large factor. The certificate discards the base itself,
      the count vector of length N, the intermediate arithmetic and the code path, retaining a few
      dozen numbers. That is discarded compatibly with the operation of interest, which is verification:
      the closed-form total is recomputable from the effective size alone, the excess ratios are recomputable
      from the coverages, and the content hash binds the whole tuple - so a reader can check internal
      consistency without any of the discarded material. What the projection genuinely cannot support
      is independent recomputation of coverage, which requires the base; the certificate therefore
      carries the seeds and the constructor identity so the base can be rebuilt, and the contract
      states that this is reconstruction, not verification.'
    propagation: 'One step of the target operation - a downstream contract consuming a certificate
      - acts on the retained object by checking its internal identities: measured total against closed
      form, excess against the ratio of coverages, effective size against nominal minus collapse,
      and the content hash against the tuple. Each check either passes and leaves the certificate
      usable, or fails and marks it void. The propagation is therefore a chain of total functions
      with no accumulation of error, which is the property that makes a certificate composable across
      contracts.'
    survival_score: 'The certificate survives every downstream use that needs the recorded quantities,
      which is all of this bucket''s planned comparisons. It dissolves the moment a downstream contract
      needs something not in the tuple - the full count vector, the identity of the hit targets, or
      the per-primitive charge breakdown at finer granularity - at which point the base must be rebuilt
      from seeds. Concretely: sufficient for excess comparison, null-definition sensitivity and charged-frontier
      construction; insufficient for any distributional question about which targets were hit, which
      is where it ends.'
  null_object_control: The null object for the module itself is a SYNTHETIC GEOMETRY whose coverage
    and construction charge are known in closed form - for instance the whole-curve base, whose coverage
    is exactly 1 and whose multiset total is exactly binomial(B_eff + m - 1, m) with B_eff the full
    group size, and a single-element base whose coverage is exactly 1 over N. The module must reproduce
    these exactly, not approximately. For the module to be usable, it must also reproduce the frozen
    battery's recorded exact yield ratio of 1.000000 for untyped geometries and its recorded coverage
    values within a stated tolerance; a module that cannot reproduce numbers this program has already
    committed cannot be trusted to produce new ones. The matched random null is not a control for
    the module but a required output of every call, and the module must refuse to return a record
    without it - which is the enforcement mechanism the program's control-adequacy rule currently
    lacks.
  discriminated_from:
  - 'harness/toycurve.py: provides exact curve arithmetic and the verification discipline this module
    builds on. It does not construct factor bases, does not count multisets, and does not produce
    excess ratios.'
  - 'The per-experiment harness modules such as run_icinv.py, exp_icinv_geometry.py and exp_jinv_matched.py:
    each implements one experiment''s pipeline. This module implements the measurement core those
    pipelines share, with a declared interface and port-fidelity validation.'
  - 'The RQ-INSTR-f8faa0 cost-model and machine-variance audits named on the blacklist: those measure
    execution infrastructure and wall-clock behaviour. This module takes no timings and its charge
    is a machine-independent primitive count.'
  - 'EV-FBG-001''s own validation notes: those record defects found in one battery. This module is
    an attempt to make that class of defect structurally impossible for later batteries, and it neither
    revisits nor revises that battery''s conclusions.'
  - 'IDEA-20260815-c13ef4 and other geometry comparisons: those are measurements; this is the instrument
    they would run on, and it produces no mathematical result of its own.'
  assumptions:
  - Every geometry this bucket cares about can be expressed as a constructor plus a membership predicate;
    a geometry that cannot is a finding about the interface and is reported rather than accommodated
    by widening the interface until everything fits.
  - Exact counting over the complete target space is feasible at the sizes the module targets, which
    bounds it to toy scale by construction.
  - The frozen battery's recorded exact values are the right port-fidelity target, accepting that
    its experiment record is not machine-parseable and is cited by path in the evidence record.
  - Instrumenting the constructor does not change what it builds, verified by a bit-identical comparison.
  predictions:
  - metric: reproduction of the frozen battery's recorded exact yield ratio for untyped geometries
    direction: different
    minimum_effect: 'forced value: exactly 1.000000, digit for digit; any deviation is a module defect'
  - metric: reproduction of the synthetic whole-curve and single-element closed-form coverages
    direction: different
    minimum_effect: 'forced value: exact equality; the module must not return an approximation for
      a quantity with a closed form'
  - metric: fraction of the six previously measured geometries expressible through the declared interface
    direction: higher
    minimum_effect: 5
  - metric: reproduction of the frozen battery's recorded coverage ratios
    direction: different
    minimum_effect: 'explicit refusal to pre-commit a tolerance: the recorded values are reported
      to four decimal places under conventions this module reproduces from a written description rather
      than from shared code, so a pre-committed tolerance would be invented; every deviation is reported
      with its magnitude and an account of the convention difference that explains it'
  minimal_test:
    design: 'One module, three synthetic geometries, two recorded geometries, one invocation. Implement
      the interface and the measurement core against harness/toycurve.py, then call it on three geometries
      with closed-form answers - the whole-curve base, a single-element base, and a two-element base
      - and require exact agreement. Then call it on two of the frozen battery''s geometries at one
      of its recorded sizes and compare the returned yield ratio and coverage against the recorded
      digits. The discriminating output is a five-row agreement table. Exact agreement on the synthetic
      rows is a hard gate: a module that cannot reproduce a closed form has a counting bug and nothing
      else it returns can be read. Agreement on the recorded rows is the port-fidelity test, and every
      mismatch is reported with a stated account of which convention differs. This costs a day of
      implementation and minutes of compute, and it discriminates because closed forms admit no interpretation.'
    controls:
    - Whole-curve synthetic geometry with coverage exactly 1 and a closed-form multiset total.
    - Single-element and two-element synthetic geometries with closed-form coverage.
    - Bit-identical comparison of instrumented against uninstrumented constructor output.
    - Port fidelity against the frozen battery's recorded exact values at a recorded size.
    - 'A refusal test: the module must raise rather than return when asked to skip the matched null,
      verified by a unit test.'
    required_metrics:
    - exact agreement flag per synthetic closed-form geometry
    - digit-level agreement of the reproduced yield ratio against the recorded 1.000000
    - deviation magnitude of reproduced coverage against recorded coverage, per geometry
    - expressibility count of previously measured geometries through the interface
    - instrumented against uninstrumented construction equality flag
    - 'certificate internal-consistency check results: measured total against closed form, excess
      against coverage ratio, hash against tuple'
  falsification_conditions:
  - 'Any synthetic closed-form geometry is not reproduced exactly: the counting core has a defect.'
  - The recorded yield ratio of 1.000000 is not reproduced digit for digit.
  - Instrumented and uninstrumented constructors produce different bases.
  - A previously measured geometry cannot be expressed through the interface, naming the missing capability.
  - The module returns a record without a matched null under any code path, defeating its own control-adequacy
    guarantee.
  - Certificate internal-consistency checks fail on the module's own output.
  confounders:
  - 'Convention drift: reproducing the frozen battery''s conventions from written descriptions rather
    than from shared code is exactly where the recorded [1, N) versus [0, N) defect came from, and
    the same trap applies here.'
  - Reproducing a number is not validating the reasoning that produced it; a module can agree digit
    for digit with a battery that was itself wrong.
  - Interface design after seeing which geometries must fit is fitting; the two-implementation and
    expressibility checks bound but do not remove this.
  - The construction charge depends on which primitives are wrapped, and an unwrapped hot primitive
    silently understates a geometry's cost.
  - Exact counting bounds the module to toy scale, so any geometry whose interest lies at larger scale
    simply cannot be measured by it.
  interpretation_limits:
  - The module produces no mathematical knowledge; every number it returns is a measurement whose
    meaning comes from the contract that called it.
  - Reproducing recorded values validates the module against the record, and specifically does not
    validate the record.
  - Toy scale only, by construction, since exact counting over the complete target space is required.
  - A certificate supports verification of its internal identities and reconstruction from seeds;
    it does not support independent recomputation of coverage without rebuilding the base.
  target_complexity:
    time_exponent: No attack exponent is claimed. The module's own cost is order N times B squared
      per call at arity 3 for exact counting, plus the constructor's charge, both measurement costs.
    memory_exponent: No attack memory exponent is claimed. Peak memory is one count vector of length
      N plus the discrete-logarithm table where a geometry needs one, linear in N.
    best_known: 'The incumbent is current practice in this repository: one bespoke module per experiment
      under harness/, with conventions reproduced by description and controls implemented alongside
      rather than inside the measurement call. There is no reusable factor-base measurement core to
      beat, so the contribution is the core''s existence and its port-fidelity record rather than
      an improvement in any measured number.'
    hidden_overhead: 'The hidden cost is that a shared instrument propagates its own defects to every
      contract that uses it, converting independent errors into correlated ones - which is a real
      cost against the diversity of bespoke modules and is not usually stated. The second hidden cost
      is interface ossification: once several contracts depend on the tuple shape, adding a field
      is cheap and changing one is not. The human overhead is convention archaeology against a battery
      whose experiment record is not machine-parseable.'
  dominated_by: n/a (no result claimed). The module produces no mathematical result and therefore
    no point on any attack frontier; no frontier row is displaced and I checked the rows this repository
    records - the generic square-root baseline named in KN-OPEN-001 and the coverage rows 1.0012,
    1.0269 and 1.1071 recorded around EV-FBG-001 - none of which this contract touches. On the engineering
    axis it is dominated by bespoke per-experiment modules on time-to-first-result and dominated by
    doing nothing on total cost, and it dominates both only on reproducibility and control adequacy,
    which are the only axes it claims.
  sota_delta: 'No attack; tooling contribution only. Quantitatively: this bucket currently has zero
    shared measurement modules and the frozen battery''s validation returned valid_with_findings with
    four minor defects of exactly the class a shared instrument removes. A completed implementation
    would supply one module with a port-fidelity table against recorded digits and a unit test making
    a null-free measurement call impossible. No mathematical quantity changes, no attack cost changes,
    and no exponent moves.'
  estimated_cost:
    implementation: high
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Synthetic closed-form geometries reproduced exactly: about 0.9 - closed
    forms are unforgiving but the arithmetic is elementary. Recorded yield ratio of 1.000000 reproduced
    digit for digit: about 0.85, and high because that value is forced by the counting identity rather
    than by any convention, so it is the easiest number in the record to hit. Recorded coverage ratios
    reproduced within a defensible tolerance: about 0.45 - this is the weak point, since coverage
    depends on the null sampling range, the deduplication rule and the trimming rule, and the frozen
    record itself documents a range discrepancy; my honest expectation is a small systematic offset
    that I will be able to attribute but not eliminate. At least five of six geometries expressible
    through the interface: about 0.75, with the greedy arm the likeliest to need a wider interface
    because its constructor depends on evaluating candidate quality rather than on a predicate. Null-refusal
    unit test passing: about 0.95, being a matter of discipline. Overall probability the module ships
    with a clean port-fidelity table: about 0.4; probability it ships with a documented and attributed
    offset table: about 0.75.'
