idea:
  id: IDEA-20260809-52726c
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ROS-595c15
  goal_id: GOAL-ROS-001
  title: >-
    The binding factor is a Fiat-Shamir hash in disguise — enumerate what it must
    cover and produce a forgery for each omission
  class: measurement
  claim: >-
    Threshold and multi-signature protocols derive a binding factor by hashing a
    set of values: the message, the participant list, the full nonce commitment
    set, a session identifier, a domain separator. The claim is that this set is
    small and enumerable, that omitting specific elements enables specific
    concrete forgeries, and that the resulting omission-to-attack map is a
    finite table this program can fill with certificates against its own
    reference implementation.
  mechanism: >-
    Parameterize the binding-factor input set. For each subset, attempt the
    forgery whose structure the omission enables: omitting the nonce set allows
    reuse across sessions, omitting the participant list allows a rogue-key style
    substitution, omitting the message allows transplanting a signature.
  why_not_a_renamed_known_approach: >-
    This is the weak-Fiat-Shamir discipline applied to a signature protocol's
    binding factor rather than to a proof system's challenge. The transfer is the
    idea, and the deliverable is a per-omission certificate set rather than a
    warning that the hash should cover everything.
  predictions:
  - observable: number of omission classes yielding a forgery
    metric: count out of the enumerated subsets
    predicted: >-
      More than one, since different omissions enable structurally different
      attacks. If only one omission matters, the binding factor's input list is
      over-specified and that is a useful simplification result.
  - observable: whether any omission is undetectable by the honest-path test suite
    metric: boolean per omission
    predicted: All of them. Omissions that break honest signing would be caught in development; the dangerous ones are exactly those that do not, and quantifying that is the record's practical point.
  minimal_test: >-
    Enumerate the subsets of a declared input set, run honest-path tests and
    forgery attempts for each, and emit certificates plus the honest-path outcome
    per subset.
  controls:
  - 'HONEST-PATH MATRIX: honest signing is tested at every subset, so the record can state which omissions are invisible to functional testing.'
  - 'FULL-SET CONTROL: with the complete input set, no forgery may be found within the declared budget; if one is, the reference implementation is broken somewhere else.'
  falsification_conditions:
  - No omission yields a forgery, meaning the binding factor's contents are not load-bearing in the way assumed.
  - A forgery is found with the complete input set, indicating an implementation defect that must be resolved before any cell is recorded.
  interpretation_limits: >-
    Certificates are against deliberately weakened reference implementations,
    labelled as such in every title. The map is about instantiation choices, not
    about the specified protocol.
  sota_delta: 'No attack on any protocol. Delta: an omission-to-attack table with certificates, transferable to any protocol using a binding factor.'
  dominated_by: Not dominated by any corpus record; methodologically parallel to GOAL-WFS-001, which owns the proof-system case and may not be cited as evidence here.
  estimated_cost: Implementation medium; compute low.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for binding factor: no records. WEB NOT CHECKED.'
  source_refs:
  - FROST and related threshold Schnorr specifications -- RECALLED, REQUIRED READS.
