idea:
  id: IDEA-20260807-aabd67
  question_id: RQ-TORS-8c7b79
  added: '2026-08-07'
  title: >-
    DIVISION-POLYNOMIAL VALUES ARE AUTOMORPHISM-EQUIVARIANT BY WEIGHTED
    HOMOGENEITY, SO THEY GIVE A CANONICAL WALK PARTITION ON E/Aut FOR CM CURVES --
    and the honest question is whether that canonicity buys anything over the
    incumbent orbit-representative rule, which this proposal predicts it does not
    and measures the exact cost ratio at which it loses
  class: algorithm

  claim: >-
    (A) THE ALGEBRAIC FACT, DERIVED HERE AND USED AS BOTH MECHANISM AND INSTRUMENT
    SELF-TEST. Division polynomials are weighted-homogeneous: under the curve
    isomorphism (x, y) -> (u^2 x, u^3 y) with (a, b) -> (u^4 a, u^6 b),
      psi_n(u^2 x, u^3 y; u^4 a, u^6 b) = u^{n^2 - 1} psi_n(x, y; a, b).
    For ODD n, psi_n is a polynomial in x, a, b alone. Specialising to the extra
    automorphisms of CM curves:
      j = 0 (a = 0, |Aut| = 6): the automorphism is x -> zeta x with zeta a cube
        root of unity, realised by u a primitive 6th root of unity (u^6 = 1 fixes b,
        u^4 * 0 = 0 fixes a, u^2 = zeta). Hence
        psi_ell(zeta x; 0, b) = u^{ell^2 - 1} psi_ell(x; 0, b): the value is
        multiplied by a FIXED root of unity depending only on ell.
      j = 1728 (b = 0, |Aut| = 4): the automorphism is x -> -x, realised by u = i
        (u^4 = 1 fixes a, u^6 * 0 = 0 fixes b, u^2 = -1). For odd ell,
        ell^2 - 1 is divisible by 8, so i^{ell^2 - 1} = 1 and
        psi_ell(-x; a, 0) = psi_ell(x; a, 0) EXACTLY: the odd division polynomials
        are literally even functions of x on j = 1728 curves.
    CONSEQUENCE: the class of psi_ell(x(R)) modulo the fixed root-of-unity scaling
    is invariant under the full automorphism group, so any function of that class is
    a well-defined function on E/Aut. That is exactly the requirement a walk
    partition must satisfy for an automorphism-quotient Pollard rho to be correct
    (KN-TECH-018): the partition must be constant on Aut-orbits, or the walk is not
    well defined on the quotient.

    (B) THE HONEST QUESTION, WHICH IS NOT WHETHER IT WORKS BUT WHETHER IT PAYS. The
    incumbent way to define a partition on E/Aut is to pick a canonical orbit
    representative -- for j = 0, the minimum of {x, zeta x, zeta^2 x} as integers in
    [0, p) -- and hash it. That costs 2 field multiplications plus 2 comparisons per
    step. The psi_ell route costs (ell^2 - 1)/2 field multiplications per step by
    Horner: 4 at ell = 3, 12 at ell = 5, 24 at ell = 7, 60 at ell = 11, 84 at
    ell = 13. THE COMPARISON IS THEREFORE DECIDED BEFORE ANY EXPERIMENT ON COST
    GROUNDS: the torsion partition is at least 2x more expensive at ell = 3 and 42x
    more expensive at ell = 13, per step, against a rho walk whose step count is
    0.886*sqrt(N/|Aut|) and is partition-independent for any well-mixing partition.
    THE PROPOSAL IS FILED ANYWAY, AND FOR A STATED REASON: the prediction that step
    count is partition-independent is exactly the kind of "obviously true" claim
    that this program's own protocol requires to be measured against a null, and the
    measurement has a second, non-obvious output -- the FRUITLESS-CYCLE RATE, which
    IS partition-dependent and is the one place a structured partition could differ.

    (C) THE TWO OUTCOMES, AND WHY NEITHER IS A NON-EVENT.
      OUTCOME 1 (predicted) -- the psi_ell partition gives a step count matching
        0.886*sqrt(N/|Aut|) within the pre-registered tolerance, identical to a
        matched random partition of the same cell count, and a fruitless-cycle rate
        also identical. Then the torsion structure contributes NOTHING beyond being
        a legal Aut-invariant function, the cost ratio measured in (B) stands as the
        quantified domination, and a plausible-sounding intuition -- "a partition
        derived from the curve's torsion structure should interact better with the
        curve's automorphisms" -- is closed with a number attached rather than with
        a shrug.
      OUTCOME 2 -- the fruitless-cycle rate differs materially. Fruitless cycles on
        automorphism-quotient walks arise when the walk maps a point into its own
        orbit, and their rate depends on how the partition interacts with the orbit
        structure. A partition that is CANONICALLY Aut-equivariant (as psi_ell is,
        by (A)) rather than equivariant-by-construction (as the orbit-representative
        rule is) could plausibly have a different collision structure with orbits.
        If measured, this is a genuine if modest algorithmic observation about walk
        design, and it is worth reporting with its cost ratio so a reader can see
        immediately that it does not pay at ell >= 5.

    (D) HARD-CONSTRAINT ENGAGEMENT. Is the data point-dependent? YES -- psi_ell(x(R))
    is evaluated at the walked point and changes with it, and it is publicly
    computable with no discrete logarithm. Does it leak anything about k? NO, and
    the reason is not the coprimality theorem (psi_ell is not homomorphic) but the
    rigidity theorem of IDEA-20260807-df906f: a partition is a lossy projection of
    the point, and on a prime-order group no lossy projection propagates exactly, so
    the partition cannot be used to search in partition-space instead of in G. The
    partition's only role is the classical one -- to make a pseudo-random walk -- and
    that role is worth exactly the sqrt(|Aut|) discount KN-TECH-018 already records
    as a CONSTANT, never an exponent.

  resource_label: R5
  admissibility: admissible
  admissibility_argument: >-
    ADMISSIBLE AS A RESOURCE USE, WITH ZERO EXPONENT CLAIMED AND A DOMINATION
    ALREADY DERIVED. psi_ell is a field-level function of E[ell] and is not
    obtainable from the generic group oracle, so R5 escapes the generic model in the
    same way R1's x-coordinate data does. But the escape is used only to define a
    partition function, and a partition function is exactly the part of Pollard rho
    that the generic-group analysis treats as a random oracle -- so the escape buys
    nothing by construction. This is the third distinct pattern this batch has
    recorded: a resource can escape the generic model and be (a) constant in k
    (IDEA-20260807-6eab6a), (b) simulable at the point level
    (IDEA-20260807-053a55), or (c) admissible but occupying a slot the analysis
    already models as random -- which is this record. Naming pattern (c) is part of
    the contribution, because "my object is non-generic" is otherwise easy to
    mistake for "my object helps".

  discriminated_from:
    - >-
      KN-TECH-018 (endomorphism and automorphism speedups; the sqrt(|Aut|) discount
      and its explicit statement that the discount is a CONSTANT, at most sqrt(6),
      never an exponent). This record does not claim to beat that discount and
      pre-registers the prediction that it reproduces it exactly. What it adds is a
      DIFFERENT WAY to satisfy the Aut-invariance requirement and a measured cost
      ratio against the incumbent way.
    - >-
      IDEA-20260807-df906f. That record measures whether psi_ell-derived truncations
      PROPAGATE under the group law, as candidate tracked objects. This record uses
      a psi_ell-derived truncation as a WALK PARTITION, which requires only
      Aut-invariance and pseudo-randomness, not propagation. The two uses are
      independent: a partition that fails the propagation test (as df906f predicts
      all of them do) is still a perfectly good partition. Stating that
      independence prevents a reader from concluding that df906f's predicted null
      also kills this record.
    - >-
      H-ENDO-001's rho-cost prediction (measured rho cost within 20 percent of
      0.886*sqrt(N/|Aut|) on j = 0 and j = 1728 curves, recorded there as a
      known-answer calibration using the classical birthday constant). This record
      REUSES that calibration as its own baseline arm rather than re-deriving it,
      and must report against the same constant and the same tolerance so the two
      records' numbers are comparable.
    - >-
      Any claim that a structured partition improves rho's constant. No such claim
      is made. The literature constant 0.886 = sqrt(pi/4) is a property of the
      birthday problem, not of the partition, provided the partition mixes.

  object_first_candidate:
    tracked_object: >-
      THE Aut-INVARIANT DIVISION-POLYNOMIAL CLASS: the value psi_ell(x(R)) taken
      modulo the fixed root-of-unity scaling induced by Aut(E), reduced to a small
      cell index (declared: the value's residue modulo the number of walk cells,
      after a canonical representative of the scaling class is chosen).
    lossiness: >-
      Massively lossy and deliberately so: a partition into c cells retains
      log2(c) bits of a point carrying log2(N). It forgets the y-coordinate (odd
      psi_ell is a polynomial in x), forgets the orbit, and forgets everything else.
      It PASSES the lossy-projection test as a projection -- and by
      IDEA-20260807-df906f's rigidity theorem it therefore CANNOT propagate exactly,
      which is fine, because a walk partition is not required to propagate. This is
      the one place in this batch where failing the propagation requirement is
      harmless, and saying so explicitly is necessary or the batch reads as
      inconsistent.
    propagation: >-
      Does NOT propagate under the group law, by rigidity, and is not required to.
      It DOES propagate exactly under Aut: by (A), applying an automorphism
      multiplies psi_ell(x(R)) by a fixed root of unity, so the scaling class is
      invariant. That is a genuine, checkable one-step propagation rule under a
      different operation than the group law, and it is the record's instrument
      self-test.
    survival_score: >-
      Survives every automorphism exactly (that is (A)). Survives one group
      operation not at all. Dies as a COMPETITIVE choice at the first cost
      comparison, quantitatively at ell >= 3, which is why the priority is low and
      the deliverable is a number rather than a method.

  mechanism: >-
    STEP 1 (zero compute) -- derive (A) and record the two specialisations as
    predictions with forced values. The j = 1728 statement psi_ell(-x; a, 0) =
    psi_ell(x; a, 0) for odd ell is an exact identity and is the cheapest possible
    instrument self-test: it must hold on every sample or the division-polynomial
    code is wrong.

    STEP 2 (implementation, low, reusing shared code) -- a rho walk driver
    (harness/rho.py is the existing instrument) with a pluggable partition function.
    Three partitions are registered:
      PART-A (incumbent): canonical orbit representative -- min over the Aut-orbit
        of x -- hashed to c cells. Cost: 2 multiplications plus |Aut|/2 comparisons.
      PART-B (this record): psi_ell(x(R)) reduced to its scaling class and hashed to
        c cells. Cost: (ell^2 - 1)/2 multiplications.
      PART-C (the null): a keyed random function of the canonical orbit
        representative, hashed to the SAME c cells. Same cell-count, same
        Aut-invariance, no torsion content.
    All three must be Aut-invariant or the walk on the quotient is incorrect; the
    driver asserts invariance per partition on a battery of orbit-mates before any
    walk runs.

    STEP 3 (measurement) -- on j = 0 (|Aut| = 6) and j = 1728 (|Aut| = 4) toy curves
    at 16, 20, 24 field bits, 5 seeds each, run rho to solution under each
    partition and record: step count, step count divided by sqrt(N/|Aut|), fruitless
    cycles encountered, wall clock, and field multiplications per step. Also run the
    generic |Aut| = 2 family as the r = 1 baseline.

    STEP 4 (the cost ratio, which is the actual deliverable) -- report field
    multiplications per step for PART-B against PART-A as a function of ell, and the
    resulting wall-clock ratio. The ARITHMETIC ratio is known in advance from (B)
    -- (ell^2-1)/2 against 2, i.e. 2x at ell = 3 up to 42x at ell = 13 -- and the
    measurement's job is the WALL-CLOCK ratio, which differs because of interpreter
    overhead and is the number a practitioner would actually see.

    STEP 5 (the fruitless-cycle comparison) -- the only non-forced measurement here.
    Report cycle rates for all three partitions with confidence intervals, against
    the PART-C null.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Commands run 2026-08-07 from the repository root:
      `grep -ril "fruitless" ledger/ knowledge/`;
      `grep -ri "partition" knowledge/techniques/KN-TECH-006.md knowledge/techniques/KN-TECH-018.md`;
      `grep -ril "division polynomial" ledger/ knowledge/`;
      plus full reads of KN-TECH-018, KN-TECH-009, H-ENDO-001, and the header of
      KN-TECH-006.
    results: >-
      "fruitless" appears in KN-TECH-018 ("negation walks require fruitless-cycle
      handling") and nowhere else as a measured quantity; no record in this
      repository measures a fruitless-cycle rate. No record proposes any partition
      function for rho, structured or otherwise. The weighted-homogeneity identity
      for division polynomials appears nowhere in the corpus. H-ENDO-001 predicts
      rho cost within 20 percent of 0.886*sqrt(N/|Aut|) as a known-answer
      calibration but records no measurement.
    verdict: >-
      ADAPTATION. The weighted-homogeneity identity is standard and is derived here
      rather than cited, because no corpus entry states it; the automorphism-quotient
      walk and its sqrt(|Aut|) discount are KN-TECH-018 and are not claimed as new.
      What is new to this corpus is the observation that psi_ell supplies a
      canonically Aut-equivariant partition, together with the cost ratio that
      shows it does not pay. External novelty UNVERIFIED -- no web search this
      session, and it is entirely plausible that this observation appears in the rho
      implementation literature.

  null_object_control: >-
    MANDATORY AND SUPPLIED. MATCHED NULL OBJECT: PART-C -- a keyed random function
    of the canonical orbit representative, hashed to the SAME number of cells,
    therefore matched on Aut-invariance, on cell count, and on cell-occupancy
    distribution, and differing from PART-B ONLY in carrying torsion content. This
    is the object null: it removes the torsion meaning and preserves everything a
    partition is supposed to have.
    DECAY PARAMETER: the number of cells c. Any difference between PART-B and
    PART-C must DECAY as c grows, because at large c both partitions approach the
    random-oracle idealisation that the 0.886 constant assumes, and the difference
    should vanish. A difference that is FLAT in c is the canonical artifact tell
    (docs/inventor-protocol.md section 3) and would indicate the driver is
    responding to something other than the partition -- most likely a difference in
    how the two partitions handle the point at infinity or the zeros of psi_ell.
    SECOND DECAY PARAMETER: field bits. Any step-count difference must shrink
    relative to sqrt(N/|Aut|) as N grows; a constant absolute difference is a
    small-N artifact.
    FORCED-VALUE DERIVATION (KN-TECH-1a5b7e obligation 4): the step-count contrast
    between PART-B and PART-C is FORCED TO ZERO under the standard rho analysis,
    which treats any well-mixing partition as a random oracle. So the step-count
    measurement CANNOT distinguish the hypotheses and is included only as a
    calibration against 0.886*sqrt(N/|Aut|). The measurement that is NOT forced is
    the fruitless-cycle rate, and that is where the record's only real question
    lives. Stating this before the run is what keeps a forced zero from being
    written up as a controlled null.

  assumptions:
    - >-
      psi_ell for odd ell is a polynomial in (x, a, b) with the stated weighted
      homogeneity of weight ell^2 - 1. Derived in (A) and self-tested by the
      j = 1728 evenness identity on every sample.
    - >-
      j = 0 and j = 1728 toy curves with |Aut| = 6 and 4 respectively require
      p ≡ 1 mod 3 and p ≡ 1 mod 4; the curve generator must be constrained
      accordingly, as H-ENDO-001's test boundary already specifies.
    - >-
      psi_ell(x(R)) = 0 exactly when R is an ell-torsion point. On a walk this is a
      measure-zero event but not an impossible one when ell divides the cofactor;
      the partition must define a cell for the zero value explicitly, and both
      PART-B and PART-C must handle it identically or the comparison is confounded.
    - >-
      ell <= 13, so the per-step cost is at most 84 multiplications. Beyond that the
      cost ratio is so unfavourable that the measurement would be pointless, which
      is a budget statement and also the honest reason for the cap.
    - >-
      harness/rho.py is the existing instrument and is reused rather than rebuilt,
      so any bias in its step accounting affects all three partitions equally.

  proof_search_map:
    bottleneck: >-
      None computationally -- rho at 16-24 bits is seconds per solve. The binding
      constraint is STATISTICAL: distinguishing fruitless-cycle rates requires many
      solves, and the cycle rate on |Aut| = 4 or 6 quotients is low, so the number
      of solves needed for a confidence interval tight enough to be informative is
      the real budget question and must be estimated before the run.
    baseline_embedding:
      parameter_slice: >-
        |Aut| = 2 (generic curves, negation only) with PART-A: the standard rho
        baseline, where the expected step count is 0.886*sqrt(N/2) and the classical
        constant applies directly. This slice reproduces KN-TECH-006/KN-TECH-018.
      reproduction_check: >-
        Frozen fixture: 5 seeds at 20 field bits on generic curves, measured mean
        step count divided by sqrt(N/2) compared against 0.886 with the 20 percent
        tolerance H-ENDO-001 pre-registers. A miss means harness/rho.py's accounting
        is off and every partition comparison built on it is uninterpretable.
    observation_collision:
      observable: >-
        The rho step count under a given partition.
      distinct_preimage_search: >-
        REQUIRED AND GUARANTEED TO SUCCEED, and its success IS the forced-value
        derivation: PART-A, PART-B and PART-C are three distinct partitions that
        must all yield the same step count, because the analysis models any mixing
        partition as a random oracle. The collision is total and is derived before
        the run, which is why the step count cannot be the record's headline and why
        the fruitless-cycle rate is.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the step count fixed (it is forced) and vary the forgotten structure
          (the partition's algebraic origin). The intrinsic invariant that could
          distinguish the partitions is the fruitless-cycle rate, which depends on
          the interaction between the partition and the Aut-orbit structure rather
          than on mixing alone. That identification is the record's entire design
          rationale.
        predicted_gain: >-
          Redirects the measurement from a forced quantity to a non-forced one. No
          attack gain, and the record predicts no cycle-rate difference either.
    quantifier_order: >-
      Claimed: FORALL odd ell, FORALL curves with a = 0 (resp. b = 0), FORALL points
      R, psi_ell(zeta x(R)) = u^{ell^2-1} psi_ell(x(R)) with u fixed by the curve and
      independent of R (resp. psi_ell(-x(R)) = psi_ell(x(R))). The scaling factor
      depends on ell and the automorphism but NOT on the point, which is exactly what
      makes the scaling class a well-defined function on E/Aut. The dangerous weaker
      reading NOT claimed: "for each R there exists a scaling", which would not give
      a well-defined quotient function.
    method_ceiling:
      strongest_certifiable_claim: >-
        "A division-polynomial-derived partition is a valid Aut-invariant walk
        partition on E/Aut, and it costs (ell^2-1)/2 field multiplications per step
        against 2 for the orbit-representative rule, with no measured difference in
        step count or cycle rate." It can NEVER certify an exponent improvement --
        KN-TECH-018 already caps the automorphism benefit at a constant sqrt(|Aut|)
        <= sqrt(6) -- and cannot certify anything about partitions outside the three
        registered.
      nearby_object_control: >-
        The nearby object where the desired conclusion FAILS is a partition that is
        NOT Aut-invariant -- for instance psi_ell(x(R)) taken WITHOUT the
        root-of-unity quotient on a j = 0 curve. That partition breaks the quotient
        walk and must produce a demonstrably WRONG or non-terminating rho. Running it
        deliberately is the cheapest way to show the Aut-invariance requirement is
        load-bearing and not decorative, and it is required.
    proof_obligations:
      - claim: The weighted-homogeneity identity holds with weight ell^2 - 1.
        responsibility: correctness
      - claim: psi_ell(-x; a, 0) = psi_ell(x; a, 0) for odd ell.
        responsibility: correctness
      - claim: The scaling class is constant on Aut-orbits.
        responsibility: correctness
      - claim: The |Aut| = 2 baseline reproduces 0.886*sqrt(N/2) within tolerance.
        responsibility: baseline
      - claim: The step-count contrast between partitions is forced to zero a priori.
        responsibility: scope
      - claim: The non-invariant partition breaks the quotient walk.
        responsibility: feasibility
      - claim: Field-multiplication counts per step are measured, not estimated.
        responsibility: runtime

  predictions:
    - metric: >-
        psi_ell(-x(R)) - psi_ell(x(R)) on j = 1728 curves (b = 0), odd ell, all
        sampled points
      direction: different
      minimum_effect: >-
        Exactly 0 on 100 percent of samples. BASIS - derivation in claim (A) using
        i^{ell^2-1} = 1 for odd ell (since 8 divides ell^2 - 1); this is an
        algebraically FORCED instrument self-test, not a finding, and a non-zero
        value means the division-polynomial code is wrong.
    - metric: >-
        Ratio psi_ell(zeta x(R)) / psi_ell(x(R)) on j = 0 curves (a = 0), odd ell
      direction: different
      minimum_effect: >-
        A single fixed 6th root of unity per (curve, ell), identical across all
        sampled R. Variation across R falsifies claim (A). BASIS - derivation;
        UNTESTED in this campaign.
    - metric: >-
        rho step count divided by sqrt(N/|Aut|) under PART-A, PART-B, PART-C on
        j = 0 and j = 1728 curves
      direction: different
      minimum_effect: >-
        All three within 20 percent of 0.886 and within 10 percent of EACH OTHER.
        THIS CONTRAST IS FORCED TO ZERO by the standard analysis and is reported as
        a CALIBRATION, not as a controlled null. BASIS - 0.886 = sqrt(pi/4) is the
        classical birthday constant from the published rho literature (KN-TECH-006),
        used here as a KNOWN-ANSWER CALIBRATION; the 20 percent band matches
        H-ENDO-001's pre-registration so the two records' numbers are comparable,
        and the 10 percent inter-partition band is PRE-REGISTERED and UNTESTED.
    - metric: >-
        Fruitless-cycle rate per solve under PART-A, PART-B, PART-C
      direction: different
      minimum_effect: >-
        THE ONLY NON-FORCED MEASUREMENT IN THIS RECORD. Predicted outcome is NO
        difference: PART-B's rate within the PART-C null's 95 percent interval. A
        difference is declared only if PART-B falls outside the null's 99 percent
        interval AND the difference decays with cell count c as required by the null
        control. BASIS - the prediction of no difference follows from the
        random-oracle idealisation; the thresholds are PRE-REGISTERED and UNTESTED,
        and the required number of solves for a usable interval must be estimated
        before the run.
    - metric: >-
        Field multiplications per step, PART-B versus PART-A, as a function of ell
      direction: higher
      minimum_effect: >-
        (ell^2-1)/2 against 2, i.e. ratios 2, 6, 12, 30, 42 at ell = 3, 5, 7, 11,
        13. BASIS - direct count of Horner evaluations, derived in claim (B); the
        measured WALL-CLOCK ratio is the deliverable and is expected to differ from
        the arithmetic ratio because of interpreter overhead.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): derive (A), record both specialisations, and record
      the forced-value derivation for the step count so that a forced zero is not
      later written up as a controlled null.
      STAGE 1 (minutes, HARD GATE): the two algebraic self-tests -- the j = 1728
      evenness identity and the j = 0 fixed-root-of-unity ratio.
      STAGE 2 (minutes, HARD GATE): the |Aut| = 2 baseline reproduction against
      0.886*sqrt(N/2).
      STAGE 3 (hours): the three-partition comparison on j = 0 and j = 1728 curves
      at 16, 20, 24 field bits, 5 seeds, at cell counts c in a declared ladder, with
      enough solves per cell for a usable cycle-rate interval.
      STAGE 4 (minutes): the non-invariant partition control, which must break the
      quotient walk.
      STAGE 5 (zero compute): the cost-ratio table.
      BUDGET: ell in {3, 5, 7} for the walk comparison -- ell = 11 and 13 are
      included in the COST table (which is arithmetic) but not in the walk runs,
      because a 30x or 42x per-step cost makes the wall clock dominate without
      changing any conclusion. This restriction is stated as a budget choice, not as
      a scientific one.
    controls:
      - PART-C matched random partition, same cell count, same Aut-invariance (blocking)
      - "|Aut| = 2 baseline reproduction against 0.886*sqrt(N/2) (blocking)"
      - non-Aut-invariant partition, must break the quotient walk (blocking)
      - j = 1728 evenness identity self-test (blocking)
      - j = 0 fixed-root-of-unity ratio self-test (blocking)
      - cell-count ladder as the decay parameter
      - anomalous / smooth-order exclusion per KN-TECH-034 before any timing
    required_metrics:
      - step count and step count / sqrt(N/|Aut|) per (curve, partition, seed)
      - fruitless-cycle count per solve, with intervals
      - field multiplications per step, measured
      - wall clock per solve
      - psi_ell self-test residuals
      - cell-occupancy distribution per partition (to confirm matched shape)

  falsification_conditions:
    - >-
      The j = 1728 evenness identity fails. The division-polynomial code is wrong;
      every number in this record and in IDEA-20260807-df906f built on the same code
      is void.
    - >-
      The j = 0 scaling ratio varies with R. Claim (A) is false as derived and the
      record is superseded rather than amended.
    - >-
      The |Aut| = 2 baseline misses 0.886*sqrt(N/2) by more than 20 percent.
      harness/rho.py's accounting is off; the partition comparison is uninterpretable.
    - >-
      The non-Aut-invariant partition does NOT break the quotient walk. Either the
      quotient walk is not actually running on the quotient, or the invariance
      requirement is not load-bearing as stated; both invalidate the design.
    - >-
      PART-B's step count differs from PART-C's beyond 10 percent. Since the
      contrast is FORCED to zero by the standard analysis, a difference is a signal
      that one partition mixes badly, which is a property of the specific hash and
      cell count rather than of torsion, and must be diagnosed via the cell-occupancy
      distribution before anything is reported.
    - >-
      The cycle-rate intervals are too wide to distinguish anything within budget.
      That is a POWER outcome, is recorded as such, and is not evidence of no
      difference.

  confounders:
    - >-
      Cell-occupancy imbalance. If PART-B's cells are unevenly occupied relative to
      PART-C's, the comparison measures hash quality rather than torsion content.
      The occupancy distribution is a required metric for exactly this reason.
    - >-
      The zero cell. psi_ell(x(R)) = 0 for ell-torsion R must be handled identically
      by PART-B and PART-C, or the comparison is confounded at a rare but
      systematically placed set of points.
    - >-
      Interpreter overhead. In pure Python the cost of a partition evaluation
      relative to a group operation is very different from what it would be in a
      compiled implementation, so the WALL-CLOCK ratio does not transfer. The
      ARITHMETIC ratio does, and both must be reported with the distinction stated.
    - >-
      Small N. At 16 bits the walk is short enough that cycle events are rare and
      the interval is dominated by the number of solves, not by the effect.
    - >-
      Curve family constraints. j = 0 requires p ≡ 1 mod 3 and j = 1728 requires
      p ≡ 1 mod 4; comparing across families without matching N confounds |Aut| with
      instance size.

  interpretation_limits:
    - >-
      No exponent is claimed and none is available: KN-TECH-018 caps the automorphism
      benefit at sqrt(|Aut|) <= sqrt(6), a constant. This record operates entirely
      inside that cap and is baseline calibration.
    - >-
      Zero information about k. The partition is a lossy projection and by
      IDEA-20260807-df906f's rigidity theorem cannot propagate, so it supports no
      search in partition space.
    - >-
      The step-count contrast is forced and is reported as calibration only. Only the
      fruitless-cycle comparison is a genuine measurement.
    - >-
      Toy scale, pure Python; claim_tier capped at toy. Wall-clock ratios do not
      transfer to a compiled implementation.
    - >-
      A cycle-rate difference, if found, is an observation about walk design and not
      an attack; converting it into a cost improvement would require a separate
      record with a charged end-to-end comparison.

  heuristic_assumptions:
    - id: H1
      statement: >-
        Any of the three registered partitions mixes well enough that the rho step
        count is governed by the birthday constant 0.886 and is independent of the
        partition, to within the pre-registered 10 percent inter-partition band, at
        the declared cell counts.
      rigorous_support: >-
        Rigorous half: the birthday bound sqrt(pi*N/2) is exact for a uniformly
        random function, and KN-TECH-001 records the rho expectation in that form.
        Distributional half: the assumption that a concrete partition-based walk
        behaves like a uniformly random function is the standard rho heuristic, the
        same one every published rho cost estimate rests on; it is not a theorem and
        it is exactly what the cell-count ladder is designed to stress.
      validation_plan: >-
        SAMPLE: 5 seeds x 3 field sizes x 3 partitions x a declared cell-count ladder
        (c in {8, 16, 32, 64}), rho run to solution each time. SHORTCUT: none needed;
        toy-scale rho solves in seconds, which is why the mixing heuristic is
        cheaply testable here and not at cryptographic size. COMPARISON
        DISTRIBUTION: measured step count / sqrt(N/|Aut|) against 0.886, and the
        three partitions against each other. TAIL CHECK: the maximum single-solve
        step count against the geometric tail the birthday model predicts -- a heavy
        tail indicates a partition with poorly mixing cells even if the mean looks
        right. TOY SCALE ONLY, LABELLED AS SUCH: this validates mixing at 16-24 bits
        under one implementation and asserts nothing at cryptographic size.

  reachability_gate: >-
    NOT APPLICABLE, and stated rather than omitted. The walk moves between POINTS on
    one fixed curve, never between curves, so T5 imposes no cost and no isogeny
    reachability question arises. Worth recording for the campaign: this is the one
    L7 proposal whose "walk" is a rho walk rather than an isogeny walk, and
    conflating the two would be an easy and expensive error -- rho walks track
    collisions in G (escape E4 of IDEA-20260807-df906f) while isogeny walks move
    between curves (IDEA-20260807-631e80), and the reachability gate binds only on
    the latter.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IMPROVEMENT IS CLAIMED OR POSSIBLE. rho remains 0.886*sqrt(N/|Aut|)
      group operations; the automorphism discount is a constant at most sqrt(6)
      (KN-TECH-018). This record's own contribution to the exponent is exactly zero,
      and its contribution to the CONSTANT is negative: PART-B costs (ell^2-1)/2
      field multiplications per step against PART-A's 2.
    memory_exponent: >-
      Unchanged: O(1) per processor with distinguished points (KN-TECH-006). The
      partition function does not affect memory.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and small per-processor memory (KN-TECH-001, KN-TECH-006), with the
      automorphism-quotient discount of sqrt(|Aut|) on CM curves (KN-TECH-018);
      BSGS at 2*sqrt(N) time and sqrt(N) memory (KN-TECH-031). PART-A (the
      orbit-representative partition) IS the incumbent implementation of the
      discounted baseline, and this record's PART-B is measured against it.
    hidden_overhead: >-
      The per-step cost, which is normally ignored in step-count accounting and is
      precisely where this proposal loses. Reporting step counts without field
      multiplications per step would hide a 2x to 42x penalty, and the record makes
      the multiplication count a required metric for exactly that reason.
    tradeoff_note: >-
      No time-memory tradeoff is affected: the partition function is orthogonal to
      the distinguished-point tradeoff and to parallelisation, which retains its
      linear speedup under any partition. The only tradeoff is per-step cost against
      partition canonicity, and this record measures its price.

  dominated_by: >-
    AS AN ATTACK: dominated on every axis by the incumbent it is measured against,
    and the domination is DERIVED rather than measured. Checked individually:
    parallel rho with distinguished points and the orbit-representative partition
    (0.886*sqrt(N/|Aut|) group operations, O(1) memory per processor, linear
    parallel speedup, 2 field multiplications per step for the partition;
    KN-TECH-001, KN-TECH-006, KN-TECH-018) dominates PART-B on per-step cost by
    (ell^2-1)/4 -- a factor 2 at ell = 3 rising to 42 at ell = 13 -- while matching
    it on step count, memory and parallelisation. BSGS (2*sqrt(N) time, sqrt(N)
    memory; KN-TECH-031) is incomparable on memory and dominated on it, unchanged by
    anything here. Pohlig-Hellman (KN-TECH-030) fixes N identically for both.
    Data/query axis: identical, no oracle. THERE IS NO AXIS ON WHICH PART-B WINS.
  sota_delta: >-
    Negative and quantified: PART-B costs (ell^2-1)/2 field multiplications per rho
    step against PART-A's 2, i.e. 2x at ell = 3, 6x at ell = 5, 12x at ell = 7, 30x
    at ell = 11, 42x at ell = 13, for a step count that is forced to be identical.
    The delivered value is therefore not a speedup but three numbers this program
    does not currently have: the measured 0.886 calibration on |Aut| in {2, 4, 6}
    curves (which H-ENDO-001 pre-registers and has never measured), the first
    fruitless-cycle rate measurement in this repository, and the wall-clock cost of
    an algebraically canonical partition against a constructed one.

  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: low

  honest_prior_of_survival: >-
    0.97 that the weighted-homogeneity derivation is correct -- it is standard,
    though the specialisation arithmetic (u^6 = 1 for j = 0, 8 | ell^2 - 1 for odd
    ell) is exactly the kind of index bookkeeping that goes wrong, which is why both
    specialisations are self-tests rather than assumptions. 0.9 that the |Aut| = 2
    baseline reproduces 0.886 within 20 percent. 0.9 that the step count is
    partition-independent (it is forced). 0.5 that the fruitless-cycle comparison has
    enough power to say anything at all within budget -- this is the honest reason
    the priority is LOW: the only non-forced measurement in the record is also the
    one most likely to return a power outcome rather than a result. Near 0 that
    PART-B is competitive; the cost ratio settles that before the experiment runs,
    and the record says so in claim (B) rather than discovering it.

