idea:
  id: IDEA-20260820-3e1031
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Automorphism-orbit quotient lists with public orbit-stabilizer witnesses
  class: algebraic certificate proposal
  claim: >-
    When a publicly computable automorphism group acts equivariantly on a finite
    ideal candidate fibre, the candidate list can be quotiented into exact
    orbits and certified with orbit-stabilizer and public-curve witnesses. This
    removes only public symmetry duplicates; it is not transcript information,
    secret recovery, or an SSI hard-problem result.
  mechanism: >-
    Construct a finite candidate fibre C(E_A), a public group G generated by
    verified automorphisms, and an explicit action G x C -> C. Audit the action
    laws and a commuting square showing that conversion to the public curve is
    equivariant. Enumerate one canonical representative per orbit. For each
    representative publish generators for its stabilizer, the orbit size
    equality |Orb(I)| = |G|/|Stab(I)|, and conversion witnesses for every lift
    needed by the verifier. The output is a quotient list plus a lossless lift
    procedure, never a claim that one orbit is more likely than another.
  novelty_status: unverified
  status: proposed
  source_refs:
