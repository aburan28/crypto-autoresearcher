  predictions:
    - id: P1
      statement: >-
        On every exhaustive toy fibre, the action identity and composition laws,
        conversion equivariance square, orbit partition, and orbit-stabilizer
        equality hold with zero exceptions.
      metric: certificate violations
      threshold: exactly 0
      test_boundary: all candidates and generators in fibres of size <= 4096
    - id: P2
      statement: >-
        In a planted positive containing m-fold symmetry duplicates with m >= 4,
        the quotient has size exactly N/m when the action is free and every
        original candidate is recovered by the lift procedure.
      metric: quotient size and lift coverage
      threshold: size = N/m and coverage = 1
      test_boundary: synthetic free actions with m in {4, 8, 16}
    - id: P3
      statement: >-
        Genuine-simulator and real-transcript inputs produce identical orbit
        partitions because the quotient uses only fixed public algebraic data;
        any transcript-dependent difference is an implementation artifact.
      metric: partition disagreement count
      threshold: exactly 0
      test_boundary: paired inputs sharing the same public fibre
  controls:
    - genuine-simulator null requiring the identical public orbit partition
    - planted positive with known free m-fold duplicate action
    - nonfree planted action with known stabilizers and nonuniform orbit sizes
    - random permutation generators that fail closure and must be rejected
    - nearby curve with trivial automorphism group and therefore no quotient gain
    - exhaustive orbit expansion and public-curve reproduction for every lift
  falsification_conditions:
    - any group-action or conversion-equivariance identity fails
    - orbit-stabilizer certificate gives an incorrect orbit size
    - quotient cannot losslessly lift to the full declared candidate fibre
    - quotient size changes with transcript source for the same public fibre
  confounders:
    - confusing curve automorphisms with a well-defined action on ideal witnesses
    - canonical-representative tie breaks that depend on hidden representation order
    - missing stabilizer generators
    - counting public symmetry removal as cryptanalytic information
  interpretation_limits:
    - quotient reduction is deterministic public preprocessing, not leakage
    - nontrivial automorphisms may be rare or already canonicalized in relevant parameters
    - no transcript distinguisher, key recovery, EndRing, OneEnd, or path-finding claim
    - KN-TECH-058 provides no verified GRH support for this card
  heuristic_assumptions:
    - the full finite candidate fibre is available on the test boundary
    - public automorphism generators and their action on witnesses are correct
    - conversion witnesses compose equivariantly with the action
  target_complexity:
    baseline: N separately represented candidate ideals
    proposed: exactly the number of public G-orbits plus lossless lift certificates
    success_probability: deterministic if all action and completeness premises hold
  cost_model:
    time: group closure, orbit enumeration, stabilizer computation, and lift verification
    memory: visited candidates, orbit representatives, stabilizer generators, and witnesses
    data: no transcript data required; paired transcripts serve only as an artifact control
    preprocessing: candidate fibre and public automorphism construction
    oracle_access: public algebraic data only
    verification: action laws, commuting square, orbit-stabilizer equality, and curve reproduction
  proof_search_map:
    baseline_reproduction: enumerate the full fibre and verify quotient-lift equality exactly
    observation_collision_search: search for distinct orbits with identical canonical encodings and reject collisions
    quantifier_order: fix fibre, group, action, and canonicalization before observing any transcript
    method_ceiling: use a trivial-action nearby curve proving the quotient cannot beat N
    nearby_object_control: run random non-group permutations and require action-law rejection
  nearest_neighbors:
    - IDEA-20260815-56f047: representation canonicalization without orbit-stabilizer certificates
    - IDEA-20260820-b87428: transcript syndrome quotient rather than exact public symmetry quotient
    - IDEA-20260808-287361: public-stratum projection at the transcript level
  dominated_by: n/a (no result claimed)
  sota_delta:
