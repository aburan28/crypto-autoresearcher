  title: |-
    The Serre-Tate canonical lift is a CM curve over a class field of degree about sqrt(p)
  class: control
  claim: |-
    For random ordinary curves at p in 2^20 .. 2^48, h(D) fits c * sqrt(p) times a slowly varying factor; at small p the Newton-iterated canonical j satisfies H_D(j) = 0 mod p^k; the p-adic j admits no rational approximation of height below p^(k/2).
  mechanism: |-
    Ordinary E/F_p has End = order O of discriminant D = (t^2 - 4p)/f^2; the canonical lift has CM by O and its j lies in the ring class field of degree h(D), about sqrt(p). It cannot be written globally at cryptographic size, and p-adic approximation (Satoh-style Newton on Phi_p) is only available for small p because deg Phi_p = p + 1.
  novelty_status: unverified
