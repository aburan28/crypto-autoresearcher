  assumptions:
    - >-
      Koblitz toy at n = 31 (a = 1: #E = 2 x 1073696471; a = 0:
      #E = 4 x 536893589; hand Lucas-recurrence arithmetic, worksheet AC-9,
      primality not checked). G is admitted at setup as the largest
      prime-order subgroup with r not dividing #E(F_2). The structure (a stable
      V) is a property of the field and needs no prime cofactor.
    - The ordinary null curve over F_{2^31} is drawn at setup with b not in F_2 and the same admission rule.
    - >-
      OFF-LIMITS COMPONENTS declared: F2 (decomposition) as the family and F6
      (endomorphism orbit) as the named operation set only. No new factor
      base.
    - No run at n >= 131; deployed rows enter only as the arithmetic of claim (E).
  proof_search_map:
    bottleneck: >-
      Whether the curve's Frobenius structure changes the cost of one m = 4
      decomposition attempt at all, once the per-instance divisor is gone. That
      is the residue of 493606's affordability claim.
    baseline_embedding:
      parameter_slice: >-
        The ordinary-curve arm at the same (n, V, m, l) is the baseline. Under
        the counting identity it and the Koblitz arm have the same search
        space. On the orbit system the gauge j = 0 slice is the
        single-instance search exactly.
      reproduction_check: >-
        Frozen fixture E0. (i) The CNF-XOR exports of the Koblitz and ordinary
        instances at the same (V, m, l) have identical variable counts and
        identical block structure. (ii) 20 planted SAT targets per arm, each
        certified by group arithmetic. (iii) The search-size figure
        2^{ml}/m! (and the multiset form) is printed beside the measured
        median before any ratio is read.
    observation_collision:
      observable: Median per-target UNSAT leaf count, Koblitz arm over ordinary arm.
      distinct_preimage_search: >-
        A ratio below the band could come from (i) a Frobenius-dependent
        solver effect, the live reading; (ii) a difference in the descended
        system's sparsity between a in F_2 and a generic b; (iii) a different
        abscissa density of V on the two curves (fewer factor-base points means
        a different leaf test). (ii) is separated by reporting the CNF-XOR
        clause and XOR-row counts per arm. (iii) is separated by reporting
        |F_V| per arm, and the polynomial-window base gives a second V with
        different density on the same curves.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The orbit system's gauge quotient as the single-instance search (claim (A)).
        predicted_gain: None; the n cancels. That is the content.
      - transform: observable_fiber
        proposed_object: Fix the search space (V, m, l) and vary only the curve (Koblitz, ordinary) and the base shape (stable, window).
        predicted_gain: Separates curve effects from search-space size.
    quantifier_order: >-
      Counting identity: FOR ALL Koblitz toys, FOR ALL stable V, FOR ALL m, the
      gauge-fixed orbit search space equals |V^m / S_m|. Exact. Admissibility
      screen: FOR the four degrees and m = 4, EXISTS a stable V with
      4 (l - 1) <= n and l >= 2 IFF n = 31 and l in {5, 6}. Exact arithmetic.
      Shape null: FOR the tested cells and the named solver, ratio in the band.
      Heuristic.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At n = 31, m = 4, l in {5, 6} on a stable V, the complete CNF-XOR
        search's median UNSAT leaf count is [measured] on the Koblitz toy and
        [measured] on the ordinary curve, ratio [measured], against a search
        size of 2^{ml}/m!." It certifies nothing about m >= 5, nothing about
        cost per relation, nothing about any deployed curve, and nothing about
        the crossover of IDEA-20260807-32f96d.
      nearby_object_control: >-
        Blocking. The ordinary curve at identical (n, V, m, l) is where the
        withdrawn divisor would be absent by construction; the polynomial
        window base is where no stable structure exists. Both must agree with
        the Koblitz stable arm within the band for the null to be read.
    proof_obligations:
      - claim: Counting identity of claim (A) (free C_n action on Omega; gauge j = 0).
        responsibility: correctness
      - claim: The m = 4 admissibility screen at n in {17, 23, 31, 41} (worksheet AC-11).
        responsibility: correctness
      - claim: ord_37(2) = 36 and ord_29(2) = 28 (493606's degrees host no nontrivial stable subspace).
        responsibility: correctness
      - claim: The deployed arithmetic of claim (E) uses D3, never D1, and the CORR-20260922-81aeab rho.
        responsibility: interface
      - claim: Every SAT answer certified by group arithmetic; every UNSAT count reported with the solver's termination reason.
        responsibility: correctness
      - claim: No sentence states a speedup, an exponent move, an affordability advantage for a curve shape, or a closure.
        responsibility: scope
    not_applicable_reason: null
