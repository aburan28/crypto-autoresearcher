  minimal_test:
    design: >-
      STAGE 0 (zero compute; in the worksheet). The counting identity written
      out; ord_n(2) and stable dimensions at 17, 23, 29, 31, 37, 41; the m = 4
      admissibility screen; the search sizes; the claim (E) arithmetic. STAGE 1
      (setup). F_{2^31} with a fixed irreducible polynomial verified at setup;
      factor Phi_31 over F_2 into six quintics; build V5 = ker g(sigma) for one
      quintic g and V6 = F_2 + V5. Build the Koblitz toy (a = 1, second curve
      a = 0) and one ordinary curve with b not in F_2. Recompute #E, admit G,
      run fixture E0. STAGE 2 (the measurement). For each curve, base (V5, V6,
      windows {deg < 5} and {deg < 6}) and l: 50 seeded UNSAT targets and 20
      planted SAT targets, complete CNF-XOR search at m = 4 with WDSat's S_m
      lexicographic breaking. Record conflicts, decisions, wall clock,
      termination reason and certificates. SOLVER: WDSat (vendored per
      DEC-20260924-99ce20 HOLD-A; build not verified here). A missing build is
      an impediment, never evidence. CHEAPEST VALID DISCRIMINATOR: l = 5,
      Koblitz and ordinary on V5, 50 UNSAT targets each. With a search size of
      about 4.4e4 leaves per instance this is seconds per instance with a
      built solver (estimate). It separates the withdrawn divisor (ratio near
      0.032), the null (near 1) and a shape effect that is not the divisor
      (between, replicated, not reproduced by the window control).
    controls:
      - Ordinary curve at identical (n, V, m, l) (blocking).
      - Polynomial-window base of the same dimension (base-shape control).
      - Fixture E0 (equal export structure; planted certificates).
      - Two Koblitz curves (a = 0 and a = 1) as within-shape replicate.
    required_metrics:
      - median, interquartile range and maximum of per-target UNSAT conflicts, per arm and base
      - '|F_V| per curve and base; clause and XOR-row counts per export'
      - certificate pass rate on planted targets
      - solver name, version, build hash, branching order, termination_reason, wall clock and peak memory per run
  falsification_conditions:
    - 'Koblitz/ordinary median ratio outside [0.8, 1.25], replicated on both Koblitz curves and not reproduced by the window control: the shape null is false at m = 4 on this solver; route to review-adversarial before any interpretation.'
    - 'Ratio near 1/31 (below 0.1) on the Koblitz stable arm: a per-instance Frobenius divisor exists, contradicting claim (A)''s premise (Proposition Sigma) at this cell; headline, replicate.'
    - 'Any planted certificate failing, or fixture E0 failing: soundness or instrument defect; run void, no evidence either way.'
    - 'An admissible stable m = 4 pair other than (31, 5) and (31, 6) found by independent arithmetic: the screen is wrong and (C) is restated.'
  confounders:
    - >-
      Abscissa density. |F_V| can differ between curves for the same V, which
      changes the leaf test and not the search. It is reported per arm and the
      ratio is read beside it.
    - Descended-system sparsity differs between a, b in F_2 and a generic b; clause and XOR-row counts are reported.
    - Solver and branching order dominate absolute counts; ratios on the same solver and order are the read quantity.
    - >-
      Below-cap cells. At l = 5 the expected decompositions per target are
      about 2^20/(24 x 2^31), so nearly every target is UNSAT. Planted targets
      carry the SAT side.
    - A memory abort or timeout is an infrastructure outcome (AGENTS.md core rule 5), never evidence about the null.
  interpretation_limits:
    - Proposal only. No experiment, approval, run or result exists here.
    - Toy tier at n = 31, m = 4, l in {5, 6}. Nothing transfers to m >= 5, to other n, or to any deployed curve.
    - >-
      The cell narrows IDEA-20260807-32f96d's gap by one binary cell on one
      solver. It does not address the arity crossover and does not need a
      Koblitz shape.
    - >-
      Not a competitiveness claim. The claim (E) arithmetic places a deployed
      m = 4 CNF-XOR attempt about 2^116 above the D3 budget, and no outcome
      here moves that.
  heuristic_assumptions:
    - id: H1
      statement: >-
        CURVE-SHAPE INDEPENDENCE AT m = 4. For a complete CNF-XOR search with
        S_m lexicographic breaking at n = 31, m = 4, l in {5, 6}, the median
        per-target UNSAT leaf count on a Koblitz toy and on an ordinary curve,
        at the same V, agree within a factor 1.25.
      rigorous_support: >-
        RIGOROUS PART. The counting identity of claim (A): the search space has
        the same size on both curves, and the Koblitz curve has no per-instance
        Frobenius divisor (Proposition Sigma, cited). HEURISTIC PART. Unit
        propagation prunes no differently on the two curves. This imitates
        consequence B2 of IDEA-20260904-3c7a91's proposed law (conflict count
        independent of the curve within 1 percent), itself a no-above-leaf-
        pruning model in which curve constraints only decide leaves.
      validation_plan: >-
        SAMPLE 50 UNSAT targets per arm, two Koblitz curves and one ordinary
        curve, two bases and two l. No shortcut is needed at this size. COMPARE
        median ratios against [0.8, 1.25] with bootstrap intervals over
        targets. TAIL CHECK: per-target maxima per arm, so that one heavy
        target cannot drive the median. TRANSFER: none beyond the cell.
  heuristic_note: >-
    The counting identity and the admissibility screen are exact. H1 is the
    only heuristic. Its expected outcome is the null. A replicated ratio near
    1/31 would mean a per-instance divisor exists after all, contradicting the
    ceiling, and would be the headline.
  target_complexity:
    time_exponent: >-
      No claim. The per-attempt search exponent at m = 4 is ml - log2 24 on
      every curve shape. The original's log2(n) shift (5.21 bits at n = 37) is
      withdrawn.
    memory_exponent: No claim; poly(n, l) for the CNF-XOR arm, unchanged.
    best_known: >-
      ECC2K-130: matched rho 2^60.8090; m = 4 per-attempt budget D3 2^11.01
      (CORR-20260928-4cb669). Within the decomposition family,
      IDEA-20260904-96c4f3's frontier rows and forward condition, unchanged.
    hidden_overhead: None; every figure is an explicit count.
    tradeoff_note: Not applicable.
  estimated_cost:
    implementation: medium
