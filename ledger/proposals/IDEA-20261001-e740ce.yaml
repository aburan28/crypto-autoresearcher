  title: >-
    THE FROBENIUS DIVISOR OF 493606 CANCELS EXACTLY ON THE ORBIT SYSTEM, SO ITS
    KOBLITZ-VERSUS-PSEUDORANDOM AFFORDABILITY SPLIT IS PREDICTED TO VANISH. An
    m = 4 cell on a toy that hosts a Frobenius-stable base exists, among
    n in {17, 23, 31, 41}, only at n = 31 with dim V in {5, 6} (search sizes
    about 2^20/24 and 2^24/24). It is reachable on every curve shape alike and
    is measured as a curve-shape null: Koblitz over ordinary leaf-count ratio
    predicted in [0.8, 1.25] against the withdrawn 1/31.
  class: measurement
  claim: >-
    SETTING. As in IDEA-20261001-93e740: Koblitz toys E over F_{2^n} (a, b in
    F_2), n an odd prime, G of prime order r with r^2 not dividing #E and G
    meeting E(F_2) only in O, and sigma the absolute Frobenius acting on G as
    lambda of order n. Ordinary null curves (b not in F_2) are taken over the
    same fields. V is an F_2-subspace of dimension l, m the arity. CLAIM TIER
    toy. No attack and no exponent claim.

    (A) THE DIVISOR n CANCELS ON THE ORBIT SYSTEM (exact counting identity;
    R4-a; HOLD-T). 493606 priced a Koblitz cell at 2^{ml}/(m! mu) leaves with
    mu = n, importing a per-instance Frobenius divisor from
    IDEA-20260922-7ab503. Re-entered through a77711's equivariance, squaring
    maps the system for R to the system for sigma(R), so the divisor can only
    live on the ORBIT SYSTEM of the n conjugate targets. Take V stable. Its
    search space is Omega = (V^m / S_m) x Z/n, a tuple t plus an index j
    meaning "decompose sigma^j R", so |Omega| = n |V^m / S_m|. C_n acts on
    Omega by (t, j) -> (sigma t, j + 1). The action is free because j moves,
    and it carries solutions to solutions (a77711 Lemma A1). Gauge fixing keeps
    one point per orbit (j = 0, say) and leaves |Omega| / n = |V^m / S_m|
    points, the single-instance search for R. So per target the stabiliser
    divisor n is cancelled exactly by the n-fold target multiplicity. On a
    single instance (j fixed) no Frobenius divisor exists at all: the ceiling
    is 9c5694 Proposition Sigma (stabiliser S_m), cited by id and not
    re-proved. A per-instance canonical rule is unsound, with its loss law in
    IDEA-20261001-93e740 claim (D). Hence |G| = m! on every curve shape.
    493606's Koblitz arm (2^32/(24 x 37) = 4,836,674.9 leaves) and its
    pseudorandom arm (2^32/24 = 178,956,970.7) are predicted EQUAL at the
    latter value. The identity concerns search-space SIZE. It is exact and does
    not depend on a77711 Lemma A2, whose sign-free refinement (93e740 claim
    (C)) changes solution counts by sporadic coincidences only.

    (B) TOY DEGREES (R4-c; recomputed in worksheet AC-1 to AC-4, AC-7, AC-8).
    The sigma-stable subspaces of F_{2^n} have dimensions j d and j d + 1,
    d = ord_n(2), 0 <= j <= (n - 1)/d. 493606's own degrees: ord_37(2) = 36
    and ord_29(2) = 28, so only dimensions 0, 1, n - 1, n exist and neither
    hosts a nontrivial stable subspace (HOLD-T confirmed by recomputation). The
    R4-c degrees: n = 17 (ord 8: dimensions 8, 9), n = 23 (ord 11: 11, 12),
    n = 31 (ord 5: 5, 6, 10, 11, 15, 16, ...), n = 41 (ord 20: 20, 21).

    (C) IS THE m = 4 CELL REACHABLE ON A TOY THAT HOSTS THE STRUCTURE?
    Using IDEA-20260904-96c4f3's validity range m (l - 1) <= n with l >= 2, at
    m = 4 the admissible l are l <= 5 (n = 17), l <= 6 (n = 23), l <= 8
    (n = 31) and l <= 11 (n = 41). The stable dimensions meeting that bound are
    5 and 6 at n = 31 only (there are 6 stable subspaces of each). So yes, at
    exactly one of the four degrees: n = 31, l in {5, 6}. Search sizes
    2^{ml}/m! = 2^20/24 = 43,690.7 and 2^24/24 = 699,050.7. The multiset
    counts C(2^l + 3, 4) are 52,360 and 766,480; IDEA-20260904-3c7a91 argues the
    former form applies, and the arms below share whichever applies. These sizes
    hold on ANY curve over F_{2^31} with the same V. The cell is reachable, but
    not because of the Koblitz shape, and 493606's claim that "standardized
    curve shape decides which arity is affordable" has no content after (A).
    The anchor 493606 used (about 2.8e6 leaves at m = 3, l = 8, from
    IDEA-20260904-b40e6d) is a design estimate, not a run, and is not used.

    (D) WHAT IS MEASURED. A curve-shape null at m = 4. On F_{2^31} with a
    stable V of dimension 5 or 6, the complete CNF-XOR search's per-target
    UNSAT leaf count (conflicts) is measured on the Koblitz toy and on an
    ordinary curve, same V, same solver. Prediction: ratio Koblitz/ordinary in
    [0.8, 1.25]. The withdrawn prediction was 1/31, about 0.032. A
    polynomial-window base {deg < l} of the same dimension is the base-shape
    control. This gives an m = 4 binary decomposition cell on a toy that hosts
    the structure. It narrows IDEA-20260807-32f96d's "zero measured m >= 4
    cells" gap (as of that record) by one cell on one solver and does not
    touch the crossover question.

    (E) BEARING, PRICED (RV-6). At ECC2K-130 the m = 4 per-attempt budget is
    D3 = 2^11.01 (CORR-20260928-4cb669; D1 is never a budget). A CNF-XOR
    attempt at the balanced l = 33 has search size 2^{132}/24 = 2^{127.42}, so
    it sits 2^{116.4} above D3 (arithmetic, AC-12). A per-instance factor 131
    (7.03 bits) would not close that and does not exist. Matched rho is
    2^60.8090 (CORR-20260922-81aeab). Any per-orbit relation framing (one
    solve serving n conjugate targets on a stable base) is conditional under
    CORR-20260925-649e25 and is not used here. Nothing is a speedup, an
    exponent move or a deployed-curve verdict.
  mechanism: >-
    OBJECT FRAME. Representation R1 (x-coordinates; CNF-XOR descent of
    S_{m+1}). Operation set Sigma_op = <sigma> on the orbit system Omega, not
    on one instance. Trichotomy: partial-action, as index calculus itself.
    LOSSY-PROJECTION TEST against Sigma_op. Omega -> Omega / C_n is lossy (n to
    1) and deterministic, but Omega / C_n is in bijection with the
    single-instance space, so as a cost object it is a change of coordinates.
    That is the algebraic content of (A), and it costs no compute. The
    measurement in (D) tests the one thing the identity cannot settle: whether
    a real solver's leaf count depends on the curve when the search space does
    not. 3c7a91's proposed law (its consequence B2, independence of the curve)
    predicts it does not.
