idea:
  id: IDEA-20261015-cba035
  question_id: RQ-CMFB-33610e
  added: '2026-10-15'
  title: >-
    Family-level test for p = 5t^2+19t+19 against a random-conductor D=-19
    null and a random-curve null, with exact yield as the instrument check and
    a member-count (power) gate before any growth claim
  class: measurement
  claim: >-
    Write v = t+2. Members satisfy p = 5v^2 - v + 1, N = 5v^2 - 2v + 4 =
    5t^2+18t+20, trace t = v-2, pi = vw - 1, twist order 5v^2; they are the
    D=-19 curves of maximal conductor v ~ sqrt(p/5). Three explanations of any
    deviation from a matched random base: E1 twist/QR structure (qr_window),
    E2 CM(-19) class, E3 the family polynomial (maximal conductor). Predicted:
    (M0) exact mean yield ratio 1.000000 in every arm (KN-FIND-007), so yield
    is an instrument check, never a signal; (M1) coverage ratio of the small-x
    base in [0.99, 1.01] in all three arms, no slope in bit size; (M2)
    qr_window scan efficiency (points per scanned candidate) 2.0 +- 0.02
    versus an unfiltered window, in all arms. Only M2 is expected to move; a
    family-vs-N-A difference isolates E3, N-A vs random curves isolates E2.
  mechanism: >-
    PAIR: representation = small-x window over the family member's own
    Weierstrass chart; operation set Sigma = translation by base elements
    (the endomorphism w is a scalar on G and adds nothing, see
    IDEA-20260807-5dfe4a). TRICHOTOMY: Class I partial-action (standard IC).
    LOSSY-PROJECTION TEST: the window projection x -> [0,B) is lossy and
    Sigma-compatible only as the usual +- fold; it is the known object, the
    new element is the family-versus-null design, not a new object. Delta over
    IDEA-20260726-010 (hidden-CM density, one hardness-proxy panel): the
    maximal-conductor sub-family, a D=-19 random-conductor control separating
    E2 from E3, conservation-aware metrics, a growth arm, and the member-count
    gate.
  novelty_status: adaptation
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-5931ee
      - KR-IC-73db3f
      - KR-IC-955fd6
      - KR-RHO-755e35
      - KR-IC-791cb7
    nearest:
      - ref: KN-FIND-007
        provenance: internal
        relation: special_case
        delta: M0 is its exact identity, used as the instrument check.
      - ref: KR-RHO-755e35
        provenance: kb
        relation: adjacent
        delta: >-
          Isogenous curves are equally hard, so a member shares N, embedding
          degree and weakness classes with its whole isogeny class and the
          family cannot be weaker through those. The null prediction rests on
          this row; only class-level structure (E2, E3) is left to detect.
      - ref: KN-TECH-6a2ef9
        provenance: internal
        relation: adjacent
        delta: >-
          rho on crater vs floor is blind to level; here the question is asked
          of decomposition coverage and scan efficiency.
      - ref: KN-TECH-018
        provenance: internal
        relation: adjacent
        delta: CM automorphism rho speedup needs |Aut| > 2; here Aut = {+-1}.
      - ref: KR-IC-791cb7
        provenance: kb
        relation: orthogonal
        delta: binary-field GHS and isogeny walks; this record is prime-field only.
  citations:
    - ref: KN-FIND-007
      provenance: internal
      claim: mean decomposition yield of any B-element base is binom(B+m-1,m)/N
      verified_by: idea-generator (statement read 2026-10-15)
  assumptions:
    - D=-19 null curves are drawn as 4p' = a^2 + 19 b^2 with b != a + 2.
  proof_search_map:
    not_applicable_reason: >-
      Measurement design; the identity M0 is the exact baseline and its failure
      voids the run.
  predictions:
    - metric: exact mean yield ratio to binom(B+2,3)/N
      direction: different
      minimum_effect: 1.000000 to machine epsilon in every arm
    - metric: m = 3 coverage ratio vs matched random base
      direction: higher
      minimum_effect: >-
        none expected; any effect of 1.02 or more with a positive slope in bit
        size is a lead
    - metric: qr_window points per scanned candidate
      direction: higher
      minimum_effect: 2.0 +- 0.02 (positive control)
    - metric: members per octave of t (p and N prime; v prime sub-arm)
      direction: different
      minimum_effect: >-
        reported before any outcome; cells with fewer than 8 members are
        flagged UNDERPOWERED and never read as matching the null
  minimal_test:
    design: >-
      Sieve odd t with p, N prime (and v prime) up to 2^15; cells at
      p ~ 2^16, 2^20, 2^24, 2^28; per member: small-x base B = ceil((6N)^{1/3}),
      exact m = 3 coverage by sorted-sum counting, 200 matched random bases,
      qr_window and unfiltered scan counts. Null arms with the same N-range:
      N-A (D=-19, other conductor), N-B (random prime-order curves).
    controls:
      - matched random base
      - N-A and N-B null arms
      - qr_window positive control
      - planted-relation base as sensitivity check
    required_metrics: [members per cell, M0, coverage ratio with CI, scan ratio]
  falsification_conditions:
    - M0 differs from 1 beyond epsilon (instrument or counting defect, void)
    - qr_window ratio outside 2.0 +- 0.05 (instrument cannot see structure)
    - >-
      coverage ratio >= 1.02 in the family but not in N-A, with positive
      bit-size slope (E3 lead; escalate with independent replication)
  confounders: [too few members per cell, base-size rounding, pseudo-replication across t, p mod small primes]
  interpretation_limits: >-
    Coverage and scan efficiency only; solver cost and rank are not measured
    (conservation makes yield vacuous, EV-FBG-001). Toy sizes 16-28 bit; no
    claim at 2^52 without a growth arm of >= 3 sizes. KN-OPEN-020 class:
    explicit window (no escape claimed).
  heuristic_assumptions:
    - id: H1
      statement: >-
        For each member, small-x coverage equals that of a matched random
        base up to the +-0.5 percent per-cell resolution of EV-FBG-001.
      rigorous_support: conservation identity plus coverage <= min(1, mean)
      validation_plan: >-
        200 matched random draws per cell, permutation p-values, family
        cluster bootstrap over members; tail = largest single-member excess
    - id: H2
      statement: >-
        Member counts follow Bateman-Horn with the singular series C computed
        from roots of p(t) N(t) mod q.
      rigorous_support: >-
        none (conjecture, recalled and unread); imitates prime-pair densities
      validation_plan: >-
        exact sieve count per octave vs the integral; mismatch only changes
        power, not any outcome
  target_complexity:
    time_exponent: none claimed (measurement); advantage over N^{1/2} excluded
    memory_exponent: not applicable
    best_known: rho 0.886 sqrt(N), O(1) memory
    hidden_overhead: not applicable
  dominated_by: n/a (no result claimed)
  sota_delta: none; a deviation would be a measurement lead, not a speedup
  estimated_cost: {implementation: low, compute: low}
  recommended_priority: high
  status: proposed
  proposed_by: idea-generator
  source_refs: [RQ-CMFB-33610e]
