idea:
  id: IDEA-20261016-397ac9
  title: Does Delgado’s 2^{80} n^4 factor enter the unconditional runtime at n=256
  status: proposed
  question_id: RQ-WESO-8aff57
  proposed_by: idea-generator
  approved_by: null
  added: '2026-10-16'
  class: control
  claim: >-
    At bit length n = 256, the factor 2^{80} n^4 = 2^{112} quoted from
    Delgado’s Theorem 4.4 (arXiv:2609.22018v1, p.16, via KN-LIT-6fb205)
    multiplies the number of objects examined in the proof of Theorem 5.3.
    The trial factor alone is then 2^{112}. One p^{1/3} pass per trial, with
    p ≈ 2^{256}, multiplies that factor by ≈ 2^{85} and yields a product
    ≥ 2^{197}, above the frozen source’s Delfs–Galbraith line ≈ 2^{128}.
    Under that multiplication, Heuristic 1 stays load-bearing for any NIST-I
    claim below 2^{128} F_{p^2}-operations that is based on this unconditional
    write-up. This is an audit of quoted constants, not a verification that
    Theorem 5.3 is correct.
  mechanism: >-
    KN-LIT-6fb205 quotes two statements about the same algorithm: Theorem 4.4’s
    density at least p/(2^{80} n^4), and an expected trial count O(n^4)
    (Eq. 55). At n = 256 those expressions differ by the factor 2^{80}. The
    tracked object is a (d,+1)-structure for d in the deterministic family D_p:
    one smooth conjugate isogeny, discarding the rest of End(E). The operation
    set is list matching, a partial action on those structures, not translation
    on a prime-order subgroup. Colour coding is part of the cited algorithm
    and is not re-designed here. IDEA-20260805-332316 audits quantifier order
    against Isyanov ePrint 2026/1586. IDEA-20260926-4a496f samples Wesolowski’s
    Heuristic 1; it does not expand 2^{80} n^4.
  novelty_status: unverified
  citations:
    - {ref: KN-LIT-6fb205, provenance: internal, claim: "Quotes Theorem 4.4 (2^{80} n^4), Eq. 55 (O(n^4)), Theorem 5.3, and the concrete-cost disclaimer. PDF not opened this turn.", verified_by: idea-generator}
    - {ref: "arXiv:2609.22018v1", provenance: recalled, claim: "Unconditional OneEnd in p^{1/3} exp(O(√(log p log log p))).", verified_by: null}
    - {ref: KN-LIT-678a43, provenance: internal, claim: "Udovenko unconditional p^{2/5+o(1)} is a non-practical skeleton.", verified_by: idea-generator}
    - {ref: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, provenance: internal, claim: "Theorem 1.1 stays conditional on Heuristic 1; previous methods ≈ 2^{128}.", verified_by: idea-generator}
  assumptions:
    - "The knowledge-note quotations match the PDF tokens. The test checks that match."
    - "p^{1/3} at log2(p) = 256 is arithmetic on the quoted exponent, ≈ 2^{85.3}."
    - "Theorem 3.5 and Theorem 4.4 are not asserted true."
  proof_search_map:
    bottleneck: "Whether 2^{80} is cancelled between Theorem 4.4 and Theorem 5.3."
    baseline_embedding:
      parameter_slice: "Wesolowski Theorem 1.1, conditional p^{1/3+o(1)}, same OneEnd problem."
      reproduction_check: "Confirm the strings 2^{80}, n^4, and O(n^4) on the stated PDF pages."
    observation_collision:
      observable: "Presence of 2^{80} in Theorem 5.3’s displayed runtime product."
      distinct_preimage_search: "A density slack and a constructive enumeration can carry different constants."
    constructive_transforms:
      - {transform: specialization_pack, proposed_object: "n = 256 substituted into the quoted factors", predicted_gain: "Yes or no on Heuristic 1 staying load-bearing for this write-up’s NIST-I relevance."}
    quantifier_order: "Does every run of the Theorem 5.3 algorithm pay 2^{80}, or does some constructive listing have expectation O(n^4) after cancellation?"
    method_ceiling:
      strongest_certifiable_claim: "Which quoted expression is the runtime factor. Not correctness of the unconditional theorem."
      nearby_object_control: "If 2^{80} cancels and the proof stays unchecked, KN-LIT-678a43’s p^{2/5+o(1)} remains the unconditional skeleton (2/5·256 = 102.4 bits names the skeleton only)."
    proof_obligations:
      - {claim: "2^{80} n^4 multiplies the Theorem 5.3 object count at n = 256", responsibility: runtime}
      - {claim: "PDF tokens match KN-LIT-6fb205", responsibility: baseline}
    not_applicable_reason: null
  predictions:
    - {metric: "1 if 2^{80} remains in the Theorem 5.3 runtime product at n = 256, else 0", direction: higher, minimum_effect: "1, so the quoted trial expressions disagree by 2^{80}"}
  minimal_test:
    design: "Read arXiv:2609.22018v1 Theorem 4.4 (p.16), Eq. 55, and the proof of Theorem 5.3 (p.22). Mark where 2^{80} is introduced and where the expected-time product closes. Substitute n = 256 only after that reading."
    controls: ["A second reader marks the same lines.", "Track quoted 2^{50} n^2 on the same sheet."]
    required_metrics: ["Page of introduction and of cancellation or multiplication", "Exponent of 2 in the trial factor at n = 256"]
  falsification_conditions:
    - "The proof shows expectation O(n^4) with 2^{80} cancelled by a displayed identity. Heuristic 1 is then not necessary for that write-up’s exponent. NIST-I stays inconclusive here because the preprint disclaims concrete cost."
    - "The PDF tokens differ from the knowledge note. Withdraw 2^{112} until the PDF’s constants are substituted."
  confounders:
    - "O(n^4) may count trials in a constructible subset while 2^{80} n^4 is only a density slack."
    - "exp(O(√(log p log log p))) can dominate either reading and is not evaluated here."
  interpretation_limits:
    - "A present 2^{80} prices the quoted constant. It does not falsify Theorem 5.3."
    - "A cancelled factor does not prove the unconditional algorithm."
    - "Toy smoothness samples do not decide this constant."
  heuristic_assumptions:
    - {id: H1, statement: "The strings 2^{80} n^4 and O(n^4) in KN-LIT-6fb205 are the PDF’s expressions for one runtime quantity.", rigorous_support: "None. The note says the proof is unchecked.", validation_plan: "Open the cited pages. Accept the strings only if both readers mark the same tokens."}
  target_complexity:
    time_exponent: "No new exponent. The audited claim is p^{1/3} exp(O(√(log p log log p))) if the preprint’s theorem holds."
    memory_exponent: "Same order as time, as quoted. Not re-derived."
    best_known: "Conditional p^{1/3+o(1)} (Theorem 1.1). Unconditional skeleton p^{2/5+o(1)} (KN-LIT-678a43). Polynomial-memory p^{1/2}·(log p)^{O(1)}."
    hidden_overhead: "The exp(O(√(log p log log p))) factor and the constants 2^{80} and 2^{50} stay inside the quote."
    tradeoff_note: "No time–memory tradeoff. The preprint puts concrete cost out of scope."
  estimated_cost: {implementation: low, compute: low}
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked: [KR-RHO-755e35, KR-RHO-13bf67, KR-RHO-5b1c0a, KR-IC-5ea2f8, KR-RHO-6239aa, KR-IC-791cb7, KR-RHO-ea34b8, KR-IC-46d822]
    nearest:
      - {ref: KN-LIT-6fb205, provenance: internal, relation: adjacent, delta: "Quotes 2^{80} n^4 and O(n^4) and says concrete transfer is meaningless. This output is whether 2^{80} sits in Theorem 5.3 at n = 256. IDEA-20260805-332316 is the Isyanov audit; IDEA-20260926-4a496f is the Deuring sampler."}
      - {ref: KR-RHO-13bf67, provenance: internal, relation: orthogonal, delta: "Generic-group Ω(√p) counts black-box group operations. OneEnd uses the supersingular isogeny graph."}
      - {ref: KR-IC-5ea2f8, provenance: internal, relation: orthogonal, delta: "GHS descends ECDLP on E(F_{q^n}) to a Jacobian. D_p is a family of conjugate-isogeny degrees."}
      - {ref: KR-IC-46d822, provenance: internal, relation: orthogonal, delta: "Gaudry decomposition index calculus is Õ(q^{2-2/n}) on E(F_{q^n}) for fixed n; this idea only asks whether 2^{80} n^4 multiplies Delgado’s OneEnd trial count."}
