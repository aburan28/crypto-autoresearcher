idea:
  id: IDEA-20260807-98a970
  question_id: RQ-PAIR-21313f
  added: '2026-08-07'
  title: >-
    SCOPE RECORD B - A CERTIFIED EMBEDDING-DEGREE AUDIT OF EVERY STANDARDISED
    AND WIDELY DEPLOYED PRIME-FIELD CURVE, producing for each curve a short
    independently re-verifiable certificate of either the exact k (via the
    factorisation of N-1 and one exponentiation per prime factor) or a lower
    bound k > K (via K modular multiplications), together with the three
    degenerate-case checks p = 1 mod N, N = p, and N^2 | #E, and delivering the
    resulting affected-versus-safe split as a table rather than as an assertion
  class: measurement

  claim: >-
    (A) WHAT THE PROGRAM CURRENTLY HAS AND WHY IT IS NOT ENOUGH. KN-TECH-032
    records the correct policy - for the program's target class the embedding
    degree is "of size comparable to p", so the pairing route is closed. That
    statement is quoted from KN-LIT-086 (Balasubramanian-Koblitz) as a
    PROBABILITY over random curves. It is not a statement about P-256, and no
    record in this repository contains the embedding degree, or any bound on
    it, for a single named deployed curve. A campaign lane whose obstruction is
    "k is large for the curves we care about" owes the table.

    (B) THE DELIVERABLE. One row per curve for at least - NIST P-192, P-224,
    P-256, P-384, P-521; secp256k1; Curve25519 and Ed25519; Curve448;
    brainpoolP256r1 / P384r1 / P512r1 and their twisted variants; SM2; the
    Russian GOST R 34.10 curves; NUMS and the MSR curves; FRP256v1. Each row
    carries -
      k, exactly, when N-1 can be factored, with the certificate below;
      otherwise a certified lower bound k > K with K stated;
      the three degenerate flags - is p = 1 mod N (k = 1, the ONLY case in
        which a one-point self-pairing exists, per IDEA-20260807-30868b); is
        N = p (anomalous, KN-TECH-033); is N^2 | #E (full rational N-torsion,
        the sole exception to the distortion-map closure of
        IDEA-20260807-464ff8);
      the crossover comparison against k*(p, N) from IDEA-20260807-5f24d7,
        which is what converts a value of k into a verdict of affected or safe;
      a verdict - AFFECTED, SAFE, or UNRESOLVED.

    (C) THE CERTIFICATE, WHICH IS WHAT MAKES THIS AN AUDIT RATHER THAN A
    COMPUTATION. Two forms, both short and both re-verifiable by a third party
    in milliseconds, in the sense of docs/claims-and-verification.md -
      EXACT-k CERTIFICATE - the complete factorisation N - 1 = product r_i^{e_i}
      with a primality certificate for each r_i, plus the witness
      p^{(N-1)/r_i} mod N for each i. If every witness differs from 1 then
      k = N - 1 exactly and p is a primitive root mod N. More generally k is
      recovered from the standard order algorithm by dividing out prime powers,
      and the certificate is the resulting chain of witnesses. Verification cost
      is at most omega(N-1) modular exponentiations, i.e. a few dozen.
      LOWER-BOUND CERTIFICATE - when N-1 resists factoring, the statement
      "k > K" is certified by the assertion that p^j is not 1 mod N for all
      j <= K, checkable by K modular multiplications with no shortcut. This is
      the honest fallback - it costs K work to verify as well as to produce,
      and the record must say so rather than pretending the bound is succinct.

    (D) THE EXPECTED ANSWER, PRE-REGISTERED BEFORE THE COMPUTATION. Every
    standardised prime-field curve is expected to have k either equal to N-1 or
    a large divisor of it, i.e. of the same order of magnitude as N, and
    therefore to be SAFE against MOV/Frey-Ruck by an astronomical margin. Not
    one is expected to be flagged on any degenerate case. THIS IS STATED AS THE
    PREDICTION SO THAT CONFIRMING IT IS A CONTROLLED RESULT AND NOT A
    RETROSPECTIVE RATIONALISATION. The reason to run it anyway - the claim is
    currently unverified in this program, it is cheap, and the two ways it could
    surprise are both consequential - a curve with a moderate k, or a curve
    whose N-1 factorisation reveals a structure a designer could have chosen.

    (E) THE HONEST HEADLINE, WHICH THE BRIEF ASKS FOR PLAINLY. Pairing-friendly
    curves are constructed deliberately; standard curves such as P-256 are not,
    and their embedding degree is expected to be of the same size as N.
    AFFECTED SCOPE - curves built by MNT, Barreto-Naehrig, Cocks-Pinch, Freeman,
    KSS or BLS constructions with k typically in {1,...,24}, together with all
    supersingular curves (k <= 6), together with any curve with p = 1 mod N.
    SAFE SCOPE - every standardised prime-field ECDLP curve in (B), pending the
    audit that this record exists to run. That split affects no deployed
    signature or key-exchange parameter set and this record claims no attack on
    any of them.

  resource_label: >-
    R7 (pairings into F_{p^k}), in scoping mode - the record measures where the
    R7 precondition holds and mounts no transfer.
  admissibility: admissible
  admissibility_argument: >-
    Admissible and non-vacuously so - the quantity being measured, ord_N(p), is
    not a group-operation output and is invisible inside the generic group
    model, so it is a genuine R7/representation datum rather than something
    KN-FIND-b7e091 already closes. It nevertheless supports no attack on the
    audited curves, which is the expected finding and is the point of auditing.

  discriminated_from:
    - >-
      KN-TECH-032, which states the genericity policy but names no curve and
      contains no value of k. This record supplies the per-curve data the
      policy is asserted about.
    - >-
      IDEA-20260807-653dda, which catalogues CONSTRUCTIONS. This record audits
      ARTIFACTS. Building the table of what designers can make is a different
      task from checking what standards actually contain, and merging them
      would hide the fact that the second has never been done here.
    - >-
      IDEA-20260807-5f24d7, which computes the CROSSOVER k* at which a transfer
      would beat rho. This record computes k; that record computes the threshold
      k must be compared against. Neither is a verdict without the other, and
      that dependency is declared rather than assumed.
    - >-
      ideas/catalogue-20260805/A4-transfers-lattice.md item A4-5, which proposes
      a frozen field-DLP-inclusive C_MOV oracle and mentions emitting values for
      P-256 and secp256k1. That is a catalogue entry with no ledger record, no
      certificate format, and no degenerate-case checks. This record adds the
      certificate, the three degenerate flags, and the full standardised curve
      list.
    - >-
      NOT the classical transfer and not an attack. It is the measurement that
      tells the campaign where the classical transfer's precondition holds.

  object_first_candidate:
    tracked_object: >-
      THE MULTIPLICATIVE ORDER ord_N(p) OF THE FIELD CHARACTERISTIC IN THE
      SUBGROUP-ORDER RESIDUE RING, carried per standardised curve, together with
      its certificate.
    lossiness: >-
      Extremely lossy - an entire standardised curve, its coefficients, its base
      point, its cofactor and its generation seed collapse to one integer. It is
      not a change of coordinates - nothing about the curve is recoverable from
      k.
    propagation: >-
      Deterministic under the operations that matter here. Under F_p-isogeny it
      is CONSTANT (p and N are class invariants); under base change to F_{p^m}
      it maps to k/gcd(k,m) while the target field F_{p^k} is unchanged; under
      passage to a different prime divisor of #E it changes and must be
      recomputed. What is discarded is discarded compatibly with all three, so
      the retained integer propagates without reference to the curve.
    survival_score: >-
      Survives every isogeny, every model change, every coordinate system.
      Dissolves only when the base field or the subgroup changes - which is
      exactly why it is a class invariant and why IDEA-20260807-b92080 can close
      the walk-to-a-better-curve question with it.

  mechanism: >-
    STEP 1 - ASSEMBLE THE PARAMETERS FROM PRIMARY STANDARDS DOCUMENTS. FIPS
    186-5 / SP 800-186 for the NIST curves, SEC 2 for secp*, RFC 7748 and RFC
    8032 for Curve25519 / Ed25519 / Curve448, RFC 5639 for brainpool, GB/T
    32918 for SM2, RFC 5832 for GOST. Every (p, a, b, N, h) tuple is
    transcribed with its source and re-verified by checking that the stated base
    point lies on the curve and has order N. A parameter typed from memory is
    prohibited; if a document cannot be obtained, the row is recorded as
    UNRESOLVED with the reason.
    STEP 2 - THE DEGENERATE CHECKS, three modular reductions per curve, total
    cost microseconds - p mod N (flag if 1), N versus p (flag if equal),
    #E = h.N and whether N | h (flag if so, since that is when N^2 | #E).
    STEP 3 - THE LOWER-BOUND PASS. For each curve compute p^j mod N for
    j = 1..K with K = 10^6, recording the smallest j with p^j = 1 if any. This
    is 10^6 modular multiplications per curve at 256 bits - well under a second
    - and it certifies k > 10^6 for every curve where no such j appears. That
    alone is decisive against MOV, because k > 10^6 puts F_{p^k} far beyond
    representability (see Step 5).
    STEP 4 - THE EXACT PASS, best effort. Attempt the factorisation of N-1 per
    curve. For 256-bit N this is a small-integer factorisation and is expected
    to succeed with a standard ECM-then-NFS pipeline; for 521-bit N it may not,
    and the row then keeps its lower bound. Emit the exact-k certificate where
    the factorisation succeeds. NOTE HONESTLY - this program's environment is
    pure Python with no Sage, so a 521-bit factorisation is very likely out of
    reach here and the honest output is a mixed table.
    STEP 5 - THE VERDICT COLUMN. Combine k (or its bound) with k*(p, N) from
    IDEA-20260807-5f24d7. Include the representability wall - a single element
    of F_{p^k} occupies k.ceil(log2 p) bits, so even writing down one element
    is infeasible once k exceeds a few million, independently of any
    index-calculus cost. That is the binding obstruction at large k and it is
    what makes the SAFE verdict robust to any future improvement in NFS.
    STEP 6 - PUBLISH THE AFFECTED/SAFE SPLIT of (E) with every cell sourced.

  novelty_status: known
  novelty_screen:
    method: >-
      Run 2026-08-07. grep -i over ledger/, knowledge/, docs/, analysis/,
      ideas/ for "P-256", "secp256k1", "Curve25519", "brainpool", "embedding
      degree", "ord_N", "affected", "safe scope". Reads of KN-TECH-032,
      KN-LIT-086, ideas/catalogue-20260805/A4-transfers-lattice.md.
    results: >-
      No record in this repository contains an embedding degree, or a bound on
      one, for any named standardised curve. The only mention of emitting such
      a value is A4-5 in the 2026-08-05 catalogue, which is explicitly
      catalogue-only with no ledger record and was never run. The genericity
      statement in KN-TECH-032 is a probability claim relayed from KN-LIT-086,
      not a measurement.
    verdict: >-
      KNOWN as mathematics - checking the embedding degree of a standard curve
      is a routine parameter-validation step mandated by every relevant standard
      and by SafeCurves-style criteria, and the expected answer is not in doubt
      in the literature. NOVEL WITHIN THIS PROGRAM as data - the corpus has zero
      rows. Filed as a scoping record per the batch brief, not as an attack.

  null_object_control: >-
    MANDATORY AND BLOCKING - a measurement instrument that has never been shown
    to fire cannot certify a negative. PLANTED POSITIVE - a deliberately
    pairing-friendly curve inserted into the same pipeline with the same code
    path - at minimum a toy BN-shaped curve with k = 12 and a toy curve with
    p = 1 mod N (k = 1), and if a published BN or BLS12 parameter set can be
    transcribed, that too. The pipeline MUST return the small k for these and
    must flag them AFFECTED. If it does not, every SAFE verdict in the table is
    void.
    SECOND POSITIVE - a supersingular toy curve over F_p with t = 0, where
    p^2 = 1 mod N so k = 2 exactly. The pipeline must return 2.
    DECAY PARAMETER - the bound K in the lower-bound pass. As K increases from
    10^2 to 10^6 the set of curves not yet excluded must shrink to the planted
    positives and then stop changing. A standardised curve that appears at some
    K and disappears at a larger K indicates a modular-arithmetic bug.
    ARITHMETIC NULL - a random 256-bit prime N and a random p, for which the
    order should behave as the random-element control of IDEA-20260807-6c7540.

  assumptions:
    - >-
      All curve parameters are transcribed from primary standards documents in
      Step 1 and re-verified on the curve. No parameter is recalled from memory.
      A row whose source cannot be obtained is UNRESOLVED, not omitted.
    - >-
      [environment] Pure Python, no Sage. 10^6 modular multiplications at 256
      bits is trivially feasible; a 521-bit factorisation of N-1 very likely is
      not. The table is expected to be mixed exact-and-bounded and the record
      says so in advance rather than reporting a shortfall as a finding.
    - >-
      The verdict column depends on k*(p, N) from IDEA-20260807-5f24d7. Until
      that record produces a crossover, every verdict is provisional and must be
      labelled so. A verdict of SAFE resting on an unstated threshold would be
      the same partial-cost error KN-TECH-035 forbids.
    - >-
      Scope - prime-field curves only. Binary-field and extension-field curves
      are out of scope and would need the TNFS/exTNFS cost model of
      KN-OPEN-025.

  proof_search_map:
    bottleneck: >-
      Factoring N-1. It is the only step that can fail, it is what separates an
      exact certificate from a bound, and its feasibility is entirely a function
      of the environment rather than of the mathematics.
    baseline_embedding:
      parameter_slice: >-
        The planted BN-shaped curve with k = 12. The pipeline must return
        exactly 12 on it using the identical code path used for P-256.
      reproduction_check: >-
        A frozen fixture - the toy BN triple and its expected k, checked by
        exact integer comparison, run before any standardised curve is
        processed.
    observation_collision:
      observable: >-
        The verdict AFFECTED or SAFE.
      distinct_preimage_search: >-
        REQUIRED - find two curves with the same verdict and wildly different
        (k, p, N), which is trivially satisfiable and establishes that the
        verdict is a coarse quantisation of a threshold comparison. The
        consequence to record - the verdict carries no information beyond
        "k versus k*", so no downstream record may cite a SAFE verdict as
        evidence about anything except the embedding degree.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "is this curve vulnerable to a pairing transfer" by the pair
          of integers (k, k*) and a comparison.
        predicted_gain: >-
          Makes a security question machine-checkable and independently
          re-verifiable in milliseconds, which is what
          docs/claims-and-verification.md asks of every claim.
      - transform: boundary_lift
        proposed_object: >-
          The representability wall k.ceil(log2 p) bits per field element,
          used as a verdict-independent floor.
        predicted_gain: >-
          A SAFE verdict that does not depend on any NFS constant and cannot be
          overturned by a future index-calculus improvement, only by a change in
          k itself - which is impossible for a fixed curve.
    quantifier_order: >-
      Claimed per row - FOR THIS curve, EXISTS a certificate showing that
      FOR ALL j <= K, p^j is not 1 mod N. NOT claimed - FOR ALL standardised
      curves, which would require the list to be complete, and it is not; the
      list is enumerated and its incompleteness is stated.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For each audited curve, the embedding degree exceeds K (or equals the
        stated value), certified by the attached witnesses." It certifies
        nothing about curves not in the list, nothing about non-pairing
        attacks, and nothing about the hardness of the ECDLP on any curve.
      nearby_object_control: >-
        A curve one parameter away from a standard curve - same p, a trace
        chosen so that p = 1 mod N. It must be flagged AFFECTED. A pipeline
        that returns SAFE for a curve with k = 1 has no resolving power, and
        producing such a curve at the same p as a standard one is the sharpest
        available demonstration that the audit measures the trace and not the
        prime.
    proof_obligations:
      - claim: Each transcribed parameter set is internally consistent (base point on curve, of order N).
        responsibility: correctness
      - claim: The exact-k certificate verifies with omega(N-1) exponentiations.
        responsibility: interface
      - claim: The lower-bound certificate genuinely requires K multiplications and is not succinct.
        responsibility: scope
      - claim: The planted small-k positives are returned correctly.
        responsibility: baseline
      - claim: The representability wall is stated in bits and is independent of NFS constants.
        responsibility: size

  predictions:
    - metric: >-
        number of standardised prime-field curves in the list with certified
        k <= 10^6
      direction: lower
      minimum_effect: >-
        Predicted ZERO. One or more would be a material finding and would
        trigger an immediate independent review before any publication of the
        table, per AGENTS.md rule 12.
    - metric: >-
        number of standardised curves flagged on any degenerate check
        (p = 1 mod N, N = p, N^2 | #E)
      direction: lower
      minimum_effect: >-
        Predicted ZERO on all three. A flag on any is a material finding.
    - metric: >-
        number of planted small-k positives correctly returned by the pipeline
      direction: higher
      minimum_effect: >-
        100 percent. Anything less voids the table.
    - metric: >-
        fraction of rows carrying an EXACT-k certificate rather than a bound
      direction: different
      minimum_effect: >-
        Reported as a count with the reason per missing row. No target is set;
        this is an environment measurement, and a low fraction is an honest
        outcome rather than a failure.

  minimal_test:
    design: >-
      STAGE 1 (hours, no compute): transcribe and self-verify every parameter
      set from primary documents. STAGE 2 (HARD GATE, minutes): the planted
      positives - toy BN k = 12, toy k = 1, toy supersingular k = 2. STAGE 3
      (minutes): the three degenerate checks and the K = 10^6 lower-bound pass
      over the whole list. STAGE 4 (best effort, hours to days): factor N-1 per
      curve and emit exact certificates where possible. STAGE 5 (zero compute):
      the verdict column, pending k* from IDEA-20260807-5f24d7, and the
      affected/safe split.
      THE CHEAPEST DECISIVE SUBSET IS STAGES 2 AND 3 - under one minute of
      compute for the entire standardised curve list, and it already settles the
      lane's scope question.
    controls:
      - toy BN-shaped curve k = 12 - must be returned as 12
      - toy curve with p = 1 mod N - must be flagged k = 1 and AFFECTED
      - toy supersingular curve with t = 0 - must be returned as k = 2
      - a curve at the same p as a standard curve but with p = 1 mod N - must be flagged
      - random (p, N) arithmetic null for the order distribution
    required_metrics:
      - per curve, k or the certified bound, with the certificate itself
      - per curve, the three degenerate flags
      - per curve, the source document and transcription verification status
      - per curve, k.ceil(log2 p), the representability wall in bits
      - the count of AFFECTED, SAFE and UNRESOLVED rows
      - pass or fail of every planted positive

  falsification_conditions:
    - >-
      Any standardised prime-field curve returning k <= 10^6, or flagging any
      degenerate check. That would be a material cryptographic finding, would
      require independent review-breakthrough scrutiny before any statement is
      made outside this repository, and the record pre-commits to that route
      rather than to publication.
    - >-
      Any planted positive not returned correctly. Instrument failure under
      AGENTS.md rule 5; the table is void and nothing is reported.
    - >-
      A transcribed parameter set failing its own self-check (base point not on
      the curve, or not of the stated order). Transcription error; the row is
      UNRESOLVED and must not be silently corrected from memory.
    - >-
      Inability to obtain a primary standards document. The row is UNRESOLVED
      with the reason recorded; an omitted row would misstate the audit's
      coverage.

  confounders:
    - >-
      Which N. Several standard curves have small cofactors and one prime
      subgroup, but Curve25519 has cofactor 8 and Curve448 cofactor 4; the
      audit must use the PRIME subgroup order, not the group order, and must
      state which it used per row.
    - >-
      Twist security is a different property. A curve can be twist-secure and
      still have any embedding degree, and vice versa. The table must not be
      read as a twist audit.
    - >-
      Cofactor-order primes. A curve's cofactor may itself contain primes with
      small embedding degree. That is irrelevant to ECDLP in the prime subgroup
      and would be a spurious flag; the audit must not report it as one.
    - >-
      The verdict depends on an external threshold k*. Publishing a verdict
      before k* exists would be a partial-cost error of exactly the kind
      KN-TECH-035 and DEC-20260803-004's recorded C_special_MOV defect warn
      about.

  interpretation_limits:
    - >-
      A parameter audit. It mounts no attack, moves no exponent and cannot make
      any curve safer than it is.
    - >-
      A SAFE verdict is scoped to the pairing transfer only. It says nothing
      about rho, index calculus, implementation attacks, or anything else.
    - >-
      The curve list is enumerated, not exhaustive. Absence of a curve from the
      table is not a statement about that curve.
    - >-
      A certified bound k > 10^6 is a bound, not a value. Reporting it as "k is
      about N" would overstate what the certificate shows.

  reachability_gate: >-
    NOT APPLICABLE AS A MOVE, AND THE REASON IS THE SCOPE STATEMENT ITSELF. No
    F_p-isogeny changes k, because p and N are class invariants
    (IDEA-20260807-b92080). So an attacker holding a standardised curve cannot
    reach a small-k curve at any cost - not cheaply, not expensively, not at
    all. A DESIGNER, by contrast, reaches small k for free by choosing a
    construction. The audit's entire value is that it distinguishes these two
    and shows that no deployed parameter set sits on the designer's side of the
    line.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT CLAIMED. The audit itself costs K = 10^6 modular
      multiplications per curve for the bound, plus one factorisation of N-1 per
      curve for the exact value. Verification of the emitted certificate is
      omega(N-1) modular exponentiations, i.e. constant for practical purposes.
    memory_exponent: >-
      O(log p) for the audit; O(1) certificates. The relevant memory statement
      in the record is about the TARGET, not the audit - one element of
      F_{p^k} needs k.ceil(log2 p) bits, which is the representability wall in
      Step 5 and is the honest large-k obstruction.
    best_known: >-
      Rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006); BSGS
      (KN-TECH-031); MOV/Frey-Ruck at small k (KN-TECH-032); the genericity
      probability of KN-LIT-086.
    hidden_overhead: >-
      The lower-bound certificate is NOT succinct - verifying k > K genuinely
      costs K multiplications. Presenting it as a short proof would be
      dishonest and the record states the true verification cost per row.
    tradeoff_note: >-
      One real tradeoff inside the audit - exact k requires factoring N-1
      (expensive, succinct certificate) versus a bound requiring K
      multiplications (cheap to produce, expensive to verify). The table reports
      which route each row took.

  dominated_by: >-
    Checked across every frontier row on time, memory and data. As an attack
    this record mounts none and is dominated by rho at 0.886 sqrt(N) and O(1)
    memory (KN-TECH-001, KN-TECH-006), by automorphism-discounted rho on CM
    curves (KN-TECH-018), by BSGS at sqrt(N)/sqrt(N) (KN-TECH-031) and its
    n^{2/3+o(1)} full cost (KN-TECH-035), and by MOV/Frey-Ruck on the small-k
    family it is designed to detect and does not find (KN-TECH-032). The
    anomalous transfer (KN-TECH-033) is one of the three degenerate checks and
    is expected to fire on nothing.
    As an AUDIT INSTRUMENT the incumbent is the parameter-validation procedure
    already mandated in the standards themselves (embedding-degree checks
    appear in ANSI X9.62-style and SEC-style validation), which dominates this
    record on authority and on having been run for decades. This record
    dominates it on nothing except that its output would be inside this
    program's ledger with a re-verifiable certificate.
  sota_delta: >-
    Zero speedup against any attack baseline, on every axis. Quantitative
    delta as data - the corpus currently holds ZERO embedding-degree values or
    bounds for named deployed curves; this produces on the order of 15 rows,
    each with a certificate verifiable in under omega(N-1) modular
    exponentiations, plus three degenerate flags per row. Delta as scope - it
    converts the standing claim "the target class has large k" from a relayed
    probability statement (KN-LIT-086) into per-curve certified bounds.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.99 that every standardised curve comes back SAFE with k > 10^6 and no
    degenerate flag - this is what the standards' own validation procedures
    already guarantee, and a surprise would mean a standards body erred. 0.95
    that Stages 2 and 3 complete within a minute of compute. 0.35 that more
    than half the rows carry an EXACT-k certificate, because factoring a
    256-bit N-1 in pure Python without Sage is the binding constraint and the
    521-bit rows are very likely out of reach. The record's value is therefore
    almost entirely in the near-certain confirmation being CERTIFIED and
    RETRIEVABLE rather than asserted - which is why priority is medium and not
    high.

  id_allocation_provenance: >-
    Coordinator pre-allocated in BATCH-cb71b5 via
    python3 tools/allocate_id.py --next idea --date 20260807; block recorded in
    coordination/goals/GOAL-ENDO-001/batches/BATCH-cb71b5/id_allocation.json;
    all 126 verified free with --check.

