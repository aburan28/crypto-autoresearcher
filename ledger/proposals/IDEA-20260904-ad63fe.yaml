idea:
  id: IDEA-20260904-ad63fe
  id_allocation_provenance: >-
    Minted by the Coordinator via `python3 tools/allocate_id.py --next idea
    --date 20260904`, checked free via `--check` before use (0 occurrences
    across 147905 identifier-bearing paths). No identifier was minted by the
    drafting subagent, per its own note (it has no Bash/shell tool).
  question_id: RQ-MONO-001
  added: '2026-09-04'
  status: proposed
  proposed_by: idea-generator
  class: measurement

  title: >-
    THE m=4 SEMAEV COVER OVER THE SYMMETRIC BASE HAS MONODROMY AGL(2,2) = FULL
    S_4, NOT THE (Z/2)^2 THE ORDERED BASE FORCES -- AND THAT IS WHY THE
    ORDERED-BASE INSTRUMENT COULD NEVER EMIT A 4-CYCLE. A five-class Frobenius
    census on the base (e1,e2,e3) of elementary symmetric functions, with a
    four-arm V_4 / D_4 / A_4 / S_4 calibration ladder realized by four sampling
    measures on ONE code path, and an EXACT integer (not statistical)
    matched-(t,Z) cross-curve comparison as the exceptional-locus test.

  claim: >-
    SCOPE FIRST. m = 4 only. Prime fields F_p, p > 3, toy range p in [101, 2000].
    E : y^2 = f(x) = x^3 + Ax + B non-singular. The tested object is the
    SYMMETRIC base B_sym = Spec k[e1,e2,e3] with e1,e2,e3 the elementary
    symmetric functions of (x1,x2,x3); the ORDERED base k(x1,x2,x3) appears only
    as a calibration arm. No ECDLP, relation-rate, cost or exponent claim is
    made anywhere in this record.

    THE CLAIM, IN FOUR PARTS.

    (C1) DESCENT. S_4(x1,x2,x3,T) is symmetric in x1,x2,x3, so each of its five
    T-coefficients is a polynomial in (e1,e2,e3); write the resulting quartic as
    Q_e(T) := S_4^sym(e1,e2,e3,T), deg_T = 4. B_sym is a legitimate base and the
    ordered base is a degree-6 cover of it with group S_3.

    (C2) THE GROUP IS THE FULL SYMMETRIC GROUP ON THE FOUR ROOTS. Index the four
    roots of Q_e by V := F_2^3 / <(1,1,1)>, via R_u = x(eps_1 P_1 + eps_2 P_2 +
    eps_3 P_3) with u_i = 0 iff eps_i = +1 (H-MONO-45183a A-1, used not
    reproved). The sign torsor acts on V by translation; the S_3 of the base
    descent acts on V by permuting coordinates, and that map S_3 -> Aut(V) =
    GL_2(F_2) is INJECTIVE (a coordinate permutation fixing every class would
    have to send a weight-1 vector to a weight-2 vector). A subgroup of Sym(V)
    that contains all translations and surjects onto GL_2(F_2) is all of
    V semidirect GL_2(F_2) = AGL(2,2), which is exactly S_4 on four points and
    is PRIMITIVE (2-transitive). So over B_sym the monodromy is the FULL
    symmetric group at m = 4, while over the ordered base it is (Z/2)^2 = V_4
    (H-MONO-45183a Part A, `supported_scoped`). Both halves of KN-OPEN-009's
    "full symmetric (resp. wreath)" disjunction are therefore TRUE, of DIFFERENT
    BASES, and the question as posed conflated them.

    (C3) THE PER-SPECIALIZATION FROBENIUS RECIPE, FORCED AND FALSIFIABLE. Let
    g(X) = X^3 - e1 X^2 + e2 X - e3 with roots t_1,t_2,t_3 in F_p-bar, and let
    Frobenius act on the roots by the permutation pi. Writing phi(P_i) = s_i
    P_{pi(i)} with s_i in {+-1} and sigma_i = [s_i = -1] in F_2, Frobenius acts
    on V by the AFFINE map v |-> pi(v) + pi(sigma). Hence, on any admissible
    base point (g separable, Res(g,f) != 0, Q_e squarefree):
      (a) g SPLITS over F_p  =>  linear part trivial  =>  type 1^4 if
          chi_p(f(t_1)) = chi_p(f(t_2)) = chi_p(f(t_3)), else type 2+2;
      (b) g = (linear)(irreducible quadratic q)  =>  linear part a transposition
          =>  type 2+1+1 if chi_p(Res(q,f)) = +1, and type 4 (a four-cycle) if
          chi_p(Res(q,f)) = -1. INDEPENDENT of chi_p(f(t_1));
      (c) g IRREDUCIBLE  =>  linear part of order 3, which has a unique fixed
          point on V  =>  type 3+1 ALWAYS, whatever the signs.
    This is a per-instance prediction: ONE mismatch on an admissible point
    falsifies it.

    (C4) THE EXACT INTEGER CLASS-COUNT LAW, AND THE EXCEPTIONAL-LOCUS TEST.
    With Z = #{x in F_p : f(x) = 0}, t the trace, S = (p-t-Z)/2,
    Z_2 = #{x in F_{p^2} : f(x) = 0} (= 0 if Z = 0, else 3),
    Z_3 = #{x in F_{p^3} : f(x) = 0} (= 1 if Z = 1, else 3),
    S_2 = (p^2 - (t^2 - 2p) - Z_2)/2 and N_2 = (p^2 + (t^2 - 2p) - Z_2)/2, the
    counts of admissible base points in each of the five classes are EXACTLY
      #1^4     = C(S,3) + C(p-Z-S,3)
      #2+2     = C(p-Z,3) - C(S,3) - C(p-Z-S,3)
      #2+1+1   = (p-Z) (S_2 - (p-Z)) / 2
      #4       = (p-Z) (N_2) / 2
      #3+1     = ((p^3 - Z_3) - (p - Z)) / 3
    -- polynomial functions of (p, t, Z) AND OF NOTHING ELSE. Consequently TWO
    NON-ISOMORPHIC CURVES OVER THE SAME p WITH THE SAME (t, Z) HAVE BITWISE
    IDENTICAL FIVE-CLASS COUNTS, integer for integer, with no tolerance and no
    statistics. That is the exceptional-family test KN-OPEN-009 asks for, run on
    an observable that (unlike every prior instrument in this lane) actually
    takes five values; j, the endomorphism ring, CM, and the automorphism group
    can enter ONLY through (t, Z).

    THE TWO OUTCOMES, DEFINED BEFORE THE RUN. (I) The ladder calibrates, the
    recipe holds per-instance at rate 1.000, and matched-(t,Z) curve pairs agree
    integer-for-integer: KN-OPEN-009's exceptional-locus branch is closed for
    THIS observable at m = 4 over B_sym at toy scale, the "full symmetric"
    branch is confirmed with its base made explicit, and the lane gains its
    first instrument with demonstrated five-class discriminating power.
    (II) A matched-(t,Z) pair disagrees, or an admissible point contradicts the
    recipe, or a curve's ladder arm lands on a proper subgroup while the
    calibration arms pass: the derivation in (C2)/(C3) is incomplete and there
    is a curve-specific structure in the m = 4 cover that (t,Z) does not
    capture -- the strongest result this lane could produce, and the reason the
    test is worth running even though (I) is the expected outcome.

  mechanism: >-
    WHY THE PRIOR TWO INSTRUMENTS WERE ONE-SIDED, AND WHY THIS ONE IS NOT --
    THIS IS THE LOAD-BEARING PARAGRAPH.
    EV-MONO-a0a89c OBS-5 killed the factor-base-locus census by derivation: if
    x_1..x_{m-1} are x-coordinates of F_p-rational points then every root of S_m
    is rational, so the cycle type is CONSTANT there and cannot distinguish
    curves. EV-MONO-efbd1c then recorded, from independent review of
    EXP-MONO-12ce1c, a SECOND and less obvious degeneracy of the same kind on
    the ORDERED GENERIC locus: when x_1,x_2,x_3 are drawn from F_p, each y_i
    lies in F_p or in F_{p^2}, and F_p has a UNIQUE quadratic extension, so
    every root of the quartic has degree 1 or 2 over F_p and the types 4, 3+1
    and 2+1+1 are IMPOSSIBLE BY CONSTRUCTION rather than merely improbable. The
    ordered-base census is therefore degree-capped: it is a two-valued
    instrument dressed as a five-valued one.
    THE SYMMETRIC BASE LIFTS EXACTLY THAT CAP. A uniform (e1,e2,e3) is a uniform
    monic cubic g; g splits over F_p with density only about 1/6, so with
    density about 1/2 two of the x_i live in F_{p^2} and with density about 1/3
    all three live in F_{p^3}. The signed sums then live in extensions of degree
    up to 6, roots of degree 3 and 4 over F_p become possible, and the
    degree cap is gone -- not by adding a heuristic but by changing which
    measure the base is sampled with. The four-cycle and 3+1 classes are
    predicted at densities 1/4 and 1/3, so the instrument's own calibration is
    checkable at every sample.
    THE DESCENT ITSELF is elementary and already observed in-repo: S_m is
    symmetric in all its variables, so S_4's T-coefficients are symmetric in
    (x1,x2,x3) and hence polynomials in (e1,e2,e3) (the same descent
    IDEA-20260903-f7e8a6 uses one arity down, and the same descent
    IDEA-20260830-1a08f9 / H-MONO-0b3def performed at m = 3, where it produced
    Z/2 wr S_2 = D_4 and, critically, the 4-cycles that the ordered base
    provably cannot realize).
    THE GROUP AT m = 4. Over the ordered base the monodromy is the translation
    group V = (Z/2)^2 acting regularly (H-MONO-45183a A-2, `supported_scoped`).
    Passing to B_sym adjoins the S_3 of the descent, which acts on V by
    permuting coordinates. That action is faithful, so it realizes the full
    Aut(V) = GL_2(F_2) = S_3. Translations plus full Aut(V) generate AGL(2,2),
    order 24, which is the full symmetric group on the four points of the affine
    plane AG(2,2) and is primitive. The m = 3 case degenerates because V there
    has order 2 and Aut(V) is trivial -- which is exactly why
    IDEA-20260830-1a08f9 got D_4 (order 8) rather than a symmetric group: at
    m = 3 the wreath group Z/2 wr S_2 acts on FOUR POINTS OF THE CURVE, a
    different object. m = 4 is the first arity at which V is large enough to
    have a nontrivial automorphism group, which is the same reason
    DEC-20260802-a51c82 D-3 gives for m = 3 being degenerate for imprimitivity.
    THE SUBGROUP LADDER, AND WHY IT IS THE DESIGN'S POINT. The transitive
    subgroups of S_4 containing V are exactly V (order 4, imprimitive),
    D_4 (order 8, imprimitive), A_4 (order 12, primitive) and S_4 (order 24,
    primitive), corresponding to the four subgroups of Aut(V) = S_3: trivial,
    <transposition>, C_3, S_3. Each is realized by a DIFFERENT SAMPLING MEASURE
    ON THE SAME BASE AND THE SAME CODE:
      ARM-V4 : draw x1,x2,x3 uniform in F_p (the ordered base). Predicted
               classes 1^4 and 2+2 only, at (1/4, 3/4) + O(1/p).
      ARM-D4 : draw a uniform monic QUADRATIC in (x1,x2) and x3 uniform in F_p.
               Predicted 1^4 1/8, 2+2 3/8, 2+1+1 1/4, 4-cycle 1/4, 3+1 EXACTLY 0.
      ARM-A4 : draw (e1,e2,e3) uniform CONDITIONED on disc(g) a nonzero square
               in F_p. Predicted 1^4 1/12, 2+2 1/4, 3+1 2/3, and 2+1+1 and
               4-cycle EXACTLY 0.
      ARM-S4 : draw (e1,e2,e3) uniform. Predicted 1/24, 1/8, 1/4, 1/4, 1/3.
    Four different groups, four disjoint predicted supports, one factorizer.
    THIS IS THE SATISFIABLE POSITIVE CONTROL THE LANE HAS NEVER HAD:
    EXP-MONO-12ce1c's mandatory cross-curve null was proved unsatisfiable for
    ANY companion object (EV-MONO-efbd1c), which voided its Stage 2 under the
    contract's own text. ARM-D4 and ARM-A4 are satisfiable by construction and
    they exhibit, respectively, an IMPRIMITIVE proper subgroup and a PRIMITIVE
    proper subgroup -- so an instrument that cannot see them is demonstrated
    blind before any curve panel is read, and an exceptional curve whose group
    drops is not merely detected but NAMED.
    THE LOSSY-PROJECTION TEST, RUN BEFORE ANY COMPUTE. Tracked object: the
    conjugacy class in AGL(2,2) = S_4 of the Frobenius affine action on the four
    sign classes, at a point of B_sym. It is genuinely lossy: p^3 base points
    collapse to five values, discarding the roots themselves, their ordering,
    the curve's j-invariant and its endomorphism ring. What it discards is
    discarded COMPATIBLY: by (C3) the retained data (the F_p-factorization type
    of g, chi_p(f(t_i)) at rational roots, chi_p(Res(q,f)) at a quadratic
    factor) determines the class deterministically, so the projection commutes
    with the cover's own operation. It is NOT a change of coordinates relative
    to the already-measured ordered-base object: that object retains only the
    TRANSLATION part of the affine map, and the linear part pi -- the entire
    S_3 -- is exactly what the ordered base destroys by fiat when it insists
    x_i in F_p. The new projection is strictly finer, and the extra retained bit
    is precisely the one whose absence made the old instrument degree-capped.

  novelty_status: unverified
  novelty_status_note: >-
    THE GROUP THEORY IS TEXTBOOK and is claimed as such: AGL(2,2) = S_4, the
    transitive subgroup lattice of S_4, and Chebotarev cycle-type densities are
    classical, and the Frobenius-as-affine-map computation is elementary.
    THE OBJECT is an in-program extension: IDEA-20260830-1a08f9 / H-MONO-0b3def
    (status `supported`) performed exactly this symmetric-base descent at m = 3
    and obtained Z/2 wr S_2 = D_4 with an empty exceptional locus, and
    IDEA-20260830-9761f0 C5 names its own redirection verbatim as "m >= 4, where
    the wreath group grows to Z/2 wr S_{m-1} and the counting done here does not
    apply". This record is that named successor at the first arity where the
    sign group has a nontrivial automorphism group.
    INTERNAL DUPLICATE CHECK PERFORMED: read KN-OPEN-009, DEC-20260802-a51c82,
    DEC-20260810-2f86db, CORR-20260802-1d8384, DEC-20260904-8c2580,
    H-MONO-45183a, EV-MONO-efbd1c, H-MONO-0b3def (statement + mechanism),
    H-MONO-59f6a6 (head), IDEA-20260830-9761f0 (head), IDEA-20260831-d29a71
    (full), and experiments/EXP-MONO-64aaa4/implementation/run_experiment.py;
