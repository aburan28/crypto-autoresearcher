  assumptions:
    - >-
      m = 4, prime fields, char > 3, non-singular short Weierstrass curves.
      Nothing here transfers to F_{q^n}, to characteristic 2 or 3, or to any
      cost statement.
    - >-
      S_4 is available as an explicit polynomial. The program already builds it
      by the resultant recursion S_4 = Res_X(S_3(x1,x2,X), S_3(x3,T,X)) --
      EV-MONO-a0a89c's red team did exactly this over F_211 -- so no new
      construction is assumed, only re-use.
    - >-
      The classification arm needs only F_p, F_{p^2} and F_{p^3} arithmetic and
      squarefree/distinct-degree factorization of a QUARTIC. No CAS. This is
      deliberate: H-MONO-45183a's test_boundary records that `import sympy` and
      `from sage.all import GF` both raise ModuleNotFoundError in this
      container, so a design whose cheapest gate needs a CAS would be an
      infrastructure request rather than an experiment.
    - >-
      The class-count law (C4) is stated for ADMISSIBLE base points only:
      g separable, Res(g,f) != 0, and Q_e squarefree. The three excluded strata
      are counted and reported separately and are NEVER pooled with the five
      classes.

  proof_search_map:
    bottleneck: >-
      One step decides the record: whether the monodromy of Q_e over
      k(e1,e2,e3) is the FULL AGL(2,2) = S_4, i.e. whether the S_3 of the
      base descent is actually realized in the group acting on the four roots.
      Containment in S_4 is vacuous on four points, so the derivational content
      is not the containment but the per-specialization recipe (C3), which is
      forced by the Frobenius computation and is what a run can contradict.
      Everything else is a consequence or a control.
    baseline_embedding:
      parameter_slice: >-
        TWO exact slices, both already committed in this repo.
        (i) ARM-V4 is the ordered base, where the answer is
        H-MONO-45183a Part A / EV-MONO-efbd1c: only 1^4 and 2+2 occur, and the
        split frequency is (S^{m-1} + N_ns^{m-1})/p^{m-1}. This record's
        classifier must reproduce that on the same data, from the same code.
        (ii) The m = 3 symmetric base, where the answer is H-MONO-0b3def /
        EV-MONO-7c216b: D_4 with forced class densities 1/8, 1/4, 1/8, 1/4, 1/4.
        Running this record's sampler at m = 3 must reproduce those.
      reproduction_check: >-
        Symbolic and free: setting Aut(V) trivial in (C2) returns V_4, which is
        H-MONO-45183a Part A at m = 4; restricting the sampling measure to the
        ordered base in (C3) makes pi = id always, which returns exactly the
        two-type law EV-MONO-efbd1c reports. A discrepancy in either direction
        halts the record at zero compute.
    observation_collision:
      observable: >-
        The five-valued Frobenius class of Q_e at a point of B_sym.
      distinct_preimage_search: >-
        SEARCHED, AND THE COLLISION IS DECLARED AND IS THE RECORD'S OWN
        PREDICTION. By (C4) the class counts are functions of (p, t, Z) alone,
        so ANY two curves sharing (p, t, Z) -- including a CM curve and an
        ordinary one, and including j = 0 or 1728 against a generic j -- have
        identical observable distributions. That is a massive collision and it
        is exactly what claim (C4) asserts and what the matched-pair arm tests
        as an EXACT INTEGER identity rather than a statistical agreement. The
        collision is a prediction, not a defect; a failure of the collision is
        outcome (II) and is the more interesting result.
      residual_collision_risk: >-
        The per-instance recipe (C3) is a function of the factorization type of
        g and two Legendre symbols, so it cannot distinguish anything finer
        than (t, Z) even in principle. If curve structure beyond (t, Z) enters
        the m = 4 cover at all, this observable will not see it and the record
        must not be read as evidence that it does not exist -- only that this
        observable does not carry it.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Track the AFFINE PAIR (pi, w) in V semidirect S_3 rather than only the
          conjugacy class it induces, i.e. the labelled Frobenius element rather
          than its cycle type. Twenty-four labelled values instead of five
          classes.
        predicted_gain: >-
          Turns the equality question (is the whole group realized?) into a
          direct count of realized labelled elements -- the analogue of
          H-MONO-45183a's G8 and of H-MONO-0b3def's "exactly 8 distinct
          permutations" -- rather than an inference from densities, and gives a
          measured LOWER BOUND on |Gal| instead of an assumed equality.
      - transform: representation_reduction
        proposed_object: >-
          Change the base measure rather than the object: the four arms V_4,
          D_4, A_4, S_4 are one cover read under four sampling measures on the
          same code path.
        predicted_gain: >-
          A satisfiable graded control at every group in the lattice, replacing
          the unsatisfiable cross-curve null that voided EXP-MONO-12ce1c's
          Stage 2. Instrument blindness becomes detectable before any curve
          panel is read.
      - transform: observable_fiber
        proposed_object: >-
          Hold the five-class count vector fixed and vary the forgotten
          structure: j-invariant, endomorphism ring, automorphism group, at
          matched (p, t, Z).
        predicted_gain: >-
          If any curve-intrinsic invariant separates two curves at matched
          (p,t,Z), claim (C4) is false and KN-OPEN-009's exceptional locus
          exists at m = 4 on an observable that actually takes five values.
          This transform IS the falsifier, in constructive form.
    quantifier_order: >-
      CLAIMED IN THIS ORDER, AND THE ORDER IS LOAD-BEARING:
        FOR ALL p > 3, FOR ALL non-singular E/F_p, FOR ALL admissible
        (e1,e2,e3) in F_p^3, THERE EXISTS a pair (pi, sigma) computable from the
        factorization of g and two Legendre symbols SUCH THAT the Frobenius
        class of Q_e is the class of v |-> pi(v) + pi(sigma).
      The witness is UNIFORM in the curve and the point: it is written down from
      f and g with no dependence on E beyond f itself.
      THE EQUALITY (that the whole of AGL(2,2) is realized on a given curve) is
      claimed only in the weaker order FOR ALL E, the realized labelled-element
      count is 24 -- and it is MEASURED, never assumed. The trivially true
      order "for all E there exists a group containing the monodromy" is not
      claimed and is not admissible as a result.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that at m = 4, over prime fields in [101, 2000], on the tested
        curve panel, the symmetric-base Semaev cover's arithmetic monodromy is
        the full S_4, its Frobenius class is forced per-instance by (C3), and
        its five class counts are the exact (p, t, Z) polynomials of (C4).
        IT CANNOT certify anything about geometric-versus-arithmetic monodromy
        beyond what a fixed-p census can (that gap is H-MONO-59f6a6's object and
        that record's N1 ladder is the right instrument for it); it CANNOT
        certify any relation-rate statement; it CANNOT bound any solver cost;
        it CANNOT move any exponent; it CANNOT close KN-OPEN-009, whose
        relation-rate half is untouched here.
      nearby_object_control: >-
        THE OBJECT ON WHICH THE CONCLUSION IS KNOWN FALSE, three of them, all
        satisfiable, unlike EXP-MONO-12ce1c's null:
        (i) ARM-V4, where 4-cycles and 3+1 are KNOWN IMPOSSIBLE
        (EV-MONO-efbd1c). A classifier that emits them there has a bug.
        (ii) ARM-A4, where 4-cycles and 2+1+1 are KNOWN IMPOSSIBLE by the
        square-discriminant conditioning. A classifier that emits them there has
        a bug, and one that does NOT emit 3+1 at density 2/3 is blind.
        (iii) A uniformly random monic quartic over the same F_p, whose Galois
        group is generically S_4 and whose densities are 1/24, 1/4, 1/8, 1/3,
        1/4. It must reproduce those AND emit strictly positive 4 and 3+1
        counts. This lane already owns the degree-5 version (EV-MONO-a0a89c
        OBS-7) and the degree-4 version was already mandated by
        H-MONO-45183a G5.
    proof_obligations:
      - claim: >-
          S_4's T-coefficients are symmetric in (x1,x2,x3), so Q_e is
          well-defined over k[e1,e2,e3] with deg_T = 4.
        responsibility: correctness
      - claim: >-
          The four roots of Q_e are indexed by V = F_2^3/<(1,1,1)> via signed
          sums, and are distinct off a codimension-1 stratum.
        responsibility: correctness
      - claim: >-
          S_3 -> Aut(V) = GL_2(F_2) is injective, and translations plus full
          Aut(V) generate AGL(2,2) = S_4 on four points.
        responsibility: correctness
      - claim: >-
          THE STEP MOST LIKELY TO BE WRONG AND THE ONE A REVIEWER SHOULD OWN:
          that the S_3 is actually realized in Gal, i.e. that the splitting
          field of Q_e over k(e1,e2,e3) contains enough of k(x1,x2,x3) for the
          descent group to act. At m = 3 H-MONO-0b3def had to supply exactly
          this recovery step explicitly (t1 - t2 = (y1^2 - y2^2)/(e1^2-e2+A)).
          The m = 4 analogue is NOT supplied here and must be either proved or
          replaced by the measured labelled-element count.
        responsibility: strictness
      - claim: >-
          The class-count law (C4) is exact and depends on (p, t, Z) only.
        responsibility: baseline
      - claim: >-
          The three excluded strata (g inseparable, Res(g,f) = 0, Q_e not
          squarefree) are counted and reported separately, never pooled.
        responsibility: soundness
      - claim: >-
          Nothing transfers to F_{q^n}, to relation rates, to cost, or to any
          exponent; every citation of this record carries the gap.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        P1 (ZERO COMPUTE, PRIMARY GATE) -- symbolic agreement of (C3) with
        EV-MONO-efbd1c's two-type law when the sampling measure is restricted to
        the ordered base, and with H-MONO-0b3def's D_4 densities at m = 3
      direction: same
      minimum_effect: >-
        EXACT. Not a tolerance: setting pi = id in (C3) must return exactly
        {1^4, 2+2} with split condition "all three characters equal", and the
        m = 3 restriction must return 1/8, 1/4, 1/8, 1/4, 1/4. A failure halts
        the record before any compute is spent.
    - metric: >-
        P2 -- per-admissible-point agreement between the class predicted by the
        recipe (C3) and the class read off an INDEPENDENTLY CODED squarefree /
        distinct-degree factorization of Q_e over F_p
      direction: higher
      minimum_effect: >-
        1.000 EXACTLY, over >= 200,000 admissible points per curve. A
        per-instance prediction: ONE mismatch is decisive and halts
        interpretation. This, not any density comparison, is the record's
        primary evidential locus -- learned from EV-MONO-efbd1c, whose reviewers
        proved that the prior record's headline specialization count was close
        to logically forced while its dual-path cross-check was the real
        evidence.
    - metric: >-
        P3 -- ARM-S4 five-class counts against the exact (C4) integers, by
        EXHAUSTIVE enumeration of all p^3 base points at p in {101, 103}
      direction: same
      minimum_effect: >-
        EXACT INTEGER EQUALITY in all five classes and all three excluded
        strata. Exhaustive enumeration means there is no sampling error and no
        tolerance to negotiate: the counts match or the law is wrong.
    - metric: >-
        P4 -- ARM-D4 and ARM-A4 calibration: 3+1 count on ARM-D4, and 4-cycle
        plus 2+1+1 counts on ARM-A4
      direction: lower
      minimum_effect: >-
        EXACTLY 0 on each, with the other classes matching D_4's (1/8, 3/8, 1/4,
        1/4) and A_4's (1/12, 1/4, 2/3) within 3 binomial standard errors.
        A nonzero count is an instrument failure, not a discovery.
    - metric: >-
        P5 (NEARBY-OBJECT / POSITIVE CONTROL, MANDATORY) -- cycle-type histogram
        of uniformly random monic quartics over the same F_p against S_4
        Chebotarev densities
      direction: same
      minimum_effect: >-
        Within 3 standard errors of 1/24, 1/4, 1/8, 1/3, 1/4, with STRICTLY
        POSITIVE 4-cycle and 3+1 counts. If this fails the instrument cannot see
        the classes ARM-V4 and ARM-A4 assert are absent, and NO RESULT, POSITIVE
        OR NEGATIVE, MAY BE REPORTED (AGENTS.md rule 5 / inventor-protocol
        controls-before-belief).
    - metric: >-
        P6 -- realized LABELLED affine elements (pi, w) at m = 4 over ARM-S4, as
        a measured lower bound on |Gal|
      direction: higher
      minimum_effect: >-
        24 distinct labelled elements on every tested curve, against 4 for the
        ordered base and 8 for ARM-D4. Reported as a MEASURED LOWER BOUND on the
        group order, never as an assumed equality.
    - metric: >-
        P7 (THE EXCEPTIONAL-LOCUS TEST) -- five-class integer counts of two
        curves over the same p with identical (t, Z) and different j, one of
        them CM (j = 0 or 1728) and one generic ordinary, by exhaustive
        enumeration
      direction: same
      minimum_effect: >-
        BITWISE IDENTICAL INTEGERS in all five classes. No tolerance, no test
        statistic, no power calculation. A single differing integer, with P2 and
        P5 passing, is outcome (II) and is the headline finding.
    - metric: >-
        P8 -- p-ladder decay of the deviation of measured densities from the
        (p, t, Z)-free ideal (1/24, 1/4, 1/8, 1/3, 1/4)
      direction: lower
      minimum_effect: >-
        Deviation decaying as O(1/p) across p in {101, 211, 421, 1009, 2003}.
        THE CANONICAL ARTIFACT TELL (inventor-protocol controls-before-belief):
        a deviation that does NOT decay when p grows is an artifact of the
        instrument, not curve arithmetic, and voids the density arm.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, hard gate). Re-derive (C3) independently and check
      it collapses to EV-MONO-efbd1c's two-type law on the ordered base and to
      H-MONO-0b3def's D_4 densities at m = 3 (prediction P1). Halt on failure.
      STAGE 1 (the cheapest measurement that can fail informatively; ONE prime,
      ONE curve). p = 101, one generic ordinary curve with j not in {0, 1728}.
      Build S_4 by the resultant recursion, descend to Q_e, and run all four
      arms plus the random-quartic control at >= 50,000 points each. Read P4,
      P5, P6 and the P2 dual-path agreement. THIS STAGE ALONE DECIDES WHETHER
      THE LANE HAS A FIVE-VALUED INSTRUMENT AT ALL; if ARM-S4 emits no 4-cycles
      while the random-quartic control passes, or if ARM-A4 emits a 4-cycle, the
      instrument is broken and nothing downstream is worth running.
      STAGE 2 (exhaustive exact arm). At p in {101, 103}, enumerate ALL p^3 base
      points on a panel of >= 8 curves and compare the five class counts against
      the exact (C4) integers (P3). No sampling, no tolerance.
      STAGE 3 (the exceptional-locus test). Search p in [101, 2000] for curve
      pairs with identical (t, Z), one CM (j = 0 or 1728) and one generic
      ordinary with j not in {0,1728}; enumerate exhaustively and compare the
      five integers (P7). Report the search outcome -- found, at which p and
      (t,Z), or not found in the declared range -- as a fact, never assumed.
      STAGE 4 (ladder). Repeat Stage 1 sampled at p in {211, 421, 1009, 2003}
      for the p-ladder artifact tell (P8).
    controls:
      - >-
        OI-1(a) REVERIFICATION-DISPOSITION RULE (CORR-20260802-1d8384 defect 3).
        Any base point flagged as a candidate violation of P2, P4 or P7 is
        independently reverified, and the aggregate outcome function MUST read
        that reverification's `disposition` field. A candidate whose
        reverification returns `failed_infrastructure` is NEVER promoted to a
        positive or exceptional finding; it is reported as an infrastructure
        outcome. The prior harness's aggregate tested only
        `passes_full_monodromy_test` and never read the disposition, which would
        have turned an infrastructure failure into positive mathematical
        evidence.
      - >-
        OI-1(b) 2-TORSION GENERATOR GUARD (defect 7). Any point recorded as a
        curve's generator or reference base point has its TRUE order computed
        and asserted, never #E substituted for it; curves whose recorded
        reference point is 2-torsion (which on the prior harness collapsed
        W_eff to 1 at p = 809, A = 795, B = 0 and p = 1601, A = 250, B = 0) are
        quarantined from every aggregate and reported separately. Because this
        record's sampling needs no generator, the guard is enforced as an
        assertion that no aggregate depends on any recorded point order.
      - >-
        OI-1(c) RELATIVE TOLERANCES ON THE TWO WINDOW CONTROLS (defect 4).
        CTRL-NEG-UNIFORM-WINDOW and CTRL-NEG-SHUFFLED-WINDOW use tolerances
        RELATIVE to the expected rate, not the absolute 0.02 / 0.03 that made
        them pass for an EMPTY window at every pinned prime. Each control must
        additionally be DEMONSTRATED to FAIL on a deliberately emptied window
        before the run is read; a control not shown to be capable of failing is
        recorded as "not evaluated", never as "passed".
      - >-
        OI-1(d) FAMILY_RATE_ALERT (exception_family_rate_screen, implemented
        nowhere in the prior harness). If the rate of P2/P4/P7 exception
        candidates within any declared curve family (CM, j = 0, j = 1728,
        Z = 3, a fixed prime) exceeds a pre-registered threshold, the run raises
        FAMILY_RATE_ALERT and the family's cells are quarantined pending
        investigation rather than promoted -- because a family-correlated
        exception rate is the signature of a family-correlated bug.
      - >-
        OI-1(e) UNIFORM (A,B) DRAW (defect 9). Curve panels are drawn uniformly
        from ALL non-singular (A,B) in F_p^2 by rejection sampling, never from a
        small-height box (the prior panel used A in [0,64], B in [1,64], which
        at p = 1601 is 0.16 percent of the curve space and all of tiny height).
      - >-
        KN-OPEN-009's own requirement: j = 0 and j = 1728 are EXCLUDED from
        every "generic ordinary curve" control arm, and appear only as the
        deliberately-studied CM member of a Stage 3 matched pair, where any
        observed effect must additionally be checked against the
        extra-automorphism explanation before being called a CM effect.
      - >-
        Supersingular exclusion: curves with N = p + 1 (equivalently t = 0 at
        these primes) are identified and reported separately from the ordinary
        panel; "generic ordinary" means ordinary.
      - >-
        DUAL INDEPENDENT CLASSIFICATION PATHS with a declared cross-check
        subsample, mirroring the design EV-MONO-efbd1c identifies as the prior
        record's real evidential locus: PATH 1 builds Q_e's coefficients as
        symmetric functions of the roots of g in F_p, F_{p^2} or F_{p^3} and
        factors the result over F_p by squarefree + distinct-degree
        factorization with NO knowledge of the recipe; PATH 2 evaluates the
        recipe (C3). Disagreement voids every affected cell as an integrity
        failure, never a result.
      - >-
        MUTATION-TESTED POWER, measured not assumed: corrupt one coefficient of
        S_4 by +1 and record the resulting PATH1/PATH2 disagreement rate, so the
        cross-check's discriminating power is a measured number in the run
        record (the prior lane's red team measured 88.8-89.9 percent this way).
      - >-
        INDEPENDENT SAMPLING STREAMS PER CURVE. Each curve draws from its own
        seeded stream; the prior panel's three curves sharing p = 421 drew
        bit-identical index sequences, reducing an 8-curve panel to 4
        independent streams. Stream independence is asserted and the assertion
        is recorded.
      - >-
        The three excluded strata are counted, reported, and never pooled with
        the five classes.
    required_metrics:
      - five-class integer counts per (curve, arm, prime), plus all three excluded-stratum counts
      - PATH1/PATH2 per-point agreement rate, and the mutation-test disagreement rate
      - realized labelled affine element count per (curve, arm)
      - random-quartic control histogram with its 4-cycle and 3+1 counts
      - Stage 3 matched-(t,Z) pair search outcome, and the five-integer comparison for each pair found
      - per-arm deviation from the ideal densities at each prime on the p-ladder
      - every control's pass/fail together with the demonstration that it CAN fail

  falsification_conditions:
    - >-
      F1 (ZERO COMPUTE, PRIMARY) -- P1 fails: (C3) does not collapse to
      EV-MONO-efbd1c's two-type law on the ordered base, or to H-MONO-0b3def's
      D_4 densities at m = 3. The derivation is wrong; the record is withdrawn
      by supersession and no compute is spent.
    - >-
      F2 -- any single admissible point where PATH 2's recipe class disagrees
      with PATH 1's factorization class (P2 below 1.000), with the
      random-quartic control passing. The per-instance claim (C3) is false.
    - >-
      F3 -- ARM-S4 exact counts (P3) differ from the (C4) integers on any curve.
      The class-count law is false; note that this is decidable exactly, since
      Stage 2 is exhaustive.
    - >-
      F4 -- ARM-D4 emits a 3+1, or ARM-A4 emits a 4-cycle or a 2+1+1, with the
      random-quartic control passing. The subgroup ladder does not calibrate and
      the instrument is not what this record claims it is.
    - >-
      F5 -- P5 fails (the random quartic does not reproduce S_4 Chebotarev, or
      emits no 4-cycles). NOTHING may be reported in either direction; this is
      an instrument outcome, never mathematical evidence.
    - >-
      F6 (THE INTERESTING ONE) -- a Stage 3 matched-(t,Z) pair whose five
      integer counts differ, with P2, P4 and P5 passing. Claim (C4) is false and
      KN-OPEN-009's exceptional family exists at m = 4 on a five-valued
      observable. This must be reported as the headline finding, not absorbed.
    - >-
      F7 -- P8's deviation fails to decay as p grows while controls pass: the
      density arm is measuring an artifact and is void, independently of the
      exact-integer arms, which are unaffected.
    - >-
      F8 (THE PLANNED NEGATIVE, PRE-REGISTERED) -- if outcome (I) obtains and
      the batch does NOT emit a statement of what remains open, the work is
      unfinished. The required forward guidance, fixed here before any run:
      (i) the relation-rate half of KN-OPEN-009, untouched here and carried by
      the companion fixed-T proposal; (ii) the geometric-versus-arithmetic
      monodromy gap, which a fixed-p census cannot close and which is
      H-MONO-59f6a6's object; (iii) m >= 5, where the group is
      V_{m} semidirect S_{m-1} on 2^{m-2} points and is a PROPER subgroup of the
      symmetric group again for m >= 5 (order 2^{m-2}(m-1)! against
      (2^{m-2})!), so m = 4 is the unique arity at which the answer is "the full
      symmetric group" and the m = 4 result must never be quoted as an m >= 4
      result. A closure without these three is a fatigue report under
      docs/inventor-protocol.md section 4.

  confounders:
    - >-
      DEGREE-CAP RECURRENCE. If the implementation constructs roots as signed
      sums using only F_p and F_{p^2} arithmetic -- the natural thing to write,
      and what the prior harness did -- the degree cap EV-MONO-efbd1c identified
      returns and ARM-S4 silently degenerates to ARM-V4. The classification path
      MUST factor Q_e over F_p without constructing the roots, and the
      random-quartic control is the tell.
    - >-
      STRATUM POOLING. The three excluded strata all have density O(1/p) and all
      have curve-dependent sizes; pooling any of them into the five classes
      imports a (t,Z)-dependent bias of exactly the order of the effect being
      measured. This is the mechanism by which the prior lane's M3 metric
      acquired 24-sigma deviations (EV-MONO-efbd1c, Finding 2's real cause).
    - >-
      MATCHED-PAIR SCARCITY. A (t,Z)-matched CM/ordinary pair need not exist at
      any particular small prime; the search range is declared before the search
      runs and a null search is a bounded negative, not a failure.
    - >-
      j = 0 / 1728 AS BOTH THE CHEAPEST CM CONSTRUCTION AND A KNOWN
      EXTRA-AUTOMORPHISM LOCUS. Any Stage 3 difference must be checked against
      the automorphism-count explanation before being attributed to CM; a
      non-j-in-{0,1728} CM discriminant is the disclosed follow-up.
    - >-
      MODEL CORRELATION, CARRIED FORWARD. EV-MONO-a0a89c, H-MONO-45183a and the
      EXP-MONO-12ce1c red team all resolved to claude-opus-5; EV-MONO-efbd1c
      records this as only partially mitigated. Any review of this record must
      record the same confound rather than inherit it silently.

  interpretation_limits:
    - >-
      CLAIM TIER toy for every measurement; derivation tier for (C2) and (C3).
      The two must never be conflated in a citation.
    - >-
      NO ECDLP CLAIM IN EITHER DIRECTION. No curve becomes weaker or stronger.
      This determines the monodromy of one cover under one base measure.
    - >-
      NO RELATION-RATE CLAIM. DEC-20260810-2f86db D-1 rejects the generic-fibre
      cycle-type census AS A RELATION-RATE PROBE at every m, by derivation, and
      that rejection is accepted here without qualification. This record is an
      instrument for the GROUP, which D-3 explicitly keeps live at m >= 4.
    - >-
      m = 4 ONLY, AND THE FULL-SYMMETRIC ANSWER IS SPECIFIC TO m = 4. At m >= 5
      the same construction gives V semidirect S_{m-1} inside Sym(2^{m-2}),
      which is a proper and imprimitive subgroup. Quoting "full symmetric
      monodromy" without "at m = 4, over the symmetric base" is an overclaim.
    - >-
      SAYS NOTHING about F_{q^n}, characteristic 2 or 3, singular curves, or
      genus > 1.
    - >-
      A fixed-p Frobenius census bounds ARITHMETIC monodromy from below and does
      not by itself separate arithmetic from geometric monodromy; that
      separation is H-MONO-59f6a6's object and its N1 ladder, not this record's.
    - >-
      DOES NOT AUTHORIZE A STATUS CHANGE and is not admissible toward any
      closure quorum. Only the Coordinator may move a hypothesis or a goal
      (AGENTS.md rule 1).

  heuristic_assumptions:
    - id: H1
      statement: >-
        HEUR-AGL-1 (NOT LOAD-BEARING FOR THE RECIPE, LOAD-BEARING FOR EQUALITY).
        FOR ALL p > 3 and all non-singular E/F_p, the arithmetic monodromy of
        Q_e over F_p(e1,e2,e3) is the FULL AGL(2,2) = S_4, i.e. all 24 labelled
        affine elements are realized. The CONTAINMENT (every Frobenius element
        is affine, per C3) is asserted as a derivation and is not this
        assumption; only the surjectivity is.
      rigorous_support: >-
        Rigorous half: Frobenius acts on the four roots by an affine map, proved
        by direct computation from phi(P_i) = s_i P_{pi(i)}. Distribution half:
        the classical Chebotarev density theorem for the cover, whose finite-p
        instance is the Weil bound -- the same pairing H-MONO-0b3def used at
        m = 3, where the corresponding equality (all 8 elements of D_4 realized)
        was measured and confirmed rather than assumed.
      validation_plan: >-
        SAMPLE: the labelled affine element (pi, w) at >= 50,000 admissible
        points per (curve, arm), on >= 8 uniformly drawn non-singular curves per
        prime, at p in {101, 211, 421, 1009, 2003}, plus EXHAUSTIVE p^3
        enumeration at p in {101, 103} where no sampling assumption is needed at
        all. COMPARE AGAINST: the 24-element uniform distribution on
        V semidirect S_3, class-weighted, i.e. the S_4 Chebotarev densities
        1/24, 1/4, 1/8, 1/3, 1/4, and against the exact (C4) integers. TAIL
        CHECK: the rarest class (1^4, density 1/24) must be present on every
        curve at every prime; its absence at p >= 421 with >= 50,000 samples
        (expected count >= 2000) is a decisive tail failure, not noise.
        TRANSFER ASSUMPTION, STATED: results at p <= 2003 are not extrapolated
        to cryptographic p; the p-ladder measures whether deviations decay, and
        that decay is the only extrapolation-adjacent claim made.
      falsification_condition: >-
        Fewer than 24 distinct labelled affine elements realized on any tested
        curve at ARM-S4 with >= 50,000 admissible samples and the random-quartic
        control passing. This would indicate a proper subgroup -- which would
        make KN-OPEN-009's exceptional-locus branch TRUE at m = 4 and would be
        the more consequential outcome.
    - id: H2
      statement: >-
        HEUR-AGL-2. FOR the uniform measure on (e1,e2,e3) in F_p^3, the
        F_p-factorization type of g and the quadratic characters
        chi_p(f(t_i)), chi_p(Res(q,f)) are jointly distributed exactly as the
        counting in (C4) predicts, with no correlation beyond (p, t, Z).
      rigorous_support: >-
        Rigorous half: the counts in (C4) are exact enumerations, not estimates
        -- they are derived by counting monic cubics by factorization type and
        counting x-values by quadratic character using
        S = (p-t-Z)/2 and its F_{p^2}, F_{p^3} analogues. The classical
        statement they imitate is the Chebotarev/Weil equidistribution of
        quadratic characters along a curve, in the same form
        EV-MONO-a0a89c OBS-3 already verified exhaustively at m = 3 over all
        p^2 pairs on 19 curves.
      validation_plan: >-
        SAMPLE: exhaustively, all p^3 base points at p in {101, 103}, on >= 8
        curves including at least one with each Z in {0, 1, 3} and at least one
        CM curve. COMPARE AGAINST: the (C4) integers, exactly. TAIL CHECK: the
        three excluded strata counts must also match their own exact
        expressions, since a bias hiding there is the known failure mode
        (EV-MONO-efbd1c Finding 2). CROSS-CHECK at larger p by sampling with the
        p-ladder decay test P8.
      falsification_condition: >-
        Any exact integer mismatch in Stage 2, or a matched-(t,Z) pair
        disagreeing in Stage 3, with the dual-path cross-check passing.
    - id: H3
      statement: >-
        HEUR-AGL-3 (INSTRUMENT, NOT MATHEMATICS). The independently coded
        factorization path (PATH 1) has non-trivial power to detect a violation
        of the recipe, i.e. it is not forced by construction to agree with
        PATH 2.
      rigorous_support: >-
        None a priori -- and that is exactly why it is measured. The prior
        lane's headline metric was proved by two independent reviewers to be
        close to logically forced by its own construction (EV-MONO-efbd1c), so
        this record treats classifier power as a quantity to measure rather than
        a property to assert.
      validation_plan: >-
        SAMPLE: mutation testing -- perturb one coefficient of S_4 by +1 and
        measure the PATH1/PATH2 disagreement rate over >= 5,000 points; repeat
        for a perturbation of g and of f. COMPARE AGAINST: a pre-registered
        floor of >= 50 percent disagreement under mutation. TAIL CHECK: feed the
        classifier a hand-built genuine 2+1+1 and a genuine 4-cycle root set and
        confirm it labels them correctly.
      falsification_condition: >-
        Measured mutation disagreement below the pre-registered floor: the
        cross-check is near-vacuous, its agreement carries little evidence, and
        P2 must be reported as an implementation check rather than as a
        measurement.

  target_complexity:
    time_exponent: >-
      NOT APPLICABLE. No algorithm and no attack is proposed. The measurement
      itself is O(p^3 log p) field operations for the exhaustive arm and
      O(n log p) for a sampled arm of n points.
    memory_exponent: >-
      O(1) beyond a five-integer counter vector per (curve, arm); well under
      1 GB at every declared parameter.
    best_known: >-
      Not applicable; no ECDLP complexity claim of any kind is made. For the
      record, the prime-field ECDLP baseline this program works against is
      Pollard rho at O(sqrt(N)) time and O(1) memory (KN-OPEN-001), and nothing
      here moves it in either direction.
    hidden_overhead: >-
      None hidden. The exhaustive arm's p^3 cost is disclosed and is the reason
      exhaustiveness is confined to p in {101, 103}; every larger prime is
      sampled and is reported as sampled.
    tradeoff_note: >-
      Not applicable -- no time-memory tradeoff and no parallelization position
      is claimed. The measurement is embarrassingly parallel over base points,
      which is a convenience, not a result.

  dominated_by:
    value: not_applicable
    reason: >-
      No Pareto point is claimed on any axis. This is a Galois-group
      determination and an instrument-calibration design, not a competing
      cryptanalytic mechanism, so there is no time, memory or data/query
      coordinate on which it could dominate or be dominated. The relevant
      frontier row -- Pollard rho, O(sqrt N) time and O(1) memory over prime
      fields -- was checked and is untouched: this record proposes no solver, no
      relation search and no cost model.
  sota_delta: >-
    0, exactly, on every attack axis. No security estimate for any curve at any
    size moves in either direction.

  estimated_cost:
    implementation: medium
    compute: low

  recommended_priority: high

  priority_rationale: >-
    This is the first instrument in the lane that is not degree-capped, and the
    reason is derivational rather than hopeful: EV-MONO-efbd1c proves the
    ordered-base construction can only produce roots of degree 1 or 2 over F_p,
    and the symmetric base removes exactly that constraint by letting the x_i
    live in F_{p^2} and F_{p^3}. It answers the "resp. wreath" clause of
    KN-OPEN-009 that DEC-20260810-2f86db D-3 explicitly kept live at m >= 4, at
    the first arity where the sign group has a nontrivial automorphism group and
    the imprimitivity question can even be posed. It supplies, for the first
    time in this lane, a SATISFIABLE graded control at every group in the
    relevant subgroup lattice -- replacing the null control that both reviewers
    proved unsatisfiable for any companion object and that voided
    EXP-MONO-12ce1c's Stage 2. And its exceptional-locus test is an EXACT
    INTEGER comparison on exhaustively enumerated data, so it has no power
    calculation to lose: the two prior censuses in this lane failed not because
    their statistics were noisy but because their statistics were constant, and
    an exhaustive five-class integer count on a demonstrably five-valued
    observable is the direct repair. Ranked HIGH despite carrying no exponent
    claim and sota_delta 0.

