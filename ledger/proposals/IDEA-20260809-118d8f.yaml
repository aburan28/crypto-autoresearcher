idea:
  id: IDEA-20260809-118d8f
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-EDDSA-9b8473
  goal_id: GOAL-EDDSA-001
  title: >-
    A deterministic separating-triple generator: given two readings, emit the
    minimal certificate that distinguishes them, reproducibly
  class: tooling
  claim: >-
    The pairwise separating sets computed over the predicate lattice can be
    packaged as a deterministic generator: input two predicate conjunctions,
    output the smallest enumerated object on which they differ, together with a
    machine-checkable proof of the difference. The claim is that such a
    generator is total over the lattice — every distinguishable pair has a
    witness in the enumerated space — or that the pairs with no witness form an
    identifiable, reportable set.
  mechanism: >-
    Precompute the predicate outcome vector for every enumerated candidate, index
    by outcome pattern, and answer a query by set difference. Determinism comes
    from a fixed total order on candidates; minimality is with respect to that
    order and a declared size measure.
  why_not_a_renamed_known_approach: >-
    Differential testing frameworks generate random inputs and compare
    implementations. This generator is the opposite: it is exhaustive,
    deterministic, and answers queries about READINGS rather than about
    implementations, so its output is stable across runs and citable in a record.
  predictions:
  - observable: totality of the generator over distinguishable lattice pairs
    metric: fraction of pairs with a witness
    predicted: 1.0. Any pair without a witness identifies a gap in the enumerated object space, which is itself the useful output.
  - observable: determinism across runs and machines
    metric: byte-identical output over repeated runs on different machines
    predicted: Identical. Non-determinism would make every certificate in this goal unciteable and must be fixed before any record depends on it.
  minimal_test: >-
    Build the index, answer every lattice pair, check totality, and run the
    generator twice on two machines comparing output byte-for-byte. Emit the
    generator and its index as run artifacts.
  controls:
  - 'KNOWN-PAIR CONTROL: for pairs whose separating object is already known from IDEA-20260809-030a70 and IDEA-20260809-0e1f59, the generator must return an object consistent with those certificates.'
  - 'EMPTY-PAIR CONTROL: querying a pair of identical readings must return no witness; returning one indicates an indexing bug.'
  falsification_conditions:
  - The generator is not total and the missing pairs cannot be explained by a stated boundary of the enumeration.
  - Output is not reproducible across machines.
  interpretation_limits: >-
    The generator's minimality is with respect to a declared order and size
    measure, not an absolute notion. It produces objects, not judgements, and
    nothing it emits is a statement about any implementation.
  sota_delta: 'No attack. Delta: a reusable, deterministic artifact that makes every later certificate in this goal reproducible on demand.'
  dominated_by: Not dominated by any corpus record; strictly downstream of IDEA-20260809-022eb5 and IDEA-20260809-0e919c.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for differential testing harness: no EdDSA records. WEB NOT CHECKED.'
