  assumptions:
    - >-
      N equals the order of E(F_p) and is an odd prime (or Z/N with N prime
      for control arms); curves of composite order are outside every
      identity that uses 'n_j is a unit mod N'.
    - B denotes the number of searched POINTS; negation-closed arms have B even and B/2 x-classes; the conservation total is C(B + m - 1, m) for every arm under the unreduced convention and M - B^2/2 under the reduced one at m = 3.
    - The reduced convention ('exactly m points, signs free, no {P, -P} pair inside a multiset') and the unreduced convention are both reported on every negation-closed arm, never mixed within a cell.
    - Exhaustive labels c_D(r) are computed by enumeration of all M multisets with a hash over G; every decomposition is a checked point identity (certificate), and INV-1 is asserted exactly on every cell before any other number is read.
    - Toy scale binds; N in {2^14, 2^16, 2^18, 2^20}, m = 3, at least 3 prime-order curves per cell; nothing is claimed at cryptographic scale.
    - Logarithms of base points are used ONLY for the FFT cross-check (stage 3) and the log-window anchor, both of which are unrealizable instruments and are labelled so; no predicate in the frozen family depends on a logarithm.

  proof_search_map:
    bottleneck: >-
      Whether E_3 of an x-interval base exceeds the random value M +
      M(M - 1)/N by more than the random-base band in the index-calculus
      range B of order (6N)^{1/3}, and whether the excess, if any, grows with
      N. Everything else in the record is an identity; this one number is
      the open content, and it is outside the regime any recalled character-
      sum bound reaches (claim (vii)).
    baseline_embedding:
      parameter_slice: >-
        INV-1 (sum of counts = M) is the first moment and must reproduce
        exactly in every cell; the m = 2 law of IDEA-20260906-86cd30 is the
        exact slice at arity 2 of the random-base statements here (INV-2' at
        m = 2 gives E[E_2] = M + M(M - 1)/N, whose coverage consequence is
        86cd30's Corollary 2b Poisson limit); a25f11's forced counts B/2 at
        m = 2 and B^2/2 at m = 3 (points convention) are the exact slices of
        INV-2''.
      reproduction_check: >-
        Per cell: sum of counts equals M (unreduced) and M - B^2/2 (reduced)
        with integer-exact deviation 0; sum of squares equals the independently
        enumerated pair count E_3 with deviation 0; the Z/N interval arm's E_3
        equals the pre-registered integer enumeration; the m = 2 random arm's
        coverage equals 1 - C(n - B/2, B/2)/C(n, B/2) within Monte Carlo error.
        Any nonzero deviation on an exact check halts the cell.
    observation_collision:
      observable: >-
        The count HISTOGRAM (number of targets with 0, 1, 2, ... decompositions)
        and its summaries E_3, Delta, k-rich counts, plus the pushforward
        cell-total vector for the frozen predicate family.
      distinct_preimage_search: >-
        Collisions are exhibited, not hunted: (a) by INV-3 every affine image
        uD + t of a base has the same histogram, so exponentially many distinct
        bases share it; (b) the Z/N interval [1, B] and the E small-multiples
        base {[i]P} have IDENTICAL count vectors (same log-set) and are run as
        one control plus an arithmetic consistency check, not two controls;
        (c) two bases with equal histogram can have different pushforward
        vectors (the histogram forgets where the mass sits), which is why the
        pushforward is a separate observable; (d) the separating pair is
        (E/x-interval, E/random-x-classes): predicted to collide on the
        histogram within the random band, versus (Z/N interval, Z/N random):
        predicted to separate by a factor above 100 in Delta. An instrument on
        which (d)'s second pair does not separate is void.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The second moment E_m and the group power spectrum {|S_D(chi)|^2}
          as the tracked object, in place of the mean (fixed by INV-1) and in
          place of a learned predictor's accuracy.
        predicted_gain: >-
          An accounting identity with a closed-form null replaces a simulated
          selection null; a single number (Delta excess) bounds every lift of
          every predicate via INV-3''.
      - transform: representation_reduction
        proposed_object: >-
          The Riemann-Roch conic family Gamma_D and the incidence structure
          (E(F_p), Gamma_D); the forced cluster read as the degenerate
          sub-family gamma = 0.
        predicted_gain: >-
          Exact identification of the trivial cluster a learned model must not
          be credited for; hyperedge features; and the audit result that the
          incidence route is void at M of order N, redirecting the k-rich
          bound to Chebyshev on INV-2.
      - transform: boundary_lift
        proposed_object: >-
          The character-sum ceiling at B above p^{1/2} log p (nontrivial) and
          p^{3/5} (Poisson-level), with INV-4c the conjectured extension down
          to p^{1/3}.
        predicted_gain: >-
          Names the provable boundary exactly, so a toy-scale measurement is
          placed honestly in the open regime rather than presented as a proof.
    quantifier_order: >-
      IDENTITIES: FOR ALL prime N, FOR ALL D subset G with |D| = B, FOR ALL
      m: sum_r c_D(r)^2 = E_m(D) and Delta >= {mu}(1 - {mu})/mu; FOR ALL
      fixed S subset G and uniformly random D: E[T_S] = sigma M and (i.i.d.)
      Var[T_S] = sigma (1 - sigma) M; FOR ALL D and S: |rho_S - 1| <=
      sqrt(Delta (1 - sigma)/(sigma mu)). CONJECTURE INV-4c: FOR ALL
      prime-order E/F_p and FOR ALL x-interval bases with B in [p^{1/3},
      p^{1/2}], E_3(D) = (1 + o(1)) (M + M^2/N). EMPIRICAL CLAIM: FOR ALL
      four rungs and FOR ALL tested curves, Delta(x-interval) lies inside the
      random-class-set band; the COMPETING claim is THERE EXISTS a rung from
      which the excess is positive on every curve and increasing.
    method_ceiling:
      strongest_certifiable_claim: >-
        'At toy scale (N <= 2^20, m = 3, at least 3 prime-order curves per
        rung, two B conventions, both sign conventions) the dispersion index
        of x-interval and quadratic-residue bases sits within the random-
        class-set band (or: exceeds it by a measured amount with a measured
        growth exponent), the Z/N interval control exceeds it by a factor
        above 100, and the Bose-Chowla control attains the exact Sidon floor;
        hence every representation-decidable predicate lift is bounded by
        sqrt(Delta (1 - sigma)/(sigma mu)) at those cells.' It certifies
        nothing about crypto scale, nothing about solve cost or rank, and
        proves INV-4c at no scale.
      nearby_object_control: >-
        Z/N with the interval base [1, B] (equivalently the small-multiples
        base on E): the same identities hold, the same instrument runs, and the
        conclusion 'no cluster' FAILS by a factor of order B^2 -- it is the
        object on which the method must return the opposite verdict. Second
        nearby object: the unreduced negation-closed convention, on which the
        base itself is a forced cluster of size B^3/(4M) in Delta.
    proof_obligations:
      - claim: INV-2 double count and the dispersion-index algebra.
        responsibility: correctness
      - claim: INV-2' collision probability exactly 1/N in the i.i.d. model; support-two exception and the O(m^2 B/N) correction without replacement; reduced negation-closed extension.
        responsibility: correctness
      - claim: INV-3 affine covariance and Var T_S = sigma (1 - sigma) M; the negation-closed caveat.
        responsibility: correctness
      - claim: INV-3'' Cauchy-Schwarz envelope and its consequence for the c5c614 cost ledger.
        responsibility: interface
      - claim: INV-4 thresholds p^{1/2} log p and p^{3/5}, conditional on the recalled Kohel-Shparlinski bound; retrieval of the bound is a stage of the paired experiment.
        responsibility: scope
      - claim: INV-5 conic reading, degenerate sub-family, and the audit that incidence bounds are void for k < N^{1/2} at M of order N.
        responsibility: baseline
      - claim: INV-9 corrected floor and the existence of the B_2 convention at every rung.
        responsibility: feasibility
      - claim: Exhaustive enumeration at 2^20 (about 1.1e6 multisets per base, 100 random bases per cell) fits the stated budget.
        responsibility: runtime
      - claim: Every number is toy-tier and scoped to the declared curves, conventions and budget.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The decomposition-count vector c_D on G, projected to (a) its second
      moment E_m / dispersion index Delta and k-rich profile, (b) its group
      power spectrum {|S_D(chi)|^2 : chi}, and (c) its pushforward along a
      representation-decidable partition of the x-line.
    representation_and_operation_set: >-
      Representation: the affine (x, y) coordinates of a point on a short
      Weierstrass model, with predicates read from x alone so that the
      symmetric convention c(R) = c(-R) descends to the x-line. Operation
      set Sigma: translation by elements of D (the arity-raising step
      Sigma_m = Sigma_{m-1} + D), plus, for the BASE as an object, the
      affine group of Z/N. Trichotomy class (IDEA-20260806-c5d183): the
      count vector and its moments are Class I partial-action objects for
      Sigma = translation by D; the pushforward (c) is coordinate-dependent.
      No object here is claimed to propagate under full translation of the
      target, consistent with KN-FIND-ffe1df Theorem C.
    established_families_off_limits: >-
      Off-limits as primary lens: mean-yield factor-base geometry
      (KN-FIND-007), Groebner and solving-degree instrumentation, Weil
      descent, rho/BSGS baselining, the bounded-degree algebraic factor base
      of KN-OPEN-020, and the yield/coverage/rank channels closed by
      IDEA-20260830-772cff. The x-interval and QR bases appear only as
      the OBJECTS whose energy is measured, not as proposed factor bases.
    lossiness: >-
      GENUINELY LOSSY. (a) The histogram and E_m forget which target has
      which count, the curve, the labels, and every property of D except its
      additive structure; by INV-3 all affine images of D share them. (b) The
      power spectrum forgets phases: homometric sets (distinct up to affine
      maps with the same autocorrelation) share it, and E_m^{ord} at EVERY
      arity is a function of it. (c) The pushforward collapses N counts to k
      cell totals. None is invertible; none is a change of coordinates.
    propagation: >-
      Compatible with the named operations: under the arity step the count
      vector maps by D-convolution (INV-6) and the spectrum maps by taking
      the next power; under the affine action of Z/N the histogram is
      invariant and the spectrum is permuted; under negation the pushforward
      to the x-line is invariant. It does NOT propagate under translation of
      the target by an arbitrary group element, and the record does not use
      that.
    survival_score: >-
      The identities survive everywhere; the analytic null survives for plain
      random subsets and degrades to mean-only for negation-closed nulls; the
      character-sum ceiling survives only above p^{1/2} log p; INV-4c is a
      conjecture that the battery can only support or refute at toy scale.

  null_object_control: >-
    NULL-A (matched, blocking): E with a uniformly random B/2-subset of
    on-curve x-classes (negation-closed), reduced and unreduced; 100 draws
    per (N, B) give the band for every negation-closed arm. Forced: mean
    Delta = 1 - 1/N - O(m^2 B/N) in the reduced convention. NULL-B
    (blocking): E with a uniformly random B-subset of points and Z/N with a
    uniformly random B-subset, the latter mirrored on E by exponentiation
    and required to agree bit-for-bit with the former's distribution; INV-3's
    Var T_S = sigma (1 - sigma) M must hold for every predicate cell and for
    the log-window anchor. POSITIVE CONTROL (blocking): Z/N interval [1, B]
    = E small-multiples, Delta >= 0.05 B^2 (>= 115, 274, 696, 1730 at the
    rungs); if the instrument does not report it no negative may be read.
    MINIMUM-ENERGY CONTROL (forced value): Bose-Chowla B_3 at B_2, E_3 = M_2
    exactly, Delta = 1 - mu_2 exactly. TRAP CONTROL: every negation-closed
    arm under the unreduced convention, Delta_unred - Delta_red = B^3/(4M)
    within 0.1. DECAY PARAMETER: q in {0, 0.25, 0.5, 0.75, 1} fraction of
    the Z/N interval base replaced by random elements; Delta must fall
    monotonically to the random band and equal it at q = 1; a Delta flat in
    q is the artifact tell. ORDERING CONTROL: the forced-value table (M,
    M_red, B^3/(4M), Z/N interval E_3, M_2, analytic null SD per predicate
    cell) is written and hashed before any curve arm is enumerated, and the
    null arms' verdicts are recorded before the object arms are read.

