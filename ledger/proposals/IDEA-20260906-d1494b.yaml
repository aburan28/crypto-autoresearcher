      STAGE 0 (zero compute, HARD GATE): re-derive INV-2, 2', 2'', 3, 3'',
      9 symbolically; compute and hash the forced-value table per rung and
      convention (M, M_red, B^3/(4M), the Z/N interval E_3 by integer
      enumeration, M_2, the analytic null SD per predicate cell). STAGE 1
      (seconds): Z/N arms in integer arithmetic (interval, random,
      Bose-Chowla, q-decay ladder); mirror each on E by exponentiation and
      require bit-identical count vectors. STAGE 2 (minutes; numpy or C):
      for N in {2^14, 2^16, 2^18, 2^20}, at least 3 prime-order curves per
      rung from harness/toycurve.py, B_1 = ceil((6N)^{1/3}) rounded up to
      even and B_2 = largest prime power q with 3(q^3 - 1) < N, both sign
      conventions on negation-closed arms: enumerate all multisets, hash
      sums, verify INV-1 and INV-2, report E_3, Delta, k-rich counts,
      histogram; 100 random-class-set and 100 random-point bases per (N, B)
      for the bands. STAGE 3 (seconds per curve): one full log table by
      enumerating [k]P, FFT of each base's log-set indicator, spectral sixth
      moment and max, cross-check against E_3^{ord}. STAGE 4 (zero compute):
      pushforward cell totals for the frozen predicate family, z-scores
      against the analytic null (NULL-B) or the Monte Carlo band (NULL-A),
      Holm correction within each (arm, rung) family, growth fit across
      rungs, pre-registered tolerances applied. Optional STAGE 5: extend the
      growth arm to 2^22 and 2^24 (M about 4e6 and 1.7e7, still cheap) if
      M6 is underpowered. CHEAPEST VALID DISCRIMINATOR: Stage 0 plus Stage 2
      at N about 2^14 on one curve, x-interval reduced against the
      random-class band, with the Z/N interval and Bose-Chowla forced values
      checked in the same run; it costs minutes and decides whether any
      visible excess exists at the smallest rung, and if the positive control
      fails nothing else is worth running.
    controls:
      - NULL-A random x-classes (negation-closed), reduced and unreduced, 100 draws per (N, B) -- blocking band for every negation-closed arm.
      - NULL-B random points on E and random subset of Z/N, 100 draws -- must agree in distribution and satisfy the analytic INV-3 null on every predicate cell.
      - POSITIVE CONTROL Z/N interval = E small-multiples, Delta >= 0.05 B^2, with the q-decay ladder -- blocking.
      - MINIMUM-ENERGY CONTROL Bose-Chowla B_3 at B_2, E_3 = M_2 exactly -- forced value.
      - TRAP CONTROL unreduced convention on every negation-closed arm, Delta gap B^3/(4M) -- forced value.
      - LOG-WINDOW ANCHOR (unrealizable, density 1/8) on the Z/N interval arm -- sensitivity check for the pushforward instrument.
      - NEARBY-OBJECT ARITHMETIC CHECK, every log-defined arm computed twice (integers in Z/N; points on E) and required to agree exactly.
      - Pareto rows on one instance per rung (rho with negation 0.886 sqrt N; BSGS sqrt N time and memory) in group operations, as controls only.
    required_metrics:
      - per cell, sum of counts against M or M_red and sum of squares against E_3, both with deviation 0
      - E_3, Delta, histogram and k-rich counts for k = 1..8, per arm, curve, rung, convention, B convention
      - NULL-A and NULL-B band (mean, SD, 100 draws) per (N, B, convention), and the measured SD against the Poisson design figure
      - Z/N interval Delta and its ratio to the random band; q-decay ladder with monotonicity verdict
      - Bose-Chowla E_3 against M_2 (exact) and Delta against 1 - mu_2
      - Delta_unreduced - Delta_reduced against B^3/(4M) per negation-closed arm
      - pushforward cell totals, z-scores, Holm-corrected verdicts, and the anchor's rho, per arm and rung
      - fitted growth slope of log(Delta excess) against log N with interval, per object arm
      - spectral sixth-moment ratio and max-spectrum ratio per base (stage 3)
      - sha256 of every base, target list, forced-value table and seed; curve parameters (p, a, b, N) per cell

  falsification_conditions:
    - F1. Any cell with sum of counts != M (or M_red) or sum of squares != enumerated E_3. Implementation fault; nothing is read from that cell.
    - F2. NULL-B mean Delta outside 3 SE of 1 - 1/N on two rungs, or Var T_S departing from sigma (1 - sigma) M beyond 3 SE on the log-window anchor. INV-2' or INV-3 is wrong as derived (or the sampler is not uniform); the record is superseded.
    - F3. Z/N interval Delta below 0.05 B^2, or the q-decay ladder not monotone, or the E small-multiples mirror disagreeing with the Z/N arm. Instrument blind or point arithmetic wrong; no negative may be reported from any arm.
    - F4. Bose-Chowla E_3 != M_2. Either the constructed set is not B_3 (the recalled construction or the lifting argument is wrong) or the enumerator is; localised by re-checking 3-sums in integers.
    - F5. Delta_unreduced - Delta_reduced differing from B^3/(4M) by more than 0.1 on a negation-closed arm. INV-2'' bookkeeping is wrong.
    - F6. The corrected INV-4 thresholds are falsified by a retrieved Kohel-Shparlinski statement of a different shape; then claim (vii) is re-stated with the retrieved bound and the record superseded.
    - F7. The Chebyshev k-rich bound N mu Delta/(k - mu)^2 violated in any cell. INV-2 is wrong (impossible if F1 passes; recorded as the consistency check it is).
    - F8. M6's competing outcome (excess positive and growing) replicated on every curve at the two largest rungs while M2 and M3 pass. INV-4c is refuted at toy scale, and the learned-predictor and symbolic-regression lanes of RQ-RELN-61638a acquire a measured target with the between-cell budget mu (Delta - Delta_null).

  confounders:
    - CONVENTION MIXING. Reduced versus unreduced changes M, E_3 and Delta by forced amounts; each cell declares one and the trap control measures the gap.
    - B ROUNDING. B_1 rounded to even for negation-closed arms and unrounded for plain arms differ by one point; M is recomputed per arm and never shared across arms with different B.
    - CURVE ORDER. N is a prime near 2^k, not 2^k; all forced values are computed from the actual N, and B_2 is chosen from the actual N.
    - X-CLASS COLLISIONS AND 2-TORSION. Prime order excludes 2-torsion; x-interval bases of B/2 classes must contain exactly B/2 distinct on-curve x values, verified before enumeration.
    - MULTIPLE COMPARISONS. Seven predicates times arms times rungs; Holm within each (arm, rung) family, pre-registered, all reported.
    - SELECTION OF THE PREDICATE FAMILY. Frozen before any run; the envelope INV-3'' bounds any predicate outside it, so a null on the family plus a bounded Delta closes the grammar-free question too, and that is the only route by which a family null is generalised.
    - LOG AVAILABILITY. Stage 3 and the anchor need logarithms, available only at toy scale; they are cross-checks and sensitivity controls, never realizable instruments, and are labelled so in every table.
    - MONTE CARLO OVER BASES. The band is from 100 draws; a fixed object base is one deterministic number per curve, so the 3-curve replication is the object arm's only spread.

  interpretation_limits:
    - Toy tier at N <= 2^20 (2^24 optional); the identities are scale-free but no measured number transfers and no crypto-scale statement is made.
    - NO ATTACK, NO EXPONENT MOVED. A bounded Delta closes a channel (with a number); an unbounded Delta would open a measurement, not an algorithm.
    - INV-4c is not proved by any outcome here; a null at four rungs supports it at toy scale only, and the provable regime remains B above p^{1/2} log p (nontrivial) and p^{3/5} (Poisson-level).
    - A Delta excess says nothing about solve cost or relation rank; it bounds only what target selection can buy.
    - The Bose-Chowla and Z/N controls are log-defined and unrealizable as factor bases (a25f11); they calibrate the instrument and nothing else.
    - No experiment, hypothesis, approval or status change is created by this record.

  heuristic_assumptions:
    - id: H1
      statement: >-
        POISSON DISPERSION OF RANDOM BASES. For D uniform of size B in a
        prime-order group, the counts c(r) behave as approximately
        independent Poisson(mu) variables to second order: E[E_m] = M +
        M(M - 1)/N (exact in the i.i.d. model, INV-2'), Var[E_m] about N
        (mu + 6 mu^2 + 4 mu^3), and max_r c(r) of order log N / log log N.
      rigorous_support: >-
        The mean is exact (INV-2'); the without-replacement correction is
        bounded by m^2 B/N (derived); the cell-total variance sigma (1 -
        sigma) M is exact in the i.i.d. model (INV-3). The heuristic content
        is only the fourth-moment figure and the maximum, imitating the
        Poisson paradigm for balls-in-bins occupancy.
      validation_plan: >-
        100 random bases per (N, B) at the four rungs; compare the measured
        SD of Delta with the design figure and the measured max c(r)
        histogram with the Poisson maximum; tail check: the largest Delta
        over draws against a 3 SD band. Sampled parameters recorded per
        cell; toy scale; no transfer assumption.
    - id: H2
      statement: >-
        THE RECALLED MIXED CHARACTER-SUM BOUND. |sum_{P in E(F_p)} chi(P)
        psi(x(P))| << p^{1/2} for chi a nontrivial character of E(F_p) and
        psi a nontrivial additive character of F_p, hence |S_D(chi)| <<
        p^{1/2} log p for x-interval bases and the thresholds of claim
        (vii).
      rigorous_support: >-
        Recalled as Kohel-Shparlinski (ANTS 2000); the statement itself was
        not read this session. Imitates the Weil bound for a character sum
        on a curve twisted by a torsor character.
      validation_plan: >-
        Retrieve and read the theorem (a stage of the paired experiment,
        zero compute). Empirically at toy scale: stage 3 FFT gives max_{chi
        != 1} |S_D(chi)| for x-interval bases at N <= 2^20 (needs the log
        table, toy only); compare with p^{1/2} log p (the bound) and with
        sqrt(B log N) (the random level, INV-4c spectral form); tail check:
        the largest spectral value over curves and rungs against both.
    - id: H3
      statement: >-
        BOSE-CHOWLA B_3 WITH REPETITION. The Bose-Chowla set of size q in
        Z/(q^3 - 1) has all 3-fold sums with repetition distinct, and its
        integer lift is B_3 in Z/N for N > 3(q^3 - 1).
      rigorous_support: >-
        Recalled construction; the lifting step is derived in-record. The
        claim is verified exhaustively by the control itself (E_3 = M_2 is
        a forced integer value), so nothing rests on the recollection.
      validation_plan: >-
        Enumerate all C(q + 2, 3) 3-multiset sums in the integers and
        check distinctness before the arm runs, at q = 17, 27, 43, 67.

  target_complexity:
    time_exponent: >-
      MEASUREMENT; NO EXPONENT CLAIMED. The battery costs O(M) group
      operations per base (about 1.1e6 at 2^20) plus one O(N) log table
      per curve for the cross-check. WHAT A SUSTAINED ENERGY EXCESS WOULD
      DO TO THE c5c614 LEDGER: by INV-3'' a lift rho ~ N^delta at density
      sigma requires Delta >= sigma mu N^{2 delta}; a bounded Delta gives
      |rho - 1| <= sqrt(Delta (1 - sigma)/(sigma mu)), and since the filter
      cost 1/sigma enters the ledger 6N/(rho B^2) + B^2 as t_gen/sigma per
      accepted target, the best net factor is a constant, so the
      relation-collection exponent stays 1/2 for every representation
      predicate. Only Delta - Delta_null growing as N^{2 delta} could move
      it to (1 - delta)/2, and that is the competing outcome M6 names.
    memory_exponent: Not applicable; O(N) words for the hash at toy scale.
    best_known: >-
      Pollard rho with negation at 0.886 sqrt N group operations and O(1)
      memory; BSGS at sqrt N time and memory; no proven prime-field
      index-calculus advantage (KN-TECH-003 as relayed by a25f11); the
      generic sumset claw of IDEA-20260829-66a876 at N^{k/(2k-1)}.
    hidden_overhead: >-
      Nothing hides in an o(1) on the identities; INV-4c's o(1) is the open
      content and is measured, not assumed. The (m!)^2 gap between
      multiset and ordered energy is a constant, stated.
    tradeoff_note: Not applicable; a reference law and a measurement, not an algorithm.

  dominated_by: >-
    AS AN ATTACK: none is mounted; rows checked on the prime-field
    frontier: (1) parallel rho with negation, 0.886 sqrt N, O(1) memory;
    (2) BSGS; (3) van Oorschot-Wiener; (4) the sumset claw of
    IDEA-20260829-66a876 at N^{k/(2k-1)}; (5) preprocessing S T^2 = N
    (IDEA-20260806-3b91c7 as relayed by 86cd30); (6) Pohlig-Hellman, MOV,
    SSSA, Weil descent all n/a on prime-order prime-field curves. Every row
    dominates the realised position trivially on time, memory and queries.
    AS A REFERENCE LAW the incumbents are a25f11 (m = 2 energy identity and
    floor), 86cd30 (m = 2 exact law), c5c614 (lift with simulated null),
    5a1ea2 (x-line envelopes) and cd7b7e (E_m estimator); none dominates
    this record on the axis 'analytic null and envelope for the cluster
    question at general m', and each dominates it on its own axis (exact
    m = 2 existence law; scaling beyond the enumeration wall).
  sota_delta: >-
    Cryptanalytic delta: 0 on time, 0 on memory, 0 on data. Reference-law
    delta: from a cluster question posed as a learning task with a simulated
    selection null to (a) an exact two-moment accounting identity, (b) a
    closed-form null with SD sqrt((1 - sigma)/(sigma M)) for every fixed
    cell, (c) an envelope |rho - 1| <= sqrt(Delta (1 - sigma)/(sigma mu))
    on every predicate at once, (d) the corrected provable boundary
    (p^{1/2} log p nontrivial, p^{3/5} Poisson-level at m = 3) placing the
    index-calculus regime in the open, (e) the corrected Sidon floor
    {mu}(1 - {mu})/mu with a second B convention that makes a true B_3
    control exist, and (f) the audit that the conic-incidence route is void
    at M of order N for k < N^{1/2}. Protocol delta: the forced values
    B^3/(4M) and 0.05 B^2 give the battery two blocking controls with
    pre-computed numbers.

  candidate_invariants:
    - id: INV-1
      statement: sum_r c_D(r) = C(B + m - 1, m) for every base D of size B, every m, every finite abelian G.
      status: proved
      proof_route: Stars-and-bars double count; KN-FIND-007 (established, toy-confirmed on 144 cells with deviation 0). Symbolic-regression recovery control.
      proves_too_much_control: None needed; holds for every base, which is the point.
      settled_by: null
    - id: INV-2
      statement: sum_r c_D(r)^2 = E_m(D), the m-fold multiset additive energy; Delta = E_m/M - mu.
      status: provable_elementary
      proof_route: Double count over ordered pairs of multisets (mechanism (1)); derived in-record, unreviewed. Exact check in every battery cell.
      proves_too_much_control: Applies to every base; the content is in which bases have E_m near M + M^2/N.
      settled_by: null
    - id: INV-2p
      statement: For D of B i.i.d. uniform elements, E[E_m] = M + M(M - 1)/N and E[Delta] = 1 - 1/N; without replacement the correction is O(m^2 B/N); for a negation-closed base of i.i.d. classes the same holds in the reduced convention with M_red = M - B^2/2 at m = 3.
      status: provable_elementary
      proof_route: Uniformity of sum n_i d_i when some n_j is a unit (mechanism (2)); support-two exception counted; derived in-record, unreviewed. The seed sketch's O(m/B) was corrected to O(m^2 B/N).
      proves_too_much_control: The unreduced negation-closed base, where coefficient-vector-zero pairs collide with probability 1 (INV-2pp).
      settled_by: null
    - id: INV-2pp
      statement: For W = -W and m = 3, c_W(Q) >= B/2 for all Q in W, E_3(W) >= B^3/4, and Delta_unreduced - Delta_reduced = B^3/(4M) + O(m/B); the forced multisets are the degenerate (gamma = 0) members of the L(4O) conic family.
      status: provable_elementary
      proof_route: Enumeration of {P, -P, Q} (mechanism (3)) and the vertical-line-pair identification (mechanism (6)); derived in-record, unreviewed; a25f11 states the count 2B^2 in class notation.
      proves_too_much_control: A plain (non-symmetric) base, where no such multisets exist and the gap is 0.
      settled_by: null
    - id: INV-3
      statement: c_{uD + t}(u r + m t) = c_D(r); for a uniformly random B-subset of G the count vector is AGL(1, N)-invariant in law; for any fixed S of density sigma, E[T_S] = sigma M and (i.i.d.) Var[T_S] = sigma (1 - sigma) M; hence rho_S has mean 1 and SD sqrt((1 - sigma)/(sigma M)).
      status: provable_elementary
      proof_route: Affine equivariance plus sharp 2-transitivity and the sum constraint (mechanism (4)); derived in-record, unreviewed. Checked by NULL-B on every predicate cell and the log-window anchor.
      proves_too_much_control: The negation-closed random base, invariant only under (Z/N)^* and negation, for which the variance formula is NOT claimed (INV-3p).
      settled_by: null
    - id: INV-3p
      statement: For a negation-closed uniformly random class-set base, E[c(s)] is constant on G minus O, and Cov(c(s), c(s')) is a function gamma(s'/s) of the ratio; closed form for gamma is open.
      status: conjecture
      proof_route: Transitivity of (Z/N)^* gives the mean; the covariance requires counting signed-class coefficient-vector coincidences per ratio class; not attempted here. Monte Carlo band used meanwhile.
      proves_too_much_control: The plain uniform base, where gamma is constant (INV-3).
      settled_by: null
    - id: INV-3pp
      statement: For every base and every S of density sigma, |rho_S - 1| <= sqrt(Delta (1 - sigma)/(sigma mu)); the between-cell variance of any partition is at most mu Delta; a lift rho ~ N^delta requires Delta >= sigma mu N^{2 delta} (1 + o(1)).
      status: provable_elementary
      proof_route: Cauchy-Schwarz over S and its complement; law of total variance (mechanism (5)); derived in-record, unreviewed.
      proves_too_much_control: The Z/N interval with the log-window anchor, where the envelope is nearly attained (rho about 8 at sigma = 1/8 with Delta of order B^2).
      settled_by: null
    - id: INV-4
      statement: E_m^{ord}(D) = (1/N) sum_chi |S_D(chi)|^{2m}; if |S_D(chi)| <= K for chi != 1 then E_m^{ord} <= B^{2m}/N + K^{2m-2} B; with K << p^{1/2} log p (recalled Kohel-Shparlinski for x-interval bases) the ceiling is nontrivial for B >> p^{1/2} log p and Poisson-level only for B >> p^{m/(2m-1)} polylog (p^{3/5} at m = 3).
      status: provable_elementary
      proof_route: Orthogonality of characters and Parseval (mechanism (8)); derived in-record, unreviewed; the input bound is RECALLED and its retrieval is a stage of the paired experiment. The seed sketch's single threshold was split into the two stated.
      proves_too_much_control: Z/N interval, whose spectrum is about B at low frequencies so no such K exists and E_3 is of order B^5, as it must be.
      settled_by: null
    - id: INV-4c
      statement: For x-interval and QR-class bases on prime-order E/F_p and B in [p^{1/3}, p^{1/2}], E_3(D) = (1 + o(1)) (M + M^2/N); spectral form (1/N) sum_{chi != 1} |S_D(chi)|^6 = (6 + o(1)) B^3.
      status: conjecture
      proof_route: Unknown; would need a sixth-moment (not max) bound on the group spectrum of an x-defined set, below the reach of the mixed character-sum bound. Measured by M6 and M9 at toy scale.
      proves_too_much_control: Z/N interval (fails by a factor of order B^2); small-multiples on E (same object).
      settled_by: null
    - id: INV-5
      statement: On prime-order E, c_D(R) at m = 3 equals the number of curves alpha x^2 + beta x + gamma y + delta = 0 through -R whose other three intersections with E lie in D with multiplicity (L(4O) = span{1, x, y, x^2}); at m = 2 the number of lines through -R meeting D twice; two distinct members of Gamma_D share at most two points of E.
      status: provable_elementary
      proof_route: Riemann-Roch l(4O) = 4 and Abel (mechanism (6)); standard; derived in-record, unreviewed.
      proves_too_much_control: Composite-order curves, where -R and the group law still work but the prime-order identities elsewhere in the record do not; run only as a nearby object if at all.
      settled_by: null
    - id: INV-5k
      statement: >-
        The k-rich target mass obeys (number of r with c_D(r) >= k) <=
        N mu Delta/(k - mu)^2 for k > mu (Chebyshev on INV-2); the recalled
        finite-field incidence bounds applied to (E(F_p), Gamma_D) at M of
        order N give nothing beyond Markov (M/k) for k < N^{1/2}, so
        incidence geometry is NOT a proof route for cluster mass in the
        index-calculus regime.
      status: provable_elementary
      proof_route: Chebyshev; the incidence audit in mechanism (6) with KN-TECH-010's form; derived in-record, unreviewed. The seed sketch's proof-route claim is withdrawn by this audit.
      proves_too_much_control: Z/N interval, with peak counts of order B^2/8 that Chebyshev must (and does) permit.
      settled_by: null
    - id: INV-6
      statement: Sigma_m(D) = Sigma_{m-1}(D) + D and m c^{(m)}(r) >= sum_{d in D} c^{(m-1)}(r - d), with equality iff no contributing multiset repeats an element; a message-passing model on translation-by-D edges computes this convolution.
      status: provable_elementary
      proof_route: Counting (d, A minus d) pairs (mechanism (7)); derived in-record, unreviewed.
      proves_too_much_control: None; it is the trivial cluster a learned model must be scored against, not a discovery.
      settled_by: null
    - id: INV-7
      statement: At m = 2 on a prime-order curve, P_V[R decomposes] = 1 - C(n - b, b)/C(n, b) with n = (N - 1)/2 and b = B/2 classes, and c(R) follows the runs distribution.
      status: provable_elementary
      proof_route: Proved in-record in IDEA-20260906-86cd30 (path graph, independent sets), unreviewed there; symbolic-regression recovery control here.
      proves_too_much_control: Even-order curves and m = 3, as 86cd30 states.
      settled_by: null
    - id: INV-8
      statement: Semi-regular reference degree d_reg = ceil((m(B - 1) + D_S)/2) for the Semaev system (ledger reference IDEA-20260808-093497, not opened this session).
      status: conjecture
      proof_route: Conditional on semi-regularity (a heuristic, not a theorem); listed only as the degree-side symbolic-regression recovery control of RQ-RELN-61638a; not about c_D and not re-derived here.
      proves_too_much_control: Systems with measured degree fall (EV-DREG series as relayed by the RQ), where the formula is known to over-predict.
      settled_by: null
    - id: INV-9
      statement: Delta(D) >= {mu}(1 - {mu})/mu for every base, with equality iff the counts differ by at most one; for mu <= 1 this is Delta >= 1 - mu with equality iff D is a B_m set; at the frozen B_1 convention mu > 1 and no B_3 set of that size exists.
      status: provable_elementary
      proof_route: Convexity of the sum of squares at fixed total (mechanism (9)); derived in-record, unreviewed; corrects the seed sketch's unconditional 'equality iff B_m'.
      proves_too_much_control: Any base at mu > 1, where the floor is strictly below 1 - mu (which is negative) and the Sidon reading is void.
      settled_by: null
    - id: INV-10
      statement: The Z/N interval base [1, B] at m = 3 has E_3 = (11/720) B^5 (1 + O(1/B)) and Delta = (11/120) B^2 - mu + O(B); its integer value is exactly computable and is the battery's positive control.
      status: provable_elementary
      proof_route: Irwin-Hall convolution (mechanism (8)); the exact value by enumeration in the integers; derived in-record, unreviewed, with the constant 11/20 recalled.
      proves_too_much_control: A random base at the same B, with Delta about 1.
      settled_by: null

