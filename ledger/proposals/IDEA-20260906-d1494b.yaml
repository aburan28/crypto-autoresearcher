idea:
  id: IDEA-20260906-d1494b
  question_id: RQ-RELN-61638a
  goal_id: null
  goal_id_note: >-
    Not bound to a GOAL record. GOAL-RELN-001 (factor-base decomposition
    probability audit) is the natural host; binding is a Coordinator
    ledger-archive act, not performed by this record.
  added: '2026-09-06'
  title: >-
    THE POINT-RELATION HYPERGRAPH AND THE SECOND-MOMENT IDENTITY: 'clusters
    of easier decompositions' -- targets with anomalously many factor-base
    decompositions, the thing a graph neural network over the point-relation
    incidence structure would be trained to find -- is EXACTLY
    over-dispersion of the decomposition-count vector, over-dispersion is
    EXACTLY excess m-fold multiset additive energy of the base
    (sum_r c_D(r)^2 = E_m(D)), the random-base value is Poisson, the
    exchangeable null gives every representation-decidable lift a closed-form
    mean 1 and SD sqrt((1 - sigma)/(sigma M)), the dispersion index is a
    Cauchy-Schwarz envelope on EVERY predicate lift at once, the provable
    no-cluster regime via character sums begins at B of order p^{3/5} at
    m = 3 (far above the index-calculus B of order p^{1/3}, so the
    index-calculus regime is genuinely open), and the exact-enumeration
    battery that measures the one open number is cheap
  class: mechanism

  claim: >-
    SETTING. G a cyclic group of prime order N: either E(F_p) of prime order
    or the abstract Z/N as control. D a subset of G of B DISTINCT POINTS
    (for the program's x-class bases D = W = V union -V with |W| = B and
    V of B/2 x-classes; B is always the number of searched points, so the
    conservation total is the same formula for every arm). For m >= 1 and
    r in G, c_D(r) = number of size-m multisets from D summing to r.
    M = C(B + m - 1, m), mu = M/N. Index-calculus size at m = 3 is
    B = ceil((6N)^{1/3}), so M is about N and mu is about 1 (slightly above:
    mu = 1.196, 1.073, 1.071, 1.039 at the four rungs of the battery
    below). The point-relation hypergraph H_D has vertex set G union D and
    one hyperedge (a_1, ..., a_m ; r) per decomposition; c_D(r) is the
    degree of the target vertex r in H_D. 'Clusters of easier
    decompositions' means: the degree sequence (c_D(r))_r is over-dispersed
    AND the over-dispersion is explained by a partition of G decidable from
    the representation x(r).

    THE CLAIM, IN SEVEN IDENTITIES, ALL DERIVED IN-RECORD AND UNREVIEWED
    (the mechanism section carries each derivation and marks two places
    where the orchestrator's seed sketch was corrected).

    (i) INV-2, THE SECOND-MOMENT IDENTITY (elementary). sum_r c_D(r)^2 =
    E_m(D) := #{ordered pairs (A, A') of size-m multisets from D with
    sum A = sum A'}, the m-fold MULTISET additive energy of D. Hence
    Var_r[c_D] = E_m/N - mu^2 and the DISPERSION INDEX Delta(D) :=
    Var/mean = E_m/M - mu. Over-dispersion of the count vector IS excess
    additive energy of the base; the cluster question is an additive-energy
    question and nothing else. Together with INV-1 (KN-FIND-007,
    sum_r c_D(r) = M) the first two moments of the count vector are
    accounting identities checkable exactly in every cell.

    (ii) INV-2', THE RANDOM-BASE VALUE IS POISSON (elementary). For D of B
    i.i.d. uniform elements of G, every pair A != A' collides with
    probability exactly 1/N, so E[E_m] = M + M(M - 1)/N and
    E[Delta] = 1 - 1/N. Sampling B distinct elements without replacement
    changes E[Delta] by O(m^2 B/N) absolute -- NOT the O(m/B) of the seed
    sketch, which was a loose overestimate -- because the only pairs whose
    collision probability is not 1/N (1 + O(m^2/N)) are those whose
    difference vector has support two, and there are at most m^2 B M of
    them. In the reduced convention (no {P, -P} pair inside a multiset)
    the same statement holds VERBATIM for a negation-closed base of B/2
    i.i.d. uniform x-classes, with M replaced by M_red = M - B^2/2 at
    m = 3, because in that convention distinct multisets have distinct
    signed-class multiplicity vectors.

    (iii) INV-2'', THE NEGATION-FORCED TRIVIAL CLUSTER (elementary). If
    W = -W and m = 3, every Q in W receives the B/2 multisets {P, -P, Q},
    so c_W(Q) >= B/2 on the B points of W and E_3(W) >= B^3/4. Against the
    random excess M^2/N (about B^6/(36 N)) this forced term dominates
    whenever B^3 < 9N, i.e. throughout the index-calculus range. Under the
    unreduced convention the BASE ITSELF is a provable cluster of easy
    targets -- a positive control and a trap -- and Delta_unreduced -
    Delta_reduced = B^3/(4M) + O(m/B) = 1.411, 1.441, 1.463, 1.476 at the
    four rungs. Geometrically (see (v)) these are exactly the DEGENERATE
    conics of the L(4O) family (pairs of vertical lines).

    (iv) INV-3, EXCHANGEABILITY GIVES THE SELECTION NULL ANALYTICALLY
    (elementary). For any base D and affine map phi(r) = u r + t (u a
    unit), c_{phi(D)}(u r + m t) = c_D(r). A uniformly random B-subset of
    G is affine-invariant in law, so the random count VECTOR is invariant
    under AGL(1, N) acting on indices; AGL(1, N) is sharply 2-transitive,
    so E[c(s)] = mu for every s and Cov(c(s), c(s')) takes one value
    gamma for all s != s'; the constraint sum_s c(s) = M forces
    gamma = -Var(c(s))/(N - 1). Hence for ANY fixed subset S of G of
    density sigma (decidable from x(r), from log(r), or from anything
    else), the cell total T_S has E[T_S] = sigma M exactly and, in the
    i.i.d. model, Var[T_S] = sigma (1 - sigma) M EXACTLY -- the binomial
    value. The yield lift rho_S = T_S/(sigma M) of IDEA-20260830-c5c614
    therefore has the closed-form null (mean 1, SD sqrt((1 - sigma)/
    (sigma M))) with no random-partition simulation needed. Clusters in the
    log coordinate cannot exist for a random base; any cluster is a
    property of the specific log-set log(D) up to affine maps, and the
    representation enters only through which log-set an x-defined base
    produces. CAVEAT FOUND IN RE-DERIVATION: full affine invariance holds
    for uniform subsets of G; a negation-closed random base is invariant
    only under (Z/N)^* and negation, so for W-type nulls the MEAN of every
    cell avoiding O is still exact (transitivity on G minus O) but the
    covariance depends on the ratio s'/s and the cell variance is taken
    from Monte Carlo over random class-sets, not from the formula.

    (iv') INV-3'', THE DISPERSION INDEX IS AN ENVELOPE ON EVERY LIFT
    (Cauchy-Schwarz). For any base and any S of density sigma,
    |rho_S - 1| <= sqrt(Delta (1 - sigma)/(sigma mu)). A lift rho ~ N^delta
    at density sigma therefore REQUIRES Delta >= sigma mu N^{2 delta}
    (1 + o(1)): an exponent-relevant lift for any predicate, learned or
    frozen, is impossible without an energy excess growing as a power of
    N, and a measured bounded Delta closes the whole grammar of
    representation-decidable predicates at once. Law of total variance:
    the between-cell variance of ANY partition is at most mu Delta, so
    mu (Delta - Delta_random) is the entire budget a predictor can draw on
    above chance.

    (v) INV-5, THE RIEMANN-ROCH CONIC-INCIDENCE READING (standard). On E
    of prime order, L(4O) = span{1, x, y, x^2} (Riemann-Roch, l(4O) = 4)
    and P_1 + P_2 + P_3 + P_4 = O iff the four points are cut out on E, with
    multiplicity, by a curve alpha x^2 + beta x + gamma y + delta = 0.
    Hence at m = 3, c_D(R) = number of curves of the family Gamma_D =
    {gamma_A : A a 3-multiset of D} (gamma_A the unique L(4O)-curve
    through A, whose fourth intersection is -sum A) passing through -R;
    at m = 2 it is the number of lines through -R meeting D twice, which
    is the path of IDEA-20260906-86cd30 in incidence form. The forced
    cluster (iii) is exactly the sub-family gamma = 0 (pairs of vertical
    lines, {P, -P, Q, -Q}). CORRECTION OF THE SEED SKETCH: this reading is
    NOT a viable proof route for k-rich target bounds in the
    index-calculus regime. With |Gamma_D| = M of order N curves and N
    points, the recalled finite-field incidence bounds (KN-TECH-010 form
    I << m^{2/3} n^{2/3} + m + n; Stevens-de Zeeuw as recalled,
    m^{11/15} n^{11/15}) give #{k-rich} << N^2/k^3 or N^{11/4}/k^{15/4},
    which is below the Markov bound M/k from INV-1 only for k > N^{1/2}
    (resp. k > N^{7/11}), while the random model puts the maximum count at
    about log N / log log N. The k-rich bound that actually works is
    Chebyshev on INV-2: #{r : c_D(r) >= k} <= N mu Delta/(k - mu)^2 for
    k > mu, so bounding Delta (INV-4c) bounds every cluster mass. The
    conic reading survives as the natural hyperedge feature set for a
    learned model (coefficients (alpha : beta : gamma : delta)) and as the
    identification of the trivial cluster.

    (vi) INV-6, THE TRANSLATION PARTIAL ACTION (trivial). Sigma_m(D) =
    Sigma_{m-1}(D) + D, and on counts m c^{(m)}(r) >= sum_{d in D}
    c^{(m-1)}(r - d) with equality iff no contributing multiset repeats an
    element; so the arity-m count vector is, up to repeated-element
    multisets, (1/m) times the D-convolution of the arity-(m-1) vector. A
    message-passing network given translation-by-D edges computes that
    convolution; it learns a theorem, not a discovery, and must not be
    credited for it. The discovery question is correlation at FIXED m
    along cheap x-neighbourhoods, which is INV-4c.

    (vii) INV-4, THE FOURIER FORM AND THE CHARACTER-SUM CEILING (identity
    elementary; ceiling conditional on a RECALLED bound; conjecture
    named). With ordered tuples, E_m^{ord}(D) = (1/N) sum_chi
    |S_D(chi)|^{2m}, S_D(chi) = sum_{P in D} chi(P) over the N characters
    of G; the trivial character contributes B^{2m}/N; E_m <= E_m^{ord} <=
    (m!)^2 E_m. If |S_D(chi)| <= K for all chi != 1 then, by Parseval,
    E_m^{ord} <= B^{2m}/N + K^{2m-2} B. For x-INTERVAL bases, completing
    the interval indicator by additive characters of F_p and using the
    RECALLED Kohel-Shparlinski bound |sum_{P in E(F_p)} chi(P) psi(x(P))|
    << p^{1/2} gives K << p^{1/2} log p. CORRECTED THRESHOLDS (the seed
    sketch conflated two): the ceiling beats the trivial bound
    E_m^{ord} <= B^{2m-1} as soon as B >> p^{1/2} log p, for every m; it
    reaches the RANDOM (Poisson) order B^{2m}/N only when B >>
    p^{m/(2m-1)} polylog, i.e. p^{3/5} at m = 3. Both thresholds sit far
    above the index-calculus B of order p^{1/3}, so the no-cluster
    statement is provable only where index calculus is pointless, and the
    index-calculus regime is genuinely open. The max-times-Parseval route
    can never certify (1 + o(1)); the sharp form of the conjecture is
    spectral: CONJECTURE INV-4c. For x-interval (and quadratic-residue
    class) bases on prime-order E/F_p and B in [p^{1/3}, p^{1/2}],
    E_3(D) = (1 + o(1)) (M + M^2/N), equivalently (1/N) sum_{chi != 1}
    |S_D(chi)|^6 = (6 + o(1)) B^3, the complex-Gaussian sixth moment.
    PROVES-TOO-MUCH CONTROL: Z/N with the interval base [1, B] (which is
    the SAME count vector as the small-multiples base {[i]P} on E) has
    |S(chi_a)| about B for |a| <= N/B and E_3 = (11/720) B^5 (1 + O(1/B)),
    Delta about (11/120) B^2, i.e. 211, 502, 1277, 3172 at the four rungs
    against a random value of 1; any instrument that does not see that is
    blind.

    (viii) INV-9, THE SIDON MINIMUM (elementary, corrected). The minimum of
    sum_r c(r)^2 at fixed total M over N bins is attained when the counts
    differ by at most one, giving Delta >= {mu}(1 - {mu})/mu with {mu} the
    fractional part; for mu <= 1 this is Delta >= 1 - mu with equality iff
    D is a B_m set (all m-fold multiset sums distinct; Bose-Chowla attains
    it). CORRECTION: at the frozen convention B = ceil((6N)^{1/3}) we have
    mu > 1 (1.196 at 2^14), a B_3 set of that size cannot exist by
    pigeonhole, and the floor is {mu}(1 - {mu})/mu (0.14 at 2^14). The
    minimum-energy control therefore needs a SECOND B convention, B_2 =
    the largest prime power q with 3(q^3 - 1) < N (17, 27, 43, 67 at the
    four rungs; mu_2 = 0.059, 0.056, 0.054, 0.050), at which a lifted
    Bose-Chowla set is a B_3 set in Z/N and E_3 = M_2 EXACTLY.

    WHAT THE CLAIM CHANGES. The user's cluster question is not an open
    modelling problem; it is the question 'does Delta(D_N) - Delta_random
    (N) stay bounded or grow with N for x-line-defined bases at
    index-calculus size', which INV-1/INV-2 make an exact accounting
    quantity, INV-3 gives a closed-form null, INV-3'' makes an envelope on
    every predicate and every learned model, INV-4 places outside the
    provable regime, and the battery below measures directly at four
    rungs with a positive control that must show a factor above 100 and a
    minimum-energy control that must sit at an exact forced value.

  mechanism: >-
    DERIVED IN-RECORD; UNREVIEWED. Each item is elementary and checkable
    by hand; the orchestrator's seed sketch (session working notes, not a
    record) was re-derived and corrected where marked.

    (1) INV-2. sum_r c(r)^2 = sum_r sum_{A : sum A = r} sum_{A' : sum A' =
    r} 1 = #{(A, A') : sum A = sum A'} = E_m(D). Diagonal pairs A = A'
    contribute M, so E_m >= M and Delta = E_m/M - mu >= 1 - mu.

    (2) INV-2', i.i.d. model. For A != A' write sum A - sum A' = sum_i
    n_i d_i with n_i = mult_A(d_i) - mult_{A'}(d_i); some n_j != 0 and
    |n_j| <= m < N so n_j is a unit mod N; conditioning on the other d's,
    n_j d_j is uniform on G, so the difference is uniform and vanishes
    with probability exactly 1/N. E[E_m] = M + M(M - 1)/N, E[Delta] =
    1 + (M - 1)/N - M/N = 1 - 1/N. Without replacement: sum_i n_i = 0,
    so support one is impossible and support two forces n_1 = -n_2 and
    n_1(d_1 - d_2) = 0, impossible for distinct d's -- collision
    probability exactly 0 for those pairs; for support >= 3 an
    inclusion-exclusion over coincidences gives 1/N (1 + O(m^2/N)). The
    support-two pairs number at most m^2 B M (choose A, the element x and
    how many copies to move, the replacement y), so the correction to
    E[Delta] is at most m^2 B/N. Negation-closed reduced case: writing
    each multiset by its signed class vector (mult of P_i minus mult of
    -P_i), the reduced convention forbids both signs of one class in a
    multiset, so the signed vector determines the multiset; distinct
    multisets have a nonzero difference vector with entries of modulus
    at most 2m, and the i.i.d.-class argument goes through with M_red.
    M_red at m = 3 with b = B/2 classes: 8 C(b,3) + 4 b(b - 1) + 2b =
    C(2b + 2, 3) - 2b^2 (checked at b = 2: 12 = 20 - 8; b = 3: 38 =
    56 - 18).

    (3) INV-2''. The multisets {P, -P, Q} number (B/2) B = B^2/2 and land
    only on W, B/2 per point; sum_{Q in W} c(Q)^2 >= B (B/2)^2 = B^3/4.
    Writing c_unred = c_red + (B/2) 1_W gives sum c_unred^2 = sum c_red^2
    + B sum_{Q in W} c_red(Q) + B^3/4, and with sum_{W} c_red about
    B mu the difference of dispersion indices is B^3/(4M) + O(mu B^2/M)
    = B^3/(4M) + O(m/B). Numerics at even B = 48, 74, 118, 186 with
    M = C(B + 2, 3) = 19600, 70300, 280840, 1089836: 1.411, 1.441, 1.463,
    1.476.

    (4) INV-3. For A a multiset from D, sum_{a in A} (u a + t) = u sum A +
    m t, so c_{uD + t}(u r + m t) = c_D(r); as m is a unit mod N, the
    index maps psi(s) = u^{-1}(s - m t) exhaust AGL(1, N). If D is a
    uniform B-subset so is uD + t, hence the law of the vector
    (c_D(s))_s is AGL(1, N)-invariant. Sharp 2-transitivity gives one
    diagonal value v = Var c(s) and one off-diagonal gamma; 0 =
    Var(sum_s c(s)) = N v + N(N - 1) gamma. Var T_S = |S| v + |S|(|S| -
    1) gamma = |S| v (N - |S|)/(N - 1). By transitivity v = E[E_m]/N -
    mu^2 = mu (1 - 1/N) in the i.i.d. model, whence Var T_S = |S| mu
    (N - |S|)/N = sigma (1 - sigma) M. The binomial form is the sanity
    check: M balls thrown into N bins, count those landing in S. For the
    negation-closed null only r -> u r and r -> -r preserve the law, so
    only the mean is forced.

    (5) INV-3''. rho_S - 1 = (1/(|S| mu)) sum_{s in S} (c(s) - mu). Split
    the total sum of squares over S and its complement: sum_G (c - mu)^2
    >= (sum_S)^2 (1/|S| + 1/|S^c|), so (sum_S (c - mu))^2 <= N mu Delta
    |S| |S^c|/N, and |rho_S - 1| <= sqrt(Delta (1 - sigma)/(sigma mu)).
    Between-cell variance <= total variance is the law of total variance.

    (6) INV-5. Riemann-Roch on a genus-1 curve gives l(4O) = 4 with basis
    1, x, y, x^2 (pole orders 0, 2, 3, 4). A divisor (P_1) + ... + (P_4)
    - 4(O) is principal iff sum P_i = O (Abel), iff it is div(f) for some
    f in L(4O), iff the P_i are the intersection of E with alpha x^2 +
    beta x + gamma y + delta = 0. Given a 3-multiset A, l(4O - A) = 1
    (degree 1), so gamma_A is unique and its fourth point is -sum A; two
    distinct members of Gamma_D share at most two points of E (a common
    divisor of degree 3 would force proportionality). Degenerate members:
    gamma = 0 gives alpha x^2 + beta x + delta = 0, two vertical lines,
    points {P, -P, Q, -Q}, which is the forced cluster; alpha = 0 gives a
    line, i.e. P_4 = O, the m = 2 case. Incidence-route audit as in claim
    (v): with |P_k| k-rich points and M curves, k |P_k| <= I(P_k, Gamma_D)
    << |P_k|^{2/3} M^{2/3} + |P_k| + M gives |P_k| << N^2/k^3, weaker than
    INV-1's |P_k| <= M/k unless k > N^{1/2}. Chebyshev: |P_k| (k - mu)^2
    <= sum_r (c(r) - mu)^2 = N mu Delta.

    (7) INV-6. sum_{d in D} c^{(m-1)}(r - d) counts pairs (d, A minus one
    copy of d) and hence each m-multiset A with sum r once per DISTINCT
    element, which is at most m times.

    (8) INV-4. E_m^{ord} = #{(a, b) in D^m x D^m : sum a = sum b} =
    (1/N) sum_chi sum_{a, b} chi(sum a - sum b) = (1/N) sum_chi
    |S_D(chi)|^{2m}. Trivial term B^{2m}/N. sum_chi |S_D(chi)|^2 = N B, so
    sum_{chi != 1} |S|^{2m} <= K^{2m - 2} (N B - B^2). Thresholds: the
    second term K^{2m-2} B with K = p^{1/2} log p is below B^{2m-1} iff
    B > p^{1/2} log p, and below B^{2m}/N (N about p) iff B^{2m-1} >
    p^{m} log^{2m-2} p, i.e. B > p^{m/(2m-1)} up to logs -- p^{3/5} at
    m = 3 -- which is the correction of the seed sketch's single threshold.
    Multiset versus ordered: every multiset carries at least one and at
    most m! ordered tuples, so E_m <= E_m^{ord} <= (m!)^2 E_m; for the
    bulk (all elements distinct) the ratio is exactly (m!)^2. Interval
    control in Z/N: r_3(s) = #{(a, b, c) in [1, B]^3 : a + b + c = s} is
    about B^2 f_3(s/B) with f_3 the Irwin-Hall density, so E_3^{ord} =
    sum_s r_3(s)^2 is about B^5 integral f_3^2 = B^5 f_6(3) = (11/20) B^5
    (RECALLED central value of the Irwin-Hall n = 6 density) and E_3 is
    about (11/720) B^5, Delta about (11/120) B^2 - mu. The spectral form of
    INV-4c: for a random-like spectrum |S(chi)|^2 has mean B and
    exponential-like law, so (1/N) sum_{chi != 1} |S|^6 is about 3! B^3 =
    6 B^3, matching the m! B^m diagonal count of E_m^{ord}; INV-4c says
    x-interval bases have this sixth moment.

    (9) INV-9. Minimising sum c^2 subject to sum c = M = qN + rho over N
    bins gives N q^2 + rho (2q + 1); subtracting N mu^2 yields
    Var_min = (rho/N)(1 - rho/N) = {mu}(1 - {mu}), Delta_min = {mu}(1 -
    {mu})/mu, which equals 1 - mu exactly when q = 0. A Bose-Chowla B_3
    set of size q in Z/(q^3 - 1), lifted to integers in [0, q^3 - 2), has
    distinct integer 3-sums in [0, 3(q^3 - 2)], so it is a B_3 set in Z/N
    for N > 3(q^3 - 1).

    THE MECHANISM FOR A CLUSTER, STATED AS A CAUSAL ROUTE. An x-interval
    base is a structured box in the x-line; its m-fold sumset is the
    pushforward of that box through the algebraic correspondence S_{m+1}
    = 0 (IDEA-20260830-c5c614's argument). If the pushforward is biased
    with respect to any cheap x-predicate, the count vector is
    over-dispersed and the excess is between-cell variance for that
    predicate; if the group spectrum of the base is square-root flat
    (INV-4c), the pushforward is unbiased with respect to EVERY subset of
    G at once by INV-3''. The two outcomes differ in a single measured
    number, Delta(D_N) - Delta_random(N), and in whether it grows with N.

  novelty_status: unverified

