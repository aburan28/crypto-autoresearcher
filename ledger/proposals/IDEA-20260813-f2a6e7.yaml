idea:
  id: IDEA-20260813-f2a6e7
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-UOV-001
  goal_id: GOAL-UOV-001
  title: Certificate-labelled syzygy fingerprints for attack-system equivalence
  class: measurement
  claim: >-
    On preregistered toy plain-UOV instances, a certificate-labelled truncated
    syzygy module through degree D separates three explanations: systems related
    by an explicit coordinate/module transformation, systems sharing only the
    planted oil-space component, and unrelated same-shape systems. The proposal
    is falsified if the exact null and planted positive controls have
    indistinguishable fingerprints at every feasible D or if known-equivalent
    copies disagree after canonicalization.
  mechanism: >-
    Attach verifier-derived labels to generators that vanish on the planted
    oil-space certificate, compute minimal graded first and second syzygies, and
    canonicalize their degree/rank/Fitting-ideal data under allowed basis changes.
    A true formulation transform must transport labelled relations; a coincident
    root or equal Hilbert series need not. The fingerprint is a diagnostic, not a
    recovery algorithm and not a claim that correlation causes an attack.
  why_not_a_renamed_known_approach: >-
    IDEA-20260808-ec2128 studies a multihomogeneous intersection Hilbert series;
    this proposal measures certificate-labelled module relations across three
    same-instance formulations and includes collision controls. IDEA-20260805-ca92fd
    provides an intersection planted-solution null but not a cross-formulation
    syzygy invariant. The direct semantic-query sibling hits are disclosed but
    not imported into plain UOV.
  predictions:
    - observable: Canonical labelled Betti vector through degree D
      metric: Exact equality after the known positive-control coordinate transform and pairwise distance among attack formulations
      predicted: Positive copies agree exactly; same-instance formulations agree only if their relation modules are genuinely transported
    - observable: Certificate-annihilator Fitting ideals
      metric: Equality after pullback plus codimension of disagreement locus
      predicted: Semantic equivalence yields equal pulled-back ideals on the declared open set; a shared root alone does not
    - observable: Null-collision rate
      metric: Fraction of independently scrambled same-shape systems matching the full fingerprint
      predicted: Strictly below the match rate for planted positive controls at preregistered D; otherwise the diagnostic is non-discriminating
  minimal_test:
    parameter_slice: Two exhaustive tiny-field strata and one slightly larger sampled toy stratum, all using the same planted oil-space convention.
    procedure:
      - Reproduce each baseline system from one instance and mark certificate-vanishing generators without using solver outcomes.
      - Compute minimal labelled syzygies degree by degree up to a preregistered D or a memory stop.
      - Canonicalize under allowed row, variable, and oil-basis transformations and compare exact invariants.
      - Run the identical pipeline on exact-null and planted-positive ensembles and report collision intervals.
    discriminating_outcomes:
      - Exact agreement only for positive copies indicates the fingerprint is sound but the three formulations are not related at the measured module level.
      - Same-instance agreement above null while explicit maps remain absent supports a candidate hidden transform, not equivalence by itself.
      - Agreement that persists for the exact null shows a shape artifact and falsifies usefulness at that D.
  controls:
    - Exact null: replace the coefficient tensors in one formulation by uniformly sampled tensors with identical field, dimensions, multidegrees, generator counts, and one independently planted root; run the same labelling and canonicalization.
    - Planted positive: apply a sampled invertible variable transform and generator-row transform to one baseline system while transporting the exact oil-space certificate; the canonical fingerprint must be identical.
    - Label-ablation control: randomly permute certificate labels while holding the polynomial system fixed to measure how much discrimination comes from labels alone.
    - Nearby object: a random public quadratic map conditioned on the same planted oil-space dimension but not generated by UOV key generation.
  confounders:
    - Nonminimal resolutions or monomial-order dependence can create spurious differences.
    - Truncation at D can miss the first discriminating relation.
    - Certificate labels may leak a trivial identifier rather than capture semantic structure.
    - Small-characteristic cancellations can inflate collisions at toy fields.
  falsification_conditions:
    - Known-equivalent positive copies yield different canonical fingerprints.
    - Null and positive collision rates overlap within preregistered uncertainty at every feasible D.
    - Removing certificate labels leaves unchanged discrimination, showing the advertised certificate mechanism is unnecessary.
    - Results change under allowed basis transformations after canonicalization.
  interpretation_limits:
    - Fingerprint agreement is necessary evidence for the proposed transform class, not proof of isomorphism.
    - Fingerprint disagreement closes only the measured degree and transformation class.
    - No solving-degree, recovery-time, or Round-3 security conclusion follows.
    - The work is plain-UOV-only and does not duplicate descendant-scheme analysis.
  assumptions:
    - Primary definitions determine the permitted coordinate and module transformations.
    - A basis-invariant certificate labelling can be computed without solver-selected information.
    - Minimal graded resolutions are feasible only on bounded toy slices.
  heuristic_assumptions:
    - id: H1
      statement: Low-degree labelled syzygies expose any useful same-instance transform before infeasible degrees.
      validation: Increase D across fully solvable toy strata and plot first-discrimination degree; falsify the extrapolation if that degree grows as fast as or faster than the baseline solving degree.
    - id: H2
      statement: Exact-null collision probability decays with richer degree truncation.
      validation: Estimate collision rates at consecutive D with fixed preregistered ensembles; treat nondecay as the canonical artifact tell.
  proof_search_map:
    bottleneck: Establish which labelled module invariants are preserved by the allowed formulation transforms and bound collisions with inequivalent systems.
    baseline_embedding:
      parameter_slice: One exhaustively enumerable regular toy instance and its singular neighbor, with fixed monomial order and transformation group.
      reproduction_check: Recompute the published-definition baseline generators and verify the positive transform maps their ideals and certificates exactly before measuring syzygies.
    observation_collision:
      audit: Exhaustively enumerate tiny coefficient systems where possible and search for inequivalent ideals sharing the truncated labelled Betti and Fitting data.
      failure_response: Publish collisions, add the cheapest separating invariant, or state that the fingerprint is nonidentifying at D.
    constructive_transforms:
      - Chain-map lift induced by a variable and generator transformation
      - Certificate-label transport under oil-basis canonicalization
      - Fitting-ideal pullback for local open-set comparisons
    quantifier_order: >-
      Fix the transformation group and degree cutoff before sampling. For every
      allowed transform of every baseline instance in the toy slice, the canonical
      fingerprint must agree; only then compare independently sampled nulls.
    method_ceiling:
      statement: Finite truncated syzygy data cannot prove full ideal isomorphism and may collide for inequivalent systems.
      nearby_counterobject: An inequivalent ideal engineered to share the same truncated Betti table but differ in a higher-degree relation or certificate fibre.
    proof_obligations:
      - Invariance lemma under every allowed transformation
      - Canonicalization correctness and independence lemma
      - Explicit collision example or collision bound at truncation D
      - Link, if any, between a separating relation and certificate preservation
      - Complexity accounting for resolution construction, storage, and verification
    not_applicable_reason: null
  target_complexity:
    time_exponent: null
    memory_exponent: null
    best_known_baseline: The same-instance attack systems and their solving-degree census under the shared plain-UOV cost convention; no primary-source exponent is asserted here.
    hidden_overhead_disclosure: Minimal-resolution computation, canonicalization, Fitting-ideal comparison, null repetitions, storage of sparse matrices, and verification are charged in full.
    time_memory_tradeoff: Storing graded maps permits exact canonicalization but may dominate memory; recomputing maps lowers storage and increases time. Both modes must be benchmarked at toy scale.
