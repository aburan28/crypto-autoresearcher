idea:
  id: IDEA-20260805-c06631
  question_id: RQ-ICEX-001
  added: '2026-08-05'
  title: >-
    One-half is not the baseline exponent for most ICEX cost coordinates:
    the frozen protocol tests every coordinate's alpha against the same
    constant 1/2, while its own cited technique record puts the matched
    baseline at exponent 0 on memory, 2/3 on BSGS full cost, and 1 on rho
    area-time -- derive the per-coordinate baseline table and replace the
    constant threshold with a matched one
  class: cost-model

  claim: >-
    The ICEX protocol's advantage predicate PRED-ALPHA-EXCLUDES-HALF-TOY
    requires "primary_CI_entirely_below_1_2", and exponent_definition applies
    the SAME per-coordinate formula alpha_coord[c] = log(C_IC[c])/log(ell) to
    every coordinate in its additive and nonadditive lists. But 1/2 is the
    baseline exponent of Pollard rho in ONE coordinate only -- group operations.
    The correct comparator exponent is a FUNCTION OF THE COORDINATE, and for the
    protocol's own coordinate list it is derivable in closed form before any
    run. Pollard rho: group operations 1/2; peak memory 0 (plain, cycle-finding)
    or theta in [0, 1/2] (distinguished points with 2^theta stored); io and
    communication bytes 0 for the serial arm and theta for the parallel arm;
    cpu_time_ns 1/2 plus the unit offset. BSGS: group operations 1/2; peak
    memory 1/2; and -- this is already ESTABLISHED IN THIS CORPUS, not a new
    claim -- FULL COST 2/3, because knowledge/techniques/KN-TECH-035.md records
    that "Shanks's baby-step giant-step needs n^{1/2+o(1)} processor steps but
    has full cost n^{2/3+o(1)}". Consequently: an ICEX arm reporting alpha < 1/2
    on the memory coordinate has beaten NOTHING (rho's memory exponent is 0, so
    any alpha > 0 is a LOSS); an arm reporting alpha < 1/2 on an io or
    communication coordinate has likewise beaten nothing; and an arm reporting
    alpha in (1/2, 2/3) on the full-cost coordinate has BEATEN BSGS while the
    frozen predicate scores it a failure. The protocol's constant threshold is
    therefore wrong in BOTH directions on different coordinates of the same
    vector, and the errors are not small: on memory the threshold is off by 1/2,
    on BSGS full cost by 1/6. The deliverable is one table -- coordinate x arm
    -> baseline exponent, each entry derived and each entry carrying its
    parallelization and storage convention explicitly -- plus the replacement of
    "CI excludes 1/2" by "CI excludes the MATCHED baseline exponent for that
    coordinate, measured in the same campaign". The replacement is strictly
    cheaper than the incumbent because the matched baselines C_rho and C_bsgs
    are ALREADY mandatory outputs (CTRL-MATCHED-RHO, CTRL-MATCHED-BSGS); the
    protocol computes them and then compares against a constant instead.
    NO ATTACK IS PROPOSED AND NO EXPONENT IS MOVED. This is a threshold audit.

  object_first_candidate:
    tracked_object: >-
      The BASELINE EXPONENT VECTOR a_base[coord, arm] -- not a single number but
      a map from (cost coordinate, baseline algorithm, storage/parallelization
      convention) to a real exponent -- followed through the protocol's
      comparison step. The protocol's comparison collapses this map to the
      constant 1/2 and loses the coordinate index entirely; the tracked object
      is the information destroyed by that collapse.
    established_families_off_limits: >-
      Off-limits as the primary lens: Semaev / summation polynomials, Groebner
      and solving-degree instrumentation, factor-base geometry, descent, xedni
      and lifting, endomorphism and isogeny leverage, incidence/sum-product,
      spectral and expander framings, multi-target amortization as a mechanism.
      No cryptanalytic mechanism is proposed. The only family used is
      generic-algorithm cost accounting, and it is the object under audit.
    newness_score: >-
      Each individual entry of the table is standard and several are already in
      this corpus (KN-TECH-035 supplies BSGS full cost n^{2/3+o(1)} and the
      0.886 sqrt(n) rho convention; KN-TECH-044/050/057 are named by the angle
      brief as the AT^2 vehicles but were NOT READ this session). What is not in
      this corpus is the COMPARISON of that table against the frozen ICEX
      threshold, and the observation that the threshold is coordinate-blind
      while the vector it is applied to is explicitly multi-coordinate by the
      protocol's own OBL-NO-SCALARIZATION obligation. The protocol forbids
      scalarizing the cost vector and then scalarizes the THRESHOLD; that
      asymmetry is the finding.
    testability_score: >-
      High and almost free. Every table entry is a closed-form derivation from
      the algorithm's definition; the only measurements needed are the matched
      rho and BSGS campaigns the protocol already mandates, run at the ladder
      bit sizes in pure Python. The falsifier is direct: measure a_base per
      coordinate from the baseline campaigns and compare to the derived table.
    survival_score: >-
      The table survives to crypto scale as pure asymptotics (that is what an
      exponent is), but the MEASURED confirmation survives only to the toy
      ladder, and the record says so. The entry most likely to dissolve is the
      full-cost row, because AT^2 charging for a toy campaign on one machine is
      a modelling exercise rather than a measurement, and it is labelled one.

  mechanism: >-
    DERIVED IN THIS RECORD. Conventions are stated with each entry because the
    entry is meaningless without them -- which is itself half the point.

    SETUP. Let N = ell be the subgroup order, n = log2 ell. For an algorithm ALG
    and coordinate c, define a_base[c, ALG] as the exponent in
    C_ALG[c] = Theta(ell^{a}) under a NAMED convention. The protocol's
    additive_coordinates are cpu_time_ns, group_operations_by_declared_type,
    io_read_bytes, io_write_bytes, communication_sent_bytes,
    communication_received_bytes; its nonadditive coordinates include
    peak_memory_bytes_by_domain and retained_unique_bytes.

    ROW 1 -- POLLARD RHO, SERIAL, CYCLE-FINDING (Floyd/Brent), no negation.
      group_operations: 1/2. E[steps] = sqrt(pi ell/2) (derived in
        IDEA-20260805-c8524f from S(t) = exp(-t^2/2ell)).
      peak_memory: 0. Floyd stores O(1) group elements. THE EXPONENT IS ZERO,
        NOT ONE HALF. Any IC arm with a nonzero memory exponent is strictly
        worse than rho on this coordinate, and "alpha_memory < 1/2" records a
        LOSS as if it were a win.
      io_bytes, communication_bytes: 0 (serial, in-core).
      cpu_time_ns: 1/2 plus the unit offset log2(t_op_ns)/n analysed in
        IDEA-20260805-c8524f; the EXPONENT is 1/2, the OBSERVABLE is not.
      full cost / area-time: A = Theta(1), T = Theta(ell^{1/2}), so
        A*T = ell^{1/2} and A*T^2 = ell^{1}.
    ROW 2 -- POLLARD RHO, PARALLEL VAN OORSCHOT-WIENER, 2^theta distinguished
      points stored, 0 <= theta <= 1/2. This is the convention KN-TECH-035
      records as the program's own ("van Oorschot-Wiener parallelization
      assumed, fully charged").
      group_operations: 1/2 (total work is invariant; wall time falls).
      peak_memory: theta. A FREE PARAMETER OF THE BASELINE. The protocol's
        dominance predicate ("C_IC not coordinatewise dominated by C_rho on a
        predeclared critical set") therefore has an outcome under the analyst's
        control: choosing theta = 0 makes rho dominate any IC arm on memory;
        choosing theta = 1/2 makes it dominate almost none. The protocol
        requires the critical coordinate SET to be predeclared and does NOT
        require theta to be predeclared. That is a researcher degree of freedom
        sitting directly on the goal's verdict.
      communication_bytes: theta (distinguished points shipped to the central
        table), 0 in the serial arm.
    ROW 3 -- POLLARD RHO WITH NEGATION. group_operations exponent still 1/2;
      only the constant moves, sqrt(pi/2) -> sqrt(pi/4). The CONSTANT is what
      IDEA-20260805-c8524f shows the frozen estimator is actually reading, so
      this row and row 1 are indistinguishable to the table and NOT
      indistinguishable to the protocol's alpha. Both rows are live in this
      corpus (ledger/H-R6-001.yaml names "1.253 / 0.886 constants" together).
    ROW 4 -- BSGS, FULL BABY TABLE.
      group_operations: 1/2 (ceil(sqrt(ell)) baby + mean sqrt(ell)/2 giant).
      peak_memory: 1/2 EXACTLY. The table has sqrt(ell) entries. So on the
        memory coordinate BSGS and the 1/2 threshold coincide -- which is
        presumably where the constant came from, and it is the ONLY cell of the
        whole table where the frozen threshold is right for a reason.
      FULL COST: 2/3. THIS IS AN ESTABLISHED IN-CORPUS RESULT, quoted from
        knowledge/techniques/KN-TECH-035.md: "Shanks's baby-step giant-step
        needs n^{1/2+o(1)} processor steps but has full cost n^{2/3+o(1)},
        because the sqrt(n)-element table cannot be reached in unit time."
        Under a full-cost coordinate the frozen predicate scores an IC arm at
        alpha = 0.60 as a FAILURE against 1/2 while it in fact BEATS BSGS by
        ell^{1/15}. The protocol's own certificate contract inherits
        KN-TECH-035 by name (accounting.stage_definitions.linear_algebra cites
        it), so the contradiction is internal to the frozen artifact.
    ROW 5 -- THE THRESHOLD ITSELF. Collecting: the derived baseline exponent
      that "1/2" is standing in for is
        min over admissible baseline arms of a_base[c, arm],
      which equals 1/2 on group_operations and cpu_time, 0 on memory / io /
      communication for serial rho, theta for parallel rho, and 2/3 for BSGS
      full cost. The protocol uses one number for all of them. The error is
      -1/2 on memory (threshold too generous by half an exponent, in the
      direction that manufactures IC wins) and +1/6 on BSGS full cost
      (threshold too harsh, in the direction that would suppress a real IC win).
      BOTH DIRECTIONS OF ERROR ARE PRESENT IN THE SAME VECTOR, which is why
      neither a blanket tightening nor a blanket loosening repairs it.

    THE REPAIR, AND WHY IT IS CHEAPER THAN THE INCUMBENT. Replace
      "alpha_primary CI excludes 1/2"
    by
      "the CI of delta[c] := log(C_IC[c] / C_base[c]) / log(ell) excludes 0,
       for each coordinate c, against the SAME-CAMPAIGN matched baseline",
    where base ranges over the arms the protocol already mandates. Three
    properties, all derivable: (i) delta is UNIT-INVARIANT, because a rescaling
    lambda cancels in the ratio (this is the invariant statistic identified in
    IDEA-20260805-c8524f); (ii) delta's null value is 0 for EVERY coordinate,
    so one threshold suffices and it is correct everywhere; (iii) delta requires
    no new measurement -- C_rho and C_bsgs are already required outputs of
    CTRL-MATCHED-RHO and CTRL-MATCHED-BSGS. The incumbent computes those
    baselines and then discards them in favour of a constant.

    WHAT THE REPAIR DOES NOT FIX. delta at a single cell is still
    (a_IC - a_base) + log(A_IC/A_base)/log(ell): the constant contamination is
    reduced to a RATIO of constants but not eliminated. delta is the right
    single-cell statistic; the ladder slope of delta is the right asymptotic
    one. Saying this plainly is required, because presenting delta as an
    exponent would repeat the error being audited one level down.

  novelty_status: unverified

  literature_context:
    - >-
      coordination/goals/GOAL-ICEX-001/batches/BATCH-001/tasks/TASK-20260731-021/
      ic_exponent_protocol.yaml -- READ IN FULL THIS SESSION. Verbatim sources
      for the audited clauses: exponent_definition.per_coordinate_formula,
      advantage_predicate_toy.requires_all_of[0] "primary_CI_entirely_below_1_2",
      accounting.additive_coordinates and nonadditive_coordinates,
      accounting.stage_definitions.linear_algebra (which cites KN-TECH-008 and
      KN-TECH-035 by name), controls.CTRL-MATCHED-RHO and CTRL-MATCHED-BSGS,
      OBL-NO-SCALARIZATION.
    - >-
      knowledge/techniques/KN-TECH-035.md -- FIRST 30 LINES READ THIS SESSION,
      REMAINDER NOT READ. Quoted verbatim above for the BSGS full-cost exponent
      n^{2/3+o(1)} and for the program's "0.886*sqrt(n) group operations, van
      Oorschot-Wiener parallelization assumed, fully charged" convention. Its
      confidence field reads "established" and its source_refs name KN-LIT-094
      (Wiener), KN-LIT-012, KN-TECH-006, KN-TECH-031, KN-TECH-008.
    - >-
      KN-LIT-094 (Wiener, full-cost / area-time) -- NOT READ. RELAYED CLAIM via
      KN-TECH-035. The 2/3 exponent is used here as an in-corpus established
      record, and verifying it against the primary source is a declared stage of
      the paired experiment rather than an assumption.
    - >-
      KN-TECH-044, KN-TECH-050, KN-TECH-057 -- named by this session's angle
      brief as the corpus's AT^2 re-costing vehicles. NOT READ THIS SESSION.
      Listed so a reviewer can check whether the derived table duplicates them;
      if it does, that is a finding and the record should be superseded.
    - >-
      ledger/proposals/IDEA-20260727-003.yaml -- READ THIS SESSION. Uses
      "0.886 sqrt(N)" as the matched-rho comparator and derives an IC
      admissibility frontier from omega_LA and the yield exponent. It compares
      IC against rho's GROUP-OPERATION exponent only, on one coordinate, and
      does not raise the per-coordinate threshold question. Complementary, not
      duplicated: its frontier is an inequality between two exponents, this
      proposal is about WHICH exponent the inequality should be against.

  lossy_projection_identifiability_audit:
    projection: >-
      The full matched-baseline campaign vector C_base[coord] at the same
      fixture --> the single constant 1/2 used as the comparison threshold for
      every coordinate.
    what_is_discarded: >-
      The coordinate index, the baseline arm's identity, the storage convention
      theta, and the parallelization model. Everything that makes a baseline
      exponent a baseline exponent.
    why_genuinely_lossy: >-
      Extremely lossy: the map sends a whole vector-valued, convention-indexed
      function to one number. The fibre over "1/2" contains rho-serial on group
      ops (correct), rho-serial on memory (true value 0), BSGS on memory
      (true value 1/2, coincidentally correct), and BSGS on full cost (true
      value 2/3).
    why_compatible_with_the_operations: >-
      It is compatible in the only sense that matters to a pipeline -- 1/2 is a
      constant and constants propagate through comparisons without error. That
      is exactly why the defect is invisible in the frozen artifact.
    is_it_only_a_change_of_coordinates: >-
      NO -- and the failure checked for is the MIRROR failure, the constant-
      projection one, not the (Delta, Pi) = (x XOR y, x*y) recoverability
      failure. CHECK PERFORMED: is the projected threshold constant across the
      instances (coordinates) it is applied to, while the quantity it stands in
      for is not? ANSWER: yes -- the comparator has ZERO SPREAD across
      coordinates while the true baseline exponent ranges over
      {0, theta, 1/2, 2/3}. A comparator with zero spread against a target with
      spread 2/3 is the canonical zero-comparator-spread artifact, and it is
      diagnosable without any measurement.

  assumptions:
    - >-
      That the protocol intends alpha_coord to be compared to 1/2 on every
      coordinate, not only on primary_coordinate. TEXTUAL SUPPORT: the predicate
      names primary_CI only, so a narrow reading confines the error to whichever
      coordinate is chosen primary. THE NARROW READING DOES NOT RESCUE THE
      PROTOCOL, and this is recorded before the fact: primary_coordinate_rule's
      default pin is "total group_operations ... or cpu_time_ns", and if
      cpu_time_ns is chosen the threshold is wrong for the reason in
      IDEA-20260805-c8524f rather than this one. Under BOTH readings the
      remaining coordinates still enter the mandatory dominance check
      ("C_IC not coordinatewise dominated by C_rho on a predeclared critical
      set"), where an unstated theta decides the outcome. Stage 0 of the paired
      experiment records which reading is intended before any number is
      produced.
    - >-
      That KN-TECH-035's n^{2/3+o(1)} BSGS full cost is correct as recorded. It
      is used as an in-corpus established record; the primary source is NOT
      READ, and independent re-derivation is a declared stage rather than an
      assumption carried silently.

  proof_search_map_note: >-
    Carried by the paired hypothesis H-ICEX-4ccbaa, which covers this proposal
    together with IDEA-20260805-c8524f and IDEA-20260805-4d31bc.

  predictions:
    - metric: >-
        Measured memory exponent of the matched serial Pollard-rho control:
        slope of log2(peak resident group elements) on n over the ladder
      direction: lower
      minimum_effect: >-
        FORCED 0.000, with |a_hat| < 0.02. Derived before the run: Floyd/Brent
        cycle-finding stores a constant number of group elements. If it is not
        0, the implementation is not the algorithm the table describes and the
        table entry, not the protocol, is wrong.
    - metric: >-
        Measured memory exponent of the matched BSGS control on the same ladder
      direction: higher
      minimum_effect: >-
        FORCED 0.500 +/- 0.02. This pair (0 for rho, 1/2 for BSGS) is the
        decisive contrast: one constant threshold cannot be right for both, and
        the two measurements are trivially cheap.
    - metric: >-
        Number of coordinates in the protocol's own additive + nonadditive lists
        for which the derived baseline exponent equals 1/2 under at least one
        mandated baseline arm and its stated convention
      direction: lower
      minimum_effect: >-
        Predicted at most 3 of 11 (group_operations for rho and BSGS;
        cpu_time_ns as an exponent though not as an observable; peak_memory for
        BSGS only). Every other coordinate has a derived baseline of 0, theta,
        or 2/3. If the count comes out as 11 of 11, the audit is wrong.
    - metric: >-
        Sign and size of the threshold error per coordinate, defined as
        1/2 - a_base[c, arm], tabulated
      direction: different
      minimum_effect: >-
        At least one coordinate with error >= +0.4 (memory vs serial rho:
        exactly +0.5) AND at least one with error <= -0.15 (full cost vs BSGS:
        exactly -1/6 = -0.1667). BOTH SIGNS MUST APPEAR. A table in which all
        errors share a sign would mean the threshold is merely mis-calibrated
        rather than mis-typed, and the recommendation would change from
        "replace" to "recalibrate".
    - metric: >-
        Verdict flip count: number of (coordinate, synthetic-arm) cells in a
        pre-registered grid of arms with known exponents where
        "alpha CI excludes 1/2" and "delta CI excludes 0" disagree
      direction: higher
      minimum_effect: >-
        At least 4 of a 12-cell grid. The grid is fixed before the run: arms
        with true (group-op, memory) exponents (1/2, 0), (1/2, 1/2), (0.6, 1/3),
        (0.45, 0.45) crossed with the three coordinate families. Zero
        disagreements would mean the threshold error is inert at this ladder,
        which is a legitimate and reportable outcome.

  minimal_test:
    design: >-
      Four stages, cheapest-first, each able to terminate. STAGE 0 (zero
      compute): record the Coordinator's intended reading of the threshold's
      scope (primary coordinate only vs all coordinates) and the intended rho
      parallelization convention theta. STAGE 1 (zero compute, one page):
      derive the full table, coordinate x arm x convention, by hand; every entry
      carries its convention or is not admitted. STAGE 2 (seconds, pure Python):
      run matched serial rho, negation rho, VW-rho with 2^theta distinguished
      points for theta in {0, 1/8, 1/4, 1/2}, and BSGS on the ladder bit sizes;
      measure group operations and peak stored group elements per arm per cell;
      fit the ladder slopes and compare to the table. STAGE 3 (minutes): apply
      both decision rules (frozen threshold vs matched delta) to the synthetic
      12-cell arm grid and count verdict flips. Stage 1 alone can end the line:
      if every derived entry equals 1/2, there is no finding.
    controls:
      - >-
        NULL OBJECT (forced value pre-derived, CAN FAIL) -- the BSGS MEMORY
        COORDINATE. It is the one cell where the derived baseline exponent
        genuinely equals 1/2. FORCED: a_hat = 0.500 +/- 0.02, and the frozen
        threshold and the matched threshold must AGREE on every arm evaluated
        against it. If the two rules disagree even there, the disagreement is
        not caused by the threshold value and the account is wrong.
      - >-
        POSITIVE CONTROL / SENSITIVITY DEMONSTRATION (if it does not fire, NO
        negative may be reported) -- the SERIAL RHO MEMORY COORDINATE, whose
        forced exponent is exactly 0. The measured slope must be within 0.02 of
        0 and the two decision rules MUST disagree on a synthetic arm with
        memory exponent 0.3 (frozen rule: "excludes 1/2" -> advantage; matched
        rule: "delta = +0.3 > 0" -> loss). If the instrument cannot produce that
        disagreement on a case constructed to exhibit it, the comparison
        harness is broken and nothing may be concluded.
      - >-
        GRADED CONTROL, 4 INTERIOR POINTS, MONOTONICITY REPORTED -- the VW-rho
        theta ladder theta in {0, 1/8, 1/4, 1/2}. FORCED: measured memory
        exponent = theta, strictly increasing, and the number of synthetic IC
        arms that survive the protocol's coordinatewise-dominance check must be
        MONOTONE NON-DECREASING in theta. This localises the degree of freedom:
        it shows the verdict moving as a function of a baseline parameter the
        protocol never pins, rather than leaving "the dominance check is
        underspecified" as an assertion.
      - >-
        NEARBY-OBJECT CONTROL -- the full-cost coordinate, where the hoped-for
        conclusion ("the threshold is too generous") FAILS: there the threshold
        is too HARSH by 1/6. Any account that predicts a uniform direction of
        error is refuted by this cell, and it is included precisely because it
        cuts against the proposal's own headline.
      - >-
        ARCHIVE CHECK (zero compute). Prior measurements of baseline exponents
        per coordinate in this corpus: NOT FOUND for memory/io/communication.
        EV-ICEX-001 records that no ICEX measurement exists. KN-TECH-035
        supplies the BSGS full-cost row as an asymptotic statement, not a
        measurement. Recorded as unavailable rather than claimed as checked.
      - >-
        VERDICT-ON-THE-NULL-FIRST. Both decision rules are run and recorded on
        the matched baseline arms (where the correct verdict is "no advantage",
        by construction) before any synthetic treatment arm is scored.

  falsification_conditions:
    - >-
      Every coordinate in the protocol's lists turns out to have derived
      baseline exponent 1/2 under its stated conventions. No finding; withdraw.
    - >-
      Measured serial-rho memory exponent is not 0, or measured BSGS memory
      exponent is not 1/2. The table is wrong and must be repaired before any
      claim about the threshold.
    - >-
      All threshold errors share one sign. The recommendation changes from
      "replace the threshold" to "recalibrate it", and the record must say so.
    - >-
      The two decision rules never disagree on the pre-registered 12-cell grid.
      The threshold error is inert at this ladder; report the inertness with its
      boundary rather than the headline.
    - >-
      KN-TECH-035's n^{2/3+o(1)} BSGS full-cost figure fails independent
      re-derivation. The full-cost row is withdrawn and the finding shrinks to
      the memory/io/communication rows, which stand on their own.
    - >-
      The positive control fails: no disagreement is producible on a case
      constructed to exhibit one. NOTHING NEGATIVE MAY BE REPORTED; the result
      is an implementation defect (AGENTS.md rule 5).

  confounders:
    - >-
      CONVENTION SHOPPING. The table's entries depend on conventions (theta,
      serial vs parallel, negation on/off, what counts as a group operation).
      An auditor free to pick conventions can manufacture any error size. The
      design answers this by requiring EVERY entry to carry its convention
      explicitly, by reporting the full theta ladder rather than one value, and
      by including the full-cost row that cuts against the headline.
    - >-
      TOY FULL COST IS A MODEL, NOT A MEASUREMENT. AT^2 charging on one machine
      at 8-16 bits measures nothing about wiring cost. The full-cost row is
      labelled a derivation throughout and no measured full-cost exponent is
      claimed.
    - >-
      DOUBLE COUNTING WITH IDEA-20260805-c8524f. The two proposals share a
      hypothesis and an experiment lineage and must not be presented as
      independent corroboration of each other. They attack different objects
      (the estimator's functional form vs the comparison threshold) and either
      can be right while the other is wrong; the matched-delta repair is
      common to both and is credited once.
    - >-
      SCOPE. Nothing here consumes an SDEG, MONO, or RELN feed or assembles
      C_IC. The measured arms are generic baselines only, which is what keeps
      the package outside the ICEX measurement ban recorded in
      DEC-20260731-015 / EV-ICEX-001.

  interpretation_limits:
    - >-
      A confirming outcome establishes that ONE THRESHOLD in ONE frozen design
      artifact is coordinate-blind. It does not establish anything about index
      calculus, does not move an exponent, does not advance or close
      KN-OPEN-001, and licenses no status change to any record. Corrections, if
      warranted, are new records under new ids.
    - >-
      Toy tier and unraisable: the confirming measurements are 8-16 bit generic
      baselines. The DERIVED table is asymptotic and therefore scale-free, but a
      derivation is not evidence, and the distinction is carried on every
      citation.
    - >-
      The proposal does NOT claim the protocol's authors were careless. 1/2 is
      the correct threshold on the coordinate the lane cares most about
      (group operations) and on BSGS memory, and the protocol's insistence on
      keeping the full vector visible is what makes the defect detectable at
      all. The finding is that a correct threshold for one coordinate was
      applied to eleven.

  heuristic_assumptions:
    - id: HEUR-ICEX-T1
      statement: >-
        NONE OF THE TABLE'S ENTRIES IS DISTRIBUTIONAL. Every entry is a
        worst-case or exact-count statement about a named algorithm under a
        named convention (rho memory O(1) by inspection of Floyd; BSGS memory
        exactly ceil(sqrt(ell)) entries; VW memory exactly 2^theta). The one
        exception is the rho GROUP-OPERATION exponent, which rests on the
        birthday heuristic HEUR-ICEX-R1 carried by H-ICEX-4ccbaa and is not
        re-stated here.
      rigorous_support: >-
        Direct inspection of the algorithms' storage and step counts. No
        probabilistic model is invoked for any memory, io, or communication
        entry.
      validation_plan: >-
        Stage 2 measures peak stored group elements per arm per cell directly
        and fits the slope; a memory exponent is either 0, theta, or 1/2 and
        the measurement is unambiguous.
    - id: HEUR-ICEX-T2
      statement: >-
        The BSGS full-cost exponent is 2/3, as recorded in KN-TECH-035 with
        confidence "established".
      rigorous_support: >-
        NOT INDEPENDENTLY VERIFIED HERE. Relayed from an in-corpus technique
        record whose own source (KN-LIT-094) was not read. This is the single
        load-bearing unverified input to the full-cost row and it is isolated
        deliberately so that its failure removes one row and nothing else.
      validation_plan: >-
        Stage 1 re-derives the three-dimensional wiring argument from the
        statement of the problem, or records that it could not and marks the row
        RELAYED-UNVERIFIED in the deliverable.

  target_complexity:
    time_exponent: >-
      n/a. NO EXPONENT IS MOVED. The proposal derives the exponents that a
      comparison should already have been against; it improves no attack and
      proposes no algorithm.
    memory_exponent: >-
      n/a for any proposed algorithm. The DERIVED baseline memory exponents are
      the deliverable: 0 (serial rho), theta (VW rho), 1/2 (BSGS).
    best_known: >-
      Unchanged: Pollard rho at 0.886 sqrt(N) group operations with O(1) memory,
      BSGS at sqrt(N) operations and sqrt(N) memory (full cost N^{2/3+o(1)} per
      KN-TECH-035).
    hidden_overhead: >-
      n/a. The proposal's own cost is one page of derivation plus a few minutes
      of pure-Python baseline runs.
    tradeoff_note: >-
      The table IS a time-memory tradeoff statement: the VW theta row is exactly
      the interpolation between the low-memory and high-memory endpoints, and
      the finding is that the protocol's dominance check depends on a point on
      that curve which it never names.

  dominated_by: >-
    n/a (no result claimed). ROWS OF THE FRONTIER CHECKED so this null is not
    the unchecked kind: (i) time -- rho 0.886 sqrt(N), BSGS sqrt(N); unaffected,
    no faster algorithm proposed. (ii) memory -- rho O(1) or 2^theta, BSGS
    sqrt(N); unaffected, no lower-memory algorithm proposed. (iii) data/queries
    -- no oracle model, no queries. (iv) full cost / AT^2 -- KN-TECH-035's
    N^{2/3+o(1)} for BSGS and N for rho AT^2; unaffected, and quoted rather than
    improved. On the METHODOLOGICAL question of what a charged comparison should
    be against, the incumbent inside this corpus is the frozen constant 1/2
    itself; adjacent work is IDEA-20260802-007 (charged-unit library, one layer
    below) and IDEA-20260727-003 (an IC-vs-rho inequality on the group-operation
    coordinate only). Neither states a per-coordinate baseline table. Absence of
    a search result is not evidence one does not exist.
  sota_delta: >-
    No attack; measurement contribution only. Quantitatively the proposal claims
    a table whose entries differ from the incumbent threshold by: +0.5 on
    serial-rho memory, +0.5 - theta on VW-rho memory (i.e. +0.375 at
    theta = 1/8), +0.5 on serial-rho io and communication, 0.0 on BSGS memory
    and on group operations, and -0.1667 on BSGS full cost. The largest single
    error, +0.5, is equal to the entire quantity the goal is trying to resolve.
    No such table exists in this corpus today.

  estimated_cost:
    implementation: low
    compute: very low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.85 that the table's entries are correct as derived and that at least four
    coordinates have a baseline exponent different from 1/2. It is that high
    because the memory rows are matters of inspection rather than measurement
    (Floyd stores O(1) elements; a BSGS table has sqrt(ell) entries), and
    because the BSGS full-cost row is already an "established"-confidence
    in-corpus record rather than a new claim. It is not higher because the
    full-cost row rests on a source that was not read, because the narrow
    reading of the predicate (primary coordinate only) would shrink the finding
    substantially, and because it is possible the protocol's authors intended
    the dominance check -- not the alpha predicate -- to carry the
    per-coordinate comparison, in which case the finding becomes "the dominance
    check's critical set and theta are unpinned", which is smaller but still
    real. Probability that the SMALLEST surviving deliverable lands -- serial
    rho memory exponent 0 measured against a threshold of 1/2 -- is about 0.97.
