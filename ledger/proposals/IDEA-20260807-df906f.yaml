idea:
  id: IDEA-20260807-df906f
  question_id: RQ-TORS-8c7b79
  added: '2026-08-07'
  title: >-
    PRIME-ORDER CONGRUENCE RIGIDITY, AND THE ONE MEASUREMENT IT LEAVES OPEN:
    on a group of prime order every EXACTLY propagating projection is injective or
    constant, so no lossy tracked object exists there at all -- which forces every
    surviving L7 candidate into the probabilistic regime, and the cheapest probe of
    that regime is the propagation defect of the small-prime division-polynomial
    residue vector v(R) = (psi_ell(x(R)))_{ell <= 13}, a genuinely point-dependent,
    publicly computable, non-homomorphic torsion statistic
  class: measurement

  claim: >-
    (A) THE RIGIDITY THEOREM, WHICH IS THE ECDLP-SPECIFIC FORM OF THE
    LOSSY-PROJECTION TEST. Let G be a group of prime order N. Let S be any set and
    v: G -> S any map. Suppose v PROPAGATES, i.e. there exists F: S x S -> S with
    v(R + R') = F(v(R), v(R')) for all R, R' in G. Then v is injective or constant.
    PROOF: suppose v(R) = v(R') with R != R'. For every S' in G,
    v(R + S') = F(v(R), v(S')) = F(v(R'), v(S')) = v(R' + S'). Writing T = R + S'
    and D = R' - R != O this says v(T) = v(T + D) for all T in G. Since N is prime
    and D != O, D generates G, so v is invariant under translation by every element
    of G, hence constant. QED. No hypothesis on S or F is used -- F need not be
    associative, computable, or well-behaved.

    (B) WHY THIS IS THE LANE'S -- AND ARGUABLY THE PROGRAM'S -- CENTRAL STRUCTURAL
    FACT. docs/inventor-protocol.md section 2 demands that a tracked object be a
    genuinely LOSSY projection whose discarded part is discarded COMPATIBLY with
    the target's operations, so the retained part still propagates
    deterministically. Theorem (A) says that on a prime-order group those two
    requirements are jointly unsatisfiable: compatible-with-the-operation forces
    non-lossy or total loss. That is a direct, elementary partial answer to
    KN-OPEN-019 ("what object does each ECDLP attack family track, and is the
    enumeration closed?"): it explains why the symmetric-side taxonomy does not
    port. Differential, linear, integral and division-property objects are all
    exact lossy projections that survive one round; on a prime-order subgroup no
    such object exists. The enumeration is not closed by this -- it is REDIRECTED,
    which is the closure standard of docs/inventor-protocol.md section 4.

    (C) THE FOUR ESCAPES THE THEOREM EXPLICITLY LEAVES OPEN, STATED BEFORE ANY
    MEASUREMENT SO THAT THE MEASUREMENT CANNOT BE TUNED TO THEM.
      E1 -- PROBABILISTIC PROPAGATION. v(R+R') is determined by (v(R), v(R')) only
        with probability q over R, R'. The theorem forces q < 1 for any lossy v,
        but says NOTHING about how far below 1. Symmetric-key cryptanalysis lives
        entirely at q < 1. THIS IS THE ESCAPE THIS PROPOSAL MEASURES.
      E2 -- AUXILIARY STATE. v propagates only when supplemented by extra data
        a(R); then the real object is (v, a) and the question is whether (v, a) is
        still lossy. The elliptic-net construction (KN-TECH-009, Stange
        KN-LIT-018) is exactly this pattern and is the named prior art.
      E3 -- OBJECTS NOT ON G. E[ell] is (Z/ell)^2, NOT of prime order: it has
        ell+1 proper non-trivial subgroups and therefore genuine lossy quotients.
        Those quotients are precisely the ell-isogenies. The theorem thus predicts
        that L7's only real objects live on E[ell] rather than on G, which is why
        IDEA-20260807-053a55 and IDEA-20260807-1d9c5f are separate proposals and
        why they are curve-level.
      E4 -- OBJECTS NOT TRACKED UNDER THE GROUP LAW. Pollard rho tracks a
        collision in a walk, which is not a congruence; the theorem does not touch
        it. This is consistent with rho being the incumbent.

    (D) THE POINT-DEPENDENT, PUBLICLY COMPUTABLE TORSION DATA, NAMED EXPLICITLY AS
    THE LANE DEMANDS. For odd primes ell, the ell-th division polynomial
    psi_ell(x) in F_p[x] has degree (ell^2 - 1)/2 -- 4, 12, 24, 60, 84 for
    ell = 3, 5, 7, 11, 13 -- and its roots are exactly the x-coordinates of the
    non-zero ell-torsion points of E over F_pbar. Define, for a point R != O,
      v_L(R) = ( psi_ell(x(R)) )_{ell in L},  L = {3, 5, 7, 11, 13}.
    HOW IT IS OBTAINED WITHOUT A DISCRETE LOGARITHM: psi_ell is computed once per
    curve from the standard division-polynomial recurrence over F_p[x] (polynomial
    arithmetic of degree <= 84, seconds in sympy), and then EVALUATED at the known
    field element x(R) in (ell^2-1)/2 field multiplications by Horner. Both P and Q
    are given in the instance, so v_L(P) and v_L(Q) are computable by anyone. This
    is genuinely POINT-dependent -- it changes when R changes with E fixed -- and
    it is genuinely NON-HOMOMORPHIC, so it is precisely the complement that
    IDEA-20260807-6eab6a's coprimality theorem does not reach.
    DOES IT LEAK ANYTHING ABOUT k? The honest answer this record asserts in advance:
    almost certainly not in any usable way, and the reason is (A). Knowing v_L(Q)
    is strictly less than knowing Q, and Q is already public. The ONLY way v_L
    could help is by propagating, so that a search over k could be run in
    v_L-space instead of in G -- and (A) says exact propagation is impossible for
    any lossy v_L. So the entire question reduces to E1: HOW BADLY does v_L fail to
    propagate?

    (E) THE OBSERVABLE, AND WHY BOTH OUTCOMES ARE DELIVERABLES. Define the
    PROPAGATION DEFECT of a projection v at sample size M:
      d(v) = 1 - (expected fraction of sampled pairs (R, R') for which the value
      v(R + R') is uniquely determined by the observed pair (v(R), v(R'))),
    estimated by bucketing M sampled pairs on the key (v(R), v(R')) and measuring
    how often a bucket contains more than one distinct v(R + R') value.
      OUTCOME 1 -- d(v_L) is statistically indistinguishable from d(v_null) for a
        matched null projection of the same image size. Then the psi_ell structure
        contributes nothing beyond the SHAPE of the projection, the object is
        closed, and the closure has a named mechanism ((A) plus a measured
        defect), not a tally. This is the predicted outcome and it is a result.
      OUTCOME 2 -- d(v_L) is materially BELOW the matched null at the same image
        size. Then a genuinely lossy, better-than-random-propagating object over
        the ECDLP has been exhibited. Under (A) it still cannot reach d = 0, but
        a measured gap is a candidate answer to KN-OPEN-019 and would be the first
        one this program has. It would require independent review before any
        interpretation (AGENTS.md rule 12) and would still be nowhere near an
        attack: converting q < 1 propagation into a key recovery needs a separate
        proposal with its own cost accounting.
      There is no outcome in which the measurement means nothing.

  resource_label: R5
  admissibility: admissible
  admissibility_argument: >-
    ADMISSIBLE, and the argument is specific rather than generic. The admissibility
    filter of DECOMPOSITION.md section 2 excludes lanes whose only use of a map is
    to apply it to points of G, because End(G) = Z/N makes every such map a scalar
    (H-ENDO-001) and the resulting oracles are GGM-simulable (KN-FIND-b7e091).
    v_L applies NO group map to G. psi_ell is a polynomial over F_p whose roots are
    the x-coordinates of E[ell]; evaluating it at x(R) returns a FIELD ELEMENT that
    the generic group oracle does not provide, exactly as R1 escapes by returning
    x-coordinates as field data. Formally: a GGM simulator handed only group
    handles cannot produce psi_ell(x(R)), because it has no access to x(R) at all.
    So v_L is outside the generic model. WHAT THIS DOES NOT BUY: being outside the
    model is necessary, not sufficient. Theorem (A) is a lower-bound-free,
    model-free obstruction that applies to v_L anyway, which is why this proposal's
    honest expectation is a controlled null and why it is filed as a measurement
    rather than as an attack.

  discriminated_from:
    - >-
      KN-TECH-009 (elliptic nets and elliptic divisibility sequences) and
      RQ-NET-001 / EXP-NET-001 / H-NET-001. Those track W_n = psi_n(x(P)) as a
      function of the INDEX n at a FIXED point, and their recorded kill argument is
      that Somos identities are universal, so on a single k-fibre they yield
      tautologies. This proposal is the TRANSPOSE: fixed small index ell, varying
      POINT R. The universality argument does not apply because no index recurrence
      is used. The connection is nonetheless load-bearing and is stated rather than
      hidden: KN-TECH-009's construction is exactly escape E2 above, and this
      record predicts that the smallest psi-derived state that propagates EXACTLY
      is the full elliptic net -- which is not lossy and is therefore a change of
      coordinates, not an object, by docs/inventor-protocol.md section 2. Making
      that prediction explicit is part of the deliverable.
    - >-
      IDEA-0f5339 (division polynomial recurrence), closed in DEC-20260804-0b2f97
      on a method ceiling: deg psi_N ~ sqrt(N), giving O(sqrt(N) * sqrt(B)) against
      a target of O(sqrt(B)). That closure concerns psi at index ~ N, whose degree
      is the bottleneck. THIS proposal never uses psi at large index: ell <= 13, so
      deg psi_ell <= 84 independent of N, and the DEC-20260804-0b2f97 ceiling
      argument does not apply. Stating this is mandatory because the two records
      share the phrase "division polynomial" and nothing else.
    - >-
      IDEA-20260807-6eab6a. That record closes ell-primary HOMOMORPHIC invariants
      by coprimality. v_L is not homomorphic and is not reached by it. The two
      records partition the L7 functional space between them: homomorphic (closed
      by coprimality, value 0) and non-homomorphic (constrained by rigidity to the
      probabilistic regime, measured here).
    - >-
      KN-FIND-b7e091. Simulability closes oracles the algorithm could have computed
      itself; rigidity closes objects the group's own structure forbids. v_L is not
      simulable (see admissibility_argument) and is still constrained by rigidity,
      which shows the two obstructions are independent.

  object_first_candidate:
    tracked_object: >-
      THE DIVISION-POLYNOMIAL RESIDUE VECTOR v_L(R) = (psi_ell(x(R)))_{ell in L}
      for L = {3,5,7,11,13}, and a declared ladder of TRUNCATIONS of it:
      T0 = the full tuple of field elements (|image| ~ p^5);
      T1 = the tuple of quadratic characters (chi(psi_ell(x(R))))_{ell in L}
           (|image| <= 3^5 = 243);
      T2 = a single character chi(psi_ell(x(R))) for one ell (|image| <= 3);
      T3 = the vanishing pattern (1 if psi_ell(x(R)) = 0 else 0) (|image| <= 2^5);
      T4 = psi_ell(x(R)) mod a fixed small divisor structure of F_p^* (declared
           per run: the index-c residue class of psi_ell(x(R)) in F_p^*/(F_p^*)^c
           for c | p-1, c in {2,3}).
      The ladder is the object; the truncation index is its lossiness dial.
    lossiness: >-
      Genuinely lossy at every level from T1 down, and the amount is exactly
      quantified: T1 retains at most log2(243) ~ 7.9 bits about a point that
      carries log2(N) bits. It forgets the y-coordinate entirely (psi_ell is a
      polynomial in x for odd ell), so it is constant on {R, -R} -- a real, named
      quotient. It forgets which ell-torsion point x(R) is near, retaining only a
      product-of-differences value. T0 is NOT lossy in the relevant sense at
      |L| >= 1 with a curve of large enough degree data, and is included only as
      the top of the ladder so that the defect curve has a known endpoint.
    propagation: >-
      THIS IS THE MEASURED QUANTITY, not an assumption. The one-step operation is
      the group law: given R and R' compute R + R' and ask whether v(R + R') is a
      function of (v(R), v(R')). Theorem (A) forbids an exact functional dependence
      for any lossy level; the experiment measures the defect d at each level and
      compares it against a matched null. There IS a known partial propagation
      structure -- the classical psi_{m+n} psi_{m-n} psi_1^2 = psi_{m+1} psi_{m-1}
      psi_n^2 - psi_{n+1} psi_{n-1} psi_m^2 identity relates NEIGHBOURING INDICES
      at a fixed point, not values at added points -- and the record states
      explicitly that this identity is NOT the propagation being tested, to
      forestall the substitution.
    survival_score: >-
      Predicted to die immediately: at one group operation, at every lossy
      truncation, by (A). The measurement's job is to say by HOW MUCH, and against
      what null. If it survives one operation with a defect below the matched null,
      the next question is how many operations, and the design pre-registers a
      2-step and 4-step extension so that a signal that does not DECAY with step
      count is caught as the canonical artifact (docs/inventor-protocol.md
      section 3).

  mechanism: >-
    STEP 1 (zero compute, HARD GATE) -- write the rigidity proof and check it
    against a nearby object where it must FAIL: a group of composite order
    n = ell * N, on which the reduction mod the N-part IS a lossy propagating
    projection. If the argument cannot distinguish the prime-order from the
    composite-order case it is wrong and the line ends here.

    STEP 2 (implementation, medium) -- a standalone driver. (a) Division
    polynomials over F_p by the standard recurrence, built once per curve for
    ell in {3,5,7,11,13} and cached; degrees 4, 12, 24, 60, 84. (b) Evaluation at
    x(R) by Horner. (c) The truncation ladder T0..T4. (d) A pair sampler drawing
    R, R' uniformly from G by R = [r]P for uniform r (this uses the KNOWN r, which
    is legitimate because we are measuring a property of the map, not solving an
    instance -- but the map itself never receives r, and the driver must assert
    that separation in code).

    STEP 3 (the primary measurement) -- for each curve, each truncation level, and
    each sample size M in a declared ladder, bucket the M sampled pairs on the key
    (v(R), v(R')) and compute the defect d = fraction of buckets containing more
    than one distinct v(R+R') value, weighted by bucket occupancy. Report d with a
    bootstrap confidence interval. Report also the image entropy H(v) in bits, so
    that d is always read against how much the projection retained.

    STEP 4 (THE NULLS, all three of them, run on the identical pipeline).
      NULL-A, MATCHED-SHAPE NULL: replace psi_ell by a uniformly random polynomial
        over F_p of the SAME degree (ell^2-1)/2 and the same number of distinct
        roots in F_p, and rerun everything. This is the object null: it removes the
        torsion meaning while preserving the shape. If d agrees, the measurement is
        about shape and no torsion claim may be made.
      NULL-B, IMAGE-SIZE NULL: replace v by a random function G -> S with the same
        image-size distribution (a keyed hash truncated to the same entropy). This
        separates "psi_ell propagates" from "any map with this image size
        propagates this well by accident".
      NULL-C, THE CANONICAL k-RESAMPLE (mandated by RQ-TORS-8c7b79 and by the L7
        brief): hold (E, P) fixed and resample k, recomputing every statistic that
        touches Q. Any quantity that appears to depend on k must be shown to move
        under this resample in the correct direction; a statistic that reads only
        (p, a, b) and not (P, Q) is k-independent BY CONSTRUCTION and is flagged
        statically before any run by the gate in IDEA-20260807-bd5d91.

    STEP 5 (decay test, blocking before belief) -- if OUTCOME 2 fires at one group
    operation, repeat at 2 and 4 operations. A genuine propagation signal must
    DECAY with the number of operations. A defect gap that is identical at 1, 2 and
    4 operations is the canonical artifact signature named in
    docs/inventor-protocol.md section 3 and is reported as an instrument finding,
    not as structure.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Commands run 2026-08-07 from the repository root:
      `grep -ril "division polynomial\|division-polynomial" ledger/ knowledge/ docs/ analysis/`;
      `grep -ri "elliptic net\|Somos\|EDS" knowledge/techniques/`;
      `grep -ril "tracked object\|lossy projection" docs/ knowledge/`;
      `grep -ri "propagation" knowledge/techniques/KN-TECH-056.md docs/inventor-protocol.md`;
      plus full reads of KN-TECH-009, KN-OPEN-005, KN-OPEN-019,
      docs/inventor-protocol.md, DEC-20260804-0b2f97, H-NET-001, EV-NET-001.
    results: >-
      "division polynomial": 6 records, all either the elliptic-net line
      (H-NET-001, EV-NET-001, KN-TECH-009) or IDEA-0f5339's large-index recurrence
      closed in DEC-20260804-0b2f97. NONE evaluates psi at small fixed index across
      varying points, and none defines a propagation defect. "tracked object" and
      the lossy-projection test appear only in docs/inventor-protocol.md and
      KN-TECH-056, as a protocol requirement; NO record states the prime-order
      rigidity consequence, and KN-OPEN-019 explicitly records that the program has
      no ECDLP object enumeration and that its partial family-to-object mapping is
      an unchecked sketch.
    verdict: >-
      ADAPTATION. Theorem (A) is elementary and this record claims no mathematical
      novelty for it; what is new to this corpus is (i) stating it as the
      ECDLP-specific form of the lossy-projection test and as a partial, argued
      answer to KN-OPEN-019, and (ii) the psi_ell-at-small-ell-across-points object
      with a measured propagation defect and three nulls. NO external literature
      check has been performed for prior statements of the propagation-defect
      measurement, so the EXTERNAL novelty status of the measurement is
      UNVERIFIED and is recorded as such rather than claimed.

  null_object_control: >-
    MANDATORY AND BLOCKING; three matched nulls, each with its decay parameter.
    NULL-A (object null): psi_ell replaced by a random polynomial of the same
    degree and same F_p-root count. DECAY PARAMETER: the number of primes |L| in
    the vector. A genuine torsion signal should strengthen as more ell are stacked
    (more torsion structure retained); a shape artifact should not move. A gap that
    is identical at |L| = 1 and |L| = 5 is an artifact tell.
    NULL-B (image-size null): a keyed hash truncated to the same entropy. DECAY
    PARAMETER: sample size M. A finite-sample defect difference shrinks like
    M^{-1/2}; a real one does not. Required M ladder: 10^3, 10^4, 10^5 pairs.
    NULL-C (the canonical L7 null): resample k with (E, P) held fixed, at least
    100 resamples per cell. Any statistic that still appears to correlate with k
    under this resample is an artifact by construction, per RQ-TORS-8c7b79's
    decision_target. DECAY PARAMETER: field bits -- a small-p coincidence (tiny N,
    smooth cofactor) must weaken from 16 to 20 to 24 bits; a signal that is
    constant in field size while the group grows is reported as suspect.
    PLANTED POSITIVE (blocking in the other direction): inject a projection that
    provably DOES propagate exactly -- the identity map v(R) = R, and the
    reduction-mod-N-part map on a deliberately composite-order group. The
    instrument must report defect 0 for these. An instrument that reports a
    non-zero defect for the identity cannot measure defects at all and every null
    it produced is void.

  assumptions:
    - >-
      psi_ell for odd ell is a polynomial in x alone (no y), so v_L is
      negation-invariant. This is standard and is also a cheap self-test: the
      driver must verify psi_ell(x(R)) = psi_ell(x(-R)) on every sample.
    - >-
      deg psi_ell = (ell^2 - 1)/2 for odd ell, giving 4, 12, 24, 60, 84 at
      ell = 3,5,7,11,13. Verified by the driver against the recurrence output
      before any measurement.
    - >-
      Sampling R = [r]P for uniform r in Z/N gives R uniform in G \ {O}. Exact,
      not heuristic.
    - >-
      Toy scale only: p up to ~32 bits in pure Python. Nothing here is validated
      at cryptographic scale, and the record does not license extrapolation. In
      particular the defect d is a function of image size relative to |G|, and at
      16-24 bits the image of T1 (243 values) is a much larger fraction of G than
      it would be at 256 bits, which BIASES THE MEASUREMENT TOWARD SEEING
      propagation. This bias is in the direction of a false positive, is disclosed
      here, and is the reason the field-bit ladder is mandatory.

  proof_search_map:
    bottleneck: >-
      For the theorem: none -- it is four lines. For the measurement: the pair
      bucketing at large M and small image size. Buckets are keyed on
      (v(R), v(R')), so at truncation T1 there are at most 243^2 = 59049 buckets
      and M = 10^5 pairs fill them densely, which is the regime where the defect
      estimator is reliable; at T0 the buckets are essentially all singletons and
      the estimator is degenerate. Choosing truncations whose image size sits in
      the estimable band IS the design bottleneck, and it is stated up front so
      that a degenerate cell is recognised as such rather than read as d = 0.
    baseline_embedding:
      parameter_slice: >-
        The exact slice reproducing a KNOWN answer is the composite-order control:
        take a group of order ell*N and the projection to the N-part. There the
        projection is lossy AND propagates exactly, so d = 0. This is the boundary
        at which theorem (A)'s hypothesis (prime order) is dropped.
      reproduction_check: >-
        Frozen fixture: one toy curve whose group order is exactly ell*N with both
        factors prime, the explicit projection map, and an exact-integer assertion
        d = 0 at every sample size. If the driver reports d > 0 there, the defect
        estimator is broken and no other number in the run set is interpretable.
    observation_collision:
      observable: >-
        The propagation defect d(v) at a given truncation level and sample size.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, which is precisely why NULL-A and NULL-B
        are blocking: find two projections with the same d, one psi_ell-derived and
        one random of matched shape or matched image size. Such a collision does
        not falsify the measurement; it CALIBRATES it and bounds what any statement
        about the number may claim. Reporting a psi_ell defect without having run
        the collision search is prohibited by this record.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the defect d) fixed and vary the forgotten structure
          (which polynomial, which truncation). The intrinsic invariant that would
          distinguish the psi_ell family from matched randoms, if any exists, is
          the target; the record predicts none exists and pre-registers that
          prediction.
        predicted_gain: >-
          No attack gain. The gain is a calibrated statement about whether
          torsion structure is visible in propagation at all.
      - transform: stronger_invariant
        proposed_object: >-
          Rather than d alone, the full defect CURVE as a function of retained
          entropy H(v) across the truncation ladder. A curve carries the shape of
          the tradeoff between lossiness and propagation and is what would survive
          a change of ell set; a single number does not.
        predicted_gain: >-
          Resolution. Theorem (A) forces the curve to be strictly positive
          everywhere except at the non-lossy endpoint; the question is whether the
          psi_ell curve sits below the null curve anywhere, and a curve can show
          that where a point cannot.
    quantifier_order: >-
      Theorem (A) as claimed: FORALL groups G of prime order, FORALL sets S,
      FORALL maps v: G -> S, IF THERE EXISTS F with v(R+R') = F(v(R),v(R')) for
      ALL R, R', THEN v is injective or constant. The existential on F is INSIDE
      the hypothesis and is unrestricted -- this is what makes the theorem strong,
      because it forbids not just nice F but any F at all. The dangerous weaker
      reading NOT claimed: "for every efficiently computable F, ...", which would
      leave a gap at inefficient F and would not close the object question.
      Measurement claim: FORALL truncation levels in the declared ladder, FORALL
      curves in the declared toy family, the estimated defect d exceeds the matched
      null's defect by no more than the pre-registered threshold. Note the
      quantifier is over the DECLARED ladder, not over all projections; nothing
      here claims a result about projections outside it.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On this toy family, at these truncation levels, the small-prime
        division-polynomial residue vector propagates no better than a matched
        random projection of the same shape and image size." It can NEVER certify
        anything about other torsion functionals, about probabilistic propagation
        with auxiliary state (escape E2), about crypto-scale image ratios, or about
        the ECDLP itself.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion FAILS is the composite-
        order group with its N-part projection: lossy AND exactly propagating.
        A method that could not distinguish it from the prime-order case has not
        identified the load-bearing structure, which is primality of N. This is
        the same fixture as the baseline embedding, used in the opposite direction.
    proof_obligations:
      - claim: The rigidity argument uses only that D != O generates G.
        responsibility: correctness
      - claim: The defect estimator equals the defined quantity in expectation.
        responsibility: correctness
      - claim: d = 0 on the composite-order fixture at every sample size.
        responsibility: baseline
      - claim: d = 0 for the identity planted positive.
        responsibility: feasibility
      - claim: Bucket occupancy is sufficient for the estimator at every reported cell.
        responsibility: size
      - claim: Every reported defect names its truncation level, sample size, and field bits.
        responsibility: scope

  predictions:
    - metric: >-
        Propagation defect d(v_L) at truncation T1 (quadratic characters,
        |L| = 5) minus the matched NULL-A defect, at M = 10^5 pairs, 20 field bits
      direction: different
      minimum_effect: >-
        PRE-REGISTERED TWO-BRANCH RULE. |d(psi) - d(NULL-A)| <= 0.01 in absolute
        terms records OUTCOME 1, a controlled null: psi_ell structure invisible in
        propagation. d(psi) <= d(NULL-A) - 0.05 records OUTCOME 2 and triggers
        mandatory independent review before any interpretation. Anything strictly
        between is declared INCONCLUSIVE in advance so that neither branch is
        reachable by rounding. BASIS - the thresholds are PRE-REGISTERED
        TOLERANCES chosen a priori from the bucket-occupancy arithmetic
        (243^2 buckets, 10^5 pairs, ~1.7 pairs per bucket, so per-bucket noise is
        the dominant term); they are UNTESTED EXPECTATIONS, not measurements.
    - metric: >-
        d as a function of retained entropy H(v) across the truncation ladder
        T0..T4
      direction: higher
      minimum_effect: >-
        d must be strictly positive at every lossy level and must increase as H(v)
        decreases, reaching its maximum at T2 (3 values). A reported d = 0 at any
        genuinely lossy level CONTRADICTS theorem (A) and is an implementation
        error until independently replicated. BASIS - derivation in this record;
        NOT measured anywhere in this campaign.
    - metric: >-
        Any statistic computed from v_L(Q) regressed on k, under NULL-C
        (k resampled with the curve fixed), 100+ resamples per cell
      direction: different
      minimum_effect: >-
        No correlation exceeding the resample null's 99th percentile at any cell.
        PREDICTED OUTCOME IS NO CORRELATION, and that prediction is recorded here
        so that a null is a confirmed control rather than a disappointment. A
        correlation that survives is either (a) an artifact -- checked first by the
        M-ladder and the field-bit ladder -- or (b) the lane's only live finding,
        which would require an explicit statement of how a k-correlation is
        consistent with theorem (A) before it is believed.
    - metric: >-
        psi_ell(x(R)) - psi_ell(x(-R)) for odd ell, over all samples
      direction: different
      minimum_effect: >-
        Exactly 0 on 100 percent of samples. This is an algebraically forced
        instrument self-test (psi_ell for odd ell is a polynomial in x alone), not
        a finding; a non-zero value means the division-polynomial construction is
        wrong. BASIS - standard; used here as a KNOWN-ANSWER CALIBRATION.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): the rigidity proof plus its
      composite-order counter-check. If the argument does not distinguish the two,
      the proposal ends.
      STAGE 1 (hours): implement psi_ell for ell in {3,5,7,11,13} over F_p and
      validate against three known-answer checks -- degree equals (ell^2-1)/2; the
      roots of psi_ell in F_p are exactly the x-coordinates of the F_p-rational
      ell-torsion, cross-checked by multiplying points by #E/ell; and
      psi_ell(x(R)) = psi_ell(x(-R)).
      STAGE 2 (HARD GATE, minutes): the defect estimator on the composite-order
      fixture and on the identity planted positive. Both must return d = 0.
      STAGE 3 (hours): the primary measurement -- 5 seeds x {16, 20, 24} field bits
      x truncations T1..T4 x M in {10^3, 10^4, 10^5}.
      STAGE 4 (hours): NULL-A, NULL-B, NULL-C on the identical pipeline.
      STAGE 5 (only if OUTCOME 2 fires): the 2-step and 4-step decay test.
      Division-polynomial degrees are capped at ell <= 13 (deg <= 84) precisely
      because psi grows as ell^2/2 and the polynomial arithmetic, not the field
      size, is the cost driver in pure Python; ell = 17 would be degree 144 and
      ell = 19 degree 180, which is where the per-curve setup starts to dominate
      the measurement and is therefore excluded from the declared ladder.
    controls:
      - NULL-A matched-shape polynomial null (blocking)
      - NULL-B matched image-size random-function null (blocking)
      - NULL-C k-resample with the curve fixed (blocking, mandated by RQ-TORS-8c7b79)
      - composite-order fixture, must give d = 0 (blocking baseline)
      - identity planted positive, must give d = 0 (blocking instrument check)
      - negation self-test psi_ell(x(R)) = psi_ell(x(-R)) (blocking instrument check)
      - root cross-check of psi_ell against explicitly computed ell-torsion points
    required_metrics:
      - propagation defect d per (curve, truncation, M, field bits), with bootstrap CI
      - retained entropy H(v) in bits per truncation
      - bucket occupancy distribution per cell (to detect degenerate estimator cells)
      - NULL-A, NULL-B, NULL-C defects on the identical pipeline
      - k-resample correlation statistics and their null percentiles
      - pass/fail of every gate control
      - wall-clock per stage and peak memory

  falsification_conditions:
    - >-
      STAGE 0's composite-order counter-check fails to separate: the rigidity
      argument as written also "proves" something false about composite order. The
      theorem is misstated and the record is superseded rather than amended.
    - >-
      The identity planted positive returns d > 0. Instrument broken; nothing is
      reported.
    - >-
      The composite-order fixture returns d > 0. Same disposition.
    - >-
      psi_ell(x(R)) != psi_ell(x(-R)) for some odd ell. The division-polynomial
      construction is wrong; every number downstream is void.
    - >-
      NULL-A matches d(psi) within the pre-registered band. No psi-specific
      conclusion may be drawn; the honest report is that at toy scale the
      propagation defect of this object measures its SHAPE, and that IS the result.
    - >-
      A reported d = 0 at a genuinely lossy truncation level. This contradicts
      theorem (A) and must be replicated independently before being reported as
      anything other than a suspected estimator bug (degenerate buckets are the
      most likely cause and the occupancy metric exists to catch it).
    - >-
      Pure-Python polynomial arithmetic at ell = 13 exceeds the wall-clock budget
      before any cell resolves. That is an INFRASTRUCTURE outcome under AGENTS.md
      rule 5, is recorded as such, and is not evidence about propagation.

  confounders:
    - >-
      Degenerate bucket occupancy. At high-entropy truncations nearly every bucket
      is a singleton and d is trivially 0 for reasons of sample size, not
      structure. The occupancy metric is mandatory and any cell with median
      occupancy below 2 is reported as degenerate, not as d = 0.
    - >-
      Toy-scale image ratio. At 16-24 bits, |image(T1)| = 243 against |G| ~ 10^4
      to 10^7 is a far larger ratio than at cryptographic size, biasing the
      measurement TOWARD apparent propagation. Disclosed in assumptions; the
      field-bit ladder is the only defence available at this scale and it is a
      weak one.
    - >-
      Accidental smoothness of #E(F_p) at toy scale (KN-TECH-030 obligation 2) and
      the anomalous case #E = p (KN-TECH-033). Both must be excluded per
      KN-TECH-034 before a curve enters the run set; an unexplained propagation
      signal should trigger those checks before any interpretation.
    - >-
      Sampling R = [r]P uses a known r. The driver must keep r out of the
      statistic's input path, and the static provenance gate of
      IDEA-20260807-bd5d91 must be run over the statistic's implementation to
      confirm it. A statistic that reads r is measuring its own input.
    - >-
      Character convention. chi(0) must be fixed (this record fixes it to 0, a
      third symbol) and reported, because psi_ell(x(R)) = 0 exactly when R is
      ell-torsion, which is rare but not impossible on curves with ell | #E.

  interpretation_limits:
    - >-
      Theorem (A) is a statement about EXACT propagation only. It does not bound
      probabilistic propagation, and nothing in this record may be cited as
      closing the probabilistic regime.
    - >-
      A controlled null here closes ONE object family (the declared psi_ell
      truncation ladder) on ONE toy family. It is not a statement about the ECDLP
      and does not close KN-OPEN-019.
    - >-
      OUTCOME 2, if it fires, is not an attack. It would be a measured statistical
      property of a projection, and converting it into a key recovery requires a
      separate proposal with its own exponents, heuristics and cost table.
    - >-
      Toy-scale evidence only; claim_tier capped at toy per RQ-TORS-8c7b79.
    - >-
      Nothing here interacts with the generic-group lower bound (KN-TECH-005):
      that bounds generic algorithms, theorem (A) is a statement about maps out of
      a prime-order group and holds in any model.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For the declared toy family and truncation levels, the propagation defect
        of the psi_ell residue vector is, to within the pre-registered band, equal
        to that of a uniformly random projection with the same image-size
        distribution -- i.e. psi_ell contributes no propagation structure beyond
        its shape.
      rigorous_support: >-
        The rigorous half is theorem (A): the defect is strictly positive for every
        lossy projection, so the only question is its value. The distributional
        half imitates the standard expectation, used throughout symmetric
        cryptanalysis, that a fixed low-degree algebraic map with no designed
        relation to the group operation behaves like a random function of its
        inputs with respect to statistics that do not reference its algebraic
        definition. No theorem is quoted for that half and H1 is refutable on its
        own terms -- OUTCOME 2 is exactly its refutation.
      validation_plan: >-
        SAMPLE: pairs (R, R') drawn uniformly from G, at M in {10^3, 10^4, 10^5}
        per cell, across 5 seeds x {16, 20, 24} field bits x truncations T1..T4.
        SHORTCUT MAKING SAMPLING FEASIBLE: R = [r]P for uniform r, which gives
        exact uniformity on G at negligible cost and needs no correspondence trick.
        COMPARISON DISTRIBUTION: the empirical defect distribution of NULL-B
        (matched image-size random functions) over the same number of independent
        draws, so that H1 is tested against an explicit reference rather than
        against zero. TAIL CHECK: the single most extreme per-curve defect gap
        across all cells, compared against the maximum gap observed across an
        equal number of NULL-B replicates -- a real effect should appear as a
        consistent shift, not as one outlier cell. TOY SCALE ONLY, LABELLED AS
        SUCH: H1 is NOT validated at cryptographic scale by this or any part of
        this proposal, and the image-ratio bias in assumptions means toy-scale
        confirmation of H1 is the CONSERVATIVE direction while toy-scale
        refutation would need the field-bit ladder to be believed at all.
    - id: H2
      statement: >-
        Uniform sampling of R in G induces a distribution on x(R) whose interaction
        with psi_ell is not biased by the sampling method -- i.e. the defect
        measured over R = [r]P for uniform r equals the defect over all of G.
      rigorous_support: >-
        Exact, not heuristic: r uniform in Z/N gives R uniform in G, and G is the
        whole domain. H2 is listed only because the driver could violate it by
        reusing r values or by a biased PRNG, which is an implementation property.
      validation_plan: >-
        Chi-squared uniformity test on the sampled r values and on the induced
        x(R) low-order bits, at each M, before any defect is computed. Frozen
        seeds so the check is reproducible. A failed uniformity test invalidates
        the cell rather than the hypothesis.

  reachability_gate: >-
    NOT APPLICABLE, and stated rather than omitted. This proposal moves between no
    curves: every measurement is on one fixed curve with its own points. T5 imposes
    no cost. Cross-curve reachability enters L7 only in IDEA-20260807-053a55 and
    IDEA-20260807-631e80. One consequence worth recording for those records: the
    truncation ladder T1..T4 is defined from psi_ell, which changes with the curve,
    so v_L is NOT transport-stable -- an isogeny does not carry v_L(R) to
    v_L(phi(R)) by any known relation, and any future proposal that assumes it does
    must prove it first.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. Theorem (A) produces no algorithm. The
      measurement costs O(M * sum_ell (ell^2/2)) field operations per cell, i.e.
      O(M) with a constant of about 184 multiplications for L = {3,5,7,11,13},
      plus a one-off per-curve polynomial construction. If OUTCOME 2 ever fired,
      the exponent question would be: does a projection with defect d and retained
      entropy H support a meet-in-the-middle at cost N^{1/2 - eps}? That question
      is NOT answered here and no eps is claimed.
    memory_exponent: >-
      The bucketing table dominates: O(min(M, |image(v)|^2)) entries, at most
      59049 at T1. Negligible. The measurement is embarrassingly parallel over
      cells.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and small per-processor memory (KN-TECH-001, KN-TECH-006);
      automorphism-discounted by at most sqrt(|Aut|) on CM curves (KN-TECH-018);
      BSGS at 2*sqrt(N) operations and sqrt(N) storage, n^{2/3+o(1)} charged
      (KN-TECH-031). For the OBJECT question specifically the incumbent is
      "there is no recorded ECDLP tracked-object enumeration" (KN-OPEN-019), and
      this proposal's contribution is a proved constraint on that enumeration
      rather than an entry in it.
    hidden_overhead: >-
      The theorem hides nothing; the measurement hides its toy-scale image ratio,
      which is disclosed in assumptions and confounders and which biases toward a
      false positive. Also disclosed: the defect estimator is only meaningful in
      the bucket-occupancy band, so "d = 0" at high entropy is a sample-size
      artifact and is reported as degenerate rather than as a value.
    tradeoff_note: >-
      Not applicable to an attack. For the measurement, sample size M trades
      linearly against estimator variance (M^{-1/2}) and the M-ladder exists
      precisely so that a shrinking gap is distinguishable from a stable one.

  dominated_by: >-
    AS AN ATTACK: mounts none. Dominated on every axis by every row of the
    prime-field frontier, checked individually: parallel rho with distinguished
    points (0.886*sqrt(N) operations, O(1) memory per processor, linear parallel
    speedup, KN-TECH-001/KN-TECH-006); the automorphism-discounted rho variant on
    CM curves (KN-TECH-018); BSGS (2*sqrt(N) time, sqrt(N) memory, KN-TECH-031);
    and Pohlig-Hellman as the reduction that fixes N (KN-TECH-030). Data/query
    axis: this proposal issues no oracle queries, so it does not dominate there
    either -- it produces no solve. AS AN OBJECT-LEVEL CONTRIBUTION: the nearest
    incumbent is KN-TECH-009 (elliptic nets), which is dominated here on scope
    (nets are the auxiliary-state escape E2, a different object) and dominates
    here on maturity (nets have a published construction and a pairing
    application, this has neither).
  sota_delta: >-
    Zero speedup against any attack baseline. Quantified deltas that are actually
    claimed: (i) a proved constraint that forces every candidate lossy tracked
    object on a prime-order subgroup into the probabilistic regime -- one theorem,
    zero compute, applying to ALL such objects rather than to a list; (ii) a
    measured defect curve over a 4-level truncation ladder at 3 field sizes and 3
    sample sizes with 3 matched nulls, at an estimated few CPU-hours; (iii) a
    pre-registered two-branch decision rule (|gap| <= 0.01 versus gap >= 0.05)
    that makes the null a result rather than a non-event. No exponent moves.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.97 that theorem (A) is correct as stated -- the argument is four lines and
    the residual is that "propagates" has been formalised in a way that quietly
    excludes something a reader will want to include. 0.9 that the division-
    polynomial implementation passes its three known-answer checks. 0.8 that the
    defect estimator is in its usable occupancy band at truncations T1 and T4.
    OUTCOME split: 0.85 OUTCOME 1 (controlled null, psi invisible beyond shape),
    0.05 OUTCOME 2 (measured gap surviving all three nulls and the decay test),
    0.10 inconclusive on estimator degeneracy or budget. The most likely honest
    headline is therefore "on a prime-order subgroup there is no exactly
    propagating lossy object, and the natural small-prime torsion candidate does
    not propagate better than its shape predicts" -- a proved constraint plus a
    controlled null, which is a first-class deliverable under
    docs/inventor-protocol.md sections 3 and 4.

