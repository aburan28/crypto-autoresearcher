idea:
  id: IDEA-20260807-f00729
  question_id: RQ-JINV-8fc13a
  added: '2026-08-07'
  title: >-
    CLOSURE with a named obstruction: the automorphism quotient E -> E/Aut is a
    lossy projection that is NOT a group homomorphism - the orbit of P+Q is not
    determined by the orbits of P and Q - so it is compatible with equality
    tests (giving rho's sqrt(|Aut|)) and with relation transport (giving index
    calculus's |Aut|/2), and with NOTHING that propagates through the group law;
    every j=0 / j=1728 mechanism that needs propagation therefore dies at the
    first addition, and the forward guidance names the three classes that do not
    need it
  class: mechanism

  claim: >-
    (A) THE OBJECT AND THE FAILURE, STATED EXACTLY. Let A = Aut(E) act on E, let
    r = |A/{+-1}| (r = 3 for j=0, r = 2 for j=1728, r = 1 generically), and let
    pi: E -> E/A be the orbit map. pi is a genuinely lossy projection: it
    forgets which of the |A| points of an orbit you hold, and it cannot be
    inverted. Now ask the lossy-projection test's actual question - does the
    RETAINED PART PROPAGATE DETERMINISTICALLY through the target's operations?
    The target's operation is addition. Compute:
      pi(P) + pi(Q) is not defined; the natural candidate is the SET
      { phi^i(P) + phi^j(Q) : 0 <= i,j < r },
      which has r^2 elements and meets exactly r distinct A-orbits, indexed by
      the difference (i - j) mod r, because phi^i P + phi^j Q =
      phi^j( phi^{i-j} P + Q ).
    So the orbit of P+Q is determined by (pi(P), pi(Q)) ONLY UP TO AN r-FOLD
    AMBIGUITY, and that ambiguity is exactly the residue (i-j) mod r. For r = 1
    (generic j, and also for negation alone, since -P + -Q = -(P+Q)) the
    ambiguity is trivial and the projection IS a homomorphism - which is why
    negation is free and has always been free. For r > 1 it is not.
    [derived in this record; elementary and verifiable by hand.]

    (B) WHY THAT EXACT FAILURE PRODUCES EXACTLY THE TWO KNOWN CONSTANTS.
      B1 RHO NEEDS ONLY AN EQUALITY TEST, NOT THE GROUP LAW ON THE QUOTIENT. A
        collision search on E/A needs to recognise when two walk states coincide
        as orbits; the walk itself is computed on E and only the state is
        projected. Since |E/A| = N/|A| approximately, the birthday bound gives
        sqrt(|A|) fewer steps. That is KN-TECH-018's sqrt(|Aut|), at most
        sqrt(6), and it survives the non-homomorphism because it never uses it.
        (It pays for that in fruitless cycles, which is a separate cost and is
        H-RHO-bc6ea6's subject for r = 1; that hypothesis explicitly places
        j in {0,1728} OUT OF SCOPE, so the j=0 cycle structure is unmeasured in
        this program.)
      B2 INDEX CALCULUS NEEDS ONLY TRANSPORT OF WHOLE RELATIONS. Applying phi to
        a COMPLETE relation sum e_i P_i = R gives sum e_i phi(P_i) = phi(R). The
        ambiguity in (A) never arises because every summand is shifted by the
        SAME i. That is why the factor-base quotient works and gives at most r
        on collection and r^2 on dense linear algebra
        (IDEA-20260807-f8a045 claim (A)).
      B3 EVERYTHING ELSE DIES. Any mechanism that needs to ADD TWO PROJECTED
        OBJECTS - a walk defined on the quotient, a decomposition search over
        orbit-indexed unknowns with mixed shifts, a meet-in-the-middle over
        orbits, a baby-step/giant-step on E/A, a "summation polynomial in the
        quotient coordinate" that treats the quotient as a group - encounters
        the r-fold ambiguity at every addition and must either enumerate the r
        branches (destroying the r-fold saving exactly) or track the shift index
        (which is the next point).

    (C) TRACKING THE SHIFT INDEX IS A CHANGE OF COORDINATES, NOT A NEW OBJECT.
    The obvious repair is to track the pair (orbit, shift index). But the shift
    index of a point relative to a fixed orbit representative is exactly the
    information the orbit map discarded: (pi(P), i) determines P. By the
    lossy-projection test of docs/inventor-protocol.md section 2 - "a projection
    that loses nothing is a change of coordinates, not a new object" - the
    repaired object is E itself in different notation, and it therefore inherits
    every bound E has. This is the same shape of failure as the worked
    counterexample in that section, where tracking (x xor y, x*y) is worthless
    because the pair recovers the unordered pair of inputs. THE REPAIR IS
    EXACTLY AS EXPENSIVE AS THE THING IT REPAIRS, AND THAT IS THE CLOSURE.

    (D) WHAT THE CLOSURE DOES AND DOES NOT SAY. It says: no mechanism whose
    tracked object is the A-ORBIT can beat the constants in B1 and B2, because
    the orbit does not propagate through addition and the only fix restores the
    full point. It does NOT say j=0 curves are as hard as generic ones by any
    proof - they are cheaper by the stated constants. It does NOT declare the
    lane impossible; it names an obstruction inside a stated scope and hands
    forward the classes that avoid it (see forward guidance in the mechanism).
    THIS PROPOSAL CLAIMS NOTHING BEYOND THE KNOWN CONSTANTS. It is filed as a
    closure argument, which under docs/inventor-protocol.md section 4 requires a
    named obstruction (the non-homomorphism), an argument ((A) and (C)), and
    forward guidance (below) - all three of which it supplies.

  resource_label: >-
    "audit: consumes no resource". This proposal mounts no attack and consumes
    no R1-R8 resource; it audits the resource ledger itself, in the sense of
    lane L12 (RQ-GGMB-6eaabc), by deciding in advance which L3 mechanisms are
    worth compute.

  admissibility: admissible
  admissibility_argument: >-
    An audit is not subject to the admissibility filter, because the filter asks
    what non-generic resource a MECHANISM consumes and this record proposes no
    mechanism. Its content is an argument about a map between sets, checkable by
    hand. What it does is make the filter cheaper to apply: after this record,
    an L3 proposal whose tracked object is an automorphism orbit and whose
    mechanism requires adding two orbits can be rejected at zero cost, which is
    the same service DECOMPOSITION.md section 2 provides for group-operation
    outputs. It is admissible in the trivial sense and useful in the practical
    one.

  discriminated_from:
    - >-
      KN-TECH-018, which RECORDS the sqrt(|Aut|) constant. This record explains
      WHY that constant and not a better one, and in doing so derives a second,
      different constant (|Aut|/2 for index calculus) that KN-TECH-018 does not
      contain. The explanation is what makes future proposals cheap to screen.
    - >-
      H-ENDO-001, whose obstruction is that G has prime order so every
      endomorphism is a scalar. That argument is about the ACTION ON A GROUP.
      This one is about a QUOTIENT MAP OF SETS and applies even where the
      endomorphism argument does not - for instance to a quotient of the whole
      curve rather than of a prime-order subgroup, and to the Kummer-style
      quotients of lane L11. The two obstructions are independent; neither
      implies the other.
    - >-
      KN-FIND-b7e091, which closes two ORACLE classes by GGM simulation. This
      record closes an OBJECT class by an algebraic property of a map. A GGM
      simulation argument would not produce the r^2 index-calculus constant,
      because index calculus is not a generic-group algorithm.
    - >-
      H-RHO-bc6ea6 (status specified), which measures the shortfall of the
      negation quotient's sqrt(2) and explicitly excludes j in {0, 1728}. This
      record does not measure any rho constant; it explains the structural
      ceiling and observes that H-RHO's scope exclusion leaves the j=0 cycle
      structure unmeasured, which is one item of forward guidance.
    - >-
      IDEA-20260807-d329e2 (this batch), which is the concrete instance this
      closure predicts will lose: a summation polynomial in the quotient
      coordinate. That proposal is retained deliberately, because a prediction
      that is never tested is not a closure; d329e2 is this record's designated
      falsification attempt.

  object_first_candidate:
    tracked_object: >-
      THE Aut(E)-ORBIT of a point - the canonical "special j" object, and the
      only one the j=0 / j=1728 structure supplies that is not already covered
      by H-ENDO-001's scalar argument.
    lossiness: >-
      LOSSY: |A| points collapse to one orbit, so log2|A| bits (2.58 for j=0)
      are discarded per tracked element. The projection is not injective and
      cannot be inverted from the orbit alone.
    propagation: >-
      THIS IS WHERE IT FAILS AND THAT IS THE FINDING. Compatible with equality
      (two points are in the same orbit or not - decidable from the orbits) and
      with simultaneous transport (applying one phi to a whole relation).
      INCOMPATIBLE with addition: by (A), pi(P)+pi(Q) determines pi(P+Q) only up
      to r choices. So the retained part does not propagate deterministically
      through the target's central operation, which is exactly the condition
      docs/inventor-protocol.md section 2 requires and exactly what this object
      fails.
    survival_score: >-
      Survives ZERO group-law steps. It survives arbitrarily many equality tests
      and arbitrarily many simultaneous-transport steps, which is why the two
      constants exist and why they are only constants. Scored on the protocol's
      three axes: NOT genuinely new (it is the automorphism quotient, known since
      Wiener-Zuccherato as cited by KN-TECH-018); CONCRETELY TESTABLE (its
      one-step propagation is defined and its failure is measurable as an r-fold
      branching factor); SURVIVES ZERO STEPS in the direction the campaign needs.

  mechanism: >-
    THIS IS AN ARGUMENT, NOT AN EXPERIMENT, AND ITS STEPS ARE PROOF STEPS.

    STEP 1. Verify (A) mechanically on toy curves: for many random pairs (P,Q)
    on a j=0 curve, compute the multiset of A-orbits of { phi^i P + phi^j Q },
    and confirm it has exactly r = 3 distinct orbits with multiplicity r each,
    indexed by (i-j) mod r. Confirm the generic-curve case gives exactly 1. This
    is a few lines against harness/toycurve.py and it converts the hand
    derivation into a checked fact.

    STEP 2. Verify the (C) collapse mechanically: confirm that (orbit(P), shift
    index relative to a canonical representative) determines P uniquely, by
    round-tripping every point of a sample. If any information is lost, (C) is
    wrong and the repaired object is genuinely lossy after all - which would be
    the interesting event and would reopen the lane.

    STEP 3 (THE BRANCHING-COST MEASUREMENT, and it is what turns the argument
    into a quantitative statement). Implement a walk that operates PURELY on the
    quotient - i.e. that refuses to look at the underlying point and must
    enumerate the r branches at each addition. Measure its cost against a walk
    on E/A that computes on E and projects only the state. Predicted: the pure
    quotient walk costs exactly r times more per step, cancelling the sqrt(r)
    birthday saving and leaving a NET LOSS of r/sqrt(r) = sqrt(r) - i.e. the
    naive "work on the quotient" idea is worse than doing nothing by a factor
    sqrt(3) = 1.73 on a j=0 curve. THIS IS A PREDICTION WITH A NUMBER AND IT IS
    FALSIFIABLE.

    STEP 4. FORWARD GUIDANCE - the classes this closure does NOT reach, written
    out so the next session does not have to rediscover them:
      G1 MECHANISMS THAT NEVER ADD PROJECTED OBJECTS. Relation transport (B2) is
        the known one. Multi-target and preprocessing (lane L13,
        RQ-MTGT-2cabee): a precomputed table indexed by orbits is queried by
        equality, never added, so the r-fold saving in table size survives. This
        is genuinely open and this record does not touch it.
      G2 MECHANISMS THAT USE THE QUOTIENT AS A VARIETY RATHER THAN AS A SET.
        E/A is isomorphic to P^1; for j=0 the map is (x,y) -> y (degree 3) and
        for j=1728 it is (x,y) -> x^2 (degree 4). Algebraic constructions on that
        P^1 - summation polynomials in the quotient coordinate - are not
        "adding orbits", they are writing equations, and they pay the
        non-homomorphism as a DEGREE increase rather than as a branching factor.
        That is IDEA-20260807-d329e2, which is this record's designated test.
      G3 THE FRUITLESS-CYCLE STRUCTURE AT r > 1 IS UNMEASURED IN THIS PROGRAM.
        H-RHO-bc6ea6 excludes j in {0,1728} by assumption. A |A| = 6 quotient
        walk has a richer cycle structure than a negation walk and its escape
        cost could eat a materially larger share of the sqrt(6). That is a
        constant, but it is a constant nobody here has measured, and it could
        make the j=0 discount SMALLER than sqrt(6) rather than larger.
      G4 THE PRIMALITY OF N, NOT THE SIZE OF |A|, IS THE LOAD-BEARING FACT IN
        H-ENDO-001'S HALF OF THE OBSTRUCTION. Composite-order groups are outside
        both arguments.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Run 2026-08-07 from the repository root.
      (1) grep -ril "automorphism" knowledge/ -> 30+ files, read KN-TECH-006,
          KN-TECH-018, KN-TECH-031
      (2) grep -ril "lossy projection\|lossy-projection" docs/ knowledge/ ledger/
      (3) read docs/inventor-protocol.md sections 1-5 in full
      (4) read ledger/hypotheses/H-RHO-bc6ea6.yaml in full
      (5) read knowledge/findings/KN-FIND-b7e091.md in full
    results: >-
      KN-TECH-018 states the sqrt(|Aut|) constant and its applicability limit
      ("a CONSTANT factor -- it does not change the exponent") but gives no
      reason WHY the quotient cannot do better, and contains no index-calculus
      accounting. KN-TECH-031 notes in passing that "BSGS gains nothing from
      curve automorphisms in the way rho does" - a symptom of exactly the
      non-homomorphism argued here, stated as an observation without a mechanism.
      The lossy-projection test is defined in docs/inventor-protocol.md section 2
      and is bound on the idea-generator, but NO RECORD IN THIS REPOSITORY
      APPLIES IT TO THE AUTOMORPHISM QUOTIENT. H-RHO-bc6ea6 explicitly excludes
      j in {0,1728}.
    verdict: >-
      ADAPTATION. The mathematics is elementary and certainly known to
      specialists; nothing is claimed as new against the external literature.
      What is new to this program is (i) the argument written down where the
      campaign can cite it, (ii) the derivation of the SECOND constant (|Aut|/2,
      linear) alongside the first (sqrt(|Aut|)), and (iii) the observation that
      KN-TECH-031's remark about BSGS is the same phenomenon. Filed as a closure
      under docs/inventor-protocol.md section 4, which requires exactly this
      shape and which explicitly warns that a count of rejected mechanisms would
      NOT qualify - hence the named obstruction and the forward guidance.

  null_object_control: >-
    MANDATORY AND BLOCKING, AND IT IS UNUSUAL HERE BECAUSE THE NULL IS THE
    GENERIC CURVE AND THE PREDICTION IS THAT THE NULL BEHAVES DIFFERENTLY.
    N1 GENERIC-j CURVE (r = 1, negation only). Step 1 must return exactly ONE
      orbit for { phi^i P + phi^j Q }, i.e. the projection IS a homomorphism
      there. If the instrument reports r > 1 branches on a generic curve it is
      broken, since -P + -Q = -(P+Q) is an identity.
    N2 j=1728 CURVE (r = 2). Step 1 must return exactly TWO orbits. The
      instrument must therefore produce THREE different answers on three curve
      families, which is a much stronger instrument test than a single
      comparison.
    N3 FAKE PARTITION: partition the points into arbitrary blocks of size |A|
      that are not orbits, and run Step 1. The branch count must be
      approximately |A|^2, not |A|, because a fake partition has no structure at
      all. An instrument that reports |A| on a fake partition is counting
      bookkeeping, not mathematics.
    DECAY PARAMETER: r itself, swept over {1, 2, 3} via {generic, j=1728, j=0}.
    The branching factor must EQUAL r exactly and must therefore GROW with r.
    A branching factor that is constant across the three families is the
    canonical artifact tell and voids the measurement.

  assumptions:
    - >-
      p > 3, E ordinary, and the extra automorphism F_p-rational: p congruent to
      1 mod 3 for j=0 (else y^2 = x^3 + b is supersingular) and 1 mod 4 for
      j=1728. Over prime fields with p > 3 the only possible |Aut| values are
      2, 4 and 6, so r is in {1, 2, 3} and the closure covers every case that
      can occur.
    - >-
      The argument in (A) is about the F_p-rational automorphism group. Over
      extension fields more automorphisms become rational and the arithmetic
      changes; nothing here transfers to F_{p^2} or to supersingular curves.
    - >-
      Step 3's branching-cost prediction assumes the pure-quotient walk is
      implemented honestly, i.e. that it genuinely cannot inspect the underlying
      point. Any implementation that peeks makes the measurement meaningless and
      the peek-check is part of the design.

  proof_search_map:
    bottleneck: >-
      The single step "add two projected objects". Every mechanism in this lane
      that fails, fails there, and every mechanism that succeeds (rho's equality
      test, index calculus's relation transport) succeeds by never taking that
      step. Naming this as the bottleneck is the entire contribution.
    baseline_embedding:
      parameter_slice: >-
        r = 1 (generic curve, negation only). The argument must reproduce the
        known fact that negation is free and IS a homomorphism onto the quotient
        - i.e. the branching factor must come out exactly 1, recovering the
        standard x-coordinate-only factor base and the sqrt(2) rho constant that
        KN-TECH-006's 0.886 convention already includes.
      reproduction_check: >-
        Frozen fixture: 10^4 random pairs (P,Q) on a fixed generic toy curve;
        assert that the orbit of P+Q is determined by the orbits of P and Q in
        100 percent of cases. A single failure means the instrument is wrong,
        because the identity -P + -Q = -(P+Q) is not in doubt.
    observation_collision:
      observable: >-
        The number of distinct A-orbits met by { phi^i P + phi^j Q }.
      distinct_preimage_search: >-
        SEARCH FOR PAIRS (P,Q) AND (P',Q') WITH pi(P) = pi(P'), pi(Q) = pi(Q')
        BUT pi(P+Q) != pi(P'+Q'). This is not merely expected to succeed - its
        success IS claim (A), and exhibiting an explicit such pair on a toy j=0
        curve is the cheapest possible proof of the closure. Failure to find one
        after exhaustive search on a small curve would REFUTE (A) and is the
        designated falsifier.
    quantifier_order: >-
      Intended: FORALL ordinary E/F_p with F_p-rational Aut of order 2r' > 2,
      EXISTS a pair (P,Q) in G x G such that the orbit of P+Q is not determined
      by the orbits of P and Q. Stronger form actually claimed: FORALL E as
      above and FORALL pairs (P,Q) in general position, the induced orbit set has
      exactly r elements.
      The dangerous weaker reading, NOT claimed: EXISTS E EXISTS (P,Q)... which
      would be a curiosity rather than an obstruction. The audit obligation is
      that the r-fold count is shown for GENERIC (P,Q) and that the degenerate
      pairs (P in a short orbit, Q = phi^i P, P or Q of order dividing |A|) are
      enumerated and excluded explicitly rather than ignored.
    method_ceiling:
      strongest_certifiable_claim: >-
        "No algorithm whose tracked state is an Aut-orbit and whose transition
        requires adding two tracked states can avoid an r-fold branching factor,
        on ordinary prime-field curves with F_p-rational Aut." It can NEVER
        certify anything about algorithms that track something else, about
        non-additive transitions, about extension fields, or about the ECDLP's
        hardness. It also does not certify that the r-fold branching cannot be
        AMORTISED across many additions - a real gap, and it is named in the
        forward guidance as G1.
      nearby_object_control: >-
        THE NEGATION-ONLY QUOTIENT (r = 1), where the hoped-for conclusion FAILS
        - i.e. where the quotient IS a homomorphism and IS free. The method must
        distinguish it: it must report branching 1 there and 3 on j=0. A method
        that reports the same obstruction on the negation quotient has not
        identified the load-bearing structure (which is the NON-CENTRALITY of the
        shift index, not the mere existence of a quotient) and its closure is
        void. This control is what separates this argument from a generic
        "quotients lose information" hand-wave.
    proof_obligations:
      - claim: "{phi^i P + phi^j Q} meets exactly r orbits, indexed by (i-j) mod r."
        responsibility: correctness
      - claim: "r = 1 for negation alone, so negation is free."
        responsibility: baseline
      - claim: "(orbit, shift index) determines the point, so the repair is a recoordinatisation."
        responsibility: correctness
      - claim: "A pure-quotient walk pays branching r per addition."
        responsibility: runtime
      - claim: "Degenerate pairs are enumerated and excluded, not ignored."
        responsibility: scope
      - claim: >-
          The closure is scoped to objects whose transition is addition, and the
          amortisation gap (G1) is named rather than closed.
        responsibility: scope

  predictions:
    - metric: >-
        number of distinct Aut-orbits met by { phi^i P + phi^j Q } for generic
        (P,Q), by curve family
      direction: different
      minimum_effect: >-
        Exactly 1 (generic), 2 (j=1728), 3 (j=0), on at least 99.9 percent of
        random pairs, with the residual accounted for by the enumerated
        degenerate cases. Any other triple refutes claim (A).
    - metric: >-
        round-trip success of (orbit, shift index) -> point
      direction: higher
      minimum_effect: >-
        100 percent. Any loss refutes (C) and reopens the lane, because it would
        mean the repaired object is genuinely lossy.
    - metric: >-
        cost per step of a pure-quotient walk divided by cost per step of a
        project-the-state walk, on a j=0 curve
      direction: higher
      minimum_effect: >-
        Predicted 3.0 within 20 percent. A ratio near 1 refutes the branching
        argument; a ratio far above 3 indicates implementation overhead rather
        than branching and must be decomposed before it is reported.
    - metric: >-
        end-to-end cost of the pure-quotient walk divided by matched rho with
        negation on the identical instance
      direction: higher
      minimum_effect: >-
        Predicted at least sqrt(3) = 1.73, i.e. a NET LOSS. A ratio below 1 -
        the pure-quotient walk actually winning - would refute the closure
        outright and is the single outcome that reopens this object.

  minimal_test:
    design: >-
      THE CHEAPEST VALID DISCRIMINATOR IS THE OBSERVATION-COLLISION SEARCH AND
      IT COSTS SECONDS. On one small j=0 toy curve, exhibit an explicit pair
      (P,Q) and (P', Q') = (phi(P), Q) with the same orbits but different orbit
      of the sum. That single explicit pair PROVES the non-homomorphism on that
      curve and, together with the r=1 control on a generic curve, establishes
      the entire closure. Everything else in the mechanism is corroboration.
      Step 3's branching-cost measurement is the only part that needs real
      compute and it is worth running because it converts "this cannot help" into
      "this loses by a factor sqrt(3)", which is a citable number rather than an
      opinion.
    controls:
      - generic-j curve, which must show branching exactly 1 (N1)
      - j=1728 curve, which must show branching exactly 2 (N2)
      - fake |Aut|-sized partition, which must show branching about |Aut|^2 (N3)
      - >-
        degenerate-pair enumeration: short orbits, Q = phi^i P, and points whose
        order divides |Aut|, each counted separately
      - >-
        peek-check on the pure-quotient walk implementation, verifying it cannot
        access the underlying point
      - matched rho with negation on the identical instance
    required_metrics:
      - distinct-orbit count per random pair, per family, with the full histogram
      - explicit witness pair for the non-homomorphism, recorded verbatim
      - round-trip success rate of (orbit, shift index)
      - per-step and end-to-end cost of both walk variants, in point additions
      - degenerate-pair counts and their exclusion rationale
      - pass/fail of all four controls

  falsification_conditions:
    - >-
      No pair (P,Q), (P',Q') with equal orbits and unequal sum-orbit exists on a
      j=0 curve. Claim (A) is false, the projection IS a homomorphism, and this
      entire closure is withdrawn by a superseding record. This is the single
      cleanest falsifier in the batch.
    - >-
      The branching count on a generic curve is not exactly 1. Instrument
      failure; every number void.
    - >-
      (orbit, shift index) fails to determine the point. Claim (C) is false and
      the repaired object is genuinely new; the lane reopens with a concrete
      object to study.
    - >-
      The pure-quotient walk beats matched rho with negation. The closure is
      refuted; halt for independent review under AGENTS.md rule 12.
    - >-
      The fake-partition control reports branching |Aut| rather than about
      |Aut|^2. The instrument is measuring bookkeeping and its outputs are void.

  confounders:
    - >-
      DEGENERATE PAIRS. If Q is in the orbit of P, or if P has order dividing
      |Aut|, or if x = 0 on a j=0 curve (a fixed point of the order-3
      automorphism), the branch count collapses. These are enumerated and
      excluded rather than allowed to dilute the histogram.
    - >-
      NEGATION IS ALREADY COUNTED. The standard baseline 0.886*sqrt(N) already
      includes the sqrt(2) from negation (KN-TECH-006, KN-TECH-018), so the
      EXTRA discount at j=0 is sqrt(3) and not sqrt(6). Every constant in this
      record is stated relative to a named baseline, and quoting sqrt(6) against
      an already-negation-discounted baseline would double-count.
    - >-
      IMPLEMENTATION OVERHEAD MASQUERADING AS BRANCHING. A pure-quotient walk
      written naively can be slower for reasons that have nothing to do with
      branching. The per-step cost must be decomposed into branch enumerations
      and other work before the factor 3 is claimed.
    - >-
      THE ARGUMENT IS ABOUT ADDITION, NOT ABOUT COMPUTATION IN GENERAL. A
      mechanism that uses the quotient without adding is untouched, and G1/G2 in
      the forward guidance say so. Reading this closure as "automorphisms are
      useless" would be a misreading and is forbidden.

  interpretation_limits:
    - >-
      This is a CLOSURE WITHIN A STATED SCOPE, not a declaration that the
      direction is impossible. Per the Idea Generator prohibition and
      docs/inventor-protocol.md section 7, a closure names an obstruction and
      says what remains open; it does not declare a problem unsolvable.
    - >-
      Scoped to ordinary prime-field curves with F_p-rational automorphism group
      of order 2, 4 or 6. Nothing about extension fields, supersingular curves,
      or higher-genus Jacobians.
    - >-
      Scoped to mechanisms whose tracked object is the orbit and whose
      transition is addition. G1 (amortisation across many additions, e.g. lane
      L13 preprocessing) and G2 (algebraic constructions on E/A as a variety)
      are explicitly NOT closed.
    - >-
      The constants themselves are not established by this record: sqrt(|Aut|)
      is KN-TECH-018's and |Aut|/2 is IDEA-20260807-f8a045's to measure. This
      record explains their ceiling; it does not verify they are attained, and
      G3 notes the j=0 fruitless-cycle cost could put the realised rho constant
      BELOW sqrt(6).

  reachability_gate: >-
    NOT APPLICABLE AS A WALK, but the closure interacts with T4/T5 in a way that
    strengthens it. T4: an Aut of order > 2 requires D_0 = -3 or D_0 = -4, and a
    curve whose isogeny class lacks such a curve cannot be walked to one at any
    price. So the object this record closes is only ever AVAILABLE on curves
    that already have it, and its closure therefore costs the campaign nothing
    it could have reached. Conversely, this is why the closure matters: it
    removes the temptation to spend the campaign's isogeny budget searching for
