    - >-
      IDEA-20260807-30868b and IDEA-20260807-464ff8, which close self-pairings
      and distortion maps ON G. Those concern pairings whose domain is the point
      group; the Weil-pairing evaluation used here has the ORIENTATION and the
      connecting ideal as its subject and never pairs two points of G. The shared
      word "pairing" is the only overlap.
    - >-
      IDEA-20260808-5158fa, which closes the CM ray-class-field Artin descent by
      showing the decomposition group at p is trivial. That record works in
      characteristic zero on the CM lift and concerns the (O/n)^* fibre carrying
      k. This record works in characteristic p on the class group Cl(O) itself
      and concerns the horizontal coordinate, which 5158fa does not touch. The
      two are complementary halves of the ray-class picture and neither closes
