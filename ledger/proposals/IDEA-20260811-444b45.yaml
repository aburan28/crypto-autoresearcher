      IDEA-20260807-bbdcf3, which prices a counterfactual bridge G -> Cl(O) at
      N^{1/4}, closes homomorphic bridges by the counting obstruction OBS-5, and
      discloses the L_{|D|}(1/2) class-group-structure precomputation as its
      hidden overhead item (iii). This record makes NO bridge claim: it does not
      move information from points into the class group, it measures how much of
      the CLASS-GROUP-SIDE address is free. It is the exact complement of that
      record's item (iii) -- bbdcf3 says everything about Cl(O) costs L(1/2), and
      this record identifies the one piece that does not and bounds it at
      p^{o(1)}. Neither record's conclusion changes the other's.
    - >-
      IDEA-20260811-85cfe9 (this same session), which imports the OTHER
      Castryck-lineage result, KN-LIT-7489 key claim 3, and asks what a SQUARE
      divisor of Delta_O buys. That record's quantity is m*(E), the largest
      prime-power square divisor, and its answer is closed by a norm-budget
