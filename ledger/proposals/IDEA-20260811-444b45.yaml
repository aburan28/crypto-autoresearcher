    - >-
      E ordinary over F_p, p > 3, O = End_{F_p}(E), Delta_O = f_E^2 D_0, and
      Cl(O) acting freely and transitively on the F_p-isomorphism classes with
      End_{F_p} = O (Deuring/Waterhouse/Kohel). Verified at toy scale by orbit
      counting.
    - >-
      Gauss's genus theory in the form used: the genus group is Cl(O)/Cl(O)^2,
      elementary abelian of rank mu - 1, with mu determined by the odd prime
      divisors of Delta_O and a 2-adic rule depending on Delta_O modulo 32.
      Classical; the 2-adic rule is a proof obligation and is checked against the
      computed 2-rank at every toy instance rather than trusted.
    - >-
      omega(n) <= (1 + o(1)) log n / log log n, unconditional, classical.
    - >-
      H-ENDO-001's scalar-action argument is used only as the admissibility
      filter and is not re-tested; it does not bite because no endomorphism is
      applied to a point of G. KN-FIND-b7e091 is binding and is not revisited.
    - >-
      Stage 5 requires targets_B data. The standing control restatement of
      DEC-20260810-5aeeaa forbids any within-class or curve-side claim from
      targets_uniform measurements in either direction, and a genus
      stratification is exactly such a claim.

  estimated_cost:
    implementation: >-
      low to medium. Stages 1, 2 and 6 need only integer factorization and
      reduced binary quadratic forms, both of which are standard and already
      available. Stage 5 needs NO new instrument -- it is a re-slicing of L1
      measurements the campaign already takes -- which is what makes the payoff
      cheap. Stages 3 and 4 need a Weil-pairing character evaluation and a
      class-group meet-in-the-middle, which are new code and are the bulk of the
      work; they can be deferred without blocking Stage 5.
    compute: >-
      low for Stages 0, 1, 2, 6 (minutes). Medium for Stages 3 and 4 (hours),
      dominated by exact Cl(O) structure computation at the upper end of the toy
      ladder. Stage 5's marginal compute over the existing L1 runs is
      approximately zero.
  recommended_priority: high

  honest_prior_of_survival: >-
    0.99 that the genus group has rank mu - 1 and the 2-rank calibration passes
    -- this is Gauss. 0.99 that the p^{o(1)} ceiling holds -- this is the maximal
    order of omega, unconditional. 0.75 that Stage 0 confirms the connecting-class
