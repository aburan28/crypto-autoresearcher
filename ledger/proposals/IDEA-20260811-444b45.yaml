idea:
  id: IDEA-20260811-444b45
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  title: >-
    THE GLOBAL ADDRESS IS NOT ALL-OR-NOTHING, AND THE FREE PART IS EXACTLY
    mu - 1 BITS. Castryck-Houben-Vercauteren (KN-LIT-1013) evaluate the ASSIGNED
    CHARACTERS of the unknown ideal class connecting two O-oriented curves in
    polynomial time from the Weil pairing, specialised to ordinary curves over
    finite fields -- so the position of a curve in its F_p-isogeny class is
    publicly known modulo Cl(O)^2, for free, with no class-group precomputation.
    Gauss's genus theory pins the size of that channel EXACTLY at the 2-rank
    mu - 1, and the maximal order of omega caps it at
    (1 + o(1)) log p / log log p, so the discount on vectorization is
    2^{(mu-1)/2} = p^{o(1)}: a polylog cofactor typically, at most subexponential,
    NEVER an exponent. The deliverable is not the number but what it unlocks:
    the genus character vector is the first concrete instance this campaign has
    of T5's branch (ii) -- a LOCAL, polynomial-time, free test evaluable at every
    step of a walk -- and it is therefore a free stratification variable for
    lane L1's within-class variance measurements and a REAL (non-synthetic)
    positive control for criterion C4
  class: measurement

  claim: >-
    (A) WHAT T5 PRESUMES. DECOMPOSITION.md T5 splits reachability in two:
    a uniformly random curve in the class is reachable in O(log p) steps
    (cheap, GRH-conditional rapid mixing), while a SPECIFIED curve requires
    vectorization (~sqrt(h) ~ p^{1/4}). The dichotomy treats the "global
    address" as a monolith: you have it or you pay p^{1/4} for it. THAT IS
    FALSE, AND THE AMOUNT BY WHICH IT IS FALSE IS COMPUTABLE EXACTLY.

    (B) THE IMPORTED INGREDIENT. KN-LIT-1013 (Castryck, Houben, Vercauteren,
    "On the decisional Diffie-Hellman problem for class group actions on
    oriented elliptic curves", arXiv:2210.01160), as transcribed in this corpus:
    "We show how the Weil pairing can be used to evaluate the assigned
    characters of an imaginary quadratic order O in an unknown ideal class
    [a] in cl(O) that connects two given O-oriented elliptic curves (E, iota)
    and (E', iota') = [a](E, iota). When specialized to ordinary elliptic curves
    over finite fields, our method is conceptually simpler and often somewhat
    faster than a recent approach due to Castryck, Sotakova and Vercauteren, who
    rely on the Tate pairing instead." Its stated main implication is that it
    "breaks the decisional Diffie-Hellman problem for practically all oriented
    elliptic curves that are acted upon by an even-order class group".
    THIS RECORD IS CITED BY NO LEDGER RECORD IN THIS REPOSITORY. It appears only
    in knowledge/literature, knowledge/SOURCES.md and knowledge/sources.json.
    The campaign has been reasoning about T5 for four batches with an ingredient
    sitting unused in its own corpus that directly contradicts T5's monolithic
    reading.

    (C) THE SIZE OF THE FREE CHANNEL, EXACTLY. By Gauss's genus theory the
    assigned characters of O are a set of mu quadratic characters, subject to one
    relation, whose joint value on an ideal class determines its image in the
    genus group Cl(O)/Cl(O)^2, an elementary abelian 2-group of rank mu - 1.
    Here mu counts the odd primes dividing Delta_O plus a 2-adic contribution in
    {0, 1, 2} fixed by Delta_O modulo 32; in particular
      mu - 1 <= omega(|Delta_O|) + 1.
    So the free channel carries EXACTLY mu - 1 bits, no more and no fewer, and
    the count is not an estimate: it equals the 2-rank of Cl(O), which is
    independently checkable against the computed group structure at toy scale.

    (D) THE CEILING, AND WHY IT CAN NEVER BE AN EXPONENT. Delta_O divides
    D = t^2 - 4p and |D| < 4p, so by the maximal order of the prime-omega
    function -- RIGOROUS, unconditional --
      omega(|Delta_O|) <= (1 + o(1)) log|Delta_O| / log log|Delta_O|
                       <= (1 + o(1)) log(4p) / log log(4p).
    Hence the vectorization discount obeys
      2^{(mu-1)/2} <= exp(O(log p / log log p)) = p^{o(1)},
    and the residual vectorization cost is sqrt(h / 2^{mu-1}) =
    sqrt(h) x p^{-o(1)} = h^{1/2 + o(1)}. THE EXPONENT 1/4 IS UNTOUCHED, FOR
    EVERY ORDINARY CLASS AND EVERY p, WITH NO HEURISTIC. By Erdos-Kac the
    typical value is far smaller still: omega concentrates at log log|D| with
    spread sqrt(log log|D|), so the typical discount is 2^{O(log log p)} =
    (log p)^{O(1)}.

    (E) THE CONCRETE-COST ROW, SO THE NUMBER IS NOT A GESTURE. At p ~ 2^256
    (a standardised curve size): log(4p) ~ 178, log log(4p) ~ 5.18, so a TYPICAL
    Delta_O has omega ~ 5 and the discount is 2^{2.5} ~ 5.7, against a class
    group h ~ 2 sqrt(p) ~ 2^{129} and a generic meet-in-the-middle vectorization
    at sqrt(h) ~ 2^{64.5}. The arithmetically EXTREME case is
    omega ~ 178/5.18 ~ 34 (a Delta_O that is a product of 34 distinct primes,
    which fits below 2^{258} since the product of the first 34 primes is about
    2^{189}), giving a discount of at most 2^{17.5} ~ 1.9 x 10^5 -- concretely
    meaningful, and still leaving 2^{47} work. Both rows are stated so that
    nobody later quotes the extreme as the typical or the discount as an
    exponent.

    (F) THE UNIQUENESS CLAIM, WHICH IS THE SHARP PART. Cl(O) has other
    exploitable structure -- a smooth part would let Pohlig-Hellman decompose
    the vectorization, and the 4-rank (Redei) refines the 2-torsion. BUT EVERY
    ONE OF THOSE REQUIRES KNOWING THE STRUCTURE OF Cl(O), which costs
    L_{|Delta_O|}(1/2) by Hafner-McCurley and is SUPERPOLYNOMIAL -- the exact
    overhead IDEA-20260807-bbdcf3 discloses as item (iii) of its
    hidden_overhead. The assigned characters are, so far as this corpus records,
    THE ONLY known source of address information that costs poly(log p) and
    requires no class-group precomputation at all; it needs only the
    factorization of Delta_O. So the honest statement of the free-information
    budget is: exactly mu - 1 free bits, and everything beyond them is behind an
    L(1/2) wall.

    (G) WHAT THIS ACTUALLY UNLOCKS, AND IT IS NOT THE NUMBER. T5's own dichotomy
    says a cost-minimising curve is useful only if goodness is "(i) common enough
    to hit by random walking, or (ii) detectable by a LOCAL test evaluable at
    each step of a walk." THE GENUS CHARACTER VECTOR IS THE FIRST CONCRETE
    INSTANCE OF BRANCH (ii) THIS CAMPAIGN HAS. It is evaluable at every step of
    a walk, in polynomial time, from the pair (E_0, E_current), and it partitions
    the class into 2^{mu-1} cosets of known equal size h/2^{mu-1}. Therefore:
      (G1) L1's central question -- is any attack-cost functional non-constant
           across an F_p-isogeny class? -- acquires a FREE STRATIFICATION
           VARIABLE. Every existing L1 measurement can be re-read, and every
           future one recorded, stratified by genus coset. If a cost functional
           correlates with the genus vector, then the minimiser is not merely
           variable but LOCALLY DETECTABLE, T5 branch (ii) is satisfied, and the
           campaign has its first reachable target. If it does not, that is a
           null with a named quantity rather than a shrug.
      (G2) A walk can be steered into a chosen genus coset for free, so the
           reachable set at zero extra cost is a coset, not the whole class.
      (G3) The stratification is orthogonal to volcano level: genus is a
           function of Delta_O and the connecting class, level is a function of
           f_E. Stratifying by both is a two-way table L2 has never built.

    (H) THE SECOND USE: A REAL POSITIVE CONTROL FOR CRITERION C4. GOAL-ENDO-001
    C4 requires every instrument to detect a planted signal and reject a matched
    null, and this campaign's planting has repeatedly been the problem: the
    NULL-C construction behind the published delta > 0 rows is recorded as
    PERMANENTLY UNREPRODUCIBLE (DEC-20260810-56db2d), and the p = 4001 class-mean
    gradient makes additive planting constructive or destructive by sign, an
    instrument property confounded with #E by construction. THE GENUS CHARACTER
    VECTOR IS A PLANT-FREE POSITIVE CONTROL: it is a provably non-constant,
    polynomial-time-computable functional on the isogeny class whose fibre sizes
    are known exactly by a theorem, so it CANNOT be leaked by the instance
    generator -- there is nothing to leak, it is not planted. An L1 instrument
    that cannot detect the genus partition cannot detect anything, and one that
    reports genus structure where mu = 1 (a prime discriminant, zero free bits,
    one genus) is reporting an artifact. That is a two-directional control of
    exactly the shape RQ-INSTR-f8faa0 requires, built from a theorem instead of
    from a construction.

    (I) WHAT IS NOT CLAIMED. No ECDLP exponent moves and none could: the genus
    character is a function of the CURVE PAIR, and k is information about a
    POINT. The lane obstruction "any curve-only statistic is k-independent by
    construction" (DECOMPOSITION L7) applies in full force and this record does
    not evade it. The vectorization discount is real but is p^{o(1)}, and this
    record's own headline is that it is NOT an exponent.

  resource_label: >-
    R3 (End(E) as a ring: Delta_O, its prime factorization, the genus group of
    Cl(O)) composed with R4 (the class-group action on the isogeny class) and R7
    (the Weil pairing that evaluates the characters). A generic group oracle for
    G cannot express "the assigned characters of the orienting order", so none of
    the three is a group-operation output.
  admissibility: admissible
  admissibility_argument: >-
    Admissible on its face. The resource is the genus decomposition of Cl(O),
    evaluated through a pairing on the class-group action. No endomorphism is
    applied to any point of G, so H-ENDO-001's scalar-action filter does not bite;
    the oracle classes closed in KN-FIND-b7e091 (incidence, endomorphism-image)
    are not used, and nothing here proposes a new oracle on G. The record's own
    conclusion is nonetheless that the admissible resource yields p^{o(1)} and
    not an exponent, which is a bounded positive rather than a closure -- and the
    part that matters (G, H) is measurement infrastructure, not an attack.

