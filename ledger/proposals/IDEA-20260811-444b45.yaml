  object_first_candidate:
    tracked_object: >-
      THE GENUS CHARACTER VECTOR chi([a]) in (Z/2)^{mu-1}, the image in
      Cl(O)/Cl(O)^2 of the ideal class connecting a fixed base curve E_0 to the
      current curve -- followed along a walk inside one F_p-isogeny class.
    lossiness: >-
      Genuinely and severely lossy, and compatibly so. The projection discards
      the curve, its j-invariant, its points, the ideal itself, and h/2^{mu-1}
      of the class-group coordinate, retaining mu - 1 bits. It is NOT a change of
      coordinates: the fibres have size h/2^{mu-1}, which is exponentially large,
      so nothing about [a] beyond its genus is recoverable -- this is the
      pigeonhole content and it is a theorem, not an expectation. What is
      discarded is discarded COMPATIBLY with the operation set, because the
      operation set is the Cl(O)-action and chi is a GROUP HOMOMORPHISM
      Cl(O) -> (Z/2)^{mu-1}: the retained part propagates deterministically under
      exactly the operation that could destroy it, which is the strongest form
      the lossy-projection test can return.
    propagation: >-
      One-step propagation is defined, exact, and measurable. An ell-isogeny step
      corresponding to a prime ideal l above ell multiplies the tracked vector by
      chi(l), a fixed element of (Z/2)^{mu-1} computable once per ell from the
      Legendre symbols of ell against the prime discriminant factors of Delta_O.
      So a walk of length n propagates by adding n known vectors mod 2, and the
      one-step rule costs O(mu) bit operations after a one-time table build. The
      propagation can be checked independently against the Weil-pairing
      evaluation of KN-LIT-1013 on the endpoints, which is the instrument's own
      internal consistency test.
    survival_score: >-
      Survives the ENTIRE walk with no degradation whatsoever -- chi is a
      homomorphism, so the tracked object never dissolves along the operation set,
      which is unusual and is why it is worth tracking. It dies not from
      dissolution but from CAPACITY: it carries mu - 1 bits and the address needs
      log2 h ~ (1/2) log2 p bits, so it saturates immediately and forever at
      p^{o(1)}. Naming a projection that survives everything and is nonetheless
      bounded by a counting ceiling is the honest form of this object's score.

  mechanism: >-
    STEP 0 (zero compute, HARD GATE, BLOCKING). Obtain the primary text of
    Castryck-Houben-Vercauteren (arXiv:2210.01160) and of the Castryck-Sotakova-
    Vercauteren predecessor it names, and verify: that the assigned characters
    of the CONNECTING class are evaluable from the two curves alone; that the
    specialisation to ORDINARY elliptic curves over finite fields is as
    transcribed; the exact cost of one evaluation; and what "practically all"
    and "even-order class group" exclude. KN-LIT-1013 is a bulk-seeded abstract
    relay and KN-OPEN-3f7a21 records that this corpus's citation_verified marks
    are unreliable. WITHOUT THIS THE FREE CHANNEL IS UNVERIFIED, though the
    CEILING in (D) survives independently of it, because the ceiling bounds ANY
    genus-derived channel whether or not this particular evaluation works.

    STEP 1 (zero compute). Write (C) and (D) with quantifiers and the 2-adic
    table for mu explicit, and derive the concrete rows of (E) from the stated
    formulas rather than restating them.

    STEP 2 (toy compute, THE BUDGET CENSUS). For a ladder of toy primes,
    enumerate ordinary isogeny classes; factor Delta_O; compute mu from the
    genus-theory rule; compute Cl(O)'s structure EXACTLY by reduced binary
    quadratic forms; and verify that the computed 2-rank equals mu - 1 on every
    instance. THIS IS A KNOWN-ANSWER CALIBRATION: a mismatch is an implementation
    error in one of the two, never a discovery.

    STEP 3 (toy compute, THE CHANNEL TEST). On each class, take random pairs
    (E_0, E'), evaluate the assigned characters by the Weil-pairing method, and
    independently compute the true connecting class by exhaustive search at toy
    scale. Measure how many bits the characters actually pin, against the
    predicted mu - 1. Predicted: exactly mu - 1, no more, no fewer.

    STEP 4 (toy compute, THE DISCOUNT TEST). Run matched meet-in-the-middle
    vectorization twice on the same instance: unrestricted, and restricted to the
    correct genus coset. Measure the operation-count ratio against the predicted
    2^{(mu-1)/2}. This is the measurement that separates the two explanations in
    predictions below.

    STEP 5 (toy compute, THE PAYOFF -- L1 STRATIFICATION). On a fully enumerated
    toy isogeny class, compute the genus coset of every curve, and stratify the
    L1 cost functionals already defined by RQ-ICINV-475b5e (Semaev/Groebner
    solving degree, first-fall degree, relation yield, factor-base decomposition
    probability, Macaulay rank profile) by coset. Test for between-coset variance
    against the campaign's existing matched null. THIS STEP CONSUMES NO NEW
    INSTRUMENT: it is a re-slicing of measurements the campaign already takes,
    which is why it is cheap.

    STEP 6 (zero compute). Record the two-way (genus x volcano level) table
    design for L2 and the C4 control specification for RQ-INSTR-f8faa0 as forward
    guidance. This record changes no campaign document.

  predictions:
    - metric: >-
        agreement between the 2-rank of Cl(O) computed from reduced binary
        quadratic forms and mu - 1 computed from the genus-theory rule applied to
        the factorization of Delta_O, over the Step 2 census
      direction: different
      minimum_effect: >-
        Exact agreement on 100 percent of instances, with no tolerance. This is a
        theorem (Gauss) and a single disagreement means the form-reduction code,
        the factorization, or the 2-adic case table is wrong; halt and repair
        rather than interpret. BASIS - classical genus theory; NOT measured
        anywhere in this campaign.
    - metric: >-
        number of bits of the connecting class pinned by the assigned characters,
        measured against the true class computed by exhaustive search
      direction: different
      minimum_effect: >-
        Exactly mu - 1 bits, on 100 percent of instances. FEWER means the
        Weil-pairing evaluation is not extracting all characters and the
        instrument is incomplete. MORE IS IMPOSSIBLE under (C) and would mean the
        evaluation is using data beyond the characters -- which would be the
        single most valuable outcome here and triggers immediate escalation.
    - metric: >-
        ratio of unrestricted to genus-restricted meet-in-the-middle
        vectorization operation counts, same instance, same unit
      direction: higher
      minimum_effect: >-
        2^{(mu-1)/2} within a pre-registered factor 2 band, at every class with
        mu >= 3 at the largest completed toy size. A ratio of 1 means the
        restriction was not applied and Step 4 is void. A ratio EXCEEDING the
        band, persisting across classes, means a second free layer exists beyond
        the genus group and the free-information budget in (F) is wrong -- which
        is the outcome that reopens the address question. BASIS - the fibres of a
        homomorphism onto (Z/2)^{mu-1} have exact size h/2^{mu-1}, so the
        birthday cost falls by exactly 2^{(mu-1)/2} if the collision constant is
        unchanged; the factor-2 band is PRE-REGISTERED and UNTESTED.
    - metric: >-
        between-genus-coset variance of each L1 cost functional, against the
        campaign's matched random-curve null of the same shape, on a fully
        enumerated toy class
      direction: different
      minimum_effect: >-
        PRE-REGISTERED AS AN OPEN QUESTION WITH BOTH BRANCHES DECLARED. If the
        between-coset variance does not exceed the matched null at the campaign's
        existing family-wise 0.05 (per EXP-INSTR-36c8cf amendment v1's Bonferroni
        design), the genus partition carries no cost information, T5 branch (ii)
        is NOT satisfied by it, and that is a scoped negative naming an exact
        quantity. If it DOES exceed, T5 branch (ii) is satisfied for the first
        time in this campaign and the result goes to an independent
        review-adversarial session before any record states it. BASIS - none.
        This is genuinely open and neither outcome is predicted; that is why it
        is worth measuring.
    - metric: >-
        reported genus structure on classes with mu = 1 (Delta_O a prime
        discriminant, one genus, zero free bits)
      direction: lower
      minimum_effect: >-
        Exactly zero free bits and exactly one coset, on 100 percent of such
        classes. Any reported partition there is an instrument artifact and voids
        every positive elsewhere in the run set.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): primary-text verification of
      KN-LIT-1013 and its named predecessor. STAGE 1 (zero compute): (C), (D),
      (E). STAGE 2 (minutes): the budget census and the 2-rank known-answer
      calibration. STAGE 3 (minutes to hours): the channel test. STAGE 4 (hours):
      the discount test. STAGE 5 (hours): the L1 genus stratification, which
      re-slices existing measurements and adds no instrument. STAGE 6 (zero
      compute): forward guidance.
      THE CHEAPEST VALID DISCRIMINATOR IS STAGE 2 PLUS STAGE 5. Stage 2 is a
      known-answer calibration against a theorem and costs minutes, so it can
      void the instrument before anything expensive runs; Stage 5 is the only
      stage that can change what the campaign does next, and it consumes no new
      instrument because RQ-ICINV-475b5e already computes the functionals it
      stratifies. Stages 3 and 4 are needed to state the p^{o(1)} budget as a
      measured rather than a derived quantity, and can be deferred without
      blocking Stage 5.
    controls:
      - >-
        mu = 1 NULL - a class whose Delta_O is a prime discriminant, so there is
        one genus and zero free bits. The pipeline must report exactly one coset
        and zero pinned bits. BLOCKING.
      - >-
        2-RANK KNOWN-ANSWER CALIBRATION - the group structure of Cl(O) computed
        independently by form reduction must have 2-rank exactly mu - 1. An
        instrument failing this is measuring something else. BLOCKING.
      - >-
        DECAY PARAMETER - mu. The measured discount must fall to 1 as mu falls to
        1, monotonically. A discount that does not decay as the parameter meant
        to destroy it decreases is the canonical artifact tell of
        docs/inventor-protocol.md section 3, and the most likely cause, named in
        advance, is a coset restriction implemented as a filter on an already-
        enumerated list, which would leak the answer.
      - >-
        RESAMPLED-k NULL for Stage 5 - the L1 functionals must be measured with k
        resampled at fixed curve, which is the campaign's canonical artifact
        control (DECOMPOSITION L7). Any genus-cost correlation that survives k
        resampling is about the CURVE and is admissible; any that does not is an
        instrument artifact.
      - >-
        PRESENTATION-INDEPENDENCE - recompute the genus coset from a different
        generator set and a different form-reduction convention. A genuine genus
        is presentation independent; a coset label that changes is a bug.
    required_metrics:
      - per class (t, D, D_0, f, Delta_O, its factorization, mu, h, the full group structure of Cl(O), its 2-rank)
      - per pair (E_0, E'), the evaluated character vector and the true connecting class
      - bits pinned, measured, against mu - 1
      - unrestricted and genus-restricted vectorization operation counts, one unit, and their ratio
      - per curve in the enumerated class, its genus coset and every L1 cost functional
      - between-coset variance of each functional, beside the matched null and the resampled-k null
      - pass or fail of every named control, including the decay curve in mu

  falsification_conditions:
    - >-
      The measured 2-rank of Cl(O) differs from mu - 1 anywhere. Genus theory is
      not in doubt, so this is an implementation error; halt and repair before
      any other number in the run set is trusted.
    - >-
      The assigned characters pin MORE than mu - 1 bits. The free-information
      budget in (C) and the uniqueness claim in (F) are both wrong, a second free
      layer exists, and the address question reopens. ESCALATE to an independent
      review-adversarial session before any record states it.
    - >-
      The measured discount exceeds 2^{(mu-1)/2} persistently across classes.
      Same consequence, reached from the cost side rather than the information
      side; the two routes must agree and their disagreement is itself
      informative.
    - >-
      The measured discount is 1 while the restriction was verifiably applied.
      The composition heuristic H2 is wrong -- the collision constant is not
      preserved under coset restriction -- and the p^{o(1)} figure must be
      restated as an information bound only, not a cost bound.
    - >-
      STAGE 0 finds that the assigned characters of the CONNECTING class are not
      evaluable from the two curves alone, or that the ordinary specialisation
      does not hold. The free channel is unverified and (G) and (H) both fall;
      the CEILING in (D) survives, because it bounds any genus-derived channel
      whether or not this evaluation exists.
    - >-
      Stage 5's between-coset variance exceeds the matched null. This is NOT a
      falsification of the record -- it is the branch the record exists to make
      measurable -- but it triggers GOAL-ENDO-001 pause condition P3's review
      discipline before interpretation, and it must not be reported as an ECDLP
      result, because a curve-side variance is not a speedup.
    - >-
      Toy-scale exact computation of Cl(O)'s structure exceeding budget before
      any class with mu >= 3 is measured. INFRASTRUCTURE outcome under AGENTS.md
      rule 5, recorded as such, never as evidence about the genus channel.

  confounders:
    - >-
      TWO DISCRIMINANTS AGAIN. mu is computed from Delta_O = disc(End_{F_p} E),
      not from D = t^2 - 4p. Curves at different volcano levels in ONE class have
      different Delta_O and therefore different mu and different genus groups.
      Pooling across levels would mix incomparable partitions; the two-way table
      of (G3) exists precisely to avoid this.
    - >-
      SMALL mu AT TOY SCALE. At 16 to 24 bits, omega(Delta_O) is typically 2 or
      3, so 2^{mu-1} is 2 or 4 and a "coset effect" is easy to produce by chance
      from a handful of curves. The mu = 1 null and the decay-in-mu curve are what
      separate the effect from smallness, and no single-class result may be
      reported.
    - >-
      THE 2-ADIC CASE TABLE. mu depends on Delta_O modulo 32 and on whether
      Delta_O is odd, 4 times an odd number, or 8 times an odd number. Getting
      this wrong shifts mu by 1 and hence the predicted discount by sqrt(2),
      which is inside the pre-registered band and would therefore pass unnoticed.
      The 2-rank calibration control is what catches it, and it is blocking for
      that reason.
    - >-
      FACTORIZATION COST IS NOT FREE. Knowing mu requires factoring Delta_O. At
      toy scale this is instant; at 256 bits it is a 258-bit factorization,
      priced by IDEA-20260807-3c6bd8 as routine but not zero. A channel quoted as
      "free" must carry that charge, and this record does so in hidden_overhead.
    - >-
      j = 0 AND j = 1728 CARRY EXTRA UNITS, which change the unit index in the
      class number formula and can change the genus normalisation. Report
      separately, never pool.
    - >-
      CURVE-ONLY STATISTICS ARE k-INDEPENDENT BY CONSTRUCTION. The genus coset is
      a function of the curve pair alone. Any apparent correlation with k in
      Stage 5 is an artifact by construction, which is exactly what the
      resampled-k null tests, and reporting one would be a category error.

  interpretation_limits:
    - >-
      NO ECDLP EXPONENT MOVES AND NONE COULD. The measured quantity is a function
      of curves; k is information about a point. The vectorization discount is
      p^{o(1)} and is stated as such; the record's own headline is that it is not
      an exponent.
    - >-
      The uniqueness claim in (F) -- that assigned characters are the only free
      address channel -- is scoped to what this corpus records. It is a statement
      about the known state of the art, not a theorem, and web verification was
      unavailable this session.
    - >-
      Everything empirical is toy scale, claim_tier toy. The concrete rows in (E)
      are arithmetic from the stated formulas, not measurements, and are labelled
      as such.
    - >-
      Stage 5's stratification is a re-slicing of existing L1 measurements and
      inherits every scope limitation those measurements already carry, including
      the standing targets_uniform restriction of DEC-20260810-5aeeaa: nothing
      measured through targets_uniform may support any within-class or curve-side
      claim in either direction, and a genus stratification of such data would be
      exactly such a claim. Stage 5 therefore requires targets_B data and must
      not be run on the reproduced baseline.
    - >-
      This record proposes no change to any campaign document, no hypothesis
      status, and no completion criterion. (G) and (H) are forward guidance for
      the Coordinator.

  heuristic_assumptions:
    - id: H1
      statement: >-
        DISTRIBUTION OF THE FREE BUDGET. As t ranges over the Hasse interval,
        omega(|t^2 - 4p|) obeys an Erdos-Kac law: for every real z,
        #{t : omega(|t^2 - 4p|) <= log log(4p) + z sqrt(log log(4p))} divided by
        the number of admissible t tends to Phi(z), the standard normal CDF.
        Consequently the typical free budget is mu - 1 ~ log log p and the
        typical discount is 2^{(log log p)/2} = (log p)^{O(1)}.
      rigorous_support: >-
        THE CEILING IS RIGOROUS AND IS WHAT THE RECORD'S MAIN CLAIM RESTS ON:
        omega(n) <= (1 + o(1)) log n / log log n unconditionally, so the discount
        is p^{o(1)} for EVERY instance with no distributional assumption
        whatsoever. H1 is used ONLY to say what is TYPICAL, never to bound the
        worst case. The classical distribution theorem imitated is Erdos-Kac
        (1940) for uniformly random integers, with Halberstam's extension to
        values of an irreducible polynomial as the closer analogue
        [RECALLED, NOT VERIFIED THIS SESSION -- web access unavailable; the
        record does not rely on it, and Step 2's matched null measures the
        discrepancy directly instead of assuming it away].
      validation_plan: >-
        SAMPLING: for ten toy primes on a ladder from 2^14 to 2^28, enumerate
        every admissible t in the Hasse interval (about 4 sqrt(p) values, feasible
        to 2^28), factor |t^2 - 4p| exactly, and record omega and the derived mu.
        SCALE AND PARAMETERS RECORDED: the prime ladder, the count of t per prime,
        and the exact 2-adic rule used for mu.
        COMPARISON DISTRIBUTION: the empirical CDF of
        (omega - log log|D|) / sqrt(log log|D|) against Phi.
        MATCHED NULL, MANDATORY: the same statistic on an equal number of
        uniformly random integers in [1, 4p], processed by identical code.
        Quadratic-polynomial values have biased local densities -- the density of
        ell | t^2 - 4p depends on whether p is a square mod ell -- so a shift
        between the two curves is EXPECTED and is the measurement, not a failure.
        TAIL CHECKS: the maximum observed omega over each interval against the
        maximal-order bound log|D|/log log|D| and against the max-of-M prediction
        under Erdos-Kac; and the minimum, which must include mu = 1 instances
        (prime discriminants) to populate the null control of Step 2.
        TRANSFER ASSUMPTION, STATED EXPLICITLY: log log(2^28) ~ 2.99 against
        log log(2^258) ~ 5.18, so the toy ladder probes the LEFT half of the
        relevant range only. The toy census validates the instrument and the
        local-density bias; it does NOT validate the 256-bit rows of (E), which
        are arithmetic and are labelled arithmetic.
    - id: H2
      statement: >-
        COSET-RESTRICTION COMPOSITION. Restricting a meet-in-the-middle
        vectorization search to a single genus coset reduces the effective search
        space from h to h / 2^{mu-1} and the operation count from c sqrt(h) to
        c sqrt(h / 2^{mu-1}), with the SAME collision constant c.
      rigorous_support: >-
        Pairs a RIGOROUS structural fact -- chi is a group homomorphism
        Cl(O) -> (Z/2)^{mu-1}, so its fibres are exact cosets of Cl(O)^2 and all
        have size exactly h / 2^{mu-1} (Gauss) -- with the standard birthday
        bound sqrt(S) for a collision search in a set of size S. The heuristic
        content is ONLY that c is unchanged, i.e. that the coset inherits the
        pseudorandomness of the walk. That is the same per-attempt-cost times
        inverse-success-probability bookkeeping the campaign already uses.
      validation_plan: >-
        SAMPLING: at least five instance pairs per class, on at least four
        classes per mu value in {2, 3, 4, 5} where toy parameters permit, seeds
        recorded. Measure unrestricted and restricted operation counts in one
        unit and fit the ratio against 2^{(mu-1)/2}.
        COMPARISON: the fitted exponent of the ratio against mu, whose predicted
        slope is 1/2 in log2 space; report the slope with a confidence interval.
        TAIL CHECK: the slowest observed restricted solve against the birthday
        tail for a set of size h / 2^{mu-1}; a restricted search whose tail is
        heavier than the unrestricted one indicates the coset walk is not mixing
        and c is NOT preserved, which is the specific failure mode being hunted.
        DECAY CHECK: at mu = 1 the ratio must be exactly 1; a ratio above 1 there
        means the restriction is doing something other than restricting.

  proof_search_map:
    bottleneck: >-
      The step "the free channel is exactly the genus group and nothing more".
      Everything else is either classical (Gauss, the maximal order of omega) or
      cited (KN-LIT-1013). If a second polynomial-time, precomputation-free
      channel into the address exists -- a 4-rank evaluation without the class
      group structure, a higher-power residue character, or a pairing-derived
      invariant of finer order -- the budget in (C) is a lower bound rather than
      an equality, and the ceiling in (D) is the only thing that survives.
      Attacking the uniqueness claim (F) is the highest-value red-team action
      against this record.
    baseline_embedding:
      parameter_slice: >-
        mu = 1, a prime discriminant. The accounting must degenerate exactly to
        the incumbent: zero free bits, one genus, vectorization at c sqrt(h) with
        no discount. If the general formula sqrt(h / 2^{mu-1}) does not reduce to
        sqrt(h) at mu = 1, the accounting is wrong.
      reproduction_check: >-
        Frozen fixture: three mu = 1 toy classes on which unrestricted MITM
        vectorization is run and its operation count checked against c sqrt(h)
        within 25 percent, with c measured once and frozen; and on which the
        pipeline reports exactly one coset. This validates both the cost model
        and the coset labeller before either is used.
    observation_collision:
      observable: >-
        The genus character vector chi([a]) in (Z/2)^{mu-1}, which is the
        observable carrying every claim in this record.
      distinct_preimage_search: >-
        REQUIRED, AND ITS SUCCESS IS THE CONTENT RATHER THAN A REFUTATION. The
        collision is forced by counting and needs no search: since
        |(Z/2)^{mu-1}| = 2^{mu-1} < h, the pigeonhole principle guarantees at
        least h / 2^{mu-1} classes share any given character vector. That IS the
        information ceiling restated, it holds for the observable
        UNCONDITIONALLY, and it is why the record's conclusion is p^{o(1)} rather
        than an exponent. The search that must actually be RUN is the opposite
        one: two curves in the SAME coset with different values of every L1 cost
        functional, which if abundant means genus does not determine cost and
        Stage 5's negative branch is structurally forced rather than merely
        measured.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the open question "how much of the global address is free?"
          by the exact integer mu - 1, computable from the factorization of
          Delta_O by a fixed rule, and check it against the 2-rank of Cl(O).
        predicted_gain: >-
          Converts an unquantified gate parameter into a decidable integer, and
          makes T5's free-information budget machine-checkable at every instance.
      - transform: stronger_invariant
        proposed_object: >-
          Carry the genus coset ALONGSIDE the volcano level as a two-coordinate
          state on each curve, rather than either alone, and stratify every L1
          and L2 measurement by the pair.
        predicted_gain: >-
          Preserves more state than either lane's own question requires, which is
          the point of the transform: if cost depends on the PAIR but on neither
          coordinate marginally, both lanes' existing single-coordinate
          stratifications would report a null while the effect is present. This
          is a specific, testable way the campaign's standing L1 and L2 negatives
          could be under-powered rather than correct.
      - transform: observable_fiber
        proposed_object: >-
          Hold the character vector fixed and vary the rest of the class-group
          coordinate, then ask whether any intrinsic invariant distinguishes the
          resulting curves.
        predicted_gain: >-
          If nothing distinguishes them, the genus is the whole free story and
          (F) stands. If something does, and it is computable, that something is
          the second free layer and the record's uniqueness claim falls -- the
          most valuable outcome available here.
    quantifier_order: >-
      WHAT IS CLAIMED, WITH THE ORDER EXPLICIT: FORALL p > 3, FORALL ordinary
      E/F_p, FORALL orders O = End_{F_p}(E), THERE EXISTS a fixed integer
      mu = mu(Delta_O) such that FORALL pairs of O-oriented curves in the class
      connected by [a], the assigned characters determine [a] modulo Cl(O)^2 and
      no finer, and the fibre of that determination has size exactly
      h / 2^{mu-1}; AND FORALL p, 2^{(mu-1)/2} <= exp(O(log p / log log p)).
      Note the witness mu depends on the INSTANCE (on Delta_O), which is
      permitted because the ceiling is uniform in the instance -- that is the
      exact place a non-uniform witness could have smuggled in an exponent, and
      it does not, because the maximal-order bound on omega is uniform.
      NOT CLAIMED: that no other free channel exists (that is (F), a state-of-the-
      art statement, not a theorem); that the discount is achievable in cost
      rather than only in information (that is H2, measured in Stage 4); anything
      about ECDLP.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The assigned characters of O determine the connecting ideal class
        modulo Cl(O)^2 and no finer, carrying exactly mu - 1 bits, so any
        vectorization discount derived from them is at most 2^{(mu-1)/2} =
        p^{o(1)} and the p^{1/4} exponent is untouched." It can NEVER certify
        that vectorization is hard, that no other channel exists, that the ECDLP
        is hard, or anything about points. The specific overclaim to guard
        against is dropping "derived from them" and reporting the ceiling as a
        bound on all vectorization discounts.
      nearby_object_control: >-
        A CLASS GROUP WITH A LARGE SMOOTH PART, where the desired conclusion
        FAILS: there Pohlig-Hellman over Cl(O) gives a genuine and possibly large
        discount. The method must NOT close that case -- and it does not, because
        that discount requires the L(1/2) structure computation, which is exactly
        the distinction (F) draws. A version of the argument that also bounds the
        smooth-part discount at p^{o(1)} proves too much, has confused
        "information available for free" with "information available at all", and
        is void. This control is the sharpest check on whether (F) is a real
        distinction or a restatement.
    proof_obligations:
      - claim: >-
          Cl(O)/Cl(O)^2 is elementary abelian of rank mu - 1, with mu the number
          of assigned characters of Delta_O given by the classical 2-adic rule.
        responsibility: correctness
      - claim: The assigned characters are exactly the dual of the genus group.
        responsibility: correctness
      - claim: >-
          omega(n) <= (1 + o(1)) log n / log log n, unconditionally, hence
          2^{(mu-1)/2} = p^{o(1)}.
        responsibility: size
      - claim: >-
          The fibres of chi have size exactly h / 2^{mu-1}, so a collision search
          restricted to one fibre costs c sqrt(h / 2^{mu-1}) with c unchanged.
        responsibility: runtime
      - claim: >-
          Every free-address channel other than the assigned characters recorded
          in this corpus requires the structure of Cl(O), at cost
          L_{|Delta_O|}(1/2).
        responsibility: scope
      - claim: >-
          Unrestricted MITM vectorization costs c sqrt(h) with c measured and
          frozen.
        responsibility: baseline
      - claim: The mu = 1 null reports one coset and zero pinned bits.
        responsibility: interface
      - claim: >-
          A between-coset variance in an L1 functional survives the resampled-k
          null.
        responsibility: success_probability

  reachability_gate: >-
    THIS RECORD IS ABOUT T5 AND ITS RESULT IS TWO-SIDED, WHICH IS WHY IT IS
    FILED. On the COST side the gate holds: the free channel is p^{o(1)}, so
    reaching a specified curve still costs h^{1/2 + o(1)} = p^{1/4 + o(1)} and
    no exponent moves. On the STRUCTURE side the gate is materially informed:
    T5's branch (ii) -- goodness detectable by a local test evaluable at each
    step of a walk -- has, for the first time in this campaign, a concrete
    instantiation, because the genus character vector is exactly such a test and
    it is free. The campaign has been treating branch (ii) as hypothetical. It is
    not. Whether it HELPS is precisely the open question Stage 5 measures, and
    both of its outcomes are declared in advance in predictions. Note the
    asymmetry that keeps this honest: a free local test only helps if the cost
    functional actually correlates with what the test measures, and this record
    predicts nothing about that.

  target_complexity:
    time_exponent: >-
      ECDLP: UNCHANGED at 1/2; no exponent is claimed or moved, and the mechanism
      is curve-side so none could be. VECTORIZATION on an ordinary F_p isogeny
      class: c sqrt(h) / 2^{(mu-1)/2} = h^{1/2 + o(1)} = p^{1/4 + o(1)} against
      the incumbent c sqrt(h) = p^{1/4}. The discount is a factor, explicitly
      bounded at p^{o(1)} by (D), and typically (log p)^{O(1)} by H1.
    memory_exponent: >-
      The genus-restricted MITM stores sqrt(h / 2^{mu-1}) = p^{1/4} / 2^{(mu-1)/2}
      entries against the incumbent sqrt(h) = p^{1/4}, so memory falls by the SAME
      factor as time -- this is a strict Pareto improvement on both axes if H2
      holds, and it is stated as such rather than reported only on time. The
      character evaluation itself is O(mu) bits of state, negligible. A
      kangaroo / van Oorschot-Wiener variant trades back to O(1) memory at
      sqrt(h^3 / w) as usual, and the coset restriction composes with it by
      shrinking h.
    best_known: >-
      Vectorization on an ordinary F_p class: ~sqrt(#Cl(O)) classical
      (KN-TECH-027; Galbraith-Hess-Smart lineage with the improved walk of
      KN-LIT-317). Prime-field ECDLP: parallel rho at 0.886 sqrt(N) time and O(1)
      memory (KN-TECH-001, KN-TECH-006); BSGS at sqrt(N)/sqrt(N) (KN-TECH-031);
      automorphism-discounted rho at 0.886 sqrt(N/|Aut|), |Aut| <= 6
      (KN-TECH-018).
    hidden_overhead: >-
      Four items, all disclosed. (i) Knowing mu requires FACTORING Delta_O -- at
      256 bits a 258-bit factorization, routine but not zero, and priced by
      IDEA-20260807-3c6bd8. A channel called "free" that needs a factorization is
      not free and this record says so. (ii) The Weil-pairing evaluation of each
      character is polynomial but its constant is unextracted until Stage 0 reads
      the primary text. (iii) KN-LIT-1013's own hedge, "practically all oriented
      elliptic curves that are acted upon by an EVEN-ORDER class group" -- classes
      with mu = 1 have odd class number in the relevant sense and get ZERO bits,
      so the channel is empty on a real subfamily and the campaign must not
      average over it. (iv) The discount is stated in INFORMATION; converting it
      to COST is H2, and if the collision constant is not preserved under coset
      restriction the cost discount is smaller than the information discount.
    tradeoff_note: >-
      Because the discount shrinks the search SET rather than the search method,
      it multiplies into every point of the existing time-memory curve: van
      Oorschot-Wiener at sqrt(h^3/w) with memory w becomes
      sqrt((h/2^{mu-1})^3 / w), and n-fold parallelisation is unaffected. This is
      the pleasant case where a structural discount composes cleanly with the
      tradeoff, and it is worth recording precisely because the record's headline
      is that the discount is small: a small discount that composes everywhere is
      still worth exactly its p^{o(1)} and no more.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES AGAINST EVERY ROW OF THE
    FRONTIER; NOT NULL. As an ECDLP attack this record mounts none and is
    dominated by parallel rho with distinguished points (0.886 sqrt(N) time, O(1)
    memory; KN-TECH-001, KN-TECH-006), by BSGS (sqrt(N)/sqrt(N); KN-TECH-031), by
    automorphism-discounted rho (KN-TECH-018), and by kangaroo on a known
    interval. As a VECTORIZATION procedure the genus-restricted MITM is NOT
    dominated by the incumbent sqrt(#Cl) row (KN-TECH-027, KN-LIT-317): it
    improves both time and memory by the same factor 2^{(mu-1)/2} and consumes no
    additional data or queries beyond the factorization of Delta_O. THAT IS A
    STRICT, IF TINY, PARETO IMPROVEMENT ON THAT ONE ROW, and I state it as such
    rather than rounding it to zero. WHETHER IT IS NEW AGAINST THE EXTERNAL
    LITERATURE IS UNKNOWN AND UNVERIFIABLE THIS SESSION: composing a free genus
    computation with a class-group meet-in-the-middle is an obvious step and may
    well be published; KN-LIT-1013's stated application is DDH-breaking, not
    vectorization pruning, but its abstract also mentions improving the worst
    cases of a reduction from vectorization to the endomorphism-ring problem,
    which is adjacent enough that a published version is plausible. NO PRIORITY
    IS CLAIMED.
  sota_delta: >-
    Zero speedup on ECDLP: 0.886 sqrt(N) before and after, and no exponent is
    approached. On vectorization, a factor 2^{(mu-1)/2} on BOTH time and memory,
    where mu - 1 is the 2-rank of Cl(O): concretely 5.7x at a typical 256-bit
    parameter (omega ~ 5) and at most 1.9 x 10^5 in the arithmetically extreme
    case (omega ~ 34), against a search of size 2^{64.5}. The record's other
    non-zero quantitative content is three exact statements: (i) the free
    address budget is EXACTLY mu - 1 bits, not an estimate, checkable against the
    2-rank; (ii) it is bounded by (1 + o(1)) log p / log log p uniformly, hence
    p^{o(1)}, hence never an exponent, unconditionally; (iii) every other known
    address channel in this corpus sits behind an L_{|Delta_O|}(1/2) wall, so
    (i) is the whole free story. The non-quantitative content, and the reason to
    run it, is that T5 branch (ii) acquires its first instantiation and lane L1
    acquires a free stratification variable and a plant-free C4 control.

