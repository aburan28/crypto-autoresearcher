  null_object_control: >-
    MANDATORY AND BLOCKING, in both directions, and unusually strong here because
    the positive control is a THEOREM rather than a plant.
    FORCED NULL - a class with mu = 1 (prime discriminant, one genus, zero free
    bits). The pipeline must report exactly one coset, zero pinned bits, and a
    discount of exactly 1. Any structure reported there voids every positive.
    PLANTED-FREE POSITIVE - the genus partition itself, on a class with mu >= 3.
    Its existence, its coset count 2^{mu-1}, and its exact fibre sizes
    h / 2^{mu-1} are all forced by Gauss's theorem, so unlike every prior
    positive control in this campaign IT CANNOT BE LEAKED BY THE INSTANCE
    GENERATOR -- there is no construction to leak. An instrument that fails to
    detect it is blind and every null it reports is void.
    DECAY PARAMETER - mu. Both the pinned-bit count and the measured discount
    must decay monotonically to zero and to 1 respectively as mu falls to 1. A
    quantity that fails to decay when the parameter meant to destroy it decreases
    is the canonical artifact tell of docs/inventor-protocol.md section 3.
    MATCHED NULL OF THE SAME SHAPE for Stage 5 - the campaign's existing
    matched random-curve null at the same p, plus the resampled-k null at fixed
    curve, both applied to the stratified statistics rather than to the pooled
    ones.

  assumptions:
    - >-
      [open, STAGE-0 BLOCKING for the CHANNEL, not for the CEILING] KN-LIT-1013's
      transcription is faithful: the assigned characters of the CONNECTING class
      are evaluable in polynomial time from the two O-oriented curves alone, and
      the ordinary-over-finite-field specialisation holds. The corpus entry is a
      bulk-seeded abstract relay. The ceiling in (D) does not depend on this and
