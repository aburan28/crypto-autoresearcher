idea:
  id: IDEA-20261006-22a686
  question_id: RQ-SDEG-001
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Declared grevlex order x1 greater than x2 and the swapped order
    either share a solving degree or the declared order is harder by
    at least one, on one F_29 cell
  class: measurement
  claim: >-
    On one ordinary short-Weierstrass curve over F_29, one factor base
    of B = 4 abscissae, and twelve S_3 targets, let D be the mean
    grevlex solving degree with variable order x1 > x2, minus the mean
    with variable order x2 > x1. Either the absolute value of D is
    strictly less than 1, or D is at least 1. Absolute difference
    strictly less than 1 means the two variable orders share a degree.
    D at least 1 means the declared order is the harder one. A finished
    D at most -1 is the concrete negative: the swapped order is harder
    by at least one degree, and the disjunction does not allow that
    sign. Both orders are grevlex. This is not a lex comparison.
    Representation class R1; attack stage is the monomial order inside
    relation decomposition. No exponent is moved.
  mechanism: >-
    The tracked object is the pair of means of d_solve under two
    grevlex variable orders on the same specialized S_3 systems. The
    polynomials, the base, and the targets stay fixed. Only the
    variable order changes. Representation: R1, the coefficient array
    of S_3 and of the degree-B membership polynomials. Operation set
    Sigma: the grevlex solver under each variable order. Sigma is not
    group translation. Trichotomy class: coordinate-dependent, because
    a variable order is a property of the polynomial representation.
    Lossy projection against Sigma: D discards which reducers were
    built and keeps one number. The priced open number is D, with
    separator 1 and with the sign constrained.
  novelty_status: unverified
  citations:
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        S_3 has degree 2 in each variable. That degree pattern does
        not choose a variable order.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-IC-0d2021
      provenance: internal
      claim: >-
        Degree-of-regularity refinements for semi-regular sequences do
        not state a variable-order gap for prime-field S_3.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-0d2021.yaml
    - ref: KN-OPEN-002
      provenance: internal
      claim: >-
        Prime-field solving-degree growth is open. A variable-order
        split is a possible confounder of a single growth curve.
      verified_by: knowledge/open-problems/KN-OPEN-002.md
  assumptions:
    - >-
      Both runs use grevlex. One uses x1 > x2. The other uses x2 > x1.
      No lex order is computed.
    - >-
      The same twelve targets, the same curve, and the same factor
      base are solved twice.
    - >-
      d_solve is the maximum total degree constructed, including
      reducers. A missing transcript is void and is not entered as 0.
  predictions:
    - metric: >-
        mean d_solve under grevlex with x1 > x2, minus the mean under
        grevlex with x2 > x1, on the F_29, B = 4 cell
      direction: different
      minimum_effect: >-
        absolute difference strictly less than 1 supports one shared
        degree; difference at least 1 supports the declared order as
        the harder order. A finished difference at most -1 is the
        concrete negative.
  minimal_test:
    design: >-
      On one ordinary curve over F_29, draw one factor base of size 4
      and twelve targets. Solve each S_3 system twice, once in each
      grevlex variable order. Compare the two means by an exact integer
      test. A second build recomputes the declared order on every
      target.
    controls:
      - >-
        The polynomials are identical across the two orders. Only the
        variable order changes.
      - >-
        Twenty support-matched random systems, solved in both orders.
        If the random difference matches the S_3 difference to within
        strictly less than 1, and that difference is at least 1, the
        gap is the support.
      - >-
        The second build of the declared order must match every
        per-target integer.
    required_metrics:
      - twelve pairs of degrees
      - the integer difference of means
      - random-arm difference
      - second-build match
  falsification_conditions:
    - >-
      The twelve targets are complete and D is at most -1. The swapped
      order is harder. That is the concrete negative.
    - >-
      The absolute difference is at least 1 on a first block of six
      targets and strictly less than 1 on the second block of six. The
      gap is then a sample split and is not a law for the cell.
    - >-
      The random arm reproduces a difference of at least 1 to within
      strictly less than 1. The variable order is then not a summation
      effect.
  confounders:
    - >-
      A tie-breaking rule inside grevlex that secretly changes with the
      variable names can imitate an order effect. The two orders are
      defined by the exponent comparison alone, and the second build
      must match.
    - >-
      Inconsistent systems can report a degree that is the degree of
      the constant 1 rather than of a reducer. The transcript rule is
      the same in both orders.
  interpretation_limits:
    - >-
      One prime and B = 4. Agreement here does not imply agreement at
      larger B.
    - >-
      This does not compare grevlex with lex, and it does not use
      F_17.
    - >-
      A gap of at least 1 is a statement about degrees on this cell.
      It is not a bit-security claim.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For uniform targets at p = 29 and B = 4, the grevlex solving
        degree of an ordinary S_3 system is independent of which
        variable is declared larger, up to a mean gap strictly below 1.
      rigorous_support: >-
        No identity in the opened degree pattern KR-IC-5a43e5 forces
        the two variable orders to agree. The assumption imitates the
        model in which a graded order's variable permutation does not
        change the maximum degree for a system whose variables are
        symmetric in the summation polynomial before the target is
        specialised. Specialising one variable breaks that symmetry.
        The measurement asks whether the break reaches one degree.
        No transfer beyond this cell is assumed.
      validation_plan: >-
        Score twelve targets at p = 29, B = 4, in both orders. The
        tail check is the maximum per-target absolute difference of
        the two degrees. Parameters stop at this cell.
  target_complexity:
    time_exponent: >-
      not beaten. Pollard rho remains Theta(N^{1/2}) group operations.
    memory_exponent: >-
      not beaten. A variable-order gap at toy size is not a memory
      exponent.
    best_known: >-
      Pollard rho at Theta(N^{1/2}); KR-IC-5931ee is the prime-field
      Semaev comparison under its stated assumptions.
    hidden_overhead: >-
      None claimed. An order gap, if it appears, is a measured
      difference of means on one cell.
    tradeoff_note: >-
      No time-memory tradeoff is proposed.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-5a43e5
      - KR-IC-5931ee
      - KR-IC-0d2021
      - KR-IC-e847d1
    nearest:
      - ref: KR-IC-0d2021
        provenance: internal
        relation: orthogonal
        delta: >-
          That row refines degree-of-regularity estimates. This idea
          measures a mean gap between two grevlex variable orders at
          p = 29, B = 4, with separator 1 and with the swapped order
          harder as the concrete negative. It adds no regularity
          formula.
      - ref: KR-IC-5a43e5
        provenance: internal
        relation: adjacent
        delta: >-
          The degree pattern does not select x1 > x2. The separator
          added here is a mean difference of solving degrees under
          two grevlex orders on twelve F_29 targets.
      - ref: KN-OPEN-002
        provenance: internal
        relation: adjacent
        delta: >-
          A growth curve that used one variable order can be
          confounded by the other. This idea tests that confounder
          on one cell and does not fit an exponent.
    searched:
      corpus_grep:
        - question_id RQ-SDEG-001 titles on origin/main and on PRs 1936 and 1937
        - grevlex variable order in the opened frontier rows
      web:
        - not performed this session
      blocked:
        - lex versus grevlex at F_17
        - hit versus miss means
  dominated_by: >-
    Pollard rho at Theta(N^{1/2}) group operations, checked against
    KR-IC-5931ee. No attack result is claimed. A toy order gap does
    not change that baseline.
  sota_delta: >-
    Exponent delta is 0 against Theta(N^{1/2}) time and against
    polylog rho memory. The separator is a mean difference strictly
    below 1 in absolute value, or at least 1 with the declared order
    harder, against a finished difference at most -1, at p = 29,
    B = 4, twelve targets.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: >-
        The swapped grevlex order on the same systems is the baseline.
      reproduction_check: >-
        A second build reproduces the declared-order degree on every
        scored target.
    observation_collision:
      observable: mean d_solve
      distinct_preimage_search: >-
        Several targets may share a degree. The collision is recorded
        and is not a discrete-log relation.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: targets with a given degree under one order
        predicted_gain: none as an attack
    quantifier_order: >-
      Empirical means on one declared cell. No attack quantifiers.
    method_ceiling:
      strongest_certifiable_claim: >-
        On this cell the two means lie on one side of the threshold 1,
        or the swapped order is harder by at least 1.
      nearby_object_control: support-matched random systems solved in both orders
    proof_obligations:
      - claim: no theorem is offered
        responsibility: scope
    not_applicable_reason: >-
      Order-comparison measurement. The random arm is the nearby object.
