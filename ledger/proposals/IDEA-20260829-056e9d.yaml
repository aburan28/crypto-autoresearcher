idea:
  id: IDEA-20260829-056e9d
  question_id: RQ-ALISO-001
  status: proposed
  proposed_by: idea-generator
  added: '2026-08-29'

  title: >-
    Wesolowski's Heuristic 1 tracks ONE lattice vector; the Autolab ALISO degree
    Gram tracks the whole low-degree spectrum. Replacing the smallest conjugate
    degree by the N smallest predicts the superpolynomial o(1) overhead drops
    from rho^{-1} to rho^{-2/3}, and the same measurement decides whether
    Hom(E,E^{(p)}) is effectively ternary of determinant Theta(p)

  class: composition

  claim: >-
    (A) THE OBJECT. Wesolowski's Heuristic 1 and Lemma 3.5 use exactly one
    number: the degree of the SMALLEST isogeny E -> E^{(p)}. Remark 1 of the same
    paper states that this is not expected to be optimal, because "there are
    generally multiple small (non-cyclic) isogenies E -> E^{(p)}, and it is
    sufficient for any one of them to be smooth", and that the phenomenon "is
    absorbed in the hidden term of the asymptotic complexity". This proposal
    replaces the single minimum by the CONJUGATE DEGREE SPECTRUM Sigma_N(E): the
    N smallest degrees represented by Hom(E, E^{(p)}), with multiplicity and with
    their prime factorizations. That is precisely the object the imported Autolab
    package EXP-ALISO-001 already computes at p = 101051 - fields degree_gram (a
    3x3 Gram matrix), degree_gram_determinant "101051/4", enumeration_radius 13,
    first_represented_degree 36, first_represented_count 4, represented_count 798
    up to max_degree 2048.

    (B) THE COUNT, AND WHY IT IS FORCED. If the degree form on Hom(E,E^{(p)})
    behaves as a positive TERNARY form of determinant Theta(p), the lattice-point
    count is r(D) = Theta(D^{3/2} p^{-1/2}), so r(D) = 1 at D = Theta(p^{1/3}) -
    consistent with Theorem 1.5 of the in-repo text (an isogeny of degree at most
    (p/2)^{1/3} always exists) and with the single in-repo instance: at
    p = 101051, (p/2)^{1/3} = 36.95 and the recorded first represented degree is
    36. If instead the governing form were QUATERNARY of determinant Theta(p^2),
    the count would be r(D) = Theta(D^2/p), giving a typical smallest degree of
    Theta(p^{1/2}) - which would CONTRADICT the unconditional guarantee of
    Theorem 1.5. So the ternary shape is forced by the combination of Theorem 1.5
    with any consistent counting law, and the same enumeration that measures the
    spectrum decides the rank/determinant question outright. Both readings are
    stated here because this proposal did not read the Aubry-Oyono-Vincent paper
    and does not assert which lattice Autolab's 3x3 Gram is.

    (C) THE QUANTITATIVE CONSEQUENCE. Taking the N smallest degrees requires a
    degree budget D_N = Theta(N^{2/3} p^{1/3}). Running Wesolowski's Algorithm 2
    with degree budget D costs X = (B D)^{1/2} per side and table
    Psi(X,B) X^{1+o(1)} = D^{1+o(1)} when B = p^{o(1)}; so per-attempt cost is
    N^{2/3} p^{1/3+o(1)}. Under the independence heuristic H1 below, per-attempt
    success probability is min(1, N rho) with rho = u^{-u(1+o(1))}. Expected total
    cost is therefore N^{2/3} p^{1/3+o(1)} / min(1, N rho), minimised at
    N* = ceil(1/rho), giving rho^{-2/3} p^{1/3+o(1)} against the baseline
    rho^{-1} p^{1/3+o(1)}. THE PREDICTED EFFECT IS A FACTOR rho^{1/3} IN TIME,
    PAID FOR BY A FACTOR rho^{-2/3} IN MEMORY. With the paper's
    B = e^{(1/3) sqrt(log(p/2))}, u = sqrt(log(p/2)), at p ~ 2^256 the arithmetic
    log(p/2) = 176.6, u = 13.29, u^u = e^{34.4}, gives rho^{-1} ~ 2^{49.6} and a
    predicted time factor 2^{-16.5} for a memory factor 2^{+33.1}. THIS
    ARITHMETIC IS MINE, DERIVED FROM THE PAPER'S FORMULAS; IT IS NOT THE PAPER'S
    SECTION 4.1 TABLE, WHICH RE-OPTIMISES B AND REPORTS 2^{106.5} TIME AND
    2^{92.5} MEMORY AT THAT SIZE.

    (D) WHAT IS AND IS NOT CLAIMED. The asymptotic exponent 1/3 is UNCHANGED.
    This is an o(1)-overhead and time-memory-rebalancing claim, and by the
    standard of docs/target-result-profile.md rule A1 it is explicitly NOT
    target-class. It is offered because the overhead it attacks is the exact
    quantity the paper names as the practical obstacle - "the overhead hiding in
    the o(1) term is superpolynomial, much larger than the previous (log p)^{O(1)}
    cofactor" - and because it is decided by a measurement the corpus is already
    tooled for.

  mechanism: >-
    Smoothness is a property of an integer, and the algorithm needs only that
    SOME reachable conjugate isogeny have smooth degree. Restricting attention to
    the single minimal degree throws away every other lattice vector in the same
    shell. Enlarging the search radius from lambda_1 to D_N buys N candidate
    degrees at a cost that grows only as D_N = N^{2/3} p^{1/3}, because the ball
    volume in a ternary form grows as D^{3/2}. The success probability, if the
    candidates are independent, grows as N. Since cost grows as N^{2/3} and
    benefit as N^{1}, the trade is favourable until the probability saturates at
    1, which happens at N = 1/rho. The whole gain is therefore bounded by rho,
    which is p^{o(1)} - hence no exponent movement - but rho is superpolynomially
    large, so the bounded gain is nonetheless the dominant practical term. The
    mechanism fails exactly if the candidate degrees are NOT independent with
    respect to smoothness, and there is a concrete reason to fear that: they are
    values of one quadratic form at nearby lattice points, so they can share
    small prime factors forced by the local (genus) conditions of the form. That
    is the competing explanation, and it is directly measurable.

  novelty_status: unverified

