  assumptions:
  - The degree form on Hom(E, E^{(p)}) is a positive definite integral quadratic
    form whose short vectors can be enumerated by standard lattice enumeration
    once a basis is available. Basis availability at cryptographic p comes only
    from the Deuring shortcut of the in-repo section 4.2, never from the curve.
  - B-smoothness of an integer of size D_N can be decided by full factorization
    within budget at the sampled sizes. At D_N ~ N^{2/3} p^{1/3} with
    p = 5*2^248-1 this is an 84-bit integer, factorable individually but not
    trivially in bulk; the experiment budget must reflect that.
  - The identity Psi(X,B) X^{1+o(1)} = D^{1+o(1)} for B = p^{o(1)} and
    X = (BD)^{1/2}, used in claim (C), follows from Theorem 1.4 as stated in the
    in-repo text and is re-derived symbolically as part of the test, not assumed.

  proof_search_map:
    bottleneck: >-
      The inverse success probability P0^{-1} = rho^{-1} = u^{u(1+o(1))} in the
      proof of Theorem 1.1. It multiplies the per-attempt cost directly and is
      the sole superpolynomial factor in the algorithm. Removing or reducing it
      changes no exponent in p but changes the concrete cost by a superpolynomial
      factor, and it is the term the paper itself names as the practical
      obstacle.
    baseline_embedding:
      parameter_slice: >-
        N = 1 reproduces Wesolowski exactly: D_1 = (p/2)^{1/3} is Theorem 1.5's
        bound, X = B^{1/2}(p/2)^{1/6} is the paper's line 1 of Algorithm 2, the
        table is Psi(X,B) X^{1+o(1)} = p^{1/3+o(1)}, and the success probability
        is Lemma 3.5's u^{-u(1+o(1))}. The proposal is a one-parameter family
        containing the baseline at its boundary.
      reproduction_check: >-
        Symbolic: substitute N = 1 into the general cost expression
        N^{2/3} p^{1/3+o(1)} / min(1, N rho) and require it to reduce term by
        term to the expression in the paper's proof of Theorem 1.1, including the
        intermediate values X = p^{1/6+o(1)} and Psi(X,B) = p^{1/6+o(1)}. Frozen
        fixture: recompute u = sqrt(log(p/2)), B = e^{(1/3)sqrt(log(p/2))},
        X = B^{1/2}(p/2)^{1/6} at the five sizes in section 4.1 (256, 384, 512,
        576, 768 bits) and require the reproduced M = Psi(X,B) X to sit within
        the stated inequality direction of the published lower bounds
        (2^{92.5}, 2^{138.6}, 2^{181.3}, 2^{206.0}, 2^{272.2}). A reproduction
        that lands BELOW a published lower bound is an implementation error and
        halts the experiment.
    observation_collision:
      observable: >-
        "Was any of the N smallest conjugate degrees B-smooth?" - a single bit
        per (curve, N, B) triple.
      distinct_preimage_search: >-
        The bit collides massively by construction: a curve whose N smallest
        degrees are N independent random-looking integers and a curve whose N
        smallest degrees are all multiples of one fixed small integer m (so that
        their smoothness is almost perfectly correlated) can produce the SAME bit
        at a given B. The bit therefore does not identify independence, and an
        experiment that reports only the bit cannot answer the question. The
        separating condition, which this design adds, is the JOINT statistic:
        the empirical slope d log P(N) / d log N over a range of N, plus the
        distribution of gcd over the spectrum and the distribution of the largest
        prime factor of each of the N degrees separately. This collision is the
        reason the required metrics below include per-degree factorizations and
        not just success indicators.
    constructive_transforms:
    - transform: baseline_as_boundary_lift
      proposed_object: >-
        The one-parameter family indexed by N, with N = 1 the published baseline
        and the claim being STRICT inward improvement in expected cost for
        1 < N <= 1/rho, not mere feasibility.
      predicted_gain: 'Expected-cost factor rho^{1/3}; asymptotic exponent unchanged.'
    - transform: stronger_invariant
      proposed_object: >-
        Carry the whole spectrum Sigma_N(E) with factorizations rather than the
        single bit "smallest degree is smooth", because the spectrum is what
        survives when the algorithm is iterated over rerandomised curves and it
        is what exposes the correlation failure mode.
      predicted_gain: >-
        Turns an unmeasurable o(1) into a measurable slope; makes the negative
        outcome informative rather than silent.
    quantifier_order: >-
      For all eps > 0, for all B in the paper's uniformity range, there exists
      p_0 such that for all p > p_0: for a uniformly random supersingular
      E/F_{p^2} and for all N with 1 <= N <= p^{eps}, the probability that at
      least one of the N smallest degrees of isogenies E -> E^{(p)} is B-smooth
      is at least (1 - o(1)) min(1, N rho(u_N)). CRITICAL ORDER NOTE: N is
      quantified INSIDE the probability over E and may not be chosen per curve.
      An adversary who selects N after seeing E can trivially inflate the
      measured probability, so the experiment fixes the N-grid before sampling
      and reports every N on the grid, including those where the prediction
      fails.
    method_ceiling:
      strongest_certifiable_claim: >-
        A Deuring-shortcut sampling experiment can certify the empirical joint
        distribution of the N smallest reduced norms in the two-sided ideal P and
        their factorizations, at the sampled p and sample size, and can certify a
        slope with a confidence interval. It CANNOT certify Heuristic 1 or its
        multiplicity-corrected form, cannot certify any complexity statement, and
        cannot rule out a p-dependent crossover beyond the sampled sizes. It also
        cannot distinguish "independent" from "weakly dependent with the same
        first-order slope".
      nearby_object_control: >-
        The nearby object on which the hoped-for conclusion must fail is a
        lattice engineered to have correlated shells: take a ternary form of the
        same determinant scaled so every represented value is divisible by a
        fixed prime q (e.g. q times a form of determinant Theta(p/q^3)). Its
        spectrum has the same shape and the same count law but its smoothness
        probabilities are strongly correlated. If the analysis pipeline reports
        the same slope for this control as for the real degree form, the pipeline
        is measuring the count law and not the independence, and the whole
        experiment is uninformative. This control is mandatory and is listed in
        minimal_test.
    proof_obligations:
    - claim: 'r(D) = Theta(D^{3/2} p^{-1/2}) for the degree form, with the constant measured, hence D_N = Theta(N^{2/3} p^{1/3}).'
      responsibility: size
    - claim: 'Algorithm 2 with degree budget D costs D^{1+o(1)} time and memory when B = p^{o(1)}.'
      responsibility: runtime
    - claim: 'Correctness of Lemma 3.4 is preserved when the target isogeny is any of the N smallest rather than the smallest, including the cyclic-kernel requirement.'
      responsibility: correctness
    - claim: 'Per-attempt success probability is min(1, N rho(u_N)) under H1.'
      responsibility: success_probability
    - claim: 'The rank and determinant of the effective lattice are ternary and Theta(p), not quaternary and Theta(p^2).'
      responsibility: interface
    - claim: 'The o(1)-overhead claim is scoped to concrete cost and never presented as an exponent improvement.'
      responsibility: scope

  predictions:
  - metric: >-
      slope s = d log P(N) / d log N, where P(N) is the empirical fraction of
      sampled maximal orders for which at least one of the N smallest reduced
      norms in P is B-smooth, measured over the grid N in {1,2,4,8,16,32,64} at
      fixed B
    direction: higher
    minimum_effect: >-
      Independence predicts s = 1.0 in the regime N rho << 1. The decision
      thresholds are s >= 0.8 (independence branch, gain survives) versus
      s <= 0.5 (correlation branch, gain largely destroyed). The 95% CI must
      exclude one of them; a CI straddling both is an inconclusive run.
  - metric: >-
      exponent alpha in D_N ~ N^{alpha} p^{1/3}, fitted from the measured N-th
      smallest reduced norm across the same samples
    direction: different
    minimum_effect: >-
      Predicted alpha = 2/3 from the ternary count law. |alpha - 2/3| <= 0.05
      confirms the ternary reading; alpha near 1/2 indicates the quaternary
      reading and would contradict Theorem 1.5 as argued in claim (B), which
      would itself be a significant and reportable inconsistency.
  - metric: >-
      exponent gamma in lambda_1 ~ p^{gamma}, the smallest reduced norm, fitted
      across at least three widely separated p
    direction: different
    minimum_effect: >-
      Predicted gamma = 1/3, matching Theorem 1.5 being tight on average. A
      measured gamma below 1/3 by more than 0.02 would be an exponent-moving
      finding (it would allow X to be reduced and the cost to fall below
      p^{1/3}), and would route immediately to adversarial review. A measured
      gamma above 1/3 contradicts Theorem 1.5 and indicates an implementation
      error.
  - metric: >-
      correlation diagnostics on the spectrum: distribution of
      gcd(d_1, ..., d_N), and the pairwise rank correlation of
      log(largest prime factor) between d_1 and d_i for i = 2..N
    direction: different
    minimum_effect: >-
      Independence predicts median gcd = 1 or 2 and pairwise rank correlation
      within +/-0.05 of zero. A median gcd above 4, or a rank correlation above
      0.2, is the mechanism of the correlation branch and must be reported even
      if the slope test is inconclusive.
  - metric: >-
      predicted concrete time factor rho^{1/3} and memory factor rho^{-2/3} at
      p = 2^256, computed under the section 4.1 cost model with B re-optimised
      for each N
    direction: lower
    minimum_effect: >-
      A predicted time reduction of at least a factor 2^{10} at p = 2^256 is the
      threshold for calling the rebalancing practically interesting; below that
      the proposal is a bookkeeping refinement and should be recorded as such.

  minimal_test:
    design: >-
      Stage 0 (no compute, halts the rest if it fails): symbolically verify the
      N = 1 reduction to the published cost expression, and reproduce M =
      Psi(X,B) X at the five section 4.1 sizes. Stage 1 (toy, in-repo
      cross-check): re-derive the spectrum at p = 101051 from the degree_gram
      recorded in EXP-ALISO-001's source result and check r(2048) against the
      recorded represented_count 798 and r(36) against first_represented_count 4;
      this validates the enumeration code against an existing immutable artifact
      before any new sampling. Stage 2 (scale): replicate the in-repo section 4.2
      sampling method - sample maximal orders in B_{p,infinity} uniformly up to
      conjugation, form the two-sided ideal P of reduced norm p, take the
      quadratic form Nrd/p - but enumerate the N smallest vectors rather than
      only the shortest, for N up to 64, at p = 5*2^248-1 with at least 10000
      order samples and at a second, smaller p (about 128 bits) with at least
      10000 samples to give a two-point exponent fit. Factor every recorded norm
      completely. Compute P(N) over a grid of B values spanning the paper's
      uniformity range, the slope s, the exponents alpha and gamma, and the
      correlation diagnostics. Stage 3: run the identical pipeline on the two
      null objects below.
    controls:
    - 'Null object 1 - random integers: replace each spectrum by N independent uniform random integers of the same bit sizes and recompute P(N), s and the correlation diagnostics. This is the independence null; the real data matching it IS the positive branch, and saying so up front prevents reading a null match as a non-result.'
    - 'Null object 2 - correlated-lattice control: the engineered ternary form with every represented value divisible by a fixed prime q, per the method-ceiling entry. The pipeline must report a slope clearly below the random-integer null on this control, otherwise it is not measuring what it claims.'
    - 'In-repo regression fixture: exact agreement with EXP-ALISO-001''s recorded degree_gram, first_represented_degree 36, first_represented_count 4 and represented_count 798 at p = 101051, up to a stated and fixed unit/sign normalisation convention which must be declared BEFORE the comparison.'
    - 'Tail check per docs/target-result-profile.md A7: the smoothest sample among all sampled orders, compared against the predicted rho(u), replicating the paper''s own consistency checks (12589-smooth out of 100000 with predicted 1/69232 at p = 5*2^248-1).'
    - 'Structural tell: the slope s must DECAY toward 0 as N grows past 1/rho, because the probability saturates. A slope that stays at 1.0 for all N on the grid means the saturation regime was never reached and the measured gain is not the claimed one.'
    - 'Seed and sampler disclosure: the maximal-order sampler must be recorded and its uniformity-up-to-conjugation assumption stated as a transfer assumption, since it is inherited from the paper''s method and not independently verified here.'
    required_metrics:
    - P_of_N_per_B_value
    - slope_s_and_ci
    - alpha_fit_and_ci
    - gamma_fit_and_ci
    - lambda_1_distribution_per_prime
    - full_factorization_of_every_sampled_degree
    - gcd_distribution_over_spectrum
    - pairwise_largest_prime_factor_rank_correlation
    - smoothest_sample_and_predicted_rho
    - null1_and_null2_slopes
    - in_repo_fixture_agreement_flags
    - predicted_time_and_memory_factors_at_2_256
    - wall_clock_and_peak_rss

  falsification_conditions:
  - >-
      Measured slope s <= 0.5 with the CI excluding 0.8: the independence
      heuristic H1 fails, the rho^{-2/3} claim is dead, and the correct record is
      a scoped negative naming quadratic-form correlation as the mechanism, with
      the gcd and rank-correlation numbers as the obstruction measurement.
  - >-
      Measured alpha differs from 2/3 by more than 0.05: the ball-growth law
      underlying claim (C) is wrong and the cost expression
      N^{2/3} p^{1/3} must be withdrawn, whatever the slope says.
  - >-
      The Stage 1 in-repo fixture fails to reproduce EXP-ALISO-001's recorded
      counts under the declared normalisation: implementation error; the run is
      void and produces no evidence in either direction, per AGENTS rule 3.
  - >-
      Stage 0 fails to reduce to the published expression at N = 1: the family
      does not contain the baseline and the proposal is withdrawn before any
      compute is spent.
  - >-
      Null object 2 produces the same slope as null object 1: the pipeline
      cannot detect correlation and no conclusion of either sign may be drawn.
  - >-
      eprint 2026/1821 or any other prior work is found on reading to already
      contain the multiplicity-corrected accounting: the proposal is superseded
      as prior art, which is a complete and acceptable outcome and must be
      recorded as such rather than quietly narrowed.

  confounders:
  - >-
      Sampler non-uniformity. The maximal-order sampler must be uniform up to
      conjugation for the spectrum statistics to mean what is claimed; a sampler
      biased toward small-discriminant orders will bias lambda_1 downward and
      inflate the apparent gain. Inherited from the in-repo method and NOT
      independently verified here.
  - >-
      Factorization budget truncation. If large norms are only partially factored
      and declared non-smooth on timeout, P(N) is biased downward for large N,
      which mimics the correlation branch. Every norm must be completely factored
      or the sample discarded, and the discard rate reported.
  - >-
      B-grid selection after the fact. Choosing B to maximise the observed slope
      is a garden of forking paths. The B grid is fixed before sampling and every
      grid point is reported.
  - >-
      Enumeration completeness. Missing short vectors (e.g. by a too-small
      enumeration radius) truncates the spectrum and reduces P(N) exactly like
      correlation would. The enumeration radius must be certified sufficient for
      the requested N on every sample, and failures reported rather than dropped.
  - >-
      Unit and automorphism conventions. Counting vectors up to +/-1 versus up to
      the full unit group changes r(D) by a small integer factor and would shift
      the fitted constant, though not alpha. The convention is declared before
      the fixture comparison.
  - >-
      Non-cyclic kernels. Remark 1 in the source speaks of multiple small
      NON-CYCLIC isogenies, while Lemma 3.4's correctness argument uses
      minimality to get cyclicity. A non-cyclic candidate may not be usable
      directly by Algorithm 2. The experiment must record, per spectrum entry,
      whether the corresponding isogeny is primitive in the lattice, and the
      headline P(N) must be reported both over all entries and over primitive
      entries only. If the two differ materially, the smaller one is the honest
      figure.

  interpretation_limits:
  - >-
      No exponent is claimed to move. Under docs/target-result-profile.md rule A1
      this is a non-target-class proposal and must never be presented as an
      improvement over p^{1/3+o(1)}.
  - >-
      Every number here is conditional on H1 and H2 by name, in the manner
      Theorem 1.1 carries "Assuming Heuristic 1". A validated slope does not
      prove H1; it fails to refute it at the sampled scale.
  - >-
      The Deuring-shortcut sampling inherits a transfer assumption: the sampled
      object is a random maximal order, and the claim about random supersingular
      curves follows only through the correspondence and the sampler's
      uniformity. This is the same assumption the source paper makes and it is
      not independently checked here.
  - >-
      The 2^{-16.5} time factor at p = 2^256 is arithmetic done in this proposal
      from the paper's formulas with the paper's fixed B; the paper's section 4.1
      table re-optimises B and its numbers are not directly comparable. No
      concrete-security claim may cite the 2^{-16.5} figure without redoing the
      optimisation.
  - >-
      Per DEC-20260801-010 and the RQ-ALISO-001 constraints, the EXP-ALISO-001
      artifact is used here ONLY as a code-validation fixture for enumeration
      counts. Nothing in that package is being promoted, and its own recorded
      finding (multiplicativity defect 1.0, prediction accuracy 0.0, status
      "success: false") is a NEGATIVE about Hecke-style compressibility and is
      not evidence for anything in this proposal.

  heuristic_assumptions:
  - id: H1
    statement: >-
      Multiplicity-corrected smoothness. Let p be prime, E/F_{p^2} a uniformly
      random supersingular elliptic curve, and let d_1 <= d_2 <= ... <= d_N be the
      N smallest degrees of isogenies E -> E^{(p)} (with multiplicity), where
      N = N(p) satisfies N <= p^{eps'} for every eps' > 0. Set
      D_N = max_i d_i and u_N = log(D_N)/log(B). Then the probability that at
      least one d_i is B-smooth is at least
      1 - (1 - u_N^{-u_N(1+o(1))})^N, uniformly as p -> infinity in the range
      (log p)^eps < u_N < (log p)^{1-eps} for a fixed eps > 0 - that is, the N
      smallest conjugate degrees behave like N INDEPENDENT uniformly random
      integers of size D_N with respect to B-smoothness.
    rigorous_support: >-
      Composition of a rigorous bound with a classical distribution theorem,
      exactly in the manner of the source's Heuristic 1 = Theorem 1.5 x Theorem
      1.4. The rigorous bound is Theorem 1.5 (Aubry-Oyono-Vincent, as restated in
      the in-repo text): an isogeny E -> E^{(p)} of degree at most (p/2)^{1/3}
      always exists, which pins d_1 and, combined with H2's count law, pins
      D_N = Theta(N^{2/3} p^{1/3}). The classical distribution theorem is Theorem
      1.4 (Canfield-Erdos-Pomerance): Psi(X,B) = X u^{-u(1+o(1))} in the same
      uniformity range. H1 adds exactly one thing beyond the source's Heuristic 1:
      INDEPENDENCE ACROSS THE SPECTRUM. That addition is the whole content and
      the whole risk, and it is the one thing the classical theorem does not
      supply.
    validation_plan: >-
      Sampling method and shortcut: the source's own section 4.2 route - sample
      maximal orders O in B_{p,infinity} uniformly up to conjugation, compute the
      two-sided ideal P of reduced norm p, and work with (P, Nrd/p), which is
      isometric to Hom(E,E^{(p)}) with the degree form. Enumerate the N smallest
      vectors rather than only the shortest. Scale: p = 5*2^248-1 (SQIsign
      NIST-I, the source's own first parameter set) with at least 10000 samples,
      plus a second p near 128 bits with at least 10000 samples for an exponent
      fit. N-grid {1,2,4,8,16,32,64} fixed in advance. Predicted distribution:
      P(N) against 1 - (1 - rho(u_N))^N with rho the Dickman-de Bruijn function
      and u_N = log(D_N)/log(B), reported as an empirical CDF over B exactly as
      the source's Figures 1 and 2 do for N = 1. Tail consistency checks: the
      smoothest sample overall versus its predicted rho(u), replicating the
      source's own check; and separately the smoothest d_i for each i, which
      under independence must be identically distributed across i. Transfer
      assumptions, recorded explicitly: (a) the sampler is uniform up to
      conjugation; (b) the Deuring correspondence transports the statement about
      random curves to the statement about random orders; (c) results at 128 and
      248 bits are extrapolated to larger p with no crossover, which is not
      tested.
  - id: H2
    statement: >-
      Ternary count law. For a uniformly random supersingular E/F_{p^2}, the
      degree form on the lattice governing Hom(E, E^{(p)}) is effectively a
      positive definite TERNARY form of determinant Theta(p), so that for
      p^{1/3} <= D <= p^{1/2} the number of lattice vectors of degree at most D
      satisfies r(D) = c_4 D^{3/2} p^{-1/2} (1 + o(1)) with c_4 absolute.
      Consequently lambda_1 = Theta(p^{1/3}) and the N-th smallest degree is
      Theta(N^{2/3} p^{1/3}).
    rigorous_support: >-
      The rigorous bound is again Theorem 1.5: a vector of degree at most
      (p/2)^{1/3} always exists. The classical distribution statement being
      imitated is the Gauss/Landau lattice-point count for a positive definite
      form of rank k and determinant d, #{v : Q(v) <= D} ~ V_k D^{k/2}/sqrt(d).
      The two are CONSISTENT only for (k, d) with k/2 * (1/3) - (1/2) log_p(d)
      = 0 at D = p^{1/3}, i.e. d = p^{2k/3 - ...}; for k = 3 this gives
      d = Theta(p), and for k = 4 it would require d = Theta(p^{4/3}), whereas
      the quaternary reading with d = Theta(p^2) predicts lambda_1 = Theta(p^{1/2})
      and CONTRADICTS Theorem 1.5. The single in-repo data point is consistent
      with the ternary reading: at p = 101051 the recorded 3x3 degree Gram has
      determinant p/4 and first_represented_degree 36 against (p/2)^{1/3} = 36.95.
      This is one instance, from an archival import at claim_tier toy, and it is
      cited as motivation and as a code fixture, NOT as evidence.
    validation_plan: >-
      Sampling method and shortcut: the same Deuring-shortcut sampling as H1;
      additionally record the rank and Gram determinant of the enumerated lattice
      on every sample so the rank/determinant question is answered directly
      rather than inferred. Scale: the same two primes plus a toy ladder
      (p between 10^4 and 10^6) where the lattice can be cross-checked against a
      directly constructed supersingular curve, which is the only place the
      correspondence itself can be spot-checked. Predicted distribution: fitted
      alpha in D_N ~ N^{alpha} p^{1/3} against the predicted 2/3, and fitted
      gamma in lambda_1 ~ p^{gamma} against the predicted 1/3, with the
      Gauss-count constant c_4 reported. Tail checks: the 1st percentile of
      lambda_1 must obey the same law as the median; a lambda_1 distribution with
      a heavy LEFT tail would mean a positive-density family of curves with
      unusually small conjugate degree, which is exponent-relevant and would be
      the most valuable possible surprise from this experiment. Transfer
      assumption: the toy-ladder cross-check validates the correspondence-based
      enumeration only at toy p and is extrapolated to 248 bits without test.

  target_complexity:
    time_exponent: >-
      p^{1/3+o(1)}, UNCHANGED from the baseline. The claim is on the o(1) factor:
      expected time rho^{-2/3} p^{1/3+o(1)} against the baseline
      rho^{-1} p^{1/3+o(1)}, with rho = u^{-u(1+o(1))} and u = sqrt(log(p/2)).
    memory_exponent: >-
      rho^{-2/3} p^{1/3+o(1)}, WORSE than the baseline's p^{1/3+o(1)} by exactly
      the factor rho^{-2/3}. The table must hold the enlarged degree budget D_N.
      This is a genuine cost and is the reason the proposal is a rebalancing and
      not a strict improvement.
    best_known: >-
      Wesolowski (in-repo full text, eprint 2026/1486): p^{1/3+o(1)} time and
      memory, heuristic. Udovenko (eprint 2026/1575, abstract retrieved):
      p^{2/5+o(1)} time and memory, unconditional. Delfs-Galbraith ([21] in the
      in-repo reference list): p^{1/2}(log p)^{O(1)} time, negligible memory.
      van Oorschot-Wiener interpolation per the in-repo section 1.1:
      p^{1/2+o(1)}/w^{1/2} time with memory w.
    hidden_overhead: >-
      The whole proposal is about the hidden overhead, so it must be stated
      plainly. The source discloses that "the overhead hiding in the o(1) term is
      superpolynomial, much larger than the previous (log p)^{O(1)} cofactor".
      With the paper's B = e^{(1/3)sqrt(log(p/2))} the inverse success
      probability is rho^{-1} = u^{u(1+o(1))} with u = sqrt(log(p/2)); at
      p ~ 2^256 my own arithmetic gives u = 13.29 and rho^{-1} ~ 2^{49.6}. The
      proposal replaces that by rho^{-2/3} ~ 2^{33.1}. It introduces NO new
      hidden term: the additional cost N^{2/3} is explicit and is the memory
      penalty above. It does not touch the B^{O(1)} modular-polynomial cost,
      which the source declines to optimise and which remains the largest
      unpriced factor in any concrete estimate.
    tradeoff_note: >-
      This moves ALONG the time-memory curve rather than off it: time is bought
      with memory at the rate (time factor) = (memory factor)^{-1/2}. The
      van Oorschot-Wiener interpolation p^{1/2+o(1)}/w^{1/2} applies unchanged
      and can be composed with it. Parallelization is unaffected - the source
      states the algorithm parallelizes perfectly, and the enlarged table
      parallelizes identically. In any deployment regime where memory is the
      binding constraint (which the source says it is), this proposal makes
      things WORSE and should not be used; its value is confined to regimes where
      memory is cheap relative to time. Say this in any promotion.

  dominated_by: >-
    Dominated on time by Wesolowski p^{1/3+o(1)} in the asymptotic sense (equal
    exponent, and the proposal claims only a subexponential factor), and
    dominated on memory by Wesolowski, by Delfs-Galbraith, and by every point of
    the van Oorschot-Wiener curve with w < rho^{-2/3} p^{1/3}. Dominated
    unconditionally by Udovenko p^{2/5+o(1)} in the sense that Udovenko needs no
    heuristic at all, though at a worse exponent. Frontier rows checked this
    session: Wesolowski p^{1/3+o(1)} / p^{1/3+o(1)} heuristic; Udovenko
    p^{2/5+o(1)} / p^{2/5+o(1)} unconditional; Delfs-Galbraith p^{1/2} polylog /
    negligible; van Oorschot-Wiener p^{1/2+o(1)}/w^{1/2} / w; Eisentraeger et al.
    2020 and Fuselier et al. 2025 at p^{1/2} polylog (known only through the
    Udovenko abstract and the in-repo reference list, not read). NOT CHECKED:
    eprint 2026/1821 (Mamah) beyond its abstract - it prices exactly this
    algorithm's concrete cost and tradeoffs and is the most likely place for this
    rebalancing to already exist. Until it is read, this dominated_by is
    incomplete and is declared incomplete rather than set to null.
  sota_delta: >-
    Time exponent delta = 0 (1/3 versus 1/3). Memory exponent delta = 0 in p, but
    a multiplicative memory penalty of rho^{-2/3} ~ 2^{+33.1} at p = 2^256 by the
    arithmetic in claim (C). Predicted concrete time gain rho^{1/3} ~ 2^{-16.5}
    at p = 2^256 under the paper's fixed B; the figure must be recomputed with B
    re-optimised before any use. Against Udovenko: -1/15 in the time exponent
    (1/3 versus 2/5) but at the cost of a heuristic Udovenko does not need.
    Against Delfs-Galbraith: -1/6 in the time exponent, +1/3 in the memory
    exponent.

  estimated_cost:
    implementation: high
    compute: medium

  recommended_priority: medium
