idea:
  id: IDEA-20260809-bf5139
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ARGON-141710
  goal_id: GOAL-ARGON-001
  title: >-
    Price memory the way an attacker does: an AT model with an explicit hardware
    cost, not an abstract area-time product
  class: representation
  claim: >-
    The AT metric multiplies memory by time with an implicit assumption that a
    unit of memory and a unit of computation are commensurable. The claim is that
    replacing the abstract product with an explicit hardware cost model — memory
    cost per byte, bandwidth limits, compute cost per hash — changes which point
    on the tradeoff curve is optimal for the attacker, and that the change is
    large enough that conclusions drawn from abstract AT do not survive.
  mechanism: >-
    Parameterize a cost function over memory price, bandwidth, and compute price;
    evaluate the tradeoff curve's cost at each point under that function; locate
    the attacker's optimum under several declared hardware profiles.
  why_not_a_renamed_known_approach: >-
    Hardware-aware cost modelling exists in the password-hashing literature. Doing
    it INSIDE this goal, over the tradeoff curve this program measured, and
    reporting how the optimum moves with the profile, is what connects the graph
    measurement to something an operator can reason about.
  predictions:
  - observable: attacker-optimal storage fraction versus hardware profile
    metric: fraction per profile
    predicted: Materially different across profiles. Invariance would mean abstract AT is adequate here, which is worth establishing.
  - observable: whether bandwidth rather than capacity binds
    metric: categorical per profile
    predicted: >-
      Bandwidth binds in at least one plausible profile, which would matter
      because the tradeoff attack increases recomputation and therefore traffic.
  minimal_test: >-
    Evaluate the measured tradeoff curve under three declared hardware profiles,
    report optima and binding constraints per profile.
  controls:
  - 'ABSTRACT-AT ANCHOR: setting the profile to unit prices must reproduce the abstract AT conclusions exactly, confirming the model generalizes rather than replaces.'
  - 'PROFILE PROVENANCE: every hardware constant is cited or declared as an assumption of this program with its range.'
  falsification_conditions:
  - Optima are invariant across all profiles.
  - The model cannot reproduce abstract AT at unit prices, indicating an inconsistency.
  interpretation_limits: >-
    Hardware profiles are assumptions, not measurements of any real device. No
    claim is made about what any attacker can build.
  sota_delta: 'No attack. Delta: an explicit cost model in place of an implicit commensurability assumption, with the optimum''s movement quantified.'
  dominated_by: Downstream of IDEA-20260809-ac5947; not dominated by any corpus record.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for AT cost model: no records. WEB NOT CHECKED.'
  source_refs:
  - Memory-hard function cost model references -- RECALLED, REQUIRED READS.
