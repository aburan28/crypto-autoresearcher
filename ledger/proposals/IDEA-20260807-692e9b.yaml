idea:
  id: IDEA-20260807-692e9b
  question_id: RQ-ICINV-475b5e
  added: '2026-08-07'
  title: >-
    IS THE PROGRAM'S OWN CENTRAL QUANTITY A CLASS INVARIANT? Measure the
    H-PSEUDO factor-base flatness constant C(E) across a complete isogeny class,
    against the FIELD-SIDE analogue whose entire achievable range is pinned to a
    factor of 3 by Parseval below and Weil above -- so the field-side flatness
    is closed by derivation while the group-side flatness is pinned only to a
    factor sqrt(B), and any within-class variance that survives lives exactly in
    the gap KN-FIND-5c1a03 identifies as the missing structural ingredient
  class: measurement

  claim: >-
    (A) TWO FLATNESS FUNCTIONALS THAT LOOK ALIKE AND ARE NOT.
      FIELD-SIDE. Let X_E = {x in F_p : x^3 + a x + b is a square, including its
        roots}, the set of x-coordinates of F_p-rational points. Its additive
        Fourier transform is 1_hat_{X_E}(c) = sum_{x in X_E} e_p(-cx). The
        FIELD-SIDE FLATNESS is Phi_field(E) = max_{c != 0} |1_hat_{X_E}(c)|.
      GROUP-SIDE. Let G = <P> of prime order N, F = {Q in G : x(Q) < tau} of
        size B, and D = {DL_P(Q) : Q in F} subset Z/N. The GROUP-SIDE FLATNESS
        is Phi_group(E) = max_{k != 0} |sum_{d in D} e_N(k d)|, and
        C(E) = Phi_group(E)/sqrt(B) is exactly the constant of H-PSEUDO-83817b,
        measured empirically at C ~ 3 for p = 1009..4001 in EV-BGT-816536.

    (B) THE DERIVED TWO-SIDED PIN ON THE FIELD SIDE, WHICH CLOSES IT.
      UPPER: for c != 0, 1_hat_{X_E}(c) = (1/2) sum_x chi(f(x)) e_p(-cx) +
        O(r), and the Weil bound for a mixed character sum with deg f = 3 and a
        linear additive argument gives |sum_x chi(f(x)) e_p(-cx)| <= 3 sqrt(p).
        Hence Phi_field(E) <= (3 sqrt(p) + 3)/2 FOR EVERY CURVE.
      LOWER: Parseval gives sum_{c} |1_hat|^2 = p |X_E|, and 1_hat(0) = |X_E|,
        so sum_{c != 0} |1_hat|^2 = |X_E|(p - |X_E|) ~ p^2/4, whence
        Phi_field(E) >= sqrt(|X_E|(p - |X_E|)/(p-1)) ~ sqrt(p)/2 FOR EVERY
        CURVE.
      THEREFORE Phi_field(E) lies in [sqrt(p)/2, 3 sqrt(p)/2] (1 + o(1)) for
      EVERY curve over F_p -- a window of ratio 3, unconditionally, with no
      class hypothesis at all. THE ENTIRE ACHIEVABLE VARIATION OF FIELD-SIDE
      FLATNESS, WITHIN A CLASS OR ACROSS ALL CURVES, IS A FACTOR OF 3. No
      exponent can come from it, and the isogeny-class axis cannot deliver what
      the whole space of curves does not contain. NAMED OBSTRUCTION
      (O-FLATFIELD): Parseval from below, Weil from above, ratio 3.

    (C) WHY THE GROUP SIDE IS NOT CLOSED BY THE SAME ARGUMENT, AND THIS IS THE
    POINT OF THE RECORD. The same Parseval computation on the group side gives
    Phi_group(E) >= sqrt(B(1 - B/N)) ~ sqrt(B), so C(E) >= 1 - o(1); the only
    available upper bound is the trivial Phi_group <= B, i.e. C(E) <= sqrt(B).
    THE GROUP-SIDE WINDOW IS A FACTOR sqrt(B), NOT A FACTOR 3, because there is
    no Weil bound for a character sum over DISCRETE LOGARITHMS -- the discrete
    log is not an algebraic function of the coordinates, which is precisely the
    gap KN-FIND-5c1a03 records as the single missing structural ingredient
    identified independently by three analyses. So C(E) has room to vary by a
    factor sqrt(B) in principle, and whether it varies WITHIN A CLASS is a
    cheap, sharp, unasked question.

    (D) WHY C(E) COULD DEPEND ON THE CURVE EQUATION AND NOT ONLY ON (p, N, t).
    Under transport by an F_p-isogeny phi of degree coprime to N, DL is
    PRESERVED exactly: DL_{phi(P)}(phi(Q)) = DL_P(Q) by T1. So the map
    D -> Z/N is the same abstract set for E and E' -- EXCEPT that the factor
    base is not transported: F is defined by the coordinate condition
    x(Q) < tau, and phi does not preserve coordinate windows. The set D subset
    Z/N is therefore genuinely different on different class members, and C(E) is
    the flatness of a DIFFERENT subset of Z/N of the same size on each member.
    Nothing in (p, N, t) determines which subset. C(E) is also gauge-dependent,
    since the gauge dilation X_E -> u^2 X_E changes which points fall in the
    window, so the gauge null of IDEA-20260807-6eb96b is ADMISSIBLE here (its
    spread is not forced to zero) -- unlike for the dilation-invariant
    functionals, which that record's table flags as mode-1.

    (E) THE THREE OUTCOMES, ALL DELIVERABLES.
      OUTCOME I (invariant): within-class spread of C(E) is inside the gauge
        interval. Then the program's central quantity is, at toy scale, a
        function of (p, N, t, B) plus equation noise, and the isogeny axis is
        closed for it -- a strong statement, because C is exactly the quantity
        the program cannot bound theoretically.
      OUTCOME S (structured): within-class spread exceeds the gauge interval.
        Then some class members have a materially flatter factor base than
        others, the H-PSEUDO constant is not universal in the way the hypothesis
        states, and the lane has a target whose reachability is then decided by
        IDEA-20260807-c36472.
      OUTCOME W (wide-null): the gauge interval itself is comparable to the
        whole field-side-style window. Then equation choice alone moves the
        program's central constant as much as anything else does, which is a
        significant observation about H-PSEUDO-83817b's own formulation --
        because that hypothesis quantifies over curves without fixing the
        equation.
    In every branch the FIELD-SIDE arm is measured alongside as a derived
    control: its spread must stay inside the factor-3 window of (B), and if it
    does not, the instrument is broken.

  resource_label: >-
    R1 (x-coordinates as field elements: the window is a coordinate condition
    and the field-side transform is over F_p) + R2 (the curve equation, which
    determines X_E and therefore which points fall in the window).
  admissibility: admissible
  admissibility_argument: >-
    The measured object is a subset of Z/N obtained by filtering group elements
    through a COORDINATE predicate. The predicate x(Q) < tau is not expressible
    by group operations and equality tests: a generic-group algorithm sees only
    opaque handles, so it cannot compute the window membership that defines F.
    This is the R1 line of DECOMPOSITION.md section 2. The measurement does
    require DLs, which at toy scale are computed by exhaustive enumeration --
    that is an INSTRUMENT cost, not an oracle grant, and no algorithm is
    proposed that assumes a DL oracle. KN-FIND-b7e091's closed oracles
    (incidence, endomorphism-image) are not used. H-ENDO-001 is untouched: no
    endomorphism is applied to any point.

  discriminated_from:
    - >-
      H-PSEUDO-83817b itself (status specified, DEC-20260804-9f51a3). That
      hypothesis asserts a UNIVERSAL constant C independent of p, N and B. This
      record does not test universality in p; it tests whether C is constant
      ACROSS AN ISOGENY CLASS at fixed p, N and B -- a question the hypothesis
      does not ask and which its supporting evidence (EV-BGT-816536, sampled
      curves at p = 1009..4001) cannot answer, because a sample of curves at
      different p confounds class with p. If OUTCOME S fires, H-PSEUDO's
      formulation needs a scope note; this record does NOT propose one and moves
      no status.
    - >-
      The analysis/o2-sum-compatible-filters/ line and the THM_INCBARRIER notes,
      which discuss Fourier obstructions and additive completion. Those concern
      whether a sum-compatible filter can exist; this record measures a spread
      across an isogeny class and derives a two-sided pin. Different question,
      and the pin in (B) is stated so that the two lines cannot be confused.
    - >-
      IDEA-20260807-0ff796, which counts relations. A flat factor base and a
      high relation yield are different properties: yield is a first-moment
      quantity (closed there by a point count) and flatness is an
      extreme-of-Fourier quantity, which the same argument does not touch.
    - >-
      The ADDITIVE ENERGY of X_E and the multiset {|1_hat_{X_E}(c)|}_{c != 0},
      which are DILATION-INVARIANT and therefore gauge-invariant by algebra
      (1_hat_{u^2 X}(c) = 1_hat_X(u^2 c) permutes the multiset). Those are
      genuinely different functionals for which the gauge null is mode-1, and
      this record deliberately does NOT use them as its headline for that
      reason. It measures them only as a secondary arm with the correct null
      (uniform random subsets of F_p of matched size).

  object_first_candidate:
    tracked_object: >-
      THE DISCRETE-LOG IMAGE OF THE WINDOW FACTOR BASE: the subset
      D(E) = {DL_P(Q) : Q in G, x(Q) < tau} of Z/N, followed across a complete
      F_p-isogeny class at a transported instance, and summarised by its Fourier
      ell-infinity norm.
    lossiness: >-
      GENUINELY AND SEVERELY LOSSY. D(E) forgets the curve, the coordinates, the
      group law and the points; it retains B residues mod N. LOSSY-PROJECTION
      TEST APPLIED AND IT PASSES FOR A SPECIFIC REASON: what is discarded (the
      coordinates) is discarded COMPATIBLY with the operation that matters,
      because transport by an isogeny acts trivially on DLs (T1) and therefore
      acts on D(E) purely through which points the window admits -- so the
      retained part propagates deterministically under the group-side operations
      (translation of the target corresponds to a shift of D, negation to
      D -> -D) even though the coordinates are gone. It is emphatically NOT a
      change of coordinates: p field elements collapse to B residues, and two
      different curves can give the same D.
    propagation: >-
      Under a shift of the target: D translates. Under negation: D -> -D, so
      Phi_group is invariant, which is a useful internal consistency check.
      Under gauge: D changes by an unpredictable re-selection (the window admits
      a different set of points), which is exactly why the gauge null has
      non-zero spread. Under an isogeny: no propagation rule exists at all --
      that failure IS the question.
    survival_score: >-
      Survives change of target, of generator, of B, and of p. Dies when the
      cofactor is not 1 and F must be restricted to G (the record handles this
      by selecting prime-order classes, see Step 1); dies at B close to N, where
      the trivial bounds collapse and C is pinned by Parseval alone.

  mechanism: >-
    STEP 1 -- CLASS SELECTION ON PRIME ORDER, DECLARED FIRST. Enumerate complete
    classes at p in [2^12, 2^13] and retain classes whose common order
    #E(F_p) = p + 1 - t is PRIME. Then N = #E, G = E(F_p), every member is
    cyclic of prime order, and F needs no cofactor handling. NOTE THE
    DELIBERATE TENSION WITH IDEA-20260807-0a3272: prime-order classes have
    odd order, hence no rational 2-torsion at all, hence r = 0 on every member,
    hence no 2-torsion stratification. The two records therefore study DISJOINT
    families of classes on purpose, and neither may cite the other's class
    selection as its own.

    STEP 2 -- BUILD D(E) EXACTLY. For each member: pick a generator P, build the
    full DL table by walking multiples of P (O(N) group operations, ~8000 at
    p ~ 2^13), collect D = {DL(Q) : x(Q) < tau} for a declared tau giving
    |D| = B. Certificate: every recorded pair (d, Q) is re-verified by
    recomputing [d]P in harness/toycurve.py, independently of the walk.

    STEP 3 -- COMPUTE BOTH FLATNESS FUNCTIONALS BY FFT. Phi_group by one
    length-N DFT of the indicator of D; Phi_field by one length-p DFT of the
    indicator of X_E. Both are O(N log N) and O(p log p). Report
    C(E) = Phi_group/sqrt(B) and Phi_field(E)/sqrt(p) side by side.

    STEP 4 -- THE FOUR ARMS. Arm C: every member of the class at a canonical
    gauge representative. Arm G: >= 8 gauge draws per member, reported as an
    interval. Arm R: >= 30 random prime-order curves at the same p (different
    classes). Arm U: uniform random subsets of Z/N of size B -- the ABSOLUTE
    reference, since a uniform random set has Phi_group ~ sqrt(B log N) by the
    standard extreme-value estimate, and both the real and the null arms must be
    scored against that reference model rather than only against each other
    (KN-TECH-1a5b7e, "check both arms against the reference model").

    STEP 5 -- THE DERIVED CONTROL, RUN AND REPORTED FIRST. The field-side arm
    must satisfy sqrt(p)/2 <= Phi_field <= 3 sqrt(p)/2 for EVERY curve measured.
    This is a derivation, not a measurement, so observing it is a passed
    instrument check and observing a violation means the transform or the
    character table is wrong. Report the observed min and max of
    Phi_field/sqrt(p) across all arms before any group-side number is looked at.

    STEP 6 -- THE SECONDARY ARM WITH ITS OWN NULL. Measure the additive energy
    of X_E and the multiset of field-side Fourier magnitudes. Their gauge spread
    is ZERO by algebra (dilation invariance), so their null is a uniform random
    subset of F_p of matched size, NOT the gauge orbit. Report whether the
    within-class spread of additive energy exceeds the random-subset spread.
    This arm is cheap and is the only place in the lane where a gauge-invariant
    analytic functional is measured against a correct null.

    STEP 7 -- DECISION RULE, FROZEN, WITH THE NULL ARM READ FIRST. Emit OUTCOME
    I, S or W per (E), after emitting the rule's verdict on arm G treated as if
    it were a class. If the rule fires on that arm, it discriminates nothing and
    nothing is reported.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep tool, 2026-08-07: "additive energy|Fourier flat|character sum|Weil
      bound" over *.md and *.yaml (488 occurrences over 175 files); "isogeny
      class" over the repository; targeted reads of H-PSEUDO-83817b,
      KN-FIND-5c1a03, KN-TECH-010, KN-TECH-016, EV-BGT-816536 (referenced from
      H-PSEUDO's status history), DECOMPOSITION.md.
    results: >-
      Fourier/character-sum material is abundant: the o2-sum-compatible-filters
      analysis, the THM_INCBARRIER notes, H-PSEUDO-83817b and its evidence, and
      the EV-PSEUDO/EV-SEMAEV records. EVERY one of them treats flatness at a
      FIXED curve or across curves at DIFFERENT p. ZERO records ask whether the
      flatness constant is constant across an isogeny class at fixed p, and
      ZERO records state the two-sided Parseval/Weil pin of (B) for the
      field-side analogue or contrast the factor-3 field-side window with the
      factor-sqrt(B) group-side window.
    verdict: >-
      ADAPTATION. Weil, Parseval and the extreme-value estimate for random sets
      are textbook and are claimed as nothing else. New to this program: the
      two-sided pin in (B) as an explicit closure of the FIELD-SIDE functional,
      and the class-invariance question for the GROUP-SIDE constant that the
      program has already made central. No external novelty claimed; Stage 0 is
      a literature check and a hit would be an ingredient.

  null_object_control: >-
    MANDATORY, FOUR LAYERS.
    (1) MATCHED NULL FOR THE HEADLINE: the GAUGE ORBIT, >= 8 draws per member,
      reported as an interval with its derived 2/n min-max false-positive rate.
      It is ADMISSIBLE here because the window is not dilation-invariant, so its
      spread is not forced to zero -- and Step 4 verifies that the spread is
      indeed non-zero before the arm is used as a reference.
    (2) REFERENCE MODEL, not a surrogate: uniform random subsets of Z/N of size
      B, whose Phi_group ~ sqrt(B log N). BOTH the real arm and the gauge arm
      are scored against it, per KN-TECH-1a5b7e's move 3, and the asymptotic
      value is reported beside the finite-B empirical null and never used as the
      test reference.
    (3) DERIVED CONTROL: the field-side pin in (B). Its forced value is an
      INTERVAL, [1/2, 3/2] in units of sqrt(p), derived before the run. If the
      field-side arm sits outside it, the instrument is broken.
    (4) DECAY PARAMETER: B. C(E) = Phi_group/sqrt(B) is normalised so that a
      random set gives C ~ sqrt(log N), roughly constant in B. Therefore the
      WITHIN-CLASS SPREAD of C must SHRINK as B grows if it is sampling noise,
      and must persist if it is structure. A spread flat in B over four values
      of B is the signature the record is looking for; a spread that grows in B
      is the canonical artifact tell and halts the line.
    (5) FOR THE SECONDARY ARM ONLY: the gauge null is MODE-1 for additive energy
      and for the Fourier multiset (dilation invariance), so it is replaced by
      uniform random subsets of F_p of matched size. This is stated before the
      run, not discovered.

  assumptions:
    - >-
      [fact, cited] Weil bound for mixed character sums: for f of degree 3 not a
      square and a linear additive argument, |sum_x chi(f(x)) e_p(cx)| <=
      3 sqrt(p) for c != 0. Standard; the exact constant (deg f + deg g - 1) is
      to be re-confirmed against a primary source before the write-up quotes it,
      and the record's conclusion survives any constant of the form K sqrt(p).
    - >-
      [fact] Parseval on F_p and on Z/N, giving the lower bounds in (B) and (C).
      Elementary and re-verified numerically as an instrument check.
    - >-
      [fact] T1: DLs are preserved by transport, so D(E) differs across the
      class only through window membership.
    - >-
      [open] Whether prime-order classes are common enough at p ~ 2^13 to supply
      classes with >= 20 members. Settled cheaply in Step 1; if not, the record
      falls back to cofactor-handled classes with F restricted to G, at the cost
      of an extra confounder that must then be reported.
    - >-
      [scope] Toy scale, p <= 2^13 for full DL tables, claim_tier toy. The pin
      in (B) is scale-free and is the part that carries a closure; the
      measurement is not.

  proof_search_map:
    bottleneck: >-
      The absence of any nontrivial upper bound on Phi_group. Everything else in
      the record is computation. If a Weil-type bound for character sums over
      discrete logs existed, the group side would be pinned like the field side
      and the whole question would close by derivation instead of measurement.
      That missing bound is exactly KN-FIND-5c1a03's identified gap, and naming
      it as this record's bottleneck is the honest statement of why the record
      is a measurement and not a theorem.
    baseline_embedding:
      parameter_slice: >-
        B = N, the full group as factor base. There D = Z/N, Phi_group = 0 for
        every k != 0 exactly, and C = 0. Any implementation must reproduce that
        exactly, and it is the cheapest possible end-to-end instrument check.
      reproduction_check: >-
        Frozen fixture: assert Phi_group == 0 at B = N, and assert the
        empirical C at p = 1009 and p = 4001 reproduces the C ~ 3 recorded in
        H-PSEUDO-83817b's status history for the SAME tau convention. A mismatch
        means this record's window convention differs from that evidence's, and
        the two are then not comparable -- which must be discovered before any
        class comparison, not after.
    observation_collision:
      observable: >-
        C(E) = Phi_group(E)/sqrt(B).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED: a uniform random subset of Z/N of size
        B has the same C, to within the extreme-value spread, as a real factor
        base. That collision is the reason arm U exists and it BOUNDS every
        conclusion: if real factor bases are indistinguishable from random
        subsets, C measures randomness of the shape and not the curve, and no
        class-level statement may be made from it beyond "the class does not
        make the factor base less random than random".
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the single number max_k |Ŝ(k)| by the full sorted spectrum
          {|Ŝ(k)|}_{k != 0}. The spectrum preserves strictly more state than its
          maximum, is comparable against the exact reference distribution for a
          random subset, and would detect structure concentrated at a few
          frequencies that a maximum washes out.
        predicted_gain: >-
          A distribution rather than a point, giving the resolution to
          distinguish "one bad frequency" from "uniformly slightly less flat" --
          two very different situations that C cannot separate.
      - transform: boundary_lift
        proposed_object: >-
          Lift the field-side pin of (B) to the group side by asking what
          structure on D would be needed to violate C <= K: D would have to
          correlate with an additive character of Z/N, i.e. the window predicate
          would have to correlate with a linear function of the discrete log.
          Exhibiting or excluding such a correlation is the boundary case.
        predicted_gain: >-
          Turns "measure C" into "search for a frequency k at which the window
          predicate correlates with DL", which is a directed search with a
          concrete target rather than a summary statistic. It is also exactly
          the structure whose absence KN-FIND-5c1a03 identifies as the barrier.
    quantifier_order: >-
      Tested: FORALL p in the declared range, FORALL prime-order classes at that
      p, FORALL members E, C(E) lies within a band whose width is at most the
      gauge interval. NOT claimed: the H-PSEUDO quantifier FORALL p EXISTS a
      universal C -- that is a different and stronger statement, it belongs to
      H-PSEUDO-83817b, and this record neither supports nor moves it. The audit
      obligation is that no sentence in the write-up slides from "constant
      across a class at fixed p" to "constant in p".
    method_ceiling:
      strongest_certifiable_claim: >-
        "At toy scale, on prime-order classes at p <= 2^13, the within-class
        spread of the H-PSEUDO constant is [value] against a gauge interval of
        [interval] and a random-subset reference of [value]." It can NEVER
        certify universality in p, can never certify a bound on Phi_group, and
        can never say anything about the ECDLP.
      nearby_object_control: >-
        THE NEARBY OBJECT ON WHICH THE DESIRED CONCLUSION FAILS: a DELIBERATELY
        STRUCTURED factor base -- take D to be an arithmetic progression in Z/N
        of size B. Then C ~ sqrt(B), the maximum possible, and the pipeline must
        report it as wildly non-flat. If the instrument cannot separate an
        arithmetic progression from a real factor base, it has no resolution and
        every negative it produces is empty.
    proof_obligations:
      - claim: Phi_field lies in [sqrt(p)/2, 3 sqrt(p)/2](1 + o(1)) for every curve.
        responsibility: correctness
      - claim: Phi_group >= sqrt(B(1 - B/N)) for every curve (Parseval).
        responsibility: correctness
      - claim: Transport preserves DLs, so D differs only by window membership.
        responsibility: interface
      - claim: The B = N slice gives Phi_group = 0 exactly.
        responsibility: baseline
      - claim: The arithmetic-progression control gives C ~ sqrt(B).
        responsibility: strictness
      - claim: Additive energy and the Fourier multiset are dilation-invariant.
        responsibility: scope

  predictions:
    - metric: >-
        Phi_field(E)/sqrt(p) across every curve measured, in every arm
      direction: different
      minimum_effect: >-
        MUST lie in [0.5, 1.5] (1 + o(1)) for every curve, by derivation. This
        is a forced value, so observing it is a passed instrument check and NOT
        evidence about invariance. A violation means the transform is wrong.
    - metric: >-
        within-class standard deviation of C(E) versus the >= 8-draw gauge
        interval, at matched B and transported instance
      direction: different
      minimum_effect: >-
        PRE-REGISTERED PREDICTION: within the gauge interval, i.e. OUTCOME I.
        OUTCOME S requires the within-class spread to exceed the gauge
        interval's upper end by more than the interval's own width, in at least
        2 of 3 independent classes, at 2 of 4 values of B.
    - metric: >-
        within-class spread of C(E) as a function of B, over >= 4 values
      direction: lower
      minimum_effect: >-
        Sampling noise must shrink; structure must persist. A spread that GROWS
        with B is the artifact tell and halts the line for instrument review.
    - metric: >-
        C(E) of real factor bases versus uniform random subsets of Z/N of size B
      direction: different
      minimum_effect: >-
        PREDICTED INDISTINGUISHABLE. If real factor bases are systematically
        FLATTER than random subsets, that is a genuinely new observation about
        window factor bases and is worth its own record; if they are less flat,
        index calculus on those curves is worse than the random model assumes
        and the program's cost estimates need a note.
    - metric: >-
        within-class spread of the additive energy of X_E versus the spread over
        uniform random subsets of F_p of matched size (secondary arm)
      direction: different
      minimum_effect: >-
        The gauge spread here is EXACTLY ZERO by dilation invariance, which is
        stated as a derivation, so any non-zero within-class spread is a genuine
        class effect on a gauge-invariant functional -- the cleanest possible
        signal in this lane if it appears. Predicted: spread comparable to the
        random-subset spread, i.e. no class effect.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): write the derivations in (B) and (C) and the
      forced values; literature check for character-sum bounds over discrete
      logs (a positive hit would be a major ingredient and would change the
      lane's shape).
      STAGE 1 (minutes, HARD GATE): instrument checks -- Phi_group = 0 at B = N;
      arithmetic-progression control gives C ~ sqrt(B); Parseval identities
      verified numerically; the C ~ 3 reproduction at p = 1009, 4001 against
      H-PSEUDO's recorded convention.
      STAGE 2 (~1 hour): enumerate classes at p in [2^12, 2^13] and retain
      prime-order classes with >= 20 members.
      STAGE 3 (hours): four-arm measurement of C(E) and Phi_field, >= 8 gauge
      draws per member, >= 4 values of B, DL certificates on every point.
      STAGE 4 (~1 hour): the secondary gauge-invariant arm with its
      random-subset null.
      STAGE 5 (zero compute): the frozen rule, null arm first, outcome recorded.
      The whole record is dominated by Stage 3 and is cheap because every
      per-curve step is O(N log N).
    controls:
      - field-side derived pin [0.5, 1.5] sqrt(p) -- a forced value, run first
      - Phi_group = 0 at B = N (baseline slice)
      - arithmetic-progression factor base, must give C ~ sqrt(B) (sensitivity)
      - uniform random subsets of Z/N (reference model, both arms scored against it)
      - gauge orbit, >= 8 draws, interval-reported, with its 2/n rate
      - DL certificates: every (d, Q) re-verified by recomputing [d]P
      - the rule's verdict on the gauge arm, emitted before the class arm's
    required_metrics:
      - C(E) and Phi_field(E)/sqrt(p) per (curve, gauge draw, B)
      - full sorted Fourier spectrum, not only its maximum
      - gauge interval per member with n and the derived 2/n rate
      - random-subset reference distribution at matched (N, B)
      - additive energy of X_E per member and its random-subset null
      - within-class spread as a function of B with the fitted trend
      - every instrument-control pass/fail, reported before any headline

  falsification_conditions:
    - >-
      Phi_field falls outside [0.5, 1.5] sqrt(p) for any curve. The derivation
      in (B) or the implementation is wrong; nothing is reported until resolved.
    - >-
      Phi_group != 0 at B = N. Instrument broken.
    - >-
      The arithmetic-progression control does not give C ~ sqrt(B). The
      instrument has no resolution and every negative from it is empty.
    - >-
      The measured C at p = 1009, 4001 does not reproduce H-PSEUDO's recorded
      C ~ 3 under the same convention. The window conventions differ; the two
      lines are not comparable and this must be stated before any class result.
    - >-
      Within-class spread GROWS with B. Artifact tell; halt.
    - >-
      OUTCOME S fires. Then H-PSEUDO's constant is class-dependent at toy scale,
      which bears on a `specified` hypothesis of another goal; under
      GOAL-ENDO-001 pause condition P2's spirit this record must NOT transition
      that hypothesis and must hand the observation to the Coordinator.

  confounders:
    - >-
      WINDOW CONVENTION. "x(Q) < tau" versus "the B smallest x-coordinates"
      versus the harness's hashed build_factor_base give different sets. The
      convention must be frozen and must match H-PSEUDO's for the reproduction
      check to mean anything.
    - >-
      GENERATOR CHOICE. Changing P to [m]P permutes k, so max_k is invariant --
      but only if the maximum is over ALL k != 0. Any partial-k measurement
      would be generator-dependent and is prohibited.
    - >-
      COFACTOR. If #E is not prime, F must be restricted to G and the restricted
      window has a different size on different members. Step 1 avoids this by
      class selection; if the fallback is used, this becomes a live confounder
      and must be reported.
    - >-
      SMALL N. At p ~ 2^12 the extreme-value spread of C over random subsets is
      large, so the gauge interval will be wide and OUTCOME W becomes likely for
      instrument reasons rather than mathematical ones. N must be reported
      beside every spread.
    - >-
      TRANSPORT. Comparing class members at non-transported instances compares
      different problems; certificates are mandatory.

  interpretation_limits:
    - >-
      The pin in (B) closes the FIELD-SIDE functional and nothing else. It does
      not bound Phi_group and must never be quoted as if it did -- that
      conflation is exactly the gap KN-FIND-5c1a03 names.
    - >-
      A toy-scale OUTCOME I is not a proof that C is a class invariant; it is a
      bound on the within-class spread at these p, these B and this instrument's
      resolution.
    - >-
      Nothing here supports or refutes H-PSEUDO-83817b's universality claim in
      p, and this record moves no hypothesis status.
    - >-
      OUTCOME S would be a statement about relation-collection flatness, not an
      attack; converting a flatness difference into a speedup is separate work
      with its own record and its own cost table.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a uniform random subset D of Z/N of size B, max_{k != 0}
        |sum_{d in D} e_N(kd)| = sqrt(B log N)(1 + o(1)), so the normalised
        constant of a structureless factor base is C ~ sqrt(log N).
      rigorous_support: >-
        Rigorous below by Parseval (max >= sqrt(B(1 - B/N))) and rigorous above
        by a union bound over the N - 1 frequencies with a sub-Gaussian tail for
        each sum -- so the sqrt(log N) factor is the classical extreme-value
        scaling for N nearly-independent centred sums of B unit vectors, which
        is the distribution theorem this assumption imitates.
      validation_plan: >-
        Sample >= 1000 uniform subsets per (N, B) at N in the four largest toy
        primes and B over a decade; compare the empirical distribution of
        max_k |.| against sqrt(B log N) by an empirical CDF, and check the tail
        explicitly (the largest observed maximum against the union-bound
        prediction). This gives the reference distribution against which BOTH
        the real and the gauge arms are scored. TOY SCALE, labelled.
    - id: H2
      statement: >-
        The window predicate x(Q) < tau, viewed as a subset of Z/N through the
        discrete logarithm, behaves like a uniformly random subset of that size
        with respect to additive characters of Z/N.
      rigorous_support: >-
        THERE IS NO RIGOROUS SUPPORT, AND SAYING SO IS THE POINT. This is
        exactly H-PSEUDO-83817b restated, and KN-FIND-5c1a03 records that three
        independent analyses identify the absence of any algebraic mechanism for
        it as the missing structural ingredient for prime-field ECDLP. It is
        listed here as a NAMED assumption rather than absorbed into prose,
        precisely because the whole record is a measurement of how it behaves
        across a class.
      validation_plan: >-
        The record's own Stage 3 is the validation route at toy scale: measure
        the full Fourier spectrum of D(E) against the H1 reference distribution
        for every class member, and report the empirical CDF and its tail. Toy
        scale ONLY. A crypto-scale route does not exist and this record does not
        pretend one does -- there is no correspondence analogous to Deuring that
        would let D(E) be sampled at cryptographic N without solving DLs, and
        the absence of such a shortcut is itself worth recording.
    - id: H3
      statement: >-
        The gauge orbit produces >= 8 effectively independent draws of D(E), so
        the gauge interval is a valid tolerance interval with false-positive
        rate 2/n.
      rigorous_support: >-
        The dilation X -> u^2 X genuinely re-selects the window's contents; the
        independence across distinct u is the heuristic half and imitates the
        same model as H1 of IDEA-20260807-c36472. The derived 2/n rate is exact
        given distinct draws.
      validation_plan: >-
        Draw 32 gauge representatives for a handful of members and check whether
        the 8-draw interval is stable under re-drawing (mode 5's comparator
        replication). If the interval moves materially between two draws of 8,
        report the residual as unresolved rather than as an effect.

  reachability_gate: >-
    ADDRESSED, AND THE ANSWER DEPENDS ON THE OUTCOME. Under OUTCOME I there is
    no minimiser and T5 is moot. Under OUTCOME S the minimiser is a class member
    with an unusually flat factor base, and its reachability is decided by
    IDEA-20260807-c36472's routes: (R-common) is tested directly here by
    reporting the fraction of members within 5% of the class minimum of C;
    (R-local) requires C(E') to be predictable from cheap vertex data, which
    this record does NOT expect since C is a global extremal statistic of a
    coordinate-selected set and no cheap invariant plausibly predicts it;
    (R-address) is unavailable, because no closed form identifies a flat curve.
    So the honest pre-registered position is that even a positive OUTCOME S
    would most likely FAIL the reachability gate on identification cost
    (h ~ p^{1/2} evaluations, each costing a DL table), and the record says so
    in advance rather than discovering it after a positive.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. Instrument cost: O(N) group
      operations for the DL table plus O(N log N) for the DFT per curve, i.e.
      p^{1 + o(1)} per curve and p^{3/2 + o(1)} per complete class -- above the
      0.886 sqrt(N) baseline, which is why this is a measurement and is only
      possible at toy scale. Note honestly that building a DL table means the
      instrument SOLVES the very problem under study; that is legitimate for a
      measurement and would be circular in an algorithm, and the record never
      proposes an algorithm.
    memory_exponent: >-
      O(N) for the DL table and the DFT buffer -- 8192 entries at p ~ 2^13, i.e.
      kilobytes. Not binding.
    best_known: >-
      0.886 sqrt(N) group operations at O(1) memory (KN-TECH-001, KN-TECH-006,
      with the negation discount per KN-TECH-018); BSGS at sqrt(N)/sqrt(N)
      (KN-TECH-031). For the flatness quantity itself the incumbent is
      H-PSEUDO-83817b's empirical C ~ 3 at p = 1009..4001, which this record
      must reproduce before it may compare anything.
    hidden_overhead: >-
      Everything hides in "at toy scale". The group-side functional has NO
      crypto-scale sampling route: unlike the isogeny setting, where the Deuring
      correspondence lets minimal degrees be sampled at SQIsign-sized p, there is
      no correspondence that produces D(E) at cryptographic N without solving
      discrete logs. So H2 cannot be validated at scale by any method this
      record knows, and that limitation is disclosed rather than papered over.
    tradeoff_note: >-
      Not applicable; no algorithm is produced. The instrument's own O(N) DL
      table is a hard wall at p ~ 2^26 or so even with BSGS, which bounds any
      future extension of this measurement.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES. As an ATTACK: none is mounted,
    so dominated on every axis by parallel rho at 0.886 sqrt(N) time and O(1)
    memory (KN-TECH-001, KN-TECH-006), by the automorphism-discounted variant
    (KN-TECH-018) and by BSGS at sqrt(N) time and memory (KN-TECH-031) -- and
    dominated more severely than most records here, since the instrument itself
    costs O(N) DL computations, i.e. it is strictly more expensive than solving
    the instance. As a MEASUREMENT of flatness the incumbent is
    H-PSEUDO-83817b's sampled-curve evidence; this record dominates it on
    CONTROL (a class-matched design with a gauge interval and a reference model)
    and is dominated by it on SCALE (it needs full DL tables, so it cannot reach
    the p that a sampled design can). dominated_by is NOT null.
  sota_delta: >-
    Zero speedup against any attack baseline. Two quantitative deltas:
    (1) A DERIVED CLOSURE of the field-side functional: Phi_field(E) lies in
    [sqrt(p)/2, 3 sqrt(p)/2](1 + o(1)) for EVERY curve over F_p, so the total
    achievable variation of field-side factor-base flatness -- within a class or
    across all curves -- is a factor of 3, hence no exponent, by Parseval below
    and Weil above. (2) A quantified statement of where the open question
    actually lives: the group-side window is [1, sqrt(B)] rather than a factor
    3, a gap of sqrt(B)/3, and that gap is exactly the missing algebraic
    mechanism KN-FIND-5c1a03 names. The class-invariance measurement of C(E) is
    then the cheapest available probe of that gap, at O(N log N) per curve.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.95 that the derived field-side pin holds and is observed -- it is Parseval
    plus Weil and the only risk is a wrong constant, which does not change the
    conclusion. 0.9 that the instrument controls pass. 0.75 that the C ~ 3
    reproduction against H-PSEUDO's convention succeeds; the 0.25 is real,
    because window conventions differ between records and a mismatch would be a
    useful finding in itself. 0.65 OUTCOME I, 0.2 OUTCOME W (the gauge interval
    is wide at toy N), 0.15 OUTCOME S. Even under OUTCOME S the reachability
    gate is expected to fail on identification cost, so the realistic best case
    is a sharp, controlled, toy-scale statement about the program's own central
    constant rather than a lead -- and that is worth high priority because the
    constant is central and the measurement is cheap.

