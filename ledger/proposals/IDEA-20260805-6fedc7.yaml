idea:
  id: IDEA-20260805-6fedc7
  question_id: RQ-FIND-001
  added: '2026-08-05'
  title: >-
    The promotion delivered its payload by identifier, and the identifier is
    ambiguous: GOAL-AES records cite "KN-FIND-017 Fact 2" for a statement that
    exists only in KN-FIND-028, and reserve 018/019 that this goal had already
    committed -- plus the selection gate that promoted 11 of 11 and could not
    have promoted fewer
  class: control

  claim: >-
    GOAL-FIND-001's objective is not "write 11 files"; it is "so Tier 1-2
    ideation treats closed families as durable internal ground truth". That is
    a claim about DELIVERY, and delivery happens through an identifier: a
    downstream agent writes KN-FIND-0xx and a later reader resolves it against
    knowledge/findings/. This proposal claims that the delivery channel is
    measurably broken for this goal's own output, and that the goal's selection
    gate could not have selected otherwise. Two independent findings, both
    checkable against committed files, both SESSION-COMPUTED and to be re-run
    in-harness. (1) IDENTIFIER COLLISION, WITH A FORCED ADJUDICATION.
    coordination/goals/GOAL-AES-002 and -003 contain sentences such as "it dies
    at the AFFINE layer L inside SubBytes rather than at the inversion
    (KN-FIND-017 Fact 2, internal, verified)". knowledge/findings/KN-FIND-017.md
    is "Scoped finding from EV-BKK-001" -- Newton box-saturation of
    target-sectioned Semaev systems -- and contains no section called Fact 2 and
    no mention of SubBytes, of an affine layer, or of GF(2^8).
    knowledge/findings/KN-FIND-028.md contains, verbatim, the heading
    "## Fact 2 - Inv preserves GF(2^8)-collinearity; the affine layer L does
    not". The citation therefore resolves uniquely to 028 and CANNOT resolve to
    017; the adjudication is a string-containment check, not a judgement.
    Separately, GOAL-AES records state that "KN-FIND-018 remains RESERVED BUT
    NOT COMMITTED TO" and likewise for 019 -- identifiers this goal COMMITTED on
    2026-07-25. Raw occurrence counts across GOAL-AES-001/002/003 coordination:
    017 x20, 018 x26, 019 x12, alongside 028 x24, 029 x11, 030 x1. The
    program already owns the mechanism as an internal finding: KN-FIND-030 is
    "Directory-scan ID allocation is not concurrency-safe across branches; two
    campaigns against one main allocate the same next-free id". This is a
    further instance of exactly that, sitting on this goal's own deliverable.
    (2) THE SELECTION GATE IS A RELABELLING. The section 1.1 set is defined as
    the evidence records with strength replicated; the gate promoted 11 of 11
    and issued 0 not_warranted. If the decision rule is "strength in
    {replicated, strong}", then promotion is a bijection with a field that
    already existed, its output carries ZERO bits not already in `strength`,
    and an 11-of-11 outcome is forced rather than earned -- the
    control-that-cannot-fail pattern. HONESTY REQUIRED AND SUPPLIED: the
    WORDING gate demonstrably did fire. Diffing the BATCH-001 draft (REVISE'd)
    against the BATCH-002 draft (PASS'd) gives 94 changed lines over 379 -> 411
    lines, adding proof_refs, DEC-20260722-003 cross-references and an explicit
    "all-m law remains CONJECTURE C1 (open)" note. So the review had
    discrimination; the SELECTION step is the one with none, and the DOWNSTREAM
    RESOLUTION is the one nobody has measured at all.

  object_first_candidate:
    tracked_object: >-
      THE CITATION EDGE: an ordered pair (citing record, KN-FIND identifier)
      followed from the point where a downstream agent writes it to the point
      where a later reader resolves it against knowledge/findings/. The object
      carries exactly one payload -- which finding is meant -- and the audit
      asks whether that payload survives the trip. Tracking the edge rather
      than the entry is what turns "did the promotion help?" from an opinion
      into a decidable question, because an edge either resolves to the entry
      its author meant or it does not, and the entry's own text decides which.
    established_families_off_limits: >-
      Off-limits as the primary lens: every cryptanalytic family. This proposal
      makes no mathematical claim about the ECDLP, about AES, or about
      anything. Also off-limits, and this one matters: BIBLIOMETRICS. The
      tempting move is to count citations of KN-FIND-017..027 and call a high
      number success -- 26, 24, 18, 12, 11, 10, 10, 10, 10, 11, 20 respectively,
      measured this session. That count is exactly the statistic this proposal
      refuses, because the KN-FIND-017 count of 26 includes at least one edge
      that provably means a different entry, and roughly 11 of the 26 are inside
      GOAL-FIND-001's own coordination tree, i.e. the promotion citing itself.
      A raw citation count is a comparator whose spread is dominated by
      self-reference, and using it would be the mirror failure.
    newness_score: >-
      The MECHANISM is not new to the corpus and the record says so plainly:
      KN-FIND-030 already states directory-scan ID allocation is not
      concurrency-safe, and CLAUDE.md's conventions section already forbids
      grepping for the next free number for precisely this reason. What is new
      is the INSTANCE and its direction: a collision landing on the committed
      output of GOAL-FIND-001, producing at least one substantive
      misresolution (017 -> 028) rather than a duplicate allocation, and doing
      so ACROSS a family boundary where no reader would think to look.
      Whether KN-FIND-030 already enumerates this instance is UNKNOWN -- its
      body says "The two instances" and this session did not read which two --
      and stage 0 reads it before any novelty is asserted.
    testability_score: >-
      Maximal and source-free. Every adjudication is a containment test between
      two committed files: does the cited entry contain the string the citing
      sentence attributes to it? No network, no compute, no judgement call on
      the decisive class.
    survival_score: >-
      The 017 -> 028 misresolution is already established by direct reading and
      will survive. What may not survive is the SCALE: it is entirely possible
      that this is one careless sentence repeated by copy-paste and that the
      other 57 edges into 017/018/019 are correct or are reservation prose
      rather than content citations. The proposal's design puts that
      possibility first, not last.

  mechanism: >-
    THE DELIVERY MODEL, WRITTEN OUT SO IT CAN BE ATTACKED. A promotion is
    intended to install a fact F into the program's retrievable ground truth.
    The installed artifact is a file; the retrieval handle is an identifier i;
    the delivery succeeds for a downstream record r iff resolve(i) as written in
    r equals the entry whose content r's author intended. Three failure modes
    exist and they are distinguishable by inspection:
      (A) MISRESOLUTION -- r cites i, but the content r attributes to i appears
          in entry j != i. Decidable by containment: does file(i) contain the
          attributed material? Does file(j)?
      (B) RESERVATION COLLISION -- r declares i "reserved but not committed to"
          while i is already committed with unrelated content. Decidable by
          date and by content disjointness.
      (C) SELF-REFERENCE -- r lives inside the promoting goal's own
          coordination tree, so the edge carries no information about external
          uptake. Decidable by path.
    Only edges surviving all three are evidence of the objective being met.
    The measured raw counts do not distinguish them, which is why the raw
    counts are refused as a metric.

    THE FORCED ADJUDICATION, DERIVED AND CHECKABLE IN ONE LINE EACH.
    Attributed material: "Fact 2", together with the claim that the obstruction
    is at the affine layer L inside SubBytes and that byte-wise inversion
    preserves GF(2^8)-collinearity. file(KN-FIND-028) contains the heading
    "## Fact 2 - Inv preserves GF(2^8)-collinearity; the affine layer L does
    not" -- read verbatim this session. file(KN-FIND-017) is titled "Scoped
    finding from EV-BKK-001" and its scoped claim reads "Toy p<=1009, m in
    {3,4,5}: target-sectioned Semaev systems are Newton box-saturated
    (MV=multigraded Bezout); no support-aware BKK solve-cost advantage in tested
    scope" -- also read verbatim. The two entries share no vocabulary. The
    forced value is therefore: containment("Fact 2" material, 028) = TRUE and
    containment("Fact 2" material, 017) = FALSE, so the edge is mode (A) with
    certainty and not by inference. THIS IS THE WHOLE POINT OF USING A
    CONTAINMENT TEST: it removes the auditor's opinion from the decisive step.

    THE ARITHMETIC OF THE COLLISION, AS A HYPOTHESIS TO TEST. GOAL-FIND-001
    committed KN-FIND-017..027 on 2026-07-25 (eleven entries, one per section
    1.1 evidence record). The AES lane's findings landed at KN-FIND-028..030.
    If the AES lane drafted against the next-free numbers 017, 018, 019 in its
    own worktree before the FIND promotion merged, then its internal references
    were written against those numbers and were shifted by exactly 11 at merge,
    leaving the PROSE references behind. The prediction that follows is sharp
    and can fail: every AES-side content citation of 017/018/019 should
    resolve to 028/029/030 respectively -- a CONSTANT OFFSET OF 11, not an
    arbitrary remapping. If the offsets are not constant, the shift explanation
    is wrong and some other mechanism produced the misreferences.

    THE SELECTION GATE'S INFORMATION CONTENT. Let S be the strength field and
    P the promotion outcome over the section 1.1 set. The measured joint is
    degenerate: S = replicated for all 11, P = promoted for all 11, and the
    complementary population (the 27 of 28 newer decisions recording
    promoted: [] with a not_warranted reason of the form "preliminary evidence,
    not a replicated/strong finding", per the assessment's section 1.1, READ)
    is the S = preliminary, P = not_promoted cell. The mutual information
    I(P; X | S) for any record feature X is therefore bounded above by what the
    data can express, and on this set the promotion outcome is a deterministic
    function of S. A gate whose output is determined by an existing field has
    added no bits: it is a relabelling, in exactly the sense the inventor
    protocol's change-of-coordinates test names. THE HONEST CONSEQUENCE IS
    NARROW AND IS STATED AS SUCH: this does NOT mean the promotion was wrong or
    that any entry is bad. It means the 11-of-11 rate is not evidence of
    judgement, so anyone citing "we promoted every replicated record" as
    quality assurance is citing a tautology.

    WHERE THE JUDGEMENT ACTUALLY LIVED, MEASURED. The two-batch structure gives
    a free two-point sensitivity demonstration and it PASSES: BATCH-001's
    draft_findings.md (379 lines, 1575 words) was REVISE'd by
    TASK-20260725-683; BATCH-002's (411 lines, 2012 words) PASSed. diff gives
    94 changed lines including added proof_refs to research/THM_BKKMV1.md,
    added internal_refs to DEC-20260722-003, and an added theorem cross-note
    stating "All-m law remains CONJECTURE C1 (open)". So the WORDING gate
    demonstrably could fail and did. Reporting this is not padding: it is the
    positive control for the review instrument, it came out positive, and a
    proposal that only reported the negative half would be selecting its
    evidence.

    COST BOOKKEEPING. Total edges to classify: 58 into 017/018/019 from the
    AES trees plus the 11 entries' full citation sets, on the order of 150
    edges. Per-edge cost: one grep for the citing sentence plus two containment
    tests, seconds. No inverse-probability term appears because nothing here is
    sampled -- the population is enumerable and is enumerated.

  novelty_status: unverified

  literature_context:
    - >-
      knowledge/findings/KN-FIND-017.md and KN-FIND-028.md (both READ in this
      session, front matter and headings; 017's scoped claim read verbatim).
      These two files are the entire basis of the forced adjudication.
    - >-
      knowledge/findings/KN-FIND-030.md (front matter and section headings READ;
      body NOT read). Its title states the directory-scan allocation mechanism.
      Whether it already enumerates the GOAL-FIND-001/GOAL-AES instance is
      UNKNOWN and is a stage-0 read, not an assertion.
    - >-
      coordination/goals/GOAL-AES-002 and -003 task files (matched sentences
      READ via targeted extraction with 80 characters of context on each side;
      the full documents were NOT read). The quoted fragments are verbatim; the
      surrounding argument is not characterised.
    - >-
      coordination/goals/GOAL-FIND-001/batches/BATCH-001/tasks/
      TASK-20260725-681/draft_findings.md and BATCH-002/tasks/
      TASK-20260725-693/draft_findings.md (DIFFED, first 16 diff lines read;
      the 94-line change count is machine-produced, the characterisation of
      what changed rests on those 16 lines only).
    - >-
      docs/knowledge-assessment-20260724.md section 1.1 (READ). Source of the
      eleven-record list and of the "27 of 28 record promoted: [] with a
      not_warranted reason" statement, which is quoted from it and not
      independently verified here.
    - >-
      CLAUDE.md conventions section (READ, supplied as project context). Source
      of the standing rule against grepping for the next free number and of the
      statement that the legacy three-digit form stays valid forever and must
      not be renamed -- which is why the repair here CANNOT be a rename.

  lossy_projection_identifiability_audit:
    projection: >-
      A research finding (a file of several hundred words, with a scope, a
      provenance chain and a proof status) --> its identifier, a 12-character
      string.
    what_is_discarded: >-
      The entire content. The identifier retains only the address.
    why_genuinely_lossy: >-
      Total. Nothing about the finding is recoverable from KN-FIND-017 except
      by dereferencing it, which is precisely the operation under audit.
    why_compatible_with_the_operations: >-
      The target operation is CITATION, and identifiers are designed to be the
      compatible projection for it: they are supposed to propagate through
      arbitrarily long chains of records while preserving reference exactly.
      That is the strongest possible compatibility -- and it is also the
      failure surface, because compatibility here is a PROMISE OF THE NAMESPACE
      rather than a property of the objects. When the namespace admits two
      allocations of one string, the projection stops being a function and the
      compatibility silently ceases, with no local signal at any citing site.
    is_it_only_a_change_of_coordinates: >-
      NO. An identifier is not recoverable-from and does not recover the
      object; the map finding -> id is many-to-one exactly when the namespace
      fails, which is the defect being measured. This is the opposite of the
      (Delta, Pi) = (x xor y, x*y) failure: there, nothing was lost and nothing
      gained; here, everything is lost by design and the whole system rests on
      the address being unique, so the question "is the address unique?" is the
      only question that matters and it has never been asked of this goal's
      output.
    mirror_failure_checked: >-
      The mirror failure -- a comparator constant across instances -- was
      checked and DOES threaten the obvious metric, which is why that metric is
      refused. Raw citation counts for KN-FIND-017..027 are 26, 24, 18, 12, 11,
      10, 10, 10, 10, 11, 20: a spread of 10 to 26, but with roughly 11 of
      017's 26 lying inside GOAL-FIND-001's own coordination tree, so the
      between-entry variation is dominated by a self-reference floor that is
      near-constant by construction. The measured quantity is therefore the
      CLASSIFIED edge count (mode A / B / C / valid), whose four cells are
      non-degenerate by inspection since mode A is already known non-empty and
      mode C is already known non-empty.

  assumptions:
    - >-
      That the AES-side sentences quoted were extracted with enough context to
      establish attribution. 80 characters each side is thin; a sentence could
      cite 017 legitimately and mention SubBytes for an unrelated reason. The
      containment test is designed so this does not matter for the decisive
      class -- if 017 does not contain the attributed material, the citation
      cannot be to 017 regardless of surrounding prose -- but the experiment
      reads full paragraphs before classifying anything.
    - >-
      That the constant-offset-of-11 hypothesis is the right explanation. It is
      a hypothesis and the experiment can refute it; no repair should be
      designed on it before it is tested.
    - >-
      That "reserved but not committed to" in the AES records means what it
      appears to mean. Stage 0 reads those paragraphs in full; the phrase could
      belong to a different namespace convention.

  predictions:
    - metric: >-
        forced_containment_check: whether the material attributed to
        "KN-FIND-017 Fact 2" in the GOAL-AES records appears in
        knowledge/findings/KN-FIND-028.md and does not appear in
        knowledge/findings/KN-FIND-017.md
      direction: different
      minimum_effect: >-
        FORCED: present in 028, absent in 017. Both files were read this
        session. If the in-harness re-check disagrees, the session read was
        wrong and the entire proposal is withdrawn on the spot.
    - metric: >-
        n_mode_A_edges: number of citation edges into KN-FIND-017..027 whose
        attributed material fails containment in the cited entry and succeeds
        in exactly one other entry
      direction: higher
      minimum_effect: >-
        >= 1, already met. The prediction with content is that it is >= 3 --
        the 017 Fact-2 form appears in more than one GOAL-AES file by the
        extraction performed. A result of exactly 1 means the defect is a
        single sentence and the finding must be reported at that size.
    - metric: >-
        offset_constancy: for every mode-A edge, the difference between the
        resolving entry's number and the cited entry's number
      direction: different
      minimum_effect: >-
        PREDICTED CONSTANT AND EQUAL TO 11 for every mode-A edge into
        017/018/019. This is the sharpest available falsifier of the merge-shift
        explanation: a single edge with a different offset refutes it and sends
        the audit looking for another mechanism. It can genuinely fail.
    - metric: >-
        external_valid_edge_count: citation edges into KN-FIND-017..027 that
        are NOT self-references (outside coordination/goals/GOAL-FIND-001/),
        NOT mode A, NOT mode B, i.e. edges that actually deliver the promoted
        finding to an external consumer
      direction: higher
      minimum_effect: >-
        NO NUMBER IS PRE-REGISTERED, deliberately -- inventing a threshold for
        "enough uptake" would be unfalsifiable. What is pre-registered is the
        reporting rule: the four modes are reported as counts with the total,
        per entry, and the goal's objective clause is assessed against the
        external_valid count alone. A count of 0 for any entry means that entry
        has never been consumed outside its own promotion machinery, which is a
        reportable fact about the objective and not a criticism of the entry.
    - metric: >-
        selection_gate_bits: bits of information in the promotion outcome
        beyond the strength field, over the section 1.1 population
      direction: lower
      minimum_effect: >-
        FORCED 0 by degeneracy: P is constant (promoted) across a population on
        which S is constant (replicated), so the conditional entropy is zero
        and no feature can carry conditional information. This prediction
        CANNOT fail on this population, and saying so is the finding -- the
        gate could not have discriminated because the population it was applied
        to has no variation. The honest test of the gate therefore requires a
        population with variation, which is the next prediction.
    - metric: >-
        counterfactual_gate_discrimination: applying the frozen promotion rule
        to a mixed population -- the 11 replicated records plus a matched set
        of non-replicated records of similar age, layout and lane -- how many
        of each class it promotes
      direction: different
      minimum_effect: >-
        FORCED under the relabelling hypothesis: 11 promoted, 0 of the matched
        non-replicated set promoted, and the rule's output reproducible from
        `strength` alone with zero errors. If ANY non-replicated record is
        promoted, or any replicated one refused, the rule reads something
        beyond `strength` and the relabelling claim is falsified. This is the
        null object of the same shape, it is constructible from committed
        records, and it can fail.

  minimal_test:
    design: >-
      Four stages, cheapest first, entirely offline. STAGE 0 (reading, ~2
      hours, zero compute): read KN-FIND-030 in full and record whether this
      instance is already enumerated -- if it is, the collision half is a
      rediscovery and is reported as one; read the GOAL-AES paragraphs
      containing the 58 edges in full rather than in extracts; read
      DEC-20260725-024 and EV-FIND-003 to recover the promotion rule as
      actually written, and FREEZE it before applying it to anything. STAGE 1
      (forced check, seconds): the containment test on 017 versus 028. If it
      does not come out as derived, STOP. STAGE 2 (classification, ~2 hours):
      enumerate every citation edge into KN-FIND-017..027 across ledger/,
      experiments/, knowledge/, docs/ and coordination/; classify each as
      A / B / C / valid under a rubric frozen in stage 0; compute offset
      constancy over the mode-A set. STAGE 3 (counterfactual, ~1 hour): build
      the matched non-replicated control population, apply the frozen rule, and
      report the confusion matrix.
    controls:
      - >-
        POSITIVE CONTROL FOR THE REVIEW INSTRUMENT (already run, already
        positive, reported rather than assumed). The BATCH-001 -> BATCH-002
        draft diff: 94 changed lines over 379 -> 411, adding proof_refs,
        DEC-20260722-003 references and an explicit open-conjecture note. This
        demonstrates the review gate could fail and did. Had this come out
        empty, the PASS verdict would have been a control that cannot fail and
        NO negative conclusion about the selection gate would have been
        reportable either, because both gates would then be untrustworthy for
        the same reason.
      - >-
        NULL OBJECT OF THE SAME SHAPE (can genuinely fail). The matched
        non-replicated population in stage 3: evidence records of comparable
        age and layout whose strength is NOT replicated. FORCED VALUE DERIVED
        BEFORE THE RUN: the frozen promotion rule refuses all of them. If it
        promotes any, the rule is not the relabelling this proposal claims, and
        the claim is withdrawn.
      - >-
        NEGATIVE CONTROL FOR THE CONTAINMENT TEST (can genuinely fail). Run the
        containment test on a citation edge KNOWN to be correct -- e.g. a
        GOAL-AES record citing KN-FIND-028 for Fact 2. FORCED: containment
        succeeds, mode = valid. If the test flags a correct edge as mode A, the
        test has no specificity and no mode-A count may be reported.
      - >-
        GRADED CONTROL, 4 CELLS, MONOTONICITY REPORTED. Perturb the attributed
        material fed to the containment test by deleting 0, 25, 50 and 75
        percent of its distinctive tokens, and report the classifier's mode-A
        rate at each cell. FORCED at the endpoints: at 0 percent deletion the
        correct edge classifies as valid; at 75 percent, with almost no
        distinctive tokens left, containment becomes uninformative and the
        classifier must report UNDECIDABLE rather than mode A. The interior
        points localise how much attributed text the method needs, which is the
        difference between a usable rubric and one that only works on the
        example it was designed from.
      - >-
        ORDERING CONTROL. The classification rubric and the promotion rule are
        frozen by hash in stage 0, before the 58 edges are read in full. The
        stage-3 counterfactual is executed and committed before the stage-2
        classification counts are looked at.
      - >-
        SELF-REFERENCE FLOOR, REPORTED NOT SUBTRACTED. Mode-C edges are counted
        and reported per entry rather than removed silently, so a reader can
        see that roughly 11 of KN-FIND-017's 26 edges are the promotion citing
        itself and judge the rest accordingly.
    required_metrics:
      - stage-0 finding on whether KN-FIND-030 already enumerates this instance, quoted
      - the frozen rubric and promotion rule with their hash
      - the containment result for 017 versus 028, with the exact strings compared
      - full edge table: citing file, cited id, attributed material, containment results, mode, resolving id where applicable
      - per-entry four-mode counts for all of KN-FIND-017..027 with totals
      - offset table over the mode-A set and the constancy verdict
      - the stage-3 confusion matrix over the matched control population
      - the graded-control table with the UNDECIDABLE rate per cell

  falsification_conditions:
    - >-
      The containment test does not reproduce: the Fact-2 material is found in
      KN-FIND-017, or not found in KN-FIND-028. The session reading was wrong
      and the proposal is withdrawn entirely.
    - >-
      The negative control flags a known-correct edge as mode A. The classifier
      has no specificity; no counts may be reported.
    - >-
      Offsets over the mode-A set are not constant. The merge-shift explanation
      is refuted and the mechanism section must be rewritten before any repair
      is designed.
    - >-
      The frozen promotion rule, applied to the matched non-replicated control,
      promotes at least one member. The selection gate reads more than
      `strength` and the relabelling claim is false.
    - >-
      KN-FIND-030 already enumerates this instance. The collision half is a
      rediscovery; it is reported as one and the proposal's novelty claim is
      reduced accordingly.
    - >-
      Every mode-A edge turns out to lie in prose that is explicitly
      hypothetical or in a task log rather than in a record another agent would
      resolve. The blast radius is then near zero and must be reported that way
      rather than as "misreferences are live".

  confounders:
    - >-
      EXTRACTION WINDOW. The session evidence comes from 80-character context
      windows, which cannot show whether a sentence is an assertion, a
      quotation, or a hypothetical. Stage 0 reads full paragraphs precisely
      because this confounder can invert the finding for any individual edge.
    - >-
      COPY-PASTE MULTIPLICITY. One careless sentence duplicated across nine
      files would produce nine mode-A edges and a count that overstates the
      number of independent errors. The edge table therefore records the
      attributed material verbatim so duplicates are visible, and the report
      states both the edge count and the distinct-sentence count.
    - >-
      RENAMING IS FORBIDDEN AND MUST NOT BE PROPOSED. CLAUDE.md states that
      existing records are immutable and must not be renamed, and AGENTS.md
      rule 2 says corrections supersede. Any repair is a NEW disambiguation
      register or a superseding correction authored by the Coordinator, never
      an edit to 017..027 or to the citing files. A proposal that quietly
      implied renaming would be proposing to break every archive receipt that
      binds those paths.
    - >-
      DIRECTION OF BLAME. The collision is a namespace defect, not a fault of
      either lane; both followed the convention in force at the time, and
      KN-FIND-030 exists because this program already recognised that. Any
      write-up phrasing it as one campaign's error would be both unfair and
      wrong about the mechanism.
    - >-
      OBJECTIVE VERSUS CRITERION. GOAL-FIND-001's completion CRITERION is about
      coverage, and coverage may well be met. This proposal audits the
      OBJECTIVE clause about downstream use, which is a different sentence in
      the same record. Conflating them would let a delivery finding masquerade
      as a coverage failure.

  interpretation_limits:
    - >-
      No mathematical claim of any kind is made or touched. No exponent moves.
      This is an audit of a namespace and a gate.
    - >-
      A low external_valid count for an entry is NOT evidence the entry is
      unimportant or wrong. It is evidence about consumption, in a program
      whose downstream agents are ephemeral and may simply not have needed it
      yet.
    - >-
      NO STATUS CHANGE is proposed for GOAL-FIND-001, GOAL-AES-001/002/003, any
      KN-FIND entry, or any decision. Rule 1 reserves that to the Coordinator.
    - >-
      The audit covers KN-FIND-017..027 and the edges into them. It says
      nothing about the other 37 entries in knowledge/findings/ and must not be
      generalised to them without repeating the measurement.

  heuristic_assumptions:
    - id: HA-1
      statement: >-
        NONE IS LOAD-BEARING FOR THE DECISIVE CLASS. The mode-A adjudication is
        string containment between two committed files, and the selection-gate
        degeneracy is a counting fact about a population of 11 with a constant
        field. Neither involves a model, a sample or an extrapolation.
      rigorous_support: >-
        Containment is decidable; conditional entropy of a constant is zero.
      validation_plan: >-
        The negative control and the graded control validate the containment
        classifier's specificity and its token-budget requirement directly.
    - id: HA-2
      statement: >-
        (Genuinely assumed, and testable) The mode-A edges arose from a
        merge-time renumbering with constant offset 11.
      rigorous_support: >-
        Consistent with the committed dates (FIND promotion 2026-07-25, AES
        entries at 028..030) and with KN-FIND-030's own stated mechanism. NOT
        derived, and no allocation log was read.
      validation_plan: >-
        The offset-constancy metric tests it directly and a single deviant
        offset refutes it. Git history of the two lanes would settle it and is
        an optional stage-3 extension.

  target_complexity:
    time_exponent: >-
      n/a -- NO EXPONENT MOVES, stated plainly as the contract requires. The
      case for running it is that this goal's entire product is delivered
      through identifiers, that at least one identifier provably fails to
      deliver, and that the audit costs one working day of offline reading.
    memory_exponent: n/a -- no algorithm.
    best_known: >-
      No incumbent measurement exists. The only comparable artifact is the raw
      citation count, which this proposal argues is not a valid comparator and
      which nobody has published for these entries in any case.
    hidden_overhead: >-
      Stage 0 and stage 2 are human reading, which is the real cost and is why
      the population is bounded to 11 entries and their edges rather than the
      whole corpus.
    tradeoff_note: n/a.

  dominated_by: null
  dominated_by_search_note: >-
    null asserted only after checking, with the checks named. TIME: no tool in
    tools/ resolves citations or checks identifier uniqueness across the
    knowledge corpus -- the directory was listed and contains allocation, index
    building, dispatch, hygiene, merge/sync and ledger validation;
    build_knowledge_index.py builds an index of what exists, which is a
    different question from whether a citation resolves to what its author
    meant. MEMORY: not a dimension of this object; the audit is a bounded
    enumeration and there is no lower-footprint alternative to dominate it.
    DATA/QUERIES: zero external queries, the minimum possible, so no
    source-based method can dominate on that axis. NOT CHECKED and recorded as
    unchecked: whether KN-FIND-030 or any CORR-* record already enumerates this
    specific FIND/AES instance. Stage 0 performs that read; a hit supersedes
    this dominated_by with that record's id and demotes the collision half to a
    rediscovery.
  sota_delta: >-
    Quantitative against an unmeasured baseline. Citation edges into
    KN-FIND-017..027 classified before: 0 of roughly 150. After: all of them,
    into four modes with per-entry counts, plus an offset-constancy verdict
    over the mode-A set. Selection-gate discrimination before: asserted by an
    11-of-11 rate. After: a confusion matrix against a matched control
    population that could have falsified it. Review-gate discrimination before:
    asserted by a REVISE-then-PASS sequence. After: quantified at 94 changed
    lines over 379, with what changed enumerated. Cost: one working day,
    zero compute, zero network.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.95 that the 017 -> 028 misresolution reproduces in-harness: two files
    were read directly and share no vocabulary, and the attributed heading was
    read verbatim in 028. It is not 1.0 only because the reading was via
    targeted extraction and a full-paragraph read could reveal the citing
    sentence to be quoting rather than asserting. 0.60 that offset constancy
    holds at exactly 11 across all mode-A edges: not higher because no
    allocation log was consulted and the AES lane's numbering history is
    inferred, not observed; not lower because the arithmetic 017+11=028,
    018+11=029, 019+11=030 lines up with three consecutive pairs, which is
    unlikely to be coincidence. 0.90 that the selection gate is confirmed as a
    relabelling: the degeneracy is already visible in the committed population
    and the only way out is a promotion rule that reads something beyond
    strength, which stage 0 would find. 0.30 that any mode-A edge turns out to
    sit in a record another agent would actually resolve rather than in a task
    log -- and that number, the lowest here, is the proposal's real risk and
    the reason its write-up must lead with the edge table rather than the
    headline.
