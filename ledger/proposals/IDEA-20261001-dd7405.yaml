# =============================================================================
# IDEA-20261001-dd7405 -- Linearized quasi-subfield complete-split density at toys.
# Calibrates KR-IC-49c882; no break / no exponent claim.
# =============================================================================
idea:
  id: IDEA-20261001-dd7405
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    HOW OFTEN DO CANDIDATE LINEARIZED QUASI-SUBFIELD POLYNOMIALS SPLIT
    COMPLETELY AT TOY PRIME n? On F_{2^n} for n∈{17,19,23,29,31}, sample
    frozen families of linearized X^{2^{n'}}−λ(X) candidates and measure the
    complete-split frequency against the β≥3/4 obstruction context of
    KR-IC-49c882.

  class: heuristic_validation

  claim: >-
    KR-IC-49c882 records that index calculus over binary fields could improve
    if quasi-subfield polynomials X^{p^{n'}}−λ(X) with small λ split completely
    often enough, while Euler–Petit prove β≥3/4 for linearized complete
    splitters and useful families remain open. CLAIM: for each toy prime
    n∈{17,19,23,29,31}, under a frozen sampling law for (n',λ) with
    deg λ ≤ L_max (pre-registered), the empirical complete-split frequency
    p_split among ≥200 candidates satisfies p_split ≥ p0 (pre-registered
    p0=0.05) — OR p_split < p0 and is recorded as rare-at-toy under that
    law. CLAIM TIER: heuristic_validation. NO break. NO exponent. NO claim
    that a useful quasi-subfield family exists at cryptographic n
    (KR-IC-49c882 remains open). NO transfer to deployed binary curves.

  mechanism: >-
    OBJECT FRAME. Representation R1: univariate linearized polynomials over
    F_{2^n} as candidate quasi-subfield factor-base supports (KR-IC-49c882),
    not a new Semaev S_m. Operation set: complete-split / root-count oracle
    only — no PDP solve, no full IC. Trichotomy: Class I partial-action is
    NOT claimed; this is a pre-IC density meter on the FB description.
    Lossy-projection: split frequency discards root geometry beyond
    completeness; null is a matched-degree random (non-linearized) poly
    family whose complete-split rate should be near the birthday/Frobenius
    baseline and not inherit linearized structure. OFF-LIMITS: asserting
    KR-IC-889857; claiming GHS covers (KR-IC-5ea2f8) as this meter; redesign
    of V product spaces (KR-IC-73db3f / IDEA-fbee3f). WHAT IS NEW: a
    pre-registered complete-split frequency band for linearized candidates
    on RQ-BINSTD toy primes.

  novelty_status: unverified
