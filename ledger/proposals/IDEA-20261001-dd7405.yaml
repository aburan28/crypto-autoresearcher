  assumptions:
    - Frozen sampling law for (n',λ), L_max, and complete-split definition.
    - Root-count oracle already admitted or cell is failed_infrastructure.
    - p0=0.05 and ≥200 samples pre-registered; no post-hoc edits.
    - Measuring split density ≠ constructing a cryptographic FB attack.

  heuristic_assumptions:
    - id: HEUR-BINSTD-dd7405-H1
      formal_statement: >-
        FORALL prime n∈{17,19,23,29,31}: under the frozen sampling law with
        deg λ ≤ L_max, among ≥200 independent linearized candidates
        X^{2^{n'}}−λ(X), the empirical complete-split frequency p_split ≥ 0.05.
      random_model_justification: >-
        Rigorous: KR-IC-49c882 / Euler–Petit β≥3/4 bound the linearized
        splitter regime and leave useful families open. Classical: if a
        sampling law concentrates on structured λ, complete splits may be
        non-rare at toys; whether p_split clears p0=0.05 is the transfer
        hypothesis under test — not a claim that β can be beaten or that
        crypto-sized families exist.
      supporting_results:
        - KR-IC-49c882
      validation_experiment_ids: []
      falsification_condition: >-
        p_split < 0.05 at a completed n-cell, OR a matched-degree random
        non-linearized family shows p_split ≥ p_split(linearized)−ε with
        ε=0.02 (linearized structure is not the driver), OR the root oracle
        is absent (infrastructure stop).

  predictions:
    - metric: linearized_complete_split_frequency
      direction: lower_bounded
      minimum_effect: '≥ 0.05 at each toy prime n under the frozen law'
    - metric: random_poly_control_split_frequency
      direction: differ
      minimum_effect: 'p_split(linearized) − p_split(random) ≥ 0.02 when both measured'
    - metric: sample_count
      direction: lower_bounded
      minimum_effect: '≥ 200 candidates per n-cell'

  minimal_test: >-
    Stage 0: freeze sampling law, L_max, complete-split oracle, seeds.
    Stage 1: n=17,19 — ≥200 candidates each; report p_split ± Wilson CI.
    Stage 2: n=23,29,31 + matched random non-linearized null. Budget: ≤6
    CPU-hours. Stop if root oracle absent (IMP, never evidence).

  controls:
    - ctl_frozen_sampling_law
    - null_random_poly_matched_degree
    - ctl_wilson_ci_reported
    - ctl_no_posthoc_p0_edit

  falsification_conditions:
    - Claiming a cryptographic quasi-subfield FB from toy p_split (KR-IC-49c882 open).
    - Transferring toy frequencies to n≥131 without a new contract.
    - Editing p0 or L_max after seeing splits.
    - Treating oracle absence as mathematical falsification.

