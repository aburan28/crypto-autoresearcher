  cost_accounting:
    raw_model: >-
      Primitive group, field, label, hash, lookup, verification, and byte counts
      are separate. A matched benchmark may convert them to group equivalents;
      no free label table or transform exists.
    derivation:
      per_root_raw: N^(1/3+o(1))
      marginal_boolean_success: N^(-1/3+gamma_s+o(1))
      expected_roots: N^(1/3-gamma_s+o(1))
      total_raw: N^(2/3-gamma_s+o(1))
      live_entries: N^(1/3+o(1))
      wiring_multiplier: N^(1/9+o(1))
      total_full_cost: N^(7/9-gamma_s+o(1))
      raw_rho_crossover: gamma_s>1/6
      full_rho_crossover: gamma_s>5/18
      standard_bsgs_full_crossover: gamma_s>1/9
      memory_matched_bsgs_delta: gamma_s
    preprocessing: >-
      P and Q fixed-base tables, curve/model construction, coverage calibration,
      failed controls, and discovery are charged. The minimal design performs no
      model search. Advice, learned labels, or reusable root tables are absent.
    model_discovery_gate: >-
      Screening J=N^delta_m models with R=N^rho_m roots costs raw
      N^(delta_m+rho_m+1/3) and full N^(delta_m+rho_m+4/9); beating rho additionally
      requires delta_m+rho_m<1/18 and an untouched-holdout gamma_s>5/18.
    parallel_form: >-
      H=N^pi engines give wall exponent 2/3-gamma_s-pi until roots exhaust, but
      total raw work stays N^(2/3-gamma_s), aggregate entries become
      N^(pi+1/3), and each table, engine, byte, and message is charged.
    multi_target: >-
      With K=N^tau independent targets and no sharing, sequential raw exponent
      is tau+2/3-gamma_s and full exponent tau+7/9-gamma_s. No multi-target
      improvement is claimed.

