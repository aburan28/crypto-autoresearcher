    reason: >-
      This version specifies repairs for every BATCH-bca81e blocker. It has not
      passed TASK-20260808-1da4a9, and no experiment contract, approval,
      implementation, curve generation, control, treatment, run, or evidence
      exists.

  claim: >-
    CONDITIONAL ALGORITHM TARGET, NOT A RESULT OR ATTACK CLAIM. Let G=<P> have
    prime order N, let Q=[k]P, and let one signed-y four-list root have verified
    Boolean success S. On one public preregistered family/model/root
    distribution define p_N=Pr[S=1] and
      p_N=N^(-1/3+gamma_s+o(1)).
    If selector regularity, the distinct-match second-moment bridge,
    independent restarts, and the declared wiring model all hold, then one root
    has N^(1/3+o(1)) raw group work and N^(1/3+o(1)) live entries. Expected raw
    work is N^(2/3-gamma_s+o(1)); Wiener-convention full cost is
    N^(7/9-gamma_s+o(1)). The raw Pollard-rho crossover is gamma_s>1/6, the
    mandatory fully charged rho crossover is gamma_s>5/18, and the standard
    BSGS full-cost crossover is gamma_s>1/9. All inequalities are strict.
    No positive gamma_s, asymptotic solver, speedup, security impact, or
    crypto-scale validation is asserted. The leading prior remains gamma_s=0.

  mechanism: >-
    For affine R=(x,y), let y_tilde be the centered representative of y and set
      h_y(R)=sgn(y_tilde)*floor(M*abs(y_tilde)/p) mod M,
    with h_y(O)=0. For each root sample fresh a in (Z/NZ)^*, b in Z/NZ, z in
    Z/MZ, and four length-L scalar lists without replacement within each list.
    Put Q'=[a]Q+[b]P and R_j,i=[r_j,i]P. Select left pairs with label sum z and
    right pairs with label sum h_y(Q')-z. Only exact point sums A+B=Q' count.
    A witness reconstructs
      k_hat=a^(-1)*(r_1+r_2+r_3+r_4-b) mod N
    and succeeds only if [k_hat]P=Q. Labels select work; they never substitute
    for exact equality or scalar verification. Any exponent gain must appear in
    marginal verified Boolean success after all costs and controls are charged.

  test_object:
    tracked_object: >-
      The root tuple (D,Y,X,V,S): realized selected cross-pair denominator D,
      multiplicity-weighted matching quadruples Y, distinct exact matching
      point sums X, verified distinct matches V, and Boolean success S.
    lossiness: >-
      h_y is a public lossy coordinate partition. It is not assumed to
      propagate deterministically; prime-order congruence rigidity excludes a
      nonconstant exact quotient. The tested escape is probabilistic only.
    depth_of_verified_structure: >-
      Signed-y antisymmetry, public isomorphism algebra, and scalar recovery are
      derivable. Positive enrichment, subpolynomial clustering, family scaling,
      and a better-than-rho exponent are unverified.

  root_random_variables:
    probability_space: >-
      Probability is over the frozen curve generator and uniform target,
      followed by a uniformly weighted public model rule and fresh root inputs.
      For the primary family estimand, a curve and its target have weight 1/C,
      each of the four fixed models has weight 1/4, and each of R roots has
      weight 1/R. Isomorphic models are repeated observations inside the curve,
      never independent family draws.
    definitions:
      - symbol: I_L
        definition: Selected left index pairs satisfying the left label equation.
      - symbol: I_R
        definition: Selected right index pairs satisfying the right label equation.
      - symbol: C_L(A)
        definition: Number of selected left pairs with exact sum A.
      - symbol: C_R(B)
        definition: Number of selected right pairs with exact sum B.
      - symbol: D
        definition: '|I_L|*|I_R|, retained exactly as a diagnostic only.'
      - symbol: Y
        definition: >-
          Sum_A C_L(A)*C_R(Q'-A), the matching index-quadruple multiplicity.
      - symbol: X
        definition: >-
          Number of distinct A with C_L(A)>0 and C_R(Q'-A)>0.
      - symbol: V
        definition: >-
          Number of those distinct A whose reconstructed scalar verifies.
          Correct apparatus has V=X.
      - symbol: S
        definition: '1[V>=1], the only runtime success variable.'
      - symbol: mu_N
        definition: 'E[X] on the frozen marginal family probability space.'
      - symbol: p_N
        definition: 'Pr[S=1] on the same marginal probability space.'
      - symbol: kappa_N
        definition: 'E[X^2]/E[X] when E[X]>0.'

  boolean_success_derivation:
    upper_bound: 'Pr[X>=1] <= E[X].'
    lower_bound: >-
      Paley-Zygmund at threshold zero gives
        Pr[X>=1] >= E[X]^2/E[X^2] = E[X]/kappa_N.
    bridge_condition: >-
      If mu_N=N^(-1/3+gamma_x+o(1)), kappa_N=N^o(1), and V=X except with
      negligible apparatus-failure probability, then p_N has the same exponent
      and gamma_s=gamma_x. Expected Y is never used in this implication.
    saturation_case: >-
      p_N<=1 forces gamma_s<=1/3. At gamma_s=1/3 inverse-success cost is
      constant and the finite marginal Bernoulli probability is fitted directly.
    runtime_assembly: >-
      W_root=N^(1/3+o(1)) and independent restarts give
      E[roots]=1/p_N=N^(1/3-gamma_s+o(1)); hence total raw work is
      W_root/p_N=N^(2/3-gamma_s+o(1)).

  assumptions:
    - >-
      Odd prime-order short-Weierstrass subgroups with N approximately p;
      curve-order, subgroup, cofactor, anomalous, and exceptional-curve checks
      precede admission.
    - >-
      Single target, no external oracle, no nonuniform advice, no free label
      table, and a public affine coordinate model fixed before data.
    - >-
      Root seed domains are disjoint. Lists are sampled without replacement
      within a list; no selected-pair table or list is reused across roots.
    - >-
      Group and field operations, affine normalization, hashing, lookup,
      storage, memory traffic, communication, failed roots, and verification
      are all charged.

  heuristic_assumptions:
    - id: HA-1-selector-regularity
      formal_statement: >-
        Uniformly over the frozen family and roots, |I_L| and |I_R| are
        N^(1/3+o(1)); maximum bucket and exact point-sum multiplicities are
        N^o(1).
      rigorous_support: >-
        Realized histograms give exact finite counts. Standard occupancy bounds
        give the balanced-label null scale, not a theorem for signed-y.
      distribution_imitated: Four uniform scalar lists under a balanced M-way label map.
      validation_plan: >-
        Retain every bucket count plus I_L, I_R, C_L max, C_R max, duplicates,
        selected-pair totals, and cap flags. Compare all treatment cells with
        the control-first null envelope.
      falsification_condition: >-
        Any side above 4L selected pairs, combined work above 8L, or polynomial
        bucket or point-sum multiplicity invalidates the cost model. Cap failure
        is infrastructure, not ECDLP evidence.
    - id: HA-2-distinct-match-enrichment
      formal_statement: >-
        There exist public family and model rules with gamma_x>0 such that
        E[X]=N^(-1/3+gamma_x+o(1)); decision-changing scope requires
        gamma_x>5/18.
      rigorous_support: >-
        No prime-curve theorem supports this. Exact quotient and balanced null
        controls calibrate nearby endpoints only.
      distribution_imitated: >-
        A nonhomomorphic coordinate partition retaining polynomial information
        about the complete exact four-list event.
      validation_plan: >-
        Fit marginal S and report marginal X moments on the complete ladder.
        Require every synthetic exponent and bridge control to pass first.
      falsification_condition: >-
        A complete valid schedule with UCB_99.5(gamma_s)<=5/18 under every
        frozen sensitivity falsifies only the full-cost crossover for this
        exact family and schedule.
    - id: HA-3-subpolynomial-root-clustering
      formal_statement: >-
        For gamma_x<1/3, kappa_N=E[X^2]/E[X]=N^o(1), Y/max(1,X)=N^o(1), and
        p_N/E[X]=N^o(1) with exponent zero on the frozen family.
      rigorous_support: >-
        Paley-Zygmund proves the bridge if the premise holds. The premise is
        unproved for signed-y.
      distribution_imitated: >-
        A rare-event process without polynomially many distinct matches
        concentrated in a polynomially smaller set of roots.
      validation_plan: >-
        Fit frozen marginal slopes delta_kappa for kappa_N and delta_ratio for
        p_N/E[X]. Treatment interpretation requires UCB_99.5(delta_kappa)<=0.02
        and LCB_99.5(delta_ratio)>=-0.02 under every sensitivity. The exact
        matched-mean control plants slopes +1/3 and -1/3 and must be detected.
      falsification_condition: >-
        Positive polynomial kappa or Y/X growth, or negative polynomial
        p_N/E[X] decay, breaks runtime even if expected matches are enriched.
    - id: HA-4-independent-restarts
      formal_statement: >-
        Conditional on an input and model, disjoint root seeds generate
        independent (a,b,z,list) draws, so time to first S=1 is geometric.
      rigorous_support: >-
        Nonzero a and uniform b make Q' uniform for fixed Q; implementation
        independence still requires seed and mutable-state audits.
      distribution_imitated: Geometric trials conditional on a fixed input.
      validation_plan: >-
        Static domain audit, duplicate-tuple rejection, lag diagnostics, root
        permutation, and a hard prohibition on list or selected-table reuse.
      falsification_condition: >-
        Seed collision, list reuse, mutable carry-over, or lag dependence beyond
        the 0.999 null envelope invalidates restart inference.
    - id: HA-5-family-and-model-scaling
      formal_statement: >-
        The public curve generator and four public model rules define a stable
        marginal family whose gamma_s is represented by the five-size ladder.
      rigorous_support: >-
        Isomorphisms preserve ECDLP and scalar recovery but not centered-y labels.
      distribution_imitated: >-
        Independent curves and targets with nested public isomorphic models.
      validation_plan: >-
        Use 32 curves per size and four fixed models. Report primary uniform-model
        family marginal, canonical marginal, heterogeneity, and model fractions.
      falsification_condition: >-
        Failure of the family or canonical gate prevents a model-robust claim;
        heterogeneity narrows scope and makes discovery cost mandatory.
    - id: HA-6-wiring-access-charge
      formal_statement: >-
        Selected tables are touched at a nonvanishing rate, so the repository
        convention FC=W*S^(1/3) applies.
      rigorous_support: >-
        KN-TECH-035 records the three-dimensional full-cost convention; applying
        it here is an architectural assumption with unextracted constants.
      distribution_imitated: none_architectural
      validation_plan: >-
        Count table accesses and bytes by phase. The scheduled traffic floor and
        20-percent reserve are frozen below.
      falsification_condition: >-
        A decaying table-access fraction or worse storage exponent requires a
        superseding cost record before any comparison.
    - id: HA-7-finite-size-family-model
      formal_statement: >-
        For exact subgroup orders on the 18--30-bit ladder, the marginal log
        probability follows the frozen power-law mean with one of the three
        fixed corrections eta in {-4,0,4}; the intercept is free.
      rigorous_support: >-
        None for signed-y. The correction set is sensitivity analysis, not a
        theorem or a fitted nuisance family.
      distribution_imitated: A power law with a bounded first finite-size correction.
      validation_plan: >-
        Every control and treatment is fitted under all three eta values, with
        residuals and leave-one-size-out slopes reported but never promoted.
      falsification_condition: >-
        Coverage failure, systematic curvature, or gate disagreement across eta
        makes the asymptotic interpretation inconclusive.

  marginal_boolean_estimand:
    estimand_name: uniform-public-model_family_marginal_boolean_probability
    exact_definition: >-
      For exact order N, p_N=E_C,E_Q[(1/4) sum_{m=0}^3
      E_root[S(C,Q,m,root)]] where C follows the frozen family generator, Q is
      uniform in <P>, m indexes canonical plus the three fixed public models,
      and roots follow the frozen root generator. Curves and targets are outer
      family draws; models and roots are nested repeated observations.
    canonical_scope_estimand: >-
      p_N,canonical uses m=0 only and is a required scope check, never an
      alternate route around a failed primary family marginal gate.
    reference_order: 16777216
    link_and_mean: >-
      For fixed eta in {-4,0,4}, define
        log p_i = alpha + beta*log(N_i/16777216)
                    + eta*(N_i^(-1/3)-16777216^(-1/3)),
      subject to 0<p_i<1 for every observed N_i. Set beta=gamma_s-1/3.
      This is a direct marginal Bernoulli log-link mean, not a hazard model.
    explicit_slope_to_probability_link: >-
      The fitted slope is beta_hat and gamma_hat_s=beta_hat+1/3 exactly. Since
      the fixed eta term converges to a constant absorbed by alpha,
      log p_N/log N -> beta and p_N=N^(-1/3+gamma_s+o(1)). No rare-event
      approximation, complementary-log-log conversion, or conditional-to-
      marginal conversion is used.
    point_estimator: >-
      For each eta, maximize the curve-equal working-independence composite
      Bernoulli log-likelihood. Each size has total weight one, each curve has
      weight 1/32, each model 1/4, and each root 1/256. The objective is the sum
      of weighted S*log(p_i)+(1-S)*log(1-p_i), with alpha and beta free and the
      probability constraints enforced by a deterministic active-set Newton
      solver initialized at alpha=log(0.2) and beta=-1/3 for every arm and eta.
      Tolerance is max score norm <=1e-10 and max parameter change <=1e-12 in
      100 iterations; no data-dependent initialization is permitted.
    random_effect_law: none
    random_effect_reason: >-
      The model targets the marginal mean directly. Correlation changes
      uncertainty, handled by whole-curve resampling, but introduces no latent
      intercept and therefore no unspecified integration law.
    marginalization_computation: >-
      Marginalization is the declared design-weighted sum over all observed
      models and roots inside each curve followed by equal weighting of curves.
      There is no quadrature, empirical-Bayes effect, Laplace approximation, or
      conditional slope. Fitted p_N is evaluated directly from the displayed mean.
    D_exposure: omitted
    proportional_hazard_in_exposure_assumption: false
    exposure_reason: >-
      Realized D is a selector-regularity and bridge diagnostic only. No
      assumption that Boolean hazard is proportional to D is made.
    floor_offset:
      retained: false
      exact_formula: 'offset_D(N,L,M,D)=0 and offset_floor(N,L,M)=0.'
      reason: >-
        The unconditional Boolean estimand already averages over realized L, M,
        and D. Adding log D or another floor term would change the estimand and
        risk double counting. Exact N,L,M,D remain in every root record.
    bootstrap:
      method: size_stratified_nonparametric_whole_curve_pairs_bootstrap
      draws: 8191
      resampling_unit: >-
        One complete curve-target cluster. At each size independently, sample
        32 curve indices with replacement and move all four models and all 256
        roots together. Synthetic arms substitute their 32 complete fixture
        clusters. Sizes are never resampled.
      seed_domain: >-
        SHAKE256 of the UTF-8 string
        IDEA-20260808-9d6677|bootstrap-v1|arm=<arm>|eta=<eta>|draw=<0..8190>,
        decoded as rejection-sampled uint32 indices in [0,31].
      resampled_statistic: >-
        Refit the identical constrained marginal log-link estimator and retain
        gamma_hat_star=beta_hat_star+1/3. No residual, score, null restriction,
        fitted random effect, or studentization is used.
      interval_construction: >-
        Sort all 8191 converged gamma_hat_star values. The one-sided 99.5-percent
        lower and upper bounds, equivalently the endpoints of a two-sided
        99-percent percentile interval, are the 41st and 8151st one-indexed
        order statistics. Quantiles are type-1 with no interpolation.
      convergence_rule: >-
        All 8191 refits must converge. A missing or substituted draw makes the
        cell inconclusive; no bootstrap draw is discarded or regenerated.

  bridge_diagnostic_estimators:
    cell_means: >-
      At each size use the same curve/model/root weights to compute mu_hat=Ehat[X],
      m2_hat=Ehat[X^2], kappa_hat=m2_hat/mu_hat, p_hat=Ehat[S], and
      ratio_hat=p_hat/mu_hat. A zero denominator yields inconclusive, never a
      pseudocount.
    slope_formula: >-
      For each eta, subtract eta*(N_b^(-1/3)-16777216^(-1/3)) from log of the
      five positive cell estimates and apply equal-size ordinary least squares
      against x_b=log(N_b/16777216). The resulting slopes are delta_kappa and
      delta_ratio. Whole-curve bootstrap uses the identical statistic.
    treatment_gates:
      kappa: 'UCB_99.5(delta_kappa)<=0.02 under all eta values.'
      ratio: 'LCB_99.5(delta_ratio)>=-0.02 under all eta values.'
      duplicate_multiplicity: >-
        The Y/max(1,X) slope must also have UCB_99.5<=0.02; it cannot replace
        either primary bridge gate.

  proof_search_map:
    bottleneck: >-
      Establish or falsify marginal Boolean gamma_s>5/18 with per-root raw work
      and storage N^(1/3+o(1)). Expected multiplicity, a conditional exposure
      slope, or raw-only gamma_s>1/6 is insufficient.
    baseline_embedding:
      parameter_slice: >-
        Set gamma_s=0 under the balanced antisymmetric null. Then p_N is
        N^(-1/3+o(1)), raw time N^(2/3+o(1)), storage N^(1/3+o(1)), and full
        cost N^(7/9+o(1)), exactly the N^(1/3)-memory BSGS boundary.
      reproduction_check: >-
        A future S0 fixture must run segmented BSGS with the same point encoding,
        fixed-base tables, operation counters, table entry width, equality,
        verification, and Wiener calculator. Both rows must emit exponents
        (2/3,1/3,7/9); constants remain separate.
    observation_collision:
      observable: The full marginal tuple (E[Y],E[X],kappa_N,p_N/E[X],p_N).
      distinct_preimage_search: >-
        CTRL-MATCHED-MEAN-CLUSTERING constructs diffuse and concentrated root
        streams with exactly equal E[X] and E[Y] exponents. The concentrated
        stream has kappa_N=N^(1/3) and p_N lower by N^(-1/3). Thus E[X] and E[Y]
        collide while runtime differs, directly operationalizing the audit.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: Marginal root tuple plus kappa_N and p_N/E[X].
        predicted_gain: >-
          Makes polynomial concentration visible instead of interpreting match
          expectation as restart success.
      - transform: representation_reduction
        proposed_object: >-
          Signed-y selection followed by retained full points, exact equality,
          scalar reconstruction, and independent verification.
        predicted_gain: >-
          If every gate passes and gamma_s>5/18, converts coordinate compatibility
          into a lower conditional full-cost exponent without a free oracle.
      - transform: observable_fiber
        proposed_object: >-
          Hold curve, target, scalar tuples, and ECDLP fixed while changing the
          public isomorphic model or balanced label map.
        predicted_gain: >-
          Separates apparatus, representation-specific behavior, and invariant
          group structure.
    quantifier_order: >-
      EXISTS one public h_y rule and one public curve/model distribution, fixed
      before data, and epsilon>0 SUCH THAT FOR ALL sufficiently large N in that
      distribution, the marginal probability over curve, target, public model,
      and fresh root obeys p_N>=N^(-1/3+5/18+epsilon+o(1)), while HA-1, HA-3,
      HA-4, and HA-6 hold. No curve, model, seed, finite-size correction, or
      gamma may be selected after treatment. The toy ladder cannot establish
      the forall-sufficiently-large-N statement.
    method_ceiling:
      strongest_certifiable_claim: >-
        p_N<=1 forces gamma_s<=1/3. Four length-L lists impose raw-work and live-
        memory floors N^(1/3+o(1)); the Wiener floor is N^(4/9+o(1)). No general
        M-fold information bound is claimed.
      nearby_object_control: >-
        An exact quotient on Z/(M^3)Z realizes order-one Boolean success, while
        a balanced antisymmetric label on an odd prime cyclic group is the
        gamma_s=0 leading null. Both are apparatus controls, not curve evidence.
    proof_obligations:
      - {claim: signed-y antisymmetry and scalar recovery, responsibility: correctness}
      - {claim: selected-pair cap and exact bucket encoding, responsibility: size}
      - {claim: per-root group, field, label, query, and verification work, responsibility: runtime}
      - {claim: live, peak, spill, archive, and communication bytes, responsibility: memory}
      - {claim: marginal distinct-match exponent, responsibility: success_probability}
      - {claim: Paley-Zygmund bridge and clustering gates, responsibility: success_probability}
      - {claim: marginal slope-to-p_N identity, responsibility: interface}
      - {claim: independent restarts and inverse-p_N accounting, responsibility: runtime}
      - {claim: Wiener access charge, responsibility: interface}
      - {claim: strict rho and BSGS crossovers, responsibility: strictness}
      - {claim: preprocessing, model discovery, advice, queries, and multi-target scope, responsibility: scope}
    remaining_unproved_obligations:
      - No structural support exists for positive gamma_s on prime-order curves.
      - HA-3 and family/model transfer remain unmeasured.
      - The 18--30-bit ladder cannot validate a cryptographic-scale exponent.
      - External novelty and generalized-birthday prior art remain unverified.
    not_applicable_reason: null

  predictions:
    - id: P1-balanced-null
      metric: marginal gamma_s and bridge slopes
      direction: different
      minimum_effect: >-
        Gamma interval contains zero; kappa and ratio slopes contain zero; no
        full-cost gate crosses.
    - id: P2-exact-quotient
      metric: marginal gamma_s and verification
      direction: higher
      minimum_effect: >-
        Gamma interval contains 1/3 and every accepted scalar verifies.
    - id: P3-planted-gamma
      metric: repeated-fixture marginal gamma_s
      direction: different
      minimum_effect: >-
        Values 1/6, 5/18, and 3/10 are ordered; 5/18 is an exponent tie.
    - id: P4-matched-mean-clustering
      metric: delta_kappa and delta_ratio
      direction: different
      minimum_effect: >-
        Diffuse slopes are zero; concentrated slopes are +1/3 and -1/3.
    - id: P5-coverage
      metric: 99-percent interval coverage across 512 datasets
      direction: different
      minimum_effect: >-
        Between 500 and 512 intervals cover each planted gamma, with at most
        seven misses on either side.
    - id: P6-treatment
      metric: marginal family gamma_s
      direction: higher
      minimum_effect: >-
        A decision-changing observation requires LCB_99.5(gamma_s)>5/18 under
        every eta plus every bridge, control, cost, and scope gate.

  deterministic_generators:
    integer_convention: >-
      All counters are unsigned integers; concatenated seed fields are UTF-8
      with literal vertical-bar separators. SHAKE256 bytes are interpreted
      big-endian. Rejection sampling accepts the first integer in the largest
      multiple of the target modulus below 2^64 and then reduces modulo the
      modulus. No library-default PRNG is permitted.
    treatment_seed_domain: >-
      IDEA-20260808-9d6677|treatment-v1|bits=<b>|curve=<00..31>|
      model=<0..3>|root=<000..255>|component=<name>.
    synthetic_seed_domain: >-
      IDEA-20260808-9d6677|synthetic-v1|arm=<arm>|bits=<b>|
      dataset=<index>|cluster=<00..31>|root=<index>|component=<name>.
    list_sampling: >-
      A later contract must implement exact uniform sampling without replacement
      by deterministic partial Fisher-Yates with the specified rejection draw;
      exceeding 4L attempted draws for one L-element list invalidates apparatus.

  controls:
    execution_order:
      - CTRL-BASELINE-AND-SEED
      - CTRL-MATCHED-MEAN-CLUSTERING
      - CTRL-REPEATED-COVERAGE
      - CTRL-BALANCED-ANTISYMMETRIC
      - CTRL-EXACT-QUOTIENT
      - CTRL-PLANTED-GAMMA
      - CTRL-ISOMORPHISM-APPARATUS
      - signed_y_treatment
    treatment_admission_rule: >-
      Every control through CTRL-ISOMORPHISM-APPARATUS must complete and pass.
      A failed, missing, capped, or nonconverged control prohibits all treatment.

    balanced_antisymmetric:
      id: CTRL-BALANCED-ANTISYMMETRIC
      construction: >-
        On odd prime Z/NZ put H=(N-1)/2. Derive a in (Z/HZ)^* and c in Z/HZ
        from the arm seed. Define pi(t)=a*t+c mod H. For nonzero r write
        r=epsilon*u with u=min(r,N-r) and epsilon in {+1,-1}; set
        h_null(r)=epsilon*(pi(u-1) mod M) mod M and h_null(0)=0. This is a
        global exact-domain permutation, needs no table or cycle walk, is
        balanced within one count on the positive representatives, and obeys
        h_null(-r)=-h_null(r).
      schedule: 'Five sizes, 32 independent map clusters, 256 roots per cluster.'
      expected_output: >-
        Marginal gamma_s=0, V=X, no positive kappa slope, no ratio decay, and
        work and bucket counts within caps.
      failure_rule: >-
        Any 99-percent interval excluding zero, LCB above 5/18, V!=X, seed
        collision, or cap failure invalidates apparatus.

    exact_quotient:
      id: CTRL-EXACT-QUOTIENT
      construction: >-
        For b in {18,21,24,27,30}, let U_b=2^(b/3), M_b=U_b-1, K_b=M_b^3,
        L_b=M_b, G_b=Z/K_bZ, and h_q(x)=x mod M_b. Sample a uniformly from the
        units. Run the same selector, exact equality, reconstruction, and
        Boolean verification. Histogram arrays are padded with one final zero
        bucket to the fixed U_b archive shape.
      exact_reference: >-
        The conditional exact-match probability is M_b/K_b=1/M_b^2. Realized
        finite p_N is compared with a frozen exhaustive reference when feasible
        and otherwise a separately seeded exact Monte Carlo reference; neither
        is replaced by 1-exp(-1).
      expected_output: >-
        Order-one E[X] and p_N, gamma_s interval containing 1/3, and 100-percent
        integer witness verification.
      failure_rule: >-
        Noncoverage of 1/3, reference-envelope failure, or a failed witness
        invalidates apparatus.

    planted_gamma:
      id: CTRL-PLANTED-GAMMA
      construction: >-
        On each exact-quotient group choose the quotient mode with public
        probability w_b=K_b^(-1/3+gamma_star), for gamma_star in
        {1/6,5/18,3/10}; otherwise choose the balanced-null mode. The mode bit is
        generated before any map call. Only the selected map is evaluated.
        No base-arm labels, bucket arrays, selected pairs, or root outputs are
        reused. Scalar tuples may be paired by seed but are recomputed and
        charged in each arm.
      exact_reference: >-
        p_mix=(1-w_b)*p_null+w_b*p_quot with all finite generator probabilities
        retained. The leading Boolean exponent is -1/3+gamma_star.
      expected_output: >-
        The marginal estimator orders and covers all three gamma values. The
        5/18 arm ties rather than beats rho in full cost.
      failure_rule: >-
        Noncoverage, reversed ordering, wrong tie classification, or a map-call
        count other than one selected map per root invalidates apparatus.

    matched_mean_clustering:
      id: CTRL-MATCHED-MEAN-CLUSTERING
      purpose: >-
        Deterministically falsify any inference path that substitutes E[X] or
        E[Y] for marginal Boolean success.
      scale:
        N_values: [262144, 2097152, 16777216, 134217728, 1073741824]
        order_bits: [18, 21, 24, 27, 30]
        clusters_per_size: 32
        roots_per_cluster: 8192
        roots_per_size: 262144
        delta: 0.3333333333333333
      master_seed: 'IDEA-20260808-9d6677|matched-mean-v1'
      cluster_generator: >-
        For each size rank cluster indices by SHAKE256(master_seed|bits|cluster)
        with index as a tie-break. The first 16 are low clusters with A_c=1024
        active diffuse roots; the other 16 are high clusters with A_c=3072.
        Within each cluster rank root indices by
        SHAKE256(master_seed|arm|bits|cluster|root), again breaking ties by root
        index. This fully determines active positions.
      diffuse_stream: >-
        The first A_c ranked roots have (D,Y,X,V,S)=(1048576,1,1,1,1); all
        others have (1048576,0,0,0,0).
      concentrated_stream: >-
        Put kappa_b=N_b^(1/3)=2^(b/3). The first A_c/kappa_b ranked roots have
        (D,Y,X,V,S)=(1048576,kappa_b,kappa_b,kappa_b,1); all others have zeros
        except D. Divisibility is exact for every A_c and kappa_b.
      exact_expected_counts:
        common:
          total_roots_per_size: 262144
          sum_X_per_size: 65536
          sum_Y_per_size: 65536
          E_X: 0.25
          E_Y: 0.25
          gamma_x: 0.3333333333333333
        diffuse:
          active_roots_by_bits: {18: 65536, 21: 65536, 24: 65536, 27: 65536, 30: 65536}
          sum_X_squared_by_bits: {18: 65536, 21: 65536, 24: 65536, 27: 65536, 30: 65536}
          kappa_by_bits: {18: 1, 21: 1, 24: 1, 27: 1, 30: 1}
          p_by_bits: {18: 0.25, 21: 0.25, 24: 0.25, 27: 0.25, 30: 0.25}
          gamma_s: 0.3333333333333333
        concentrated:
          active_roots_by_bits: {18: 1024, 21: 512, 24: 256, 27: 128, 30: 64}
          sum_X_squared_by_bits: {18: 4194304, 21: 8388608, 24: 16777216, 27: 33554432, 30: 67108864}
          kappa_by_bits: {18: 64, 21: 128, 24: 256, 27: 512, 30: 1024}
          p_by_bits: {18: 0.00390625, 21: 0.001953125, 24: 0.0009765625, 27: 0.00048828125, 30: 0.000244140625}
          gamma_s: 0.0
      exact_relations: >-
        Both streams have equal E[X] and E[Y] exponents. Concentrated
        kappa_N=N^(1/3), p_concentrated=p_diffuse*N^(-1/3), and
        p_concentrated/E[X]=N^(-1/3).
      observables:
        - mu_hat, Ehat[Y], Ehat[X^2], kappa_hat, p_hat, and p_hat/mu_hat
        - delta_kappa, delta_ratio, gamma_x, and marginal gamma_s
        - all 8191 cluster-bootstrap statistics under every eta
      tolerances_and_gates:
        exact_integer_totals: zero mismatch permitted
        diffuse_slopes: '|delta_kappa|<=1e-8 and |delta_ratio|<=1e-8 at eta=0.'
        concentrated_kappa: 'LCB_99.5(delta_kappa)>0.3133333333333333 under every eta.'
        concentrated_ratio: 'UCB_99.5(delta_ratio)<-0.3133333333333333 under every eta.'
        gamma_gap: >-
          Diffuse minus concentrated marginal gamma point estimate is within
          1e-8 of 1/3 at eta=0 and its 99-percent interval excludes zero.
      power_statement: >-
        Every cluster separately satisfies sum X^2=kappa_b*sum X and
        sum S=sum X/kappa_b. Therefore every possible size-stratified cluster
        resample preserves slopes +1/3 and -1/3 exactly at eta=0 and preserves
        a margin above the +/-0.313333 gates under eta in {-4,0,4}. Algebraic
        detection probability under the frozen resampling law is 1 for both
        gates; this is prospective design power, not an observed run result.
      failure_rule: >-
        Any total mismatch, missed slope, noncoverage, wrong Boolean gamma, or
        treatment of the two streams as equal runtime invalidates the estimator
        before any selector or curve is built.

    repeated_coverage:
      id: CTRL-REPEATED-COVERAGE
      nominal_target: 0.99
      complete_datasets_per_gamma: 512
      gamma_values: [0.0, 0.2777777777777778, 0.3, 0.3333333333333333]
      total_complete_datasets: 2048
      schedule_per_dataset: >-
        Five sizes, 32 curve clusters, 256 root positions, and four repeated
        models. A single stored root bit is referenced by all four models so
        the fixture tests that repeated models are not resampled as curves.
      generator: >-
        For N_b=2^b and planted gamma, set p_b=0.2*(N_b/2^24)^(gamma-1/3).
        Rank clusters by the exact seed domain and assign 16 z=-1 and 16 z=+1.
        Set p_b,c=p_b*(1+0.2*z), encode T_b,c=floor(2^128*p_b,c), derive a
        uniform uint128 U from SHAKE256, and set S=X=Y=V=1[U<T_b,c],
        D=1048576. The four models reference the same bit. The exact finite
        marginal probability is q_b=(T_b,low+T_b,high)/(2*2^128), all nominal
        probabilities lie in [0.04,0.96], and quantization error is below 2^-128.
      seeds: >-
        Dataset r uses
        IDEA-20260808-9d6677|coverage-v1|gamma=<exact-decimal>|dataset=<000..511>
        and the synthetic seed convention above. Dataset seeds are disjoint
        from bootstrap seeds. For coverage, the exact planted gamma_ref is the
        constrained mean-model fit to the five rational q_b values and must be
        within 2^-100 of the nominal label; intervals are tested against
        gamma_ref, never the rounded label.
      statistic_and_interval: >-
        Each complete dataset is processed by the unchanged marginal estimator
        and 8191-draw whole-curve bootstrap. Pointwise reuse, analytic intervals,
        and post-hoc estimator substitution are forbidden.
      acceptance_test: >-
        For each planted gamma separately, let C be the number of two-sided
        99-percent intervals covering the plant. Under Binomial(512,0.99), the
        precomputed central 99-percent acceptance set is 500<=C<=512 because
        Pr(C<=499)=0.002329740788839534. Also require at most seven lower-side
        misses and at most seven upper-side misses; seven is the 0.995 quantile
        of Binomial(512,0.005). All four gamma cells must pass.
      stopping_rule: >-
        Do not stop for favorable coverage. Fail early only when
        covered_so_far+remaining<500, lower_misses>7, or upper_misses>7, because
        acceptance is then mathematically impossible. Preserve every generated
        bitset and partial result. Failure is apparatus invalidity.

    isomorphism_apparatus:
      id: CTRL-ISOMORPHISM-APPARATUS
      timing: hard_pre_treatment_gate
      model_generation: >-
        For each accepted E:y^2=x^3+A*x+B, derive three nonzero u values by
        rejection from the public seed. Require the tuples (u^4,u^6) to be
        pairwise distinct and different from (1,1). Define
        E_u:y^2=x^3+(A*u^4)x+B*u^6 and phi_u(x,y)=(u^2*x,u^3*y), phi_u(O)=O.
      fixtures_per_curve: 8
      fixture_generator: >-
        For each fixture derive distinct r1..r4 and nonzero a; let known target
        Q=[k]P and set b=r1+r2+r3+r4-a*k mod N. Independently compute
        R_j=[r_j]P, A0=R1+R2, B0=R3+R4, and Q'=[a]Q+[b]P.
      mandatory_checks:
        on_curve: >-
          P,Q,R1..R4,A0,B0,Q' and every forward image satisfy their exact curve
          equations; O uses its unique tagged encoding.
        homomorphism: >-
          phi(R1)+phi(R2)=phi(A0), phi(R3)+phi(R4)=phi(B0), and
          phi(A0)+phi(B0)=phi(Q') for all fixtures and models.
        inverse_map: >-
          Applying (u^-2*x,u^-3*y) to every forward image returns identical
          canonical bytes.
        equality: >-
          A0+B0=Q' iff the transformed equality holds; seeded unequal pairs
          remain unequal in both directions.
        scalar_recovery: >-
          k_hat=a^(-1)*(sum r_j-b) mod N equals k and both [k_hat]P=Q and
          phi([k_hat]P)=phi(Q) hold byte-for-byte.
      pass_rule: >-
        Every check passes for 160 curves, three distinct noncanonical models,
        and eight fixtures. One failure, missing row, infinity ambiguity, or
        transform cap breach prohibits all treatment. Isomorphism heterogeneity
        is measured later and is not part of this apparatus pass.

    treatment_model_heterogeneity:
      id: CTRL-ISOMORPHIC-MODEL-HETEROGENEITY
      timing: treatment_coupled_scope_diagnostic_only
      construction: >-
        Share curve, target, scalar tuples, lists, and roots across canonical and
        three pre-gated models; transform points by phi_u and recompute only the
        representation-dependent labels and joins. No model is selected.
      interpretation: >-
        Scalar recovery must remain identical. Gamma heterogeneity narrows scope
        and prices discovery; it is not apparatus failure and cannot rescue a
        failed primary family or canonical gate.

  apparatus_vs_mechanism_rules:
    apparatus_invalid:
      - Any pre-treatment control fails its exact gate or coverage test.
      - Any on-curve, inverse, homomorphism, equality, or scalar fixture fails.
      - Any V!=X, accepted scalar failure, seed collision, or estimator substitution occurs.
      - Any operation, live-memory, spill, archive, communication, or wall cap is crossed.
    mechanism_falsified_or_narrowed:
      - >-
        Valid treatment UCB_99.5(gamma_s)<=5/18 falsifies only the fully charged
        crossover on the declared toy family and schedule.
      - >-
        Failed kappa or ratio gates falsify the runtime bridge, even with
        positive Y or X enrichment.
      - >-
        Isomorphism heterogeneity makes the mechanism representation-specific
        and activates model-discovery accounting.
    inconclusive:
      - Any interval straddles 5/18 or eta sensitivities disagree.
      - Any bridge precision gate, coverage gate, or model fit lacks power or convergence.
      - Any timeout, resource exhaustion, implementation failure, or incomplete stage occurs.

  statistical_plan:
    preregistered_ladder:
      subgroup_order_bits: [18, 21, 24, 27, 30]
      list_and_bucket_upper_bounds: [64, 128, 256, 512, 1024]
      independent_curves_per_size: 32
      models_per_curve: 4
      models: [canonical, isomorphism_1, isomorphism_2, isomorphism_3]
      roots_per_curve_model: 256
      total_unique_curve_roots: 40960
      total_treatment_root_model_rows: 163840
      root_pairing: >-
        All four models share a curve's 256 root scalar tuples. Power counts one
        model per curve conservatively.
    pooling_rules:
      - Curves have equal outer weight; models and roots have equal nested weight.
      - Isomorphic models never count as independent curves.
      - Sizes enter only the single frozen slope model and stratified bootstrap.
      - Treatment, null, quotient, planted, clustering, and coverage arms never pool.
      - Canonical and heterogeneity statistics cannot replace the primary family gate.
    zero_count_rules:
      - No 0.5, add-one, or other pseudocount is permitted.
      - D=0 roots remain S=0 and stay in selector diagnostics.
      - A zero p, mu, or kappa denominator makes its slope cell inconclusive.
      - Separation or failed active-set convergence is inconclusive; no estimator substitution.
    multiple_testing: >-
      The only decision-changing statistic is the preregistered primary family
      LCB_99.5(gamma_s)>5/18 under all eta values. Other statistics are mandatory
      falsification and scope gates, not alternate promotion paths.
    primary_power_calculation:
      alternative_gamma: 0.3
      null_boundary_gamma: 0.2777777777777778
      effect_gap: 0.0222222222222222
      alpha_one_sided: 0.005
      assumed_success_probability_range: [0.3, 0.7]
      assumed_max_curve_design_effect: 2.0
      size_spread_sum_squared_logN: 43.240771252638126
      conservative_information: 74387.96360133842
      conservative_standard_error_gamma: 0.005185177918497309
      noncentral_z: 4.285720291862678
      approximate_power: 0.9563569834104666
      derivation: >-
        Using one model per curve gives I=32*256*0.21*
        sum_b[(b-24)ln2]^2=74387.9636. Design effect two gives
        SE=sqrt(2/I)=0.00518518. The 1/45 gap gives z=4.28572 and approximate
        one-sided power 0.95636 after z_0.995=2.57583.
      admission_precision_rule: >-
        Repeated coverage must pass and the empirical control bootstrap SE may
        not exceed 0.005185177918497309; otherwise the treatment schedule is
        underpowered and never begins.
    bridge_gate_power:
      planted_delta: 0.3333333333333333
      null_tolerance: 0.02
      exact_resampling_power: 1.0
      minimum_detection_margin: 0.3133333333333333
      treatment_precision_rule: >-
        Before treatment, both bridge-slope bootstrap half-widths on every
        stochastic coverage cell must be <=0.02. The deterministic plant must
        pass its +/-0.313333 gates in every one of 8191 resamples. These are
        precision and positive-control requirements, not evidence that the
        signed-y treatment has subpolynomial clustering.
    limitations: >-
      All power is prospective and conditional on the frozen mean model,
      control coverage, effect range, and convergence. No arbitrarily small
      epsilon above 5/18 is powered.

