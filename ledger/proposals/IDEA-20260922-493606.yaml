  interpretation_limits:
    - Proposal only; no experiment, run, approval or result exists here.
    - >-
      CHAINED DEPENDENCY: this record's central claim inherits
      IDEA-20260922-7ab503's own claim tier and every one of its
      interpretation limits, most importantly the unresolved normal-basis
      constructibility question at the specific field degree used here.
    - >-
      Explicitly NOT a competitiveness claim (E): even a fully confirmed m=4
