  target_complexity:
    time_exponent: >-
      Unchanged; this is an affordability/measurability claim, not an
      algorithmic improvement. The per-target decomposition exponent at
      m=4 remains (m-1)l=3l on the enumeration oracle or ml-log2(m!mu) on
      the constrained CNF-XOR oracle -- a CONSTANT shift (log2(mu)~5.2 bits
      at n=37) on top of an unchanged exponent in l.
    memory_exponent: >-
      Unchanged; poly(l,n) for the CNF-XOR arm, matching
      IDEA-20260904-3c7a91's own accounting. Memory growth from clause
      learning at m=4 is flagged as a confounder, not assumed away.
    best_known: >-
      Matched rho with negation and Frobenius classes; within the
      decomposition family, IDEA-20260904-96c4f3's four-row frontier and its
      own forward condition (E), reused verbatim here to bound what this
      record can and cannot claim.
    hidden_overhead: >-
      The normal-basis construction cost (charged to IDEA-20260922-7ab503's
      estimated_cost, not duplicated here); nothing superpolynomial hides in
      any o(1), since this record's claims are all explicit constants and
      exponents with no o(1) terms.
    tradeoff_note: >-
      No new tradeoff; this record's leaf-count arithmetic sits entirely
      inside the poly-memory column of IDEA-20260904-96c4f3's frontier
      table, applied at a previously-unmeasured arity.
  estimated_cost:
    implementation: medium
    compute: medium
    qualification: >-
      Stage 0 is pure arithmetic (done). Stages 1-2 reuse
      IDEA-20260922-7ab503's own infrastructure entirely (no new
