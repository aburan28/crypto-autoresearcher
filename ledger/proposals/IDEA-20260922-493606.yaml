  heuristic_assumptions:
    - id: H1
      statement: >-
        LAW EXTRAPOLATION TO m=4. IDEA-20260904-3c7a91's leaf-count law,
        validated at m in {3,4}, l<=9 by that record's own design (its
        Stage 3 is explicitly an m=4 out-of-sample cell), continues to hold
        within its stated 5% band at l=8 specifically, on both Koblitz-
        shaped and pseudorandom-shaped curves.
      rigorous_support: >-
        RIGOROUS INGREDIENT: none beyond what 3c7a91 itself supplies (its
        own upper bound from Proposition 1 is exact and m-independent in
        form). CLASSICAL DISTRIBUTION IMITATED: none new; this heuristic is
        purely an extrapolation of an already-heuristic law (3c7a91's own
        H1) to a cell that record's design anticipated but had not, at the
        time this record was written, reported as measured.
      validation_plan: >-
        SAMPLE: the Stage-3 leaf counts themselves, both arms, >=3 seeds if
        budget allows more than one run per arm. SHORTCUT: none beyond what
        3c7a91 already proposes (propagation-only sampling at depth d
        without a full search), reused here rather than re-derived.
        COMPARISON: measured leaf count against the closed-form prediction
        within the stated tolerance bands. TAIL CHECKS: if only one seed
        completes within budget, that single value is reported as such,
        explicitly not averaged with anything. TRANSFER: none beyond n=37,
        l=8, m=4 and n=29, l=6, m=5; no claim about any other cell.
    - id: H2
      statement: >-
        MU-REALIZATION AT m=4. IDEA-20260922-7ab503's H1 (normal-basis
        realization of the mu-fold leaf reduction), validated there at
        m in {2,3}, continues to hold at m=4 within the same tolerance band.
      rigorous_support: >-
        Identical rigorous ingredient to 7ab503's own H1 (the exact
        endomorphism-commutation identity); the assumed half is whether the
        SEARCH realizes the exact quotient as cleanly at m=4 as at m<=3,
        which is untested by that record and is this record's single
        largest risk, named as such rather than assumed silently.
      validation_plan: >-
        Identical to 7ab503's own H2 validation plan, extended to m=4; this
        record does not propose a separate validation route and instead
        treats 7ab503's own Stage-2/3 result at m=4 (if run) as the
        validation for this heuristic, avoiding duplicated instrumentation.
  heuristic_note: >-
    Both heuristics are EXTRAPOLATIONS of already-heuristic laws this
    session's own prior record and an earlier session's record establish at
    smaller m; neither is independently supported here. The record's
    a-priori expectation is stated plainly: if either extrapolation fails,
    the specific numeric predictions in (B) and (D) are wrong by an unknown
