      attempting m=4 here; this record's central prediction is not
      attempted until that prerequisite passes.
      STAGE 2 -- THE ANCHOR REPRODUCTION. Re-run or cite an m=3, l=8 cell
      (Koblitz-shaped or generic, either is admissible for the anchor) and
      confirm its leaf count against 2,796,203 within 5%.
      STAGE 3 -- THE m=4 CELL. Build the Koblitz-shaped (a,b in F_2, n=37)
      and matched pseudorandom-shaped (mu=1, same n, l) toy curves; encode
      the descended CNF-XOR system at m=4, l=8 with and without the
      mu-orbit constraint of IDEA-20260922-7ab503, in a constructed normal
      basis; run both to completion or to a STATED, PRE-COMMITTED budget cap
      (e.g. 20x the Stage-2 anchor's leaf count or wall clock, whichever is
      hit first). Record termination_reason honestly; a cap-hit is
      censored, never a negative result.
      STAGE 4 -- THE m=5 CELL, IF BUDGET ALLOWS. n=29, l=6, same
      construction, same cap discipline.
      STAGE 5 -- DEPLOYED-ROW NOTE, ZERO COMPUTE. State explicitly, per (E),
      that even a completed m=4 or m=5 cell here does not move the forward
      condition needed to beat rho, and record the RQ-ICEX-001 gap this
      closes (one curve-shape-indexed cell, not the crossover question).
    controls:
      - MATCHED PSEUDORANDOM-SHAPED NULL (mu=1) -- the primary control; must not complete within the same budget.
      - ANCHOR REPRODUCTION (Stage 2) -- invalidates the whole comparison if it fails.
      - CERTIFICATE VERIFICATION -- every SAT answer independently re-checked.
      - PRE-COMMITTED BUDGET CAP -- stated before Stage 3 runs, never adjusted after seeing partial results.
      - >-
        DEPENDENCY GATE -- Stage 3 does not run until IDEA-20260922-7ab503's
        own Stage 2-3 has reported its result, so this record's outcome is
        never read independently of its prerequisite's status.
    required_metrics:
      - leaf_count per arm (constrained/unconstrained x Koblitz-shaped/pseudorandom-shaped)
      - wall_clock_seconds and peak_rss_mb, pinned solver version/commit/hardware/seed
      - termination_reason (completed | timeout | memory_abort | crash)
      - certificate_verified_rate
      - budget_cap_stated and whether it was hit
  falsification_conditions:
    - >-
      IDEA-20260922-7ab503's H1 fails to re-confirm at m=4 (Stage 1
      prerequisite). This record's central prediction is withdrawn pending
      that record's own repair; the arithmetic in (B) stands as derivation
      only, not as a tested claim.
    - >-
      The Koblitz-shaped m=4,l=8,n=37 cell does NOT complete within the
      stated budget cap while the anchor (Stage 2) reproduces correctly.
      The affordability claim is false at this cell; reported as a measured
      negative with the actual leaf count or termination reason at cap.
    - >-
      The pseudorandom-shaped null DOES complete within the same budget the
      Koblitz-shaped arm needed. The claimed differential is an artefact,
      not a curve-shape effect; the record's central claim is withdrawn.
    - >-
      Any certificate fails independent re-verification. Soundness issue;
      no cost conclusion may be drawn until fixed.
    - >-
      The m=5 secondary prediction (D) is off by more than a factor 10 from
      308,547 with a passing counter. The arithmetic chain has an error
      beyond the stated tolerance and is corrected before re-use.
  confounders:
    - >-
      MEMORY, NOT TIME, may be the actual bottleneck at m=4,l=8 (the
      program's own GOAL-DREG-001 history records a memory-bound death at
      a comparable scale in a different but related pipeline); a
      memory_abort at the m=4 cell is an infrastructure outcome, not
      evidence against the leaf-count prediction, and is reported as such.
    - >-
      The normal-basis construction itself (IDEA-20260922-7ab503's own
      open verification of Gaussian-normal-basis existence at n=37) may
      not be affordable or may not exist at low "type"; if so, this
      record's m=4 cell cannot be attempted in normal basis at all, and
      that gap is reported rather than silently substituting the
      polynomial basis (which per 7ab503's own prediction would NOT realize
      mu and would make this record's central comparison moot).
    - >-
