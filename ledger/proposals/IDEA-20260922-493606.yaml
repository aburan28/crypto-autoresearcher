idea:
  id: IDEA-20260922-493606
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    A CHEAP m=4 CELL THAT ONLY A KOBLITZ-SHAPED STANDARDIZED CURVE MAKES
    REACHABLE: closing the "zero measured m>=4 cells" gap
    (IDEA-20260807-32f96d) specifically at n=37 by pre-computed arithmetic
    showing the Frobenius-stabilizer symmetry of IDEA-20260922-7ab503 brings
    an m=4,l=8 leaf count from 1.79e8 down to the SAME order of magnitude as
    this program's already-executed m=3,l=8 cells (~2.8e6 per
    IDEA-20260904-b40e6d's own stage-cost estimate), while the matched
    pseudorandom-shaped null stays at 1.79e8 -- the standardized curve's own
    structure, not a generic algorithmic improvement, is predicted to decide
    which arity is affordable.
  class: measurement
  claim: >-
    SCOPE: toy Koblitz-shaped (a,b in F_2) and pseudorandom-shaped (mu=1,
    matched null) binary curves at n=37 (prime, admissible per
    m(l-1)<=n at m=4,l=8: 4*7=28<=37), CNF-XOR descended pdp model, m in
    {3,4}, l=8. CLAIM TIER toy. NO ATTACK, NO EXPONENT IMPROVEMENT.

    (A) THE GAP THIS RECORD CLOSES A PIECE OF. IDEA-20260807-32f96d
    establishes, for RQ-ICEX-001, that m>=4 has ZERO measured cost cells
    anywhere in this program's corpus, and that the obstruction supposed to
    kill large m (Semaev-degree growth) is asserted, not measured. That
    record's own instrument (EV-R6-001) is prime-field and censored at m=4
    for a DIFFERENT reason -- Gröbner-basis memory. This record works the
    BINARY, CNF-XOR side of the same gap and asks a population-indexed
    question RQ-ICEX-001 does not: is there a curve SHAPE among the
    standardized population for which m=4 is cheap enough to complete on
    THIS lane's own already-executed compute budget, while a generic-shaped
    curve's m=4 is not?

    (B) THE ARITHMETIC, DERIVED FROM TWO RECORDS THIS PROGRAM ALREADY OWNS,
    ZERO COMPUTE. IDEA-20260904-3c7a91's law: N_conf(l,m,|G|) =
    (1+-eps)2^{ml}/|G|, eps<=0.05, for a complete core-restricted DPLL/CDCL
    search, validated at m in {3,4}, l<=9. IDEA-20260922-7ab503's extension:
    on a curve where the Frobenius-stabilizer order is mu (mu=n for a
    Koblitz-shaped curve of prime field degree n, since a,b in F_2 are fixed
    by every power of Frobenius; mu=1 for a curve with no such fixed pair,
    the pseudorandom-shaped null), |G| = m! * mu when the mu-orbit
    constraint of that record is added on top of WDSat's existing m!
    symmetry breaking, REALIZED ONLY IN A NORMAL BASIS per that record's own
    prediction (D). At l=8:
      m=3: 2^{24}=16,777,216 leaves; /6 = 2,796,203 (matches
        IDEA-20260904-b40e6d's own Stage-2 cost estimate of "~2.8e6 leaves
        per instance" at l=8, m=3, cited there as the design's l=8 UNSAT
        arm -- i.e. this is a cell this lane has ALREADY BUDGETED FOR).
      m=4, mu=1 (pseudorandom-shaped, |G|=24): 2^{32}=4,294,967,296;
        /24 = 178,956,971 -- about 64x the m=3,l=8 cell, and the reason
        IDEA-20260807-32f96d's gap has stayed unmeasured: nobody has run an
        m=4 cell 64x more expensive than the largest cell this lane has
        executed.
      m=4, mu=n=37 (Koblitz-shaped, |G|=24*37=888): 178,956,971/37 =
        4,836,675 -- WITHIN A FACTOR OF 1.73 of the m=3,l=8 cell's own leaf
        count, i.e. the SAME order of magnitude as compute this lane has
        already spent.
    THE PREDICTION: an m=4, l=8, n=37 Koblitz-shaped instance, WITH the
    mu-orbit constraint correctly encoded in a normal basis, completes
    within a small constant multiple of the wall-clock budget this lane's
    own m=3, l=8 cells already used (per IDEA-20260904-b40e6d's design),
    while the MATCHED pseudorandom-shaped null at the identical (m,l,n) does
    not complete within that same budget -- reproducing, on a SPECIFIC,
    curve-shape-indexed cell, exactly the kind of censored-timeout outcome
    IDEA-20260807-32f96d already reports generically for m=4 elsewhere.

    (C) WHAT THIS DOES AND DOES NOT SHOW. If confirmed, this is NOT a
    generic resolution of RQ-ICEX-001's arity question (which is about
    whether the crossover between decomposition-probability gain and
    per-target cost growth ever favours large m against rho, prime-field
    included): it is a narrower, population-indexed statement that
    STANDARDIZED CURVE SHAPE, not solver engineering, decides whether m=4 is
    AFFORDABLE TO MEASURE AT ALL on this lane's own compute budget -- and
    even affordable, per (E) below, m=4 remains far short of the
    forward condition needed to beat rho. The record's contribution is
    closing one cell of the reachability table's OPEN/DEFINED-WITH-A-
    COMPUTED-COST distinction, not the crossover question itself.

    (D) THE SECOND, WEAKER PREDICTION -- m=5. At l=6 (smaller, since l=8 is
    already near the edge of affordability at m=5): m=5, mu=1:
    2^{30}=1,073,741,824; /120=8,947,849. m=5, mu=n=23 (a smaller Koblitz-
    shaped prime, chosen so m(l-1)=5*5=25<=23 FAILS -- so l=6 at n=23 is
    OUT OF the admissible range m(l-1)<=n IDEA-20260904-96c4f3's own
    assumptions require; the correctly admissible pair is n=29, l=6,
    m(l-1)=25<=29): 8,947,849/29=308,547 -- comfortably BELOW the m=3,l=8
    cell's own 2,796,203, i.e. a Koblitz-shaped m=5 cell at l=6 is CHEAPER,
    on this arithmetic, than an already-executed m=3,l=8 cell. This is the
    single most aggressive, most falsifiable number in this record and is
    named as such.

    (E) THE FORWARD-CONDITION CHECK, SO THE RECORD DOES NOT OVERCLAIM. Per
    IDEA-20260904-96c4f3(E), tying rho at m=4 needs a pdp oracle at
    exponent c=1-m/(2(m-1))=1/3 of the naive |B|^{m-1}, i.e. a gap of
    (m-1)(1-c)=3*(2/3)=2 in the exponent of l -- WORSE (a bigger required
    improvement) than m=3's gap of 1.5. The mu-fold gain computed in (B) is
    a CONSTANT (log2(mu)=log2(37)~5.2 bits at n=37), not a change to the
    exponent c; it moves which cells are AFFORDABLE TO MEASURE, not which
    arities can beat rho. This record explicitly does NOT claim m=4 or m=5
    becomes competitive with rho -- only that it becomes MEASURABLE on
    Koblitz-shaped curves where it was not on this lane's budget before.
  mechanism: >-
    OBJECT FRAME. Representation: unchanged from IDEA-20260922-7ab503 (the
    x-coordinate in a fixed F_2-basis, normal basis required to realize the
    predicted mu constant). Operation set Sigma: identical to that record's
    -- factor-base translation UNION the Frobenius-stabilizer group of order
    mu. Trichotomy: PARTIAL-ACTION (Class I), inherited without re-
    derivation from IDEA-20260922-7ab503, which this record CITES for the
    mechanism and does NOT re-derive; this record's own content is the
    ARITHMETIC CONSEQUENCE of that mechanism for the EXECUTABLE-ARITY-
    CEILING observable, a quantity neither IDEA-20260922-7ab503 nor
    IDEA-20260807-32f96d computes.
    WHY THIS IS A DISTINCT RECORD FROM IDEA-20260922-7ab503 AND NOT A
    RESTATEMENT. That record's deliverable is the STABILIZER CENSUS and the
    BASIS-DEPENDENT ENCODABILITY of the mu-orbit constraint, tested at small
    m,l where BOTH the constrained and unconstrained arms can be run to
    completion and their certificate sets compared. This record's
    deliverable is a DIFFERENT observable -- the LARGEST ARITY m THAT
    COMPLETES AT ALL within a stated, fixed compute budget -- computed here
    purely arithmetically from that record's own predicted law (D) BEFORE
    any run, and it is EXPLICITLY CONDITIONAL: if IDEA-20260922-7ab503's
    Stage-2/3 measurement falsifies the mu-realization prediction (H1
    there), this record's central m=4 affordability prediction falls with
    it, and this record says so as a chained falsification condition rather
    than treating the mechanism as independently established.
    WHY THIS IS NOT IDEA-20260807-32f96d. That record is PRIME-FIELD and
    measures the crossover exponent gamma(m) against a Gröbner-degree
    obstruction; it names the corpus-wide absence of m>=4 measurement as its
    finding and proposes measuring m=3,4,5 GENERICALLY. This record is
    BINARY-field, CNF-XOR-specific, and answers a narrower, curve-shape-
    indexed question that 32f96d's own framing does not ask: not "what is
    the crossover exponent" but "which standardized curve SHAPE makes an
    m=4 cell affordable to measure on THIS lane's existing compute budget at
    all", closing one specific reachability-table cell rather than the
    arity question in general.
    LOSSY-PROJECTION TEST. No new tracked object is proposed here; the
    object (the Frobenius-orbit representative) is IDEA-20260922-7ab503's,
    imported and cited. This record's contribution is a pure ARITHMETIC
    COROLLARY (an affordability threshold), stated as such rather than
    forced through the trichotomy machinery a second time.
