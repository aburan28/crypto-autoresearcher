  minimal_test:
    design: >-
      STAGE 0 -- ZERO COMPUTE. Commit the affordability table of (B) and
      (D) exactly as computed above, and the forward-condition disclaimer
      (E), before any run. This stage alone is the record's cheapest,
      lowest-risk deliverable.
      STAGE 1 -- PREREQUISITE. Confirm IDEA-20260922-7ab503's Stage 2-3
