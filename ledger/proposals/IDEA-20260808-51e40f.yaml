  proof_search_map:
    bottleneck: The determined inner solve inside every hybrid attack in the slice. Its exponent
      is the only place a new algorithm can change a claimed security level without touching
      the scheme.
    baseline_embedding:
      parameter_slice: q = 2 (e = 1), where the descent is the identity. The cost formula
        must then reduce exactly to the undescended one, and the table must reproduce MQOM's
        own GF(2) row when the polynomial method is removed from the minimum.
      reproduction_check: 'Frozen fixture: recompute one published row from the specification''s
        own formula and require exact integer agreement before the new row is admitted to
        the minimum.'
    observation_collision:
      observable: The binding row of a minimum-over-algorithms cost table.
      distinct_preimage_search: 'COLLISION EXISTS AND IS STATED: two schemes with identical
        (q, N, M) have identical binding rows regardless of their real security, because the
        table sees only the shape. The observable therefore certifies COST-MODEL COMPLETENESS
        and never security. No additional condition is proposed to separate them, because
        none is needed for the claim actually being made.'
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Weil descent, moving the hypothesis "this determined system is hard"
        from F_{2^e} to GF(2), where an unconditional worst-case exponent is available.
      predicted_gain: Replaces a genericity-conditional Groebner exponent with an unconditional
        one at the price of an e-fold size increase; nets a gain exactly when c*e < 2*omega.
    quantifier_order: FORALL parameter sets with q a power of 2, FORALL determined subsystems
      arising in the published attack, THERE EXISTS a cost model column (omega=2 or omega=2.81)
      under which the descended polynomial-method cost is below the published row. The omega
      is allowed to depend on the parameter set, which is exactly why both columns are mandatory
      and why the q=256 verdict is reported as omega-dependent rather than as a win.
    method_ceiling:
      strongest_certifiable_claim: '"The minimum in this specification was taken over a strictly
        smaller algorithm set than the literature offers, and the missing row costs X bits
        of time at these parameters, with memory unresolved."'
      nearby_object_control: QR-UOV at odd q, where descent is impossible and the method must
        certify nothing. A pipeline that produces a gain there is not tracking the field and
        its other rows are void.
    proof_obligations:
    - claim: Weil descent preserves degree 2 and multiplies size by e.
      responsibility: correctness
    - claim: The polynomial-method exponent applies at m = n.
      responsibility: feasibility
    - claim: The crossover is c*e < 2*omega.
      responsibility: baseline
    - claim: The optimal hybrid split is j = 0 under the new inner solver.
      responsibility: runtime
    - claim: Memory is charged for every row, and reported UNRESOLVED where unread.
      responsibility: memory
    - claim: No scheme is claimed broken and no number is asserted from the unread paper.
      responsibility: scope
    not_applicable_reason: null
