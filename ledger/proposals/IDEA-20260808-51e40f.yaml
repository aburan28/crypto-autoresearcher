idea:
  id: IDEA-20260808-51e40f
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MQOM-001
  goal_id: GOAL-MQOM-001
  title: Weil-descend the characteristic-2 members of the family to GF(2) and price their
    determined solves with the polynomial method instead of Groebner -- the crossover condition
    is c*log2(q) < 2*omega, which binds for q in {2,4,8,16,32} at omega=2 and is inapplicable
    at odd q, so the correction reaches MQOM's GF(2) rows, MAYO and SNOVA and provably not
    QR-UOV
  class: algorithm
  claim: 'Every algebraic attack in this slice terminates in a DETERMINED quadratic solve.
    For q = 2^e the Frobenius is F_2-linear, so Weil descent carries N quadratics in N variables
    over F_{2^e} to e*N quadratics in e*N variables over GF(2) with NO degree growth -- quadratic
    stays quadratic, because each F_{2^e}-coefficient contributes F_2-bilinear components.
    CLAIM, in four parts. (1) SUBSTITUTION. The inner solve may be performed by the polynomial-method
    family (parity-counting self-reduction; KN-LIT-3290, contents recalled_unverified) at
    cost 2^{c*e*N} bit operations, against the corpus''s own recorded hybrid-family figures
    for GF(2) at m=n (KN-TECH-053: 2^{0.841 n} deterministic, 2^{0.792 n} Las Vegas for BooleanSolve).
    (2) CROSSOVER, derived here. Modelling the semi-regular Groebner cost at m=n as binom(2N,N)^omega
    ~ 2^{2*omega*N} bit operations and exhaustive search as q^N = 2^{e*N}, descent-plus-polynomial-method
    beats Groebner exactly when c*e < 2*omega. At omega=2 that is e < 2/c; at omega=2.81 it
    is e < 2.81/c. With the RECALLED c = 0.6943 the thresholds are e < 5.76 and e < 8.09 respectively,
    so the row binds for q in {2,4,8,16,32} at omega=2 and MARGINALLY also for q=256 at omega=2.81
    -- the verdict at UOV''s q=256 is omega-dependent and both columns must be reported. (3)
    SCOPE. It is inapplicable at odd q, so QR-UOV (RECALLED q = 127 or 31) gets no delta at
    all, and the negative half of the claim is as sharp as the positive half. (4) HYBRID DEGENERACY,
    derived here. With the polynomial method as inner solver the hybrid cost is 2^{e*j} *
    2^{c*e*(N-j)} = 2^{c*e*N + e*j*(1-c)}, strictly increasing in j because c < 1, so the
    optimal number of guessed variables is ZERO -- guessing is never worth it once the inner
    solver already beats brute force per variable.'
  mechanism: 'The polynomial method''s exponent is unconditional and worst-case: it does not
    need semi-regularity, which is exactly the assumption every published estimate in this
    family leans on. The reason it has never been applied here is a units mismatch -- the
    family quotes costs in F_q operations at F_q parameters, while the polynomial method''s
    exponent is stated in GF(2) variables. Weil descent is the missing conversion and it is
    free in characteristic 2. Nothing about the schemes'' structure is used or needed; the
    substitution is at the level of the solver.'
  why_not_a_renamed_known_approach: 'Nearest known method: the hybrid approach (guess k variables,
    run F4/F5) and BooleanSolve/Crossbred, all recorded in KN-TECH-053. Those are search-versus-linear-algebra
    tradeoffs whose exponent is a tuned split; the polynomial method''s exponent comes from
    a parity-counting self-reduction and is not a split, which is why part (4) above shows
    the split collapsing to zero. Nearest internal record: IDEA-20260805-be7738 reproduces
    MQOM''s own MQ table and observes that the binding row is a minimum over algorithms whose
    memory is printed but never charged; that record takes the algorithm set as given. This
    record adds a row to the minimum and states, with a derived inequality, exactly where
    the new row wins and where it loses.'
  predictions:
  - observable: the time and memory exponents stated in KN-LIT-3290 for quadratic systems
      over GF(2) at m = n, read verbatim from the paper
    metric: constants c (time) and c_mem (memory) in 2^{c n} and 2^{c_mem n}
    predicted: c strictly below 0.792 (the corpus's Las Vegas BooleanSolve figure). RECALLED
      as 0.6943 and NOT VERIFIED. If the paper gives c >= 0.792, or states its bound only
      for a regime excluding m = n, the record dies immediately and that is the cheapest possible
      outcome.
  - observable: crossover threshold e* = 2*omega/c and the per-scheme verdict
    metric: real number e*, and a win/lose/inapplicable label per parameter set
    predicted: 'e* between 5 and 6 at omega=2 and between 8 and 9 at omega=2.81. Verdicts:
      MQOM GF(2) WIN at both omega; MAYO and SNOVA (q=16, e=4) WIN at both omega; UOV (q=256,
      e=8) LOSE at omega=2 and marginal WIN at omega=2.81; QR-UOV INAPPLICABLE. An e* outside
      [4, 10] falsifies the arithmetic.'
  - observable: memory of the polynomial-method row versus the Groebner row at matched parameters,
      both as exponents
    metric: c_mem * e * N versus 2N + log2(e), in bits
    predicted: Polynomial method cheaper on memory iff c_mem < 2/e, i.e. c_mem < 0.5 at q=16.
      THIS IS NOT ASSERTED -- c_mem is unread. The record commits to reporting the row as
      "time-only, memory UNRESOLVED" if the paper cannot be obtained.
  - observable: optimal number of guessed variables under the new inner solver, from the exact
      cost function on the integer grid j = 0..N
    metric: integer j*
    predicted: j* = 0 at every parameter set, by part (4). A nonzero j* means c >= 1 and the
      substitution is worthless.
  - observable: degree and count of the descended system at toy (q, N) = (16, 6) and (16,
      8), constructed explicitly
    metric: max total degree and number of equations/variables
    predicted: degree exactly 2, e*N equations, e*N variables. Any degree-3 term falsifies
      the descent step.
  minimal_test: 'Zero cryptography, two steps. STEP 1, the read: obtain KN-LIT-3290 (Dinur,
    polynomial method over GF(2)) -- the local copy named in the KN-LIT record is not present
    on any filesystem reachable from this session, so the Executor must locate it or re-obtain
    it -- and extract VERBATIM the time exponent, the memory exponent, and the stated regime
    of validity. File an upgraded KN-LIT entry. If it cannot be obtained, stop and record
    the record as blocked rather than proceeding on recalled numbers. STEP 2, the arithmetic:
    for every published parameter set of UOV, MAYO, SNOVA, QR-UOV and MQOM, tabulate (a) the
    determined subsystem size N reached by the published attack, (b) N_2 = N*log2(q) when
    q is a power of 2, (c) four candidate costs in BIT operations under one stated cost model
    -- exhaustive q^N, semi-regular Groebner at omega=2, the same at omega=2.81, and the polynomial
    method 2^{c*N_2} -- and (d) the memory of each. Emit one table with the binding row per
    scheme, at unbounded memory and at a 2^{80}-bit memory cap. STEP 3, the descent control:
    construct the Weil descent explicitly at (q, N) = (16, 6) and (16, 8) for 100 random keys
    and verify the degree and the equation/variable counts.'
  controls:
  - 'UNITS CONTROL, run first: reproduce one published security row from the spec''s own formula
    and require exact agreement before any new row is admitted. A cost model that cannot reproduce
    the published number is not entitled to beat it.'
  - 'ODD-q NEGATIVE CONTROL: QR-UOV must return "descent inapplicable" and no delta. A pipeline
    that produces a delta at odd q is broken.'
  - 'q=256 SIGN CONTROL: UOV must show the polynomial method LOSING at omega=2. A method that
    wins everywhere is not tracking the field size, which is the canonical artifact tell here.'
  - 'DESCENT DEGENERACY CONTROL: at e = 1 (q = 2) the descent must be the identity map and
    the cost formula must reduce exactly to the undescended one.'
  - 'MEMORY-CAP CONTROL: the whole table recomputed at a 2^{80}-bit cap; every row that wins
    only at unbounded memory is labelled as such in the table, not in a footnote.'
  confounders:
  - The polynomial method's o(1) and hidden constants are believed large and are unpublished
    at these sizes, so the asymptotic may not have engaged at N_2 in the low hundreds. This
    is the single most likely reason a correct exponent does not translate into a real attack,
    and it appears in the table's header rather than in a caveat at the end.
  - omega is a modelling choice that decides the q=256 verdict on its own. Both columns are
    mandatory; a table with one omega is not a result.
  - The descended system is highly non-generic (it carries the F_{2^e}-structure), which could
    make Groebner-after-descent much better than Groebner-before-descent. The comparison is
    therefore always Groebner-over-F_q versus polynomial-method-over-GF(2) and never Groebner-after-descent,
    and that convention is stated in the cost model.
  - The published attacks are not always determined solves; where the binding attack is underdetermined
    the descent applies to the sub-solve after the forced variable fixing, and which step
    that is must be read from the spec rather than assumed.
  - Modelling semi-regular Groebner at m=n as binom(2N,N)^omega uses d_reg = N+1, which is
    the large-field convention; over F_2 the field equations change d_reg substantially, and
    the record must not apply the large-field convention to a GF(2) row.
  falsification_conditions:
  - KN-LIT-3290 gives c >= 0.792, or states its bound only outside m = n.
  - The measured/read memory exponent c_mem is high enough that at a 2^{80}-bit cap no row
    in the slice binds.
  - The crossover e* falls outside [4, 10], contradicting the scheme-selective claim.
  - The descent control produces any equation of degree above 2.
  - The units control fails, blocking the whole table.
  interpretation_limits: This is a cost-model claim and no solver is run. A shortfall in the
    table is a statement about two cost models, not an executed attack, and until the polynomial
    method is implemented at the relevant sizes its concrete constants are unknown. Nothing
    here breaks any scheme; the honest headline is "the minimum in these specifications is
    taken over an incomplete algorithm set, and the missing row costs X bits at these parameters,
    with memory unresolved". The exponent c is recalled, not read, and every number in the
    table inherits that status until step 1 is done.
  assumptions:
  - Weil descent of a quadratic over F_{2^e} yields quadratics over F_2 (rigorous -- Frobenius
    is F_2-linear).
  - MQOM has at least one GF(2) parameter set (RECALLED, consistent with IDEA-20260805-be7738's
    note that the q=2 rows are quoted in gates).
  - The published hybrid optima are recoverable from the specifications.
  heuristic_assumptions:
  - id: HA-1
    statement: The determined subsystems arising inside this family's attacks are, after Weil
      descent, no harder for the polynomial method than a worst-case GF(2) quadratic system
      of the same size -- that is, the descended structure cannot defeat the parity-counting
      self-reduction.
    rigorous_ingredient: The polynomial method's bound is WORST-CASE and unconditional over
      all systems of the stated shape, so structure cannot make it worse. This assumption
      is therefore only a shape-preservation claim (degree 2 is preserved, m = n is preserved),
      not a distributional one -- the rare case where the rigorous ingredient does essentially
      all the work.
    distribution_imitated: None required, and this is stated rather than a distribution being
      invented to fill the field. The imitation would only be needed for an average-case bound,
      which is not used.
    validation_route: Construct the descent symbolically at (q, N) = (16, 6) and (16, 8) for
      100 random keys of each scheme shape and verify degree 2, e*N equations, e*N variables,
      and that the e components of each descended equation are linearly independent. TOY SCALE
      for the construction, but the property checked is structural and holds for every N.
    tail_checks: 'Record any key where the e components are linearly dependent: a systematic
      dependency reduces the effective equation count below e*N, breaks the m = n shape, and
      voids the exponent for that scheme. Report the empirical dependency rate rather than
      assuming zero.'
  - id: HA-2
    statement: The polynomial-method family's memory exponent c_mem satisfies c_mem < 2/log2(q)
      at the parameter sets where the time row binds, so the substitution is memory-favourable
      as well as time-favourable at q in {2, 4, 8, 16}.
    rigorous_ingredient: Memory is bounded below by the algorithm's own table size and above
      by its time, so 0 < c_mem <= c holds unconditionally; the Groebner side's memory is
      exactly binom(2N, N) field elements, which is not heuristic either. Only the position
      of c_mem inside (0, c] is assumed.
    distribution_imitated: None -- this is a bound-location assumption, and it is flagged
      as the record's weakest point rather than dressed as a distributional claim.
    validation_route: 'Read c_mem verbatim from KN-LIT-3290 in step 1. There is no sampling
      route: the quantity is a published constant, not an empirical one. If the paper cannot
      be obtained, HA-2 FAILS BY DEFAULT and every row is reported as "time-only, memory UNRESOLVED"
      -- the record explicitly forbids substituting a guessed c_mem.'
    tail_checks: Not applicable to a read constant. The corresponding integrity check is that
      the paper's stated memory must be consistent with 0 < c_mem <= c; a reported memory
      exponent above its own time exponent indicates a misread.
  target_complexity:
    time_exponent: 'Determined inner solve: 2^{c * N * log2(q)} bit operations, c RECALLED
      0.6943, against semi-regular Groebner at ~2^{2*omega*N} and exhaustive at 2^{N log2
      q}. Exponent delta versus Groebner at q=16, omega=2: (4 - 4c)N = 1.22N bit-operation
      exponents in the polynomial method''s favour. Versus exhaustive at any q = 2^e: (1-c)*e*N
      ~ 0.306*e*N.'
    memory_exponent: Polynomial method 2^{c_mem * N * log2 q} with c_mem UNREAD; Groebner
      binom(2N,N) ~ 2^{2N} field elements = 2^{2N + log2 log2 q} bits; exhaustive search negligible.
      Because c_mem is unread, the memory column is UNRESOLVED and the record refuses to claim
      a memory win.
    best_known_baseline: 'Per scheme, the specification''s own binding row: UOV/MAYO/SNOVA/QR-UOV
      key-recovery and forgery rows, and MQOM''s Section 4.2 MQ table. Plus KN-TECH-053''s
      BooleanSolve figures as the corpus-recorded GF(2) baseline.'
    hidden_overhead_disclosure: Two disclosed overheads. First, the polynomial method's o(1)
      and constants, believed large and unpublished, which may make the asymptotic irrelevant
      below N_2 in the thousands. Second, the Groebner side's d_reg = N+1 convention is a
      large-field convention and is inappropriate for GF(2) rows, so the q=2 comparison must
      use a GF(2)-specific Groebner model or omit the Groebner column entirely.
    time_memory_tradeoff: 'Reported at unbounded memory and at a 2^{80}-bit cap. Parallelisation:
      the parity-counting recursion is embarrassingly parallel over its evaluation points,
      whereas the Groebner linear algebra is not, so on a wiring-charged model the new row
      improves further -- stated because it is the one axis on which the new row is unambiguously
      better.'
  sota_delta: 'Against MQOM''s GF(2) rows: (0.792 - c) * N_2 bits before memory is charged,
    exactly computable once the spec''s N_2 is read; with the recalled c that is 0.098 * N_2
    bits. Against MAYO and SNOVA determined solves at q=16, omega=2: up to 1.22N bit-operation
    exponents versus semi-regular Groebner. Against UOV at q=256: ZERO at omega=2, marginal
    at omega=2.81. Against QR-UOV at odd q: ZERO, inapplicable. Memory delta: UNRESOLVED.'
  dominated_by: 'For UOV at q=256 and omega=2: dominated by the specification''s own Groebner
    row, explicitly. For QR-UOV: inapplicable, so no comparison is claimed. For MAYO, SNOVA
    and MQOM''s GF(2) rows: not dominated on TIME by any row I checked -- the spec Groebner
    rows, exhaustive search, Crossbred and BooleanSolve as recorded in KN-TECH-053, IDEA-20260805-be7738''s
    reproduction of MQOM''s table, and IDEA-20260805-69af7c''s memory audit of UOV -- but
    possibly dominated on MEMORY by exhaustive search, which has negligible memory and which
    the new row cannot beat on that axis. That is why the memory-cap column exists and why
    dominated_by is not null.'
  estimated_cost: 'Implementation low: one paper read plus a spreadsheet-grade cost calculator
    plus a symbolic descent constructor. Compute low: minutes. The binding cost is obtaining
    KN-LIT-3290, whose local copy this session could not find.'
  recommended_priority: high
  honest_prior_of_survival: 'That a polynomial-method exponent strictly below 0.75 exists
    for GF(2) quadratic systems at m = n: ~0.75. That the specific constant 0.6943 is right:
    ~0.5, and it is recalled, not read. That the resulting row binds for at least one Round-3
