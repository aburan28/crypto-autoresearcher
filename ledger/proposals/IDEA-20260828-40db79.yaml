  assumptions:
    - >-
      PQClean's `crypto_kem_dec` at the pinned commit is the only call site of
      `PQCLEAN_MLKEM1024_AVX2_cmov` in that translation unit; the retrieved
      kem.c file supports this, but a call from a different translation unit
      (e.g. a test harness invoking cmov directly at another length) would not
      appear in this file and is not ruled out. The census in Stage 5 reads
      each implementation's actual call sites rather than assuming a single
      one.
    - >-
      KYBER_SYMBYTES / ML-KEM's shared-secret length is 32 bytes at every
      parameter set (ML-KEM-512/768/1024) and does not scale with the module
      rank k. This is standard, well-known FIPS 203 structure; it is treated
      as recalled-but-uncontested rather than independently re-derived, since
      no proposal or evidence record in this repository disputes it and the
      pinned PQClean source's `KYBER_SYMBYTES` macro (not itself dereferenced
      in the fetched excerpt) is consistent with it.
    - >-
      The frozen v2 extractor from IDEA-20260821-121612 correctly reads block
      width and coverage sets for the select primitives it is applied to in
      Stage 5; where it reports AMBIGUOUS or UNMEASURABLE (predication,
      multiversioning, non-constant-folded length), that cell is reported as
      such rather than assigned a number, exactly as 121612 requires.
    - >-
      No conclusion transfers beyond the pinned commits, toolchains, and
      implementations actually fetched and read. A closure at PQClean's one
      pinned commit says nothing about a different commit, a different
      backend of the same library, or an implementation not fetched.

  proof_search_map:
    bottleneck: >-
      The step from "a select primitive has the comparator's two-part
      anatomy, so the same coverage-deficit mechanism applies to it" to "and
      therefore its remainder path is unreachable at ML-KEM's real call
      length" -- and the further step from "true for PQClean's one pinned
      commit" to "true, or not, for every fetchable implementation's own
      block-width choice."
    baseline_embedding:
      parameter_slice: >-
        Restricted to w = 32, len = 32, this reduces exactly to
        IDEA-20260805-3c957e's own closed form evaluated at the single point
        L mod w = 0 -- the identical arithmetic rule that closed the
        comparator's cells at strides w in {1,2,4,8,16,32} against a
        ciphertext length divisible by 32, now applied to a length that is
        ALWAYS exactly 32 rather than a multiple of it. The proposal is
        therefore a family extension along one axis (from the comparator's
        input buffer to the select's output buffer) while reusing the
        donor's arithmetic verbatim.
      reproduction_check: >-
        Recompute `32 mod 32` under a frozen one-line script and confirm it
        reproduces `0`, the same value IDEA-20260805-3c957e's own table
        reports for every w in {1,2,4,8,16,32} at every ciphertext length in
        {768,1088,1568}. A failure of this trivial check before any candidate
        read would indict the script, not the claim.
    observation_collision:
      observable: >-
        The 32-byte value returned as the shared secret from a decapsulation
        call.
      distinct_preimage_search: >-
        A defective select whose remainder path never executes leaves any
        UNWRITTEN byte equal to whatever the caller's buffer held before the
        call. If that prior content happens to equal the correct branch's
        value (e.g. an output buffer pre-populated with K, or two candidate
        secrets that happen to agree on a suffix), a genuinely incomplete
        select and a complete one produce the IDENTICAL observable on that
        input -- a real collision. Stage 3's pre-poisoning control (fill the
        output buffer with a value guaranteed to differ from both K and
        K-bar in every byte before each planted call) is the countermeasure
        that makes the observable identify coverage rather than accident.
      constructive_transforms:
        - transform: representation_reduction
          proposed_object: >-
            Cov_sel(impl, len), the write-side coverage set defined in
            object_first_candidate, standing in for the select's full
            instruction stream.
          predicted_gain: >-
            Reduces "is this select complete at this call length" to a
            single closed-form arithmetic check (`len mod w`) plus one
            planted-comparator confirmation, at zero library-build cost for
            the closure claim itself.
      quantifier_order: >-
        FOR the specific pinned commit of PQClean ml-kem-1024/avx2, FOR the
        select's one call site in that commit's kem.c, the remainder path is
        unreachable (an existential witness verified by direct source
        reading, not assumed). The GENERAL claim "FOR ALL conforming
        implementations, IF the select's block width divides its call
        length, THEN the remainder path is unreachable at that call" is a
        single conditional implication whose antecedent is checked
        per-implementation in Stage 5, never asserted uniformly without
        checking.
      method_ceiling:
        strongest_certifiable_claim: >-
          For a stated, finite set of pinned and fetched implementations
          whose select block width and call length are read directly from
          source or disassembly, the select's hand-written remainder path is
          provably unreachable by any legitimate decapsulation call,
          independent of key or ciphertext content, wherever the block width
          divides the call length. No claim is made, or certifiable by this
          method, about implementations not fetched, or about whether a
          reachable remainder path (block width not dividing call length)
          is actually defective where it does occur -- that is a further,
          separate audit this record does not perform.
        nearby_object_control: >-
          A planted select with block width w = 48 or w = 64 called at
          len = 32 (so the block loop runs zero times and the ENTIRE 32-byte
          output is routed through the scalar remainder), built and probed
          under the pre-poisoning control of Stage 3. The method must report
          this cell as REACHABLE with a nonzero forced deficit under a
          defective remainder implementation, and as covered under a correct
          one -- distinguishing the two is exactly what confirms the method
          has not merely learned to output "closed" regardless of input.
      proof_obligations:
        - claim: The remainder path executes zero iterations at PQClean's real call.
          responsibility: size
        - claim: The pre-poisoned observable correctly attributes an unwritten byte to a coverage gap rather than to accidental agreement.
          responsibility: correctness
        - claim: The frozen v2 extractor's block-width and coverage-set readings agree with a direct source reading on the two pinned candidates.
          responsibility: interface
        - claim: The forced closure transfers to no implementation beyond those actually fetched and read.
          responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        deficit_sel(PQClean_avx2, len=32): the coverage deficit of
        PQCLEAN_MLKEM1024_AVX2_cmov's output buffer at its real call length,
        recomputed under the frozen script
      direction: lower
      minimum_effect: >-
        EXACTLY 0, with no tolerance, following from `32 mod 32 = 0` alone.
        Any other value means either the source quoted in this record's
        claim (B) was misread or the pinned commit's code has since changed,
        and the record is withdrawn in that part pending re-verification.
    - metric: >-
        remainder_loop_trip_count: the number of scalar-remainder iterations
        PQCLEAN_MLKEM1024_AVX2_cmov executes when called exactly as
        crypto_kem_dec calls it (len = KYBER_SYMBYTES)
      direction: lower
      minimum_effect: >-
        EXACTLY 0, forced and unconditional on the key, ciphertext, or
        condition byte b, since the trip count is `len mod 32` with
        len constant-folded to 32 at this call site.
    - metric: >-
        poisoned_byte_agreement: on the pre-poisoning control (Stage 3), the
        number of output-buffer bytes that still equal the poison value
        after a planted call, for a select whose remainder path is CORRECT
        by construction (a control arm, not a candidate)
      direction: lower
      minimum_effect: >-
        EXACTLY 0 for every planted (w, len) cell where the block-plus-
        remainder pair is built to be complete. A nonzero count here
        indicts the control's own construction, not any candidate, and voids
        every candidate reading taken against the same poison value until
        repaired.
    - metric: >-
        poisoned_byte_agreement on a planted select DELIBERATELY built with
        an absent remainder path, at (w=48, len=32) and (w=64, len=32)
      direction: higher
      minimum_effect: >-
        EXACTLY 32 (the entire output buffer), since the block loop runs
        zero times and the omitted remainder never executes at either
        width. This is the must-fire arm establishing that the pre-
        poisoning instrument can actually see a total coverage failure,
        without which a zero reading elsewhere would be uninterpretable
        (mirroring KN-TECH-1a5b7e mode 2).
    - metric: >-
        cross_implementation_closure_fraction: over every implementation
        fetched in Stage 5 whose Algorithm-18-equivalent select has a
        SIMD/vector block structure (purely scalar selects are out of
        population), the fraction whose block width divides its own call
        length
      direction: different
      minimum_effect: >-
        No number is predicted and the refusal is deliberate: this is the
        record's discriminator. 1.0 means C-SEL is closed universally on the
        fetched population by the same forced arithmetic that closes
        PQClean's; a value below 1.0 names the specific implementation(s)
        at which the site is reachable and therefore a genuinely new,
        previously untested candidate for the isolation-versus-systemic
        question.
    - metric: >-
        polarity_check: on fully-covered bytes only (w | len cells), whether
        b=1 selects x and b=0 leaves r unchanged, for the retrieved
        `-b & (x[i]^r[i])` and `_mm256_blendv_epi8(rvec, xvec, bvec)` idioms
        under bvec = broadcast(-(uint64_t)b)
      direction: different
      minimum_effect: >-
        MUST hold exactly for b in {0,1} by the two's-complement identity
        `-(uint64_t)0 = 0x0` (all-zero mask, blend keeps r) and
        `-(uint64_t)1 = 0xFFFF...FFFF` (all-one mask, blend takes x); this is
        a symbolic check, not a measured one, and its purpose is only to
        confirm this record has not silently conflated coverage with
        polarity, per the survival-boundary limit stated above.

  minimal_test:
    design: >-
      Three stages, cheapest and most decisive first, entirely on laboratory
      builds from public source. STAGE 0 (minutes, zero build): recompute
      `32 mod 32` and reproduce IDEA-20260805-3c957e's own table entries for
      w | L under the identical script, before reading any further source.
      This alone produces the record's headline closure for PQClean.
      STAGE 1 (minutes, no build): the two-implementation source/call-site
      census already performed this session for PQClean, extended to every
      other implementation fetchable within budget, reading block width and
      call length directly from source or from IDEA-20260821-121612's frozen
      extractor's disassembly output where source alone is ambiguous.
      STAGE 2 (bounded, tens of minutes): build 4-6 planted selects spanning
      dividing and non-dividing (w, len) pairs under GNU ld --wrap, run the
      pre-poisoning control and the must-fire arm, and confirm the forced
      deficit table plus the polarity check on covered bytes. Total compute
      is small: no key generation, no ciphertext, no full KEM round trip is
      needed, only direct calls to the select primitive with synthetic
      buffers.
    controls:
      - >-
        PRE-POISONING CONTROL (Stage 3 of mechanism): every output buffer is
        filled with a value differing from both candidate secrets in every
        byte before each planted call, removing the observation collision
        named above.
      - >-
        MUST-FIRE ARM: a planted select with block width not dividing its
        call length and a deliberately omitted remainder path, forced to
        show a full-buffer deficit; without it, a zero reading elsewhere is
        uninterpretable (KN-TECH-1a5b7e mode 2).
      - >-
        CORRECT-CONTROL ARM: a planted select built to be complete at a
        non-dividing (w, len) pair via a correct remainder path, forced to
        show zero deficit despite w not dividing len -- separating "the
        arithmetic makes a deficit POSSIBLE" from "a deficit is PRESENT",
        the same distinction IDEA-20260821-121612 draws for reachability
        versus defect.
      - >-
        NEARBY-OBJECT CONTROL WHERE THE METHOD MUST REPORT OUT-OF-POPULATION:
        a purely scalar, byte-at-a-time select with no block structure at
        all. The predicate must report "out of the C-SEL population", never
        assign it a coverage fraction, mirroring IDEA-20260805-ee2018's
        identical control for C-RED.
      - >-
        ORDERING CONTROL: the frozen arithmetic script's output and the
        planted-comparator forced values are committed and hashed before any
        candidate implementation beyond PQClean is read in Stage 1, so no
        cell's classification can be adjusted after the fact.
      - >-
        ARCHIVE CHECK (zero compute): confirm this record's `32 mod 32 = 0`
        computation against IDEA-20260805-3c957e's already-committed table
        entries for w in {1,2,4,8,16,32}, which report the identical value 0
        at every ciphertext length -- the same reproduction fixture used in
        that record's own NULL-5.
    required_metrics:
      - the recomputed deficit_sel table (forced 0 for PQClean) with script and hash
      - per-implementation (block width, call length, divides?) triple from the Stage 1/5 census, with source or disassembly excerpt quoted
      - per-planted-cell poisoned-byte-agreement counts for both the correct-construction and defective-construction arms
      - the polarity check outcome on fully-covered bytes
      - the list of implementations reported out-of-population (purely scalar selects) with the reason
      - every patch diff, build configuration, and pinned commit used

  falsification_conditions:
    - >-
      The retrieved PQClean source quoted in claim (B)/(C) does not match a
      fresh fetch at the same pinned commit, or the call site passes a length
      other than KYBER_SYMBYTES = 32. The forced closure for PQClean is wrong
      or void and this record is withdrawn in that part.
    - >-
      The pre-poisoning control's own correct-construction arm shows any
      nonzero poisoned-byte-agreement. The control is broken; no candidate
      reading taken before the repair is trustworthy.
    - >-
      The must-fire arm fails to show a full-buffer deficit on a
      deliberately incomplete planted select. The harness cannot see a total
      coverage failure it is constructed to see, and no zero reading
      anywhere in this record is interpretable until repaired.
    - >-
      Any fetched implementation shows a select block width that does not
      divide its own call length AND a remainder path that is absent,
      mis-bounded, or unmeasurable. C-SEL is reachable there; this is a
      genuine, escalable finding under RQ-MLKEM-002's constraints, not merely
      a negative result for this record.
    - >-
      A fetched implementation's Algorithm-18-equivalent select is called at
      a length other than 32 anywhere in its decapsulation path. The
      length-independence assumption in this record's claim is wrong for
      that implementation and its cells must be recomputed at the length
      actually used.
    - >-
      Build or fetch failures for any candidate implementation.
      INFRASTRUCTURE outcome under AGENTS.md rule 3, never evidence about
      that implementation; the census is reported over the cells that built.

  confounders:
    - >-
      THE OBSERVATION COLLISION IS REAL, NOT HYPOTHETICAL. A select's output
      buffer commonly starts as either a freshly derived K or a freshly
      derived K-bar written by a PRIOR step in the same function, so an
      unwritten tail byte can silently agree with the correct answer by
      construction rather than by defect. This is exactly what the
      pre-poisoning control exists to rule out, and any candidate result
      obtained without it is not admissible under this record's own design.
    - >-
      LENGTH CONSTANCY IS AN IMPLEMENTATION FACT PER CALL SITE, NOT A
      UNIVERSAL ONE. FIPS 203 fixes the shared-secret length at 32 bytes, but
      an implementation could, in principle, batch multiple decapsulations
      through one select call at a multiple of 32, or use the same select
      routine for an unrelated buffer elsewhere in the codebase at a
      different length. The census in Stage 5 reads the ACTUAL call sites
      rather than assuming a single canonical one.
    - >-
      REACHABILITY IS NOT PRESENCE. A block width failing to divide the call
      length makes the remainder path reachable; whether that path is itself
      correct is a separate, further question this record does not resolve
      and does not claim to.
    - >-
      SELECTION BY WHAT WAS PINNED. The forced closure is demonstrated on one
      pinned commit of one implementation; the census's population is
      whatever is fetchable within budget, and every count is a floor over
      that population, stated as such.
    - >-
      TOOLCHAIN AND CALL-SITE VARIANCE ARE OUT OF SCOPE HERE. This record
      reads block width and call length from source/disassembly at ONE
      toolchain configuration per implementation and does not vary compiler,
      optimization level, or inlining; IDEA-20260821-121612 established that
      such variance exists for the comparator and a companion record
      (filed separately this session) proposes extending that axis to
      call-site specialization. A select found closed here at one
      configuration is not thereby shown closed at every configuration.

  interpretation_limits:
    - >-
      NOT AN ATTACK, NOT AN ORACLE, NOT AN EXPLOITATION PATH, NOT A COST
      ESTIMATE, NOT A STATEMENT ABOUT MLWE HARDNESS OR ML-KEM SECURITY AT ANY
      PARAMETER SET. RQ-MLKEM-002's constraints bind unchanged; any newly
      observed conformance defect escalates to the coordinator and is
      published by no agent.
    - >-
      NO STATUS CHANGE is proposed for GOAL-MLKEM-002, for any hypothesis, or
      for any archived evidence or decision record.
    - >-
      A forced deficit of 0 at one implementation's one pinned commit does
      NOT establish that its select is otherwise correct, that its polarity
      (K vs K-bar selection) is right, or that any other implementation's
      select behaves the same way. It establishes exactly one arithmetic
      fact about one routine at one call length.
    - >-
      Claim tier laboratory/toy, not raisable by citation. A conclusion is
      scoped to the exact pinned commits, call sites, and toolchain
      configurations actually read or built; laboratory conformance evidence
      is never crypto-scale or MLWE evidence.
    - >-
      A universally-closed census (every fetched implementation's select
      block width divides its call length) closes nothing about the
      isolation-versus-systemic question beyond this one site; it removes one
      candidate site from future search, not the search itself. Premature
      closure is a failure mode symmetric with overclaiming.

  heuristic_assumptions:
    - id: H1
      statement: >-
        REMAINDER-PATH REACHABILITY. FOR ALL select primitives with a
        w-byte SIMD block loop covering `w * floor(len/w)` bytes followed by
        a scalar remainder loop intended to cover the trailing `len mod w`
        bytes, the remainder loop executes exactly `len mod w` times when
        `len` is compile-time or call-site constant-folded, and therefore
        executes zero times, for every input, if and only if `w` divides
        `len`.
      rigorous_support: >-
        Not a distributional heuristic; a rigorous arithmetic fact about
        loop trip counts under the stated block/remainder decomposition,
        directly analogous to IDEA-20260805-3c957e's own H1 for the
        comparator's remainder loop, transported unchanged to the select's
        remainder loop. It imitates no classical distribution theorem and is
        not presented as one. It requires the length to be genuinely
        constant at the call site (verified for PQClean by direct source
        reading of both the select's signature and its one call site) and
        fails to apply, reporting UNMEASURABLE rather than a wrong number,
        when the length is a true runtime variable not resolved by constant
        propagation.
      validation_plan: >-
        Recompute the trip count symbolically for PQClean's pinned call
        (w=32, len=32, giving 0) and cross-check against
        IDEA-20260805-3c957e's already-committed table for the comparator at
        the same w values and at ciphertext lengths in {768,1088,1568}, all
        of which report 0 for w | L. Confirm on planted selects at
        non-dividing (w, len) pairs (Stage 4) that the measured trip count
        under instrumentation equals `len mod w` exactly, not merely
        nonzero. No sampling at cryptographic scale is required; this
        assumption is about a loop's trip count, not about ML-KEM's
        algebraic structure.
    - id: H2
      statement: >-
        CALL-LENGTH UNIFORMITY. For a conforming ML-KEM implementation's
        Algorithm-18-equivalent select, every call site in its decapsulation
        path uses `len = 32` (the shared-secret length), independent of the
        parameter set (k = 2, 3, or 4).
      rigorous_support: >-
        Rigorous given FIPS 203's specification of a fixed 32-byte shared
        secret at every parameter set (RECALLED, not independently fetched
        this session; see the recalled FIPS 203 citation above) and given
        the one retrieved call site in PQClean, which confirms it for that
        implementation. NOT independently verified for any implementation
        beyond PQClean's one pinned commit; a build that batches multiple
        secrets through one select call, or reuses the select routine for an
        unrelated buffer, would break it for that implementation specifically.
      validation_plan: >-
        Per implementation in the Stage 5 census, read every call site of
        the select routine from source and record the length argument
        passed at each, rather than assuming 32 uniformly. A length other
        than 32 at any call site falsifies H2 for that implementation and
        that cell's coverage arithmetic is recomputed at the length actually
        used rather than discarded.

  target_complexity:
    time_exponent: >-
      n/a. No exponent is moved and no attack is proposed; RQ-MLKEM-002
      forbids attack-cost estimation. Stated plainly, matching every prior
      accepted proposal in this lane (e.g. IDEA-20260805-ee2018). The
      deliverable is a zero-compute closure of one candidate defect site
      plus a bounded source/disassembly census, not an asymptotic result.
    memory_exponent: n/a
    best_known: >-
      n/a -- no competing statement of select-primitive coverage exists in
      this repository or, so far as searched this session, elsewhere.
    hidden_overhead: >-
      n/a. The planted-comparator stage (Stage 4/Stage 2 of minimal_test) is
      dominated by a handful of small standalone compiles and direct
      function calls with synthetic 32-64 byte buffers, well under a second
      each; no key generation or full KEM round trip is required.
    tradeoff_note: n/a

  dominated_by: >-
    n/a (no result claimed; no algorithm, no cost, hence no Pareto point
    across time, memory, or data/queries). Rows checked inside this
    repository on 2026-08-28 for a prior treatment of the Algorithm-18
    select primitive as a coverage-deficit object: all eight filed
    RQ-MLKEM-002 proposals (IDEA-20260724-001, -002; IDEA-20260805-ee2018,
    -3c957e, -1beeca; IDEA-20260821-121612, -13b667, -25d3ca), read in full
    or in their claim/mechanism/discriminated_from sections; RQ-MLKEM-001's
    H-MLKEM-232843, H-MLKEM-002, H-MLKEM-003; GOAL-MLKEM-002 and its four
    batch checkpoints; EV-MLKEM-005 through EV-MLKEM-010 (read first-hand
    where cited, transitively elsewhere via a reading proposal named in the
    relevant citation); and KN-FIND-001. None examines the select's own
    block/remainder anatomy or its call-length arithmetic. No external
