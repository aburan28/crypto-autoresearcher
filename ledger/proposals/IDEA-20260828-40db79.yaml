    coverage defects was performed, and no external novelty is claimed.
  sota_delta: >-
    No attack; mechanism/measurement contribution only. Quantitatively:
    the lane's site coverage before this record was two candidate sites
    (the decapsulation re-encryption comparison, exhaustively studied across
    six proposals; the encapsulation modulus check, opened but left as an
    unresolved census question by IDEA-20260821-25d3ca) plus one named-but-
    unpursued mechanism class (C-FIN) at those sites. This record adds a
    THIRD site (Algorithm-18's post-comparison select) and, unlike the other
    two open questions, closes it immediately at the one real parameter
    value that matters (len = w = 32) via a one-line zero-compute arithmetic
    check identical in form to an already-validated rule in this lane,
    while leaving the cross-implementation census (does every fetchable
    select's block width divide 32) as the sole remaining open discriminator
    at that site.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
