idea:
  id: IDEA-20260828-40db79
  question_id: RQ-MLKEM-002
  added: '2026-08-28'
  title: >-
    C-SEL: the comparison taxonomy's coverage-deficit mechanism (C-COV/C-BND),
    transported for the first time to the write side of Algorithm 18's
    post-comparison select, and its forced arithmetic closure at ML-KEM's own
    call length
  class: mechanism

  claim: >-
    (A) THE GAP. Every proposal filed against RQ-MLKEM-002 to date
    (IDEA-20260805-ee2018, -1beeca, -3c957e; IDEA-20260821-121612, -13b667,
    -25d3ca) studies the READ side of one primitive: the byte-equality
    comparison that decides whether the re-encrypted ciphertext c' matches the
    received ciphertext c. FIPS 203's Algorithm 18 (ML-KEM.Decaps) does not
    stop at that verdict. It feeds the verdict into a second, distinct
    constant-time primitive -- a masked conditional-move ("cmov" / select)
    that writes either the derived shared secret K or the implicit-rejection
    value K-bar into the caller's output buffer, one block at a time. RQ-MLKEM-
    002's scope explicitly names "Algorithm-18 decapsulation-boundary
    attestation" as an in-scope method; no filed proposal has used it. This
    record is the first to treat the select primitive itself, rather than the
    comparison it consumes, as the tracked object.
    (B) THE MECHANISM TRANSPORTS VERBATIM. PQClean's ml-kem-1024/avx2 select
    (`PQCLEAN_MLKEM1024_AVX2_cmov`, pinned commit
    10738d92323117d84bb6202c85722ddfd96dc1d4, retrieved and read in full this
    session from the upstream repository and cross-checked against the copy
    already committed in this program's own
    experiments/EXP-MLKEM-009/analysis/pre-run/pqclean_mechanism_evidence.txt)
    has EXACTLY the two-part anatomy IDEA-20260805-ee2018 established for the
    comparator: a w=32-byte AVX2 block loop (`_mm256_blendv_epi8` under a
    per-block mask) that runs `len/32` times, followed by a hand-written
    scalar remainder loop (`r[i] ^= -b & (x[i]^r[i])`) over the trailing
    `len mod 32` bytes. A select with an absent, mis-bounded, or unreachable
    remainder path is the SAME defect mechanism the lane already names C-COV /
    C-BND, transported from the comparison's input buffer to the select's
    OUTPUT buffer: some trailing bytes of the returned secret would never be
    written by either code path and would carry over whatever the caller's
    buffer held before the call -- neither K nor K-bar, on either the accept
    or reject branch. This is a functional-correctness question (does the
    returned buffer equal one of the two spec-defined 32-byte values, byte for
    byte) and requires no timing, power, EM, cache, or fault measurement,
    consistent with RQ-MLKEM-002's constraints.
    (C) THE FORCED CLOSURE AT THE REAL CALL SITE, ZERO COMPUTE. The same
    upstream source (retrieved this session) shows `crypto_kem_dec` calling
    this select exactly once: `PQCLEAN_MLKEM1024_AVX2_cmov(ss, kr,
    KYBER_SYMBYTES, (uint8_t)(1 - fail))`. KYBER_SYMBYTES = 32 at every FIPS
    203 parameter set (the shared-secret length is fixed, unlike the
    ciphertext length the comparator reads). Because the select's block width
    is also 32 and 32 mod 32 = 0, the scalar remainder loop executes ZERO
    iterations at this call, for every value of the condition byte, every key,
    and every ciphertext: the hand-written fallback that would carry a C-SEL
    defect is provably unreachable from any legitimate ML-KEM decapsulation
    call through this code path. This is the identical arithmetic rule
    IDEA-20260805-3c957e used to close the comparator's cells at strides
    dividing 32 (`w | L`), applied here to a different (buffer, primitive)
    pair with L = 32 fixed rather than variable.
    (D) THE DISCRIMINATING CENSUS QUESTION. Is this closure a property of the
    select PRIMITIVE IN GENERAL -- i.e. does every fetchable implementation's
    Algorithm-18 select use a block width that divides its own call length of
    32, closing C-SEL everywhere by the same forced arithmetic -- or is it an
    accident of one implementation's block-width choice, such that a select
    with a wider or oddly-sized block (e.g. 48 or 64 bytes, plausible on a
    wider vector unit or a byte-lane-doubled design) would leave the ENTIRE
    32-byte output routed through, or partially through, the hand-written
    remainder path, reopening exactly the coverage-deficit question the
    comparator already had at non-dividing strides? Both outcomes are
    reachable and both are informative: universal closure strengthens the
    lane's overall completeness picture at a third site for zero additional
    instrumentation; a single non-dividing implementation gives the isolation-
    versus-systemic search a previously untested candidate site, with an
    immediate RQ-MLKEM-002 escalation trigger if that implementation's
    remainder path is also found absent or mis-bounded.
    (E) WHAT IS NOT CLAIMED. No attack, no oracle, no exploitation path, no
    attack-cost estimate, no timing/power/EM/cache/fault measurement, no
    statement about MLWE hardness or ML-KEM security at any parameter set. No
    claim that any implementation's select is defective -- PQClean's own is
    shown CLOSED, not defective. A block width failing to divide the call
    length would make a defect class REACHABLE, not present; the two are not
    conflated. Any newly observed conformance defect escalates to the
    coordinator per RQ-MLKEM-002 and is published by no agent.

  mechanism: >-
    STAGE 0 -- CONFIRM THE SOURCE AND THE CALL SITE, ALREADY DONE THIS SESSION.
    Both `PQCLEAN_MLKEM1024_AVX2_verify` and `PQCLEAN_MLKEM1024_AVX2_cmov` were
    retrieved via direct fetch of
    `raw.githubusercontent.com/PQClean/PQClean` at the pinned commit
    10738d92323117d84bb6202c85722ddfd96dc1d4 and cross-checked against this
    program's own committed evidence file (which independently quotes the
    verify function and the cmov signature/doc-comment). The call site in
    `kem.c` at the same commit was separately retrieved and shows
    `fail = PQCLEAN_MLKEM1024_AVX2_verify(ct, cmp, KYBER_CIPHERTEXTBYTES);`
    followed by `PQCLEAN_MLKEM1024_AVX2_cmov(ss, kr, KYBER_SYMBYTES,
    (uint8_t)(1 - fail));`, with no other call to `cmov` anywhere in the file.
    STAGE 1 -- THE COVERAGE PROJECTION, DEFINED ON THE WRITE SIDE. For a
    select `sel(r, x, len, b)` with a w-byte block loop and a scalar
    remainder, define `Cov_sel(impl, len) subset of [0, len)` as the set of
    output-buffer byte positions provably written by SOME code path (block
    loop or remainder loop) for a fixed len, exactly mirroring
    IDEA-20260821-121612's static coverage-set definition for the comparator
    but applied to `r`'s write footprint rather than `a`/`b`'s read footprint.
    `deficit_sel(impl, len) = len - |Cov_sel(impl, len)|`.
    STAGE 2 -- THE ARITHMETIC, ZERO COMPUTE. For PQClean's select, w = 32,
    the real call uses len = KYBER_SYMBYTES = 32 at every parameter set (this
    is, uniquely among the quantities this lane has closed-formed, INDEPENDENT
    of k, since the shared-secret length does not scale with the module rank).
    len/32 = 1, len mod 32 = 0: one full block, zero remainder iterations.
    `deficit_sel = 0` follows from `32 | 32` alone, with no assumption about
    the mask value b, the buffer contents x or r, or the comparison outcome.
    This is recomputed under a frozen one-line script before any further stage
    and requires no library build.
    STAGE 3 -- THE OBSERVATION-COLLISION CONTROL. The returned secret's 32
    bytes are the only observable at this boundary, and a defective remainder
    path is INDISTINGUISHABLE from a correct one whenever the caller's output
    buffer happens, by construction or prior contents, to already equal the
    value the correct branch would have written -- e.g. if `ss` is
    pre-populated with K before the call and a defective select never touches
    the tail, the tail reads as correct by accident. Every planted-comparator
    run in Stage 4 therefore pre-poisons the output buffer with a value
    guaranteed to differ from BOTH K and K-bar in every byte before each call,
    so that any silently-unwritten byte is directly observable as a mismatch
    against both spec-defined values, never mistaken for a correct result.
    STAGE 4 -- PLANTED-SELECT CONFIRMATION. Build two planted selects at
    several (w, len) pairs spanning both dividing and non-dividing cases (w in
    {16, 32, 48, 64}, len in {32} to match ML-KEM's real call, plus len in
    {24, 40, 48} as stress cases exercising a nonzero forced deficit), under
    the GNU ld --wrap interposition already admitted for this instrument class
    on linux/amd64 (EV-MLKEM-010; call-site `INTERPOSE_COMPARE`/macro
    interposition is never used, per EV-MLKEM-009's refutation). Confirm the
    forced deficit table (0 wherever w | len, len mod w otherwise) against the
    poisoned-buffer observable, and confirm b in {0,1} correctly selects K
    versus K-bar on every FULLY covered byte, independent of the deficit
    arm -- separating "select is complete" from "select picks the right
    value", which is this record's explicit survival boundary (see below).
    STAGE 5 -- THE CROSS-IMPLEMENTATION CENSUS. For every implementation
    fetchable within budget, locate the Algorithm-18-equivalent select (cmov,
    ct_select, blend, or a scalar constant-time copy), read its block width
    w_I from source or disassembly (reusing IDEA-20260821-121612's frozen v2
    extractor rather than re-deriving a stride reader), and its call length
    L_I from the call site (expected 32 = KYBER_SYMBYTES / ML_KEM_SSBYTES
    uniformly, but verified per implementation rather than assumed), and
    report `w_I | L_I` per implementation. A purely scalar byte-at-a-time
    select (no block loop at all) is out of the C-SEL population by
    definition, exactly as a scalar comparator was out of C-RED's population
    in IDEA-20260805-ee2018, and is reported as such rather than scored.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Retrieval this session used Grep over the repository plus WebSearch and
      WebFetch (the crypto-kb MCP index's availability was not re-checked and
      is not relied on here). Grep of `ledger/proposals` (glob *MLKEM*) for
      `Algorithm.?18|cmov|constant-time select|implicit.rejection|K-bar|K̄|
      branch`, case-insensitive: NO MATCHES across all eight filed
      RQ-MLKEM-002 proposals. Grep of `knowledge/` for `cmov`, case-
      insensitive: NO MATCHES in the entire knowledge corpus. Grep of
      `ledger/hypotheses` (glob H-MLKEM*) for `cmov|Algorithm 18|Algorithm18|
      implicit.rejection`: three hits (H-MLKEM-232843, H-MLKEM-002,
      H-MLKEM-003), all read in full or in the matched region; none examines
      the select primitive's own block/remainder anatomy (H-MLKEM-232843
      black-box mutates dk's H(ek)/z FIELDS and reads decapsulation's overall
      (a,r) behavior under RQ-MLKEM-001, a materially different object from a
      white-box coverage-set read of the select's code; H-MLKEM-002/003 cite
      Algorithm 18's K/K-bar selection only in passing, to explain the
      comparator's own mechanism, never as an object in its own right). All
      eight RQ-MLKEM-002 proposals were read in full or in their claim/
      mechanism/object_first_candidate/discriminated_from sections this
      session (IDEA-20260724-001, -002; IDEA-20260805-ee2018, -3c957e,
      -1beeca; IDEA-20260821-121612, -13b667, -25d3ca), as was
      GOAL-MLKEM-002.yaml and RQ-MLKEM-002.yaml in full.
      Web: (W1) WebFetch of the upstream PQClean verify.c/kem.c at the pinned
      commit -- RETRIEVED AND READ, source of the code quoted in claim (B) and
      (C). (W2) WebSearch and WebFetch of a third-party WASM audit doc
      (`xero/leviathan-crypto/docs/mlkem_audit.md`) -- RETRIEVED, used only to
      corroborate that a separate ct_verify/ct_cmov naming convention is a
      real, documented pattern in independently-authored ML-KEM
      implementations generally; NOT relied on for any byte-level claim about
      PQClean specifically, and its authorship/review status is unverified.
      (W3) WebFetch of csrc.nist.gov/pubs/fips/203/final -- returned only
      publication metadata, no algorithm text; the general shape of
      Algorithm 18 (recompute c', compare, select K or K-bar) is therefore
      RECALLED, not retrieved, consistent with every prior record in this
      lane that attempted and failed to fetch readable FIPS 203 text.
    results: >-
      No record inside this repository treats the select/cmov primitive as an
      object, at any level. IDEA-20260821-13b667 comes closest, naming C-FIN
      ("both are complete but the finalize step loses the bit") as a fourth,
      unpursued class, but C-FIN as named there concerns the COMPARATOR's own
      boolean output, not a SEPARATE downstream primitive that consumes that
      output. IDEA-20260821-121612's confounders block explicitly flags
      call-site specialization and toolchain variance for the COMPARATOR only,
      never mentions the select. IDEA-20260821-25d3ca's shared-routine census
      is about whether the modulus check and the re-encryption comparison
      share ONE routine; it does not consider a second, distinct primitive.
      Outside the repository, constant-time cmov/blend implementations are
      standard practice (PQClean's own doc comment, quoted in mechanism,
      states the requirement plainly) and no claim of external novelty is
      made or searched for.
    verdict: >-
      UNVERIFIED. Claimed new relative to this repository: treating the
      Algorithm-18 select as a tracked object at all; transporting the
      C-COV/C-BND coverage-deficit mechanism to its write side; the forced
      zero-deficit closure at PQClean's real call length (len = w = 32,
      independent of k); and the cross-implementation call-length/block-width
      census as the open discriminator. ASSEMBLED FROM KNOWN PARTS: the
      accumulate/block-plus-remainder anatomy and the coverage-deficit
      mechanism are IDEA-20260805-ee2018's; the residue-arithmetic closure
      method (does the stride divide the buffer length) is
      IDEA-20260805-3c957e's; the static coverage-set definition and its
      frozen extractor are IDEA-20260821-121612's; the GNU ld --wrap
      instrument discipline is EV-MLKEM-010's; the source code itself is
      PQClean's. No academic search for prior work on select-primitive
      coverage defects was performed.

  object_first_candidate:
    tracked_object: >-
      `Cov_sel(impl, len) subset of [0, len)`, the set of output-buffer byte
      positions the select primitive provably writes via some code path at a
      fixed call length, together with `deficit_sel = len - |Cov_sel|`. This
      is the C-COV/C-BND mechanism's WRITE-side counterpart: the established
      family (comparator coverage, silent set S, reduction fraction phi,
      finalize-boolean correctness) is declared off-limits as the primary
      lens per inventor-protocol section 1, and is used here only as the
      donor mechanism being transported to a new (buffer, primitive, call
      length) triple that no filed proposal has examined.
    lossiness: >-
      Genuinely lossy and compatible with the operation of interest. The
      full state at a select call is (r's prior contents, x's contents, len,
      b, the compiled routine's entire instruction stream); the projection
      keeps only which byte positions of r are provably assigned by some
      instruction, discarding the values written, the mask-construction
      method (blendv vs. XOR-and-mask vs. a scalar loop), and everything
      about b or x. The fibre is large and non-singleton: a blendv-based
      block loop and an XOR-mask-based block loop with the same block width
      produce the identical coverage set while differing completely in
      instruction stream, exactly as IDEA-20260821-121612 showed for the
      comparator's coverage set. Compatibility with the target's operation
      ("select at a given call length") holds because Cov_sel is defined at
      and recomputed per fixed len, the same discipline 121612 uses for the
      comparator's coverage set.
    propagation: >-
      One step of the operation of interest is "call the select at length
      len". The propagation law is deterministic and closed form:
      `deficit_sel(w, len) = len mod w` when the routine's block loop covers
      `w * floor(len/w)` bytes and its remainder loop covers the rest
      correctly, `0` when it additionally has a correct remainder path
      regardless of len mod w, and unspecified magnitude but nonzero when
      the remainder path is absent or mis-bounded -- identical in form to
      IDEA-20260805-3c957e's `L mod w` law for the comparator, evaluated at
      a different, and in ML-KEM's case FIXED, length.
    survival_score: >-
      Survives one step and stops deliberately at the boundary the record
      states in advance. Step 1, "is every output byte position covered by
      some code path at the actual call length": survives, and this is
      exactly what Stage 2's zero-compute arithmetic answers for PQClean.
      Step 2, "did the select choose the CORRECT value (K vs K-bar) on the
      covered bytes": DOES NOT SURVIVE as a claim of this record -- coverage
      completeness says nothing about whether the mask/condition byte itself
      is correctly derived from the comparison's verdict, which is a
      distinct polarity/finalize question this record does not address and
      does not conflate with coverage. Stage 4's planted arm separately
      confirms polarity on FULLY-covered bytes only, precisely to keep the
      two questions apart.

  discriminated_from:
    - >-
      IDEA-20260805-ee2018, -1beeca and -3c957e establish and use the
      C-COV/C-BND/C-RED taxonomy on the COMPARATOR's read side at the
      ciphertext boundary. This record does not restate that taxonomy or its
      arithmetic; it transports the coverage-deficit half of it to a
      different primitive (select, not compare) at a different, fixed-length
      buffer (the 32-byte shared secret, not the variable-length ciphertext),
      and reaches an opposite-flavoured forced value (universal closure at
      the real call length, versus the comparator's mixed 5-open/22-closed
      table across strides).
    - >-
      IDEA-20260821-13b667 names C-FIN as an unpursued fourth class
      concerning the COMPARATOR's own boolean output ("the finalize step
      loses the bit"). This record's object is a SEPARATE primitive
      downstream of that boolean, not the boolean's own correctness, and does
      not claim to discharge C-FIN.
    - >-
      IDEA-20260821-121612 measures whether the COMPARATOR's stride is well
      defined and stable across toolchain configurations for a FIXED buffer
      and call site. This record measures the coverage completeness of a
      DIFFERENT primitive at its one real call length; it reuses 121612's
      static extractor and its coverage-set definition as tools but does not
      repeat its toolchain-variance question, and 121612's confounders block
      explicitly declares the select primitive out of its own scope.
    - >-
      IDEA-20260821-25d3ca asks whether the comparison routine at the
      encapsulation modulus-check site is the SAME SYMBOL as the
      decapsulation comparison routine -- a source-level sharing census
      between two uses of ONE primitive (compare). This record concerns a
      SECOND, structurally distinct primitive (select) used once, at a
      single site, and asks about ITS coverage rather than about symbol
      sharing.
    - >-
      H-MLKEM-232843 (RQ-MLKEM-001) mutates bytes of the PRIVATE KEY dk
      (including the z field consumed by implicit rejection) and reads
      decapsulation's overall behavior as a black box, deriving a forced
      (accept-path-changes, reject-path-changes) signature per dk region.
      This record never mutates dk and treats the select's OWN COMPILED CODE
      as a white-box object; the two meet only in subject matter (both
      concern implicit rejection) and are answered by disjoint instruments.

