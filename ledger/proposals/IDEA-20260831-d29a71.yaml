idea:
  id: IDEA-20260831-d29a71
  question_id: RQ-MONO-001
  added: '2026-08-31'
  title: >-
    H-MONO-45183a's own residual_collision_risk, tested directly: does the
    m=4 factor-base root-multiplicity collision rate depend ONLY on (N,tau)
    as Part B's closed form claims, or does a CM curve's larger endomorphism
    ring produce a measurably different rate at a MATCHED (N,tau) against an
    ordinary curve -- the exceptional-family question KN-OPEN-009 asks
    verbatim, tested at the one locus where a clean, pre-registered,
    two-outcome comparison is already specified but never executed?

  class: control

  claim: >-
    H-MONO-45183a's own `proof_search_map.observation_collision.
    residual_collision_risk` names, in its own words, an explicit and
    unresolved test: "If two curves with identical (N, tau) but different
    endomorphism rings gave different measured rates, the derivation would
    be incomplete." Part B derives an EXACT closed form for the m=4 root-
    multiplicity collision rate -- 6(tau-1)/N -- as a function of (N,tau)
    ALONE, with tau = #E(F_p)[2] = Z+1, under the assumption (HEUR-COIN-1)
    that signed subset sums of independently-drawn factor-base points are
    uniform on E(F_p) to within o(1/N) relative error. This closed form
    contains NO term for the curve's endomorphism ring, CM discriminant, or
    j-invariant: it predicts that a CM curve and a generic ordinary curve
    with the SAME group order N and the SAME rational 2-torsion order tau
    collide at EXACTLY the same rate. That prediction has never been tested
    against a genuine matched pair -- H-MONO-45183a's own paired experiment
    (EXP-MONO-12ce1c) has never been executed, and even when it runs, its
    designed panel (>=2 CM curves, tau coverage in {1,2,4}) does not
    guarantee a CM curve and an ordinary curve share the SAME (N,tau) cell
    unless a matched pair is deliberately searched for and pre-registered,
    which no existing contract in this lane does.
    THIS IS THE EXACT QUESTION KN-OPEN-009 ASKS. KN-OPEN-009's own statement
    names "an exceptional family (e.g. CM curves)" with "imprimitive/smaller
    monodromy, giving curve-specific relation-rate deviations" as one of the
    two possible resolutions of the whole research question. Part A of
    H-MONO-45183a already shows the GROUP is the same ((Z/2)^{m-2}) for CM
    and ordinary curves alike (an unconditional derivation, not tested per-
    curve). What Part A's group-theoretic argument CANNOT see is whether a
    curve's finer arithmetic (its endomorphism ring, beyond what N and tau
    already encode) enters the DISTRIBUTION of which sign classes collide --
    exactly the gap Part B's own `residual_collision_risk` names and exactly
    the gap that separates "the group is uniform" (already shown) from "the
    RATE is uniform" (Part B's own untested conditional).
    DISCRIMINATION, stated as two mutually exclusive, fully decidable
    outcomes. (A) A CM curve and an ordinary curve at a matched (N,tau)
    cell show collision rates agreeing with each other, and with the closed
    form 6(tau-1)/N, within the same statistical tolerance the closed form
    already achieves on ordinary curves alone -- corroborating Part B's own
    completeness claim beyond what its own designed panel tests, and closing
    (for m=4, this construction) the specific residual risk the record's own
    audit named as open. (B) The CM curve's measured rate differs materially
    from the ordinary curve's at the SAME (N,tau) -- falsifying the
    (N,tau)-only completeness of Part B's closed form, and identifying,
    concretely and for the first time in this lane, a curve-specific
    deviation of exactly the kind KN-OPEN-009 asks about: a genuinely
    exceptional relation-rate locus tied to endomorphism-ring structure
    rather than to the group alone.

  mechanism: >-
    Reuses H-MONO-45183a's own Part B derivation (B-1 collision criterion,
    B-2 branch probabilities) and HEUR-COIN-1's sampling construction
    unmodified; the only new content is the matched-pair search and
    comparison design.
    STEP 1 (finding a genuine matched pair). At a fixed small prime p (or a
    small range of primes to widen the search), enumerate curves by trace t
    to find at least one CM curve (identified by a small, disclosed
    discriminant class -- e.g. j=0 or j=1728, or a curve with a known small
    CM discriminant, EXCLUDED from being confused with the j=0/1728
    automorphism-artifact exclusion RQ-MONO-001's own scope already names
    for RANDOM controls, but here deliberately INCLUDED as the object of
    study, not excluded as noise) and at least one generic-ordinary curve
    sharing the identical (N,tau) = (#E(F_p), Z+1) pair. This search is a
    Stage-0, near-zero-compute step (curve construction and point-counting
    at toy p is cheap) and its OUTCOME -- whether such a pair exists at all
    within a declared prime range -- is itself a reportable, falsifiable
    fact, not assumed in advance.
    STEP 2 (the collision-rate measurement, unmodified from Part B). For
    each of the two matched curves, construct a factor base by the
    identical declared sampling construction HEUR-COIN-1 specifies
    (independent uniform x-coordinate draws, or the fixed-sign/random-sign
    convention already used in this lane's other MONO experiments), draw
    admissible m=4 tuples, and measure the empirical root-multiplicity
    collision rate exactly as Part B's own predictions (G6, G7 in
    H-MONO-45183a) already specify: exactly 0 collisions if tau=1, and a
    rate matching 6(tau-1)/N if tau>1, at the same sample-size floor
    (>=20,000 admissible tuples per curve) that record's own test_boundary
    already commits to.
    STEP 3 (the direct comparison). Compare the two curves' measured
    collision rates directly against EACH OTHER (not merely each against
    the shared closed form independently), using a two-sample test at the
    same sample sizes, since the comparison of interest is curve-to-curve
    agreement, which is a strictly stronger and more direct test than each
    curve independently agreeing with a formula that does not depend on
    endomorphism ring by construction.
    STEP 4 (a second matched pair as a replication, if a search at a second
    prime succeeds). Repeat Steps 1-3 at a second prime to check that any
    observed agreement or disagreement is not an artifact of the single
    tested (N,tau) cell.
    WHY THIS IS A LOSSY, GENUINELY DISCRIMINATING PROJECTION. The tracked
    object is the collision-rate scalar per curve, discarding everything
    about the curve except its measured m=4 root-multiplicity rate. This
    is compatible with the target's operations because the rate is exactly
    what Part B's derivation already isolates as the quantity of interest;
    it is genuinely lossy (an enormous space of distinct curves collapses to
    one number) and, crucially, it is NOT a change of coordinates precisely
    because the closed form 6(tau-1)/N asserts that this lossy quantity is
    determined by (N,tau) alone -- if the CM curve's endomorphism ring
    additionally moves the rate, the projection is shown to be TOO lossy
    (it discarded something the target's actual behavior needs), which is
    exactly the falsifiable content of this idea.

  novelty_status: adaptation
  novelty_status_note: >-
    Grepped ledger/proposals/ and ledger/hypotheses/ for "endomorphism ring"
    combined with "collision"/"matched" and for "CM" combined with "tau";
    found no existing proposal or hypothesis that executes this specific
    matched-(N,tau) CM-vs-ordinary comparison. H-MONO-45183a's own text names
    the risk explicitly but its own paired experiment (EXP-MONO-12ce1c,
    never executed) does not design a matched-pair search for it, and the
    only other proposal touching EXP-MONO-12ce1c's territory this session
    (IDEA-20260830-d84f6a) explicitly disclaims covering Part B's collision-
    rate content at all ("Part B (root-multiplicity/collision rates) is
    untouched by this record... no collision-rate measurement is proposed
    here"). The collision-rate derivation and sampling construction are
    entirely inherited from H-MONO-45183a Part B; this idea's only new
    content is the matched-pair search design and the direct curve-to-curve
    comparison it enables. Labelled `adaptation`.

  citations:
    - ref: H-MONO-45183a
      provenance: internal
      claim: >-
        Part B's exact closed form for the m=4 collision rate, 6(tau-1)/N,
        as a function of (N,tau) alone; the explicit
        `residual_collision_risk` naming this idea's exact test as open
        ("If two curves with identical (N, tau) but different endomorphism
        rings gave different measured rates, the derivation would be
        incomplete"); HEUR-COIN-1's sampling construction and its own
        disclosed gap (drawn x-coordinates with a deterministic sign rule
        rather than points uniform on E(F_p)); predictions G6/G7 and their
        stated sample-size floor (>=20,000 admissible tuples per curve);
        the curve panel design (>=2 CM curves, tau coverage in {1,2,4}) which
        does NOT itself guarantee a matched-(N,tau) CM/ordinary pair exists
        in the panel.
      verified_by: idea-generator (this session, read in full)
    - ref: KN-OPEN-009
      provenance: internal
      claim: >-
        States the research question's own two-sided framing, explicitly
        naming "an exceptional family (e.g. CM curves)" with "imprimitive/
        smaller monodromy, giving curve-specific relation-rate deviations"
        as one live resolution, and requiring any exceptional-curve claim to
        exclude j=0/1728 automorphism artifacts from RANDOM controls -- a
        constraint on controls, not on the object of study itself, which
        this idea respects by treating the CM curve as the deliberate
        object under test rather than as noise to exclude.
      verified_by: idea-generator (this session, read in full)
    - ref: IDEA-20260830-d84f6a
      provenance: internal
      claim: >-
        Explicitly disclaims proposing any Part B collision-rate
        measurement, confirming this idea does not duplicate that record's
        scope (which instead covers the j=0/j=m-1 splitting parity law and a
        quadratic-twist cost identity for the j=m-1 locus).
      verified_by: idea-generator (this session, read in full)

  assumptions:
    - >-
      A matched-(N,tau) CM/ordinary pair exists at an affordable toy prime
      (or small range of primes); this is a search outcome, not assumed --
      Stage 0's own falsification condition covers the case where no such
      pair is found within the declared search range.
    - >-
      The CM curve is identified by a small, disclosed discriminant (or by
      j in {0, 1728}, the two smallest and most easily constructed CM cases
      at toy primes, DELIBERATELY INCLUDED here as the object of study,
      never excluded as an automorphism artifact the way RQ-MONO-001's scope
      excludes them from random controls).
    - >-
      HEUR-COIN-1's sampling construction (independent x-coordinate draws
      with a deterministic sign convention) is reused unmodified; any
      convention-dependence this reveals is reported per that heuristic's
      own falsification condition, not treated as a defect specific to this
      idea's design.
    - >-
      m=4 only, prime fields only, non-singular short-Weierstrass curves;
      no claim beyond this exact construction.

  proof_search_map:
    bottleneck: >-
      Whether the m=4 collision rate depends on anything beyond (N,tau) --
      the single unresolved conditional H-MONO-45183a's own audit names.
      Part A's group-theoretic uniformity (already established, unconditional)
      does not decide this; only a direct curve-to-curve measurement at a
      genuinely matched (N,tau) cell can.
    baseline_embedding:
      parameter_slice: >-
        H-MONO-45183a's own already-specified predictions G6 (tau=1 curves,
        rate exactly 0) and G7 (tau=2,4 curves, rate 6/N, 18/N) are the exact
        parameter slice this idea's Step 2 must reproduce, independently, on
        BOTH matched curves, before the Step 3 direct comparison is
        interpreted.
      reproduction_check: >-
        Each of the two matched curves must independently reproduce its own
        G6/G7-predicted rate (0 collisions if tau=1; 6(tau-1)/N within 3
        binomial standard errors otherwise) using the SAME sampling code as
        this idea's own Step 2, before the curve-to-curve comparison in
        Step 3 is read.
    observation_collision:
      observable: >-
        The measured m=4 root-multiplicity collision rate, as a function of
        the curve.
      distinct_preimage_search: >-
        THIS IS THE ENTIRE POINT OF THE RECORD, STATED AS ITS OWN COLLISION
        SEARCH RATHER THAN DISCOVERED INCIDENTALLY: Part B's closed form
        claims the collision-rate observable has (N,tau) as a SUFFICIENT
        preimage-determining pair -- i.e., it predicts NO collision (a CM
        curve and an ordinary curve at the same (N,tau) are, for this
        observable, indistinguishable). This idea searches for exactly the
        pair that would refute that: two curves with identical (N,tau) and
        DIFFERENT endomorphism rings. If found and their rates agree, the
        prediction survives a genuine test it had not yet faced; if their
        rates disagree, the observable is shown to be less lossy than Part B
        claimed, and the discarded information (endomorphism ring) is shown
        to matter.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (N,tau) fixed and vary the forgotten structure
          (endomorphism ring / CM discriminant), directly testing whether an
          intrinsic curve invariant beyond (N,tau) separates the resulting
          collision rates.
        predicted_gain: >-
          If a separation is found, it identifies -- concretely, for the
          first time in this lane -- an exceptional-family effect of exactly
          the kind KN-OPEN-009 asks about, at the specific locus (m=4 root-
          multiplicity, not cycle type) where H-MONO-45183a Part A's own
          cycle-type observable is already known to be constant and
          therefore uninformative (EV-MONO-a0a89c OBS-5/OBS-6, cited in
          H-MONO-663fb4's own mechanism as the reason a different statistic
          was needed on that sublocus).
    quantifier_order: >-
      THERE EXISTS a matched pair (E_CM, E_ord) with identical (N,tau) and
      distinct endomorphism rings, at a prime within the declared search
      range, SUCH THAT their measured m=4 collision rates AGREE (or,
      falsifying the closed form, DISAGREE) within the stated statistical
      tolerance. This is a bounded existential over one matched pair (plus a
      replication pair, if found); it can falsify the (N,tau)-only
      completeness claim outright with a single confirmed disagreement, but
      a single agreeing pair does not prove completeness for every possible
      pair, only for the tested one.
    method_ceiling:
      strongest_certifiable_claim: >-
        Whether ONE matched (N,tau) CM/ordinary pair (and its replication,
        if a second is found) shows agreeing or disagreeing m=4 collision
        rates, at toy scale. Cannot certify the closed form's completeness
        for every possible curve or CM discriminant; cannot certify anything
        about m != 4, about extension fields, or about any cost or exponent
        claim.
      nearby_object_control: >-
        The already-specified tau=1 curve (predicted rate exactly 0,
        regardless of endomorphism ring) is the built-in nearby-object
        control: BOTH the CM and ordinary members of a tau=1 matched pair
        must show exactly 0 collisions, which is the sharpest possible
        agreement test (an exact-zero prediction, not a statistical band)
        and must be checked before any tau>1 pair's statistical agreement is
        trusted.
    proof_obligations:
      - claim: >-
          A matched-(N,tau) CM/ordinary pair is found (or its absence within
          the search range is reported as a specific, bounded negative).
        responsibility: feasibility
      - claim: >-
          Each matched curve independently reproduces its own G6/G7-
          predicted rate before the curve-to-curve comparison is read.
        responsibility: baseline
      - claim: >-
          The two matched curves' measured rates are compared directly, at
          the same sample size, using a two-sample test.
        responsibility: correctness
      - claim: >-
          A tau=1 matched pair (if found) shows exactly 0 collisions on
          BOTH curves.
        responsibility: strictness
      - claim: >-
          Nothing here transfers beyond m=4, this curve family, or toy
          scale, and no ECDLP or cost claim is made in either direction.
        responsibility: scope

  predictions:
    - metric: >-
        existence of a matched-(N,tau) CM/ordinary pair within a declared
        toy-prime search range
      direction: different
      minimum_effect: >-
        At least one pair found within a search range of, e.g., the first
        50-100 primes above a stated floor (Deuring's class-number formula
        makes matched pairs expected but not guaranteed at any specific
        small prime, per this idea's own H2 below); non-existence within
        the declared range is reported as an instrument-outcome/negative,
        not as evidence for either direction of the main claim.
    - metric: >-
        collision rate on the tau=1 matched pair (if found), both curves
      direction: lower
      minimum_effect: >-
        EXACTLY 0 collisions on BOTH curves, over >=20,000 admissible
        tuples each. A nonzero count on either curve falsifies Part B's own
        G6 prediction independent of this idea's own comparison question.
    - metric: >-
        collision rate difference between the CM curve and the ordinary
        curve at a matched tau>1 (N,tau) cell
      direction: different
      minimum_effect: >-
        PRE-REGISTERED, TWO-SIDED. Predicted agreement within 3 combined
        binomial standard errors of each other AND of the shared closed
        form 6(tau-1)/N. A difference exceeding that band, with the
        tau=1 nearby-object control passing on both curves, is the single
        most consequential possible outcome: a genuine, curve-specific
        (endomorphism-ring-linked) relation-rate deviation, exactly the
        exceptional-locus finding KN-OPEN-009 asks about.
    - metric: >-
        replication at a second matched pair (if a second prime's search
        succeeds)
      direction: same
      minimum_effect: >-
        The first pair's qualitative finding (agreement or disagreement)
        reproduces at the second pair; a reversal between the two pairs
        indicates the effect (if any) is not a stable property of "CM vs
        ordinary" alone and must be reported as such rather than averaged
        away.

  minimal_test:
    design: >-
      Stage 0 (near-zero compute, hard gate): search a declared range of toy
      primes for a matched-(N,tau) CM/ordinary pair (CM identified by
      j in {0,1728} or a small disclosed discriminant), reporting the search
      outcome explicitly (found, at which prime and (N,tau); or not found
      within the range, reported as a bounded negative).
      Stage 1 (independent reproduction): on each matched curve
      independently, draw >=20,000 admissible m=4 tuples via HEUR-COIN-1's
      declared construction and reproduce that curve's own G6/G7-predicted
      rate.
      Stage 2 (the direct comparison): compare the two curves' measured
      rates via a two-sample test (e.g. a permutation test on the difference
      of collision counts, matching this lane's own established permutation-
      test discipline and its floor-vs-threshold check per KN-TECH-95a42b)
      at the same sample size on both curves.
      Stage 3 (replication, if feasible): repeat Stages 0-2 at a second
      prime if a second matched pair is found within budget.
    controls:
      - "Stage 0 search-outcome disclosure (found/not-found), never silently assumed."
      - "Stage 1 independent reproduction of G6/G7 on each curve, hard gate before Stage 2."
      - "tau=1 exact-zero nearby-object control, both curves, if a tau=1 matched pair is found."
      - "Floor-vs-threshold check (KN-TECH-95a42b) on the Stage 2 two-sample test before any run."
    required_metrics:
      - matched-pair search outcome and the (N,tau) cell found, if any
      - per-curve collision count and rate, both matched curves, every tested pair
      - two-sample test statistic and p-value for the curve-to-curve comparison
      - replication outcome at a second pair, if found

  falsification_conditions:
    - "No matched-(N,tau) CM/ordinary pair found within the declared search range (reported as a bounded negative/instrument outcome, not evidence for either direction of the main claim)."
    - "Either matched curve fails to reproduce its own G6/G7-predicted rate independently (halts the comparison; the implementation, not the main claim, is suspect)."
    - "A tau=1 matched pair (if found) showing any nonzero collision on either curve."
    - "The CM and ordinary curves' rates disagreeing beyond the stated statistical tolerance at a matched tau>1 cell, with the tau=1 control (if available) passing -- this is the record's single most consequential possible outcome and must be reported as the headline finding, not absorbed."
    - "A reversal of the qualitative finding between two replication pairs (if a second pair is found), reported explicitly rather than averaged."

  confounders:
    - >-
      SMALL-PRIME CM SCARCITY. Matched-(N,tau) pairs are not guaranteed to
      exist at any specific small prime; the search range must be declared
      before the search runs, and a null search result is a genuine, bounded
      negative outcome, not a failure of this idea.
    - >-
      SAMPLING-CONVENTION DEPENDENCE (INHERITED FROM HEUR-COIN-1). The
      collision rate is measured under a specific x-coordinate-draw-plus-
      deterministic-sign convention; both matched curves must use the
      IDENTICAL convention so any observed difference is attributable to the
      curves, not to a convention mismatch.
    - >-
      j=0/1728 AS BOTH THE MOST CONVENIENT CM CONSTRUCTION AND A KNOWN
      AUTOMORPHISM-ARTIFACT LOCUS. This idea deliberately studies j=0/1728
      as the object of interest rather than excluding it (as RQ-MONO-001's
      own scope requires for RANDOM controls); any observed effect must be
      checked against the possibility that it is an automorphism-count
      artifact (extra automorphisms changing the effective sampling measure)
      rather than a genuine endomorphism-ring/CM effect, and a non-j=0/1728
      CM discriminant is a valuable, disclosed follow-up if the search range
      permits finding one.
    - >-
      SAMPLE SIZE AT THE MATCHED-PAIR TAU>1 CELL. 20,000 tuples per curve
      (this lane's own established floor) may not be enough to distinguish a
      SMALL endomorphism-ring effect from noise; a null result at this
      sample size is reported as bounded to that budget, not as ruling out a
      smaller effect at larger sample sizes.

  interpretation_limits:
    - "CLAIM TIER toy for every measurement; Part B's closed form remains a derivation, cited as such."
    - "NO ECDLP CLAIM OF ANY KIND, in either direction. Any cover-sourced deviation, per H-MONO-45183a's own C3/C4, is bounded and cannot change any collection cost by more than a 1+O(1/p) factor even if found."
    - "m=4 ONLY; nothing here addresses other arities or extension fields."
    - >-
      A found disagreement identifies a curve-specific relation-rate
      deviation at TOY SCALE for ONE tested pair; it does not by itself
      characterize the full exceptional family, its size, or its
      cryptographic relevance -- those would be named forward guidance for a
      successor record, not concluded here.
    - "NO STATUS CHANGE to H-MONO-45183a or any other record is proposed or implied (Coordinator authority alone, AGENTS.md rule 1)."

  heuristic_assumptions:
    - id: H1
      statement: >-
        HEUR-COIN-1, inherited unmodified: signed subset sums of
        independently-drawn factor-base points are uniform on E(F_p) to
        within o(1/N) relative error, so P(signed subset sum in E[2]) =
        tau/N at leading order for BOTH matched curves under the identical
        sampling construction.
      rigorous_support: >-
        Exact for independent uniform points on the group (classical fact:
        a sum of independent uniforms on a finite abelian group is uniform);
        the gap, as H-MONO-45183a's own text already states, is that the
        actual construction draws x-coordinates and applies a deterministic
        sign rule rather than drawing points uniformly on E(F_p), an
        expected-but-unproven O(1/N)-relative first-order effect.
      validation_plan: >-
        Reused unmodified from H-MONO-45183a's own validation plan for
        HEUR-COIN-1; this idea adds no new test of this heuristic beyond
        running it identically on two curves instead of one.
      falsification_condition: >-
        Inherited unmodified: the fixed-sign and random-sign sampling arms
        disagreeing by more than the forced value's standard error at
        either matched curve.
    - id: H2
      statement: >-
        A matched-(N,tau) CM/ordinary pair exists within a declared search
        range of toy primes, expected (but not guaranteed) by Deuring's
        class-number correspondence between traces and isomorphism classes.
      rigorous_support: >-
        Deuring's theory makes the EXISTENCE of curves with a given trace
        (hence a given N) at a given prime a class-number-governed count,
        which grows with p; whether a SPECIFIC small-discriminant CM curve
        and a specific ordinary curve share the exact same trace at any
        particular small prime is a combinatorial coincidence this idea's
        Stage 0 search either finds or does not, and is not guaranteed by
        the general theory for any single small prime.
      validation_plan: >-
        SAMPLE: search a declared range of toy primes (e.g. the first 100
        primes above 100) directly by enumeration for a matching (N,tau)
        cell containing both a j in {0,1728} curve and an ordinary curve;
        report the smallest prime at which a match is found, or report
        exhaustively that none was found in the range.
      falsification_condition: >-
        Not independently falsifiable as a heuristic (it is a search
        outcome); its "failure" is simply the reported absence of a match
        within the declared range, which is itself the honest, reportable
        result of Stage 0.

  target_complexity:
    time_exponent: "NOT APPLICABLE; no algorithm or attack is proposed."
    memory_exponent: >-
      O(1) beyond the per-curve tuple-sampling state already used by this
      lane's existing Part B measurements; well under 1GB at the declared
      sample sizes.
    best_known: "Not applicable; no ECDLP complexity claim of any kind."
    hidden_overhead: >-
      None hidden; the matched-pair search cost is disclosed as a Stage 0
      step whose cost scales with the declared prime range and is reported
      explicitly, including a non-find outcome.
    tradeoff_note: not applicable.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: high

  priority_rationale: >-
    This is the single proposal in this batch most directly aimed at
    RQ-MONO-001's own decision target as stated verbatim in KN-OPEN-009: an
    exceptional-family (CM-curve) test at a locus (m=4 root-multiplicity,
    not cycle type) explicitly known to be non-degenerate where the cycle-
    type instrument is already known to be constant (EV-MONO-a0a89c
    OBS-5/OBS-6). It is named as an explicit, unresolved audit item in an
    already-supported hypothesis's own proof_search_map, is cheap (reuses
    existing sampling machinery entirely), and has two genuinely informative
    outcomes: a clean corroboration of an already-claimed completeness
    result, or the first concrete exceptional-locus finding in this entire
    lane. Ranked HIGH despite carrying no exponent claim, because a positive
    (disagreeing) outcome would be the most consequential single result this
    lane could currently produce, and because the required test was already
    identified as missing by the record's own authors rather than invented
    here.

