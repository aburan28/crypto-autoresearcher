idea:
  id: IDEA-20260807-464ff8
  question_id: RQ-PAIR-21313f
  added: '2026-08-07'
  title: >-
    THE CM ENDOMORPHISM IS NOT A DISTORTION MAP, AND THE EXCEPTION IS EXACTLY
    CHARACTERISED - on an ordinary prime-field curve every geometric
    endomorphism commutes with Frobenius and therefore preserves the rational
    N-torsion eigenline, so phi acts on G as a scalar lambda and
    e_N(P, phi(P)) = e_N(P,P)^lambda = 1 for every phi and every P; the single
    case in which the argument does not apply is pi acting as a scalar on the
    whole of E[N], which forces E[N] subset E(F_p), hence N | p-1 (embedding
    degree 1) AND N^2 dividing the group order, a pair of conditions no
    cryptographic curve satisfies
  class: mechanism

  claim: >-
    (A) THE QUESTION THIS LANE MUST ANSWER FIRST. A distortion map for the
    cryptographic subgroup G = <P> of order N would be an endomorphism psi with
    psi(P) not in <P>. It is the whole reason supersingular curves are
    pairing-friendly, because it converts the identically trivial Weil
    self-pairing into the non-degenerate modified pairing e(P, psi(P)). The
    campaign's admissibility filter (DECOMPOSITION.md section 2, H-ENDO-001)
    says every endomorphism acts on a prime-order subgroup as a scalar. This
    proposal turns that statement into a complete, quantified closure for the
    pairing route, and - the part that is not already on the record - it
    characterises the exact hypothesis under which the argument runs and what
    curve would have to look like for it to fail.

    (B) THE ARGUMENT, IN FOUR STEPS, EACH ELEMENTARY.
    (B1) E/F_p ordinary means End_{F_p-bar}(E) tensor Q is an imaginary
    quadratic field, hence End_{F_p-bar}(E) is a COMMUTATIVE ring - an order O
    in K = Q(sqrt(D)), D = t^2 - 4p. This is the Deuring ordinary/supersingular
    dichotomy and it is the only external input.
    (B2) The Frobenius pi lies in O. Commutativity gives psi.pi = pi.psi for
    EVERY psi in O, including endomorphisms that are a priori only defined over
    an extension. Therefore psi maps ker(pi - 1) into ker(pi - 1).
    (B3) G = E[N] intersect ker(pi - 1). If pi is NOT the scalar 1 on E[N],
    this kernel is cyclic of order N, so psi restricted to G is an endomorphism
    of a cyclic group of prime order, i.e. multiplication by some
    lambda_psi in Z/N. In particular psi(P) IS in <P>: no distortion map exists.
    (B4) The Weil pairing is alternating, e_N(P,P) = 1. Hence
    e_N(P, psi(P)) = e_N(P, [lambda_psi]P) = e_N(P,P)^{lambda_psi} = 1,
    identically, for every psi in O and every P in G. The CM endomorphism phi,
    the GLV endomorphism, and every element of the order all give 1.

    (C) THE EXCEPTIONAL CASE, STATED EXACTLY - THIS IS THE INCREMENT.
    Step (B3) needs pi to be non-scalar on E[N]. The only way (B2) fails to
    pin psi down is pi acting as a scalar c on E[N]. Since G is non-zero and
    G is contained in ker(pi - 1), that scalar must be c = 1, i.e.
    E[N] is contained in E(F_p) - the FULL N-torsion is rational. Two
    consequences follow immediately from the Weil pairing and from Lagrange:
    E[N] subset E(F_p) forces mu_N subset F_p, i.e. N | p - 1, i.e. EMBEDDING
    DEGREE 1; and it forces N^2 to divide the group order. A curve used for
    ECDLP has group order h.N with h small and N^2 not dividing it, so the
    exception is unreachable there. Note also that pi non-semisimple with
    eigenvalue 1 (the Jordan-block case, possible when p = 1 mod N but E[N] not
    rational) is NOT an exception - ker(pi - 1) is still one-dimensional and
    (B3) still runs. So the exception is precisely "full rational N-torsion",
    not merely k = 1.

    (D) WHAT THIS DOES AND DOES NOT CLOSE. It closes, unconditionally and with
    no heuristic, the entire family "compose the Weil pairing with an
    endomorphism of E to obtain a self-pairing on G computable from one point".
    It does NOT close the Tate self-pairing, which is not alternating and which
    IDEA-20260807-30868b handles by a different argument; it does not close
    pairings between G and a subgroup of E(F_{p^k}) not equal to G, which IS
    the classical MOV/Frey-Ruck transfer and needs a second point; and it says
    nothing about supersingular curves, where End is a quaternion order,
    non-commutative, and (B2) fails at its first line - which is exactly why
    distortion maps exist there.

  resource_label: >-
    R7 (pairings into F_{p^k}) nominally, composed with R3 (End(E) as a ring).
    The finding of this record is that the composition annihilates the R7
    escape and returns the mechanism to the closed R3-on-G regime.
  admissibility: inadmissible_generic_group
  admissibility_argument: >-
    The pairing itself is a genuine non-generic resource - it maps G into a
    different group, and KN-FIND-b7e091 does not cover it. But the proposed
    mechanism uses phi ONLY by applying it to points of G, which is the exact
    pattern DECOMPOSITION.md section 2 declares inadmissible on its face. The
    composite e(P, phi(P)) collapses through H-ENDO-001's scalar action to
    e(P,P)^lambda, and the Weil pairing kills it. So the R7 escape is real and
    the R3 step re-enters the generic regime and destroys it. Filed as a
    recorded closure with the obstruction named, per the brief's rule 1.

  discriminated_from:
    - >-
      ledger/FINDING-PF-IC-001.md "ordinary lift gate" (lines 1927-1932 and the
      producer disposition at line 1957, reconstructed by an independent audit
      at line 2004). That record already states "when the rational and second
      N-torsion Frobenius eigenvalues are distinct, every geometric
      endomorphism of an ordinary elliptic curve commutes with Frobenius and
      preserves the rational eigenline. It cannot provide the distortion lift".
      This proposal DUPLICATES that argument and says so. What it adds: (i) the
      eigenvalue-distinctness hypothesis is not left as a hypothesis but is
      characterised - it fails exactly when E[N] is contained in E(F_p), which
      forces N | p-1 and N^2 dividing the group order; (ii) the Jordan-block
      sub-case is handled, which "distinct eigenvalues" leaves out; (iii) it is
      filed as a first-class ledger record under the GOAL-ENDO-001 resource
      taxonomy with an admissibility verdict, rather than as a producer
      disposition inside a finding document.
    - >-
      H050 (inputs/h100_session/HYPOTHESES_100.md line 337, reviewed sound at
      ledger/REVIEW-H100-20260717.md line 146). H050 kills self-pairings on
      generic E in one sentence "by embedding-degree arguments". That is the
      right conclusion with the wrong reason for THIS family - the Weil
      self-pairing is trivial for reasons that have nothing to do with the
      embedding degree (it is alternating), and the endomorphism route dies on
      commutativity, not on k. Making the two arguments distinct matters
      because they have different exceptional cases.
    - >-
      KN-TECH-032 / KN-LIT-084 / KN-LIT-085 (MOV, Frey-Ruck). Those pair TWO
      independent points and are governed by k. This record is about ONE point
      and is governed by commutativity of End. Explicitly NOT the classical
      transfer.
    - >-
      H-SPR-71a843 and IDEA-20260806-b7fdc3, which study isogeny-compatible
      self-pairings on ORIENTED SUPERSINGULAR curves and explicitly declare
      plain prime-field ECDLP out of their scope. Disjoint setting.
    - >-
      KN-LIT-1622 (Andrusov et al. 2026, distortion maps for elliptic curves
      over finite fields) and Charles, "On the existence of distortion maps on
      ordinary elliptic curves", IACR ePrint 2006/128 (abstract verified by web
      fetch on 2026-08-07). Charles's abstract states that "in most cases there
      are no distortion maps for the Frobenius eigenspaces" for ordinary curves
      and that the paper characterises the remaining cases. THE PAPER'S EXACT
      CHARACTERISATION WAS NOT READ - the PDF could not be rendered in this
      environment - so the claim that its exceptional set coincides with (C) is
      marked [open] in assumptions and is a Stage-0 obligation, not a result.

  object_first_candidate:
    tracked_object: >-
      The RATIONAL FROBENIUS EIGENLINE ker(pi - 1) inside E[N], followed under
      the action of the endomorphism ring O = End(E).
    lossiness: >-
      Genuinely lossy. E[N] is a two-dimensional F_N-vector space; the tracked
      object retains one line and discards the complementary eigenline
      ker(pi - q) entirely, along with every point outside E[N]. It is not a
      change of coordinates: the discarded eigenline carries exactly the
      information a distortion map would need, and it cannot be recovered from
      the retained line by any F_p-rational operation.
    propagation: >-
      Deterministic, and this is the load-bearing point. What is discarded is
      discarded COMPATIBLY with the operation set - because O is commutative
      and contains pi, every psi in O maps the retained line into itself. So
      the retained part propagates by a scalar and never mixes with what was
      thrown away. The projection passes the lossy-projection test as a valid
      object and then immediately shows the object is a fixed point of the
      whole operation set, which is why the lane closes rather than opens.
    survival_score: >-
      Survives every endomorphism, every isogeny defined over F_p, and every
      choice of P in G. Dies at exactly two boundaries, both nameable: E
      supersingular (End non-commutative, (B2) fails at line one), and
      E[N] contained in E(F_p) (pi scalar on E[N], the retained line becomes
      the whole space and there is nothing left to discard).

  mechanism: >-
    STEP 1 - WRITE THE ARGUMENT (zero compute). Produce (B1)-(B4) and (C) as a
    two-page derivation with the quantifier order explicit, naming Deuring's
    dichotomy as the single external input and marking it as textbook-standard
    but not transcribed into this corpus.
    STEP 2 - STAGE-0 LITERATURE OBLIGATION. Obtain Charles ePrint 2006/128 in a
    readable form and record its exact exceptional-case characterisation in a
    new knowledge/literature note. Two outcomes, both useful - it agrees with
    (C), in which case this record's increment is a re-derivation and should be
    downgraded to a corpus transcription; or it differs, in which case one of
    the two is wrong and finding out which is the deliverable.
    STEP 3 - MECHANICAL VERIFICATION AT TOY SCALE (low compute, uses the
    instrument of IDEA-20260807-e7eb5d). For toy ordinary curves whose group
    order is exactly divisible by N and with k > 1, enumerate the small-norm
    elements of O = Z[pi] (multiplication by m, and pi itself, which is the CM
    endomorphism available with no additional machinery on any curve), evaluate
    psi(P), and check two things numerically - that psi(P) = [lambda]P for a
    recovered lambda, and that e_N(P, psi(P)) = 1. Report the recovered lambda
    alongside the eigenvalue predicted by the characteristic polynomial of pi
    mod N, which for psi = pi must be lambda = 1 exactly.
    STEP 4 - THE EXCEPTION, CONSTRUCTED (low compute). Search toy p for an
    ordinary curve with E[N] contained in E(F_p) for a small prime N - i.e.
    N | p-1 and N^2 dividing the group order - and verify on it that (B3)
    genuinely fails, that some endomorphism moves P off <P>, and that a
    non-trivial self-pairing appears. If the exception cannot be exhibited, the
    closure is UNCONTROLLED and must be reported as such, because a closure
    whose exceptional case cannot be produced has not been shown to be a real
    boundary.

  novelty_status: duplicate
  novelty_screen:
    method: >-
      Run 2026-08-07 in /home/user/crypto-autoresearcher. Grep over ledger/,
      knowledge/, docs/, analysis/, ideas/, inputs/ for "distortion",
      "self-pairing", "eigenline", "H050", "Frobenius eigenspace",
      case-insensitive, plus a targeted read of knowledge/techniques/
      KN-TECH-032.md, knowledge/literature/KN-LIT-1622.md, KN-LIT-7489.md,
      ledger/hypotheses/H-SPR-71a843.yaml, ledger/REVIEW-H100-20260717.md and
      ledger/FINDING-PF-IC-001.md. Web search for Charles ePrint 2006/128,
      abstract fetched and quoted.
    results: >-
      The argument is ALREADY IN THIS REPOSITORY, twice. (1)
      ledger/FINDING-PF-IC-001.md carries it as the "ordinary lift gate", first
      as an UNREVIEWED_SCOPED_GEOMETRIC_NO_GO and then as an
      INDEPENDENTLY_VERIFIED_SCOPED_NO_GO with the eigenline gate
      reconstructed. (2) H050 kills the same family in one line, reviewed
      "sound" on 2026-07-17. Externally, Charles ePrint 2006/128 is the
      standing published treatment and KN-LIT-1622 (2026) revisits it. Nothing
      here is new mathematics.
    verdict: >-
      DUPLICATE. Filed anyway, deliberately and per the brief's rule 1 and the
      task's explicit instruction, because (i) the campaign requires each lane
      to record its obstruction under the R1-R8 taxonomy with an admissibility
      verdict, and neither prior record does that; (ii) the exceptional-case
      characterisation in (C) is not present in either prior record; and (iii)
      a closure that exists only inside a producer disposition string is not
      retrievable by the next lane that needs it.

  null_object_control: >-
    MANDATORY AND BLOCKING, and for a closure the null runs in the opposite
    direction from usual - the instrument must be shown capable of DETECTING a
    distortion map where one exists, or "we found none" means nothing.
    POSITIVE CONTROL (matched object of the same shape): the supersingular
    curve y^2 = x^3 + x over F_p with p = 3 mod 4, whose distortion map
    psi(x,y) = (-x, i.y) with i^2 = -1 in F_{p^2} is textbook. On it the
    identical pipeline MUST return e_N(P, psi(P)) not equal to 1. If it does
    not, every negative in this record is an instrument artifact.
    DECAY PARAMETER: the dimension of the pi-eigenspace containing G, which is
    1 for ordinary curves whose group order is exactly divisible by N, and 2 in
    the exceptional case and on supersingular curves where pi^2 = -p acts with
    a repeated eigenvalue on E[N] over F_{p^2}. As that dimension DROPS from 2
    to 1 the non-trivial self-pairing must vanish EXACTLY, not gradually. Any
    curve reported with eigenspace dimension 1 and a non-trivial self-pairing
    is an instrument failure, and the first thing to check is the final
    exponentiation.

  assumptions:
    - >-
      [textbook, not transcribed in this corpus] Deuring's dichotomy - for
      E/F_p ordinary, End_{F_p-bar}(E) is an order in an imaginary quadratic
      field, hence commutative; for E supersingular it is a maximal order in a
      quaternion algebra. Everything in (B) rests on this one sentence. A
      KN-LIT transcription is owed before this record is promoted.
    - >-
      [open] That Charles ePrint 2006/128's characterisation of the remaining
      cases coincides with (C). The abstract was verified verbatim; the theorem
      statements were NOT read (PDF rendering unavailable). Stage 0 resolves
      this and the record must not be cited as agreeing with Charles until it
      does.
    - >-
      N is an odd prime distinct from p, the group order is exactly divisible
      by N, and E is ordinary. Every statement is scoped to that; supersingular
      and anomalous curves are handled elsewhere (KN-TECH-033).

  proof_search_map:
    bottleneck: >-
      Step (B2) - the claim that every geometric endomorphism commutes with
      Frobenius. Remove it and nothing else in the argument survives. It is
      also the exact step that fails on supersingular curves, which is why the
      two cases have opposite answers.
    baseline_embedding:
      parameter_slice: >-
        The supersingular slice. Setting End(E) to a quaternion order and
        keeping every other line of the argument must REPRODUCE the known
        positive - distortion maps exist and e(P, psi(P)) is non-degenerate.
      reproduction_check: >-
        Symbolic, plus the numerical positive control above on
        y^2 = x^3 + x over F_p with p = 3 mod 4. An argument that also
        "proves" no distortion map on a supersingular curve proves too much
        and is void.
    observation_collision:
      observable: >-
        The scalar lambda_psi in Z/N by which psi acts on G, together with the
        value e_N(P, psi(P)).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED - many distinct endomorphisms share
        one lambda (all psi congruent modulo the ideal (N, pi - 1) do). That
        collision is not a defect; it is the content. It says the pairing
        observable retains only one residue of the whole endomorphism ring, and
        therefore that no amount of endomorphism cleverness can enlarge the
        observable. Recording the collision explicitly is what upgrades "we
        tried some endomorphisms" to "the observable cannot separate them".
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the scalar lambda_psi with the full pair
          (lambda on ker(pi-1), mu on ker(pi-q)) - the action on BOTH
          eigenlines. This retains strictly more state and is what a distortion
          map would exploit.
        predicted_gain: >-
          None for the attacker, and that is the point: the second coordinate
          mu is NOT computable from F_p-rational data on G, because
          ker(pi - q) is not rational. The transform is stated so that the
          record shows the stronger invariant was considered and dismissed for
          a reason, not overlooked.
    quantifier_order: >-
      Intended and claimed - FORALL primes p > 3, FORALL ordinary E/F_p,
      FORALL odd primes N exactly dividing the group order and distinct from p,
      FORALL psi in End_{F_p-bar}(E), FORALL P in G of order N -
      e_N(P, psi(P)) = 1.
      The dangerous weaker reading, NOT claimed - FORALL psi EXISTS P. The
      argument gives the strong order because lambda_psi does not depend on P.
    method_ceiling:
      strongest_certifiable_claim: >-
        "No endomorphism of an ordinary prime-field curve yields a non-trivial
        WEIL self-pairing on the cryptographic subgroup." It certifies nothing
        about the Tate self-pairing, nothing about pairings with a second
        independent point, nothing about correspondences that are not
        endomorphisms of E, and nothing about the hardness of ECDLP.
      nearby_object_control: >-
        Two, and both must behave differently or the argument has not located
        the load-bearing structure. (i) The supersingular curve, where the
        desired conclusion FAILS and must be seen to fail. (ii) An ordinary
        curve with E[N] contained in E(F_p), where (B3)'s hypothesis fails and
        the conclusion must again fail.
    proof_obligations:
      - claim: End of an ordinary curve is commutative and contains pi.
        responsibility: correctness
      - claim: pi non-scalar on E[N] implies ker(pi-1) cap E[N] is cyclic of order N.
        responsibility: correctness
      - claim: The Weil pairing is alternating.
        responsibility: correctness
      - claim: >-
          pi scalar on E[N] forces full rational N-torsion, hence N divides
          p - 1 and N^2 divides the group order.
        responsibility: strictness
      - claim: The positive control returns a non-trivial pairing.
        responsibility: baseline

  predictions:
    - metric: >-
        fraction of (ordinary toy curve, endomorphism psi, point P) triples with
        e_N(P, psi(P)) not equal to 1, over curves whose group order is exactly
        divisible by N and with k > 1
      direction: lower
      minimum_effect: >-
        EXACTLY ZERO out of every triple tested, with no tolerance. A single
        non-trivial value is either a refutation of (B) or an instrument bug,
        and the record commits in advance to treating the instrument as the
        first suspect and to running the positive control before reporting.
    - metric: >-
        agreement between the recovered scalar lambda_pi (from pi(P) = [lambda]P)
        and 1
      direction: different
      minimum_effect: >-
        Exact equality on 100 percent of ordinary toy curves. pi acts as the
        identity on G by definition of rationality, so any disagreement is an
        arithmetic bug and halts the line.
    - metric: >-
        fraction of supersingular positive controls with e_N(P, psi(P)) not
        equal to 1
      direction: higher
      minimum_effect: >-
        100 percent. Below that the instrument cannot see a distortion map and
        no negative from it is interpretable.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): write the derivation and obtain
      Charles 2006/128. STAGE 1 (minutes): on 200 toy ordinary curves with
      p in [2^16, 2^20], group order exactly divisible by N, and k > 1, verify
      pi(P) = P and e_N(P, pi(P)) = 1 using the instrument of
      IDEA-20260807-e7eb5d.
      STAGE 2 (HARD GATE, minutes): the supersingular positive control.
      STAGE 3 (hours): search for the exceptional curve (N | p-1 and N^2
      dividing the group order, for small N) and exhibit the failure of (B3)
      on it.
    controls:
      - supersingular y^2 = x^3 + x over F_p, p = 3 mod 4, with the standard distortion map - must give a non-trivial pairing
      - an ordinary curve with full rational N-torsion - must give a non-trivial value or (C) is wrong
      - an ordinary curve with k > 1 - must give exactly 1
      - a deliberately broken pairing (final exponentiation omitted) - must be caught by the positive control returning a value outside mu_N
    required_metrics:
      - recovered lambda_psi per (curve, psi) and its agreement with the predicted eigenvalue
      - e_N(P, psi(P)) per triple, reported as an element of F_{p^k} with its order
      - pass or fail of each named control
      - >-
        the tuple (p, N, group order, k, eigenspace dimension) of every curve
        tested

  falsification_conditions:
    - >-
      Any ordinary toy curve whose group order is exactly divisible by N, with
      k > 1, on which some endomorphism gives e_N(P, psi(P)) not equal to 1,
      surviving the instrument controls. That refutes (B) and would be the most
      important observation in the campaign.
    - >-
      The supersingular positive control returning 1. Instrument failure under
      AGENTS.md rule 5, never mathematical evidence, and nothing is reported.
    - >-
      Charles 2006/128 characterising the exceptional cases differently from
      (C). One of the two is wrong; the record is superseded, not amended.
    - >-
      Failure to construct any exceptional curve at toy scale, which leaves the
      closure boundary unexhibited and caps the claim at "no counterexample
      found in the tested family".

  confounders:
    - >-
      Endomorphism availability. On a generic ordinary curve the only cheaply
      evaluable endomorphisms are the integers and pi itself, and pi acts as 1
      on G by construction, so a test that uses only pi is nearly vacuous. The
      test must include curves with small |D| (j = 0, j = 1728) where a genuine
      non-integer, non-Frobenius endomorphism is explicit, or it measures
      almost nothing.
    - >-
      Field of definition of the pairing. For k > 1 the Weil pairing value
      lives in F_{p^k}, and at toy scale k can be large enough that F_{p^k}
      arithmetic is infeasible. The test must select toy curves with SMALL k
      deliberately - which does not weaken the conclusion, because the claim is
      that the value is 1 for all k, and small k is the case most likely to
      produce a non-trivial value.
    - >-
      Confusing "no distortion map for G" with "no distortion map at all". The
      claim is about the rational eigenline only.

  interpretation_limits:
    - >-
      This is a closure of one family, not a hardness result. It moves no
      exponent and makes no curve safer than it already was.
    - >-
      Scoped to ordinary curves over PRIME fields whose group order is exactly
      divisible by N. Says nothing about supersingular curves, about extension
      fields, or about anomalous curves.
    - >-
      The mathematics is textbook and already recorded twice in this
      repository. Presenting it as a new result would be overclaiming; its
      value is placement, precision about the exception, and retrievability.

  reachability_gate: >-
    NOT APPLICABLE AS A SEARCH, AND THE REASON IS THE RESULT. This proposal
    does not move between curves. It is worth recording why no move helps -
    the obstruction is a property of End(E) being commutative, which holds for
    EVERY ordinary curve in the isogeny class and indeed for every ordinary
    curve over any prime field. There is no curve to walk to, at any cost, so
    T5's dichotomy (common enough to hit, or locally detectable) does not even
    arise. The only curves with the property are supersingular, and
    supersingularity is a class invariant (fixed by t), so it is unreachable by
    F_p-isogeny from an ordinary class.

  target_complexity:
    time_exponent: >-
      NO ATTACK IS PROPOSED. The mechanism examined, had it worked, would have
      given a self-pairing into mu_N inside F_{p^k} and hence a DLP transfer
      at the cost of the pairing plus a field DLP. It does not work, so the
      exponent stays at the rho baseline 1/2.
    memory_exponent: >-
      O(1) - the verification is a handful of field elements per curve.
    best_known: >-
      Parallel Pollard rho with distinguished points, 0.886 sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006), with the
      automorphism discount on CM curves bounded by sqrt(|Aut|) <= sqrt(6)
      (KN-TECH-018). BSGS at sqrt(N) time and memory (KN-TECH-031).
    hidden_overhead: >-
      None to disclose - no asymptotic claim is made.
    tradeoff_note: >-
      Not applicable; no algorithm is produced.

  dominated_by: >-
    As an attack it proposes none, so it is dominated on every axis by every
    row of the prime-field frontier, each of which was checked - rho at
    0.886 sqrt(N) time and O(1) memory (KN-TECH-001, KN-TECH-006); the
    automorphism-discounted rho on CM curves, better by at most sqrt(6)
    (KN-TECH-018); BSGS at 2 sqrt(N) time and sqrt(N) memory (KN-TECH-031),
    and n^{2/3+o(1)} full cost once memory is charged (KN-TECH-035); MOV /
    Frey-Ruck (KN-TECH-032), which needs a second independent point and is
    inapplicable at large k; the anomalous additive transfer (KN-TECH-033),
    inapplicable since N is not p. Data and query axis - this record consumes
    one instance and issues no queries beyond the pairing evaluations.
    As a CLOSURE ARGUMENT it is dominated by ledger/FINDING-PF-IC-001.md's
    ordinary lift gate, which states the same obstruction earlier, and by
    Charles ePrint 2006/128 externally. It dominates neither on strength, only
    on precision of the exceptional case and on placement in the campaign
    taxonomy.
  sota_delta: >-
    Zero speedup against any attack baseline, on time, memory and queries
    alike. Delta as a closure - converts a hypothesis-conditional gate
    ("when the eigenvalues are distinct") into an exact characterisation of the
    one exceptional configuration (E[N] contained in E(F_p), equivalently
    N | p-1 AND N^2 dividing the group order), which is checkable in two
    modular exponentiations per curve, and exhibits the boundary constructively
    instead of asserting it.

  estimated_cost:
    implementation: low
