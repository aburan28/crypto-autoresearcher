idea:
  id: IDEA-20260805-9ad641
  question_id: RQ-XEDN-002
  added: '2026-08-05'
  title: >-
    The E_8 forced value behind max_|coeff| = 1: was the XEDN coefficient census
    measuring non-isotriviality, or re-deriving a root-system identity that
    holds on every rational elliptic surface with irreducible fibres?
  class: control

  claim: >-
    On a Weierstrass surface y^2 = x^3 + a(t) x + b(t) over F_p(t) with
    deg a <= 4, deg b <= 6 and Delta = 4a^3 + 27b^2 not identically zero, the
    associated relatively minimal elliptic surface is RATIONAL (Euler number 12,
    arithmetic genus chi = 1). If in addition deg Delta = 12 and Delta is
    squarefree, every bad fibre is of Kodaira type I_1, hence IRREDUCIBLE, hence
    the local contribution terms contr_v of the Shioda height pairing all vanish.
    Two consequences are then FORCED, before any run, for the exact family
    EXP-XEDN-004 censused:
      (F1) rank E(F_p(t)) <= 8, with the Mordell-Weil lattice equal to the E_8
           root lattice under the Shioda pairing (Shioda-Tate:
           rank = 8 - sum_v (m_v - 1), and m_v = 1 for every I_1 fibre);
      (F2) every polynomial ("integral", free-x) section P = (x(t), y(t)) has
           (P . O) = 0 and therefore canonical height h(P) = 2*chi = 2 exactly,
           independently of whether deg x is 0, 1 or 2 -- i.e. every enumerated
           free-x section is a ROOT of that E_8, and there are at most 240 of
           them;
      (F3) for n such sections the integer relation lattice has rank >= n - 8,
           so a surface with n = 19 enumerated sections carries at least 11
           independent relations, not one.
    If F1-F3 hold, then "max_|coeff| = 1 at every p with slope 0 vs log p"
    (EV-XEDN-003) is a statement about the E_8 root system -- in a root system
    alpha + beta is a root exactly when <alpha,beta> = -1, so root triangles
    alpha + beta + gamma = 0 are abundant and give support-3 relations with all
    coefficients +-1 -- and NOT about the removal of the mu_3 automorphism. The
    mu_3 orbit sum S + wS + w^2 S = O on the isotrivial j = 0 family is ONE
    root triangle; deleting mu_3 deletes one construction of root triangles and
    leaves the rest of E_8 intact. Under that reading the census could not have
    returned anything except 1, on either family, and the goal's stated
    discriminating mechanism ("any remaining bound must come from the geometric
    height lattice itself rather than from that automorphism", H-XEDN-003)
    is correct in its conclusion and vacuous as a test, because the bound was
    derivable at zero compute from Shioda-Tate.
    THIS PROPOSAL CLAIMS NO RESULT. F1-F3 are stated as forced values to be
    verified, and the verification has a real chance of refuting THIS proposal
    rather than the census: see the pre-registered discrepancy below.

  object_first_candidate:
    tracked_object: >-
      The canonical Shioda height vector of a section, h(P) = 2*chi + 2*(P . O)
      - sum_v contr_v(P), together with its local contribution profile
      (contr_v(P))_v indexed by the bad fibres of the surface. This object is
      followed through the group law: the height pairing is bilinear, so
      <P + Q, R> = <P,R> + <Q,R>, and the profile propagates deterministically.
      The census tracked instead the NAIVE quantity deg x(P) and a difference
      form built from it; those two objects are not the same object, and
      separating them is the whole proposal.
    established_families_off_limits: >-
      Off-limits as the primary lens for this proposal: (i) xedni calculus and
      any lift-then-solve pipeline; (ii) Semaev summation polynomials and
      Groebner/first-fall instrumentation; (iii) index calculus with an
      x-coordinate factor base; (iv) isogeny/volcano and CM structure;
      (v) Pollard rho / BSGS generic algorithms; (vi) descent via
      Weil restriction (GHS). Also off-limits, and this is the load-bearing
      exclusion for THIS record: the degree-window raise (deg a <= 4,
      deg x <= 3, deg b = 10). That is the move the EXP-XEDN-004 red team named
      as the cheapest next control (RT-XEDN-004 item 4) and it is already the
      declared scope of the sibling goals GOAL-XEDN-002 and GOAL-XEDN-003. This
      proposal deliberately does not widen the window; it asks whether the
      instrument inside the existing window measured what its record says.
    newness_score: >-
      The mathematics is not new and this record must not pretend otherwise:
      Shioda's Mordell-Weil lattice theory dates from 1990 and the E_8 structure
      of a rational elliptic surface with irreducible fibres is textbook. What is
      absent from this corpus is the APPLICATION of it as a pre-registered forced
      value against this program's own four completed XEDN censuses. Grep of
      ledger/, experiments/ and knowledge/ on 2026-08-05 for "Shioda-Tate",
      "E_8", "root lattice", "Kodaira" in the XEDN lane found the Shioda height
      Gram named only as a diagnostic (RQ-XEDN-002 scope line, VAL-XEDN-003-01,
      VAL-XEDN-004-01) with no derivation of what it must equal. The novelty is
      auditing, not mathematical.
    testability_score: >-
      Very high and nearly free. Stage 0 is a comparison of two integers already
      in the archive against a bound (rank <= 8) and needs zero compute. Stage 2
      is polynomial arithmetic over F_p that runs in this container: the frozen
      predicate module experiments/EXP-XEDN-001/xedni_sections.py is PURE PYTHON
      and imports successfully here, whereas the census implementation
      experiments/EXP-XEDN-004/implementation/run_census.sage requires SageMath,
      which is ABSENT from this container (verified 2026-08-05:
      `python3 -c "import sage"` -> ModuleNotFoundError; numpy 2.4.6 IS present;
      sympy is absent). That asymmetry is recorded here because it decides the
      experiment's design, not as a complaint.
    survival_score: >-
      The height/contribution object survives the entire computation by
      construction, because it is a lattice invariant. That is its strength for
      an audit and its weakness as an attack device: it is exactly as
      instance-independent as the mu_3 orbit sum it explains, which is why this
      proposal moves no exponent and says so.

  mechanism: >-
    Set up. Let S -> P^1 be the relatively minimal elliptic surface attached to
    E: y^2 = x^3 + a(t) x + b(t) over k = F_p(t), with deg a <= 4, deg b <= 6,
    Delta = 4a^3 + 27b^2 not identically 0, and the model minimal at t = infinity.
    Then chi(O_S) = 1 and S is rational. Shioda's height pairing on
    E(k)/E(k)_tors is
      <P,Q> = chi + (P . O) + (Q . O) - (P . Q) - sum_v contr_v(P,Q),
      h(P) = <P,P> = 2*chi + 2*(P . O) - sum_v contr_v(P),
    and Shioda-Tate gives rank E(k) = 8 - sum_v (m_v - 1) where m_v is the number
    of irreducible components of the fibre at v. All of this is RECALLED,
    UNVERIFIED -- see literature_context -- and stage 1 of the experiment is to
    verify the statements against a source rather than to use them on trust.

    Step 1: the family is all-I_1. deg a <= 2 and deg b = 6 exactly give
    deg(4a^3) <= 6 and deg(27b^2) = 12, so deg Delta = 12. In the chart u = 1/t
    the standard substitution x -> x/u^2, y -> y/u^3 sends a to u^4 a(1/u) and b
    to u^6 b(1/u); with deg a <= 2 and deg b = 6 exactly, the transformed b does
    not vanish at u = 0, so the fibre at infinity is smooth and the model is
    minimal there. Hence all 12 units of Euler number sit over the finite roots
    of Delta. If Delta is squarefree it has 12 distinct roots, each carrying
    v(Delta) = 1, i.e. a nodal I_1 fibre, which is IRREDUCIBLE (m_v = 1) and
    contributes contr_v = 0 for every section. Therefore sum_v (m_v - 1) = 0 and
    F1 follows: rank = 8, and E(k) with the height pairing is the E_8 root
    lattice (the narrow lattice equals the full one when there are no reducible
    fibres, and E(k)_tors is trivial).

    Step 2: every free-x section is a root. A section with x(t), y(t) polynomial
    of degrees deg x <= 2, deg y <= 3 does not meet the zero section: in the
    u-chart X = u^2 x(1/u) is regular and finite at u = 0 for deg x <= 2, so
    (P . O) = 0. With contr_v = 0 for all v this gives h(P) = 2*chi = 2, i.e.
    F2, for EVERY such section regardless of whether deg x is 2, 1 or 0. Note
    what this says about the census instrument: the archived pseudo-Gram sets
    G[i,i] = h_naive(P_i) := max(deg num x, deg den x), which takes the values
    0, 1 and 2 (the archive records h_naive_set = [1,2] on 8 of the 24 eligible
    surfaces), whereas the canonical height is the constant 2. A Gram whose
    diagonal is not the canonical height is not the height Gram and its kernel
    is not the relation lattice.

    Step 3: the coefficient bound is a root-system identity. In any simply-laced
    root system all roots have the same norm 2, and for distinct roots
    <alpha,beta> is in {0, +-1}, with +-2 only for beta = +-alpha. If
    <alpha,beta> = -1 then gamma := -(alpha + beta) satisfies
    <gamma,gamma> = 2 + 2 - 2 = 2, so gamma is again a root, hence again a
    section of the same shape, hence -- because the census enumeration is an
    EXHAUSTIVE loop over all (x_0, x_1, x_2) in F_p^3 -- also enumerated. Then
    alpha + beta + gamma = 0 is a support-3 relation with all coefficients +-1
    and inf-norm exactly 1. So max_|coeff| = 1 follows from the existence of ONE
    pair of enumerated sections at height-pairing -1, with no reference to a,
    to j, or to mu_3. The mu_3 orbit sum on the isotrivial family is the special
    case in which the triangle is realised by an order-3 automorphism.

    Step 4: the forced value has teeth because it is checkable against the
    archive and can come out wrong. F1 says the relation lattice on a surface
    with n enumerated sections has rank >= n - 8, i.e. the census's reported
    "span_rank" must never exceed 8. The archived
    experiments/EXP-XEDN-004/runs/RUN-XEDN-004-MAIN/raw-result.json reports
    span_rank values of 18 (p = 13, n_slots = 19), 13 (p = 13, n = 15),
    11 (p = 31, n = 11) and 10 (p = 19, n = 13) on surfaces this proposal
    computes to have deg Delta = 12 and Delta squarefree. Under F1 those numbers
    are impossible and the pseudo-Gram is refuted as a rank instrument. Under
    the opposite outcome -- if a source check shows the rank bound does not
    apply to this family, or if the Delta-squarefreeness recomputation
    disagrees -- THIS PROPOSAL is refuted and the census's diagnostic stands.
    Both outcomes are useful and the experiment is designed to reach either.

    Step 5: what this does NOT establish. Nothing here contradicts
    EV-XEDN-003's primary metric. The group-law short search is a separate,
    correct instrument and its verified relations were confirmed by
    specialisation at >= 20 smooth fibres, and independently recomputed on one
    p = 7 surface by TASK-20260725-005. The claim under audit is about what the
    number 1 MEANS, not about whether it was correctly measured.

  novelty_status: unverified

  literature_context:
    - >-
      T. Shioda, "On the Mordell-Weil lattices", Comment. Math. Univ. St. Pauli
      39 (1990), 211-240. NOT READ -- RECALLED, UNVERIFIED. This is the source
      for the height pairing formula, the contribution terms contr_v, the
      Shioda-Tate rank formula, and the identification of the Mordell-Weil
      lattice of a rational elliptic surface with irreducible fibres as E_8. The
      volume, page range and year above are recalled and MUST be checked; a
      wrong page number in a corpus of 7809 literature entries is exactly the
      failure KN-OPEN-3f7a21 documents. Verifying these statements against an
      obtainable source is stage 1 of the experiment and the experiment may not
      proceed past it on memory.
    - >-
      K. Kodaira's classification of singular fibres and the standard table of
      contr_v by fibre type (I_n: i(n-i)/n; III: 1/2; IV: 2/3; I_n^*: 1 or
      1 + n/4; etc.). NOT READ -- RECALLED, UNVERIFIED. Only one entry of that
      table is load-bearing here and it is the trivial one: an I_1 fibre is
      irreducible, so contr_v = 0. That single fact is the one to verify first.
    - >-
      This corpus's own XEDN records. RQ-XEDN-002 names the "polarisation /
      Shioda height Gram" as a diagnostic secondary metric only;
      VAL-XEDN-003-01 and VAL-XEDN-004-01 both record that the Gram
      "over-reports" coefficients (on one p = 13 surface it reported inf-norm 15
      where the group-law search found a verified relation of inf-norm 1). Those
      records observed the symptom twice and did not diagnose it. This proposal
      supplies a candidate diagnosis -- the diagonal is deg x, not the canonical
      height -- and a way to test it. NO STATUS CHANGE to either validation
      record is proposed or implied.
    - >-
      RT-XEDN-004 (coordination/goals/GOAL-XEDN-001/batches/BATCH-001/tasks/
      TASK-20260725-006/objections.md), item 2: "Search-bound honesty. Group-law
      short search is capped; state that bound." READ. The red team named the
      cap and did not draw its consequence; that consequence is the subject of
      the companion proposal IDEA-20260805-b6af55, which becomes stage 2 here.

  lossy_projection_identifiability_audit:
    projection: >-
      A free-x section P = (x(t), y(t)) -- seven coefficients in F_p for
      deg x <= 2, deg y <= 3 -- is projected to the pair
      (h(P), (contr_v(P))_{v | Delta}), i.e. one rational number bounded by 2
      together with a length-12 vector of local contributions.
    what_is_discarded: >-
      Everything except the section's intersection profile with the components of
      the bad fibres and with the zero section. On an all-I_1 surface the profile
      is empty and the projection retains a single number.
    why_genuinely_lossy: >-
      Massively lossy: on an all-I_1 surface up to 240 distinct sections share
      the value h = 2. The fibre over the observed value is the whole root system.
    why_compatible_with_the_operations: >-
      Compatible in the strong sense the inventor protocol asks for: the height
      pairing is bilinear on E(k)/tors, so the retained part propagates
      deterministically under the group law, <P + Q, R> = <P,R> + <Q,R>. This is
      exactly the property that makes the projection a legitimate tracked object
      rather than a summary statistic.
    is_it_only_a_change_of_coordinates: >-
      No -- and this is the point at which the audit turns on itself. The
      (Delta, Pi) = (x xor y, x*y) failure of KN-LIT-7595 is "nothing discarded";
      that is plainly not the case here. The MIRROR failure is the live one, and
      the audit's answer is that the projection FAILS IT ON THE NOSE for the
      family under test: on an all-I_1 surface h(P) = 2 for every section, so the
      comparator spread is ZERO -- the statistic is a constant of the apparatus,
      the tell KN-TECH-1a5b7e names mechanically. Which failure was checked for:
      the mirror failure (constant across instances). What the check returned:
      CONSTANT, predicted, for the projection h alone. The proposal therefore
      does NOT put h forward as a discriminating object; it puts it forward as
      the derivation of why a downstream statistic built on it was pinned at its
      floor. The pair (h, contr-profile) recovers non-constancy only on surfaces
      with reducible fibres, which is precisely why the positive control of the
      experiment is a surface with a non-squarefree Delta.

  assumptions:
    - >-
      That the model is relatively minimal and minimal at t = infinity for the
      admitted (a, b). Argued in mechanism step 1 from deg b = 6 exactly; the
      argument is to be checked, not assumed, and a surface failing it is
      excluded from the trend rather than counted as evidence.
    - >-
      That E(F_p(t))_tors is trivial for the admitted surfaces. If a torsion
      section were enumerated, it would have h = 0 and would not be a root, and
      the relation lattice would contain a vector supported on it alone. Torsion
      must be measured, not assumed; the census's exclusion of y = 0 removes
      2-torsion only.
    - >-
      That the enumeration in enumerate_slots_frozen_mod is exhaustive over
      free-x sections of the declared shape. It loops over all (x_0, x_1, x_2)
      in F_p^3 and canonicalises y against -y, which is exhaustive for deg x <= 2
      by inspection; this must be confirmed by re-reading the frozen predicate,
      because step 3's "hence also enumerated" depends on it.
    - >-
      That p > 3, so that the short Weierstrass form and the discriminant
      4a^3 + 27b^2 are the right objects. All tested p (7, 13, 19, 31) satisfy
      this.

  proof_search_map_note: >-
    This idea is proof-oriented (it asserts a forced value derived from cited
    theorems), so its paired hypothesis H-XEDN-fe3446 carries the filled
    proof_search_map with all four audits, per docs/inventor-protocol.md
    section 8. It is not repeated here.

  predictions:
    - metric: >-
        max_span_rank_over_archived_eligible_surfaces: the largest value of the
        field "span_rank" over the eligible surfaces recorded in
        experiments/EXP-XEDN-004/runs/RUN-XEDN-004-MAIN/raw-result.json, on
        those surfaces whose Delta is independently recomputed to be squarefree
        of degree 12
      direction: higher
      minimum_effect: >-
        FORCED VALUE, derived before any run: under F1 this quantity must be
        <= 8. The archive is read as reporting values up to 18. Any value > 8 on
        a Delta-squarefree surface refutes the pseudo-Gram as a rank instrument.
        Any run in which the recomputation finds max span_rank <= 8 on all
        Delta-squarefree surfaces refutes THIS PROPOSAL'S reading of the archive
        and the audit stops there.
    - metric: >-
        canonical_height_spectrum: the multiset of h(P) over all enumerated
        free-x sections, computed from the Shioda formula with fibre types read
        off the factorisation of Delta, on Delta-squarefree surfaces
      direction: different
      minimum_effect: >-
        FORCED VALUE: exactly {2, 2, ..., 2}. Predicted spread 0. A single
        section with h != 2 on an all-I_1 surface falsifies F2 as stated.
    - metric: >-
        n_sections_exceeding_the_rank_bound: number of eligible surfaces with
        n_slots > 8, i.e. surfaces on which F3 forces at least n - 8 independent
        relations
      direction: higher
      minimum_effect: >-
        At least 5, derived by counting the archive's own n_slots field
        (values 9, 11, 13, 15, 19 appear among eligible surfaces). On every one
        of those the census reported a single shortest relation and a corank of
        0, 1 or 2. Under F3 the corank is at least 1, 3, 5, 7 and 11
        respectively. This is the sharpest single comparison in the proposal.
    - metric: >-
        root_triangle_incidence: fraction of eligible surfaces on which at least
        one pair of enumerated sections has height pairing -1
      direction: higher
      minimum_effect: >-
        Predicted 1.0 on every surface that produced a verified inf-norm-1
        relation, because a support-3 all-+-1 relation among roots IS a root
        triangle. Any surface with a verified inf-norm-1 relation and no pairing
        of -1 falsifies step 3 of the mechanism.
    - metric: >-
        mu3_independence: max_|coeff| computed on the isotrivial a = 0 family of
        EXP-XEDN-003 with all mu_3 orbit triples explicitly DELETED from the
        section list before the relation search
      direction: different
      minimum_effect: >-
        Predicted still 1, on the same E_8 grounds. If deleting the mu_3 orbits
        raises max_|coeff| above 1 on the isotrivial family, then mu_3 really was
        the load-bearing mechanism there, F1-F3 do not explain the isotrivial
        result, and this proposal's central reading is wrong.

  minimal_test:
    design: >-
      Four stages, cheapest first, each able to terminate the audit; specified in
      full in EXP-XEDN-affa94. STAGE 0 (zero compute, minutes): read the archived
      span_rank and n_slots fields and compare against the bound 8. STAGE 1
      (reading, hours, zero compute): obtain a source for Shioda-Tate and the
      contr_v table and either quote the statements or record that they could not
      be obtained; the audit may not proceed on memory. STAGE 2 (pure Python,
      minutes): recompute Delta, its degree and its squarefreeness for every
      archived surface, and determine Kodaira types from the valuations of a, b
      and Delta. STAGE 3 (pure Python, hours): implement the group law over
      F_p(t) and the Shioda height, recompute the true height Gram, and run the
      arms and controls below.
    controls:
      - >-
        NULL OBJECT (matched, of the same shape, forced value derived pre-run,
        CAN FAIL). Replace each surface by n roots of E_8 drawn uniformly at
        random from the 240, with n equal to that surface's n_slots, and run the
        IDENTICAL shortest-relation search (same coefficient bound, same support
        bound, same early-return rule) on the resulting Gram. FORCED VALUE: if
        max_|coeff| on the random-root null is also 1 at every n that occurs in
        the census, then the census statistic is a property of E_8 and not of the
        surfaces, and in particular not of a != 0 or of j non-constant. This null
        can genuinely fail: it is NOT a theorem that n random roots of E_8 admit
        a +-1 relation -- 8 mutually orthogonal roots (an A_1^8 subsystem) admit
        none, and a 9th root added to them may require a coefficient of 2. The
        null's outcome is therefore informative in both directions and its value
        is to be recorded before the surface arm is re-read.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR. Surfaces
        with a NON-squarefree Delta, which carry a reducible fibre and therefore
        nonzero contr_v. On these, F1 predicts rank <= 7 and F2 predicts the
        height spectrum SPLITS away from the constant 2 (an I_2 fibre contributes
        1/2 to a section meeting the non-identity component, giving h = 3/2).
        The effect MUST appear: if the recomputed height instrument returns
        h = 2 for every section and rank 8 on a surface with a demonstrably
        reducible fibre, the instrument cannot see fibre contributions, it is
        broken, and NO negative result about the census may be reported. Three
        such surfaces are already in the archive (one at p = 7, two at p = 13,
        one at p = 19 by this proposal's own recomputation of Delta), so this
        control costs nothing to populate.
      - >-
        GRADED CONTROL, >= 3 interior points, monotonicity reported. Construct
        surfaces with k = 0, 1, 2, 3 forced reducible fibres by choosing (a, b)
        so that Delta has k repeated roots. Pre-registered prediction: the rank
        ceiling 8 - sum_v (m_v - 1) decreases monotonically 8, 7, 6, 5 and the
        height spectrum widens monotonically. A rank ceiling that FAILS TO DECAY
        as reducible fibres are added is the canonical artifact tell of
        docs/inventor-protocol.md section 3 and localises the obstruction to the
        fibre-type determination rather than leaving "it did not work".
      - >-
        ORDERING CONTROL. The null arm and the positive control are computed,
        recorded and hash-committed BEFORE the surface arm's recomputed Gram is
        looked at. Absence of that commitment invalidates the comparison.
      - >-
        ARCHIVE-INTEGRITY CONTROL. The recomputation must reproduce the archived
        n_slots and the archived verified shortest relations exactly on at least
        one p = 7 surface, matching TASK-20260725-005's independent recompute. A
        mismatch means the reimplementation differs from the Sage original and no
        conclusion about the original may be drawn from it.
    required_metrics:
      - max span_rank over Delta-squarefree eligible archived surfaces, against the bound 8
      - canonical height spectrum per surface, with the fibre types used and their source
      - corank of the true relation lattice per surface, against n - 8
      - max_|coeff| on the random-E_8-root null at each n occurring in the census, with seeds
      - height spectrum and rank ceiling on the Delta-non-squarefree positive control
      - verbatim quotation of Shioda-Tate and of contr_v(I_1) = 0, or a recorded statement that no source could be obtained

  falsification_conditions:
    - >-
      A source check shows the Shioda-Tate rank bound, the height formula, or
      contr_v(I_1) = 0 is not as recalled. The forced values F1-F3 are then
      withdrawn and the proposal fails at stage 1, before any compute.
    - >-
      Recomputation shows the archived span_rank values <= 8 on every
      Delta-squarefree surface, i.e. this proposal misread the archive. The audit
      stops and records that.
    - >-
      The recomputed canonical height is not constant 2 on an all-I_1 surface.
      F2 is false as stated and the root-system explanation of max_|coeff| = 1
      collapses.
    - >-
      The random-E_8-root null does NOT return max_|coeff| = 1 at the n values
      occurring in the census. The census statistic then discriminates something
      the null does not have, and the surfaces are carrying real information.
      This is the outcome that would most raise the value of the completed goal.
    - >-
      Deleting mu_3 orbits from the isotrivial EXP-XEDN-003 section lists raises
      max_|coeff| above 1 there. The mu_3 mechanism was then real and the claimed
      equivalence with generic root triangles is wrong.
    - >-
      The positive control fails (no height split, no rank drop on a surface with
      a reducible fibre). Nothing negative may be reported at all.

  confounders:
    - >-
      REIMPLEMENTATION DRIFT. The census ran under SageMath 10.9 on Homebrew;
      SageMath is not installed in this container. Any recomputation is a
      reimplementation, and a discrepancy between it and the archive may be the
      reimplementation's fault. The archive-integrity control exists solely to
      bound this confounder, and a failure of that control must be reported as
      an infrastructure signal, never as a mathematical finding about the census
      (AGENTS.md rule 5).
    - >-
      MINIMALITY AT INFINITY. The all-I_1 conclusion depends on the model being
      minimal at t = infinity, which was argued from deg b = 6 exactly. Surfaces
      admitted with deg b < 6 or with a common factor between a and b could
      violate it and would produce a spurious rank anomaly.
    - >-
      RECALLED MATHEMATICS. Every forced value in this record derives from
      theorems recalled and not read. This is the single largest risk in the
      proposal and stage 1 exists only to remove it.
    - >-
      AUDIT ASYMMETRY. Criticising a completed goal's instrument is cheap to
      produce and reads as rigour. The proposal is built with a null that can
      fail, a positive control that gates any negative report, and five
      falsification conditions precisely so that the critical outcome costs
      something to reach.
    - >-
      CENSUS-SIDE SELECTION. The archived surfaces were found by a two-section
      Weierstrass solve, i.e. conditioned on carrying two prescribed sections.
      Any statement about "surfaces in the family" inherits that conditioning,
      and this audit must not silently upgrade it to a statement about a uniform
      sample of the family.

  interpretation_limits:
    - >-
      A confirming outcome narrows the reading of EV-XEDN-003 and DEC-20260725-001.
      It does NOT withdraw the measurement, does NOT show the census was executed
      incorrectly, does NOT close candidate B2, does NOT touch number-field
      xedni, and does NOT bear on crypto-scale ECDLP. The forward guidance it
      would carry is explicit: the coefficient-bound question becomes interesting
      again exactly where contr_v is nonzero, i.e. on surfaces with reducible
      fibres, which no XEDN experiment has yet made its treatment arm.
    - >-
      A confirming outcome would also NOT establish that the completed goal
      should have been left open. GOAL-XEDN-001 met its declared completion
      criteria on a committed decision with archived independent review and a
      red-team pass; the criteria were about producing a decision with a stated
      boundary, and that was done. What an audit can change is the boundary's
      width, and the mechanism to do that is a superseding record, never an edit.
    - >-
      No status change to H-XEDN-003, EV-XEDN-003, DEC-20260725-001,
      KN-FIND-004, or GOAL-XEDN-001 is proposed or implied by this record. Only
      the Coordinator may make one (AGENTS.md rule 1).

  heuristic_assumptions:
    - id: HEUR-XEDN-A1
      statement: >-
        NONE LOAD-BEARING for F1-F3. The forced values are consequences of
        stated theorems (Shioda-Tate, the height formula, the Kodaira table)
        applied to a family whose discriminant degree is computed exactly, not
        distributional claims. This entry exists to record that the proposal is
        UNCONDITIONAL where its predecessors in this lane were empirical, and
        that its only assumption is evidentiary: that the recalled theorem
        statements are the real ones.
      rigorous_support: >-
        deg Delta = 12 is computed from deg a <= 2 and deg b = 6 by inspection of
        leading terms; smoothness at infinity from the u = 1/t substitution;
        contr_v(I_1) = 0 because an I_1 fibre has one component.
      validation_plan: >-
        Stage 1 source check, plus stage 2 exact recomputation of deg Delta and
        squarefreeness for all archived surfaces in pure Python over F_p. Not a
        distributional validation and not presented as one.
    - id: HEUR-XEDN-A2
      statement: >-
        For the NULL ARM only: n roots drawn uniformly from the 240 roots of E_8
        are a faithful null for "n free-x sections on an all-I_1 surface". This
        IS a distributional assumption and it is load-bearing for the null's
        interpretation.
      rigorous_support: >-
        Under F2 the sections are roots, so the null has the correct support. It
        may still have the wrong measure: sections arising from an actual surface
        need not be uniform among roots, and the two-section construction used to
        find the archived surfaces certainly biases them.
      validation_plan: >-
        Report the empirical pairwise-inner-product histogram of the surface
        sections against the uniform-root histogram. If they differ, the null is
        mis-specified in a stated direction and the comparison is reported with
        that caveat rather than suppressed. A mis-specified null is itself a
        finding: it says which structure the surfaces carry beyond being roots.

  target_complexity:
    time_exponent: >-
      n/a for this audit. NO EXPONENT IS MOVED and this record does not pretend
      otherwise. The exponent that governs the XEDN lane is the lift probability
      measured by EXP-XEDN-001 and re-derived in DEC-20260724-021,
      P_lift(p) = (1 - 2/p + p^-3)/(2 p^3), i.e. alpha = 3; nothing in this
      proposal touches it. The proposal's value is that it decides what an
      existing measurement means, at a cost of hours.
    memory_exponent: n/a for this audit.
    best_known: >-
      For ECDLP over F_p the incumbent frontier is Pollard rho at time
      O(sqrt(p)) with O(1) memory and O(1) data. No lifting-based relation source
      in this corpus approaches it.
    hidden_overhead: n/a.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no result claimed; this is an audit of an existing measurement, not an
    algorithm). Rows checked before writing null, across time, memory and
    data/queries: (1) Pollard rho, sqrt(p) time / O(1) memory / O(1) data --
    not comparable, this proposal proposes no solver; (2) BSGS, sqrt(p) time /
    sqrt(p) memory -- likewise; (3) the XEDN lane's own lifting route at
    alpha = 3 (DEC-20260724-021, EXP-XEDN-001) -- this proposal makes no lifting
    claim and does not compete with it; (4) the four completed XEDN censuses
    EXP-XEDN-003/004/005/006-007, whose deliverable is a measured coefficient
    bound -- this proposal does not produce a competing measurement, it audits
    the interpretation of theirs; (5) external Mordell-Weil-lattice literature,
    which certainly dominates the mathematics here completely, and that
    domination is the proposal's premise rather than an embarrassment to it.
  sota_delta: >-
    No attack; measurement-interpretation contribution only. Quantitatively the
    proposal either (a) narrows the claim boundary of one decision
    (DEC-20260725-001), one evidence record (EV-XEDN-003) and by extension the
    three sibling censuses that used the same instrument, at a cost of roughly
    one day and zero new mathematics, or (b) shows that a random-E_8-root null
    does NOT reproduce max_|coeff| = 1, in which case the four censuses are
    measuring surface-specific structure and their value goes UP. The only
    quantity it moves is the number 8: the largest span_rank the archive may
    legitimately report, against a recorded maximum of 18.

  estimated_cost:
    implementation: >-
      medium. The group law over F_p(t) and the Shioda height must be written in
      pure Python because SageMath is absent from this container (verified);
      roughly 300-400 lines, no external dependency beyond the standard library
      and the already-pure-Python frozen predicate module. Stages 0-2 need none
      of it.
    compute: >-
      very low. Stage 0 is a JSON read. Stage 2 was prototyped outside the
      harness in under a second for all 24 archived eligible surfaces (this
      figure is SCOUT-COMPUTED outside the harness and must be re-measured
      in-harness before it is cited anywhere). Stage 3 at p <= 31 with n <= 20
      sections is seconds.
  recommended_priority: high
  honest_prior_of_survival: >-
    0.70 that the audit's central reading survives, i.e. that max_|coeff| = 1 is
    forced by root geometry and the random-root null reproduces it. It is not
    higher because three separate things could break it: the recalled Shioda
    statements are unverified and one wrong hypothesis in Shioda-Tate would void
    F1; the random-root null is genuinely capable of failing at small n, where
    3 or 4 roots need not contain a triangle (and n = 3 is the most common slot
    count in the archive, which is the single most likely way this proposal is
    wrong); and the surfaces' sections are not uniform among roots because of the
    two-section construction. It is not lower because the arithmetic that
    produces the forced values is elementary and because the archive already
    contains an internally inconsistent number -- a reported rank of 18 on a
    rank-<= 8 object -- that some explanation of this shape has to account for.
    Separately, 0.95 that the audit reaches a decisive reading at all, because
    stage 0 is a comparison of integers and stage 2 runs in this container.
