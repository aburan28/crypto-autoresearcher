idea:
  id: IDEA-20260805-88ecef
  question_id: RQ-SLHDSA-001
  goal_id: GOAL-SLHDSA-001
  added: '2026-08-05'
  title: >-
    Charge the multi-target advantage: a cost-convention register for the FORS
    interleaved-target attack in which the memory-access exponent theta and the
    quantum depth cap are ROWS rather than assumptions, with AES-128 key search
    as the anchoring positive control
  class: measurement

  claim: >-
    The FORS multi-target attack buys its advantage with a table. At signature
    budget q it must hold the revealed FORS leaf indices of q signatures --
    about q*k cells -- and it must random-access that table once per forgery
    trial. Every published multi-target figure for SLH-DSA that this program has
    seen quotes the TIME axis only, so the advantage is bought with a resource
    that is never charged. Charging it is arithmetic, and the arithmetic splits:
    write the charged cost as
      W_theta(q) = U(q) * M(q)^theta,   U(q) = 2^{ak} / T_k(q/2^h),  M(q) = q*k,
    with theta the memory-access exponent of the chosen cost convention
    (theta = 0 free RAM; theta = 1/2 the two-dimensional area-time / Wiener
    charge; theta = 1/3 a three-dimensional layout; theta = 1 a fully serial
    memory scan). Then, at the maximum permitted q = 2^64:
    (1) THE MULTI-TARGET AMPLIFICATION AND THE MEMORY CHARGE ARE THE SAME SIZE.
        The amplification is log2 A = log2(T_k(lambda)/lambda) and the theta=1/2
        charge is (1/2) log2(q k). For SLH-DSA-128s those are 33.27 and 33.90
        bits: THE CHARGE EXCEEDS THE ADVANTAGE AND THE MULTI-TARGET GAIN IS
        ERASED, NET -0.6 BITS. For the other five sets the advantage survives,
        by +9.1 (192s), +17.8 (256s), +28.8 (256f), +37.1 (128f and 192f) bits.
        That the six sets do not answer uniformly is the content: a single
        sentence about "the multi-target advantage" is false for at least one
        standardized parameter set under a standard cost convention.
    (2) THE MARGIN GOES UP, NOT DOWN. Under theta = 1/2 the charged cost exceeds
        the nominal security category by 34 to 40 bits at all six sets. A
        result that makes a standardized scheme look STRONGER is still a result,
        and GOAL-SLHDSA-001's first completion criterion explicitly names "the
        outcome that the margin is comfortable" as an admissible deliverable.
    (3) THE ANSWER IS A RANGE INDEXED BY CONVENTION, WHICH IS EXACTLY WHAT THE
        GOAL ASKED FOR. Across theta in {0, 1/3, 1/2, 2/3, 1} the 128s figure
        runs 133.7 / 156.3 / 167.6 / 178.9 / 201.5 bits. Quoting any one of them
        without the row label is the error this record exists to name.
    (4) THE SAME REGISTER CARRIES THE QUANTUM ROWS. Grover over the trial space
        of size 1/p is subject to NIST's MAXDEPTH convention and to whether QRAM
        over the q*k table is free; those are two more rows, not two more
        assumptions, and the register reports the AES-128 reference under each
        row so that a category comparison is made like-for-like.
    NO ATTACK IS PROPOSED. NO EXPONENT MOVES. The deliverable is a table with
    its assumptions promoted to labels.

  object_first_candidate:
    tracked_object: >-
      THE ATTACKER'S RESOURCE VECTOR (D, M, T, depth) = (signatures obtained,
      table cells held, forgery trials, longest serial chain), followed as a
      TRAJECTORY parameterized by the signature budget q. The tracked object is
      the curve q -> (q, qk, 2^{ak}/T_k(q/2^h), .) in resource space, and the
      derived observable is its image under a convention map
      (D, M, T) -> a single charged cost. Different conventions are different
      maps applied to the SAME trajectory, which is why the trajectory and not
      any one cost is the object.
    established_families_off_limits: >-
      Off-limits as the PRIMARY lens: (a) hash cryptanalysis of SHA-2/SHAKE;
      (b) fault, Rowhammer and memory-corruption attacks on the stateless
      construction -- strictly separate claim class under RQ-SLHDSA-001,
      untouched here; (c) side channels; (d) WOTS+ and hypertree structural
      attacks; (e) algebraic and lattice devices; (f) improving the attack. This
      record must not become an attack proposal: its whole content is that an
      EXISTING attack's cost changes when a resource nobody charged is charged.
      Also off-limits as a lens: re-deriving the bound, which belongs to
      IDEA-20260805-fbe36a and is consumed here as an input, not reproduced.
    newness_score: >-
      Area-time charging is old (Brent-Kung, Wiener) and the corpus already
      holds it as a technique family (KN-TECH-035, KN-TECH-044, KN-TECH-050,
      KN-TECH-057 -- NAMED FROM THE SESSION ANGLE BRIEF, NOT READ BY THIS
      RECORD). NIST's MAXDEPTH convention is likewise standard. What is not in
      this corpus, per the session angle brief's F11 note, is any
      cost-convention register at all: the brief records that such a register
      "would serve KN-OPEN-014, SLHDSA-001, MLKEM-003 and RSA-001 at once and
      does not exist". Nor has this program ever charged memory for a hash-based
      signature. The newness is in the application and in the register format,
      not in the charging idea.
    testability_score: >-
      Total. Every entry is a closed-form evaluation over exact integers; the
      only judgement is which conventions to include, and that judgement is
      surfaced as row labels rather than buried.
    survival_score: >-
      The trajectory survives every convention by construction -- that is the
      point of tracking it instead of a cost. The risk is the mirror one and it
      is checked below: if every convention gave the same ranking, the register
      would be a constant of the apparatus and worthless.

  lossy_projection_identifiability_audit:
    projection: >-
      A complete attack description (algorithm, data structures, schedule)
      projected onto the three-number resource vector (D, M, T), and thence onto
      one charged cost per convention row.
    what_is_discarded: >-
      The algorithm itself. Two entirely different attacks with the same
      (D, M, T) are identified. All locality structure, all parallelism
      topology, and every constant factor below the exponent.
    why_genuinely_lossy: >-
      Extremely lossy, and the loss is the standard one that makes complexity
      accounting possible at all. Not a change of coordinates: (D, M, T) does
      not determine the attack.
    why_compatible_with_the_operations: >-
      The convention maps act on (D, M, T) alone by definition, so the
      projection commutes with the costing operation exactly. This is the case
      where compatibility is trivial and therefore where the mirror failure is
      the only real risk.
    is_it_only_a_change_of_coordinates: >-
      No -- the fibre over a resource vector is the whole space of attacks with
      those resources.
    which_failure_was_checked_for: >-
      THE MIRROR FAILURE (constant across instances, zero comparator spread),
      because it is the live one for any costing exercise: if every convention
      row produced the same number, or the same ordering of parameter sets, the
      register would carry no information. CHECK PERFORMED ON PAPER AND IT
      SEPARATES, IN TWO INDEPENDENT DIRECTIONS:
      (i) ACROSS ROWS -- 128s runs from 133.7 bits at theta = 0 to 201.5 bits at
      theta = 1, a spread of 67.8 bits;
      (ii) ACROSS SETS WITHIN A ROW -- at theta = 1/2 the multi-target advantage
      is NEGATIVE for 128s (-0.6) and strongly positive for 128f (+37.1), so the
      convention actually flips a qualitative verdict for one set and not
      another. A statistic that changes sign across the objects it is applied to
      is not a constant of the apparatus. Both spreads are pre-registered as
      measurements, so a zero reading kills the record rather than being
      explained.

  mechanism: >-
    DERIVED HERE, on top of IDEA-20260805-fbe36a's closed form, which is an
    INPUT to this record and is not re-derived. All SLH-DSA structural constants
    are RECALLED-UNVERIFIED and are candidates to check.

    PART 1 -- WHAT THE ATTACK ACTUALLY HOLDS. To evaluate the per-trial test
    "does this trial digest's (i, j_1..j_k) satisfy j_t in S_{i,t} for all t?"
    the attacker needs, for every hypertree leaf i it has observed, the k
    revealed-leaf sets. Total live cells M = q*k (one a-bit index per tree per
    signature; the n-byte preimages are only needed for the single winning
    trial, so the working table is index-only and M = q*k is a LOWER bound on
    the honest memory, which is the conservative direction for an argument that
    charging matters). At q = 2^64 and k = 14, log2 M = 67.81; at k = 33,
    log2 M = 69.04. Note what this already says with no convention at all: a
    table of 2^68 cells is not a quantity any adversary holds, and the headline
    multi-target figure is quoted at the q that requires it.

    PART 2 -- THE CHARGE. Under a convention in which a random access into M
    cells costs M^theta unit operations, the per-trial cost is (1 + M^theta) and
    the charged total is W_theta(q) = U(q) * M(q)^theta up to the additive 1.
    theta = 1/2 is the two-dimensional area-time charge: a memory of M cells
    occupies area M and its diameter is sqrt(M), so a signal crossing it costs
    sqrt(M) time; theta = 1/3 is the three-dimensional analogue; theta = 0 is
    the free-RAM convention under which every published figure this program has
    seen is quoted; theta = 1 is a serial scan and is included as the pessimistic
    end of the ladder, not as a claim that anyone would scan.
    PRE-REGISTERED VALUES AT q = 2^64, log2 W_theta, for theta = 0 / 1/3 / 1/2 /
    2/3 / 1 (PROPOSAL-COMPUTED, exact-integer T_k, to be reproduced in-harness):
      128s  133.7 / 156.3 / 167.6 / 178.9 / 201.5
      128f  128.4 / 151.4 / 162.9 / 174.4 / 197.4
      192s  193.9 / 216.6 / 227.9 / 239.3 / 262.0
      192f  194.4 / 217.4 / 228.9 / 240.4 / 263.4
      256s  256.0 / 278.8 / 290.2 / 301.6 / 324.5
      256f  255.6 / 278.6 / 290.2 / 301.7 / 324.7

    PART 3 -- THE ERASURE TEST, WHICH IS THE SHARP PART. The multi-target
    advantage over the single-target/union-bound regime is log2 A =
    log2(T_k(lambda)/lambda). The theta = 1/2 charge costs (1/2) log2(q k). The
    NET multi-target gain under the area-time convention is therefore
      net(set) = log2 A - (1/2) log2(q k),
    which is a subtraction of two independently derived quantities and can come
    out either sign. Pre-registered, at q = 2^64:
      128s  33.271 - 33.904 = -0.633   ERASED
      128f  71.595 - 34.522 = +37.073
      192s  43.102 - 34.045 = +9.057
      192f  71.595 - 34.522 = +37.073
      256s  52.001 - 34.230 = +17.771
      256f  63.401 - 34.565 = +28.836
    The sign flip at exactly one of six sets is what makes this a measurement
    rather than a slogan, and it is a prediction that a small error in either
    term would visibly break.

    PART 4 -- THE QUANTUM ROWS, AND WHY THEY MUST CARRY A REFERENCE COLUMN.
    Grover search over a trial space of size N = 1/p needs about sqrt(N)
    iterations, each evaluating the membership test in superposition. Two
    conventions bite immediately and independently:
      (a) DEPTH CAP. Under a maximum circuit depth D, a search of size N is run
          on about N/D^2 parallel machines each of depth D, for a TOTAL gate
          count of about N/D -- so the depth cap converts a square-root speedup
          into a division by D. NIST's convention values for D are
          RECALLED-UNVERIFIED as 2^40, 2^64 and 2^96, and the register carries
          all three as rows rather than picking one.
      (b) QRAM. Every Grover iteration must query the q*k table coherently. If
          coherent random access to M cells is free the numbers are one thing;
          if it costs M^theta they are another, and the M^theta charge applies
          INSIDE the iteration, i.e. it multiplies the iteration count.
    THE LOAD-BEARING METHODOLOGICAL POINT, AND THE REASON THIS RECORD REFUSES TO
    QUOTE A SINGLE QUANTUM BIT COUNT: NIST's security categories are themselves
    DEFINED relative to AES-128 / AES-192 / AES-256 key search under a stated
    convention. A quantum cost for SLH-DSA computed under convention X is
    comparable ONLY to the AES reference computed under the SAME X. Every row of
    the register therefore carries an AES-128 reference cell computed by the
    identical pipeline, and the reported quantity is the RATIO to that cell, not
    a bare exponent. A bare quantum exponent compared against 128 is the error
    the register is built to prevent. KN-OPEN-014 records the same disease in
    the CSIDH/Kuperberg setting -- "concrete estimates vary widely across
    analyses" -- and is the corpus's worked precedent for it.

    PART 5 -- THE DATA AXIS, WHICH BINDS FIRST AND WHICH NOBODY CHARGES AT ALL.
    Before memory, the attack needs q signatures from ONE key pair. At q = 2^64
    and an optimistic 10^6 signatures per second that is about 2^{44} seconds,
    of order 5.8 x 10^5 years of continuous signing under a single key.
    (Arithmetic: 2^64 / 10^6 s = 1.8 x 10^{13} s; a Julian year is
    3.156 x 10^7 s.) The register therefore carries a DATA row: for each
    parameter set, the largest q reachable under a stated signing-rate-times-
    lifetime budget, and the resulting cost. THIS IS THE ROW MOST LIKELY TO
    DOMINATE THE HONEST ANSWER, and it is the one the headline figure implicitly
    sets to infinity.

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_searched:
      - knowledge/ (sphincs, SLH-DSA, FORS), ledger/, experiments/, docs/
    findings:
      - >-
        No experiment or evidence record in area SLHDSA exists. No record in the
        corpus charges memory for any hash-based signature.
      - >-
        The session angle brief reports 75 of 229 evidence records charging
        wall-clock only, 82 never mentioning memory, and dominated_by absent
        from 95 of 131 cost-claiming records; and it reports that no
        cost-convention register exists anywhere in the corpus. THESE ARE
        RELAYED SCOUT COUNTS, not recounted by this record.
      - >-
        KN-OPEN-014 is the corpus's own worked instance of a security claim
        resting on contested quantum constants where the answer is a range
        indexed by convention. It is about CSIDH, not SLH-DSA; it is cited here
        as a METHODOLOGICAL precedent and for nothing else.
    conclusion: >-
      Novelty unverified, and discounted per angle-brief T-H. Area-time charging
      and MAXDEPTH are standard external technique; their application to the
      FORS multi-target attack is not recorded in this corpus, which is all this
      screen can support.

  assumptions:
    - >-
      C1. The recalled FIPS 205 parameter sets and the recalled q_max = 2^64.
      Every number moves if one triple is wrong.
    - >-
      C2. IDEA-20260805-fbe36a's closed form U(q) = 2^{ak}/T_k(q/2^h) is
      correct. This record is DOWNSTREAM of that audit and must not be run
      before it, or it will charge memory for a cost model that is itself wrong.
      The experiment enforces the ordering.
    - >-
      C3. M = q*k index cells is the honest working-set size. It is a LOWER
      bound (it omits the preimages, the hash-table overhead, and the
      authentication paths), so conclusions of the form "charging matters" are
      conservative and conclusions of the form "charging does not matter" are
      NOT. That asymmetry is stated because it decides which direction of the
      finding is safe to report.
    - >-
      C4. The convention formulas (M^theta access, N/D Grover-under-depth-cap)
      are RECALLED-UNVERIFIED standard forms. Each is re-derived in the
      experiment from its one-line physical argument, and a disagreement between
      the recalled and the derived form is recorded rather than reconciled
      silently.
    - >-
      C5. NIST MAXDEPTH values 2^40 / 2^64 / 2^96 and the AES-referenced
      category definitions are RECALLED-UNVERIFIED. They are ROW LABELS: if the
      values are wrong the rows are relabelled and no other number changes,
      which is a deliberate property of the register format.

  heuristic_assumptions:
    - id: HEUR-SLHDSA-COST-1
      formal_statement: >-
        A random access into a memory of M cells costs at least M^{1/2} time
        units in any two-dimensional physical layout, and at least M^{1/3} in
        three dimensions.
      rigorous_support: >-
        The diameter argument: M cells laid out in a plane occupy area
        proportional to M and have diameter proportional to sqrt(M); a signal
        must cross it. This is a physical lower-bound argument, not a
        distributional one, and it is the same argument the area-time literature
        rests on. It is NOT a statement about any particular machine, and a real
        machine with a smaller working set beats it.
      random_model_justification: not applicable -- a geometric argument, not a random-model one.
      validation_plan: >-
        Re-derive from the diameter argument in the experiment and state the
        derivation. No measurement is possible or claimed.
      falsification_condition: >-
        A stated layout achieving sub-sqrt(M) random access in two dimensions.
        (None is expected; the entry exists so the assumption is attackable.)
    - id: HEUR-SLHDSA-COST-2
      formal_statement: >-
        Under a maximum circuit depth D, Grover search over N candidates costs
        about N/D total gates rather than sqrt(N).
      rigorous_support: >-
        Parallel Grover over m machines gives only a sqrt(m) advantage, so to
        respect depth D one partitions into N/D^2 subspaces of size D^2 each,
        each searched in depth D; total gates about (N/D^2)*D = N/D. RECALLED
        FORM, re-derived in the experiment.
      random_model_justification: not applicable.
      validation_plan: >-
        Re-derivation plus a consistency check: the same formula applied to
        AES-128 key search must reproduce whatever the NIST category definition
        implies, and if it does not, the formula or the recalled category
        definition is wrong and the discrepancy is the finding.
      falsification_condition: >-
        The AES-128 reference cell computed by this pipeline disagreeing with
        the recalled category definition. In that case NO SLH-DSA quantum number
        is reported at all.

  predictions:
    - metric: >-
        R1 -- log2 W_theta(2^64) for the six sets at theta in {0, 1/3, 1/2, 2/3, 1}
      direction: higher
      minimum_effect: >-
        Within 0.1 bits of the 30-entry table in mechanism Part 2, CONDITIONAL on
        the recalled parameters surviving. Monotone increasing in theta at every
        set, with the theta = 0 column equal to IDEA-20260805-fbe36a's C2 column
        EXACTLY -- a cross-record consistency check that can fail.
    - metric: >-
        R2 -- net(set) = log2 A - (1/2) log2(q k) at q = 2^64
      direction: different
      minimum_effect: >-
        NEGATIVE at 128s (predicted -0.633) and POSITIVE at all five other sets
        (predicted +37.073, +9.057, +37.073, +17.771, +28.836). The SIGN PATTERN
        is the prediction. A uniform sign across all six sets falsifies the
        record's central observation.
    - metric: >-
        R3 -- null control: W_theta at q = 1 (single signature, single target)
      direction: different
      minimum_effect: >-
        EXACTLY EQUAL to W_0 at q = 1 for every theta, because M(1) = k cells and
        the charge k^theta is a fixed small factor that must be reported rather
        than hidden. Sharper forced value: the DIFFERENCE W_theta - W_0 at q = 1
        equals exactly theta*log2(k) bits. This null can fail: any implementation
        that applies the charge to the trial count rather than to the table will
        miss it.
    - metric: >-
        R4 -- positive control: AES-128 exhaustive key search through the
        identical charging pipeline
      direction: different
      minimum_effect: >-
        The memory charge must be EXACTLY 0 bits for every theta, because
        exhaustive key search holds O(1) state. Charged cost must equal uncharged
        cost must equal the classical reference for category 1 under the free-RAM
        row. IF THE PIPELINE ADDS ANY MEMORY CHARGE TO AES KEY SEARCH IT IS
        BROKEN AND NO SLH-DSA NUMBER MAY BE REPORTED FROM IT.
    - metric: >-
        R5 -- graded control on theta with 5 points, monotonicity reported (the
        theta ladder itself), plus a second graded control on q with 6 points
        q in {2^20, 2^30, 2^40, 2^50, 2^60, 2^64}
      direction: higher
      minimum_effect: >-
        W_theta monotone increasing in theta at fixed q for every set; and, along
        the q ladder at theta = 1/2, a MINIMUM in q that is interior or at the
        right endpoint but never at q = 1. Reporting where the charged optimum
        sits is the deliverable of this control: it says how much data the
        attacker actually wants once its storage is charged, which is a question
        nobody in this corpus has asked of any scheme.
    - metric: >-
        R6 -- data row: largest q reachable under a signing budget of 10^6
        signatures per second for 10 years under one key, and W_{1/2} at that q
      direction: lower
      minimum_effect: >-
        q_reachable approximately 2^{48.2} (10^6 * 3.156 x 10^8 s = 3.16 x 10^{14}
        = 2^{48.17}), giving lambda ~ 2^{-14.8} at h = 63 and an amplification
        under 8 bits at every set. PRE-REGISTERED CONCLUSION IF THIS HOLDS: at
        any signature budget a real deployment can reach, THE MULTI-TARGET TERM
        IS WORTH SINGLE-DIGIT BITS, and the headline multi-target figure is a
        statement about an unreachable q. This is the strongest honest sentence
        available in this goal and it is entirely a defender-side sentence.

  minimal_test:
    design: >-
      Carried by experiments/EXP-SLHDSA-9cbad4/specification.yaml as Stage 6,
      strictly after the Stage 1-3 arms that establish U(q). Zero new
      mathematics beyond closed forms; the whole stage is a table build plus its
      controls. It requires no primary text and therefore survives the goal's
      source-availability pause_condition, though the parameter constants it
      consumes do not.
    controls:
      - >-
        NULL OBJECT (same shape, forced value pre-derived, CAN FAIL): the
        single-signature attack q = 1, whose table is k cells and whose charge is
        forced to exactly theta*log2(k) bits. An implementation that charges the
        trial count instead of the table fails this immediately.
      - >-
        POSITIVE CONTROL WHERE THE EFFECT MUST BE ABSENT: AES-128 exhaustive key
        search, memory O(1), forced memory charge exactly 0 bits under every
        theta. This is the anchoring control for the whole register and it also
        supplies the reference cell every quantum row is reported against. If it
        fails, nothing may be reported.
      - >-
        SECOND POSITIVE CONTROL WHERE THE EFFECT MUST BE PRESENT: a plain
        meet-in-the-middle / birthday collision search on an n-bit hash, whose
        memory is 2^{n/2} and whose theta = 1/2 charge is forced to exactly n/4
        bits. Two controls in opposite directions -- one where the charge must
        vanish and one where it must equal a specific number -- bracket the
        instrument.
      - >-
        GRADED CONTROLS, two of them, both with >= 5 interior points: theta in
        {0, 1/3, 1/2, 2/3, 1} and q in {2^20, 2^30, 2^40, 2^50, 2^60, 2^64}.
        Monotonicity reported for both; a non-monotone theta ladder localises the
        defect in the charge, a non-monotone q ladder in the moment.
      - >-
        CROSS-RECORD CONSISTENCY CONTROL: the theta = 0 column must reproduce
        IDEA-20260805-fbe36a's C2 column exactly. Two records computing the same
        column by the same route is not independence and is not claimed as such;
        it is a wiring check.
      - >-
        ORDERING CONTROL: the AES-128 and birthday control cells are computed,
        hashed and committed before any SLH-DSA cell is looked at.
      - >-
        ARCHIVE CHECK (zero compute): no prior charged cost for any hash-based
        signature exists in this corpus. Recorded as unavailable.
    required_metrics:
      - the full theta x parameter-set register, log2, with the AES-128 reference cell per row
      - net(set) with its sign, per set
      - the q ladder at theta = 1/2 with the location of the charged optimum
      - the data row with its signing-budget assumption stated as a number
      - the quantum rows per MAXDEPTH value and per QRAM convention, each as a RATIO to its AES reference
      - both positive controls and the null, with their forced values and outcomes

  falsification_conditions:
    - >-
      The AES-128 control acquires a non-zero memory charge. Instrument broken;
      no number reported.
    - >-
      The birthday control's theta = 1/2 charge is not exactly n/4 bits.
      Instrument broken.
    - >-
      The q = 1 null's charge is not exactly theta*log2(k). The charge is being
      applied to the wrong quantity.
    - >-
      The theta = 0 column disagrees with IDEA-20260805-fbe36a's C2 column. One
      of the two records is wrong and the conflict is routed to a correction
      rather than absorbed.
    - >-
      net(set) has the same sign at all six sets. The record's central
      observation -- that the convention flips a verdict for one set and not
      others -- is false and the record must be superseded.
    - >-
      The theta ladder is non-monotone. Arithmetic defect.
    - >-
      The recalled Grover-under-depth-cap formula, re-derived, gives an AES-128
      reference inconsistent with the recalled category definition. NO quantum
      row is reported; the inconsistency itself is the deliverable.

  confounders:
    - >-
      CONVENTION SHOPPING. A register with many rows invites picking the row
      that makes the point. The mitigation is structural: every row is reported,
      the row label travels with every number, and the record states in advance
      that theta = 0 is the convention under which every published figure this
      program has seen is quoted.
    - >-
      M = q*k IS A LOWER BOUND. Conclusions that charging matters are therefore
      conservative; conclusions that it does not are NOT, and must not be drawn
      from this record.
    - >-
      RECALLED CONVENTION CONSTANTS. MAXDEPTH values and the AES-referenced
      category definitions are remembered, not read. The register format
      contains this: they are labels, and relabelling costs nothing.
    - >-
      COMFORT. Every finding here makes SLH-DSA look stronger. That is the
      direction in which an error is least likely to be caught, which is why two
      positive controls in opposite directions and a null are required before
      any cell is reported.
    - >-
      THE ATTACKER MAY NOT NEED THE WHOLE TABLE. A smarter attacker might trade
      table size for trials (e.g. keep only high-occupancy leaves). This is a
      REAL uncharged possibility and the record does not pretend otherwise; it
      is named as the first thing a red team should attack, and the honest
      statement is that the register costs THE ATTACK AS DESCRIBED, not the
      optimal attack.

  interpretation_limits:
    - >-
      NO ATTACK IS PROPOSED, IMPROVED, OR CLAIMED. The cost of an existing
      generic attack is recomputed under stated conventions.
    - >-
      The register is a statement about the FORS layer only, under the
      random-oracle idealization of the digest split, and only about the attack
      as described in mechanism Part 1.
    - >-
      Nothing here bears on fault, Rowhammer, or memory-corruption results.
      Separate claim class, untouched.
    - >-
      "The margin is larger than the headline" is a statement about THE HEADLINE
      AND ITS CONVENTION, not a security guarantee. It must never be quoted as
      "SLH-DSA has 40 bits of extra margin".
    - >-
      A table computed at recalled constants inherits their status. Until Stage 0
      verifies the parameter sets, every cell is conditional and is labelled so.

  target_complexity:
    time_exponent: >-
      No exponent is moved and this record says so plainly. What it changes is
      the EXPONENT'S LABEL: the same attack costs 2^{133.7} under theta = 0 and
      2^{167.6} under theta = 1/2 at 128s. That is a 33.9-bit relabelling of an
      existing exponent, in the defender's favour, and it is a cost-accounting
      result, not an algorithmic one.
    memory_exponent: >-
      log2 M = 67.8 to 69.1 across the six sets at q = 2^64, i.e. the attack's
      memory exponent is about 0.53 to 0.54 of its uncharged time exponent at
      128s and far less at the larger sets. This is the number the corpus does
      not have for this scheme.
    best_known: >-
      The generic FORS interleaved-target attack, time-only, as costed by
      IDEA-20260805-fbe36a.
    hidden_overhead: >-
      Hash-table constant factors, the n-byte preimage storage for the winning
      trial, parallelization losses, and the data-acquisition wall clock. The
      first three are omitted (conservative direction stated in C3); the fourth
      is promoted to its own row.
    tradeoff_note: >-
      The entire deliverable is a trade surface in (theta, q). Reporting a point
      on it without its coordinates is the failure this record names.

  dominated_by: >-
    n/a (no result claimed; no attack, no algorithm, no Pareto point of this
    record's own). Rows checked, as required, across every axis before writing
    n/a: (i) TIME -- the attack costed is the incumbent and is not improved, so
    there is nothing to dominate it; (ii) MEMORY -- this record introduces the
    memory column for this scheme, so there is no incumbent memory figure in
    this corpus to be dominated by; the external literature may well hold one
    and that is recorded as UNCHECKED rather than as absent; (iii) DATA/QUERIES
    -- q is the register's independent variable; (iv) DEPTH/PARALLELISM -- the
    quantum rows charge depth explicitly, which is more than the incumbent
    free-RAM figure does, so the incumbent does not dominate on that axis either;
    (v) corpus frontier for RQ-SLHDSA-001 -- IDEA-20260801-009 (toy ratio, no
    runs), IDEA-20260805-fbe36a (time-only closed form, an INPUT here), and
    IDEA-20260805-705614 (quantifier audit, disjoint axis). None dominates and
    none is dominated. Absence of an external check is stated, not converted
    into absence of external work.
  sota_delta: >-
    Zero on every attack axis: no attack is improved. The measurable deltas are
    accounting deltas and are stated as numbers, not adjectives: +33.9 bits at
    128s from theta = 0 to theta = 1/2 (+22.6 at theta = 1/3, +67.8 at
    theta = 1); a multi-target net gain of -0.6 bits at 128s versus +37.1 at
    128f under the same convention; and a drop of the multi-target amplification
    from 33.3 bits at q = 2^64 to under 8 bits at the largest q a ten-year
    10^6/s signing budget can reach.

  estimated_cost:
    implementation: low
    compute: very low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.80 that the register builds and its controls pass. It is not higher
    because it inherits ALL of IDEA-20260805-fbe36a's parameter risk plus its
    own convention-constant risk (MAXDEPTH values and the AES-referenced
    category definitions are recalled), and because the "attacker may not need
    the whole table" objection is a genuine hole that a red team should be able
    to widen. It is not lower because every computation is a closed form over
    exact integers, because the two positive controls have forced values that
    are trivial to check, and because the record's honest conclusion does not
    depend on any single row: whichever theta is right, the data row of Part 5
    stands on arithmetic that needs no convention at all. Separately: 0.25 that
    the sign flip at 128s survives a red-team re-derivation of M, because -0.633
    bits is inside the uncertainty of any reasonable re-accounting of the
    table's true cell count -- and that fragility is stated here rather than
    discovered later.

