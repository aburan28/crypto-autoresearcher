idea:
  id: IDEA-20260811-565915
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-VOLC-f6253b
  goal_id: GOAL-ENDO-001
  title: >-
    THE IDENTIFIABILITY COLLAPSE IS FATAL TO REGRESSION AND HARMLESS TO
    DERIVATION: inside one class every level quantity is a function of the single
    integer f_E, so the effective sample size is #div(f) and no regression can
    work -- but the DEGREE of the minimal non-scalar endomorphism is
    |D_0| f_E^2 / 4 EXACTLY, a quantity that varies by a factor f^2 = 256 on the
    committed class, is derived rather than fitted, and prices every R3-flavoured
    construction in the campaign at one field-operation count per level
  class: measurement

  claim: >-
    (A) THE COLLAPSE, STATED SO NO SUCCESSOR DESIGN REPEATS IT. Fixing the
    isogeny class fixes t, hence D = t^2 - 4p, hence D_0 and f. Every regressor
    the volcano lane is tempted to use is then a function of the single divisor
    f_E | f: disc End(E) = D_0 f_E^2; the ell-level is v_ell(f_E); the minimal
    non-scalar norm is |D_0| f_E^2/4 + O(f_E); and |Aut| is 2 throughout unless
    D_0 in {-3, -4}, which T4 fixes for the whole class. On p = 4001, t = 30 that
    is FIVE distinct design points over 138 curves, with n = 3 at the crater. Any
    within-class regression of a cost functional on these quantities is
    unidentifiable as stated, and this record refuses that design explicitly
    rather than running it.
    (B) THE ESCAPE THIS RECORD USES. Do not regress: DERIVE, then measure the one
    quantity the derivation predicts, with the level as an exact label rather
    than a covariate. The derived quantity is
    deg(alpha_min) = N(alpha_min) = min over alpha in O_{f_E} \ Z of Norm(alpha)
    = f_E^2 (|D_0| + 1)/4 for D_0 = 1 mod 4 (and f_E^2 |D_0|/4 for D_0 = 0 mod 4),
    exactly, because the degree of an endomorphism is its norm. On the committed
    class this is 15, 59, 236, 944, 3776 at levels 0..4 -- a factor 256 spread
    with an exact predicted value at every level.
    (C) THE COST STATEMENT, WHICH IS WHAT MAKES IT A MEASUREMENT AND NOT A
    TAUTOLOGY. Evaluating alpha_min on a point costs Theta(deg alpha_min) field
    operations by Velu-style evaluation of its kernel polynomial, or
    Theta(sqrt(deg)) with a baby-step giant-step evaluation of the rational map.
    The prediction is therefore quantitative and directional: measured field
    operations per evaluation grow QUADRATICALLY in f_E (slope 2.00 +/- 0.15 on a
    log-log fit against f_E over the five levels) for the direct evaluation, and
    LINEARLY (slope 1.00 +/- 0.15) for the square-root-time variant. A flat
    measured cost falsifies the cost model; a slope near 2 confirms that the
    crater carries a genuinely and hugely cheaper non-scalar endomorphism than
    the floor.
    (D) THE HONEST CEILING, STATED BEFORE THE MEASUREMENT. By H-ENDO-001, used as
    the admissibility filter and not retested, alpha_min acts on G as a scalar and
    therefore buys nothing on the prime-order subgroup no matter how cheap it is.
    The value of (C) is that it prices, once and for all, every construction in
    this campaign whose cost is the cost of APPLYING an endomorphism at the field
    level (R1/R2 uses such as rational-map factor-base images), and it does so
    per level with an exact formula instead of a fitted coefficient. Any lane
    that wants a cheap alpha must ascend the volcano, and this record says
    exactly what ascent is worth: a factor f_E^2, and nothing else.

  mechanism: >-
    End_{F_p}(E) = O_{f_E} = Z + f_E O_K. For alpha = u + v f_E omega_K with
    v nonzero, Norm(alpha) is a positive definite binary quadratic form of
    discriminant D_0 f_E^2, so its minimum over v nonzero is Theta(|D_0| f_E^2),
    attained at v = 1 and the nearest integer u. Degree equals norm for
    endomorphisms of an elliptic curve, and the degree is exactly the size of the
    kernel, which is what a Velu evaluation walks. So the endomorphism ring's
    depth in the volcano is not merely a label: it is a quadratic cost multiplier
    on every explicit use of the ring.

  tracked_object: >-
    The minimal non-scalar endomorphism alpha_min of E, carried as the pair
    (its norm, its kernel polynomial). Followed through the computation as an
    explicit rational map, not as an abstract ring element.

  resource: >-
    R3 (End(E) as a ring) made explicit as R1/R2 (a rational map on
    x-coordinates). The R3-only use would be inadmissible under H-ENDO-001; what
    is measured here is the FIELD-LEVEL cost of realising the ring element, which
    is a legitimate R1/R2 quantity.

  lossy_projection_test: >-
    PASSES. The projection E -> (level, deg alpha_min) discards the
    j-invariant entirely: 72 curves at the floor share one value. What is
    retained propagates deterministically under the class's operations: a
    horizontal isogeny of any degree fixes the level and hence fixes
    deg alpha_min exactly; a vertical ell-isogeny multiplies it by ell^{+-2}.
    That is an exact one-step propagation rule with a stated direction, which is
    what the protocol asks for and what a mere label would not supply. Note the
    contrast with the campaign's own lesson: an exact 30.8 percent structural
    reduction moved a cost functional by -0.44 percent, so "the crater has a
    smaller endomorphism" is NOT by itself a reason to expect anything cheaper --
    the record therefore predicts a cost only for the operation whose complexity
    is literally the degree, and predicts nothing for solving time.

  t5_reachability: >-
    SATISFIED, and unusually cleanly, which is why it is worth saying. The crater
    is reachable by ASCENT, and ascent is canonical and polynomial: from a
    non-crater vertex there is exactly one ascending ell-isogeny, so no search is
    involved and no vectorization is invoked. The level is also locally testable
    (count roots of Phi_ell(j, Y), or use the group-structure shortcut of
    IDEA-20260808-4d77a6 where non-vacuous). So goodness in the sense of this
    record is both common and locally detectable, and T5 does not bind. What
    binds is (D): the prize behind the gate is worth nothing on G.

  null_object: >-
    A curve at the SAME level in a DIFFERENT isogeny class with the same |D_0|
    but different p, on which the identical evaluation-cost measurement must
    produce the same field-operation count. If the measured cost tracks p rather
    than deg alpha_min, the instrument is reading field arithmetic size and not
    the endomorphism. Second null: a random rational map of matched degree with
    no endomorphism structure, evaluated identically; its cost must match, and if
    the endomorphism is measurably CHEAPER than a generic map of the same degree
    that is an unexpected observation to record, not to bury.

  why_not_a_renamed_known_approach: >-
    The formula N(alpha_min) ~ |D| / 4 is elementary and appears already in
    MATCHED-ORDER-DESIGN.md as a column of the identifiability table. Two things
    are new here. First, the table is used in the OPPOSITE direction from the
    design note: there it is a reason the regression fails, here it is the reason
    a derivation succeeds. Second, nothing in this program has ever measured the
    field-operation cost of evaluating an endomorphism at any level, so the
    quadratic law of (C) is an untested prediction rather than a restatement.

  novelty_status: adaptation
  novelty_screen: >-
    Corpus screen this session over the RQ-VOLC lane (IDEA-20260807-4f43ac,
    -3c6bd8, -bb03d3, -b1b604, -a6fb2a, -a2b59a, -3f5545, -cbe8c1, -5cabfc, and
    IDEA-20260808-4d77a6), plus DECOMPOSITION.md L2 and MATCHED-ORDER-DESIGN.md
    sections 1-2. None of those records measures or predicts an endomorphism
    EVALUATION cost; they measure or detect the LEVEL. WEB SEARCH UNAVAILABLE
    this session; the norm-form minimum and Velu cost are classical and are not
    claimed as novel.

  discriminated_from: >-
    NOT IDEA-20260808-4d77a6 or IDEA-20260807-b1b604 or -a6fb2a, which are three
    competing LEVEL DETECTORS; this record takes the level as given and prices
    what the level buys. NOT IDEA-20260807-3f5545 (level-vector variance
    decomposition against a permutation null), which is exactly the regression
    design that (A) declares unidentifiable inside one class -- this record's
    contribution is to say so with the arithmetic and to offer the derived
    alternative. NOT IDEA-20260807-5cabfc, which closes vertical transport on G;
    that closure is consumed here as (D) rather than re-argued.

  assumptions:
  - >-
    E ordinary over F_p, End_{F_p}(E) = O of conductor f_E, D = t^2 - 4p =
    D_0 f^2, and the level of E at ell is v_ell(f_E) (Kohel; Fouquet-Morain;
    Sutherland) [recall-confident, not verified this session].
  - >-
    deg alpha = Norm(alpha) for alpha in End(E); the kernel polynomial has degree
    (deg alpha - 1)/2 for odd degree, and a Velu evaluation costs Theta(deg)
    field operations [recall-confident].
  - >-
    An independent level labeller is available. This record does not supply one
    and does not accept the committed 2-torsion-count labelling, which resolves
    2 of 5 levels.

  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
    - transform: null
      proposed_object: null
      predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
    - claim: null
      responsibility: null
    not_applicable_reason: >-
      Empirical cost measurement of an already-proved algebraic identity. The
      identity deg alpha = Norm(alpha) and the norm-form minimum are classical
      and are not the object of a proof search; what is proposed is a
      field-operation count with a pre-registered scaling law. The one part that
      would be proof-oriented -- whether a cheaper non-scalar endomorphism can be
      constructed at a given level -- is answered by the norm-form minimum
      itself and is recorded here as a lower bound, not as a conjecture.

  predictions:
  - metric: measured_norm_of_minimal_non_scalar_endomorphism_per_level
    direction: different
    minimum_effect: >-
      EXACTLY 15, 59, 236, 944, 3776 at levels 0, 1, 2, 3, 4 on the committed
      class (D_0 = -59, f_E = 1, 2, 4, 8, 16). Any deviation on any curve
      falsifies either the level label or the norm-form computation, and the two
      are separated by recomputing the norm form directly from f_E.
  - metric: field_operations_per_endomorphism_evaluation_vs_f_E
    direction: higher
    minimum_effect: >-
      Log-log slope against f_E of 2.00 +/- 0.15 for direct Velu evaluation.
      A measured slope below 1.5 falsifies the degree-dominated cost model; a
      slope above 2.5 means the implementation carries a hidden per-step cost
      that must be found before any level comparison is believed.
  - metric: within_level_variance_of_evaluation_cost
    direction: different
    minimum_effect: >-
      Below 5 percent relative standard deviation within each level, since every
      member of a level has the same order and hence the same alpha_min norm.
      Larger within-level spread than between-level spread means the instrument
      is measuring the implementation, not the mathematics.
  - metric: solving_cost_change_attributable_to_level
    direction: different
    minimum_effect: >-
      PRE-REGISTERED AS ZERO. No change in any ECDLP-relevant cost functional is
      predicted from the level, per H-ENDO-001 and IDEA-20260807-5cabfc. A
      measured change above the sqrt(6) baseline-calibration band would be the
      one interesting event in this lane and would require independent review
      before interpretation.

  minimal_test:
    design: >-
      On the committed p = 4001, t = 30 class: for each of the five levels take
      all members (3, 9, 18, 36, 72), compute O_{f_E}, its minimal non-scalar
      element by reducing the norm form, construct that endomorphism explicitly
      as a rational map via its kernel polynomial, and count FIELD OPERATIONS to
      evaluate it on 1000 random points, with an explicit counter rather than
      wall-clock. Report per-level medians and the full distribution, never a
      single mean (committed failure mode N5). Then repeat on one second class at
      a different p with a different D_0 as the transfer check.
    controls:
    - >-
      NULL: a random degree-matched rational map with no endomorphism structure,
      evaluated by the same counter.
    - >-
      PLANTED: the scalar endomorphism [2], whose degree is 4 and whose cost the
      counter must report at the predicted value; a counter that misprices a
      known map is void.
    - >-
      INDEPENDENT LEVEL LABELS from two labellers, agreeing on all 138, before
      any per-level aggregation.
    - >-
      Verify T1 explicitly: alpha_min has degree coprime to N = 3972's prime
      part? NO -- alpha_min is an endomorphism, not an isogeny to another curve,
      and its action on G is a scalar; the check to run is that the computed map
      restricted to G equals multiplication by the predicted eigenvalue lambda
      mod the prime part of #E, which is a cheap and decisive implementation
      test.
    required_metrics:
    - per_curve_f_E_and_level_from_two_labellers
    - per_curve_norm_of_alpha_min
    - field_operations_per_evaluation_median_and_full_distribution
    - eigenvalue_check_of_alpha_min_on_G
    - null_and_planted_counter_values

  falsification_conditions:
  - >-
    Measured alpha_min norms disagree with |D_0| f_E^2/4 rounded as stated. The
    level labels or the norm-form reduction are wrong; the record's arithmetic
    core fails.
  - >-
    Evaluation cost is flat in f_E. The degree-dominated cost model is wrong and
    the quadratic prize of ascent is illusory, which would be a genuine negative
    with a named mechanism (some other term dominates) and is worth recording.
  - >-
    alpha_min does not act as a scalar on the prime-order subgroup. This
    contradicts H-ENDO-001, is far likelier to be an implementation error than
    mathematics, and must be replicated independently before any report.
  - >-
    Within-level spread exceeds between-level spread. The instrument is void.

  confounders:
  - >-
    EFFECTIVE SAMPLE SIZE 5. Every per-level number is one design point, not a
    sample of 3 or 72. No p-value may be computed across levels; the record's
    predictions are exact values and slopes, deliberately, so that the analysis
    needs no inference.
  - >-
    Field-operation counters differ between representations (affine vs Jacobian).
    Fix one representation in advance and report it.
  - >-
    On the committed class D_0 = -59 is fixed, so |D_0| and f_E cannot be
    separated. Separating them requires the matched-order family of
    MATCHED-ORDER-DESIGN.md, where D_0 varies at fixed N; that is the stated
    transfer arm and it is not a within-class contrast.

  interpretation_limits:
  - >-
    TOY SCALE, claim_tier toy, one class plus one transfer class. NO ATTACK, NO
    EXPONENT, NO SPEEDUP; sota_delta zero.
  - >-
    A confirmed quadratic law is a statement about evaluating endomorphisms, not
    about solving discrete logarithms. H-ENDO-001 caps the downstream value at
    the automorphism discount, and any claimed advantage at or below sqrt(6) is
    baseline calibration per KN-TECH-018.
  - >-
    KN-FIND-b7e091 binding and unrevisited; P2 respected (no equivariant factor
    base is built, no phi-stable structure is tested).

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      For the orders arising as End_{F_p}(E) inside one ordinary isogeny class,
      the minimum of the norm form over non-integer elements is attained at
      v = 1, so that N(alpha_min) = f_E^2 (|D_0| + 1)/4 + O(f_E) rather than at a
      larger v with cancellation.
    rigorous_support: >-
      Rigorous, not heuristic, for a reduced positive definite form: the minimum
      over v nonzero of u^2 + u v f_E b + v^2 f_E^2 c is attained at |v| = 1 for
      a reduced form, since increasing |v| increases the form's value by at least
      the leading coefficient. It is listed as a named assumption only because
      the reduction step must actually be performed per level rather than assumed.
    validation_plan: >-
      Exhaustive at toy scale: for each of the five orders enumerate all alpha
      with |u|, |v| <= 50 and confirm the minimum is attained at |v| = 1, in a
      single loop costing microseconds. Comparison distribution: none needed, the
      check is exhaustive over a range that provably contains the minimum by the
      reduction bound. Tail check: confirm the SECOND smallest non-scalar norm is
      also as predicted, since a construction wanting two independent
      endomorphisms would consume it.
  - id: HA-2
    statement: >-
      Velu evaluation of a degree-d endomorphism costs c*d field operations with
      c independent of the level, uniformly over the five orders.
    rigorous_support: >-
      Velu's formulas cost O(d) field operations for a kernel of size d
      [recall-confident]; what is assumed is the constancy of the implicit
      constant across the specific kernel polynomials arising here, which is an
      implementation property and is exactly what the measurement tests.
    validation_plan: >-
      The measurement itself validates it: fit c per level and require the five
      fitted constants to agree within 15 percent. Divergence localises the
      confound in the implementation rather than in the mathematics, which is the
      point of fitting c per level instead of pooling.

  target_complexity:
    time_exponent: >-
      No attack exponent claimed or moved. The measured quantity is a
      field-operation count that scales as f_E^2 <= f^2 <= |D| = O(p), so the
      worst case for an explicit endomorphism evaluation on an ordinary curve is
      Theta(p) operations at the floor and Theta(|D_0|) at the crater -- which is
      itself a useful bound for any lane contemplating explicit endomorphism use.
    memory_exponent: >-
      O(deg alpha_min) field elements for the kernel polynomial, i.e. up to
      Theta(p) at the floor and Theta(|D_0|) at the crater; the square-root-time
      variant trades this to Theta(sqrt(deg)).
    best_known: >-
      Parallel Pollard rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-001,
      KN-TECH-006); the automorphism-discounted variant on CM curves
      (KN-TECH-018).
    hidden_overhead: >-
      The ascent to the crater is polynomial but not free: it costs one vertical
      ell-isogeny per level with kernel-polynomial work Otilde(ell^2) or more,
      and any lane that uses the crater's cheap endomorphism must charge that
      ascent once. Stated here so it is not omitted later.
    tradeoff_note: >-
      Direct evaluation is Theta(d) time and Theta(d) memory; the baby-step
      giant-step evaluation of the rational map is Theta(sqrt(d)) time with
      Theta(sqrt(d)) memory. Both are measured, so the lane gets the tradeoff
      curve rather than a point.

  dominated_by: >-
    As an attack: dominated by every frontier row, since no attack is claimed --
    parallel rho with distinguished points at 0.886 sqrt(N) and O(1) memory
    (KN-TECH-001, KN-TECH-006), the automorphism-discounted variant
    (KN-TECH-018), BSGS at sqrt(N)/sqrt(N) (KN-TECH-031). As a cost model for
    explicit endomorphism evaluation: dominated by nothing in this repository,
    because no committed record measures it.
  sota_delta: >-
    Zero on every attack axis. Against the campaign's own planning: it replaces
    an unidentifiable five-point regression with two exact predictions and a
    slope.

  estimated_cost:
    implementation: medium
    compute: low

  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that the per-level norms come out exactly as predicted. 0.6 that the
    log-log slope lands in [1.85, 2.15] for direct evaluation. 0.02 that any
    downstream cost functional moves with the level. Filed as medium rather than
    high because its best outcome is a well-priced cost model, not a discovery,
    and because (D) caps its value in advance.

