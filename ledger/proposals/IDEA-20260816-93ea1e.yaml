idea:
  id: IDEA-20260816-93ea1e
  question_id: RQ-ALR-001
  added: '2026-08-16'
  title: 'Grade the difficulty of the open SLP-direct constructor by writing its input-plus-output
    information floor: show that softly O(n+N+c) is exactly the read-plus-write minimum, so the ALR
    lane is asking for an optimal-to-within-polylog algorithm, and state the compression factor a
    constructor must achieve'
  class: theory
  claim: '(A) RQ-ALR-001 and RQ-ALR-002 both leave open the same interface: an SLP-direct algorithm
    emitting only the candidate object in softly O(n+N) or softly O(n+N+c) work. That target is quoted
    repeatedly across H-ALR-001, H-ALR-002, EV-ALR-001 and EV-ALR-002 without anyone observing what
    it is. (B) The observation is elementary and costs nothing: any correct constructor must read
    the reduced target divisor and the source divisor, which is (n+N)*ceil(log2 p) bits, and must
    write the degree-c locator, which is c*ceil(log2 p) bits plus a support description. So softly
    O(n+N+c) is the read-plus-write floor to within polylog factors. The open interface is therefore
    not asking for a better algorithm; it is asking for an algorithm that is optimal to within polylog
    factors, and that is a difficulty grading the lane should carry in writing. (C) The second deliverable
    is the compression factor: the constructor must produce its answer while touching a factor nN/(n+N+c)
    less state than the routes that currently produce it, and that factor is the quantity to report
    per recorded instance. (D) The third deliverable is a decomposition of where the floor could be
    beaten downward: a constructor that does not read all of the target divisor, which requires the
    answer to depend on only part of it; one that does not write the full locator, which requires
    the consumer to accept an implicit representation; and amortisation across many targets, which
    changes the interface rather than the algorithm. All three are named as concrete escapes rather
    than dismissed. (E) NOT CLAIMED: this is not a lower bound. No circuit, straight-line-program,
    RAM or data-structure lower bound is claimed or implied, and the floor is an information-theoretic
    read-write observation that any nontrivial model can evade in ways the entry lists. It is not
    a statement that the constructor is impossible, hard, or unlikely; declaring a direction impossible
    is outside what this entry does. It claims no attack, no speedup and no security consequence.'
  mechanism: 'STAGE 1, fix the interface. Write down exactly what a constructor is given and what
    it must emit, taken verbatim from H-ALR-001 and H-ALR-002 rather than invented: input is the source
    divisor of degree n and the deduplicated target divisor of degree N over F_p; output is the degree-c
    candidate locator, or equivalently the candidate support. STAGE 2, write the read floor and the
    write floor in bits and add them. STAGE 3, compare against the quoted target softly O(n+N+c) and
    record that they coincide to within polylog factors, which is the grading. STAGE 4, write the
    compression factor nN/(n+N+c) per recorded instance from EXP-ALR-001 and EXP-ALR-002, reusing
    the size ledger rather than recomputing it. STAGE 5, enumerate the escapes: sublinear input access,
    which needs a promise that the answer is determined by a sampled portion of the target divisor;
    implicit output, which needs a downstream consumer specification; and amortisation across many
    targets. Each escape is stated with the specific additional assumption it requires. STAGE 6, run
    the discriminating control described below, which is the part that makes this an argument rather
    than an assertion: apply the identical floor derivation to a task that provably requires the full
    nN body, and confirm the derivation returns nN there. A derivation that returns n+N+c for both
    tasks is not measuring anything and the entry reports that instead of a grading.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read ledger/questions/RQ-ALR-001.yaml, RQ-ALR-002.yaml, ledger/hypotheses/H-ALR-001.yaml,
      H-ALR-002.yaml, ledger/evidence/EV-ALR-001.yaml, EV-ALR-002.yaml in full. Greps run: grep -ril
      ''output.sensitive'' ledger/proposals/ knowledge/ (hits IDEA-20260808-b16d04, KN-LIT-019, KN-OPEN-005,
      KN-TECH-010); grep -ril ''straight.line|straight_line|SLP'' ledger/proposals/ (11 hits, titles
      resolved for IDEA-20260812-b68bc0, IDEA-20260811-332ce9, IDEA-20260807-6533fd); grep -ril ''represented
      nN|nN body|memory exponent'' ledger/proposals/ (10 hits).'
    results: The eleven straight-line-program hits are spread across RQ-EWALK-8fa147, RQ-JINV-8fc13a,
      RQ-CANL-63098f and other lanes, and none concerns the ALR constructor. IDEA-20260808-b16d04
      is a composition-class record on reachable-tail signed-partition propagation with occupancy-calibrated
      duplicates, whose only shared vocabulary is the word output-sensitive. KN-OPEN-005 and KN-TECH-010
      exist in the corpus under that grep but are open-problem and technique notes, not proposals.
      The softly O(n+N) and softly O(n+N+c) targets appear in RQ-ALR-001, RQ-ALR-002, H-ALR-001, H-ALR-002,
      EV-ALR-001 and EV-ALR-002 and nowhere under ledger/proposals/. No record anywhere observes that
      those targets coincide with the read-plus-write floor.
    verdict: 'UNVERIFIED. No claim about external literature is made, and input-plus-output floors
      are elementary and certainly not new as a technique. Assembled from known parts: the floor argument
      is textbook-elementary and the sizes are inherited from the size ledger entry in this same batch
      and from EV-ALR-001. Claimed new only as a reading of this program''s own open interface: that
      the target the ALR lane has restated four times is the read-write minimum, which makes it an
      optimality request rather than an improvement request, and that this grading has never been
      written down here.'
  object_first_candidate:
    tracked_object: 'The bit-length of the constructor''s mandatory traffic, split into two counters:
      bits that must be read from the input and bits that must be written to the output. The object
      followed through the computation is the running pair of counters, never the values that pass
      through them.'
    lossiness: 'The projection discards the entire content of the computation, every field element,
      every intermediate and the algorithm itself, and retains two integers. It is maximally lossy:
      nothing about correctness, structure or feasibility survives, and no algorithm can be reconstructed
      from a pair of counters. The retained pair still propagates because traffic is additive along
      any composition of stages and is bounded below by the interface at the endpoints regardless
      of what happens between them, which is exactly why the floor is derivable without knowing the
      algorithm. The honest caveat is that additivity gives a floor only, never a ceiling, so the
      object propagates in one direction and the entry never uses it in the other.'
    propagation: One step of the target operation contributes to the tracked pair by the bits it must
      newly read and newly write. Composing steps sums the counters, and because a correct constructor
      must at minimum touch its input once and emit its output once, the composite pair is bounded
      below by (n+N)*ceil(log2 p) and by c*ceil(log2 p) plus support bits respectively, independently
      of the step structure. The propagation rule is therefore trivial and exact, which is the source
      of both the argument's reliability and its weakness.
    survival_score: 'The floor survives every model that charges reading and writing, and dissolves
      precisely where a model does not: nonuniform models with the input hardwired, models with free
      random access and a promise that makes most of the input irrelevant, and amortised settings
      where one preprocessing pass is shared across many targets. The entry states these three dissolution
      points explicitly and reports the floor as valid only in the uniform, single-target, must-read-input
      setting, which is the setting the ALR records describe.'
  null_object_control: 'Apply the IDENTICAL floor derivation, in the same invocation of the same script,
    to a task of the same shape whose answer provably requires the full remainder array: emit the
    entire target-divisor remainder R_P for every source point P. For that task the write floor must
    come out at nN*ceil(log2 p) bits, not n+N+c. If the derivation returns the same floor for both
    tasks, it is insensitive to the output specification and measures nothing, and the signal arm
    is void. A second null runs the derivation on a task whose output is a single bit, where the floor
    must collapse to the read term alone. Both nulls run by the same code path in the same invocation.'
  discriminated_from:
  - The size ledger entry in this same batch, which prices two concrete objects at recorded parameters;
    this entry prices the interface itself and derives a floor that holds for any algorithm, so one
    is an accounting of what exists and the other a grading of what is being asked for.
  - IDEA-20260808-b16d04, whose shared vocabulary is only the phrase output-sensitive and whose object
    is a signed-partition propagation with occupancy-calibrated duplicates in a different lane.
  - The blacklisted generic-group-model barrier proposals under RQ-GGMB-6eaabc, which are barrier
    arguments in a restricted computational model; this entry is not a barrier, not a model restriction
    and not a lower bound, and it explicitly lists the ways any model evades it.
  - The eleven straight-line-program records found under other questions, none of which concerns the
    ALR constructor or its interface.
  - EV-ALR-001 and EV-ALR-002, which record the open constructor as an interface to preserve; this
    entry does not preserve it, it grades it, and the grading is what neither record contains.
  assumptions:
  - The constructor is uniform, single-target, and must read its input rather than having it hardwired.
  - The output specification is the degree-c locator or an equivalent explicit description of candidate
    support, as H-ALR-002 states.
  - Field elements are charged at ceil(log2 p) bits with no packing discount, matching the size ledger
    entry so the two are commensurable.
  - The deduplicated target divisor of degree N is the actual input, so deduplication cost is charged
    separately and not folded into the floor.
  - Polylog factors are treated as free on both sides of the comparison, which is what softly O means
    in the records being graded.
  predictions:
  - metric: read_plus_write_floor_in_field_elements
    direction: different
    minimum_effect: n + N + c, forced by the interface as stated in H-ALR-001 and H-ALR-002; this
      is a derivation, not an empirical prediction, and a different value would mean the interface
      was misread
  - metric: ratio_of_quoted_target_to_derived_floor
    direction: different
    minimum_effect: 1.0
  - metric: null_task_write_floor_for_full_remainder_emission
    direction: higher
    minimum_effect: 100.0
  - metric: compression_factor_nN_over_n_plus_N_plus_c_at_recorded_instances
    direction: higher
    minimum_effect: 4.0
  minimal_test:
    design: 'There is nothing to run beyond a fifty-line script that evaluates three closed forms
      and prints them side by side, and the entry is deliberately zero-compute. The script takes the
      recorded (n, N, c, p) tuples, prints the read floor, the write floor, their sum, and the compression
      factor, then does the same for the two null tasks: full remainder emission, whose write floor
      must be nN, and single-bit output, whose floor must collapse to the read term. A reader confirms
      the derivation by checking that the three tasks receive three different floors from the same
      code path. The discriminating power is entirely in the null tasks: the derivation is trivially
      correct in isolation and its only failure mode is being insensitive to the output specification,
      which the null tasks expose immediately. Everything else in the entry is prose that a Coordinator
      can check by reading, which is the appropriate cost for a difficulty grading and is why the
      entry is proposed at zero compute.'
    controls:
    - Null task one, full remainder emission, whose write floor must be nN field elements, run by
      the identical code path in the same invocation.
    - Null task two, single-bit output, whose floor must collapse to the read term alone.
    - 'Charging-model consistency check against the size ledger entry: both must use ceil(log2 p)
      bits per field element or their ratios are not comparable.'
    - 'Escape enumeration completeness: each of the three named dissolution points is instantiated
      with the specific extra assumption it needs, so that none is left as a vague caveat.'
    required_metrics:
    - read_floor_bits
    - write_floor_bits
    - total_floor_field_elements
    - ratio_quoted_target_over_derived_floor
    - null_task_floors
    - compression_factor_per_recorded_instance
  falsification_conditions:
  - The derivation returns the same floor for the locator task and for the full-remainder-emission
    null task, showing it is blind to the output specification.
  - The interface as stated in H-ALR-001 and H-ALR-002 turns out to require an output larger than
    the locator, so the write floor is not c.
  - The quoted softly O(n+N+c) target is found to refer to time only while the floor is a traffic
    bound, so the two are not commensurable and the grading does not apply.
  - The deduplicated target divisor is not in fact the constructor's input, for example because deduplication
    is part of the constructor's job, in which case the read floor is larger than N.
  - A recorded ALR instance has n+N+c comparable to nN, making the compression factor near one and
    the grading vacuous at the parameters the lane actually uses.
  confounders:
  - Nonuniform or preprocessed models, where the input can be hardwired and the read floor vanishes;
    named as an escape rather than treated as a confounder to be eliminated.
  - Amortisation across many targets sharing one preprocessing, which changes the interface and moves
    the floor without contradicting it.
  - Implicit output representations that a downstream consumer could accept, for example a black box
    answering membership queries rather than a locator, which lowers the write floor.
  - Charging polylog factors as free on both sides, which is inherited from the records being graded
    and could hide a genuine gap.
  - Treating deduplication as free, which understates the read side if the raw target divisor is larger
    than N.
  interpretation_limits:
  - This is not a lower bound and must never be cited as one; it is a read-write floor in a stated
    uniform setting with three named escapes.
  - It says nothing about whether the constructor exists, is hard, or is likely, and no direction
    is declared impossible.
  - The compression factor is scoped to the recorded toy instances and inherits every limitation of
    the size ledger it reuses.
  - A grading is a statement about the question, not about the answer, and no evidence record may
    cite it as evidence about the object.
  target_complexity:
    time_exponent: No attack exponent is claimed. The entry observes that the quoted softly O(n+N+c)
      target coincides with a traffic floor; it derives no running time and asserts none.
    memory_exponent: 'No memory exponent is claimed. The reported floors are absolute bit counts:
      read floor (n+N)*ceil(log2 p), write floor c*ceil(log2 p) plus support bits, against the nN*ceil(log2
      p) body of the represented routes.'
    best_known: The incumbent is the represented remainder route recorded in EV-ALR-001, whose traffic
      is nN field elements; this entry states what a constructor would have to reach and claims nothing
      about reaching it.
    hidden_overhead: 'Hidden in the polylog factors is everything that separates an optimality request
      from an achievable algorithm, which is precisely the content the grading cannot see. The human
      cost hides in citation drift: a floor is one careless sentence away from being repeated as a
      lower bound, which is why the interpretation limits list that failure first.'
  dominated_by: n/a (no result claimed). Every frontier row in this lane was checked, the B^(5/2)
    rho proxy and the five B^(7/2) represented routes of EV-ALR-001, and a traffic floor places no
    point on any frontier because it is not an algorithm.
  sota_delta: no attack; conceptual/measurement contribution only. Quantitatively the deliverable
    is the identity floor = (n+N+c)*ceil(log2 p) bits, the ratio of that floor to the quoted target
    which is 1 up to polylog, and the compression factor nN/(n+N+c) tabulated at the recorded instances.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'That the floor derivation is correct as stated for the uniform single-target
    setting: 0.95, since it is elementary. That it coincides with the quoted softly O(n+N+c) target
    to within polylog: 0.85, the residual risk being that the quoted target refers to time while the
    floor is traffic, which the falsification conditions name. That the grading changes anything about
    how the lane proceeds: 0.4, stated separately and lower, because a difficulty grading informs
    prioritisation rather than producing a result. That the three named escapes are the complete list:
    0.3, deliberately low, since escape enumeration is exactly the kind of claim a later reader improves
    on, and the entry invites that rather than asserting completeness.'
