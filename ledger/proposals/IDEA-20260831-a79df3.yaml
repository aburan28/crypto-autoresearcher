idea:
  id: IDEA-20260831-a79df3
  question_id: RQ-MLKEM-001
  added: '2026-08-31'
  title: >-
    Induced-beta distribution over the natural per-ciphertext singleton count:
    does an honest, chaos-excluded reading of M2's own native m-lever ever help
    the defender, or does the whole construction sit inside KN-FIND-001e68's
    chaotic band by construction?
  class: control

  claim: >-
    BATCH-a5b13c's M2 construction (ledger/hypotheses/H-MLKEM-11aabf.yaml;
    coordination/goals/GOAL-MLKEM-005/batches/BATCH-a5b13c/tasks/TASK-20260814-c87a24/ciphertext_noise_readout.py
    build_m2_kyber1024/run_primal_bdd) fed primal_bdd a SINGLE, deterministic
    reduced_m = round(base_m * fraction_singleton) = round(1024 * 767/3329) =
    236 -- the EXPECTATION of the true, per-ciphertext-instance random variable
    |S(c)| = the number of the 1024 actual ML-KEM-1024 coefficient positions
    whose observed compressed value c_i happens to land in a singleton fibre
    for THAT specific ciphertext (H-MLKEM-11aabf's own mechanism field: S(c) is
    "a subset of coordinate indices computable from the ciphertext alone").
    |S(c)| is not a constant; treating it as Binomial(n=1024, p=767/3329)
    (H1 below), it has mean 235.93 and std ~13.47 (independently recomputed in
    exact fractional arithmetic: 1024*767/3329 = 235.929..., variance
    1024*(767/3329)*(2562/3329), std 13.4748...), so a real target ciphertext
    typically presents |S(c)| anywhere in roughly [222, 249] (+-1 sigma),
    NOT the single point 236 BATCH-a5b13c evaluated. KN-FIND-001e68 already
    showed the pinned estimator's beta(m) readout is chaotic/non-monotone in
    almost exactly this band (total failure below m~218-220; chaos to
    ~m~240-250; smooth above). THE CLAIM UNDER TEST, stated as two mutually
    exclusive, fully decidable outcomes: (A) the probability mass of the true
    Binomial(1024,767/3329) distribution landing inside the empirically
    re-confirmed chaotic band (re-measured at full integer density in [189,283],
    not merely at BATCH-a5b13c's coarse/fine grid points) exceeds 50%, AND the
    SMOOTH-region-only (m outside the chaotic band) conditional mean of
    beta(|S(c)|) is itself <= beta(M0)=872 -- meaning the entire M2 construction,
    not merely its specific 617/255-bit headline number, is unusable as a
    stable per-instance reading at ML-KEM-1024, closing this construction
    MORE firmly than DEC-20260814-b0a095 currently records; or (B) either the
    chaotic-band overlap is small (<20% of mass) or the smooth-region
    conditional mean exceeds beta(M0), in which case an honest, distribution-
    aware M2 reading gives a materially DIFFERENT and MORE DEFENSIBLE numeric
    answer to H-MLKEM-11aabf's own C2 conjunct than the single point beta(236)=617
    currently on record. NO ATTACK, NO KEY RECOVERY, NO SECURITY CLAIM.

  mechanism: >-
    This is NOT a resubmission of M0, M1, or M2 as PREREG-7/EXP-MLKEM-18c6e9
    specified them. M1 (KN-FIND-5e9728) collapses because it feeds the
    variance-only primal_bdd cost path a single mixed marginal, which is
    mathematically forced to equal M0's own marginal for ANY partition -- that
    argument concerns the FIRST moment (aggregate variance) of the noise and
    is independent of instance-to-instance variation. M2, as CODED, replaced a
    genuinely random per-instance quantity (|S(c)|, the number of clean
    coordinates a specific observed ciphertext actually presents) with its
    population EXPECTATION and evaluated the pinned estimator's `LWEParameters.m`
    -- the one native per-coordinate-count lever the API exposes
    (section1_obligation4b in ciphertext_noise_readout.py) -- at that single
    mean point. This idea replaces the point evaluation with the INDUCED
    DISTRIBUTION of beta(m) over the natural distribution of |S(c)| across
    real target ciphertexts, using the SAME native `m=` lever, at a dense grid
    of integer m values spanning the range real ciphertexts actually produce.
    It is the "graded generalization of M2 that optimizes over a continuum ...
    of coordinates by their known variance" the Coordinator's ruling_c
    licenses under direction (i), instantiated via the one lever
    (`LWEParameters.m`) the pinned API's own section1_obligation4 finding
    confirms is native and already empirically verified to work.

  object_first_candidate:
    tracked_object: >-
      The per-ciphertext realized singleton-coordinate COUNT |S(c)|, treated
      as a random variable across target ciphertexts, and the DISTRIBUTION of
      beta(m=|S(c)|) it induces under the pinned estimator -- not a single
      point (M2 as coded) and not a mixed marginal fed as one Xe (M1).
    established_families_off_limits: >-
      M0 (single population-average marginal), M1 (class-weighted mixture fed
      as one Xe -- closed, KN-FIND-5e9728), and M2-as-a-point (the single
      deterministic reduced_m=236 -- magnitude unreliable, KN-FIND-001e68) are
      declared off-limits as the primary lens; this idea's object is the
      SPREAD of the m-lever's own natural argument across instances, which
      none of the three prior constructions examined.
    newness_score: >-
      Genuinely new at the object level: no proposal or hypothesis found
      under RQ-MLKEM-001 (checked: IDEA-20260814-137f68, IDEA-20260814-8f8f45,
      IDEA-20260814-a609eb, H-MLKEM-232843, H-MLKEM-34e22e, H-MLKEM-11aabf,
      EXP-MLKEM-18c6e9) treats |S(c)| as a random variable or asks what
      fraction of its mass falls inside the already-demonstrated chaotic band.
      BATCH-a5b13c itself used only the deterministic mean.
    testability_score: >-
      High. Reuses ciphertext_noise_census.py's exact compression map and
      ciphertext_noise_readout.py's run_primal_bdd unmodified; the sweep is
      ~95 additional primal_bdd calls (same cost class as the already-run
      m-sensitivity sweeps in TASK-20260814-b13873/c09076), plus a cheap,
      lattice-compute-free empirical/theoretical |S(c)| distribution check.
    survival_score: >-
      Survives exactly as long as |S(c)| is genuinely random across instances
      (always true for real ciphertexts) and the native `m=` lever remains the
      only per-coordinate-count API surface; dissolves if a future pinned
      version adds true per-coordinate Xe support, at which point a richer
      construction (not this one) becomes the right object.

  lossy_projection_identifiability_audit:
    projection: >-
      The full ciphertext (all 1024 compressed coefficients and their
      individual class labels) --> the single integer |S(c)| (count of
      singleton-class positions) --> LWEParameters.m = |S(c)|.
    what_is_discarded: >-
      WHICH specific 1024-coordinate positions are singleton for this
      ciphertext; only their count survives.
    why_genuinely_lossy: >-
      Many distinct ciphertexts (many distinct realized singleton SETS) share
      the same count |S(c)|; the map ciphertext -> |S(c)| is many-to-one.
    why_compatible_with_the_operations: >-
      primal_bdd/LWEParameters never consumes WHICH coordinates are used, only
      the scalar cardinality m -- m IS the exact sufficient statistic the
      instrument's own cost model already operates on, so nothing the
      instrument could use is thrown away by this projection.
    is_it_only_a_change_of_coordinates: >-
      No. M0/M1 discard per-coordinate class structure entirely (forced to one
      marginal, KN-FIND-5e9728). This construction retains, per specific
      ciphertext, the REALIZED effective sample count that instance would
      actually present to an attacker -- information M0/M1 structurally
      cannot carry, and information BATCH-a5b13c's own M2 (point at the mean)
      also discarded (its own spread). It is a genuinely coarser-but-different
      summary than any prior construction, not a relabeling of one.

  novelty_status: unverified

  citations:
    - ref: KN-FIND-5e9728
      provenance: internal
      claim: >-
        Feeding a variance-only cost path one class-weighted mixture is
        mathematically forced to equal the population-average baseline --
        cited to show this idea does NOT feed Xe a mixture at all; it uses the
        native m lever instead.
      verified_by: this session's direct read of knowledge/findings/KN-FIND-5e9728.md
    - ref: KN-FIND-001e68
      provenance: internal
      claim: >-
        primal_bdd/RC.MATZOV is demonstrably chaotic/non-smooth in m<<n
        (~m=220-250 at Kyber1024, n=1024), with no validity-range guard.
      verified_by: this session's direct read of knowledge/findings/KN-FIND-001e68.md
    - ref: H-MLKEM-11aabf
      provenance: internal
      claim: singleton/doublet fibre census and M0/M1/M2 construction, status analyzed.
      verified_by: this session's direct read of ledger/hypotheses/H-MLKEM-11aabf.yaml
    - ref: EXP-MLKEM-18c6e9
      provenance: internal
      claim: the prior, refused/never-executed EXP draft for the same M0/M1/M2 construction.
      verified_by: this session's direct read of experiments/EXP-MLKEM-18c6e9/specification.yaml
    - ref: DEC-20260814-b0a095
      provenance: internal
      claim: >-
        names exactly two licensed-but-uncommissioned forward directions and
        the "graded generalization of M2 ... representable via LWEParameters.m" framing.
      verified_by: this session's direct read of ledger/decisions/DEC-20260814-b0a095.yaml

  assumptions:
    - No ML-KEM secret, key, or decapsulation call is used anywhere; only public Compress output and synthetic (A,r,e1)-style ciphertext generation for the |S(c)| distribution check.
    - Reuses the pinned lattice-estimator commit 3e48ef421ec256afddb3e7d2249a77eab6e9ba12 and the SAME RC.MATZOV/primal_bdd call already known-answer-controlled; no modification to the pinned package.
    - The |S(c)| empirical-distribution check requires no lattice compute and no network beyond what Stage A's own census already required.

  proof_search_map:
    not_applicable_reason: >-
      Purely empirical/derivational, matching H-MLKEM-11aabf's own ruling
      (PREREG-7 section 0.1): a closed-form probability-weighting calculation
      plus a dense pinned-instrument readout sweep, not a novel algorithmic
      construction with an open bottleneck or quantifier structure to search for.

  predictions:
    - metric: >-
        fraction of the exact Binomial(1024, 767/3329) pmf falling inside the
        chaotic band re-confirmed at full integer density in [189,283]
      direction: higher
      minimum_effect: >-
        exceeding 50% of probability mass is the threshold for "the
        construction is trapped in chaos by design"; under 20% is a clean
        negative (the natural distribution mostly avoids the chaotic band).
    - metric: smooth-region-only (outside the re-confirmed chaotic band) conditional mean of beta(|S(c)|)
      direction: different
      minimum_effect: >-
        a decidable comparison against beta(M0)=872 and beta(key-side)=855,
        already on record -- report the exact conditional mean and its
        standard error over the truncated Binomial weights.
    - metric: exact reproduction of beta(236)=617 by this idea's own pipeline (regression check)
      direction: different
      minimum_effect: exact match, zero tolerance, before any new number is trusted.

  minimal_test:
    design: >-
      (1) Sample ~10^4-10^5 honestly-generated Kyber1024-shaped ciphertexts
      (public A, ephemeral r, e1, no secret key) and compute the empirical
      distribution of |S(c)| via the exact Compress_11 map already in
      ciphertext_noise_census.py; compare against Binomial(1024,767/3329) via
      chi-squared and tail-quantile checks (H1). (2) At every integer m in
      [189,283] (a pre-registered range covering roughly +-3.5 sigma), call
      primal_bdd(LWEParameters(n=1024,q=3329,Xs=CBD(2),Xe=CBD(2),m=m),
      red_cost_model=RC.MATZOV) -- the SAME construction M2 already used (real
      Xe=CBD(eta1), not synthetic variance-matched) -- reusing/extending
      KN-FIND-001e68's own m-sensitivity sweep at full integer density inside
      this specific, narrower, pre-registered range (H2). (3) Weight the
      resulting beta(m) curve by the (empirically confirmed or theoretical)
      |S(c)| distribution; report the chaotic-band mass fraction, the induced
      mean/median/IQR of beta, and the smooth-region-only conditional mean.
    controls:
      - >-
        Reproduction check: this idea's own pipeline must reproduce
        beta(m=236)=617 exactly before any new number is trusted.
      - >-
        Reuses KN-FIND-001e68's own m-sensitivity sweep as the required prior
        control (per rule 3 of this commission), cited by ID rather than
        re-derived from scratch; this idea's dense integer re-scan is an
        EXTENSION of it at full density inside [189,283], not a duplication.
      - >-
        Shifted-weighting null: repeat the mass-fraction calculation with a
        synthetic weighting distribution of the SAME shape/spread but centered
        at m=600 (safely inside the smooth region) -- must report near-zero
        chaotic-band mass, or the analysis pipeline itself is broken
        regardless of where the true |S(c)| distribution sits.
    required_metrics:
      - empirical vs theoretical |S(c)| distribution (chi-squared statistic, tail quantiles)
      - beta(m)/rop/eta/d at every integer m in [189,283]
      - chaotic-band probability mass fraction (re-confirmed boundaries, not assumed from the coarser prior grid)
      - induced mean/median/IQR of beta over the natural distribution
      - smooth-region-only conditional mean of beta, vs beta(M0)=872 and beta(key-side)=855

  falsification_conditions:
    - >-
      The reproduction check does not return beta(236)=617 exactly -- pipeline
      defect, nothing downstream trusted.
    - >-
      The shifted-weighting null (centered at m=600) reports non-negligible
      chaotic-band mass -- the mass-fraction calculation itself is broken.
    - >-
      H1 is rejected by the chi-squared test at the pre-registered
      significance level -- the Binomial approximation is wrong and the
      weighting must be rebuilt from the empirical histogram directly (not
      fatal to the idea, but changes which specific number is reported).
    - >-
      The dense re-scan in [189,283] finds NO chaotic/non-monotone region at
      all (contradicting KN-FIND-001e68's own reported band at this finer
      density) -- this would itself be a new, reportable finding requiring
      KN-FIND-001e68 to be revisited, not a failure of this idea.

  confounders:
    - >-
      Real ciphertexts are not literally "random A, r, e1" in deployment (A
      derives from a public XOF seed, r is honestly random per encapsulation)
      -- the marginal distribution of |S(c)| across many independent
      encapsulations is what H1 actually needs and tests, so this confound is
      captured by H1's own validation route, not left implicit.
    - >-
      KN-FIND-001e68's own chaotic-band boundaries were established at
      coarse-plus-one-fine-step granularity; this idea's "mass fraction"
      claim is sensitive to exactly where the boundary sits, which is why the
      dense integer re-scan (not a reuse of the reported boundary numbers) is
      mandatory before weighting.
    - >-
      Chi-squared/tail-quantile power at 10^4-10^5 samples may be limited in
      the extreme tails (where this idea's chaos-overlap question is most
      sensitive); report confidence intervals, not point estimates, for tail
      probabilities.

  interpretation_limits:
    - >-
      CLAIM TIER stays exactly PREREG-7/DEC-20260814-b0a095's MEDIUM for C2 --
      a labelled instrument readout, never a measured attack cost or security-
      margin revision. No new claim tier is introduced.
    - >-
      Does not reopen or contradict C1 (Stage A's census, unaffected) or the
      already-fired T-CIPHNOISE-CLOSED termination branch; this idea only
      refines the interpretation of the M2 sub-reading, exactly as
      DEC-20260814-b0a095's own ruling_c and next_actions license (a
      "genuinely different attack construction" using the native m-lever).
    - >-
      Does NOT touch or restate GOAL-MLKEM-005's BKZ-tour/RT-CTRL-1 lane
      (BATCH-0d5018) or its C1/C2/C3 primary completion criteria.
    - >-
      If pursued, this should be commissioned as option (i) in
      DEC-20260814-b0a095's own next_actions choice, under a fresh,
      separately-specified PREREG per that decision's own forward boundary --
      this proposal alone authorizes no execution.

  heuristic_assumptions:
    - id: H1
      statement: >-
        Across a random ciphertext's 1024 coefficient positions, the event
        "position i is singleton-class under Compress_11" behaves as an i.i.d.
        Bernoulli(p_s=767/3329) draw, so |S(c)| ~ Binomial(1024, 767/3329)
        (mean 235.93, std ~13.47).
      rigorous_support: >-
        Imitates the classical DeMoivre-Laplace/CLT approximation for sums of
        i.i.d. indicators. The rigorous content is only that Compress_11's
        fibre membership is a deterministic function of u_i mod q, and for a
        "generically mixing" A (the NTT-multiplication structure), the
        marginal residue-class distribution across coordinates of a random
        ciphertext should behave close to independent Bernoulli(p_s) draws;
        strict independence is not proved and is exactly what the validation
        route checks.
      validation_plan: >-
        Sample 10^4-10^5 real Kyber1024-shaped ciphertexts (n=1024, q=3329 --
        actual FIPS 203 scale, no toy-to-crypto extrapolation, public data
        only, no secret key) via honestly-random (A,r,e1); compute the exact
        Compress_11 fibre class for every coordinate of every sample (pure
        integer arithmetic, same style as Stage A's own census); compare the
        empirical histogram of |S(c)| against the closed-form Binomial(1024,
        767/3329) pmf via a chi-squared goodness-of-fit statistic and explicit
        tail-quantile checks (5th/95th and 1st/99th percentiles). Sampled
        parameters: n=1024, 10^4-10^5 draws, recorded exactly. Falsification:
        chi-squared rejects at the pre-registered significance level, or the
        empirical tail quantiles depart materially from the Binomial
        prediction -- the weighting must then use the empirical histogram
        directly rather than the theoretical Binomial.
    - id: H2
      statement: >-
        The qualitative chaotic-band shape KN-FIND-001e68 reported (total
        failure below m~218-220, non-monotone chaos to ~240-250, smooth
        above) holds at FULL INTEGER DENSITY across [189,283], not only at the
        coarser grid points the prior two independent reviews' own probes
        sampled.
      rigorous_support: >-
        Not a classical distribution theorem -- an extrapolation-of-density
        assumption about an already-source-verified mechanism (the pinned
        estimator's own Bai-Galbraith d>=n floor, KN-FIND-001e68). The
        heuristic content is purely whether finer sub-structure hides between
        the previously-tested grid points.
      validation_plan: >-
        Re-run primal_bdd at EVERY integer m from 189 to 283 (95 calls,
        seconds each per the existing sweeps' own timing) rather than relying
        on the coarse/fine grid boundaries already reported, directly
        confirming or refining the chaotic-band boundaries at full resolution
        before any mass-fraction number is computed against them. This is
        Obligation 1 of the minimal_test itself, so it is directly and
        cheaply checked, not merely assumed. Falsification: the dense scan
        reveals materially different boundaries than KN-FIND-001e68 reported
        (see falsification_conditions above) -- reported as a new finding
        about KN-FIND-001e68's own resolution, not hidden.

  target_complexity:
    time_exponent: >-
      NOT APPLICABLE -- no attack, no exponent claim. This is a control/
      measurement refinement of H-MLKEM-11aabf's own C2 conjunct, matching the
      target_complexity treatment of IDEA-20260814-137f68/8f8f45 (control-class
      ideas in this same lane).
    memory_exponent: NOT APPLICABLE, same reasoning.
    best_known: not_applicable
    hidden_overhead: >-
      The toy-to-real transfer risk is minimal here since the |S(c)|
      empirical check runs AT actual FIPS 203 scale (n=1024) directly, not a
      toy dimension; the only extrapolation risk is H2's density-transfer
      assumption, disclosed above.
    tradeoff_note: not_applicable

  dominated_by: >-
    n/a (no attack-cost or algorithmic-complexity claim; a control/measurement
    refinement internal to H-MLKEM-11aabf's own C2 conjunct within
    GOAL-MLKEM-005, not competing against any external published algorithm).
    Checked against IDEA-20260814-137f68, IDEA-20260814-8f8f45,
    IDEA-20260814-a609eb (all RQ-MLKEM-001, all disjoint in object: 137f68/8f8f45
    concern C3's Beta-law/order-statistic object; a609eb concerns C2-census
    maintenance drift) -- none dominates or overlaps this idea's object.
  sota_delta: >-
    n/a (diagnostic/control only; if outcome A fires, it strengthens and
    narrows DEC-20260814-b0a095's own m2_magnitude_corrected_citable_wording
    into a firmer closure; if outcome B fires, it produces a materially
    different, more defensible numeric answer to H-MLKEM-11aabf's own C2
    conjunct than the single point beta(236)=617 currently on record).

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
