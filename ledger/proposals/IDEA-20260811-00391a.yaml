  title: >-
    THE SOURCE-SIDE SCOPE BOUNDARY OF H-ENDO-001, WITH THE QUANTIFIERS WRITTEN OUT:
    the filter's scalarity conclusion has exactly one non-automatic hypothesis --
    that E[N] is NOT contained in E(F_p) -- and that hypothesis fails only when
    N | p - 1, i.e. only on the family MOV already breaks; therefore the boundary
    is AIRTIGHT over F_p and its leak is priced at the embedding degree. The six
    classes of maps the filter does NOT govern are enumerated on the SOURCE side
    (IDEA-20260727-005 enumerated them on the TARGET side), five of them collapse
    onto already-named lanes, and exactly one -- publicly computable partial
    homomorphisms defined on a subset of G of density N^{-c} -- is left genuinely
    open with its stability theorem named
  class: mechanism
  resource: >-
    R5 and R7, used as AUDIT resources rather than as attack resources: the object
    is E[N] as a Galois module (R5 with ell = N, which the DECOMPOSITION section-2
    table explicitly excludes with the annotation "ell != N") and the field of
    definition F_{p^k} (R7). The record does NOT propose a new taxonomy entry; it
    proposes that the R5 row's "ell != N" exclusion be read as the EXACT statement
    of the filter's boundary rather than as a scoping convenience, and it supplies
    the argument for why that reading is correct.
  admissibility: >-
    Admissible. Nothing here applies an endomorphism to a point of G in order to
    gain a congruence; the record AUDITS the filter and proposes no attack. Every
    map it examines and rejects is rejected by an argument stated in the record.
    The record does not retest H-ENDO-001: it takes the hypothesis as binding and
    asks only which maps its argument reaches.
  p2_p3_flags:
    p2_adjacent: false
    p3_triggered: false
    note: >-
      No phi-stable factor base appears and no candidate is compared against the
      automorphism-discounted rho baseline, so neither pause condition is engaged.

  claim: >-
    Let E/F_p be ordinary, p > 3, N a prime dividing #E(F_p), G a subgroup of order
    N, P a generator, Q = [k]P.

    (A) THE HYPOTHESIS AS STATED, WITH QUANTIFIER ORDER. H-ENDO-001 asserts
        forall phi in End_{F_p}(E), exists lambda_phi in Z/N, forall R in G:
        phi(R) = [lambda_phi] R.
        The order matters in one specific way: lambda is quantified BEFORE R, so
        it is uniform over the subgroup. The weaker statement obtained by flipping
        to "forall R exists lambda_R" is not a scalar action at all and is
        satisfied by maps that are not homomorphisms; that flipped statement is
        precisely what the R1 lane trades in, and the filter says nothing about it.
        This is stated first because it is where a scope error would hide.

    (B) THE ONE NON-AUTOMATIC HYPOTHESIS. The argument needs phi(G) subset G before
        End(G) = Z/N can be invoked. Since phi is F_p-rational it preserves
        E(F_p), and it preserves the N-Sylow subgroup of E(F_p). If that Sylow is
        CYCLIC then G is its unique subgroup of order N, so phi(G) subset G is
        automatic, End(G) = Z/N applies, and the conclusion holds. The Sylow is
        non-cyclic exactly when E[N] subset E(F_p). Therefore:
          [fact] H-ENDO-001's conclusion holds for every E with E[N] not contained
          in E(F_p), with NO further hypothesis -- in particular it does not need
          N || #E, and it survives a cyclic N-Sylow of any exponent.

    (C) THE PRICE OF THE LEAK. If E[N] subset E(F_p) then the Weil pairing
        e_N: E[N] x E[N] -> mu_N is defined over F_p, so mu_N subset F_p^*, so
        N | p - 1 and the embedding degree is k_emb = 1. Curves with k_emb = 1 are
        transferred into F_p^* by the Frey-Ruck / MOV map and are broken outright
        (KN-TECH-032 records the setting). Hence:
          [fact] the only curves on which H-ENDO-001's scalarity argument can fail
          are curves already broken by a published attack. THE BOUNDARY IS
          AIRTIGHT ON EVERY CURVE THE CAMPAIGN CARES ABOUT, and this is the
          record's answer to the handoff's question "if the boundary turns out to
          be airtight, say so and name why". The name is: scalarity failure
          requires the full N-torsion to be rational, and rational full N-torsion
          is embedding degree one.

    (D) WHAT IS GOVERNED, STATED AS A SET. The filter reaches exactly the maps psi
        such that (i) psi is a group homomorphism, (ii) its source contains G,
        (iii) its target is a group whose N-torsion is cyclic, and (iv) it is
        defined over F_p. Everything outside that set is ungoverned BY THIS
        ARGUMENT and must be closed, if at all, by a different one.

    (E) THE SOURCE-SIDE ENUMERATION -- SIX UNGOVERNED CLASSES AND WHAT DOES GOVERN
        THEM. IDEA-20260727-005 enumerated maps out of G by their TARGET
        (Chevalley-Barsotti: unipotent / toric / abelian-variety). This record
        enumerates by SOURCE and by failure of (i)-(iv), which is the complementary
        half and is where the axis-A1 objects live.
        U1. Publicly computable NON-homomorphic maps with source G. Ungoverned.
            These are exactly the maps that read the coordinate encoding, i.e.
            resource R1; this reproduces IDEA-20260727-005's C4 conclusion from the
            source side and is disclosed as a reproduction, not a discovery.
        U2. Maps whose SOURCE is not a group: the x-line P^1 = E/{+-1}, the curve
            equation (a,b), the j-line, the isogeny graph. [fact] Any function of
            curve-only data is independent of k, because k is a property of the
            pair (P, Q) and not of the curve; this is DECOMPOSITION L7's stated
            obstruction, restated as a scope fact. Such a map becomes k-dependent
            only after composition with a point-dependent map, which returns it to
            U1.
        U3. Maps whose source is a PROPER SUBSET S of G -- a coset, an interval, a
            factor-base preimage -- and which are homomorphic only on S. GENUINELY
            OPEN, and the record's one open crack. See (F).
        U4. Maps defined over F_{p^k} rather than F_p. Governed, but by a DIFFERENT
            argument than (B): Galois-character rigidity. G is the eigenvalue-1
            eigenspace of Frobenius in E[N] and the complementary eigenspace W is
            the eigenvalue-p eigenspace. A homomorphism G -> W defined over
            F_{p^k} must intertwine the Galois characters 1 and p, so it is zero
            unless p^k = 1 mod N, i.e. unless k is a multiple of k_emb. [fact,
            modulo the eigenspace decomposition of E[N] for ordinary E with
            p not congruent to 1 mod N, which is standard and is RELAYED here.]
            So the price of leaving F_p is exactly the embedding degree -- the same
            price MOV pays and the same price IDEA-20260807-569c82 records for the
            pairing. The record's contribution here is the observation that the
            eigenspace route and the pairing route are the SAME obstruction, not
            two, because both need mu_N or W and both live at level k_emb.
        U5. Maps into NON-ABELIAN groups. [fact] G is cyclic, so the image of any
            homomorphism out of G is abelian and the map factors through an
            abelian quotient of the target. Non-abelian targets add nothing.
            Governed, closed, one line.
        U6. Maps whose source is a TUPLE of instances (preprocessing, multi-target).
            Ungoverned by this filter; governed by the preprocessing frontier
            (Corrigan-Gibbs-Kogan S T^2 = Omegatilde(N)). This is axis A3's object
            and is named here only so the enumeration is exhaustive.

    (F) THE OPEN CRACK, STATED PRECISELY. Let S subset G with |S| = delta N, and
        let psi: S -> A be publicly computable in N^{o(1)} time with
        psi(R + R') = psi(R) psi(R') for at least an epsilon fraction of the pairs
        (R, R') in S x S with R + R' in S. If delta and epsilon are CONSTANTS, the
        Balog-Szemeredi-Gowers theorem plus Freiman-Ruzsa structure theory in the
        cyclic group Z/N of PRIME order (where the only subgroups are trivial)
        forces psi to agree with a genuine homomorphism G -> A on a positive-density
        subset, and (D) then applies. [open -- this is a SKETCH of an extension, the
        constants are not tracked, and the record does NOT claim the theorem.] If
        delta = N^{-c} for c > 0, no such conclusion is available from that
        machinery, and the filter is silent. THE FORWARD GUIDANCE IS THEREFORE
        EXACT: the class of maps this campaign has never examined is
        sub-polynomial-density partial homomorphisms out of G, and the question of
        whether one can be publicly computable is the successor question.

  mechanism: >-
    The reason the filter is airtight is not the primality of N by itself; primality
    is doing less work than the hypothesis's phrasing suggests. The load is carried
    by CYCLICITY of the N-Sylow of E(F_p), which makes G canonical and hence stable
    under every rational endomorphism, and by the fact that a cyclic group of order
    N has endomorphism ring Z/N whatever the exponent of the Sylow. The complementary
    situation -- the full N-torsion rational -- is not a mild degeneration; it forces
    mu_N into F_p by the Weil pairing and therefore forces the embedding degree to 1.
    So the filter and the MOV predicate are governed by one arithmetic condition,
    stated in two languages: "the N-Sylow is cyclic" and "N does not divide p - 1".
    On the target side the same unification appears: the second Frobenius eigenspace
    W and the group mu_N are both defined at level k_emb and not below, so leaving
    F_p to find a non-scalar action costs exactly what leaving F_p to find a pairing
    costs. That is why there is no cheaper escape: every escape route through a
    HOMOMORPHISM is the same route.

  why_not_a_renamed_known_approach: >-
    IDEA-20260727-005 is the nearest record and is a target-side classification: it
    fixes the source as G and classifies the TARGET by Chevalley-Barsotti into
    unipotent, toric, and abelian-variety exits, attaching an exponent to each. It
    does not write the quantifier order of H-ENDO-001, does not identify the
    filter's single non-automatic hypothesis, does not connect scalarity failure to
    k_emb = 1, and does not enumerate sources other than G. IDEA-20260807-569c82
    supplies the eigenspace/degeneracy facts for the pairing and notes k_emb = 1 as
    a boundary case for the Tate self-pairing; it does not identify k_emb = 1 as the
    failure boundary of the ADMISSIBILITY FILTER, which is a different statement
    about a different object. IDEA-20260807-df5984 collapses finite-field descent
    into the Tate pairing via Lang's theorem; that is a third target-side route.
    This record's contribution is (1) the quantifier statement, (2) the
    cyclic-Sylow equivalence and its consequence k_emb = 1, (3) the source-side
    enumeration U1-U6 with the governing rule attached to each, and (4) the
    partial-homomorphism crack with its density threshold. Items (1)-(3) are
    assembly of standard facts and are labelled adaptation; item (4) is speculative
    and is labelled as such inside the record.

  proof_search_map:
    bottleneck: >-
      The step whose removal would change the theorem is the inference
      "phi preserves the N-Sylow, therefore phi(G) subset G". Everything else in
      H-ENDO-001 is End(Z/N) = Z/N, which is unconditional.
    baseline_embedding:
      parameter_slice: >-
        H-ENDO-001 as currently stated is the parameter slice N || #E(F_p) with
        N prime. The record must reproduce it exactly on that slice and must
        additionally cover the slice N^e || #E(F_p) with cyclic Sylow, which the
        current statement does not mention.
      reproduction_check: >-
        Symbolic: on a curve with N || #E, the Sylow is Z/N, cyclic, so (B) returns
        "holds", identical to the current hypothesis. Frozen fixture: a toy curve
        with N^2 | #E and CYCLIC N-Sylow, where the current phrasing is silent and
        (B) must still return "holds".
    observation_collision:
      observable: >-
        The predicate "every rational endomorphism acts on the order-N subgroup as
        a scalar".
      distinct_preimage_search: >-
        Sought: two curves with the same value of the observable but different
        values of the proposed governing invariant "N-Sylow cyclic". A collision
        would mean cyclicity is not the load-bearing condition. Candidate colliders
        to test: (i) curves with E[N] rational where SOME endomorphism nevertheless
        happens to act as a scalar -- these exist (the integers always do) and are
        the reason the predicate must be quantified over ALL phi, not some;
        (ii) supersingular curves over F_p, where End_{F_p}(E) is an order in an
        imaginary quadratic field but End_{F_pbar}(E) is a quaternion order -- the
        record is scoped to ordinary curves precisely to avoid this collider and
        says so.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the invariant "N is prime" by the strictly stronger and strictly
          more informative invariant "the N-Sylow of E(F_p) is cyclic", which
          survives the recursion into composite and prime-power order and which is
          what the argument actually uses.
        predicted_gain: >-
          The hypothesis becomes applicable to curves with N^e || #E, and the
          failure set becomes an explicitly characterised arithmetic family
          (E[N] rational) rather than an unstated side condition.
      - transform: representation_reduction
        proposed_object: >-
          Move the question from "which endomorphisms are scalars" to "which
          Galois-module homomorphisms E[N]-into-E[N] are defined over F_{p^k}",
          where the hypothesis becomes the exact vanishing condition
          Hom_{Gal(F_pbar/F_{p^k})}(G, W) = 0 unless p^k = 1 mod N.
        predicted_gain: >-
          Unifies the eigenspace escape and the pairing escape into one obstruction
          priced at k_emb, removing the appearance of two independent routes.
    quantifier_order: >-
      GOVERNED SET, stated in full:
      forall E/F_p ordinary, forall N prime with N | #E(F_p) and E[N] not contained
      in E(F_p), forall G the order-N subgroup, forall phi in End_{F_p}(E),
      exists lambda in Z/N, forall R in G: phi(R) = [lambda] R.
      LEAK SET, stated in full:
      exists E/F_p with E[N] contained in E(F_p) -- necessarily with N | p - 1 --
      and exists phi in End_{F_p}(E) and exists a subgroup G of order N with
      phi(G) not contained in G.
      OPEN SET, stated in full:
      exists c > 0, exists S subset G with |S| = N^{1-c}, exists psi: S -> A
      publicly computable and homomorphic on S, with no extension to G. The record
      neither asserts nor refutes this existential.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest thing this method can certify is that NO group homomorphism
        with source containing G, target with cyclic N-torsion, and field of
        definition F_p yields a congruence on k beyond the one G already carries.
        It cannot certify anything about non-homomorphic maps, and any reading of
        it as "ECDLP is closed" is a misreading of exactly the kind
        IDEA-20260727-005's interpretation_limits already warns against.
      nearby_object_control: >-
        The nearby object on which the desired conclusion FAILS is a curve with
        N | p - 1 and E[N] rational: there the scalarity conclusion is false, the
        filter does not apply, and the curve is broken. If the proposed argument
        cannot distinguish that curve from a k_emb-large curve, it has not
        identified the load-bearing structure. The minimal test includes exactly
        that pair as its planted signal.
    proof_obligations:
      - claim: phi preserves the N-Sylow of E(F_p) for every rational phi.
        responsibility: correctness
      - claim: a cyclic N-Sylow has a unique subgroup of order N.
        responsibility: correctness
      - claim: E[N] contained in E(F_p) implies mu_N contained in F_p implies N | p-1.
        responsibility: correctness
      - claim: Hom over F_{p^k} between the two Frobenius eigenspaces vanishes unless p^k = 1 mod N.
        responsibility: correctness
      - claim: the enumeration U1-U6 is exhaustive over sources of publicly computable maps.
        responsibility: scope
      - claim: constant-density partial homomorphisms extend; sub-polynomial-density ones are not covered.
        responsibility: feasibility
    not_applicable_reason: null

  predictions:
    - observable: scalarity predicate versus Sylow cyclicity
      metric: >-
        over an exhaustive toy census, the number of curves on which some rational
        endomorphism acts non-scalarly on some order-N subgroup, cross-tabulated
        against the boolean "E[N] contained in E(F_p)"
      direction: different
      predicted: >-
        exactly zero non-scalar actions among curves with E[N] not rational, and at
        least one non-scalar action among curves with E[N] rational. A single
        non-scalar action on a curve with cyclic N-Sylow falsifies (B) outright and
        is far more likely an implementation error than a discovery.
    - observable: embedding degree of the leak family
      metric: >-
        k_emb = ord_N(p) computed for every census curve with E[N] contained in
        E(F_p)
      direction: different
      predicted: >-
        k_emb = 1 for every such curve, with no exceptions. A curve with E[N]
        rational and k_emb > 1 falsifies the Weil-pairing step in (C).
    - observable: Galois obstruction to the eigenspace map
      metric: >-
        the F_{p^k}-rational homomorphisms G -> W found by exhaustive search, for
        k running from 1 to k_emb, on toy curves with small k_emb
      direction: different
      predicted: >-
        the zero map only, for every k strictly less than k_emb, and a nonzero map
        at k = k_emb. A nonzero map below k_emb falsifies U4.

  minimal_test:
    design: >-
      Zero-compute part first, because it is the cheapest possible discriminator
      and it can kill the record before any code runs: write out (B) and (C) as a
      four-line derivation and check the two implications by hand against a
      standard reference. If either fails, the record is dead at zero cost.
      Compute part, all at toy scale and all exhaustive rather than sampled.
      (1) Build a census of ordinary curves over primes p of 12-16 bits, large
          enough that both branches are populated: curves with cyclic N-Sylow, and
          curves with E[N] contained in E(F_p) (these require N | p - 1 and are
          found by searching small N).
      (2) For each curve, compute E(F_p) as Z/n1 x Z/n2, read off whether N | n1,
          and compute k_emb = ord_N(p).
      (3) For each curve with CM by a small discriminant, evaluate the CM
          endomorphism on every point of the order-N subgroup and test whether the
          action is scalar. At 12-16 bits this is exhaustive, not sampled.
      (4) Cross-tabulate. The predicted table has one empty cell: cyclic Sylow with
          non-scalar action. Any entry there is the falsifier.
      Total cost: minutes on one core with an existing curve library. No solver, no
      Groebner basis, no isogeny walk.
    controls:
      - >-
        NULL OBJECT for step (3): replace the CM endomorphism by a uniformly random
        PERMUTATION of the order-N subgroup that fixes the identity. The scalarity
        test must REJECT the null essentially always (a random permutation of Z/N
        is a scalar with probability (N-1)/(N-1)! ), confirming the test has power.
        If the test accepts random permutations as scalars, the test is broken and
        every negative it produced is void, not negative.
      - >-
        PLANTED SIGNAL: a curve with N | p - 1 and E[N] contained in E(F_p),
        constructed deliberately at small N. The instrument MUST report a non-scalar
        action there. If it does not, the instrument cannot see the one phenomenon
        the record predicts, and its negatives are worthless. This is the
        two-directional control required by RQ-INSTR-f8faa0 and GOAL-ENDO-001 C4.
      - >-
        IMPLEMENTATION CONTROL: compute the group structure (n1, n2) by two
        independent routes -- random-point order testing, and Smith normal form of
        the O-module presentation used by IDEA-20260808-4d77a6 -- and require
        agreement. This separates an arithmetic bug from the claim.
    required_metrics:
      - per curve, (p, a, b, t, #E, n1, n2, N, N | n1, k_emb)
      - per curve with CM, the scalarity verdict per endomorphism, exhaustively over G
      - the 2x2 cross-tabulation with the predicted empty cell
      - null-object rejection rate and planted-signal detection rate
      - for the small-k_emb subfamily, the rank of Hom_{F_{p^k}}(G, W) for each k up to k_emb

  controls:
    - >-
      Matched null for the scalarity instrument: uniformly random identity-fixing
      permutations of the order-N subgroup, which must be rejected as non-scalar.
    - >-
      Matched planted signal: a k_emb = 1 curve with rational full N-torsion, which
      must be detected as carrying a non-scalar action.
    - >-
      Baseline reproduction fixture: a curve with N || #E, where the record's
      criterion and H-ENDO-001's current phrasing must agree, verbatim.
    - >-
      Nearby-object control from the proof_search_map: the k_emb = 1 curve and a
      k_emb-large curve of the same p and similar N must be assigned to different
      cells by the criterion, or the criterion is not load-bearing.

  confounders:
    - >-
      SUPERSINGULAR CURVES. For E/F_p supersingular, End_{F_pbar}(E) is a quaternion
      order and the argument in (B) as written concerns End_{F_p}(E) only. The
      record is scoped to ORDINARY curves and any supersingular instance in a census
      must be excluded before tabulation, not after.
    - >-
      SMALL N. To populate the leak branch one needs N | p - 1 with N | n1, which
      forces N^2 | #E and hence N <= sqrt(p). At toy scale this is fine; it also
      means the leak branch is populated only by cryptographically dead curves,
      which is the record's point but which also means the two branches differ in
      N as well as in the predicate. The cross-tabulation must therefore be reported
      with N, and the record must not claim the two branches are matched in N --
      they provably cannot be.
    - >-
      "Publicly computable" is a definitional boundary and is where a circular
      argument would hide. Following IDEA-20260727-005, a map whose evaluation
      requires a discrete logarithm is not admitted, and every map in the
      enumeration must carry an evaluation cost or be excluded by definition.
    - >-
      The eigenspace statement in U4 is RELAYED from the pairing literature via
      IDEA-20260807-569c82's own flagged relay and is not re-derived here. If it is
      wrong, U4's pricing is wrong; the rest of the record is unaffected.

  falsification_conditions:
    - >-
      A curve with cyclic N-Sylow on which some rational endomorphism acts
      non-scalarly on the order-N subgroup. (B) is false and the filter has a
      failure mode nobody has characterised. Requires independent replication before
      any interpretation, per AGENTS rule 5 discipline on surprising positives.
    - >-
      A curve with E[N] contained in E(F_p) and k_emb > 1. (C) is false and the
      leak is NOT confined to the MOV-broken family, which would make the boundary
      not airtight and would be the single most consequential outcome available.
    - >-
      An F_{p^k}-rational nonzero homomorphism G -> W with k strictly less than
      k_emb. U4's Galois-character pricing is false.
    - >-
      A publicly computable map out of G, or out of any object listed in U2, that
      the enumeration U1-U6 fails to classify. The enumeration is not exhaustive
      and the scope statement must be reopened.
    - >-
      The null-object control accepts random permutations as scalar, or the planted
      signal is not detected. The instrument is invalid; nothing measured with it
      counts in either direction.

  interpretation_limits:
    - >-
      This is a NEGATIVE-THEORY and SCOPE record. It asserts that one argument
      reaches one set of maps. It is not a lower bound, it is not evidence that
      ECDLP is hard, and it must never be reported as either. Shoup's bound remains
      the only generic lower bound in force.
    - >-
      Scoped to ordinary curves over prime fields. Says nothing about supersingular
      curves, extension fields, composite-order groups, or genus > 1.
    - >-
      The partial-homomorphism extension in (F) is a SKETCH. No constants are
      tracked, the applicability of Balog-Szemeredi-Gowers to the specific
      "publicly computable" class is not established, and the record does not claim
      the theorem. It is filed as forward guidance, which is what
      docs/inventor-protocol.md section 4 requires of a closure, not as a result.
    - >-
      "The boundary is airtight" means: airtight for the class of maps in (D), on
      the curves in the governed set of the quantifier statement. It does not mean
      the ECDLP is closed, and the largest ungoverned class (U1, the R1 lane) is
      also the largest lane in the field.
    - >-
      All compute is toy scale (12-16 bits). The mathematical statements in (B),
      (C), (E) are scale-free; the census is a check on the derivation and an
      instrument validation, not a crypto-scale measurement.

  assumptions:
    - E/F_p ordinary, p > 3, short Weierstrass, N prime dividing #E(F_p).
    - >-
      End_{F_p}(E) = End_{F_pbar}(E) for ordinary E over a prime field, so
      "rational endomorphism" and "endomorphism" coincide. [recall-confident,
      Deuring/Waterhouse; NOT re-verified this session.]
    - >-
      The Weil pairing e_N is non-degenerate and Galois-equivariant, so rational
      full N-torsion forces mu_N into the base field. [standard]
    - >-
      For ordinary E with p not congruent to 1 mod N, Frobenius acts on E[N] with
      distinct eigenvalues 1 and p, giving the eigenspace decomposition used in U4.
      [RELAYED via IDEA-20260807-569c82's own flagged relay; must be confirmed
      before being cited as more than a working fact.]
    - >-
      "Publicly computable" means evaluable in N^{o(1)} bit operations from public
      data, with maps requiring a discrete logarithm excluded by definition
      (inherited verbatim from IDEA-20260727-005).

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Leak-family rarity.) For ordinary curves over F_p with p uniform in a
        dyadic range and the curve uniform among those with a prime subgroup of
        order N > p^{1/2}, the probability that E[N] is contained in E(F_p) is
        exactly zero, and the probability that N | p - 1 (k_emb = 1) behaves like
        that of the multiplicative order of a uniformly random element of (Z/N)^*
        being 1, i.e. 1/(N-1).
      rigorous_support: >-
        The first half is RIGOROUS and not heuristic: E[N] contained in E(F_p)
        forces N^2 | #E(F_p) <= p + 1 + 2 sqrt(p), so N <= sqrt(p) + 1, which is
        incompatible with N > p^{1/2} for p > 4. Only the second half is heuristic,
        and the classical statement it imitates is the Erdos-Pomerance theory of the
        multiplicative order of a random residue, the same statement
        IDEA-20260727-005's H2 uses.
      validation_plan: >-
        Sampled quantity: the pair (N | n1, ord_N(p)) over an exhaustive census of
        ordinary curves at 12-16 bits, plus a random sample at 24 and 32 bits.
        Shortcut making sampling feasible: both quantities are computed from #E and
        the factorisation of N - 1 and p - 1, pure integer work at these sizes, with
        no curve arithmetic in the loop and no DLP solved. Comparison distribution:
        the empirical frequency of k_emb = 1 against 1/(N-1), and the empirical
        count of E[N]-rational curves against the rigorous zero for N > sqrt(p).
        Tail check: the SMALLEST k_emb observed across the census against the
        predicted frequency of k_emb <= 2, which at 32 bits should be zero
        occurrences in a sample of 10^4. TRANSFER ASSUMPTION, stated explicitly:
        nothing about the 12-16 bit census transfers to crypto scale except the
        rigorous half, and the record relies only on the rigorous half.
    - id: H2
      statement: >-
        (Partial-homomorphism stability threshold.) There is a function
        delta_0(N) such that every publicly computable map psi: S -> A with
        |S| >= delta_0(N) * N that is homomorphic on a constant fraction of pairs in
        S agrees with a genuine homomorphism G -> A on a positive-density subset;
        and delta_0(N) = Omega(1) is attainable by Balog-Szemeredi-Gowers plus
        Freiman-Ruzsa in Z/N, while delta_0(N) = N^{-c} is NOT reachable by that
        machinery.
      rigorous_support: >-
        The rigorous ingredient is that Z/N with N prime has no proper nontrivial
        subgroups, so any Freiman-structured subset of positive density is dense in
        an arithmetic progression of length comparable to N, which is the case where
        the structure theorems are strongest. The classical statement imitated is
        the Green-Ruzsa structure theorem in abelian groups. THE RECORD DOES NOT
        CLAIM THE THEOREM; H2 is flagged speculative and is the reason the record's
        novelty_status is not "known".
      validation_plan: >-
        Sampled quantity: at toy N (10-16 bits, so G is exhaustively enumerable),
        construct candidate partial maps psi by restricting an arbitrary function
        to a random subset S of density delta in a geometric grid
        delta in {1, 1/2, 1/4, ..., N^{-1/2}}, measure the largest subset on which
        psi is exactly homomorphic, and compare against the same statistic for a
        genuinely scalar psi and for a uniformly random psi. Comparison
        distribution: the random-psi baseline, computed exactly at these sizes.
        Tail check: the density at which the largest homomorphic subset of a random
        psi stops being O(log N), which is the empirical location of delta_0.
        Explicitly: this validates the THRESHOLD PHENOMENON, not the theorem, and
        it is labelled as such.

  target_complexity:
    time_exponent: >-
      No attack exponent is claimed and none moves. This is a scope record. The
      audit itself costs O(log p) integer operations plus one group-structure
      computation per curve; the exhaustive scalarity check in the minimal test is
      O(N) per curve and is toy-scale only, deliberately, since a sampled check
      would not be a proof of a universally quantified statement at those sizes.
    memory_exponent: >-
      O(log p) per curve for the audit; O(N) for the exhaustive scalarity check at
      toy N. Neither is a competitive figure for anything and neither is offered as
      one.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886 sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); the
      automorphism-discounted variant at 0.886 sqrt(N / r) with r <= 6
      (KN-TECH-018); BSGS at sqrt(N) time and sqrt(N) memory (KN-TECH-031).
    hidden_overhead: >-
      Nothing is hidden in an o(1) because no improvement is claimed. The honest
      disclosures run the other way: the leak family in (C) is nonempty, so the
      word "airtight" is scoped and not absolute; and the U3 crack is open, so the
      enumeration is a classification with a hole in it and the hole is named.
    tradeoff_note: >-
      Not applicable; no algorithm is proposed. If the U3 crack were ever closed
      positively -- a publicly computable sub-polynomial-density partial
      homomorphism -- the resulting cost would have to be charged in the full
      van Oorschot-Wiener model before any comparison, and nothing in this record
      anticipates such a construction.

  sota_delta: >-
    Zero. This record contains no attack, no speedup, and no exponent. Its
    contribution is a scope statement about an existing hypothesis and an
    enumeration of what that hypothesis does not reach.

  dominated_by: >-
    As an attack, dominated by everything, since it is not an attack. Checked
    against every row of the frontier the program maintains: parallel Pollard rho
    with distinguished points at 0.886 sqrt(N) and O(1) memory (KN-TECH-001,
    KN-TECH-006); the automorphism-discounted variant (KN-TECH-018); BSGS at
    sqrt(N) time and memory (KN-TECH-031); the preprocessing frontier at N^{1/3}
    online with N^{1/3} advice (Corrigan-Gibbs-Kogan, as charged in
    DEC-20260727-008). As a SCOPE STATEMENT it is dominated in part by
    IDEA-20260727-005, which already classifies homomorphic exits by target and
    already names the non-algebraic lane as the survivor; this record is Pareto-
    incomparable with it only on the source-side enumeration, the cyclicity
    equivalence, and the U3 crack, and that is the honest extent of the delta.

