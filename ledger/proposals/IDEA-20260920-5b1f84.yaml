      prime-field arms cannot answer, and does not touch coverage. EV-ECDLP-
      31e91c records an r_walk = 16 rejection consistent with Teske's r >= 20
      heuristic on a prime field; this record's r-ladder is the same
      observation as a graded control on the new field. RQ-EWALK-8fa147 owns
      endomorphism/automorphism walk speedups and is excluded by card C-2.
      RQ-ICPERF-94c86e, RQ-GRUMPY-964876, IDEA-20260731-010, H-GFPN-ee4d45 and
      the GOAL-GFPN-380702 scope_exclusions are untouched. Nearest owned
      record: H-ECDLP-3550b8; what is added at deployed parameters: the
      one-coefficient partition on F_{p^5} with the Z/n transport as the
      absolute reference.
