idea:
  id: IDEA-20260920-5b1f84
  question_id: RQ-GFPN-c01af8
  added: '2026-09-20'
  status: proposed
  approved_by: null
  title: >-
    Control: does an r-adding walk on E(F_{p^5}) whose partition index and
    distinguished-point predicate read ONE base-field coefficient of x mix as
    well as a walk that hashes all five coefficients, and as well as the
    generic Z/n walk?
  class: control
  claim: >-
    The cheapest partition function on this field reads the constant
    coefficient x_0 of x (which is Tr(x)/5, Galois-invariant) or any single
    coefficient x_i, and takes j = x_i mod r; the cheapest distinguished-point
    predicate reads low bits of the same word. The competing explanations this
    control separates are H0: any cheap deterministic function of the point
    behaves as a random partition, so the expected steps-to-solve is
    sqrt(pi n / 2) (1 + 1/(2r)) (1 + o(1)) with the random-mapping rho-length
    distribution, identical for the one-coefficient walk, the five-coefficient
    hashed walk and the Z/n generic walk; versus H1: the arithmetic structure
    of a single coefficient (trace, Galois invariance, the Goldilocks prime's
    low-bit structure) induces a measurable step-to-step correlation in the
    partition sequence, raising the constant by at least 5% or distorting the
    tail. The claim, stated so it can fail: H0 holds on this field, i.e. the
    ratio of mean steps-to-solve (one-coefficient over hashed) is 1.00 +/- 0.03
    at r = 32 on subgroups of order about 2^32 to 2^40, the distributions agree
    (Kolmogorov-Smirnov p > 0.05), the DP rate equals the set density within
    1%, and the graded r-ladder tracks 1 + 1/(2r); while the positive control
    (Pollard's original three-way partition with a doubling branch, recorded in
    KN-LIT-012 as about 20% worse) is detected as at least 1.10. A 5% excess
    reproduced on two seeds and absent on Z/n is the H1 outcome and would mean
    the one-coefficient walk must not be used for the ruler's cost
    measurement. The tracked object is unchanged; the cost stage in question is
    walk mixing (card C-4).
  mechanism: >-
    OBJECT FRAME (card C-4). Representation: affine F_{p^5} coordinates in the
    polynomial basis; the partition index and the DP predicate are functions
    of one 64-bit coefficient. Operation set Sigma: the translation action of
    the r-adding walk. The tracked object is the lossless F1 object; the
    partition index j(R) is a coordinate-dependent projection (Class III)
    used only to CHOOSE the translation, never to identify points, so no
    lossy-projection question arises for the object; what is tested is the
    random-mapping quality of the induced walk.
    WHY THERE IS SOMETHING TO TEST. On a prime field the standard partition
    reads low bits of x and Teske's empirical result is that r >= 20 reaches
    the random-walk constant (KN-LIT-012, relayed). On F_{p^5} the one-word
    read is the constant coefficient, which is 1/5 of the field trace: it is
    invariant under the field Frobenius acting on the coordinate, and the
    walk's next point x(R + T_j) has x_0 a degree-high rational function of
    all ten coordinates of R and T_j. There is no low-degree relation between
    x_0(R) and x_0(R + T_j) that the generator can name, which is exactly why
    this is a control rather than a claim of structure: the generic heuristic
    says H0, and the record exists to measure it rather than assume it on a
    field whose deployed arithmetic makes this read the natural choice.
    The DP predicate raises the same question: a predicate on low bits of x_0
    must fire at the set density and independently of the partition index; a
    correlation between the two would bias trail lengths.
    FIELD FROBENIUS. Not used by the walk. The Galois invariance of x_0 is
    mentioned only as the reason the coefficient is a distinguished object;
    no Frobenius-orbit walk and no equivalence class is proposed (card C-2).
    Kim-Cheon-Hong's subset-restricted walks (KN-LIT-6866) use Frobenius as a
    normal-basis shift on F_{p^m}^* and are outside this card; Cheon-Hong-Kim's
    tag tracing (KN-LIT-6767) follows the walk with partial products on F_p^*
    and its elliptic-curve analogue is closed on cost in IDEA-20260807-4cebed;
    neither is a component here.
  novelty_status: unverified
  origin:
    kind: user_supplied_idea
    date: '2026-09-20'
    seeded_from_sketch: S4
    scope: >-
      Sketch S4 seeded in the 2026-09-20 conversation and handed over in
      TASK-20260920-0eace8; the generator added the H0/H1 framing, the
      positive control, the graded r-ladder, the DP-predicate check and the
      per-coefficient arm.
    overlap_review: >-
      H-ECDLP-3550b8 (RQ-ECDLP-78dbc5) measures basin-partition coverage of
      distinguished-point tables and records that every constant is identical
      between a keyed random function and an r-adding curve walk on prime
      fields at 2^20..2^30; this record asks the walk-quality question on the
