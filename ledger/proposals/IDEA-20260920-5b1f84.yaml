  citation_note: >-
    No primary source was opened; Teske's constant is relayed through
    KN-LIT-012. The control itself is standard practice and claims no
    novelty; novelty_status is unverified because the corpus has no
    measurement of walk quality on F_{p^5} and the literature was not
    searched for one.
  assumptions:
    - Plain r-adding walk with no negation map (card user_constraint); no fruitless cycles exist, so any non-randomness measured is the partition's, not the class structure's.
    - The r table points T_j are random known multiples a_j P + b_j Q, regenerated per seed; the same table is used for the one-coefficient and hashed arms so only the index function differs.
    - The hashed arm uses a keyed non-cryptographic hash of all ten coordinate words (x and y) reduced mod r; the "random partition" reference is the Z/n transport with a random label table.
    - Subgroup orders about 2^32 to 2^40 on a random curve over the deployed F_{p^5} (point counting by PARI ellcard over F_{p^5}, or a subfield curve's zeta function as an instrument convenience with the walk never using Frobenius), and toy p' cells at 2^24 to 2^30.
    - At least 400 solves per cell so that the standard error of the mean steps ratio is below 2.6% (rho-length standard deviation about 0.52 of the mean).
    - Uses the F1 walk-collision family as its component; nothing outside it.
  proof_search_map:
    bottleneck: >-
      Whether the induced walk's collision time and DP rate are those of a
      random mapping when the index is one coefficient.
    baseline_embedding:
      parameter_slice: >-
        The Z/n transport with a random label table is the exact
        random-partition reference; the hashed arm must match it first.
      reproduction_check: >-
        Hashed arm versus Z/n: ratio 1.00 +/- 0.03 and KS p > 0.05 before the
        one-coefficient arm is read.
    observation_collision:
      observable: >-
        Mean and distribution of steps-to-solve normalized by sqrt(n), DP rate,
        and the lag-1 autocorrelation of the partition-index sequence.
      distinct_preimage_search: >-
        A walk with a bad partition and a walk with a good partition but a
        biased DP predicate can give the same mean; the DP-rate metric and the
        index autocorrelation separate the two causes.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: The partition-index sequence j_1, j_2, ... of one trail as a lossy projection of the trail
        predicted_gain: None claimed; under H0 the sequence is indistinguishable from i.i.d. uniform on r symbols at lag 1 to 8
    quantifier_order: >-
      For every cell in the preregistered ladder (order, r, index function,
      coefficient), there exist at least 400 certified solves from fresh
      targets on which the ratio and the distribution are reported.
    method_ceiling:
      strongest_certifiable_claim: >-
        That the one-coefficient walk is (or is not) random-mapping-like on
        this field at the tested orders within the stated tolerance; nothing
        about r-adding walks in general.
      nearby_object_control: >-
        The Z/n transport (absolute reference), the hashed arm (same field,
        no single-coefficient structure), and Pollard's original three-way
        partition with doubling (known-bad positive control, about 20% worse).
    proof_obligations:
      - claim: Every solve is certified by independent scalar multiplication.
        responsibility: correctness
      - claim: The positive control is detected at >= 1.10 before any negative is reported.
        responsibility: feasibility
      - claim: Sample sizes give the stated power (SE < 2.6% at 400 solves).
        responsibility: size
      - claim: Results are scoped to the tested orders, r values and coefficient reads.
        responsibility: scope
  predictions:
    - metric: mean_steps_ratio_one_coefficient_over_hashed
      direction: flat
      minimum_effect: 1.00 +/- 0.03 at r = 32 on every cell (H0); an H1 outcome is >= 1.05 reproduced on two seeds and absent on Z/n.
    - metric: ks_test_p_value_steps_distribution
      direction: flat
      minimum_effect: p > 0.05 against the hashed arm and against Z/n on every cell.
    - metric: dp_rate_over_set_density
      direction: flat
      minimum_effect: 1.00 +/- 0.01 for the one-coefficient predicate.
    - metric: partition_index_lag_autocorrelation
      direction: flat
      minimum_effect: Within 3 standard errors of zero at lags 1 to 8 on trails of 2^20 steps.
    - metric: r_ladder_constant
      direction: different
      minimum_effect: Mean steps / sqrt(pi n / 2) tracks 1 + 1/(2r) within 0.03 across r in {4, 8, 16, 32, 64} (graded control must move).
    - metric: positive_control_ratio
      direction: higher
      minimum_effect: Pollard's original three-way partition at least 1.10 x the hashed r = 32 arm.
  minimal_test:
    design: >-
      Instrument: the F_{p^5} rho backend of IDEA-20260920-68b279 with a
      pluggable partition function and DP predicate (new tooling, V5). Cells:
      subgroup orders about 2^24, 2^28 (toy p') and 2^32, 2^36, 2^40 (deployed
      field, random curve); index functions: x_0 mod r, x_4 mod r, high bits
      of x_0, keyed hash of all coordinates, Z/n random-label transport,
      Pollard three-way with doubling; r in {4, 8, 16, 32, 64} for the x_0 and
      hashed arms, r = 32 elsewhere; DP predicate on low bits of x_0 at
      density 2^-8; 400 certified solves per cell from fresh targets, two
      seeds. Report mean ratio with interval, KS statistic, DP rate, index
      autocorrelation, r-ladder curve.
    controls:
      - Hashed-partition arm on the same field, same table, same targets (null for "one coefficient").
      - Z/n generic transport with a random label table (absolute random-partition reference).
      - >-
        Positive control, Pollard's original three-way partition with a
        doubling branch; must read >= 1.10.
      - >-
        Graded control, the r-ladder; must track 1 + 1/(2r), and a flat curve
        marks the instrument as unable to resolve the constant.
      - Per-coefficient arm (x_4 instead of x_0) to separate "trace coefficient" from "any coefficient".
    required_metrics:
      - mean_steps_ratio_per_cell_with_interval
      - ks_statistic_and_p_per_cell
      - dp_rate_per_cell
      - index_autocorrelation_lags_1_to_8
      - r_ladder_curve
      - positive_control_ratio
      - certificate_pass_rate
  falsification_conditions:
    - >-
      H0 falsified on this instrument; one-coefficient ratio >= 1.05 with
      p < 0.01, reproduced on both seeds, absent on Z/n and on the hashed arm
      (then the one-coefficient read must not be used for the ruler's cost
      measurement and the structure is reported with its autocorrelation
      signature).
    - >-
      Instrument void; positive control below 1.10, or hashed arm differs from
      Z/n by more than 3%, or the r-ladder does not move; no negative is
      reported from a void instrument.
    - DP rate off by more than 1% (predicate bias; the DP-predicate read must change before any mixing number is read).
  confounders:
    - >-
      Too few solves; the rho-length distribution has standard deviation
      about half the mean, so a 3% tolerance needs about 400 solves per cell,
      and fewer leaves the control without power.
    - Table points shared across arms but regenerated between seeds; a fixed bad table would show as a seed effect, which the two-seed design exposes.
    - Toy p' cells with p' small enough that x_0 mod r is non-uniform (p' not much larger than r); p' >= 2^20 avoids this.
    - Small-subgroup cofactor projection producing points whose x_0 has hidden structure from the cofactor map; the per-coefficient arm and Z/n transport separate this.
  interpretation_limits:
    - Proposal only; no experiment, run, approval or result exists here.
    - >-
      A control, not a speedup; the best outcome is that the cheapest
      partition is admissible for the ruler's cost measurement, the worst is
      that it is not. No exponent, no security statement.
    - Scoped to the tested orders, r values, coefficient reads and this field; nothing about r-adding walks elsewhere.
  heuristic_assumptions:
    - id: H-S4-1
      statement: >-
        RANDOM-MAPPING HEURISTIC (the hypothesis under test, H0): an r-adding
        walk on a prime-order subgroup of E(F_{p^5}) with the index read from
        one coefficient of x and r >= 32 has collision time distributed as the
        rho length of a uniformly random mapping on n points, with mean
        sqrt(pi n / 2)(1 + 1/(2r))(1 + o(1)).
      rigorous_support: >-
        The rho-length law for random mappings is a theorem; the first-order
        r-adding correction and Teske's r >= 20 threshold are empirical
        (KN-LIT-012 relayed; sibling note). No theorem covers the induced walk.
      validation_plan: >-
        Exactly the minimal test: 400 solves per cell at orders 2^24..2^40,
        empirical CDF of steps / sqrt(n) against the random-mapping rho-length
        law, KS test, tail check at the 95th and 99th percentiles, Z/n
        transport as the absolute reference. Transfer to n = 2^320 is the
        standard rho heuristic and is stated as such.
  heuristic_note: >-
    The record's only heuristic is the one it tests; the positive and graded
    controls are what make a negative reading a measurement rather than an
    assumption.
  target_complexity:
    time_exponent: Unchanged, n^{1/2}; the question is whether the constant is 1.00 or >= 1.05 for the cheapest partition.
    memory_exponent: Unchanged.
    best_known: Pollard rho 0.886*sqrt(n) group operations with negation (KN-TECH-006, KN-TECH-018), about 2^159.8 on EcMasFp5 and about 2^159.3 on EcGFp5.
    hidden_overhead: None; the hashed partition costs a few dozen word-level operations more per step than the one-coefficient read, which is the only thing at stake.
    tradeoff_note: Not applicable.
  estimated_cost:
    implementation: low
    compute: medium
    qualification: >-
      Shares the tooling of IDEA-20260920-68b279 (charged there); the
      partition and predicate plug-ins are small. Compute: about 30 cells x
      400 solves at up to 2^20 steps each, about 2^33 steps in total, hours
      on a few cores.
  asymptotic_claim:
    problem: ECDLP on E(F_{p^5}) at p = 2^64 - 2^32 + 1 (walk quality of the generic algorithm)
    prior_best: 0.886*sqrt(n) group operations (rho with negation)
    time_exponent: 1/2 (unchanged)
    memory_exponent: unchanged
    hidden_cofactor: none claimed
    claim_kind: constant_factor
  dominated_by: >-
    n/a (no result claimed on any cost axis): this is a control on the ruler's
    walk. Rows checked and untouched: rho with negation, BSGS, multi-target
    rho, the S*T^2 frontier, the a639a1 band.
  sota_delta:
    time: 0; a control reading of 1.00 +/- 0.03 or a structure finding of >= 1.05 on the walk constant.
    memory: 0 (zero).
    data_queries: Not applicable.
  frontier_check:
    status: pending
    note: >-
      No corpus record measures r-adding walk quality on F_{p^5}; the
      prime-field measurements (H-ECDLP-3550b8, EV-ECDLP-31e91c) are the
      nearest and are consistent with H0 there.
  recommended_priority: low
  priority_rationale: >-
    Constant-factor work is not target-class under docs/target-result-profile.md
    rule A1, and this record says so. For GOAL-GFPN-380702 it decides only
    whether the cheapest step (the one IDEA-20260920-0d218c prices) is
    admissible as the ruler's step; it is a prerequisite check on the
    instrument rather than a number the goal cites. Low, but it should run
    inside the tooling's calibration rather than as its own contract.
  first_deliverable: >-
    The pluggable partition and predicate interface and the Z/n transport in
    the F_{p^5} rho backend (IDEA-20260920-68b279), then the positive-control
    and r-ladder cells, then the one-coefficient versus hashed table.
  next_gate: Coordinator decision to fold this into the tooling record's calibration suite or to hold it as a separate low-priority contract.
