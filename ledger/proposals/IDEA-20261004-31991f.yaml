# IDEA-20261004-31991f -- adaptation of IDEA-20260915-3f1964's side dichotomy
# from the binary subspace PDP to Gaudry/Diem extension-field descent
# (E/F_{q^n}, factor base x in F_q, q odd), filed against RQ-GFPN-c01af8.
# Authored by a top-level session from a user chat (2026-10-04) after a
# duplicate screen showed every other twist/isogeny idea from that chat was
# already on the ledger. Not idea-generator output. No speedup is claimed.
# =============================================================================
