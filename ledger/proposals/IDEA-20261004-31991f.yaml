  assumptions:
    - q odd; the curve is put in the form y^2 = f(x) before the side bit is computed. Characteristic 2 is IDEA-20260915-3f1964's setting and is out of scope here.
    - Factor-base x-values with f(x) = 0 are excluded or classified separately; they are on both sides.
    - The system's treatment of repeated x-values (allowed, forbidden, or symmetrized away) is stated by the harness, since it decides whether cancelling-pair roots can appear at all.

  proof_search_map:
    bottleneck: >-
      Separating encoding defects from genuine non-lifting roots in a
      Weil-descent harness without a second solver.
    baseline_embedding:
      parameter_slice: >-
        n = 1 recovers IDEA-20260906-476f20's F_{p^2} picture (K = F_p, sigma
        the F_{p^2}/F_p involution); the binary analogue is IDEA-20260915-3f1964.
      reproduction_check: >-
        At n = 3, toy q, the exhaustive table of (C1) must reproduce the
        partition identity |X_0| + |X_1| + r_q = q and find zero roots outside
        types (a)-(c).
    observation_collision:
      observable: per-root side vector (s(x_1), ..., s(x_m), s(x_R)).
      distinct_preimage_search: >-
        Known-false classifiers that a plausible bug would produce: the
        Legendre symbol of one power-basis coordinate of f(x) instead of its
        norm, and an independent random bit per x. Both must show many
        apparent mixed roots (about 1 - 2^{1-m} of roots for the random bit).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The side bit as a per-root classifier and the twist as a second
          target set for the same compiled system.
        predicted_gain: >-
          An exact unlifted-root prediction and twist pricing at zero extra
          system-construction cost; no speedup.
    quantifier_order: >-
      For every odd q, every n >= 1, every E/K in the form y^2 = f(x), every m,
      and every root of the descended system with no f(x_i) = 0, the side-1
      sub-sum lies in E(K)[2] (deterministic, proved above). The rate
      statements in (C2) and (C3) are heuristic and per-curve.
    method_ceiling:
      strongest_certifiable_claim: >-
        The lemma, and exact root classifications and counts at toy q where the
        sign-sum table is enumerable; nothing about cost at p = 2^64 beyond the
        first-order statement in (C3).
      nearby_object_control: >-
        A random ordinary curve over the same K with and without a K-rational
        2-torsion point: type (c) roots must appear only in the former.
    proof_obligations:
      - claim: chi_K(a) = chi_q(N_{K/F_q}(a)) for a in K^*
        responsibility: correctness
      - claim: sigma fixes side-0 and negates side-1 points of E(L) with x in F_q
        responsibility: correctness
      - claim: the side-1 sub-sum of a root lies in E(K)[2]
        responsibility: correctness
      - claim: translation by T in E(K)[2] preserves the side
        responsibility: correctness
    not_applicable_reason: null

  predictions:
    - metric: roots whose side-1 sub-sum is not in E(K)[2] (side-0 targets), or whose side-0 sub-sum is not in E(K)[2] (side-1 targets)
      direction: different
      minimum_effect: exactly 0 on every instance; any nonzero count is an encoding or arithmetic defect, not a finding
    - metric: unlifted roots minus (cancelling-pair roots + type (c) roots), side-0 targets with x_R not in F_q
      direction: different
      minimum_effect: exactly 0 at every tested cell
    - metric: type (c) roots on curves with E(K)[2] = {O}
      direction: different
      minimum_effect: exactly 0 (EcMasFp5-shaped toy curves); the EcGFp5-shaped control may show a nonzero count
    - metric: per-side mean relation count for random targets, side 1 over side 0
      direction: different
      minimum_effect: >-
        equal, within Poisson sampling error, to the exact double-counting
        ratio computed from the measured |X_0|, |X_1|, #E(K) and #E^d(K) at
        each toy cell; a significant departure means the twist is not priced
        by the same template as claimed in (C3)
    - metric: random-bit classifier mixed fraction (null object)
      direction: different
      minimum_effect: about 1 - 2^{1-m} of roots, showing that a zero mixed count is not a pipeline artifact

  minimal_test:
    design: >-
      Toy n = 3, m = 3, q prime from 2^7 to 2^9, four curves per q: two
      EcMasFp5-shaped (odd order, no rational 2-torsion) and two
      EcGFp5-shaped (rational T = (0, 0)), plus one random curve of each kind.
      (1) Compute X_0, X_1, r_q and check the partition identity. (2) Build the
      exhaustive sign-sum table: for every multiset {x_1, x_2, x_3} from
      X_0 union X_1, lift to E(L), form the four sign sums, and record x(sum)
      with the side vector whenever the sum lies in E(K) union ker(sigma + 1).
      (3) Classify every entry as type (a), (b), (c) or impossible.
      (4) Draw 40 side-0 and 40 side-1 targets per curve with x_R not in F_q,
      solve the descended S_4 system with the lane's solver (msolve if
      installed), and compare every returned root and the solver's unlifted
      count with the table.
    controls:
      - NULL - random-bit side classifier on the same tables.
      - KNOWN-FALSE - power-basis-coordinate Legendre classifier on the same tables.
      - NEARBY OBJECT - with and without K-rational 2-torsion, same q and n.
      - RECONSTRUCTION - partition identity exact; every table triple hits exactly one x-value per sign pattern.
    required_metrics:
      - per curve - q, n, r_q, |X_0|, |X_1|, #E(K), #E^d(K), #E(K)[2]
      - per target - side of x_R, table count, solver count, unlifted count, root types
      - per classifier - mixed fraction
    budget: >-
      Table size about 4 * C(q + 2, 3) sign sums per curve, 1.4e8 at q = 2^9
      in F_{q^6} arithmetic; advisory.

  falsification_conditions:
    - Any root of type "impossible" with no matching arithmetic defect - the lemma or its proof is wrong; the record is withdrawn until localised.
    - Type (c) roots on a curve with E(K)[2] = {O} - the E(K)[2] sharpening is wrong.
    - A solver's unlifted count that the table does not explain - the encoding is lossy or the lifting check is wrong, and every unlifted count in the lane's existing runs needs re-reading.

  confounders:
    - Completing the square changes the model; the side bit must be computed on the model the descended system uses.
    - Symmetrized systems (elementary symmetric functions, 2-torsion translation quotient) return orbits, not ordered roots; counts must be compared orbit for orbit.
    - Repeated x-values may be excluded by the encoding, in which case cancelling-pair roots are zero by construction and (C2) is trivial at that cell.

  interpretation_limits:
    - An instrument and a lemma. No speedup, no exponent, no security figure for EcGFp5 or EcMasFp5.
    - (C3) is a first-order statement at fixed n; constants (n! 2^{n(n-1)}, double large primes, linear algebra) are equal by construction for E and E^d but are not priced here.
    - "CORRECTIONS RECORDED HERE SO THEY ARE NOT RE-PROPOSED: (i) a factor base x in F_q does NOT double for even n on a generic E/F_{q^n}, because the side is chi_K(f(x)) with f(x) in K, not in F_q; doubling happens only when f has F_q coefficients, and then the points lie in E(F_{q^2}) and project trivially to a large prime-order subgroup (IDEA-20260906-476f20 for n = 2). (ii) Rejected roots of an E-side target are NOT a source of twist relations; by the lemma they are cancelling pairs or 2-torsion coincidences, and twist relations come only from twist-side targets."

  heuristic_assumptions:
    - id: H1
      statement: >-
        |X_s| = q/2 + O(n sqrt(q)) for s = 0, 1.
      rigorous_support: >-
        Weil's bound for the character sum of chi_q(N_{K/F_q}(f(x))), a
        polynomial of degree 3n in x over F_q, provided it is not a constant
        times a square in F_q[x] (generic; recalled, not re-derived here).
      validation_plan: >-
        Measured exactly at every toy cell; report |X_0| - |X_1| against
        (3n - 1) sqrt(q).

