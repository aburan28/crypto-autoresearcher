  title: >-
    THE SIDE DICHOTOMY FOR EXTENSION-FIELD DESCENT: for E over K = F_{q^n}
    (q odd) and the Gaudry/Diem factor base x in F_q, every F_q-rational root
    of the descended S_{m+1}(x_1, ..., x_m, x_R) splits its points by the
    quadratic character of f(x_i) over K, and the twist-side points always sum
    to a K-RATIONAL 2-torsion point -- so on a curve with no rational 2-torsion
    (EcMasFp5) a root is an E-decomposition plus a zero-sum twist relation,
    the unlifted-root count of a descent harness is predicted in closed form,
    and the identical system template prices Gaudry on the quadratic twist
  class: control

  claim: >-
    Setting: q odd, K = F_{q^n}, L = F_{q^{2n}}, sigma the generator of
    Gal(L/K), E: y^2 = f(x) over K with f a cubic (any odd-characteristic
    Weierstrass model after completing the square; EcGFp5's y^2 = x(x^2 + ax
    + b) and EcMasFp5's y^2 = x^3 + 3x + 8z^4 are both of this shape). For
    x in F_q with f(x) != 0 there is a point P in E(L) with x(P) = x; define
    its side s(x) = 0 if f(x) is a square in K (P in E(K)) and s(x) = 1
    otherwise (sigma(P) = -P; P is the image of a point of the quadratic
    twist E^d(K)). The side is computable in F_q as the Legendre symbol of
    N_{K/F_q}(f(x)), because chi_K(a) = chi_q(N_{K/F_q}(a)). Write X_0, X_1 for
    the side-0 and side-1 x-sets in F_q and r_q for the number of roots of f
    in F_q; then |X_0| + |X_1| + r_q = q exactly.

    (L) LEMMA. Let (x_1, ..., x_m) in F_q^m be a root of the Weil-descended
    S_{m+1}(x_1, ..., x_m, x_R) = 0, x_R in K, with no f(x_i) = 0. Choose the
    points P_i in E(L) and the sign so that P_1 + ... + P_m = R with R in E(K)
    or R in ker(sigma + 1) (x_R side 0 or side 1). Let S_1 be the sum of the
    side-1 P_i. If x_R is side 0, then S_1 lies in E(K)[2]. If x_R is side 1,
    the side-0 sub-sum lies in E(K)[2] by the same argument with the roles
    swapped. PROOF: apply sigma to the relation; side-0 points are fixed and
    side-1 points negated, so subtracting gives 2 S_1 = O (side-0 target).
    S_1 = R - S_0 lies in E(K), so S_1 is a K-rational 2-torsion point.

    (C1) THREE ROOT TYPES, EXHAUSTIVE. For a side-0 target every root is
    (a) all side 0, an ordinary E-decomposition over X_0; (b) mixed with
    S_1 = O: the side-1 points form a zero-sum relation on the twist (the
    trivial instance is a cancelling pair x_i = x_j) and the side-0 points
    form a SHORTER decomposition of R; or (c) mixed with S_1 = T, a nonzero
    K-rational 2-torsion point, possible only when E(K)[2] != {O}. EcMasFp5
    (odd order, cofactor 1) has no type (c). EcGFp5 (rational T = (0, 0))
    does.

    (C2) CLOSED-FORM UNLIFTED-ROOT PREDICTION. A lifting check that accepts a
    root only when every x_i lifts to E(K) rejects exactly the type (b) and
    (c) roots. A type (b) root with k side-1 points needs a k-point zero-sum on
    the twist, about |X_1|^k / #E^d(K) of them, times an (m - k)-decomposition
    of R. Relative to the ordinary yield this is O(C(m, k) q^{-n}) for k >= 3:
    zero at every feasible size. The k = 2 cancelling-pair roots are relative
    rate O(m^2 / q) when the system admits repeated x-values and need
    x_R to have an (m - 2)-decomposition; at m = 3 they exist only when
    x(R) is itself in F_q. So the harness's unlifted count, for side-0 targets
    with x_R not in F_q, is predicted to equal its count of cancelling-pair
    roots plus type (c) roots, with any remainder an encoding or arithmetic
    defect.

    (C3) THE TWIST USES THE SAME SYSTEM. A side-1 target turns the identical
    descended S_{m+1} template into the point-decomposition problem on
    E^d(K) over X_1. Since |X_0| and |X_1| are both q/2 + O(n sqrt(q))
    (a character sum of the degree-3n polynomial N_{K/F_q}(f(x)), heuristic
    Weil bound) and #E(K), #E^d(K) are both q^n + O(q^{n/2}), Gaudry's cost on
    the twist equals its cost on E to first order at fixed n. Consequence for
    the lane: to first order, twist-side index calculus costs the same as
    curve-side index calculus, so for EcMasFp5 (twist rho 101.93 bits, IDEA-20260920-a639a1)
    the question "does IC undercut the twist?" reduces to the curve-side
    Gaudry estimate the lane already prices. No new security figure is claimed.

  mechanism: >-
    TRACKED OBJECT: the side bit s(x) = chi_q(N_{K/F_q}(f(x))) on the factor
    base x-set, a one-bit lossy projection of each point that propagates
    deterministically through the only operation point decomposition uses,
    summation to the target, because sigma acts on side-1 points as -1. This
    is the argument IDEA-20260915-3f1964 makes for E over F_{2^n} with an
    F_2-subspace factor base and the F_{q^2}/F_q involution. Here sigma is the
    involution of F_{q^{2n}}/F_{q^n}, the factor base is the subfield F_q, and
    the exception set is sharpened from "a sub-sum in E[2]" to "a sub-sum in
    E(K)[2]", which is what separates the two named GFPN curves. The side bit
    is cheap to compute (one norm and one Legendre symbol in F_q per x), so
    the classifier costs O(q) once per curve.

    LOSSY-PROJECTION TEST: the bit discards the point except the coset of
    E(L) under {P : sigma(P) = P} versus {P : sigma(P) = -P}, and that bit
    determines which group a decomposition lives in. It is not a change of
    coordinates; it is the decomposition E(L) = E(K) + ker(sigma + 1) read
    one point at a time (cf. IDEA-20260906-476f20 for the n = 1, q = p case).

  novelty_status: adaptation
  novelty_note: >-
    The dichotomy itself is IDEA-20260915-3f1964's (binary subspace PDP). That
    descended systems have roots over the closure that do not lift, and must
    be checked, is folklore that IDEA-20260915-3f1964 records as stated in
    Galbraith-Gebregiyorgis ePrint 2014/806 Sec. 4 (read by its task, not by
    this session). This record adds the extension-field/subfield setting, the
    E(K)[2] sharpening that distinguishes EcGFp5 from EcMasFp5, the norm
    formula for the side bit, the exact partition identity, the unlifted-root
    prediction, and the twist corollary. No web search was run for this
    record; the absence of a ledger hit is not evidence of absence elsewhere.

