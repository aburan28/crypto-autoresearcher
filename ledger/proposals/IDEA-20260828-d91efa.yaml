idea:
  id: IDEA-20260828-d91efa
  question_id: RQ-DREG-001
  added: '2026-08-28'
  title: >-
    Does the amalgam's Hilbert series factor as a tensor product over the
    shared U-block, H_full(t) =? H_A(t)*H_B(t)/H_{k[U]}(t) under a
    Tor-independence (flatness) condition -- tested against the ALREADY
    COMMITTED n=9 and n=12 data at near-zero new compute, as a candidate
    zero-compute extrapolation route past the memory wall
  class: mechanism
  claim: >-
    The full system's freeze degree / column-count sequence at each
    committed cell (n=9, n=12; D=5,6) is predicted, within a pre-registered
    band, by the formula H_full(t) =? H_A(t)*H_B(t)/H_{k[U]}(t), evaluated
    using the already-derived per-block semi-regular Hilbert series H_A,
    H_B (H-DREG-5a3ac1). This formula is a CANDIDATE, not a theorem, since
    its exactness requires a Tor-independence (flatness) condition that
    these specific non-free Artinian-type sub-quotients are unlikely to
    satisfy exactly. If it fits within the pre-registered band, small
    sub-block computations (each in a materially smaller ring than the full
    glued system -- nb_A = n+k, nb_B = n+2k, vs the full nb = n+3k) supply a
    candidate, zero-marginal-compute forward-extrapolation route past the
    memory wall, since I_A and I_B never need to be glued into the full
    nb-variable Macaulay matrix at all.
  mechanism: >-
    The chained boolean Semaev system at t=3 is the sum of two ideals I_A
    (n quadrics on the (U,X3) block) and I_B (n cubics on the (U,X1,X2)
    block) sharing only the U variables (H-DREG-152cff's already-derived
    block decomposition). The quotient ring R = k[U,X1,X2,X3]/(I_A+I_B) is
    R_A tensor_{k[U]} R_B where R_A = k[U,X3]/I_A, R_B = k[U,X1,X2]/I_B. For
    A-modules M, N with N flat over A, H_{M tensor_A N}(t) = H_M(t)H_N(t) /
    H_A(t) (standard commutative algebra; confirmed by web search this
    session). R_B is almost certainly NOT flat over k[U] (these are highly
    non-free Artinian-type quotients), so the formula's success or failure
    is itself informative: a fit shows the OBSERVABLE (deficit/freeze
    degree) is not sensitive to cross-block syzygies at reachable n -- not
    that they don't exist -- while a failure localizes the missing content
    to a correction term c(n,D), which becomes the next object to
    characterize.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-28'
    corpus_paths_grepped: [ledger/proposals (RQ-DREG-001 subset), ledger/hypotheses, ideas/catalogue-20260805/A2-solving-degree.md]
    grep_results:
      - "H-DREG-5a3ac1's own mechanism ALREADY computes per-block Hilbert
         series H_A(z), H_B(z) under the semi-regular heuristic and tries a
         DIFFERENT, cruder combination ('freeze degree lifted by X1-X2
         monomials'), which it states is 'ALREADY FALSIFIED' (phi_A<=5 fails
         at n=15 while the measured D5 deficit still grows). This idea is a
         DIFFERENT, more precise ring-theoretic combination (the
         tensor-over-k[U] / Tor-independence formula) and is not subsumed by
         that falsification -- it must be tested independently, and the
         record says so explicitly rather than silently re-trying a killed idea."
      - "A2-3 in the (non-ledger) catalogue proposes a 'pairwise
         ideal-intersection excess' object -- related in spirit (block
         locality) but a materially different mechanism (Bonferroni-style
         pairwise dimension counting inside small joint-variable rings,
         C(24,2)=276 pairs) from this proposal's global tensor-product
         formula. Neither subsumes the other."
    conclusion: >-
      Adaptation of a standard (web-search-confirmed) commutative-algebra
      identity to a new object in this program. Distinguished explicitly from
      H-DREG-5a3ac1's already-falsified naive combination and from the A2-3
      pairwise-excess candidate. Not independently verified against a named
      theorem/paper for the Tor-independence FAILURE mode specifically (the
      search surfaced the flat-module formula and one relevant arXiv title,
      "Cohomology of Fiber Products of Local Rings," not read in full) --
      hence unverified, not adaptation, for the failure-mode literature.
  citations:
    - ref: "https://arxiv.org/pdf/0704.3631 (Cohomology of Fiber Products of Local Rings)"
      provenance: retrieved
      claim: "surveys when Tor-independence/flatness holds or fails for fiber products of local/graded rings"
      verified_by: "title and abstract seen via WebSearch this session; full text not read"
    - ref: "standard commutative algebra (tensor product Hilbert series identity)"
      provenance: retrieved
      claim: "For A-modules M, N with N flat over A: H_{M tensor_A N}(t) = H_M(t)H_N(t)/H_A(t)"
      verified_by: "WebSearch this session, general summary result, not a single pinned theorem citation"
  assumptions:
    - "H-DREG-152cff's block decomposition (I_A on (U,X3), I_B on (U,X1,X2), sharing only U) is correct -- already independently derived from src/semaev_tree.py and reproduced against 6 committed integers by that hypothesis."
    - "H_A(t), H_B(t) under the semi-regularity heuristic for each sub-ideal ALONE are the correct starting approximants (H-DREG-5a3ac1 already computes these: H_A(z)=(1+z)^{n+k}(1+z^2)^{-n}, H_B(z)=(1+z)^{n+2k}(1+z^3)^{-n})."
  proof_search_map:
    bottleneck: >-
      Whether the full system's freeze degree / column-count sequence is a
      DETERMINED function of the two sub-ideals' OWN Hilbert series plus one
      correction term (the Tor-independence defect), or whether it depends
      on genuinely cross-block information (the syzygy family H-DREG-001's
      own mechanism names: "exactly 1 at D3, 8n/3 at D4") that no per-block
      computation can see.
    baseline_embedding:
      parameter_slice: "n=9 and n=12, D=5 and D=6, where BOTH sub-ideal Hilbert series (computable, small rings) AND the full glued deficit (already committed) exist."
      reproduction_check: >-
        Symbolic: evaluate H_A(t)H_B(t)/H_{k[U]}(t)'s truncated coefficient
        sum against the committed deficits (1,322 at n=12 D5; the n=9
        analogues) BEFORE any new computation, using only already-committed
        numbers plus closed-form series arithmetic.
    observation_collision:
      observable: "the truncated partial-sum column count / freeze degree from the tensor-product-over-k[U] formula"
      distinct_preimage_search: >-
        Many (I_A, I_B) pairs sharing the same H_A, H_B share the same
        formula output regardless of the actual cross-block syzygy content
        -- this is the KNOWN limitation stated up front: if the formula
        fits, it establishes only that the OBSERVABLE (deficit/freeze
        degree) is not sensitive to cross-block syzygies at reachable n, not
        that they don't exist.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "the full nb-variable Macaulay matrix" with the pair
          (H_A(t), H_B(t)) plus one scalar correction (the measured
          Tor-independence defect at each committed cell), each computable
          in a strictly smaller ring.
        predicted_gain: >-
          Encoding: NOT exact a priori (the flatness condition is a
          heuristic under test, not a proved fact) -- this is the honest
          disclosure this transform requires. Completeness/soundness:
          checked directly against n=9/n=12 committed deficits, zero new
          compute. Transfer: DECLARED UNMET beyond t=3, and the correction
          term's own n-dependence is UNKNOWN and is this idea's main open
          question if the naive formula fails outright.
    quantifier_order: >-
      CLAIMED, TESTED, NOT ASSUMED: EXISTS a correction function c(n,D) such
      that deficit_full(n,D) = deficit_from(H_A*H_B/H_{k[U]}) + c(n,D), with
      c measured (not derived) at n=9,12 and its own growth (bounded vs
      growing) reported honestly as a SEPARATE open question if the naive
      c=0 form fails, which the naive form's own predecessor (H-DREG-5a3ac1's
      cruder combination) already suggests is likely.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: an exact-arithmetic (zero new compute past series algebra)
        statement of how well a specific, named ring-theoretic formula
        predicts two ALREADY-COMMITTED data points, plus -- if and only if
        it fits within a pre-registered band -- a candidate (not certified)
        forward-extrapolation route via small sub-block computations at
        n=15+ that must itself be validated before trust, exactly as
        H-DREG-152cff and H-DREG-5a3ac1 both discipline their own forward claims.
      nearby_object_control: >-
        The BLOCK-PERMUTED system (same as H-DREG-5a3ac1's own second
        control): swapping which family sits on which block changes H_A,H_B
        computably; a formula that cannot separate the true pairing from its
        permutation is measuring block SIZES, not the amalgam structure.
    proof_obligations:
      - claim: "H_A(t), H_B(t) as computed reproduce the semi-regularity-heuristic freeze degrees H-DREG-5a3ac1 already reports (phi_A, phi_B sequences)."
        responsibility: correctness
      - claim: "The tensor-over-k[U] formula, evaluated symbolically, is compared against committed deficits with NO free parameter tuned to fit (c=0 is tested first, exactly)."
        responsibility: strictness
      - claim: "Nothing transfers to t>=4 or prime fields; the block graph and field both change."
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: "naive (c=0) formula prediction vs committed deficit at n=12, D=5 (1,322)"
      direction: different
      minimum_effect: >-
        Frozen band, computed BEFORE evaluation: agreement within a
        pre-registered +/-25% is a genuine positive signal; anything outside
        it is a clean, informative negative (the naive tensor formula is
        wrong, exactly as H-DREG-5a3ac1's cruder combination was already
        found wrong, and the correction term c(n,D) is nontrivial).
    - metric: "same comparison at n=9, D=5 and D=6 (both committed)"
      direction: different
      minimum_effect: "same +/-25% band, evaluated independently -- a fit at n=12 alone with a miss at n=9 is reported as non-generalizing, not averaged away."
    - metric: "IF the naive form fits both cells: forward prediction at n=15, D=5 (already partially known: sub-ideal Hilbert series alone) vs eventual n=15 rank once obtainable by any instrument"
      direction: different
      minimum_effect: "stated as a genuinely out-of-sample, frozen-before-data prediction, cross-checkable against whatever rank Idea A/B eventually obtain."
  minimal_test:
    design: >-
      Stage 0 (zero new compute, pure series arithmetic): compute
      H_A(t)*H_B(t)/H_{k[U]}(t)'s truncated partial sums at n=9,12, D=5,6
      using already-derived H_A, H_B from H-DREG-5a3ac1 and H_{k[U]}(t) =
      1/(1-t)^n (or its boolean-field-equation analogue, (1+t)^n, matching
      the ambient convention -- this adaptation to the boolean truncated-series
      convention is itself part of stage 0's deliverable, done explicitly and
      shown, not assumed). Compare to the committed deficits. Stage 1 (only
      if stage 0 passes its band): derive the correction term c(n,D) at the
      two committed cells and check whether it looks bounded or growing
      across just these two points (weak, but free) before proposing any new
      compute.
    controls:
      - "Block-permuted control (swap which family occupies which block): H_A, H_B swap roles, giving a computably DIFFERENT prediction; the true pairing must fit better than the permuted one, or the formula is responding to block sizes alone."
      - "n=9 D=5 full-support null control (deficit exactly 0, already committed): H_{k[U]}-normalized formula on a full-support system (I_A, I_B replaced by generic full-support quadrics/cubics) must ALSO predict deficit exactly 0, or the series-algebra adaptation itself is wrong."
    required_metrics: ["naive formula prediction vs committed deficit at each of 4 cells (n in {9,12}, D in {5,6})",
      "block-permuted control prediction", "full-support null control (must be exactly 0)"]
  falsification_conditions:
    - "The naive (c=0) formula misses the committed deficit by more than the pre-registered band at ANY of the 4 cells: the tensor-over-k[U] mechanism, as stated, is wrong (a clean, cheap negative, consistent with H-DREG-5a3ac1's finding that the cruder combination already failed)."
    - "The full-support null control does not return exactly 0 under the adapted series convention: the stage-0 series algebra itself has a bug, and nothing else may be read."
    - "The block-permuted control cannot be distinguished from the true pairing: the formula responds to block sizes only, not incidence, and the mechanism is under-determined (mirrors H-DREG-152cff's own permuted-control falsifier)."
  confounders:
    - "The boolean field-equation convention (extra (1+z) factors vs the classical polynomial-ring 1/(1-z) factors) must be handled identically on both sides of the formula or the comparison is invalid by construction, not by mechanism -- stage 0 must show this derivation explicitly, not silently."
    - "H_A, H_B computed under the semi-regularity heuristic for each sub-ideal ALONE inherit whatever error that heuristic already has for these specific sub-systems (untested independently) -- a miss could be attributable to sub-ideal semi-regularity failure, not to the combination formula, and stage 1's design cannot fully separate the two with only 2 committed cells."
  interpretation_limits:
    - "Toy scale, t=3, boolean only; explicitly out of scope for t>=4 (block graph becomes a path) and prime fields (per H-DREG-152cff's own declared boundary, inherited here)."
    - "A PASS at n=9/n=12 is a candidate extrapolation route, not a validated one -- it must still be checked against an actual n=15+ rank before being trusted, exactly as every other closed-form candidate in this lane is disciplined."
    - "A FAIL does not close the lane; it is informative about where cross-block structure lives (consistent with docs/inventor-protocol.md's closure standard: a named obstruction, an argument, forward guidance -- here, forward guidance is that the correction term c(n,D) itself becomes the next object to characterize)."
  heuristic_assumptions:
    - id: HEUR-DREG-FIBERPROD-1
      statement: >-
        For A-modules M (finite over A=k[U]) and N flat over A,
        H_{M tensor_A N}(t) = H_M(t)H_N(t)/H_A(t) (retrieved, standard).
        HEURISTIC EXTENSION UNDER TEST: this formula's PREDICTION still
        approximately holds even though R_B is almost certainly NOT flat
        over k[U] in the strict sense, imitating how the semi-regularity
        heuristic itself already assumes near-generic behavior for a
        non-generic system.
      rigorous_support: >-
        The flat case is a theorem (retrieved this session). The
        near-flat/heuristic extension has NO rigorous support named here and
        is exactly the quantity stage 0 tests -- explicitly not claimed as
        proved.
      validation_plan: >-
        Compare the formula's prediction against the 4 already-committed
        deficits (n in {9,12}, D in {5,6}) at zero new compute; if it
        passes, extend to n=15 D=5 (partially checkable against any rank
        Idea A/B eventually produce) and report the correction term c(n,D)'s
        own behavior across whatever cells become available, tail-checking
        whether c is bounded or growing exactly as H-DREG-001's own
        predictions require for the deficit itself.
  target_complexity:
    time_exponent: >-
      IF validated: sub-ideal Hilbert series are computable in closed form
      (already done by H-DREG-5a3ac1) at ANY n with zero rank computation --
      i.e., this branch's "time cost" for a PREDICTION is O(1) integer
      arithmetic, versus the current instrument's need to build and rank a
      full nb-variable Macaulay matrix. This is NOT a claim that the
      prediction is correct, only that IF it validates, its cost is
      negligible relative to the current O(ncols(n,D)^omega)-class instrument.
    memory_exponent: "O(1) for the prediction itself if validated (closed-form series arithmetic); n/a if not."
    best_known: "the current full-glued-matrix instrument, which is the only source of ACTUAL (not predicted) rank at any cell."
    hidden_overhead: >-
      The correction term c(n,D), if nonzero, is UNMODELED by this idea --
      disclosed explicitly, not hidden. A validated c=0 case is the
      best-case, low-probability outcome given H-DREG-5a3ac1's already-negative
      finding on a related, cruder combination.
    tradeoff_note: "n/a (this is a prediction-vs-measurement question, not a time-memory tradeoff)."
  dominated_by: "n/a (no algorithmic or attack result claimed; a candidate predictive mechanism for a toy-scale measurement, tested against already-committed data)"
  sota_delta: >-
    ZERO on any ECDLB axis. Locally: IF validated, a zero-marginal-compute
    forward-prediction route for d_reg-adjacent quantities past the memory
    wall; if falsified (the more likely outcome given precedent), a
    quantified, honest negative that sharpens where cross-block structure
    (the syzygy family H-DREG-001 already names) actually lives.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

