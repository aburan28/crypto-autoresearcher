idea:
  id: IDEA-20260725-006   # placeholder: coordinator confirms/renumbers (004/005 taken by concurrent lanes)
  supersedes: >-
    the unfiled "Veronese quartic image-hypersurface" formulation of the
    syzygy-confound lane, screened REVISE on 2026-07-25
  supersede_reason: >-
    Screen returned five defects (degree-4 attribution not supplied by the
    Veronese mechanism; CRT height ceiling misused as a falsifier; missing
    matched-control statement; incomplete schema; overstated novelty). On
    re-grounding I found a SIXTH, larger defect of my own: the record's
    load-bearing assumption that the p=101 witness vectors are byte-identical
