  title: >-
    The S_4 X-coefficient syzygy is a (2,2)-resultant-composition invariant:
    its 27-zero support mask and four dyadic entries are universal, its
    remaining 39 coefficients are curve-dependent
  class: mechanism
  question_id: RQ-ECDLP-002
  claim: >-
    Part A (correction, verified against committed data). The degree-4 witness
    recorded in experiments/EXP-TTN-002/runs/RUN-TTN-002-c/raw.json is NOT a
    single curve-independent vector. At p = 101 the three cells (curves
    (a,b) = (45,63), (12,90), (25,20); raw.json lines 116-188, 482-554,
    848-920) carry three DIFFERENT normalized witnesses that nevertheless share
    (i) an identical 27-position zero mask over the 70 quartic monomials and
    (ii) identical values at exactly four nonzero positions. Those four values
    are the reductions of the rationals 1, -1/4, 1/8, -1/64 at indices
    4, 9, 16, 35, and they reproduce at p = 431 (1, 323, 54, 101; raw.json
    lines 1214-1287) and p = 1009 (1, 252, 883, 268; lines 2312-2384). Three
    further index pairs -- (21,26), (28,41), (52,61) -- carry equal values
    within every cell inspected. So the syzygy's SHAPE is universal and its
    bulk coefficients are curve-dependent.
    Part B (mechanism, falsifiable). That universal shape is a property of the
    (2,2)-resultant composition a_i = [X^i] Res_Z(S_3(x1,x2,Z), S_3(Z,x3,X)) --
    of the fact that each a_i is a 4x4 Sylvester determinant and hence
    bi-quadratic in the two Z-coefficient triples -- and NOT of elliptic-
    specific data. Operationally: surrogates replacing S_3 with a generic
    fully-symmetric tridegree-<=(2,2,2) form on the same Newton polytope yield
    relation_dim_deg4 = 1 with the SAME 27-zero mask in >= 9/10 samples, while
    degree-matched non-composed controls yield relation_dim_deg4 = 0 in
    >= 9/10 samples.
    Explicit NON-claim: nothing here derives the number 4. The degree of the
    swept image hypersurface is a MEASURED quantity (factor span 69 of 70 at
    degree 4); the quadratic-Veronese factorization supplies only "a is
    quadratic in each coefficient triple" and says nothing about the degree of
    the 3-fold swept as x3 varies.
  mechanism: >-
    Grounding in the pinned instrument (experiments/EXP-TTN-002/ttn2_bond_rank_cert.sage).
    s3_coeffs (lines 199-213) returns the Z-coefficients of S_3(x1,x2,Z) as
    c2 = (x1-x2)^2, c1 = -2[(x1+x2)(x1x2+a) + 2b], c0 = (x1x2-a)^2 - 4b(x1+x2):
    three symmetric bidegree-(2,2) forms. S4Xcoeffs (lines 221-230) evaluates
    det_perm(sylv_mat(d, e, p)) at X = 0..4 and Vandermonde-inverts, where
    d = coeffs_Z S_3(x1,x2,Z) and e = coeffs_Z S_3(Z,x3,X). A 4x4 Sylvester
    determinant with two d-rows and two e-rows is bi-quadratic, so
    a_i = sum_{j<=k, l<=m} c_i^{(jk),(lm)} d_j d_k e_l e_m: the a-map factors
    through nu_2(d) x nu_2(e) followed by one fixed linear map. Two things this
    DOES predict: (1) which quartic monomials in a_0..a_4 can carry a
    coefficient forced by the bilinear pattern alone is composition-determined,
    so the support mask and a distinguished sub-vector are composition-class
    invariants; (2) the curve (a,b) enters only through d and e, so the
    remaining coefficients must move with the curve -- exactly what the
    committed data shows.
    A competing structural reading is live because the invariant values are
    dyadic. Under the natural reading of AKEYS as sorted size-4 multisets
    (ttn2_bond_rank_cert.sage:325-328 asserts len(AKEYS) == 70), indices
    4, 9, 16, 35 are a_0^3 a_4, a_0^2 a_2^2, a_0 a_1^2 a_2, a_1^4, and the
    verified values 1, -1/4, 1/8, -1/64 become 1, -9, 12, -4 after the binomial
    rescaling a_i -> C(4,i) a_i', i.e. a_0^3 a_4 - (2 a_1'^2 - 3 a_0 a_2')^2.
    This is a HAND-DERIVED HYPOTHESIS by the idea generator, not a verified
    fact: it depends on the assumed AKEYS ordering, which Stage 0 must confirm
    by recomputing AKEYS from the pinned code. If it survives it points at a
    classical binary-quartic covariant origin rather than at the composition
    class, and the ablation separates them.
    Competing explanations the test discriminates:
    M1 composition-class (this proposal) -- symmetric (2,2,2) surrogate gives
       dim 1 AND the same 27-zero mask;
    M2 Semaev/elliptic-specific -- surrogate gives dim 0, or dim 1 with a
       different mask;
    M3 Newton-polytope/toric -- the NON-symmetric generic (2,2,2) surrogate
       also reproduces the mask, so the polytope, not symmetry, is operative;
    M4 detector artifact -- the non-composed type-(C) control also produces
       relations, voiding the comparison in both directions;
    M5 classical covariant -- the universal sub-vector is a binary-quartic
       covariant expression, closed independently of the ablation by the
       symbolic identity check in Stage 1.
  why_not_renamed_known_approach: >-
    This is not the corpus's syzygy/free-resolution attack lane
    (SYZYGY-REGULARITY-B2 at inputs/idea_generation_20260718_batch4.md:569-575;
    ECDLP-IDEA-013/-065/-115/-152/-372), which generates relations on the
    factor-base ideal: this proposal generates no relation, claims no cost, and
    touches no attack path. Nor is it a restatement of the program's own prior
    observation: experiments/EXP-TTN-002/analysis.md section 3 item 1 ALREADY
    records "the image ... lies on a single quartic hypersurface" and already
    records within-cell witness identity across the 96/128-point streams and
    across the A/B recursion sides. The new content is (i) the verified
    cross-cell result that the witness is NOT curve-invariant while its mask
    and four dyadic entries are, and (ii) the attribution of that invariant
    shape to the (2,2)-composition class, decided by a surrogate ablation
    rather than by an appeal to geometry.
  novelty_status: adaptation
  novelty_evidence: >-
    Greps run 2026-07-25 by the idea generator. Local worktree: "veronese" /
    "segre-veronese" match 0 files repo-wide. External Research-Director track
    /Volumes/Volume/git/autolab/research/idea_generation_*.md: "veronese"
    matches exactly 1 file, idea_generation_20260719_batch21.md, whose lines
    106 and 360-364 use Alexander-Hirschowitz secant non-defectivity of the
    Veronese to pin the Waring rank of the symmetrized Semaev m=5 form for the
    P1512-R1 circuit floor -- different object (symmetric rank of one form vs
    the ideal of the image of the a-map) and different purpose (attack-side
    lower bound vs mechanism diagnostic). "resultant composition" and
    "surrogate ablation" match 0 external idea_generation_*.md files. One web
    search ("syzygy among coefficients of a resultant of two quadratics
    Veronese image hypersurface quartic relation") returned only classical
    background -- syzygies of the quadratic Veronese embedding (arXiv
    1610.04558), the Hessian correspondence for degree-3/4 hypersurfaces (arXiv
