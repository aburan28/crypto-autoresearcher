    prior art on the ideal of the image of the S_4 X-coefficient map. That
    search was title/abstract level and not exhaustive over the
    elimination-theory literature, so the mechanism may still be a known
    classical identity: hence "adaptation", not "speculative".
  assumptions:
    - "AKEYS is the sorted list of size-4 multisets from {a_0..a_4}
       (ttn2_bond_rank_cert.sage:325-328). Every index-to-monomial statement in
       this record, including the dyadic sub-vector hypothesis, is conditional
       on that ordering and MUST be re-derived from the pinned code in Stage 0
       before it is used."
    - "The recorded witnesses are right-kernel basis vectors of the 70-column
       evaluation matrix (kernel_witness, lines 278-282), normalized with the
       first nonzero at index 4 in every cell. Cross-cell comparison is only
       meaningful if that normalization is common; Stage 0 asserts it."
    - "Evaluation rank 69 at 96 points bounds the true polynomial span from
       above only. Schwartz-Zippel risk was reduced, not eliminated, by the
       128-point redraw (analysis.md section 3 item 1). Only the exact
       computation over Q(a,b) in Stage 1 settles the true relation dimension."
    - "S_4 has X-degree 4 under the pinned formal-degree convention, so
       a_0..a_4 is the complete coefficient list and size-4 multisets from 5
       elements give exactly 70 products."
    - "CRT over the three recorded primes gives modulus M = 101*431*1009 =
       43,922,779, so rational reconstruction is valid only up to height
       sqrt(M/2) ~ 4,686. The superseded record's figure of ~6,600 was wrong
       (it omitted the factor 2). This is why Stage 1 is symbolic and CRT is
       demoted to a cross-check."
    - "The idea generator verified the 27-zero mask by hand in 5 of the 9
       committed cells (three p=101 cells, p=431 seed 20260717, p=1009 seed
       20260717) and the four dyadic values at one cell per prime. The other 4
       cells are UNCHECKED; Stage 0 must check them."
