      - universal_entry_index_set
      - paired_index_equalities_hold
      - relation_dim_deg2
      - relation_dim_deg3
      - relation_dim_deg4
      - symbolic_witness_exact
      - m5_covariant_identity_holds
      - surrogate_relation_dim_deg4
      - surrogate_mask_match_fraction
      - nonsymmetric_surrogate_mask_match_fraction
      - planted_control_recovered
      - typeC_false_relation_count
      - stream_disagreement_count
      - wall_seconds
      - peak_rss_gb
    budget: >-
      <= 2 h wall clock, <= 4 GB RSS, Sage only. Stage 0 is seconds (JSON
      parsing). Stage 1 is bounded by a 900 s hard kill with the fallback
      ladder above. Stage 2 is 80 kernel computations on matrices of at most
      224 x 70. A censored stage is INCONCLUSIVE, never negative.
  falsification_conditions:
    - "mask_agreement < 9 of 9 -> support universality is FALSE; the syzygy is instance-dependent in shape as well as in coefficients."
    - "universal_entry_index_set differs from {4, 9, 16, 35}, or the values are not 1, -1/4, 1/8, -1/64, in any of the 4 not-yet-checked cells -> the dyadic sub-vector claim is FALSE and M5 is void."
    - "Any of the three paired-index equalities fails in any cell -> the coefficient-symmetry sub-claim is FALSE."
    - "relation_dim_deg2 or relation_dim_deg3 over Q(a,b) is nonzero -> the 'exactly one relation, irreducible quartic' reading of factor span 69 is wrong."
    - "relation_dim_deg4 over Q(a,b) is 0 -> the recorded phenomenon is an evaluation artifact and DEC-20260722-002 rule 8 must be re-scoped."
    - "The symmetric (2,2,2) surrogate gives relation_dim_deg4 = 0 in >= 9/10 samples -> Part B (composition-class mechanism) is FALSIFIED and M2 is promoted."
    - "The type-(C) non-composed control gives relation_dim_deg4 >= 1 in >= 2/10 samples -> the apparatus manufactures relations and the whole Stage 2 comparison is VOID."
    - "NOT a falsification: a symbolic timeout, a rational-reconstruction height failure, or a Sage kill. Each is infrastructure (AGENTS rule 5) and forces the INCONCLUSIVE branch."
  confounders:
    - "The committed design varies the curve WITH the seed, so cross-cell 'curve dependence' is confounded with sample-point dependence. Broken by within-cell evidence: syzygy_AM == syzygy_BM byte-for-byte in the cells inspected (raw.json lines 116-188 vs 190-262), and analysis.md section 3 item 1 records the 128-point redraw reproducing the identical witness in every cell -- so point-set dependence is excluded and the cross-cell variation is attributable to (a,b)."
    - "Evaluation rank can only under-estimate the true polynomial span; 'one relation' from 96 points is an upper bound, not a certificate. Only Stage 1 settles it."
    - "Agreement of 4 of 43 entries across extra cells is not chance at p = 101 (order 101^-8 for two extra cells), but the converse hazard is real: a genuinely universal entry of large height can reduce to different residues and be misclassified as varying."
    - "Witness normalization at a fixed index can hide a scalar dependence on (a,b); the re-normalization control bounds this."
    - "The surrogate's Newton polytope must equal s3_coeffs' exactly; an off-by-one in the support silently changes the comparison."
    - "The formal-degree padding hazard (analysis.md section 3 item 4) corrupts surrogates at degenerate sample points if padding is not applied at every nesting level."
    - "M1 and M5 are not mutually exclusive: a covariant identity could itself be a consequence of the composition. If both Stage 1 and Stage 2 come back positive, the record must say the two explanations are not separated rather than pick one."
  interpretation_limits:
    - "claim_tier toy: p <= 2^10 for the committed cells, m = 6 only, ordinary short-Weierstrass prime-field curves. The p = 10007 arm extends only the surrogate ablation, not the certified bond ranks."
    - "EXP-TTN-002 is negative-theory: H-TTN-001 is rejected_scoped and the chi-law slope trends to exponent 2 (the disproof direction). Identifying this syzygy changes no attack cost and no bond-rank law, and this proposal does not reopen H-TTN-001."
    - "A composition-class syzygy is a statement about the formal resultant tower, not about the elliptic curve group law and not about ECDLP hardness."
    - "The 'quartic hypersurface' observation is prior internal art (analysis.md section 3 item 1); only the shape-invariance result and the composition-class attribution are new."
    - "Nothing here bears on the SIG or DREG threads."
    - "Only the Coordinator may act on any outcome; this proposal changes no record status."
