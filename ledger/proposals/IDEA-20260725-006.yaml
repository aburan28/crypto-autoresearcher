  minimal_test:
    design: >-
      Stage 0 (seconds; no new claim may be made before it passes). Recompute
      AKEYS from ttn2_bond_rank_cert.sage:325-328 and pin the
      index-to-monomial map. Parse all 9 cells' child.syzygy_AM/BM and
      redraw.syzygy_AM/BM from RUN-TTN-002-c/raw.json. Emit per cell: zero
      mask, normalization index, value vector; and cross-cell: mask_agreement,
      universal_entry_index_set with rational identification by per-prime
      inversion, and the three paired-index equalities. Anchors that MUST
      reproduce: 27 zeros; index 9 = 25 / 323 / 252 = -1/4 at p = 101/431/1009;
      index 16 = 38 / 54 / 883 = 1/8; index 35 = 71 / 101 / 268 = -1/64;
      index 4 = 1.
      Stage 1 (symbolic, PRIMARY -- this is what removes the CRT height
      problem). Build S_4 symbolically over Q(a,b)[x1,x2,x3] with the pinned
      formal-degree convention (analysis.md section 3 item 6 records the
      symbolic S_4 stage at 0.009 s / 439 terms, so this is cheap), extract
      a_0..a_4, form the 15 / 35 / 70 monomial products at degrees 2 / 3 / 4,
      and compute each kernel EXACTLY over Q(a,b) -- no sampling, no CRT, no
      rational reconstruction. Then test M5 directly: after binomial rescaling,
      does the universal sub-vector equal a_0^3 a_4 - (2 a_1^2 - 3 a_0 a_2)^2,
      and is the full witness expressible in the SL_2 covariant ring of the
      binary quartic?
      INCONCLUSIVE branch (AGENTS rule 5): if the symbolic kernel exceeds a
      900 s hard kill (the S_6 symbolic probe already hit a 150 s kill,
      analysis.md section 3 item 6), the stage is CENSORED INFRASTRUCTURE and
      may NOT be reported as a mathematical negative. Fallbacks, in order:
      (i) specialize (a,b) to >= 3 random rationals and compute the kernel
      exactly over Q; (ii) extend the prime set beyond {101,431,1009} until
      sqrt(M/2) > 10x the largest observed reconstructed height. A
      reconstruction failure is an instrument shortfall and can never be
      reported as "the syzygy is instance-dependent".
      Stage 2 (ablation ensemble). Reuse S4Xcoeffs / monomial_products /
      kernel_witness verbatim with s3_coeffs replaced by:
      (A) a generic fully-symmetric tridegree-<=(2,2,2) form (10-dimensional:
          the 10 S_3-orbits of exponent triples in {0,1,2}^3);
      (A') a generic triple of symmetric bidegree-(2,2) forms in (x1,x2)
          (6-dimensional each) -- the structural type of the real c0,c1,c2
          without full 3-variable symmetry;
      (B) a generic tridegree-<=(2,2,2) form with no symmetry (27-dimensional);
      (C) five random polynomials in (x1,x2,x3) with the same per-variable
          degrees as a_0..a_4 but not arising from any composition.
      10 samples per family at p = 101 and 10 at p = 10007; 96 points plus a
      128-point redraw per sample; measure relation_dim at degrees 2, 3, 4, the
      normalized witness, and its mask.
      Interpretation map fixed BEFORE execution:
      (A) dim 1 with the 27-zero mask => M1, Part B supported;
      (A) dim 1 with a different mask => the relation DIMENSION is
          compositional but the shape is S_3-specific; Part B is falsified as
          stated and the sharper sub-question becomes which feature of S_3
          fixes the mask;
      (A) dim 0 in >= 9/10 => Part B FALSIFIED, M2 promoted;
      (B) mask-matching >= 0.9 while (A') also matches => M3;
      (C) dim >= 1 in >= 2/10 => M4, the detector manufactures relations and NO
          Stage 2 conclusion may be drawn in either direction.
    controls:
      - "Committed-anchor reproduction before any new claim, at the p=101 seed-20260717 cell: rank_AM = rank_BM = 69, rank_E = 68, rank_form = 68, rank_S_mod_p = 70, child_S_rank_QQ = 70 (raw.json line 50), root rank 45."
      - "Positive detector control: plant a known quartic relation into a type-(C) surrogate and confirm recovery with dimension exactly 1 and the planted witness."
      - "Two independent point streams (96 + 128) per surrogate sample; a sample whose streams disagree is discarded and counted."
      - "Large-prime replication at p = 10007 to exclude accidental mod-101 relations."
      - "Normalization control: re-normalize every witness at a different pivot index; mask_agreement and universal_entry_index_set must be unchanged."
      - "Formal-degree padding at EVERY nesting level (analysis.md section 3 item 4: sage .resultant() uses actual degrees); unpadded surrogates corrupt degenerate sample points silently."
      - "Newton-polytope equality assertion: each surrogate family's support checked programmatically against s3_coeffs' support."
      - "MATCHED-CONTROL DECLARATION (RQ-ECDLP-002 constraint 3; docs/claims-and-verification.md): Pollard rho, BSGS and generic lower bounds are NOT applicable and are deliberately omitted. This test performs no solve, produces no factor-base relation, and asserts no attack-cost quantity; the run carries certificate kind: none, which docs/claims-and-verification.md designates for pure measurement runs. This sentence must appear in the run manifest rather than the field being left blank."
