idea:
  id: IDEA-20260830-ad0be4
  question_id: RQ-SDEG-001
  added: '2026-08-30'
  title: >-
    THE DEGENERACY ARGUMENT IS AN IDEAL-INVARIANT ARGUMENT AND THE SOLVING
    DEGREE IS NOT AN IDEAL INVARIANT, SO IT DOES NOT REACH THE ONE QUANTITY
    RQ-SDEG-001 IS NAMED AFTER - run the exactly-matched null that
    IDEA-20260829-bdca13 could not have run - a second generating set with the
    SAME grid vanishing set and the SAME bidegree, which by the CRT theorem
    generates the IDENTICAL IDEAL and therefore has a byte-identical reduced
    Groebner basis by construction - and measure the graded Macaulay rank
    filtration of both - if the filtrations coincide the lane's numerator is a
    point-set statistic and the encoding must be redesigned, and if they
    separate the separation IS the Semaev signal, isolated from the point set
    for the first time in this program
  class: control

  claim: >-
    (A) THE DEFINITIONAL SPLIT, AND IT IS PROVED HERE IN ONE LINE RATHER THAN
    CITED. The reduced Groebner basis of an ideal in a fixed monomial order is
    an invariant of the pair (ideal, order). The SOLVING DEGREE of a system F
    - the largest degree reached while computing a Groebner basis of F - is
    NOT, and the counterexample is uniform - let I have reduced Groebner basis
    G in the chosen order and let F generate I with max_deg(F) large; then
    F' = F union G generates the SAME ideal I and has solving degree at most
    max_deg(G), which can be arbitrarily smaller than the solving degree of F.
    So solving degree, first fall degree, last fall degree and the whole graded
    Macaulay rank filtration are invariants of the GENERATING SET, not of the
    ideal. IDEA-20260829-bdca13 proves that the toy decomposition ideal is
    I(Z), a statement entirely about the ideal, and then predicts that its
    random-generator null will produce "byte-identical Groebner observables".
    THAT PREDICTION IS FORCED FOR THE REDUCED BASIS AND IS NOT LICENSED FOR THE
    SOLVING DEGREE, and this record's first content is that the two must be
    reported separately or bdca13's REDESIGN verdict rests on a conflation.
    (B) THE EXPERIMENT THE SPLIT MAKES AVAILABLE, WHICH IS SHARPER THAN ANY
    NULL CURRENTLY IN THIS LANE. Take the toy system F_sem = (S_3(x1,x2,xR),
    fV(x1), fV(x2)). Construct F_null = (r(x1,x2), fV(x1), fV(x2)) where r is
    drawn UNIFORMLY from the 9-dimensional space of bidegree-(2,2) polynomials
    subject to r(v_i,v_j) = 0 for exactly the cells of Z and r(v_i,v_j) not 0
    on every other cell. Then by the CRT structure theorem F_sem and F_null
    generate the IDENTICAL IDEAL - not a similar one, the same one - so their
    reduced bases, staircases, quotient dimensions and trivial-ideal flags
    agree exactly and carry ZERO discriminating power BY CONSTRUCTION. Every
    remaining difference between them is a pure generating-set effect, and the
    generating sets are matched in the number of variables, the number of
    generators, the multidegree support and the exact solution set. This is
    strictly finer than IDEA-20260808-093497's matched-random-support null,
    which matches the support but NOT the solution set and therefore confounds
    generator structure with solution count - a confound 093497's own list
    already flags as "#solutions is about B^m/p".
    (C) THE PRE-REGISTERED TWO-WAY OUTCOME, EACH BRANCH DECISION-BEARING.
    OUTCOME I, CONTROLLED NULL - the graded rank filtrations of F_sem and
    F_null agree at every degree in at least 95 percent of cells, and the last
    fall degrees agree in at least 95 percent. Then no observable available to
    this encoding, ideal-invariant or generator-level, distinguishes the
    Semaev polynomial from an arbitrary bidegree-(2,2) polynomial with the same
    zeros, RQ-SDEG-001's numerator is a statistic of the point set Z plus the
    membership degree B, and the answer to the decision target is REDESIGN
    with a derivation attached rather than a scaling study. OUTCOME II,
    SEPARATION - the filtrations differ. Then the difference, quantified as
    Delta_lf = d_lf(F_null) minus d_lf(F_sem) and as the per-degree rank
    difference, IS the Semaev-specific content, isolated from the point set for
    the first time in this program, and RQ-SDEG-001 has a legitimate numerator
    whose scaling in B is worth fitting - conditional, and this is stated in
    advance, on it being a generating-set-specific number that must be reported
    with the solver and order frozen and must never be quoted as an ideal
    invariant.
    (D) THE THIRD ARM THAT MAKES OUTCOME I INTERPRETABLE. A degree-UNMATCHED
    null - r' obtained by full grid interpolation, so r' vanishes on exactly Z
    but has bidegree up to (B-1, B-1) - must show a LARGE filtration difference
    from F_sem even under Outcome I, because its generator degree alone is
    B-1. If arm (D) shows NO difference either, the instrument cannot see
    generator degree at all, every number in this lane is unusable, and the
    line halts as an instrument failure rather than a finding. Arm (D) is the
    positive control for the measurement and it is blocking.

  mechanism: >-
    THE TRACKED OBJECT. The object followed through the computation is the
    GRADED PIECE OF THE IDEAL GENERATED SO FAR - the F_p-vector space
    V_D(F) contained in S_D, spanned by all products (monomial of degree
    D - deg g) times g over generators g in F with deg g at most D, where
    S_D is the space of polynomials of degree at most D. The object is the
    FILTRATION D maps to dim V_D(F), and its one-step propagation is exactly
    defined and exactly measurable - V_{D+1} contains S_1 times V_D, and the
    quantity of interest is the EXCESS, dim V_{D+1} minus dim(S_1 times V_D),
    which is where a degree fall shows up as a drop in the leading forms.
    LOSSY-PROJECTION TEST, APPLIED, AND IT PASSES FOR A SPECIFIC REASON. The
    projection F maps to (dim V_D(F))_{D <= D_max} is genuinely lossy - it
    forgets every coefficient, forgets which generator contributed which row,
    forgets the curve and the target, and above all forgets the ideal above
    degree D_max, which is precisely the information the reduced Groebner
    basis retains and this object throws away. It is lossy IN THE OPPOSITE
    DIRECTION from bdca13's object, which is why the two records do not
    collide - bdca13 keeps the ideal and discards the presentation, this
    record keeps the presentation degree by degree and discards the ideal's
    tail. What it discards is discarded COMPATIBLY with the operation that
    drives the computation - multiplication by degree-one forms maps V_D into
    V_{D+1}, so the retained part propagates deterministically one degree at a
    time, and that is exactly one step of any F4-style algorithm. The
    contrasting FAILURE this program already records is (x1 + x2, x1 x2),
    which loses nothing because the unordered pair is recoverable as the roots
    of a quadratic (KN-LIT-7595).
    WHY THE MATCHED NULL IS CONSTRUCTIBLE AND WHY IT WAS NOT AVAILABLE
    BEFORE. The space of bidegree-(2,2) polynomials is 9-dimensional. Imposing
    vanishing at the |Z| cells of Z is |Z| linear conditions, and at this
    question's parameters |Z| is 0, 1, 2 or 3, so at least a 6-dimensional
    family survives; requiring non-vanishing on the remaining B^2 minus |Z|
    cells excludes a union of hyperplane slices and is satisfied by a uniformly
    random member with probability at least 1 minus B^2/p, checked per draw and
    resampled on failure. So the matched null exists, is cheap, and is exactly
    matched on the four things that could otherwise confound - variable count,
    generator count, multidegree support and solution set. It was not available
    before because the CRT structure theorem, which is what makes "same
    solution set implies same ideal" true rather than merely plausible, was
    only written down in this program on 2026-08-29.
    WHY THIS IS THE CHEAPEST VALID DISCRIMINATOR FOR THE LANE'S DECISION
    TARGET. RQ-SDEG-001 asks whether a frozen protocol yields a cost model
    suitable as an index-calculus numerator. If Outcome I holds, no protocol
    over this encoding can, at any scale, because the quantity being fitted is
    a function of Z and B and the summation polynomial is not in it. That is a
    verdict reachable at toy scale for minutes of compute, before any medium
    protocol is approved, and it is reachable in NO other way - a scaling study
    that finds a clean power law cannot tell whether the law is about Semaev or
    about interpolation, and that is precisely the question the numerator's
    meaning depends on.

  novelty_status: unverified

  citations:
    - ref: 'arXiv:2112.05579'
      provenance: retrieved
      claim: >-
        Caminata and Gorla, "Solving degree, last fall degree, and related
        invariants" (2021, revised 2022; also J. Symbolic Comput.). The
        abstract page states that the paper studies and relates several
        invariants connected to the SOLVING DEGREE of a polynomial system,
        providing a rigorous framework for estimating the complexity of solving
        a system via Groebner basis methods, and establishes a connection
        between the solving degree and the LAST FALL DEGREE and one between the
        degree of regularity and the Castelnuovo-Mumford regularity. Cited for
        the existence of a rigorous framework relating these invariants and for
        the fact that they are invariants OF A SYSTEM. The abstract page does
        NOT state whether the solving degree depends on the generating set;
        that fact is used here only via the self-contained argument in claim
        (A), not on this paper's authority.
      verified_by: >-
        Fetched this session (WebFetch, 2026-08-30, https://arxiv.org/abs/
        2112.05579). ABSTRACT PAGE ONLY - the full PDF was not retrieved and no
        theorem statement, numbering or proof was inspected.
    - ref: KN-LIT-7607
      provenance: internal
      claim: >-
        Huang, Kosters and Yeo, "Last fall degree, HFE, and Weil descent
        attacks on ECDLP" (CRYPTO 2015 / ePrint 2015/573). The corpus record
        states that the last fall degree is MONOMIAL-ORDER-INDEPENDENT, unlike
        the degree of regularity, and yields complexity bounds for system
        solving; that quasi-polynomial and subexponential claims depend on the
        first fall degree assumption; and that the authors construct a Weil
        descent system from summation polynomials in which that assumption is
        unlikely to hold. The record also carries a STANDING CONSEQUENCE for
        this program - no proposal may claim as new that Weil-descended Semaev
        systems violate the semi-regular prediction, or that the deficit is
        bounded in system size, without citing this entry and KN-LIT-7605 and
        stating what it adds. This record makes NEITHER of those claims - it
        works over prime fields, not over a Weil descent, and it claims no
        deficit.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-30), file
        knowledge/literature/KN-LIT-7607.md, all 80 lines, including its own
        "Not verified here" section stating that the paper's full text was not
        read by that entry either.
    - ref: IDEA-20260829-bdca13
      provenance: internal
      claim: >-
        Proves the m = 2 CRT structure theorem, concludes that the reduced
        Groebner basis "in ANY monomial order, its cardinality, its maximum
        total degree, and the trivial-ideal flag are ALL determined by Z as a
        point set", and pre-registers as a BLOCKING control a random
        bidegree-(2,2) null at matched grid vanishing pattern with the
        prediction "PREDICTED IDENTICAL" for the Groebner observables. Its
        target_complexity section speaks of "the Groebner route at the same
        task costs at least the dense bivariate linear algebra on about B^2
        monomials". This record uses its structure theorem as the ENABLER of
        the matched null and disputes only the scope of its verdict.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-30), file
        ledger/proposals/IDEA-20260829-bdca13.yaml, all 698 lines.
    - ref: IDEA-20260808-093497
      provenance: internal
      claim: >-
        Defines d_solve operationally as min{D such that corank(Mac_D) equals
        the number of solutions}, computed by exact graded rank over F_p rather
        than by a CAS termination event, and specifies a MATCHED RANDOM-SYSTEM
        NULL that replaces S_{m+1} by a uniformly random polynomial with the
        SAME MULTIDEGREE SUPPORT while keeping f_V unchanged, with the forced
        prediction of identical d_solve. Its confounder list flags that the
        number of solutions is about B^m/p and that the instrument must hold
        that roughly constant or report it as a covariate.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-30), file
        ledger/proposals/IDEA-20260808-093497.yaml, all 286 lines.
    - ref: IDEA-20260808-afe4ce
      provenance: internal
      claim: >-
        Claims a prime-field last-fall-degree FLOOR, d_lf >= B, for any factor
        base described set-theoretically by its vanishing polynomial, because
        the membership generators contribute nothing to any graded piece below
        their own degree B. Used here as the reason the ABSOLUTE value of a
        measured last fall degree in this encoding is uninformative and only
        the DIFFERENCE between two matched generating sets can carry
        information.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-30), file
        ledger/proposals/IDEA-20260808-afe4ce.yaml, all 159 lines.
    - ref: IDEA-20260815-05c761
      provenance: internal
      claim: >-
        Distinguishes solving degree, degree of regularity and
        Castelnuovo-Mumford regularity as three quantities the lane's cost
        model uses near-interchangeably, and proposes measuring the pairwise
        gaps on one frozen system set with a semi-regular positive control. Its
        own confounder list states that "the solving degree is a property of
        the ALGORITHM as much as of the ideal" and that the record "must never
        present the solving degree as an invariant of the ideal".
      verified_by: >-
        Read in full this session (Read tool, 2026-08-30), file
        ledger/proposals/IDEA-20260815-05c761.yaml, all 353 lines.
    - ref: harness/semaev.py
      provenance: internal
      claim: >-
        The measured system is exactly [s3_expr(a,b).subs(x3, xR), fV1, fV2]
        with grevlex and modulus=p, and s3_expr has bidegree (2,2) in (x1,x2) -
        the term (x1-x2)^2 x3^2 contributes degree 2 in each of x1 and x2 after
        substituting x3 = xR - which is what makes the degree-matched null
        well defined as "uniform in the 9-dimensional space of bidegree-(2,2)
        polynomials". The module docstring itself labels the reported
        quantities "implementation-bound proxies, never the theoretical degree
        of regularity".
      verified_by: >-
        Read in full this session (Read tool, 2026-08-30), file
        harness/semaev.py, all 233 lines.
    - ref: KN-OPEN-002
      provenance: internal
      claim: >-
        The open problem asks how the Groebner solving degree AND first fall
        degree of prime-field point-decomposition systems grow, and notes that
        whether the first fall degree tracks the true degree of regularity is
        not settled over prime fields. This record addresses the prior
        question of whether either quantity carries summation-polynomial
        information at all in the current encoding.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-30), file
        knowledge/open-problems/KN-OPEN-002.md, all 29 lines.
    - ref: >-
        Bardet-Faugere-Salvy semi-regular Hilbert series and the standard
        definition of first fall degree
      provenance: recalled
      claim: >-
        Recalled from memory - for a semi-regular overdetermined sequence the
        Hilbert series of the quotient by the top-degree forms is the positive
        truncation of the product of (1 - z^{d_i}) over (1-z)^n, and the degree
        of regularity is the index of its first non-positive coefficient; the
        first fall degree is the smallest degree at which a non-trivial syzygy
        produces a drop below the expected rank. NOT RETRIEVED THIS SESSION.
        Used only to name the comparison quantity; this record's predictions
        are stated as DIFFERENCES between two matched arms and do not depend on
        any semi-regular prediction being correct.
      verified_by: null

  assumptions:
    - >-
      p > 3, E non-singular short Weierstrass over F_p, factor base of DISTINCT
      on-curve x-coordinates, affine target. Distinctness is checked per cell,
      not assumed - it is the precondition of the CRT theorem that makes the
      two arms share an ideal.
    - >-
      The matched null r exists, i.e. the linear conditions r(v_i,v_j) = 0 on Z
      admit a solution that is nonzero on every other grid cell. This is
      checked per draw and resampled; a cell where no such r is found after 100
      draws is recorded as a failed construction, not silently dropped.
    - >-
      Graded ranks are computed by EXACT linear algebra over F_p, not inferred
      from a CAS termination event. This is 093497's solver-independence
      requirement and is adopted verbatim.
    - >-
      The monomial order is frozen before any cell runs. Grevlex is primary;
      lex is run as a sensitivity arm only, and no conclusion is drawn from a
      single order.

  proof_search_map:
    bottleneck: >-
      The step "read a solving degree, first fall degree or Macaulay rank
      profile off the decomposition system and treat it as the numerator of an
      index-calculus cost model". Removing that step, or establishing that its
      output does not depend on the summation polynomial, changes the meaning
      of every number RQ-SDEG-001 intends to produce while changing no
      mathematics.
    baseline_embedding:
      parameter_slice: >-
        Two exact slices. (i) B = 1 - the system is (s(x1,x2), x1 - v, x2 - v)
        and the whole filtration is computable by hand in both arms; the two
        arms MUST agree because the ideal is generated in degree 1 either way,
        and an instrument reporting a difference here is broken. (ii) The
        univariate edge m = 1, system (S_2(x1,xR), fV(x1)), where the answer is
        a gcd degree; the instrument must reproduce the gcd. This is
        093497's known-answer edge and is adopted unchanged.
      reproduction_check: >-
        Frozen regression fixture - the exact instance, seed, factor base and
        target of an existing committed EXP-SEMAEV-family run, with the
        harness-reported reduced basis reproduced bit for bit by the graded
        rank engine's own Groebner path, and the two arms verified to produce
        the SAME reduced basis before any filtration is compared. If the two
        arms do not produce the same reduced basis, the CRT structure theorem
        is false at that cell and this record's entire design is void - which
        is checked first, at zero extra cost, and reported.
    observation_collision:
      observable: >-
        The graded rank filtration (dim V_D)_{D <= D_max} of the generating
        set, together with the derived last fall degree and the solving degree,
        in the frozen order.
      distinct_preimage_search: >-
        THIS RECORD IS THE COLLISION SEARCH, run in the sharpest possible form.
        Two distinct ground-truth objects - the Semaev system and a random
        bidegree-(2,2) system - are constructed to have the SAME IDEAL, hence
        the same reduced basis, and the search is for whether the filtration
        separates them. A collision (Outcome I) directly falsifies
        identifiability of Semaev structure from any Groebner observable in
        this encoding and is a first-class deliverable. A separation (Outcome
        II) establishes identifiability at the generator level and bounds it
        quantitatively. Neither branch is a null result; there is no design in
        which this measurement returns nothing.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the OBSERVABLE at the ideal level fixed - the reduced Groebner
          basis, the staircase, the quotient dimension, the trivial flag, all
          exactly equal by construction - and vary the forgotten structure, the
          generating set. Then look for an intrinsic invariant of the
          generating set that separates the two preimages. The candidate
          invariant is the graded rank filtration and its derived last fall
          degree, chosen because the last fall degree is order-independent
          (KN-LIT-7607) and therefore not an artifact of the frozen order.
        predicted_gain: >-
          Either an exhibited invariant separating Semaev from a matched random
          generator - the first isolated Semaev signal in this lane - or a
          demonstrated collision that closes the lane's observable set at the
          section-4 standard. No attack exponent is moved on either branch.
      - transform: stronger_invariant
        proposed_object: >-
          Replace the single integer "solving degree" by the whole filtration
          (dim V_D)_D and the excess sequence dim V_{D+1} minus dim(S_1 times
          V_D), preserving more state than the final cost model requires,
          because the extra state is what survives comparison across two arms
          with the same ideal. A single integer can coincide by accident; a
          filtration of length 2B coinciding at every degree is a much stronger
          statement, and its failure at one degree is a much finer signal.
        predicted_gain: >-
          Converts a two-integer comparison of unknown power into a
          multiple-degree paired comparison with a well-defined per-degree
          effect size, which is what a confidence interval on the lane's
          numerator would actually need.
    quantifier_order: >-
      Two claims, deliberately at different strengths.
      CLAIM A, DEFINITIONAL AND PROVED HERE - EXISTS an ideal I, an order, and
      two generating sets F, F' of I with solving degree of F strictly greater
      than solving degree of F'. Witness given in claim (A) by adjoining the
      reduced basis. This is an EXISTS statement and nothing stronger is
      claimed from it; it establishes only that an ideal-invariant argument
      cannot settle a generator-level quantity.
      CLAIM B, THE MEASURED ONE - FORALL primes p in the tested ladder, FORALL
      tested curves E, FORALL factor bases V of distinct rational
      x-coordinates in the tested sizes, FORALL affine targets with |Z| in the
      tested strata, and for the frozen order, the filtration of F_sem EQUALS
      (Outcome I) or DIFFERS FROM (Outcome II) the filtration of F_null. The
      dangerous weaker reading, NOT claimed - "there EXISTS a random generator
      with a different filtration", which is vacuous since the degree-unmatched
      arm (D) supplies one by construction. The content is uniformity over the
      matched family at fixed bidegree.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Over the tested prime ladder, curve set, factor-base sizes and frozen
        order, the graded rank filtration of the toy Semaev decomposition
        system is / is not distinguishable from that of a bidegree-matched,
        zero-set-matched random system." It can NEVER certify anything about a
        different monomial order beyond the sensitivity arm, about a real F4 or
        F5 implementation's internal degrees, about untested p or B, about
        arities above those tested, or about the ECDLP. It cannot certify that
        an observed separation is exploitable - a separation is a
        distinguisher between two generating sets, not an algorithm.
      nearby_object_control: >-
        THE DEGREE-UNMATCHED INTERPOLATED NULL, arm (D), and it is blocking.
        Its generator has bidegree up to (B-1, B-1) and generates the same
        ideal, so any instrument with power must separate it from F_sem. If the
        instrument reports NO separation there, it has no power at all and
        Outcome I would be unreadable - the correct conclusion would be
        instrument failure, not a controlled null. A second nearby object,
        weaker but cheap - the same Semaev generator with x1 and x2 swapped,
        which must produce an IDENTICAL filtration by symmetry of S_3 and
        catches a class of implementation bugs for free.
    proof_obligations:
      - claim: >-
          F_sem and F_null generate the same ideal whenever their grid vanishing
          sets coincide and fV is squarefree.
        responsibility: correctness
      - claim: >-
          Solving degree is not determined by the ideal and the order.
        responsibility: strictness
      - claim: >-
          A bidegree-(2,2) polynomial vanishing exactly on Z within the grid
          exists with probability at least 1 - B^2/p per uniform draw.
        responsibility: feasibility
      - claim: >-
          The graded rank engine reproduces the gcd answer at m = 1 and the
          hand answer at B = 1.
        responsibility: baseline
      - claim: >-
          The degree-unmatched arm separates, establishing that the instrument
          has power.
        responsibility: interface
      - claim: >-
          The reported effect size has a stated per-degree resolution and a
          paired confidence interval, not a single mean.
        responsibility: size
      - claim: >-
          Every Macaulay matrix built stays inside the declared column and
          memory contract, enforced by a pre-flight count that aborts before
          allocation.
        responsibility: memory

  predictions:
    - metric: >-
        equality of the reduced Groebner bases of F_sem and F_null at matched Z
      direction: different
      minimum_effect: >-
        FORCED IDENTICAL, polynomial by polynomial, in 100 percent of cells
        with a squarefree factor base. This is not a hypothesis, it is the
        precondition of the experiment - a single inequality means the CRT
        structure theorem fails at that cell, and the record commits in advance
        to reporting that instead of the intended comparison.
    - metric: >-
        per-degree agreement of the graded rank filtrations of F_sem and
        F_null, over the full degree range 0 to 2B, paired within cell
      direction: different
      minimum_effect: >-
        NO DIRECTION IS PRE-COMMITTED - this is the unknown the record exists
        to measure, and pre-committing a direction here would be dishonest.
        What IS pre-committed is the decision rule. OUTCOME I is declared when
        the filtrations agree at every degree in at least 95 percent of at
        least 200 cells, with the disagreeing cells listed individually.
        OUTCOME II is declared when they disagree at one or more degrees in at
        least 20 percent of cells, with the disagreement in a CONSISTENT
        direction in at least two thirds of those cells. An intermediate result
        is reported as intermediate and settles nothing, which is a permitted
        and disclosed outcome.
    - metric: >-
        Delta_lf = last fall degree of F_null minus last fall degree of F_sem
      direction: different
      minimum_effect: >-
        Resolution is one degree; the minimum reportable effect is a paired
        median |Delta_lf| >= 1 with a bootstrap 95 percent confidence interval
        excluding 0. A median of exactly 0 with a CI containing 0 is the
        quantitative form of Outcome I.
    - metric: >-
        Delta_lf on the DEGREE-UNMATCHED interpolated arm (D)
      direction: higher
      minimum_effect: >-
        FORCED POSITIVE AND LARGE - at least B - 4 in at least 90 percent of
        cells with B >= 8, since the generator degree alone differs by B - 3.
        A near-zero Delta_lf here means the instrument cannot see generator
        degree, and the line HALTS as an instrument failure. This is the
        blocking positive control.
    - metric: >-
        Delta_lf under the variable-swap arm (S_3 is symmetric in x1 and x2)
      direction: different
      minimum_effect: >-
        FORCED EXACTLY ZERO in 100 percent of cells. Any nonzero value is an
        implementation bug in the graded rank engine and blocks every other
        number in the run.
    - metric: >-
        scaling of Delta_lf with B at fixed p, and with p at fixed B,
        CONDITIONAL on Outcome II
      direction: different
      minimum_effect: >-
        Reported as a fitted log-log slope with a confidence interval, in both
        variables, and ONLY if Outcome II is declared. Under Outcome I this
        metric is not reported at all, and the record states in advance that
        fitting a scaling law to a quantity that failed its own null would be
        the failure mode this whole design exists to prevent.

  minimal_test:
    design: >-
      STAGE 0, ZERO COMPUTE, HARD GATE. Write the one-line proof of claim (A)
      and the B = 1 hand computation for both arms. If the B = 1 arms do not
      agree, the design is void; stop.
      STAGE 1, MINUTES. Build the exact graded rank engine over F_p - construct
      the degree-D Macaulay matrix of a generating set by multiplying each
      generator by every monomial of complementary degree, take exact rank, and
      emit dim V_D for D = 0 to D_max. Validate it on the m = 1 gcd edge and on
      the B = 1 cell. NO CAS TERMINATION EVENT IS USED ANYWHERE.
      STAGE 2, MINUTES. Build the matched null - solve the |Z| linear
      conditions on the 9-dimensional bidegree-(2,2) space, draw uniformly from
      the solution space, reject and redraw if any off-Z grid cell vanishes,
      cap at 100 draws and record failures.
      STAGE 3, THE MAIN GRID, TENS OF MINUTES. p in {2^8, 2^10, 2^12} in scope
      plus 2^14 and 2^16 as flagged out-of-scope calibration, B in
      {4, 8, 16, 32}, 8 curves with generic j, 5 seeds, targets STRATIFIED so
      that |Z| takes each of 1, 2, 3 at least 40 times and |Z| = 0 at least 40
      times. At least 200 cells. For each cell run BOTH arms through the same
      engine and record the full filtration, plus the reduced basis equality
      check.
      STAGE 4, THE BLOCKING CONTROLS, MINUTES. Arm (D) degree-unmatched
      interpolated null; the variable-swap arm; the m = 1 gcd edge.
      STAGE 5, OPTIONAL AND ONLY IF STAGE 3 IS CLEAN, TENS OF MINUTES. The
      m = 3 analogue at B in {4, 6, 8} with a tri-degree-(2,2,2) matched null
      against S_4, which requires an S_4 instrument that does not exist in
      harness/semaev.py today and must pass an exact-witness gate first
      (KN-OPEN-5b3a08 Q1). Explicitly optional so that a memory or instrument
      problem at m = 3 cannot invalidate the m = 2 result.
      STAGE 6, ZERO COMPUTE. Report, declare Outcome I or II or intermediate by
      the pre-registered rule, and propose to the Coordinator the consequence
      for RQ-SDEG-001's decision target. Never a status change.
      MEMORY ENVELOPE, STATED EXPLICITLY BECAUSE THIS PROGRAM HAS A LIVE
      MEMORY WALL. The 2026-08-28 GOAL-DREG-001 attempt stopped as
      resource_exhaustion at roughly 12 GiB against an 8 GiB contract with a
      768,212-column monomial space and its rank kernel never invoked - an
      INFRASTRUCTURE stop under AGENTS rule 3, never negative mathematical
      evidence. This test builds Macaulay matrices and therefore must state its
      envelope in the same units. At m = 2 the ambient is BIVARIATE, so degree
      D has exactly binom(D+2,2) monomials - at the worst declared cell
      B = 32, D_max = 2B = 64, that is 2145 columns and at most about 6500
      rows, i.e. roughly 56 MB dense at 4 bytes per F_p entry. At m = 3,
      B = 8, D_max = 3B = 24, that is binom(27,3) = 2925 columns and about
      8000 rows, roughly 94 MB. Both are three orders of magnitude below the
      DREG stop. A PRE-FLIGHT column-and-row count runs before every
      allocation and ABORTS the cell if columns exceed 100,000 or the projected
      dense working set exceeds 4 GiB on the declared 14-core 48 GB host; an
      aborted cell is recorded as "not computable in budget" and is an
      infrastructure stop, never evidence. Peak RSS is a required reported
      metric so the envelope prediction can fail.
    controls:
      - >-
        DEGREE-UNMATCHED INTERPOLATED NULL, arm (D), BLOCKING. Must separate;
        if it does not, the instrument has no power and the line halts.
      - >-
        VARIABLE-SWAP ARM, BLOCKING. Must give exactly zero difference, by
        symmetry of S_3; a nonzero value is an engine bug.
      - >-
        REDUCED-BASIS EQUALITY PRECHECK, BLOCKING, run before any filtration is
        compared. The two arms must produce the identical reduced basis or the
        design is void at that cell.
      - >-
        m = 1 GCD KNOWN-ANSWER EDGE and the B = 1 hand cell.
      - >-
        UNSATISFIABLE ARM. |Z| = 0 cells give the unit ideal in both arms; the
        filtration comparison is still run there and reported separately,
        because a difference in HOW the two arms reach the unit ideal is itself
        a generator-level signal.
      - >-
        ORDER SENSITIVITY ARM. Grevlex primary, lex on a 10 percent subsample.
        The last fall degree is order-independent per KN-LIT-7607 and is the
        headline; the solving degree is order-dependent and is reported per
        order, never pooled.
      - >-
        CERTIFICATE ARM. Cells with |Z| >= 1 emit a decomposition certificate
        re-verified by independent point addition; cells with |Z| = 0 emit the
        checkable negative certificate (the sorted 2B candidate list, verified
        disjoint from V in O(B log B)).
      - >-
        FACTOR-BASE DISTINCTNESS precondition checked per cell.
    required_metrics:
      - 'full graded rank filtration dim V_D for both arms, every cell, every degree'
      - 'per-degree excess dim V_{D+1} minus dim(S_1 times V_D), both arms'
      - 'last fall degree and solving degree per arm per order'
      - 'Delta_lf paired per cell, with bootstrap 95 percent CI'
      - 'reduced-basis equality check result per cell'
      - 'arm (D) and variable-swap control results'
      - 'null-construction success rate and number of redraws per cell'
      - '|Z| per cell computed from the group law with no use of S_3'
      - 'certificate verification pass or fail, positive and negative arms'
      - 'pre-flight column and row counts, peak RSS, wall time per cell'
      - 'count of cells aborted as not computable in budget'

  falsification_conditions:
    - >-
      The two arms produce DIFFERENT reduced Groebner bases at any squarefree
      cell. The CRT structure theorem fails there, this record's design is
      void, and the finding is about the theorem or the implementation, not
      about solving degree.
    - >-
      The degree-unmatched arm (D) shows |Delta_lf| below 1 in more than 10
      percent of cells with B >= 8. The instrument cannot see generator degree;
      the line halts as an instrument failure and NO controlled null may be
      declared from it.
    - >-
      The variable-swap arm shows any nonzero difference. Engine bug; every
      other number in the run is inadmissible.
    - >-
      OUTCOME I - filtrations agree at every degree in at least 95 percent of
      cells while arm (D) separates cleanly. Then no Groebner observable in
      this encoding carries summation-polynomial information, the lane's
      numerator is a function of Z and B, and the answer to RQ-SDEG-001's
      decision target is REDESIGN with a derivation attached. This is a
      first-class deliverable and closes the observable set at the
      inventor-protocol section 4 standard.
    - >-
      OUTCOME II - filtrations separate. The Semaev generator carries
      generator-level information that survives the exactly matched null, the
      lane has a legitimate numerator, and Delta_lf's scaling in B becomes the
      quantity to fit. This falsifies the broad reading of bdca13's REDESIGN
      verdict while leaving its ideal-level theorem untouched.
    - >-
      An intermediate result under the pre-registered rule. Reported as
      settling nothing, with the cell-level pattern published so a later
      session can re-scope, and explicitly NOT converted into a scaling fit.
    - >-
      Delta_lf is nonzero but does not decay as B grows while |Z| is held
      fixed. Under inventor-protocol section 3 a signal that does not decay
      when the parameter meant to dilute it increases is the canonical artifact
      tell, and this pattern must be reported as suspected artifact before it
      is reported as signal.

  confounders:
    - >-
      SOLUTION-COUNT CONFOUND, WHICH IS EXACTLY WHAT THE MATCHED NULL REMOVES.
      A support-matched but not zero-set-matched null changes |Z| and therefore
      the quotient dimension, so any filtration difference confounds generator
      structure with solution count. This record's null matches Z exactly, and
      the |Z| covariate is nonetheless recorded per cell and reported.
    - >-
      NULL-CONSTRUCTION BIAS. Rejecting draws that vanish off Z makes the null
      non-uniform on the affine solution space. The rejection rate is recorded
      per cell, and a cell with rejection rate above 50 percent is flagged,
      because at small p the exclusion is not negligible.
    - >-
      COEFFICIENT-SIZE AND SPARSITY. S_3 has a specific sparse coefficient
      pattern; a uniform random bidegree-(2,2) polynomial is dense. A
      filtration difference could reflect SPARSITY rather than Semaev
      structure. Mitigation, and it is a required third arm - a
      SPARSITY-MATCHED null, uniform over bidegree-(2,2) polynomials with the
      same monomial support as S_3 subject to vanishing on Z, run wherever the
      support allows the |Z| conditions to be satisfied. Where it does not, the
      cell is reported as sparsity-unmatched rather than dropped.
    - >-
      ORDER DEPENDENCE. Solving degree is order-dependent by definition; the
      last fall degree is reported as the headline precisely because
      KN-LIT-7607 records it as order-independent, and the lex subsample is a
      sensitivity check, not a second result.
    - >-
      SMALL-INTEGER RESOLUTION. Degrees are small integers, so |Delta_lf| = 1
      is simultaneously the minimum resolvable effect and a large relative
      effect. The full filtration, not the single integer, is the primary
      output for exactly this reason.
    - >-
      STRATIFICATION BIAS. Targets are stratified by |Z| and no yield or
      coverage statement may be read off this battery.
    - >-
      THE FLOOR MAKES ABSOLUTE VALUES UNINFORMATIVE. Per
      IDEA-20260808-afe4ce the last fall degree in this encoding is bounded
      below by B for reasons that have nothing to do with the summation
      polynomial, so only DIFFERENCES between matched arms are interpretable
      and this record never reports an absolute last fall degree as a result.
    - >-
      SCOPE LEAKAGE TO DREG. GOAL-DREG-001's boolean chained systems use a
      different encoding; nothing here transfers to them.

  interpretation_limits:
    - >-
      This is an INSTRUMENT CALIBRATION, not a mathematical result about the
      ECDLP or about summation polynomials, and not a cost model. No attack, no
      exponent, no hardness claim, and Outcome II is a distinguisher between
      two generating sets, never an algorithm.
    - >-
      Every number here is a property of a GENERATING SET, a monomial order and
      an exact-rank convention. It must never be quoted as an invariant of the
      ideal, and any downstream citation that drops the generating set is a
      claim-tier violation.
    - >-
      Scoped to m = 2 (with m = 3 optional), prime fields, short Weierstrass,
      squarefree completely split membership, B at most 32, p at most 2^16, and
      the frozen order. Nothing transfers to extension fields or to
      cryptographic scale, and no extrapolation is licensed.
    - >-
      Outcome I closes the OBSERVABLE SET of this encoding, not KN-OPEN-002.
      How the solving degree grows for prime-field summation-polynomial systems
      remains open; what Outcome I would establish is that the current encoding
      cannot answer it because its observables do not depend on the summation
      polynomial.
    - >-
      NOVELTY IS NOT ADJUDICATED. One external source was fetched this session,
      at abstract depth only, and it does not concern this construction. The
      corpus was grepped and the six nearest records read in full. The
      semi-regularity citation is recalled only. Honest status is unverified.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a factor base V of B distinct rational x-coordinates and a target R
        with |Z| at most 3, a polynomial drawn uniformly from the
        9-dimensional F_p-space of bidegree-(2,2) polynomials, conditioned on
        vanishing at the |Z| cells of Z, is nonzero at every one of the
        remaining B^2 - |Z| grid cells with probability at least
        1 - (B^2 - |Z|)/p.
      rigorous_support: >-
        The RIGOROUS ingredient is exact and elementary - the evaluation map
        from the bidegree-(2,2) space to F_p at a fixed grid cell is F_p-linear
        and, restricted to the subspace vanishing on Z, is either identically
        zero or surjective; when surjective its kernel is a hyperplane of
        density exactly 1/p, so the union bound over B^2 - |Z| cells is exact
        and not asymptotic. The CLASSICAL STATEMENT IMITATED is the
        Schwartz-Zippel bound for a nonzero polynomial evaluated at a fixed
        point of a random linear family; the heuristic content is only that the
        evaluation is NOT identically zero on the conditioned subspace, which
        fails exactly when a grid cell is forced to vanish by the |Z|
        conditions - a degenerate configuration that is DETECTED per cell
        rather than assumed away.
      validation_plan: >-
        SAMPLE - every cell of the Stage 3 grid, 200 or more cells, with 100
        draws attempted per cell and the number of rejections recorded.
        COMPARISON DISTRIBUTION - the observed rejection rate against the
        predicted (B^2 - |Z|)/p per draw, compared cell by cell with a binomial
        test at the 1 percent level, and the NUMBER OF FAILING CELLS reported
        rather than the best cell. TAIL CHECKS - (a) the cells with the largest
        B^2/p ratio, namely B = 32 at p = 2^8 where B^2/p = 4 and the bound is
        VACUOUS, which are reported separately and are expected to require many
        redraws or to fail construction outright; (b) any cell where all 100
        draws are rejected, which indicates a forced vanishing and is a
        structural fact about that configuration worth its own line in the
        report. SAMPLED PARAMETERS RECORDED - p, curve, B, seed, |Z|, rejection
        count. TRANSFER ASSUMPTIONS - none; the bound is used only to justify
        feasibility of the construction at the tested parameters and no
        statement is made outside them.
    - id: H2
      statement: >-
        The exact graded rank of the degree-D Macaulay matrix over F_p, as
        computed by the engine of Stage 1, equals the dimension of the degree-D
        graded piece of the ideal generated by the input system, for every
        D <= D_max and every cell in the declared envelope.
      rigorous_support: >-
        This is an implementation property, not a mathematical one. The
        rigorous anchor is that the graded piece is a well-defined F_p-vector
        space whose dimension is order-independent and implementation-
        independent, so two correct implementations must agree exactly - which
        converts the assumption into a testable equality. The program has
        standing reason to test it rather than trust it - KN-OPEN-5b3a08
        records a confirmed harness defect in this exact module that sat on the
        result path of 21 archived runs.
      validation_plan: >-
        SAMPLE - every Stage 3 cell for the engine's internal consistency
        checks, and a 20-cell subsample against an independent implementation
        (a second exact linear-algebra path, and a CAS Groebner basis whose
        reduced output must have leading terms consistent with the computed
        staircase). TAIL CHECK - the largest-B and largest-D cells, where
        implementation differences are most likely to surface, reported
        individually. KNOWN-ANSWER ANCHORS - the m = 1 gcd edge and the B = 1
        hand cell, both of which must be reproduced exactly before any Stage 3
        number is recorded. A disagreement between two correct implementations
        is an INSTRUMENT FAILURE and is reported as such, never as a finding
        about solving degree.
    - id: H3
      statement: >-
        Conditional on Outcome II, the paired difference Delta_lf between the
        matched arms behaves, across cells at fixed (p, B, |Z|), like
        independent draws from a fixed distribution with finite variance, so
        that a bootstrap confidence interval on its median has its nominal
        coverage.
      rigorous_support: >-
        The RIGOROUS ingredient is the pairing itself - both arms are run on
        the SAME curve, the SAME factor base, the SAME target and the SAME
        ideal, so every cell-level nuisance parameter cancels within the pair
        by construction, and this is a design fact rather than an assumption.
        The CLASSICAL STATEMENT IMITATED is the ordinary bootstrap consistency
        result for a median of independent identically distributed draws with
        a continuous distribution near the median; the heuristic content is
        independence ACROSS cells, which is not guaranteed because cells share
        curves and factor-base seeds.
      validation_plan: >-
        SAMPLE - the full Stage 3 grid, blocked by curve and by seed.
        COMPARISON - a blocked bootstrap resampling whole curves rather than
        cells, reported ALONGSIDE the naive cell bootstrap; if the two
        intervals differ by more than a factor of 1.5 in width, the naive
        interval is discarded and only the blocked one is reported. TAIL
        CHECKS - (a) the intra-curve correlation of Delta_lf, reported
        explicitly; (b) the 10 cells with the most extreme Delta_lf, reported
        with their curve invariants to check whether the tail is a special-j or
        2-torsion artifact. TRANSFER ASSUMPTIONS - none. No interval computed
        here is valid outside the tested ladder and none is extrapolated.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm and
      moves nothing. Its OWN cost is two exact graded rank computations per
      cell, dominated by dense F_p elimination on a matrix with at most
      binom(D_max + m, m) columns - at the declared worst cell (m = 2, B = 32,
      D_max = 64) that is 2145 columns and roughly 6500 rows per arm. What the
      record could CHANGE about the lane's accounting is the meaning of the
      numerator - under Outcome I the numerator is a function of |Z| and B
      only, and the unconditional 2^{m-1} B^{m-1} group-operation enumerative
      oracle plus the B^{ceil(m/2)} meet-in-the-middle already dominate it,
      so the algebraic route contributes nothing; under Outcome II the
      numerator retains a generating-set-specific term whose B-scaling is then
      measured, and whether it beats B^{m-1} is a SEPARATE question this record
      does not answer.
    memory_exponent: >-
      binom(D_max + m, m) columns times the row count, dense over F_p - at most
      about 56 MB at the worst m = 2 cell and about 94 MB at the worst m = 3
      cell, against a declared 4 GiB abort threshold on a 48 GB host. Memory is
      a REPORTED metric with a pre-flight abort, precisely because the
      2026-08-28 DREG stop was a memory failure whose rank kernel was never
      invoked.
    best_known: >-
      For prime-field ECDLP - Pollard rho at 0.886 sqrt(N) with O(1) memory;
      BSGS at (N^{1/2}, N^{1/2}). For the decomposition subtask - the
      enumerative signed-sum sweep at 2^{m-1} B^{m-1} group operations and O(B)
      memory, and the target-keyed meet-in-the-middle at B^{ceil(m/2)} time and
      B^{floor(m/2)} memory. For the algebraic invariants - the classical
      framework relating solving degree, last fall degree, degree of regularity
      and Castelnuovo-Mumford regularity (arXiv:2112.05579, abstract only),
      which is used and not improved.
    hidden_overhead: >-
      Three disclosures. First, "solving degree" here means an EXACT GRADED
      RANK threshold, not what a production F4 or F5 would reach; a real solver
      with degree falls can terminate below it and the record must never claim
      otherwise. Second, the absolute values are floored at B by the encoding
      (IDEA-20260808-afe4ce), so only differences are interpretable and the
      floor is disclosed in every downstream summary. Third, Outcome II's
      Delta_lf is a distinguisher, and converting a distinguisher into a cost
      advantage requires a separate argument that this record does not supply
      and does not gesture at.
    tradeoff_note: >-
      Not applicable to this record, which produces no algorithm. For the
      subtask it references the tradeoff is the standard one - the enumerative
      sweep at time 2^{m-1} B^{m-1} and memory O(B), embarrassingly parallel
      over (m-1)-tuples with no communication, against the meet-in-the-middle
      at time B^{ceil(m/2)} and memory B^{floor(m/2)} with the usual
      distinguished-point parallelization. Neither is proposed or improved.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES AGAINST EVERY
    FRONTIER ROW ENUMERATED IN CATALOGUE A1-13. As an ATTACK - mounts none, so
    dominated by every row on every axis - Pollard rho (N^{1/2}, O(1)),
    multi-target rho (sqrt(TN)), BSGS (N^{1/2}, N^{1/2}), van Oorschot-Wiener
    parallel rho, the preprocessing frontier S T^2 = Omega~(N), meet-in-the-
    middle index calculus (N^{1/2 + 1/m}, N^{1/2}), two-term index calculus at
    optimum. None approached, none affected, no queries used. As a COST MODEL -
    produces none and is dominated by the SDEG lane's own deferred protocol on
    that axis. As ALGEBRA - entirely dominated by the classical
    solving-degree / last-fall-degree literature (arXiv:2112.05579,
    KN-LIT-7607), which is cited and not improved; claim (A) is definitional
    and claims no priority. As a NULL DESIGN within this program - it strictly
    DOMINATES IDEA-20260808-093497's matched-random-support null and
    IDEA-20260829-bdca13's random bidegree-(2,2) null, on the single axis of
    confound removal - both match shape, neither matches the solution set,
    and matching the solution set is what makes the two arms share an ideal
    and therefore isolates the generator effect. It does not dominate either
    record on any other axis and replaces neither. Not null on any axis.
  sota_delta: >-
    Zero on every ECDLP cost axis; no attack, no exponent, no security claim.
    Quantified deltas against the prior state of this program. (1) Separates
    two quantities the lane conflates - an ideal invariant, which
    IDEA-20260829-bdca13 proves is a function of the point set Z, and a
    generating-set invariant, which no ideal-level argument can reach - and
    supplies the one-line witness proving the separation, so that bdca13's
    REDESIGN verdict is either correctly scoped or correctly widened rather
    than assumed. (2) Upgrades the lane's null from support-matched to
    ZERO-SET-MATCHED, which is the difference between two arms with different
    ideals and two arms with the IDENTICAL ideal; only the latter yields a
    difference attributable to the generator alone, and the CRT theorem that
    makes it constructible is nine days old in this corpus. (3) Pre-registers a
    decision rule with a stated per-degree resolution and a paired confidence
    interval, which is the specific object RQ-SDEG-001's decision target asks
    for ("a scoped cost model with CIs") applied first to the question of
    whether the quantity being scoped exists. Against the prior state - a lane
    about to fit a scaling law to a quantity whose dependence on the summation
    polynomial had never been tested - the delta is that test, at a cost of
    minutes.

  estimated_cost:
    implementation: medium
    compute: low
    basis: >-
      Implementation is MEDIUM - an exact graded rank engine over F_p with a
      pre-flight size gate, a matched-null constructor with rejection sampling,
      and known-answer validation at m = 1 and B = 1. Stage 5 would additionally
      need an S_4 instrument that does not exist today and is therefore
      explicitly optional. Compute is LOW - at most about 56 MB per m = 2 cell
      and 94 MB per m = 3 cell, roughly 400 rank computations for the main
      grid, estimated in low single-digit CPU hours on the declared 14-core
      48 GB host, with a hard abort above 100,000 columns or 4 GiB.
