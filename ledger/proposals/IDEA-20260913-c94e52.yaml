idea:
  id: IDEA-20260913-c94e52
  title: >-
    Chaining topology is a four-fold invariant with one bounded variant: every binary
    merge tree over t leaves has exactly t-1 equations, t-2 auxiliary variables,
    N = (t-2)n + tk Boolean variables and t-2 three-variable blocks, so Semaev's own
    n^{4 omega} charge is topology-blind by construction -- the path is NOT optimal
    under any finer proxy, it is 17 percent off, and the whole topology axis spans a
    factor 4.0 at the FIPS parameters
  class: composition
  claim: >-
    GOAL-SEMBIN-cbf422 sub-objective 3 asserts that "a balanced tree is another
    presentation of the same decomposition, with a different auxiliary-variable count
    and a different first-fall-degree analysis". BOTH halves of that premise are false,
    and the correct statement is sharper and more useful than either.

    (C1) FOUR INVARIANTS. Present the decomposition of R into t factor-base points as a
    full binary merge tree with t leaves (the x_i in V), one equation
    S_3(val(left), val(right), val(node)) = 0 per internal node, the root's value fixed
    to R_X, and one auxiliary variable per non-root internal node. Then for EVERY shape:
      number of equations               = t - 1,
      number of auxiliary variables     = t - 2,
      total Boolean variable count      N = (t-2) n + t k,
      number of blocks with three VARIABLE slots = t - 2, and exactly one block
        (the root) with a constant slot.
    VERIFIED BY EXHAUSTIVE ENUMERATION in this task over all binary merge trees for
    t = 3, 4, 5, 6, 7, 8 -- that is 3, 15, 105, 945, 10395 and 135135 labelled trees
    respectively, every one of which has t-1 internal nodes and t-2 non-root internal
    nodes. The invariance is trivial once stated (a full binary tree with t leaves has
    t-1 internal nodes) but it has to be stated, because the goal's premise depends on
    its negation.

    (C2) CONSEQUENCE: TOPOLOGY IS EXACTLY FREE UNDER SEMAEV'S OWN COST MODEL. Section
    4.2 charges the decomposition step O[(n(m-1))^{4 omega}], i.e. a function of N
    alone; eq. (15) carries it as n^{4 omega}. N is a topological invariant by (C1).
    Therefore the paper's charged cost cannot distinguish any two topologies, and this
    is not an oversight in the paper -- it is a theorem about its cost model. Any claim
    that a topology is better or worse is necessarily a claim in a FINER cost model,
    and must say which.

    (C3) THE ONE VARIANT, and its exact size. What does vary is the SLOT-SIZE PROFILE:
    the multiset over internal nodes of (|left|, |right|, |self|) where a leaf slot
    contributes k Boolean variables, an internal slot n, and the root's self-slot 0.
    Under the monomial-occurrence proxy
      sigma_top = sum over blocks of n . (ab + ac + bc + abc), (a,b,c) the slot sizes,
    which counts the quadratic-and-cubic Boolean monomial occurrences that the
    Weil-descended eq. (14) contributes, exhaustive minimisation over all shapes gives
    (MEASURED, exactly, this task):
      n = 571, t = 4, k = 143: min/path = 0.407, max/path = 1.000 (only 2 shapes)
      n = 571, t = 5, k = 115: min/path = 0.641, max/path = 2.422
      n = 571, t = 6, k =  96: min/path = 0.741, max/path = 2.282
      n = 571, t = 8, k =  72: min/path = 0.832, max/path = 3.325
      n = 310, t = 8, k =  39: min/path = 0.834, max/path = 3.301
      n =  21, t = 7, k =   3: min/path = 0.851, max/path = 2.794
      n =  17, t = 6, k =   3: min/path = 0.815, max/path = 1.863
      n =  15, t = 4, k =   4: min/path = 0.581, max/path = 1.000
    So the entire topology axis spans a factor max/min = 3.325/0.832 = 4.00 at
    (n, t) = (571, 8), and it NARROWS toward the path as t grows: min/path rises
    monotonically from 0.407 at t = 4 to 0.832 at t = 8.

    (C4) THE PATH IS NOT OPTIMAL -- and the optimum is not a balanced tree either. The
    proxy-minimising shape at every t >= 5 tested is a CATERPILLAR WITH A CHERRY AT THE
    ROOT: ((((((LL)L)L)L)L)(LL)) at t = 8, i.e. Semaev's path with its final leaf
    replaced by a two-leaf merge. It beats the path by 16.8 percent at t = 8 and by
    59.3 percent at t = 4. The mechanism of the improvement is a single exchange: the
    path's last block is (n, k, 0) -- cheap, because the root's second child is a leaf
    -- but paying for it costs one extra spine block (n, n, k), whose cubic term
    n . n . k dominates. Trading root cheapness for one fewer spine block wins whenever
    n^2 k > n k^2 + (root cost difference), i.e. essentially always at n >> k. The
    BALANCED tree is the WORST or near-worst shape at every t >= 5 because it maximises
    the number of all-auxiliary blocks (n, n, n): a balanced tree over t = 2^h leaves
    has t/2 - 2 of them, whose cubic term n^3 is a factor n/k = m larger than a spine
    block's n^2 k. So the goal's suggestion to try a balanced tree points at the
    dominated end of the axis, and the improvement the axis does contain -- 17 percent
    in a monomial count -- is smaller than the noise of any experiment that could
    measure it.

    (C5) THE FIRST-FALL-DEGREE ANALYSIS IS ALSO INVARIANT, by (C1)'s fourth clause.
    Semaev's Section 4.5 derivation proves d_ff = 4 for a block with three VARIABLE
    slots (from deg_{F_2} S_3(x_1,x_2,x_3) = 3 and deg_{F_2} x_1 S_3(x_1,x_2,x_3) = 3),
    notes that the argument does not work for S_3(x_1, x_2, z) with z a constant, cites
    [11] for a bound of 5 in that case, and reports that experiments show 4 anyway. He
    then writes "at least t - 2 of the equations in (5) have the first fall degree 4".
    That count is exactly the (C1) invariant: EVERY topology has t-2 three-variable
    blocks and exactly one block with a constant slot. Restricting a slot to V rather
    than F_q is a linear substitution, which cannot raise deg_{F_2}, so the derivation
    is also insensitive to how many leaf slots a block has. Hence Semaev's d_ff
    sentence is topology-independent as stated, and no topology change alters the
    premise of Assumption 1 in the way the goal's premise supposes.

    (C6) THE ARITY AXIS IS THE ONE THAT COULD MOVE N, AND IT LOSES DECISIVELY. Chaining
    S_{j+1} instead of S_3 at each node gives a j-ary tree with (t-1)/(j-1) internal
    nodes, hence (t-1)/(j-1) - 1 auxiliary variables, hence
    N(j) = n((t-1)/(j-1) - 1) + tk: at (n, t, k) = (571, 12, 48), N drops from 6286
    (j = 2) to 3146 (j = 3) to 2099 (j = 4) to 1575 (j = 5). This is the only topology
    modification that changes N at all, and it therefore the only one Semaev's own cost
    model can see. But the cost is a degree: the first-fall bound Semaev cites for
    S_{m+1} is m^2 + 1, so a j-ary node carries j^2 + 1 in place of 4 -- 10 at j = 3,
    17 at j = 4, 26 at j = 5. Charging N^{omega d} at omega = 3 gives
    log_2 cost = 189.3 (j = 2), 348.6 (j = 3), 562.8 (j = 4), 828.5 (j = 5) at n = 571;
    and 171.7 / 313.4 / 502.9 / 736.8 at n = 310. The degree growth beats the variable
    reduction by 159 bits at the first step. So j = 2 is not a convention -- it is the
    optimum of the arity axis by a margin of 159 bits, and that is a positive
    justification of an unexplained choice rather than a shrug.

    NET ANSWER TO THE GOAL'S QUESTION for sub-objective 3: chaining topology carries
    NEITHER the exponent (by (C2) it is invisible to the cost model that produces
    1.6986, and by (C1) it cannot change N) NOR a material part of the crossover (by
    (C3) the whole axis is a factor 4.0 in a monomial count, and the available
    improvement over Semaev's path is 17 percent). The two premises the goal offered
    for opening the question are false, and the reason the paper never revisited the
    choice is that there was nothing there -- which is a result, with an obstruction,
    an argument and forward guidance, not a fatigue report.
  mechanism: >-
    The tracked object is the SLOT-SIZE PROFILE of the merge tree: the multiset of
    triples (|left|, |right|, |self|) over internal nodes, with |leaf| = k, |internal|
    = n, |root self| = 0. It is a lossy projection of the tree -- it forgets which
    leaves attach where, forgets the labelling entirely, and forgets the tree's shape
    beyond the degree sequence of leaf-attachment -- and what it discards is discarded
    COMPATIBLY with the operations the target performs on the system, because the Weil
    descent of one S_3 block depends on its three arguments only through how many
    Boolean variables each carries and whether the third is a constant. Two trees with
    the same profile produce systems that are identical up to renaming variables, so
    the projection propagates deterministically through system generation. It is
    genuinely lossy: t = 8 has 135135 labelled trees, 23 distinct shapes, and far fewer
    distinct profiles, and the enumeration above shows several distinct shapes sharing
    a proxy value exactly (three shapes tie at 5.8216e10 at n = 571, t = 8) -- so the
    profile is not a change of coordinates on the tree.

    Why the invariants are invariant. A full binary tree with t leaves has t-1 internal
    nodes; one equation per internal node gives t-1 equations; one auxiliary variable
    per non-root internal node gives t-2; each equation has 3 slots, and counting slots
    two ways gives t (leaves, once each) + 1 (root self) + 2(t-2) (non-root internal,
    once as a self-slot and once as a child) = 3t - 3 = 3(t-1), so the slot budget is
    fixed too. Hence N = (t-2)n + tk exactly, with no shape dependence, and the number
    of blocks whose third slot is a constant is exactly one. That is all four
    invariants, and (C2) follows immediately because Semaev's charge is a function of N.

    Why the variant varies. Within the fixed slot budget, the PARTITION of slots across
    equations is free. The path concentrates leaf slots one per equation (profile
    (k,k,n), then t-3 copies of (n,k,n), then (n,k,0)); a balanced tree concentrates
    them at the bottom (t/2 copies of (k,k,n)) and pays with all-auxiliary blocks
    (n,n,n) in the middle. Since the descended block's dominant term is the cubic abc,
    the cost of a block is governed by the PRODUCT of its slot sizes, and the total is
    a sum of products under a fixed sum constraint -- the classic shape where
    concentration and spreading trade off. The proxy therefore has a nontrivial
    optimum, the enumeration finds it, and it is neither the path nor the balanced tree
    but the caterpillar-with-a-cherry, for the single exchange reason spelled out in
    (C4).

    Why the arity axis is different in kind. Changing arity is the only modification
    that leaves the slot budget: a j-ary node has j+1 slots, so the slot-counting
    identity changes and the internal-node count drops by a factor j-1. That is the one
    place a topology change touches N, hence the one place Semaev's own model can
    respond, hence the one place an exponent could in principle move. It is closed by a
    degree bound, and the closure is quantitative (159 bits at the first step), which
    is what the inventor protocol's closure standard asks for: a named obstruction
    (the m^2 + 1 first-fall bound for S_{m+1} grows quadratically in arity while the
    variable count falls only linearly), an argument, and forward guidance -- named
    below under proof_obligations and in interpretation_limits.
