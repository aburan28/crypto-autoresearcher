        comparable rather than skipped. It is the right external comparison if sigma_top
        is ever promoted to a cost.
      - >-
        Semaev's own block-structure remark ("one can take the advantage of a block
        structure of the Boolean system resulted from (5), though that does not affect
        the asymptotical estimates", and Section 4.2's statement that exploiting it
        breaks all four FIPS curves at n > 310 while plain F4 breaks only n = 571): this
        is a SOLVER-SIDE improvement on the same systems, and it is the row that most
        plausibly dominates the topology axis, because a balanced tree's all-auxiliary
        blocks are more block-structured than a path's. So the axis's worst shape under
