      direction: lower
      minimum_effect: >-
        Strictly below 1 for every t >= 4, so the path is NOT the proxy optimum;
        and rising monotonically toward 1 as t grows. MEASURED 0.407, 0.641, 0.741,
        0.832 at t = 4, 5, 6, 8 with n = 571. Falsified if the path is the proxy
        minimiser at any t >= 4, or if min/path does not increase with t.
    - metric: sigma_top(balanced tree) / sigma_top(path)
      direction: higher
      minimum_effect: >-
        Strictly above 1 for every t >= 5 (at t = 4 the balanced tree IS the minimiser,
        at 0.581 -- reported here because it is the one place the goal's suggestion is
        right, and it is right for t = 4 only, where the balanced tree and the path are
        the only two shapes). At t = 8 the balanced tree is 2.43x the path at n = 16 and
        3.14x at n = 310. Falsified if the balanced tree beats the path at any t >= 5.
    - metric: log_2 of the charged decomposition cost N(j)^{omega (j^2+1)} at omega = 3
      direction: higher
      minimum_effect: >-
        Strictly increasing in j, by at least 140 bits per step at the FIPS parameters.
        MEASURED 189.3 -> 348.6 -> 562.8 -> 828.5 at n = 571, t = 12, k = 48. Falsified
        if a j > 2 arity gives a lower charged cost under any first-fall bound that a
        read source supports -- which would require the bound for S_{j+1} to be below
        about 4 + log_2(N(2)/N(j))/log_2(N(j)) . (j^2+1), i.e. below roughly 5 at j = 3,
        and is the single quantitative hostage (C6) offers.
  minimal_test:
    execution_status: >-
      EXECUTED for (C1), (C3), (C4) and (C6) as exhaustive combinatorial enumeration and
      exact integer arithmetic IN THIS TASK; the outputs are reported above and in the
      citations. No elliptic curve, no solver and no sampling were involved and none is
      needed for those claims. Step (4) below -- the one measurement that would convert
      sigma_top from a proxy into a cost -- is NOT executed.
    design: >-
      (1) DONE: enumerate all full binary merge trees over t leaves for t = 3..8, assert
      internal-node count t-1 and non-root internal-node count t-2 on every tree, and
      census the leaf-child profiles. This settles (C1) and with it the goal's premise.
      (2) DONE: for each distinct shape, compute the slot-size profile and sigma_top
      exactly, and minimise/maximise over shapes at each (n, t, k) including the FIPS
      parameter labels. This settles (C3) and (C4).
      (3) DONE: tabulate N(j) and the charged cost N(j)^{omega(j^2+1)} for j = 2..5 at
      the FIPS parameter labels. This settles (C6) conditional on HEUR-ARITY.
      (4) NOT DONE, the only part needing a solver: build the Weil-descended chained
      system for the path, for the proxy-minimising caterpillar-with-a-cherry, and for
      the balanced tree, at ONE small (n, t, k) where all three are distinct -- the
      smallest is t = 5 (3 shapes) and the smallest workable field is n = 16, k = 4,
      giving N = 3.16 + 5.4 = 68 Boolean variables and 4.16 = 64 Boolean equations.
      Use the same curve, the same f, the same B, the same instance list z_1..z_S with
      S >= 100, the same monomial order and the same solver. Record per instance:
      wall clock, peak memory, first fall degree, maximum step degree, satisfiability,
      and the realised monomial count of the generated system (so sigma_top is checked
      against the system actually built rather than against this record's arithmetic).
      The question step (4) answers is NOT "which topology is better" -- (C3) already
      bounds that at a factor 4 -- but whether measured solve time tracks sigma_top at
      all. If it does not, (C3)'s bound is inert and the correct statement of the
      closure is (C1) plus (C2) alone, which is the stronger and cleaner result anyway.
    matched_null: >-
      The null object is a tree-shaped system with the S_3 blocks replaced by RANDOM
      Boolean polynomials of the same degree profile (quadratic-squared plus cubic) on
      the same slot-size profile. It has the same N, the same equation count, the same
      monomial counts, and no elliptic-curve structure whatsoever. If measured solve
      time tracks sigma_top equally well on the null, then step (4) is measuring sparse
      linear algebra and nothing about summation polynomials -- which is the correct
      reading and must be stated, not buried. The destroying parameter is the curve
      structure itself, and it is destroyed completely rather than by degrees, so this
      null tests presence/absence rather than decay; the decay control is the separate
      arity sweep, where increasing j must increase measured degree if HEUR-ARITY holds.
    known_false: >-
      Run the (C1) counting argument against a class where its conclusion is KNOWN
      FALSE: merge DAGs, in which an internal node's value may be reused as a child of
      two different parents. A DAG over t leaves can have fewer than t-1 internal nodes
      and therefore fewer auxiliary variables, so "the auxiliary count is t-2" is false
      there. If the (C1) argument as written still goes through on DAGs, the argument
      is wrong -- it must be using the tree property, and the place it uses it is the
      slot-counting identity 3(t-1) = t + 1 + 2(t-2), which counts each non-root
      internal node exactly twice and fails as soon as a node has two parents. This is
      the proves-too-much control and it costs one paragraph. It also yields the one
      piece of forward guidance worth having: DAG presentations are OUTSIDE (C1) and are
      the only place in this axis where the auxiliary count can actually move -- see
      interpretation_limits.
    invalid_input_reject: >-
      Reject and record: (a) any enumeration whose tree count differs from the double
      factorial (2t-3)!! = 3, 15, 105, 945, 10395, 135135 for t = 3..8, since that
      indicates the generator is wrong and every downstream count is void; (b) any shape
      whose internal-node count is not t-1 (assertion, not a filter); (c) any sigma_top
      computed with a slot size other than k for leaves, n for internal, 0 for the root
      self-slot; (d) in step (4), any arm differing from its siblings in curve, f, B,
      instance list, order or solver version; (e) any arity row using a first-fall
      bound not attributable to a named source.
    controls:
      - >-
        Tree-count check against (2t-3)!! at every t (done: 3, 15, 105, 945, 10395,
        135135 all matched).
      - >-
        Semaev's own path recovered as a shape in the enumeration and identified as a
        caterpillar, with its sigma_top used as the denominator of every ratio, so the
        baseline is the paper's actual construction and not an idealisation.
      - >-
        Both extremes reported at every (n, t, k): min/path AND max/path, so the axis
        is bounded above as well as below and a reader cannot take the 0.83 as the
        whole story.
      - >-
        The t = 4 row, where the balanced tree IS the minimiser, reported prominently
        rather than dropped -- it is the one cell where the goal's suggestion is
        correct, and suppressing it would be exactly the selective reporting the
        research-direction-integrity clause forbids.
      - >-
        In step (4): the random-Boolean null at matched profile, and a reversed monomial
        order on every arm.
      - >-
        Exact-baseline reproduction for step (4): the path arm at
        (n, m, t, k) = (16, 4, 4, 4) against Table 2's 160.87 s / 1145.2 MB /
        exp_prob 0.04 / d_F4 = 4. Absolute seconds will not reproduce; d_F4 = 4 and the
        satisfiability rate must.
    decision_threshold: >-
      (C1), (C3), (C4) and (C6)'s arithmetic are settled; they fail only to an
      enumeration bug, and the rejection tests above are the check. For step (4): the
      proxy is declared PREDICTIVE at that cell if the Spearman correlation between
      sigma_top and median solve time across the three shapes has the right sign and
      the path-versus-minimiser median ratio lies in [1.0, 1.5] (the proxy predicts
      1.331 at t = 5, n = 16); INERT if the three medians agree within a factor 1.3
      pairwise; and MISLEADING if the ordering is inverted. All three are publishable
      and the third is the most interesting.
    stopping_rules:
      - >-
        Stop the enumeration at t = 8. t = 9 has 2027025 labelled trees and the marginal
        information is zero: min/path is already monotone and converging, and no claim
        in this record depends on t > 8.
      - >-
        Stop step (4) at 100 matched instances per arm or 4 CPU-hours per arm, whichever
        first.
      - >-
        Do not run step (4) at a second (n, t, k) under this contract. One cell decides
        whether the proxy is predictive; a second cell is a new contract and this record
        makes no asymptotic claim that would need it.
    required_artifacts:
      - The tree generator, the canonicalisation function, and the full shape census per t.
      - The exact sigma_top table over all shapes at every (n, t, k) reported, not just the extremes.
      - The arity table with its source for each first-fall bound.
      - For step (4): per-instance wall clock, peak memory, d_ff, max step degree, satisfiability, realised monomial count, plus the exact system generators for each arm.
      - The DAG counterexample worked out in full (the known-false control), as text.
    budget:
      authorized_runs_in_this_task: 0
      future_experiment_status: >-
        Steps (1)-(3) are complete in this task and need no contract. Step (4) requires
        a new approved frozen handoff and contract, and is the LOWEST-priority item in
        this lane on its own merits: (C2) already says Semaev's model cannot see the
        variable, and (C3) already bounds it at a factor 4, so step (4) can change a
        bounded constant and nothing else. This record neither creates, approves nor
        dispatches it.
  falsification_conditions:
    - >-
      A full binary merge tree over t leaves whose chained system has a number of
      auxiliary variables other than t-2, or a number of equations other than t-1, or a
      Boolean variable count other than (t-2)n + tk. This refutes (C1) and with it the
      whole record, and would vindicate the goal's premise. It is the cleanest possible
      refutation and it requires exhibiting one tree.
    - >-
      A binary merge tree with a number of three-variable blocks other than t-2, or with
      more than one block carrying a constant slot. This refutes (C5) and reopens the
      possibility that topology changes the first-fall-degree analysis, which is the
      goal's second premise.
    - >-
      A cost model of the decomposition step, attributable to a read source, that
      depends on the topology other than through N. This refutes (C2) -- not by
      contradicting it (it is a statement about Semaev's model, which is fixed text) but
      by making it irrelevant, since the interesting cost model would then be the other
      one. This is the most likely route by which the record becomes obsolete rather
      than wrong, and it is exactly what IDEA-20260913-9c54f9's fitted per-solve law
      might supply.
    - >-
      max/min of sigma_top over shapes exceeding a factor 16 at any (n, t, k) with
      t <= 12 and k = ceil(n/m). The record's bounded-axis claim is quantitative (4.00
      at (571, 8)) and a wide axis would make topology worth pursuing after all. The
      test is exhaustive enumeration at that (n, t, k), which is cheap up to t = 10.
    - >-
      A first-fall-degree bound for the Boolean system from S_{j+1} at j = 3, from a
      read source, at or below 5. Then (C6)'s arity closure fails at the first step and
      ternary merges become a live option with N halved -- which would be a genuine
      exponent-adjacent finding, since N enters the charged cost inside the exponent.
      This is the record's single largest exposure and it is named as HEUR-ARITY.
    - >-
      In step (4): measured median solve time inverted relative to sigma_top across the
      three shapes. Then the proxy is misleading, (C3)'s factor-4 bound says nothing
      about cost, and the closure rests on (C1) and (C2) alone. This weakens the record
      without refuting its load-bearing parts, and must be reported as such rather than
      as a vindication of the invariance.
  confounders:
    - >-
      PROXY VALIDITY. sigma_top counts monomial OCCURRENCES in the generated system. F4
      cost depends on the Macaulay matrix at the solving degree, whose column count is
      C(N, <= D) and is topology-invariant because N is. So there is a real tension
      inside this record: the invariant quantity is the one the cost model uses, and the
      variant quantity is a proxy for input size only. This is disclosed as the central
      interpretation limit rather than smoothed over, and it is why step (4) exists and
      why it is ranked last.
    - >-
      LEAF ORDERING. Two trees of the same shape differ by which x_i sits at which leaf.
      With a single V this is a relabelling and changes nothing; with DISTINCT per-leaf
      subspaces (the coset-typed device of the sibling IDEA-20260913-8138a0) it stops
      being a relabelling, because the leaf slots then carry different cosets and the
      profile gains a per-leaf coset label. That composition is NOT analysed here and is
      the main forward-guidance item.
    - >-
      t VERSUS m. Everything here is at FIXED t. The goal's sub-objective 1 and
      H-SEMBIN-b1708c vary t, which changes N and is therefore visible to Semaev's model.
      Conflating the two axes would make the topology axis look consequential by
      borrowing t's effect; every number in (C3) and (C4) is a within-t ratio.
    - >-
      SEMAEV'S ARITY IS ALREADY A CHOICE. The paper chains S_3 because S_3 is the
      cheapest summation polynomial; (C6) justifies that against j > 2 but does not
      consider MIXED arity (some nodes S_3, some S_4), which is a strictly larger class
      and is not enumerated. A mixed tree could in principle sit between the arity rows;
      nothing here excludes it and (C6) is stated for uniform arity only.
    - >-
      omega. The arity table uses omega = 3. At omega = 2.376 the arity gaps shrink by
      21 percent -- 189.3 -> 149.9, 348.6 -> 276.1 at n = 571 -- so the ordering and the
      140-bit-per-step margin survive, but the absolute numbers are omega-dependent and
      must not be quoted without it.
  interpretation_limits:
    - >-
      The load-bearing content is (C1) and (C2), which are combinatorics and a reading
      of the paper's own cost formula. Everything about sigma_top is a proxy and is
      explicitly not a runtime claim. A reader who takes only (C1) and (C2) has the
      whole defensible result: the goal's premise is false and the topology axis is
      invisible to the cost model that produces 1.6986.
    - >-
      This is a CLOSURE of sub-objective 3 within the binary-merge-tree class, not of
      "chaining" in general. Three things remain open and are named so the closure is
      not read as broader than it is: (i) MERGE DAGs, where a shared auxiliary value
      serves two parents -- outside (C1), and the only construction in this axis that
      can reduce the auxiliary count below t-2, at the cost of correlating the
      constraints, which is a genuine unexplored object; (ii) MIXED-ARITY trees, outside
      (C6); (iii) leaf-to-position assignment under DISTINCT per-leaf subspaces, where
      shape and coset labelling interact and the invariance argument of (C1) says
      nothing about the labelled object.
    - >-
      The 17 percent improvement available over Semaev's path is real under the proxy
      and is not worth having: it is smaller than the spread between three irreducible
      f at the same parameters, and eq. (15)'s cofactor is charged as n^{4 omega} with
      no constant in front, so a 17 percent monomial saving does not survive into any
      number in Table 3.
    - >-
      The t = 4 exception must travel with the claim. At t = 4 there are only two shapes
      and the balanced one wins by 1.72x. Any statement of the form "the path is the
      right topology" is false at t = 4 and true-ish from t = 5. Since Table 3's optimal
      m runs from 6 to 12, t = 4 is outside the regime the paper's conclusions rest on,
      but it is inside the regime of Tables 1 and 2 (m = 4 appears in eight rows), which
      is where the degree evidence comes from.
    - >-
      Nothing here bears on Assumption 1, on the yield model, on the subspace choice, or
      on the memory-charged crossover. (C5) states that Semaev's d_ff sentence is
      topology-invariant; it does NOT state that the sentence is true, and
      KN-OPEN-d218ec's definitional gap is untouched.
  heuristic_assumptions:
    - id: HEUR-TOP
      statement: >-
        (Topology-cost proportionality.) Let two chained systems be built at identical
        (n, f, B, t, k, V, monomial order, instance z) from two different binary merge
        trees with slot-size proxies sigma_1 <= sigma_2, and suppose their measured first
        fall degrees and maximum step degrees agree. Then the ratio of median solve
        times over a matched instance set satisfies 1 <= T_2/T_1 <= (sigma_2/sigma_1)^omega
        with 2.376 <= omega <= 3. Formally: for all such pairs and all instance sets of
        size >= 100.
      rigorous_support: >-
        The rigorous part is the input-size bound: sigma_top counts exactly the quadratic
        and cubic Boolean monomial occurrences the descended blocks contribute, hence
        bounds the nonzero count of the degree-D Macaulay matrix up to a fixed
        combinatorial factor; sparse elimination on Z nonzeros costs at least Omega(Z).
        The matrix DIMENSION is identical across topologies because N is invariant by
        (C1), which is exactly what makes this a clean comparison -- unlike the subspace
        comparison of the sibling IDEA-20260913-fb0483, here only the nonzero count
        moves and the column set is literally the same. What is NOT rigorous is the
        upper bound: fill-in during elimination is governed by the elimination tree, and
        two systems with the same columns and different sparsity patterns can fill in
        very differently.
      random_model_justification: >-
        The classical statement imitated is the sparse-elimination cost model: for a
        matrix whose Z nonzeros sit in generic positions, cost scales with Z up to
        fill-in. The random model is that the topology-dependent nonzeros occupy generic
        positions given their count. This is the same modelling step Semaev's Section
        4.5.1 makes in replacing R_X by a random z. The model is MOST suspect for the
        balanced tree, whose all-auxiliary blocks (n,n,n) produce a block-structured
        pattern that Semaev himself notes can be exploited ("one can take the advantage
        of a block structure of the Boolean system resulted from (5), though that does
        not affect the asymptotical estimates") -- so a balanced tree might solve faster
        than its sigma_top suggests precisely because its structure is MORE exploitable,
        and if the measurement shows that, the informative reading is that block
        structure is a third axis and the proxy is the wrong meter.
      falsification_condition: >-
        A matched pair with agreeing measured degrees, sigma_2 > sigma_1 and median
        T_2/T_1 < 0.9, or T_2/T_1 > (sigma_2/sigma_1)^3, at >= 100 instances per arm and
        p < 0.01. Either refutes HEUR-TOP; (C1), (C2), (C5) and (C6) survive untouched,
        because none of them uses sigma_top.
      validation_plan: >-
        Step (4)'s cell: (n, t, k) = (16, 5, 4), three shapes (path, caterpillar-with-
        cherry, balanced), >= 100 matched instances per shape stratified 50/50 by
        independently enumerated satisfiability, with d_ff and max step degree recorded
        as covariates and the realised monomial count recorded per generated system.
        Predicted: T(path)/T(minimiser) in [1.0, 1.331^3] = [1.0, 2.36] since
        sigma_top(path)/sigma_top(min) = 52480/39424 = 1.331 at that cell; and
        T(balanced)/T(path) = 91648/52480 = 1.746 in
        proxy, predicted band [1.00, 5.33]. Comparison distribution: the random-Boolean
        null at matched profile. Tail check: the 95th-percentile solve time per arm, not
        the median, because a topology effect acting only on the hardest instances would
        be invisible in the median and is the failure mode that matters for a
        worst-case cost model. Sampled parameters recorded exactly. TRANSFER ASSUMPTION,
        stated: one (n, t, k) cell, three shapes, no extrapolation in n or t claimed.
    - id: HEUR-ARITY
      statement: >-
        (Arity degree growth.) For the Boolean system obtained by Weil descent from
        S_{j+1}(x_1,...,x_j, w) = 0 with the x_i in a k-dimensional subspace and w a
        variable or a constant, the solving degree grows at least linearly in j^2, and
        in particular is bounded below by something exceeding 4 + epsilon for every
        j >= 3. Formally: there is a constant c > 0 such that d_solve(j) >= c j^2 for
        all j >= 3 at the parameters of interest, so that the charged cost
        N(j)^{omega d_solve(j)} is increasing in j whenever N(j) >= 2.
      rigorous_support: >-
        Rigorous UPPER bound only: Semaev cites [11] for first fall degree at most
        m^2 + 1 for the system from S_{m+1}, and states the maximal total degree of the
        Boolean equations from S_{m+1} is at most m(m-1). Those are upper bounds, and
        (C6) uses the upper bound as if it were the realised degree, which is the
        heuristic. The genuinely rigorous half of (C6) is the VARIABLE count:
        N(j) = n((t-1)/(j-1) - 1) + tk is exact combinatorics, so the benefit of higher
        arity is known exactly and only the cost is assumed. Semaev's own d_ff = 4
        derivation for S_3 shows the j = 2 case realises far below its m^2 + 1 = 5
        bound, which is direct evidence that the bound is loose -- and therefore direct
        evidence against using it at j = 3.
      random_model_justification: >-
        The model imitated is the semi-regular-sequence picture of Bardet-Faugere-Salvy
        (KN-LIT-029 in this corpus), under which the solving degree of a system is set
        by its degree profile and variable count and rises with generator degree. The
        Boolean coordinate functions of S_{j+1} have deg_{F_2} growing with j (Semaev's
        m(m-1) bound), so the model predicts the solving degree rises with j. The
        corpus record for KN-LIT-029 itself hedges that semi-regularity need not hold for
        structured systems, and summation polynomials are the canonical structured
        system, so the direction is asserted and the magnitude is not.
      falsification_condition: >-
        A measured or cited solving degree for the j = 3 (S_4) descended system at or
        below 5 at parameters with 2 <= t <= 6 and k = ceil(n/t). Then N(3) = N(2)/2
        roughly and the charged cost FALLS, ternary merges become the better topology,
        and (C6) is refuted at its first step. Measurable directly at n = 15..21 with
        t = 3, 4 for a few hundred CPU-seconds, which makes this the cheapest
        high-value falsification test in the record.
      validation_plan: >-
        Build the ternary-merge system at (n, t, k) = (15, 3, 5) and (16, 4, 4) -- an
        S_4 node merging three leaves into one auxiliary, plus a root -- and measure
        d_ff, the maximum step degree and the solving degree over >= 40 instances per
        cell, stratified by satisfiability, against the binary system at the same
        (n, t, k). Predicted distribution: the ternary arm's solving degree strictly
        above the binary arm's, by at least 2, with the binary arm at 4 (reproducing
        Semaev's Tables 1-2 d_F4 = 4). Tail check: the largest step degree over all
        instances and both of two monomial orders, since a degree conclusion drawn from
        a mean would miss exactly the instances that set the worst-case cost. Sampled
        parameters recorded exactly. TRANSFER ASSUMPTION, stated: two small cells, no
        claim for j >= 4, no claim for n > 21, and nothing claimed about MAGMA's F4.
  target_complexity:
    time_exponent: >-
      Unchanged, and provably so within the stated class: by (C1) the topology cannot
      change N, and by (C2) Semaev's charged decomposition cost is a function of N
      alone, so the exponent 1.6986 sqrt(n ln n) -- which comes from balancing
      m! 2^{n-mk} 2^k n^{4 omega} against 2^{k omega'} -- is topology-invariant. This is
      a NEGATIVE exponent result and it is the most defensible thing in the record.
      The arity axis is the only route to a different N, and by (C6) it raises the
      charged cost by at least 140 bits per step at the FIPS parameter labels.
    memory_exponent: >-
      Unchanged. Stage-2 memory is Theta(2^k) relations (2^31 / 2^38 / 2^48 at
      n = 310 / 409 / 571, per tables.yaml stage2_memory), set by the factor-base size
      and independent of topology. The F4 working set is governed by the number of
      degree-<= D monomials in N variables, which is topology-invariant by (C1) -- so
      the 2^{41.2} / 2^{43.4} / 2^{45.9} degree-<= 4 monomial counts that tables.yaml
      derives at (310, 10) / (409, 11) / (571, 12) are unchanged by any shape choice.
      Only the NONZERO COUNT inside that fixed working set varies, by the factor 4.0 of
      (C3), which is a sparsity factor and not a dimension.
    best_known: >-
      Parallel Pollard rho (van Oorschot-Wiener, KN-TECH-006 / KN-LIT-012): 2^{n/2}
      group operations, negligible memory, linear parallel speedup.
    best_known_comparator: >-
      For the question actually asked the comparator is Semaev's own path, and the
      quantity is a ratio of monomial counts: 0.832 for the best shape and 3.325 for the
      worst at (n, t) = (571, 8). For the wider question the comparator is vOW rho,
      against which nothing in this record moves.
    hidden_overhead: >-
      Disclosed: (i) sigma_top is a monomial-occurrence count and NOT a runtime; the
      quantity the cost model actually uses, C(N, <= D), is topology-invariant, so the
      factor 4.0 may have no runtime meaning at all. (ii) (C6)'s arity conclusion rests
      on an upper bound (m^2 + 1) used as a realised degree, and Semaev's own j = 2 case
      realises 4 against its bound of 5, which is evidence the bound is loose -- so the
      140-bit margins are upper-bound margins and could shrink. (iii) The whole record
      is within the uniform-arity binary/j-ary TREE class; merge DAGs are outside it and
      are the one place the auxiliary count can genuinely fall.
    tradeoff_note: >-
      No time-memory tradeoff is introduced or changed: every topology has the same N,
      the same factor-base size 2^k, the same relation requirement and the same
      parallelisation position (Semaev's "almost unbounded parallelisation" of the
      collection stage applies identically, since attempts are independent regardless
      of shape). The one tradeoff visible in the axis is internal: shapes with more
      all-auxiliary blocks have more exploitable BLOCK structure (Semaev's own remark)
      and more monomials, so a balanced tree trades sparsity for block structure -- an
      unquantified tradeoff named here as forward guidance.
    cost_model: >-
      Two models are used and kept separate. Semaev's own, eq. (15) with
      O[(n(m-1))^{4 omega}], under which (C2) says topology is exactly free. And a
      finer monomial-occurrence proxy sigma_top, under which (C3) and (C4) hold and
      which is explicitly a proxy. No degree assumption is inherited for (C1)-(C5);
      (C6) uses Semaev's cited m^2 + 1 bound and names it as HEUR-ARITY.
    data_query_cost: >-
      Zero oracle queries, identical across topologies. The relation requirement is
      Theta(2^k) regardless of shape, so the data axis of the frontier is flat here.
    established_exponent_gain: 0
  estimated_cost:
    implementation: low
    compute: low
    proposal_task:
      maximum_runs: 0
      wall_clock_cap_seconds: 3600
      memory_cap_gb: 4
    future_test: >-
      Steps (1)-(3) are complete and cost nothing further (the full enumeration to
      t = 8 and every table above ran in under 3 seconds of Python). Step (4) is one
      cell, three shapes plus a null, >= 100 instances each at
      (n, t, k) = (16, 5, 4), N = 68 Boolean variables -- against Table 2's 160.87 s
      per system at comparable size on 2015 hardware, budget under 8 CPU-hours
      including the null and the order repeat. HEUR-ARITY's validation (the S_4 node at
      n = 15, 16) is separate and cheaper, under 2 CPU-hours, and is the higher-value of
      the two.
    dominant_cost: >-
      Step (4)'s balanced-tree arm, which is the slowest by hypothesis and the one most
      likely to need the 4-CPU-hour cap.
  recommended_priority: medium
  proof_search_map:
    bottleneck: >-
      The bottleneck is a PREMISE in a committed goal record rather than a step in a
      proof: sub-objective 3 asserts that a balanced tree has a different
      auxiliary-variable count and a different first-fall-degree analysis, and the
      sub-objective exists because of that assertion. The proof-oriented content is the
      invariance theorem (C1) and its consequence (C2), which together retire the
      sub-objective, plus the arity closure (C6).
    baseline_embedding:
      parameter_slice: >-
        For (C1): Semaev's eq. (5) at t = m, which is the t = m caterpillar, and eq. (9)
        in Lemma 2 statement 2, which is the same tree. For (C2): eq. (15)'s cofactor
        n^{4 omega} and Section 4.2's O[(n(m-1))^{4 omega}]. For the step-(4) baseline:
        Table 2, n = 16, m = t = 4, k = 4 -- 160.87 s, 1145.2 MB, exp_prob 0.04,
        P_theoretical 0.0408, d_F4 = 4.
      reproduction_check: >-
        (C1) must recover Semaev's own counts exactly when specialised to the
        caterpillar: t-1 equations, t-2 auxiliary variables u_1..u_{t-2}, and
        N = (m-2)n + km, which is verbatim Section 4.2's "(m-1)n multivariate equations
        in (m-2)n + km approximately (m-1)n variables". It does: the caterpillar is one
        of the enumerated shapes and its counts match. Any formulation of (C1) that does
        NOT reproduce (m-2)n + km on the caterpillar is wrong and must be discarded
        before use. For step (4): d_F4 = 4 and exp_prob near 0.04 must reproduce;
        absolute seconds must not be expected to.
    observation_collision:
      observable: >-
        The chained system's shape statistics: equation count, auxiliary-variable count,
        Boolean variable count N, and the three-variable-block count.
      distinct_preimage_search: >-
        DONE and the collision is TOTAL, which is the finding. All 135135 labelled
        binary merge trees over 8 leaves -- and all 23 distinct shapes -- are preimages
        of the SAME value of every one of those four observables. So the observable set
        Semaev's cost model reads is maximally degenerate over the topology axis. The
        search for an observable that separates shapes found exactly one, the slot-size
        profile, and it is not in the cost model. This is the cleanest instance of the
        observation-collision audit doing its job that this batch produced: the audit is
        supposed to find cases where distinct objects share an observation, and here the
        collision class is the entire axis.
    constructive_transforms:
      - >-
        path -> caterpillar-with-cherry: replace the topmost leaf child of the root by a
        two-leaf merge. Preserves t, equations, auxiliary count and N exactly; lowers
        sigma_top by 16.8 percent at t = 8. The proxy-optimal transform.
      - >-
        path -> balanced tree: preserves all four invariants; raises sigma_top by 2.43x
        at (16, 8) and 3.14x at (310, 8) by creating t/2 - 2 all-auxiliary blocks. The
        transform the goal suggests, and it moves the wrong way for t >= 5.
      - >-
        leaf relabelling: preserves everything including sigma_top with a single V. A
        free consistency check on the harness, and it stops being free under per-leaf
        cosets.
      - >-
        binary -> j-ary: the ONLY transform in this axis that changes N, from
        (t-2)n + tk to n((t-1)/(j-1) - 1) + tk. Halves N at j = 3 and raises the charged
        degree from 4 to 10.
      - >-
        tree -> merge DAG: reuses one auxiliary value as a child of two parents.
        BREAKS (C1) -- this is the transform that leaves the class, and it is the
        known-false control and the forward-guidance item simultaneously.
    quantifier_order: >-
      Stated explicitly. (C1), (C2) and (C5) are: FOR ALL t, FOR ALL full binary merge
      trees over t leaves, the four counts are exactly t-1, t-2, (t-2)n + tk, t-2. Fully
      universal in the tree, which is what makes them a closure -- there is no
      existential escape for a cleverer topology inside the class. (C3) and (C4) are:
      FOR ALL tested (n, t, k), THERE EXISTS a shape strictly better than the path under
      sigma_top, and the extremes are bounded by the tabulated ratios. Universal over
      the tested cells only, existential in the shape. (C6) is: FOR ALL j >= 3, the
      charged cost exceeds the j = 2 charge -- universal in j, but CONDITIONAL on
      HEUR-ARITY, and the conditional is the whole weight. The inversion to avoid:
      reading (C1)'s universal quantifier as ranging over all chaining presentations
      rather than over binary merge trees. It does not, and merge DAGs are the named
      witness.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest certifiable claim is a NEGATIVE one, fully proved within the
        class: no choice of binary merge tree over t leaves changes the equation count,
        the auxiliary-variable count, the Boolean variable count, or the count of blocks
        to which Semaev's d_ff = 4 derivation applies; therefore no such choice is
        visible to the cost model that yields 1.6986, and the sub-objective as posed has
        no content. The method CANNOT certify anything about runtime (that needs step 4),
        cannot certify the arity closure unconditionally (that needs HEUR-ARITY), and
        cannot say anything at all about merge DAGs or mixed arity.
      nearby_object_control: >-
        The nearby object is the merge DAG, for which the conclusion of (C1) is FALSE by
        construction: a DAG that reuses one auxiliary value in two parents has fewer
        internal nodes than t-1 and hence fewer auxiliary variables. Running the (C1)
        argument on DAGs must FAIL, and the point where it fails must be identifiable --
        it is the slot-counting identity, which charges each non-root internal node
        exactly two appearances (once as a child, once as a self-slot) and is false when
        a node has two parents. If the argument as written survives on DAGs, it is not
        using the tree hypothesis and is therefore wrong. This is the proves-too-much
        control for the record's central theorem and it costs one paragraph.
    proof_obligations:
      - >-
        Write out (C1) as a lemma with the slot-counting identity
        3(t-1) = t + 1 + 2(t-2) made explicit, so the place the tree hypothesis enters
        is visible. Half a page. DISCHARGED informally by the enumeration; the written
        proof is still owed because the enumeration checks t <= 8 and the claim is for
        all t.
      - >-
        Write out (C2) as a one-line corollary of (C1) and Section 4.2's cost
        expression, quoting the paper's expression verbatim so the corollary is about
        the paper's model and not a paraphrase of it.
      - >-
        Write out (C5): that restricting an S_3 slot to a k-dimensional F_2-subspace is
        a linear substitution and therefore cannot increase deg_{F_2} of the coordinate
        Boolean functions, hence Semaev's d_ff = 4 derivation applies to every
        three-variable block regardless of how many of its slots are leaves. This is
        the only step of (C5) that is not pure counting and it is NOT YET DISCHARGED --
        a linear substitution can lower deg_{F_2}, and Semaev's derivation uses an
        EQUALITY (deg_{F_2} x_1 S_3 = 3, not <= 3) to exhibit the degree fall, so a
        substitution that lowers the degree could in principle destroy the exhibited
        syzygy rather than preserve it. This is the record's weakest proof step and it
        must be checked before (C5) is asserted.
      - >-
        Run the DAG known-false control and record where the argument breaks.
      - >-
        Either discharge HEUR-ARITY by measurement at j = 3 or restate (C6) as
        conditional in its headline. It is currently conditional in its statement and
        the conditional must not be dropped in any summary.
    not_applicable_reason: null
  dominated_by:
    status: >-
      DOMINATED, and the domination is the point: there is nothing on the topology axis
      to be non-dominated about. The record's value is the closure, not a position.
    checked_rows:
      - >-
        Semaev's own path, eq. (5): the baseline. Under sigma_top it is beaten by 16.8
        percent at t = 8 by the caterpillar-with-cherry; under Semaev's own charged cost
        it is TIED with every other binary merge tree exactly, by (C2). So on the axis
        the record examines, the best available result is a tie in the model that matters
        and a 17 percent monomial saving in one that may not. Time, memory and
        data/queries all identical by (C1).
      - >-
        Parallel Pollard rho (KN-TECH-006, KN-LIT-012): 2^{n/2} time, O(1) memory, 0
        queries, linear parallel speedup. Dominates the construction this record is a
        component of, on memory at every n where Semaev's stage 1 is claimed faster
        (2^{186.0} time / 2^{48} relations at n = 571 against rho's 2^{285.5} time /
