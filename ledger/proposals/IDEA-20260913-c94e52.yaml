  assumptions:
    - >-
      Standalone combinatorics and derivations only. No deployed target, no private
      key, no claim about the security of any FIPS PUB 186-4 binary curve in either
      direction.
    - >-
      A "chaining topology" means a full binary merge tree over the t factor-base
      x-coordinates with the root's value fixed to R_X and one S_3 equation per internal
      node. This is the class the goal's premise ranges over (path versus balanced
      tree). Non-tree presentations -- systems with cycles, systems with more equations
      than internal nodes, systems mixing S_3 with S_4 at different nodes -- are OUTSIDE
      the class, and (C1) is not claimed for them. The arity generalisation in (C6) is
      the one extension considered, and it is considered as a separate axis.
    - >-
      The slot-size proxy sigma_top is a proxy for GROEBNER INPUT SIZE, not for solve
      time. It is used to show that the topology axis is bounded, not to predict a
      runtime. (C2) is the load-bearing statement and it needs no proxy at all.
    - >-
      (C6) uses Semaev's own citation of the bound m^2 + 1 for the first fall degree of
      the Boolean system from S_{m+1}. That bound is a worst case; if the true
      first-fall degree of a j-ary node were much smaller than j^2 + 1 the arity
      conclusion would soften. This is stated as a heuristic (HEUR-ARITY) rather than
      absorbed.
