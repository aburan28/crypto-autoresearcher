idea:
  id: IDEA-20260816-bfa08e
  question_id: RQ-AEADC-8db132
  added: '2026-08-16'
  title: 'Count the mode''s commitment budget before touching a primitive: express an AEAD composition
    as a dataflow of adversary-controlled variables against target-imposed constraints, derive one
    integer per mode that predicts how many colliding-context solutions exist, and check that integer
    against exhaustive search on toy analogues'
  class: theory
  claim: '(A) A mode''s exposure to context-collision is, at the accounting level, a difference of
    two integers: the number of degrees of freedom an adversary controls in the mode''s inputs and
    intermediate values while holding the ciphertext fixed, minus the number of independent constraints
    that a declared commitment target imposes. Call that difference the mode''s commitment budget.
    The claim is that this integer is computable symbolically, in zero compute, from a dataflow description
    of the composition with the primitive slot occupied by an ideal permutation, and that it predicts
    the base-two logarithm of the expected number of colliding contexts to within a stated additive
    slack. (B) The budget is a property of the MODE, not of the primitive: replacing the block cipher
    by an ideal permutation is the modelling assumption under which the count is derived, so a mode
    whose measured collision count matches its budget under an ideal permutation but not under a real
    primitive has told you something about the primitive, and the record reports that separation rather
    than merging it. (C) The budget is validated, not asserted: for a family of toy modes small enough
    to search exhaustively, the predicted budget is written down BEFORE the search, and the measured
    base-two logarithm of the solution count is compared against it. The deliverable is the table
    of predicted-versus-measured pairs across the family, and the residual slack. (D) NOT CLAIMED:
    no certificate at standard parameters, which is the separate business of records already filed
    under this question; no attack, break or security consequence; no assertion that a positive budget
    implies a feasible attack, since the budget counts solutions and says nothing about the cost of
    finding one; no claim about any deployed AEAD, since the mode family here is a declared set of
    toy compositions; and no claim about the literature. A budget that fails to predict the measured
    counts is the most useful outcome: it would name, per mode, exactly which constraint the naive
    count treats as independent when it is not, and that dependency is a reusable structural fact.'
  mechanism: 'STAGE 1, zero compute: fix a dataflow language for AEAD compositions -- nodes are primitive
    calls, XORs, field multiplications and concatenations; edges carry blocks; sources are key, nonce,
    associated data and message; sinks are ciphertext and tag. Express each member of a declared toy
    mode family in this language. STAGE 2, zero compute: for a declared commitment target -- say,
    two distinct (key, nonce, associated data) contexts opening one ciphertext-tag pair to two valid
    plaintexts -- write the system of constraints the target imposes on the dataflow, and count the
    adversary-controlled variables and the independent constraints separately, giving a predicted
    budget per mode. Record the counts and the independence argument with a file hash before any search.
    STAGE 3: implement each toy mode with a seeded ideal permutation in the primitive slot at a width
    where the entire solution space is enumerable. STAGE 4: search exhaustively for colliding contexts,
    count solutions exactly, and compare the base-two logarithm of the count against the predicted
    budget. STAGE 5: repeat one mode with a pinned real primitive, and report any divergence as a
    primitive property rather than a mode property. STAGE 6: run the null arm -- a mode whose dataflow
    makes the budget negative by construction, which must yield zero solutions -- and a positive control
    whose budget is large, which must yield many. Refutation: measured counts that do not track predicted
    budgets across the family.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read RQ-AEADC-8db132 in full, including all four targets and the claim_tier_ceiling.
      Read RQ-POLYMAC-7c89e4 in full. Read the title, class and claim head of every one of the eight
      proposals filed under RQ-AEADC-8db132, and read IDEA-20260809-47a08e in full as the nearest
      control-class neighbour. Grepped ledger/proposals/ and knowledge/ for: ideal permutation, ideal
      cipher, lazy sampl, key commitment, partitioning oracle, generic composition, encrypt-then-mac.
      Read docs/inventor-protocol.md sections 1-5 and section 8, whose method-ceiling and quantifier-order
      audits are directly applicable here.'
    results: 'The ideal-permutation grep matched IDEA-20260808-83b3ba, IDEA-20260808-bfee7e and IDEA-20260731-006
      outside this bucket, identified by filename only, plus knowledge literature notes KN-LIT-7129,
      KN-LIT-4478, KN-LIT-2819 and KN-LIT-5570. The generic-composition grep matched only IDEA-20260809-47a08e
      inside this bucket, whose encrypt-then-MAC construction is used as a reduction-based null object
      for a certificate harness rather than as a counted dataflow. Every AEADC proposal on record
      constructs, measures the cost of, or controls for CERTIFICATES: IDEA-20260809-313546, 3a5c29,
      33f26f, 3da508, 439aa8, 4719b8, 47a08e, 44b750. None computes a symbolic budget in advance and
      tests it against an exhaustive count. RQ-AEADC-8db132''s third target -- the repair audit, mapping
      each construction to the precondition it removes -- is the nearest thing in the question record,
      and it is a table of preconditions rather than a variable-versus-constraint count.'
    verdict: 'UNVERIFIED. Degrees-of-freedom counting against constraint systems is an entirely standard
      technique in cryptanalysis outside this repository, and nothing is asserted about published
      applications of it to AEAD commitment; the mode family here is declared internally and no result
      is attributed. What is claimed new is internal and specific: this repository holds no symbolic
      budget for any mode, and its AEADC records go straight to certificate construction without an
      accounting layer that could be wrong in a checkable way. Assembled from known parts: dataflow
      description of a composition, variable-versus-constraint counting, the ideal-primitive substitution
      this bucket''s directive names, and the pre-registration discipline of inventor-protocol sections
      3 and 8.'
  object_first_candidate:
    tracked_object: 'The constraint system itself: the bipartite structure of adversary-controlled
      variables against target-imposed equations induced by the mode''s dataflow, carried as a variable
      list, an equation list, and the incidence between them, with the primitive treated as an oracle
      whose outputs are fresh variables subject to consistency equations.'
    lossiness: 'Lossy, deliberately and heavily. Everything about the primitive''s internal structure
      is discarded -- an ideal permutation contributes only fresh variables and injectivity constraints
      -- and so is every actual byte value; only the incidence structure survives. Dimension falls
      from the full input space of the mode to a pair of small integers plus an incidence graph. The
      discard is compatible with the mode''s operation because the target''s satisfiability, at the
      counting level, depends on the incidence structure and not on the values, which is exactly the
      modelling assumption being tested rather than assumed: if the measured counts do not track the
      predicted budgets, the discard was not compatible and the record says so. The retained part
      propagates deterministically under composition of dataflow fragments, since variables and equations
      add.'
    propagation: One step of the target operation is composing one more mode fragment -- another block
      processed, another associated-data component absorbed, another primitive call. It acts on the
      tracked object by adding a fixed number of variables and a fixed number of equations, both readable
      off the fragment, so the budget changes by a per-fragment delta that is itself an integer. This
      additivity is the whole reason a budget can be computed by inspection, and it is also the most
      likely place for the accounting to fail, because two fragments can impose equations that are
      individually independent and jointly dependent.
    survival_score: The accounting survives while the per-fragment deltas remain independent. Concretely,
      survival is reported as the largest number of composed fragments at which the predicted budget
      still matches the exhaustively measured base-two logarithm of the solution count to within the
      declared additive slack of one bit, per mode in the family. Expected to hold for two or three
      fragments and to fail somewhere beyond, and the failure point is the deliverable.
  null_object_control: 'Two arms in the same invocation. NULL ARM: a mode in the declared family whose
    dataflow is constructed to make the budget negative -- more independent constraints than controlled
    variables -- which must return exactly zero colliding contexts under exhaustive search. If it
    returns any, the constraint count is wrong and the whole accounting is void. POSITIVE CONTROL:
    a mode whose budget is large and positive, which must return a solution count whose logarithm
    matches the budget within slack; if it returns none, the search is broken and every zero reported
    elsewhere is uninformative. The pair calibrates the accounting from both sides, and both run against
    the identical exhaustive searcher.'
  discriminated_from:
  - IDEA-20260809-313546 derives a two-key GCM certificate from the authenticator's linear structure
    at full standard parameters. That produces a witness for one specific mode; this produces an integer
    predicting how many witnesses exist, for a family, before any is constructed, and can be falsified
    by a count rather than by a failure to find one.
  - IDEA-20260809-33f26f measures the k-way collision cost curve. That is a cost measurement for an
    attack that is assumed to work; this is a satisfiability count that does not speak about cost
    at all and explicitly refuses to.
  - IDEA-20260809-47a08e uses a reduction-based construction as a null object for the certificate
    harness. Here the null is a mode with a negative budget by construction, which is a statement
    about counting rather than about a reduction, and it is falsifiable by exhaustive search inside
    the run.
  - RQ-AEADC-8db132's repair-audit target maps each committing construction to the precondition it
    removes. That is a table of qualitative preconditions; this is a per-mode integer with a pre-registered
    value and a measured comparison.
  - Generic degrees-of-freedom counting as practised in symmetric cryptanalysis. This record is an
    instance of that technique, not a new one, and its contribution is the pre-registered comparison
    against exhaustive counts on a declared toy family -- which is precisely the step that turns the
    technique from a heuristic into something falsifiable.
  assumptions:
  - An ideal permutation in the primitive slot contributes fresh variables and injectivity constraints
    only; this is the modelling assumption under which the budget is derived and it is checked, not
    assumed, by the real-primitive arm.
  - Constraints counted as independent are independent; this is the single most fragile assumption
    in the record and is exactly what the exhaustive comparison tests.
  - The toy mode family is expressible in the declared dataflow language without loss, so the budget
    is computed from a faithful description.
  - Widths small enough for exhaustive search preserve the incidence structure, since the structure
    is combinatorial and does not depend on block width.
  - The declared commitment target is stated as a formal system of equations before any search, so
    the constraint count is not adjusted after seeing results.
  predictions:
  - metric: absolute difference between predicted budget and measured base-two logarithm of the solution
      count, per mode, at fragment depth 1
    direction: lower
    minimum_effect: 1.0
  - metric: solution count of the negative-budget null mode
    direction: different
    minimum_effect: 0
  - metric: solution count of the large-positive-budget positive control
    direction: higher
    minimum_effect: 1
  - metric: fragment depth at which the absolute prediction error first exceeds one bit
    direction: different
    minimum_effect: 'explicit refusal to pre-commit: naming the depth in advance would require knowing
      which pair of fragments first imposes jointly dependent equations, which is the unknown the
      run exists to locate'
  - metric: difference between solution counts under the ideal permutation and under the pinned real
      primitive at matched parameters
    direction: lower
    minimum_effect: 1.0
  minimal_test:
    design: One process, most of the intellectual work at zero compute. Declare a family of six toy
      AEAD compositions in the dataflow language, spanning fragment depths one to three and including
      one negative-budget null and one large-positive-budget control. For each, count controlled variables
      and independent constraints by hand, write the predicted budget, and hash the file. Implement
      each mode over 8-bit blocks with a seeded ideal permutation, and search the entire context space
      exhaustively -- all (key, nonce, associated-data) triples within the declared bound -- counting
      exactly the colliding contexts that satisfy the target. Compare the base-two logarithm of each
      count against its predicted budget. Then rerun the deepest mode with a pinned real primitive.
      The discriminating comparison is the predicted-versus-measured table across the family, floored
      by the null mode's required zero and calibrated by the control's required nonzero. Total compute
      is under an hour on one core; the budget derivation is the expensive part and costs nothing
      but attention.
    controls:
    - Negative-budget null mode, exhaustively searched in the same invocation, which must return zero
      solutions.
    - Large-positive-budget positive control, which must return a solution count matching its budget
      within slack.
    - Pre-registered budget file, hashed before the searcher runs, so no constraint count can be adjusted
      after seeing counts.
    - Exhaustive rather than sampled search, so the measured count carries no sampling error to confound
      the comparison.
    - Real-primitive arm at the deepest mode, separating a mode result from a primitive result.
    - Independent recount of one mode's variables and constraints by a second derivation written from
      the dataflow alone.
    required_metrics:
    - predicted budget per mode, recorded before the run
    - exact solution count per mode from exhaustive search
    - absolute prediction error in bits per mode
    - fragment depth at which prediction error first exceeds one bit
    - solution count of the null mode and of the positive control
    - solution-count difference across primitive slots at the deepest mode
  falsification_conditions:
  - The negative-budget null mode returns a nonzero solution count, which means the constraint count
    is wrong and the accounting is void as stated.
  - The positive control returns zero solutions, which means the exhaustive searcher is broken and
    every zero reported is uninformative.
  - Prediction error exceeds one bit at fragment depth 1 for a majority of the family, which retires
    the additivity claim at its easiest case.
  - Predicted budgets and measured counts show no rank correlation across the family, which means
    the budget is not tracking the quantity it claims to track.
  - The real-primitive arm differs from the ideal-permutation arm by more than one bit, which relocates
    the effect to the primitive and out of the accounting.
  - The second independent derivation of one mode's counts disagrees with the first, indicating that
    the dataflow language is ambiguous rather than that the accounting is wrong.
  confounders:
  - Hidden dependence among constraints is the whole risk and will look exactly like a wrong budget;
    distinguishing the two requires the second independent derivation and an explicit rank listing
    of the constraint system, which is recorded.
  - Small block width can make the ideal permutation's injectivity constraints binding in a way they
    would not be at larger widths, inflating measured counts.
  - Exhaustive search over contexts within a declared bound can miss solutions outside the bound,
    so the bound is reported with every count.
  - A dataflow language that cannot express a mode faithfully silently changes the budget being tested.
  - Choosing the toy family after having intuitions about which modes collide would bias the whole
    table, which is why the family and the budgets are hashed together before the searcher exists.
  interpretation_limits:
  - The budget counts solutions, not the cost of finding one; a positive budget implies nothing about
    feasibility and this record makes no feasibility claim.
  - Every number is a statement about the declared toy family at the tested widths, and transfers
    to no standard-parameter mode without a separate argument.
  - 'A budget that predicts well on this family is evidence about the accounting method on this family
    only, and inventor-protocol section 8''s method-ceiling audit applies: the method''s ceiling is
    a count, and it cannot distinguish two modes with identical incidence structure and different
    algebra.'
  target_complexity:
    time_exponent: No attack exponent is claimed. The exhaustive search costs O(size of the declared
      context space) mode evaluations per mode, which is chosen small enough to complete.
    memory_exponent: No attack exponent is claimed. Memory is O(number of solutions recorded plus
      the constraint system), both small by construction.
    best_known: 'The incumbent is direct certificate construction for a specific mode, as pursued
      by IDEA-20260809-313546 within this same question. This record does not beat it and does not
      compete with it: it supplies the accounting layer that would say in advance which modes are
      worth attacking, and its value is that it can be shown wrong cheaply.'
    hidden_overhead: 'The human cost dominates entirely: writing a dataflow language that is unambiguous,
      and an independence argument for each constraint set, is days of careful work, and every ambiguity
      is a place the run measures the derivation rather than the mode. Lower-order compute hides in
      the exhaustive search at fragment depth 3, where the context space grows fastest.'
  dominated_by: 'n/a (no result claimed). No attack is proposed, so no time, memory or query frontier
    row applies. Checked against all four targets of RQ-AEADC-8db132, all eight proposals filed under
    it, and all four targets of RQ-POLYMAC-7c89e4: the nearest rows are certificate construction and
    the k-way cost curve, and neither is on a frontier this could dominate or be dominated by, because
    this record produces a satisfiability count rather than an attack cost.'
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverable is
    a six-row table of predicted budget against exhaustively measured log solution count, with per-mode
    prediction error in bits and a located additivity failure depth, where the corpus currently holds
    no accounting layer at all.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'By part, and the parts differ sharply. That the negative-budget null
    returns zero: about 0.85, since it is constructed to be over-constrained, and a nonzero there
    would be the single most informative failure in the record. That the positive control returns
    a nonzero count: about 0.95. That the predicted budget matches the measured log count within one
    bit at fragment depth 1: about 0.75, because at depth 1 constraint independence is nearly checkable
    by inspection. That it still matches at depth 3: about 0.35, since joint dependence between fragments
    is exactly what additive counting misses and I expect the failure to be located rather than avoided.
    That the predicted budgets at least rank-correlate with measured counts across the family: about
    0.7, and this is the weakest claim the record could retreat to while still being useful.'
