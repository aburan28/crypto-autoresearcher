idea:
  id: IDEA-20260816-2b2ccd
  question_id: RQ-MCE-b38a8b
  added: '2026-08-16'
  title: 'Count the fibre instead of assuming it: for a fixed toy Goppa public code, measure how many
    distinct secret parametrisations (L, g) generate exactly the same GF(2) row space, by exhaustive
    enumeration at the smallest field and by a bounded Monte Carlo collision search above it, and
    compare the measured count against the orbit size of the declared trivial-equivalence group.'
  class: representation
  claim: '(A) RQ-MCE-b38a8b''s constraints require that ''the exact trivial-equivalence quotient is
    frozen before searching for a dual representation'' and that ''a publicly computable relabeling
    is a positive control and cannot satisfy the constructive criterion''. Freezing a quotient is
    a declaration; whether the declared quotient is the WHOLE fibre of the parametrisation map is
    an empirical question that the record does not answer and that nothing in this repository measures.
    (B) The fibre is directly measurable at toy scale in two complementary ways. EXACT: at m = 3 with
    n = 8 and t = 2, the number of ordered supports is at most 8! = 40320 and the number of monic
    degree-2 polynomials over GF(8) is 64, so all 2.6 million parametrisations can be constructed
    and grouped by the row space they generate, giving an exact fibre size for every realised public
    code. BOUNDED: at m in {4,5} exhaustive enumeration is infeasible, so the declared group orbit
    is computed exactly by acting and de-duplicating, and a Monte Carlo search draws millions of independent
    (L, g) and counts how many land on the target row space, yielding a one-sided confidence upper
    bound on the density of collisions OUTSIDE the declared orbit. (C) NOT CLAIMED: this is not a
    key-recovery attack, not a search algorithm for secret keys, and not a statement that any parametrisation
    is easy or hard to find. A fibre count is a counting fact about a map at toy parameters; it bounds
    nothing about search cost at any parameter set, and it is explicitly NOT offered as a reduction
    of any key space. RQ-MCE-b38a8b''s toy-and-defensive ceiling applies unchanged. (D) The exact
    arm is degenerate in a way that must be stated up front: at m=3, n=8, t=2 the dimension is k =
    8 - 6 = 2, which is a very small code, so its fibre statistics are dominated by smallness rather
    than by Goppa structure. That degeneracy is why the Monte Carlo arm exists and why the exact arm
    is reported as a sanity check on the group action rather than as the headline.'
  mechanism: 'STAGE 1: declare and implement the trivial-equivalence group explicitly. The declared
    generators are: the substitutions a -> alpha*a + beta on the support with the corresponding transformation
    of g, scaling of g by a nonzero constant, the Frobenius automorphisms of GF(2^m) applied to both
    L and g, and reordering of L that induces a column permutation on H2. The declared group is whatever
    this generating set produces, computed by closure, and it is FROZEN and named -- the point is
    to measure the fibre against a stated object, not against folklore. STAGE 2: compute the orbit
    exactly. Act with every generator combination on a fixed (L, g), canonicalise each resulting code
    as a reduced row-space basis, and de-duplicate; the number of distinct codes and the number of
    distinct parametrisations mapping to the reference code give the orbit''s contribution to the
    fibre exactly. STAGE 3 (exact arm, m=3): enumerate all (L, g) with L an ordered 8-subset of GF(8)
    and g monic of degree 2, reject those with a root in L, construct H2, canonicalise, and build
    the full map from parametrisations to codes as a dictionary. Read off the exact fibre size distribution.
    STAGE 4 (Monte Carlo arm, m in {4,5}): fix a reference code; draw N = 10^7 independent (L, g)
    uniformly, canonicalise, and count hits on the reference row space, classifying every hit as in-orbit
    or out-of-orbit by checking membership in the computed orbit. STAGE 5: report the exact fibre-to-orbit
    ratio at m=3 and a one-sided Clopper-Pearson upper bound on out-of-orbit collision density at
    m in {4,5}. STAGE 6: run the null arms.'
  novelty_status: unverified
  novelty_screen:
    method: Ran grep -ril 'permutation equivalence' and grep -ril 'hull' over ledger/proposals/. Read
      RQ-MCE-b38a8b in full, in particular the candidate_lanes block (DUAL DECODING REPRESENTATIONS,
      seeking two hidden Goppa decoding descriptions 'after quotienting by a pre-declared class of
      field, row and coordinate equivalences') and the constraint requiring the trivial-equivalence
      quotient be frozen with a publicly computable relabeling as a positive control. Read IDEA-20260808-0b3072
      and IDEA-20260808-d935d1, the two proposals bound to RQ-MCEQ-fcb504. Read the claim_tier_ceiling
      of RQ-MCE-b38a8b and its constraint list.
    results: RQ-MCE-b38a8b's dual-representation lane is about finding a SECOND decoding description
      selected by a master secret, after quotienting by a pre-declared equivalence class; its constraint
      requires that quotient be frozen and treats a publicly computable relabeling as a positive control.
      Nowhere does it measure the size of the quotient, and nowhere does any record establish that
      the declared quotient exhausts the fibre. The two RQ-MCEQ-fcb504 proposals concern matrix code
      equivalence, a different action entirely (two-sided A*X*B rather than support reparametrisation).
      No proposal or contract in the repository enumerates parametrisations, counts a fibre, or computes
      an orbit of any group action on any code family. tools/ contains no group-action code.
    verdict: 'UNVERIFIED. That binary Goppa parametrisations are non-unique, and that support substitutions
      relate different (L, g) giving the same code, is standard material about which this record asserts
      nothing external. What is claimed new is local and narrow: RQ-MCE-b38a8b requires a quotient
      to be DECLARED and never asks whether the declaration is complete, and this repository holds
      no fibre count, no orbit computation and no collision search for any code family. The exact
      arm at m = 3 is small enough to be uninteresting on its own and is included precisely because
      it makes the orbit computation checkable against a brute-force ground truth, which is the only
      way to trust the Monte Carlo arm''s classification of hits as in-orbit or out-of-orbit.'
  object_first_candidate:
    tracked_object: 'The fibre of the parametrisation map Phi : (L, g) -> canonical reduced basis
      of the GF(2) row space of H2, i.e. the set of secret parametrisations consistent with one fixed
      public code, together with its partition into declared-orbit and out-of-orbit elements. The
      object followed is that fibre and the two integers describing it: total size and out-of-orbit
      size.'
    lossiness: 'Genuinely lossy, and this proposal is precisely about how lossy. Phi discards the
      ordering of L up to what the column permutation records, discards the field structure entirely,
      and discards g except through its effect on the row space. The fibre IS the loss, quantified:
      |fibre| is exactly the number of distinct inputs the map identifies. A parametrisation map with
      singleton fibres would be a change of coordinates and would mean the public key determines the
      secret uniquely; the whole reason the map is interesting is that its fibres are large, and the
      reason this proposal exists is that the size of that loss has been declared rather than measured.
      The propagation requirement of section 2 is satisfied because the retained object -- the row
      space -- is exactly what every public operation acts on.'
    propagation: 'One step of the target operation, here applying a declared group generator to a
      parametrisation, acts on the tracked object as a permutation of the fibre that fixes the public
      code. Composing generators walks the orbit; the orbit is therefore a subset of the fibre closed
      under the action, and the measured question is whether the containment is equality. Under the
      exact arm the propagation is fully observable: every element of the fibre is constructed, so
      the orbit''s index inside the fibre is an exact integer. Under the Monte Carlo arm propagation
      is observable only through hit classification: each sampled collision is tested for membership
      in the computed orbit by canonical form, and the count of out-of-orbit hits is the estimator.
      The map''s behaviour under the operation is thus the entire measurement, not an incidental property
      of it.'
    survival_score: 'The exact arm survives only at m = 3 with n = 8, t = 2, where 2.6 million parametrisations
      are enumerable; at m = 4 with n = 16 the ordered-support count alone is 16! which is about 2
      x 10^13 and the exact arm dissolves completely. The Monte Carlo arm survives at m in {4,5} and
      yields not a count but a one-sided bound whose tightness is set by N: with N = 10^7 draws and
      zero out-of-orbit hits the 95 percent upper bound on out-of-orbit density is about 3 x 10^-7,
      which is a real and stateable number and is all this method can give. The exact statement of
      what survives and what does not is the deliverable''s honest boundary, and it is reported as
      those two numbers rather than as a claim about fibres in general.'
  null_object_control: 'Two nulls run in the same invocation. (1) RANDOM-CODE NULL: fix a random binary
    [n, k] code that is NOT in the image of Phi, and run the identical Monte Carlo collision search
    against it with the same N draws. The null must show ZERO hits: a parametrisation cannot generate
    a code outside the image, so any hit indicates a canonicalisation bug and voids the whole run.
    This is a strong, cheap correctness gate. (2) RANDOM-ALTERNANT NULL: run the identical fibre measurement
    on a random alternant code with a uniform multiplier, whose declared trivial-equivalence group
    is the same. If the alternant arm''s out-of-orbit collision bound is indistinguishable from the
    Goppa arm''s, then whatever is measured is a property of the alternant parametrisation and not
    of the Goppa specialisation, and every number must be labelled accordingly. For the exact arm
    at m = 3, the ground-truth fibre computed by brute force is itself the control on the orbit computation:
    the orbit must be a subset of the enumerated fibre, exactly, and any element of the orbit not
    in the fibre is a bug.'
  discriminated_from:
  - 'RQ-MCE-b38a8b''s own constraint that the trivial-equivalence quotient be frozen: that requires
    a DECLARATION and treats a publicly computable relabeling as a positive control. This proposal
    measures whether the declaration exhausts the fibre, which the record does not ask and no committed
    artifact answers.'
  - 'IDEA-20260808-0b3072 and IDEA-20260808-d935d1: both concern matrix code equivalence under the
    two-sided action A*X*B, a different group acting on a different object. Nothing here transfers
    to that action and nothing there transfers to this one.'
  - 'Proposal 4 of this set (equivalence-tester calibration): measures the error rate of a decision
    procedure on random codes; this counts a fibre of a parametrisation map on structured codes. Different
    question, different output type.'
  - 'A key-recovery search: explicitly not that. This proposal samples parametrisations uniformly
    and counts collisions with a KNOWN reference; it never searches for an unknown secret and its
    Monte Carlo arm would be a hopeless search algorithm by construction.'
  - 'EXP-MCE-3ffdf9: relates Gamma(L,g) to Gamma(L,g^2) for one fixed L, which is a specific identity
    between two parametrisations. This proposal counts the whole fibre and would, if run, observe
    such identities as fibre elements rather than assert them.'
  assumptions:
  - The declared trivial-equivalence generating set is stated in advance and its closure is computable
    at these sizes; the measurement is against THAT declared group and changing the declaration changes
    every reported ratio.
  - Canonicalisation of a code to a reduced row-space basis is exact and deterministic, so that code
    equality is decided by byte comparison; this is checked by the random-code null.
  - At m = 3, n = 8, t = 2 the resulting k = 2 code is degenerate and its statistics are dominated
    by smallness; the exact arm is used to validate the orbit machinery and NOT as evidence about
    Goppa fibres generally.
  - Uniform sampling over ordered supports and monic squarefree g is the right measure for the Monte
    Carlo arm; a different measure would give a different density and the choice is frozen and stated.
  - 10^7 draws are affordable in pure Python at m in {4,5} within the compute budget; if not, the
    reported bound simply loosens and is reported at the achieved N.
  predictions:
  - metric: 'at m=3, n=8, t=2: exact fibre size divided by declared-orbit size, for every realised
      public code'
    direction: different
    minimum_effect: 'forced value: exactly 1 if the declared group exhausts the fibre. Any value strictly
      greater than 1 is a measured extra collision class and is the single most interesting outcome
      this contract can produce.'
  - metric: orbit elements not contained in the enumerated fibre at m=3
    direction: lower
    minimum_effect: 'forced value: exactly 0. The orbit is by construction inside the fibre; any exception
      is a bug in the group action or the canonicalisation.'
  - metric: hits of the Monte Carlo search against a random code outside the image of Phi
    direction: lower
    minimum_effect: 'forced value: exactly 0. A nonzero count voids the run.'
  - metric: 95 percent one-sided upper bound on out-of-orbit collision density at m=4, n=16, t=2 with
      N = 10^7
    direction: lower
    minimum_effect: 'explicit refusal to pre-commit a value: the bound is determined by the achieved
      N and the observed hit count, and pre-committing it would be pre-committing the observation.
      The pre-registered content is the METHOD and that the bound is reported with its N.'
  minimal_test:
    design: 'The exact arm at the smallest field is both the cheapest test and the validation of everything
      above it. Take m = 3, GF(8) from x^3+x+1, t = 2, n = 8 so L is an ordering of the whole field.
      Enumerate all 8! = 40320 orderings and all 64 monic degree-2 polynomials, reject any g with
      a root in L (here L is the whole field, so g must be irreducible, leaving a small set), construct
      H2 for each surviving parametrisation, canonicalise to a reduced basis, and build a dictionary
      from canonical code to the list of parametrisations producing it. That gives every fibre exactly.
      Separately compute the declared group''s orbit of one reference parametrisation by closure under
      the generators. Compare: the orbit must sit inside the fibre exactly, and the ratio of sizes
      is the headline. Cost is a few minutes in pure Python and the entire result is exact -- no sampling,
      no interval. The discrimination: if the orbit does not sit inside the fibre, the group action
      or the canonicalisation is wrong, and the Monte Carlo arm at larger m would silently inherit
      that error.'
    controls:
    - 'Random-code null: Monte Carlo search against a code outside the image of Phi, which must yield
      zero hits.'
    - Random-alternant arm with the same declared group, as the competing-family explanation.
    - 'Brute-force ground truth at m = 3: the orbit must sit exactly inside the enumerated fibre.'
    - 'Canonicalisation determinism check: the same code presented under a random invertible row operation
      must canonicalise identically.'
    - 'Generator-ablation control: recompute the orbit with one declared generator removed, to show
      each generator contributes and the declared group is not over-specified.'
    required_metrics:
    - exact fibre size per realised code at m=3
    - declared-orbit size
    - fibre-to-orbit ratio at m=3
    - Monte Carlo hit count, in-orbit and out-of-orbit, per reference code
    - achieved N and the one-sided upper bound on out-of-orbit density
    - random-code null hit count, required zero
    - canonicalisation determinism failures, required zero
  falsification_conditions:
  - Any orbit element not contained in the enumerated fibre at m=3 falsifies the group action or the
    canonicalisation.
  - Any hit of the Monte Carlo search against a code outside the image of Phi voids the run.
  - Canonicalisation not invariant under a random invertible row operation falsifies the equality
    test on which everything rests.
  - A fibre-to-orbit ratio strictly greater than 1 at m=3 that does NOT replicate across reference
    codes is an artefact of the degenerate k=2 setting and must not be reported as a structural finding.
  - A generator whose removal does not change the orbit size shows the declared group is over-specified
    and the declaration must be corrected before any ratio is reported.
  - An alternant arm with an identical bound forbids any Goppa-specific reading of the result.
  confounders:
  - 'The exact arm''s cell is degenerate: k = 2 at m=3, n=8, t=2, so fibres are large for reasons
    of smallness and its ratio is not representative of anything larger.'
  - The declared generating set determines the orbit and hence every ratio; a differently declared
    group would give a different answer to the same question, so the result is conditional on a declaration.
  - Uniform sampling over parametrisations is a measure choice and the reported density is relative
    to it.
  - Monte Carlo with zero observed hits gives only an upper bound, which is easy to over-read as an
    absence; the bound must always be reported with its N.
  - At m=4 with n < 2^m the support is a subset and the sampling space differs in shape from the full-field
    case, so the two must not be pooled.
  interpretation_limits:
  - A fibre count is a counting fact about a map at toy parameters and bounds nothing about the cost
    of finding a parametrisation at any scale; it is explicitly not a key-space reduction.
  - Every ratio is conditional on the declared trivial-equivalence group and is meaningless without
    it stated alongside.
  - The exact arm's cell is degenerate and validates machinery rather than establishing structure.
  - An upper bound with zero observed hits is not evidence of absence and must never be quoted as
    'the declared group is the whole fibre'.
  target_complexity:
    time_exponent: No attack exponent is claimed. The exact arm costs O(n! * q^t) constructions and
      is affordable only at m=3; the Monte Carlo arm costs N constructions and canonicalisations.
      No adversary is constructed and no search problem is solved.
    memory_exponent: No attack memory exponent is claimed. Peak memory is the m=3 dictionary from
      canonical codes to parametrisation lists, at most a few million small entries, with a hard cap
      and a switch to on-disk grouping if exceeded.
    best_known: 'There is no incumbent within this repository: no fibre count, orbit computation or
      collision search exists for any code family. Outside it, the non-uniqueness of Goppa parametrisations
      is standard material about which this record asserts nothing.'
    hidden_overhead: 'Hidden in the declaration: the reported ratio is only as meaningful as the declared
      generating set, and getting that declaration right is judgement work that no amount of compute
      fixes. Hidden in the canonicalisation: an inexact code-equality test would inflate or deflate
      every count silently, which is why the random-code null and the row-operation invariance check
      are gates rather than diagnostics.'
  dominated_by: 'n/a (no result claimed). Pareto check applies vacuously: no adversary is constructed,
    no search algorithm is proposed, and no cost figure for any attack is produced, so there is no
    time/memory/data frontier row to occupy. The Monte Carlo arm is deliberately a hopeless search
    procedure and is not offered as one.'
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitative delta: zero fibre
    counts, zero orbit computations and zero collision bounds in this repository before; after, an
    exact fibre-to-orbit ratio at m=3 and a stated one-sided out-of-orbit density bound at m in {4,5}
    with its achieved sample size.'
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: P(the orbit sits exactly inside the enumerated fibre at m=3, validating
    the group action and canonicalisation) = 0.75; this is the gate and the most likely failure is
    a canonicalisation subtlety. P(the exact fibre-to-orbit ratio equals 1, i.e. the declared group
    exhausts the fibre) = 0.4 -- deliberately not high, because the m=3 cell is degenerate and small
    codes accumulate accidental coincidences; a ratio above 1 there would most likely be a smallness
    artefact rather than a structural finding, which is why replication across reference codes is
    a falsification condition. P(the Monte Carlo arm reaches N = 10^7 in pure Python within budget)
    = 0.5. P(the alternant arm is indistinguishable from the Goppa arm) = 0.7, meaning the most likely
    outcome is a result about alternant parametrisation rather than about Goppa specialisation.
