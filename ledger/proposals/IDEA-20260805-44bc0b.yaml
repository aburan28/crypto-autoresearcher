idea:
  id: IDEA-20260805-44bc0b
  question_id: RQ-RELN-001
  added: '2026-08-05'
  goal_id: GOAL-PATH-001
  title: >-
    The bounded-degree factor-base no-go does not turn on "algebraic
    description" at all - it turns on a single scalar, the coverage exponent
    chi = m*log(Delta)/log(N) - and the two index-calculus families that
    demonstrably work, NFS and Gaudry-Diem, both sit at chi = 1 EXACTLY, which
    is the nearby-object control KN-OPEN-020 has never been given
  class: theory

  claim: >-
    GOAL-PATH-001's objective is to pave a path to a charged prime-field ECDLP
    complexity reduction "or close the remaining algebraic and relation-supply
    routes with scoped evidence". The strongest existing closure in that
    direction is the bounded-degree algebraic factor-base theorem
    (ideas/artifacts/IDEA-20260801-021/bounded_degree_factor_base_theorem.md,
    READ IN FULL this session) and its open universal form KN-OPEN-020, "Can one
    prove that EVERY algebraically described factor base over a generic
    prime-field elliptic-curve subgroup fails to yield a subexponential
    index-calculus algorithm" (READ, verbatim).
    THE AUDIT IS ONE LINE OF COUNTING. Theorem 1G's operative hypothesis is
      Delta_p^{m_p} <= N^{1-epsilon}.
    Define the COVERAGE EXPONENT
      chi := m * log(Delta) / log(N) = log(Delta^m) / log(N),
    so that the hypothesis is EXACTLY chi <= 1 - epsilon and nothing else.
    Now evaluate chi on the closest objects where the hoped-for conclusion is
    KNOWN FALSE - families that are index calculus, do have factor bases, and do
    achieve subexponential or sub-rho cost:
      * NUMBER FIELD SIEVE, rational side. Factor base = rational primes <= B,
        so |F| = pi(B) ~ B/ln B; the relation arity is not bounded independently
        of the target, it is m = log(M)/log(B) = u, the smoothness ratio itself.
        Hence chi = u * log(B) / log(M) = 1, IDENTICALLY, FOR EVERY B. Not
        approximately, not asymptotically: by the definition of B-smooth.
      * GAUDRY/DIEM over E(F_{q^n}). Factor base = {P : x(P) in F_q}, so
        |F| ~ q; arity m = n; N ~ q^n. Hence chi = n*log(q)/(n*log(q)) = 1,
        EXACTLY.
      * THE BOUNDED-DEGREE PRIME-FIELD FAMILY the theorem covers. Bezout gives
        Delta = 3d, m is a fixed integer, N = Theta(p). Hence
        chi = m*log(3d)/log(p) -> 0. Worked cells, computed here:
        m=2, d=10, log2 N=64 gives chi = 0.1533; m=3, d=10 gives 0.2300;
        m=4, d=30, log2 N=256 gives 0.1014; m=2, d=100 at 256 bits gives 0.0643.
    THE CONSEQUENCE IS NOT THAT THE THEOREM IS WRONG. It is that the theorem
    does not, and cannot, separate on the clause everyone reads it as separating
    on. NFS's factor base IS algebraically described (primality and a bound) and
    Gaudry's IS algebraically described (a subfield condition) and BOTH escape,
    not by being non-algebraic, but by having chi = 1. The separating clause is
    the arity-coverage inequality. KN-OPEN-020 as posed - a universal statement
    quantified over "algebraically described" - therefore quantifies over the
    wrong predicate, and any attempt to prove it as posed must fail, because
    NFS is a counterexample to the predicate it names.
    A SECOND, INDEPENDENT SCALAR SEPARATES THE SAME WAY AND EXPLAINS THE
    MECHANISM: the DESCRIPTION DENSITY
      delta := (bits needed to write the factor-base predicate) / |F|.
    A plane curve of degree d over F_p needs (d+1)(d+2)/2 coefficients of
    log2(p) bits, while Bezout caps |F| <= 3d, so
      delta >= [(d+1)(d+2)/2 * log2 p] / (3d) ~ (d/6)*log2(p) bits per element,
    GROWING LINEARLY IN THE FACTOR BASE SIZE. For NFS the entire predicate is
    "prime and <= B", O(log B) bits total, so delta = O(log B * ln B / B) -> 0.
    For Gaudry it is "x in F_q", O(log q) bits total, delta -> 0. That is what
    Bezout is really saying: OVER A PLANE CURVE, A SHORT ALGEBRAIC PREDICATE
    CUTS OUT FEW POINTS. Buying many points costs description length, and the
    theorem's charging obligation then bites on the description, not on the
    membership test.
    THIS PROPOSAL CLAIMS NO ATTACK AND MOVES NO EXPONENT. It proposes a
    zero-compute audit that (a) supplies KN-OPEN-020 with the nearby-object
    control that inventor-protocol section 8 audit 4 requires and that the
    entry has never had, (b) restates the open question on the predicate that
    actually separates, and (c) names three concrete escapes that the corrected
    statement leaves open instead of the zero the current phrasing implies.

  object_first_candidate:
    tracked_object: >-
      The PAIR (chi, delta) - coverage exponent and description density -
      followed through a factor-base construction: ambient object -> membership
      predicate -> factor base F -> arity m -> reachable target set mF ->
      coverage of G -> charged relation supply. The tracked object is the
      predicate's BUDGET, not the points it selects: how much of the target
      group one unit of description buys, and how many description units the
      arity must multiply to reach the whole group.
    established_families_off_limits: >-
      OFF-LIMITS as the primary lens: summation polynomials and Groebner
      solving-degree instrumentation; Semaev/Petit-Kosters relation collection
      as an algorithm to improve; isogeny, endomorphism and CM transfer;
      xedni/lifting; small-root and lattice methods; generic-group lower bounds;
      multi-target amortisation; monodromy/Chebotarev census; decomposition
      probability measurement. None of them is the lens. This proposal does not
      propose or improve any factor base. It AUDITS AN EXISTING NEGATIVE at its
      own named boundary, which is the move inventor-protocol section 4 requires
      of anyone who wants to cite that negative.
    newness_score: >-
      chi is a re-labelling of an inequality that is already written in the
      theorem's own Theorem 1G, and saying so is the honest framing: NOTHING
      NEW IS DERIVED IN THE INEQUALITY. What is new in this corpus is (a)
      evaluating it on NFS and Gaudry-Diem, which the theorem receipt, KN-OPEN-020
      and every record citing them do not do - a repository search this session
      found "number field sieve" nowhere in knowledge/open-problems except
      KN-OPEN-025 (a TNFS Galois-symmetry entry) and nowhere in the
      IDEA-20260801-021 artifact directory; and (b) delta, the description
      density, which does not appear in the corpus at all and which converts
      Bezout from a bound on a point count into a bound on an information rate.
    testability_score: >-
      High and almost free. The whole headline is zero compute. Every claim it
      makes about a family is a counting identity that a reviewer can check by
      hand, and the two empirical stages are exact integer arithmetic in pure
      Python at group sizes below 1000. Measured this session: numpy 2.4.6
      imports; Sage does NOT (ModuleNotFoundError on src/ic_first_fall_fast.py).
      Nothing here needs Sage, Groebner, or a solver.
    survival_score: >-
      chi survives as far as coverage and stops dead there, and the record says
      so before any run: chi = 1 is NECESSARY for a factor base to reach the
      whole group and is NOT SUFFICIENT for anything, because it says nothing
      about the cost of FINDING a decomposition. A uniformly random subset of G
      of size B with m = log N / log B has chi = 1 and is useless. The audit's
      own null object is built to demonstrate exactly that, so the diagnostic
      cannot be oversold later by someone citing this record.

  mechanism: >-
    DERIVED HERE FROM THE THEOREM RECEIPT'S OWN INTERFACE, WHICH WAS READ IN
    FULL. Nothing below is taken from a source that was not opened.

    (1) THE INTERFACE, RESTATED. E/F_p nonsingular plane cubic, G <= E(F_p) of
    prime order N = Theta(p). Z_p a target-independent projective locus with no
    component equal to E and finite intersection degree Delta_p. Factor base
    F subset of G intersect (Ebar intersect Z_p)(F_p). Theorem 1: Bezout gives
    |F| <= Delta_p (for a plane polynomial f of degree d, Delta = 3d). Theorem 2:
    the addition map sigma : F^m -> G has image mF, and an image is no larger
    than its domain, so |mF| <= |F|^m <= Delta^m. Theorem 3: for a target of
    min-entropy log2(N) - C, Pr[T in mF] <= 2^C * Delta^m / N. Theorem 1G's
    hypothesis for the no-go is Delta^m <= N^{1-epsilon}.

    (2) THE ONE-SCALAR REWRITE. Set chi := log(Delta^m)/log(N) = m log Delta /
    log N. Then Delta^m <= N^{1-epsilon} <=> chi <= 1 - epsilon, and Theorem 3's
    success bound reads Pr[T in mF] <= 2^C * N^{chi - 1}. The whole no-go is the
    statement chi < 1, and the whole of Bezout's contribution is that it CAPS
    Delta, hence caps chi for bounded m. This is a rewrite, not a new theorem,
    and its value is entirely that it makes the family comparable to families
    outside the interface.

    (3) NEARBY OBJECT 1 - NFS, WHERE THE CONCLUSION IS KNOWN FALSE. Take the
    rational side. F = {rational primes <= B}, |F| = pi(B) ~ B/ln B. A relation
    is an integer of size ~M that factors completely over F. The arity is NOT a
    fixed constant: an integer of size M that is B-smooth is a product of about
    u = log M / log B factor-base elements (with multiplicity), and u is exactly
    the smoothness parameter the sieve optimises. Substituting m = u and
    Delta = |F| ~ B into chi:
      chi_NFS = u * log(B) / log(M) = (log M / log B) * log B / log M = 1.
    IDENTICALLY 1, FOR EVERY CHOICE OF B, including B = L_M(1/3, c). It is not
    an asymptotic statement; it is what "B-smooth" means. The tighter,
    non-counting version says the same thing: the number of B-smooth integers up
    to M is Psi(M,B) = M*rho(u)(1+o(1)) under the standard Dickman heuristic
    (RECALLED, UNVERIFIED - the value of Psi is MEASURED exactly at toy M in the
    contract rather than cited), so log Psi / log M = 1 + log rho(u)/log M -> 1
    whenever u log u = o(log M), which holds throughout the sieve's parameter
    range. NFS is therefore not merely outside the no-go's hypothesis; it sits
    at the exact boundary the hypothesis excludes, and it sits there by
    construction rather than by luck.

    (4) NEARBY OBJECT 2 - GAUDRY/DIEM, ALSO KNOWN FALSE, AND THIS ONE IS AN
    ELLIPTIC CURVE. Over E(F_{q^n}) with n fixed, take F = {P in E : x(P) in
    F_q}, so |F| ~ q, and decompose a target into m = n factor-base points via
    the summation polynomial S_{n+1}. N ~ q^n. Then
      chi_GD = n * log(q) / log(q^n) = 1, EXACTLY.
    That this family beats rho for n >= 3 is RECALLED, UNVERIFIED and is NOT
    load-bearing here; what is load-bearing is only that it is a real
    index-calculus construction with a real factor base whose chi is 1. Note
    what makes chi = 1 available: the ambient group has a SUBFIELD, so a
    predicate of description length O(log q) selects q points out of q^n. Over a
    PRIME field there is no subfield, and that single structural fact is the
    honest content of the whole difficulty.

    (5) THE BOUNDED-DEGREE PRIME-FIELD FAMILY. Delta = 3d, m fixed, N = Theta(p),
    so chi = m log(3d)/log(p) and chi -> 0 for any fixed (m, d). Computed cells,
    exact: (m=2, d=10, log2 N=64) chi = 0.1533; (m=3, d=10, 64) chi = 0.2300;
    (m=4, d=30, 256) chi = 0.1014; (m=2, d=100, 256) chi = 0.0643. To reach
    chi = 1 at 256 bits with m = 4 one needs 3d >= 2^64, i.e. a plane predicate
    of degree ~6.1e18.

    (6) DESCRIPTION DENSITY, AND WHY IT IS THE MECHANISM RATHER THAN A SECOND
    OBSERVATION. Write |desc(F)| for the number of bits needed to specify the
    membership predicate. For a plane curve of degree d over F_p, |desc| =
    C(d+2,2)*log2(p) = (d+1)(d+2)/2 * log2(p) bits, while |F| <= 3d. Hence
      delta := |desc| / |F| >= (d+1)(d+2) log2(p) / (6d) ~ (d/6) log2(p),
    i.e. the description cost PER FACTOR-BASE ELEMENT grows linearly in d and
    therefore linearly in the largest factor base the predicate could possibly
    define. Pushing chi to 1 by raising d costs delta ~ (2^64/3)/6 * 256 bits
    per element at the 256-bit cell above - which is not a subexponential
    algorithm's preprocessing, it is a table. For NFS, |desc| = O(log B) TOTAL
    (the predicate is a bound and a primality test), so delta = O(log B ln B /B)
    -> 0; for Gaudry, |desc| = O(log q) total, delta -> 0. THE SEPARATION IS
    THEREFORE: the working families buy an unbounded factor base with an O(1)
    predicate, and Bezout says that over a plane cubic you cannot. Stated this
    way the obstruction is INFORMATION-THEORETIC and about the predicate, not
    about "algebra", and it explains why the no-go feels stronger than it is.

    (7) WHAT NFS USES THAT E(F_p) DOES NOT HAVE, STATED PRECISELY, BECAUSE THIS
    IS THE FORWARD GUIDANCE. NFS's short predicate is "norm below B" - a SIZE
    condition at an archimedean place, not a Zariski-closed condition. Size
    conditions are exactly the ones that are cheap to describe and select
    unboundedly many objects, and they are compatible with a MULTIPLICATIVE
    structure in which factorisation is canonical and unbounded in length.
    E(F_p) has no archimedean place and no canonical factorisation of a point
    into smaller points, and this is a structural statement, not a fatigue
    report. THREE NAMED ESCAPES REMAIN OPEN AND ARE NOT CLOSED BY ANYTHING HERE:
    (i) TUPLE PREDICATES - the summation polynomial S_{m+1}(x_1,...,x_{m+1}) = 0
    is itself a short predicate cutting out a huge set, but it is a condition on
    a TUPLE, so Bezout on a single plane curve does not bound it; the interface
    Theorem 1G quantifies over is single-point membership, and a factor base
    defined by a joint condition on tuples is OUTSIDE it. (ii) PREDICATES ON A
    COVER - a locus in a higher-dimensional ambient object whose intersection
    with E is not governed by a plane Bezout product; the theorem's own
    algebraic-degree generalisation requires a PROPER intersection with FINITE
    Delta, and a family whose intersection is not proper is explicitly excluded
    by the receipt's own non-containment hypothesis. (iii) A PULLED-BACK SIZE
    FUNCTION - any valuation, height, or filtration on a lift or a cover that
    plays the role of "norm below B". Route (iii) is the lifting instinct, and
    this program has a scoped negative on one instance of it
    (DEC-20260724-021, whose forbidden-sentence list explicitly does NOT include
    a general claim); the audit's job is to state the escapes, not to grade them.

    (8) WHAT THIS DOES NOT SAY. It does NOT say the theorem is defective: the
    theorem's hypothesis correctly excludes NFS and Gaudry-Diem, so no
    contradiction exists. It does NOT say a universal no-go is impossible. It
    says the universal statement must be quantified over chi, not over "algebraic
    description", and that quantified over "algebraic description" it is FALSE
    with NFS as the witness.

