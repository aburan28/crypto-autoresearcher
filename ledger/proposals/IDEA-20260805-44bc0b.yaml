  lossy_projection_identifiability_audit:
    projection: >-
      A complete factor-base construction (ambient object, membership predicate,
      arity, group) projected to the pair of scalars (chi, delta).
    what_is_discarded: >-
      Everything about COST: the price of testing membership, the price of
      finding a decomposition of a given target into m factor-base elements, the
      price of the linear algebra, the relation rank, the descent tree, and the
      certificate obligations. Also discarded: whether mF is well-distributed
      rather than merely large.
    why_genuinely_lossy: >-
      Massively lossy, and lossy in a direction that must be declared up front
      or the diagnostic will be oversold. The fibre over (chi, delta) = (1, 0)
      contains NFS, Gaudry-Diem, AND a uniformly random subset of G of size B
      with m = log N/log B, which is worthless. THE DIAGNOSTIC IS NECESSARY, NOT
      SUFFICIENT, and the contract builds the random-subset object as an
      explicit null so that this limit is measured rather than asserted.
    why_compatible_with_the_operations: >-
      Compatible: chi and delta are defined from cardinalities and description
      lengths that are preserved by the operations the interface allows -
      restricting F, composing the addition map, changing the ambient locus -
      and both propagate deterministically under those operations (chi is
      additive in log-cardinality; delta is a ratio of two quantities each of
      which is well-defined for any explicitly given predicate).
    is_it_only_a_change_of_coordinates: >-
      CHECKED FOR BOTH FAILURES, AND ONE OF THEM IS HALF-PRESENT, WHICH THIS
      RECORD STATES RATHER THAN HIDES. Against the (Delta, Pi) = (x XOR y, x*y)
      char-2 failure - "nothing discarded, nothing gained": chi IS a change of
      variables on the theorem's own hypothesis Delta^m <= N^{1-epsilon} and
      that half of the proposal gains nothing on its own; the gain comes
      entirely from EVALUATING it outside the interface, which the inequality in
      its original form invites nobody to do. Against the mirror failure
      (constant across instances, zero comparator spread): chi is NOT constant -
      it takes the value 1 on two families and tends to 0 on a third, which is
      the maximum possible spread for a quantity whose meaningful range is
      [0,1]. delta is not a change of coordinates on anything: it is a new
      quantity, and it is the half of the proposal that carries independent
      content.

  assumptions:
    - >-
      That the arity attributable to NFS is u = log M/log B rather than a fixed
      constant. This is definitional (B-smooth integers of size M have about u
      factors) but it is the step a reviewer should attack first, because
      choosing m differently changes chi. The contract MEASURES the empirical
      arity distribution of B-smooth integers by exhaustive enumeration at toy M
      instead of assuming it.
    - >-
      That |F| ~ q for the Gaudry factor base and N ~ q^n. Both are measured by
      exhaustive point enumeration at small (q, n) in the contract, not assumed.
    - >-
      That description length is the right charge for a predicate. An
      implicit-membership predicate (an algorithm rather than a polynomial) can
      be short while being expensive to evaluate, and delta does not charge
      evaluation. KN-OPEN-020's own text names implicit membership solvers as
      part of what keeps the universal question open, and delta does NOT close
      that gap - it isolates a different one.

  proof_search_map_note: >-
    The proof-search map for this proposal lives on the paired hypothesis
    H-PATH-89d1d0, where all four inventor-protocol section 8 audits are
    filled. It is not duplicated here.

  predictions:
    - metric: >-
        chi computed for the NFS rational-side factor base, at every B in the
        declared sweep
      direction: different
      minimum_effect: >-
        EXACTLY 1.000, independent of B, to within the arity-estimator's
        declared discretisation. This is a forced value derived before any run.
        If the measured chi depends on B, the identification m = u is wrong and
        this proposal's central comparison is falsified.
    - metric: >-
        chi computed for the Gaudry/Diem construction from EXHAUSTIVELY
        ENUMERATED cardinalities at (q,n) in {(5,3),(7,3),(11,2),(13,2)}
      direction: different
      minimum_effect: >-
        1.000 +/- 0.05 at every cell, where the tolerance covers the Hasse
        deviation of #E(F_{q^n}) from q^n and the deviation of |F| from q. If
        any cell returns chi below 0.9 the identification is wrong at small
        parameters and the extrapolation to the general claim must be withdrawn.
    - metric: >-
        log2 of the plane-curve degree d required to reach chi = 1 at
        log2 N = 256 with m = 4
      direction: higher
      minimum_effect: >-
        d >= 2^64/3, i.e. log2 d >= 62.4. Derived, not measured. Any
        construction claiming a bounded-degree prime-field factor base with
        chi near 1 must exhibit a degree at least this large, and must then be
        charged for delta ~ (d/6) log2 p bits per element.
    - metric: >-
        coverage fraction |mF|/N for the Gaudry subfield factor base versus a
        SIZE-MATCHED UNIFORMLY RANDOM subset of the same group, same m
      direction: different
      minimum_effect: >-
        BOTH exceed 0.3 at every cell where |F|^m >= N. Predicted before the run
        from the balls-in-bins estimate |mF|/N ~ 1 - exp(-|F|^m/N). THE POINT OF
        THIS PREDICTION IS THAT THE TWO AGREE: if the random subset covers
        comparably, chi has been shown to measure coverage and NOT usefulness,
        which is the honest limit of the diagnostic and must be recorded before
        anyone cites it.
    - metric: >-
        delta (description bits per factor-base element) for the four families
      direction: different
      minimum_effect: >-
        A separation of at least 6 orders of magnitude at the 256-bit cell:
        delta -> 0 for NFS and Gaudry (O(log) total description over an
        unbounded base), against delta >= (d/6) log2 p >= 4.3e17 bits per
        element for a plane predicate at d = 2^64/3. If delta does not separate
        the families, the description-density half of the proposal is dead and
        only the chi rewrite survives.

  minimal_test:
    design: >-
      Three stages, cheapest first; the decisive one is stage 1 and costs
      nothing.
      STAGE 1 (ZERO COMPUTE, can terminate the whole line): write chi and delta
      out for the four declared families by hand, and check the NFS value
      against the definition of smoothness. If chi_NFS is not 1, or if the
      theorem's hypothesis is not equivalent to chi <= 1-epsilon, the proposal
      is wrong and stops here.
      STAGE 2 (seconds, exact integer arithmetic, pure Python): enumerate all
      B-smooth integers up to a toy M for a grid of B; measure Psi(M,B), the
      arity distribution, and chi_hat; verify chi_hat -> 1 and its B-independence.
      STAGE 3 (minutes, exact, pure Python): build E(F_{q^n}) for the four small
      (q,n) cells by exhaustive enumeration over an explicit polynomial basis;
      compute |F|, N, |mF| for the subfield factor base and for the matched
      random null; compute chi and the coverage fraction for both.
    controls:
      - >-
        NULL OBJECT (same shape, forced value pre-derived, CAN FAIL): a
        UNIFORMLY RANDOM subset R of G with |R| = |F| and the same arity m, on
        the same curve at the same cell. FORCED VALUE, derived before the run
        from balls-in-bins: |mR|/N ~ 1 - exp(-|R|^m/N), and chi(R) = chi(F)
        EXACTLY because chi depends only on cardinalities. THIS NULL CAN FAIL in
        two directions and both are informative: if |mR|/N comes out far below
        the balls-in-bins prediction, the sumset of a random subset is
        structured and my counting is wrong; if it comes out comparable to the
        subfield base - which is what is predicted - then chi is CONFIRMED to
        measure coverage only, and the record must carry that limit permanently.
      - >-
        POSITIVE CONTROL / nearby object where the effect MUST appear: the
        Gaudry subfield factor base at (q,n) = (7,3). This is a construction
        that is known to work as index calculus, so its coverage MUST reach a
        constant fraction of the group and its chi MUST come out at 1. If it
        does not, the enumeration code is wrong and NO conclusion about the
        bounded-degree family may be reported at all.
      - >-
        SECOND POSITIVE CONTROL, ZERO COMPUTE, ON MY OWN UNDERSTANDING OF THE
        THEOREM: take an explicit plane predicate f of small degree d on an
        explicit toy curve, enumerate F exhaustively, and check |F| <= 3d. This
        is Bezout, so it MUST hold; a violation means I have misread the
        theorem's interface and everything downstream is void.
      - >-
        GRADED CONTROL, 4 interior points, monotonicity reported: sweep
        (q,n) over {(5,3),(7,3),(11,2),(13,2)} and report chi and the coverage
        fraction as functions of |F|^m/N. PREDICTED: chi flat at 1.00 while
        coverage rises monotonically with |F|^m/N. A chi that drifts with the
        cell localises an error in the cardinality identifications rather than
        leaving "it did not work".
      - >-
        GRADED CONTROL ON THE PARAMETER MEANT TO DESTROY THE EFFECT: sweep the
        plane-predicate degree d over {1, 2, 5, 10, 30, 100} at fixed m and
        fixed log2 N = 256 and report chi(d) and delta(d). PREDICTED: chi rises
        as m log(3d)/log N, i.e. only LOGARITHMICALLY in d, while delta rises
        LINEARLY in d. The gap between a logarithmic gain and a linear cost is
        the mechanism, displayed as a monotone table.
      - >-
        ARCHIVE CHECK (zero compute): searched this session for a prior
        evaluation of the bounded-degree no-go against NFS. knowledge/
        open-problems/ mentions the number field sieve only in KN-OPEN-025
        (TNFS Galois symmetry, a different question);
        ideas/artifacts/IDEA-20260801-021/ does not mention it. RECORDED AS A
        NEGATIVE SEARCH RESULT, not as proof the control was never run.
    required_metrics:
      - chi and delta for each of the four declared families, with the cardinalities they were computed from
      - measured Psi(M,B) and the arity distribution of B-smooth integers, per B, with M and the enumeration method stated
      - exhaustively enumerated |F|, N, |mF| per (q,n) cell for both the subfield base and the random null, with seeds
      - the Bezout check |F| <= 3d on the explicit toy plane predicate, per degree
      - the degree d required for chi = 1 at 256 bits, and the delta it implies
      - a one-page restatement of KN-OPEN-020 quantified over chi, with the three named escapes

  falsification_conditions:
    - >-
      chi_NFS is not 1. The central comparison fails and the proposal is
      withdrawn as a superseding record.
    - >-
      The theorem's hypothesis Delta^m <= N^{1-epsilon} is NOT equivalent to
      chi <= 1-epsilon. The rewrite is wrong; everything downstream is void.
    - >-
      The Bezout positive control fails (|F| > 3d on an explicit toy predicate).
      I have misread the interface and no conclusion may be reported.
    - >-
      The Gaudry positive control fails (chi far from 1, or coverage not
      reaching a constant fraction). The instrument is broken and no negative
      about the bounded-degree family may be reported.
    - >-
      Someone exhibits an algebraically described prime-field factor base with
      chi -> 1 and delta = polylog. That would refute the description-density
      half outright and would be the single most valuable outcome available
      here.

  confounders:
    - >-
      chi MEASURES COVERAGE ONLY. Decomposition-search cost, membership cost,
      linear algebra, relation rank and descent are all outside it. Anyone
      citing chi = 1 as evidence that a construction works has misused this
      record, and the null object exists precisely to make that misuse visible.
    - >-
      THE ARITY ATTRIBUTION FOR NFS IS A MODELLING CHOICE. Setting m = u is
      natural but not forced; a different convention changes chi. The contract
      measures the empirical arity distribution so the choice is defended by
      data rather than by assertion.
    - >-
      CRITICISING AN INTERNAL NEGATIVE IS CHEAP. Two positive controls (Bezout,
      Gaudry) and five falsification conditions exist so that a negative outcome
      costs something to reach, and the record explicitly concludes that the
      theorem is NOT defective.
    - >-
      TOY (q,n) CELLS. #E(F_{q^n}) at q^n < 1000 deviates from q^n by the Hasse
      interval, which is a large relative deviation at that size. The tolerance
      of +/- 0.05 on chi is set for that, and the toy cells are a CHECK OF A
      COUNTING IDENTITY rather than an extrapolation.
    - >-
      NO NFS OR GAUDRY PAPER WAS READ. If the recalled constructions are
      misdescribed, the nearby objects are misidentified. Stage 1 therefore
      states each construction from its definition and invites a reviewer to
      reject the identification directly.

  interpretation_limits:
    - >-
      NOTHING HERE IS AN ATTACK, AN ALGORITHM, OR AN EXPONENT. No factor base is
      proposed, no relation is collected, no cost is claimed against Pollard rho,
      and no prime-field index calculus is made feasible. Pollard rho remains the
      ECDLP baseline.
    - >-
      NO STATUS CHANGE is proposed for KN-OPEN-020, for IDEA-20260801-021, for
      the theorem receipt, or for any decision citing them. Those are Coordinator
      decisions (AGENTS.md rule 1).
    - >-
      THE THEOREM IS NOT CLAIMED TO BE DEFECTIVE. Its hypothesis correctly
      excludes NFS and Gaudry-Diem; there is no contradiction. The claim is about
      what the theorem's SCOPE is, and about how the open universal question
      should be quantified.
    - >-
      THE THREE NAMED ESCAPES ARE NOT GRADED, RANKED, OR ENDORSED. Naming them is
      the forward guidance inventor-protocol section 4 requires of a closure; it
      is not a claim that any of them is promising. In particular escape (iii)
      overlaps a lane on which this program holds a scoped negative, and nothing
      here reopens or contests that negative.
    - >-
      A confirming outcome does NOT close KN-OPEN-020. It restates it. The
      restated question - "is there a prime-field factor base with chi -> 1 and
      polylog delta, with membership and decomposition charged?" - is strictly
      harder to answer than the current phrasing and is left open.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NOT LOAD-BEARING FOR THE HEADLINE. chi <= 1-epsilon is literally
        Theorem 1G's hypothesis rewritten by taking logarithms; chi_GD = 1 is a
        cancellation of n log q; chi_NFS = 1 is the definition of B-smooth.
        Bezout and the image-cardinality bound are theorems in the receipt that
        was read. This entry records that the headline is unconditional.
      rigorous_support: >-
        Logarithms of the receipt's own inequalities, plus the receipt's
        Theorems 1, 1G and 2, which were read in full.
      validation_plan: >-
        Symbolic re-derivation at Stage 1 plus the exhaustive-enumeration checks
        at Stages 2 and 3, where every cardinality entering chi is counted rather
        than assumed.
    - id: H2
      statement: >-
        FORALL B in the sieve's parameter range and FORALL M, the number of
        distinct B-smooth integers up to M satisfies
        log Psi(M,B)/log M -> 1, equivalently u log u = o(log M) where
        u = log M/log B.
      random_model_justification: >-
        The Dickman-rho model gives Psi(M,B) = M rho(u)(1+o(1)) with
        log rho(u) = -u log u (1+o(1)), so the ratio tends to 1 whenever u grows
        more slowly than log M / log log M. THE DICKMAN ASYMPTOTIC IS RECALLED,
        UNVERIFIED - no paper was read for it in this session and none is cited.
      validation_plan: >-
        Stage 2 enumerates B-smooth integers EXACTLY up to a toy M for a grid of
        B and reports measured log Psi/log M against the model. This is a
        distribution-level check at a scale where exact counting is possible; it
        is a validation of the heuristic, not a citation of it.
      falsification_condition: >-
        Measured log Psi(M,B)/log M drifts away from 1 as B falls across the
        tested grid in a way the Dickman model does not predict.
    - id: H3
      statement: >-
        For a uniformly random subset R of a cyclic group G of order N with
        |R| = B, the m-fold sumset satisfies E|mR|/N ~ 1 - exp(-B^m/N).
      random_model_justification: >-
        Balls-in-bins: treat the B^m ordered tuples as independent uniform draws
        from G. Independence is FALSE (sums share summands), so this is a
        heuristic and is labelled one; it is used only to set a pre-run
        prediction for the null, never as a result.
      validation_plan: >-
        Stage 3 measures |mR| exactly by enumeration at every cell over at least
        20 seeds and reports the measured distribution against the prediction.
      falsification_condition: >-
        Measured |mR|/N falls outside the pre-registered band at any cell, which
        would mean the null's forced value was wrong and the null must be
        re-derived before the treatment arm is interpreted.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED OR CLAIMED. The exponent this audit BEARS ON is the
      one KN-OPEN-020 is about: whether any prime-field index calculus can
      achieve subexponential time against Pollard rho's N^{1/2}. The audit's
      contribution is to identify chi as the quantity that must reach 1 before
      any such claim is even coherent, and to show that the currently blocked
      family has chi -> 0 while the two working families have chi = 1.
    memory_exponent: >-
      n/a for the audit. It is, however, exactly where delta bites: a factor base
      of size |F| with description density delta costs delta*|F| bits of storage
      or preprocessing, and for the bounded-degree family at chi = 1 that is
      (d/6)*log2(p)*3d ~ (d^2/2)log2(p) bits - a memory charge that no record in
      this corpus has ever levied on an algebraically described factor base.
    best_known: >-
      Pollard rho / BSGS at N^{1/2} for generic prime-field ECDLP; no
      subexponential prime-field index calculus is known. Unchanged here.
    hidden_overhead: >-
      delta IS the hidden overhead, made explicit. The bounded-degree no-go's
      charging obligation ("all description, membership, relation, descent, time
      and memory costs charged" - KN-OPEN-020, verbatim) names description cost
      and nothing in the corpus has quantified it; delta quantifies it.
    tradeoff_note: >-
      The audit's central trade, stated as a table rather than a slogan: raising
      the plane-predicate degree d buys chi only as m*log(3d)/log N -
      LOGARITHMIC in d - while costing delta ~ (d/6)*log2(p) per element -
      LINEAR in d. Any construction inside the interface pays linearly for a
      logarithmic gain, which is the mechanism of the obstruction and is what
      makes the escapes have to leave the interface.

  dominated_by: >-
    n/a (no algorithm, no attack, no cost claim, therefore no Pareto point).
    Rows checked before writing that: this proposal offers nothing on the time
    axis, nothing on the memory axis, and nothing on the data/query axis against
    Pollard rho, BSGS, van Oorschot-Wiener parallel rho, or any index-calculus
    variant, because it proposes no algorithm at all. On the QUESTION it audits,
    the incumbent is IDEA-20260801-021's bounded-degree theorem plus KN-OPEN-020,
    and this record supersedes neither - it adds a control and a restatement.
    Checked for a prior nearby-object control on that theorem: KN-OPEN-020
    itself (READ - names KN-OPEN-019 and implicit membership as the open
    residuals, does not mention NFS), the artifact directory (searched, no NFS
    reference), knowledge/open-problems (NFS appears only in KN-OPEN-025), and
    the 30 prior ideas in this goal's brief. Absence of a search result is not
    evidence the control was never run (AGENTS.md retrieval policy).
  sota_delta: >-
    Zero on every attack axis. Quantitatively, the delta offered is diagnostic:
    it supplies two numbers the corpus does not have. chi separates the families
    by the maximum possible amount on its range - 1.000 for NFS and Gaudry-Diem
    against 0.0643 to 0.2300 for the four computed bounded-degree cells - and
    delta separates them by more than 17 orders of magnitude at the 256-bit
    cell (O(log B) total description over an unbounded base, against
    >= 4.3e17 bits per element at the degree chi = 1 would require). Against
    KN-OPEN-020 as currently posed, the delta is a proof that the posed universal
    statement is false as quantified, with an explicit witness.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.80 that chi_NFS = 1 and chi_GD = 1 survive review and that the
    "algebraically described" quantifier is shown to be the wrong one; 0.45 that
    delta survives as a quantity a reviewer accepts as the right charge. The
    first number is not higher because the arity attribution for NFS is a
    modelling choice a reviewer may reject, because no NFS or Gaudry paper was
    read this session so the constructions could be misdescribed, and because
    the theorem receipt may contain a clause I have not weighted correctly. It
    is not lower because the computation is definitional: once m = u is granted,
    chi_NFS = 1 is arithmetic, and the Gaudry cancellation is n log q over
    n log q with nothing to argue about. The second number is markedly lower and
    should be: description length is not obviously the right charge, an implicit
    membership predicate can be short and expensive, KN-OPEN-020's own text
    names implicit solvers as an open residual that delta does not touch, and
    the linear-versus-logarithmic trade is suggestive rather than a theorem.
