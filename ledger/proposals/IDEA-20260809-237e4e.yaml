idea:
  id: IDEA-20260809-237e4e
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-PAIR-f2e31f
  goal_id: GOAL-PAIR-001
  title: >-
    A ranked sensitivity table for the pairing cost model, produced by sweeping
    every modelling choice over a declared range
  class: tooling
  claim: >-
    The headline bit level is a function of roughly a dozen modelling choices,
    and their influences differ by orders of magnitude. The claim is that a
    ranked sensitivity table can be produced mechanically, that the ranking is
    stable across the declared ranges, and that the top-ranked choice is one
    made by convention rather than by measurement — which would locate exactly
    where the published number's authority actually rests.
  mechanism: >-
    Express the model as executable code with every choice as a named parameter,
    sweep one-at-a-time and jointly over declared ranges, and rank by the induced
    movement in output bits. Joint sweeps are required because interactions
    between smoothness bound and sieving region are expected.
  why_not_a_renamed_known_approach: >-
    Sensitivity analysis is standard practice in modelling generally and rare in
    cryptographic cost estimation specifically, where single-point figures are
    the norm. The contribution is the artifact and the ranking, not the
    technique.
  predictions:
  - observable: rank order of choices by induced bit movement
    metric: ordered list with movements
    predicted: Stable across declared ranges. An unstable ranking means the model has strong interactions and that the one-at-a-time analysis is misleading, which must then be reported instead of the ranking.
  - observable: whether the top-ranked choice is measured or conventional
    metric: categorical with justification from filed text
    predicted: Conventional. If the top choice turns out to be well measured in the literature, the goal's premise weakens and the record says so plainly.
  minimal_test: >-
    Implement the model, sweep all parameters one-at-a-time and in pairs over
    declared ranges, produce the ranked table, and repeat the ranking at two
    different base points to test stability.
  controls:
  - 'BASE-POINT CONTROL: rankings computed at two different base points must agree; disagreement means the ranking is local and must be reported as such.'
  - 'IMPLEMENTATION CONTROL: the model must reproduce the calibration runs and, where possible, the record retrodiction, before its sensitivities are meaningful.'
  falsification_conditions:
  - Rankings differ materially between base points.
  - The model cannot reproduce its own calibration, making all sensitivities uninterpretable.
  interpretation_limits: >-
    Sensitivities are properties of the model, not of the underlying
    mathematics. A choice with high sensitivity is not thereby wrong.
  sota_delta: 'No attack. Delta: a ranked table and a reusable model artifact.'
  dominated_by: Downstream of IDEA-20260809-15e1cd, 1a5cb2 and 22a00c; not dominated by any corpus record.
  estimated_cost: Implementation medium; compute negligible.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for sensitivity analysis: no cost-model records. WEB NOT CHECKED.'
