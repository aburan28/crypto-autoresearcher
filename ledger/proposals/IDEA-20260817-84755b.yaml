idea:
  id: IDEA-20260817-84755b
  question_id: RQ-ECDLP-002
  added: '2026-08-17'
  title: >-
    A disjoint projection panel for the probabilistic regime that IDEA-20260807-df906f's
    rigidity theorem forces every ECDLP tracked object into: propagation defect in BITS, with
    a closed-form random-relabelling null and the Kummer quotient as a forced-value control at
    exactly 1.000 bit -- including the two projections an actual attack uses, the rho partition
    index and the non-algebraic factor-base window
  class: measurement
  claim: >-
    (A) THE PRIOR RESULT THIS RECORD STANDS ON, AND IT IS LOAD-BEARING RATHER THAN
    MOTIVATIONAL. IDEA-20260807-df906f proves the PRIME-ORDER CONGRUENCE RIGIDITY THEOREM: on
    a group of prime order, if v propagates exactly -- if there is any F, not necessarily
    computable or associative, with v(R+R') = F(v(R), v(R')) -- then v is injective or
    constant. Consequently NO exactly-propagating lossy tracked object exists on <P> at all,
    and every surviving candidate is forced into the PROBABILISTIC regime. That record also
    already builds a propagation-defect instrument with three matched nulls for one object
    family, the division-polynomial residue ladder v_L(R) = (psi_ell(x(R))) for ell <= 13.

    (B) WHAT THIS RECORD THEREFORE IS, STATED WITHOUT INFLATION. It is NOT the first
    quantification of the lossy-projection test, and an earlier draft of this record claimed
    that; the claim was wrong and is retracted here. This record is a DISJOINT PANEL for the
    probabilistic regime df906f opens, plus two changes to the instrument. Panel disjointness:
    df906f measures small-prime division-polynomial residues; this record measures ten
    projections none of which is a division polynomial -- the Kummer quotient, quadratic and
    d-th power residue symbols, top and bottom bit windows, x mod small m, the twist-side bit,
    the r-adding walk's partition index, and a non-algebraic factor-base window. Instrument
    changes: (i) the functional is CONDITIONAL ENTROPY IN BITS, D(pi) = H(pi(X+Y) | pi(X),
    pi(Y)), rather than df906f's bucket-collision fraction, which makes the null computable in
    CLOSED FORM from the fiber-size profile instead of only by simulation; and (ii) the panel
    contains a FORCED-VALUE POSITIVE CONTROL, the Kummer quotient at exactly 1.000 bit, which
    df906f's ladder does not contain and which calibrates the instrument against a
    known-answer lossy projection rather than only against the identity.

    (C) WHY THE KUMMER CONTROL IS THE INTERESTING NUMBER AND NOT JUST A CALIBRATION. Rigidity
    says every lossy projection has D > 0. The Kummer quotient achieves D = 1.000 bit exactly,
    from the biquadratic differential-addition relation: {x(X+Y), x(X-Y)} is determined by
    x(X), x(Y), and the unordered pair carries exactly one bit of ambiguity. So the Kummer
    quotient very nearly ATTAINS the rigidity bound, and its known exploitation value is a
    constant-factor sqrt(2) in rho -- no more. That pairing, a near-minimal defect buying only
    a constant factor, is the calibration that tells the program what a defect of 0.15 bits
    would actually be worth, and it is why every panel member's defect is reported beside the
    Kummer value.

    (D) THE TWO PANEL MEMBERS THAT ARE NOT IN ANY PRIOR RECORD I FOUND. P8, the r-adding
    walk's partition index, is the projection an actual generic attack uses, so its defect
    prices every walk-based route directly. P9, the indicator of a factor-base window
    x in [0, B), is the closest measurable proxy in this panel to the H-PSEUDO flatness
    question that KN-FIND-5c1a03's analytic leg reports as having eight closed PROOF METHODS.
    A count of closed proof methods is a fatigue report under docs/inventor-protocol.md
    section 4; a measured defect is not. Whether that measurement has already been run is
    UNRESOLVED and flagged in novelty_screen.

    (E) NOT CLAIMED. No attack. No claim that any panel member leaks; rigidity plus the
    expected nulls say they do not. No claim of priority over df906f for either the rigidity
    theorem or the idea of measuring a propagation defect. No claim that this settles the
    H-PSEUDO question; P9 is a proxy and is labelled as one.
  mechanism: >-
    THE PANEL, declared in full before any measurement so nothing can be selected after the
    fact. Every member is computable from the point's coordinates in O(1) field operations,
    which is the class that matters -- a projection costing more than a group operation cannot
    help a walk.
    P0  identity, x and y both. LOSSLESS CONTROL, forced D = 0.
    P1  Kummer, x only, the quotient by +-1. FORCED-VALUE POSITIVE CONTROL: D must be EXACTLY
        1.000 bit. If P1 does not return 1.000 the estimator is broken and the run is void.
    P2  quadratic character chi(x).
    P3  d-th power residue symbol of x, for d | p-1, d in {3, 5, 7} where available.
    P4  top t bits of the integer representative of x, t in {1, 2, 4, 8}.
    P5  bottom t bits of x, same t.
    P6  x mod small m, m in {3, 5, 7, 11}.
    P7  the twist-side bit chi(x^3+ax+b) evaluated on a point of P^1 rather than of E --
        included precisely because the map (E(F_p) u E^tw(F_p))/+-1 -> P^1(F_p) is a
        BIJECTION, so P7 is a change of coordinates and must show ZERO information gain. It is
        the record's built-in trap for the failure mode the protocol warns about.
    P8  the r-way partition index used by an r-adding rho walk, r in {16, 32, 64}.
    P9  the indicator of a factor-base window x in [0, B) for B = p^{1/2}, p^{1/3}.
    NOT IN THE PANEL, DELIBERATELY: division polynomials at any index. That family is
    df906f's and re-measuring it here would be duplication rather than coverage.

    THE MEASUREMENT. At toy primes where <P> is enumerable or heavily samplable, estimate
    D(pi) by plug-in entropy with Miller-Madow bias correction and a declared bootstrap CI over
    N = 10^7 sampled pairs (X,Y). Report D_k for k = 1..8 and the survival depth. Every panel
    member is measured in the same invocation with the same estimator and the same N.

    WHY THE NULL IS FORCED, NOT FITTED, AND WHY THAT IS THE INSTRUMENT CHANGE THAT MATTERS.
    The null object is Z/n with a RANDOM BIJECTIVE RELABELLING: same group, same projection
    shapes by fiber size, no curve coordinates. For a projection with fiber-size profile f the
    null defect is computable in CLOSED FORM from f alone. So every arm has an arithmetic
    reference value, not an empirical baseline, and a small measured deviation is
    interpretable against arithmetic rather than against another noisy run. df906f's NULL-B
    achieves the same separation by simulation; the closed form additionally exposes estimator
    bias, because the run reports the disagreement between the closed-form and simulated nulls
    BEFORE any signal is read.

    WHAT RIGIDITY DOES TO THE SEARCH SPACE, and this is the correction an earlier draft of this
    record got wrong. The D = 0 outcome is FORECLOSED for every lossy panel member by df906f's
    theorem. So the run is not searching for a defect-0 projection; it is measuring WHERE IN
    (0, null] each member sits, and the interesting quantity is the GAP BELOW THE NULL, not the
    distance above zero. P0 and P7 are the only members that can legitimately return 0, and
    both are lossless, which is exactly what the theorem predicts and what makes them traps.
  novelty_status: unverified
  novelty_screen:
    method: >-
      THREE SCREENS. (1) This session's textual screen: full reads of
      docs/inventor-protocol.md, KN-FIND-5c1a03, KN-OPEN-019, agents/idea-generator.md,
      outputs/_blacklist_compact.txt, and IDEA-20260816-e8e809 as a schema exemplar; greps over
      ledger/proposals for "conditional entropy|mutual information|bits of information|null
      object|null-object" and over ledger/ for "lossy projection|lossy-projection|tracked
      object|propagation defect|survival depth". (2) A SEMANTIC SCREEN RUN BY THE COORDINATOR
      SESSION against the 48,428-point crypto-kb index, a 2026-08-13 lineage snapshot. (3) This
      agent's full-text read of IDEA-20260807-df906f, the record that screen returned.
    results: >-
      MY TEXTUAL SCREEN'S RESULT, WHICH WAS INADEQUATE: "lossy projection" and "tracked object"
      appear in essentially every 2026-08-16 proposal as schema boilerplate, and the nearest
      "mutual information" hits (IDEA-20260807-413fcc, IDEA-20260807-6c7540) measure different
      random variables. From that I concluded the functional D(pi) was unduplicated. THE
      COORDINATOR'S SEMANTIC SCREEN RETURNED IDEA-20260807-df906f AT 0.667 AND THAT CONCLUSION
      WAS WRONG. Full-text read confirms df906f (i) proves the prime-order rigidity theorem
      that forecloses the D = 0 branch entirely, and (ii) already defines a propagation defect
      -- as a bucket-collision fraction -- with three matched nulls, an identity planted
      positive, an M-ladder, a field-bit ladder and a decay test, for the division-polynomial
      residue ladder. This record has been rewritten to stand on df906f rather than to claim
      priority over it, its claim (A) has been retracted and restated, and division polynomials
      have been excluded from the panel to keep the two records disjoint. UNRESOLVED AND
      FLAGGED: whether the H-PSEUDO flatness measurement corresponding to panel member P9 has
      already been run; if it has, P9 should be dropped and the record filed with nine members.
      Also unresolved: df906f's own novelty_screen records that NO external literature check was
      performed for prior statements of the propagation-defect measurement, so the external
      status of the instrument is unestablished in this program by either record.
    staleness_caveat: >-
      The index queried is a 2026-08-13 lineage snapshot, four days stale, and does not contain
      records created today, including the other records in this batch. ABSENCE OF A HIT IN IT
      IS NOT EVIDENCE OF ABSENCE. Neither the coordinator's screen nor my grep pass can prove a
      negative, and novelty_status stays `unverified` for that reason and not as a formality.
      The one hit it did return overturned my own conclusion, which is a fair measure of how
      much weight the negative results deserve.
    verdict: >-
      UNVERIFIED, and materially weaker than the earlier draft claimed. In this program's terms
      the honest description is an ADAPTATION of df906f's instrument to a disjoint panel, with
      two instrument changes (conditional entropy in bits with a closed-form null; a
      forced-value lossy positive control). The residual novelty is the panel -- above all P8
      and P9 -- not the method.
  citations:
    - ref: IDEA-20260807-df906f
      provenance: internal
      claim: >-
        PRIME-ORDER CONGRUENCE RIGIDITY: on a group of prime order, any v admitting F with
        v(R+R') = F(v(R), v(R')) for all R, R' is injective or constant -- proof by taking
        v(R) = v(R') with R != R', deducing v(T) = v(T+D) for D = R'-R != O, and using that D
        generates a prime-order group. Hence no exactly-propagating lossy tracked object exists
        on <P>, and every candidate is forced into the probabilistic regime. Also the prior
        propagation-defect instrument (bucket-collision fraction, NULL-A/B/C, identity planted
        positive, decay test) for the division-polynomial residue ladder.
      verified_by: idea-generator (this session, file read in full)
    - ref: KN-TECH-056
      provenance: internal
      claim: >-
        The lossy-projection test and the (Delta, Pi) = (x xor y, x*y) worked example in which
        nothing is discarded and therefore nothing is gained. Retained as the frozen fixture
        the estimator must reproduce at D = 0.
      verified_by: idea-generator (this session, via docs/inventor-protocol.md sections 1-3 read in full)
    - ref: KN-FIND-5c1a03
      provenance: internal
      claim: >-
        The analytic leg closes eight character-sum proof methods for the H-PSEUDO flatness
        question; evidence_level derived, proof_status derivation. Cited as the motivation for
        panel member P9 and NOT as an established barrier.
      verified_by: idea-generator (this session, file read in full)
    - ref: 'Weil / Bombieri character-sum bounds over curves; Kohel-Shparlinski and
        Lange-Shparlinski on character sums over points of elliptic curves'
      provenance: recalled
      claim: >-
        Character sums over the points of an elliptic curve over F_p are square-root cancelling,
        which is why P2, P3 and P9 are EXPECTED to match the null. Pointer only; no bound is
        relied on quantitatively.
      verified_by: null
  object_first_candidate:
    tracked_object: >-
      Not a projection but the FUNCTIONAL on projections: the one-step and k-step propagation
      defect D_k(pi) in bits, together with the survival depth and, as the primary reported
      figure, the GAP BELOW THE CLOSED-FORM NULL. Rigidity forecloses D = 0 for lossy members,
      so distance-above-zero is not the observable; distance-below-null is.
    lossiness: >-
      Each panel member is or is not lossy and the record measures which. P0 is lossless and is
      a control; its forced D = 0 is a statement about a change of coordinates, not a finding.
      P7 is lossless in disguise -- the twist/Kummer encoding is a bijection from
      (E(F_p) u E^tw(F_p))/+-1 onto P^1(F_p) -- and is a deliberate trap. The genuinely lossy
      members are P1-P6, P8 and P9, and by df906f's theorem every one of them must have D > 0.
      The tracked functional D_k is itself maximally lossy: it discards the projection, the
      panel, the curve and the points, retaining one real number per (pi, k).
    propagation: >-
      D_k propagates by a chain rule giving a one-sided bound, not an identity:
      D_{k+1} <= D_k + D_1, with equality iff successive ambiguities are independent. The run
      MEASURES the realised D_{k+1} against that bound and reports the gap, because a k-step
      defect growing more slowly than the chain-rule bound is what a usable multi-step object
      would look like.
    survival_score: >-
      The survival depth per panel member is the primary deliverable: the largest k at which
      D_k sits below the closed-form null by the declared margin. Predicted 0 for every member
      except P1, whose survival depth is unbounded at exactly 1 bit per step and whose known
      exploitation value is a constant-factor sqrt(2) in rho -- stated up front so P1's success
      is not mistaken for a lead.
  null_object_control: >-
    (N1) RANDOM-RELABELLING NULL, CLOSED FORM. Replace the curve by Z/n with a uniformly random
    bijective labelling, keeping each panel member's fiber-size profile. The defect is then
    computable exactly from the fiber sizes with no simulation, so every arm has a forced null
    value. The run ALSO simulates it at the same N, and any disagreement between the simulated
    and closed-form null indicates estimator bias and is reported before any signal is read.
    (N2) FORCED-VALUE POSITIVE CONTROL. P1 must return D = 1.000 +- 0.01 bits. This proves the
    estimator detects exact multivalued propagation, and it is the LOSSY positive control that
    df906f's identity planted positive does not supply.
    (N3) LOSSLESS TRAPS. P0 must return D = 0.000 and P7 must return zero information gain over
    its own fiber structure. A nonzero reading on either means the estimator manufactures signal.
    (N4) STRUCTURAL TELL. For P8 the defect must INCREASE toward the null as r increases,
    because more mixing must destroy more structure. A defect flat in r is the artifact
    signature of inventor-protocol section 3.
    (N5) RIGIDITY CONSISTENCY CHECK, inherited from df906f. Any lossy panel member reporting
    D = 0.000 CONTRADICTS the rigidity theorem and is an implementation error until
    independently replicated; degenerate fiber occupancy is the likeliest cause and the fiber
    profile is reported at every cell so it is caught rather than believed.
  discriminated_from:
    - >-
      IDEA-20260807-df906f: the record this one stands on. Shared: the probabilistic-regime
      framing and the idea of measuring a propagation defect against matched nulls. DISJOINT:
      the object families do not intersect -- df906f measures division-polynomial residues at
      ell <= 13, and division polynomials are excluded from this panel by construction. DIFFERENT:
      the functional is conditional entropy in bits with a closed-form null rather than a
      bucket-collision fraction with a simulated one, and the panel carries a forced-value LOSSY
      positive control at 1.000 bit. Priority for the theorem and for the instrument concept
      belongs to df906f and is stated rather than blurred.
    - >-
      IDEA-20260807-413fcc: measures empirical mutual information between an oracle's ANSWER
      VECTOR and the secret k. Different random variables; that record prices an oracle, this
      one prices a projection under the group operation.
    - >-
      IDEA-20260807-6c7540: mutual information between two smoothness profiles. Neither variable
      is a projection of a group element and no group operation appears.
    - >-
      Blacklist "C1-Approximate-homomorphism-stability-of-the-x-map-Bogolyubov-Ruzsa@0718": asks
      whether the x-map is an approximate homomorphism using additive-combinatorial structure
      theory. This record uses no structure theory, proposes no attack, and measures a
      conditional entropy against a closed-form null. Overlap acknowledged.
    - >-
      Blacklist "B3-Discrete-Fourier-/-dual-group-factor-base-indicator@0718" and
      "C3-Elliptic-character-sum-bias-relation-oracle@0717b2": both build a RELATION GENERATOR.
      No relation is collected here and no factor base is used except as panel member P9, which
      is measured, not exploited.
    - >-
      IDEA-20260817-230971 in this batch: measures a lattice invariant, auditing the ALGEBRAIC
      leg of KN-FIND-5c1a03. This record sits nearest the ANALYTIC leg. They share only the
      motivation that a derivation should be reduced to a datum.
    - >-
      IDEA-20260817-1e0111 in this batch: reuses this panel verbatim and supplies the cost
      theorem for what a defect-0 projection would be worth. Note the interaction with df906f's
      theorem, which is stated in both records: rigidity forecloses defect-0, so 1e0111's
      antecedent is provably unsatisfiable on <P> and its value is the measured pruning ratio
      and the defect-to-cost pricing curve, not the attack.
  assumptions:
    - n prime, so <P> = E(F_p) up to cofactor, there is no subgroup structure to confound the group operation, AND df906f's rigidity theorem applies.
    - Toy primes small enough that N = 10^7 sampled pairs is large against the fiber sizes of every panel member, so Miller-Madow-corrected plug-in entropy is not saturated.
    - Every panel member is computable in O(1) field operations; costlier members are excluded rather than approximated.
    - The closed-form null depends only on the fiber-size profile, which is computed exactly rather than sampled.
    - Panel and estimator are frozen before measurement; no member added and no correction changed after the data is seen.
  heuristic_assumptions:
    - id: HEUR-1
      statement: >-
        ESTIMATOR ADEQUACY. For every panel member pi with fiber-size profile f and every
        k <= 8, the Miller-Madow-corrected plug-in estimator of D_k over N = 10^7 samples has
        bias below 0.01 bits and bootstrap standard error below 0.02 bits. FOR ALL panel
        members, FOR ALL k <= 8, at the tested primes.
      rigorous_support: >-
        The rigorous half is the standard plug-in entropy bias bound O((|S|-1)/(2N ln 2)) with
        the Miller-Madow correction; the heuristic half is that the empirical support size
        behaves like the nominal one, which fails exactly when a member has heavy-tailed fibers.
      validation_plan: >-
        Run the estimator on synthetic distributions with KNOWN entropy matched to each panel
        member's fiber profile, at N/10, N and 10N, reporting measured bias and variance against
        the analytic values. Sampled parameters recorded per cell.
      falsification_condition: >-
        Measured bias exceeds 0.01 bits or standard error exceeds 0.02 bits for any member at
        N = 10^7, in which case that member's defect is reported as an interval only and is
        excluded from comparison at the declared margin.
    - id: HEUR-2
      statement: >-
        SAMPLING SUFFICIENCY IN PLACE OF ENUMERATION. For primes above the enumerable range,
        uniform sampling of (X, Y) from <P> yields a defect estimate differing from the
        exhaustive value by below 0.02 bits. FOR ALL panel members at the primes where
        enumeration is infeasible.
      rigorous_support: >-
        At the small end of the sweep <P> IS enumerable, so sampled and exhaustive values are
        directly comparable; the heuristic is only that the agreement observed there persists
        upward.
      validation_plan: >-
        At the two smallest primes compute both the exhaustive and the sampled defect for every
        member and report the difference; carry that measured difference forward as the stated
        transfer assumption for larger primes.
      falsification_condition: >-
        The exhaustive-versus-sampled difference exceeds 0.02 bits for any member at the small
        primes, forbidding comparison of sampled values at larger primes against the null at the
        declared margin.
    - id: HEUR-3
      statement: >-
        TOY-TO-CRYPTO SIGN TRANSFER. The SIGN of (D_k(pi) - null_k(pi)), not its magnitude, is
        stable in log p: a member matching the null at 16-28 bits matches it at cryptographic
        size. FOR ALL panel members, the fitted trend of (D_k - null_k) against log p is flat
        within the measurement interval.
      rigorous_support: >-
        NONE beyond the recalled square-root-cancellation heuristic for character sums over curve
        points, which predicts the null for P2, P3 and P9 at all sizes. This is the weakest
        assumption in the record. NOTE the direction of the toy-scale bias, inherited from
        df906f's disclosure: at 16-24 bits a small-codomain projection's image is a far larger
        fraction of <P> than at 256 bits, which biases the measurement TOWARD apparent
        propagation, i.e. toward a FALSE POSITIVE. A toy-scale null is therefore the conservative
        outcome and a toy-scale positive needs the field-bit ladder to be believed at all.
      validation_plan: >-
        Sweep at least 6 primes from 2^16 to 2^28, fit (D_k - null_k) against log p per member,
        and report the slope with its CI. A slope indistinguishable from zero across the sweep is
        the only evidence offered for transfer, and it is weak evidence.
      falsification_condition: >-
        Any member's (D_k - null_k) shows a monotone trend in log p whose CI excludes zero,
        refuting sign transfer for that member and confining its result to the tested primes.
  proof_search_map:
    bottleneck: >-
      Not a computational bottleneck but an evidentiary one, and it is now sharper than the
      earlier draft stated. df906f settles the EXACT regime by theorem. What no record settles is
      the PROBABILISTIC regime for the projections an attack actually uses -- the walk partition
      index and the non-algebraic factor-base window. Those two numbers are the bottleneck.
    baseline_embedding:
      parameter_slice: >-
        The binary lossy-projection test of inventor-protocol section 2 is the boundary case
        D = 0 versus D > 0, and df906f's theorem says the D = 0 side contains only injective and
        constant maps. Every hand verdict the protocol has produced must be reproduced by the
        functional at that boundary, and the (Delta, Pi) example from KN-LIT-7595 must return
        D = 0 when transcribed to the estimator.
      reproduction_check: >-
        Frozen fixture: the characteristic-2 (Delta, Pi) example returns D = 0.000, and P0 returns
        D = 0.000. Symbolic: P1 returns exactly 1.000 by the unordered-pair argument. Additional
        fixture inherited from df906f: on a deliberately COMPOSITE-order group the reduction to
        the large-prime part is lossy AND exactly propagating, so it must return D = 0.000 -- this
        is the slice where rigidity's hypothesis is dropped, and an estimator that cannot
        reproduce it has not identified primality as load-bearing.
    observation_collision:
      observable: The propagation defect D_k(pi) in bits, reported with the fiber size.
      distinct_preimage_search: >-
        The collision the design already exhibits: P0 (lossless, useless because nothing is
        discarded) and a hypothetical perfect tracked object (lossy, deterministic) BOTH return
        D = 0. Defect alone does not identify usefulness, so the reported observable is the PAIR
        (D_k, log2 of fiber size). df906f's theorem sharpens this: the second element of the pair
        being large forces the first to be positive, so the pair is not merely informative but
        constrained, and a reported (0, large) is a proof of implementation error.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold D_k fixed and vary the fiber size; the intrinsic invariant distinguishing the
          resulting objects is the compression ratio log2|<P>| / log2|S|.
        predicted_gain: >-
          No cost gain. The gain is that a lossless re-coordinatisation can no longer be mistaken
          for a tracked object, which is the failure mode P7 is planted to catch.
      - transform: stronger_invariant
        proposed_object: >-
          The k-step defect vector (D_1, ..., D_8) rather than D_1 alone, since a projection can
          be one-step-lossy and still multi-step-usable if the ambiguities fail to compound.
        predicted_gain: >-
          Diagnostic only: the difference between "propagates" and "propagates far enough to
          matter", which is the third axis inventor-protocol section 1 requires.
    quantifier_order: >-
      The claim under test: FOR ALL pi in the declared panel, FOR ALL k <= 8, D_k(pi) equals the
      closed-form null within the declared margin -- EXCEPT P1, for which D_1 = 1 exactly. The
      existential this record CANNOT settle is: THERE EXISTS a projection outside the panel with
      D below the null. The panel is finite and declared, so a null over it refutes nothing about
      projections in general. What IS settled, by df906f rather than by this record, is the
      stronger and cleaner statement that no lossy projection anywhere has D = 0.
    method_ceiling:
      strongest_certifiable_claim: >-
        A scoped statement: over exactly ten declared projections, six primes from 2^16 to 2^28,
        and k <= 8, the measured propagation defect matches the closed-form random-relabelling
        null to within the declared margin. It can NEVER certify that no cheap projection of
        E(F_p) leaks.
      nearby_object_control: >-
        The nearby object on which the desired conclusion must FAIL is P1, the Kummer quotient,
        which genuinely propagates at exactly 1 bit. A second, inherited from df906f, is the
        composite-order group with its large-prime-part projection, where a lossy projection
        propagates EXACTLY -- the case rigidity excludes. A method that cannot separate either
        pair has not identified the load-bearing structure.
    proof_obligations:
      - claim: On a prime-order group every exactly-propagating projection is injective or constant.
        responsibility: correctness
      - claim: D(P1) = 1 bit exactly, from the biquadratic differential-addition relation.
        responsibility: correctness
      - claim: The random-relabelling null defect is a closed form in the fiber-size profile.
        responsibility: baseline
      - claim: Miller-Madow-corrected plug-in entropy has bias below 0.01 bits at N = 10^7 for every panel fiber profile.
        responsibility: correctness
      - claim: D_{k+1} <= D_k + D_1, with the realised gap reported rather than assumed.
        responsibility: strictness
      - claim: The composite-order fixture returns D = 0, confirming primality is what the theorem uses.
        responsibility: feasibility
      - claim: A null over a finite declared panel establishes nothing about projections outside it.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: propagation_defect_D1_per_panel_member_minus_closed_form_null
      direction: different
      minimum_effect: >-
        PRE-COMMITTED. Forced values: P0 = 0.000 +- 0.01; P1 = 1.000 +- 0.01; P7 information gain
        = 0.000 +- 0.01. All other members predicted to match the null within 0.05 bits. A member
        below the null by >= 0.15 bits, reproducible at two primes and surviving the structural
        tell, is the positive signal.
    - metric: survival_depth_per_panel_member
      direction: different
      minimum_effect: 'predicted 0 for every member except P1, which is unbounded at 1 bit per step; any member with depth >= 2 is a lead'
    - metric: k_step_defect_gap_below_chain_rule_bound
      direction: lower
      minimum_effect: >-
        A member whose D_8 sits at least 0.5 bits below D_1 * 8 has non-compounding ambiguities
        and is a lead even if D_1 matches the null.
    - metric: rho_partition_defect_vs_partition_count_r
      direction: higher
      minimum_effect: 'must increase toward the null as r goes 16 -> 32 -> 64; flat in r is the artifact signature'
    - metric: composite_order_fixture_defect
      direction: different
      minimum_effect: 'forced value: 0.000, the slice where rigidity''s hypothesis is dropped; a nonzero value means the estimator cannot see exact propagation'
    - metric: estimator_bias_against_synthetic_known_entropy
      direction: lower
      minimum_effect: 'forced value: below 0.01 bits, else that member reports an interval only'
    - metric: exhaustive_vs_sampled_defect_difference_at_small_primes
      direction: lower
      minimum_effect: 'forced value: below 0.02 bits, else sampled values may not be compared to the null'
  minimal_test:
    design: >-
      Six primes from 2^16 to 2^28 with n = #E(F_p) prime, three curves per prime. For each
      curve: enumerate or sample N = 10^7 pairs (X, Y) uniform in <P>; evaluate all ten panel
      members; estimate D_1 through D_8 with Miller-Madow correction and bootstrap CIs; compute
      the closed-form null from each member's exact fiber-size profile; and simulate the null at
      the same N. Run the estimator against synthetic known-entropy distributions matched to each
      fiber profile. Run the composite-order fixture inherited from df906f, which must return
      D = 0. At the two smallest primes compute the exhaustive defect and compare to the sampled
      one. Run the MANDATORY MATCHED CONTROLS: Pollard rho and BSGS on one instance per prime,
      reported in group operations and memory, so the P8 partition defect -- the projection an
      actual walk uses -- is priced against the walk it prices. Optional CONTRAST arm over
      F_{p^2} with a Frobenius-based member, labelled CONTRAST and never used as prime-field
      evidence. Total: 10^7 samples x 10 members x 8 depths x 18 curves is a few CPU-hours with
      vectorised field arithmetic; entropy estimation is trivial beside it.
    controls:
      - 'MANDATORY MATCHED CONTROL: Pollard rho on one instance per prime, group operations and memory reported.'
      - 'MANDATORY MATCHED CONTROL: BSGS on the same instance, with its sqrt(n) memory reported alongside.'
      - 'N1 closed-form random-relabelling null per member, plus its simulation at the same N.'
      - 'N2 forced-value Kummer positive control at exactly 1.000 bit.'
      - 'N3 lossless traps P0 and P7, both forced to zero information gain.'
      - 'N4 structural tell: P8 defect must rise toward the null as r increases.'
      - 'N5 composite-order fixture (df906f) forced to D = 0, isolating primality as the theorem''s load-bearing hypothesis.'
      - 'Synthetic known-entropy calibration of the estimator per fiber profile.'
      - 'Exhaustive-versus-sampled agreement at the two smallest primes.'
      - 'Three curves per prime, so a per-curve accident is separable from a per-prime effect.'
    required_metrics:
      - D_1_through_D_8_per_panel_member_per_curve_with_bootstrap_ci
      - closed_form_null_defect_per_panel_member
      - simulated_null_defect_and_its_disagreement_with_the_closed_form
      - fiber_size_profile_and_compression_ratio_per_panel_member
      - survival_depth_per_panel_member
      - chain_rule_gap_D_8_versus_8_times_D_1
      - rho_partition_defect_versus_r
      - composite_order_fixture_defect
      - estimator_bias_and_variance_against_synthetic_known_entropy
      - exhaustive_versus_sampled_difference_at_small_primes
      - matched_pollard_rho_and_bsgs_cost_and_memory
  falsification_conditions:
    - P1 does not return 1.000 +- 0.01 bits, so the estimator cannot detect exact multivalued propagation and the run is void.
    - P0 or P7 returns nonzero information gain, so the estimator manufactures signal from a lossless re-coordinatisation and the run is void.
    - The composite-order fixture does not return 0.000, so the estimator cannot see exact propagation even where it provably exists.
    - Any LOSSY panel member returns D = 0.000, which contradicts df906f's rigidity theorem and is an implementation error until independently replicated; degenerate fiber occupancy is the likeliest cause.
    - The simulated null disagrees with the closed-form null by more than 0.02 bits, so the fiber-profile arithmetic or the estimator is wrong.
    - Estimator bias against synthetic known entropy exceeds 0.01 bits for a member, demoting it to an interval-only result.
    - Exhaustive and sampled defects differ by more than 0.02 bits at the small primes, forbidding comparison of sampled values to the null.
    - Every panel member matches the null within 0.05 bits at every depth and every prime. THIS IS THE EXPECTED OUTCOME and it is a measured obstruction, not a failure.
    - The P8 defect is flat in r, marking the measurement an artifact.
    - Any member's (D_k - null_k) trends monotonically in log p with CI excluding zero, refuting HEUR-3.
  confounders:
    - Entropy estimators are biased downward on finite samples, biasing every member TOWARD looking structured; the synthetic calibration arm exists for this and does not eliminate it.
    - Toy-scale image ratio, inherited from df906f's disclosure: at 16-24 bits a small-codomain projection's image is a much larger fraction of <P> than at 256 bits, biasing toward a FALSE POSITIVE. The field-bit ladder is the only available defence and it is a weak one.
    - Panel members are not independent -- P4, P5 and P6 all read the integer representative of x -- so a shared artifact would appear in several members at once and must not be counted as replication.
    - A defect below the null could reflect the estimator's interaction with a heavy-tailed fiber profile rather than curve structure; fiber profiles are reported alongside every defect.
    - The optional F_{p^2} contrast arm is not prime-field evidence, and KN-LIT-002's warning against borrowing extension-field asymptotics applies to borrowing extension-field defect values too.
    - P9's window [0, B) is one non-algebraic factor base among many; a null on P9 says nothing about other window shapes and must not be cited as settling H-PSEUDO.
    - Small primes compress the range of depths over which compounding can be observed.
  interpretation_limits:
    - TOY TIER. Every number is scoped to the six primes, three curves per prime, the ten declared panel members and k <= 8. HEUR-3 is the transfer assumption and it is weak by construction.
    - A null over the panel is NOT a closure over projections in general. What IS general is df906f's theorem, which belongs to that record.
    - This record does not settle, support or contradict the H-PSEUDO flatness question. P9 is a proxy and is labelled as one.
    - D = 0 alone does not mean useful; the (defect, fiber size) pair is the reported observable, and P0 is the standing reminder of why.
    - P1's success is a known constant-factor sqrt(2) in rho and is not a lead. It is the calibration that prices what any other member's defect would be worth.
    - Priority for the rigidity theorem and for the propagation-defect instrument concept belongs to IDEA-20260807-df906f. This record adds a disjoint panel and two instrument changes, and an earlier draft that claimed more has been retracted in claim (B).
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. The measurement is polynomial in the sample count and
      independent of any attack. Stated plainly because the profile demands it: the best-case
      outcome of THIS record improves no exponent, and its priority rests on being the gate every
      object-first family must pass and on pricing the two projections an actual attack uses.
    memory_exponent: >-
      Memory exponent 0: streaming entropy estimation holds only the fiber histogram, at most
      p^{1/2} entries for P9 and O(1) for the rest.
    best_known: >-
      For the FUNCTIONAL, the incumbent is now IDEA-20260807-df906f's bucket-collision defect on
      the division-polynomial ladder -- this record does not beat it, it applies a variant to a
      disjoint panel. For the PROBLEM the incumbents remain Pollard rho at n^{1/2+o(1)} time and
      O(1) memory and BSGS at n^{1/2} time and n^{1/2} memory, with Shoup's Omega(sqrt n) generic
      lower bound; both are reported as matched controls so the numbers are never stated in
      isolation.
    hidden_overhead: >-
      What hides in the o(1) of any future exponent claim built on a leak found here, and is NOT
      measured: the cost of converting a measured bit of leakage into an algorithmic advantage,
      which for a defect epsilon below the null is at best a factor 2^{epsilon*k} over k steps
      and is easily absorbed by the cost of computing the projection at all. A leak of 0.15 bits
      is not 0.15 bits of speedup. IDEA-20260817-1e0111 is the record that prices this properly
      and its conclusion is that the pruning ratio, not the defect, is the quantity that converts.
    tradeoff_note: >-
      Not applicable to the measurement. For the incumbents the relevant frontier row is van
      Oorschot-Wiener, wall clock n^{1/2}/m at memory w with total work unchanged; panel member
      P8's defect is exactly the quantity that would have to move for any walk-based improvement
      on that row, which is why P8 is in the panel.
  dominated_by: >-
    n/a (no result claimed) on the attack frontier, after a row-by-row check; but NOT independent
    of IDEA-20260807-df906f on the object frontier, and that is recorded rather than deferred.
    Attack rows checked individually for prime-field ECDLP, n prime, generic short-Weierstrass,
    single instance, classical: (1) Pollard rho, n^{1/2+o(1)} / O(1); (2) BSGS, n^{1/2} /
    n^{1/2}; (3) vOW parallel rho, n^{1/2}/m wall clock at memory w, total work n^{1/2};
    (4) kangaroo / Gaudry-Schost / Galbraith-Ruprai -- not applicable, no interval;
    (5) Pohlig-Hellman -- not applicable, n prime; (6) MOV / Frey-Ruck -- not applicable, large
    embedding degree; (7) SSSA anomalous -- not applicable, n != p; (8) GHS / Weil descent /
    Gaudry -- not applicable over a prime field per KN-LIT-002; (9) Semaev over F_p -- no proven
    advantage, not a dominating row; (10) preprocessing S*T^2 = N -- not applicable, no advice;
    (11) Kuhn-Struik sqrt(nL) -- not applicable, single instance; (12) Shor -- out of scope. An
    information functional is a point on none of these. ON THE OBJECT AXIS: df906f dominates this
    record on generality, since its theorem covers ALL lossy projections while this panel covers
    ten, and this record is not dominated only on panel coverage and on the closed-form null.
  sota_delta: >-
    no attack; measurement contribution only, and smaller than the earlier draft claimed.
    Quantitative deliverable: ten defect curves D_1..D_8 with bootstrap CIs, each against a
    CLOSED-FORM null, at six primes and three curves per prime; four forced-value control
    readings (P0 = 0.000, P1 = 1.000, P7 = 0.000, composite-order fixture = 0.000); a survival
    depth per member; and measured estimator bias against synthetic known entropy. Against the
    state df906f leaves -- exact regime settled by theorem, probabilistic regime measured for ONE
    object family -- the delta is roughly 180 defect measurements over a DISJOINT panel, of which
    the two that matter are the rho partition index and the non-algebraic factor-base window,
    neither of which any record I read has measured.
  planned_obstruction_record:
    note: >-
      NOT named `obstruction`; no measurement exists yet. This is the block the run would fill.
    statement: >-
      About the OBJECT: "Given IDEA-20260807-df906f's rigidity theorem, which forbids any
      exactly-propagating lossy projection on a prime-order subgroup, every O(1)-cost projection
      of E(F_p) in this disjoint ten-member panel -- including the r-adding walk's partition
      index and the non-algebraic factor-base window -- has one-step propagation defect equal to
      the random-relabelling null within 0.05 bits and survival depth 0, while the Kummer
      quotient attains the rigidity floor at exactly 1.000 bit and buys only a constant-factor
      sqrt(2)."
    quantity: One-step and k-step propagation defect D_k(pi) minus the closed-form null, in BITS, per panel member; and the survival depth, an integer.
    value: TO BE MEASURED; reported per member per prime with bootstrap 99 percent CIs and the estimator's calibrated bias, units = bits.
    scope: Ten declared projections excluding division polynomials, six primes 2^16 to 2^28, three curves per prime, k <= 8, N = 10^7 sampled pairs, n prime.
    resource_check_plan: >-
      The reversal to run at closure: a measured zero-leakage spectrum, combined with df906f's
      theorem, is the HYPOTHESIS of any argument that a prime-field curve behaves like a generic
      group under cheap observation -- what a scoped generic-model security statement for
      concrete curves would consume, and what the H-PSEUDO flatness question would want as
      empirical input in place of a proof-method count. The Kummer datum is separately a
      resource: a projection at the rigidity floor buying only sqrt(2) is the exchange rate
      between defect and speedup, and it prices every future candidate in one number. The check
      may fail; "examined: true, no theory takes it up" is complete and honest.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    That the four forced-value controls behave (P0 = 0, P1 = 1, P7 = 0, composite fixture = 0):
    0.85, and if any fails the run is void, which is the point of having them. That the
    closed-form and simulated nulls agree within 0.02 bits: 0.9. That estimator bias calibrates
    below 0.01 bits at N = 10^7 for every member: 0.7, with P9's large codomain the main risk.
    That ANY panel member shows a defect >= 0.15 bits below the null surviving the nulls and the
    structural tell: 0.05, revised DOWN from 0.07 in the earlier draft because df906f's rigidity
    theorem plus its own predicted null on a different family is evidence in the same direction.
    That such a member also has survival depth >= 2: 0.3 conditional. That any leak converts to
    an algorithmic advantage: 0.1 conditional, and IDEA-20260817-1e0111 is where that conversion
    is priced. Probability the run yields a calibrated instrument plus a measured obstruction
    block over a panel no record has covered: 0.8. The panel and the instrument are the reason
    for the ranking, not the lead.
