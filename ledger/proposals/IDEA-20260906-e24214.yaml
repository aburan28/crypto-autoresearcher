    "claim": "A certified Frobenius matrix on E[ell^e] determines the extension degrees at which each torsion invariant factor becomes rational; these degrees can differ from the pairing-value embedding degree and from each other. A module-level certificate can therefore expose an uncharged torsion-acquisition extension.",
    "mechanism": "For ell!=p, track Smith invariants of F^k-I over Z/ell^e. They determine fixed-submodule size and rank for each k. Combine them with exact multiplicative-order certificates for p modulo the target subgroup order and with twist transport only where the map is certified. The representation is a partial-action quotient under Frobenius/base extension, not under arbitrary group translation. Nonsemisimple F at repeated eigenvalues is preserved. For ell=p the etale rank-two model is inapplicable: the Anomalous curve is explicitly a separate additive-transfer control and must never enter this matrix test.",
