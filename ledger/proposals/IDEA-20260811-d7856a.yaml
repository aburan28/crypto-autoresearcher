idea:
  id: IDEA-20260811-d7856a
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  title: >-
    IS THE DEGENERATION DIVISOR A PROPERTY OF THE CURVE OR OF THE COORDINATE?
    Translate the x-line by a constant - the one model change that EVERY curve
    admits, unlike Montgomery, Edwards, Hessian and Jacobi-quartic forms, which
    all require rational torsion the special-j curves may not have - and remeasure
    the support drop; the pre-registered prediction is that the drop VANISHES
    under any non-zero shift, which would demote the whole divisor from an
    intrinsic invariant to a property of the canonical short-Weierstrass
    normalisation, and would explain in one line why a 30.8% support drop moves
    no solver
  class: representation

  object: >-
    OBJ-SDD-COV, the covariance class of the degeneration divisor under changes
    of the degree-2 map E -> P^1 used to index the factor base. The tracked
    object is the FUNCTION from a choice of x-coordinate to the divisor it
    induces on the j-line. If that function is constant the divisor is intrinsic;
    if it is not, the divisor is an artifact of a coordinate choice and its
    correct name is "the degeneration divisor of the short-Weierstrass
    x-coordinate", which is a strictly weaker object and must be cited as such.

  resource: >-
    R2 exactly - the curve equation and model, which is the resource this lane
    names first and which is the ONLY resource in DECOMPOSITION.md's taxonomy
    that a coordinate change consumes. H-ENDO-001 admissibility: no endomorphism
    acts on any point of G.

  claim: >-
    (A) THE MODELS THAT EXIST, AND THE ONE THAT ALWAYS DOES. A change of curve
    model is not free. Montgomery form B y^2 = x^3 + A x^2 + x requires a rational
    point of order 2; Edwards form requires a point of order 4; Hessian form
    requires a point of order 3; Jacobi quartic requires a rational 2-torsion
    point. NONE of these is guaranteed for a curve on a degeneration locus, whose
    2-torsion and 3-torsion are unconstrained by the locus condition. Existence of
    the alternative model is itself a curve-dependent condition, so a naive
    model-comparison design silently conditions on torsion and compares
    non-comparable subfamilies. THE ONE CHANGE EVERY CURVE ADMITS OVER F_p FOR
    p > 3 is the affine translation of the x-line, x -> x + c, which carries the
    short Weierstrass model y^2 = x^3 + a x + b to the general depressed-free
    model y^2 = x^3 + 3c x^2 + (a + 3c^2) x + (b + a c + c^3). It is available for
    every curve, every c, and every p, and it changes the factor base window by a
    translation and nothing else. That is the design's independent variable.
    (B) THE PREDICTION, STATED WITH A DIRECTION AND A NUMBER. Let
    D(c) = supp(S_4 in the translated coordinate, generic curve) minus
    supp(S_4 in the translated coordinate, curve on locus L). At c = 0 the
    committed values give D(0) = 48 for L = {a^3 + 8b^2 = 0} and 36, 6, 6, 4, 1
    for the others, and 248 and 214 for a = 0 and b = 0. PREDICTION: D(c) = 0 for
    EVERY non-zero c and every one of the eight loci - the drop disappears
    entirely under an arbitrarily small translation. Basis: the vanishing
    coefficient blocks are blocks of the a- and b-graded coefficients of the
    DEPRESSED cubic; a translation reintroduces an x^2 term and redistributes
    those coefficients, so a block that vanished identically no longer does. THIS
    IS A PREDICTION THAT CAN FAIL: if D(c) stays positive for all c, the
    degeneration is coordinate-independent and the object is genuinely intrinsic,
    which would be a much stronger finding than anything else in this batch.
    (C) THE INTERPRETIVE CONSEQUENCE, WHICH IS THE REAL DELIVERABLE. If D(c) = 0
    for c non-zero, then the entire lane's "special j" support phenomenon -
    including the committed 13 -> 9 and 13 -> 10 drops at j = 0 and j = 1728 - is
    a statement about the canonical normalisation, not about the curve, and the
    campaign gains the missing half of its lossy-projection explanation: a
    support drop that a translation destroys cannot be visible to a solver whose
    cost is translation-covariant. Combined with the predicted O-INTERIOR of
    IDEA-20260811-97e244 this gives TWO independent reasons the drop is
    cost-invisible, which is what a closure at the inventor-protocol standard
    needs.
    (D) THE SECONDARY ARM, RUN ONLY WHERE IT EXISTS AND REPORTED SEPARATELY. For
    those special-j curves that DO admit a Montgomery or Jacobi-quartic model at
    a given p - a condition to be tested per curve and reported, never assumed -
    compute the corresponding summation polynomial's support and ask the same
    question. This arm is exploratory, is explicitly conditioned on torsion, and
    may not be pooled with arm (B).

  mechanism: >-
    Support is not an invariant of a polynomial; it is an invariant of a
    polynomial together with a choice of coordinates. The short Weierstrass model
    is a canonical choice, so support is well defined on the j-line, and that is
    why the divisor exists at all. But cost functionals of a solver are computed
    after the algorithm has chosen its own coordinates - and translating the
    x-window is exactly the kind of freedom an implementation has. The mechanism
    predicted here is that the degeneration lives entirely in the a2 = 0
    normalisation and is destroyed by the smallest departure from it, which makes
    it a real fact about a canonical form and a non-fact about the algorithm.

  novelty_status: adaptation
  novelty_note: >-
    Model-dependence of algebraic ECDLP formulations is the whole subject of lane
    L11 / RQ-MODEL-e61cb2 in DECOMPOSITION.md, and that lane's decisive test is
    "same curve, same points, same factor base, five models, identical
    measurement". THIS RECORD IS NOT THAT TEST. Its dependent variable is the
    j-line DIVISOR, not solving degree; its independent variable is a
    one-parameter translation rather than five named models; and its purpose is
    to decide whether an object discovered in this lane is intrinsic, not to
    optimise a solver. The torsion-existence obstruction in (A) is, as far as
    corpus grep shows, not stated in any record. External literature NOT checked.
  not_a_duplicate_of: >-
    NOT the L11 model comparison (RQ-MODEL-e61cb2), for the reasons above. NOT
    IDEA-20260808-2e14f7, which changes the DEGREE of the map E -> P^1 from 2 to
    d and lives under RQ-ECDLP-002; this record keeps degree 2 and moves only the
    base point of the line, which is the minimal possible perturbation and
    therefore the sharpest test of intrinsicness. NOT IDEA-20260807-477e40, which
    measures support in one fixed coordinate.

  assumptions:
  - >-
    The committed support values (13/9/10 at m = 3, 439 with the eight-block
    stratification at m = 4) are correct; re-derived as gate 1.
  - >-
    p > 3 so that the depressed form and the translation are both available and
    the derivative arguments are valid.
  - >-
    Semaev polynomials for the general model y^2 = x^3 + a2 x^2 + a4 x + a6 are
    obtained either from the published general construction or by direct
    substitution x_i -> x_i + c into the depressed S_m. THE SECOND ROUTE IS
    PREFERRED because it is provably the same polynomial system re-expressed, and
    the contract must state which route it used and verify they agree.

  proof_search_map:
    bottleneck: >-
      The bottleneck is the definition of the object: unless the divisor is shown
      to be coordinate-covariant in a stated way, every downstream statement
      about "special j" is ambiguous between a curve property and a normalisation
      property.
    baseline_embedding:
      parameter_slice: >-
        c = 0 is the exact baseline slice and must reproduce the committed
        numbers: 13 generic, 9 at a = 0, 10 at b = 0 for S_3, and 439 with the
        391/403/433/433/435/438 values at m = 4.
      reproduction_check: >-
        Symbolic re-derivation at c = 0 in two engines against the
        source_sha256-bound committed values.
    observation_collision:
      observable: The support count in a chosen coordinate.
      distinct_preimage_search: >-
        PERFORMED AND POSITIVE, AND IT IS THE FINDING. The predicted outcome IS a
        collision: at c non-zero, the special-j curve and the generic curve share
        the observable while differing in the underlying object. That collision
        is a direct falsifier of the identifiability of "special j" FROM SUPPORT
        ALONE, and the additional condition that separates them is precisely the
        canonical normalisation a2 = 0 - which the record then states explicitly
        as part of the object's name.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        Hold the curve fixed and vary the forgotten structure - the coordinate c.
        The fibre of the support map over a given curve is a function of c, and
        its non-constancy is exactly the demotion argued in (C).
      predicted_gain: >-
        Converts an ambiguity into a named scope qualifier that every future
        citation of the divisor must carry.
    quantifier_order: >-
      FOR ALL curves E on a degeneration locus and FOR ALL c not equal to 0,
      supp(S_m in coordinate x + c) equals the generic value. The existential
      that would break it is THERE EXISTS a locus whose drop survives all
      translations, which would make the divisor intrinsic. Note the quantifier
      is over c, a quantity the ALGORITHM chooses - which is why a
      c-dependent property cannot be an attack surface.
    method_ceiling:
      strongest_certifiable_claim: >-
        That the support drop is or is not invariant under the translation
        subgroup of coordinate changes, at m = 3 and m = 4, exactly. It CANNOT
        certify invariance under the full group of admissible model changes,
        because most of those changes do not exist for most curves - which is the
        record's own limb (A).
      nearby_object_control: >-
        The nearby object where the conclusion fails is the singular-locus
        dimension of IDEA-20260811-34f29d, which IS invariant under any change of
        coordinates. Running both on the same curves and finding that support
        moves while Sing does not is the clean demonstration that the method has
        identified the coordinate as the load-bearing structure; finding that
        both move together would refute this record's mechanism.
    proof_obligations:
    - claim: c = 0 reproduces the committed support values
      responsibility: baseline
    - claim: D(c) = 0 for all non-zero c
      responsibility: correctness
    - claim: The translated polynomial is the same system re-expressed
      responsibility: interface
    - claim: The torsion condition for each alternative model is tested per curve
      responsibility: scope

  predictions:
  - metric: support_drop_at_nonzero_shift_m3
    direction: lower
    minimum_effect: >-
      EXACTLY 0 for every non-zero c tested, at both a = 0 and b = 0, i.e. the
      special curve and the generic curve have IDENTICAL support in the shifted
      coordinate. A residual drop of even one monomial at any c is a
      pre-registered positive.
  - metric: support_drop_at_nonzero_shift_m4
    direction: lower
    minimum_effect: >-
      EXACTLY 0 for every non-zero c at all six weight-12 loci.
  - metric: generic_support_growth_under_shift
    direction: higher
    minimum_effect: >-
      The GENERIC support must INCREASE under a non-zero shift (a translation
      densifies a depressed cubic). Reported as a sanity metric: if generic
      support does not increase, the substitution is not being applied and the
      zero drop would be an artifact of a no-op.
  - metric: fraction_of_special_j_curves_admitting_a_montgomery_model
    direction: different
    minimum_effect: >-
      Reported, not predicted. Roughly half of curves have a rational 2-torsion
      point; the exact fraction among the twelve special curves at each of three
      primes is the arm-(D) eligibility record and prevents the secondary arm
      from being read as a matched comparison.
  - metric: c_threshold
    direction: different
    minimum_effect: >-
      Reported: the number of distinct non-zero c at which the drop is zero, out
      of at least 20 seeded random c per curve plus the structured choices
      c = 1, c = -1 and c a root of the curve cubic. The last is named because it
      is the ONE shift with a geometric meaning (it moves a 2-torsion x-coordinate
      to the origin) and is the most likely place for the prediction to fail.

  minimal_test:
    design: >-
      EXACT SYMBOLIC, NO SAMPLING OF POINTS, NO TIMING. (1) Reproduce the
      committed c = 0 supports. (2) For each of the eight loci pick one curve, and
      pick one generic control curve at the same p. (3) For c in a declared set -
      {1, -1, a root of x^3 + a x + b if one exists in F_p, and 20 seeded random
      values} - substitute x_i -> x_i + c into S_3 and S_4, expand, and count
      support for both the special and the control curve. (4) Report D(c) per
      curve per c. (5) Verify by an independent route that the translated
      polynomial defines the same decomposition relation, by checking that a
      known decomposition of a random point satisfies it. (6) Run arm (D) only on
      curves whose torsion admits the model, reported separately and never
      pooled.
    controls:
    - >-
      C-BASELINE. c = 0 reproduces 13/9/10 and the m = 4 eight-block values.
    - >-
      C-NOOP. c = 0 supplied through the same substitution machinery as the
      non-zero values, to prove the machinery is not itself changing the
      polynomial.
    - >-
      C-SEMANTIC. For each translated polynomial, verify on 100 random triples of
      factor-base points with a known sum that the translated relation holds. A
      translation that breaks the relation is an implementation error and every
      support count from it is void.
    - >-
      C-GENERIC-CONTROL. Every special-curve measurement is paired with a
      generic-curve measurement at the SAME c, since the generic support itself
      changes with c and only the DIFFERENCE is meaningful. Reporting a special
      curve's absolute support at c non-zero without its paired control is
      forbidden by the contract.
    required_metrics:
    - support_count_special_and_control_per_locus_per_c_per_m
    - support_difference_D_of_c
    - generic_support_growth_curve
    - semantic_check_pass_rate
    - torsion_eligibility_per_special_curve_for_each_alternative_model

  lossy_projection_answer: >-
    THIS RECORD ATTACKS THE PROJECTION ITSELF RATHER THAN ITS CONSEQUENCES. The
    protocol demands that what a projection discards be discarded COMPATIBLY with
    the target's operations. Support discards coefficient values; the question is
    whether the retained part propagates under the operations the ALGORITHM
    performs, and one of those operations is choosing where to put the origin of
    the factor-base window. If the retained part does not survive a translation,
    the projection is incompatible with the algorithm's own freedom, and it is
    then no surprise at all that a 30.8% support drop produced a -0.44% timing
    change. That is a mechanism for the committed anomaly, and it is testable in
    minutes.

  t5_reachability_answer: >-
    NOT ENGAGED AND CANNOT BE. Under the predicted outcome there is no property
    to reach: the drop is a description of a coordinate rather than a feature of
    a vertex. Under the falsifying outcome - a translation-invariant drop - T5 is
    handed to IDEA-20260811-3e08e0's census, which bounds the reachable set at
    twelve classes per p regardless of how intrinsic the property turns out to be.

  null_object: >-
    C-GENERIC-CONTROL is the null of the same shape and it is the essential one:
    a generic curve put through the identical translation at the identical c. The
    predicted finding is a NULL DIFFERENCE, so the control is not an afterthought
    - it is the measurement. C-NOOP is the instrument null; C-SEMANTIC is the
    correctness gate.

  falsification_conditions:
  - >-
    D(c) stays non-zero for all tested non-zero c at any locus. The divisor is
    translation-invariant, hence a genuinely intrinsic feature of the curve, and
    this record's central prediction is falsified - the most valuable possible
    outcome and the one that would justify further investment in the object.
  - >-
    The generic support does not grow under a non-zero shift. The substitution is
    a no-op and every zero difference is meaningless.
  - >-
    C-SEMANTIC fails. The translated polynomial is not the same relation and no
    comparison is admissible.
  - >-
    c = 0 fails to reproduce the committed values. The instrument disagrees with
    committed data.
  - >-
    D(c) is non-zero for exactly the shift by a root of the curve cubic and zero
    otherwise. That would indicate the phenomenon is tied to 2-torsion rather
    than to the j-line, which is a different object entirely and would have to be
    reported as such - and it is named in advance so it cannot be discovered and
    then rationalised.

  confounders:
  - >-
    Torsion-conditioned model existence, in full. Any comparison across
    Montgomery, Edwards, Hessian or Jacobi models silently conditions on rational
    torsion, which correlates with the group structure and hence varies within an
    isogeny class. Arm (D) is reported separately for exactly this reason and may
    never be pooled with arm (B).
  - >-
    Expansion convention, as in every support measurement in this batch: the
    translated polynomial must be fully expanded under the same convention that
    produced the committed 439.
  - >-
    Field of the shift. c is drawn from F_p; over QQ the analogous statement is
    about QQ[a,b,c] and the contract should also perform the symbolic version in
    c as an indeterminate, which is stronger than any finite sample of c and
    should be attempted first.
  - >-
    A shift by c changes the factor-base window, so an ALGORITHMIC comparison
    would need to re-select the window. This record makes no algorithmic
    comparison and therefore does not incur that confounder, and says so to
    prevent the design being extended carelessly.

  interpretation_limits:
  - >-
    A confirmed prediction demotes the divisor to a property of the canonical
    normalisation. It does NOT show the divisor is uninteresting - it is still an
    exact, p-independent, checkable fact about a canonical form - and it does not
    retroactively invalidate any committed support measurement, all of which were
    correctly taken in that normalisation.
  - >-
    Translations are a subgroup, not the full model-change groupoid. Invariance
    under translation would not prove intrinsicness; non-invariance DOES prove
    non-intrinsicness. The asymmetry is stated because only one direction is
    conclusive.
  - >-
    claim_tier toy. No attack, no exponent, no speedup.

  heuristic_assumptions:
  - id: H1
    statement: >-
      NO DISTRIBUTIONAL HEURISTIC IS LOAD-BEARING. The primary computation can be
      done with c as a symbolic indeterminate over QQ[a,b,c], in which case the
      result is a theorem about all c at once and the sampled c are redundant.
    rigorous_support: >-
      Polynomial substitution and expansion are exact operations; support in the
      c-indeterminate ring specialises correctly to any particular c outside the
      finitely many where a coefficient in c vanishes.
    validation_plan: >-
      Attempt the symbolic-in-c computation first; if it exceeds budget, fall
      back to the sampled c and report the sample size and the fallback. The tail
      check is the structured shift c = a root of the cubic, which is exactly one
      of the finitely many c where a coefficient could vanish and is therefore the
      designated place for the symbolic result to be checked against a sample.
  - id: H2
    statement: >-
      The set of c at which a coefficient of the c-indeterminate expansion
      vanishes is finite and small, so a sample of 20 random c misses it with
      probability at least 1 - 20 d / p for a degree bound d.
    rigorous_support: >-
      Schwartz-Zippel applied to the coefficient polynomials in c, with d bounded
      by the total degree of S_m in the x variables times 1.
    validation_plan: >-
      Report the realised bound at p = 4001 and at one prime above 2^20; if the
      probability bound is weak at p = 4001, the symbolic route is mandatory
      rather than preferred, and the contract says which applied.

  target_complexity:
    time_exponent: NONE CLAIMED.
    memory_exponent: NONE CLAIMED.
    best_known: >-
      0.886*sqrt(N) group operations, O(1) memory (KN-TECH-001, KN-TECH-006);
      automorphism-discounted variant (KN-TECH-018).
    hidden_overhead: Not applicable.
    tradeoff_note: Not applicable.

  dominated_by: >-
    Every row of the attack frontier dominates - rho with distinguished points,
    BSGS, kangaroo, index calculus - checked against each; no solver is produced
    and no cost is measured.
  sota_delta: ZERO on every axis.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  expected_value: >-
    HIGH RELATIVE TO ITS COST, WHICH IS AMONG THE LOWEST IN THE BATCH. It is the
    single cheapest experiment that can demote or promote the entire object this
    batch is built around, and it does so with a mechanism rather than a
    correlation. I EXPECT THE DROP TO VANISH under translation, which is a
    negative for the object and a positive for the campaign's understanding of
    its own committed anomaly. If it does not vanish, this batch's other
    proposals become substantially more valuable and the coordinator should
    reprioritise accordingly - which is a good property for an early test to
    have.
