idea:
  id: IDEA-20260816-7fe6c0
  question_id: RQ-MAYO-001
  added: '2026-08-16'
  title: 'Measure what whipping buys before pricing what it costs: the rank distribution of MAYO''s
    signing linear system, the map x -> P-star-polar(v, x) restricted to the whipped oil space, as
    a function of the whipping factor k, against a matched uniform random matrix null of identical
    shape over the same field.'
  class: measurement
  claim: '(A) MAYO''s whipping factor k exists for one stated reason: the underlying UOV map has an
    oil space too small to sign with, and whipping k copies together makes the signing linear system
    solvable with high probability. That probability is a measurable quantity and this program has
    never measured it. Concretely, signing fixes a vinegar v and solves the linear system L_v : O-whipped
    -> F_q^m, L_v(x) = P-star-polar(v, x), a matrix of shape m by (k times o) over F_q. Its rank is
    a random variable over the choice of key and vinegar. (B) The claim under test is that this rank
    variable is statistically indistinguishable, at toy parameters, from the rank of a uniform random
    m by (k o) matrix over F_q, so that the retry probability of MAYO signing is exactly the classical
    q-analogue surjectivity deficit, 1 - prod_{i=0}^{m-1} (1 - q^{i - k o}), with no correction term
    attributable to the emulsifier or to the oil space. (C) The consequence, if (B) holds, is a closed-form
    and measured statement of what whipping buys, in the same currency as any claim about what it
    costs: the whole benefit of k is the surjectivity margin k o - m, and there is no structural residue
    in L_v beyond that integer. (D) NOT CLAIMED: nothing here is an attack, a forgery, a key recovery,
    a distinguisher on the public key, or a statement about any deployed MAYO parameter set. A measured
    deviation of the rank distribution from the random-matrix null would be an anomaly in the signing
    instrument, not a security consequence, and would be reported at toy tier as a number with its
    scope. No exponent is claimed in either direction, and a retry-rate measurement is explicitly
    not a timing or side-channel claim, since no implementation is exercised.'
  mechanism: 'STAGE 1, derivation with no compute. Write the whipped map''s polar form as P-star-polar(v,
    x) = sum over the emulsifier index of E-coefficients times per-block polar forms P-polar(v_i,
    x_j). Restricting x to the whipped oil space O^k gives a matrix over F_q of shape m by k*o whose
    entries are F_q-linear in v. This shape is forced by the parameter triple, and Part A of H-MAYO-2c6c34
    already fixes that triple as (n, m, o) -> (k n, m, k o); the present object is the rank of a specific
    matrix living in that shape, which the dilation identities do not determine. STAGE 2, exact enumeration.
    At the smallest cells one enumerates every vinegar v in F_q^{k n} and computes rank(L_v) exactly,
    giving the true rank histogram with no sampling error at all. STAGE 3, matched null. Draw the
    same number of uniform random m by k*o matrices over F_q and histogram their ranks in the identical
    code path. STAGE 4, discrimination. Compare the two histograms by exact total-variation distance
    and by an exact permutation test; the signal arm means something only if the null arm reproduces
    the classical q-rank law to within its own sampling envelope, which is itself a check on the instrument.
    STAGE 5, dependence on k. Sweep k upward at fixed (n, m, o) and check whether any deviation decays
    as k grows, per inventor-protocol section 3: a deviation that does not decay when the parameter
    that should wash it out increases is the signature of an artifact, not of structure.'
  novelty_status: unverified
  novelty_screen:
    method: Read ledger/questions/RQ-MAYO-001.yaml, RQ-UOV-001.yaml, RQ-QRUOV-001.yaml, RQ-SNOVA-001.yaml
      in full. Read ledger/hypotheses/H-MAYO-2c6c34.yaml, H-MAYO-c0ddab.yaml, H-UOV-4d1377.yaml headers.
      Ran grep -rilE 'mayo|snova|oil.and.vinegar|QR-UOV|whipping' over ledger/ knowledge/ docs/ and
      extracted the title of every hit in ledger/proposals/ (about 35 records). Ran targeted greps
      for 'signing', 'abort', 'retry', 'rank distribution', 'rank spectrum', 'false.positive', 'covariance',
      'second moment', 'commut', 'Weil', 'fibre', 'dose', 'composition table' over ledger/proposals/.
    results: 'The MAYO slice is dense on the key-recovery side: IDEA-20260805-258212 fixes whipping
      as a k-fold dilation of the parameter triple; IDEA-20260805-74e78c and IDEA-20260808-ae175e
      treat the emulsifier''s rank defect and the Kronecker factorization of the whipped public form;
      IDEA-20260808-f104a2 treats the whipped forgery system''s Macaulay rank; IDEA-20260805-977e16
      treats the underdetermination parameter alpha; IDEA-20260805-19990a and H-MAYO-c0ddab treat
      repeated vinegar seeds. The ''signing'' and ''abort''/''retry'' greps returned hits only outside
      this bucket (IDEA-20260805-2a669e, IDEA-20260813-6819af and similar, in other areas). No record
      in the multivariate slice measures the rank of the signing linear system itself or its retry
      probability, and no record states the surjectivity margin k*o - m as the measured content of
      whipping.'
    verdict: 'UNVERIFIED. This program cannot read external literature, so nothing is asserted about
      what is published. Assembled from known parts: the q-analogue rank law for uniform random matrices
      over F_q is textbook; the whipped polar form is written out in IDEA-20260805-74e78c and H-MAYO-2c6c34.
      Claimed new here, relative to the in-repo corpus only: treating the signing-side linear map
      as the tracked object at all, and pre-registering its rank histogram against a matched random-matrix
      null so that what whipping buys is measured in the same units as any later claim about what
      it costs.'
  object_first_candidate:
    tracked_object: 'The F_q-linear map L_v : O-whipped -> F_q^m given by x -> P-star-polar(v, x)
      at a fixed vinegar v, represented as an m by k*o matrix, and specifically its rank as a random
      variable over (key, vinegar).'
    lossiness: 'Genuinely lossy, and the loss is large and stated. From the pair (secret key, vinegar)
      we retain a single integer per sample. Discarded: the oil space itself, the emulsifier coefficients,
      the vinegar values, the entire kernel and image of L_v as subspaces, and every coordinate of
      the public map. What survives propagates because solvability of the signing step depends on
      L_v only through rank(L_v) >= m; the retry loop is a deterministic function of that one integer,
      so the projection is compatible with the operation being tracked. It is emphatically NOT a change
      of coordinates: an integer in {0..m} cannot reconstruct a matrix.'
    propagation: 'One step of the target operation is one signing attempt. It acts on the tracked
      object as: sample v, form L_v, accept if rank(L_v) = m, else resample v and repeat. Across the
      sweep in k, the propagation rule is that adding one whipped block appends o columns to L_v,
      so rank is nondecreasing in k for a nested column construction and the acceptance indicator
      is monotone. That monotonicity is itself a falsifiable prediction of the propagation rule.'
    survival_score: 'The object survives exactly as long as the linear algebra of one signing attempt:
      one step. It dissolves the moment two attempts are correlated through a shared vinegar seed,
      which is a different object and is H-MAYO-c0ddab''s, filed separately. Stated concretely: full
      structure for one attempt, zero carry-over between independent attempts, and the whole sweep
      is over k in a small range rather than over rounds.'
  null_object_control: The null object is a uniform random matrix over F_q of shape m by k*o, drawn
    and rank-computed in the identical code path in the same invocation, with the same RNG discipline
    and the same rank routine. For the signal arm to mean anything the null arm must reproduce the
    classical q-rank law prod_{i=0}^{m-1}(1 - q^{i-k o}) for full rank to within its own exact sampling
    envelope; if the null arm does not reproduce a law that is exactly computable in closed form,
    the rank routine or the sampler is wrong and no signal-arm number may be read at all. A second
    null, structure-preserving, draws L_v for a random n by n change of basis applied to the oil space,
    holding shape fixed.
  discriminated_from:
  - 'IDEA-20260805-258212 (whipping as k-fold dilation): that record derives identities on the parameter
    triple (n, m, o) -> (k n, m, k o) and on attack applicability; it says nothing about the rank
    of any matrix at a fixed vinegar, and its identities are compatible with either outcome here.'
  - 'H-MAYO-c0ddab and IDEA-20260805-19990a (repeated vinegar seed): those track the span accumulated
    across SIGNATURES sharing a vinegar. Here the object is a single attempt and repetition is explicitly
    excluded; the two measurements have disjoint inputs.'
  - 'IDEA-20260805-74e78c and IDEA-20260808-ae175e (emulsifier rank defect, Kronecker rank of the
    whipped form): those measure ranks of the PUBLIC form or of emulsifier combinations, key-side
    and signer-independent. L_v is signer-side and vinegar-dependent, and can be full rank while an
    emulsifier defect exists or vice versa.'
  - 'Classical q-rank-law calculations: those are the null arm here, not the claim. The claim is that
    the signal arm matches them, which is a measurement, and the deliverable is the measured deviation
    with error bars either way.'
  - 'IDEA-20260801-013 (whip cost versus matched UOV): that is a security-cost comparison against
    a matched plain UOV instance; this proposal deliberately measures the benefit side and claims
    no cost comparison at all.'
  assumptions:
  - The recalled MAYO signing structure (fix vinegar, solve linearly for the oil part) is correct
    in shape; the experiment's Stage 0 is a reading task and the whole contract is void if the shape
    is wrong.
  - Toy parameters admit exhaustive vinegar enumeration at the smallest cells, so at least one cell
    has zero sampling error.
  - Exact F_q arithmetic, so no floating point enters any rank computation.
  - The emulsifier used is the one recorded in-repo in IDEA-20260805-74e78c's notation; a different
    emulsifier is a different experiment and must be labelled as such.
  - Rank of L_v is computed by one frozen routine used identically by both arms.
  predictions:
  - metric: total variation distance between the signal-arm rank histogram and the matched random-matrix
      null histogram, at the exhaustively enumerated cell
    direction: different
    minimum_effect: 0.02
  - metric: measured probability that rank(L_v) = m, compared with the closed-form q-rank law value
    direction: different
    minimum_effect: no pre-commitment on the sign; the pre-registered value is the closed-form law
      itself and the reportable quantity is the signed deviation with an exact binomial interval,
      because pre-committing to a direction here would be inventing a mechanism we do not have
  - metric: decay of any measured deviation as k increases at fixed (n, m, o)
    direction: lower
    minimum_effect: a deviation that is constant in k to within its interval is recorded as an artifact
      signature per inventor-protocol section 3, not as structure
  minimal_test:
    design: 'One cell, exhaustive. Take q = 4, m = 3, o = 2, n = 5, k = 2. Enumerate every vinegar
      in F_q^{k n} for each of a fixed set of keys, build L_v, and record its rank. That is 4^10 =
      1048576 rank computations of a 3 by 4 matrix per key, seconds of work in pure Python with exact
      GF(4) tables, and it yields the exact rank histogram with no sampling error whatsoever. In the
      same invocation draw the same number of uniform random 3 by 4 matrices over F_q and histogram
      their ranks. Report the two histograms, their total variation distance, the closed-form q-rank
      law value, and the exact binomial interval on the full-rank probability. This single cell already
      discriminates: if the histograms coincide the whole claim is a controlled null and the deliverable
      is the measured surjectivity margin; if they differ the deliverable is a named integer deviation
      at a named cell, which then justifies the larger sweep and nothing more.'
    controls:
    - Uniform random matrix null of identical shape, same code path, same invocation.
    - 'Random-change-of-basis control: apply a uniformly random invertible n by n matrix to the oil
      space before whipping, holding all dimensions fixed; the rank histogram must be invariant.'
    - 'Degenerate emulsifier positive control: substitute an emulsifier with a deliberately planted
      rank defect and confirm the measurement detects the induced rank drop, so a null result is not
      merely instrument blindness.'
    - 'Shuffled-label control: recompute the discrimination statistic after randomly permuting the
      arm labels, to calibrate the permutation test''s own envelope.'
    - 'k = 1 control: at k = 1 the whipped map is the underlying small-oil UOV map and the full-rank
      probability must be near zero when o < m, which is a sanity anchor with a forced value.'
    required_metrics:
    - exact rank histogram of L_v per cell
    - measured full-rank (signing-success) probability with exact binomial interval
    - closed-form q-rank law value at the same shape
    - total variation distance between signal and null histograms
    - exact permutation p-value for the arm-label test
    - surjectivity margin k*o - m per cell
    - wall-clock and enumeration counts per cell, reported as cost not as evidence
  falsification_conditions:
  - The signal and null histograms agree to within the exact sampling envelope at every cell, which
    falsifies any claim of whipping-induced signing structure and records a controlled null.
  - The null arm fails to reproduce the closed-form q-rank law, which invalidates the instrument and
    forbids reading the signal arm at all.
  - The k = 1 anchor does not show the forced near-zero full-rank probability when o < m, which means
    the map construction is wrong.
  - The planted-defect positive control is not detected, which means the measurement is blind and
    no null result may be reported.
  - Rank of L_v is found not to be monotone under nested column extension in k, which refutes the
    stated propagation rule.
  confounders:
  - An incorrectly recalled signing structure, which would make L_v the wrong matrix; mitigated only
    by the Stage 0 reading task, never by measurement.
  - A biased vinegar sampler in the sampled cells; mitigated by the exhaustive cell, where no sampler
    exists.
  - Toy field size q = 4 exaggerating q-analogue effects that vanish for larger q; mitigated by sweeping
    q and reporting the trend rather than one cell.
  - Key-to-key variation being mistaken for vinegar-to-vinegar variation; mitigated by reporting the
    histogram per key before pooling.
  - A rank routine with a special case at zero rows or zero columns, which would distort both arms
    identically and hide itself; mitigated by unit tests with forced values.
  interpretation_limits:
  - A measured retry probability is a property of the mathematics of the toy map, not of any implementation,
    and may never be read as a timing or side-channel statement.
  - Toy (q, n, m, o, k) do not transfer to deployed parameter sets, and no extrapolation is offered
    here.
  - An agreement with the random-matrix null is evidence about L_v only, and says nothing about whether
    whipping is free on the key-recovery side.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement's own cost is q^{k n} rank computations
      at the exhaustive cell and O(samples) elsewhere.
    memory_exponent: No attack memory exponent is claimed. The measurement stores one histogram of
      size m+1 per cell, so memory is O(1) in the parameters.
    best_known: The incumbent is the closed-form q-analogue rank law for uniform random matrices over
      F_q, used here as the null hypothesis and as the predicted value; there is no incumbent attack
      to beat because no attack is proposed.
    hidden_overhead: 'The human cost is the Stage 0 reading task: if the recalled signing structure
      is wrong, every number produced is about the wrong matrix and the whole run is void. Lower-order
      compute overhead is dominated by exact GF(q) table construction and by writing the histogram
      comparison so that both arms genuinely share one code path rather than two that look alike.'
  dominated_by: n/a (no result claimed). Checked against the frontier rows that would apply if an
    attack were claimed - time, memory, and data/queries for the intersection, reconciliation and
    Kipnis-Shamir families as recorded in RQ-UOV-001 and RQ-MAYO-001 - and none of them are comparable
    because this measures signing-side solvability, which sits on no attack cost frontier at all.
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverable is
    the signed deviation between a measured full-rank probability and a closed-form value, reported
    with an exact interval, plus the integer surjectivity margin per cell.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Part A (the object is well defined and the shape is as derived): 0.9,
    because the shape follows from the parameter triple already fixed in H-MAYO-2c6c34 and only the
    Stage 0 reading risk stands against it. Part B (rank distribution matches the random-matrix null):
    0.8, because L_v is a structured but heavily randomized matrix and the generic expectation is
    agreement; the 0.2 is real because the entries are linear in v and correlations across entries
    are plausible. Part C (the surjectivity margin is the whole content of k): 0.55, lower than B
    because even under agreement, other benefits of k that this measurement cannot see may exist,
    so the claim of completeness is the weakest part and should be read as scoped to L_v alone.'
