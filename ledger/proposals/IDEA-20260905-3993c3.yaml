  assumptions:
  - The free-target encoding is validated at l = 3 (shared with IDEA-20260905-79112a).
  - The counter is run with its own solver and with cadical on the hashed formulas to separate counter overhead
    from search cost.
  proof_search_map:
    bottleneck: The cost of one hashed SAT call relative to the ceiling.
    baseline_embedding:
      parameter_slice: k = 0 reproduces the free-target single search of 79112a; l = 3 is enumerable for the exact
        projected and unprojected counts.
      reproduction_check: Frozen tables of the exact counts at l in {3,4,5} and of 2^{ml}/|G|.
    observation_collision:
      observable: N_conf(k) and the counter's estimates.
      distinct_preimage_search: Real versus N0 predicted to collide on N_conf(k); the counter's estimate must match
        the exact count within epsilon on both.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: Hold N_conf fixed and vary k; predicted flat.
      predicted_gain: A prohibition on hashing as a pruning device for this family.
    quantifier_order: 'CLAIMED: FORALL k in [0, n] and FORALL cells, N_conf(k) >= (1 - eps) 2^{ml}/|G|.'
    method_ceiling:
      strongest_certifiable_claim: Toy-tier flatness of the hash-level curve and a PAC estimate checked against
        exact counts.
      nearby_object_control: 'KNOWN-FALSE OBJECT: XOR hashes over the CORE variables instead of the r-bits, where
        N_conf(k) must fall by about 2^{-k} (they are unit early).'
    proof_obligations:
    - claim: Hash rows over r-bits are never unit before all core variables are assigned.
      responsibility: correctness
    - claim: The exact counts are reproduced by enumeration with certificates.
      responsibility: baseline
    - claim: The core-hash known-false object collapses.
      responsibility: feasibility
    - claim: No transfer beyond tested cells.
      responsibility: scope
    not_applicable_reason: null
  predictions:
  - metric: UNSAT-side N_conf(k) / N_conf(0) for k in {0, n/4, n/2, n}, l in {4,5,6}
    direction: different
    minimum_effect: In [0.9, 1.1] at every k; a value <= 0.5 falsifies (B).
  - metric: SAT-side conflicts to first hashed solution
    direction: different
    minimum_effect: Reported separately; expected to scale like a uniformly placed solution in a 2^{ml}/|G| enumeration.
  - metric: counter_total_cost / exact_enumeration_cost
    direction: higher
    minimum_effect: '>= 100 at every cell.'
  - metric: PAC estimate error on the unprojected count versus its declared epsilon
    direction: lower
    minimum_effect: Within epsilon with probability >= 1 - delta over 20 runs; a violation invalidates the counter
      build.
  - metric: core_hash_collapse on the known-false object
    direction: higher
    minimum_effect: N_conf(k)/N_conf(0) <= 2^{-k+1}.
  minimal_test:
    design: STAGE 0. Commit exact counts at l in {3,4,5} by enumeration with certificates. STAGE 1. Validate the
      counter on the unprojected count. STAGE 2. Hash-level cost curve at l in {4,5,6} with cadical on the hashed
      formulas, real and N0, r-hashes and core-hashes. STAGE 3. Projected estimates versus exact coverage; total
      cost accounting.
    controls:
    - SHAPE-MATCHED RANDOM NULL N0.
    - PLANTED-SATISFIABLE TARGETS with certificates.
    - KNOWN-FALSE OBJECT (hashes over core variables) on which the curve must collapse.
    - EXACT-COUNT CALIBRATOR from conservation.
    required_metrics:
    - N_conf(k), decisions, per-call wall clock with pins
    - counter estimates, epsilon, delta, number of calls
    - exact projected and unprojected counts, certificate_verified
    - termination_reason, cell parameters
  falsification_conditions:
  - 'F1. N_conf(k) falls with k on the real system: hashing prunes; mechanism exhibited.'
  - 'F2. The counter violates its PAC bound on the calibrator: counter build invalid; no coverage estimate reported.'
  - 'F3. The core-hash object does not collapse: instrument failure.'
  - 'F4 (pre-registered negative). (B) holding: filed as a priced tooling negative with the coverage curves delivered
    by enumeration.'
  confounders:
  - Counter internals (pivot, blocking clauses) change call counts; calls are counted, not assumed.
  - XOR hashes on a CNF-only solver need cutting; cut size affects per-node cost only.
  interpretation_limits:
  - CLAIM TIER toy; l <= 6.
  - A negative here closes only ApproxMC-style counting on this encoding at these cells.
  heuristic_assumptions:
  - id: H1
    statement: 'HASH INERTNESS: a random XOR over r-bits is unit with probability <= 2^{-(ml-d)} at core depth d.'
    rigorous_support: 'RIGOROUS HALF: r-bits are undetermined until all core variables are set (they are free variables).
      IMITATED LAW: random parity constraints are satisfied by half of all completions.'
    validation_plan: 'Propagation-only probe of 10^6 prefixes per depth at l up to 9; TAIL: the shallowest unit
      hash row.'
  - id: H2
    statement: 'COVERAGE LAW: coverage = 1 - e^{-mu} with mu the conserved mean, within 5 percent at tested cells.'
    rigorous_support: KN-FIND-007's exact mean; Poisson half as in 96c4f3's H1.
    validation_plan: 'Exact coverage by enumeration at l <= 8; TAIL: maximum multiplicity.'
  target_complexity:
    time_exponent: 'NO EXPONENT. Counter: calls x 2^{ml}/m!; enumeration: 2^{ml} 2^{m-1}/m!; loop-sampling: S 2^{(m-1)l}/(m-1)!;
      rho unchanged.'
    memory_exponent: Enumeration coverage bitmap 2^n bits; counter poly.
    best_known: Loop-sampling of coverage (96c4f3 loop plus binomial CI).
    hidden_overhead: Counter call count and blocking-clause growth.
    tradeoff_note: None.
  estimated_cost:
    implementation: medium
    compute: low
    basis: Counter must be built; hashed formulas run on cadical; enumeration in Sage. Small cells only.
  recommended_priority: low
  dominated_by: 'CHECKED: loop-sampling and exact enumeration dominate the counter on time and memory at every tested
    cell; rho dominates all. Not null.'
  sota_delta: 'Negative on cost (>= 100x worse than enumeration, predicted); deliverable: exact coverage curves
    with a conservation check and the flat hash-level curve.'
  inference:
    policy: research-deep
    requested_policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    fallback_used: false
    resolved_model_id: claude-fable-5-1 (as stated by the runtime; not probe-verified)
    model_verified: false
    independent_session_required: false
