    GOAL-ECDLP-001: Prices a measurement tool the avenue names, with a pre-registered negative.
    GOAL-RELN-001: Delivers exact coverage curves with a conservation check regardless of the counter's fate.
    GOAL-SATIC-c49b77: Adds a hashed-formula control to that campaign's matched-null discipline, testing whether
      the no-above-leaf-pruning ceiling extends to a constraint type its benchmark package does not include.
  status: proposed
  proposed_by: idea-generator
  recorded_at: '2026-09-05'
  task_id: TASK-20260905-282872
  batch_id: BATCH-23ec69
  novelty_status: unverified
  novelty_screen: 'search_knowledge NOT available; Grep over ledger/proposals for model count, ApproxMC, #SAT, projected
    counting: two hits (IDEA-20260901-133fd3, IDEA-20260815-bf1328), both unrelated on reading their titles. NEAREST
    INTERNAL WORK AND EXACT DIFFERENCES: GOAL-SATIC-c49b77 / BATCH-1a527c (goal record, contracts/design-intake.json,
    launch.md read; declared intake.md and benchmark-obligations.json absent from the tree at task time) - matched-null
    and SAT/UNSAT-separation discipline on fixed-target fixtures; no free-target formula, no hashing, no counting.
    KN-FIND-007 (mean yield forced, coverage free) - supplies the quantity and the calibrator; IDEA-20260904-3c7a91
    (ceiling) - this record extends its depth argument to hash rows over target bits and prices a counter, which
    3c7a91 does not; RQ-RELN-001 - the consumer. EXTERNAL: arXiv:1306.5726 (ApproxMC) abstract retrieved. No source
    applies model counting to decomposition coverage; absence is a floor. CRYPTO-KB NEAREST WORK (two records named
    by the Coordinator after a crypto-kb search, each read in full after the screen above was written): IDEA-20260808-bfa0b9
    adjoins the target variable y CONSTRAINED by the target-set polynomial g_T(y) and measures the solving degree
    against T over F_p by exact graded rank; this record''s free-target formula leaves the target bits r UNCONSTRAINED
    (the analogue of adjoining y without g_T, i.e. all targets at once) and COUNTS solutions projected onto r rather
    than solving, so the quantity, the field (F_2 versus F_p) and the tool (hashed SAT calls versus Macaulay rank)
    all differ. IDEA-20260829-c6e7a4 derives yield and coverage differences between two harness factor-base constructions
    (full_curve versus target_subgroup, the cofactor h as the yield denominator, coverage/mean = 2/B for the small-multiples
    base) by exhaustive enumeration at m = 2 over F_p; this record asks whether a SAT-based projected counter can
    produce coverage at all and predicts it is dominated by exactly the exhaustive enumeration c6e7a4 uses, both
    records taking KN-FIND-007''s conservation as the calibrator - c6e7a4''s enumeration is the dominating measurement
    row for this record''s quantity.'
