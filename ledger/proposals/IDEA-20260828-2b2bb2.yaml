idea:
  id: IDEA-20260828-2b2bb2
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-28'
  title: >-
    THE "SMALL HEIGHT" AXIS OF THE RQ'S OWN TITLE IS UNTESTED: fix ONE small-
    integer global short-Weierstrass model (A,B) in Z, generically NON-CM, and
    track it through reduction mod many primes p as a lossy projection of the
    curve over Q, asking whether the SAME global object shows a CORRELATED
    across-prime deviation in the campaign's L1 relation-collection functionals
    beyond a matched null of independently-drawn (a,b) at each p -- a question
    orthogonal to every |D_0|/|Aut| axis this lane has measured, because a
    generic non-CM (A,B) has essentially Sato-Tate-random D_0(p) at each p.
  class: measurement

  claim: >-
    (A) THE OBJECT. RQ-JINV-8fc13a's own title lists "0, 1728, small |D_0|,
    small height" as four characterisations of "special j"; every one of the
    49 prior proposals under this question operationalises the first three
    (via D_0, via |Aut|, via the Hilbert class polynomial) and NONE
    operationalises "small height" as its own, distinct axis. The natural
    reading of "small height" independent of CM is the NAIVE HEIGHT of the
    GLOBAL model: for E_{A,B}/Q : y^2 = x^3 + Ax + B with A,B in Z, define
    H(A,B) = max(4|A|^3, 27B^2) (the calibrated naive height of Cremona-style
    conventions, matching the definition used in the 2025 counting paper
    below). This proposal tracks the pair (A,B) itself -- NOT any single
    reduction of it -- as the object, propagated deterministically to every
    prime p of good reduction (p not dividing 6*Delta) via the ring
    homomorphism Z -> F_p.
    (B) THE DISCRIMINATION. Fix a small-height, non-CM (A0,B0) (small |A0|,
    |B0|, and D_0(p) NOT forced to a fixed small value the way a=0 or b=0
    would force it -- verified per-prime by point counting, not assumed).
    Reduce it at k toy primes p_1,...,p_k. At each p_i compute the campaign's
    standard L1 battery (decomposition_rate_m2/m3, liftable_density,
    decomposition_efficiency) on E_{A0,B0} mod p_i, and on a MATCHED-RANDOM
    null: an independently, freshly drawn (a_i,b_i) at p_i with the SAME
    |D_0(p_i)|, |Aut|, N and factor-base density as the fixed-global curve at
    that prime (so the comparison isolates "same global object" from
    "same local CM/automorphism profile", which the existing lane's controls
    already handle). Compute the null-adjusted deviation
    Y(p_i) = (stat(E_{A0,B0} mod p_i) - null_mean(p_i)) / null_sd(p_i).
    (H-null) The sequence Y(p_1),...,Y(p_k) is UNCORRELATED across primes --
    statistically indistinguishable, under a permutation/bootstrap null built
    from many INDEPENDENT fixed-global curves, from the correlation structure
    of k independently drawn single-prime curves. "Small height" is then
    p-local instance noise with no persistent cross-prime signature, and the
    RQ's fourth axis closes with a named obstruction: naive height of the
    GLOBAL model carries no information that survives reduction, because
    reduction destroys the global arithmetic (rank, torsion, conductor) that
    height actually measures. (H-signal) Y(p_i) shows a reproducible positive
    or negative CROSS-PRIME correlation exceeding the null band -- meaning the
    SAME small-height global curve behaves consistently unusual across MANY
    independent primes simultaneously, which is qualitatively different from
    every other finding in this lane (all of which are properties of a SINGLE
    p). (C) WHAT IS NOT CLAIMED. No exponent; ECDLP time exponent is 1/2
    throughout, and even a confirmed H-signal would be a curve-SELECTION /
    curve-AVOIDANCE finding (a constant-factor, instance-specific fact about
    one global model), never an attack on the generic problem. Under a P3-style
    discipline adapted to this statistic (there is no sqrt(6) comparator for a
    cross-instance correlation, so the adapted rule is: ANY reproducible
    nonzero correlation triggers a stop for independent review before any
    record states it, exactly mirroring P3's spirit though not its literal
    number), H-signal is proposed strictly as a test to run, not a result.
    H-null is the pre-registered expectation and, if confirmed, is an
    archivable closure of a title-clause this lane has left completely
    unaddressed for 49 proposals.

  mechanism: >-
    THE LOSSY-PROJECTION TEST, APPLIED EXPLICITLY. The tracked object is
    (A,B) in Z x Z with the reduction map rho_p : Z -> F_p applied
    coordinatewise. This is genuinely lossy: it discards the rank, the
    Mordell-Weil group, the torsion subgroup over Q, the conductor, and the
    L-function of E_{A,B}/Q, retaining only the two integers. It is discarded
    COMPATIBLY with the target's operations: rho_p is a ring homomorphism, so
    the group law of E_{A,B}(F_p) is determined entirely by (A mod p, B mod p)
    with no reference to the discarded global data, and the SAME two integers
    determine the reduction at every p simultaneously -- the propagation is
    deterministic, not a coincidence of one prime. This is therefore NOT a
    change of coordinates (which would need to preserve everything); it
    discards exactly the global arithmetic while keeping exactly what
    determines every local group law, which is what makes "does the retained
    part carry a cross-prime signature" a genuine, non-trivial question.
    WHY H-null IS THE HONEST DEFAULT. For a NON-CM E/Q, Sato-Tate
    equidistribution (proved unconditionally for non-CM E/Q by Taylor et al.)
    gives that the normalised traces a_p / (2 sqrt(p)) equidistribute w.r.t.
    the Sato-Tate measure as p varies -- i.e. the sequence of traces (hence of
    D_0(p), hence of the L1 functionals, all of which are computed from
    D_0(p) and N(p) alone by this lane's own standing prediction,
    DECOMPOSITION.md section 5 prediction 1) behaves like an INDEPENDENT draw
    at each p, with no reason to correlate across p purely from the group
    theory. H-ENDO-001's own admissibility argument (every endomorphism acts
    as a scalar on G) says nothing here, because this object is not an
    endomorphism at all -- it is a global arithmetic fact about (A,B), so this
    idea sits strictly outside the admissibility filter's usual closure and
    must be tested rather than closed by the campaign's standing argument.
    WHY A SIGNAL, IF FOUND, WOULD MATTER DIFFERENTLY FROM EVERYTHING ELSE IN
    THIS LANE. Every other JINV finding is a fact about ONE curve at ONE
    prime. A cross-prime correlation for a FIXED small-height model is a fact
    about a CLASS OF CHOICES an implementer might make (e.g. choosing small,
    "nice-looking" coefficients for readability or NUMS-style rigidity
    arguments) and is the one place in this lane where a finding would bear on
    curve-SELECTION practice rather than on any single deployed instance.

  novelty_status: unverified
  novelty_screen:
    method: >-
      Grepped all 49 RQ-JINV-8fc13a proposal files for "height", "naive
      height", "global curve", "reduction mod", "cross-prime", "multiple
      primes", "same equation" and read every hit plus the three most recent
      (-4bc5d2, -2259f8, -d61c49) and a broad sample across -20260807/-08/-11/
      -13/-15/-16/-26 in full or by title. Also read KN-TECH-018 and
      DECOMPOSITION.md L3/L13. Ran a live web search for recent literature on
      naive height of elliptic curves and fetched the abstract of the one
      directly relevant 2025 hit.
    results: >-
      Every existing JINV proposal fixes p (or a matched-p family) FIRST and
      then varies D_0/j/|Aut| at that fixed p or across the matched-order
      family (fixed N, varying t). None fixes a GLOBAL (A,B) over Z and varies
      p while asking about a CROSS-PRIME correlated signature. -11b93d and
      -44ba75/-ee6ef7 discuss a global curve in the OPPOSITE direction (lifting
      an F_p curve UP via Serre-Tate/CM to characteristic zero for Xedni-style
      rank arguments), which is a different construction (p-adic lift of one
      curve) from this proposal's construction (one Q-curve reduced at many
      p). -51675e computes a per-curve |D_0|/|Aut| bit-discount TABLE for
      standardised curves (including secp256k1, which is a=0/j=0) but does not
      test cross-prime correlation for any fixed model, CM or not.
    verdict: >-
      UNVERIFIED. Distinct tracked object (a global Z-model, not any single
      F_p curve or matched-p family), distinct statistic (cross-instance
      correlation, not a within-instance or within-class contrast), and
      distinct scope (explicitly the RQ title's "small height" clause, which
      no prior record in this lane operationalised). No novelty claimed
      against the external literature on Sato-Tate or naive-height counting,
      which is cited below and was independently checked, not recalled.

  citations:
    - ref: arXiv:2506.18874
      provenance: retrieved
      claim: >-
        Defines the calibrated naive height H^cal(E_{A,B}) = max(4|A|^3,
        27B^2) for a short-Weierstrass model over Q and gives an explicit
        parametrisation of curves of fixed j-invariant and bounded height as
        twists of a minimal-height representative. ("Counting elliptic curves
        over Q with bounded naive height", 2025.)
      verified_by: WebFetch of the arXiv abstract page, 2026-08-28; full text not read.
    - ref: null
      provenance: recalled
      claim: >-
        Sato-Tate equidistribution for non-CM E/Q (Taylor et al., completing
        the Clozel-Harris-Taylor programme): the normalised Frobenius traces
        a_p/(2 sqrt(p)) equidistribute w.r.t. the Sato-Tate measure as p
        varies, which is the classical distribution statement this proposal's
        H1 imitates.
      verified_by: null
    - ref: KN-TECH-018
      provenance: recalled
      claim: automorphism-discounted rho baseline, sqrt(|Aut|) <= sqrt(6)
      verified_by: null
    - ref: analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md
      provenance: internal
      claim: >-
        Section 5 prediction 1, "relation yield depends on N and factor-base
        size only" -- the campaign's own standing prediction this idea's H-null
        would strengthen if it holds cross-prime as well as within-class.
      verified_by: read directly in this session.

  assumptions:
    - >-
      The fixed global model (A0,B0) is chosen non-CM (verified per-prime by
      point counting: D_0(p_i) must not repeat a small fixed value across all
      i, which would indicate accidental CM or a degenerate choice).
    - Toy scale; k primes each up to ~24-28 bits, point counting feasible directly.
    - >-
      "Matched height" for the null arm means the null (a_i,b_i) at each p_i
      is an independently, freshly drawn pair with NO relationship to
      (a_j,b_j) at any other prime -- the null encodes "same local profile,
      no shared global identity," which is exactly the contrast H-null and
      H-signal need to separate.

  proof_search_map:
    bottleneck: >-
      Whether Y(p_i) shows cross-prime correlation beyond the null band. This
      is the single quantity separating "small height is p-local noise" from
      "small height is a property that persists across independent
      reductions."
    baseline_embedding:
      parameter_slice: >-
        k independently drawn matched-random curves, one per prime, no shared
        global identity: this is the null distribution against which the
        fixed-global-curve sequence Y(p_i) is compared.
      reproduction_check: >-
        Frozen fixture: on the null arm alone (k independent curves, k
        independent primes), the empirical cross-prime correlation of Y must
        be statistically zero (matching the permutation null) before any
        fixed-global-curve result is reported. This checks the statistic
        itself, not the height hypothesis.
    observation_collision:
      observable: >-
        The cross-prime correlation of the null-adjusted deviation Y(p_i) for
        one fixed global (A,B).
      distinct_preimage_search: >-
        A collision to separate: correlation could arise from (i) a genuine
        height-driven arithmetic effect, (ii) a shared-instance-noise artifact
        of how the harness draws null curves (e.g. reusing a seed across
        primes), or (iii) an artifact of choosing primes non-independently
        (e.g. all p_i close together, correlating via the size of p rather
        than the identity of (A,B)). The design separates these by (ii) using
        fresh independent seeds per null draw, verified by a seed-audit; and
        (iii) by spreading p_i across the full toy range and reporting the
        correlation as a function of prime-gap as a control.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A pack of m independently chosen small-height global (A,B) pairs,
          each reduced at the same k primes, giving an m x k grid. This turns
          "is there a signal for THIS curve" into "is there a signal for
          small-height curves IN GENERAL," with the m curves supplying a free
          replication check exactly analogous to the matched-order family's
          trace-pair replication.
        predicted_gain: >-
          Distinguishes a curve-specific artifact (signal present for one
          (A,B), absent for the others) from a height-class effect (signal
          present across the pack), which a single fixed curve cannot do.
    quantifier_order: >-
      FOR the chosen height threshold and prime set, FOR EACH of the m
      small-height global curves, EXISTS or does not exist a cross-prime
      correlation of Y exceeding the matched-null band. The weaker order
      (EXISTS one curve, one prime pair with a large deviation) is explicitly
      NOT claimed and would not support H-signal; only a per-curve,
      across-the-whole-prime-set correlation counts.
    method_ceiling:
      strongest_certifiable_claim: >-
        At toy scale, over this prime set and this height threshold, the
        chosen small-height global curves' cost functionals do or do not show
        a cross-prime correlation beyond the matched-random null. It cannot
        certify anything about a specific deployed curve, about crypto scale,
        or about any exponent; a confirmed signal would be a curve-selection
        caution, never an attack.
      nearby_object_control: >-
        A LARGE-height global curve (large random A,B, no special structure),
        reduced at the same k primes: it shares nothing structurally except
        "one fixed global object, many primes." If the large-height control
        ALSO shows a nonzero cross-prime correlation, the effect is a generic
        artifact of "fixed global object" rather than of height, and the
        height-specific claim is withdrawn.
    proof_obligations:
      - claim: rho_p is verified to be a ring homomorphism reduction on the declared prime set (elementary, but checked per prime for good reduction).
        responsibility: correctness
      - claim: The null arm alone reproduces zero cross-prime correlation before any fixed-global-curve result is trusted.
        responsibility: baseline
      - claim: The chosen global curves are verified non-CM by direct per-prime D_0 computation.
        responsibility: interface
      - claim: No exponent, no attack, no crypto-scale claim is made even if H-signal holds.
        responsibility: scope

  predictions:
    - metric: cross-prime Pearson/Spearman correlation of Y(p_i) for one fixed small-height global curve, across k primes
      direction: different
      minimum_effect: >-
        PRE-REGISTERED NULL EXPECTATION 0 within the permutation-null band. A
        reproducible nonzero correlation (surviving the replication pack and
        the large-height control) is H-signal and triggers the adapted P3
        stop before any record states it.
    - metric: same correlation statistic computed on the null arm alone (k independent single-prime curves)
      direction: different
      minimum_effect: >-
        Forced value 0 up to sampling tolerance; a nonzero value here voids
        the instrument, not the hypothesis.
    - metric: correlation-signal magnitude regressed on log H(A,B) across the m-curve replication pack
      direction: different
      minimum_effect: >-
        Flat (no trend) under H-null. A monotone trend in log-height surviving
        the large-height control is the sharpest form of H-signal and is
        reported with its exact permutation distribution.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): fix one small-height non-CM (A0,B0) (e.g.
      |A0|,|B0| <= 5) and verify non-CM-ness at 10 toy primes by direct point
      counting. STAGE 1: build the null-draw procedure and verify it alone
      gives zero cross-prime correlation (the reproduction check). STAGE 2:
      reduce (A0,B0) at k=15-20 toy primes, run the L1 battery at each, and
      compute Y(p_i) and its cross-prime correlation. STAGE 3: repeat STAGE 2
      for m=5 independently-chosen small-height curves (the replication pack)
      and for 1 large-height control curve. THE CHEAPEST KILL is STAGE 2 at
      the first curve: if its correlation is already inside the null band with
      k=15 primes, H-signal is already unsupported for that curve.
    controls:
      - null arm: k independently drawn matched-random curves, fresh seed per prime (blocking)
      - large-height nearby object: one fixed large-height global curve, same k primes (blocking)
      - replication pack: m independent small-height global curves
      - prime-gap control: report correlation as a function of prime spacing
    required_metrics:
      - Y(p_i) per prime, per curve
      - cross-prime correlation coefficient with permutation-null p-value
      - correlation-magnitude vs log H(A,B) regression slope
      - null-arm-alone correlation (must be ~0)

  falsification_conditions:
    - >-
      F1. The null arm alone shows nonzero cross-prime correlation.
      Instrument/seeding failure; no fixed-global-curve result reported until
      repaired.
    - >-
      F2 (MAIN NEGATIVE, A RESULT). No fixed small-height global curve in the
      m-curve pack shows a cross-prime correlation beyond the null band. The
      "small height" clause of RQ-JINV-8fc13a's title is closed at toy scale
      with the named obstruction that naive height of a global model is
      arithmetic data reduction destroys, and DECOMPOSITION.md section 5
      prediction 1 is strengthened cross-prime as well as within-class.
    - >-
      F3. A curve-specific correlation appears for exactly one of the m
      curves and not the others. Read as a curve-specific artifact (possibly
      an accidental near-CM or a small-conductor coincidence for that one
      curve), not a height-class effect; reported as such, not generalised.
    - >-
      F4 (ADAPTED P3). A reproducible correlation appears for multiple
      small-height curves and NOT for the large-height control. Work STOPS
      for independent review before any record states a height-driven signal.

  confounders:
    - >-
      Shared-seed artifacts in the null-draw procedure across primes would
      fabricate a correlation; the seed-audit control is blocking.
    - >-
      Prime selection non-independence (clustered p_i) could correlate via
      prime size rather than curve identity; the prime-gap control checks
      this.
    - >-
      Toy-scale Sato-Tate fluctuations: at k~15-20 primes the equidistribution
      is itself only asymptotic; this is disclosed as a genuine limitation of
      the toy-scale test, not smoothed over.

  interpretation_limits:
    - claim_tier toy; k toy primes; nothing here is a cryptographic-scale statement.
    - >-
      Even a confirmed H-signal is a curve-SELECTION caution about one class
      of global models, never an attack on the generic ECDLP and never an
      exponent claim.
    - >-
      This object is explicitly outside H-ENDO-001's admissibility argument
      (it is not an endomorphism acting on G), so H-ENDO-001 is neither used
      nor retested here; the record says so rather than silently relying on it.
    - >-
      Overlaps in spirit with L13 (RQ-MTGT-2cabee, multi-instance/
      preprocessing) but is NOT a transport-based preprocessing question --
      different primes give NON-isogenous curves in general, so T1 transport
      does not apply here at all; this is flagged so the record is not
      mistaken for an L13 result.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a fixed non-CM E_{A,B}/Q, the sequence of fundamental
        discriminants D_0(p) induced by reduction at a set of primes p behaves,
        for the purposes of this lane's L1 functionals, like a sequence of
        INDEPENDENT draws from the D_0-distribution that DECOMPOSITION.md
        section 5 prediction 1 already treats as the relevant covariate.
      rigorous_support: >-
        Sato-Tate equidistribution (proved for non-CM E/Q) gives that
        normalised traces a_p/(2 sqrt(p)) equidistribute w.r.t. the Sato-Tate
        measure across p; this imitates the classical statement that a
        deterministic arithmetic sequence with an equidistribution theorem
        behind it can be treated as "asymptotically independent" for the
        purposes of a correlation test, analogous to how digits of an
        algebraic irrational are treated as pseudorandom.
      validation_plan: >-
        Sample the D_0(p) sequence directly (by point counting, feasible at
        toy scale) for the m small-height curves and the large-height control
        at the k declared primes; compute the empirical serial correlation of
        D_0(p) itself (not just of the L1 statistic) and compare to the
        permutation null; state the transfer assumption (Sato-Tate is an
        asymptotic statement; k~15-20 is far from asymptotic, and this is
        recorded as a toy-scale caveat, not smoothed over).
    - id: H2
      statement: >-
        The naive height H(A,B) = max(4|A|^3, 27B^2) and the CM-type D_0(p) of
        a reduction are a priori independent axes for a fixed non-CM (A,B):
        small height does not systematically bias the distribution of D_0(p)
        or |Aut(E_p)| relative to large height, for p outside the (bounded)
        set of bad-reduction primes.
      rigorous_support: >-
        No known theorem links global naive height to the local CM-type of a
        reduction for a non-CM curve; this is recorded as the DEFAULT
        (independence) rather than a proved fact, imitating the null
        hypothesis convention that two a priori unrelated invariants are
        tested as independent until a mechanism is shown.
      validation_plan: >-
        Directly enumerate D_0(p_i) and |Aut(E_p_i)| for the small-height pack
        and the large-height control across the same k primes; compare their
        empirical distributions (not just their means) for a bias; report any
        deviation as a finding in its own right, separate from the cross-prime
        correlation test.

  target_complexity:
    time_exponent: >-
      1/2, unchanged. Even a confirmed cross-prime correlation is a
      curve-selection fact, not an algorithmic speedup on the generic ECDLP;
      it changes which curves an implementer might avoid, not the exponent of
      any attack.
    memory_exponent: not applicable; the functional is computed by direct enumeration at toy scale.
    best_known: >-
      0.886*sqrt(N) parallel rho with DPs, O(1) memory (KN-TECH-001,
      KN-TECH-006); CM automorphism-discounted variant 1.2533*sqrt(N/|Aut|)
      (KN-TECH-018).
    hidden_overhead: >-
      No o(1) asymptotic claimed. Disclosed: the toy-scale prime count (k~15-20)
      is far below where Sato-Tate equidistribution is a reliable guide, and
      this limits the confidence of any H-null closure to "no signal at this
      scale," not "no signal at any scale."
    tradeoff_note: not applicable; no attack constructed.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY, DATA against every frontier row. Constructs
    no attack; dominated by parallel rho with DPs (0.886*sqrt(N), O(1)
    memory), the automorphism-discounted CM variant (1.2533*sqrt(N/|Aut|),
    KN-TECH-018), BSGS, and kangaroo/Gaudry-Schost. No data/queries consumed
    beyond point counting at toy primes, so no row is dominated there.
  sota_delta: >-
    ZERO speedup on every axis (time, memory, data, exponent); none sought.
    Measurement delta: this is the first record under RQ-JINV-8fc13a to
    operationalise the RQ title's own "small height" clause as a distinct,
    cross-prime axis rather than folding it into |D_0|; a null result closes a
    title clause the lane has left open for 49 proposals, and a positive
    result would be a qualitatively new kind of finding (a global, not
    per-instance, property).

