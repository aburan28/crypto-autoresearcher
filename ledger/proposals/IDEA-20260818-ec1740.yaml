        First subexponential algorithm for the ideal class group of an imaginary
        quadratic field, expected running time L_{|D|}(1/2, sqrt(2)+o(1)).
      verified_by: >-
        web search 2026-08-18; statement corroborated by the abstract of Biasse
        & Erukulangara (below). NOT primary-read; the exact hypotheses (GRH form,
        error model) are UNCHECKED.
    - ref: "Biasse & Erukulangara, A proof of the conjectured run time of the Hafner-McCurley class group algorithm, Adv. Math. Commun. (2021/2022), doi:10.3934/amc.2021055"
      provenance: retrieved
      claim: >-
        Under a generalization of the Riemann Hypothesis, the Hafner-McCurley
        class group algorithm runs in expected time
        e^{(3/sqrt(8)+o(1)) sqrt(log d log log d)}, improving the originally
        proved sqrt(2) constant. 3/sqrt(8) = 1.06066...
