      verified_by: null

  object_first_candidate:
    established_families_declared_off_limits: >-
      Per docs/inventor-protocol.md section 1, the families this corpus already
      uses as the primary lens for this target are declared off-limits for this
      record: (i) "sweep the discriminant and fit a curve", (ii) "enumerate the
      two-torsion / ambiguous forms", (iii) "restate the RSA translation rule".
      This record's lens is none of these.
    tracked_object: >-
      THE LOCALLY FITTED EXPONENT alpha(d) := d(log T)/dd, the local log-log
      slope of measured cost against ln|D|, tracked as a FUNCTION of d and
      separately per algorithm family.
    lossiness: >-
      LOSSY-PROJECTION TEST. alpha(d) discards the multiplicative constant, the
      whole o(1) term, and the absolute cost -- from alpha(d) alone one cannot
      reconstruct T(d) without an integration constant, so this is not a change
      of coordinates. What it discards is discarded COMPATIBLY with the
      operation that matters here (composition of the cost model with a change
      of discriminant scale): rescaling |D| -> |D|^k maps alpha(d) -> k*alpha(kd)
      deterministically, so the retained part propagates. Crucially, alpha is
      exactly the quantity that DISTINGUISHES the two families -- constant 1/4
      for the pure power, strictly decreasing and unbounded-below-in-slope for
      the subexponential form -- while the discarded constants are exactly what
      a curve fit confounds them by. The projection is lossy in precisely the
      direction that makes the two hypotheses separable.
    survival: >-
      alpha(d) is well defined and measurable wherever two adjacent rungs are
      both reachable. It dissolves when rung spacing is coarse relative to the
      curvature (finite-difference alpha becomes a chord slope of a curved
      function) -- so the design fixes rung spacing in advance and reports the
      chord-vs-tangent bias as a stated systematic, not as noise.
    scoring: >-
      GENUINELY NEW OR REPACKAGING: partly new. Log-log slope is a standard
      diagnostic; using it as the tracked object to detect a REGIME BOUNDARY
      between two named algorithms inside a security-parameter extrapolation is
      not present in this corpus. CONCRETELY TESTABLE: yes -- one-step
      propagation is finite differencing between adjacent rungs and is defined
      exactly. SURVIVAL: to the largest reachable rung; the object degrades
      gracefully (into a chord slope) rather than becoming undefined.

  proof_search_map:
    not_applicable_reason: >-
      This record is a measurement/control design, not a proof-oriented
      proposal: it asserts no theorem, no reduction, no certificate family, and
      no new asymptotic. The asymptotic forms it uses are all cited from
      external literature and are not re-derived. Per
      docs/inventor-protocol.md section 8, the audit is recorded as
      non-applicable rather than silently omitted. The ONE proof-adjacent
      element -- the crossover arithmetic d = 16c^2 ln d -- is elementary,
      stated in full in `mechanism`, and is falsifiable by inspection.

  null_object_control: >-
    NULL 1 (CORRECTNESS NULL). Discriminants whose class group is independently
    tabulated. Both families must reproduce the tabulated invariants exactly at
    every rung. A single mismatch voids the corresponding rung and the timing
    from it.
    NULL 2 (STRUCTURELESS TWIN -- the inventor-protocol null object). For each
    class group Cl(D) computed, construct a black-box abelian group of the SAME
    order and SAME invariant factors with no ideal structure (a direct product
    of cyclic groups with randomized encoding and an operation cost calibrated
    to match one class-group composition), and run the GENERIC family against
    it. Prediction: generic-family cost on the twin matches generic-family cost
    on the real class group to within the operation-cost calibration error. IF
    IT DOES NOT, the generic timing is being driven by class-group arithmetic
    rather than by group order, and the measured generic exponent is an
    implementation artifact rather than the |D|^{1/4} row. Index calculus cannot
    run on the twin AT ALL, and that is the point: the twin quantifies exactly
    how much of the subexponential family's advantage is ideal structure.
    NULL 3 (NO-CROSSOVER NULL). Repeat the whole race on a synthetic cost
    oracle in which both families are stubbed with the modelled asymptotics and
    known constants. The pipeline must recover the injected crossover to within
    a pre-registered tolerance. If it cannot recover a crossover that is
    known to be there, it cannot be trusted to report one that is.

  predictions:
    - metric: >-
        observed crossover location, in bits of |D|, at which measured
        index-calculus cost first falls below measured generic cost on the same
        discriminants (median over >= 5 discriminants per rung)
      direction: different
      minimum_effect: >-
        The two-regime hypothesis predicts a crossover exists inside
        [2^{80}, 2^{320}]. The single-regime hypothesis (index calculus
        dominant everywhere reachable) predicts no crossover in that range, with
        index calculus faster at every rung. These are mutually exclusive at
        every rung and the test is decided by direct comparison, not by a fit.
    - metric: >-
        locally fitted exponent alpha_gen(d) of the generic family over the
        lowest three rungs
      direction: different
      minimum_effect: >-
        Predicted alpha_gen = 0.25 +/- 0.05 (ERH row: |D|^{1/4}). An observed
        alpha_gen consistent with 0.20 would corroborate this program's recalled
        |D|^{1/5} figure against the retrieved d^{1/4}, and that discrepancy is
        itself a reportable literature finding. An observed alpha_gen >= 0.45
        would indicate the unconditional |D|^{1/2} row is what the
        implementation realizes, i.e. the ERH-conditional speedup is not in the
        code.
    - metric: >-
        delta-BIC between a single-regime L[1/2,c] fit and a two-regime
        (min of power and subexponential) fit, over all rungs
      direction: higher
      minimum_effect: >-
        >= 10 in favour of the two-regime fit if and only if the crossover is
        interior to the sampled range. A delta-BIC < 2 either way with an
        interior observed crossover would mean the crossover is real but the
        cost model cannot see it, which weakens the extrapolation-bias half of
        the claim while leaving the observation intact.
    - metric: >-
        spread, in bits, of the extrapolated cost at 1024 and 2048 bits across
        {single-regime fit, two-regime fit, literature c = 3/sqrt(8),
        literature c = sqrt(2)}
      direction: higher
      minimum_effect: >-
        >= 30 bits at 1024 bits. The record's model arithmetic already gives
        34.9 bits at 1024 and 51.7 bits at 2048 from the LITERATURE constants
        alone; a measured spread materially SMALLER than that would be a
        surprise worth recording, since it would mean the data pin c more
        tightly than the published proofs do.
    - metric: >-
        sign-autocorrelation of residuals of the single-regime fit
      direction: higher
      minimum_effect: >-
        Runs test p < 0.05 for the single-regime fit and p > 0.2 for the
        two-regime fit. This is the misspecification signature; if BOTH fits
        show structured residuals, a third mechanism is present and neither
        model is adequate, which must be reported rather than fitted around.

  minimal_test:
    design: >-
      A RACE, NOT A SWEEP. Choose 6 rungs at 64, 96, 128, 160, 192 and 224 bits
      of |D| (prime discriminants D = -p, p = 3 mod 4, matching the deployed
      selection convention), 5 discriminants per rung. At each discriminant run
      BOTH families to completion on identical hardware with identical
      certificate requirements: (F1) index calculus producing generators,
      relations and structure; (F2) analytic approximation of h plus generic
      order/structure pinning. Record wall clock AND two machine-independent
      unit counters -- number of class-group compositions, and number of
      smoothness tests -- so that the crossover can be reported in units that do
      not move with implementation quality. Extend upward one rung at a time
      until the per-rung budget is exhausted; STOP RULE declared in advance.
      Fit alpha per family per rung by finite differences. Fit both cost models
      to F1's data restricted to rungs ABOVE the observed crossover, and to all
      rungs, and report both extrapolations to 1024/2048 bits with intervals.
    controls:
      - Null 1 correctness null at every rung against tabulated class groups.
      - Null 2 structureless-twin null for the generic family at every rung.
      - Null 3 synthetic-oracle recovery of an injected crossover.
      - >-
        IMPLEMENTATION-ASYMMETRY CONTROL: both families reported in unit
        counters as well as seconds, and the ratio (seconds per unit) reported
        per family per rung. A crossover that moves by more than one rung
        between the wall-clock and the unit-count views is reported as
        implementation-determined and NOT as a property of the algorithms.
      - >-
        ERH-DEPENDENCE CONTROL: the generic family is run in both its
        ERH-conditional configuration (truncated Euler product, ERH error bound)
        and a configuration using only unconditional bounds, and the two are
        reported separately. This makes visible that ERH appears on BOTH sides
        of the ledger -- it is what makes the attack cost model subexponential
        AND what makes the measurement's certificate cheap.
      - >-
        Rung spacing fixed in advance; chord-versus-tangent bias in alpha
        computed and reported as a systematic.
    required_metrics:
      - Wall clock and peak RSS per family per discriminant.
      - Class-group compositions and smoothness tests per family per discriminant.
      - Observed crossover bit-length with bootstrap interval over discriminants.
      - alpha per family per rung with finite-difference error.
      - delta-BIC, single vs two-regime, over F1 data.
      - Extrapolated bits at 1024 and 2048 under all four cost models, with intervals.
      - Certificate verification cost, counted separately from computation cost.
      - Artifact manifest with hashes and a rebuild receipt.

  falsification_conditions:
    - >-
      NO CROSSOVER IS OBSERVED anywhere in the reachable window and index
      calculus is faster at every rung including the lowest. Claim (A) is FALSE
      as stated. Record the obstruction block below with the measured ceiling,
      and the record's residual value is the measured single-regime exponent
      plus a corrected crossover estimate.
    - >-
      A crossover is observed but its location moves by more than one rung
      between wall-clock and unit-count accounting. Claim (C) fails: the
      crossover is implementation-determined at this maturity level and cannot
      be reported as an algorithmic boundary.
    - >-
      alpha_gen is not consistent with any of {0.20, 0.25, 0.50}. The generic
      family as implemented realizes none of the retrieved literature rows and
      the race is measuring an unidentified third thing; report and stop.
    - >-
      A tabulated class group is not reproduced at any rung. That rung is void.
      If more than one rung is void the whole race is void.
    - >-
      delta-BIC favours the single-regime fit despite an interior observed
      crossover. The extrapolation-bias half of claim (A) is weakened; the
      crossover observation stands and must be reported without the bias claim.
    - >-
      The measured spread at 1024 bits is under 15 bits. Claim (B) is weakened:
      the data pin c more tightly than the published constants do, which is a
      positive result for the deployment cost model and must be reported as such
      rather than buried.

  obstruction:
    statement: >-
      CONDITIONAL, TO BE FILLED BY THE RUN. If the race terminates without an
      observed crossover, the obstruction is a property of the OBJECT under this
      program's budget: "the largest discriminant at which both algorithm
      families complete with certificates within the declared per-rung budget",
      expressed in bits of |D|. This is a statement about the reachable
      measurement window, not about the hardness of class group computation
      (AGENTS.md rule 3).
    quantity: >-
      max_bits_both_families: largest bit-length of |D| at which BOTH families
      completed with a verified certificate inside budget.
    value: >-
      NOT MEASURED. This is a proposal; no run exists. The field is declared so
      the run has an obligation to fill it, and it must not be filled from the
      model arithmetic in `mechanism`.
    measured_by: []
    scope: >-
      To be stated as: prime discriminants D = -p with p = 3 mod 4, the named
      implementations and versions, the declared per-rung wall-clock and memory
      budget, and the certificate standard used. Claimed nowhere else -- in
      particular not for non-prime or non-fundamental discriminants.
    resource_check:
      examined: true
      reading: >-
        READ THE OTHER WAY ROUND: a measured ceiling on the reachable window is
        precisely the hypothesis of the extrapolation-honesty programme this RQ
        exists to serve. A ceiling of B bits with deployed sizes at 1024-3072
        bits converts the vague statement "the extrapolation is long" into the
        exact ratio (deployed bits)/(B) over which any fitted form is being
        trusted, which is the input to a pre-registered admissibility rule for
        extrapolations ("no cost extrapolation beyond k times the measured
        ceiling"). It is also the quantity that decides whether the deployed
        parameter-provenance question of IDEA-20260809-878ab0 can ever be
        answered by measurement or only by translation. SECOND READING: the same
        ceiling bounds how large a class group this program can build ANY
        certified artifact in, which is a reusable capability number for every
        hidden-order-group question, not just this one.
      spawned_ids: []

  confounders:
    - >-
      IMPLEMENTATION MATURITY ASYMMETRY. A mature index-calculus implementation
      raced against a naive generic one (or vice versa) moves the observed
      crossover by an amount that can exceed the entire 113-235 bit
      literature-constant ambiguity. This is the dominant confounder and is the
      reason unit counters are mandatory alongside wall clock.
    - >-
      CERTIFICATE ASYMMETRY. The two families produce different natural
      certificates (relations and a structure statement, versus an order proof
      against an analytic interval). If certificate cost is folded into the
      timing for one family and not the other, the crossover moves. Certificate
      cost is therefore counted separately per family.
    - >-
      ERH ENTERS TWICE WITH OPPOSITE SIGNS. It underwrites the subexponential
      attack cost model AND the cheap correctness certificate. A configuration
      that uses ERH on one side only produces a crossover that corresponds to no
      coherent adversary model.
    - >-
      CLASS NUMBER FLUCTUATION. h(D) varies by a factor of order (log|D|)^{+-1}
      around sqrt(|D|) at fixed |D|, and the generic family's cost depends on h
      directly while index calculus's does not. Five discriminants per rung is a
      minimum, and per-rung dispersion must be reported, not averaged away.
    - >-
      MEMORY WALL AS A DISGUISED CROSSOVER. Index calculus's subexponential
      memory can force paging at a rung where its time curve has not yet
      crossed, producing a crossover that is a machine boundary. Peak RSS is
      recorded per rung for exactly this reason, and a crossover coincident with
      the memory limit is reported as such.

  interpretation_limits:
    - >-
      Scoped to the tested discriminants, implementations, certificate standard
      and hardware. Nothing here is a statement about the adequacy or
      inadequacy of any deployed parameter, and nothing here is a break of any
      deployed construction.
    - >-
      The bit-counts in `claim` part (B) are DERIVED FROM A COST MODEL, not
      measured: they set o(1) to zero and drop all constants outside the
      exponent. They are an illustration of how much the choice of c matters,
      not a security estimate, and must never be quoted as one.
    - >-
      The crossover, if observed, is a property of two IMPLEMENTATIONS at one
      maturity level. It bounds where a measurement programme's data come from;
      it does not establish which algorithm an adversary would choose.
    - >-
      Toy and moderate discriminants only. No result transfers to deployed sizes
      except through the explicitly stated and explicitly uncertain fit.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (ERH / GRH.) The Extended Riemann Hypothesis holds for the Dedekind
        zeta functions and Hecke L-functions of the fields involved. This is
        used THREE times and in two opposite directions: (a) it underwrites the
        subexponential attack cost model, including the constant 3/sqrt(8)
        proved for Hafner-McCurley; (b) it underwrites Booker's |D|^{1/4} row
        for the generic family; (c) it underwrites the Bach-type bound that a
        polylogarithmically bounded factor base generates Cl(D), which is what
        makes the correctness certificate cheap.
      rigorous_support: >-
        Unproved. The rigorous companion is that unconditional analogues exist
        with strictly worse exponents (Booker |D|^{1/2} unconditional), so ERH's
        role is quantifiable rather than load-bearing-and-invisible.
      falsification_condition: >-
        Not falsifiable by this experiment. What IS falsifiable and IS tested:
        whether the ERH-conditional and unconditional configurations of the
        generic family exhibit the exponent gap ERH predicts (0.25 vs 0.50). If
        the two configurations show the SAME measured exponent, either the
        implementation does not realize the conditional speedup or the
        conditional bound is not binding at these sizes; both are reportable.
      validation_plan: >-
        SAMPLE: the same 6x5 discriminant grid, each run twice (conditional and
        unconditional configuration). COMPARISON: measured alpha_gen against the
        pair (0.25, 0.50). TAIL CHECK: at the largest rung, the ratio of
        unconditional to conditional cost against the predicted |D|^{1/4}.
        TRANSFER: none. This validates that the CODE realizes the cited rows at
        tested sizes; it says nothing about ERH.
    - id: H2
      statement: >-
        (Asymptotic legibility at reachable size.) For each family, the measured
        cost at discriminants in [2^{64}, 2^{224}] is within a factor F of its
        asymptotic form with the literature constant and o(1) set to zero, with
        F bounded and slowly varying over the window, so that finite differences
        of log cost estimate the asymptotic local exponent to within the stated
        error.
      rigorous_support: >-
        The rigorous ingredient is the existence of the proved asymptotic forms
        themselves (Hafner-McCurley with Biasse-Erukulangara's constant; Booker;
        Sutherland). The classical distribution statement it imitates is the
        standard smoothness-density input to index calculus
        (Canfield-Erdos-Pomerance / Dickman-de Bruijn rho(u)), which is what
        makes the subexponential form the right functional shape. THE GAP, AND
        IT IS LARGE: at d ~ 44 to 155 (64 to 224 bits) the quantity
        sqrt(d ln d) ranges only from ~13.3 to ~28.4, so an o(1) of size 0.2 in
        the exponent moves cost by a factor e^{2.7}-e^{5.7}. F is NOT known to
        be small, and this assumption is the record's central weakness.
      falsification_condition: >-
        Measured alpha for either family is inconsistent with EVERY retrieved
        literature row for that family at the 2-sigma level across three
        consecutive rungs.
      validation_plan: >-
        SAMPLE: >= 30 completed computations per family across 6 rungs.
        COMPARISON: measured alpha against the literature rows {0.25, 0.50} for
        the generic family and against d/dd[c sqrt(d ln d)] for index calculus
        at c in {3/sqrt(8), sqrt(2)}. TAIL CHECK: the largest rung, which drives
        every extrapolation, reported alone with its own interval, never pooled.
        TRANSFER ASSUMPTION: that F stays bounded from 224 bits to 1024+ bits.
        THIS TRANSFER IS UNJUSTIFIED AND IS STATED AS UNJUSTIFIED; it is the
        reason the deliverable is an interval and a diagnosis, not an estimate.
    - id: H3
      statement: >-
        (Discriminant-family representativeness.) Prime discriminants D = -p
        with p = 3 mod 4, sampled uniformly in each rung, have class-group
        computation cost whose distribution at fixed |D| is captured by the
        per-rung dispersion of 5 samples to within the reported interval; in
        particular h(D) behaves like the Cohen-Lenstra prediction for this
        family and no sampled discriminant is exceptional.
      rigorous_support: >-
        Rigorous ingredient: the analytic class number formula pins h(D) to
        sqrt(|D|)*L(1,chi_D)/pi times an explicit constant, and under ERH
        L(1,chi_D) lies in a band of width O(log log |D|). Classical
        distribution statement imitated: Cohen-Lenstra heuristics for the
        distribution of Cl(D)'s odd part. THE GAP: Cohen-Lenstra is a heuristic,
        and 5 samples per rung cannot see its tail.
      falsification_condition: >-
        Per-rung cost dispersion exceeds a factor of 4 between the fastest and
        slowest of the 5 samples at any rung, which would mean 5 samples cannot
        support a per-rung point estimate and the design needs more samples
        before any fit is admissible.
      validation_plan: >-
        SAMPLE: 5 discriminants per rung, 30 total; the class numbers found are
        compared against the Cohen-Lenstra prediction for divisibility by 3 (the
        predicted proportion of imaginary quadratic fields with 3 | h is
        approximately 0.4399, RECALLED AND UNVERIFIED -- to be recomputed from
        the product formula before use). TAIL CHECK: the largest and smallest
        h(D) observed per rung against the ERH band for L(1,chi_D). TRANSFER:
        none beyond the sampled family.

  target_complexity:
    time_exponent: >-
      NO NEW ALGORITHM AND NO ATTACK EXPONENT IS CLAIMED. The deliverable is a
      MEASUREMENT of the local exponent alpha(d) for two existing families in a
      declared window, plus the location of their crossing. Experiment cost is
      dominated by the largest rung: one index-calculus run at 224 bits plus one
      generic run at 224 bits, times 5 discriminants, plus 25 cheaper runs.
    memory_exponent: >-
      Measured, not claimed, and it is a first-class output because the two
      families sit at DIFFERENT points on the memory axis: index calculus needs
      subexponential memory (factor base plus relation matrix), the generic
      family needs essentially polynomial memory (Booker) or |D|^{1/4} for a
      plain baby-step giant-step table. Peak RSS is recorded per family per
      rung, and a crossover coincident with the machine memory limit is reported
      as a machine boundary rather than an algorithmic one.
    best_known: >-
      FRONTIER ROWS CHECKED, CLASSICAL, IMAGINARY QUADRATIC, COMPUTING Cl(D):
      (1) Hafner-McCurley, time L_{|D|}[1/2, sqrt(2)+o(1)], memory
      subexponential -- proved.
      (2) Biasse-Erukulangara, same algorithm, time
      e^{(3/sqrt(8)+o(1))sqrt(log d loglog d)} -- proved under GRH.
      (3) Sieving / large-prime variants (Jacobson and successors) -- same
      exponent, better constants; RECALLED, NOT RETRIEVED.
      (4) de Boer-Pellet-Mary-Wesolowski Thm 1.3 (ERH), arbitrary degree,
      L_{|D_K|}(1/2) for fixed degree -- retrieved by primary read; for
      imaginary quadratic this is not an improvement, since the paper states
      that case was ALREADY rigorous.
      (5) Booker, h(D) in O(|D|^{1/4}) under GRH, O(|D|^{1/2}) unconditional,
      polynomial memory.
      (6) Sutherland generic order, O((N/loglog N)^{1/2}) group operations with
      N ~ h ~ |D|^{1/2}, i.e. |D|^{1/4-o(1)}, low memory.
      (7) Biasse-Fieker L(1/3) -- NOT APPLICABLE at degree 2; requires the
      degree to grow (see IDEA-20260818-170937).
      QUANTUM: (8) Hallgren, quantum polynomial time for quadratic fields.
    hidden_overhead: >-
      The o(1) in every subexponential row above is doing enormous work at the
      sizes this experiment can reach: at 224 bits, sqrt(d ln d) is only about
      28, so an o(1) of 0.2 is a factor of e^{5.7} ~ 300. THIS IS THE WHOLE
      DIFFICULTY OF THE RQ, and this record's response is to measure a local
      exponent and a crossing rather than to fit an absolute constant.
    tradeoff_note: >-
      The two families occupy incomparable Pareto positions: subexponential time
      with subexponential memory, versus |D|^{1/4} time with polynomial memory.
      Neither dominates the other, which is exactly why a single-regime cost
      model is inadequate and why the memory axis must be reported beside time.
      Parallelization differs too: index-calculus relation collection is
      embarrassingly parallel while its linear algebra is not (see
      IDEA-20260818-ffeddf), whereas generic order computation parallelizes with
      the standard van Oorschot-Wiener distinguished-point interpolation, giving
      time |D|^{1/2}/(sqrt(w) n) with memory w on n processors. An
      adversary-facing comparison must therefore be made at matched memory and
      matched processor count, and this record's race is at w = 1 machine and is
      scoped as such.

  dominated_by: >-
    CHECKED AGAINST EVERY ROW LISTED IN `target_complexity.best_known`, ACROSS
    TIME, MEMORY AND DATA/QUERIES. AS AN ALGORITHM: this record proposes none,
    so rows (1)-(8) do not compete with it -- it MEASURES them. AS A COST MODEL
    FOR DEPLOYMENT: the incumbent is the single-regime L[1/2,c] extrapolation
    used in parameter selection, and this record's two-regime model is not
    dominated by it on any axis, since it strictly contains it (the two-regime
    model reduces to the single-regime model when the crossover lies outside the
    window, which is a testable special case). AS A MEASUREMENT PROGRAMME: the
    nearest incumbents are IDEA-20260809-843eb6, IDEA-20260809-86ac51 and
    IDEA-20260815-f2d15e, none of which race two algorithm families, so none
    dominates this on the data axis; conversely this record does not dominate
    them, since it does not by itself produce the full certified ladder. NOT
    NULL ON ANY AXIS: quantum row (8) dominates every classical row on time and
    is recorded as such; it does not dominate THIS record because this record
    makes no hardness claim.
  sota_delta: >-
    NO ATTACK, NO EXPONENT CLAIMED. Quantitatively, what is added: (i) the
    location of the generic/subexponential crossover measured with an interval,
    against a modelled prediction of 2^{113.4} (c = 3/sqrt(8)) to 2^{235.2}
    (c = sqrt(2)) -- a 122-bit prior interval that the measurement is designed
    to reduce; (ii) two separately measured local exponents where the deployment
    model has one; (iii) an extrapolated-cost spread at 1024 bits whose
    literature-constant component alone is 34.9 bits (2^{104.5} vs 2^{139.4})
    and at 2048 bits is 51.7 bits (2^{155.4} vs 2^{207.1}), reported as an
    interval rather than a point for the first time in this corpus; (iv) a
    reusable capability number, the largest discriminant at which this program
    can certify a class group at all.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that both families complete at 64-128 bits with tabulated agreement.
    0.6 that both complete at 192-224 bits inside a reasonable budget.
    0.55 that a crossover is OBSERVED inside the reachable window (the model
    says it should be, but implementation asymmetry is the coin-flip).
    0.35 that the crossover survives the wall-clock-versus-unit-count control
    and can be reported as algorithmic rather than implementation-determined.
    0.8 that the extrapolated-bit spread at 1024 bits exceeds 30 bits, which is
    the outcome that most directly serves the RQ's decision target.

