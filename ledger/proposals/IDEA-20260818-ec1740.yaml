idea:
  id: IDEA-20260818-ec1740
  question_id: RQ-CLGRP-66ab7f
  added: '2026-08-18'
  title: >-
    THE REACHABLE MEASUREMENT WINDOW STRADDLES AN ALGORITHM CROSSOVER: race the
    generic order algorithm against index calculus at every rung, locate the
    crossing by observation rather than by fit, and show that a single-regime
    cost model fitted below it cannot carry an extrapolation to deployed sizes
  class: control

  claim: >-
    The deployment cost model for class groups of imaginary quadratic orders is
    a SINGLE subexponential form, L_{|D|}[1/2, c] = exp((c+o(1))*sqrt(ln|D| *
    lnln|D|)), fitted or asserted and then extrapolated to deployed discriminant
    sizes. The claim has three parts, each falsifiable.
    (A) MODEL MISSPECIFICATION. Two algorithm families with DIFFERENT asymptotic
    forms are simultaneously live for computing h(D) and Cl(D): subexponential
    index calculus, and generic/analytic order computation running in
    |D|^{1/4+o(1)} under ERH. Under the stated cost model of this record their
    cost curves CROSS, and the crossing lies at 113-235 bits of |D| -- inside,
    not outside, the window in which any certified sweep this program can afford
    will take its data. A single-regime fit over data that spans a crossover is
    misspecified, and the misspecification propagates into every extrapolated
    bit-count.
    (B) THE CONSTANT IS NOT PINNED. The crossover location moves from 2^{113}
    to 2^{235} purely by substituting c = 3/sqrt(8) (the ERH-proved constant for
    the Hafner-McCurley algorithm, retrieved) for c = sqrt(2) (the originally
    proved constant, retrieved). At 1024 bits the same substitution moves the
    modelled cost from 2^{104.5} to 2^{139.4}; at 2048 bits from 2^{155.4} to
    2^{207.1}. A parameter argument that treats the estimate as tight is
    treating a ~35-52 bit interval as a point.
    (C) IT IS OBSERVABLE, NOT INFERABLE. The crossing does not have to be
    extrapolated: both families run on the SAME discriminants in the reachable
    window, so the crossing point is a measured quantity with error bars, and
    the two curves' locally fitted exponents are separately measurable.
    NO CLAIM IS MADE, HERE OR ANYWHERE IN THIS RECORD, THAT ANY DEPLOYED
    PARAMETER IS ADEQUATE OR INADEQUATE, OR THAT ANY DEPLOYED CONSTRUCTION IS
    BROKEN. The deliverable is a statement about a cost MODEL and about the
    width of an interval.

  mechanism: >-
    Two families, two forms, one window.
    FAMILY 1 (subexponential, structure-exploiting). Index calculus over a
    factor base of prime forms: sample relations, factor the reduced form's
    leading coefficient over the factor base, assemble a relation matrix, take
    its Smith/Hermite normal form. Cost exp((c+o(1))sqrt(ln|D| lnln|D|)); memory
    grows with the factor base and the relation matrix, i.e. also subexponential.
    FAMILY 2 (generic/analytic, structure-free). Approximate h(D) from the
    analytic class number formula via a truncated Euler product, giving an
    interval around h, then pin the exact value inside that interval with a
    generic order/structure computation (baby-step giant-step, Sutherland's
    O((N/lnln N)^{1/2}) generic order algorithm, Booker's character-sum method).
    Cost |D|^{1/4+o(1)} under ERH with essentially polynomial memory; |D|^{1/2}
    without ERH.
    WHY THEY CROSS INSIDE THE WINDOW. Set d = ln|D|. Under the record's cost
    model (constants kept only in the exponent, o(1) set to zero) equality
    c*sqrt(d ln d) = d/4 gives d = 16 c^2 ln d. For c = 3/sqrt(8) this is
    d = 18 ln d, d ~ 78.6, |D| ~ 2^{113.4}. For c = sqrt(2) it is d = 32 ln d,
    d ~ 163.0, |D| ~ 2^{235.2}. Certified class-group computations are routine
    to a few hundred bits and record computations reach beyond 100 decimal
    digits, so BOTH candidate crossovers are inside the feasible sweep range.
    WHY THIS BREAKS THE EXTRAPOLATION. Below the crossover the empirical curve
    is governed by a PURE POWER |D|^{1/4}; above it by a subexponential form
    whose local log-log slope decreases without bound. Fitting one form to data
    drawn from both estimates a blend. The blend's extrapolation error is not a
    widening confidence band around the right answer -- it is a bias of known
    SIGN (a pure power fitted low and extrapolated high overstates cost; a
    subexponential form fitted across a power-law regime understates c), which
    is why the residual structure is a usable diagnostic rather than noise.
    THE FIX IS A RACE, NOT A BETTER FIT. Running both families at each rung
    turns the crossover from a model artifact into an observation, and turns the
    question "which c" into "which c fits the index-calculus curve ABOVE the
    observed crossover", which is the only regime whose form the extrapolation
    may legitimately use.

  novelty_status: unverified

  novelty_screen:
    corpus_screened: >-
      ledger/proposals (grep by mechanism keyword: 'class group', 'imaginary
      quadratic', 'hidden order', 'Hafner', 'VDF', 'verifiable delay'), which
      returned 13 files; all 11 proposals citing RQ-CLGRP-66ab7f were opened at
      title/claim level, and IDEA-20260815-f2d15e and IDEA-20260815-beb144 were
      read in full. ledger/questions/RQ-CLGRP-66ab7f.yaml read in full.
    occupied_lanes_found: >-
      IDEA-20260809-843eb6 certified cost sweep; IDEA-20260809-86ac51
      extrapolation interval under TWO FIT FORMS; IDEA-20260809-95ec8a
      retrodiction of a published record; IDEA-20260809-972c12 certificate and
      independent checker; IDEA-20260809-878ab0 parameter provenance /
      RSA-translation rule; IDEA-20260809-87c235 direct low-order element
      search; IDEA-20260809-83cbc7 structural sub-case enumeration;
      IDEA-20260809-8bd886 trusted-setup pricing; IDEA-20260809-8b3539 VDF
      forgery with countermeasure off; IDEA-20260815-f2d15e certified-cost
      ladder; IDEA-20260815-beb144 discriminant-selection steerability.
    nearest_neighbour_and_discriminator: >-
      NEAREST IS IDEA-20260809-86ac51 (two fit forms, report the interval).
      DISCRIMINATOR: 86ac51 varies the FUNCTIONAL FORM of one fit to one
      algorithm's data and reports the resulting spread. This record asserts a
      specific, named, physical reason the data are not from one algorithm at
      all, predicts WHERE the regimes divide from retrieved literature
      constants, and locates the division by RACING TWO IMPLEMENTATIONS on
      identical inputs rather than by fitting. 86ac51 can be executed and still
      leave this record's claim untested; this record's negative outcome (no
      crossover inside the window) would strengthen 86ac51's premise rather
      than duplicate it. SECOND NEAREST IS IDEA-20260809-843eb6/IDEA-20260815-
      f2d15e (the sweep itself): this record is a CONTROL that any such sweep
      needs, not a second sweep -- it adds one extra timing per rung.
    web_screened: >-
      Four searches run (Hafner-McCurley constant; Booker character sums;
      Sutherland generic order; Biasse-Fieker L(1/3)) plus a primary read of
      ePrint 2025/1514 pages 1-4. These established the frontier rows quoted in
      `citations` and `target_complexity`. NOT screened: whether the specific
      observation "the generic/subexponential crossover falls inside the
      feasible measurement window and biases cost-model fits" is already stated
      in the class-group computation literature (Jacobson's or Sutherland's
      experimental sections are the likely places, and both are UNREAD).
    verdict: >-
      UNVERIFIED. No corpus record makes this claim. The underlying algorithm
      facts are all published and retrieved; the composition -- crossover
      location as a source of extrapolation bias, and the race as its
      measurement -- is not known to be published and MUST NOT be treated as
      novel until the semantic screen and a read of the two experimental papers
      named above are done.

