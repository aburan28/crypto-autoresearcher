  minimal_test:
    design: (a) Patch s4_expr and the factor-base sampler on a branch, re-run the 21 archived configurations
      with their seeds, compare headline metrics (EXP-MTIC-001 and EXP-FIB-001 first). (b) Re-run the
      48 mismatching inherited-F4 replays pinned to one host, vary thread count, ordering and hash seed
      one factor at a time, classify each mismatch.
    controls:
    - unaffected runs as negative control (must reproduce exactly)
    - same-host A/A replay of the 120 identical replays
    - bug injected into a clean run as positive control for the audit
    required_metrics:
    - per-run metric delta
    - count of runs changing verdict
    - mismatch cause classes and counts
    - post-fix replay identity rate
  falsification_conditions:
  - Any of the 21 headline metrics moving outside its interval refutes 'no material contamination' for
    that run; the run's citing records need Coordinator review.
  - More than one independent cause, or any unexplained mismatch, refutes the single-cause claim.
  confounders:
  - seeds not archived
  - code at the time not recoverable
  - thread scheduling
  interpretation_limits:
