idea:
  id: IDEA-20260816-1418f4
  question_id: RQ-FRODO-3260cc
  added: '2026-08-16'
  title: Measure the correlation matrix of per-coordinate decryption-failure indicators in an unstructured
    LWE encryption and in a negacyclic one at matched marginal failure probability and matched coordinate
    count, so that the correlation attributable to ring structure alone becomes a number with an error
    bar rather than an assumption.
  class: control
  claim: '(A) OBJECT. Fix a toy LWE-style encryption and define, per ciphertext, the binary INDICATOR
    VECTOR whose i-th entry is one exactly when coordinate i decodes incorrectly. The tracked object
    is the correlation structure of that vector: the off-diagonal entries of its correlation matrix,
    summarized by the mean absolute off-diagonal correlation and by the largest eigenvalue of the
    centered matrix. (B) MATCHED-PAIR CLAIM. Build two arms whose marginal per-coordinate failure
    probability and whose coordinate count are pinned equal by construction: an UNSTRUCTURED arm of
    Frodo shape, whose noise coordinates are independent by construction, and a NEGACYCLIC arm whose
    noise coordinates are products of ring elements and are therefore not. Because the marginals are
    pinned, any difference in the off-diagonal statistics is attributable to the coordinate coupling
    and to nothing else. The claim is that this difference is measurable at toy dimension with a stated
    sample budget, and that the unstructured arm functions as an exact zero-correlation reference
    against which the structured arm is read. (C) USE CLAIM. Whole-ciphertext failure probability
    is routinely obtained from per-coordinate probabilities by a union bound or by an independence
    assumption, and the two arms make the cost of that step visible as a ratio: measured whole-ciphertext
    failure probability divided by the value the independence computation predicts, reported per arm.
    The unstructured arm calibrates the estimator, since its ratio must be one within sampling error;
    the structured arm''s deviation from one is then a measurement rather than a guess. (D) WHAT IS
    NOT CLAIMED. No attack, no failure-boosting strategy, no claim that either arm''s failure rate
    is wrong, and no claim about ML-KEM or FrodoKEM at real parameters. In particular this does NOT
    ask whether structure helps an attacker and produces no hardness discount of any kind: it measures
    a correlation at matched marginals at toy dimension. A nonzero structured correlation is not evidence
    of exploitability, and a zero one is not evidence of safety.'
  mechanism: 'STAGE 1. Build both arms with a shared noise-sampling core so the only difference is
    the coupling map: the unstructured arm multiplies by an i.i.d. random matrix, the negacyclic arm
    by the negacyclic matrix of a ring element drawn from the same distribution. Matching is enforced
    numerically: the decoding threshold in each arm is tuned so the measured marginal per-coordinate
    failure probability agrees between arms to within a frozen tolerance BEFORE any correlation is
    measured, and the achieved match is reported. STAGE 2. Sample ciphertexts, record indicator vectors,
    accumulate the correlation matrix, and compute the two summaries with bootstrap intervals. STAGE
    3. Independence-ratio measurement: compute the whole-ciphertext failure probability empirically
    and divide by the independence prediction built from the measured marginals, per arm. STAGE 4.
    Null arm in the same invocation: indicator vectors generated by independent coin flips at the
    matched marginal, which must show mean absolute off-diagonal correlation consistent with pure
    sampling noise and an independence ratio of one. This null is what turns a small structured correlation
    into a signal or into noise. STAGE 5. Structural tell per inventor-protocol section 3: sweep the
    ring degree upward at fixed marginal and check that the structured arm''s correlation summary
    moves; a correlation identical at three degrees is the signature of an artifact and would be recorded
    as a controlled null. STAGE 6. Sample-budget calibration: report the smallest correlation the
    budget can resolve, computed in advance, so that a null result is bounded rather than merely reported.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-FRODO-3260cc in full including its decryption-failure target and its exact-arithmetic
      constraint, and RQ-FRODO-a2dbe2's delta term. Ran grep -ril over ledger/proposals/ for decryption
      failure, unstructured, correlation, union bound, independence, module structure, and read the
      titles of every FRODO and MLKEM hit. Read the anti-duplication blacklist items on ML-KEM decryption-failure
      reruns and on module/ring structure discount framings and checked this design against both.
    results: 'Twelve proposals mention decryption failure. The nearest is IDEA-20260808-4854f8 (RQ-MLKEM-001):
      the failure rate is consumed in two places with opposite required directions, an upper bound
      for correctness and a lower bound for failure-boosting cost, and only the first is justified
      by the union bound the published computation uses. That record is about the DIRECTION of a bound''s
      use and about which side the union bound licenses; it does not measure a correlation matrix
      and has no matched unstructured arm. IDEA-20260805-f16b44 (FRODO) separates a scale error from
      a tail-shape error in a failure rate, which is a one-dimensional distributional question. IDEA-20260805-411b60
      (FRODO) predicts the failure rate''s response to a single table perturbation. IDEA-20260805-3d71ca
      (ML-KEM) measures the left tail of a projected error norm across ciphertexts of one key, a continuous
      quantity, not an indicator correlation. The matched-null discipline records IDEA-20260805-522b48,
      -530869 and -7d97be are hardness instruments as noted in the neighbouring FRODOFO entry. No
      record in the corpus measures the correlation structure of failure indicators, and none pins
      marginals across a structured and an unstructured arm in order to attribute a difference.'
    verdict: 'UNVERIFIED. No external literature is reachable, so nothing is asserted about published
      correlation analyses of decryption failures. Claimed new inside this repository: the failure
      INDICATOR VECTOR as a tracked object, the marginal-pinning construction that makes the unstructured
      arm an exact reference, and the independence-ratio calibration that reports the estimator''s
      own bias on the arm where the answer is known. Assembled from known parts: toy LWE rigs exist
      throughout this program; the matched-null discipline is docs/inventor-protocol.md section 3;
      the observation that a union bound is doing work in a published failure computation is IDEA-20260808-4854f8''s,
      and this design measures a quantity that record identifies as unmeasured rather than restating
      its argument.'
  object_first_candidate:
    tracked_object: The binary per-coordinate decryption-failure indicator vector of a ciphertext,
      and specifically the off-diagonal structure of its correlation matrix, summarized by mean absolute
      off-diagonal correlation and by the top eigenvalue of the centered matrix.
    lossiness: 'The projection discards the secret, the error values, the message, and the magnitude
      by which any coordinate missed its decoding threshold, keeping one bit per coordinate. It is
      strongly lossy: a coordinate that missed by one unit and one that missed by a thousand are identical
      in the object, and the entire continuous geometry of the error is gone. What survives propagates
      because the coupling that structure introduces acts on WHICH coordinates fail together, and
      that joint pattern is preserved by thresholding: if the underlying error coordinates are exchangeable
      and identically distributed, the indicator correlation is a monotone function of the underlying
      correlation, so the discarded magnitudes are not needed to see the coupling. That monotonicity
      is itself checkable in the rig and is listed as an assumption rather than asserted.'
    propagation: 'One step of the target operation is one encryption-decryption cycle producing one
      indicator vector. Under the unstructured coupling map the entries are exchangeable and independent,
      so the correlation matrix converges to the identity. Under the negacyclic coupling one step
      mixes every noise coordinate into every output coordinate through a circulant pattern, so pairs
      of coordinates at a fixed cyclic offset share terms and their indicator correlation converges
      to a value determined by that offset. The object therefore has a concrete one-step propagation
      rule: the correlation matrix of the structured arm should be a function of coordinate difference
      alone, which is a strong falsifiable prediction the unstructured arm cannot exhibit.'
    survival_score: The structure survives while the marginal failure probability is large enough
      that failures co-occur within the sample budget, and dissolves when the marginal is so small
      that essentially no ciphertext fails in two coordinates at once, at which point every off-diagonal
      estimate is zero for budgetary rather than mathematical reasons. Concretely, at a marginal of
      about 2^-6 and a sample budget of 2^22 ciphertexts, the expected co-failure count per pair is
      large enough to resolve a correlation of about 0.01, and that resolution floor is computed in
      advance and reported. Below that floor the object does not dissolve mathematically but becomes
      unmeasurable, and the design states the floor rather than discovering it.
  null_object_control: 'An INDEPENDENT-COIN arm: indicator vectors generated directly by independent
    Bernoulli draws at the marginal measured in the signal arms, with the identical correlation estimator,
    the identical bootstrap and the identical summaries, run in the same invocation. The null must
    show mean absolute off-diagonal correlation consistent with zero at the resolution floor and an
    independence ratio of one. If the null shows a nonzero mean absolute off-diagonal correlation
    comparable to the structured arm''s, then the estimator is biased at this sample budget and no
    arm''s number means anything. A second null runs the unstructured LWE arm, which is theoretically
    independent by construction but passes through the entire encryption pipeline, so that the difference
    between it and the coin null isolates pipeline-induced correlation from coupling-induced correlation.'
  discriminated_from:
  - 'IDEA-20260808-4854f8 (RQ-MLKEM-001): argues the failure rate is consumed with opposite required
    directions and that only the upper-bound use is licensed by the union bound. That is an argument
    about how a number is used; this measures the joint distribution that would make the union bound
    loose or tight, which that record identifies as unmeasured.'
  - 'IDEA-20260805-f16b44 (FRODO): scale versus tail-shape error in a failure rate, a one-dimensional
    distributional distinction. This is a multi-coordinate joint-structure measurement and produces
    a matrix, not a scalar comparison.'
  - 'IDEA-20260805-3d71ca (ML-KEM): left tail of the projected error norm over many ciphertexts of
    one static key. Continuous norm geometry versus binary indicator co-occurrence; the two rigs cannot
    produce each other''s quantity.'
  - The blacklisted framing does structure help, which asks for a hardness discount. This design produces
    no hardness estimate, runs no estimator, and its outputs are correlations at matched marginals;
    a nonzero structured correlation is explicitly not claimed to be exploitable and no attack cost
    appears anywhere in the design.
  - The blacklisted ML-KEM decryption-failure rerun. Nothing here reruns any published failure-rate
    computation, and the structured arm is a generic negacyclic toy, not ML-KEM at its parameters;
    the deliverable is a correlation attributable to coupling, which a failure-rate rerun does not
    produce.
  assumptions:
  - Indicator correlation is a monotone function of the underlying error-coordinate correlation for
    the exchangeable, identically distributed toy noise used here; this is checked in the rig at two
    marginals rather than assumed, and the check is reported.
  - Marginal per-coordinate failure probability can be pinned across arms by tuning decoding thresholds,
    and the achieved match is reported with its tolerance; an unachieved match voids the attribution.
  - Toy dimension and toy ring degree are legitimate carriers for a coupling-structure measurement,
    with all frequencies treated as toy artifacts.
  - The sample budget resolution floor is computed in advance from the marginal and the budget, and
    no correlation below it is reported as nonzero.
  - The shared noise-sampling core is genuinely shared, so the two arms differ only in the coupling
    map; this is asserted in code and verified by a bitwise check on the pre-coupling noise stream.
  predictions:
  - metric: mean absolute off-diagonal indicator correlation, unstructured arm
    direction: lower
    minimum_effect: 0.01
  - metric: mean absolute off-diagonal indicator correlation, negacyclic arm at matched marginal
    direction: higher
    minimum_effect: 0.02
  - metric: independence ratio, empirical whole-ciphertext failure probability divided by the independence
      prediction, unstructured arm
    direction: different
    minimum_effect: forced value 1.0 within bootstrap interval; a deviation calibrates estimator bias
      and must be reported before either arm's correlation is interpreted
  - metric: dependence of the structured arm's correlation on coordinate difference only, measured
      as the residual after fitting a function of cyclic offset
    direction: lower
    minimum_effect: 0.25
  - metric: movement of the structured arm's correlation summary as ring degree is swept at fixed
      marginal
    direction: different
    minimum_effect: 'no pre-commitment on direction, with reason: whether coupling correlation grows
      or shrinks with degree at pinned marginal is exactly the unmeasured quantity, and committing
      to a direction would let either outcome be narrated as confirmation'
  minimal_test:
    design: 'One marginal, one dimension, three arms, one invocation. Pin the marginal per-coordinate
      failure probability at about 2^-6 by tuning each arm''s decoding threshold, verify the match
      within tolerance, then draw 2^22 ciphertexts per arm: unstructured LWE, negacyclic at the same
      coordinate count, and the independent-coin null at the same marginal. Accumulate indicator vectors,
      compute the correlation matrix, the mean absolute off-diagonal, the top centered eigenvalue
      and the independence ratio, with a bootstrap over ciphertexts. The discriminating comparison
      is the unstructured arm against the coin null: if they differ, the pipeline itself induces correlation
      and the structured arm''s number is uninterpretable. The second is the structured arm against
      the unstructured one at pinned marginal, which is the whole attribution. This costs a few CPU-hours,
      requires no primary source, and yields a resolution floor whether or not it yields a signal.'
    controls:
    - Independent-coin null at the matched marginal, with identical estimator and bootstrap, in the
      same invocation.
    - Unstructured LWE arm as the pipeline control, isolating pipeline-induced from coupling-induced
      correlation.
    - Marginal-match verification with a frozen tolerance, reported before any correlation is interpreted.
    - Shared pre-coupling noise stream verified bitwise identical between arms.
    - Ring-degree sweep as the structural tell, per inventor-protocol section 3.
    - Resolution-floor computation from the sample budget, registered before the run.
    required_metrics:
    - mean absolute off-diagonal indicator correlation per arm, with bootstrap interval
    - top eigenvalue of the centered correlation matrix per arm
    - independence ratio per arm
    - achieved marginal per-coordinate failure probability per arm and the match residual
    - residual after fitting the structured correlation as a function of cyclic offset
    - resolution floor at the chosen sample budget
    - correlation summary as a function of ring degree
  falsification_conditions:
  - The unstructured LWE arm differs from the independent-coin null beyond the resolution floor, showing
    the pipeline induces correlation and voiding the attribution.
  - The marginal match fails at the frozen tolerance, so no difference can be attributed to coupling.
  - The structured arm's correlation is below the resolution floor at every ring degree, which is
    a clean measured obstruction with a stated bound and is reported as such.
  - The structured correlation is not well fitted by a function of cyclic offset, refuting the propagation
    prediction and indicating the coupling is not acting as modelled.
  - The independence ratio on the unstructured arm deviates from one beyond its bootstrap interval,
    showing the estimator is biased.
  - The correlation summary does not move as ring degree sweeps, which under inventor-protocol section
    3 is read as an artifact.
  confounders:
  - Threshold tuning to pin marginals changes the decoding geometry, so the two arms differ in threshold
    as well as in coupling; the alternative, pinning thresholds and letting marginals differ, is worse
    for attribution, and this trade must be reported rather than hidden.
  - At small marginals, co-failures are rare and every off-diagonal estimate is dominated by sampling
    zeros; the resolution floor guards this only if it is computed and honoured.
  - The negacyclic arm's correlation depends on the ring element drawn, so a single draw could be
    atypical; multiple independent ring draws are required and their spread reported.
  - Bootstrap over ciphertexts underestimates variance if ciphertexts share a key; keys must be resampled
    and the key-level spread reported separately.
  - Indicator thresholding could destroy or manufacture apparent correlation if the underlying error
    coordinates are not exchangeable, which is why the monotonicity check is part of the design.
  interpretation_limits:
  - This measures a correlation at toy dimension and toy ring degree. No frequency transfers to any
    real scheme and no failure rate is claimed for anything.
  - A nonzero structured correlation is not evidence that decryption failures are exploitable, and
    no attack cost is charged anywhere in this design.
  - The result is not a hardness discount and must never be reported as one; the arms are pinned on
    marginals precisely so that hardness plays no role.
  - Attribution to coupling is valid only to the extent that the marginal match and the shared-noise
    verification held, and both are reported as measured quantities rather than as design guarantees.
  target_complexity:
    time_exponent: No attack exponent is claimed. The rig costs O(S times n^2) accumulator updates
      for S ciphertexts and n coordinates, at S up to 2^22 and n up to 256.
    memory_exponent: No attack memory exponent is claimed. The correlation accumulator is O(n^2) counters,
      at most a few megabytes at n = 256.
    best_known: The incumbent is the independence or union-bound treatment of per-coordinate failures
      that a whole-ciphertext failure probability computation uses, as identified in IDEA-20260808-4854f8.
      This proposal does not beat or contradict it; it measures the joint structure that step assumes,
      at toy scale, with the unstructured arm as the calibration reference.
    hidden_overhead: 'Pinning marginals across arms is the expensive and contestable part and it is
      not automatable: it requires a threshold search per arm, a tolerance chosen in advance, and
      an honest report of the residual mismatch. A second hidden cost is that the correlation matrix
      is O(n^2) and the bootstrap multiplies it, so the memory and the analysis time grow faster than
      the sample count suggests.'
  dominated_by: 'n/a (no result claimed on any cost frontier). Pareto check actually performed: grep
    -ril frodo across ledger/ returns no evidence record at all, so this program has no FrodoKEM cost
    row in time, memory or data. Against the ML-KEM failure-rate lane, no cost comparison exists because
    this design produces a correlation, not a cost, and deliberately produces no failure-boosting
    figure that could sit on a frontier.'
  sota_delta: no attack; conceptual and measurement contribution only. The deliverable is a correlation
    summary per arm with bootstrap intervals, an independence ratio, and a stated resolution floor.
    No bit-security figure and no attack cost is produced or moved.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Claim (B), that a coupling-attributable correlation difference is measurable
    at the stated budget and marginal: 0.65. The mathematics strongly suggests a nonzero structured
    correlation exists, but whether it exceeds the resolution floor at a marginal small enough to
    be interesting is genuinely unclear, and my expectation is that the resolution floor rather than
    the mathematics will be the binding constraint. Claim about the offset-function fit, that structured
    correlation depends on cyclic offset alone: 0.7, since it follows from the circulant construction,
    with the risk concentrated in threshold tuning breaking exchangeability. Claim (C), that the independence
    ratio calibrates cleanly with the unstructured arm at one: 0.8. Probability the pipeline control
    is clean, that is, the unstructured arm matches the coin null: 0.75, and a failure there is the
    single most likely way this experiment ends without an attributable number.'
