idea:
  id: IDEA-20260816-c01dc8
  question_id: RQ-NTRU-9015ee
  added: '2026-08-16'
  title: 'Make matched mean something: define a lattice-control matching certificate over seven computable
    invariants, then measure which invariants the obvious matched unstructured controls actually fail,
    so that every later NTRU-versus-generic comparison in this program carries a mismatch budget instead
    of an adjective'
  class: tooling
  claim: '(A) Every claim of the form ring structure causes X rests on a control lattice described
    as matched. In this repository matched has so far been asserted, not certified. The claim here
    is that matching is a checkable property over a specific list of computable invariants, and that
    a control which fails one of them silently converts a structural comparison into a comparison
    of something else.

    (B) The proposed certificate covers seven invariants, all computable without lattice reduction:
    dimension; determinant; the elementary divisor multiset of the lattice as a subgroup of Z^d, which
    distinguishes q-ary lattices with different Smith normal forms even at equal determinant; the
    number and rank of planted short vectors; the per-plant coefficient norm distribution, matched
    in mean and variance to a declared tolerance; the primitivity of the planted sublattice, since
    a non-primitive plant changes the covolume comparison; and the input-basis Gram-Schmidt profile
    before any reduction, since two lattices can be identical as sets while their presented bases
    hand a reduction algorithm very different starting points.

    (C) The measurement is an audit, not a proposal of new controls: construct the obvious matched
    controls that this goal''s proposals already name, a uniform random q-ary lattice and an independent-plant
    lattice, and report for each which of the seven invariants it matches to what tolerance. The deliverable
    is a mismatch budget table, plus an executable checker that any later contract can call as a gate.

    (D) What is NOT claimed: no attack, no security consequence, and no verdict that any existing
    proposal is wrong. A control failing an invariant is not automatically invalid; it is a control
    whose comparison is scoped to the invariants it does match, and the certificate makes that scope
    explicit rather than eliminating it. It is not claimed that seven invariants are sufficient, only
    that they are necessary and computable; the list is declared as a floor that later work may extend,
    and the checker is designed so that adding an eighth invariant does not invalidate earlier certificates
    but marks them as covering fewer.'
  mechanism: 'Stage 1: write down each invariant as an exact computation. Dimension and determinant
    are trivial. The elementary divisor multiset comes from the Smith normal form of a basis matrix,
    computed in exact integer arithmetic; for q-ary lattices from a full-rank uniform H it is expected
    to be (1^n, q^n), and any control whose H is not full rank modulo q silently produces a different
    one. Primitivity of the planted sublattice is decided by whether the Smith normal form of the
    plant''s generating matrix has all elementary divisors 1. Plant rank is the integer rank of that
    matrix. The norm distribution is compared by mean and variance to a declared tolerance and by
    a two-sample statistic. The input-basis profile is an exact Gram-Schmidt in rational arithmetic
    on the presented basis.

    Stage 2: implement the checker as a single function taking two instance generators and a tolerance
    dictionary, returning a per-invariant pass or fail with the measured discrepancy, and refusing
    to return a bare Boolean, since a bare Boolean is exactly what allowed matched to become an adjective.

    Stage 3: audit. Run the checker on the control pairs this goal''s existing proposals name, across
    a grid of n and q, and tabulate which invariants fail and by how much.

    Stage 4: demonstrate materiality on one invariant. Take the invariant that fails most often and
    construct two controls differing only in it, then run one cheap downstream measurement, the covolume
    advantage envelope, on both. If the downstream measurement is insensitive to that invariant, the
    mismatch is harmless and the certificate can relax its tolerance, which is a useful negative.
    If it is sensitive, the mismatch budget is load-bearing and every earlier comparison inherits
    it.'
  novelty_status: unverified
  novelty_screen:
    method: Read all nine RQ-NTRU-9015ee proposals by title and class, with IDEA-20260809-28289c read
      closely since it proposes the nulls this entry audits. grep -ril 'matched', 'control adequacy',
      'Smith normal form', 'primitive', 'elementary divisor' over ledger/proposals/ and ledger/hypotheses/.
      Read the portfolio note that August 2026 proposals were dominated by self-audit of instrument
      validity and control adequacy, and checked RQ-INSTR-f8faa0 exists as the owner of that space.
    results: IDEA-20260809-28289c proposes two mandatory nulls, a matched random lattice and a planted-dense-sublattice
      lattice, but proposes them as objects rather than as certified constructions with per-invariant
      tolerances. 'matched lattice' matched only IDEA-20260813-28cf9c on this screen, and 'unstructured
      control' matched IDEA-20260731-004, 005, 006, 012, 019 and IDEA-20260807-b5c439, all of which
      are ECDLP-side controls with a different notion of matching. No hit for 'Smith normal form'
      or 'elementary divisor' anywhere in ledger/proposals/ on this screen. The program's control-adequacy
      self-audits sit under RQ-INSTR-f8faa0 and concern the program's own cost models and timings,
      which this entry deliberately does not touch.
    verdict: 'UNVERIFIED. No claim about external literature; Smith normal form and primitivity are
      textbook, and matching controls is basic experimental hygiene. What is claimed new relative
      to this repository is the specific seven-invariant list, the refusal to return a bare pass or
      fail, and the materiality demonstration in Stage 4 which measures whether a given mismatch actually
      moves a downstream quantity rather than assuming it must. Assembled from known parts: exact
      Smith normal form, exact Gram-Schmidt, and the control pairs already named in IDEA-20260809-28289c.'
  object_first_candidate:
    tracked_object: The mismatch vector m = (m_1, ..., m_7), one signed discrepancy per invariant,
      attached to a pair consisting of a signal instance generator and a control instance generator.
      Followed through the operation of changing the control's construction.
    lossiness: 'Lossy: m collapses two entire lattices to seven numbers, discarding all geometry not
      captured by the listed invariants, every vector, and the lattices'' identities. Two genuinely
      different control constructions can give the same m, which is precisely the certificate''s honest
      weakness and is why the entry declares the list a floor rather than a characterisation. The
      retained part propagates compatibly with the operation of modifying a control construction,
      because each invariant is a function of the construction and can be recomputed after a change
      without recomputing anything discarded. Stated plainly: this is a deliberately incomplete projection
      whose value is that it is computable and gateable, not that it is faithful.'
    propagation: 'One step of the target operation is a modification to the control generator, for
      example replacing an independent plant by an orbit plant or changing H''s rank modulo q. Under
      it, m changes in a way that is traceable per coordinate: the certificate reports which invariant
      moved and by how much, so a change in a downstream measurement can be attributed to a specific
      coordinate of m rather than to the control as a whole. That attribution is the entire point
      of tracking m instead of tracking the control.'
    survival_score: 'The certificate survives to any dimension where exact Smith normal form on a
      2n x 2n integer matrix is affordable, which with fraction-free methods is comfortably n in the
      hundreds and probably n = 761 with patience. It dissolves as a sufficient notion of matching
      immediately: seven invariants cannot characterise a lattice, and the entry claims only necessity.
      Concretely: computable to n = 512 within a bounded budget, sufficient at no n whatsoever.'
  null_object_control: 'The identity null: run the checker on a generator against itself, with different
    seeds. Every invariant must pass at its declared tolerance, and the measured discrepancies give
    the sampling noise floor below which no mismatch can be claimed. This is the forced null that
    gates the tool. The second null is a deliberately broken control: a generator that differs in
    exactly one known invariant by a known amount, for which the checker must flag that invariant
    and only that invariant. If the checker flags others, its invariants are entangled and the per-coordinate
    attribution in the propagation claim is unsound, which would be a finding about the tool rather
    than about any lattice.'
  discriminated_from:
  - IDEA-20260809-28289c proposes the two null lattices and argues they are mandatory; this entry
    does not propose a null and instead measures whether the nulls that proposal names satisfy a declared
    list of invariants, and supplies the executable gate. It names that proposal as its subject.
  - RQ-INSTR-f8faa0's instrument-validity proposals audit the program's cost models, machine variance
    and timing; nothing there concerns the algebraic matching of two lattice families, and this entry
    deliberately makes no statement about timing or cost models.
  - A generic experimental-design checklist is prose; the content here is that each item is an exact
    integer computation with a tolerance and a measured noise floor from the identity null.
  - The covolume-envelope entry in this batch consumes matched controls; this one certifies them,
    and the two are related as instrument and measurement rather than as competitors.
  - A statistical two-sample test on secret norms alone would catch one of the seven invariants; the
    Smith normal form and primitivity coordinates are invisible to any norm-based check and are the
    ones most likely to fail silently.
  assumptions:
  - Exact Smith normal form is affordable at the dimensions used in this goal, which is checked at
    the largest n before the audit is launched rather than assumed.
  - The seven invariants are computable without lattice reduction, which is true by construction and
    is what keeps the checker usable as a gate.
  - Tolerances can be set from the identity null's measured noise floor rather than chosen by judgement,
    which removes one degree of freedom from the auditor.
  - A generator can be re-run with different seeds to produce the identity null, which requires generators
    to be seeded and deterministic, itself a requirement the checker enforces.
  predictions:
  - metric: number of the seven invariants failed by the uniform random q-ary control against an NTRU
      signal arm, at n = 32
    direction: higher
    minimum_effect: 2
  - metric: number failed by the independent-plant control against the same signal arm
    direction: lower
    minimum_effect: 1
  - metric: identity-null failures across all seven invariants
    direction: different
    minimum_effect: forced value 0; any failure means the tolerances are below the sampling noise
      floor and must be reset before the audit runs
  - metric: number of invariants flagged by the deliberately broken control, which differs in exactly
      one
    direction: different
    minimum_effect: forced value exactly 1; more means the invariants are entangled
  minimal_test:
    design: 'One invocation, no reduction. Implement the seven invariant computations and the checker.
      Run the identity null on each generator at three seeds per n to fix the noise floor and set
      tolerances from it. Run the deliberately broken control, which differs only in planted rank,
      and confirm exactly one flag. Then audit: for n in {16, 32, 64} and q in {2^8, 2^13, 2^18},
      run the checker on the NTRU generator paired with each of the two named controls, 50 instances
      per cell, and tabulate per-invariant pass rates and mean discrepancies. Finally, run the materiality
      step on the most-failed invariant: construct two controls differing only in it and compute the
      covolume advantage envelope on both, reporting whether the envelope''s crossing abscissa moves
      by more than its own per-key interquartile range. Total compute is minutes to a couple of hours
      dominated by Smith normal form at n = 64.'
    controls:
    - Identity null, generator against itself at different seeds, fixing the noise floor and gating
      the tolerances.
    - Deliberately broken control differing in exactly one known invariant by a known amount, testing
      per-coordinate attribution.
    - Two independent Smith normal form implementations cross-checked on a subsample, since a wrong
      normal form would produce confident nonsense.
    - 'Materiality arm: two controls differing only in the most-failed invariant, run through one
      downstream measurement.'
    - 'Seed determinism check: every generator re-run with the same seed must produce the identical
      instance, asserted before the audit.'
    required_metrics:
    - per-invariant pass or fail with signed discrepancy
    - identity-null noise floor per invariant
    - flag count for the deliberately broken control
    - per-invariant failure rate by (n, q, control)
    - shift in the downstream envelope crossing in the materiality arm
    - Smith normal form cross-check agreement rate
  falsification_conditions:
  - The identity null fails any invariant, meaning tolerances are below the noise floor and no audit
    result is admissible until they are reset.
  - The deliberately broken control flags more than one invariant, falsifying the per-coordinate attribution
    claim and demoting the certificate to a joint pass or fail.
  - All seven invariants pass for both named controls at all cells, which refutes the premise that
    matching is currently unchecked in a way that matters and is a clean, useful negative.
  - The two Smith normal form implementations disagree, invalidating the elementary-divisor coordinate.
  - The materiality arm shows no downstream sensitivity to the most-failed invariant, which does not
    invalidate the certificate but demotes that invariant to advisory and must be reported as such.
  confounders:
  - Tolerances chosen after seeing the audit would guarantee whatever conclusion was wanted; setting
    them from the identity null before the audit is the countermeasure and must be enforced by ordering
    the stages.
  - Smith normal form of a q-ary lattice is nearly determined by construction, so its coordinate may
    be trivially passing and give false reassurance; the broken-control arm exists partly to check
    that this coordinate can fail at all.
  - The input-basis profile invariant depends on how each generator chooses to present its basis,
    which is a convention rather than a property of the lattice; this must be reported as a presentation
    coordinate, not a lattice coordinate.
  - Sampling 50 instances per cell may not resolve distributional invariants such as the norm variance;
    the noise floor from the identity null bounds what can be claimed.
  interpretation_limits:
  - Passing all seven invariants does not make a control matched in any complete sense; the list is
    a declared floor and the certificate says exactly that.
  - A failed invariant does not invalidate an existing comparison; it scopes it, and the scoping is
    the deliverable.
  - The audit's conclusions are specific to the generators as implemented here; a differently implemented
    control with the same name could behave differently.
  target_complexity:
    time_exponent: No attack exponent claimed. The checker costs one exact Smith normal form, O(d^3)
      integer operations with fraction-free growth, plus O(d^2) for the remaining invariants, per
      instance pair.
    memory_exponent: No attack memory exponent claimed. Memory is O(d^2) exact integers, dominated
      by the Smith normal form intermediate entries.
    best_known: There is no incumbent matching certificate in this repository. The status quo is that
      matched is asserted in prose, which this entry replaces with a table and a gate.
    hidden_overhead: Fraction-free Smith normal form has notorious intermediate entry growth, so the
      stated cost hides an integer-size blow-up risk that must be measured at the largest n before
      the audit is launched. The human cost is in resisting the temptation to set tolerances after
      seeing the failures, which is why the stage order is part of the contract.
  dominated_by: 'n/a (no result claimed). Frontier check across time, memory and data: no attack quantity
    is produced, so no frontier row applies. Against other in-repository control machinery, IDEA-20260809-28289c''s
    nulls, this is not a competitor and does not dominate, since it produces no null of its own.'
  sota_delta: No attack; instrument contribution only. The delta is that comparisons in this goal
    would carry a seven-coordinate mismatch budget with a measured noise floor, where they currently
    carry an adjective.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'That the checker can be implemented and the identity null passes with
    tolerances set from the noise floor: 0.85. That at least two invariants fail for the uniform random
    q-ary control: 0.8, because that control matches determinant and dimension by construction and
    matches essentially nothing about the plant. That the independent-plant control fails at least
    one: 0.6, since it is designed to match more. That the broken control flags exactly one invariant,
    validating per-coordinate attribution: 0.65, with the risk that primitivity and rank are entangled.
    That the materiality arm shows downstream sensitivity: 0.5, genuinely uncertain and the most interesting
    coordinate of the whole entry.'
