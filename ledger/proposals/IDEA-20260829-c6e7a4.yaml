idea:
  id: IDEA-20260829-c6e7a4
  question_id: RQ-ECDLP-001
  added: '2026-08-29'
  title: >-
    THE FACTOR-BASE SCOPE AUDIT: the harness's two factor-base constructions
    differ in mean decomposition yield by EXACTLY the curve cofactor h and in
    coverage by a factor of order B, so KN-OPEN-5b3a08 Q2's unexplained
    decomposition-rate anomaly has a two-branch quantitative resolution -- and the
    opt-in target_subgroup scope that was added to fix it enumerates CONSECUTIVE
    MULTIPLES of P, which is precisely the small-multiples geometry this program
    already measured at coverage ratio 0.0021
  class: control

  claim: >-
    (A) THE DENOMINATOR CORRECTION, DERIVED. KN-FIND-007 fixes the mean per-target
    decomposition yield at binom(B+m-1,m)/|G| for every base of size B, where G is
    the group in which the sums live. That group is NOT a free choice, and the
    harness offers two constructions that pick different ones.
    (A1) scope full_curve (the legacy default) samples x-coordinates from all
    of E(F_p), so the base generates E(F_p) with overwhelming probability and
    sums equidistribute over a group of order M = h*N. Mean yield for a target,
    INCLUDING a target that happens to lie in the order-N subgroup, is
    2^m*binom(B+m-1,m)/(h*N).
    (A2) scope target_subgroup enumerates multiples of P, so sums stay inside
    the order-N subgroup and the mean yield for a target in that subgroup is
    2^m*binom(B+m-1,m)/N.
    PREDICTION P1: the yield ratio (A2) over (A1) at matched B and m is EXACTLY
    the cofactor h = M/N, with no free parameter.
    (B) THE COVERAGE COLLAPSE, ALSO DERIVED, AND IT POINTS THE OTHER WAY.
    build_factor_base's target_subgroup branch iterates scalar = 1, 2, 3, ... and
    takes the first B distinct x-coordinates, so V is the set of x(kP) for
    1 <= k <= B, up to x-collisions. This is a SMALL-MULTIPLES base. For m = 2 the
    decomposable targets are exactly rP with r = plus-or-minus k1 plus-or-minus
    k2 and k_i <= B, i.e. r in the interval from -2B to 2B: so coverage = 4B/N
    while the mean is 2B^2/N.
    PREDICTION P2: coverage divided by mean equals 2/B exactly for this base at
    m = 2, i.e. the h-fold yield gain of P1 is delivered as MULTIPLICITY on O(B)
    targets and as NOTHING on the other N - O(B). KN-FIND-007 already measured
    this geometry (its H017 small-multiples base) at coverage ratio 0.0021 with
    concentration 1224x at N about 2^18, and its consequence 3 states the general
    rule that coverage is bounded by min(1, mean) with additive structure lowering
    coverage.
    (C) THE AUDIT CONSEQUENCE, WHICH IS THE DELIVERABLE. KN-OPEN-5b3a08 Q2 records
    that EXP-DTREE-001's measured single-level decomposition probabilities
    (0.0, 0.32, 0.0 at 16/20/24 bits, cofactors 2280, 196, 31512) "do not track
    HEUR-001's own (B/N)^2 point-prediction (0.047, 0.000239, 0.003) in either
    direction or magnitude at any of the three sizes", and leaves the mechanism
    open. Two candidate mechanisms are separated here for the first time:
    MECHANISM 1 (denominator): the prediction used N where the full_curve
    construction forces h*N, so the predicted values are too LARGE by exactly
    h = 2280, 196, 31512 -- a spread of 160x across the three sizes, which is
    the right order to explain a comparison that fails "in either direction".
    MECHANISM 2 (structure): the base geometry concentrates yield away from the
    tested targets.
    These make OPPOSITE predictions about what happens when the scope is
    switched, and the experiment that separates them costs minutes.
    (D) THE STANDING WARNING THIS RECORD EXISTS TO PRODUCE. If P1 and P2 both
    hold, then switching RQ-ECDLP-001's or any successor's factor base to
    scope target_subgroup as a "fix" for KN-OPEN-5b3a08 Q2 would trade a
    denominator error, which is a bookkeeping correction, for a coverage collapse
    of order B, which is a measurement-destroying artifact -- and would do so
    silently, because the mean yield would LOOK h times better. The corrected
    construction is a RANDOM subgroup-scoped base, which the harness does not
    currently offer, and producing that recommendation with numbers attached is
    the deliverable.

  mechanism: >-
    THE TRACKED OBJECT AND THE LOSSY-PROJECTION TEST. The tracked object is the
    SUBGROUP GENERATED BY THE FACTOR BASE, projected to its order -- the single
    integer given by the size of the subgroup generated by V. This is a genuinely
    lossy projection: it forgets which points are in V, their x-coordinates, the
    curve's coefficients and the field, keeping one integer that vastly many
    distinct bases share. It is lossy COMPATIBLY with the target's operations,
    which is the load-bearing half: sums of factor-base points are closed in the
    generated subgroup under the group law, so the retained quantity propagates
    deterministically through exactly the operation (point addition) that relation
    collection performs, and the conservation double count of KN-FIND-007 then
    applies with that subgroup's order in the denominator and nothing else. This
    is why the h factor is an identity and not an estimate. The SECOND object,
    used only to separate P1 from P2, is the additive structure of the base in the
    logarithm coordinate -- the set of exponents k for which x(kP) lies in V,
    viewed as a subset of Z/N -- which is lossy in the opposite direction (it
    forgets the geometry and keeps the arithmetic) and propagates because
    logarithms add.
    WHY THE TWO PREDICTIONS ARE OPPOSITE AND THEREFORE DISCRIMINATING. Mechanism 1
    is a statement about the denominator only: it rescales every yield by 1/h and
    is invisible to any statistic normalised by the mean. Mechanism 2 is a
    statement about the DISTRIBUTION at fixed mean: it leaves the mean exactly
    alone (that is what KN-FIND-007's conservation means) and moves mass from
    coverage into multiplicity. So the pair (mean, coverage) separates them
    completely, and neither can masquerade as the other. This is the reason the
    experiment is worth running rather than argued: the anomaly recorded in
    KN-OPEN-5b3a08 Q2 is currently attributed to nothing, and this assigns it to
    one of two named quantities or refutes both.
    WHY THE SMALL-MULTIPLES DIAGNOSIS IS FORCED BY THE COMMITTED SOURCE, NOT
    GUESSED. build_factor_base's target_subgroup branch is a loop over
    scalar in range(1, inst.n) that computes E.mul(scalar, inst.P), appends the
    x-coordinate, and returns as soon as the list reaches the requested size -- it
    takes the first B distinct x-coordinates of consecutive multiples and returns.
    There is no shuffling and no seed on that path (the seed argument is used only
    by the full_curve branch), so the base is deterministic and is exactly the set
    of x(kP) for the smallest admissible k. That is the H017 geometry by
    construction, read off the source rather than inferred from behaviour.

  novelty_status: unverified

  citations:
    - ref: 'harness/semaev.py (build_factor_base)'
      provenance: internal
      claim: >-
        Two scopes exist. full_curve hashes seeded integers modulo p and keeps
        those that lift to the curve, i.e. samples x-coordinates of ALL of
        E(F_p). target_subgroup iterates scalar from 1 to inst.n - 1, computes
        E.mul(scalar, inst.P), takes the first `size` distinct x-coordinates, and
        raises if the canonical lift is not in the order-n subgroup. The seed
        parameter is consumed only on the full_curve path.
        measure_s3_decomposition calls build_factor_base(inst, factor_base_size,
        seed) WITHOUT a scope argument, so it takes the full_curve default.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        harness/semaev.py, all 233 lines; the loop and the default are quoted
        from the committed source.
    - ref: KN-OPEN-5b3a08
      provenance: internal
      claim: >-
        Q2 records that build_factor_base samples the whole curve rather than the
        target's subgroup; that EXP-DTREE-001 measured main-curve cofactors 2280
        (16-bit), 196 (20-bit) and 31512 (24-bit) with single-level decomposition
        probabilities 0.0, 0.32 and 0.0 against HEUR-001's (B/N)^2 predictions
        0.047, 0.000239 and 0.003; that the pattern "does not track ... in either
        direction or magnitude at any of the three sizes"; that EXP-DTREE-001
        could not isolate this from competing explanations because the experiment
        designed to do so hit a design-infeasibility; and that the resolution
        needed is for any experiment comparing decomposition rates across
        different cofactors to check this confound first. The entry remains OPEN.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        knowledge/open-problems/KN-OPEN-5b3a08.md, all 197 lines.
    - ref: KN-FIND-007
      provenance: internal
      claim: >-
        Mean per-target yield equals binom(B+m-1,m)/N exactly for every base of
        size B, measured deviation exactly 0 over 144 cells; coverage bounded by
        min(1, mean) with equality iff no target has two decompositions; additive
        structure lowers coverage at matched size, with the H017 small-multiples
        base collapsing to coverage ratio 0.0021 at 2^18 while its concentration
        statistic reaches 1224x; a Bose-Chowla Sidon base attains the ceiling at
        ratio 1.1071; the one-relation-per-target gain is bounded by 1.582.
        Explicitly: the identity makes "higher mean yield at matched size"
        refuted on sight, and only coverage, rank, recognizability and solve cost
        are worth measuring.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        knowledge/findings/KN-FIND-007.md, all 96 lines.
    - ref: 'ideas/catalogue-20260805/A1-index-calculus.md (entries A1-6, A1-7)'
      provenance: internal
      claim: >-
        A1-6 derives the exact coverage/collision exchange identity, that the sum
        over targets of the positive part of c_D(r) - 1 equals
        binom(B+m-1,m) minus the size of the m-fold sumset, and predicts that
        cheaply found collisions are exactly those forced by additive structure
        already known to the designer, whose relations carry rank but no
        information -- "a base whose logs you know by construction is not a factor
        base". A1-7 supplies the signed-multiset factor 2^m at unchanged unknown
        count. Both are catalogue entries, not filed records, and both are
        unverified.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        ideas/catalogue-20260805/A1-index-calculus.md, all 931 lines.
    - ref: KN-FIND-a8990a
      provenance: internal
      claim: >-
        Theorem C: if every coordinate is the x-coordinate of a rational point and
        the tuple is good, S_m splits completely, with root set the signed sums.
        Used here only to justify that the m = 2 candidate partner set for a
        factor-base element is exactly {x(R + P_v), x(R - P_v)}, which is what
        makes the coverage count in (B) exact rather than approximate.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        knowledge/findings/KN-FIND-a8990a.md, all 248 lines.

  assumptions:
    - >-
      E(F_p) is cyclic, or at least the factor base generates it, so that
      full_curve sums equidistribute over a group of order M = h*N. If E(F_p) is
      non-cyclic the relevant object is the subgroup generated by V and h must be
      replaced by the index of that subgroup in E(F_p); this is checked per
      instance by computing the group structure, not assumed.
    - >-
      Targets used for the (A1) versus (A2) comparison lie in the order-N subgroup
      in BOTH arms, so the comparison is at matched targets. Comparing an arm
      whose targets range over E(F_p) with one whose targets range over the
      subgroup generated by P would confound the very quantity being measured.
    - >-
      x-coordinate collisions in the target_subgroup enumeration, where x(kP)
      equals x of the negative multiple, mean the loop's first B distinct values
      correspond to k = 1..B, so the exponent set really is an interval; this is
      checked directly rather than assumed.
    - >-
      RQ-ECDLP-001's toy-scale constraint (field bits at most 32) binds; nothing
      here is claimed at cryptographic scale, where h = 1 for standardised curves
      and the entire P1 effect is exactly 1.

  proof_search_map:
    not_applicable_reason: >-
      NOT A PROOF-ORIENTED PROPOSAL, and the reason is specific rather than a
      shrug. The two derivations it rests on are already committed and already
      carry their own proof status: the mean-yield identity is KN-FIND-007's
      one-line double count with proof_status derivation and a measured deviation
      of exactly 0 over 144 cells, and the coverage count for an interval exponent
      set is elementary counting over Z/N. This record proposes NO new theorem, NO
      new certificate family, NO reduction and NO asymptotic claim; it proposes a
      controlled measurement that assigns a recorded anomaly to one of two named
      quantities. The audits section 8 would run -- baseline reproduction,
      observation collision, quantifier order, method ceiling -- are discharged
      inside minimal_test.controls as the matched-random and matched-h control
      arms, and the one quantifier that matters is stated in the claim: the mean
      identity holds FORALL bases of size B, which is what makes the h ratio a
      prediction with no free parameter rather than a fit.

  predictions:
    - metric: >-
        ratio of mean decomposition yield, target_subgroup base over full_curve
        base, at matched B, matched m, and targets drawn from the order-N subgroup
        in both arms
      direction: higher
      minimum_effect: >-
        PREDICTED EXACTLY h, the ratio of the curve order to the subgroup order,
        with no free parameter, measured by exact enumeration over the complete
        target set at p at most 2^14. Pre-registered acceptance band: the measured
        ratio must lie within 5% of h. A ratio within 5% of 1 instead falsifies P1
        and means full_curve sums do NOT equidistribute over E(F_p), which would
        itself be a significant structural finding. Curves are selected to span h
        across at least two orders of magnitude (h in roughly 1 to 4, 100 to 300,
        and 2000 to 4000) so that a fit to h is distinguishable from a constant.
    - metric: >-
        coverage divided by mean yield for the harness's target_subgroup base at
        m = 2
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 2/B. Pre-registered: measured coverage divided by mean
        must fall by at least a factor B/4 relative to a matched RANDOM
        subgroup-scoped base at the same B and the same group. If the two agree
        within a factor 2, P2 is falsified and the consecutive-multiples
        enumeration is not behaving as a small-multiples base.
    - metric: >-
        coverage divided by mean yield for a matched RANDOM subgroup-scoped base
      direction: different
      minimum_effect: >-
        PREDICTED near the KN-FIND-007 ceiling, i.e. min(1, mean) divided by mean,
        within the 1.582 bound. This is the null that isolates "subgroup scope"
        from "small-multiples structure"; if the random subgroup base ALSO
        collapses, the diagnosis is wrong and the cause is the scope itself.
    - metric: >-
        reconciliation of EXP-DTREE-001's three measured decomposition
        probabilities against the corrected model
        2^m*binom(B+m-1,m)/(h*N) with that experiment's own recorded B
      direction: different
      minimum_effect: >-
        The corrected prediction must be closer to the measured 0.0, 0.32, 0.0
        than HEUR-001's 0.047, 0.000239, 0.003 at ALL THREE sizes, measured as
        absolute log-ratio error. Improvement at two of three sizes is recorded as
        PARTIAL and does not support Mechanism 1 alone. If the corrected model is
        no better, both named mechanisms fail and KN-OPEN-5b3a08 Q2 stays open
        with two candidates excluded, which is a smaller but real deliverable.
    - metric: >-
        exactness of the yield identity per cell against
        2^m*binom(B+m-1,m) divided by the order of the subgroup generated by V
      direction: different
      minimum_effect: >-
        FORCED EXACT, deviation 0, by exhaustive enumeration over the complete
        target set. KN-FIND-007 measured exactly 0 over 144 cells and this
        battery must reproduce that on a NEW axis -- the denominator group. Any
        nonzero deviation is an implementation error and halts everything.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, minutes, HARD GATE). Read build_factor_base's
      target_subgroup branch and confirm from the source that the exponent set is
      an interval from 1 to B up to x-collisions. If it is not (for instance if a
      later commit shuffles), the small-multiples diagnosis does not apply and the
      record is re-scoped before anything runs.
      STAGE 1 (minutes). Generate 12 toy curves at p in {2^10, 2^12, 2^14} chosen
      to span the cofactor h over at least two orders of magnitude; compute the
      curve order, N, h and the group structure exactly for each.
      STAGE 2 (minutes to an hour, the main battery, EXHAUSTIVE not sampled).
      Four arms at matched B in {4, 8, 16, 32} and m = 2, with targets ranging over
      the COMPLETE order-N subgroup: (a) full_curve base, (b) harness
      target_subgroup base, (c) matched RANDOM subgroup-scoped base (implemented
      for this test, not by editing the harness), (d) a Bose-Chowla Sidon base in
      the subgroup as the coverage-ceiling positive control. For each arm and cell
      record the exact mean yield, the exact coverage, the multiplicity histogram,
      and the concentration statistic. Decomposition counting uses the
      correspondence v maps to {x(R + P_v), x(R - P_v)} directly, so the count is
      an exact enumeration and not a solver output.
      STAGE 3 (zero compute). Instantiate the corrected model against
      EXP-DTREE-001's committed B and cofactors and compare log-ratio errors
      against HEUR-001's predictions at all three sizes.
      STAGE 4 (zero compute). Write the recommendation with numbers: which scope,
      which geometry, and what the yield and coverage cost of each is.
      ENVELOPE. Exhaustive enumeration over a subgroup of order up to 2^14 with
      B at most 32 is at most 2^14 times 32 point additions per cell, well under a
      second; the whole battery is minutes on one core and its largest object is a
      histogram. Peak RSS predicted under 200 MB and reported. This test builds no
      polynomial system, no Macaulay matrix and no Groebner basis, so it cannot
      encounter the GOAL-DREG-001 n=15 D=6 memory wall -- which was in any case a
      resource_exhaustion INFRASTRUCTURE stop under AGENTS.md rule 3 and never
      negative mathematical evidence.
    controls:
      - >-
        MATCHED RANDOM SUBGROUP-SCOPED BASE (blocking): the null that isolates the
        scope from the geometry. Without it a coverage collapse cannot be
        attributed to small multiples rather than to subgroup restriction.
      - >-
        MATCHED-h CONTROL: at least two curves with h = 1 or 2, where P1 predicts
        NO yield difference between the scopes. An instrument that reports a
        difference where the derivation says there is none is broken.
      - >-
        SIDON POSITIVE CONTROL: a Bose-Chowla base must attain coverage near
        min(1, mean), reproducing KN-FIND-007's measured 1.1071 ratio. A battery
        that cannot detect the KNOWN good geometry has no power and its collapse
        finding means nothing.
      - >-
        EXACT-IDENTITY CHECK per cell against 2^m*binom(B+m-1,m) divided by the
        order of the generated subgroup, with deviation required to be exactly 0,
        reproducing KN-FIND-007's own standard on a new axis.
      - >-
        SIGN-COUNTING CONVENTION frozen before any cell: whether a point and its
        negative are counted as one base element or two changes every number by
        2^m (A1-7), and the two arms must use the identical convention.
    required_metrics:
      - 'exact mean yield per arm and cell, and its ratio across arms'
      - 'exact coverage per arm and cell, and coverage divided by mean'
      - 'multiplicity histogram and concentration statistic per arm'
      - 'curve order, N, h and the group structure per curve'
      - 'measured yield ratio versus the predicted h, with the 5% band'
      - 'measured coverage over mean versus the predicted 2/B for the multiples base'
      - 'Sidon control coverage ratio against the 1.1071 reference'
      - 'log-ratio errors of both models against EXP-DTREE-001 three points'
      - 'peak RSS and wall time'

  falsification_conditions:
    - >-
      The measured yield ratio is within 5% of 1 rather than of h. P1 is false;
      full_curve sums do not equidistribute over E(F_p) as assumed, which is a
      structural finding worth more than the audit.
    - >-
      The harness target_subgroup base does NOT show a coverage collapse relative
      to a matched random subgroup base. P2 is false and the small-multiples
      diagnosis, though read directly off the source, does not bind at these
      parameters.
    - >-
      The matched random subgroup base ALSO collapses. The cause is subgroup
      scope itself and not additive structure; the diagnosis inverts and the
      recommendation changes completely.
    - >-
      The Sidon positive control fails to attain the coverage ceiling. The
      instrument is blind and no negative from it means anything.
    - >-
      The exact-identity check deviates from 0 in any cell. Implementation error;
      nothing is reported.
    - >-
      The corrected model is no closer to EXP-DTREE-001's three measured points
      than HEUR-001's. Both named mechanisms are excluded and KN-OPEN-5b3a08 Q2
      stays open, narrower by two candidates.
    - >-
      Both P1 and P2 hold. KN-OPEN-5b3a08 Q2 gets a quantitative two-branch
      resolution, and a standing warning is produced against adopting the
      target_subgroup scope as a fix.

  confounders:
    - >-
      x-COORDINATE COLLISIONS. x(kP) equals x((N-k)P), so the enumeration's first
      B distinct x-values correspond to k = 1..B only while B is below N/2. At
      small N and large B the exponent set is not an interval and the 2/B
      prediction changes; cells violating B below N/4 are excluded BEFORE the run.
    - >-
      SIGN CONVENTION. The 2^m signed-multiset factor (A1-7) must be applied
      identically in both arms or it manufactures a factor 4 at m = 2.
    - >-
      TARGET SET. Both arms must range over the SAME target set (the order-N
      subgroup). Letting the full_curve arm's targets range over E(F_p) would
      build the h factor into the measurement by construction and prove nothing.
    - >-
      SEED PATH ASYMMETRY. The harness's seed argument is consumed only on the
      full_curve path, so the target_subgroup base has no seed variation at all
      and its spread across seeds is identically zero. Reporting a seed spread
      for that arm would be meaningless and is prohibited here.
    - >-
      COFACTOR CONFOUNDS CURVE SIZE. Curves with large h are found by search and
      may share other properties (small N for given p, unusual j-invariants).
      Curves are selected to decorrelate h from N as far as the toy range permits,
      and the residual correlation is reported.

  interpretation_limits:
    - >-
      TOY SCALE ONLY, and the effect vanishes where it would matter: standardised
      cryptographic curves have h in {1, 2, 4, 8}, so P1's factor is at most 8 and
      is not an exponent. This record is an INSTRUMENT AND BOOKKEEPING audit, not
      an attack and not a step toward one.
    - >-
      It does not resolve KN-OPEN-5b3a08 Q1 (the s4_expr bug and the 21 archived
      runs that used it), which is a separate and still-open audit; this record
      confirms only that the committed source now carries the fix.
    - >-
      A resolution of Q2 by this record does NOT retroactively validate or
      invalidate any specific committed number in EXP-DTREE-001 or elsewhere. Any
      such consequence requires a correction record and a Coordinator decision.
    - >-
      NOVELTY IS NOT ADJUDICATED. The corpus was grepped and the four nearest
      records read in full; no external literature search was run for this
      specific pairing of cofactor denominator and small-multiples coverage, and
      both ingredients are elementary. Honest status: unverified.
    - >-
      Scoped to m = 2 in the measured arms. The denominator argument (A) is
      arity-independent; the coverage count (B) is computed at m = 2 and its
      m >= 3 analogue is stated but not measured here.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a factor base V of B x-coordinates sampled by the full_curve
        construction, the subgroup generated by the lifts is all of E(F_p) with
        probability 1 - O(2^{-B}) for B at least 8, so the group order entering
        the conservation denominator is M = h*N and not any proper subgroup.
      rigorous_support: >-
        The RIGOROUS ingredient is the conservation identity itself: KN-FIND-007
        proves the mean is binom(B+m-1,m) divided by the order of the group the
        sums live in, for EVERY base, so once that order is known the mean is not
        an estimate. What is assumed is only that the generated subgroup is all of
        E(F_p). The CLASSICAL STATEMENT IMITATED is the standard random-generation
        bound for finite abelian groups: B independent uniform elements generate
        the whole group with probability at least 1 minus the sum over maximal
        subgroups of the reciprocal index raised to the power B, which for B at
        least 8 and the small prime divisors of a toy curve order is overwhelming.
        This is a rigorous bound applied to a sample that is seeded-deterministic
        rather than truly uniform, which is the gap.
      validation_plan: >-
        SAMPLE: for every (curve, B, seed) cell in the battery, compute the
        generated subgroup DIRECTLY -- its order and structure -- rather than
        assuming it. This is cheap at toy scale and converts H1 from an assumption
        into a measurement for every cell that is actually used. COMPARISON: the
        predicted failure rate O(2^{-B}); with 12 curves times 4 sizes times 5
        seeds equal to 240 cells at B at least 8 the expected number of cells
        where the generated subgroup is proper is below 1. TAIL CHECK: report
        every cell where the subgroup is proper, individually, with its index, and
        EXCLUDE it from the ratio computation rather than averaging over it.
        TRANSFER: none; nothing above p = 2^14 is claimed.
    - id: H2
      statement: >-
        For a matched RANDOM subgroup-scoped base, the decomposition count of a
        uniformly random target is Poisson-distributed with the conservation mean,
        so coverage equals 1 - exp(-mean) up to o(1) and coverage divided by mean
        approaches min(1, mean) divided by mean within the 1.582 bound of
        KN-FIND-007.
      rigorous_support: >-
        The RIGOROUS ingredient is again conservation: the mean is exact and the
        bound that coverage is at most min(1, mean) is proved in KN-FIND-007. The
        CLASSICAL DISTRIBUTION IMITATED is the Poisson occupancy limit for a
        balls-in-bins process with binom(B+1,2) balls and N bins; the exact fibre
        count of 2 per factor-base element off the branch locus is supplied
        rigorously by the discriminant identity of KN-FIND-a8990a, so the number
        of balls is exact. The assumption is only independence of the placements,
        which is false in detail because the correspondence is algebraic.
      validation_plan: >-
        SAMPLE: the exact multiplicity histogram over the COMPLETE target set at
        p in {2^10, 2^12, 2^14} (no sampling error at all), for the random
        subgroup arm, at every B. COMPARISON DISTRIBUTION: Poisson(mean) with the
        exact conservation mean, by chi-square at the 1% level per cell.
        TAIL CHECKS: (a) the maximum observed multiplicity against the Poisson
        upper tail at 1/1000; (b) the observed count of zero-decomposition targets
        against exp(-mean), which is the coverage bound instantiated; (c) the
        variance-to-mean ratio, whose departure from 1 is the direct measure of
