  assumptions:
    - >-
      The group is of prime order N and the factor base consists of points of
      that group with distinct x-coordinates; the target is a uniformly random
      element of the group (the rerandomisation R_j = [a_j]P + [b_j]Q, which
      catalogue A1-3 argues is exact and free at prime order).
    - >-
      The linear-algebra charge is c_LA*B^2. If A1-9's locality-rank trade fails
      and nested dissection delivers B^{3/2}, the m=2 free-oracle floor moves
      from N^{2/3} to N^{3/5}, which is STILL above N^{1/2}. This proposal is
      therefore stated parameterised in the linear-algebra exponent and the
      conclusion at m=2 survives any exponent in [3/2, 2]. It would fail only
      for a linear-algebra exponent below 1, which is below the rank floor.
    - >-
      Constants c_LA and c_rho are pinned before any number is emitted and are
      reported with every row. No conclusion in this record depends on them,
      because the gap at m=2 is a power of N.
    - >-
      Relations needed is taken as B. Catalogue A1-8 argues for
      (B/m)*ln B; that is a log cofactor, it moves the constant only, and its
      omission is in the direction UNfavourable to this record's negative
      conclusion, which is the safe direction.

  proof_search_map:
    bottleneck: >-
      The per-trial decomposition cost D. It is the ONLY free quantity in the
      two-term model at fixed m, and the entire value of the summation-polynomial
      route is the claim that algebra makes D smaller than enumeration. The
      exact step whose removal would change the theorem is therefore "compute
      one m-decomposition of one target over the factor base".
    baseline_embedding:
      parameter_slice: >-
        m = 2, D = Theta(B) (the signed-sum sweep), c_LA*B^2. This slice must
        reproduce KN-FIND-8f2c90's committed total-check-operation formula
        2RN/B exactly, symbol for symbol, with R = B giving Theta(N).
      reproduction_check: >-
        Symbolic identity check, plus a frozen regression fixture at the
        parameters of KN-FIND-8f2c90's own cells (p = 1009 and p = 4001, with
        its reported yield-retention gamma of 0.86 and 0.75) requiring the
        recomputed speedup 2*gamma to land in [1.5, 1.7] as that record states.
        If the recomputation does not reproduce that committed interval, the
        counting convention differs and everything downstream is void.
    observation_collision:
      observable: >-
        The pair (measured total group operations, N) for a complete m=2 solve.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED AT ONE POINT, which is exactly the
        indictment of KN-FIND-f8c290: at the single measured point p = 1009 the
        power law Theta(N) and the subexponential L(1/2,c) can be made to agree
        to any accuracy by choosing c. A single cell is a collision of the
        observable across the two competing conclusions. The separation requires
        a LADDER, which is what the minimal test supplies. Reporting a
        complexity CLASS from one cell is the identifiability failure this audit
        names.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move "how expensive is prime-field S_3 index calculus" out of the
          solver and into a two-term cost functional whose first term is an
          exact double count (KN-FIND-007) and whose second is a rank floor,
          so the question becomes one stationarity computation in B.
        predicted_gain: >-
          Converts an open empirical scaling question into an exponent identity
          that is decided with zero compute at m = 2. The gain is in the
          strength and cost of the statement, not in attack cost. NO ATTACK
          EXPONENT IS MOVED IN EITHER DIRECTION.
      - transform: boundary_lift
        proposed_object: >-
          Set D = Theta(1) -- an oracle better than any known or conjectured
          algebraic solve -- and re-run the stationarity. The resulting
          N^{2/3} is a boundary value that BOUNDS the whole family from inside.
        predicted_gain: >-
          A negative conclusion at m=2 that is robust to every future
          improvement of the S_3 solve, which a measurement of the current
          solver could never deliver.
    quantifier_order: >-
      CLAIMED: FORALL prime N, FORALL factor-base sizes B in [1, N], FORALL
      per-trial decomposition costs D >= 1, FORALL factor-base geometries of
      size B, the two-term total satisfies T >= c * N^{2/3} for an absolute
      constant c depending only on c_LA. Note the FORALL over geometry is
      delivered by KN-FIND-007's identity, not assumed: this is the one place
      where a weaker "EXISTS a geometry" reading would gut the claim, and it is
      exactly the quantifier the conservation double count supplies.
      NOT CLAIMED, and the distinction is load-bearing: FORALL algorithms. This
      bounds the two-term point-decomposition index-calculus family only. It
      says nothing about any algorithm outside that family.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Within the two-term cost model, for point-decomposition index calculus
        at arity m = 2 over a prime-order group, no factor-base size and no
        decomposition cost D >= 1 gives a total below Theta(N^{2/3}), hence none
        reaches Pollard rho." It can NEVER certify anything about m >= 4, about
        algorithms outside the two-term family, about the truth of the model, or
        about ECDLP hardness. Any summary dropping "within the two-term model"
        or "at m = 2" is overclaiming under AGENTS.md rule 4.
      nearby_object_control: >-
        THE EXTENSION-FIELD GATE, and it is blocking. Re-run the identical
        accounting over F_{q^n} with the subfield factor base B = q, m = n. It
        must NOT return "worse than rho at every n", because index calculus
        demonstrably works there (Gaudry, Diem). An accounting that produces a
        no-go in the setting where the method works is wrong, not conclusive.
        This is catalogue B1's shared kill-check and it is adopted verbatim.
    proof_obligations:
      - claim: >-
          The two-term model reproduces KN-FIND-8f2c90's committed 2RN/B.
        responsibility: baseline
      - claim: >-
          The stationarity gives B* = ((m-1) m! N D / (2 c_LA))^{1/(m+1)}.
        responsibility: correctness
      - claim: >-
          T* = Theta((ND)^{2/(m+1)}) and at m=2 this is Theta((ND)^{2/3}).
        responsibility: size
      - claim: >-
          Substituting D = Theta(B) at m=2 removes B from the first term.
        responsibility: correctness
      - claim: >-
          The extension-field instantiation does NOT return a no-go.
        responsibility: scope
      - claim: >-
          The measured total group operations of a complete m=2 solve track
          Theta(N) across the ladder rather than a subexponential shape.
        responsibility: feasibility
      - claim: >-
          No smoothness parameter exists in the m=2 construction, so no L(1/2,c)
          balance can be formed.
        responsibility: strictness

  predictions:
    - metric: >-
        measured total group operations of a complete m=2 Semaev index-calculus
        DLP solve, divided by N, at p in {2^10, 2^12, 2^14, 2^16}
      direction: different
      minimum_effect: >-
        PRE-REGISTERED POINT PREDICTION: the ratio ops/N stays inside a factor 4
        band across the whole ladder (Theta(N) with the sweep charge). The
        competing L(1/2,c) reading requires ops/N to FALL by at least a factor
        3.8 over the same range for any c calibrated at the low end. Recorded in
        advance: a ratio that falls monotonically by more than 4x across the
        ladder falsifies this record's part (B2) and supports KN-FIND-f8c290.
    - metric: >-
        best achievable total operations over a sweep of factor-base sizes B at
        fixed p, with the sweep decomposition charge D = B
      direction: different
      minimum_effect: >-
        PREDICTED FLAT IN B in its first term: the measured relation-collection
        operation count must be independent of B to within a factor 2 across at
        least a 16x range of B, with the total's B-dependence coming only from
        the linear-algebra term. A measured relation-collection cost that FALLS
        with B by more than a factor 2 over a 16x range falsifies the D = B
        charge and, with it, part (B2).
    - metric: >-
        symbolic value of the two-term optimum at m = 2 with D = 1
      direction: different
      minimum_effect: >-
        FORCED EXACT: N^{2/3} for time and N^{1/3} for memory, verified to
        1e-12 numerically at m = 2..12 against the closed form. Any deviation is
        an algebra error and halts the record.
    - metric: >-
        existence of a named smoothness parameter in the m=2 construction whose
        u^{-u} probability could produce an L(1/2,c) balance
      direction: different
      minimum_effect: >-
        PREDICTED: none exists, and the search is a paragraph of prose that
        either exhibits one or does not. Exhibiting one is a complete
        falsification of this record and a repair of KN-FIND-f8c290, and it is
        the cheapest outcome in the whole proposal.
    - metric: >-
        extension-field control: the same accounting instantiated at
        N = q^n, B = q, m = n
      direction: different
      minimum_effect: >-
        FORCED: must NOT return "worse than rho at every n". If it does, the
        accounting is wrong and nothing in this record may be reported.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE, minutes). Instantiate the extension-field
      control first. If the accounting returns a no-go over F_{q^n}, stop and
      report the accounting as broken.
      STAGE 1 (zero compute, minutes). Reproduce KN-FIND-8f2c90's committed
      2RN/B and its 1.5-1.7x gamma interval symbolically. Mismatch halts.
      STAGE 2 (zero compute, one page). Derive the stationarity, emit
      (time exponent, memory exponent) at m = 2..12 for D in {1, B,
      B^{ceil(m/2)}}, verify numerically to 1e-12, and fill the A1-13 frontier
      table rows so the lane finally has a committed dominated_by artifact.
      STAGE 3 (zero compute, one page). The smoothness-parameter search of the
      kill check. Either name the quantity or record that none was found, with
      the search enumerated.
      STAGE 4 (low compute, envelope: pure Python, p <= 2^16, B <= 256, minutes
      per cell, well under 1 GB). Run the complete m=2 index-calculus solve --
      relation collection by the signed-sum sweep, Gaussian elimination mod N,
      target recovery -- at p in {2^10, 2^12, 2^14, 2^16}, 5 seeds each, counting
      GROUP OPERATIONS (not wall clock) as the metric. Each recovered logarithm
      carries a certificate re-verified independently per RQ-ECDLP-001's own
      constraint. Sweep B over a 16x range at each p.
      STAGE 5 (zero compute). Fit and compare against the two pre-registered
      shapes; file the audit finding on KN-FIND-f8c290 as a supersession-by-
      reference proposal for the Coordinator, never as an edit.
      MEMORY DISCIPLINE, STATED BECAUSE THE PROGRAM HAS A LIVE MEMORY WALL: this
      test builds NO Macaulay matrix and NO Groebner basis. Its largest object is
      a hash set of B <= 256 field elements and a B x B matrix over Z/N -- under
      1 MB. It cannot reproduce the GOAL-DREG-001 n=15 D=6 resource_exhaustion
      stop because it never allocates a monomial space at all; and that stop was
      an INFRASTRUCTURE failure under AGENTS.md rule 3, never negative
      mathematical evidence about anything.
    controls:
      - >-
        EXTENSION-FIELD NEARBY-OBJECT GATE (blocking, runs first): the identical
        accounting over F_{q^n} with the subfield base must not produce a no-go.
      - >-
        BASELINE REPRODUCTION against KN-FIND-8f2c90's committed 2RN/B and its
        gamma interval.
      - >-
        MATCHED RANDOM FACTOR BASE at every (p, B) cell. Under KN-FIND-007 the
        measured relation yield must equal 2^2*binom(B+1,2)/N with deviation 0;
        a nonzero deviation means the harvester is not sampling targets uniformly
        and every operation count from that cell is void.
      - >-
        MATCHED POLLARD RHO run on the identical instances, counting group
        operations under the identical convention, and required to land at
        0.886*sqrt(N) within the seed spread. A comparison whose baseline arm
        does not reproduce the textbook constant is not measuring a ratio.
      - >-
        SEED-INDEPENDENCE NULL: the derived exponents are seed-free and must be
        bit-identical across seeds; only the measured counts may vary.
    required_metrics:
      - 'total group operations per complete solve, per (p, B, seed)'
      - 'relation-collection operations and linear-algebra operations, separately'
      - 'measured mean yield per target versus 2^m*binom(B+m-1,m)/N, per cell'
      - 'matched rho group operations on the identical instances'
      - 'symbolic (time exponent, memory exponent) at m = 2..12 for each D model'
      - 'the filled A1-13 frontier table with all constants pinned before use'
      - 'certificate verification pass/fail for every recovered logarithm'
      - 'pass/fail of the extension-field gate and the baseline reproduction'

  falsification_conditions:
    - >-
      The extension-field control returns "worse than rho at every n". The
      accounting is wrong; nothing is reported and the record is withdrawn.
    - >-
      The two-term model fails to reproduce KN-FIND-8f2c90's committed 2RN/B or
      its 1.5-1.7x gamma interval. The counting convention differs; the audit
      cannot be made and the record is withdrawn rather than re-scoped.
    - >-
      A smoothness parameter in the m=2 construction IS exhibited whose u^{-u}
      probability produces an L(1/2,c) balance. This record is wrong,
      KN-FIND-f8c290 is repaired rather than contradicted, and the exhibited
      quantity is a far more valuable object than anything this record proposes.
    - >-
      Measured ops/N falls monotonically by more than 4x across p = 2^10..2^16.
      Part (B2)'s Theta(N) reading is falsified at the tested scale and the
      subexponential reading gains real support.
    - >-
      Measured relation-collection cost falls with B by more than a factor 2 over
      a 16x B range. The D = Theta(B) sweep charge is wrong.
    - >-
      Everything holds. Then RQ-ECDLP-001's decision target has a zero-compute
      answer on the attack axis, KN-FIND-f8c290's complexity label requires a
      superseding correction, and the lane's first dominated_by artifact exists.

  confounders:
    - >-
      OPERATION-COUNTING CONVENTION. A group operation, a field multiplication
      and a hash-set probe are not interchangeable, and the rho baseline and the
      index-calculus arm must be counted under ONE declared convention frozen
      before any cell runs. Counting rho in group operations and index calculus
      in field operations would manufacture a factor of order 10 in either
      direction.
    - >-
      SMALL-p SATURATION. At p = 2^10 with B = 256 the coverage is saturated
      (yield mean far above 1) and the trial count degenerates to 1, which
      flattens the measured curve for a reason that has nothing to do with the
      exponent. Cells must be pre-screened for mean yield in [0.1, 2] and cells
      outside that band excluded BEFORE the run, not explained after.
    - >-
      RANGE. Four points over 6 bits of N cannot separate asymptotic forms in
      general. This is stated as a limit of the measurement arm, which is why the
      load-bearing discriminator in this record is Stage 3 (zero compute) and the
      measurement is an achievability and constant check, not the proof.
    - >-
      MODEL-RELATIVITY. "Dominated within the stated cost model" is not
      domination in fact. The model is known by its own authors not to be tight
      (catalogue A1-2 records fa9839's model missing the recalled extension-field
      exponent by 2/(n(n+1))). This qualifier travels with every quoted row.
    - >-
      AUDIT SCOPE CREEP. KN-FIND-f8c290 also carries an H-PSEUDO-based "empirical
      upper bound" limb. This record audits the LABEL and its achievability
      limb only, and takes no position on H-PSEUDO, which needs its own record.

  interpretation_limits:
    - >-
      NOT AN ECDLP HARDNESS RESULT AND NOT A LOWER BOUND. It bounds one algorithm
      family under one cost model at one arity. Nothing here interacts with the
      generic-group bound (KN-TECH-005): that bounds generic algorithms, this
      bounds a specific non-generic family, and neither implies the other.
    - >-
      SCOPED TO m = 2. At m >= 4 the same identity gives (ND)^{2/(m+1)} below
      N^{1/2} for D small, which is precisely why the interesting arities are the
      ones RQ-ECDLP-001 does not cover. This record must never be quoted as
      closing point-decomposition index calculus.
    - >-
