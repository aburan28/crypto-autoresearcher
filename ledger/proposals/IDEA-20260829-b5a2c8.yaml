idea:
  id: IDEA-20260829-b5a2c8
  question_id: RQ-ECDLP-001
  added: '2026-08-29'
  title: >-
    THE m=2 EXPONENT FLOOR, DERIVED FROM THIS PROGRAM'S OWN COMMITTED
    ARITHMETIC: prime-field Semaev S_3 index calculus costs Theta(N) as it is
    actually built and Omega(N^{2/3}) even with a decomposition oracle that is
    free, so no choice of factor-base size and no improvement to the S_3 solve
    can reach Pollard rho at m=2 -- and the subexponential complexity label
    Theta(exp(c*sqrt(log N log log N))) carried by the committed finding
    KN-FIND-f8c290 is contradicted by the committed arithmetic of KN-FIND-007
    and KN-FIND-8f2c90
  class: mechanism

  claim: >-
    (A) THE ACCOUNTING. Let G have prime order N, let the factor base have size
    B, let D be the cost in group operations of one m-decomposition attempt
    against one target, and let c_LA*B^2 be the linear-algebra charge. Using the
    exact conservation mean of KN-FIND-007 (mean per-target yield =
    binom(B+m-1,m)/N for EVERY base of size B) with the signed-multiset factor
    2^m of catalogue entry A1-7, the two-term total is
    T(B) = m! N D / (2^m B^{m-1}) + c_LA B^2, minimised at
    B* = Theta((N D)^{1/(m+1)}) with T* = Theta((N D)^{2/(m+1)}) and memory
    Theta(B*).
    (B) THE m=2 SPECIALISATION, WHICH IS THE WHOLE OF RQ-ECDLP-001. At m = 2 the
    first term is Theta(N D / B) and the exponent identity reads
    T* = Theta((N D)^{2/3}), memory Theta((N D)^{1/3}). Two numbers follow and
    both are stated as falsifiable predictions.
    (B1) FREE-ORACLE FLOOR. Even with D = Theta(1) -- a decomposition oracle
    that answers in polylog time, which nothing in this program possesses --
    T = Omega(N^{2/3}) at memory Omega(N^{1/3}). Against Pollard rho at
    0.886*sqrt(N) time and O(1) memory this is Pareto-dominated on BOTH axes,
    by a factor N^{1/6} in time (2^{42.7} at N = 2^256).
    (B2) AS ACTUALLY BUILT. The achievable m=2 decomposition cost is
    D = Theta(B) -- the signed-sum sweep over the factor base, which is the
    per-trial charge KN-FIND-8f2c90 already commits to in its own proof sketch
    ("Standard: B x (R/(B^2/(2N))) = 2RN/B"). Substituting D = Theta(B) makes
    the first term Theta(N), INDEPENDENT OF B, so T = Theta(N) + c_LA B^2 and
    the optimum is B as small as the linear algebra permits: total Theta(N),
    i.e. N^{1/2} WORSE than rho.
    (C) THE CONTRADICTION, AND IT IS INTERNAL AND CHECKABLE WITHOUT COMPUTE.
    KN-FIND-f8c290 (committed, confidence preliminary_empirical, evidence_level
    toy_demonstration) states that "The Semaev m=2 index calculus complexity
    exp(c*sqrt(log N * log log N)) is ACHIEVABLE at toy scale" and concludes
    that the prime-field Semaev complexity "is Theta(exp(c*sqrt(log N log log
    N)))" with "both achievability and an empirical upper bound confirmed". A
    subexponential L(1/2,c) form is o(N^eps) for every eps > 0. It is therefore
    inconsistent with (B1) for every constant c, and its own cited pipeline
    charge in the sibling finding KN-FIND-8f2c90 yields (B2). The evidence
    supporting the label is one complete solve at p = 1009, which fixes one
    point and cannot distinguish any complexity form whatsoever.
    (D) WHAT THIS DECIDES FOR RQ-ECDLP-001. The question's decision target is
    whether the toy S_3 measurement justifies a medium-scale scaling study. On
    the ATTACK axis the answer is available with zero compute and is negative
    and unconditional within the stated cost model: no S_3 (m=2) configuration
    at any B and any D reaches rho. Any defensible expansion is therefore
    instrument-building or model-building for m >= 4, where (N D)^{2/(m+1)}
    first drops below N^{1/2}, and the expansion must be justified on that
    ground and not on an attack ground.

  mechanism: >-
    THE TRACKED OBJECT AND ITS LOSSY-PROJECTION STATUS. The object followed is
    the two-term cost functional T(B) = (relation charge) + (linear-algebra
    charge) as a function of factor-base size, together with the pair
    (time exponent, memory exponent) it projects to. This is a genuinely lossy
    projection of the algorithm: it discards the curve, the field, the
    factor-base geometry, the monomial order and the solver entirely, retaining
    two rational numbers. It is lossy COMPATIBLY because the two discarded
    families cannot re-enter: KN-FIND-007 proves that factor-base geometry
    cannot move the mean yield at matched size (so the relation charge is
    geometry-invariant by a double count, not by assumption), and the
    linear-algebra charge is a function of B alone. What is retained therefore
    propagates deterministically under a change of geometry, which is exactly
    the compatibility the inventor protocol section 2 demands. Contrast the
    projection that FAILS the test and is not used here: the raw decomposition
    tuple (P_1, ..., P_m), which discards nothing.
    WHY THE ARITHMETIC IS FORCED AND NOT A MODELLING CHOICE. Three inputs, each
    already committed in this repository and each independently checkable.
    (i) The yield is an identity, not an estimate: every size-m multiset from
    the base sums to exactly one target, so the mean is binom(B+m-1,m)/N
    (KN-FIND-007, measured deviation exactly 0 over 144 cells). (ii) The signed
    base doubles per summand and multiplies supply by 2^m at unchanged unknown
    count (catalogue A1-7); this is a constant at fixed m and moves no exponent,
    and is included only so the constants are honest. (iii) The linear-algebra
    charge c_LA*B^2 is forced for Krylov methods because the iteration count is
    at least the rank B-1 and each matrix-vector product costs Theta(mB)
    (catalogue A1-9); the only escape, sublinear separators in the relation
    hypergraph, is an open question that this record parameterises rather than
    assumes.
    WHY AN L(1/2,c) FORM CANNOT ARISE AT FIXED ARITY, STATED AS THE KILL CHECK.
    Every L(1/2,c) complexity in computational number theory is produced by
    optimising a SMOOTHNESS probability against a factor-base size, where the
    probability u^{-u} with u = log X / log B is superpolynomially small yet
    subexponential. The m=2 point-decomposition construction contains no
    smoothness parameter, no size order on group elements, and no multiplicative
    hierarchy (catalogue A1-1 records the same absence as the obstruction to a
    large-prime stage). Its success probability is the ALGEBRAIC mean B^2/(2N),
    a fixed power of B. A fixed power cannot produce a subexponential balance.
    The single cheapest falsifier of this record is therefore constructive and
    costs nothing: NAME the quantity in the m=2 construction whose smoothness
    probability produces the L-form. If such a quantity is exhibited, this
    record is wrong and KN-FIND-f8c290 is right.

  novelty_status: unverified

  citations:
    - ref: KN-FIND-007
      provenance: internal
      claim: >-
        Mean per-target decomposition yield equals binom(B+m-1,m)/N exactly for
        every factor base of size B, independent of geometry; measured maximum
        absolute deviation from the closed form was exactly 0 over 144 cells at
        N ~ 2^14/2^16/2^18, m = 3; coverage <= min(1, mean); the record states
        in its own words that it "says nothing about the cost of finding a
        decomposition ... which is where the index-calculus cost actually sits".
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        knowledge/findings/KN-FIND-007.md, all 96 lines including the
        "What this does not say" and "Provenance" sections.
    - ref: KN-FIND-8f2c90
      provenance: internal
      claim: >-
        Its committed proof sketch charges the m=2 per-trial decomposition cost
        as B check operations and computes total check operations as
        "B x (R/(B^2/(2N))) = 2RN/B"; with R = B relations this is exactly
        Theta(N), which is the arithmetic this record's part (B2) reads off.
        The record's own headline is a 1.5-1.7x CONSTANT speedup from the BKK
        mixed volume B/2 and it says explicitly "Not exponent-moving".
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        knowledge/findings/KN-FIND-8f2c90.md, all 43 lines.
    - ref: KN-FIND-f8c290
      provenance: internal
