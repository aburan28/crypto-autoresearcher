  heuristic_assumptions:
    - id: H1
      statement: >-
        For a factor base V of size B drawn uniformly from the x-coordinates of
        E(F_p) and a target R uniform in the group, the number of m=2
        decompositions of R over V is distributed as Binomial(2B, 2B/|X|) up to
        o(1), where X is the set of x-coordinates of rational points,
        |X| = (p - t - r)/2 with t the trace and r the number of roots of f in
        F_p. In particular the mean is 2^2*binom(B+1,2)/N + O(B*sqrt(p)/p), and
        the trial count 1/mean is concentrated within a constant factor.
      rigorous_support: >-
        The MEAN is not a heuristic at all: it is the exact double count of
        KN-FIND-007, which holds for every base of every geometry with deviation
        measured at exactly 0 over 144 cells. The rigorous structural ingredient
        behind the fibre count is the classical m=3 discriminant identity
        disc_T S_3 = 16 f(x1) f(x2), verified exactly in Z[x1,x2,A,B] by
        EXP-SMON-e5cbe6 (KN-FIND-a8990a), which forces the fibre over any
        factor-base element to be totally split, so every v contributes EXACTLY
        two candidate partners x(R + P_v) and x(R - P_v). What is assumed is only
        that those 2B algebraically determined values behave like uniform draws
        from X with respect to membership in V -- the classical
        independent-uniform imitation, the same move the extension-field 1/n!
        decomposition probability makes and which KN-FIND-007 records as being
        exactly this conservation mean.
      validation_plan: >-
        SAMPLE: at p in {2^10, 2^12, 2^14, 2^16}, over 12 generated curves and
        the complete target set of the group (exhaustive, not sampled, at
        p <= 2^14), record the empirical distribution of the decomposition count
        c_V(R). COMPARISON DISTRIBUTION: Binomial(2B, 2B/|X|), with |X| computed
        exactly from the curve order rather than approximated by p/2. TAIL
        CHECK: the maximum observed c_V(R) against the Binomial upper tail at the
        same B, and the count of targets with c_V(R) = 0 against exp(-mean),
        which is the coverage figure KN-FIND-007 bounds by min(1, mean).
        TRANSFER: none is claimed beyond p <= 2^16; the exponent statements are
        derivations under the cost model and are not validated at cryptographic
        scale by this or any part of this proposal.
    - id: H2
      statement: >-
        Rerandomisation R_j = [a_j]P + [b_j]Q produces targets that are
        indistinguishable from uniform in the group, so successive trials are
        independent for the purpose of the trial-count accounting, and a failed
        trial costs exactly one trial with no carry-over.
      rigorous_support: >-
        At prime order the map (a, b) -> [a]P + [b]Q is a surjective group
        homomorphism from (Z/N)^2 onto the group with uniform fibres, so
        uniformity of the target is exact, not heuristic. What is heuristic is
        only INDEPENDENCE across trials at fixed factor base -- successive
        targets share one V, so the events are not independent. Catalogue A1-3
        argues on the same ground that no separate descent stage exists at prime
        order.
      validation_plan: >-
        SAMPLE: the full trial sequence of every Stage 4 cell. COMPARISON: the
        empirical distribution of trials-to-first-relation against
        Geometric(mean) with the KN-FIND-007 mean, by Kolmogorov-Smirnov at the
        1% level, plus the empirical variance of the total trial count against
        the independent prediction. TAIL CHECK: the 99th percentile trial count
        against the geometric tail. Over-dispersion beyond a factor 2 in variance
        would mean the shared factor base induces correlation strong enough to
        move the constant and must be reported with every operation count.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AS AN IMPROVEMENT; the record's product is a
      FLOOR in the opposite direction. Stated exactly: at m = 2, within the
      two-term model, T = Theta(N^{2/3}) with a free decomposition oracle
      (D = Theta(1)) and T = Theta(N) with the achievable signed-sum sweep
      (D = Theta(B)). General arity: T = Theta((m! N D / 2^m)^{2/(m+1)}).
    memory_exponent: >-
      Theta(B*) = Theta((N D)^{1/(m+1)}), i.e. N^{1/3} at m = 2 with D = 1. The
      memory is the factor base plus the relation matrix and cannot be traded
      below B, because the linear algebra requires rank B-1. This is the axis on
      which the family is dominated even where the time axis is arguable.
    best_known: >-
      Pollard rho at 0.886*sqrt(N) group operations with O(1) memory
      (KN-TECH-001, KN-TECH-006); BSGS at N^{1/2} time and N^{1/2} memory
      (KN-TECH-031); van Oorschot-Wiener golden collision at sqrt(A^3/w) time
      with memory w. For the prime-field decomposition family specifically, the
      standing corpus positions are KN-FIND-007 (yield conservation),
      KN-FIND-8f2c90 (a 1.5-1.7x constant from BKK) and KN-FIND-f8c290 (the
      subexponential label this record contradicts).
    hidden_overhead: >-
      DISCLOSED IN FULL. (i) The coupon-collector factor ln B / m on relations
      needed (A1-8) is omitted; it multiplies the first term and its omission is
      favourable to the index-calculus arm, i.e. the SAFE direction for a
      negative reading and the UNSAFE direction for any positive reading -- so no
      positive reading may be taken from this record. (ii) c_LA and c_rho are
      constants that this record pins but does not derive. (iii) The 2^m signed
      factor is a constant at fixed m and is included only for constant honesty;
      per KN-FIND-c41ea9's scope note a per-fibre factor of 2 compounding with
      growing m is NOT a constant, and that case is out of scope here.
      (iv) "Within the two-term model" is the whole of the hidden overhead: the
      model is not tight and its authors record it as not tight.
    tradeoff_note: >-
      The m=2 family sits at (time N^{2/3}, memory N^{1/3}) at best and cannot be
      traded onto rho's (N^{1/2}, O(1)) point: reducing memory below B destroys
      the linear algebra, and the vOW golden-collision interpolation applies to
      the MITM family (catalogue A1-2, giving sqrt(A^3/w) with
      A = B^{ceil(m/2)}), not to the linear-algebra stage. Parallelisation:
      relation collection is embarrassingly parallel with linear speedup; the
      linear-algebra stage is Krylov-bound and parallelises as a sparse
      matrix-vector product, so the Amdahl serial fraction sits in the
      elimination and the total speedup is capped by it. None of this moves the
      exponent.

  dominated_by: >-
    CHECKED ROW BY ROW AGAINST EVERY FRONTIER ENTRY ENUMERATED IN CATALOGUE
    A1-13, WHICH IS THIS LANE'S FULL LIST. As an ATTACK: this record mounts none,
    so it is dominated by every row on every axis -- rho (N^{1/2}, O(1)),
